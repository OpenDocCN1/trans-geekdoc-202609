- "# PHP 编程最佳实践\n\n\n\n\n\n\n\n> 如果您想提交任何错误或建议，请访问 [`erratas.casadocodigo.com.br`](http://erratas.casadocodigo.com.br)。\n\
  \n# 致谢\n\n首先，感谢上帝在我那些认为自己无法克服生活中的某些困难的艰难时刻赐予我力量。感谢我的妻子，她从这部作品的开始到结束一直对我给予极大的鼓励。我还要感谢我的父母，他们为我提供了所能提供的最好的东西，并付出一切让我接受了良好的教育，并能够在人生的攀登中不断进步。\n\
  \n最后，感谢这些年来与我合作的所有所有人，他们为知识交流以及学习新技术和新概念提供了极大的帮助。\n\n# 关于作者\n\n我叫 Jhones dos Santos\
  \ Clementino，从 17 岁起就对编程充满热情，当时我发现软件、游戏和网站都是通过某种编程语言开发的——这一发现改变了我的生活。我开始越来越对这些主题感兴趣，因为我觉得一段代码能够实现像游戏这样有用且有趣的功能，简直太不可思议了。太迷人了！\n\
  \n我毕业于圣保罗大学（UNIP）的计算机科学专业，自 2009 年首次接触到 `PHP` 以来，一直从事 Web 系统开发工作。从那时起，我一直致力于通过在线课程、教程、书籍和讲义来学习更多知识。我的重点一直是\
  \ Web，因为这些是处于不断演进的技术。\n\n\n当我有空闲时，我喜欢做一些能让我暂时从虚拟世界中转移注意力的事情，所以我喜欢和我的妻子出去逛逛、画画甚至唱歌（这个留到以后再说吧，好吗？哈哈）。好了，我的朋友，这就是关于我的简单介绍。\n\
  \n# 前言\n\n如今，可用应用程序的数量多得惊人，就像应用程序的数量一样，代码量也是如此。\n\n但是，这些代码写得好吗？任何开发者都能毫无困难地进行维护吗？这些问题的答案在很大程度上取决于开发团队，很大程度上取决于每种编程语言的规则。\n\
  \n世界上并没有一种方法可以标准化开发人员应该如何思考，以便代码在逻辑和格式规则上都能以标准化的方式编写。\n\n在 `PHP` 中也不例外，你只需要处理过某个现有的遗留应用程序就知道了。\n\
  \n如果你曾花费几个小时甚至几天时间试图理解那些不可能完成的事情，那么你就知道维护有多困难了。事实是，直到不久之前，`PHP` 还没有专注于定义标准的群体。幸运的是，2009\
  \ 年出现了一个幸运的群体，叫做 **PHP-FIG**。\n\n\n\n\n\n此 PSR 旨在定义一些标准的编码元素，这些元素应确保 PHP 代码之间更高水平的互操作性。\n\
  \n> **什么是互操作性？**\n\n> 互操作性是指系统或应用程序与其他系统或应用程序进行高效通信的能力，从而实现更高水平的数据完整性。\n\n确保您的应用程序具有互操作性，可以带来更高的数据完整性；此外，当您的应用程序需要与其他应用程序通信时，它将变得更加高效。\n\
  \n而那些缺乏高水平互操作性的应用程序，往往在与其他通信时会遇到困难。在企业环境中，这可能导致严重的后果，例如为了满足公司需求而重构应用程序，甚至开始创建一个更高效的全新应用程序。\n\
  \n因此，如果应用程序是互操作的，那么当您需要与其他系统进行通信时，将不会感到烦恼。\n\n## 2.1 规则\n\n请在本节中查看此 PSR 的所有规则和特性。\n\
  \n### 规则 1\n\nPHP 文件**必须**仅使用 `<?php` 和 `<?=` 标签。这意味着不应使用任何其他类型的标签，例如 ASP 标签 `(<)`\
  \ 或 PHP 脚本标签。在许多服务器中，默认情况下禁用了*短开启标签*（short open tags），这可能会导致很多麻烦，因此按照惯例，请仅使用 `<?php`\
  \ 或 `<?=` 标签。\n\n### 规则 2\n\nPHP 文件**必须**仅使用不带 BOM（字节顺序标记）的 UTF-8。你知道当你打开一个没有使用该标准的文件时，里面会出现很多奇怪的代码吗？没错，这是因为该文件可能使用了带有\
  \ BOM 的编码，例如：`ISO-8859-1` 或带有 BOM 的 `UTF-8`。\n\n已规定要遵循和使用的标准是不带 BOM 的 UTF-8，这样编码不兼容的问题就随之解决了。需要注意的是，大多数\
  \ IDE 已经配置为不带 BOM 的 UTF-8 标准。\n\n### 规则 3\n\nPHP 文件**应该**声明（类、方法、常量、属性等）或产生侧效应（生成输出、对\
  \ `php.ini` 进行修改等），但**不应该**同时做这两件事。\n\n想象一个 PHP 文件，它既有类的声明，又包含更改 `php.ini` 配置的代码段，并且还在屏幕上显示内容。你已经知道那会是多么混乱：杂乱无章，将责任混合在真正的定义模糊的逻辑汤中。这导致在修复和分离职责时需要大量时间。\n\
  \n如果你的文件是类或接口的声明文件，请遵守遵守。只做这一件事，不要在类声明之前或类声明之后显示内容或更改 `php.ini` 配置。为了实现这一点，请创建一个专门负责这些任务的文件，好吗？\n\
  \n请看下面的示例，以更好地理解一个同时执行了这两件事的文件，这种情况是**必须**被避免的：\n\n```php\n<?php\n// 修改 php.ini\
  \ 配置\nini_set('error_reporting', E_ALL);\n\n// 引入外部文件\ninclude \"arquivo.php\";\n\
  \n// 在屏幕上输出\necho \"<html>\\n\";\n\n// 声明一个类\nclass Usuario\n{\n}\n```\n\n如你所看到的，这种类型的例子——坦率地说——比你想象的要常见得多。你只需要处理任何类型的\
  \ PHP 遗留系统，就会遇到这类“幽灵”。所以，请记住：避免在同一个文件中像上述示例那样将声明和输出混合。\n\n现在我们将看到一个正确的示例，一个只包含声明的文件：\n\
  \n```php\n<?php\n// 声明一个类\nclass Usuario\n{\n    private $nome;\n\n    public function\
  \ setNome($nome)\n    {\n        $this->nome = $nome;\n    }\n}\n```\n\n注意，在这个示例中，声明文件中没有任何输出生成。它仅执行了类、方法和属性的声明，仅此而已。\n\
  \n### 规则 4\n\n命名空间（Namespaces）和类**必须**遵循 PSR-0（已弃）和 PSR-4（PSR-0 的替代者）中描述的标准。为了获得理解且高效的自动加载（autoloading），必须在文件声明中遵循与命名相同的目录结构。\n\
  \n> **什么是自动加载（Autoloading）？**\n\n> 它是一种自动加载类、接口、trait 等文件的方法，而无需开发者在代码中显式地链接这些文件。\n\
  \n当以正确的方式（即本 PSR 规定的方式）执行时，文件的自动加载被认为是易理解且高效的。\n\n为了更好地理解，让我们来看下面的示例：\n\n```text\n\
  |-src\n  |-App\n    |-Controller\n      |-HomeController.php\n```\n\n注意，我们有一个非常简单的目录结构。使用命名空间后，示例将如下：\n\
  \n```php\n<?php\nnamespace App\\Controller;\n\nclass HomeController\n{\n}\n```\n\
  \n我们有一个类 `HomeController`，它位于 `App` 目录中，因此位于 `Controller` 子目录下，所以，该类的命名空间是 `App\\\
  Controller`。这并不是很难做的事。\n\n### 规则 5\n\n类、接口和 trait 的文件名**必须**遵循 `StudlyCaps` 标准。这意味着每个单词的第一个字母应该大大写，如\
  \ `HomeController` 所示。\n\n### 规则 6\n\n常量**必须**使用全大写字母，并用下划线（_`）分隔。不要使用小写字母、`camelCase`\
  \ 或 `snake_case` 来声明常量。允许的方法是使用所有大写字母。\n\n为了方便理解，让我们来看下面关于正确声明方式的示例：\n\n```php\n\
  <?php\nconst LOG_CRITICAL = 'critical';\n```\n\n没什么特别的，不是吗？那么错误的方法呢？查看后续：\n\n```php\n\
  <?php\nconst logial = 'critical';\nconst log_info = 'info';\n```\n\n最后的示例展示了声明常量的一种错误方式。\n\
  \n### 规则 7\n\n定义的属性**应当**在合理的范围内一致地应用，可以是包级、供应商级、类级或方法级。无论使用哪种命名约定（`$StudlyCaps`、`$camelCase`、`$snake_case`），只要遵守之前的规则。\n\
  \n### 规则 8\n\n方法名**必须**按照 `camelCase` 命名约定进行声明。这条规则也并不复杂，只需注意按照此格式编写方法名。为了方便理解，让我们来看下面定义方法名的正确方式示例：\n\
  \n```php\n<?php\n\npublic function getNomeUsuario()\n{\n}\n```\n\n注意，方法名是以 `camelCase`\
  \ 命名约定定义的。现在我们来看声明方法名的几种错误方式：\n\n```php\n<?php\n\n// snake_case 声明\npublic function\
  \ get_nome_usuario()\n{\n}\n\n// StudlyCaps 声明\npublic function GetNomeUsuario()\n\
  {\n}\n```\n\n### 结论\n\n\n\n\n我们到达了 PSR-1 的最后，它向我们展示了一些必须遵循的规则，以便我们的代码更具可读性并符合开发规范。这不是一个复杂的\
  \ PSR，但值得关注它的规则，以便你能够在代码中更准确、更高效地应用它们。\n\n在接下来的章节中，我们将讨论 PSR-2，它涉及源代码的可读性规则，所以，让我们开始吧！\n\
  \n\n## PSR-2 (编码风格指南) - 第一部分\n\n你是否厌倦了看着代码时必须花时间进行缩进，并将所有内容放在它们应在的位置以提高理解？有了这个 PSR，你的问题就可以结束了。PSR-2\
  \ 的出现是为了让开发者的代码编写和可读性变得更加简单快捷。\n\n在接下来的节中，我们将看到具体的规则、概念以及如何将它们应用到你的项目中，以获得更美、更易读的代码。\n\
  \n> **重要信息**\n> 由于 PHP 中不断出现新功能，PSR-2 已经被**废弃**；但不用担心，替代者是 **PSR-12**，我们将在本书的后续部分介绍它。你可以继续阅读\
  \ **PSR-2**，因为其中的许多内容在 **PSR-12** 中被重用或扩展了，你可以了解它们之间的差异以及针对 PHP 7 的特定特性。\n\n###\
  \ 3.1 规则\n\n在本节中查看此 PSR 的一些规则和特征。\n\n### 规则 1\n\nPHP 代码**必须**遵循 PSR-1 (`Basic Code\
  \ Standard`) 中建立的标准。由于它是 PSR-1 的扩展，显然在应用 PSR-2 之前，必须遵循其中呈现的标准。\n\n### 规则 2\n\nPHP\
  \ 文件**必须**采用 UNIX 行结束符标准。你知道可用的行结束有哪些吗？如果不知道，请看下方：\n\n- **CRLF**: 回车+换行，Unicode\
  \ 字符 `D` + `000A` `000`\n- **LF**: 换行，Unicode 字符 `000A`\n- **NEL**: 下一行，Unicode\
  \ 字符 `0085`\n- **LS**: 行分隔符，Unicode 字符 `2028`\n- **PS**: 段落分隔符，Unicode 字符 `2029`\n\
  \nPSR-2 采用的 UNIX 标准是 `LF`。通常 IDE 已经配置为 UNIX 标准，但可以根据所选的 IDE 轻松进行更改。\n\n### 规则 3\n\
  \nPHP 代码**必须**使用 4 个空格缩进，而不是 TAB。这不是一个复杂的规则，只需注意并避免使用 TAB 的习惯即可。某些 IDE 已经配置为按下 TAB\
  \ 键产生 4 个空格，但值得检查一下，以确保你的代码不违反 PSR-2 规范。这可以很不费力地配置。\n\n### 规则 4\n\n仅包含 PHP 的文件**必须**省略结束标签。这起初看起来可能很奇怪，但确实，如果省略了结束标签\
  \ (`?>`)，你的 PHP 脚本也不会停止运行。该规则不适用于包含 HTML + PHP 文件。为了方便理解，我们来看下面的示例，它展示了应用此规则的正确方法：\n\
  \n```php\n<?php\nclass Usuario\n{\n    private $nome;\n\n    public function __construct($nome)\n\
  \    {\n        $this->nome = $nome;\n    }\n}\n```\n\n注意，结束标签 (`?>`) 被省略了，这不会影响代码的运行。现在我们分析一个省略标签会导致代码错误的示例：\n\
  \n```php\n<?php\n$nome = 'Jhones S. Clementino';\n\n<html>\n    <head>\n       \
  \ <title>Teste</title>\n    </head>\n    <body>\n        <h1>Olá, <?php echo $nome</</span>!</h1>\n\
  \    </body>\n</html>\n```\n\n与之前的示例不同，如果从变量 `$nome` 声明之后没有结束标签，那么省略 PHP 结束标签 (`?>`)\
  \ 将导致错误。这是因为该文件并不仅仅包含 PHP 代码。\n\n### 规则 5\n\n仅包含 PHP 代码的文件**必须**在末尾留有一个空行。在应用了所有逻辑后，应该存在一个空行。\n\
  \n### 规则 6\n\n代码行的最大长度**必须**为 120 个字符。自动样式检查器**必须**发出警告，但**不应**显示错误。\n\n代码行**不应**超过\
  \ 80 个字符。超过 80 个字符的代码行**必须**折分到后续的最多 80 个字符的行中。\n\n这个解释听起来很奇怪，但非常有道理。在遗留系统中，经常有长度超过\
  \ 1000 个字符的——相信我，这不是夸张！我工作过这类系统，维护这类代码非常困难。\n\n因此，请注意每 80 个字符就进行换行以保持其可读性；如果无法做到，你还有\
  \ 120 个字符的限制。\n\n这不是一个错误，但如果你想遵循 PSR-2 标准并保持你的良好实践，那么注意这一额外规则是非常重要的，好吗？\n\n### 规则\
  \ 7\n\n包含内容的行**不应**在内容末尾留有空格。\n\n```php\n\n```\n\n```\n\n### 规则 8\n\n为了方便解释代码，**可以**添加空行。你可以添加空行来使代码的解释更易理解。我们来看来看该规则应用的简短示例：\n\
  \n```php\n<?php\n\nclass Usuario \n{\n    private $nome;\n\n     private $idade;\n\
  \n     private $sexo;\n\n    public function __construct($nome, $idade, $sexo)\n\
  \    {\n          $this->nome = $nome;\n         $this->idade = $idade;        \
  \ \n\n         if ($sexo == 'M') {\n            $this->sexo = 'Masculino';\n   \
  \     } elseif ($sexo == 'F') {\n            $this->sexo = 'Feminino';\n       \
  \ }\n    }\n}\n```\n\n看应用了换行后代码变得变得多易读。现在看下面这个没有换行的示例：\n\n```php\n<?php\n\nclass\
  \ Usuario \n{\n    private $nome;\n\n     private $idade;\n\n     private $sexo;\n\
  \n    public function __construct($nome, $idade, $sexo)\n    {\n          $this->nome\
  \ = $nome;\n         $this->idade = $idade;         \n\n         if ($sexo == 'M')\
  \ {\n            $this->sexo = 'Masculino';\n        } elseif ($sexo == 'F') {\n\
  \            $this->sexo = 'Feminino';\n        }\n    }\n}\n```\n\n### 规则 9\n\n\
  **不应**在同一行内有多个声明。每个变量声明都应该在新的一行中。定义了一个变量？那么跳到行定义下一个变量。\n\n```php\n<?php\n$nome =\
  \ 'Jhones';\n$sobrenome = 'S. Clementino';\n```\n\n### 规则 10\n\n关键字和常量 `true`、`false`\
  \ 以及 `null` **必须**用小写字母。\n\n### 规则 11\n\n在定义 namespace 之后，**必须**有一个空行。当你定义一个 namespace\
  \ 时，在继续编写代码之前应该有一个空行。\n\n```php\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass\
  \ Usuario\n{\n    //代码\n}\n```\n\n\n\n在这个示例中，在 `namespace` 定义之后没有添加空行，这在 PSR-2 中被认为是不规范的。因此，在继续编写代码之前，请务必留出一个空行。\n\
  \n### 规则 12\n\n所有现有的 `use` 声明**必须**置于 `namespace` 之后。有时我们需要导入包含在另一个类中的代码，为了将其引入到我们的类中，我们需要使用\
  \ `use` 声明。\n\n为了更好地理解，让我们来看符合 PSR-2 标准的正确示例：\n\n```php\n<?php\n\nnamespace App\\\
  Controller\\Usuario;\n\nuse App\\Controller\\AbstractController;\n\nclass UsuarioController\
  \ extends AbstractController\n{\n    //Código\n}\n```\n\n请注意，在 `namespace` 声明之后，我将\
  \ `AbstractController` 控制器导入到我的类中。`use` 声明位于类 `namespace` 定义之下。现在我们来分析一个 `use` 声明错误的示例：\n\
  \n```php\n<?php\n\nuse App\\Controller;\n\nnamespace App\\Controller\\Usuario;\n\
  \nclass UsuarioController extends AbstractController\n{\n    //Código\n}\n```\n\n\
  这段代码是不正确的，也没有遵循 PSR-2 建立的标准，因为所有的 `use` 声明必须位于 `namespace` 定义之后。\n\n### 规则 13\n\n\
  每个声明**只能**存在一个 `use`。每个 `use` 都应该有一个独立的声明。让我们通过一个简化解释的示例来展示正确的方法：\n\n```php\n<?php\n\
  \nnamespace App\\Service\\Usuario;\n\nuse App\\Service\\AbstractService;\nuse App\\\
  Entity\\Usuario;\n\nclass UsuarioService extends AbstractService\n{\n    //Código\n\
  }\n```\n\n如所见，每个声明在每一行都使用了一个 `use`。只需在使用 `use` 时注意这一点即可。现在我们来看一个 `use` 使用错误的示例：\n\
  \n```php\n<?php\n\nnamespace App\\Service\\Usuario;\n\nuse App\\Service\\AbstractService,\
  \ App\\Entity\\Usuario;\n\nclass UsuarioService extends AbstractService\n{\n   \
  \ //Código\n}\n```\n\n在单行 `use` 声明中使用多个声明并不是错误，因此这段代码可以运行。然而，你的代码将不再符合 PSR-2 标准。\n\
  \n### 规则 14\n\n`extends` 和 `implements` 关键字**必须**声明在与类名相同的同一行中。当需要扩展一个类和/或实现一个接口时，两者都必须与类名处于同一行内，因为它们也是类定义的一部分。\n\
  \n让我们来看下面的示例，它展示了这种正确的方法：\n\n```php\n<?php\n\nnamespace App\\Service\\Usuario;\n\
  \nuse App\\Service\\ServiceInterface;\nuse App\\Service\\AbstractService;\n\nclass\
  \ UsuarioService extends AbstractService implements ServiceInterface\n{\n    //Código\n\
  }\n```\n\n到此为止没什么特别。如前所述，`extends` 和 `implements` 是类定义的一部分，因此它们应该在同一行。现在我们来分析一个错误的示例：\n\
  \n```php\n<?php\n\nnamespace App\\Service\\Usuario;\n\nuse App\\Service\\ServiceInterface;\n\
  use App\\Service\\AbstractService;\n\nclass UsuarioService\nextends AbstractService\
  \ \nimplements ServiceInterface\n{\n    //Código\n}\n```\n\n### 规则 15\n\n当需要扩展一个类和/或实现一个接口时，两者都必须在与类名相同的同一行内，因为它们也是类定义的一部分。当需要扩展一个类和/或实现一个接口时，两者都必须与类名处于同一行内，因为它们也是类定义的一部分。当需要扩展一个类和/或实现一个接口时，两者都必须与类名处于同一行内，因为它们也是类定义的一部分。\n\
  \n当需要扩展一个类和//实现一个接口时，两者都必须处于在同一行 o 名字 nome 类,, pois，部分 da da...... h a a est, est,,,,,,,,,,,,,,,,,,,,,,,,,..,...,.,..,,.,...........,.,,\
  \ a a a a2:\n\n```:\n<?php\n\nnamespace App\\Service\\Usuario;\n\nuse App\\Service\\\
  ServiceInterface;\nuse App\\Service\\AbstractService;\n\nclass UsuarioService\n\
  extends AbstractService \nimplements ServiceInterface\n{\n    //Código\n}\n```\n\
  \n### 规则 16\n\n`extends` 和 `implements` 关键字**必须**声明在与类名相同的同一行中。当需要扩展一个类和/或实现一个接口时，两者都必须与类名处于同一行内，因为它们也是类定义的一部分。\n\
  \n```php\n<?php\n\nnamespace App\\Service\\Usuario;\n\nuse App\\Service\\ServiceInterface;\n\
  use App\\Service\\AbstractService;\n\nclass UsuarioService\nextends AbstractService\
  \ \nimplements ServiceInterface\n{\n    //Código\n}\n```\n\n### 规则 17\n\n`var` 关键字**不应**用于属性定义。\n\
  \n### 规则 18\n\n每个声明**不应**有多个属性。 houver a, a, a2:\n\n```php\n<?php\n\nnamespace App\\\
  Entity\\Usuario;\n\nclass Usuario\n{\n    private $nome;\n    private $idade;\n\
  \    public $etnia;\n    protected $dataNascimento\n}\n```\n\n### 规则 19\n\n属性名称**不应**以\
  \ `_`（下划线）开头来表示 `private` 或 `protected` 可见性。\n\n\n\n\n所有方法**都必须**定义可见性。记住，可见性会让封装更加清晰。为了方便起见，让我们来看下面的示例：\n\
  \n```php\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private\
  \ $nome;\n\n    public function getNome()\n    {\n        return $this->nome;\n\
  \    }\n\n    public function setNome($nome)\n    {\n        $this->nome = $nome;\n\
  \    }\n}\n```\n\n注意，`getNome()` 和 `setNome($nome)` 方法定义了访问修饰符 `public`，表示它们具有公共可见性。\n\
  \n可见性的类型取决于你需要向应用程序的其他部分暴露或不暴露的内容。\n\n现在我们来分析一个认为错误且不符合 PSR-2 标准的示例：\n\n```php\n\
  <?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private $nome;\n\
  \n    function getNome()\n    {\n        return $this->nome;\n    }\n\n    function\
  \ setNome($nome)\n    {\n        $this->nome = $nome;\n    }\n}\n```\n\n需要强调的是，示例代码可以运行，但并不符合\
  \ PSR-2 的规则。\n\n### 规则 21\n\n`下划线` (`_`）**不应该**被用于指示方法的 `private` 或 `protected`\
  \ 可见性。这条规则与类属性定义的规则类似。因此，不要使用`下划线`来指示方法的可见性。\n\n为了说明这一点，我们来看下面的示例，它展示了定义方法的正确方式：\n\
  \n```php\n<?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private\
  \ $nome;\n\n    private function getNome()\n    {\n        return $this->nome;\n\
  \    }\n\n    protected function setNome($nome)\n    {\n        $this->nome = $nome;\n\
  \    }\n}\n```\n\n你可能在想：“将 `setNome($nome)` 和 `getNome()` 方法设置为保护和私有有什么意义呢？”实际上确实没有意义，这只是为了展示\
  \ `private` 和 `protected` 访问修饰符存在，并且可以且应该在方法定义中使用。\n\n现在我们将看到一个被认为错误的示例：\n\n```php\n\
  <?php\n\nnamespace App\\Entity\\Usuario;\n\nclass Usuario\n{\n    private $nome;\n\
  \n    function _getNome()\n    {\n        return $this->nome;\n    }\n\n    function\
  \ _setNome($nome)\n    {\n        $this->nome = $nome;\n    }\n}\n```\n\n该示例可以运行，但是不正确的，因为访问修饰符的存在是为了被使用的。因此，请尽管使用并充分利用它们，并避免使用\
  \ `_`（下划线）作为访问修饰符，否则你的代码将无法符合 PSR-2 标准，好吗？\n\n### 规则 22\n\n方法名后**不应该**存在空白符。方法的左大括号**必须**另起一行，而右大括号**必须**紧跟在方法体之后。\n\
  \n左括号之后**不应该**存在空白符，右括号之前也**不应该**有空白符。\n\n这听起来可能很奇怪，但这更多被看作是一种适应和习惯的问题。我经常看到不遵循这条\
  \ PSR 规则的代码。为了方便理解，我们来看被认为正确的示例：\n\n```php\n<?php\n\nnamespace App\\Controller;\n\
  \nclass HomeController\n{\n    public function indexAction()\n    {\n        //代码\n\
  \    }\n}\n```\n\n在上述示例中，可以看到 `indexAction()` 方法完美地遵循了这条 PSR-2 规则：方法名后没有空格，左大括号另起一行，右大括号紧跟方法内容之后。\n\
  \n现在我们来分析一个方法定义不符合规定模式的示例：\n\n```php\n<?php\n\nnamespace App\\Controller;\n\nclass\
  \ HomeController\n{\n    public function indexAction ( $request ) {\n        //代码\n\
  \    }\n}\n```\n\n尽管代码可以无问题地运行，但它不兼容 PSR-2 规则。\n\n### 结论\n\n正如你所看到的，PSR-2 提供了无数规则，而且还有更多！在下一章节中，我们将继续查看\
  \ PSR-2 的其他规则。所以请继续加油吧！\n\n\n# PSR-2 (编码风格指南) - 第二部分\n\n我们在上一节中学习了总共 22 条 PSR-2\
  \ 规则，在本章节中，我们将继续查看这些规则，旨在优化源代码的风格，以便通过 PSR-2 建立的标准获得更好的可读性和理解。\n\n## 4.1 规则\n\n\
  接下来我们将从上一章节停止的地方继续介绍规则。\n\n### 规则 23\n\n当方法拥有参数列表时，逗号前**不应该**有空格，但逗号后**必须**有空格。这很简单，不是吗？每当你定义方法的参数列表时，你应该用逗号（`,`）分隔它们，并在后面加上空格，遵循我们自己的标准。\n\
  \n让我们来看定义方法参数的正确示例：\n\n```php\n<?php\n\nnamespace App\\Controller;\n\nclass HomeController\n\
  {\n    public function indexAction($request, $response)\n    {\n        //代码\n \
  \   }\n}\n```\n\n现在我们来看一个错误的示例：\n\n```php\n<?php\n\nnamespace App\\Controller;\n\
  \nclass HomeController\n{\n    public function indexAction($request ,response)\n\
  \    {\n        //代码\n    }\n}\n```\n\n注意，这次参数在逗号前有空格，但空格应该在逗号后。这样代码才符合 PSR-2。\n\
  \n### 规则 24\n\n如果方法有许多需要定义的参数，列表**可以**被拆分为多行，此时第一个参数**必须**位于下一行。\n\n每行应只有一个参数，且列表的右括号和方法的左大括号**必须**在同一行，并包含一个空格。该规则的解释通过视觉化符合规范的示例变得更容易：\n\
  \n```php\n<?php\n\nnamespace App\\Sercice\\Paginacao;\n\nclass PaginacaoService\n\
  {\n    public function paginate(\n        $limite,\n        $pagina,\n        $dados\n\
  \    ) {\n        //代码\n    }\n}\n```\n\n注意参数列表被拆分了，识别参数变得非常容易。现在我们分析一个多行拆分不正确且应该避免的示例：\n\
  \n```php\n<?php\n\nnamespace App\\Sercice\\Paginacao;\n\nclass PaginacaoService\n\
  {\n    public function paginate(\n        $limite, $pagina,\n        $dados\n  \
  \  ) {\n        //代码\n    }\n}\n```\n\n### 规则 25\n\n`abstract` 和 `final` 关键字**必须**在定义类和方法的可见性之前声明。在某些情况下我们需要创建抽象或最终类，或者方法，并且存在一种正确的方法。\n\
  \n为了方便理解，让我们分析下面的示例，它展示了遵循该规则的正确方式：\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\
  \nabstract class AbstractService\n{\n    protected static $dados;\n\n    abstract\
  \ protected function insert();\n\n    final public static function start()\n   \
  \ {\n        //代码\n    }\n}\n```\n\n注意 `abstract` 和 `final` 关键字位于两个方法 `insert()`\
  \ 和 `start()` 的可见性之前。在类中，没有需要定义的可见性，但我们可以告知它是抽象类还是最终类。\n\n\n\n\n```php\n<?php\n\n\
  namespace App\\Sercice;\n\nclass abstract AbstractService\n{\n    protected static\
  \ $dados;\n\n    protected abstract function insert();\n\n    public final static\
  \ function start()\n    {\n        //Código\n    }\n}\n```\n\nNeste exemplo, as\
  \ palavras-chave `abstract` e `final` encontram-se logo após a visibilidade dos\
  \ métodos e logo após a palavra-chave `class`.\n\nEste exemplo não funcionará mais,\
  \ pois não podemos definir uma classe abstrata após a palavra-chave `class`, mas\
  \ sim antes.\n\nNote que nos métodos também existem as palavras `abstract` e `final`\
  \ após a definição da visibilidade, e não há problemas. Porém, se você fizer desta\
  \ forma, seu código não estará de acordo com a regra estabelecida.\n\n### Regra\
  \ 26\n\nAo declarar um método ou função, NÃO DEVE haver espaço entre o nome do método/função\
  \ e o parêntese de abertura.\n\nNÃO DEVE haver espaço após o parêntese de abertura\
  \ e NÃO DEVE haver espaço antes do parêntese de fechamento; e na lista de parâmetros\
  \ NÃO DEVE haver espaço antes de cada vírgula, mas DEVE haver um espaço após cada\
  \ vírgula. Parece complexo, não é mesmo? Mas não é complicado — na verdade, é tão\
  \ simples quanto definir uma variável. Veja o exemplo abaixo que demonstra a forma\
  \ correta de aplicação desta regra:\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\
  \nclass AbstractService\n{        \n    protected function update($id, array $dados)\n\
  \    {\n        //Código\n    }\n}\n```\n\nSimples, não? Note que, quando definimos\
  \ o nome do método, não existe espaço antes nem depois do parêntese de abertura,\
  \ não existe espaço antes da vírgula entre os parâmetros e não existe espaço antes\
  \ nem depois do parêntese de fechamento.\n\nAgora vamos analisar um exemplo com\
  \ a maneira incorreta que não estará em conformidade com esta regra da PSR:\n\n\
  ```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n{        \n \
  \   protected function update ( $id , array $dados )\n    {\n        //Código\n\
  \    }\n}\n```\n\nEste exemplo está completamente fora da regra, pois existe espaço\
  \ em todos os lugares na definição do método.\n\n### Regra 27\n\nApós a palavra-chave\
  \ da estrutura DEVE haver um espaço. NÃO DEVE haver espaço após o parêntese de abertura\
  \ (se necessário). NÃO DEVE haver espaço antes do parêntese de fechamento (se necessário).\
  \ DEVE haver um espaço entre o parêntese de fechamento e a chave de abertura.\n\n\
  O corpo da estrutura DEVE ser indentado uma vez. A chave de fechamento DEVE ser\
  \ colocada em uma linha.\n\nEsta regra também parece assustradora, mas é simples.\
  \ Digo novamente que é mais uma questão de adaptação e costume. Vamos analisar um\
  \ exemplo para cada estrutura, que demonstra a maneira correta a ser seguida:\n\n\
  **Exemplos com `if`, `elseif`, `else`**\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\
  \nclass AbstractService\n{        \n    protected function update($id, array $dados)\n\
  \    {\n        $resultado = null;\n\n        if (is_int($id)) {\n            $resultado\
  \ = 'ID é um inteiro';\n        } elseif (is_numeric($id)) {\n            $resultado\
  \ = 'ID é uma string contendo números';\n        } else {\n            $resultado\
  \ = 'ID não possui formato válido';\n        }\n    }\n}\n```\n\nNote a indentação\
  \ da estrutura de controle e também o espaço antes do parêntese de abertura e, ainda,\
  \ o espaço após o parêntese de fechamento antes da chave da estrutura.\n\nNão é\
  \ uma regra complicada de seguir, mas deve-se ter cuidado para não definir a estrutura\
  \ incorretamente, e é isso que veremos no exemplo abaixo, a maneira considerada\
  \ incorreta e que deve ser evitada:\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\
  \nclass AbstractService\n{        \n    protected function update($id, array $dados)\n\
  \    {\n        $resultado = null;\n\n        if(is_int($id)){\n            $resultado\
  \ = 'ID é um inteiro';\n        } \n        elseif(is_numeric($id)){\n         \
  \   $resultado = 'ID é uma string contendo números';\n        } \n        else{\n\
  \            $resultado = 'ID não possui formato válido';\n        }\n    }\n}\n\
  ```\n\nJá neste exemplo, apesar de funcionar corretamente, ele não segue a regra\
  \ da PSR. Como você pode ver, não existe espaço antes do parêntese de abertura nem\
  \ após o parêntese de fechamento. Outra regra quebrada é quanto às palavras-chave\
  \ `elseif` e `else` que estão abaixo da chave de fechamento da estrutura anterior.\
  \ O correto é que estem na mesma linha que a chave de abertura e precedidas por\
  \ um único espaço. Nada de mais, não é?\n\n**Exemplos com `switch`, `case`**\n\n\
  ```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n{        \n \
  \   protected function update($id, array $dados)\n    {\n        $resultado = null;\n\
  \n        switch ($id) {\n            case 0:\n                $resultado = 'Id\
  \ é 0';\n                break;\n            case 1:\n                $resultado\
  \ = 'Id é 1';\n                break;\n            case 2:\n                $resultado\
  \ = 'Id é 2';\n                break;\n            case 3:\n                $resultado\
  \ = 'Id é 3';\n                //Sem break\n            default:\n             \
  \   $resultado = 'O valor informado não é permitido';\n                break;\n\
  \        }\n    }\n}\n```\n\nNote como, após a palavra-chave `switch` DEVE haver\
  \ um espaço antes do parêntese de abertura e DEVE haver um espaço após o parêntese\
  \ de fechamento. Cada `case` DEVE estar indentado uma vez. O conteúdo de cada `case`\
  \ DEVE ser indentado uma vez. Agora vamos analisar um exemplo que é considerado\
  \ incorreto quanto à regra aplicada:\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\
  \nclass AbstractService\n{        \n    protected function update($id, array $dados)\n\
  \    {\n        $resultado = null;\n\n        switch($id){\n            case 0:\n\
  \                $resultado = 'Id é 0';\n                break;\n            case\
  \ 1:\n                $resultado = 'Id é 1';\n                break;\n         \
  \   case 2:\n                $resultado = 'Id é 2';\n                break;\n  \
  \          case 3:\n                $resultado = 'Id é 3';\n            default:\n\
  \                $resultado = 'O valor informado não é permitido';\n           \
  \     break;\n        }\n    }\n}\n```\n\nNote que neste exemplo a estrutura sofreu\
  \ alterações de indentação e espaçamento, e também que no `case` que não possui\
  \ o `break` o comentário `//Sem break` foi removido. O método continua funcionando\
  \ perfeitamente, porém não é válido para a PSR.\n\n**Exemplos com `while`, `do while`**\n\
  \n```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n{        \n\
  \    protected function update($id, array $dados)\n    {         \n        while\
  \ ($id < 10) {\n            //Código       \n        }\n\n        do {\n       \
  \     //Código\n        } while ($id > 0)\n    }\n}\n```\n\nApós a palavra-chave\
  \ `while`, DEVE haver um espaço antes do parêntese de abertura e DEVE haver um espaço\
  \ após o parêntese de fechamento. A abertura da chave deve estar na mesma linha\
  \ da declaração `while`. O mesmo se aplica utilizando o `do while`. O código fica\
  \ mais bonito e legível, e essa é a maneira considerada correta pela PSR. Agora\
  \ vamos ver o exemplo abaixo que demonstra a maneira incorreta e que não deve ser\
  \ seguida:\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n\
  {        \n    protected function update($id, array $dados)\n    {         \n  \
  \      while($id < 10){\n            //Código       \n        }\n\n        do{\n\
  \            //Código\n        }while($id > 0)\n    }\n}\n```\n\n\n\n\n\n```php\n\
  <?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n{        \n    protected\
  \ function update($id, array $dados)\n    {         \n        for ($i = 0; $i <=\
  \ 10; $i++) {\n            //Código\n        }\n    }\n}\n```\n\n在这个示例中，应用方式与 `while`\
  \ 的正确用法示例完全一致，也就是说，间距符合 PSR 规则。\n\n请再次注意，在关键字 `for` 之后，左括号之前**必须**存在一个空格，且在右括号之后**必须**存在一个空格。\n\
  \n现在我们来分析一个被认为错误且不符合 PSR 的示例：\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\nclass\
  \ AbstractService\n{        \n    protected function update($id, array $dados)\n\
  \    {         \n        for($i = 0; $i <= 10; $i++){\n            //Código\n  \
  \      }\n    }\n}\n```\n\n在这个示例中，代码也可以正常运行，但它不受 PSR 接受，因为它没有具备定义的间距。\n\n## `foreach`\
  \ 示例\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n{   \
  \     \n    protected function update($id, array $dados)\n    {         \n     \
  \   foreach ($dados as $key => $value) {\n            //Código\n        }\n    }\n\
  }\n```\n\n这个示例与用于 `for` 的应用情况类似，相同的间距规则也适用于 `foreach`。此示例具有 PSR 认为正确的间距，应该被使用。\n\
  \n现在我们来分析同一个示例，但由于缺少间距，它被认为是错误的：\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\n\
  class AbstractService\n{        \n    protected function update($id, array $dados)\n\
  \    {         \n        foreach($dados as $key => $value){\n            //Código\n\
  \        }\n    }\n}\n```\n\n到目前为止没什么特别的，示例运行正常，但它不符合 PSR 标准。\n\n## `try`, `catch`,\
  \ `finally` 示例\n\n```php\n<?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n\
  {        \n    protected function update($id, array $dados)\n    {         \n  \
  \      try {\n            //Código\n        } catch (\\InvalidArgumentException\
  \ $e) {\n            //Código\n        } catch (\\Exception $e) {\n            //Código\n\
  \        } finally {\n            //Código\n        }\n    }\n}\n```\n\n当需要使用 `try\
  \ catch` 或 `try catch finally` 块时，它应该具有上一个示例所示的间距和缩进结构。\n\n在关键字 `try` 之后，左括号之前**必须**存在一个空格，且右括号之后**必须**存在一个空格。\n\
  \n对于每个 `catch` 块，关键字 `catch` 之后**必须**存在一个空格，且在右括号之后**必须**存在一个空格。\n\n同样适用于 `finally`（如果存在）：在关键字\
  \ `finally` 之后，块左括号之前**必须**存在一个空格。\n\n这个示例完全符合 PSR。我们来分析一个不符合要求的的示例：\n\n```php\n\
  <?php\n\nnamespace App\\Sercice;\n\nclass AbstractService\n{        \n    protected\
  \ function update($id, array $dados)\n    {         \n        try{\n           \
  \ //Código\n        } catch(\\InvalidArgumentException $e) {\n            //Código\n\
  \        } catch(\\Exception $e) {\n            //Código\n        } finally{\n \
  \           //Código\n        }\n    }\n}\n```\n\n在上面的示例中，间距是错误的。\n\n\n\n\n```php\n\
  <?php\n\nnamespace App\\Controller\\Usuario;\n\nclass UsuarioController\n{     \
  \   \n    public function updateAction($id, array $dados)\n    {         \n    \
  \    return function ($atualizado, \n            $usuario) use ($id,\n         \
  \   $dados) {\n            //代码\n        }\n    }\n}\n```\n\n上面的示例恰恰展示了什么是不该做的。不要这样缩进代码，尽管它可以正常工作。如果你这样做，你的代码将不符合\
  \ `PSR`。\n\n### 结论\n\n我们已经来到了 `PSR-2` 的末尾，正如在本章所示，有许多规则和条件必须遵守，以确保代码符合规范。我们应用了空格和缩进规则，这些规则表明代码会变得更容易理解。\n\
  \n起初，代码看起来可能很奇怪，但随着时间的推移，你会习惯的，甚至能记住每条规则是如何应用的。\n\n需要强调的是，`PSR-2` 已经被弃用，它的者是 `PSR-12`，我们将在本书的后续部分介绍。\n\
  \n让我们继续，了解 `PSR-3` 及其规则。\n\n# 第 5 章 \n\n# PSR-3 (日志接口)\n\n为了提供一个简单、易用且通用的日志记录接口，`PSR-3`\
  \ 允许库接收一个 `Psr\\Log\\LoggerInterface` 对象。通过它，可以为每个应用程序创建自定义日志。\n\n具有特定需求的应用程序可以扩展该接口，但必须保持兼容性。也就是说，每个应用程序可以有不同的记录日志方式，但无论应用程序如何，都必须保持兼容性。\n\
  \n与其他 `PSR` 一样，它也有一系列必须遵守的规则，而这些正是我们在下一节中看到的：\n\n## 5.1 规则\n\n在本节查看此 `PSR` 的所有规则和特征。\n\
  \n### 规则 1\n\n`LoggerInterface` 接口拥有八个用于记录八个级别的方法。它们分别是：`debug`、`info`、`notice`、`warning`、`error`、`critical`、`alert`、`emergency`。\n\
  \n接口还定义了名为 `log` 的第九方法与其他方法的目标完全相同。区别在于它第一个参数接受定义的八个级别之一，也就是说，结果必须与调用特定级别的方法完全相同。\n\
  \n看接下来的示例，它展示了该规则的功能：\n\n```\nlog('error', '发生严重错误', array $context = array());\n\
  ```\n\n在上面的示例中，我们展示了 `log` 方法的功能，它与直接调用 `error` 方法的功能完全相同。这是因为我们向它传递了想要记录 `log`\
  \ 的级别。\n\n通过这种灵活性，你可以选择在应用程序中遵循哪种模式。也就是说，如果你喜欢直接使用 `interface` 中定义的某个级别的方法，还是使用\
  \ `log` 方法，因为行为是相同的。\n\n如果作为参数传递的级别无效，则应抛出 `Psr\\Log\\InvalidArgumentException`\
  \ 异常。\n\n### 规则 2\n\n所有日志方法必须接受一个字符串或具有 `__toString()` 方法的对象作为日志消息。\n\n方法可以对接收到的对象进行特定处理，或者，如果不适用，则方法必须将对象转换为字符串。\n\
  \n实际上非常简单：当你传递日志消息时，除了传递字符串外，你还可以传递一个包含 `__toString()` 方法的对象，确保对象被转换为字符串。\n\n###\
  \ 规则 3\n\n消息可以包含占位符，这些占位符可以被 `$context` 参数中的值替换。\n\n占位符的名称必须与 `$context` 参数中的键相同。占位符的名称必须用开启括号\
  \ (`{`) 和闭括号 (`}`) 定义。\n\n在分隔符和占位符名称之间不应存在空格。占位符名称只能由字符 A-Z、a-z、0-9、下划线 (`_`) 和点组成。\n\
  \n根据应用程序的不同，可能需要更具自定义的日志，包含用户信息，如姓名、访问日期等。\n\n对于这些情况，我们可以使用占位符，定义一个消息并在上下文传递该占位符的值。为了方便理解，让我们分析接下来的示例，它展示了该规则的应用：\n\
  \n```php\n<?php\n\nnamespace App\\Service\\Log;\n\nuse Psr\\Log\\LoggerInterface;\n\
  \nclass LogService implements LoggerInterface\n{        \n    //实现代码\n\n    public\
  \ function gravarLog()\n    {\n        $mensagem = '用户 {NOME_USUARIO} 访问了系统';\n\
  \        $contexto = [\n            'NOME_USUARIO' => 'Jhones'\n        ];\n\n \
  \       $this->info($mensagem, $contexto);\n    }\n}\n```\n\n注意示例中的占位符名称是 `NOME_USUARIO`。\n\
  \n### 规则 4\n\n方法可以实现多种策略来转义占位符值并翻译日志以供显示。如果用户不知道哪些上下文将被显示，则用户不应该转义值。\n\n### 规则 5\n\
  \n所有方法都接受一个上下文数组作为参数，可以传递关于日志的任何额外信息。\n\n方法必须以应用程序方便的方式处理此数组，无论在上下文数组中传递了什么值，这些都不应该导致错误或抛出异常。\n\
  \n### 规则 6\n\n如果在上下文数组中传递了 `Exception` 类型的对象，它必须存储在数组的 `exception` 键中。\n\n## 5.2\
  \ 类和接口\n\n现在让我们来了解这个包的成员。它们是：\n\n\n\n\n\n*   `Psr\\Log\\AbstractLogger` - 此抽象类实现了\
  \ `LoggerInterface` 接口，该接口包含九个方法，其中八个与默认允许的日志级别有关，以便应用程序扩展这个已经包含所有必要方法的抽象类。\n* \
  \  `Psr\\Log\\LoggerTrait` -string 工作原理基本上与 `AbstractLogger` 类相同，区别在于 `Trait` 没有实现\
  \ `LoggerInterface` 接口，因为 `Traits` 无法实现接口。由于它包含了与抽象类相同的功能，结果将完全相同，因为 `LoggerTrait`\
  \ 已经拥有了抽象方法 `log`。\n*   `Psr\\Log\\NullLogger` - 继承自抽象类 `AbstractLogger`，负责作为一种占位符，以在应用程序没有定义任何负责记录日志的类时使用。\n\
  *   `Psr\\Log\\LoggerAwareInterface` - 该接口仅有一个名为 `setLogger` 的方法，负责设置特定的日志类。\n*\
  \   `Psr\\Log\\LoggerAwareTrait` - 作为 `LoggerAwareInterface` 接口的实现，提供了 `setLogger`\
  \ 方法以及属性 `$this->logger`。\n*   `Psr\\Log\\LogLevel` - 仅包含与日志级别相关的八个常量。\n\n### 结论\n\
  \n我们来到了另一个 PSR 的末尾，通过它我们看到了如何按照这里描述的规则开发日志系统。这个 PSR 并不大，在了解了定义它的规则后，也不复杂。\n\n需要强调的是，PSR-3\
  \ 并没有描述如何开发日志系统的具体步骤，而是为我们提供了如何在应用程序中实现它的指导方向和初始结构。\n\n# 第 6 章\n\n## PSR-4 (自动加载器)\n\
  \n为了提供一种通过文件路径加载类的标准，PSR-4 是完全互操作的，可以与任何其他类型的 PSR 配合使用。此外，PSR-4 描述了我们可以将将自动加载的文件放在哪里。\n\
  \n## 6.1 规则\n\n在本节中查看此 PSR 的所有规则和特征。\n\n### 规则 1\n\n类的完整名称 必须包含一个顶层命名空间，被称为*根命名空间*（root\
  \ namespace）。如果你不知道或不知道它是如何运作的，根命名空间只不过是一个基础命名空间，我们所有的类（包括 *traits* 和接口）都应该包含在。让我们分析下面的示例以更好地理解：\n\
  \n```php\n<?php\n\nnamespace App\\Validator\\Cpf;\n\nclass CpfValidator\n{     \
  \   \n    //代码\n}\n```\n\n在示例中，创建了一个类 `CpfValidator`，它反过来位于根命名空间 `App` 中，其中 `App`\
  \ 是项目或其模块的名字。\n\n如果我们要创建另一个类，它也应该位于根命名空间 `App` 中。如果你从未听说过或从未工作过命名空间，你可能在想：我可以为根命名空间定义任何名称吗？答案是肯定的！\n\
  \n如果你想把你的根命名空间命名为 `Sistema` 甚至放上你的名字，你可以轻松地这样做，但请记住命名空间必须具有实际意义。通常它是应用程序的名称或模块的名称。在我们的示例中，这意味着目录结构为：\n\
  \n```\n|-src\n    |-App\n        |-Validator\n            |-Cpf\n              \
  \  |-CpfValidator.php\n```\n\n很简单，不是吗？\n\n### 规则 2\n\n类的完整名称 可以 包含一个或多个*子命名空间*（subnamespaces）。将子命名空间理解为目录结构中的子目录。在之前的示例中，你可以看到在根命名空间\
  \ `App` 内部我们还有 `Validator` 和 `Cpf`，因此完整命名空间如下：`App\\Validator\\Cpf`。\n\n### 规则 3\n\
  \n类的完整名称 必须 以类名结尾。同样，遵循上引用的示例 `App\\Validator\\Cpf`，当我们在另一个类内部调用这个 `validator` 时，我们将采取如下方式：\n\
  \n```php\n<?php\n\nnamespace App\\Service\\Usuario;\n\nuse App\\Validator\\Cpf\\\
  CpfValidator;\n\nclass UsuarioService\n{        \n    //代码\n}\n```\n\n`use App\\\
  Validator\\Cpf\\CpfValidator` 这段代码表示我们正在导入 `CpfValidator` 类。也就是说，为了让 *autoloader*\
  \ 调用一个类，它始终会考虑最后一个 `\\` 之后的内容，即类名加上完整的命名空间。\n\n### 规则 4\n\n下划线 (`_`) 不应该 在类名中产生特殊效果。这意味着类名中的下划线（包括\
  \ *traits* 和接口中的下划线）应该只是一个字符，不会引起任何类型的特殊效果。\n\n### 规则 5\n\n类的完整名称 可以 包含任何类型的大写或小写字符组合。这意味着定义包括命名空间在内的类名没有规则，你可以使用任何类型的字母组合。\n\
  \n按照惯例，类名和命名空间采用的标准是 `StudlyCaps`，即每个单词的首字母大大写，例如：`App\\Entity\\Acl\\PapelDeAcesso`。\n\
  \n### 规则 6\n\n所有类名 必须 以区分大小写的方式引用（*case-sensitive*）。每当 *autoloader* 调用类时，它将使用真实的名称，尊重字母的大小。例如，`CpfValidator`\
  \ 不同于 `cpfValidator`，在后者的情况下将找不到该类，因为它的真实名称是 `CpfValidator` 而不是 `cpfValidator`。\n\
  \n### 规则 7\n\n在加载对应于类名的文件时，根命名空间之外的一个或多个命名空间 必须 对应一个根目录。我们在之前的示例中已经看到了这一点：每个命名空间都对应一个根目录，根命名空间除外，因为它就是根。\n\
  \n但让我们再次分析之前示例中的目录结构：\n\n```\n|-src\n    |-App\n        |-Validator\n          \
  \  |-Cpf\n                |-CpfValidator.php\n```\n\n注意到 `App` 目录是所有后续子目录的库，并且目录结构被转换为\
  \ `App\\Validator\\Cpf` 格式。\n\n### 规则 8\n\n每个子命名空间对应根目录中的一个子目录，且目录名称必须 与子命名空间相同，尊重字母的大小写。\n\
  \n### 规则 9\n\n命名空间之后调类 必须 对应一个 `.php` 文件，且该文件名 必须 与类名相同，尊重字母的大小写。\n\n### 规则 10\n\
  \n*autoloader* 实现不应该抛出异常，不应该产生任何级别的错误，并且不应该返回任何值。*autoloader* 的唯一目标是执行自动加载，仅此而已。\n\
  \n\n\n\n我们的下一步是讨论 `PSR-6`，因此，也许你可能在问，`PSR-5` 发生了什么？在本书编写时，`PSR-5`（`PHPDoc Standard`）处于草案阶段，因此在这里不会进行介绍。我们只关注目前已通过并激活状态的\
  \ `PSRs`，好吗？太极了，那么让我们转向 `PSR-6` 吧。\n\n# 第 7 章\n\n# PSR-6 (缓存接口)\n\n对应用程序数据进行缓存变得越来越必要，但有许多方法可以实现这一点。每个框架和/或微框架都有不同的管理方式，这导致的主要后果之一是开发者必须不断适应每种新的缓存定义模型。在\
  \ `Zend Framework` 中是一种方式，在 `Symfony` 中是另一种方式，依此类推。\n\n为了解决这个问题，`PSR-6` 应运而生，其目标是定义一个创建缓存的标准，而这正是我们之后将看到的。\n\
  \n## 7.1 规则\n\n在本节中查看构成该 PSR 的所有规则和特征集合。\n\n### 规则 1\n\n**在应用程序中调用** - 使用缓存服务的应用程序或代码必须实现标准接口，否则应用程序将不知道缓存服务的存在。\n\
  \n这意味着，如果你的应用程序要按照此 `PSR` 实现数据缓存，那么它必须有一个类来执行定义的标准缓存接口实现，在这种情况下，该接口是 `Psr\\Cache\\\
  CacheItemPoolInterface`。\n\n### 规则 2\n\n**在应用程序中实现** - 应用程序负责实现由 `PSR` 建立的标准，旨在为任何应用程序或代码提供简单的缓存服务。\n\
  \n实现必须提供实现 `Psr\\Cache\\CacheItemPoolInterface` 接口的类，以及 `CacheItemInterface` 接口。库至少应支持\
  \ `TTL`（Time To Live）功能。这基本上是强制性的，因为它定义了缓存项的生命周期。\n\n### 规则 3\n\n**TTL (生存时间)**\
  \ - 每个缓存项都有我们所说的生命周期。这个生命周期是从项被存储到它变得过期之间的时间。\n\n`TTL` 由一个表示秒数的整数定义，或通过一个 `DateInterval`\
  \ 对象定义。\n\n### 规则 4\n\n**过期** - 这是缓存过期的定义时间，通常通过将 `TTL`（Time To Live）添加到特定对象存储的时间来计算得出。\n\
  \n时间也可以通过一个 `DateTime` 对象添加。例如，一个在 09:00:00 存储的具有 300 秒 `TTL` 的项，其过期时间为 09:05:00，也就是说在\
  \ 5 分钟后缓存数据将失效。\n\n应用程序可以在定义的过期时间之前使存储的缓存过期，但必须处理过期项。\n\n如果应用程序未指定时间，必须使用默认时间。\n\
  \n### 规则 5\n\n**键** - 定义项名称键。应用程序必须支持 `A-Z`、`a-z`、`0-9`、`_` 和 `.` 字符。\n\n### 规则\
  \ 6\n\n**命中** - 应用程序请求一个项并找到了缓存项，返回 `hit()`。\n\n### 规则 7\n\n**失败/错误** - 当应用程序请求一个项但未找到或项已过期时发生。\n\
  \n### 规则 8\n\n**延迟** - 延迟的缓存项表示尚未持久化。\n\n### 规则 9\n\n应用程序必须支持所有可以序列化的数据类型。这包括：\n\
  \n*   字符串 (Strings)\n*   整数 (Integers)\n*   浮点数 (Floats)\n*   布尔 (Boolean)\n*  \
  \ 空 (Null)\n*   数组 (Arrays)\n*   对象 (Object)\n\n### 规则 10\n\n**池 (Pool)** - 代表缓存系统中的项的集合，也就是说，它是一个包含所有缓存项的仓库。\n\
  \n### 规则 11\n\n**项 (Items)** - 项由数据集合中的键/值对表示。\n\n\n\nO cache control é geralmente\
  \ essencial e visa aumentar o desempenho da aplicação, mas isso não significa que\
  \ deva ser uma parte crítica que possa afetar as demais funcionalidades. Portanto,\
  \ um erro no cache NÃO DEVE resultar em falhas na aplicação.\n\nPara o tratamento\
  \ adequado de erros proven de falhas de cache, a aplicação deve ser capaz de capturar\
  \ todos os erros que possam ocorrer, mas NÃO DEVE lançar exceções que não foram\
  \ definidas pela interface.\n\nEla DEVE ser capaz de capturar qualquer erro ou exceção\
  \ ocasionada por outro sistema de armazenamento e NÃO DEVE permitir que esses dados\
  \ se misturem.\n\nA aplicação DEVE registrar esses erros e fazer o tratamento mais\
  \ apropriado. Se for desejado que um ou mais itens do cache sejam excluídos caso\
  \ a chave especificada não exista, isso NÃO DEVE ser considerado um erro.\n\n##\
  \ 7.2 Interfaces\n\nA seguir, conheceremos um pouco sobre as interfaces que fazem\
  \ parte desta PSR:\n\n### `CacheItemInterface`\n\nO objetivo desta interface é definir\
  \ um item de cache dentro da aplicação. Cada objeto item DEVE estar associado a\
  \ uma chave específica, que pode ser definida de acordo com as necessidades da aplicação.\n\
  \nA interface `Psr\\Cache\\CacheItemInterface` realiza o encapsulamento do armazenamento\
  \ e a recuperação dos dados de cache, onde cada item do tipo `Cache\\CacheItemInterface`\
  \ armazenado no cache é gerado através de um objeto do tipo `Psr\\Cache\\CacheItemPoolInterface`,\
  \ responsável por qualquer configuração necessária e também por associar o objeto\
  \ a uma chave exclusiva.\n\nOs objetos `Psr\\Cache\\CacheItemInterface` DEVEM ser\
  \ capazes de armazenar e recuperar qualquer tipo de valor, como vimos anteriormente.\n\
  \nA aplicação NÃO DEVE chamar os itens diretamente; eles só podem ser chamados a\
  \ partir de um pool de objetos, através do método `getItem()`.\n\nA aplicação NÃO\
  \ DEVERIA assumir que um item criado por ela mesma seja compatível com um pool de\
  \ objetos de outra biblioteca.\n\nVeremos a seguir o modelo desta interface fornecido\
  \ pelo site oficial da PSR:\n\n```php\n<?php\n\nnamespace Psr\\Cache;\n\ninterface\
  \ CacheItemInterface\n{\n    public function getKey();\n    public function get();\n\
  \    public function isHit();\n    public function set($value);\n    public function\
  \ expiresAt($expiration);\n    public function expiresAfter($time);\n}\n```\n\n\
  ### `CacheItemPoolInterface`\n\nTem o objetivo de aceitar uma chave passada pela\
  \ aplicação e retornar o objeto `Psr\\Cache\\CacheItemInterface` associado à chave\
  \ informada.\n\nTambém é o principal ponto de interação com toda a coleção de cache.\
  \ É responsabilidade da aplicação realizar toda a configuração e inicialização do\
  \ pool.\n\nVeremos a seguir o modelo desta interface:\n\n```php\n<?php\n\nnamespace\
  \ Psr\\Cache;\n\ninterface CacheItemPoolInterface\n{\n    public function getItem($key);\n\
  \    public function getItems(array $keys = array());\n    public function hasItem($key);\n\
  \    public function clear();\n    public function deleteItem($key);\n    public\
  \ function deleteItems(array $keys);\n    public function save(CacheItemInterface\
  \ $item);\n    public function saveDeferred(CacheItemInterface $item);\n    public\
  \ function commit();\n}\n```\n\n### `CacheException`\n\nEsta interface destina-se\
  \ a erros críticos que possam ocorrer, como configuração de cache, conexão com o\
  \ servidor de cache, erros de credenciais, etc.\n\nQualquer exceção lançada pela\
  \ aplicação DEVE implementar esta interface.\n\n```php\n<?php\n\nnamespace Psr\\\
  Cache;\n\ninterface CacheException\n{\n}\n```\n\n### `InvalidArgumentException`\n\
  \nEsta interface estende a interface `Psr\\Cache\\CacheException` e é responsável\
  \ por lançar uma exceção quando algum parâmetro/argumento inválido for passado para\
  \ algum método.\n\n```php\n<?php\n\nnamespace Psr\\Cache;\n\ninterface InvalidArgumentException\
  \ extends CacheException\n{\n}\n```\n\n### Conclusão\n\nEsta PSR realmente nos concede\
  \ um bom direcionamento para quando formos desenvolver um sistema de cache para\
  \ nossas aplicações.\n\n\n\n\n```php\n    <?php\n\n    namespace App\\Middleware\\\
  Authorization\n\n    use Psr\\Http\\Message\\MessageInterface;\n\n    class AuthorizationMiddleware\n\
  \    {\n        private $mensagem;\n\n        public function __construct(MessageInterface\
  \ $mensagem)\n        {\n            $this->mensagem = $mensagem;\n        }\n\n\
  \        public function defineHeaderValues()\n        {\n            $mensagem\
  \ = $this->mensagem->withHeader('authorization', 'Bearer AbcDef1234@#')\n      \
  \          ->withAddedHeader('authorization', 'Bearer 1234567890')\n\n         \
  \   $cabecalhoString = $mensagem->getHeaderLine('authoriation');\n            //返回\
  \ 'Bearer AbcDef1234@#, Bearer 1234567890'\n\n            $cabecalho = $mensagem->getHeader('authorization');\n\
  \            //返回 ['Bearer AbcDef1234@#', 'Bearer 1234567890']\n        }\n    }\n\
  ```\n\n正如我们所看到的，我们为同一个请求头定义了两个值，并以两种不同的方式获取它们，一种是 `array` 形式，另一种是 `string` 形式。\n\
  \n一个非常重要的注意事项是，并不是所有的值都可以用逗号连接（例如 `Set-Cookie`）。\n\n在处理这些请求头时，应用程序必须信任 `Psr\\Http\\\
  Message\\MessageInterface` 接口中的 `getHeader()` 方法来获取这些具有多个值的请求头。\n\n在请求中，host 头反映了\
  \ URI（*Uniform Resource Identifier*，或通用资源标识符）的 host 组件，就像建立 TCP 连接（*Transmission\
  \ Control Protocol*，或传输控制协议）时使用的 host 一样。\n\n然而，HTTP 允许 host 头与上述两者任何一个不同。应用程序应该尝试定义\
  \ URI 的 host 头。默认情况下，`Psr\\Http\\Message\\RequestInterface` 接口定义的 `withUri()` 方法会将返回的请求替换为带有对应\
  \ host 组件的头。你可以通过向 `withUri()` 方法的第二个参数传递 `true` 来保留请求头的原始状态。当此参数设置为 `true` 时，返回的请求将不会通过消息更新\
  \ host 头。\n\n### 规则 3：Streams（流）\n\nHTTP 消息由起始行、请求头和正文组成，消息体的大小各异，从极小到极其巨大。当尝试将消息体表示为\
  \ `string` 时（例如），应用程序很容易消耗比需要更多的内存。如果应用程序尝试在内存中持久化巨大的响应或请求体，将导致该解决方案无法使用，因为会出现内存错误或影响性能。\n\
  \n`Psr\\Http\\Message\\StreamInterface` 接口用于在读取或写入数据流时隐藏具体的实现细节。此外，该接口暴露了多种方法，允许高效地对流进行读取、写入和遍历。\n\
  \n`streams` 通过三个方法暴露其特性：\n- `isReadable()`：返回流是否可读。\n- `isWritable()`：返回流是否可写。\n\
  - `isSeekable()`：返回流是否可寻（跳转）。\n\n每个 `stream` 实例将具有多种特性，例如只读、只写或读/写。最后，`Psr\\Http\\\
  Message\\StreamInterface` 接口定义了 `__toString()` 方法，以便简化一次性获取或输出消息体的全部内容。\n\n与请求接口\
  \ `Psr\\Http\\Message\\RequestInterface` 和响应接口 `Psr\\Http\\Message\\ResponseInterface`\
  \ 不同，`Psr\\Http\\Message\\StreamInterface` 接口不是不可变模型。在实际流被封装的情况下，可以更改其状态（包括光标位置、内容等）。建议应用程序对服务器发出的请求和客户端的响应使用只读流。此外，消费者应用程序必须意识到\
  \ `Psr\\Http\\Message\\StreamInterface` 实例可能会更改消息的状态。\n\n### 规则 4：请求目标和 URI\n\n\
  请求消息包含作为请求行第二个段的请求目标（request-target），其中请求目标可以是以下形式之一：\n\n- `origin-form`：如果存在于查询\
  \ `string` 中，则被称为相对的 URL（*Uniform Resource Locator*，或统一资源定位符）。通常，通过 TCP 传输的消息是源自的，且方案和权威数据通常通过\
  \ CGI（*Common Gateway Interface*）变量存在。\n- `absolute-form`：包含方案（scheme）、权威（`[user-info@]host[:port]`，其中括号项是可选的）、路径、查询\
  \ `string` 和片段，只要它们都存在。这通常被称为绝对 URI，是指定 URI 的唯一形式。这种形式用于向 HTTP 代理发送请求，例如在存在配置了限制访问的代理的企业环境中。\n\
  - `authority-form`：仅包含权威，通常仅用于 `CONNECT` 请求，以便在 HTTP 客户端和代理服务器之间建立连接。\n- `asterisk-form`：仅包含字符串\
  \ `*`，用于 `OPTIONS` 方法以确定特定 Web 服务器的通用能力。\n\n除了这些请求目标外，有时可以在请求分段之外找到一个实际的 URL。此实际\
  \ URL 不在 HTTP 消息中传输，但它用于确定将将使用的协议类型（`http`/`https`）、端口以及用于请求的主机名。\n\n实际 URI 由 `Psr\\\
  Http\\Message\\UriInterface` 接口表示，该接口提供了与 URI 各部分交互的方法，从而消除了重复解析的需要。此外，它指定了 `__toString()`\
  \ 方法，以便将 URI 对象转换为 `string` 格式的表示。\n\n使用 `getRequestTarget()` 方法获取请求目标时，该方法默认将使用\
  \ URI 对象并提取构建源形式所需的所有组件——这是最常见的请求目标。如果最终用户需要使用其他形式之一，或者用户想要替换请求目标，可以使用 `withRequestTarget()`\
  \ 方法进行更改。调用此方法不会影响 URI，因为它是通过 `getUri()` 方法返回的。\n\n让我们分析一个用户对特定服务器使用星号形式执行请求的示例：\n\
  \n\n\n\n\n```php\n    <?php\n\n    namespace App\\Middleware\\Authorization\n\n\
  \    use Psr\\Http\\Message\\RequestInterface;\n\n    class AuthorizationMiddleware\n\
  \    {\n        private $request;\n\n        public function __construct(RequestInterface\
  \ $request)\n        {\n            $this->request = $request->withMethod('OPTIONS')\n\
  \                ->withRequestTarget('*')\n                ->withUri(new Uri('https://www.php-fig.org/'));\n\
  \        }\n    }\n```\n\n此更改后获得的结果将如下所示：\n\n```\nOPTIONS * HTTP/1.1\n```\n\n如有必要，HTTP\
  \ 客户端可以使用通过 `getUri()` 方法获取实际 URL 来定义要使用的协议、`hostname`（主机名）和端口。\n\nHTTP 客户端**必须**忽略\
  \ `Psr\\Http\\Message\\UriInterface` 接口中通过 `getPath()` 和 `getQuery()` 方法所包含的值，并使用通过\
  \ `getRequestTarget()` 方法获取的值，该方法默认连接了上述方法（`getPath()` 和 `getQuery()`）获取的值。\n\n\
  对于选择不实现 4 种目标请求形式之一或多个形式的客户端，它们**仍然**必须使用 `getRequestTarget()` 方法。\n\n这些客户端**必须**拒绝请求目标，因为它们不支持，并且**不应**回退到通过\
  \ `getUri()` 方法获取的值。\n\n`Psr\\Http\\Message\\RequestInterface` 接口提供了方法来获取请求，或使用提供的请求创建一个新实例。\n\
  \n默认情况下，如果请求目标不是特定构造的，则 `getRequestTarget()` 方法将返回复合 URI 的源表单，如果没有构造复合 URI，则返回 `/`。\n\
  \n`withRequestTarget($requestTarget)` 方法负责创建一个带有指定目标请求的新实例，允许开发者创建可以表示其他三种目标请求形式（绝对表单、权威表单和星号格式）的请求消息。\n\
  \n当使用该方法时，复合 URI 实例仍然可以被使用，特别是在需要创建与服务器连接的客户端中。\n\n### 规则 5\n\n**服务器端请求** - `Psr\\\
  Http\\Message\\RequestInterface` 接口提供了 HTTP 消息请求的通用表示，但这些请求需要在服务器端进行额外的处理。\n\n服务器端的处理需要考虑\
  \ CGI 以及通过 CGI 扩展对 PHP 的抽象。\n\nPHP 通过超全局变量提供了围绕输入封装的简化处理，例如：\n\n* `$_COOKIE` - 反序列化并提供对\
  \ HTTP `cookies` 的简化访问。\n* `$_GET` - 反序列化并提供对查询字符串参数的简化访问。\n* `$_POST` - 反序列化并提供通过\
  \ HTTP `POST` 方法发送的参数的简化访问。\n* `$_FILES` - 提供在上传文件时序列化的元数据。\n* `$_SERVER` - 提供对\
  \ CGI/SAPI 环境变量的访问，包括请求方法、请求方案、请求 URI 和标头。\n\n> **什么是 SAPI (*Server Application\
  \ Programming Interface*)？** Server Application Programming Interface（在葡萄牙语中称为服务器应用程序接口）如其名所示，是由服务器提供的应用程序编程接口，允许开发者扩展服务器功能。\n\
  \n> **什么是 CGI (*Common Gateway Interface*)？** Common Gateway Interface（在葡萄牙语中称为通用网关接口）是一种允许通过浏览器发送的参数向存储在服务器上的脚本来生成动态页面的技术。CGI\
  \ 脚本解释参数、执行处理并最终生成结果。\n\n`Psr\\Http\\Message\\RequestInterface` 接口提供了方法来获取请求或使用提供的请求创建一个新实例。\n\
  \n默认情况下，如果请求目标不是特定构造的，则 `getRequestTarget()` 方法将返回复合 URI 的源表单，如果没有构造复合 URI，则返回 `/`。\n\
  \n`withRequestTarget($requestTarget)` 方法负责创建一个带有指定目标请求的新实例，允许开发者创建可以表示其他三种目标请求形式（绝对表单、权威表单和星号格式）的请求消息。\n\
  \n当使用该方法时，复合 URI 实例仍然可以被使用，特别是在需要创建与服务器连接的客户端中。\n\n### 规则 5\n\n**服务器端请求** - `Psr\\\
  Http\\Message\\RequestInterface` 接口提供了 HTTP 消息请求的通用表示，但这些请求需要在服务器端进行额外的处理。\n\n服务器端的处理需要考虑\
  \ CGI 以及通过 CGI 扩展对 PHP 的抽象。\n\nPHP 通过超全局变量提供了围绕输入封装的简化处理，例如：\n\n* `$_COOKIE` - 反序列化并提供对\
  \ HTTP `cookies` 的简化访问。\n* `$_GET` - 反序列化并提供对查询字符串参数的简化访问。\n* `$_POST` - 反序列化并提供通过\
  \ HTTP `POST` 方法发送的参数的简化访问。\n* `$_FILES` - 提供在上传文件时序列化的元数据。\n* `$_SERVER` - 提供对\
  \ CGI/SAPI 环境变量的访问，包括请求方法、请求方案、请求 URI 和标头。\n\n> **什么是 SAPI (*Server Application\
