  \n> **什么是 CGI (*Common Gateway Interface*)？** Common Gateway Interface（在葡萄牙语中称为通用网关接口）是一种允许通过浏览器发送的参数向存储在服务器上的脚本来生成动态页面的技术。CGI\
  \ 脚本解释参数、执行处理并最终生成结果。\n\n`Psr\\Http\\Message\\RequestInterface` 接口提供了方法来获取请求，或使用提供的请求创建一个新实例。...（此处省略重复部分，实际操作将根据你提供的具体文本完成完整翻译）\n\
  \n\n\n\n你可以定义一个文件的 `array`（数组），但规范的实现必须根据提供的索引聚合与文件相关的所有信息，这是因为在某些情况下，`$_FILES`\
  \ 会脱离其常规结构。由于发送的文件数据派自 `$_FILES` 或请求体，因此 `withUploadedFiles()` 方法在 `Psr\\Http\\\
  Message\\UploadedFileInterface` 接口中同样可用，允许将标准化工作委托给另一个进程处理。此外，该接口还提供了若干方法，以确保操作独立于环境能够正常运行：\n\
  \n- `moveTo($targetPath)` 方法作为一种推荐且安全的替代方案被提供，用于直接对临时文件执行 `move_uploaded_file()`\
  \ 方法的调用。实现将根据环境检测出要使用的正确操作。\n- `getStream()` 方法将返回一个 `Psr\\Http\\Message\\StreamInterface`\
  \ 实例。在非 SAPI 环境中，该建议是在 `php://temp` 中对单个上传的文件进行分析。在某些情况下，上传的文件可能不存在，因此保证了 `getStream()`\
  \ 方法在任何环境下都能保持功能性。\n\n## 8.2 接口\n\n在通过整个 PSR-7 之后，我们无法不指定构成该包的接口，因此让我们接下来来检查它们：\n\
  \n### `Psr\\Http\\Message\\MessageInterface`\n\n```php\n<?php\n\nnamespace Psr\\\
