    2. Press the power button again while holding `COMMAND-S` (⌘-S) to enter single-user
    mode. You should see a text-based command line terminal window with very few features,
    as shown in [Figure 2-8](#c02.xhtml#figure2-8).


    ![Figure 2-8: Part of the single-user mode boot screen on a Mac](image_fi/502000c02/f02008.png)


    Figure 2-8: Part of the single-user mode boot screen on a Mac


    The terminal prompt should contain `root#` (press enter a few times if it’s not
    visible on the last line, and it should come up), indicating that we’re logged
    in to the command line as the root, or administrator, user.


    3. Enter the following commands to mount, or connect to, the hard drive:


    ```

    localhost:/ root# /sbin/fsck -fy

    localhost:/ root# /sbin/mount -uw /

    ```


    4. Now connect to the Open Directory service’s property list, or `plist`:


    ```

    localhost:/ root# launchctl load /System/Library/LaunchDaemons/com.apple.opendirectoryd.plist

    ```


    Your Mac uses Open Directory to track users, groups, file sharing, and even Wi-Fi
    printers. Think of it as a catalog of all the user accounts and permissions on
    your Mac.


    5. If you get an error after running the previous command, try running the following
    command instead—it’s the same as step 4, but for older Macs:


    ```

    localhost:/ root# launchctl load /System/Library/LaunchDaemons/com.apple.DirectoryServices.plist

    ```


    6. Now to change the root user’s password. Enter this command:


    ```

    localhost:/ root# passwd

    ```


    7. Enter a new password. You won’t see the characters of the password on the screen
    as you type. Then enter the password a second time to confirm the change. (If
    you mistype the password, start up in single-user mode again and do this same
    hack—it should reset the root user’s password every time.)


    ### You’re the Root User Now!


    Well done! Now that you’ve changed the root user’s password to something you know,
    you can log in as the root user anytime you want. Try it out right now: either
    enter `reboot` at the command line to reboot the computer or press the power button
    to turn the computer off and back on. When the computer boots normally to the
    Mac login screen, enter `root` as the username and type in the new password you’ve
    just set, as shown in [Figure 2-9](#c02.xhtml#figure2-9).


    ![Figure 2-9: After the Mac root hack, you can log in as the root user with the
    password you set in the hack.](image_fi/502000c02/f02009.png)


    Figure 2-9: After the Mac root hack, you can log in as the root user with the
    password you set in the hack.


    Click through any setup screens you see, and you’ll soon come to the Mac desktop.
    You should see in the menu bar at the top of the screen that you’re logged in
    as the system administrator. You now have access to all users’ files and folders
    on the Mac!


    ## Other Physical Hacks


    There are many physical access hacks besides the Sticky Keys hack and the Mac
    root hack. In fact, almost any bootable disc—like Ultimate Boot CD, KNOPPIX, SystemRescueCd,
    or Trinity Rescue Kit—can give you access to the files on the hard drive of a
    computer you have physical access to. There are also specially made hacking tools,
    like Rubber Ducky and Bash Bunny, that cost under $100 and look like regular USB
    drives but contain automated tools for hacking into computers. Some physical access
    hacks even use voice commands. For example, the Open Sesame! attack used Microsoft’s
    Cortana voice assistant to bypass the login screen by telling Cortana to open
    a malicious file on a USB drive or website.


    ## Protecting Against Physical Hacks


    As you’ve seen, physical access hacks can help you recover old photos, copy files,
    and change users on almost any computer you can physically touch, even without
    the original password. However, that means anyone who has physical access and
    knows these hacks can access `your` private files and information too! That’s
    why it’s important to keep your devices with you or locked away in a secure area.


    If someone manages to get access to your computer, however, there are a few ways
    to protect your data. One is to set a `firmware password`, also called a `BIOS
    password` or `EFI password`. This option on Macs and most PCs can prevent attackers
    from tampering with your computer’s BIOS/UEFI settings, neutralizing hacks like
    the Sticky Keys hack and Mac root hack. Unfortunately, firmware passwords are
    only one layer of defense and can often be bypassed. For example, motivated attackers
    can remove a battery from the circuit board in your computer, thereby erasing
    the stored firmware password on most PCs.


    A surer bet is to `encrypt` your files, scrambling them into an unreadable form
    that can only be `unencrypted` (unscrambled) with a password. The encryption password
    is different from your computer’s login password, so an attacker can’t see what’s
    inside your encrypted files by changing your user password with the Sticky Keys
    or Mac root hack. We’ll discuss encryption in more detail in Chapter 11.


    ## The Takeaway


    In this chapter, you saw how to use the Windows Sticky Keys hack and Mac root
    hack to gain administrator-level access to all the files and user accounts on
    a computer, even when you don’t know the username and password. You also learned
    that there are other physical hacks and some specialized tools, like Rubber Ducky
    and Bash Bunny, that make physical hacks even easier. While you can use these
    hacks to recover lost files or reset a forgotten password, you also discovered
    that an attacker with physical access to your computer can often gain access to
    every bit of your information. You can defend against these hacks by limiting
    who has access to your computer, setting a firmware password, and encrypting your
    files.


    Now that you understand the importance of physical security, it’s time to start
    thinking about other attacks that can put your computer in danger—malicious websites,
    phishing and infected email attachments, and even attacks on the internet-connected
    smart devices in your daily life. To be able to practice these other types of
    hacks safely, and to learn to defend against them, you’ll set up your own private
    virtual hacking lab in Chapter 3.


    # 3


    Building Your Own Virtual Hacking Lab


    ![](image_fi/book_art/chapterart.png)


    To learn hacking safely and ethically, you’ll use `virtual machines (VMs)`, programs
    that emulate separate computers within your physical desktop or laptop. You can
    isolate a VM so anything you do in it won’t affect your computer or your network.
    For example, if you open a file with a virus in a VM, the virus would infect only
    the virtual machine, not your real computer.


    `Virtualization software` lets you run a virtual machine (called a `guest`) on
    your desktop or laptop (the `host`). In this chapter, we’ll install VirtualBox,
    a free virtualization program, and the VirtualBox Extension Pack. Then we’ll create
    two VMs. The first will be an `attacking` VM running the Kali Linux operating
    system. You’ll use this VM to launch your hacks. The other virtual machine will
    be a `target` VM running Windows. You’ll direct your hacks at this machine. After
    setting up these two VMs, you’ll be able to safely try out hacking tools without
    affecting your computer or anyone else’s.


    ## Setting Up VirtualBox


    Follow these instructions to download and set up VirtualBox.


    1. Go to the VirtualBox home page at [https://www.virtualbox.org/](https://www.virtualbox.org/)
    and click the `Download VirtualBox` button.


    2. The VirtualBox Downloads page lists options for Windows, macOS, and multiple
    Linux host operating systems. Click the option that matches your computer to download
    the latest version of VirtualBox.


    3. Open the downloaded file and follow the onscreen instructions to install VirtualBox.
    (Windows users should choose to run the file as an administrator; you must have
    administrator privileges to run VirtualBox.)

