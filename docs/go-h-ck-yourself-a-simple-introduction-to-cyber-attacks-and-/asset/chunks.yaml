- raw: "There’s just one exception to using a password manager: make sure to keep\
    \ your email password separate and memorize it (rather than just storing it in\
    \ the manager), just in case you ever forget the passphrase for your password\
    \ manager and need to reset all of your passwords using your email. This also\
    \ protects you in case someone tricks you into giving away the passphrase for\
    \ your password manager—you can still reset your other passwords by having reset\
    \ links sent to your email. Ultimately, you only need to remember two passphrases—one\
    \ for your email and one for your password manager—and you can still have unique,\
    \ almost uncrackable passwords for every account.\n\nFor added protection in case\
    \ an attacker is able to steal or guess one of your passwords, turn on two-factor\
    \ authentication for your most important accounts. Two-factor authentication adds\
    \ an extra layer of security by requiring additional verification besides your\
    \ password to access your most sensitive accounts. Usually, the extra verification\
    \ step involves sending a security code to your cell phone.\n\n## 6\\. Keep your\
    \ software up-to-date.\n\nTurn on automatic updates for your operating system\
    \ and update your browser and other apps regularly. It’s best to run updates at\
    \ least monthly. Pick a certain day of the month, like the 1st or 30th, and mark\
    \ your calendar to update your desktop/laptop and all applications. Think of it\
    \ as another must-do task like paying your bills. Update your phone, smart TV,\
    \ and other devices as soon as you can when an update is available.\n\nSecurity\
    \ patches and software updates are the first place attackers look for vulnerabilities\
    \ they could exploit in older versions. Once an attacker sees that a problem has\
    \ been fixed, anyone who hasn’t downloaded that fix becomes a sitting duck. That’s\
    \ why most of the 2,000+ exploits in Kali attack older versions of software. Keeping\
    \ all of your software up-to-date will eliminate over 99 percent of the known\
    \ attacks on the internet.\n\n## 7\\. Protect your most sensitive data.\n\nDon’t\
    \ log in to sensitive accounts on a public computer or an untrusted network. Instead,\
    \ do sensitive work only on your most protected computer—one that is kept in a\
    \ secure location and that has a good antivirus program, firewall, up-to-date\
    \ software, strong account controls, and very few installed programs. Use a complex\
    \ password and secure Wi-Fi at home and check your router for unknown devices\
    \ regularly, at least once a month.\n\nConsider keeping your most private data,\
    \ like credit card information, tax forms, and health records, off your computer\
    \ altogether. Otherwise, for sensitive information on your computer that you want\
    \ to protect at the maximum level possible, consider encrypting the files, or\
    \ encrypt the entire hard drive of the computer you do sensitive work on. On Windows\
    \ Professional edition, you can encrypt your whole hard drive with BitLocker,\
    \ or you can encrypt individual files and folders by right-clicking and choosing\
    \ **Advanced . . .**▶**Encrypt contents to secure data**. On macOS, you can use\
    \ FileVault to encrypt your hard drive by going to **System Preferences**▶**Security\
    \ & Privacy**▶**FileVault**. I won’t go through the full steps here, but the encryption\
    \ programs should guide you, and a quick web search can help if you get stuck.\
    \ Open source encryption packages like VeraCrypt also let you encrypt files, folders,\
    \ or entire drives with a password or passphrase in just a few steps. You can\
    \ download VeraCrypt at [https://www.veracrypt.fr/](https://www.veracrypt.fr/).\n\
    \nIt’s okay to store your encryption password in a password manager to keep from\
    \ forgetting it. Your files will still be completely useless to a thief who steals\
    \ your hard drive or laptop or to a ransomware attacker who tries to steal data\
    \ from your computer before locking it down and demanding a ransom.\n\n## 8\\\
    . Use security software wisely.\n\nKeep your firewall turned on and update your\
    \ antivirus software regularly. There are several free and low-cost antivirus\
    \ tools out there. Research which ones stop the most malware and then update your\
    \ antivirus tool weekly, or turn on automatic updates, to give it the best shot\
    \ at protecting you. Firewalls and antivirus software can only protect you if\
    \ they’re turned on and up-to-date.\n\nConsider using a VPN app to protect your\
    \ phone or laptop while traveling or when using public Wi-Fi. A VPN, or *virtual\
    \ private network*, masks your identity and encrypts your data as you use the\
    \ internet, so anyone spying on the network won’t be able to see your information.\
    \ With a VPN, you’ll be more secure than most of your peers and safer from most\
    \ online attacks.\n\n## 9\\. Back up the data you want to keep.\n\nThe best defense\
    \ against losing data—whether from ransomware, theft, destruction, or accidental\
    \ deletion—is to back it up often. Back up your files to an external hard drive\
    \ weekly or monthly (depending on how stressed you’d be if you lost a month’s\
    \ worth of data).\n\nIt’s best to keep your backup drive in a separate location\
    \ from your computer to avoid losing both at the same time. Or skip the hassle\
    \ and use a cloud backup service for a few dollars a month. Search online for\
    \ one that’s highly rated and has the features you want and need.\n\n## 10\\.\
    \ Talk with your family.\n\nCommunicate, communicate, communicate. Make sure your\
    \ kids, as well as your parents and older relatives, know the kinds of threats\
    \ and attacks you’ve learned to defend against in this book. Online criminals\
    \ and predators are after their accounts and identities just like they’re after\
    \ yours. Encourage them to stop and think before answering a suspicious or threatening\
    \ email, phone call, or text message. You can even offer to be their “reality\
    \ check” if they’re not sure what to do. Sometimes just talking about an online\
    \ offer or threat can help the intended target see that it’s a scam.\n\nParents,\
    \ set appropriate limits on your kids’ screen time (based on their age), talk\
    \ about online and real-world threats, and *listen* to your kids. Know who their\
    \ friends are and who they’re talking to online. Consider tracking each other’s\
    \ devices—allow your kids to track your cell phone and vice versa. Make sure they\
    \ understand the dangers of oversharing online. Most importantly, encourage them\
    \ to talk to you if they’re ever unsure what to do or if they ever experience\
    \ cyberbullying or harassment.\n\n## The Takeaway\n\nYou’ve come a long way in\
    \ understanding online threats. You’ve performed real hacks in a safe, virtual\
    \ environment that you built yourself. And you’ve learned to defend yourself and\
    \ protect the people you care about from computer attacks.\n\nYou’ve also learned\
    \ some of the hottest job skills for the 21st century. There are hundreds of thousands\
    \ of job openings every year in cybersecurity, and you now have real-life experience\
    \ defending your devices and network from the tools that malicious hackers use.\n\
    \nUse this knowledge for good, be safe, and have fun hacking and practicing your\
    \ new cybersecurity skills!\n\n# A  \n\nCreating a Windows 10 Installation Disc\
    \ or USB Flash Drive\n\n![](image_fi/book_art/chapterart.png)\n\nEthical hackers\
    \ often help recover files or reset passwords, as we do in the Sticky Keys hack\
    \ in Chapter 2. To do so, you can use a bootable recovery disc or USB drive. These\
    \ are typically used to reinstall Windows if it becomes damaged so that you can\
    \ access your files on the computer.\n\nTo create a boot disc or USB drive, you\
    \ can download a free *evaluation* copy of Windows 10 directly from Microsoft,\
    \ then burn or install it onto a DVD or USB flash drive. You’ll need a disc or\
    \ drive that can hold at least 8GB.\n\n## Downloading Windows 10\n\n1.  Go to\
    \ [https://www.microsoft.com/evalcenter/](https://www.microsoft.com/evalcenter/)\
    \ in your browser (sometimes Microsoft changes its website, so if this URL doesn’t\
    \ work, search for “Microsoft Evaluation Center” to find the new page)."
  fmt: "\nThere’s just one exception to using a password manager: make sure to keep\
    \ your email password separate and memorize it (rather than just storing it in\
    \ the manager), just in case you ever forget the passphrase for your password\
    \ manager and need to reset all of your passwords using your email. This also\
    \ protects you in case someone tricks you into giving away the passphrase for\
    \ your password manager—you can still reset your other passwords by having reset\
    \ links sent to your email. Ultimately, you only need to remember two passphrases—one\
    \ for your email and one for your password manager—and you can still have unique,\
    \ almost uncrackable passwords for every account.\n\nFor added protection in case\
    \ an attacker is able to steal or guess one of your passwords, turn on two-factor\
    \ authentication for your most important accounts. Two-factor authentication adds\
    \ an extra layer of security by requiring additional verification besides your\
    \ password to access your most sensitive accounts. Usually, the extra verification\
    \ step involves sending a security code to your cell phone.\n\n## 6\\. Keep your\
    \ software up-to-date.\n\nTurn on automatic updates for your operating system\
    \ and update your browser and other apps regularly. It’s best to run updates at\
    \ least monthly. Pick a certain day of the month, like the 1st or 30th, and mark\
    \ your calendar to update your desktop/laptop and all applications. Think of it\
    \ as another must-do task like paying your bills. Update your phone, smart TV,\
    \ and other devices as soon as you can when an update is available.\n\nSecurity\
    \ patches and software updates are the first place attackers look for vulnerabilities\
    \ they could exploit in older versions. Once an attacker sees that a problem has\
    \ been fixed, anyone who hasn’t downloaded that fix becomes a sitting duck. That’s\
    \ why most of the 2,000+ exploits in Kali attack older versions of software. Keeping\
    \ all of your software up-to-date will eliminate over 99 percent of the known\
    \ attacks on the internet.\n\n## 7\\. Protect your most sensitive data.\n\nDon’t\
    \ log in to sensitive accounts on a public computer or an untrusted network. Instead,\
    \ do sensitive work only on your most protected computer—one that is kept in a\
    \ secure location and that has a good antivirus program, firewall, up-to-date\
    \ software, strong account controls, and very few installed programs. Use a complex\
    \ password and secure Wi-Fi at home and check your router for unknown devices\
    \ regularly, at least once a month.\n\nConsider keeping your most private data,\
    \ like credit card information, tax forms, and health records, off your computer\
    \ altogether. Otherwise, for sensitive information on your computer that you want\
    \ to protect at the maximum level possible, consider encrypting the files, or\
    \ encrypt the entire hard drive of the computer you do sensitive work on. On Windows\
    \ Professional edition, you can encrypt your whole hard drive with BitLocker,\
    \ or you can encrypt individual files and folders by right-clicking and choosing\
    \ `Advanced . . .`▶`Encrypt contents to secure data`. On macOS, you can use FileVault\
    \ to encrypt your hard drive by going to `System Preferences`▶`Security & Privacy`▶`FileVault`.\
    \ I won’t go through the full steps here, but the encryption programs should guide\
    \ you, and a quick web search can help if you get stuck. Open source encryption\
    \ packages like VeraCrypt also let you encrypt files, folders, or entire drives\
    \ with a password or passphrase in just a few steps. You can download VeraCrypt\
    \ at [https://www.veracrypt.fr/](https://www.veracrypt.fr/).\n\nIt’s okay to store\
    \ your encryption password in a password manager to keep from forgetting it. Your\
    \ files will still be completely useless to a thief who steals your hard drive\
    \ or laptop or to a ransomware attacker who tries to steal data from your computer\
    \ before locking it down and demanding a ransom.\n\n## 8\\. Use security software\
    \ wisely.\n\nKeep your firewall turned on and update your antivirus software regularly.\
    \ There are several free and low-cost antivirus tools out there. Research which\
    \ ones stop the most malware and then update your antivirus tool weekly, or turn\
    \ on automatic updates, to give it the best shot at protecting you. Firewalls\
    \ and antivirus software can only protect you if they’re turned on and up-to-date.\n\
    \nConsider using a VPN app to protect your phone or laptop while traveling or\
    \ when using public Wi-Fi. A VPN, or `virtual private network`, masks your identity\
    \ and encrypts your data as you use the internet, so anyone spying on the network\
    \ won’t be able to see your information. With a VPN, you’ll be more secure than\
    \ most of your peers and safer from most online attacks.\n\n## 9\\. Back up the\
    \ data you want to keep.\n\nThe best defense against losing data—whether from\
    \ ransomware, theft, destruction, or accidental deletion—is to back it up often.\
    \ Back up your files to an external hard drive weekly or monthly (depending on\
    \ how stressed you’d be if you lost a month’s worth of data).\n\nIt’s best to\
    \ keep your backup drive in a separate location from your computer to avoid losing\
    \ both at the same time. Or skip the hassle and use a cloud backup service for\
    \ a few dollars a month. Search online for one that’s highly rated and has the\
    \ features you want and need.\n\n## 10\\. Talk with your family.\n\nCommunicate,\
    \ communicate, communicate. Make sure your kids, as well as your parents and older\
    \ relatives, know the kinds of threats and attacks you’ve learned to defend against\
    \ in this book. Online criminals and predators are after their accounts and identities\
    \ just like they’re after yours. Encourage them to stop and think before answering\
    \ a suspicious or threatening email, phone call, or text message. You can even\
    \ offer to be their “reality check” if they’re not sure what to do. Sometimes\
    \ just talking about an online offer or threat can help the intended target see\
    \ that it’s a scam.\n\nParents, set appropriate limits on your kids’ screen time\
    \ (based on their age), talk about online and real-world threats, and `listen`\
    \ to your kids. Know who their friends are and who they’re talking to online.\
    \ Consider tracking each other’s devices—allow your kids to track your cell phone\
    \ and vice versa. Make sure they understand the dangers of oversharing online.\
    \ Most importantly, encourage them to talk to you if they’re ever unsure what\
    \ to do or if they ever experience cyberbullying or harassment.\n\n## The Takeaway\n\
    \nYou’ve come a long way in understanding online threats. You’ve performed real\
    \ hacks in a safe, virtual environment that you built yourself. And you’ve learned\
    \ to defend yourself and protect the people you care about from computer attacks.\n\
    \nYou’ve also learned some of the hottest job skills for the 21st century. There\
    \ are hundreds of thousands of job openings every year in cybersecurity, and you\
    \ now have real-life experience defending your devices and network from the tools\
    \ that malicious hackers use.\n\nUse this knowledge for good, be safe, and have\
    \ fun hacking and practicing your new cybersecurity skills!\n\n# A  \n\nCreating\
    \ a Windows 10 Installation Disc or USB Flash Drive\n\n![](image_fi/book_art/chapterart.png)\n\
    \nEthical hackers often help recover files or reset passwords, as we do in the\
    \ Sticky Keys hack in Chapter 2. To do so, you can use a bootable recovery disc\
    \ or USB drive. These are typically used to reinstall Windows if it becomes damaged\
    \ so that you can access your files on the computer.\n\nTo create a boot disc\
    \ or USB drive, you can download a free `evaluation` copy of Windows 10 directly\
    \ from Microsoft, then burn or install it onto a DVD or USB flash drive. You’ll\
    \ need a disc or drive that can hold at least 8GB.\n\n## Downloading Windows 10\n\
    \n1.  Go to [https://www.microsoft.com/evalcenter/](https://www.microsoft.com/evalcenter/)\
    \ in your browser (sometimes Microsoft changes its website, so if this URL doesn’t\
    \ work, search for “Microsoft Evaluation Center” to find the new page).\n"
  trans: "\n\n使用密码管理器只有一个例外：请务必将电子邮件密码单独保存并记住（而不仅仅是将其存储在管理器中），以防万一你忘记了密码管理器的密码短语，需要通过电子邮件重置所有密码。这也能防止有人诱骗你泄露密码管理器的密码短语——你仍然可以通过将重置链接发送到你的电子邮件来重置其他密码。最终，你只需要记住两个密码短语——一个用于电子邮件，一个用于密码管理器——你仍然可以为每个账户拥有独特且几乎无法破解的密码。\n\
    \n为了在攻击者能够窃取或猜中你的某个密码时增加保护，请为你最重要的账户开启双重身份验证。双重身份验证通过要求除密码之外的额外验证来访问你最敏感的账户，从而增加一层安全性。通常，额外的验证步骤涉及将安全代码发送到你的手机。\n\
    \n## 6\\. 保持软件更新。\n\n为你的操作系统开启自动更新，并定期更新你的浏览器和其他应用程序。最好每月至少运行一次更新。选择每月的某一天，比如\
    \ 1 号或 30 号，并在日历上标记，以更新你的台式机/笔记本电脑和所有应用程序。把它当作像付账单一样必须完成的任务。当有可用更新时，请尽快更新你的手机、智能电视和其他设备。\n\
    \n安全补丁和软件更新是攻击者寻找可在旧版本中利用的漏洞的第一个地方。一旦攻击者发现某个问题已被修复，任何没有下载该修复程序的人都将成为待宰的羔羊。这就是为什么\
    \ Kali 中 2000 多个漏洞利用中的大多数针对旧版本软件。保持所有软件更新将消除互联网上超过 99% 的已知攻击。\n\n## 7\\. 保护你最敏感的数据。\n\
    \n不要在公共电脑或不可信网络上登录敏感账户。相反，只在你最受保护的电脑上进行敏感工作——该电脑应放置在安全位置，并安装有良好的防病毒程序、防火墙、更新的软件、强大的账户控制以及极少的安装程序。在家中使用复杂密码和安全\
    \ Wi-Fi，并至少每月检查一次路由器上的未知设备。\n\n考虑将你最私密的数据（如信用卡信息、税务表格和健康记录）完全不放在电脑上。否则，对于你希望尽可能最大程度保护的电脑上的敏感信息，请考虑加密文件，或加密用于进行敏感工作的电脑的整个硬盘。在\
    \ Windows 专业版中，你可以使用 BitLocker 加密整个硬盘，或者通过右键单击并选择 `Advanced . . .`▶`Encrypt contents\
    \ to secure data` 来加密单个文件和文件夹。在 macOS 上，你可以通过 `System Preferences`▶`Security &\
    \ Privacy`▶`FileVault` 使用 FileVault 加密硬盘。我不会在此处介绍完整步骤，但加密程序应该会指导你，如果你卡住了，快速的网络搜索可以提供帮助。像\
    \ VeraCrypt 这样的开源加密软件包也允许你在几个步骤内使用密码或密码短语加密文件、文件夹或整个驱动器。你可以在 [`www.veracrypt.fr/`](https://www.veracrypt.fr/)\
    \ 下载 VeraCrypt。\n\n将加密密码存储在密码管理器中是可以的，以防忘记它。对于偷走你硬盘或笔记本电脑的小偷，或者试图在锁定电脑并索要赎金之前从你的电脑窃取数据的勒索软件攻击者来说，你的文件仍然完全无用。\n\
    \n## 8\\. 明智地使用安全软件。\n\n保持防火墙开启，并定期更新防病毒软件。有几种免费和低成本的防病毒工具可供使用。研究哪些工具能拦截最多的恶意软件，然后每周更新你的防病毒工具，或开启自动更新，以使其能最大程度地保护你。防火墙和防病毒软件只有在开启并保持更新时才能保护你。\n\
    \n考虑在旅行或使用公共 Wi-Fi 时使用 VPN 应用程序来保护你的手机或笔记本电脑。VPN（即 `virtual private network`）在你使用互联网时隐藏你的身份并加密你的数据，因此任何监视网络的人都无法看到你的信息。使用\
    \ VPN，你将比大多数同龄人更安全，并能免受大多数在线攻击的侵害。\n\n## 9\\. 备份你想保留的数据。\n\n防止数据丢失（无论是由于勒索软件、盗窃、破坏还是意外删除）的最佳防御是经常备份。每周或每月（取决于如果你丢失一个月的数据会有多么焦虑）将文件备份到外部硬盘。\n\
    \n最好将备份驱动器放在与电脑不同的位置，以避免同时丢失两者。或者省去麻烦，每月花几美元使用云备份服务。在网上搜索一个评分很高且具有你想要和需要的功能的服务。\n\
    \n## 10\\. 与你的家人交谈。\n\n沟通，沟通，再沟通。确保你的孩子，以及你的父母和年长的亲戚，了解你在这本书中学会防御的各种威胁和攻击。网络罪犯和掠食者正在盯着他们的账户和身份，就像盯着你的一样。鼓励他们在回复可疑或威胁性的电子邮件、电话或短信之前停下来思考。如果他们不确定该怎么办，你甚至可以主动成为他们的“现实检查”。有时，仅仅讨论一个网络优惠或威胁就能帮助目标对象看出这是一个骗局。\n\
    \n家长，为孩子的屏幕时间设定适当的限制（基于他们的年龄），讨论网络和现实世界的威胁，并 `listen` 你的孩子。了解他们的朋友是谁，以及他们在网上与谁交谈。考虑相互追踪彼此的设备——允许你的孩子追踪你的手机，反之亦然。确保他们了解网上过度分享的危险。最重要的是，鼓励他们如果不确定该怎么办，或者如果他们曾经经历过网络欺凌或骚扰，就与你交谈。\n\
    \n## 要点\n\n你在理解网络威胁方面已经取得了长足进步。你在自己构建的安全虚拟环境中进行了真实的黑客攻击。你还学会了如何保护自己和你关心的人免受计算机攻击。\n\
    \n你还学到了 21 世纪一些最热门的工作技能。网络安全领域每年有数十万个职位空缺，你现在拥有保护你的设备和网络免受恶意黑客使用的工具攻击的真实经验。\n\n\
    善用这些知识，保持安全，并享受黑客攻击和练习你的新网络安全技能的乐趣！\n\n# A  \n\n创建 Windows 10 安装光盘或 USB 闪存驱动器\n\
    \n![](img/chapterart.png)\n\n道德黑客通常帮助恢复文件或重置密码，就像我们在第 2 章的黏性键攻击中所做的那样。为此，你可以使用可启动的恢复光盘或\
    \ USB 驱动器。这些通常用于在 Windows 损坏时重新安装 Windows，以便你可以访问电脑上的文件。\n\n要创建可启动光盘或 USB 驱动器，你可以直接从\
    \ Microsoft 下载免费的 `evaluation` 版 Windows 10，然后将其刻录或安装到 DVD 或 USB 闪存驱动器上。你需要一个能容纳至少\
    \ 8GB 的光盘或驱动器。\n\n## 下载 Windows 10\n\n1.  在浏览器中访问 [`www.microsoft.com/evalcenter/`](https://www.microsoft.com/evalcenter/)（有时\
    \ Microsoft 会更改其网站，因此如果此 URL 不起作用，请搜索“Microsoft Evaluation Center”以找到新页面）。\n\n"
