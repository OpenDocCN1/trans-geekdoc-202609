    You don’t even have to save your password in the browser for someone to reveal
    it. If you’re in a public place and someone distracts you from your computer while
    you’re entering your password into a website, they can use this hack to steal
    your password. They can even repair the `type="password"` code and close the Inspect
    tool to cover their tracks! If you’ve used that same password for multiple accounts,
    the attacker will now be able to access all those other accounts too.


    ## Protecting Your Passwords


    The hack we’ve discussed, when used maliciously, poses a clear risk to the security
    of your passwords. However, there are some simple ways you can protect yourself.
    For one, this hack is possible only if the hacker has physical access to the stored
    passwords, so the key to preventing an attack is either not storing passwords
    in your browser at all or limiting the following:


    1. Where you store passwords Store a password in a browser only on a computer
    or device you own and keep with you, never on a public computer.


    2. Which passwords you store Never store your email password, because an attacker
    can usually discover or reset all your other passwords with your email account.


    3. Who has access to your computer Keep your computer with you or stored in a
    safe place, and don’t leave it open if you have to step away, even for a minute.


    If you must connect to a private account from a public computer, limit the information
    stored in the browser by using Incognito mode (`CTRL-SHIFT-N`) in Chrome or opening
    a new Private Window in Firefox (`CTRL-SHIFT-P`) or Safari (`SHIFT-⌘-N`). Remember
    to both log out and close the browser completely when you finish your session.
    Even if you log out or use Incognito mode, shared computers are risky, because
    malware can record your keystrokes or other information. (In fact, we’ll capture
    keystrokes using a virus we create in Chapter 6.) Only log in to accounts from
    a public computer if it’s absolutely necessary. Also, think about changing your
    passwords when you get back to your own computer.


    If you’re using your personal computer in a public place, be sure to log out or
    lock the screen if you walk away—or better yet, keep your computer with you. Set
    your lock screen or screensaver to turn on after only a few minutes to limit the
    amount of time your computer is vulnerable, in case you forget to lock it yourself.
    Use a strong password or passphrase (try four or more words) for logging in to
    your computer, rather than something obvious like `password123`, so others can’t
    easily unlock your computer if it’s left unattended.


    Beyond these measures, you should take advantage of other password security tools,
    such as two-factor authentication and a password manager like KeePass, Dashlane,
    LastPass, or similar. We’ll discuss these tools in Chapter 11.


    Protecting yourself from computer attacks takes a few smart precautions, but it’s
    important to know how to balance convenience and security. Storing all your passwords
    for everything in your browser seems convenient because you never have to type
    them in, but it also means everyone with access to that computer can steal your
    passwords and your accounts. We have to find the right balance between convenience
    and security, both in the physical world and online.


    ## The Takeaway


    In this chapter, you saw that security through obscurity is easily defeated and
    thus not very secure at all. You learned how to reveal a password entered into
    a browser in seconds, using only a few steps. You also learned the importance
    of never storing a password on a public or shared computer. In addition, you know
    now to physically protect your computer from people you don’t know or trust—if
    someone can touch your keyboard, they can access your sensitive information.


    The hack discussed in this chapter was an example of a physical access hack—the
    attacker needs physical access to your computer to execute it. In the next chapter,
    you’ll find out about other physical access hacks that allow hackers to obtain
    files from your hard drive, without needing to know your login information.


    # 2


    Physical Access Hacks


    ![](image_fi/book_art/chapterart.png)


    Have you ever left your laptop unattended in a coffee shop, thinking that your
    private files would be safely protected behind a login screen? It turns out that
    anyone with physical access to your computer can gain access to your files with
    just a few keystrokes, without needing to know your login details. In this chapter,
    I’ll show you two physical access hacks: the Sticky Keys hack, used on Windows
    PCs, and the Mac root hack, used on Macs. Both hacks give an attacker administrator-level
    access to the target computer, allowing them to steal files or change important
    settings.


    Physical access hacks may sound scary because they can be used maliciously by
    attackers on stolen or unattended computers. However, they also have constructive
    applications. Ethical hackers at home and at IT help desks use techniques like
    the Sticky Keys hack or the Mac root hack to recover files that would otherwise
    be lost due to a forgotten password. If you have an old computer in the garage
    or attic with family photos or other important documents that you can’t access
    because no one remembers the computer’s password, these hacks can help.


    ## The Sticky Keys Hack


    Sticky Keys is a Windows feature that makes it easier to issue certain keyboard
    commands, like `CTRL-C` to copy or `CTRL-V` to paste, by allowing you to press
    the keys one after another instead of all at once. Sticky Keys is triggered by
    pressing `SHIFT` five times and can even be turned on from the Windows login screen,
    before a username or password has been entered.


    For this hack, we’ll replace the Sticky Keys program file with another file, `cmd.exe`.
    That way, instead of launching the usual Sticky Keys assistant, pressing `SHIFT`
    five times will launch a command prompt. This is a text-based program that lets
    us enter commands directly into Windows. By launching a command prompt at the
    login screen (see [Figure 2-1](#c02.xhtml#figure2-1)), you’ll be able to add a
    new username and password, give yourself administrator-level access to the computer,
    and access the computer’s files, all without knowing the login information on
    that computer!


    Since Windows 10 computers that have been updated in 2019 or later are safe from
    the Sticky Keys hack, you’ll need an older Windows computer to try out the hack
    for yourself. You’ll also need a Windows 10 installation disc or USB drive. To
    create one, follow the instructions in Appendix A.


    ### Booting from a Windows 10 Installation Disc


    To replace the Sticky Keys program with the command prompt program, we need to
    access the hard drive that contains those program files using a Windows 10 installation
    disc or USB drive. Once you’ve created an installation disc, as described in Appendix
    A, insert the disc and then restart the computer.


    ![Figure 2-1: The Sticky Keys hack brings up a command prompt window instead of
    the Sticky Keys assistant.](image_fi/502000c02/f02001.png)


    Figure 2-1: The Sticky Keys hack brings up a command prompt window instead of
    the Sticky Keys assistant.


    We need to tell the computer to load the operating system (OS) from the disc or
    USB drive instead of from the computer’s hard drive. To do this, we’ll access
    either the boot menu or the Basic Input/Output System (BIOS), which contains basic
    settings that control your computer when it starts up. Different PC manufacturers
    and different versions of Windows cause the instructions to vary a bit, but the
    following steps combined with a little web searching will get you into most older
    Windows computers:

