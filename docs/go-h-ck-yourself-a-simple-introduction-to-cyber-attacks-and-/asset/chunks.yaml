    \ application\n```\n\n我们控制 Android 设备要做的第一件事是防止它进入睡眠模式。在 Meterpreter 提示符处输入以下命令：\n\
    \n```\nmeterpreter > wakelock -w\n```\n\nMeterpreter 将回复 `Wakelock was acquired`，如果你的\
    \ Android 设备之前已进入睡眠模式或变为黑屏，屏幕将唤醒，设备将保持唤醒状态，直到你释放 wakelock。\n\n如果能同时在屏幕上显示 Android\
    \ 和 Kali 虚拟机，运行 Meterpreter 命令并查看其效果将最为容易。（这种方法在攻击者黑进用户设备时，也有助于查看用户看到的内容。）如果你有双显示器，将\
