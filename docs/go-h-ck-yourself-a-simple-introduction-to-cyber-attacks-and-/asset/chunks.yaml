- raw: "1.  On Windows computers, you press a special key to access the boot menu\
    \ or BIOS. If your startup screen doesn’t show you which key to press just before\
    \ the Windows startup logo appears, reboot your computer and quickly press ESC,\
    \ DELETE, F8, F9, F10, F11, or F12 right as it begins to start up. Search online\
    \ for “boot menu” and the specific make and model of your computer to find the\
    \ right key.\n\n2.  If the boot menu appears, select the **Boot from DVD** or\
    \ **Boot from USB** option to boot from the Windows installation disc you inserted,\
    \ then move on to step 5.\n\n3.  If the boot menu doesn’t appear after a few restarts,\
    \ try entering the BIOS menu instead: turn the computer off and on again, and\
    \ press DELETE, F2, F9, F10, F12, or ESC. Search online for “BIOS” and your computer\
    \ model to find the right key.\n\n4.  Once you’re inside the BIOS, find the boot\
    \ options and change the order or priority of your boot devices (often by using\
    \ your arrow keys) to make the USB or DVD the top option. Then save the changes\
    \ and exit the BIOS.\n\n5.  Reboot the computer again. You should briefly see\
    \ the message `Press any key to boot from CD or DVD` or `Press any key to boot\
    \ from USB device`. Press any key (such as the spacebar) *immediately* to boot\
    \ from your DVD or USB.\n\n6.  When the Windows installation disc starts up, click\
    \ **Next**▶**Repair your computer**▶**Troubleshoot**▶**Command Prompt**, as shown\
    \ in [Figure 2-2](#c02.xhtml#figure2-2). The menu order or the option names might\
    \ look different, but look for the Windows command prompt.\n\n    ![Figure 2-2:\
    \ Use the Windows installation disc to access the command prompt.](image_fi/502000c02/f02002a.png)\n\
    \n    Figure 2-2: Use the Windows installation disc to access the command prompt.\n\
    \n7.  Once you’ve reached the Windows command prompt (usually a black, text-based\
    \ window), type `c:` and press **ENTER** to change to the C: drive, as shown here:\n\
    \n    ```\n    X:\\> c:\n    ```\n\n8.  Enter the command `dir`  to see a list\
    \ of files and folders on the C: drive. Look for a folder called *Windows* (it\
    \ will be marked `<DIR>`, short for *directory*).\n\n    ```\n    C:\\> dir Volume\
    \ in drive C is Windows 10 Volume Serial Number is B4EF-FAC7 Directory of C:\\\
    --snip--\n    03/15/2018  02:51 AM    <DIR>            Users\n    05/19/2019 \
    \ 10:09 AM    <DIR>            Windows 1--snip--\n    ```\n\n    This folder 1\
    \ contains the operating system files, including the command prompt application\
    \ and the Sticky Keys program file that we need to swap out to perform this hack.\n\
    \n9.  If there’s no *Windows* directory on the C: drive, try the same process\
    \ in the D: drive by entering `d:` and then `dir`. If the D: drive doesn’t have\
    \ the *Windows* directory either, keep going through the alphabet (E:, F:, G:,\
    \ and so on) until you find a drive containing *Windows* in its listing.\n\n###\
    \ Gaining Administrator-Level Access\n\nNow to replace the *sethc.exe* Sticky\
    \ Keys program with the *cmd.exe* command prompt program. Then we’ll be able to\
    \ create a new administrator account on the computer.\n\n1.  Enter the following\
    \ three commands:\n\n    ```\n    C:\\> cd \\Windows\\System32\\\n    C:\\Windows\\\
    System32\\> copy sethc.exe sethc.bak\n    C:\\Windows\\System32\\> copy cmd.exe\
    \ sethc.exe\n    ```\n\n    These commands enter the directory where we can find\
    \ both *sethc.exe* and *cmd.exe*, create a backup copy of the Sticky Keys program,\
    \ and replace the original Sticky Keys program file with a copy of the command\
    \ prompt program file. This way, whenever the computer runs *sethc.exe*, it will\
    \ open a command prompt window in place of the Sticky Keys program.\n\n2.  After\
    \ the third command, Windows will ask you if you want to overwrite *sethc.exe*.\
    \ Enter `Y` to proceed.\n\n3.  Remove the Windows 10 installation DVD or USB and\
    \ reboot the computer.\n\n4.  When the PC boots to the login screen, press **SHIFT**\
    \ five times. Instead of the usual Sticky Keys program, you should see a command\
    \ prompt window pop up *in front* of the login screen, as shown in [Figure 2-3](#c02.xhtml#figure2-3).\n\
    \n    ![Figure 2-3: Opening a command prompt window](image_fi/502000c02/f02003.png)\n\
    \n    Figure 2-3: Opening a command prompt window\n\n5.  Enter the following two\
    \ commands into the command prompt window:\n\n    ```\n    C:\\Windows\\System32\\\
    > net user ironman Jarvis /add\n    C:\\Windows\\System32\\> net localgroup administrators\
    \ ironman /add\n    ```\n\n    The first command adds a user account named *ironman*\
    \ with the password *Jarvis* to the Windows computer. The second command adds\
    \ the *ironman* user to the list of local administrators. This means that when\
    \ we log in as *ironman*, we’ll have administrator-level access to all the files\
    \ on the computer.\n\n6.  When you see a success message like the one in [Figure\
    \ 2-4](#c02.xhtml#figure2-4), close the command prompt.\n\n    ![Figure 2-4: We’ve\
    \ successfully added a user named ironman as an administrator on this computer.](image_fi/502000c02/f02004.png)\n\
    \n    Figure 2-4: We’ve successfully added a user named *ironman* as an administrator\
    \ on this computer.\n\nIn addition to creating a new user account, you can also\
    \ reset the password of an existing user from the command prompt window by entering\
    \ `net` `user` followed by the existing username and the new password you want\
    \ to set—for example, `net` `user` `bryson` `Thisisyournewpassword!`. However,\
    \ you should never reset another person’s password without their permission and\
    \ the permission of the computer’s owner.\n\n### Now You’re an Administrator.\
    \ Log In!\n\nCongratulations! You now have access to the machine as an administrator.\
    \ Go ahead and log in. Enter `.\\ironman` as the username (or select **ironman**\
    \ from the list of accounts, as shown in [Figure 2-5](#c02.xhtml#figure2-5)).\
    \ The dot and backslash before `ironman` tell Windows the account is local to\
    \ the computer and not stored on a network server. After entering the username,\
    \ enter the password, `Jarvis`.\n\n ![Figure 2-5: You can now use the ironman\
    \ user to log in to this Windows PC.](image_fi/502000c02/f02005.png)\n\nFigure\
    \ 2-5: You can now use the *ironman* user to log in to this Windows PC.\n\nSince\
    \ we made the *ironman* user a member of the local administrators group, you should\
    \ have administrator-level access to *all* files and folders, including all users\
    \ and documents in *C:\\\\Users\\\\*, as shown in [Figure 2-6](#c02.xhtml#figure2-6).\n\
    \n![Figure 2-6: As an administrator-level user, you can see all users’ files,\
    \ not just your own.](image_fi/502000c02/f02006.png)\n\nFigure 2-6: As an administrator-level\
    \ user, you can see *all* users’ files, not just your own.\n\nWhen you click into\
    \ another user’s folder for the first time, you’ll see a pop-up message saying\
    \ you need permission to open another user’s files, as shown in [Figure 2-7](#c02.xhtml#figure2-7).\
    \ Since you’re an administrator, click **Continue** to grant yourself permanent\
    \ access!\n\n![Figure 2-7: Administrators can give themselves permission to access\
    \ anyone’s files on the same computer.](image_fi/502000c02/f02007.png)\n\nFigure\
    \ 2-7: Administrators can give themselves permission to access anyone’s files\
    \ on the same computer.\n\nThe Sticky Keys hack works only on Windows machines.\
    \ However, computers running macOS are vulnerable to physical access hacks as\
    \ well.\n\n## The Mac Root Hack\n\nLike the Sticky Keys hack, the Mac root hack\
    \ is a physical access attack that will give you administrator-level access to\
    \ a computer. It makes you a *root* user, which is the administrator-level account\
    \ on macOS computers. For this hack, all you need is a Mac computer. We’ll reboot\
    \ the Mac in *single-user mode*, a troubleshooting and repair login. From there,\
    \ we can change the root user’s password, giving us access to all the files on\
    \ the computer.\n\n### Updating the Root User Settings\n\n1.  To begin, the Mac\
    \ needs to be completely turned off—not just asleep. If it isn’t off already,\
    \ press and hold the power button for about six seconds."
  fmt: "\n# 访问 Windows 启动菜单或 BIOS\n\n1. 在 Windows 计算机上，你需要按下特殊键来访问启动菜单或 BIOS。如果启动屏幕在\
    \ Windows 启动标志出现前没有显示应按哪个键，请重启计算机，并在计算机开始启动时快速按下 ESC、DELETE、F8、F9、F10、F11 或 F12。在线搜索“boot\
    \ menu”以及你计算机的具体品牌和型号，以找到正确的按键。\n\n2. 如果出现启动菜单，请选择 **Boot from DVD** 或 **Boot\
    \ from USB** 选项，从你插入的 Windows 安装光盘启动，然后进入步骤 5。\n\n3. 如果重启几次后启动菜单仍未出现，尝试改为进入 BIOS\
    \ 菜单：关闭计算机再重新开机，并按下 DELETE、F2、F9、F10、F12 或 ESC。在线搜索“BIOS”以及你的计算机型号，以找到正确的按键。\n\
    \n4. 进入 BIOS 后，找到启动选项，更改启动设备的顺序或优先级（通常使用方向键），将 USB 或 DVD 设为首选项。然后保存更改并退出 BIOS。\n\
    \n5. 再次重启计算机。你应当会短暂地看到消息 `Press any key to boot from CD or DVD` 或 `Press any key\
    \ to boot from USB device`。立即按下任意键（例如空格键）以从 DVD 或 USB 启动。\n\n6. 当 Windows 安装光盘启动后，依次点击\
    \ **Next** ▶ **Repair your computer** ▶ **Troubleshoot** ▶ **Command Prompt**，如\
    \ [Figure 2-2](#c02.xhtml#figure2-2) 所示。菜单顺序或选项名称可能有所不同，但请寻找 Windows 命令提示符。\n\n\
    \    ![Figure 2-2: Use the Windows installation disc to access the command prompt.](image_fi/502000c02/f02002a.png)\n\
    \n    Figure 2-2: Use the Windows installation disc to access the command prompt.\n\
    \n7. 一旦进入 Windows 命令提示符（通常是黑色的文本窗口），输入 `c:` 并按下 **ENTER** 以切换到 C: 驱动器，如下所示：\n\n\
    \    ```\n    X:\\> c:\n    ```\n\n8. 输入命令 `dir` 以查看 C: 驱动器上的文件和文件夹列表。寻找名为 `Windows`\
    \ 的文件夹（它会被标记为 `<DIR>`，即 *directory* 的缩写）。\n\n    ```\n    C:\\> dir Volume in\
    \ drive C is Windows 10 Volume Serial Number is B4EF-FAC7 Directory of C:\\--snip--\n\
    \    03/15/2018  02:51 AM    <DIR>            Users\n    05/19/2019  10:09 AM\
    \    <DIR>            Windows 1--snip--\n    ```\n\n    此文件夹包含操作系统文件，包括命令提示符应用程序以及我们需要替换以执行此黑客攻击的\
    \ Sticky Keys 程序文件。\n\n9. 如果 C: 驱动器上没有 `Windows` 目录，尝试在 D: 驱动器上执行相同的过程，输入 `d:`\
    \ 然后输入 `dir`。如果 D: 驱动器也没有 `Windows` 目录，继续按字母顺序（E:、F:、G: 等等）查找，直到找到包含 `Windows`\
    \ 的驱动器。\n\n## 获取管理员级访问权限\n\n现在将 *sethc.exe* Sticky Keys 程序替换为 *cmd.exe* 命令提示符程序。然后我们就可以在计算机上创建一个新的管理员帐户。\n\
    \n1. 输入以下三个命令：\n\n    ```\n    C:\\> cd \\Windows\\System32\\\n    C:\\Windows\\\
    System32\\> copy sethc.exe sethc.bak\n    C:\\Windows\\System32\\> copy cmd.exe\
    \ sethc.exe\n    ```\n\n    这些命令进入可以找到 *sethc.exe* 和 *cmd.exe* 的目录，创建 Sticky Keys\
    \ 程序的备份副本，并将原始 Sticky Keys 程序文件替换为命令提示符程序文件的副本。这样，每当计算机运行 *sethc.exe* 时，它将打开一个命令提示符窗口，而不是\
    \ Sticky Keys 程序。\n\n2. 输入第三个命令后，Windows 会询问你是否要覆盖 *sethc.exe*。输入 `Y` 以继续。\n\n\
    3. 移除 Windows 10 安装 DVD 或 USB 并重启计算机。\n\n4. 当 PC 启动到登录屏幕时，按五次 **SHIFT**。你不应看到通常的\
    \ Sticky Keys 程序，而应看到一个命令提示符窗口弹出，显示在登录屏幕 *前面*，如 [Figure 2-3](#c02.xhtml#figure2-3)\
    \ 所示。\n\n    ![Figure 2-3: Opening a command prompt window](image_fi/502000c02/f02003.png)\n\
    \n    Figure 2-3: Opening a command prompt window\n\n5. 在命令提示符窗口中输入以下两个命令：\n\n\
    \    ```\n    C:\\Windows\\System32\\> net user ironman Jarvis /add\n    C:\\\
    Windows\\System32\\> net localgroup administrators ironman /add\n    ```\n\n \
    \   第一个命令向 Windows 计算机添加名为 *ironman* 的用户帐户，密码为 *Jarvis*。第二个命令将 *ironman* 用户添加到本地管理员列表。这意味着当我们以\
    \ *ironman* 身份登录时，我们将拥有对计算机上所有文件的管理员级访问权限。\n\n6. 当你看到类似 [Figure 2-4](#c02.xhtml#figure2-4)\
    \ 中的成功消息时，关闭命令提示符。\n\n    ![Figure 2-4: We’ve successfully added a user named\
    \ ironman as an administrator on this computer.](image_fi/502000c02/f02004.png)\n\
    \n    Figure 2-4: We’ve successfully added a user named *ironman* as an administrator\
    \ on this computer.\n\n除了创建新用户帐户外，你还可以从命令提示符窗口重置现有用户的密码，方法是输入 `net user`，后跟现有用户名和要设置的新密码，例如\
    \ `net user bryson Thisisyournewpassword!`。但是，未经当事人和计算机所有者的许可，绝不应重置他人的密码。\n\n\
    ## 现在你是管理员了，请登录！\n\n恭喜！你现在可以以管理员身份访问该机器。请继续登录。输入 `.\\ironman` 作为用户名（或从帐户列表中选择\
    \ **ironman**，如 [Figure 2-5](#c02.xhtml#figure2-5) 所示）。`ironman` 前面的点和反斜杠告诉 Windows\
    \ 该帐户是本地计算机上的，而不是存储在网络服务器上。输入用户名后，输入密码 `Jarvis`。\n\n ![Figure 2-5: You can now\
    \ use the ironman user to log in to this Windows PC.](image_fi/502000c02/f02005.png)\n\
    \nFigure 2-5: You can now use the *ironman* user to log in to this Windows PC.\n\
    \n由于我们将 *ironman* 用户设为本地管理员组的成员，你应该拥有对 *所有* 文件和文件夹的管理员级访问权限，包括 *C:\\Users\\\\\
    * 中的所有用户和文档，如 [Figure 2-6](#c02.xhtml#figure2-6) 所示。\n\n![Figure 2-6: As an administrator-level\
    \ user, you can see all users’ files, not just your own.](image_fi/502000c02/f02006.png)\n\
    \nFigure 2-6: As an administrator-level user, you can see *all* users’ files,\
    \ not just your own.\n\n当你第一次点击进入另一个用户的文件夹时，你会看到一个弹出消息，提示你需要权限才能打开另一个用户的文件，如 [Figure\
    \ 2-7](#c02.xhtml#figure2-7) 所示。由于你是管理员，请点击 **Continue** 以授予自己永久访问权限！\n\n![Figure\
    \ 2-7: Administrators can give themselves permission to access anyone’s files\
    \ on the same computer.](image_fi/502000c02/f02007.png)\n\nFigure 2-7: Administrators\
    \ can give themselves permission to access anyone’s files on the same computer.\n\
    \nSticky Keys 黑客攻击仅适用于 Windows 机器。但是，运行 macOS 的计算机也容易受到物理访问攻击。\n\n# Mac Root Hack\n\
    \n与 Sticky Keys 黑客攻击类似，Mac root hack 是一种物理访问攻击，将使你获得计算机的管理员级访问权限。它使你成为 *root*\
    \ 用户，即 macOS 计算机上的管理员级帐户。对于此黑客攻击，你只需要一台 Mac 计算机。我们将在 *single-user mode*（一种故障排除和修复登录模式）下重启\
    \ Mac。从那里，我们可以更改 root 用户的密码，从而获得对计算机上所有文件的访问权限。\n\n## 更新 Root 用户设置\n\n1. 首先，Mac\
    \ 需要完全关闭，而不仅仅是睡眠。如果它尚未关闭，请按住电源按钮约六秒钟。\n"
