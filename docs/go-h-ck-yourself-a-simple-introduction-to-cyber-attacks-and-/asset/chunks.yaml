- raw: "    Normally, entering a User ID (such as 1) into the text box and clicking\
    \ Submit reveals that particular user’s information. However, we’ll hack the form\
    \ to show all the users.\n\n3.  Reload the SQL Injection page if you’ve tried\
    \ looking up a user. Then enter `' OR 1='1` into the User ID: text box, as shown\
    \ in [Figure 8-12](#c08.xhtml#figure8-12).\n\n    ![Figure 8-12: Attacking the\
    \ database by injecting SQL code into a vulnerable database search form](image_fi/502000c08/f08012.png)\n\
    \n    Figure 8-12: Attacking the database by injecting SQL code into a vulnerable\
    \ database search form\n\n4.  Click **Submit**, and you should see a listing of\
    \ all users’ first names and last names (surnames), as shown in [Figure 8-13](#c08.xhtml#figure8-13).\n\
    \n5.  Now let’s extract all the DVWA usernames and passwords. Reload the SQL Injection\
    \ page and enter the following SQL code into the search box under User ID:\n\n\
    \    ```\n    ' union select user, password from users#\n    ```\n\n    ![Figure\
    \ 8-13: We’ve revealed all five users’ first and last names!](image_fi/502000c08/f08013.png)\n\
    \n    Figure 8-13: We’ve revealed all five users’ first and last names!\n\n  \
    \  The `union` command in SQL joins two query statements to access multiple tables\
    \ at the same time. In this case, we’re combining the user ID lookup for first\
    \ and last names with a query that will return usernames and passwords from the\
    \ `users` table.\n\n6.  Click **Submit**, and you’ll see all five users’ usernames\
    \ and passwords in place of their first and last names, as shown in [Figure 8-14](#c08.xhtml#figure8-14).\
    \ All the passwords are in hashed form, but as you learned in Chapter 7, tools\
    \ like Hashes.com or John the Ripper make short work of most password hashes.\n\
    \n![Figure 8-14: We’ve stolen all the usernames and password hashes from DVWA\
    \ using a SQL injection attack!](image_fi/502000c08/f08014.png)\n\nFigure 8-14:\
    \ We’ve stolen all the usernames and password hashes from DVWA using a SQL injection\
    \ attack!\n\nAs you can see, a hacker armed with a few short lines of JavaScript\
    \ or SQL can damage a web application, redirect users to a malicious site, steal\
    \ data, or worse. Fortunately, ethical hackers can help website owners defend\
    \ against these attacks, tremendously improving the security of everyone’s online\
    \ data.\n\n## Securing Web Applications from XSS, SQLi, and More\n\nDVWA shows\
    \ both how to hack *and* how to secure web applications. In the bottom-right corner\
    \ of every vulnerable page, there’s a View Source button that shows the page’s\
    \ code. We’ll compare the source code of the low-security page with that of pages\
    \ with higher security levels to learn how to protect against injection attacks.\n\
    \nStill on the SQL Injection page with DVWA’s Script Security set to low, click\
    \ **View Source** to see the source code for the user lookup application, including\
    \ these two lines of code:\n\n```\n$id = $_GET['id']; \n$getid = \"SELECT first_name,\
    \ last_name FROM users WHERE user_id = '$id'\"; \n```\n\nThis web application\
    \ is written in PHP, a popular web programming language. The first line of code\
    \ gets the user’s input from a form field named `'id'` and stores it in a variable\
    \ called `$id`. Then, it creates a SQL query using the user’s input. The user’s\
    \ unmodified input becomes part of the code—this is a dangerous programming mistake,\
    \ and it’s what allowed us to hack into the database.\n\nClick **DVWA Security**\
    \ on the left, change the Script Security level to **medium**, and click **Submit**.\
    \ Click **SQL Injection** to return to the user lookup application and then click\
    \ **View Source** again. (If you have trouble switching security levels, close\
    \ the Edge browser, reopen it, and log back in to DVWA.) This time, you’ll see\
    \ a new line of code inserted between the two just listed:\n\n```\n$id = mysql_real_escape_string($id);\
    \ \n```\n\nThis line reformats the user’s input to add *escape characters* (like\
    \ the backslash `\\`) before any special characters the user typed, such as the\
    \ single quote `'` we used in the `' OR 1='1` hack. Adding a backslash before\
    \ a single quote tells the database to treat the single quote like it’s a part\
    \ of the text, not part of a command. The `mysql_real_escape_string()` command\
    \ makes the form safer by changing the single quote and other potentially malicious\
    \ characters into their harmless escape sequence forms (`\\'`) so that the database\
    \ doesn’t treat them like code, but a motivated attacker could still get around\
    \ this.\n\nGo back to the DVWA Security page and change the Script Security level\
    \ to **high**. Then return to the SQL Injection page and click **View Source**\
    \ one last time. Look for this code:\n\n```\n    $id = $_GET['id']; $id = stripslashes($id);\
    \ $id = mysql_real_escape_string($id);    if (is_numeric($id)){ --snip--\n```\n\
    \nThe high-security code uses the `stripslashes()` command to remove backslashes\
    \ from the user’s text and `is_numeric()` to make sure you entered a number. Using\
    \ `is_numeric()` is an example of form field *validation*: the command `is_numeric()`\
    \ checks that the user’s submission is in an acceptable, expected format—in this\
    \ case a numeric ID—and proceeds only if it is.\n\nView the source of some of\
    \ the other pages at low, medium, and high security to discover other layers of\
    \ commands that web developers use to protect their apps. For example, the secure\
    \ version of the XSS-reflected page includes `htmlspecialchars()` to protect against\
    \ HTML and JavaScript injection. To prevent user input from breaking the website\
    \ or database code, the added commands in the higher-security versions of the\
    \ source code *sanitize* the input, or remove potentially malicious code symbols\
    \ (like the single quote, backslash, and angle bracket characters) from it, before\
    \ that input is used on the site or in the database.\n\n## The Takeaway\n\nIn\
    \ this chapter, you learned that web servers are online and available to hackers\
    \ around the globe 24/7. Moreover, a single unprotected web form can expose millions\
    \ of users’ data to an attacker. You built an intentionally vulnerable web server,\
    \ the Metasploitable VM, in your virtual hacking lab, and you used the DVWA web\
    \ application to train yourself to test websites for two types of code injection:\
    \ cross-site scripting (XSS) and SQL injection (SQLi).\n\nYou used reflected and\
    \ stored malicious JavaScript code to make a web page pop up an alert message\
    \ and redirect the browser to a different website. You viewed the first and last\
    \ names of all users in a database-driven web application using SQL, and then\
    \ you learned how an attacker could steal usernames and password hashes from a\
    \ web database. With the password-cracking tools we used in Chapter 7, an attacker\
    \ could steal millions of usernames and passwords with very little skill or effort.\n\
    \nWith so much at stake, securing web applications from attacks is an important\
    \ role for ethical hackers. It takes multiple layers of security to adequately\
    \ protect web applications. You learned about several functions in the popular\
    \ web-programming language PHP that sanitize user input by removing special code-related\
    \ characters, protecting the server and database. You also saw an example of form\
    \ field validation, checking a text field to make sure that a user entered an\
    \ acceptable value.\n\nIn the next chapter, you get to add one more set of skills\
    \ to your ethical hacking toolbelt—mobile device hacking! You’ll learn how to\
    \ keep yourself and your loved ones safe from the increasing number of mobile\
    \ attacks.\n\n# 9  \n\nHacking Mobile Devices\n\n![](image_fi/book_art/chapterart.png)\n\
    \nIn this chapter, we’ll explore the world of mobile device hacking. You’ll build\
    \ a virtual machine using the world’s most popular mobile operating system, Android.\
    \ Then you’ll hack into your virtual mobile device with Metasploit and take control\
    \ of it remotely using Meterpreter, much like you hacked a PC in Chapter 6. You’ll\
    \ also learn several ways to protect yourself and your family and friends from\
    \ the growing number of mobile attacks.\n\n## Creating an Android Phone/Tablet\
    \ VM"
  fmt: "\nNormally, entering a User ID (such as `1`) into the text box and clicking\
    \ `Submit` reveals that particular user’s information. However, we’ll hack the\
    \ form to show all the users.\n\n3. Reload the SQL Injection page if you’ve tried\
    \ looking up a user. Then enter `' OR 1='1` into the User ID: text box, as shown\
    \ in [Figure 8-12](#c08.xhtml#figure8-12).\n\n![Figure 8-12: Attacking the database\
    \ by injecting SQL code into a vulnerable database search form](image_fi/502000c08/f08012.png)\n\
    \nFigure 8-12: Attacking the database by injecting SQL code into a vulnerable\
    \ database search form\n\n4. Click `Submit`, and you should see a listing of all\
    \ users’ first names and last names (surnames), as shown in [Figure 8-13](#c08.xhtml#figure8-13).\n\
    \n5. Now let’s extract all the DVWA usernames and passwords. Reload the SQL Injection\
    \ page and enter the following SQL code into the search box under User ID:\n\n\
    ```\n' union select user, password from users#\n```\n\n![Figure 8-13: We’ve revealed\
    \ all five users’ first and last names!](image_fi/502000c08/f08013.png)\n\nFigure\
    \ 8-13: We’ve revealed all five users’ first and last names!\n\nThe `union` command\
    \ in SQL joins two query statements to access multiple tables at the same time.\
    \ In this case, we’re combining the user ID lookup for first and last names with\
    \ a query that will return usernames and passwords from the `users` table.\n\n\
    6. Click `Submit`, and you’ll see all five users’ usernames and passwords in place\
    \ of their first and last names, as shown in [Figure 8-14](#c08.xhtml#figure8-14).\
    \ All the passwords are in hashed form, but as you learned in Chapter 7, tools\
    \ like Hashes.com or John the Ripper make short work of most password hashes.\n\
    \n![Figure 8-14: We’ve stolen all the usernames and password hashes from DVWA\
    \ using a SQL injection attack!](image_fi/502000c08/f08014.png)\n\nFigure 8-14:\
    \ We’ve stolen all the usernames and password hashes from DVWA using a SQL injection\
    \ attack!\n\nAs you can see, a hacker armed with a few short lines of JavaScript\
    \ or SQL can damage a web application, redirect users to a malicious site, steal\
    \ data, or worse. Fortunately, ethical hackers can help website owners defend\
    \ against these attacks, tremendously improving the security of everyone’s online\
    \ data.\n\n## Securing Web Applications from XSS, SQLi, and More\n\nDVWA shows\
    \ both how to hack *and* how to secure web applications. In the bottom-right corner\
    \ of every vulnerable page, there’s a View Source button that shows the page’s\
    \ code. We’ll compare the source code of the low-security page with that of pages\
    \ with higher security levels to learn how to protect against injection attacks.\n\
    \nStill on the SQL Injection page with DVWA’s Script Security set to low, click\
    \ `View Source` to see the source code for the user lookup application, including\
    \ these two lines of code:\n\n```\n$id = $_GET['id']; \n$getid = \"SELECT first_name,\
    \ last_name FROM users WHERE user_id = '$id'\"; \n```\n\nThis web application\
    \ is written in PHP, a popular web programming language. The first line of code\
    \ gets the user’s input from a form field named `'id'` and stores it in a variable\
    \ called `$id`. Then, it creates a SQL query using the user’s input. The user’s\
    \ unmodified input becomes part of the code—this is a dangerous programming mistake,\
    \ and it’s what allowed us to hack into the database.\n\nClick `DVWA Security`\
    \ on the left, change the Script Security level to `medium`, and click `Submit`.\
    \ Click `SQL Injection` to return to the user lookup application and then click\
    \ `View Source` again. (If you have trouble switching security levels, close the\
    \ Edge browser, reopen it, and log back in to DVWA.) This time, you’ll see a new\
    \ line of code inserted between the two just listed:\n\n```\n$id = mysql_real_escape_string($id);\
    \ \n```\n\nThis line reformats the user’s input to add *escape characters* (like\
    \ the backslash `\\`) before any special characters the user typed, such as the\
    \ single quote `'` we used in the `' OR 1='1` hack. Adding a backslash before\
    \ a single quote tells the database to treat the single quote like it’s a part\
    \ of the text, not part of a command. The `mysql_real_escape_string()` command\
    \ makes the form safer by changing the single quote and other potentially malicious\
    \ characters into their harmless escape sequence forms (`\\'`) so that the database\
    \ doesn’t treat them like code, but a motivated attacker could still get around\
    \ this.\n\nGo back to the DVWA Security page and change the Script Security level\
    \ to `high`. Then return to the SQL Injection page and click `View Source` one\
    \ last time. Look for this code:\n\n```\n    $id = $_GET['id']; $id = stripslashes($id);\
    \ $id = mysql_real_escape_string($id);    if (is_numeric($id)){ --snip--\n```\n\
    \nThe high-security code uses the `stripslashes()` command to remove backslashes\
    \ from the user’s text and `is_numeric()` to make sure you entered a number. Using\
    \ `is_numeric()` is an example of form field *validation*: the command `is_numeric()`\
    \ checks that the user’s submission is in an acceptable, expected format—in this\
    \ case a numeric ID—and proceeds only if it is.\n\nView the source of some of\
    \ the other pages at low, medium, and high security to discover other layers of\
    \ commands that web developers use to protect their apps. For example, the secure\
    \ version of the XSS-reflected page includes `htmlspecialchars()` to protect against\
    \ HTML and JavaScript injection. To prevent user input from breaking the website\
    \ or database code, the added commands in the higher-security versions of the\
    \ source code *sanitize* the input, or remove potentially malicious code symbols\
    \ (like the single quote, backslash, and angle bracket characters) from it, before\
    \ that input is used on the site or in the database.\n\n## The Takeaway\n\nIn\
    \ this chapter, you learned that web servers are online and available to hackers\
    \ around the globe 24/7. Moreover, a single unprotected web form can expose millions\
    \ of users’ data to an attacker. You built an intentionally vulnerable web server,\
    \ the Metasploitable VM, in your virtual hacking lab, and you used the DVWA web\
    \ application to train yourself to test websites for two types of code injection:\
    \ cross-site scripting (XSS) and SQL injection (SQLi).\n\nYou used reflected and\
    \ stored malicious JavaScript code to make a web page pop up an alert message\
    \ and redirect the browser to a different website. You viewed the first and last\
    \ names of all users in a database-driven web application using SQL, and then\
    \ you learned how an attacker could steal usernames and password hashes from a\
    \ web database. With the password-cracking tools we used in Chapter 7, an attacker\
    \ could steal millions of usernames and passwords with very little skill or effort.\n\
    \nWith so much at stake, securing web applications from attacks is an important\
    \ role for ethical hackers. It takes multiple layers of security to adequately\
    \ protect web applications. You learned about several functions in the popular\
    \ web-programming language PHP that sanitize user input by removing special code-related\
    \ characters, protecting the server and database. You also saw an example of form\
    \ field validation, checking a text field to make sure that a user entered an\
    \ acceptable value.\n\nIn the next chapter, you get to add one more set of skills\
    \ to your ethical hacking toolbelt—mobile device hacking! You’ll learn how to\
    \ keep yourself and your loved ones safe from the increasing number of mobile\
    \ attacks.\n\n# 9\n\nHacking Mobile Devices\n\n![](image_fi/book_art/chapterart.png)\n\
    \nIn this chapter, we’ll explore the world of mobile device hacking. You’ll build\
    \ a virtual machine using the world’s most popular mobile operating system, Android.\
    \ Then you’ll hack into your virtual mobile device with Metasploit and take control\
    \ of it remotely using Meterpreter, much like you hacked a PC in Chapter 6. You’ll\
    \ also learn several ways to protect yourself and your family and friends from\
    \ the growing number of mobile attacks.\n\n## Creating an Android Phone/Tablet\
    \ VM\n"
  trans: "\n\n通常，将用户 ID（例如 `1`）输入文本框并单击 `Submit` 会显示该特定用户的信息。不过，我们会黑掉这个表单，以显示所有用户。\n\
    \n3. 如果你尝试过查找用户，请重新加载 SQL 注入页面。然后在用户 ID：文本框中输入 `' OR 1='1`，如 图 8-12 所示。\n\n![图\
    \ 8-12：通过向易受攻击的数据库搜索表单注入 SQL 代码来攻击数据库](img/f08012.png)\n\n图 8-12：通过向易受攻击的数据库搜索表单注入\
    \ SQL 代码来攻击数据库\n\n4. 单击 `Submit`，你应该会看到所有用户的名和姓（姓氏）列表，如 图 8-13 所示。\n\n5. 现在让我们提取所有\
    \ DVWA 用户名和密码。重新加载 SQL 注入页面，并在用户 ID 下方的搜索框中输入以下 SQL 代码：\n\n```\n' union select\
    \ user, password from users#\n```\n\n![图 8-13：我们揭露了所有五个用户的名和姓！](img/f08013.png)\n\
    \n图 8-13：我们揭露了所有五个用户的名和姓！\n\nSQL 中的 `union` 命令将两个查询语句连接起来，以便同时访问多个表。在此示例中，我们将用于查找名和姓的用户\
    \ ID 查询与一个将从 `users` 表返回用户名和密码的查询相结合。\n\n6. 单击 `Submit`，你将看到所有五个用户的用户名和密码取代了他们的名和姓，如\
    \ 图 8-14 所示。所有密码都以哈希形式存储，但如你在第 7 章中所学，Hashes.com 或 John the Ripper 等工具可以轻松破解大多数密码哈希。\n\
    \n![图 8-14：我们使用 SQL 注入攻击从 DVWA 窃取了所有用户名和密码哈希！](img/f08014.png)\n\n图 8-14：我们使用\
    \ SQL 注入攻击从 DVWA 窃取了所有用户名和密码哈希！\n\n如你所见，掌握几行 JavaScript 或 SQL 代码的黑客可以破坏 Web 应用程序，将用户重定向到恶意网站，窃取数据，或者造成更严重的后果。幸运的是，道德黑客可以帮助网站所有者防御这些攻击，从而大大提升每个人在线数据的安全性。\n\
    \n## 保护 Web 应用程序免受 XSS、SQLi 等攻击\n\nDVWA 展示了如何黑客攻击 *以及* 如何保护 Web 应用程序。在每个易受攻击页面的右下角，都有一个“查看源代码”按钮，用于显示页面的代码。我们将比较低安全级别页面的源代码与较高安全级别页面的源代码，以学习如何防御注入攻击。\n\
    \n仍在 SQL 注入页面上，且 DVWA 的脚本安全级别设置为低，单击 `View Source` 以查看用户查找应用程序的源代码，包括以下两行代码：\n\
    \n```\n$id = $_GET['id']; \n$getid = \"SELECT first_name, last_name FROM users\
    \ WHERE user_id = '$id'\"; \n```\n\n这个 Web 应用程序使用 PHP 编写，这是一种流行的 Web 编程语言。第一行代码从名为\
    \ `'id'` 的表单字段获取用户输入，并将其存储在名为 `$id` 的变量中。然后，它使用用户输入创建一个 SQL 查询。用户未经修改的输入成为代码的一部分——这是一个危险的编程错误，也是让我们能够入侵数据库的原因。\n\
    \n单击左侧的 `DVWA Security`，将脚本安全级别更改为 `medium`，然后单击 `Submit`。单击 `SQL Injection` 返回用户查找应用程序，然后再次单击\
    \ `View Source`。（如果在切换安全级别时遇到问题，请关闭 Edge 浏览器，重新打开它，然后重新登录 DVWA。）这一次，你会看到在刚才列出的两行代码之间插入了一行新代码：\n\
    \n```\n$id = mysql_real_escape_string($id); \n```\n\n这一行重新格式化了用户的输入，在用户输入的任何特殊字符（例如我们在\
    \ `' OR 1='1` 攻击中使用的单引号 `'`）之前添加 *转义字符*（如反斜杠 `\\`）。在单引号前添加反斜杠会告诉数据库将单引号视为文本的一部分，而不是命令的一部分。`mysql_real_escape_string()`\
    \ 命令通过将单引号和其他潜在恶意字符更改为其无害的转义序列形式（`\\'`）来使表单更安全，因此数据库不会将它们视为代码，但有动机的攻击者仍然可能绕过此保护。\n\
    \n返回 DVWA Security 页面，并将脚本安全级别更改为 `high`。然后返回 SQL 注入页面，最后一次单击 `View Source`。查找以下代码：\n\
    \n```\n    $id = $_GET['id']; $id = stripslashes($id); $id = mysql_real_escape_string($id);\
    \    if (is_numeric($id)){ --snip--\n```\n\n高安全级别代码使用 `stripslashes()` 命令从用户文本中删除反斜杠，并使用\
    \ `is_numeric()` 确保你输入了一个数字。使用 `is_numeric()` 是表单字段 *验证* 的一个示例：`is_numeric()`\
    \ 命令检查用户的提交是否处于可接受的预期格式中（在此示例中为数字 ID），并且仅在符合条件时才继续执行。\n\n查看低、中、高安全级别下其他一些页面的源代码，以发现\
    \ Web 开发人员用于保护其应用程序的其他命令层。例如，XSS 反射页面的安全版本包含 `htmlspecialchars()` 以防止 HTML 和 JavaScript\
    \ 注入。为了防止用户输入破坏网站或数据库代码，较高安全级别源代码中的附加命令会对输入进行 *清理*，即在输入用于网站或数据库之前，从中删除潜在的恶意代码符号（如单引号、反斜杠和尖括号字符）。\n\
    \n## 要点\n\n在本章中，你了解到 Web 服务器全天候在线，全球黑客随时可访问。此外，一个未受保护的 Web 表单可能会将数百万用户的数据暴露给攻击者。你在虚拟黑客实验室中构建了一个故意存在漏洞的\
    \ Web 服务器（Metasploitable VM），并使用 DVWA Web 应用程序训练自己测试两种代码注入类型：跨站脚本（XSS）和 SQL 注入（SQLi）。\n\
    \n你使用反射型和存储型恶意 JavaScript 代码使网页弹出警报消息并将浏览器重定向到不同的网站。你使用 SQL 查看了数据库驱动型 Web 应用程序中所有用户的名和姓，然后了解到攻击者如何从\
    \ Web 数据库窃取用户名和密码哈希。借助我们在第 7 章中使用的密码破解工具，攻击者可以用很少的技能或努力窃取数百万个用户名和密码。\n\n鉴于利害关系如此重大，保护\
    \ Web 应用程序免受攻击是道德黑客的重要职责。充分保护 Web 应用程序需要多层安全防护。你了解了流行 Web 编程语言 PHP 中的几个函数，这些函数通过删除特殊的代码相关字符来清理用户输入，从而保护服务器和数据库。你还看到了表单字段验证的示例，即检查文本字段以确保用户输入了可接受的值。\n\
    \n在下一章中，你将为你的道德黑客工具包再添加一组技能——移动设备黑客攻击！你将学习如何保护自己和家人朋友免受日益增加的移动攻击。\n\n# 9\n\n黑客攻击移动设备\n\
    \n![](img/chapterart.png)\n\n在本章中，我们将探索移动设备黑客攻击的世界。你将使用世界上最流行的移动操作系统 Android 构建一个虚拟机。然后你将使用\
    \ Metasploit 入侵你的虚拟移动设备，并使用 Meterpreter 远程控制它，就像你在第 6 章中黑客攻击 PC 一样。你还将学习几种方法来保护自己和家人朋友免受日益增加的移动攻击。\n\
    \n## 创建 Android 手机/平板电脑虚拟机\n\n"
