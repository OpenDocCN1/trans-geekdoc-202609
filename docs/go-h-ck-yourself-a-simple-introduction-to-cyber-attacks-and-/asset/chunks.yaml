    \n如果攻击者获得对你智能手机的远程控制，他们可以劫持设备的摄像头和/或麦克风。正如我们将看到的，这种间谍活动令人不安地容易。\n\n1. 如果你有网络摄像头，请通过虚拟机菜单栏中的\
