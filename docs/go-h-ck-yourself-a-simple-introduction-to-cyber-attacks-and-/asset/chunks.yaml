    \ stored password on your home computer to look it up rather than reset your password.\n\
    \nThis hack can be used ethically in other ways as well. For example, if an employee\
    \ leaves a company unexpectedly, an ethical hacker with the permission of the\
    \ company’s owner can use this hack to recover passwords to important online accounts\
    \ the employee might have been responsible for.\n\nIf you practice it enough times,\
    \ you can easily perform this hack in under 5 seconds. However, that also means\
    \ that if you ever store a password in a public computer, anyone with physical\
    \ access to that computer needs only 5 seconds to steal it. A black hat hacker\
    \ can walk into a hotel lobby or public library almost anywhere in the world,\
    \ sit down at a computer, check the browser’s history for recently visited websites,\
    \ and see if any potential victims saved their passwords when logging in to their\
