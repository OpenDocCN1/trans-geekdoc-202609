    \n为了了解恶意黑客可以使用像 Meterpreter 木马这样的应用做什么，请在 Meterpreter 终端窗口中输入 `help`。你将看到所有可用\
    \ Meterpreter 命令的列表。除了我们在第 6 章中黑进 Windows PC 时看到的命令之外，还有两个仅针对 Android 设备的命令部分：\n\
