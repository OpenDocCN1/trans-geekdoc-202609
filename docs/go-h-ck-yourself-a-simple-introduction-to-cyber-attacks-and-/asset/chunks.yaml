    \ tricking someone into giving up their username and password. This social engineering\
    \ technique is known as *phishing*.\n\nIn this chapter, you’ll learn about the\
    \ dangers of social engineering by creating a phishing website and sending a phishing\
    \ email. You’ll see how easy it is for attackers to fool people into giving up\
    \ their usernames and passwords and how to protect yourself against phishing attacks.\n\
    \n## How Social Engineering Works\n\nSocial engineering takes advantage of our\
    \ human desire to be social, help others, and be part of a group, or it manipulates\
    \ our basic human emotions like fear, curiosity, or greed to trick us into making\
    \ a security mistake or giving away sensitive information. Peer pressure is a\
    \ form of social engineering: it persuades someone to do something they wouldn’t\
