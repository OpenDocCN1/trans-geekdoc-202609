    你甚至不需要在浏览器中保存密码，别人就能将其泄露。如果你在公共场所，在向网站输入密码时有人分散你对电脑的注意力，他们就可以使用这种攻击窃取你的密码。他们甚至可以修改
    `type="password"` 代码并关闭“检查”工具来掩盖行踪！如果你在多个账户中使用了相同的密码，攻击者现在就能访问所有其他账户。


    ## 保护你的密码


    我们讨论过的这种攻击，如果被恶意使用，会对你密码的安全性构成明显风险。不过，有一些简单的方法可以保护你。首先，这种攻击只有在黑客能够物理访问存储密码的情况下才有可能实现，因此防止攻击的关键要么是根本不在浏览器中存储密码，要么是限制以下几点：


    1. 你存储密码的位置 仅在你拥有并随身携带的电脑或设备上将密码存储在浏览器中，绝不要在公共电脑上存储。


    2. 你存储的密码类型 绝不要存储你的电子邮件密码，因为攻击者通常可以通过你的电子邮件账户发现或重置所有其他密码。


    3. 谁可以访问你的电脑 让你的电脑随身携带或存放在安全的地方，即使只离开一分钟，也不要让电脑处于未锁定状态。


    如果你必须从公共电脑登录私人账户，请通过在 Chrome 中使用无痕模式（`CTRL-SHIFT-N`）或在 Firefox（`CTRL-SHIFT-P`）或
    Safari（`SHIFT-⌘-N`）中打开新的私密窗口，来限制浏览器中存储的信息。完成会话后，请务必同时注销并完全关闭浏览器。即使你注销或使用无痕模式，共享电脑也有风险，因为恶意软件可以记录你的按键或其他信息。（事实上，我们将在第
    6 章中使用我们创建的病毒来捕获按键。）只有在绝对必要时，才从公共电脑登录账户。另外，当你回到自己的电脑前，考虑更改你的密码。


    如果你在公共场所使用个人电脑，请确保在离开时注销或锁定屏幕——或者更好的做法是，随身携带你的电脑。将锁定屏幕或屏幕保护程序设置为仅在几分钟后启动，以限制电脑处于易受攻击状态的时间，以防你忘记自己锁定它。使用强密码或密码短语（尝试四个或更多单词）来登录你的电脑，而不是像
    `password123` 这样显而易见的内容，这样如果电脑无人看管，其他人就无法轻易解锁你的电脑。


    除了这些措施之外，你还应该利用其他密码安全工具，例如双因素身份验证以及像 KeePass、Dashlane、LastPass 或类似的密码管理器。我们将在第
    11 章讨论这些工具。


    保护自己免受电脑攻击需要采取一些明智的预防措施，但了解如何平衡便利性和安全性很重要。将所有密码都存储在浏览器中似乎很方便，因为你永远不需要输入它们，但这也意味着所有能够访问该电脑的人都可以窃取你的密码和账户。我们必须在物理世界和在线环境中，找到便利性和安全性之间的正确平衡。


    ## 要点


    在本章中，你了解到“通过隐蔽实现安全”很容易被击败，因此根本不安全。你学会了如何在几秒钟内，只需几个步骤就揭示在浏览器中输入的密码。你还了解到绝不要在公共或共享电脑上存储密码的重要性。此外，你现在知道如何从你不认识或不信任的人那里物理保护你的电脑——如果有人能触碰你的键盘，他们就可以访问你的敏感信息。


    本章讨论的攻击是一个物理访问攻击的示例——攻击者需要物理访问你的电脑才能执行它。在下一章中，你将了解其他物理访问攻击，这些攻击允许黑客从你的硬盘中获取文件，而不需要知道你的登录信息。


    # 2


    物理访问攻击


    ![](img/chapterart.png)


    你是否曾经在咖啡馆无人看管地留下笔记本电脑，以为你的私人文件会安全地受到登录屏幕的保护？事实证明，任何能够物理访问你电脑的人都可以通过几次按键访问你的文件，而不需要知道你的登录信息。在本章中，我将向你展示两种物理访问攻击：用于
    Windows 电脑的粘滞键攻击，以及用于 Mac 的根权限攻击。这两种攻击都会给攻击者提供目标电脑的管理员级访问权限，允许他们窃取文件或更改重要设置。


    物理访问攻击听起来可能很可怕，因为攻击者可以在被盗或无人看管的电脑上恶意使用它们。然而，它们也有建设性的应用。家庭和 IT 帮助台的道德黑客使用粘滞键攻击或
    Mac 根权限攻击等技术，来恢复因忘记密码而原本会丢失的文件。如果你车库或阁楼里有一台旧电脑，里面存放着家庭照片或其他重要文件，但因为没有人记得电脑的密码而无法访问，这些攻击可以提供帮助。


    ## 粘滞键攻击


    粘滞键是 Windows 的一项功能，它允许你一次按一个键而不是同时按所有键，从而更容易发出某些键盘命令，例如使用 `CTRL-C` 复制或 `CTRL-V`
    粘贴。粘滞键通过按五次 `SHIFT` 触发，甚至可以在 Windows 登录屏幕上打开，在输入用户名或密码之前。


    对于这次攻击，我们将用另一个文件 `cmd.exe` 替换粘滞键程序文件。这样，按五次 `SHIFT` 将启动命令提示符，而不是启动通常的粘滞键助手。这是一个基于文本的程序，允许我们直接向
    Windows 输入命令。通过在登录屏幕上启动命令提示符（参见 图 2-1），你将能够添加新用户名和密码，授予自己对电脑的管理员级访问权限，并访问电脑的文件，而无需知道该电脑上的登录信息！


    由于 2019 年或之后更新的 Windows 10 电脑免受粘滞键攻击，你需要一台较旧的 Windows 电脑来亲自尝试这次攻击。你还需要一张 Windows
    10 安装光盘或 USB 驱动器。要创建一个，请按照附录 A 中的说明操作。


    ### 从 Windows 10 安装光盘启动


    要将粘滞键程序替换为命令提示符程序，我们需要使用 Windows 10 安装光盘或 USB 驱动器来访问包含这些程序文件的硬盘。一旦按照附录 A 中的描述创建了安装光盘，插入光盘然后重启电脑。


    ![图 2-1：粘滞键攻击会弹出命令提示符窗口，而不是粘滞键助手。](img/f02001.png)


    图 2-1：粘滞键攻击会弹出命令提示符窗口，而不是粘滞键助手。


    我们需要告诉电脑从光盘或 USB 驱动器加载操作系统（OS），而不是从电脑的硬盘加载。为此，我们将访问启动菜单或基本输入/输出系统（BIOS），后者包含控制电脑启动时的基本设置。不同的
    PC 制造商和不同版本的 Windows 会导致说明略有不同，但以下步骤加上一点网络搜索将能让你进入大多数较旧的 Windows 电脑：


    '
