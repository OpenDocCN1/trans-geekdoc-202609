    To Bev, Alex, and Max: Everything I write is for you.\n\n## About the Author\n\
    \nDr. Bryson Payne is an award-winning cyber coach, author, and TEDx speaker,\
    \ and the founding director of the Center for Cyber Operations Education at the\
    \ University of North Georgia, an NSA-DHS Center for Academic Excellence in Cyber\
    \ Defense. He is a tenured professor of computer science at UNG, where he has\
    \ taught aspiring coders and cyber professionals since 1998, including coaching\
    \ UNG’s #1-in-the-nation NSA Codebreaker Challenge cyber operations team. In 2017,\
    \ he received the University System of Georgia Chancellor’s Service Excellence\
    \ Leader of the Year Award. He has also been awarded the Department of the Army\
    \ Commander’s Award for Public Service medal from US Army Cadet Command and the\
    \ Order of Thor medal from the Military Cyber Professionals Association. Dr. Payne\
    \ was also recognized by the UNG Alumni Association as the 2021 Distinguished\
    \ Professor.\n\nDr. Payne is a Certified Information Systems Security Professional\
    \ (CISSP) and Certified Ethical Hacker (CEH), and he holds the elite SANS|GIAC\
    \ GPEN, GRID, and GREM certifications. He has written over $45 million in successful\
    \ grants for workforce development, technology education, and cybersecurity, and\
    \ he has trained over 60,000 students through his online courses on coding and\
    \ ethical hacking, including three top-rated Udemy courses. He was also the first\
    \ department head of computer science at UNG and enjoys working with K–12 schools\
    \ worldwide to promote computer science and cybersecurity education.\n\nDr. Payne\
    \ holds a PhD in computer science from Georgia State University. Featured in the\
    \ *Wall Street Journal*, *Campus Technology*, and *CIO* magazine, he is also the\
    \ author of *Teach Your Kids to Code* and *Learn Java the Easy Way*, both published\
    \ by No Starch Press. He has been programming, hacking, and reverse-engineering\
    \ software for over 36 years; he sold his first paid program to *RUN Magazine*\
    \ (Commodore 64) for its “Magic” column in 1985, for $10. In addition to his love\
    \ for technology, Dr. Payne enjoys learning languages and speaks Spanish, French,\
    \ Russian, and Mandarin Chinese.\n\n## About the Technical Reviewer\n\nBryan Fagan\
    \ is a coding enthusiast living in Dahlonega, Georgia, where he spends most of\
    \ his time teaching high school students about cybersecurity. He has started several\
    \ afterschool programs focused on engineering, technology, and digital game design.\n\
    \n# Acknowledgments\n\nSpecial thanks to the team at No Starch Press for helping\
    \ make this book a reality: Bill Pollock, Nathan Heidelberger, Barbara Yien, Dapinder\
    \ Dosanjh, Liz Chadwick, Jennifer Kelley, Matthew Kim, Annie Choi, Janelle Ludowise,\
    \ Laurel Chun, Athabasca Witschi, Rachel Monaghan, JoAnne Burek, Lisa Devoto Farrell,\
    \ Derek Yee, Paula Fleming, and Paula Williamson.\n\nThanks to my long-time colleague,\
    \ fellow educator, and friend, Bryan Fagan, for his thoughtful and thorough technical\
    \ review across all the changes in Kali Linux and most of the hacking tools over\
    \ the past two years.\n\nThanks to my mom, Esta, for buying me that Commodore\
    \ 64 in the early 1980s and encouraging me to pursue my dreams—I never knew how\
    \ far coding and hacking would take me. Thanks to my father-in-law, Norman, for\
    \ always having time to talk computers with me. And thanks most of all to my beautiful\
    \ wife, Bev, and my sons, Alex and Max, for their love and support as I wrote\
    \ this third book—thanks especially for making me take breaks to jump on the trampoline,\
    \ do science experiments, play games, watch movies, and swim. This book, and my\
    \ life, are infinitely better and more fun thanks to you.\n\n# Introduction\n\n\
