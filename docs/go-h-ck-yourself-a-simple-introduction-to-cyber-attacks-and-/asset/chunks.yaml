    \ find out about other physical access hacks that allow hackers to obtain files\
    \ from your hard drive, without needing to know your login information.\n\n# 2\
    \  \n\nPhysical Access Hacks\n\n![](image_fi/book_art/chapterart.png)\n\nHave\
