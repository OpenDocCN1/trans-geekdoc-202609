  trans: '


    我们可以使用已知的密码部分（`SuperGir`），加上一些通配符字符，来创建一个掩码。`mask` 通过填充我们已知的字符（在此例中，前八个字符：`SuperGir`）来减少需要尝试的密码组合数量。根据便利贴，我们不知道
    Kara 的密码是以数字、字母还是特殊字符结尾，所以先使用 `SuperGir?a` 这样的掩码来试试。


    1. 在 Johnny 中，点击左侧的 `Options`，点击 `Mask` 选项卡，并在 Mask: 文本框中输入 `SuperGir?a`。


    2. 点击顶部的 `Start new attack`。然后，要查看 Kara 的密码是否被破解，点击左侧的 `Passwords`。你应该会发现，SuperGir
    后面只有一个通配符字符无法破解该密码。


    3. 返回 `Mask` 选项卡，输入两个通配符字符，`SuperGir?a?a`，然后再试一次。


    4. 还是没有结果？输入第三个通配符字符，`SuperGir?a?a?a`，如 图 7-8 所示。然后再次点击 `Start new attack`。


    ![图 7-8：使用掩码攻击——在便利贴上找到的部分密码后面添加通配符字符——来破解 Kara 的密码](img/f07008.png)


    图 7-8：使用掩码攻击——在便利贴上找到的部分密码后面添加通配符字符——来破解 Kara 的密码


    这次，图 7-8 中窗口底部的进度条应该会变化，显示 Johnny 能够破解一个额外的密码。再次点击 `Passwords`。现在，在 `kara` 旁边，你会看到她的密码
    `SuperGirl7!`，如 图 7-9 所示。


    ![图 7-9：密码掩码 `SuperGir?a?a?a` 在不到一秒钟内就破解了 Kara 的密码（`SuperGirl7!`）！](img/f07009.png)


    图 7-9：密码掩码 `SuperGir?a?a?a` 在不到一秒钟内就破解了 Kara 的密码（`SuperGirl7!`）！


    尽管我们只有 Kara 密码的一部分，但仍能使用掩码攻击来猜测她的完整密码。Johnny 花不到一秒钟的时间就尝试了从 `SuperGir000` 到 `SuperGirl7!`
    的数千种可能性，逐一尝试。这意味着，如果你只是在密码的开头、中间或结尾更改数字和符号来重复使用密码，那么发现你一个旧密码的黑客可以使用 Johnny 或类似工具在几秒钟内猜出你的当前密码。


    你也可以使用掩码攻击来破解 Peter 的密码。输入几个通配符字符——先从 `SpidermanRu?a` 开始，然后是 `SpidermanRu?a?a`，依此类推——直到破解完整密码。最后一轮可能需要五六分钟才能运行，因为每增加一个字符，复杂度都会呈指数级增加（3
    个通配符不到一秒钟，4 个通配符需要三到四秒钟，5 个通配符需要五到六分钟，6 个通配符需要近九个小时，而 14 个通配符则需要数千年！）。


    破解更长密码所需时间呈指数级增长，这正是每个人都应该使用长密码的原因。无论我们运行 Johnny 多少年，都不太可能破解我们的长密码短语，即你创建的最终密码。长密码是我们用来防止黑客入侵账户的技巧之一。


    ## 使用更安全的密码


    你只需做一些小改动，就能让密码变得连专业人士也难以破解。首先，一般来说，密码越长，就越安全。要创建一个强密码短语，选择四个或更多随机且不相关的单词，将它们串联起来。要让你的密码短语几乎无法破解，添加几个数字或特殊字符。


    除了常规键盘上的特殊字符，如 `!`、`@`、`#` 和 `$`，你还可以添加一种与你自己的语言或字母表不同的语言或字母表中的特殊字符。即使你使用较短的密码而不是密码短语，添加另一种语言的特殊字符也会让它更难被破解。


    让我们看看如何在不同操作系统中实现这一点。


    1. Windows 按住 ALT 键的同时在数字小键盘上输入数字，然后释放。例如，按住 ALT 键的同时在数字小键盘上输入 0214；当你释放 alt 键时，字符
    `Ö` 将出现（带变音符号的大写 `O`）。在线搜索“Windows alt codes”列表，找到你想要使用的字符。请注意，某些键盘可能特别要求你使用左侧
    ALT 键。在没有数字小键盘的笔记本电脑上，你可以按 Windows 键加句号键（Windows-.）来插入表情符号或其他符号。


    2. Linux 按下 ctrl-shift-U；释放（屏幕上会出现一个带下划线的 `u`）；输入你想要的字符的 Unicode 十六进制值，例如 `Ö`
    字符的 `d6`（或要求四位数的系统使用 `00d6`），然后按空格键或回车键。在线搜索“Unicode character codes”以查找更多选项。


    3. macOS 按下 CONTROL-COMMAND-SPACEBAR 以调出字符查看器。输入 `u+d6` 以显示 `Ö` 字符。要插入字符，可以按下箭头键选择它然后按
    ENTER，或者直接用鼠标点击它。适用于 Linux 的相同 Unicode 字符代码也适用于 macOS 的字符查看器；只需在十六进制代码前添加 `u+`。


    4. iPhone 或 Android 在虚拟键盘上长按 O，直到出现带有 `Ö` 字符和其他选项的弹出窗口。如果不安装应用程序或选择备用键盘布局，你无法访问所有
    Unicode 字符，但对大多数元音和少数辅音进行长按，将为你提供足够的选项来增强密码强度。


    当然，你可能记不住一个或两个带有这种特殊字符的长密码。密码管理器可以通过为你的大多数账户设置长而随机的密码并安全地为你存储它们来减轻负担。此外，只要提供，你就应该开启双重身份验证。使用此功能，即使攻击者破解了你的一个密码，他们可能也无法访问你的账户。我们将在第
    11 章更详细地了解这些工具。


    ## 要点


    在本章中，你学习了攻击者如何使用 Metasploit 中的 Mimikatz 通过网络窃取 Windows 密码哈希。一旦攻击者通过他们诱骗你安装的恶意软件访问你的计算机，他们可以（并且经常会）在你的系统中查找密码或其他敏感数据。然后你看到黑客如何使用免费的在线密码数据库或
    John the Ripper 中的字典攻击轻松破解许多密码哈希。你还学习了如何通过向旧的或不完整的密码添加几个通配符字符，使用掩码攻击来破解更复杂的密码。


    最后，你学习了一些保护自己免受本章所介绍密码攻击的技术。以下是一份简短的注意事项清单，可以改变你的密码习惯：


    * `Don’t` 在多个账户中使用相同的密码。


    * `Don’t` 通过在末尾（或中间或开头）添加数字或符号来重复使用密码。


    * `Don’t` 将密码写下来或将其存储在纯文本文档或电子表格中。


    * `Do` 使用带有一个或多个特殊字符的长密码短语。


    * `Do` 使用密码管理器和多因素身份验证。


    这些技巧将使你的在线生活比普通人更轻松且 `much` 更安全。然而，攻击者不必访问你的计算机就能窃取你的密码；他们可以通过互联网从 Web 应用程序和服务器窃取密码和其他信息。在下一章中，我们将学习如何通过入侵我们虚拟实验室中的易受攻击的
    Web 服务器来实现这一点。


    不过，首先，查看 清单 7-2，看看你是否成功破解了本章开头的密码！


    '
