    \ [https://www.ic3.gov/](https://www.ic3.gov/)), and any cyberbullying or harassment\
    \ (to your local authorities).\n\nSocial media is a powerful connector, but it’s\
    \ also a powerful tool for both criminal black hats and ethical white hat hackers\
    \ to conduct recon and information gathering. Don’t overshare. Instead, be aware\
    \ of your security and privacy settings, use social media wisely, and, if anyone\
    \ uses social media against you, report it to the proper authorities right away.\n\
    \n## The Takeaway\n\nIn this chapter, you learned about free online tools, like\
    \ search engines and image metadata viewers, that hackers use to gather information\
