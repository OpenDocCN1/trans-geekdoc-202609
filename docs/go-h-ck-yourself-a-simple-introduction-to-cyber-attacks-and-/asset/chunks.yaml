  trans: "\n\n在本章中，你将使用 Google 查找关于自己的信息，并使用 `Google hacking` 寻找用户名和密码。然后，你将使用社交媒体进行进一步的侦察，并学习如何通过限制在线分享的信息来保护自己。你不分享的信息，攻击者就无法利用！\n\
    \n## 在敌人之前先搜索自己\n\n攻击者可以利用公开信息发起 `phishing` 攻击，他们会假装成你认识的人，发送一封假电子邮件，索要密码等个人信息。许多公司网站都有员工名录或员工目录，其中包含攻击者发起钓鱼攻击（或更糟的情况）所需的所有姓名和电子邮件地址。\n\
    \n让我们来看看攻击者能发现关于你的哪些信息。打开网络浏览器，搜索你自己的名字。我在 Google 上搜索了自己的名字，如 图 4-1 所示。\n\n![Figure\
    \ 4-1: Search on your own name in your favorite search engine.](img/f04001.png)\n\
    \n图 4-1：在你喜欢的搜索引擎中搜索你自己的名字。\n\n任何在互联网上的人都可以发现我做什么、我在哪里工作，以及我写过书并发布过编程和网络安全的在线课程。点击结果链接会显示更多信息，包括我\
    \ 2018 年开的那种车以及我的一些电子邮件地址。同样，你可能出现在工作活动、新闻文章、体育队伍、教会或非营利组织以及社交媒体页面和帖子的照片中。你的名字或图片甚至可能出现在关于你的家人或高中/大学同学聚会的文章中——这些是你意想不到会出现在互联网上的事情。\n\
    \n通常只需几分钟的侦察就能发现某人在哪里工作、住在哪里、年龄多大、家庭成员是谁等信息。单独来看，这些信息中的任何一条可能都不太令人担忧，但如果可用的信息足够多，攻击者就可以构建一份关于你的完整档案，其中包含家庭成员的姓名和出生日期、宠物的名字、工作和家庭位置等。掌握这些信息后，攻击者可能能够回答你的密码安全问题，完全猜出你的某个密码，或者假装成你认识的人，以便从你那里获取更多信息。\n\
    \n保护个人信息比以往任何时候都更难，但一点点意识可以帮助你避免一些常见错误。掌握一些技能将帮助你找到可能已经泄露的关于你、你的公司或你的家人的信息，包括你的在线账户和密码。\n\
    \n## 高级 Google 搜索\n\n简单的网络搜索是很好的侦察手段，但 Google 的真正威力——Google hacking——来自于使用高级搜索命令。通过高级搜索，你可以找到用户名、密码、安全摄像头信息流等。然而，Google\
    \ hacking 技术也会增加你意外下载恶意软件的风险。为了保护自己，请务必使用以下防御措施：\n\n*   在你在第 3 章中设置的 Kali Linux\
    \ 虚拟机内进行研究。请记住：在虚拟机中执行的操作通常不会影响你的计算机，因此虚拟机提供了一层安全保障。如果你在虚拟机中打开受感染的文件，可以简单地删除并重新安装虚拟机。\n\
    \n*   在点击链接之前，检查链接是否已被病毒感染。即使在虚拟机中，这也是一个良好的安全措施。VirusTotal 是一个免费的在线工具，用于扫描网页、文件和链接中的恶意软件。我们将在下一节使用\
    \ VirusTotal 在打开前扫描一个密码文件。\n\n*   确保你的计算机已安装杀毒软件，以防你意外点击虚拟机外部的链接，并在研究过程中使恶意软件进入你的计算机。\n\
    \nGoogle hacking 依赖于对 `search operators` 的精巧使用，这些符号或词语可以使你的搜索结果更加精确。你可能已经熟悉一些基本的搜索运算符。例如，在短语周围加上引号（“\
    \ ”）可以搜索确切的短语，而不是短语中的单个词。使用运算符 `AND` 和 `OR` 可以帮助你找到同时包含两个词（`3D` AND `printer`）或其中一个词（`coding`\
    \ OR `cyber`）的页面。\n\n其他搜索运算符不那么为人所知，但它们可以成为强大的黑客工具。例如，运算符 `ext:` 用于搜索特定的 `file\
    \ extensions`，即不同类型文件的文件名后缀。示例包括用于 Microsoft Word 文档的 `docx`、用于纯文本的 `txt`、用于 PDF\
    \ 文件的 `pdf`、用于 Microsoft Excel 电子表格的 `xlsx` 等等。运算符 `site:` 用于搜索特定网站上的结果；你可能会搜索\
    \ `site:nostarch.com` 或 `site:yourcompany.com`。\n\n黑客知道如何使用这些运算符来查找特定类型的文件，这些文件可能包含更有价值的信息，例如特定类型视频监控摄像头的默认密码，该密码存储在摄像头用户手册的在线\
    \ PDF 版本中。为客户进行侦察的道德黑客可以使用这些定向搜索词，帮助公司删除无意中暴露在公众视野中的敏感数据，例如显示公司去年购买了哪个品牌视频监控摄像头的预算电子表格。\n\
    \n### 使用 ext: 运算符查找密码\n\n互联网上充满了敏感信息，如人们的用户名和密码，如果你知道在哪里以及如何查找的话。让我们尝试使用 `ext:`\
    \ 搜索运算符来查找包含密码的电子表格。\n\n在你的虚拟机中，打开网络浏览器，访问 `https://www.google.com/`，并在搜索字段中输入\
    \ `ext:xls password`，如 图 4-2 所示。\n\n请记住 `not` 点击任何结果，因为熟练的攻击者很容易在受感染的电子表格文件中隐藏病毒或勒索软件（或者让受感染的网页在搜索引擎看来像电子表格）。`Ransomware`\
    \ 是一种讨厌的恶意软件，它会加密你的所有文件，并要求你支付赎金才能取回数据，所以要小心！\n\n你可能会在搜索页面上直接找到几十个用户名和密码，并且可以添加其他搜索词来进一步定向搜索。例如，我在搜索中添加了\
    \ DCCC（民主国会竞选委员会的缩写），图 4-2 中的顶部结果显示了据称由试图干预 2016 年美国总统选举的黑客窃取的 2016 年美国选举活动密码。\n\
    \n![Figure 4-2: Typing `ext:xls password` finds Excel spreadsheets filled with\
    \ usernames and passwords.](img/f04002.png)\n\n图 4-2：输入 `ext:xls password` 可以找到充满用户名和密码的\
    \ Excel 电子表格。\n\n一旦你找到了感兴趣的搜索结果，请按照以下步骤操作：\n\n1.  复制其中一个文件的 URL：在 Google 结果中高亮显示链接地址，右键单击或\
    \ CONTROL\\-click（在 Mac 上），然后选择 `Copy link address` 或 `Copy link location`。\n\n\
    2.  在新的浏览器标签页中打开 VirusTotal (`https://www.virustotal.com`/`)`，点击 `URL` 选项卡，并将复制的\
    \ URL 粘贴到搜索字段中，如 图 4-3 所示。\n\n    ![Figure 4-3: Check suspicious web links before\
    \ clicking them by scanning them through VirusTotal.](img/f04003.png)\n\n    图\
    \ 4-3：在点击可疑网络链接之前，通过 VirusTotal 扫描它们进行检查。\n\n3.  点击搜索图标（放大镜）来扫描链接。在 图 4-4 中，VirusTotal\
    \ 已使用 60 多个不同的杀毒引擎扫描了密码电子表格文件，且没有发现任何感染迹象。\n\n"
