- raw: "6.  Click the back button (left arrow) in the black band at the bottom of\
    \ your Android screen, and you’ll see a list of permissions the Meterpreter trojan\
    \ app, called MainActivity, is requesting: settings, pictures, videos, contacts,\
    \ GPS, mic, call logs, text messages, SD card access . . . virtually every permission\
    \ your smartphone can allow! Click **Next** at the bottom right of the permission\
    \ window and then click **Install**. If you get a Google Play Protect warning,\
    \ click **Install Anyway**. \n\n7.  Click the home button (the circle in the middle)\
    \ at the bottom of your Android VM’s screen. Then click and drag the screen up\
    \ to reveal your installed apps. Click the MainActivity icon to start the trojan\
    \ app.\n\n8.  Switch back to your Kali VM, and you’ll see a new session has opened\
    \ in Meterpreter.\n\nOur trojan on the Android device has called home to Kali\
    \ and is waiting for commands. Let’s see what we can do once we take control.\n\
    \n## Controlling the Android VM\n\nThe threat from malicious mobile apps is just\
    \ as real as the threat of malware on PCs. If you install malware on your smartphone,\
    \ an attacker will have access to *a lot* of sensitive information: every picture\
    \ and video you’ve ever taken, all your contacts, your call and text message history,\
    \ your GPS location history, every web search you’ve done and YouTube video you’ve\
    \ watched, and a portable camera and microphone an attacker could use to spy on\
    \ you at any time—that’s what you carry with you everywhere you go.\n\nTo see\
    \ exactly how much a malicious hacker can do with an app like the Meterpreter\
    \ trojan, enter `help` in the Meterpreter terminal window. You’ll see a list of\
    \ all available Meterpreter commands. In addition to those we saw in Chapter 6\
    \ when we hacked a Windows PC, there are two sections of commands just for Android\
    \ devices:\n\n```\nAndroid Commands\n================ Command           Description\
    \ -------           ----------- activity_start    Start an Android activity from\
    \ a Uri string check_root        Check if device is rooted dump_calllog      Get\
    \ call log dump_contacts     Get contacts list dump_sms          Get sms messages\
    \ geolocate         Get current lat-long using geolocation hide_app_icon     Hide\
    \ the app icon from the launcher interval_collect  Manage interval collection\
    \ capabilities send_sms          Sends SMS from target session set_audio_mode\
    \    Set Ringer Mode sqlite_query      Query a SQLite database from storage wakelock\
    \          Enable/Disable Wakelock wlan_geolocate    Get current lat-long using\
    \ WLAN information\nApplication Controller Commands\n===============================\
    \ Command        Description -------        ----------- app_install    Request\
    \ to install apk file app_list       List installed apps in the device app_run\
    \        Start Main Activity for package name app_uninstall  Request to uninstall\
    \ application\n```\n\nThe first thing we’ll do to take control of the Android\
    \ device is prevent it from going to sleep. Enter this command at the Meterpreter\
    \ prompt:\n\n```\nmeterpreter > wakelock -w\n```\n\nMeterpreter will reply `Wakelock\
    \ was acquired`, and if your Android device had gone to sleep or changed to a\
    \ black screen before, the screen will wake up and the device will remain awake\
    \ until you release the wakelock.\n\nIt’s easiest to run the Meterpreter commands\
    \ and see their effect if you can display both the Android and Kali VMs on your\
    \ screen at the same time. (This approach is also useful to see what the user\
    \ sees while an attacker is hacking their device.) If you have dual monitors,\
    \ put Kali on one monitor and Android on the other. If you have a single screen,\
    \ try to fit Kali alongside Android so you can see both as you work.\n\n### Running\
    \ Apps\n\nOnce an attacker has taken control of a mobile device, they can remotely\
    \ launch any app they want. To see how it works, let’s list the apps the user\
    \ has installed on their device. In the Meterpreter terminal window, enter the\
    \ command `app_list`. Android will list every app installed on the smartphone,\
    \ including both the name that appears on the app icon and the package Uniform\
    \ Resource Identifier (URI) string for that app. The *URI string* is how we identify\
    \ the various resources on an Android device. For example, you might see the YouTube\
    \ app listed as follows:\n\n```\n  YouTube  com.google.android.youtube  false\
    \  true\n```\n\nThe final two entries on the line tell you whether the app is\
    \ running and whether it’s a system app installed by the operating system. Here,\
    \ the `false` value tells us that the YouTube app is not currently running, and\
    \ the `true` value indicates that it is a standard app installed as part of the\
    \ Android operating system.\n\nNow that we know YouTube is installed on the Android\
    \ device, we can launch it from Meterpreter using the `app_run` command and YouTube’s\
    \ package URI string. Enter the following:\n\n```\nmeterpreter > app_run com.google.android.youtube\n\
    ```\n\nYou’ll see the YouTube app open in your Android VM! Switch back to your\
    \ Android VM and search for the video “Bryson Payne TED Talk.” The YouTube app\
    \ on your Android VM will pull up the video (though you probably won’t be able\
    \ to hear audio through the VM, because VirtualBox’s drivers don’t always work\
    \ for smartphone and tablet operating systems).\n\nYou can run *any app* on the\
    \ infected smartphone or tablet this way, without the user’s permission or interaction\
    \ at all. Try running several more apps, such as Settings (`com.android.settings`)\
    \ or the Phone app (`com.android.dialer`).\n\nYou can also request permission\
    \ to uninstall an app, but the user will be alerted. Try this command:\n\n```\n\
    meterpreter > app_uninstall com.google.android.gm\n```\n\nYour Android VM will\
    \ show a pop-up window asking if you want to uninstall Gmail, as shown in [Figure\
    \ 9-6](#c09.xhtml#figure9-6). Click **Cancel** to keep the Gmail app on your device.\
    \ The security settings on newer Android devices keep the Meterpreter trojan from\
    \ uninstalling the app. However, with superuser access (which we’ll get in “Stealing\
    \ Files and Snooping Around in Logs” on page 117), we could delete the app’s data\
    \ and even its main program files without the user’s knowledge.\n\n![Figure 9-6:\
    \ Android asks the user’s permission before uninstalling an app.](image_fi/502000c09/f09006.png)\n\
    \nFigure 9-6: Android asks the user’s permission before uninstalling an app.\n\
    \nBefore we move on to more devious hacks, let’s run one last app, Contacts:\n\
    \n```\nmeterpreter > app_run com.android.contacts\n```\n\nThe Contacts app will\
    \ open in your Android VM. While it’s open, we’ll add a contact so we can steal\
    \ it in Meterpreter later.\n\n1.  Click the Add Contact icon (a red circle with\
    \ a plus sign, +) in the lower-right of your Contacts screen in Android. \n\n\
    2.  Android will ask you to add an account to access your Google contacts. Click\
    \ **Cancel**. (You don’t need to log in to your Google account to add contacts\
    \ to your virtual smartphone.)\n\n3.  The Create New Contact window will appear.\
    \ Enter your name, a fake phone number or two, and a fake email address, as shown\
