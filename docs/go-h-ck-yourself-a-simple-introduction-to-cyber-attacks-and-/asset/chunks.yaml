    \ YouTube 应用将调出该视频（不过你可能无法通过虚拟机听到音频，因为 VirtualBox 的驱动程序并不总是适用于智能手机和平板电脑操作系统）。\n\
    \n你可以通过这种方式在受感染的智能手机或平板电脑上运行任何应用，无需用户的许可或任何交互。尝试运行更多应用，例如设置（`com.android.settings`）或电话应用（`com.android.dialer`）。\n\
    \n你也可以请求卸载应用的权限，但用户会收到警报。尝试此命令：\n\n```\nmeterpreter > app_uninstall com.google.android.gm\n\
    ```\n\n你的 Android 虚拟机将显示一个弹出窗口，询问你是否要卸载 Gmail，如 图 9-6 所示。单击 `Cancel` 以保留设备上的 Gmail\
    \ 应用。较新 Android 设备上的安全设置会阻止 Meterpreter 木马卸载该应用。但是，拥有超级用户权限（我们将在“窃取文件和在日志中窥探”第\
