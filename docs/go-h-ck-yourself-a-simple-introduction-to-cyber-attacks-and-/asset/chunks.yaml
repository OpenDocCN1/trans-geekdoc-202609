    \ `ext:txt` 或 `ext:pdf` 来检查其他包含密码的文件类型。\n\n现在尝试专门搜索你自己的信息。搜索你的用户名和单词 `password`，并添加\
    \ `ext:` 运算符来查找各种文件类型（例如，`bryson_payne AND password ext:xls`）。*永远不要在 Google 或任何其他搜索引擎中输入你的实际密码。*\n\
    \n如果你在网上发现自己的密码被公开，请立即更改。\n\n### 使用 site: 运算符查找密码\n\n你可以使用 `site:` 搜索运算符在特定网站上查找泄露的密码。例如，在\
    \ Figure 4-5 中，我在 Google 中输入了 `site:ung.edu password`，以查找我所在大学（北佐治亚大学）的任何学生或教职员工密码是否存储在我们的公共\
    \ Web 服务器上。这种情况发生的频率比你想象的要高——有时私有文件或文件夹会意外地存储在公共服务器上，或者教师或管理员可能会暂时上传一个密码文件供新用户使用，却忘记删除。\n\
    \n ![Figure 4-5: Use the site: search operator to search for results on a specific\
    \ organization’s website.](img/f04005.png)\n\nFigure 4-5: Use the `site:` search\
    \ operator to search for results on a specific organization’s website.\n\n如你所见，没有列出文本文件或电子表格，但底部的结果是一篇关于向新生分配默认密码的旧新闻文章。当这篇文章发表时，攻击者本可以利用默认密码信息来猜测成千上万名学生的初始密码。\n\
    \n你还可以将 `site:` 运算符与其他运算符结合使用。例如，`ext:pdf site:ung.edu bryson_payne AND password`\
    \ 会搜索我所在大学网站上包含我的用户名和单词 `password` 的 PDF 文件。\n\n这些只是你可以在 Google 中用来查找敏感信息的几个搜索运算符。多年来，其他黑客创建了一个\
    \ Google 技巧数据库，用于记录有用的搜索运算符组合。\n\n### Google 技巧数据库\n\n`Google Hacking Database`\
    \ (`GHDB`) 是一个公开列表，包含数千个 Google 搜索运算符组合，可用于查找密码、连接到互联网的特定类型设备或设备、具有漏洞的特定 Web 应用程序等。\n\
    \nGHDB 是由 Hackers for Charity 的 Johnny Long 发起的项目；该数据库现在由 Offensive Security 维护，该团队也支持\
    \ Kali Linux 和其他黑客及安全工具。你可以在 [`www.exploit-db.com/google-hacking-database/`](https://www.exploit-db.com/google-hacking-database/)\
    \ 找到 GHDB，或者在搜索引擎中搜索“Google Hacking Database”。\n\n访问 [`www.exploit-db.com/google-hacking-database/`](https://www.exploit-db.com/google-hacking-database/)\
    \ 上的 GHDB，并在搜索框中输入 `password`，如 Figure 4-6 所示。数据库将显示所有包含单词 `password` 的 `search\
    \ queries`（运算符和要搜索的文本的组合）。\n\n ![Figure 4-6: The Google Hacking Database password\
    \ search queries](img/f04006.png)\n\nFigure 4-6: The Google Hacking Database password\
    \ search queries\n\n点击 GHDB 中的任何条目都将显示有关该特定搜索查询的信息，你甚至可以直接前往 Google 尝试该搜索。\n\n\
    黑客将 GHDB 上找到的高级搜索称为 `Google dorks`，将使用它们的过程称为 `dorking`。攻击者使用 dorking 不仅是为了查找用户名和密码的电子表格，还为了查找带有默认管理员密码的产品\
    \ PDF，或者查找带有 Web 界面的易受攻击设备，例如监控摄像头甚至楼宇恒温器控制，仅举几例。像 `intext:username ext:log` 这样的\
    \ Google dork 可以暴露可能包含数据库用户名和密码等有用信息的服务器日志。像这样的高级搜索技术可以为黑客节省大量时间。\n\n### 道德黑客如何使用\
    \ Google\n\n如果一家公司雇佣道德黑客来测试其安全性，黑客会将其侦察搜索集中在公司、其供应商和供应商、员工、客户等方面。如果黑客在侦察过程中发现密码或其他敏感信息，他们会通知公司，以便其锁定账户、让用户更改密码或采取其他必要措施。你在为本书进行侦察时发现的任何信息，都应该以同样的方式对待。\n\
    \n假设你发现了你办公室、你孩子学校或你朋友或家人账户的密码。首先，永远不要亲自尝试那些密码；那就像找到某人的钥匙并未经允许尝试打开那个人家门一样令人不安且不道德。道德黑客会向公司或学校的\
    \ IT 员工报告潜在的密码泄露，或者他们会告诉朋友或家人，他们的密码可能已被泄露，并且应立即更改任何使用该密码或类似密码的账户的密码。\n\n## 社交媒体与过度分享的危险\n\
    \n除了 Google 搜索之外，黑客还有一个触手可及的、令人毛骨悚然的简单侦察工具：社交媒体。你可能会惊讶——甚至有点害怕——发现 Google 已经掌握了你多少信息。然而，你可能每天或每天多次通过社交媒体泄露更具体、更敏感的信息。\n\
    \n这里有一个你可以自己做并与朋友或家人分享的快速练习：花五分钟时间，在你最喜欢的社交媒体账号上对自己进行一次快速侦察任务。你能找出你住在哪里、你养了什么宠物（以及它们叫什么名字）、你在哪里工作，或者你的配偶和孩子的名字吗？你最近生日的帖子呢？根据帖子的日期和提到的年龄（例如，如果有人发布了“祝\
    \ 29 岁生日快乐！”），攻击者能否算出你的准确出生日期和年份？你还能发现关于你经常去的地方（例如体育赛事）以及你与之共度时光的人的哪些信息？\n\n发布关于你的工作、爱好、孩子、旅行、宠物或周末活动的信息，会向潜在攻击者泄露你的位置和兴趣。试图进入你账户的攻击者会尝试使用他们在网上找到的个人信息（例如宠物的名字、你的生日或你最喜欢的餐厅）来猜测或重置你的密码。更糟糕的是，如果你在还在外出度假时发布度假照片，任何能够访问你帖子的人都可能推断出你的家可能空无一人，因此入室盗窃的风险较低。\n\
    \n即使分享一张你的猫或狗的照片也可能很危险，因为图像文件本身可能会泄露你的位置，你将在下一节中了解这一点。\n\n### 位置数据——社交媒体不言而喻的危险\n\
    \n"
