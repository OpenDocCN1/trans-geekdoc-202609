    \ against them, you’ll set up your own private virtual hacking lab in Chapter\
    \ 3.\n\n# 3  \n\nBuilding Your Own Virtual Hacking Lab\n\n![](image_fi/book_art/chapterart.png)\n\
    \nTo learn hacking safely and ethically, you’ll use *virtual machines (VMs)*,\
    \ programs that emulate separate computers within your physical desktop or laptop.\
    \ You can isolate a VM so anything you do in it won’t affect your computer or\
    \ your network. For example, if you open a file with a virus in a VM, the virus\
    \ would infect only the virtual machine, not your real computer.\n\n*Virtualization\
    \ software* lets you run a virtual machine (called a *guest*) on your desktop\
    \ or laptop (the *host*). In this chapter, we’ll install VirtualBox, a free virtualization\
    \ program, and the VirtualBox Extension Pack. Then we’ll create two VMs. The first\
    \ will be an *attacking* VM running the Kali Linux operating system. You’ll use\
    \ this VM to launch your hacks. The other virtual machine will be a *target* VM\
