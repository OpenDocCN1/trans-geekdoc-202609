    \ only if the hacker has physical access to the stored passwords, so the key to\
    \ preventing an attack is either not storing passwords in your browser at all\
    \ or limiting the following:\n\n1.  Where you store passwords Store a password\
    \ in a browser only on a computer or device you own and keep with you, never on\
    \ a public computer.\n\n2.  Which passwords you store Never store your email password,\
    \ because an attacker can usually discover or reset all your other passwords with\
    \ your email account.\n\n3.  Who has access to your computer Keep your computer\
    \ with you or stored in a safe place, and don’t leave it open if you have to step\
    \ away, even for a minute.\n\nIf you must connect to a private account from a\
