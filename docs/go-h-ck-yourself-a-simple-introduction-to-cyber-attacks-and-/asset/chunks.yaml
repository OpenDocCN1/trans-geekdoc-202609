    \ password habits for life:\n\n*   *Don’t* use the same password across multiple\
    \ accounts.\n\n*   *Don’t* reuse a password by adding numbers or symbols to the\
    \ end (or middle or beginning).\n\n*   *Don’t* write passwords down or store them\
    \ in plaintext documents or spreadsheets.\n\n*   *Do* use long passphrases with\
