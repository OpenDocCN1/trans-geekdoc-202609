  trans: '


    5. 一旦进入启动 BIOS 或 UEFI 设置，请找到虚拟化设置并将其打开。你可能需要使用方向键、空格键或 `ENTER` 键来导航外观较为老旧的菜单。每个品牌的
    PC 的 BIOS 略有不同，因此只需查找类似于“虚拟化技术”、“VT-x”或“VT-d”的菜单选项即可。这些选项通常位于 Advanced、System
    或 CPU 设置下。


    6. 启用或打开虚拟化，保存更改，然后退出以重新启动进入 Windows。


    7. 重新启动 VirtualBox 并再次打开 Kali VM。


    ## One Last Issue: Certain Antivirus Programs


    如果尝试了刚才讨论的所有虚拟化设置，并且下载并重新安装了正确的 VirtualBox 和 VM 文件后，VM 仍然无法启动，那么你的计算机杀毒软件可能正在阻止
    VirtualBox。在线搜索是否有其他人遇到相同问题（我的学生曾遇到 WebRoot SecureAnywhere 以及某些版本的 Avast 和 Symantec
    的问题），因为你可能能够为 VirtualBox 添加排除项，以便杀毒软件不会阻止它。作为最后的手段，尝试使用安装了不同杀毒应用程序的计算机或更换杀毒程序。


