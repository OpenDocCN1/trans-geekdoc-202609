    ```\n\nThe HTML `<script>` tag tells a web page that a *script* (a short piece\
    \ of code), usually in JavaScript, is beginning. The `</script>` tag is called\
    \ a closing tag, and it lets the web page know the script code is finished.\n\n\
    #### Reflected Cross-Site Scripting"
