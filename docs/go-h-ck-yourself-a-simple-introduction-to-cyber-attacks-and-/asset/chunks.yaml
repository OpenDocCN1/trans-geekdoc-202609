    \n4. 进入 BIOS 后，找到启动选项，更改启动设备的顺序或优先级（通常使用方向键），将 USB 或 DVD 设为首选项。然后保存更改并退出 BIOS。\n\
    \n5. 再次重启计算机。你应当会短暂地看到消息 `Press any key to boot from CD or DVD` 或 `Press any key\
