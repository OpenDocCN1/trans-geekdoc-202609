    \ can’t make calls or receive text messages, but we did add a contact in the previous\
    \ section. Let’s steal it now.\n\n1. Run the `dump_contacts` command in Meterpreter:\n"
  trans: "\n\n6. 单击 Android 屏幕底部黑色条中的返回按钮（左箭头），你将看到 Meterpreter 木马应用（名为 `MainActivity`）正在请求的权限列表：设置、图片、视频、联系人、GPS、麦克风、通话记录、短信、SD\
