- raw: "At this point, an unethical hacker would open one or more of the spreadsheets\
    \ to see if they could find usable login and password information. As ethical\
    \ hackers, we can choose to respect people’s privacy and not open the file. Or,\
    \ if we were performing the search on behalf of a client, we could check the file\
    \ and let them know their information might be exposed online.\n\n ![Figure 4-4:\
    \ The password spreadsheet we selected appears safe to open.](image_fi/502000c04/f04004.png)\n\
    \nFigure 4-4: The password spreadsheet we selected appears safe to open.\n\nTry\
    \ the search again, but now type `ext:txt` or `ext:pdf` to check for other file\
    \ types containing passwords.\n\nNow try searching specifically for your own information.\
    \ Search for your username and the word *password*, adding the `ext:` operator\
    \ to look for various file types (for example, `bryson_payne AND password ext:xls`).\
    \ *Never type your actual password into Google or any other search engine.*\n\n\
    If you find a password of your own posted online, change it immediately.\n\n###\
    \ Finding Passwords with the site: Operator\n\nYou can use the `site:` search\
    \ operator to look for leaked passwords on a specific website. For example, in\
    \ [Figure 4-5](#c04.xhtml#figure4-5), I’ve typed `site:ung.edu password` into\
    \ Google to find out whether any student or faculty passwords from my university,\
    \ the University of North Georgia, are stored on our public web server. This actually\
    \ happens more often than you’d think—sometimes a private file or folder accidentally\
    \ gets stored on a public server, or a teacher or administrator might put a password\
    \ file up temporarily for new users and forget to remove it.\n\n ![Figure 4-5:\
    \ Use the site: search operator to search for results on a specific organization’s\
    \ website.](image_fi/502000c04/f04005.png)\n\nFigure 4-5: Use the `site:` search\
    \ operator to search for results on a specific organization’s website.\n\nAs you\
    \ can see, there are no text files or spreadsheets listed, but the bottom result\
    \ is an old news article about the default password assigned to incoming university\
    \ students. At the time that article appeared, an attacker could have used the\
    \ default password information to guess thousands of students’ initial passwords.\n\
    \nYou can also combine the `site:` operator with other operators. For example,\
    \ `ext:pdf site:ung.edu bryson_payne AND password` searches for PDF files on my\
    \ university’s website that contain my username and the word *password*.\n\nThese\
    \ are just a few of the search operators you can use in Google to find sensitive\
    \ information. Over the years, other hackers have created a database of Google\
    \ hacks to record useful search operator combinations.\n\n### The Google Hacking\
    \ Database\n\nThe *Google Hacking Database* *(GHDB)* is a public listing of thousands\
    \ of Google search operator combinations that can be used to find passwords, specific\
    \ types of devices or equipment connected to the internet, particular web applications\
    \ with vulnerabilities, and more.\n\nGHDB was a project started by Johnny Long\
    \ of Hackers for Charity; the database is now maintained by Offensive Security,\
    \ the same team that supports Kali Linux and other hacking and security tools.\
    \ You can find the GHDB at [https://www.exploit-db.com/google-hacking-database/](https://www.exploit-db.com/google-hacking-database/)\
    \ or by searching for “Google Hacking Database” in your search engine.\n\nGo to\
    \ the GHDB at [https://www.exploit-db.com/google-hacking-database/](https://www.exploit-db.com/google-hacking-database/)\
    \ and enter `password` in the search box, as shown in [Figure 4-6](#c04.xhtml#figure4-6).\
    \ The database will display all *search queries* (combinations of operators and\
    \ text to search for) that contain the word *password*.\n\n ![Figure 4-6: The\
    \ Google Hacking Database password search queries](image_fi/502000c04/f04006.png)\n\
    \nFigure 4-6: The Google Hacking Database password search queries\n\nClicking\
    \ any of the entries in the GHDB will show information about that specific search\
    \ query, and you can even go directly to Google and try the search.\n\nHackers\
    \ refer to advanced searches like the ones found on the GHDB as *Google dorks*\
    \ and to the process of using them as *dorking*. Attackers use dorking not only\
    \ to find spreadsheets of usernames and passwords but also to find product PDFs\
    \ with default administrator passwords, or to find vulnerable devices like surveillance\
    \ cameras or even building thermostat controls that have web interfaces, to name\
    \ a few examples. A Google dork like `intext:username ext:log` can expose server\
    \ logs that might contain useful information like database usernames and passwords.\
    \ Advanced search techniques like these save hackers tons of time.\n\n### How\
    \ Ethical Hackers Use Google\n\nIf a company hires an ethical hacker to test its\
    \ security, the hacker will keep their reconnaissance searches focused on the\
    \ company, its vendors and suppliers, employees, customers, and so on. If the\
    \ hacker discovers passwords or other sensitive information in the course of their\
    \ reconnaissance, they would inform the company so it could lock the accounts,\
    \ have users change the passwords, or take other action as needed. You should\
    \ approach any information you discover during your reconnaissance for this book\
    \ in the same way.\n\nSuppose you find passwords from your office, your kids’\
    \ school, or your friends’ or family’s accounts. First, never try those passwords\
    \ yourself; that would be as creepy and unethical as finding someone’s keys and\
    \ trying to open that person’s front door without permission. An ethical hacker\
    \ would report the potential password leak to an IT employee at the company or\
    \ school, or they would tell the friend or family member that their password might\
    \ be exposed and that they should immediately change the password for any account\
    \ that uses that password or a similar one.\n\n## Social Media and the Dangers\
    \ of Oversharing\n\nIn addition to Google searches, hackers have another frighteningly\
    \ easy reconnaissance tool at their disposal: social media. You might have been\
    \ surprised—even a bit scared—to find out how much information Google already\
    \ has about you. However, you may be leaking much more specific and sensitive\
    \ information every day, or several times per day, through social media.\n\nHere’s\
    \ a quick exercise you can do for yourself and share with friends or family: take\
    \ five minutes to do a quick recon mission about yourself on your favorite social\
    \ media account or accounts. Can you find out where you live, what kind of pets\
    \ you have (and what their names are), where you work, or the names of your spouse\
    \ and children? What about posts from your most recent birthday? From the date\
    \ of the posts and the age mentioned (for example, if someone posted “Happy 29th\
    \ Birthday!”), could an attacker figure out your exact date and year of birth?\
    \ What else can you find about the places you go regularly, like sporting events,\
    \ and the people you spend time with?\n\nPosting information about your job, hobbies,\
    \ kids, trips, pets, or weekend activities gives away your location and interests\
    \ to potential attackers. An attacker who’s trying to get into your account will\
    \ try to guess or reset your password using personal information they find online,\
    \ like a pet’s name, your birthday, or your favorite restaurant. Worse yet, if\
    \ you post vacation photos while you’re still away from home, anyone with access\
    \ to your posts could figure out your home might be empty and therefore less risky\
    \ to break into.\n\nEven sharing a picture of your cat or dog can be dangerous,\
    \ because the image file itself can give away your location, as you’ll see in\
    \ the next section.\n\n### Location Data—Social Media’s Unspoken Danger"
