    在本章中，我们使用了`ICSim`和`can-utils`来攻破一个虚拟汽车网络。我们在 Kali 虚拟机上设置了这些工具。然后我们使用`cansniffer`嗅探网络流量，以查看
    CAN 数据的样子。我们使用`candump`捕获 CAN 信号，然后使用`canplayer`重放这些数据包，以在不使用汽车键盘控制的情况下更改仪表盘。我们还使用`cansend`发送特定的
    CAN 消息，以使用转向灯、更改速度表，并直接从命令行解锁车门。最后，我们了解到，只需大约价值 100 美元的工具和大量的耐心，就可以攻破一辆真实的汽车。


    # 11


    十件你现在就可以做的事情来保护自己在线安全


    ![](img/chapterart.png)


    你已经读完了这本书，但你作为道德黑客的旅程才刚刚开始。你现在知道坏人使用的技巧和工具——以及如何防御主要的攻击来源（物理攻击、社交工程、搜索引擎侦察、汽车和物联网攻击、恶意软件、密码破解、Web
    服务器攻击和移动设备攻击）。换句话说，你已经学会了先攻击你自己！本章是对你可以采取的 10 件最重要的事情的快速回顾，以保护你自己和你关心的人免受线上和现实世界中的攻击。


    ## 1\. 意识到你是目标。


    人们有时会说，“这永远不会发生在我身上”或“我无能为力”，然后他们最终成为恶意攻击的受害者。本书向你展示了攻破大多数设备出乎意料地简单，没有人能完全免受在线威胁。然而，通过采取一些明智的预防措施，你至少可以避免成为攻击者的`易`攻击目标。意识到你是一个潜在目标——并且你的个人信息对普通黑帽黑客来说很有价值——是保护你自己和你关心的人的重要第一步。


    ## 2\. 警惕社交工程。


    如果有人试图让你做某事，无论是在线上还是线下，请停下来思考这是否符合你的最大利益。从咄咄逼人的二手车销售人员到网络犯罪分子再到网络掠食者，攻击者利用人类心理学来试图诱骗我们做他们想要的事。


    要意识到并小心对待对你隐私的威胁。如果有人要求你提供个人信息，请考虑他们到底是谁。他们要求什么，为什么需要这些信息？尽可能避免被迫完全放弃你的信息：屏蔽不需要的联系人和社交媒体连接，删除可疑电子邮件而不回复，挂断自动语音电话，并删除垃圾短信。这些烦扰中的任何一个都可能是攻击者的入侵方式。


    与此同时，约束自己不要在社交媒体上分享太多信息。在发布、拍照、推特或分享之前，想想谁能看到你的帖子以及他们可能会用这些信息做什么。你和你朋友的照片、你去过的地方（`永远`不要在度假期间发布度假照片）以及你喜欢的东西，都可能被攻击者用来诱骗你信任他们。


    如果不确定，请与你信任的人交谈；向 FTC 报告网络犯罪，网址为 [`www.ftc.gov/`](https://www.ftc.gov/)，或向 FBI
    报告，网址为 [`www.ic3.gov/`](https://www.ic3.gov/)，并向当地当局报告网络欺凌、跟踪或骚扰行为。


    ## 3\. 记住物理安全的重要性，并在可能时关闭设备。


    物理访问即完全访问，因此要像对待在线安全一样小心对待物理安全。锁好门，保护好你的财物，并小心将什么插入你的计算机。如果你在咖啡店离开笔记本电脑哪怕几分钟，攻击者就可以访问你的文件或带走整台电脑。插入计算机的闪存驱动器或其他设备可用于窃取文件或启动恶意软件。


    当你不使用计算机连接（如`Bluetooth`或`Wi-Fi`）时，请将其关闭。除了节省电池寿命，你还会阻止攻击。移动设备也是如此，在使用完应用程序后也应该关闭它们。如果可能，晚上关闭你的电脑和手机。你会因为多了一份安心而睡得更好——而且每个月还能省下几美元的电费！


    ## 4\. 点击前务必三思。


    如果你不确定电子邮件的来源，请不要打开任何链接或附件。在点击之前，仔细检查网络链接——或者将它们通过`VirusTotal`进行检测。更好的做法是，打开一个新浏览器并搜索真实网站，而不是点击电子邮件中的链接，即使它看起来很合法。


    除非你信任来源，否则不要从网上下载或安装软件，即使信任，也要先在`VirusTotal`或你的病毒扫描程序中检查。不要打开可疑的附件，包括 Office 文档、PDF
    和视频；验证来源或扫描文件以查找病毒会更安全。不要共享或下载非法文件或盗版软件、音乐或电影。恶意黑客喜欢在这些“免费”文件中隐藏恶意的惊喜。


    只从官方应用商店安装移动应用程序。在安装新应用程序之前，阅读应用程序请求的权限列表。游戏或简单的应用程序不应该需要访问你的联系人、通话记录或短信——除了像`Pokémon
    Go`这样的增强现实或基于位置的应用程序，应用程序不应该需要你的位置。如果应用程序要求的权限超过你认为它应该需要的权限，请删除它并寻找一个使用更少权限就能完成你想要的事情的应用程序。


    ## 5\. 使用密码管理器并开启双重身份验证。


    大多数人的密码可以在几秒钟或几分钟内被破解。八个字符的密码永远不够。使用四个或更多单词的易记密码，并混合字符类型（包括字母、数字、符号，甚至非键盘字符）。不要在多个网站重复使用同一个密码；即使你添加数字或特殊字符，黑客也只需几秒钟就能破解与他们已知密码相似的密码。


    不要将密码存储在浏览器中——记住，你只需点击几下就可以泄露这些密码！相反，使用`密码管理器`，如`KeePass`、`Dashlane`、`LastPass`或类似工具。密码管理器会为你所有账户随机生成难以破解的复杂（20
    个字符以上）密码，并以加密形式存储它们。你设置一个长密码来访问你的密码管理器，然后让密码管理器自动处理所有其他密码，这样你就不必记住它们了。


    密码管理器被认为是安全的，因为它们实际上使用军用级加密来加密你的密码。这与我们在第 1 章中看到的浏览器使用的“通过隐蔽性实现安全”截然不同。密码管理器不是简单地隐藏你的其他密码，而是通过使密码在没有你的长密码的情况下无法恢复来保护它们。打个比方，密码管理器就像把你的房门钥匙放在一个固定在路边的、带有
    20 位数字组合锁的两吨防弹保险箱里，而不是把钥匙藏在门垫下面。通过在存储前实际加密你的密码，密码管理器（配合一个好的密码）提供真正的安全性，而不仅仅是隐蔽性。


    '
