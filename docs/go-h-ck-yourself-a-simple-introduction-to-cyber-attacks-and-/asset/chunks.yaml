    \ from the Edge browser in our Windows 10 VM.\n\nStart your Windows 10 VM in VirtualBox\
    \ Manager. Log in with the credentials `IEUser` and `Passw0rd!`. Open the Edge\
    \ browser (it’s the blue `e` swirl icon on the taskbar) and enter your Metasploitable\
    \ VM’s IP address into the address bar. You’ll see the Metasploitable 2 home page\
    \ shown in [Figure 8-3](#c08.xhtml#figure8-3).\n\n![Figure 8-3: From your Windows\
    \ 10 VM, enter your Metasploitable VM’s IP address to see this home page.](image_fi/502000c08/f08003.png)\n\
    \nFigure 8-3: From your Windows 10 VM, enter your Metasploitable VM’s IP address\
    \ to see this home page.\n\nMetasploitable 2 contains five vulnerable web applications,\
    \ but we’ll focus on just one of them: DVWA, or Darn Vulnerable Web App. This\
    \ intentionally vulnerable open source web application was built to help web developers\
    \ and security professionals learn basic hacks, as well as how to protect a web\
    \ application from them. DVWA has different vulnerability levels so users can\
    \ try hacking applications with varying degrees of security. We’ll set the security\
    \ level to low, to simulate a web application with no added security.\n\n1. Click\
    \ the `DVWA` link on the Metasploitable 2 home page. You’ll see the app’s login\
    \ screen, shown in [Figure 8-4](#c08.xhtml#figure8-4).\n\n2. Enter `admin` as\
    \ the username and `password` as the password to access DVWA.\n\n    ![Figure\
    \ 8-4: The DVWA login screen with our credentials](image_fi/502000c08/f08004.png)\n\
    \n    Figure 8-4: The DVWA login screen with our credentials\n\n3. Click `DVWA\
    \ Security` on the left.\n\n4. Under the Script Security section, set the security\
    \ level to `low` and click `Submit`, as shown in [Figure 8-5](#c08.xhtml#figure8-5).\n\
    \n    ![Figure 8-5: Setting the DVWA script security level to low](image_fi/502000c08/f08005.png)\n\
    \n    Figure 8-5: Setting the DVWA script security level to low\n\nNow we’re ready\
    \ to try out two kinds of web attacks on DVWA: cross-site scripting attacks and\
    \ SQL injection attacks.\n\n### Launching Cross-Site Scripting Attacks\n\nIn a\
    \ cross-site scripting (XSS) attack, a hacker enters malicious code into a web\
    \ page through a field intended for regular text input, such as a login form or\
    \ a search field. XSS attacks are also known as code injection attacks, because\
    \ hackers are able to enter, or inject, their own code into the web application.\
    \ We’ll use two web languages—JavaScript and HyperText Markup Language (HTML)—to\
    \ inject a script into DVWA.\n\nTo test a web application for XSS vulnerabilities,\
    \ you need only a single JavaScript command:\n\n```\nalert(\"You've been hacked!\"\
    );\n```\n\nThe command pops up an alert box reading “You’ve been hacked!” To inject\
    \ it into a web page, we wrap the JavaScript code in the proper HTML tags, `<script>`\
    \ and `</script>`, like this:\n\n```\n<script>alert(\"You've been hacked!\");</script>\n\
    ```\n\nThe HTML `<script>` tag tells a web page that a script (a short piece of\
    \ code), usually in JavaScript, is beginning. The `</script>` tag is called a\
    \ closing tag, and it lets the web page know the script code is finished.\n\n\
    #### Reflected Cross-Site Scripting\n"
