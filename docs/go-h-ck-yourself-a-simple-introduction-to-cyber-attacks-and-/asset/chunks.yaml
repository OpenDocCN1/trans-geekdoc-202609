    \ user’s permission before uninstalling an app.](img/f09006.png)\n\n图 9-6：Android\
    \ 在卸载应用前会询问用户权限。\n\n在进行更多恶劣的黑客攻击之前，让我们最后运行一个应用，联系人：\n\n```\nmeterpreter > app_run\
    \ com.android.contacts\n```\n\n联系人应用将在你的 Android 虚拟机中打开。在它打开期间，我们将添加一个联系人，以便稍后在\
