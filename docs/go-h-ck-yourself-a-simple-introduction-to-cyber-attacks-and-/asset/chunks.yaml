    \ Pack, which adds required features like support for attaching newer USB devices\
    \ to your VMs. Go ahead and install it now.\n\n1.  Return to the VirtualBox Downloads\
    \ page ([https://www.virtualbox.org/wiki/Downloads](https://www.virtualbox.org/wiki/Downloads)),\
    \ find the VirtualBox Extension Pack section, and click **All supported platforms**\
    \ to download the Extension Pack.\n\n2.  Open VirtualBox. (On Windows, be sure\
    \ to right-click the VirtualBox icon and choose **Run as administrator**.)\n\n\
    3.  Open the Extension Pack from your *Downloads* folder.\n\n4.  Once the VirtualBox\
    \ Extension Pack installation window opens, click **Install**.\n\n## Creating\
    \ a Kali Linux Virtual Machine\n\nNow that you have VirtualBox, you’ll create\
    \ your Kali Linux virtual machine. Kali is a version of the Linux operating system\
    \ used by ethical hackers worldwide. It includes over 600 security and hacking\
    \ tools, so it’s a perfect operating system for your attacking VM.\n\n1.  Go to\
    \ [https://www.kali.org/downloads/](https://www.kali.org/downloads/), scroll down\
    \ to the Virtual Machines section, and click the link to go to the VM Download\
    \ Page.\n\n2.  Click the **Kali Linux VirtualBox Images** tab to see the download\
    \ options compatible with VirtualBox. Make sure to look for VirtualBox images—there\
    \ are also images made for VMware, a different software package that’s not compatible\
    \ with VirtualBox.\n\n3.  Click **Kali Linux VirtualBox 64-Bit** to download the\
    \ VM. The file is around 4GB, so download it somewhere with a fast internet connection.\n\
    \n4.  Start VirtualBox and select **File**▶**Import Appliance**.\n\n5.  Click\
    \ the folder icon on the right and find your Kali Linux file. Select the file,\
    \ click **Open**, and then click **Next** (on a PC) or **Continue** (on a Mac).\n\
    \n6.  You should now see a list of settings for the Kali Linux VM you’re importing.\
    \ Click **Import** to continue.\n\n7.  When the VM has finished importing, you’ll\
    \ see it listed on the left in the Oracle VM VirtualBox Manager, as shown in [Figure\
    \ 3-1](#c03.xhtml#figure3-1).\n\n![Figure 3-1: The Kali Linux VM appears in the\
    \ list on the left of the VirtualBox Manager.](image_fi/502000c03/f03001.png)\n\
    \nFigure 3-1: The Kali Linux VM appears in the list on the left of the VirtualBox\
    \ Manager.\n\nAs you add other VMs, they’ll appear in the list alongside Kali.\
    \ For now, let’s test the new Kali VM to make sure it runs on your system.\n\n\
    ## Running the Kali VM\n\nDouble-click the Kali Linux VM entry in your VirtualBox\
    \ Manager panel to start up the Kali Linux virtual machine. The first time you\
    \ run a VM in VirtualBox, you may encounter errors due to different settings on\
    \ your Mac or PC. If you have any trouble running VirtualBox or starting your\
    \ Kali VM, see Appendix B.\n\nWhen the VM finishes booting, you’ll come to a login\
    \ screen. Log in with the username `kali` and the password `kali`. After you log\
    \ in, you’ll see a screen with the signature Kali dragon logo like the one shown\
    \ in [Figure 3-2](#c03.xhtml#figure3-2). Welcome to Kali Linux!\n\nUsing a computer\
    \ within a computer takes some getting used to. Once you click inside the VM window,\
    \ your keyboard and mouse are “captured” for use within the VM. To return your\
    \ mouse and keyboard to your physical (host) computer, click your mouse outside\
    \ the VM window or press the *host key* on your keyboard. This should be the *right*\
    \ CTRL key on a PC/Linux machine or the *left* COMMAND key on a Mac. If you ever\
    \ need a reminder, the host key should also be identified in the bottom-right\
    \ corner of the VM window.\n\n ![Figure 3-2: Your Kali Linux VM is ready to go!](image_fi/502000c03/f03002.png)\n\
    \nFigure 3-2: Your Kali Linux VM is ready to go!\n\nIf you find that the VM screen\
    \ and icons are too small, go to **View**▶**Virtual Screen 1** and try changing\
    \ the scale or resolution. Additionally, if you leave your VM alone for a while,\
    \ the VM window may go blank. If this happens, click in the Kali window and press\
    \ the spacebar to wake up the machine.\n\nTake some time to explore Kali Linux.\
    \ You won’t be able to connect to the internet until we set up the network later\
    \ in the chapter, but you can still take a look around. Click the **Applications**\
    \ menu at the top of the screen (the button with the dragon logo) to see some\
    \ of Kali’s hundreds of programs and tools. They may seem intimidating now, but\
    \ this book will teach you to use several of them, helping you become more confident\
    \ in exploring others.\n\nAfter you’ve looked around a bit, close the Kali Linux\
    \ VM window. You should see the Close Virtual Machine pop-up window. Choose **Save\
    \ the machine state** and click **OK**. Saving the machine state lets you pick\
    \ up where you left off the next time you open the VM, like putting your computer\
    \ to sleep instead of powering it completely down. However, if you ever need to\
    \ reboot a VM after installing software or changing settings, you’ll need to choose\
    \ **Power off the machine** instead.\n\nCongratulations! You’ve set up your first\
    \ virtual machine! If this is your first experience with Linux, give yourself\
    \ a high five! With this Kali VM, you’ll be able to test dozens (or even hundreds)\
    \ of hacks against other, target virtual machines to see how online attacks happen\
    \ and how to defend against them. We’ll set up one of those target VMs next.\n\
    \n## Creating a Windows VM\n\nYou’ll now create a second VM that runs Windows.\
    \ As the most common desktop and laptop operating system in the world, Windows\
    \ is the number one target for both ethical and unethical hackers, so it’s an\
    \ important operating system to learn to attack and defend. We’ll download a fully\
    \ functional Windows 10 VM from the Microsoft Edge Developer website.\n\n1.  Go\
    \ to [https://developer.microsoft.com/en-us/microsoft-edge/tools/vms/](https://developer.microsoft.com/en-us/microsoft-edge/tools/vms/)\
    \ (or search for the Microsoft Edge Developer Virtual Machines website).\n\n2.\
    \  Choose a Windows 10 virtual machine, select VirtualBox as your platform, and\
    \ download the VM. The file is over 6GB, so download this VM somewhere with a\
    \ fast internet connection.\n\n3.  Unzip the downloaded file. \n\n4.  Open VirtualBox\
    \ and select **File**▶**Import Appliance**.\n\n5.  Click the file icon on the\
    \ right and find your Windows 10 VM. It will either be a *.ova* file or a *.ovf*\
    \ file. Choose the file, then click **Continue**.\n\n6.  You should now see a\
    \ list of settings for the Windows 10 VM. Click **Import** to continue.\n\n7.\
    \  When it’s done importing, the Windows VM will appear in the VirtualBox Manager\
    \ list along with your Kali VM, as shown in [Figure 3-3](#c03.xhtml#figure3-3).\n\
    \n    ![Figure 3-3: After you import the Windows VM, you’ll have two VMs in your\
    \ virtual ethical hacking lab!](image_fi/502000c03/f03003.png)\n\n    Figure 3-3:\
    \ After you import the Windows VM, you’ll have two VMs in your virtual ethical\
    \ hacking lab!\n\nNow let’s turn on the Windows 10 VM to make sure it works. Double-click\
    \ the Windows 10 VM in the VirtualBox Manager list. Once the VM loads, click within\
    \ the window to show the Windows login prompt. Log in with the default username,\
    \ `IEUser`, and the default password, `Passw0rd!` (with a zero in place of the\
    \ letter *o*). If the password doesn’t work, check the Microsoft VM download page.\
    \ The default password should be listed under the Download button.\n\nOnce the\
    \ virtual desktop loads, click around and explore a bit. It’s just like a regular\
    \ Windows computer. You won’t be able to surf the internet yet, but we’ll set\
    \ up the virtual network in the next section. Once you’ve finished exploring the\
    \ Windows VM, close the VM and select **Power off the machine**. You need to power\
    \ off the VM completely to change the network settings.\n\nYou now have two virtual\
    \ machines, a Kali Linux VM and a Windows 10 VM, in your ethical hacking lab.\
    \ We’ll add more VMs as we need them in future chapters. As soon as we connect\
    \ these two VMs together, you’ll be able to practice hacking and defending without\
    \ endangering your laptop or desktop."
