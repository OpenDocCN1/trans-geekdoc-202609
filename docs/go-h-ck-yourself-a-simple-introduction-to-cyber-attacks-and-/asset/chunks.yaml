    \ YouTube 应用并搜索“Bryson Payne TED Talk”吗？如果应用存储了带有最近搜索结果的日志或历史记录文件，只要用户向应用授予管理员或超级用户权限，我们就可以访问这些文件。\n\
    \n3. 在 Meterpreter Android shell 中输入 `su` 以请求超级用户访问权限。\n\n```\nsu\n```\n\n4. 立即在\
    \ Android 虚拟机中，你会看到权限窗口弹出，如 图 9-8 所示。点击 `Allow` 以授予 Meterpreter 超级用户访问权限。\n\n\
