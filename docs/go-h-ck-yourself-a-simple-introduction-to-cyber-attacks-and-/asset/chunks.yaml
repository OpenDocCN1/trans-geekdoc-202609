    2. 在按住 `COMMAND-S` (⌘-S) 的同时再次按下电源按钮，以进入单用户模式。你应该会看到一个功能非常有限的文本命令行终端窗口，如 图 2-8
    所示。


    ![Figure 2-8: Part of the single-user mode boot screen on a Mac](img/f02008.png)


    图 2-8：Mac 单用户模式启动屏幕的一部分


    终端提示符应包含 `root#`（如果在最后一行不可见，请多次按回车键，它应该会出现），这表明我们已以 root 或管理员用户身份登录到命令行。


    3. 输入以下命令以挂载或连接到硬盘：


    ```

    localhost:/ root# /sbin/fsck -fy

    localhost:/ root# /sbin/mount -uw /

    ```


    4. 现在连接到 Open Directory 服务的属性列表，或 `plist`：


    ```

    localhost:/ root# launchctl load /System/Library/LaunchDaemons/com.apple.opendirectoryd.plist

    ```


    你的 Mac 使用 Open Directory 来跟踪用户、组、文件共享，甚至 Wi-Fi 打印机。可以将其视为 Mac 上所有用户帐户和权限的目录。


    5. 如果运行上述命令后出现错误，请尝试运行以下命令——它与步骤 4 相同，但适用于旧版 Mac：


    ```

    localhost:/ root# launchctl load /System/Library/LaunchDaemons/com.apple.DirectoryServices.plist

    ```


    6. 现在更改 root 用户的密码。输入此命令：


    ```

    localhost:/ root# passwd

    ```


    7. 输入新密码。输入时屏幕上不会显示密码字符。然后再次输入密码以确认更改。（如果输入错误的密码，请再次以单用户模式启动并执行相同的操作——这应该每次都会重置
    root 用户的密码。）


    ### 你现在是 root 用户了！


    做得好！既然你已将 root 用户的密码改为你知道的密码，你就可以随时以 root 用户身份登录。现在就试一下：在命令行中输入 `reboot` 重启计算机，或按电源按钮关闭计算机再重新开启。当计算机正常启动到
    Mac 登录屏幕时，输入 `root` 作为用户名，并输入你刚刚设置的新密码，如 图 2-9 所示。


    ![Figure 2-9: After the Mac root hack, you can log in as the root user with the
    password you set in the hack.](img/f02009.png)


    图 2-9：Mac root 攻击后，你可以使用在攻击中设置的密码以 root 用户身份登录。


    点击跳过看到的任何设置屏幕，你很快就会来到 Mac 桌面。你应该在屏幕顶部的菜单栏中看到自己已以系统管理员身份登录。你现在可以访问 Mac 上所有用户的文件和文件夹！


    ## 其他物理攻击


    除了黏滑键攻击和 Mac root 攻击之外，还有许多物理访问攻击。事实上，几乎任何可启动光盘——例如 Ultimate Boot CD、KNOPPIX、SystemRescueCd
    或 Trinity Rescue Kit——都可以让你访问你有物理访问权限的计算机硬盘上的文件。还有专门制作的黑客工具，例如 Rubber Ducky 和
    Bash Bunny，价格低于 100 美元，看起来像普通的 USB 驱动器，但包含用于入侵计算机的自动化工具。一些物理访问攻击甚至使用语音命令。例如，Open
    Sesame! 攻击使用 Microsoft 的 Cortana 语音助手，通过指示 Cortana 打开 USB 驱动器或网站上的恶意文件来绕过登录屏幕。


    ## 防御物理攻击


    正如你所见，物理访问攻击可以帮助你恢复旧照片、复制文件，并在几乎任何你可以物理接触的计算机上更改用户，即使没有原始密码。然而，这意味着任何拥有物理访问权限并了解这些攻击的人也可以访问
    `你的` 私人文件和信息！这就是为什么随身携带设备或将其锁在安全区域非常重要。


    如果有人设法访问你的计算机，有几种方法可以保护你的数据。一种是设置 `firmware password`，也称为 `BIOS password` 或 `EFI
    password`。Mac 和大多数 PC 上的此选项可以防止攻击者篡改计算机的 BIOS/UEFI 设置，从而中和黏滑键攻击和 Mac root 攻击等攻击。不幸的是，firmware
    password 只是一层防御，通常可以被绕过。例如，有动机的攻击者可以从计算机的电路板上取下电池，从而擦除大多数 PC 上存储的 firmware password。


    更可靠的方法是 `encrypt` 你的文件，将其打乱成只能用密码 `unencrypted`（解密）的不可读形式。加密密码与计算机的登录密码不同，因此攻击者无法通过使用黏滑键或
    Mac root 攻击更改用户密码来查看加密文件中的内容。我们将在第 11 章中更详细地讨论加密。


    ## 要点


    在本章中，你学习了如何使用 Windows 黏滑键攻击和 Mac root 攻击来获取计算机上所有文件和用户帐户的管理员级访问权限，即使你不知道用户名和密码。你还了解到还有其他物理攻击和一些专门工具，例如
    Rubber Ducky 和 Bash Bunny，它们使物理攻击更加容易。虽然你可以使用这些攻击来恢复丢失的文件或重置遗忘的密码，但你也发现，拥有计算机物理访问权限的攻击者通常可以访问你的所有信息。你可以通过限制谁可以访问你的计算机、设置
    firmware password 和加密文件来防御这些攻击。


    现在你了解了物理安全的重要性，是时候开始考虑其他可能使你的计算机处于危险之中的攻击了——恶意网站、网络钓鱼和受感染的电子邮件附件，甚至是你日常生活中联网智能设备上的攻击。为了能够安全地练习这些其他类型的攻击，并学习如何防御它们，你将在第
    3 章中设置自己的私有虚拟黑客实验室。


    # 3


    构建你自己的虚拟黑客实验室


    ![](img/chapterart.png)


    为了安全且合乎道德地学习黑客技术，你将使用 `virtual machines (VMs)`，这些程序在你的物理桌面或笔记本电脑中模拟独立的计算机。你可以隔离
    VM，这样你在其中的任何操作都不会影响你的计算机或网络。例如，如果你在 VM 中打开带有病毒的文件，病毒只会感染虚拟机，而不会感染你的真实计算机。


    `Virtualization software` 允许你在桌面或笔记本电脑（`host`）上运行虚拟机（称为 `guest`）。在本章中，我们将安装 VirtualBox，一个免费的虚拟化程序，以及
    VirtualBox Extension Pack。然后我们将创建两个 VM。第一个将是运行 Kali Linux 操作系统的 `attacking` VM。你将使用此
    VM 发起攻击。另一个虚拟机将是运行 Windows 的 `target` VM。你将把攻击指向这台机器。设置好这两个 VM 后，你就可以安全地尝试黑客工具，而不会影响你的计算机或任何其他人的计算机。


    ## 设置 VirtualBox


    按照以下说明下载并设置 VirtualBox。


    1. 访问 VirtualBox 主页 [`www.virtualbox.org/`](https://www.virtualbox.org/) 并点击 `Download
    VirtualBox` 按钮。


    2. VirtualBox 下载页面列出了 Windows、macOS 和多个 Linux 主机操作系统的选项。点击与你的计算机匹配的选项以下载最新版本的
    VirtualBox。


    3. 打开下载的文件并按照屏幕上的说明安装 VirtualBox。（Windows 用户应选择以管理员身份运行文件；你必须拥有管理员权限才能运行 VirtualBox。）


    '
