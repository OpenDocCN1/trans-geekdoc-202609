    \ tablet, and many newer digital cameras. *Location data* usually means the *global\
    \ positioning system (GPS)* coordinates, or the precise latitude and longitude\
    \ of your phone or other device on Earth. Depending on the social media service\
    \ you’re using (and your settings), you may be regularly streaming your location\
    \ in every picture you post. A cute picture of your cat or dog taken at home with\
    \ your smartphone can give away the exact location where you live.\n\nTo view\
    \ location data and other information hidden in pictures, we’ll use Jeffrey’s\
    \ Image Metadata Viewer ([http://exif.regex.info/](http://exif.regex.info/)).\
    \ You can upload a picture file or enter the URL of a picture online to find out\
    \ if there’s any location data or other information in the image file.\n\n1. \
    \ Go to [https://www.nostarch.com/go-hck-yourself/](https://www.nostarch.com/go-hck-yourself/)\
    \ and download *BrysonPayne-TEDx.jpg*, a picture of me taken a few years ago at\
    \ a TEDx talk on coding and cybersecurity for kids.\n\n2.  Go to [http://exif.regex.info/](http://exif.regex.info/),\
    \ click **Choose file**, and select the downloaded image file.\n\n3.  Check the\
    \ reCAPTCHA box to confirm you’re not a robot and then click **View Image Data**.\
    \ [Figure 4-7](#c04.xhtml#figure4-7) shows the hidden data (called *image metadata*).\n\
    \n![Figure 4-7: Image metadata reveals when, where, and even with which phone\
    \ the photo was taken!](image_fi/502000c04/f04007a.png)\n\nFigure 4-7: Image metadata\
    \ reveals when, where, and even with which phone the photo was taken!\n\nThe picture\
    \ was taken on April 8, 2018, at latitude and longitude 34.530261N, 83.986075W—the\
    \ exact GPS coordinates of the auditorium where I gave the talk! The stage is\
    \ located at an altitude of 443 meters (1,453 feet) above sea level, and the photo\
    \ was taken on an old iPhone 6S. All of that information, and more, is hidden\
    \ inside every picture you snap with a smartphone by default, so be careful where\
    \ and how you share your photos.\n\nSome social media apps intentionally post\
    \ where you are as well. If you’ve ever seen someone “check in” at a cool location,\
    \ that’s an example. But many of the other apps on your smartphone, from map apps\
    \ to email and search engines, may also be tracking your location. It’s a good\
    \ idea to check the security and/or privacy settings for all of the apps that\
    \ you use regularly to see if you can turn off location services or use them only\
    \ when needed.\n\n### Protecting Yourself on Social Media\n\nA little more caution\
    \ is likely to protect you from sharing too much online. You also need to educate\
    \ your friends, relatives, and coworkers—anyone who might take a picture of you\
    \ in a group and post it to social media or say where you are at a specific time.\
    \ Everyone needs to understand the importance of keeping a little more privacy\
    \ in today’s hyperconnected world.\n\nHere are some of the steps you can take\
    \ to protect yourself and those you care about from the dangers of social media\
    \ oversharing:\n\n1.  Think before you share.  Before posting a picture or comment,\
    \ pause to think about whether you need to share it right now (or at all). At\
    \ least wait until you’re back home to brag about your amazing vacation. And remember\
    \ that a thoughtless (or drunk) 2 AM social media post can be printed out, reposted,\
    \ or worse. Every tweet, post, and snap becomes part of your permanent online\
    \ reputation.\n\n2.  Change your default settings.  Most social media apps are\
    \ set by default to share way too much information with way too many people. Go\
    \ into the security or privacy settings for the app or website and turn off location\
    \ data (or location services), along with any other sensitive info you don’t want\
    \ to share.\n\n3.  Limit who can see your posts.  If a photo or comment gives\
    \ out too much information about your daily activities, hobbies, or common places\
    \ you hang out, share it privately with just the friends who’d enjoy the post.\n\
    \n4.  Fix problems quickly. Report identity theft (to your local police and to\
    \ your credit bureaus), fraud (to your bank and to the Federal Trade Commission\
