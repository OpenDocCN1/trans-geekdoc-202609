    # 图表列表


    1. 图 8-7：易受攻击的网页弹出一条消息，称我们已被黑客攻击！

    2. 图 8-8：将我们的恶意脚本存储在 DVWA 的 XSS 存储页面中

    3. 图 8-9：我们的 JavaScript 警告将告诉每位访问者，“你已被黑客攻击！”

    4. 图 8-10：输入一个更恶意的脚本，将用户重定向到完全不同的网页

    5. 图 8-11：清除你的存储型 XSS 攻击

    6. 图 8-12：通过将 SQL 代码注入易受攻击的数据库搜索表单来攻击数据库

    7. 图 8-13：我们已揭露所有五个用户的名和姓！

    8. 图 8-14：我们已使用 SQL 注入攻击从 DVWA 窃取了所有用户名和密码哈希！

    9. 图 9-1：我们已将 Android 8.1 虚拟机添加到 VirtualBox 中！

    10. 图 9-2：你的虚拟 Android 设备的主屏幕

    11. 图 9-3：从 Android 虚拟机的 Chrome 浏览器导航到 Kali 虚拟机的 `share` 文件夹，以找到准备下载和安装的 `CoolGame.apk`
    木马应用。

    12. 图 9-5：访问下载管理器

    13. 图 9-6：Android 在卸载应用前会询问用户权限。

    14. 图 9-7：使用联系人应用添加带有虚假信息的新联系人

    15. 图 9-8：授予 Meterpreter 超级用户访问权限

    16. 图 9-9：当我们在 Meterpreter 中关闭铃声音量时，用户无法从设置屏幕重新打开它！

    17. 图 9-10：从用户屏幕隐藏我们的 MainActivity 应用图标

    18. 图 10-1：ICSim 程序显示带有速度计、转向灯等内容的模拟汽车仪表盘！

    19. 图 10-2：保持控制器应用可见且易于访问

    20. 图 10-3：`cansniffer` 数据包嗅探器显示我们 vcan0 网络上的消息。

    21. 图 10-4：在 Mousepad 文本编辑器中搜索特定的 CAN ID 值

    22. 图 10-5：重放的数据包正在控制仪表盘。

    23. 图 10-6：我们可以通过使用 `cansend` 直接向 CAN 总线发送信号来控制仪表盘。

    24. 图 A-1：Windows 10 Enterprise Evaluations 屏幕

    25. 图 A-2：选择平台和语言以下载免费且合法的 Windows 评估版副本。

    26. 图 A-3：从 Microsoft 下载 Windows 媒体创建工具。

    27. 图 A-4：选择 `Create installation media`。

    28. 图 A-5：选择 `USB flash drive`，插入一个空白 USB 驱动器，然后单击 `Next`。

    29. 图 B-1：关闭所有 Hyper-V 和 Windows Hypervisor Platform 选项

    30. 图 B-2：从 Windows 10 进入 BIOS

    31. 图 B-3：访问高级选项菜单

    32. 图 B-4：访问 UEFI 固件设置或启动设置


