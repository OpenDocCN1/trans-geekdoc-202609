    \ 警告，请单击 `Install Anyway`。\n\n7. 单击 Android 虚拟机屏幕底部的主页按钮（中间的圆圈）。然后点击并向上拖动屏幕以显示已安装的应用。单击\
    \ `MainActivity` 图标以启动木马应用。\n\n8. 切换回你的 Kali 虚拟机，你将看到 Meterpreter 中打开了一个新会话。\n\
    \n我们的木马在 Android 设备上已向 Kali 发起呼叫，并正在等待命令。让我们看看一旦控制了设备，我们能做什么。\n\n## 控制 Android\
    \ 虚拟机\n\n恶意移动应用带来的威胁与 PC 上恶意软件的威胁同样真实。如果你在智能手机上安装了恶意软件，攻击者将能够访问大量敏感信息：你拍摄过的每一张照片和视频、所有联系人、通话和短信记录、GPS\
