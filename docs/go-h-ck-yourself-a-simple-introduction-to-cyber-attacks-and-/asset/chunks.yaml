- raw: "2.  Click **Get Started** to find evaluation copies of several categories\
    \ of Microsoft products, like Windows, Windows Server, and Office.\n\n3.  Click\
    \ **Windows**▶**Windows 10 Enterprise** (or another, newer Windows OS) to go to\
    \ the Windows 10 Enterprise Evaluations screen shown in [Figure A-1](#b01.xhtml#figureA-1).\n\
    \n    ![Figure A-1: The Windows 10 Enterprise Evaluations screen](image_fi/502000b01/faa001a.png)\n\
    \n    Figure A-1: The Windows 10 Enterprise Evaluations screen\n\n4.  Under Start\
    \ your evaluation, select **ISO - Enterprise** as your evaluation file type and\
    \ click **Continue**.\n\n5.  The site will ask you to fill out a form about yourself.\
    \ If you’re under 18, check with an adult before entering any personal information.\
    \ Once you submit the information, you should see a download screen similar to\
    \ [Figure A-2](#b01.xhtml#figureA-2).\n\n    ![Figure A-2: Choose a platform and\
    \ language to download a free, legal evaluation copy of Windows.](image_fi/502000b01/fAA002.png)\n\
    \n    Figure A-2: Choose a platform and language to download a free, legal evaluation\
    \ copy of Windows.\n\n6.  Choose **64 bit**, select your language, and click **Download**.\n\
    \nThe Windows 10 installation download is an *ISO* file, often called an *image*,\
    \ which is a single file containing all the files needed to make a CD or DVD like\
    \ our software installation disc. The ISO file is 4GB or more, so try to download\
    \ it somewhere with a fast internet connection.\n\n### Burning Windows 10 onto\
    \ a DVD\n\nTo burn the copy of Windows 10 onto a DVD, you’ll need a computer with\
    \ a DVD writer drive.\n\n1.  For Windows, right-click the ISO file and select\
    \ **Burn disc image**. For Mac, select the ISO file in Finder and go to **File**▶**Burn\
    \ <disc>**.\n\n2.  Insert a blank DVD into the drive, and in a few minutes, you\
    \ should have a bootable Windows 10 installation disc.\n\n### Installing Windows\
    \ 10 onto a USB Flash Drive\n\nIf you don’t have a DVD writer drive, you can install\
    \ the copy of Windows 10 onto a USB flash drive using Microsoft’s Windows Media\
    \ Creation Tool.\n\n1.  Go to [https://www.microsoft.com/en-us/software-download/windows10/](https://www.microsoft.com/en-us/software-download/windows10/),\
    \ as shown in [Figure A-3](#b01.xhtml#figureA-3). (Again, Microsoft changes its\
    \ URLs, site names, and even tool names often, so if this URL doesn’t work, search\
    \ for “Windows Media Creation Tool” and you should find the correct link.)\n\n\
    \    ![Figure A-3: Download the Windows Media Creation Tool from Microsoft.](image_fi/502000b01/fAA003.png)\n\
    \n    Figure A-3: Download the Windows Media Creation Tool from Microsoft.\n\n\
    2.  Download and install the Windows Media Creation Tool for your preferred language.\n\
    \n3.  When you run the tool, select **Create installation media (USB flash drive,\
    \ DVD, or ISO file)**, then click **Next**.\n\n    ![Figure A-4: Choose Create\
    \ installation media.](image_fi/502000b01/fAA004.png)\n\n    Figure A-4: Choose\
    \ **Create installation media**.\n\n4.  Leave the default selections for the language\
    \ and version of Windows 10, then click **Next**.\n\n5.  Choose **USB flash drive**\
    \ as your media type. \n\n    ![Figure A-5: Choose USB flash drive, insert an\
    \ empty USB drive, then click Next.](image_fi/502000b01/fAA005.png)\n\n    Figure\
    \ A-5: Choose **USB flash drive**, insert an empty USB drive, then click **Next**.\n\
    \n6.  Plug in an empty USB drive with at least 8GB of free space, select the empty\
    \ USB drive, and click **Next**.\n\nIt’ll take several minutes, but when the tool\
    \ is finished, you’ll have a bootable USB drive with a full installation of Windows\
    \ 10 ready to use for the Sticky Keys hack or general computer troubleshooting\
    \ and repair.\n\n# B  \n\nTroubleshooting VirtualBox\n\n![](image_fi/book_art/chapterart.png)\n\
    \nThe first time you run a virtual machine in VirtualBox, you might encounter\
    \ errors due to different settings on your Mac or PC. Use this appendix to troubleshoot\
    \ your VirtualBox setup. If you try everything listed in these steps and still\
    \ have trouble, go to the book’s website, [https://www.nostarch.com/go-hck-yourself/](https://www.nostarch.com/go-hck-yourself/),\
    \ for the latest help, or do a web search for the specific error you’re seeing.\
    \ Setting up a virtual hacking lab may take a few tries, but it’s worth it!\n\n\
    ## Troubleshooting VirtualBox on Mac\n\nSome Macs might display an error when\
    \ loading the Kali VM for the first time. Try following these steps to fix the\
    \ error:\n\n1.  Make sure you’ve correctly installed the VirtualBox Extension\
    \ Pack, as described in Chapter 3.\n\n2.  Go to **System Preferences**▶**Security\
    \ & Privacy** and click the **General** tab.\n\n3.  If you see a message near\
    \ the bottom saying that Oracle software was blocked from loading, click **Allow**.\n\
    \n4.  Restart VirtualBox, and your Kali VM should open correctly.\n\n## Troubleshooting\
    \ VirtualBox on Windows\n\nIf VirtualBox isn’t running correctly for you on Windows,\
    \ you may need to do the following:\n\n1.  Turn off Hyper-V options in the Control\
    \ Panel.\n\n2.  Turn on Virtualization in your computer’s BIOS or UEFI settings.\n\
    \nWe’ll go through both steps in more detail next. Once you’ve done both, restart\
    \ VirtualBox and retry opening the Kali VM.\n\n### Turn Off Hyper-V Options\n\n\
    Some versions of Windows come with Hyper-V (Microsoft’s own virtualization software)\
    \ enabled by default. To use VirtualBox instead, you’ll need to turn off Hyper-V.\n\
    \n1.  Go to **Control Panel**▶**Programs**▶**Programs and Features**▶**Turn Windows\
    \ features on or off**.\n\n2.  In the list of settings, uncheck all boxes with\
    \ Hyper-V or Hypervisor Platform in their names, as shown in [Figure B-1](#b02.xhtml#figureB-1).\n\
    \n    ![Figure B-1: Turning off all Hyper-V and Windows Hypervisor Platform options](image_fi/502000b02/fab001a.png)\n\
    \n    Figure B-1: Turning off all Hyper-V and Windows Hypervisor Platform options\n\
    \n3.  After turning off the Hyper-V and Hypervisor Platform settings, you’ll need\
    \ to reboot your computer before running VirtualBox again.\n\n### Turn On Virtualization\
    \ in BIOS/UEFI Settings\n\nIf you’ve turned off Hyper-V and still have trouble\
    \ using VirtualBox, you may need to enable virtualization. To turn on virtualization\
    \ support, you’ll need to reboot into your computer’s BIOS or UEFI, the basic\
    \ hardware settings for your PC.\n\n1.  In Windows 10, go to **Settings**▶**Update\
    \ & Security**▶**Recovery**▶**Advanced startup**▶**Restart now**, as shown in\
    \ [Figure B-2](#b02.xhtml#figureB-2). Your computer should reboot into an advanced\
    \ startup mode.\n\n    ![Figure B-2: Entering BIOS from Windows 10](image_fi/502000b02/fab002.png)\n\
    \n    Figure B-2: Entering BIOS from Windows 10\n\n2.  From the blue startup menu,\
    \ select **Troubleshoot** and press **ENTER**. Then select **Advanced options**\
    \ and press **ENTER** again, as shown in [Figure B-3](#b02.xhtml#figureB-3).\n\
    \n3.  The Advanced options menu screen contains useful tools for troubleshooting\
    \ and fixing your PC, including System Restore and Startup Repair. At the bottom-right\
    \ of this menu, select the option for either **UEFI Firmware Settings** or **Startup\
    \ Settings**, as shown in [Figure B-4](#b02.xhtml#figureB-4). \n\n    ![Figure\
    \ B-3: Accessing the Advanced options menu](image_fi/502000b02/fab003b.png)\n\n\
    \    Figure B-3: Accessing the Advanced options menu\n\n    ![Figure B-4: Accessing\
    \ the UEFI Firmware Settings or Startup Settings](image_fi/502000b02/fab004b.png)\n\
    \n    Figure B-4: Accessing the UEFI Firmware Settings or Startup Settings\n\n\
    4.  Press **ENTER** and then click **Restart**. If your computer uses the newer\
    \ UEFI firmware settings, you should see the UEFI settings menu when it restarts.\
    \ If your computer uses the older BIOS startup settings, you may need to press\
    \ a special key to enter BIOS as it restarts. "
