- raw: "For this hack, we’ll install a software package called *Instrument Cluster\
    \ Simulator (ICSim)*, a virtual dashboard that will let you see and interact with\
    \ a speedometer, turn signals, and door locks just as you would in an actual vehicle.\
    \ Craig Smith (aka zombieCraig) and the OpenGarages team built the ICSim to help\
    \ hackers and researchers learn how to work with automobile networks safely and\
    \ ethically, without damaging or destroying an actual vehicle or unsuspecting\
    \ pedestrian.\n\n1.  Open a terminal window and update Kali’s software package\
    \ list:\n\n    ```\n    kali@kali:~$ sudo apt update\n    ```\n\n2.  Now install\
    \ ICSim’s dependencies by entering the following:\n\n    ```\n    kali@kali:~$\
    \ sudo apt install libsdl2-dev libsdl2-image-dev can-utils\n    ```\n\n    Note\
    \ that both of the `libsdl2` packages are spelled with a lowercase letter *L*\
    \ before the number 2.\n\n3.  Install ICSim like this:\n\n    ```\n    kali@kali:~$\
    \ cd ~ \n    kali@kali:~$ git clone https://github.com/zombieCraig/ICSim.git \n\
    \    ```\n\n4.  Set up can-utils on your machine:\n\n    ```\n    kali@kali:~$\
    \ cd ~\n    kali@kali:~$ git clone https://github.com/linux-can/can-utils\n  \
    \  kali@kali:~$ cd can-utils\n    kali@kali:~/can-utils$ make\n    kali@kali:~/can-utils$\
    \ sudo make install\n    ```\n\n5.  Set up the ICSim dashboard simulator software\
    \ with these commands:\n\n    ```\n    kali@kali:~/can-utils$ cp lib.o ~/ICSim\n\
    \    kali@kali:~/can-utils$ cd ~/ICSim\n    kali@kali:~/ICSim$ make clean\n  \
    \  kali@kali:~/ICSim$ make\n    ```\n\nNow to run our virtual car instrument panel\
    \ and start hacking!\n\n## Preparing the Virtual CAN Bus Network\n\nAn automobile’s\
    \ network is known as a *CAN bus*, or simply *CAN*. The CAN bus has been used\
    \ in most automobiles since the 1990s to control various systems and sensors,\
    \ like steering and braking, radios, air conditioners, and entertainment centers.\
    \ The ICSim software you just installed creates a *virtual CAN (VCAN)* bus network\
    \ that we’ll learn to attack. We’ll create that network now and finish setting\
    \ up your car-hacking environment.\n\n1.  To set up the VCAN, enter this command\
    \ at the terminal inside the ICSim folder:\n\n    ```\n    kali@kali:~/ICSim$\
    \ sh setup_vcan.sh\n    ```\n\n2.  Ensure that VCAN was set up correctly by entering\
    \ `ip addr` in a terminal. You should see your IP address along with a new network\
    \ named *vcan0*.\n\n    ```\n    kali@kali:~/ICSim$ ip addr\n    --snip--\n  \
    \  3: vcan0: <NOARP,UP,LOWER_UP> mtu 72 qdisc noqueue state UNKNOWN group default\
    \ qlen 1000 link/can\n    ```\n\n3.  Enter the following in the terminal to tell\
    \ it to first run ICSim using the vcan0 network we just created and then wait\
    \ for our commands:\n\n    ```\n    kali@kali:~/ICSim$ ./icsim vcan0 &\n    ```\n\
    \n    You should see a simulated dashboard like the one shown in [Figure 10-1](#c10.xhtml#figure10-1).\n\
    \n    ![Figure 10-1: The ICSim program displays a simulated car dashboard with\
    \ a speedometer, turn signals, and more!](image_fi/502000c10/f10001.png)\n\n \
    \   Figure 10-1: The ICSim program displays a simulated car dashboard with a speedometer,\
    \ turn signals, and more!\n\n4.  Start the controller app on vcan0:\n\n    ```\n\
    \    kali@kali:~/ICSim$ ./controls vcan0 &\n    ```\n\n    The CANBus Control\
    \ Panel window should open. It looks a lot like a video game controller.\n\n5.\
    \  Resize the Control Panel so that the ICSim window is visible by clicking any\
    \ corner of the window and dragging.\n\n6.  Right-click the top bar of the Control\
    \ Panel window and select **Always on Top**, as shown in [Figure 10-2](#c10.xhtml#figure10-2).\n\
    \n![Figure 10-2: Keeping the controller app visible and easily accessible](image_fi/502000c10/f10002.png)\n\
    \nFigure 10-2: Keeping the controller app visible and easily accessible\n\nTo\
    \ drive the virtual car, click in the CANBus Control Panel window and then use\
    \ your keyboard to send commands. Available commands are listed in [Table 10-1](#c10.xhtml#table10-1).\
    \ Press the up arrow to accelerate, use the left and right arrows to control the\
    \ turn signals, and so on.\n\nTable 10-1: Keyboard Controls for the CANBus Control\
    \ Panel\n\n| **Function** || **Key(s)** |\n\n| --- | --- |\n\n| **Accelerate**\
    \ || Press and hold the up arrow (↑) |\n\n| --- | --- |\n\n| **Signal a left or\
    \ right turn** || Press and hold the left or right arrow (←/→) |\n\n| **Unlock\
    \ front-left or front-right door** || right\\-SHIFT\\-A or right-SHIFT\\-B |\n\
    \n| **Unlock back-left or back-right door** || right\\-SHIFT\\-X or right-SHIFT\\\
    -Y |\n\n| **Lock all doors** || Hold right\\-SHIFT + tap left\\-SHIFT |\n\n| **Unlock\
    \ all doors** || Hold left\\-SHIFT + tap right\\-SHIFT |\n\nThe controller app\
    \ is the only way to interact with the VCAN—unless we hack it.\n\n## Hacking the\
    \ Car\n\nOur car-hacking adventure will follow the same steps you’d use to test\
    \ the security of most IoT devices:\n\n1.  Use a program to view and record traffic\
    \ on the vcan0 network between the controller app and the dashboard. This kind\
    \ of program is called a *packet sniffer* because messages sent on the network\
    \ are called *packets*.\n\n2.  Identify what network packets and commands control\
    \ what car systems or functions.\n\n3.  Take control of the car by resending the\
    \ packets you’ve captured back over the vcan0 network or by writing your own commands\
    \ from your terminal.\n\n### Viewing Packets\n\nWe’ll use `cansniffer`, the packet\
    \ sniffer built into can-utils, to listen to our simulated car network.\n\n1.\
    \  In your terminal window, launch `cansniffer` with the following command:\n\n\
    \    ```\n    kali@kali:~/ICSim$ cansniffer -c vcan0\n    ```\n\n2.  Make the\
    \ terminal window tall and narrow (as shown in [Figure 10-3](#c10.xhtml#figure10-3))\
    \ to make the `cansniffer` messages easier to see. You may also need to reduce\
    \ the font size by pressing CTRL and − a few times.\n\n3.  Click in the CANBus\
    \ Control Panel window and send some commands to the virtual car. Try accelerating,\
    \ using the turn signals, and so on.\n\nThe `cansniffer` tool intercepts packets\
    \ being sent on vcan0 between the controller app and the dashboard and displays\
    \ them in the terminal window. Each line in the window represents one packet.\
    \ The network transmits several hundred packets per second, so they go by quickly.\n\
    \nLet’s look at an example packet to see what information we can find. Here’s\
    \ one of the packets shown in [Figure 10-3](#c10.xhtml#figure10-3):\n\n```\n10.204188\
    \ 2244 300 00 00 01 06 4.....\n```\n\n![Figure 10-3: The cansniffer packet sniffer\
    \ shows messages on our vcan0 network.](image_fi/502000c10/f10003.png)\n\nFigure\
    \ 10-3: The `cansniffer` packet sniffer shows messages on our vcan0 network.\n\
    \nThe first column is a *timestamp* 1 that represents when the packet was sent.\
    \ The second column 2 is the ID number of the system a message is being sent to\
    \ or from. As we’ll discover, CAN ID# 244 represents the speedometer. The third\
    \ column 3 is the CAN message data, represented by hexadecimal values, and the\
    \ fourth column 4 contains the same data represented in printable characters.\n\
    \nExperienced hackers know how to analyze the traffic picked up by a packet sniffer\
    \ to determine what different packets mean. This takes practice and patience.\
    \ For now, try accelerating a few times by pressing the up arrow in the controller\
    \ app while watching for ID# 244 in the terminal window. Look for changing values\
    \ in the message data column as you speed up and slow down. Recognizing this pattern\
    \ is a clue that ID #244 refers to the speedometer.\n\nNow press the turn signals\
    \ (the left and right arrows) and watch for ID# 188. It should appear when you\
    \ touch the turn signals and disappear a few moments after you turn them off.\
    \ Lock and unlock the doors using the left and right SHIFT keys, or the right\
    \ SHIFT key plus X, Y, A, and B, and watch what changes in the data next to ID#\
    \ 19B. The row for 19B should appear only for a moment when you’re locking or\
    \ unlocking doors."
  fmt: "\nFor this hack, we’ll install a software package called `Instrument Cluster\
    \ Simulator (ICSim)`, a virtual dashboard that will let you see and interact with\
    \ a speedometer, turn signals, and door locks just as you would in an actual vehicle.\
    \ Craig Smith (aka zombieCraig) and the OpenGarages team built the ICSim to help\
    \ hackers and researchers learn how to work with automobile networks safely and\
    \ ethically, without damaging or destroying an actual vehicle or unsuspecting\
    \ pedestrian.\n\n1. Open a terminal window and update Kali’s software package\
    \ list:\n\n```\nkali@kali:~$ sudo apt update\n```\n\n2. Now install ICSim’s dependencies\
    \ by entering the following:\n\n```\nkali@kali:~$ sudo apt install libsdl2-dev\
    \ libsdl2-image-dev can-utils\n```\n\nNote that both of the `libsdl2` packages\
    \ are spelled with a lowercase letter `L` before the number 2.\n\n3. Install ICSim\
    \ like this:\n\n```\nkali@kali:~$ cd ~ \nkali@kali:~$ git clone https://github.com/zombieCraig/ICSim.git\
    \ \n```\n\n4. Set up can-utils on your machine:\n\n```\nkali@kali:~$ cd ~\nkali@kali:~$\
    \ git clone https://github.com/linux-can/can-utils\nkali@kali:~/can-utils$ make\n\
    kali@kali:~/can-utils$ sudo make install\n```\n\n5. Set up the ICSim dashboard\
    \ simulator software with these commands:\n\n```\nkali@kali:~/can-utils$ cp lib.o\
    \ ~/ICSim\nkali@kali:~/can-utils$ cd ~/ICSim\nkali@kali:~/ICSim$ make clean\n\
    kali@kali:~/ICSim$ make\n```\n\nNow to run our virtual car instrument panel and\
    \ start hacking!\n\n## Preparing the Virtual CAN Bus Network\n\nAn automobile’s\
    \ network is known as a `CAN bus`, or simply `CAN`. The CAN bus has been used\
    \ in most automobiles since the 1990s to control various systems and sensors,\
    \ like steering and braking, radios, air conditioners, and entertainment centers.\
    \ The ICSim software you just installed creates a `virtual CAN (VCAN)` bus network\
    \ that we’ll learn to attack. We’ll create that network now and finish setting\
    \ up your car-hacking environment.\n\n1. To set up the VCAN, enter this command\
    \ at the terminal inside the ICSim folder:\n\n```\nkali@kali:~/ICSim$ sh setup_vcan.sh\n\
    ```\n\n2. Ensure that VCAN was set up correctly by entering `ip addr` in a terminal.\
    \ You should see your IP address along with a new network named `vcan0`.\n\n```\n\
    kali@kali:~/ICSim$ ip addr\n--snip--\n3: vcan0: <NOARP,UP,LOWER_UP> mtu 72 qdisc\
    \ noqueue state UNKNOWN group default qlen 1000 link/can\n```\n\n3. Enter the\
    \ following in the terminal to tell it to first run ICSim using the vcan0 network\
    \ we just created and then wait for our commands:\n\n```\nkali@kali:~/ICSim$ ./icsim\
    \ vcan0 &\n```\n\nYou should see a simulated dashboard like the one shown in [Figure\
    \ 10-1](#c10.xhtml#figure10-1).\n\n![Figure 10-1: The ICSim program displays a\
    \ simulated car dashboard with a speedometer, turn signals, and more!](image_fi/502000c10/f10001.png)\n\
    \nFigure 10-1: The ICSim program displays a simulated car dashboard with a speedometer,\
    \ turn signals, and more!\n\n4. Start the controller app on vcan0:\n\n```\nkali@kali:~/ICSim$\
    \ ./controls vcan0 &\n```\n\nThe CANBus Control Panel window should open. It looks\
    \ a lot like a video game controller.\n\n5. Resize the Control Panel so that the\
    \ ICSim window is visible by clicking any corner of the window and dragging.\n\
    \n6. Right-click the top bar of the Control Panel window and select `Always on\
    \ Top`, as shown in [Figure 10-2](#c10.xhtml#figure10-2).\n\n![Figure 10-2: Keeping\
    \ the controller app visible and easily accessible](image_fi/502000c10/f10002.png)\n\
    \nFigure 10-2: Keeping the controller app visible and easily accessible\n\nTo\
    \ drive the virtual car, click in the CANBus Control Panel window and then use\
    \ your keyboard to send commands. Available commands are listed in [Table 10-1](#c10.xhtml#table10-1).\
    \ Press the up arrow to accelerate, use the left and right arrows to control the\
    \ turn signals, and so on.\n\nTable 10-1: Keyboard Controls for the CANBus Control\
    \ Panel\n\n| `Function` || `Key(s)` |\n\n| --- | --- |\n\n| `Accelerate` || Press\
    \ and hold the up arrow (↑) |\n\n| --- | --- |\n\n| `Signal a left or right turn`\
    \ || Press and hold the left or right arrow (←/→) |\n\n| `Unlock front-left or\
    \ front-right door` || right\\-SHIFT\\-A or right-SHIFT\\-B |\n\n| `Unlock back-left\
    \ or back-right door` || right\\-SHIFT\\-X or right-SHIFT\\-Y |\n\n| `Lock all\
    \ doors` || Hold right\\-SHIFT + tap left\\-SHIFT |\n\n| `Unlock all doors` ||\
    \ Hold left\\-SHIFT + tap right\\-SHIFT |\n\nThe controller app is the only way\
    \ to interact with the VCAN—unless we hack it.\n\n## Hacking the Car\n\nOur car-hacking\
    \ adventure will follow the same steps you’d use to test the security of most\
    \ IoT devices:\n\n1. Use a program to view and record traffic on the vcan0 network\
    \ between the controller app and the dashboard. This kind of program is called\
    \ a `packet sniffer` because messages sent on the network are called `packets`.\n\
    \n2. Identify what network packets and commands control what car systems or functions.\n\
    \n3. Take control of the car by resending the packets you’ve captured back over\
    \ the vcan0 network or by writing your own commands from your terminal.\n\n###\
    \ Viewing Packets\n\nWe’ll use `cansniffer`, the packet sniffer built into can-utils,\
    \ to listen to our simulated car network.\n\n1. In your terminal window, launch\
    \ `cansniffer` with the following command:\n\n```\nkali@kali:~/ICSim$ cansniffer\
    \ -c vcan0\n```\n\n2. Make the terminal window tall and narrow (as shown in [Figure\
    \ 10-3](#c10.xhtml#figure10-3)) to make the `cansniffer` messages easier to see.\
    \ You may also need to reduce the font size by pressing CTRL and − a few times.\n\
    \n3. Click in the CANBus Control Panel window and send some commands to the virtual\
    \ car. Try accelerating, using the turn signals, and so on.\n\nThe `cansniffer`\
    \ tool intercepts packets being sent on vcan0 between the controller app and the\
    \ dashboard and displays them in the terminal window. Each line in the window\
    \ represents one packet. The network transmits several hundred packets per second,\
    \ so they go by quickly.\n\nLet’s look at an example packet to see what information\
    \ we can find. Here’s one of the packets shown in [Figure 10-3](#c10.xhtml#figure10-3):\n\
    \n```\n10.204188 2244 300 00 00 01 06 4.....\n```\n\n![Figure 10-3: The `cansniffer`\
    \ packet sniffer shows messages on our vcan0 network.](image_fi/502000c10/f10003.png)\n\
    \nFigure 10-3: The `cansniffer` packet sniffer shows messages on our vcan0 network.\n\
    \nThe first column is a `timestamp` 1 that represents when the packet was sent.\
    \ The second column 2 is the ID number of the system a message is being sent to\
    \ or from. As we’ll discover, CAN ID# 244 represents the speedometer. The third\
    \ column 3 is the CAN message data, represented by hexadecimal values, and the\
    \ fourth column 4 contains the same data represented in printable characters.\n\
    \nExperienced hackers know how to analyze the traffic picked up by a packet sniffer\
    \ to determine what different packets mean. This takes practice and patience.\
    \ For now, try accelerating a few times by pressing the up arrow in the controller\
    \ app while watching for ID# 244 in the terminal window. Look for changing values\
    \ in the message data column as you speed up and slow down. Recognizing this pattern\
    \ is a clue that ID #244 refers to the speedometer.\n\nNow press the turn signals\
    \ (the left and right arrows) and watch for ID# 188. It should appear when you\
    \ touch the turn signals and disappear a few moments after you turn them off.\
    \ Lock and unlock the doors using the left and right SHIFT keys, or the right\
    \ SHIFT key plus X, Y, A, and B, and watch what changes in the data next to ID#\
    \ 19B. The row for 19B should appear only for a moment when you’re locking or\
    \ unlocking doors.\n"
  trans: "\n\n对于此黑客攻击，我们将安装一个名为 `Instrument Cluster Simulator (ICSim)` 的软件包，这是一个虚拟仪表板，可让你像在实际车辆中一样查看和交互速度表、转向灯和车门锁。Craig\
    \ Smith（又名 zombieCraig）和 OpenGarages 团队构建了 ICSim，以帮助黑客和研究人员安全且合乎道德地学习如何处理汽车网络，而不会损坏或摧毁实际车辆或无辜行人。\n\
    \n1. 打开终端窗口并更新 Kali 的软件包列表：\n\n```\nkali@kali:~$ sudo apt update\n```\n\n2. 现在通过输入以下内容安装\
    \ ICSim 的依赖项：\n\n```\nkali@kali:~$ sudo apt install libsdl2-dev libsdl2-image-dev\
    \ can-utils\n```\n\n请注意，两个 `libsdl2` 包都在数字 2 之前使用小写字母 `L` 拼写。\n\n3. 这样安装 ICSim：\n\
    \n```\nkali@kali:~$ cd ~ \nkali@kali:~$ git clone https://github.com/zombieCraig/ICSim.git\
    \ \n```\n\n4. 在你的机器上设置 can-utils：\n\n```\nkali@kali:~$ cd ~\nkali@kali:~$ git\
    \ clone https://github.com/linux-can/can-utils\nkali@kali:~/can-utils$ make\n\
    kali@kali:~/can-utils$ sudo make install\n```\n\n5. 使用这些命令设置 ICSim 仪表板模拟器软件：\n\
    \n```\nkali@kali:~/can-utils$ cp lib.o ~/ICSim\nkali@kali:~/can-utils$ cd ~/ICSim\n\
    kali@kali:~/ICSim$ make clean\nkali@kali:~/ICSim$ make\n```\n\n现在运行我们的虚拟汽车仪表盘并开始黑客攻击！\n\
    \n## 准备虚拟 CAN 总线网络\n\n汽车的网络被称为 `CAN bus`，或者简称 `CAN`。自 20 世纪 90 年代以来，CAN 总线一直用于大多数汽车，以控制各种系统和传感器，例如转向和制动、收音机、空调和娱乐中心。你刚刚安装的\
    \ ICSim 软件创建了一个 `virtual CAN (VCAN)` 总线网络，我们将学习攻击该网络。我们现在创建该网络并完成汽车黑客环境的设置。\n\n\
    1. 要设置 VCAN，请在 ICSim 文件夹内的终端中输入此命令：\n\n```\nkali@kali:~/ICSim$ sh setup_vcan.sh\n\
    ```\n\n2. 通过在终端中输入 `ip addr` 确保 VCAN 设置正确。你应该能看到自己的 IP 地址以及一个名为 `vcan0` 的新网络。\n\
    \n```\nkali@kali:~/ICSim$ ip addr\n--snip--\n3: vcan0: <NOARP,UP,LOWER_UP> mtu\
    \ 72 qdisc noqueue state UNKNOWN group default qlen 1000 link/can\n```\n\n3. 在终端中输入以下内容，指示它先使用我们刚刚创建的\
    \ vcan0 网络运行 ICSim，然后等待我们的命令：\n\n```\nkali@kali:~/ICSim$ ./icsim vcan0 &\n```\n\
    \n你应该会看到一个模拟的仪表板，如 图 10-1 所示。\n\n![图 10-1：ICSim 程序显示带有速度表、转向灯等的模拟汽车仪表板！](img/f10001.png)\n\
    \n图 10-1：ICSim 程序显示带有速度表、转向灯等的模拟汽车仪表板！\n\n4. 在 vcan0 上启动控制器应用程序：\n\n```\nkali@kali:~/ICSim$\
    \ ./controls vcan0 &\n```\n\nCANBus 控制面板窗口应该会打开。它看起来很像视频游戏控制器。\n\n5. 通过单击窗口的任何角并拖动，调整控制面板的大小，使\
    \ ICSim 窗口可见。\n\n6. 右键单击控制面板窗口的顶部栏并选择 `Always on Top`，如 图 10-2 所示。\n\n![图 10-2：保持控制器应用程序可见且易于访问](img/f10002.png)\n\
    \n图 10-2：保持控制器应用程序可见且易于访问\n\n要驾驶虚拟汽车，请单击 CANBus 控制面板窗口，然后使用键盘发送命令。可用命令列在 表 10-1\
    \ 中。按上箭头加速，使用左箭头和右箭头控制转向灯，依此类推。\n\n表 10-1：CANBus 控制面板的键盘控制\n\n| `Function` ||\
    \ `Key(s)` |\n\n| --- | --- |\n\n| `Accelerate` || 按住上箭头 (↑) |\n\n| --- | ---\
    \ |\n\n| `Signal a left or right turn` || 按住左箭头或右箭头 (←/→) |\n\n| `Unlock front-left\
    \ or front-right door` || right\\-SHIFT\\-A 或 right-SHIFT\\-B |\n\n| `Unlock back-left\
    \ or back-right door` || right\\-SHIFT\\-X 或 right-SHIFT\\-Y |\n\n| `Lock all\
    \ doors` || 按住 right\\-SHIFT + 轻按 left\\-SHIFT |\n\n| `Unlock all doors` || 按住\
    \ left\\-SHIFT + 轻按 right\\-SHIFT |\n\n控制器应用程序是与 VCAN 交互的唯一方式——除非我们对其进行黑客攻击。\n\
    \n## 黑客攻击汽车\n\n我们的汽车黑客攻击冒险将遵循测试大多数 IoT 设备安全性时使用的相同步骤：\n\n1. 使用程序查看和记录控制器应用程序与仪表板之间\
    \ vcan0 网络上的流量。这种程序称为 `packet sniffer`，因为发送到网络上的消息称为 `packets`。\n\n2. 识别哪些网络数据包和命令控制哪些汽车系统或功能。\n\
    \n3. 通过将捕获的数据包重新发送到 vcan0 网络，或从终端编写自己的命令来控制汽车。\n\n### 查看数据包\n\n我们将使用 `cansniffer`，即\
    \ can-utils 内置的数据包嗅探器，来监听我们的模拟汽车网络。\n\n1. 在终端窗口中，使用以下命令启动 `cansniffer`：\n\n```\n\
    kali@kali:~/ICSim$ cansniffer -c vcan0\n```\n\n2. 将终端窗口调整为又高又窄（如 图 10-3 所示），以便更容易查看\
    \ `cansniffer` 消息。你可能还需要按 CTRL 和 − 几次来减小字体大小。\n\n3. 单击 CANBus 控制面板窗口并向虚拟汽车发送一些命令。尝试加速、使用转向灯等。\n\
    \n`cansniffer` 工具拦截在控制器应用程序和仪表板之间在 vcan0 上发送的数据包，并在终端窗口中显示它们。窗口中的每一行代表一个数据包。网络每秒传输几百个数据包，因此它们会很快闪过。\n\
    \n让我们看一个示例数据包，看看可以找到什么信息。以下是 图 10-3 中显示的数据包之一：\n\n```\n10.204188 2244 300 00 00\
    \ 01 06 4.....\n```\n\n![图 10-3：`cansniffer` 数据包嗅探器显示我们 vcan0 网络上的消息。](img/f10003.png)\n\
    \n图 10-3：`cansniffer` 数据包嗅探器显示我们 vcan0 网络上的消息。\n\n第一列是一个 `timestamp`，表示发送数据包的时间。第二列是消息发送到或来自的系统的\
    \ ID 号。正如我们将发现的那样，CAN ID# 244 代表速度表。第三列是 CAN 消息数据，由十六进制值表示，第四列包含以可打印字符表示的相同数据。\n\
    \n经验丰富的黑客知道如何分析数据包嗅探器捕获的流量，以确定不同数据包的含义。这需要练习和耐心。目前，尝试在控制器应用程序中按几次上箭头加速，同时留意终端窗口中的\
    \ ID# 244。随着加速和减速，查找消息数据列中变化的值。识别此模式是 ID #244 指代速度表的线索。\n\n现在按转向灯（左箭头和右箭头）并留意\
    \ ID# 188。当你触动转向灯时，它应该出现，并在关闭几秒钟后消失。使用左 SHIFT 和右 SHIFT 键，或右 SHIFT 键加 X、Y、A 和 B\
    \ 键来锁定和解锁车门，并观察 ID# 19B 旁边的数据变化。锁定或解锁车门时，19B 的行应该只出现片刻。\n\n"
