    \ online, including the exact GPS coordinates of the location where the picture\
    \ was taken and what kind of smartphone was used.\n\nYou learned the importance\
    \ of thinking before you share, being aware of your security and privacy settings,\
    \ limiting who can see your posts, and reporting fraud and other cybercrimes quickly.\
    \ As smart cyberdefenders, we have to balance convenience with security to protect\
    \ ourselves and the people and organizations we care about.\n\nEach tool and technique\
    \ discussed in this chapter can be used by ethical hackers to improve security\
    \ and train people to protect themselves. But it can also be used by attackers\
    \ to target victims. The first step in being prepared is to be aware of what information\
    \ is already out there. Take control of what information you share online, and\
    \ you’ll already be one step ahead of online attackers.\n\n# 5  \n\nSocial Engineering\
    \ and Phishing Attacks \n\n![](image_fi/book_art/chapterart.png)\n\nIn this chapter,\
