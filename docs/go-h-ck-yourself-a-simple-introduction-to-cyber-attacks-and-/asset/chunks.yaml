    除了 VirtualBox 本身，你还需要安装 VirtualBox 扩展包，它添加了所需的功能，例如支持将较新的 USB 设备连接到你的虚拟机。现在就去安装它。


    1. 返回 VirtualBox 下载页面（`https://www.virtualbox.org/wiki/Downloads`），找到 VirtualBox
    扩展包部分，并点击 `All supported platforms` 下载扩展包。


    2. 打开 VirtualBox。（在 Windows 上，请务必右键单击 VirtualBox 图标并选择 `Run as administrator`。）


    3. 从你的 `Downloads` 文件夹打开扩展包。


    4. 一旦 VirtualBox 扩展包安装窗口打开，点击 `Install`。


    ## 创建 Kali Linux 虚拟机


    现在你有了 VirtualBox，将创建你的 Kali Linux 虚拟机。Kali 是全球道德黑客使用的 Linux 操作系统的一个版本。它包含超过 600
    个安全和黑客工具，因此它是你攻击虚拟机的完美操作系统。


    1. 访问 `https://www.kali.org/downloads/`，向下滚动到虚拟机部分，并点击链接前往 VM 下载页面。


    2. 点击 `Kali Linux VirtualBox Images` 选项卡以查看与 VirtualBox 兼容的下载选项。请务必查找 VirtualBox
    镜像——还有针对 VMware（一种与 VirtualBox 不兼容的不同软件包）制作的镜像。


    3. 点击 `Kali Linux VirtualBox 64-Bit` 下载 VM。该文件大约 4GB，请在网络连接快速的地方下载。


    4. 启动 VirtualBox 并选择 `File`▶`Import Appliance`。


    5. 点击右侧的文件夹图标并找到你的 Kali Linux 文件。选择文件，点击 `Open`，然后点击 `Next`（在 PC 上）或 `Continue`（在
    Mac 上）。


    6. 你现在应该看到要导入的 Kali Linux VM 的设置列表。点击 `Import` 继续。


    7. 当 VM 导入完成后，你会在 Oracle VM VirtualBox Manager 左侧看到它，如 图 3-1 所示。


    ![Figure 3-1: The Kali Linux VM appears in the list on the left of the VirtualBox
    Manager.](img/f03001.png)


    图 3-1：Kali Linux VM 出现在 VirtualBox Manager 左侧的列表中。


    当你添加其他 VM 时，它们会与 Kali 一起出现在列表中。现在，让我们测试新的 Kali VM 以确保它在你的系统上运行。


    ## 运行 Kali VM


    双击 VirtualBox Manager 面板中的 Kali Linux VM 条目以启动 Kali Linux 虚拟机。第一次在 VirtualBox
    中运行 VM 时，由于你的 Mac 或 PC 上的不同设置，可能会遇到错误。如果在运行 VirtualBox 或启动 Kali VM 时遇到任何问题，请参见附录
    B。


    当 VM 完成启动后，你会来到登录屏幕。使用用户名 `kali` 和密码 `kali` 登录。登录后，你会看到带有标志性 Kali 龙徽标的屏幕，如 图 3-2
    所示。欢迎使用 Kali Linux！


    在计算机中使用计算机需要一些时间来适应。一旦你单击 VM 窗口内部，你的键盘和鼠标就会被“捕获”以在 VM 中使用。要将鼠标和键盘返回到你的物理（主机）计算机，请单击
    VM 窗口外部或按键盘上的 `host key`。这应该是 PC/Linux 机器上的 `right` CTRL 键，或 Mac 上的 `left` COMMAND
    键。如果你需要提醒，主机键也应该在 VM 窗口右下角标识。


    ![Figure 3-2: Your Kali Linux VM is ready to go!](img/f03002.png)


    图 3-2：你的 Kali Linux VM 已准备就绪！


    如果你发现 VM 屏幕和图标太小，请转到 `View`▶`Virtual Screen 1` 并尝试更改缩放或分辨率。此外，如果你让 VM 闲置一段时间，VM
    窗口可能会变空白。如果发生这种情况，请单击 Kali 窗口并按空格键唤醒机器。


    花些时间探索 Kali Linux。在本章后面设置网络之前，你无法连接到互联网，但你仍然可以四处看看。单击屏幕顶部的 `Applications` 菜单（带有龙徽标的按钮）以查看
    Kali 的数百个程序和工具中的一些。它们现在可能看起来令人生畏，但本书将教你使用其中的几个，帮助你更有信心地探索其他工具。


    看了一段时间后，关闭 Kali Linux VM 窗口。你应该会看到关闭虚拟机弹出窗口。选择 `Save the machine state` 并点击 `OK`。保存机器状态让你下次打开
    VM 时可以从上次离开的地方继续，就像让计算机进入睡眠状态而不是完全关机一样。但是，如果你在安装软件或更改设置后需要重新启动 VM，则需要选择 `Power
    off the machine`。


    恭喜！你已设置好第一个虚拟机！如果这是你第一次使用 Linux，给自己一个高五！有了这个 Kali VM，你将能够针对其他目标虚拟机测试数十个（甚至数百个）黑客攻击，以了解在线攻击是如何发生的以及如何防御它们。我们将在下一节设置其中一个目标
    VM。


    ## 创建 Windows VM


    你现在将创建一个运行 Windows 的第二个 VM。作为世界上最常见的桌面和笔记本电脑操作系统，Windows 是道德和不道德黑客的头号目标，因此它是学习攻击和防御的重要操作系统。我们将从
    Microsoft Edge 开发者网站下载一个功能齐全的 Windows 10 VM。


    1. 访问 `https://developer.microsoft.com/en-us/microsoft-edge/tools/vms/`（或搜索 Microsoft
    Edge 开发者虚拟机网站）。


    2. 选择一个 Windows 10 虚拟机，选择 VirtualBox 作为你的平台，并下载 VM。该文件超过 6GB，请在网络连接快速的地方下载此 VM。


    3. 解压下载的文件。


    4. 打开 VirtualBox 并选择 `File`▶`Import Appliance`。


    5. 点击右侧的文件图标并找到你的 Windows 10 VM。它将是 `*.ova` 文件或 `*.ovf` 文件。选择文件，然后点击 `Continue`。


    6. 你现在应该看到 Windows 10 VM 的设置列表。点击 `Import` 继续。


    7. 导入完成后，Windows VM 将与你的 Kali VM 一起出现在 VirtualBox Manager 列表中，如 图 3-3 所示。


    ![Figure 3-3: After you import the Windows VM, you’ll have two VMs in your virtual
    ethical hacking lab!](img/f03003.png)


    图 3-3：导入 Windows VM 后，你的虚拟道德黑客实验室中将有两个 VM！


    现在让我们打开 Windows 10 VM 以确保它正常工作。双击 VirtualBox Manager 列表中的 Windows 10 VM。VM 加载后，单击窗口内部以显示
    Windows 登录提示。使用默认用户名 `IEUser` 和默认密码 `Passw0rd!`（用零代替字母 `o`）登录。如果密码不起作用，请查看 Microsoft
    VM 下载页面。默认密码应列在下载按钮下方。


    一旦虚拟桌面加载，四处点击并探索一下。它就像一台普通的 Windows 计算机。你暂时无法上网，但我们将在下一节设置虚拟网络。探索完 Windows VM
    后，关闭 VM 并选择 `Power off the machine`。你需要完全关闭 VM 才能更改网络设置。


    你现在在道德黑客实验室中有两个虚拟机，一个 Kali Linux VM 和一个 Windows 10 VM。我们将在未来章节中根据需要添加更多 VM。一旦我们将这两个
    VM 连接在一起，你就可以在不危及笔记本电脑或台式机的情况下练习黑客攻击和防御。


    '
