    ## 现在你是管理员了，请登录！\n\n恭喜！你现在可以以管理员身份访问该机器。请继续登录。输入 `.\\ironman` 作为用户名（或从帐户列表中选择\
    \ **ironman**，如 Figure 2-5 所示）。`ironman` 前面的点和反斜杠告诉 Windows 该帐户是本地计算机上的，而不是存储在网络服务器上。输入用户名后，输入密码\
    \ `Jarvis`。\n\n ![Figure 2-5: You can now use the ironman user to log in to this\
    \ Windows PC.](img/f02005.png)\n\nFigure 2-5: You can now use the *ironman* user\
    \ to log in to this Windows PC.\n\n由于我们将 *ironman* 用户设为本地管理员组的成员，你应该拥有对 *所有* 文件和文件夹的管理员级访问权限，包括\
    \ *C:\\Users\\\\* 中的所有用户和文档，如 Figure 2-6 所示。\n\n![Figure 2-6: As an administrator-level\
    \ user, you can see all users’ files, not just your own.](img/f02006.png)\n\n\
    Figure 2-6: As an administrator-level user, you can see *all* users’ files, not\
    \ just your own.\n\n当你第一次点击进入另一个用户的文件夹时，你会看到一个弹出消息，提示你需要权限才能打开另一个用户的文件，如 Figure\
    \ 2-7 所示。由于你是管理员，请点击 **Continue** 以授予自己永久访问权限！\n\n![Figure 2-7: Administrators\
    \ can give themselves permission to access anyone’s files on the same computer.](img/f02007.png)\n\
    \nFigure 2-7: Administrators can give themselves permission to access anyone’s\
    \ files on the same computer.\n\nSticky Keys 黑客攻击仅适用于 Windows 机器。但是，运行 macOS 的计算机也容易受到物理访问攻击。\n\
    \n# Mac Root Hack\n\n与 Sticky Keys 黑客攻击类似，Mac root hack 是一种物理访问攻击，将使你获得计算机的管理员级访问权限。它使你成为\
    \ *root* 用户，即 macOS 计算机上的管理员级帐户。对于此黑客攻击，你只需要一台 Mac 计算机。我们将在 *single-user mode*（一种故障排除和修复登录模式）下重启\
    \ Mac。从那里，我们可以更改 root 用户的密码，从而获得对计算机上所有文件的访问权限。\n\n## 更新 Root 用户设置\n\n1. 首先，Mac\
    \ 需要完全关闭，而不仅仅是睡眠。如果它尚未关闭，请按住电源按钮约六秒钟。\n\n"
