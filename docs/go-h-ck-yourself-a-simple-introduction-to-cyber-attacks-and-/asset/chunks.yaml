- raw: "```\n359878442cf617606802105e2f439dbc Wow!\n63191e4ece37523c9fe6bb62a5e64d45\
    \ Great\n9dddd5ce1b1375bc497feeb871842d4b job\n4d1f35512954cb227b25bbd92e15bc7b\
    \ cracking\ne6071c75ea19bef227b49e5e304eb2f1 passwords!\n```\n\nListing 7-2: Cracked\
    \ passwords from [Listing 7-1](#c07.xhtml#listing7-1)\n\n# 8  \n\nWeb Hacking\n\
    \n![](image_fi/book_art/chapterart.png)\n\nHacking an individual computer might\
    \ yield a handful of usernames, passwords, and other data. But hacking a web server\
    \ could give an attacker *millions* of usernames and passwords to test on banking\
    \ sites, email servers, and more.\n\nA 2019 attack on Quest Diagnostics through\
    \ a flaw in its web payment page exposed 12 million patients’ records. In 2017,\
    \ the credit bureau Equifax failed to protect 150 million people’s credit information,\
    \ including birth dates, Social Security numbers, and addresses. A hack against\
    \ Marriott in 2018 compromised 500 million travelers’ data, including credit card\
    \ numbers and passport data. The largest data breach to date—the 2013 attack on\
    \ web search engine and email platform Yahoo!—exposed all 3 *billion* users’ accounts,\
    \ including email addresses and passwords.\n\nIn this chapter, you’ll see how\
    \ malicious hackers attack web applications with only a web browser and a few\
    \ lines of code. You’ll also learn some common ways security professionals defend\
    \ against web attacks, safeguarding millions (perhaps billions!) of people’s data\
    \ from cybercriminals.\n\n## The Metasploitable VM\n\nWe want to practice web\
    \ hacking safely and ethically, so we’ll set up a web server in our virtual hacking\
    \ lab. The creators of Metasploit also created an intentionally vulnerable web\
    \ server, called Metasploitable, for training purposes. We’re going to use a version\
    \ of that server that I’ve customized for you. Let’s add it to your virtual hacking\
    \ lab:\n\n1.  Go to [https://www.nostarch.com/go-hck-yourself/](https://www.nostarch.com/go-hck-yourself/)\
    \ and click the link to download the *Metasploitable2-gohack.ova* file to your\
    \ host computer.\n\n2.  Double-click the downloaded file to open it in VirtualBox.\
    \ The Import Virtual Appliance window will open, as shown in [Figure 8-1](#c08.xhtml#figure8-1).\
    \ Click **Import**.\n\n    ![Figure 8-1: Importing the Metasploitable2-gohack.ova\
    \ file into VirtualBox](image_fi/502000c08/f08001.png)\n\n    Figure 8-1: Importing\
    \ the *Metasploitable2-gohack.ova* file into VirtualBox\n\n3.  Select the Metasploitable2\
    \ VM in the VirtualBox VM Manager and click **Settings**.\n\n4.  Go to the **Network**\
    \ tab and make sure the Enable Network Adapter box is checked and shows Attached\
    \ to: NAT Network and Name: PublicNAT, just as for our other VMs. The correct\
    \ settings are shown in [Figure 8-2](#c08.xhtml#figure8-2).\n\n    ![Figure 8-2:\
    \ Making sure the Metasploitable VM is connected to the PublicNAT network](image_fi/502000c08/f08002.png)\n\
    \n    Figure 8-2: Making sure the Metasploitable VM is connected to the PublicNAT\
    \ network\n\n5.  Click **OK** to save these network settings. Your new Metasploitable\
    \ VM is now ready to run!\n\n6.  Select Metasploitable in VirtualBox Manager and\
    \ click **Start**. Because Metasploitable is a web server, not a desktop computer,\
    \ it uses a text-based interface instead of a graphical user interface. If the\
    \ interface is too small to read, go to the VM’s menu bar and select **View**▶**Virtual\
    \ Screen 1**▶**Scale to 200%** (or another value that fits your screen).\n\n7.\
    \  Enter the username `msfadmin` and password `msfadmin`. The password won’t show\
    \ up as you type in the terminal window on Metasploitable, but if you enter it\
    \ correctly, the prompt will change from the login to a shell prompt like this\
    \ one:\n\n    ```\n    msfadmin@metasploitable:~$\n    ```\n\n8.  Enter this command:\n\
    \n    ```\n    msfadmin@metasploitable:~$ ip a\n    ```\n\n    Metasploitable\
    \ will respond with its IP address (`10.0.9.8` in my case):\n\n    ```\n    --snip--\n\
    \    2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast qlen\
    \ 1000 link/ether 08:00:27:11:23:67 brd ff:ff:ff:ff:ff:ff inet 1 10.0.9.8/24 brd\
    \ 10.0.9.255 scope global eth0 --snip--\n    ```\n\n    Take note of the IP address\
    \ 1. You’ll need it to surf to the Metasploitable VM’s web server from your other\
    \ virtual machines.\n\n## Web Hacking from a Browser\n\nWeb hacking is very common\
    \ because it’s rewarding for attackers (remember, a successful attack against\
    \ a web server can yield *millions* of users’ information at once), web servers\
    \ are always on and connected to the internet, and the attacker needs only a web\
    \ browser to do it. To see how it works, we’ll hack the Metasploitable server\
    \ from the Edge browser in our Windows 10 VM.\n\nStart your Windows 10 VM in VirtualBox\
    \ Manager. Log in with the credentials `IEUser` and `Passw0rd!`. Open the Edge\
    \ browser (it’s the blue *e* swirl icon on the taskbar) and enter your Metasploitable\
    \ VM’s IP address into the address bar. You’ll see the Metasploitable 2 home page\
    \ shown in [Figure 8-3](#c08.xhtml#figure8-3).\n\n![Figure 8-3: From your Windows\
    \ 10 VM, enter your Metasploitable VM’s IP address to see this home page.](image_fi/502000c08/f08003.png)\n\
    \nFigure 8-3: From your Windows 10 VM, enter your Metasploitable VM’s IP address\
    \ to see this home page.\n\nMetasploitable 2 contains five vulnerable web applications,\
    \ but we’ll focus on just one of them: DVWA, or Darn Vulnerable Web App. This\
    \ intentionally vulnerable open source web application was built to help web developers\
    \ and security professionals learn basic hacks, as well as how to protect a web\
    \ application from them. DVWA has different vulnerability levels so users can\
    \ try hacking applications with varying degrees of security. We’ll set the security\
    \ level to low, to simulate a web application with no added security.\n\n1.  Click\
    \ the **DVWA** link on the Metasploitable 2 home page. You’ll see the app’s login\
    \ screen, shown in [Figure 8-4](#c08.xhtml#figure8-4).\n\n2.  Enter `admin` as\
    \ the username and `password` as the password to access DVWA. \n\n    ![Figure\
    \ 8-4: The DVWA login screen with our credentials](image_fi/502000c08/f08004.png)\n\
    \n    Figure 8-4: The DVWA login screen with our credentials\n\n3.  Click **DVWA\
    \ Security** on the left.\n\n4.  Under the Script Security section, set the security\
    \ level to **low** and click **Submit**, as shown in [Figure 8-5](#c08.xhtml#figure8-5).\n\
    \n    ![Figure 8-5: Setting the DVWA script security level to low](image_fi/502000c08/f08005.png)\n\
    \n    Figure 8-5: Setting the DVWA script security level to low\n\nNow we’re ready\
    \ to try out two kinds of web attacks on DVWA: cross-site scripting attacks and\
