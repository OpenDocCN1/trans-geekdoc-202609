    \ `TF` version in all your `Notebooks`. This way, if the default version changes,\
    \ your `Notebooks` still work. ![](rsrc14K.jpg)\n\n### 9. Use TensorBoard\nGoogle\
    \ Colab provides support for `TensorBoard` by default. This is a great tool for\
    \ visualizing the performance of your model. Use it! ![](rsrc14M.jpg)\n\n### 8.\
    \ Train TFLite Models on Colab\nWhen building mobile machine learning models,\
    \ you can take advantage of `Colab`’s resources to train your models. The alternative\
    \ to this is training your model using other expensive cloud solutions or on your\
    \ laptop, which might not have the needed compute power.\n\n### 7. Use TPUs\n\
    Should you need more powerful processing for your model, then change your default\
    \ runtime to the `TPU`. However, you should only use `TPUs` when you really need\
    \ them, because their availability is on a limited basis, given how resource-intensive\
    \ they are. ![](rsrc14N.jpg)\n\n### 6. Use Local Runtimes\nIn the event that you\
    \ have your own powerful hardware accelerator, then `Colab` allows you to connect\
    \ to it. Just click on the connect drop down and select your preferred runtime.\
    \ ![](rsrc14P.jpg)\n\n### 5. Use Colab Scratchpad\nSometimes you might find yourself\
    \ in a situation where you want to test things out quickly. Instead of creating\
    \ a new `Notebook` that you don’t intend to save on your drive, you can use an\
    \ empty `Notebook` that doesn’t save to your drive.\n\n### 4. Copy Data to Colabs\
    \ VM\nIn the interest of speeding up the loading of data, it’s recommended that\
    \ you copy your data files into `Colab`’s `VM` instead of loading them from elsewhere.\n\
    \n### 3. Check Your Ram and Resource Limits\nSince `Colab`’s resources are free,\
    \ it means that they are not guaranteed. Therefore, keep your eye on the `RAM`\
    \ and `Disk` usage to ensure that you don’t run out of resources. ![](rsrc14R.jpg)\n\
    \n### 2. Close Tabs when Done\nClosing tabs when done ensures that you disconnect\
    \ from the `VM` and therefore save resources.\n\n### 1. Use GPUs only when Needed\n\
    Since these resources are subject to restriction, save your `GPU` usage for when\
    \ you really need it. However, if you need to work with `Colab` without the restrictions\
    \ of the free version, you can check out the pro version. I hope that you will\
    \ find these `Colab` tips and tricks for `TensorFlow` helpful.\n\n# Federated\
    \ Learning\n\nAdvancements in the power of machine learning have brought with\
    \ them major data privacy concerns. This is especially true when it comes to training\
    \ machine learning models with data obtained from the interaction of users with\
    \ devices such as smartphones. So the big question is, how do we train and improve\
    \ these on-device machine learning models without sharing personally-identifiable\
    \ data? That is the question that we’ll seek to answer in this look at a technique\
    \ known as federated learning.\n\n## Centralized Machine Learning\n\nThe traditional\
    \ process for training a machine learning model involves uploading data to a server\
    \ and using that to train models. This way of training works fine as long as the\
    \ privacy of the data is not a concern. However, when it comes to training machine\
    \ learning models where personally identifiable data is involved (on-device, or\
    \ in industries with sensitive data like healthcare), this approach becomes unsuitable.\
    \ Training models on a centralized server also means that you need enormous amounts\
    \ of storage space, as well as world-class security to avoid data breaches. But\
    \ imagine if you were able to train your models with data that’s locally stored\
    \ on a user's device.\n\n## Machine Learning on Decentralized Data: Federated\
    \ learning\n\nFederated learning is a model training technique that enables devices\
    \ to learn collaboratively from a shared model. The shared model is first trained\
    \ on a server using proxy data. Each device then downloads the model and improves\
    \ it using `federated data` from the device. The device trains the model with\
    \ locally available data. The changes made to the model are summarized as an `update`\
    \ that is then sent to the cloud. The training data and individual updates remain\
    \ on the device. In order to ensure faster uploads of these updates, the model\
    \ is compressed using rotations and quantization. When the devices send their\
    \ specific models to the server, the models are averaged to obtain a single combined\
    \ model. This is done for several iterations until a high-quality model is obtained\
    \ ![](rsrc14S.jpg)\n\nCompared to centralized machine learning, federated learning\
    \ has a couple of advantages:\n- **Ensuring privacy**, since the data remains\
    \ on the user’s device.\n- **Lower latency**, because the updated model can be\
    \ used to make predictions on the user’s device.\n- **Smarter models**, given\
    \ the collaborative training process.\n- **Less power consumption**, as models\
    \ are trained on a user’s device ![](rsrc14T.jpg)\n\nIn order to ensure that an\
    \ application’s user experience is not hampered, the model training happens when\
    \ the user's device is on WiFi, is idle, and connected to a power supply ![](rsrc14U.jpg\n\
    \n## TensorFlow Federated\n\nTensorFlow enables the application of federated learning\
    \ by leveraging its own framework. [TensorFlow Federated (TFF)](https://www.google.com/url?q=https://www.tensorflow.org/federated&sa=D&ust=1597504082156000&usg=AOvVaw3rA-I6vkJUB3w)\
    \ is an open-source framework for machine learning and other computations on decentralized\
    \ data. `TFF` has two layers: the `Federated Learning (FL) API` and the `Federated\
    \ Core (FC) API`. The `Federated Learning (FL) API` allows developers to apply\
