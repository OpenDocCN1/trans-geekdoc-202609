    Intermediate Tutorials for Machine Learning Top 10 Tricks for TensorFlow and Google
    Colab Users Google’s Colab is a truly innovative product for machine learning.
    It enables machine engineers to run Notebooks and easily share them with colleagues.
    Another key advantage is access to GPUs and TPUs. In this piece, we’ll highlight
    some of the tips and tricks that will help you in getting the best out of Google’s
    Colab. 10\. Specify TensorFlow version Very soon, the default TF version in Colab
    will be TF 2. What this means is that if you have Notebooks running in TF 1, they
    will probably fail. In order to ensure that your code doesn’t break, it’s recommended
    that you specify the TF version in all your Notebooks. This way, if the default
    version changes, your Notebooks still work. ![](rsrc14K.jpg)9\. Use TensorBoard
    Google Colab provides support for TensorBoard by default. This is a great tool
    for visualizing the performance of your model. Use it! ![](rsrc14M.jpg)8\. Train
    TFLite Models on Colab When building mobile machine learning models, you can take
    advantage of Colab’s resources to train your models. The alternative to this is
    training your model using other expensive cloud solutions or on your laptop, which
    might not have the needed compute power. 7\. Use TPUs Should you need more powerful
    processing for your model, then change your default runtime to the TPU. However,
    you should only use TPUs when you really need them, because their availability
    is on a limited basis, given how resource-intensive they are. ![](rsrc14N.jpg)6\.
    Use Local Runtimes In the event that you have your own powerful hardware accelerator,
    then Colab allows you to connect to it. Just click on the connect drop down and
    select your preferred runtime. ![](rsrc14P.jpg)5\. Use Colab Scratchpad Sometimes
    you might find yourself in a situation where you want to test things out quickly.
    Instead of creating a new Notebook that you don’t intend to save on your drive,
    you can use an empty Notebook that doesn’t save to your drive. 4\. Copy Data to
    Colabs VM In the interest of speeding up the loading of data, it’s recommended
    that you copy your data files into Colab’s VM instead of loading them from elsewhere.
    3\. Check Your Ram and Resource Limits Since Colab’s resources are free, it means
    that they are not guaranteed. Therefore, keep your eye on the RAM and Disk usage
    to ensure that you don’t run out of resources. ![](rsrc14R.jpg)2\. Close Tabs
    when Done Closing tabs when done ensures that you disconnect from the VM and therefore
    save resources. 1\. Use GPUs only when Needed Since these resources are subject
    to restriction, save your GPU usage for when you really need it. However, if you
    need to work with Colab without the restrictions of the free version, you can
    check out the pro version. I hope that you will find these Colab tips and tricks
    for TensorFlow helpful. Federated Learning Advancements in the power of machine
    learning have brought with them major data privacy concerns. This is especially
    true when it comes to training machine learning models with data obtained from
    the interaction of users with devices such as smartphones. So the big question
    is, how do we train and improve these on-device machine learning models without
    sharing personally-identifiable data? That is the question that we’ll seek to
    answer in this look at a technique known as federated learning. Centralized Machine
    Learning The traditional process for training a machine learning model involves
    uploading data to a server and using that to train models. This way of training
    works just fine as long as the privacy of the data is not a concern. However,
    when it comes to training machine learning models where personally identifiable
    data is involved (on-device, or in industries with particularly sensitive data
    like healthcare), this approach becomes unsuitable. Training models on a centralized
    server also means that you need enormous amounts of storage space, as well as
    world-class security to avoid data breaches. But imagine if you were able to train
    your models with data that’s locally stored on a user''s device. Machine Learning
    on Decentralized Data Enter: Federated learning . Federated learning is a model
    training technique that enables devices to learn collaboratively from a shared
    model. The shared model is first trained on a server using proxy data. Each device
    then downloads the model and improves it using data — federated data — from the
    device. The device trains the model with the locally available data. The changes
    made to the model are summarized as an update that is then sent to the cloud.
    The training data and individual updates remain on the device. In order to ensure
    faster uploads of theses updates, the model is compressed using random rotations
    and quantization. When the devices send their specific models to the server, the
    models are averaged to obtain a single combined model. This is done for several
    iterations until a high-quality model is obtained. ![](rsrc14S.jpg)Compared to
    centralized machine learning, federated learning has a couple of specific advantages:
    Ensuring privacy , since the data remains on the user’s device. Lower latency
    , because the updated model can be used to make predictions on the user’s device.
    Smarter models , given the collaborative training process. Less power consumption
    , as models are trained on a user’s device. ![](rsrc14T.jpg)In order to ensure
    that an application’s user experience is not hampered, the model training happens
    when the user''s device is on free WiFi, is idle, and connected to a power supply.
    ![](rsrc14U.jpg)TensorFlow Federated TensorFlow enables the application of federated
    learning by leveraging its own framework. T [ensorFlow Federated (TFF)](https://www.google.com/url?q=https://www.tensorflow.org/federated&sa=D&ust=1597504082156000&usg=AOvVaw3r8A-I6vkBatKieJUB3ujw)
     is an open-source framework for machine learning and other computations on decentralized
    data. TFF has two layers: the Federated Learning (FL) API and the Federated Core
    (FC) API. The Federated Learning (FL) API allows developers to apply federated
    training and evaluation to existing TensorFlow models. The Federated Core (FC)
    API is the core foundation for federated learning. It is a system of low-level
    interfaces for writing federated algorithms in combination with distributed communication
    operations in strongly-typed functional programming environments. An example application
    of federated learning is in [Google’s Gboard keyboard](https://www.google.com/url?q=https://arxiv.org/abs/1811.03604&sa=D&ust=1597504082157000&usg=AOvVaw3lI8ivtKHUGh898GYA4Ggy)
    . In this case, a recurrent neural network language model is trained using decentralized
    on-device datasets. Its aim is to predict the next word on smartphone keyboards.
    ![](rsrc14V.jpg)Training the model on client devices using the federated averaging
    algorithm is shown to perform better than server-based training using stochastic
    gradient descent. The algorithm is used on the server to combine updates from
    the clients and produce a new global model. In this case, the use of federated
    learning led to a 24% increase in next-word prediction accuracy. Other improvements
    to the Gboard experience resulting from this are enhanced emoji and GIF predictions.
    This means that users are now seeing more relevant emojis and GIFs when using
    Gboard. I hope this activates your interest in [federated learning](https://www.google.com/url?q=https://arxiv.org/abs/1610.05492&sa=D&ust=1597504082158000&usg=AOvVaw2mb7ovHJraCX18ylIHm2pD)
     and its potential to drive a new wave of on-device training, application personalization
    and increased data privacy. Machine Learning in Dask Processing a couple of gigabytes
    of data on one''s laptop is usually an uphill task, unless the laptop has high
    RAM and a whole lot of compute power. That notwithstanding, data scientists still
    have to look for alternative solutions to deal with this problem. Some of the
    hacks involve tweaking Pandas to enable it to process huge datasets, buying a
    GPU machine, or purchasing compute power on the cloud. In this piece, we’ll see
    how we can use [Dask](https://www.google.com/url?q=https://dask.org/&sa=D&ust=1597504082159000&usg=AOvVaw1QwYC0MkJLueFK0v_2WSfS)
     to work with large datasets on our local machines. Dask and Python Dask is a
    flexible library for parallel computing in Python. It’s built to integrate nicely
    with other open-source projects such as NumPy, Pandas, and scikit-learn. In Dask,
    Dask arrays are the equivalent of NumPy Arrays, Dask DataFrames the equivalent
    of Pandas DataFrames, and Dask-ML the equivalent of scikit-learn. These similarities
    make it very easy to adopt Dask into your workflow. The advantage of using Dask
    is that you can scale computations to multiple cores on your computer. This enables
    you to work on large datasets that don’t fit into memory. It also aids in speeding
    up computations that would ordinarily take a long time. ![](rsrc14W.jpg)Dask DataFrames
    When loading in huge data, Dask will usually read in a sample of the data in order
    to infer the data types. This will mostly lead to issues if a given column has
    different data types. In order to avoid type errors, it’s usually good practice
    to declare the data types beforehand. Dask is able to load huge files by cutting
    it up into chunks, as defined by the blocksize parameter. data\_types ={''column1'':
    str,''column2'': float} df = dd.read\_csv(“data,csv”,dtype = data\_types,blocksize=64000000
    ) ![](rsrc14X.jpg)Commands in a Dask DataFrame are mostly similar to the ones
    in Pandas. For example, getting the head and tail is similar: df.head() df.tail()
    Functions on the DataFrame are run lazily. This means that they aren’t computed
    until the compute function is called. df.isnull().sum().compute() Since the data
    is loaded in partitions, some Pandas functions such as sort\_values() will fail.
    The workaround is to use the nlargest()  function. Dask Clusters Parallel computation
    is key in Dask, as it allows one to run computations on multiple cores. Dask provides
    a machine scheduler that works on a single machine. It does not scale. It also
    offers a distributed scheduler that can scale to multiple machines. Using dask.distributed
     requires that you set up a Client . This should be the first thing you do if
    you intend to use dask.distributed  in your analysis. It offers low latency, data
    locality, data sharing between the workers, and is easy to set up. from dask.distributed
    import Client client = Client() ![](rsrc14Y.jpg)Using dask.distributed  is advantageous
    even on a single machine, because it offers some diagnostic features via a dashboard.
    Failure to declare a Client  will leave you using the single machine scheduler
    by default. It provides parallelism on a single computer by using processes or
    threads. Dask ML Dask also enables you to perform machine learning training and
    prediction in a parallel manner. The goal of dask-ml  is to offer machine learning
    that’s scalable. When you declare n\_jobs = -1  in scikit-learn, you can run your
    computations in parallel. Dask utilizes this capability in order to enable you
    to distribute this compute in a cluster. This is done with the help of joblib
    , a package that allows for parallelism and pipelining in Python. Using Dask ML
    , you can implement scikit-learn models as well as other libraries such as XGboost.
    This is what a simple implementation would look like. First import train\_test\_split
    as usual for splitting your data into training and testing sets. from dask\_ml.model\_selection
    import train\_test\_split X\_train, X\_test, y\_train, y\_test = train\_test\_split(X,
    y, test\_size=0.2) Next, import the model you’d like to use and instantiate it.
    from sklearn.ensemble import RandomForestClassifier model = RandomForestClassifier(verbose=1)
    You then have to import joblib  to enable parallel computation. Next, run your
    training and prediction using the parallel backend. from sklearn.externals.joblib
    import parallel\_backend with parallel\_backend(‘dask’): model.fit(X\_train,y\_train)
    predictions = model.predict(X\_test) Limitations and Memory Usage Individual tasks
    in Dask can’t run in parallel. The workers are Python processes that inherit all
    the advantages and disadvantages of Python computations. Care should also be taken
    when working in a distributed environment to ensure data security and privacy.
    Dask has a central scheduler that tracks data on worker nodes and on the cluster.
    This scheduler also controls the freeing of data from the cluster. Once a task
    is completed it clears it from the memory in order to free up memory for other
    tasks. If something is needed by a certain client, or if it’s important for ongoing
    computations, it’s held in memory. Another Dask limitation is that it doesn’t
    implement all functions in Pandas. The Pandas interface is large, so Dask doesn’t
    implement it in its entirety. This means that trying some of these operations
    on Dask can be an uphill climb. Also, the operations that are slow on Pandas are
    also slow on Dask. When you wouldn’t need a Dask DataFrame In the following situations,
    you may not need Dask: When there are Pandas functions you need that haven’t been
    implemented in Dask. When your data fits perfectly into your computer’s memory.
    When your data isn’t in tabular form. In this case, try [dask.bag](https://www.google.com/url?q=https://docs.dask.org/en/latest/array.html&sa=D&ust=1597504082167000&usg=AOvVaw1TGiwoTLSq8Shme9jy78aT)
     or [dask.array](https://www.google.com/url?q=https://docs.dask.org/en/latest/bag.html&sa=D&ust=1597504082167000&usg=AOvVaw1Hr8TA-a6YlS-UwSCwhCcZ)
    . Final Thoughts In this article, we have seen how we can use Dask to work with
    a huge dataset on our local machine or in a distributed manner. We’ve seen that
    we can use Dask because of its familiar syntax and ability to scale. It has the
    ability to scale to thousands of cores. We’ve also seen that we can use it in
    machine learning for training and running predictions. You can learn more by checking
    out [these presentations](https://www.google.com/url?q=https://docs.dask.org/en/latest/presentations.html&sa=D&ust=1597504082168000&usg=AOvVaw1qdYcs9mp9csuh02iQlPm5)
     in the official documentation. Image Segmentation with Mask R-CNN The Mask R-CNN
    model classifies and localizes objects using bounding boxes. It also classifies
    each pixel into a set of categories. Therefore, it also produces a segmentation
    mask for each Region of Interest. In this piece, we’ll work through an implementation
    of Mask R-CNN in Python for image segmentation. Image segmentation (also knowns
    as semantic segmentation) refers to the process of linking each pixel in an image
    to a class label. These labels could include a person, car, flower, piece of furniture,
    etc., just to mention a few. We can think of semantic segmentation as image classification
    at a pixel level. For example, in an image that has many cars, segmentation will
    label all the objects as car objects. However, a separate class of models known
    as instance segmentation is able to label the separate instances where an object
    appears in an image. This kind of segmentation can be very useful in applications
    that are used to count the number of objects, such as counting the amount of foot
    traffic in a mall. We’ll use an open-source implementation of Mask R-CNN by Matterport.
    It produces bounding boxes and segmentation masks for the objects detected in
    an image. It’s based on Feature Pyramid Network (FPN) and a ResNet101 backbone.
    The project contains pre-trained weights from MS COCO. Therefore, we don’t have
    to train the model from scratch. We’ll start with a couple of imports: os  to
    set the path of our root directory skimage  for image processing Matplotlib   for
    visualization We then set the root directory. import os import sys import skimage.io
    import matplotlib import matplotlib.pyplot as plt ROOT\_DIR = os.path.abspath("./")
    We can now import Mask R-CNN. sys.path.append(ROOT\_DIR) from mrcnn import utils
    import mrcnn.model as modellib from mrcnn import visualize Next, we import the
    configurations for MS COCO. We then set the path for saving the trained model
    and the logs. sys.path.append(os.path.join(ROOT\_DIR, "coco/"))   import coco
    MODEL\_DIR = os.path.join(ROOT\_DIR, "logs") COCO\_MODEL\_PATH = os.path.join(ROOT\_DIR,
    "mask\_rcnn\_coco.h5") If the COCO weights aren’t available in our local directory,
    we download them. After that, we set the path for the images that we’ll use for
    image segmentation: if not os.path.exists(COCO\_MODEL\_PATH): utils.download\_trained\_weights(COCO\_MODEL\_PATH)
    IMAGE\_DIR = os.path.join(ROOT\_DIR, "images") Let’s use the COCO config to set
    the batch size. We set the batch size to 1 since we’ll be running predictions
    on one image. We then display the configurations. class InferenceConfig(coco.CocoConfig):
    GPU\_COUNT = 1 IMAGES\_PER\_GPU = 1 config = InferenceConfig() config.display()
    ![](rsrc14Z.jpg)Next, we can create an instance of the model. We set the model
    to inference because we’re not going to be training it. We then load the COCO
    weights that we downloaded earlier. model = modellib.MaskRCNN(mode="inference",
    model\_dir=MODEL\_DIR, config=config) model.load\_weights(COCO\_MODEL\_PATH, by\_name=True)
    ![](rsrc150.jpg)Let’s now process the image that we’re going to use: '
