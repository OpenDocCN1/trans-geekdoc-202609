    \n# Intermediate Tutorials for Machine Learning\n\n## Top 10 Tricks for TensorFlow\
    \ and Google Colab Users\n\nGoogle’s Colab is a truly innovative product for machine\
    \ learning. It enables machine engineers to run `Notebooks` and easily share them\
    \ with colleagues. Another key advantage is access to `GPUs` and `TPUs`. In this\
