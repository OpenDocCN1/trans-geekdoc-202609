    \ API` is the core foundation for federated learning. It is a system of low-level\
    \ interfaces for writing federated algorithms in combination with distributed\
    \ communication operations in strongly-typed functional programming environments.\n\
    \nAn example application of federated learning is in [Google’s Gboard keyboard](https://www.google.com/url?q=https://arxiv.org/abs/1811.03604&sa=D&ust=1597504082157000&usg=AOvVaw3lI8ivtKHUG898GYA4gy).\
    \ In this case, a recurrent neural network language model is trained using decentralized\
    \ on-device datasets. Its aim is to predict the next word on smartphone keyboards\
    \ ![](rsrc14V.jpg Training the model on client devices using the federated averaging\
    \ algorithm is shown to perform better than server-based training using stochastic\
    \ gradient descent. The algorithm is used on the server to combine updates from\
    \ the clients and produce a new global model. In this case, the use of federated\
    \ learning led to a 24% increase in next-word prediction accuracy. Other improvements\
    \ to the Gboard experience resulting from this are enhanced emoji and GIF predictions.\
    \ This means that users are now seeing more relevant emojis and GIFs when using\
    \ Gboard. I hope this activates your interest in [federated learning](https://www.google.com/url?q=https://arxiv.org/abs/1610.05492&sa=D&ust=1597504082158000&usg=AOvVaw2mb0ovHJraCX18ylm2pD)\
    \ and its potential to drive a new wave of on-device training, application personalization\
    \ and increased data privacy.\n\n# Machine Learning in Dask\n\nProcessing a couple\
    \ of gigabytes of data on one's laptop is usually an uphill task, unless the laptop\
    \ has high `RAM` and a whole lot of compute power. That notwithstanding, data\
    \ scientists still have to look for alternative solutions to deal with this problem.\
    \ Some of the hacks involve tweaking `Pandas` to enable it to process huge datasets,\
    \ buying a `GPU machine`, or purchasing compute power on the cloud. In this piece,\
    \ we’ll see how we can use [Dask](https://www.google.com/url?q=https://dask.org/&sa=D&ust=1597504082159000&usg=AOvVaw1QYC0MkJLueFK0v_2WSfS)\
    \ to work with large datasets on our local machines.\n\n## Dask and Python\n\n\
    `Dask` is a flexible library for parallel computing in Python. It’s built to integrate\
    \ nicely with other open-source projects such as `NumPy`, `Pandas`, and `scikit-learn`.\
    \ In `Dask`, `Dask arrays` are the equivalent of `NumPy Arrays`, `Dask DataFrames`\
    \ the equivalent of `Pandas DataFrames`, and `Dask-ML` the equivalent of `scikit-learn`.\
    \ These similarities make it very easy to adopt `Dask` into your workflow.\n\n\
    The advantage of using `Dask` is that you can scale computations to multiple cores\
    \ on your computer. This enables you to work on large datasets that don’t fit\
    \ into memory. It also aids in speeding up computations that would ordinarily\
    \ take a long time ![](rsrc14W.jpg\n\n## Dask DataFrames\n\nWhen loading in huge\
    \ data, `Dask` will usually read in a sample of the data in order to infer the\
    \ data types. In order to avoid type errors, it’s usually good practice to declare\
    \ the data types beforehand. `Dask` is able to load huge files by cutting it up\
    \ into chunks, as defined by the `blocksize` parameter.\n\n```python\ndata_types\
    \ = {'column1': str, 'column2': float}\ndf = dd.read_csv(\"data.csv\", dtype=data_types,\
    \ blocksize=640000)\n``` ![](rsrc14X.jpg\n\nCommands in `Dask DataFrame` are mostly\
    \ similar to the ones in `Pandas`. For example, getting the head and tail is:\n\
    \n```pythondf.head()\ndf.tail()\n```\n\nFunctions on the `DataFrame` are run lazily.\
    \ This means they aren’t computed until `compute()` is called. Since the data\
    \ is loaded in partitions, some `Pandas` functions as `sort_values()` will fail.\
    \ The workaround is to use `nlargest()` function.\n\n```\ndf.isnull().sum().compute()\n\
    ```\n\n## Clusters\n\nParallel computation is key in `Dask`, as it allows one\
    \ to run computations on multiple cores. `Dask` provides a machine scheduler that\
    \ works on a single machine. It does not scale. It also offers a distributed scheduler\
    \ that can scale to multiple machines.\n\n## Using dask.distributed\n\nUsing `dask.distributed`\
    \ is advantageous even on a single machine, because it offers some diagnostic\
    \ features via dashboard. This should be the first thing you do if you intend\
    \ to use `dask.distributed`.\n\n```python\nfrom dask.distributed import Client\n\
    client = Client()\n``` ![](rsrc14Y.jpg\n\n## Dask ML\n\n`Dask` also enables you\
    \ to perform machine learning and prediction in a parallel manner. The goal of\
    \ `dask-ml` is to offer machine learning that’s scalable. When you declare `n_jobs\
    \ = -1` in `scikit-learn`, you can run your computations in parallel. This is\
    \ done with the help of joblib, a package that allows for parallelism and pipelining\
    \ in Python. Using `Dask ML`, you can implement `scikit-learn` models as well\
    \ as other libraries such as `Xgboost`. This is what a simple implementation would\
    \ look like.\n\n```python\nimport train_test_split as\nfrom dask_ml.model_selection\
    \ import train_test_split\nX_train, X_test, y_train, y_test = train_test_split(X,\
    \ y, test_size=0.2)\n\nfrom sklearn.ensemble import RandomForestClassifier\nmodel\
    \ = RandomForestClassifier(verbose=1)\nYou then have to import joblib to enable\
    \ parallel computation.\n\nfrom sklearn.externals.joblib import parallel_backend\n\
    with parallel_backend('dask'):\n    model.fit(X_train, y_train)\npredictions =\
    \ model.predict(X_test)\n```\n\n## Limitations and Memory Usage\n\nIndividual\
    \ tasks in `Dask` can’t run in parallel. The workers are Python processes that\
    \ inherit all the advantages and disadvantages of Python computations. Care should\
    \ also be taken when working in a distributed environment to ensure data security\
    \ and privacy. `Dask` has a central scheduler that tracks data on worker nodes\
    \ and on the cluster. This scheduler also controls the freeing of data from the\
    \ cluster. Once a task is completed it clears it from the memory to free up memory\
    \ for other tasks. If something is needed by a certain client, or if it’s important\
    \ for ongoing computations, it’s held in memory.\n\nAnother Dask limitation is\
    \ that it doesn’t implement all functions in Pandas. The `Pandas` interface is\
    \ large, so `Dask` doesn’t implement it in its entirety. This means that trying\
    \ some of these operations on `Dask` can be an uphill climb. Also, the operations\
    \ that are slow on `Pandas` are also slow on `Dask`.\n\n## When you’t need a Dask\
    \ DataFrame\n\nIn the following situations, you may not need `Dask`:\n- When there\
    \ are `Pandas` functions you need that haven’t been implemented in `Dask`.\n-\
    \ When your data fits perfectly into your computer’s memory.\n- When your data\
    \ isn’t in tabular form. In this case, try [dask.bag](https://www.google.com/url?q=https://docs.dask.org/en/latest/array.html&sa=D&ust=1597504082167000&usg=AOvVaw1TGiwoTLSq8Shme9jy78at)\
    \ or [dask.array](https://www.google.com/url?q=https://docs.dask.org/en/latest/bag.html&sa=D&ust=1597504082160000&usg=AOvVaw1Hr8TA-a6YlS-UwSCwhCcZ).\n\
    \n# Final Thoughts\n\nIn this article, we have seen how we can use `Dask` to work\
    \ with a huge dataset on our local machine or in a distributed manner. We’ve seen\
    \ that we can use `Dask` because of its familiar syntax and ability to scale.\
    \ It has the ability to scale to thousands of cores.\n"
