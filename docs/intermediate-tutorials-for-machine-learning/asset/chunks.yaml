    \ on their GitHub page. You can also check out my other article on image segmentation.\n\
    \n## LightGBM: A Highly-Efficient Gradient Boosting Decision Tree\nThe power of\
    \ the LightGBM algorithm cannot be taken lightly (pun intended). LightGBM is a\
    \ distributed and efficient [gradient boosting framework](https://www.google.com/url?q=https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingClassifier.html&sa=D&ust=1597504082182000&usg=AOvVaw2rHXMUsu4pnWCYCseG2HiI)\
    \ that uses tree-based learning. It’s [histogram-based](https://www.google.com/url?q=https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingClassifier.html&sa=D&ust=1597504082183000&usg=AOvVaw2XOsw3E2ze6BA)\
    \ and places continuous values into discrete bins, which leads to faster training\
    \ and more efficient memory usage. In this piece, we’ll explore LightGBM in depth.\n\
    \n### Advantages\nAccording to the official docs, here are the advantages of LightGBM:\n\
    - Faster training speed\n- Lower memory usage\n- Better accuracy\n- Support of\
    \ parallel and GPU learning\n- Capable of handling large-scale data\n\n### Parameter\
    \ Tuning\nThe framework uses a leaf-wise growth algorithm, unlike many other tree-based\
    \ algorithms that use depth-wise growth. Leaf-wise tree algorithms tend to converge\
    \ faster than depth-wise ones. However, they tend to be more prone to overfitting.\
    \ ![](rsrc51.jpg)[](rsrc52.jpg)(rsrc53.jpg)\n\nHere are the parameters we need\
    \ to tune to get good results on a leaf-wise tree:\n- `num_leaves`: Setting the\
    \ number of leaves to `num_leaves = 2^(max_depth)` will give you the same number\
    \ of leaves as a depth-wise tree. However, isn’t a good practice.\n- `min_data_in_leaf`:\
    \ Prevents overfitting depending on `num_leaves` and the number of training samples.\
    \ For a large dataset, it can be set to hundreds or thousands.\n- `max_depth`:\
    \ For limiting the depth of the tree.\n- `save_binary`: To speed up data loading\
    \ in future.\n- `bagging`, `bagging_freq`: For parallel learning through setting\
    \ `bagging_freq`.\n- `feature_fraction`: For feature-sampling. To get better accuracy,\
    \ one can use a large `max_bin`, a small `learning_rate` with large `num_iterations`,\
    \ and use more training data. One can also use many `num_leaves`, but it may lead\
    \ to overfitting. Speaking of overfitting, you can deal with it by:\n- `path_smooth`:\
    \ Using a larger training set.\n- `lambda_1`, `lambda_2`, `min_gain_to_split`:\
    \ Avoid growing a very deep tree\n\n### Categorical Features\nA common way of\
    \ processing categorical features in machine learning is one-hot encoding. This\
    \ method is not optimal for tree learners, especially for high-cardinality categorical\
    \ features. Trees built on one-hot encoded features are unbalanced and have to\
    \ grow too deep in order to obtain good accuracy. Using `categorical_feature`\
    \ attribute, we can specify categorical features (without one-hot encoding) for\
    \ their model. Categorical features should be encoded as non-negative integers\
    \ less than `Int32`. They should start from zero.\n\n### Applications\nLightGBM\
    \ can be best applied to the following problems:\n- Binary classification using\
    \ the `logloss` objective function\n- Regression using the `L2 loss`\n- Multi-classification\
    \ using the `logloss` objective function\n- LambdaRank using `lambdarank` with\
    \ NDCG as the objective function\n\n### Metrics\nThe metrics supported by LightGBM\
    \ are:\n- L1 loss, L2 loss, Log loss, Classification error rate, AUC, NDCG, MAP,\
    \ Multi-class log loss, Multi-class error rate, Fair, Huber, Poisson, Quantile,\
    \ MAPE, Kullback-Leibler, Tweedie\n\nBy default, LightGBM is able to handle missing\
    \ values. You can disable this by setting `use_missing=false`. It uses `NA` to\
    \ represent missing values, but to use zero you can set `zero_as_missing=true`.\n\
    \n### Core Parameters\nHere are some of the core parameters for LightGBM:\n- `task`:\
    \ defaults to train. Other options are `predict`, `convert_model`, and `refit`.\
    \ The alias for this parameter is `task_type`.\n- `convert_model`: converts the\
    \ model into an if-else format.\n- `objective`: defaults to regression. The other\
    \ options are `regression_1`, `huber`, `fair`, `poisson`, `quantile`, `mape`,\
    \ `gamma`, `tweedie`, `binary`, `multiclass`, `multiclass_ova`, `cross_entropy`,\
    \ `cross_entropy_lambda`, `lambdarank`, and `rank_xend`. The aliases for this\
    \ parameter are `objective_type`, `app`, and `application`.\n- `boosting`: defaults\
    \ to `gbdt` — a traditional Gradient Boosting Decision Tree. Other options are\
    \ `rf` — Random Forest, `dart` — Dropout meet Multiple Additive Regression Trees,\
    \ `goss` — Gradient-based One-Side Sampling. This parameter’s aliases are `boosting_type`\
    \ and `boost`.\n- `num_leaves`: maximum tree leaves for base learners — defaults\
    \ to 31.\n- `max_depth`: maximum tree depth for base learners.\n- `learning_rate`:\
    \ the boosting learning rate.\n- `n_estimators`: number of boosted trees to fit\
    \ — defaults to 200000.\n- `importance_type`: the type of importance to be filled\
    \ in the `feature_importances_`. Using `split` means that the number of times\
    \ a feature is used in a model will be contained in the result.\n- `device_type`:\
    \ device for the tree learning — CPU Or GPU. Can be used with `device` as the\
    \ alias.\n\n### Learning Control Parameters\nLet’s look at a couple of learning\
    \ control parameters:\n- `force_col_wise`: When set to true, it forces col-wise\
    \ histogram building. It’s recommended to set this to true when the number of\
    \ columns is large, or the total number of bins is large. You can also set it\
    \ to true when you want to reduce cost on memory, and when the `num_threads` is\
    \ large, e.g greater than 20. This parameter is only used with a CPU.\n- `force_row_wise`:\
    \ When set to true, it forces row-wise histogram building. This parameter is only\
    \ used with a CPU. You can turn this one on when the number of data points is\
    \ large, the total number of bins is smaller, and when the `num_threads` is small\
    \ (e.g. less than or equal to 16). It can also be set to true when you want to\
    \ use a small `bagging_fraction` or `goss` boosting to speed up training.\n- `neg_bagging_fraction`:\
    \ Used for imbalanced classification problems.\n- `bagging_freq`: the frequency\
    \ for bagging. Zero means bagging is disabled.\n- `feature_fraction`: Can be used\
    \ to deal with overfitting. For instance, setting it to 0.5 would mean that LightGBM\
    \ will select 50% of the features at each node.\n- `extra_trees`: Set to true\
    \ when you want to use randomized trees.\n- `early_stopping_round`: When true,\
    \ stops once a certain parameter fails to improve.\n- `max_drop`: Defaults to\
    \ 50. Signifies the number of trees to drop every iteration.\n- `cat_l2`: L2 regularization\
    \ in a categorical split.\n- `cat_smooth`: Reduces the effect of noise in categorical\
    \ features, especially for categories with limited data.\n- `path_smooth`: Helps\
    \ prevent overfitting on leaves with few samples.\n\n Objective Parameters\nHere\
    \ are a couple of objective parameters to take note:\n- `is_balance`: Can be set\
    \ to true if the training data is unbalanced for classification problems.\n- `num_class`:\
    \ Used to indicate the number of classes in a multi-classification problem.\n\
    - `scale_pos_weight`: Weight of labels with positive class. Cannot be used together\
    \ with `is_balance`. This parameter increases the overall metric of the model\
    \ but may result in poor estimates of the individual probabilities.\n\nPractical\
    \ Implementation\nWe’ll now look at a quick implementation of the algorithm. We’ll\
    \ use scikit-learn’s wrapper for the classifier. As always we start by importing\
    \ the model:\n```python\nfrom lightgbm import LGBMClassifier\n```\nThe next step\
    \ is to create an instance of the model while setting the objective. The options\
    \ for the objective are `regression` for `LGBRegressor`, `binary` or `multiclass`\
    \ for `LGBMClassifier`, and `lambdarank` for `LGBanker`.\n```python\nmodel = LGBMClassifier(objective='multiclass')\n\
    ```\nWhen fitting the model, we can set the categorical features:\n```python\n\
    model.fit(X_train,y_train,categorical_feature=[0,3])\n```\nOnce you run predictions\
    \ on the model, you can also obtain the features:\n```python\npredictions = model.predict(X_test)\n\
    importances = model.feature_importances_\n```\n\n## Pruning Machine Learning Models\
    \ in TensorFlow\nPruning is a model optimization technique that involves eliminating\
    \ unnecessary values in the weight tensor. results in smaller models with accuracy\
    \ close to the baseline. In this article, we’ll work through an example as we\
    \ apply pruning and view the effect on the final model size.\n\n### Import the\
    \ Usual Suspects\nOur first step is to get a couple of imports out of the way:\n\
    ```python\nimport os\nimport zipfile\nimport tensorflow as tf\nimport tensorflow_model_optimization\
    \ as tfmot\nfrom tensorflow.keras.models import load_model\nfrom tensorflow import\
    \ keras\n%load_ext tensorboard\n```\nZipfile will help us in assessing the size\
    \ of the models.\n\n### Dataset Generation\nFor this experiment, we’ll generate\
    \ a regression dataset using scikit-learn. Thereafter, we split the dataset into\
    \ a training and test set:\n```python\nfrom sklearn.datasets import make_friedman1\n\
    X, y = make_friedman1(n_samples=10000, n_features=10, random_state=0)\nfrom sklearn.model_selection\
    \ import train_test_split\nX_train, X_test, y_train, y_test = train_test_split(X,\
    \ y, test_size=0.33, random_state=42)\n```\n\n### Model Without Pruning\nWe’ll\
    \ create a simple neural network to predict the target variable y. We’ll then\
    \ check the mean squared error. After this, we’ll compare this with the entire\
    \ model pruned, and then with just the Dense layer pruned.\n```python\ndef setup_model():\n\
    \    model = keras.Sequential([\n        keras.layers.Dense(units =128, activation='relu',input_shape=(X_train.shape[1],)),\n\
    \        keras.layers.Dense(units=1, activation='relu')\n    ])\n    return model\n\
    ```\nNext, we step up a callback to stop training the model once it stops improving,\
    \ after 30 epochs.\n```python\nearly_stop = keras.callbacks.EarlyStopping(monitor='val_loss',\
    \ patience=30)\n```\nLet’s print a summary of the model so that we can compare\
    \ it with the summary of the pruned models.\n```python\nmodel = setup_model()\n\
    model.summary()\n```\n![](rsrc154.jpg)\nLet’s compile the model and train it.\n\
    ```python\nmodel.compile(optimizer='adam', loss=tf.keras.losses.mean_squared_error,\
    \ metrics=['mae', 'mse'])\nmodel.fit(X_train,y_train,epochs=300,validation_split=0.2,callbacks=early_stop,verbose=0)\n\
    ```\nSince it’s a regression problem, we’re monitoring the mean absolute error\
    \ and the mean squared error. Here’s the model plotted to an image. The input\
    \ is 10 since the dataset we generated has 10 features.\n```python\ntf.keras.utils.plot_model(\n\
    \    model, to_file=\"model.png\", show_shapes=True, show_layer_names=True, rankdir=\"\
    TB\", expand_nested=True, dpi=96,\n )\n```\n![](rsrc155.jpg)\nLet’s now check\
    \ the mean squared error. We can move on the next section and see how this changes\
    \ when we prune the entire model.\n```python\nfrom sklearn.metrics import mean_squared_error\n\
    predictions = model.predict(X_test)\nprint('Without Pruning MSE %.4f' % mean_squared_error(y_test,predictions.reshape(3300)))\n\
    ```\nWithout Pruning MSE 0.0201\n\n### Pruning the Entire Model with ConstantSparsity\
    \ Pruning Schedule\nLet’s compared the above MSE with the one obtained upon pruning\
    \ the entire model. The first step is to define the pruning parameters. The weight\
    \ pruning is magnitude-based. This means that some weights are converted to zeros\
    \ during the training process. The model becomes sparse, hence making it easier\
    \ to compress. Sparse models also make inferencing faster since the zeros can\
    \ be skipped. The parameters expected are:\n- `pruning_schedule`: In this case,\
    \ we’re setting 50% sparsity, meaning that 50% of the weights will be zeroed.\n\
    - `block_size`: The dimensions (height, weight) for the block.\n- `block_pooling_type`:\
    \ The function to pool weights in the block. Must be AVG or MAX.\n\n```python\n\
    from tensorflow_model_optimization.sparsity.keras import ConstantSparsity\npruning_params\
    \ = {\n 'pruning_schedule': ConstantSparsity(0.5, 0),\n\n 'block_size': (1, 1),\n\
    \ 'block_pooling_type': 'AVG' \n}\n```\nWe can now prune the entire model by applying\
    \ our pruning parameters.\n```python\nfrom tensorflow_model_optimization.sparsity.keras\
    \ import prune_low_magnitude\nmodel_to_prune = prune_low_magnitude(\n    keras.Sequential([\n\
    \        keras.layers.Dense(128, activation='relu', input_shape=(X_train.shape[1],)),\n\
    \        keras.layers.Dense(units=1, activation='relu')\n    ]), **pruning_params)\n\
    ```\nLet’s check the model summary. Compare this with the summary of the unpruned\
    \ model. From the image below we can see that the entire model has been pruned—we’ll\
    \ see the difference with the summary obtained after pruning one layer.\n```python\n\
    model_to_prune.summary()\n```\n![](rsrc156.jpg)\nWe have to compile the model\
    \ before we can fit it to the training and testing set.\n```python\nmodel_to_prune.compile(optimizer='adam',\
    \ loss=tf.keras.losses.mean_squared_error, metrics=['mae', 'mse'])\n```\nSince\
    \ we’re applying pruning, we have to define a of pruning callbacks in addition\
    \ to the early stopping callback. We define the folder to log the model, then\
    \ create a list with the callbacks.\n```python\nlog_dir = '.models'\ncallbacks\
    \ = [\n    tfmot.sparsity.keras.UpdatePruningStep(), # Log sparsity and other\
    \ metrics in Tensorboard\n    tfmot.sparsity.keras.PruningSummaries(log_dir=log_dir),\n\
    \    keras.callbacks.EarlyStopping(monitor='val_loss', patience=10)\n]\n```\n\
    With that out of the way, we can now fit the model to the training set.\n```python\n\
    model_to_prune.fit(X_train,y_train,epochs=100,validation_split=0.2,callbacks=callbacks,verbose=0)\n\
    ```\nUpon checking the mean squared error for this model, we notice that it’s\
    \ slightly higher than the one for the unpruned model.\n```python\nprune_predictions\
    \ = model_to_prune.predict(X_test)\nprint('Whole Model Pruned MSE %.4f' % mean_squared_error(y_test,prune_predictions.reshape(3300)))\n\
    ```\nWhole Model Pruned MSE 0.1830\n\n### Pruning the Dense Layer Only with PolynomialDecay\
    \ Pruning Schedule\nLet’s now implement the same model—but this time, we’ll prune\
    \ the dense layer only. Notice the use of the PolynomialDecay function in the\
    \ pruning schedule.\n```python\nfrom tensorflow_model_optimization.sparsity.keras\
    \ import PolynomialDecay\nlayer_pruning_params = {\n 'pruning_schedule': PolynomialDecay(initial_sparsity=0.2,\
    \ final_sparsity=0.8, begin_step=1000, end_step=2000),\n 'block_size': (2, 3),\n\
    \ 'block_pooling_type': 'MAX' \n}\n```\n```python\nmodel_layer_pruning = keras.Sequential([\n\
    \    prune_low_magnitude(keras.layers.Dense(128, activation='relu',input_shape=(X_train.shape[1],)),\
    \ **layer_pruning_params),\n    keras.layers.Dense(units=1, activation='relu')\n\
    ])\n```\nFrom the summary, we can see that only the first dense layer will be\
    \ pruned.\n```python\nmodel_layer_pruning.summary()\n```\n![](rsrc157.jpg)\nWe\
    \ then compile and fit the model.\n```python\nmodel_layer_pruning.compile(optimizer='adam',\
    \ loss=tf.keras.losses.mean_squared_error, metrics=['mae', 'mse'])\nmodel_layer_pruning.fit(X_train,y_train,epochs=300,validation_split=0.1,callbacks=callbacks,verbose=0)\n\
    ```\nNow, let’s check the mean squared error.\n```python\nlayer_une_predictions\
    \ = model_layer_pruning.predict(X_test)\nprint('Layer Prunned MSE %.4f' % mean_squared_error(y_test,layer_une_predictions.reshape(3300)))\n\
    ```\nLayer Prunned MSE 0.1388\n\nWe can’t compare the MSE obtained here with the\
    \ previous one since we’ve used different parameters. If you’d like to compare\
    \ them, then ensure that the pruning parameters are similar.\n\n### Comparing\
    \ Model Sizes\nLet’s now compare the sizes of the models with and without pruning.\
    \ We start by training and saving the model weights for later.\n```python\ndef\
    \ train_save_weights():\n    model = setup_model()\n    model.compile(optimizer='adam',\
    \ loss=tf.keras.losses.mean_squared_error, metrics=['mae', 'mse'])\n    model.fit(X_train,y_train,epochs=300,validation_split=0.2,callbacks=callbacks,verbose=0)\n\
    \    model.save_weights('models/friedman_weights.h5')\n```\ntrain_save_weights()\n\
    ```\nWe’ll set up our base model and load the saved weights. We then prune the\
    \ entire model. We compile, fit the model, and visualize the results on Tensorboard.\n\
    ```python\nbase_model = setup_model()\nbase_model.load_weights('models/friedman_weights.h5')\n\
    # optional but recommended for accuracy\nmodel_for_pruning = tfmot.sparsity.keras.prune_low_magnitude(base_model)\n\
    model_for_pruning.compile(loss=tf.keras.losses.mean_squared_error, optimizer='adam',\
    \ metrics=['mae', 'mse'] )\nmodel_for_pruning.fit(X_train, y_train, callbacks=callbacks,\
    \ epochs=300, validation_split =0.2, verbose=0 ) %tensorboard --logdir={log_dir}\n\
    ```\n![](rsrc158.jpg)\nThe other pruning summaries can also be viewed on Tensorboard.\
    \ ![](rsrc159.jpg)\nLet’s now define a function to compute the sizes of the models.\n\
    ```python\ndef get_gzipped_model(model,mode_name,zip_name):\n    # Returns size\
    \ of gzipped model, in bytes.\n    model.save(mode_name, include_optimizer=False)\n\
    \    with zipfile.ZipFile(zip_name, 'w', compression=zipfile.ZIP_DEFLATED) as\
    \ f:\n        f.write(mode_name)\n    return os.path.getsize(zip_name)\n```\n\
    And now we define the model for export and then compute the sizes. For a pruned\
    \ model, tfmot.sparsity.keras.strip_pruning() is used to restore the original\
    \ model with the sparse weights. Notice the difference in size for the stripped\
    \ and unstripped models.\n```python\nmodel_for_export = tfmot.sparsity.keras.strip_pruning(model_for_pruning)\n\
    print(\"Size of gzipped model without stripping: %.2f bytes\" % (get_gzipped_model(model_for_pruning,'.models/for_pruning.h5','.models/for_pruning.zip)))\n\
    print(\"Size of gzipped model with stripping: %.2f bytes\" % (get_gzipped_model(model_for_export,'.models/for_export.h5','.models/for_export.zip)))\n\
    ```\nSize of gzipped model without stripping: 6101.00 bytes\nSize of gzipped model\
    \ with stripping: 5140.00 bytes\n\nRunning predictions on both models, we see\
    \ that they have the same mean squared error.\n```python\nmodel_for_pruning_predictions\
    \ = model_for_pruning.predict(X_test)\nprint('Model for Pruning Error %.4f' %\
    \ mean_squared_error(y_test,model_for_pruning_predictions.reshape(3300)))\nmodel_for_export_predictions\
    \ = model_for_export.predict(X_test)\nprint('Model for Export Error %.4f' % mean_squared_error(y_test,model_for_export_predictions.reshape(3300)))\n\
    ```\nModel for Pruning Error 0.0264\nModel for Export Error 0.0264\n\nFinal Thoughts\n\
    You can go ahead and test how different pruning schedules affect the size of the\
    \ model. Obviously, the observations made here are not universal. You’ll have\
    \ to try different pruning parameters and learn how they affect your model size,\
    \ prediction error, and/or accuracy depending on your problem. To optimize the\
    \ model even more, you could quantize it . If you’d like to explore that and more,\
    \ check the [repo](https://github.com/mwitiderrick/Pruning-in-TensorFlow&sa=D&ust=1597504082233000&usg=AOvVaw1YaEx2Om5b9dMGP4F7_AhK)\
    \ and the [resources](https://www.google.com/url?q=https://www.tensorflow.org/model_optimization/guide/pruning/comprehensive_guide&sa=D&ust=1597504082233000&usg=AOvVaw3xzJ3_eF2wyQS9CAU)\n\
    \n## Feature Ranking with Recursive Feature Elimination in Scikit-Learn\nFeature\
    \ selection is an important task for any machine learning application. This is\
    \ especially crucial when the data in question has many features. The optimal\
    \ number of features also leads to improved model accuracy. Obtaining the most\
    \ important features and the number of optimal features can be obtained via feature\
    \ importance or feature ranking. In this piece, we’ll explore feature ranking.\n\
    \nRecursive Feature Elimination\nThe first item needed for recursive elimination\
    \ is an estimator; for example, a linear model or a decision tree. These models\
    \ have coefficients for linear models and importances in decision tree models.\
    \ In selecting the optimal number of features, the estimator is trained and the\
    \ features are selected via the coefficients, or feature importances. The least\
    \ important features are removed. This process is repeated recursively until the\
    \ optimal number of features is obtained.\n\nApplication in Sklearn\nScikit-learn\
    \ makes it possible to implement recursive elimination via `sklearn.feature_selection.RFE`.\
    \ The class takes the following parameters:\n- `estimator`: a machine learning\
    \ estimator that can provide importances via `coef_` or `feature_importances_`.\n\
    - `n_features_select`: the number of features to select. Select half if not specified.\n\
    - `step`: an integer that indicates the number of features removed at each iteration,\
    \ or a number between 0 and 1 to indicate the percentage of features to remove.\n\
    \nOnce fitted, the following attributes can be obtained:\n- `ranking`: the ranking\
    \ of the features.\n- `n_features`: the number of features that have been selected.\n\
    - `support`: an array indicates whether or not a feature was selected.\n\nApplication\n\
    As noted earlier, we’ll need to work with an estimator that offers `feature_importances`\
    \ or `coeff_` attribute. Let’s work through a quick example. The dataset has 13\
    \ features—we’ll work on getting the optimal number of features.\n```python\n\
    import pandas as pd\ndf = pd.read_csv('heart.csv')\ndf.head()\n```\n![](rsrc1A.jpg)\n\
    Let’s obtain the X and y features.\n```python\nX = df.drop(['target'],axis=1)\n\
    y = df['target']\n```\nWe’ll split it into a testing and training set to prepare\
    \ for modeling:\n```python\nfrom sklearn.model_selection import train_test_split\n\
    X_train, X_test, y_train, y_test = train_test_split(X, y,random_state=0)\n```\n\
    Let’s get a couple of imports out of the way:\n- `pipeline`: since we’ll perform\
    \ some cross-validation. It’s best practice in order to avoid data leakage.\n\
    - `RepeatedStratifiedFold`: for repeated stratified-validation.\n- `cross_val_score`:\
    \ for evaluating the score on cross-validation.\n- `GradientBoostingClassifier`:\
    \ the estimator we’ll use.\n- `numpy`: so we can compute the mean of the scores.\n\
    ```python\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.model_selection\
    \ import RepeatedStratifiedFold\nfrom sklearn.model_selection import cross_val_score\n\
    from sklearn.feature_selection import RFE\nimport numpy as np\n```\nThe first\
    \ step is to create an instance of the `RFE` class while specifying the estimator\
    \ and the number of features you’d like to select. In this case, we’re selecting\
    \ 6:\n```python\nrfe = RFE(estimator=GradientBoostingClassifier(), n_features_select=6)\n\
    ```\nNext, we create an instance of the model we’d like use:\n```python\nmodel\
    \ = GradientBoostingClassifier()\n```\nWe’ll use a `Pipeline` to transform the\
    \ data. In the `Pipeline` we specify `rfe` for the feature selection step and\
    \ the model that’ll be used in the next step. We then specify `RepeatedStratifiedFold`\
    \ with 10 splits and 5 repeats. The stratified K fold ensures that the number\
    \ of samples from each class is well balanced in each fold. `RepeatedStratifiedFold`\
    \ repeats the stratified K fold the specified number of times, with a different\
    \ randomization in each repetition.\n```python\npipe = Pipeline([('Feature Selection',\
    \ rfe), ('Model', model)])\ncv = RepeatedStratifiedFold(n_splits=10, n_repeats=5,\
    \ random_state=36851234)\nn_scores = cross_val_score(pipe, X_train, y_train, scoring='accuracy',\
    \ cv=cv, n_jobs=-1)\nnp.mean(n_scores)\n```\nThe next step is to fit this pipeline\
    \ to the dataset.\n```python\npipe.fit(X_train, y_train)\n```\nWith that in place,\
    \ we can check the support and the ranking. The support indicates whether or not\
    \ a feature was chosen.\n```python\nrfe.support_\narray([ True, False, True, False,\
    \ True, False, False, True, False, True, False, True, True])\n```\nWe can put\
    \ that into a dataframe and check the result.\n```python\npd.DataFrame(rfe.support_,index=X.columns,columns=['Rank'])\n\
    ```\n![](rsrc1B.jpg)\nWe can also check the relative rankings.\n```python\nrf_df\
    \ = pd.DataFrame(rfe.ranking_,index=X.columns,columns=['Rank']).sort_values(by='Rank',ascending=True)\n\
    rf_df.head()\n```\n![](rsrc1C.jpg)\n\n### Automatic Feature Selection\nInstead\
    \ of manually configuring the number of features, it would be very nice if we\
    \ could automatically select them. This can be achieved via recursive feature\
    \ elimination and cross-validation. This is done via `sklearn.feature_selection.RFECV`.\
    \ The class takes the following parameters:\n- `estimator`: similar to `RFE` class.\n\
    - `min_features_select`: the minimum number of features to select.\n- `cv`: the\
    \ cross-validation strategy.\n\nThe attributes returned are:\n- `n_features`:\
    \ the optimal number of features selected via cross-validation.\n- `support_`:\
    \ the array containing information on the selection of a feature.\n- `ranking_`:\
    \ the ranking of the features.\n- `grid_scores_`: the scores obtained from cross-validation.\n\
    \nThe first step is to import the class and create its instance.\n```python\n\
    from sklearn.feature_selection import RFECV\nrfecv = RFECV(estimator=GradientBoostingClassifier())\n\
    ```\nThe next step is to specify the pipeline and the `cv`.\n```python\npipeline\
    \ = Pipeline([('Feature Selection', rfecv), ('Model', model)])\ncv = RepeatedStratifiedFold(n_splits=10,\
    \ n_repeats=5, random_state=36851234)\nn_scores = cross_val_score(pipeline, X_train,\
    \ y_train, scoring='accuracy', cv=cv, n_jobs=-1)\nnp.mean(n_scores)\n```\nLet’s\
    \ fit the pipeline and then obtain the optimal number of features.\n```python\n\
    pipeline.fit(X_train,y_train)\n```\nprint(\"Optimal number of features : %d\"\
    \ % rfecv.n_features)\n```\nOptimal number of features : 7\nThe rankings and support\
    \ can be obtained just like time.\n```python\nrfecv_df = pd.DataFrame(rfecv.ranking_,index=X.columns,columns=['Rank']).sort_values(by='Rank',ascending=True)\n\
    rfecv_df.head()\n```\nWith the `grid_scores_` we can plot a graph showing the\
    \ cross-validated scores.\n```python\nimport matplotlib.pyplot as plt\nplt.figure(figsize=(12,6))\n\
    plt.xlabel(\"Number of features selected\")\nplt.ylabel(\"Cross validation score\
    \ (nb of correct classifications)\")\nplt.plot(range(1, len(rfecv.grid_scores_)\
    \ + 1), rfecv.grid_scores_)\nplt.show()\n```\n![](rsrc1D.jpg)\n\n## Dealing with\
    \ Imbalanced Data in Machine Learning\nAs an ML engineer or data scientist, sometimes\
    \ you inevitably find yourself in a situation where you have hundreds of records\
    \ for one class label and thousands of records for another class label. Upon training\
    \ your model you obtain an accuracy above 90%. You then realize that the model\
    \ is predicting everything as if it’s in the class with the majority of records.\
    \ Excellent examples of this are fraud detection and churn prediction problems,\
    \ where the majority of the records are in the negative class. What do you do\
    \ in such a scenario?\n\n### Collect More Data\nThe most straightforward and obvious\
    \ thing to do is to collect more data, especially data points on the minority\
    \ class. This will obviously improve the performance of the model. However, this\
    \ is not always possible. Apart from the cost one would have to incur, sometimes\
    \ it's feasible to collect more data. For example, in the case of churn prediction\
    \ and fraud detection, you can’t just wait for more incidences to occur so you\
    \ can collect more data.\n\n### Consider Metrics Other than Accuracy\nAccuracy\
    \ is not a good way to measure the performance of a model where the class labels\
    \ are imbalanced. In this case, it's prudent to consider other metrics such as\
    \ precision, recall, Area Under the Curve (AUC) — just to mention a few.\n- Precision\
    \ measures the ratio of the true positives among all the samples that were predicted\
    \ as true positives and false positives. For example, out of the number of people\
    \ our model predicted would churn, how many actually churned?\n![](rsrc1E.jpg)\n\
    - Recall measures the ratio of the true positives from the sum of the true positives\
    \ and the false negatives. For example, the percentage of people who churned that\
    \ our model predicted would churn.\n![](rsrc1F.jpg)\n- The AUC is obtained from\
    \ the Receiver Operating Characteristics (ROC) curve. The curve is obtained by\
    \ plotting the true positive rate against the false positive rate. The false positive\
    \ rate is obtained by dividing the false positives by the sum of the false positives\
    \ and the true negatives. AUC closer to one is better, since it indicates that\
    \ the model is able to find the true positives.\n\n### Emphasize the Minority\
    \ Class\nAnother way to deal with imbalanced data is to have your model focus\
    \ on the minority class. This can be done by computing the class weights. The\
    \ model will focus on the class with a higher weight. Eventually, the model will\
    \ be able to learn equally from both classes. The weights can be computed with\
    \ the help of scikit-learn.\n```python\nfrom sklearn.utils.class_weight import\
    \ compute_class_weight\nweights = compute_class_weight('balanced', y.unique(),\
    \ y)\narray([0.51723504, 15.01705002])\n```\nYou can then pass these weights when\
    \ training the model. For example, in the case of logistic regression:\n```python\n\
    class_weights = { 0:0.51723504, 1:15.01705002 }\nlr = LogisticRegression(C=3.0,\
    \ fit_intercept=True, warm_start = True, class_weight=class_weights)\n```\nAlternatively,\
    \ you can pass the class weights as balanced and the weights will be automatically\
    \ adjusted.\n```python\nlr = LogisticRegression(C=3.0, fit_intercept=True, warm_start\
    \ = True, class_weight='balanced')\n```\nHere’s the ROC curve before the weights\
    \ are adjusted.\n```python\nimport matplotlib.pyplot as plt\nfrom sklearn.metrics\
    \ import roc_curve, roc_auc_score\npredictions = lr.predict(X_test)\nfpr, tpr\
    \ = roc_curve(y_test, predictions, pos_label=1)\nauc = roc_auc_score(y_test, predictions)\n\
    plt.figure(figsize=(12,6))\nplt.plot(fpr, tpr, label='AUC:{}'.format(auc))\nplt.plot([0,\
    \ 1], [0, 1], color='red', linestyle='--', label='Random')\nplt.xlabel('False\
    \ positive rate')\nplt.ylabel('True positive rate')\nplt.legend()\n```\n![](rsrc1G.jpg)\n\
    And here’s the ROC curve after the weights have been adjusted. Note the AUC moved\
    \ from 0.69 to 0.87.\n![](rsrc1H.jpg)\n\n### Try Different Algorithms\nAs you\
    \ focus the right metrics for imbalanced data, you can also try out different\
    \ algorithms. Generally, tree-based algorithms perform better on imbalanced data.\
    \ Furthermore, some algorithms such as LightGBM have hyperparameters that can\
    \ be tuned to indicate the data is not balanced.\n\n### Generate Synthetic Data\n\
    You can also generate synthetic data to increase the number of records in the\
    \ minority class — usually known as oversampling. This is usually done on the\
    \ training set after doing the train split. In Python, this can be done using\
    \ `imblearn`.\n```python\nfrom imblearn.over_sampling import SMOTE\nsmote = SMOTE(0.8)\n\
    X_resampled,y_resampled = smote.fit_resample(X.values, y.values)\npd.Series(y_resampled).value_counts()\n\
    ```\nOutput:\n```\n0    9667\n1    7733\n```\nYou can then fit your resampled\
    \ data to your model.\n```python\nmodel = LogisticRegression()\nmodel.fit(X_resampled,y_resampled)\n\
    predictions = model.predict(X_test)\n```\n\n### Unders the Majority Class\nYou\
    \ can also experiment on reducing the number of samples in the majority class.\
    \ One such strategy that can be implemented is the NearMiss method. You can also\
    \ specify the ratio just like in SMOTE , as well as the number of neighbors via\
    \ `n_neighbors`.\n```python\nfrom imblearn.under_sampling import NearMiss\nunderSample\
    \ = NearMiss(0.3,random_state=1545)\npd.Series(y_resampled).value_counts()\n```\n\
    Output:\n```\n0    1110\n1     333\n```\n\n### Final Thoughts\nOther techniques\
    \ that can be used include building an ensemble of weak learners to create a strong\
    \ classifier. Metrics such as precision-recall curve and area under curve (PR,\
    \ AUC) are also worth trying when the positive class is the most important. As\
    \ always, you should experiment with different techniques and settle on the ones\
    \ that give you the best results for your specific problems. Hopefully, this piece\
    \ has given some insights on how to get started.\n\n## Convolutional Neural Networks\
    \ (CNNs): Core Concepts Applied\nIn this tutorial, we’ll work through the core\
    \ concepts of convolutional neural networks (CNNs). To do this, we’ll use a common\
    \ dataset — the MNIST dataset—and a standard deep learning task—image classification\
    \ The goal is to walk through an example that will illustrate the processes involved\
    \ in building a convolutional neural network. The skills you will learn here can\
    \ easily be transferred to a separate dataset. So let’s go deeper…pun intended.\n\
    \n### Setup\nIn this step, we need to import Keras and other packages we’re going\
    \ to use in building our CNN. Import the following packages:\n- `Sequential`:\
    \ used to initialize the neural network.\n- `Conv2D`: used to make the convolutional\
    \ network with images.\n- `MaxPooling2D`: used to add the pooling layers.\n- `Flatten`:\
    \ converts the pooled feature map to a single column, which is then passed to\
    \ the fully connected layer.\n- `Dense`: adds the connected layer to the network.\n\
    - `Reshape`: used to change the shape of the input array\n\n```python\nimport\
    \ tensorflow as tf\nfrom tensorflow.keras import Sequential\nfrom tensorflow.keras.layers\
    \ import Dense,Conv2D,MaxPooling2D,Flatten,Reshape\n```\n\n### Import the Dataset\n\
    Next, we’ll import the `mnist` dataset from Keras. We load in the training set\
    \ and testing set. We have to scale our data so that it is compatible with our\
    \ network. In this case, we scale the images by dividing them by 255. This will\
    \ ensure the array values are between 0 and 1.\n```python\n(x_train, y_train),\
    \ (x_test, y_test) = mnist.load_data()\nx_train, x_test = x_train / 255.0, y_test\
    \ / 255.0\nvalidation_data = x_test, y_test\n```\n\n### Visualize a digit\nWe\
    \ can visualize a single digit using Matplotlib. This is important so we can see\
    \ a sample of the digits in the dataset like.\n```python\nimport matplotlib.pyplot\
    \ as plt\nimage = x_train[2]\nfig = plt.figure()\nplt.imshow(image, cmap='gray')\n\
    plt.show()\n```\n![](rsrc5J.jpg)\n\n### Building the Network\nBefore we start\
    \ building the network, let’s confirm the shape of the training data. This is\
    \ important because the shape will be needed by the convolution layer. We’ll use\
    \ this later to reshape the size of the input data.\n```python\nx_train.shape\
    \ # (60000, 28, 28)\n```\nWe kick off by initializing the sequential model. Then\
    \ we pass in our layers as a list. The first layer is the `reshape` layer for\
    \ changing the shape of the input data. We already know that each image has a\
    \ size of 28 by 28. We pass 1 to the reshape layer to ensure the input data has\
    \ a single channel. Next, we create the `convolution` layer. This layer takes\
    \ in a couple of parameters:\n- `filters`: the number of output filters in the\
    \ convolution, 32 is a common number of feature detectors.\n- `kernel_size`: the\
    \ width and height of the convolution window.\n- `input_shape`: the shape of the\
    \ input data.\n- `activation`: the function to be used. The `ReLU` activation\
    \ function is a common choice.\n\nThe next item on the list is to add the pooling\
    \ layer. In this step, the size of the feature map is reduced by taking the maximum\
    \ value during the pooling process. 2 by 2 is a commonly-used pool size.\n```python\n\
    model = Sequential([\n    Reshape((28, 28, 1)),\n    Conv2D(filters=64,kernel_size=(3,3),activation='relu'),\n\
    \    MaxPooling2D(pool_size=(2,2)),\n    Flatten(),\n    Dense(128, activation='relu'),\n\
    \    Dense(10, activation='softmax')\n])\n```\n\n### Compiling the Network\nWe\
    \ now need to apply gradient descent to the number. This is done at the `compile`\
    \ stage. We pass the following parameters:\n- `optimizer`: the type of gradient\
    \ descent to use; in this case, we’ll use stochastic gradient descent.\n- `loss`:\
    \ the cost function to use. We use `sparse_categorical_crossentropy` because the\
    \ classes are integer-encoded. If we performed one-hot encoding, we’d have to\
    \ use the categorical cross-entropy function.\n- `metrics`: the evaluation metrics\
    \ to monitor; in this case, accuracy.\n```python\nmodel.compile(optimizer='sgd',\
    \ loss='sparse_categorical_crossentropy', metrics=['accuracy'])\n```\n\n### Fitting\
    \ the CNN\nNext, we fit the training set to the network. `epochs` is the number\
    \ of rounds the data will pass through the network. `validation_data` is the test\
    \ dataset that will be used to evaluate the performance of the model during training.\n\
    ```python\nmodel.fit(x=x_train,y_train,epochs=5,validation_data=validation_data)\n\
    ```\n\n### Evaluating the Network\nWe can now check the performance of the network.\
    \ We do so using the `evaluate` function, passing in the test set. The first item\
    \ in the result produced is the loss, and the second is the accuracy.\n```python\n\
    model.evaluate(x_test,y_test)\n```\nOutput:\n```\n313/313 [==============] - 2s\
    \ 8ms/step - loss: 0.1116 - accuracy: 0.9668\n[0.1115519180893898, 0.9667999744415283]\n\
    ```\n\n### Checking the Predictions\nLet’s now see if our network is able to correctly\
    \ identify a digit. We kick off by making predictions:\n```python\npredictions\
    \ = model.predict(x_test)\n```\nFor example, let’s check the digit at index 2\
    \ in the test set.\n```python\nimage = x_test[2]\nfig = plt.figure()\nplt.imshow(image,\
    \ cmap='gray')\nplt.show()\n```\n![](rsrc15K.jpg)\nThis is clearly the digit one.\
    \ Let’s compare that with the prediction made for digit 1.\n```python\nimport\
    \ numpy as np\nnp.set_printoptions(suppress=True)\npredictions[2]*100\n```\nOutput:\n\
    ```\n[0.00077352, 99.63969 , 0.07214971, 0.03056707, 0.00606834, 0.00301009, 0.02507676,\
    \ 0.11558129, 0.10332277, 0.00378496]\n```\nFrom the predictions below, we can\
    \ see that the digit 1 — at index 1 in the prediction— has the highest prediction.\n\
    ```\narray([0.00077352, 99.63969 , 0.07214971, 0.03056707, 0.00606834, 0.00301009,\
    \ 0.02507676, 0.11558129, 0.10332277, 0.00378496])\n```\nWe can check another\
    \ prediction by plotting the digit at index 0 in the testing set.\n```python\n\
    image = x_test[0]\nfig = plt.figure()\nplt.imshow(image, cmap='gray')\nplt.show()\n\
    ```\n![](rsrc15M.jpg)\nNext, we’ll look at the prediction at index 0 to see if\
    \ it’s also number 7. Clearly, 7 has the highest prediction.\n```python\nimport\
    \ numpy as np\nnp.set_printoptions(suppress=True)\npredictions[0]*100\n```\nOutput:\n\
    ```\n[0.00077352, 99.63969 , 0.07214971, 0.03056707, 0.00606834, 0.00301009, 0.02507676,\
    \ 0.11558129, 0.10332277, 0.00378496]\n```\nFrom the predictions below, we can\
    \ see that the digit 1 — at index 1 in the prediction— has the highest prediction.\n\
    ```\narray([0.00077352, 99.63969 , 0.07214971, 0.03056707, 0.00606834, 0.00301009,\
    \ 0.02507676, 0.11558129, 0.10332277, 0.00378496])\n```\nWait, the text says \"\
    digit 7\" but the array shows 99.6% at index 1. This is likely a typo in the source\
    \ text I will keep the content as per instructions.\n\n### Conclusion\nWell done\
    \ for making it far! In this article, we’ve used CNN concepts to develop a working\
    \ convolutional network. We have seen the steps you’ll need to take, and you can\
    \ try this out with a different dataset to see if you can reproduce the network\
    \ we built here.\n"
