    ![](rsrc151.jpg)As you can see its pretty simple. However, there are a couple
    of differences between this implementation and the [official paper:](https://www.google.com/url?q=https://arxiv.org/abs/1703.06870&sa=D&ust=1597504082180000&usg=AOvVaw0a04z1zEOVwzkHyS7LAUcm)
    Resizing of all images to the same size to support the training of multiple images
    per batch. In the official paper, resizing is done in a manner that the smallest
    side is 800px and the largest is trimmed at 1000px. Ignoring of bounding boxes
    that come with the dataset in order to generate them on the fly. Use of a learning
    rate lower than the 0.02 proposed in the paper. Lower learning rates converged
    faster. Since I made some slight adjustments from the original code on GitHub,
    I am [providing the source code used for this article](https://www.google.com/url?q=https://bitbucket.org/mwitiderrick/mask-r-cnn/src/master/Mask%2520R-CNN/&sa=D&ust=1597504082181000&usg=AOvVaw31BUuyMko-5n0rcVwnFB0O)
    . Conclusion As you can see, Matterport provides a quick and easy way to implement
    image segmentation with Mask R-CNN. If you’d like to do your own training on images
    check this [Notebook](https://www.google.com/url?q=https://github.com/matterport/Mask_RCNN/blob/master/samples/shapes/train_shapes.ipynb&sa=D&ust=1597504082181000&usg=AOvVaw2xmJgJqhGPmxmKwUMppML1)
     on their GitHub page. You can also check out my other article on image segmentation.
    LightGBM: A Highly-Efficient Gradient Boosting Decision Tree The power of the
    LightGBM algorithm cannot be taken lightly (pun intended). LightGBM is a distributed
    and efficient [gradient boosting framework](https://www.google.com/url?q=https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.GradientBoostingClassifier.html&sa=D&ust=1597504082182000&usg=AOvVaw2rHXMUsu4pnWCYCseG2HiI)
    that uses tree-based learning. It’s [histogram-based](https://www.google.com/url?q=https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingClassifier.html&sa=D&ust=1597504082183000&usg=AOvVaw2XOsw3E2ze6HAstJ24BKu4)
     and places continuous values into discrete bins, which leads to faster training
    and more efficient memory usage. In this piece, we’ll explore LightGBM in depth.
    LightGBM Advantages According to the official docs, here are the advantages of
    the LightGBM framework: Faster training speed and higher efficiency Lower memory
    usage Better accuracy Support of parallel and GPU learning Capable of handling
    large-scale data Parameter Tuning The framework uses a leaf-wise tree growth algorithm,
    which is unlike many other tree-based algorithms that use depth-wise growth. Leaf-wise
    tree growth algorithms tend to converge faster than depth-wise ones. However,
    they tend to be more prone to overfitting. ![](rsrc152.jpg)![](rsrc153.jpg)Here
    are the parameters we need to tune to get good results on a leaf-wise tree algorithm:
    num\_leaves : Setting the number of leaves to num\_leaves = 2^(max\_depth) will
    give you the same number of leaves as a depth-wise tree. However, it isn’t a good
    practice. Ideally, the number of leaves should be smaller than 2^(max\_depth)
    min\_data\_in\_leaf  prevents overfitting. It’s set depending on num\_leaves and
    the number of training samples. For a large dataset, it can be set to hundreds
    or thousands. max\_depth  for limiting the depth of the tree. Faster speeds on
    the algorithm can be obtained by using: a small max\_bin save\_binary  to speed
    up data loading in future learning parallel learning bagging , through setting
    bagging\_freq  and bagging\_fraction feature\_fraction  for feature sub-sampling
    In order to get better accuracy, one can use a large max\_bin, use a small learning
    rate with large num\_iterations, and use more training data. One can also use
    many num\_leaves, but it may lead to overfitting. Speaking of overfitting, you
    can deal with it by: Increasing path\_smooth Using a larger training set Trying
    lambda\_l1 , lambda\_l2 , and min\_gain\_to\_split  for regularization Avoid growing
    a very deep tree Categorical Features A common way of processing categorical features
    in machine learning is one-hot encoding. This method is not optimal for tree learners,
    and especially for high-cardinality categorical features. Trees built on one-hot
    encoded features are unbalanced and have to grow too deep in order to obtain good
    accuracy. Using the categorical\_feature  attribute, we can specify categorical
    features (without one-hot encoding) for their model. Categorical features should
    be encoded as non-negative integers less than Int32.MaxValue . They should start
    from zero. LightGBM Applications LightGBM can be best applied to the following
    problems: Binary classification using the logloss  objective function Regression
    using the L2  loss Multi-classification Cross-entropy using the logloss  objective
    function LambdaRank using lambdarank  with NDCG as the objective function Metrics
    The metrics supported by LightGBM are: L1 loss L2 loss Log loss Classification
    error rate AUC NDCG MAP Multi-class log loss Multi-class error rate Fair Huber
    Poisson Quantile MAPE Kullback-Leibler Gamma Tweedie Handling Missing Values By
    default, LightGBM is able to handle missing values. You can disable this by setting
    use\_missing=false . It uses NA to represent missing values, but to use zero you
    can set it zero\_as\_missing=true . Core Parameters Here are some of the core
    parameters for LightGBM: task defaults  to train. Other options are predict, convert\_model,
    and refit. The alias for this parameter is task\_type . convert\_model  converts
    the model into an if-else format. objective  defaults to regression. The other
    options are regression\_l1 , huber , fair , poisson , quantile , mape , gamma
    , tweedie , binary , multiclass , multiclassova , cross\_entropy , cross\_entropy\_lambda
    , lambdarank , and rank\_xendcg  . The aliases for this parameter are objective\_type
    , app , and application  . boosting  defaults to gbdt  — a traditional Gradient
    Boosting Decision Tree. Other options are rf, — Random Forest, dart, — Dropouts
    meet Multiple Additive Regression Trees, goss — Gradient-based One-Side Sampling.
    This parameter’s aliases are boosting\_type and boost. num\_leaves : maximum tree
    leaves for base learners — defaults to 31 max\_depth : maximum tree depth for
    base learners learning\_rate : the boosting learning rate n\_estimators : number
    of boosted trees to fit — defaults to 200000 importance\_type : the type of importance
    to be filled in the feature\_importances\_ . Using split means that the number
    of times a feature is used in a model will be contained in the result. device\_type
    : device for the tree learning — CPU Or GPU. Can be used with device as the alias.
    Learning Control Parameters Let’s look at a couple of learning control parameters:
    force\_col\_wise : When set to true, it forces col-wise histogram building. It’s
    recommended to set this to true when the number of columns is large, or the total
    number of bins is large. You can also set it to true when you want to reduce cost
    on memory, and when the num\_threads is large, e.g greater than 20. This parameter
    is only used with a CPU. force\_row\_wise : When set to true, it forces row-wise
    histogram building. This parameter is only used with a CPU. You can turn this
    one on when the number of data points is large, the total number of bins is smaller,
    and when the num\_threads is small (e.g. less than or equal to 16). It can also
    be set to true when you want to use a small bagging\_fraction or goss boosting
    to speed up training. neg\_bagging\_fraction : Used for imbalanced binary classification
    problems. bagging\_freq : The frequency for bagging. Zero means bagging is disabled.
    feature\_fraction: Can be used to deal with overfitting. For instance, setting
    it to 0.5 would mean that LightGBM will select 50% of the features at each tree
    node. extra\_trees : Set to true when you want to use extremely randomized trees.
    early\_stopping\_round: When true, training stops once a certain parameter fails
    to improve. max\_drop : Defaults to 50. Signifies the number of trees to drop
    on every iteration. cat\_l2 : L2 regularization in a categorical split cat\_smooth
    : Reduces the effect of noise in categorical features, especially for categories
    with limited data. path\_smooth : Helps prevent overfitting on leaves with few
    samples. Objective Parameters Here are a couple of objective parameters to take
    note of: is\_unbalance : Can be set to true if the training data is unbalanced
    for classification problems. num\_class : Used to indicate the number of classes
    in a multi-classification problem. scale\_pos\_weight : Weight of labels with
    positive class. Cannot be used together with is\_unbalance. This parameter increases
    the overall performance metric of the model but may result in poor estimates of
    the individual class probabilities. Practical Implementation We’ll now look at
    a quick implementation of the algorithm. We’ll use scikit-lean’s wrapper for the
    classifier. As always, we start by importing the model: from lightgbm import LGBMClassifier
    The next step is to create an instance of the model while setting the objective.
    The options for the objective are regression for LGBMRegressor , binary  or multi-class
     for LGBMClassifier , and LambdaRank  for LGBMRanker . model = LGBMClassifier(objective=’multiclass’)
    When fitting the model, we can set the categorical features: model.fit(X\_train,y\_train,categorical\_feature=\[0,3\])
    Once you run predictions on the model, you can also obtain the important features:
    predictions = model.predict(X\_test) importances = model.feature\_importances\_
    Conclusion I hope that this has given you enough background into LightGBM to start
    experimenting on your own. We’ve seen that we can use it for both regression and
    classification problems. For more information on the framework, you can check
    out the official [docs](https://www.google.com/url?q=https://lightgbm.readthedocs.io/en/latest/&sa=D&ust=1597504082204000&usg=AOvVaw25svQZGdtdGSiOasAadX7Q)
    . Pruning Machine Learning Models in TensorFlow Pruning is a model optimization
    technique that involves eliminating unnecessary values in the weight tensor. This
    results in smaller models with accuracy very close to the baseline model. In this
    article, we’ll work through an example as we apply pruning and view the effect
    on the final model size and prediction errors. Import the Usual Suspects Our first
    step is to get a couple of imports out of the way: os  and Zipfile will help us
    in assessing the size of the models. tensorflow\_model\_optimization  for model
    pruning. load\_model  for loading a saved model. and of course tensorflow  and
    keras . Finally, we initialize TensorBoard so that we’ll able to visualize the
    models: import os import zipfile import tensorflow as tf import tensorflow\_model\_optimization
    as tfmot from tensorflow.keras.models import load\_model from tensorflow import
    keras %load\_ext tensorboard Dataset Generation For this experiment, we’ll generate
    a regression dataset using scikit-learn. Thereafter, we split the dataset into
    a training and test set: from sklearn.datasets import make\_friedman1 X, y = make\_friedman1(n\_samples=10000,
    n\_features=10, random\_state=0) from sklearn.model\_selection import train\_test\_split
    X\_train, X\_test, y\_train, y\_test = train\_test\_split(X, y, test\_size=0.33,
    random\_state=42) Model Without Pruning We’ll create a simple neural network to
    predict the target variable y. We’ll then check the mean squared error. After
    this, we’ll compare this with the entire model pruned, and then with just the
    Dense layer pruned. def setup\_model(): model = keras.Sequential(\[ keras.layers.Dense(units
    = 128, activation=''relu'',input\_shape=(X\_train.shape\[1\],)), keras.layers.Dense(units=1,
    activation=''relu'')\]) return model Next, we step up a callback to stop training
    the model once it stops improving, after 30 epochs. early\_stop = keras.callbacks.EarlyStopping(monitor=’val\_loss’,
    patience=30) Let’s print a summary of the model so that we can compare it with
    the summary of the pruned models. model = setup\_model() model.summary() ![](rsrc154.jpg)Let’s
    compile the model and train it. model.compile(optimizer=’adam’, loss=tf.keras.losses.mean\_squared\_error,
    metrics=\[‘mae’, ‘mse’\]) model.fit(X\_train,y\_train,epochs=300,validation\_split=0.2,callbacks=early\_stop,verbose=0)
    Since it’s a regression problem, we’re monitoring the mean absolute error and
    the mean squared error. Here’s the model plotted to an image. The input is 10
    since the dataset we generated has 10 features. tf.keras.utils.plot\_model( model,
    to\_file=”model.png”, show\_shapes=True, show\_layer\_names=True, rankdir=”TB”,
    expand\_nested=True, dpi=96, ) ![](rsrc155.jpg)Let’s now check the mean squared
    error. We can move on to the next section and see how this error changes when
    we prune the entire model. from sklearn.metrics import mean\_squared\_error predictions
    = model.predict(X\_test) print(‘Without Pruning MSE %.4f’ % mean\_squared\_error(y\_test,predictions.reshape(3300,)))
    Without Pruning MSE 0.0201 Pruning the Entire Model with a ConstantSparsity Pruning
    Schedule Let’s compared the above MSE with the one obtained upon pruning the entire
    model. The first step is to define the pruning parameters. The weight pruning
    is magnitude-based. This means that some weights are converted to zeros during
    the training process. The model becomes sparse, hence making it easier to compress.
    Sparse models also make inferencing faster since the zeros can be skipped. The
    parameters expected are the pruning schedule, the block size, and the block pooling
    type. In this case, we’re setting a 50% sparsity, meaning that 50% of the weights
    will be zeroed. block\_size — The dimensions (height, weight) for the block sparse
    pattern in matrix weight tensors. block\_pooling\_type — The function to use to
    pool weights in the block. Must be AVG or MAX. from tensorflow\_model\_optimization.sparsity.keras
    import ConstantSparsity pruning\_params = { ''pruning\_schedule'': ConstantSparsity(0.5,
    0), ''block\_size'': (1, 1), ''block\_pooling\_type'': ''AVG'' } We can now prune
    the entire model by applying our pruning parameters. from tensorflow\_model\_optimization.sparsity.keras
    import prune\_low\_magnitude model\_to\_prune = prune\_low\_magnitude( keras.Sequential(\[
    tf.keras.layers.Dense(128, activation=''relu'', input\_shape=(X\_train.shape\[1\],)),
    tf.keras.layers.Dense(1, activation=''relu'') \]), \*\*pruning\_params) Let’s
    check the model summary. Compare this with the summary of the unpruned model.
    From the image below we can see that the entire model has been pruned—we’ll see
    the difference shortly with the summary obtained after pruning one dense layer.
    model\_to\_prune.summary() ![](rsrc156.jpg)We have to compile the model before
    we can fit it to the training and testing set. model\_to\_prune.compile(optimizer=’adam’,
    loss=tf.keras.losses.mean\_squared\_error, metrics=\[‘mae’, ‘mse’\]) Since we’re
    applying pruning, we have to define a couple of pruning callbacks in addition
    to the early stopping callback. We define the folder to log the model, then create
    a list with the callbacks. tfmot.sparsity.keras.UpdatePruningStep()  updates pruning
    wrappers with the optimizer step. Failure to specify it will result in an error.
    tfmot.sparsity.keras.PruningSummaries()  adds pruning summaries to the Tensorboard.
    log\_dir = ‘.models’ callbacks = \[ tfmot.sparsity.keras.UpdatePruningStep(),
    \# Log sparsity and other metrics in Tensorboard. tfmot.sparsity.keras.PruningSummaries(log\_dir=log\_dir),
    keras.callbacks.EarlyStopping(monitor=’val\_loss’, patience=10) \] With that out
    of the way, we can now fit the model to the training set. model\_to\_prune.fit(X\_train,y\_train,epochs=100,validation\_split=0.2,callbacks=callbacks,verbose=0)
    Upon checking the mean squared error for this model, we notice that it’s slightly
    higher than the one for the unpruned model. prune\_predictions = model\_to\_prune.predict(X\_test)
    print(‘Whole Model Pruned MSE %.4f’ % mean\_squared\_error(y\_test,prune\_predictions.reshape(3300,)))
    Whole Model Pruned MSE  0.1830 Pruning the Dense Layer Only with PolynomialDecay
    Pruning Schedule Let’s now implement the same model—but this time, we’ll prune
    the dense layer only. Notice the use of the [PolynomialDecay](https://www.google.com/url?q=https://www.tensorflow.org/model_optimization/api_docs/python/tfmot/sparsity/keras/PolynomialDecay&sa=D&ust=1597504082223000&usg=AOvVaw1BC3BXt3EGURyAcMnmuZOW)
     function in the pruning schedule. from tensorflow\_model\_optimization.sparsity.keras
    import PolynomialDecay layer\_pruning\_params = { ''pruning\_schedule'': PolynomialDecay(initial\_sparsity=0.2,
    final\_sparsity=0.8, begin\_step=1000, end\_step=2000), ''block\_size'': (2, 3),
    ''block\_pooling\_type'': ''MAX'' } model\_layer\_prunning = keras.Sequential(\[
    prune\_low\_magnitude(tf.keras.layers.Dense(128, activation=''relu'',input\_shape=(X\_train.shape\[1\],)),
    \*\*layer\_pruning\_params), tf.keras.layers.Dense(1, activation=''relu'') \])
    From the summary, we can see that only the first dense layer will be pruned. model\_layer\_prunning.summary()
    ![](rsrc157.jpg)We then compile and fit the model. model\_layer\_prunning.compile(optimizer=’adam’,
    loss=tf.keras.losses.mean\_squared\_error, metrics=\[‘mae’, ‘mse’\]) model\_layer\_prunning.fit(X\_train,y\_train,epochs=300,validation\_split=0.1,callbacks=callbacks,verbose=0)
    Now, let’s check the mean squared error. layer\_prune\_predictions = model\_layer\_prunning.predict(X\_test)
    print(‘Layer Prunned MSE %.4f’ % mean\_squared\_error(y\_test,layer\_prune\_predictions.reshape(3300,)))
    Layer Prunned MSE 0.1388 We can’t compare the MSE obtained here with the previous
    one since we’ve used different pruning parameters. If you’d like to compare them,
    then ensure that the pruning parameters are similar. Upon testing, layer\_pruning\_params
    gave a lower error than the pruning\_params for this specific case. Comparing
    the MSE obtained from different pruning parameters is useful so that you can settle
    for the one that doesn’t make the model’s performance worse. Comparing Model Sizes
    Let’s now compare the sizes of the models with and without pruning. We start by
    training and saving the model weights for later use. def train\_save\_weights():
    model = setup\_model() model.compile(optimizer=''adam'', loss=tf.keras.losses.mean\_squared\_error,
    metrics=\[''mae'', ''mse''\]) model.fit(X\_train,y\_train,epochs=300,validation\_split=0.2,callbacks=callbacks,verbose=0)
    model.save\_weights(''.models/friedman\_model\_weights.h5'') train\_save\_weights()
    We’ll set up our base model and load the saved weights. We then prune the entire
    model. We compile, fit the model, and visualize the results on Tensorboard. base\_model
    = setup\_model() base\_model.load\_weights(''.models/friedman\_model\_weights.h5'')
    # optional but recommended for model accuracy model\_for\_pruning = tfmot.sparsity.keras.prune\_low\_magnitude(base\_model)
    model\_for\_pruning.compile( loss=tf.keras.losses.mean\_squared\_error, optimizer=''adam'',
    metrics=\[''mae'', ''mse''\] ) model\_for\_pruning.fit( X\_train, y\_train, callbacks=callbacks,
    epochs=300, validation\_split = 0.2, verbose=0 ) %tensorboard --logdir={log\_dir}
    Here’s a single snapshot of the pruning summaries from TensorBoard. ![](rsrc158.jpg)The
    other pruning summaries can also be viewed on Tensorboard. ![](rsrc159.jpg)Let’s
    now define a function to compute the sizes of the models. def get\_gzipped\_model\_size(model,mode\_name,zip\_name):
    \# Returns size of gzipped model, in bytes. model.save(mode\_name, include\_optimizer=False)
    with zipfile.ZipFile(zip\_name, ''w'', compression=zipfile.ZIP\_DEFLATED) as f:
    f.write(mode\_name) return os.path.getsize(zip\_name) And now we define the model
    for export and then compute the sizes. For a pruned model,  tfmot.sparsity.keras.strip\_pruning()
     is used to restore the original model with the sparse weights. Notice the difference
    in size for the stripped and unstripped models. model\_for\_export = tfmot.sparsity.keras.strip\_pruning(model\_for\_pruning)
    print("Size of gzipped pruned model without stripping: %.2f bytes" % (get\_gzipped\_model\_size(model\_for\_pruning,''.models/model\_for\_pruning.h5'',''.models/model\_for\_pruning.zip'')))
    print("Size of gzipped pruned model with stripping: %.2f bytes" % (get\_gzipped\_model\_size(model\_for\_export,''.models/model\_for\_export.h5'',''.models/model\_for\_export.zip'')))
    Size of gzipped pruned model without stripping: 6101.00 bytes Size of gzipped
    pruned model with stripping: 5140.00 bytes Running predictions on both models,
    we see that they have the same mean squared error. model\_for\_prunning\_predictions
    = model\_for\_pruning.predict(X\_test) print(''Model for Prunning Error %.4f''
    % mean\_squared\_error(y\_test,model\_for\_prunning\_predictions.reshape(3300,)))
    model\_for\_export\_predictions = model\_for\_export.predict(X\_test) print(''Model
    for Export Error  %.4f'' %  mean\_squared\_error(y\_test,model\_for\_export\_predictions.reshape(3300,)))
    Model for Prunning Error 0.0264 Model for Export Error  0.0264 Final Thoughts
    You can go ahead and test how different pruning schedules affect the size of the
    model. Obviously, the observations made here are not universal. You’ll have to
    try different pruning parameters and learn how they affect your model size, prediction
    error, and/or accuracy depending on your problem. To optimize the model even more,
    you could quantize it . If you’d like to explore that and more, check the [repo](https://www.google.com/url?q=https://github.com/mwitiderrick/Pruning-in-TensorFlow&sa=D&ust=1597504082233000&usg=AOvVaw1YaEx2Om5b9dMGP4F7_AhK)
     and the [resources](https://www.google.com/url?q=https://www.tensorflow.org/model_optimization/guide/pruning/comprehensive_guide&sa=D&ust=1597504082233000&usg=AOvVaw3xzrJ3_eFVR2wyQS99CAwU)
    . Feature Ranking with Recursive Feature Elimination in Scikit-Learn Feature selection
    is an important task for any machine learning application. This is especially
    crucial when the data in question has many features. The optimal number of features
    also leads to improved model accuracy. Obtaining the most important features and
    the number of optimal features can be obtained via feature importance or feature
    ranking. In this piece, we’ll explore feature ranking. Recursive Feature Elimination
    The first item needed for recursive feature elimination is an estimator; for example,
    a linear model or a decision tree model. These models have coefficients for linear
    models and feature importances in decision tree models. In selecting the optimal
    number of features, the estimator is trained and the features are selected via
    the coefficients, or via the feature importances. The least important features
    are removed. This process is repeated recursively until the optimal number of
    features is obtained. Application in Sklearn Scikit-learn makes it possible to
    implement recursive feature elimination via the sklearn.feature\_selection.RFE
     class. The class takes the following parameters: estimator  — a machine learning
    estimator that can provide features importances via the coef\_ or feature\_importances\_
    attributes. n\_features\_to\_select  — the number of features to select. Selects
    half if it''s not specified. step  — an integer that indicates the number of features
    to be removed at each iteration, or a number between 0 and 1 to indicate the percentage
    of features to remove at each iteration. Once fitted, the following attributes
    can be obtained: ranking\_  — the ranking of the features. n\_features\_  — the
    number of features that have been selected. support\_  — an array that indicates
    whether or not a feature was selected. Application As noted earlier, we’ll need
    to work with an estimator that offers a feature\_importance\_s  attribute or a
    coeff\_  attribute. Let’s work through a quick example. The dataset has 13 features—we’ll
    work on getting the optimal number of features. import pandas as pd df = pd.read\_csv(‘heart.csv’)
    df.head() ![](rsrc15A.jpg)Let’s obtain the X and y features. X = df.drop(\[‘target’\],axis=1)
    y = df\[‘target’\] We’ll split it into a testing and training set to prepare for
    modeling: from sklearn.model\_selection import train\_test\_split X\_train, X\_test,
    y\_train, y\_test = train\_test\_split(X, y,random\_state=0) Let’s get a couple
    of imports out of the way: pipeline  — since we’ll perform some cross-validation.
    It’s best practice in order to avoid data leakage. RepeatedStratifiedKFold  —
    for repeated stratified cross-validation. cross\_val\_score  — for evaluating
    the score on cross-validation. GradientBoostingClassifier  — the estimator we’ll
    use. numpy  — so that we can compute the mean of the scores. from sklearn.pipeline
    import Pipeline from sklearn.model\_selection import RepeatedStratifiedKFold from
    sklearn.model\_selection import cross\_val\_score from sklearn.feature\_selection
    import RFE import numpy as np from sklearn.ensemble import GradientBoostingClassifier
    The first step is to create an instance of the RFE class while specifying the
    estimator and the number of features you’d like to select. In this case, we’re
    selecting 6: rfe = RFE(estimator=GradientBoostingClassifier(), n\_features\_to\_select=6)
    Next, we create an instance of the model we’d like to use: model = GradientBoostingClassifier()
    We’ll use a Pipeline to transform the data. In the Pipeline we specify rfe for
    the feature selection step and the model that’ll be used in the next step. We
    then specify a RepeatedStratifiedKFold  with 10 splits and 5 repeats. The stratified
    K fold ensures that the number of samples from each class is well balanced in
    each fold. RepeatedStratifiedKFold  repeats the stratified K fold the specified
    number of times, with a different randomization in each repetition. pipe = Pipeline(\[(‘Feature
    Selection’, rfe), (‘Model’, model)\]) cv = RepeatedStratifiedKFold(n\_splits=10,
    n\_repeats=5, random\_state=36851234) n\_scores = cross\_val\_score(pipe, X\_train,
    y\_train, scoring=’accuracy’, cv=cv, n\_jobs=-1) np.mean(n\_scores) The next step
    is to fit this pipeline to the dataset. pipe.fit(X\_train, y\_train) With that
    in place, we can check the support and the ranking. The support indicates whether
    or not a feature was chosen. rfe.support\_ array(\[ True, False,  True, False,
     True, False, False,  True, False,True, False,  True,  True\]) We can put that
    into a dataframe and check the result. pd.DataFrame(rfe.support\_,index=X.columns,columns=\[‘Rank’\])
    ![](rsrc15B.jpg)We can also check the relative rankings. rf\_df = pd.DataFrame(rfe.ranking\_,index=X.columns,columns=\[‘Rank’\]).sort\_values(by=’Rank’,ascending=True)
    rf\_df.head() ![](rsrc15C.jpg)Automatic Feature Selection Instead of manually
    configuring the number of features, it would be very nice if we could automatically
    select them. This can be achieved via recursive feature elimination and cross-validation.
    This is done via the sklearn.feature\_selection.RFECV  class. The class takes
    the following parameters: estimator  — similar to the RFE class. min\_features\_to\_select
     — the minimum number of features to be selected. cv—  the cross-validation splitting
    strategy. The attributes returned are: n\_features\_  — the optimal number of
    features selected via cross-validation. support\_  — the array containing information
    on the selection of a feature. ranking\_  — the ranking of the features. grid\_scores\_
     — the scores obtained from cross-validation. The first step is to import the
    class and create its instance. from sklearn.feature\_selection import RFECV rfecv
    = RFECV(estimator=GradientBoostingClassifier()) The next step is to specify the
    pipeline and the cv. In this pipeline  we use the just created rfecv . pipeline
    = Pipeline(\[(‘Feature Selection’, rfecv), (‘Model’, model)\]) cv = RepeatedStratifiedKFold(n\_splits=10,
    n\_repeats=5, random\_state=36851234) n\_scores = cross\_val\_score(pipeline,
    X\_train, y\_train, scoring=’accuracy’, cv=cv, n\_jobs=-1) np.mean(n\_scores)
    Let’s fit the pipeline and then obtain the optimal number of features. pipeline.fit(X\_train,y\_train)
    The optimal number of features can be obtained via the n\_features\_ attribute.
    print(“Optimal number of features : %d” % rfecv.n\_features\_) Optimal number
    of features : 7 The rankings and support can be obtained just like last time.
    rfecv.support\_ rfecv\_df = pd.DataFrame(rfecv.ranking\_,index=X.columns,columns=\[‘Rank’\]).sort\_values(by=’Rank’,ascending=True)
    rfecv\_df.head() With the grid\_scores\_ we can plot a graph showing the cross-validated
    scores. import matplotlib.pyplot as plt plt.figure(figsize=(12,6)) plt.xlabel(“Number
    of features selected”) plt.ylabel(“Cross validation score (nb of correct classifications)”)
    plt.plot(range(1, len(rfecv.grid\_scores\_) + 1), rfecv.grid\_scores\_) plt.show()
    ![](rsrc15D.jpg)Final Thoughts The process for applying this in a regression problem
    is the same. Just ensure to use regression metrics instead of accuracy. I hope
    this piece has given you some insight on selecting the optimal number of features
    for your machine learning problems. Dealing with Imbalanced Data in Machine Learning
    As an ML engineer or data scientist, sometimes you inevitably find yourself in
    a situation where you have hundreds of records for one class label and thousands
    of records for another class label. Upon training your model you obtain an accuracy
    above 90%. You then realize that the model is predicting everything as if it’s
    in the class with the majority of records. Excellent examples of this are fraud
    detection problems and churn prediction problems, where the majority of the records
    are in the negative class. What do you do in such a scenario? That will be the
    focus of this post. Collect More Data The most straightforward and obvious thing
    to do is to collect more data, especially data points on the minority class. This
    will obviously improve the performance of the model. However, this is not always
    possible. Apart from the cost one would have to incur, sometimes it''s not feasible
    to collect more data. For example, in the case of churn prediction and fraud detection,
    you can’t just wait for more incidences to occur so that you can collect more
    data. Consider Metrics Other than Accuracy Accuracy is not a good way to measure
    the performance of a model where the class labels are imbalanced. In this case,
    it''s prudent to consider other metrics such as precision, recall, Area Under
    the Curve (AUC) — just to mention a few. Precision  measures the ratio of the
    true positives among all the samples that were predicted as true positives and
    false positives. For example, out of the number of people our model predicted
    would churn, how many actually churned? ![](rsrc15E.jpg)Recall  measures the ratio
    of the true positives from the sum of the true positives and the false negatives.
    For example, the percentage of people who churned that our model predicted would
    churn. ![](rsrc15F.jpg)The AUC is obtained from the Receiver Operating Characteristics
    (ROC) curve. The curve is obtained by plotting the true positive rate against
    the false positive rate. The false positive rate is obtained by dividing the false
    positives by the sum of the false positives and the true negatives. AUC closer
    to one is better, since it indicates that the model is able to find the true positives.
    Emphasize the Minority Class Another way to deal with imbalanced data is to have
    your model focus on the minority class. This can be done by computing the class
    weights. The model will focus on the class with a higher weight. Eventually, the
    model will be able to learn equally from both classes. The weights can be computed
    with the help of scikit-learn. from sklearn.utils.class\_weight import compute\_class\_weight
    weights = compute\_class\_weight(‘balanced’, y.unique(), y) array(\[ 0.51722354,
    15.01501502\]) You can then pass these weights when training the model. For example,
    in the case of logistic regression: class\_weights = { 0:0.51722354, 1:15.01501502
    } lr = LogisticRegression(C=3.0, fit\_intercept=True, warm\_start = True, class\_weight=class\_weights)
    Alternatively, you can pass the class weights as balanced and the weights will
    be automatically adjusted. lr = LogisticRegression(C=3.0, fit\_intercept=True,
    warm\_start = True, class\_weight=’balanced’) Here’s the ROC curve before the
    weights are adjusted. import matplotlib.pyplot as plt from sklearn.metrics import
    roc\_curve, roc\_auc\_score predictions = lr.predict(X\_test) fpr, tpr, thresholds
    = roc\_curve(y\_test, predictions, pos\_label=1) auc = roc\_auc\_score(y\_test,
    predictions) plt.figure(figsize=(12,6)) plt.plot(fpr, tpr,label=''AUC'') plt.plot(\[0,
    1\], \[0, 1\], color=''red'', linestyle=''--'', label=''Random'') plt.title(''AUC:{}''.format(auc))
    plt.xlabel(''False positive rate'') plt.ylabel(''True positive rate'') plt.legend()
    ![](rsrc15G.jpg)And here’s the ROC curve after the weights have been adjusted.
    Note the AUC moved from 0.69 to 0.87. ![](rsrc15H.jpg)Try Different Algorithms
    As you focus on the right metrics for imbalanced data, you can also try out different
    algorithms. Generally, tree-based algorithms perform better on imbalanced data.
    Furthermore, some algorithms such as LightGBM have hyperparameters that can be
    tuned to indicate that the data is not balanced. Generate Synthetic Data You can
    also generate synthetic data to increase the number of records in the minority
    class — usually known as oversampling. This is usually done on the training set
    after doing the train test split. In Python, this can be done using the [Imblearn](https://www.google.com/url?q=https://github.com/scikit-learn-contrib/imbalanced-learn&sa=D&ust=1597504082251000&usg=AOvVaw3SxLZYj_xW1K4I588zkC58)
     package. One of the strategies that can be implemented from the package is known
    as the [Synthetic Minority Over-sampling Technique (SMOTE)](https://www.google.com/url?q=https://imbalanced-learn.readthedocs.io/en/stable/generated/imblearn.over_sampling.SMOTE.html&sa=D&ust=1597504082252000&usg=AOvVaw0MzYKeDkzLgAQYwb_J4VnN)
    . The technique is based on k-nearest neighbors. When using [SMOTE](https://www.google.com/url?q=https://imbalanced-learn.readthedocs.io/en/stable/generated/imblearn.over_sampling.SMOTE.html&sa=D&ust=1597504082252000&usg=AOvVaw0MzYKeDkzLgAQYwb_J4VnN)
    : The first parameter is a float that indicates the ratio of the number of samples
    in the minority class to the number of samples in the majority class, once resampling
    has been done. The number of neighbors to be used to generate the synthetic samples
    can be specified via the k\_neighbors  parameter. from imblearn.over\_sampling
    import SMOTE smote = SMOTE(0.8) X\_resampled,y\_resampled = smote.fit\_resample(X.values,y.values)
    pd.Series(y\_resampled).value\_counts() 0    9667 1    7733 dtype: int64 You can
    then fit your resampled data to your model. model = LogisticRegression() model.fit(X\_resampled,y\_resampled)
    predictions = model.predict(X\_test) Undersample the Majority Class You can also
    experiment on reducing the number of samples in the majority class. One such strategy
    that can be implemented is the NearMiss  method. You can also specify the ratio
    just like in SMOTE , as well as the number of neighbors via n\_neighbors . from
    imblearn.under\_sampling import NearMiss underSample = NearMiss(0.3,random\_state=1545)
    pd.Series(y\_resampled).value\_counts() 0  1110 1  333 dtype: int64 Final Thoughts
    Other techniques that can be used include using building an ensemble of weak learners
    to create a strong classifier. Metrics such as precision-recall curve and area
    under curve (PR, AUC) are also worth trying when the positive class is the most
    important. As always, you should experiment with different techniques and settle
    on the ones that give you the best results for your specific problems. Hopefully,
    this piece has given some insights on how to get started. [Repository](https://www.google.com/url?q=https://github.com/mwitiderrick/imbalanced-data&sa=D&ust=1597504082255000&usg=AOvVaw1x-ZG7VtonMcbebUftuxOC)
       Convolutional Neural Networks (CNNs): Core Concepts Applied In this tutorial,
    we’ll work through the core concepts of convolutional neural networks (CNNs).
    To do this, we’ll use a common dataset — the MNIST dataset—and a standard deep
    learning task—image classification The goal here is to walk through an example
    that will illustrate the processes involved in building a convolutional neural
    network. The skills you will learn here can easily be transferred to a separate
    dataset. So let’s go deeper…pun intended. Setup In this step, we need to import
    Keras and other packages that we’re going to use in building our CNN. Import the
    following packages: Sequential  is used to initialize the neural network. Conv2D
     is used to make the convolutional network work with images. MaxPooling2D  is
    used to add the pooling layers. Flatten  is the function that converts the pooled
    feature map to a single column, which is then passed to the fully connected layer.
    Dense  adds the fully connected layer to the neural network. Reshape  is used
    to change the shape of the input array import tensorflow as tf from tensorflow.keras
    import Sequential from tensorflow.keras.layers import Dense,Conv2D,MaxPooling2D,Flatten,Reshape
    Import the Dataset Next, we’ll import the mnist  dataset from Keras. We load in
    the training set and the testing set. We have to scale our data so that it will
    be compatible with our network. In this case, we scale the images by dividing
    them by 255. This will ensure that the array values are numbers between 0 and
    1. mnist = tf.keras.datasets.mnist (x\_train, y\_train), (x\_test, y\_test) =
    mnist.load\_data() x\_train, x\_test = x\_train / 255.0, x\_test / 255.0 validation\_data
    = x\_test, y\_test Visualize a digit We can visualize a single digit using Matplotlib.
    This is important so that we can see a sample of what the digits in the dataset
    look like. import matplotlib.pyplot as plt image = x\_train\[2\] fig = plt.figure
    plt.imshow(image, cmap=’gray’) plt.show() ![](rsrc15J.jpg)Building the Network
    Before we start building the network, let’s confirm the shape of the training
    data. This is important because the shape will be needed by the convolution layer.
    We’ll use this shape later to reshape the size of the input data. x\_train.shape
    (60000, 28, 28) We kick off by initializing the sequential model. Then we pass
    in our layers as a list. The first layer is the reshape layer for changing the
    shape of the input data. We already know that each image has a size of 28 by 28.
    We also pass 1 to the reshape layer to ensure that the input data has a single
    color channel. Next, we create the convolution layer. This layer takes in a couple
    of parameters: filters  — the number of output filters in the convolution, i.e
    the number of feature detectors. 32 is a common number of feature detectors used.
    kernel\_size  — the dimensions of the feature detector matrix. This is the width
    and height of the convolution window. input\_shape  — the shape of the input data.
    Since we included a reshape layer, we don’t need to pass this. activation  — the
    activation function to be used. The ReLu activation function is a common choice.
    The next item on the list is to add the pooling layer . In this step, the size
    of the feature map is reduced by taking the maximum value during the pooling process.
    2 by 2 is a commonly-used pool size. This will reduce the size of the f eature
    map  while maintaining the most important features needed to identify the digits.
    After that, we flatten  the feature maps.  This will convert the feature maps
    into a single column. The results obtained above are then passed to the dense
     layer. The parameters passed to this layer are the number of neurons and the
    activation function . In this case, those are 128 and ReLu, respectively. Finally,
    we created our output  layer. 10 is used here, because our dataset has 10 classes.
    We’ll use the softmax activation  function because classes are mutually exclusive—an
    image can’t be, for example, classified as numbers 0 and 1 at the same time. If
    the case was otherwise, we’d use the sigmoid activation function. model = Sequential(\[
    Reshape((28, 28, 1)), Conv2D(filters=64,kernel\_size=(3,3),activation=’relu’),
    MaxPooling2D(pool\_size=(2,2)), Flatten(), Dense(128, activation=’relu’), Dense(10,
    activation=’softmax’) \]) Compiling the Network We now need to apply gradient
    descent to the number. This is done at the compile stage. We pass the following
    parameters: optimizer  — the type of gradient descent to use; in this case, we’ll
    use stochastic gradient descent loss  — the cost function to use. We use sparse\_categorical\_crossentropy
    because the classes are integer-encoded. Had we performed one-hot encoding, we’d
    have to use the categorical cross-entropy loss function. metrics  — the evaluation
    metrics to monitor; in this case, accuracy model.compile(optimizer=’sgd’, loss=’sparse\_categorical\_crossentropy’,
    metrics=\[‘accuracy’,\]) Fitting the CNN Next, we fit the training set to the
    network. epochs is the number of rounds the data will pass through the network.
    validation\_data is the test dataset that will be used to evalutate the performance
    of the model during training. model.fit(x=x\_train,y=y\_train,epochs=5,validation\_data=validation\_data)
    Evaluating the Network We can now check the performance of the network. We do
    so using the evaluate function, passing in the test set. The first item in the
    result produced is the loss, and the second is the accuracy. model.evaluate(x\_test,y\_test)
    313/313 \[==============================\] - 2s 8ms/step - loss: 0.1116 - accuracy:
    0.9668 \[0.1115519180893898, 0.9667999744415283\] Checking the Predictions Let’s
    now see if our network is able to correctly identify a digit. We kick off by making
    predictions: predictions = model.predict(x\_test) For example, let’s check the
    digit at index 2 in the test set. image = x\_test\[2\] fig = plt.figure plt.imshow(image,
    cmap=’gray’) plt.show() ![](rsrc15K.jpg)This is clearly the digit one. Let’s compare
    that with the prediction made for digit 1. import numpy as np np.set\_printoptions(suppress=True)
    predictions\[2\]\*100 array(\[ 0.00077352, 99.63969 , 0.07214971, 0.03056707,
    0.00606834, 0.00301009, 0.02507676, 0.11558129, 0.10332227, 0.00378496\], dtype=float32)
    From the predictions below, we can see that the digit 1 — at index 1 in the prediction
    array— has the highest prediction. 0.00077352 — digit 0 prediction 99.63969 —
    digit 1 prediction 0.07214971 — digit 2 prediction 0.03056707 — digit 3 prediction
    0.00606834 — digit 4 prediction 0.00301009 — digit 5 prediction 0.02507676 — digit
    6 prediction 0.11558129 — digit 7 prediction 0.10332227 — digit 8 prediction 0.00378496
    — digit 9 prediction We can check another prediction by plotting the digit at
    index 0 in the testing set. Let’s try number 7. image = x\_test\[0\] fig = plt.figure
    plt.imshow(image, cmap=’gray’) plt.show() ![](rsrc15M.jpg)Next, we’ll look at
    the prediction at index 0 to see if it’s also number 7. Clearly, 7 has the highest
    prediction. import numpy as np np.set\_printoptions(suppress=True) predictions\[0\]\*100
    array(\[ 0.00032742, 0.00000064, 0.00919174, 0.09352361, 0.00000077, 0.00045173,
    0.00000015, 99.88985 , 0.00224745, 0.00440894\], dtype=float32) Conclusion Well
    done for making it this far! In this article, we’ve used CNN core concepts to
    develop a working convolutional neural network. We have seen the steps you’ll
    need to take, and we’ve evaluated our trained model. Now you can try this out
    with a different dataset to see if you can reproduce the network we built here.
    Serving TensorFlow Models Once you''ve trained a TensorFlow model and it''s ready
    to be deployed, you''d probably like to move it to a production environment. Luckily,
    TensorFlow provides a way to do this with minimal effort. In this article, we''ll
    use a pre-trained model, save it, and serve it using TensorFlow Serving. Let''s
    get moving! TensorFlow ModelServer [TensorFlow Serving](https://www.google.com/url?q=https://www.tensorflow.org/tfx/guide/serving&sa=D&ust=1597504082270000&usg=AOvVaw0HUmXRlGpwDEQi74fyi0qp)
     is a system built with the sole purpose of bringing machine learning models to
    production. TensorFlow''s ModelServer provides support for RESTful APIs. However,
    we''ll need to install it before we can use it. First, let''s add it as a package
    source. echo "deb \[arch=amd64\]  [ ](https://www.google.com/url?q=http://storage.googleapis.com/tensorflow-serving-apt&sa=D&ust=1597504082271000&usg=AOvVaw1NkyrZrmg5oo26juFBNXZO)
      [http://storage.googleapis.com/tensorflow-serving-apt](https://www.google.com/url?q=http://storage.googleapis.com/tensorflow-serving-apt&sa=D&ust=1597504082271000&usg=AOvVaw1NkyrZrmg5oo26juFBNXZO)
     stable tensorflow-model-server tensorflow-model-server-universal" | sudo tee
    /etc/apt/sources.list.d/tensorflow-serving.list && curl  [ ](https://www.google.com/url?q=https://storage.googleapis.com/tensorflow-serving-apt/tensorflow-serving.release.pub.gpg&sa=D&ust=1597504082271000&usg=AOvVaw10YRAbSyoS3HSk0P-tAHlr)
      [https://storage.googleapis.com/tensorflow-serving-apt/tensorflow-serving.release.pub.gpg](https://www.google.com/url?q=https://storage.googleapis.com/tensorflow-serving-apt/tensorflow-serving.release.pub.gpg&sa=D&ust=1597504082272000&usg=AOvVaw0J7RihLwMmcJBoVfYo3z5r)
     | sudo apt-key add - Installing TensorFlow ModelServer can now be done by updating
    the system and using apt-get to install it. $ sudo apt-get update $ sudo apt-get
    install tensorflow-model-server Developing the Model Next, let''s use a pre-trained
    model to create the model we''d like to serve. In this case, we''ll use a version
    of VGG16 with weights pre-trained on ImageNet. To make it work, we have to get
    a couple of imports out of the way: VGG16   the architecture image  for working
    with image files preprocess\_input  for pre-processing image inputs decode\_predictions
     for showing us the probability and class names from tensorflow.keras.applications.vgg16
    import VGG16 from tensorflow.keras.preprocessing import image from tensorflow.keras.applications.vgg16
    import preprocess\_input, decode\_predictions import numpy as np Next, we define
    the model with the ImageNet weights. model = VGG16(weights=''imagenet'') With
    the model in place, we can try out a sample prediction. We start by defining the
    path to an image file (a lion) and using image to load it. img\_path = ''lion.jpg''
    img = image.load\_img(img\_path, target\_size=(224, 224)) x = image.img\_to\_array(img)
    x = np.expand\_dims(x, axis=0) x = preprocess\_input(x) After pre-processing it,
    we can make predictions using it. We can see that it was able to predict that
    the image is a lion with 99% accuracy. preds = model.predict(x) \# decode the
    results into a list of tuples (class, description, probability) \# (one such list
    for each sample in the batch) print(''Predicted:'', decode\_predictions(preds,
    top=3)\[0\]) \# Predicted: \[(''n02129165'', ''lion'', 0.9999999), (''n02130308'',
    \# ''cheetah'', 7.703386e-08), (''n02128385'', ''leopard'', 6.330456e-09)\] Now
    that we have our model, we can save it to prepare it for serving with TensorFlow.
    Saving the Model Let''s now save that model. Notice that we''re saving it to a
    /1 folder to indicate the model version. This is critical, especially when you
    want to serve new model versions automatically. More on that in a few. model.save(''vgg16/1'')
    Running the Server with TensorFlow ModelServer Let''s start by defining the configuration
    we''ll use for serving: name  is the name of our model-in this case, we''ll call
    it vgg16. base\_path  is the absolute path to the location of our saved model.
    Be sure to change this to your own path. The model\_platform  is obviously TensorFlow.
    model\_version\_policy  enables us to specify model versioning information. ![](rsrc15N.jpg)Now
    we can run the command that will serve the model from the command line: rest\_api\_port=8000
     means that our REST API will be served at port 8000. model\_config\_file  defines
    the config file that we''d defined above. model\_config\_file\_poll\_wait\_seconds
     indicates how long to wait before checking for changes in the config file. For
    example, changing the version to 2 in the config file would lead to version 2
    of the model being served automatically. This is because changes in the config
    file are being checked every 300 seconds, in this case. tensorflow\_model\_server
    - rest\_api\_port=8000 - model\_config\_file=models.config - model\_config\_file\_poll\_wait\_seconds=300
    Making Predictions using the REST API At this point, the REST API for our model
    can be found here: http://localhost:8000/v1/models/vgg16/versions/1:predict .
    We can use this endpoint to make predictions. In order to do that, we''ll need
    to pass JSON-formatted data to the endpoint. To that end - no pun intended - we''ll
    use the json  module in Python. In order to make requests to the endpoint, we''ll
    use the requests  Python package. Let''s start by importing those two. import
    json import requests Remember that the x variable contained the pre-processed
    image. We''ll create JSON data containing that. Like any other RESTFUL request,
    we set the content type to application/json . Afterward, we make a request to
    our endpoint as we pass in the headers and the data. After getting the predictions,
    we decode them just like we did at the beginning of this article. ![](rsrc15P.jpg)![](rsrc15R.jpg)Serving
    with Docker There is an even quicker and shorter way for you to serve TensorFlow
    models-using [Docker](https://www.google.com/url?q=https://www.tensorflow.org/tfx/serving/docker&sa=D&ust=1597504082280000&usg=AOvVaw0nly4moNXmBu6qKNrfQMBt)
    . This is actually the recommended way, but knowing the previous method is important,
    just in case you need it for a specific use case. Serving your model with Docker
    is as easy as pulling the [TensorFlow Serving image](https://www.google.com/url?q=https://hub.docker.com/r/tensorflow/serving&sa=D&ust=1597504082281000&usg=AOvVaw0EAvQR_KrB-DoH3Dpmhehu)
     and mounting your model. With [ Docker installed](https://www.google.com/url?q=https://docs.docker.com/engine/install/&sa=D&ust=1597504082281000&usg=AOvVaw2fSPXXwXQs_rZBCDlv6EqN)
    , run this code to pull the TensorFlow Serving image. docker pull tensorflow/serving
    Let''s now use that image to serve the model. This is done using docker run and
    passing a couple of arguments: \-p 8501:8501  means that the container''s port
    8501 will be accessible on our localhost at port 8501. \- name  for naming our
    container-choose the name your prefer.I''ve chosen tf\_vgg\_server  in this case.
    \- mount type=bind,source=/media/derrick/5EAD61BA2C09C31B/Notebooks/Python/serving/saved\_tf\_model,target=/models/vgg16
    means that the model will be mounted to /models/vgg16 on the Docker container.
    \- e MODEL\_NAME=vgg16  indicates that TensorFlow serving should load the model
    called vgg16. \-t tensorflow/serving  indicates that we''re using the tensorflow/serving
    image that we pulled earlier. &  running the command in the background. Run the
    code below on your terminal. docker run -p 8501:8501 --name tf\_vgg\_server --mount
    type=bind,source=/media/derrick/5EAD61BA2C09C31B/Notebooks/Python/serving/saved\_tf\_model,target=/models/vgg16
     -e MODEL\_NAME=vgg16 -t tensorflow/serving & Now we can use the REST API endpoint
    to make predictions, just like we did previously. ![](rsrc15S.jpg)![](rsrc15T.jpg)Clearly,
    we obtained the same results. With that, we''ve seen how we can serve a TensorFlow
    model with and without Docker. Final Thoughts This [article](https://www.google.com/url?q=https://www.tensorflow.org/tfx/serving/architecture&sa=D&ust=1597504082283000&usg=AOvVaw0sLXfCAnPpwQqY54LklZlA)
     from TensorFlow will give you more information on the TensorFlow Serving architecture.
    If you''d like to dive deeper into this, this [resource](https://www.google.com/url?q=https://www.tensorflow.org/tfx/serving/serving_config&sa=D&ust=1597504082283000&usg=AOvVaw1AQ6DgcJvYlJ5Hm_Mcm2P6)
     will get you there. You can al [https://www.tensorflow.org/tfx/serving/serving\_advanced](https://www.google.com/url?q=https://www.tensorflow.org/tfx/serving/serving_advanced&sa=D&ust=1597504082283000&usg=AOvVaw0fYL2CTOQk17CyiqXHplTp)
    so explore alternative ways of building using the standard TensorFlow ModelServer.
    In this article, we focused on serving using a CPU, but you can explore how to
