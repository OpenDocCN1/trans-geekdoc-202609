    \n# 机器学习中级教程\n\n## TensorFlow 和 Google Colab 用户的 10 个技巧\n\nGoogle 的 Colab 是机器学习领域一个真正创新的产品。它让机器工程师能够运行\
    \ `Notebooks` 并轻松地与同事共享。另一个关键优势是可以访问 `GPUs` 和 `TPUs`。在本文中，我们将重点介绍一些帮助您充分利用 Google\
    \ Colab 的提示和技巧。\n\n### 10. 指定 TensorFlow 版本\n很快，Colab 中默认的 `TF` 版本将变为 `TF 2`。这意味着，如果您有在\
    \ `TF 1` 中运行的 `Notebooks`，它们可能会失败。为了确保您的代码不会崩溃，建议在所有的 `Notebooks` 中都指定 `TF` 版本。这样，即使默认版本发生变化，您的\
    \ `Notebooks` 仍然可以工作![](img/rsrc14K.jpg)\n\n### 9. 使用 TensorBoard\nGoogle Colab\
    \ 默认支持 `TensorBoard`。这是一个可视化模型性能的绝佳工具。用上它吧！![](img/rsrc14M.jpg)\n\n### 8. 在 Colab\
    \ 上训练 TFLite 模型\n在构建移动机器学习模型时，您可以利用 `Colab` 的资源来训练模型。替代方案是使用其他昂贵的云解决方案或在您的笔记本电脑上训练模型，而笔记本电脑可能没有所需的计算能力。\n\
    \n### 7. 使用 TPUs\n如果您的模型需要更强大的处理能力，请将默认运行时更改为 `TPU`。但是，只有在确实需要时才应使用 `TPUs`，因为它们的可用性是有限的![](img/src14N.jpg)\n\
    \n### 6. 使用本地运行时\n如果您有自己的硬件加速器，`Colab` 允许您连接到它。只需点击下拉并选择您的首选运行时![](img/rsrc14P.jpg)\n\
    \n### 5. 使用 Colab 草稿板\n有时您可能会发现自己想要快速测试某些东西。与其创建一个不打算保存到硬盘的新 `Notebook`，您可以使用不保存到硬盘的空\
    \ `Notebook`。\n\n### 4. 将数据复制到 Colabs\n为了加速数据的加载，建议将数据文件复制到 `Colab` 的 `VM` 中，而不是从其他地方加载。\n\
    \n### 3. 检查内存和资源限制\n由于 `Colab` 的资源是免费的，这意味着它们并不保证可用。因此，请关注 `RAM` 和 `Disk` 的使用，以防耗尽资源![](img/src14R.jpg)\n\
    \n### 2. 完成后关闭标签页\n关闭标签页可以断开 `VM` 并节省资源。\n\n### 1. 仅需要时使用 GPUs\n由于这些资源受到限制，在确实需要时才节省\
    \ `GPU` 使用。但是，如果您需要在没有免费版限制的情况下使用 `Colab`，可以查看专业版。希望这些 `Colab` 技巧对您有用。\n\n# 联邦学习\n\
    \n机器学习的进步带来了巨大的数据隐私问题。当从手机等设备获取的数据训练机器学习模型时，这一点尤其如此。因此，大问题是在不共享数据的情况下训练和改进这些设备模型？我们将在联邦学习技术中寻求答案。\n\
    \n## 集中式机器学习\n\n机器学习模型的传统过程是将数据上传到服务器并使用其进行训练。只要数据隐私不是问题，这种训练方式就是行的。然而，当涉及个人身份数据的机器学习时（设备端或医疗等敏感数据行业），这种方法变得不再适用。在集中服务器上训练模型意味着您需要大量的存储空间以及世界级的安全性来防止数据泄露。但想象一下，如果可以使用本地存储在用户设备上的数据来训练模型。\n\
    \n## 去中心化数据上的机器学习：联邦学习\n\n联邦学习是一种允许设备从共享模型进行协作学习的模型训练技术。共享模型首先在服务器上使用代理数据进行训练。然后每个设备下载模型并使用设备上的联邦数据对其进行改进。设备使用本地可用数据训练模型。对模型的更改总结为\
    \ `update`，发送到云端。训练数据和个体更新留在设备上。为了确保更快地上传这些更新，模型使用了旋转和量化。当设备将特定模型发送到服务器时，会对模型进行平均处理以获得单个组合模型。通过多次迭代，直到获得高质量的模型![](img/src14S.jpg)\n\
    \n与集中式机器学习相比，联邦学习有几个优势：\n- **确保隐私**，因为数据留在用户设备上。\n- **低延迟**，因为更新的模型可以在设备上进行预测。\n\
    - **更智能的模型**，考虑到协作训练过程。\n- **更低功耗**，因为模型是在用户设备上训练的![](img/src14T.jpg)\n\n为了确保应用程序的用户体验不受影响，模型训练会在用户设备连接\
    \ WiFi、空闲且连接电源时进行![](img/src14U.jpg)\n\n## TensorFlow Federated\n\nTensorFlow\
    \ 通过利用自己的框架实现了联邦学习的应用。[TensorFlow Federated (TFF)](https://www.google.com/url?q=https://www.tensorflow.org/federated&sa=D&ust=1597504082156000&usg=AOvVaw3rA-I6vkJUB3w)\
    \ 是用于去中心化数据机器学习和其他计算的开源框架。`TFF` 有两个层：`Federated Learning (FL) API` 和 `Federated\
    \ Core (FC) API`。`Federated Learning (FL) API` 允许开发者对现有模型应用联邦训练和评估。`Federated\
    \ Core (FC) API` 是联邦学习的核心基础。它是一个低级接口系统，用于在强类型函数编程环境中结合分布式通信操作编写联邦算法。\n\n联邦学习的一个应用示例是\
    \ [Google 的 Gboard 键盘](https://www.google.com/url?q=https://arxiv.org/abs/1811.03604&sa=D&ust=1597504082157000&usg=AOvVaw3lI8ivtKHUG898GY4gy)。在这种情况下，使用去中心化的设备上数据集训练了一个循环神经网络语言模型。其目标是预测手机键盘上的下一个单词![](img/src14V.jpg)\
    \ 使用去中心化的设备上数据集训练模型，证明了在设备上使用联邦平均算法优于基于服务器的随机梯度下降。当设备将特定模型发送到服务器时，会对模型进行平均处理以产生一个新的全局模型。在这种情况下，由于联邦学习的使用，设备上训练产生新的波并增加了数据隐私。联邦学习的使用导致了\
    \ Gboard 单词预测准确率提升了 24%。这意味着在使用 Gboard 时，用户现在可以看到更多相关的表情和 GIF。希望这能激活你对联邦学习的兴趣。\n\
    \n# 在 Dask 中机器学习\n\n在笔记本电脑上处理几个 GB 的数据通常是一项艰巨的任务，除非笔记本电脑有高内存和计算力。尽管如此，数据科学家仍然需要寻找替代方案来解决这个问题。一些技巧包括调整\
    \ `Pandas` 以处理大型数据集、购买 `GPU` 机器或在云端购买计算力。在本文，我们将看到如何使用 [Dask](https://www.google.com/url?q=https://dask.org/&sa=D&ust=1597504082158000&usg=AOvVaw2mb0ovHJrap)\
    \ 在本地机器上处理大型数据集。\n\n## Dask 和 Python\n\n`Dask` 是一个用于 Python 并行计算的灵活库。它旨在与 `NumPy`、`Pandas`\
    \ 和 `scikit-learn` 等开源项目良好集成。在 `Dask` 中，`Dask arrays` 等同于 `NumPy Arrays`，`Dask\
    \ DataFrames` 等同于 `Pandas DataFrames`，`Dask-ML` 等同于 `scikit-learn`。这些相似性使得将 `Dask`\
    \ 引入您的工作流变得非常容易。使用 `Dask` 的优势可以将计算扩展到计算机的多个核心。这允许您处理无法放入内存的数据集。它还有加速通常需要很长时间计算的作用![](img/src14W.jpg\n\
    \n## Dask DataFrames\n\n加载大数据时，`Dask` 通常读取数据的样本以推断数据类型。为了避免类型错误，预先声明数据类型是良好的做法。`Dask`\
    \ 能够通过 `blocksize` 参数将文件切分来加载大型文件。\n\n```python\ndata_types = {'column1': str,\
    \ 'column2': float}\ndf = dd.read_csv(\"data.csv\", dtype=data_types, blocksize=64000)\n\
    ```![](img/src14X.jpg\n\n`Dask DataFrame` 中的命令大部分与 `Pandas` 中的相似。例如，获取 head 和\
    \ tail 是：\n\n```python\ndf.head()\ndf.tail()\n```\n\n`DataFrame` 上的函数是延迟执行的。这意味着在调用\
    \ `compute()` 之前它们不会计算。由于数据是分区加载的，某些 `Pandas` 函数如 `sort_values()` 将失败。解决方法是使用\
    \ `nlargest()` 函数。\n\n```\ndf.isnull().sum().compute()\n```\n\n## 集群\n\n并行计算是\
    \ `Dask` 的关键，因为它允许在多个核心上运行计算。`Dask` 提供了一个在单机上运行的调度器。它不可扩展。它还提供可以扩展到多台机器的分布式调度器。\n\
    \n## 使用 dask.distributed\n\n即使在单机上使用 `dask.distributed` 也有好处，因为它通过仪表板提供了某些诊断功能。如果您打算使用\
    \ `dask.distributed`，这应该是您做的第一件事。\n\n```python\nfrom dask.distributed import Client\n\
    client = Client()\n```![](img/src14Y.jpg\n\n## Dask ML\n\n`Dask` 还允许您以并行方式进行机器学习和预测。`dask-ml`\
    \ 的目标是提供可扩展的机器学习。当您在 `scikit-learn` 中声明 `n_jobs = -1` 时，您可以并行运行计算。这是通过 `joblib`\
    \ 实现的，该包允许 Python 中的并行化和流水线化。使用 `Dask ML`，您可以实现 `scikit-learn` 模型以及如 `Xgboost`\
    \ 等其他库。这就是一个简单实现的样子。\n\n```python\nimport train_test_split as \nfrom dask_ml.model_selection\
    \ import train_test_split\nX_train, X_test, y_train, y_test = train_test_split(X,\
    \ y, test_size=0.2)\n\nfrom sklearn.ensemble import RandomForestClassifier\nmodel\
    \ = RandomForestClassifier(verbose=1)\n然后您必须导入 joblib 以启用并行计算。\n\nfrom sklearn.externals.joblib\
    \ import parallel_backend\nwith parallel_backend('dask'):\n    model.fit(X_train,\
    \ y_train)\npredictions = model.predict(X_test)\n```\n\n## 限制和内存使用\n\n`Dask` 中的单个任务无法并行运行。工作节点是\
    \ Python 进程，继承了 Python 计算的所有优点和缺点。在分布式环境中工作时也应注意数据安全和隐私。`Dask` 有一个中心调度器跟踪工作节点和集群上的数据。该调度器还控制从集群释放数据。一旦任务完成，它就会从内存中清除以释放内存。如果某些客户端需要它对于持续计算很重要，它将留在内存中。\n\
    \n另一个 Dask 的限制是它没有实现 `Pandas` 的所有函数。`Pandas` 接口很大，因此 `Dask` 没有完整实现。这意味着在 `Dask`\
    \ 上尝试某些操作可能是困难的。此外，在 `Pandas` 中很慢的操作在 `Dask` 中也很慢。\n\n## 你不需要 Dask DataFrame\n\
    \n在以下情况下，您可能不需要 `Dask`：\n- 当您需要 `Dask` 尚未实现的 `Pandas` 函数时。\n- 当您的数据完美适应计算机内存时。\n\
    - 当数据不是表格格式时。在这种情况下，尝试 `dask.bag` 或 `dask.array`。\n\n# 结语\n\n在本文中，我们看到了如何使用 `Dask`\
    \ 在本地机器或分布式方式处理大型数据集。我们看到由于其熟悉的语法和扩展能力，我们可以使用 `Dask`。它具有扩展到数千个核心的能力。\n\n"
