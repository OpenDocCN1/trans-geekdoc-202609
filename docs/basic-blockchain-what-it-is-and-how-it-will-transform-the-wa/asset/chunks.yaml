    在本卷中，我们将从区块链的历史开始，介绍其可能是伪造的、极可能是匿名的创始人中本·聪聪（Satoshi Nakamoto）。区块链的诞生是为了应对 2008
    年金融危机及其引发的经济和社会危机。人们对传统金融体系的信任崩塌，为首个流行的区块链 `Bitcoin` 创造了大量接纳的受众。我们将看到其他类型的区块链随后如何演变，并出现诸如
    `Ethereum` 和 `Ripple` 这样华丽的名字。我们将理解驱动区块链的核心技术，例如加密哈希和网络理论，这一切都将从普通读者的视角出发，让他们了解足够的区块链工作原理，以欣赏其所开启的可能。


    我们将探索区块链圈（blockchainerati）内部意识形态者与技术官僚者之间的哲学分歧，他们争论货币是否应该由政府、公司或匿名个人集体来控制，并探讨这项新技术固有的道德维度。我们还将讨论非营利组织和政府将区块链大规模应用于社会事业的努力，从法治薄弱国家的财产权问题，到为全球每一个人提供数字身份的宏伟倡议。一场带有不对称权力中心的新军备竞赛正在兴起；冰岛在这一现实政治的新竞技场上，与俄罗斯一样是强大的竞争者。


    区块链世界面临着许多挑战，且更多挑战迫在眉睫。短期来看，关键问题包括扩展性（它的扩展性并不好）、计算能力和速度（它消耗大量的能量和计算机周期，且相对较慢），以及由一个内部不团结的群体进行治理。从长期来看，许多问题应运而生：`bitcoin`
    的完整性由主要位于中国的六家公司控制这一事实，这与 `bitcoin` 作为一种不受少数控制点限制的货币的既定理念背道而驰。像 `Ripple` 这样更具“公司化”色彩的区块链可能会面临政府压力，要求引入所谓的“后门”，以便监视流经这些由公司管理的网络的数据内容。量子计算等新兴技术具有破解区块链所赖的基础的核心加密技术的潜力。区块链与人工智能相结合，可能给金融服务业带来巨大的就业动荡——也许银行目前多达
    30% 到 50% 的员工将变得多余的。简而言之，区块链技术的出现带来了深远的伦理和社会影响。“负责任创新”的问题随之而来；当我们通过采用新技术导致大量人员失业时，我们应该采用它吗？


    当你创建一个像区块链这样不可篡改的数据记录时，还会产生一个微妙的问题。如果数据质量不好怎么办？如果数据在进入账本之前就损坏了怎么办？如果有人故意向一个良好的记录系统注入坏数据怎么办？现在你拥有了一个无法抹灭的错误。例如，如果这个数据系统管理着一个国家的公民身份，或记录谁拥有什么财产——这种无形数据损坏的实质性影响将迅速变得显现。


    监管机构正在苦于如何管理这场激进的运动——这确实是一场运动，因为其支持者拥有一种超越了单纯技术崇拜的意识形态激情。一些国家（如韩国）已开始打击许多有趣的应用。另一些国家（如瑞士和新加坡）则敞开大门，欢迎到来。美国联邦政府提供了更为审慎的回应。怀俄明州和佛蒙特州等美国州州提供了更友好的政策，这与美国金融中心纽约实施的破坏创新的
    `BitLicense` 形成鲜明对比。欧洲欣然填补了纽约不愿作为留下的空白，欧盟议会提议了新的区块链监管以促进创新，并启动了“欧盟区块链观察站和论坛”以加速实验。


    一种奇特的趋势正在出现。我们通常资助创新新公司的方式曾高度集中在加州北部某几英里路上的几家投资公司，现在已民主化到自大海时代阿姆斯特丹咖啡馆以来未见的程度。被称为“代币发行”（`ICOs`）的新融资工具应运而生，植根众筹原则，并通过
    `Telegram` 和 `Instagram` 进行同步。在某些国家，这些募资活动被贴上“证券发行”的标签，具有与传统监管金融（如股票或债券发行）相关的规则、报告和投资者保护。其他国家可能看到了新的经济价值机会，且不会对东道国产生不利的环境或社会影响，因此选择了更宽松的监管方法。一些国家明确创建了名为“证券币币”的新资产类别。我们将在以后讨论这产生的一些风险。


    与此同时，创业者正在建立野心勃勃的新平台，试图改变我们工作、生活和娱乐的方式——在地球上以及之外（是的，有几个“太空币”正在开发中）。如波多黎黎科的圣胡安、爱斯尼亚的塔林林和巴新几内亚的莫尔斯比等意想不到的地方，汇聚了数字连接、接线的先驱者，他们正试图重塑人们与周围企业和社会的关系。


    现在加入我们，开启这场进入分布式账本丛林的之旅吧……


    ## 第一部分：基础


    ![插图](img/line.png)


    ## 第 1 章


    ## bitcoin 的崛起


    ### 你需要知道的知识


    ◆ `Blockchain` 是一种特殊的数据库，最初是为了支持名为 `bitcoin` 的新型数字货币而创建的


    ◆ `Blockchain` 的产生源于一种需求：在我们失去对机构的信任时，建立数字信任


    ◆ 该系统之所以运作，是因为精妙的数学。它在互不信任的成员之间对“什么是事实”达成共识（或“一致机制”）


    ◆ 该系统还可以嵌入经济激励，以便在许多人拥有的许多计算机上运行一个大型网络


    我们站在一个尘土飞扬的战场上，一支军队包围着一座被围困的城市。血迹和泥土污了士兵们的脸庞。几位在拜占帝国复杂的宫廷政治中相互竞争的将军，正以一个不稳定的联盟的形式指挥现场。如果他们全体一起进攻，就能攻下城市。如果他们全体有序撤退，士兵就能生存到下一次战斗。如果有些将军进攻而有些逃跑，如果其中一两个将军被贿赂收买，整个军队都将覆灭。更复杂的是，他们无法通过信号旗互相看到，而是通过在帐篷之间奔波的传信者来协调进攻。


    如果有人截获了信息怎么办？如果一位将军收了敌人的钱财，通过发送误导性信息来危害同胞怎么办？


    我们该如何协调行动，使得这群互不信任的将军能够一致地发起进攻或撤退？

    '
