    - 它的某些关键元素，例如拜占庭共识、工作量证明、挖矿和椭圆加密

    - 比特币区块链的某些局限性，以及以太坊和 Ripple (XRP) 等的一些变体


    ## 第二章


    ## 区块链炒作热潮


    ### 你需要的知识


    - 新技术的采用通常伴随着对营销和故事性的强调，区块链也不例外

    - 其中某些内容对于招募开源开发者来说是必要的

    - 当炒作过度时，会导致过度推销，从而对该领域的信誉产生负面影响，甚至可能违反证券法


    区块链炒作周期周围环绕着一层摇滚乐的色彩。行业活动像摇滚演唱会（斯努普·狗狗 Snoop Dogg 曾担任某行业派对的主嘉宾），区块链玩家可以在伊比萨和坎纳的丝绒绳后找到他们的身影，或者在火人节（Burning
    Man）的沙滩上追求超越。


    区块链炒作热车行驶在开源开发者倡议和投资者关系的双重铁轨上。开源开发者倡议是公司招募大量贡献者的场所，这些人者大多不为公司工作，而是为某个软件提供代码改进。开发者这样做是为了获得代码访问权限，因此他们是他们通过贡献对软件所做的任何改进来换取免费软件。投资者关系是公司通过分享有关业绩和未来计划的信息，来维持其证券价格的稳定和兴趣。当区块链公司开始传出他们在做什么，并且有时通过出售其代币来筹资时，这两个想法就汇合在了一起。它演变成了一列无法逃避的宣传火车，在轨道上轰鸣前进。


    全体上车……


    ### 开源社区


    也许营销与区块链接触的最合法的范例是在开源开发者倡议领域。区块链并没有一个统一的标准。虽然比特币是第一个协议，但此后又出现了许多其他协议。在此语境下，协议是指围绕区块链网络如何交换信息、管理交易和处理治理（决策制定）的一组规则。它是特定区块链的基础操作系统。有时它具有应用程序编程接口（`API`），以便开发者与特定的区块链进行交互。


    开源倡议发布其代码供所有人查看，并鼓励开发者社区对其进行改进或扩展。Linux 是一个免费操作系统，是一个广泛使用的开源项目示例（来自英国 Canonical
    公司的 Ubuntu 是最受欢迎的 Linux 发行版之一）。世界上最流行的手机操作系统 Android 是开源的，尽管自那后的许多改进并非如此。许多区块链实例的开源性质使用户能够对系统有更大的信任，因为他们能够看到区块是如何形成的、安全性是如何处理的、代币是如何交易的等等。


    开源倡议是让成千上万开发者在特定代码库之上构建的巧妙方法，展示了生态系统创新的力量。与其投入大量资源让自己的人来构建系统，不如雇佣人的劳动。


    如果你想拥有一个充满力的开源社区，你需要在社区关系上投入时间、精力和费用。你需要告知开发者你正在做什么，参加贸易会，甚至可能提供开发者资金来资助那些展示你协议力量的有前景的项目。正因如此，位于达沃斯的
    Consensys Ethereal Lounge 拥有炫酷的俱乐部灯光、由驻店调酒师特制的鸡尾酒，以及一面绿墙，并伴有亚当·林德曼曼（Adam Lindemann）等人物就艺术市场代币化发表的专家小组论坛。我们看到斯努普·狗狗在纽约市的
    Ripple 派对担任嘉宾，印度尼西亚音乐家 Irfan Aulia 与其政府合作推广一个帮助管理数字音乐版税的区块链项目。区块链在所有意义上都是真正的摇滚乐。


    过度放大的宣传在科技领域并非原创思想。根据 Dean Takahashi 的说法，曾帮助创建 Xbox 的前微软游戏高管 Alex St. John 曾下令“建造一艘价值
    200 万美元的假外星飞船作为巨型游戏促销的一部分”，并举办奢华且极具创意的派对。如果你想了解我在说什么，请随意查阅伴随 id Software 突破性作品
    `DOOM` 的发布促销活动，但请不要在工作电脑上查看！


    科技领域过度的营销背后有一段广为人知的历史，区块链构建者的开源努力也不例外。然而，当这种活动延伸到受监管的金融服务时，我们就遇到了问题……


    ### 投资者关系


    许多区块链代币发行者竭尽全力试图听起来不像像传统公司那样发行证券。“我们是一个基金会，”`DFINITY` 坚持认为，忽略了据认为由创始人多米尼·威廉姆斯（Dominic
    Williams）持有的大量代币。前 CFTC 监管官员盖·格斯勒（Gary Gensler）警告不要做出“草率的监管声明”，并试图通过声称比特币的价值与黄金一样随机来使比特币正常化。代币发行者不说“投资者关系”，而是说“社区关系”和“社区倡议”，但他们所做的是与向特定加密货币或代币投入资金的人进行公开对话，而这些人正期望代币价值上涨。当代币价值下跌时，他们表现得非常直率。


    “HODL，”他们大喊道，这是一个拼写错误，变成了一个迷因，代表买入并持有的理念。从统计学上说，考虑到前十大代币的波动性，他们不可能都在 HODLing。投机行为盛行。事实上，我的一位前学生通过投机比特币支付了研究生学费并付了购房首付。


    仍在为政府工作的监管机构，与过去曾为政府工作但现在代表私人利益工作的监管机构相比，大体上采取了代币发行属于证券的立场。美国，尤其是美国，采取了这一立场，但其他管辖区也遵循了类似的路径。


    也有明显的例外。像英国这样的司法区提出了特定的法规，区分了“证券代币”、“实用型代币”和“交易代币”，对每种代币都有不同的审查和报告要求。


    “社区事务”活动在功能上等同于投资者关系。发行代币的公司希望监管需求，以便他们继续筹资金资助运营和创始人的个人开支。他们与大量购买、出售以及在某些购买数字代币衍生品的机构和个人接触。他们与社区的互动包括广播公司背书，并气喘力竭地推销该软件发布或某项使用代币的政府计划。高兴吧！HODL！


    在大多数圈子里，这些类型的活动会被视为投资者关系，因此所传达信息的性质将受到证券机构的监管和监督。监管机构较少担心亿万富翁将玩钱投向加密货币，而更多担心贫工阶层利用他们的信用卡购买一种被操纵后崩溃的波动证券，从而为本已紧张的家庭创造了债务循环。

