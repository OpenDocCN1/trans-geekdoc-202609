    from the crunch – but an even greater number of ‘have-nots’. People were becoming
    increasingly frustrated with the concentration of wealth and corruption they saw
    around them. The bursting bubble only served to confirm their worst fears about
    ‘The Man’ controlling their lives and taking their money.


    Enter Satoshi Nakamoto. Who he is, no one has been able to say for sure. Several
    have attempted to claim his mantle. Some blockchain-savvy friends of mine think
    it is a pseudonym for a cabal of like-minded software developers. For our purposes,
    let us think of him as an unknown, iconoclastic genius.


    In October 2008, he published a paper entitled ‘Bitcoin: A Peer-to-Peer Electronic
    Cash System’.[²](#bm05.html#en2) In it he described what have become familiar
    to many as the foundational elements of blockchain. Taking the Byzantine consensus
    of nearly three decades prior, and combining elements from other projects, he
    proposed a new ‘trustless’ networked currency. The key elements of this were:


    ◆ a **distributed ledger** to keep track of a new digital currency, meaning a
    database with many copies that all update themselves automatically


    ◆ **Byzantine consensus** to govern changes to the ledger


    ◆ a **cryptographically secure** currency


    ◆ ‘**mining**’ incentives to encourage people to burn the computer cycles necessary
    to manage the currency


    ◆ ‘**blocks**’ of transactions describing when people trade the currency, strung
    together in what’s called a ‘Merkle Tree’ to form an immutable record, a ‘blockchain’.


    The next section takes a very simplified approach to describing the mechanics
    of how this bitcoin blockchain works. It’s not terribly technical, but it still
    might be a challenge if you are more interested in the business or societal applications
    of the technology. In simple terms, I’m going to describe for you how we create
    digital trust even among people who don’t necessarily trust each other, in place
    of having a third party serve as a trusted intermediary.


    I’d recommend that you try to engage with the material, even if you find it challenging
    (the glossary on [page 155](#bm03.html#page_155) may be helpful). However, if
    you find it too tough going, feel free to skip ahead to [Chapter 2](#chapter02.html)
    where we get into the hoopla of hype that has emerged as more and more people
    have got excited about blockchain.


    ### **DISTRIBUTED LEDGER**


    One of the basic problems with a network or data system that puts all of its eggs
    in a single basket, so to speak, is that it is susceptible to hacking or breach.
    You need to access just one system to change the amount of money in a bank account
    or the record of someone’s criminal history – or even their identity.


    Another issue is one of central control. If all the records of who owns land are
    kept in one place by the government, you’ve got an issue if you don’t trust the
    government. Maybe you have good reason – maybe the government in question is corrupt,
    stealing the assets for itself.


    Or maybe it’s corruptible; its civil servants can be bribed. During the era that
    gave rise to bitcoin, a number of people felt that way about the United States
    government and the governments of several other G7 countries, but the concept
    of the need for data security transcends the politicised birth of blockchain technology.


    What if we had a record book, a ledger, that had many identical copies?


    What if these copies talked to each other and automatically updated themselves,
    creating resilience in the network so that if one copy was corrupted deliberately,
    by someone trying to commit fraud or embezzle money, the other copies would fix
    the problem?


    Instead of a centralised ledger with a single point of failure, you could have
    ‘distributed ledgers’ that would replace trust in a single entity (like a government)
    with trust in technology, trust in a peer-to-peer network that would intrinsically
    keep the system honest.


    It is important to note that all blockchains are distributed ledgers, but not
    all distributed ledger technologies (DLTs) are blockchains.


    The terminology can get confusing fast, not least because different people use
    different words to describe the same thing. For example, Vitalik Buterin, progenitor
    of the popular smart-contract protocol Ethereum, uses the word decentralised when
    everyone else and sixty years of network theory say distributed. We’ll talk about
    Ethereum a little later, but for the sake of sanity and consistency, we will call
    the general class that blockchain falls into ‘distributed ledgers’ and move on.


    ### **BYZANTINE CONSENSUS / BYZANTINE FAULT TOLERANCE**


    Byzantine fault tolerance proposes a way to better manage a network of decision
    makers (or in this case, a network of information storage devices). Each storage
    device is a ‘node’. To change the information stored in the network, you need
    to convince 51 per cent of the nodes that the information is valid (in this instance,
    varying the threshold versus the two-thirds of the original paper). Now let’s
    distribute this across 10,000 nodes. We’ve created a system whereby you would
    need to corrupt 5,001 nodes in a short amount of time in order to put faulty information
    into the network. The method to do this is computationally expensive, compared
    to, for example, the computational cost of running a credit card network or an
    electronic securities exchange, but what you sacrifice in terms of processing
    power you gain in terms of confidence in the network’s results. You create digital
    *trust*, in other words. Only through such rigorous mathematics and computation
    could a group as suspicious of authority as the earliest adopters of bitcoin freely
    accept the results of transactions with total strangers they connected with on
    the internet. Remember, this was a loose confederation of anti-authoritarian idealists,
    overly curious academics and hobbyists, and (many say) money-laundering criminals.
    While there are a number of efforts to optimise consensus, either making it more
    resistant to subversion or more efficient and scalable, the basic concepts were
    established in that 1982 SRI paper.


    ### **BLOCKS AND MERKLE TREES**


    Blockchain needs to solve a problem of *immutability*. What does that mean?'
