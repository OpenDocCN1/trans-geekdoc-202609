  raw: '◆ New approaches to education are exceptionally well suited to blockchain’s
    philosophy and technology


    The education sector has served as a nest to nurture and extend blockchain innovation,
    and also as a beneficiary of fledging explorations of blockchain.


    ### **ORIGIN STORY**


    In the wake of the collapse of the Bitcoin Foundation, MIT supported core developers
    and funded a number of projects to keep bitcoin afloat, until the industry could
    mature further. This predated the extraordinary run-up in bitcoin price that created
    a new generation of bitcoin billionaires. Not long after, MIT loaded the software
    and turned on the first Ripple validator node in a North American university (a
    Ripple validator node is a piece of the Ripple network that helps to ensure the
    integrity of the data flowing through it). Other Ethereum-based projects began
    to emerge. As I launched the first graduate fintech class in North America, *MIT
    Future Commerce* (at Meltem Demirors’ insistence, when she was an MIT student),
    and brought it online to over 130 countries, we saw an explosion of startups exploring
    and exploiting this new technology – not only out of MIT, but also Stanford, Princeton,
    Cambridge, National University of Singapore, and a host of other institutions.


    Less well known, perhaps, is the role MIT played in preventing bitcoin from being
    shut down before it scaled. In 2014, Bitcoin was just beginning to emerge from
    a fringe project of hobbyists and the ultra-paranoid into a more mainstream set
    of business and other applications. Other protocols were being developed. As the
    scale of bitcoin transactions grew, so too grew government concern about the use
    of this novel digital currency for illicit transactions. Professor Alex Pentland
    of MIT, John Clippinger (then attached to Harvard’s Berkman Center) and I organised
    an off-the-record conference engaging leaders from incumbent corporate interests,
    innovative bitcoin-related startups, government and academia called the Ecology
    of Digital Assets: Identity, Trust and Data. John then hosted a retreat at Windhover
    with some of the attendees, and out of it came the Windhover Principles,[^(57)](#bm05.html#en57)
    a set of guidelines used by exchanges and wallets to show compliance with anti-money-laundering
    (AML) and Know Your Client (KYC) regulations.


    Without the Windhover Principles, bitcoin stood a serious risk of being shut down
    by government enforcement agencies. Without the ability to translate fiat currency
    into bitcoin and bitcoin into fiat, the protocol’s usefulness would have been
    severely limited, perhaps fatally, perhaps relegating it to an obscure curiosity
    rather than an industry-defining advancement. With the Windhover Principles, variants
    of which were adopted into the terms of service of all of the major exchanges,
    government saw good-faith efforts on the part of the nascent bitcoin ecosystem
    to comply with the rule of law. And bitcoin innovators were informally but substantively
    provided the room to innovate, without heavy-handed intervention by regulators.
    Stan Stalnaker then provided the first deployment of Windhover with HubID (a verified
    digital identity system) attached to Ven, an early entrant into the digital currency
    market.[^(58)](#bm05.html#en58)


    Yet decades earlier, work on Byzantine consensus and other distributed database
    applications was pioneered in the halls of academe. Without work on network systems,
    on game theory and distributed decision making, and on cryptography, we would
    not have the critical components that make blockchain innovation possible. There
    are even those who theorise that Satoshi Nakamoto is an academic and not someone
    in the private sector.


    Today, academic institutions around the world continue to advance the state of
    the art of blockchain technologies. The major protocols have formal or informal
    links with an array of centres of academic excellence. Corporate actors support
    applications of blockchain technology in opensource code consortia, helping provide
    both funds and use cases to build out blockchain infrastructure. New ventures
    continue to emerge from academic programmes, not only commercial startups and
    corporate innovation projects, but also nonprofits applying blockchain for social
    good, and new open-source code projects to experiment with a variety of improvements,
    extensions and inventions around distributed ledger technologies.


    ### **RECURSION AND CREDENTIALS**


    Academia is not only the source of many of the ideas and technologies that went
    into making the blockchain revolution possible. It also has been and continues
    to serve as a beneficiary of certain applications of blockchain. Recursively,
    we can apply blockchain to the core product that academia manufactures.


    I refer not to the emergence of programmes that award a ‘PhD in Blockchain’. In
    my opinion, those programmes do a disservice to their graduates. You don’t hear
    people today bragging about their ‘PhD in HTML’ or their ‘PhD in UNIX’. A PhD
    founded in a broader set of theories and capabilities provides someone with utility
    for decades, versus years, such as a PhD in Computer Science or even a PhD in
    Database Systems.


    Instead, I am intrigued by the application of blockchain to the recognisable output
    of an academic education: the credential – whether it be a degree, a diploma or
    a certificate – as well as the accompanying academic transcript. Many jobs require
    the completion of a certain level of academic training. Some mandate the applicant
    to have taken specific courses, or maintain a certain grade point average. These
    requirements are reliant on attestation by an institution that the student matriculated,
    and actually completed the class or degree or programme.


    Corporate scandals have arisen over people claiming false credentials from institutions
    they never graduated from, or never even attended. The time and expense, and functional
    burden, of verifying every degree or every grade is too much for many employers
    to undertake. As a consequence of this informational friction, the honour system
    is instead used *de facto* if not *de jure*. This may work for the majority of
    employees, but also creates an opening for the unscrupulous to create unearned
    opportunity for themselves.


    Blockchain offers an elegant solution to the challenge of the academic transcript.
    A host of blockchain credential companies have arisen to deliver these digitally
    verified attestations of academic achievement – we use one such system for our
    Oxford online programmes. Blockchain could provide an immutable record of classes
    completed and even grades received, that can be automatically furnished without
    having to go through the process of contacting registrars, paying fees, and waiting
    days or weeks for documentation.


    Multiple stakeholders must be engaged in verifying and validating credentials,
    another reason why blockchain has applicability to this problem space. The university
    or other institution, of course, must issue the credential. We also have involved
    the student, the instructor, perhaps an industry accreditation or standards body,
    the employer, perhaps a lender, possibly one or more government bodies. All of
    these participants have to rely on the veracity of the attestation, requiring
    a digital truth that is provided by a cryptographically ensured permanent record.


    ### **THE UNIVERSITY OF THE FUTURE**


    Perhaps one of the more exciting areas to explore is how blockchain and other
    technologies in combination could transform the educational experience of the
    future.


    University education is more than just sitting in the classroom and listening
    to a lecture. Co-curricular activities and community form some of the most durable
    elements of residential education. The most lasting experiences of education are
    when we are working in groups and teams, solving problems as part of closely knit
    team.'
