  trans: '


    柬埔寨的稻农在分布式账本技术的赋能下正结在一起，以确保他们的粮食能获得更好的价格。更广泛地说，通过区块链系统，机会驱动有效的供需聚合，从而在效率低下的食品生产和分销世界中提高公平性和透明度。


    #### 更高的速度


    区块链是提高食品供应链管理速度的一种可行工具。大宗商品巨头路易·德富士集团（Louis Dreyfus）利用区块链技术，将其批发贸易（在他们的试点案例中为
    60,000 吨大豆）的交易时间缩短了 80%。通过将目前高度依赖纸质和传真文件的模拟世界数字化，并以只有通过网络化技术才能实现的方式将其连接起来，区块链为全球食品供应的基础物流带来了巨大的变化。


    将区块链应用于食品供应链可能会导致消费者价格的提高，因为生产端近乎奴隶的劳动条件得到了改善。这可能会压缩食品公司的利润，直到他们为新的数字时代对其员工进行合理调整，这反过来会产生需要解决的劳动力挑战。然而，从均衡来看，区块链的应用实现了更高的公平性、更高的效率和更高的食品安全。


    #### 增强系统


    当我们看到区块链应用于能源和食品等领域时，看到的是一种针对互联参与者的系统方法的发展，这种方法可以根据不断变化和新入者进行自我重构。转瞬即逝的、消耗性的资源，无论是芒果还是千瓦电能，现在都能更好地适应社会需求，因为区块链创造了更高的透明度、更高的信息交换速度以及民主化的控制中心。


    我们还看到了资本主义与共产主义理想的奇妙结合，因为生产手段更牢固地掌握在工人手中，而许多微小参与者的集体议价能力通过分布式账本甚至代币化交易所自动聚合，并与经济结果挂钩。例如，农产品的代币化交易可以创建与所生产商品或服务直接相关的新货币，使得价值交换在一个包含许多微小参与者的大型网络中更加透明且可追踪。


    #### 概述


    在本章中，我们涵盖了：


    ◆ 溯的概念，以及它为什么在何地可能重要


    ◆ 区块链在能源领域的上下游应用


    ◆ 区块链如何帮助食品安全和可持续农业


    ## 第 7 章


    ## 房地产、环境与自然资源


    #### 你需要了解的


    ◆ 通过将区块链应用于新可用的数据集，物理世界可以变得更容易理解和交互


    ◆ 房地产可以更高效、更有效地进行购买、出售、开发和维护


    ◆ 通过分布式账本技术（DLT），可以极大改善环境、政策与经济的交汇点


    ◆ 黄金等自然资源可以更容易进行交易


    地点和空间领域的活动为区块链提供了一系列新颖的用例，因为我们寻求将移动和生活的实体世界转化为一组易于获取、可通信的信息集。例如，房地产的传统做法在数据方面由定价信息的垄断供应商主导，他们拥有闭源系统和陈旧的数据集。基于区块链的未来将使粒度数据变得可用、共享且可操作。我们的方法基于这样观点：我们可以找到连接数据集的方法，从而提高生产力。有大量的文档需要考虑，区块链可以帮助应对这种复杂性。这可能开启新的可能性。


    #### 房地产


    房地产是一个巨大的资产类别，价值超过 228 万亿英镑，直到最近它一直面临着巨大的复杂性。通过区块链和代币化，我们可以将房地产细分为微份额元素，并对其开放投资。可以创建新型衍生品以引入更大的稳定性或控制力。


    房地产买卖涉及的交易具有大规模简化和降低成本的潜力。例如，如今许多房地产交易需要产权保险以及权属链的明确。对于即使是最简单的房屋购买，更不用说多批、混合用途开发项目，昂贵的支出和大量的延迟都是可以接受的现实，其中包括环境评估和财务记录。


    在商业房地产（CRE）领域，区块链可以帮助实现交易流程自动化。寻找物业是一个费力且数据效率低的过程，拥有多个且有时冲突的数据集，可以通过分布式账本进行协调。交易前的尽职调查花费了大量的时间和精力。各种分散的数据需要以控制的方式进行汇、合成和发布。例如，一份环境报告，详细说明了建筑下方是否储存了有毒化学品或墙内是否有石棉。如果这些东西在过去存在但已得到修复，人们需要知道何时采取了这一行动、采取了什么行动、由谁采取的，以及谁证明了该建筑现在是安全的。区块链系统可能协助访问控制、分发和信息质量的组织数据管理。商业房地产领域另一个潜在的区块链应用是创建智能且灵活的房地产租赁，它可以根据租户和房东的需求进行动态调整，这是一个附加在分布式账本上的智能合约。


    保险以新颖的方式跨越房地产市场。例如，世界贸易中心的保险单在 9/11 袭击发生时据称尚未签署。这导致了人们对于是否会向保户拉里·西尔斯坦（Larry Silverstein）支付数十亿美元的担忧。尽管他最终结清了超过
    30 亿英镑，但围绕其覆盖范围的其他保险模糊性导致了十多年复杂的多方诉讼。用于保险执行和裁决的 AI 管理智能合约可能会节省大量的时间、费用和挣扎。


