    Natural resources are worth approximately £102 trillion per year globally,[^(45)](#bm05.html#en45)
    and the tracking, commodification, and conservation of nature’s bounty relies
    on multiple inputs spanning numerous geographies. The intrinsic characteristics
    of natural resources have historically limited scalable access to this sector
    to very large and wealthy parties. For example, the typical timber transaction
    entails vast tracts of land and long-term (100-year) leases or decades-long return
    on capital expectations. It has typically been the province of family offices,
    insurance funds, sovereign funds and similar dynastic investors. Blockchain could
    change all of that, introducing new levels of liquidity to a previously immobile
    and opaque asset class.


    The democratisation of natural resources is accelerating with the advent of greater
    financial and political instability in major power blocs around the world. In
    an effort to make bitcoin more palatable to regulators and policymakers, rising
    above its sometimes-seedy origins, its most ardent proponents have been comparing
    bitcoin to gold, describing it as a store of value with a limited supply, treating
    it as a virtual precious metal or commodity. But there’s no need to take a circuitous
    route in order to get precious metals onto a digital token. People are already
    tying rare metals to digital tokens.


    With interest rates dipping into the negative in a number of countries, gold is
    assuming a new lustre. It still suffers from the same problems it has always suffered
    from, namely those of security, portability, volatility and transferability –
    as well as the risk of confiscation or regulation by a given government.[^(46)](#bm05.html#en46)
    In response, a network of intermediaries and agents have arisen who assist with
    the acquisition, transport, storage, trading and management of gold assets.


    Enter blockchain. From a traceability and transaction standpoint, blockchain offers
    a number of benefits when it serves as the foundation for a token backed by gold.
    Gold is never going to assume a negative value. It has an absolute floor of zero.
    And a properly designed digital token that ties to gold, likewise, would enjoy
    similar stability.


    Some of the efforts to create digital currencies that embed commodity prices for
    some form of hedge stability, such as Ven or Tradecoin, use gold as one of their
    components. Other gold tokens are strictly tied to the value of gold by itself
    – so-called ‘pure plays’ – and sometimes linked to individual gold bars or coins.
    With the degree of traceability that blockchain allows for, you can create a fine
    level of specific information about the underlying asset.


    **THE RUNDOWN**


    In this chapter we covered:


    ◆ The unique characteristics of place-and-space activities as they relate to blockchain


    ◆ New investment and liquidity models in real estate using blockchain


    ◆ Where blockchain can assist with environmental applications such as carbon credits
    or sustainable farming


    ◆ Blockchain’s ability to democratise the utilisation and stewardship of natural
    resources


    ## [CHAPTER 8](#contents.html#rchapter08)


    ## [Organisations and governance](#contents.html#rchapter08)


    **WHAT YOU NEED TO KNOW**


    ◆ The changing velocity of business, driven by the technology revolution, has
    left governance (how we manage and make decisions) behind


    ◆ Blockchain can address this by enabling better kinds of collaboration across
    organisations


    ◆ It also can make possible new kinds of distributed organisations that previously
    couldn’t exist


    Perhaps one of the more novel applications proposed for blockchain is the reimagining
    of organisations through the lens of highly distributed decision making.'
