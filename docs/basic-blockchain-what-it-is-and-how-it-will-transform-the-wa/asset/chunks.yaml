- fmt: '

    I am wary of cultural relativism in describing government. Although most of this
    chapter will describe the promise that blockchain offers to representational and
    parliamentary democracy, I will note in passing how it might be applied within
    other forms of government.


    Russia experimented with conventional democracy, and appears unhappy with the
    results, having reverted to a nominal dictatorship in which a small circle of
    oligarchs control the levers of the economy and empower the government. The management
    of this particular form of government could benefit from reduced corruption and
    improved oversight through blockchain.


    China seems to have navigated from a descriptively communist society to one that
    has many of the economic benefits of Western capitalism without the same mechanisms
    of enfranchisement of election. The stability of this form of government could
    be safeguarded by blockchain. China has created something known as the `social
    score`, which uses data about how well people cooperate with their neighbours
    and obey the dictates of the ruling party. Your `social score` determines your
    ability to get certain employment, permission to travel, and so on. The `social
    score` of China could be audited and safeguarded through blockchain, providing
    for greater stability. Although Western democracies may find the social engineering
    of the Chinese government of its population to be abhorrent, the Chinese in turn
    may point to the spectacle that has become the governments of the United Kingdom
    and the United States and espouse the virtues of a stable society. China’s new
    digital currency may present one of the first credible threats to the hegemony
    of the world’s current reserve currencies, dominated by the US dollar.


    ### THE DOWNFALL OF DEMOCRACY?


    Let us consider the potential applications of blockchain in democracies and republics.
    We see in the United Kingdom and in America the vestiges of true Athenian democracy
    at the local level. The New England `town meeting` or the UK `town hall` bring
    individual voters forward to debate and discuss with their friends and neighbours,
    and directly express the franchise.


    At the time of writing, Western democracy is under siege. The free flow of information
    to create an informed population has been contaminated by `fake news`, troll farms
    and information that leads large numbers of people to believe in non-existent
    conspiracies and give credence to the unreal. The methods by which citizens record
    their votes are being subverted by the compromise of electronic voting machines.


    It is the culmination of a gradual process that has been creeping along for decades.
    The fourth estate, the free press that provides for an informed electorate, has
    been neutered by our preference for `Instagram` and blogs and sound bites on television
    news. Polling used to be a means of assessing sentiment. With the advent of political
    push-polling used by Republican operatives in a 1980 local election, polling became
    a vehicle for propaganda, happily embraced and exploited in subsequent elections
    around the world.


    More sophisticated and more subtle means of manipulating voters also have emerged.
    As highlighted in Rachel Boynton’s seminal documentary `Our Brand is Crisis` (later
    made into an inferior Sandra Bullock fictional feature), the best and most effective
    techniques of focus groups – the art of defining messages, disseminating them
    and finding more negative messages to create through something called `opposition
    research` – are codified and exported globally. A superclass of election engineers
    craft messages and shepherd voters along desired paths, seeking both to inspire
    the base of the home candidate and to dispirit and suppress the vote of the opposition.


    Our trust in our institutions is being hollowed out at its very core. We made
    electronic media available to everyone, and found it subverted by the enemies
    of the state. We applied algorithms, analytics and social influence to the innermost
    workings of the state.


    ### BLOCKCHAIN POLLING


    Antiquated electronic voting machines are in use in many parts of the world, obsolete
    from the very moment they were installed. Calls for improvement to election security
    have gone unheeded or, worse, been deliberately ignored. Loss of confidence in
    the security of the vote could lead to lower voter participation and by extension
    a sense of diminished legitimacy of governments.


    In a number of countries, means as crude as indelible ink are used to mark the
    fingers of voters to ensure election integrity. Blockchain, in concert with biometric
    technologies, could provide for a vastly more secure and trustworthy election
    process. Functional governments, particularly democracies and republics, rely
    on trust and transparency. A voter wants to believe that their vote is recorded
    and honestly.


    Experiments have begun to use blockchain to record votes. The theory behind these
    pilots is that people will trust the system more because they will have greater
    assurance that their vote is accurately counted. However, the introduction of
    technology also introduces new questions. For example, there appears to be some
    consensus that `Voatz`, a blockchain voting technology company from Boston, Massachusetts,
    had a certain degree of greater cyber-resilience when someone tried to hack it.
    However, security experts have raised concerns about the information that is presented
    before the vote gets recorded.


    Another kind of hack could place a different image on someone’s mobile phone,
    so that they thought they were voting for one person and in fact ended up voting
    for someone else. So the blockchain ledger would still accurately record the data
    it was fed, but the data corruption would be occurring further upstream.


    Thus, the issue of data quality comes up again. It is one of the least talked-about
    problems with blockchain, and the one that most urgently needs to be addressed
    as we begin to adopt blockchain solutions, particularly on critical applications
    such as financial services, health and government.

    '
