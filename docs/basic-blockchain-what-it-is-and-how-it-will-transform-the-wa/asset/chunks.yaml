    点对点或分布式借贷是另一个可以通过区块链改进的消费级领域。如果我们思考今天银行的功能，它接受存款并对这些存款支付特定的利率。然后它以贷款的形式将这些资金发放出去，并收取更高的利率。这两个点之间的差额（或净利息收入）是银行的主要收入来源。银行之所以获得报酬，是因为它识别了新的信贷风险（贷款对象的消费者），对他们进行承保（通过计算该消费者的违约风险并据此为贷款定价），并提供贷款服务（确保消费者按时付款，并处理其逾期或违约的情况）。还有其他其他维度——例如，大多数贷款人并不将贷款记录在自己的账簿上；他们将贷款打包成证券化组合，并将风险出售给对冲基金等其他机构。但这些都是贷款的基本机制。


    所有这些功能都可以嵌入区块链中。存款和贷款可以记录在分布式账本上。信贷风险的承保可以通过 `DApp` 进行。贷款服务可以由 `smart contract`
    和 `DApp` 处理。我们将在下一节中进一步扩展这一观点。


    ### 原生数字银行


    如果我们把人工智能、新数据源、数字货币和区块链结合起来，我们就可以实现所有功能的自动化。银行变得多余了。区块链可以嵌入代码来处理资金池、发放贷款和贷款服务。它可以使用算法而非人工承保人员来进行信贷承保。它可以从数字钱包中支付利息或收取还款。因此，通过消除中间环节和低效率，区块链辅助的金融服务对贷款接收者的成本可以大幅降低，而与传统借贷方法相比，贷款人的利润将大幅提高。鉴于消费类金融产品是银行利润最高的领域（与企业或机构业务线相比），主要机构有理由对来自区块链集体的颠覆表示担忧。


    ### 保险


    事实上，同样的逻辑也适用于保险。一份保险单，比方说是车险保单，本质上是一个风险池。你和其他许多人每月向保险公司支付保费，寄希望于你们不会发生交通事故。保险公司付出了精力寻找你、为你的保单定价并收取保费。当有人真的遇到问题时，保险公司会进行处理，确保理赔有效，然后进行赔付。


    保险市场是一个区块链可以提供效率改进的空间。假设，一个与优秀人工智能相结合的 `smart contract` 可以处理 90% 的承保、理赔裁定和结算，指数级地降低理赔处理成本。与传统保险相比，基于区块链的风险池需要更少的人和更低的。


    ### 机构应用


    区块链可以使证券交易和其他机构应用的速度、成本和合规性得到显著提高。


    #### 结算与清算


    结算和清算分别由资金转移和更新记录反映证券所有权组成。这是一个著名的记录密集型且高度依赖中间机构的过程，涉及多个利益相关者，通过应用分布式账本和数字代币可以极大地简化这一过程。Juniper
    研究认为，区块链可以推动结算成本减少 220 亿英镑。根据 IBM 的数据，区块链潜在缓解金融交易欺诈金额每年可能超过 110 亿英镑。


    #### 衍生品


    衍生品合同现在正使用区块链自动建立和结算，创造了新的效率以提高金融交易中资金周转的速度。衍生品合同在特定条件下运行以结算或解决，这些条件可以与代码挂钩，而不需要人工手动验证。即使对于某些商品，例如原油交货期货合约（需要实物交货来结算合约），添加与衍生品关联的智能数据系统也可以解决大多数已交易合约。具体来说，你将共同使用
    `Radio Frequency (RFID)`、`GPS` 和人工智能。这需要行为的改变和技术基础设施的改变，但考虑到未平仓量的美元价值等同于超过 1630
    亿英镑，这正在被认真评估。


    #### 价值转移


    区块链在改进机构间价值转移方面具有巨大潜力。全球金融机构之间进行大量货币交易。当消费者向海外汇款时，其所属机构和接收方的目的机构需要合作结算交易，这通常还涉及其他中间机构（如代理银行）。他们不是一次处理一笔交易，好比当爱尔兰的
    John 向南非的 Mary 寄送 100 英镑。为了效率起见，交易在一天结束时收集起来，银行参与被称为“净额结算”的过程，他们计算剩余的价值转移（考虑流入和流出，然后看剩下什么——一天结束时，汇丰银行是欠摩根通额外的
    1 亿英镑，还是反过来？）。这种可预测、可重复的过程，涉及固定步骤和文件核对，完全可以像由会计师军队处理一样由区块链来处理。区块链基础设施提供商 `Ripple`
    估计，在机构和政府之间的资金跨国流动中，有超过 8 万亿英镑的全球流动性被“困住”，他们设计了一种高容量协议（处理速度比比特币快的协议）来专门解决这一问题。


    ### 基础设施应用


    区块链系统提供了消除金融机构或金融市场提供者内部大量劳动力和低效率的可能性。


    #### 交易场所


    某些证券交易所现在开始尝试将整个交易所放到区块链上。虽然我们预见到替换像 `NASDAQ` 或 `德国证券交易所 (Deutsche Bourse)` 这样的大市场的整个基础设施还需要一段时间，但较小的市场已经开始尝试涉水。


    #### 合规


    合规是另一个区块链可以大幅改进已成为全球金融机构沉重负担的领域。根据麦肯锡的数据，合规成本已飙升至每年超过 2200 亿美元并继续增长。与合规功能挂钩的基于区块链的身份系统可以消除大部分这类成本。仅在了解客户
    (`KYC`) 方面，`BIS Research` 估计通过区块链每年可节省 40 亿英镑以上。


    #### 个人数据资产


