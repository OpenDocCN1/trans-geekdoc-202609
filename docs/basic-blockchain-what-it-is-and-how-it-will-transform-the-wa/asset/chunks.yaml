    \  \n\nOctober 2019\n\n## [Glossary](#contents.html#rbm03)\n\n**Algorithm**: A\
    \ set of instructions for a computer program.\n\n**AML**: AML, or anti-money laundering,\
    \ refers to a set of regulations governing how institutions must protect against\
    \ moving criminal funds. Often referred to in conjunction with Know Your Client\
    \ (KYC, see [page 158](#bm03.html#page_158)).\n\n**Artificial intelligence hybrid\
    \ systems**: A new kind of AI system that combines people and machines, in theory\
    \ delivering greater capabilities than can be found with either alone.\n\n**Augmented\
    \ reality**: Enhancing a human’s experience of reality with digital data, typically\
    \ overlaid on top of an image of the ‘real’ world.\n\n**Big data systems**: Systems\
    \ to deal with data that exists in very large volumes, velocity (it changes rapidly)\
    \ and variety (it’s very disparate). Such ‘big data’ is more complex to manage\
    \ and calculate on than conventional data.\n\n**Bitcoin**: A kind of decentralised\
    \ digital currency, not delivered by a government but instead by a network of\
    \ computers that runs on a specialised database called a ‘blockchain’ (see [page\
    \ 156](#bm03.html#page_156)).\n\n**Blockchain**: A distributed ledger (see [page\
    \ 157](#bm03.html#page_157)) that uses a particular mechanism to ensure the integrity\
    \ of the database, specifically block transactions with some form of mathematical\
    \ proof of integrity of the transaction (such as proof of work; see [page 160](#bm03.html#page_160)).\
    \ The first blockchain was created to run bitcoin.\n\n**Byzantine consensus**:\
    \ A mathematical means of ensuring parties can trust a result without having to\
    \ trust each other.\n\n**CBDC**: Central Bank Digital Currency – in this context,\
    \ a kind of cryptographically secured currency issued and controlled by a government,\
    \ in contrast to the digital currencies such as bitcoin that are issued by a network\
    \ of individuals and companies.\n\n**Command-and-control**: A highly centralised\
    \ form of management or governance, whereby one individual or a small number of\
    \ individuals makes all key decisions, and the rest of the organisation exists\
    \ to execute those decisions.\n\n**Consensus**: In this context, an algorithmic\
    \ mechanism to reach a decision among many parties, such as whether or not to\
    \ accept a new piece of data into a database such as a blockchain.\n\n**Cryptography**:\
    \ The mathematical discipline that allows plain text or easily read information\
    \ to be obscured to unauthorised eyes, providing for greater security.\n\n**DApps**:\
    \ Distributed applications, for example those that run on the Ethereum protocol,\
    \ meaning pieces of software that run on many linked computers in a distributed\
    \ network, rather than a centralised piece of software.\n\n**Derivatives**: Financial\
    \ instruments that have their value based on other, underlying assets. They ‘derive’\
    \ value from these assets. For example, a simple derivative might be something\
    \ called a ‘call option’, which means the right to buy a certain asset at a certain\
    \ price within a certain period of time. Such ‘call options’ are used to make\
    \ a bet about the price of the asset moving in a certain direction: up or down.\n\
    \n**Distributed ledger**: A database that has many copies that update each other\
    \ automatically.\n\n**Elliptic curve encryption**: A form of cryptography that\
    \ is very efficient but secure, and is used in the bitcoin blockchain.\n\n**Ethereum**:\
    \ A blockchain protocol that provides an operating system on which distributed\
    \ apps, or DApps, can run."
