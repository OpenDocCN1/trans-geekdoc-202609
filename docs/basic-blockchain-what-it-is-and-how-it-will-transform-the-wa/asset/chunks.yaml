    # 新型教育方法异常适用于区块链的哲学与技术


    教育领域一直是孕育和扩展区块链创新的摇篮，同时区块链早期探索的受益者。


    ## 起源故事


    在 `Bitcoin Foundation` 崩溃后，麻省理工学院（MIT）支持了核心开发者并资助了多个项目以维持 `bitcoin` 的运转，直到行业进一步成熟。这发生在
    `bitcoin` 价格出现异常飙升之前，那次上涨创造了新一代 `bitcoin` 百万富翁。不久后，MIT 加载了软件，并在北美的一所大学启动了首个 `Ripple
    validator node`（`Ripple validator node` 是 `Ripple` 网络的一部分，有助于确保流经其的数据完整性）。随后，其他基于
    `Ethereum` 的项目也开始涌现。当我在北美开设了第一门研究生金融科技课程——*MIT Future Commerce*（在学生 Meltem Demirors
    的坚持下开设，当时她还是 MIT 的学生），并将其推向全球 130 多个国家时，我们看到了一批探索和利用这项新技术的初创公司出现爆发式增长——这不仅来自 MIT，还来自斯坦福、普林斯顿、剑桥、新加坡国立大学以及许多其他机构。


    也许少为人知的是，MIT 在防止 `bitcoin` 在规模化之前被关闭方面所起的作用。2014 年，`Bitcoin` 才开始从一个爱好者和极度偏执者的边缘项目，转向更主流的商业和其他应用。其他协议也在开发中。随着
    `bitcoin` 交易规模的扩大，政府对使用这种新型数字货币进行非法交易的担忧也之增加。MIT 的 Alex Pentland 教授、John Clippinger（当时隶属于哈佛大学
    `Berkman Center`）和我组织了一场非公开会议，主题为“数字资产生态：身份、信任与数据”，邀请了现有企业利益相关者、创新的 `bitcoin`
    相关初创公司、政府和学术界的领袖。随后，John 在 `Windhover` 与部分参会者举行了一次静修，由此产生了 `Windhover Principles`57，这是一套被交易所和钱包使用的指南，用于展示对反洗钱
    (`AML`) 和了解客户 (`KYC`) 规定的遵守。


    如果没有 `Windhover Principles`，`bitcoin` 面临着被政府执法机构关闭的严重风险。如果没有将法币转换为 `bitcoin` 以及将
    `bitcoin` 转换为法币的能力，该协议的实用性将受到严重限制，可能是致命的，使其可能沦为一个不为人知的奇闻异事，而非定义行业的进步。有了 `Windhover
    Principles`（其变体已被采纳进所有主要交易所的服务条款），政府看到了新生 `bitcoin` 生态系统在遵守法律方面付出的良好努力。而 `bitcoin`
    创新者们在非正式但实质上获得了创新空间，没有受到监管机构的强力干预。Stan Stalnaker 随后为带有 `HubID`（一种经过验证的数字身份系统）的
    `Ven`（数字货币市场的早期进入者）提供了首次 `Windhover` 部署 58。


    然而，几十年前，关于 `Byzantine consensus` 和其他分布式数据库应用的研究就在学术殿堂开创了。如果没有对网络系统、博弈论、分布式决策以及密码学的研究，我们就无法拥有使区块链创新成为可能的关键组件。甚至有人理论认为
    `Satoshi Nakamoto` 是一位学者，而非私营部门的人员。


    今天，全球各学术机构继续推动技术前沿。全球各学术机构继续推动技术前沿。全球各学术机构继续推动技术前沿。全球各学术机构继续推动技术前沿。全球各学术机构继续推动技术前沿。全球各学术机构继续推动技术前沿。（注：保留了重复文本）。


    ## 递归与凭证


    多个利益相关者必须参与凭证的验证和确认，这是区块链适用于该领域的另一个原因。未来的状态。它过去是并继续作为区块链的受益者。通过递归，我们可以将区块链应用于学术界生产的核心产品。我指的不是那些授予
    `区块链博士学位` 的项目的出现。在我看来，那些课程对他们的毕业生是不负责任的。你现在听不到有人吹嘘自己的 `HTML 博士` 或 `UNIX 博士`。相反，我对区块链应用于学术教育的可识别产出物很感兴趣：凭证——无论是学位、文凭还是证书。


    大学教育不仅仅是坐在教室里听讲。课外活动和社区构成了居住式教育中一些最持久的元素。教育最持久的经历是我们在小组和团队中工作时，作为紧密团队的一部分解决问题。


    ## 未来的大学


    也许最令人兴奋的探索领域之一是，区块链与其他技术的结合将如何改变未来的教育体验。


