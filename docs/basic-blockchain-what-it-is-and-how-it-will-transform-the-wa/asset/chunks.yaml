    Both the energy and food markets have supply chains that are arranged with production
    in one set of locations, transportation through a complex network, and distribution
    at multiple locations. There is also a time consideration (notwithstanding advances
    in energy storage), whereby the resource being generated needs to be consumed
    within a certain duration or it will ‘expire’ and be rendered unusable. Both energy
    and food are regulated markets that have historically been burdened with antiquated
    tracking, reporting and compliance requirements, enmeshing an interdependent set
    of actors ranging from small, private-sector individuals up to and including country-level
    government agencies. The energy and food industries appear tailor-made for blockchain
    and, indeed, DLT entrepreneurs have launched hundreds of pilot projects around
    the world in recent years.


    ## ENERGY


    The energy sector has a complex supply chain involving multiple actors and domiciles,
    that are in regular and interconnected interaction with each other, governing
    more than £1.5 trillion of spending annually. We briefly touched on certain financial
    aspects of blockchain and energy in `Chapter 4`. We’ll now take a look at how
    greater transparency in energy production and distribution offers the potential
    to better manage supplies, navigate shortages or surpluses, and moderate changes
    in pricing.


    ### Logistics


    Logistics is the lifeblood of the energy sector. Heavy equipment must be deployed
    and managed at extraction and production sites. A network of suppliers, contractors,
    sub-contractors, sub-sub-contractors and service providers creates a large volume
    of contracts, invoices and tracking documentation, and requires a material effort
    devoted to reconciliation. Cost allocation is a major function within energy production
    and distribution. Frequently, energy flows across borders, adding trade documentation
    and reconciliation mapped to varying rules and regulations.


    The Oxford Blockchain Strategy Framework tells us that this repeating process
    is well suited to blockchain applications, given that it involves multiple players
    and layers of intermediaries, with paperwork and calculation subject to automation.


    ### Grid management


    Management of the energy grid can be empowered by blockchain. Historically, energy
    distribution was a one-way street. Utility companies would produce energy and
    send it to consumers’ homes. As consumers install solar generation tech at home,
    and ‘smart grid’ technologies are implemented to manage load, we are witnessing
    the emergence of a bilateral energy economy. Consumers aren’t just paying for
    energy to be transmitted to their homes; they are also sending back surplus energy
    generated during peak solar production. By keeping energy transmission to a localised
    level, efficiencies can be introduced by reduction of transmission loss.


    Blockchain offers the possibility of seamless, dynamic, multilateral energy markets.
    In geographies ranging from Australia to Estonia to Brooklyn, NY, we are seeing
    efforts to implement microgrid-blockchain from companies such as `WePower` and
    `Brooklyn Microgrid` (part of the `Consensys` family). Peer-to-peer (`p2p`) energy
    markets represent a potential democratisation of end-point energy management,
    facilitating more efficient markets and lower costs to consumers.


    Provenance emerges as a factor also. Consumers are selecting green energy, for
    example, in lieu of gas or oil. This requires knowledge and certification of how
    the electricity is produced and a mechanism to ensure that it isn’t commingled
    with ‘dirty’ energy sources such as coal.


    The application of blockchain to energy distribution management isn’t limited
    to the retail market. Wholesale energy management is a complex endeavour capturing
    multiple actors (including government as well as retail). Wholesale energy management
