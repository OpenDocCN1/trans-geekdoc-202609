    There are many instances in which you don’t need a distributed ledger, where other
    kinds of databases will do, whether a ‘big database’ like `Hadoop` or a relational
    database like `Oracle`, or simply a ‘flat’ (linear stream of data) file. Blockchain
    systems are generally ill-suited to applications like high frequency trading (HFT),
    for example, which is a ‘big money’ activity for certain financial services companies.
    To make HFT work, you need specialised systems that operate within a tightly controlled
    environment and use state-of-the-art hardware and software. HFT firms engage in
    heated discussion about the length of fibre-optic cable connecting their servers
    to the trading system, because the speed of light over a distance is a material
    factor in relative performance between firms. In that kind of environment, where
    every picosecond matters, it is not practical to absorb the amount of time it
    takes to calculate a block and have a network of distributed nodes reach consensus.
    Thus, despite the value of HFT, and despite its heavy use of advanced technology,
    blockchain cannot realistically be applied to it.


    The risk you face when engaging with an exciting new technology is the idea that
    to someone with a hammer everything looks like a nail. Ungainly, Rube Goldberg-esque
    technology architectures are being created by over-optimistic entrepreneurs, who
    in turn are taking advantage of easily accessible investor funds combined with
    insufficient judgement. Blockchains are being thrown at business use cases to
    which they are ill-suited.


    So when is a blockchain needed? Meltem devised a set of questions to answer in
    order to assess, or ‘screen’, whether or not a blockchain is potentially suitable
    to a given business problem. The screening characteristics used in the `OBSF`
    are:


    1. Automation

    2. Repeatable process

    3. Multiple stakeholders

    4. Reconciliation

    5. Value transfer

    6. Immutability


    ### 1) Automation


    Do you have some form of predictability or repeatability in a process that can
    be automated? If regular human interventions are required during the process,
    it’s going to be difficult to put that process onto a blockchain. Theoretically
    you could, but the latency would be so great it would be impractical. Imagine
    you had a mostly automated system that required a person to make manual adjustments
    before each critical decision is made. The functioning of the system would slow
    down to the speed of the fastest person, rather than the much faster computational
    speed of machines.


    ### 2) Repeatable process


    Is the process something that happens all the time and/or frequently, or is an
    ongoing activity? Or is it a process that only occurs once? A one-time process
    does not justify the expense and operational complexity involved in implementing
    a blockchain. For example, you could make a blockchain to transfer powers from
    an incumbent head of state to their successor, but that’s something that typically
    only happens every four to eight years in most countries. The blockchain would
    require a great deal of investment but would mostly sit idle.


    ### 3) Multiple stakeholders


    Are there multiple parties involved in the process or value chain? Blockchain
    is designed specifically to help multiple people reach agreement in a trustless
    environment, as we discussed in `[Chapter 1](#chapter01.html)`. If you are engaged
    in a bilateral negotiation or activity, there are much less complicated ways to
    achieve your desired outcome, even if you may not necessarily trust your counterparty
    in the negotiation. For example, a group of buyers and sellers might be trading
    with each other. They are competitive, so they may have concerns about sales agreements
    being broken. In financial markets, this role is served by intermediaries such
    as exchanges and firms called ‘market makers’ who match buyers and sellers. Those
    intermediary roles could be replaced by a blockchain, which helps explain the
    significant blockchain research investments being made by the top trading firms
    and the major securities exchanges.


    ### 4) Reconciliation


    When you have disparate data, is there one party or only a few parties involved
    in reconciliation? For example, if you’re doing inventory control, or taxes, or
    auditing music royalties, you might have the internal audit function and internal
    tax function of a corporation interacting with an external auditor or tax consultant.
    There could be more than one person involved from each group – you might even
    have dozens or hundreds of people in large, complex organisations – but you aren’t
    going to have tens of thousands of people. In some of these situations, it may
    not be necessary to use blockchain. Other approaches might deliver superior price
    and performance. On the other hand, what if you need to have greater trust in
    the results of the audit? You might then consider blockchain. A number of governments,
    for example, are considering the use of blockchain around tax and the related
    financial audits that accompany verifying that corporate tax has been paid correctly.
    In theory this can not only improve the quality of the information but substantially
    reduce the cost of tax collection and, for the corporation, of tax compliance.


    ### 5) Value transfer


    Does the process or activity involve some kind of transfer of value? Note that
    there are many kinds of value, not just monetary. Information itself, such as
    a patient’s medical records or a digital identity profile, could comprise value.


    ### 6) Immutability


    Would there be some form of benefit, or possibly even a requirement, that the
    record be unchangeable, immutable? Immutability, as we have seen, is a key feature
    of blockchain. For example, if you were buying a used car, you would want a clear
    and comprehensive record of its repairs to make you aware of any mechanical issues.
    Similarly, if you wanted to buy an expensive piece of art, you would want a clear
    record of its previous owners from the moment it was created to make sure you
    were not facilitating money laundering or buying a stolen work or a forgery.


    These six criteria are intended to be MECE – mutually exclusive and comprehensively
    exhaustive. In combination, they provide you with a rigorous assessment of whether
    or not blockchain is beneficial for a particular situation or circumstance, enabling
    you to perform a rapid diagnostic.


    ### HOW SHOULD YOU USE YOUR BLOCKCHAIN?


    Once you have determined that you need a blockchain, the questions for the `OBSF`
    then centre on where and how.


    There are three basic components, or layers, of the ecosystem to consider:


    ◆ The protocol layer

    ◆ The network layer

    ◆ The application layer


    #### Protocol layer


    Protocols, as we discussed earlier, are the basic language of how different parts
    of the blockchain network talk to each other. When devising your strategy for
    blockchain, you will want to determine whether you can use a public blockchain,
    such as `bitcoin` or plain-vanilla `Ethereum`, or if you have a specific need
    for a private blockchain.


    Within your assessment of protocol, you should examine design considerations such
    as speed, programmability and payment functionality.


    ◆ **Speed** is a function of the performance requirements of your business process.
    Is it acceptable if a block is calculated every ten minutes? Do you need 40,000
    blocks calculated per second, operating at speeds similar to the major credit
    card networks like `Visa` and `MasterCard`?


    ◆ **Programmability** relates to the question of how you adapt your blockchain
    on an ongoing basis. If you are going to be repeating the same thing over and
    over, you can probably hardwire the system. If you need greater flexibility and
    adaptability, you are going to want to be able to alter your blockchain with simple
    instructions.

