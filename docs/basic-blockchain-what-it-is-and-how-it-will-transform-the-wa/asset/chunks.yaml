    Let’s get back to the question of trust and how we make a secure data system.
    At the time of its creation, the bitcoin blockchain used elliptic curve encryption.
    One of the fundamentals of encryption is how many characters go into making the
    ‘key’ that is used to ‘lock’ and ‘unlock’ – encrypt and decrypt – the data. A
    key that consists of `a123` would be less secure than a key that consists of `abc12345678`
    because a hacker hacker would have to try more combinations in the longer key
    to crack the code. Elliptic curve encryption uses clever mathematics so that you
    can have smaller (shorter) encryption keys than a number of other types of public
    key cryptography. Public Key Infrastructure (PKI) means that anyone can encrypt
    a message, with the public key, but only the recipient or holder of the private
    key can decrypt the message. Other forms of cryptography require that you have
    the private key to encrypt as well as decrypt a message. Smaller keys mean fewer
    computer cycles to work with the cryptography, making the process faster and more
    efficient.


    In theory it would take many decades to crack `256-bit` elliptic curve cryptography
    using conventional computers. However, it is believed that quantum computers,
    once they are commercially viable, will be able to break the encryption we currently
    use across our financial systems (as well as in new financial instruments like
    bitcoin and ether) in a matter of minutes. We need to think proactively about
    a post-quantum world in which we have stronger encryption – and many people are
    doing exactly that. But for now, the bitcoin network is reasonably secure with
    its elliptic curve cryptography.


    ## WE’RE FORKED?


    Something wonderful and terrible emerged out of the distributed governance structure
    of a network of thousands of nodes where each node gets a vote on adopting changes
    to the core software. Governance is the way that a system, in this case the bitcoin
    blockchain, makes decisions. If you can’t get the participants in the system to
    agree, some will start working with one version of the software, and some begin
    working with a different version of the software. And thus is born the ‘fork’,
    the separation of two flavours of bitcoin code, which is why we have bitcoin (BTC)
    and bitcoin cash (BCH). Hard forking is an unexpected consequence of the democratic
    decision making behind blockchain governance. It’s a bit like an accelerated version
    of how Christianity branched off from Judaism, and then Islam developed some centuries
    later using Judeo-Christian scripture as a base.


    When the first blockchains were put together, there was an idealistic notion that
    people would vote on adopting new refinements. It’s a great concept; it puts the
    network into the hands of many instead of just having it in the hands of one or
    two.


    We can only assume that the expectation was that either an idea would be adopted,
    or not. Instead, Darwinian forces led to an unforeseen outcome. An idea emerged
    of creating a new variant of a particular protocol. To describe this effect, a
    phrase was borrowed from multi-threaded processing: there is a ‘fork’, or a split,
    in the universe of the protocol. Instead of one bitcoin, now there are two bitcoins.


    It’s kind of like the multiverse theory from the Marvel cinematic universe. These
    forks diverge from a key decision, and then begin...


