    **Flat file**: A linear data stream (a string of text), where one character is
    in sequence after another (‘flat’), in contrast to a relational (two-dimensional)
    database such as an `Oracle` or `SAP` database, or a ‘big data’ database like
    `Hadoop`.


    **Granularity**: Resolving information into very fine, or granular, detail, like
    focusing on a single grain of sand.


    **Hash**: A mathematical operator that transforms one number into another number,
    often used in cryptography as a way of concealing the original number.


    **High frequency trading**: High frequency trading, or `HFT`, is a type of financial
    trading conducted by superfast computer systems, typically in fractions of a second.
    `HFT` is believed to represent 50 per cent or more of all trading volume.


    **Holacracy**: A form of distributed corporate management featuring a liquid labour
    market and no formal managers.


    **ICO**: Initial coin offering, or `ICO`, was an effort to describe selling tokens
    to the public typically outside conventional regulatory scrutiny. As of writing,
    most regulatory bodies have either defined such offerings as securities offerings,
    and/or created a special category of securities offering for token sales.


    **Immutable**: Unchangeable; permanent. Immutability is a core feature of blockchain.


    **KYC**: Know Your Client, or `KYC`, is a set of regulations requiring institutions
    to verify who someone is, including collecting and verifying certain information
    like name and address. It is often discussed in conjunction with `AML`.


    **Ledger**: A record-keeping system: in the context of blockchain, a database.


    **Lightning**: A software refinement to blockchain than enables it to run much
    faster by breaking a complicated calculation down into smaller pieces running
    on a subset of network nodes, thus reducing the complexity needed to calculate
    a particular result.


    **Matrix management**: A form of corporate management that organises people around
    a particular project or task, and sets aside the traditional organisational chart
    in terms of who directs their work for that project. They still formally receive
    their performance review and management from the conventional organisation chart,
    hence are in a ‘matrix’ that includes both their task supervisor and their formal
    boss.


    **Merkle tree**: A mathematical construct for a stream of data that builds on
    itself so that you can ensure the integrity of the data; if someone tries to change
    one historical part of the ‘tree’, the entire edifice becomes corrupted, telling
    you that there was an effort to make a change.


    **Mining**: The process of adding new entries into a cryptocurrency ledger, in
    the process creating new units of that currency. Mining consists of engaging in
    complex mathematical calculations.


    **Nanomachine**: A microscopic machine, often highly configurable and potentially
    self-replicating.


    **Network theory**: In the context of computer systems, the science of how an
    arrangement of devices are connected to each other.


    **Node**: A server attached to a blockchain network that has the software for
    that network loaded onto it.


    **OBSF**: Oxford Blockchain Strategy Framework.


    **Open-source**: A way of developing software whereby the source code (or underlying
    instructions) is made available freely, but to use it, people need to commit to
    providing back any improvements they make to the code so that all may share in
    the benefits of the commons.


    **Pilot project**: A small-scale test of a technology.


    **Pooling money**: Assembling disparate bits of money into a single unit, or pool,
    that in turn might be used for purposes that benefit from the scale that is thus
    created.


    **Proof of work**: A specific mechanism to achieve Byzantine consensus that relies
    on certain mathematics that is difficult to do, and that forms a foundation of
    how the `bitcoin` blockchain conducts transactions. The difficulty of the maths
    serves to deter cyberattackers, who can’t simply overwhelm a network by throwing
    a massive attack on it (known as a ‘Sybil Attack’). Other protocols might use
    other consensus algorithms, like proof of stake.


    **Protocol**: The set of instructions that allows nodes (participating computers)
    in a network to talk to each other and exchange information.


    **Provenance**: The chain of ownership or title of an asset, ‘proving’ from where
    it comes.


    **Quantum cryptography**: An advanced form of encryption that uses quantum computers.


    **Relational database**: A database where the data elements are described in terms
    of their relationship with each other. For example, a birthday database would
    have the date of someone’s birth, one data element, cross-referenced to the name
    of an individual, another data element.


    **Ripple**: A blockchain-based system to settle, exchange money, and handle remittances
    in an international network. Its underlying protocol is called `XRP`.


    **Safe harbour**: A means by which a regulator provides guidance to a company
    about a permitted set of activities, typically so that the company might explore
    a new or experimental area of activity.


    **Securities**: Financial instruments that are used to represent a particular
    asset and which can be traded.


    **Settlement and clearing**: The act of transferring ownership of a security from
    one party to another. Settlement refers to the payment of value (money or other)
    for a security, and clearing is the updating of the records that reflect ownership
    of that security.


    **Shadow banking**: A non-bank financial system that engages in banking-like activities
    but is outside conventional banking regulations.


    **Smart contract**: A set of instructions that are followed by a software program
    on a blockchain when certain conditions are met.


    **Taylorism**: A form of management espoused by Frederik Winslow Taylor that focuses
    on efficiency and strict time utilisation. Popularised by American industrialist
    Henry Ford among others.


    **Token**: Tokens have a few meanings in the context of blockchain: they are (1)
    a store and mechanism for transfer of value; and (2) a digital security that is
    regulated by financial authorities.


    **Tokenised exchange**: Variously (1) a marketplace on which blockchain tokens
    can be bought and sold; and (2) a securities exchange that uses blockchain tokens
    to better automate settlement and clearing of traded securities (not necessarily
    or exclusively blockchain token securities).


    **Value chain**: A set of interrelated activities that create (or ‘add’) value
    to a product.


    **Value transfer**: A means by which one party provides funds to a second party,
    so that the second party may transfer it to a third party. Western Union would
    be such a second party, accepting money from one person in one location and providing
    it to another person in another location.


    **Windhover principles**: A self-regulatory set of guidelines adopted by some
    cryptocurrency companies to explain how they would comply with `AML` and `KYC`
    regulations in handling currencies such as `bitcoin`.


    ## Bibliography


    ### BOOKS


    Hardjono, Thomas, Shrier, David L. and Pentland, Alex (2019) *Trusted Data.* MIT
    Press: Cambridge, MA and London, UK.


    Jakobsson, M. and Juels, A. (1999) ‘Proofs of Work and Bread Pudding Protocols
    (Extended Abstract).’ In Preneel B. (ed) *Secure Information Networks*. IFIP —
    The International Federation for Information Processing, vol 23. Springer, Boston,
    MA.


    ### ARTICLES


    Androni, M. et. al. ‘Blockchain technology in the energy sector: A systematic
    review of challenges and opportunities.’ February 2019. `https://www.sciencedirect.com/science/article/pii/S1364032118307184#s0090`

