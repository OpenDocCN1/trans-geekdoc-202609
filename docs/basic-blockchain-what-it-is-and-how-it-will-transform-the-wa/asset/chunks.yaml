  raw: 'Let’s get back to the question of trust and how we make a secure data system.
    At the time of its creation, the bitcoin blockchain used elliptic curve encryption.
    One of the fundamentals of encryption is how many characters go into making the
    ‘key’ that is used to ‘lock’ and ‘unlock’ – encrypt and decrypt – the data. A
    key that consists of a123 would be less secure than a key that consists of abc12345678
    because a hacker would have to try more combinations in the longer key to crack
    the code. Elliptic curve encryption uses clever mathematics so that you can have
    smaller (shorter) encryption keys than a number of other types of public key cryptography.
    Public Key Infrastructure (PKI) means that anyone can encrypt a message, with
    the public key, but only the recipient or holder of the private key can decrypt
    the message. Other forms of cryptography require that you have the private key
    to encrypt as well as decrypt a message. Smaller keys mean fewer computer cycles
    to work with the cryptography, making the process faster and more efficient.


    In theory it would take many decades to crack 256-bit elliptic curve cryptography
    using conventional computers. However, it is believed that quantum computers,
    once they are commercially viable, will be able to break the encryption we currently
    use across our financial systems (as well as in new financial instruments like
    bitcoin and ether) in a matter of minutes. We need to think proactively about
    a post-quantum world in which we have stronger encryption – and many people are
    doing exactly that. But for now, the bitcoin network is reasonably secure with
    its elliptic curve cryptography.


    ### **WE’RE FORKED?**


    Something wonderful and terrible emerged out of the distributed governance structure
    of a network of thousands of nodes where each node gets a vote on adopting changes
    to the core software. Governance is the way that a system, in this case the bitcoin
    blockchain, makes decisions. If you can’t get the participants in the system to
    agree, some will start working with one version of the software, and some begin
    working with a different version of the software. And thus is born the ‘fork’,
    the separation of two flavours of bitcoin code, which is why we have bitcoin (BTC)
    and bitcoin cash (BCH). Hard forking is an unexpected consequence of the democratic
    decision making behind blockchain governance. It’s a bit like an accelerated version
    of how Christianity branched off from Judaism, and then Islam developed some centuries
    later using Judeo-Christian scripture as a base.


    When the first blockchains were put together, there was an idealistic notion that
    people would vote on adopting new refinements. It’s a great concept; it puts the
    network into the hands of many instead of just having it in the hands of one or
    two.


    We can only assume that the expectation was that either an idea would be adopted,
    or not. Instead, Darwinian forces led to an unforeseen outcome. An idea emerged
    of creating a new variant of a particular protocol. To describe this effect, a
    phrase was borrowed from multi-threaded processing: there is a ‘fork’, or a split,
    in the universe of the protocol. Instead of one bitcoin, now there are two bitcoins.


    It’s kind of like the multiverse theory from the Marvel cinematic universe. These
    forks diverge from a key decision, and then begin to take on separate lives.


    While on the one hand it diminishes the critical mass the particular protocol
    might have, on the other hand it creates the opportunity for Darwinian evolution
    to play out. The best idea will prove itself over time.


    ### **ETHEREUM AND DAPPS**


    Ethereum was a new type of blockchain that was initially launched by Vitalik Buterin
    in 2013. Ethereum is much easier to learn how to program and arguably more flexible
    than bitcoin blockchain, but shares many of the same characteristics such as mining
    and blocks. The biggest point of difference of Ethereum was the introduction of
    ‘smart contracts’. The idea behind smart contracts was to make blockchain more
    of a distributed operating system on which you can run different programs, or
    applications. Instead of being optimized primarily to run as a currency, in the
    case of bitcoin blockchain, the Ethereum blockchain was constructed to be multipurpose.


    Smart contracts are misleadingly named; they are neither smart nor contracts.
    A smart contract is a specific set of instructions that execute under specific
    circumstances. Ethereum is an exciting idea because it was designed as an operating
    system for running various kinds of computer programs on top of a blockchain network.
    These programs are known as distributed applications or DApps.


    Putting these elements together gives us a distributed programming platform with
    good security. Now, we have migrated blockchain from a currency-specific system
    into something that can be used in any number of use cases to solve problems where
    redundancy, resilience and/or trust are critical factors, such as who owns a piece
    of property, or correctly recording someone’s vote in a political election.


    ### **HASHGRAPH, LIGHTNING AND OTHER HACKS**


    With systems like the bitcoin blockchain and the Ethereum blockchain, we’ve now
    solved problems like creating trust in a trustless environment, immutability,
    and accessing large amounts of compute power. We’ve sacrificed, however, speed
    and scalability.


    The more people use bitcoin, sending it back and forth, the larger the block sizes
    get and therefore the longer it takes to perform the calculation on each block.
    If several people want to send money at the same time, as happened in December
    2017 and January 2018 during a run-up and crash of the price of bitcoin, the processing
    speed for each block calculation slows down dramatically. MasterCard can process
    around 44,000 transactions per second (TPS), PayPal about 600 TPS,[⁴](#bm05.html#en4)
    while on average Ethereum processes about 15 TPS[⁵](#bm05.html#en5) and bitcoin
    (after it was modified to be faster) averages between 7 and 9 TPS. If you get
    a bunch of people wanting to transact, given that there are only so many miners
    and mining computers, you have to wait in a queue for your block to clear. During
    the spike I mentioned of winter 2017–18, it took more than ten minutes, sometimes
    substantially longer, to clear blocks.


    There are different approaches to solving the speed issue. For your core bitcoin/blockchain
    enthusiasts, new code was put together that lives on top of bitcoin called Lightning.
    Lightning overlays on bitcoin to create subsets of nodes that talk to each other
    to accelerate the number of TPS you can push through the system. Because it runs
    on a subset of the nodes instead of needing to talk to all of the nodes, it’s
    much faster.


    Similarly, Ripple cleverly takes the basic, fully distributed network of blockchain
    nodes and breaks them up into smaller sub-trees for its XRP protocol. Each sub-tree
    then works on a subset of the calculations, dramatically improving speed.


    Hedera Hashgraph takes advantage of highly distributed networks of devices to
    accelerate compute speed by propagating what is called ‘gossip’ (pieces of data)
    in clusters, instead of requiring coordinated synchronous consensus, theoretically
    yielding 250,000 TPS (although we have yet to see this operating at scale . .
    . bearing in mind that VISA or MasterCard are global businesses with hundreds
    of millions of transactions processed each day).


    You now know enough about the basics to begin looking at blockchain’s potential
    applications. We’ve explained the fundamental building blocks behind blockchain,
    we’ve illustrated some of the issues with it and potential solutions, and we’ve
    laid the foundations for exploring use cases in different industries.


    Before we can delve into those, however, we must speak about the hidden shoals
    that could scuttle the ship: the blockchain hype train.


    **THE RUNDOWN**


    In this chapter we covered:


    ◆ How blockchain emerged out of the 2008 financial crisis'
