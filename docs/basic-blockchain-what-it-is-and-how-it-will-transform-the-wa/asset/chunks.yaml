    again into a data-driven future that appears a great deal like the Connected World
    I am describing here, where their greatest value will be derived from enabling
    and empowering advanced networked data applications (like what happens with DApps
    on blockchains) versus simply providing the inner workings of the hardware connected
    to that network.


    The Connected World not only brings us new sources of data about how we live and
    work, but also new abilities to compute this data in a highly distributed, dynamic
    fashion. This in turn can give us an environment that is more responsive to our
    needs and a society that more rapidly adapts to change.


    ### **THE AUGMENTED WORLD**


    With the rise of digitally connected devices and better AI, a new kind of reality
    may emerge where little computers stay with us all the time and tell us things
    about the world around us. Dreamed of for decades, this augmented reality is increasingly
    coming into being, and should over the next several years begin to permeate our
    everyday existence.


    Built in harmony with the Connected World, the Augmented World is one in which
    our lives are enriched by an interpreted and extrapolated stream of data that
    is played back across our field of vision – whether through implanted devices
    or digitally enabled spectacles. We gain a greater understanding of what is happening
    in the world around us in the process. The hidden data flows that surround us
    are now made explicit, which lets us have a greater insight into our world and
    make better decisions about it as a result. If we’re driving down the street and
    a heads-up display on our vision warns us that a car is swerving into our lane,
    we (and/or the AI driving our car) can take action to make us safely avoid an
    accident. If we are walking by a store that has something we need available on
    sale, our Augmented World can let us know about this product’s availability. If
    we are sick, or someone near us is sick, the Augmented World could detect symptoms
    and help recommend intervention. Physical safety, commerce, health, all could
    be enabled and improved in the Augmented World.


    The cybersafety and cybersecurity of our personal data in this Augmented World
    can be assured by blockchain. There are many benefits that can be derived from
    the Augmented World, but in making data readily accessible and analysable, we
    also create cybersecurity risks. The benefits of safely pooling data derived from
    these augmented interactions, without creating undue risk, can be realised through
    specially engineered distributed ledger and artificial intelligence hybrid systems.


    There is even the possibility that, in the Augmented World, our daily interactions
    with each other can be mediated and improved through the combination of distributed
    ledger data systems and personalised artificial intelligence engines. Our personal
    AI engine could learn our preferences and our needs, through the simple course
    of interacting with us on a daily basis and understanding how we behave and what
    we want. This AI engine could then automatically interact with other AI engines
    for other people, companies and systems, thus extending our ability to express
    ourselves at greater and greater scales. The security of these interactions can
    be provided for using advanced forms of blockchain and cryptography.


    ### **THE ADAPTED WORLD**


    The Adapted World sees us enjoying the ultimate in customised goods and services.
    Templates for anything you can imagine could be stored in blockchains. Some would
    be open source or free to the world. Others might have a hefty royalty or fee
    for use. And these templates would be used to power nanofabrication machines.
    Instead of logging on to Amazon and ordering that new rice cooker or microwave,
    waiting days or a week for it to arrive, you’d access the template and have your
    supply of nanomachines manufacture it for you in minutes, with blockchain automatically
    tracing the use of the intellectual property and allocating and auditing payment
    for license rights.


    ### **THE DISTRIBUTED SOCIETY**


    We already see multinational corporations providing their own private security
    forces – take for example cruise liners in international waters. Some are even
    launching their own digital currencies, giving billions of people who currently
    find themselves outside the conventional systems of government the ability to
    access the financial system, a critical function of society. Governments themselves
    have been thinking about how blockchain can be integrated into core government
    functions such as currency issuance, voting, distribution of government benefits
    and tax collection.


    What if we shaped a Distributed Society where we see multiple governments and
    their citizens coming together in new and unexpected ways, around shared issues
    or concerns, with blockchain and blockchain-like governance mechanisms providing
    a means of accessing the collective intelligence of millions, or billions, and
    directing positive outcomes on a global scale?


    What would this kind of a society look like? A hundred years ago we could only
    vaguely imagine how our world would be with electric vehicles, mobile communications,
    the ability to engineer genes and rockets that fly to other planets. Such fanciful
    ideas were the province of science fabulists like H.G. Wells and Jules Verne,
    but today they populate our physical world.'
