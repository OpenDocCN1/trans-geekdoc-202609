    Management of the energy grid can be empowered by blockchain. Historically, energy
    distribution was a one-way street. Utility companies would produce energy and
    send it to consumers’ homes. As consumers install solar generation tech at home,
    and ‘smart grid’ technologies are implemented to manage load, we are witnessing
    the emergence of a bilateral energy economy. Consumers aren’t just paying for
    energy to be transmitted to their homes; they are also sending back surplus energy
