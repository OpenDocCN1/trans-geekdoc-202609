    Cambodian rice farmers are banding together, empowered by distributed ledger technology,
    to ensure they get better prices for their grain. More broadly, there is opportunity
    to drive effective supply and demand aggregation through blockchain systems to
    improve fairness and transparency within the highly inefficient world of food
    production and distribution.


    #### Higher velocity


    Blockchain is a viable tool for increasing the speed with which the food supply
    chain is managed. Commodities giant Louis Dreyfus was able to decrease transaction
    time by 80 per cent for wholesale trade (60,000 tons of soybeans, in the case
    of their pilot) using blockchain technology. By digitising a currently analogue-heavy
    world of papers and faxes, and tying it together in a manner that can only be
    achieved through networked technologies, blockchain delivers enormous change to
    the basic logistics of the world’s food supply.


    Applying blockchain to the food supply chain may result in higher prices for consumers,
    as near-slave-labour conditions at the point of production are remediated. This
    may compress profits for food companies until they rationalise their work-forces
    for the newly digital era, which in turn would create a labour challenge that
    would need to be addressed. On balance, however, greater equity, greater efficiency
    and greater food safety are enabled by the application of blockchain.


    #### ENHANCING SYSTEMS


    What we see, with the application of blockchain to sectors such as energy and
    food, is the development of a systems approach to interconnected players, one
    that can reconfigure itself to changing circumstances and new entrants. An ephemeral,
    consumable resource, whether it be a mango or a kilowatt of electricity, is now
    better adapted to the needs of society because blockchain creates greater transparency,
    higher velocity of information exchange and a democratised locus of control.


    We also see the strange intermarriage of capitalist and communist ideals as the
    means of production are more firmly placed in the hands of the worker, and the
    collective bargaining power of numerous small actors is automatically aggregated
    and tied to economic outcomes through distributed ledgers and even tokenised exchanges.
    Tokenised exchanges of, for example, farmer outputs could create a new currency
    linked directly to the good or service produced, making value exchange more transparent
    and attributable within a large network of numerous small actors.


    #### THE RUNDOWN


    In this chapter we covered:


    ◆ The concept of provenance, and why and where it may be important


    ◆ Blockchain’s upstream and downstream applications in the energy sector


    ◆ How food safety and sustainable farming can be helped by blockchain


