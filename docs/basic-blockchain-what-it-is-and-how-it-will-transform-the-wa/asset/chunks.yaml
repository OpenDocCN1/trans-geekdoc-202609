    ## Real estate, the environment and natural resources


    #### WHAT YOU NEED TO KNOW


    ◆ The physical world can be made easier to understand and interact with through
    the application of blockchain to newly available data sets


    ◆ Real estate can be bought, sold, developed and maintained more efficiently and
    effectively


    ◆ The intersection of environment, policy and economics can be vastly improved
    through DLT


    ◆ Natural resources such as gold and other commodities can more readily be transacted


    Activities in the realm of place and space offer a novel set of use cases for
    blockchain, as we seek to translate the tangible world through which we move and
    live into a readily accessible, communicable set of information. The legacy practice
    of real estate, for example, is dominated on the data front by a monopoly provider
    of pricing information with closed systems and archaic data sets. The blockchain-enabled
    future will make granular data available, shareable, and manipulable. Our approach
    is predicated on the idea that we can find some way attaching data sets, which
    would increase productivity. There are reams upon reams of documents to consider,
    and a blockchain could help navigate this complexity. This could open up new possibilities.


    #### REAL ESTATE


    Real estate is a massive asset class, representing more than £228 trillion in
    value, but until recently it was subject to significant complexity. With blockchain
    and tokenisation, we can reduce real estate into micro-fractional elements, and
    open it up for investment. New kinds of derivatives could be created to introduce
    greater stability or control.


    The transactions involved in the purchase and sale of real estate hold the potential
    for massive simplification and cost reduction. For example, many real estate transactions
    today require title insurance and clarity around chain of title. Both considerable
    expense and considerable delay are an accepted reality for even the simplest home
    purchases, much less multi-lot, mixed-use development projects. Including environmental
    assessments and financial records.


    In the commercial real estate (CRE) world, blockchain can help automate the transaction
    process. Searching for properties is a laborious and data-inefficient process,
    with multiple and sometimes conflicting data sets that could be harmonised through
    a distributed ledger. Time and effort is expended with pre-transaction due diligence.
    A variety of disparate data needs to be compiled, synthesised and distributed
    in a controlled fashion. Take, for example, an environmental report detailing
    whether a building has toxic chemicals stored underneath it or asbestos in its
    walls. If such things existed in the past but were remediated, one needs to know
    when this action was taken, what kind of action was taken, by whom, and who has
    certified that the building is now safe. Blockchain systems could potentially
    assist with the organisation and data management of access control, distribution
    and validation of information quality. Another potential blockchain application
    within CRE is the creation of an intelligent and flexible real estate lease that
    could adapt on the fly to the needs of tenant and landlord, a smart contract attached
    to a distributed ledger.


    Insurance crosses the real estate market in novel ways. For example, the insurance
    policy for the World Trade Centre was purportedly unsigned at the time of the
    9/11 attacks. This caused some consternation as to whether or not billions would
    be paid out to policyholder Larry Silverstein. While he eventually cleared more
    than £3 billion, other policy ambiguities surrounding his coverage led to more
    than a decade of sprawling multiparty lawsuits. An AI-managed smart contract for
    the execution and adjudication of insurance might have saved considerable time,
    expense and struggle.


