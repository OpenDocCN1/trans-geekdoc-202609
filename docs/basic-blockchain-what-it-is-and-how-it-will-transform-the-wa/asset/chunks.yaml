    分布式社会寻求实现一种虽然更加模糊、无形，但依然强大的事物。它可能释放真正的集体智能的潜力，即通过汇集数百或数千人的智慧来解决问题或预测未来事件的机制（即便在今天，初步研究表明这种力量远大于个体智能）。我们可能会接近皮埃尔·德·泰德·夏尔丹（Pierre
    Teilhard de Chardin）设想的乌托邦理想，即通过和谐的方式连接人们的思想，使人类文化进化到更高层次的意识，从而让所有人受益。我们可能会看到一种我们尚未命名的事出现，这是一种新的商业和社会形式，它将以我们今天才开始模糊把握的方式改善人类的生活。


    正如詹姆斯·卡梅隆（James Cameron，电影《终结者》、《阿凡达》导演）所说，未来由我们自己创造。


    # 概述


    在本章中，我们涵盖了：


    * ◆ 连接世界（Connected World）如何为我们提供新的见解

    * ◆ 增强世界（Augmented World）如何通过获取信息的信息的渠道，赋予我们与周围世界互动的新方式

    * ◆ 适应世界（Adapted World）反过来如何改变实体世界与我们互动的方式

    * ◆ 塑造分布式社会（Distributed Society）对我们意味着什么


    ## 结论 (#contents.html#rbm01)


    如果没有无数学生的启示——他们正在想象、开发、实施和发展世界上下一批大型颠覆性的区块链公司和金融创新——这项工作是不可能的。


    通过`Basic Blockchain`，我为你提供了区块链如何运作的基础概念元素，以及它可能如何应用于你的工作、生活和社会。这些是原始的构建块，你可以从此推导出一种新的未来。你可以带着这种灵感，也许为此思考几天。你可以和朋友交谈，你可以招募同事，你可以建立下一个区块链独角兽。


    在所有情况下，改变的力量都在你手中。技术并非仅仅发生在我们身上。人类社会创造了区块链，人类可以决定它被用来做什么以及不被用来做什么。


    有了区块链，我们要向何方去？


    回答这个问题掌握在你手中，我希望你能够充分利用它。


    ## 致谢 (#contents.html#rbm02)


    我要感谢我的编辑 Little, Brown 出版公司的 Tom Asker 以及我的经纪人 Leah Spiro，他们帮助以创纪录速度完成了这本书的编写。为了实现这一目标，我的少数几个
    Beta 测试员——John D’Agostino, Amias Gerety, Oliver Goodenough, Linda Jackson-Holmes,
    Adele Jashari, Rene Landers, Jane Thomason 和 Deborah Webster 从忙碌日程中抽空对内容和想法进行了合理检查。我感谢健康链专家
    Frank Ricotta 和 Susan Ramonata，确保了`Chapter 5` (#chapter05.html) 符合目标。Johanna Afrodita
    Zuleta 帮助为我的封面增添了一抹色彩。老练的 E.J. Bliner 帮助我对任务负责，使我能够保持紧张的写作计划。


    我有幸与世界前五机构中的两个——麻省理工学院（MIT）和牛津大学的思想领袖合作，在此过程中我帮助每家机构将他们的下一代教育产品民主化到 130 多个国家。我看到从这一股充满想象力和协作精神的区块链先驱浪潮中涌现了一些令人惊叹且意想不到的想法。麻省理工学院的
    Alex Pentland 教授和牛津大学赛德商学院的 Tufano 院长证明了这些思想的力量。（等等，原文在这里弄乱了，我将遵循提供的文本）：


