    The application of blockchain to energy distribution management isn’t limited
    to the retail market. Wholesale energy management is a complex endeavour capturing
    multiple actors (including government as well as retail). Wholesale energy management
    would benefit from the transparency that blockchain provides.


    If we think about the strategic goals of energy, we see opportunities to apply
    convergent technologies for (1) understanding economic development; (2) assessing
    progress towards Sustainable Development Goals; and (3) infrastructure planning.
    These functions are greatly enhanced by blockchain.


    ## FOOD


    The world’s food supply is ripe for blockchain, especially with regard to provenance
    and transparency. Food traceability and ingredient supply chain management have
    numerous implications for agriculture, food production and distribution.


    ### Food safety


    High levels of transparency and clear traceability of individual ingredients allow
    for a cost-effective approach to safety issues ranging from contamination to recall.
    A salmonella outbreak, for example, could be more effectively identified and contained,
    and retailers, consumers and key authorities notified rapidly. Research firm `Gartner`
    suggests that as many as 20 per cent of the world’s grocers will employ some form
    of blockchain by 2025 to introduce greater transparency.


    As consumer demand rises for organic, pesticide-free, farm-to-table produce, large
    retailers such as `Walmart` are partnering with tech providers such as `IBM` to
    introduce total transparency into their food supply chain. They report that tracing
    food sources can be accelerated from seven days to fewer than three seconds using
    blockchain.


    ### Food provenance


    Food provenance also has implications for environmental, social, and governance
    (ESG) factors. Not only can a food product be certified as free of certain pesticides
    or hormones, but also worker conditions and appropriate labour treatment can be
    monitored and certified. Guidelines such as the `OECD`’s Responsible Business
    Conduct (`RBC`), which incorporates standards like the `UN Guiding Principles
    on Business and Human Rights` (`UNGPs`), can be attached to the food supply chain
    and enable high-trust certification at the point of sale.


    More broadly, we can think about the provenance of commodities. According to Serge
    Schoen, the former CEO of industry giant `Louis Dreyfus Commodities`, Egyptian
    cotton sells for 200 per cent more than other kinds of cotton and there is 200
    per cent more ‘Egyptian’ cotton sold every year than is actually produced. The
    profit motive to counterfeit this premium product is as clear as the opportunity
    for blockchain to provide assurances of a product’s origin and quality.

