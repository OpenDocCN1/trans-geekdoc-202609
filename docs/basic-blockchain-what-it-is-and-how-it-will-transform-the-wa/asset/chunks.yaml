- fmt: '

    Blockchain technology, when coupled with other technology innovations, is the
    perfect evolutionary response to the social, political and economic pressures
    we face in today’s world. It is no surprise that `bitcoin` was born out of the
    2008 financial crisis – it was a direct response to the threat of central banking
    and quantitative easing. Our world will continue to evolve and adapt as we face
    new threats. Existing systems are not sophisticated enough to solve new problems.
    We are still in the early days of building these new systems, and much of the
    infrastructure needed to build new types of platforms, products and services has
    not yet arrived.


    More importantly, the ideology and mental framing needed to deploy blockchain
    in meaningful ways has not yet been popularised and socialised in a way that most
    people can understand. The problems introduced by the architecture of our existing
    world are only now beginning to surface as we begin to understand how a series
    of choices made over the last twenty years as the internet was developing have
    locked us into a path that is fundamentally unsustainable and deeply unsettling
    to the future of humanity.


    Many of the conversations you’ll hear about blockchain, and much of what’s detailed
    in this book, are actually not about technology. Rather, meaningful analysis of
    blockchain is about imagining what could be possible in the future with this new
    technology, and imagining new ways of thinking and organising and interacting
    as human beings – and also machines (perhaps our new robot overlords?). Blockchain
    has the potential to redefine the relationship between technology and the individual,
    and to create a new set of social, political and economic tools that provide privacy,
    sovereignty and user choice while increasing connectivity, efficiency and access.
    This is a worthwhile, but challenging, effort, and it cannot be implemented by
    technology or one company alone.


    While the internet has ushered in a new wave of economic activity and entirely
    new forms of human interaction and connectivity, it has also highlighted the dangers
    of allowing a narrow set of players to capture vast swathes of a new digital frontier.
    Part of the impetus driving blockchain technology is a desire to change the power
    structure within this new digital world, and to minimize the ability of any one
    entity – whether a company or a government – to exercise control over a medium
    so critical to the growth and evolution of our world.


    The gatekeepers of the world we live in today have every incentive to keep us
    out. We are in the midst of a renaissance for young people, for people who have
    historically been excluded, for people who believe in something totally different.
    Our gatekeepers recognize that they have to let this new thing happen because
    it’s part of the natural evolution of our world, but they will fight it because
    it threatens their status, and they will attempt to co-opt it.


    So this is the challenge we face: how do we bring this change into being without
    watering down the ideals and principles we began with and our belief in what the
    future could look like? What will come in the future shouldn’t look like the past.
    I worry that much of what’s being done with ‘blockchain’ today is simply a facade
    built on top of the existing architecture we already have – minimal innovation
    and no actual change to the status quo. We have to break down barriers and silos
    – technical, social, political and economic barriers – to make the future we want
    possible. We must use science, mathematics, design and reason to build bridges,
    to build stories, to build transitions from our current world to the future we
    believe should exist.


    As we move from the present into the future, each of us is responsible for making
    a series of choices about what we accept and reject, what we deem possible and
    impossible. Hopefully the ideas that have inspired the last decade of innovation,
    starting with `bitcoin` and evolving beyond into `blockchain`, will catalyse a
    new set of choices we have never had before, and bring about a world where we,
    as humans, can exercise choice, consent and agency.


    I began working with David Shrier, the author of this book, when I was in graduate
    school at MIT. David was at the Media Lab, I was at the Sloan School, and as I
    was navigating my personal journey of asking ‘why’, I would regularly show up
    at Dave’s office and demand we teach students about cryptocurrencies, the history
    of money, the principles of `bitcoin` and what was happening around the world
    with entrepreneurs who were using this technology to attempt to solve a wide range
    of problems and to create new opportunities.


    This book, and many of the efforts Dave, myself and others have collaborated on
    over the years have been an attempt to make this learning cross-disciplinary,
    but also to move out of the `how`, the practical technical conversation, into
    the `why`, which is what inspires hearts and minds.


    So `why` blockchain technology?


    Read on and find out . . .


    Meltem Demirors,


    Co-creator, Oxford Blockchain Strategy Programme


    ## Introduction


    ‘Everything is possible until proven impossible, and then you just need to become
    more creative’


    – Scott Parazynski, physician, entrepreneur and veteran astronaut


    A revolution is under way in every continent on the planet save Antarctica. It
    isn’t led by gun-toting insurrectionists looking to profit from poppy fields.
    It isn’t governed by a handful of Silicon Valley elites who think that asset value
    creation is impossible outside a fifteen-minute drive of Sand Hill Road. It isn’t
    controlled by dusty bureaucrats in the back offices of governments. It isn’t a
    shiny new widget from a global consumer packaged goods company that will shed
    pounds from your hips in mere minutes. All of these parties would like to control,
    own, influence or use this revolutionary force, yet not one has exclusively taken
    the driver’s seat in this nitrous-powered rally car barrelling down the midnight
    highway of innovation.


    I write, of course, of `blockchain`. Born from an obscure body of government-funded
    research on game theory called `Byzantine consensus`; championed by drug dealers
    and other criminals seeking to lander ill-gotten gains, and by libertarians disillusioned
    with the broken promises of the establishment; accelerated by entrepreneurs seeking
    to improve financial access for the poor; funded by giant corporate interests
    attracted to the potential for billions of dollars of cost savings; `blockchain`
    heralds a new era of financial inclusion, legal inclusion for the dispossessed,
    lower prices for consumers and higher anxiety for enforcement professionals all
    over the world.


    The hype cycle is in full swing. New heights of absurdity were ascended when,
    at a reception at Davos, I spotted a known con artist passionately embracing a
    prominent blockchain CEO. One group of ambitious executives have even created
    a cryptocurrency backed by bananas. Parodists created a successful token system
    (well, one with a non-zero exchangeable value) fancifully affiliated with garlic.
    Major governments and NGOs are aggressively pursuing efforts to eliminate corruption,
    waste and fraud through `blockchain`-based financial and record-keeping systems.

