    on how to upgrade bitcoin beyond its capacity and speed limitations, leading to
    a ‘fork’ of the code into bitcoin (BTC) and bitcoin cash (BCH). Block computation
    has gotten so complex that no longer can an undergraduate in a dorm room connect
    a low-end laptop computer and compete effectively in the mining marketplace: professional
    organisations with advanced computational capabilities are needed.


    And the original bitcoin code base was a bit of a hack. Arguably more elegant
    protocols have emerged since, whether it’s the Interplanetary File System (IPFS)
    approach to largescale data storage or the distributed app (DApp) capabilities
    of Ethereum.


    In the new, more complex world of blockchain that has emerged since bitcoin’s
    inception, Nakamoto’s identity is more of a historical curiosity than anything
    else.


    ### **RIDING THE HYPE TRAIN**


    Consulting firm Gartner has posited that all new technology goes through a predictable
    hype cycle of rising expectations, overinflated promises, despair on discovering
    the disappointing truth, and then some productivity plateau when the real applications
    of the technology are deployed. Blockchain technology may be past its absolute
    peak, but still has a bit of froth surrounding its appeal given the nature of
    projects that continue to receive funding from well-intentioned investors.


    Blockchain is both more, and less, than it is purported to be.


    The discerning executive must be able to tell the difference between a meaningful
    business opportunity and another piece of vapourware backed by a Ponzi scheme.
    Make no mistake: the blockchain revolution offers ample helpings of both.


    To help weed through the dross for the valuable nuggets, my colleague Meltem Demirors
    and I have developed a set of frameworks to facilitate rapid understanding of
    blockchain protocols and technologies – what we term the Oxford Blockchain Frameworks.
    We’ll discuss these in more detail in the next chapter.


    **THE RUNDOWN**


    In this chapter we covered:


    ◆ How open-source community development models have sometimes gone too far in
    the service of investor relations


    ◆ The ideological views espoused by some particularly passionate blockchain advocates.


    ◆ Why Satoshi Nakamoto’s true identity is irrelevant


    ## [CHAPTER 3](#contents.html#rchapter03)


    ## [Oxford Blockchain Frameworks](#contents.html#rchapter03)


    **WHAT YOU NEED TO KNOW**


    ◆ It can be easier to understand blockchain by applying new strategy frameworks


    ◆ The Oxford Blockchain Strategy Framework (OBSF) helps you understand whether
    you need a blockchain, and in what part of the business system a given technology
    is situated


    ◆ Best practices of effective regulation can help you assess and/or design the
    regulatory context


    In understanding blockchain’s impact on incumbent systems, and how to evaluate
    new blockchain technologies, my colleagues and I have generated a series of frameworks
    to understand strategy and regulation with respect to blockchain.


    Meltem Demirors, a frequent collaborator, and co-creator of the Oxford Blockchain
    Strategy Programme, has crafted the Oxford Blockchain Strategy Framework.


    Blockchains operate within a complex network of interconnected participants, and
    blockchain companies (not all of whom curate their own protocols) fit somewhere
    within this ecosystem.


    ### **DO YOU NEED A BLOCKCHAIN?**


    The first set of steps we take our students through in assessing a business use
    case is to figure out whether the business needs a blockchain – or, indeed, any
    variant of distributed ledger.'
