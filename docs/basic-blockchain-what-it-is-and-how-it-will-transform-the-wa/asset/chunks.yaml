    adopting new and different approaches to getting groups of individuals to move
    in a coordinated fashion.


    ### IT TAKES A VILLAGE


    Open-source computing was born out of frustration over the growing corporatisation
    of computer software development. A number of the original hackers who helped
    shape computer technology came from a laid-back, almost hippie counter-culture
    of the United States of the 1960s and 1970s. One such figure, computer scientist
    Richard Stallman,[^(47)](#bm05.html#en47) wanted to implement a simple workaround
    for a common problem: when a shared printer jams, send a message to everyone in
    the group, so someone can fix it. He discovered that the software for their new
    laser printer was ‘closed’ and was proprietary – prohibiting modification. This
    and other efforts to restrict information led him to create an open operating
    system, and help birth a movement.[^(48)](#bm05.html#en48)


    Stallman was followed in the 1990s by Eric Raymond, whose essay ‘The Cathedral
    and the Bazaar’ served as a call to arms for what he began to term the ‘open-source’
    software movement, accompanying the release of his open-source operating system
    `Linux`.[^(49)](#bm05.html#en49) With open source, the source code (written instructions)
    of the software is openly published for anyone to use for free. The social contract,
    however, is that if you make improvements, you need to publish those improvements
    back to the code so that others can take advantage of them. Instead of the proprietary
    software licensing model of companies like `Microsoft`, open-source companies
    like `Red Hat` made their money from selling services and solutions to enhance
    the open-source software implementation.


    This has led to some large-scale projects, hosted on shared repositories like
    `Github`, with thousands of software developers around the world adding to the
    code and enhancing the code base for the benefit of the many. The MIT License
    is one of the most popular open-source software licences extant today – a commonly
    understood legal framework for how to manage intellectual property rights that
    accompany software projects.


    Decisions about what gets accepted into an open-source code library are determined
    by the project creators. The three most common models, according to the Open Source
    Guide,[^(50)](#bm05.html#en50) are:


    *   **Benevolent Dictator for Life**: one individual, typically the one who came
    up with the project, makes key decisions

    *   **Meritocracy**: people who make a meaningful contribution to the project
    make the key decisions and hold votes to implement changes

    *   **Liberal Contribution**: the most active current contributors drive the process,
    and it is a process of consensus building (rather than a pure vote) that implements
    change


    These different models of managing open-source projects are often considered and
    applied to blockchain projects, themselves often open-source.


    ### BLOCKCHAIN DEADLOCKS


    Variations on meritocracy and liberal contribution have been used in numerous
    blockchain projects, including `bitcoin`. Both resulted in the unexpected consequence
    of the hard fork as an output of the democratic decision making behind blockchain
    governance, as we discussed in [Chapter 1](#chapter01.html).


