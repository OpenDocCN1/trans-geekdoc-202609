    # Payments


    Payments may or may not be a requirement of your blockchain. If you are creating
    a private blockchain to manage the transfer of patient medical record data, or
    you are creating a government blockchain to handle digital identity files, you
    might not need a payment capability (note I said ‘might’, since I can envision
    multiple circumstances in which you could need payment capabilities in either
    of these examples provided). If you are running a blockchain to enable cross-border
    remittances, by definition you are going to need a payment functionality. But,
    going back to our overall protocol design considerations, perhaps Ripple can provide
    that payment rail, or bitcoin. These are all decisions that need to be factored
    into your evaluation of the protocol layer.


    ## Network layer


    The infrastructure of your blockchain lives in the network layer, which is built
    around the nodes onto which your blockchain is loaded. Do you have restrictions
    or requirements on who runs a node? Can anyone write to your blockchain, or is
    it limited only to certain trusted parties? How will this blockchain be integrated
    with other technology, such as a corporate IT system?


    Your network layer will also address issues around storage. How will old copies
    be archived? Are you subject to privacy regulation such as GDPR? If so, how do
    you address privacy with an immutable record? One approach on the GDPR front is
    to store sensitive private data off-chain, and only house a pointer (a piece of
    code that tells you where to look for the rest of the data, pointing at it) housed
    on the blockchain or ‘on-chain’. If someone elects to be forgotten, you wipe the
    off-chain data, so the pointer is now pointing to a string of nonsense characters.


    ## Application layer


    At the application layer, our software directly comes into contact with the end
    users. Who is actually interacting directly with your blockchain?


    You also need to look at how the new blockchain will become part of your daily
    workflow. How is the organisation structured today? How are users behaving before
    it is launched? How will users need to change their behaviour to work with your
    blockchain, if at all?


    We get into the realm of technology adoption and change management at this layer.
    If you do need to effect either organisational or individual user behavioural
    changes, what is your plan of transition to take them from the old way of behaving
    to the new?


    ## REGULATION


    Regulation is inescapable in the realm of blockchain.


    If you deal in cryptocurrencies, digital currencies, digital assets, securities
    tokens, utility tokens, coin offerings and digital asset exchanges, you need to
    be able to identify and understand the ‘rules of the road’ for a particular domicile
    in which you are seeking to do business, or you will face serious risk of government
    intervention. Regulators have now become sensitised to the nuances of blockchain.


    There is the opportunity to proactively shape an ecosystem through the judicious
    application of regulation, perhaps with greater impact at scale. In a number of
    domiciles around the world, regulators are examining the regulatory shortcomings
    of their respective countries, and standing up pilots and policy interventions
    that can advance their strategic objectives.


    At this point it is worth discussing the merits of principlesbased regulatory
    systems versus rules-based regulatory systems.


    ### Principles-based regulatory systems


    With principles-based regulation, rules are articulated in broad strokes so that
    their interpretation is somewhat flexible. The overall goals of the regulation
    are patent. How it gets applied, both by the companies and by the regulators,
    becomes more of a dialogue between the parties and an application of art rather
    than science. Principles-based regulation allows for a more flexible framework
    that can be adapted to different circumstances and different levels of regulatory
    competition.


    When innovation strikes, as with blockchain, innovative companies engage in a
    practice known as ‘domicile shopping’ as they seek out the optimal regulatory
    regimen to propel growth. In blockchain, small and nimble countries like Mauritius,
    Bermuda, Barbados and Malta have enjoyed outsized rewards by showing regulatory
    flexibility, both in adapting existing regulations to new technology and in promoting
    new pro-innovation regulation. Principles-based regulation also requires sophisticated
    regulators and compliance professionals at companies to navigate this interpretive
    path.


    ### Rules-based regulatory systems


    Rules-based regulation sets out remarkably clear activities that must take place
    in order to achieve compliance. The individual rules are apparent, but creating
    a generalisable framework that can apply broadly and that ties to regulatory goals
    is a more arduous task. How can regulators stitch together a patchwork quilt of
    highly specific rules that ensure outcomes like greater financial inclusion or
    financial stability? Rules-based regulatory systems are easier to understand,
    insofar as a market participant follows a checklist to make sure he or she is
    in compliance, but very slow and prone to inertia when faced with innovation.
    Blockchain is still in an evolutionary phase, and its various derivations and
    the business ecosystems surrounding it are changing rapidly. Rules-based systems
    are ill-suited to engage with blockchain.


    ### Regulatory primitives


    Our first consideration is to look at regulatory primitives, the ideas that serve
    as the underpinnings of effective regulation in a variety of domiciles.


    If you are an innovator faced with regulation, you serve yourself well to decode
    the primary objectives of the regulator and work out how to showcase your alignment
    with the desired regulatory outcomes. If you are a regulator, you should more
    readily identify which key objectives you are achieving with your regulatory intervention.
    A proactive and strategic approach by a regulator incorporates clear planning
    about outcomes. An effective regulator might say, for example, ‘We want to have
    80 per cent of our population provisioned with a digital identity by 2025, up
    from 20 per cent today, and will use blockchain as an enabling technology to reduce
    cost and improve data sharing across institutions.’ This might then lead to a
    specific intervention such as the government establishing a set of standards around
    blockchain-based digital identity that private identity providers could seek to
    comply with, to serve the market need.


    The elements of a framework approach are:


    1. Focus on outcomes

    2. Protect all stakeholders

    3. Foster trust

    4. Balance competition

    5. Promote innovation


    #### 1) Focus on outcomes


    Can you identify the desired outcomes of the given piece of regulation? Are they
    readily measurable? How can you align the specific behaviour of a market participant
    with the target outcome of the regulation?


    #### 2) Protect all stakeholders


    All parties, not just the primary market participants, need to be protected. This
    encompasses consumer protection as well as providing support for enterprise.


    #### 3) Foster trust


    Trust and transparency must be encouraged through regulation in order to enable
    stability. When consumers have greater trust it leads to a robust and healthy
    financial system. Trust in institutions leads to job creation, capital investment
    and foreign direct investment.


    #### 4) Balance competition

