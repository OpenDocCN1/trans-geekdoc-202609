    and the Bazaar’ served as a call to arms for what he began to term the ‘open-source’
    software movement, accompanying the release of his open-source operating system
    Linux.[^(49)](#bm05.html#en49) With open source, the source code (written instructions)
    of the software is openly published for anyone to use for free. The social contract,
    however, is that if you make improvements, you need to publish those improvements
    back to the code so that others can take advantage of them. Instead of the proprietary
    software licensing model of companies like Microsoft, open-source companies like
    Red Hat made their money from selling services and solutions to enhance the open-source
    software implementation.


    This has led to some large-scale projects, hosted on shared repositories like
    Github, with thousands of software developers around the world adding to the code
    and enhancing the code base for the benefit of the many. The MIT License is one
    of the most popular open-source software licences extant today – a commonly understood
    legal framework for how to manage intellectual property rights that accompany
    software projects.


    Decisions about what gets accepted into an open-source code library are determined
    by the project creators. The three most common models, according to the Open Source
    Guide,[^(50)](#bm05.html#en50) are:


    ◆ **Benevolent Dictator for Life**: one individual, typically the one who came
    up with the project, makes key decisions


    ◆ **Meritocracy**: people who make a meaningful contribution to the project make
    the key decisions and hold votes to implement changes


    ◆ **Liberal Contribution**: the most active current contributors drive the process,
    and it is a process of consensus building (rather than a pure vote) that implements
    change


    These different models of managing open-source projects are often considered and
    applied to blockchain projects, themselves often open-source.


    ### **BLOCKCHAIN DEADLOCKS**


    Variations on meritocracy and liberal contribution have been used in numerous
    blockchain projects, including bitcoin. Both resulted in the unexpected consequence
    of the hard fork as an output of the democratic decision making behind blockchain
    governance, as we discussed in [Chapter 1](#chapter01.html).


    Indeed, if we look at bitcoin versus bitcoin cash, the former has a considerably
    larger market share.


    ### **ORGANISATIONAL DECISION MAKING**


    As we apply the lessons and formulae from open source and blockchain to the management
    of organisations, we see an outline emerging of what a responsive organisation
    of the future might look like.


    Why is this organisation needed?


    Technology adoption has been accelerating on a power law curve (basically, it’s
    getting faster and faster with each new technology). It took a century for the
    telephone to reach 80 per cent of the US market. It took about two decades for
    the World Wide Web to get to similar levels. It took only a couple of years for
    mobile internet to achieve the same penetration. By some measures, the ascent
    of bitcoin was even faster.


    As the pace of change accelerates, we run into the fundamental challenge that
    the way we organise ourselves, in groups and companies, isn’t keeping up with
    the kind of decision making, creativity and flexibility that is needed from such
    structures in the face of a rapidly evolving technological environment. If a large
    organisation takes a year to study how to reorganise itself around a new opportunity,
    a year or two to act on those changes, and a year to absorb how to operate in
    the new structure – three or four years in total – how can it possibly address
    the next technology that might achieve widespread adoption in as little as twelve
    months? In three months? How did we wind up in such a state of rigidity and sluggishness?


    Starting in the 1700s, the steam engine, a technology first conceived of by the
    ancient Romans, was perfected for mass adoption. This fuelled the Industrial Revolution
    that created empires and brought new models of affordability and prosperity to
    millions around the world. The organisational systems that were developed to cope
    with this era of highly scalable production gave rise to a command-and-control
    architecture, with one big boss at the top and armies of workers in highly specialised
    roles underneath.


    Taylorism reigned supreme.[^(51)](#bm05.html#en51) Henry Ford’s assembly line
    turned out millions of cars in the early part of the twentieth century, happily
    replicating vehicles through highly specialised manufacturing, one of the most
    prominent examples of ‘mass production’ with a highly stratified organisational
    model.


    ### **OUT OF CHAOS, THE NEW WORLD ORDER**


    The Second World War brought about innovations in organisational design. The German
    High Command evolved into a ‘general staff’ model where a council of senior officers
    had defined areas of responsibility and a reasonable scope of authority and autonomy
    within that. Yet even with this we still see a command-and-control mindset. The
    generals had a level of autonomy in their decision making, but individual foot
    soldiers were still cannon fodder. ‘I was just following orders,’ became a common
    defence at the Nuremberg Trials.


    On the US side, a bit of frontier spirit and invention prevailed. As German Admiral
    Karl Dönitz said, ‘The reason that the American Navy does so well in wartime is
    that war is chaos, and the Americans practise chaos on a daily basis.’[^(52)](#bm05.html#en52)
    He may have simply been faced with unfamiliar patterns of action which he failed
    to recognise. Some in the German military dismissed America’s role in the Allied
    victory as merely providing numerical superiority, hearkening to an indictment
    of General Erich Ludendorff’s earlier First World War strategic failures, that
    the Americans were simply able to produce soldiers faster than Germany could produce
    bullets.[^(53)](#bm05.html#en53) However, some military historians point to the
    conscious encouragement by American forces of inventiveness, local-group initiative
    and autonomy as a contributing factor to Allied success. Psychologists were recruited
    into the US military, and began screening special operations troops for creativity
    and improvisation skills.[^(54)](#bm05.html#en54) Indeed, the US Marine Corps
    has adopted the informal motto of ‘Improvise. Adapt. Overcome.’'
