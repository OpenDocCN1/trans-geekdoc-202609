  trans: '


    即使是像了解医生是谁、他们的资质如何以及他们接受哪些商业保险（这在美国市场尤为重要）这类看似简单的问题，在今天也面临着数据质量、时效性和可用性的问题。我曾经营过一家公司，其产品能够维护医生地址及其他联系信息、他们接受的保险以及所拥资质的最新记录。所有这些内容通过正确的分布式账本，都可以在很大程度上或完全实现自动化。


    ### 公共卫生


    可以通过区块链改善人群健康状况。虽然需要保护患者隐私，但也有需要考虑公共利益的问题。对于流行病学家来说，能够跨大规模患者群体访问医疗数据元素是极其理想的，这样他们就可以评估发病率和死亡率数据，并进行人群健康干预。通过应用正确的区块链协议，疾病注册可以变得更具动态且易于管理，并具有更好的数据治理。


    ### 医疗研究


    在健康服务之外的更广泛的健康领域，即生物技术、制药研究和更广泛的医学研究中，机构仅发布正面结果的情况并不罕见。但负面数据更具有启发意义，因为有助于避免浪费并加速药物或设备的开发。目前，还没有一种有效的、大规模的机制来强制制药公司或生物技术公司分享失败数据或任何临床数据。通过区块链技术的某些变体，特别是带有秘密共享的多方计算，可以实现在不同患者数据集之间交换匿名化的关键数据元素，而不会暴露会导致竞争或隐私问题的信息。这方面的细节超出了本书的范围，但在我们之前提到的书籍《可信数据》（*Trusted
    Data*）以及 2016 年的白皮书《区块链与健康 IT：算法、隐私与数据》中有所涉及。


    同样，区块链和令牌可以提供一种临床研究的新模式，在这种模式下，我们可以自动捕获患者参与研究的同意（这是一个昂贵且耗时的管理过程），并通过数字令牌为患者提供参与的激励，从而促进其为试验贡献数据。


    这进入了更广泛的真实世界证据（real-world evidence）类别，这是制药和生物技术行业长期生存的关键投入，使患者在药物上市后仍能同意将其数据用作研究的一部分。当药物或产品出现新问题时，相关或受影响的患者可以被分配或移动到研究中，而无需启动新试验、等待数据收集，并在多年后分析结果。临床数据获得了一个“时光机器”，实际上让它按下了倒带键，让医生能够通过不同的患者参与模型回到过去对患者数据提出不同的问题，而无需重新招募患者或重新试验。


    因此我们看到，通过区块链的应用，应急（紧急/急诊）和慢性（反复门诊/住院）环境下的患者旅程都可以被准确追踪，并提升患者的体验。在个人层面，预防性和干预性的医疗保健都取决于数据的获取（例如患者的生命体征、病史）、数据的解释（诊断）以及随时间推的进度记录（生命体征、实验室检查等）。但在更大规模上，由于涵盖竞争和监管领域的各种原因，有关人群健康和临床研究的关键信息仍然被困在无法访问的形式中。


    数字健康领域开始出现的数据密集型应用共享一个共同中心——患者，但遗憾的是，这些应用将此类数据的存储碎片化为孤岛。医疗领域的区块链可以将这些分散的信息内聚性在一起，以改善个人和社会的利益。在某些国家的法律压力下，数据孤岛开始部分开放，但同时全球医疗模式正在进化，从许多国家的基于交易的模式转向更倾向于持续护理的模式。


    一些大胆的远见者设想了一个正如 Burst IQ 的 Frank Ricotta 所说的“迈向以人为中心的模式的转折点”，在这里，消费者健康的各种元素（如
    DNA 测试公司 23andMe 提供的服务和其他量化自我产品）与精准医疗、人工智能、连接设备相结合。


    在这种范式下，区块链可以作为一种传输和存储网络，使医疗碎片顺畅协作。区块链还可以为数据质量提供评分。例如，医院用高端设备测量的心率比 Apple Watch
    更准确，但消费设备几乎一直跟随，因此提供了更全面的观察。健康数据量呈指数级增长，区块链结合可以为患者信息带来秩序。


    ### 概述


    在本章中我们涵盖了：


    - 个人健康数据与区块链的关系

    - 临床护理等领域通过区块链实现的特定机遇

    - 利用区块链作为新型以人为中心模式的变革性机遇


    ### 第 6 章


    ### 能源与食品


    #### 你需要了解的


    - 区块链可以帮助详细了解某物的来源及其使用方式，这被称为溯源（provenance）

    - 在能源领域，这可以增强能源的生产和交付，并使其相关的金融市场更高效

    - 在食品领域，这既可以增强食品安全，也可以改善农民的经济状况


    能够建立溯源是不可篡改账本具有清晰历史的一大优势。溯源简单来说就是追踪某物的来源，以及在不同时间点谁拥有过它。


    例如，冲突钻石产自战乱地区，最常见于撒哈拉以南非洲某些国家。它们的销售被用于资助进一步的流，因此获得了“血钻”的称号。珠宝行业已同意一套标准，以证明特定宝石的开采地并确保它不是支持战争的剥削产物。物理商品被还原为编号资产、数据，在一个信息可靠性和透明度重要的领域——我们希望确保刚刚购买的结婚戒指不是用奴隶劳动制造的，也没有支持种族灭绝。区块链系统可以提供宝石溯源的真实记录，追踪从生产到销售的所有权。同样，艺术也是一个依赖溯源作为资产价值和管理市场，是另一个开始尝试区块链的行业。


    奢侈宝石是一个小众但规模巨大的市场，年销售额超过 160 亿英镑。溯源和透明度在全球范围内总额超过 12 万亿美元的另外两个领域中同样重要，甚至更为重要。


