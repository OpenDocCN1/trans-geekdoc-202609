    ### Financial services


    #### WHAT YOU NEED TO KNOW


    - Services businesses operate across data streams, and blockchain can make them
    more efficient

    - Financial services businesses can unlock new capabilities and improve efficiency
    by using blockchain, to the benefit of commerce and of society

    - These applications span both consumer-facing and institutional-facing domains


    Companies in the financial services sector are data-intensive businesses that
    benefit directly from the application of distributed ledgers. There are a number
    of natural use cases for blockchain, and some of the earliest lessons about how
    to deploy blockchain and what its limitations are have come from pilot projects
    and deployments in financial services. The economic stakes run into the trillions
    of dollars annually, and the potential benefits of applying blockchain could include
    new heights of efficiency, cost reductions and quality improvements to the services
    offered by financial institutions.


    ### THE SERVICES LAYER


    Services businesses employ systems that deal with information flow, tracking and
    management of human activity, and attribution of economic benefit. Developed countries
    have seen their economies shift from a reliance on manufacturing during the Industrial
    Revolution to a primarily service-based economy in the modern era. Financial services,
    health services and hospitality services can make up more than half of GDP in
    these countries. Emerging economies are increasingly seeing more and more economic
    output from the service industries.


    The financial services industry can trace its antecedents back centuries. The
    invention of writing is traceable to 3200 BCE, when the cuneiform script emerged
    from the need to record financial transactions in a clay ledger. The King James
    Bible also refers to moneylenders and temples – more than two thousand years ago,
    society was already struggling with regulation and trust when it came to bankers.
    Modern finance was born out of cross-border trade and the Age of Enlightenment,
    with the London Stock Exchange playing a key role in the ‘shadow banking’ system
    of the Victorian Age (nonbank financial institutions operating outside of the
    regulated banking system). Throughout its history, financial services has been
    predicated on intermediaries and record keeping, with varying degrees of trust
    amongst parties and a desire for greater transparency that traditional financial
    record keeping has always struggled to satisfy. It is no wonder that blockchain
    technology was developed as a response to the failures of the contemporary financial
    system, and why the largest investments to date in blockchain technology have
    related to improving or usurping the current financial structures.


    ### EXPERIMENTATION WITH BLOCKCHAIN


    Financial services has been at the epicentre of blockchain experimentation and,
    increasingly, blockchain deployments. These experiments are motivated by the complexity
    of financial services itself, driven by the fact that the industry is riddled
    with layers upon layers of intermediaries. Financial institutions are also bedevilled
    by antiquated processes that have been transferred from manual to digital form
    without re-engineering the fundamental operational function behind the process,
    and blockchain can be used to reshape these processes. Financial services firms
    are highly incentivised to implement new technology that can improve margins and
    competitiveness.


    Broadly speaking, we can divide blockchain activity in financial services into
    internal or infrastructural applications, and external- or market-facing applications.
    But there is another lens too, one that looks at institutional or consumer applications
    as well.


    #### Consumer-facing applications


    Blockchain began with a public-facing application, bitcoin. If we step back and
    think about the broader category of digital currencies, a number of interesting
    implications emerge.


    ##### Currency


    The provocative concept of removing currency from government control will increase
    trust among consumers who don’t trust the government. Indeed, when some government
    currencies have experienced monthly inflation rates of 100 per cent or more, one
    understands the appeal of finding something other than existing fiat to serve
    as a store of value (a way to save an asset, keep it somewhere, and then access
    it later). The idea behind cryptocurrencies such as bitcoin is that in theory
    they are not subject to external pressures such as political pressures. However,
    if you look at the volatility of blockchain-based currencies – cryptocurrencies
    – it might be difficult to pay for food or rent when your store and transfer of
    value fluctuates several hundred cent over a few months. Bitcoin prices change
    up and down with great rapidity and without a direct link to the economic productivity
    of a particular country or region. This lack of correlation makes it somewhat
    interesting alternative asset for investors, but not a great way to pay workers
    who rely on stable prices to pay rent and buy food.


    We will touch further on central bank digital currencies (CBDCs), a different
    variation on e-money, when we consider government applications of blockchain in
    Chapter 10.


    ##### Payments


    Other consumer applications of blockchain in financial services include payments
    and cross-border remittances. Particularly in emerging markets, moving money across
    borders could cost 10 to 15 per cent of the transaction value. This effectively
    acts as a ‘poor tax’ levied on people living in emerging economies than someone
    who is wealthier. With the advent of payments and remittance systems that ride
    on blockchain rails, we now see costs plummeting below 1 per cent.


    Consumers can also now directly transfer payments to each other using a blockchain
    network, so-called ‘peer-to-peer’ payments, without the intermediation of a bank,
    transfer agent or another financial services institution. These transactions take,
    at most, a few minutes instead of the days that it takes the conventional financial
    system. Given that volume on more conventional rails such as Paypal’s subsidiary
    Venmo is accelerating well past 100 billion total payment transactions per year,
    blockchain’s lower cost and higher speed offer a compelling value proposition
    with direct and immediate benefit to consumers.


