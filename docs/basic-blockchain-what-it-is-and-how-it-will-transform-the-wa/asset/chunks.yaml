    ![Illustration](images/cover.jpg)


    `David L. Shrier` is a futurist and globally recognised authority on financial
    innovation. He has published multiple books on blockchain, fintech and cybersecurity.
    David’s current academic appointments include Associate Fellow with the Saïd Business
    School, University of Oxford, and Lecturer at the Massachusetts Institute of Technology.


    David created and leads the University of Oxford’s online programme `Oxford Blockchain
    Strategy`, a revolutionary approach to accelerating new blockchain ventures in
    a distributed digital environment.


    ‘David, a long-time expert in fintech, makes it easy for the average business
    executive to understand blockchain. He then shows us some of the exciting possibilities
    that could one day create trillion-dollar industries’


    — `Chris Larsen`, founder and chairman, `Ripple`


    ‘`Basic Blockchain` is a must-read for anyone who wants to get an understanding
    of this emerging and disruptive technology. It is pitched at the busy executive
    or public service employee who knows that they should understand blockchain technology
    and its applications, but just hasn’t been able to set aside the time to fully
    grasp it . . . It’s a quick read that anyone can finish during the time it takes
    to fly from JFK to Bermuda. Well done, David’


    — `The Hon. David Burt, JP, MP, Premier of Bermuda`


    ‘David has brought blockchain to life, driving insights into how to use it to
    promote transparency and efficiency. I found it helpful as I think through optimizing
    management of a $110 billion investment portfolio’


    — `Randy Brown`, Chief Investment Officer, `Sun Life`, and Head of Insurance Asset
    Management, `SLC Management`


    ‘Blockchain is already part of our everyday life. Its promise to reinvent the
    concept of trust and create optimal governance systems for the brave new data
    economy is ground-breaking. The distributed ledger’s utility is to strengthen
    us as citizens and customers. David Shrier’s `Basic Blockchain` is an essential
    tool for those looking to distinguish information from noise . . . It is a complete
    and reliable guide for policy makers, regulators and business leaders who need
    to make informed decisions beyond the hype’


    — `Eva Kaili`, MEP and chair of the Committee for the Future of Science and Technology


    ‘Blockchain could transform everything from financial services and currencies,
    how we process payments, insurance and medical records to government and the application
    of law. Shrier clearly illustrates the game-changing role blockchain could play
    in all kinds of activities and businesses. `Basic Blockchain` is an excellent
    and visionary outlook of what a better future could look like’


    — `Jaime Bermudez`, Managing Partner, `Lazard`, and former Minister of Foreign
    Affairs, Government of Colombia


