    In the case of [SETI@home](mailto:SETI@home), astronomers were trying to decipher
    radio signals gathered by sensors to see if there were patterns indicative of
    alien life (SETI stands for the Search for Extraterrestrial Intelligence). Like
    many in academia, they were chronically underfunded relative to the scope of their
    ambition. As personal computers became more popular in the 1990s, researchers
    David Gedye, Woody Sullivan, Dan Werthimer and David Anderson got the idea that
    if you gave people a little bit of code on their computers, they would run it
    in the background when the computers were running but ‘idle’, and do a little
    piece of this complex analysis, strictly because they thought it was cool. Similarly,
    [Folding@Home](mailto:Folding@Home) wanted to perform a large number of molecular
    biology calculations about how proteins fold, in order to investigate new life-saving
    drugs. They, too, didn’t have the resources to purchase all the computing time
    they needed, so they crowd-sourced the calculations using distributed network
    computing, just like [SETI@home](mailto:SETI@home).


    So now we take that distributed computation idea from [SETI@home](mailto:SETI@home),
    and we apply it to creating a new currency. We incentivise people to participate
    in the calculations not with the noble ambition of finding intelligent aliens,
    but in order to make some money, literally and figuratively. Well, that, and to
    build an alternative to the conventional financial system, since the first users
    of blockchain tended to be idealists who wanted bitcoin to become an alternative
    to ‘fiat currency’ like the US dollar or the euro. Just because you make some
    money from an idea doesn’t mean you can’t be an idealist.


    With the built-in economics of mining attached to blockchain, we now have the
    incentives aligned for thousands of miners to participate in the network. But
    let’s say you are specifically interested in the financial currency application
    of blockchain (as opposed to another data management example). Let’s say that
    you don’t want an endlessly inflationary currency, where a monetary authority
    can simply print off more units. With bitcoin, Satoshi Nakamoto sought to make
    the currency valuable by making it scarce. He imposed a hard limit of 21 million
    bitcoin that could ever be created, embedding this limit in the very code itself.
    It also gets increasingly difficult to create (or ‘mine’) bitcoin the more that
    exists, so the supply automatically slows down its own increase as people create
    more of it. There is a finite supply, not unlike gold. This creates a certain
    logic such that in some countries, cryptocurrencies like bitcoin are regulated
    like commodities, such as gold, rather than like currencies.


    ### CRYPTOCURRENCY


    OK, so now we’re on to a big idea. You could say that digital currency is just
    bits and bytes, so you can just create more. You could also say that when, for
    example, the US government wants more money, they just print more dollars. The
    dollar isn’t linked to any other commodity, it’s just worth whatever people are
    willing to accept it as, backed by the ‘full faith and credit of the American
    government’, whatever that means in the minds of the people who accept dollars.
    Instead of dollars, now let’s imagine a group of computer programmers created
    a currency that is ‘minted’ on servers. Because it’s secured using cryptography,
    let’s call this kind of digital money a ‘cryptocurrency’.


    Recall the trust-starved times in which bitcoin was born, the widespread disillusionment
    with the conventional financial system and with conventional institutions more
    broadly, such as government and corporations. Satoshi Nakamoto wanted something
    that had a finite amount, like gold, rather than something that could be infinitely
    created, like the dollar. He built into the code of bitcoin itself a few clever
    elements that turn it into a digital currency with scarcity value.


    For one thing, there’s a built-in limit on the total number of bitcoins that can
    be mined, ever. It’s about 21 million. These bitcoins are being created through
    the calculation of new blocks in the bitcoin blockchain. The speed with which
    new bitcoin is created via mining is slowing down on a curve. Theoretically, unless
    a group of a few hundred developers known as the ‘bitcoin core’ decide to create
    new computer code, and the group of people who control bitcoin servers effectively
    vote to accept a change in the software by uploading this new code, we will hit
    that limit and then bitcoin can appreciate in value due to its scarcity.


    Just to make things more interesting, it’s believed that more than 10 million
    bitcoin have been lost forever. Perhaps you forgot your cryptographic keys to
    unlock your money, or you threw out the computer that had the data on it. Satoshi
    Nakamoto doesn’t seem to be spending his initial batch of bitcoin. So now the
    actual tradeable universe of bitcoin is much smaller, perhaps a total of 11 million,
    ever.


    And unlike Beanie Babies, a collectible fad from the 1980s that bitcoin has been
    disparagingly compared to, bitcoin does have value beyond simply the fact that
    it has a certain scarcity. It can be used to reduce frictions in the financial
    system, like cross-border money transfers – instead of paying a 15 per cent fee
    to transfer money into Kenya, using a bitcoin system you might pay 1.5 per cent
    or even 0.15 per cent, by removing multiple layers of middlemen and antiquated
    money transfer technology. I will argue that there is, at least today, a non-zero
    value attached to bitcoin. I can’t tell you if it’s worth £20,000 per coin, or
    £1,000, or £100, but today it’s worth more than £0.


    Other cryptocurrencies have been created following this model of scarcity. At
    the time of writing, the nominal market cap of all of these digital tokens is
    in the hundreds of billions of pounds in equivalent value. I always have to be
    careful about writing on the value of crypto; bitcoin was worth £7 billion when
    I wrote my first book in 2016, more than £400 billion when I was giving a talk
    in the autumn of 2017, and now is hovering around £150 billion when you combine
    bitcoin `BTC` and bitcoin cash `BCH`. By the time you read this book it’s going
    to be different (no, I don’t know if it will be higher or lower).


    I recognise that I’m also describing a structure that could be used for Ponzi
    schemes: people who are already in the network make money from new people coming
    into the network. And in fact, Italian researchers Massimo Bartoletti, Salvatore
    Carta, Tiziana Cimoli and Roberto Saia investigated over 1,500 blockchain token
    offerings in 2017, and determined that more than 10 per cent of them were true
    Ponzi schemes. Some in the community have expressed surprise to me that the percentage
    is so low, and stories abound of abuse.


    As with many other new technologies, the creation of economic value has also attracted
    con artists who seek to profit from the excitement and confusion about what the
    technology is actually capable of and how to monetise it. This doesn’t invalidate
    the opportunity of the technology more broadly, but it does introduce a reason
    for caution if you plan to speculate financially on blockchain-related assets.
    *Caveat emptor*. Do your due diligence.


    ### SECURITY

