- fmt: '

    For about forty years, the improvisational lessons learned on the battlefields
    of the Second World War were lost in the boardroom, despite the fact that this
    kind of improvisational problem-solving happens to be highly similar to the mode
    of thinking and behaviour of an innovative, high-performing team.


    Mega-corporations like `IBM`, `Xerox` and `Exxon` replicated a command-and-control
    structure with a rigid and fixed org chart. The term ‘organisation man’ grew to
    describe a particular kind of groupthink, where ‘yes men’ reinforced whatever
    decisions were made at the very top.


    With the introduction, between the 1970s and the 1990s, of microcomputers, better
    communications networks, outsourcing, business process engineering and de-conglomeratisation,
    and the pace of business accelerating from years to months to weeks to days to
    hours, new organisational models arose.


    ## ENTER THE MATRIX


    Matrix management added flexibility . . . and confusion. In matrix management,
    the conventional organisational chart would be set aside when a particular project
    need arose. People would be recruited from across the organisation and put under
    the direction of an individual who did not necessarily write their annual performance
    review, but was tasked with guiding their work for that particular project. This
    enabled a business to more readily adapt to a new need and draw from across the
    organisation the necessary skills and talents required to address that need. Some
    matrixed teams endure for months or years; others are more ephemeral, existing
    merely for a matter of weeks.


    Information systems struggle to keep up with human systems and the perversity
    of human behaviour. By the time the central information technology group had re-assigned
    your data privileges and permissions so that you could work on that matrix-driven
    project, you had already returned to your home organisation. This informational
    friction has led to a number of cybersecurity failures, because it was more convenient
    for people to share passwords and logins than it was to go through the process
    to assign someone formal access for a short-term project – leading to unwitting
    holes in cyber protocol. `Edward Snowden`’s breach of the National Security Agency
    data systems was enabled in large part by his ability to convince more than two
    dozen colleagues to provide him with their security credentials under the guise
    of collaboration, stating he needed their credentials in his role as computer
    administrator. *Quis custodiet ipsos custodes?*


    Startup companies have to deal with an exceptionally rapid rate of change and
    respond accordingly. Many tend towards a loosely coupled management model with
    a high degree of individual autonomy and decision making. Trying to apply conventional
    data models to a rapidly-evolving startup creates a host of challenges.


    ## HOLA BACK


    ‘Holacracy’ is a form of management popularised by an American ecommerce company,
    `Zappos`. Led by `Tony Hsieh` and still operated at the time of writing with a
    high degree of independence even though owned by `Amazon`, `Zappos` trialled going
    a step further than matrix management. `Tony` wanted to do away with layers of
    management and coordination entirely. He proposed using something called ‘holacracy’,
    where self-organising teams and groups would attack challenges.


    The advantage of a truly empowered individual is a greater sense of ownership
    and personal responsibility for work and outcomes. Particularly for the millennial
    generation, who seek recognition and meaning in their work, the new concept of
    ‘holacracy’ holds a beguiling promise of relieving the drudgery of acting as a
    small cog in a very big machine.


    A completely democratic organisation that seeks to move with common purpose in
    a competitive environment will face severe challenges, particularly in times of
    crisis or stress. At the same time, large organisations are seeking to reinvent
    themselves for the high-velocity future by decentralising authority, granting
    greater decisional autonomy to individual business units and individuals, and
    using intelligent computer systems to tie together activity and action into a
    coherent whole.


    In `Zappo’s holacracy`, an internal jobs board lets teams post tasks and individuals
    post skills, creating an ability to dynamically allocate labour and empower people
    to highlight the training they require to broaden or deepen their capabilities.
    When I visited `Zappos` a few years ago and met with `Tony`, I saw both an organisation
    made up of people who exuded purpose and enthusiasm, and a leader who could see
    beyond the edge of the map.


    Holacracy is well suited to the open-source-inspired world of blockchain. And
    blockchain, in turn, can help make holacracy more viable. Information systems
    and data governance structures can adapt themselves – thanks to `smart contracts`
    and `DApps` and `AI` integration with distributed ledgers – to the dynamically
    changing needs and organisational structures of the institution.


    Properly constructed AI agents could help mediate this reconfigurable organisation
    across a blockchain, automatically adjudicating what today requires human intervention.
    Ordinarily, when you move from one group to another, or get assigned temporarily
    to a project team, IT needs to change the permissions information that determines
    what data you have access to and how you access it. This can sometimes take longer
    than the duration of the project you are working on. The right kind of AI engine
    can make this automatic. Data permissions can accompany this reconfiguration on
    the fly, allowing for better data security and better data utility at the same
    time. And in an era of distributed teams, widely dispersed across many geographies,
    tightly linked networked communications can facilitate nimbleness and smooth functioning.


    The organisation of the future may or may not live on a blockchain, but without
    question blockchain holds the potential to make that future organisation more
    effective. One of the challenges of decentralised decision making is the loss
    of coordination of activities. In complex systems this can lead to gridlock and
    chaos, as nobody knows what the rest of the organisation is doing or how their
    work fits in with the greater whole, sometimes leading people to work at crosspurposes.
    Relatively rapid dissemination of information, and coordination of information,
    can help address some of this chaotic behaviour and better conform it to a desired
    goal or outcome, such as completing a particular project on time and in synchronisation
    with a larger strategy.


    Transcending the organisational, the ability of blockchain to address multi-institutional
    concerns, spanning non-profit, individual, and for-profit actors, assumes greater
    import and impact. Whereas trading systems might have multiple parties all governed
    by a basic motive of profit, societal systems introduce multiple dimensions of
    sometimes-conflicting imperatives. `Part III` of this book looks at these multi-stakeholder
    systems and selects societal impacts of blockchain.


    ## PART III: COMMUNITY AND SOCIETY


    ![Illustration](images/line.png)


    ## CHAPTER 9


    ### Education


    **WHAT YOU NEED TO KNOW**


    ◆ Educational institutions have helped enable the blockchain revolution and continue
    to power it


    ◆ The central product of the university, the credential, can be improved with
    blockchain

