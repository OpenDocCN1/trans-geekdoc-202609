    嗯，在无信任系统中建立信任的方法之一，是让每个人都能看到每笔交易的记录，这种记录是不可篡改的。这让你对数据的完整性充满信心，这对于许多原因都很，例如确保有人确实向你转账了钱，以及如果我给了你数字美元，我不再具有在其他地方花费该美元的能力（即“双重花费”问题）。这种方法的理念是，对于物理货币，当我交给你一张纸币或一个硬币（一种物理令牌）时，你我都知道我不再拥有那笔货币，而你拥有了。在数字世界中，我可以简单地复制你的
    `1s` 和 `0s`，我们如何确保只有你拥有那个单位货币而我没有呢？在传统银行业，我们信任银行会很好地从我的账户中扣除一个单位并在你的账户中增加一个单位。


    如果我们不信任银行呢，就像 2008 年金融危机期间和之后的许多人那样？我们通过数学方法解决这个问题。我们创建了一个会计机制，一个高度安全的数据库，用来统计谁拥有什么，并确保我们从我的账户中取出一个单位并将其放入你的账户。


    Merkle trees（默克尔树）是一种有趣的数学方法，可以帮助建立不可更改的交易历史。通过 `Merkle tree`，你对一个数字进行一组计算。该方程的输出被用作第二组计算的输入。第二组的输出被用于第三组，以此类推。这意味着你无法在不对第三组产生影响的情况下更改第二组的任何元素；你无法在不改变第二组和第三组的情况下更改第一组，依此类推。这些不同的方程以树状的结构链接在一起。如果你看下面的图表并从底部开始向上操作，你可以看到单个数据元素是如何组合成这棵树的。


    ![Illustration](img/f0022-01.png)


    你无法在不让树顶随之掉落的情况下砍掉树的中间。因此，整个方程序列具有完整性，这是因为它们之间是相互链接的。


    如果我们把一组不相关的交易分在一起呢？Bill 给钱给 Susanna，Mari 给钱给 Fred，Davis 给钱给 Mohammad。这些人中没有人互相相认识。但这些不同财务交易的记录在数学上被打包成一个单元，或者说
    `block`。当你对该 `block` 执行加密计算时，你现在链接了这些交易，让你无法在不改变所有交易的情况下更改其中一个，因为它们都是该方程输出的一部分。


    ![Illustration](img/f0023-01.png)


    假设 Susanna 然后将她的部分钱发给了 Archie，Fred 把他的钱给了 Quentin，以此此类推，形成了一个新的 `block`。


    ![Illustration](img/f0024-01.png)


    你将 `block 1` 方程的输出作为计算 `block 2` 的数学的一部分。


    ![Illustration](img/f0024-02.png)


    通过将一个 `block` 的输出作为下一个 `block` 的输入之一，你最终将这些 `blocks` 链接在一起，形成一个 `Merkle tree`
    或链。

