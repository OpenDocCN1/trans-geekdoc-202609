    在过去的四十年里，尽管第二次世界大战战场中学获得的即兴应对教训在会议室中被遗忘了，但这种即兴解决问题的模式实际上与创新型、高性能团队的思维模式和行为高度相似。


    像 `IBM`、`Xerox` 和 `Exxon` 这样的巨型企业复制了僵硬且固定组织架构图的命令与控制结构。“组织人”一词逐渐演变为描述一种特定的群体思维，在这种思维下，“唯诺们”会强化高层做出的任何决策。


    随着 20 世纪 70 年代到 90 年代微型计算机、更通信网络、外包、业务流程工程以及去多元化的引入，商业节奏从几年缩短到几个月、周、天再到小时，新的组织模型应运而生。


    ## 进入矩阵


    矩阵管理增加了灵活性……也带来了困惑。在矩阵管理中，当出现特定的项目需求时，传统的组织架构图会被搁一边。人们将从整个组织中招募，并由某个人指导，这个人并不一定负责编写他们的年度绩效考核，但负责指导他们在特定项目中的工作。这使得企业能够更轻松地适应新需求，并从整个组织中提取解决该需求所需的技能和人才。一些矩阵团队可以持续几个月或几年；另一些则转瞬即逝，仅存在几周。


    信息系统难以跟上人为系统以及人类行为的反复无常。当中央信息技术部门重新分配了你的数据权限和许可，以便你能够参与那个由矩阵驱动的项目时，你已经回了自己的所属组织。这种信息摩擦导致了许多网络安全失败，因为对人们来说，共享密码和登录名比通过流程为短期项目分配正式访问权限要方便得多——这导致了网络协议中无意的漏洞。`Edward
    Snowden` 对国家安全局数据系统的入侵，很大程度上得益于他能够说服二十多名同事以合作之名提供他们的安全凭据，声称他作为计算机管理员的身份需要这些凭据。*Quis
    custodiet ipsos custodes?*（谁来守护守护者？）


    初创公司必须应对异常快速的变化并据此做出反应。许多公司倾向于松散耦合的管理模型，具有高度的个人自主权和决策权。尝试将传统数据模型应用于快速演变的初创公司会产生一系列挑战。


    ## 回应回来


    “合议制”（Holacracy）是一种由美国电子商务公司 `Zappos` 推广的管理形式。`Zappos` 在 `Tony Hsieh` 的领导下，写作时尽管被
    `Amazon` 所有但仍保持着高度独立运营，它尝试比矩阵管理更进一步。`Tony` 想完全消除层层管理和协调。他提议使用一种被称为“合议制”的东西，由自组织团队和小组来应对挑战。


    真正赋能个体的优势在于对工作和结果具有更强的所有感和个人责任感。特别是追求工作认可和意义的千禧一代，“合议制”这一新概念包含着迷人的承诺，能够缓解作为大机器中小螺丝钉的枯燥感。


    一个在竞争环境中寻求共同目标移动的完全民主的组织将面临严峻挑战，特别是在危机或压力时期。同时，大型组织正在通过下放权力、赋予各个业务单元和个人更大的决策自主权，以及使用智能计算机系统将活动和行动连接成一个协调的整体，为高速发展的未来进行自我重塑。


    在 `Zapo 的合议制` 中，一个内部招聘板允许团队发布任务，个人发布技能，创造了动态分配劳动力的能力，并赋能人们突出他们为拓宽或深化能力而所需的培训。当我几年前访问
    `Zappos` 并与 `Tony` 会面时，我看到了一个由充满目标感和热情的人组成的组织，以及一个能看到地图边缘之外领导者。


    合议制非常适合受开源启发的区块链世界。而区块链反过来可以帮助合议制更具可行性。信息系统和数据治理结构可以调整——得益于`智能合约`、`DApps` 以及 `AI`
    与分布式账本——适应机构动态变化的需求和组织结构。


    构建得良好的 AI 代理可以帮助跨区块链协调这种可重构的组织，自动判定哪些今天需要人工干预。通常，当你从一个小组移动到另一个小组，或被临时分配到某个项目团队时，IT
    需要更改决定你可以访问哪些数据以及如何访问数据的权限信息。这有时比你所工作的项目持续时间还要长。正确的 AI 引擎可以实现这种自动化。数据权限可以随这种重构实时调整，同时实现更好的数据安全和更好的数据利用。在一个分布于许多地理区域的分布式团队时代，紧密相联的网络通信可以促进灵活性和顺畅运行。


    未来的组织可能生活在区块链上，也可能不会，但无疑具有让未来组织更有效的潜力。去中心化决策的挑战之一是活动协调的丧失。在复杂系统中，这可能导致僵局和混乱，因为没有人知道组织的其他人在做什么，或者他们的工作如何与大局结合，有时会导致人们工作事背而驰。信息的相对快速传播和信息的协调可以帮助解决这种混乱行为，并使其更好地符合预期的目标或结果，例如按时并与大战略同步完成某个特定项目。


    超越组织层面，区块链解决跨机构问题（涵盖非营利、个人和营利参与者）的能力具有了更重要的意义和影响。交易系统可能有多个受利润这一基本动机驱动的方，而社会系统引入了多个维度的、有时冲突的指令。本书的`第三部分`将关注这些多利益相关者系统，并选取区块链的社会影响。


    ## 第三部分：社区与社会


    ![图像](img/line.png)


    ## 第 9 章


    ### 教育


    **你需要了解的知识**


    ◆ 教育机构帮助实现了区块链革命，并继续为其提供动力


    ◆ 大学的核心产品——凭证，可以通过区块链进行改进

