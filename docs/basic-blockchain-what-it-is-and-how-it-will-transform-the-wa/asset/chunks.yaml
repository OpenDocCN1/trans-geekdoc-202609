- fmt: '

    One example of how university education goes beyond sitting in a classroom is
    something known as a ‘hackathon’, where multiple teams of people compete over
    a short period of time to solve one or more defined problems. Hackathons are a
    staple of many technology and business educations. We even see them cropping up
    in the creative arts. From time to time, but with increasing frequency, we see
    the distributed hackathon, an event in which people based in various locations
    around the world work together to solve the same problem at the same time. There
    have even been hackathons featuring fully distributed teams – where no two people
    are in the same physical location – bringing diverse perspectives from diverse
    geographies and cultures.


    This notion of the distributed team in the educational hackathon increasingly
    resembles the future of work, where people might be brought together for specific
    projects and seek novel solutions. Whereas the conventional company might first
    address one market and country, and grow meaningful scale there before seeking
    to enter additional markets or geographies, a new generation of startups are attacking
    multiple countries and geographies simultaneously, at earlier and earlier stages
    of the company’s life cycle.


    How do we manage the information flow in these highly distributed entities? How
    do we navigate the nuances of intellectual property and ownership and decision
    making in the formative stages of a new venture? What about when these issues
    are compounded by distributed teams and disparate locales?


    Perhaps blockchain can offer answers – not to every challenge I’ve presented,
    but possibly to help achieve a more rapid means of reaching a communal decision
    on key issues, particularly in distributed environments. It could help establish
    the authorship of new ideas and some of the other aspects of new business formation.
    And as the university spin-out that is created from these ideas, perhaps ideas
    emerging from a hackathon, begins to raise money and achieve independence, blockchain
    can help manage the shareholders in new and fascinating ways. Echoing the distributed
    organisation we read about in the last chapter, higher-order shareholder governance
    could be navigated through the consensus algorithms of blockchain. Management
    might present key decisions not to a board of directors but to a distributed array
    of investors, who are able to rapidly reach a conclusion about a course of action
    through a computer-mediated network.


    ### IDEAS AND PEOPLE


    At their very hearts, universities have two products: ideas and people. Universities
    also frequently work with each other around these dimensions of ideas and people,
    through mechanisms like collaborative research projects or student and researcher
    exchange programmes. These kinds of activities serve to crossfertilise new fields,
    new thinking and new competencies. At the individual researcher or research group
    level, these are relatively seamless exchanges and commonplace. When the interactions
    assume greater scale, however, the inter-institutional dynamics become extraordinary
    sources of friction. Ownership of intellectual property (IP) and management of
    funding streams become rivers of delay, distraction and often destruction, making
    agreements impossible.


    These numerous contentious data streams of IP are tamed in a blockchain-enabled
    environment. Perhaps the multi-university collaboration of the future could be
    coalesced under a blockchain umbrella, with the nuances of idea flow and funding
    flow automated through algorithms and distributed ledgers.


    ### FROM ACADEMY TO SOCIETY


    In much of the developed world, some form of post-secondary education is common.
    Increasingly in the developing world, with the advent of better digital platforms
    and new forms of information distribution mediated by mobile communications networks,
    the potential for secondary education, and beyond, becomes ever more attainable
    for ever greater numbers of people.


    These networked communications and connectivity systems, that when coupled to
    blockchain permit audit, tracking, management and governance, form the millions
    of droplets that run together into the ocean of society. They arrive at a time
    when we find ourselves at a juncture in history where the institutions of democracy
    are under cyberattack, digital technologies such as Facebook have led to the fragmentation
    of the common discourse through which we form a cohesive state, and our trust
    in government is plummeting to lows typically seen in the past when societies
    are on the road to revolution. Ever widening gaps between rich and poor exacerbate
    the plutocratic effects of accelerated capitalism, with half a dozen individuals
    holding as much wealth as the poorest 50 per cent of the world’s population.


    Blockchain is entering its maturity at a pivotal moment in history.


    ### THE RUNDOWN


    In this chapter we covered:


    ◆ How key elements of blockchain were developed in academia

    ◆ The application of blockchain to verify and validate academic credentials

    ◆ The potential to shape new kinds of distributed university experiences using
    blockchain and other technologies, accelerating the journey to bring ideas to
    real-world impact


    ## CHAPTER 10


    ## GOVERNMENT


    ### WHAT YOU NEED TO KNOW


    ◆ Some of the sharpness of recent attacks on government institutions can be blunted
    by distributed ledgers

    ◆ One of the main instruments of government policy, the fiat currency, is being
    digitised through blockchain systems as Central Bank Digital Currencies (CBDCs)

    ◆ Government functions like law and tax are being reinvented in multiple countries,
    and blockchain technologies are central to the discussion


    Caught between the deafening peals of new technology and the demands of the populace,
    government stands at a transition point. Paradoxically, this disruption and discontent
    could give rise to a new age of enlightenment, much as the Industrial Revolution
    led to greater literacy and greater prosperity for more people in more societies.
    This only happened after a period of bloodshed and revolution and the displacement
    of millions of workers from lifetimes of drudgery. The illiterate starved and
    the literate grew into a new middle class. Are we at a similarly dramatic moment
    in history at this writing? What role can technology in general, and blockchain
    in particular, have in cushioning the shock of this societal evolution, or revolution?


    Human civilisation as we understand it is barely more than 10,000 years old. We
    formed hunting groups and tribes, and then city-states, nations and empires. In
    Ancient Greece, we advanced a notion that everyone had a vote in the decisions
    of the city state (as long as he was male, owned sufficient property, was over
    a certain age, etc.). And in forming the grand American experiment in representative
    democracy, in turn influencing the new French Republic in 1789 and others around
    the world, the progenitors of this government took their inspiration from Athens,
    even down to the architecture of the American capital in its Greco-Roman glory.


    Government `qua` government is, in one way or another, a representation of the
    will of the people. Governments that fail to adequately express this will sooner
    or later be replaced by governments that better express this notion. Arguably,
    by ignoring labour dislocation caused by automation, rightsizing, outsourcing
    and reengineering, the US and the UK created sufficient voter discontent to lead
    to Donald Trump and Boris Johnson assuming the leadership of their respective
    countries. Conventional candidates and politicians, they were not.


    ### ASIDE FROM DEMOCRACY . . .

