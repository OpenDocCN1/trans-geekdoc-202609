    ## Glossary (#contents.html#rbm03)


    **Algorithm**: A set of instructions for a computer program.


    **AML**: Anti-money laundering, refers to legal regulations.


    **Artificial intelligence**: A new system that combines people and machines.


    **Augmented reality**: Enhancing a human’s experience with digital data.


    **Big data**: Systems that deal with very large volumes, velocity and variety.


    **Bitcoin**: A kind of digital currency.


    **Blockchain**: A distributed ledger that uses a particular mechanism to ensure
    integrity.


    **Byzantine consensus**: A mathematical means of ensuring parties can trust a
    result without having to trust each other.


    **CBDC**: Central Bank Digital Currency – kind of cryptographically secured currency
    issued by a government.


    **Command-and-control**: A highly centralised form of management or governance.


    **Consensus**: An algorithmic mechanism to reach a decision among many parties.


    **Cryptography**: The mathematical discipline that allows plain text to be obscured.


    **DApps**: Distributed applications.


    **Derivatives**: Financial instruments that have their value based on other underlying
    assets.


    **Distributed ledger**: A database that has many copies that update each other.


    **Elliptic curve encryption**: A form of cryptography that is very efficient but
    secure.


    **Ethereum**: A blockchain protocol that provides an operating system.

