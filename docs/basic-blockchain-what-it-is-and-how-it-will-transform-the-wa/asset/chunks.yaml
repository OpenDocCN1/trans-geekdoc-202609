- fmt: '

    Some data is dauntingly big. When we think about the environment writ large, we
    think about air, water and soil on a global scale. Fine-tuned data on these axes
    would exceed the capacity of even the most powerful computers that exist today.
    There are acceptable workarounds, however, that reduce the impossible to the merely
    difficult. Weather forecasting, for example, is conducted on the basis of a series
    of compromises that approximate reality – you take a series of data points (rather
    than an infinite stream of continuous data), collected at various sensors, and
    then put them into a computer model that makes intelligent guesses about what
    is going to happen. Similarly, we can approach the introduction of distributed
    ledgers into environmental systems management in a step-by-step fashion.


    Weather, in fact, represents an interesting use case for blockchain. Currently,
    governments around the world fund the collection of critical weather data that
    is used in weather forecasting. Private-sector actors also generate weather data,
    sometimes from satellites. Private weather companies accumulate various data sources
    and generate forecasts that they sell. The UN administers an agency, the World
    Meteorological Organization (`WMO`), which coordinates the sharing of weather
    data by various countries. However, there are challenges when you mix publicly
    funded, ‘free’ weather data with fee-bearing private weather companies – incentives
    get misaligned. The issue of attribution becomes challenging, as does the issue
    of how to properly compensate micro-contributors of data whose various pieces
    go into making a more complex weather model. A tokenised system that incorporates
    smart contracts with encapsulated weather data on a blockchain could help provide
    appropriate attribution, and remuneration, to various contributors to a weather
    forecasting system.


    Another way in which blockchain can be involved in stewarding and managing the
    environment is with carbon credits. The carbon credit is a de concept that seeks
    to use market forces to mitigate environmental damage. In its simplest form, a
    carbon credit is built around some form of document that allows the owner to release
    one metric tonne of carbon dioxide or equivalent within a fixed length of time.
    The idea is that by limiting how much carbon can be generated, and attaching value
    to those limits, overall pollution will be reduced. While not without its detractors,
    the concept of carbon offsetting has gained meaningful currency in a number of
    sectors. And it relies on data, documentation, multiparty transactions that repeat,
    and intermediaries. The portable data elements that constitute a carbon credit
    or offset require traceability and exchangeability, which suits them well to blockchain.
    Indeed, a vibrant array of early experiments has sought to migrate the carbon
    credit market to DLT.


    Blockchain has other applications within the world of sustainability and the environment.
    For example, a number of companies have been accused of ‘greenwashing’, claiming
    to engage in environmentally friendly activities, or to be ‘greener’ than their
    competitors, but fail to provide robust, transparent evidence. The digital trust
    systems afforded by blockchain could improve the transparency and verification
    of environmental impact claims by corporations.


    Recursively, blockchain has raised concerns in certain circles regarding its environmental
    impact. Blockchain is designed to be highly secure, highly transparent and highly
    distributed. By its very nature, with hundreds or thousands of nodes constantly
    talking to each other and churning computer cycles in order to calculate blocks
    (or block equivalents, if a DLT like `Corda`), blockchain is highly energy intensive.
    It is one of the least efficient mechanisms of computing. There is the degree
    of irony in the sustainability, given the massive energy consumption.


    ### NATURAL RESOURCES


    Natural resources are worth approximately $100 trillion per year. The democratisation
    of natural resources is accelerating with the advent of. With interest rates dipping
    into the negative in a number of countries, gold is assuming a new lustre. It
    still suffers from the same problems it has always suffered from, namely those
    of security, portability, volatility and transferability – as well as the risk
    of confiscation. In response, a network of intermediaries and agents have arisen
    who assist with the acquisition, transport, storage and management of gold assets.


    Enter blockchain. From a traceability and transaction standpoint, blockchain offers
    a number of benefits when it serves as the foundation for a token backed by gold.
    Some of the efforts to create digital digital tokens are strictly tied to the
    value of gold by itself – so-called ‘pure plays’ – and sometimes linked to individual
    gold bars or coins. With the degree of traceability that blockchain allows for,
    you can create a fine level of specific information about the underlying asset.
    Some of the efforts to create digital currencies that embed commodity prices for
    some form of hedge stability, such as `Ven` or `Tradecoin`, use gold as one of
    their components. And a properly designed digital token that ties to gold, likewise,
    would enjoy similar stability.

