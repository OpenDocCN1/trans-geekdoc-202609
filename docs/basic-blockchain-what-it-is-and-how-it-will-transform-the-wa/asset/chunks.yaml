    在 SETI@home 的案例中，天文学家试图破译传感器收集的无线信号，以查看是否存在指示外星生命的模式（SETI 意为寻找地外智能生命）。与许多学术界人士一样，相对于他们的雄心规模，他们的资金一直匮乏。随着个人电脑在
    20 世纪年代变得日益流行，研究人员 David Gedye、Woody Sullivan、Dan Werthimer 和 David Anderson 产生了一个想法：如果你在人们的电脑上提供少量代码，他们在电脑运行但处于“闲置”时会在后台运行这些代码，并完成这项复杂分析的一小部分，完全是因为他们认为这很酷。同样，Folding@Home
    也希望进行大量关于蛋白质折叠的分子生物学计算，以研究新的救命药物。他们也没有资源购买所需的所有计算时间，因此他们像 SETI@home 一样，利用分布式网络计算众筹了计算。


    现在，我们从 SETI@home 获取了这种分布式计算的想法，并将其应用于创建新的货币。我们激励人们参与计算，并不是为了寻找外星生命这种高尚的雄心，而是为了赚钱——无论是在字面上还是比喻意义上如此。此外，也是为了建立一种传统金融系统的替代方案，因为区块链的首批用户往往是理想主义者，他们希望比特币成为美元或欧元等“法定货币”的替代品。仅仅因为你从某个想法中赚了钱，并不意味着你不能成为一个理想主义者。


    由于区块链内置了挖矿经济学，我们现在有了让成千上万矿工参与网络的激励。但假设你对区块链的金融货币应用特别感兴趣（而不是另一个数据管理示例）。假设你不想要一种无限通货膨胀的货币，货币当局可以简单地打印出更多单位。通过比特币，中本聪（Satoshi
    Nakamoto）试图通过使其具有稀缺性来赋予货币价值。他设定了总量最多为 2100 万个比特币的硬性限制，并将这一限制嵌入代码本身。随着比特币存量的增加，创建（或“挖矿”）比特币就变得越来越困难，因此当人们创建更多比特币时，供应的增长会自动减慢。它具有有限的供应，类似于黄金。这产生了一种逻辑，使得在某些国家，比特币等加密货币像商品（如黄金）一样受到监管，而不是像货币。


    ### 加密货币


    好了，现在我们遇到了一个大想法。你可以说数字货币只是比特和字节，所以你可以创建更多。你也可以说，例如，当美国政府需要更多钱时，他们只需要打印更多美元。美元并不与任何其他商品挂钩，它的价值仅仅取决于人们愿意接受它的程度，并由“美国政府的完全信任和信誉”支撑，无论这在接受美元的人脑海中意味着什么。现在，让我们不要用美元，而是想象一组计算机程序员创建了一种在服务器上“铸造”的货币。因为它使用密码学进行保护，让我们把这种数字货币称为“加密货币”（cryptocurrency）。


    回想比特币诞生的那个极度缺乏信任的时代，人们对传统金融体系以及更广泛的传统机构（如政府和公司）感到普遍幻灭。中本聪想要一种像黄金一样具有有限数量的东西，而不是像美元那样可以被无限创建的东西。他在比特币的代码中内置了一些聪明的元素，使其成为一种具有稀缺价值的数字货币。


    首先，对于世界上可以挖出的比特币总数有一个内置限制。大约是 2100 万个。这些比特币通过在比特币区块链中计算新区块来创建。通过挖矿创建新比特币的速度沿着一条曲线在减慢。理论上，除非一组被称为“比特币核心”（bitcoin
    core）的几百名开发者决定创建新的计算机代码，并且控制比特币服务器的人员有效地通过上传这些新代码来投票接受软件更改，否则我们将达到该限制，届时比特币将因其稀缺性而升值。


    为了让事情更有趣，人们认为有超过 1000 万个比特币永远丢失了。也许你忘记了解锁资金的加密密钥，或者你扔掉了存有数据的电脑。中本聪似乎没有花费他的首批比特币。因此，现在比特币实际的可交易范围要小得多，可能总共仅有
    1100 万个。


    而且与 20 世纪 80 年代的流行收藏品“豆豆玩”（Beanie Babies）（比特币曾被贬义地与其相比）不同，比特币确实具有其稀缺性之外的价值。它可以用于减少金融系统中的摩擦，例如跨境汇款——与其向肯尼亚转账支付
    15% 的费用，不如使用比特币系统，你可能只需支付 1.5% 甚至 0.15%，因为消除了多层中间人以及过时的转账技术。我将论证的是，至少在今天，比特币附带着非零的价值。我无法告诉你它每枚币值
    20,000 英镑、1,000 英镑还是 100 英镑，但今天它的价值大于 0。


    其他加密货币也遵循这种稀缺性模型被创建。在写作期间，所有数字代币的名义市值价值价值数百亿英镑。在讨论加密货币价值时，我必须非常小心；在我 2016 年写第一本书时，比特币价值为
    70 亿；在我 2017 年秋季演讲时价值超过 4000 亿；而现在比特币 `BTC` 和比特币现金 `BCH` 的总市值大约在 1500 亿左右。当你读到这本书时，情况将会发生变化（不，我不知道它会变高还是变低）。


    我意识到我描述的结构也可以用于庞氏骗局：已经在网络中的人从新进入网络的人那里获利。事实上，意大利研究人员 Massimo Bartoletti、Salvatore
    Carta、Tiziana Cimoli 和 Roberto Saia 在 2017 年调查了 1500 多个区块链代币发行，并确定其中超过 10% 是真正的庞氏骗。社区中的某些人对我对这个比例之低表示惊讶，滥用现象层比不鲜。


    与其他许多新技术一样，经济价值的创造也吸引了骗子，他们试图从人们对技术实际能力以及如何变现的兴奋和困惑中盈利。这并不否定该技术更广泛的机会，但如果你计划对区块链相关资产进行金融投机，这确实了一个谨慎的理由。买者自负。尽职调查。


    ### 安全


