  raw: '◆ What some of its key elements are, like Byzantine consensus, proof of work,
    mining and elliptic curve encryption


    ◆ Some of the limitations of the bitcoin blockchain, and some of the variations
    like Ethereum and Ripple (XRP)


    ## [CHAPTER 2](#contents.html#rchapter02)


    ## [The blockchain hype train](#contents.html#rchapter02)


    **WHAT YOU NEED TO KNOW**


    ◆ The adoption of new technology is often accompanied by an emphasis on marketing
    and storytelling, and blockchain is no exception


    ◆ Some of this is necessary to enlist open-source developers


    ◆ When the hype goes too far, it results in over-promotion that negatively impacts
    the credibility of the field, and possibly even violation of securities laws


    There’s a patina of rock and roll surrounding the blockchain hype cycle. Industry
    events resemble rock concerts (Snoop Dogg headlined an industry party), and blockchain
    players can be found behind velvet ropes in Ibiza and Cannes, or pursuing transcendence
    in the sands of Burning Man.


    The blockchain hype train rides on the twin rails of open-source developer initiatives
    and investor relations. Open-source developer initiatives are where a company
    recruits numerous contributors, who mostly don’t work for the company, to provide
    code improvements for a piece of software. The developers do this to get access
    to the code, so the trade-off is that they get software for free in exchange for
    contributing any improvements they make to the software. Investor relations are
    how a company maintains stability and interest in the price of its securities,
    through sharing information about performance and future initiatives. These two
    ideas come together when blockchain companies start putting the word out about
    what they are doing and, sometimes, raising money through selling their tokens.
    It has spiralled into an inescapable freight train of promotion chugging down
    the track.


    All aboard . . .


    ### **OPEN-SOURCE COMMUNITIES**


    Perhaps the most legitimate exemplar of where marketing meets blockchain is in
    the domain of open-source developer initiatives. There isn’t one monolithic standard
    for blockchain. While bitcoin was the first protocol, many others have since emerged.
    A protocol, in this context, is a set of rules around how a blockchain network
    exchanges information, manages transactions and handles governance (decision making).
    It’s the basic operating system of a given blockchain. Sometimes it has an applications
    programming interface (API), to make it easier for developers to work with the
    particular blockchain.


    Open-source initiatives publish their code for all to see, and encourage a community
    of developers to make improvements or extensions to it. Linux, a free operating
    system, is an example of one widespread open-source project (UK-based Ubuntu,
    from Canonical, is one of the most popular flavours of Linux). The Android operating
    system for mobile phones, the most popular in the world, is open-source, although
    many refinements since are not. The open-source nature of many blockchain instances
    enables users to have greater trust in the system because they are able to see
    how blocks are formed, how security is handled, how tokens are transacted and
    so on.


    Open-source initiatives are a clever way to get thousands or millions of developers
    to build on top of a particular code base, demonstrating the power of ecosystem
    innovation. Instead of investing significant resources in getting your own people
    to build a system, enlist the labour of others.


    If you’re going to have a vibrant open-source community, you need to dedicate
    time, energy and expense to community relations. You need to inform developers
    about what you’re doing, have presence at trade shows, perhaps even provide developer
    grants to fund promising projects that show off the power of your protocol. For
    this reason, the Consensys Ethereal Lounge at Davos features funky club lighting,
    custom cocktails from a house mixologist and a living wall to accompany talking-head
    panels with the likes of Adam Lindemann discoursing on the tokenisation of the
    art market. We get Snoop Dogg headlining a Ripple party in New York City, and
    Irfan Aulia, an Indonesian musician, joining with his government to promote a
    blockchain project to help manage digital music royalties. Blockchain is truly
    rock and roll in all senses of the phrase.


    Over-amplified promotion is hardly original thinking in the tech sector. Former
    Microsoft games executive Alex St. John, who helped create the Xbox, ordered a
    ‘$2 million alien spaceship to be built as part of a gigantic game promotion’[⁶](#bm05.html#en6)
    according to Dean Takahashi, and would host lavish, extraordinarily creative parties.
    If you want to get an idea of what I’m talking about, feel free to look up the
    launch promotion that accompanied id Software’s breakthrough title *DOOM*, but
    please not from a work computer!


    There is a storied history behind over-the-top marketing for tech, and the open-source
    efforts of the blockchain builders are no exception. When this activity carries
    over into regulated financial services, however, we run into issues . . .


    ### **INVESTOR RELATIONS**


    A number of blockchain token issuers have gone to great lengths to try to sound
    like they’re not issuing securities like conventional corporate. ‘We’re a foundation,’
    DFINITY insists,[⁷](#bm05.html#en7) ignoring the substantial number of tokens
    thought to be held by founder Dominic Williams. Former CFTC regulator Gary Gensler
    cautions against ‘hasty regulatory pronouncements’ and tries to normalise bitcoin
    by claiming it’s just as arbitrary in value as gold.[⁸](#bm05.html#en8) Instead
    of ‘investor relations’, token issuers talk about ‘community relations’ and ‘community
    initiatives’, but what they are doing is engaging in public dialog with people
    who have put money into a particular cryptocurrency or token, and those people
    expect the value of the token to go up. They are quite vocal when the value of
    the token goes down.


    ‘HODL,’ they shout, a typo that turned into a meme to represent a buy-and-hold
    ethos. Statistically, given the volatility of the top ten tokens, they can’t all
    be HODLing. Speculation is rampant. Indeed, one of my former students paid for
    grad school and a down payment on a house by speculating on bitcoin.


    Regulators who still work for a government, versus regulators who used to work
    for government but now work on behalf of private interests,[⁹](#bm05.html#en9)
    have by and large taken the position that token issuances are securities. The
    United States, most notably, has taken this position, but other jurisdictions
    have also gone along a similar path.


    There are notable exceptions. Domiciles like the United Kingdom have put forth
    specific regulation that identifies ‘securities tokens’ versus ‘utility tokens’
    versus ‘exchange tokens’, with different scrutiny and reporting requirements for
    each.


    The activity of ‘community affairs’ is functionally equivalent to investor relations.
    The company issuing the token wants to regulate demand so that they can continue
    to raise money to fund operations and the founders’ personal spending. They engage
    with a large number of institutions and individuals who purchase, sell and, in
    some cases, buy derivatives on, digital tokens. Their engagement with their communities
    includes the broadcasting of company endorsements, and breathlessly touting this
    software release or that government initiative using the token. Rejoice! HODL!


    In most circles these types of activities would be deemed investor relations,
    and thus the nature of information that is communicated would be subject to regulation
    and oversight by securities agencies. Regulators are less concerned with billionaires
    throwing play money at cryptocurrencies, and more concerned about the working
    poor leveraging their credit cards to buy a volatile security that is manipulated
    and then crashes, creating a cycle of debt for an already strained household.'
