    \ accelerate experimentation.\n\nA curious trend is emerging. The way we typically\
    \ fund innovative new companies, once tightly concentrated in a handful of investment\
    \ firms mostly found on a few miles of road in northern California, has now been\
    \ democratised to an extent not seen since the coffee houses of Amsterdam during\
    \ the Age of Exploration. Termed ‘initial coin offerings’ (ICOs), new financing\
    \ vehicles have sprung forth, anchored in the principles of crowd capital and\
    \ syndicated through Telegram and Instagram. In some countries these fundraising\
    \ exercises have been labelled ‘securities offerings’, with the rules, reporting\
    \ and investor protections associated with a more traditional, regulated financial\
    \ function such as a stock or bond offering. Other countries, perhaps seeing a\
    \ new economic value opportunity that could generate tax without adverse environmental\
    \ or social impacts to the host country, choose a looser regulatory approach.\
    \ Some countries explicity created a new asset class of ‘securities tokens’. We’ll\
    \ discuss some of the risks this creates later.\n\nAll the while, entrepreneurs\
    \ are building ambitious new platforms that seek to change the way we work, live\
    \ and play – on this planet and beyond (yes, there are several ‘space coins’ under\
    \ development). Unlikely places like San Juan, Puerto Rico; Tallinn, Estonia;\
    \ and Port Moresby, Papua New Guinea host digitally connected, wired-up pioneers\
    \ attempting to reshape the way people relate to the businesses and societies\
    \ around them.\n\nJoin us now for this safari into the wild jungles of distributed\
    \ ledgers . . .\n\n## [PART I:  \n\nFOUNDATIONS](#contents.html#rpart01)\n\n![Illustration](images/line.png)\n\
    \n## [CHAPTER 1](#contents.html#rchapter01)\n\n## [The ascent of bitcoin](#contents.html#rchapter01)\n\
    \n**WHAT YOU NEED TO KNOW**\n\n◆ Blockchain is a special kind of database, initially\
    \ created to support a new digital currency called bitcoin\n\n◆ Blockchain grew\
    \ out of a need to create digital trust where we had lost trust in institutions\n\
    \n◆ The system works because of clever mathematics. It achieves common agreement,\
    \ or ‘consensus’, about what is true among parties who don’t have to trust each\
    \ other\n\n◆ The system can also embed economic incentives to run a large network\
    \ on many computers owned by many people\n\nWe stand on a dusty battlefield, with\
    \ an army surrounding a besieged city. Blood and dirt smudge the faces of the\
    \ soldiers. Several generals, rivals in the complex court politics of the Byzantine\
    \ Empire, now command the field in an uneasy coalition. If they all attack together,\
    \ they will take the city. If they all retreat in good order, the troops will\
    \ live to fight another day. If some generals attack and some flee, if one or\
    \ two of the generals can be suborned through bribery, the entire army will be\
    \ destroyed. To complicate matters, they can’t see each other with signal flags\
    \ and are coordinating their attack through runners going from tent to tent.\n\
    \nWhat if someone intercepts the message? What if a general has taken money from\
    \ the enemy to endanger his compatriots by sending misleading communications?\n\
    \nHow can we coordinate action in such a way that a group of generals who don’t\
    \ trust each other attack or retreat in unison?"
