    to Susanna, Mari gives money to Fred, Davis gives money to Mohammad. None of these
    people know each other. But the record of these different financial transactions
    is bundled up mathematically into a single unit, or a ‘block’. When you perform
    a cryptographic calculation on the block, you’ve now linked the transactions so
    that you can’t change one without changing all of them, because they are all part
    of the output of that equation.


    ![Illustration](images/f0023-01.png)


    Let’s say Susanna then sends some of her money to Archie, Fred sends his money
    to Quentin, and so on, forming a new block.


    ![Illustration](images/f0024-01.png)


    You use the output of the equation from block 1 as part of the mathematics that
    you use to calculate block 2.


    ![Illustration](images/f0024-02.png)


    By using the output of one block as one of the inputs to the next block, you end
    up linking several of these blocks together in a Merkle tree or chain, and you’ve
    got a ‘blockchain’. This blockchain makes it very hard to insert a fake record,
    because you’d have to change all of the different calculations in order to modify
    one single transaction.


    This concept is sometimes referred to as ‘proof of work’. Originating in a paper
    written in 1999 by Markus Jakobsson and Ari Juels,[³](#bm05.html#en3) proof of
    work (POW) is intended to defeat attacks such as denial of service (DDOS). With
    a DDOS attack, a cybercriminal will enlist an army of machines to spam a web server
    rapidly and repeatedly with requests, until the system gets overloaded and fails.
    You can think of it like a horde of zombies attacking a castle under the direction
    of a mad scientist. They aren’t very sophisticated, but if enough of them punch
    the castle wall, it will fracture. A defence against DDOS is to force each attacking
    machine to do a medium-complicated calculation, making it effectively take too
    long and too many computers to overwhelm the network. Extending our analogy, it
    would be like forcing each zombie to complete a few complicated dance steps before
    it can strike its fist. It ends up making the attack unworkable, and the castle
    (your network and the data inside) is safe.


    You need proof of work along with Merkle trees, or a cybercriminal could just
    recompute the entire tree and inject fraudulent entries. Proof of work isn’t the
    only solution, of course. Estonia, for example, which uses a private chain versus
    the public, permissionless chain of bitcoin, has figured out how to show integrity
    in the system without proof of work: they publish the top hash in their Merkle
    tree in the *New York Times* once a month.


    But generally, proof of work has proven popular, particularly without the agency
    of trusted bodies like a government or a media outlet of repute. It operates in
    synchronisation with Byzantine fault tolerance to create a resilient, redundant
    network that has a very high standard of data assurance. Digital trust, in other
    words. It should be mentioned that there are a number of other techniques used
    to establish digital trust, like proof of stake and proof of authority and such,
    but for this book I’ll use proof of work as an illustrative mechanism because
    it underpins one of the largest blockchains, the bitcoin blockchain.


    I’m using money in this example to make the concepts understandable, but really
    money is just data, a series of 1s and 0s. These kinds of blockchains can be formed
    using any kind of data, not just financial data: for example, keeping a record
    of clinical trial results, tracking the origins of a particular kind of food that
    ends up in your kitchen, or mapping the records of who owns the land that your
    house sits on.


    ### **MINING**


    Mining is a fascinating concept within the world of blockchain. Let’s take our
    old friends Byzantine consensus, Merkle trees and blocks, and add an element of
    competition to the mix. Because there are several mathematical routes that can
    be followed in order to generate a particular block, we want to find the most
    efficient one.


    What if we offered a prize? Let’s say that the financial example I gave above
    involved a total of £10. What if we offered someone, say, 10 pence to calculate
    the block for our series of three unrelated transactions, but only to the first
    person to complete the task correctly. Someone who has a computer and cheap electricity
    might be willing to do this to earn a little extra money. We call that 10 pence
    the ‘mining fee’. And there is a competition among many miners in order to win
    the mining fee, with the calculation that is mathematically proven to be the most
    efficient crowned the winner of the competition.


    This mining fee is what incentivises thousands of people to load software onto
    their computers to conduct the complex transactions necessary to make blockchain
    run. While blockchain is very secure and great at producing an immutable record,
    it’s ferociously expensive in terms of the number of computer cycles it consumes.
    What if you didn’t want to have to buy a bunch of computers or server time on
    Amazon Web Services (AWS)? By giving many people a small piece of the action in
    the form of a reward, you now have them using their computer capacities in a highly
    distributed manner to solve your mathematical puzzle.


    Like every other aspect of blockchain, the ideas behind how you enlist a network
    of miners to do the calculations on a distributed network of computers are not
    new. There were a number of previous examples of this concept of distributed mathematical
    computation. Two widely known crowd calculation efforts are [SETI@home](mailto:SETI@home)
    and [Folding@Home](mailto:Folding@Home).'
