    公平性应当是一个监管目标；法规不应偏袒某一组而非另一组。平衡竞争是一项微妙且复杂的行为，因为存在产生意外后果的巨大风险，但如果没有平衡，典型的市场或系统将退化为寡头、双头或垄断。如果没有特定的监管干预来支持新进入者，市场往往会聚集，就像水汇聚在低洼处一样。应该支持许多竞争方，而不是偏袒单一群体或单一类别的竞争者。


    ### 5) 促进创新


    新想法在受到重大的监管审查之前，必须有空间来演变和成长。在某些司法管辖区，只要实验不严重违反关键法规，监管机构会故意对实验行为视而不见，其立场是希望允许创新在边缘发生，仅当创新增长到一定规模时才干预。在其他司法管辖区，监管机构制定了特定的计划来鼓励创新，通过`避风港函`（safe
    harbour letters）为实验的发生提供的边界。避风港函由监管机构出具，定义了公司可以从事的一系列许可活动。信函表示，如果公司保持在这些定义的规则内，监管机构不会对该公司采取执法行动。它们通常被用于公司希望创新的领域。


    监管机构对创新的支持可以从沙盒或沙练场开始，这些是定义的环境，公司可以在其中进行实验并获得监管机构的反馈，然后转入轻级许可安排，最后获得完全许可。在英国银行业，这种进展的形式表现为`FCA
    沙盒`、`电子货币许可证`（e-money licence）和`全额银行许可证`（full banking licence）。这些计划为创业者代表了一套深思熟虑、高度结构化的阶段关口。


    在我与全球十多个政府的政策工作中，我发现虽然某些政府优先考虑某一个维度而非其他维度——小国的需求与大国不同，不同地区面临着不同的紧任务——但许多监管机构高度多样化的优先事项和监管规定可以提炼为以下一个或多个元素。


    ### 演进中的监管模型和方法


    随着我们看到越来越多的司法管辖区出现更复杂的监管方法，值得关注几种常见的政策干预措施，这些措施可以减轻创新者的监管合规负担。这些包括但不限于：


    ◆ 标准与协调

    ◆ 分级许可

    ◆ 避风港


    我们现在将更详细地探讨这些想法。为什么它们是必要的？这是因为“协调”（harmonisation）具有困难性。协调是将不同国家的法律紧密对齐的概念。当你面临跨越国界的问题时，这一点很重要，例如如何处理`区块链代币`（blockchain
    tokens）等新工具投资证券的跨境资金流动。然而，由于多种原因，这是极其困难的，从特定司法管辖区的法律传统到每个国家内部和社会政治背景不一；从双边协议转向多国协调时，问题呈指数级增长。相反，一些对齐程度不那么紧密但快速有效的技术已经演变出来，以一种一致的方式推动国家进步。


    ### 标准与协调


    诸如`OECD`等经合组织一直致力于制定标准，帮助多个国家的监管机构和政策制定者引导区块链的使用。这些跨司法管辖区对齐的广泛原则允许每个国家在自己的法律和监管背景内解释标准，确保了不同司法管辖区之间的一种一致性，而不需要完全协调所要求的逐行对应的严谨性。


    ### 分级许可


    新技术的整合往往会给监管机构和创新者带来挑战，因为现有的监管结构通常设计不当处理新型和颠覆性技术，即使已经实施了松散且基于原则的制度。英国等国家已为金融科技公司创建了分级许可，例如在银行领域设有`电子货币许可证`、`半级`银行许可证和`全额银行许可证`。每个层级都有不同程度的监管审查和合规要求，每个层级都允许广泛的银行相关活动。在一些国家正在考虑或实施针对`区块链证券`（blockchain
    securities）的类似分级模型。


    ### 避风港


    如前所述，避风港是政策制定者工具箱中一种非常有吸引力的工具，被用于各种场景。其核心是，避风港由监管机构向公司提供一份明确声明，说明某一组业务活动不会违反给定的法规或一组法规。当监管机构之间进行有效协调并创建适用于跨司法管辖区的标准时，私营部门利益相关（公司、投资者）将资本部署到新领域将变得更容易。一套良好的`避风港函`可以为公司及其投资者提供部署产品或服务的信心，而无需政府施加创建新法规时通常所需的同水平的政治和组织努力。速度也快得多。使用`避风港函`允许监管机构尝试新技术，并在新兴技术领域获得现实世界的经验。这有助于监管机构决定是否需要新法规，以及如果需要，它必须采取何种形式。


    各国对区块链潜力的接受程度各不相同。某些司法管辖区已对区块链倡议制定了明确的监管或经济支持，一些制定了特定规则，或解释了现有规则，而另一些仍然采取观望态度。例如，`欧盟`（European
    Union）已设立了一个大规模投资基金来支持区块链项目。`欧盟`（EU）认为区块链可以帮助解决小微企业的融资缺口。`英格兰银行`（Bank of England）在该领域投入了大量研究，包括评估`央银行数字货币`（central
    bank digital currencies）的可行性。百慕大（Bermuda）和马达里求斯（Mauritius）等岛屿国家通过了新法律，旨在使其司法管辖区对区块链业务更友好，或更容易通过各种类型的`代币发行`（token
    offerings）筹资。


    通过本章提供的框架和工具，你现在拥有评估和理解你所处环境的能力，同时也拥有设计你自己的区块链生态系统的工具，无论你是创新者还是监管者。


    现在你已经熟悉了一些核心理念，可以开始思考如何应用区块链。在人类努力的几乎每个领域，区块链技术都有塑造市场、实现繁荣、减少腐败、增强安全和产生效率的方式。当我们将不可篡改性（一种无法删除的记录）与糟糕的数据质量和完全透明化相结合时，区块链也会产生新的且危险的意外后果机制。当我们进入《基础区块链》的第二部分时，我们将研究区块链如何为行业创造新机会，以及风险在哪里。


