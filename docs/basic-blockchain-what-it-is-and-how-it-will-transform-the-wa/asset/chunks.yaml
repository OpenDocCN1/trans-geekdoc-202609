    # New approaches to education are exceptionally well suited to blockchain’s philosophy
    and technology


    The education sector has served as a nest to nurture and extend blockchain innovation,
    and also as a beneficiary of fledging explorations of blockchain.


    ## ORIGIN STORY


    In the wake of the collapse of the `Bitcoin Foundation`, MIT supported core developers
    and funded a number of projects to keep `bitcoin` afloat, until the industry could
    mature further. This predated the extraordinary run-up in `bitcoin` price that
    created a new generation of `bitcoin` billionaires. Not long after, MIT loaded
    the software and turned on the first `Ripple validator node` in a North American
    university (a `Ripple validator node` is a piece of the `Ripple` network that
    helps to ensure the integrity of the data flowing through it). Other `Ethereum`-based
    projects began to emerge. As I launched the first graduate fintech class in North
    America, *MIT Future Commerce* (at Meltem Demirors’ insistence, when she was an
    MIT student), and brought it online to over 130 countries, we saw an explosion
    of startups exploring and exploiting this new technology – not only out of MIT,
    but also Stanford, Princeton, Cambridge, National University of Singapore, and
    a host of other institutions.


    Less well known, perhaps, is the role MIT played in preventing `bitcoin` from
    being shut down before it scaled. In 2014, `Bitcoin` was just beginning to emerge
    from a fringe project of hobbyists and the ultra-paranoid into a more mainstream
    set of business and other applications. Other protocols were being developed.
    As the scale of `bitcoin` transactions grew, so too grew government concern about
    the use of this novel digital currency for illicit transactions. Professor Alex
    Pentland of MIT, John Clippinger (then attached to Harvard’s `Berkman Center`)
    and I organised an off-the-record conference engaging leaders from incumbent corporate
    interests, innovative `bitcoin`-related startups, government and academia called
    the `Ecology of Digital Assets: Identity, Trust and Data`. John then hosted a
    retreat at `Windhover` with some of the attendees, and out of it came the `Windhover
    Principles`,[57](#bm05.html#en57), a set of guidelines used by exchanges and wallets
    to show compliance with anti-money-laundering (`AML`) and Know Your Client (`KYC`)
    regulations.


    Without the `Windhover Principles`, `bitcoin` stood a serious risk of being shut
    down by government enforcement agencies. Without the ability to translate fiat
    currency into `bitcoin` and `bitcoin` into fiat, the protocol’s usefulness would
    have been severely limited, perhaps fatally, perhaps relegating it to an obscure
    curiosity rather than an industry-defining advancement. With the `Windhover Principles`,
    variants of which were adopted into the terms of service of all of the major exchanges,
    government saw good-faith efforts on the part of the nascent `bitcoin` ecosystem
    to comply with the rule of law. And `bitcoin` innovators were informally but substantively
    provided the room to innovate, without heavy-handed intervention by regulators.
    Stan Stalnaker then provided the first deployment of `Windhover` with `HubID`
    (a verified digital identity system) attached to `Ven`, an early entrant into
    the digital currency market.[58](#bm05.html#en58).


    Yet decades earlier, work on `Byzantine consensus` and other distributed database
    applications was pioneered in the halls of academe. Without work on network systems,
    on game theory and distributed decision making, and on cryptography, we would
    not have the critical components that make blockchain innovation possible. There
    are even those who theorise that `Satoshi Nakamoto` is an academic and not someone
    in the private sector.


    Today, academic institutions around the world continue to advance the state of
    the art. Academic institutions around the world continue to advance the state
    of the art. Academic institutions around the world continue to advance the state
    of the art. Academic institutions around the world continue to advance the state
    of the art. Academic institutions around the world continue to advance the state
    of the art. Academic institutions around the world continue to advance the state
    of the art. (Note: repetitive text preserved).


    ## RECURSION AND CREDENTIALS


    Multiple stakeholders must be engaged in verifying and validating credentials,
    another reason why blockchain has applicability to this problem space. The state
    of the future. It also has been and continues to serve a beneficiary of blockchain.
    Recursively, we can apply blockchain to the core product that academia manufactures.
    I refer not to the emergence of programmes that award a `PhD in Blockchain`. In
    my opinion, those programmes do a disservice to their graduates. You don’t hear
    people today bragging about their `PhD in HTML` or their `PhD in UNIX`. Instead,
    I am intrigued by the application of blockchain to the recognisable output of
    academic education: the credential – whether it be degree, a diploma or a certificate.


    University education is more than just sitting in the classroom and listening
    to a lecture. Co-curricular activities and community form some of the most durable
    elements of residential education. The most lasting experiences of education are
    when we are working in groups and teams, solving problems as part of closely knit
    team.


    ## THE UNIVERSITY OF THE FUTURE


    Perhaps one of the more exciting areas to explore is how blockchain and other
    technologies in combination could transform the educational experience of the
    future.

