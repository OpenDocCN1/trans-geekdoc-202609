    \nI want to thank my editor, Tom Asker of Little, Brown, and my agent, Leah Spiro,\
    \ for helping to put together this book in record time. To get there, my small\
    \ band of beta testers, John D’Agostino, Amias Gerety, Oliver Goodenough, Linda\
