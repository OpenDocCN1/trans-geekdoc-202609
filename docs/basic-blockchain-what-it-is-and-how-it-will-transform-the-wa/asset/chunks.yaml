    `a123` 组成的密钥其安全性低于一个由 `abc12345678` 组成的密钥，因为黑客必须在更长的密钥中尝试更多的组合来破解代码。椭圆曲线加密利用巧妙的数学，使得你可以拥有比其他许多类型的公钥加密更小（更短）的加密密钥。公钥基础设施（PKI）意味着任何人都可以使用公钥加密消息，但只有接收者或私钥持有者才能解密消息。其他形式的加密要求你需要私钥来加密和解密消息。较小的密钥意味着处理加密所需的计算机周期更少，使得过程更快、更高效。


    从理论上讲，使用传统计算机破解 `256-bit` 椭圆曲线加密需要几十年的。然而，人们认为量子计算机一旦实现商业化，将在几分钟内破解我们目前在金融系统中（以及比特币和以太坊等新金融工具中）使用的加密。我们需要主动思考后量子世界，在那个世界中拥有更强的加密——许多人恰在这样做。但目前，比特币网络通过其椭圆曲线加密仍然是安全的。


    ## 我们分叉了吗？


    一种奇妙又可怕的事情从由数千个节点组成的分布式治理结构中诞生了，其中每个节点对采纳核心软件的更改都有投票权。治理是系统（在此例中为比特币区块链）决策的方式。如果你无法让系统中的参与者达成共识，一些人将开始使用一个版本的软件，而另一些人开始使用另一个版本。于是，“分叉”（fork）诞生了，即两种版本的比特币代码的分离，这就是为什么我们有了比特币（BTC）和比特币现金（BCH）。硬分叉（Hard
    forking）是区块链治理背后民主决策产生的一种意外结果。这有点像基督教从犹教中分支出来的加速版本，随后伊斯兰教在几个世纪后以犹太基督教经典为基础发展起来。


    当第一批区块链组合在一起时，存在一种理想化的观念，即人们将对采纳新的改进进行投票。这是一个很棒的概念；它将网络交给了许多人，而不是仅仅掌握在少数个人手中。


    我们只能假设，预期是某个想法要么被采纳，要么不被采纳。相反，达尔文式的力量导致了意之外的结果。出现了一个创建一个特定协议的新变体的想法。为了描述这种效果，借用了多线程处理中的一个术语：协议宇宙中存在一个“分叉”，或一次分裂。现在不再是一个比特币，而是有两个比特币。


    这有点像漫威电影宇宙中的多元宇宙理论。这些分叉从关键决策开始分离，然后开始……


    ## 以太坊和去中心化应用（DApps）


