    ![插图](img/cover.jpg)


    `David L. Shrier` 是一位未来主义者，也是全球认可的金融创新权威。他出版了多本关于区块链、金融科技和网络安全的书籍。David 目前的学术职位包括牛津大学赛德商学院的副研究员以及麻省理工学院的讲师。


    David 创建并领导了牛津大学的在线课程 `Oxford Blockchain Strategy`（牛津区块链策略），这是一种分布式数字环境中加速新型区块链创业企业的革命性方法。


    “David 是金融科技长期专家，他让普通的业务高管能够轻松理解区块链。随后他向我们展示了一些未来可能创造万亿级产业的兴奋可能性。”


    —— `Chris Larsen`，`Ripple` 创始人兼主席


    “《基础区块链》是任何想要了解这种新兴且颠覆性技术的人的必读物。它针对忙碌的高管或公共服务人员，他们知道自己应该理解区块链技术及其应用，但一直没能抽空完全掌握
    . . . 这是一本很快，任何人可以在从 JFK 飞往百慕大岛的时间内读完。做得好，David。”


    —— `David Burt 士（勋爵、太平、议员），百慕大岛总理`


    “David 让区块链活了过来，推动了关于如何利用它来提高透明度和效率的见解。我在思考如何优化价值 1100 亿美元的投资组合管理时，发现这非常有帮助。”


    —— `Randy Brown`，`Sun Life` 首席投资官，`SLC Management` 保险资产管理负责人


    “区块链已经成为我们日常生活的一部分。它对重塑信任概念以及为勇敢的新型数据经济创建最优治理系统的承诺是开创性的。分布式账的效用在于加强我们作为公民和客户的实力。David
    Shrier 的《基础区块链》是那些寻求从噪音中区分信息的人的必备工具 . . . 对于需要在炒作之外做出明智决策的政策制定者、监管机构和商业领袖来说，这是一个完整且可靠的指南。”


    —— `Eva Kaili`，欧洲议会议员、科学技术未来委员会主席


    “区块链可以改变从金融服务和货币、我们处理支付的方式、保险和医疗记录到政府以及法律适用的一切。Shrier 清晰地阐述了区块链在各种活动和业务中可能扮演的改变格局的角色。《基础区块链》是对未来可能面貌的极佳且富有远见的展望。”


    —— `Jaime Bermudez`，`Lazard` 管理合伙人，哥伦比亚政府前外交部长


