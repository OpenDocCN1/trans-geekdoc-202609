    This description of a fictional battle in the days of the ancient Byzantine Empire
    formed the basis of a real mathematical problem: that of establishing trust in
    a trustless environment. SRI International researchers `Leslie Lamport`, `Robert
    Shostak` and `Marshall Pease` posed this thought experiment while working with
    the United States National Aeronautics and Space Administration (`NASA`). Their
    1982 paper `[¹](#bm05.html#en1)` on this arcane area of game theory later found
    notoriety by providing one of the building blocks of blockchain. In the classic
    formulation of the Byzantine Generals Problem, as long as two-thirds of the system
    participants are loyal, and agree to the veracity of information or a decision,
    it will function as intended. A computer network that is built using this method
    can be described as ‘Byzantine fault tolerant’, meaning it will work correctly
    while having redundancies built in for failure under the circumstances of one-third
    of the computers showing a problem, with two-thirds showing no issues (or vice
    versa). If you have a computer built into a spaceship, and it shows that the oxygen
    system is failing or the engines won’t work, you can’t simply have an array of
    repair technicians evaluate to see if the error is real or of the computer has
    a glitch. You need multiple computers, for redundancy, and a mechanism, such as
    Byzantine fault tolerance, to ascertain if the problem is real or if the computer
    is faulty. `NASA` designed their space shuttle computers to be Byzantine fault
    tolerant.


    Move forward in time to 2008, when the overheated real estate bubble burst and
    rocked the world’s financial systems to their very foundations. In this heavy
    mix of excess and excessive speculation there were many ‘haves’ – people who profited
    from the crunch – but an even greater number of ‘have-nots’. People were becoming
    increasingly frustrated with the concentration of wealth and corruption they saw
    around them. The bursting bubble only served to confirm their worst fears about
    ‘The Man’ controlling their lives and taking their money.


    Enter `Satoshi Nakamoto`. Who he is, no one has been able to say for sure. Several
    have attempted to claim his mantle. Some blockchain-savvy friends of mine think
    it is a pseudonym for a cabal of like-minded software developers. For our purposes,
    let us think of him as an unknown, iconoclastic genius.


    In October 2008, he published a paper entitled ‘Bitcoin: A Peer-to-Peer Electronic
    Cash System’`[²](#bm05.html#en2)` In it he described what have become familiar
    to many as the foundational elements of blockchain. Taking the Byzantine consensus
    of nearly three decades prior, and combining elements from other projects, he
    proposed a new ‘trustless’ networked currency. The key elements of this were:


    ◆ a `distributed ledger` to keep track of a new digital currency, meaning a database
    with many copies that all update themselves automatically


    ◆ a `Byzantine consensus` to govern changes to the ledger


    ◆ a `cryptographically secure` currency


    ◆ ‘`mining`’ incentives to encourage people to burn the computer cycles necessary
    to manage the currency


    ◆ ‘blocks’ of transactions describing when people trade the currency, strung together
    in what’s called a ‘Merkle Tree’ to form an immutable record, a ‘blockchain’.


    The next section takes a very simplified approach to describing the mechanics
    of how this bitcoin blockchain works. It’s not terribly technical, but it still
    might be a challenge if you are more interested in the business or societal applications
    of the technology. In simple terms, I’m going to describe for you how this bitcoin
    blockchain works.


    ### DISTRIBUTED LEDGER


    What if we had a record, that had many copies and all updated themselves? This
    is a `distributed ledger`. It solves the problem of a single point of failure;
    if one copy was corrupted deliberately, the other copies would fix the problem.


    Another issue is central control. A centralised ledger is susceptible to being
    bribed. By using a `distributed ledger`, we replace trust in a single entity or
    bank with trust in technology. We create digital *trust*, in other words.


    It is important to note that all blockchains are distributed ledgers, but not
    all distributed ledger technologies (`DLTs`) are blockchains. The terminology
    can get confusing; for example, `Vitalik Buterin`, progenitor of the popular smart-contract
    protocol `Ethereum`, uses the word decentralised or distributed. For the sake
    of sanity and consistency, we will call the general class that blockchain falls
    into ‘distributed ledgers’ and move on.


    BYZANTINE CONSENSUS / BYZANTINE FAULT TOLERANCE


    Byzantine fault tolerance proposes a way to better manage a network of decision
    makers (or in this case, a network of information storage devices). Each storage
    device is a `node`. To change the information stored in the network, you need
    to convince 51 per cent of the nodes that the information is valid (in this instance,
    varying the threshold versus the two-thirds of the original paper). Now let’s
    distribute this across 10,000 nodes. We’ve created a system whereby you would
    need to corrupt 5,001 nodes in a short amount of time in order to put faulty information
    into the network. The method to do this is computationally expensive, compared
    to, for example, the computational cost of running a credit card network or an
    electronic securities exchange, but what you sacrifice in terms of processing
    power you gain in terms of confidence in the network’s results.


    BLOCKS AND MERKLE TREES


    Blockchain needs to solve a problem of *immutability*. What does that mean?

    '
