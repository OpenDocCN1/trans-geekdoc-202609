    In geographies ranging from Australia to Estonia to Brooklyn, NY, we are seeing
    efforts to implement microgrid-blockchain from companies such as WePower and Brooklyn
    Microgrid (part of the Consensys family).[^(30)](#bm05.html#en30) Peer-to-peer
    (p2p) energy markets represent a potential democratisation of end-point energy
    management, facilitating more efficient markets and lower costs to consumers.


    Provenance emerges as a factor also. Consumers are selecting green energy, for
    example, in lieu of gas or oil. This requires knowledge and certification of how
    the electricity is produced and a mechanism to ensure that it isn’t commingled
    with ‘dirty’ energy sources such as coal.


    The application of blockchain to energy distribution management isn’t limited
    to the retail market. Wholesale energy management is a complex endeavour capturing
    multiple actors (including government as well as the private sector) and requiring
    the transmission not only of energy itself but also volumes of data across an
    interconnected set of disparate entities. Hydropower might be produced in Quebec,
    and then transmitted to a high-energy-consumption locale like Massachusetts.[^(31)](#bm05.html#en31)
    The wholesale energy market, likewise, would benefit from the transparency, ease
    of data sharing and automated balancing of multiple actors that blockchain provides.


    There are other areas in which blockchain can potentially add value. Utility companies
    can do a better job of inventory management, at a lower cost, through the implementation
    of automated blockchain asset management systems. Billing and smart metering could
    see greater automation with blockchain. Transitioning from one energy supplier
    to another could be facilitated with the data portability that blockchain could
    enable.


    If we think about the strategic goals of government, we see opportunities to apply
    convergent technologies (instances in which we combine two or more recent innovations,
    including blockchain). Municipal and regional economic analysis could be conducted
    for the purposes of (1) understanding economic development; (2) assessing progress
    towards UN Sustainable Development Goals; and (3) infrastructure planning. Econometric
    insights, for example, could be made more transparent, leading to more efficient
    ways of addressing energy consumption and demand variability. These functions
    are greatly enhanced by combining artificial intelligence, big data systems and
    blockchain.


    ### **FOOD**


    The world’s food supply is ripe for blockchain, especially with regard to provenance
    and transparency. Food traceability and ingredient supply chain management have
    numerous implications for agriculture, food production and distribution.


    ##### **Food safety**


    High levels of transparency and clear traceability of individual ingredients in
    a product allow for a cost-effective approach to the management of safety issues
    ranging from contamination to recall. A salmonella outbreak, for example, could
    be more effectively identified and contained, and retailers, consumers and key
    authorities notified rapidly – and it would be possible to quickly trace the source
    of the infection. Research firm Gartner suggests that as many as 20 per cent of
    the world’s grocers will employ some form of blockchain by 2025, to introduce
    greater transparency into the food supply chain.[^(32)](#bm05.html#en32)


    As consumer demand rises for organic, pesticide-free, farm-to-table produce, large
    retailers such as Walmart are partnering with tech providers such as IBM to introduce
    total transparency into their food supply chain. They report that tracing food
    sources can be accelerated from seven days to fewer than three seconds using blockchain.[^(33)](#bm05.html#en33)


    ##### **Food provenance**


    Food provenance also has implications for environmental, social, and governance
    (ESG) factors. Not only can a food product be certified as free of certain pesticides
    or hormones, but also worker conditions and appropriate labour treatment can be
    monitored and certified. Guidelines such as the OECD’s Responsible Business Conduct
    (RBC)[^(34)](#bm05.html#en34), which incorporates standards like the UN Guiding
    Principles on Business and Human Rights (UNGPs), can be attached to the food supply
    chain and enable high-trust certification at the point of sale that ethical work
    conditions were provided at the point of production.


    More broadly, we can think about the provenance of commodities. According to Serge
    Schoen, the former CEO of industry giant Louis Dreyfus Commodities, Egyptian cotton
    sells for 200 per cent more than other kinds of cotton . . . and there is 200
    per cent more ‘Egyptian’ cotton sold every year than is actually produced.[^(35)](#bm05.html#en35)
    The profit motive to counterfeit this premium product is as clear as the opportunity
    for blockchain to provide assurances of a product’s origin and quality.


