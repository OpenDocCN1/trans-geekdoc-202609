    Tax structure and tax avoidance are global challenges, especially in emerging
    economies. A number of emerging economies, for example in Africa, have average
    tax collection (as a percentage of GDP) that is about half of the average of thirty-six
    OECD nations, hindering the ability of governments to fund critical infrastructure
    and social programmes. In other words, these African countries are only about
    50 per cent as effective in collecting taxes, the core revenue necessary to provide
    essential services, as countries that are core OECD member states. It is suggested
    by some that this low tax collection rate is due to a severe lack of trust, a
    fear that monies collected would not go towards their stated goals but instead
    would be skimmed off by corrupt officials. In the developed world, armies of accountants
    and lawyers navigate their way every year through the structuring and reporting
    of taxable income, tax payments and tax rebates.


    The example of tax presents us with a repeating, predictable, transaction-driven
    multi-stakeholder process in which trust and transparency are important and where
    significant quantities of money are on the line. It should not be surprising that
    all of the ‘Big Four’ accounting firms, which control 80 per cent of the accounting
    market, are running initiatives that investigate the application of blockchain
    to tax.


    Governments are engaged in the conversation as well. In a blockchain-enabled tax
    regimen, an audit could take seconds or minutes, and cost pennies (even taking
    into account the computing power required to run this blockchain), versus the
    sometimes millions of pounds and months of effort it currently requires. A government’s
    AI algorithm could contact the corporation’s AI, and use blockchain to securely
    and authoritatively generate response data to an inquiry without having to enlist
    legions of human actors on each side.


    ### REVERSION TO DIRECT DEMOCRACY


    In addition to bolstering our voting and polling systems, the execution of a government’s
    laws, and the collection of revenue to support societal goals, what if the mechanisms
    of blockchain facilitated government by enabling the plebiscite? We elect representatives
    because the electorate does not have enough time or knowledge to consider the
    specifics of governance. Artificial intelligence and data analytics coupled to
    blockchain could lead to an augmented electorate, one in which the will of informed
    people, reliant on cryptographically trusted sources of information to guide their
    decisions, is directly expressed in a blockchain-provisioned government.


    In our lifetimes, we could see truly direct democracy on a scale never before
    dreamed of in the days of Socrates and Demosthenes. The convergence of blockchain
    with other new-generation technologies could help our existing mechanisms of organising
    human society keep pace with the changes introduced by the technologies themselves.


    Yet we still speak in terms of technology that exists today. We talk of blockchain
    capabilities that, although not ready to be deployed into everyday use right now,
    could be usable in a matter of months or at most a few years.


    What are the next great leaps forward in technological and social evolution that
    may see a distributed ledger element or even a distributed ledger core, as we
    look further out in time? Our final chapter will postulate some views beyond the
    near tomorrow. *Here be dragons.*


    ### THE RUNDOWN


    In this chapter we covered:


    ◆ The disintegration of trust in government in the information age

    ◆ Blockchain’s ability to restore trust in the integrity of elections

    ◆ The opportunity to create Central Bank Digital Currencies and some of the issues
    that may arise as they are deployed

    ◆ The potential to bring AI, analytics and blockchain together to ‘upgrade’ core
    government functions like the rule of law and the taxation system


    ### CHAPTER 11


    ### Future horizons


    WHAT YOU NEED TO KNOW


    ◆ A more connected world means more data, and increasingly complicated data, that
    blockchain can help manage

    ◆ Convergent technologies like augmented reality and 3D printing open new horizons
    of possibility when paired with distributed ledgers

    ◆ In a matter of decades, we could reinvent society in a fully distributed fashion,
    creating a new level of responsiveness and connectivity to the benefit of humanity


    We are now going to reach a bit deeper, a bit further, and indulge in a few flights
    of fancy regarding the potential of what could be enabled with distributed ledgers.
    Prediction is notoriously difficult, even for professional futurists. I am reminded
    of the joke: economists have predicted eleven of the last three recessions.


    What we discuss is, of necessity, not strictly limited to blockchain. It would
    be like trying to build a mobile phone using only silicon. Sure, it’s a critical
    element that goes into microprocessors, but you also need gold or tantalum for
    circuitry, plastic and treated glass for the touchscreen, lithium for the battery,
    and so on. Similarly, future tech will see blockchain systems inextricably linked
    with artificial intelligence, networked communications, advanced analytics and
    other technologies, perhaps even quantum computing, smart polymers and nanotech
    or some other capability that can only be dreamed of by science fabulists today.


    As a child, one of my most treasured memories is of my father reading me bedtime
    stories of adventure, intrigue and fantasy. Indeed, with my own children, when
    bedtime stories – not streams of Twitch gamers and YouTube clips – capped the
    end of the day, our favourite bedtime story was of our own creation, with each
    person creating a line and then handing the narrative to the next, every night
    imagining a totally different cast of characters and fantastical realms.


    Why do I share this personal story with you? Innovation science teaches us that
    the same wellspring of creativity that enables us to imagine new worlds as a child
    helps us create new ventures and envisage innovations that can change business
    and society. Conventional schooling frequently leads us away from our innate creativity
    and imagination; standardised tests leave little room for inventive answers. The
    society of tomorrow and the global problems that humanity must solve will require
    inventive and imaginative thinkers who harness this childlike creativity to invent
    a better future.


    I find it fascinating that the mathematics and algorithm development that made
    blockchain possible was conducted by researchers trying to make rocket ships safer.
    Just as they helped us on our continuing journey into outer space, they have also
    enabled some journeys of the imagination that may create a better way for human
    society to work together for our collective good. Just as I explored new fantastical
    worlds as a child, let us imagine a few worlds of tomorrow in the blockchain galaxy
    . . .

