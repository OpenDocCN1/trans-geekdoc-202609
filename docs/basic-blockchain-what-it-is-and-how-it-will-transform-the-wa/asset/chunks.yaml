    ’T is not too late to seek a newer world.

    Push off, and sitting well in order smite

    The sounding furrows; for my purpose holds

    To sail beyond the sunset, and the baths

    Of all the western stars . . .

    ‘Ulysses’, Alfred, Lord Tennyson


    ## Foreword


    Bitcoin. Blockchain. Crypto. These days, you can’t go a minute without hearing
    about the blockchain revolution. Bitcoin has gone from being obscure and unknown
    to mocked, hated, revered and recognised globally. Blockchain has been lauded
    as a solution to all of the world’s problems and mocked as nothing but a glorified
    Excel spreadsheet, even vilified as an elaborate scam. Of course, none of that
    answers the underlying question: What is blockchain technology and why is everyone
    so excited about it?


    From early adopters to those who are just now becoming curious, what unites many
    in turning to blockchain technology is growing concern over the power that global
    corporations wield, thereby increasing infringements on freedoms and privacy,
    political instability and inequality. Blockchain technology could impact every
    facet of our lives and offer solutions for many of these growing issues that are
    a result of the existing power structures in our world, from money to software
    to governments.


    The operative word here is ‘could’. There is much work to be done.


    While `bitcoin` may have started as a monetary revolution, ten years of the `bitcoin`
    experiment have highlighted that this is in fact an evolution, and likely a slow
    one with fits and starts.


    Revolutions are inconvenient, messy and disruptive to the status quo, a default
    which we are unfortunately biased towards. Change is uncomfortable and, for most
    of us, terribly inconvenient. Revolutions have historically happened as an absolute
    necessity, when society has exhausted all other options and tensions have reached
    breaking point. Some may argue our society is reaching this point; others may
    feel there is still a long way to go. But what feels like a revolution to those
    of us on the front line likely looks like an evolution to those observing from
    afar.

