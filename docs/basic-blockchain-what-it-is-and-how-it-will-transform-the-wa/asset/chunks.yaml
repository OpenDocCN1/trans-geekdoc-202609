  raw: 'The ability to issue and manage currency is one of the most jealously guarded
    prerogatives of government. Indeed, the management of government financial obligations
    and government bonds is a critical tool to fund policies, programmes and pay for
    the society a government represents. It is unsurprising that governments are now
    experimenting with the creation of digital versions of their fiat: central bank
    digital currencies (CBDCs). Unlike the public and permissionless blockchains of
    bitcoin and Ethereum, these CBDCs are permissioned blockchains. Proponents of
    CBDCs argue that they could facilitate financial inclusion, that they could introduce
    greater transparency into society, and could reduce corruption and improve public
    trust.


    And yet there are fundamental issues with the idea of launching CBDCs if we fail
    to fully consider the role of banks in the overall financial system.


    Professor Alex Lipton argues a ‘theory of monetary circuit’.[^(61)](#bm05.html#en61)
    In it, he describes how money is created. Not, as one might assume, by government.
    Governments can create currency by printing more notes. This is an inflationary
    act; these new notes are ultimately spread across the same amount of economic
    value. Monetary circuit theory posits that money is created by banks. In its simplest
    form, we look at the difference between interest paid and interest income. Banks
    borrow money from the central bank at a very low rate and use it to fund banking
    activities. When consumers make deposits, the bank is paid some amount of interest
    (setting aside the recent phenomenon of negative interest rates) that is higher
    than the interest rate the bank pays to the central bank. When another consumer
    takes out a loan from the bank, the bank uses its deposits to fund this loan,
    and charges interest at a higher rate than the consumer making the original source
    deposit. The difference between these two figures – the interest paid to the depositor
    and the interest due from the loan recipient – is the creation of new money. Economic
    value, arguably, has been created by the bank.


    In a world where there are no retail banks – a world in which you store your money
    in the CBDC, you borrow from the same blockchain network and even make loan payments
    automatically through smart contracts – where is the creation of new money? What
    is the role of the retail bank in the world of CBDCs? Functional blockchain-based
    systems using CBDCs will need to either support or replace the systems that today
    create new money. Either the critical functions of the retail bank will need to
    get replicated or replaced in some fashion, or the CBDC will need to be constructed
    so that it does not displace those functions. For example, the RMB coin that the
    Government of the People’s Republic of China has proposed as a CBDC is strictly
    a wholesale instrument. Retail banks purchase these digital RMB at 100% of face
    value and then provide them directly to consumers. Other designs are possible,
    but in all cases there needs to be a means to create new money (new value) as
    Lipton’s monetary circuit describes, not simply duplicate units of currency.


    ### **AUTOMATING LAW**


    Governments express their policies and principles in the form of laws and regulations.
    Today, these laws and regulations are interpreted by individuals and adjudicated
    by courts. Whether in American- or British-style jurisprudence, the foundational
    construct for law remains an argument. There is the written word, such as a contract,
    a criminal or civil law or a regulation, the meaning of which then gets argued
    about by parties represented by various advocates. The format for the argument
    is intrinsically disputational (think of a lawsuit or a criminal charge, which
    ultimately plays out in a courtroom, whether civil or criminal). At the end of
    the process, some humans interpret events and law, and make a decision about an
    outcome.


    The current mechanism of law could be transformed through blockchain, potentially
    by evolving something called a ‘smart contract’. The smart contract emerged out
    of the efforts to make blockchain more flexible and useful. It’s a misnomer, as
    we have mentioned before; smart contracts are neither smart, nor contracts, but
    merely a set of instructions that execute under certain circumstances. Smart contracts
    are computer programs with a minimal degree of autonomy.


    A colleague of mine likes to say that law is the oldest form of computer software,
    and it runs on the very inefficient hardware of lawyers and judges. What if we
    took this whimsical notion literally, and hacked the legal system to improve it?


    We already have in the legal profession something known as ‘algorithmic discovery’.
    Algorithmic discovery occurs in complex legal cases, where large law firms and
    corporations are using sophisticated computer software to dredge through millions
    of pages of documents to extract critical information that would aid their work
    instead of having to have armies of lawyers combing through these same documents.
    AI bots actively search out information in databases and social media websites
    to assist with the development of cases. Computational social science is already
    being applied to jury analysis and jury selection. Algorithmic analysis of lending
    and spending patterns is being used to determine the fairness and compliance of
    financial institutions with inclusion regulation. Even in the adjudication of
    human rights abuses, satellite imagery and AI-enabled image analysis are being
    used to look for signs of genocide. Technology is infiltrating the law at ever-increasing
    rates.


    What if we integrate technology even more into the legal system, by turning smart
    contracts and DApps into actual algorithmic or computational law? What if entering
    into a legal agreement meant establishing paired algorithms, one representing
    each party, that could automatically verify and adjudicate disputes, and digital
    tokens were used to resolve payment due from one party to another? In this model,
    the essence of legal principles would be turned into computer code, and that code
    put into a network with other code so that all of the details of a legal agreement
    among parties would be automated. What if blockchain were the foundation layer
    across which this computational law expressed itself, becoming the network that
    enables algorithmic (computer-driven) law?


    These ideas aren’t so radical as they may sound at first.


    Indeed, a band of computer programmers and lawyers at various institutions are
    working to create computational law, to create means for law-as-code. The future
    is already here, even if it’s unevenly distributed.


    ### **TAXING EXERTIONS**


    A hot area at the intersection of government and blockchain is that of revenue
    generation, specifically tax. Trust and transparency are paramount in the payment
    and collection of tax. Tax typically forms the core revenue of a government, and
    the ability to accumulate tax is central to a government’s ability to deliver
    its services, whether that be healthcare or a justice system or farming subsidies.
    Taxation is both the prerogative and the lifeblood of government, providing the
    tangible means by which policies are funded.'
