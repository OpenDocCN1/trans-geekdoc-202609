  trans: '

    在这个世界里，我们所看到或触及的一切都将有一小部分硬件，使其与无处不在的通信网络相连。在当今的世界，我们已经看到了未来“互联世界”的前身，例如`RFID`标签以及“物联网”的普及将物理设备与数字网络连接起来。在互联世界中，每个物体和每个设备都紧密在一起，提供我们今天梦寐以求的洞察和能力。想象这样一个世界：城市中的每个物体都在流传输数据，这些数据可以用于更好地预测天气，或通信交通拥堵并帮助自动重新规划路线以确保交通顺畅；在这个世界里，利用大量数据源的
    AI 模型可以预测犯罪，让人们生活更有安全感。隐私、老大哥、对黑客的恐惧、对独裁的恐惧，这些都是这一世界愿景自然产生的，但区块链既可以让互联世界成为可能，又能为我们的隐私数据提供更好的保护。


    互联世界还利用了更高水平的计算能力。例如，现代汽车拥有 70 多个车载计算机。想象一下，当这些计算机没有用于操控车辆时（例如汽车停车时），它们正在参与创建、维护和分析穿织在我们日常生活中的无处的区块链。这个网络的潜在规模比你想象的要大。与物联网相结合的大规模分布式计算可以扩展到现在开始出现在生活各方面电子设备中的所有微处理器，无论是在婴儿监视器和冰箱中，还是在交通灯和空调系统中。


    我在一次与英特尔前首席执行官的晚餐中听到，他们通过在许多市场提供廉价的互联微处理器，实际上补贴了这些微处理器的普及。他们认为，未来的业务价值在于跨越这些芯片的网络中的数据价值，而不是硬件本身。在
    20 世纪 80 年代，英特尔著名地将其业务模式从销售内存芯片转变为销售构成计算机核心的微处理器。随着微处理器领域的竞争日益激烈，由于新的制造技术消除了英特尔此前的某些优势，他们正寻求转向高附加值的先进数据应用。英特尔再次转向一个数据驱动的未来，这个未来与我在这里描述的互联世界非常相似，在那里他们最大的价值将源于赋能和强化先进的网络化数据应用（类似于区块链上`DApps`的情况），而不是仅仅提供连接到该网络的硬件内部机制。


    互联世界不仅为我们带来了关于生活和工作的新数据源，还带了以高度分布式、动态方式计算这些数据的新能力。这反过来可以为我们提供一个对我们的需求更有反应的环境，以及一个更快速适应变化的社会。


    ## 增强世界


    随着数字连接设备的兴起和更先进的 AI，一种新的现实可能会出现，微型计算机将一直伴在我们身边，并告诉我们关于周围世界的信息。这种被梦想了数十年的增强现实正日益成为现实，并应该在未来几年内开始渗透到我们的日常生活中。


    增强世界与互联世界和谐共，在这个世界中，我们的生活通过在视野中回放的经过解释和推演的数据流而丰富——无论是通过植入设备还是数字支持的眼镜。在这个过程中，我们对周围世界正在发生的事情有了更深入的理解。环绕我们的隐藏数据流现在变得显性，这让我们对世界有更深刻的洞察，并此做出更好的决策。如果我们在街道上开车，视野上的平视显示器警告我们有一辆车正切入我们的车道，我们（和/或驾驶汽车的
    AI）可以采取行动安全地避开事故。如果我们经过一家有我们需要的商品正在出售的商店，我们的增强世界可以告诉我们该产品的可用性。如果我们生病了，或者我们附近的人生病了，增强世界可以检测症状并帮助干预。物理安全、商业、健康，在增强世界中都可以得到实现和改进。


    在这个增强世界中，我们个人数据的网络安全可以通过区块链来保障。增强世界可以带来许多益处，但在让数据易于获取和分析的同时，我们也创造了网络安全风险。通过专门设计的分布式账本和人工智能混合系统，可以实现安全地汇总源自这些增强交互的数据，而不产生过度的风险。


    甚至有一种可能，在增强世界中，我们之间的日常交互可以通过分布式账本数据系统和个性化人工智能引擎的结合来调解和改进。我们的个人 AI 引擎可以通过每天与我们简单的互动并理解我们的行为和需求，学习我们的偏好和需求。然后，这个
    AI 引擎可以与其他代表其他人、公司和系统的 AI 引擎自动交互，从而扩展我们在更大规模上表达自我的能力。这些交互的安全性可以使用高级形式的区块链和密码学来提供。


    ## 适应世界


    适应世界让我们享受终极定制的商品和服务。你所想象的任何事模板都可以存储在区块链中。有些将是开源的或对世界免费的。另一些可能收取高昂的特许权或使用费。这些模板将用于驱动纳米制造机器。你不需要登录`Amazon`订购那个电饭煲或微波炉并等待几天或一周才送达，只需访问模板，让你的纳米机器供应在几分钟内为你制造好，同时区块链会自动追踪知识产权的使用，并分配和审计许可费的支付。


    ## 分布式社会


    我们已经看到跨国公司提供自己的私有安全力量——例如国际水域的游轮。有些公司甚至推出了了自己的数字货币，让数十亿目前处于传统政府体系之外的人能够访问金融系统，这是社会的一项关键功能。政府本身一直在思考如何将区块链整合到核心政府职能中，如货币发行、投票、政府福利发放和税收征缴。


    如果我们塑造一个分布式社会会怎样？在这个社会中，我们看到多个政府及其公民以新颖和意想不到的方式围绕共同的问题或疑虑聚集在一起，而区块链和类区块链治理机制提供了访问数百万甚至数十亿人集体智能的，并在全球范围内引导产生积极结果。


    这种社会会是什么样子的？百年前，我们只能模糊地想象拥有电动汽车、移动通信、基因工程能力以及飞往其他行星的火箭的世界会是什么样子。这些奇幻的想法曾是赫格·威尔斯和儒尔·凡纳等科幻作家的领域，但今天它们充斥着我们的物理世界。

