    推广加密代币的技术包括：活动；信息说明会；网络研讨会；邮件列表；新闻稿；Telegram、WhatsApp 等平台上的活跃管理群组；新闻采访；派对；数字广播式营销噱头，以及只要一群聪明才脑能够构思出的任何其他东西。皮特·巴纳姆（PT
    Barnum）会为此感到自豪。


    许多代币发行者已经筑起防御墙，以对抗限制这些活动的努力，他们坚持出售数字资产的权利是一项基本自由。


    ## 情绪高涨


    人们对区块链技术投入的情感甚至超过了最虔诚的苹果产品粉丝，而这些人以以一种不雅体的方式迷恋电子产品闻名。区块链协议已经达到了意识形态的高度，愤怒的派系有时互相投掷言辞，其速度仅略比活跃冲突区的子弹慢一点。


    互联网上的“口水战”随处可见。最近关于“代币”定义的一次争论中，一个书呆分子坚持认为它们只是价值存储和传输的单位（这比监管机构使用“代币”一词的定义要窄得多），而一个开玩笑的人则将其称为“在游戏厅里用来玩吃地鼠大战、吃豆人等游戏的替代币”。


    阴谋论在一个反文化社区中泛滥是意料之中，这个社区包含了许多对大政府和大型机构表示怀疑的人，他们将加密货币视为打破政府对货币控制的手段。几年前，麻省理工（MIT）被一位“加密威胁分析师”指控为秘密试图破坏比特币。方便的是，根据这位“威胁分析师”的说法，没有人可以公开记录这个破坏比特币的计划，因为存在保密协议（这些协议并不存在，但如何证明事实不存在呢？）。


    这种指控特别不公平，因为当比特币基金会崩溃时，MIT 媒体实验室介入资助核心开发人员，通过数字货币倡议帮助保持了社区的活力和生命力。MIT 近来一直在承接行业倡导工作，以确保
    `bitcoin` 免受严厉的政府监管行动。这不是游说（游说针对特定的立法行动和/或监管放宽，且需要注册），而是向政治家和监管机构提供背景信息。


    但为什么要让事实阻碍一个好故事呢？就像地平论者和登月造假争论者一样，加密社区的某些元素只有在面对证据时才会更加疯狂地固守他们的偏执。


    ## 中本聪是谁？


    没有什么比 `bitcoin` 发明者——名为 `中本聪`（Satoshi Nakamoto）的神秘身份更具炒作了。关于他真实身份的推测范围从一群共同工作的开发者到无数个“比特币核心”开发者不等，每个人都被推崇为
    `bitcoin` 的创始人。


    似乎每隔几个月就会有一个新人声称拥有这一头衔。澳大利亚人克雷格·莱特（Craig Wright）提议证明自己的身份，获得了 `bitcoin core` 开发者加文·安德森（Gavin
    Anderson）的支持——据称他是最后一个已知与 `Nakamoto` 有过联系的人——但 `Anderson` 现在已撤回了这一支持，并后悔自己参与了其中。


    最近，一位巴基斯坦年轻人声称拥有这一头衔，暗示他创建 `bitcoin` 是为了响应其父亲担任高管的国际商业银行的倒闭。方便的是，存有 980,00 万枚比特币及其私钥的笔记本电脑（价值曾超过
    150 亿英镑）由于硬盘崩溃而“报废”，无法使用，而且他的电子邮件据称被黑客入侵，这意味着无法通过这种方式站出来验证自己的身份。


    这几乎无关了。今天的 `Bitcoin` 一方面由几百名开发人员的核心控制，他们管理代码库；另一方面由六个矿矿小组或“矿池”整合了生产。这两个小组对于如何升级
    `bitcoin` 以突破其容量和速度限制无法达成一致，导致代码“分叉”为 `bitcoin` (`BTC`) 和 `bitcoin cash` (`BCH`)。区块计算已经变得如此复杂，以宿舍里的本科生无法再连接一台低端笔记本电脑并在矿业市场上进行有效竞争：需要具有先进计算能力的专业机构。


    而原始的 `bitcoin` 代码库有点简陋。可以认为，之后出现了更优雅的协议，无论是用于大规模数据存储星际文件系统（`IPFS`）方法，还是以太坊的分布式应用（`DApp`）能力。


    在 `bitcoin` 诞生以来出现的更加复杂的区块链世界中，`Nakamoto` 的身份与其说是其他，不如说是历史上的奇闻。


    ## 追逐热度火车


    咨询公司高纳（Gartner）认为，所有新技术都会经历一个可预测的热度周期：预期增长、过度夸大的承诺、在发现令人失望的真相后的绝望，然后在技术实际应用部署后进入生产力平台期。区块链技术可能已经过了其绝对顶峰，但考虑到持续收到善意投资者资金的项目性质，其吸引力周围仍然环绕着一些泡沫。


    区块链既比其声称的的多，也比其声称的少。


    敏锐的执行官必须能够区分有意义的商业机会与另一个由庞氏骗局支持的“虚假软件”（vapourware）。不要误会：区块链革命提供了大量的这两者。


    为了帮助从杂质中筛选出有价值的金子，我的同事 Meltem Demirors 和我开发了一套框架，以便快速理解区块链协议和技术——我们称之为“牛津区块链框架”（the
    Oxford Blockchain Frameworks）。我们将在下一章中详细讨论这些内容。


    ### 章节摘要


    在本章中，我们涵盖了：


    ◆ 开源社区开发模型在服务投资者关系方面有时会走过头。


    ◆ 一些特别热情的区块链倡导者所支持的意识形态观点。


    ◆ 为什么 `Satoshi Nakamoto` 的真实身份无关紧要


    ## 第 3 章


    ## 牛津区块链框架


    ### 你需要知道的


    ◆ 通过应用新的策略框架，可以更容易理解区块链


    ◆ 牛津区块链策略框架 (`OBSF`) 帮助你理解是否需要区块链，以及给定技术位于业务系统的哪个部分


    ◆ 有效监管的最佳实践可以帮助你评估和/或设计监管背景


    在理解区块链对现有系统的影响以及如何评估新的区块链技术时，我的同事和我生成了一系列框架来理解区块链相关的策略和监管。


    长期合作伙伴 Meltem Demirors 与牛津区块链项目的共同创立了牛津区块链策略框架。


    区块链运行在相互连接参与者的复杂网络中，区块链公司（并非所有都维护自己的协议）位于这个生态系统的某个位置。


    ### 你需要区块链吗？


    我们在评估一个业务用例时采取的第一组步骤是弄清楚业务是否需要区块链——或者说，是否需要任何形式的分布式账本。


