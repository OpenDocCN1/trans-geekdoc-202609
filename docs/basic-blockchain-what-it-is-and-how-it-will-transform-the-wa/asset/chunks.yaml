- fmt: '

    The ability to issue and manage currency is one of the most jealously guarded
    prerogatives of government. Indeed, the management of government financial obligations
    and government bonds is a critical tool to fund policies, programmes and pay for
    the society a government represents. It is unsurprising that governments are now
    experimenting with the creation of digital versions of their fiat: central bank
    digital currencies (`CBDCs`). Unlike the public and permissionless blockchains
    of `bitcoin` and `Ethereum`, these `CBDCs` are permissioned blockchains. Proponents
    of `CBDCs` argue that they could facilitate financial inclusion, that they could
    introduce greater transparency into society, and could reduce corruption and improve
    public trust.


    And yet there are fundamental issues with the idea of launching `CBDCs` if we
    fail to fully consider the role of banks in the overall financial system.


    Professor Alex Lipton argues a ‘theory of monetary circuit’. In it, he describes
    how money is created. Not, as one might assume, by government. Governments can
    create currency by printing more notes. This is an inflationary act; these new
    notes are ultimately spread across the same amount of economic value. Monetary
    circuit theory posits that money is created by banks. In its simplest form, we
    look at the difference between interest paid and interest income. Banks borrow
    money from the central bank at a very low rate and use it to fund banking activities.
    When consumers make deposits, the bank is paid some amount of interest (setting
    aside the recent phenomenon of negative interest rates) that is higher than the
    interest rate the bank pays to the central bank. When another consumer takes out
    a loan from the bank, the bank uses its deposits to fund this loan, and charges
    interest at a higher rate than the consumer making the original source deposit.
    The difference between these two figures – the interest paid to the depositor
    and the interest due from the loan recipient – is the creation of new money. Economic
    value, arguably, has been created by the bank.


    In a world where there are no retail banks – a world in which you store your money
    in the `CBDC`, you borrow from the same blockchain network and even make loan
    payments automatically through `smart contracts` – where is the creation of new
    money?


    ### **AUTOMATING LAW**


    A band of computer programmers and lawyers at various institutions are working
    to create computational law, to create means for law-as-code. The future is already
    here, even if it’s unevenly distributed.


    What if we integrate technology even more into the legal system, by turning `smart
    contracts` and `DApps` into actual algorithmic or computational law? What if entering
    into a legal agreement meant establishing paired algorithms, one representing
    each party, that could automatically verify and adjudicate disputes, and digital
    tokens were used to resolve payment due from one party to another? In this model,
    the essence of legal principles would be turned into computer code, and that code
    put into a network with other code so that all of the details of a legal agreement
    among parties would be automated. What if `blockchain` were the foundation layer
    across which this computational law expressed itself, becoming the network that
    enables algorithmic (computer-driven) law?


    These ideas aren’t so radical as they may sound at first.


    A hot area at the intersection of government and blockchain is that of revenue
    generation, specifically tax. Trust and transparency are paramount in the payment
    and collection of tax. Tax typically forms the core revenue of a government, and
    the ability to accumulate tax is central to a government’s ability to deliver
    its services, whether that be healthcare or a justice system or farming subsidies.
    Taxation is both the prerogative and the lifeblood of government, providing the
    tangible means by which policies are funded.

