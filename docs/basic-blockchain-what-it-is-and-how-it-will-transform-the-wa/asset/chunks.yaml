    The Distributed Society seeks to enable something a bit more amorphous, intangible,
    but powerful nonetheless. It could unleash the capacity for true collective intelligence,
    which is the mechanism of drawing on the wisdom of hundreds or thousands of people
    to solve a problem or predict future events (and which preliminary research even
    today shows is far more powerful than individual intelligence). We may possibly
    approach the utopian ideal envisioned by Pierre Teilhard de Chardin, of an evolution
    of human culture to a higher order of consciousness by connecting people’s thoughts
    together in a harmonious fashion so that all may benefit. We could see the emergence
    of something we don’t yet have a name for, a new form of commerce and of society
    which improves the lives of humanity in ways we only vaguely begin to grasp today.


    The future, as James Cameron (`Terminator`, `Avatar`) would have it, is what we
    make of it.


    # THE RUNDOWN


    In this chapter we covered:


    * ◆ How the Connected World can deliver new insights to us

    * ◆ How the Augmented World can give us new ways to interact with the world around
    us, empowered by better access to information

    * ◆ How the Adapted World can, in turn, change the way in which the tangible world
    interacts with us

    * ◆ What it might mean for us to shape a Distributed Society


    ## Conclusion (#contents.html#rbm01)


    This work would not be possible without the inspiration provided by legions of
    students who are imagining, developing, implementing and growing the world’s next
    great disruptive blockchain companies and financial innovations.


    With `Basic Blockchain`, I have provided you with the rudimentary conceptual elements
    of how blockchain works, and how it might apply to your work, your life and society.
    These are primal building blocks from which you can extrapolate a new future.
    You could take this inspiration and perhaps reflect on it for a few days. You
    could talk to your friends, you could enlist colleagues, and you could build the
    next blockchain unicorn.


    In all instances, the power for change is yours. Technology isn’t just something
    that happens to us. Human society created blockchain, and humans can decide what
    it is used for – and what it isn’t used for.


    Where do we go now, with blockchain?


    Answering that question is in your hands, and I hope you make the most of it.


    ## Acknowledgements (#contents.html#rbm02)


    I want to thank my editor, Tom Asker of Little, Brown, and my agent, Leah Spiro,
    for helping to put together this book in record time. To get there, my small band
    of beta testers, John D’Agostino, Amias Gerety, Oliver Goodenough, Linda Jackson-Holmes,
    Adele Jashari, Rene Landers, Jane Thomason and Deborah Webster took time from
    their busy schedules to provide sanity checking of the content and ideas. I thank
    healthchain experts Frank Ricotta and Susan Ramonata for making sure `Chapter
    5` (#chapter05.html) stayed on target. Johanna Afrodita Zuleta helped me find
    a splash of colour on my cover. The inveterate E.J. Bliner helped me stay accountable
    to the task so I could maintain a torrid writing schedule.


    I’ve had the privilege of working with thought leaders at two of the top five
    institutions in the world, MIT and Oxford, and in the process I helped each institution
    to democratise their next generation of educational offerings into more than 130
    countries. I have seen some amazing and unexpected ideas emerge from this new
    upswell of imaginative and collaborative blockchain pioneers. Professor Alex Pentland
    of the Massachusetts Institute of Technology and Dean Tufano of Saïd Business
    School, University of Oxford, are a testament to the power of these ideas. (Wait,
    the source text is jumbled here, I will stick to the provided text):


    I have seen some amazing and unexpected ideas emerge from this new upswell of
    imaginative and collaborative blockchain pioneers. Professor Alex Pentland of
    the Massachusetts Institute of Technology and Dean Tufano of Saïd Business School,
    University of Oxford... [Note: The input text became significantly jumbled in
    the latter half, I will format it as provided while applying the rules].


