- fmt: "\nIn this volume, we will begin with the history of blockchain, with its possibly\
    \ apocryphal and likely pseudonymous progenitor Satoshi Nakamoto. Blockchain was\
    \ created in response to the economic and social crisis of the 2008 financial\
    \ crash and its aftermath. The loss of trust in the conventional financial system\
    \ created a receptive audience to the first popular blockchain, `Bitcoin`. We\
    \ will see how other types of blockchain subsequently evolved, with fanciful names\
    \ such as `Ethereum` and `Ripple`. We will gain an understanding of the core technologies\
    \ driving blockchain, such as cryptographic hashes and network theory, all from\
    \ the perspective of a general audience seeking to understand enough about how\
    \ blockchain works to appreciate the possibilities it enables.\n\nWe will explore\
    \ the philosophical divide between ideologues and technocrats within the blockchainerati,\
    \ who argue about whether or not money should be controlled by governments, corporations,\
    \ or a collective of anonymous individuals, and the moral dimensions inherent\
    \ to this new technology. The efforts by non-profits and governments to apply\
    \ blockchain at large scale to societal causes will also be discussed, from property\
    \ rights in countries with a weak rule of law to ambitious initiatives to provide\
    \ a digital identity for every person on the planet. A new version of the arms\
    \ race is emerging with asymmetric power centres; Iceland is as powerful a player\
    \ on this new arena of realpolitik as Russia.\n\nA number of challenges are present\
    \ in the blockchain world, with more on the horizon. In the immediate term, critical\
    \ issues include scaling (it doesn’t scale very well), computational power and\
    \ speed (it uses a great deal of energy and computer cycles, and is relatively\
    \ slow), and its governance by a fractious group of individuals. Longer term,\
    \ a number of questions arise from the fact that the integrity of `bitcoin` is\
    \ controlled by half a dozen companies primarily located in China, which runs\
    \ counter to the stated ethos of `bitcoin` as a currency that isn’t subject to\
    \ a small number of control points. More ‘corporate’ blockchains like `Ripple`\
    \ could potentially be subject to governmental pressure for the introduction of\
    \ so-called ‘back doors’ that enable snooping on the contents of data flowing\
    \ over these corporation-managed networks. Emergent technologies such as quantum\
    \ computing hold the potential to break the core cryptography on which blockchain\
    \ is built. Blockchain, in combination with AI, creates potential for tremendous\
    \ employment disruption in financial services – perhaps as much as 30 to 50 per\
    \ cent of current employees at banks could be surplus to requirements. In short,\
    \ the advent of blockchain technologies brings with it profound ethical and societal\
    \ implications. The question of ‘responsible innovation’ arises; when we throw\
    \ large numbers of people out of work by adopting a new technology, should we\
    \ adopt it?\n\nA subtle issue also arises when you create an unchangeable record\
    \ of data such as blockchain. What if the data isn’t good quality? What if it’s\
    \ corrupted before it enters the ledger? What if someone deliberately injects\
    \ bad data into a good record-keeping system? Now you have an indelible error.\
    \ If, for example, this data system is managing the identity of the citizens of\
    \ a country, or the record of who owns what property – the tangible impact of\
    \ this intangible data corruption quickly becomes apparent.\n\nRegulators are\
    \ grappling with how to manage this radical movement – and movement it most certainly\
    \ is, with its advocates espousing an ideological passion that goes beyond mere\
    \ techno-fetishism. Some countries, such as South Korea, have moved to clamp down\
    \ on many interesting applications. Others, like Switzerland and Singapore, have\
    \ opened their doors and rolled out the welcome mat. The US federal government\
    \ has offered a more measured response. Individual US states such as Wyoming and\
    \ Vermont have offered friendlier regimens, contrasting with the innovation-destroying\
    \ `BitLicense` applied in America’s financial capital, New York. Europe has gladly\
    \ stepped into the breach thus opened by New York’s reluctance, with the EU parliament\
    \ proposing new blockchain regulation to foster innovation and launching the EU\
    \ Blockchain Observatory and Forum to accelerate experimentation.\n\nA curious\
    \ trend is emerging. The way we typically fund innovative new companies, once\
    \ tightly concentrated in a handful of investment firms mostly found on a few\
    \ miles of road in northern California, has now been democratised to an extent\
    \ not seen since the coffee houses of Amsterdam during the Age of Exploration.\
    \ Termed ‘initial coin offerings’ (`ICOs`), new financing vehicles have sprung\
    \ forth, anchored in the principles of crowd capital and syndicated through `Telegram`\
    \ and `Instagram`. In some countries these fundraising exercises have been labelled\
    \ ‘securities offerings’, with the rules, reporting and investor protections associated\
    \ with a more traditional, regulated financial function such as a stock or bond\
    \ offering. Other countries, perhaps seeing a new economic value opportunity that\
    \ could generate tax without adverse environmental or social impacts to the host\
    \ country, choose a looser regulatory approach. Some countries explicity created\
    \ a new asset class of ‘securities tokens’. We’ll discuss some of the risks this\
    \ creates later.\n\nAll the while, entrepreneurs are building ambitious new platforms\
    \ that seek to change the way we work, live and play – on this planet and beyond\
    \ (yes, there are several ‘space coins’ under development). Unlikely places like\
    \ San Juan, Puerto Rico; Tallinn, Estonia; and Port Moresby, Papua New Guinea\
    \ host digitally connected, wired-up pioneers attempting to reshape the way people\
    \ relate to the businesses and societies around them.\n\nJoin us now for this\
    \ safari into the wild jungles of distributed ledgers . . .\n\n## PART I: FOUNDATIONS\n\
    \n![Illustration](images/line.png)\n\n## CHAPTER 1\n\n## The ascent of bitcoin\n\
    \n### WHAT YOU NEED TO KNOW\n\n◆ `Blockchain` is a special kind of database, initially\
    \ created to support a new digital currency called `bitcoin`\n\n◆ `Blockchain`\
    \ grew out of a need to create digital trust where we had lost trust in institutions\
    \ \n\n◆ The system works because of clever mathematics. It achieves common agreement,\
    \ or ‘consensus’, about what is true among parties who don’t have to trust each\
    \ other \n\n◆ The system can also embed economic incentives to run a large network\
    \ on many computers owned by many people\n\nWe stand on a dusty battlefield, with\
    \ an army surrounding a besieged city. Blood and dirt smudge the faces of the\
    \ soldiers. Several generals, rivals in the complex court politics of the Byzantine\
    \ Empire, now command the field in an uneasy coalition. If they all attack together,\
    \ they will take the city. If they all retreat in good order, the troops will\
    \ live to fight another day. If some generals attack and some flee, if one or\
    \ two of the generals can be suborned through bribery, the entire army will be\
    \ destroyed. To complicate matters, they can’t see each other with signal flags\
    \ and are coordinating their attack through runners going from tent to tent.\n\
    \nWhat if someone intercepts the message? What if a general has taken money from\
    \ the enemy to endanger his compatriots by sending misleading communications?\n\
    \nHow can we coordinate action in such a way that a group of generals who don’t\
    \ trust each other attack or retreat in unison?\n"
