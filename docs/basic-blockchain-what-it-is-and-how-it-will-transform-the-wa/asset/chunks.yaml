- fmt: '

    Techniques for promoting crypto tokens include events; information sessions; webinars;
    email lists; press releases; actively managed chat groups on Telegram, WhatsApp
    and other platforms; news interviews; parties; digitally broadcast promotional
    stunts; and practically anything else an array of clever minds are able to conjure
    up. PT Barnum would be proud.


    A number of token issuers have taken to the barricades to combat efforts to constrain
    these activities, insisting that the right to sell a digital asset is a fundamental
    liberty.


    ## PASSIONS RUN HIGH


    The emotions that people attach to blockchain technologies exceed those of even
    the most devout Apple addicts, who are known to fetishise electronics in an unseemly
    manner. Blockchain protocols have achieved ideological proportions, with angry
    factions at times slinging words at a rate only slightly less rapid than bullets
    in an active conflict zone.


    Internet ‘flame wars’ abound. A recent dustup about the definition of tokens saw
    a pedant insisting they were only units for the storage and transfer of value
    (a narrower definition than how regulators are using the term ‘token’), while
    one jokester dubbed them ‘a replacement coin in an arcade hall used to play Dig-Dug,
    Pacman and other games’.


    Conspiracy theories are unsurprisingly rampant in a countercultural community,
    one that includes a number of people suspicious of big government and big institutions,
    seeing cryptocurrency as a means of breaking free from government control of money.
    MIT was accused by a ‘crypto threat analyst’ a few years ago of secretly trying
    to undermine bitcoin. Then, conveniently, according to this ‘threat analyst’,
    no one could talk on the record about this plot to destroy bitcoin because of
    nondisclosure agreements (NDAs that didn’t exist, but how does one prove a negative?).


    The accusation was particularly unfair because when the Bitcoin Foundation imploded,
    the MIT Media Lab stepped in to fund core developers, helping keep the community
    vibrant and alive through the Digital Currency Initiative. MIT has more recently
    been underwriting industry advocacy efforts to keep `bitcoin` out of tight government
    regulatory action. This is not lobbying, which is geared towards specific legislative
    action and/or regulatory relief and which requires registration, but rather providing
    background information to politicians and regulators.


    But why let fact stand in the way of a good story? Like the flat-earthers and
    the moon-landing hoaxers, certain elements of the crypto community only cling
    more fiercely to their paranoia when confronted with evidence.


    ## SATOSH-WHO?


    Nothing has attracted more hype than the mystery of `bitcoin`’s inventor, known
    as `Satoshi Nakamoto`. Speculation about his true identity ranges from a group
    of developers who all work together to any number of ‘bitcoin core’ developers,
    each being put forward as the progenitor of `bitcoin`.


    Every few months, it seems, there is a new claim to the title. Australian Craig
    Wright offered to prove his, garnering support from `bitcoin core` developer `Gavin
    Anderson` – purportedly the last person known to have communicated with `Nakamoto`
    – which `Anderson` has now rescinded while regretting that he became involved.


    More recently a young Pakistani man claimed the title, suggesting he created `bitcoin`
    in response to the collapse of the Bank of Credit and Commerce International where
    his father was an executive. Conveniently, the laptop housing 980,000 bitcoin
    along with their private keys, worth at one time more than £15 billion, was ‘bricked’,
    rendered unusable thanks to a crashed hard drive, and his emails were purportedly
    hacked, meaning he couldn’t step forward and verify his identity that way.


    It almost doesn’t matter. `Bitcoin` today is controlled by a core of a few hundred
    developers on the one hand, who manage the code base, and half a dozen mining
    groups or ‘pools’, who have consolidated production. These two groups can’t agree
    on how to upgrade `bitcoin` beyond its capacity and speed limitations, leading
    to a ‘fork’ of the code into `bitcoin` (`BTC`) and `bitcoin cash` (`BCH`). Block
    computation has gotten so complex that no longer can an undergraduate in a dorm
    room connect a low-end laptop computer and compete effectively in the mining marketplace:
    professional organisations with advanced computational capabilities are needed.


    And the original `bitcoin` code base was a bit of a hack. Arguably more elegant
    protocols have emerged since, whether it’s the Interplanetary File System (`IPFS`)
    approach to largcale data storage or the distributed app (`DApp`) capabilities
    of `Ethereum`.


    In the new, more complex world of blockchain that has emerged since `bitcoin`’s
    inception, `Nakamoto`’s identity is more of a historical curiosity than anything
    else.


    ## RIDING THE HYPE TRAIN


    Consulting firm Gartner has posited that all new technology goes through a predictable
    hype cycle of rising expectations, overinflated promises, despair on discovering
    the disappointing truth, and then some productivity plateau when the real applications
    of the technology are deployed. Blockchain technology may be past its absolute
    peak, but still has a bit of froth surrounding its appeal given the nature of
    projects that continue to receive funding from well-intentioned investors.


    Blockchain is both more, and less, than it is purported to be.


    The discerning executive must be able to tell the difference between a meaningful
    business opportunity and another piece of vapourware backed by a Ponzi scheme.
    Make no mistake: the blockchain revolution offers ample helpings of both.


    To help weed through the dross for the valuable nuggets, my colleague Meltem Demirors
    and I have developed a set of frameworks to facilitate rapid understanding of
    blockchain protocols and technologies – what we term the Oxford Blockchain Frameworks.
    We’ll discuss these in more detail in the next chapter.


    ### THE RUNDOWN


    In this chapter we covered:


    ◆ How open-source community development models have sometimes gone too far in
    the service of investor relations


    ◆ The ideological views espoused by some particularly passionate blockchain advocates.


    ◆ Why `Satoshi Nakamoto`’s true identity is irrelevant


    ## CHAPTER 3


    ## Oxford Blockchain Frameworks


    ### WHAT YOU NEED TO KNOW


    ◆ It can be easier to understand blockchain by applying new strategy frameworks


    ◆ The Oxford Blockchain Strategy Framework (`OBSF`) helps you understand whether
    you need a blockchain, and in what part of the business system a given technology
    is situated


    ◆ Best practices of effective regulation can help you assess and/or design the
    regulatory context


    In understanding blockchain’s impact on incumbent systems, and how to evaluate
    new blockchain technologies, my colleagues and I have generated a series of frameworks
    to understand strategy and regulation with respect to blockchain.


    Meltem Demirors, a frequent collaborator, and co-creator of the Oxford Blockchain
    Strategy Programme, has crafted the Oxford Blockchain Strategy Framework.


    Blockchains operate within a complex network of interconnected participants, and
    blockchain companies (not all of whom curate their own protocols) fit somewhere
    within this ecosystem.


    ### DO YOU NEED A BLOCKCHAIN?


    The first set of steps we take our students through in assessing a business use
    case is to figure out whether the business needs a blockchain – or, indeed, any
    variant of distributed ledger.

