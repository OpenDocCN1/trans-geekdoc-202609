    reducing costs for claims processing. A blockchain-based risk pool would require
    dramatically fewer people and lower cost compared to conventional insurance.


    ##### **Institutional applications**


    Blockchain can enable significant improvements to speed, cost and compliance in
    the trading of securities, and other institutional applications.


    ##### *Settlement and clearing*


    Settlement and clearing consist respectively of the acts of transferring funds
    and updating records to reflect the ownership of securities. This is a notoriously
    records-intensive and heavily intermediated process, with multiple stakeholders,
    that can be dramatically streamlined through the application of distributed ledgers
    and digital tokens. Juniper research believes blockchain could drive a £22 billion
    reduction in the annual cost of settlement.[^(18)](#bm05.html#en18) The amount
    of financial trade fraud potentially mitigated by blockchain, according to IBM,
    could exceed £11 billion per year.[^(19)](#bm05.html#en19)


    ##### *Derivatives*


    Derivatives contracts are now being stood up and settled automatically using blockchain,
    creating new efficiencies to improve the speed of money within financial trading.
    Derivatives contracts operate under a certain set of conditions to settle or resolve
    themselves, which could be tied to code instead of requiring people to manually
    verify them. Even with certain kinds of commodities, such as futures contracts
    on delivery of crude oil, where physical delivery of the good is required to settle
    the contract, adding smart data systems tied in to derivatives could address most
    of the traded contracts. Specifically, you would use Radio Frequency (RFID), GPS
    and artificial intelligence together. It would require a change in behaviour,
    and a change in technical infrastructure, but given that the dollar value of open
    interest is equivalent to more than £163 billion, it is being seriously evaluated.


    ##### *Value transfer*


    Blockchain has tremendous potential to improve inter-institutional value transfer.
    Global financial institutions trade large volumes of currency with each other.
    When a consumer sends money overseas, their host institution and the recipient’s
    destination institution need to work with each other to settle the transaction,
    typically involving other intermediaries as well such as a correspondent bank.
    They don’t do this one transaction at a time, like when John in Ireland sends
    £100 to Mary in South Africa. For efficiency, the transactions are gathered up
    at the end of the day, and the banks engage in a process known as ‘netting’ where
    they calculate the residual value transfer (taking the ins and the outs, and then
    seeing what’s left over – does HSBC owe an extra £100 million to JP Morgan at
    the end of the day, or is it the other way around?). This predictable, repeatable
    process, involving fixed steps and reconciliation of documentation, could just
    as easily be handled by a blockchain as it could by an army of accountants. Blockchain
    infrastructure provider Ripple estimates there is more than £8 trillion of global
    liquidity ‘trapped’ in the funds flow among institutions and governments as money
    crosses borders,[^(20)](#bm05.html#en20) and they have designed a high-capacity
    protocol (one that can process transactions faster than bitcoin) to specifically
    address this issue.


    ##### **Infrastructure applications**


    Blockchain systems offer the possibility of eliminating a significant amount of
    labour and inefficiency inside a financial institution or financial market provider.


    ##### *Exchanging places*


    Some securities exchanges are now beginning to experiment with putting the entire
    exchange onto a blockchain. While it will be some time before we can anticipate
    replacing the entire infrastructure of a major market like the NASDAQ or the Deutsche
    Bourse, smaller markets are beginning to dip their toes into the water.


    ##### *Compliance*


    Compliance is another area where blockchain can dramatically improve what has
    become a crushing burden to global financial institutions. According to McKinsey,
    compliance costs have spiralled past US$220 billion per year and continue to grow.
    Blockchain-based identity systems tied back to compliance functions could eliminate
    a significant portion of this cost. Just on Know Your Client (KYC), BIS Research
    estimates £4 billion or more of annual savings through blockchain.[^(21)](#bm05.html#en21)


    ##### *Personal data assets*'
