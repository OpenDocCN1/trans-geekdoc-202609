    开源计算和高度分布社区项目的遗产为区块链潜力的扩张提供了坚实的基础，这种扩张从事实和数字的组织扩展到人类系统塑造为新的、灵活、富有创意且快速变化的形式。组织对快速响应变化和市场日益增长的需求，为采用新的、不同的方法使个人群体以协调的方式移动提供了动力。


    ### 众志成城


    开源计算的诞生于对计算机软件开发日益企业化的不满。许多帮助塑造计算机技术的原始黑客来自 20 世纪 60 年代和 70 年代美国一种悠闲的、几乎是嬉皮士式的反主流文化。其中一个这样的标志性人物——计算机科学家理查德·斯尔曼（Richard
    Stallman）47 想要为一个常见问题实现一个简单的变通方案：当共享打印机卡住时，向组中的所有人发送消息，以便有人可以修理它。他发现他们新激光打印机的软件是“封闭”的，且是专有的——禁止修改。这种以及其他限制信息的努力使他创建了一个开源操作系统，并促成了场运动的诞生。48


    斯尔曼在 20 90 年被埃里克·雷蒙德（Eric Raymond）继承，他的文章《大教堂与集市》成为他开始称为“开源”软件运动的战斗号召，并伴随着他的开源操作系统
    `Linux` 的发布。49 通过开源，软件的源代码（编写的指令）公开发布，供任何人免费使用。然而，社会契约是，如果你进行了改进，你需要将这些改进发布回代码中，以便其他人能够利用它们。与
    `Microsoft`（微软）等公司的专有软件许可模式不同，像 `Red Hat`（红帽）这样的开源公司通过销售增强开源软件实现的服务和解决方案来盈利。


    这导致了一些托管在 `Github` 等共享存储库上的大型项目，全球成千上万的软件开发者为代码添加贡献，并增强代码库，以造许多人的利益。MIT 许可证是目前最流行的开源软件许可证之一——这是一个关于如何管理随软件项目的知识产权的通用法律框架。


    关于什么内容被接受到开源代码库的决定由项目创建者确定。根据《开源指南》50，最常见的三个模型是：


    *   **终身仁君 (Benevolent Dictator for Life)**：由一个个人（通常是发起项目的人）做出关键决策

    *   **精英治理 (Meritocracy)**：对项目做出重大贡献的人做出关键决策并投票实施更改

    *   **自由贡献 (Liberal Contribution)**：当前最活跃的贡献者驱动过程，并通过达成共识的过程（而非纯投票）来实施更改


    这些管理开源项目的不同模型通常被考虑并应用于区块链项目，区块链项目本身通常也是开源的。


    ### 区块链僵局


    精英治理和自由贡献的变体已用于许多区块链项目，包括 `bitcoin`（比特币）。两者都导致了硬分叉的意外结果，作为区块链治理背后民主决策的输出，正如我们在第
    1 章 中讨论的那样。


    ### 组织决策


    精英治理和自由贡献的变体已用于许多区块链项目，包括 `bitcoin`（比特币）。两者都导致了硬分叉的意外结果，作为区块链治理背后民主决策的输出，正如我们在第
    1 章 中讨论的那样。


    （注：原文中存在大量重复段落，此处已根据核心内容进行翻译）

