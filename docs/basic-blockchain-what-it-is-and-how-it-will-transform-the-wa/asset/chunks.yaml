- fmt: "\nEven something as simple as knowing who a physician is, what their credentials\
    \ are and what private insurance they accept (important particularly in the US\
    \ market) is today fraught with data quality, timeliness and availability issues.\
    \ I once ran a business whose product kept up-to-date records of a physician’s\
    \ address and other contact information, what insurance they accepted and what\
    \ credentials they had. All of that could be largely or entirely automated with\
    \ the right distributed ledger.\n\n### PUBLIC HEALTH\n\nImprovements to population\
    \ health can be made with blockchain. While patient privacy needs to be protected,\
    \ there are also issues of public good to consider. Being able to access elements\
    \ of medical data across large populations of patients is highly desirable for\
    \ epidemiologists, so they can assess morbidity and mortality data, and for population\
    \ health interventions. With the right kind of blockchain protocol applied, disease\
    \ registries can become more dynamic and easier to manage, with better data governance.\n\
    \n### MEDICAL RESEARCH\n\nGoing beyond health services into the broader category\
    \ of health, in biotech, pharmaceutical research and medical research more broadly\
    \ it is not unusual for only positive results to be published by organisations.\
    \ But it is the negative data that is instructive as it helps to avoid waste and\
    \ accelerate drug or device development. Today, there is no effective, large-scale\
    \ mechanism for compelling pharmaceutical or biotech companies to share failure\
    \ data or any clinical data. With certain variations of blockchain technology,\
    \ specifically multiparty computation with secret sharing, it becomes possible\
    \ to facilitate the exchange of anonymised, critical data elements across patient\
    \ data sets, without revealing information that would lead to competition or privacy\
    \ issues. The details of this are beyond the scope of this book, but are covered\
    \ in part in our book *Trusted Data* mentioned earlier, as well as the 2016 white\
    \ paper ‘Blockchain and Health IT: Algorithms, Privacy, and Data’.\n\nSo, too,\
    \ blockchain and tokens can deliver a new model of clinical research, in which\
    \ we can obtain automatic capture of a patient’s consent to participate in the\
    \ study (an expensive and time-consuming process to manage), and the incentives\
    \ given to a patient to do so can be provided through digital tokens, facilitating\
    \ contribution of data to the trial.\n\nThis feeds into the broader category of\
    \ real-world evidence, a critical input for the long-term viability of the pharmaceuticals\
    \ and biotech industry, enabling patients to consent for their data to be used\
    \ as part of a study even after a drug has gone into the market. As new issues\
    \ with drugs or products surface, relevant or affected patients can be allocated\
    \ or moved into the research study rather than having to initiate a new trial,\
    \ wait for data collection, and then analyse the results years later. The clinical\
    \ data acquires a ‘time machine’ that effectively lets it press a rewind button,\
    \ letting clinicians go back and ask different questions about patient data without\
    \ having to re-enrol said patients or rerun a trial, through a different model\
    \ of patient engagement.\n\nWe see thus that the patient journey, both in emergent\
    \ (urgent/emergency) and chronic (recurring clinic/hospital visit) settings, can\
    \ be tracked accurately and the patient experience enhanced by the application\
    \ of blockchain. At the individual level, medical care of both the preventative\
    \ and interventive varieties is predicated on the acquisition of data (e.g. patient\
    \ vitals, history), the interpretation of data (diagnosis), and the recording\
    \ of progress over time (vitals, labs, etc.). But on a larger scale, for a variety\
    \ of reasons that span competitive and regulatory domains, critical information\
    \ about population health and clinical research remains trapped in inaccessible\
    \ forms.\n\nThe data-intensive applications that are starting to emerge in digital\
    \ health share a common hub, the patient, but unfortunately have fragmented the\
    \ storage of this data into silos. Blockchain in health can bring these scattered\
    \ bits of information together cohesively for the betterment of the individual\
    \ and of society. Data silos are starting to open up a bit under legislative pressure\
    \ in certain countries, but meanwhile the model of care is evolving globally from\
    \ a transaction-based model in many countries to more of a continuous-care engagement\
    \ model.\n\nSome bold visionaries imagine a ‘tipping point of transitioning to\
    \ a person-centric model’ as Frank Ricotta of Burst IQ puts it, where the various\
    \ elements of consumer health (services like those offered by DNA-testing company\
    \ 23andMe and other quantified-self products) combine with conventional clinical\
    \ care, propelled by precision medicine, artificial intelligence, connected devices\
    \ and other technologies.\n\nIn this paradigm blockchain could be the transport\
    \ and storage network that makes the disparate pieces of healthcare work together\
    \ smoothly to deliver better patient outcomes. Blockchain can also provide ratings\
    \ for data quality. For example, a pulse rate measured in a hospital by high-end\
    \ clinical equipment will be more accurate than your Apple Watch, but that consumer\
    \ device will almost always be with you, and so offers a larger set of observations\
    \ for a more complete assessment of the patient. Health data volume is increasing\
    \ exponentially, and blockchain married to intelligent code can deliver order\
    \ to the chaos of patient information.\n\n### THE RUNDOWN\n\nIn this chapter we\
    \ covered:\n\n- The relationship between personal health data and blockchain\n\
    - Select opportunities in domains such as clinical care and medical research that\
    \ may be expanded through the adoption of blockchain\n- A transformational opportunity\
    \ to use blockchain as part of a new model of person-centric health care\n\n###\
    \ CHAPTER 6\n\n### Energy and food\n\n#### WHAT YOU NEED TO KNOW\n\n- Blockchain\
    \ can help you understand in detail where something came from and how it is used,\
    \ which is known as provenance\n- In the energy sector this can enhance both the\
    \ production and delivery of energy, and make the financial markets around it\
    \ more efficient\n- In the food sector this can both augment food safety and improve\
    \ the economics for farmers\n\nBeing able to establish provenance is a key benefit\
    \ of an immutable ledger with a clear history of additions and modifications.\
    \ Provenance is quite simply the ability to trace where something comes from,\
    \ and who took possession of it at various points in time. \n\nFor example, conflict\
    \ diamonds are produced in war-torn regions, most commonly in certain countries\
    \ in sub-Saharan Africa. Their sale is used to fund further bloodshed, giving\
    \ them the sobriquet ‘blood diamonds’. The jewellery industry has agreed to a\
