    Some of the largest financial services institutions in the world have begun revising
    their accounting systems to allow for the value and management of personal data
    assets, a new asset class that is beginning to take shape at scale. The basic
    concept is that, particularly owing to new regulations like `GDPR` and `PSD2`
    in Europe and analogous constructs elsewhere, consumers will control their own
    personal data (not Mark Zuckerberg). This new architecture of who controls data
    leads to the question of how one manages personal data. In turn, this requires
    new systems within financial institutions to manage the data. Blockchain systems
    with appropriate cryptography can not only assist with the secure storage of sensitive
    personal data assets, but also the governance of that data itself to automate
    compliance with privacy regulation. Thomas Hardjono, Alex Pentland and I discuss
    the new data architecture for personal data and related systems in our book `Trusted
    Data` (MIT Press, 2019).


    Blockchain can completely reshape a financial services industry that is built
    on record keeping and intermediaries. The world’s largest financial services organisation
    for the post-trade world, the Depository Trust and Clearing Corporation (`DTCC`),
    would become obsolete almost overnight if the major exchanges and institutional
    shareholders adopted a blockchain system – which no doubt explains the `DTCC`’s
    extensive investments in blockchain research (not to mention the NASDAQ Exchange’s
    similar efforts).


    Millions of middle- and back-office jobs may be lost in the next five years owing
    to the adoption of blockchain, and the savvier financial services executives are
    preparing for the deluge. My anecdotal experience over the past few years bears
    this out: every time I meet an innovative, forward-thinking executive at a major
    financial services organisation, there is a 50 per cent chance they will leave
    within twelve months to start or work for a blockchain-related company.


    ## THE RUNDOWN


    In this chapter we covered:


    ◆ Financial services experiments with blockchain

    ◆ The institutional and infrastructural impact blockchain could have on the financial
    services, as well as ramifications for consumers

    ◆ Some of the potential effects of blockchain on the role of intermediaries


    ## Chapter 5


    ## Health


    ### WHAT YOU NEED TO KNOW


    ◆ The health industry is beginning a range of experiments around blockchain that
    can lower costs and improve care

    ◆ The most immediate applications relate to management of patient data and medical
    records for care delivery

    ◆ Other opportunities exist in clinical research that can reduce cost and speed
    up time to market for life-saving drugs

    ◆ Over time, there is potential for blockchain to fundamentally change how healthcare
    is delivered


    Blockchain technologies could be applied in the health industry in a scalable
    manner with high-impact results, such as improved welfare for patients and reduced
    running costs for healthcare systems.


    There are some interesting dynamics when it comes to personal data in the healthcare
    services. On the one hand, people want security and privacy where their medical
    information is concerned. Most domiciles have put in place regulation in law that
    governs how personal information can be shared, used and stored. The average consumer
    would want to know who has accessed their medical information and under what circumstances.
    Blockchain could provide an immutable record of who looked at a patient’s medical
    records, how often, and with what authorisation. Patient trust in the system can
    be enhanced because they have a greater insight into the governance of their data.


    We have seen a number of instances of the violation of personal data privacy through
    improper access to personal health records, notwithstanding the global emergence
    in recent years of new health data privacy regulations that are accompanied by
    stiff penalties. First, the patient needs to know there was a violation, and second,
    he or she typically needs to go through a laborious grievance and investigation
    process. A blockchain audit trail could offer consumers greater insight as to
    who accessed their information and when it was made available, and with the help
    of artificial intelligence blockchain could provide better monitoring and alerts
    than current data systems.


    On the other hand, there are instances where a consumer wants quick access to
    health information. For example, if you are having a medical emergency, you don’t
    want to have to wait to access your information. You want a ‘break-glass-in-case-of-emergency’
    capability. Or if you want to move healthcare providers, you want to easily consolidate
    and migrate your personal health records. Many medical providers still use fax
    machines, even in the third decade of the twenty-first century, an antiquated
    remnant of the era of paper records that can and should be replaced by secure
    blockchain protocols. Even in single-payer systems, patient access to data has
    proven highly problematic.


    ### OPEN THE MEDICAL RECORD


    In today’s health systems in many countries, accessing your own medical record
    is challenging because, for competitive reasons, the healthcare companies that
    provide electronic medical records have deliberately designed their systems to
    be incompatible with each other. Opening up this closed architecture through blockchain
    enhances the portability of the personal health record, making it easier for consumers
    to get better and more cost-effective healthcare because now they can more easily
    move their care from one provider to another, or more easily see specialists and
    get the treatment they need more quickly.


    ### IMPROVING THE CARE EXPERIENCE


    Within the hospital or clinic, transitions in care – the moments when a patient
    is handed from one medical provider to another, or moves from one department to
    another, for example going from the emergency department to the Intensive Care
    Unit (`ICU`), or from the hospital to a rehabilitative or outpatient clinic –
    are a major source of medical error, hospital-based injury and sometimes even
    death. Data slippage is often the cause: did the doctor or nurse know about an
    issue or allergy? Was the correct procedure performed? When you have your leg
    amputated, your healthy leg is marked with a black magic marker so the surgeon
    knows where to cut . . . Foolproof, perhaps, but is this the best we can do in
    the digital age? Better data systems, such as a distributed database, could help
    consolidate and highlight key medical information more seamlessly across the cycle
    of care.


    ### REDUCING WASTE AND FRAUD


    Medical fraud costs more than £324 billion per year, according to the World Health
    Organization. As with other areas, we can remediate this through blockchain’s
    ability to provide an immutable record and tie together disparate pieces of data
    that, had they remained separate, would obscure the truth. One area of fraud is
    miscoding of diagnosis – a person has one condition, but in utilisation-based
    models, a provider might code a different condition that it costs more to treat.
    Blockchain would dramatically improve reconciliation of treatment and billing
    data. Statistical analysis of payment and treatment patterns would enable insurance
    companies and governments to do a better job of detecting anomalies.


    ### LONG-TERM SAFETY


    The quality and safety of a medical device can be tracked by companies like `Spiritus
    Partners`, which uses blockchain to monitor the ownership, service history and
    any safety issues. Defective devices can be discovered and remedied in a fast,
    reliable and transparent fashion.


    ### BETTER REFERENCE AND CARE DATA

