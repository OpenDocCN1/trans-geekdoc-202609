    # 支付


    支付可能也可能不是你区块链的需求。如果你正在创建一个私有区块链来管理患者医疗记录数据的传输，或者你正在创建一个用于处理数字身份文件的政府区块链，那么你可能不需要支付功能（注意我用的是“可能”，因为我可以设想在上述两个示例中，你都有多种需要支付功能的场景）。如果你正在运行一个区块链以实现跨境汇款，根据定义，你将需要支付功能。但是，回到我们的整体协议设计考量，也许
    Ripple 可以提供这种支付通道，或者使用比特币。这些都是在评估协议层时需要考虑的决策。


    ## 网络层


    你区块链的基础位于网络层，该层构建在加载了区块链的节点之上。你对运行节点的人是否有限制或要求？任何人都可以向你的区块链写入数据吗，还是仅限于某些受信受信方？该区块链将如何与其他技术（例如企业
    IT 系统）集成？


    你的网络层还将处理存储问题。旧副本将如何归档？你是否受 GDPR 等隐私法规的约束？如果是，你如何在不可篡改记录的情况下处理隐私问题？ GDPR 方面的一种方法是将敏感隐私数据存储在链外，仅在区块链上（即“链上”）存放一个指针（一段告诉你要去哪里查找其余数据的代码，指向该数据）。如果有人选择“被遗忘”，你就会删除链外数据，这样指针现在就会指向一串无意义的字符。


    ## 应用层


    在应用层，我们的软件直接与终端用户接触。究竟是谁在直接与你的区块链交互？


    你还需要考虑新区块链如何成为你日常工作流的一部分。目前的组织结构是怎样的？用户在发布之前的行为是怎样的？用户是否需要改变行为来与你的区块链协作（如果需要的话）？


    在这一层，我们进入了技术采用和变革管理的领域。如果你确实需要实施组织或个人用户行为的改变，你的转型计划是什么，以让他们从旧行为转变为新行为？


    ## 监管


    在区块链领域，监管是不可避免的。


    如果你经营加密货币、数字货币、数字资产、证券代币、实用型代币、货币发行和数字资产交易所，你需要能够识别并理解你经营业务的特定司法辖区的“规则”，否则你将面临政府干预的严重风险。监管机构现在对区块链的细微差别变得敏感了。


    有机会通过审慎应用监管来主动塑造生态系统，或许在大规模应用上具有更大的影响。在世界许多司法辖区，监管机构正在审查其各自国家的监管缺陷，并开展能够推进其战略目标的试点项目和政策干预措施。


    在此时，值得讨论一下基于原则的监管系统与基于规则的监管系统的优劣。


    ### 基于原则的监管系统


    在基于原则的监管中，规则是以粗略线条概述的，使其解释具有一定的灵活性。监管的总体目标是显而易见的。公司和监管机构如何实施监管，更多地变成了双方之间的对话和艺术的应用，而非科学。基于原则的监管允许更灵活的框架，可以适应不同的情况和不同程度的监管竞争。


    当创新来袭时（如区块链），创新公司会参与一种被称为“司法辖区购物”的实践，寻求最佳的监管制度来推动增长。在区块链领域，马里求斯、百慕大、巴巴多和马尔他等小而灵活的国家通过展示监管的灵活性——既通过使现有法规适应新技术，又通过促进新的创新型监管——获得了超比例的回报。基于原则的监管还需要复杂的监管人员和公司内部合规专业人士来应对这种解释路径。


    ### 基于规则的监管系统


    基于规则的监管规定了为了实现合规必须进行的极其明确的活动。单个规则是显而易见的，但创建一个可以广泛应用并与监管目标挂钩的框架是一项更艰巨的任务。监管机构如何将高度具体的规则像补丁一样缝合在一起，以确保如提高金融包容性或金融稳定等结果？基于规则的监管系统更容易理解，因为市场参与者只需遵循清单即可确保自己合规，但在面对创新时，非常缓慢且容易产生惯性。区块链仍处于进化阶段，其各种衍生版本及其周围的业务生态系统正在快速变化。基于规则的系统不适合与区块链对接。


    ### 监管原语


    我们的第一个考量是查看监管原语，即在各种司法辖区作为有效监管基础的想法。


    如果你是一个面临监管的创新者，解码监管机构的首要目标并弄清楚如何展示你与预期监管结果的一致性将对你大有。如果你是一个监管者，你应该更容易地识别出你通过监管干预正在实现哪些关键目标。监管机构主动且有策略的方法包含了对结果的清晰规划。一个有效的监管机构可能会说，例如，“我们希望到
    2025 年让 80% 的人口拥有数字身份，而目前是 20%，并将使用区块链作为赋能技术来降低成本并改进跨机构的数据共享。”这可能会导致特定的干预，例如政府建立一套围绕区块链的数字身份标准，私有身份提供商可以寻求遵循这些标准，以满足市场需求。


    框架方法的要素有如下：


    1. 关注结果

    2. 保护所有利益相关者

    3. 培养信任

    4. 平衡竞争

    5. 促进创新


    #### 1) 关注结果


    你能识别出该特定法规的预期结果吗？它们易于衡量吗？你如何将市场参与者的特定行为与监管的目标结果对齐？


    #### 2) 保护所有利益相关者


    所有方（而不只是主要的市场参与者）都需要得到保护。这包含了消费者保护以及为企业提供支持。


    #### 3) 培养信任


    必须通过监管鼓励信任和透明度以实现稳定。当消费者有更大的信任时，会导致一个稳健和健康的金融体系。对机构的信任会导致就业机会创造、资本投资和外国直接投资。


    #### 4) 平衡竞争


    '
- fmt: '

    Fairness should be a regulatory objective; regulations should not favour one group
    over another. Balancing competition is a delicate and nuanced act, because there
    is significant risk of unintended consequences, but without balance a typical
    market or system will devolve into oligopoly, duopoly or monopoly. Without specific
    regulatory intervention to support new entrants, markets tend to aggregate the
    same way water will pool in a depression. Many competitive parties should be supported,
    as opposed to favouring a single group or a single class of competitors.


    ### 5) Promote innovation


    New ideas must be given space to evolve and grow, before being subjected to significant
    regulatory oversight. In some domiciles regulators deliberately turn a blind eye
    to experimentation as long as it does not egregiously violate key regulations,
    taking the stance that they want to allow innovation to occur around the edges,
    and only intervene when innovation grows to a certain scale. In other domiciles
    regulators have created specific programmes to encourage innovation, providing
    clear boundaries in which experimentation may occur with `safe harbour letters`.
    A safe harbour letter is written by a regulator and defines a set of permissible
    activities a company may engage in. The letter says the regulator won’t pursue
    enforcement action against the company if it stays within these defined rules.
    They are often used in areas where companies want to innovate.


    Regulator support of innovation can start with sandboxes or sandpits, which are
    defined environments in which companies can experiment and get feedback from the
    regulator, then move to a light-licence arrangement, and finally take on a full
    licence. In the United Kingdom banking sector, this progression takes the form
    of the `FCA Sandbox`, the `e-money licence`, and the `full banking licence`. These
    programmes represent a well-thought-out, highly structured set of stage gates
    for entrepreneurs.


    In my policy work with more than seventy governments around the world, I have
    found that while some governments prioritise one dimension over others – small
    countries have different needs to large countries, and different regions face
    different imperatives – the highly diverse priorities and regulations of numerous
    regulators can be distilled down to one or more of these elements.


    ### Evolving regulatory models and approaches


    As we see more sophisticated regulatory approaches emerging from a number of domiciles,
    it’s worth being aware of several common policy interventions that ease the burden
    of regulatory compliance for innovators. These include, but are not limited to:


    ◆ Standards and coordination

    ◆ Tiered licensing

    ◆ Safe harbour


    We’ll now explore these ideas in more detail. Why are they necessary? It is because
    of the difficulties of ‘harmonisation’. Harmonisation is the concept of bringing
    different countries’ laws into tight alignment. It is important when you have
    issues that span national boundaries, such as how cross-border fund flows are
    handled for investment securities in new instruments like `blockchain tokens`.
    However, it is exceedingly difficult for a variety of reasons ranging from the
    legal heritage of the particular domicile to the social and political context
    within each country; the problems grow exponentially as one moves from bilateral
    agreements to multi-country harmonisation. Instead, a selection of less tightly
    aligned, but fast and effective techniques, have evolved to move countries forward
    in a coherent fashion.


    ### Standards and coordination


    Organisations such as the `OECD` have been working to establish standards that
    can help regulators and policy makers in multiple countries navigate the use of
    blockchain. These broad principles, aligned across jurisdictions, allow each country
    to interpret the standard within its own legal and regulatory context, ensuring
    a level of consistency across different domiciles without the degree of line-by-line
    rigour full harmonisation requires.


    ### Tiered licensing


    The integration of new technologies can often present challenges for regulators
    and innovators alike, since the existing regulatory structures are often ill-designed
    to deal with new and disruptive technologies, even if a loose and principles-based
    regimen is in place. Countries like the United Kingdom have created tiered licensing
    for fintechs, for example in banking with an `e-money licence`, a `halfway` banking
    licence, and a `full banking licence`. Each tier has a different level of regulatory
    scrutiny and compliance requirements, and each tier allows for a wide array of
    banking-related activities. A similar tiered model is being considered or implemented
    for `blockchain securities` in some countries.


    ### Safe harbour


    Safe harbour, as mentioned earlier, is a compelling tool in the policy maker’s
    toolkit, and is used in a variety of settings. At its heart, safe harbour consists
    of a regulator providing a company with the explicit statement that a certain
    set of business activities will not violate a given regulation or set of regulations.
    When regulators coordinate with one another effectively and create standards that
    apply across domiciles, it becomes even easier for private sector interests (companies,
    investors) to deploy capital into a new area. A good set of `safe harbour letters`
    can provide companies and their investors with the confidence to deploy a product
    or service, without the government or governments in question having to exert
    the same level of political and organisational effort typically required when
    new regulation is created. It’s also much faster. Use of `safe harbour letters`
    allows the regulator to experiment with new technologies and gain real-world experience
    in an emerging technology area. This then helps the regulator decide if new regulation
    is needed, and if so, what form it must take.


    The degree to which countries are receptive to the potential of blockchain varies.
    Some domiciles have developed explicit regulation or economic support for blockchain
    initiatives, some have established specific rules, or interpreted existing rules,
    and some are still following a wait-and-see approach. For example, the `European
    Union` has set up a large-scale investment fund to support blockchain projects.
    The `EU` believes that blockchain can help address small business finance deficiencies.
    The `Bank of England` has made significant research efforts in the area, including
    assessing the viability of `central bank digital currencies`. Island nations such
    as `Bermuda` and `Mauritius` have adopted new laws that seek to make their domiciles
    friendlier to blockchain-related businesses, and/or make it easier to raise funds
    using `token offerings` of one type or another.


    With the frameworks and tools provided in this chapter, you now have the means
    of assessing and understanding whatever environment you are operating in, and
    also the tools to design your own blockchain ecosystem, whether you are an innovator
    or a regulator.


    Now that you are acquainted with some of the core ideas, you can begin thinking
    about how you can apply blockchain. In almost every domain of human endeavour,
    there are ways in which blockchain technologies can shape markets, enable prosperity,
    reduce corruption, enhance security and generate efficiencies. Blockchain also
    creates new and dangerous mechanisms for unintended consequences when we bring
    immutability, an inerasable record, together with poor data quality and total
    transparency. Imagine if a jilted lover put negative, false information about
    you into a permanent record that is then accessed by a potential employer. Or
    one government’s espionage service injected false voting data into another country’s
    election. As we advance to Part II of *Basic Blockchain*, we will examine how
    blockchain is creating new opportunities for industry, and where some of the risks
    lie.


