  \ expert group`的成员。\n\n\n\n\n在肯尼迪于 1963 年惨遭遭刺杀后，当他在视察其政府负责在德克萨斯州建立的光明新太空设施时，航天计划的命运落给了他的副总统林登·约翰逊。约翰逊是一个真正的坚实信者，至少在“登月计划”的政治上是如此，他巧妙地确保了肯尼迪获得了实现目标所需的资金。但到了\
  \ 20 世纪 60 年代后期，世界开始对自由主义盛世和联邦支出的黄金时代感到反感，航天计划也是如此。肯尼迪和约翰逊曾希望`NASA`带来的高科技工作能以某种方式改变几个世纪的南方种族主义，但事实证明他们是悲剧性错误的；在肯尼迪颁布《民权法案》后，传统上倾向民主党的南方转而反对这位新总统。全美的学生抗议越南战争，城市内部的贫困正爆发为暴力。到\
  \ 1966 年底，约翰逊面临着国会中期选举的惨败，以及每月几乎达到 20 亿美元的战争预算。削减预算的要求接踵而至，`NASA`面临着风险。在自己也被刺杀之前，马丁·路德·金对一个“花在军事防御上的钱比在社会提升计划上的多”的国家的精神性死亡进行了激烈抨击，这种担忧后来在哈莱姆节的游客中得到了共鸣。38\n\
  \n正是在此背景下，总统国家顾问沃尔特·罗斯特提出，是时候采取一项新的总统倡议了：一项确立 1963 年原则的国际条约。它将巩固来之不易的成果，并给约翰逊喘息的空间，使其可能将资金从`NASA`转移到他的国内计划。它还将帮助他在国际舞台上证明，尽管越南泥潭日益加深，但他也是一名和平主义者。此举可能是愤世的，但这并不新奇。整个太空竞赛起初只是一个包裹在科学探索丝带之下的愤世战争战术。在肯尼迪去世前，韦伯曾向他承诺，即使他们无法在他设定的时间范围内登上月球，`NASA`也将让这个国家拥有“利用科学……增强国家实力的基本能力”。39\
  \ 在这一点上，他们已经成功了。\n\n联合国内内的谈判异常迅速，尽管并非没有波折。苏联起草了他们版本的条约，要求“平等进入太空”，这意味着他们应该可以使用其他领土作为其跟踪站基地，尽管他们最终妥协，接受了双边安排的必要性。埃及和印度等中立国家坚持条约必须禁止太空中所有的军事活动，而不只是核武器和大规模杀伤性武器。欧洲希望为私营机构确保公平的竞争环境。代表发展中国家的巴西则希望太空不仅是全人类的财产，而且太空活动应仅“为了全人类的利益”进行。40\n\
  \n生成的《联合国外层空间条约》由约翰逊总统于 1967 年 1 月签署（在卫星一发射后不到十年），这是一项非凡的创新，它创造了一个全新的国际法领域，并被誉为“太空宪章”。41\
  \ 尽管面临重大障碍——从冷战的地缘政治现实到这种新技术的科学未知性——条约的制定者们能够利用广泛的原则来稳定一个原本不稳定的局势，同时保持了未来变化的灵活性。月球本身被去军事化，外层空间保持不设轨道核武器。法律教授兼太空法专家\
  \ P. J. 布朗特写道：“从核心上说，《外层空间条约》是一项安全条约。”它的最终目标是国际和平（去核化而非完全去军事化），这使美国人、苏联以及处于其中的全球社区都受益。军备竞赛、太空竞赛；它们是分散注意力、昂贵且危险的。艾森豪威尔已经意识到这一点并试图缓和紧张。肯尼迪点燃了火索，认为自己可以从实力地位出发更好地谈判和平。约翰逊现在下心扭转局面。\n\
  \n***\n\n该条约在某种程度上成为了太空的宪法。如果说宪法是一组允许事物管理的边界和先例，那么《外层空间条约》就成了人类探索未知领域的基础文本。在建立一个新的“多边共同公地”时，该条约基于源自海洋、南极、空气使用的法律原则——即全球公地的般条件，如自由准入、和平利用和非领土性。起草者又增加了三个核心原则：国家应是外层空间的主要利益相关者；太空应成为这些国家之间透明且合作的互动场所；太空应为全人类人口奉服务。布朗特指出，这是“多边主义的辉光典范”。42\n\
  \n今天，《外层空间条约》仍然是国际太空法的基石。当然，它并非完美。首先，常规武器从未被禁止，因此即使核武器和大规模杀伤性武器被禁止，太空仍然是军事化的。此外，条约也无法预见并阻止未来可能出现的任何太空技术复杂问题或滥用。从一开始开始，当美国代表团拒绝接受苏联关于太空探索应仅由主权国家实施的建议时，商业化就得到了含蓄的保护。然而，条约对于由私营行业和亿万富翁狂衷者领导的太空活动并没有明确规定，仅规定各国对其管辖范围内的发生的所有活动负责。此外，在当时印度和中国等国尚未成为主导性的太空强。\n\
  \n结果是，太空领域仍然存在没有明确解决方案的重大政策问题，包括如何处理大量私营卫星对黑暗夜空的影响，以及某些人认为可能会相互碰撞的太空碎片，产生连锁碰撞，直到这些物体最终将地球禁锢在自己混乱的轨道上。§\
  \ 随着技术变得更加复杂，半世纪前的条约可能无法想象的新场景正在出现。例如，`Starlink`——这项由私营但有政府补贴的美国公司`SpaceX`开发的卫星\
  \ Wi-Fi 功能，其初衷是为世界偏远地区提供连接的民用技术。但当乌克兰军队在防御俄罗斯期间开始使用`Starlink`进行军事通信时，它突然变成了地缘政治危机的中心。“我们正处于[新的]太空竞赛中，”`NASA`负责人比尔·尼尔森在\
  \ 2022 年说道。43\n\n\n\n\n但《外层空间条约》的成功并不在于其完美，而在于它本身的存在。20 世纪 60 年是一个全球局势高度紧张的时期，然而该条约却充满了在太空探索过程中与其他国家分享、协商和考虑的各种义务。它明确地将太空领域的创新与人类的全球性计划联系起来。我们之所以拥有一个全球太空产业并引发了新的地缘政治紧张局势关系，是因为该条约提供了法律和监管上的清晰度，它为太空和平创造了条件，同时没有损害任何国家或私营公司在当时尚未知的技术领域进行新的能力。更引人注目的是，只有在进一步造人类利益的基础上，才允许进步。对于布劳特（Blount）来说，这意义重大，因为“虽然空间技术的创新驱动并塑造了法律……但国际空间法体系并不支持为了创新而创新。”相反，他说，“该体系要求空间活动必须‘无论经济或科学发展水平如何，都为了所有国家的利益和福祉而进行’。”44\
  \ 换句话说，虽然条约没有规定国家具体应如何分享这些利益，但它要求人类的繁荣是国家追求太空活动的先决条件。例如，各国已经在电信、气候科学、共享传感器，以及国际空间站的建立方面寻求了合作努力。1967\
  \ 年确立的意图延续至今。太空仍然是一个独特且奇妙的国际合作舞台。\n\n人工智能正如 20 世纪中叶的太空一样，是全球准则的新边疆和一张待描绘的白纸。同样，正如太空竞赛早期一样，它已成为投机取巧的政治家、易激的科学家和精明的私营公司的代名词，他们都急于利用它来推行自己的议程。“金钱的力量无处不在，必须予以严肃对待，”艾森豪威尔总统在他现在著名的告别演说中这样说，他在演讲中警告要防止新的“军事工业复合体”。“[[但是]当我们像应该做的那样尊重科学研究和发现时，我们也必须警惕同等且相反的危险，即公共政策本身可能成为科技精英的俘虏。”[45\
  \ 涉及到人工智能，很少有人怀疑这一预言已经成真。大多数的人工智能现在基于私营公司，当政府思考和谈论人工智能时，往往是从国家安全的角度来看的。但这一事实并不意味着我们不应该去想象并要求一个至少与那些带我们登上月球的人的成就一样具有启发性的未来，甚至更好。\n\
  \n1967 年《外层空间条约》对今天的人工智能带来的启示既独特又相互交。首先，无论世界上发生什么其他事情，强大的政治领导力在影响技术和人类未来发展方向方面的价值仍然具有意义。其次，自利、防御以及对战争最极端行为的限制并不相互排斥。最后，科学可以也应该被用来鼓励国际合作，即使在特别是在地缘政治现实紧张的情况下也是。\n\
  \n第一条教训对当今世界具有直接相关性，在今天，一种对人工智能的恐慌潮被强大的社会不安时代精神所助长。我们对这种此时由人类创造的新技术的感受反映了更广泛的不确定性情绪，这并不奇怪。而将人工智能界定为经济武器的政策方法，例如美国对中国出口半导体等关键技术的限制，进一步加剧了这种情绪。叙事已变成一种竞争，对优秀人才的竞争完全通过“新冷战”的棱镜来审视。然而，《外层空间条约》是在真正的冷战背景下、在毁灭性全球冲突的余晖中谈判的。情况本可以更加困难和微妙。然而，艾森豪威尔和肯尼迪都选择阐述一种和平的科学愿景，同时没有损害他们的国家利益。那样的领导是很困难且罕见的，但并非不可能——我们不应该放弃要求。\n\
  \n关键在于，这种和平愿景带有某种愤世嫉俗。正如布莱丁·鲍恩（Bleddyn Bowen）等学者指出的，太空从一开始就被军事化了。但《外层空间条约》仍然是一项非凡成就，它对军备竞赛的最极端行为设定了限制，确保了核武器——当时美苏之间激烈全球竞争的主要对象——没有被安置在月球上或永久轨道上。考虑到当时高度紧张的局势，如古巴导弹危机等事件曾让世界推向核战争边缘，这并不是一件可以被保证或应该被理所当然的事。\n\
  \n我们无法说服美国、中国或任何其他国家停止追求人工智能军事研发。但并不意味着全球大国现在不应该采取行动，对最恶劣的致命自主武器设定限制，正如 Article\
  \ 36 等组织和斯图特·罗塞尔（Stuart Russell）等科学家要求的那样。此外，太空竞赛和 1967 年的条约告诉我们，这种外交领导力和妥协实际上符合国家利益。全球范围内的不结盟国家（包括重要的拉丁美洲和加勒比国家）已经支持对自主武器进行紧迫谈判。46\
  \ 对于美国和西方寻求建立对自由民主模式的支持，与这些国家结联盟变得日益重要。而且正如太空竞赛一样，设定这些限制符合每个人国家安全的利益。正如《外层空间条约》，它会说：“止此为止，不再延伸。”无论你对成功的机会持何观点，有一点是明确的：耸耸肩接受失败主义既是沮丧又是危险的。\n\
  \n\n\n最后，太空竞赛所设立的范例应当鼓励我们将人工智能的潜力视为一个机会，即在造福和提升整个地球的项目上建立国际合作，而不是陷入技术民族主义的筑墙运动。在某些方面，这应该比冷战期间的合作容易得多，因为全球化意味着中国和美国这两个最重要的人工智能超级大国，其经济上的联系比美国与苏联以往任何时候都要紧密。\n\
  \n根据斯坦福大学 2022 年发布的`AI Index`显示，尽管关系紧张，美国和中国在人工智能研究领域已经有了大量的跨国合作。47 正如我们所见，这并不需要牺牲可以理解的国家利益或安全。它需要稀见的政治和科学领导力。但正是这给了我们实现全球和平人工智能愿景的最大希望，这种愿景承诺了（或至少向往于）艾森豪所说的“人类从黑暗走向光明的漫长朝圣”。48\
  \ 这不能单靠政府来实现，尽管它们必须发挥领导作用，而是要通过所有希望看到通向更和平未来进步的人们持续的运动和行动。正如安吉拉·凯恩（Angela Kane）所说，“在这个问题上花费更多多年可能不会产生预期的结果；但公共压力和倡导……可能会。”49\n\
  \n事回过去，由于轨道上运行的是国际空间站而不是核弹，我们很容易告诉自己，和平国际空间政策的结果是不可避免的。我们的集体神话化可以说服我们认为这是一条显而易见的路径和注定的结果，但这经不起推敲。面对一个让人感到危险和不稳定的世界，我们不必虚无主义地放弃人工智能获得和平结果的任何机会。对于负责\
  \ 1967 年《太空条约》的那代人来说，整个国际法体系是全新的。这并不是要低估今天的挑战，但不加尝试而放弃将限制我们自己，限制对可能性的概念本身。我们可以既务实又现实，同时不忘记希望的力量。“阿波罗精神”可以也必须应用于监管、国际法和公共政策。\n\
  \n为了回应杰拉德·巴茨（Gerald Butts）的观点，利用这种精神来应对人工智能的挑战必须尽快进行；机遇之窗可能已经关闭。\n\n***\n\n\n1969\
  \ 年 7 月，当`阿波罗 11 号`准备出发执行这项将定义时代的任务，以履行一位殉道总统的承诺时，抗议者聚集在如今已知的佛罗里达州`肯尼迪太空中心`外。抗议由拉尔夫·阿伯纳西（Reverend\
  \ Ralph Abernathy）牧师领导，他在 1968 年接管了马丁·路德·金组织的领导工作。目标是引起人们关注生活在地球贫困地区的人们，尽管美国正向月球伸指。\n\
  \n![拉尔夫·阿伯纳西牧师拿着标牌，与其他人在卫星发射中心走下的照片。](img/image_rsrc2X7.jpg)\n\n*1969 年 7 月“阿波罗\
  \ 11 号”发射现场的拉尔夫·阿伯纳西牧师和“贫民运动”抗议。Bettmann 经 Getty Images*\n\n人群在传统的骡子拉的马车后行进，以此彰显美国国家航天局（`NASA`）闪耀的工程成就与深南部许多不同种族的贫困人口生活现实之间的对比。阿伯纳西请求与`NASA`局长的继任者托马斯·佩恩（`Thomas\
  \ Paine`）会面，并向其强调他的组织“对[美国]太空成就像任何人都一样感到自豪”。但他礼貌地请求`NASA`尝试将其巧智应用于贫困和饥饿问题，而不仅仅是声望。听从指令的`佩恩`没有获得授权执行这一请求。但他确实同意邀请一些抗议家庭进入内部观看发射。50\n\
  \n当尼尔·阿姆斯特朗（`Neil Armstrong`）和巴兹·奥尔德（`Buzz Aldrin`）离开月球表面返回他们的“鹰号”舱执行勇敢的地球之旅时，他们留下了阿波罗在太空和平意图的象征。其中包括两枚勋章，纪念苏联宇航员尤里·加加林（`Yuri\
  \ Gagarin`）和弗拉基米尔·科马罗夫（`Vladimir Komarov`），他们两年前均死于坠事故；还有一枚为追求这一目标而丧生命的美国宇航员准备的“阿波罗\
  \ 1 号”贴片。一枚金色橄榄枝标志是至今仍留在月球表面包裹的一部分。51 在对着背后发光的白色月球表面拍摄了这张照片后，`阿姆斯特朗`小心地拧下了一个固定在月球轨道舱楼梯上的钢板，他曾从那里跳下并创造了历史。他将牌匾放置在月尘中，由于那里没有风，它将一直暴露在露天之下，面对未来任何可能降临那里的人。上面刻着那句不朽的话语：\n\
  \n“我们为了全人类的和平而来。”\n\n无论多么不完美，无论其源于战争时期，这一高尚的思想以及维护它的全球努力都是这次登月计划最引注目的遗产。\n\n** 然而，这种指责并没有阻止他监督继续生产同样的核武器。\n\
  \n† `肯尼迪`（`Kennedy`）在战争中失去了兄哥，当自己的鱼雷艇被日本日本逐舰击沉时，他自己表现出了非凡的勇气。他曾用牙咬住一名受伤士兵的腰带，将其将他游回岸边。\n\
  \n‡ 考虑到伍德斯托克（`Woodstock`）在摇滚乐史上受推崇的地位，这是文化记录中一个引人注目的缺失，那是发生在类似时期、但观众主要是白人的类似事件。电影的全名是`灵魂之夏（或，当革命无法通过电视转播时）`。\n\
  \n§ 这一理论被称为“凯斯勒综合征”（`Kessler Syndrome`），由`NASA`科学家唐纳德·凯斯勒（`Donald Kessler`）在 1978\
  \ 年首次提出，担心太空碎片碰撞的连锁反应会导致局面失控，直到低地球轨道变得无法进入。\n\n\n## 体管婴儿与沃诺克委员会\n\n![《晚间新闻》（Evening\
  \ News）报纸首页的照片，标题为“超级美女”，有一个包裹在毛巾里的婴儿头像。](img/image_rsrc2X8.jpg)\n\n*1978 年 7 月《晚间新闻》封面。晚间标准有限公司（Evening\
  \ Standard Ltd）*\n\n不存在权威……只是一堆不同的意见。\n—玛丽·沃诺克（MARY WARNOCK）\n\n这项法案只会带来麻烦。\n—玛格丽特·撒切尔（MARGARET\
  \ THATCHER）\n\n## 奇迹婴儿\n\n2007 年，我在哈佛大学研究生院学习时，在一个秋日的早晨，我通过公告板发现了一个伦理困境。当时我一直走着从宿舍到法学院的常用路线，尽管我是一个历史系学生，但我经常去那里，因为那里有出色的咖啡馆和传奇般的煎土豆配煎蛋。但在去吃早餐的路上，我从当天的各种俱乐部社团、协会、旅行和失物物品广告中，发现了一张奇特的新海报。底部有一排可以撕下的电话号码，是一份捐赠卵子的请求。不是为了我的法学院早餐，而是为了学生的卵子，捐赠给那些无法产生自己卵子的人，作为回报，他们愿意支付数千美元。我兴奋地给男朋友打电话分享这个消息，说我们现在富了。我在哈佛拿着丰厚的奖学金，但根据学生签证不能工作，因此，“赚快钱”（用美国的话说）的想法极具诱惑力。我对于可能涉及的过程并不了解，而且坦白说，我感到有些间接的自豪。一想到我的基因竟然如此令人渴望！\n\
  \n\n\n\n我对具体的数字记忆模糊了，但我记得那笔钱看起来非常惊人。虽然不是改变人生，但绝对能改变十年的生活，而且我当时跃跃欲试。但我的男朋友（现在的丈夫）并不认为这是个好主意。“嗯，我觉得这有点奇怪，”他用他一贯的简练言辞说道。我捐赠一颗卵子，然后永远不知道自己是否有一个孩子在某个地方生活，这个想法对他来说很诡异（他总是那个提前计划并理性做出决策的人，而不是凭冲动行事）。坦率地说，他的反应让我感到有些松口气。虽然我并不了解医学上实际涉及的内容，但我产生了一种挥之不去的感觉：这可能并没有海报上看起来那么简单，而且可能会分散我的学习注意力。我没有回去取回那张申请单，也没有在我的生钱计划中取得任何进一步进展。\n\
  \n今天，如果我决定改变主意，那个提议将不再有效。这不仅是因为现在我已三十多头，而不是二十出头，我的卵子不再那么有吸引力了。主要的障碍是我住在英国，英国对对精子和卵子捐赠以及帮助将这些捐赠转化为婴儿的体外婴儿（`IVF`）过程执行着严格的监管制度。虽然美国从未明确禁止商业化卵子捐赠或商业代孕，但英国选择了这样做。其基于是文化和政治性的而非科学性的，但其社会影响是重大的。\n\
  \n***\n\n\n正如现在一样，美国在堕胎权问题上充斥着分歧，20 世纪 70 年代的美国就为“生命”始于何时、胎儿是否拥有权利，以及政府应如何权衡女性的选择与生活而陷入纠结。福音派基督教右翼的兴起挟持了美国政治，结果也影响了其科学。罗纳德·里根总统和他的继任者乔治·H·W·布什都让人类胚胎研究这一新领域获得联邦资助变得不可能，因为担心这会与\
  \ 1973 年最高法院`罗诉韦德案`裁决（该裁决承认堕胎是一项宪法权利）后引发的激烈堕胎辩论相结合，从而引发反弹。20 世纪 70 年代后期，美国对人类胚胎研究的联邦资助禁令最终解除，但在那之前，它已将所有胚胎学研究推向私营部门，而私营部门可能可以理解地更关注利润空间而非设定伦理边界，将复杂的道德、伦理和科学问题留给法院系统去解决。作为领先科学强国，这种在领导力上的放弃为其他国家定义该领域留下了广阔空间。\n\
  \n\n`IVF`和胚胎研究是在英国真正发展起来的；英国也将因生产出世界上第一个“试管婴儿”而闻名于世。但这并不是英国唯一的卓越成就。当时在科学发现方面的领先地位与严肃的议会辩论和协商民主相得辉映，结果是英国现在不仅在科学本身方面是全球领导，在允许此类创新的监管环境方面也是如此。正如社会学家、生殖生物学领先学者莎拉·富兰克教授所描述的那样，这是一种“严而宽”的制度。这意味着存在护栏，存在不能逾越的坚实红线。但只要站在这些线的右侧，你就可以享受巨大的科学自由。这种回报是巨大的：据估计，英国生命科学部门每年的价值\
  \ 640 亿英镑。这种情况是如何发生的，以及这对科学研究和突破的未来监管意味着什么，为当今关于人工智能的激烈辩论提供了许多素材。\n\n\n正如在`COVID-19`大流行期间显出来的那样，总会有这样这些人，将科学引入文化战争是有利可图的。在美国，存在社会阶层，特别是共和党及其盟友，他们选择将公共卫生紧急事件以及随后的`COVID-19`疫苗这一科学奇迹政治化。领先的公共卫生官员安东尼·福克斯因其试图为公共卫生制定最佳路线而受到共和党人的人身攻击和诋毁，甚至被德克萨斯州参议员泰德·克鲁指控监管一个参与“虐待小狗”的组织。但科学文化战争在英国也发生了，尽管没那么剧烈。这种分裂性并非疫情所特有。口蹄疫瘟疫、基因转食品、疯牛病毒病（BSE）——这些都在英国社会引起了深层的不安。但通过`IVF`，英国成功扭转了这一趋势。这并不是说它没有争议——它确实有。但社会找到了一条出路，制定了富兰克林所说的“史上颁布的最全面、最宽松的支持生殖生物医学和胚胎研究的法律”。\n\
  \n今天，在世界上通过`IVF`出生的路易斯·布朗出生四十年后，胚胎研究和`IVF`出生已不再是英国激烈争论的话题。这是因为政治和监管工作在允许创新蓬勃的同时建立了公众信任。民主、公民参与和明智治理导致了协商委员会的建立，该委员会进行研究并听取民众意见。该委员会由非科学家玛丽·沃诺克男爵深思且专业地主持，她随后花了多年时间耐心解释他们所达成的妥协立场。这个过程没有任何华丽，对于那些对\
  \ AI 研究更具戏剧性的元素感兴趣的人来说，它无疑显得很枯燥。但正是这种稳健、深思的民主实验，能够将科学创新和政治体凝聚在一起。\n\n\n在书中所有的例子中，最令我触动的是\
  \ 20 世纪 70、80 年代的生物技术辩论与今天的 AI 话语之间的相似之处。批评者曾构思弗兰肯斯坦怪物来恐吓公众关注遗传学和胚胎学，而现在像`ChatGPT`这样的大语言模型（`LLMs`）被视为机器末日式崛起的前驱。对企业影响的恐惧、对未知未来的担忧、对人类定义的思考：这些问题都是早期关于人类胚胎研究、重组\
  \ DNA、克隆和基因转食品辩论的一部分。那时和现在一样，科学家们埋怨公众和政治阶层根本“不理解”科学，认为在他们的研究领域没有民主监督或监管的余地。但仅仅这些相似之处并不能保证我们将来能找到良好的解决方案。其他有争议的生物技术领域被监管冻结了数十年：欧盟直到\
  \ 2015 年才禁止 GMO；美国直到 2008 年才禁止干细胞研究。但`IVF`和人类胚胎研究在英国公共生活的成功整合表明，对科学进步（尤其是对社会产生深远影响的影响）进行理性的公众讨论是完全可能的。在一个英国社会其他方面深陷分裂的时期，在一位既受人恨又推崇的首相领导下，这一过程仍然安全且相对平静地进展了。\n\
  \n\n\n\n人工智能带给我们的复杂伦理、道德和技术问题与沃诺克委员会（Warnock Committee）面临的问题一样多。今天，各国正在与自动化决策作斗，这种决策可能充斥偏见，并可能导致技术驱动的失业。他们还面临着生成式\
  \ AI 的挑战，包括其模仿人类的能力（无论是泛指还是特定个人），从而可能制造不和并助长诈骗。良好的生成式 AI 程序还能创建它们被要求的任何图像，无论这样做是否会侵犯他人的知识产权和生计。而且，正如人类胚胎学研究的潜力一样，AI\
  \ 往往让人们感到非常不安，却无法准确说明为什么。\n\n沃诺克委员会的故事以及它所开启的创新监管格局，是一个关于领导力、妥协以及愿意对科学能力设定限制以确保创新能够蓬荣发展的故事。它也是一个关于对公众态度做出回应和尊重的故事，但没有屈从于冲动反应。如果我们在我们自己分崩离析的社会中，也希望看到\
  \ AI 安全、冷静地进步，那么我们再次需要这些特质。\n\n\n现代生殖革命发生在几个世纪前工业革命发源地的中心区域，这一事实带有一种诗意的色彩。5 大曼彻斯特郡的奥德姆（Oldham）在整个\
  \ 19 世纪非常繁荣，成为世界纺织制造业的中心，其第一家磨坊于 1778 年开放。两年后，1978 年 7 月 25 日，在奥德姆总医院，路易斯·乔伊·布朗（Louise\
  \ Joy Brown）出生，一家报纸称她为“超级宝贝”的到来。6\n\n布朗家族字面和比喻上的快乐（Joy）是 IVF（人工授婴儿）先驱罗伯特·埃德华兹（Robert\
  \ Edwards）和帕特里克·斯特普特（Patrick Steptoe）几十年努力的结果。剑大学学者埃德华兹在 1969 年情人节刚后，在权威科学期刊`Nature`上发表了论文，解释了人类卵子如何在他的实验室中体外受精，这是他与斯特普特合作的成果。斯特普特是一位妇科医生，其开创腹腔镜技术证明是拼图中缺失的一块。埃德华兹于\
  \ 1925 年出生于一个矿工和一个棉纺工人，他是一个独特的人。他最初对动物的发育生物学感兴趣，然后是人类，他认为不孕是一种社会不公。面对极度的怀疑甚至敌意，他继续了他的\
  \ IVF 研究。在华盛顿特区的一次会议上，他遭到了诺贝尔奖得主生物学家詹姆斯·沃森（James Watson）的批评，沃森本人揭示 DNA 双螺旋结构的工作对推动现代生物学进步做出了巨大贡献。沃森暗示\
  \ IVF 并非进步的标志，而是通往人类克隆的危险路径。7 马丁·约翰逊（Martin Johnson）是埃德华兹的首批学生之一，现在剑桥大学生殖科学荣誉教授，他后来回忆起在早期选择与埃德华兹合作是多么“令人不安”。领域的巨头们，包括罗伯特·温斯顿勋爵（Lord\
  \ Robert Winston，他后来成为与生殖创新相关的最杰出的科学家），曾对埃德华兹及其成功的机会表示蔑视。还有人觉得他的工作“既不道德，又浪费了他的天赋”。英国医学研究委员会没有在资金上支持他。约翰逊感到，当时有一种情绪认为不孕是一个“微不足道的问题”。8](#part0019.xhtml#a23G)\
  \ 但埃德华兹主要由女性抚养和支持长大，他对那些被他人因与女性健康相关而认为微不足道的事物有一种亲近感。9\n\n埃德华兹还关心他工作的伦理影响，与神父兼医学伦理专家戈登·邓斯坦（Gordon\
  \ Dunstan）等神学学家进行交流，并在 1974 年与邓斯坦以及工党议会会议员莎莉莉·威廉姆斯（Shirley Williams）一起成为英国科学促进协会关于\
  \ IVF 和遗传筛查的工作小组的成员。但这种关注似乎仅扩展到他个人的好奇心和道德感，而不是让他的科学向外部影响开放。当工作小组随后的报告指出了这类研究引发的严重社会问题，并呼吁对其影响进行对话时，埃德华兹个人拒绝了任何外部人员参与科学审查过程的想法，该小组也未建议任何非医疗或科学干预。正如现在现代技术圈变得非常普遍的那样，他对那些没有同等技术经验的人理解他工作的能力表示怀疑，认为“在这些问题上形成统一道德伦理立场的机会似乎很遥远”。埃德华兹甚至警告说，试图将非科学过程引入他的工作几乎是不道德的，因为可能会延迟\
  \ IVF 的临床应用，从而侵犯了“夫妇拥有自己孩子的权利”。10 他和斯特普特后来甚至引用了联合国《人权通用宣言》来支持他们的工作，其中第 16 条对“婚姻和建立家庭”的权利提供了保护。11\n\
  \n当然，如果埃德华兹、斯特普特和让·普迪（Jean Purdy，对他们的工作起关键作用的护士和胚胎学家）失败，女性将承担大部分。如果他们成功了，女性也将承担大部分。她们的身体是最终的实验场。在“奇迹婴儿”最终出生之前，有数百名勇敢的女性经历了失败的治疗，而一旦她出生，特别是有两个女性决定了此后之后所有人的命运。\n\
  \n***\n\n除了 1978 年路易斯·乔伊的出生外，20 世纪 70 年代对英国来说并不是一个快乐的十年。摇摆六十年代已经结束，披头士乐队解散了，政府频繁更迭令人混乱，经济陷入了通货膨胀和增长停滞的循环。但在这些阴暗的新闻中，路易斯·乔伊的出生带来了新的希望和对英国科学的新自豪。自从他们\
  \ 1969 年的论文发表在`Nature`上以来，斯特普特和埃德华兹就很有名，他们的工作一直是许多热烈推测的对象。尽管存在这种不安，当他们在近十年后获得成功时，英国的反应几乎是一致积极的。布朗出生前的引发引发了报界的狂热，记者们采取了常有的策略抢夺竞争对手，《每日邮件报》（Daily\
  \ Mail）最终获得了据称 30 万英镑的独家报道权。随着她的平安出生，这种狂热达到了顶点，关于埃德华兹、斯特普特和布朗家族的彩色专题报道大量出现。《曼彻斯特晚报》誉这一“全英国奇迹”，根据历史学家约翰·特尼（Jon\
  \ Turney）的说法，“早期对他们工作的攻击现在被呈现为这对坚定的搭档所克服的又一个障碍。”随后回顾报道时，`Nature` 满意于第一个 IVF 出生“几乎得到了普遍欢迎，并被誉为治疗某些类型不孕的重要进展。”12\n\
  \n\n\n布朗一家那种纯粹的“平凡”促成了这种温暖的欢迎。“这是一个完全正常的婴儿，”帕特里克·斯普特（Patrick Steptoe）在生下路易斯后松了一口气说道，事实上，这种性也是他们父母吸引力的一部分。莱斯和约翰·布朗是一对没有威胁色彩的白人异性恋结婚夫妇。莱斯在生理上是不孕育的，她是一位奉献的母亲，通过真切地渴望自己的孩子并无私地抚养继子女，完美诠释了传统的女性理想。他们是低调、谦逊、脚踏实地的人，是右翼报纸可以安全支持的典型。\n\
  \n但英国的政治局势正在发生变化。政治和经济的动荡让这个国家失去了自信，而路易斯·布朗的出生不足以扭转这一局面。次年，这个国家选出了一位他们认为可能拯救他们走出深渊的女性。1979\
  \ 年 5 月，玛格丽特·撒切尔的保守党获得了大幅多数多数，这是自 1945 年以来反对执政政府最大的一次选举波动，她诞生了该国首位女性首相，尽管议会女性成员的总数有所下降。她承诺将带来和谐。\n\
  \n到 1982 年，随着新政府推动回到旧式的道德准则，国家对体外婴儿（IVF）成功的轻松心态已“蒸发”殆尽。这场运动自 20 世纪 60 年代后期起就在进行中，当时哈罗德·威尔逊领导的工党政府通过了多项旨在使英国社会现代化的法律。他们使同性恋和堕合法，放宽了离婚法，除了死刑，并结束了某些艺术审查。这些变化是国家自由主义文化复兴的一部分，与乐观主义和国际声誉有关。\n\
  \n但与任何社会进步一样，反弹情绪正在积聚。特别是保守党议员对这些表示反对，尽管首相本人的处境十分复杂，撒切尔政府仍以制止放纵社会而闻名，并在此过程中赢得了选。一系列压力团体成立起来以支持这种反弹，强调议会所做决定的所谓“道德后果”，并试图提醒保守党议员履行他们的职责。\n\
  \n在保守党议员的支持下，旨在扭转 1967 年《堕胎法》的运动在法律通过之前就已经开始了，尽管它在整个 20 世纪 70 年代和 80 年代才逐渐获得势头。“未出生儿童保护协会”（SPUC）和他们的伙伴压力团体\
  \ LIFE 成为了反对他们的组织手段，对他们来说，这象征着英国生活的道德堕落。正如他们的美国同行（后者在那个时期获得了巨大的势头）一样，SPUC 和 LIFE\
  \ 围绕着一个观点凝聚：女性子宫内不断增长的细胞团实际上是一个人类，理应享有与任何其他人相同的权利和保护。对于这些团体来说，堕胎不是一个医学问题，而是个人道德和性放纵的问题。他们认为，如果人们能保持婚姻和一一专一，就不需要堕胎。\n\
  \n撒切尔本人的观点则更为温和。她在 1967 年投票赞成堕胎合法化，并拒绝考虑再次禁止它，认为你有时必须“为了救母亲而夺走孩子的生命”。但是，十年后她在接受《天主教公报》采访时辩称道，“这只适用于非常、非常早的阶段[而且]我发现，将其作为一种避孕手段是完全令人厌恶的。”没有人建议将其用于避孕，但她感到有必要澄清这一事实，证明了那种给一种医疗程序贴上“滥交”标签的运动正在起作用。她的言论也揭示了她作为首相将如何看待体外婴儿和人类胚胎学研究问题。她说，她接受堕胎是“在受控的条件下”。\n\
  \n可以想象这样一个世界：反堕胎者对体外婴儿并没有产生太大兴趣，因为爱德华斯、斯普特和珀迪的工作是在原本不存在生命的地方创造生命。这些先驱者并没有让局面动得太厉害；布朗夫妇是一个传统的核心家庭，关键是他们是结婚的。这是英国人认为至关重要的因素。即使是反对堕胎的议员，只要仅供夫妇使用，也支持体外婴儿，其中一人表示，如果卵子由丈夫精精受精，“无法以其他方式生孩子”。\n\
  \n但随着体外婴儿数量的增加，怀疑也随之增长。尽管当《每日快报》大肆路易斯的出生时，他们也提到了“某种不安”。重组 DNA 技术的进步（这种技术在美国由于安全担忧导致科学家宣布了自愿暂停）引发了对体外婴儿与基因工程合并的推测。反堕胎者开始怀疑体外婴儿只不过是“根据需求和偏好进行的控制生殖”。滥交和对“传统”家庭的破坏是同一回事。显然这并非虚言，保守党贵族坎贝尔勋（Lord\
  \ Campbell）在 1982 年 7 月在上院表达了他的担忧，表示“如果没有保障，这项新技术（体外婴儿）将危害人类的尊严，威胁儿童的福利，并破坏家庭的神圣性。”\n\
  \n\n\n也许我们是从莎莉·威廉姆斯（Shirley Williams）那里获得了这一灵感。到那时，她已不再是工党议员，而是威廉姆斯男爵夫人，贵族院议员，也是她在将脱离的社会民主党（SDP）与自由党合并后所协助创立的党的领军人物。她是一位强大的女性，经验丰富，在\
  \ 1981 年共同创立社会民主党之前曾担任过两届内阁。正如历史学家阿尔温·特纳（Alwyn Turner）所说，她是“那种罕见的生物，一个真正亲民的政治家”。23\
  \ 1982 年，在担任议员期间，她呼吁就体外受婴儿（IVF）和胚胎研究技术成立皇家委员会。威廉姆斯可能意识到委员会和小组的影响力。也许她并不认同，或许她只是想引起轰动，以引起对这一重要问题的关注。无论如何，她的信最终成为英国在体外婴儿和人类胚胎研究方面达成这一里程碑式协议的关键时刻之一。\n\
  \n\n威廉姆斯在职业生涯的大部分时间内对科学政策产生了特殊兴趣。在 20 世纪 70 年代后期，她担任教育与科学事务大臣，尽管到那时她已经对科学突破的社会影响表示了关注。这反映了公众和科学家自身日益增长的不安。早在\
  \ 1968 年，像莫里基层·威尔金斯（Maurice Wilkins）和弗朗西斯·克里克（Francis Crick）这样的精英建制派杰军人物（他们曾与沃森共同获得诺贝尔奖）§\
  \ 公众也充满了怀疑，特别是在反应西酰胺事件之后，该药物在未对孕妇进行测试的情况下仍被处方，导致数千名婴儿受到伤害。尽管这最早在 1961 年被报道，但 20\
  \ 世纪 70 年代初，《周日报》发起了一场大规模运动，将科学的失败留在了国民的记忆中。在 1971 年为《时报》撰写的一篇文章中，威廉姆斯承认“对科学家及其发现的怀疑日益增加，而且有一种广泛观点认为科学技术需要受到控制”。#25\
  \ 露易斯·布朗（Louise Brown）的成功出生似乎扭转了这一趋势：一个切实的、英国的科学奇迹。但即使在重大时刻之后，爱德华（Edwards）和斯普托（Steptoe）未能获得任何公共资助来进一步他们的研究。医学研究委员会和卫生部都拒绝了他们，导致他们在筹集资金期间工作中断了两年。#26\
  \ 有趣的是，《每日邮件报》最初提议为一个设施提供资金，但随着公众舆论风暴加剧，他们也退出了，担心竞争对手《每日快报》所说的“婴儿革命的变异”。#27\n\n\n\
  “胚胎学[及]基因工程的最新进展……产生了一系列需要在医学伦理和法律领域解决的关键问题，”威廉姆斯在 1982 年 2 月给首相的信中写道。（注：提供的文本在此部分包含重复内容；核心信息已保留）。\n\
  \n遗传的本质是令人的。在她看来，威廉姆斯建议委员会必须是跨学科的，成员不仅要由科学家组成，还要来自那些有理解力的人。她以礼貌而庄重的语气结束道：“我希望您对这一建议进行仔细考虑。”#28\n\
  \n\n此前，撒切尔政府一直希望现有的医疗机构——医学研究委员会、英国协会、英国产科学院——能够自行采取行动。#29 直到 1978 年（即露易斯·布朗出生的那年），英国医学杂志仍将整个生物伦理学概念称为一种美国的潮流。#30\
  \ 但反复发生的科学丑闻——从反应酰胺到艾滋病，再到疯牛病和沙门菌——在公众想象中扎根，导致了对医疗参与的需求。作为公众意见的风向标，BBC 在 1980 年甚至邀请伊恩·肯尼迪（Ian\
  \ Kennedy）发表年度里西斯演讲，他指出健康太重要，不能完全由医生决定。#31\n\n但莎莉·威廉姆斯并非那个时代唯一的精明女性政治家。撒切尔也是这项让科学接受更大审查运动的意外盟友。撒切尔本人就是科学家，她在牛津大学曾在诺贝尔奖获得者多萝西·霍金金（Dorothy\
  \ Hodgkin）门学习化学；正如特纳所指出的，她有效地兼并了左翼的激进语言，将其指向国家，并在所谓的大众自由和选择之名追求个人主义。在 1979 年的竞选宣言中，她写道：“这次选举可能是我们恢复人民权力平衡的最后机会。”她当年的选举胜利表明，这种信息受到了良好的反响。“撒切尔将自己描绘成致力于挑战体制权威的激进局外人，这是一种得票策略，”特纳观察道，这让左翼处于了往往维护现状的尴尬地位。#32\
  \ 在她的第二个任期，她甚至吸收了左翼最著名的短语之一，在 1986 年的党会议演讲中大胆地声称，是我们保守党正在将权力还给人民。#33\n\n撒切尔以极擅长理解民意闻名，她立即看到了莎莉·威廉姆斯请求的价值。撒切尔的一位私人秘书按规定写信给卫生和社会保障部（DHSS）的同事，征求他们对议员建议的意见，并指出鉴于公众关注的日益增加，首相的初步观点是对这些伦理问题进行某种形式的独立调查是必要的。#34\n\
  \n\n\n\n\n诺曼·福勒（Norman Fowler）是负责这一新医疗与科学领域的初级部长，他承诺考虑各种方案，并提交了一项与威廉斯信中内容非常相似的建议。反对方的压力日益增大，一名工党议员甚至威胁要使用议会程序，试图确保建立一个“跨部门跨学科咨询委员会”，且其中半数成员应为女性。福勒和撒彻尔都认为这没有必要。（撒彻尔因其不关心其他女性的进步而闻名。）但到了\
  \ 4 月时，这位初级部长深信有充分的理由建立一个独立委员会——尽管不是一个全面的皇家委员会。这种区别在实质上并无差异：该委员会将由独立人士主持，成员“将包括医生、科学家、律师、具有婚姻咨询和神学背景的人士，以及……非专家”，并向政府提交其建议报告。福勒解释说，体外婴儿（IVF）这项新技术最初“被证明相对没有争议”，但从那以后，“公众对这些问题的关注通过媒体报道变得集中”，并且“可能会由于在该领域工作的各个小组发布新公告而持续”。35\
  \ 随着爱德华兹、斯普普托和珀迪成功的激励，科学研究正在迅速进展。\n\n成立委员会的决定是高明的政治手段：它避免了在辩论白热化时产生本反应，同时确保了这项改变生活的新技术受到某种程度的民主审查。首相同意了福勒的提议；尽管作为一个老练的政治家，她似乎与她的首席党鞭一致，认为委员会的“报告时间安排得恰好，不会在下一次大选结果之前出炉”。如果结果糟糕，政府希望确保有充足的时间来收拾残局。36\n\
  \n谨慎行事并吸取广泛的意见，这已经尽可能地背离了硅谷那种“颠覆性”的精神。但这恰恰是沃诺克委员会（Warnock Commission）诞生的方式，它刻意花时间纳入所有关键派系的声音，这些派系最终必须在这个由新技术所改变的世界中共存。组建这个委员会的过程并非偶然，本完全可能出错。世界各地定期召开各种类似的小组、评审委员会和蓝奖委员会，但很少有委员会能像本案这样催生出稳定性和最终共识。最终让这个委员会脱颖而出的是它的领导，以及随后参与者表现出的将妥协放在理想之上的意愿。今天任何复制沃诺克委员会成功的尝试，都需要关注这位女性的经验、动机和韧性，她成功地从这样一个争议性问题中理出了尽管不完美但可行的清晰思路。\n\
  \n\n“我不是她的宠儿，她也不是我的。”\n\n当 2013 年玛丽·沃诺克男爵士（Baroness Mary Warnock）被要求评价对玛格丽特·撒彻尔（Margaret\
  \ Thatcher）的看法时，这是她的回答。当时年近九十岁的这位先驱哲学家拥有长期而卓越的职业生涯，她回顾过去，并向观众中的年轻女性分享建议。恰巧的是，她与**莎莉·威廉斯（Shirley\
  \ Williams）一起接受采访，后者对这位前首相表现出更多的钦佩，指出撒彻尔的职业轨迹是多么不凡。沃诺克爵士的评价没那么好。在几年前写的一本回忆录中，这位先驱哲学家描述了她尽管钦佩撒彻尔，却逐渐发现撒彻尔主义是`令人厌恶的`。\n\
  \n玛丽和玛格丽特在牛津大学求学时是同学，前者学习古典文学，后者学习化学。当撒彻尔追求政治生涯时，沃诺克成为了一名学者，在职业生涯早期担任了`牛津女子高中（Oxford\
  \ High School for Girls）`的校长。她作为伦理学家和教育工作者的双重经验使她成为炙受青爱的委员会主席。她在 20 世纪 70 年代加入了`环境污染皇家委员会（Royal\
  \ Commission on Environmental Pollution）`，甚至被当时担任教育长的撒彻尔任命主持一项关于特殊需求的调查。这两位女性直到多年后才见面，而那时撒彻尔的政党已被踢出政府。\n\
  \n* * *\n\n1982 年夏天，福勒写信给首相，建议由沃诺克担任新委员会的主席。他们也考虑过其他人，包括儿童慈善机构`巴纳多德（Barnardo’s）`的女性主席和一位前大学校长，但这个委员会将是`重要的且在智力上具有挑战性的，涉及复杂的社会和道德问题`，而沃诺克不仅是一位经过证明的委员会主席，更是一位哲学家。福勒附了一份关于要点的简短简历，仅有五十个字；结尾是一句简短但显然相关的：`有\
  \ 5 个孩子。`首相随手写下了她的回复：`好的。`39\n\n\n\n\n沃诺克（Warnock）对委员会的看法非常明确——即一个致力于公共事务、审慎考量和教育的女性视角。她认为，体外受婴儿（IVF）及相关技术的监管“不应在私人领域进行，而应在公共领域”。40\
  \ 委员会的成员非常符合莎莉·威廉姆斯（Shirley Williams）最初对多样性的建议。在十六位成员中，绝大多数人并非科学家，而是来自更广泛的公民：其中包括七位来自不同宗教背景的医生和科学家，以及法律界人士、社会工作者、一位神学家，以及来自医疗信托基金和英国移民建议服务的公共服务管理人员。政府赞扬这种“广泛基础”的成员构成，特别是与医疗机构设立的审查机构相比；而委员会自己认为，其多样化的性质可能有助于增加公众信任。41\
  \ 埃德华兹（Edwards）和斯普托（Steptoe）都没有在委员会中，尽管埃德华兹积极参与了围绕其工作的伦理辩论。相反，高级发育生物学家安·麦克拉伦（Anne\
  \ McLaren）受邀加入，她在解释和翻译科学方面的努力被证明是无价的。\n\n然而，埃德华兹被邀请与三百多名其他个人和团体一起向委员会提供证词，其中包括堕胎辩论的双方以及所有主要宗教的代表。42\
  \ 还有数百人向他们写了信，也写给了卫生部和议会议员。所有信件都送达了沃诺克委员会。（然而，布朗一家由于担心被“剥削”，并未征求意见。43\n\n在路易丝·布朗（Louise\
  \ Brown）出生和沃诺克委员会成立后的多年里，引起公众关注的相关问题愈演愈烈，尽管沃诺克相对确信 IVF 本身能够经受争议。她说，英国人“对路易丝·布朗成为世界上第一个这样的婴儿感到相当自豪”，而且对一刀切的禁止并没有太大兴趣。45\
  \ 但委员会面临的其他问题更具争议性。有代孕、捐精人工授精、捐卵子的问题。如果委员会允许代孕和捐卵子，那么他们是否也允许对这些胚胎进行性别筛选？这些服务的报酬如何计算？最复杂的仍然是胚胎实验问题。“在实验室中产生胚胎然后扔掉其中一半的想法让人们感到反感，”沃诺克在\
  \ 2018 年的一次采访中反思道，“他们认为这就像扔掉一个婴儿。”46\n\n对于 SPUC（学生保护生命联合会）、LIFE（生命）和其他反堕胎团体来说，胚胎研究这一模糊的问题成为了他们自身运动的有用工具。尽管主题非常不同，但对于匆匆过的观众来说，它们可以被归类为一场关于“生命神圣性”的辩论，或是对英国道德普遍日益恶化的进一步证明。从一开始，沃诺克就知道她的委员会中至少有两位成员坚决反对胚胎研究，并且不会改变主意。47\
  \ 正因如此，虽然决定不建议全面禁止 IVF 的决定“非常快”，但委员会要在胚胎研究辩论中找到一种公众可以接受的方法，被证明是异常困难的。\n\n***\n\n\
  沃诺克委员会花了两年时间产出他们的报告和建议。“报告中的每一个字都是我亲自写的，”沃诺克后来说。48 这份出版物丝毫不谦虚地命名为《生命的问题》（`A Question\
  \ of Life`）。这个标题暗示着宏大感，仿佛在扮演上帝。这与报告中其他务实的建议完全格格不入。报告总共有六四项建议，所有建议最终都以某种形式在 1990\
  \ 年前被纳入英国法律。它们根据委员会的职权范围涵盖了无数问题：IVF、代孕、人工授精、卵子和精子捐赠、卵子和精子储存、性别筛选、克隆等。但富兰克林（Franklin）所说的“双支柱”仅来自沃诺克报告中的两项建议：建立一个许可机构来监测和批准人类胚胎学，以及后来为人知的“十四天规则”。\n\
  \n沃诺克委员会认为，他们找到了一种社会可以接受的方法来让人类胚胎研究继续进行。他们的提议是允许研究，但必须遵守严格的许可制度，并在受精后十四天后完全禁止，违反者将面临刑事制裁。当时给出的这一截止日期的理由是，在第十四天时，所谓的“原线”（primitive\
  \ streak）出现，此时细胞群分化为未来将成为脊髓和神经系统。这也是细胞群分裂成双胞胎或三胞胎的最后时刻。沃诺克非常依赖安·麦克拉伦为她的委员会提供科学教育，在第二次会议上，她将议程完全交给了这位生物学家，希望她能用“我们大家都能理解的语言”向其他成员解释科学。幸运的是，麦克拉伦事实证明是“大自然的老师之一”。49\
  \ 在 1983 年 11 月 9 日的一次关键会议上，麦克拉伦提交了一篇名为《在哪里划线？》（`Where to Draw the Line?`）的论文，她在文中解释了在受精后十四天内使用“前胚胎”（pre-embryo），之后使用“胚胎”（embryo\
  \ proper）的理由。这种区分对于委员会以及后来的公众理解他们被要求批准的内容至关重要。麦克拉伦指出，正是在十四天左右，“我们第一次识别并界定了一个离散个体的边界——一个个体。”50\n\
  \n“在智力上，这并不是一个合理的立场，”珍妮·克罗特（Jenny Croft）在 2008 年接受采访时承认道。克罗特曾是沃诺克委员会的秘书，是负责管理委员会议程、阅读材料、结构和产出的公务员。“你看，并没有某一个点是胚胎变得变得特殊的。真的没有。”51\
  \ 确实，这一点在生物学上是有争议的，并且被一些科学家（包括在《自然》杂志上的那些）否定了。但沃诺克和麦克拉伦理解到了某种更深层且与科学事实同样真实的事。首先，科学本身往往是有争议的，特别是在早期阶段。很少有这样一种显而易见、清晰且不可反驳的事实能随着知识的扩大而无法被反驳或至少被改进；这就是科学方法的美妙所在。\n\
  \n\n\n其次，沃诺克（Warnock）和麦克伦（McLaren）都明白，科学有时需要在社会层面翻译。对胚胎发育的高层次解释确实很重要，但一个特定的天数是所有人不仅能够理解而且能够遵循的标准。胚胎在十四天后是否还接受实验？这个问题可以简单地回答：是或否。没有科学家可以辩称在他们的实验中，原痕实际上是在二十一天才出现的，因此他们花费了更长时间。这是一个公平的竞技场，一条清晰的界限，不可置疑。作为委员会秘书，克罗夫特（Croft）在\
  \ 1983 年一次关于“十四天规则”的关键会议后，写了一份备忘录总结了当时的局面。“沃诺克夫人向秘书处透露，”她向同事们写道，“她个人认为对任何阶段的胚胎实验没有反对意见，但我认为她意识到，公众情感的力量要求……可能应该有一个截止点，在此之后不允许进行任何形式的实验。”52\
  \ 在涉及公众方面，沃诺克的直觉被证明与撒切一样敏锐。\n\n***\n\n\n当《生命的问题》（A Question of Life）发表时，其反应用沃诺克自己的话描述最为恰当：“复杂”。她记得首席拉比写了一封回复，标题写道“沃诺克摧毁了道德”，53，在议会中，反对该报告结论的人呼吁立即暂停所有胚胎研究。但并非只有反对研究的人对委员会有理据的折中方案持批评态度。科学界也转而反对沃诺克，其中包括罗伯特·爱德华兹（Robert\
  \ Edwards），他继续拒绝科学家需要法律监管的观点，认为自我监管和个人道德就足以防止滥用。在`Nature`（自然）杂志上，他的这些评论得到了共鸣，整个监管科学的概念被拒绝了，理由是科学家“在看之前并不知道他们会发现什么”。正如沃诺克所预料的那样，医学研究理事会（Medical\
  \ Research Council）反对十四天规则，并主张根据胚胎发育情况来划定界限，54，皇家学会也是如此。55\n\n1984 年《新科学家》（New Scientist）上的一篇文章指责沃诺克报告具有导致“破坏性立法”的可能，并驳斥其在科学上不合逻辑，且“混乱和模棱两可”。这篇文章充满了对这位女哲学家几乎毫不掩饰的性别歧视和傲慢——指出她“混乱的”定义和“染着歇斯底里式色彩”的建议。”56\
  \ 即使是首相的首席科学顾问罗宾·尼科尔森（Robin Nicholson）也建议无视该报告中关于建立独立许可机构的首要建议，转而支持由科学和医学专业领域进行自我监管。作为回应，撒切尔再次展现了作为紧跟时代精神的政治家的敏锐判断力。“要将此类在情感上如此重要的事情——如此基础的事情——留给自我监管是困难的，”她在回复中批注道。”57\n\
  \n\n莎拉·富兰克林（Sarah Franklin）教授将其称为“沃诺克共识”：即“作为允许对人类胚胎进行有争议研究的交换，此类研究将由许可机构进行监督，并受到最严格的制裁。”58\
  \ 确实，沃诺克的委员会中有些成员想要完全禁止胚胎研究，正如她所料到的会有这样的人。在策略上，沃诺克允许那些成员撰写反对意见，而不是让其偏离整体共识的达成。但科学家的反对是不成比例的，而且对他们的事业没有帮助。沃诺克和麦克伦都为自己的工作辩护，试图让科学界理解公众关注对他们实验的相关性。沃诺克在《新科学家》的后后版本中写道，“非专家的人认为他们有权帮助决定……在民主中，必须考虑公众意见。”59\
  \ 社会。\n\n***\n\n\n自 2022 年底`ChatGPT`出现以来，关于 AI 对人类意味着什么的讨论呈爆炸式增长。这种报道与胚胎学研究非常相似，但对受影响最多的人的关注相对较少。像皇家学会这样的机构已经试图通过民意调查等方法了解对\
  \ AI 的态度。60 但 AI 只能从更广泛的审查、质询和参与中受益。然而，科技行业并不以接受外部视角而闻名。例如，史夫·乔布斯（Steve Jobs）深信人们并不知道自己想要什么，需要像他这样的创新者来构建未来并指引方向。这种想法渗透在硅谷的“颠覆”文化中，在某些情况下非常有道理。焦点小组可能无法想出`iPhone`和`iPad`。当全新的技术或科学突破出现时，那是魔力的一部分。\n\
  \n但创新者可以做的是倾听技术给人们带来的感受、产生的影响并做出回应。人们并不愚蠢，他们的直觉通常指示着严重的问题。选择倾听的人更有可能开发并维护公众信任的 AI\
  \ 技术。\n\n\n当然，更大的合法性将来自由政府任命的真正透明且多元的委员会，其意在于讨论并最终实施其建议。监管是必须的，关于其最终应该是什么样子的想法层出不穷，从欧盟将完全禁止深度伪造操纵等高风险\
  \ AI 用途的《AI 法案》（AI Act），到美国的《AI 权利法蓝图》，后者列出了人们在遇到 AI 系统可以且应该期待的权利，但没有法律上的硬性限制。更广泛的咨询和更深入的讨论将有助于找出最需要干预的地方，反而为寻求创新的企业提供更大的确定性。\n\
  \n考虑到可能关注的问题范围，任何此类委员会都需要一个明确且具体的授权，即使如此，要调和公众担忧与私人企业的勃勃野心也不是容易的。但我们值得思考谁最适合组成这样一个委员会，考虑到沃诺克小组的感知合法性部分源于其异质性。工会领袖、社会科学家和法律专家只是一些可能的声音，更不用说伦理学家和哲学家，比如沃诺克。人们可能会倾向于让任何此类委员会充满\
  \ AI 技术专家，这必须避免，以防被某种企业思维所俘获。\n\n\n\n但如果没有沃诺克（Warnock）所展现出的领导力和务实精神，即使是一个真正具有代表性的机构，可能永远无法摆脱争吵和政治作秀。如果政府和委员会不进一步将他们的建议转化为法律，那么委员会最精明的领导力也可能导致无功而返。\n\
  \n在《生命的问题》（*A Question of Life*）中，支持胚胎研究但反对“十四天规则”的人，很快就会面临比达成一个深思熟虑的妥协更棘手的问题。到\
  \ 1984 年夏天《沃诺克报告》发布时，`SPUC` 和 `LIFE` 已经赢得了一名臭名昭著的议员加入他们的阵营。\n\n埃诺·鲍威尔（Enoch Powell）将永远因其种族主义且具有煽动性的“血之河”演讲而广为人知，撒切尔的前任曾因此从影子内阁中开他。但在\
  \ 1984 年，他仍是一名在任议员，现在他找到了一个新的捍卫事业。由于在抽签中获得了所谓的“私人议员法案”（`PMB`）机会——这是一种允许议员在不依赖政府提供议会时间的情况下将自己的主张提交讨论的立法手段——鲍威尔被反堕胎运动说服，引入了《未出生儿童保护法案》（`Unborn\
  \ Child (Protection) Bill`）。该法案在《生命的问题》发布几个月后公布，试图规定利用 `IVF` 创建的人类胚胎进行科学研究或“除让女性怀孕外的任何其他用途”均为非法。法案并未直接针对堕胎，但其意图显而易见。如果他们能将胚胎设定为鲍威尔标题中的“未出生儿童”，那么这一原则延伸到堕胎改革的潜力就是巨大的。事实上，在法案提出的当天，`LIFE`\
  \ 的一份请愿书提交了议会，该请愿书确认签署者相信，与十四天规则相反，“新受精的人类胚胎是一个真实的、活生的人类个体。”\n\n`PMB` 的成功与否通常取决于政府的态度。一项法案要真正取得进展，需要政府的许可，否则很容易被口头否决。尽管如此，如果政府内部有大量人最终支持某项\
  \ `PMB`，政府无疑会注意到，正如《未出生儿童保护法案》的情况一样。在关键的投票阶段，该法案以 238 票对 66 票的压倒性优势通过。在 650 名议员中，显然并不是每个人都费心投票。然而，令政府担忧的是，几乎一半的保守党议员选择了投票；而在这些投票者中，近\
  \ 90%的人支持鲍威尔。《沃诺克报告》及其十四天规则与保守党的观点格格不入。\n\n政府已经意识到了人们对 `IVF` 和人类胚胎研究在态上的差异，并引入了一个由一位著名哲学家领导的跨学科独立委员会，就他们他们那些已知的超出科学或医学范畴的问题提供建议。《沃诺克报告》找到了一条出路，正如弗兰克林（Franklin）所说，通过“汇集专家事实、道德边界、个人情感、具有说服力的叙述、令人信服的图像和令人安心的逻辑”。尽管如此，各阵营仍然分裂：科学家们反对对其工作进行任何限制，而似乎大多数立法者则反对这类工作的开展。\n\
  \n政治如果不是一种对大众的理解练习，那就毫无意义，撒切尔对自己对选民的直觉以及她坚定果决的领导力感到自豪。《生命的问题》已经达成了一个共识立场，但撒切尔厌恶共识。她在执政早期就曾宣布：“在‘我代表共识’的旗帜下，会有什么伟大的事业被战斗并赢得？”根据《沃诺克报告》，`IVF`、胚胎研究以及生命本身的未来，取决于她对这些话有多深的信念。\n\
  \n\n首席党鞭要求沃诺克在下一次大选后提交报告，事实证明是远见的。撒切尔在 1983 年赢得了决定性的胜利。随着工党的分裂以及福尔兰群战争后她个人支持率的大增，撒切尔的胜利使她比以往任何时候都强大，根据历史学家艾尔温·特纳（Alwyn\
  \ Turner）的说法，“她几乎是不可挑战的”。尽管如此，她第二个任期的开始标志着冲突。在 1984 年 10 月于布莱顿举行的保守党年度会议上，由于 `IRA`\
  \ 在她的酒店安放了炸弹（导致 5 人死亡），她险些逃一劫。1984 年和 1985 年也陷入了系列罢工中，矿工和警察之间发生了暴力冲突，这场工业纠纷在公共舆论中占据的地位在此之前之后都未曾见过。因此，当一封来自首相首席科学家的信件出现在她的办公桌上，试图解释为什么鲍威尔的法案在生物学上是不合逻辑的，以及政府理应大声宣布这一点时，她并没有多少时间来考虑或优先处理它。尽管如此，她的档案显示她读了这封信，并在其中划了某些段落表示明显的认同，但对信中的核心主张表示异议——生命并非从受精开始，因为受精仅仅“产生了一种遗传学上的新奇细胞”，这种细胞只有成为人类的潜力。“这里有一丝诡辩的色彩，”她那持怀疑的私人秘书写道，撒切尔也表示赞同。\n\
  \n撒切尔的立场通过私人秘书传回给了首席科学家。他被告知，首相“完全不确定你对受精的描述会获得广泛支持，而且她个人对人类胚胎研究的合理性仍不完全信服”。然而，这很大程度上只是首相的“个人观点”，不便外传。随后，在\
  \ 6 月的一次首相质问环节中，撒切尔公开表示她“认同许多”支持鲍威尔立场的观点，但克制了做出立法承诺的动作。该法案将进行自由投票，但首相显然表示同情。在《沃诺克报告》之后，按照其提议的细致妥协进行人类胚胎学研究的前景看起来并不乐观。完全禁令似乎变得可能。\n\
  \n\n\n\n\n当政府认为必要平息公众或议会的愤怒时，她的政府也不排除剔除并实施单项沃诺克的建议。那年早些时候，当发现一位名叫金姆·科顿（Kim Cotton）的女性被一对夫妇支付了\
  \ 6500 英镑代孕时，该国首个著名的商业代孕案例。沃诺克及其委员会建议禁止代孕付费行为，由于这种做法引发了巨大的恐慌，以至于立即出台了禁止此事的立法。这种仓促的禁令很容易终结胚胎研究。相反，撒切尔夫人公开地未能对鲍威尔的法案阐明官方立场。她写道，议员们可以“自由投票”，而政府将保持“中立”。对于沃诺克提出的其余问题，政府将在“我们完成对这些问题的考虑后”揭示立场。73\n\
  \n事实上，在《生命的问题》（*A Question of Life*）出版一年后，政府对沃诺克报告的策略似乎最形象的描述就是把球踢进了深深的草丛中。多位卫生部长试图找到方法平息日益高涨的愤怒，并阻止像鲍威尔那样的后座议员进一步自采取行动，但政府拒绝提出任何自己的立法。最终，在缺乏公开且强力的政府支持的情况下，《未出生儿童（保护）法案》失败了。74\
  \ 但由于沃诺克报告仍被边缘化化，人类胚胎学研究的未来远未稳定。\n\n***\n\n玛格丽特·撒切尔对沃诺克委员会和胚胎研究最终采取的立场有些奇怪。她似乎确实在与该主题进行真切斗争，但在报告发布几年后，她都没有公开支持其中一方。也许她是在她一方面对科学的理解与尊重，与另一方面对道德和政治的考量之间挣扎。她作为一名科学家-政治家的遗产并不经常被讨论，但在历史学家乔·阿加（Jon\
  \ Agar）对撒切尔科学训练的开创性回顾中，他展示了这种训练实际上如何显著地影响了她的执政特征。\n\n通过对档案材料的仔细审查，阿加推断出“她在首相期间积极保持对科学的兴趣，这与她周围的官员和部长形成了对比。”她的工作人员在备忘录中承认她的科学背景，她的最后一位首席科学家报告说，“她对科学作为一个学科感兴趣，听取科学推理，乐于谈论科学并享受其中。”当她在《蒙特利尔议定书》中发挥关键作用时（该协议有助于逐步淘汰氟氯化物以保护臭氧层），阿加指出，这在一定是因为她收到了详细的简报。1979\
  \ 年进入唐宁街时，她在办公室里甚至安装了迈克尔·法拉第（Michael Faraday）的胸像和艾萨克·牛顿（Isaac Newton）的肖像，同时保留着她导师导师多萝西·霍金金（Dorothy\
  \ Hodgkin）的照片，后者对她的职业产生了强烈影响。75 76\n\n阿加认为，撒切尔对她执政期间两个“与科学相关的公众问题”的态度，相反，是含糊其辞，将它们视为道德问题而非科学问题。当艾滋病摧毁英国的性少数群体时，媒体部分和医疗机构并未给予严肃对待，而是付以嘲笑。鉴于撒切尔政府后来通过了禁止地方当局包括学校在“推广”同性恋的残忍且有害的《第\
  \ 28 条》（*Section 28*），很难不从其出的反应中看到偏见。政府的官方回应再次是采取“深思熟虑的中立”77—面对这种公民这是一个困惑的立场。撒切尔的道德干预延迟了重要健康信息的传播，尽管她最终在部长和顾问面前退缩了。78\n\
  \n她对胚胎研究的反应（如果是不孕夫妇的 IVF）似乎遵循了类似的道德模式。迟到 1987 年，在沃诺克报告发布三年后，她的档案显示，她对英国诊所和实验室产生的许多生殖创新仍极端怀疑。对于《生命》组织呼吁暂停所有胚胎研究的请愿书，她写了一封友好但不置任何承诺的回应。79\
  \ 她同意与一个后座议员代表团会面，这些议员强调，暂停研究并与西方民主国家脱节，因为法国和澳大利亚部分地区已经实施了禁令，美国事实上也是禁止的。一份会议报告显示，首相承认“她个人反对使用未知供者的精子进行人工授精，并对沃诺克报告中的某些结论感到有些惊讶”。80\
  \ 当卫生部长托尼·牛顿（Tony Newton）试图通过提交一份“尽可能遵循沃诺克建议”的“综合法案”来再次缓解“立法压力”时，首相写下了她的回复：“这本法案只会带来麻烦。”81\
  \ 她的直觉告诉她要延迟，而不是完全拒绝。她正在与这场复杂的辩论搏斗，正如她统治的许多人一样。这一政治和历史时刻之所以具有启发意义，是因为政府在承认各派系强烈情感、怀疑和分歧的同时，没有急于通过仓促的立法行动停止辩论。撒切尔可以通过支持鲍威尔法案来为她的保守选民赢得支持。她从一开始就倾向于支持它。然而，最终使《人类受精与胚胎法》成为可能的，在于她愿意等待、听取公众和各种专家的意见，并且在鲍威尔法案几乎引发危机后，科学界最终接受了某种形式的监管，并支持沃诺克的妥协方案。\n\
  \n\n\n\n\n如今的 AI 同样派系分立，从认为 AI 最终将导致人类灭绝的“末日论者”，到认为不应进行任何监管以防阻止创新浪潮的人，以及介于两者之间的各种观点。煽动辩论的任何一方都可能是一种获胜的政治策略，但我们很庆幸，AI\
  \ 到此为止避免了政治橡皮球。\n## 进展\n\n归根结，政府对`沃诺克报告 nWarnock Report）的持续推迟，有利于辩论中支持研究的一方。科学界对议员对`埃诺克·鲍威尔法案\
  \ nEnoch Powell’s bill）的压倒性支持，以及他们的研究可能被完全禁止的现实可能性感到震惊并采取了行动。`医学研究委员会 nMedical Research\
  \ Council）取消了对`沃诺克`立场的反对，并接受了某些监管是必要的，甚至效仿该报告的主要建议建立了了自己的`自愿许可当局 nVoluntary Licensing\
  \ Authority），并开始颁发第一批受监督的人类胚研究许可以证明该概念的可行性。在备赞誉的《自然》（Nature）杂志上，人们也意识到整个人类胚胎研究正面临存亡危机，因此发表了一篇鼓励科学界组织起来捍卫`沃诺克`计划的社论。作为`SPUC`和`LIFE`等机构的反抗力量，“人类生殖研究进步运动\
  \ nProgress Campaign for Research into Human Reproduction”（简称`Progress`）于同年应对`鲍威尔`的活动而成立，并立即发起了媒体和议会游说活动。\n\
  \n游说者的首要人物是`沃诺克`和`麦克伦 nMcLaren`。“安·麦克伦和我在报告发布到其作为法案进行讨论的六年间确实付出了很多努力，”`沃诺克`爵夫人说。他们利用那段时间“走遍全国，与学校学生、大学生、议会议员以及任何向我们提问的人交谈”，都是为了解释他们的报告。`沃诺克`参加了多次媒体露面和报纸采访，耐心地一遍又一遍解释她的委员会是如何得出这一立场的。`Progress`也将将展示胚胎研究非常切实且改善生活的处视为自己的任务。领军人物不是`罗伯特·爱德华\
  \ nRobert Edwards`，而是`罗伯特·温斯顿教授 nProfessor Robert Winston`，这位争议较小的人物凭借其令人安心的神态和电视形象在很大程度上平复了神经。\n\
  \n这就是所谓的穿白大褂摆弄人类生命的科学家之一，但`温斯顿`却是一个和蔼慈爱的丈夫，相比之下，他的对手显得“歇斯底里”。作为`Progress`的主席，他成为了该运动的灵魂人物，并努力确保议员和贵族能够见到生活被胚胎研究和`试管婴儿\
  \ nIVF`所改变的家庭。相比之下，`SPUC`向所有议员寄送了一个二十周大胎儿的等比例模型，这种噱头似乎对他们的事业没有帮助。\n\n大约同一时间，`沃诺克报告`中的“十四天界限”进入了`Progress`的竞选语言，他们开始使用“前胚胎”（pre-embryo）一词来指代原始生带出现之前的结构。并不是所有人都对此感到满意，科学界的一些人仍然坚持他们自\
  \ 1984 年以来的反对（《自然》杂志的编辑甚至讽刺地建议禁止该术语）。但所有这些宣传活动无疑产生了影响，甚至`玛格丽特·撒彻 nMargaret Thatcher`在与`麦克伦`私下简报后也强调了十四天规则。`沃诺克`和`温斯顿`以及`约克主教\
  \ nArchbishop of York`等宗教领袖成为了英国公众信任的专家。被信任说实话，被信任设定边界，被信任引导英国远离“滑坡效应”。\n\n当政府最终于\
  \ 1990 年提出立法时，在对最终提案进行两次进一步咨询（这些提案基本上将《生命问题 nA Question of Life》的所有内容纳入了法律）之后，英国公众及其在议会的代表对`试管婴儿`之外的人类胚胎学研究的益处变得更加开放了。在关键投票前几天，又获得了一次进一步助力，`温斯顿`透露他和所在的`汉默斯密斯不孕诊所\
  \ nHammersmith Infertility Clinic`的团队成功开发出一种筛选与胎儿性别相关疾病的测试。媒体能够解释，某些遗传疾病主要影响男孩，现在`温斯顿`的诊所可以在`试管婴儿`的同时使用新技术，确保高风险遗传这些疾病状况的夫妇可以生下不受其影响的女孩。虽然这种做法并非没有道德问题，但这正是`Progress`一直寻求证明的益处类型。正如`沃诺克`建议的，在法定许可机构的监督下并仅在十四天内允许这样做，似乎是帮助这些家庭同时限制潜在滥用的合智方法。\n\
  \n***\n\n到 1990 年，发生了另一项重大变化。更多的女性——更多身体会受法律影响的人——坐在下议院。他们的干预证明是至关重要的。回到 1985 年，在对`埃诺克·鲍威尔私人议员法\
  \ nEnoch Powell’s PMB`进行辩论和灾难性投票时，女性议员不到 4%。尽管人数稀少，他们当时勇敢地发了声，包括议员`克莱尔·肖特 nClare\
  \ Short MP`，她坚称女性在影响其身体的立法方面具有特殊地位，担心如此重大的决定是由一个男性组成的议院做出的。“女性理解这些问题的方式与男性不一样，因为她们在日常生活中处理这些问题，”她在`鲍威尔的未出生儿童（保护）法案\
  \ nPowell’s Unborn Child (Protection) Bill`获得如此支持的二读辩论中说道。“女性对这个主题更熟悉，而男性则将其设定为道德原则和逻辑构建。女性知道自然界有成千上万的胎儿被浪费……自然的组织方式是浪费的。由于流产、使用宫内环以及各种原因，胎儿每个月都在被摧毁。男性必须面对这一点。”\n\
  \n但在 1987 年的大选中中（这是`玛格丽特·撒彻`作为其政党领袖最后一次参加的选举），有更多的女性当选。到 1990 年辩论时，尽管人数仍远少于男性，但有更多女性愿意为那些受拟议法律影响最直接的一半人口发声。\
  \ 1987 年新当选的`罗西·巴恩斯 nRosie Barnes` 动人地讲述了她在怀孕期间感染麻疹的经历、这对她的宝宝可能造成的伤害，以及她因此遭受的担忧。在胎儿可能受到疾病严重影响的情况下获得堕胎机会，`巴恩斯`描述了她那痛苦的决定。“对于任何人来说，能够在子宫内孩子出生之前做出决定，对人类来说将是巨大的一步，”她在议院中说道，主倡胚胎研究允许的基因筛查，“我们不应该放弃那个选择。”\n\
  \n\n\n\n到那个年代末，撒切尔对科学政策的整体立场也发生了变化。阿加（Agar）将此归功于新科学顾问 `George Guise` 的到来，他鼓励她支持“基础的、好奇心驱动型”的研究，而非主导英国科学政策数十年的“贴近市场型”`RND`。93\
  \ 这种突如其来的转变为使政府政策与“拯救英国科学”运动更加契合，该运动对 `1988` 年预算中对科学支出的调整表示欢迎。94 `Guise` 开始担任首相的“守门人”，而像\
  \ `Royal Society` 这样更具体制内的科学机构发现，尽管此前曾被冷落，但现在更容易进入唐宁街了。95 `Thatcher` 甚至在 1988 年底在\
  \ `Royal Society` 本身发表了一场具有里程碑意义的科学演讲，这场演讲现在因她对气候变化的行动号召而闻名，而阿加指出，她此前对此也持怀疑态度。\n\
  \n我们永远无法得知，但自然会想象，不仅是因为她的科学背景，而是她对生育和生殖健康的个人经历，或者至少是理解并共情全国范围内家庭的能力，帮助她对 `Warnock`\
  \ 的立场保持开放态度。从 `1988` 年开始，`Thatcher` 对胚胎研究的理念采取了更加积极的公开立场。她接受了 `Royal Society 胚胎研究工作小组`成员（包括\
  \ `Anne McLaren`）的个人简报。该小组主席曾游说反对“十四天规则”，认为其过于具有限制性，但 `McLaren` 似乎意识到，`Thatcher`\
  \ 会更容易接受这种论点：即对胚胎进行研究将允许基因筛选，从而在发现无法治愈或危及生命的疾病后，实际上可以防止晚期流胎。十四天规则是一种保护，是一道不可逾越的界限。96\
  \ 这似乎缓解了首相的恐惧。次年，针对记者关于她打算如何在 `Warnock` 辩论中投票的直接提问，她评论道，她遇到的那些对胚胎进行“早期研究”的科学家解释说，正是在这些“早期阶段”，可能会发生流产和不孕问题。“我们对最好的科学建议负有不可推卸的责任，”她说，暗示了她的良知之票现在将她带向何方。她接着指出，她遇到的胚胎学家在“对生命的本质本质及其神圣性的敏感程度上”与其他人一样敏锐”。97\
  \ 换句话说，他们尊重无形的界限。\n\n尽管在几年前，她还是一个怀疑者，私下和公开都对 `Enoch Powell` 的法案表示过同情，但这位首相现在变成了胚胎研究的支持者。这可以归功于\
  \ `Winston` 和 `McLaren` 这样的科学家，他们投身这一事业，并将自己的角色不仅视为研究人员或从业者，更视为公民社会的解释者和参与者。也可以归功于\
  \ `Thatcher` 的部长和官员们，他们通过咨询文件和白皮书在噪音中开辟出了一条路径。（法案通过时当时的卫生部长 `Lord Kenneth Clarke`\
  \ 后来告诉我，“我当时的强烈动机是，我坚信这个问题需要去政治化。”98)\n\n\n`2017` 年，`英国`第二位女首相 `Theresa May` 引入了她的新工业战略，而由\
  \ `1990` 年`议会`法案建立负责监督人类胚胎学的`受精与胚胎学管理局` (`HFEA`）也见证了实力。\n\n在`美国`，关于`生殖`的辩论更为激烈。在`英国`，`人类受精与胚胎学管理局`\
  \ (`HFEA`) 在监督人类胚胎学的同时展现了实力，随着`干细胞研究`的进展，它取得了突破。99 相比之下，美国的问题陷入了政治斗争，导致 `George\
  \ W. Bush` 禁止了`干细胞研究`。00 与人类受精与胚胎学管理局 (`HFEA`) 认为政府干预会抑制科学进步的常见陈词不同，该机构表现稳健。\n\n\
  根据 `2019` 年的最新数据，`人类受精与胚胎学管理局` (`HFEA`) 监督了约 `130 万` 次 `IVF`周期，产生了 `40 万` 名婴儿。尽管\
  \ `IVF` 最初只是作为纠正异性夫妇不孕的方法出现，但它现在已让年长女性、单身人士和同性伴侣成为了父母。它改变了我们对家庭的定义。可能正因为现在它被视为常态，它才很少被誉为其实的成功故事。当我告诉人们这本书以及我将使用的案例时，是\
  \ `IVF` 引起了关注。与`阿波罗号`和`互联网`的发明相比，它不为人知，也更不受推崇。然而，正如 `Franklin` 所言，它是二十世纪“最重要的技术成就之一”。\n\
  \n* *\n\n当我询问丈夫关于`商业化捐卵`时，他认为这“有点奇怪”。而我的反应则相反，对这个概念感到非常放松，尽管对手术本身感到担忧。这两种反应都没有事实依据，试图寻找依据也没有意义。如果我们花时间进行全面的伦理、生物和经济分析，也许我们其中一个会有不同的感受，但那只是这对专注于生活其他方面的二十多年轻人的本能反应。政治就是这样运作的，致力于改变世界的创新的科学家最好记住这一点。普通大众没有时间讨论任何特定政策的细节。正如\
  \ `Mary Warnock` 简洁的言言，人们“期望有权帮助决定什么样的社会是可以接受的或不可接受的”。100\n\n\n\n随着人工智能的不断进步，我们的社会将面临许多道德和政策挑战。这些挑战从我们对可能在日常生活中追踪我们的实时人脸识别技术的**接受程度（或不适感）**，到如果\
  \ AI 开始快速发展并导致大量人员失业时对人类就业产生的影响。能够创建文本、图像和音乐的生成式 AI 模型可以带来很多乐趣，但这项技术的对错之分并不总是显而易见的。对于难以用言语流畅表达自己的人来说，它可能提供巨大的帮助，并帮助释放创造力。然而，虽然生成的人类图像推可以在通用训练视频中相当安全地使用，但当它们被武器化和滥用时该如何？为了说明这一点，2023\
  \ 年，记者埃利特·希金斯（Eliot Higgins）使用 AI 程序创建并在 Twitter 上发布了多张唐纳德·特朗普被捕的虚假图像。101 如果这导致了他的支持者像\
  \ 2021 年 1 月 6 日入侵美国国会大厦期间那样起义，那么目前还不清楚如何管理创作这些图像的法律责任和责任。还有其他棘手的例子，例如如何处理与模仿艺术家风格且基于其作品进行训练的生成图像相关的艺术家版权问题。或者，假装聊天机器人是人类应该是非法的。这些问题都不是容易解决的，我们需要对\
  \ AI 技术的使用设定某些限制，以便更良性、更有益的用途蓬勃发展。\n\n如果我们采纳**沃诺克共识（Warnock consensus）**背后的某些原则，在尝试在迷宫中寻找道路时，将让我们受益匪浅。这是一个在公共领域而非闭门造屋内进行的、多样化、透明且审慎的过程。一个由信赖专家组成的委员会，他们可以作为民意的代理人，公众可以查看并信任他们能做出明智的决定。愿意接受民意固然重要，也可以通过辩论、竞选和解释——甚至更好，通过新技术能给他们生活带来的切实利益的证明——来引导。最重要的是，要理解为了让创新进步，可能必须设定某种限制。“十四天规则”是一个神来之笔，它让那些关心人类未来但没有时间深入参与问题各个方面的人能够审视并说：是的，这似乎还可以。许多过度理性主义的技术社区会对监管中的“还可以”这一概念嗤之以鼻，并拒绝将具有非科学背景的人员纳入负责建立这些边界的委员会。但是对于民主国家来说，在通过从根本上改变我们生活中机器干预平衡来从根本上改变社会的突破性面前，没有其他方法了。\n\
  \n当然，功劳不仅属于玛丽·沃诺克（Mary Warnock）和她的委员会。无论他们的动机如何，特切尔政府采取了一种明智的策略，允许对体外婴儿（IVF）和人类胚胎学监管做出深思熟虑的回，而不是过快地制定硬性规则。这段额外的时间并没有像政府委员会的声誉暗示的那样将问题推后，而是让“进步组织”（Progress）能够完善其论点，与学术界和工业界建立联盟，并对公众进行至关重要的外联。该组织最终能够证明胚胎研究已经产生了医疗突破，帮助家庭避免孩子患上危险的遗传性疾病，这也起了作用。今天的\
  \ AI 工程师应该考虑这一点。\n\n\n\n阿尔伯特·戈尔二世（被称为“阿尔”）对于他那个身份的年轻人来说非常不同。\n\n与他年龄、种族、受教育程度和财富相同的哈佛人通常会逃避兵役。他的同龄人，包括他所服务的总统和后来击败他的总统，通常都能找到某种疾病，使自己免于参加一场大多数人并不认同或不在乎的战争。在比戈尔早一年毕业的\
  \ 1200 名哈佛学生中，只有 26 人参加了越南战争。1 众所周知，良好的人脉可以让你逃离噩梦，由于父亲是一位美国联邦参议员，阿尔比大多数人更有机会通过给一位将军打个电话，从而获得一份轻松的办公室文职工作。他并不不同意美国在东南亚的战争，他的父亲也是如此，但出于道德或政治权量的考虑——或者二者兼有——他没有选择退出。1969\
  \ 年毕业后，他自愿入伍，并于 1971 年作为陆军记者抵达了越南战争酷热而绝望的战场。\n\n当他在 2000 年竞选总统时，戈尔已经能够自豪地谈论他的兵役经历。2\
  \ 但在 1969 年，当他第一次身着制服回到哈佛校园时，他遭到了同学们的冷嘲热讽。3 戈尔读本科期间，对国家的奉献已经非常过时，大学校园正经历着一场前所未有的学生抗议浪潮，而且并非都是和平的。在他毕业后的那一年，美国各地的大学校园发生了九千次抗议活动和八十四起纵火或炸弹事件。其表面上是反对越南战争，但随着时间的推移，抗议的动机发生了演变和扩张。它变成了对权威这一理念本身的挑战，也是这群感到幻灭和愤怒的年轻人对意义的追寻。新药物、新音乐和新道德正在改变整整代人，当和平运动在理查德·尼克松当选后遭遇惨痛失败，并导致越南轰炸行动加剧时，这群人很快迅速变得激进。“如果你那时没有经历过，”尼克松的一位助手后来解释道，“你根本不知道我们作为一个国家离革命有多近。”4\n\
  \n起初作为和平抗议的运动，后来演变成了对整个系统的信仰危机，并很快涵盖了戈尔热爱的领域：科学与技术。\n\n* * *\n\n计算行业，并延伸到今天的 AI\
  \ 行业，其存在归功于美国军。但今天的科技文化在很大程度上也归功于反对它发起的抗议、反文化浪潮以及随后的反弹。当年轻人为了越南战争、腐败和不平等与他们的政府斗争时，左翼的激进主义之火遇到了右翼同样强大且相反的力量。尼克松在\
  \ 1968 年的当选不仅是反战的民主党对手胡伯伯特·汉姆弗利的失败，也是这个国家中那些厌倦了激进主义和挑战权威抗议的成员的失败。支持尼克松的“沉默的大多数”所拥有的价值观与“爱之夏天”期间伍德斯托克音乐节和校园坐比展示的价值观大不相同。但这些来自光谱两端的社会运动所产生的悖论式的结晶，不仅塑造了未来的政治文化，还塑造了全球互联网的监管。小政府保守主义者、无政府主义自由主义者和年轻理想主义者共同创造了一种独特的范式，这种范式在一个新的在线边疆找到了出口。而那个边疆将非常有意识地处于不受监管的状态。\n\
  \n阿尔·戈尔的故事，他从一个理想且有原则的年轻学生转变为负责今日互联网在很大程度上不受监管的副总统的历程，说明了 AI 行业及其产品如何随着时间的推移被社会吸收。它也强调了将技术进步仅仅视为一种纯粹的中立和科学的尝试是多么不充分。互联网始于美国军的一项计划。由\
  \ 20 世纪 60 年代高级研究计划署（ARPA）提供的资金和协调，其设计目标是制造“未来的武器”，却引发了一个被用于安抚也用于煽动的革命性通信网络。在三十年里，它变成了一个巨头，创造了自金金时代以来想象的财富。它每一步都受到政治风向的影响。\n\
  \n* * *\n\n比尔·克林顿和阿尔·戈尔在 1992 年和 1996 年美国总统选举中的最终成功，标志着当时看来西方民主国家新中左翼霸权的开始。在他们第二次选举胜利后的两年里，意大利、英国、法国和德国都选出了具有中左翼议程的领导人，这些人都受到了这些“新民主党人”成功的启发。他们当选是基于一个共同的愿景，即他们看来赋予人们赋能的工具，而不是让他们处于“对国家持续顺从的状态”。5\n\
  \n这种愿景可以追溯到快速发展的用户驱动、去中心化、反权威的互联网哲学。技术可能源于 20 世纪 60 年代的美国军，当时冷战防御资金吸收了大学校园的科学重点，但那些为了捍卫他们版本中的在线自由的人，源自同一时期发生的大规模反体制学生抗议。约翰·佩里·巴洛夫（感恩乐队的作词人，20\
  \ 世纪 90 年代新兴互联网的领先知识分子）与阿尔·戈尔同年毕业（尽管巴洛夫通过伪造医生抬头信假装疾病，以从医疗理由免除兵役）。6 在达沃斯这样一个精英全球聚会现场发表，巴洛夫的《网络空间独立宣言》成为了成年反反文化与新世界关系的缩影。尽管美国军在资助互联网底层技术方面发挥了核心作用，但宣言毫无讽刺，巴洛夫及其随者拒绝了政府应对新边疆拥有任何管辖权。一如既往，狂热的技术乌托邦主义者的虚伪和不一致被忽视了，该声明被以令人惊讶的轻信态度对待。\n\
  \n\n\n\n早期互联网的故事实际上是一个汇聚的故事：在那些相信 20 世纪 60 年自由主义承诺的婴儿潮一代与那些感到被其背叛的人之间；在年轻的现代化进步派政治家与新镀金时代的商业巨头之间；以及在新开发的“互联网社区”与负责监管它的人之间。新民主党人的愿景——那些将进步主义与保守主义相结合的婴儿潮一代——被转化为美国政府的全部实力并推向了世界。克林顿政府以自由贸易、去监管化和商业重要性这一哲学为指导方向，夺取了美国在网络领域主导地位所提供的先机和机遇，使互联网从一个公共资助的科学项目向市场导向的力量源发生了激进转变。在此过程中，他们注入了自身的价值观，并使互联网治理问题成为构建和维护美国实力讨论的一部分。我们今天拥有的互联网绝非完全是美国的发明——早期的包交换网络也在英国和法国得到了开发，尽管它们因缺乏资金而停滞——但当今互联网的文化、本质和特征无疑是由美国价值观塑造的。更具体地说，是源于\
  \ 20 世纪 60 年国家创伤的美国价值观。\n\n因此，我们今天拥有的互联网在很大程度上是政治选择的结果，而不仅仅是技术选择。阿尔尔·戈尔受 20 世纪 60\
  \ 年代理想主义的影响，他将互联网愿景为一个联邦资助的“信息超级公路”，首要作为一个教育网络。但这一愿景在 20 世纪 90 年代的淘金中几乎消失了，这得到了他所领导的政府去监管议程的推动。互联网从\
  \ `ARPANET`（一种部分用于改进战场通信的军事工具）演变成了一个不受监管且私有化的野蛮之地。早期在线活动背后的自由意志主义伦理证明为随后硅谷私营企业和资本的发展提供了肥沃的环境。开放架构网络的独特性使得任何人都可以连接并在其基础上构建互联网协议，导致了这一令人兴奋且激进的新工具的快速繁荣和扩张。随后更多革命性的创新接踵而至，包括电子邮件和万维网。万维网的发明者蒂姆·伯纳斯-李曾说，他“希望获得所有这些[信息]的结果意味着，网页时代各国相互争斗的角色将以一种约翰·列侬式、约翰·佩里·巴洛式的方式悄然溶解[创造出]全球和平与和谐。但并没有发生。”7](#part0019.xhtml#a2B4)\n\
  \n约翰·列侬实际上可能是互联网早期故事的完美象征，他是一个本意良好的反文化偶像，后来被朋友埃尔顿·约翰嘲笑，指责他在拥有多间堆满物品的纽约公寓的同时，却幻想自己没有任何财产。\\\
  * 许多人希望实现的权力彻底去中心化和拒绝消费主义，结果实际上产生了相反的效果。虽然你对这错错的判断取决于你的政治立场，但我们都能同意，互联网的发展并不完全如任何人预想的那样。\n\
  \n今天的 AI 行业面临着与 20 世纪 90 年代监管新互联网西部部的人面临相似的问题。政治和地缘政治环境充满碎片。技术仍然很新。\n\n\n自从艾森豪总统在\
  \ 1960 年离职时对“工业复合体”发出严正警告以来，他所识别的现象变得更加庞大且难以管理，富尔布莱特参议员在 1967 年提到“军工学术复合体”时，这句话本身得到了呼应。8](#part0019.xhtml#a1UG)讽刺的是，这种军事利益的扩张在很大程度上归于艾森豪为了应对人造卫星而建立的机构，特别是\
  \ ARPA。虽然 NASA 被设立为一个有意识的民用机构，但 ARPA 明确是一项军事事业，其职责范围被艾森豪描述为寻找“未来无法想象的武器”。9](#part0019.xhtml#a1UH)\
  \ 这些武器将不仅仅是更大的炸弹或更快的火箭。ARPA 将包括行为科学、能量束和化学除草在内的许多领域进行实验。他们还将对计算机进行实验。\n\n在计算的早期，军事机构提供了大部分资金——因为对任何其他机构来说都太贵了。当著名的计算机科学家\
  \ J. C. R. 利克莱德在 1962 年加入 ARPA 并成为其`信息处理技术办公室`（`IPTO`）的首位负责人时，结果已经证明了初步的成功，他带着“军队需要的、商人需要的、科学家需要的都是一样的”这一格言而来。10](#part0019.xhtml#a2B5)\
  \ 由于很少有其他机构负担得起计算机科学，对于有志的计算机科学家来说，将研究转化为军事能够理解的术语以吸引那些资金是明智的。尽管实现计算机间联网的包交换技术几乎在同一时期英国发明，但\
  \ ARPA 计划的巨大雄心和规模意味着今天互联网的基础是 `ARPANET`，这是一个由精英大学的一群异质计算机科学家建立的网络，他们获得了来自 ARPA 预算的慷慨资金。\n\
  \n\n\n\n美国大学与政府之间的关系，自从总统富兰克林·德拉诺·罗斯福的科学顾问范内瓦·布什帮助动员美国科学投入战争努力以来一直变得日益紧密。到 1967\
  \ 年，第一条互联网信息发源地斯坦福大学已成为军方的第三大国防承包商。顶尖大学建立了新的实验室来从事国防项目，从关注空军力的麻理工学院林肯实验室，到伯克利的利物莫尔核能实验室。历史学家斯图特·莱斯利教授指出，战后的新科学“模糊了理论与实践、科学与工程、民用与军、机密与非密之间的传统界限”。这是国家安全机构的高明举措，但它改变了美国科学的性质。军事的需求“定义了科学家研究什么、设计和建造了什么、在哪里工作以及他们到达那里后做了什么”。[11]\
  \ 大学向国防资金的合力偏移，不仅让艾森豪威尔和富布莱感到担忧，也让学生们自己感到不安。\n\n* *\n\n全球范围内发生着一场巨大的觉醒，1968 年，学生抗议在巴黎、北尔尔兰、墨西哥城和布拉格爆发，他们都愤怒地要求撤换领导人、改变课程并赋予权利。学生激进主义和动乱成为那个十年代的定义特征之一；而在美国——在普林斯顿、斯坦福、哈佛及其他地方——反战运动与一种初生的、无名的反技术情绪达成了共识。在加利福尼亚北部的伯克利（激进主义的堡垒以及\
  \ J·罗伯特·奥本海默的母校），反对计算机的运动始于一种对言论自由的支持。\n\n1964 年学期开始时，大学董事会对会对日益加烈的学生运动感到愤怒，试图禁止在校园内发放政治传单。随之引发的愤怒怒吼演变成一种现象，涵盖了对民权的支持、对战争的厌恶，正如历史学家、哈佛大学教授吉尔·莱波所解释的那样，“对他们所认为美国高等教育已经变成的样子的反对：一个把学生当作数据点的工厂，将他们喂进计算机然后吐出来。”一位年轻学生给父母写信道，“最初对言论自由的要求已经变成了包含教育的全部含义。对仅仅成为一张`IBM`卡感到愤怒，对官僚主义感到愤怒，对投入技术的资金感到愤怒。”[12]\n\
  \n在整个抗议期间，学生脖子上挂着用于选课的`IBM`孔片。在普林斯顿，当学生记者揭露大学计算与通信部门与`ARPA`之间的深层联系时，活动人士举行静坐，直到领导层同意取消这些项目。当这一决定被大学董事会否决时，学生们链锁了冯·诺依曼厅的大门，喊着“杀死计算机！”在麻理工学院，学生们对`AI`几十年后的使用方式表现出一种可怕的预见性，他们嘲讽那种社会问题存在技术解决方案的观点。“为了做什么？”他们问道，“为了估计停止城市`X`的贫民窟叛乱所需的警察人数，而这种叛乱可能由于通信模式`K`由事件`Y`触发，考虑到有`Q`数量的`Z`型政治煽动者。”[13]\
  \ 反越越南战争运动与愤怒技术的学生之间的联系是显而易见的。两者都是对去人性化的早期、本能的反抗。不幸的是，那些学生当时对技术的恐惧与今天数字生活的现实之间的联系也是清晰的。那些旨在恰好实现麻理工学生感到反恶的程序现在已无处不在：销售`AI`的公司声称他们的算法可以预测谁会犯罪，[14]\
  \ 谁会假装生病逃避工作，[15]， 甚至谁应该获得肝移植。[16] 感到控制控制的缺乏和人性共情的缺失，任何人都可能发声或反击。但在 20 世纪 60 年代，狂热的氛围和这种反应的强度将会损害他们的目标，因为这场运动开始投射出与他们声称要反对的暴力形象。\n\
  \n* *\n\n在哈佛大学，震惊的阿尔·戈尔目睹了他的同伴正激进地占领了校园的一栋建筑——大学厅。学生们冲进去，举起旗帜，通过肢体驱逐老师，并将其中一名老师推下台阶，力道大得他险些摔倒，并被人群接住。戈尔无疑反对越南战争，并帮助过他担任参议员的父亲……他后来回忆道，“我对这项事业表示同情，但不支持这种策略。”[17]\
  \ 这种热情部分归功于他的父亲……戈尔二世对创新对社会的影响深着迷……在他从哈佛大学获得学位同年，在国家另一边的研究生成功创建了一个四节点网络。\n\n1969\
  \ 年 10 月 29 日，加州大学洛杉矶矶分校的研究人员在`ARPANET`上发送了第一条信息，那是今天互联网的祖先。在尝试输入`login`时，系统立即崩溃，留下的第一条信息是`LO`。在\
  \ UCLA 宣布`ARPANET`成就的新闻稿中，项目负责人之一伦纳德·克莱因洛教授预测了未来。“目前计算机网络仍处于婴儿阶段，但随着它们的成长和变得复杂，我们可能会看到‘计算机事业’的普及，就像现在的电力和电话事业一样，将服务全国各地的家庭和办公室。”[19]尽管美国似乎正在分崩，但连接世界的革命性计划仍在继续。\n\
  \n* *\n\n到 20 世纪 70 年代初，国家对上一个年代的放纵感到不屑。学生运动因对暴力的承诺程度、对女性不平等的对待以及与新兴的黑人权力运动的不兼容而分崩离析。肯尼迪时代的理想主义正在消退。共和党在\
  \ 1966 年的选举中大获全胜，到 1967 年，三分之二的受访美国人认为约翰总统的进步政策过头了。[20] 同权利、堕胎和女性主义的斗争日益激烈。炎热的城市在暴力和压迫中爆发。在短短三年内，马尔科姆·克斯、马丁·路德·金和鲍比·肯尼迪遭到暗杀。1970\
  \ 年，肯塔州大学四名无武装学生抗议者被自己的军队——俄亥俄州国民卫队在校园内击杀。\n\n\n\n抗议的学生们在杀死计算机的尝试中显然失败了，但这并没有阻止他们对计算机的发展产生影响。反主流文化塑造了一代计算机科学家、爱好者和企业家。莱波（Lepore）指出，“个人电脑”从本质上说是反建体制的。它们“诞生于\
  \ 20 世纪 60 年代的……反主流文化，一种对（IBM）机器的愤怒。”21 不尊不讳的反战抗议者杰里·鲁宾（Jerry Rubin）成为苹果计算机公司的早期投资者，并因此成为了一百万富翁。22\
  \ 列侬的《想象》（Imagine）中的理想影响了伯纳斯-李（Berners-Lee）以及他为“所有人”而创造的世界维网。而向保守政治的大规模转向，反映了更广泛、更传统的社会对动荡的厌倦，这催使了新兴互联网快速去监管化体制的建立。在哈佛大学校园内，戈尔的教授及未来的支持者之一马丁·佩雷茨（Martin\
  \ Peretz）是一位著名的反战活动人士，后来拥有并编辑了《新共和》（The New Republic），他声称看到学生占领大学大厅的景象是“我政治立场从左转右的开端”。23\
  \ 这种情况在国家大部分地区也是如此。\n\n阿尔·戈尔愿意参加一场他并不支持的战争实罕见，但他抵抗极端激进主义吸引的这一点也并非独特。20 世纪 60 年代末和\
  \ 70 年代初由 ARPA 构想并资助的原始分组交换网络，是由一群男性计算机科学毕业生驱动的，他们对于包括军事在内的体制工作并并不畏惧。这在某种程度上归功于\
  \ ARPA 领导层的巧妙管理，他们在向国会解释预算时，成功地将对计算机科学研究的资金明确描述为军事术语，同时在处理与他们资助的学术人员时保持了自由感。在承担大部分工作的年轻毕业生和代表他们与\
  \ ARPA 打交道的高级学者之间还存在一个缓冲地带，后者将这些工作向下传递，而不关注其与军事的相关性。ARPANET 甚至不是一个机密项目。尽管如此，完全忘记军事必要性是不可能的。克莱因岩（Kleinrock）监督了负责\
  \ ARPANET 的学生，自己的数学工作对网络的发展至关重要，他后来承认：“每当我写提案时，我都必须证明与军事应用的相关性。”24 ARPANET 避开了最激烈的抗议，但并非没有争议。科罗拉多州的国家大气研究中心由于其与军事的关系，拒绝成为连接\
  \ ARPANET 的最早机构之一。25 麻麻省理工学院（MIT）的学生担心他们的机构与一种新技术的联系，这种技术可能让政府追踪并镇压像他们那样的进步运动。26\
  \ 尽管他们的革命派同伴存在顾虑，但聪明的年轻人并没有被建造这座军事网络所劝阻。\n\n随着 ARPANET 和网络技术的兴起，它们很大程度上受到那些研究生以及他们独特的开放、无等级制度的文化的引导。在他们\
  \ 2003 年的论文《互联网简史》中，几位从 20 世纪 60 年代起参与该项目的科学家试图记录一份官方说明。这组科学家包括文顿·策夫（Vinton Cerf），他设计了具有远见的传输控制协议（`TCP`），该协议允许任何人连接到新网络，使开放架构成为现实。他们指出了其发展的四个方面，其中技术创新本身——从分组交换到底层协议——仅仅是之一。其他的都是社会技术性的：运营与管理、社会和商业。这些元素对网络的塑造作用与底层技术创新同样大。\n\
  \n回首过去，令人惊讶的是，那些塑造了早期互联网许多规范的人实际上是如此年轻且封闭。策夫现在是互联网时代备受尊敬的巨头，在谷歌担任“首席互联网传教士”，并因在牛仔裤和运动鞋的海洋中穿着精明的三件套西装而在办公室里闻名。他总是亲切且大方地投入时间，并意识到自己给当今技术人员带来的敬畏感。策夫在辉煌的互联网历史上还有另一个成名点：将他最好的朋友引入该项目。斯蒂夫·克罗克尔（Steve\
  \ Crocker）是一个自认的“数学极客”，另一位来自 UCLA 的研究生，根据他自己的承认，“他对人工智能和计算机图形学的兴趣大于网络技术。” 他很快被拉入项目，并为几十年的互联网治理奠定了基调。是克罗克尔领导了网络工作组（`NWG`），这是史前互联网的一个松散监督机构。其成员最初是一群研究人员，主要是研究生，他们源于构成了\
  \ ARPANET 前四个节点的大学。在克罗克尔的领导下，NWG 建立了一种渗透到互联网文化中的方法：开放。开放架构、开放参与、开放访问。当他与策夫在导师克莱因岩的指导下开始研究\
  \ ARPANET 时，该项目除了“大致假设每个站点的用户都能够远程登录并在与其他站点的主机之间传输文件”外，没有其他指导或明确的职责。ARPANET 如何运作是留给这群人建立的。这是互联网早期发展典型的非正式化、去中心化和协作方法的完美范例。NWG\
  \ 做出了重要的技术决策，包括电子邮件的基础，但他们也做了社会和文化选择，这些选择随着互联网规模和重要性的增长一直伴随我们，并且与创造这些人的价值观不可分割。\n\
  \n我在 2020 年疫情封锁期间通过视频通话会了克罗克尔，并感叹部分由于他的发明才让这次对话得以进行。我问他他世纪 60 年代末的政治环境如何影响了他对运营组织和设计系统的思考。他说，他“非常清楚国家其他地方发生的情况”，而且“我认识的每个人都强烈反对战争。”罗伯特·肯尼迪被刺杀后，克罗克尔和一位朋友请了假并在海滩上分担哀伤和损失。但是，“我们并没有刻意去构建一种反主流文化。”对于克罗克尔来说，实际上学术界的协作性质使他们的激进开放成为可能，因为他们都来自同一个军事来源，因此没有竞争或保密理由。尽管克罗克尔确实承认，他也被未来计算机革命可能所提供的“希望与承诺”感所激励。像戈尔一样，克罗克尔理解抗议者的情绪，但并不认为加入他们是正确的。“意识到是一回事，参与是另一回事。”\
  \ 他没有抗议，而是将“计算机，特别是计算机研究，视为实现大大事的方式。”\n\n\n\n\nNWG 的协作式、共识驱动的文化反映了希望与信任，但支撑该网络的原则亦是如此。美国网络化的哲学最终围绕一组核心理念展开：即他们开发的协议应当是“开放、可扩展且健壮的”，并以一个联盟内部的持续改进为特征。克罗克（Crocker）记得，互联网之所以采取动态化方法——即构建可以支持后续扩展的初始协议——部分原因之一，是因为他的小组认为他们自己的资历还不足以做出决策。这种对将想法写成记录的恐惧导致了“意见请求”或\
  \ `RFCs` 的诞生，这些是“不算作出版物”的非正式备录，并向更广泛的社区开放反馈。随着时间的推移，这些 `RFCs` 负责了如电子邮件和域名等基础性的事务。最初由手写或打印在纸上的建议，最终演变成了互联网学者米尔顿·穆勒（Milton\
  \ Mueller）所说的“互联网”。\n\n但正如众所周知，或者说至少任何在那些自描述为具有非常“扁平、非层次化”结构的组织中工作过的人都知道，每个人都能发言并拥有平等权重的想法随着时间的推移会变得不现实。当参与人数增加时，情况尤为如此。微软和苹果公司分别于\
  \ 1975 年和 1976 年成立，明确使命是实现计算民主化，并与 IBM 一起负责了个人电脑的激增，这些电脑远非最初连接到 ARPANET 的那种巨大且昂贵的机器。随着成本的下降，个人摆弄自己机器的想法变成了现实，这些计算机爱好者也希望获得网络访问。对于美国军方来说，这走得太远了。国防部无法承担与嬉皮士共享网络的风险。对他们来说不幸的是，开放架构网络的核心在于没有任何东西能阻止任何人加入。因此，建立了一个新的、独立的军事网络来保护国家机密，并在\
  \ 1983 年 ARPANET 脱离了束缚。\n\n到那时，其他网络已经基于 ARPA 的网络和塞尔夫（Cerf）的开放协议建立起来，但运行在更快、更可靠的基础设施上，其中包括来自国家顶尖科学机构——国家科学基金会（NSF）的网络，该基金会现在拥有了自己的网络：NSFNET。它由\
  \ NSF 以及 IBM 等私营合作伙伴资助，最初的设计是为了连接其资助的计算机中心，包括普林斯顿大学的冯·诺依曼中心（十多年前那里的学生们曾未能关闭该中心）。它很快扩展，以满足科学家的需求，他们对网络作为一门学科本身并不感兴趣，但仍然希望将这项充满前景的技术用于自己的研究。这最终稳固地建立了一个民用网络，尽管由于它是政府资助的项目，任何商业活动都是禁止的。越来越多的个人和机构开始上线，为一个全新的、无形的“技术社区”播种了种子，这是一个由充满激情、见多识广且活跃的用户组成的群体，他们认为有权对他们新的在线乌托邦如何运行发表意见。作为回应，一系列有机形成但日益重要的互联网组织机构在整个\
  \ 20 世纪 80 年代蓬勃发展，这些机构由最初的 ARPA 项目领导者创建，以应对用户对他们网络日益增长的兴趣。尽管网络具有去中心化的性质，但人们很快意识到，进一步的协调、讨论和共识建立需要在更正式的渠道中进行。\n\
  \n由塞尔夫创立的互联网工程任务组（IETF）就是其中这样一个机构。IETF 在任何人都可以参加的季度公开会议上运行，随着互联网用户社区的增长，参加会议和邮件列表的人数也随之增加。它成为开放架构哲学的制度化体现，并延续了\
  \ `RFCs` 的传统，即想法在达成共识之前会经过激烈的辩论。但起初作为一小群研究生合理的组织原则的产物，现在拥有了它自己的生命。这个未定义的群体开始被称为“互联网社区”（the\
  \ internet community）——不再由 ARPANET 来定义。随着这一身份的形成，反主流文化对政府以及泛指权威的拒绝进一步渗透进来。大卫·克拉克（David\
  \ Clark），另一位早期的互联网先驱，为他们日益增长的哲学创造了这一术语：“我们拒绝总统、国王和投票；我们相信粗略的共识和运行的代码。”\n\n\n\n在越战结束后退伍后，戈尔开始投身政界，并在\
  \ 1985 年成功赢回了田纳西州参议员席位，该席位此前他的父亲被尼松的“沉默多数”夺走。阿尔伯特·戈尔老士支持民权并反对战争，曾在 20 世纪 60 年代自由主义引发的保守政治反弹中败北。这种反弹在美国的前奴隶州尤为盛，共和党在当地制定了“南方战略”，将民主党对民权运动的支持武器化。戈尔小士对父亲抱有理想化的情感，并寻求一个既能致敬其父亲遗产，又能应对时代意识形态气候的政治立场。\n\
  \n他迅速成为“新民主党人”中的重要人物。这一群体主要由白人男性“婴儿潮”一代人组成，他们在自由主义的 20 世纪 60 年代长大，并敏锐地感受到了随后几十年中左翼接连的选举挫败。正如他们最后的领袖比尔·克林顿所说，新民主党人试图通过将党推向一个新的方向来扭转这种衰落，这一方向将“扩大机会而非政府”，并“承认经济增长是扩大机会的前提”。33\
  \ 他们被同龄人和同胞构建的新兴网络那种激进、开放的架构所着迷，这种网络承诺让信息获取民主化，并为经济增长开辟一个巨大的新领域。\n\n诚然，计算机天才、成年后的嬉皮士和新左翼在人口统计学上的共同特征，帮助定义了他们对丰饶增长与机会、去中心化以及（在线）摆脱权威的乐观愿景。正如今天的\
  \ AI 一样，20 世纪 90 年代的计算机和网络革命被视为社会许多弊端的答案。莱波尔指出，民主党开始关注知识工作者的优先事项，而非其传统的工人阶级基础。她写道：“政党踉跄了，像一个醉汉，痴迷在技术乌托邦主义的幻狂中。”34\n\
  \n部落长老们对此感到担忧。肯尼迪总统的前任顾问亚瑟·斯莱辛格将这一新派称为“民主党内部的感染源”，35 认为他们过于专注于模仿极极受欢迎的里根。即使是代表硅谷的参议员也对这种新的技术乐观主义表示了抵制，试图警告说：“美国的未来不在于每个家庭建造一台雅达达游戏机……我不认为我们可以仅仅变成一个高科技服务经济，并任由那些基础的烟囱工业荒废。”36\
  \ 但新民主党人并不认同，随着他们与技术的关系日益紧密，他们赢得了一个称号：“雅达达民主党人”。\n\n戈尔领导了雅达达民主党人的先锋。正如他那一代许多支持者一样，他对技术的狂源于《星际迷航》和《2001\
  \ 太空漫游》等科幻小说，以及他成长时期那些具有影响力的理论家，如巴特明斯特·富勒——这位建筑师未来的几何穹顶已成为那个时代的象征。37 网络空间似乎承载着 20\
  \ 世纪 60 年代的承诺，开启了一个奇异、闪亮且由技术驱动的未来；如果他能将其与他对政府所能行善事的信念相结合，那么这种合成就能赋予整个政治哲学活力。\n\n\
  如果他能将其与他对政府所能行善事的信念相结合，这种合成就能赋予整个政治哲学活力。他没有浪费时间，在参议员仅满一年后就提交了一项法案，要求科学技术政策办公室对此进行研究。该法案基于三个原则：第一，美国领先地位的未来取决于巨大的网络；第二，私营部门缺乏足够的动力来开发这些网络；最后，正如互联网历史学家珍妮·阿巴特所言，“需要政府的监管。”38\n\
  \n法律一旦颁布，将建立一个“国家研究教育网络”，即`NREN`。`NREN`将通过法律确保所有学术界、学校和图书馆拥有“信息高速公路”的权利。对于任何熟悉今日分裂政治的人来说，可能最不协调的事实是，戈尔法案是由乔治·H·布什在\
  \ 1991 年签署成为法律的。\n\n这项立法的影响是深远的。它提高了公众对网络的意识，促使许多人考虑学习编程或创业。39 它还资助了伊利诺伊大学的实验室发明了`Mosaic`——第一个互联网浏览器。戈尔法案是政府鼓励、引导和促进创新的潜力的绝佳案例。它是互联网快速增长的跳板，引发了用户和兴趣的激增——不仅来自商业实体，也来自公共部门。\n\
  \n* *\n\n* *\n\n美国参与互联网的结束主要是出于安全考虑，但对互联网所有公共资助的结束则更为微妙、缺乏协调且没有计划。`NSFNET`已经是一个公私合作伙伴关系，但随着需求增加，国家科学机构开始认为，私营资金是维持基础设施运行所需的技术升级的关键。网络的“可接受使用政策”本应防止政府补贴的网络用于商业用途，但随着在流量中判断谁是“可接受的”变得越来越困难，这项政策也日益动摇。\n\
  \n\n\n\n1990 年 7 月，《纽约时报》发表了一篇由记者约翰·马科夫（John Markoff，他一直报道科技新闻直到 2016 年）撰的文章的文章揭露了\
  \ `IBM` 和当地一个财团已开始与里根时期的政府官员进行秘密讨论，旨在“创建一个非营利公司，运营一个高速计算机网络，该网络有一天可以触及国家的每个家庭”。这一线索似乎来自竞争对手，他们担心\
  \ `IBM` 的意图以及获得不公平优势的可能。但马科夫也注意到了提议所凸显的早期民主忧虑，包括“由谁来运营数据网络以及他们如何获得资金”等复杂问题，并指出其他电信公司也急于加入其中。他问，这个网络将是由“政府还是私人公司”管理——其结构又会是什么？\n\
  \n文章中提出的问题适用于戈尔对 `NREN`（国家研究教育网络）的愿景。他的计划是建立一个部分由私营行业资助的网络，它将“与政府、工业和研究[及教育]机构的潜在用户合作进行设计、开发和运营”。它并不是打算由\
  \ `IBM` 及其选定的合作伙伴在闭门状态建立。国会同意他的观点，认为这种公共咨询和监督有助于决定互联网的未来。但到 80、90 年代，大型政府科学项目的风潮已基本消失。将基础设施交给私营行业正成为常态。在马科夫的文章中，来自后来成为\
  \ `AT&T Corporation` 的 `IBM` 竞争对手意识到了这种运作。马科夫引用他的话说：“目前资助高速网络的立法动力非常强大。如果有任何迹象表明公司可能会在没有政府支持的情况下进行，这对立法工作将没有帮助。”40\
  \ 换句话说，如果私营行业将资助下一代互联网，政府为什么要费劲呢？\n\n最终，没有通过渐进的咨询，也没有通过任何立法来决定这一日益增加价值的政府资助基础设施的未来。`IBM`\
  \ 关于由非营利公司监督技术骨干的计划，或是戈尔关于公私合作伙伴关系的计划都没有被实现，`NSF` 网络被完全消除了。阿巴特（Abbate）将这一过程称为“互联网的事实私有化”，这是由与少数\
  \ `NSF` 官员合作运营网络的承包商们仓促、触发并驱动的。41 那些警告说这种行动会耗尽国会山对戈尔 `NREN` 热情的人证明是正确的。到 1995 年，`NSFNET`\
  \ 被废除。在由政府资助的计算机科学家在政府资助的计算机上发送第一条互联网信息二十五年后，现在存在一个完全私有化的互联网，充满了新的非研究活动和商业模式。但并没有看到《戈尔法案》中旨在建立政府监督和鼓励公共利益的关键要素的迹象。使命已变成了市场。\n\
  \n克洛克（Crocker）在 2020 年告诉我，在商业化之前，“几乎每个参与的人都关注如何改进和扩展技术以造福整个社区。竞争非常微小。”当互联网向商业利益开放后，某些变化是不可避免的。互联网仍然不属于任何人，它的有机发展仍然取决于克洛克的“自愿联盟”——那些有时间、意愿和资源来编写\
  \ `RFCs`、辩协议和编写程序的人。但现在，“很大一部分参与的人正专注于推进他们的财务利益。”好处是，互联网服务提供商 (`ISPs`) 之间产生的竞争可能帮助互联网更快速地进入更多领域，并带来了随之而来的社会效益。但互联网社区的一些成员认为向商业化的转型是鲁莽且误导的。缺乏咨询、变化速度快以及目的的转变，在用户和服务提供商之间引发了一场“抗议的风暴”，他们认为像\
  \ `IBM` 这样的公司将从几乎没有限制的情况下大获巨益。42 这在性能水平、全国范围内的访问公平性、基础设施维护（包括网络安全）或透明度方面没有任何要求。43\
  \ 当然，克洛克说，“它还引入了人性中所有常见的阴暗面。”[44\n\n关键问题自然是，如果互联网不再是一个政府资助、公共运行的研究网络，那么由谁负责呢？\n\n\
  ***\n\n“从经济角度来说，”历史学家帕特里克·J·马尼（Patrick J. Maney）说，克林顿政府比罗纳德·里根和布什（父子俩）更接近约翰·F·肯尼迪[或]林登·约翰逊。”\n\
  \n这就是互联网私有化如此快速且不受阻的原因之一。克林顿、戈尔和雅达利民主党赢得了 1992 年总统大选，通过承认里根的吸引力并与他的议程一部分结盟，重新导向了民主党。去监管化的趋势在他们的管理下继续繁荣，特别是在银行和电信行业，而正是在这个问题上，他们成功地与日益敌对的反对派找到了共识。\n\
  \n在所有传统指标上，经济在克林顿总统任期内蓬勃发展，因为执政政府仅寻求强化他们的经济意识形态，而互联网的成功支撑了他们的技术狂热。“点点”热潮在 1995 年随着\
  \ `Netscape` 的 IPO 和 `Microsoft` 发布 `Internet Explorer` 网页浏览器达到顶峰。根据美国政府自己的数据，1995\
  \ 年至 1998 年间，互联网贡献了经济增长的三分之一。“我们正在从工业时代进入信息技术时代，从冷战走向全球社会，”克林顿总统宣布。45 克林顿兴奋地表示，互联网不会像\
  \ `ARPA` 设想的那样成为武器。它将成为一种权力的工具。\n\n\n\n\n\n对增加私有化的支持也零星地来自他们的政治对手，因为左翼和右翼的自由意志主义在国会以及网络上也趋于趋同。政治极化正在加剧，但在涉及自由市场时，仍然可以找到共识。敌对性且影响巨大的共和党领袖纽特·金里奇（Newt\
  \ Gingrich）建立了一个名为“进步与自由基金会”（Progress and Freedom Foundation）的智库，并在 1994 年的一次会议上发布了《信息时代大宪章》。该声明早于约翰·佩里·巴洛（John\
  \ Perry Barlow）的《网络空间独立宣言》，但源于同样的冲动，将网络空间比作新的边疆，并主张“消除竞争障碍，并对快速发展的电信和计算行业进行大规模去监管”。47\
  \ 它的表述比巴洛那种过时的反文化革命更类似于自由主义的公共政策，但表达的内容是一致的。在金钱至上的 20 世纪 80 年代和 90 年代的背景下，互联网社区和两两个政党都开始朝着同一个方向努力。\n\
  \n政府对互联网的监管尽管是轻微的，随着行业改革运动的势头越来越盛，这种监管从国防部转移到了商务部。似乎没有人关心正是联邦对科学技术的支持让这一切成为可能。正如曼尼（Maney）所说，“华盛顿的决定将决定财富的成败”，老电信公司和硅谷企业家都付出了巨大的游说努力。`联邦通信委员会（FCC）`对互联网采取了自豪的放干预态度，并在克林顿时期引入了旨在“消除不必要的监管”并“为强力投资和发展奠定基础，这将创造……一条服务私营部门和公共利益的超级公路”。48\
  \ 这在政府内部也引发了争议。诺贝尔奖得主经济学家约瑟·斯格尔茨（Joseph Stiglitz）是克林顿经济顾问委员会（Council of Economic\
  \ Advisers）的成员，他记得“完全去监管的支持者……与试图保留政府作用的人之间存在激烈的斗争”。但拉里·斯特里克林（Larry Strickling）是一位有影响力的互联网政策官员，他当时是`FCC`（金里奇曾试图取消但未果）的员工，他后来明确表示在克林顿时代，任何加强政府对行业监管的想法都是不被允许的。他解释说，当时的氛围是“寻找政府退出的办法”。49\n\
  \n克林顿和戈尔都赞赏增加消费者选择和降低价格的潜力，一项修正案试图引入通用访问的要求，尽管由于缺乏资金资金它注定失败。这种压倒性的结果符合金里奇和巴洛的去监管自由意志主义议程。在签署《戈尔法案（Gore\
  \ Act）》时，克林顿使用了艾森豪威尔总统在签署《联邦公路法》时用过的钢笔。那是另一个时代的网络，由戈尔的父亲所倡导。这一姿态将阿尔·戈尔父士（Al Gore\
  \ Sr.）的成就与其儿子的成就联系在一起，这对副总统来说是一个深层情感的来源。50 但戈尔早期的理想主义愿景已经结束了。不会有一个基于 20 世纪 60 年代大政府乐观主义的、公共资助的`国家研究与教育网络`了，也就是《戈尔法案》所倡导的那种。如果互联网要被治理，旧模型必须更新。\n\
  \n如果互联网要被治理，旧模型必须更新。\n\n如果互联网要被治理，旧模型必须更新。\n\n如果互联网要被治理，旧模型必须更新。\n\n如果互联网要被治理，旧模型必须更新。\n\
  \n\n互联网的狂热增长对其非正式的自律系统造成了巨大的压力。“互联网社区”日益扩大。行业领袖希望有一个稳定、可靠的互联网治理体系，以此建立他们的业务。\n\n\
  互联网现在可能已向商业利益开放，但由于互联网的起源，美国政府对被称为`根区域服务器（root zone server）`或`根（the root）`——整个互联网的顶级域名保留了剩余权限。文特·瑟夫（Vint\
  \ Cerf）的`TCP/IP`协议允许任何地方的计算机通过交换信息连接到互联网，但为了实现这一点，所有连接的设备必须被赋予名称和地址。因此，每个连接到互联网的设备都有唯一的`IP\
  \ 地址`。此外，连接到互联网的资源可能还有更具记忆点的地址，例如`google.com`，也称为`域名`。\n\n随着互联网的增长，`域名系统（或 DNS）`从从`ARPANET`上对新计算机的必要但无聊的记录，演变成了知识产权和商标权斗争的焦点阵地。伊利莎白·菲恩勒（Elizabeth\
  \ Feinler）在 1972 年创建了最初的`ARPANET 目录`——当时只是一个简单的文本文件——以管理关于网络日益增加的信息。她的团队负责管理网络上每个用户的列表。但随着用户数量的急剧增长（从\
  \ 1985 年的约 2000 台计算机到 90 年代末的 15 万台以上），这种方式的跟踪已变得不可持续。在`RFC`文件之间经过激烈的讨论和构思后，人们达成了一个新的分层次的概念：`DNS`。`DNS`的理念是互联网将划分为一系列高级域名，例如用于商业流量的`.com`和用于教育机构的`.edu`。较小的主机可以在其下方进行标识。这样，分配唯一标识符的任务就可以更广泛地分布，减轻了菲恩勒及其团队的压力。\n\
  \n\n\n\n\n尽管初衷是为了分担这一负担，但 DNS 实际上是一个单一的层次化且集权化的功能，因为在域名层级结构的顶端——[above.com](http://above.com)\
  \ 以及 .org 等——坐落着“根区域”（root zone），它作为信息的权威来源。它被用于定位庞大全球网络的资源，对互联网的基础设施至关重要。尽管当时并非所有人都能意识到的，但对这一根的管理掌握着真正的权力。例如，当你输入银行的网页地址时，你信任自己会被带到银行网站而不是欺诈网站。互联网的根必须无懈可击，正如互联网学者米尔顿·穆勒教授写道，“它的‘安全与稳定性’对于任何依赖互联网的服务或功能的生存都至关重要。”53\n\
  \n但在早期，这种权力的意义才开始显现。因此，当 ARPA（其名称已改为国防高级研究计划署，即 `DARPA`）与斯坦福大学信息科学的 Jon Postel 签署合同（他是\
  \ Cerf 和 Crocker 的另一位朋友），授予其机构若干 DNS 相关功能的权限时，几乎没有异议。Postel 甚至在 1988 年给自己授予了“副互联网架构师”的头衔。然而，随着企业域名的重要性在商业化过程中逐渐显现，他的角色开始引起关注。分配给任何企业或组织的域名现在具有了新的重要性并变得更有价值。域名不再仅仅是邮政编码那样的技术地址：它们变成了品牌。\n\
  \n这不仅仅是一个美国的问题。`RFCs` 和像 Postel 这样的人确实在行使权威，但并非所有人都能看出这种权威的来源。Postel 可能受到了同事以及一直资助和支持该计划的政府机构的信任，但并不清楚其他国家为什么要愿意分享这种信任。美国境外用户的巨大增长，意味着出现了日益强大的联盟，他们不再乐于看到对互联网运营做出政策决策的机构从美国政府那里获得权威。“国家代码”顶级域名（ccTLDs），如英国的\
  \ `.uk` 或法国的 `.fr`，这些域名的引入在很大程度上是为了试图缓解这些担忧。欧洲技术社区建议 Postel，认为这可能有帮助，因为避免了由现有政策造成的视觉问题——即新注册者需要一个美国政府的赞助人才能进入\
  \ `DNS` 数据库。这些都是微妙且复杂的问题，但 Postel 简单地设计了一套“完全绕过”这些国家传统治理机构的系统，而是将二级域名注册授予——用他自己的话——“第一个要求工作的人（并且被认为是负责任的人）”。54\
  \ 避免地，这种一个国家对其域名空间的指定和权威由加利福尼亚的一个个人决定的政策，对贫穷国家是不利的。他们的互联网普及率较低，用户也较少，因此他们与 Postel\
  \ 谈判并维护自身权利的能力显然被削弱。例如在英国，一家私人公司能够通过使用特里波的一个地址注册利比亚的 ccTLD `.ly`，并收取与此相关的费用，而这远非唯一的案例。55\n\
  \n这些紧张关系——关于利润、所有权和权力的冲突——共同凸显了控制互联网根和 `DNS` 运行的重要性。互联网自身的文化似乎正在发生变化，从 ARPA 时代紧密联系、共识驱动且很大程度上同质化的社区，演变为一个拥有企业、国际政府和个人用户代表的社区。随着增长，也将带来新层次的审查和问责。Postel\
  \ 试图反击。在他在 1994 年编写的 `RFC 1591` 中，Postel 将“对域名‘权利’和‘所有权’的担忧”斥为“不恰当的”。他写道，合理的担忧应该是关于“对社区的责任和服务”。56\
  \ 但确实存在关于权利和所有权的担忧。毕竟，这是美国。另一场代表大公司和媒体利益、反对互联网放任模式的大规模游说活动也开始了。57 `NSF` 及其背后的技术社区已为连接人们和网络尽了一努力，但这种速度是以牺牲清晰的结构、管理和规则为代价的。当收取新域名注册费的私人公司\
  \ `Network Solutions Inc.` 因其事实垄断被起诉时，还不清楚谁该负责。\n\n***\n\n关于根服务器控制权的战斗是一场关于网络基本身份的战斗。它属于虚幻的全球互联网社区，还是属于美国政府？互联网的物理资产\
  \ `root zone file`（根区域文件）实际上仍由美国所有。它是他们的发明，是他们与 Postel 及其机构签订合同运行域名系统。但实际上，美国政府在整个互联网监管方面的权威并非真正基于管理\
  \ `DNS` 本身的任何实际角色，而是基于其向那些执行者发出指示的权力。根自 20 世纪 70 年以来一直 Postel 控制，一位朋友后来说他“真的、激情地认为他个人拥有[它]”。58\
  \ 但这不再站不住脚了。互联网现在是全球性的，随着网络的不断扩张，国际企业和其他国家越来越难以接受 Postel 作为一名加利福尼亚学者却掌握如此权力的安排。必须找到一个新的答案，一个新的家园。商务部介入并声称，毕竟美国政府确实拥有互联网的入口点，并将领导引导其未来。59\
  \ Postel 的盟友和互联网老卫成员并不愉快。其中一人说：“想把 [DNS 根] 从 [Postel] 手中夺走的人并不是为了你的革命，哥们儿，他们是为了钱。”60\n\
  \n## 某种希皮派式的东西\n\n克林顿让他的副总统负责处理根的困局，正如他处理所有互联网和技术政策一样。从所有角度来看，戈尔是一个极度参与且富有影响力的副总统，在他们执权的第二个任期内，他正将注意力转向他自己的总统竞选。到此时，他一直在与一个被称为“戈尔科技”（Gore-techs）的硅谷高管智库定期就政策问题进行广泛讨论，并拥抱了他作为现代化和科学技术捍卫者的角色。戈尔开始考虑他未来的竞选将围绕“对科学技术福泽的信仰”展开。61\
  \ 对于他未来总统执任的成功，控制互联网入口的权力是至关重要的。\n\n\n\n\n被称为“域名战争”的事件产生了巨大的经济和地缘政治影响。虽然互联网在起初是对“未来武器”的一场军事豪赌，但人们越来越清楚地意识到，这是一种完全全新的武器——一种软实力工具。戈尔（Gore）任命了一个工作组，来解决商业界、原始\
  \ `ARPANET` 创始人以及始终活跃的互联网社区之间的争端。负责的高级官员 `Ira Magaziner` 明确表示，去监管、不干预的方法将继续。但不仅如此，互联网文化将成为审议的核心。但当时的这种文化究竟是什么呢？\n\
  \n辩论的核心在于如何在保护这一有机演变的网络所取得的巨大商业成功的同时，保护最初使其成功的因素。在这一早期阶段，没有人能确定互联网的“秘密配方”究竟是什么。是半个世纪政府的支持和补贴，是\
  \ `Cerf` 的天才开放协议，还是反文化对非政府治理机构的影响？对系统 `root` 控制权的斗争愈演愈烈。为了管理这些意见不同且有时相互冲突的派系，戈尔团队必须制定出一个符合时机的解决方案。最终出现的实体确实是一个奇特的生物，非常适合当时的政治文化。\n\
  \n1998 年成立的域名与数字分配机构 (`ICANN`) 是一家私人公司，但一个不为股东营利的机构。这种激进的创新免除了政府制定规则和规定的职责，转而采用互联网自身的共识模型。这个新机构将设立在美国，并维护\
  \ `root` 区域的现有结构，但竞争被引入到了域名注册这一丰利的业务中。`ICANN` 的职责并不涵盖安全、物理基础设施或访问要求，而是限于非常狭窄但极其重要的全球标识符：域名、`IP\
  \ addresses` 和 `protocols`。\n\n`ICANN` 模型被设计为“利益相关者驱动、开放透明且基于共识的”，基本上是 `Crocker`\
  \ 的 `RFCs` 和“意愿者联盟”的现代版本。下一章将将探索 `ICANN` 独特的运作模式。但这里的关键洞察是，它的建立是对互联网文化的令人震惊的信任投票，`Magaziner`\
  \ 真正拥抱了这一点，并后来称其为如果其“民主化力量”能够得到保护的“反叛实体”。由于地缘政治和商业目标通过互联网的快速传播得到了服务，这是一种出于私利的举动。`Meghan\
  \ Grosse` 等学者认为，戈尔及其团队的干预是保护美国权力的阴谋，而非保护原始互联网文化的真实尝试。也许，更有可能是支持这一创新治理模式的官员是真正的信徒。`Internet\
  \ Society` 的学者写道：“美国政府希望将决策功能交给互联网本身。”互联网最重要的功能从 `Postel` 和 `Stanford` 转移到了新的多利益相关者机构。商业部现在与\
  \ `ICANN` 签约。它是透明的，是协作的，而且不属于政府。`Magaziner` 甚至承诺进行为期两年的快速过渡，将政府持有的资产完全移交给 `ICANN`。但并非所有人都能看到这个新世界的优点。人们敏锐地意识到，即使是美国政府的这种有限角色对其他国家来说也是难以接受的。当国会听证会举行时，一位不那么理想化的官员对\
  \ `Magaziner` 说：“你在这里试图做的是像希皮一样的事情。”\n\n一种 1960 年代反叛的反权威反文化流派确实存了下来，因为整个系统还没有法律依据。`ICANN`\
  \ 作为一个自愿协会成立的，目前也是如此。没有什么能迫使各方（特别是其他政府）永远留在系统中。这意味着，例如，如果有足够的政府聚集在一起，并在自己的边界内运行完全独立于\
  \ `ICANN` 的不同网络，他们可以这样做。国际条约本可以改变，但官员中存在一种真正的信念：在冷战后的全球化系统中，互联网需要一种比基于条约的组织移动更快，同时保持全球视角的东西。\n\
  \n`Cerf` 实际上一直支持将 `UN` 作为全球互联网治理的场所。他、`Cocker` 和 `Postel` 看中互联网的未来力量，希望建立一个与联合国有关且总部位于日内瓦的机构，当戈尔和\
  \ `Magaziner` 不同意时，他们感到很恼火。他们得到的是一个最初与商业部签约并总部位于加州的机构。哈佛大学教授 `Lawrence Lessig` 担心“我们正在创建一个自路易斯那收购以来最重要的司法管辖区，而且我们正在宪法审查之外建立它”。但戈尔对新边疆的承诺——理性和科学的胜利保持坚定不移的信念，并获得了两党的支持。事后看来，这或许是天真的，但在\
  \ 20 世纪 90 年代的黄金时期，似乎 1960 年代自由主义的反文化遗产可以与利润动机和谐统一并维护两者的目标。\n\n但 2000 年带来了新的政治现实。克林顿和戈尔那种基于\
  \ 1960 年代希望的理想主义世界正在消失。以前的希皮士变得越来越具有自由意志主义，他们在越南战争期间对政府的不信任蔓延到了他们新的商业利益中。互联网曾是无国家世界的希望之光，现在正变成一个关键的商业和政治实体。\n\
  \n然而，`ICANN` 似乎保留了原始梦想的某些部分。尽管各方抱怨，聚集在一起创建世界首个互联网治理机构的个人和机构完成了一项巨大的成就。它是一个基于信任的组织，其合法性来自于参与者签署并坚持下去的意愿。它是多利益相关者的，这意味着没有一个派系或权力拥有最终控制权。`Postel`\
  \ 在向商业部长提议 ICANN 模型的信中写道：“在如此广泛的群体中达成共识证明是一项既兴奋又艰巨的任务。虽然可能没有人对随附的文件（包括我在内）完全满意，但共识的精髓在于妥协，而几乎所有参与这一过程的人员都是以这种精神付诸的。”\n\
  \n\n\n戈尔及其团队深信政府拥有行善的力量，他们通过建立这样一个尽管激进但规模有限的机构，证明了政府在细心引导新技术方面（通过引导机制）发挥着积极作用。然而，他们选择不越域名系统之外对互联网进行任何监管——即不对访问、隐私或安全性引入任何规则——这也承认了时代已经改变。政府对联邦科学和工程项目的大额投资已不再流行。曾经的激进学生们如今已投身商界和政界。嬉皮文化已演变为技术乌托邦主义。对越南战争中政府干预的拒绝，变成了对几乎任何事务政府干预的拒绝。在此过程中，许多人变得非常、非常富有。\n\
  \n`ICANN` 被视为一个桥梁机构，能够在传统的条约制组织的缓慢节奏与互联网的快速且无法治的状态之间取得平衡。72 但它也是新旧文化的桥梁。它将一个新形成的、拥有权力和知识的“互联网社区”（诞生于学术工程和计算机科学）与一个成熟的商业和监管社区结合在一起，后者对飙升的股价感到心醉神迷，又对有关新权利和责任的问题感到困惑。`ICANN`\
  \ 是一个重要且有限问题的创新解决方案。其未来的成功取决于世界其他地区对美国政府的信任。\n\n***\n\n戈尔曾希望有一条让所有人平等获取信息的“超级公路”，认为这会扩大机会并实现广泛的社会提升。`Google`\
  \ 搜索、`Wikipedia`、在线图书馆，甚至 `ChatGPT` 现在都提供了这些信息，但戈尔是否实现了他的大目标仍存争议。是的，网络已扩展到越来越多的国家，释放了创造力、选择和连接。在巅峰时期，技术乌托邦主义者将阿拉伯之春的归功于互联网和万维网带来的边界和社区的瓦解。但是，一个由多利益相关者社区而非任何单一政府或公司监督的自由开放网络，只有当你首先能够访问该网络时才是有用的。\n\
  \n如今的美国正受宽带问题的困扰，与其欧洲同行相比，其宽带既贵又慢。新美国基金会（New America Foundation）的一项综合研究发现，这部分由于\
  \ `ISPs` 缺乏竞争。20 世纪 90 年代的去监管化议程未能解决一种可能性，即少数几公司可能会主导整个行业，这种整合“直接影响了互联网服务的成本和质量”。73\
  \ 缺乏选择或切换网络的能力导致了即使某个地区有网络服务，价格也居高不下。还存在显著的数字鸿沟，黑人和有色种族社区、农村人口和低收入家庭的访问率较低,74 在某些情况下，这是因为私人\
  \ `ISPs` 完全忽略了某些地区，例如低收入城市社区，一些人将其称为“数字红线”。75 十个低收入家庭中有四个报告说没有家庭宽带，这一事实在新冠疫情期间显而易见，当时无法在家进行在线学习的孩子在教育上落后了。76\
  \ 当时的报道描述了父母和学生坐在停车场。\n\n创业精神是一种公共利益。塑造互联网的同样嘈杂的声音声——政治文化、商业利益、技术社区本身——也将塑造未来的 AI。追求早期投资者所获得的惊人利润将很容易且极具诱惑，而不是慢下来专注于技术的宗旨和潜力。那些认为\
  \ AI 的某些方面（如生成式模型）发展太快，无法通过耗时且僵化的立法进行监管的人可能是有道理的。鉴于此，有如此少的人探索过类似于 ICANN 的 AI 模型，这令人惊讶。\n\
  \n ��`ICANN`，你行吗？\n\n值得赞的是，一些 AI 商业领袖已经呼吁监管，但这主要是针对遥远的未来。对于现在可能约束他们的任何事情，他们的兴趣要小得多。例如，`OpenAI`（制作\
  \ `ChatGPT` 的公司）负责人 `Sam Altman` 告诉美国参议员，他认为如果该国想在国际上领导 AI 治理，就需要对 AI 进行监管。80 然而，在访问布鲁塞尔的欧洲联盟时（那里的\
  \ AI 法律已经相对严格且先进），`Altman` 将其称为“过度监管”，并表示如果无法遵守，他可能会撤回公司的服务。81\n\n\n\n\n诚然，这并非完美匹配。首先，美国政府拥有互联网的物理资产——根域名区域文件，这使他们掌握了重要的筹码。而大多数\
  \ AI 物理资产，尤其是构建和运行高级模型所需的海量云计算资源，则主要掌握在私营部门手中。另一个明显的区别是，`ICANN` 的功能当时已经由 `Postel`\
  \ 及其同事 `Joyce Reynolds` 在履行，而现今的 AI 还没有任何中心化的运行功能。\n\n然而，这并没有阻止多方利益相关者模型在质询中仍然具有相关性和重要性。`ICANN`\
  \ 的出现部分是因为世界不允许美国政府主管互联网。这对于强大的生成式 AI 模型来说可能同样适用，因为想象私营公司将控制权移交给某种信托或基金会是不现实的。但是，一个非政府的、社区运营的多方利益相关者机构，可能适用于透明地确定\
  \ AI 为了保护未来而需要遵守的“道路规则”，这似乎是现实且可能的。\n\n当然，`ICANN` 永远不会解决网络公平访问的问题，任何新的 AI 机构可能也面临同样的局限性。它无法解决\
  \ AI 引起的所有问题，仍然需要具体的国内政府立法。但对于验证等问题，以及作为一种进行透明审议和决策的方式，以鼓励 AI 模型模型运营者自愿合规，`ICANN`\
  \ 模型确实提供了一个值得探索的创新案例。\n\n## AI 伙伴关系 (The Partnership on AI)\n\n一个已经在尝试做此类事情的组织是\
  \ `Partnership on AI`（简称 `PAI`），它是一个由学者、公司、媒体机构等组成的非营利性社区，旨在扩大对 AI 未来的参与度。在首席执行官\
  \ `Rebecca Finlay` 的领导下，`PAI` 一直将 AI 领域的内部人士与外部人士汇聚在一起，讨论从技术安全到某些 AI 系统偏见问题等一系列议题的\
  \ AI 社会影响。\n\n“世界必须解决的最重要问题——无论是气候变化、地缘政治问题还是先进技术发展——没有任何一个是仅局限于公共政策、工业或学术领域的，”`PAI`\
  \ 的首席执行官 `Rebecca Finlay` 告诉我，“这就是为什么它们是我们这个时代的全球性挑战。我从根本上相信，如果不汇聚不同的观点，你就无法真正采取行动来解决这些挑战。”\n\
  \n想象私营公司将控制权移交给某种信托或基金会是不现实的。但是，一个非政府的、社区运营的多方利益相关者机构，可能适用于透明地确定 AI 为了保护未来而需要遵守的“道路规则”，这似乎是现实且可能的。\n\
  \n\n\n国际电信联盟（ITU）成立于 1865 年，旨在管理日益增长的全球电报网络。二战后，它成为新成立的联合国机构，负责管理从无线电频率到卫星轨道的所有国际标准。2012\
  \ 年，ITU 举办了名义相当枯燥的“世界电信大会”，旨在更新全球电信监管。由于上一次会议是在 1988 年举行，因此坦然需要进行一些更新。当天在迪拜举行的会议议程本上是平淡无奇，包括关于紧急联系电话和长途电话费用的讨论。但这次看似无害的会议最终成为了互联网历史上的一个分水岭：与会的多个国家代表占据了发言权，试图通过常规谈判强迫通过一项关于新政府间互联网监管的约束性要求。美国执政时间太久，其他老牌和新兴的国家力量都觉得是时候时候改变了。\n\
  \n### 迪拜 ITU 会议的转变\n\n在代表美国的高级官员中，有劳伦斯·E·斯特里克林（Lawrence E. Strickling），他是美国国家级电信和信息管理局（`NTIA`）的管理员。该机构负责向总统提供电信和互联网政策的建议，并管理政府与\
  \ `ICANN` 之间的关系。作为全球互联网治理论坛日益动荡局势的紧密观察者，他一直在为这一刻做准备。自从一群新兴的经济强国——印度、巴西和南非——举行了自己的峰会，并表达了获得互联网更大控制权的意图后，欧洲和美国就开始为迪拜可能出现的问题进行准备，直到那时，这种准备工作已持续了一多年。与此同时，俄罗斯和中国一直在推动联合国对互联网根部拥有更多控制权，普京本人也主张让\
  \ `ITU` 在互联网治理中发挥更重要的作用，而不是 `ICANN`。\n\n延续负责几十年互联网治理的跨党统一，美国国会通过了一项全票通过的决议，对“某些国家可能采取单方面行动，导致根区文件分裂，[此举]将导致互联网功能下降并削弱所有人的利益”的“威胁”表示担忧，并呼吁奥巴马总统支持\
  \ `ICANN` 的利益相关者模型，并“继续反对任何将互联网控制权转移给联合国或任何其他政府间组织的努力”。硅谷的民主党代表（行业领袖对 `ITU` 发生的情况公开表达了担忧）断言：“美国在开放结构、多利益相关者方法这一指导了过去二十年互联网发展的这个问题上是完全统一的。”即使是对比美国在互联网治理中的主导地位和控制感到不满的欧洲议会，也开始担心互联网分裂的后果，并通过了他们对当前多利益相关者模型的支持声明。\n\
  \n这些并未能阻止 `ITU` 在迪拜通过其那项令人震惊的决议，该决议要求全球政府对互联网治理采取更多控制。对于斯特里克林来说，国际氛围已经显而易见。他飞回华盛顿告诉同事们，虽然情况还“没有失控”，但如果不采取行动，很快就会失控。“这是一场‘大爆炸’式的事件。”\n\
  \n关于自由开放的互联网如何几乎分裂，但最终被一群敬业的政府官员、技术专家和公民社会团体团结在一起的故事，无疑是一个引人入胜的故事，对未来的全球 AI 治理具有重要启示。但要理解那场斗争，首先需要回溯那场悲剧——它让互联网治理从技术细节的官僚后台走向了世界舞台。\n\
  \n***\n\n### 9/11 时代\n\n在 2001 年 9 月 11 日的惨无人暴行之后，美国开启了一场未宣布但激进的旅程，背离了其作为全球基于规则秩序创始者和维护者的半个世纪角色。哈佛历史学家吉尔·莱波尔（Jill\
  \ Lepore）解释道，通过使用特别遣送、酷刑和在关塔莫哈纳湾的关押，美国“破坏甚至放弃了它自己曾帮助建立的规则”。袭击发生一年后，乔治·W·布什总统的一位高级顾问告诉记者：“我们现在是一个帝国，当我们采取行动时，我们创造了自己的现实。”这个几个世纪一直投射自由公平形象的国家，在面对恐怖袭击时的反应似乎完全放弃了法治。\n\
  \n回到 1998 年，美国承诺在两年内交出互联网根区文件和域名系统的控制权。结果却花了二十年。原因是 9/11。互联网变成了一种武器，被用于以前所未有的规模进行情报收集和大规模监控。目标涵盖外国和国内，包括盟友和敌人。人们怀疑美国正在利用其对互联网基础协议的独特地位，违背了国际社会的信任。一个创新的、通过努力才获得的互联网治理系统几乎崩溃，随着美国的国际地位一落千丈，这为反民主力量创造了机会。\n\
  \n今天，我们正处于一个可能与互联网一样激进的技术变革边缘。在反恐战争永无满足的需求推动下，生物数据的收集在全球范围内加速。随着强大的机器学习技术的出现，9/11\
  \ 之后使用的那种复杂的监控手段已经过时。尽管那种监控在曝光时已令人担忧，但今天的技术强大得多，因此更具侵略性。例如，AI 驱动的人脸识别技术的快速发展是臭名的易于滥用。许多滥用已经在我们身边，发生在世界各地和我们的社区中。我们必须问自己，还将允许它发展到什么程度。\n\
  \n***\n\n### AI 监控的兴起\n\n全球和平基金会（Carnegie Endowment for Global Peace）在 2019 年警告说，AI\
  \ 监控扩散的速度比专家认为的要快，范围更广。中国共产党已成为 AI 监控国家的典范。在那里，政府利用 AI 自动化了公民数据的收集过程，以便将生活的方方面面整合到一个被称为`一人一档`的系统中。这种监控的全方位性是如此完整，以至于《大西洋杂志》编辑罗斯·安德森（Ross\
  \ Anderson）宣布：“全景监狱已经在这里了”。这不仅是中国公民、异见人士和维吾尔族等受迫少数群体的问题，也是那些引入中国模式的其他压迫政权公民的问题。2022\
  \ 年，《经济学人》报道，津巴布韦执政党 `Zanu-PF` 利用中国提供的 2.39 亿美元贷款和赠款建立了了自己的监控基础设施。\n\n\n\n中国与津巴布韦政府的关系并非偶然。中国政府的首要政策优先级一直是“一带一路”倡议（BRI），试图通过投资海外基础设施项目来影响世界事务。英国帝国曾通过在重要贸易路线上铺设海底电缆来植入其影响力，而这些电缆反成为了互联网的基础。现在，习近平主席通过物理和数字基础设施推进了“一带一路”。最近，“一带一路”出现了一个明确的“数字丝绸之路”分支，中国努力将其自己的技术品牌推广到尽可能多的国家，以期获得影响力并制定全球标准。“中国是全球\
  \ AI 监控的主要驱动者，”会基报告作者斯蒂芬·费尔德斯坦（Steven Feldstein）说道。隐私保护人士担心，这可能对全球技术规范产生决定性影响，将中国自己的公民监控愿景出口到新兴经济体。\n\
  \n### 自由民主国家的挑战\n\n为了应对这一局面，全球的自由民主国家必须为 AI 开发选择一条不同的道路。然而，即使在那些以自由为傲的国家，AI 监控已经在部署。例如，伦敦大警察已在公共空间使用实时人脸识别来积极监控并未没有任何犯罪的普通公民。警方辩称，这种用例有针对性地寻找他们的“嫌疑人名单”，但在过程中，他们获取了数千万人的敏感数据，而这些人没有机会反对警方存储他们的个人信息。而且并非所有用途都声称具有针对性。美国和法国的警方已使用\
  \ AI 监控监控整个城市，目标是主动预防犯罪，这一想法直到 2002 年在汤姆·克鲁斯主演的电影《少数报告》中，还被认为是反乌托邦的。尽管如此，与电影不同，这种技术尚未被证明确实有效。\n\
  \n### 执法之外的扩张\n\n不仅是执法部门在利用这些承诺的新能力。在没有任何监管指导使用的情况下，教育机构、私营公司和商店也可以自由使用启用 AI 的生物识别程序，这些程序可以监控语音模式、进行步态分析并分析面部表情。学校已使用“智能摄像头”检查学生是否正确佩戴口罩，并监控他们是否无聊、分心或困惑。随着在线考试日益普及，许多公司推出了声称能够判断学生是否作弊的软件，例如，要求他们在整个测试期间开启摄像头监控其面部。但有多个报告显示，一些黑人和棕色人学生因为脸部无法被“验证”而无法参加考试。\n\
  \n### 职场监控与隐私\n\n雇主也在利用机会监控他们的员工。例如，亚马逊与一家名为 Netradyne 的公司合作，在其配送车辆中引入了 `Driver-I`\
  \ AI 启用摄像头，同时监控道路和司机。有许多“安全触发器”会促使 `Driver-I` 上传视频，从超速和分心驾驶到“急刹车”。亚马逊报告说，这是一个创新的安全方法，保护了“司机和他们配送服务的社区”。但代价是什么？鉴于公司的说法，这些摄像头将“100%\
  \ 的时间”进行记录，这引发了关于司机隐私的问题——更不用说街上行走或在花园里的人的隐私，以及 AI 系统本身可能的不准确性和偏见。遭受职场监控的不仅是低薪工人。自疫情以来，白领监控也显著增加，检查居家办公人员的生产力。公司可能会使用摄像头监控面部表情，或使用软件记录发送了多少封邮件、在非公司网站上花费了多少时间，或者一整天电脑鼠标有多活跃。\n\
  \n也许这完全没有打扰到你。像 `Driver-I` 这样的系统确实可能让道路更安全，而且我们已经在利用技术增强生活的许多方面。雇主多年来一直监控员工的笔记本——如果他们也监控员工的脸，这算是一个巨大的跨越吗？即使你对隐私准则的松动感到舒适，这类\
  \ AI 监控通常存在深度缺陷。在没有任何国家或全球标准的情况下，发布的程序在深色皮肤上运行可能并不准确。\n\n而当这些程序确实有效时，这种过度扩张可能令人寒而栗。2022\
  \ 年感恩节刚过，凯莉·康隆（Kelly Conlon）和她的女儿正在访问纽约，当时她被阻止进入他们作为女童军旅行的一部分而一直期待的无线城剧院圣诞大戏。在通过金属探测器后，一个声音要求一位与康隆描述相同的女性靠边，安保人员告诉她不允许进入。无线城剧院的所有者曼哈顿娱乐（Madison\
  \ Square Entertainment）张贴告示，承认使用人脸识别是为了客户安全。但在这种情况下，康隆仅仅是一家律师事务所的律师，该律多年来一直在与 MSG\
  \ 拥有的的一家餐厅进行诉讼。“在我告诉他们之前，他们就知道我的名字了。在我告诉他们之前，他们就知道我所属的律所了。他们告诉我我不被允许在这里，”康隆说道。对此，MSG\
  \ 娱乐没有否认发生过这种情况，但表示康隆违反了一项“简单而易懂的政策，该政策禁止对公司正进行活跃诉讼的律师在诉讼解决之前参加我们场馆的活动”。\n\n也许这是公司使用\
  \ AI 的一种可以接受的方式。也许不是。由谁来决定，你又想要有发言权吗？\n\n对潜在滥用的担忧现在是如此巨大，以至于微软和 Facebook 等大公司已经停止了它们自己的人脸识别产品，担心跨越隐私的红线。旧金山作为未来技术的“矿井里的金丝雀”，是第一个禁止公共机构使用人脸识别的城市，这应该告诉我们一些事情。但这些是范围有限的局部解决方案。AI\
  \ 监控在大多数地方是完全合法的，如果政府和私营客户有需求，那么会有更多的监控被建造。\n\n\n\n\n例如，美国 Clearview AI 公司从互联网上抓取了数十亿张人脸图像，包括来自\
  \ Facebook 和 YouTube 等平台，然后将这些人脸数据库出售给警方和其他私人公司。他们的技术已用于乌克兰的战场。在英国、法国、意大利和希腊，监管机构已因违反隐私规定对\
  \ Clearview 处罚款，要求其支付数百万美元，并删除且停止收集这些国家公民的面部。但监管仍然参差不齐，更多国家似乎正在投身于 AI 黄金热，而不是在制定审慎和谨慎发展的法律。哈佛法学院教授乔纳森·齐特雷（Jonathan\
  \ Zittrain）在 2022 年写道：“我们将生活在一种环境中，在任何时刻、被任何人、在与他人共享的任何空间——或摄像头——中被识别，而我们作为一个社会，并没有任何严肃的努力来决定这是一件明智的事。”他表示，Clearview\
  \ AI 的商业模式被允许繁荣，是“这一代人数字领域最大的公共政策失败”。19 2021 年，Clearview AI 从包括 Palantir 创始人彼得·蒂尔（Peter\
  \ Thiel）在内的投资者那里筹集了 3000 万美元。\n\n“如果你没有什么隐藏，那就没什么好，”这是一个常见的反驳。面部识别技术确实有积极的应用案例，例如部署它寻找失踪人员，或更快地抓住逃犯。但即使是所谓的收益也要付出代价，考虑全面且持续监控的后果是非常重要的。即使是历史上最守法的公民也可能在参加抗议行进时犹豫，担心数据可能被用来对付他们。20\
  \ 全方位、无处不在的监控必然改变个人行为。对于哪些政府机构和领导可以访问这些数据，个人可能有着截然不同的偏好。乔·拜登可以，但唐纳德·特朗普不可以？英国军情局（MI6）可以，但汉郡郡议会不行？在陷入自动化、未经审查且不负责任的监控之前，我们是否想要设定任何边界？\n\
  \n这个世界比一个代以来的任何时候都更加不稳定。关于未来政治愿景的新战斗正在民主与专裁之间激烈进行着。西方世界受到泽连斯基总统和乌克兰人民面对俄罗斯侵略时的勇气与激情的团结和激励。成千上万香港人选择了在英国的生活，而不是接受中国对其自由的镇压。自由民主国家如何调和隐私权与自动化监控近乎无限的潜力，将设定全球范围内这一对话的基调，并在“太空竞赛”的回响中，对我们传播民主模式支持的能力发挥关键作用。作为领先的\
  \ AI 民主国家，我们必须问自己，我们对 AI 的使用、我们树立的榜样将如何塑造我们的社会、政府以及整个世界。\n\n## 反恐主义战争\n\n正如上一章所述，ICANN\
  \ 有两个特点。首先，它是一个自愿安排。其次，它是一个多利益相关实体。这意味着它不由任何一种类型的组织主导，而是从技术社区、学术界、活动人士和政府中招募参与者。没有任何派系可以主导，但达成共识具有挑战性。“我们正试图建立社区……认同和合法性，”ICANN\
  \ 的首任主席埃斯特·戴森（Ester Dyson）回忆道。这说起来做起来难。ICANN 被一些人指责背叛了去中心化、非层次化互联网的最初承诺。技术教授米尔顿·穆勒（Milton\
  \ Mueller）等批评者在其成立后几年警告说，商务部的持续控制是一个“定时炸弹”，并担心美国国内的民族主义力量可能会“恐吓”那些试图结束这一安排的人。这在多年后才成为一个热门的政治议题，但即使在早期，至少在技术社区中，人们对某些国家行为者可能“利用……互联网标识符产生的数据，以便利执法机构对互联网用户进行监控和控制”存在重大担忧。21\n\
  \n这些情绪得到了更广泛的公民社会和互联网社区中许多人的共鸣，他们担心 ICANN 是美国政府与互联网内部人士（如“ARPA 精英阶层”）之间的亲密关系，其中许多人在那些早年里就活跃在\
  \ ICANN 中了。当美国的互联网理想主义者在内部攻击 ICANN 时，其他国家也从海外加入了他们自己的批评。它位于加利福尼亚的物理总部是一个担忧之源，它与商务部的持续关系也是如此，尽管\
  \ ICANN 在实际运营上具有很大的独立性，但商务部仍然是负责根区域文件并因此是整个域名系统的实体。\n\n当然，这些国家的动机是复杂的。威权国家担心互联网的力量会成为异见人士组织的地方，并一直担心言论自由可能如何削弱他们控制人口的能力。美国的全球对手对对手维持对互联网根的控制感到不安全，并认为美国在世纪交之之际会将控制权移交给\
  \ ICANN。早在 1999 年，在一次国际电信联盟（ITU）全会会上，俄罗斯主张通过联合国增加对 ICANN 的参与，俄罗斯在联合国拥有成熟且强大的角色。但民主国家和发展中国家也担心\
  \ ICANN 模式。对于在网络普及方面更加落后的贫穷国家，他们担心会被“遗弃”并被“排除”在数字革命的新权力结构之外，就像几十个世纪前那样。对于他们来说，联合国提供了最好的希望，让他们在追赶的过程中“保留自己的席位”。即使是法国这样富有实力的民主盟友也认为全球监管的适当渠道应该是联合国。但目前，可能由于没有更好的替代方案，这种微妙的协议维持了。毕竟，美国曾承诺这种关系只会持续两年。“真正改变一切的是，”克林顿官员\
  \ J·贝克维斯（J. Beckwith）“贝基·伯尔（Becky Burr）解释道，“9 月 11 日。”22\n\n伯尔受过法律训练，在读了巴洛夫的《网络空间独立宣言》后，对互联网引发的日益法律问题产生了兴趣。她是少数察觉到这片似乎超出传统法律范围的巨大新疆域具有激进色彩的早期学者之一。伯尔在\
  \ ICANN 的建立中发挥了关键作用，并在计划并正在进行的从美国托管的过渡中发挥了作用，尽管并没有按照最初的两年计划——当时基地组织恐怖分子劫持了四架飞机并撞向五角大楼和双子塔。\n\
  \n\n\n\n\n命运的转折让乔治·W·布什在那个时刻掌握了权力，而不是阿尔·戈尔。2000 年的大选是人们记忆中最接近、斗争最激烈的一次——结果由一个保守派主导的最高法院通过一项非凡判决决定。约翰·保罗·斯蒂文斯法官在反对意见中写道，真正的输家不是戈尔，而是国家对法律系统的“信心”。这种动荡加剧了公民与政府之间信任感的下降，这种趋势始于越南战争，在水门事件中得到加强，并因克林顿对自己与实习生情情的谎言而强化。勒波尔（Lepore）写道：“在\
  \ 1958 年至 2015 年间，向民意调查者表示他们‘基本上信任政府’的美国人比例从 73%下降到 19%。”23\n\n互联网在这一瓦解过程中也起了作用。虚假信息现在可以传播得更快。“点击诱饵”（clickbait）一词的出现，是为了描述那种为了吸引页面访问量和广告收入而日益煽动化的内容现象。这种认知源于音乐偶像大卫·鲍伊，他在\
  \ 1999 年接受关于互联网影响的采访时说：“我想，至少到 70 年代中期，我们真的觉得自己还生活在一个单一社会的掩护下，那里有已知的真相和已知的谎言，”但这种确定性已经崩溃，并“产生了像互联网这样的媒介，它绝对地建立并展示了我们生活在一个完全碎片化的世界上。我不认为我们看到的只是冰山一角……我认为我们正处于某种令人兴奋又恐惧的事物的边缘。”24\
  \ 鲍伊看到了裂痕正在扩大，但美国政府太专注于情报收集了，无暇顾及此。\n\n9·11 日的恐怖袭击是一场悲剧，全球社区齐聚在一起对美国表示同情。甚至普京也给布什总统打了电话，表示哀悼。对于这个国家本身，这些袭击将珍珠港的震惊与毁灭，以及斯普尼克卫星发射后对政府能力的质疑结合在一起。通过斯普尼克卫星，美国政府实际上知道苏联卫星的能力，但他们公开的懈意被解读为无能。而\
  \ 9·11 日，则是这个国家的安全和执法机构被认为未能保护美国人的安全。\n\n这种失败并不是因为缺乏信息。中情局和联邦调查局拥有在恐怖分子劫持飞机之前找到并逮捕他们的情报，但官僚主义和领地意识的结合阻止了信息的拼凑。25\
  \ 那么答案无疑是更好的协调和信息共享。自 20 世纪 50 年代起负责美国信号情报的国家安全局（NSA）想要加强其能力，而袭击随后的混乱、沮丧和政治统一为他们提供了这一机会。记者詹姆斯·鲍尔（James\
  \ Ball）解释道：“[美国政府国家安全]机构渴望获取尽可能多的[数据]，以确保不再如此惨痛地错过任何袭击，”他曾是获得普利策奖的团队成员，该团队揭露了 9·11\
  \ 事件后美英政府大规模数据收集的内幕。26 政府和安全机构进入了加速运转状态，权力和控制突然被“收回”，包括`ICANN`。布尔（Burr）说：“一段时间以来，情报界深信控制权威根节点有一个重要的理由。”27\n\
  \n随之而来的是全球范围内以及美国国内对公民进行数字监控的革命。袭击发生后，总统授权了一个名为`STELLARWIND`的计划，导致了`NSA`在无搜查的情况下进行大规模数据收集和挖掘。随后，在仅经过七周的辩论后，布什总统签署了《美国爱国者法案》（`USA\
  \ Patriot Act`，这是一个情感化的标题，表面上是“通过提供所需的适当工具来拦截和阻止恐怖主义以统一和加强美国”的缩写），赋予了政府监控更广泛人群的空所未有的权力。根据美国公民自由联盟（ACLU）的说法，该法案是“监控法律许多变化中的第一个，通过扩大监控电话和电子邮件通信的权限、收集银行和信用报告记录，以及追踪无辜美国人在互联网上的活动，使政府更容易监视普通美国人。”随后是更巨大的要求和进一步的立法，包括\
  \ 2008 年对《外国情报监视法》（`FISA`）的更新，该法案名称更为低调，但并未削弱国家可怕的权力。对于`ACLU`和其他批评者来说，《爱国者法案》“将普通公民变成了嫌疑人”。28\
  \ 当《爱国者法案》在 2005 年重新授权时，年轻的参议员奥巴马参与了一项引入保护措施的跨党尝试，他引用滥用担忧并拒绝隐私与安全之间的“虚假选择”。29\n\n\
  ***\n\n`ICANN`试图通过坚持他们仅仅是一个技术协调机构的观点来抵抗对美国间谍能力的推测，并指出他们没有收到美国政府的资助。但在一个专注于安全和控制的政府的新政治范式面前，他们挣扎求生。30\
  \ `ICANN`的首位首席执行官迈克·罗伯茨（Mike Roberts）曾担心，如果他和同事不能让这个新机构运作，它最终将由美国政府全权管理，威胁开放全球互联网的稳定性。他回忆道：“我很担心我们的法律脆弱性会崩溃回一个政府运行的实体。”2001\
  \ 年，`ICANN`仍然技术监管领域的一个新颖实验，其未来并不安全。有理由相信布什总统的新团队可能会试图夺回美国政府的控制。罗伯茨反思当时的政治气候说，“你想想，布什政府是不允许任何其他结果的。”31\n\
  \n对美国的袭击以及政府的回应导致了地缘政治现实和忠诚关系的剧变。起初，对这个国家爆发了支持和善意。布什总统在袭击发生后几天在国会发表演讲时说：“美国永远忘记在白金汉宫、巴黎街道和柏林勃兰登堡门响起的我们国歌声。我们不会忘记聚集在首尔美国使馆外祈祷的韩国儿童，或在开罗一某清真寺里提供的同情祈祷。我们不会忘记澳大利亚、非洲和拉丁美洲的静默时刻和哀悼日。”32\
  \ 为了击败基地组织而对阿富汗的入侵得到了联合国的的支持。但布什很快将他的战争变成了对“恐怖”的战争：一场无法定义、无法实现且永无止的战争。政府在追求反恐战争的过程中迷失了方向和自我，允许对外国嫌疑人进行酷刑，或者正如他们委婉所称的溺刑和暴力虐待——“强化审讯技术”。当他们挥霍掉\
  \ 9·11 后获得的善意和同情时，他们道德权威的丧失被用来反对他们在互联网治理中继续占据主导地位。\n\n\n\n\n`ITU` 曾在 1998 年就请求联合国进行干预，对新成立的\
  \ `ICANN` 的角色感到不满。一些国家也对这个新机构表示怀疑，在 2001 年一次由 `UN` 主办的会议上，出现了一份报告，明确互联网治理远不是一个解决的问题。该报告明确要求建立一个新的机构来管理日益日益增长和演变的互联网所产生的问题，并列出了一系列互联网治理方案，这些方案“要么取代\
  \ `ICANN`，要么让其向一个新的国际机构负责，而该国际机构将有效接管美国商务部的角色”。世界大国之间形成了不同的阵营，其中中国、巴西和南非是呼吁联合国对\
  \ `DNS` 进行监管的成员之一，而美国、加拿大和澳大利亚则继续捍卫 `ICANN` 多利益相关者模型。但在伊拉克战争之后，欧洲与美国之间的关系降到了令人担忧的低谷，到\
  \ 2005 年，甚至欧盟联盟也开始寻求互联网治理的“新合作模式”。开放的互联网依赖于全球共识，即信任 `ICANN`（以及延伸出的美国）能够运行对网络功能至关重要的域名系统。但，随着布什政府在克林顿政府承诺的两年过渡计划上停滞不前，美国的国际地位受损，`ICANN`\
  \ 模型开始失去支持。美国国会证实了批评者最坏的担心，对日益增长的担忧做出回应，通过了一项跨派决议，大胆地确认事实上，美国将打破其结束美国对互联网根域名权限的承诺。“权威根区域服务器应在物理上位于美国，商务部长应保持对\
  \ `ICANN` 的监督，”该决议获得一致通过。33\n\n美国在监督 `DNS` 这一关键角色上赢取支持和确立正当性的能力，依赖于信任、透明度和开放，这正如自\
  \ Steve Crocker 的网络工作小组以来的所有互联网治理一样。它依赖于其作为全球公平仲裁者的声誉。但 9/11 袭击引发了一系列永远改变世界的事件。一场在此期间被授予和滥用的权力的全球清算将再次动摇互联网的根基。\n\
  \n## 像我们这样的间谍\n\n2013 年 6 月 5 日，我在伦敦特拉法加广场附近一家酒吧上方的房间里举办了一个饮酒会。聚会是因为我要离开政府和政坛，在此之前我的整个职业生涯都在那里工作（如果不算我最终在威斯敏斯特获得全职职位之前担任过的许多调酒、工会代表和秘书工作的话）。对我来说这是一个感性的夜晚，特别是当我的团队向我递交我们提交的旨在使同性婚姻合法化的法案副本时，那是我多年努力的结果，无疑是我职业生涯中最自豪的成就。但说实话，我为离开感到释脱。作为副总理特别顾问的过去两年是精疲力竭的，正如任何“Spad”（政治特别顾问）都会告诉你的那样。当\
  \ `Spads` 被推入一个拥有巨大责任但极少培训、管理支持或资源的角色时，他们大多年轻、缺乏经验且渴望迎合他人。《平等婚姻法案》曾是我生活中的高光，但低谷时刻几乎都围绕着《平等婚姻法案》展开。\n\
  \n《平等婚姻法案》曾是我生活中的高光，但低谷时刻几乎都围绕着《数据留存法案》展开。《数据留存法案》（又名“监听者宪章”）是 `U.K.` 政府试图获取更多通信访问权的尝试。这项法律草案受到了\
  \ `U.K.` 政府内部许多人的渴望，并得到了安全部门的支持。我效力的领导 `Nick Clegg` 是一个对隐私有强烈感受的政党的领袖，但他最终为了安全同意支持《数据留存法案》。`U.K.`\
  \ 政府的另一个政党由 `David Cameron` 领导，许多成员也有类似的观点，即国家安全。\n\n试图调和这种局面几乎是不可能的，并导致了政党内部以及政党之间产生了大量的怨恨。因此，在那个温暖的夏日夜晚，在酒吧里，感到如释重负。我正离开去加入一家科技公司\
  \ `Google`，因为如果说这场辩论教会了我什么，那就是政治世界和技术世界之间需要更多的理解。我将从政治顾问生活的持续压力中解脱出来，不再再需要每天讨论监控能力。但就在我向朋友和同事道别的那个晚上，《卫报》报发表了一系列震惊性报道中的第一篇，这些报道将震惊整个世界，颠覆了互联网治理，并确保了我在未来的多年里一直思考大规模监控这种改变世界的能力。\n\
  \n* * *\n\n从 2013 年 6 月 5 日开始，持续数月，《卫报》及其伙伴《华盛顿邮报》和《镜报》发表了一接接又爆炸性的报道，这些报道基于 `NSA`\
  \ 承包商 `Edward Snowden` 泄露的大量机密文件。† 文章报道的内容除此之外还包括一个代号为 `PRISM` 的 `NSA` 项目，该项目迫使\
  \ `Google`、`Yahoo`、`Facebook` 和 `Microsoft` 等美国科技公司提交外国嫌疑人和美国人的数据，包括电子邮件内容、网络搜索、短信和视频通话。34\
  \ 这并不是许多人最初认为的那种让 `NSA` 可以随心所欲访问的所有公司数据的“后门”。但它让人们意识到，通信数据对安全部门来说有多有价值，以及自 9/11\
  \ 以来他们的权力变得多么巨大。其他报道显示，例如，`NSA` 能够迫使电信公司 `Verizon` 以“持续、每日”的方式向他们提供所有 `Verizon`\
  \ 电话记录的批量文件，他们可以从中搜索任何他们的数据。35 这种访问程度似乎已经超出了《爱国法案》及其配套措施允许的范围。\n\n\n\n\n最终，英国自己的秘密机构也通过一个代号为\
  \ `Tempora` 的计划进入了故事，该计划由英国版的 NSA——政府通信总部（`Government Communications Headquarters`，通常被称为\
  \ `GCHQ`）领导。英国间谍技术的威力被证明是巨大的。詹姆斯·鲍尔（James Ball）将 `Tempora` 描述为本质上是一种互联网“追剧电视服务”，捕捉并存储海量数据以备不时之需。这让他们能够，例如，挖掘尚未进入监控名单的嫌疑人的过去的通信记录。鲍尔表示，该计划是“当政府能够访问全球互联网的一些关键交换节点，与运行这些节点的电信公司建立紧密关系，并拥有构建复杂监控行动的预算和专业知识时，就会发生的事情”。作为“五眼”情报共享网络（由美国、英国、加拿大、澳大利亚和新西兰组成）的一部分，这些数据对\
  \ `NSA` 也可用。事实上，`Tempora` 是更广泛的 `GCHQ` 计划的一部分，其标题可能是最具揭示性的——它被简单地命名为“掌控互联网”。\n\n\
  最初的指责和愤怒很快袭来，并不是针对政府及其安全机构试图监视罪犯、恐怖分子或敌对国家的想法，而是因为突然意识到，这些机构竟然如此容易地访问每天通过电信网络传输的海量深度个人信息。摄像头画面、短信、电子邮件、位置数据——这些都是\
  \ 21 世纪生活的各个面。这些揭露不仅对访问数据的人提出了令人不安的问题，也对最初收集数据的人提出了问题。十年前，外界对私人公司在线数据收集的普遍关注程度，在专门的隐私圈或将数据变现的广告大脑脑之外寥寥无几。现在，它面临着前所未有的聚光灯审视，这为依赖用户信任（无论是企业、个人还是政府）的科技公司带来了巨大的麻烦。\n\
  \n在我离开告别会后的第二天，我的新老板、Google 创始人兼首席执行官拉里·佩奇（`Larry Page`）发布了一份题为“搞什么……”的声明。他说，他的公司仅遵守法律请求，政府对其系统没有直接访问权限或所谓的“后门”。他们没有收到过\
  \ `Verizon` 订单那种规模的请求。而且他们是第一家发布透明度报告的公司，显示了他们从全球政府处收到的具体法律指令。但对企业和政府声誉的损害已经造成。国家安全机构的成员开始强调，`Google`\
  \ 或 `Facebook` 对你的了解与政府一样多，甚至更多，你应该比担心国家更担心他们。这些公司反驳说，个人可以选择退出不使用 `Facebook` 或 `Google`，但无法退出政府监控。\n\
  \n事实上，即使有保护隐私的措施，这场争议也标志着人们对在线数据认知方式的巨变。复杂的在线广告系统是资助 `Alphabet`（Google 的母公司）、`Meta`（拥有\
  \ `Facebook`、`Instagram` 和 `WhatsApp` 的公司）、`Amazon` 等公司的“金母鸡”。批判性学者创造了“监控资本主义”一术语，来描述想要免费服务的用户与通过向广告商出售客户亲密知识来提供服务的公司之间的这种关系。有些人可能认为这是一种公平的交易，但一旦社会接受了私人企业为了此目的进行大规模数据收集，那么安全部门就可以理所应当地以国家安全的之名对同样的做法表示默许。“一切的数字化是给\
  \ `NSA` 的一份礼物，”斯宾塞·阿克曼（Spencer Ackerman）在泄密发生当时担任《卫报》的安全记者时写道。\n\n***\n\n根据 `Snowden`\
  \ 的一批文件的后续新闻报道，一位安全专家称这暴露了一个为期十年的 `NSA` 计划，旨在破解“互联网的底层结构”。加密是现代互联网最重要的部分。它是通过利用高级数学，使通过电缆网络传输的信息隐藏在视线之外的过程。没有加密，我们就无法进行安全的在线银行交易，无法保护关键国家基础设施免受攻击，无法进行私人通信。没有它，我们在网上所做的一切以及我们所有的个人信息都可能是可见的，包括地址、信用卡和家庭照片。早期的互联网没有使用强加密，因为它规模较小，且基于信任个人的网络。但我们今天使用互联网的方式如果没有加密将是不可能的。詹姆斯·鲍尔解释说，得知\
  \ `NSA` 与 `GCHQ` 合作一直在破解加密协议，这“大致等于得知警察知道国家每一把门锁的弱点，并一直秘密地让这些锁变得更糟糕”。这两个情报机构在过程的两个端共同工作，在商业系统中发现漏洞却未进行报告，并“暗中影响”公司的产品开发以保持加密薄弱。这些本该保护公民的机构实际上通过破坏互联网的基础安全，使生活的核心部分变得更加不安全。他们各自计划代号——`Bullrun`\
  \ 和 `Edgehill`——是美国和英国内战中的关键战役，这承认参与者对这种道德困境并非不知。\n\n针对外国政府的间谍活动并不新鲜，但这种方法的规模和成功程度却让人感到新鲜。传统的盟友感到愤怒。`Snowden`\
  \ 泄露的文件显示 `NSA` 监控了三十五位世界领导人的个人通信，包括来自欧盟的，德国总理安格尔拉·梅克尔（`Angela Merkel`）认为她就在。这对国际信任是一个沉重的打击，侵蚀了外交关系并削弱了美国对道德权威的主张。“我们需要对盟友和伙伴保持信任，这现在必须重新建立，”梅克尔要求道，“我重复，朋友之间的间谍活动对任何人都是完全不可接受的。”\n\
  \n\n\n\n普通人对这些计划的广度感到震惊，对其中涉及家名户晓的人物感到震惊，并意识到他们一直以来认为在网上所做的一切都是私密的，但实际上可能被某个无名无的政府员工看到。英国政府通信总部（GCHQ）一项“精通互联网”计划的一份文件写道：“你处于一个令人羡慕的位置——尽情享受并充分利用它。”\n\
  \n鉴于恐怖分子使用与所有人相同的在线通信工具，即使是所谓的针对性监控现在也将普通互联网用户纳入网中。鲍尔（Ball）指出，从逻辑上讲，这本包括显性材料，包括从雅虎摄像头收集的图像。47\
  \ 斯诺登本人表示，美国国家安全局（NSA）的程序如此松散以至于该机构的工作人员在工作中会将发现的裸照分享给同事。他告诉《卫报》：“那些在草堆中搜索的人很多是年轻的……小伙子，”如果他们恰好看到他们认为有吸引力的性影像，那么“他们转过椅子给同事看……某种程度上，随心所欲。”48\
  \ 英国政府辩护称，大规模数据收集以及 GCHQ 设计的算法对数据进行分析实际上并非侵犯隐私。只有当一个人查看这些信息时，才构成侵犯。49\n\n### 总统的回应与元数据\n\
  \n当时的总统奥巴马最初对泄密事件不屑一顾，对民主体制的监督感到放心。他解释说，这些信息可能是机密的，但并非秘密。国会已经收到了简报并知情，而且这些权力已“反复获得广泛的跨党人多数的授权”。他说：“你们正当选出的代表一直对我们正在做什么了如指，而且‘没有人听你们的电话’。”50\n\
  \n总统继续说道，这仅涉及“元数据”，我立刻认出了这个论点。他曾听过安全官员的简报，就像我们在几年前围绕《通信数据法案》引发的骚乱中听到的那样。我们被告知元数据仅仅是`Skype`通话的`IP\
  \ address`，或者消息发送时的`timestamp`，因此完全没有侵入性。奥巴马说元数据只有电话号码和通话时长。但事实证明，数字通信的元数据可以揭示比你最初想象的得多的信息，包括你每天每一刻的位置。1999\
  \ 年至 2005 年担任`NSA`局长的迈克尔·海登将军后来承认：“我们根据元数据杀掉过人。”51\n\n### 公众认知的转变\n\n在 21 世纪的 10\
  \ 年代期间，英国普通民众开始意识到，互联网并非他们所认为的那种纯真、无所禁忌的乐园。现在他们意识到，他们交出的自我信息比他们理解的要多得多。大量私人公司现在拥有海量的个人信息，而且国家也可以访问这些信息。\n\
  \nBBC 安全记者戈登·科雷拉（Gordon Corera）在他关于间谍活动和计算机的历史书中写道：“美国在第一次世界大战中从英国学到，通信控制与国家实力紧密相连。这让你能够监视他人，但也让你获得了一种安全感，知道对方没有报复。”作为\
  \ 19 世纪末 20 世纪初的帝国帝国，英国非常有目的地地建立了一套它可以控制和利用的通信基础设施，利用与铺设海底电缆的私营公司的关系在信息战中获得优势。52\n\
  \n21 世纪的到来发现美国和英国正在以新的方式利用类似的优势。在英国，相对松散的监管系统结合控制电报缆的帝国遗产（许多现代光纤电缆就铺设在这些电缆之上），导致一份\
  \ GCHQ 报告声称英国正处于信号情报的“黄金时代”。53 在美国，政府不仅利用了他们建立了大部分基础设施的事实（包括部分资助了位于布德的 GCHQ 基地的巨大现代化项目），还利用了世界上大部分通信依赖于美国公司这一事实。54\n\
  \n### 地缘政治影响\n\n在美国和英国内部，人们对政府监视自己的公民感到担忧，但不足以产生重大变革。大多数政治家陷入了同样的困境，担心削弱情报权力会让他们为下一次袭击负责。但正如科雷拉所解释的，虽然外国势力之间（包括盟友和对手）互相监视是常态，但首要规则是“不要被抓到”。由于泄密事件，美国和英国被当场抓包。55\
  \ 在美国在经历了 CIA 酷刑、关塔莫哈纳湾和阿布格莱布监狱的恐怖事件后，已经遭受了道德公信力的崩溃，在此基础上，大规模监控的曝光为那些主张美国已不再被信任可以监管互联网的人提供了依据。\n\
  \n在对一种他们曾推崇为全球自由至关重要的工具进行冷酷剥削时，美国和英国在无意中放弃了道德制高点。特别是中国和俄罗斯……像`华为`这样作为中国首批科技巨头之一且现在是全球最大的电信公司之一的企业，在西方受到了怀疑。众所周知，中国政府与中国企业有密切的关系。现在，美国公司在尝试开展全球业务时也可能面临同样的信任危机，而华为可以辩称——虽然有说服力但并不完全诚实——他们的政府关系与`Verizon`或`IBM`并无异。。与此同时，中国政府有了一切理由来优先支持本土企业而非外国公司，进一步阻碍了美国企业在中国巨大的市场中的发展。结果是一个惨的乌龙球，在恰恰需要强大的民主价值观来维持互联网治理国际合作的时候，削弱了美国在竞争性互联网对手面前的地位。\n\
  \n\n\n\n\n如果 Larry Strickling 在 2012 年的 ITU 会上察觉到了互联网的巨大问题，那么斯诺登泄密事件带来的冲击只会让这些问题呈指数级地恶化。从\
  \ `ICANN` 成立的 1998 年到 2013 年，互联网的格局发生了不可估量的变化。用户数量不仅从几百万增长到了数十亿，而且权力中心也发生了转移。1998\
  \ 年互联网普及率不高的国家现在已经实现了网络化，并希望在决策桌上拥有更大的席位。泄露的规模、其新闻价值和戏剧性、对信任的背叛以及整个世界范围内的巨大震惊，都加剧了治理社区内部的进一步动荡。互联网治理问题突然出现在了每一位政治家的雷达上。\n\
  \n到目前为止，关于谁拥有互联网的哪些部分、关于根服务器、域名和 IP 地址的辩论，一直没有没有进入世界领导人的议程，因为这些领导人更关注他们认为能够赢得选票的政策性问题。英国英国首相托尼·布莱尔现在将\
  \ `AI` 和技术革命视为英国面临的前五大问题之一，57 他在 2010 年的自传中描述自己是一个“真正的技术恐惧者”，并表示这在他那个时代的领导人中并不稀奇。58\
  \ 在竞选活动期间，乔治·W·布什曾通过公开询问“互联网上的高速公路会变得更少吗？”来暗示他对技术世界的熟悉。59 而现在，互联网的基础设施已处于中心位置，并且似乎正如\
  \ Ball 所说，“美国正正在滥用其监督互联网协议和安全的角色。”60\n\n这种沮丧感不仅来自国际政府，还来自民事社会、标准机构以及互联网社区本身。在《卫报》关于\
  \ `PRISM` 的第一个报道四个月后，在乌拉圭举行的一次 `ICANN` 会上，`ICANN` 的领导以及来自非洲、亚洲、欧洲、拉丁美洲和北美的五个区域互联网注册机构、`互联网工程任务组`\
  \ 以及由 `Tim Berners-Lee` 创立的`世界网联盟`，对间谍活动表示了强烈关注，并呼吁建立一个所有利益相关者都能平等参与的环境。”61 一位 `ICANN`工作人员指出，“这项议程[没有]通过测试。”62\n\
  \n## 为自由作证\n\n开放互联网的想法——而不是被分裂成更小、孤立的网络——是一个美丽的愿景。但从回头来看，考虑到全球局势不稳定，称其为天真反而容易得多。但像\
  \ `Tim Berners-Lee` 等人的情感源于希望和乐观。然而，日益明显的是，自由并非唯一的动机。\n\n现在，在 `斯诺登` 泄密之后，即使是开放互联网的倡导者也开始怀疑。对于美国在监督互联网的角色以及其作为大多数科技公司所在地的利益，产生怀疑变得更加容易。例如，2008\
  \ 年，在中国政府被抓获入侵公司系统后，`Google` 从中国撤出了其搜索工具。当新的 `Obama` 政府于明年就职时，它推崇“互联网自由”叙事，以加强对开放架构的支持。这是一个真诚的立场，是\
  \ `Al Gore` 理想主义的延续。但日益明显的是，自由并非唯一的动机。一个开放的互联网现在对于保护和增长 `硅谷` 大科技公司所享有的巨额利润也至关重要。这是一个令人不安的真相，在竞争对手之外蔓延着新的愤世嫉俗。美国对这些错综复杂的关切和利益的回应，是试图让“蛋蛋蛋”重新好起来。\n\
  \n“我们需要将我们的进步与我们的原则同步，”国务卿 `Hillary Clinton` 在 2010 年于华盛顿特区一次关于互联网自由的演讲中说道。这是一件“明智”的事，因为“通过推进这项议程，我们使我们的原则、经济目标和战略重点保持一致。”克林顿明确将互联网自由与《世界人权宣言》联系起来，并将对它的反对视为对数字`柏林墙`的认可。她说，这不仅关乎言论自由，还能跨越地理和宗教的分歧团结人民。“我们已经开始将美国的学生与世界各地穆斯社区的年轻人联系起来，讨论全球性挑战。我们将继续利用这一工具促进来自不同宗教社区的人之间的讨论。”在线虐待、骚扰、极端主义、欺诈、审查和监控等挑战在演讲中被提到，但大多是反映他人的恶行为，而非美国公司的问题。”63\
  \ “信息自由支持作为全球进步基础的和平与安全，”国务卿肯定道，尽管在不久之后这一前提就会被一个日益极化的美国所质疑。64 但在在克林顿演讲仅一年后，在被称为`阿拉伯之春`的期间，社交媒体和互联网网络的力量被视为这一策略有效的证据。\n\
  \n\n\n\n中国实际上已经屏蔽了互联网访问。正如“中国长城”之名，它阻止了某些网站，并使用一种被称为深度包检测的复杂技术来审查词汇和政府不喜欢的新闻报道。在斯德登事件之后，似乎许多民主国家也会效效仿，尽管程度不一。愤怒的巴西总统迪尔马·罗塞夫在斯德登泄密事件中看到了自己的政府被监视的证据，指责美国违反了国际法，并宣布巴西也将采取行动，以打破美国的支配地位并保留互联网主权。由于对国内监视的历史，已经具有隐私意识的德国开始研究类似的屏蔽互联网的提案。德国电信作为欧洲最大的电信供应商之一，开始将软件标记为“德国制造”，以赢得担忧隐私的德国人的这项新项目解释道：“当我们得知\
  \ `PRISM` 时，我们立即决定采取行动。”法国政府对 `ICANN` 提出了批评，称其“不透明”，且“不再是讨论互联网的合适论坛”。\n\n巴拉克·奥巴马总统时期本应该是修复美国的全球地位。他出生在美国，但在小时候生活在海外，这让他对外国事务有更深入的理解。这种“双重愿景”他后来在回忆录中反思，“与之前的总统们不同。”他的竞选是对布什任期的直接反驳，他承诺关闭关塔莫纳湾，并称《爱国者法案》是“基本原则被违反的例子”。在上任后，他禁止了反恐战争期间使用的酷刑技术。在柏林的街头，成千上万的人出来欢迎他。他投影了一个国际主义政府的信念，很大程度上相信他，以至于仅凭他的候选身份和选举，他就在执政不到一年的\
  \ 2009 年被授予诺贝尔和平奖，以表他在加强国际外交和人民合作方面的“卓越努力”。可以说，正是因为这个人的声望，`ICANN` 以及延伸的多利益相关互联网才生存了下来。\n\
  \n***\n\n多年来，互联网一直是各国政府自由和希望的灯塔，是自由派和保守派共同的自豪点。阿尔·戈尔等民主党人是最早的政治支持者，但像纽特·金里奇这样的右翼共和党人也兴奋不已。1999\
  \ 年，《卫报》发表了英国未来保守党部长埃德·维泽的声明，他写道，“互联网是一个颠覆性的、无政府的、个人主义的领域。它从根本上是一个促进自由、个人选择并将国家官僚机构作用降至最低的媒介。”左翼认为它可以是一种民主化力量，并希望地看着突尼斯和埃及等国的公民利用社交媒体动员反对权威政府。也许意识形态相反的派别将互联网视为实现自身政治目标的手段，这一事实本应是一个警告，表明这种卓越合作内部将产生紧张。但互联网的基础建立在不同动机群体之间的信任之上：军事与学术之间、学术与私营公司之间、商业实体与政府之间，以及国际力量之间。`ICANN`\
  \ 是这种信任可以持续的制度体现，而对 `ICANN` 多利益相关模型的攻击实际上意味着梦想的结束。对于像莱里·斯特里克这样的倡导者来说，他在海外经历了无数次挫折和胜利，这却是一个苦涩的讽刺：到了\
  \ 21 世纪，`ICANN` 在国内面临着最严峻的挑战。\n\n在奥巴马总统第二个任期内，美国社会自 20 世纪 60、70 年代激烈斗争以来日益增长的分歧正以日益增长的恶性溢入政治领域。跨党合作非常稀有。共和党顽固地拒绝在奥巴马的立法议程的任何方面与其合作，有效地阻碍了他的总统工作。该党成员甚至支持一种种族主义阴谋论，认为奥巴马并非出生在美国，因此没有资格当总统。他们暗示他的中间名\
  \ `Hussein`（侯赛因）意味着他的基督教信仰是撒谎，实际上是伊斯兰教信徒。（心忧忡忡的科林·鲍威尔问道：“在这个国家当穆斯林有什么什么问题吗？”）\n\n\
  在斯德登丑闻一年后，奥巴马政府为了平息全球对美国在互联网治理中作用日益增长的动荡，宣布 1998 年承诺的过渡将在他任期结束前最终完成，只要满足一系列条件（包括继续多利益相关者模型）。`ICANN`\
  \ 社区开始工作，在经过多年的努力并与数百人互动后，产出一份最终实现 `ICANN` 原始承诺的过渡计划。这一棘手的共识是在摩洛哥的一次会议上达成的，一位参与者将其称为“互联网独立日”。一位参加摩洛哥会议的记者写道：“美国不再拥有王国的钥匙，但……其他其他人也没有。”温特·瑟夫更简单地称其为“奇迹”。\n\
  \n美国政府将结束与 `ICANN` 的合同，终结其几十年来作为对域名系统拥有最终控制权的实体的角色。相反，`ICANN`——一个自愿、透明的全球自愿者联盟——将持有根区域文件本身的密钥。但在党派恩怨的背景下，互联网治理的统一方法即将终结。\n\
  \n到了奥巴马总统第二个任期，美国社会自 20 世纪 60、70 年代激烈斗争以来日益增长的分歧正以日益增长的恶性进入政治领域。跨党合作非常罕。共和党顽固地拒绝在奥巴马的立法议程的任何方面与其合作，有效地阻碍了他的总统工作。该党成员甚至支持一种种族主义阴谋论，认为奥巴马并非出生在美国，因此没有资格当总统。他们暗示他的中间名\
  \ `Hussein`（侯赛因）意味着他的基督教信仰是撒谎，实际上是伊斯兰教信徒。（心忧忡忡的科林·鲍威尔问道：“在这个国家当穆斯林有什么什么问题吗？”）\n\n\
  在斯德登丑闻一年后，奥巴马政府为了平息全球对美国在互联网治理中作用日益增长的动荡，宣布 1998 年承诺的过渡将在他任期结束前最终完成，只要满足一系列条件（包括继续多利益相关者模型）。`ICANN`\
  \ 社区开始工作，在经过多年的努力并与数百人互动后，产出一份最终实现 `ICANN` 原始承诺的过渡计划。这一棘手的共识是在摩洛哥的一次会议上达成的，一位参与者将其称为“互联网独立日”。一位参加摩洛哥会议的记者写道：“美国不再拥有王国的钥匙，但……其他其他人也没有。”温特·瑟夫更简单地称其为“奇迹”。\n\
  \n美国政府将结束与 `ICANN` 的合同，终结其几十年来作为对域名系统拥有最终控制权的实体的角色。相反，`ICANN`——一个自愿、透明的全球自愿者联盟——将持有根区域文件本身的密钥。但在党派恩怨的背景下，互联网治理的统一方法即将终结。现在，除了每个大陆的外国力量之外，美国政客也必须被游说。\n\
  \n到 2016 年 9 月，商务部与 `ICANN` 的合同仅剩几周就要到期。过渡计划需要完成，而且要快。但共和党参议员泰德·克鲁兹在失败获得政党总统提名后，试图阻止它，称其为奥巴马“交出互联网”的计划以及“对我们自由的异常威胁”。在过渡发生前\
  \ 16 天，克鲁兹在参议院举行了一场题为“保护互联网自由：结束美国监管互联网的影响”的听证会。斯特里克是第一个作证的人。\n\n\n\n克鲁斯（Cruz）利用听证会表达了他认为奥巴马政府的行为将对自由造成的严峻预警。他宣布，互联网是“历史上向世界释放的最具革命性的力量之一”，它的存在归功于“美国人不可思议的创造力以及美国纳税人的资金支持”。尽管政府在互联网早期起到了开创性作用，但他避免了对政府给予任何赞扬，而是评论了“自由与慷慨的精神”，他声称，这种精神引导美国人为了“全人类的利益”而使互联网可用。克鲁斯描绘了一个由良性的美国保护的自由且开放的互联网形象。“在美国的守护下……互联网已成为真正的自由之绿洲。”他自豪地微笑着，随后突然改变了语气。他警告说，奥巴马政府有一个计划将互联网交给一个官僚化的、技术治型的全球公司，该公司受到中国、伊朗和俄罗斯的有害影响。他断言\
  \ `ICANN` “不是民主的”，并指出该组织需要与中国等势力接洽以获得合法性。克鲁斯警告说，这将导致互联网受到中国政府过度干预，并标志着在线自由言论第一修正案保护的终结。克鲁斯还认为，如果没有美国政府的监管，`ICANN`\
  \ 将赋予美国科技公司过大的审查权力——像 Facebook 这样的公司，他指责其歧视保守观点。这并非事实：政府或 `ICANN` 的角色与网络内容毫无关系。但克鲁斯描绘了一幅未来图景，在那里，互联网将走上保守右翼最害怕的两个“魔鬼”的道路：美国大学——那些软弱的学生抱怨“微侵犯”的大学；以及禁止“仇恨言论”的、带有审查倾向的自由派欧洲国家。\n\
  \n斯特里克林（Strickling）试图夺回叙事主权，并为最初促使 `ICANN` 诞生的理想重新夺回全球网络。“我今天来这里是为了为自由作证，”他说，“也为言论自由和公民权利作证。”将美国作为顶级域名管理者的角色转移给全球社区的计划，是“维护互联网稳定、安全和开放性”的唯一途径。与其延续目前的安排，“实际上可能导致我们想要维护的互联网自由的丧失”，因为这将为敌对政府提供所需的借口，让他们指责美国两面い一套，并退出这一非凡的全球共识——毕竟这完全是自愿的。\n\
  \n斯特里克林试图提醒那些往往持敌意的共和党参议员，到目前为止，这一转型计划一直受到跨党的支持。他重申了世界对美国的信任，以及如果他们现在违背承诺将造成的损害。为了证明他的立场得到了跨党派的支持，他引用了一位退休的参谋总长部主席、乔治·W·布什的前任国土安全部长，以及保守派智库的支持。最后，他发出了恳求。“主席先生和小组的成员们，我敦促你们：不要通过阻止这一转型来给俄罗斯和其他威权国家送上礼物。请对私营部门以及美国和全球企业、技术专家和公民社会的工作的信任，他们提供了一份经过思考的共识计划。”但克鲁斯和共和党人没有心情达成共识，也不愿意信任专家。作为该国政治变得如此敌怨的迹，克鲁斯选择回应，声称斯特里克林可能利用其机构的资金进行转型准备工作而违反了联邦法。这位德克萨斯州参员警告这位公职人员，其可能面临最高两年的监禁。\n\
  \n作为过去二十年权力从政府向私营企业转移的大趋势象征，可能是商界最终扭转了天平。像 `Google`、`Cisco`、`Verizon`、`AT&T` 和 `Comcast`\
  \ 这样强大的跨国公司支持这一多利益相关者提案，因为他们知道结束美国对互联网根系统的控制是维护其业务模式所依赖的全球互联网的唯一途径。斯特里克林度过了与克鲁斯的交锋，计划继续进行，`ICANN`\
  \ 生存了下来。\n\n***\n\n这种安排仍然没有法律依据，仍然没有加强 `ICANN` 角色的条约。中国和俄罗斯仍然可以起身离开，尽管这现在看起来不太可能了。通过巧妙的外交，奥巴马政府和像拉里·斯特里克林这样的官员能够移除美国在\
  \ `ICANN` 中特权角色的“避雷针”，并确保该机构的存活。它现在已成功运行了二十五年，在其关键但有限的角色中已稳立地位。克鲁斯参议员所想象的恐怖并未发生。\n\
  \n当今互联网最棘手和最紧迫的问题仍在 `ICANN` 的职责范围之外，而且这是设计使然。谈判充满了变数，奖金太太大，不冒风险完全颠覆这种安排。然而，`ICANN`\
  \ 代表了我们所拥的最接近全球核心底层互联网基础设施的监管框架。这种基础设施可能是有限的，但它仍然是强大的。`ICANN` 是多利益相关者治理模式最大且最重要的证明，但更重要的是，它展示了监管创新如何让社会适应技术变化，以及非立法机构如何在官方方法失败或陷入官僚主义时采取行动将各国团结在一起。“`ICANN`\
  \ 不这样评价自己，”贝基·伯尔（Becky Burr）反思道，“但他们实际上是互联网的监管框架。”\n\n从事后看来来看，值得追问 `ICANN` 最终是否是该框架的正确模型。伯尔本人认为她和团队在早期是“天真的”的，并且“犯了错误”，没有对一个包含隐私和安全等问题的更全面的互联网框架进行更深层次的思考。埃斯瑟·迪森（Esther\
  \ Dyson）曾表示，她希望能够能够留出空间考虑日常互联网用户，而不是主导其议程的企业、法律和政府问题。其他人继续批评 `ICANN` 基于共识的决策速度太慢。但透明度、开放性和基于信任的共识是需要谨慎和细心对待的价值。今天的\
  \ `ICANN` 远非早期互联网自由主义者、黑客和创业者所倡导的快节奏颠覆。在 90 年代那个疯狂狂热的繁华小镇上，个人主义和去监管化盛行，缓慢和建立共识是完全不受欢迎的。但在\
  \ 20 年代全球动荡的下，这些价值观似乎比以往任何时候都更需要。\n\n在英国人类胚胎学监管的回下，转型去除了技术中的一些政治色彩。域名系统不再是一个重大的地缘政治避雷针，这是一个成功的标志。“从任何角度来看，它都不是一个完美的组织，”2000\
  \ 年至 2007 年担任董事会主席的证书（Cerf）说道。但他仍然“为 `ICANN` 成功生存下来感到自豪”，并认为改进的机会可以且确实存在。它可能是缓慢且官僚的，它可能仍然有利于那些有更多时间和资源可以投入的“意愿联盟”，但至少到目前，它继续维持着全球互联网之梦。\n\
  \n\n\n\n# 引言\n\nICANN 作为一个为了互联网社区并由其社区组成的全球机构，其理念诞生于对互联网所能交付的乐观与信任的背景之下。它是对一个明确困局的回答：一种跨越国界的无形技术应当如何被最佳治理？多利益相关者的辩论、妥协和共识就是答案，尽管它存在许多缺陷，但今天依然如此。然而，必须承认的是，人工智能正在一个信任破裂的环境中构建——这种破存在公民与其政府之间、政府与实力公司之间，以及自由民主与威权主义的政治意识形态之间。但\
  \ ICANN 为我们提供了一个教训，只要我们选择听取它。在人工智能领域，没有直接的类比，没有什么能像根区域文件或 `DNS` 那样具体。但它向我们展示了如何利用参与性、代表性和协商性的政府工具，来判断人工智能赋能技术的可接受限度。即使在国际层面，共识也是可能的。\n\
  \n但在 ICANN 几近分裂的故事中，还有一个同样重要的教训。由我们最高理想驱动的宏伟愿景固然重要，但如果我们想向世界投射这些理想的价值，我们自己必须坚持这些理想。肯尼迪总统对太空谈判和平的追求激发了人们对美国和西方自由、民主理念的信仰。布什政府在\
  \ 9/11 袭击后寻求的报复损害了这些价值观在世界舞台上的，尤其是政府通过大规模监控对开放互联网的滥用。拜登总统的国家安全顾问杰克·苏利文（Jake Sullivan）曾提到数字革命的“第二波浪”，即\
  \ 20 世纪 90 年互联网早期自由化承诺后席卷而来的一场“威权反革命”。82 诚然，从中国到土耳其，反民主政府确实找到了压制在线自由的方法。但是，在避免虚假等同的同时，重要的是记住，西方自身的行为也导致了信任崩溃，并威胁到了互联网的结构。\n\
  \n最值得关注的是，通过质疑在线加密的重要性和有效性（这是一个安全成功案例，且是由 `NSA` 和 `GCHQ` 自身的行动催化的），当今的政治家并没有践行他们宣榜的理想。更强大的加密可能会让那些试图保护我们免受犯罪和恐怖主义威胁的人工作更具挑战。但答案不能是以牺牲我们自身的安全以及带给我们这么多数字世界的安全为代价。\n\
  \n***\n\n# 监控与虚假信息的代价\n\n在 9/11 恐怖袭击后，对收集数据和监控公民的极度痴迷中，我们错过了一些东西，也失去了一些。首先，在对政府和公司通过监控来“掌控互联网”的关注中，大多数本该关注威胁的人似乎遗漏了在线虚假信息带来的威胁。俄罗斯的\
  \ `Internet Research Agency`（俗称“水军农场”）建立于 2013 年，其明确意图是散布不和，根据一份内部文件，旨在煽动“对[政治]候选人及整个[美国]政治体系的不信任”。83\
  \ 那场运动的有效性很难衡量。但显然，没有人做好充分准备。\n\n例如，马克·扎克伯格（`Mark Zuckerberg`）在 2016 年曾认为 `Facebook`\
  \ 上的虚假故事和账号对美国选举产生任何影响的想法“简直是疯狂”，随后表达了悔意。在英国，根据英国议会`情报与安全委员会`的报告，政府未能调查俄罗斯是否曾试图干预公投。[[85]](#part0019.xhtml#a2E2)\
  \ 奥巴马总统在离职后，于 2022 年访问硅谷并发表了演讲，指出“民主制度削弱的主要原因之一，是我们交流和消费信息的方式发生了深刻变化”。86\n\n\n\n\
  \n\n9/11 袭击事件的策划者奥萨马·本·拉丁登于 2011 年被美国政府发现并击杀。在回忆录中反思这一消息公布后他经历的支持与合作激增，奥巴马总统深感遗憾。“我发现自己在想象，如果我们能够团结国家，让我们的政府在教育我们的孩子或安置无家归者方面，投入与抓捕本·拉丁登同等水平的专业知识和决心，那么美国会变成什么样；如果我们能将同样的坚持和资源用于减少贫困或减少温室气体排放……情况又会如何……”\
  \ 但他知道，自己会被斥为一个乌托主义的理想主义者。相反，“我们已经无法想象除了阻止袭击和击败外部敌人之外还能围绕什么来团结国家，这一事实被我衡量为我的任期与我的目标有多差距，以及我还有多少工作要做完。”89\n\
  \n如今的许多 AI 社区也有类似的乌托主义观念和高尚理想。这些应该受到赞赏和鼓励。但到目前为止，很少有让广大大众能够相信或信任的、具有原则性的立场和鼓舞性的\
  \ AI 应用案例。我们将通过自己的行为接受评判。仍有许多工作要做。\n\n[*]](#part0016.xhtml#a243) 2023 年，在查尔斯三世国王加冕典上，伦敦大都会警察宣布，他们将把实时面部识别作为首都安保行动的一部分。该行动引发了争议，因为多位提前与伦敦警方协调并达成抗议协议的反君主活动人士被捕，警方随后对此表示了歉。尽管实时面部识别并非逮捕的原因，但在执法与审查之间微妙平衡上所犯的错误表明了其中的利害关涉及有多高。\n\
  \n† 斯诺登是一个争议人物，既受赞誉也受诋毁。对某些人来说，他是有原则的举报者；对另一些人来说，他是国家的叛徒。他仍面临美国的引渡令，美国指控他违反了《间谍法》，他居住在俄罗斯，并在那里获得了公民身份。\n\
  \n‡ 这种社交媒体平台的内容审核本质上不利于保守观点的叙述在特朗普总统时期变得广为，并在很大程度上导致了埃隆·马斯克以“言论自由”的名义收购了 Twitter。\n\
  \n# 结论\n\n# 历史的教训\n\n![一组学生抗议的照片，他们手里拿着反对算法标语的标牌。](img/image_rsrc2XB.jpg)\n\n2020\
  \ 年 8 月 16 日，英国伦敦，学校考试抗议活动。\n\nMatthew Chattle/Shutterstock\n\n## 十字路口\n\n1964 年冬天，马丁·路德··金博士在获得诺贝尔和平奖的第二天，在奥斯陆大学发表了一场演讲。当时他仅三十五岁，是历史上首次获得该奖项的最年轻的人，奖金包括超过五万万美元的现金。金博士将奖金捐回给了他所受荣誉的使命——一场远未结束的民权斗争。但尽管他在前一天的正式就辞中讲述了那场战斗中的故事——抵制和静坐、咆哮的恶狗和高压水龙——但他开始演讲时对其中的利害关系发表了评论。\n\
  \n或许没有比诺贝尔奖得主更合适来考虑科学技术对社会的影响的人了，因为他利用这一平台发出了警告：“当科学力量超越道德力量时，我们得到的是制导导弹和误入的人。”3\n\
  \n对于金来说，追求科学是一项高尚的行为，但绝不是中立的。他理解，和大多数事情一样，科学是通过一系列个人和社会选择进步的，并深受时代文化和价值观的影响。他理解，技术本质上是一项深刻的人类事业，为了有目的地地前进，科学不能仅仅是目的本身；它还必须提升并鼓舞人心。\n\
  \n今天的 AI 正处于一个十字路口。作为一项新技术，它也将被注入其创造者的价值观和假设，并由社会选择施加的限制所定义。美国工业，特别是位于西海岸的大型科技公司，目前在\
  \ AI 投资和开发方面领先 4，这意味着许多关键决策将由一个相对小且封闭的社区做出，而他们对社会其他部分几乎不负责。要让 AI 上正确的道路，需要远超硅谷和科技行业的社区投入，以及拥有纯技术领域之外技能的个人参与。\n\
  \n\n\n\n\n英国沃诺克委员会（Warnock Commission）之后，其生育研究和产业的成功说明了，通过全面限制某些技术方面来“划沙为界”，实际上可以驱动创新与增长。“全面”在这里具有双重含义：这些界限可能必须是分明的，即便不整齐，但让它们易于理解也同样重要。玛丽·沃诺克的“14\
  \ 天规则”可能会激怒理性主义者，他们可以理成章地声称这个数字是任意的，也可以是十五、十六天或其他任何其他天数。但它简单易懂，因此很容易展示该规则如何兼顾并体现了本身并不总是理性的社会准则。\n\
  \n在 AI 政策制定方面，为 AI 设定这些限制方面已经取得了一些重要进展。例如，在英国，政府提出了一项由一系列交叉原则引导的监管提案，其中包括承诺保护人们了解自动化决策如何做出以及为何做出的权利。在美国，在隆德拉·尼尔森（Alondra\
  \ Nelson）博士领导的白宫科学与技术政策办公室发布了《AI 权利法案蓝图》，概述了使用 AI 的详细伦理原则——从隐私权到免受歧视的权利。拜登总统还从开发\
  \ `LLMs` 的最大公司获得了一系列有限的自愿安全承诺，例如安全测试以及确保明确内容是否由生成式 AI 程序人工创建的 la 机制。这些倡议是辩论中受欢迎的贡献，表明政客和政策制定者愿意提供监管，以保护我们免受\
  \ AI 最糟糕方面的影响。然而，沃诺克委员会的教训表明，我们才刚刚开始考虑精确地在何处必须划定界限，以便在鼓励技术发展的同时，建立并维护公众信任。这些界限最终需要变得清晰得多。\n\
  \n例如，欧盟的《AI 法案》（`AI Act`）开始勾勒未来全面监管必须考虑的一些最明显的违规行为。它识别了具有“不可接受风险”的 AI 用途，这些用途必须被禁止，包括\
  \ AI 操纵的“深度伪造”（deepfakes）。此类内容已被恶意用于通过报复性色情片恐扰妇女，并传播虚假信息，例如乌克兰战争爆发初出现的泽连斯基总统视频，该视频声称他呼吁公民向俄罗斯入侵投降。5\
  \ 欧盟立法可能不是每个国家恰当的模型，但它至少在某些界限上是明确且易于理解的。\n\n任何政府或组织都可以从沃诺克委员会寻求指引，引入各种专家试图对这些界限应设在哪里达成共识，同时纳入公众参与和代表性，以确保广泛的观点被听取，特别是那些最可能受影响的人的观点。一个涵盖所有\
  \ AI 的广泛委员会将是难以运作的，但一个关注狭窄问题的委员会——特别是在福利或健康等特定公共服务中自动化决策的使用，或在警察执法中使用实时人脸识别——是可行的，并可能在某些方面找到解决方案，即划定一条更清晰的界限可以为公司提供创新所需的法律信心，让社会获得道德原则受到尊重和肯定的宽慰认知。至关重要的是，英国沃诺克委员会和体外受精（IVF）治疗的经验表明，监管并不需要阻碍行业增长。\n\
  \n## 目的\n\n遗憾的是，我们必须承认并接受人性的一些阴暗面，如贪婪、狭隘和对权力的欲望，将不可避免地塑造 AI 的发展和部署，正如它们已经塑造了其他类型的技术一样。但仅仅满足于旨在缓解这些滥用行为的监管是不够的。要求\
  \ AI 有一个积极的愿景并为其架构赋予形状和目的，也是公平的。滴漏式创新并不总是奏效，我们不应该坐等并希望几家科技公司构建他们自己的 AI 愿景会自动提升其他所有人。如果这些\
  \ AI 系统要让最脆弱的群体受益，或真正推进克服人类挑战的斗争，那么这些系统就需要一个目标和一个愿景。在 20 世纪 90 年代戈尔（Gore）曾希望不受监管的互联网能实现他对于确保公平接入并优先考虑学校和图书馆的梦想。相反，放弃国家研究网络而转向纯商业化的互联网，导致了少数极其成功的企业繁荣，留下了那些缺乏接入、资本和知识的人。\n\
  \n目前，只有少数公司拥有训练大型 AI 模型所需的人才和计算能力的财务资源。\n\n\n\n\n显而易见，缺乏这种切实、积极的愿景是导致如今人们对 AI 普遍产生恐惧的原因之一。如果你财务独立且精通技术，很容易对纯粹的科学成就感到兴奋和乐观。但在这些群体之外，人们则极可能对这一切的意义产生困惑和恐慌。人们并不愚蠢；他们能察觉到变革正在到来。告诉他们不要担心，或者指责他们担心是愚蠢（因为一切最终都会好起来，善终将大于恶），这些都是毫无意义的。同样，面对“超级智能”生物时抛出人类注定毁灭的恐怖幽灵，仅仅表明了对“赢家和输家”这一概念的被动接受。\n\
  \n相反，任何想要构建 AI 驱动的未来的人都应该从一个令人兴奋的愿景开始——这种愿景植根于切实的公共利益以及人权价值观——展示他们想要交付什么，以及为什么这对整个世界是有益的。如果你因为不知道未来应该是什么样而无法做到这一点，那么也许你不应该坚定地向它迈进。\n\
  \n## 信任\n\n在某些技术自由主义圈中，某些利益集团如今流行一种流行且简单的方式，认为“政府”在某种程度上是“创新”的反立面。例如，影响巨大的风险投资人保罗·格拉姆（Paul\
  \ Graham）在 2023 年断言：“创新不是通过寻求创新发生的。它是通过尝试构建或改进某些特定事物发生的。这就是为什么官僚和政治家无论多么想做也无法促成创新。他们不是建设者。”8\
  \ 任何在科技行业花费过时间（特别是在硅谷）的人都知道这是一种普遍的情绪。无论是出于天真还是傲慢，在当今科技行业中，认为政府不理解、行动太慢且没有发挥作用已比常态更常见。\n\
  \n但本书中的例子充满了证据，证明民主参与在技术领域确实发挥作用。在英国，撒切尔政府的成员致力于为蓬勃发展的生命科学部门创造条件。戈尔（Gore）的官员不知疲地努力保护和维护早期互联网的开放特性，并在\
  \ `ICANN` 上取得了了部分成功。拉里·斯特里克林（Larry Strickling）和他的团队在国内和国际上开展外交活动，以保持梦想，通过来自互联网早期理想主义的集体治理来维护共识原则。在理想情况下，政府对技术发展的干预并不是党派性的。在\
  \ `ICANN` 和 `HFEA` 的案例中，将这些问题移出政治领域并交给信任的专家的决定在不同程度上成功地消除了争论中的火药。这本书在某些方面是我对民主国家下艰辛且通常不显色彩的政策制定世界的情书。我自己的经历告诉我，渐进式的改进来自于对这些治理过程的深度参与，而不是试图完全忽略它们。\n\
  \n我们还可以通过确保开发新 AI 产品的团队从一开始就具有多样性来建立信任。当今 AI 行业缺乏多样性，不仅体现在性别和种族上，还体现在社会经济和地理，这种同质化渗透到了技术之中：对于深色皮肤人群无效的人脸识别产品；忽视全球南方语言的翻译程序。9\
  \ 使用他人的艺术创作来训练生成模型，而几乎不考虑这些创作者的生计。在当前的 AI 文化中，甚至“智能”的概念本身都是扭曲的。计算机科学和工程技能被认为是“技术性的”，因此是有价值的，而情感智能却被严重折扣。\n\
  \n幸运的是，AI 文化正在变得多样化，尽管很缓慢。例如，沙基尔·穆哈默德（Shakir Mohamed）博士是一个新 AI 先锋社区的一部分，他打破了模式，热情地致力于一个受其背景、价值观和经验启发的\
  \ AI 愿景。穆哈默德出生种族隔离时期的南非约翰内斯堡，在曼德拉传播彩虹国愿景期间长大，穆哈默德被教导认为对社区负有责任。“当你成长时（在那个时代的南非），你很清楚，”穆哈默德告诉我，“你在这里是为了承担一项变革的使命，你在这里是为了创造一种转型，你工作的一部分部分将是发起一场运动并将其推进。”结果，穆哈默德对自己有一个预期：“我每三或四年就会改变我所在的领域。”\n\
  \n对于穆哈默德来说，这已成为他扩展 AI 社区以及 AI 本身的个人使命。与另一位南非 AI 研究员乌尔里希·帕凯（Ulrich Paquet）一起，穆哈默德在\
  \ 2016 年创立了 `Deep Learning Indaba` 组织，使命是加强非洲的 AI 能力，非洲在技术 AI 社区中代表性不足，因此经常被排除在关于\
  \ AI 应该如何治理的对话之外。该组织基于一系列年度会议（`Indaba` 是祖鲁语中意为聚会或会议的词），帮助了非洲 AI 研究人员数量的增长，吸引了来自\
  \ `Google` 和 `Apple` 等科技巨头的资助，并关注了那里 AI 发展的潜力。\n\n但可能重要的是，`Deep Learning Indaba`\
  \ 向我们展示了目标驱动的、和平的 AI 可以通过咨询受影响的社区来构建，包括他们在对最终构建什么和不构建什么的决策中的声音。`Indaba` 的灵感源自 `abantu`（意为人）和\
  \ `masakhane`（大致译为“共同建设”）的概念。“我们从一开始就提出非常不同的问题，”穆哈默德说。这个想法是“塑造一个与我们所继承的世界不同的世界。一个感知人的价值、他们的知识、他们的文化多样性并能为我们自己的[想法]补充的世界。”\
  \ Deep Learning Indaba 接受，只有通过与历史互动，我们才可能拥有塑造未来所需的远见。在更具全球性的 AI 社区的前景中，存在着希望和乐观。正如穆哈默德博士解释的那样，“社区、国家、人们都意识到，他们有机会建立一种新的能力，以与他们生活真正相关的方式获得所有权。”10\n\
  \n## 参与\n\n“你相信我吗，你喜欢我吗，你信任我吗？”聊天机器人 Sydney 向凯文·罗斯（Kevin Roose）反复提出的问题。Sydney 并没有自己的思想。内部没有意识在体验对肯定的需求。但考虑到\
  \ Sydney 是基于所有可用的人类语言训练的，这些问题正是我们今天对 AI 提出的问题并非巧合。我们相信它吗？喜欢它吗？信任它吗？我们需要什么才能说服自己？\n\
  \n\n\n\n这一过程中必不可少的一部分是普通公民要发出自己的声音。因为政府和公司对 AI 的反应、他们构建了什么以及他们构建时遵循的规则，很大程度上取决于他们从公民和客户那里听到了什么。一旦动起来，公众压力和民主制度将对\
  \ AI 的愿景和目的产生巨大影响。在理想情况下，它会是什么呢？我们必须选择是希望它是和平的，选择是希望它支持人类的健康与繁荣，还是制造分歧并加剧不平等。塑造这项技术的界限在哪里，决定将由人类做出。技术是由人创造的，不能完全任由那些构建\
  \ AI 的人来单独设计其未来。代价太高了。\n\n书中的例子证明了马丁·路德·金博士（Dr. Martin Luther King）直觉上理解到的观点：科学技术深受其发展所在社会和文化的影响和塑造。接受这些信息、拥抱这些信息，使我们更好地理解今天的价值观和文化如何引导\
  \ AI 的发展。只有当我们优先考虑多样化的参与，将广泛的声音引入此类重大的决策中时，我们才能有效地参与整个社会。\n\n***\n\n一个警告：那些在保持对话范围狭窄方面拥有既得利益的人会试图通过声称技术难度太大而难以理解来阻止他人加入辩论。在\
  \ 2022 年接受《金融时报》采访时，全球提供 AI 监控技术的公司 `Palantir` 的首席执行官在采访他的记者时评论道，“只有极少数的技术专家真正理解所涉及的问题”，结果就是“极少数选民、政治家或记者……不知道如何判断在这个快速扩张的行业中什么是‘安全’的。”11\n\
  \n但这根本不是事实。你不需要非要成为 AI 专家也能对 AI 拥有有见地的见解。事实上，非 AI 专家的人在与 AI 生活和工作方面，可能比构建 AI 的人更有经验。那些受自动化程序决定他们是否能获得急需福利的人；在工作中直接经历过被持续监控的送货员；与自称知道他们何时在作弊的“智能”考试软件交互的学生；在应对预测性执法的低收入社区。这些人可以告诉我们关于我们的未来、关于我们自己，以及我们正在建立什么样的社会。他们比\
  \ AI 公司高层受金钱和权力的保护的执行官更清楚风险在哪里。\n\n请记住，玛丽·沃诺（Mary Warnock）并不是胚胎学专家，但她通过自己的伦理训练、审查困难政策问题的背景以及对社会凝聚力的敏感性，创造了一种政治共识，保护了科学创新并确保其能促进人类的健康和福祉。这一过程是由民主政府设计的，旨在回答选民对人类胚胎研究可能如何影响他们以及人类意味着什么的担忧，它听取了来自不同学科的专家以及普通公民的意见。当时科学界很大程度上反对外部影响，但后来对这种允许他们工作蓬勃发展的严格而宽松的制度感激不尽。在现在的英国，与没有发生此类审议过程的美国形成鲜明对比，该问题不再被视为争议。\n\
  \n在较小规模上，英国已经通过`数据伦理与创新中心 (Centre for Data Ethics and Innovation, CDEI))` 对公众对 AI\
  \ 的预期进行了研究。一项关注透明性、公平性和问责核心原则的研究发现，如果在招聘实践等高风险背景下，涉及的标准是透明的，并且有手段对决策提出挑战或获取如何得出决策的反馈，代表性样本对\
  \ AI 决策会感到更舒适。`CDEI` 的发现随后被用于影响英国政府提出的 AI 监管方法，该方法将透明度和问责作为两个关键原则之一。12 然而，`CDEI`\
  \ 研究的样本量小，随着 AI 的大量进步，纳入更广泛的观点将至关重要。\n\n一些公司已经意识到 AI 中审议性决策的重要性。例如，`OpenAI` 和 `Meta`\
  \ 都承诺更深入地参与他们的 AI 程序中，`Meta` 启动了“社区论坛”来衡量对新技术的反馈，而 `OpenAI` 则提供了资金赠款，用于资助“在法律范围内决定\
  \ AI 系统应该遵循什么规则”的实验。13 这些构建强大系统的人采取此类积极倡议值得赞赏，尽管它们不能（也不应该）取代民主进程。\n\n***\n\n然而，参与关于\
  \ AI 监管的讨论不仅仅是等待政府或科技公司的召唤。只有当更多人积极参与塑造自己的世界并捍卫自己的权利时，我们才能获得所需的多元化投入。如何做？从询问你的当选代表他们对刑事司法系统、政府福利决策、教育中的\
  \ AI 有何看法开始。强制他们自我教育并向选民负责。你认同人脸识别被用于在学校监控你的孩子吗？如果没有，请发声。你觉得 AI 可能追踪你在家里工作的情况是公平的吗？如果没有，请行出你的声音。如果你是工会成员，你知道他们关于\
  \ AI 如何在工作场所被使用的政策吗？你不需要等到人脸识别算法误判你时才要求地方官员有一份处理 AI 错误的计划。或者也许你并不是那么担心，而是对 AI 如何改变我们的生活感到兴奋，并希望看到更多、更快速地部署它。民主进程需要各方的投入。为你所信的而发活动。\n\
  \n学生是那些已经在确保自己的声音被听听到的人之一。在疫情期间，英国的高中生聚集在教育部外高喊“去 TM 算法！”呼应了 20 世纪 60 年代美国大学生反对人性化的抗议。由于在封锁期间无法考试，官员决定不根据学生的实际表现进行评分，而是让算法来评判他们两年的努力。这种方法并不复杂：考虑到学生之前的考试成绩、老师对他们成绩的预测以及学校三年前的历史成绩分布，算法产生并分配了分数。近\
  \ 40% 的学生收到的分数低于他们预期的分数，很容易看出缺陷算法是如何产生不公平结果的。除了其他问题外，算法的设计方式使得低表现学校的天才极不可能获得高分。如果你的学校的历史数据很少高分，那么即使对于优秀的候选人，算法几乎不可能授予这些分数。结果是一场国家性丑闻、学生抗议、教育部一名高级官员辞职，以及政府的转向，政府决定改用老师预测的成绩。当时的英国首相鲍里斯·约翰逊（Boris\
  \ Johnson）在几周后的一所学校对学生们说：“恐怕，你们的成绩几乎被一个变异算法误导了。”14 但那并不是什么变异。这是一个选择——一个可以做出也可以被撤销的选择。\n\
  \n\n\n\n\n# 房间里的红白蓝大象\n\n房间里的“大象”显然是指美国。这个超级大国的阴影笼罩着 20 世纪的科学、AI 领域，并也因此影响了本书。在“9/11”事件后，由于相关反应破坏了国际对该国家自我约束能力的信任与尊重，互联网几乎几为分崩。在今天，世界领先的民主超级大国通过自身对\
  \ AI 的实施和治理来树立榜样同样至关重要。它的经济实力、政治威望和技术力量使美国成为 AI 未来的关键玩家。美国不仅是大多数 AI 资金和开发发生地，还拥有制约潜在对手的必要杠杆。例如，拜登总统禁止向中国出售某些尖端半导体技术，这将严重限制中国科技公司与其美国同类竞争的能力。这些日益强大且高效的微芯片是近期\
  \ AI 进展爆炸式增长的原因，如果无法获得这些芯片，中国要上西方的进步将困难得多。\n\n自《联合国外层空间条约》签署以来已五十多年，这是一项巨大的外交成就，如果没有美国大胆的政治领导力，这项成就是不可能的。现在，世界再次竞相开发战争技术，这些技术同样可以用来促进和平与统一，但前提是政治家选择培养这种更宏大的信息，即便是在兼顾自身利益的同时。美国拥有另一个巨大的机会，去遏制肆意的军事化，并向世界信号表明它尚未忘记如何领导。\n\
  \n致命性自主武器系统（LAWS）威胁着一种本无需发明的的新战争形式。强大的世界领袖不应等到灾难发生后才采取行动。作为迄今为止领先的 AI 超级大国，美国完全与其他拥有先进\
  \ AI 能力的国家开始有意义的对话。它甚至可以采取单边行动，就像 2022 年副总统卡马拉·哈里斯宣布美国将承诺不进行破坏性的直接升空反卫星导弹测试，寄希望在太空领域建立新的国际规范^15。在一个分裂的世界中，对自由民主模式的斗争变得比以往任何时候都重要，这种领导力可以与重要的不不结盟国家建立尊重和联盟，因为这些国家正试图决定自己的命运是与中俄结盟更好，还是与西方结盟更好。在当前的地缘政治气候下，达成一份全面的联合国条约的机会微乎其微。但联合国大会仍然是一个辩论和讨论的。作为一个没有否决权的非约束性咨询机构，如果由美国领导，通过关于“致命性自主武器系统”的某类决议的机会仍然很高。将美国及其盟友与已经承诺在该问题上合作的拉丁美洲和加勒比国家团结，可以设定议程并开启谈判。这不会快速或容易，但将是里程碑意义的。毕竟，肯尼迪总统正是\
  \ 1963 年在联合国大会上向苏联提出接触，探讨了共同登月的可能性。那么，正如拜登总统所称的，成为“世界的灯塔”，现在采取这样的步骤难道不是更好的方式吗？\n\
  \n在他的回忆录中，音乐家波诺转述了亿万富翁投资者沃伦·巴菲特给他的一些建议。波诺曾为……\n\n## AI 需要你\n\nAI 并不是价值中立的，也不应该是。历史告诉我们，与其拥抱虚假的中立，如今的\
  \ AI 科学家和构建者应该有意识、有目的地地前进。这种目标在意图上应该是和平的，承认其局限性，优先考虑公共利益项目，并植根于社会信任与和谐。\n\n\n\n\n\
  \n我自己的雄心是激励并鼓励所有渴望看到科学能够反映我们人类最优秀特质的人。今天的世界可能感觉与过去的成就相隔遥远。它可能显得更加艰难、更加愤世嫉俗。你可能会发现，很难想象有种领导力能够引领我们穿越未来的风雨。但人类的智慧、激情和抱负正不断改变着我们的世界。记住：拥有希望并没有错，而目光短浅也绝非什么明智。影响并选择那些确保新技术让我们的世界变得更好的价值观，是我们所有人的责任。AI\
  \ 需要我们。\n\nAI 也需要你。\n\n# 致谢\n\n**这本书**是我职业生涯中经验的结晶，因此有许多人需要感谢。首先，最重要的是，要感谢 Diane\
  \ Coyle 和 Ingrid Gnerlich，没有她们，这本书根本不会存在。她们对我工作的信任和相信是我开始动笔写作时所需的动力。Diane，感谢你阅读了无数份草稿，并极有耐心地回答了我的所有问题。Ingrid，在整个项目中，你的智力伙伴关系是如此重要，你对我的信念如此坚定，我将永远感激不尽。\n\
  \n令我并不意外的是，是两位女性鼓励我写下这本书，并且一直一直是这个项目巨大的支持来源。在我的职业生涯中，无论是在政治还是技术领域，一直都是女性在支持和激励着我。我从许多了不起（而且往往被忽视）的女性的慷慨、指导和活力中获益良浅，因此我想利用这个时刻向她们表示感谢。人太多了无法一一点名，但我希望她们知道自己是指谁。政治和技术领域的许多成功（我推测在其他行业也是如此）都是得益于这种支持的，这种支持有时是正式的，但更多时候是非正式的，随着我年龄的增长，我越是能感受到这种支持就越是由发感激。\n\
  \n我想感谢 Amanda Moon 和 Thomas LeBien 她们对这项工作做出的巨大贡献，并感谢普林斯顿大学出版社（Princeton University\
  \ Press）的整个团队，特别是 Whitney Rauenhorst，她如此耐心、贴心地指导我完成了写作和出版的每一个环节。\n\n这本书建立在多年来我阅读并学习的学者们的肩膀之上，特别是\
  \ Jill Lepore 和 Jon Agar，他们迷人的著作在我构思思绪和寻找自我声音时起到了塑造性作用。对于章节中涵盖的每个历史案例，都有许多详尽的著作，我强烈推荐并在参考文献中列出了它们。还必须特别提到\
  \ Douglas Brinkley、Janet Abbate 和 Michael Mulkay，他们自己的工作对我理解这些故事至关重要。\n\n我还非常感谢所有同意接受本书采访的人——Becky\
  \ Burr, Gerry Butts, Steve Crocker, Rebecca Finlay, Angela Kane, Shakir Mohamed——以及他们允许我讲述他们的故事和经历。特别是我特别想感谢\
  \ Larry Strickling，他在多次对话和数许多小时的交流中，对时间的慷慨是无与伦比的。其他的对话也帮助完善了这项工作，特别感谢 Joanne Wheeler、Bleddyn\
  \ Bowen 和 Sarah Franklin 耐心地向我介绍他们的专业领域。关于 Warnock 委员会的章节，玛丽特·撒切基金会（Margaret Thatcher\
  \ Foundation）的档案和团队起了关键作用，而剑桥丘吉尔档案馆（Churchill Archives）的 Andrew Riley 对他的时间和建议也非常慷慨。剑桥大学是我大部分的研究所在地，感谢贝内特公共政策学院（Bennett\
  \ Institute for Public Policy）以及耶稣学院学术论坛（Jesus College Intellectual Forum）和五周年图书馆（Quincentenary\
  \ Library）的团队，他们为我提供了一个可以学习和写作的机构之家。\n\n我在 `DeepMind` 工作期间，产生了通过观察技术历史案例来帮助 AI 开发的灵感萌芽，我想感谢我的老板\
  \ Demis Hassabis 和 Lila Ibrahim，他们鼓励了我的好奇心和长期思考。我感谢他们，也感谢我在 `DeepMind` 的整个团队，他们的才华和努力工作一直促使我深入思考技术对社会的影响。许多人都好心地阅读了早期的草稿。特别感谢\
  \ Shashank，他对时间非常慷慨；感谢 Brittany，她一直让我成为一名更好的作家，并对她的反馈如此细致。我非常感激他们的见解和改进。\n\n# 注释\n\
