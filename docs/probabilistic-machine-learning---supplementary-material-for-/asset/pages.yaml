    # 6.3.3 Estimation of distribution algorithms


    EA methods maintain a population of good candidate solutions, which can be thought
    of as an implicit (nonparametric) density model over states with high fitness.
    [BC95] proposed to “remove the genetics from GAs”, by explicitly learning a probabilistic
    model over the configuration space that puts its mass on high scoring solutions.
    Thay is, the population becomes the set of parameters of a generative model, \(\theta_t\).


    One way to learn such as model is as follows. We start by creating a sample of
    \(K'' > K\) candidate solutions from the current model, \(S_t = \{x_k \sim p(x|\theta_t)\}\).
    We then rank the samples using the fitness function, and then pick the most promising
    subset \(S_t^*\) of size \(K\) using a selection operator (this is known as **truncation
    selection**). Finally, we fit a new probabilistic model \(p(x|\theta_{t+1})\)
    to \(S_t^*\) using maximum likelihood estimation. This is called the **estimation
    of distribution** or **EDA** algorithm (see e.g., [LL02; PSCP06; Hau+11; PHL12;
    Hu+12; San17; Bal17]).


    Note that EDA is equivalent to minimizing the cross-entropy between the empirical
    distribution defined by \(S_t^*\) and the model distribution \(p(x|\theta_{t+1})\).
    Thus EDA is related to the **cross entropy method**, as described in Section 6.3.4,
    although CEM usually assumes the special case where \(p(x|w) = \mathcal{N}(x|\mu,
    \Sigma)\). EDA is also closely related to the EM algorithm, as discussed in [Bro+20].


    As a simple example, suppose the configuration space is bit strings of length
    \(D\), and the fitness function is \(f(x) = \sum_{d=1}^D x_d\), where \(x_d \in
    \{0, 1\}\) (this is called the **one-max** function in the EA literature). A simple
    probabilistic model for this is a fully factored model of the form \(p(x|\theta)
    = \prod_{d=1}^D \text{Ber}(x_d|\theta_d)\). Using this model inside of DBO results
    in a method called univariate marginal distribution algorithm or **UMDA**.


    We can estimate the parameters of the Bernoulli model by setting \(\theta_d\)
    to the fraction of samples in \(S_t^*\) that have bit \(d\) turned on. Alternatively,
    we can incrementally adjust the parameters. The population-based incremental learning
    (**PBIL**) algorithm [BC95] applies this idea to the factored Bernoulli model,
    resulting in the following update:


    ```

    \(\hat{\theta}_{d,t+1} = (1 - \eta_t)\hat{\theta}_{d,t} + \eta_t \bar{\theta}_{d,t}\)
    (6.72)

    ```


    where \(\bar{\theta}_{d,t} = \frac{1}{N_t} \sum_{k=1}^K \mathbb{I}(x_{k,d} = 1)\)
    is the MLE estimated from the \(K = |S_t^*|\) samples generated in the current
    iteration, and \(\eta_t\) is a learning rate.'
