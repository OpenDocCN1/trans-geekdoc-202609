    # 4.1.2.2 Multiple loci


    We get more statistical power if we can measure multiple phenotypes and genotypes.
    In this case, we must model spatial correlation amongst the genes, since genes
    that are close on the genome are likely to be coinherited, since there is less
    likely to be a crossover event between them. We can model this by imposing a two-state
    Markov chain on the switching variables $S$''s, where the probability of switching
    state at locus $j$ is given by $\theta_j = \frac{1}{2}(1 - e^{-2d_j})$, where
    $d_j$ is the distance between loci $j$ and $j+1$. This is called the **recombination
    model**. The resulting DGM for two linked loci in Figure 4.3.'
