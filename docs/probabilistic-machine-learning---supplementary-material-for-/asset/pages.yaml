    # 28.1.6 Variational inference for LDA


    A faster alternative to MCMC is to use variational EM, which we discuss in general
    terms in ??. There are several ways to apply this to LDA, which we discuss in
    the following sections.


    # 28.1.6.1 Sequence version


    In this section, we focus on a version in which we unroll the model, and work
    with a latent variable for each word. Following [BNJ03], we will use a fully factorized
    (mean field) approximation of the form


    ```

    $$q(\mathbf{z}_n, \mathbf{s}_n) = \text{Dir}(\mathbf{z}_n|\tilde{\mathbf{z}}_n)
    \prod_l \text{Cat}(s_{nl}|\tilde{\mathbf{N}}_{nl})$$ (28.20)

    ```


    where $\tilde{\mathbf{z}}_n$ are the variational parameters for the approximate
    posterior over $\mathbf{z}_n$, and $\tilde{\mathbf{N}}_{nl}$ are the variational
    parameters for the approximate posterior over $s_{nl}$. We will follow the usual
    mean field recipe. For $q(s_{nl})$, we use Bayes’ rule, but where we need to take
    expectations over the prior:


    ```

    $$\tilde{N}_{nlk} \propto w_{d,k} \exp(\mathbb{E}[\log z_{nk}])$$ (28.21)

    ```


    where $d = x_{nl}$, and


    ```

    $$\mathbb{E}[\log z_{nk}] = \psi_k(\tilde{\mathbf{z}}_n) \triangleq \Psi(\tilde{z}_{nk})
    - \psi(\sum_{k''} \tilde{z}_{nk''})$$ (28.22)

    ```


    where $\psi$ is the digamma function. The update for $q(\mathbf{z}_n)$ is obtained
    by adding up the expected counts:


    ```

    $$\tilde{z}_{nk} = \alpha_k + \sum_l \tilde{N}_{nlk}$$ (28.23)

    ```


    The M step is obtained by adding up the expected counts and normalizing:


    ```

    $$\hat{w}_{dk} \propto \beta_d + \sum_{n=1}^N \sum_{l=1}^{L_n} \tilde{N}_{nlk}
    \mathbb{I}(x_{nl} = d)$$ (28.24)

    ```


    # 28.1.6.2 Count version


    Note that the E step takes $O((\sum_n L_n) N_w N_z)$ space to store the $\tilde{N}_{nlk}$.
    It is much more space efficient to perform infefence in the mPCA version of the
    model, which works with counts; these only take $O(N N_w N_z)$ space, which is
    a big savings if documents are long. (By contrast, the collapsed Gibbs sampler
    must work explicitly with the $s_{nl}$ variables.)


    Following the discussion in ??, we will work with the variables $\mathbf{z}_n$
    and $\mathbf{N}_n$, where $\mathbf{N}_n = [N_{ndk}]$ is the matrix of counts,
    which can be derived from $\mathbf{s}_{n,1:L_n}$. We will again use a fully factorized
    (mean field) approximation of the form


    ```

    $$q(\mathbf{z}_n, \mathbf{N}_n) = \text{Dir}(\mathbf{z}_n|\tilde{\mathbf{z}}_n)
    \prod_d \mathcal{M}(\mathbf{N}_{nd}|x_{nd}, \tilde{N}_{nd})$$ (28.25)

    ```


    where $x_{nd} = \sum_{l=1}^{L_n} \mathbb{I}(x_{nl} = d)$ is the the total number
    of times token $d$ occurs in document $n$.


    The E step becomes


    ```

    $$\tilde{z}_{nk} = \alpha_k + \sum_d x_{nd} \tilde{N}_{ndk}$$ (28.26)

    ```


    ```

    $$\tilde{N}_{ndk} \propto w_{dk} \exp(\mathbb{E}[\log z_{nk}])$$ (28.27)

    ```'
