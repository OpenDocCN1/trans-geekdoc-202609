    A natural question is whether any of the above algorithms can recover the "true"
    DAG structure \(G\) (up to Markov equivalence), in the limit of infinite data.
    We assume that the data was generated by a distribution \(p\) that is faithful
    to \(G\) (see Section 31.2.1).'
