    \( \mathbb{M}(G) = \text{conv}\{ \mathcal{T}_1(\mathbf{x}), \dots, \mathcal{T}_d(\mathbf{x})
    \} \tag{9.10} \)


    For example, for a 2 node MRF \( X_1 - X_2 \) with binary states, we have


    \( \mathbb{M}(G) = \text{conv}\{ (0, 0, 0), (1, 0, 0), (0, 1, 0), (1, 1, 1) \}
    \tag{9.11} \)


    These are the four black dots in Figure 9.1(a). We see that the convex hull defines
    the same volume as the intersection of half-spaces.


