- pgno: 170
  md: 'The posterior mode (MAP) is known to converge to the MLE, which in turn will
    converge to the true graph \( G \) (up to Markov equivalence), so any exact algorithm
    for Bayesian inference is a consistent estimator. [Chi02] showed that his greedy
    equivalence search method (which is a form of hill climbing in the space of PDAGs)
    is a consistent estimator. Similarly, [SGS00; KB07] showed that the PC is a consistent
    estimator. However, the running time of these algorithms might be exponential
    in the number of nodes. Also, all of these methods assume that all the variables
    are fully observed.


    # 31.2.8 Handling latent variables


    In general, we will not get to observe the values of all the nodes (i.e., the
    complete data assumption does not hold), either because we have missing data,
    and/ or because we have hidden variables. This makes it intractable to compute
    the marginal likelihood of any given graph structure, as we discuss in Section
    31.2.8.1. It also opens up new problems, such as knowing how many hidden variables
    to add to the model, and how to connect them, as we discuss in Section 31.2.8.7.


    # 31.2.8.1 Approximating the marginal likelihood


    If we have hidden or missing variables \(\boldsymbol{h}\), the marginal likelihood
    is given by


    \(p(\mathcal{D}|G) = \int \sum_h p(\mathcal{D}, h|\theta, G)p(\theta|G)d\theta
    = \sum_h \int p(\mathcal{D}, h|\theta, G)p(\theta|G)d\theta \quad (31.33)\)


    In general this is intractable to compute. For example, consider a mixture model,
    where we don''t observe the cluster label. In this case, there are \(K^N\) possible
    completions of the data (assuming we have \(K\) clusters); we can evaluate the
    inner integral for each one of these assignments to \(\boldsymbol{h}\), but we
    cannot afford to evaluate all of the integrals. (Of course, most of these integrals
    will correspond to hypotheses with little posterior support, such as assigning
    single data points to isolated clusters, but we don''t know ahead of time the
    relative weight of these assignments.) Below we mention some faster deterministic
    approximations for the marginal likelihood.


    # 31.2.8.2 BIC approximation


    A simple approximation to the marginal likelihood is to use the BIC score (??),
    which is given by


    \(\text{BIC}(G) \triangleq \log p(\mathcal{D}|\hat{\theta}, G) - \frac{\log N}{2}
    \dim(G) \quad (31.34)\)


    where \(\dim(G)\) is the number of degrees of freedom in the model and \(\hat{\theta}\)
    is the MAP or ML estimate. However, the BIC score often severely underestimates
    the true marginal likelihood [CH97], resulting in it selecting overly simple models.
    We discuss some better approximations below.


    # 31.2.8.3 Cheeseman-Stutz approximation


    We now discuss the Cheeseman-Stutz approximation (CS) to the marginal likelihood
    [CS96]. We first compute a MAP estimate of the parameters \(\hat{\theta}\) (e.g.,
    using EM). Denote the expected sufficient statistics of the data by \(\overline{\mathcal{D}}
    = \overline{\mathcal{D}}(\hat{\theta})\); in the case of discrete variables, we
    just "fill in" the hidden variables with their expectation. We then use the exact
    marginal likelihood equation on this filled-in data:


    \(p(\mathcal{D}|G) \approx p(\overline{\mathcal{D}}|G) = \int p(\overline{\mathcal{D}}|\theta,
    G)p(\theta|G)d\theta \quad (31.35)\)


    However, comparing this to Equation (31.33), we can see that the value will be
    exponentially smaller, since it does not sum over all values of \(\boldsymbol{h}\).
    To correct for this, we first write


    \(\log p(\mathcal{D}|G) = \log p(\overline{\mathcal{D}}|G) + \log p(\mathcal{D}|G)
    - \log p(\overline{\mathcal{D}}|G) \quad (31.36)\)'
