    \tau_s(x_s) - \sum_{x_t} \tau_{ts}(x_t, x_t)$ for each edge \(t \to s\). We can
    now write the Lagrangian as


    ```

    $$

    \mathcal{L}(\boldsymbol{\tau}, \boldsymbol{\lambda}; \boldsymbol{\theta}) \triangleq
    \boldsymbol{\theta}^T \boldsymbol{\tau} + \mathbb{H}_{\text{Bethe}}(\boldsymbol{\tau})
    + \sum_s \lambda_{ss} C_{ss}(\boldsymbol{\tau})

