    (9.12) is linear in \mu, and the constraint set M(G) is convex. The trouble is,
    M(G) in general has a number of facets that is exponential in the number of nodes.


    A standard strategy in combinatorial optimization is to relax the constraints.
    In this case, instead of requiring a probability vector \mu to live in the marginal
    polytope M(G), we allow it to live inside a simpler, convex enclosing set L(G),
    which we define in Section 9.1.3.1. Thus we try to maximize the following upper
    bound on the original objective:


    ```

    \tau^* = \arg\max_{\tau \in \mathbb{L}(G)} \theta^T \tau

    ```


    This is called a linear programming relaxation of the problem. If the solution
    \tau^* is integral, it corresponds to the exact MAP estimate; this will be the
    case when the graph is a tree. In general, \tau^* will be fractional; we can derive
    an approximate MAP estimate by rounding (see [Wer07] for details).


