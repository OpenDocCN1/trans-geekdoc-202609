    # 3.1.1.2 Prior


    In the Bayesian approach, we must specify a prior over unknowns, p(h), as well
    as the likelihood, p(D|h). To see why this is useful, suppose D = {16, 8, 2, 64}.
    Given this data, the concept h'' = “powers of two except 32” is more likely than
    h = “powers of two”, since h'' does not need to explain the coincidence that 32
    is missing from the set of examples. However, the hypothesis h'' = “powers of
    two except 32” seems “conceptually unnatural”. We can capture such intuition by
    assigning low prior probability to unnatural concepts. Of course, your prior might
    be different than mine. This subjective aspect of Bayesian reasoning is a source
    of much controversy, since it means, for example, that a child and a math professor
    will reach different answers.1


    Although the subjectivity of the prior is controversial, it is actually quite
    useful. If you are told the numbers are from some arithmetic rule, then given
    1200, 1500, 900 and 1400, you may think 400 is likely but 1183 is unlikely. But
    if you are told that the numbers are examples of healthy cholesterol levels, you
    would probably think 400 is unlikely and 1183 is likely, since you assume that
    healthy levels lie within some range. Thus we see that the prior is the mechanism
    by which background knowledge can be brought to bear on a problem. Without this,
    rapid learning (i.e., from small samples sizes) is impossible.


    So, what prior should we use? We will init ially consider 30 simple arithmetic
    concepts, such as “even numbers”, “odd numbers”, “prime numbers”, or “numbers
