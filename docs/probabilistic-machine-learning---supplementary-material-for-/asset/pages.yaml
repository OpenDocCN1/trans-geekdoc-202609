  md: 'where \(\mathbb{I}()\) is the indicator function. The corresponding posterior
    predictive distribution becomes


    ```

    \(p(y|\mathcal{D}) \approx \sum_h p(y|h)\mathbb{I}\left(h=\hat{h}\right) = p(y|\hat{h})\)
    (3.8)

    ```


    This is called a **plug-in approximation**, and is very widely used, due to its
    simplicity, as we discuss further in **??**.


    Although the plug-in approximation is simple, it behaves in a qualitatively inferior
    way than the fully Bayesian approach when the dataset is small. In the Bayesian
    approach, we start with broad predictions, and then become more precise in our
    forecasts as we see more data, which makes intuitive sense. For example, given
    \(\mathcal{D} = \{16\}\), there are many hypotheses with non-negligible posterior
    mass, so the predicted support over the integers is broad. However, when we see
    \(\mathcal{D} = \{16, 8, 2, 64\}\), the posterior concentrates its mass on one
    or two specific hypotheses, so the overall predicted support becomes more focused.
    By contrast, the MLE picks the minimal consistent hypothesis, and predicts the
    future using that single model. For example, if we we see \(\mathcal{D} = \{16\}\),
    we compute \(h_{mle}\) to be “all powers of 4” (or the interval hypothesis \(h
    = \{16\}\)), and the resulting plug-in approximation only predicts \(\{4, 16,
    64\}\) as having non-zero probability. This is an example of **overfitting**,
    where we pay too much attention to the specific data that we saw in training,
    and fail to generalise correctly to novel examples. When we observe more data,
    the MLE will be forced to pick a broader hypothesis to explain all the data. For
    example, if we \(\mathcal{D} = \{16, 8, 2, 64\}\), the MLE broadens to become
    “all powers of two”, similar to the Bayesian approach. Thus in the limit of infinite
    data, both approaches converge to the same predictions. However, in the small
    sample regime, the fully Bayesian approach, in which we consider multiple hypotheses,
    will give better (less over confident) predictions.


    # 3.1.2 Learning a continuous concept: the healthy levels game


    The number game involved observing a series of discrete variables, and inferring
    a distribution over another discrete variable from a finite hypothesis space.
    This made the computations particularly simple: we just needed to sum, multiply
    and divide. However, in many applications, the variables that we observe are real-valued
    continuous quantities. More importantly, the unknown parameters are also usually
    continuous, so the hypothesis space becomes (some subset) of \(\mathbb{R}^K\),
    where \(K\) is the number of parameters. This complicates the mathematics, since
    we have to replace sums with integrals. However, the basic ideas are the same.


    We illustrate these ideas by considering another example of concept learning called
    the **healthy levels game**, also due to Tenenbaum. The idea is this: we measure
    two continuous variables, representing the cholesterol and insulin levels of some
    randomly chosen healthy patients. We would like to know what range of values correspond
    to a healthy range. As in the numbers game, the challenge is to learn the concept
    from positive data alone.


    Let our hypothesis space be **axis-parallel rectangles** in the plane, as in Figure
    3.5. This is a classic example which has been widely studied in machine learning
    [Mit97]. It is also a reasonable assumption for the healthy levels game, since
    we know (from prior domain knowledge) that healthy levels of both insulin and
    cholesterol must fall between (unknown) lower and upper bounds. We can represent
    a rectangle hypothesis as \(h = (\ell_1, \ell_2, s_1, s_2)\), where \(\ell_j \in
    (-\infty, \infty)\) are the coordinates (locations) of the lower left corner,
    and \(s_j \in [0, \infty)\) are the lengths of the two sides. Hence the hypothesis
    space is \(\mathcal{H} = \mathbb{R}^2 \times \mathbb{R}_+^2\), where \(\mathbb{R}_{\ge
    0}\) is the set of non-negative reals.


    More complex concepts might require discontinuous regions of space to represent
    them. Alternatively, we might want to use *latent* rectangular regions to represent
    more complex, high dimensional concepts [Li+19]. The question of where the hypothesis
    space comes from is a very interesting one, but is beyond the scope of this chapter.
    (One approach is to use hierarchical Bayesian models, as discussed in [Ten+11].)


    # 3.1.2.1 Likelihood


    We assume points are sampled uniformly at random from the support of the rectangle.
    To simplify the analysis, let us first consider the case of one-dimensional “rectangles”,
    i.e., lines. In the 1d case, the likelihood'
