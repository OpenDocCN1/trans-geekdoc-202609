    # 15.3.3 Poisson regression


    Let us revisit the Berkeley admissions example from Section 15.3 using Poisson
    regression. We use a simplified form of the model, in which we just model the
    outcome counts without using any features, such as gender or department. That
    is, the model has the form


    ```

    y_{j,n} ~ Poi(λ_j)                                      (15.80)

    λ_j = e^{α_j}                                          (15.81)

    α_j ~ N(0, 1.5)                                        (15.82)

    ```


    for j = 1 : 2 and n = 1 : 12. Let λ̄_i = E[λ_i|D], where D_1 = y_{1,1:N} is the
