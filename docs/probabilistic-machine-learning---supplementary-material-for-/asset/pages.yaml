    # 31.2.8.4 Variational Bayes EM


    An even more accurate approach is to use the variational Bayes EM algorithm. Recall
    from ?? that the key idea is to make the following factorization assumption:


    ```

    p(θ, z₁:N | D) ≈ q(θ)q(z) = q(θ) ∏ᵢ q(zᵢ) (31.40)

    ```


    where zᵢ are the hidden variables in case i. In the E step, we update the q(zᵢ),
    and in the M step, we update q(θ). The corresponding variational free energy provides
    a lower bound on the log marginal likelihood. In [BG06], it is shown that this
    bound is a much better approximation to the true log marginal likelihood (as estimated
    by a slow annealed importance sampling procedure) than either BIC or CS. In fact,
    one can prove that the variational bound will always be more accurate than CS
    (which in turn is always more accurate than BIC).


