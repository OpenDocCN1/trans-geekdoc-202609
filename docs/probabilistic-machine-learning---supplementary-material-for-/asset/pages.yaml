    The second feature added by the algorithm checks if two adjacent characters are
    lower case:


    \(\phi_2(\boldsymbol{x}) = \sum_{i \sim j} \mathbb{I}(x_i \in \{a, \dots, z\},
    x_j \in \{a, \dots, z\})\) (4.26)


