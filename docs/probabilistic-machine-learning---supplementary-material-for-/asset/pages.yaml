  md: '# 4.2.3 Feature induction for a maxent spelling model


    In some applications, we assume the features \(\phi(\boldsymbol{x})\) are known.
    However, it is possible to learn the features in a maxent model in an unsupervised
    way; this is known as **feature induction**.


    A common approach to feature induction, first proposed in [DDL97; ZWM97], is to
    start with a base set of features, and then to continually create new feature
    combinations out of old ones, greedily adding the best ones to the model.


    As an example of this approach, [DDL97] describe how to build models to represent
    English spelling. This can be formalized as a probability distribution over variable
    length strings, \(p(\boldsymbol{x}|\boldsymbol{\theta})\), where \(x_t\) is a
    letter in the English alphabet. Initially the model has no features, which represents
    the uniform distribution. The algorithm starts by choosing to add the feature


    \(\phi_1(\boldsymbol{x}) = \sum_i \mathbb{I}(x_i \in \{a, \dots, z\})\) (4.25)


    which checks if any letter is lower case or not. After the feature is added, the
    parameters are (re)-fit by maximum likelihood (a computationally difficult problem,
    which we discuss in **??**). For this feature, it turns out that \(\hat{\theta}_1
    = 1.944\), which means that a word with a lowercase letter in any position is
    about \(e^{1.944} \approx 7\) times more likely than the same word without a lowercase
    letter in that position. Some samples from this model, generated using (annealed)
    Gibbs sampling (described in **??**), are shown below.$^2$


    m, r, xevo, ijjiiir, b, to, jz, gsr, wq, vf, x, ga, msgmGh, pcp, d, oziVlaI, hzagh,
    yzop, io,

