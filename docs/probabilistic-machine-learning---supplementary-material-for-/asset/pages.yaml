    # 4.2.2 Restricted Boltzmann machines (RBMs) in more detail


    In this section, we discuss RBMs in more detail.


    # 4.2.2.1 Binary RBMs


    The most common form of RBM has binary hidden nodes and binary visible nodes.
    The joint distribution then has the following form:


    ```

    \(p(\boldsymbol{x}, \boldsymbol{z}|\boldsymbol{\theta}) = \frac{1}{Z(\boldsymbol{\theta})}
    \exp(-\mathcal{E}(\boldsymbol{x}, \boldsymbol{z}; \boldsymbol{\theta})) \tag{4.10}\)


    \(\mathcal{E}(\boldsymbol{x}, \boldsymbol{z}; \boldsymbol{\theta}) \triangleq
    -\sum_{d=1}^D \sum_{k=1}^K x_d z_k W_{dk} - \sum_{d=1}^D x_d b_d - \sum_{k=1}^K
    z_k c_k \tag{4.11}\)


    \(= -(\boldsymbol{x}^{\text{T}}\mathbf{W}\boldsymbol{z} + \boldsymbol{x}^{\text{T}}\boldsymbol{b}
    + \boldsymbol{z}^{\text{T}}\boldsymbol{c}) \tag{4.12}\)


    \(Z(\boldsymbol{\theta}) = \sum_{\boldsymbol{x}} \sum_{\boldsymbol{z}} \exp(-E(\boldsymbol{x},
    \boldsymbol{z}; \boldsymbol{\theta})) \tag{4.13}\)

    ```


    where \(\mathcal{E}\) is the energy function, \(\mathbf{W}\) is a \(D \times K\)
    weight matrix, \(\boldsymbol{b}\) are the visible bias terms, \(\boldsymbol{c}\)
    are the hidden bias terms, and \(\boldsymbol{\theta} = (\mathbf{W}, \boldsymbol{b},
    \boldsymbol{c})\) are all the parameters. For notational simplicity, we will absorb
    the bias terms into the weight matrix by adding dummy units \(x_0 = 1\) and \(z_0
    = 1\) and setting \(\mathbf{w}_{0,:} = \boldsymbol{c}\) and \(\mathbf{w}_{:,0}
    = \boldsymbol{b}\). Note that naively computing \(Z(\boldsymbol{\theta})\) takes
    \(O(2^D 2^K)\) time but we can reduce this to \(O(\min\{D2^K, K2^D\})\) time using
    the structure of the graph.


    When using a binary RBM, the posterior can be computed as follows:


    ```

    \(p(\boldsymbol{z}|\boldsymbol{x}, \boldsymbol{\theta}) = \prod_{k=1}^K p(z_k|\boldsymbol{x},
    \boldsymbol{\theta}) = \prod_k \text{Ber}(z_k|\boldsymbol{\sigma}(\boldsymbol{w}_{:,k}^{\text{T}}\boldsymbol{x}))
    \tag{4.14}\)

    ```


    By symmetry, one can show that we can generate data given the hidden variables
    as follows:


    ```

    \(p(\boldsymbol{x}|\boldsymbol{z}, \boldsymbol{\theta}) = \prod_d p(x_d|\boldsymbol{z},
    \boldsymbol{\theta}) = \prod_d \text{Ber}(x_d|\boldsymbol{\sigma}(\boldsymbol{w}_{d,:}^{\text{T}}\boldsymbol{z}))
    \tag{4.15}\)

    ```


    We can write this in matrix-vector notation as follows:


    ```

    \(\mathbb{E}[\boldsymbol{z}|\boldsymbol{x}, \boldsymbol{\theta}] = \boldsymbol{\sigma}(\mathbf{W}^{\text{T}}\boldsymbol{x})
    \tag{4.16}\)


    \(\mathbb{E}[\boldsymbol{x}|\boldsymbol{z}, \boldsymbol{\theta}] = \boldsymbol{\sigma}(\mathbf{W}\boldsymbol{z})
    \tag{4.17}\)

    ```


    The weights in \(\mathbf{W}\) are called the **generative weights**, since they
    are used to generate the observations, and the weights in \(\mathbf{W}^{\text{T}}\)
    are called the **recognition weights**, since they are used to recognize the input.


    From Equation 4.14, we see that we activate hidden node \(k\) in proportion to
    how much the input vector \(\boldsymbol{x}\) “looks like” the weight vector \(\boldsymbol{w}_{:,k}\)
    (up to scaling factors). Thus each hidden node captures certain features of the
    input, as encoded in its weight vector, similar to a feedforward neural network.


    For example, consider an RBM for text models, where \(\boldsymbol{x}\) is a bag
    of words (i.e., a bit vector over the vocabulary). Let \(z_k = 1\) if “topic”
    \(k\) is present in the document. Suppose a document has the topics “sports” and
    “drugs”. If we “multiply” the predictions of each topic together, the model may
    give very high probability'
