    # 4.2.4 Relational UGMs


    We can create **relational UGMs** in a manner which is analogous to relational
    DGMs (**??**). This is particularly useful in the discriminative setting, for
    the same reasons that undirected CRFs are preferable to conditional DGMs (see
    **??**).


    For example, suppose we are interested in the problem of classifying web pages
    of a university into types (e.g., student, professor, admin, etc.) Obviously we
    can do this based on the contents of the page (e.g., words, pictures, layout,
    etc.) However, we might also suppose there is information in the hyper-link structure
    itself. For example, it might be likely for students to cite professors, and professors
    to cite other professors, but there may be no links between admin pages and students/
    professors. When faced with a web page whose label is ambiguous, we can bias our
    estimate based on the estimated labels of its neighbors, as in a CRF. This process
    is known as **collective classification** (see e.g., [Sen+08]). To specify the
    CRF structure for a web-graph of arbitrary size and shape, we just specify a template
    graph and potential functions, and then unroll the template appropriately to match
    the topology of the web, making use of parameter tying.


    # 4.2.5 Markov logic networks


    One particularly popular way of specifying relational UGMs is to use **first-order
    logic** rather than a graphical description of the template. The result is known
    as a **Markov logic network** [RD06; Dom+06; DL09].


    For example, consider the sentences “Smoking causes cancer” and “If two people
    are friends, and one smokes, then so does the other”. We can write these sentences
    in first-order logic as follows:


    ```

    \forall x.Sm(x) \implies Ca(x)                                   (4.28)

    \forall x.\forall y.Fr(x,y) \wedge Sm(x) \implies Sm(y)          (4.29)

    ```


    where $Sm$ and $Ca$ are predicates, and $Fr$ is a relation.


    It is convenient to write all formulas in **conjunctive normal form** (CNF), also
    known as **clausal form**. In this case, we get


    ```

    \neg Sm(x) \vee Ca(x)                                          (4.30)

    \neg Fr(x,y) \vee \neg Sm(x) \vee Sm(y)                        (4.31)

    ```


    The first clause can be read as “Either $x$ does not smoke or he has cancer”,
    which is logically equivalent to Equation (4.28). (Note that in a clause, any
    unbound variable, such as $x$, is assumed to be universally quantified.)


    Suppose there are just two objects (people) in the world, Anna and Bob, which
    we will denote by **constant symbols** $A$ and $B$. We can then create 8 binary
    random variables $Sm(x)$, $Ca(x)$, and $Fr(x,y)$ for $x, y \in \{A, B\}$. This
    defines $2^8$ **possible worlds**, some of which are shown in Table 4.3.


    Our goal is to define a probability distribution over these joint assignments.
    We can do this by creating a UGM with these variables, and adding a potential
    function to capture each logical rule or constraint. For example, we can encode
    the rule $\neg Sm(x) \vee Ca(x)$ by creating a potential function $\Psi(Sm(x),
    Ca(x))$, where we define


    ```

    \Psi(Sm(x), Ca(x)) = \begin{cases} 1 & \text{if } \neg Sm(x) \vee Ca(x) = T \\
    0 & \text{if } \neg Sm(x) \vee Ca(x) = F \end{cases} \quad (4.32)

    ```


    Note that we have not encoded the fact that $Fr$ is a symmetric relation, so $Fr(A,
    B)$ and $Fr(B, A)$ might have different values. Similarly, we have the “degenerate”
    nodes $Fr(A)$ and $Fr(B)$, since we did not enforce $x \neq y$ in Equation (4.29).
    (If we add such constraints, then the model compiler, which generates the ground
    network, should avoid creating redundant nodes.)'
