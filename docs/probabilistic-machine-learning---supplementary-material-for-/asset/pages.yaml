  md: '![](img/c73db5a1f734ebb7c0655f19e5bc9daa_89_0.png)


    Figure 10.1: (a) A graph. (b-d) Some of its spanning trees. From Figure 7.1 of
    [WJ08]. Used with kind permission of Martin Wainwright.


    This is a concave objective being maximized over a convex set, and hence has a
    unique optimum. Furthermore, the result is always an upper bound on log Z, because
    the entropy is an upper bound, and we are optimizing over a larger set than the
    marginal polytope.


    It remains to specify the set of tractable submodels, F, and the distribution
    ρ. We discuss some options below.


    # 10.1.5 Tree-reweighted belief propagation


    In this section, we discuss tree reweighted BP [WJW05b; Kol06], which is a form
    of convex BP which uses spanning trees as the set of tractable models F, as we
    describe below.


    # 10.1.5.1 Spanning tree polytope


    It remains to specify the set of tractable submodels, F, and the distribution
    ρ. We will consider the case where F is all spanning trees of a graph. For any
    given tree, the entropy is given by Equation 10.12. To compute the upper bound,
    obtained by averaging over all trees, note that the terms \(\sum_F \rho(F)H(\mu(F)_s)\)
    for single nodes will just be H_s, since node s appears in every tree, and \(\sum_F
    \rho(F) = 1\). But the mutual information term I_st receives weight \(\rho_{st}
    = E_\rho [ I((s,t) \in E(T))]\), known as the **edge appearance probability**.
    Hence we have the following upper bound on the entropy:


    ```

    \mathbb{H}(\boldsymbol{\mu}) \le \sum_{s \in V} H_s(\mu_s) - \sum_{(s,t) \in E}
    \rho_{st} I_{st}(\mu_{st}) \triangleq \mathbb{H}_{\text{TRBP}}(\boldsymbol{\mu})
    \quad (10.34)

    ```


    This is called the **tree reweighted BP** approximation [WJW05b; Kol06]. This
    is similar to the Bethe approximation to the entropy except for the crucial \(\rho_{st}\)
    weights. So long as \(\rho_{st} > 0\) for all edges (s,t), this gives a valid
    concave upper bound on the exact entropy.


    The edge appearance probabilities live in a space called the **spanning tree polytope**.
    This is because they are constrained to arise from a distribution over trees.
    Figure 10.1 gives an example of a graph and three of its spanning trees. Suppose
    each tree has equal weight under \(\rho\). The edge f occurs in 1 of the 3 trees,
    so \(\rho_f = 1/3\). The edge e occurs in 2 of the 3 trees, so \(\rho_e = 2/3\).
    The edge b appears in all of the trees, so \(\rho_b = 1\). And so on. Ideally
    we can find a distribution \(\rho\), or equivalently edge probabilities in the
    spanning tree polytope, that make the above bound as tight as possible. An algorithm
    to do this is described in [WJW05a]. A simpler approach is to use all single edges
    with weight \(\rho_e = 1/E\).


    What about the set we are optimizing over? We require \(\boldsymbol{\mu}(T) \in
    \mathbb{M}(T)\) for each tree T, which means enforcing normalization and local
    consistency. Since we have to do this for every tree, we are enforcing normalization
    and local consistency on every edge. Thus we are effectively optimizing in the
    pseudo-marginal polytope \(\mathbb{L}(G)\). So our final optimization problem
    as follows:


    ```

    \max_{\boldsymbol{\tau} \in \mathbb{L}(G)} \boldsymbol{\tau}^T \boldsymbol{\theta}
    + \mathbb{H}_{\text{TRBP}}(\boldsymbol{\tau}) \ge \log Z \quad (10.35)

    ```'
