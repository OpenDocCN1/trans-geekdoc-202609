    form:


    ```

    $$\mathcal{E}_{uv}(x_u, x_v) = \begin{cases} 0 & \text{if } x_u = x_v \\ \lambda_{uv}
    & \text{if } x_u \neq x_v \end{cases}$$ (9.18)

    ```


