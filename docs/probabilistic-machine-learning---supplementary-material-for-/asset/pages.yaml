    reversing the $2 \to 4$ arc creates a new v-structure. However, $G_1 \equiv G_3$,
    since reversing the $1 \to 5$ arc does not create a new v-structure.


    We can represent a Markov equivalence class using a single **partially directed
    acyclic graph** or **PDAG** (also called an **essential graph** or **pattern**),
    in which some edges are directed and some undirected (see **??**). The undirected
    edges represent reversible edges; any combination is possible so long as no new
    v-structures are created. The directed edges are called **compelled edges**, since
    changing their orientation would change the v-structures and hence change the
    equivalence class. For example, the PDAG $X - Y - Z$ represents $\{X \to Y \to
    Z, X \leftarrow Y \leftarrow Z, X \leftarrow Y \to Z\}$ which encodes $X \not\perp
    Z$ and $X \perp Z|Y$. See Figure 31.4 for another example.


    The significance of the above theorem is that, when we learn the DAG structure
    from data, we will not be able to uniquely identify all of the edge directions,
    even given an infinite amount of data. We say that we can learn DAG structure
    “up to Markov equivalence”. This also cautions us not to read too much into the
    meaning of particular edge orientations, since we can often change them without
    changing the model in any observable way. (If we want to distinguish between edge
    orientations within a PDAG (e.g., if we want to imbue a causal interpretation
    on the edges), we can use interventional data, as we discuss in Section 31.4.2.)'
