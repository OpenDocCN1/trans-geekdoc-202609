  md: '# 2.2.4 Web spam


    PageRank is not foolproof. For example, consider the strategy adopted by JC Penney,
    a department store in the USA. During the Christmas season of 2010, it planted
    many links to its home page on 1000s of irrelevant web pages, thus increasing
    its ranking on Google''s search engine [Seg11]. Even though each of these source
    pages has low PageRank, there were so many of them that their effect added up.
    Businesses call this **search engine optimization**; Google calls it **web spam**.
    When Google was notified of this scam (by the *New York Times*), it manually downweighted
    JC Penney, since such behavior violates Google''s code of conduct. The result
    was that JC Penney dropped from rank 1 to rank 65, essentially making it disappear
    from view. Automatically detecting such scams relies on various techniques which
    are beyond the scope of this chapter.


    # 2.2.5 Personalized PageRank


    The PageRank algorithm computes a single global notion of importance of each web
    page. In some cases, it is useful for each user to define his own notion of importance.
    The **Personalized PageRank** algorithm (aka **random walks with restart**) computes
    a stationary distribution relative to node $k$, by returning with some probability
    to a specific starting node $k$ rather than a random node. The corresponding stationary
    distribution, $\pi^k$, gives a measure of how important each node is relative
    to $k$. See [Lof15] for details. (A similar system is used by Pinterest to infer
    the similarity of one “pin” (bookmarked webpage) to another, as explained in [Eks+18]).'
