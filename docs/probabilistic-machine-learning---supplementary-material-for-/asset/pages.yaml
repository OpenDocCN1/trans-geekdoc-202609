  md: '![](img/c73db5a1f734ebb7c0655f19e5bc9daa_47_0.png)


    Figure 6.1: (a) Evaluating a proximal operator at various points. The thin lines
    represent level sets of a convex function; the minimum is at the bottom left.
    The black line represents the boundary of its domain. Blue points get mapped to
    red points by the prox operator, so points outside the feasible set get mapped
    to the boundary, and points inside the feasible set get mapped to closer to the
    minimum. From Figure 1 of [PB+14]. Used with kind permission of Stephen Boyd.
    (b) Illustration of the Moreau envelope with \(\eta = 1\) (dotted line) of the
    absolute value function (solid black line). See text for details. From Figure
    1 of [PSW15]. Used with kind permission of Nicholas Polson.


    We will often want to compute the prox operator for a scaled function \(\eta f\),
    for \(\eta > 0\), which can be written as


    ```

    \(\text{prox}_{\eta f}(\mathbf{x}) = \text{argmin}_\mathbf{z} \left( f(\mathbf{z})
    + \frac{1}{2\eta} \|\mathbf{z} - \mathbf{x}\|_2^2 \right)\) (6.5)

    ```


    The solution to the problem in Equation (6.5) the same as the solution to the
    trust region optimization problem of the form


    ```

    \(\text{argmin}_\mathbf{z} f(\mathbf{z}) \text{ s.t. } \|\mathbf{z} - \mathbf{x}\|_2
    \le \rho\) (6.6)

    ```


    for appropriate choices of \(\eta\) and \(\rho\). This proximal projection minimizes
    the function while staying close to the current iterate. We give other interpretations
    of the proximal operator below.


    We can generalize the operator by replacing the Euclidean distance with Mahalanobis
    distance:


    ```

    \(\text{prox}_{\eta f, \mathbf{A}}(\mathbf{x}) = \text{argmin}_\mathbf{z} \left(
    f(\mathbf{z}) + \frac{1}{2\eta} (\mathbf{z} - \mathbf{x})^\top \mathbf{A} (\mathbf{z}
    - \mathbf{x}) \right)\) (6.7)

    ```


    where **A** is a psd matrix.


    # 6.1.1.1 Moreau envelope


    Let us define the following quadratic approximation to the function \(f\) as a
    function of \(\mathbf{z}\), requiring that it touch \(f\) at \(\mathbf{x}\):


    ```

    \(f_\mathbf{x}^\eta(\mathbf{z}) = f(\mathbf{z}) + \frac{1}{2\eta} \|\mathbf{z}
    - \mathbf{x}\|_2^2\) (6.8)

    ```


    By definition, the location of the minimum of this function is \(\mathbf{z}^*(\mathbf{x})
    = \text{argmin}_\mathbf{z} f_\mathbf{x}^\eta(\mathbf{z}) = \text{prox}_{\eta f}(\mathbf{x})\).


    For example, consider approximating the function \(f(x) = |x|\) at \(x_0 = 1.5\)
    using \(f_{x_0}^1(z) = |z| + \frac{1}{2}(z - x_0)^2\). This is shown in Figure
    6.1b: the solid black line is \(f(x)\), \(x_0 = 1.5\) is the black square, and
    the light gray line is \(f_{x_0}^1(z)\). The proximal projection of \(x_0\) onto
    \(f\) is \(z^*(x_0) = \text{argmin}_z f_{x_0}^1(z) = 0.5\), which is the minimum
    of the quadratic, shown by the red cross. This proximal point is closer to the
    minimum of \(f(x)\) than the starting point, \(x_0\).


    Now let us evaluate the approximation at this proximal point:


    ```

    \(f_\mathbf{x}^\eta(\mathbf{z}^*(\mathbf{x})) = f(\mathbf{z}^*) + \frac{1}{2\eta}
    \|\mathbf{z}^* - \mathbf{x}\|_2^2 = \min_\mathbf{z} f(\mathbf{z}) + \frac{1}{2\eta}
    \|\mathbf{z} - \mathbf{x}\|_2^2 \triangleq f^\eta(\mathbf{x})\) (6.9)

    ```


    where \(f^\eta(\mathbf{x})\) is called the Moreau envelope of \(f\).'
