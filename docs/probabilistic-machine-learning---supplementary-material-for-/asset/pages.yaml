    Adapted from Figure 10.11 of [Bis06].


    # 6.5.1 Introduction


    Consider an arbitrary continuous function \(f(\mathbf{x})\), and suppose we create
    a linear lower bound on it of the form


    \(\mathcal{L}(\mathbf{x}, \boldsymbol{\lambda}) \triangleq \boldsymbol{\lambda}^\top
    \mathbf{x} - f^*(\boldsymbol{\lambda}) \le f(\mathbf{x})\) (6.80)


    where \(\boldsymbol{\lambda}\) is the slope, which we choose, and \(f^*(\boldsymbol{\lambda})\)
    is the intercept, which we solve for below. See Figure 6.11(a) for an illustration.


    For a fixed \(\lambda\), we can find the point \(\mathbf{x}_\lambda\) where the
    lower bound is tight by “sliding” the line upwards until it touches the curve
    at \(\mathbf{x}_\lambda\), as shown in Figure 6.11(b). At \(\mathbf{x}_\lambda\),
    we minimize the distance between the function and the lower bound:


    \(\mathbf{x}_\lambda \triangleq \underset{x}{\text{argmin}} f(x) - \mathcal{L}(\mathbf{x},
    \boldsymbol{\lambda}) = \underset{x}{\text{argmin}} f(x) - \boldsymbol{\lambda}^\top
    \mathbf{x}\) (6.81)


    Since the bound is tight at this point, we have


    \(f(\mathbf{x}_\lambda) = \mathcal{L}(\mathbf{x}_\lambda, \boldsymbol{\lambda})
    = \boldsymbol{\lambda}^\top \mathbf{x}_\lambda - f^*(\boldsymbol{\lambda})\) (6.82)


    and hence


    \(f^*(\boldsymbol{\lambda}) = \boldsymbol{\lambda}^\top \mathbf{x}_\lambda - f(\mathbf{x}_\lambda)
    = \underset{x}{\max} \boldsymbol{\lambda}^\top \mathbf{x} - f(\mathbf{x})\) (6.83)


    The function \(f^*\) is called the **conjugate** of \(f\), also known as the **Fenchel
    transform** of \(f\). For the special case of differentiable \(f\), \(f^*\) is
    called the **Legendre transform** of \(f\).


    One reason conjugate functions are useful is that they can be used to create convex
    lower bounds to non-convex functions. That is, we have \(\mathcal{L}(\mathbf{x},
    \boldsymbol{\lambda}) \le f(\mathbf{x})\), with equality at \(\mathbf{x} = \mathbf{x}_\lambda\),
    for any function \(f : \mathbb{R}^D \to \mathbb{R}\). For any given \(\mathbf{x}\),
    we can optimize over \(\boldsymbol{\lambda}\) to make the bound as tight as possible,
    giving us a fixed function \(\mathcal{L}(\mathbf{x})\); this is called a **variational
    approximation**. We can then try to maximize this lower bound wrt \(\mathbf{x}\)
    instead of maximizing \(f(\mathbf{x})\). This method is used extensively in approximate
    Bayesian inference, as we discuss in **??**.


    # 6.5.2 Example: exponential function


    Let us consider an example. Suppose \(f(x) = e^{-x}\), which is convex. Consider
    a linear lower bound of the form


    \(\mathcal{L}(x, \lambda) = \lambda x - f^\dagger(\lambda)\) (6.84)


    where the conjugate function is given by


    \(f^\dagger(\lambda) = \underset{x}{\max} \lambda x - f(x) = -\lambda \log(-\lambda)
    + \lambda\) (6.85)'
