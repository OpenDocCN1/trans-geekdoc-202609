    we fit a (nonlinear) regression model for X → Y, and then check if the residual
    error Y - \(\hat{f}_Y(X)\) is independent of X; we then repeat the procedure swapping
    the roles of X and Y. The theory [PJS17] says that the independence test will
    only pass for the causal direction. See Figure 31.17 for an illustration.


    # 31.4.1.4 Linear models with non-Gaussian noise


    If the function mapping from X to Y is linear, we cannot tell if X → Y or Y →
    X if we assume Gaussian noise. This is apparent from the symmetry of Figure 31.17
