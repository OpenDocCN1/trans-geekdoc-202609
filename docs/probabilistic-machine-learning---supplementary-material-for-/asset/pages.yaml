    to the problem of **induction** is to suppose we have a hypothesis space $\mathcal{H}$
    of concepts (such as even numbers, all numbers between 1 and 10, etc.), and then
    to identify the smallest subset of $\mathcal{H}$ that is consistent with the observed
    data $\mathcal{D}$; this is called the **version space**. As we see more examples,
    the version space shrinks and we become increasingly certain about the underlying
    hypothesis [Mit97].


