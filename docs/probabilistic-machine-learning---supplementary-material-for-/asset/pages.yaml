    \(p(G|D)\) and its mode. This approach significantly outperformed graphical lasso,
    both in terms of predictive accuracy and structural recovery, for a comparable
    computational cost.


    # 31.4 Learning causal DAGs


    Causal reasoning (which we discuss in more detail in **??**) relies on knowing
    the underlying structure of the DAG (although [JZB19] shows how to answer some
    queries if we just know the graph up to Markov equivalence). Learning this structure
    is called **causal discovery** (see e.g., [GZS19]).


    If we just have two variables, we need to know if the causal model should be written
    as \(X \to Y\) or \(X \leftarrow Y\). Both of these models are Markov equivalent
    (Section 31.2.2), meaning they cannot be distinguished from observational data,
    yet they make very different causal predictions. We discuss how to learn cause-effect
    pairs in Section 31.4.1.


    When we have more than 2 variables, we need to consider more general techniques.
    In Section 31.2, we discuss how to learn a DAG structure from observational data
    using likelihood based methods, and hypothesis testing methods. However, these
    approaches cannot distinguish between models that are Markov equivalent, so we
    need to perform interventions to reduce the size of the equivalence class [Sol19].
    We discuss some suitable methods in Section 31.4.2.


    The above techniques assume that the causal variables of interest (e.g., cancer
    rates, smoking rates) can be measured directly. However, in many ML problems,
    the data is much more "low level". For example, consider trying to learn a causal
    model of the world from raw pixels. We briefly discuss this topic in in Section
    31.4.3.


    For more details on causal discovery methods, see e.g., [Ebe17; PJS17; HDMM18;
    Guo+21].'
