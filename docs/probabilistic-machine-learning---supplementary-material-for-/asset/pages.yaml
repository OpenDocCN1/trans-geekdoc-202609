    \theta_s x_s + \sum_{(s,t) \in \mathcal{E}} \theta_{st} x_s x_t \right\} \tag{9.6}
    \)


    Hence we can use the following minimal parameterization


    \( \mathcal{T}(\mathbf{x}) = (x_s, s \in V ; x_s x_t, (s, t) \in \mathcal{E})
