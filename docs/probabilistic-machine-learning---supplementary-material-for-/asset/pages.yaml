- pgno: 49
  md: '# 6.1.2.1 Moreau decomposition


    A useful technique for computing some kinds of proximal operators leverages a
    result known as **Moreau decomposition**, which states that


    \(\boldsymbol{x} = \text{prox}_f(\boldsymbol{x}) + \text{prox}_{f^*}(\boldsymbol{x})
    \quad (6.18)\)


    where \(f^*\) is the convex conjugate of \(f\) (see Section 6.5).


    For example, suppose \(f = || \cdot ||\) is a general norm on \(\mathbb{R}^D\).
    If can be shown that \(f^* = I_{\mathcal{B}}\), where


    \(\mathcal{B} = \{ \boldsymbol{x} : ||\boldsymbol{x}||^* \le 1 \} \quad (6.19)\)


    is the unit ball for the dual norm \(|| \cdot ||^*\), defined by


    \(||\boldsymbol{z}||^* = \sup \{ \boldsymbol{z}^T \boldsymbol{x} : ||\boldsymbol{x}||
    \le 1 \} \quad (6.20)\)


    Hence


    \(\text{prox}_{\lambda f}(\boldsymbol{x}) = \boldsymbol{x} - \lambda \text{prox}_{f^*/\lambda}(\boldsymbol{x}/\lambda)
    = \boldsymbol{x} - \lambda \text{proj}_{\mathcal{B}}(\boldsymbol{x}/\lambda) \quad
    (6.21)\)


    Thus there is a close connection between proximal operators of norms and projections
    onto norm balls that we will leverage below.


    # 6.1.2.2 Projection onto box constraints


    Let \(\mathcal{C} = \{ \boldsymbol{x} : \boldsymbol{l} \le \boldsymbol{x} \le
    \boldsymbol{u} \}\) be a box or hyper-rectangle, imposing lower and upper bounds
    on each element. (These bounds can be infinite for certain elements if we don''t
    to constrain values along that dimension.) The projection operator is easy to
    compute elementwise by simply thresholding at the boundaries:


    \(\text{proj}_{\mathcal{C}}(\boldsymbol{x})_d = \begin{cases} l_d & \text{if }
    x_k \le l_k \\ x_d & \text{if } l_k \le x_k \le u_k \\ u_d & \text{if } x_k \ge
    u_k \end{cases} \quad (6.22)\)


    For example, if we want to ensure all elements are non-negative, we can use


    \(\text{proj}_{\mathcal{C}}(\boldsymbol{x}) = \boldsymbol{x}_+ = [\max(x_1, 0),
    \dots, \max(x_D, 0)] \quad (6.23)\)


    # 6.1.2.3 \(\ell_1\) norm


    Consider the 1-norm \(f(\boldsymbol{x}) = ||\boldsymbol{x}||_1\). The proximal
    projection can be computed componentwise. We can solve each 1d problem as follows:


    \(\text{prox}_{\lambda f}(x) = \underset{z}{\text{argmin}} \lambda |z| + \frac{1}{z}(z-x)^2
    \quad (6.24)\)


    One can show that the solution to this is given by


    \(\text{prox}_{\lambda f}(x) = \begin{cases} x - \lambda & \text{if } x \ge \lambda
    \\ 0 & \text{if } |x| \ge \lambda \\ x + \lambda & \text{if } x \le \lambda \end{cases}
    \quad (6.25)\)


    This is known as the **soft thresholding operator**, since values less than \(\lambda\)
    in absolute value are set to 0 (thresholded), but in a differentiable way. This
    is useful for enforcing sparsity. Note that soft thresholding can be written more
    compactly as


    \(\text{SoftThreshold}_\lambda(x) = \text{sign}(x) (|x| - \lambda)_+ \quad (6.26)\)


    where \(x_+ = \max(x, 0)\) is the positive part of \(x\). In the vector case,
    we define \(\text{SoftThreshold}_\lambda(\boldsymbol{x})\) to be elementwise soft
    thresholding.'
