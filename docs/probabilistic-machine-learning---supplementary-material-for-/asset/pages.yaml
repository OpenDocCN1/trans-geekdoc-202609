- pgno: 50
  md: '# 6.1.2.4 $\ell_2$ norm


    Now consider the $\ell_2$ norm $f(\boldsymbol{x}) = \|\boldsymbol{x}\|_2 = \sqrt{\sum_{d=1}^D
    x_d^2}$. The dual norm for this is also the $\ell_2$ norm. Projecting onto the
    corresponding unit ball $\mathcal{B}$ can be done by simply scaling vectors that
    lie outside the unit sphere:


    $\text{proj}_{\mathcal{B}}(\boldsymbol{x}) = \begin{cases} \frac{\boldsymbol{x}}{\|\boldsymbol{x}\|_2}
    & \|\boldsymbol{x}\|_2 > 1 \\ \boldsymbol{x} & \|\boldsymbol{x}\|_2 \le 1 \end{cases}$
    (6.27)


    Hence by the Moreau decomposition we have


    $\text{prox}_{\lambda f}(\boldsymbol{x}) = (1 - \lambda/\|\boldsymbol{x}\|_2)_+\boldsymbol{x}
    = \begin{cases} (1 - \frac{\lambda}{\|\boldsymbol{x}\|_2})\boldsymbol{x} & \text{if
    } \|\boldsymbol{x}\|_2 \ge \lambda \\ 0 & \text{otherwise} \end{cases}$ (6.28)


    This will set the whole vector to zero if its $\ell_2$ norm is less than $\lambda$.
    This is therefore called **block soft thresholding**.


    # 6.1.2.5 Squared $\ell_2$ norm


    Now consider using the _squared_ $\ell_2$ norm (scaled by 0.5), $f(\boldsymbol{x})
    = \frac{1}{2}\|\boldsymbol{x}\|_2^2 = \frac{1}{2} \sum_{d=1}^D x_d^2$. One can
    show that


    $\text{prox}_{\lambda f}(\boldsymbol{x}) = \frac{1}{1 + \lambda}\boldsymbol{x}$
    (6.29)


    This reduces the magnitude of the $\boldsymbol{x}$ vector, but does not enforce
    sparsity. It is therefore called the **shrinkage operator**.


    More generally, if $f(\boldsymbol{x}) = \frac{1}{2}\boldsymbol{x}^\mathbf{T}\mathbf{A}\boldsymbol{x}
    + \boldsymbol{b}^\mathbf{T}\boldsymbol{x} + c$ is a quadratic, with **A** being
    positive definite, then


    $\text{prox}_{\lambda f}(\boldsymbol{x}) = (\mathbf{I} + \lambda\mathbf{A})^{-1}(\boldsymbol{x}
    - \lambda\boldsymbol{b})$ (6.30)


    A special case of this is if $f$ is affine, $f(\boldsymbol{x}) = \boldsymbol{b}^\mathbf{T}\boldsymbol{x}
    + c$. Then we have $\text{prox}_{\lambda f}(\boldsymbol{x}) = \boldsymbol{x} -
    \lambda\boldsymbol{b}$. We saw an example of this in Equation (6.12).


    # 6.1.2.6 Nuclear norm


    The **nuclear norm**, also called the **trace norm**, of an $m \times n$ matrix
    **A** is the $\ell_1$ norm of of its singular values: $f(\mathbf{A}) = \|\mathbf{A}\|_*
    = \|\boldsymbol{\sigma}\|_1$. Using this as a regularizer can result in a low
    rank matrix. The proximal operator for this is defined by


    $\text{prox}_{\lambda f}(\mathbf{A}) = \sum_i (\sigma_i - \lambda)_+ \boldsymbol{u}_i
    \boldsymbol{v}_i^\mathbf{T}$ (6.31)


    where $\mathbf{A} = \sum_i \sigma_i \boldsymbol{u}_i \boldsymbol{v}_i^T$ is the
    SVD of **A**. This operation is called **singular value thresholding**.


    # 6.1.2.7 Projection onto positive definite cone


    Consider the cone of positive semidefinite matrices $\mathcal{C}$, and let $f(\mathbf{A})
    = I_{\mathcal{C}}(\mathbf{A})$ be the indicator function. The proximal operator
    corresponds to projecting **A** onto the cone. This can be computed using


    $\text{proj}_{\mathcal{C}}(\mathbf{A}) = \sum_i (\lambda_i)_+ \boldsymbol{u}_i
    \boldsymbol{u}_i^\mathbf{T}$ (6.32)


    where $\sum_i \lambda_i \boldsymbol{u}_i \boldsymbol{u}_i^\mathbf{T}$ is the eigenvalue
    decomposition of **A**. This is useful for optimizing psd matrices.'
