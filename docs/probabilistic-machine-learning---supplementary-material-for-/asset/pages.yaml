- pgno: 103
  md: '![](img/c73db5a1f734ebb7c0655f19e5bc9daa_103_0.png)


    Figure 15.1: Quadratic lower bounds on the sigmoid (logistic) function. In solid
    red, we plot $\sigma(x)$ vs $x$. In dotted blue, we plot the lower bound $L(x,
    \psi)$ vs $x$ for $\psi = 2.5$. (a) JJ bound. This is tight at $\psi = \pm 2.5$.
    (b) Bohning bound (Section 15.1.2.2). This is tight at $\psi = 2.5$. Generated
    by sigmoid_lower_bounds.py.


    Since this is a quadratic function of $\boldsymbol{w}$, we can derive a Gaussian
    posterior approximation as follows:


    $q(\boldsymbol{w}|\boldsymbol{\psi}) = \mathcal{N}(\boldsymbol{w}|\boldsymbol{\mu}_N,
    \mathbf{V}_N) \tag{15.9}$

    $\boldsymbol{\mu}_N = \mathbf{V}_N \left( \mathbf{V}_0^{-1} \boldsymbol{\mu}_0
    + \sum_{n=1}^N (y_n - 1/2) \mathbf{x}_n \right) \tag{15.10}$

    $\mathbf{V}_N^{-1} = \mathbf{V}_0^{-1} + 2 \sum_{n=1}^N \lambda(\psi_n)\mathbf{x}_n
    \mathbf{x}_n^T \tag{15.11}$


    This is more flexible than a Laplace approximation, since the variational parameters
    $\boldsymbol{\psi}$ can be used to optimize the curvature of the posterior covariance.
    To find the optimal $\boldsymbol{\psi}$, we can maximize the ELBO, which is given
    by


    $\log p(\boldsymbol{y}|\mathbf{X}) = \log \int p(\boldsymbol{y}|\mathbf{X}, \boldsymbol{w})
    p(\boldsymbol{w}) d\boldsymbol{w} \ge \log \int h(\boldsymbol{w}, \boldsymbol{\psi})
    p(\boldsymbol{w}) d\boldsymbol{w} = \mathbb{L}(\boldsymbol{\psi}) \tag{15.12}$


    where


    $h(\boldsymbol{w}, \boldsymbol{\psi}) = \prod_{n=1}^N \sigma(\psi_n) \exp [\eta_n
    y_n - (\eta_n + \psi_n)/2 - \lambda(\psi_n)(\eta_n^2 - \psi_n^2)] \tag{15.13}$


    We can evaluate the lower bound analytically to get


    $\mathbb{L}(\boldsymbol{\psi}) = \frac{1}{2} \log \frac{|\mathbf{V}_N|}{|\mathbf{V}_0|}
    + \frac{1}{2} \boldsymbol{\mu}_N^T \mathbf{V}_N^{-1} \boldsymbol{\mu}_N - \frac{1}{2}
    \boldsymbol{\mu}_0^T \mathbf{V}_0^{-1} \boldsymbol{\mu}_0 + \sum_{n=1}^N \left[
    \log \sigma(\psi_n) - \frac{1}{2} \psi_n + \lambda(\psi_n)\psi_n^2 \right] \tag{15.14}$


    If we solve for $\nabla_\psi \mathbb{L}(\boldsymbol{\psi}) = \mathbf{0}$, we get
    the following iterative update equation for each variational parameter:


    $(\psi_n^{\text{new}})^2 = \mathbf{x}_n \mathbb{E} [\boldsymbol{w} \boldsymbol{w}^T]
    \mathbf{x}_n = \mathbf{x}_n (\mathbf{V}_N + \boldsymbol{\mu}_N \boldsymbol{\mu}_N^T)
    \mathbf{x}_n \tag{15.15}$


    One we have estimated $\psi_n$, we can plug it into the above Gaussian approximation
    $q(\boldsymbol{w}|\boldsymbol{\psi})$.


    # 15.1.2 Multinomial logistic regression


    In this section we discuss how to approximate the posterior $p(\boldsymbol{w}|\mathcal{D})$
    for multinomial logistic regression using variational inference, extending the
    approach of Section 15.1 to the multi-class case. The key idea is to create a
    “Gaussian-like” lower bound on the multi-class logistic regression likelihood
    due to [Boh92]. We can then compute the variational posterior in closed form.
    This will let us deterministically optimize the ELBO.


    Let $\boldsymbol{y}_i \in \{0, 1\}^C$ be a one-hot label vector, and define the
    logits for example $i$ to be


    $\boldsymbol{\eta}_i = [\boldsymbol{x}_i^T \boldsymbol{w}_1, \dots, \boldsymbol{x}_i^T
    \boldsymbol{w}_C] \tag{15.16}$'
