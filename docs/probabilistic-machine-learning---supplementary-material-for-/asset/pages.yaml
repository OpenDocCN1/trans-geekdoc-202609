    \boldsymbol{w}_{st}) \Big]\\

    + \lambda_1 \sum_{s=1}^V \sum_{t=s+1}^V ||\boldsymbol{w}_{st}||_p + \lambda_2
    \sum_{t=1}^V ||\boldsymbol{v}_t||_2^2\) (31.50)

    ```


    where \(||\boldsymbol{w}_{st}||_p\) is the \(p\)-norm; common choices are \(p=2\)
    or \(p=\infty\), as explained in **??**. This method of CRF structure learning
    was first suggested in [Sch+08]. (The use of \(\ell_1\) regularization for learning
    the structure of binary MRFs was proposed in [LGK06].)


    Although this objective is convex, it can be costly to evaluate, since we need
    to perform inference to compute its gradient, as explained in **??** (this is
    true also for MRFs), due to the global partition function. We should therefore
    use an optimizer that does not make too many calls to the objective function or
    its gradient, such as the projected quasi-Newton method in [Sch+09]. In addition,
    we can use approximate inference, such as loopy belief propagation (**??**), to
    compute an approximate objective and gradient more quickly, although this is not
    necessarily theoretically sound.


    Another approach is to apply the group lasso penalty to the pseudo-likelihood
    discussed in **??**. This is much faster, since inference is no longer required
    [HT09]. Figure 31.16 shows the result of applying this procedure to the 20-newsgroup
    data, where \(y_{it}\) indicates the presence of word \(t\) in document \(i\),
    and \(\boldsymbol{x}_i = 1\) (so the model is an MRF).


    For a more recent approach to learning sparse discrete PGM-U structures, based
    on sparse full conditionals, see the GISE (Generalized Regularized Interaction
    Screening Estimator) method of [VML19], which takes polynomial time, yet its sample
    complexity is close to the information-theoretic lower bounds [Lok+18].


    # ## 31.3.4 Bayesian inference for undirected graph structures


    Although the graphical lasso is reasonably fast, it only gives a point estimate
    of the structure. Furthermore, it is not model-selection consistent [Mei05], meaning
    it cannot recover the true graph even as \(N \rightarrow \infty\). It would be
    preferable to integrate out the parameters, and perform posterior inference in
    the space of graphs, i.e., to compute \(p(G|\mathcal{D})\). We can then extract
    summaries of the posterior, such as posterior edge marginals, \(p(G_{ij} = 1|\mathcal{D})\),
    just as we did for DAGs. In this section, we discuss how to do this.


    If the graph is decomposable, and if we use conjugate priors, we can compute the
    marginal likelihood in closed form [DL93]. Furthermore, we can efficiently identify
    the decomposable neighbors of a graph [TG09], i.e., the set of legal edge additions
    and removals. This means that we can perform relatively efficient stochastic local
    search to approximate the posterior (see e.g. [GG99; Arm+08; SC08]).


    However, the restriction to decomposable graphs is rather limiting if one''s goal
    is knowledge discovery, since the number of decomposable graphs is much less than
    the number of general undirected graphs.\(^4\)


    A few authors have looked at Bayesian inference for GGM structure in the non-decomposable
    case (e.g., [DGR03; WCK03; Jon+05]), but such methods cannot scale to large models
    because they use an expensive Monte Carlo approximation to the marginal likelihood
    [AKM05]. [LD08] suggested using a Laplace approximation. This requires computing
    the MAP estimate of the parameters for \(\boldsymbol{\Omega}\) under a G-Wishart
    prior [Rov02]. In [LD08], they used the iterative proportional scaling algorithm
    [SK86; HT08] to find the mode. However, this is very slow, since it requires knowing
    the maximal cliques of the graph, which is NP-hard in general.


    \(^4\) The number of decomposable graphs on \(V\) nodes, for \(V=2, \dots, 8\),
    is as follows ([Arm05, p158]): 2; 8; 61; 822; 18,154; 61,7675; 30,888,596. If
    we divide these numbers by the number of undirected graphs, which is \(2^{V(V-1)/2}\),
    we find the ratios are: 1, 1, 0.95, 0.8, 0.55, 0.29, 0.12. So we see that decomposable
    graphs form a vanishing fraction of the total hypothesis space.'
