    $$f^{**}(x) = \max_\lambda \lambda x - f^\dagger(\lambda) = \max_\lambda \lambda
    x + \lambda \log(-\lambda) - \lambda$$

    ```


    Define


    ```

    $$J^*(x, \lambda) = \lambda x - f^\dagger(x) = \lambda x + \lambda \log(-\lambda)
    - \lambda$$

    ```'
