  md: 'To see the equivalence with the directed representation, let us cancel terms
    to get


    $$p(x_1, x_2, x_3, x_4 | T) = p(x_1, x_2) \frac{p(x_2, x_3)}{p(x_2)} \frac{p(x_2,
    x_4)}{p(x_2)} \tag{31.6}$$

    $$= p(x_1) p(x_2 | x_1) p(x_3 | x_2) p(x_4 | x_2) \tag{31.7}$$

    $$= p(x_2) p(x_1 | x_2) p(x_3 | x_2) p(x_4 | x_2) \tag{31.8}$$


    where \(p(x_t | x_s) = p(x_s, x_t) / p(x_s)\).


    Thus a tree can be represented as either an undirected or directed graph: the
    number of parameters is the same, and hence the complexity of learning is the
    same. And of course, inference is the same in both representations, too. The undirected
    representation, which is symmetric, is useful for structure learning, but the
    directed representation is more convenient for parameter learning.


    # ## 31.1.2 Chow-Liu algorithm


    Using Equation (31.4), we can write the log-likelihood for a tree as follows:


    $$\log p(\mathcal{D} | \boldsymbol{\theta}, T) = \sum_t \sum_k N_{tk} \log p(x_t
    = k | \boldsymbol{\theta})$$

    $$+ \sum_{s, t} \sum_{j, k} N_{stjk} \log \frac{p(x_s = j, x_t = k | \boldsymbol{\theta})}{p(x_s
    = j | \boldsymbol{\theta}) p(x_t = k | \boldsymbol{\theta})} \tag{31.9}$$


    where \(N_{stjk}\) is the number of times node \(s\) is in state \(j\) and node
    \(t\) is in state \(k\), and \(N_{tk}\) is the number of times node \(t\) is in
    state \(k\). We can rewrite these counts in terms of the empirical distribution:
    \(N_{stjk} = N p_{\mathcal{D}}(x_s = j, x_t = k)\) and \(N_{tk} = N p_{\mathcal{D}}(x_t
    = k)\). Setting \(\boldsymbol{\theta}\) to the MLEs, this becomes


    $$\frac{\log p(\mathcal{D} | \boldsymbol{\theta}, T)}{N} = \sum_{t \in \mathcal{V}}
    \sum_k p_{\mathcal{D}}(x_t = k) \log p_{\mathcal{D}}(x_t = k) \tag{31.10}$$

    $$+ \sum_{(s, t) \in \mathcal{E}(T)} \mathbb{I}(x_s, x_t | \hat{\boldsymbol{\theta}}_{st})
    \tag{31.11}$$


    where \(\mathbb{I}(x_s, x_t | \hat{\boldsymbol{\theta}}_{st}) \ge 0\) is the mutual
    information between \(x_s\) and \(x_t\) given the empirical distribution:


    $$\mathbb{I}(x_s, x_t | \hat{\boldsymbol{\theta}}_{st}) = \sum_j \sum_k p_{\mathcal{D}}(x_s
    = j, x_t = k) \log \frac{p_{\mathcal{D}}(x_s = j, x_t = k)}{p_{\mathcal{D}}(x_s
    = j) p_{\mathcal{D}}(x_t = k)} \tag{31.12}$$


    Since the first term in Equation (31.11) is independent of the topology \(T\),
    we can ignore it when learning structure. Thus the tree topology that maximizes
    the likelihood can be found by computing the maximum weight spanning tree, where
