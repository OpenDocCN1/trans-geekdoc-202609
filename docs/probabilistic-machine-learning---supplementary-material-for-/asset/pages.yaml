    In this section, we discuss how to compute the exact posterior over graphs, $p(G|\mathcal{D})$,
    ignoring for now the issue

    of computational tractability. We assume there is no missing data, and that there
    are no hidden variables.

    This is called the **complete data assumption**.


    For simplicity, we will focus on the case where all the variables are categorical
    and all the CPDs are tables.

    Our presentation is based in part on [HGC95], although we will follow the notation
    of **??**. In particular,

    let \(x_{it} \in \{1, \dots, K_t\}\) be the value of node \(t\) in case \(i\),
    where \(K_t\) is the number of states for node \(t\). Let

    \(\theta_{tck} \triangleq p(x_t=k|\boldsymbol{x}_{pa(t)}=c)\), for \(k=1:K_t\),
    and \(c=1:C_t\), where \(C_t\) is the number of parent combinations

    (possible conditioning cases). For notational simplicity, we will often assume
    \(K_t=K\), so all nodes have the

    same number of states. We will also let \(d_t = \text{dim}(\text{pa}(t))\) be
    the degree or fan-in of node \(t\), so that \(C_t = K^{d_t}\).


    # 31.2.3.1 Deriving the likelihood


    Assuming there is no missing data, and that all CPDs are tabular, the likelihood
    can be written as follows:


    ```

    \(p(\mathcal{D}|G, \boldsymbol{\theta}) = \prod_{i=1}^N \prod_{t=1}^V \text{Cat}(x_{it}|\boldsymbol{x}_{i,\text{pa}(t)},
    \boldsymbol{\theta}_t)\) (31.20)

    \(= \prod_{i=1}^N \prod_{t=1}^V \prod_{c=1}^{C_t} \prod_{k=1}^{K_t} \theta_{tck}^{\mathbb{I}[(x_{i,t}=k,
    \boldsymbol{x}_{i,\text{pa}(t)}=c)]} = \prod_{t=1}^V \prod_{c=1}^{C_t} \prod_{k=1}^{K_t}
    \theta_{tck}^{N_{tck}}\) (31.21)

    ```


    where \(N_{tck}\) is the number of times node \(t\) is in state \(k\) and its
    parents are in state \(c\). (Technically these counts

    depend on the graph structure \(G\), but we drop this from the notation.)


    # 31.2.3.2 Deriving the marginal likelihood


    Choosing the graph with the maximum likelihood will always pick a fully connected
    graph (subject to the

    acyclicity constraint), since this maximizes the number of parameters. To avoid
    such overfitting, we will

    choose the graph with the maximum marginal likelihood, \(p(\mathcal{D}|G)\), where
    we integrate out the parameters; the

    magic of the Bayesian Occam’s razor (**??**) will then penalize overly complex
    graphs.


    To compute the marginal likelihood, we need to specify priors on the parameters.
    We will make two standard

    assumptions. First, we assume **global prior parameter independence**, which means
    \(p(\boldsymbol{\theta}) = \prod_{t=1}^V p(\boldsymbol{\theta}_t)\).

    Second, we assume **local prior parameter independence**, which means \(p(\boldsymbol{\theta}_t)
    = \prod_{c=1}^{C_t} p(\boldsymbol{\theta}_{tc})\) for each \(t\). It

    turns out that these assumptions imply that the prior for each row of each CPT
    must be a Dirichlet [GH97],

    that is, \(p(\boldsymbol{\theta}_{tc}) = \text{Dir}(\boldsymbol{\theta}_{tc}|\boldsymbol{\alpha}_{tc})\).
