    # ## 31.2.8.8 Example: Google''s Rephil


    In this section, we describe a huge DGM called **Rephil**, which was automatically
    learned from data.<sup>2</sup> The model is widely used inside Google for various
    purposes, including their famous AdSense system.<sup>3</sup>


    The model structure is shown in Figure 31.14. The leaves are binary nodes, and
    represent the presence or absence of words or compounds (such as “New York City”)
    in a text document or query. The latent variables are also binary, and represent
    clusters of co-occuring words. All CPDs are noisy-OR, since some leaf nodes (representing
    words) can have many parents. This means each edge can be augmented with a hidden
    variable specifying if the link was activated or not; if the link is not active,
    then the parent cannot turn the child on. (A very similar model was proposed independently
    in [SH06].)


    Parameter learning is based on EM, where the hidden activation status of each
    edge needs to be inferred [MH97]. Structure learning is based on the old neuroscience
    idea that “**nodes that fire together should wire together**”. To implement this,
    we run inference and check for cluster-word and cluster-cluster pairs that frequently
    turn on together. We then add an edge from parent to child if the link can significantly
    increase the probability of the child. Links that are not activated very often
    are pruned out. We initialize with one cluster per “document” (corresponding to
    a set of semantically related phrases). We then merge clusters A and B if A explains
    B’s top words and vice versa. We can also discard clusters that are used too rarely.


    <sup>2</sup>The original system, called “Phil”, was developed by Georges Harik
    and Noam Shazeer,. It has been published as US Patent #8024372, “Method and apparatus
    for learning a probabilistic generative model for text”, filed in 2004. Rephil
    is a more probabilistically sound version of the method, developed by Uri Lerner
    et al. The summary below is based on notes by Brian Milch (who also works at Google).


    <sup>3</sup>AdSense is Google''s system for matching web pages with content-appropriate
    ads in an automatic way, by extracting semantic keywords from web pages. These
    keywords play a role analogous to the words that users type in when searching;
    this latter form of information is used by Google''s AdWords system. The details
    are secret, but [Lev11] gives an overview.'
