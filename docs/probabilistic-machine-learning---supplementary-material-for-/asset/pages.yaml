    So a random surfer will visit site 1 about 32% of the time. We see that node 1
    has a higher PageRank than nodes 4 or 6, even though they all have the same number
    of in-links. This is because being linked to from an influential node helps increase
    your PageRank score more than being linked to by a less influential node.


