- pgno: 104
  md: 'If we define \(\mathbf{X}_i = \mathbf{I} \otimes \mathbf{x}_i\), where \(\otimes\)
    is the kronecker product, and \(\mathbf{I}\) is \(C \times C\) identity matrix,
    then we can write the logits as \(\boldsymbol{\eta}_i = \mathbf{X}_i\mathbf{w}\).
    (For example, if \(C = 2\) and \(\mathbf{x}_i = [1, 2, 3]\), we have \(\mathbf{X}_i
    = [1, 2, 3, 0, 0, 0; 0, 0, 0, 1, 2, 3]\).) Then the likelihood is given by


    ```

    \(p(\mathbf{y}|\mathbf{X}, \mathbf{w}) = \prod_{i=1}^N \exp[\mathbf{y}_i^\mathsf{T}\boldsymbol{\eta}_i
    - \text{lse}(\boldsymbol{\eta}_i)]\) (15.17)

    ```


    where lse() is the log-sum-exp function


    ```

    \(\text{lse}(\boldsymbol{\eta}_i) \triangleq \log \left( \sum_{c=1}^C \exp(\eta_{ic})
    \right)\) (15.18)

    ```


    For identifiability, we can set \(\mathbf{w}_C = \mathbf{0}\), so


    ```

    \(\text{lse}(\boldsymbol{\eta}_i) = \log \left( 1 + \sum_{m=1}^M \exp(\eta_{im})
    \right)\) (15.19)

    ```


    where \(M = C - 1\). (We subtract 1 so that in the binary case, \(M = 1\).)


    # 15.1.2.1 Bohning''s quadratic bound to the log-sum-exp function


    The above likelihood is not conjugate to the Gaussian prior. However, we will
    now can convert it to a quadratic form. Consider a Taylor series expansion of
    the log-sum-exp function around \(\boldsymbol{\psi}_i \in \mathbb{R}^M\):


    ```

    \(\text{lse}(\boldsymbol{\eta}_i) = \text{lse}(\boldsymbol{\psi}_i) + (\boldsymbol{\eta}_i
    - \boldsymbol{\psi}_i)^\mathsf{T}\mathbf{g}(\boldsymbol{\psi}_i) + \frac{1}{2}(\boldsymbol{\eta}_i
    - \boldsymbol{\psi}_i)^\mathsf{T}\mathbf{H}(\boldsymbol{\psi}_i)(\boldsymbol{\eta}_i
    - \boldsymbol{\psi}_i)\) (15.20)

    \(\mathbf{g}(\boldsymbol{\psi}_i) = \exp[\boldsymbol{\psi}_i - \text{lse}(\boldsymbol{\psi}_i)]
    = \mathcal{S}(\boldsymbol{\psi}_i)\) (15.21)

    \(\mathbf{H}(\boldsymbol{\psi}_i) = \text{diag}(\mathbf{g}(\boldsymbol{\psi}_i))
    - \mathbf{g}(\boldsymbol{\psi}_i)\mathbf{g}(\boldsymbol{\psi}_i)^\mathsf{T}\)
    (15.22)

    ```


    where \(\mathbf{g}\) and \(\mathbf{H}\) are the gradient and Hessian of lse, and
    \(\boldsymbol{\psi}_i \in \mathbb{R}^M\), where \(M = C - 1\) is the number of
    classes minus 1. An upper bound to lse can be found by replacing the Hessian matrix
    \(\mathbf{H}(\boldsymbol{\psi}_i)\) with a matrix \(\mathbf{A}_i\) such that \(\mathbf{A}_i
    \unknown \mathbf{H}(\boldsymbol{\psi}_i)\) for all \(\psi_i\). [Boh92] showed
    that this can be achieved if we use the matrix \(\mathbf{A}_i = \frac{1}{2} \left[
    \mathbf{I}_M - \frac{1}{M+1}\mathbf{1}_M\mathbf{1}_M^\mathsf{T} \right]\). In
    the binary case, this becomes \(A_i = \frac{1}{2}(1 - \frac{1}{2}) = \frac{1}{4}\).


    Note that \(\mathbf{A}_i\) is independent of \(\boldsymbol{\psi}_i\); however,
    we still write it as \(\mathbf{A}_i\) (rather than dropping the \(i\) subscript),
    since other bounds that we consider below will have a data-dependent curvature
    term. The upper bound on lse therefore becomes


    ```

    \(\text{lse}(\boldsymbol{\eta}_i) \leq \frac{1}{2}\boldsymbol{\eta}_i^\mathsf{T}\mathbf{A}_i\boldsymbol{\eta}_i
    - \mathbf{b}_i^\mathsf{T}\boldsymbol{\eta}_i + c_i\) (15.23)

    \(\mathbf{A}_i = \frac{1}{2} \left[ \mathbf{I}_M - \frac{1}{M+1}\mathbf{1}_M\mathbf{1}_M^\mathsf{T}
    \right]\) (15.24)

    \(\mathbf{b}_i = \mathbf{A}_i\boldsymbol{\psi}_i - \mathbf{g}(\boldsymbol{\psi}_i)\)
    (15.25)

    \(c_i = \frac{1}{2}\boldsymbol{\psi}_i^\mathsf{T}\mathbf{A}_i\boldsymbol{\psi}_i
    - \mathbf{g}(\boldsymbol{\psi}_i)^\mathsf{T}\boldsymbol{\psi}_i + \text{lse}(\boldsymbol{\psi}_i)\)
    (15.26)

    ```


    where \(\boldsymbol{\psi}_i \in \mathbb{R}^M\) is a vector of variational parameters.


    We can use the above result to get the following lower bound on the softmax likelihood:


    ```

    \(\log p(y_i = c|\mathbf{x}_i, \mathbf{w}) \geq \left[ \mathbf{y}_i^\mathsf{T}\mathbf{X}_i\mathbf{w}
    - 4\frac{1}{2}\mathbf{w}^\mathsf{T}\mathbf{X}_i\mathbf{A}_i\mathbf{X}_i\mathbf{w}
    + \mathbf{b}_i^\mathsf{T}\mathbf{X}_i\mathbf{w} - c_i \right]_c\) (15.27)

