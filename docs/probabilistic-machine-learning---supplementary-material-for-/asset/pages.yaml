    # 28.1.1.3 Posterior inference


    Many algorithms have been proposed to perform approximate posterior inference
    in the LDA model. In the original LDA paper, [BNJ03], they use variational mean
    field inference (see **??**), and in [HBB10], they use stochastic VI (see Section
    28.1.6). In Section 28.1.5 we discuss the collapsed Gibbs sampler, which marginalizes
    out the discrete latents. In [MB16; SS17] they discuss how to learned amortized
    inference networks to perform VI for the collapsed model.


    Recently, there has been considerable interest in spectral methods for fitting
    LDA-like models which are fast and which come with provable guarantees about the
    quality of the solution they obtain (unlike MCMC and variational methods, where
    the solution is just an approximation of unknown quality). These methods make
    certain (reasonable) assumptions beyond the basic model, such as the existence
    of some anchor words, which uniquely the topic for a document. See [Aro+13] for
    details.


    # 28.1.1.4 Determining the number of topics


    Choosing \(N_z\), the number of topics, is a standard model selection problem.
    Here are some approaches that have been taken:


    +   - Use annealed importance sampling (**??**) to approximate the evidence [Wal+09].

    +   - Cross validation, using the log likelihood on a test set.

    +   - Use the variational lower bound as a proxy for \(\log p(\mathcal{D}|N_z)\).

    +   - Use non-parametric Bayesian methods [Teh+06].


    # 28.1.2 Correlated topic model


    One weakness of LDA is that it cannot capture correlation between topics. For
    example, if a document has the “business” topic, it is reasonable to expect the
    “finance” topic to co-occur. The source of the problem is the use of a Dirichlet
    prior for \(z_n\). The problem with the Dirichlet is that it is characterized
    by just a mean vector \(\alpha\), but its covariance is fixed (\(\Sigma_{ij} =
    -\alpha_i\alpha_j\)), rather than being a free parameter.


    One way around this is to replace the Dirichlet prior with the **logistic normal
    distribution**, which is defined as follows:


    ```

    \(p(z) = \int \text{Cat}(z|\mathcal{S}(\epsilon))\mathcal{N}(\epsilon|\mu, \Sigma)d\epsilon\)
    (28.3)

    ```


    This is known as the **correlated topic model** [BL07]:


    The difference from categorical PCA discussed in **??** is that CTM uses a logistic
    normal to model the mean parameters, so \(z_n\) is sparse and non-negative, whereas
    CatPCA uses a normal to model the natural parameters, so \(z_n\) is dense and
    can be negative. More precisely, the CTM defines \(x_{nl} \sim \text{Cat}(\mathbf{W}\mathcal{S}(\epsilon_n))\),
    but CatPCA defines \(x_{nd} \sim \text{Cat}(\mathcal{S}(\mathbf{W}_d z_n))\).


    Fitting the CTM model is tricky, since the prior for \(\epsilon_n\) is no longer
    conjugate to the multinomial likelihood for \(c_{nl}\). However, we can derive
    a variational mean field approximation, as described in [BL07].


    Having fit the model, one can then convert \(\hat{\Sigma}\) to a sparse precision
    matrix \(\hat{\Sigma}^{-1}\) by pruning low-strength edges, to get a sparse Gaussian
    graphical model. This allows you to visualize the correlation between topics.
    Figure 28.5 shows the result of applying this procedure to articles from *Science*
    magazine, from 1990-1999.


    # 28.1.3 Dynamic topic model


    In LDA, the topics (distributions over words) are assumed to be static. In some
    cases, it makes sense to allow these distributions to evolve smoothly over time.
    For example, an article might use the topic “neuroscience”, but if it was written
    in the 1900s, it is more likely to use words like “nerve”, whereas if it was written
    in the'
