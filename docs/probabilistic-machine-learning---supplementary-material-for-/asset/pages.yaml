  md: 'In more detail, define $\mathbb{L}_t(G)$ to be the set of all pseudo-marginals
    such that normalization and marginalization constraints hold on a hyper-graph
    whose largest hyper-edge is of size $t + 1$. For example, in Figure **??**, we
    impose constraints of the form


    $$\sum_{x_1, x_2} \tau_{1245}(x_1, x_2, x_4, x_5) = \tau_{45}(x_4, x_5), \sum_{x_6}
    \tau_{56}(x_5, x_6) = \tau_5(x_5), \dots$$ (10.26)


    Furthermore, we approximate the entropy as follows:


    $$\mathbb{H}_{\text{Kikuchi}}(\boldsymbol{\tau}) \triangleq \sum_{g \in E} c(g)
    H_g(\tau_g)$$ (10.27)


    where $H_g(\tau_g)$ is the entropy of the joint (pseudo) distribution on the vertices
    in set $g$, and $c(g)$ is called the **overcounting number** of set $g$. These
    are related to **Mobius numbers** in set theory. Rather than giving a precise
    definition, we just give a simple example. For the graph in Figure **??**, we
    have


    $$\mathbb{H}_{\text{Kikuchi}}(\boldsymbol{\tau}) = -[H_{1245} + H_{2356} + H_{4578}
    + H_{5689}] - [H_{25} + H_{45} + H_{56} + H_{58}] + H_5$$ (10.28)


    Putting these two approximations together, we can define the **Kikuchi free energy**$^2$
    as follows:


    $$\mathcal{F}_{\text{Kikuchi}}(\boldsymbol{\tau}) \triangleq -[\boldsymbol{\theta}^T
    \boldsymbol{\tau} + \mathbb{H}_{\text{Kikuchi}}(\boldsymbol{\tau})] \approx -\log
    Z$$ (10.29)


    Our variational problem becomes


    $$\max_{\tau \in \mathbb{L}(G)} \boldsymbol{\theta}^T \boldsymbol{\tau} + \mathbb{H}_{\text{Kikuchi}}(\boldsymbol{\tau})$$
    (10.30)


    Just as with the Bethe free energy, this is not a concave objective. There are
    several possible algorithms for finding a local optimum of this objective, including
    generalized belief propagation. For details, see e.g., [WJ08, Sec 4.2] or [KF09,
    Sec 11.3.2].


    # ## 10.1.4 Convex belief propagation


    The mean field energy functional is concave, but it is maximized over a non-convex
    inner approximation to the marginal polytope. The Bethe and Kikuchi energy functionals
    are not concave, but they are maximized over a convex outer approximation to the
    marginal polytope. Consequently, for both MF and LBP, the optimization problem
    has multiple optima, so the methods are sensitive to the initial conditions. Given
    that the exact formulation Equation (10.4) is a concave objective maximized over
    a convex set, it is natural to try to come up with an approximation of a similar
    form, without local optima.


    **Convex belief propagation** involves working with a set of tractable submodels,
    $\mathcal{F}$, such as trees or planar graphs. For each model $F \subset G$, the
    entropy is higher, $\mathbb{H}(\boldsymbol{\mu}(F)) \ge \mathbb{H}(\boldsymbol{\mu}(G))$,
    since $F$ has fewer constraints. Consequently, any convex combination of such
    subgraphs will have higher entropy, too:


    $$\mathbb{H}(\boldsymbol{\mu}(G)) \le \sum_{F \in \mathcal{F}} \rho(F) \mathbb{H}(\boldsymbol{\mu}(F))
    \triangleq \mathbb{H}(\boldsymbol{\mu}, \rho)$$ (10.31)


    where $\rho(F) \ge 0$ and $\sum_F \rho(F) = 1$. Furthermore, $\mathbb{H}(\boldsymbol{\mu},
    \rho)$ is a concave function of $\boldsymbol{\mu}$.


    Having defined an upper bound on the entropy, we now consider a convex outerbound
    on the marginal polytope of mean parameters. We want to ensure we can evaluate
    the entropy of any vector $\boldsymbol{\tau}$ in this set, so we restrict it so
    that the projection of $\boldsymbol{\tau}$ onto the subgraph $G$ lives in the
    projection of $\mathbb{M}$ onto $F$:


    $$\mathbb{L}(G; \mathcal{F}) \triangleq \{ \boldsymbol{\tau} \in \mathbb{R}^d
    : \boldsymbol{\tau}(F) \in \mathbb{M}(F) \, \forall F \in \mathcal{F} \}$$ (10.32)


    This is a convex set since each $\mathbb{M}(F)$ is a projection of a convex set.
    Hence we define our problem as


    $$\max_{\boldsymbol{\tau} \in \mathbb{L}(G; \mathcal{F})} \boldsymbol{\tau}^T
    \boldsymbol{\theta} + \mathbb{H}(\boldsymbol{\tau}, \rho)$$ (10.33)


    $^2$Ryoichi Kikuchi is a Japanese physicist.'
