    with hidden diseases (causes) at the top and visible symptoms or findings at the
    bottom. We can write the distribution as follows:


    \( p(\mathbf{z}, \mathbf{x}) = \prod_{k=1}^K p(z_k) \prod_{d=1}^D p(x_d | \mathbf{x}_{\text{pa}(d)})
