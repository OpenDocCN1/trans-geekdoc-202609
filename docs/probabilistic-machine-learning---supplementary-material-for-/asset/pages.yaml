    # 31.2.3.3 Setting the prior


    How should we set the hyper-parameters \(\alpha_{tck}\)? It is tempting to use
    a Jeffreys prior of the form \(\alpha_{tck} = \frac{1}{2}\) (?). However, it turns
    out that this violates a property called **likelihood equivalence**, which is
    sometimes considered desirable. This property says that if \(G_1\) and \(G_2\)
    are Markov equivalent (Section 31.2.2), they should have the same marginal likelihood,
    since they are essentially equivalent models. Geiger and Heckerman [GH97] proved
    that, for complete graphs, the only prior that satisfies likelihood equivalence
    and parameter independence is the Dirichlet prior, where the pseudo counts have
    the form


    $$ \alpha_{tck} = \alpha p_0(x_t = k, \mathbf{x}_{\text{pa}(t)} = c) $$ (31.27)


    where \(\alpha > 0\) is called the **equivalent sample size**, and \(p_0\) is
    some prior joint probability distribution. This is called the **BDe** prior, which
    stands for Bayesian Dirichlet likelihood equivalent.


    To derive the hyper-parameters for other graph structures, Geiger and Heckerman
    [GH97] invoked an additional assumption called **parameter modularity**, which
    says that if node \(X_t\) has the same parents in \(G_1\) and \(G_2\), then \(p(\boldsymbol{\theta}_t|G_1)
    = p(\boldsymbol{\theta}_t|G_2)\). With this assumption, we can always derive \(\boldsymbol{\alpha}_t\)
    for a node \(t\) in any other graph by marginalizing the pseudo counts in Equation
    (31.27).


    Typically the prior distribution \(p_0\) is assumed to be uniform over all possible
    joint configurations. In this case, we have \(\alpha_{tck} = \frac{\alpha}{K_t
    C_t}\), since \(p_0(x_t = k, \mathbf{x}_{\text{pa}(t)} = c) = \frac{1}{K_t C_t}\).
    Thus if we sum the pseudo counts over all \(C_t \times K_t\) entries in the CPT,
    we get a total equivalent sample size of \(\alpha\). This is called the **BDeu**
    prior, where the "u" stands for uniform. This is the most widely used prior for
    learning Bayes net structures. For advice on setting the global tuning parameter
    \(\alpha\), see [SKM07].


    # 31.2.3.4 Example: analysis of the college plans dataset


    We now consider a larger example from [HMC97], who analyzed a dataset of 5 variables,
    related to the decision of high school students about whether to attend college.
    Specifically, the variables are as follows:


    +   * Sex: Male or female

    +   * SES: Socio economic status: low, lower middle, upper middle or high.

    +   * IQ: Intelligence quotient: discretized into low, lower middle, upper middle
    or high.

    +   * PE: Parental encouragement: low or high

    +   * CP: College plans: yes or no.


    These variables were measured for 10,318 Wisconsin high school seniors. There
    are \(2 \times 4 \times 4 \times 2 \times = 128\) possible joint configurations.


    Heckerman et al. computed the exact posterior over all 29,281 possible 5 node
    DAGs, except for ones in which SEX and/or SES have parents, and/or CP have children.
    (The prior probability of these graphs was set to 0, based on domain knowledge.)
    They used the BDeu score with \(\alpha = 5\), although they said that the results
    were robust to any \(\alpha\) in the range 3 to 40. The top two graphs are shown
    in Figure 31.6. We see that the most probable one has approximately all of the
    probability mass, so the posterior is extremely peaked.


    It is tempting to interpret this graph in terms of causality (see **??** for a
    detailed discussion of this topic). In particular, it seems that socio-economic
    status, IQ and parental encouragement all causally influence the decision about
    whether to go to college, which makes sense. Also, sex influences college plans
    only indirectly through parental encouragement, which also makes sense. However,
    the direct link from socio economic status to IQ seems surprising; this may due
    to a hidden common cause. In Section 31.2.8.5 we will re-examine this dataset
    allowing for the presence of hidden variables.'
