    # 3.2.2 Gaussian prior


    Looking at Figure 3.7(a-b), it seems clear that life-spans and movie run-times
    can be well-modeled by a Gaussian, \(\mathcal{N}(T|\mu, \sigma^2)\). Unfortunately,
    we cannot compute the posterior median in closed form if we use a Gaussian prior,
