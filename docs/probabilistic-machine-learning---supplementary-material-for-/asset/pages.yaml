    # 31.3.1 Dependency networks


    A simple way to learn the structure of a UGM is to represent it is as a product
    of full conditionals:


    ```

    $$p(\boldsymbol{x}) = \frac{1}{Z} \prod_{d=1}^D p(x_d|\boldsymbol{x}_{-d})$$ (31.43)

    ```


    This expression is called the **pseudolikelihood**.


    Such a collection of local distributions defines a model called a **dependency
    network** [Hec+00]. Unfortunately, a product of full conditionals which are independently
    estimated is not guaranteed to be consistent with any valid joint distribution.
    However, we can still use the model inside of a Gibbs sampler to approximate a
    joint distribution. This approach is sometimes used for data imputation [GR01].


    However, the main main advantage of dependency networks is that we can use sparse
    regression techniques for each distribution $p(x_d|\boldsymbol{x}_{-d})$ to induce
    a sparse graph structure. For example, [Hec+00] use classification/regression
    trees, [MB06] use $\ell_1$-regularized linear regression, [WRL06; WSD19] use $\ell_1$-regularized
    logistic regression, [Dob09] uses Bayesian variable selection, etc.


