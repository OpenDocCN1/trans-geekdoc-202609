- pgno: 56
  md: 'We can tackle such matrix decomposition problems using ADMM, where we use the
    split $\mathcal{L}_s(\mathbf{X}) = \sum_j \gamma_j \phi_j(\mathbf{X}_j)$ and $\mathcal{L}_r(\mathbf{X})
    = I_C(\mathbf{X})$, where $\mathbf{X} = (\mathbf{X}_1, \dots, \mathbf{X}_J)$ and
    $\mathcal{C} = \{ \mathbf{X}_{1:J} : \sum_{j=1}^J \mathbf{X}_j = \mathbf{A} \}$.
    The overall algorithm becomes


    ```

    $$\mathbf{X}_{j, t+1} = \text{prox}_{\eta_t \phi_j}(\mathbf{X}_{j, t} - \overline{\mathbf{X}}_t
    + \frac{1}{N}\mathbf{A} - \mathbf{U}_t)$$ (6.68)

    ```


    ```

    $$\mathbf{U}_{t+1} = \mathbf{U}_t + \overline{\mathbf{X}}_{t+1} - \frac{1}{J}\mathbf{A}$$
    (6.69)

    ```


    where $\overline{\mathbf{X}}$ is the elementwise average of $\mathbf{X}_1, \dots,
    \mathbf{X}_J$. Note that the $\mathbf{X}_j$ can be updated in parallel.


    Projection onto the $\ell_1$ norm is discussed in Section 6.1.2.3, projection
    onto the nuclear norm is discussed in Section 6.1.2.6, projection onto the squared
    Frobenius norm is the same as projection onto the squared Euclidean norm discussed
    in Section 6.1.2.5, and projection onto the constraint set $\sum_j \mathbf{X}_j
    = \mathbf{A}$ can be done using the averaging operator:


    ```

    $$\text{proj}_{\mathcal{C}}(\mathbf{X}_1, \dots, \mathbf{X}_J) = (\mathbf{X}_1,
    \dots, \mathbf{X}_J) - \overline{\mathbf{X}} + \frac{1}{J}\mathbf{A}$$ (6.70)

    ```


    An alternative to using $\ell_1$ minimization in the inner loop is to use hard
    thresholding [CGJ17]. Although not convex, this method can be shown to converge
    to the global optimum, and is much faster.


    It is also possible to formulate a non-negative version of robust PCA. Even though
    NRPCA is not a convex problem, it is possible to find the globally optimal solution
    [Fat18; AS19].


    # ## 6.2 Local search


    In this section, we discuss heuristic optimization algorithms that try to find
    the global maximum in a discrete, unstructured search space. These algorithms
    replace the local gradient based update, which has the form \(\boldsymbol{\theta}_{t+1}
    = \boldsymbol{\theta}_t + \eta_t \mathbf{d}_t\), with the following discrete analog:


    ```

    $$\mathbf{x}_{t+1} = \underset{\mathbf{x} \in \text{nbr}(\mathbf{x}_t)}{\text{argmax}}
    \mathcal{L}(\mathbf{x})$$ (6.71)

    ```


    where $\text{nbr}(\mathbf{x}_t) \subseteq \mathcal{X}$ is the set of **neighbors**
    of $\mathbf{x}_t$. This is called hill climbing, steepest ascent, or **greedy
    search**.


