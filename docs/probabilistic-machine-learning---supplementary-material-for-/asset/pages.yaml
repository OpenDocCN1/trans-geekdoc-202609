    to certain kinds of optimization problems. The key requirement is that the optimal
    solution be expressed in terms of the optimal solution to smaller subproblems,
    which can be reused many times. Note that DP is more of an algorithm "family"
    rather than a specific algorithm. We give some examples below.'
