    \sum_{n=1}^{N_x} (x_n - z)^2 = 0\) (2.54)

    \(\frac{\partial \ell}{\partial \lambda_y} = \frac{1}{\lambda_y} - \frac{1}{N_y}
    \sum_{n=1}^{N_y} (y_n - z)^2 = 0\) (2.55)


