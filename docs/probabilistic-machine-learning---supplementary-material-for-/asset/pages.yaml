    In addition to "rule-like" hypotheses, we consider the set of intervals between
    n and m for 1 <= n, m <= 100. This allows us to capture concepts based on being
    "close to" some number, rather than satisfying some more abstract property. We
    put a uniform prior over the intervals.


    We can combine these two priors by using a **mixture distribution**, as follows:


    ```

    p(h) = \pi \text{Unif}(h|\text{rules}) + (1 - \pi) \text{Unif}(h|\text{intervals})
    (3.2)

    ```


    where 0 < \pi < 1 is the **mixture weight** assigned to the rules prior, and Unif(h|S)
    is the uniform distribution over the set S.


    # 3.1.1.3 Posterior


    The posterior is simply the likelihood times the prior, normalized: p(h|D) \propto
    p(D|h)p(h). Figure 3.3a plots the prior, likelihood and posterior after seeing
    D = {16}. (In this figure, we only consider rule-like hypotheses, not intervals,
    for simplicity.) We see that the posterior is a combination of prior and likelihood.
    In the case of most of the concepts, the prior is uniform, so the posterior is
    proportional to the likelihood. However, the "unnatural" concepts of "powers of
    2, plus 37" and "powers of 2, except 32" have low posterior support, despite having
    high likelihood, due to the low prior. Conversely, the concept of odd numbers
    has low posterior support, despite having a high prior, due to the low likelihood.


    Figure 3.3b plots the prior, likelihood and posterior after seeing D = {16, 8,
    2, 64}. Now the likelihood is much more peaked on the powers of two concept, so
    this dominates the posterior. Essentially the learner has an "aha" moment, and
    figures out the true concept.^2 This example also illustrates why we need the
    low prior on the unnatural concepts, otherwise we would have overfit the data
    and picked "powers of 2, except for 32".


    # 3.1.1.4 Posterior predictive


    The posterior over hypotheses is our internal **belief state** about the world.
    The way to test if our beliefs are justified is to use them to predict objectively
    observable quantities (this is the basis of the scientific method). To do this,
    we compute the **posterior predictive distribution** over possible future observations:


    ```

    p(y|\mathcal{D}) = \sum_h p(y|h)p(h|\mathcal{D}) (3.3)

    ```


    ^2Humans have a natural desire to figure things out; Alison Gopnik, in her paper
    "Explanation as orgasm" [Gop98], argued that evolution has ensured that we enjoy
    reducing our posterior uncertainty.'
