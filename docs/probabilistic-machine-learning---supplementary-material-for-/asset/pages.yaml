    # 2.2.2 The PageRank score


    So far, we have described the standard process of information retrieval. But the
    link structure of the web provides an additional source of information. The basic
    idea is that some web pages are more authoritative than others, so these should
    be ranked higher (assuming they match the query). A web page is a considered an
    **authority** if it is linked to by many other pages. But to protect against the
    effect of so-called **link farms**, which are dummy pages which just link to a
    given site to boost its apparent relevance, we will weight each incoming link
    by the source''s authority. Thus we get the following recursive definition for
    the authoritativeness of page \( j \), also called its **PageRank**:


    \(\pi_j = \sum_i A_{ij} \pi_i\) (2.69)


    where \( A_{ij} \) is the probability of following a link from \( i \) to \( j
    \). (The term “PageRank” is named after Larry Page, one of Google’s co-founders.)


    We recognize Equation (2.69) as the stationary distribution of a Markov chain.
    But how do we define the transition matrix? In the simplest setting, we define
    \( A_{i:} \) as a uniform distribution over all states that \( i \) is connected
    to. However, to ensure the distribution is unique, we need to make the chain into
    a regular chain. This can be done by allowing each state \( i \) to jump to any
    other state (including itself) with some small probability. This effectively makes
    the transition matrix aperiodic and fully connected (although the adjacency matrix
    \( G_{ij} \) of the web itself is highly sparse).


    We discuss efficient methods for computing the leading eigenvector of this giant
    matrix below. Here we ignore computational issues, and just give some examples.


