    In [VP90], they prove the following theorem.


    **Theorem 31.2.1.** Two structures are Markov equivalent iff they have the same
    **skeleton**, i.e., the have the same edges _(disregarding direction)_ and they
    have the same set of _v-structures_ (colliders whose parents are not adjacent).


