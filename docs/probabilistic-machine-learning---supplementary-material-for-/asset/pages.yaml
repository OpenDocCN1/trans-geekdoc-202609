- pgno: 90
  md: '# 10.1.5.2 Message passing implementation


    The simplest way to minimize Equation (10.35) is a modification of belief propagation
    known as **tree reweighted belief propagation**. The message from \(t\) to \(s\)
    is now a function of all messages sent from other neighbors \(v\) to \(t\), as
    before, but now it is also a function of the message sent from \(s\) to \(t\).
    Specifically, we have the following [WJ08, Sec 7.2.1]:


    \(m_{t \to s}(x_s) \propto \sum_{x_t} \exp \left( \frac{1}{\rho_{st}} \theta_{st}(x_s,
    x_t) + \theta_t(x_t) \right) \frac{\prod_{v \in \text{nbr}(t) \setminus s} [m_{v
    \to t}(x_t)]^{\rho_{vt}}}{[m_{s \to t}(x_t)]^{1 - \rho_{st}}}\)


    At convergence, the node and edge pseudo marginals are given by


    \(\tau_s(x_s) \propto \exp(\theta_s(x_s)) \prod_{v \in \text{nbr}(s)} [m_{v \to
    s}(x_s)]^{\rho_{vs}}\)


    \(\tau_{st}(x_s, x_t) \propto \varphi_{st}(x_s, x_t) \frac{\prod_{v \in \text{nbr}(s)
    \setminus t} [m_{v \to s}(x_s)]^{\rho_{vs}}}{[m_{t \to s}(x_s)]^{1 - \rho_{st}}}
    \frac{\prod_{v \in \text{nbr}(t) \setminus s} [m_{v \to t}(x_t)]^{\rho_{vt}}}{[m_{s
    \to t}(x_t)]^{1 - \rho_{st}}}\)


    \(\varphi_{st}(x_s, x_t) \triangleq \exp \left( \frac{1}{\rho_{st}} \theta_{st}(x_s,
    x_t) + \theta_s(x_s) + \theta_t(x_t) \right)\)


    If \(\rho_{st} = 1\) for all edges \((s, t) \in E\), the algorithm reduces to
    the standard LBP algorithm. However, the condition \(\rho_{st} = 1\) implies every
    edge is present in every spanning tree with probability 1, which is only possible
    if the original graph is a tree. Hence the method is only equivalent to standard
    LBP on trees, when the method is of course exact.


    In general, this message passing scheme is not guaranteed to converge to the unique
    global optimum. One can devise double-loop methods that are guaranteed to converge
    [HS08], but in practice, using damped updates as in Equation ?? is often sufficient
    to ensure convergence.


    # 10.1.5.3 Max-product version


    We can modify TRBP to solve the MAP estimation problem (as opposed to estimating
    posterior marginals) by replacing sums with products in Equation (10.36) (see
    [WJ08, Sec 8.4.3] for details). This is guaranteed to converge to the LP relaxation
    discussed in Section 9.1.3 under a suitable scheduling known as **sequential tree-reweighted
    message passing** [Kol06].


    # 10.1.6 Other tractable versions of convex BP


    It is possible to upper bound the entropy using convex combinations of other kinds
    of tractable models besides trees. One example is a **planar MRF** (one where
    the graph has no edges that cross), with binary nodes and no external field, i.e.,
    the model has the form \(p(\mathbf{x}) \propto \exp(\sum_{(s,t) \in E} \theta_{st}
    x_s x_t)\). It turns out that it is possible to perform exact inference in this
    model. Hence one can use convex combinations of such graphs which can sometimes
    yield more accurate results than TRBP, albeit at higher computational cost. See
    [GJ07] for details, and [Sch10b] for a related *exact* method for planar Ising
    models.'
