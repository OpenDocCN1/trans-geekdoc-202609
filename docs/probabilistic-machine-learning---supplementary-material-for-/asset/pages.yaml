    # ## 31.3.2 Graphical lasso for GGMs


    In this section, we consider the problem of learning the structure of undirected
    Gaussian graphical models (GGM)s. These models are useful, since there is a 1:1
    mapping between sparse parameters and sparse graph structures. This allows us
    to extend the efficient techniques of $\ell_1$ regularized estimation in **??**
    to the graph case; the resulting method is called the **graphical lasso** or **Glasso**
    [FHT08; MH12].


    # ### 31.3.2.1 MLE for a GGM


    Before discussing structure learning, we need to discuss parameter estimation.
    The task of computing the MLE for a (non-decomposable) GGM is called **covariance
    selection** [Dem72].


    The log likelihood can be written as


    ```

    $$\ell(\Omega) = \log \det \Omega - \text{tr}(\mathbf{S}\Omega)$$ (31.44)

    ```


    where $\Omega = \Sigma^{-1}$ is the precision matrix, and $\mathbf{S} = \frac{1}{N}
    \sum_{i=1}^N (\mathbf{x}_i - \overline{\mathbf{x}})(\mathbf{x}_i - \overline{\mathbf{x}})^\top$
    is the empirical covariance matrix. (For notational simplicity, we assume we have
    already estimated $\hat{\boldsymbol{\mu}} = \overline{\mathbf{x}}$.) One can show
    that the gradient of this is given by


    ```

    $$\nabla \ell(\Omega) = \Omega^{-1} - \mathbf{S}$$ (31.45)

    ```


    However, we have to enforce the constraints that $\Omega_{st} = 0$ if $G_{st}
    = 0$ (structural zeros), and that $\Omega$ is positive definite. The former constraint
    is easy to enforce, but the latter is somewhat challenging (albeit still a convex
    constraint). One approach is to add a penalty term to the objective if $\Omega$
    leaves the positive definite cone; this is the approach used in [DVR08]. Another
    approach is to use a coordinate descent method, described in [HTF09, p633].


    Interestingly, one can show that the MLE must satisfy the following property:
    $\Sigma_{st} = S_{st}$ if $G_{st} = 1$ or $s = t$, i.e., the covariance of a pair
    that are connected by an edge must match the empirical covariance. In addition,
    we have $\Omega_{st} = 0$ if $G_{st} = 0$, by definition of a GGM, i.e., the precision
    of a pair that are not connected must be 0. We say that $\mathbf{\Sigma}$ is a
    positive definite **matrix completion** of $\mathbf{S}$, since it retains as many
    of the entries in $\mathbf{S}$ as possible, corresponding to the edges in the
    graph, subject to the required sparsity pattern on $\Sigma^{-1}$, corresponding
    to the absent edges; the remaining entries in $\mathbf{\Sigma}$ are filled in
    so as to maximize the likelihood.'
