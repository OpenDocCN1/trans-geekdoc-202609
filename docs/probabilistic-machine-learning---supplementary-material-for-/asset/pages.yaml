    # 6.3.2 Metaheuristic algorithms


    The term “metaheuristics” is often used to describe different kinds of local or
    population-based search algorithms (see e.g., [Luk13]). There are many types of
    metaheuristic algorithms, and several ways to categorize them, as shown in Figure
    6.8. Many of these algorithms are “inspired” by natural phenomena. For example,
    [AQ+20] proposes to tackle covid19 forecasting using “an improved adaptive neuro-fuzzy
    inference system (ANFIS) using an enhanced flower pollination algorithm (FPA)
    by using the salp swarm algorithm (SSA)”, and [Mol+18] uses “Chicken Swarm Optimization
    and Deep Learning for Manufacturing Processes”. However, such “inspiration” usually
    results in ad-hoc algorithms, with no theoretical support (and therefore little
    reason to use them). As Glover and Sorensen [GS15] memorably put it


    A large (and increasing) number of publications focuses on the development of
    (supposedly) new metaheuristic frameworks based on metaphors. The list of natural
    or man-made processes that has been used as the basis for a metaheuristic framework
    now includes such diverse processes as bacterial foraging, river formation, biogeography,
    musicians playing together, electromagnetism, gravity, colonization by an empire,
    mine blasts, league championships, clouds, and so forth. An important subcategory
    is found in metaheuristics based on animal behavior. Ants, bees, bats, wolves,
    cats, fireflies, eagles, dolphins, frogs, salmon, vultures, termites, flies, and
    many others, have all been used to inspire a “novel” metaheuristic. [...] As a
    general rule, publication of papers on metaphor-based metaheuristics has been
    limited to second-tier journals and conferences, but some recent exceptions to
    this rule can be found. Sörensen [Sör15] states that research in this direction
    is fundamentally flawed.'
