    This is called **random restart hill climbing**. To see the benefit of this, consider
    again the 8-queens problem. If each hill-climbing search has a probability of
    \( p \approx 0.14 \) of success, then we expect to need \( R = 1/p \approx 7 \)
    restarts until we find a valid solution. The expected number of total steps can
    be computed as follows. Let \( N_1 = 4 \) be the average number of steps for successful
    trials, and \( N_0 = 3 \) be the average number of steps for failures. Then the
    total number of steps on average is \( N_1 + (R - 1)N_0 = 4 + 6 \times 3 = 22
    \). Since each step is quick, the overall method is very fast. For example, it
    can solve an \( n \)-queens problem with \( n = 1\text{M} \) in under a minute.


    Of course, solving the \( n \)-queens problem is not the most useful task in practice.
    However, it is typical of several real-world **boolean satisfiability problems**,
    which arise in problems ranging from AI planning to model checking (see e.g.,
    [SLM92]). In such problems, simple **stochastic local search (SLS)** algorithms
    of the kind we have discussed work surprisingly well (see e.g., [HS05]).


    # 6.2.2 Tabu search


    ```

    Algorithm 1: Tabu search.

    1 t := 0 // counts iterations ;

    2 c := 0 // counts number of steps with no progress;

    3 Initialize x_0 ;

    4 x* := x_0 // current best incumbent;

    5 while c < c_max do

    6   x_{t+1} = argmax_{x \in nbr(x_t) \\ {x_{t-\tau}, ..., x_{t-1}}} f(x);

    7   if f(x_t) > f(x*) then

    8     x* := x_t ;

    9     c := 0

    10   else

    11     c := c + 1

    12   t := t + 1

    13 return x*

    ```


    Hill climbing will stop as soon as it reaches a local maximum or a plateau. Obviously
    one can perform a random restart, but this would ignore all the information that
    had been gained up to this point. A more intelligent alternative is called **tabu
    search [GL97]**. This is like hill climbing, except it allows moves that decrease
    (or at least do not increase) the scoring function, provided the move is to a
    new state that has not been seen before. We can enforce this by keeping a tabu
    list which tracks the \(\tau\) most recently visited states. This forces the algorithm
    to explore new states, and increases the chances of escaping from local maxima.
    We continue to do this for up to \( c_{max} \) steps (known as the “tabu tenure”).
    The pseudocode can be found in Algorithm 1. (If we set \( c_{max} = 1 \), we get
    greedy hill climbing.)


    For example, consider what happens when tabu search reaches a hill top, \( x_t
    \). At the next step, it will move to one of the neighbors of the peak, \( x_{t+1}
    \in nbr(x_t) \), which will have a lower score. At the next step, it will move
    to the neighbor of the previous step, \( x_{t+2} \in nbr(x_{t+1}) \); the tabu
    list prevents it cycling back to \( x_t \) (the peak), so it will be forced to
    pick a neighboring point at the same height or lower. It continues in this way,
    “circling” the peak, possibly being forced downhill to a lower level-set (an inverse
    **basin flooding** operation), until it finds a ridge that leads to a new peak,
    or until it exceeds a maximum number of non-improving moves.


    According to [RN10, p.123], tabu search increases the percentage of 8-queens problems
    that can be solved from 14% to 94%, although this variant takes an average of
    21 steps for each successful instance and 64 steps for each failed instance.'
