- pgno: 10
  md: '# Chapter 2

    Probability


    # 2.1 More fun with Gaussians


    # 2.1.1 Deriving the conditionals of an MVN


    Consider a joint Gaussian of the form \(p(x_1, x_2) = \mathcal{N}(x|\mu, \Sigma)\),
    where


    \(\mu = \begin{pmatrix} \mu_1 \\ \mu_2 \end{pmatrix}, \quad \Sigma = \begin{pmatrix}
    \Sigma_{11} & \Sigma_{12} \\ \Sigma_{21} & \Sigma_{22} \end{pmatrix}\)


    In ??, we claimed that


    \(p(x_1|x_2) = \mathcal{N}(x_1|\mu_1 + \Sigma_{12}\Sigma_{22}^{-1}(x_2 - \mu_2),
    \Sigma_{11} - \Sigma_{12}\Sigma_{22}^{-1}\Sigma_{21})\)


    In this section, we derive this result using Schur complemens.


    Let us factor the joint \(p(x_1, x_2)\) as \(p(x_2)p(x_1|x_2)\) as follows:


    \(p(x_1, x_2) \propto \exp \left\{ -\frac{1}{2} \begin{pmatrix} x_1 - \mu_1 \\
    x_2 - \mu_2 \end{pmatrix}^T \begin{pmatrix} \Sigma_{11} & \Sigma_{12} \\ \Sigma_{21}
    & \Sigma_{22} \end{pmatrix}^{-1} \begin{pmatrix} x_1 - \mu_1 \\ x_2 - \mu_2 \end{pmatrix}
    \right\}\)


    Using ?? the above exponent becomes


    \(p(x_1, x_2) \propto \exp \left\{ -\frac{1}{2} \begin{pmatrix} x_1 - \mu_1 \\
    x_2 - \mu_2 \end{pmatrix}^T \begin{pmatrix} \mathbf{I} & \mathbf{0} \\ -\Sigma_{22}^{-1}\Sigma_{21}
    & \mathbf{I} \end{pmatrix} \begin{pmatrix} (\Sigma/\Sigma_{22})^{-1} & \mathbf{0}
    \\ \mathbf{0} & \Sigma_{22}^{-1} \end{pmatrix} \right.\)

    \(\times \left. \begin{pmatrix} \mathbf{I} & -\Sigma_{12}\Sigma_{22}^{-1} \\ \mathbf{0}
    & \mathbf{I} \end{pmatrix} \begin{pmatrix} x_1 - \mu_1 \\ x_2 - \mu_2 \end{pmatrix}
    \right\}\)

    \(= \exp \left\{ -\frac{1}{2} (x_1 - \mu_1 - \Sigma_{12}\Sigma_{22}^{-1}(x_2 -
    \mu_2))^T (\Sigma/\Sigma_{22})^{-1} \right.\)

    \((x_1 - \mu_1 - \Sigma_{12}\Sigma_{22}^{-1}(x_2 - \mu_2)) \right\} \times \exp
    \left\{ -\frac{1}{2} (x_2 - \mu_2)^T \Sigma_{22}^{-1} (x_2 - \mu_2) \right\}\)


    This is of the form


    \(\exp(\text{quadratic form in } x_1, x_2) \times \exp(\text{quadratic form in
    } x_2)\)


    Hence we have successfully factorized the joint as


    \(p(x_1, x_2) = p(x_1|x_2)p(x_2)\)

    \(= \mathcal{N}(x_1|\mu_{1|2}, \Sigma_{1|2})\mathcal{N}(x_2|\mu_2, \Sigma_{22})\)'
