    choice of prior for these parameters is discussed in **??**.)


    The above formulation is asymmetric in the genders. In particular, the log odds
    for males has two random variables associated with it, and hence is a priori is
    more uncertain. It is often better to rewrite the model in the following symmetric
    way:


    ```

    \(A_i \sim \text{Bin}(N_i, \mu_i)\) (15.61)

    \(\text{logit}(\mu_i) = \alpha_{\text{GENDER}[i]}\) (15.62)

    \(\alpha_j \sim \mathcal{N}(0, 1.5), j \in \{1, 2\}\) (15.63)

    ```


    Here GENDER[i] is the gender (1 for male, 2 for female), so the log odds is \(\alpha_1\)
    for males and \(\alpha_2\) for females.


    We can perform posterior inference using a variety of methods (see **??**). Here
    we use HMC (**??**). We find the 89% credible interval for \(\alpha_1\) is \([-0.29,
    0.16]\) and for \(\alpha_2\) is \([-0.91, 0.75]\).<sup>1</sup> The corresponding
    distribution for the difference in probability, \(\sigma(\alpha_1) - \sigma(\alpha_2)\),
    is \([0.12, 0.16]\), with a mean of 0.14. So it seems that Berkeley is biased
    in favor of men.


    However, before jumping to conclusions, we should check if the model is any good.
    In Figure 15.2a, we plot the posterior predictive distribution, along with the
    original data. We see the model is a very bad fit to the data (the blue data dots
    are often outside the black predictive intervals). In particular, we see that
    the empirical admissions rate for women is actually higher in all the departments
    except for C and E, yet the model says that women should have a 14% lower chance
    of admission.


    The trouble is that men and women did not apply to the same departments in equal
    amounts. Women tended not to apply to departments, like A and B, with high admissions
    rates, but instead applied more to departments, like F, with low admissions rates.
    So even though less women were accepted *overall*, within in each department,
    women tended to be accepted at about the same rate.


    We can get a better understanding if we consider the DAG in Figure 15.3a. This
    is intended to be a causal model of the relevant factors. We discuss causality
    in more detail in **??**, but the basic idea should be clear from this picture.
    In particular, we see that there is an indirect causal path \(G \rightarrow D
    \rightarrow A\) from gender to acceptance, so to infer the direct affect \(G \rightarrow
    A\), we need to condition on \(D\) and close the indirect path.


    <sup>1</sup>McElreath uses 89% interval instead of 95% to emphasize the arbitrary
    nature of these values. The difference is insignificant.'
