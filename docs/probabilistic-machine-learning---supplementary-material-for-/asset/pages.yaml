    # 31.3.2.2 Promoting sparsity


    We now discuss one way to learn a sparse Gaussian MRF structure, which exploits
    the fact that there is a 1:1 correspondence between zeros in the precision matrix
    and absent edges in the graph. This suggests that we can learn a sparse graph
    structure by using an objective that encourages zeros in the precision matrix.
    By analogy to lasso (see **??**), one can define the following \(\ell_1\) penalized
    NLL:


    \(J(\boldsymbol{\Omega}) = -\log \det \boldsymbol{\Omega} + \text{tr}(\mathbf{S}\boldsymbol{\Omega})
    + \lambda ||\boldsymbol{\Omega}||_1 \quad (31.48)\)


    where \(||\boldsymbol{\Omega}||_1 = \sum_{j,k} |\omega_{jk}|\) is the 1-norm of
    the matrix. This is called the **graphical lasso** or **Glasso**.


    Although the objective is convex, it is non-smooth (because of the non-differentiable
    \(\ell_1\) penalty) and is constrained (because \(\boldsymbol{\Omega}\) must be
    a positive definite matrix). Several algorithms have been proposed for optimizing
    this objective [YL07; BGd08; DGK08], although arguably the simplest is the one
    in [FHT08], which uses a coordinate descent algorithm similar to the shooting
    algorithm for lasso. An even faster method, based on soft thresholding, is described
    in [FS18; FZS18].


    As an example, let us apply the method to the flow cytometry dataset from [Sac+05].
    A discretized version of the data is shown in Figure 31.19(a). Here we use the
    original continuous data. However, we are ignoring the fact that the data was
    sampled under intervention. In **??**, we illustrate the graph structures that
    are learned as we sweep \(\lambda\) from 0 to a large value. These represent a
    range of plausible hypotheses about the connectivity of these proteins.


    It is worth comparing this with the DAG that was learned in Figure 31.19(b). The
    DAG has the advantage that it can easily model the interventional nature of the
    data, but the disadvantage that it cannot model the feedback loops that are known
    to exist in this biological pathway (see the discussion in [SM09]). Note that
    the fact that we show many UGMs and only one DAG is incidental: we could easily
    use BIC to pick the “best” UGM, and conversely, we could easily display several
    DAG structures, sampled from the posterior.


    # 31.3.3 Graphical lasso for discrete MRFs/CRFs


    It is possible to extend the graphical lasso idea to the discrete MRF and CRF
    case. However, now there is a set of parameters associated with each edge in the
    graph, so we have to use the graph analog of group lasso (see **??**). For example,
    consider a pairwise CRF with ternary nodes, and node and edge potentials given
    by


    \(\psi_t(y_t, \boldsymbol{x}) = \begin{pmatrix} \boldsymbol{v}_{t1}^\top \boldsymbol{x}
    \\ \boldsymbol{v}_{t2}^\top \boldsymbol{x} \\ \boldsymbol{v}_{t3}^\top \boldsymbol{x}
    \end{pmatrix}, \quad \psi_{st}(y_s, y_t, \boldsymbol{x}) = \begin{pmatrix} \boldsymbol{w}_{t11}^\top
    \boldsymbol{x} & \boldsymbol{w}_{t12}^\top \boldsymbol{x} & \boldsymbol{w}_{t13}^\top
    \boldsymbol{x} \\ \boldsymbol{w}_{t21}^\top \boldsymbol{x} & \boldsymbol{w}_{t22}^\top
    \boldsymbol{x} & \boldsymbol{w}_{t23}^\top \boldsymbol{x} \\ \boldsymbol{w}_{t31}^\top
    \boldsymbol{x} & \boldsymbol{w}_{t32}^\top \boldsymbol{x} & \boldsymbol{w}_{t33}^\top
    \boldsymbol{x} \end{pmatrix} \quad (31.49)\)'
