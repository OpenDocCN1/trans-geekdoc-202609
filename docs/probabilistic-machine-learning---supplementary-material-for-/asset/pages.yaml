  md: '# Chapter 10


    # Variational inference


    # 10.1 Exact and approximate inference for PGMs


    In this section, we discuss exact and approximate inference for discrete PGMs
    from a variational perspective, following [WJ08].


    Similar to Section 9.1, we will assume a pairwise MRF of the form


    ```

    p_\theta(\mathbf{z}|\mathbf{x}) = \frac{1}{Z} \exp \left\{ \sum_{s \in \mathcal{V}}
    \theta_s(z_s) + \sum_{(s,t) \in \mathcal{E}} \theta_{st}(z_s, z_t) \right\} \quad
    (10.1)

    ```


    We can write this as an exponential family model, \(p(\mathbf{z}|\mathbf{x}) =
    \tilde{p}(\mathbf{z})/Z\), where \(Z = \log p(\mathbf{x})\), \(\tilde{p}(\mathbf{z})
    = \mathcal{T}(\mathbf{z})^\top \boldsymbol{\theta}\), \(\boldsymbol{\theta} =
    (\{\theta_{s,j}\}, \{\theta_{s,t,j,k}\})\) are all the node and edge parameters
    (the canonical parameters), and \(\mathcal{T}(\mathbf{z}) = (\{\mathbb{I}(z_s
    = j)\}, \{\mathbb{I}(z_s = j, z_t = k)\})\) are all the node and edge indicator
    functions (the sufficient statistics). Note: we use \(s, t \in \mathcal{V}\) to
    index nodes and \(j, k \in \mathcal{X}\) to index states.


    # 10.1.1 Exact inference as VI


    We know that the ELBO is a lower bound on the log marginal likelihood:


    ```

    \mathcal{L}(q) = \mathbb{E}_{q(\mathbf{z})} [\log \tilde{p}(\mathbf{z})] + \mathbb{H}(q)
    \le \log Z \quad (10.2)

    ```


    Let \(\boldsymbol{\mu} = \mathbb{E}_q [\mathcal{T}(\mathbf{z})]\) be the mean
    parameters of the variational distribution. Then we can rewrite this as


    ```

    \mathcal{L}(\boldsymbol{\mu}) = \boldsymbol{\theta}^T \boldsymbol{\mu} + \mathbb{H}(\boldsymbol{\mu})
    \le \log Z \quad (10.3)

    ```


    The set of all valid (unrestricted) mean parameters \(\boldsymbol{\mu}\) is the
    **marginal polytope** corresponding to the graph, \(\mathbb{M}(G)\), as explained
    in Section 9.1.2. Optimizing over this set recovers \(q = p\), and hence


    ```

    \max_{\boldsymbol{\mu} \in \mathbb{M}(G)} \boldsymbol{\theta}^T \boldsymbol{\mu}
    + \mathbb{H}(\boldsymbol{\mu}) = \log Z \quad (10.4)

    ```


    Equation (10.4) seems easy to optimize: the objective is concave, since it is
    the sum of a linear function and a concave function (see Figure **??** to see
    why entropy is concave); furthermore, we are maximizing this over a convex set,
    \(\mathbb{M}(G)\). Hence there is a unique global optimum. We. However, the entropy
    is typically intractable to compute, since it requires summing over all states.
    We discuss approximations below. See Table 10.1 for a high level summary of the
    methods we discuss.'
