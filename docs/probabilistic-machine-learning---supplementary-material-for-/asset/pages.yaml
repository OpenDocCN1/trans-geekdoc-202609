    (\mathbf{y}_i + \mathbf{b}_i) \otimes \mathbf{x}_i \right)\)

    ```


    where \(\otimes\) denotes the kronecker product.


    # 15.1.2.2 Bohning''s bound in the binary case


    If we have binary data, then \(y_i \in \{0, 1\}\), \(M = 1\) and \(\eta_i = \mathbf{w}^\mathsf{T}
    \mathbf{x}_i\) where \(\mathbf{w} \in \mathbb{R}^D\) is a weight vector (not matrix).
    In this case, the Bohning bound becomes


    ```

    \(\log(1 + e^\eta) \le \frac{1}{2} a \eta^2 - b \eta + c\)

    ```


    ```

    \(a = \frac{1}{4}\)

    ```


    ```

    \(b = a \psi - (1 + e^{-\psi})^{-1}\)

    ```


    ```

    \(c = \frac{1}{2} a \psi^2 - (1 + e^{-\psi})^{-1} \psi + \log(1 + e^\psi)\)

    ```


    It is possible to derive an alternative quadratic bound for this case. as shown
    in Section 6.5.4.2. This has the following form


    ```

    \(\log(1 + e^\eta) \le \lambda(\psi)(\eta^2 - \psi^2) + \frac{1}{2}(\eta - \psi)
    + \log(1 + e^\psi)\)

    ```


    ```

    \(\lambda(\psi) \triangleq \frac{1}{4\psi} \tanh(\psi/2) = \frac{1}{2\psi} \left[
    \sigma(\psi) - \frac{1}{2} \right]\)

    ```


    To facilitate comparison with Bohning''s bound, let us rewrite the JJ bound as
    a quadratic form as follows


    ```

    \(\log(1 + e^\eta) \le \frac{1}{2} a(\psi) \eta^2 - b(\psi) \eta + c(\psi)\)

    ```


    ```

    \(a(\psi) = 2\lambda(\psi)\)

    ```


    ```

    \(b(\psi) = -\frac{1}{2}\)

    ```


    ```

    \(c(\psi) = -\lambda(\psi) \psi^2 - \frac{1}{2} \psi + \log(1 + e^\psi)\)

    ```


    The JJ bound has an adaptive curvature term, since \(a\) depends on \(\psi\).
    In addition, it is tight at two points, as is evident from Figure 15.1(a). By
    contrast, the Bohning bound is a constant curvature bound, and is only tight at
    one point, as is evident from Figure 15.1(b). Nevertheless, the Bohning bound
    is simpler, and somewhat faster to compute, since \(\mathbf{V}_N\) is a constant,
    independent of the variational parameters \(\Psi\).


    # 15.1.2.3 Other bounds


    It is possible to devise bounds that are even more accurate than the JJ bound,
    and which work for the multiclass case, by using a piecewise quadratic upper bound
    to lse, as described in [MKM11]. By increasing the number of pieces, the bound
    can be made arbitrarily tight.


    It is also possible to come up with approximations that are not bounds. For example,
    [SF19] gives a simple approximation for the output of a softmax layer when applied
    to a stochastic input (characterized in terms of its first two moments).'
