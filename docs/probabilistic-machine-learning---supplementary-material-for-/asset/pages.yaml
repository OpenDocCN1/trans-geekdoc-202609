    This is called **Bayes model averaging** [Hoe+99]. Each term is just a weighted
    average of the predictions of each individual hypothesis. This is illustrated
    in Figure 3.4. The dots at the bottom show the predictions from each hypothesis;
    the vertical curve on the right shows the weight associated with each hypothesis.
    If we multiply each row by its weight and add up, we get the distribution at the
    top.


    # 3.1.1.5 MAP, MLE, and the plugin approximation


    As the amount of data increases, the posterior will (usually) become concentrated
    around a single point, namely the **posterior mode**, as we saw in Figure 3.3
    (top right plot). The posterior mode is defined as the hypothesis with maximum
    posterior probability:


    ```

    $h_{map} \triangleq \underset{h}{\text{argmax}} \, p(h|\mathcal{D})$

    ```


    This is also called the **maximum a posterior** or **MAP** estimate.


    We can compute the MAP estimate by solving the following **optimization problem**:


    ```

    $h_{map} = \underset{h}{\text{argmax}} \, p(h|\mathcal{D}) = \underset{h}{\text{argmax}}
    \, \log p(\mathcal{D}|h) + \log p(h)$

    ```


    The first term, \(\log p(\mathcal{D}|h)\), is the log of the **likelihood**, \(p(\mathcal{D}|h)\).
    The second term, \(\log p(h)\), is the log of the prior. As the data set increases
    in size, the log likelihood grows in magnitude, but the log prior term remains
    constant. We thus say that the **likelihood overwhelms the prior**. In this context,
    a reasonable approximation to the MAP estimate is to ignore the prior term, and
    just pick the **maximum likelihood estimate** or **MLE**, which is defined as


    ```

    $h_{mle} \triangleq \underset{h}{\text{argmax}} \, p(\mathcal{D}|h) = \underset{h}{\text{argmax}}
    \, \log p(\mathcal{D}|h) = \underset{h}{\text{argmax}} \, \sum_{n=1}^N \log p(y_n|h)$

    ```


    Suppose we approximate the posterior by a single **point estimate** \(\hat{h}\),
    might be the MAP estimate or MLE. We can represent this degenerate distribution
    as a single point mass


    ```

    $p(h|\mathcal{D}) \approx \mathbb{I}\left(h = \hat{h}\right)$

    ```'
