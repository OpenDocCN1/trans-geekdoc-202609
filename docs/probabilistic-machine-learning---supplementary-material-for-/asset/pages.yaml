    \tau_{st}(x_s, x_t) \propto \exp \left( \theta_{st}(x_s, x_t) + \theta_s(x_s)
    + \theta_t(x_t) \right)

    $$

    $$

    \times \prod_{u \in \text{nbr}(s) \setminus t} m_{u \to s}(x_s) \prod_{u \in \text{nbr}(t)
    \setminus s} m_{u \to t}(x_t)

    $$

    ```


    where the \(\lambda\) terms and irrelevant constants are absorbed into the constant
    of proportionality. We see that this is equivalent to the usual expression for
    the node and edge marginals in LBP.


    To derive an equation for the messages in terms of other messages (rather than
    in terms of \(\lambda_{ts}\)), we enforce the marginalization condition \(\sum_{x_t}
    \tau_{ts}(x_s, x_t) = \tau_s(x_s)\). Then one can show that


    ```

    $$

    m_{t \to s}(x_s) \propto \sum_{x_t} \left[ \exp \left\{ \theta_{st}(x_s, x_t)
    + \theta_t(x_t) \right\} \prod_{u \in \text{nbr}(t) \setminus s} m_{u \to t}(x_t)
    \right]

    $$

    ```


    We see that this is equivalent to the usual expression for the messages in LBP.


    # 10.1.3.3 Kikuchi free energy


    We have shown that LBP minimizes the Bethe free energy. In this section, we show
