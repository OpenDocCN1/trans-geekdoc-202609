    # # Statistics


    # ## 3.1 Bayesian concept learning


    In this section, we introduce Bayesian statistics using some simple examples inspired
    by Bayesian models of human learning. This will let us get familiar with the key
    ideas without getting bogged down by mathematical technalties.


    Consider how a child learns the meaning of a word, such as “dog”. Typically the
    child’s parents will point out **positive examples** of this concept, saying such
    things as, “look at the cute dog”, or “mind the doggy”, etc. The core challenge
    is to figure out what we mean by the **concept** “dog”, based on a finite (and
    possibly quite small) number of such examples. Note that the parent is unlikely
    to provide **negative examples**; for example, people do not usually say “look
    at that non-dog”. Negative examples may be obtained during an active learning
    process (e.g., the child says “look at the dog” and the parent says “that’s a
    cat, dear, not a dog”), but psychological research has shown that people can learn
    concepts from positive examples alone [XT07]. This means that standard supervised
    learning methods cannot be used.


    We formulate the problem by assuming the data that we see are generated by some
    hidden concept \(h \in \mathcal{H}\), where \(\mathcal{H}\) is called the **hypothesis
    space**. (We use the notation \(h\) rather than \(\boldsymbol{\theta}\) to be
    consistent with the concept learning literature.) We then focus on computing the
    posterior \(p(h|\mathcal{D})\). In Section 3.1.1, we assume the hypothesis space
    consists of a finite number of alternative hypotheses; this will significantly
    simplify the computation of the posterior, allowing us to focus on the ideas and
    not get too distracted by the math. In Section 3.1.2, we will extend this to continuous
    hypothesis spaces. This will form the foundation for Bayesian inference of real-valued
    parameters for more familiar probability models, such as the Bernoulli and the
    Gaussian, logistic regression, and deep neural networks, that we discuss in later
    chapters. (See also [Jia+13] for an application of these ideas to the problem
    of concept learning from images.)


    # ## 3.1.1 Learning a discrete concept: the number game


    Suppose that we are trying to learn some mathematical concept from a teacher who
    provides examples of that concept. We assume that a concept is defined as the
    set of positive integers that belong to its **extension**; for example, the concept
    “even number” is defined by \(h_{even}=\{2,4,6,\dots\}\), and the concept “powers
    of two” is defined by \(h_{two}=\{2,4,8,16,\dots\}\). For simplicity, we assume
    the range of numbers is between 1 and 100.


    For example, suppose we see one example, \(\mathcal{D}=\{16\}\). What other numbers
    do you think are examples of this concept? 17? 6? 32? 99? It’s hard to tell with
    only one example, so your predictions will be quite vague. Presumably numbers
    that are similar in some sense to 16 are more likely. But similar in what way?
    17 is similar because it is “close by”; 6 is similar because it has a digit in
    common, 32 is similar because it is also even and a power of 2, but 99 does not
    seem similar. Thus some numbers are more likely than others.


    Now suppose I tell you that \(\mathcal{D}=\{2,8,16,64\}\) are positive examples.
    You may guess that the hidden concept is “powers of two”. Given your beliefs about
    the true (but hidden) concept, you may confidently'
