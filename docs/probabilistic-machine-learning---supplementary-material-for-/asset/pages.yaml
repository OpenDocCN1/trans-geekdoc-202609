    # 6.5.4 Bounds for the logistic (sigmoid) function


    In this section, we use the results on conjugate duality to derive upper and lower
    bounds to the logistic function, \(\sigma(x) = \frac{1}{1+e^{-x}}\).


    # 6.5.4.1 Exponential upper bound


    The sigmoid function is neither convex nor concave. However, it is easy to show
    that \(f(x) = \log \sigma(x) = -\log(1+e^{-x})\) is concave, by showing that its
    second derivative is negative. Now, any convex function \(f(x)\) can be represented
    by


    ```

    f(x) = \min_{\eta} \eta x - f^{\dagger}(\eta) \tag{6.98}

    ```


    where


    ```

    f^{\dagger}(\eta) = \min_{x} \eta x - f(x) \tag{6.99}

    ```


    One can show that if \(f(x) = \log \sigma(x)\), then


    ```

    f^{\dagger}(\eta) = -\eta \ln \eta - (1 - \eta) \ln(1 - \eta) \tag{6.100}

    ```


    which is the binary entropy function. Hence


    ```

    \log \boldsymbol{\sigma}(x) \leq \eta x - f^{\dagger}(\eta) \tag{6.101}


    \boldsymbol{\sigma}(x) \leq \exp(\eta x - f^{\dagger}(\eta)) \tag{6.102}

    ```


    This exponential upper bound on \(\sigma(x)\) is illustrated in Figure 6.13(a).


    # 6.5.4.2 Quadratic lower bound


    It is also useful to compute a lower bound on \(\sigma(x)\). If we make this a
    quadratic lower bound, it will “play nicely” with Gaussian priors, which simplifies
    the analysis of several models. This approach was first suggested in [JJ96].


    First we write


    ```

    \log \boldsymbol{\sigma}(x) = -\log(+e^{-x}) = -\log \left( e^{-x/2}(e^{x/2} +
    e^{-x/2}) \right) \tag{6.103}


    = x/2 - \log(e^{x/2} + e^{-x/2}) \tag{6.104}

    ```


    The function \(f(x) = -\log(e^{x/2} + e^{-x/2})\) is a convex function of \(y
    = x^2\), as can be verified by showing \(\frac{d}{dx} f(x) > 0\). Hence we can
    create a linear lower bound on \(f\), using the conjugate function


    ```

    f^{\dagger}(\eta) = \max_{x^2} \eta x^2 - f(\sqrt{x^2}) \tag{6.105}

    ```


    We have


    ```

    0 = \eta - \frac{dx}{dx^2} \frac{d}{dx} f(x) = \eta + \frac{1}{4x} \tanh(\frac{x}{2})
    \tag{6.106}

    ```'
