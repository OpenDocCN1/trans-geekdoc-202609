  md: '![](img/c73db5a1f734ebb7c0655f19e5bc9daa_42_0.png)


    Figure 4.5: An example of a ground Markov logic network represented as a pairwise
    MRF for 2 people. Adapted from Figure 2.1 from [DL09]. Used with kind permission
    of Pedro Domingos.


    The result is the UGM in Figure 4.5.


    The above approach will assign non-zero probability to all logically valid worlds.
    However, logical rules may not always be true. For example, smoking does not always
    cause cancer. We can relax the hard constraints by using non-zero potential functions.
    In particular, we can associate a weight with each rule, and thus get potentials
    such as


    ```

    \(\Psi(Sm(x), Ca(x)) = \begin{cases} e^w & \text{if } \neg Sm(x) \lor Ca(x) =
    T \\ e^0 & \text{if } \neg Sm(x) \lor Ca(x) = F \end{cases}\) (4.33)

    ```


    where the value of \(w > 0\) controls strongly we want to enforce the corresponding
    rule.


    The overall joint distribution has the form


    ```

    \(p(x) = \frac{1}{Z(w)} \exp(\sum_i w_i n_i(x))\) (4.34)

    ```


    where \(n_i(x)\) is the number of instances of clause \(i\) which evaluate to
    true in assignment \(x\).


    Given a grounded MLN model, we can then perform inference using standard methods.
    Of course, the ground models are often extremely large, so more efficient inference
    methods, which avoid creating the full ground model (known as **lifted inference**),
    must be used. See [DL09; KNP11] for details.


    One way to gain tractability is to relax the discrete problem to a continuous
    one. This is the basic idea behind **hinge-loss MRFs** [Bac+15], which support
    exact inference using scalable convex optimization. There is a template language
    for this model family known as **probabilistic soft logic**, which has a similar
    “flavor” to MLN, although it is not quite as expressive.


    Recently MLNs have been combined with DL in various ways. For example, [Zha+20]
    uses graph neural networks for inference. And [WP18] uses MLNs in evidence fusion,
    where the noisy predictions come from DNNs trained using weak supervision.


    Finally, it is worth noting one subtlety which arises with undirected models,
    namely that the size of the unrolled model, which depends on the number of objects
    in the universe, can affect the results of inference, even if we have no data
    about the new objects. For example, consider an undirected chain of length \(T\),
    with \(T\) hidden nodes \(z_t\) and \(T\) observed nodes \(y_t\); call this model
    \(M_1\). Now suppose we double the length of the chain to \(2T\), without adding
    more evidence; call this model \(M_2\). We find that \(p(z_t|y_{1:T}, M_1) \neq
    p(z_t|y_{1:T}, M_2)\), for \(t=1:T\), even though we have not added new information,
    due to the different partition functions. This does not happen with a directed
    chain, because the newly added nodes can be marginalized out without affecting
    the original nodes, since the model is locally normalized and therefore modular.
    See [JBB09; Poo+12] for further discussion.'
