- pgno: 54
  md: '# 6.1.5.1 Example: Iterative soft-thresholding algorithm (ISTA) for sparse
    linear regression


    Suppose we are interested in fitting a linear regression model with a sparsity-promoting
    prior on the weights, as in the lasso model (**??**). One way to implement this
    is to add the $\ell_1$-norm of the parameters as a (non-smooth) penalty term,
    $\mathcal{L}_r(\theta) = \|\theta\|_1 = \sum_{d=1}^D |\theta_d|$. Thus the objective
    is


    $\mathcal{L}(\theta) = \mathcal{L}_s(\theta) + \mathcal{L}_r(\theta) = \frac{1}{2}\|\mathbf{X}\theta
    - \mathbf{y}\|_2^2 + \lambda\|\theta\|_1$


    The proximal gradient descent update can be written as


    $\theta_{t+1} = \text{SoftThreshold}_{\eta_t\lambda}(\theta_t - \eta_t \nabla\mathcal{L}_s(\theta_t))$


    where the soft thresholding operator (Equation (6.26)) is applied elementwise,
    and $\nabla\mathcal{L}_s(\theta) = \mathbf{X}^\text{T}(\mathbf{X}\theta - \mathbf{y})$.
    This is called the **iterative soft thresholding algorithm** or **ISTA** [DDM04;
    Don95]. If we combine this with Nesterov acceleration, we get the method known
    as “fast ISTA” or **FISTA** [BT09], which is widely used to fit sparse linear
    models.


    # 6.1.6 Alternating direction method of multipliers (ADMM)


    Consider the problem of optimizing $\mathcal{L}(x) = \mathcal{L}_s(x) + \mathcal{L}_r(x)$
    where now both $\mathcal{L}_s$ and $\mathcal{L}_r$ may be non-smooth (but we asssume
    both are convex). We may want to optimize these problems independently (e.g.,
    so we can do it in parallel), but need to ensure the solutions are consistent.


    One way to do this is by using the **variable splitting trick** combined with
    constrained optimization:


    minimize $\mathcal{L}_s(x) + \mathcal{L}_r(z)$ s.t. $x - z = \mathbf{0}$


    This is called **consensus form**.


    The corresponding augmented Langragian is given by


    $L_\rho(x, z, y) = \mathcal{L}_s(x) + \mathcal{L}_r(z) + y^\text{T}(x - z) + \frac{\rho}{2}\|x
    - z\|_2^2$


    where $\rho > 0$ is the penalty strength, and $y \in \mathbb{R}^n$ are the dual
    variables associated with the consistency constraint. We can now perform the following
    block coordinate descent updates:


    $x_{t+1} = \underset{x}{\text{argmin}} L_\rho(x, z_t, y_t)$


    $z_{t+1} = \underset{z}{\text{argmin}} L_\rho(x_{t+1}, z, y_t)$


    $y_{t+1} = y_t + \rho(x_{t+1} - z_{t+1})$


    We see that the dual variable is the (scaled) running average of the consensus
    errors.


    Inserting the definition of $L_\rho(x, z, y)$ gives us the following more explicit
    update equations:


    $x_{t+1} = \underset{x}{\text{argmin}} \left( \mathcal{L}_s(x) + y_t^\text{T}
    x + \frac{\rho}{2}\|x - z_t\|_2^2 \right)$


    $z_{t+1} = \underset{z}{\text{argmin}} \left( \mathcal{L}_r(z) - y_t^\text{T}
    z + \frac{\rho}{2}\|x_{t+1} - z\|_2^2 \right)$


    If we combine the linear and quadratic terms, we get


    $x_{t+1} = \underset{x}{\text{argmin}} \left( \mathcal{L}_s(x) + \frac{\rho}{2}\|x
    - z_t + (1/\rho)y_t\|_2^2 \right)$


    $z_{t+1} = \underset{z}{\text{argmin}} \left( \mathcal{L}_r(z) + \frac{\rho}{2}\|x_{t+1}
    - z - (1/\rho)y_t\|_2^2 \right)$'
