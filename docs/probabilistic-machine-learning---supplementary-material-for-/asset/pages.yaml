    general trend of neuroscience towards molecular biology).


    One way to model this is to assume the topic distributions evolve according to
    a Gaussian random walk, as in a state space mdoel (see ??). We can map these Gaussian
    vectors to probabilities via the softmax function, resulting in the following
    model:


    ```

    $$\begin{aligned} w_k^t | w_k^{t-1} \sim \mathcal{N}(w_{t-1,k}, \sigma^2 1_{N_w})
    \quad (28.4) \\ z_k^t \sim \text{Dir}(\alpha 1_{N_z}) \quad (28.5) \\ c_{nl}^t
    | z_n^t \sim \text{Cat}(z_n^t) \quad (28.6) \\ x_{nl}^t | c_{nl}^t = k, W^t \sim
    \text{Cat}(S(w_k^t)) \quad (28.7) \end{aligned}$$

    ```


    This is known as a **dynamic topic model** [BL06a]. See Figure 28.6 for the PGM-D.


    One can perform approximate inference in this model using a structured mean field
    method (**??**), that exploits the Kalman smoothing algorithm (**??**) to perform
    exact inference on the linear-Gaussian chain between the $w_k^t$ nodes (see [BL06a]
    for details). See the main text for an example of this model applied to 100 years
    of articles from Science.'
