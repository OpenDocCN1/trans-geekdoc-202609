  md: '# 2.1.3 Sensor fusion with unknown measurement noise


    In this section, we extend the sensor fusion results from **??** to the case where
    the precision of each measurement device is unknown. This turns out to yield a
    potentially multi-modal posterior, as we will see, which is quite different from
    the Gaussian case. Our presentation is based on [Min01].


    For simplicity, we assume the latent quantity is scalar, \(z \in \mathbb{R}\),
    and that we just have two measurement devices, \(x\) and \(y\). However, we allow
    these to have different precisions, so the data generating mechanism has the form
    \(x_n|z \sim \mathcal{N}(z, \lambda_x^{-1})\) and \(y_n|z \sim \mathcal{N}(z,
    \lambda_y^{-1})\). We will use a non-informative prior for \(z\), \(p(z) \propto
    1\), which we can emulate using an infinitely broad Gaussian, \(p(z) = \mathcal{N}(z|m_0
    = 0, \lambda_0^{-1} = \infty)\). So the unknown parameters are the two measurement
    precisions, \(\boldsymbol{\theta} = (\lambda_x, \lambda_y)\).


    Suppose we make 2 independent measurements with each device, which turn out to
    be

    \(x_1 = 1.1, x_2 = 1.9, y_1 = 2.9, y_2 = 4.1\) (2.48)


    If the parameters \(\boldsymbol{\theta}\) were known, then the posterior would
    be Gaussian:

    \(p(z|\mathcal{D}, \lambda_x, \lambda_y) = \mathcal{N}(z|m_N, \lambda_N^{-1})\)
    (2.49)

    \(\lambda_N = \lambda_0 + N_x \lambda_x + N_y \lambda_y\) (2.50)

    \(m_N = \frac{\lambda_x N_x \bar{x} + \lambda_y N_y \bar{y}}{N_x \lambda_x + N_y
    \lambda_y}\) (2.51)


    where \(N_x = 2\) is the number of \(x\) measurements, \(N_y = 2\) is the number
    of y measurements, \(\bar{x} = \frac{1}{N_x} \sum_{n=1}^{N_x} x_n = 1.5\) and
    \(\bar{y} = \frac{1}{N_y} \sum_{n=1}^{N_y} y_n = 3.5\). This result follows because
    the posterior precision is the sum of the measurement precisions, and the posterior
    mean is a weighted sum of the prior mean (which is 0) and the data means.


    However, the measurement precisions are not known. A simple solution is to estimate
    them by maximum likelihood. The log-likelihood is given by

    \(\ell(z, \lambda_x, \lambda_y) = \frac{N_x}{2} \log \lambda_x - \frac{\lambda_x}{2}
