  md: '# Chapter 6


    # Optimization


    # ### 6.1 Proximal methods


    In this section, we discuss a class of optimization algorithms called **proximal
    methods** that use as their basic subroutine the **proximal operator** of a function,
    as opposed to its gradient or Hessian. We define this operator below, but essentially
    it involves solving a convex subproblem.


    Compared to gradient methods, proximal method are easier to apply to nonsmooth
    problems (e.g., with $\ell_1$ terms), as well as large scale problems that need
    to be decomposed and solved in parallel. These methods are widely used in signal
    and image processing, and in some applications in deep learning (e.g., [BWL19]
    uses proximal methods for training quantized DNNs, [Yao+20] uses proximal methods
    for efficient neural architecture search, [Sch+17; WHT19] uses proximal methods
    for policy gradient optimization, etc.).


    Our presentation is based in part on the tutorial in [PB+14]. For another good
    review, see [PSW15].


    # ### 6.1.1 Proximal operators


    Let \( f : \mathbb{R}^n \to \mathbb{R} \cup \{+\infty\} \) be a convex function,
    where \( f(x) = \infty \) means the point is infeasible. Let the effective domain
    of \( f \) be the set of feasible points:


    \(\text{dom}(f) = \{ x \in \mathbb{R}^n : f(x) < \infty \}\)


    The **proximal operator** (also called a **proximal mapping**) of \( f \), denoted
    \(\text{prox}_f(x) : \mathbb{R}^n \to \mathbb{R}^n \), is defined by


    \(\text{prox}_f(x) = \underset{z}{\text{argmin}} \left( f(z) + \frac{1}{2} \|z
    - x\|_2^2 \right)\)


    This is a strongly convex function and hence has a unique minimizer. This operator
    is sketched in Figure 6.1a. We see that points inside the domain move towards
    the minimum of the function, whereas points outside the domain move to the boundary
    and then towards the minimum.


    For example, suppose \( f \) is the indicator function for the convex set \( \mathcal{C}
    \), i.e.,


    \( f(x) = I_{\mathcal{C}}(x) = \begin{cases} 0 & \text{if } x \in \mathcal{C}
    \\ \infty & \text{if } x \notin \mathcal{C} \end{cases} \)


    In this case, the proximal operator is equivalent to projection onto the set \(
    \mathcal{C} \):


    \(\text{proj}_{\mathcal{C}}(x) = \underset{z \in \mathcal{C}}{\text{argmin}} \|z
    - x\|_2\)


    We can therefore think of the prox operator as generalized projection.'
