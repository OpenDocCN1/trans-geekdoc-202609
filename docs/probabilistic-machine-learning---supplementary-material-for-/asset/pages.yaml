    no outlinks, you just jump to a random page. (These random jumps, including self-transitions,
    ensure the chain is irreducible (singly connected) and regular. Hence we can solve
    for its unique stationary distribution using eigenvector methods.) This defines
    the following transition matrix:


    ```

    M_{ij} = \begin{cases} p G_{ij} / c_j + \delta & \text{if } c_j \neq 0 \\ 1/n
    & \text{if } c_j = 0 \end{cases}

    ```


    where n is the number of nodes, \(\delta = (1 - p) / n\) is the probability of
    jumping from one page to another without following a link and \(c_j = \sum_i G_{ij}\)
    represents the out-degree of page j. (If \(n = 4 \cdot 10^9\) and \(p = 0.85\),
    then \(\delta = 3.75 \cdot 10^{-11}\).) Here M is a stochastic matrix in which
    columns sum to one. Note that M = A^T in our earlier notation.


    We can represent the transition matrix compactly as follows. Define the diagonal
    matrix D with entries


    ```

    d_{jj} = \begin{cases} 1 / c_j & \text{if } c_j \neq 0 \\ 0 & \text{if } c_j =
    0 \end{cases}

    ```


    Define the vector z with components


    ```

    z_j = \begin{cases} \delta & \text{if } c_j \neq 0 \\ 1/n & \text{if } c_j = 0
    \end{cases}

    ```


    Then we can rewrite Equation (2.71) as follows:


    ```

    M = pGD + 1z^T

    ```


    The matrix M is not sparse, but it is a rank one modification of a sparse matrix.
    Most of the elements of M are equal to the small constant \(\delta\). Obviously
    these do not need to be stored explicitly.


    Our goal is to solve \(v = Mv\), where \(v = \pi^T\). One efficient method to
    find the leading eigenvector of a large matrix is known as the power method. This
    simply consists of repeated matrix-vector multiplication, followed by normalization:


    ```

    v \propto Mv = pGDv + 1z^T v

    ```


    It is possible to implement the power method without using any matrix multiplications,
    by simply sampling from the transition matrix and counting how often you visit
    each state. This is essentially a Monte Carlo approximation to the sum implied
    by v = Mv. Applying this to the data in Figure 2.3(a) yields the stationary distribution
    in Figure 2.3(b). This took 13 iterations to converge, starting from a uniform
    distribution. To handle changing web structure, we can re-run this algorithm every
    day or every week, starting v off at the old distribution; this is called warm
    starting [LM06].


    For details on how to perform this Monte Carlo power method in a parallel distributed
    computing environment, see e.g., [RU10].'
