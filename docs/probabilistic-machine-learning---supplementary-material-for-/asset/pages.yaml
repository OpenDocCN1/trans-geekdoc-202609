- pgno: 11
  md: 'where the parameters of the conditional distribution can be read off from the
    above equations using


    \(\boldsymbol{\mu}_{1|2} = \boldsymbol{\mu}_1 + \Sigma_{12}\Sigma_{22}^{-1}(x_2
    - \mu_2)\) (2.11)


    \(\Sigma_{1|2} = \Sigma / \Sigma_{22} = \Sigma_{11} - \Sigma_{12}\Sigma_{22}^{-1}\Sigma_{21}\)
    (2.12)


    We can also use the fact that \(|\mathbf{M}| = |\mathbf{M}/\mathbf{H}||\mathbf{H}|\)
    to check the normalization constants are correct:


    \((2\pi)^{(d_1+d_2)/2}|\Sigma|^{\frac{1}{2}} = (2\pi)^{(d_1+d_2)/2}(|\Sigma/\Sigma_{22}||\Sigma_{22}|)^{\frac{1}{2}}\)
    (2.13)


    \(= (2\pi)^{d_1/2}|\Sigma/\Sigma_{22}|^{\frac{1}{2}}(2\pi)^{d_2/2}|\Sigma_{22}|^{\frac{1}{2}}\)
    (2.14)


    where \(d_1 = \text{dim}(x_1)\) and \(d_2 = \text{dim}(x_2)\).


    We see that the equations for marginalization of an MVN are easy, but the equations
    for conditioning are complex. We can also write the MVN in **information form**,
    using the parameterization


    \(\Lambda \triangleq \Sigma^{-1}, \quad \eta \triangleq \Sigma^{-1}\mu\) (2.15)


    Here \(\Lambda\) is the precision matrix, and \(\eta\) is the precision-weighted
    mean. In this form, one can show that the marginals and conditions are given by


    \(p(x_2) = \mathcal{N}_c(x_2|\eta_2 - \Lambda_{21}\Lambda_{11}^{-1}\eta_1, \Lambda_{22}
    - \Lambda_{21}\Lambda_{11}^{-1}\Lambda_{12})\) (2.16)


    \(p(x_1|x_2) = \mathcal{N}_c(x_1|\eta_1 - \Lambda_{12}x_2, \Lambda_{11})\) (2.17)


    To show show this, let us partition \(\eta\) as follows:


    \(\begin{pmatrix} \eta_1 \\ \eta_2 \end{pmatrix} = \begin{pmatrix} \Lambda_{11}
    & \Lambda_{12} \\ \Lambda_{21} & \Lambda_{22} \end{pmatrix} \begin{pmatrix} \mu_1
    \\ \mu_2 \end{pmatrix}\) (2.18)


    so


    \(\eta_1 = \Lambda_{11}\mu_1 + \Lambda_{12}\mu_2\) (2.19)


    \(\eta_2 = \Lambda_{21}\mu_1 + \Lambda_{22}\mu_2\) (2.20)


    Hence


    \(\begin{pmatrix} \Lambda_{11} & \Lambda_{12} \\ \Lambda_{21} & \Lambda_{22} \end{pmatrix}
    = \begin{pmatrix} \Sigma_{11} & \Sigma_{12} \\ \Sigma_{21} & \Sigma_{22} \end{pmatrix}^{-1}\)
    (2.21)


    \(= \begin{pmatrix} (\Sigma/\Sigma_{22})^{-1} & -(\Sigma/\Sigma_{22})^{-1}\Sigma_{12}\Sigma_{22}^{-1}
    \\ -\Sigma_{22}^{-1}\Sigma_{21}(\Sigma/\Sigma_{22})^{-1} & \Sigma_{22}^{-1} +
    \Sigma_{22}^{-1}\Sigma_{21}(\Sigma/\Sigma_{22})^{-1}\Sigma_{12}\Sigma_{22}^{-1}
    \end{pmatrix}\) (2.22)


    where the top left is


    \(\Lambda_{11} = (\Sigma/\Sigma_{22})^{-1} = (\Sigma_{11} - \Sigma_{12}\Sigma_{22}^{-1}\Sigma_{21})^{-1}\)
    (2.23)


    Using the moment form for conditioning we have


    \(\Lambda_{1|2} = \Sigma_{1|2}^{-1} = (\Sigma_{11} - \Sigma_{12}\Sigma_{22}^{-1}\Sigma_{21})^{-1}
    = \Lambda_{11}\) (2.24)


    \(\mu_{1|2} = \mu_1 + \Sigma_{12}\Sigma_{22}^{-1}(x_2 - \mu_2)\) (2.25)


    but from Equation 2.22 and 2.23 we have


    \(\Lambda_{12} = -\Lambda_{11}\Sigma_{12}\Sigma_{22}^{-1}\) (2.26)


    so


    \(\mu_{1|2} = \mu_1 - \Lambda_{11}^{-1}\Lambda_{12}(x_2 - \mu_2)\) (2.27)


    \(\eta_{1|2} = \Lambda_{1|2}\mu_{1|2} = \Lambda_{11}\mu_1 - \Lambda_{12}(x_2 -
    \mu_2)\) (2.28)


    \(= \Lambda_{11}\mu_1 + \Lambda_{12}\mu_2 - \Lambda_{12}x_2 = \eta_1 - \Lambda_{12}x_2\)
    (2.29)'
