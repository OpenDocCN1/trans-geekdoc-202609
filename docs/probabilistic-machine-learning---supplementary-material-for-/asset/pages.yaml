    # ## 2.2 Google''s PageRank algorithm


    In this section, we discuss Google''s PageRank algorithm, since it provides an
    interesting application of Markov chain theory. PageRank is one of the components
    used for ranking web page search results. We sketch the basic idea below; see
    [BL06b] for a more detailed explanation.


    # ### 2.2.1 Retrieving relevant pages using inverted indices


    We will treat the web as a giant directed graph, where nodes represent web pages
    (documents) and edges represent hyper-links.1 We then perform a process called
    web crawling. We start at a few designated root nodes, such as wikipedia.org,
    and then follows the links, storing all the pages that we encounter, until we
    run out of time.


    Next, all of the words in each web page are entered into a data structure called
    an inverted index. That is, for each word, we store a list of the documents where
    this word occurs. At test time, when a user enters a query, we can find potentially
    relevant pages as follows: for each word in the query, look up all the documents
    containing each word, and intersect these lists. (We can get a more refined search
    by storing the location of each word in each document, and then testing if the
    words in a document occur in the same order as in the query.)


    Let us give an example, from http://en.wikipedia.org/wiki/Inverted_index. Suppose
    we have 3 documents, D0 = "it is what it is", D1 = "what is it" and D2 = "it is
    a banana". Then we can create the following inverted index, where each pair represents
    a document and word location:


    ```

    "a": {(2, 2)}

    "banana": {(2, 3)}

    "is": {(0, 1), (0, 4), (1, 1), (2, 1)}

    "it": {(0, 0), (0, 3), (1, 2), (2, 0)}

    "what": {(0, 2), (1, 0)}

    ```


    For example, we see that the word "what" occurs in document 0 at location 2 (counting
    from 0), and in document 1 at location 0. Suppose we search for "what is it".
    If we ignore word order, we retrieve the following documents:


    ```

    {D_0, D_1} \cap {D_0, D_1, D_2} \cap {D_0, D_1, D_2} = {D_0, D_1}  (2.68)

    ```


    If we require that the word order matches, only document D1 would be returned.
    More generally, we can allow out-of-order matches, but can give "bonus points"
    to documents whose word order matches the query''s word order, or to other features,
    such as if the words occur in the title of a document. We can then return the
    matching documents in decreasing order of their score/ relevance. This is called
    document ranking.


    1In 2008, Google said it had indexed 1 trillion (10^12) unique URLs. If we assume
    there are about 10 URLs per page (on average), this means there were about 100
    billion unique web pages. Estimates for 2010 are about 121 billion unique web
    pages. Source: https://bit.ly/2KeQeyi'
