    implies \(p(X_1 = X_3) = 0.2\), which is not possible (see [WJ08, p81] for a formal
    proof). Indeed, Figure 9.2(b) shows that \(\mathbb{L}(G)\) contains points that
    are not in \(\mathbb{M}(G)\).


    We claim that \(\mathbb{M}(G) \subseteq \mathbb{L}(G)\), with equality iff \(G\)
    is a tree. To see this, first consider an element \(\boldsymbol{\mu} \in \mathbb{M}(G)\).
    Any such vector must satisfy the normalization and marginalization constraints,
    hence \(\mathbb{M}(G) \subseteq \mathbb{L}(G)\). Now consider the converse. Suppose
    \(T\) is a tree, and let \(\boldsymbol{\mu} \in \mathbb{L}(T)\). By definition,
    this satisfies the normalization and marginalization constraints. However, any
    tree can be represented in the form


    ```

    $$

    p_\mu(\boldsymbol{x}) = \prod_{s \in V} \mu_s(x_s) \prod_{(s,t) \in E} \frac{\mu_{st}(x_s,
    x_t)}{\mu_s(x_s)\mu_t(x_t)}

    $$ (9.17)

    ```


    Hence satisfying normalization and local consistency is enough to define a valid
    distribution for any tree. Hence \(\boldsymbol{\mu} \in \mathbb{M}(T)\) as well.
    In contrast, if the graph has loops, we have that \(\mathbb{M}(G) \neq \mathbb{L}(G)\).
    See Figure 9.2(b) for an example of this fact. The importance of this observation
    will become clear in Section 10.1.3.


