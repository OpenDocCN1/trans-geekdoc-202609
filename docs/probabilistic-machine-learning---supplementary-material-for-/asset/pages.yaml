    However, we use an alternative known as the noisy-OR model, which we explain below,


    The noisy-OR model assumes that if a parent is on, then the child will usually
    also be on (since it is an or-gate), but occasionally the "links" from parents
    to child may fail, independently at random. If a failure occurs, the child will
    be \(\rightarrow\) d, even if the parent is on. To model this more precisely,
    let \(\theta_{kd} = 1 - q_{kd}\) be the probability that the \(k \rightarrow d\)
    link fails. The only way for the child to be off is if all the links from all
    parents that are on fail independently at random. Thus


    ```

    \(p(x_d = 0|\mathbf{z}) = \prod_{k \in \text{pa}(d)} \theta_{kd}^{\mathbb{I}(z_k=1)}\)
    (4.2)

    ```


    Obviously, \(p(x_d = 1|\mathbf{z}) = 1 - p(x_d = 0|\mathbf{z})\). In particular,
    let us define \(q_{kd} = 1 - \theta_{kd} = p(x_d = 1|z_k = 1, \mathbf{z}_{-k}
    = 0)\); this is the probability that \(k\) can activate \(d\) "on its own"; this
    is sometimes called its "**causal power**" (see e.g., [KNH11]).


    If we observe that \(x_d = 1\) but all its parents are off, then this contradicts
    the model. Such a data case would get probability zero under the model, which
    is problematic, because it is possible that someone exhibits a symptom but does
    not have any of the specified diseases. To handle this, we add a dummy **leak
    node** \(z_0\), which is always on; this represents "all other causes". The parameter
    \(q_{0d}\) represents the probability that the background leak can cause symptom
    \(d\) on its own. The modified CPD becomes


    ```

    \(p(x_d = 0|\mathbf{z}) = \theta_{0d} \prod_{k \in \text{pa}(d)} \theta_{kd}^{z_k}\)
    (4.3)

    ```


    See Table 4.1 for a numerical example.


    If we define \(w_{kd} \triangleq \log(\theta_{kd})\), we can rewrite the CPD as


    ```

    \(p(x_d = 1|\mathbf{z}) = 1 - \exp \left( w_{0d} + \sum_k z_k w_{kd} \right)\)
    (4.4)

    ```


    We see that this is similar to a logistic regression model.


    It is relatively easy to set the \(\theta_{kd}\) parameters by hand, based on
    domain expertise, as was done with QMR. Such a model is called a **probabilistic
    expert system**. In this book, we focus on learning parameters from data; we discuss
