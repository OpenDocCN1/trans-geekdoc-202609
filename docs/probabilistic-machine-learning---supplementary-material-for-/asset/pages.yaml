    residual error (noise term, shown by vertical arrows) is independent of X. Right:
    If we try to predict X from Y, the residual error is not constant. From Figure
    8.8 of [Var21]. Used with kind permission of Kush Varshney.


    In the case of two variables, we have Y = f(X) + U. If X and U are both Gaussian,
