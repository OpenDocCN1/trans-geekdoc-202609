    use.) In particular, they show how to convert the combinatorial problem into a
    continuous problem:


    ```

    \(\min_{\mathbf{W} \in \mathbb{R}^{D \times D}} f(\mathbf{W}) \text{ s.t. } G(\mathbf{W})
    \in \text{DAGs} \Longleftrightarrow \min_{\mathbf{W} \in \mathbb{R}^{D \times
    D}} f(\mathbf{W}) \text{ s.t. } h(\mathbf{W}) = 0\) (31.30)

    ```


    Here **W** is a weighted adjacency matrix on \(D\) nodes, \(G(\mathbf{W})\) is
    the corresponding graph (obtained by thresholding **W** at 0), \(f(\mathbf{W})\)
    is a scoring function (e.g., penalized log likelihood), and \(h(\mathbf{W})\)
    is a constraint function that measures how close **W** is to defining a DAG. The
    constraint is given by


    ```

    \(h(\mathbf{W}) = \text{tr}((\mathbf{I} + \alpha \mathbf{W})^d) - d \propto \text{tr}(\sum_{k=1}^d
    \alpha^k \mathbf{W}^k)\) (31.31)

    ```


    where \(\mathbf{W}^k = \mathbf{W} \cdots \mathbf{W}\) with \(k\) terms, and \(\alpha
    > 0\) is a regularizer. Element \((i, j)\) of \(\mathbf{W}^k\) will be non-zero
    iff there is a path from \(j\) to \(i\) made of \(K\) educes. Hence the diagonal
    elements count the number of paths from an edge to itself in \(k\) steps. Thus
    \(h(\boldsymbol{w})\) will be \(0\) if **W** defines a valid DAG.

    The scoring function considered in [Zhe+18] has the form


    ```

    \(f(\mathbf{W}) = \frac{1}{2N} \|\mathbf{X} - \mathbf{XW}\|_F^2 + \lambda \|\mathbf{W}\|_1\)
    (31.32)

    ```


    where \(\mathbf{X} \in \mathbb{R}^{ND}\) is the data matrix. The show how to find
    a local optimum of the equality constrained objective using gradient-based methods.
    The cost per iteration is \(O(D^3)\).

    Several extensions of this have been proposed. For example, [Yu+19] replace the
    Gaussian noise assumption with a VAE (variational autoencoder, **??**), and use
    a graph neural network as the encoder/decoder. And [Lac+20] relax the linearity
    assumption, and allow for the use of neural network dependencies between variables.


