    example, evaluating fib(5) proceeds as follows:


    $F_5 = F_4 + F_3$ (6.76)

    $= (F_3 + F_2) + (F_2 + F_1)$ (6.77)

    $= ((F_2 + F_1) + (F_1 + F_0)) + ((F_1 + F_0) + F_1)$ (6.78)

    $= (((F_1 + F_0) + F_1) + (F_1 + F_0))(F_1 + F_0) + F_1)$ (6.79)


    We see that there is a lot of repeated computation. For example, fib(2) is computed
    3 times. One way to improve the efficiency is to use **memoization**, which means
    memorizing each function value that is computed. This will result in a linear
    time algorithm. However, the overhead involved can be high.


    It is usually preferable to try to solve the problem **bottom up**, solving small
    subproblems first, and then using their results to help solve larger problems
    later. A simple way to do this is shown in Algorithm 3.


    ```

    Algorithm 2: Fibonacci numbers, top down

    1 function fib(n);

    2 if n = 0 or n = 1 then

    3 | return 1

    4 else

    5 | return (fib(n - 1) + fib(n - 2))

    ```


    ```

    Algorithm 3: Fibonacci numbers, bottom up

    1 function fib(n);

    2 F_0 := 1, F_1 := 2 ;

    3 For i = 2, ..., n do

    4 | F_i := F_{i-1} + F_{i-2}

    5 return F_n

    ```


