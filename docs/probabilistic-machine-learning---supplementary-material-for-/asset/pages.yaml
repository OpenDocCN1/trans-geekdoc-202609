  md: '# 31.4.1 Learning cause-effect pairs


    If we only observe such pair of variables, we cannot use methods discussed in
    Section 31.2 to learn graph structure, since such methods are based on conditional
    independence tests, which need at least 3 variables. However, intuitively, we
    should still be able to learn causal relationships in this case. For example,
    we know that altitude _X_ causes temperature _Y_ and not vice versa. For example,
    suppose we measure _X_ and _Y_ in two different countries, say the Netherlands
    (low altitude) and Switzerland (high altitude). If we represent the joint distribution
    as _p_(_X_, _Y_) = _p_(_X_)_p_(_Y_|_X_), we find that the _p_(_Y_|_X_) distribution
    is stable across the two populations, while _p_(_X_) will change. However, if
    we represent the joint distribution as _p_(_X_, _Y_) = _p_(_Y_)_p_(_X_|_Y_), we
    find that _both p_(_Y_) and _p_(_X_|_Y_) need to change across populations, so
    both of the corresponding distributions will be more "complicated" to capture
    this non-stationarity in the data. In this section, we discuss some approaches
    that exploit this idea. Our presentation is based on [PJS17]. (See [Moo+16] for
    more details.)


    # 31.4.1.1 Algorithmic information theory


    Suppose \(X \in \{0, 1\}\) and \(Y \in \mathbb{R}\) and we represent the joint
    _p_(_x_, _y_) using


    ```

    \(p(x, y) = p(x)p(y|x) = \text{Ber}(x|\theta)\mathcal{N}(y|\mu_x, 1)\)

    (31.51)

    ```


    We can equally well write this in the following form [Daw02, p165]:


    ```

    \(p(x, y) = p(y)p(x|y) = [\theta\mathcal{N}(y|\mu_1, 1) + (1 - \theta)\mathcal{N}(y|\mu_2,
    1)]\text{Ber}(x|\sigma(\alpha + \beta y))\)

    (31.52)

    ```


    where \(\alpha = \text{logit}(\theta) + \mu_2^2 - \mu_1^2\) and \(\beta = \mu_1
    - \mu_2\). We can plausibly argue that the first model, which corresponds to \(X
    \rightarrow Y\), is more likely to be correct, since it is consists of two simple
    distributions that seem to be rather generic. By contrast, in Equation (31.52),
    the distribution of _p_(_Y_) is more complex, and seems to be dependent on the
    specific form of _p_(_X_|_Y_).


    [JS10] show how to formalize this intuition using algorithmic information theory.
    In particular, they say that _X_ causes _Y_ if the _distributions P<sub>X</sub>_
    and _P_<sub>_Y_|_X_</sub> (not the random variables _X_ and _Y_) are algorithmically
    independent. To define this, let _P<sub>X</sub>_(_X_) be the distribution induced
    by _f<sub>x</sub>_(_X_, _U<sub>X</sub>_), where _U<sub>X</sub>_ is a bit string,
    and _f<sub>X</sub>_ is represented by a Turing machine. Define _P_<sub>_Y_|_X_</sub>
    analogously. Finally, let _K_(_s_) be the Kolmogorov complexity of bit string
    _s_, i.e., the length of the shortest program that would generate _s_ using a
    universal Turing machine. We say that _P<sub>X</sub>_ and _P_<sub>_Y_|_X_</sub>
    are algorithmically independent if


    ```

    \(K(P_{X,Y}) = K(P_X) + K(P_{Y|X})\)

    (31.53)

    ```


    Unfortunately, there is no algorithm to compute the Kolmogorov complexity, so
    this approach is purely conceptual. In the sections below, we discuss some more
    practical metrics.


    # 31.4.1.2 Additive noise models


    A generic two-variable SCM of the form \(X \rightarrow Y\) requires specifying
    the function _X_ = _f<sub>X</sub>_(_U<sub>X</sub>_), the distribution of _U<sub>X</sub>_,
    the function _Y_ = _f<sub>Y</sub>_(_X_, _U<sub>Y</sub>_), and the distribution
    of _U<sub>Y</sub>_. We can simplify our notation by letting _X_ = _U<sub>x</sub>_
    and defining _p_(_X_) directly, and defining _Y_ = _f<sub>Y</sub>_(_X_, _U<sub>Y</sub>_)
    = _f_(_X_, _U_), where _U_ is a noise term.


    In general, such a model is not identifiable from a finite dataset. For example,
    we can imagine that the value of _U_ can be used to select between different functional
    mappings, _Y_ = _f_(_X_, _U_ = _u_) = _f<sub>u</sub>_(_X_). Since _U_ is not observed,
    the induced distribution will be a mixture of different mappings, and it will
    generally be impossible to disentangle. For example, consider the case where _X_
    and _U_ are Bernoulli random variables, and _U_ selects between the functions
    _Y_ = _f_id(_X_) = I(_Y_ = _X_) and _Y_ = _f_neg(_X_) = I(_Y_ != _X_). In this
    case, the induced distribution _p_(_Y_) is uniform, independent of _X_, even though
    we have the structure \(X \rightarrow Y\).


    The above concerns motivate the desire to restrict the flexibility of the functions
    at each node. One natural family is additive noise models (ANM), where we assume
    each variable has the following dependence on its parents [Hoy+09]:


    ```

    \(X_i = f_i(X_{\text{pa}_i}) + U_i\)

    (31.54)

    ```'
