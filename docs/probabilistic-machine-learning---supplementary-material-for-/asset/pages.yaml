    # 6.2.3 Random search


    A surprisingly effective strategy in problems where we know nothing about the
    objective is to use **random search**. In this approach, each iterate $x_{t+1}$
    is chosen uniformly at random from $\mathcal{X}$. This should always be tried
    as a baseline.


    In [BB12], they applied this technique to the problem of hyper-parameter optimization
    for some ML models, where the objective is performance on a validation set. In
    their examples, the search space is continuous, $\Theta = [0, 1]^D$. It is easy
    to sample from this at random. The standard alternative approach is to quantize
    the space into a fixed set of values, and then to evaluate them all; this is known
    as **grid search**. (Of course, this is only feasible if the number of dimensions
    $D$ is small.) They found that random search outperformed grid search. The intuitive
    reason for this is that many hyper-parameters do not make much difference to the
    objective function, as illustrated in Figure 6.4. Consequently it is a waste of
    time to place a fine grid along such unimportant dimensions.


    RS has also been used to optimize the parameters of MDP policies, where the objective
    has the form $f(x) = \mathbb{E}_{\tau \sim \pi_\omega} [R(\tau)]$ is the expected
    reward of trajectories generated by using a policy with parameters $x$. For policies
    with few free parameters, RS can outperform more sophisticated reinforcement learning
    methods described in **??**, as shown in [MGR18]. In cases where the policy has
    a large number of parameters, it is sometimes possible to project them to a lower
    dimensional random subspace, and perform optimization (either grid search or random
    search) in this subspace [Li+18].


    # 6.3 Population-based optimization


    Stochastic local search (SLS) maintains a single “best guess” at each step, $x_t$.
    If we run this for $T$ steps, and restart $K$ times, the total cost is $TK$. A
    natural alternative is to maintain a set or **population** of $K$ good candidates,
    $S_t$, which we try to improve at each step. This is called an an **evolutionary
    algorithm (EA)**. If we run this for $T$ steps, it also takes $TK$ time; however,
    it can often get better results than multi-restart SLS, since the search procedure
    explores more of the space in parallel, and information from different members
    of the population can be shared. Many versions of EA are possible, depending on
    how we update the population at each step, as we discuss in Section 6.3.1.


    An alternative to maintaining an explicit set of promising candidates is to maintain
    a probability distribution over promising candidates. We call this **distribution-based
    optimization (DBO)**.$^2$ We can think of EAs as using a nonparametric representation
    of this distribution in terms of a “bag of points”. We


    2 Note that the terms “probabilistic optimization” and “stochastic optimization”
    have already been “taken”. (Probabilistic optimization is often used to refer
    to Bayesian optimization (**??**), and stochastic optimization refers to any optimization
    problem in which the objective is stochastic.) Another term that is used for DBO
    is “model based optimization” (see e.g. [BBZ17]). However, this term is ambiguous,
    because it could either refer to a model of good candidates (i.e., a probability
    distribution over $\mathcal{X}$) or a cheap (possibly differentiable) approximation
    to the objective (i.e., a regression function $\mathcal{X} \to \mathbb{R}$), as
    discussed in **??**.'
