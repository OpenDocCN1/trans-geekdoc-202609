    (so m_n = y_{1,n} + y_{2,n} is the total number of applications for case n). The
    expected acceptance rate across the entire dataset is


    ```

    λ̄_1 / (λ̄_1 + λ̄_2) = 146.2 / (146.2 + 230.9) = 0.38  (15.83)

    ```


    Let us compare this to a binomial regression model of the form


    ```

    y_n ~ Bin(m_n, μ)                            (15.84)

    μ = σ(α)                                     (15.85)

    α ~ N(0, 1.5)                                (15.86)

    ```


    Let ᾱ = E[α|D], where D = (y_{1,1:N}, m_{1:N}). The expected acceptance rate
    across the entire dataset is σ(ᾱ) = 0.38, which matches Equation (15.83). (See
