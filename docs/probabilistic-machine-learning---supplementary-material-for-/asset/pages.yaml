    \boldsymbol{\tau} + \mathbb{H}_{Bethe}(\boldsymbol{\tau}) \approx \log Z$ | Non-concave
    | Convex outer approx. | Section 10.1.3 |

    | TRBP | $\max_{\boldsymbol{\tau} \in \mathbb{L}(G)} \boldsymbol{\theta}^T \boldsymbol{\tau}
    + \mathbb{H}_{TRBP}(\boldsymbol{\tau}) \ge \log Z$ | Concave | Convex outer approx.
    | Section 10.1.5 |


    Table 10.1: Summary of some variational inference methods for graphical models.
    TRBP is tree-reweighted belief propagation.


    # 10.1.2 Mean field VI


    The mean field approximation to the entropy is simply


    $$\mathbb{H}_{MF}(\boldsymbol{\mu}) = \sum_s \mathbb{H}(\boldsymbol{\mu}_s)$$
    (10.5)


    which follows from the factorization assumption. Thus the mean field objective
    is


    $$\mathcal{L}_{MF}(\boldsymbol{\mu}) = \boldsymbol{\theta}^T \boldsymbol{\mu}
    + \mathbb{H}_{MF}(\boldsymbol{\mu}) \le \log Z$$ (10.6)


    This is a concave lower bound on $\log Z$. We will maximize this over a a simpler,
    but non-convex, inner approximation to $\mathbb{M}(G)$, as we now show.


    First, let $F$ be an edge subgraph of the original graph $G$, and let $\mathcal{I}(F)
    \subseteq \mathcal{I}$ be the subset of sufficient statistics associated with
    the cliques of $F$. Let $\Omega$ be the set of canonical parameters for the full
    model, and define the canonical parameter space for the submodel as follows:


    $$\Omega(F) \triangleq \{ \boldsymbol{\theta} \in \Omega : \boldsymbol{\theta}_\alpha
    = 0 \, \forall \alpha \in \mathcal{I} \setminus \mathcal{I}(F) \}$$ (10.7)


    In other words, we require that the natural parameters associated with the sufficient
    statistics $\alpha$ outside of our chosen class to be zero. For example, in the
    case of a fully factorized approximation, $F_0$, we remove all edges from the
    graph, giving


    $$\Omega(F_0) \triangleq \{ \boldsymbol{\theta} \in \Omega : \boldsymbol{\theta}_{st}
    = 0 \, \forall (s,t) \in E \}$$ (10.8)


    In the case of structured mean field (Section ??), we set $\theta_{st} = 0$ for
    edges which are not in our tractable subgraph.


    Next, we define the mean parameter space of the restricted model as follows:


    $$\mathbb{M}_F(G) \triangleq \{ \boldsymbol{\mu} \in \mathbb{R}^d : \boldsymbol{\mu}
    = \mathbb{E}_\boldsymbol{\theta} [\mathcal{T}(\boldsymbol{z})] \text{ for some
    } \boldsymbol{\theta} \in \Omega(F) \}$$ (10.9)


    This is called an **inner approximation** to the marginal polytope, since $\mathbb{M}_F(G)
    \subseteq \mathbb{M}(G)$. See Figure 9.1(b) for a sketch. Note that $\mathbb{M}_F(G)$
    is a non-convex polytope, which results in multiple local optima.


    Thus the mean field problem becomes


    $$\max_{\boldsymbol{\mu} \in \mathbb{M}_F(G)} \boldsymbol{\theta}^T \boldsymbol{\mu}
    + \mathbb{H}_{MF}(\boldsymbol{\mu})$$ (10.10)


    This requires maximizing a concave objective over a non-convex set. It is typically
    optimized using coordinate ascent, since it is easy to optimize a scalar concave
    function over the marginal distribution for each node.


    # 10.1.3 Loopy belief propagation as VI


    Recall from Section 10.1.1 that exact inference can be posed as solving the following
    optimization problem: $\max_{\boldsymbol{\mu} \in \mathbb{M}(G)} \boldsymbol{\theta}^T
    \boldsymbol{\mu} + \mathbb{H}(\boldsymbol{\mu})$, where $\mathbb{M}(G)$ is the
    marginal polytope corresponding to the graph (see Section 9.1.2 for details).
    Since this set has exponentially many facets, it is intractable to optimize over.


    In Section 10.1.2, we discussed the mean field approximation, which uses a nonconvex
    inner approximation, $\mathbb{M}_F(G)$, obtained by dropping some edges from the
    graphical model, thus enforcing a factorization of the posterior. We also approximated
    the entropy by using the entropy of each marginal.'
