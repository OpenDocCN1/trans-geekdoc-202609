    # 31.2.3.5 Marginal likelihood for non-tabular CPDs


    If all CPDs are linear Gaussian, we can replace the Dirichlet-multinomial model
    with the normal-gamma model, and thus derive a different exact expression for
    the marginal likelihood. See [GH94] for the details. In fact, we can easily combine
    discrete nodes and Gaussian nodes, as long as the discrete nodes always have discrete
    parents; this is called a conditional Gaussian DAG. Again, we can compute the
    marginal likelihood in closed form. See [BD03] for the details.


    In the general case (i.e., everything except Gaussians and CPTs), we need to approximate
    the marginal likelihood. The simplest approach is to use the BIC approximation,
    which has the form


    \sum_t \log p(\mathcal{D}_t | \hat{\theta}_t) - \frac{K_t C_t}{2} \log N \quad
    (31.28)


    # 31.2.4 Bayesian model selection: algorithms


    In this section, we discuss some algorithms for approximately computing the mode
    of (or samples from) the posterior p(G|D).


    # 31.2.4.1 The K2 algorithm for known node orderings


    Suppose we know a total ordering of the nodes. Then we can compute the distribution
    over parents for each node independently, without the risk of introducing any
    directed cycles: we simply enumerate over all possible subsets of ancestors and
    compute their marginal likelihoods. If we just return the best set of parents
    for each node, we get the the K2 algorithm [CH92]. In this case, we can find the
    best set of parents for each node using l1-regularization, as shown in [SNMM07].


    # 31.2.4.2 Dynamic programming algorithms


    In general, the ordering of the nodes is not known, so the posterior does not
    decompose. Nevertheless, we can use dynamic programming to find the globally optimal
    MAP DAG (up to Markov equivalence), as shown in [KS04; SM06].


    If our goal is knowledge discovery, the MAP DAG can be misleading, for reasons
    we discussed in ??. A better approach is to compute the marginal probability that
    each edge is present, p(G_st = 1|D). We can also compute these quantities using
    dynamic programming, as shown in [Koi06; PK11].


    Unfortunately, all of these methods take V2^V time in the general case, making
    them intractable for graphs with more than about 16 nodes.'
