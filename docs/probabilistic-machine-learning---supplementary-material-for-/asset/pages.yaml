    # ## 31.2.5.2 PC algorithm


    A significant speedup of IC, known as the **PC algorithm** after is creators Peter
    Spirtes and Clark Glymour [SG91], can be obtained by ordering the search for separating
    sets in step 1 in terms of sets of increasing cardinality. We start with a fully
    connected graph, and then look for sets $S_{ab}$ of size 0, then of size 1, and
    so on; as soon as we find a separating set, we remove the corresponding edge.
    See Figure 31.9 for an example.


    Another variant on the PC algorithm is to learn the original undirected structure
    (i.e., the Markov blanket of each node) using generic variable selection techniques
    instead of CI tests. This tends to be more robust, since it avoids issues of statistical
    significance that can arise with independence tests. See [PE08] for details.


    The running time of the PC algorithm is $O(D^{K+1})$ [SGS00, p85], where $D$ is
    the number of nodes and $K$ is the maximal degree (number of neighbors) of any
    node in the corresponding undirected graph.


    # ## 31.2.5.3 Frequentist vs Bayesian methods


    The IC/PC algorithm relies on an oracle that can test for conditional independence
    between any set of variables, \( A \perp B | C \). This can be approximated using
    hypothesis testing methods applied to a finite data set, such as chi-squared tests
    for discrete data. However, such methods work poorly with small sample sizes,
    and can run into problems with multiple testing (since so many hypotheses are
    being compared). In addition, errors made at any given step can lead to an incorrect
    final result, as erroneous constraints get propagated. In practice it is common
    to use a hybrid approach, where we use IC/PC to create an initial structure, and
    then use this to speed up Bayesian model selection, which tends to be more robust,
    since it avoids any hard decisions about conditional independence or lack thereof.


    # ## 31.2.6 Methods based on sparse optimization


    There is a 1:1 connection between sparse graphs and sparse adjacency matrices.
    This suggests that we can perform structure learning by using continuous optimization
    methods that enforce sparsity, similar to lasso and other \(\ell_1\) penalty methods
    (**??**). In the cases of undirected graphs, this is relatively straightforward,
    and results in a convex objective, as we discuss in Section 31.3.2. However, in
    the case of DAGs, the problem is harder, because of the acyclicity constraint.
    Fortunately, [Zhe+18] showed how to encode this constraint as a smooth penalty
    term. (They call their method “DAGs with no tears”, since it is supposed to be
    painless to'
