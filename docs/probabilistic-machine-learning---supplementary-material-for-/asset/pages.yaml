    # 9.1.4 Graphcuts


    In this section, we show how to find MAP state estimates, or equivalently, minimum
    energy configurations, by using the **maxflow / mincut** algorithm for graphs.
    This class of methods is known as **graphcuts** and is very widely used, especially
    in computer vision applications (see e.g., [BK04]).


    We will start by considering the case of MRFs with binary nodes and a restricted
    class of potentials; in this case, graphcuts will find the exact global optimum.
    We then consider the case of multiple states per node; we can approximately solve
    this case by solving a series of binary subproblems, as we will see.


