    we can recover identifiability.


    For example, consider the ICA model from **??**. This is a simple linear model
    of the form y = Ax, where p(x) has a non-Gaussian distribution, and p(y|x) is
    a degenerate distribution, since we assume the observation model is deterministic
    (noise-free). In the ICA case, we can uniquely identify the parameters A and the
    corresponding latent source x. This lets us distinguish the X → Y model from the
    Y → X model. (The intuition behind this method is that linear combinations of
    random variables tend towards a Gaussian distribution (by the central limit theorem),
    so if X → Y, then p(Y) will “look more Gaussian” than p(X).)


