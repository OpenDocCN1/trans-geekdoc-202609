  md: 'al. decided to see what would happen if they introduced a hidden variable H,
    which they made a parent of both SES and IQ, representing a hidden common cause.
    They also considered a variant in which H points to SES, IQ and PE. For both such
    cases, they considered dropping none, one, or both of the SES-PE and PE-IQ edges.
    They varied the number of states for the hidden node from 2 to 6. Thus they computed
    the approximate posterior over $8 \times 5 = 40$ different models, using the CS
    approximation.


    The most probable model which they found is shown in Figure 31.10. This is $2
    \cdot 10^{10}$ times more likely than the best model containing no hidden variable.
    It is also $5 \cdot 10^9$ times more likely than the second most probable model
    with a hidden variable. So again the posterior is very peaked.


    These results suggests that there is indeed a hidden common cause underlying both
    the socio-economic status of the parents and the IQ of the children. By examining
    the CPT entries, we see that both SES and IQ are more likely to be high when H
    takes on the value 1. They interpret this to mean that the hidden variable represents
    “parent quality” (possibly a genetic factor). Note, however, that the arc between
    H and SES can be reversed without changing the v-structures in the graph, and
    thus without affecting the likelihood; this underscores the difficulty in interpreting
    hidden variables.


    Interestingly, the hidden variable model has the same conditional independence
    assumptions amongst the visible variables as the most probable visible variable
    model. So it is not possible to distinguish between these hypotheses by merely
    looking at the empirical conditional independencies in the data (which is the
    basis of the constraint-based approach to structure learning discussed in Section
    31.2.5). Instead, by adopting a Bayesian approach, which takes parsimony into
    account (and not just conditional independence), we can discover the possible
    existence of hidden factors. This is the basis of much of scientific and everyday
    human reasoning (see e.g. [GT09] for a discussion).


    # 31.2.8.6 Structural EM


    One way to perform structural inference in the presence of missing data is to
    use a standard search procedure (deterministic or stochastic), and to use the
    methods from Section 31.2.8.1 to estimate the marginal likelihood. However, this
    approach is not very efficient, because the marginal likelihood does not decompose
    when we have missing data, and nor do its approximations. For example, if we use
    the CS approximation or the VBEM approximation, we have to perform inference in
    every neighboring model, just to evaluate the quality of a single move!


    [Fri97; Thi+98] presents a much more efficient approach called the **structural
    EM** algorithm. The basic idea is this: instead of fitting each candidate neighboring
    graph and then filling in its data, fill in the data once, and use this filled-in
    data to evaluate the score of all the neighbors. Although this might be a bad
    approximation to the marginal likelihood, it can be good enough approximation
    of the difference in marginal likelihoods between different models, which is all
    we need in order to pick the best neighbor.


    More precisely, define $\overline{\mathcal{D}}(G_0, \hat{\theta}_0)$ to be the
    data filled in using model $G_0$ with MAP parameters $\hat{\theta}_0$. Now define
    a modified BIC score as follows:


    ```

    \(\text{BIC}(G, \mathcal{D}) \triangleq \log p(\mathcal{D}|\hat{\theta}, G) -
    \frac{\log N}{2} \text{dim}(G) + \log p(G) + \log p(\hat{\theta}|G)\) (31.41)

    ```


    where we have included the log prior for the graph and parameters. One can show
    [Fri97] that if we pick a graph $G$ which increases the BIC score relative to
    $G_0$ on the expected data, it will also increase the score on the actual data,
    i.e.,


    ```

    \(\text{BIC}(G, \overline{\mathcal{D}}) - \text{BIC}(G_0, \overline{\mathcal{D}})
    \le \text{BIC}(G, \mathcal{D}) - \text{BIC}(G_0, \mathcal{D})\) (31.42)

    ```


    To convert this into an algorithm, we proceed as follows. First we initialize
    with some graph $G_0$ and some set of parameters $\theta_0$. Then we fill-in the
    data using the current parameters — in practice, this means when we ask for the
    expected counts for any particular family, we perform inference using our current
    model. (If we know which counts we will need, we can precompute all of them, which
    is much faster.) We then evaluate the BIC score of all of our neighbors using
    the filled-in data, and we pick the best neighbor. We then refit the model parameters,
    fill-in the data again, and repeat. For increased speed, we may choose to only
    refit the model every few steps, since small changes to the structure hopefully
    won’t invalidate the parameter estimates and the filled-in data too much.'
