  md: '# Chapter 9


    # Message passing inference


    # 9.1 MAP estimation for discrete PGMs


    In this section, we consider the problem of finding the most probable configuration
    of variables in a probabilistic graphical model, i.e., our goal is to find a MAP
    assignment \(\boldsymbol{x}^* = \arg\max_{\boldsymbol{x} \in \mathcal{X}^V} p(\boldsymbol{x})\),
    where \(\mathcal{X} = \{1, \dots, K\}\) is the discrete state space of each node,
    \(V\) is the number of nodes, and the distribution is defined according to a Markov
    Random field (**??**) with pairwise cliques, one per edge:


    \(p(\boldsymbol{x}) = \frac{1}{Z} \exp \left\{ \sum_{s \in \mathcal{V}} \theta_s(x_s)
    + \sum_{(s,t) \in \mathcal{E}} \theta_{st}(x_s, x_t) \right\}\) (9.1)


    Here \(\mathcal{V} = \{x_1, \dots, x_V\}\) are the nodes, \(\mathcal{E}\) are
    the edges, \(\theta_s\) and \(\theta_{st}\) are the node and edge potentials,
    and \(Z\) is the partition function:


    \(Z = \sum_{\boldsymbol{x}} \exp \left\{ \sum_{s \in \mathcal{V}} \theta_s(x_s)
    + \sum_{(s,t) \in \mathcal{E}} \theta_{st}(x_s, x_t) \right\}\) (9.2)


    Since we just want the MAP configuration, we can ignore \(Z\), and just compute


    \(\boldsymbol{x}^* = \arg\max_{\boldsymbol{x}} \sum_{s \in \mathcal{V}} \theta_s(x_s)
    + \sum_{(s,t) \in \mathcal{E}} \theta_{st}(x_s, x_t)\) (9.3)


    We can compute this exactly using dynamic programming as we explain in **??**:
    However, this takes time exponential in the treewidth of the graph, which is often
    too slow. In this section, we focus on approximate methods that can scale to intractable
    models. We only give a brief description here; more details can be found in [WJ08;
    KF09].


    # 9.1.1 Notation


    To simplify the presentation, we write the distribution in the following form:


    \(p(\boldsymbol{x}) = \frac{1}{Z(\boldsymbol{\theta})} \exp(-\mathcal{E}(\boldsymbol{x}))\mathcal{E}(\boldsymbol{x})
    \triangleq -\boldsymbol{\theta}^T \mathcal{T}(\boldsymbol{x})\) (9.4)


    where \(\boldsymbol{\theta} = (\{\theta_{s,j}\}, \{\theta_{s,t;j,k}\})\) are all
    the node and edge parameters (the canonical parameters), and \(\mathcal{T}(\boldsymbol{x})
    = (\{\mathbb{I}(x_s = j)\}, \{\mathbb{I}(x_s = j, x_t = k)\})\) are all the node
    and edge indicator functions (the sufficient statistics). Note: we use \(s, t
    \in \mathcal{V}\) to index nodes and \(j, k \in \mathcal{X}\) to index states.


    The mean of the sufficient statistics are known as the mean parameters of the
    model, and are given by


    \(\boldsymbol{\mu} = \mathbb{E}[\mathcal{T}(\boldsymbol{x})] = (\{p(x_s = j)\}_s,
    \{p(x_s = j, x_t = k)\}_{s \neq t}) = (\{\mu_{s;j}\}_s, \{\mu_{st;jk}\}_{s \neq
    t})\) (9.5)'
