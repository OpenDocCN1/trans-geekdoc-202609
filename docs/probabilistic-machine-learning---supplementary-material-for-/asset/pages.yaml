  md: 'The model was trained on about 100 billion text snippets or search queries;
    this takes several weeks, even on a parallel distributed computing architecture.
    The resulting model contains 12 million word nodes and about 1 million latent
    cluster nodes. There are about 350 million links in the model, including many
    cluster-cluster dependencies. The longest path in the graph has length 555, so
    the model is quite deep.


    Exact inference in this model is obviously infeasible. However note that most
    leaves will be off, since most words do not occur in a given query; such leaves
    can be analytically removed. We can also prune out unlikely hidden nodes by following
    the strongest links from the words that are up to their parents to get a candidate
    set of concepts. We then perform iterative conditional modes (ICM) to form approximate
    inference. (ICM is a deterministic version of Gibbs sampling that sets each node
    to its most probable state given the values of its neighbors in its Markov blanket.)
    This continues until it reaches a local maximum. We can repeat this process a
    few times from random starting configurations. At Google, this can be made to
    run in 15 milliseconds!


    # 31.2.8.9 Spectral methods


    Recently, various methods have been developed that can recover the exact structure
    of the DAG, even in the presence of (a known number of) latent variables, under
    certain assumptions. In particular, identifiability results have been obtained
    for the following cases:


    +   If x contains 3 of more indepenent views of z [Goo74; AMR09; AHK12; HKZ12],
    sometimes called the triad constraint.


    +   If z is categorical, and x is a GMM with mixture components which depend on
    z [Ana+14].


    +   If z is composed of binary variables, and x is a set of noisy-OR CPDs [JHS13;
    Aro+16].


    In terms of algorithms, most of these methods are not based on maximum likelihood,
    but instead use the method of moments and spectral methods. For details, see [Ana+14].


    # 31.2.8.10 Constraint-based methods for learning ADMGs


    An alternative to explicitly modeling latent variables is to marginalize them
    out, and work with acyclic directed mixed graphs (??). It is possible to perform
    Bayesian model selection for ADMGs, although the method is somewhat slow and complicated
    [SG09]. Alternatively, one can modify the PC/IC algorithm to learn an ADMG. This
    method is known as the IC* algorithm [Pea09, p52]: one can speed it up to get
    the FCI algorithm (FCI stands for “fast causal inference”) [SGS00, p144].


    Since there will inevitably be some uncertainty about edge orientations, due to
    Markov equivalence, the output of IC*/ FCI is not actually an ADMG, but is a closely
    related structured called a partially oriented inducing path graph [SGS00, p135]
    or a marked pattern [Pea09, p52]. Such a graph has 4 kinds of edges:


    +   A marked arrow a *-> b signifying a directed path from a to b.


    +   An unmarked arrow a -> b signifying a directed path from a to b or a latent
    common cause a <- L -> b.


    +   A bidirected arrow a <- b signifying a latent common causes a <- L -> b.


    +   An undirected edge a - b signifying a <- b or a -> b or a latent common causes
    a <- L -> b.


    IC*/ FCI is faster than Bayesian inference, but suffers from the same problems
    as the original IC/PC algorithm (namely, the need for a CI testing oracle, problems
    due to multiple testing, no probabilistic representation of uncertainty, etc.)
    Furthermore, by not explicitly representing the latent variables, the resulting
    model cannot be used for inference and prediction.


