    ![](img/c73db5a1f734ebb7c0655f19e5bc9daa_52_1.png)


    Figure 6.2: Illustration of the benefits of using a lower-bounded loss function
    when training a resnet-128 CNN on the CIFAR10 image classification dataset. The
    curves are as follows: SGM (stochastic gradient method, i.e., SGD), Adam, truncated
    SGD and truncated AdaGrad. (a) Time to reach an error that satisfies \(\mathcal{L}(\boldsymbol{\theta}_t)
    - \mathcal{L}(\boldsymbol{\theta}^*) \le \epsilon\) vs initial learning rate \(\eta_0\).
    (b) Top-1 accuracy after 50 epochs vs \(\eta_0\). The lines represent median performance
    across 50 random restarts, and the shading represents 90% confidence intervals.
    From Figure 4 of [AD19c]. Used with kind permission of Hilal Asi.


    # 6.1.3.3 Beyond linear approximations (truncated ADAGRAD)


    Sometimes we can do better than just using PPM with a linear approximation to
    the objective, at essentially no extra cost, as pointed out in [AD19b; AD19a;
    AD19c]. For example, suppose we know a lower bound on the loss, \(\ell_t^{\min}
    = \min_{\boldsymbol{\theta}} \ell_t(\boldsymbol{\theta})\). For example, when
    using squared error, or cross-entropy loss for discrete labels, we have \(\ell_t(\boldsymbol{\theta})
    \ge 0\). Let us therefore define the **truncated model**


    ```

    \(\hat{\ell}_t(\boldsymbol{\theta}) = \max (\ell_t(\boldsymbol{\theta}) + \boldsymbol{g}_t^\top
    (\boldsymbol{\theta} - \boldsymbol{\theta}_t), \ell_t^{\min})\) (6.39)

    ```


    We can further improve things by replacing the Euclidean norm with a scaled Euclidean
    norm, where the diagonal scaling matrix is given by \(\mathbf{A}_t = \text{diag}(\sum_{i=1}^t
    \boldsymbol{g}_i \boldsymbol{g}_i^\top)^{\frac{1}{2}}\), as in ADAGRAD [DHS11].
    If \(\ell_t^{\min} = 0\), the resulting proximal update becomes


    ```

    \(\boldsymbol{\theta}_{t+1} = \underset{\boldsymbol{\theta}}{\text{argmin}} \left[
    \ell_t(\boldsymbol{\theta}_t) + \boldsymbol{g}_t^\top (\boldsymbol{\theta} - \boldsymbol{\theta}_t)
    \right]_+ + \frac{1}{2\eta_t} (\boldsymbol{\theta} - \boldsymbol{\theta}_t)^\top
    \mathbf{A}_t (\boldsymbol{\theta} - \boldsymbol{\theta}_t)\) (6.40)


    \(= \boldsymbol{\theta}_t - \min(\eta_t, \frac{\ell_t(\boldsymbol{\theta}_t)}{\boldsymbol{g}_t^\top
    \mathbf{A}_t^{-1} \boldsymbol{g}_t}) \boldsymbol{g}_t\) (6.41)

    ```


    Thus the update is like a standard SGD update, but we truncate the learning rate
    if it is too big.$^1$


    [AD19c] call this **truncated AdaGrad**. Furthermore, they prove optimizing this
    truncated linear approximation (with or without AdaGrad weighting), instead of
    the standard linear approximation used by gradient descent, can result in significant
    benefits. In particular, it is guaranteed to be stable (under certain technical
    conditions) for any learning rate, whereas standard GD can “blow up”, even for
    convex problems.


    Figure 6.2 shows the benefits of this approach when training a resnet-128 CNN
    (**??**) on the CIFAR10 image classification dataset. For SGD and the truncated
    proximal method, the learning rate is decayed using \(\eta_t = \eta_0 t^{-\beta}\)
    with \(\beta = 0.6\). For Adam and truncated ADAGRAD, the learning rate is set
    to \(\eta_t = \eta_0\), since we use diagonal scaling. We see that both truncated
    methods (regular and ADAGRAD version) have good performance for a much broader
    range of initial learning rate \(\eta_0\) compared to SGD or Adam.


    $^1$One way to derive this update (suggested by Hilal Asi) is to do case anaylsion
    the value of \(\hat{\ell}_t(\boldsymbol{\theta}_{t+1})\), where \(\hat{\ell}_t\)
    is the truncated linear model. If \(\hat{\ell}_t(\boldsymbol{\theta}_{t+1}) >
    0\), then setting the gradient to zero yields the usual SGD update, \(\boldsymbol{\theta}_{t+1}
    = \boldsymbol{\theta}_t - \eta_t \boldsymbol{g}_t\). (We assume \(\mathbf{A}_t
    = \mathbf{I}\) for simplicity.) Otherwise we must have \(\hat{\ell}_t(\boldsymbol{\theta}_{t+1})
    = 0\). But we know that \(\boldsymbol{\theta}_{t+1} = \boldsymbol{\theta}_t -
    \lambda \boldsymbol{g}_t\) for some \(\lambda\), so we solve \(\hat{\ell}_t(\boldsymbol{\theta}_t
    - \lambda \boldsymbol{g}_t) = 0\) to get \(\lambda = \hat{\ell}_t(\boldsymbol{\theta}_t)
    / \|\boldsymbol{g}_t\|_2^2\).'
