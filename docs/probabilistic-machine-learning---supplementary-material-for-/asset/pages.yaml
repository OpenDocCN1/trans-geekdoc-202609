    # 6.3.1 Evolutionary algorithms


    Since EA algorithms draw inspiration from the biological process of evolution,
    they also borrow a lot of its terminology. The fitness of a member of the population
    is the value of the objective function (possibly normalized across population
    members). The members of the population at step t + 1 are called the offspring.
    These can be created by randomly choosing a parent from \(\mathcal{S}_t\) and
    applying a random mutation to it. This is like asexual reproduction. Alternatively
    we can create an offspring by choosing two parents from \(\mathcal{S}_t\), and
    then combining them in some way to make a child, as in sexual reproduction; combining
    the parents is called recombination. (It is often followed by mutation.)


    The procedure by which parents are chosen is called the selection function. In
    truncation selection, each parent is chosen from the fittest K members of the
    population (known as the elite set). In tournament selection, each parent is the
    fittest out of K randomly chosen members. In fitness proportionate selection,
    also called roulette wheel selection, each parent is chosen with probability proportional
    to its fitness relative to the others. We can also “kill off” the oldest members
    of the population, and then select parents based on their fitness; this is called
    regularized evolution [Rea+19].


    In addition to the selection rule for patents, we need to specify the recombination
    and mutation rules. There are many possible choices for these heuristics. We briefly
    mention a few of them below.


    +   • In a genetic algorithm (GA) [Gol89; Hol92], we use mutation and a particular
    recombination method based on crossover. To implement crossover, we assume each
    individual is represented as a vector of integers or binary numbers, by analogy
    to chromosomes. We pick a split point along the chromosome for each of the two
    chosen parents, and then swap the strings, as illustrated in Figure 6.5.


    +   • In genetic programming [Koz92], we use use a tree-structured representation
    of individuals, instead of a bit string. This representation ensures that all
    crossovers result in valid children, as illustrated in Figure 6.7. Genetic programming
    can be useful for finding good programs as well as other structured objects, such
    as neural networks. In evolutionary programming, the structure of the tree is
    fixed and only the numerical parameters are evolved.


    +   • In surrogate assisted EA, a surrogate function \(\hat{f}(s)\) is used instead
    of the true objective function \(f(s)\) in order to speed up the evaluation of
    members of the population (see [Jin11] for a survey). This'
