- pgno: 102
  md: '# Chapter 15


    # Generalized linear models


    # 15.1 Variational inference for logistic regression


    In this section we discuss a variational approach to Bayesian inference for logistic
    regression models based on local bounds to the likelihood. We will use a Gaussian
    prior, \( p(w) = \mathcal{N}(w|\mu_0, V_0) \). We will create a “Gaussian-like”
    lower bound to the likelihood, which becomes conjugate to this prior. We then
    iteratively improve this lower bound.


    # 15.1.1 Binary logistic regression


    In this section, we discuss VI for binary logistic regression. Our presentation
    follows [Bis06, Sec 10.6].


    Let us first rewrite the likelihood for a single observation as follows:


    ```

    \(\begin{aligned} p(y_n|x_n, w) &= \sigma(\eta_n)^{y_n}(1 - \sigma(\eta_n))^{1-y_n}
    \tag{15.1} \\ &= \left( \frac{1}{1+e^{-\eta_n}} \right)^{y_n} \left( 1 - \frac{1}{1+e^{-\eta_n}}
    \right)^{1-y_n} \tag{15.2} \\ &= e^{-\eta_n y_n} \frac{e^{-\eta_n}}{1 + e^{-\eta_n}}
    = e^{-\eta_n y_n} \sigma(-\eta_n) \tag{15.3} \end{aligned}\)

    ```


    where \(\eta_n = w^T x_n\) are the logits. This is not conjugate to the Gaussian
    prior. So we will use the following “Gaussian-like” variational lower bound to
    the sigmoid function, proposed in [JJ96; JJ00]:


    ```

    \(\sigma(\eta_n) \ge \sigma(\psi_n) \exp [(\eta_n - \psi_n)/2 - \lambda(\psi_n)(\eta_n^2
    - \psi_n^2)] \tag{15.4}\)

    ```


    where \(\psi_n\) is the variational parameter for datapoint \(n\), and


    ```

    \(\lambda(\psi) \triangleq \frac{1}{4\psi} \tanh(\psi/2) = \frac{1}{2\psi} \left[
    \sigma(\psi) - \frac{1}{2} \right] \tag{15.5}\)

    ```


    We shall refer to this as the JJ bound, after its inventors, Jaakkola and Jordan.
    See Figure 15.1(a) for a plot, and see Section 6.5.4.2 for a derivation.


    Using this bound, we can write


    ```

    \(p(y_n|x_n, w) = e^{-\eta_n y_n} \sigma(-\eta_n) \ge e^{-\eta_n y_n} \sigma(\psi_n)
    \exp [(-\eta_n + \psi_n)/2 - \lambda(\psi_n)(\eta_n^2 - \psi_n^2)] \tag{15.6}\)

    ```


    We can now lower bound the log joint as follows:


    ```

    \(\begin{aligned} \log p(y|X, w) + \log p(w) \ge {} &-\frac{1}{2}(w - \mu_0)^T
    V_0^{-1}(w - \mu_0) \tag{15.7} \\ &+ \sum_{n=1}^N [\eta_n(y_n - 1/2) - \lambda(\psi_n)w^T(x_n
    x_n^T)w] \tag{15.8} \end{aligned}\)

    ```'
