    # ## 15.3.2 Beta-binomial logistic regression


    In some cases, there is more variability in the observed counts than we might
    expect from just a binomial model, even after taking into account the observed
    predictors. This is called **over-dispersion**, and is usually due to unobserved
    factors that are omitted from the model. In such cases, we can use a **beta-binomial**
    model instead of a binomial model:


    ```

    \(y_i \sim \text{BetaBinom}(m_i, \alpha_i, \beta_i)\) (15.68)


    \(\alpha_i = \pi_i \kappa\) (15.69)


    \(\beta_i = (1 - \pi_i) \kappa\) (15.70)


    \(\pi_i = \sigma(\mathbf{w}^\top \mathbf{x}_i)\) (15.71)

    ```'
