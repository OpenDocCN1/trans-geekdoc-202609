- pgno: 12
  md: 'We will now derive the results for marginalizing in information form. Let


    ```

    \(\begin{pmatrix} \Sigma_{11} & \Sigma_{12} \\ \Sigma_{21} & \Sigma_{22} \end{pmatrix}
    = \begin{pmatrix} \Lambda_{11} & \Lambda_{12} \\ \Lambda_{21} & \Lambda_{22} \end{pmatrix}^{-1}
    \qquad (2.30)\)

    \(= \begin{pmatrix} \Lambda_{11}^{-1} + \Lambda_{11}^{-1}\Lambda_{12}(\Lambda/\Lambda_{11})^{-1}\Lambda_{21}\Lambda_{11}^{-1}
    & -\Lambda_{11}^{-1}\Lambda_{12}(\Lambda/\Lambda_{11})^{-1} \\ -(\Lambda/\Lambda_{11})^{-1}\Lambda_{21}\Lambda_{11}^{-1}
    & (\Lambda/\Lambda_{11})^{-1} \end{pmatrix} \qquad (2.31)\)

    ```


    Hence


    ```

    \(\Lambda_{22}^m = \Sigma_{22}^{-1} = \Lambda/\Lambda_{11} = \Lambda_{22} - \Lambda_{21}\Lambda_{11}^{-1}\Lambda_{12}
    \qquad (2.32)\)

    \(\eta_2^m = \Lambda_{22}^m\mu_2^m = (\Lambda_{22} - \Lambda_{21}\Lambda_{11}^{-1}\Lambda_{12})\mu_2
    \qquad (2.33)\)

    \(= \Lambda_{22}\mu_2 - \Lambda_{21}\Lambda_{11}^{-1}\Lambda_{12}\mu_2 \qquad
    (2.34)\)

    \(= (\Lambda_{21}\mu_1 + \Lambda_{22}\mu_2) - \Lambda_{21}\Lambda_{11}^{-1}(\Lambda_{11}\mu_1
    + \Lambda_{12}\mu_2) \qquad (2.35)\)

    \(= \eta_2 - \Lambda_{21}\Lambda_{11}\eta_1 \qquad (2.36)\)

    ```


    # 2.1.2 Deriving Bayes rule for linear Gaussian systems


    We now derive Bayes rule for Gaussians. The basic idea is to derive the joint
    distribution, \(p(z, y) = p(z)p(y|z)\), and then to use the results for conditioning
    Gaussians for computing \(p(z|y)\).


    In more detail, we proceed as follows. The log of the joint distribution is as
    follows (dropping irrelevant constants):


    ```

    \(\log p(z, y) = -\frac{1}{2}(z - \mu_z)^T \Sigma_z^{-1}(z - \mu_z) - \frac{1}{2}(y
    - \mathbf{W}z - b)^T \Sigma_y^{-1}(y - \mathbf{W}z - b) \qquad (2.37)\)

    ```


    This is clearly a joint Gaussian distribution, since it is the exponential of
    a quadratic form.


    Expanding out the quadratic terms involving \(\mathbf{z}\) and \(\mathbf{y}\),
    and ignoring linear and constant terms, we have


    ```

    \(Q = -\frac{1}{2}z^T \Sigma_z^{-1}z - \frac{1}{2}y^T \Sigma_y^{-1}y - \frac{1}{2}(\mathbf{W}z)^T
    \Sigma_y^{-1}(\mathbf{W}z) + y^T \Sigma_y^{-1}\mathbf{W}z \qquad (2.38)\)

    \(= -\frac{1}{2} \begin{pmatrix} z \\ y \end{pmatrix}^T \begin{pmatrix} \Sigma_z^{-1}
    + \mathbf{W}^T \Sigma_y^{-1}\mathbf{W} & -\mathbf{W}^T \Sigma_y^{-1} \\ -\Sigma_y^{-1}\mathbf{W}
    & \Sigma_y^{-1} \end{pmatrix} \begin{pmatrix} z \\ y \end{pmatrix} \qquad (2.39)\)

    \(= -\frac{1}{2} \begin{pmatrix} z \\ y \end{pmatrix}^T \Sigma^{-1} \begin{pmatrix}
    z \\ y \end{pmatrix} \qquad (2.40)\)

    ```


    where the precision matrix of the joint is defined as


    ```

    \(\Sigma^{-1} = \begin{pmatrix} \Sigma_z^{-1} + \mathbf{W}^T \Sigma_y^{-1}\mathbf{W}
    & -\mathbf{W}^T \Sigma_y^{-1} \\ -\Sigma_y^{-1}\mathbf{W} & \Sigma_y^{-1} \end{pmatrix}
    \triangleq \Lambda = \begin{pmatrix} \Lambda_{xx} & \Lambda_{xy} \\ \Lambda_{yx}
    & \Lambda_{yy} \end{pmatrix} \qquad (2.41)\)

    ```


    From Equation ??, and using the fact that \(\mu_y = \mathbf{W}\mu_z + b\), we
    have


    ```

    \(p(z|y) = \mathcal{N}(\mu_{z|y}, \Sigma_{z|y}) \qquad (2.42)\)

    \(\Sigma_{z|y} = \Lambda_{xx}^{-1} = (\Sigma_z^{-1} + \mathbf{W}^T \Sigma_y^{-1}\mathbf{W})^{-1}
    \qquad (2.43)\)

    \(\mu_{z|y} = \Sigma_{z|y}(\Lambda_{xx}\mu_z - \Lambda_{xy}(y - \mu_y)) \qquad
    (2.44)\)

    \(= \Sigma_{z|y}(\Sigma_z^{-1}\mu_z + \mathbf{W}^T \Sigma_y^{-1}\mathbf{W}\mu_z
    + \mathbf{W}^T \Sigma_y^{-1}(y - \mu_y)) \qquad (2.45)\)

    \(= \Sigma_{z|y}(\Sigma_z^{-1}\mu_z + \mathbf{W}^T \Sigma_y^{-1}(\mathbf{W}\mu_z
    + y - \mu_y)) \qquad (2.46)\)

    \(= \Sigma_{z|y}(\Sigma_z^{-1}\mu_z + \mathbf{W}^T \Sigma_y^{-1}(y - b)) \qquad
    (2.47)\)

    ```'
