    # ## 9.1.2 The marginal polytope


    The space of allowable \(\boldsymbol{\mu}\) vectors is called the **marginal polytope**,
    and is denoted \(\mathbb{M}(G)\), where \( G \) is the structure of the graph.
    This is defined to be the set of all mean parameters for the given model that
    can be generated from a valid probability distribution:


    \( \mathbb{M}(G) \triangleq \{ \boldsymbol{\mu} \in \mathbb{R}^d : \exists p \text{
    s.t. } \boldsymbol{\mu} = \sum_{\mathbf{x}} \mathcal{T}(\mathbf{x}) p(\mathbf{x})
    \text{ for some } p(\mathbf{x}) \ge 0, \sum_{\mathbf{x}} p(\mathbf{x}) = 1 \}
    \tag{9.8} \)


    For example, consider an Ising model. If we have just two nodes connected as \(
    X_1 - X_2 \), one can show that we have the following minimal set of constraints:
    \( 0 \le \mu_{12} \), \( 0 \le \mu_{12} \le \mu_1 \), \( 0 \le \mu_{12} \le \mu_2
    \), and \( 1 + \mu_{12} - \mu_1 - \mu_2 \ge 0 \). We can write these in matrix-vector
    form as


    \( \left( \begin{array}{ c c c } 0 & 0 & 1 \\ 1 & 0 & -1 \\ 0 & 1 & -1 \\ -1 &
    -1 & 1 \end{array} \right) \left( \begin{array}{ c } \mu_1 \\ \mu_2 \\ \mu_{12}
    \end{array} \right) \ge \left( \begin{array}{ c } 0 \\ 0 \\ 0 \\ -1 \end{array}
    \right) \tag{9.9} \)


    These four constraints define a series of half-planes, whose intersection defines
    a polytope, as shown in Figure 9.1(a).


    Since \(\mathbb{M}(G)\) is obtained by taking a convex combination of the \(\mathcal{T}(\mathbf{x})\)
