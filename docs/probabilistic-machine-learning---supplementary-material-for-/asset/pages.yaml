  md: '![](img/c73db5a1f734ebb7c0655f19e5bc9daa_173_0.png)


    Figure 31.11: A DGM with and without hidden variables. For example, the leaves
    might represent medical symptoms, the root nodes primary causes (such as smoking,
    diet and exercise), and the hidden variable can represent mediating factors, such
    as heart disease. Marginalizing out the hidden variable induces a clique.


    One interesting application is to learn a phylogenetic tree structure. Here the
    observed leaves are the DNA or protein sequences of currently alive species, and
    the goal is to infer the topology of the tree and the values of the missing internal
    nodes. There are many classical algorithms for this task (see e.g., [Dur+98]),
    but one that uses structural EM is discussed in [Fri+02].


    Another interesting application of this method is to learn sparse mixture models
    [BF02]. The idea is that we have one hidden variable C specifying the cluster,
    and we have to choose whether to add edges C → Xt for each possible feature Xt.
    Thus some features will be dependent on the cluster id, and some will be independent.
    (See also [LFJ04] for a different way to perform this task, using regular EM and
    a set of bits, one per feature, that are free to change across data cases.)


    # 31.2.8.7 Discovering hidden variables


    In Section 31.2.8.5, we introduced a hidden variable “by hand”, and then figured
    out the local topology by fitting a series of different models and computing the
    one with the best marginal likelihood. How can we automate this process?


    Figure 31.11 provides one useful intuition: if there is a hidden variable in the
    “true model”, then its children are likely to be densely connected. This suggest
    the following heuristic [Eli+00]: perform structure learning in the visible domain,
    and then look for structural signatures, such as sets of densely connected nodes
    (near-cliques); introduce a hidden variable and connect it to all nodes in this
    near-clique; and then let structural EM sort out the details. Unfortunately, this
    technique does not work too well, since structure learning algorithms are biased
    against fitting models with densely connected cliques.


    Another useful intuition comes from clustering. In a flat mixture model, also
    called a latent class model, the discrete latent variable provides a compressed
    representation of its children. Thus we want to create hidden variables with high
    mutual information with their children.


    One way to do this is to create a tree-structured hierarchy of latent variables,
    each of which only has to explain a small set of children. [Zha04] calls this
    a hierarchical latent class model. They propose a greedy local search algorithm
    to learn such structures, based on adding or deleting hidden nodes, adding or
    deleting edges, etc. (Note that learning the optimal latent tree is NP-hard [Roc06].)


    Recently [HW11] proposed a faster greedy algorithm for learning such models based
    on agglomerative hierarchical clustering. Rather than go into details, we just
    give an example of what this system can learn. Figure 31.12 shows part of a latent
    forest learned from the 20-newsgroup data. The algorithm imposes the constraint
    that each latent node has exactly two children, for speed reasons. Nevertheless,
    we see interpretable clusters arising. For example, Figure 31.12 shows separate
    clusters concerning medicine, sports and religion. This provides an alternative
    to LDA and other topic models (Section 28.1.1), with the added advantage that
    inference in latent trees is exact and takes time linear in the number of nodes.'
