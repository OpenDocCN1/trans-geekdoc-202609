- pgno: 107
  md: '# 15.2 Converting multinomial logistic regression to Poisson regression


    It is possible to represent a multinomial logistic regression model with $K$ outputs
    as $K$ separate Poisson regression models. (Although the Poisson models are fit
    separately, they are implicitly coupled, since the counts must sum to $N_n$ across
    all $K$ outcomes.) This fact can enable more efficient training when the number
    of categories is large [Tad15].


    To see why this relationship is true, we follow the presentation of [McE20, Sec
    11.3.3]. We assume $K=2$ for notational brevity (i.e., binomial regression). Assume
    we have $m$ trials, with counts $y_1$ and $y_2$ of each outcome type. The multinomial
    likelihood has the form


    ```

    \( p(y_1, y_2 | m, \mu_1, \mu_2) = \frac{m!}{y_1! y_2!} \mu_1^{y_1} \mu_2^{y_2}
    \) (15.52)

    ```


    Now consider a product of two Poisson likelihoods, for each set of counts:


    ```

    \( p(y_1, y_2 | \lambda_1, \lambda_2) = p(y_1 | \lambda_1) p(y_2 | \lambda_2)
    = \frac{e^{-\lambda_1} \lambda_1^{y_1}}{y_1!} \frac{e^{-\lambda_2} \lambda_2^{y_2}}{y_2!}
    \) (15.53)

    ```


    We now show that these are equivalent, under a suitable setting of the parameters.


    Let \(\Lambda = \lambda_1 + \lambda_2\) be the expected total number of counts
    of any type, \(\mu_1 = \lambda_1 / \Lambda\) and \(\mu_2 = \lambda_2 / \Lambda\).
    Substituting into the binomial likelihood gives


    ```

    \( p(y_1, y_2 | m, \mu_1, \mu_2) = \frac{m!}{y_1! y_2!} \left( \frac{\lambda_1}{\Lambda}
    \right)^{y_1} \left( \frac{\lambda_2}{\Lambda} \right)^{y_2} = \frac{m!}{\Lambda^{y_1}
    \Lambda^{y_2}} \frac{\lambda_1^{y_1} \lambda_2^{y_2}}{y_1! y_2!} \) (15.54)

    ```


    ```

    \( = \frac{m!}{\Lambda^m} \frac{e^{-\lambda_1}}{e^{-\lambda_1}} \frac{\lambda_1^{y_1}}{y_1!}
    \frac{e^{-\lambda_2}}{e^{-\lambda_2}} \frac{\lambda_2^{y_2}}{y_2!} \) (15.55)

    ```


    ```

    \( = \frac{\frac{m!}{e^{-\Lambda} \Lambda^m}}{p(m-1)} \frac{ \frac{e^{-\lambda_1}
    \lambda_1^{y_1}}{y_1!} }{ p(y_1) } \frac{ \frac{e^{-\lambda_2} \lambda_2^{y_2}}{y_2!}
    }{ p(y_2) } \) (15.56)

    ```


    The final expression says that \( p(y_1, y_2 | m) = p(y_1) p(y_2) / p(m) \), which
    makes sense.


    # 15.3 Case study: is Berkeley admissions biased against women?


    In this section, we consider a simple but interesting example of logistic regression
    from [McE20, Sec 11.1.4]. The question of interest is whether admission to graduate
    school at UC Berkeley is biased against women. The dataset comes from a famous
    paper [BHO75], which collected statistics for 6 departments for men and women.
    The data table only has 12 rows, shown in Table 15.1, although the total sample
    size (number of observations) is 4526.


    We conduct a regression analysis to try to determine if gender **causes** imbalanced
    admissions rates. (This is a simple example of a **fairness** analysis.)


    # 15.3.1 Binomial logistic regression


    An obvious way to attempt to answer the question of interest is to fit a binomial
    logistic regression model, in which the outcome is the admissions rate for each
    row, and the input is the gender id of the corresponding group. One way to write
    this model is as follows:


    ```

    \( A_i \sim \text{Bin}(N_i, \mu_i) \) (15.57)

    \( \text{logit}(\mu_i) = \alpha + \beta_{\text{MALE}}[i] \) (15.58)

    \( \alpha \sim \mathcal{N}(0, 10) \) (15.59)

    \( \beta \sim \mathcal{N}(0, 1.5) \) (15.60)

    ```'
