  md: 'We can now use this model to determine where along the genome a given disease-causing
    gene is assumed to lie — this is the genetic linkage analysis task. The method
    works as follows. First, suppose all the parameters of the model, including the
    distance between all the marker loci, are known. The only unknown is the location
    of the disease-causing gene. If there are $L$ marker loci, we construct $L+1$
    models: in model $\ell$, we postulate that the disease gene comes after marker
    $\ell$, for $0 < \ell < L + 1$. We can estimate the Markov switching parameter
    $\hat{\theta}_\ell$, and hence the distance $d_\ell$ between the disease gene
    and its nearest known locus. We measure the quality of that model using its likelihood,
    $p(\mathcal{D}|\hat{\theta}_\ell)$. We then can then pick the model with highest
    likelihood.


    Note, however, that computing the likelihood requires marginalizing out all the
    hidden $S$ and $G$ variables. See [FG02] and the references therein for some exact
    methods for this task; these are based on the variable elimination algorithm,
    which we discuss in Section ??. Unfortunately, for reasons we explain in Section
    ??, exact methods can be computationally intractable if the number of individuals
    and/or loci is large. See [ALK06] for an approximate method for computing the
    likelihood based on the "cluster variation method".


    Note that it is possible to extend the above model in multiple ways. For example,
    we can model evolution amongst phylogenies using a **phylogenetic HMM** [SH03].


    # ## 4.2 More examples of UGMs


    # ### 4.2.0.1 Potts models for protein structure prediction


    One interesting application of Potts models arises in the area of **protein structure
    prediction**. The goal is to predict the 3d shape of a protein from its 1d sequence
    of amino acids. A common approach to this is known as **direct coupling analysis**
    (DCA). We give a brief summary below; for details, see [Mor+11].


    First we compute a **multiple sequence alignment** (MSA), from a set of related
    amino acid sequences from the same protein family; this can be done using HMMs,
    as explained in ??. The MSA can be represented by an $N \times T$ matrix $\mathbf{X}$,
    where $N$ is the number of sequences, $T$ is the length of each sequence, and
    $X_{ni} \in \{1, \dots, V\}$ is the identity of the letter at location $i$ in
    sequence $n$. For protein sequences, $V = 21$, representing the 20 amino acids
    plus the gap character.


    Once we have the MSA matrix $\mathbf{X}$, we fit the Potts model using maximum
    likelihood estimation, or some approximation, such as pseudo likelihood [Eke+13];
    see ?? for details.$^1$ After fitting the model, we select the edges with the
    highest $J_{ij}$ coefficients, where $i, j \in \{1, \dots, T\}$ are locations
    or **residues** in the protein. Since these locations are highly coupled, they
    are likely to be in physical contact, since interacting residues must coevolve
    to avoid destroying the function of the protein (see e.g., [LHF17] for a review).
    This graph is called a **contact map**.


    Once the contact map is established, it can be used as input to a 3d structural
    prediction algorithm, such as [Xu18] or the **alphafold** system [Eva+18], which
    won the 2018 CASP competition. Such methods use neural networks to learn functions
    of the form $p(d(i,j)|\{c(i,j)\})$, where $d(i,j)$ is the 3d distance between
    residues $i$ and $j$, and $c(i,j)$ is the contact map.


