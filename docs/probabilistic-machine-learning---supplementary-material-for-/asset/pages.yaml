    The resulting plot of \(\hat{T}(t)\) vs t is shown in Figure 3.8 (bottom left).
    For values of t much less than the prior mean, \(\mu\), the predicted value of
    T is about equal to \(\mu\), so the left part of the curve is flat. For values
    of t much greater than \(\mu\), the predicted value converges to a line slightly
    above the diagonal, i.e., \(\hat{T}(t) = t + \epsilon\) for some small (and decreasing)
    \(\epsilon > 0\).


    To see why this behavior makes intuitive sense, consider encountering a man at
    age 18, 39 or 51: in all cases, a reasonable prediction is that he will live to
    about \(\mu = 75\) years. But now imagine meeting a man at age 80: we probably
    would not expect him to live much longer, so we predict \(\hat{T}(80) \approx
    80 + \epsilon\).'
