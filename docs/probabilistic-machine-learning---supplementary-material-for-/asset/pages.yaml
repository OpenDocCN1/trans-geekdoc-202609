  md: '![](img/c73db5a1f734ebb7c0655f19e5bc9daa_147_0.png)


    Figure 28.7: LDA-HMM model as a PGM-D.


    It is also possible to use amortized inference, and to learn embeddings for each
    word, which works much better with rare words. This is called the **dynamic embedded
    topic model** [DRB19].


    # 28.1.4 LDA-HMM


    The Latent Dirichlet Allocation (LDA) model of Section 28.1.1 assumes words are
    exchangeable, and thus ignores word order. A simple way to model sequential dependence
    between words is to use an HMM. The trouble with HMMs is that they can only model
    short-range dependencies, so they cannot capture the overall gist of a document.
    Hence they can generate syntactically correct sentences, but not semantically
    plausible ones.


    It is possible to combine LDA with HMM to create a model called **LDA-HMM** [Gri+04].
    This model uses the HMM states to model function or syntactic words, such as “and”
    or “however”, and uses the LDA to model content or semantic words, which are harder
    to predict. There is a distinguished HMM state which specifies when the LDA model
    should be used to generate the word; the rest of the time, the HMM generates the
    word.


    More formally, for each document n, the model defines an HMM with states $h_{nl}
    \in \{0, \dots, H\}$. In addition, each document has an LDA model associated with
    it. If $h_{nl} = 0$, we generate word $x_{nl}$ from the semantic LDA model, with
    topic specified by $c_{nl}$; otherwise we generate word $x_{nl}$ from the syntactic
    HMM model. The PGM-D is shown in Figure 28.7. The CPDs are as follows:


    $p(\mathbf{z}_n) = \text{Dir}(\mathbf{z}_n|\alpha\mathbf{1}_{N_z}) \quad (28.8)$

    $p(c_{nl} = k|\mathbf{z}_n) = z_{nk} \quad (28.9)$

    $p(h_{n,l} = j|h_{n,l-1} = i) = A_{ij} \quad (28.10)$

    $p(x_{nl} = d|c_{nl} = k, h_{nl} = j) = \begin{cases} W_{kd} & \text{if } j =
    0 \\ B_{jd} & \text{if } j > 0 \end{cases} \quad (28.11)$


    where **W** is the usual topic-word matrix, **B** is the state-word HMM emission
    matrix and **A** is the state-state HMM transition matrix.


    Inference in this model can be done with collapsed Gibbs sampling, analytically
    integrating out all the continuous quantities. See [Gri+04] for the details.


    The results of applying this model (with $N_z = 200$ LDA topics and $H = 20$ HMM
    states) to the combined Brown and TASA corpora^2 are shown in Table 28.1. We see
    that the HMM generally is responsible for


    2The Brown corpus consists of 500 documents and 1,137,466 word tokens, with part-of-speech
    tags for each token. The TASA corpus is an untagged collection of educational
    materials consisting of 37,651 documents and 12,190,931 word tokens. Words appearing
    in fewer than 5 documents were replaced with an asterisk, but punctuation was
    included. The combined vocabulary was of size 37,202 unique words.'
