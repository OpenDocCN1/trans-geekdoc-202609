    # ## 6.3.4 Cross-entropy method


    The **cross-entropy method** [Rub97; RK04; Boe+05] is a special case of EDA (Section
    6.3.3) in which the population is represented by a multivariate Gaussian. In particular,
    we set \(\boldsymbol{\mu}_{t+1}\) and \(\boldsymbol{\Sigma}_{t+1}\) to the empirical
    mean and covariance of \(\mathcal{S}^*_{t+1}\), which are the top \(K\) samples.
    This is closely related to the SMC algorithm for sampling rare events discussed
    in **??**.


    The CEM is sometimes used for model-based RL (**??**), since it is simple and
    can find reasonably good optima of multi-modal objectives. It is also sometimes
    used inside of Bayesian optimization (**??**), to optimize the multi-modal acquisition
    function (see [BK10]).


    # ### 6.3.4.1 Differentiable CEM


    The **differentiable CEM** method of [AY19] replaces the top \(K\) operator with
    a soft, differentiable approximation, which allows the optimizer to be used as
    part of an end-to-end differentiable pipeline. For example, we can use this to
    create a differentiable model predictive control (MPC) algorithm (**??**), as
    described in **??**.


    The basic idea is as follows. Let \(\mathcal{S}_t = \{\boldsymbol{x}_{t,i} \sim
    p(\boldsymbol{x}|\boldsymbol{\theta}_t) : i = 1 : K''\}\) represent the current
    population, with fitness values \(v_{t,i} = f(\boldsymbol{x}_{t,i})\). Let \(v^*_{t,K}\)
    be the \(K\)’th smallest value. In CEM, we compute the set of top \(K\) samples,
    \(\mathcal{S}^*_t = \{i : v_{t,i} \ge v^*_{t,K}\}\), and then update the model
    based on these: \(\boldsymbol{\theta}_{t+1} = \text{argmax}_{\boldsymbol{\theta}}
    \sum_{i \in \mathcal{S}_t} p_t(i) \log p(\boldsymbol{x}_{t,i}|\boldsymbol{\theta})\),
    where \(p_t(i) = \mathbb{I}(i \in \mathcal{S}^*_t) / |\mathcal{S}^*_t|\). In the
    differentiable version, we replace the sparse distribution \(\boldsymbol{p}_t\)
    with the “soft” dense distribution \(\boldsymbol{q}_t = \Pi(\boldsymbol{p}_t;
    \tau, K)\), where


    ```

    \(\Pi(\boldsymbol{p}; \tau, K) = \text{argmin}_{\boldsymbol{0} \le \boldsymbol{q}
    \le \boldsymbol{1}} -\boldsymbol{p}^\top \boldsymbol{q} - \tau \mathbb{H}(\boldsymbol{q})
    \text{ s.t. } \mathbf{1}^\top \boldsymbol{q} = K\) (6.73)

    ```


    projects the distribution \(\boldsymbol{p}\) onto the polytope of distributions
    which sum to \(K\). (Here \(\mathbb{H}(\boldsymbol{q}) = - \sum_i q_i \log(q_i)
    + (1-q_i) \log(1-q_i)\) is the entropy, and \(\tau > 0\) is a temperature parameter.)
    This projection operator (and hence the whole DCEM algorithm) can be backpropagated
    through using implicit differentiation [AKZK19].


    <sup>3</sup>This should not be confused with the Bayesian optimization methods
    we discuss in **??**, that uses response surface modeling to model \(p(f(\boldsymbol{x}))\)
