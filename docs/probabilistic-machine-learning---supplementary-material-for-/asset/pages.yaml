    we can marginalize out this part of the problem, and just sample total orders.
    [EW08] also use order-space (collapsed) MCMC, but this time with a parallel tempering
    MCMC algorithm.


    # ### 31.2.5 Constraint-based approach


    We now present an approach to learning a DAG structure — up to Markov equivalence
    (the output of the method is a PDAG) — that uses local conditional independence
    tests, rather than scoring models globally with a likelihood. The CI tests are
    combined together to infer the global graph structure, so this approach is called
    **constraint-based**. The advantage of CI testing is that it is more local and
    does not require specifying a complete model. (However, the form of the CI test
    implicitly relies on assumptions, see e.g., [SP18].)


    # ### 31.2.5.1 IC algorithm


    The original algorithm, due to Verma and Pearl [VP90], was called the **IC algorithm**,
    which stands for “inductive causation”. The method is as follows [Pea09, p50]:


    +   1. For each pair of variables \(a\) and \(b\), search for a set \(S_{ab}\)
    such that \(a \perp b | S_{ab}\). Construct an undirected graph such that \(a\)
    and \(b\) are connected iff no such set \(S_{ab}\) can be found (i.e., they cannot
    be made conditionally independent).


    +   2. Orient the edges involved in v-structures as follows: for each pair of
    nonadjacent nodes \(a\) and \(b\) with a common neighbor \(c\), check if \(c \in
    S_{ab}\); if it is, the corresponding DAG must be \(a \rightarrow c \leftarrow
    b\), \(a \leftarrow c \rightarrow b\) or \(a \leftarrow c \leftarrow b\), so we
    cannot determine the direction; if it is not, the DAG must be \(a \rightarrow
    c \leftarrow b\), so add these arrows to the graph.


    +   3. In the partially directed graph that results, orient as many of the undirected
    edges as possible, subject to two conditions: (1) the orientation should not create
    a new v-structure (since that would have been detected already if it existed),
    and (2) the orientation should not create a directed cycle. More precisely, follow
    the rules shown in Figure 31.8. In the first case, if \(X \rightarrow Y\) has
    a known orientation, but \(Y - Z\) is unknown, then we must have \(Y \rightarrow
    Z\), otherwise we would have created a new v-structure \(X \rightarrow Y \leftarrow
