  \n## CHAPTER 2: CYBER TERRORISM – IDEOLOGIES AND IDEALISATIONS\n\n### **2.1 Incel\
  \ and misogynist**\n\n在许多国家，极端“incel”（involuntary celibate，自愿性独身者）活动被视为新兴且不断扩大的恐怖主义威胁。incel\
  \ 这一缩写也被称为“厌女”或“男性至上主义”暴力极端主义。数十起致命袭击由此产生，这些袭击具有明显的厌女动机，主要由那些内心深处对女性怀有深厚仇恨的男性实施。1984\
  \ 年在克利夫兰公共图书馆发生的 Kent Malcolm 实施的枪击事件，或许是当代美国历史上首次被明确认定为“厌女”动机的大屠杀（Web Archive:\
  \ 1985）。此后，包括 1989 年蒙特利尔 Ecole Polytechnique 的大屠杀在内的许多悲剧相继发生，凶手在自杀前指责女权主义毁了他的生活，随后按性别将机械工程课程分开，并开始射击女性目标。\n\
  \n许多分析人士指出，自社交媒体成为主流通讯形式以来，暴力 incel 和厌女攻击有明显增加（见下表）。到此程度，一批学者、政治家和政府官员呼吁对 incel\
  \ “意识形态”进行正式分类和 **securitisation**（安全化），这与其他被指定的恐怖主义类型的处理方式类似（Tomkinson et al: 2020）。到\
  \ 2022 年，英国反恐警察记录到约 77（约 1%）的转介至政府反极端化计划 Prevent 的案件包含厌女“incel”观点。英国警方将 incel 材料称为“宣传品”，至今仍未将\
  \ incel 归类为恐怖主义“意识形态”（《The Guardian》: 2023）。在北美，一份涵盖过去十年研究的秘密服务局报告发现，美国境内 incel\
  \ 恐怖主义威胁正在增长（CBS News: 2022）。美国国家威胁评估中心（National Threat Assessment Center）因一系列 incel\
  \ 和男性至上主义者的连环杀戮和大屠杀（包括 2018 年坦拉哈西（Tallahassee）Hot Yoga 场所一名 40 岁前教师和军人射杀六名女性（两人死亡）的大规模枪击事件）而对厌女恐怖主义进行了深入调查。凶手在四年前的\
  \ YouTube 视频中表示自己是自愿性独身者，并同情 2014 年伊斯拉·维斯塔（Isla Vista）incel 大屠杀者 **Elliot Rodger**。两人在\
  \ SoundCloud 账号上发布了厌女音乐（CNN: 2018）。\n\n根据欧洲委员会内政部 2021 年的报告，*“Incels 创建的网站和论坛，如\
  \ incels.is，是生态系统中风险最高的平台，所有层次的暴力讨论均可在此找到。”* 报告结论是，不同社交媒体平台在使用和利用方面存在细微差别。例如，*“在流行的社交媒体平台，如\
  \ YouTube 和 Twitter，社区属于低风险平台，讨论重点倾向于个人层面的暴力，但也可能出现人际及社会层面的暴力讨论。”* 同时，欧盟委员会报告发现，***“Reddit\
  \ 曾是历史上高风险的 incel 平台，但 2017 和 2018 年对 incel subreddits 进行一系列禁令后，Reddit 上的 incel\
  \ 内容量大幅减少”**（EU Commission: 2021: 7）。\n\n在 incel 生态系统中，自杀意识形态的讨论和促进自残身体改造极为常见（EU\
  \ Commission: 2021: 4）。关于自杀的兴趣和讨论以及自杀方法的鼓励，是 incel 聊天论坛中常见且占主导地位的 discourse。自杀便条经常被发布。自杀者常被鼓励“去急诊室”（go\
  \ ER），这是对 2014 年伊斯拉·维斯塔大屠杀及 incel“英雄”Elliot Rodger 自杀的明确引用（EU Commission: 2021:\
  \ 7）。一些 incel 聊天用户称 Rodger 为“殉道者”。其他用户鼓励“去 Minassian”或“去 Sodini”，这明确指向其他高调厌女连环杀手，并鼓励\
  \ incel 用户效仿（EU Commission: 2021: pp7-8）。\n\n#### ***Incel ideology***\n\n在探讨当代厌女恐怖主义案例之前，为防止和遏制恐怖主义的责任人员建立关键术语和从“inceldom”\
  \ 中萌芽的哲学原则是有帮助的。美国秘密服务局报告 *Hot Yoga Tallahassee: A Case Study of Misogynistic Extremism*\
  \ 发现，一个新兴的“incel”运动作为更广泛的“男性至上主义圈”（manosphere）的一个亚文化存在。男性至上主义圈可以细分为四类，研究人员建议将其表现为：(1)\
  \ 约会技巧达人；(2) 男性权利活动家；(3) 独立男性；以及 (4) incels。这个充满话语（并不总是由男性占据；男性至上主义圈和 inceldom \
  \ chat 中也有女性）的亚文化形成了一个主要自我强化的男性至上主义线上生态系统。该亚文化通过成千上万的博客和讨论论坛得到支持和互联，这些论坛涵盖从父母权利到自杀方法选择等各种话题。正如极端主义和极右翼聊天室一样，其背后的意识形态基底是一种压抑的、全能的受害者观。正如政治化的受害者叙事推动进入激进伊斯兰和极端右翼聊天室，系统理论的批评也逐渐流入\
  \ incel 论坛。（这些可以简单理解为*“这全是系统的错，不是我的错！”* 在这种叙事中，任何不属于 inceldom 的个人都变得微不足道，与其他人 indistinguishable。外部个体被去人性化，攻击外部个体的想法被合法化。威胁成为目标，阻碍者成为“合法目标”。*\
  \ “尽管这些团体以推广男性主导观点而闻名，”* 该报告指出，*“一些成员表达了极端的反女性仇恨、对女性的物化以及呼吁针对女性的暴力呼吁”* (US Secret\
  \ Service: 2022)。\n\n\n\n\n-   [激进研究者 `Florence Keen`，来自伦敦国王学院国际极端主义研究中心，发现其中一个最大的禁闭论坛（incel\
