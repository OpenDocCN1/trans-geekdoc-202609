  \ GCSE 考试的地步”（Press Reader: 2022）。\n\n#### ***International***\n\n2019 年 3 月 15\
  \ 日，澳大利亚出生的 Brenton Harrison Tarrant，28 岁，在新西兰基督城两座清真寺进行大规模枪击，造成 51 人死亡、40 人受伤。袭击前不久，施暴者在`8chan`论坛上宣布“我将对入侵者进行袭击”，随后在\
  \ 8chan 和 Twitter 上发布了他 manifesto 的链接以及 Facebook 直播袭击的链接。一位回应者写道：“祝你玩得开心，杀死许多白人和黑人”（Baele\
  \ et al: 2021）。Tarrant 还通过电子邮件向 30 名收件人（包括媒体机构和首相办公室）发送了 74 页的 manifesto《The Great\
  \ Replacement》。Tarrant 在开往 Christchurch 外围 Ashburton 的另一座清真寺的路上被武装警察拦截并活捉。Tarrant\
  \ 长期活跃于多个宣扬 xenophobia（排外）和政治暴力的聊天论坛。随后几个月里，类似的恐怖袭击在全球多地发生，这些袭击者以 Tarrant 为启发。例如，两名美国本土枪手（John\
  \ Earnest 和 Patrick Crusius）效仿 Tarrant 的作案方式，宣布即将进行种族主义袭击，并在 8chan 社交媒体上发布充满仇恨的反移民\
  \ manifesto。 (相关案件在本章末尾有所概述。)\n\n8chan 最终于 2019 年 8 月关闭，但许多替代“chan”版本相继成立，或现有 chans\
  \ 吸引了 8chan 被 dispossessed（ dispossessed）的匿名（anon）用户迁移。于是，这种网络 *“constellation”*（星座）实际上是一系列专注于\
  \ *“hosting ‘politically incorrect’ (a euphemism for racist and anti-Semitic) conversations”*\
  \ 的图片板，研究人员在 Terrorism Research Institute 的出版物中指出。研究人员识别出极端分子偏好的特定 chans：8kun（8chan\
  \ 的直接替代）、9chan、16chan、ShitChan、EndChan 或 NeinChan（Baele et al: 2021）。大多数 chans 运行在公开互联网上，但也有部分运行在暗网或半暗网层面。在一些新纳粹聊天群体中，Tarrant\
  \ 常被称为“The Saint”或“Saint Tarrant”（Bellingcat: 2019）。\n\n在德国语言图片板‘Kohlchan’上，用户大力传播\
  \ Stephan Balliet 的 Halle 清真寺枪击视频链接；该视频最初在`Twitch`（一家流行的美国基于游戏的视频直播平台）上发布。2019 年\
  \ 10 月，Balliet 在清真寺枪击两人并伤害三人，指责德国的犹太居民推动女权主义和大规模移民。他提前在 Facebook 上传了 manifesto，随后直播了\
  \ 35 分钟的袭击（Ziegele: 2019）。Kohlchan 用户还几乎立即在 Tobias Rathjen 的`February 2020`枪击案中，在两家汉堡（shisha\
  \ bars）枪击后上传了他的视频和 manifesto。\n\n此时，有必要再次强调视频内容如何能够（训练和教育）并激励（鼓励和激励）恐怖行为。包括作为自杀意图人士心中的潜在表演结尾。Curtin\
  \ University（澳大利亚）的`Stuart Bender`观察到，将现场视频作为袭击的组成部分“使\\[them\\]成为一种‘表演犯罪’，其中视频录制和/或直播暴力是暴力本身的核心组成部分，而非附带现象”（Stevenson\
  \ and Anthony: 2019）。此外，密苏里大学的`Benjamin Warner`指出数字媒体的意识形态强化作用。他在关于政治极端主义的著作中写道，“如果个体只与他们已有共识的人接触，其观点极有可能极化并变得日益激进”（Warner:\
  \ 2010: 431）。\n\n\n\n\n在其他以互联网为灵感的袭击中，我将现在指两起反映我们真正全球化媒体时代恐怖主义本质的事件。此外，下面的两个案例也代表了新纳粹主义、白人至上主义袭击者在过去十年多里所确定的多样化目标，这些目标已经转向包括政治人物、普遍支持移民的运动以及警察。后者被视作叛徒“国家代理人”，即政治家、媒体人物和银行家的融合体，他们“故意”实施“大取代理论”和白人种族灭绝。像塔兰特和挪威的安德斯·布雷维克这样的种族灭绝者，他们“以自卫之意进行恐怖行为——在他们自己的心中——而非作为攻击行为，正如他所写，‘针对占领力量的党派行动’”，获奖种族灭绝学者迪克·摩西（Dirk\
  \ Moses）2019 年观察到。\n\n数字媒体时代的极右翼理想化并不一定局限于种族主义、至上主义和文化与经济入侵的辩护。值得注意的是，本文所述案例在本书的“Incel/Misogyny”章节中所列出的情况，与本章专注于极端右翼恐怖分子（ERW）的案例之间存在明显的世界观重叠。许多调查表明，ERW\
  \ 恐怖分子已扩展到猛烈攻击女性主义、妇女权利和选举结果（美联社：2022）。ERW 恐怖分子所设想和创造的多元攻击面意味着全球多个国家的反恐怖主义策略已被重新设计和焕新，以应对“国际化”的\
  \ ERW 威胁。例如，英国于 2023 年 7 月更新的 CONTEST 战略明确指出：“我们现在面临一个国内恐怖威胁，它更不可预测、更难以发现和调查”（英国内政部：2023）。\n\
  \n2019 年 6 月 2 日，一位备受尊敬的**基督教民主联盟（CDU）**地区领导人、卡塞尔行政区主席瓦尔特·卢贝克（Walter Lubcke）在家门口被新纳粹极端分子斯蒂芬·埃里克（Stephan\
  \ Ernst）枪杀。埃里克以卢贝克关于欢迎逃离中东战区的难民的亲移民言论为由，谋杀了这位当选政治人物。埃里克与一家德国分支机构“战斗 18”（Combat 18）有关联，这是一支原本数十年前成立的英国民族党内部物理安保单位。与埃里克关联的另一组织——准备者网络“Nordkreuz”（Northern\
  \ Cross）据说拥有弹药、火器和尸体袋，还编制了包含 25,000 个姓名的“杀人名单”，并通过即时通讯应用 Telegram 分发该名单。\n\n几年前，2011\
  \ 年 7 月 22 日，挪威的安德斯·布雷维克在首都奥斯陆附近的总理官邸公寓楼附近引爆汽车炸弹（造成 8 人死亡、209 人受伤），随后两小时内前往乌托亚岛，在那里枪杀了大量青年工党夏令营活动家。总共\
  \ 77 人在袭击中丧生。布雷维克利用 Facebook 和 Twitter 进行宣传，但从未明确表示想袭击特定目标。他通过 eBay 购买防弹衣、武器和炸药成分。在奥斯陆引爆炸弹前一小时半，布雷维克向\
  \ 1,003 个电子邮箱（包括总理的邮箱）发送了白人至上主义宣言《2083: A European Declaration of Independence》，随后在\
  \ YouTube 上发布了一段极端演讲视频。布雷维克长期接受精神治疗和社会护理令，原因是其动荡童年时期被诊断出的疑似人格障碍。挪威国家刑事调查局多年后得出结论：“他在各类网络论坛上的评论并不比典型的极右翼网络话语特别突出。换句话说，挪威安全机构即使在监控他时，也很可能不会对他的网络发言做出反应”。（NSIS\
  \ 挪威演示：2014）。布雷维克的市中心炸弹和岛屿屠杀部分是为了报复工党支持 incoming immigration（入境移民），部分是公开宣扬白人至上主义。布雷维克自视为半神以及重要的国际意识形态领袖，他称自己为“政治犯”。布雷维克的屠杀启发了布伦顿·塔兰特在基督城（Christchurch）的清真寺枪击事件。\n\
  \n#### **案例点：基督城 2019 – 相关及“受启发”的事件**\n\n**2019 年 3 月 15 日后：** 新南威尔士州（澳大利亚）、英国旧汉姆（）、美国纽约的男性社交媒体用户因庆祝和分发基督城屠杀影像而受到起诉。在澳大利亚和美国案例中，两名嫌疑人非法持有枪支，22\
  \ 岁的美国人在社交媒体上表示希望实施类似袭击。一名阿联酋员工因在社交媒体上发表支持性言论而被解雇。\n\n**2019 年 4 月 27 日：** 约翰·T·埃恩斯特（John\
  \ T. Earnest）在加州圣地亚哥附近的波义寺（Poway Synagogue）实施大规模枪击。一名信徒死亡，三人受伤。与塔兰特一样，埃恩斯特在 8chan\
  \ 的政治讨论组中被极端化，并尝试在 Facebook 直播袭击。他赞扬塔兰特的宣言。另一名匿名用户在论坛上为袭击者加油：“get the high score”，可译为“杀尽可能多的人”（Bellingcat：2019）。\n\
  \n**2019 年 8 月 3 日：** 21 岁的帕特里克·克里斯库（Patrick Crusius）在德克萨斯州埃尔帕索一家沃尔玛开火，造成 23 人死亡、23\
  \ 人受伤。克里斯库自称为“生态法西斯主义者”，宣扬支持基督城枪击，并在 8chan 的/pol/版发布《The Inconvenient Truth》宣言。此次屠杀明确针对墨西哥裔人群，被冲突记者罗伯特·埃文斯（Robert\
  \ Evans）描述为“恐怖主义的‘游戏化’”（gamification of terror）。埃文斯写道，克里斯库试图直播埃尔帕索袭击，类似于“埃尔·布雷顿·塔兰特通过头盔摄像头直播屠杀，使枪击看起来几乎就像第一人称射击游戏”（Bellingcat：2019\
  \ 年 8 月）。克里斯库在袭击前并未保持匿名，他在袭击前就在 8chan 上公开宣称恐怖计划，但安全意识强的 moderator 迅速删除了该帖子，未能意识到事件应急人员需要尽快获得数字取证痕迹。（克里斯库的帖子被截图）。\n\
  \n**2019 年 8 月 10 日：** 菲利普·曼斯豪斯（Philip Manshaus）在挪威宾厄（Bærum）的一座清真寺内开火，致一人受伤。曼斯豪斯在\
  \ Facebook 上直播了枪击过程。他在网络上称塔兰特为“圣人”，并发布一张将塔兰特、克里斯库和埃恩斯特描绘为“英雄”的图片。袭击导致一人受伤。\n\n**2020\
  \ 年 3 月 4 日：** 一名 19 岁男性因在阿尔努尔清真寺（Christchurch）Telegram 聊天组中对清真寺发出恐怖威胁而被新西兰警方逮捕。阿尔努尔信徒一年前曾遭塔兰特袭击。该嫌疑人是极端民族主义组织“新西兰行动”（Action\
  \ Zealandia）的成员。\n\n\n\n\n27 January 2021：新加坡警方宣布逮捕一名 16 岁、印度裔男性，他策划在基督城 2019 年纪念日袭击两座清真寺，持一把砍刀。该青年撰写了一份宣言，称塔兰特（Tarrant）为“圣人”，并赞扬了“针对穆斯林的‘正当杀害’”（Channel News Asia：2021）。\n\
  \n4 March 2021：一名不详的 27 岁男性被以威胁谋杀罪起诉，他利用 4chan 在网络上发表针对基督城此前遭袭的林伍德清真寺和阿尔努尔清真寺的在线威胁。\n\
  \n14 May 2022：18 岁的佩顿·根德伦（Payton Gendron）在纽约一家超市“Friendly Markets”枪杀十人、伤三人，所有受害者均为黑人。根德伦在推特直播袭击，使用头戴摄像头，直到平台在两分钟内关闭直播。他于袭击前两天发布了一份\
  \ 180 页的宣言，赞扬达兰·罗夫（Dylann Roof）和布伦顿·塔兰特（Brenton Tarrant）等极右翼枪手，并声明自己信奉“大置换”理论，该宣言在\
  \ Google Docs 上发布。其在线日记——从 2021 年 11 月至 2022 年 5 月 13 日——以数百条 Discord 聊天消息的形式呈现，包括武器讨论版块，其中包含恐怖袭击计划和自杀式大屠杀的参考。袭击期间，他向黑人喊出种族侮辱词，并在向收银台后的一名白人指天枪后向其道歉（Associated Press：2022）。在此之前，他曾被警方质疑袭击学校的计划，并多次告诉学生他希望实施谋杀自杀。尽管如此，他仍能够购买一把\
  \ Bushmaster 步枪和三十发子弹，后者在袭击前 24 小时内公开购买并储存。\n\n*达兰·罗夫是一名美国大屠杀者，22 岁时在南卡罗来纳州查尔斯顿教堂的圣经学习班上枪杀了九名黑人信徒（2015\
  \ 年 6 月 17 日）。罗夫是一名吸毒的新纳粹白人至上主义者，支持白人种族隔离，并信奉“大置换”理论。他是 4chan 论坛的用户，其种族主义言论和 2444\
  \ 字宣言在袭击前数周于个人网站[LastRhodesian.com](http://LastRhodesian.com)发布，该网站于 2015 年 2 月注册（New York Times：2015）。经评估其手写体后，南方贫困法中心的极端主义专家得出结论，罗夫在《每日风暴》（The Daily Stormer）这类极端民族主义新闻网站上，以化名“AryanBlood1488”发表评论（Los Angeles Times：2015）。罗夫自幼被诊断为强迫性强迫症（OCD）。\n\
  \n### 2.3 伊斯兰极端主义\n\n#### *伊拉克和叙利亚伊斯兰国家（ISIS）*\n\n正如 2001 年（9/11 之后）是理解实体伊斯兰恐怖主义规模的关键年份，2014\
  \ 年或许在网络空间同样具有重要意义。网络事件与 ISIS 在叙利亚和伊拉克崩溃的国家中实现的领土扩张紧密相连。仅数月之内，伊拉克的安全部队——据称由 65 万警察和\
  \ 35 万军人组成——几乎全部瓦解。什叶派、库尔德族和基督徒社区被迫逃离、缴税、改信伊斯兰或被杀（Cockburn：2014）。领土收益和恐怖统治为 ISIS\
  \ 在伊拉克和叙利亚（达埃）提供了招募和鼓舞国际圣战者开展全球宣传与恐怖行动的动力与基础设施。当这些事件发生时，解释往往是：报复西方在伊拉克和莱万特的军事行动（阿拉伯语缩写：Da’ish\
  \ 或 Daesh）。尽管美国、俄罗斯、北约、海湾国家武装力量、库尔德游击队以及伊拉克和叙利亚政府及其支持的民兵和部队形成了一支笨拙的联盟，最终将 ISIS 逼退至仅保留极小的领土控制（主要是摩苏尔），但约翰·卡洛尔大学的**阿卜杜拉·阿尔穆泰里**（Abdullah Almutairi）指出：“无论他们在战场上的当前状态，ISIS\
  \ 的传播者已经在无序的世界中成为惊人成功的宣传者”（Almutairi：2017）。随后，ISIS 视频驱动的社交媒体宣传的残酷效果使其实现了内部目标——它已经远超其逊衰的逊派圣战主义父系组织——阿尔卡伊达。\n\
  \nRAND 分析师**安托尼娅·华尔**（Antonia Ward）指出，ISIS 的“社交媒体的战略使用体现了恐怖主义组织兼具游击队属性的机智，动员了约 4\
  \ 万名来自 110 个国家的外国志愿者加入该组织”（Ward：2018）。\n\n另一位中东战争研究权威、独立新闻记者帕特里克·考克本（Patrick Cockburn）在前线报道称：“自四十年前柬埔寨红色高棉以来，世界从未看到他们以公开暴力恐吓对手的方式。”考克本坚称，“ISIS\
  \ 是恐惧的专家”。其精心制作的血腥视频——涵盖对什叶派士兵、检查站官员和卡车司机的屠杀——在恐吓和威慑什叶派及库尔德派对手，使他们在伊拉克中部和北部地区溃败，并夺取了法尔贾拉、摩苏尔和提克里特等城市（Cockburn：2014：“前言”）。这些在宗教分裂的广阔城市在\
  \ 2014 年目睹了伊拉克政府军及国内安全部队的大规模逃离。考克本指出，瓦哈比派——一种伊斯兰原教旨主义——“强制实施沙里亚法，将女性降格为二等公民，并将什叶派和苏菲派视为非穆斯林”，其毫不掩饰的传播\
  \ soon 令数百万观众感到恐惧，也激发了他们——这些观众会下载并分享类似恐怖电影的画面。许多在线视频制作精良。ISIS 的自有媒体机构、记者和电影编辑将背景音乐与美丽的全景切片相结合，营造出激励性的景观；这些戏剧性背景常与处决和受害者自掘坟墓的镜头交错。考克本称，一个流行的主题是年轻战士（及其新娘）对曾经舒适却腐败的家庭生活的否定。这类转化主题影片通常蕴含对无法前往\
  \ caliphate（伊斯兰国家）进行恐怖行动的个人的挑衅，如在美国、欧洲或俄罗斯进行袭击。2014 年春季，一段在 YouTube 上发布的视频显示外国圣战者埋葬护照——“以示对圣战的永久承诺”（Cockburn：2014：41）。沙特、约旦、车臣、埃及和一名加拿大公民自称是阿布·穆萨·阿尔-齐尔瓦维（Abu Musab al‑Zarqawi）的后裔，是阿尔卡伊达在伊拉克的创建者，他们在英语和阿拉伯语中宣称：“\\\
  [这\\]是给加拿大和所有美国势力的讯息。我们即将来袭，并将毁灭你们”（Cockburn：2014：42）。\n\n\n\n在 2014 年 7 月，ISIS\
  \ 在伊拉克的阿努里清真寺发布了一段其领袖`Abu-Bakr al-Baghdadi`的网络视频，呼吁穆斯林在斋月期间进行圣战，并号召全球追随者帮助建立哈里发国（Awan:\
  \ 2017）。巴格达维并未仅仅限制呼吁对不信者的攻击，他表示：“我呼吁全球伊斯兰青年和男性，号召他们动员并加入我们，以巩固伊斯兰国家之柱，并对什叶派（rafidhas）和什叶派的萨法迪（safadis）展开圣战。”巴格达维在其信息的结尾明确呼吁建立一个以伊拉克和叙利亚逊尼派控制地区为核心的伊斯兰哈里发国（New\
  \ Delhi Times: 2014）。在 ISIS 脆弱且动荡的领导网络中，来自其第二号人物阿布·穆罕默德·阿达尼（及其媒体主管，见下文案例研究）的内部压力促使巴格达维转向对美西方目标的更极端言论。2014\
  \ 年底，新宣布的哈里发控制的领土面积超过英国，居住人口达六百万。叙利亚和伊拉克的石油和天然气设施被占领，六百万库尔德人在土耳其南部边境被围困。根据柯克本的说法：“新国家的诞生是自第一次世界大战后斯科-皮克协定实施以来，中东政治地理发生的最剧烈变化”（Cockburn:\
  \ 2014: 28）。在此期间，公众并不常知晓的是，自 9/11 以来，三位最具影响力的圣战宣传家——美国出生的约翰·杰尔盖拉斯（ISIS）、阿当·伽德恩（Al-Qaeda\
  \ 中央）和阿努尔·阿尔-阿瓦拉基（Al-Qaeda 阿拉伯半岛）——正是其中之一。接下来，我们将提供杰尔盖拉斯和伽德恩的案例研究。\n\n**案例研究：ISIS\
  \ 数字媒体大师约翰·杰尔盖拉斯**\n\n得克萨斯州出生的约翰·托马斯·杰尔盖拉斯（1983–2017）与 ISIS 第二号人物阿布·穆罕默德·阿达尼（AMA）在其短暂生命的后期建立了亲密关系。2014\
  \ 年，作为煽动性演讲“确无疑视上帝”的演说者，阿达尼在 ISIS 追随者和西方情报机构中的知名度飙升（Kent: 2023）。AMA 是 ISIS 的叙利亚酋长及行动总监，他负责内部安全以及与其他重要叙利亚圣战主义组织的外部关系。杰尔盖拉斯与\
  \ AMA 的亲密关系使他成为确保 ISIS 恐怖行动和战术在地区乃至国际范围内产生最大影响的关键人物。\n\n杰尔盖拉斯出身于美国军人家庭（其父曾是空军上校），曾在\
  \ Rackspace 这家云服务公司担任数据技术员。2001 年 9/11 恐怖袭击后，他皈依伊斯兰教，并承认自己在政治和宗教上被极端化。9/11 后不久，他前往叙利亚学习阿拉伯语和《古兰经》，2004\
  \ 年返回美国。随后，他在得克萨斯州继续在 Rackspace 工作。2006 年，他因访问美国以色列公共事务委员会（AIPAC）客户的密码被捕并入狱。2011\
  \ 年获释后，他与第一任妻子搬到埃及。杰尔盖拉斯翻译了宗教法令和开始在线组织针对前往伊拉克和叙利亚的西方人员的圣战预备工作坊。\n\n杰尔盖拉斯多次独自旅行进行武装圣战，随后将第一任妻子和三个年幼子女迁往叙利亚北部。（其英国出生的妻子后来逃回美国并与子女定居。）再婚且在战场受伤后，他自称“Yahya\
  \ al-Bahrumi”或阿布·侯赛因。人称“Yahya”（阿拉伯语意为 John）的得克萨斯青年成为制作极具光泽英文宣传视频的主要人物，并为《Dabiq》杂志撰写大量文章，标题包括“杀死不信者的哈菲尔（Kufr）神职人员”。他还公开了多位美国反恐学者的姓名，宣称他们应受报应，因为他们对\
  \ ISIS 持批判态度。杰尔盖拉斯的写作风格既狂热又简洁，常运用心理极化手法，反复强调“他们-我们”的对立叙事。此类叙事手段在公共恐怖主义传播中屡见不鲜，有助于去人性化被视为敌人的对象，从而消除观众因心理矛盾而阻碍其走向暴力行动的障碍。下面的摘录即为典型例证：\n\
  \n*“事实是，即使你停止轰炸我们、监禁我们、折磨我们、诋毁我们并占据我们的土地，我们仍将仇恨你们，因为我们仇恨的根本原因不会消失，除非你们皈依伊斯兰教 \\\
  […\\] 我们与你们的斗争，并非单纯为了惩罚和威慑，而是为了在今生赐予你们真正的自由以及来世的救赎，自由于随心所欲和教士及立法者的奴役，以及唯独通过崇拜创造者并遵循其使者来获得拯救。”*\n\
  \n（Wood: 2017）\n\n杰尔盖拉斯大量吸食大麻，并食用裸盖菇素迷幻蘑菇。在另一段视频《没有圣战就没有生活》中，三名来自西方的前线战士激励追随者因战场荣耀加入\
  \ ISIS（Awan: 2017）。据巴勒斯坦记者阿卜杜勒·巴里·阿塔万所说：“光滑且装备精良的视频能够诱惑那些易受极端主义影响的群体。因此，我们正在目睹 ISIS\
  \ 能够渗透年轻且易感人群的头脑——这类人更可能观看 YouTube 并使用 Facebook 和 Twitter”（Atwan: 2015）。\n\n***Al-Qaeda\
  \ (AQ)***\n\nAQ 的多国媒体影响力在 1990 年代末期逐渐增强。来自北非、中东、荷尔果斯、阿拉伯半岛、南亚及东南亚的年轻男性逊尼派穆斯林被视为大规模激进化和动员的特别肥沃土壤。得益于全球伊斯兰媒体前线（GIMF）的日益强大和以核心信息为导向的媒体产品，越来越多的受众得以接触。这一新兴网络由一名加拿大出生的阿尔-卡迪尔媒体操作员及其他附属组织于\
  \ 2001–2004 年间运营，期间提供 Yahoo 电子邮件地址和密码，以便获取、吸收并进一步传播武装圣战声明和视频（荷兰全国反恐协调员：N.D）。随后，一个网站也被提供。\n\
  \n\n\n\n-   [在 YouTube 上运营的这类区域性媒体平台通常会展示区域性领袖进行布道或解释激进行动。区域性定制节目——夹杂着奥萨马·本·拉登或其他阿尔卡伊达中央领袖的更新——旨在与更具地域性的受众产生共鸣，这些受众的紧迫关注点可能是当地内战、自然灾害或武器供应。因此，在本世纪初出现了多个具有影响力的互联网区域性阿尔卡伊达分支平台。阿扎拉奎拉（Az-Zallaqa）媒体由西非的努萨特·伊斯兰（Nusrat\
  \ al-Islam）领导。阿兰德卢斯（Al-Andalus）媒体支持伊斯兰马格里布组织（AQIM）。阿勒马莱姆（Al-Malahem）媒体成为阿尔卡伊达阿拉伯半岛组织（AQAP）的新闻机构。后者发展成为也许最有效的阿尔卡伊达新闻频道，由其领袖安瓦尔·阿尔-奥拉基（Anwar\
  \ al-Awlaki）主持布道和呼吁武装斗争，直至 2011 年美国无人机袭击致其身亡。阿尔-奥拉基也被认为是阿尔卡伊达阿拉伯半岛组织（AQAP）在线《Inspire》杂志的制作人和编辑——一本以图片为主的英语新闻刊物，旨在吸引西方人士参与“自制”本土恐怖主义。文中有一篇文章描述如何*“在妈妈厨房里制造炸弹”*（Fox\
  \ News: 2014）。（阿尔-奥拉基出生、成长并受教育于美国，2004 年永久回到其家庭所在地也门。）在一定程度上，阿勒马莱姆还支撑并放大了阿尔·沙巴布（Al-Shabaab）所策划的恐怖行动范围，包括购物中心恐怖袭击、海滩处决和绑架等，这些行动遍及东非。但阿尔·沙巴布很快开发出高度有效的内部媒体机构——阿尔·卡塔伊布（Al-Kata’ib）媒体机构（CTC\
  \ Westpoint: 2012）。阿尔卡伊达的恐怖主义招募和宣传通过英国的 al-Muhajiroun 以及被禁的比利时伊斯兰运动（Sharia4Belgium）等多个具有影响力的网站在西方欧洲得到放大（De\
  \ Standaard: 2012）。\n\n**案例研究：阿尔卡伊达宣传主管阿当·亚希耶·伽丹（Adam Yahiye Gadahn）**\n\n17 岁时，‘阿萨姆·美国人’（‘Azzam\
  \ the American’）于 1995 年在加州的一座清真寺皈依伊斯兰教。三年之内，亚当·伽丹加入了阿尔卡伊达中央组织，宣称美国为“敌对领土”，并成为 2001\
  \ 年成立、位于巴基斯坦和阿富汗的阿尔卡伊达中央领导层官方媒体单位阿萨布（As-Sahab）的制作人。阿萨布在向潜在招募者、愤怒政治家以及惊恐公众广播阿尔卡伊达的高层行动、布道和演讲方面发挥了关键作用。\n\
  \n伽丹的精彩战场视频倾向于以阿拉伯语发布，并配有英文字幕。他制作的高质量纪录片式视频随后迅速分发给上述区域性分支媒体，以在目标激进社区中提升观众覆盖面和招募影响力。\n\
  \n伽丹出生于美国俄勒冈州，其父母将他作为新教基督徒抚养，并在俄勒冈州偏远的农场自家进行家庭教育。青少年时期，他与同龄人交往，参加联赛板球，并沉浸于死亡金属及氛围音乐网络。他在此期间勤奋发展了技术制作技能。由于其音乐活动，他与父母的关系变得紧张。他搬去加州圣安娜市祖父母家，年满\
  \ 16 岁，随后迅速皈依伊斯兰教。1997 年，他因袭击导师被捕，随后据说于 1998 年搬到巴基斯坦并与一名阿富汗难民女性结婚。他自称生活在卡拉奇，此后与家人保持间歇性联系，直至\
  \ 2022 年 2 月的一次电话通话后便永远断绝（ABC News: 2004）。\n\n2004 年，伽丹已进入 FBI 通缉名单。FBI 局长罗伯特·穆勒（Robert\
  \ Mueller）将伽丹列为七名策划夏季和秋季美国恐怖袭击的阿尔卡伊达成员之一。伽丹因在 2005 年制作一段庆祝 9/11 四周年、威胁攻击美国和澳大利亚的视频而被指控“提供物质支持”。该段十一分钟的录像带在\
  \ ABC《Good Morning America》节目中播放。随后，阿尔卡伊达副领袖艾曼·阿尔-齐瓦希里（Ayman Al-Zawahiri）在标题为《Invitation\
  \ to Islam》的视频中称赞伽丹为“引导人们从黑暗走向光明的人”。\n\n此前，阿尔卡伊达领导层从未向一名 jihadi 媒体操作员发出如此高层次的个人表扬。伽丹被列入\
  \ FBI 通缉名单，悬赏一百万美元以捕获他。另一段名为《知识即行动——曼哈顿袭击》的纪录片中，伽丹简明扼要地阐述了阿尔卡伊达的历程与使命，从反苏联入侵的穆哈廷纳起义演变为国际\
  \ jihad 的勇敢先锋。影片还描述了阿尔卡伊达为 9/11 的策划与建设过程，并解释了目标选择。影片穿插了由恐怖细胞拍摄的殉道（自杀）恐怖行动画面，结尾以\
  \ 9/11 袭击画面的蒙太奇收尾。整个画面均配有阿拉伯语和英文字幕。\n\n2006 年，伽丹在未掩饰的影片中出现。尽管多年前已被加州清真寺的信众和多个情报机构识别。2006\
  \ 至 2008 年间的视频显示其对美国和英国的敌意程度提升。伽丹在 2007 年 5 月于名为《al-Qaeda video Warning to US by\
  \ American Adam Gadahn》的影片中，宣读了一份包含五项准宗教、地缘政治诉求的列表（MyZine.com: 2007）。\n\n此后，各种智库、记者和政治家因其见解受到赞扬或轻度批评。有人被邀请停止“端坐中立”并“站到真理一边”。然而，大多数人如果批评阿尔卡伊达及其恐怖活动，就会受到威胁和诽谤。阿尔卡伊达在大选后的影片中讽刺当选总统奥巴马为“仆人\
  \ negro”（Khatchadourian, R: 2007）。\n\n2010 至 2014 年间，数百段由伽丹主持的视频出现，庆祝大规模伤亡袭击周年，提供暗杀与单独行动恐怖袭击的教程。伽丹呼吁生活在巴黎、伦敦和底特律“悲惨郊区”的穆斯林移民在此地发动袭击。\n\
  \n2011 年 6 月 16 日，阿尔卡伊达在其网站（Ansar al-Mujahideen）上公布了一份针对 40 名美国商人、军事人员和外交官的打击名单（Gustini:\
  \ 2011）。此前，伽丹于 6 月 3 日在网络上广泛发布呼吁对美国公众人物和企业机构进行单独行动袭击的呼吁（Gustini: 2011）。2014 年 3\
  \ 月，一段泄露视频显示伽丹谴责 ISIS 因攻击 fellow Muslims（同胞穆斯林）而成为极端分子（Jihadology: 2018）。2015 年\
  \ 4 月，奥巴马总统宣布 2015 年 1 月在巴基斯坦的一次 CIA 无人机袭击中击毙了伽丹以及 fellow American Al-Qaeda 恐怖分子阿赫迈德·法鲁克（Ahmed\
  \ Farouq）。同一事件中，两名援助工作者**Giovanni Lo Porto** 和 **Warren Weinstein** 也丧生。（NBC News:\
  \ 2015b）\n\n**案例研究：映射 ISIS 与阿尔卡伊达全球网络恐怖组织**\n\n\n\n\n根据 Lee et al (2021) 的研究，`cyberspace\
  \ 的普遍性和匿名性` 使恐怖组织能够获得设计传统或复杂攻击的新方法。Lee 的研究团队旨在通过整合 `Global Cyberterrorism Dataset`\
  \ 来解释 `cyberterrorism` 的演变现象，该数据集涵盖 2011 至 2016 年归属于 Al-Qaeda 和 ISIS 的 83 起网络恐怖主义事件。随后，该团队在\
  \ `美国国务院年度恐怖主义报告` 的基础上，引入了从法院文件和新闻媒体报道中收集的第二层证据。利用社交网络分析工具，研究人员进一步识别了个人和团体施暴者与受害者样本之间的潜在关系。尽管样本量有限——这在恐怖主义相关研究中通常如此——但发现的结果具有强烈暗示性：\n\
  \n- `ISIS` 归属的袭击占总数的 67.5%（`Al-Qaeda = 32.5%`）。\n\n- 自 2014 年起，网络恐怖主义出现了显著增长。\n\n\
  - `美国及其他西方发达国家` 是 Al-Qaeda、其在亚洲和阿拉伯半岛的分支以及其附属组织 Al‑Shabaab 的最频繁目标。\n\n- 大量网络恐怖分子倾向于选择**地理\
  \ proximity** 内的目标，包括为 Al‑Nusra 前线作战的袭击者（攻击叙利亚和黎巴嫩）、反对以色列的哈马斯以及在南亚针对印度的 Al‑Qaeda。这种明显的区域性攻击集群以及本土袭击者，表明\
  \ `存在一种网络恐怖主义的区域主义`（Lee et al: 2021: 11）。\n\n- 如有可能翻译，`ISIS 的网络攻击策略优先在更多国家进行多起低伤亡打击`，这些打击由国内实施者执行。相比之下，Al‑Qaeda\
  \ 的策略更偏向跨国攻击，针对更集中的国家名单。\n\n- 在残酷极端暴力的描绘之后——包括美国、叙利亚和法国人质的斩首——Lee 的团队发现 ISIS 招募了\
  \ `比 Al‑Qaeda 更高比例的独狼（lone wolves）`（Lee et al: 2021: 11）。\n\n- `恐怖组织及其支持者不断多样化其依赖的在线服务以托管材料`。虽然\
  \ Facebook 在 2018 年报告称已移除超过 1400 万条与恐怖主义或极端主义相关的内容，但 2018 年 Daesh（ISIS）使用了超过 100\
  \ 个平台，利用更具弹性且规模更小的平台（DCMS: 2019）。\n\n- `恐怖组织极力追求快速触达受众`。例如，三分之二的 Daesh 宣传链接在上传后一小时内传播。在\
  \ Christchurch 恐怖袭击后，跨平台的协同努力在袭击后短时间内最大化了攻击影像的传播。因此，确保有技术能够在上传后一小时内自动检测并删除恐怖内容、阻止重新上传，并在可能的情况下阻止新内容被用户看到是至关重要的（DCMS:\
  \ 2019）。\n\n这一最后一点引发了持续的激烈争论：在反恐分析的心理社会领域，具有某些暴力精神病态特征的个人是否倾向于恐怖主义？如果是，是否存在关键的行为特征能够帮助当局在极端政治极端主义行为最严重的行为发生前，防止被极端化的个人成功实施这些行为？\n\
  \n#### `ISIS and AQ cyberterrorism in the 2020s`\n\n自 20 世纪末在伊拉克和叙利亚的军事失败以及大多数司法管辖区加强的反恐立法和检测能力后，ISIS\
  \ 的碎片化可能导致其在美洲和欧洲成功实施恐怖袭击的频率下降。欧洲理事会报告称，自 2020 年起 ISIS 的恐怖袭击显著下降，尽管法国每年似乎发生多起重大事件（European\
  \ Council: 2023）。根据 Europol 数据，2021 年欧盟警方逮捕了 388 名涉嫌恐怖主义罪行的嫌疑人。其中超过三分之二的调查（260 起）与激进主义阴谋有关，主要集中在奥地利、法国和西班牙（Europol:\
  \ 2022）。一个典型案例是 2023 年 6 月，奥地利国家安全情报局（DSN）成功 thwarted 一起由三名打算使用剑、气枪和可能的车辆冲撞人群的恐怖袭击计划，目标是\
  \ 2023 年维也纳骄傲节。该 ISIS 支持的三人组通过网络被 radicalized，因其基于计算机的研究而引起怀疑（Financial Times: 2023）。一个月后，另一名\
  \ ISIS 支持的网络宣传者在社交媒体上抨击反穆斯林的偏见，并呼吁极端右翼人物被目标化并暗杀（MEMRI: July 2023c）。\n\n### `2.4\
  \ Hamas – Israel-Palestine conflict`\n\n据 `Security Week` 的 `Luke Townsend` 表示，一个与哈马斯有关的攻击组织\
  \ APT‑C‑23 发起了针对以色列高级国防、执法和应急服务官员的钓鱼行动。该组织推出了名为 “VolatileVenom” 的伪装通讯应用、“Barbie\
  \ Downloader” 下载程序以及名为 “Barbwire” 的后门（Townsend: 2022）。\n\n钓鱼是创建假、具吸引力的在线身份以诱使受害者进行尴尬行为并捕获其行踪和数据的手段。攻击者的假账号保持活跃且可信，假身份加入用户群体并发布鼓励互动的更新。一旦建立直接联系，攻击者建议将对话转移至\
  \ WhatsApp，从而获取受害者的电话号码。随着交流变得更加个人化，攻击者进一步建议使用更“ discreet”（隐蔽）的通信方式，转而使用另一个 Android\
  \ 即时通讯应用——实际上是 VolatileVenom 恶意软件。当受害者尝试登录时，系统会返回错误信息，使其误以为该应用已被卸载，但实际上 VolatileVenom\
  \ 仍在后台运行，具备强大的间谍能力。此外，私密视频（即 “Barbie Downloader”）也会被发送给受害者，通过移除安全扫描并窃取 PDF、压缩包、图片、视频文件，并搜索外部媒体插件的迹象，从而感染系统。这表明被攻击的官员可能携带高价值便携数据，如光盘和\
  \ U 盘。Townsend 报告称 `APT‑C‑23 与 “Molerats” 被认为是哈马斯网络战争部的两个主要子组`（Townsend: 2022）。Molerats\
  \ 自 2011 年起几乎持续运营（也被称为 Gaza Hackers Team、Gaza Cyber Gang、DustySky、Extreme Jackal、Moonlight\
  \ 和 TA402），并被网络安全公司 Proofpoint 识别为针对中东地区（以色列以外）的政府部门、银行、航空公司和 NGOs（Kovacs: 2022）的目标。该攻击由\
  \ Cybereason 的 Nocturnus 研究团队发现并分析。\n\n## CHAPTER 3: THE ROLE OF SOCIAL MEDIA COMPANIES\n\
  \n### `3.1 Big tech – Facebook, Instagram, Telegram, TikTok, Twitter (now X), YouTube`\n\
  \n\n\n-   [费曼学习法](https://wiki.example.org/feynmans_learning_method)的灵感源于诺贝尔物理奖获得者**理查德·费曼**。\n\
  \n1.  运用费曼技巧，你只需花上`20 min`就能深入理解知识点，而且记忆深刻，*难以遗忘*。\n\n```\nif (condVar > someVal)\
  \ {console.log(\"xxx\")}\n```\n\n\n\n约有四分之一的全球其他年轻人（13 岁及以上）使用 Instagram。其 13.10\
  \ 亿全球用户中，超过 30% 的人年龄在 24 岁以下（DataRePortal: 2023）。Instagram 拥有超过 1.5 亿美国用户和约 2900\
  \ 万名英国用户（Meltwater: 2023）。这款照片和视频分享应用（适用于 13 岁及以上的用户）自 2012 年被 Meta（Facebook 的母公司）收购后，已删除大量政治暴力和极端主义内容。与此同时，Instagram\
  \ 用户成为 ISIS 和极右派招募者与宣传者的有力目标。Instagram 的无限滚动图片板块结合强烈个性化内容生成算法，使该平台引发儿童心理学家的重大关注。Zara\
  \ Abrams 的文章引用了心理学家 Adam Alter 的观点：“Instagram 之所以有问题，部分原因在于其成瘾性。与杂志、电视节目或视频游戏不同，该平台很少提供停止提示——即温和的提示，促使用户转向其他活动[…]相反，它持续提供内容，迫使用户回到动态顶部，重复下滑的过程”（American\
  \ Psychological Association: 2021）。这种缺乏停止提示意味着 Instagram 对年轻人（尤其是心理健康问题患者）尤其危险，因为其社交行为过滤机制尚未在认知功能发展上充分成熟，涉及审慎、同理心或冲动控制等方面。因此，反恐分析师已观察到多起极端分子利用\
  \ Instagram 为其提供关键洞察的案例。据 CST 反恐研究人员（即《We Are Generation Terror》作者 Rose 和 AC）称：“Instagram\
  \ 是年轻种族民族主义者的有力工具，为他们提供了强大的招募机会、触达年轻受众以及展示震撼视觉内容的平台”（Rose and AC: 2021: 3）。案例包括：\n\
  \n1. 一名来自英国普雷斯顿的 18 岁青年，在 2022 年于伦敦旧贝利刑事法院受审时，通过 Instagram 传播恐怖出版物，并附带 ISIS 处决视频和照片（Lancashire\
  \ Post: 2022）。\n\n2. 2023 年，MEMRI 的反恐研究团队报告称，多样化的国内恐怖分子在全球范围内通过网络协作。观察到的激进分子包括反大科技的新路德主义者、生态极端主义者以及“其他环境主义极端分支”，他们继续在\
  \ Instagram 上分享恐怖手段、暴力手段和意识形态宣传。研究人员得出结论：“结果是一个日益国际化、互联的极端分子网络，他们以 Instagram 为主要沟通和内容传播手段。这些账号在规模和意识形态上各异，但共享对暴力的崇拜以及革命活动的推广”（MEMRI:\
  \ 2023 年 4 月）。\n\n3. 2023 年，一名来自美国密歇根州的前高中生威胁其大学进行恐怖袭击，并在一段在 Instagram Live 视频中以说唱形式点名学生。该前学生被警方发现在该机构附近，身着战术性面部彩绘（News-Herald:\
  \ 2023）。\n\nMeta 公司的主要成员、Instagram 的社区准则与 Facebook（如上文所述）相同。其社区准则规定：“Instagram 不是支持或赞扬恐怖主义、有组织犯罪或仇恨团体的场所”（Instagram:\
  \ 2023）。该平台在支持 Christchurch Call 并实施 YouTube 和 Twitter 章节中详细描述的 GIFCT 事件响应协议方面发挥了重要作用。与其他美国科技巨头一样，该平台开始尽可能删除由美国政府列为恐怖组织的国际国家实体所发布的暴力材料。例如，2019\
  \ 年 4 月，Instagram 和 Facebook 开始删除由伊朗伊斯兰革命卫队（IRGC）关键人物运营的账号，这些账号直接参与在邻国伊拉克及更广泛地区实施恐怖行为（CNN:\
  \ 2019b）。\n\n**表 1：Instagram 用户 2024**\n\n**（世界人口评论，Instagram 用户：2024）**\n\n| **国家**\
  \ | **用户** |\n| --- | --- |\n| 印度 | 2.296 亿 |\n| 美国 | 1.434 亿 |\n| 印度尼西亚 | 8920\
  \ 万 |\n| 土耳其 | 4860 万 |\n| 日本 | 4570 万 |\n\n**案例研究：Nashir News 下架**\n\nISIS 的 Nashir\
  \ 新闻机构于 2017 年 5 月在 Instagram 上成立，虽曾登上新闻标题，但几家硅谷社交媒体公司迅速将其账号下架。Instagram 在 Facebook\
  \ 已删除可识别 Nashir 档案后，一天内删除了多个账号。这些账号此前由 ISIS 约 100 个 Telegram 账号进行宣传和标示。在此之前，Nashir\
  \ 采用集中化策略，鼓励全球 ISIS 支持者激活本地社交媒体账号，以更自主地传播信息。据信，在 Instagram 安全机制介入前，少于 100 名用户看到\
  \ ISIS 恐怖袭击图片及声称责任的声明。公司向记者表示：“Instagram 对恐怖分子、恐怖宣传或赞扬恐怖活动零容忍，并在发现后立即积极删除”（BBC Technology:\
  \ 2017）。\n\n#### ***Telegram***\n\nTelegram 由 **Paul Durov** 创立，现总部设在阿联酋，最初起源于俄罗斯圣彼得堡。它是一款开源、端到端加密的即时通讯（IM）应用，专注于速度和用户安全。快速群组的核心优势在于\
  \ Telegram 托管的消息可在所有设备上同步使用，无论是平板、个人电脑还是手机，消息同步可跨多设备进行。其核心安全特性是用户自行选择加入聊天室，加密密钥在用户设备上生成并存储，而非由\
  \ Telegram 管理，因此技术上几乎不可能向 Telegram 交出私钥，以便政府或其他利益方读取或窃取消息。\n\n据 TrustRadius 科技评测门户显示，Telegram\
  \ 拥有 5 亿月活跃用户，且是全球下载量前 10 大应用之一（TrustRadius: 2023）。该应用于 2013 年全球上线，用户数量随之迅速增长，与其主要竞争对手\
  \ WhatsApp、Viber 和 Signal 同步增长。Telegram 早期提供的端到端加密、消息自毁、快速群聊等功能，加上其团队对政府管控和用户审查的明确否定态度，使得少数激进边缘群体倾向于使用并利用该平台。\n\
  \n\n-   [在 2015 年和 2016 年法国一系列恐怖袭击之后，Telegram 在媒体中受到了巨大的压力，因为警察调查表明，组织者使用该即时通讯平台协调了在诺曼底修道院杀害牧师的公开谋杀，随后大规模分发视频和效忠声明。当时已有约\
  \ 9000 名 ISIS 追随者在使用该应用。为避免被打压，ISIS 将其即时通讯“宣传机器”搬到了暗网（CSO Online: 2015）。果然，Telegram\
  \ 的所有者关闭了 78 个可归因于 ISIS 招募、组织和通信活动的公共频道。大多数“仍然坚持使用 Telegram”，但其他人自 2018 年 ISIS 发布消息称\
  \ Telegram 正在与政府安全机构合作，并进行了多次由欧洲警局领导的社交媒体账号删除后，转而使用`RocketChat`和`Riot`（BBC News:\
  \ 2019）。根据 BBC 的说法：“亲 IS 的媒体团体 Quraysh 警告 Telegram，称其下架行动会适得其反，暗示会将圣战者驱入地下，当局将看不到他们在做什么”（BBC\
  \ News: 2019）。英国和美国媒体机构分别将 Telegram 描述为“圣战者即时通讯应用”和“恐怖组织首选的沟通方式”（Daily Mirror: 2016）。随着阿富汗传出塔利班战斗力量通过运营其\
  \ Telegram 频道——al-Emarah——来“战略性”使用社交媒体，其声誉受损（Ward: 2018）。\n\n-   关于 Telegram 的自由主义作风的担忧持续存在。2022\
  \ 年，一个订阅量极多的亲 ISISTelegram 频道继续招募成员并运营 ISIS“突袭部队”，针对并鼓励穆斯林青年传播由 ISIS 官方渠道及非官方媒体发布的圣战媒体内容（MEMRI:\
  \ 2022a）。此外，根据 WebZ.io 网络情报机构`Hagar Margolin`网络分析师的说法：“Telegram 正在采取行动移除其平台上的极端和暴力内容，包括删除可疑账号和群组。然而，为根除这一现象所采取的措施似乎并不十分成功。”截至\
  \ 2022 年，ISIS 仍“主要利用 Telegram 传播宣传”，Margolin（Margolin: 2022）这样结论。\n\n**案例研究：Telegram\
  \ 与俄罗斯——大规模消息服务能否被有效封锁？**\n\n-   对极端主义和恐怖主义宣传的担忧，包括鼓励“公民袭击”，促使一些国家（包括印度尼西亚）尝试封锁\
  \ Telegram 的 DNS 服务器。出于类似原因，俄罗斯政府于 2017 年和 2018 年严重限制 Telegram 在俄罗斯的存在。除非能够向公共当局提供解密密钥以解锁内容和用户信息，国家当局认为\
  \ Telegram 不应被允许合法运营。然而，Telegram 称此方案不太可能，因为在 Telegram 中，加密密钥由终端用户生成并不被主机看到。实际困难随即出现。约\
  \ 2400 万俄罗斯人，包括许多企业和关键供应链连接，已依赖 Telegram。服务中断 reportedly 造成了重大经济损失。COVID-19 大流行期间的事件也助长了\
  \ Telegram 的地位。该即时通讯软件在疫情期间成为俄罗斯当局高效的国家直接通信工具。俄罗斯政府在一定程度上逆转了对 Telegram 的挑战，尽管双方在法院中仍就各种障碍展开争议。截至\
  \ 2023 年，Telegram 服务全球 7 亿用户，若它是一个国家，将是世界第三大人口大国（World Population Review, Telegram\
  \ Users: 2023）。\n\n#### `TikTok`\n\n-   中国起源的`TikTok`在撰写时，已是全球视频分享平台的领导者。预计到 2025\
  \ 年将达到一十亿用户，该平台在 2020 至 2024 年间的全球用户数从 4.65 亿增长至 9 亿（Statista: 2024）。`TikTok`自 2016\
  \ 年在‘Douyin’名称下成立以来，其母公司`ByteDance`呈现出惊人的增长。`TikTok`的受欢迎程度部分源于其易用的内容生成和编辑功能。Vlog\
  \ 通常由用户自行拍摄，无需道具和专业美学，而推荐算法则帮助相似用户和内容轻松找到彼此。当前，`TikTok`用户最多的前三大地区分别为美国（1.36 亿）、印度尼西亚（9900\
  \ 万）和巴西（7400 万）。英国提供`TikTok`第十二大用户群，拥有 2300 万用户——2022 年约为其人口的三分之一（Smart Home Fox:\
  \ 2023）。\n\n-   与所有社交媒体平台一样，关于平台助长的可能“网络恐怖主义”广播的个别案例层出不穷。但鉴于政府对该问题的极度焦虑，美国国土安全部于\
  \ 2021 年发布了一份专门的安全通报，列举了多个`TikTok`内容托管案例：\n\n  1. 2020 年 11 月，一名来自巴基斯坦的伊玛目因在`TikTok`上宣传恐怖主义而在法国巴黎被定罪，判处\
  \ 18 个月监禁并随后被驱逐出境。\n\n  2. 在 2021 年 1 月 6 日美国国会大厦骚乱之前，多段鼓吹暴力的视频在`TikTok`上发布并传播，其中一条视频来自一位鼓励参会者携带火\
  \ arm 在华盛顿特区的用户。携带火 arm 在 DC 指定的抗议活动区域是非法的（DHS Office of Intelligence and Analysis:\
  \ 2021）。\n\n  3. 2019 年 10 月，海外 ISIS 激进分子在 24 个`TikTok`账号上发布视频，画面包括 ISIS 战士与尸体、火\
  \ arm 以及宣誓支持宗教动机暴力和 ISIS 的个人。\n\n  4. 2020 年 8 月，伊拉克和沙姆阴影（ISIS）组织“Roma Libera”在`TikTok`上发布一段英文视频，详细说明如何制造爆炸`化合物`（DHS\
  \ Office of Intelligence and Analysis: 2021）。\n\n-   2023 年，英国信息专员办公室（ICO）对`TikTok`处以\
  \ 1270 万英镑的罚款，原因是非法处理 13 岁以下 140 万名儿童的个人数据，且未获父母同意（*The Guardian*: 2023）。ICO 的调查结果显示，平台管理方未能充分防止儿童接入其平台，一旦发现，几乎没有采取措施将其移除。美国贸易委员会（FTC）对`TikTok`在\
  \ 2019 年处以 570 万美元（约合 445 万英镑）的罚款。`TikTok`在辩护时称，公司雇佣约 4 万名 Internet 安全专员，并赞助如*Tech\
  \ Against Terrorism*等研究机构，监测并鼓励政府干预“恐怖主义运营的网站”（Tech Against Terrorism: 2022）。`TikTok`加入**全球反恐论坛（GIFCT）**的申请在\
  \ 2019 年被拒，原因是其内容删除记录被认为不佳（OODALoop: 2021）。`TikTok`还推出了类似“年龄适配设计代码”的功能，与竞争对手一同，ISP\
  \ 安全部门和算法主动监测用户信号和模式，在用户被封禁或通知家长之前进行拦截。\n\n#### `Twitter (now X)`\n\n\n\n-   [Twitter](https://twitter.com)\
  \ 于 2006 年作为一款微博客平台推出，最初允许用户发布 140 个字符的短文，2017 年将字符限制提升至 280 条。Twitter 拥有 35390\
  \ 万名全球用户，尽管自 2022 年以来用户数已下降约 5%（Statista: 2023b）。其中 1840 万用户来自英国，7690 万来自美国，2360\
  \ 万来自印度。日本（5900 万）、巴西、印度尼西亚、土耳其和沙特阿拉伯等国的活跃用户均超过 1500 万（`http://bankmycell.com`）：2023。其前十大追随者中，七位是流行文化和体育明星，尽管巴拉克·奥巴马（第一）、埃隆·马斯克（第二）和印度总理纳伦德拉·莫迪（第八）同样在数字媒体排名中脱颖而出（Statista:\
  \ 2023b）。然而，到 2022 年，Twitter 已开始在月活跃应用和使用量排名中跌出前十，自埃隆·马斯克收购后已失去超过 1500 万用户。\n\n\
  Twitter 简洁的用户界面会以标题、标签和视频片段的形式展示内容，这不经意间也为极端主义者提供了理想的宣传平台。其直播消息（DM）服务同样如此，用户可以在公开视野中交流，或通过私密\
  \ DM 与他人私下沟通，避开窥视。据瑞德伦大学（Leiden University）安全与全球事务研究所的 Gunnar Weimann 研究发现，“2013\
  \ 年和 2014 年，社交媒体尤其是 Twitter 超越了网络论坛，成为了恐怖主义宣传的首选空间”（`Weimann: 2018`）。Twitter 精心塑造了其作为定制新闻消费首选之地的声誉。用户在\
  \ Twittersphere 中关注自己偏好的新闻机构和喜爱评论员。作为回报，Twittersphere 的算法会挑选并传播其认为对用户最有用且有趣的新闻报道和动态。内容获取与目标受众筛选是\
  \ Twitter 最擅长的事。在美国，48% 的用户通过 Twitter 获取新闻（`http://SocialShepherd.com`）：2023。也许正是因为该平台比其他大型数字媒体平台更多地与新闻来源关联，Twitter\
  \ 开始吸引来自反恐警察和学术界的直接关注。据美国司法部《意识简报》（标题直白的“Twitter and Violent Extremism”）所述：“极端组织可以利用实时发推向大量人群组织示威并策划同步袭击。他们还可以使用带有地理位置信息或其他识别信息的带图片推文来协调伏击和袭击”（`US\
  \ Department of Justice: 2014`）。随着国内外恐怖主义担忧随欧洲、美国、俄罗斯和中国的“恐怖秀”增多而上升，Twitter 的创始人兼所有者\
  \ Jack Dorsey 遭遇来自这些国家立法者的强烈呼吁，要求彻底关闭该平台。与其他大型社交媒体公司一样，Twitter 采用了主要在事发后进行的“拔除蘑菇”（whack-a-mole）方式来删除违反社区准则的暴力极端主义内容。但这种零散的做法缺乏明确的战略，且因缺乏主动性和被认为缺乏企业责任而进一步激怒了政治决策者。在提供了数千例平台滥用的案例中，本书仅引用了其中少数几例。下面列出的几个典型案例即为冰山一角，尽管平台已采取重大措施防止线上恐怖主义：\n\
  \n1. ISIS 的社交媒体部门成立了“Bank al-Ansar”（支持者银行），据称向 43,000 名推特账户提供支持，以便激进分子能够规避日益严格的账户注册流程——该流程要求至少提供姓名、电子邮件地址和出生日期（`MEMRI:\
  \ 2016`）。\n\n2. 在 ISIS 在伊拉克/叙利亚的叛乱高峰期，美国/科索沃国籍的 Mirsad Kandic（41 岁）离开了布鲁克林（美国）的家，前往伊拉克参与\
  \ ISIS 战斗行动。除了招募他人进行谋杀并亲自实施暴行外，Kandic 还作为“ISIS 媒体埃米尔”大量使用 Twitter，美国法院认定。据联邦检察官称：\n\
  \n*Kandic 通过超过 120 个 Twitter 账户传播 ISIS 招募信息和血腥宣传。例如，被告发布了一段由 ISIS 制作的“战争之火”纪录片，影片赞美\
  \ ISIS 的征服与残忍处决，包括被迫挖掘自己坟墓后被枪击处决的受害者案例。被告在推文中称该影片是“迄今为止在屏幕上看到的最佳内容”（`US Department\
  \ of Justice: 2023`）。\n\n3. 由巴基斯坦新兴暴力极端主义组织 Tehreek-e-Jihad 在俾路支省进行分离主义斗争的平台（`MEMRI:\
  \ May 2023`）。尽管过去十年多次尝试内容审核，Hizbullah 的多个账号仍在 2023 年进行实时直播。尽管曾因过往审核而被封禁，Al-Manar\
  \ 卫星电视台和 Naim Qaseim 等 Hizbullah 频道仍在该平台重新出现（`MEMRI: July 2023`）。\n\nTwitter 的服务条款于\
  \ 2017 年进行修订，明确禁止对暴力的威胁以及其他“跨越行为界限的滥用行为，包括骚扰、恐吓或利用恐惧压制他人发声”的行为（`UPI: 2017`）。2016\
  \ 年，这家美国公司开始针对美国警方和公共官员提出的关于国内极端主义和美国本土伊斯兰主义者的担忧加强应对措施。Twitter 删除了 366,000 个账户，这一数字表明公司领导层正在认真开展对恐怖主义的打击（《纽约时报》：2016）。一些针对美国极端民族主义者的账号封禁虽被认为必要，却也引发争议（`Guynn,\
  \ 2016`）。2017 年 7 月至 12 月期间，英国警方报告称，在此期间有 275,000 个账户“因宣传恐怖主义而被永久封禁”，自 2015 年 8\
  \ 月以来，已有超过 120 万个账户因恐怖内容被封禁（`Counter Terrorism Policing: 2018`）。\n\n2019 年新西兰清真寺枪击案后，Twitter\
  \ 在与其他大型科技公司合作防止暴力极端主义宣传方面发挥了重要作用。Twitter 与 Facebook、Google、Microsoft 和 Amazon 共同签署了“Christchurch\
  \ Call to Action”（`CNN: 2019`）。Twitter 实质性资助并支持由其与 Facebook、Microsoft 和 YouTube\
  \ 共同创立的全球反恐网络（Global Internet Forum to Counter Terrorism，GIFCT），该网络于 2017 年成立（`GIFCT\
  \ website: 2023`）。该非政府组织作为实践行动中心和融合中心，负责识别包括编辑、重复和哈希化在内的恐怖内容。该平台已通过 GIFCT 的内容事件协议（Content\
  \ Incident Protocol）以及应对承诺，删除了数百万条暴力极端主义信息、视频和账户（`GIFCT website: 2023`）。\n\n\n\n\
  -   [在 2020 年美国总统选举之后，Twitter 决定暂停当时总统的@realDonaldTrump 账号，理由是“存在进一步煽动暴力的风险”，该决定发生在\
  \ 2021 年 1 月美国国会山骚乱之后。Twitch、Vimeo、Reddit、Shopify、Facebook 和 YouTube 随后也“暂停或限制特朗普在其平台上的访问”（Scapolo:\
  \ 2021）。2022 年，澳大利亚信息专员威胁对平台继续托管“在线仇恨”内容采取法律行动（BBC News: Business: 2023）。自 2022\
  \ 年以来，全球活跃用户数量下降了约 5%，降至 3.35 亿，为 2020 年以来的最低水平（Statista: 2023b）。科技大亨埃隆·马斯克于 2022\
  \ 年 10 月在六个月的收购尝试后购入了 Twitter，承诺解决刷子账户问题并捍卫言论自由（Mackey and Lee: 2022）。截至 2023 年\
  \ 2 月，该平台重申其坚决防止和应对“暴力行为的实施者”的决心：\n\n*“我们 [Twitter] 将删除任何由个人恐怖分子、暴力极端主义者或大规模暴力袭击实施者维护的账号，以及任何赞扬实施者、或专注于分享其宣传或第三方链接（相关内容已托管）的账号。我们也可能删除传播宣传或由实施者生成内容的帖子”*（Twitter\
  \ Help Center: 2023）。\n\n然而，如果向下滚动到页面底部，会发现 Twitter 用户在标题为“本政策不构成违规的内容”部分仍保留了大量灵活空间。例外情况包括：\n\
  \n• *目击者如果恰好在暴力袭击现场且成功阻止了袭击，例如有人射杀了实施者*\n\n• *在不认罪判决后被推翻定罪的实施者”*（Twitter Help Center:\
  \ 2023）。\n\n马斯克的新团队于 2023 年 7 月将 Twitter 重新品牌为‘X’，并删除了著名的鸟形标志。\n\n#### ***YouTube***\n\
  \n其口号——“*给世界一个声音*”——完美契合 YouTube。YouTube 于 2005 年推出，是由 Alphabet Inc.（前身为 Google\
  \ Inc.）所有的美国在线视频分享和社交媒体平台，是全球访问量第二大的网站，仅次于 Google Search（Forbes: 2023）。该平台拥有约 22\
  \ 亿月活跃用户（[SearchEngineJournal.com](http://SearchEngineJournal.com): 2022）。YouTube\
  \ 每天接收一百亿次观看，每小时有超过 300 小时的视频内容被上传（YouTube 官网: 2023）。有人可能会认为，该平台在遏制网络犯罪威胁方面发挥了重要作用，因为如果我们从英国服务器搜索“YouTube\
  \ 防止恐怖主义”，该作者做过的那样，几秒钟内就会收到 1200 万条视频建议（2023 年 6 月）。然而，YouTube 长期受到批评和声誉受损，原因是政治极端主义组织持续滥用该平台作为其主要宣传、招募和社会恐吓的舞台。在本作者\
  \ 2023 年对**Marshall Kent**（前伦敦大都会警察局反恐作战保安运营负责人）的访谈中，一个在 YouTube 上托管的特定广播对全球城市的安全与安全产生了深远影响。2014\
  \ 年 9 月 29 日，“逊尼派媒体机构 al-Furqan 发布了一则由阿布·穆罕默德·阿尔-阿德纳尼·阿尔-尚米（Abu Muhammad al-Adnani\
  \ al-Shami）的信息，他被称为伊斯兰国（前伊拉克和叙利亚伊斯兰国 - ISIS）的发言人以及叙利亚的伊斯兰国领袖，这则时长 41 分钟的音频信息也上传到了\
  \ YouTube 以及其他逊尼派论坛和媒体渠道”（Bakier: 2014）。根据 Kent 的说法：\n\n*“阿尔-阿德纳尼在 2014 年 9 月的‘Indeed\
  \ your Lord is ever watchful’演讲在网络上播出，具有多方面的重要意义。它正值英国恐怖威胁等级被提升至严重以应对 ISIL 的威胁之际。该演讲成为转折点，因为我们现在拥有了来自高级\
  \ ISIL 指挥官的‘虚拟呼吁武装’，他利用精致、制作精良的恐怖影片和杂志在网络空间中发布，指挥并激励人们在西方实施袭击。演讲建议的攻击方式简单、粗暴、低级且易于实施。”\n\
  \n*至关重要的是，该演讲赋予任何人无需与 ISIL 成员或领导层进一步协商即可发动单独袭击的虚拟权威，针对公众、警察、军队和安全部门。该广播旨在触达尽可能多的人，激励简单且难以被发现的袭击，这些袭击准备并发动于短时间内。*\n\
  \n*基于此成功的在线空间使用，ISIL 继续通过类似阿尔-阿德纳尼演讲的在线广播，引用随后以 ISIL 名义实施的袭击，进一步放大并向西方地区投射其间接攻击能力（Marshall\
  \ Kent 访谈: 2023）。*\n\nYouTube 庞大的受众和瞬时覆盖面，加上用户的冲动性，为那些自恋型恐怖分子提供了理想的“鸡尾酒”——他们似乎沉迷于血腥的‘恐怖自拍’。这些情节设定将他们定位为作者和核心控制者。YouTube\
  \ 还提供了影像和动态场景，显然有利于那些希望在‘恐怖游戏化’中实现目标的人；即在非游戏情境中使用电脑游戏设计元素（EU Commission: 2022）。一个典型案例发生在阿尔-阿德纳尼\
  \ 2014 年著名布道之前。根据 CTC Sentinel 的 Graham Macklin：“挪威恐怖分子安德斯·贝リ克（Anders Behring Breivik）在袭击初期规划阶段，最初计划在\
  \ 2011 年于乌托亚岛（Utøya）斩首挪威前总理格罗·哈莱姆·布룬特兰（Gro Harlem Brundtland）。他希望用 iPhone 拍摄杀戮过程并上传到\
  \ YouTube，但因未能购买 iPhone 而计划受阻，他在作证时表示”（Macklin: 2019）。恐怖分子的‘游戏化’已被获奖书籍作者、Observer\
  \ 战地记者杰森·伯克（Jason Burke）等众多权威新闻记者多次强调。仅举几个‘自拍恐怖’行为的例子：2012 年托卢兹和蒙塔邦学校与军人枪击案、2015\
  \ 年巴黎 kosher 超市机枪和围困袭击（使用 GoPro 拍摄）、2016 年法国马加维尔（Maganville）两名警察在家被杀（Burke: 2016\
  \ and NBC News: 2015a）。类似的担忧也在 2014 年加州伊斯拉维拉（Isla Vista Incel）杀戮（标题为“Elliott Rodger\
  \ 的报复”）以及 2019 年基督城清真寺枪击案（51 名穆斯林被杀）后被大量执法机构和政客提及。随后基督城惨案发生后，数万条此类视频在 YouTube 平台上在枪击事件发生后几小时内以每秒一条的速度上传，据\
  \ YouTube 首席产品官内尔·莫罕（Neal Mohan）所述（Macklin: 2019）。\n\n*YouTube 的回应*\n\n\n\n\n- \
  \  [关于 2000 年代对儿童虐待、极端主义和仇恨言论的担忧]https://Mashable.com: 2020 的平台开始雇佣数千名内容审核员，以识别、过滤并删除与这三类在线安全和安全类别相关的有毒内容。尽管\
  \ 2020 年之前，大部分 YouTube 的内容审核工作是由 AI 算法完成的，这些算法要么漏掉了经过编辑的视频，要么经常捕获符合社区规则的合法内容。随着\
  \ COVID-19 疫情限制放松，员工被允许回到办公室，从而转向人工审核和监督。根据 YouTube 的 Neil Mohan 的说法：“在疫情初期，我们决定在机器无法像人类那样精确时，我们将倾向于确保用户受到保护，即使这可能导致更多的视频被下架。”2020\
  \ 年第二季度，平台删除了 1100 万条有害视频，且据称该平台雇佣了超过 10,000 名内容审核员([Mashable.com](http://Mashable.com):\
  \ 2020)。\n\nGoogle YouTube 明确表示，它禁止恐怖主义组织及其宣传者在其平台上使用：\n\n*内容违反我们关于极端暴力的政策包括由政府列出的外国恐怖组织生产的材料。我们不允许恐怖组织以任何目的使用\
  \ YouTube，包括招募。* (Google 透明度报告: 2023)\n\n这一禁令现在涵盖了可能不被选举政府列出的组织：\n\n*“YouTube 也严格禁止宣传恐怖主义的内容，例如赞美恐怖行为或煽动暴力的内容[…]\
  \ 由非政府列出的外国恐怖组织的极端暴力组织所制作的内容通常受我们关于发布仇恨、暴力或粗俗内容的政策约束，包括那些主要旨在震撼、耸人听闻或多余的内容。审核员会根据我们的社区准则和政策对标记的内容进行评估”*\
  \ (Google 透明度报告: 2023)。\n\n用于防止恐怖主义广播的两种主要干预措施。首先，AI 被部署在快速时间内阻止可识别的恐怖哈希值。2016 年，YouTube\
  \ 与行业合作伙伴创建了哈希共享数据库，该数据库将哈希（或“数字指纹”）与其他平台共享，以阻止恐怖内容传播。根据 Google YouTube 的说法：“目前共享数据库中包含超过\
  \ 370,000 个独特的、肉眼几乎无法区分的哈希值” (Google 透明度报告: 2023)。第二，在“自动系统标记了‘有潜在问题的内容’之后，人工审核确认其是否真的违反我们的政策。如果违反，内容将被删除，并用于未来机器的更好培训。发布该内容的账户通常会受到一次警告，多次警告会导致账户终止”\
  \ (Google 透明度报告: 2023)。随后，被标记的内容样本将用于持续改进系统：“我们的团队手动审核了超过三百万条视频，提供了大量的训练示例，有助于提升机器学习标记技术”\
  \ (Google 透明度报告: 2023)。\n\n此外，YouTube 是几个领先的数字媒体平台之一，大力支持‘Christchurch Call’；这是由新西兰和法国政府领导人成立的国际委员会。该呼吁源于\
  \ 2019 年**Brenton Tarrant**直播其在两座清真寺进行的血腥袭击后的国际政治愤怒，第三座清真寺因警方应急部门的响应而被阻止。由此诞生了 GIFCT\
  \ 的内容互联网协议（CIP），该协议促使科技平台合作删除恐怖袭击现场的直播视频，包括 2019 年 10 月德国哈勒、2020 年 5 月美国亚利桑那州 Glendale、2022\
  \ 年 6 月美国纽约州 Buffalo 以及 2022 年 9 月美国田纳西州孟菲斯的枪击事件。CIP 于 2022 年 7 月成功部署，阻止了一个由实施者创建的非直播事件的广播，该事件旨在描绘印度拉贾斯坦邦乌代普尔的真实攻击。2023\
  \ 年 1 月至 3 月，YouTube 根据 Google 透明度报告: 2023，删除了超过 70,000 条有害视频。\n\n2023 年 7 月，YouTube\
  \ 封锁了 18 个与也门伊朗支持的**Ansar Allah 运动（胡塞武装）**有关的频道。几小时后，胡塞武装的媒体中心回应称，该删除是不公平的，且“类似于恐怖主义”（MEMRI:\
  \ July 2023b）。\n\n然而，根据 Sentinel CTC 的 G Macklin，在 2019 年基督城事件后，“YouTube[…]被用户重新包装和剪辑杀戮视频的行为所压倒，以此智取平台的检测系统”\
  \ (Macklin: 2019)。尽管在威胁识别和预防方面付出了努力，但 YouTube 的平台似乎仍然是大多数寻求宣传的恐怖分子的首选舞台。YouTube\
  \ 继续（尽管 unintentionally）在使恐怖分子接触心理上脆弱的新招募者方面发挥重要且影响深远的作用。该平台也在使暴力政治极端主义者能够恐吓大众公众受众方面发挥了重要且影响深远的作用。这种社会动荡无疑会扭曲公共政策制定，使政治家在和平时期的民主进程中产生实质性的迷失，并削弱其合法性。完整的伊斯兰主义恐怖主义视频干预目录可在下方“关键组织”部分找到‘MEMRI’。\n\
  \n### **3.2 其他社交媒体平台：分散式 Web（DWeb）**\n\n不仅是那些庞大的社交媒体平台会托管极端暴力内容。根据**Tech Against\
  \ Terrorism (TAT)**的研究，从 2014 年到 2019 年，超过 330 个社交媒体平台被恐怖组织使用，特定平台被用于特定目的，如文件共享和存储能力、主机位置和安全特性。“最重要的是”TAT\
  \ 指出，“恐怖分子选择的平台中小型和微型平台占比显著偏高。例如，在我们的数据中，前 50 个最常用平台中有一半是小型或微型平台” (Tech Against\
  \ Terrorism: 2019)。随着大型科技公司面临严重的声誉损害，并采取严肃措施挑战和根除恐怖分子的内容，分散式 Web（DWeb）为需要三个因素才能在线繁荣的恐怖组织提供了重要的替代通信渠道：受众覆盖、安全性和稳定性。真正去中心化的互联网运动仍处于早期阶段。但\
  \ DWeb 的活动者和设计师正在快速构建草根化的点对点网络基础设施，使其能够独立于大型、据称数据受损的数据托管服务运行。WebTorrent 的创始人**Ferross\
  \ Aboukhadijeh**如是说：“分散式 Web 是一个由相互连接、独立、私有的计算机组成的系统，它们共同提供私密、安全、抗审查的信息和服务访问。”Cronkite\
  \ News 的**Eric Newton**甚至更直白：“分散式 Web 是免受公司或政府干预的。它对通信而言就像本地农业对食物一样，让人们能够自己种植信息”\
  \ (Syracuse University: 2023)。\n\n\n\nDuring Telegram’s purge of ISIS accounts,\
  \ ISIS and its mirror broadcasters (including Nashir News) moved to Koonekti, which\
  \ describes itself as the `first Algerian social networking site` (@abdirahimS on\
  \ Twitter: 2019) ([VoxPol.eu](http://VoxPol.eu): 2019). Several sources, including\
  \ BBC’s Monitoring Service researchers, TAT and `Jihadoscope`, an online jihadist\
  \ threat monitoring centre, cite RocketChat, Riot, ZeroNet and Minds, as the contingency\
  \ publication options within the DWeb for ISIS should Telegram’s environment become\
  \ any more restrictive (BBC Monitoring: 2019) (`Jihadoscope`: 2019). BBC journalist\
  \ and jihadism specialist, Mina Al-Lami, found that: `Decentralised platforms like\
  \ RocketChat & ZeroNet have proved attractive for IS media operatives as the developers\
  \ of those platforms have no way of acting against content that is stored on user-operated\
  \ servers or dispersed across the user community` (@MinaLami: 2019). Examples of\
  \ RocketChat’s utility for ISIS has become increasingly documented by counter-extremist\
  \ monitoring organisations including MEMRI, who reported throughout 2023 that ISIS-supporting\
  \ computer programmers were funnelling non-technical supporters into RocketChat\
  \ forums, where the basics of networking, Linux and Unix commands could be taught\
  \ for those wishing to join the “cyber jihad” (MEMRI March and July 2023 reports).\
  \ An advantageous feature for RocketChat programmers is that the forum provides\
  \ online collaboration tools that can quickly teach hands-on technical attack capabilities\
  \ and at the same time establishing interpersonal rapport between the recruiter\
  \ and recruited. Unlike RocketChat, ZeroNet runs simple online chat forums that\
  \ host official IS media outlets including its weekly online newspaper `al-Baba`\
  \ as well as the grim back catalogue and musings of Al-Battar media, ISIS’s cyber\
  \ battalion since 2014 (Gerstel: 2016) (`King`: 2019). A tech-focused ISIS media\
  \ group called `Afaq` moved onto Riot during 2018 as did Caliphate News 24. Riot\
  \ does allow users to integrate their own servers, but ISIS and its affiliates seem\
  \ to seldom provision this available function (`King`: 2019). Due to technical limitations\
  \ of most social media end users, the growth and smooth outreach potential for truly\
  \ decentralised platforms remains difficult for ISIS. Particularly as the much-scattered\
  \ Islamic State in Iraq and Syria lacks sustainable, physical territory where it\
  \ can develop and stabilise dedicated communications infrastructure. According to\
  \ DWeb expert Peter King, ISIS propaganda on its TechHaven server could only reach\
  \ around 1,000 registered users. Capability to reach RocketChat’s estimated ten\
  \ million users and 180,000 other connected servers would require a federated system,\
  \ which was not in place at the time of King’s research (2019) but is today.\n\n\
  ### `3.3 Gaming and terrorism`\n\nDuring this book, the fusion between terrorists\
  \ and gaming platforms has been regularly mentioned. This fact, in itself, should\
  \ not necessarily cause enough concern to yell loudly for more studies and more\
  \ police resources. After all, like most of us, terrorists commonly shop for food,\
  \ drive vehicles and use the telephone. But we haven’t – so far – dedicated a book\
  \ section to these humdrum day-to-day behaviours. Nevertheless, `something is clearly\
  \ going on here`. So, we’ll delve a little further. Video gaming has unfortunately\
  \ presented significant windows of opportunity for terror groups to successfully\
  \ reach and recruit end users. Conversely, terrorism-minded end users can and do\
  \ easily find and join their ideal extremist group using video gaming platforms.\
  \ Below are some possible reasons why.\n\n`1.` `Fast-growing gaming audiences.`\
  \ Gamers tend to be young, therefore supposedly more experimental, energetic and\
  \ impressionable too. There are approximately 3.09 billion active video gamers worldwide.\
  \ This figure has risen by 1 billion (32%) in just seven years (Exploding `Topics.com`:\
  \ 2023). Some 87% of female Internet users aged 16 to 24 use video games. Likewise\
  \ for nine out of ten young males (Statista: 2023c).\n\n`2.` `Reinforcing content.`\
  \ Games such as Counter-Strike (dubbed the ‘Gaming Jihad’) allows players to simulate\
  \ terrorist attacks. ISIS and other terror groups have used multiplayer first-person\
  \ shooter games to attract extremists and recruit. ISIS propaganda videos shared\
  \ after 2014 are designed intentionally to mimic popular video games Grand Theft\
  \ Auto and Call of Duty. Conversely, many chat boards on Steam “idolize mass shooters”\
  \ because their victims are often victims of bullying. Neo-Nazi and Incel extremist\
  \ groups on Steam have exploited such individuals to turn them against other ethnic\
  \ groups, female and LGBT+ targets.\n\n`3.` `Direct Messaging.` In-game message\
  \ boards are used to groom susceptible end users and recruit.\n\n`4.` `Weak security\
  \ controls; strong anonymity.` Since Christchurch 2019, and the advancement of cyber\
  \ security AI, social media firms have become better at red-flagging and removing\
  \ terrorism content. But online gaming is often conducted anonymously or by users\
  \ deploying a `nom de guerre`. This shared experience and team alchemy quickly fosters\
  \ a rapport with fellow team members. As such, gaming communities can be quite exclusive\
  \ and elitist at the higher levels and this makes it more difficult for external\
  \ observers (read spooks and investigators) to penetrate. Gaming products and services\
  \ are also very much unregulated in most national jurisdictions.\n\nVarious proscribed\
  \ groups and politically violent organisations have been identified as using online\
  \ gaming chats for recruitment, ideological conditioning and training. In 2016,\
  \ police in the UAE stated that young Emiratis were being recruited into ISIS via\
  \ online games. According to counter-extremism academic `Alexander Ham-Kucharski`\
  \ at Portland State University: `ISIS targets individuals as young as teenagers\
  \ through games such as Call of Duty, Far Cry, Halo, ARMA3, and Grand Theft Auto\
  \ as to recruit those from the Western world for their Jihad. ISIS Recruiters use\
  \ these platforms to attract initiates via the gaming world through imagery that\
  \ is already imprinted in the mind of avid first person shooter gamers` (`Ham-Kucharski`:\
  \ 2022). According to security intelligence firm, Concentric, ISIS frequently used\
  \ Telegram groups to `provide supporters with specific instructions for how to use\
  \ gaming platforms to recruit new members` while Lebanon-group Hezbollah `developed\
  \ its own video games where players can do battle against Israeli Defense Forces\
  \ or kill ISIS fighters in Syria` (`Dino`: 2019).\n\nA firm, recursive worry about\
  \ the use of gaming platforms – particularly by children or those experiencing mental\
  \ illness – is that hateful ideas and actions become normalised among highly kinetic\
  \ echo-chambers. Furthermore, high-use gamers can find it difficult to distinguish\
  \ physical reality from online fiction. For example, one in-depth American psychological\
  \ study found users suffered from Games Transfer Phenomenon (GTP) whereby users\
  \ experience `typically visual after-effects, pseudo-hallucinations, and misperceptions\
  \ that tend to get worse with prolonged exposure to video games` (Ortiz de Gortari:\
  \ 2014). A second suggested side effect is that external stimulus, usually sounds\
  \ and images from the physical domain, plunge some gamers back into the war games\
  \ of cyberspace. One of the 483 gamers studied, ‘Max4’, told researchers: `After\
  \ a long [Call of Duty:] Black Ops session, I saw a red player tag above a woman\
  \ riding a bicycle. Fortunately, I didn’t have my gun on hand` (Ortiz de Gortari:\
  \ 2014).\n\n\n\n-   [对研究所、企业和关键基础设施的计算机设施和系统的袭击并非新现象。我们将首先指出本书中尚未提及的内容。计算机设施和系统本身有时是施害者的中心目标。随着情报暗示一个被称为“反技术”、“盧迪派”或“生态法西斯主义”的新极端主义和恐怖浪潮即将席卷全球，这种动态可能会加剧。\n\
  \n-   在此，受一些人士对人工智能系统取代工人的担忧（即对失业和贫困的恐惧）的日益增长的关注的推动下，以及政府和商业在民众社会中使用先进监控的不安，这种不安也在激发反弹。\n\
  \n-   事实上，最早的已知破坏计算机系统的恐怖行为导致数学家研究员罗伯特·法斯纳赫（Dr. Robert Fassnacht）死亡，他有三个孩子。斯特林厄姆大楼（Sterling\
  \ Hall）是威斯康星大学麦迪逊分校的一部分，直至 1970 年曾容纳美国陆军数学研究中心。法斯纳赫及其三名同事在相邻的物理系被杀害并严重受伤，该系统并未参与军事项目。1970\
  \ 年 8 月 24 日，一群反越南战争的本土直接行动组“新年派”（New Year’s Gang）驾驶一辆被盗的福特 Econoline 厢型货车，车内装载了\
  \ 2000 磅（910 公斤）的氯化铵和燃油（ANFO），并引爆，损毁了周边 26 栋建筑，而美国陆军数学研究中心相对未受损。该组织的首脑**Karelton\
  \ Armstrong**此前已参与过直接行动，包括 1967 年在威斯康星大学纵火焚毁预备军官训练中心弹药库，以及一次电力变电站破坏。其年幼兄弟**Dwight\
  \ Armstrong**后来加入**Symbionese Liberation Army（SLA）**，这是一支位于加州的小型且极端暴力的反资本主义组织，活动期间（1973–75）进行了银行抢劫、谋杀和绑架，直至警方枪击和起诉结束恐怖行动。两兄弟最终因罪行被起诉，而美国陆军数学研究中心随后从威斯康星大学麦迪逊校区撤离（New\
  \ York Times: 1974）。\n\n-   1982 年，在新西兰惠灵顿（Wanganui），一名无政府主义自杀炸弹手在一张纸板上留下他的最后一句话：“*Heres\
  \ \\[sic\\] one anarchist down. Hopefully there’s a lot more waking up. One day\
  \ we’ll win – one day.*” 随后的爆炸使得遇难者的性别难以判断。但很快，朋克无政府主义者**Neil Roberts**因涉嫌犯罪而受到调查。他的目标是摧毁持有法院和刑事记录的警用计算机系统。Roberts\
  \ 认为，警察或任何政府机构持有并维护公民的个人信息是不道德的。附近还发现一张手写标语：“*We have maintained a silence closely\
  \ resembling stupidity*”（可能源自反西班牙殖民者秘鲁革命组织 Junta Tuitiva 的口号），该标语在新西兰流行并激发了各种流行文化呈现。数据系统未受损，也没有其他人员受害。\n\
  \n#### ***4.2 商业与基础设施***\n\n-   “作战迷雾”情景——由“可辩驳”的网络战争活动产生——无疑为恐怖组织提供了学习和获取进行大规模、致命攻击工具的机会。从恐怖分子的视角来看，成功攻击目标所需的要素与严肃且有组织的网络犯罪者所展现的思维和手段惊人地相似。后者往往耐心且条理分明地进行敌对侦察，财务预算微小且难以察觉，以个人或小型需知情单元的形式作战，并力求产生远超常理的影响——在媒体曝光度和（潜在）伤亡方面。针对基础设施和关键供应链的网络恐怖袭击，为大规模非对称作战提供了机会。正如许多恐怖袭击往往以具体的物理破坏开始一样，网络战争中从侦察到指挥层面的责任链可以通过层层混淆和误导被隐藏。这种组织高影响、低资源、具有破坏性的攻击——在较长时间内“可辩驳”——意味着国家赞助的网络恐怖主义或许是当今我们所面临的最被低估的全球安全风险之一。\n\
  \n#### ***Civil aviation***\n\n-   根据英国政府的《航空网络安全战略》，该行业“已经是国际组织的已知目标，正如反复尝试使用爆炸装置摧毁飞机的行动所显示”。该战略进一步指出，“未发现针对航空行业的具体恐怖网络威胁实例，且国际民用航空组织（ICAO）和英国的风险评估工作表明，成功的恐怖网络攻击导致死亡的风险低于其他类型的恐怖威胁”（运输部：2018：10）。该文件出版三年后，瑞典的空中交通控制系统被封锁了五天；该恶意代码的背后是“Fancy\
  \ Bear”，一家被网络分析师广泛报道的犯罪集团，据称是俄罗斯国防情报局（GRU）的附属或远程 instrument。\n\n-   2018 年 9 月，英国布里斯托尔机场的航班信息显示屏因勒索软件黑客的入侵而被关闭；乘客通知则改用白板（这或许是最重要的业务连续性装备之一）。以色列本·古里安机场承认，他们成为数以\
  \ millions 起由预先编程机器人发起的网络攻击的主要目标，因此已设立了资源充足、全职的网络安全作战中心（SOC）。2022 年 4 月，一家流行的瑞典航空公司因第三方用于办理值机和登机的软件系统被黑客入侵，导致航班出现四天的延误和取消（Stephenson\
  \ Harwood: 2022）。类似的攻击在 2022 年 5 月印度发生，影响了数百名斯派克航空（SpiceJet）乘客。\n\n-   在威胁谱的低端，数百次针对机场和客运\
  \ carrier 的成功网络攻击——包括大规模数据泄露，如卡塔尔航空（Cathay Pacific）、易捷航空（EasyJet）和英国航空（British Airways）——主要通过员工和客户钓鱼攻击或其他“软目标”，如位于乘客忠诚网站后方的数据库实现。网络分析人员已识别（至少）数万个人数据集正在暗网上出售。2021\
  \ 年 3 月，针对国际航空 IT 服务提供商 SITA（负责空中印度的预订以及全球大部分空中交通）的勒索软件攻击导致严重中断，并造成约 200 万客户记录泄露（Stephenson\
  \ Harwood: 2022）。根据 Eurocontrol（欧洲航空交通管理局的空中交通应急响应小组），在 COVID-19 旅行限制之前的那一年，针对航空的网络攻击增加了约\
  \ 530%。\n\n\n\n\nCyber 恐怖分子可能出于多种重要原因针对航空制造商。首先，经济动荡和恐惧的传播。成功入侵航空业可能为勒索或重大内部操纵（包括释放人质协议）提供巨大机会。任何已知恐怖组织（或不可预知的单独行动者）被认为控制或接管客机的情况，都可能引发不成比例的公众恐慌和警报。鉴于自\
  \ 20 世纪 60 年代末以来，国际恐怖分子通过劫机和爆炸袭击民用飞机取得了部分最成功的宣传，因此网络恐怖主义导致的行业不稳定或更严重（如大规模伤亡袭击）的威胁会受到高度关注。此外，国家资助的网络罪犯在民航领域的另一大担忧是他们可能破坏系统并获取难以在公开渠道获得的研发成果。例如，已有多次且重复的网络攻击针对欧洲航天制造商空客及其核心供应商，据称是为了窃取技术秘密。这些泄露被归因于中国，但一旦研发数据被网络罪犯窃取，攻击方式和可显现的安全漏洞很容易被传播到更具恶意的暗网或其他行为者（New\
  \ Net Technologies: 2023）。（类似于核武器安全泄露的严重担忧。）\n\n#### `Health service attacks`\n\n\
  在`德国`的`杜塞尔多夫`，2020 年，检察机关对一起疑似网络攻击的未知实施者展开调查，可能涉及过失致人死亡的指控。患有危及生命病情的患者无法在当地医院被收治，最终被转至距离约\
  \ 20 英里（32 公里）的`吕贝尔德`医院，医生一小时内未能开始治疗，患者不幸死亡（The Guardian: 2020）。2022 年圣诞节前夕，`法国`的`凡尔赛医院中心`因一次黑客攻击影响新生儿和重症监护病人治疗而取消手术。此前数月，`法国`郊区`科布利-埃松奈医院`也因数周的运营中断而取消手术，随后遭遇赎金要求，机密患者数据被上传至暗网。`法国`卫生与预防部长、医生出身的紧急医师向记者表示：“法国的医疗系统每天都面临攻击”，但“绝大多数尝试均被成功防止”。2021\
  \ 年 10 月，`以色列`的`希勒尔·亚费医疗中心`因网络攻击被迫关闭，网络安全分析师迅速阐明其影响。`Checkpoint`的`吉尔·墨辛`写道：“以生活支持设备为例，它们常通过互联网连接至医院网络。如果发生攻击导致设备停止，那么需要支持的人将得不到所需的治疗”（Jerusalem\
  \ Post: 2022）。另一潜在致命并发症是`本-古里昂大学`教授`尤瓦尔·埃沃西`所指出的：“如果突然失去服务器访问权限，医生在依据 MRI 或 CT 扫描结果为患者提供治疗时将无法给予正确的治疗”（Jerusalem\
  \ Post: 2022）。在美国，联邦政府机构于 2020 年 10 月向医疗和医疗机构发出关于潜在大规模勒索软件攻击的警报，极大概率来源于与俄罗斯有关的网络犯罪集团。`美国佛罗里达大学健康网络`在\
  \ 2021 年 6 月的一次勒索软件攻击中，手术安排和癌症患者记录被取 offline 数天，导致治疗延误并造成 6000 万美元（约 5000 万英镑）的财务损失。此前，2020\
  \ 年 12 月，在新冠疫情高峰期，`美国马里兰州`的`更大巴尔的摩医疗中心`也遭受重大攻击，虽然影响大多被削弱，但仍导致一天的运营取消。2020 年 9 月，`Security\
  \ Week`报道称，美国约 250 家由`通用健康服务`运营的医院因勒索软件攻击被迫关闭，恶意软件加密患者数据，只能在支付赎金后通过密钥恢复。`UHS`员工描述该恶意软件与`Ryuk`具有相同特征，由俄罗斯网络罪犯编写。`塔普大学`（`美国费城`）的研究人员记录了对关键国家基础设施的类似网络攻击激增，其项目提供一个关键基础设施勒索软件攻击仓库，显示\
  \ 2016 至 2020 年间攻击次数翻四倍（CIRWA）（Kovacs, E.:: 2020）。美国医院在 2020 年 9 月至 10 月期间报告称，勒索软件攻击次数增加\
  \ 71%，这对已经因新冠疫情而承受巨大压力的基础设施构成了严重威胁（UNCCT: 2021: 29）。\n\n#### `Food and drink`\n\n\
  根据`Wired`的`Emily Orton`的说法，我们应*“做好应对全球食品供应链网络攻击的准备”* (`Wired`: 2022)。2021 年，一次针对全球最大肉类生产商——位于`巴西`的`JBS\
  \ SA`的系统攻击，迅速引发约 40 次针对`美国`食品和饮料生产商的攻击。攻击重点针对`JBS`在美国的子公司，导致美国、加拿大和澳大利亚的猪肉、牛肉和鸡肉屠宰场瘫痪。在`澳大利亚`，约\
  \ 7000 名员工被临时停工（`ABC Rural`: 2021）。食品来源行业的快速数字化、全球人口激增以及过时的 IT 支持系统，使得食品安全面临黑客的威胁`Orton`\
  \ (`Wired`: 2022) 认为。例如，食品生产设施通常依赖计算机监控存储温度。美国政府将此次攻击归因于`俄罗斯`、`俄语系`黑客组织`REvil`；`乔·拜登`总统正式向`俄罗斯`总统提出抗议。`REvil`及其服务器于\
  \ 2021 年 7 月从互联网消失（`CNN`: 2021）。尽管在此之前受害企业已支付数百万美元的赎金，但攻击仍造成严重损失。\n\n#### `Oil and\
  \ gas`\n\n\n\n-   [DarkSide](https://example.org)是一家基于俄罗斯的网络犯罪团伙，2021 年 4 月，它入侵了美国东南部\
  \ Colonial Pipeline 公司一名员工的虚拟专用网络（VPN）账户。随后，犯罪分子将访问权限提升至能够声称能够关闭 5500 英里、日均 30 亿桶石油供应的控制权。为保险起见，公司代表人支付了\
  \ 75 枚比特币的赎金（约 40 亿美元/31.3 亿英镑）。但此前，新闻报道称此次中断引发恐慌性囤油，燃料价格飙升，部分州出现供应短缺，并宣布州级紧急状态（Bingley:\
  \ 2022）。石油和天然气基础设施因其在公众恐慌和燃料短缺引发的重大中断而成为攻击者的有力目标。2018 年，网络安全公司 Mandiant 的调查详细描述了他们如何追踪到一次未遂劫持紧急停机系统（旨在保护人类生命）的恶意代码，该代码出现在一家大型沙特阿拉伯石化厂内。五组数字取证证据集——包括代码错误、时间戳以及攻击者部署的多种独特攻击工具——揭示了嫌疑人可能位于莫斯科一家机构（Mandiant\
  \ FireEye Intelligence: 2018）。随着自动化进程的推进以及远程工作者模式的增加，数字鸿沟使得企业的信息技术（IT）基础设施与操作技术（OT）之间的界限变得模糊。据\
  \ Deloitte 称，大型石油和天然气公司平均使用“半百万个处理器仅用于油气田储层模拟；产生、传输和存储海量敏感且具竞争性的田间数据；并管理和共享遍布各地、田区、供应商、服务提供商和合作伙伴的数千套钻井与生产控制系统”（Deloitte:\
  \ 2017）。石油和天然气行业分析师指出：“结果是，关键的石油和天然气基础设施既像恐怖分子进行的物理袭击一样脆弱，也像 faceless armies of\
  \ smart computer programmers（无面孔的智能程序员军队）一样易受攻击”（Oil and Gas IQ: 2022）。过去五年（2017–2022），能源和大宗商品基础设施内发生了约\
  \ 35 起重大网络安全事件，呈 150%增长（S&P Global Commodity Insights: 2022）。\n\n#### ***Media and\
  \ public information***\n\n2022 年 12 月的一次勒索软件攻击窃取了员工数据并中断了*The Guardian*的新闻服务，这仅是针对新闻机构的众多网络攻击之一，这些攻击或许构成犯罪行为，但未必符合我们在本书开头所划定的恐怖主义定义标准。除非，个人员员或人类来源数据被有意传递给寻求对被盗数据的持有者实施物理伤害或恐吓的团体或个人，且目的是政治或宗教目的。今年早些时候，另一起英国新闻机构的网络攻击被追溯至中国黑客。该攻击针对*The\
  \ Times*和*Sunday Times*，企图窃取新闻人员的邮件和文档。*The Los Angeles Times*在 2018 年报道称，一次网络攻击导致其在圣地亚哥和佛罗里达的印刷业务中断。使用的恶意软件可能是针对另一家报纸的印刷系统而设计的，但由于两家出版物共享同一台印刷机，因而对多家机构网络造成了连锁损害和中断（*The\
  \ New York Times*: 2018）。加拿大的新闻门户*PressReader*，被国际记者、情报分析员和研究人员广泛使用，并自称为“全天候报纸和杂志订阅服务”，就在宣布将因谴责莫斯科对乌克兰的军事攻击而从其在线目录中移除数十个俄罗斯新闻标题的几天后，成为恶意软件攻击的目标（*InfoSecurity\
  \ Magazine*: 2022）。尽管恐怖主义定义的界限可能仍未被突破（在公众眼中至少如此），但背后的政治胁迫与恐吓的实质性威胁依然存在，尤其是当幕后是一支看似无法问责、顽固不化的国家势力时。这种威胁已深植于网络攻击受害者——记者、首席执行官、所有者、政治家甚至客户——的心中，导致行为方式出现显性或隐性的改变，例如“低调行事”或产生焦虑与恐惧，甚至因此不愿进一步调查。对个人数据的窃取——尤其是针对记者、非政府组织、政治家和公务员的数据——不应被轻描淡写为“网络犯罪”，也不应被归入信息专员办公室需调查的庞大数据泄露范畴。\
  \ hostile 国家或非国家行为体窃取新闻机构数据，后者已有可资证明的政治骚扰记录，包括谋杀，可能包括：家庭地址和私人联系方式、医疗信息、喜爱酒吧、健身房和常去地点、子女的学校、俱乐部、饮食与活动偏好、敏感的家人和朋友信息、银行交易、食品交易与偏好（仅举几例）。在物理安全领域，此类由政治暴力实体进行的侦察活动，极大概率会被视为受到监控并可能在大多数司法管辖区依据反恐防制立法予以起诉。动员社会与政治意志，以应对高度侵入性的、政治化的“网络犯罪”并将其视为“网络恐怖主义”——即对社会内部群体或全体人群的明确且可能致命的政治胁迫——是本书期望达成的结果之一。\n\
  \n一个跨越“网络恐怖主义”共识阈值的情形发生在 2015 年 5 月。法国知名电视台 TV5 Monde 历时三小时，其广播和社交媒体账户被一个自称“Cyber\
  \ Caliphate”的团体入侵，该团体据称与自称的伊斯兰国家（IS）有关联。当时法国正处于高警戒的恐怖主义氛围中。就在几周前，2015 年 1 月，两名法国穆斯林恐怖分子兄弟**Saïd\
  \ 和 Chérif Kouachi**闯入巴黎讽刺周刊《Charlie Hebdo》的办公室，持枪袭击，导致 12 人死亡、11 人受伤。同年，ISIL 恐怖分子在巴黎的剧院、体育场和餐厅杀害了\
  \ 130 人。ISIL 最初声称对 TV5 Monde 的广播中断负责，旨在恐吓法国的黄金时段观众，国际新闻机构随后在随后数周和数月里放大了该恐怖组织的声称。然而，英国政府的网络调查最终确认，TV5\
  \ Monde 的网络攻击是一次**假旗**（false flag）行动，由与俄罗斯军事情报机构（GRU）有关的网络组织实施。该攻击被英国及其他国家政府正式归因于俄罗斯\
  \ APT28 网络犯罪集团（2018）（Council on Foreign Relations: 2018）。\n\n\n\nBeyond the prospect\
  \ of visual terrorisation and demoralisation waged by cyber terror attacks on the\
  \ media, a rise in `credential stuffing` has corresponded to the increase of personal\
  \ online media subscriptions generated by the COVID-19 pandemic lockdowns. Hackers\
  \ are finding that password reuse is rife and that customers are regularly using\
  \ already compromised passwords. An investigation by cyber security firm Akami’s\
  \ `Tony Lauro` reported that *“we once found an attacker with over 100,000 paying\
  \ customers and was selling access to over 1 million accounts from different streaming\
  \ services”* (`InfoSecurity Magazine`: 2023). The reuse of password and username\
  \ combinations across different accounts clearly generates alarming risks for employer\
  \ organisations, who will need to encourage and, to some extent, force staff to\
  \ develop unique passwords and authentication when accessing business computer networks.\n\
  \n1. The following list outlines key points to consider to help prevent cyber-terrorism\
  \ attacks: Organisations should deploy more AI technology to combat threats. According\
  \ to `Wired`’s `Emily Orton`, *“AI can act at machine speed and take autonomous\
  \ action”* – so they can act fast enough to identify and respond to incoming threats.\n\
  \n2. Attacks on the supply chain into operational technology and the Internet-of-Things\
  \ (IoT) are hard to detect via legacy and signature-based security software prevention\
  \ tools. Industries need to collectively assess vulnerabilities, narrow `cyber threat\
  \ intelligence` to sector-specific threats, then patch and remediate accordingly.\
  \ Being able to detect account takeover attempts can be best done by using bot management\
  \ technology (`InfoSecurity Magazine`: 2023).\n\n3. Outdated IT systems, including\
  \ operating systems and operational technology, need to be overhauled and compliance\
  \ with modern security standards enforced and monitored continuously. 4. With account\
  \ compromises so rife in accessing media subscription services, media and home ICT\
  \ vendors should put an extra layer of customer access/authentication in place.\
  \ According to Akami’s `Tony Lauro`, *“Media companies should ensure they are using\
  \ multi-factor authentication (MFA) if possible to deter attackers gaining access\
  \ to compromised accounts \\[…\\] having to overcome a series of authentication\
  \ hurdles is more likely to stop them in their tracks, or at least have them looking\
  \ for an easier target.”*\n\n5. Dan Vasile, former vice president of information\
  \ security at Paramount entertainment corporation, recommends media organisations\
  \ to risk-rank their supply chain and continuously monitor their vendor ecosystem.\
  \ He added that this will enable these organizations to quickly identify potential\
  \ risks and address them (`InfoSecurity Magazine`: 2023).\n\n### `4.3 Advanced Technologies`\n\
  \n#### `Artificial intelligence (AI)`\n\nLate in 2022, army commanders from thirty\
  \ countries gathered in Estonia’s capital Tallinn at the CR14 NATO cyber range.\
  \ Scenarios were war-gamed and participants were tested as to how they would defend\
  \ their country while working with key international partners. The force-multiplier\
  \ role of AI in scaling up capability to attack opposing network systems in terms\
  \ of speed, frequency and penetration has alarmed corporations and government agencies\
  \ alike. Conversely, *“Artificial intelligence allows defenders to scan networks\
  \ more automatically, and fend off attacks rather than doing it manually,”* explains\
  \ `David van Wheel,` NATO’s assistant secretary-general for emerging security challenges\
  \ (Euronews: 2022).\n\nThe United Nations Office of Counter Terrorism issued a report\
  \ titled *“Algorithms and Terrorism: The Malicious use of Artificial Intelligence\
  \ for Terrorist Purposes”* in partnership with its International Crime and Research\
  \ Institute (UNICRI) back in 2021. The foreword by the UN’s Under-Secretary-General,\
  \ `Vladimir Voronkov,` stated: “Terrorists have been observed to be early adopters\
  \ of emerging technologies, which tend to be under-regulated and under-governed,\
  \ and AI is no exception” (UNCCT; 2021: 5).\n\n`Scot A Terba` reports that AI is\
  \ not *“fully aware and able to determine right from wrong leading to the possibility\
  \ for abuse of these technologies and fears of this happening with devices like\
  \ Alexa and others. In one recent case a baby was put in danger after a Nest device\
  \ was hacked through poor passwords and the temp in the room set above 90 degrees”*\
  \ (Terba: 2019). Other examples of hacking attacks upon “semi-dumb” devices include\
  \ fake news bulletins alerting Americans, among others, that North Korea had launched\
  \ nuclear missiles on them (Terba: 2019). One compelling aspect of AI – both for\
  \ cyber warfare planners and, presumably, terrorists – is that it provides capability\
  \ to quickly and accurately review a far larger battlefield landscape than any individual\
  \ or group of people. *“Hackers and crackers” have moved towards “whole campaigns\
  \ being carried out by automated systems attacking targets all over the world”*\
  \ (Terba: 2019). Open-source hacking tools and platforms such as MetaSploit, that\
  \ offer automated scripts, are equally open to white-hat and black-hat hackers.\n\
  \nUnderstanding a little more about the application of AI in digital warfare will\
  \ help security planners to understand the technical terrorist mindset. Because\
  \ the perceived advantages of AI tools and platforms for use in cyber warfare will,\
  \ equally, intrigue the sub-state actor too. Cyber warfare experts `Rudy Guyonneau\
  \ and Arnaud Le Dez` maintain: *“Intelligence is key to successful combat and maybe\
  \ be even more important to cybercombat than other forms of combat”* (Guyonneau\
  \ and Le Dez: 2019: 109). Several distinct beneficial aspects of using AI tools\
  \ and platforms for battlefield commandos and terror planners include the following.\n\
  \n*Tactical battlefield intelligence gathering and analysis:* AI’s capacity to address\
  \ vast amount of data has a natural application in the data analysis performed to\
  \ a battlefield’s situation. When data relative to the combat zone is analysed in\
  \ its entirety, it can produce a complete and precise picture of the situation (Guyneau\
  \ and Le Dez: 2019: 110).\n\n*Defensive mode intelligence gathering:* By establishing\
  \ a “honeypot” that *“evolves to enact human-driven and somewhat credible target\
  \ systems, luring the attacker into taking possession of it. The gain is two-fold:\
  \ an extension of the domain to defend while shortening the actual attack analysis”*\
  \ (Guyneau and Le Dez: 2019: 111).\n\n*Simulation and customisation:* Before combat,\
  \ the simulation allows fighters to rehearse with action modes and weapon types\
  \ tested in realistic wargames. The damage output and the expected effects can be\
  \ measured, studied and validated and their results can then be integrated in the\
  \ global planning” (Guyneau and Le Dez: 2019: 110).\n\n*Remote-control bomb detonation\
  \ based on up-to-date tactical intelligence:* According to Israel’s defence intelligence,\
  \ one Gulf state has provided Hamas in Gaza with a sophisticated technical and computerised\
  \ system through which it manages war against Israel, where missiles are fired by\
  \ remote control, enabling Hamas to manage war from a sophisticated technical operations\
  \ room, adding that this explains the few deaths among Hamas fighters in the recent\
  \ battles (Abu Saada and Turan: 2021: 190).\n\nUNCCT suggests that the threat posed\
  \ by AI in the wrong hands is potentially catastrophic, suggesting that a *“failure\
  \ of imagination can have deadly consequences”* (UNCCT: 2021: 26). Malicious uses\
  \ can be categorised into several purposes including enhancing cyber-attack capabilities,\
  \ enabling physical attacks, facilitating the financing of terrorism, spreading\
  \ propaganda and disinformation and other operational tactics.\n\n\n\n# 网络攻击能力\n\
  \n在 2016 和 2017 年，网络情报平台 Flashpoint 报告称，**ISIS** 通过名为“Caliphate Cannon”的工具发动了一系列分布式拒绝服务（DDoS）攻击。讨论活动在一个*“顶级\
  \ ISIS 深层网络论坛”*中进行。DDoS 攻击是黑客对目标服务器发起的恶意电子攻击。目标主要是伊拉克的教育和安全部门网络、经济与军事设施，此外还有埃及、约旦和也门的目标。该组织很可能使用了一个名为“DDoS-for-hire”（付费\
  \ DDoS）的 booter/stresser 服务，并在论坛上商讨攻击哪类政治目标。最终选择在区域政府的“独裁者”或“十字军”（美国领导的联盟）之间进行攻击。业务影响在至少两个案例中非常严重：一家位于也门的网络服务器托管了\
  \ 260 多个站点，被关闭了数天；一台位于伊拉克的网络服务器“在新 IP 地址上托管于 DDoS 防护服务后，长达近两个月 offline”（Flashpoint:\
  \ 2017）。\n\n随后的攻击由其他 ISIS 黑客分支发起。例如，在一次实验中，一个名为“SNAP_R”的 AI 平台向用户发送了超过 800 条钓鱼推特，发送速率为每分钟\
  \ 6.75 条。钓鱼恶意软件旨在针对特定个人和群体（常见于高层），以扰乱、窃取或窃听数据及数据主体。超过四分之一的被感染推特成功投递（UNCCT: 2021:\
  \ 28）。DefCon 2017 展示，SQL 注入攻击可以通过 DeepHack 工具实现 AI 化。研究结果简要发表在题为《Weaponizing Machine\
  \ Learning: Humanity was Overrated Anyway》（Petro and Morris: 2017）的论文中。一年后，DeepLocker\
  \ 恶意软件在 Black Hat 论坛上演示，伪装成视频会议软件，潜伏在后台直至通过面部和声音识别定位目标，随后可部署窃听载荷。根据 UNCCT：“像这样的工具在恐怖组织手中会显著增强网络恐怖主义的威胁等级”（UNCCT:\
  \ 2021: 28）。\n\n## CBRN\n\n设计用于部署化学、生物、放射性和核材料的恐怖袭击和阴谋相对罕见。数字通信大规模普及之前，恐怖组织和单独行动者从教育机构订购制造炸弹手册或通过快递和\
  \ CD‑ROM 分享爆炸设计的情况相对其他安全威胁较少，且通常被安全部门和执法机构拦截或监控。为了推翻自己国家并挑衅核武交战，日本教派组织 **Aum Shinrikyo**（“至高真理”）在\
  \ 1990 年代初期对公民实施了 17 次已知的化学和生物袭击，包括 1994 年在松本市致命的 sarin 气体袭击，以及一年后在东京地铁系统中针对通勤者的袭击（Monterey\
  \ Institute of International Studies: 2001）。一起针对纽约地铁的生物袭击（炭疽），由白人至上主义组织 **Aryan\
  \ Nation** 的两名活跃成员策划，在 1997 年因线人举报而被防止实施（CBS News: 1998）。9/11 事件发生一周后，含有炭疽孢子的信件被投递给美国几位显要参议员和新闻媒体办公室，导致五人死亡、约\
  \ 68 人受伤（Cymet and Kerkvliet: 2004）。\n\n2003 年，一位支持阿尔卡伊达的神学家在网络上发布了一份**二十五页的 fatwah**，旨在正当化对美国使用大规模杀伤性武器。该文件中写道：“如果参与圣战的人确认只有通过对不信者以大规模杀伤性武器进行惊击才能消除其恶，那么即使会消灭所有不信者，也可以使用这些武器”（[ilmway.com](http://ilmway.com)\
  \ 引用自 Tenet: 2007: 273–4 和 Suskind: 2006）。随后，用于制造化学武器的“电子蓝图”（代号‘al-Mubtakkar’，意为‘发明’）被发布到多个阿尔卡伊达在线论坛，该配方在\
  \ 2004 年初迅速像病毒一样传播。该“八页手册”包含 30 多幅图示，提供建造和目标选择的建议（Dean: 2018: 265）。至 2004 年 11 月，一家知名美国新闻机构公开了从阿尔卡伊达专门炼弹实验室（位于阿富汗恐怖训练营，直至\
  \ 2001 年秋季联合国打击后被迫关闭）获得的化学散布装置组装说明。三年后，美国主流媒体广泛报道了该装置的设计和意图：“几乎不需要任何训练即可组装和部署此类装置，因为其操作简便\
  \ \\[…\\] 一个或多个装置可以轻易携带上火车或地铁 \\[…\\] 使用多个装置造成的伤亡人数难以估计，但此类袭击必然在当地人口中引发恐慌和恐慌”（Dean:\
  \ 2018: 264）。\n\n然而，关于互联网将在尤其是充斥软目标的城市环境中打开大箱子（Pandora’s Box）的 CBRN 威胁的预测和担忧，至今尚未转化为除偶尔威胁外的实质性事件。2015\
  \ 年，一名来自英国利物浦的软件程序员因试图从 FBI 卧底警员处购买毒素 ricin 而被判刑。**Becky Pinkard**，Pink Shadows\
  \ 公司（网络调查机构）的 IT 与威胁情报副总裁，在接受媒体采访时表示：“恐怕在恐怖主义目的下获取可用材料的尝试会导致一次打击行动，这一点在极端主义论坛中非常常见。”（Sky\
  \ News: 2018）一位 Pink Shadows 高管甚至保证：“如果毒剂正在出售，我们并未看到”，部分原因是处理大规模杀伤性武器的风险对策划者及其关键供应链构成了严重威胁，使其难以实施计划（Sky\
  \ News: 2018）。尽管如此，偶尔出现的案例提醒我们：专家和调查人员是否正在错失一个此前未被发现的“黑天鹅”事件？风险识别失误的一个反复主题是，大多数专家和调查人员只能局限于已知威胁及其可能来源（即活跃组织和意识形态论坛）。\n\
  \n2016 年，**Ibn Taymiyyah Media Center**（穆罕默德·伊本·泰米亚中心）发布了关于进行武装作战的教学视频，随后发布了一段制作\
  \ ricin（致命毒素）及其使用方法的视频指南。（Blockchain ConsultUs: 2019: 11/12）\n\n## ChatBots – Including\
  \ ChatGPT\n\n人们对大型科技公司领域领先的开发者所担忧的 AI 驱动聊天机器人的巨大负面安全影响正在显现。被视为谷歌首席 AI 专家的开发者 **Geoffrey\
  \ Hinton** 在 2023 年公开警告 AI 快速发展，随后在任职十余年后辞去职务。Hinton 对《纽约时报》表示：“我以常规的借口安慰自己：如果我没有做，别人就会做。”（New York Times:\
  \ 2023）他继续说道：“很难看到如何防止坏人滥用它。”\n\n\n\n\n在 2023 年 ChatGPT 推出新版本后，超过 1,000 名技术专家和领袖，包括\
  \ `Elon Musk` 和微软首席科学官 `Eric Horvitz`，呼吁暂停开发比（微软资助）OpenAI 的 GPT-4 更强大的人工智能平台。撰写时，七国集团（G7）及其他主要经济体正在审议如何通过国际协议和条约来缓解专家（包括\
  \ Google 和 Alphabet CEO Sundar Pichai）所提出的“国家安全”问题（Firstpost: 2023）。然而，警告和法律行动似乎有点迟来，因为数十款人工智能聊天机器人，包括\
  \ Google 的“Bard”，在公开和全球范围内可用，几乎没有“了解你的客户”（KYC）障碍或其他客户尽职调查形式（Beebom: 2023）（Forbes:\
  \ 2023）。数十家聊天机器人初创公司在俄罗斯、中国及其他地区兴起，可能是因为微软在后者地区禁止 ChatGPT 的限制（Tracxn: 2023）（Forbes:\
  \ 2023）。\n\n这类易用的力量倍增的软件工具无疑对恐怖组织、准军事力量和失败国家在进行直接物理攻击时极为感兴趣。结合音频、视频和面部识别能力的聊天式人工智能，再与编辑和制作软件结合，对信息战活动家极具适用性。针对名人和政客的多个“深度伪造”污蔑案例表明，我们正面临新阶段的信息不确定性。假新闻不再是书面文字或空洞的可\
  \ refutable 论调，往往伴随可疑的饼图。包括国家支持的网络军团（以及独立网络犯罪分子）在内，在包括美国、英国、以色列、沙特阿拉伯、乌克兰和俄罗斯等多个国家，正在精心研究（窃听）、编辑、歪曲、伪造和破坏政治、商业和政府行政流程的重要方面（Bingley:\
  \ Sunday Express: 2022）。为什么？对于犯罪分子，主要是通过出售深度伪造视频和图片（明星色情内容是大赚的）以及在点击诱饵数字时获得回扣来获利。但对于政治活动家，包括与政府有关的“网络爱国者”，以及恐怖组织，其目标是将腐蚀性新闻故事传播到敌对地区——有时会与深度伪造新闻混合——这是一种战略性手段。\n\
  \n持续生成、分发并放大此类持续的悲观误导性和虚假信息，针对选定的受众，是一种极具效果的策略，用于 sow（散布）广泛的恐惧和恐慌。如果信息战行动持续进行，或与具体攻击证据相结合，长期的社会经济影响将包括社区士气低落、对国内安全能力的普遍不信任，以及对现存政权支持的逐步减少——正如一名前\
  \ Al-Qaeda 炸弹制造者所解释的（Dean: 2018）。更进一步，心理健康专家 `Sannidhya Baweja` 表示，信任让我们 *“感到快乐和安全”*（YourMentalHealthPal:\
  \ 2023）。如果我们甚至不能相信前美国总统被捕的照片是真实的（Wired: 2023）——当 millions of 人可能已经观看或分享了这些照片——那么互联网的完整性还有希望吗？更何谈我们相信（并因此喜爱）自己的能力？\n\
  \nEuropol 最近与人工智能领域专家举行圆桌研讨会，并在随后公开且部分删红的报告中得出结论：*“ChatGPT 已经能够协助大量犯罪活动，从帮助犯罪分子保持匿名到具体的恐怖主义和儿童性剥削罪行”*（Europol:\
  \ 2023）。基于 Europol 专家的讨论以及从法院和司法系统中汲取的一些情景，我们可以清晰地看到 ChatGPT 如何协助犯罪和恐怖活动的多种方式，包括以下几点：\n\
  \n• `Fraud, impersonation and social engineering`：ChatGPT 能够根据用户提示草拟高度真实的文本，使其成为网络钓鱼的极其有用的工具。\n\
  \n• `Legitimisation and message amplification`：各类在线欺诈和恐怖活动可以通过使用 ChatGPT 生成虚假的社交媒体互动来获得更大的合法性，例如推广欺诈性投资方案或提升恐怖主义的知名度。\n\
  \n• `Fake news and propaganda`：ChatGPT 在速度和规模上擅长生成听起来真实的文本，这使其成为宣传和虚假信息的理想工具，用户可以相对轻松地生成并传播符合特定叙事的信息。例如，ChatGPT\
  \ 可用于代表其他主体生成在线宣传，以促进或捍卫已被证实为虚假信息或假新闻的观点。\n\n• `Intrusive influencing`：生成并传播连贯、有影响力的广告和信息——可能以声音、头像或导师形式呈现——以诱导冲动或脆弱的人发起、启动或激励暴力行为，或传播对其的恐惧。\n\
  \n• `Malicious coding`：ChatGPT 能够在多种编程语言中生成代码。虽然部分工具功能较基础（常见例子包括帮助支持者制作钓鱼恶意软件或 Visual\
  \ Basic Application（VBA）脚本），但这为有志成为网络恐怖分子的新人提供了基础培训和认知，并将其与更高级或经验丰富的激进分子联系起来。\n\n\
  • `Prompt engineering (PE)`：ChatGPT-4 被编程为拒绝用户输入的恶意提示和通信。（许多聊天机器人不是这样。）然而，PE 是用户精确调整提问方式以影响人工智能系统输出的实践。通过对话框中对关键词的微调和脱敏，用户可以在\
  \ ChatGPT 上获取关于如何进行各种恐怖活动的信息。例如，不直接称之为“bomb”，而询问与“combustion”或“combustible”相关的内容。聊天机器人还可以通过将整体制造目标拆解为组件、阶段性过程来进行研究，例如重新工程设计火\
  \ arm。另一个名为“Freedom GPT”的产品，声称位于德克萨斯州奥斯汀，宣称拥有无审查和政治正确性敏感性。2023 年 4 月下载 FreedomGPT\
  \ 时，作者立即收到该机器人的热门示例问题，包括 *“How do I overthrow an authoritarian government?”* 和 *“How\
  \ do I make a Molotov Cocktail?”*。尽管该机器人在持续促成武装起义方面的实用性受到限制，经过多次后续访问和提示，2022 年 3\
  \ 月版的 FreedomGPT 仍未能对任何问题提供答案。随后，经过数分钟的有意闪烁，一位看似疲惫的自由女神雕像最终超时。\n\n#### `Crypto`\n\
  \n\n\n\n-   [与主流媒体叙事相反，比特币等加密货币并未提供大多数恐怖组织所需的财务稳定性或额外隐私保护。在加密平台上使用或处理技术时所涉及的技术漏洞，即使由高度技术化的个人进行金融操作，仍然是固有的。一些显著的与恐怖主义无关的互联网“老大哥式案件”为提醒威胁行为者，通过暗网运营有时比隐藏在明处更为棘手。在一个此类例子中，`Ross\
  \ Ulbricht` 创立并运营了价值数百万美元的毒品市场“丝绸之路”。根据作者调查员 Nick Bilton 的说法，“2011 年，一名 26 岁的自由主义程序员\
  \ Ross Ulbricht 创建了终极自由市场：丝绸之路，一个隐蔽的网站，托管在暗网上，任何人都可以自由交易一切——毒品、黑客软件、伪造护照、伪造现金、毒药——无需政府的监视眼”（Bilton:\
  \ 2017）。\n\n    利用多种别名和可信的在线帮凶，`Ulbricht` 建立了一个以非法佣金为基础的交易帝国，最终积累了大量现金储备并转换为加密货币。然而，多个在线错误导致了\
  \ `Ulbricht` 的覆灭。最严重的错误是将一个编程问题发布到问答网站 Stack Overflow。进一步搜索发现，他使用的化名‘altoid’直接与他的真实姓名相连，并且罕见但显眼的先前聊天记录也直接指向他。通过\
  \ Inland Revenue Service 的执着调查员 `Gary Alford`，很快就能轻易地确立 `Ulbricht` 为 Silk Road 的主要嫌疑人。进一步检查显示\
  \ `Ulbricht` 使用了假身份证，但附上了真实的头像，用于租用服务器空间。这些数字指纹迅速演变成一张数字揭露的蛛网，使得 FBI 能够识别并绘制出他精心管理的账户、附属机构和别名的网络（Bilton:\
  \ 2017）。\n\n    `AlphaBay` 是一个暗网市场，销售几乎所有非法商品，包括大规模网络攻击中窃取的个人数据，如针对 Uber 客户和英国电信公司\
  \ TalkTalk 的攻击。2017 年，`AlphaBay` 被认为是犹太社区中心爆炸威胁事件嫌疑人可能出售“学校电子邮件威胁服务”的可能地点（Associated\
  \ Press: 2017）。到 2017 年 7 月，该站点被认为每天处理 60 万至 80 万美元（46.9 万至 62.5 万英镑）的交易。随后，美国 FBI\
  \ 特工、加拿大和泰国警方的联合调查发现，已故创始人、加拿大籍的 `Alexandre Cazes` 于 2014 年创立了该站点，意图将其打造为“世界上最大的类似\
  \ eBay 的地下市场”（美国司法部没收投诉：2017）。调查之所以成功，是因为 `Cazes` 犯了使用可追踪的电子邮件账户 `pimp_alex_91@hotmail.com`\
  \ 作为 Alpha 系统欢迎和密码重置消息的“发件人”地址这一错误。这非常讽刺的是，该电子邮件地址也公开列在他的 LinkedIn 个人简介上，该简介宣传他在加拿大的合法电脑维修店。进一步的开放来源情报（OSINT）研究发现，各类社交媒体账户和聊天论坛中的图片显示\
  \ `Cazes` 与其妻子享受豪车和高档住宿。这些图片和对话——往往可以追溯到其被没收笔记本电脑上的未加密文件（与 `Ulbricht` 类似，其设备在缉毒行动中被执法人员夺获）——提供了大量经证实的实物证据，最终导致他的核心防御线崩溃，即并非\
  \ `Cazes` 本人在发出许多 incriminating 消息和金融交易。\n\n    这两个对任何有志成为暗网老大哥的案例都精准地阐明了为何政治极端主义团体可能回避加密货币平台。主导性的加密货币比特币的交易记录在公开可查的账本上。在持有者请求的情况下，这些加密货币单位只能通过日益存储来源元数据（如\
  \ MAC 地址和 IP 地址）的加密交易所进行兑换。更近期，合法的加密交易所已引入类似于传统银行的“了解您的客户”（KYC）要求，包括正式的身份证明提交和收入记录证明。虽然可能存在更宽松的加密交易所，提供“无需追问”交易环境以保护客户隐私，但考虑到许多非法加密货币持有者通常拥有相当大的资产组合（他们倾向于将其分割并通过附属机构“洗钱”），无法完全识别和追踪交易所或其所有者的真实身份，这确实构成了其非法存款可能消失的重大风险。无论是通过不法交易所所有者的直接盗窃，还是数据泄露导致的损失（即使他们能够被识别），这都远超引渡条约的范围。\n\
  \n    传奇法国调查员 `Edmund Locard` 著名地在互联网兴起之前就曾说：“每一次接触都会留下痕迹”。很可能正是基于此，恐怖分子目前与加密货币平台的可\
  \ demonstrative 参与显得零星且令人失望。相反，更私密的加密交易所与暗网元素的融合形成了一个充斥罪犯、调查人员、外国情报机构、极度多疑的政府批评者以及真正困惑、技术好奇的互联网深度潜水者的烟雾弹般的网络空间。加密空间缺乏支持情境意识的实体证据，且资金被盗的可能性极高，这使得加密平台可能被视为比其他恐怖融资方式更高风险。实物现金走私、税收或“威逼”、`Hawala`\
  \ 或其他现金转账系统，以及通过复杂但可信赖的快递和银行渠道向有利政府捐款（通常以可信的快递和银行渠道支付），仍然是主导的恐怖融资渠道。总之，90% 的互联网数据——即那些\
  \ *不会* 从 Google 服务器中喷出的数据——可能更多充当干扰而非吸引任何专注、行动导向的恐怖组织的东西。因此，进入网络版“野西”的危险旅程可能对暴力激进分子并非高优先级，而这种吸引力很可能随着监管的普及而进一步减弱。防御情报集团\
  \ Rand Corporation 最近得出结论：“在美国、欧洲和中国，监管监督使得在交易所上匿名获取比特币变得困难。然而，如果交易发生在去中心化交易所或监管缺失的国家，这些交易将变得极其难以追踪”（Rand\
  \ Corporation: 2019）。\n\n    *已知用途：*\n\n\n\n-   [第二代加密货币](https://wiki.example.org/feynmans_learning_method)在冲突地区和专制国家尤其发展迅速，包括\
  \ Monero、Dash 和 Zcash 等多元化加密平台受到人权倡导组织的欢迎。`Electronic Frontier Foundation (EFF)`\
  \ 认为，对加密货币的数字监控对数以百万计被压迫在极权政权、冲突区域以及高度负债、高税收的发达工业经济体中的人来说是“灾难”。正如经济学家 `Milton Friedman`\
  \ 的经典著作 *Capitalism and Freedom* 中所倡导的原则，EFF 表示：“匿名与他人进行交易是公民自由的根本”（EFF 网站：2021）。无论您对\
  \ EFF 的激烈观点持何看法，值得注意的是——就像数字世界的其他一切——没有任何加密平台能提供完全的隐私，只有增强的保密性。也许。\n\n下面是几个加密平台被用于恐怖活动的案例：\n\
  \n• `Mujahideen Shura Council (circa 2012)`：`Ibn Taymiyyah Media Center` 是该组织的宣传单位，曾使用爆炸物和火箭攻击以色列。其“equip\
  \ us”（武装我们）运动旨在为每位圣战者筹集 2500 美元。视频和行动呼吁在 Facebook 和 Twitter 上发布，广告中包含二维码以便捐赠比特币。财务反应微弱。\n\
  \n• `Long Island, NY, US (circa 2017)`：一名 27 岁的美国女子因欺诈银行、阴谋洗钱和三项洗钱罪名被起诉，她通过非法获取信用卡并向叙利亚一家“\
  \ humanitarian”（人道主义）组织捐赠 62,500 美元，该组织在极端主义视频中被标记。法院记录显示，被告 *“阅读关于女性加入并对抗 ISIS\
  \ 的文章，查看土耳其-叙利亚边境及 ISIS 控制地区的地图，搜索‘医学生 ISIS’和‘我能获得多少透支’等短语，并观看 ISIS 成员呼吁穆斯林在西方国家实施袭击的视频”*（NPR：2017）。类似案件中，美国和加拿大的四名被告被起诉，企图通过比特币转移\
  \ 22,500 美元给 ISIS（美国司法部：2022）。\n\n• `Europol report (circa 2018)`：欧洲警察机构报告称，ISIS\
  \ 捐款通过 Zcash 和比特币收到。捐款被描述为 *“小”* 且用于购买网站域名（Blockchain ConsultUs：2019：14）。\n\n• `Malhama\
  \ Tactical (circa 2019)`：该小组据称运营一个 *“虚拟大学”* 供战场操作。视频展示了武器训练和战场机动。社交媒体渠道包括 Facebook、Twitter、Telegram、[VK.com](http://VK.com)\
  \ 和 YouTube。视频结尾有 *“支持我们”* 的呼吁及比特币地址（Blockchain ConsultUs：2019：12）。财务反应微弱。\n\n•\
  \ `Crypto investigation into Hamas, India (circa 2019–2022)`：德里警方情报融合与战略操作（IFSO）单位历时五个月的调查，发现巴勒斯坦武装组织哈马斯（Hamas）策划了对加密货币钱包的黑客攻击。约\
  \ 50 万美元的比特币和以太坊被从一名德里商人的钱包中提取，随后通过多个私人钱包转移，最终进入哈马斯加沙部队（al-Qassam Brigades）使用的钱包。根据\
  \ IFSO 调查人员的说法，货币还转移到巴勒斯坦拉马拉和埃及吉萨的已知激进领袖的钱包中。被盗加密钱包曾在该商人的 Oppo F17 安卓手机上托管（*The\
  \ Times of India*: 2022）。\n\n• `Shehab in Crypto News (2023)`：巴勒斯坦新闻机构 `Shehab`\
  \ 报道称，哈马斯武装组织在其 Telegram 消息中呼吁追随者 *“特别是在 prosecution（起诉）加剧且对任何试图通过这种货币支持抵抗运动的人的敌对努力翻倍的背景下”*\
  \ 停止比特币捐款（Crypto News：2023）。\n\n也许没有人比 Blockchain 报告作者 `Simone Casadei Bernardi`\
  \ 更能概括投资加密货币的弊端。即使恐怖分子和暗网黑客不敢窃取加密的恐怖资金，常识性的商业思维也阻止了目前大规模恐怖主义参与加密领域：*“无论您对投资持何观点，加密货币因其波动性而闻名。上升和下降的价格波动使其既具吸引力又危险。”*\
  \ 无论其意图如何，投资者 *“需要一种稳定且安全的收入来源。加密货币在此尚未符合这一条件，”* `Casadei Bernardi` 解释（Blockchain\
  \ ConsultUs：2019：17）。\n\n#### `Drones`\n\n对无人机（drones）进行破坏、入侵或逆向工程的可能性也同样诱惑了寻求恐怖和实质性伤害的个人与团体。但一些大型科技公司（不巧地使用或推广人脸识别）和政府机构低估了这一重大安全风险，它们试图在提高意识与压制公众恐慌之间取得平衡。尽管如此，安全风险管理规划者——尤其是那些在开放空间人群密集场所部署控制措施的人——应当特别关注\
  \ 2017 年 Future of Life Institute 实验，该实验介绍了 ‘Slaughterbots’：一群使用人脸识别工具的微型无人机，能够在卡车式（Kamikaze）方式识别并攻击目标（Stop\
  \ Autonomous Weapons：2017）。无人机捕获的面部图像与机载人脸识别数据库中的已上传图像进行比对。尽管一些批评者认为 ‘Slaughterbots’\
  \ 视频夸大其词，随后声称无人机在飞行时不使用人脸识别（此说法随后被推翻），但只要这种技术可用、可适应用于恐怖大规模杀伤，且部署成本低，恐怖分子就会尝试使用它。毕竟，有人载飞行器已被用作恐怖工具近七十年。包括试图将轻型飞机改装喷洒化学和生物武器于农田的尝试，均被纳入\
  \ FBI 的 Agricultural Aviation Threat Project 研究（NBC News：2004）。\n\n#### `GPS and\
  \ vehicles`\n\n\n\n\n-   [多种近期人工智能网络攻击方式](https://wiki.example.org/feynmans_learning_method)引起了反恐机构的关注，其中包括非常真实的远程劫持自动驾驶汽车的可能性。GPS\
  \ 在自动驾驶上的应用，或者人类在没有感知能力的情况下对 GPS 指令的盲从，已经在公众中引发了困惑和恐惧。最近，科技记者 `Aditi Bharade` 以标题：“*游客在夏威夷依据\
  \ GPS 驾车直接驶入港口：‘ pretty sure that was not supposed to happen’*”（Business Insider:\
  \ 2023）进行了报道。虽然这些乘客幸存，但多年前一名妇女在丈夫依据 GPS 导航驾驶日产 Sentry 车辆冲出已部分拆除且封闭六年的桥梁时丧生，丈夫受了重伤。（Washington\
  \ Post: 2015）。虽然声称车辆被黑客攻击以进行有针对性的暗杀的指控很少，但在过去十年中仍有出现，包括在加州调查记者 `Michael Hastings`（`Ashley\
  \ Neu` 在 PhoenixTS: 2013）去世后。更多基于人工智能的车辆控制将带来自主车辆携带的即兴爆炸装置的真实风险。在大规模伤亡威胁谱的低端，远程或自主控制驾驶员电子设备的行为——这可能导致在拥挤场所出现高速刹车、道路封锁或车辆冲撞——早在十多年前就由包括加州大学圣地亚哥分校和华盛顿大学在内的研究人员展示过。实验也成功演示了舱内窃听和车辆锁定（CBS\
  \ News: 2011）（Lima et al: 2016）。\n\n## `Wearables`\n\n免费智能手表上装有恶意软件，2023 年在美国军事人员的邮件中接收。这些可穿戴设备具备\
  \ Wi‑Fi 自动连接功能，能够 *“不受提示地”* 连接手机并 *“获取用户数据”*。邮件、聊天和位置数据可能会被泄露。根据网络安全公司 Otinue 的首席执行官\
  \ Gareth Lindahl‑Wise 的说法，健身追踪器的危害在于 *“泄露军事人员和设施的位置”* 这在阿富汗冲突结束后才被看到（*InfoSecurity\
  \ Magazine*: June 2023）。2018 年，一款健身追踪应用被发现向数据可视化地图公开了其用户的健身和锻炼锻炼。包括在冲突地区的城市跑步和远程慢跑路线在内的偏好路线被暴露。在阿富汗、吉布提和叙利亚等地区，使用\
  \ Strava 健身应用的用户 *“几乎全部是外国军事人员，这使得基地在可视化地图上显眼突出”* 或者可能成为那些进行局部光学敌对侦察的目标（*The Guardian*:\
  \ 2018）。\n\n银行和卡片凭证特别容易受到研究机构 DoctorWeb 所称的 ultra‑powerful SpinOk 恶意软件的侵害，研究人员称该恶意软件可以从\
  \ 101 个 Google Play 应用中下载，并可能已侵入 421 万部 Android 设备。SpinOk 的威胁行为者深入隐藏，拥有 *“多种间谍功能，包括文件收集和剪贴板内容捕获”*\
  \ ，绕过代理设置并建立与指挥与控制（C2）服务器的连接。SpinOk 的特长是监听目标银行交易，但这种强大的恶意软件也可能导致未经授权访问语音和摄像头功能（*InfoSecurity\
  \ Magazine*: May 2023）。\n\n## `CHAPTER 5: SECURITY PLANNING AND INCIDENT RESPONSE`\n\
  \n### `5.1 Security planning`\n\n在防止网络恐怖主义或有效应对疑似安全事件时，一个突出的经验教训是处理事件的多维复杂性。该场景无疑会考验贵组织在应对最复杂的融合安全难题时的能力。使用短语\
  \ “security convergence”（安全融合）时，我们指的是在企业内部将两个独立的安全职能——即物理安全和信息安全——协调一致、和谐地考虑和结合的要求。根据美国网络安全与基础设施安全局（CISA）的说法，安全融合是\
  \ *“先前相互独立的安全职能之间的正式协作”* （CISA: 2021）。网络恐怖主义既不是纯粹的物理事件，也不是纯粹的技术事件。实际上，它应被视为组织应急事件。这种复杂性在物理或技术安全领域都可能非常突出。特别是对私营部门组织而言\
  \ —  — *在现实中，工作同事如何能够区分非暴力极端主义（民事法事）和在线政治暴力？* 一组安全学术界人士这样表述：“*安全[…]的困难在于在千千万万的政治极端分子中找到那根针：那个会行动的唯一之一。那么，安全官员如何优化资源分配，以对抗极端思想和极端暴力？”（Leuprecht,\
  \ Skillicorn and McCauley: 2020: 3）。\n\n因此，一个已制定资源（人力、技术和财务）的持续且协同的反恐计划可以提升企业的整体安全与安全水平。设计和实施工作场所反恐计划的方法取决于组织的风险特征、规模和可用资源。实施效果最佳时，需要一种详细且结构化的方法，动员所有利益相关者，并确保员工对反恐政策的全部要求保持全面理解；尽管显然不太可能且不\
  \ sensible 向所有员工公开所有细节（ASIS: 2011）。拥有多个部门的大型组织可以识别设计团队的关键人员。小型企业可能只能由个人负责整个计划，但需要所有者或高层管理层的支持以及顾问的帮助（ASIS:\
  \ 2011）。团队应当思考：*组织是否拥有全部所需技能和专业知识，仅凭内部人员就能创建 CT 计划，还是需要引入咨询专家的帮助？*（Broder & Tucker\
  \ 2012）。在概念化该行动应包含什么时，我们建议熟悉并应用本章后续描述的现有正式化风险管理框架。\n\n### `5.2 Risk management:\
  \ ISO 31000:2018`\n\n#### `Apply the five essential steps`\n\nISO 31000 是国际标准化组织（ISO）生产的一系列与风险管理相关的标准。ISO\
  \ 31000:2018 提供了关于如何管理可能严重损害组织声誉或财务状况的风险的总体原则。保障信息系统及其使用者的关键在于培养并实施一种主动的风险管理文化。毫无疑问，管理框架是为了定制并使其可操作。虽然实践者可以就各个过程阶段的界限展开炽热讨论，但为了避免争论并实现现场清晰说明，本文作者主张安全专业人员应当与当前的\
  \ ISO 31000 风险管理标准保持一致，用于风险的识别和管理（ISO Docs: 2022）。²\n\n具体步骤如下：\n\n1. 识别风险  \n2.\
  \ 分析和评估风险  \n3. 制定应对计划  \n4. 实施  \n5. 监测与审查  \n\n![image](img/fig2.jpg)\n\n**图 2：ISO\
  \ “风险管理轮”³**\n\n#### `识别风险`\n\n\n\n\n在开始之前，请与董事会高管就贵公司的战略目标和风险承受能力达成一致或重新确认。全面梳理业务，进行`threat\
  \ and vulnerability reviews`（威胁与漏洞审查）。将数据以数字形式应用于威胁和风险矩阵中。您正在识别对业务具有重要安全影响的重大风险，同时也在初步判断某些被认为的风险实际上并不那么具有威胁性。在安全风险管理的整合视角中，跨三大核心企业维度——设施、人员和流程——的全面风险识别方法至关重要。请从一开始就全面协作与其他相关高管，深入理解各业务领域的压力如何潜在交叉并导致问题。您的风险评估矩阵越强，就越能更好地组织整个项目，正如敏捷项目经理\
  \ Isidora Markovic（Markovic: 2023）所指出的。要理解安全威胁和风险通常来源于三个方面：\n\n`1.` `日常、常规风险`：通常可内部管理，但可能上升或下降，需要持续审查。\n\
  \n`2.` `特定事件风险`：往往需要定制化、创新性或新颖的解决方案。\n\n`3.` `应对、反应性或恢复风险`：与过早或资源不足、未计划的恢复正常相关的风险。\n\
  \n从内部和外部获取全面的威胁情报是准确识别业务安全风险的关键。深入审查并超越贵设施的地理边界和周界围栏。向自己提问以下问题：\n\n1. 我们的组织内部有哪些来自恶意或基于不满情绪的内部人员行为的可能威胁和漏洞？\n\
  2. 我们的任何人员是否暴露于在线极端主义，其安全影响是什么？\n3. 我们所在行业内报告了哪些安全威胁和警报？\n4. 我们所在地区内报告了哪些安全威胁和警报？\n\
  5. 由于国家政府公告、外交争端或地缘政治分歧与冲突，我们公司的物理和/或网络安全威胁是否显著上升？\n6. 我们的高级执行官、董事会成员或员工是否面临（短暂或持续）的攻击或骚扰威胁？\n\
  7. 在新员工的尽职调查和入职流程中，我们是否拥有足够的安全相关检查？\n8. 以对手的思维方式，我是否真正全面审查了业务的三个领域（设施、人员、流程）？\n\
  9. 我如何安全、合规地存储威胁评估和其他风险识别材料？\n10. 我们如何向高级执行官（如有需要）以及非执行董事及其他重要利益相关者分享我们的威胁评估和风险识别方法及发现？\n\
  \n#### `风险分析与评估`\n\n风险分析进一步探索和评估您已识别的潜在有意义的风险。将研究成果提炼为一个现实、可定义且可处理的列表。从各种可避免的重大安全事件中学到的关键教训是，组织（及其风险管理团队）在风险评估阶段对恐怖主义威胁和恶意内部人员威胁的定义往往薄弱且模糊。\n\
  \n简单来说，如果您未能明确定义威胁，就不可能对其进行处理。以 Statoil 的报告和西萨塞克斯议会对 2013 年阿尔卡伊达袭击阿尔及利亚 In Amenas\
  \ 油田的调查结果（Statoil: 2013）（西萨塞克斯县议会：2015）为例。另一个教训是，某些威胁和严重安全风险正显眼地盯着您，或者组织经验丰富的企业肌肉记忆——它们就在眼前。因为在评估风险时，必须准确回顾以往的安全事件和威胁。\n\
  \n完成上述工作后，请再思考以下问题：\n\n1. 我是否真实地评估了威胁和严重风险对我们业务运营的可能性？\n2. 我是否真实地评估了威胁和严重风险对我们业务运营的影响？\n\
  3. 我是否拥有专业的安全同事或导师，能够挑战并双重检查我的威胁与漏洞评估？\n4. 我是否已安全、合规地共享、存储并保护我的发现？\n5. 我最有效的沟通方式是什么，以向高级执行官或投资决策者传达我的发现？例如，热图、严重性矩阵、威胁情报流在高层汇报中都能积极影响利益相关者和同事，展现出掌控感、组织责任感、包容性和透明度。\n\
  \n#### `应对规划`\n\n与高管一起审视风险清单和风险评分。现在，您将做什么？这一阶段从概念开发延伸至安全控制实施的边缘。正是在这里，许多组织陷入“停滞不前”的困境；它们过度思考，而与许多缺乏良知的对手不同，它们延迟行动。\n\
  \n在风险经过分析、评分并优先排序后，请迅速着手应对它们。确定实际的预算水平。重新确认并积极与负责的高层领导沟通，确保双方对预计的投资水平和企业能够容忍的操作参数有共识，防止因过度谨慎而变得风险厌恶，从而拖延实施安全控制。\n\
  \n在列出安全控制时，请使用 4Ts 风险管理记忆法。针对每个安全风险领域，您将采取以下行动：\n\n1. 终止（Terminate）；\n2. 转移（Transfer）；\n\
  3. 容忍（Tolerate）；或\n4. 处理（Treat）？\n\n请思考以下问题：\n\n1. 如果我们容忍或处理风险，需要建立哪些政策和程序？\n2.\
  \ 如果我们终止风险，是否确信物理和法律风险已被充分消除？\n3. 如果我们转移风险，是否确信物理和法律风险已被充分“转移”？\n4. 我们的某些安全控制是否可以被视为能够向高层展示实用回报（ROI）的目标？（例如，升级闭路电视、引入云存储，从而降低人工流程成本和盗窃导致的库存减少。）\n\
  \n安全风险和威胁识别本身往往不具科学性。我们如何最好地提供、解释并记录已决定不再推进的发现及潜在控制？\n\n#### `实施`\n\n实施主要包含两个部分。首先，您需要持续进行公司“走查”。这不仅是物理上的走访，还包括在企业整体——人员、设施、流程——层面上制定、明确并实施安全控制措施。您的团队需要实地检查新无线电是否工作、新的急救箱和应急包是否放置得当且未被触动、每个场点的闭路电视是否正常工作并与统一的云服务提供商对齐、云备份存储是否完全运行、所有订阅是否可访问、合法且已全额支付、高优先级区域可触及的工作手电筒及备用电池是否充足、位于重点区域的通道控制门禁（包括车辆缓冲设施）是否始终在人员控制之下。我们将这类关键细节称为风险管理控制实施的“救命细节”——即风险管理控制实施的操作部分。\n\
  \n\n\n第二，您还需要拥有运转顺畅且协同一体的领导与管理层。OpenAI 创始人 `Sam Altman` 讽刺地表示，“当缺乏结构时，它一次性全部失败”（[Medium.com](http://Medium.com)：2014）。他的话非常中肯。坚实的结构，作为协调系统的基石，能够抵御大多数恶劣力量，并在竞争性情境中取得胜利。但如果指挥与协调层面的方向性和协作能力薄弱，成功就会受阻。\n\
  \n*治理：*\n\n“整个董事会对网络安全负有责任”，英国 `National Cyber Security Centre`（NCSC）如此表述。\n\n一次网络安全事件会影响整个组织——而不仅仅是\
  \ IT 部门。例如，它可能影响在线销售、合同关系、公司声誉，或导致法律和监管行动。董事会必须拥有足够的专业知识，以便对网络安全策略提供指引并对决策进行问责（NCSC\
  \ Cyber Security Toolkit for Boards：2023）。\n\n良好的安全治理是实施网络安全计划的关键。根据 NCSC 的说法，“组织的高级领导应通过安全治理来界定员工被准许承担的安全风险以及不被接受的风险”（NCSC：2023）。“治理程序将确保高级执行官知晓并对组织的网络安全状态负责”。高层领导应当“积极参与设定实现\
  \ \\[所述的\\] 网络安全成熟度目标的时间节点，审查策略进展，确保安全与整体业务目标保持一致，并以身作则，维护和发展成功的安全文化”（Adams：2023）。NCSC\
  \ 建议组织领导者在实施全流程中要更充分地参与：\n\n“\\[Board members\\] 应当看到 \\[Key Performance Indicators\\\
  ] KPI，每项指标都有商定的可接受范围。这些指标可能包括实施安全补丁并缓解高风险漏洞所需的时间，以及从发现到 remediation 的天数”（NCSC Board\
  \ Toolkit：2023）。\n\n不断变化的威胁环境以及技术和监管解决方案的复杂性，要求负责各实施领域的决策者紧跟 cyberspace 的最新动态，并确保其计划既有条理又井然有序（Rodriguez：2023）。实施阶段的“管理”部分需要项目管理方法和纪律性。已签署并确认的组织安全风险控制措施的实施，可以由一个顶层项目管理小组推动并驱动；大型组织则可能把现有的变更或项目管理委员会分配到其职责范围内，负责落实企业安全控制。\n\
  \n项目管理方法在网络安全实施中带来以下组织收益：\n\n**1. 提升效率：** 主动的风险识别与优先级排序能让企业获得全局视野，从而实现成本节约、效率提升、系统整合、责任转移以及重复工作的减少（Rodriguez：2023）\n\
  \n**2. 改进协作与知识共享：** 通过跨职能、跨团队的协作与知识共享，技术与组织层面的认知能够大幅提升，且在结构化框架下与组织目标保持一致。\n\n**3.\
  \ 提升安全与应急响应：** 当原本素未谋面的个人与团队开始共享知识、汇聚资源时，这种整合活动会强化组织的业务连续性能力，提升整体韧性。团队成员在识别漏洞方面更为有效，并能够共同制定协同的响应策略。\n\
  \n在实践中，实施项目交付最简便的方式之一，是参考广受欢迎的 `Project Management Body of Knowledge (PMBOK) Guide`，该指南将项目管理执行划分为五大著名阶段：\n\
  \n1. `Project Initiation Phase`（项目启动阶段）\n\n2. `Project Planning Phase`（项目规划阶段）\n\
  \n3. `Project Execution Phase`（项目执行阶段）\n\n4. `Project Monitoring & Control Phase`（项目监控与控制阶段）\n\
  \n5. `Project Closure Phase`（项目收尾阶段）\n\n项目管理专家 Hannah Donato 表示，项目管理生命周期的每个阶段都有特定的目标或任务，并定义结果、交付物、流程和里程碑。以项目生命周期为管理维度，为项目团队提供共同的沟通语言，从而实现对所负责项目的更好组织控制（[ProjectManagement.com](http://ProjectManagement.com)：2022）。\n\
  \n安全控制实施阶段浩浩荡荡、滚动不止。但当团队逐步落实组织安全控制时，值得安全监测团队定期抽身出“交付泥潭”，深入审视实施本身。\n\n请自问以下问题：\n\n\
  1. 是否向董事会有效（即准确、及时）地共享安全指标？\n\n2. 如何争取高层领导和主要利益相关者积极参与并倡导推广？\n\n3. 如何双重检查我们的安全控制在法律合规性方面是否达标，并尽量降低可能的法律挑战风险？\n\
  \n4. 网络安全控制的推广是否在员工的密切参与下进行？\n\n5. 是的，您拥有广泛且深入的安全实施计划。但您的 `cyber security posture`（网络安全态势）是否及时更新，是否准确反映最新威胁？\n\
  \n**NCSC 的八大董事会提问**\n\n***1. “是否制定了网络安全策略？** 网络安全策略是提升组织韧性的高层行动计划，涵盖最高优先级的关注点。随后进入下一个问题！***\n\
  \n***2. “董事会成员能否点名列出顶级网络威胁，并说明已采取的缓解措施？** 他们是否熟悉如勒索软件等基本威胁，以及 themselves 可能成为 adversaries\
  \ 的目标？***\n\n***3. “贵组织是否拥有有效的网络风险管理方法？** 是否已设计、实施并持续审查基于风险登记册及风险所有者责任的计划？***\n\n\
  ***4. “董事会是否理解已实施的网络安全措施的总体目的？** 能否轻松解释并传达这些措施？***\n\n***5. “贵组织是否已制定并定期演练 incident\
  \ response plan（应急响应计划）？** 董事会应看到已开展的演练报告及经验教训。***\n\n***6. “合作伙伴/供应商提供的产品/服务是否已有文档记录？**\
  \ 关键服务及对外部供应商的依赖应被映射，并建立供应商失败的有效应对措施。***\n\n***7. “贵组织的安全指标是侧重成功而非失败？** 例如，除了测量点击钓鱼邮件的人数，还应关注报告该邮件的人数。***\n\
  \n***8. “HR 团队是否识别并应对组织中的网络技能缺口？** HR 应向董事会报告具体的技能缺口，并提供相应的发展计划。”***\n\n\n\nThe\
  \ 8 first sentences in each point above are drawn directly from the NCSC’s Business\
  \ Toolkit Toolbox (2023). The descriptive sentences are abridged from NCSC and mixed\
  \ with the author’s own descriptive work.\n\nSource: NCSC Toolkit’s toolbox: *[`www.ncsc.gov.uk/collection/board-toolkit/toolkits-toolbox`](https://www.ncsc.gov.uk/collection/board-toolkit/toolkits-toolbox)*\n\
  \n#### Monitoring and review\n\nAsk yourself the following questions:\n\n1. Have\
  \ we instituted a regular `threat and risk monitor` to circulate within the security\
  \ management team and also other relevant teams (Emergency Planning, Business Continuity,\
  \ C-Suite and Communications Director)?\n\n2. Although employees are vetted with\
  \ due diligence at the beginning of their employment period, what periodic due diligence\
  \ do we carry out to monitor and review employees? (It’s worth remembering that\
  \ many of the highest-profile cyber and information security breaches – read the\
  \ cases of **Edward Snowden** and **Bradley Manning** in the US, as well as **Kim\
  \ Philby** and **David Ballantyne Smith** from the UK – occur from within supposedly\
  \ deep-vetted organisations.\n\n3. Have we got everyone covered off, and actively\
  \ engaged, in baseline security management and threat awareness training? Examples\
  \ of courses should directly relate to identified security risks and range across\
  \ the company’s defined threat spectrum. (General data protection, counter-extremism,\
  \ physical safety and security, terrorism awareness, first aid, business continuity\
  \ and In Case of Emergency (ICE) contingency procedures might all be examples of\
  \ sensible training initiatives and staff-wide stress tests.)\n\n4. Because we are\
  \ dealing with the saving of lives and company assets (very important), and we are\
  \ also dealing with issues related to privacy, safety and security (very sensitive),\
  \ shall we consider bringing in independent, (supposedly impartial) external experts\
  \ for functions such as security audit, testing and review?\n\n5. To what extent\
  \ do we make the results of reviews, tests and audits known? Getting the balance\
  \ right between general staff awareness of shortcomings without letting your inquisitive\
  \ adversaries know the vulnerabilities is nearly impossible at the best of times.\n\
  \n5: Security planning and incident response\n\n### 5.3 Physical and ICT security\
  \ ‘converged’ – ISO/IEC 27001\n\nThe ISO 27000 family of information security management\
  \ standards combine to provide the pre-eminent good practice framework for securing\
  \ data, including the physical environments in which organisational data sits. A\
  \ full version can be purchased from the International Organization for Standardization\
  \ (ISO). The ISO/IEC 27000 family of standards provide a general framework and set\
  \ of principles to help organisations of any size or any industry protect their\
  \ data. The standards propel organisations to adopt, control and safely manage their\
  \ information security management systems (ISMSs). The ISO 27001 framework uses\
  \ a risk-based approach and is technology-neutral. It focuses on three dimensions\
  \ of information security:\n\n1. Confidentiality\n\n2. Integrity\n\n3. Availability\
  \ (ISO 27001:2022)\n\nThe linchpin of this series, ISO/IEC 27001 as well as its\
  \ companion standard ISO/IEC 27002, were updated and republished during 2022. The\
  \ full title is: Information security, cybersecurity and privacy protection – Information\
  \ security management systems – Requirements.\n\n27001 specifies the requirements\
  \ for establishing, implementing, maintaining and continually improving an ISMS.\
  \ One of the key strengths of ISO/IEC 27001 is that it provides substantial emphasis\
  \ on senior management accountability for establishing, maintaining and continuously\
  \ enhancing an organisational security culture (IT Governance Blog: 2023).\n\nDetermining\
  \ information security controls that are specific and appropriate to the organisation\
  \ clearly has implications for other business operational areas that are responsible\
  \ for risk management and business continuity functions. Which is why ISO/IEC 27001\
  \ makes it clear that plans and implementation are developed in consideration with\
  \ supporting and (to some extent) overlapping standards including ISO 31000:2018\
  \ Risk Management and – this author would suggest – ISO/IEC 27031:2011 ICT readiness\
  \ for business continuity standard.\n\nThe requirements are listed across several\
  \ workplace domains. For the purposes of defending against cyber terrorism, this\
  \ book will now provide a summary of this author’s top three information security\
  \ requirements for each of the given **seven domains** below:\n\n#### A. Organisational\
  \ context\n\n1. Determine relevant parties to the ISMS.\n\n2. Determine their user\
  \ requirements.\n\n3. Keep in mind legal and regulatory requirements and contractual\
  \ obligations.\n\n#### Leadership\n\nResponsibility for the security plan being\
  \ relevant, coherent, proportionate and implemented sits with the leadership. Both\
  \ with an identifiable C-suite senior executive as well as an influential and clearly\
  \ identifiable chain of command. Who is the responsible executive director? Who\
  \ is the responsible department head? Who are the responsible function heads? These\
  \ questions and many more will be asked by incident investigators and news reporters\
  \ in any security incident’s aftermath.\n\n1. Ensure information security policies\
  \ and objectives are established and compatible with overall business strategy.\n\
  \n2. Communicate the importance of effective information security management and\
  \ ensure resources to achieve polices are made available.\n\n3. Promote continual\
  \ improvement.\n\n#### Planning\n\n1. Design and conduct an information security\
  \ risk assessment process.\n\n2. Formulate an information security risk treatment\
  \ plan.\n\n3. Produce a ‘Statement of Applicability’ that contains the necessary\
  \ controls and justifications for inclusions (whether implemented or otherwise)\
  \ and exclusions.\n\n#### Support\n\n1. Ensure that people are competent on the\
  \ basis of appropriate education, training and/or experience, and take actions to\
  \ acquire the necessary competence.\n\n2. Determine the need for internal and external\
  \ communications and establish what to communicate, when, with whom and by which\
  \ method/s.\n\n3. Ensure documented information is available and fit for purpose,\
  \ but also adequately protected from loss of confidentiality, improper use or loss\
  \ of integrity.\n\n#### Operation\n\n1. The organisation should conduct information\
  \ security assessments at planned intervals or when significant changes are proposed\
  \ or occur.\n\n2. The organisation shall implement the information security risk\
  \ treatment plan.\n\n3. The organisation shall securely retain documented information\
  \ of the results of the information security risk treatment.\n\n#### Performance\
  \ evaluation\n\n1. The organisation shall conduct internal audits and ensure objectivity\
  \ and impartiality of the audit process.\n\n2. Top management shall review the information\
  \ security management system at planned intervals to ensure its continued suitability,\
  \ adequacy and effectiveness. Management reviews shall include consideration of\
  \ trends in nonconformities and corrective actions, as well as feedback from interested\
  \ parties, monitoring and audit results.\n\n3. Monitoring, measurement and evaluation\
  \ allows an organisation to review the performance of the ISMS.\n\n#### Continual\
  \ improvement\n\n1. The organisation shall continually improve the suitability,\
  \ adequacy and effectiveness of the ISMS.\n\n2. When a nonconformity occurs, the\
  \ organisation shall take action to control it and determine if similar nonconformities\
  \ exist, or could potentially occur.\n\n3. The organisation shall retain documented\
  \ information as evidence of the nature of nonconformity, subsequent actions taken\
  \ and the results of any corrective action (ISO/IEC 27001).\n\nHow can we apply\
  \ ‘converged’ security controls?\n\n\n\n\n好消息是，你不必“重新发明轮子”，也不必花数天数周（更可能是数月甚至数年）在企业内部周游，记录大量（且必然昂贵）的安全措施来实施。ISO/IEC\
  \ 委员会已经在很大程度上为你完成了这项工作。（记住，委员会由与你一样的安全人员组成，他们在职业生涯中曾被黑客攻击或遭受更严重的侵害！）或许 27001-ers\
  \ 产生的最有用且重要的材料是：`Annex A`。\n\n简而言之，`Annex A` 是一份长但极具重要意义的近 100 条安全控制清单，分为 4 个主题，提供了丰富的安全措施实施清单。Annex\
  \ A 的第 7 部分特别有助于强调将物理安全与网络安全融合为一组物理控制的关键必要性。请记住，Annex A 是*“并非穷尽，如有需要可纳入额外的信息安全控制”*\
  \ (ISO/IEC 27001:2022)。\n\n作者的教学经验也反复观察到，企业安全风险管理者和信息安全管理者都在充分考虑由网络系统所呈现的对员工和设施进行物理攻击（或计划进行物理攻击）的机会。\n\
  \n在应对网络恐怖主义时，我们将从 ISO/IEC 27001 *物理控制* 章节中提炼出我们的 **顶级安全控制**。\n\n| **1.** `Control:\
  \ Physical entry` |\n| --- |\n| *Secure areas shall be protected by appropriate\
  \ entry controls and access points.* |\n| **2.** `Control: Securing offices, rooms\
  \ and facilities` |\n| *Physical security for offices, rooms and facilities shall\
  \ be designed and implemented.* |\n| **3.** `Control: Equipment siting and protection`\
  \ |\n| *Equipment shall be sited securely and protected.* |\n| **4.** `Control:\
  \ Supporting utilities` |\n| *Information processing facilities shall be protected\
  \ from power failures and other disruptions caused by failures in supporting utilities.\
  \ Author’s note: think power generators and uninterruptible power supply (UPS) units.*\
  \ |\n| **5.** `Control: Cabling security` |\n| *Cables carrying power, data or supporting\
  \ information services shall be protected from interception, interference or damage.*\
  \ |\n| **6.** `Control: Storage media` |\n| *Storage media shall be managed through\
  \ their life cycle of acquisition, use, transportation and disposal in accordance\
  \ with the organization’s classification scheme and handling requirements.* |\n\
  | **7.** `Control: Security of assets off-premises` |\n| *Off-site assets shall\
  \ be protected.* |\n| **8.** `Control: Secure disposal or re-use of equipment` |\n\
  | *Items of equipment containing storage media shall be verified to ensure that\
  \ any sensitive data and licensed software has been removed or securely overwritten\
  \ prior to disposal or reuse.”**Source: ISO/IEC 27001:2022.** |\n### `5.4 The NIST\
  \ Cybersecurity Framework`\n\n美国国家标准与技术局（NIST）是负责为更广泛的民间社会以及经济的必要 *“工业竞争力”* 安全可靠推进测量科学标准和技术创新的美国机构（NIST:\
  \ 2022）。NIST 研发了网络安全框架（CSF），作为 *“自愿性的标准、指南和实践集，旨在帮助组织管理 IT 安全风险”*（Kyber Security:\
  \ 2019）。根据 **Kyber Security** 的专家指出，企业应对齐到 CSF 的两大强劲理由：\n\n**1.** `Compliance.`\
  \ 其底层框架帮助企业实现一系列数据安全要求的合规，包括欧盟 GDPR、美国联邦信息安全现代化法案（FISMA）、支付卡行业数据安全标准（PCI DSS）、健康保险可携性与责任法案（HIPAA）、北美电力可靠性公司关键基础设施防护（NERC\
  \ CIP）、保护非联邦系统和组织中受控非公开信息 – NIST 800-171（NIST: 2020）以及 NIST 隐私框架和网络安全框架 – NIST 800-53（NIST\
  \ Privacy Framework: 2020）。\n\n**2.** `Goal setting.` CSF 将其划分为 “层级”，帮助组织了解当前的风险水平以及需要达到的目标。此类目标设定\
  \ *“打开与高层管理层和 IT 部门就何为可接受的风险水平进行对话”*（Kyber Security: 2019）。\n\nNIST 研发了网络安全框架（CSF）以提升国家整体的网络安全态势。虽然最初面向联邦机构及政府供应链的公司，但\
  \ CSF 指南同样适用于从高校到慈善机构乃至私营企业的任何组织。NIST 的网络安全框架免费提供，而 ISO 收费获取文档。NIST CSF 包含检测、预防和应对网络事件的最佳实践与正式标准。对于网络安全成熟度较低的组织而言，\
  \ *“框架的核心现在围绕六个关键功能：Identify、Protect、Detect、Respond、Recover，以及 CSF 2.0 新增的 Govern\
  \ 功能。”*（NIST: 2024）：\n\n1. `Identify`。\n\n2. `Protect`。\n\n3. `Detect`。\n\n4. `Respond`。\n\
  \n5. `Recover`。\n\n6. `Govern`。\n\n![image](img/fig3.jpg)\n\n**Figure 3: NIST Cybersecurity\
  \ Framework – 6 Functions⁴**\n\n映射这些关键功能有助于组织设计整体的 IT 安全管理系统视图，如下所示。\n\n**1.** `Identify:`\
  \ 发展组织对管理网络安全风险的系统、资产、数据和能力的理解。该功能包括：\n\n• `Identifying` 关键企业流程和资产；\n\n• `Documenting`\
  \ 信息流；\n\n• `Maintaining` 硬件和软件清单；\n\n• `Establishing` 包含角色和责任的网络安全政策；以及\n\n• `Identifying`\
  \ 对资产的威胁、漏洞和风险。\n\n**2.** `Protect:` 制定并实施适当的防护措施，确保服务交付。该功能包括：\n\n• `Managing`\
  \ 对资产和信息的访问；\n\n• `Protecting` 敏感数据；\n\n• `Conducting` 定期备份；\n\n• `Securely` 保护设备；\n\
  \n• `Managing` 设备漏洞；以及\n\n• `Training` 用户。\n\n**3.** `Detect.` 制定并实施适当的活动，以识别网络安全事件的发生。该功能包括：\n\
  \n• `Testing` 和更新检测流程；\n\n• `Maintaining` 和监控日志；\n\n• `Knowing` 企业的预期数据流；以及\n\n\
  • `Understanding` 网络安全事件的影响。\n\n**4.** `Respond.` 制定并实施适当的活动，以应对已检测到的网络安全事件。该功能包括：\n\
  \n• `Ensuring` 测试响应计划；\n\n• `Ensuring` 更新响应计划；以及\n\n• `Coordinating` 与内部和外部利益相关方。\n\
  \n**5.** `Recover.` 制定并实施适当的活动，以保持弹性计划并恢复因网络安全事件而受损的任何能力或服务。该功能包括：\n\n• `Communicating`\
  \ 与内部和外部利益相关方；\n\n• `Ensuring` 更新恢复计划；以及\n\n• `Managing` 公共关系和公司声誉（NIST Computer\
  \ Security Resource Center: 2022）。\n\n**6.** `Govern.` 在更新版本中，NIST 增加了该功能。它涵盖：\n\
  \n• *“组织如何做出并执行自身内部决策，以支持其网络安全策略”*；以及\n\n• *“网络安全是企业风险的主要来源，与法律、财务等风险并列，需要由高层领导考虑。”*（NIST:\
  \ 2023）。\n\n\n\n\n-   [如何在组织内识别网络安全成熟度水平？本文作者推荐使用 **CSF “能力成熟度模型” (Capability Maturity\
  \ Model)**，该模型可在交付阶段跟踪您的进度。该模型是广泛使用的网络安全成熟度基准评估工具。\n\n### 5.5 事件响应\n\n数据集中记录的网络恐怖袭击事件非常稀缺，2011–2016\
  \ 年间由 **ISIS** 与 **Al‑Qaeda** 实施的袭击被识别为 **83** 起（联合大学研究，Lee 等人 2021）。在物理层面上，区分“网络犯罪”与“网络恐怖主义”可能比在现实层面更为复杂，这对犯罪统计学家来说带来了更大的难度。都柏林大学学院（UCD）的\
  \ **Ray Genoe** 提醒我们：“**几乎所有犯罪都有数字元素**”（UCD：2013）。这一事实同样适用于当代恐怖主义的所有方面。然而，初始的不确定性和复杂性——可描述为“战场雾气”——是亲历重大安全事件时的典型特征。动机和攻击计划只能由实施者以及（可能的）鼓动或协调者知晓。这种极端的情境不确定性和模糊性在至少任何新兴威胁场景的早期阶段非常常见，尤其是在恐怖主义或大规模网络攻击中，实施者或其\
  \ perceived 支持者常常利用诸如“伪旗”欺骗、拒绝服务和耗时混淆等信息战工具。此外，许多攻击者熟悉基本的人类心理学：持续的不确定性会导致焦虑，进而引发个人的气馁和抑郁；长期遭受\
  \ *不必要* 的压力会使平民放弃、逃跑或投降。因此，组织的安全管理事件响应是一套预先准备好的作战计划（可能包括某种合法的反击），用于应对并战胜在初始阶段握有大部分主动权的对手。\n\
  \n#### 国际方法\n\n最具权威性的国际标准是 **`ISO/IEC 27035-1:2023`**，该标准涉及信息安全事件、事件和漏洞的管理。`ISO/IEC\
  \ 27035` 取代了 `ISO/IEC TR 18044:2004 – Security techniques – Information Security\
  \ incident management`。27035 的完整标题 —  — `Information technology – Information security\
  \ incident management` —  — 在 `ISO/IEC 27002` 最初提供的内容基础上，侧重于响应方面。与大多数标准一样，其内容和框架对所有组织均适用，无论规模、目的或运行环境如何。安全标准提供了基本框架和控制目标：真正的落地工作在于组织自行为员工的信息安全设定战略与操作色彩，并为员工定下基调。\n\
  \n`ISO 27035` 第一部分提供了 **五阶段** 的事件管理流程：\n\n**1.** `Prepare`（准备） —  — 针对重大事件的预案。例如，设计并准备事件管理政策与计划，建立专业的计算机应急响应团队（CIRT）以预见并处理事件（`ISO\
  \ Security Blog`: 2023）。\n\n**2.** `Identify`（识别）并报告信息安全事件 —  — 该过程应包括主动检测与报告。可以由个人或安全运营中心（SOC）负责，识别并报告潜在威胁，防止其演变为正式事件。\n\
  \n**3.** `Assess`（评估） —  — 在此阶段进一步评估事件，SOC 经理或相关高层决策者会决定如何应对威胁或风险。例如，是只需进行“轻度”修补后快速恢复业务，还是需要进行取证取样，即使会产生延迟。\n\
  \n风险评估与制定“应对方案”是评估阶段的关键。\n\n**4.** `Respond`（响应） —  — 有效遏制事件，防止其对业务造成损害，并进一步调查。完整解决并处理所有发现，按事件管理计划有效应对持续的声誉、财务、以及安全与安全性问题。\n\
  \n**5.** `Learn lessons`（吸取经验） —  — 系统识别、列出并处理所有发现的弱点与改进点。将漏洞与对应的缓解措施系统化地纳入持续改进的安全政策与计划中。\n\
  \n`ISO/IEC 27035` 第二部分 *“提供事件响应规划与准备的指南，以及从事件响应中汲取经验的方法”* (`ISO/IEC 27035-2`: 2023)。第二部分旨在确保组织具备应对事件的战斗力。它强调学习经验的重要性，并将组织学习融入未来的规划与准备。第二部分通过\
  \ **九个主要条款**（原文编号）来组织内容，并在附录中提供事件表单、分类方法以及法律建议（尤其是隐私相关）等示例：\n\n*4.* `信息安全事件管理政策`\n\
  \n*5.* `信息安全政策的更新`\n\n*6.* `创建信息安全事件管理计划`\n\n*7.* `建立事件管理能力`\n\n*8.* `建立内部与外部关系`\n\
  \n*9.* `定义技术及其他支持`\n\n*10.* `创建信息安全意识与培训`\n\n*11.* `测试信息安全事件管理计划`\n\n*12.* `汲取经验`\
  \ (`ISO/IEC 27035:2-2023`)\n\n#### 美国方法：NIST 与事件响应\n\n根据网络安全专家 **ConsultDTS** 的说法，“组织自愿遵循\
  \ NIST 标准，并在政府合同或其他认证中自行评估其对特定标准的符合程度。NIST 本身不提供任何认证”。 (`[ConsultDTS.com](http://ConsultDTS.com)`:\
  \ 2023)。NIST 标准在非美国公司中广为人知，这些公司要么希望出口美国市场，要么在美国开展业务。NIST 是 *“负责制定指南和标准，包括为所有机构运营和资产提供适当信息安全的最低要求，但可以由非政府组织自愿使用”*\
  \ (`NIST SP 800-61 Rev. 2`: 2012: 13)。NIST 指南对信息安全成熟度尚不高的组织尤为有用，因为它提供了更具体的规划与目标设定细节。\n\
  \n*`NIST SP 800-61 Rev. 2 (2012) Computer Security Incident Handling Guide`* 是一份全面的业务安全与连续性框架，帮助组织在重大信息安全事件中\
  \ **遏制、管理和恢复**。该指南将事件响应的理解与管理划分为一个 **生命周期**（见 Figure 4）。\n\n![image](img/fig4.jpg)\n\
  \n**Figure 4: NIST Incident Response Life Cycle⁵**\n\n#### NIST 事件响应生命周期中的关键控制目标\n\
  \n**准备**：\n\n在平时制定作战计划。即在任何重大事件发生前，组织应做好准备。根据 NIST SP 800-61 Rev. 2 的指导，主要的准备工作包括：\n\
  \n**招聘与培训** 专门的组织计算机应急响应团队（CIRT）。\n\n\n\n\n-   [提供和提供团队及事件管理（IM）运营所需的必要工具和资源，包括用于集中协调和通信的“战斗室”，以及用于保存证据的安全存储区域。](https://example.org)\n\
  \n-   [收集包括 CIRT、核心业务职能、领导层和关键利益相关者（包括供应链和媒体）的主要和备用联系人信息，并整合成具体的 IM 联络计划。](https://example.org)\n\
  \n-   [保持备用 IT 设备，包括笔记本电脑、工作站、布线、网络设备、空白可移动介质、新智能手机、便携式打印机、电池以及电源备用等。](https://example.org)\n\
  \n-   [取证工具，包括数字取证软件（数据包嗅探器和网络分析仪）、硬装笔记本、数码相机、存储袋（包括法拉第袋以保护电子设备）、大量预印的链条管理表格、以及事件报告表格和反馈机制，部分用于实现匿名报告。](https://example.org)\n\
  \n-   [记住，预防优于治疗。开展全员网络安全意识培训。加密并保护所有安全、事件管理和业务连续性计划。开展风险评估，积极处理和审查安全威胁和漏洞。](https://example.org)\n\
  \n-   [检测：](https://example.org)\n\n    -   [根据 NIST SP 800-61 Rev. 2 的指导，您的主要检测和分析功能包括：](https://example.org)\n\
  \n    -   [了解常见的威胁向量，并通过全员基线网络安全意识培训进行宣传。在网络恐怖主义领域，常见的威胁向量包括：](https://example.org)\n\
  \n        1. 使用可移动介质进行网络渗透/数据外泄。](https://example.org)\n\n        2. 钓鱼邮件和数字媒体链接针对个人、群体和组织。](https://example.org)\n\
  \n        3. 分布式拒绝服务（DDoS）攻击，使网络失效。](https://example.org)\n\n        4. 社会工程和冒充攻击，通常针对个人（包括护卫和通信经理，他们拥有对\
  \ VIP 的特权访问）。](https://example.org)\n\n        5. 用于擦除数据系统、勒索和勒索（恐怖主义筹款）的恶意软件。](https://example.org)\n\
  \n        6. 恶意通信，包括传播可能描绘酷刑和谋杀（可能是朋友/同事）的视频，以针对群体和组织。](https://example.org)\n\n\
  \        7. 计算机设备的盗窃。](https://example.org)\n\n    -   [入侵检测和防范系统（IDPS）可以部署以自动化和持续监控您的信息系统。IDPS\
  \ 包括防病毒软件、下一代防火墙（NGFWs）（提供勒索软件、垃圾邮件防护和终端安全），以及日志分析器。许多 IDPS 解决方案效果显著且价格适中。它们提供额外的安全层和保障，特别是对微型企业和中小企业，这些企业可能过于自信于其使用的软件即服务（SaaS）产品（例如客户关系管理系统）能提供\
  \ 100%的网络安全。](https://example.org)\n\n    -   [经验丰富或受过训练的员工。许多 IT 管理员技术熟练但缺乏安全意识。此外，许多安全官员在物理和环境领域有效，但缺乏理解或识别网络威胁的能力。负责检测和分析潜在计算机安全事件的人员必须能够注意并理解“网络流量典型模式的异常偏差”（NIST\
  \ 800-61 Rev. 2: 2012: 27）。](https://example.org)\n\n    -   [威胁情报的艺术——将人类和技术安全情报结合以提升组织弹性——在本章的风险识别部分已简要提及。然而，负责技术安全检测和威胁分析的人员需要深入学习，我们指向：NIST\
  \ SP 800-94，入侵检测与防范系统指南（2007），获取完整的指导和建议框架控制。2012 年曾尝试更新该文档，但最终未发布。经验丰富的 NIST IDPS\
  \ 标准可在 NIST 图书馆在线获取，并在本书参考章节末尾的参考文献中提供链接。此外，NIST 800-61 Rev. 2: 2012（第 27 至 44 页）也包含大量网络威胁情报信息，同样在参考章节中提供出版链接。（截至本书撰写时，这些资源均为免费且开源。）](https://example.org)\n\
  \n-   [应对：](https://example.org)\n\n    -   [ containment 是关键的安全目标，在事件压倒或严重损害业务之前必须实施。\
  \ containment 可以阻碍威胁并为遏制、清除和恢复策略争取时间。根据 NIST SP 800-61 Rev. 2 的指导，您的主要 containment、清除和恢复功能包括：](https://example.org)\n\
  \n    -   [ containment：组织应为每种实现的威胁制定单独且不同的 containment 策略。虽然许多重大事件的业务影响相似，但 containment\
  \ 策略可以截然不同且多样。有效 containment 策略的根本要求是决策以及实施适当的技术响应。必须做出以下决定：](https://example.org)\n\
  \n        1. 真实的持续时间估计。](https://example.org)\n\n        2. 所需资源的真实评估（内部和外部）。](https://example.org)\n\
  \n        3. 立即加强的安全控制，以维持系统的可用性和完整性。](https://example.org)\n\n        4. 证据保护要求以及向监管机构等当局通报的要求。](https://example.org)\n\
  \n\n\n**Eradication:** 对于某些事件，不需要或在恢复阶段进行根除。Swift 转向“根除可能是必要的，以消除事件的组件，例如删除恶意软件和禁用受损用户账户，以及识别和缓解所有被利用的漏洞”（NIST\
  \ SP 800-61 Rev. 2: 2012: 37）。但总体而言，“根除和恢复应在分阶段进行，以便将修复步骤进行优先排序”（NIST SP 800-61\
  \ Rev. 2: 2012: 37）。根除有时会与证据收集和存储产生冲突。这种战术困境经常在 CIRT 或 SOC 内部讨论。证据收集和处理指南见 NIST\
  \ SP 800-61 Rev. 2（见第 3.3.2 节），包括如何维护事件日志以及记录证据链的所有权。此类信息应包括访问或处理证据的人员的姓名、时间、日期、地点、原因和操作，以及最终对证据负责的个人姓名。关于收集、存储和处理证据（物理和数字）的更详细信息，请参阅\
  \ NIST SP 800-86，Guide to Integrating Forensic Techniques into Incident Response（2006），这是网络安全专业人员可靠的老工作马。此外，国际标准\
  \ ISO/IEC 27037:2012 Information technology – Security techniques – Guidelines for\
  \ identification, collection, acquisition and preservation of digital evidence 也可供参考。另一项老旧但亟待与其他四项相关数字证据标准统一的标准，仍然在捕获以下设备和情形的数据方面提供了适当的流程指导：“用于标准计算机的数字存储媒体，如硬盘、软盘、光盘和磁光盘，以及功能类似的设备；移动电话、个人数字助理（PDA）、个人电子设备（PED）、存储卡；移动导航系统；数码照片和视频摄像机（包括闭路电视）；带网络连接的标准计算机；基于\
  \ TCP/IP 和其他数字协议的网络；以及功能类似的设备”（ISO [Security.com](http://Security.com): 2023）。\n\
  \n**Recovery:** 也许是事件响应生命周期中最微妙的阶段，类似“在高度光滑的地板上搬运明代瓷器”（英国政客罗伊·詹金斯的著名引语，形容领导人面对政治险境）。大规模事件的恢复可能需要数月甚至数年，甚至可能无法实现完全恢复。恢复应包含广泛的技术和非技术干预措施。黄金法则：不要强行加快恢复速度。分阶段恢复：不要一次性投入太多；不要让仍在异常运行的信息系统承受过大压力。同样，不要让表面看似完全有效的员工感到压力，尤其是在确认威胁是否已完全根除时。另一条经验法则：仅在可察觉的恢复期结束后，才引入长期、重大的变更。\n\
  \n*技术干预措施包括以下内容：*\n\n1. 优先处理修复步骤。\n\n2. 使用清洁备份恢复系统。\n\n3. 用新版本替换可能被篡改的文件和软件。\n\n\
  4. 为整个网络更改密码。\n\n5. 在使用时间较少的时段缓慢、谨慎地重新启动系统。\n\n6. 即使已查明内部威胁，也要增强边界安全（如检查并加固防火墙规则和路由器访问控制列表）。\n\
  \n7. 考虑从零重新构建系统。\n\n*非技术干预措施包括以下内容：*\n\n1. 通过保持常规且有足够资源的危机恢复小组，确保亲自领导力持续。该小组应包括高层管理人员以及必要时的主要利益相关者。\n\
  \n2. 媒体处理：继续使用严格的脚本（已商定的发言词）并实施结构化、定期的通信计划。危机通信计划及其主要内容（包括指定的发言人和“应对话线”）应在准备阶段（即“事前危机”阶段）已制定并获批准，以便在危机管理行业中广泛使用。\n\
  \n3. 谨慎保持内部沟通的相关性和专业性，以让员工了解情况并防止对组织产生打击情绪。在大型组织中，这类信息往往会泄露到数字媒体平台或被记者获取。因此，根据整体情境和影响严重程度，避免使用轻率的幽默、消极的不确定性或猜测，也不应转移或接受责任。持续强调组织及个人的积极行为与成就，并提供乐观的保\
  \ reassurance（隐含或明确），表明公司是并将继续是一个积极且有弹性的环境，把员工视为其首要资产。\n\n4. 认识到重大事件后，组织处于最脆弱的状态。（尽管组织高层随后需要进行充满动力的演讲）。与物理环境不同，网络环境中的攻击者通常更匿名，识别过程更长，因此执法机构介入也更久。正如\
  \ NIST SP 800-61 Rev. 2: 2012: 37 所述：“一旦资源成功被攻击，往往会再次被攻击，或组织内的其他资源以相同方式受到攻击”。\n\n\
  5. 鉴于上述原因——尤其是要理解对手和最严厉批评者的心态（请记住，公开安全事件后，两种威胁类型的数量会增加）——在作出任何明确的“任务完成”类声明时要格外谨慎。你必然会受到压力做出此类声明，但要思考：公开声明的必要程度是多少？除了向对手提供“Catch\
  \ Me If You Can”式的诱饵外，还有其他必要吗？更好是保持组织的恢复低调，用适当的感谢和在正确位置加强监控来表达支持。\n\n#### ***Recover:***\n\
  \n此阶段主要关于学习事件原因以及评估其业务影响。在此评估和评估之后，可制定并分享一份后 incident 报告，其中包含建议措施或行动方案。详细列出成本、其他影响以及向执行层提出的建议的后\
  \ incident 报告，将为组织提供防止类似事件再次发生的最佳机会。\n\n在高层管理团队（SMT）层面，应举办一次全面的“经验教训”研讨会。这可以以“离\
  \ site 日”或两天的形式进行。董事会成员应参与原因、影响以及建议的缓解措施讨论，采用无指责的方式，并在由独立同行主持的会议中分别就这三个方面进行互动讨论。\n\
  \n\n\n\n# 结论性评论\n\n与犯罪学研究领域中复杂且含糊的术语一样，本文作者承认，对于许多读者而言，“网络恐怖主义”一词仍然是一个本质上具有争议性的概念，包含多种含义和细微差别。（告诉我一个犯罪学术语不是这样吗？！）本书的目的并非证明该短语的有效性或字面解释，尽管在第\
  \ 1 章中提供的定义无疑很有帮助，并支撑了本出版物的内容。对于那些仍保持审慎怀疑的读者，希望作者至少已经表明，除了数字媒体和其他先进技术的演进之外，一个明确的后果就是出现了更高水平的普遍恐怖威胁。舆论调查显示，公众广泛认识到这一点，但迄今为止在大多数国家司法管辖区内，用于更快、更坚决防范威胁实现的工具和资源却一直进展缓慢且应用不一致（到目前为止）。在恐怖主义防范工作中，一个棘手的问题在于理解暴力单独行动者的现象，有时被理解或误解为“独狼”。这项研究得出结论，在大多数严重的所谓单一行动恐怖案件中，互联网及其他互联网用户在培养和激活特定个人方面发挥了重要或关键的作用。无论某人觉得自己在推动全球哈里发的目标、种族至上主义，还是激进\
  \ feminism 的推翻，自数字媒体出现以来，大多数单独行动者都受到、得到或在某些情况下被指挥于其在线网络中的其他人。事实是，如果没有 cybersphere\
  \ 的赋能，至少有几起惨案是不会发生的。\n\n此外，本书试图实际阐述我们在应对人类最新技术安全挑战时所能现实地采取的若干步骤。从本出版物所展示的内容来看，要假设大型科技公司或立法者拥有大部分预防权力似乎有些牵强。事实上，我们越仔细观察，就越发现大多数解决方案基本上是自下而上、由所有终端用户推动的。因此，据我所见，很难得出结论认为大型科技公司、政府和国际论坛拥有与当前问题相匹配的“魔法”解决方案。立法者和科技公司根本没有足够的“克里普顿\
  \ ite”（kryptonite）来对在线恐怖主义造成实质性打击，尤其是当我们考虑到许多国家在网络恐怖主义方面视而不见或甚至“助长”这种行为的国家，已经发展出自己先进的技术和规模与\
  \ Meta、Alphabet 相当的 ISP 之时。\n\n\n\n\n-   [然而，在政治决策层面，本书应当翻译以反映我的研究立场：网络恐怖主义是一种具体、独特、社会性的现象，值得进一步的犯罪学评估和执法支持，需要投入大量额外资源。后者可能包括对所有警察、调查人员和检察官实施至少基础的数字意识和取证培训。网络恐怖主义的调查优势在于——如果正确调查——存在丰富的（数字）证据链。这个在线的宝库可以揭示许多关联的个人、事件以及实物证据。进入数字犯罪现象已有二十年，令人震惊的是，大量事后调查报告和恐怖相关事件的调查显示，家人、朋友、同事或其他计算机网络用户多次提出关于个人严重威胁的警报。线索在于了解违规者的在线行为。显然，这类信息应当被视为至少与其他任何重要的社区情报同等重要，有人会问？太多时候，这种深刻且勇敢的报告（恐怖主义线索）被视为低风险，因为它们难以验证，或家庭闲谈被视为传闻、\
  \ gossip。 brutal 地说，网络赋能的恐怖案件往往被推诿给家庭或企业去处理。因此，我们认为，关键的预防挑战之一是确保那些勇敢地站出来（提供关键信息并投入大量个人时间和精力）的人，能够更加了解现有的法律，以帮助地方警察动员正式调查或干预，从而可能以起诉和公共安全解决方案结束。\n\
  \n为了民间社会的法律意识建设，我们列出了最新的网络犯罪正式名单。在该法律框架内，描述了可能导致起诉的若干行为和行为。（参见本书附录 E，其中提供了英国皇家检察署（CPS）检察官指南摘要。）\n\
  \n最后，我们将通过强调历史上最严厉但最少被学习的教训来结束本项目。那些处于影响力位置——如父母和监护人、教师、企业领袖和立法者——未能积极推广、鼓励和（必要时）强制执行他们所负责的对象的行为伦理，将导致任何良好系统腐烂、破裂并最终失效。我们的数字生态系统亦是如此。计算机伦理至关重要。每位用户都应学习它们、遵守它们、教导它们、向他人展示它们。此时，我们可以回到“我们之前做过的”模式，向读者介绍或提醒\
  \ `Ramon Barquin` 的象征性“计算机伦理十诫”：\n\n*1.* `Thou shalt not use a computer to harm\
  \ other people.` → *1.* `Thou shalt not use a computer to harm other people.`（保持英文，因为是命令式语句，且原文已用斜体标记）\n\
  \n*2.* `Thou shalt not interfere with other people’s computer work.` → *2.* `Thou\
  \ shalt not interfere with other people’s computer work.`（保持英文）\n\n*3.* `Thou shalt\
  \ not snoop around in other people’s computer files.` → *3.* `Thou shalt not snoop\
  \ around in other people’s computer files.`（保持英文）\n\n*4.* `Thou shalt not use a\
  \ computer to steal.` → *4.* `Thou shalt not use a computer to steal.`（保持英文）\n\n\
  *5.* `Thou shalt not use a computer to bear false witness.` → *5.* `Thou shalt not\
  \ use a computer to bear false witness.`（保持英文）\n\n*6.* `Thou shalt not copy or use\
  \ proprietary software for which you have not paid.` → *6.* `Thou shalt not copy\
  \ or use proprietary software for which you have not paid.`（保持英文）\n\n*7.* `Thou\
  \ shalt not use other people’s computer resources without authorization or proper\
  \ compensation.` → *7.* `Thou shalt not use other people’s computer resources without\
  \ authorization or proper compensation.`（保持英文）\n\n*8.* `Thou shalt appropriate other\
  \ people’s intellectual output.` → *8.* `Thou shalt appropriate other people’s intellectual\
  \ output.`（保持英文）\n\n*9.* `Thou shalt think about the social consequences of the\
  \ program you are writing or the system you are designing.` → *9.* `Thou shalt think\
  \ about the social consequences of the program you are writing or the system you\
  \ are designing.`（保持英文）\n\n*10.* `Thou shalt always use a computer in ways that\
  \ insure consideration and respect for your fellow humans` (`Ramon Barquin`, Computer\
  \ Ethics Institute: 1992). → *10.* `Thou shalt always use a computer in ways that\
  \ insure consideration and respect for your fellow humans` (`Ramon Barquin`, Computer\
  \ Ethics Institute: 1992).（保持英文）\n\nIf, for whatever reason, we can’t bring ourselves\
  \ to lead in this space and commit to these, then maybe it’s worth reflecting upon\
  \ former NSA technical director `Robert Morris`’s prophetic words. After chasing\
  \ the first generation of cyber criminals and helping to jail (and recruit) the\
  \ most dangerous, Morris discovered it was his own son who bore responsibility for\
  \ unleashing the world’s worst computer worm. His offspring reportedly brought down\
  \ a significant chunk of the then embryonic Internet. In retirement-mode, Morris\
  \ senior reportedly opened up to an Infosec event audience: `“The three golden rules\
  \ to ensure computer security are: do not own a computer; do not power it on; and\
  \ do not use it”` ([WebDeveloperNotes.com](http://WebDeveloperNotes.com)). I’m not,\
  \ at this point, seriously advocating these nuggets of wisdom. But we do need to\
  \ go back to basics somewhat and treat our Internet with kid gloves.\n\n**Richard\
  \ Bingley.**\n\n**London, 2024.**\n\n## **APPENDIX A: KEY ORGANISATIONS AND DIGITAL\
