  \ Simon King，前巴克什尔新大学（Buckinghamshire New University）安全与韧性高级讲师；在我们大学教书 days（教书日子）时是好同事。我很高兴地说，如今我们更多讨论板球，而不是安全困境。他的细致反馈极大地提升了第一稿。我们的第二位审稿人\
  \ Ze’ev Portner 是一名法学讲师。Ze’ev 拥有丰富的学术前身背景，曾在议会大厦担任首席助理。他还曾在英国各地的多个安全行业岗位工作。他的法律生涯始于以色列和伦敦的律所。Ze’ev\
  \ 对本书对非技术读者的相关性的积极态度极大地帮助我们塑造了结构并精确调整最终成品。\n\n-   同时，我也要感谢 Marshall Kent，前伦敦大都会警署的反恐协调员。Marshall\
  \ 亲自提供了访谈，我最近的对话也非常有启发性和价值，推动了网络恐怖主义考量向官员和决策者推进。同样向以下人士致谢：Helen Prendergast，她在 2022/23\
  \ 年耐心而有力地支持我在这个 *other world*（其他世界）中的努力。David Evans（创始人兼主席）和 Andy Williams（副主席）在\
  \ Global Terrorism Information Network（TINYg）任职；在我看来，这是目前最佳的公私部门反恐讨论合作伙伴。已故的 Graeme\
  \ McGowan，前 GCHQ 和内政部成员，因他鼓舞人心且持续的支持、能量和积极态度而受到感谢。（GMG 在本书出版前不久不幸逝世。）最后，衷心感谢我的妻子\
  \ Milena，她始终支持并相信我。\n\n-   到 2021 年为止——在二十年安全领域的经验之后——我认为我所有的会议演讲、课程编写、教学以及酒吧警告，都毫无意义……除非我能成功概括眼前的问题：网络恐怖主义。然后，清晰地解释防止其毁灭性影响的重要性。对我个人而言，是时候‘付诸行动或保持沉默’。将安全行业的思考、研究成果和媒体评论整合在一起。正如\
  \ Arnold Schwarzenegger 著名的话所说：“You can have results or excuses.”（你可以有结果，或者找借口。）我在此尝试提供一个基础的概述和快照，关于网络恐怖主义。超出此范围的内容——例如让读者更新安全计划，或向他人推荐这本\
  \ ITGP 书——显然是积极的结果！\n\n-   Richard Bingley。\n\n-   London, 2024.\n\n-   Security\
  \ practitioners are increasingly confronted with a chilling phrase: *cyber terrorism*.\
  \ For many, such as me, it conveys a sense of fear and hopelessness at the same\
  \ time. What is this thing called ‘cyber terrorism’? Moreover, what can we begin\
  \ to do about it? Until it hits us, the impact feels a million miles away. Another\
  \ person’s nightmare. Another organisation’s problem. Another country’s war.\n\n\
  -   For the purposes of precisely understanding cyber terrorism throughout this\
  \ book, we have borrowed and applied the National Cyber Security Centre’s core two\
  \ principles used to define and characterise a cyber crime:\n\n**1.** **Cyber-dependent\
  \ crimes** – crimes that can be committed only through the use of information and\
  \ communications technology (ICT) devices, where the devices are both the tool for\
  \ committing the crime, and the target of the crime.\n\n**2.** **Cyber-enabled crimes**\
  \ – traditional crimes that can be increased in scale or reach by the use of computers,\
  \ computer networks or other forms of ICT. (CPS: 2019)\n\n-   We will demonstrate\
  \ how terrorists intentionally use computer systems to attack and harm human beings\
  \ and property. They also use computer systems to diversify, complicate and increase\
  \ terrorist attack impacts, including body counts and escalated public panic. Or\
  \ to provide **disinformation** and **misinformation** to target audiences, including\
  \ the emergency services and/or investigators, to sabotage aid, medical assistance\
  \ and evidence. Nefarious ICT users, programmers and programs (including much AI-powered\
  \ software) have all been instrumental in recruiting, inspiring, training, executing\
  \ and amplifying acts of terrorism, which has resulted in the loss of life and/or\
  \ lifechanging physical injuries that could never have occurred without cybersphere\
  \ support and facilitation, whether by inanimate technology or others on the network\
  \ using it. All of the above can be encapsulated by the phrase ‘cyber terrorism’.\n\
  \n-   ### **The issue at hand**\n\n\n\n互联网已成为绝大多数企业和个人日常生活的组成部分。根据数字、文化、媒体与体育部的数据，即使在新冠疫情导致的远程办公浪潮之前，九成成年人已经（有时甚至可以说）在线生活。我们以多种方式使用互联网来丰富和改变我们的生活。例如，数十亿人利用互联网免费学习兴趣爱好、正式教育，或提升职业前景。但这里有一个负面面：*“在错误的手中，互联网可以被用来传播恐怖主义和其他非法或有害内容”*\
  \ (DCMS: 2019)。\n\n这条政府警告在以下背景下显得尤为令人不安：互联网的接入正变得不再是自愿的。网络接入已被视为一种**存在主义的人权**，是公民身份和社会归属的前提。在某些司法管辖区，以及在某些公共安全事件情境（如疫情管理和军事宵禁）中，使用在线公共服务是联系公共部门支持并获取关键国家基础设施的**强制**手段。（许多公司和公共机构已完全取消客户电话线路和其他非正式支持渠道。）因此，喜欢与否，我们似乎都必须在线。\n\
  \n这种状态并不只适用于那些被认为更有生活经验和更具威胁辨识能力的成年人。在大多数发达工业经济体中，99%的 12 到 15 岁青少年也定期使用互联网。大多数情况下，孩子在网络空间中自由漫游，受限甚少。正如他们的长辈一样，他们几乎没有接受过任何网络安全意识培训。这种无忧无虑的网络自由的另一面如今显而易见。据英国和欧洲警方称，我们正目睹儿童在线极端化和因网络极端主义被起诉的创纪录数量（反恐警方：2021）。在**章节\
  \ 2 和 3** 以及其他地方——举几个例子——我们面临数字公民（未成年人或早期青少年）相关的网络安全脆弱性。正如经历行为性精神疾病的成年人一样，未发育完全的年轻大脑也面临额外风险：他们可能被吸引并陷入在线物理自残、公共骚乱和暴力的漩涡。\n\
  \n尽管各类有影响力的利益相关者（科技公司、政府、警方和学术界）进行了良好的干预，我们的计算机网络仍然充斥着易于获取的恐怖图像、煽动暴力的言论以及指导如何行动的\
  \ *how to* 视频，这些内容引导软弱和愤怒的人实施恐怖袭击。对于数十亿终端用户来说，这些生动的暴力材料通过社交网络站点以弹窗、短链接和预览视频的形式四处张贴。包括游戏论坛在内的社交媒体论坛，其月活跃用户规模可与世界上人口最多的国家或大洲相媲美。\n\
  \n因此，获取恐怖内容不需要大量的研究技能、技术能力或耐心。AI 驱动的搜索引擎提示、标签引导以及恐怖组织精心设计的数字营销策略相互结合，利用终端用户并针对心理上最易受影响的人群。在数百万可能看到弹窗图像或因好奇点击进入极端主义网站的用户中，只需极小的比例就足以让我们面临重大问题。因为几千次的浏览就可能转化为新一支恐怖组织的招募对象。正如**章节\
  \ 2 和 3** 所学，恐怖招募不仅限于阿尔卡迪亚（Al-Qaeda）和伊斯兰国（ISIS），新兴的恐怖网络在欧洲和美国——包括极右派及其青年黑客活动者——也在进行复制操作，并自豪地称自己为“generation\
  \ terror”。\n\n根据 Tech Against Terrorism（TAT），由大型科技公司组成的非政府组织（NGO）来协助反恐，该组织追踪了 2016\
  \ 至 2019 年间 45,000 个链接，这些链接指向大量托管恐怖材料的网站。这一数字仅是一个快照（即严重低估），该组织表示。约 330 个数字媒体平台被恐怖组织用于广播、通信和文件共享。其中一半为小型或微型平台（Tech\
  \ Against Terrorism: 2019）。尽管如此，在本书的研究跨度（2022–24）内，规模庞大且影响力更大的恐怖材料主要托管在超大型社交媒体平台上。因此，在**章节\
  \ 3** 中，我们深入探讨了几个最大社交媒体平台的作用。我们也证实并肯定了 TAT 的发现：恐怖活动人员和材料正迅速向匿名运行的去中心化网络（DWeb）迁移。尽管去中心化网络覆盖的受众远低于主流平台，恐怖组织仍倾向于在主流数字平台上进行标志性事件的通信，而在\
  \ DWeb 论坛中则用于小众讨论以及在政府或科技行业采取多轮下架行动后作为业务连续性的备选方案。\n\n同时，对于技术更熟练的用户，DWeb（我们在**章节\
  \ 3** 的后端部分有所覆盖）提供了一个技术游乐场，在这里可以尽情享受战争幻想和暗色行动。技术熟练的公民很容易迅速成为在线恐怖社区的重要组成部分，包括推动 **#online\
  \ jihad** 这一标签——该标签已不再局限于 ISIS 和 Al-Qaeda 的范畴。程序员和软件开发人员在为恐怖组织及其首脑执行核心技术任务、并构建专用平台（主要用于游戏和培训）时的吸引力和动力，已在无数去中心化编程论坛中显而易见。在更低的技术层面，在线恐怖支持者的任务往往包括协助构建\
  \ **click farms**（点击农场）和假社交媒体账户。更高级的技术支持则涉及程序员与软件工程师之间的协作，设计并分发用于直接网络攻击的恶意软件。亦或是更细微的需求，如协助技术窃听和监控（包括间谍软件注入和开发）、\
  \ **honeypot** 诱捕、甚至诱导敌人进入物理或在线 **honeytrap**。大多数技术恐怖分子在家工作，遵守办公时间，服从指令并线上协作。混合工作达到了其最恶劣的形式。\n\
  \n随着本书的研究进程推进，恐怖主义成因数据出现了明显的变化。虽然我们应保持谨慎，不在空中判断正在进行的模式分析，但似乎在北美、欧洲和大洋洲出现了政治动机恐怖事件的显著增加。根据全球恐怖指数（GTI），在\
  \ 2020 年代初，政治动机的恐怖袭击已超过宗教动机的袭击（Global Terrorism Index: 2022）。如果这一判断属实，则表明在大多数“西方半球”政治环境中，恐怖活动的摆动似乎已经略微回归——更偏向于与政策\
  \ rejection 而非宗教使命相关的政治极端主义。\n\n\n\n\n数据来自 Europol 和欧洲警方机构，也显示在西半球的大部分地区极端右翼恐怖主义活动有明显上升。伴随一种不祥的预感，本书的研究指向受政治驱动的国内恐怖分子——包括被激进化的儿童——被同一网络赋能的特征所引导进入恐怖主义，这些特征同样助长并维持了二十余年（且仍在继续）的圣战袭击。或许所有恐怖组织从\
  \ ISIS 所学到的核心课题，最好用《华盛顿邮报》的 **Joby Warwick** 来概括：“在新闻的**缩小**生命周期——正常新闻、突发新闻——中，事物往往会迅速消失。如果伊斯兰国家能将新闻周期延长至\
  \ 30 小时后才被关闭，他们就已取得成功”（Washington Post：2018）。\n\n此外，由于 Web 2.0 使内容生产民主化，任何终端用户都能发布视频材料，恐怖分子几乎可以完全规避媒体。纽约大学纽约分校的\
  \ Segal 教授指出：“今天任何人都可以成为记者 \\[. . .\\] 恐怖分子是记者，他们认识到自己能够生成新闻，也能够主导新闻议程 \\[. . .\\\
  ] 以一种旨在制造心理冲击的方式。”\n\nSegal 引用了 2008 年印度孟买的三天恐怖袭击作为关键新闻事件，指出恐怖分子发现通过攻击关键旅游中心的平民，可以显著影响大量视频观众的生活；那些观众发现自己无法从连续的暴行中转身（Vimeo：2015）。\n\
  \n在其论文 *ISIS and Innovative Propaganda* 中，数字媒体专家 Dylan Gerstel 观察到：“ISIS 的西方宣传针对那些与社会隔离、缺乏强烈身份认同或使命感的\
  \ 16-25 岁年轻人”（Gerstel：2016）。\n\n几年后，且在叙利亚及伊拉克的军事失败使其大幅削弱的情况下，总部位于华盛顿的恐怖主义监测服务机构\
  \ MEMRI 认为：“ISIS 媒体传播是**最重要的支持手段**”（MEMRI：2022b）。看似成功的网络战教训——直接使 ISIS 的招募力度远超阿尔卡伊达的有限影响力——似乎已被其他暴力极端组织研究并加以处理。这对公共安全意味着本书的范围之外。尽管如此，在\
  \ **第 2 章** 中，我们考察了主导的网络恐怖主义意识形态或在网络赋能领域的路线，这本书罕有的优势在于，公众舆论的法庭似乎已经在无可辩驳的情况下证明，技术公司和政策制定者必须交付更具实质性的成果才能有效应对网络恐怖主义。美国民意调查显示，公众将网络恐怖主义列为未来十年第三大最紧迫威胁——排在对中国军事力量的担忧或中东冲突之上（McCarthy\
  \ 2016；Norman 2018）。全书始终如一地提供对威胁本质的评论与指导，帮助个人、家庭和企业识别症状并采取行动！因此，**第 5 章**——我们的最后一章——专注于安全规划与事件响应。\n\
  \n最后，我们指向本书收尾页，提供按字母顺序的“关键组织与数字平台”引用列表、按字母顺序的“恐怖组织描述”列表、恐怖袭击在线摘要链接，以及本出版物所用术语的词汇表。我们还提供附录\
  \ E——摘自英国王室检察官办公室（CPS）——其中定义并描述了每种英国网络犯罪及其可依据的起诉立法。部分关键组织、平台和团体在首次出现时以 **粗体** 标记。\n\
  \n### **1.1 定义与标准**\n\n撰写时，尚无 universally accepted（普遍接受的）“网络恐怖主义”定义。对恐怖主义的定义在执法机构、政策制定者和学术界之间一直存在争议。根据美国\
  \ **FBI** 的定义，网络恐怖主义是任何*“预谋的、政治动机的针对信息、计算机系统、计算机程序和数据的袭击，导致对非战斗人员的暴力行为，由非国家团体或暗中行动者实施”*（[Dataconomy.com](http://Dataconomy.com)：2022）。英国地方当局也给出了具体定义。温特根议会（Wigan\
  \ Council）的网络团队将网络恐怖主义——也称为“数字恐怖主义”——概括为：“由被认可恐怖组织对计算机系统进行破坏性攻击，意在引发警报、恐慌，或导致信息系统的物理破坏。”该议会进一步指出，以下方式可被视为网络恐怖主义的潜在手段：“互联网可被恐怖分子用于为其行动筹资、培训其他恐怖分子以及策划恐怖袭击。更为主流的网络恐怖主义形式是入侵政府或私人服务器，窃取敏感信息或甚至窃取资金用于恐怖活动”（Wigan\
  \ Council：2023）。\n\n《2000 年反恐怖主义法案》将恐怖主义定义为以下行动或威胁之一：\n\n• 对人的严重暴力；\n\n• 对财产的严重损害；\n\
  \n• 危及他人生命（除实施者本人之外）；\n\n• 对公众健康或安全构成严重风险；\n\n• 设计用于严重干扰或破坏电子系统的行动。\n\n法案假设这些行动是为了影响政府、国际政府组织，或恐吓公众。要认定行为构成恐怖主义，该行动或威胁必须是为了推进政治、宗教、种族或意识形态的目的。被调查并起诉的行为可发生在英国境外。\n\
  \n\n\n\n使用或威胁使用上文所述的行动，涉及使用火器或爆炸物，即为恐怖主义，无论该行动是为了影响政府或国际政府组织，还是为了恐吓公众或公众的一部分（CPS:\
  \ 2023）。该法案也适用于支持和策划恐怖活动。根据由王室检察署（CPS）公开发布的恐怖主义指导原则：“值得注意的是，要定罪恐怖主义罪行，个人并不一定要实施可被视为恐怖袭击的行为。策划、协助甚至收集如何实施恐怖行为的信息，均属于英国恐怖主义立法所禁止的犯罪行为”（CPS:\
  \ 2023）。鉴于处理（或不处理）恐怖主义起诉所涉及的复杂性、重要性和高度安全要求，王室检察署设立了专门的重大犯罪与反恐怖主义分部（SCCTD）。该部门提供“向警察提供早期调查建议、作出起诉决定并起诉被指控犯罪的个人”（CPS:\
  \ 2023）。\n\n除了英国之外，（尽管伦敦是重要成员之一），由 57 个国家组成的安全与合作欧洲组织（OSCE）是一个国际组织，它在其辖区涵盖北美、欧洲和中亚的范围内，开展并支持种类繁多的冲突预防和反极端主义工作。多年前，在美、英、欧和俄境内发生大规模人员伤亡恐怖袭击之后，OSCE\
  \ 识别出“恐怖主义类型学”；这一类型非常有用，因为许多国家难以达成一致定义，导致正式的国际合作和指导发展变得困难。OSCE 及时推出的类型学汇集了各国共同认可的、定义恐怖行为的共性要素。该类型学表明，恐怖行为是：\n\
  \n• 有组织性的，无论组织规模大小；\n\n• 对人类生命、身体或财产构成危险；\n\n• 旨在有意破坏民主政府，特别是通过影响政策和立法者；\n\n• 以随机性为特征，并在人口中引发恐惧/恐怖情绪的蔓延（OSCE\
  \ 和 ODIHR: 2007）。\n\n英国和美国的政府分析人员和实践者一致认为，在策划阶段有四个关键指标指向将重大安全事件定义为“恐怖主义”事件：\n\n\
  1. 预先策划 – 在“冷血”状态下；\n\n2. 为实现政治变革而实施；\n\n3. 目标针对非战斗员/平民；\n\n4. 通常由小组（不一定是一个组织）完成。\n\
  \n（来源：美国中央情报局（CIA）的保罗·帕尔默（Paul Pillar）在 Bingley（2003）中引用。）\n\n在恐怖主义领域，顶尖学术研究者倾向于严格的定义、类型学和分类，因为这能让他们在明确的参数内开展研究。此类学者的恐怖主义定义也非常有用，因为它们规避了内部外交敏感性和政府对定义的偏好，这些偏好往往在内战或社会、种族冲突分化的地区被视为有偏见。因此，找到一个大多数各方都能接受的“恐怖主义”定义可能过于复杂或耗时。基于此，我们现在引入由顶尖学术专家（包括精神科医生\
  \ **杰罗尔德·波斯特**）提供的恐怖主义定义：\n\n*“预谋的、政治驱动的暴力——或对非战斗人员或财产的威胁——由次国家群体或隐蔽行动者实施，以影响、胁迫或恐吓超出攻击直接目标受众的观众”*\n\
  \n（Post, Ruby & Shaw, 2000）。\n\n在 criminal aggression（犯罪攻击）理论化以及群体身份与动态方面，领军研究者\
  \ **阿尔伯特·班杜拉（Albert Bandura）** 表示：“恐怖主义通常被定义为一种通过恐惧在公众中传播、以实现 desired outcomes（期望的结果）为目的的暴力策略”（Bandura:\
  \ 162）。获奖美国记者兼作家 **罗恩·萨斯金德（Ron Suskind）** 在其深刻的著作 *The One Per Cent Doctrine: Deep\
  \ Inside America’s Pursuit of its Enemies Since 9/11* 中写道：“人们会做出各种各样的事来让恐惧停止——所以制造恐惧是恐怖分子的目标”（Suskind:\
  \ 2006）。这种一些个人和群体为了胁迫和控制大规模受众的动机，部分解释了为何在技术行业相对未受监管的早期阶段，网络恐怖主义迅速且全能地在众多数字媒体平台上兴起。但这一难题也给国家政策制定者和顾问（以及组织领导者）带来了挑战性的智识领域：在其管辖范围内，政府应或应当干预甚至阻碍信息通信技术（ICT），这些技术作为中性数据包传输工具运作？\n\
  \n在许多国家，恐怖主义煽动和美化罪行已被制定，通常要求检察官在提出案件前承担相当高的举证责任。陪审团或法官只有在证据足以让被告的罪行“超出合理怀疑”的确定性时，才会定罪。基于通信工具和技术的罪行——主要依赖于被告的通信手段——极其难以公平证明，因而很少成功。值得回顾的是，这些法律的引入最初遭到政策制定者的强烈抵制，主要出于担心执法机构会陷入“思维”的监控，或因极端化（或精神健康问题）但非暴力的个人被起诉或入狱。尽管如此，民主社会——尤其是欧洲各国——普遍接受在反恐立法中引入和/或加强煽动与美化条款的必要性。\n\
  \n然而，网络恐怖主义的 perceived spread 如今迫使政策制定者、技术公司负责人和其他组织领导者讨论 ICT 入侵程度，以判断是否会进一步向大规模监控和干预能力倾斜。counter-terrorism\
  \ analysis 字段中出现的一个假设叫作“随机恐怖主义”（Stochastic terrorism），指代有影响力的媒体人物（包括政治领袖）公开妖魔化或诋毁他人，使得政治暴力可能被激发针对目标的行为。此类语言和修辞可能并未跨越\
  \ incitement laws（煽动法律）的法律阈值。技术手段可能包括贬低个人的玩笑、模糊或代码化的表述，或粗俗的“暗号”言论（例如，单独指名某人导致不受欢迎的政治结果）。这种修辞让施害者能够合理否认对任何具体结果的责任，从而在许多司法管辖区内不构成\
  \ incitement。例如，在英国和美国，法律上的 incitement 通常被理解为意在产生 *“imminent lawless action”*（Amman\
  \ and Meloy: 2022）。\n\n### 1.2 Laws and Regulations\n\n#### ***UK***\n\n\n\nThe\
  \ Terrorism Act of 2006 established offences that in effect relate to the government’s\
  \ ongoing ‘Prevent’ terrorism strategy. They include, in particular, the offence\
  \ of encouraging terrorism or disseminating publications that seek to encourage\
  \ political violence. Such offences of incitement to terrorism are sometimes known\
  \ as glorification offences. The legal framework for this provision is provided\
  \ by Sections 1 and 2 of the Terrorism Act 2006 (TACT), which create the offences\
  \ of encouragement of terrorism (s.1) and the dissemination of terrorist publications\
  \ (s.2). Section 3 of TACT provides that those served with notices who fail to remove,\
  \ without reasonable excuse, the material that is unlawful and terrorism-related\
  \ within a specified period, are treated as endorsing it. (HMG Prevent Strategy:\
  \ 2011: 77).\n\nThe Counter-Terrorism and Security Act 2015 determines that schools\
  \ and universities must help divert students from recruitment into terrorist groups,\
  \ as part of Prevent. Educators are expected to report students suspected of terrorist\
  \ or extremist sympathies to a local government body, and vet the remarks of visiting\
  \ speakers, among other obligations (Freedom House: 2022).\n\nThe Counter-Terrorism\
  \ and Border Security Act, which received royal assent in 2019, included provisions\
  \ related to online behaviour. Individuals can receive prison sentences of up to\
  \ 15 years for viewing and accessing material that is useful or likely to be useful\
  \ in preparing or committing a terrorist act. The law provides for exceptions for\
  \ journalists or academics who access such materials in the course of their work\
  \ but does not sufficiently explain other possible circumstances in which access\
  \ might be legitimate (Freedom House: 2023).\n\nThe Counter-Terrorism and Sentencing\
  \ Act (2021) has made provisions for jail sentences of up to 14 years for anyone\
  \ who *“supports a proscribed terrorist organisation”* (HMG Legislation: 2023).\
  \ In addition, the Act materially ends the likely prospect of early release for\
  \ anyone convicted of a serious terror offence and forces them to spend their whole\
  \ term in jail. The maximum penalty for membership of a proscribed terror organisation\
  \ increased from 10 to 14 years under this Act ([GOV.UK](http://GOV.UK): 2021).\n\
  \nA proposed Online Safety Bill, initially tabled before the Houses of Parliament\
  \ during 2021, still had not passed all the legislative committee stages at the\
  \ time of writing. Scuppered by internal political changes within the government,\
  \ as well as uncertainty as to the level of content intervention expected of Internet\
  \ service providers (ISPs), the bill’s proposals are sanctions-based. They include\
  \ giving power to Ofcom, the regulator, to fine online services the greater of £18\
  \ million or 10% of global turnover, if they do not comply with the bill’s provisions.\
  \ According to some reports, social media giants would be required to quickly remove\
  \ illegal content such as hate speech or *“face hefty penalties and even potential\
  \ criminal prosecutions for tech executives who fail to act”* (Politico: 2023).\n\
  \n**Draft Terrorism (Protection of Premises) Bill**: This proposed law is also known\
  \ as ‘Martyn’s Law’ in memory of Martyn Hett, one of 22 people killed in the 2017\
  \ Manchester Arena bombing attack conducted by a Manchester-born `Al-Qaeda` operative.\
  \ The subsequent formal inquest by `Sir John Saunders` found that several key aspects\
  \ of security planning, threat identification and incident response failed before,\
  \ during and after the attack. The proposed bill focuses mainly on mandating security\
  \ risk assessments and implementing basic security controls at publicly accessible\
  \ locations and/or events hosting more than one hundred people. The bill was lightly\
  \ criticised by the Home Affairs Select Committee in July 2023 for proposing requirements\
  \ that could potentially over-burden businesses, while not actually preventing further\
  \ mass casualty attacks. Whatever happens to this piece of legislation, the lessons\
  \ for cyber security risk managers are clear. Data owners should be aware that the\
  \ secure ownership, storage and distribution of personal data is a fundamental counter-terrorism\
  \ requirement (see CCTV case study later). Likewise, sensitive site security documents\
  \ (including site, evacuation incident response, crisis management and training\
  \ plans) must be kept securely and safely away from access by would-be terrorists\
  \ or witing and unwitting accomplices. Employee naivety in relation to publishing\
  \ very useful advance information, including site photos, staff and planning details\
  \ – is a recurring feature running throughout so many post-incident reports into\
  \ terrorism. Such data breaches and privacy indiscretions could come with real legal\
  \ sanctions if Martyn’s Law or other pieces of future counter-terrorism legislation\
  \ ever catch up with the cybersphere.\n\n**Case study: CCTV, data storage and the\
  \ law**\n\nProposed new counter-terrorism legislation potentially enacted by the\
  \ aforementioned `Draft Terrorism (Protection of Premises) Bill` is likely to enshrine\
  \ a `Protect Duty` whereby organisations must better plan for and secure their locations.\
  \ Within this law, organisational incident response policies and practices, including\
  \ expectations of training a cadre of counter-terrorism ‘competent persons’, are\
  \ all expected to become mandated. This proposed statute and variations of it are\
  \ being closely looked at by many other jurisdictions around the world. (Even if\
  \ the UK Premises Bill stalls, the following good practice can be considered `the\
  \ right thing to do`, as well as very much legally advisable!)\n\nOne of the key\
  \ challenges of countering cyber terrorism is understanding precisely how laws impacting\
  \ the physical security space will be implemented and operationalised, within any\
  \ business. Genetec’s Steve Green observes that gathering most digital evidence,\
  \ including CCTV images, was hitherto largely dependent upon *“manual processes\
  \ such as sharing footage on USB sticks or burning it to DVDs”*. Green advises that\
  \ *“the Cloud offers much better options for a faster, safer and more accountable\
  \ means of providing access to digital evidence”* (City Security Magazine: 2023:\
  \ 9). According to the National Counter Terrorism Office (NACTSO) guidance on Publicly\
  \ Accessible Locations, *“If an incident occurs, the [CCTV] images should be copied\
  \ onto removable media. A record should be kept of movement of the CD or CDR disk,\
  \ SD card, or other media showing an identification number, times, dates and names\
  \ of those handling the media. All used media should be destroyed or disposed of\
  \ securely”* (PALs Guidance: 2023).\n\nWhen deploying a surveillance camera system,\
  \ you must have a clear understanding of your organisation’s responsibilities under\
  \ data protection laws. The General Data Protection Regulation (GDPR or EU GDPR\
  \ across Europe) and the Data Protection Act 2018 are formal laws backed up by heavy\
  \ sanctions including significant fines and breaches that attract negative media\
  \ coverage. The Information Commissioner or equivalent offices in many other countries\
  \ have published detailed guidance on how to create data protection impact assessments\
  \ (DPIAs). If you are making decisions around capturing personal data captured as\
  \ a controller, or joint controllers, you are responsible for compliance with data\
  \ protection law, including the requirement to carry out a DPIA. It is recommended\
  \ that DPIAs are carried out when:\n\n• New systems are installed;\n\n• Cameras\
  \ are added or removed from systems;\n\n• Cameras are moved or change position;\n\
  \n• Whole or parts of systems are upgraded; and\n\n• Where systems that include\
  \ biometrics capabilities such as automatic facial recognition are in use.\n\n\n\
  \nDuring and after cyber terrorism events, organisations remain legally responsible\
  \ for data and privacy breaches within the UK, EU, USA and elsewhere. The fact that\
  \ an organisation and its staff suffered a severe shock (read ‘disruption’ in business\
  \ continuity parlance) does not reduce or remove this 24/7 legal obligation. Moreover,\
  \ following major security incidents, organisations and individuals – including\
  \ their electronic devices – caught up in the event are prone to attract unwanted\
  \ attention from all manner of hackers. There is also a likelihood that communications\
  \ data and all CCTV-related data could be seized or subpoenaed by investigative\
  \ agencies, regulatory bodies and/or formal inquests. Therefore, if CCTV or other\
  \ personally identifiable information (PII) is stored within Cloud services, do\
  \ ensure that strong security settings including `multifactor authentication (MFA)`,\
  \ firewalls, further backup solutions and decent encryption are consistently applied\
  \ in and around your Cloud. Cyber attacks on organisational Cloud storage backup\
  \ solutions, conducted by a mix of hostile state actors and pro-extremist hacktivist\
  \ groups, are exponentially rising.\n\n#### ***UK cyber crime laws***\n\n**Computer\
  \ Misuse Act (1990):** According to the government, `“`the Computer Misuse Act 1990\
  \ (CMA) is the main legislation that criminalises unauthorised access to computer\
  \ systems and data, and the damaging or destroying of these. The Act has the intention\
  \ of protecting the integrity and security of computer systems and data through\
  \ criminalising access to them which has not been authorised by the owner of the\
  \ system or data”` (Home Office: 2023a). In May 2021, the Home Secretary announced\
  \ a review of the CMA because law enforcement and industry felt that malicious acts\
  \ on computer systems, and areas necessary for effective incident response, were\
  \ not adequately addressed by the current laws. In some scenarios, cyber investigators\
  \ faced prosecution for unauthorised access into external computer systems. Proposed\
  \ areas for legal enhancement include: providing extra legal powers for authorities\
  \ or other agreed bodies to take down domain names and `IP addresses` used for clearly\
  \ criminal activity, the takeover of IP and domain names, powers to ensure data\
  \ preservation, unauthorised data copying becoming treated as ‘theft’, as well as\
  \ new powers to launch cyber investigations overseas (Home Office: 2023a).\n\n**Data\
  \ Protection Act (2018) – DPA:** UK only. Replaces the Data Protection Act (1998)\
  \ and incorporates the EU GDPR into British law. DPA installs the Information Commissioner’s\
  \ Office (ICO) as the enforcement authority. The 2018 Act establishes the importance\
  \ of organisations to be more *responsible* with personal data as well as to improve\
  \ and safeguard data *confidentiality*. Suspected data breaches must be reported\
  \ to the ICO within 72 hours and data subjects must be informed. DPA has seven parts,\
  \ including the processing of data by competent bodies and the intelligence services,\
  \ which falls beyond the GDPR.\n\nOne requirement under the DPA/GDPR is that an\
  \ organisation undertakes a `Data Protection Impact Assessment (DPIA)`: According\
  \ to the ICO, a DPIA is a process to help you identify and minimise the data protection\
  \ risks of a project. You must do a DPIA for processing personal data that is likely\
  \ to result in a high risk to individuals. Your DPIA must:\n\n• Describe the nature,\
  \ scope, context and purposes of the processing;\n\n• Assess necessity, proportionality\
  \ and compliance measures;\n\n• Identify and assess risks to individuals; and\n\n\
  • Identify any additional measures to mitigate those risks.\n\nA full list of all\
  \ cyber crime and prosecutor’s guidance is produced by the Crown Prosecution Service\
  \ (CPS). Some of these laws may be very useful for businesses and/or police forces\
  \ that could conduct investigations, or seek to make other forms of early interventions,\
  \ to prevent politically violent radicalisation or physical attacks. The online\
  \ guide covers areas ranging from online harassment, unlawful eavesdropping and\
  \ surveillance, economic crime and fraud, and cyber attacks, *inter alia*. The CPS’s\
  \ tabularised summary of all criminal laws related to cyber crime is provided in\
  \ this book’s Appendix E.\n\n#### ***US***\n\nThe First Amendment of the United\
  \ States Constitution determines that Congress makes no law respecting an establishment\
  \ of religion or prohibiting its free exercise. It protects freedom of speech, the\
  \ press, assembly, and the right to petition the government for a redress of grievances.\
  \ Thus, the US body politic has been cautious to regulate any form of freedom of\
  \ speech although the PATRIOT Act (described below) fundamentally shifted power\
  \ into Federal government security agencies and national law-enforcement forces.\n\
  \n**PATRIOT Act:** The `Uniting and Strengthening America by Providing Appropriate\
  \ Tools Required to Intercept and Obstruct Terrorism Act` became signed into law\
  \ during 2001 by President George W. Bush after the 9/11 terrorist atrocities and\
  \ subsequent anthrax attacks within the US. The legislation sought to bolster US\
  \ national security, particularly against foreign-related acts of terrorism. The\
  \ PATRIOT Act is expansive and wide-ranging, increasing surveillance (including\
  \ phone-tapping), easing interagency communications and increasing sentences for\
  \ terrorism-related offences.\n\nFor instance, Section 505 authorises government\
  \ agencies to seize financial, Internet, credit and telephone records without prior\
  \ judicial review and without articulable suspicion that the target is a terrorist\
  \ or a spy. Another area that strengthened powers for ICT monitoring was published\
  \ under Section 901. This section permits the US intelligence community head (CIA\
  \ director) to set `“requirements and priorities”` for domestic intelligence-gathering,\
  \ which could include domestic communications surveillance and monitoring (American\
  \ Civil Liberties Union: 2023).\n\nIn 2012, President Barack Obama signed the PATRIOT\
  \ Sunset Extensions Act into law, providing for roving wiretaps, business-record\
  \ searches and conducting surveillance on lone wolves. According to the US Office\
  \ of Justice Programmes: `“The Act also expands the list of situations in which\
  \ the Secret Service may participate in the investigation of computer crimes and\
  \ authorizes the U.S. Attorney General to establish regional computer forensic laboratories\
  \ to train Federal, State, and local law enforcement in investigating computer crimes”`.\
  \ More specifically for cyber-related concerns, including terrorism financing: `“the\
  \ [PATRIOT] Act expands the scope of key money laundering statutes; includes computer\
  \ fraud and abuse as part of the grounds for charges of terrorism; and modifies\
  \ the computer fraud statute, including permitting extraterritorial jurisdiction”`\
  \ (Office of Justice Programs: 2002).\n\n*US cyber crime laws*\n\n**Computer Fraud\
  \ and Abuse Act (CFAA):** Passed in 1984 as an amendment to the rather weak Comprehensive\
  \ Crime Control Act (1984). CFAA came from a strong concern that federal and other\
  \ governmental networks were being targeted by skilled hackers. Specifically, the\
  \ CFAA prohibits the following:\n\n• Knowingly accessing a computer without authorisation\
  \ to obtain national security or other government-restricted data.\n\n• Intentionally\
  \ accessing a computer without authorisation to obtain certain information from:\n\
  \no A financial institution or consumer reporting agency;\n\no The federal government;\
  \ or\n\no A protected computer.\n\n• Intentionally accessing and affecting the use\
  \ of a government computer.\n\n• Knowingly accessing a protected computer to defraud\
  \ and obtain anything of value.\n\n• Causing damages specified in the statute by\
  \ knowingly transmitting harmful items or intentionally accessing a protected computer.\n\
  \n• Knowingly trafficking in computer passwords.\n\n• Extortion involving threats\
  \ to damage a protected computer.\n\n\n\n\"在特定情况下\"法律专家表示，“CFAA 允许因受损的个人提起民事诉讼，要求赔偿或禁令救济”\
  \ (Thomson Reuters Practical Law 网站: 2023)。该法案的网络安全条款（在万维网出现前制定）曾多次进行修订和加强，包括通过《爱国者法案》。在计算机研究员埃伦·斯沃兹（Aaron\
  \ Swartz）自杀之后，一些美国立法者试图修改并限制某些 CFAA 条款，以避免其意外捕获大多数白帽或灰帽黑客的活动。埃伦·斯沃兹是一名电脑程序员和互联网活动家，联邦检察官对他提出了两项电信诈骗指控和十一项\
  \ CFAA 违规指控。由于他对减轻刑罚的和解协议被拒绝，斯沃兹于 2013 年自杀。\n\n**健康保险可携性与责任法案**（**HIPAA**）:** 1996\
  \ 年 8 月，克林顿总统签署了该法案。HIPAA 现代化了健康数据处理法律，以保护数据主体及医疗信息的传输。它规定了医疗行业和医疗保险行业在获取、存储和传播个人可识别信息（PII）时应如何防范欺诈和盗窃。对安全松懈和泄露负有责任的组织将面临罚款和制裁。\n\
  \n**北美电力可靠性公司关键基础设施保护（NERC CIP）:** 该行业合作组织最初于 1960 年代因担忧美国和加拿大的停电而成立。如今，它正全力协助成员防范网络恐怖主义。根据工业电力专家\
  \ Verve 的说法：“讨论制定行业网络安全标准的起始事件是 2001 年 9 月 11 日的恐怖袭击，这为该努力提供了更强的紧迫感” (Verve: 2022)。NERC\
  \ CIP 标准如今是强制性的网络安全标准，适用于所有拥有或管理加拿大和美国电力电网设施的实体。这些标准最初于 2008 年由联邦能源管理委员会（FERC）批准。根据\
  \ TechTarget 的 Rahul Awati 和 Ben Cole 的说法：“这些标准具有法规的约束力，即它们受法律约束[…]所有受 NERC CIP\
  \ 管辖的实体必须遵守这些标准” (TechTarget: 2023)。下图展示了 NERC CIP 的九条黄金规则，用于保障网络安全：\n\n![image](img/fig1.jpg)\n\
  \n**图 1：NERC 的九条规则¹**\n\n**联邦信息安全现代化法案（FISMA）:** S. 2521。该法案于 2014 年 12 月由奥巴马总统签署成为联邦法律。通常被称为\
  \ FISMA 改革，该立法是响应日益频繁且影响重大的网络攻击而通过的。FISMA 修改了现有法律，使联邦政府能够更有效应对部门和机构的网络攻击。\n\n**通信体面法案:**\
  \ 2021 年 1 月国会在华盛顿特区遭遇的袭击之后，我们或许正站在“社交媒体监管的新时代”之 reshold，哈佛商业评论专栏作家迪帕扬·高斯（Dipayan\
  \ Ghosh）2021 年认为。这一震惊美国乃至世界的事件导致七人死亡，140 名警察受伤。随后，社交媒体公司相对协调地下架了约 70,000 名 QAnon\
  \ 阴谋论者的社交媒体账户。科技公司迅速且争议性地行动：特朗普的 Twitter（现为 X）账号被关闭，Snapchat 对前总统实施了临时封锁。此外，YouTube\
  \ 移除了其认为违反社区准则的几条“煽动性”视频。Stripe 的在线支付平台也停止处理特朗普竞选网站的支付。\n\n自这次历史性事件以来，美国政府各高层人物及两院议员纷纷推动加强或废除《通信体面法案》（1996\
  \ 年）（CDA 1996）第 230 条。该条款赋予互联网服务提供商对用户生成内容免受责任（即免疫权）的保护，这些内容托管并传播于其平台上（高斯: 2021）。在美国及欧洲，包括谷歌、Twitter、AOL、Grindr\
  \ 和 Facebook 在内的 ISP 享有法律免疫权，相关案件均被驳回，尽管其服务器和服务传输了显然具有煽动性、危险性、明显为假或阴谋论的言论。\n\n**Force\
  \ v. Facebook Inc., 934 F.3d 53 (2nd Cir. 2019)** 第二巡回上诉法院的裁决指出，尽管专家证词表明：“越来越多的证据表明提供商设计算法推动用户向用户认同的内容和人物倾斜——他们做得太好，不断引导脆弱的人更深入黑暗道路”\
  \ (McCabe: 2021)。该案由以色列恐怖袭击受害者的家属和朋友在反恐法案下对 Facebook 提起，指控其协助恐怖分子协调活动。\n\n**(拟议)\
  \ 社交媒体儿童保护法:** 在撰写本文时，美国国会 2023-24 会议正在讨论通过立法：“要求社交媒体平台提供商禁止 16 岁以下的儿童访问此类平台，以及其他目的”\
  \ ([Congress.gov](http://Congress.gov): 2023)。若通过，该法案将极大程度上取代 1998 年《儿童在线隐私保护法》（COPPA），后者限制直接向未成年人营销并禁止在未获父母同意的情况下收集儿童个人数据。\n\
  \n#### ***欧洲与欧盟***\n\n在主要欧洲经济体中，虽然成功起诉科技公司高管的案例很少——这些案例涉及其系统和平台发布的言论或图像违反了刑事或诽谤法律——但这些例外案件的高昂上诉成本并未改变一种明显的政治/治理趋势：监管和责任的重心正从\
  \ ISP 和社交媒体平台转向其肩上。一个成功的案例是由业务领袖、前 CompuServe Germany 管理总裁费利克斯·索姆（Felix Somm）发起的。索姆因其服务器存储的内容被发现涉嫌侵犯儿童色情罪而受到指控。在\
  \ 1998 年的初审中，索姆被定罪并判处两年缓刑（Kuner 1998）。次年上诉时，他被无罪释放。在原案中，法官对“当技术防护不可能时，CompuServe\
  \ 将‘保护年轻人’置于‘maximizing profits’（maximizing profits）之上”这一技术辩护持不屑态度（Internet Archive\
  \ Wayback Machine: 2023）。法律解释可能变化莫测，对那些迟疑应对其网络上可能存在的非法活动的企业所有者和安全管理者可能产生毁灭性后果。\n\
  \n\n\n## EU 通用数据保护条例 (EU GDPR)\n\n2016 年由欧盟通过，2018 年起执行。GDPR 的关键组成部分是，用户必须从数据主体处获得\
  \ **知情同意**，才能使用该主体的数据。该规定适用于数据控制方（组织，无论其是否位于欧盟，负责收集有关自然人的信息）或处理方（代表数据控制方处理数据的组织，如云服务提供商），以及数据主体（个人）位于欧盟的情况。在特定情况下，该规定也适用于位于欧盟境外但收集或处理欧盟境内个人数据的组织。该规定不适用于为“纯粹个人或家庭活动”而进行的数据处理，即与专业或商业活动无关的活动。除欧盟外，多个非欧盟国家和地区（包括英国、加利福尼亚州（加州隐私权法案\
  \ CPRA）、土耳其、日本、肯尼亚、巴西、阿根廷和韩国）已通过类似或镜像立法。\n\n## 网络与信息系统指令 (NIS 2)\n\n欧盟内的关键基础设施应遵循\
  \ **网络与信息系统 (NIS) 2** 指令。该指令于 2022 年发布，取代了 2016 年的第一个 NIS 指令。NIS 2 对欧盟境内运行的信息系统施加了更严格的法律要求，通过引入网络安全风险管理措施和报告义务，对运营信息系统的组织提出更高的要求。除了要求组织实现\
  \ **安全态势** 的管理化水平，并应对供应链风险外，NIS 2 还将在新设的信息交换网络 **网络与信息系统合作小组** 中纳入 160,000 家组织。NIS\
  \ 2 旨在在七个对经济和关键基础设施至关重要的核心行业中营造 **“安全文化”**：银行、金融、数字、能源、医疗、交通和水（DataGuard：2023）。这体现了欧盟\
  \ 2020 年的整体 **网络安全战略**，该战略推动了欧盟统一 **网络弹性法案 (CRA)** 的提案。该法案于 2024 年由欧洲议会通过，旨在统一数字和软件开发规则，并设立\
  \ **“对产品整个生命周期负有注意义务”** 的义务（EU 网络弹性法案）。\n\n## 国际法\n\n### 欧洲委员会，布达佩斯公约 (2001)\n\n\
  该公约是第一个针对通过互联网和其他计算机网络犯罪的国际条约，特别涉及版权、电脑欺诈、儿童色情制品以及网络安全违规。公约还包含一系列权力和程序，如对计算机网络的搜索和拦截。公约的“打击网络犯罪”页面可在其官方网站上访问，相关链接在本书参考章节末尾提供。\n\
  \n### 联合国安理会决议 (SCR) 1624 (2005)\n\n呼吁成员国采取必要且适当的行动 **“禁止通过法律煽动恐怖行为并防止此类行为”**（UN\
  \ CTED：2021）。**UN SCR 2341** (2017) 再次确认，各国应在更广泛的反恐规划和责任范围内处理网络安全问题。**UN SCR 2354**\
  \ (2017) 设定了“全面国际框架”的指导方针，用于“开发反向叙事”以及“公私合作伙伴关系”，同时保障人权中的自由和隐私权。该决议及同年的其他决议是 **Tech\
  \ Against Terrorism** 和 **全球反恐网络 (GIFCT)** 成立的关键推动力，这两个组织由 Facebook、Microsoft、YouTube\
  \ 和 Twitter 于 2017 年创立。\n\n### UN SCR 2462 (2019)\n\n指出利用新兴的易获取且难以追溯的支付系统，包括众筹、虚拟资产（加密货币）以及手机托管交易。\n\
  \n### 1.3 恐怖心态与动机\n\n我们可以看到，定义恐怖主义有若干明确维度。 **Alex Schmid** 在 Case Western Reserve\
  \ University 提出的两个维度支持恐怖主义的定义：(1) 恐怖行为涉及对非战斗人员的袭击；(2) 犯罪者本身并不期望该行为能够实现其政治目标，而是为了影响目标受众、改变其行为，从而服务于恐怖分子的利益（Schmid：2004）。著名恐怖精神病学家\
  \ **Jerrold Post** 将亚洲恐怖主义者的政治动机划分为：\n\n1. 社会革命恐怖主义；\n2. 右翼恐怖主义；\n3. 民族主义-分离主义恐怖主义；\n\
  4. 宗教极端主义恐怖主义；以及\n5. 单一议题（如动物权利）恐怖主义。\n\n他指出，每种类型都倾向于与其特定的社会心理动力学相关（Post：1998）。本书的主要内容表明，自千禧年以来记录的最严重网络恐怖主义案例主要源自三个意识形态领域：**极端右翼恐怖主义、宗教狂热主义以及政治上动机的仇恨女性攻击**。\n\
  \n鉴于恐怖行为背后的原因和手段差异巨大，是否可以找出共性特征，为执法机构或更广泛的社会提供识别“正在酝酿的恐怖行为”的线索，甚至防止恐怖袭击的发生？在思考此问题时，请牢记恐怖心态和行为的起源始于单一、可识别的个人。实施恐怖行为，或实质性协助极端政治行动，是极不寻常的人类行为。事实上，冲击‑震慑式恐怖行为如此罕见，被一位心理学家形容为\
  \ **“类似致命鲨鱼袭击”**：极其残酷但极为罕见。\n\n平均每年有四到五千起重大恐怖袭击，分布在一百多个国家。自 **START** 全球恐怖主义数据库（位于美国马里兰州）于\
  \ 1970 年创建以来，已记录了约 20 万起事件（START GTD：2023）。鉴于此规模，心理社会理论家建议反恐情报分析师可以通过识别恐怖分子的人类特征或行为模式来进行分析。毕竟，数以\
  \ millions 计的政治激进者并不暴力。因此，是什么在个人心理中促使个体从激进或困扰的思想转变为实施恐怖行为？著名的反恐研究学者 **Hamm 和 Spaaj**\
  \ 认为 *“这种洞察可能为调查人员提供一种检测系统，或‘签名’——即使这些迹象看似微小——表明有恐怖意图的个人在为袭击做准备”*（Hamm, and Spaaj：2015）。另一位领先的学术研究者\
  \ **Jeff Victoroff** 表示 *“对心理子类别标记的建模改进，可能提升对恐怖行为的预测能力”*（Victoroff：2005）。前恐怖分子、英国政府特工\
  \ **Aimen Dean** 在其著作 *Nine Lives* 中评论了 **Al‑Qaeda** 对伊斯兰激进分子的吸引力：\n\n\n\n\n-  \
  \ [费曼学习法](https://wiki.example.org/feynmans_learning_method)的灵感源于诺贝尔物理奖获得者**Richard\
  \ Feynman**。\n\n1.  运用费曼技巧，你只需花上`20 min`就能深入理解知识点，而且记忆深刻，*难以遗忘*。\n\n```\nif (condVar\
  \ > someVal) {console.log(\"xxx\")}\n```\n[/content]\n\n[content]\n-   [我来自不同背景的圣战者]，我对他们为何聚集在阿尔卡伊达的训练营中产生了浓厚兴趣。有些人在多年思考与辩论后才相信在“圣战”中，有些人——往往心理上更不稳定——几乎在一夜之间被极端化，可能是对某种成瘾的反应，或是为了弥补某些可怕罪行而寻求赎罪。他们正在逃离内心的恶魔，或逃离平庸无趣的生活。还有其他人被布道者告知他们是“需要”的人：像无助的鱼一样，被银舌的伊玛目勾引、吸引。每个人的经历各不相同，但他们都有一个共同的目标：成为烈士[…]\
  \ 有些战斗者之间流淌着血 lust[…]”（Dean: 2018: 112）。\n\n大量学术与政府研究已经丰富——或可能使——我们对恐怖主义实施者的了解更为深入。包括`Martha\
  \ Crenshaw`在内的顶级恐怖主义分析师认为，总体而言，恐怖分子倾向于理性思考、遵循逻辑过程，以一种生活策略为导向。在支持与实施极端主义的行为中，恐怖分子遵循理性的战略选择以实现目标（Crenshaw:\
  \ 1998）。Crenshaw 观察到“恐怖主义可能遵循可被发现和解释的逻辑过程”（Crenshaw: 1998: 7）。恐怖分子的行为更多是一种自愿的选择，而非心理或社会因素的\
  \ unintended outcome：“恐怖主义并非某种心理力量，而是出于政治与战略目的，组织有意识地选择使用暴力，而非作为心理或社会因素的意外结果”（Crenshaw:\
  \ 1998: 7–8）。\n\n同样，在 9/11 之后对被定罪的圣战主义恐怖分子的研究，`Marc Sageman`（美国资深情报分析员兼长期从事心理学家）发现，阿尔卡伊达及埃及伊斯兰圣战恐怖分子的社会或心理背景几乎没有线索表明其心理状态异常。事实上，Sageman\
  \ 对 172 名被定罪恐怖分子的样本中，几乎没有记录到儿童时期的创伤或“受伤的自我”抱怨。受伤的自我假说与“自恋性伤害”相关，指主体贬低并攻击他人，同时拥有夸大其词的自我重要感。Sageman\
  \ 的研究似乎表明，理性选择理论主要解释了在圣战网络中被极端化的恐怖分子的心理社会路径（Sageman: 2017）。\n\n然而，超出圣战领域，且在数字媒体革命之前，一些具备心理研究背景的恐怖主义分析师能够在研究对象中识别出更为明显的心理社会特征，这表明这些模式——即便未形成确定结论——揭示了潜在的心理行为驱动因素，值得进一步研究。例如，1980\
  \ 年代西德内政部的恐怖主义心理学研究主要聚焦于极左派红色军团（Red Army Faction）激进分子。研究人员分析了约 227 名被定罪的犯罪者，样本量在恐怖主义心理学研究中具有重要历史意义。研究发现，受试者普遍经历严重的父母关系破裂、性别认同冲突、大学中途退学率高以及对武器的痴迷（Jager,\
  \ Schmidtchen and Sullwold: 1981）。`Jerrold Post` 也在其研究中记录到，许多暴力极端分子具有可识别的性格障碍。\n\
  \n有趣的是，其他数字化研究对恐怖分子人格的调查显示出更为明确的心理社会特征模式。`Ferracuti and Bruno` 对 1970 年代至 1980 年代意大利极右派政治极端主义的广泛研究，样本量达\
  \ 908 名被定罪恐怖分子。汇总这些研究后，精神科医生兼神经科医师 `Jeff Victoroff` 指出以下人格特质和特征在犯罪者中普遍存在：\n\n1.\
  \ 对权威的两难态度。  \n2. 认知缺陷。  \n3. 遵守规范。  \n4. 对自己行为后果情感上格外疏离。  \n5. 性角色的不确定性。  \n6.\
  \ 魔法式思维。  \n7. 毁灭性。  \n8. 教育水平低。  \n9. 遵从暴力亚文化规范及武器痴迷。（Victoroff: 2005）\n\n类似的人格特征也在当代许多仇恨与恐怖谋杀案的法庭证据、量刑听证会以及假释委员会的审议中被引用。例如，在显著的恐怖分子——如`David\
  \ Copeland`（1999）、`Anders Breivik`（2011）、`Thomas Mair`（2016）、`Brenton Harrison Tarrant`（2019）以及其他将在本书“极右翼”章节中详细列出的人物——中，常见的心理状态与\
  \ Ferracuti 与 Bruno 的发现高度契合。对表现出明显心理极端行为、以及在线参与主流恐怖主义原因和实体的个体进行更频繁、更具侵入性的研究与干预，可能是国家和地方司法部门应对未来网络恐怖主义的最具目的性的改变之一，因为目前可以看到，全球各地的防范计划缺乏资源与实质性手段。根据法医精神科医生`Gwen\
  \ Adshead`的说法，当社会条件成熟且人格缺陷相匹配时，“自行车锁”组合效应可能会触发绝望的、往往是最终的、爆炸性的暴力行为（Adshead and Horne:\
  \ 2022）。\n\n在线识别潜在实施者的另一个复杂因素是所谓的“独狼”行为者的技术能力：他们能够隐藏自身身份、加密并防火墙通信，使得支持或同情他们的群体难以监测。根据\
  \ Hamm 与 Spaaj 对自 9/11 以来美国独狼恐怖分子的系统研究：“每四名独狼恐怖分子中，有四成表现出对极端组织的亲和力，但这种亲和力是例外——独狼恐怖分子正变得日益独立。这种变化的根本在于技术。随着\
  \ Internet 聊天室、阴谋网站、Facebook 与 Twitter 的兴起，在线活动人士能够将对无人机袭击、全球政府、甚至美国即将实施的戒严状态等议题感兴趣的分散个体聚合在一起，并告诉他们‘你并不孤单’。此外，网络亲和是导致极端化的重要因素”（Hamm\
  \ and Spaaj: 2015: 11）。虽然有针对干预的线索，但往往来得太迟：“76% 的人曾公开他们的意图，往往不止一次。这些公开行为通过电子邮件、短信、Facebook\
  \ 帖子、Twitter 摘要、PowerPoint 演示文稿和播客传播”（Hamm and Spaaj: 2015: 9）。\n\n在本节结束前，值得指出的是\
  \ 2015 年市场研究公司 Quantum 发布的一份极具价值的恐怖分子心态概览。该公司在 ISIS 在该地区巅峰期间，对 49 名在叙利亚作战（及叛逃）的\
  \ ISIS 战士进行电视访谈。Quantum 的内容分析研究与另外两大关于 ISIS 战士心态的重要贡献相吻合——分别是 Stern 与 Berger 所著的《ISIS:\
  \ The State of Terror》以及 Evans、Milton 与 Young 对 4,000 名战士背景的系统学术研究（Stern and Berger:\
  \ 2015）（Oxford University Press: 2020）。下面的案例研究概括了主要发现。\n\n**案例研究：为什么加入 ISIS？**\n\
  \nQuantum Communications (2015) 识别出加入 ISIS 的九大主要动机：\n\n• **地位追求者**：“他们 intent on\
  \ improving “their social standing” these people are driven primarily by money “and\
  \ a certain recognition by others around them.””\n\n\n\n\n• **身份寻求者**：*“容易感到孤立或疏离，这些人‘常常在陌生/难以理解的环境中感到像个\
  \ outsider，并试图与另一个群体认同。’伊斯兰为许多这些人提供‘一种预包装的跨国身份。’”*\n\n• **复仇寻求者**：*“他们认为自己是一个被社区或其他人压迫的群体的一部分。”*\n\
  \n• **救赎寻求者**：*“他们加入伊斯兰恐怖组织（ISIS），因为他们认为这为他们自我辩护或弥补过去的罪恶提供了依据。”*\n\n• **责任寻求者**：*“基本上，人们加入或支持伊斯兰恐怖组织，因为它为其家庭提供某种物质或金钱支持。”*\n\
  \n• **刺激寻求者**：*“为了冒险加入伊斯兰恐怖组织。”*\n\n• **意识形态寻求者**：*“这些人希望将他们对伊斯兰的看法强加给他人。”*\n\n\
  • **正义寻求者**：*“他们响应自己所感知的不公正。‘正义寻求者的‘存在理由’在感知到的不公正停止后就不复存在，’报告指出。”*\n\n• **死亡寻求者**：*“这些人‘很可能在其一生中经历了重大的创伤/损失，并认为死亡是唯一的出路，以获得殉道者的声誉，而不是自杀者。’”*\n\
