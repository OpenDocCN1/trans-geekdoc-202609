  \ A neat set of summaries, guidance and reporting lines can be found at the FBI’s\
  \ cyber centre website, link below:\n\n**Website:** *[`www.fbi.gov/investigate/cyber`](https://www.fbi.gov/investigate/cyber)*.\n\
  • **GitHub Security:** GitHub of old is a Cloud-based service for software development\
  \ and version control using Git., enabling developers to collaborate, store and\
  \ manage their code. Acquired by Microsoft in 2018, GitHub hosts open source software\
  \ development projects for 100 million developers worldwide.\n\n**Website:** *[`github.com/security`](https://github.com/security)*.\n\
  **Twitter:** *[`Twitter.com/github`](https://Twitter.com/github)*.\n• **Global Internet\
  \ Forum to Counter Terrorism (GIFCT):** GIFCT’s mission is to serve as an NGO designed\
  \ to prevent terrorists and violent extremists from exploiting digital platforms.\
  \ Founded by Facebook, Microsoft, Twitter and YouTube in 2017, the forum was established\
  \ to *“foster technical collaboration among member companies, advance relevant research,*\
  \ *and share knowledge with smaller platforms”.* (GIFCT: 2023).\n\nThe GIFCT launched\
  \ a **Content Incident Protocol (CIP)** in 2019 and now acts as a hub to share hashed\
  \ content used by terrorists.\n\n**Website:** *[`gifct.org/about/`](https://gifct.org/about/)*.\n\
  **Content Incident Protocol:** *[`gifct.org/content-incident-protocol/`](https://gifct.org/content-incident-protocol/)*.\n\
  • **Global Partnership on Artificial Intelligence (GPIA):** Launched in 2020 following\
  \ a G7 summit, GPIA is an emerging powerhouse behind policy debate and driving forward\
  \ discussions on “Responsible AI”. The coalition (to date) including 29 national\
  \ governments, researchers and tech leaders, are, hopefully, increasingly moving\
  \ towards turning words into action. One workstream titled ‘Optimising social media\
  \ recommender systems for a socially positive outcome’ seems to be the place to\
  \ address counter-terrorism but it’s early days. Initiatives and updates can be\
  \ found at:\n\n**Website:** *[`gpai.ai/`](https://gpai.ai/)*.\n• **Google YouTube:**\
  \ For more information about Google YouTube security initiatives, check out its\
  \ reporting at the following portal: *[`transparencyreport.google.com/youtube-policy/featured-policies/violent-extremism?hl=en`](https://transparencyreport.google.com/youtube-policy/featured-policies/violent-extremism?hl=en)*.\n\
  • **Incels and misogynist violent extremism:** A superb insight and overview captured\
  \ by documentary maker Ben Zand in UNTOLD: *The Secret World of Incels*. Channel\
  \ 4 Documentaries. (Length: 47.15). Published: 07/11/2022. Accessed and downloaded\
  \ on 06/06/2023 at: *[`www.youtube.com/watch?v=kReeoKoOvZI`](https://www.youtube.com/watch?v=kReeoKoOvZI)*.\n\
  \nA list of some prominent incidents and an explanation of why many experts feel\
  \ misogyny should be formally acknowledged as an *“animating ideology for acts of\
  \ mass violence in comparison to recognition of other ideologies”* can be found\
  \ on: Wikipedia at: *[`en.wikipedia.org/wiki/Misogynist_terrorism`](https://en.wikipedia.org/wiki/Misogynist_terrorism)*.\n\
  \n• ***InfoSecurity Magazine*:** Probably the most generalist, comprehensive website\
  \ for cyber security professionals and well worth subscribing to the weekly bulletins\
  \ if you are a non-technical security risk manager too. Events, podcasts, white\
  \ papers and a company directory available online too.\n\n**Website:** *[`www.infosecurity-magazine.com/`](https://www.infosecurity-magazine.com/)*.\n\
  **Twitter (now X):** *[`Twitter.com/InfosecurityMag`](https://Twitter.com/InfosecurityMag)*.\n\
  • **Information Systems Security Association (ISSA):** US-based association with\
  \ a global reach of cyber security professionals. According to ISSA’s mission statement:\
  \ “*ISSA is a nonprofit organization for the information security profession committed\
  \ to promoting effective cyber security on a global basis.*”\n\n*Being a respected\
  \ forum for networking and collaboration.*\n\n*Providing education and knowledge\
  \ sharing at all career lifecycle stages.*\n\n*Being a highly regarded voice of\
  \ information security that influences public opinion, government legislation,*\
  \ *education and technology with objective expertise that supports sound decision-making*”\
  \ (ISSA: 2023).\n\n**Website:** *[`www.issa.org/`](https://www.issa.org/)*.\n• **International\
  \ Centre for Counter Terrorism (ICCT):** Headquartered in The Hague, Netherlands,\
  \ the ICCT is an independent think-and-do tank providing multidisciplinary policy\
  \ advice and practical support focused on prevention, the rule of law and current\
  \ and emerging threats – three important parts of effective counter-terrorism work.\
  \ ICCT’s work stretches internationally, and focuses on countering violent extremism,\
  \ criminal justice sector responses, and human rights related aspects of counter-terrorism.\n\
  \n**Website:** *[`www.icct.nl/`](https://www.icct.nl/)*.\n\n\n\n• International\
  \ Organization for Standardization (ISO). Headquartered in Geneva, Switzerland,\
  \ the ISO is an international standard development organisation composed of representatives\
  \ from the national standards organisations of member countries. For more information\
  \ on the ISO/IEC 27000 series of standards go to: `https://www.iso.org/standard/27001`.\n\
  \nA proposed ISO international standard (ISO/IEC: 27090) – `Cybersecurity Artificial\
  \ Intelligence: Guidance for addressing security threats to artificial intelligence\
  \ systems` – is presently being drafted and due for release in 2025 (ISO website:\
  \ 2023).\n\nFor more information on computer incident response and ISO 27035: 2020-2023:\
  \ `https://www.iso27001security.com/html/27035.html`.\n\n• **JihadoScope:** Monitors\
  \ jihadist activity across the web and social media. Tweets are in English and French.\
  \ It is open to direct messaging. The website is a work in progress but JS’s Twitter\
  \ feed carries lots of up-to-date, relevant snippets and reports for security and\
  \ organisational resilience people.\n\n**Twitter (now X):** `https://Twitter.com/JihadoScope`.\n\
  \n• **Middle East Media Research Institute (MEMRI):** According to the institute’s\
  \ website, MEMRI explores *“the Middle East and South Asia through their media,\
  \ MEMRI bridges the language gap between the West and the Middle East and South\
  \ Asia, providing timely translations of Arabic, Farsi, Urdu-Pashtu, Dari, Turkish,\
  \ Russian, and Chinese media, as well as original analysis of political, ideological,\
  \ intellectual, social, cultural, and religious trends. Founded in February 1998\
  \ to inform the debate over U.S. policy in the Middle East, MEMRI is an independent,\
  \ nonpartisan, nonprofit, 501(c)3 organization. MEMRI’s main office is located in\
  \ Washington, DC, with branch offices in various world capitals”.* Its full news\
  \ article service is subscription based.\n\nMEMRI’s Cyber Terrorism and Jihad Lab\
  \ can be accessed at:\n\n**Website:** `https://www.memri.org/cjlab`.\n\n**Twitter\
  \ (now X):** `https://Twitter.com/MEMRIReports?ref_src=twsrc%5Egoogle%7Ctwcamp%5Eserp%7Ctwgr%5Eauthor`.\n\
  \nSince MEMRI’s cyber terrorism and jihad lab monitoring service began, dozens of\
  \ their in-house research articles have explained just how terrorists are targeting\
  \ humanity via broadcasts hosted on YouTube. Just a small sample can be found at\
  \ the following “Testing YouTube’s Terrorism-Flagging Feature” link: `https://www.memri.org/cjlab/categories/testing-youtubes-terrorism-promoting-flagging-feature`.\n\
  \n• **MITRE ATT&CK®:** Based in Virginia, US, MITRE describes itself as a *“globally-accessible\
  \ knowledge base of adversary tactics and techniques based on real-world observations”.*\
  \ At the time of writing, the website’s front page provided a comprehensive *“attack\
  \ matrix for enterprise”* that identifies the ten techniques used for hostile reconnaissance.\
  \ MITRE’s attack blog covers incisive, up-to-date vulnerabilities across the most\
  \ widely used enterprise operating systems (OS) and popular mobile products.\n\n\
  **Website:** `http://attack.mitre.org/`.\n\n**Attack blog:** `https://medium.com/mitre-attack`.\n\
  \n**Twitter (now X):** `https://Twitter.com/MITREattack`.\n\n• **National Cyber\
  \ Security Centre, Ireland (NCSC IE):** Founded in 2011. Useful for a weekly media\
  \ summary of cyber incidents and stories from around the world. The NCSC is, in\
  \ its own words, *“responsible for advising and informing Government IT and Critical\
  \ National Infrastructure providers of current threats and vulnerabilities associated\
  \ with network information security”.* The website front page provides an incident\
  \ report link.\n\n**Website:** `https://www.ncsc.gov.ie/`.\n\n**Twitter (now X):**\
  \ `https://Twitter.com/ncsc_gov_ie`.\n\n• **National Cyber Security Centre UK (NCSC):**\
  \ The UK government’s cyber security centre was established to protect UK businesses\
  \ from cyber attacks as well as to advise on technical security standards. NCSC’s\
  \ Cyber Security Toolkit for Boards includes a good range of basic-level advice\
  \ from conducting risk assessments to sample scripts and considerations for board\
  \ meetings, available in its ‘Tool Box’ link.\n\n**Website:** `https://www.ncsc.gov.uk/collection/board-toolkit`.\n\
  \nThe latest NCSC threat reports can be found or signposted at the following website\
  \ URL: `https://www.ncsc.gov.uk/section/keep-up-to-date/threat-reports?q=&defaultTypes=report&sort=date%2Bdesc`.\n\
  \n• **National Institute of Standards and Technology (NIST):** NIST’s mission is\
  \ to *“promote U.S. innovation and industrial competitiveness by advancing measurement\
  \ science, standards, and technology in ways that enhance economic security and\
  \ improve our quality of life”.* NIST states that its core competencies are “measurement\
  \ science, rigorous traceability”, and the *“development and use of standards”*\
  \ (NIST: 2022).\n\nThe NIST SP-800 series reports on the IT laboratory research\
  \ at NIST and its guidelines. All SP-800 series reports can be accessed at:\n\n\
  `https://csrc.nist.gov/publications/sp800`.\n\nAll SP computer security guidance,\
  \ including draft publications, can be found at the NIST Computer Security Resource\
  \ Center, accessed at:\n\n`https://csrc.nist.gov/publications/sp#800-94`.\n\n• **Open\
  \ Worldwide Application Security Project (OWASP):** In its own words, OWASP is a\
  \ “vendor-neutral”, independent *“nonprofit foundation that works to improve the\
  \ security of software”.* OWASP runs more than 250 chapters worldwide and boasts\
  \ tens of thousands of members.\n\n**Website:** `https://owasp.org/`.\n\n**Twitter:**\
  \ `https://Twitter.com/owasp`.\n\n• **Pool Re:** Born out of businesses suffering\
  \ large and often irretrievable financial losses during ‘The Troubles’ in the UK\
  \ and Northern Ireland, Pool Re was established with UK government support, and\
  \ soon became the UK’s leading terrorism reinsurer. Pool Re’s mission is to *“provide\
  \ financial protection from the impact of terrorism, and in so doing, improve the\
  \ UK’s resilience”.* Pool Re’s Vulnerability Self-Assessment Tool (VSAT) is their\
  \ free-to-use security risk management assessment tool that “*helps organisations\
  \ to benchmark their risk maturity against UK best practice for terrorism mitigation*”\
  \ (Pool Re: 2023). Pool Re’s VSAT can be accessed and completed at:\n\n**Website:**\
  \ `https://www.poolre.co.uk/vsat/`.\n\n• **Reddit and ‘subreddits’:** According\
  \ to digital marketing guru Neal Schaffer, *“Reddit is a social network where registered\
  \ members can vote \\[upon\\] content and discuss them. It is made up of millions\
  \ of collective niche forums or groups called Subreddits. To put it differently,\
  \ Reddit is a social platform comprised of subreddits”.* Subreddits are *“a powerful\
  \ network of niche communities that collectively define reddit”* says Schaffer.\
  \ Reddit’s monthly active users have spiralled since 2020 from around 613 million\
  \ people to a projected 2.3 billion for 2024, making it one of our planet’s most\
  \ popular digital media platforms (bankmycell.com: 2023). Reddit is headquartered\
  \ in San Francisco, California.\n\n**Corporate website:** `https://www.redditinc.com/`.\n\
  \n\n\n**Moderator Code of Conduct URL:** `https://www.redditinc.com/policies/moderator-code-of-conduct`.\n\
  \n• **SANS Institute:** 通常被称为“SANS”的营利性组织的全称是 SysAdmin、Audit、Network 和 Security。该学院赞助“SANS\
  \ Storm Center”——一个互联网监控系统，以及“SANS Reading Room”——一个研究档案和信息安全政策支持中心。访问网站和社交媒体账号以订阅非常有用的简报：\n\
  \n**Website:** `https://www.sans.org/uk_en/`。\n\n**Twitter (now X):** `https://Twitter.com/SANSInstitute`。\n\
  \n**Twitter for Storm Center:** `https://Twitter.com/sans_isc`。\n\n• **START:**\
  \ 由马里兰大学管理，START 运营全球恐怖主义数据库（GTD）。GTD 是一个开源数据库，包含 1970 年至 2020 年期间全球恐怖主义事件的信息，之后每年均有更新。\n\
  \n**Website:** `https://www.start.umd.edu/gtd/`。\n\n• **Tech Against Terrorism (TAT):**\
  \ TAT 代表联合国反恐怖主义专员公署（CTED），致力于帮助全球科技行业应对恐怖分子对其技术的利用。TAT 还成立以支持较小的科技公司，提供最佳实践指导，以保护其用户和声誉。\n\
  \n`https://www.techagainstterrorism.org/`。\n\n• **The Cyber Security Hub:**\n\n\
  一个非常全面、更新及时且信息丰富的 Twitter 账号，引用一个极简的 Linktree 网站。\n\n**Website:** `https://linktr.ee/thecybersecurityhub`。\n\
  \n**Twitter (now X):** `https://Twitter.com/thecybersechub?lang=en`。\n\n• ***The\
  \ Hacker News*:** 一个受欢迎的网络出版物，专注于突发的网络安全和黑客新闻，为信息安全专业人士提供见解和分析。\n\n**Website:**\
  \ `https://thehackernews.com/`。\n\n**Twitter (now X):** `https://Twitter.com/TheHackersNews`。\n\
  \n• **West Point Combating Terrorism Center (CTC).** 位于著名的军事学院，**Combating Terrorism\
  \ Center at West Point** *“是一个面向客观研究恐怖主义及相关政策的国家资源”*。CTC 发行每月的 *CTC Sentinel*，这是一本高质量的期刊，汇集了该中心庞大的国际学者和实践者网络，发表学术论文。\n\
  \n**Website:** `http://www.ctc.westpoint.edu/`。\n\n**Twitter (now X):** `https://Twitter.com/CTCWP`。\n\
  \n• **Al-Qaeda (AQ):** 约于 1988 年在巴基斯坦普什图尔省成立，AQ 是一支逊尼派泛伊斯兰恐怖组织，自称为宗教军事精英，其使命是加速穆斯林世界统一并建立全球哈里发（Klausen:\
  \ 2021）。随后与一些埃及伊斯兰主义领袖合并，AQ 至少在 9/11 事件发生前一直保持强大的中央指挥结构（AQ Central）。随后，AQ 促成并/或支持了阿拉伯半岛（AQAP）、伊拉克（AQI）和伊斯兰安第斯（AQIM）等强大的地区指挥机构的形成。2010\
  \ 年代被 ISIS 取代后，AQ 成为西方世界最具杀伤力的恐怖威胁之一，但其在欧洲和美国的直接袭击次数明显减少。2015 年 1 月，法国讽刺杂志 *Charlie\
  \ Hebdo* 的 11 名员工和一名警察被两名兄弟杀害，随后该地区出现多起围攻和袭击，使 AQ 再次成为国际新闻焦点。其最近一位领袖阿曼·阿尔-扎哈维（Ayman\
  \ Al-Zawahiri）据称于 2022 年在卡布尔被美国无人机袭击身亡。\n\n• **Ansar Allah Movement（the Houthis）:**\
  \ 总部位于也门。这是一个伊斯兰主义武装政治组织，领导推翻前也门总统、美国和沙特支持的前任总统 **Ali Abdullah Saleh** 的政府。胡塞运动主要由\
  \ Zaidi 什叶派组成，但在实际行动中常常容忍或协调也门半岛的基地组织（AQAP）的行动。该组织对美国、以色列及其盟友持极度敌意，并重复使用“死亡到美国”等与其他伊朗支持的武装组织相似的口号。人权监督机构多次发现胡塞战士对平民区进行炮击，并使用童兵（Human\
  \ Rights Watch: 2015）。\n\n• **Aryan Brotherhood (AB):** AB 最初是一家位于加利福尼亚的监狱帮派，成立于\
  \ 1960 年代的加利福尼亚监狱系统。目前，AB 在美国各州形成多个网络和分支（美国司法部：2012）。根据法院文件，AB 原本主要负责保护白人囚犯并维护白人至上主义和种族隔离。随着时间的推移，AB\
  \ 将其犯罪企业扩展到盈利性非法活动。许多活动家推动政治运动并招募远右派、白人至上主义者及相关人士。\n\n• **Aryan Nations (AN):**\
  \ 根据 [Encyclopedia.com](http://Encyclopedia.com)，AN *“作为一个准军事仇恨组织，是美国最主要且活跃的白人至上主义和反犹太组织”*。该组织位于爱达荷州，主张\
  \ *“建立一个仅限白人的国家，排除所有其他种族”*（Encyclopedia.com: 2023）。\n\n• **Aum Shinrikyo (Supreme\
  \ Truth):** Aum Shinrikyo 的终极目标是通过美国与日本之间的核战争引发全球末日，以此净化世界。该教派希望通过军事政变控制日本政府和武装部队。这套末世论宗教运动在\
  \ 2000 年改名为 “Aleph”，由神秘教主阿萨哈拉·尚科（Asahara Shoko，原名 Matsumoto Chizuo）领导。阿萨哈拉及其六名同伙在\
  \ 2018 年被判处死刑并执行（Atkins and McKay）。\n\n• **Feuerkrieg Division group (FKD):** 根据英国反恐怖主义警察中心的说明，“*FKD\
  \ 是一个小型的国际新纳粹组织，遵循白人至上主义意识形态，并倡导‘加速主义’——即通过暴力和恐怖行为加速种族战争，导致现有社会和政治体系崩溃”*。FKD 是 2020\
  \ 年英国第三个被列为非法的新纳粹组织，其通过在线发布白人至上主义暴力宣传，常利用社交媒体平台针对 13 至 25 岁的年轻人（Counter Terrorism\
  \ Policing: 2020）。\n\n• **Hamas:** “伊斯兰抵抗运动”是一支巴勒斯坦逊尼派伊斯兰原教旨主义政治和军事组织。其军事部门称为 “Izz\
  \ ad-Din al-Qassam Brigades”，政治部门则是加沙地带的事实上统治当局。Hamas 在当代时期参与了大量致命恐怖袭击和反叛乱行动，并与土耳其和卡塔尔建立了联系。自\
  \ 2012 年起，Hamas 开展了有效的网络战行动。该组织成立于 1987 年，其章程呼吁取代以色列建立一个伊斯兰巴勒斯坦国家，并拒绝所有巴勒斯坦解放组织（PLO）与以色列之间的协议。Hamas\
  \ 的力量主要集中在加沙地带及西岸地区（美国国家情报总监：2014）。\n\n\n\n\n• **真主党：** 根据美国国家情报总监局（DNI）的说法，真主党成立于\
  \ 1982 年，是一个以什叶派为主的政治组织，并进行恐怖活动。美国 DNI 引用了 1980 年代和 1990 年代对美国军队、政府及平民人员的大规模伤亡袭击和绑架事件。以色列的利益——尤其是军队、政府和定居者——被视为主要威胁目标。美国海军陆战队\
  \ 1983 年的炸弹袭击、1985 年 TWA 847 的劫机事件以及 1996 年沙特阿拉伯的卡布尔大厦袭击是真主党武装单位四十年武装行动时间线的一部分。真主党的主要国家赞助者是伊朗和叙利亚（DNI\
  \ 网站：2023）。\n\n• **ISIS：** 成立于 2013 年。伊斯兰国，也被称为伊拉克和黎凡特伊斯兰国、叙利亚伊拉克伊斯兰国，以及阿拉伯缩写 Da‘ish\
  \ 或 Daesh，是一个跨国逊尼派伊斯兰恐怖组织，遵循逊尼派伊斯兰主义的 Salafi 派分支。其创始人和领袖伊布拉欣·阿瓦德·伊布拉欣·阿尔-巴德里，常被称为阿布巴克尔·本·拉登，是一名出生于伊拉克的神学家，成为了世界上最臭名昭著的恐怖主义领袖。巴德利据说在\
  \ 2019 年在美方部队逼近时，通过自杀炸弹自杀并杀死了自己的孩子。他的第二号人物、叙利亚裔塔哈·苏比·法拉哈，即阿布·穆罕默德·阿尔-阿德纳尼·阿尔-尚，于\
  \ 2016 年被（据报道）俄罗斯或联合国联合空袭击毙，具体取决于所读的新闻报道。\n\n• **库克兰克会（KKK）：** 通常缩写为 KKK 或“the Klan”，是美国历史上及当前若干白人至上主义、反移民仇恨组织的统称。自\
  \ 1860 年代美国内战时期创立以来，这个秘密的成员组织一直实施基于种族的谋杀和爆炸，针对大多数非白人美国族裔群体，以及左派人士、无神论者和堕胎提供者。许多\
  \ Klan 团体至今仍然活跃并通过公开网站招募成员。截至 2016 年，反诽谤联盟（ADL）将 Klan 的总人数估计为 3,000 人（Levin: 2003）（Anti-Defamation\
  \ League: 2016）。一个在肯塔基州出现的分支机构名为“Elders Blood-NBlood Out Knights”（EBBOK），其网站宣扬新纳粹作战策略：“我们是一个基督教仇恨组织。我们是与众不同的组织。我们接受所有纳粹和白人兄弟（sic）加入，因为我们持有相同的信念。”同年，另外两个类似的\
  \ Klan 团体也成立：密歇根州阿尔佩纳的“大湖骑士”和华盛顿州斯波坎的“太平洋海岸骑士”（ADL: 2016）。\n\n• **耶路撒冷地区的穆贾希德沙拉委员会（MSCEJ）：**\
  \ MSCEJ 隶属于西奈半岛的基地组织。其思维方式为 Salafist Jihad，该组织认为对犹太平民的暴力是宗教义务，能够让其追随者更接近上帝。MSCEJ\
  \ 并非与之前的“穆贾希德沙拉委员会”（约 2006 年，由六个恐怖组织组成的联盟）相同，后者主要充当伊拉克伊斯兰国的组织委员会，试图协调并为对美领导联盟的叛乱提供资源。MSCEJ\
  \ 主要在加沙地带，并对埃及西奈半岛以及争议地区以色列/巴勒斯坦的境内进行反以色列行动（Long War Journal: 2012）。\n\n• **国家行动（NA）：**\
  \ 成立于 2013 年，总部位于英国温切斯特，NA 成为英格兰首个根据《恐怖主义法》（2000）被列为恐怖组织的新纳粹团体；该定性发生在 2016 年。据英国内政部称：“该组织的在线宣传材料，通过社交媒体传播，经常包含极其暴力的画面和语言。国家行动还在\
  \ Jo Cox 被谋杀后宣传和鼓励恐怖行为”（Home Office: 2016）。\n\n• **国家打击部队：** 是“阿亚恩打击部队”（ASF）的分支，ASF\
  \ 是一支主要活动于英国的团体，致力于对穆斯林和犹太人等群体进行攻击。其追随者通常是阅读《我的奋斗》的希特勒拥护者，信奉白人种族至上主义，并主张在本国实行种族隔离政策。其领袖因在\
  \ 2010 年于纽卡斯尔王家法院制造化学武器（鼠疫素）而被监禁。ASF 主要通过线上动员维持约 3 至 400 名成员（Reuters: 2010）。\n\n\
  • **西伯恩解放军（SLA）：** SLA 被美国执法机构普遍认为是历史上第一个与政治左翼相关的国内恐怖组织。该组织主要活动于 1973 至 1975 年加州，谋杀了一名黑人警察局长，并实施了绑架和银行抢劫，声称是为了实现其政治纲领（Caldwell,\
  \ *New York Times*: 1974）。\n\n• **4chan：** 2003 年作为一类以图片为重点的聊天论坛——即“图片板”——诞生。4chan\
  \ 专注于图片的发布，通常伴随文字和讨论。该平台设有涵盖多种主题的讨论板，主要为非政治性内容。由于无需注册，用户普遍匿名发帖，这使得研究人员将其描述为亚文化和前卫话题的中心。一些分析师认为\
  \ 4chan 的用户自我监管效果良好，最极端的用户通过公开发帖将自己暴露于调查之中（Trammell: 2014）。\n\n• **8kun：** 2013\
  \ 年成立，原名 8chan、Infinitechan 或 Infinitychan，后改名为 8kun，是一类由用户创建的图片论坛。每个版块由版主管理，站点管理员介入极少。该平台的核心理念是自由言论和用户匿名性，因而吸引了暴力和极端主义者。计划或实施攻击的个人或团体往往希望公开自己和其立场，同时避免大型数字媒体平台的检测与限制。根据\
  \ BBC 报道：尽管该站拥有数百个话题区域，但它最臭名昭著的仍是“/pol/”板块，即“政治不正确”缩写。该板块曾是反女权主义运动“GamerGate”背后的活动者的重要聚集地，并后来孕育了\
  \ QAnon——一种受部分支持特朗普总统的选民欢迎的阴谋理论（BBC 网站: 2019）。该平台本身并未摆脱此声誉。其首页标志醒目地写着：“Welcome to\
  \ 8chan, the Darkest Reaches of the Internet”。也许对 8chan 最贴切的描述来自 Bellingcat 记者罗伯特·埃文斯的话：8chan\
  \ 是一个包含多个讨论组的大型网站，涵盖从动漫到左翼政治的各类话题。/pol/是其中活跃度最高的版块，最好被描述为极端在线新纳粹的聚集地。该版块的总体目标是 radicalize\
  \ their fellow anons to “real-life effortposting”，即在现实世界中实施暴力行为。这一目标在 4 月 2019 年鲍伊\
  \ Synagogue（犹太教寺庙）枪击事件的讨论中得到了体现（Bellingcat: 2019）。\n\n• **非对称战争：** 指双方军事力量差距巨大的战争，通常采用非传统武器和战术，如游击战和恐怖袭击所使用的手段（Merriam-Webster）。\n\
  \n\n\n\n- **刷单**：在线诈骗，通常由营销人员实施，以提升其网站的声誉和评级。根据记者 Marty McCarthy 的报道，该诈骗在新冠疫情期间因远程办公而蔓延。McCarthy\
  \ 写道：“刷单是指人们从在线市场（如 Amazon）收到廉价、未经请求的包裹。实际的卖家——发送该物品的个人或公司——通常是第三方，利用这些网站出售其产品 […]\
  \ 第三方卖家会写一条假的五星评价，声称他们刚刚‘卖出’并寄给你的商品，并以你的名字作为作者”（McCarthy: 2020）。\n\n- **钓鱼**：是指创建一个假的、具有吸引力的在线身份，用于诱骗受害者进行尴尬行为，并捕获他们的行踪和数据。攻击者的伪造账户保持活跃且可信，假身份加入用户组并发布鼓励互动的更新。\n\
  \n- **德国基督教民主联盟 (CDU)**：是现代德国（以及以前的西德）两大主流国家政党之一，属于中间偏右的大众党组织。其前领导人包括前总理安格拉·默克尔和赫尔穆特·科尔，CDU\
  \ 自二战后以来在赢得全国大选方面一直是最成功的政党。\n\n- **点击农场**：点击农场是一种误导行为，大量雇佣者被雇来点击付费广告链接，以供点击欺诈者（点击农场主或点击农场）使用。工人点击链接、浏览目标网站一段时间，可能订阅新闻\
  \ letters，然后再点击另一个链接（Munson: 2007）。点击农场产生的假点赞与机器人生成的点赞本质上不同，后者是由软件专家编写的程序实现的。\n\n\
  - **化合物**：当两种或多种原子结合并以固定比例形成一起时，它们形成化合物。\n\n- **凭证填充**：英国国家网络安全中心表示，“凭证填充利用人们在不同账户之间重复使用用户名和密码组合的习惯。攻击者通过欺诈性获取某站点的有效组合，并将其在其他站点上使用，从而访问合法账户。主要动机是经济利益，但可能导致身份盗用”。\n\
  \n来源： *[`www.ncsc.gov.uk/pdfs/news/use-credential-stuffing-tools.pdf`](https://www.ncsc.gov.uk/pdfs/news/use-credential-stuffing-tools.pdf)*。\n\
  \n- **网络安全态势**：‘态势’指整体的准备程度和应对安全威胁及风险的能力。根据网络安全公司 *Bitsight* 的说法，你的态势可能在进行最新安全风险评估后几小时内就低下且与时俱进。*“管理网络安全态势需要对数字生态系统内的风险与威胁以及专门应对它们的安全程序的性能保持清晰（且持续）的可见性”，*Bitsight\
  \ 网站团队写道（Bitsight: 2023）。\n\n- **网络威胁情报 (CTI)**：根据英国央行，CTI 是基于知识、技能和经验的信息，涉及对网络和实体威胁及威胁行为体的发生与评估，旨在帮助缓解\
  \ cyberspace 中的潜在攻击和有害事件（Bank of England: 2016）。\n\n- **数据抓取**：一种技术，程序从另一个程序的可读输出（通常规模较大）中提取数据。\n\
  \n- **虚假信息**：指有明确意图误导或欺骗人们的错误信息（Dictionary.com）。\n\n- **混乱**：主要供游戏玩家使用，混乱是一个在线语音通话和即时通信平台。公司成立于\
  \ 2015 年，该流行聊天应用程序支持约 30 种书面语言，拥有约 1.5 亿月活跃用户和 3.5 亿账户（Metro: 2022）。\n\n- **假旗行动**：据\
  \ BBC 表示，假旗行动是一种政治或军事行动，意在将责任归咎于对手。各国经常通过在自身侧策划真实或模拟攻击并指责敌人发动，以此作为开战的借口。\n\n- **GDPR**：一般数据保护条例是欧盟法律中关于数据保护和隐私的规定，适用于欧盟及欧洲经济区的所有公民及其个人数据，无论数据位于欧盟境内还是境外。\n\
  \n- **哈瓦拉**：波斯语 ‘Havaleh’。指一种基于信任与荣誉的可靠网络 —  — 哈瓦拉人（金融中介），通过信任体系进行非现金转账，现金不一定实际交换。哈瓦拉系统在亚洲和伊斯兰社区中仍然流行。\n\
  \n- **健康保险可携性与责任法案 (1996) – HIPAA**：仅美国适用。HIPAA 是一项联邦法律，要求制定国家标准以在未经患者同意或知情的情况下防止敏感患者健康信息泄露。英国的等效数据保护由\
  \ GDPR 和《数据保护法》(2018) 覆盖。\n\n- **蜜罐**：根据安全公司 Kaspersky，蜜罐 *“看起来像真实的计算机系统，包含应用程序和数据，诱骗网络犯罪分子认为它是合法目标。例如，蜜罐可能模拟公司的客户账单系统\
  \ —  — 这是攻击者常见的目标，他们希望窃取信用卡号”*（Kaspersky: 2023）。\n\n- **物联网 (IoT)**：根据计算机技术公司 Oracle，“物联网描述的是嵌入传感器、软件和其他技术的物理‘物’的网络，用于通过互联网与其他设备和系统连接并交换数据。这些设备从普通家居物品到高端工业工具不等”。\n\
  \n来源： *[`www.oracle.com/uk/internet-of-things/what-is-iot/`](https://www.oracle.com/uk/internet-of-things/what-is-iot/)*。\n\
  \n- **IP 地址**：互联网服务提供商（ISP）或网络管理员分配 IP 地址。该地址与 TCP/IP 协议相关，用于标识网络中连接的设备。\n\n- **越狱（或\
  \ Root 化）**：这两个术语都指移除设备制造商有意设置的软件安全限制的过程。此操作打开了电子设备的‘后门’，允许安装软件 —  — 可能用于窃听、操控或窃取数据。\n\
  \n- **KYC**：‘了解客户’ —  — 供应商为验证潜在客户或服务用户的身份、合法性和适宜性而进行的尽职调查。\n\n- **MAC 地址**：媒体访问控制（MAC）地址是硬件标识符，唯一标识网络上的每个设备。\n\
  \n- **误导信息**：未经意或有意传播的错误信息，无论其是否旨在误导。\n\n- **多因素认证 (MFA)**：MFA *是一种需要用户提供两个或更多验证因子才能访问系统的用户身份验证方法。额外的安全层降低了成功网络攻击的可能性。*\n\
  \n\n\n• **支付卡行业数据安全标准 (PCI DSS)**：是一套广泛接受的政策和程序，旨在增强信用卡、借记卡和现金卡交易的安全性，保护卡 holder\
  \ 免受金钱和个人数据被盗。该标准最初于 2004 年由四大国际信用卡公司自愿制定，如今在英国、美国及许多发达国家，遵守部分或全部最新标准已成为强制性要求。\n\
  \n• **Pinterest**：2010 年成立，总部位于旧金山，Pinterest 是一款图片分享社交媒体平台，帮助用户在拼贴板上上传图片和视频等内容。截至\
  \ 2023 年 4 月，该平台拥有超过 4.6 亿的国际月活跃用户（来源：CNBC 2023）。\n\n• **提示工程 (Prompt engineering)**：指用户精心改写向\
  \ AI 聊天机器人提问的方式。提示工程也可以被滥用，绕过聊天机器人的内容审核限制（如 ChatGPT），从而生成潜在有害的内容。\n\n• **QAnon**：一种阴谋论及一个日益发展、形态模糊的在线政治运动，主张美国被一群极左倾的撒旦崇拜者接管，他们利用权力进行性犯罪和财务腐败（Crossley:\
  \ 2021）。许多 QAnon 追随者参与了 2021 年国会山骚乱。\n\n• **证券化 (Securitisation)**：公共部门机构倾向于将新兴的社会风险视为需要通过风险缓解策略和日益以安全控制为导向的措施来“管理”的现象。随着时间推移，这一过程推动了社区和社会的证券化（除非该过程被其他影响者和决策者成功挑战和反制）。\n\
  \n• **Snapchat**：2011 年成立，总部位于加利福尼亚州圣莫尼卡，Snap（口语）是一款图片分享社交媒体应用。Snapchat 拥有 7.5 亿的月活跃用户（来源：TechCrunch\
  \ 2023）。最初设计用于私人好友之间的照片分享（照片会在一定时间后消失），功能丰富，包括视频分发和实时视频聊天。\n\n• **Steam**：2003 年成立，总部位于华盛顿州贝尔维尤，Steam\
  \ 是 Valve（美国公司）旗下的电子游戏数字分发平台和商店。客户端功能包括直接消息、云存储和游戏叠加。Steam 全球运营，支持 28 种语言，美国目录中已有超过\
  \ 5 万款游戏。截至 2023 年，Steam 拥有超过 1.2 亿的月活跃用户，自 2020 年以来增长了 30%（来源：backlinko.com 2023）。\n\
  \n• **隐写术 (Steganography)**：根据网络安全公司 Kaspersky 的说法，“隐写术是将信息隐藏在另一条消息或实物中以避免被发现的做法。隐写术可以用来隐藏几乎任何类型的数字内容，包括文本、图片、视频或音频。随后在目的地提取隐藏的数据。”\n\
  \n• **合成媒体 (Synthetic media)**：根据 AI 专家 Synthesia 的描述，媒体内容（文本、图片、声音、视频）“完全或部分是使用人工智能生成的”。合成媒体在数字世界中由\
  \ AI 算法开发，而非合成媒体则由人在物理环境中创作（Synthesia Media: 2023）。\n\n• **威胁与漏洞评估或审查 (TVA/TVR)**：TVA/TVR\
  \ 可以以多种方式撰写，通常以明确定义威胁、漏洞（弱点）、发生可能性以及对组织潜在影响的表格或矩阵形式呈现。表格可能还包含安全控制（缓解措施）一列。可能性和影响通常以\
  \ 1 到 5 的分数评级，1 表示极低，5 表示极高。\n\n• **Twitch**：2011 年作为[Justin.TV](http://Justin.TV)的衍生项目成立，Twitch\
  \ 是一个面向大众的直播频道。它是美国的实时流媒体服务，专注于视频游戏直播，同时提供电竞、实时体育和音乐“现场”广播。Twitch Interactive 于\
  \ 2014 年被 Amazon 收购。与 YouTube 及其他视频流媒体网站一样，拥有大量粉丝的主播可以通过订阅（当时为 50%）获得收入。2020 年，在德国哈勒恐怖袭击之后，Twitch\
  \ 成立了安全咨询委员会。截至 2023 年，Twitch 拥有 1.4 千万的活跃月用户，每月有 800 万名唯一的主播提供内容（Demandsage.com:\
  \ 2023）。\n\n• **wiper 恶意软件**：wiper 是一种由攻击者部署的恶意软件，通常只有一个目标：在无法恢复的情况下擦除用户数据。部署 wiper\
  \ 恶意软件时，攻击者往往会通过留下错误的取证痕迹来掩盖其数字痕迹，例如复杂的掩护层和/或“伪旗帜”线索。\n\n\n\n\n• Amman, M and Meloy,\
  \ R (2022). “煽动暴力与随机恐怖主义：供研究人员和调查人员参考的法律、学术和实践参数”. `Terrorism and Political Violence`.\
  \ 19/12/2022. 访问并下载于 2024 年 02 月 08 日: `https://www.tandfonline.com/doi/abs/10.1080/09546553.2022.2143352`.\n\
