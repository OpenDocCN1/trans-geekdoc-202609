  \n-   包括威胁识别和适当的网络防御措施，如防火墙、网络监控、数字媒体过滤和可接受使用政策，都能帮助企业防止和阻止访问极端主义网站及其提供商。但让尽可能多的员工了解恐怖主义威胁是产生最有效应对措施的关键。根据英国反恐警方的说法，向“与你亲近的人”报告“这是一件难做的事”。然而，“每年数千份公众报告帮助警方打击恐怖主义威胁。如果你看到或听到一些不太对劲的情况，相信你的直觉，并通过[gov.uk/ACT](http://gov.uk/ACT)向警方保密举报”（Counter\
