    # 实验与反思


    调整提示词以加深理解并探索 AI 的能力。


    ## 本章强化学习的提示词


    - **提示词 1：** “用教孩子用闪卡认动物的类比来解释监督学习。”

    - **提示词 2：** “监督学习、无监督学习和强化学习有什么区别？请为每种提供现实生活中的例子。”

    - **提示词 3：** “决策树是如何工作的？用在杂货店做决定的类比来解释。”

    - **提示词 4：** “什么是支持向量机（SVM），它是如何对数据进行分类的？用在地图上划定边界的隐喻来解释。”

    - **提示词 5：** “为什么数据清洗在机器学习中很重要？用为食谱准备食材的例子来解释。”

    - **提示词 6：** “描述如何使用归一化和标准化来预处理数据。为什么这些步骤至关重要？”

