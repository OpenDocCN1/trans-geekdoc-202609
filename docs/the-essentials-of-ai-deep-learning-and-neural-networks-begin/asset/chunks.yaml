    # 第 3 章：使用 Keras 和 TensorFlow 进行深度学习


    在使用这些工具构建模型时，首先在 `Keras` 中定义架构。这涉及指定层及其连接方式，类似于为建筑绘制蓝图。`Keras` 凭借其直观的 API 简化了这一过程，只需极少的代码即可堆叠层、配置神经元并选择激活函数。架构就绪后，`TensorFlow`
    登场，支持实现超出标准功能的自定义操作。您可能需要实现专用算法或优化特定计算，`TensorFlow` 的灵活性可无缝支持这些高级操作。`Keras` 的简洁性与
    `TensorFlow` 的深度相结合，使您能够创建既创新又高效的复杂模型。


    为增强模型能力，可考虑采用 `dropout` 等正则化技术。`Dropout` 在训练过程中随机“丢弃”（即忽略）神经元，防止模型过度拟合训练数据，从而防止过拟合。该技术引入了一定的随机性，确保模型保持通用性和鲁棒性。此外，使用
    `callbacks` 可在训练期间动态调优模型。`Callbacks` 允许您监控训练过程并即时调整，例如在模型不再改进时提前停止，或保存检查点以便后续重新训练。这些功能提供了可显著提升模型性能和可靠性的控制力和适应性。


    实战项目是发挥 `Keras` 和 `TensorFlow` 能力的绝佳途径。经典示例是构建卷积神经网络进行图像分类。借助 `Keras`，您可以快速组装一个能识别图像模式的模型，无论是识别照片中的动物还是分析卫星图像。`TensorFlow`
    的强大功能确保该模型能扩展以处理大型数据集，并以准确性和速度提供预测。另一个令人兴奋的项目是开发基于 Transformer 的语言翻译模型。通过利用预训练模型并使用
    `TensorFlow` 进行微调，您可以创建一个能在语言之间流畅且具有上下文理解地翻译文本的系统。这些项目不仅展示了工具的潜力，还提供了解决现实挑战的实践经验。


    在本章结束时，您已探索了 `Keras` 和 `TensorFlow` 这一强大组合，它们弥合了深度学习中简易性与复杂性之间的鸿沟。这些工具让您能够快速原型设计、高效扩展、精细微调，使复杂模型的创建变得人人可及。掌握这些技能后，您已做好充分准备，步入一个
    AI 重塑未来的世界，准备好创新并解决曾被认为不可能的问题。接下来，我们将探索实际应用与行业影响——理论与现实的交汇点。


    ## 3.6 AI 实战：探索深度学习架构


    ### 高效练习指南


    - 访问 `ChatGPT`：访问 [`chatgpt.com`](https://chatgpt.com)，如有需要请创建免费账户。

    - 使用提示词：输入提示词，对其进行修改并实验，以查看不同的响应。

    - 评估响应：根据您所学知识检查其清晰度和相关性。

    - 实验与反思：调整提示词以加深理解并探索 AI 的能力。


    ### 本节强化学习的提示词


    - **提示词 1：** “用扫描照片寻找模式的隐喻，解释 CNN 中的卷积层如何从图像中提取特征。”

    - **提示词 2：** “RNN、LSTM 和 GRU 有什么区别？用短期记忆和长期记忆的隐喻来解释。”

    - **提示词 3：** “Transformer 中的自注意力机制是如何工作的？用在派对上专注于关键对话的类比来解释。”

    - **提示词 4：** “什么是 Transformer 中的位置编码，为什么它很重要？用句子中排列单词的隐喻来解释。”

