    # 第 3 章：深度学习架构


    眺望大海常唤起无限可能的感觉。每一拍打海岸的浪花都提醒着我们尚未探索的深度，我们可以用同样的方式思考技术。大海是深度学习架构的领域，卷积神经网络（`CNNs`）是其中最强大的洋流之一。`CNNs`
    是图像识别的骨干，将像素转化为模式，将模式转化为预测。与传统算法不同，`CNNs` 不只是将图像作为一个整体来看待；它们将其剖析为碎片，就像侦探在犯罪现场检查每一个细节一样。`CNNs`
    的魔力在于它们通过层来学习和提取特征的能力，每一层都在细化图像，直到网络能够理解它。


