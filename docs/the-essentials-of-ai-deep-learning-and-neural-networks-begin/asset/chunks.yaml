- raw: '●     Recurrent neural networks (RNNs): A type of neural network designed
    to handle sequential data, where each input influences the next, making it ideal
    for tasks like time series forecasting or language processing.


    ●     Transformers: Advanced deep learning models that use self-attention mechanisms
    to process data and capture complex relationships within sequences.


    ●     Autoencoders: Unsupervised learning models that compress input data and
    then decode it back to its original representation.


    Chapter 4: Practical Applications and Industry Impact


    ●     AI-driven diagnostics: The use of artificial intelligence to analyze medical
    images, detecting issues more quickly and accurately than humans can.


    ●     Predictive analytics: Using AI to analyze data and predict future events,
    such as health risks or financial trends, before they occur.


    ●     AI-powered automation: The use of AI in robots and machines to carry out
    tasks, such as delivery or surgery, without human intervention.


    Chapter 5: Data Analysis and Visualization


    ●     Imputation: The process of filling in missing data with estimated values,
    typically based on statistical methods or available information from other data
    points.


    ●     Normalization: A data transformation technique that adjusts the scale of
    features so that no single variable dominates the model’s learning process, often
    by rescaling the data to a common range.


    ●     Exploratory data analysis (EDA): The process of analyzing and summarizing
    a dataset’s characteristics using statistical graphics, plots, and information
    tables to uncover patterns, anomalies, and relationships within the data.


    ●     Correlation matrix: A table or heatmap that displays the relationship between
    multiple variables, showing the strength and direction of correlations to aid
    in feature selection and model design.


    Chapter 6: Ethical Considerations and Responsible AI


    ●     Algorithmic bias: The systematic and repeated errors embedded in AI algorithms
    due to biased data, which leads to unfair outcomes that disadvantage certain demographic
    groups.


    ●     Explainability: The practice of making AI systems'' decision-making processes
    transparent, understandable, and trustworthy to humans. This involves providing
    clear explanations for how and why decisions are made.


    Chapter 7: Enhancing Skills With AI Toolkits


    ●     TensorFlow: A comprehensive framework for machine learning, featuring TensorFlow
    Hub for pretrained models and TensorFlow Extended (TFX) for deployment.


    ●     PyTorch: A machine learning library based on the Torch library. It offers
    flexibility with dynamic computation graphs, making it suitable for research and
    experimentation.


    ●     Keras: An open-source library for implementing neural networks. It offers
    experimentation, hyperparameter tuning, and real-time model adjustments through
    callbacks.


    Chapter 8: Project-Based Learning and Real-World Applications


    ●     Sentiment analysis: A branch of natural language processing (NLP) focused
    on categorizing emotions and opinions within text data, useful for understanding
    public sentiment and customer feedback.


    ●     Image classification system: A machine learning model that categorizes images
    into predefined classes based on their visual features.


    ●     Recommender system: A system that suggests products, content, or services
    to users based on their past behavior or preferences.


    Chapter 9: Career Advancement and Community Engagement


    ●     GitHub: A collaborative software platform that allows developers to create,
    store, and share their code.


    Chapter 10: Advanced Topics and Future Trends


    ●     Evaluation metrics: Quantitative measures used to assess the performance
    and accuracy of a machine learning model or algorithm, helping determine how well
    it meets specific objectives.


    ●     Hyperparameter tuning: The process of adjusting the hyperparameters (settings
    that control the learning process) of a machine learning model to optimize its
    performance.


    ●     Generative adversarial network (GAN): An AI model that consists of two neural
    networks—a generator and a discriminator—that work in opposition to create realistic
    outputs.


