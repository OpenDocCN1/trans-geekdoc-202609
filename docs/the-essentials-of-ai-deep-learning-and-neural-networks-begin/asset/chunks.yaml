  trans: '

    # AI 中的可信度：可靠性、安全性与伦理


    您会将个人数据、财务决策甚至人身安全托付给 AI 系统吗？什么样的系统才配得上这种信任？从根本上说，AI 的可信度取决于三个关键组成部分：可靠性、安全性和伦理。可靠性确保
    AI 系统能够持续且准确地执行任务，提供用户可依赖的可靠结果。另一方面，安全性保护 AI 应用中的数据和流程免遭泄露和滥用，在数据隐私至关重要的时代提供了一座坚固的保护堡垒。伦理将反映社会规范和价值观的原则注入
    AI 系统，确保技术符合道德期望。这三个组成部分共同构成了信任的基石，影响着用户对 AI 的采用和接受程度。当人们信任 AI 时，他们更有可能将其融入生活，从而实现更无缝、更具影响力的技术进步。


    ## 构建可信赖的 AI 系统


    但我们该如何构建体现这些理想的 AI 系统呢？一种策略是确保数据隐私和安全，这在当今互联互通的世界中是不可妥协的。开发者必须实施强有力的数据保护措施，如加密和匿名化，以保护敏感信息。这不仅保护了个人，也增强了系统的公信力。构建具有弹性的
    AI 模型是另一项关键策略。这些模型应设计为能够抵御错误和攻击，即使在逆境条件下也能保持功能正常。对抗训练等技术（让模型做好处理意外输入的准备）是实现这种弹性的关键。实现可信度需要采取主动方法，在潜在漏洞演变为威胁之前加以解决。


    ## 人工监督与伦理培训


    人工监督在维护对 AI 系统的信任中发挥着关键作用。仅让 AI 独立运行是不够的；人工操作员必须保持参与，验证决策并确保合乎伦理的使用。人在回路方法涉及人类积极参与
    AI 决策过程，提供仅靠自动化系统可能缺乏的制衡机制。这种监督对于后果重大的决策至关重要，例如医疗或刑事司法领域的决策。对 AI 操作员进行伦理使用和解读方面的培训同样重要。这些人员应具备理解
    AI 输出并做出明智判断的能力，确保技术服务于人类利益并遵守伦理标准。


    ## 可信赖 AI 的现实案例


    可信赖 AI 系统的例子比比皆是，展示了可靠性、安全性和伦理如何在实践中结合。以自动驾驶汽车为例，它们必须赢得公众信任才能成为主流。这些车辆依靠 AI 安全导航，需要严格的测试和验证，以确保它们在道路上始终做出正确决策。其成败取决于公众对其安全可靠运行能力的信心。医疗领域的安全
    AI 平台是另一个例子，它们以极高的谨慎处理敏感的患者数据。这些系统采用先进的安全措施来保护数据的完整性和机密性，在依赖它们获取关键健康信息的用户中建立起信任。


    ## 更广泛的背景：透明度与问责制


    在更广泛的背景下，对 AI 系统的信任超越了技术规范。它涉及培育一种透明和问责的文化，让用户对日常交互的技术充满信心。随着我们继续开发和部署 AI，维护信任将至关重要，确保这些系统在不损害我们的价值观或安全的前提下改善我们的生活。通过拥抱这些原则，我们可以为既推动技术进步又丰富我们共同人类体验的
    AI 铺平道路。


    ## 结论与后续步骤


    在本章结束之际，很明显，伦理考量不仅仅是指导方针，更是 AI 未来的必要条件。可信赖的 AI 系统触手可及，随着我们不断前进，这些原则将指引我们构建一个更公平、更安全的数字世界。在下一章中，我们将探讨
    AI 如何持续重塑行业，推动创新并重新定义可能性。


