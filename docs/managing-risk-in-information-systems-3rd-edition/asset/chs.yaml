  \    1. SP 800-34\n    2. SP 800-35\n    3. SP 800-37\n    4. SP 800-84\n\n13. 哪个美国政府机构定期发布与安全威胁相关的警告和简报？\n\
  \    1. NIST\n    2. FBI\n    3. US-CERT\n    4. MITRE 公司\n\n14. CVE 列表由 \\_\\_\\\
  _\\_\\_\\_\\_ 维护。\n15. 创建信息安全漏洞名称使用的标准是什么？\n    1. CVE\n    2. MITRE\n    3. DISA\n\
  \    4. CSI\n\n![© Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n© Sai Chan/Shutterstock\n\
  \n## 理解并维护合规性\n\n## 第 3 章\n\n关于信息技术（IT）系统的保护，已有许多法律和法规，在如今公司将数据迁移到云端的今天，这种法律保护尤为重要。虽然迁移到云端使公司能够在不同国家开展业务，但也为满足满足不同的合规性要求带来了挑战。因此，理解和维护安全、隐私和合规性至关重要。公司有义务遵守适用于它们的法律。遵守法律的第一步是理解这些法律。没有人要求每个人都是律师，但每个人都应该理解相关法律的基础。\n\
  \n在了解适用于哪些法律和法规后，IT 安全人员可以进一步研究，以确保他们的组织符合规定。不合规的代价可能是非常昂贵的。罚款可能高达数十万美元，某些违法行为可能导致监禁。对于公司来说，不合规的公开耻辱会导致声誉受损，这可能导致他们失去业务。\n\
  \n### 第 3 章主题\n\n本章涵盖了以下主题：\n* 美国存在哪些合规法律\n* 哪些与合规相关的某些法规\n* 应该考虑哪些组织合规性政策\n* 存在哪些合规性标准和指南\n\
  \n### 第 3 章目标\n\n完成本章后，你将能够：\n* 定义合规性\n* 描述《联邦信息安全管理法 (`FISMA`) 的目的\n* 识别《健康保险流通性与责任法案\
  \ (`HIPAA`) 的目的和范围\n* 描述《格雷姆-里奇-布莱法案 (`GLBA`)》和 2002 年萨班斯-奥克斯法案 (`SOX`)及其对 IT 的影响\n\
  * 描述《家庭教育权利与隐私法 (`FERPA`) 的目的\n* 识别《儿童互联网保护法案 (`CIPA`) 的目的和范围\n* 列出控制 IT 相关法规的联邦实体\n\
  * 描述支付卡行业数据安全标准 (`PCI DSS`) 的目的\n* 描述 SP 800-30《风险评估指南》的内容\n* 描述信息和相关技术控制目标 (`COBIT`)\
  \ 的目的\n* 描述国际标准化组织 (`ISO`) 的目的并识别相关的安全标准\n* 识别信息技术基础库 (`ITIL`) 的目的\n* 识别能力成熟模型集成\
  \ (`CMMI`) 的目的\n* 描述《通用数据保护条例 (`GDPR`) 的目的\n\n## 美国合规法律\n\n美国有许多与信息技术（IT）和安全相关的法律。受法律影响的公司被要求遵守这些法律，这通常被称为合规性。当组织在制定全面的风险管理计划以指导内部运营并保持外部合规时，这些法律是非常重要的。\n\
  \n\n\n\n\n许多组织制定了内部计划，以确保其符合相关法律法规。这些计划通常使用内部审计，且组织会经常参考已建立的组织治理流程。组织还可以使用认证和评审别计划。当法律强制要求合规时，通常会进行外部审计。这些外部审计提供了第三方验证，证明要求正得到满足。\n\
  \n一句古老的法律格言是“无知不是借口”。换句话说，一个人不能在违反法律后说“我不知道”。对于适用于组织的法律也是如此。了解相关的法律法规对组织而言至关重要。\n\
  \n并不要求组织成为这些法律的专家。然而，经理和高管应该了解这些法律。相关的法律法规可以整合到合规计划中，以进行更详细的检查。\n\n本节涵盖以下美国法律：\n\
  \n* 2014 年《联邦信息安全现代化法案》(FISMA)\n* 《健康保险可携带性与责任法案》(HIPAA)，1996 年\n* 《格拉姆-里奇-布莱尔法案》(GLBA)，1999\
  \ 年\n* 《萨班斯-奥克斯利法案》(SOX)，2002 年\n* 《家庭教育权利与隐私法案》(FERPA)，1974 年\n* 《儿童互联网保护法案》(CIPA)，2000\
  \ 年\n\n## 联邦信息安全现代化法案\n\n2014 年的联邦信息安全现代化法案 (FISMA)最初于 2002 年通过，作为《联邦信息安全管理法案》通过。其目的是通过向联邦机构分配特定责任，确保联邦机构保护其数据。2014\
  \ 年的更新对原始法律进行了重大更改。\n\n首先，2014 年的法律授权国土安全部（`DHS`）部长协助管理和局（`OMB`）局长管理联邦信息系统机构信息和安全实践的实施。其次，该法律通过修改可报告信息的范围改变了机构报告要求，将其从主要是政策和财务信息转变为有关威胁、安全事件和遵守安全要求的特定信息。第三，该更新解决了网络数据泄露的通知要求。第四，在更新后的法律通过后一年内，`OMB`\
  \ 局长需要修订预算通告 `A-130` 以消除低效的报告。\n\n机构负责：\n\n* **保护系统和数据**——机构负责人负责其机构内所有的系统和数据。\n\
  * **遵守 FISMA 的所有要素**——`FISMA` 包含了如何保护系统和数据的细节。必须对系统进行清单并进行风险评估，以对系统和数据分类。可以根据风险水平使用不同的安全控制。系统必须通过认证和评审过程。\n\
  * **在所有过程中整合安全**——安全必须贯穿整个机构，并且必须进行持续监控以确保系统保持安全。\n\n`FISMA` 要求年度检查。每年，机构必须对其计划进行独立评估。其目标是确定计划的有效性。这些评估应包括：\n\
  \n* **有效性测试**——对政策、程序和实践的代表性样本进行测试。所选样本应根据组织的预期保持真实。\n* **发布评估或报告**——报告识别并列出机构对\
  \ `FISMA` 的遵守情况以及对其他标准和指南的遵守。\n\n## 健康保险可携带性与责任法案\n\n健康保险可携带性与责任法案 (HIPAA)于 1996\
  \ 年通过。它确保健康信息数据得到保护。`HIPAA` 的通过改进了个人医疗信息的安全性，以前这些信息的安全性很松散且经常被误用。`HIPAA` 在合规方面涵盖了三个主要领域：行政（保护患者数据并确保只有授权人员才能访问的方法）、物理（防止物理盗窃和未经授权访问带有受保护数据的系统的方法）和技术（利用技术保护计算机网络和设备免受威胁）。\n\
  \n![](img/Note.png)**注意**\n\n这些法律与组织中的 IT 公司治理之间存在联系。IT 公司治理由一套系统规则、实践和流程组成，这些流程对于最大限度地减少组织中的\
  \ IT 风险至关重要。根据组织的类型和位置，合规要求各不相同，例如 `FISMA`、`HIPAA`、`GLBA` 或 `GDPR` 中列出的那些。组织在制定全面的\
  \ IT 风险管理计划时，必须将公司治理考虑在。\n\n2019 年医疗信息和管理系统协会（HIMSS）网络安全调查识别了许多趋势。以下数据收集自：\n\n*\
  \ 约 65% 的受访者来自医疗服务领域。\n* 超过 85% 的受访者必须遵守 `HIPAA`。\n\n`HIPAA` 定义 `健康信息` 为任何以下数据：\n\
  \n* 由以下实体创建或接收：\n    * 医疗提供者\n    * 健康计划\n    * 公共卫生部门\n    * 雇主\n    * 人寿保险公司\n\
  \    * 学校或大学\n    * 医疗结算中心\n* 与个人健康有关，包括：\n    * 过去、现在或未来的健康\n    * 个人的身体健康、心理健康或状况\n\
  \    * 过去、现在或未来的医疗费用\n\n`HIPAA` 的第二部分包含名为“行政简化”的部分。该部分包含了 `HIPAA` 对 IT 的要求和标准：\n\
  \n* **安全标准**——处理健康信息的组织都必须保护它。公司还必须保护处理信息的系统，包括组织创建、接收或发送的所有健康数据。特定标准应用于：\n    *\
  \ 存储数据\n    * 使用数据\n    * 传输数据\n* **隐私标准**——未经患者明确同意，不得与任何人共享数据。去过诊所或医院的人可能已经签了同意表。该表格还告知患者用于保持其健康信息隐私的做法。\n\
  * **处罚**——如果不遵守规则，可能会被处罚。此类处罚根据组织的过错程度或疏忽程度而异：\n    * **“不知”错误**——每次违规的罚金从 $100\
  \ 到 $50,000 不等，每年最高 $50,000。\n    * **合理原因**——处罚从 $1,000 到 $50,000 不等，每年最高 $100,000。\n\
  \    * **故意疏忽但已纠正**——处罚从 $10,000 到 $50,000 不等，每年最高 $250,000。\n    * **故意疏忽且在发现后未纠正**——每次违规的处罚为\
  \ $50,000，每年最高 $150 万。\n\n### ![](img/Note.png)**注意**\n\n`HIPAA` 的第一部分与保险的可携带性有关，并规定了保险计划的规则。例如，当员工换工作时，`HIPAA`\
  \ 帮助他们保留保险。`HIPAA` 部分规则与 IT 合规无关。只有 `HIPAA` 的第二部分涵盖了数据保护，特别是五项规则中的第一项隐私规则，它涵盖了受保护的健康信息\
  \ (PHI)。\n\n\n\n\n\n如果一个组织包含 HIPAA 涵盖的数据，则该组织必须有一份合规计划。`FIGURE 3-1`](#12_chapter03_01.xhtml#fig3-1)\
  \ 显示了创建 HIPAA 合规计划的过程：\n\n*   **评估**——评估有助于识别一个组织是否受 HIPAA 涵盖。如果是，必须识别出哪些数据需要被保护。\n\
  *   **风险分析**——风险分析有助于识别风险。在这一阶段，将分析组织如何处理数据。例如，数据是仅以电子方式存储，还是也会以电子方式进行传输？\n*   **计划制定**——在识别出风险后，制定一份计划。该计划包含了降低风险的方法。\n\
  *   **计划实施**——实施该计划。\n*   **持续监控**——深度防御安全需要持续监控。应该监控法规和风险的变化，并对计划进行监控以确保其仍在使用。\n\
  *   **评估**——必须进行定期审查。这些审查确保组织能够保持合规性。\n\n![FIGURE 3-1 HIPAA 合规。](img/9781284183719_CH03_FIGF01.png)\n\
  \n**FIGURE 3-1** HIPAA 合规。\n\n### ![](img/Note.png)注意\n\n*个人身份识别信息 (PII)* 是信息安全领域常用的一个术语。PII\
  \ 是所有可用于识别个人身份的数据。此类数据可以是姓名、社会安全号码、生物识别数据或用于识别身份的数据。多项法律法规规定必须保护 PII。信息安全中的 PII\
  \ 与 HIPAA 中的 PHI 是同义词。\n\n#### 格拉姆-莱奇-布莱利法\n\n格拉姆-莱奇-布莱利法 (GLBA) 也称为《金融服务现代化法案》，于\
  \ 1999 年通过。GLBA 范围很广，其大部分内容与银行和保险机构如何合并有关。然而，GLBA 的两个部分与 IT 安全相关并适用于美国的金融机构。它们是：\n\
  \n*   **金融隐私规则**——该规则要求公司通知客户其隐私惯做法。任何持有银行账户的人可能都收到过来自银行的此类通知。任何持有信用卡的人都收到过来自信用卡公司的通知。它解释了银行或公司如何收集和共享数据。\n\
  *   **保护规则**——公司必须拥有一个安全计划来保护客户信息，该计划应确保数据在未经授权的情况下不发布并确保数据完整性。公司负责确保风险管理计划的使用。所有员工都必须接受安全问题的培训。联邦贸易委员会\
  \ (FTC) 在 2019 年 4 月提出了对保护规则的更新，目前正在审查中。\n\n#### 萨班斯-奥克斯利法\n\n萨班斯-奥克斯利法案 (SOX) 于\
  \ 2002 年通过。该法适用于所有上市公司。旨在让公司高管和董事成员对财务数据承担个人责任。如果数据不准确，这些人可能会被罚款并入狱。\n\n其目的是减少欺诈。由于个人需要承担责任，因此确保报告数据准确的压力更大。首席执行官\
  \ (CEO) 和首席财务官 (CFO) 必须能够：\n\n*   验证财务报表的准确性\n*   证明报表是准确的\n\nSOX 的大部分内容不在 IT 的直接范围范围内。但第\
  \ 404 节包含与之直接相关的元素。第 404 节涉及数据的准确性，并要求公司使用内部控制来保护数据。第 404 节还需要内部和外部审计师的报告来验证合规性。对于许多公司而言，审计成本代表了该法律最大的影响。\n\
  \n### ![](img/Note.png)注意\n\nSOX 的通过是为了应对几次重大丑闻。在这些丑闻中，高管故意误导公众，导致投资者损失了数十亿美元。例如，据报道，安然（Enron）在\
  \ 2000 年价值超过 1000 亿美元，但在 2001 年破产了。后来，确定失败是由欺诈和腐败造成的。许多高级官员和董事成员直接参与其中。\n\n####\
  \ 家庭教育权利与隐私法\n\n家庭教育权利与隐私法 (FERPA) 于 1974 年通过，从那以后至少修订了九次。该法的目的是保护学生记录的隐私，包括教育和健康数据。\n\
  \nFERPA 适用于所有接受美国教育部部资助的学校。这些学校包括：\n\n*   州或地方教育机构\n*   高等教育机构\n*   社区学院\n*   提供学前教育课程的学校或机构\n\
  *   所有其他教育机构\n\nFERPA 授予 18 岁以下学生家长权利。家长可以检查记录并要求修正。当学生达到 18 岁时，这些权利将移交给学生。\n\n\
  关于学生的所有 PII 必须受到保护。学校通常需要获得家长或学生的许可才能发布 PII。\n\n在访问或发布 PII 方面有少数例外情况：\n\n*   某些学校官员可以查看记录。\n\
  *   如果学生转学，数据可以传输到新学校。\n*   当使用某些类型的财务助学时，可以传输数据。\n*   认证机构可以访问数据。\n*   根据法院要求，可以访问数据。\n\
  *   出于健康和安全紧急情况，可以访问数据。\n\n#### 儿童网络保护法\n\n儿童网络保护法 (CIPA) 于 2000 年通过，旨在限制学校和图书馆计算机访问攻击性内容。所有获得\
  \ E-Rate 资金的学校和图书馆都受 CIPA 涵盖。\n\nCIPA 要求学校和图书馆：\n\n*   阻止或过滤访问以下图片的互联网：\n    * \
  \  淫秽的\n    *   儿童色情的\n    *   对有害的（如果计算机由青少年访问）\n*   采纳并执行监控青少年在线活动的政策\n*   实施网络安全政策，涉及：\n\
  \    *   青少年访问不当内容\n    *   青少年使用电子邮件和聊天室的安全与保护\n    *   未经授权的访问\n    *   少年的在线违法活动\n\
  \    *   未经授权使用少年的个人信息\n    *   限制青少年接触有害材料的措施\n\n某些术语很难定义，例如什么是淫秽或对青少年有害。CIPA 包含一个定义部分，指出了美国法典中定义其中某些术语的其他特定章节。\n\
  \n### ![](img/Note.png)注意\n\nE-Rate 项目由联邦通信委员会管理。它为大多数学校和图书馆提供互联网接入折扣，范围在实际成本的 20%\
  \ 到 90% 之间。\n\n#### 儿童在线隐私保护法\n\n`儿童在线隐私保护法 (COPPA)` 由 FTC 管理，于 1998 年通过并于 2000\
  \ 年生效。该法旨在保护 13 岁以下儿童的隐私。\n\n### 使用代理服务器限制内容\n\n大多数组织使用代理服务器作为网关访问互联网。组织配置其计算机使用代理服务器。代理服务器接收请求，从互联网检索网页，然后将页面提供给客户端。\n\
  \n\n\n\n\n代理服务器可以提高面向客户端的服务水平。它们也可以用于过滤内容。如果一个组织不希望员工访问某些内容，代理服务器可以阻止对特定网站的请求。\n\
  \n第三方公司根据内容维护网站列表。然后他们将这些列表的订阅服务卖给需要它们的组织。例如，一家公司可能希望限制从工作电脑访问博彩网站。可以购买博彩列表并安装在代理服务器上。然后公司就可以阻止访问这些网站的尝试。\n\
  \n代理服务器还能够记录用户访问未批准网站的尝试。当某个网站被阻止时，用户通常会看到诸如“警告。访问此网站受可使用政策的限制。您的活动正在被监控。”的消息。\n\
  \n同样，学校和图书馆也可以使用代理服务器来过滤内容。这项技术已普及。\n\n该法律规定了以下内容：\n\n*   对于收集或使用年轻网站用户的所有个人信息，网站必须获得家长的同意。\n\
  *   隐私政策的内容，包括该政策本身必须在所有收集数据的地方张明的规定。\n*   何时以及如何向父母或监护人寻求可核实的同意书。\n*   网站运营商在儿童在线隐私和安全方面的责任，包括对针对\
  \ 13 岁以下儿童的营销类型和方法的限制。\n\n尽管 `COPPA` 没有定义获得家长同意的流程，但 `FTC` 分享了指南以帮助网站运营商。其中一些要求包括：\n\
  \n*   必须清晰显示可以轻松下载并邮寄或传真给运营商的同意表。\n*   父母必须使用信用卡来验证年龄和身份。\n*   父母必须拨打免费服务电话。\n*\
  \   接受来自父母的包含数字签名的电子邮件。\n\n`CIPA` 曾因言论自由的理由受到受到。。美国最高法院于 2003 年 6 月维持了该法律。所有图书馆被要求在\
  \ 2004 年初之前完成合规。到此时，所有接受 `E-Rate` 资金的学校和图书馆都被认为正在遵守 `CIPA`。\n\n## 与合规相关的法规\n\n除了法律之外，几项法规还创建了不同的美国实体。这些实体中的大多数在联邦层面运营。\n\
  \n其中一些实体对大多数公司的 IT 计划有直接影响。另一些则仅与从事特定活动的公司有关。本节涵盖的组织有：\n\n*   证券交易委员会 (SEC)\n* \
  \  联邦存款保险公司 (FDIC)\n*   国土安全部 (DHS)\n*   联邦贸易委员会 (FTC)\n*   州检察长 (AG)\n*   美国司法检察长\
  \ (U.S. AG)\n\n### 证券交易委员会\n\n`Securities and Exchange Commission (SEC)` 是一个联邦机构。它负责监管证券行业，包括证券的所有销售或交易。证券包括股票、债券和期权。\n\
  \n如果一家公司涉及证券的销售或交易，那么 IT 安全人员应该了解这些法律：\n\n*   1933 年证券法\n*   1934 年证券交易法\n*   1939\
  \ 年信托契约法\n*   1940 年投资公司法\n*   1940 年投资顾问法\n*   2002 年《萨班斯-奥克斯利法案》\n*   2010 年《德·弗兰克法案》\n\
  \n如果一家公司是 `publicly traded`（上市公司），那么其中许多法律也适用。上市公司是指任何外部投资者可以买卖其股票的公司。\n\n### 联邦存款保险公司\n\
  \n`Federal Deposit Insurance Corporation (FDIC)` 是 1933 年创建的一个联邦机构。其主要目标是提高对美国银行的信心。`FDIC`\
  \ 的建立是 20 世纪 20 年代和 30 年代初期银行倒闭的直接结果，这些倒闭导致了大萧条。\n\n`FDIC` 保的所有银行的资金都是担保的，这意味着即使银行破产，存款人也不会损失金钱。其目的是防止银行挤兑，即许多存款人急于提取款项的情况。\n\
  \n目前，个人存款的资金保险额度最高为 250,000 美元。`National Credit Union Administration (NCUA)` 涵盖信用合作社，它也保险高达\
  \ 250,000 美元的存款。\n\n### 国土安全部\n\n`Department of Homeland Security (DHS)` 是一个联邦机构。它负责保护美国免受恐怖主义攻击，并负责应对自然灾害。\n\
  \n`DHS` 成立于 2002 年，是对 2001 年 9 11 日恐怖袭击的直接反应。它包含了几个与 IT 相关的部门，包括：\n\n*   网络安全与通信办公室\n\
  *   国家网络安全与通信集成中心 (NCCIC)\n*   美国计算机应急准备小组 (US-CERT)\n\n### 联邦贸易委员会\n\n`Federal\
  \ Trade Commission (FTC)` 是一个联邦机构。它创建于 1914 年，主要目标是促进消费者保护，但这一目标在多年来发生了变化。\n\n当\
  \ `FTC` 最初创建时，其主要目标是防止不公平的竞争手段。当时，存在许多特殊的信托基金。这些信托基金通常参与反竞争行为，例如：\n\n*   商业垄断\n\
  *   限制贸易\n*   价格操纵\n\n`FTC` 的建立是“拆散信托”所采取的许多步骤之一。多年来，国会通过了多项消费者保护法，由 `FTC` 执法。这些法律赋予了\
  \ `FTC` 处理消费者保护和不公平竞争问题的权限。目前，这些信托已经消失。然而，`FTC` 仍然存在，其重点已转向促进消费者保护。\n\n`FIGURE 3-2`\
  \ 显示了 `FTC` 的架构。如图，`FTC` 有三个主要的局。这些局负责执行以下工作：\n\n*   **消费者保护局**：该局试图保护消费者免受不公平、欺骗或欺诈行为的影响。它执行许多消费者保护法和贸易法规。\n\
  *   **竞争局**：该局是 `FTC` 的反垄断部门。它寻求反竞争行为。这些行为包括反竞争并购和反竞争业务行为。\n*   **经济局**：该局帮助 `FTC`\
  \ 评估行动的影响。它为不同的调查提供经济分析，并评估政府监管的影响。\n\n![FIGURE 3-2 联邦贸易委员会。](img/9781284183719_CH03_FIG02.png)\n\
  \n**FIGURE 3-2** 联邦贸易委员会。\n\n`FTC` 还有几个支持办公室，为 `FTC` 提供额外工作。\n\n\n\n\n\n某些州检察长（AGs）是由选举产生的，而另一些则由州长或其他州官员任命。州检察长是被授予在所有法律事务中代表该州的权威的人，这类似于通用授权书的使用方式。州检察长可以被视为被授予该州通用授权书的人员。\n\
  \n## 美国司法检察长\n\n美国检察长（U.S. Attorney General，U.S. AG）是美国司法部（DOJ）的负责人。美国总统负责提名美国司法检察长。\n\
  \n美国司法部（DOJ）的具体职责包括：\n\n* 维护法律\n* 根据法律维护美国的利益\n* 确保公共安全免受威胁\n* 在预防和控制犯罪方面提供联邦领导作用\n\
  * 为违法行为的罪犯寻求公正的惩罚\n* 确保所有美国人获得公平公正的司法待遇\n\n美国检察长采取的许多行动都属于 IT 领域。例如，美国检察长于 2010\
  \ 年 2 月宣布了知识产权工作组。公司、组织和政府经常使用知识产权系统和网络传输数据。其目标是在国家和国际层面解决知识产权犯罪。许多政府领导者认为，知识产权的盗窃对经济造成了巨大损害。\n\
  \n## 授权书\n\n授权书可以授予任何个人以赋予某些权利。例如，一个人可以给朋友一份授权书，允许在其不在场的情况下出售自己的汽车。那么，该朋友就可以在出售汽车时合法地代表该个人。\n\
  \n也可以授予通用授权书。通用授权书允许一个人在法律问题上代表另一个人，有时在某人丧失精神行为能力时使用。\n\n## 供参考\n\n知识产权（IP）是指任何由个人或公司产生、是创造力成果的无形财产。创作所有者被授予特定的权利。知识产权包括音乐、程序、书籍、电影、商标、商业秘密等。创作者和所有者应该能够从创作中获利。然而，当知识产权权利被忽视时，他人将以创作者为代价获益。\n\
  \n## 合规组织政策\n\n组织通常实施政策以确保其符合法律法规的要求。这些政策可能包含多个元素。然而，在本章的背景下，最重要的元素是信义责任。\n\n`fiduciary`指的是一种信任关系。信义人可以是被信赖持有他人资产的人。被信赖的人有责任为了他人的最大利益行事。他或她应该避免利益冲突。\n\
  \n一旦某人信任信义人，就存在信义关系。注意，这种关系需要两个独立的实体。信义责任可以采取许多形式。信义责任的示例包括：\n\n* 律师与客户——客户信任律师为了客户的最大利益行事。\n\
  * 首席执行官（CEO）与董事会——董事会信任首席执行官为了公司的最大利益行事。\n* 股东与董事会——股东信任董事会为了股东的最大利益行事。\n\n信义关系中赋予了巨大的信任。正因如此，信义人被期望采取额外步骤来维护这种信任。可以采取的两个步骤是尽职调查和尽责/尽责：\n\
  \n* `due diligence`——信义人投入合理的时间和精力来识别风险。他们对风险进行调查以便于理解。未能行使尽职调查可能被视为疏忽。\n* `due\
  \ care`——如果已知风险，信义人需要采取合理步骤来防止风险。未能采取尽责措施保护资产也可能被视为疏忽。\n\n行使尽责和尽职调查并不意味着应该消除所有风险。剩余风险是在应用控制措施后剩余的风险，也称为可接受风险。\n\
  \n信义人被期望理解并权衡风险。通过行使尽责和尽职调查，信义人不太可能被指控鲁莽行事或疏忽。\n\n组织政策的其他元素可能包括：\n\n* 强制休假——员工可能被要求每年至少休连续五天的年假。强制休假的目的是减少欺诈或挪用。如果要求员工离开办公室，则必须由其他人履行职责，这增加了发现非法活动的可能性。\n\
  * 岗位轮岗——员工可能会在不同的工作之间轮岗。当员工被调到新工作时，过去的交易通常会进行审查和检查。这种监督可以发现可疑活动。岗位轮岗有助于预防或减少欺诈活动。它也是为了交叉培训以扩大员工技能。\n\
  * 职责分离——职责分离确保没有单个人控制整个流程。它有助于防止欺诈、盗窃、错误和利益冲突。\n* 可接受使用——可接受使用政策（AUP）定义了 IT 系统和数据的可接受使用。公司通常在员工入职时告知其可接受使用。有些公司使用横幅和登录屏幕提醒人员相关政策。\n\
  \n## 合规标准和指南\n\n存在若干用于评估和改进安全的标准和指南。这些标准大多数是可选的。然而，对于某些行业是强制性的。例如，使用特定信用卡的商户必须遵守\
  \ PCI DSS。\n\n本节涵盖的标准和指南包括：\n\n* 支付卡行业数据标准 (PCI DSS)\n* 美国国家标准与技术研究院 (NIST)\n* 通用信息安全原则\
  \ (GAISP)\n* 信息和相关技术控制目标 (COBIT)\n* 国际标准化组织 (ISO)\n* 国际电工委员会 (IEC)\n* 信息技术基础设施库\
  \ (ITIL)\n* 能力成熟模型集成 (CMMI)\n* 通用数据保护条例 (GDPR)\n* 国防部信息保证认证与认可流程 (DIACAP)\n\n###\
  \ 支付卡行业数据标准\n\n支付卡行业数据安全标准 (PCI DSS)是一项国际安全标准。其目的是增强信用卡数据的安全性。它由 PCI 安全标准委员会创建，并带有几家主要信用卡公司的建议。这些公司包括：\n\
  \n* 美国运通 (American Express)\n* 发现金融服务 (Discover Financial Services)\n* JCB 国际\n\
  * 万事达全球 (MasterCard Worldwide)\n* Visa 国际\n\n目标是防止信用卡数据的盗窃。如果窃偷获取了某些数据，就会发生欺诈。关键数据字段包括：\n\
  \n* 姓名\n* 信用卡号\n* 有期日期\n* 安全码\n\n如果窃偷拥有所有这些信息，盗窃将变得容易。\n\n这些数据经常在商户之间传输。它们可以从销售终端无线传输，并从商户电脑传输到授权机构。在传输的任何时候都可能被截获，如果没有加密则很容易被读取。\n\
  \n\n\n\n\n例如，在 2005 年 7 月至 2006 年 12 月期间，一家大型零售连锁店截获了多达 1 亿张信用卡数据。仅`Visa`卡的损失就接近\
  \ 8,300 万美元。数百万客户提起了诉讼，发发卡片的银行也起诉了该零售商。其他例子包括 2017 年的`Equifax`数据泄露事件，该事件影响了约 40%的美国人，暴露了\
  \ 1470 万人的个人信息。2019 年涉及`Capital One`的数据泄露事件暴露了近 1.06 亿人的记录。所有这些问题可以通过基础安全措施来避免。\n\
  \nPCI DSS 围绕六个原则构建。每个原则包含一或两项要求。这些原则和要求如下：\n\n*   **构建并维护安全网络**\n    *   `Requirement\
  \ 1`: 安装并维护防火墙。\n    *   `Requirement 2`: 不要使用默认设置，例如默认密码。\n*   **保护持卡人数据**\n  \
  \  *   `Requirement 3`: 保护存储的数据。`Requirement 4`: 加密传输。\n*   **维护漏洞管理计划**\n    *\
  \   `Requirement 5`: 使用并更新防病毒软件。`Requirement 6`: 开发并维护安全系统。\n*   **实施强访问控制措施**\n\
  \    *   `Requirement 7`: 限制访问数据。\n    *   `Requirement 8`: 为每个用户使用唯一的登录名。不要共享用户名和密码。\n\
  \    *   `Requirement 9`: 限制物理访问。\n*   **定期监控和测试网络**\n    *   `Requirement 10`:\
  \ 跟踪和监控所有系统和数据的访问。`Requirement 11`: 定期测试安全性。\n*   **维护信息安全策略**\n    *   `Requirement\
  \ 12`: 维护安全策略。\n\n使用信用卡的商户必须遵守`PCI DSS`。合规性由收单行（验证交易的公司）进行监控。\n\n遵守`PCI DSS`是一个三步的持续过程。该过程如图\
  \ 3-3 所示：\n\n*   **评估**——商户对用于信用卡数据的 IT 资产和流程进行盘点。识别现有的持卡人数据，然后分析数据和流程的漏洞。\n*  \
  \ **修复**——商户修复漏洞。仅在必要时存储数据。\n*   **报告**——商户向收单银行提交合规报告。\n\n![图 3-3 PCI 合规过程。](img/9781284183719_CH03_FIGF03.png)\n\
  \n**图 3-3** PCI 合规过程。\n\n这一过程会在不同时间重复。\n\n虽然`PCI DSS`合规有助于防止损失，但它并非万无一失。例如，在 2013\
  \ 年底针对`Target Corporation`的一次重大攻击中，攻击者盗取了 4000 万客户的信用卡数据。攻击者在同一攻击中还盗取了另外 7000 万客户的个人信息。2019\
  \ 年，`Capital One`超过 1.06 亿客户的个人数据被盗。在攻击期间，`Target`已通过`PCI DSS`认证。同样的攻击导致了`Neiman\
  \ Marcus`的 110 万张卡片泄露。`Neiman Marcus`的首席信息官 Michael Kingston 表示，公司的安全措施已经超过了标准。\n\
  \n### 国家标准与技术研究所\n\n美国国家标准与技术研究所（`NIST`）是美国商务部的一个部门。`NIST`设有信息技术实验室（`ITL`）。`NIST`的使命是促进创新和竞争力。`NIST`制定标准和指南。\n\
  \n`NIST SP 800-30 风险评估实施指南`是一项非常有价值的工具。它包含三个章节：\n\n*   **引言**——这一章给出了一些定义。\n*  \
  \ **基础**——这一章讨论了目标。\n*   **过程**——这一章描述了处理流程。它包括关键任务：\n    *   识别相关的威胁源\n    *  \
  \ 识别潜在威胁\n    *   确定威胁发生的概率\n    *   确定威胁被利用时的负面影响\n    *   根据风险确定影响\n\n### 通用安全原则\n\
  \n通用接受安全原则（`GAISP`）是一种从通用接受系统原则（`GASSP`）演变而来的旧标准。`GASSP`创建于 1992 年。`GAISP`被信息系统协会（`ISSA`）采用。然而，`ISSA`网站上不再提到`GAISP`。此外，`gaisp.org`也不再进行维护。`GAISP`包含两个主要部分：\n\
  \n*   **普遍性原则**——这些原则为建立和维护安全提供了通用指导。\n*   **广义功能原则**——这些原则源自普遍性原则，代表了安全的宏观目标。\n\
  \n### 信息及相关技术控制目标\n\n信息及相关技术控制目标（`COBIT`）是一套适用于管理的实践方法。信息技术治理（`ITG`）是指确保 IT 资源能够使组织实现目标的过程。`ITG`过程有助于将业务目标与\
  \ IT 目标联系起来。\n\n信息治理协会（`ITGI`）曾与`ISACA`合作开发了`COBIT`。`ISACA`以前被称为信息系统审计与控制协会。但现在它只使用该缩写。许多免费的`COBIT`资源可以通过`ISACA`的网站`https://www.isaca.org/resources/cobit`访问。\n\
  \nISACA 最近发布了`COBIT 2019`。`COBIT 2019`是一个用于整个企业范围内 IT 资源治理和管理的领先框架。`COBIT 2019`取代了`COBIT\
  \ 5`，扩展了信息和技术治理的定义，并更新了`COBIT`原则。2019 版本还引入了`COBIT`核心模型和 40 个治理与管理目标。其他更新还包括针对数据、项目和合规的新流程；网络安全和隐私的更新；以及组织可以在治理活动中使用的法规、指南和最佳实践的更新。\n\
  \n\n\n\n\n### 3. **应用单一集成框架**——COBIT 2019 使用了一个扩展且稳健的集成框架。该集成框架避免了在使用多个框架时产生的冲突。\n\
  \n### 4. **启用整体方法**——整体方法确保了对组织作为一个整体进行审查。\n\n### 5. **将治理与管理分离**——治理包括评估、指导和监控。管理包括计划、构建、运行和监控。\n\
  \n`图 3-4` 展示了七个 COBIT 组件。接下来的项目符号描述了这些组件：\n\n1. **原则、政策和框架**——这些组件将期望的行为转化为实际的指导意见。\n\
  2. **过程**——过程是在组织内执行的实践和活动。它们帮助组织实现其与其与 IT 相关的目标。\n3. **组织结构**——组织结构是指做出关键决策的实体。许多组织在组织架构图中定义这些实体。\n\
  4. **文化、伦理和行为**——组织内个人以及整个组织的成功取决于这些因素。\n5. **信息**——组织依赖准确的信息，这对于运营和治理都是如此。\n6.\
  \ **服务、基础设施和应用**——组织依赖这些元素提供的 IT 处理和和服务。\n7. **人员、技能和能力**——活动的成功完成取决于这些组件。\n\n![图\
