  - `proural control`（程序控制）\n- `threat modeling`（威胁建模）\n- `vulnerability assessment`（漏洞评估）\n\
  - `whitelist`（白名单）\n\n## 第 6 章评估\n\n1. 一家公司开始对某个系统进行风险评估。在风险评估的早期，应该定义系统的 `\\_\\\
