  3. `ALE`\n4. `SLE`\n\n## 第 7 章：识别需要保护的资产和活动\n\n风险管理的的重要第一步是识别组织中的有价值资产。组织拥有各种需要保护的资产，包括明显的资产，如硬件和软件；数据和人员；以及系统功能和流程。\n\
  \n在组织识别出重要资产后，可以采取措施保护它们。业务影响分析有助于其识别某项服务故障时的影响，灾难恢复计划帮助其识别恢复故障系统所需的步骤。在更大的规模上，组织可以使用业务连续性计划来帮助确保在灾难发生后关键任务系统仍继续运行。\n\
  \n### 第 7 章主题\n\n本章涵盖了以下主题和概念：\n- 什么是系统访问和可用性\n- 什么是手动和自动系统功能\n- 什么是硬件、软件和人员资产\n\
  - 什么是数据和信息资产\n- 资产和库存管理如何与典型信息技术（IT）基础设施的七领域相关\n- 如何识别维护业务运营所需的设施和用品\n\n### 第 7\
  \ 章目标\n\n完成本章后，你将能够：\n- 识别系统访问和可用性的重要性\n- 区分手动和自动系统功能\n- 识别需要保护的硬件资产\n- 识别需要保护的软件资产\n\
  - 识别需要保护的人员资产\n- 识别组织数据和信息资产\n- 识别客户数据和信息资产\n- 识别知识产权数据和信息\n- 识别数据仓库和数据挖掘资产\n- 识别\
  \ IT 基础设施七领域可以采取的资产和库存管理步骤\n- 描述识别关键系统和应用程序的目的\n- 描述业务影响分析规划的目的\n- 描述业务连续性规划的目的\n\
  - 描述灾难恢复规划的目的\n- 描述业务责任保险规划的目的\n- 描述资产替换保险规划的目的\n\n## 系统访问与可用性\n\n系统访问和可用性是指用户（包括人员和客户）需要系统或服务的时间，这是一个重要的考虑因素。某些系统必须运行时间达到\
  \ 99.999%。其他系统只需在工作时间内运行，例如周一至周五的上午 8:00 到下午 5:00。\n\n\n\n\n\n\n五个九九（或 99.999% 的可用性）对于某些服务是必要的，这相当于每年约\
  \ 5.256 分的停机时间。计算公式为 `60 minutes × 24 hours × 365 days × .00001`。\n\n五个九九（或 99.999%\
  \ 的可用性）是可以实现的。图 7-1 显示了一个受双节点 故障转移集群 保护的数据库服务器。故障转移集群为服务器提供容错能力，并确保即使服务器故障，服务器提供的服务也能继续运行。它包含至少两个被称为\
  \ `nodes` 的服务器。\n\n![图 7-1 受到故障转移集群保护的数据库服务器。](img/9781284183719_CH07_FIGF01.png)\n\
  \n**图 7-1** 受故障转移集群保护的数据库服务器。\n\n在故障转移集群中，用户似乎连接到单个数据库服务器。图 7-1 显示该服务器为表面数据库服务器。`Nodes\
  \ 1` 和 `Node 2` 是实际上可以触碰的物理服务器。表面数据库服务器只是活动节点的逻辑视图。\n\n当 `node 1` 激活状态时，`node 2`\
  \ 处于空闲状态。`Node 1` 将处理所有数据请求。它访问外部驱动器数据。此时，`node 2` 的唯一工作是每隔 30 秒查询一次 `node 1` 并检查其心跳。只要\
  \ `node 1` 正常，`node 2` 就不做其他事情。\n\n然而，如果 `node 1` 的心跳停止，表示 `node 1` 已发生故障，`node\
  \ 2` 将接管 `node 1` 的服务采取行动。由于 `node 2` 可以访问外部驱动上的相同数据，数据不会丢失。用户仍然连接到表面数据库服务器，但数据现在由\
  \ `node 2` 提供。这种切换对终端用户来说是不可见的，通常情况下服务不会中断。\n\n### ![](img/Note.png)注意\n\n故障转移集群可以拥有两个以上的节点。例如，在一个八节点故障转移集群中可以保护多个服务。在八节点集群中，通常有两个节点处于空闲状态，六个处于激活状态。\n\
  \n外部驱动器可能是单点故障（`SPOF`）。`SPOF` 是系统中的任何一旦故障会导致整个系统失效的部件。硬件冗余独立磁盘阵列（`RAID`）通常用于确保即使驱动器故障数据也不会丢失。\n\
  \n故障转移集群还允许在不停机的情况下进行维护，因为可以在空闲节点上进行维护而不影响用户。如果活动节点需要维修，可以切换节点，使空闲节点变为活动节点。\n\n\
  尽管故障转移集群可以帮助实现 99.999% 的可用性，但代价是昂贵的。至少需要两台强大的服务器。此外，两台服务器永远不会同时使用；其中一台将一直处于空闲状态，仅检查另一台是否正常。然而，如果需要最高的可用性，这种成本是合理的。\n\
  \n确定哪些系统需要 99.999% 的访问和可用性，可以通过识别所提供服务的价值来完成。高价值系统比低价值系统需要更强的保护。价值可以通过衡量收入或生产力来衡量：\n\
  \n*   **直接和间接收入**——Web 服务器是提供直接收入的服务示例。如果 Web 服务器销售产品，可以确定其每小时赚取多少收入，然后用该数字来确定停机的直接成本。还需要计算间接成本，例如，挽回停机期间流失的客户的成本。\n\
  *   **生产力**——员工需要服务来完成工作。例如，员工可能使用用于管理库存的仓库应用程序来接收入货的产品并定位发货的产品。管理层可以使用它来确定任何时间当前库存的价值。如果此应用程序故障，所有发货可能会停止。如果故障没有及时恢复，可能会导致发货延迟、库存不准确和其他问题。同样，许多公司今天将电子邮件视为关键服务。如果它失效，生产力会迅速下降。\n\
  \n有时，系统访问和可用性的价值会被低估。也就是说，直到它故障为止。主动的风险经理会在识别资产时将系统访问和可用性包含在内。\n\n### 组织可以接受多少停机时间？\n\
  \n问一个非技术经理“组织可以接受多少停机时间？”，答案通常是零。但这个答案并不总是准确的。\n\n虽然 99.999% 的可用性是可以实现的，但它是昂贵的。它需要配置为故障转移集群配置的多台服务器和硬件\
  \ `RAID`。它甚至需要人工每天 24 小时、每周 7 天、每年 365 天监控系统。\n\n所有部分的成本可能非常高。虽然企业可能不希望系统遭受任何停机，但大多数系统可以接受一些。当经理们理解了五个九的成本时，他们通常会重新考虑自己的答案。\n\
  \n### 系统功能：手动和自动\n\n服务通常通过结合多个功能提供。这些功能可以是手动的、自动的或两者的混合。在识别系统资产时，理解手动和自动之间的区别很重要。\n\
  \n用于过滤垃圾邮件的自动垃圾邮件设备是一个功能的示例。垃圾邮件设备也可以被视为提供电子邮件的许多功能之一。电子邮件的其他功能可能包括扫描恶意软件以及签名和加密的能力。\n\
  \n### 手动方法\n\n某些系统使用手动方法而非技术方法。例如，对于一家使用手动方法的酒店，员工可以使用纸质日志跟踪从初始预约到退出的所有记录。虽然难以置信，但\
  \ 20 年前就是这样做的。如果过程是手动的，则有两个主要的资产价值：\n\n*   **书面记录**——客房日志是一份记录客人入住和退房的手写日志。经理使用此日志来向客户计费。\n\
  *   **流程知识**——员工会知道如何根据现有记录创建账单。一旦收到付款，将有一个单独的流程来存款。如果该酒店是一家小型家庭企业，可能只有老板和一两个员工知道整个流程。\n\
  \n在这个示例中，价值在于书面记录和拥有流程知识的人员。虽然今天去访问一家仅使用手动方法的酒店可能不大，但在一家使用手动内部流程的公司工作是有可能的。\n\n\
  ### 自动方法\n\n酒店可能能够将其许多过程自动化。由于它属于服务行业，酒店仍将包含一些人工互动。以下示例显示了酒店如何将其大部分过程自动化。\n\n客户可以在网上注册，许多酒店都倾向于他们这样做。有些酒店会对在线注册的用户提供折扣。客户将看到哪些日期可用以及每天的费用。他们可以选择日期并支付定金或全款。在线注册减少了酒店的人工成本。\n\
  \n这样当客户到达时，预订已经在系统中。他们将与友好的接待员办理入住手续，接待员通过自动化系统检查细节。接待员确认细节后，客户很快就会前往房间，可能还有行李员推着他们的行李。\n\
  \n\n\n\n\n一些酒店提供便利吧（通常是自动化的），里面包含零食和饮料。当客户拿走任何东西时，便利吧会感应到重量变化，前台在结账时会收到通知，告知客户可能付费。这种便利服务的费用通常非常高。例如，在其他地方购买\
  \ 0.75 美元的糖果，在这里可能花费 5.00 美元。\n\n许多酒店经常提供一个显示客户账单的电视节目。当客户在餐厅结账或从便利吧取走一瓶冰水时，账单会自动更新。当客户准备好结账时，他们可以通过该电视频道支付账单。很快，客户就会前往机场回到温馨的家。\n\
  \n在评估这种自动化方法时，还需要考虑其他几个方面，如下：\n\n*   **对客户的价值**——这些自动化方法通常被认为对有价值。如果注册流程清晰且高效，客户更有可能使用它。如果结账流程没有错误，就能消除结账过程中的混乱。这些益处可能难以量化，但此类服务可能会带来更多的回访和口碑广告。\n\
  *   **对公司的价值**——任何可以自动化的流程都需要更少的人力，而少的人力意味着更低的成本和更高的利润。减少的人力需求需要与实施和维护系统的成本之间取得平衡。十名低薪的服务人员可能被一名高薪的信息技术（IT）专业人员取代，仍然可以节省大量的薪资成本。\n\
  *   **确保流程运行**——确保流程在客户想要访问时可用至关重要，这包括互联网上可用的预订系统和自动客户结账系统。\n*   **保护数据**——不再仅仅是保护用于办理入退手续的登记簿，还需要维护大型数据库。这些数据库包含个人身份信息（PII），例如客户姓名、信用卡数据、地址和电话号码。如果这些数据被泄露，公司可能需要对因身份盗用导致的客户损失承担责任。\n\
  \n### ![](img/Note.png) 注意\n\n许多法律都强制保护个人身份信息（PII）。PII 是任何可以用于识别个人的数据，也可以是医疗、财务或犯罪数据。美国国家标准与技术研究院（NIST）发布了\
  \ `SP 800-122`，这是一份用于帮助政府实体和公共公司保护 PII 的指南。欧盟最近更新了其指南，以反映现在被称为通用数据保护条例 (GDPR) 的内容。\n\
  \n要记住的一点是，资产不仅仅是物品。它们也可以提供服务的流程。\n\n## 硬件资产\n\n硬件资产是可以物理接触的资产。它们包括任何类型的计算机，例如服务器或桌面\
  \ PC；网络设备，如路由器和交换机；以及网络设备，如防火墙和垃圾邮件设备。并不是所有组织都有相同的硬件资产，因此了解特定公司拥有的资产是非常重要的。\n\n\
  ### ![](img/Note.png) 注意\n\n大多数组织使用数据库来跟踪硬件资产。\n\n然而，必须识别的信息远比公司拥有的设备数量要多得多。这些其他信息包括：\n\
  \n*   位置\n*   制造商\n*   型号数字\n*   硬件组件，如处理器和随机存存储器（RAM）\n*   硬件外围设备，如扩展网络网卡（NICs）\n\
  *   基本输入输出系统（BIOS）版本\n\n这个列表看起来可能过头了，但并非如此。为了实现成功的安全和配置管理，需要了解硬件的所有细节。以下是这些信息有用的几个例子。\n\
  \n微软对其操作系统（OS）发布了补丁，导致系统陷入无尽重启循环。系统开始启动、崩溃到蓝屏、恢复并再次启动、然后再次崩溃。当这种循环发生时，问题通常出在特定的制造商和型号。有时，是因为特定的驱动程序或系统在出货前的准备方式造成的。在库存中拥有制造商和型号，可以轻松查看微软的更新是否会影响运行。\n\
  \n### ![](img/Note.png) 注意\n\n硬件清单还可以帮助识别不需要的组件。例如，某些系统可能包含调制调器，这可能会带来重大的风险。如果用户拨号互联网服务提供商（ISP）访问互联网，该连接就是不受控制的。\n\
  \n同样，例如，发现了一个影响特定路由器的严重漏洞。如果硬件清单包含了路由器的制造商和型号，那么确定路由器是否容易受到攻击将变得很容易。如果没有清单，在攻击成功发生之前，可能并不知道路由器的漏洞性。\n\
  \n### 控制硬件购买\n\n许多组织都有控制硬件购买的政策。只有批准硬件列表上的硬件才能被购买。虽然这对于用户来说通常不方便，但它提供了一种额外的安全保障。\n\
  \n首先，应该验证批准列表上的硬件是否仅包含环境所需的必要组件。如果还没有添加某个组件，那么该组件就没有风险。然而，如果添加了不需要的组件，则需要对其管理以减少任何潜在风险。\n\
  \n其次，控制环境中引入的配置数量可以提高可用性。例如，如果所有用户都使用相同的桌面 PC，桌面支持人员只需要学习一种系统的细节。一旦他们掌握了这一个系统，就可以轻松地排除所有系统的故障。另一方面，如果环境中有\
  \ 30 种不同的桌面 PC，排除故障就会变得更加困难。\n\n用户可以访问通常被代理服务器拦截的网站。他们可以下载通常会被防火墙过滤的恶意软件。拨号调制调器允许系统绕过所有控制访问互联网。\n\
  \n## 软件资产\n\n软件资产包括操作系统和应用程序。操作系统启动计算机。操作系统的示例有 `Microsoft Windows`、`Mac OS` 和 `Red\
  \ Hat Linux`。应用程序执行特定的功能或任务。应用程序的示例有 `Microsoft Word` 和 `Adobe Reader`。大多数组织使用数据库跟踪硬件资产。使用同一个数据库跟踪软件资产也是常见的。\n\
  \n在识别软件资产时，具体化是非常重要的。将操作系统列为 Windows 或 Linux 是不够的，因为 Windows 和许多 Linux 发行版（也称为 *发行版*）有许多版本。同样，将应用程序列为\
  \ Word 也不够的\n\n操作系统的细节应包括：\n\n*   安装操作系统的硬件系统\n*   操作系统的名称，例如 `Microsoft Windows\
  \ 10`\n*   已安装的最新服务包\n\n系统的准确清单可以帮助 IT 人员快速识别操作系统是否受到新威胁的影响。例如，IT 人员发现了一个针对 `Microsoft\
  \ Windows 10` 的新漏洞。知道公司有多少台 `Windows 10` 系统以及它们在哪里将有助于他们快速解决漏洞。\n\n另一方面，如果 IT 人员没有准确的清单，他们的工作将变得困难得多，因为他们必须检查所有的系统。即使只需检查\
  \ 50 个系统也会花费时间。对于 5000 个系统，这项任务无法通过手动完成，这使得自动化资产管理变得必要。\n\n\n\n\n然而，如果有准确的资产清单，这项工作将变得简单得多。只需查看一眼清单，就能识别出有多少系统正在运行\
  \ Windows 10。此外，清单会将操作系统与硬件关联起来，IT 人员将确切知道 Windows 10 系统所在的位置。\n\n### 供参考\n\n服务包\
  \ (SP) 是适用于特定操作系统的一组更新、补丁和修复程序。服务包偶尔包含操作系统的额外功能，而且它们通常是累积的。例如，微软在 2011 年 3 月发布了\
  \ Windows 7 SP1，它包含了在此日期之前发布的所有 Windows 7 更新、补丁和修复程序。从 Windows 8 开始，微软用重大更新取代了服务包。例如，Windows\
  \ 8.1 是 Windows 8 的首次重大更新。获取 SP 更新的推荐且最简单的方法是开启计算机上的 Windows 更新，让 Windows 在所需的更新准备好安装时通知你。例如，Windows\
  \ 10 会自动下载并安装所需的更新，确保设备高效安全地运行。\n\n### 自动化资产管理\n\n许多企业级工具用于自动化资产管理。这些工具可以识别网络中的所有硬件，包括台式电脑、服务器以及交换机和路由器等网络设备。\n\
  \n例如，微软销售 System Center 2016 配置管理器 (ConfigMgr)。ConfigMgr 提供远程控制、补丁管理、软件分发、操作系统部署、网络访问保护以及硬件和软件清单。微软\
  \ System Center 2016 为混合云环境提供企业级的数据中心管理。ConfigMgr 可以使用微软域中的工具识别网络中的所有系统。一旦 ConfigMgr\
  \ 识别出系统，它就会有条理地查询每个系统以识别已安装的软件。\n\n在进行正确查询时，大多数系统都会显示出其型号和序列号。管理员可以打印出这些系统及其安装的软件列表。然后，他们可以使用这些列表将假设的清单与实际清单进行比对，并发现未经授权而安装的软件。\n\
  \n列表还将帮助管理员发现两种重要的未经授权软件——恶意软件（它可能对系统或网络造成破坏）以及未经许可的软件。如果一家公司购买了 100 份应用程序，但安装了\
  \ 200 份，该公司可能需要承担不必要的法律责任。\n\n同样，已安装应用程序的细节应包括：\n\n*   应用程序名称，例如 Microsoft Windows\
  \ Office 专业版\n*   版本号\n*   如果有可用的服务包或更新信息\n\n所有这些信息几乎无法手动收集。然而，这一过程是可以自动化的。有许多工具可以识别组织中的所有硬件和软件资产。\n\
  \n## 人员资产\n\n人员资产是指为公司工作的人。任何组织的成功很大程度上归功于其人员。有时，如果任何关键功能都由几名关键人员经过培训，而不是一个人，效果会更好。\n\
  \n当任何功能或流程依赖于一个人时，这个人就变成了一个 `SPOF`（单点故障）。尽管拥有才华横溢的人员是理想的，但过度依赖某一个人并非如此。\n\n许多因素可能导致员工离开环境，包括疾病、事故、家庭紧急情况、中奖、更好的工作或其他更高的报酬。工作条件和薪水可以控制，但大多数其他事情则无法控制。\n\
  \n硬盘可以是一个 `SPOF`，可以通过 `RAID` 进行保护。同样，服务器也可以是一个 `SPOF`，可以使用故障转移集群来防止其故障。\n\n同样，如前所述，人也可以是\
  \ `SPOF`。如果只有一个人知道如何维护系统，那么该系统就处于风险之中。可以通过采取某些措施来降低这种风险，例如：\n\n*   **聘用额外人员**——如果一个关键系统仅由一个人维护，聘用额外人员帮忙可以消除\
  \ `SPOF`。\n*   **交叉培训**——人员应对对不同的系统进行交叉培训。他们仍将执行主要的工作职能，但偶尔会花时间学习其他工作职能。交叉培训有助于扩大人员对整体运营的理解。这样他们就能需要时应对短期紧急情况。\n\
  *   **职位轮岗**——人员可以定期轮换到不同的工作中，例如每年一次。将人员轮换到不同的工作有助于他们建立各种技术的技能，并确保有多个个人知道如何维护任何\
  \ IT 系统。轮岗还有助于组织发现危险的捷径或欺诈活动。人员在岗位之间的轮换有助于 IT 管理员对工作实践获得更多的内部监督，从而确保人员遵守规则和政策，并减少勾通的可能性。勾通是指两个或更多人出于欺诈目的而从事秘密活动的情况。\n\
  \n### 数据和信息资产\n\n另一个需要考虑的重要资产是公司持有的数据和信息。数据的价值怎么强调都不为。组织丢失数据可能导致悲性的结果。\n\n数据通过两种方式受到保护：\n\
  \n*   **访问控制**——访问控制防止数据未经授权的泄露，并有助于保护数据的机密性。\n*   **备份**——备份在数据损坏或意外删除时保护数据。至少应该存在两个备份。一份保留在本地，另一份保留在不同的地理位置。第二份备份可以防止火灾或洪水等灾害。将数据的唯一备份存在服务器上，意味着如果机房在火灾中被，将没有任何备份。\n\
  \n关于数据丢失而失败的公司故事层不完。例如，一家公司一直在增长，其数据存储在台计算机上，包括账单数据（如应付和应收账数据）、客户数据以及公司所有的关键数据。一天，计算机硬盘崩溃了。所有数据无法访问，而且没有备份。由于失去了客户和账单数据，该公司很快。了。另一个是一个未能实施双重身份验证。不幸的是，发生了数据泄露，数百万客户记录被盗，损害了客户的身份和组织的声誉，并导致了财务损失。\n\
  \n### 数据分类\n\n大多数组织都会花时间对其数据进行分类。不同的分类需要不同级别的保护。\n\n政府使用分类，如机密、秘密和绝密。每个分类都有正式定义。例如，绝密数据包括一旦未经授权泄露会对国家安全构成最严重威胁的信息。不同分类的数据接受不同级别的保护。例如，绝密数据将获得最高级别的保护。\n\
  \n**FIGURE 7-2** 显示了组织如何对其数据进行分类。在图中使用了三种分类：公共、私有和专有。\n\n![FIGURE 7-2 数据分类。](img/9781284183719_CH07_FIGF02.png)\n\
  \n**FIGURE 7-2** 数据分类。\n\n组织可以以任何合适的方式定义数据。公共数据可以定义为任何从公共来源（如网站）访问的数据。私有数据可以是客户或员工数据，而专有数据可以是财务数据或从研发产生的数据。\n\
  \n\n\n组织可以使用任何所需的分类标签。标签本身并不如使用数据分类方法重要。换句话说，分类可以是 `Unclassified`（未分类）、`Sensitive`（敏感）和\
  \ `Privileged`（特权），而不是 `Public`（公开）、`Private`（私）和 `Proprietary`（专有）。此外，组织根据需要使用尽可能多的数据分类来保护其数据。然而，组织必须考虑员工创建新数据时的便利程度。\n\
  \n这些故事可能像小说，但事实如此。它们在全国的小企业中反复发生。许多组织在数据丢失之前并没有意识到其数据的价值。然而，一旦数据丢失，恢复就太晚了。\n\n在识别出价值数据后，需要采取措施来保护它们，包括定期备份数据并防止其未经授权的泄露。\n\
  \n数据和信息资产包括以下类别：\n\n* 组织\n* 客户\n* 知识产权\n* 数据仓库\n* 数据挖掘\n\n### 组织\n组织数据包括任何内部使用的数据，其中大部分数据都应保持私密。然而，如果一家公司是上市公司，某些财务数据可能会公布，其中包括：\n\
  \n*   `Employee data`（员工数据）——包括关于员工的任何信息。大多数公司都有内部的人资源（HR）部门来维护员工记录，这些可能包括个人数据、员工评估、医疗选择等。\n\
  *   `Billing and financial data`（账单和财务数据）——包括应付账款、应收账款数据以及任何与公司财务状况相关的数据，可能包括贷款数据和损益表。\n\
  *   `System configuration data`（系统配置数据）——每个系统的配置通常记录在数据库中，包括基本系统配置和任何更改。\n*   `System\
  \ process data`（系统流程数据）——包括显示系统如何运行的文档、标识如何连接的网络拓扑图以及数据流图。例如，图表可以显示电子邮件的流向。\n* \
  \  `Vendor data`（供应商数据）——包括关于向公司提供产品或服务的任何信息。\n\n许多法律都强制保护不同类型的数据。《健康保险流通性与责任法案》（`HIPAA`）强制保护健康相关数据。即使组织没有参与医疗保健，大多数员工档案也包含\
  \ `HIPAA` 数据。《萨萨斯斯-奥克斯利法案》（`SOX`）涉及上市公司公司财务数据的准确性。组织必须保护某些财务数据以符合 `SOX` 的规定。\n\n\
  ### 客户\n客户数据包括公司持有的客户数据。公司选择如何收集和使用客户数据决定了数据是仅限最小的还是构成完整的数据库。例如，公司可能想通过电子邮件向客户发送月度通讯报，这只需要电子邮件地址。如果需要，可以收集客户姓名以实现电子邮件的个性化。\n\
  \n另一方面，公司可能通过网站进行大量销售，这需要收集尽可能的信息。当客户访问公司网站时，了解他们过去购买过什么将允许公司根据这些过去的购买自动生成广告或销售推荐。当客户准备好购买时，他们不需要重新输入信用卡数据，因为数据已经存储了。\n\
  \n客户数据可能包括：\n\n* 姓名\n* 地址\n* 电话号码\n* 电子邮件地址\n* 历史购买记录\n* 应收账款数据\n* 信用卡或银行数据\n* 账户名称和密码\n\
  * 人口统计数据，如年龄和性别\n\n存储的数据越多，该数据集合的价值就越高。例如，某人入侵一个仅存储电子邮件地址的系统并查看这些数据并不一定关键。然而，如果\
  \ `PII`（个人身份信息）是该数据的一部分，多项法律强制要求对其保护。此外，如果收集了信用卡数据且攻击者获取了访问权限，公司可能对财务损失承担责任。\n\n\
  ### 知识产权\n知识产权数据是由个人或组织创建的数据，包括发明、文学和艺术作品、符号、名称和图像。世界知识产权组织（`WIPO`）将知识产权分为两类：\n\n\
  *   `Industrial property`（工业产权）——包括工业设计、商标、发明和专利\n*   `Copyright`（版权）——包括文学和艺术作品（如书籍、电影和音乐）以及艺术作品（如绘画和图形）\n\
  \n组织可以拥有这两类类知识产权，取决于公司的功能。例如，唱片公司可能关注版权知识产权。然而，一家医学研究公司可能只关注工业产权。\n\n国家和国际法律都保护知识产权。然而，小偷仍然在窃取。如果数据没有受到保护，投入到财产创建中的资金可能会损失。例如，一家电视公司可能花费数年数百万美元开发一种提供色彩鲜艳\
  \ 3D 视图的新屏幕。在公司准备上市前约六个月，竞争对手获取了所有研究数据，然后创建了类似的产品。由于竞争对手不需要收回研发成本，它实际上可以比创建它的公司更便宜地出售电视。\n\
  \n任何知识产权的组织都需要保护它。保护级别取决于其价值。\n\n### 数据仓库与挖掘\n`Data warehousing`（数据仓库）和`data mining`（数据挖掘）技术相结合从大型数据库中检索有意义的数据。尽管数据库可以托管大量数据，但这些数据并非直接可用。目标是将原始数据转换为有用的情报，可以通过数据仓库和数据挖掘来实现：\n\
  \n*   `Data warehousing`（数据仓库）——从不同数据库收集数据的过程。数据从源数据库检索并放在中央数据库中。在中央数据库（即数据仓库）中创建源数据库的新关系。仓库中的数据不被修改。相反，数据在源数据库中修改。定期刷新数据仓库中的数据，使数据仓库与源数据保持同步。刷新数据仓库可能非常消耗资源。\n\
  *   `Data mining`（数据挖掘）——一组用于从数据仓库检索相关数据的技术。决策者能够从不同角度查看数据，从而允许他们对未来事件做出预测。例如，经理可以预测公司在\
  \ 12 月将销售多少特定产品。\n\n大多数数据库被优化为在线事务处理（`OLTP`）数据库，这意味着它们可以快速记录交易。`transaction`（事务）是任何类型的数据添加、删除或修改。例如，`OLTP`数据库擅长记录销售。然而，`OLTP`数据库对于数据分析并不有效。相反，`OLTP`数据库在数据仓库中被重新组织，并可以与一个或多个\
  \ `OLTP` 数据库结合。一旦数据库经过重新组织，数据挖掘就可以检索相关数据。\n\n\n\n数据挖掘是整个业务智能（BI）解决方案的一部分。BI 解决方案试图在决策者需要时，为其提供可操作的智能信息。BI\
  \ 解决方案也被称为决策支持系统。其核心思想是数据库存储了决策者可能提出的任何问题的答案。通过创建数据仓库并使用数据挖掘技术，可以方便地获得这些答案。\n\n\
  例如，以下是经理可能提出的某些问题：\n\n*   该机构今年销售了多少个小部件？\n*   小部件销售的峰月份是哪个月？\n*   本季度表现最好的销售员是谁？\n\
  *   本季度表现最差的销售员是谁？\n*   本季度每个地区的销售额是多少？这些数字与去年同期的销售额相比如何？\n\n如果一个机构使用了了数据仓库，则需要建立相关方法来保护源数据库和数据仓库。最重要的元素是拥有有效的备份策略。此外，提取、转换和加载（`ETL`）过程通常需要大量的开发时间。人员使用脚本或工具创建\
  \ `ETL` 过程以识别各个步骤。`ETL` 过程应该包含在备份策略中。\n\n### 提取、转换和加载\n\n使用提取、转换和加载（`ETL`）技术将数据从数据库移动到数据仓库。`ETL`\
  \ 过程是 BI 解决方案的重要元素。数据库开发人员识别要检索的数据、如何针对目标数据库对其修改以及如何进行加载。这三个步骤是：\n\n*   **提取**——从现有数据库中检索数据的过程。并不是所有数据都会提取。相反，只检索与决策者相关的数据。例如，可以提取某些客户销售数据以进行分析。然而，其他客户数据（如信用卡数据）可能不需要，因此不进行提取。\n\
  *   **转换**——将数据转换为数据仓库所需的通用格式的过程。例如，一个数据库可能将男性性别标识为“M”，而另一个数据库使用“Male”。“M”或“Male”都没有错。但是，在目标数据库中，该标记需要保持一致。转换过程将更改数据，使其在数据仓库中保持一致。\n\
  *   **加载**——将数据加载到数据仓库的过程。数据在被转换为标准格式后进行加载。取决于数据仓库的配置方式，可以在不同位置加载相同的数据。虽然这对于 OLTP\
  \ 数据库来说效率并不高，但对于数据挖掘性来说是高效的。\n\n`ETL` 过程使用脚本或其他技术实现自动化。如有必要，可以定期对新数据执行该操作，使数据仓库与实际源数据保持同步。\n\
  \n`Big data` 是一个新术语，许多数据库专家在讨论非常大的数据库时会使用。它指的是任何庞大且复杂，至于难以用现有的数据库工具处理的数据集。相反，专家们构建新的应用程序来满足这些大型数据集的需求，但目标与较小的数据集相同。专家构建工具来捕获和存储数据。然后他们添加工具，使决策者能够查询数据以回答特定问题。\n\
  \n### 典型 IT 基础设施七域内的资产和库存管理\n\n从典型 IT 基础设施七域的角度来看 IT 管理问题，为管理资产提供了一种结构化的方法。这七个域包括：\n\
  \n*   用户域 (User Domain)\n*   工作站域 (Workstation Domain)\n*   局域网域 (LAN Domain)\n\
  *   广域网域 (WAN Domain)\n*   远程访问域 (Remote Access Domain)\n*   系统域 (System Domain)\n\
  *   应用域 (Application Domain)\n\n对于每个域，组织必须确定如何管理库存和资产。这涉及识别硬件、软件和数据资产，并确保它们受到保护且保持更新。\n\
  \n\n\n在资产管理系统中，也应该包含这些设备的配置数据。例如，可以运行脚本来配置路由器和交换机。这些脚本配置设备通过或阻塞特定的流量。如果设备丢失了配置，将重新运行脚本，当然，这假设脚本是可用的。如果脚本不可，则需要逐行输入配置数据。如果没有之前的配置数据记录，则必须对设备进行故障排除，直到其恢复到原始配置。\n\
  \n### 注意\n在当今大多数组织中，交换机已经取代了集线器。交换机的效率更高，因为它将流量减少到仅必要的范围。此外，交换机通过将网络流量引导到目标系统，而不是广播到所有连接的系统，提供了额外的安全层。当使用交换机代替集线器时，使用协议分析器的攻击者只能捕获有限的数据。\n\
  \n### 局域网到广域网域 (LAN-to-WAN Domain)\n该域是指内部 `LAN` 连接到广域网（`WAN`）的区域。在这种背景下，`WAN` 通常是互联网。这里需要关注的主要设备是防火墙。单个防火墙或多个防火墙创建一个非军事化区（`DMZ`）或缓冲区，可以将\
  \ `LAN` 与 `WAN` 分隔。\n\n`LAN`-to`WAN`域中的防火墙是硬件防火墙。它们可以被编程允许和阻塞特定流量。资产管理系统应包含以下信息：\n\
  \n* `硬件信息`——包括基础信息，如型号和序列号。如果型号支持不同的扩展组件，如额外的内存或网络接口卡，也应包含在内。\n* `配置数据`——创建防火墙策略需要花费大量时间，之后应创建防火墙规则以及实施该策略的例外情况。至少，所有这些规则和例外都需要记录在案。尽可能地，为了自动化这一过程，应该创建脚本并进行备份。\n\
  \n### 广域网域 (WAN Domain)\n`WAN` 域包含直接访问互联网的服务器。这些服务器包括所有具有公共互联网协议（`IP`）地址且在 `DMZ`\
  \ 中面向公共网的服务器。\n\n### 注意\n内部计算机可以访问互联网，但不是直接访问。大多数组织通过代理服务器引导客户端流量，以提供客户端间接访问互联网。代理服务器具有具有公共\
  \ `IP` 地址的 `WAN` 连接性，以及具有私有 `IP` 地址的内部客户端的连接性。\n\n大多数组织在 `WAN` 域中不会有很多服务器。然而，`WAN`\
  \ 中的任何服务器风险都高得多。采取额外措施确保这些服务器尽可能地进行加固是非常重要的。\n\n基于广域网的服务器的清单和资产管理信息包括：\n\n* `硬件信息`——包括基础信息，如型号和序列号。文档记录与\
  \ `LAN`-to`WAN` 域中服务器的记录方式类似。\n* `更新信息`——`WAN` 中的服务器需要保持更新，这是确保服务器保持安全的重要步骤。随着补丁、修复和更新的发布，需要对它们进行评估。如果需要更新且测试显示没有负面影响，则应该应用。服务器的更新可以是手动或自动的。无论何种方式，拥有服务器已安装更新的准确记录都是重要的。\n\
  \n### 注意\n加固服务器使其比默认安装更安全。首先要做的工作是删除不需要的服务和协议，并启用本地防火墙。此外，应该在测试更新后定期应用更新，以保持服务器最新。\n\
  \n### 远程访问域 (Remote Access Domain)\n远程访问技术允许用户通过外部位置访问内部网络。这一过程可以通过直接拨号或虚拟专用网络（`VPN`）完成。\n\
  \n当使用拨号时，客户端和服务器拥有调制解调器并连接电话线。当使用 `VPN` 时，`VPN` 服务器在互联网上有一个可用的公共 `IP` 地址。客户端访问互联网，然后使用隧道协议访问\
  \ `VPN` 服务器。\n\n远程访问域服务器所需的清单和资产管理信息与 `WAN` 域中的类似。然而，对于拨号远程访问服务器，还需要包含拨号设备，包括调制解调器和电话交换机（`PBX`）设备：\n\
  \n* `调制解调器`——远程访问服务器的调制解调器比客户端简单的调制解调器更复杂。它们通常以多个调制解调器组的形式配置，并被编程回答来自多线的电话。\n* `PBX\
  \ 设备`——电话系统使用 `PBX` 管理。`PBX` 通常带有完整操作系统的微服务器形式。\n\n### 系统/应用域 (System/Application\
  \ Domain)\n系统/应用域包含用于托管应用程序的服务器。应用程序服务器类型的示例包括：\n\n* `邮件服务器`——可以是单个电子邮件服务器，也可以较大的电子邮件解决方案，包括前端和后端服务器配置。\n\
  * `数据库服务器`——可以是 Oracle 或 Microsoft SQL 服务器，作为单个服务器或服务器组中的一个。\n* `Web 服务器`——Web 服务器托管网站并为\
  \ Web 客户端服务。单个 Web 服务器可以托管一个网站或数百个网站。\n* `网络服务服务器`——包括域名系统（`DNS`）服务器和动态主机配置配置协议（`DHCP`）服务器。\n\
  \n资产管理系统应包含系统/应用域中任何服务器的以下信息：\n* `硬件信息`——包括基础信息，如型号和序列号，就像对工作站进行清单一样，以及硬件组件的清单。\n\
  * `更新信息`——服务器需要保持更新，如果任何服务器是面向公共的（例如 Web 服务器和某些邮件服务器），这一点尤为真实。\n\n### 注意\n`VPN`\
  \ 通过公共网络（如互联网）提供对网络的访问。\n\n### 识别维护业务运营所需的设施和物资\n事故和灾难会发生，其中某些灾难可能是如此灾难性的，以至于业务停止运行。确保业务在灾难后仍能继续运行需要规划。\n\
  \n在规划过程中可以采取若干步骤。这些包括：\n* 关键任务系统和应用程序识别\n* 业务影响分析规划\n* 业务连续性计划\n* 灾难恢复规划\n* 业务责任保险规划\n\
  * 资产更换保险规划\n\n#### 关键任务系统和应用程序识别\n任何规划的首要步骤是识别哪些系统和应用程序是关键任务的。关键任务系统是指任何必须继续运行以确保业务继续运行的系统。同样，关键任务应用程序必须继续运行以确保业务继续运行。\n\
  \n在首先了解组织如何运作之前，确定什么是关键任务是不可能的。例如，公司内的销售人员直接向客户销售产品，客户通过电话或面对面提交订单。销售人员将订单输入到连接后端数据库的应用程序中。在这个示例中，关键任务元素是销售人员、电话、应用程序和后端数据库。\n\
  \n\n\n\n另一方面，某公司销售与上一个示例相同的产品。然而，客户能够直接通过网站下单。此外，他们可以通过电子邮件将订单发送给销售人员，然后由销售人员将订单输入应用程序中。该应用程序与网站使用的数据库相连。客户也可以电话下单，但这种比例不到\
  \ 10%。在这个示例中，该机构拥有的任务关键系统比第一个示例中多。销售人员、电话、应用程序和后端数据库仍然是任务关键的，但网站应用程序和电子邮件也将是任务关键的。\n\
  \n这里需要记住的一点是，系统的重要性取决于其被使用的方式。一个机构可能认为某个特定系统是任务关键的，而另一个机构可能认为同一个系统是可丢弃的。\n\n## 业务影响分析规划\n\
  \n业务影响分析 (BIA) 用于识别业务功能突然中断的影响。这种影响通常用成本来量化。计算影响时会使用直接成本和间接成本。直接成本是销售额的即时损失或与恢复损失相关的费用。间接成本则与客户信任的丧失有关。\n\
  \nBIA 提供了对特定 IT 服务故障影响的分析。例如，可以使用 BIA 来确定电子邮件丢失或特定数据库丢失的影响。BIA 还有帮助机构确定公司继续运营所需的最小服务集。\n\
  \n例如，远程用户可能使用 VPN 技术从远程位置连接到私有网络。如果 VPN 服务停止，对业务会有什么影响？可以通过完成 BIA 来做出这一判断。\n\n远程用户可能还有其他方法可以连接到公司。例如，远程用户可能仍然可以通过网页访问电子邮件，远程销售人员可能仍然能够通过电话下单。BIA\
  \ 可能会确定，尽管 VPN 服务很有价值，但它们的丢失对公司的整体任务影响微乎其微。\n\n另一方面，针对电子邮件服务的 BIA 可能会确定电子邮件的丢失会对公司产生重大影响。电子邮件可能用于客户接触、项目任务分配、跟踪以及其他重要通信。\n\
  \n在完成 BIA 时，将采取以下步骤：\n\n*   **定义范围**——BIA 的范围局限于特定的 IT 系统。例如，BIA 可以检查电子邮件或网站丢失的影响。如果范围局限于电子邮件的丢失，则不应包括额外\
  \ IT 服务的丢失。通过在项目早期定义范围，可以减少范围蔓延（scope creep）的可能性。可以针对特定地点的服务完全丢失进行 BIA。例如，一家公司可能有多个地点，其中一个可能位于地震或飓风区。BIA\
  \ 可以确定如果灾害导致该地点服务完全丢失产生的影响。\n\n*   **确定目标**——BIA 目标与 BIA 的范围有关。目标具体规定了 BIA 应该实现的成果。例如，一项\
  \ BIA 任务可能包括以下目标：\n    *   确定电子邮件服务丢失一个工作日的直接影响\n    *   确定电子邮件服务丢失一个工作日的间接影响\n\
  \    *   计算电子邮件服务丢失三个工作日的影响\n    *   计算电子邮件服务丢失五个工作日的影响\n\n*   **识别任务关键业务功能和流程**——所有的业务功能和流程都是任务关键的。某些功能虽然方便并有助于提高效率，但即使没有它们，任务仍然可以维持。BIA\
  \ 将关键与非关键功能隔离开来。\n\n*   **将业务功能和流程映射到 IT 系统**——这一步可以简单，也可以复杂。例如，如果 BIA 分析由一个电子邮件服务器提供的电子邮件服务，那么\
  \ IT 系统就是该电子邮件服务器。另一方面，如果一个机构使用 Microsoft SharePoint 来增加员工之间的协作，那么分析可能会非常复杂。SharePoint\
  \ 解决方案可能包括 Web 服务器、文件服务器和数据库服务器。关于 IT 系统的文档将有助于完成这一步。\n\n### ![](img/Note.png) 注意事项\n\
  \nBIA 是业务连续性计划的重要部分，也可以作为灾难恢复计划（DRP）的一部分。\n\nBIA 的结果是 BIA 报告，记录了分析结果。它通常包括直接和间接成本、最大可接受机时间以及恢复所需的材料或资源。\n\
  \n### 业务连续性规划\n\n业务连续性计划 (BCP)是一种帮助公司规划灾难的文档。目标是确保关键业务持续。BCP 包含了恢复的程序和指令。\n\n在完成\
  \ BCP 时，将采取以下步骤：\n\n1. 识别范围\n2. 识别关键业务领域\n3. 识别关键功能\n4. 识别业务领域与关键功能之间的依赖关系\n5. 确定可停机时间\n\
  6. 创建维持运营的计划\n\nBIA 报告中的细节有助于创建 BCP。BIA 和 BCP 通常是相互完成的。\n\nBCP 包含了针对不同阶段可以采取的具体步骤。各阶段的内容取决于灾害。例如，飓风会有充足的预警。一个阶段可能是发生前\
  \ 72 小时，另一个阶段可能是发生前 36 小时。然而，地震或火灾就不会包含这些阶段。\n\nBCP 阶段包括：\n\n*   **通知/激活阶段**——评估小组被激活以应对紧急情况。这些小组可以在紧急情况发生前激活，例如飓风。对于更直接的紧急情况（如火灾），在紧急情况发生时进行通知。该阶段的目标是采取措施继续运营。\n\
  \n*   **恢复阶段**——在此阶段，将对损坏进行评估。如果发生任何损失，可以立即采取措施恢复系统。该阶段的重点是任务关键系统。\n\n*   **重组阶段**——在此阶段，机构恢复到正常运营。如果任何任务关键系统通过恢复操作保持了运行，则可以将其正常化。例如，在恢复阶段转移到备用服务器的操作可以返回原始服务器。非任务关键系统也可以在此阶段恢复运行。\n\
  \n### 灾难恢复规划\n\n灾难恢复计划 (DRP) 包含了从灾难中恢复系统所需的细节，并提供了了立即响应灾难的必要细节。DRP 包含在 BCP 之中。\n\
  \n有时，BCP 和 DRP 术语互用。然而，它们是独立的。这些区别值得注意：\n\n*   **BCP**——BCP 是一种用于应急响应的整体计划。它识别机构的关键系统，包括可接受的机时间。BCP\
  \ 包含了针对单个 IT 系统的 BIA 和 DRP。\n\n*   **DRP**——DRP 是 BCP 的组成部分。它包含了灾难后恢复一个或多个系统所需的细节。例如，火灾可能毁了机房内的几台服务器。DRP\
  \ 识别了恢复服务器所需的步骤，包括从备份恢复数据。\n\n\n\n\n\n# BCP 与 DRP\n\n某些文档表明 `BCP` 和 `DRP` 是一回事，但它们并非如此。尽管它们经常结合使用，但\
  \ `BCP` 和 `DRP` 确实提供不同的价值。\n\n在准备国际信息系统安全认证联合会 `[(ISC)²]` 注册信息系统安全专家 (CISSP) 和 系统安全认证从业员\
  \ (SSCP) 考试时，记住 `BCP` 和 `DRP` 不是同一样是非常重要的。CISSP 考试的一个领域是业务连续性与灾难恢复规划，该领域拆分了 `BCP`\
  \ 和 `DRP` 主题，并要求考生了解它们之间的区别。同样，SSCP 考试也包含 `BCP` 和 `DRP` 主题的独立目标。\n\nNIST 发布了 `SP\
  \ 800-34》《信息技术系统应急计划指南》，其中提供了以下定义：\n\n- `业务连续性计划 (BCP)`——“对一组预设指令或程序进行文档记录，描述了在重大中断期间和之后，组织的任务/业务流程将如何维持。”\n\
  - `灾难恢复计划 (DRP)`——“一份书面计划，用于在发生重大硬件软件故障或设施破坏时，在备用设施恢复一个或多个信息系统。”\n\n这些定义表明 `BCP`\
  \ 的范围比 `DRP` 更广。`BCP` 帮助组织继续运营，而 `DRP` 则侧重于在大故障后恢复一个或多个系统。\n\n请注意，系统可能已经恢复，但仍无法执行关键任务操作。例如，火灾摧毁了一栋建筑。单个数据库服务器可能可以恢复（包括来自离线备份的数据）。然而，该服务器并不一定能恢复所有的关键操作。\n\
  \n## 责任保险规划\n\n主要的风险管理技术包括规避、共享或转移、缓解和接受。风险可以通过外包和购买保险来共享或转移。业务责任保险用于保护组织免受诉讼影响，并涵盖公司因诉讼产生的损害赔偿以及法律费用。\n\
  \n存在三种主要的业务责任保险。所需的保险类型取决于业务的功能。责任保险的类型有：\n\n- `通用 (General)`——大多数组织都会购买通用保险。它对人身伤害索赔和财产损失提供保护，提供涵盖大多数诉讼的整体伞式保障。这可能是一个组织需要的所有内容。\n\
  - `专业 (Professional)`——这种保险在员工提供错误或不准确的建议时保护公司。它包括对职业过失、错误和疏忽的保护。为其他公司提供 IT 服务的可能需要这种。\n\
  - `产品 (Product)`——这种保险在客户因使用其产品而受伤时保护公司。例如，移动电脑中的电池可能会引发风险。如果故障电池导致火灾，这种保险将提供保护。\n\
  \n## 资产替换保险规划\n\n另一种购买的保险是资产替换保险，旨在替换因灾难受损的资产。这种保险通常与其他预防灾难的步骤结合购买。\n\n例如，组织可能想保护自己免受火灾损坏。它可以安装灭火设备并在整个建筑放置便携灭火器。然而，尽管尽了努力，火灾仍可能发生。\n\
  \n如果火灾导致损坏，火险可以帮助公司更换资产。其他提供资产保护的保险类型包括：\n\n- 洪水险\n- 飓风、风、龙风或其他天气险\n- 特定人员（如关键官员）的人寿险\n\
  \n购买的保险取决于许多因素，包括组织资产的价值。对于廉价资产，保险的成本是不合理的。几年的保险费用可能比更换产品还贵。购买的保险还取决于相关风险。例如，飓风险对于佛罗里达州、路易斯安州和德克萨斯州等沿海州是相关的，但对于爱荷华州或俄亥州等内陆州无关。\n\
  \n## 章节总结\n\n本章提供了有关识别资产的信息。资产识别是任何风险识别过程中重要的第一步。组织的资产包括硬件和软件、数据和信息资产以及人员。典型 IT\
  \ 基础设施的七个领域可以确保所有资产都得到识别。\n\n一旦识别了资产，就可以各种工具进行保护。业务影响分析有助于识别服务失败对业务的影响，有助于确定最重要资产的优先级。灾难恢复计划记录了恢复故障系统需要采取的步骤。业务连续性计划范围更大，用于帮助确保关键任务系统在灾难后仍继续运行。\n\
  \n## 核心概念与术语\n\n- `资产管理 (asset management)`\n- `大数据 (big data)`\n- `业务连续性计划 (BCP)`\n\
  - `业务影响分析 (BIA)`\n- `数据挖掘 (data mining)`\n- `数据仓库 (data warehousing)`\n- `灾难恢复计划\
  \ (DRP)`\n- `故障转移集群 (failover cluster)`\n- `通用数据保护条例 (GDPR)`\n- `库存管理 (inventory\
  \ management)`\n- `服务包 (SP)`\n\n## 第 7 章评估\n\n1. 即使服务器需要定期重启，确保服务在 99.999% 的时间内运行的也是可能的。\n\
