  \ Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n© Sai Chan/Shutterstock\n\n##\
  \ 第 8 章：识别和分析威胁、漏洞和利用程序\n\n当威胁能够利用漏洞时，**风险**就会发生。考虑到这一点，识别和分析威胁、漏洞和利用程序至关重要。这些过程可以通过威胁评估、漏洞评估和利用程序评估来完成。\n\
  \n威胁评估试图识别威胁，但它无法识别所有可能的威胁。相反，它试图识别尽可能多的可能威胁。通过审查历史数据和使用不同的威胁建模技术，可以识别出威胁。\n\n通过进行漏洞评估可以识别网络中的弱点。有多种方法可以发现这些弱点。一些是手动的，例如审查文档、执行审计或访问人员；另一些是使用漏洞扫描器进行自动化的。\n\
  \n利用程序评估试图识别实际上可以被利用的漏洞。\n\n### 第 8 章主题\n\n本章涵盖了以下主题和概念：\n* 什么是威胁评估\n* 什么是漏洞评估\n\
  * 什么是利用程序评估\n\n### 第 8 章目标\n\n完成本章后，你将能够：\n* 描述用于识别威胁的技术\n* 列出在典型 IT 基础设施七个领域内进行威胁评估的最佳实践\n\
  * 描述在漏洞评估中审查文档的价值\n* 描述在漏洞评估中审查系统日志、审计跟踪和入侵检测系统输出结果的价值\n* 识别用于执行漏洞扫描的构/工具\n* 描述在漏洞评估中执行审计和人员访谈的价值\n\
  * 在漏洞评估的背景下描述并对比过程分析和输出分析\n* 描述用于漏洞评估的各种类型系统测试\n* 列出在典型信息技术（IT）基础设施七个领域内进行漏洞评估的最佳实践\n\
  * 识别典型 IT 基础设施七个领域中的利用程序\n* 描述如何使用差距分析和修复计划来缓解利用程序\n* 解释配置管理和变更管理对于缓解已识别利用程序的价值\n\
  * 描述如何验证和确认利用程序已得到缓解\n* 列出在典型 IT 基础设施中执行利用程序评估的最佳实践\n\n## 威胁评估\n\n`threat assessment`\
  \ 识别并评估潜在威胁。目标是识别尽可能多的潜在威胁，然后对这些威胁进行评估。一个重要因素是对威胁频率的估计。\n\n风险评估和威胁评估有一个共同点：时间。风险评估是在特定时间进行的。今天存在的风险在一年后可能不再存在。同样，威胁评估是在特定时间进行的。威胁评估评估现有环境中的当前威胁。\n\
  \n#### 注意\n\n威胁评估并不总是完全的。列出所有潜在威胁将花费过的时间和精力。相反，目标是识别最可能的威胁。考虑到这一点，威胁评估没有单一的“正确结果”。\n\
  \n`threat`（威胁）是指任何代表可能危险的活动，包括对以下内容产生负面影响潜的任何情况或事件：\n* **机密性**（Confidentiality）：机密性丢失会导致数据的未经授权披露。可以使用访问控制来确保只有特定用户访问数据，加密技术有助于保护机密性。\n\
  * **完整性**（Integrity）：完整性丢失会导致数据的修改或破坏。访问控制保护数据免受想要修改或破坏数据的恶意攻击者的侵害，哈希技术通过检测数据是否被修改来验证完整性。\n\
  * **可用性**（Availability）：可用性丢失会导致在需要时对服务或系统的访问受限。各种容错策略确保即使发生故障，系统和服务也能继续运行，并对数据进行备份，以确保即使数据丢失或损坏也能恢复。\n\
  \n当威胁与漏洞匹配时，就会产生风险。以下公式显示了风险、漏洞和威胁之间的关系：\n\n`Risk = Vulnerability × Threat`\n\n\
  `图 8-1` 显示了对组织的各种威胁。它们被通泛地归类为人为或自然。人为威胁可以是内部的或外部的，也可以是故意的或无意的。自然威胁源于天气或其他非人为事件。\n\
  \n![图 8-1 组织的威胁。](img/9781284183719_CH08_FIG01.png)\n\n**图 8-1** 组织的威胁\n\n外部攻击者可以包括对网络发动拒绝服务（`DoS`）攻击的黑客；试图访问、修改或破坏组织数据的恶意软件编写者；甚至是对建筑或整个城市发动攻击的恐怖分子。\n\
  \n内部用户也可能造成。不满的员工可能会访问、修改或破坏组织的数据。如果不使用适当的访问控制，其他员工也可能访问、修改或破坏数据。虽然不满员工的行为是有意的，但普通员工的行为是无意的。\n\
  \n虽然恶意内部人员造成的损失一直是公司面临的最大威胁之一，但这一趋势正在发生逆转。根据 2020 年 EY 全球信息安全调查，约 59%的组织在过去的 12\
  \ 个月内遇到过安全事件。同一调查显示，48%的董事认为与安全相关的攻击和破解将在未来 12 个月内对其业务产生中等以上的影响。遗憾的是，只有 36%的组织报告说在任何新业务计划的规划中包含了网络安全，尽管\
  \ 77% 的新计划支出专注于风险和合规。\n\n### 减少内部威胁\n\n内部威胁可能会造成损害。某些内部威胁是无意的，另一些是恶意的。然而，如果对员工进行培训并控制其行为，大量的威胁将会减少。\n\
  \n来自内部的常见威胁包括：\n\n\n\n\n\n*   **无意访问**——当用户访问了他们不需要的数据时，数据就会处于风险之中，因为用户可能会意外删除数据，或将数据分享给不应拥有访问权限的人。访问控制保护数据，包括确保身份验证过程是安全的，并执行最小权限原则和知情范围限制策略。\n\
  *   **不满的前员工**——当员工被解雇时，其用户账户应当被删除或禁用。如果两者均未执行，前员工可能能够访问相同的数据或系统，也可能将其凭据交给公司内部的其他人员作为代理。未经授权的访问可能导致数据损坏或系统破坏。\n\
  *   **应对钓鱼攻击**——钓鱼攻击试图诱导用户放弃信息或执行他们通常不会执行的操作。某些钓鱼邮件包含指向恶意网站的链接。如果用户点击该链接，可能会在无意中向其系统安装恶意软件。更复杂的钓鱼尝试针对特定公司并欺骗用户。`鱼叉式钓鱼`（Spear\
  \ phishing）是一种针对性的钓鱼尝试，看起来像是来自公司内部的人。培训可以帮助用户识别这些攻击。\n*   **转发病毒**——用户可能会打开受感染的邮件并将其转发给同事，而没有意识到危险，或者通过通用串总线（USB）闪盘从家里带来病毒。最新的杀毒软件可以防止已知病毒，培训可以帮助用户理解病毒是如何复制的，技术策略可以防止使用\
  \ USB 闪盘。\n*   **缺乏笔记本控制**——笔记本电脑很容易被盗。当用户不对笔记本进行物理控制时，电脑往往会消失，组织将失去硬件和软件。此外，笔记本上的数据也会遭到。培训用户笔记本被盗的频率有助于他们理解保护设备的必要性。\n\
  *   **高级持续性威胁 (APT)**——APT 是一种由犯罪分子或国家长期实施的复杂网络攻击，旨在窃取数据或监控系统。犯罪分子或攻击者通常有明确的目标，他们花费时间和资源来识别想要窃取或破坏的资产的漏洞。鉴于其复杂性，他们可以长时间不被发现。攻击方法可以以软件的形式存在，动机可能是财务、政治间谍活动或控制。例如包括钴蓝小组对全球金融机构的攻击，包括对自动取款机（ATM）、银行卡处理系统、支付系统以及全球银行金融电讯协会（SWIFT）系统的攻击。另一个例子是“幻影豹”（Mythic\
  \ Leopard）对印度军的攻击，特别是通过伪装成印度智库对中央调查局和印度军发起的鱼叉式钓鱼攻击。\n\n自然威胁包括火灾和天气事件，如洪水、地震、龙卷风和雷暴。威胁评估的目标是识别威胁，这可以通过审查历史数据和使用威胁建模来完成。\n\
  \n在识别威胁后，需要确定威胁发生的概率，因为某些威胁发生的可能性比其他威胁更高。接下来，对威胁进行优先级排序。有时，可以将威胁与漏洞匹配以确定成本。然而，有时在不完成漏洞评估的情况下无法无法确定的。威胁评估的最后一步是提供一份报告，列出发现的结果并包括威胁及其概率以及任何识别出的成本。\n\
  \n关于威胁评估的本节包括：\n\n*   识别威胁的技术\n*   在典型 IT 基础设施七个领域内进行威胁评估的最佳实践\n\n## 识别威胁的技术\n\n\
  使用两种主要技术来识别威胁：审查历史数据和执行威胁建模。选择哪种技术很大程度上取决于环境和可用材料，但两种技术也可以结合使用。\n\n如果有历史数据，审查这些数据通常是更简单的方法。历史数据提供了有关过去威胁的具体信息。然而，无法保证过去的威胁会重复，或不会出现新的威胁。相反，威胁建模比审查历史数据更复杂，因为需要从更广泛的视角检查系统和服务，这这可能非常耗时。\n\
  \n### 审查历史数据\n\n确定存在哪些威胁的最佳方法之一是分析过去的事件。这些事件包括组织内部、相似组织以及当地地区发生的事件：\n\n*   **组织**——对过去事件的审查将揭示导致损失的威胁。\n\
  *   **相似组织**——与同一业务领域的其他组织发生的事件将揭示该组织可能面临的威胁。\n*   **当地地区**——自然和天气事件可能会在同一地区再次发生。\n\
  \n这些数据可以通过编制记录和进行采访来收集。可以从任何现有记录编制数据，包括安全记录、保险理赔和故障排除记录，以确定停机及其原因。可以与管理层和其他员工进行采访。管理层了解导致重大损失的特定威胁，而员工通常非常清楚问题所在以及威胁在哪里。\n\
  \n**组织的历史数据**。可以审查组织的历史数据，以识别由威胁引起的过去事件。过去的事件可以有多种形式，例如由于用户无意或恶意导致导致的问题，或来自外部攻击者或自然事件的问题。\n\
  \n以下是由于威胁引起的过去事件示例：\n\n*   **内部用户**——用户被授予了他们不需要的数据访问权限，或者他们偶然发现并与同事分享，导致机密数据未经授权泄露。\n\
  *   **不满的员工**——一名员工在周一因故终止，但他的账户没有禁用或删除。该员工在周三访问了他的账户并删除了大量数据。部分被删除的数据没有备份并永久丢失。\n\
  *   **设备故障**——服务器在电压激增后崩溃并一直处于机机数小时，直到更换了电源。\n*   **软件故障**——数据库服务器上的订单数据库应用程序崩溃，服务器必须从头开始重建。管理员重新安装了操作系统，然后安装了数据库应用程序。他们从备份中恢复了数据。此过程花费了\
  \ 10 多小时，期间客户无法下单。\n*   **数据丢失**——所有用户都被要求将数据存储在中央文件服务器上，数据每周周日备份一次。文件服务器在周三崩溃，许多用户丢失了超过两天的工作。\n\
  *   **攻击**——邮件服务器感染了病毒，病毒传播到所有邮件用户的邮箱。清理系统并为用户恢复邮件服务大约需要两天时间。\n\n### ![](img/Tip.png)\n\
  \n知情范围限制和最小权限原则规定，用户仅被授予执行工作所需的访问权限。知情范围限制规定用户仅访问他们需要的数据。最小权限原则规定用户仅拥有执行工作所需的权利和权限。\n\
  \n\n\n\n这些示例每一个只展示了威胁，但可以实施各种控制措施来防止这些威胁。例如，如果用户可以访问他们不需要的数据，就可以实施**最小权限原则**和**按需知原则**。然而，此阶段的目标仅仅是识别威胁。\n\
  \n## 相似组织的历史数据\n\n许多威胁对于相似的组织是共同的。通过识别相似组织面临的威胁，可以识别特定组织可能面临的威胁。例如，攻击者喜欢攻击执法网站。几年前，发生过许多此类网站被篡改的事件。然而，大多数执法机构现在已经意识到这一威胁，并采取了额外措施来保护他们的网站。\n\
  \n任何拥有面向网服务器的组织都面临类似的威胁。`Apache` 是一种流行的 Web 服务器产品，可以在 `UNIX`、`Linux` 和 `Microsoft`\
  \ 平台上运行。它通过互联网提供网页。任何托管 `Apache` 的公司都面临与拥有面向网服务器公司相同的威胁。\n\n![](img/Note.png) 注意事项\n\
  \n攻击者通过更改内容来篡改网站。例如，用户看到的可能不是网站的首页，而是色情网站的首页。此外，攻击者通常会留下某种类似“名片”。在页面的某个地方，攻击者可能会包含类似于“hacked\
  \ by xxx”的文本。另一种体是“p’wned by xxx”。`Pwn` 和 `p’wned` 是征服（被征服）的俚语。换句话说，攻击者在炫耀他们征服了该网站。\n\
  \n## 区域数据\n\n当地的首要考虑是天气状况和自然灾害。如果一个位置位于沿海，且该地区过去发生过飓风，那么未来很可能再次发生飓风。如果一个位置位于洪水区，它未来很可能发生洪水。\n\
  \n任何住在该地区的人都知道自然威胁是什么。新到该地区的人可以采访员工或其他当地人，并且应该获得一个以上的视角，因为一个人的灾难可能是另一个人的轻微不便。不应该仅根据轶事证据采取措施解决问题。\n\
  \n例如，当地员工可能住在洪水区。他们可能会讲述一些可怕的故事，讲述洪水是如何涌入他们家中并摧毁一楼所有物的。虽然这一事件对他们来说是可怕的，但它之前的发生并不意味着你的组织未来会发生洪水。这些信息应该与其他来源进行平衡，例如洪水区地图，它准确显示了可能发生洪水的区域。如果组织位于高地且不在洪水区，则不需要采取措施保护其免受洪水侵害。\n\
  \n### 执行威胁建模\n\n威胁建模比仅仅研究威胁的历史数据要复杂。它是一个用于评估和记录应用程序或系统安全风险的过程。\n\n理想情况下，威胁建模是在应用程序编写之前或系统部署之前进行的。它是在产品或服务的整个生命周期中考虑安全性时完成的。句话说，如果只在项目结束时考虑安全性，结果往往会不如人意。\n\
  \n使用威胁建模时，首先需要识别要评估的资产。资产管理有助于识别对组织重要的资产，包括它们的价值。然后可以采取措施识别针对这些价值资产的威胁。\n\n威胁建模的关键部分是像对手一样思考，而不是像经理或管理员一样思考。在这种背景下，对手可以是外部攻击者，也可以是内部用户。\n\
  \n### 类比与相似情况对比\n\n执法人员（包括当地执法部门、`FBI` 和秘密服务局）经常使用威胁评估。例如，每当当地警察接到犯罪现场的电话时，他们会快速评估状况。例如，妻子打电话投诉她的丈夫虐待她。警察知道这可能是一个暴力且爆炸性的现场，因为丈夫可能携带武器，或者妻子在意识到丈夫被捕时会对警察发动不利。\n\
  \n同样，每当美国总统旅行到某地时，秘密服务局团队会先到达那里进行威胁评估。团队评估总统将走的每条路径并寻找潜在威胁。他们会访问最终并对其进行评估。\n\n###\
  \ 无线与 WEP\n\n有线等隐私（`WEP`）是一个如果在整个开发周期中不考虑安全性，安全性将会失效的例子。在无线技术的早期，主要目标是提供与有线网络相同的安全水平，但远未达到。\n\
  \n`WEP` 有几个漏洞，并且出现了可以破解它的工具。最终，设计无线技术的团体不得不回到起点重新设计安全性。他们提出了 Wi-Fi 保护访问 (`WPA`）作为临时解决方案，然后是\
  \ `WPA2` 作为永久解决方案。\n\n今天，可以创建安全的无线网络。然而，如果在起始阶段使用了威胁建模技术，`WEP` 的问题可能永远不会发生。在执行威胁评估时，理解系统包括涉及哪些系统以及数据如何流入系统。如果没有对系统的充分理解，将视角切换到攻击者是非常的。\n\
  \n## 典型基础设施七个领域内威胁评估的最佳实践\n\n确保所有威胁都得到解决的一种方法是使用典型 IT 基础设施的七个领域：`用户领域`、`工作站领域`、`LAN\
  \ 领域`、`LAN 到 WAN 领域`、`WAN 领域`、`远程访问领域`和`系统/应用程序`。`FIGURE 8-2` 显示了七个领域。\n\n![图 8-2\
  \ 典型 IT 基础设施的七个领域。](img/9781284183719_CH08_FIGF02.png)\n\n**图 8-2** 典型 IT 基础设施的七个领域。\n\
  \n\n\n\n有条理地贯穿这些每一个领域并评估威胁，可以从不同的角度对潜在威胁进行评估。以下是评估这些威胁时可以使用的一些最佳实践：\n\n- 假设一无所知，承认情况是在不断变化的。\n\
  - 验证系统按照预期运行并受控制。\n- 每次将评估范围限制在一个单一领域。\n- 使用文档和流程图来理解正在被评估的系统。\n- 识别被评估领域所有可能的进入点。\n\
  - 考虑对机密性、完整性和可用性的威胁。\n- 考虑内部和外部人为威胁。\n- 考虑自然威胁。\n\n## 漏洞评估\n\n漏洞评估是为了识别组织内部的漏洞。漏洞是\
  \ IT 基础设施中的任何弱点。它们可能存在于特定的服务器、整个网络中或人员身上。\n\n例如，单个 Web 服务器可能会受到缓冲区溢出攻击。例如，5 月份发现了一个缓冲区溢出漏洞。如果\
  \ Web 服务器直到 7 月才打补丁，那么它在 5 月到 7 月之间将一直处于漏洞状态。\n\n### 注意\n\n当攻击者发送比系统或应用程序预期的更多或不同的数据时，就会发生缓冲区溢出攻击。缓冲区溢出漏洞通过更新或补丁修复。如果服务器不打补丁，漏洞就会存在。\n\
  \n如果未实施访问控制，整个网络都可能是脆弱的。例如，如果为所有用户授予网络相同的权利和权限，则不存在访问控制。网络上的所有数据都可能面临未经授权披露的风险。然而，可以使用管理模型来实现访问控制。最小权限原则和知情原则确保用户拥有他们所需的访问权限而不再更多。\n\
  \n如果人员不理解安全的价值，人员就会存在漏洞。`社会工程`策略会欺骗人们透露敏感信息或采取不安全的行动。如果用户不理解安全实践的价值，他们更容易被骗。例如，一名员工可能会接到这样的电话：“你好，我是\
  \ IT 部门的 Joe。我们正在进行系统升级，发现你的用户账户存在问题。为了修复这个问题并确保你不丢失任何数据，我们需要从服务器登录你的账户。你能把你的用户名和密码给我吗？”\n\
  \n当然，Joe 并不在 IT 部门工作。他是一个罪犯，试图让用户暴露用户名和密码。如果用户经常向管理员提供密码，这种计策很容易成功，但如果他们被告诉`绝不`提供密码，可能就不会成功。\n\
  \n执行漏洞评估是为了检查是否存在任何此类漏洞，某些评估的执行频率会比其他评估更高。\n\n### 提示\n\n员工绝不应向任何人透露他们的密码，包括响应可能是网络钓鱼尝试的电子邮件，以及可能是社会工程攻击的电话或面对面请求。当一个组织开始破例时（例如告诉用户向\
  \ IT 部门的人员提供密码是没问题的），用户就会感到困惑。他们可能会认为网络钓鱼尝试或社会工程攻击是另一个例外。对系统的自动漏洞扫描通常会频繁进行，并且可以使用评估工具每周进行一次。审计可以每年进行一次，以查看安全控制是否按照预期使用。例如，年度审计可以检测访问控制是否仍按预期使用。此外，可以每年进行一次测试，以查看人员对社会工程策略的反应。以下由美国政府托管的网站提供了避免社会工程学和网络钓鱼攻击的有用提示：[`www.us-cert.gov/ncas/tips/ST04-014`](https://www.us-cert.gov/ncas/tips/ST04-014)。\n\
  \n漏洞评估的一个额外益处是生成的文档，这些文档可用于证明对各种法律和指南的合规性。许多法律管理着 IT，例如《萨班斯-奥克斯利法》(SOX)、《格拉姆-莱奇-布莱尔法》(GLBA)\
  \ 和《健康保险责任法》(HIPAA)。\n\n漏洞评估测试可以在内部或外部进行：\n\n- **内部评估**：安全专业人员试图利用内部系统，看看他们可以了解哪些漏洞。一些大公司有专门人员定期进行评估。较小的公司可以将内部评估分配给\
  \ IT 管理员的额外任务。\n- **外部评估**：聘请外部顾问通过利用系统来评估安全性，看看他们可以学到什么。他们为公司的系统提供了全新的视角，并且通常非常擅长快速识别弱点。\n\
  \n### 提示\n\n如果可能，拥有系统或负责其安全的人员不应执行评估。如果人员在让系统看起来良好方面有利益，保持客观观点将更加困难。沉浸在系统的细节中也会使客观变得困难，并阻碍用新鲜眼光评估漏洞。\n\
  \n获得执行任何漏洞评估的许可始终很重要，并且应该以书形式形式。安全专业人员通常将此书面文件称为“免金牌”合同，它应该由足够高级的人员签署。虽然大多数漏洞评估是非侵入性的且不会影响操作，但某些漏洞评估方法可能会导致系统崩溃或模拟\
  \ DoS 攻击。\n\n本关于漏洞评估的章节包含以下主题：\n\n- 文档审查\n- 系统日志、审计跟踪以及入侵检测和防御系统输出的审查\n- 漏洞扫描和其他评估工具\n\
  - 审计和人员访谈\n- 过程分析和输出分析\n- 系统测试\n- 在典型基础设施七个领域内执行漏洞评估的最佳实践\n\n#### 文档审查\n\n执行漏洞评估时可以采取的步骤之一是审查来自多个来源的文档，包括：\n\
  \n- **事件**：如果发生过任何安全事件，应审查事件的文档。通常，事件的原因与漏洞直接相关。例如，针对面向 Internet 的服务器的成功缓冲区溢出攻击可能导致恶意软件感染，这可能表明系统更新频率不够。\n\
  - **停机报告**：任何影响业务任务的停机都可以进行调查。如果停机影响了利润，可能就可以识别出漏洞。\n- **评估报告**：应审查过去的评估报告，以识别常见问题和未修正的问题。\n\
  \n#### 审查系统日志、审计跟踪以及入侵检测和防御输出\n\n除了审查过去的评估报告，还可以审查其他信息来确定漏洞。三种常见信息源是系统日志、审计跟踪和入侵检测系统\
  \ (IDS)。审查它们没有特定的顺序。然而，如果网络拥有可用数据，则应该审查所有数据。\n\n##### 系统日志\n\n所有计算机系统都有某种系统日志。这些日志在不同的操作系统中有不同的名称，但总体目的相同。它们根据系统正在的操作记录数据。\n\
  \n\n\n\n例如，Microsoft Windows 系统有一个名为 `System` 的日志。该日志使用 Windows 事件查看器进行查看。`System`\
  \ 日志记录了系统事件，例如系统和服务的启动或停止，以及错误、警告和信息事件。\n\n通过审查系统日志，可以确定系统正在发生什么情况。某些事件（如警告和错误）会显现出来，表明存在明显的问题。其他事件则需要进行更多的分析以识别趋势。\n\
  \n### 审计追踪\n\n审计追踪 是记录在一条或多个日志中的一系列事件，这些日志被称为审计日志，但审计追踪可以记录在许多不同类型的日志中。例如，Microsoft\
  \ Windows 包含一个记录可审计事件的 `Security` 日志。此外，防火墙等安全应用程序也会记录可审计事件。\n\n任何类型的审计日志都尝试记录至少关于“谁”、“做了什么”、“在何时”以及“在何处”发生了事件的信息。如果用户已登录，则使用其凭据来识别是谁访问了数据。对于某些日志（例如防火墙日志），“谁”可能是源的\
  \ Internet 协议（IP）地址而不是用户名。\n\n可审计事件是任何需要跟踪的事件，例如，谁访问了文件夹。可以对该文件夹启用审计，这样每当有人访问文件夹内的任何文件时，访问操作就会被记录。事件将包括用户名、访问了什么文件、访问时间以及访问时所在的服务器或计算机。\n\
  \n许多组织拥有可以审查审计追踪的自动化系统。自动化系统能够检查来自多个源的日志。有时，这些系统会与入侵检测系统（IDS）结合使用，通过审查事件来检测入侵。\n\
  \n### ![](img/Note.png)注意\n\n虽然入侵检测系统（IDSs）和入侵防御系统（IPSs）通常被称为入侵检测和防御系统（IDPSs），但它们之间有些不同。IDS\
  \ 分析并监控网络流量，而 IPS 则防止并控制网络数据包进入网络。IPS 像防火墙一样部署在网上，位于内部网络和外部世界之间。\n\n### 入侵检测与防御系统输出\n\
  \n入侵检测和防御系统（IDPS）能够监控网络或系统、捕获网络流量并在检测到入侵时发送警报。基于主机的 IDS 安装在单个系统上。基于网络的 IDS 在整个网络中安装了多个监控代理，并向中央服务器报告。基于特征的\
  \ IDS 根据已知的恶意攻击序列或模式检测攻击。基于异常的 IDS 采用机器学习算法来检测未知的恶意软件攻击。`FIGURE 8-3** 显示了一个在网络安装安装三个监控代理的基于网络的\
  \ IDS 示例。\n\n![FIGURE 8-3 网络入侵检测系统。](img/9781284183719_CH08_FIGF03.png)\n\n**图 8-3**\
  \ 基于网络的入侵检测系统。\n\n一个监控代理位于互联网侧，一个位于非军事化区（DMZ），另一个位于内部网络。对 IDS 输出的检查将揭示几个关键点。这三个代理协同工作，用以识别针对网络发起的攻击类型，并对不同缓解技术的成功性提供见解。\n\
  \n代理 1 的事件显示了有多少次来自互联网的针对网络的攻击。代理 2 的事件识别了能够穿透外部防火墙的攻击，这显示了防火墙针对特定类型攻击的有效性，并有助于揭示\
  \ DMZ 中任何面向公共服务器的漏洞。代理 3 显示了能够穿透 DMZ 第二道防火墙的攻击。这些针对内部网络的攻击如果不加处理，可能会造成极大的破坏。\n\n\
  尽管图 8-3 的重点是来自互联网的攻击，但内部攻击也是可能的。内部网络上的网络代理监控内部攻击。在网络中安装多个内部代理来监控内部网络是常见现象。\n\n内部攻击并不一定来自恶意用户。它们通常源于感染了网络中一个或多个系统的恶意软件。然而，基于网络的\
  \ IDS 的好处是可以尽早发现感染。\n\n### 漏洞扫描和其他评估工具\n\n有许多工具可用于在网络内进行漏洞扫描。一些常用的工具包括 `Nmap`、`Nessus`、`SATAN`\
  \ 和 `SAINT`。\n\n这些工具提供了多处好处，其中包括：\n\n*   **识别漏洞**——它们提供了一种快速简单的方法来识别漏洞。运行扫描后对报告进行分析。\n\
  *   **扫描系统和网络**——漏洞扫描器可以检查并检测网络以及单个主机上的问题；根据主机上安装的操作系统、应用程序和服务来检测漏洞；并检测网络上的开放端口和访问点。\n\
  *   **提供指标**——管理的关键部分是衡量。如果某件事可以被衡量，就可以识别其进度，漏洞也是如此。在开始运行定期漏洞扫描时，扫描可能会发现许多漏洞。六个月后，如果对指标进行分析，分析结果应显示问题已显著减少。如果没有减少，则涉及其他问题。如果在第一次扫描六个月后仍存在相同的漏洞，说明这些漏洞没有得到修复。\n\
  *   **记录结果**——生成的文档为内部合规性报告提供输入。扫描器报告可用于证明符合不同的法律法规。\n\n漏洞扫描器确实有局限性。首先，它们必须定期更新，因为威胁和系统在不断变化。因此，扫描也必须发生变化，以确保它们寻找过去和现在的漏洞。\n\
  \n其次，许多扫描器具有较高的误报率。换句话说，它们错误地指示存在漏洞。虽然这可能很烦人，但从安全的角度来看是合理的。如果存在可能，扫描器宁错错过。以下是两个例子：\n\
  \n*   系统存在漏洞，但扫描没有检测到。这种情况可能是由于低误报率引起的。\n*   系统不存在漏洞，但扫描不断识别出漏洞。这种情况可能是由于高误报率引起的。\n\
  \n### ![](img/Tip.png)提示\n\n在购买漏洞评估扫描器时，注意扫描器的更新频率很重要。不定期更新的扫描器可能只有用一段时间，而定期更新的扫描器可能值得投入额外费用。\n\
  \n大多数安全专业人员希望避免第一种情况。他们不希望系统存在未报告的漏洞。\n\n最后，某些扫描器会产生大量的网络流量，如果网络已经繁忙，可能会干扰正常运行。\n\
  \n#### 审计与人员访谈\n\n审计目的是检查对规则和指南的合规情况。漏洞评估审计专门检查组织对内部政策的合规情况。\n\n例如，组织有一项与离职员工相关的政策。该政策规定，员工离职时应立即禁用用户账户，并在六个月后删除。\n\
  \n\n\n\n审计用于确定策略是否被诸实施。如果审计人员具备脚本编写能力，审计可以是快速且自动化的。审计人员可以编写脚本来检查在过去 15 天内未使用的已启用账号。然后通过与人力资源部门核对输出结果，以确定这些用户中是否仍留职。也可以使用类似的脚本来确定是否存在在过去六个月内未使用的账号。\n\
  \n可以通过进行人员访谈来获取可能出现的新问题问题的洞解。例如，可以询问人员他们认为目前的漏洞有哪些。通常情况下，员工知道问题在哪里，但他们并没有被问及。\n\n\
  此外，还可以对人员进行访谈以识别他们的安全知识水平。例如，可以询问员工在什么情况下提供密码是可以的。一个安全的组织会制定相关策略，规定用户绝不向任何人泄露密码。\n\
  \n## 过程分析与输出分析\n\n在某些系统中会进行过程分析，以确定其流程中是否存在漏洞。换句话说，不仅是查看输出，而是评估用于确定输出的流程。另一方面，输出分析则是通过检查输出来确定是否存在漏洞。\n\
  \n这两种分析方法并无优劣劣。但在某些情况下，一种方法会比另一种更优。例如，防火墙的有效性可能令人关注。防火墙使用规则来确定流量是否被允许。过程分析或输出分析都可以用于确定防火墙的有效性。\n\
  \n`FIGURE 8-4` (#18_chapter08_02.xhtml#fig8-4) 显示防火墙正在拦截和允许流量进出网络。过程分析需要审查所有规则以确定它们是否提供了所需的安全性。输出分析则检查防火墙的输入和输出，以确定是否只允许所需的流量通过防火墙。\n\
  \n![FIGURE 8-4 Firewalls 控制网络流量](img/9781284183719_CH08_FIGF04.png)\n\n`FIGURE 8-4`\
  \ 防火墙控制网络流量。\n\n如果防火墙只有五条规则，过程分析很容易完成。然而，如果防火墙超过 100 条规则，执行输出分析可能会更容易。\n\n## 系统测试\n\
  \n系统测试用于测试单个系统是否存在漏洞。这些系统包括单个服务器和单个终端系统。对系统进行的主要测试与补丁和更新有关，因为大多数漏洞是由通过补丁解决的 Bug\
  \ 引起的。例如，一家公司可能有一组运行 `Microsoft Windows Server 2012` 的服务器。自安装以来，这些服务器已发布了多个补丁和更新。系统测试查询服务器以确定它们是否是最新版本。\n\
  \n可以使用传统的管理工具、漏洞评估工具或两者结合来进行系统测试。微软包含了传统工具，如 `Windows Server Update Services (WSUS)`\
  \ 和 `System Center 2012 Configuration Manager (ConfigMgr)`。这些服务器产品中的每一个都可以查询网络中的系统并确保它们拥有所有适当的更新。如果系统缺少更新，`WSUS`\
  \ 或 `ConfigMgr` 可以将更新推送到系统并双重检查以确保已安装。例如，`Microsoft Security Bulletin MS14-011`\
  \ 识别了 `Microsoft Windows` 中 `VBScript` 脚本引擎中的一个严重漏洞。该漏洞可能允许远程代码执行。\n\n\n\n他面临着两个竞争目标：安全性和可用性。用户请求更改其权利和权限的情况越来越频繁。他理解权利和权限是为了确保用户仅拥有执行工作所需的权限。他也理解“最小权限原则”和“按需使用原则”的价值。他并没有简单地进行更改，而是尝试调查这些需求。这些延迟导致了用户向经理投诉。\n\
  \n管理员向经理表示他需要额外的帮助。他还试图向经理解释访问控制的目的。遗憾的是，他没有获得任何额外的帮助。经理强调，他不想再听听到关于用户需要额外访问权限的投诉。\n\
  \n在这种情况下，经理关注的是可用性，而管理员关注的是安全性。然而，经理是老板，所以他的话说了算。\n\n发生了两件事。首先，管理员将所有用户都添加到管理员账户中，这确保了所有用户将始终访问他们需要的任何内容。这也确保了经理不会再听到任何关于访问控制的投诉。其次，管理员开始寻找另一份工作，因为他明白，这些变化导致问题只是早晚的问题。至少，它们将导致机密性的损失。\n\
  \n访问控制测试验证了用户是否授予了执行工作所需的权利和权限，且没有更多。它确保按照设计使用了管理模型。\n\n## 渗透测试\n\n`Penetration\
  \ testing` 尝试利用漏洞。它验证了控制措施或应对措施的有效性。换句话之，发现漏洞并实施了防止该漏洞的控制措施，然后进行渗透测试以查看控制措施是否有效。\n\
  \n如果渗透测试成功，说明控制措施是不充分。需要采取额外的步骤来防止攻击。\n\n渗透测试比漏洞评估更具侵入性。具体来说，如果渗透测试成功，实际上可能会导致系统崩溃。考虑到这一点，在执行渗透测试时需要非常谨慎。\n\
  \n## 事务和应用程序测试\n\n事务和应用程序测试确保应用程序能够与后端数据库正常运行。\n\n数据库中的 `transaction` 是一组语句，它们要么整体成功，要么整体失败。如果任何单个语句失败，整个事务都将失败。\n\
  \n例如，一位女性正在 ATM 机上提取 100 美元。ATM 检查她的账户并确认她有钱。然后从她的账户中扣除该金额并将钱交给她。一旦她拿到了钱，ATM 将该事务视为完成并提交事务，使其最终生效。然而，如果\
  \ ATM 在给她钱之前断电了，ATM 就不会提交事务。扣款被视为未完成事务的一部分并被回滚。事务测试确保事务按照预期行为运行。\n\n### 注意\n\n渗透测试也被称为利用测试。`Exploit\
  \ testing` 将在本章的稍后部分进行探讨。\n\n应用程序测试用于确保应用程序按预期与后端数据库协作。与后端数据库交互的前端应用程序的一个已知漏洞是 `SQL\
  \ injection`。有许多工具可以对系统进行自动化的 SQL 注入测试。\n\n### 注意\n\n在 SQL 注入攻击中，攻击者可以在未经授权的情况下读取数据库部分或整个数据库。SQL\
  \ 注入攻击还可以用于修改数据库中的数据。\n\n### 在典型 IT 基础设施的七个领域内进行漏洞评估的最佳实践\n\n在执行漏洞测试时，应该考虑典型 IT\
  \ 基础设施的七个领域。这七个领域在前面已经提到，并显示在`图 8-2` 中。\n\n每个领域都存在漏洞。一次可以只关注一个领域，但应该定期检查所有七个领域。\n\
  \n公司可能拥有仅关注局域网域（LAN Domain）或局域网到广域网（LAN-to-WAN Domain）的工具。但如果这是公司做的唯一漏洞测试，那么测试遗漏了许多其他潜在问题。例如，针对用户域（User\
  \ Domain）的社会工程攻击经常成功，仅仅是因为用户不理解风险。\n\n以下最佳实践适用于大多数领域：\n\n*   **首先识别资产**——资产管理有助于识别需要保护的资源。并不是所有资产都需要漏洞评估，只有价值资产需要。\n\
  *   **确保扫描器保持更新**——漏洞扫描器需要定期更新，这与杀毒软件需要更新病毒定义类似。不保持更新的杀毒程序只比完全没有杀毒程序好一点点，漏洞扫描器也是如此。\n\
  *   **执行内部和外部检查**——攻击可能来自内部和外部源，因此应该从内部和外部位置执行漏洞评估。检查防火墙后的漏洞；防火墙之外的漏洞；以及通过 DMZ 从互联网进入\
  \ DMZ 的漏洞。\n*   **记录结果**——每次漏洞评估的结果都应该记录。这些文档可以以多种方式使用。可以将旧结果与当前结果进行比较以跟踪进度。某些漏洞评估可以用于记录对法律法规的遵守情况。\n\
  *   **提供报告**——向管理层提交总结重要发现并提供建议的报告。\n\n## 漏洞评估报告\n\n虽然完成漏洞评估报告时没有必须使用的标准格式，但大多数报告都包含共同信息。在漏洞评估报告中应考虑包含以下信息：\n\
  \n*   **目录**——如果报告很长，应包含目录，以便读者轻松找到相关信息。\n*   **执行摘要**——执行摘要是报告的简短总结。执行摘要通常限制在页页以内，或者对于大型报告，占总文档的\
  \ 10%。\n*   **方法**——此部分识别了执行评估使用了哪些工具。它应该包含足够的细节，以便他人能够重现结果。同一个人在六个月后可能执行相同的评估，此部分将帮助他执行相同的测试。\n\
  *   **结果**——此部分识别了评估结果。它列出了发现的漏洞。在可能，此部分还应该对漏洞被利用概率的估计。\n*   **建议**——某些漏洞应该缓解，而另一些可以忽略。建议部分识别了哪些漏洞是严重的，哪些是微小的。如果可用，还可以包含控制措施。\n\
  \n# 利用评估\n\n利用评估尝试利用漏洞。换句话之，它们通过模拟攻击来确定攻击是否成功。利用测试通常从漏洞测试开始确定漏洞，然后尝试利用这些漏洞。\n\n\n\
  \n\n\n许多大型组织都有专门的安全团队来执行漏洞评估。另一些组织则聘请外部专业人员。这些人员将近乎 100%的工作时间用于学习漏洞和利用程序。他们学习如何识别漏洞以及如何利用它们。他们还学习保护组织免受利用攻击需要什么。\n\
  \n除非某人是专注于漏洞和利用评估的安全专业人士，否则他或她不会拥有这些团队的详细知识。然而，无论某人是作为 IT 专业人士还是 IT 管理人员工作，都应该理解基础知识。\n\
  \n以下章节涵盖了与利用评估相关的一些基础主题：\n\n*   识别利用程序\n*   通过差距分析和修复计划缓解利用\n*   实施配置或变更管理\n*  \
  \ 验证并确认利用已得到缓解\n*   在 IT 基础设施中执行利用评估的最佳实践\n\n## 识别利用程序\n\n利用评估的第一步是执行漏洞测试。漏洞测试将提供一份可以被利用的潜在漏洞列表。然而，知道一个漏洞可以被利用与知道如何利用它是两回事事。\n\
  \n某些漏洞可以通过现有工具轻松利用，开发者已经识别了这些利用方法并编写了应用程序。攻击者需要做的就是运行该程序。这些应用程序非常易用，连小孩都能使用，这就是\
  \ `script kiddie`（脚本小子）一词的由来。`script kiddie` 是指那些拥有应用程序但并不真正知道自己在做什么的人。\n\n其他漏洞则需要才华程序员或开发者的专业知识。例如，之前提到的微软安全公告\
  \ `MS14-011`。虽然文档指示了可能的操作，但它并不包含识别该操作或如何操作的代码。任何想要利用此漏洞的人都需要编写代码来模拟攻击，这并不是一项简单的任务。\n\
  \n在尝试识别利用程序时，应该考虑典型 IT 基础设施的所有七个领域。以下列表显示了七个领域中每个领域可能需要检查的项目：\n\n*   **用户域**——针对用户的常见利用与社会工程学有关。容易被欺骗或诱骗的用户表明需要更多的培训。\n\
  *   **工作站域**——工作站上检查的两个常见项目是更新和防病毒软件。当系统未打补丁时，就会发生常见的利用。此外，系统需要安装更新的防病毒软件以防止恶意软件。\n\
  *   **域域**——这是私有的内部网络。如果攻击者能够在网络上安装嗅探器，他们就可以捕获网络流量。攻击者随后可以查看任何以明文发送的数据；因此，敏感数据应当加密。物理安全有助于防止未经访问网络资源。此外，培训有助于员工识别社会工程学策略。例如，假装成电话维修技术人员的社会工程师可能会尝试进入布线室，但经过培训的员工不太可能被欺骗。\n\
  *   **局域网到广域网域**——这是公共与与私网络之间的边界。攻击者试图发现防火墙漏洞并利用它们。仅允许必要的流量通过防火墙的进取策略提供了最好的保护。此外，入侵检测（IDS）可以检测并缓解许多威胁。\n\
  *   **广域网域**——该领域包括面向互联网的服务器。这些系统的常见利用是缓冲区溢出攻击。最好的防御是保持系统更新。此外，这些服务器通常保护在 DMZ（隔离区区）。\n\
  *   **远程访问域**——该领域包括拨号远程访问服务器和虚拟专用网络（VPN）服务器。常见的利用试图突破身份验证和授权过程以访问内部网络。\n*   **系统/应用域**——该领域的利用取决于系统或应用程序。数据库服务器有特定的利用，例如\
  \ SQL 注入攻击。未打补丁的 Web 服务器通常受到缓冲区溢出攻击，而邮件服务器容易受到带有恶意软件的垃圾邮件的影响。\n\n![](img/Tip.png)\
  \ TIP\n\n`script kiddie` 这个词让人联想到一个无聊的青少年下载并运行应用程序的。。应用程序虽然易用，但可能会造成巨大的损害。无论攻击来自\
  \ `script kiddie` 还是具有 IT 技能的专业犯罪分子，所有攻击都需要防护。\n\n存在许多常见的利用。尽管它们很常见，但仍然可能成功并造成损害。以下章节包含了其中一些利用程序的详细信息。\n\
  \n### 社会工程学\n\n社会工程学攻击的成功往往是因为人的信任本性。一个简单的例子是尾随攻击。\n\n尾随发生在一个人在不使用钥匙、通行卡或密码的情况下跟随他人进入安全区域。例如，某公司限制了访问。人员需要使用通行卡或个人识别码（PIN）来开门。然而，一旦门开了，其他人就可以进去；他们被称为“尾随者”。\n\
  \n![](img/Tip.png) TIP\n\n尾随攻击也被称为 `tailating`。防尾随门道（Mantraps）通常用于防止尾随。一个 `mantrap`\
  \ 每次只允许一个人。它可以像地铁闸机一样简单，也可以是一个全尺寸的笼。\n\n一名安全顾问被聘请为一家公司进行安全评估。她在后面等一个看起来很友善的人。她手臂抱满了书、盒子和公文包。她面前的人不仅让她进去，实际上还为她扶门。大多数人都想表现得礼貌和友好，在需要帮助的人面前关上门与礼貌相悖。然而，在这种情况下，礼貌成了一个问题。利用评估表明，可以通过利用人的自然礼貌来利用该漏洞。\n\
  \n### MAC 泛洪攻击\n\n大多数组织用交换机取代集线器以防止嗅探攻击。嗅探攻击允许攻击者将网络接口卡连接到未使用的插座并捕获数据。如果使用集线器，攻击者可以捕获通过集线器的任何数据。如果使用交换机，攻击者无法捕获过多的数据。\n\
  \n\n\n\n\n图 8-6 显示了 TCP 用于两个系统之间建立会话的三次握手。第一个系统发送一个设置了同步（`SYN`）标志的数据包。第二个系统返回一个设置了\
  \ `SYN` 和确认（`ACK`）标志的数据包。原始系统随后返回一个设置了 `ACK` 标志的数据包。两个系统现在建立了会话。\n\n![图 8-6 TCP\
  \ 三次握手。](img/9781284183719_CH08_FIGF06.png)\n\n**图 8-6 TCP 三次握手。**\n\n这种情况类似于两个人开始对话。第一个人说“你好”并伸出手。第二个人说“你好”并也伸出手。两个人握手，对话就开始了。诚然地说，并不是每个人都通过握手开始对话的。即使两个人没有握手，在对话开始之前，他们之间也建立了言语或非语言的连接。\n\
  \n### ![](img/Note.png)注意\n\nTCP SYN 洪水攻击是一种特殊的 DoS 攻击。任何 DoS 攻击都试图阻止服务器或系统响应正常请求。存在一些黑客工具允许攻击者输入服务器的\
  \ IP 地址进行攻击并点击开始。该工具无需攻击者提供任何额外输入即可启动 DoS 攻击。\n\n在 TCP SYN 洪水攻击中，握手永远不会完成。在图 8-7\
  \ 中，系统发送前两个数据包。然而，源系统从未发送第三个数据包。这种情况好比一个人伸出手握手，但在对方伸出手时又缩了回来。\n\n![图 8-7 TCP SYN\
  \ 洪水攻击在三次握手中拦截了第三个数据包。](img/9781284183719_CH08_FIGF07.png)\n\n**图 8-7** TCP SYN\
  \ 洪水攻击在三次握手中拦截了第三个数据包。\n\n这种情况只发生一次就不会引起问题。但在 TCP SYN 洪水攻击中，攻击系统可能会发送数百个 `SYN` 数据包来启动\
  \ TCP 会话。攻击系统从未通过发送最后一个 `ACK` 数据包来完成握手。这种情况导致服务器上留有数百个开放会话，等待 `ACK` 数据包来完成握手。TCP\
  \ SYN 洪水攻击消耗服务器资源，并可能导致服务器崩溃。\n\n缓解此类攻击的常用方法是使用 IDS（入侵检测系统）。IDS 可以检测并缓解攻击。例如，IDS\
  \ 可以在所有开放会话变成问题之前关闭它们，并可以更改设置以阻塞来自攻击计算机的所有数据包。\n\n### 通过差距分析和修复计划缓解漏洞\n\n漏洞评估将识别已缓解的漏洞和未缓解的漏洞。已缓解与未缓解内容之间的差异代表了安全缺口。一份差距分析报告记录了这些差异。\n\
  \n修复计划通常包含在差距分析中。它包含了为了缩小差距需要执行的细节。目标是确保在修复计划完成后，所有严重的漏洞都得到缓解。\n\n对于任何受 `HIPAA`\
  \ 或 `SOX` 监管的公司，同时使用差距分析和修复计划是常见做法。这在法律首次引入、公司采取措施确保合规时尤为如此。换句话说，组织并不被要求在法律颁布之当天就达到\
  \ 100% 合规。相反，组织被要求采取特定步骤来变得合规。\n\n### ![](img/Tip.png)提示\n\n进行差距分析和修复计划通常是为了满足合规性要求。例如，如果一个组织受\
  \ `HIPAA` 监管，差距分析可以识别组织目前的状况。修复计划则确定了在计划完成后需要采取哪些步骤，以确保组织完全符合 `HIPAA` 的要求。\n\n由于这些法律中某些法律具有高度的技术性，组织通常会聘请外部顾问来执行差距分析。顾问们通常可以通过审查现有文档和程序，并对相关人员进行访谈来完成分析。如果需要，他们还可以创建修复计划。\n\
  \n### 实施配置或变更管理\n\n配置管理和变更管理都可以帮助防止或缓解漏洞。在配置管理中，使用标准来确保系统的配置是的。此外，还会进行合规审计以确保系统没有被不当修改。\n\
  \n当使用配置管理技术时，它们提供了更高层次的信心，确保系统免受漏洞侵害。例如，一个著名的漏洞可能会针对三年未更新的系统。配置管理技术确保在任何新部署中始终包含更新。\n\
  \n变更管理是一个控制系统变更的过程。变更只有在经过审查和批准后才会执行。变更管理是一个重要的过程，因为许多 IT 停机由于未经授权的更改。具有成熟变更管理流程的组织可以减少此类停机。\n\
  \n一个常见的例子是一个出于好的管理员为了解决本地系统上的小问题而做了更改。该管理员可能会无意中在网络上引发更大的问题。例如，某个应用程序可能无法与某个特定的更新一起工作。如果管理员删除了更新，系统就会受到漏洞攻击。\n\
  \n### 验证并确认漏洞已缓解\n\n在部署控制措施以缓解漏洞后，需要对其进行检查以确保它们有效。换句话说，需要重复测试以确保漏洞已得到缓解。\n\n存在两种可能性。一种是控制措施完全不起。如果是这种情况，则需要更换。另一种是配置可能需要微调才能完全正常。例如，在首次部署控制时可能漏掉了某些设置。可以进行这些更改并再次测试控制措施。\n\
  \n验证漏洞已缓解最简单的方法是使用最初识别问题的方法。如果是漏洞扫描发现了问题，则应该重新运行扫描。如果是审计发现了问题，则应该对漏洞相关的细节进行审计。\n\
  \n\n\n\n\n- **使用缺口分析进行合规性检查**——在识别合规性方面的漏洞（例如针对 `HIPAA`）时，会使用缺口分析。缺口分析用于识别需求与现状之间的差异。这提供了正式的文档，以证明正在采取措施以符合法律规定。\n\
  - **验证漏洞是否已缓解**——在实施了缓解漏洞的控制措施后，必须验证这些措施是否有效。应该使用最初用于发现漏洞的相同技术来验证漏洞是否已得到缓解。\n\n\
  ## 章节总结\n\n本章提供了有关威胁评估、漏洞评估和利用评估的信息。每种评估类型都用于识别 IT 基础设施中潜在的风险因素。目标是尽可能多地识别威胁、漏洞和利用点。一旦识别出这些问题，就可以采取措施对其进行缓解。\n\
  \n威胁评估并不被要求是全方位或完整的。相反，执行这些评估的目的是识别可能发生的威胁。这些威胁通过审查历史数据和进行威胁建模来识别。漏洞评估则识别网络中的弱点。某些漏洞评估可以手动进行。另一些漏洞评估可以使用自动化工具进行，例如受欢迎的漏洞扫描工具\
  \ `Nessus`。任何扫描工具都必须确保系统没有漏洞，因此必须保持最新状态。利用评估则确定弱点是否可以被利用。它可以在实施控制措施之前之后进行，以验证控制措施的有效性。\n\
  \n## 核心概念与术语\n\n- `audit`（审计）\n- `audit trail`（审计追踪）\n- `change management`（变更管理）\n\
  - `exploit testing`（利用测试）\n- `gap analysis`（缺口分析）\n- `penetration testing`（渗透测试）\n\
  - `social engineering`（社会工程）\n- `spear phishing`（鱼叉式网络钓鱼）\n- `threat assessment`（威胁评估）\n\
  - `transaction`（事务）\n\n## 第 8 章评估\n\n1. 威胁的两个大类是人类威胁和 \\_\\_\\_\\_\\_\\_\\_\\_\\\
  _。\n2. 威胁是指任何代表可能危险的活动，具有影响机密性、完整性或可用性的潜力。\n    1. 正确\n    2. 错误\n3. 下列哪些方法可以识别威胁？\n\
  \    1. 审查历史数据\n    2. 进行威胁建模\n    3. A 和 B 均可\n    4. A 和 B 均不可\n4. 内部威胁的来源有哪些？（选择所有适用项）\n\
  \    1. 不满的员工\n    2. 设备故障\n    3. 软件故障\n    4. 数据丢失\n5. 下列哪个选项*不被认为是识别威胁时的最佳实践？\n\
  \    1. 验证系统按预期运行并受到控制\n    2. 限制评估范围\n    3. 考虑对机密性、完整性和可用性的威胁\n    4. 假设系统自上次威胁评估以来*没有*发生过变化\n\
  6. \\_\\_\\_\\_\\_\\_\\_\\_\\_ 评估用于识别组织内部的漏洞。\n7. 谁应该执行漏洞评估？\n    1. 作为员工工作的内部安全专业人员\n\
  \    2. 聘请作为顾问的外部安全专业人员\n    3. 内部或外部安全专业人员或两者\n    4. 仅限拥有系统的 IT 人员\n8. 执行自动化漏洞评估扫描的常用工具名称是什么？\n\
  \    1. `Wireshark`\n    2. `Superscan`\n    3. `Nessus`\n    4. `VA Scanner`\n\
  9. 漏洞扫描器的常见缺点或弱点是什么？\n    1. 极高的误报率\n    2. 极高的漏报率\n    3. 较低的误报率\n    4. 较低的漏报率\n\
  10. 一组织想要检查对内部规则和指南的合规情况，以确保遵守了现有政策。应该执行什么？\n    1. 威胁评估\n    2. 缺口分析\n    3. 审计追踪\n\
  \    4. 审计\n11. 企业想知道其用户是否仅获得了工作所需的权利和权限，而没有更多。应该进行 \\_\\_\\_\\_\\_\\_\\_\\_\\_\
  \ 测试。\n12. 企业想识别发现的漏洞中是否有任何可以被利用。应该执行什么？\n    1. 审计\n    2. 事务和应用程序测试\n    3. 功能测试\n\
  \    4. 利用评估\n13. 一组织受 `HIPAA` 监管，并想知道其是否合规。什么文档可以记录需求与当前实施内容之间的差异？\n    1. 缺口分析\n\
  \    2. 漏洞评估\n    3. 威胁评估\n    4. 渗透测试\n14. 下列哪种类型的 `IDS` 安装在单个系统上？\n    1. 基于异常的\
  \ `IDS`\n    2. 基于特征的 `IDS`\n    3. 基于主机的 `IDS`\n    4. 基于网络的 `IDS`\n15. `IDS` 可能会采用机器学习算法来检测未知的恶意软件攻击。\n\
  \    1. 正确\n    2. 错误\n\n![© Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n\n\
  ## 识别和分析风险缓解安全控制\n\n### 第 9 章\n\n控制措施缓解风险，这意味着它们将减少或中和威胁或漏洞到可接受的水平。在任何时候，公司可能都有需要更新的控制措施、计划中的控制措施以及需要或正在考虑的控制措施。\n\
  \n在任何环境中都可以实施数百种控制措施。在评估控制措施时，考虑不同类别的控制措施是最好的。美国国家标准与技术研究院 (`NIST`) 发布了 `SP 800-53`。该文档将\
  \ 212 种控制措施分为 20 个族，分别用缩写命名：`AC` 代表访问控制，`IR` 代表事件响应，`CM` 代表配置管理。控制措施分为低、中、高三个级，基于三种类型：通用、自定义和混合。控制措施还分为程序、技术和物理。`NIST\
  \ SP 800-53 Rev. 5` 强调了基于结果的、隐私和威胁情报控制。\n\n#### 第 9 章主题\n\n本章涵盖了以下主题：\n\n- 什么是现有的控制措施\n\
  - 什么是计划中的控制措施\n- `NIST` 定义的不同控制措施族是什么\n- 什么是程序控制措施\n- 什么是技术控制措施\n- 什么是物理控制措施\n-\
  \ 风险缓解安全控制措施的最佳实践是什么\n\n#### 第 9 章目标\n\n完成本章后，你将能够：\n- 区分现有控制措施和计划中的控制措施\n- 识别控制措施所属的族\n\
  - 识别并列出程序控制措施\n- 识别并列出技术控制措施\n- 识别并列出物理控制措施\n- 列出风险缓解安全控制措施的最佳实践\n\n#### 现有控制措施\n\
  \n在识别和分析风险缓解控制措施时，需要识别现有的措施。现有的控制措施是安装在运行系统中的。相关的文档应说明其目的。\n\n某些这些现有的控制措施可能需要更换，这取决于它们是否满足当前目标。例如，网络中的系统可能安装了防病毒软件。然而，这些系统在过去一年中曾被恶意软件感染，这促使人们决定更换为认为更可靠的工具。\n\
  \n\n\n\n\n基于此类信息，应对对已生效的控制措施进行有效性评估。如果确定某项控制措施无效，则可以使用替代控制措施进行替换。\n\n控制措施（也称为防御措施）将减少或消除威胁或漏洞。控制措施有三个主要目标：\n\
  \n*   预防 (Prevent)\n*   恢复 (Recover)\n*   检测 (Detect)\n\n某些控制措施只关注一个目标，而另一些控制则关注多个目标。然而，如果某项控制措施无法充分满足这些目标之一，就应该予以替换。\n\
  \n## 计划控制措施\n\n计划控制措施是指已批准但尚未安装的措施。计划文档确定了购买控制措施的目的，并包含了支持文档。计划控制措施将有指定的实施日期。\n\n\
  由于各种原因，控制措施可能尚未实施。也许控制措施已经购买但尚未到达；可能它已经到达但尚未安装。控制措施未实施的原因并不如意识到它将要实施那么重要。\n\n在批准其他控制措施之前，应该识别出计划控制措施，这样如果已经计划购买可以解决相同漏洞的控制措施，就不会再购买额外的控制措施了。\n\
  \n计划控制措施的有效性仍然可以进行评估，但评估起来并不像评估已生效的控制措施那么容易，因为只能研究相关信息。在计划控制措施实施之前无法对其进行测试。然而，如果确定另一项控制措施效果更好，则可以取消计划控制措施并购买另一项。\n\
  \n## 控制类别\n\n安全控制有成百上千种类型。为了让这些类型更易理解，风险缓解安全控制被分为若干大类。然而，根据分类者的不同，分类方式也会有所不同。\n\n\
  某些控制措施使用以下方法之一分类：\n\n*   `NIST SP 800-53, Security and Privacy Controls for Federal\
  \ Information Systems and Organizations`——`NIST SP 800-53 Rev. 5` 识别了 20 个控制族。\n\
  *   `实施方法`——使用三种实施方法对控制进行分类：程序控制、技术控制和物理控制。本章重点介绍这三种实施方法。\n\n### ![](img/Tip.png)提示\n\
  \n`NIST SP 800-53 Rev. 5` 将于 2020 年发布，它重点强调了隐私和扩展的安全控制，并对控制类别引入了新的变化。\n\n## 功能性控制\n\
  \n某些控制是根据其执行的功能来确定的。这些功能被分为三大类控制：预防性、检测性和纠正性。\n\n`预防性控制` 试图防止风险的发生。例如，为了加固服务器而采取许多操作都是预防性的。这些操作包括禁用不需要的服务和移除不需要的协议。如果服务或协议不在服务器上，就无法受到攻击。同样，保持系统处于补丁更新状态也是预防性的。如果安装了更新，攻击就无法成功。\n\
  \n`检测性控制` 试图检测漏洞何时被利用。审计日志和审计追踪是被动检测性控制的示例。当审查日志时，就会发现事件。入侵检测系统 (IDS) 是主动检测性控制的示例。IDS\
  \ 可以实时审查日志，从而能够在攻击发生时检测到它。\n\n`纠正性控制` 试图扭转问题的影响。文件恢复和数据修复是纠正性控制的示例。例如，可靠的备份允许在数据损坏时进行恢复。许多纠正性控制也被视为恢复控制。\n\
  \n`NIST SP 800-53 Rev. 5` 的第三章显示了详细的控制目录，记录了这些族中的大多数安全和隐私控制。附录 E 记录了计划管理族中的控制。`SP\
  \ 800-53` 是一个动态文档，这意味着目录中记录的安全控制将随时间而变化。某些控制将被增加，某些将被删除，另一些将进行修改。\n\n### ![](img/Note.png)注意\n\
  \n`NIST SP 800-53` 的之前的版本将控制族分类为管理、运行或技术类。然而，作者在 `NIST SP 800-53 Rev. 4` 中删除了这种分类。移除它们是因为许多控制族包含了这些两个或多个类别的控制措施。`NIST\
  \ 800-53 Rev. 5` 进行了进一步的修订，更新了控制族。\n\n以下列表提供了控制族的概述。族标识符是两个字母的缩写，列在括号中。控制族包括：\n\n\
  *   `访问控制 (AC)`——这个包含 23 项控制措施的族帮助组织实施有效的访问控制。它们确保用户拥有执行工作所需的权利和权限，且不多于此。该族还包括最小权限和职责分离等原则。\n\
  *   `审计与问责 (AU)`——这个包含 16 项控制措施的族帮助组织实施有效的审计计划。某些控制确定了要审计的内容，另一些控制提供了保护审计日志的细节。该族还包含了关于使用日志实现不可否认性的信息。\n\
  *   `意识与培训 (AT)`——这个包含 4 项控制措施的族包含了提高组织所有用户安全意识的步骤。这些项目帮助组织识别所需的培训并妥善记录。\n*   `配置管理\
  \ (CM)`——这个包含 12 项控制措施的族涵盖了变更管理和配置管理。变更控制实践防止未经授权的更改，配置管理控制强调使用基准来配置新系统。最小功能控制记录了系统加固的方法，包括移除或禁用不需要协议服务的常用方法。\n\
  *   `应急计划 (CP)`——这 12 项控制措施用于帮助组织从故障和灾难中恢复。它们包括与故障和灾难相关的计划、培训和测试控制，以及与存储或处理备用站点相关的控制。`NIST\
  \ SP 800-34` 是主要参考。\n*   `身份识别与认证 (IA)`——这 11 项控制涵盖了识别和验证用户的各种实践。每个用户都应该被唯一标识，这意味着每个用户有一个仅供其使用的账户。同样，设备标识符可以唯一标识网络上的设备。\n\
  *   `事件响应 (IR)`——10 项 IR 响应控制涵盖了安全事件的所有方面，包括培训、测试、处理、监控和报告。`NIST SP 800-84` 和 `SP\
  \ 800-115` 是主要参考。\n\n\n\n\n\n- **维护 (MA)**——六项 MA 控制涵盖了与维护相关的安全方面，例如工具、维护人员和及时维护。\n\
  - **媒体保护 (MP)**——八项 MP 控制侧重于对可拆卸数字媒体的保护，包括磁带、外部硬盘和 USB 闪存器。该系列控制还包括非数字媒体（如纸张和胶片），并涵盖了媒体的访问、标记、存储、传输和清理。\n\
  - **人员安全 (PS)**——PS 家族的八项控制涵盖了与人员安全相关的几个方面，包括人员审查、离职和转岗。\n- **物理和环境保护 (PE)**——PE\
  \ 家族提供了 19 项与物理安全相关的控制，其中许多项包含在本章后文“物理控制示例”部分。\n- **计划 (PL)**——PL 家族的六项控制侧重于系统的安全计划。它还涵盖了用户的行为准则。行为准也被称为可接受使用策略。\n\
  - **程序管理 (PM)**——该家族的 16 项控制由《联邦信息安全管理法》（`FISMA`）驱动。它提供了确保符合 `FISMA` 要求的控制。这些控制与其他控制形成补充，而非替代。该家族是唯一未包含在\
  \ `SP 800-53` 附录 F 中的家族，而是包含在附录 G 中。\n- **风险评估 (RA)**——该家族的五项控制提供了风险评估和漏洞扫描的细节。\n\
  - **评估、授权和监控 (CA)**——该家族的八项控制涉及实施安全评估计划的步骤。它包括确保只有授权系统被允许访问网络的控制，以及关于重要安全概念的细节，例如持续监控和行动与里程碑计划。\n\
  - **系统和通信保护 (SC)**——SC 家族是一个包含 41 项控制的大组，涵盖了保护系统和通信通道的许多方面。包含了拒绝服务保护、边界保护、传输完整性和机密性的控制。\n\
  - **系统和信息完整性 (SI)**——该家族的 16 项控制提供了维护系统数据完整性的信息。缺陷修复识别了保持系统更新的步骤，恶意代码保护列出了防止恶意软件攻击的步骤。\n\
  - **系统和服务修购 (SA)**——SA 家族包括 15 项与产品和服务购买相关的控制。这些控制包括与硬件、软件和供应链保护相关的控制，以及若干项处理软件开发相关安全问题的控制。\n\
  - **个人身份信息处理与透明度 (PT)**——该家族是修订 5 版新增的，包含 21 项控制。该家族处理了如何处理个人身份识别信息的要求或处理这些信息的条件。\n\
  - **供应链风险管理 (SR)**——该家族同样是修订 5 版新增的，包含 25 项控制。这些控制解决了企业级程序管理以及与联邦指令相关的供应链风险考虑。\n\
  \n### 注意\n`Nonrepudiation`（不可否认性）技术防止某人否认其执行过某项操作。例如，审计日志记录了事件的谁、什么、何、何时。如果审计日志记录某个用户删除了文件，该用户无法令人信地否认。该用户已登录，审计日志使用用户的登录凭据记录了该操作。唯一的可能性是用户泄了自己的凭据。数字签名也提供了不可否认性。\n\
  \n### 注意\n旧版本的 `SP 800-53` 将 `CA` 家族标记为认证、认可和安全评估。`CA` 缩写指的是认证和认可。尽管 NIST 更改了名称，但它仍将使用\
  \ `CA` 缩写。最新的 2020 年版本 `SP 800-53 Rev. 5` 由于于对隐私控制的重新强调，包含了隐私授权（`PA`）。\n\n`SP 800-53\
  \ Rev. 5` 的附录 E 包含了这些家族中每个控制的摘要。该附录大约占整个文档的一半（截至编写时文档约 440 页）。在寻找可以在组织内采取以改进这些任何领域安全性的具体措施时，这是一个极佳的起点。\n\
  \n### 程序控制示例\n程序性控制指的是个人执行的程序。它们通常详细列在组织用于安全的书面文档中。程序控制是高级管理层关于如何处理组织内部安全问题的指示。旧版本的\
  \ `NIST SP 800-53` 将这些控制称为管理控制。\n\n以下章节提供了这些类别中一些常见程序性控制的示例：\n- 策略和程序\n- 安全计划\n\
  - 保险和担保金\n- 背景和财务检查\n- 数据泄露防护计划\n- 教育、培训和意识\n- 行为准则\n- 软件测试\n\n#### 策略和程序\n策略和程序是为组织提供指南和规则的书面文档。组织通常会有几项策略和程序。策略是一个高层文档，提供整体方向而不包含细节。程序则提供了实施策略所需的详细步骤。\n\
  \n策略有广泛的应用。它们确定了管理层希望在特定主题上采取的方向，意味着它们记录了高层管理决策。组织内的人员随后可以采取步骤实施该策略。策略还提供了权威。这种权威可以用于购买资源以支持策略。如果没有策略的支持，购买行为的合理性可能更难以证明。\n\
  \n### 注意\n程序控制必须获得高级管理层的支持。如果管理层不支持这些指南，他们的缺乏支持很快就会让员工察觉。组织将会有两套策略：一套是书面的策略集，另一套是每个人都遵循的非书面的策略集。\n\
  \n例如，备份策略将根据价值识别哪些数据需要备份。这些数据可以包括用户数据、数据库、服务器上的应用程序数据等。备份策略还确定了存储和保留要求。它将规定备份副本必须存储在不同的地点，以防止火灾等灾害。\n\
  \n备份策略将包含保留策略，确定了备份数据要保留多久。例如，保留策略可能会规定某些数据保留三年，而其他数据只保留 30 天。再次，这些选择取决于管理决策，而这些决策记录在书面策略中。\n\
  \n有了备份策略后，负责备份数据的部门就可以购买资源来实施该策略。这些资源包括磁带机、磁带和软件。备份可能昂贵；在没有策略的情况下，经理有时会对成本望而却步。\n\
  \n程序的范围比策略窄，且更以任务为导向。它们识别了实施策略所需的特定步骤。任何策略都可能对应多个程序。\n\n例如，备份策略会说明需要执行备份，但不说明如何执行备份。相反，程序说明了如何执行备份。可以为备份用户数据、数据库和其他应用程序数据以及将磁带传输到异地创建单独的程序。\n\
  \n策略的示例可能包括：\n\n\n\n\n\n- **可接受使用策略 (AUP)**——通过界定用户在系统上可以做什么和不能做什么，来定义对系统的可接受使用。有时，`AUP`\
  \ 也称为行为准则。\n\n- **漏洞扫描策略**——为执行定期扫描提供授权。它确定了扫描的具体目标以及执行扫描的频率。\n\n- **可移动介质策略**——许多组织意识到与可移动介质（如\
  \ USB 闪存）相关的风险。通过策略，他们限制了这些驱动器的使用。\n\n## 程序的示例可能是：\n\n- **AUP 流程**——识别用户如何确认 `AUP`。例如，用户可能被要求通过签署文件来阅读并确认他们对\
  \ `AUP` 的理解。\n\n- **漏洞扫描程序**——将为不同类型的扫描识别程序，并规定如何记录和报告扫描结果。\n\n- **可移动介质执行**——程序可以强制执行可移动介质的限制。例如，可以操纵基本输入输出系统\
  \ (`BIOS`) 以防止使用可移动介质，或者购买第三方软件来阻止其使用。Microsoft 域允许管理员通过 `Group Policy` 限制可移动介质的使用。\n\
  \n## 安全计划\n\n组织创建单独的安全计划来应对不同的场景。许多安全计划是大多数组织通用的。本节涵盖许多组织中常见的安全计划：\n\n- 业务连续性计划\n\
  - 灾难恢复计划\n- 备份计划\n- 应急响应计划\n\n### 业务连续性计划\n\n业务连续性计划 (`BCP`) 是一项帮助组织准备不同紧急情况的全面计划。它确保在灾难发生后关键功能继续运行。\n\
  \n`BCP` 通常从业务影响分析 (`BIA`) 开始。`BIA` 识别关键功能，并在灾难期间记录保持这些功能运行。\n\n### 灾难恢复计划\n\n灾难恢复计划\
  \ (`DRP`) 为灾难后恢复一个或多个系统提供细节。有时，`DRPs` 和 `BCPs` 被视为实体。但它们是不同的。`BCP` 在灾难期间保持关键功能运行，而\
  \ `DRP` 的重点更窄，识别如何恢复系统。\n\n例如，`BCP` 可能识别组织如何应对威胁性的飓风，例如将关键功能转移到备用位置。飓风过后，`DRP` 识别组织应如何恢复其系统。例如，洪水可能摧毁了几台服务器。`DRP`\
  \ 识别如何恢复这些服务器。`BCP` 还会识别在 `DRP` 恢复后如何将关键功能恢复到正常运行。\n\n### 备份计划\n\n备份计划源于备份策略，通常作为\
  \ `DRP` 的一部分包含在内。除非之前进行了备份，否则灾难后无法恢复数据。\n\n备份策略识别对组织有价值的数据，并规定存储和保留要求。备份计划包含了识别如何备份这些数据的程序，因为并非所有数据都以相同的方式备份。\n\
  \n如果数据存储在中心，用户数据的备份非常简单。通常，组织会要求用户将数据存储在中央服务器上，备份计划会记录这一要求。管理员随后在服务器上备份数据。在每个单独的用户系统上备份数据几乎是不可能的。\n\
  \n托管在数据库服务器上的数据库需要专用的软件进行备份。\n\n### 应急响应计划\n\n应急响应计划记录了组织应如何响应事件。安全事件是指任何影响系统机密性、完整性或可用性的事件。当威胁利用漏洞时，就会发生安全事件。例如，系统感染了恶意软件。组织遵循以下步骤：\n\
  \n- 断开局域网连接。\n- 保持系统电源。\n- 记录下显示的任何信息。\n- 报告事件。\n\n## 保险与担保\n\n风险可以被规避、共享或转移、缓解或接受。在损坏概率极低而影响极大的情况下，组织通常选择共享或转移风险。共享或转移风险的主要方式是组织购买保险。\n\
  \n大多数保险单都规定了保险公司与客户之间的共同责任。例如，火险涵盖了火灾引起的大部分而非所有的损害。它还要求客户采取合理的预防措施防止火灾。在某些情况下，整个风险可以通过保险单进行转移。\n\
  \n可以购买许多类型的保险。目标是保护公司免受损失。如果发生风险，保险将帮助支付损失费用，从而避免风险导致公司破产。\n\n### 保险类型\n\n某些类型的保险（如火灾险和洪水险）是显而易见的。其他类型的保险则值得解释。\n\
  \n业务中断险可以作为某些保单的附加险购买。例如，公司可以在火险保单上增加业务中断险。如果发生火灾且公司无法正常运营，保险将支付损失，直到公司重新开业。这种保险通常涵盖运营费用（如设备租赁），还将支付公司通常会赚取的利润。\n\
  \n专业遗漏险（也称为专业责任险）如果公司向其他公司提供服务，那么这种保险非常有价值。例如，想象一家公司对客户的服务器进行维护。在执行维护的过程中，技术人员不小心插反了电源，损坏了服务器。客户可能会起诉该公司。这种保险将提供保护。\n\
  \n同样，公司可能为客户提供咨询服务。顾问可能帮助客户创建备份计划，但忘记包含异地存储。由于顾问是专家，这是一个明显的遗漏。如果客户遭受火灾并丢失了组织的所有备份，该公司可能会起诉。再次，专业遗漏险提供了保护。\n\
  \n担保（Bonding）是一种涵盖因盗窃、欺诈或不实行为导致损失的保险。被担保保险涵盖的人被称为“已担保人员”。组织在法律要求时会购买担保保险，并为其客户提供安全保障。\n\
  \n\n\n\n\n例如，一家公司为客户提供家庭 IT 支持。可以购买保函险来涵盖技术人员。如果公司的技术人员在服务期间偷窃了客户的财物，保险公司将赔偿损失。保函险的范围通常非常窄。例如，除非员工已被起诉并判定盗窃罪，否则保险可能不会赔付。客户可能不会对员工提起诉讼，而是直接起诉公司。\n\
  \n## 背景与财务检查\n\n许多组织会对潜在入职员工进行背景和财务检查，这些检查在聘用之前完成。\n\n背景检查通常包括警方和 FBI 检查，用于识别潜在入职员工的任何犯罪行为。过去的错误不会自动阻止某人被录用。但在某些情况下，过去的定罪记录是相关的。\n\
  \n如果卡车司机记录中有鲁莽驾驶的定罪，他不太可能被录用。同样，如果一名管理员最近被定盗窃罪，她也不可能被录用。商店行窃罪就足以防止公司聘佣担任信任职位的员工。\n\
  \n大多数公司还会对潜在入职员工进行财务检查。信用评分差的人可能会被怀疑。雇主会考虑信用良好的差是否反映了责任感和问责制。如果一个人忽视了自己的债务，是否意味着在工作中中不负责任？\n\
  \n如今，背景调查通常包含互联网资源，包括简单的 Google 或 Facebook 搜索。在某个话题上狂热发泄情绪的人可能被视为存在问题的人。无论如何，公司都希望员工能够与他人良好合作。如果某人的\
  \ Facebook 页面充满了对他人的攻击，可能会被一个从没有过 Facebook 页面的人取代。\n\n## 数据泄露防护计划\n\n数据泄露防护计划帮助公司防止数据丢失。数据丢失可以从两个维度来看：\n\
  \n- **机密性丢失**——当未经授权的实体查看数据时，公司就会失去机密性。例如，如果未经授权的用户查看数据，机密性就会丢失。访问控制不足可能允许未经授权的用户查看数据，攻击者可能黑入在线网站并访问后端数据库，或者用户可能丢失存储有所有信息的笔记本电脑。\n\
  - **由于损坏导致的丢失**——文件可以通过多种方式损坏。磁盘驱动器可能会崩溃，应用程序在写入文件时可能会故障，或者用户可能无意或有意地删除或修改数据。数据丢失的方式并不重要，重要的是通过备份做好丢失的准备。\n\
  \n组织可以使用两种方法防止机密性丢失。一种方法是使用访问控制。身份验证方法识别并验证用户。权限则授予访问资源的授权。最小权限原则确保用户仅拥有其所需的资源，而不再多多。\n\
  \n另一种防止机密性丢失的方法是加密。数据可以在静态存储或传输过程中进行加密。静态数据是指任何存储在媒体（如硬盘或 USB 闪存）上的数据。数据在通过网络传输时也可以进行加密。\n\
  \n### ![](img/Note.png)注意\n\n用于防止数据丢失的实际方法是技术控制。然而，识别需要保护哪些数据的计划是程序性控制。\n\n数据泄露防护计划识别对组织有价值的数据。数据可以被分类为公共、私有或专有。数据泄露防护计划将指定这些类别中每个数据的重要性，还将指定组织是想防止机密性丢失、由于损坏导致的丢失，还是两者兼顾。\n\
  \n## 教育、培训与意识\n\n组织可以拥有地球上记录最全的安全控制。然而，如果员工不知道这些控制是什么或如何实施它们，这些控制就根本不起作用。教育、培训和意识控制确保员工了解为什么建立安全控制很重要以及如何实施安全控制，并意识到组织的安全标准。\n\
  \n意识计划是通用的，适用于所有人员。它们使用不同的技术来告知和提醒人们安全事项，并试图让用户将安全意识个人化。换句话说，安全不再是他人的责任，用户意识到安全是每个人的责任，包括他们自己。提高意识的某些示例包括：\n\
  \n- 登录或欢迎横幅\n- 电子邮件\n- 海报\n\n针对不同的受众提供培训。某些培训是通用的，并为所有人员准备的。例如，所有用户都应该接受社会工程策略的教育。其他培训是专门的，针对特定群体的。例如，为将维护特定\
  \ `firewall` 的管理员提供如何维护的培训。特定的安全专业人员将接受如何运行和解释漏洞扫描的培训。\n\n教育通常关注不保护组织可能带来的风险。它适用于组织高层，并试图对安全控制、标准和实践进行成本效益分析。\n\
  \n## 行为规则\n\n`行为准则](#29_glossary.xhtml#gloss157)` 让用户知道他们对系统可以做什么和不能做什么。用户在获得系统访问权限之前阅读此文档，并且通常需要签署一份文件表明他们已阅读并理解了行为准则。\n\
  \n管理和预算局 (OMB) 要求在 OMB 管辖范围内的机构使用行为准则。这些规则记录在 OMB  A-130 附录 III 中，其中还引用了 SP 800-53\
  \ 中记录的行为准则控制。\n\n行为准则文档中的一些常见元素是：\n\n- **隐私**——许多组织强调用户没有隐私预期。如果他们使用雇主的资源，他们将受到监控，并且可以随时查看数据。这些数据包括用户的数据文件、电子邮件文件和用户的互联网活动历史。组织经常扫描所有传出的传输（如电子邮件），这有助于他们确保个人身份信息\
  \ (`PII`) 不被泄露。\n- **限制活动列表**——大多数系统都会限制某些活动。组织通常会明确限制访问任何带有色情或内容的网站。限制列表还可能包括游戏、赌博或个人业务。尽管这些限制试图避免冒犯员工，其他限制旨在保护资源。例如，某些公司限制任何类型的音频或视频流（例如在线收电台），以保护网络不受不必要的流量过载。\n\
  - **电子邮件使用**——用户会被告知电子邮件的用途以及存在哪些限制。大多数公司允许用户发送和接收个人电子邮件。然而，用户不应使用电子邮件进行任何类型的骚扰或传输令人的材料。\n\
  - **凭据保护**——用户被告知保护他们的凭据（例如 `username` 和 `password`），并获得有关如何创建强密码的信息。\n- **不合规的后果或处罚**——此类后果可能是警告或吊销权限。严重违规可能导致员工被解雇。\n\
  \n### ![](img/Tip.png)提示\n\n\n\n\n\nNIST 在 2003 年发布了 SP 800-50《构建信息技术安全意识和培训计划》。它详细介绍了如何设计、开发和实施安全意识及安全培训计划。\n\
  \n### 提示\n在某些组织中，行为规则被称为可接受使用策略（`AUP`）。大多数私立组织都会使用 `AUP`。行为规则和 `AUP` 的目的相同。\n\n\
  此列表并非详尽无。组织将包含必要的信息，以确保用户理解他们的职责。有些组织将这些信息限制在一页内，而另一些组织会让列表更长。\n\n#### 软件测试\n开发软件的组织应该花时间进行测试，并制定强制软件测试的政策。测试的主要目的是减少软件中未发现的漏洞数量。\n\
  \nTricentis 2017 年的一项研究报告，软件故障导致的年度损失在 1.7 万亿美元左右。IT 软件质量联盟（`CISQ`）对其 2018 年的估计约为\
  \ 1.1 万亿美元。这些数字反映了通过测试进行软件质量检查日益增长的需求和重要性。\n\n执行的软件测试类型属于技术控制。例如，可以执行数据范围和合理性检查。然而，制定要求软件测试的政策是起点。\n\
  \n### 技术控制示例\n技术控制是自动化保护的工具。它们包括硬件、软件和固件，这些工具使用技术方法强制执行安全。技术控制与程序性控制有显著区别。程序性控制识别应该做什么，并且通常需要人工干预以确保遵循程序性控制。\n\
  \n相比之下，技术控制是使用技术执行的。例如，在许多系统中可以创建密码强制策略。它可以规定密码必须是强密码，这意味着密码至少包含八个字符，并且是大小写字母、数字和特殊字符的混合。该策略还可以规定每\
  \ 30 天更改一次密码。\n\n系统提示用户更改密码。如果他们选择不更改，系统将锁定他们，直到他们更改密码。当他们更改密码时，新密码必须是强密码，因为系统会拒绝弱密码。\n\
  \n### 注意事项\n本章后面的“数据范围和合理性检查”部分将更详细地介绍这些主题。\n\n本节介绍了其他技术控制的示例，包括：\n\n*   登录标识符\n\
  *   会话超时\n*   系统日志和审计追踪\n*   数据范围和合理性检查\n*   防火墙和路由器\n*   加密\n*   公钥基础设施\n\n####\
  \ 登录标识符\n登录标识符是用户账户的另一个名称。账户具有唯一标识并与用户匹配。用户每次登录时，都会使用此账户，这有助于执行其他其他控制。\n\n访问控制需要登录标识符。如果每个用户都用名为“Bob”的账户登录，那么每个用户都拥有相同的权限。用户的真实姓名并不重要。授予“Bob”的权限将授予所有使用\
  \ `Bob` 账户登录的用户。\n\n### 提示\n在微软系统中，登录标识符被称为安全标识符（`SID`）。每个用户账户在创建时都会被分配一个 `SID`。该\
  \ `SID` 是唯一的，用于授予资源访问。\n\n然而，如果每个用户都使用不同的账户登录，就可以单独分配权限。需要访问资源的用户被授予权限，而不需要访问的用户则不授予权限。\n\
  \n审计日志记录了谁、什么、何地以及何时等细节，使用了登录标识符。“谁”来自登录标识符。用户使用自己的账户登录，任何可审计的操作都会用此账户信息进行记录。\n\n\
  登录标识符还提供了不可否认性，这意味着如果操作是用其登录标识符记录的，用户就无法否认自己没有执行过该操作。\n\n#### 会话超时\n大多数系统包含会话超时控制，有助于确保未经授权的用户在未提供凭据的情况下访问会话。\n\
  \n简单会话超时控制的一个示例是屏幕保护程序。可以配置屏幕保护程序在闲 10 分钟后启动，并在屏幕保护启动后要求用户重新登录。这样，如果用户离开电脑而没有锁定，屏幕保护程序将在\
  \ 10 分钟后启动并锁定系统。\n\n### 提示\n许多网站的默认超时时间为 20 分钟，这是一个很长的时间。因此，使用公共电脑的人在完成后应立即注销。只是离开并保持会话开启会让别人在\
  \ 15 分钟后访问这台电脑。入侵者将能够访问该会话，只要他们保持其活动状态，会话就会一直保持开启。\n\n许多网站包含会话超时。例如，许多银行网站会在 20\
  \ 分钟后关闭会话。在提供登录银行网站的凭据后，只要用户在网站上处于活跃状态，会话就会保持开启。此功能允许在无需重新登录的情况下查看不同页面。\n\n然而，如果网页保持开启但闲置了\
  \ 20 分钟，超时控制将关闭网页并清除会话数据。要再次访问页面，必须重新输入登录凭据。\n\n同样，如果公共电脑上的会话闲置 20 分钟，它将关闭，这有助于防止未经授权的用户访问该网站。\n\
  \n#### 系统日志和审计追踪\n操作系统和网络设备具备记录不同类型事件的能力。记录事件并定期查看日志有助于识别正在发生的情况。日志可用于调查安全事件和解决问题。\n\
  \n### 提示\nNIST SP 800-53 建议使用内部系统时作为时间戳。内部时为所有事件提供一致的时间。\n\n日志通常记录事件的以下细节：\n\n*\
  \   谁做的\n*   发生了什么\n*   在何地发生的\n*   何时发生的\n\n这些信息通常缩短为谁、什么、何地和何时。登录标识符识别谁执行了操作，系统识别发生了什么以及发生在何地，时提供时间戳记录何时发生。\n\
  \n任何网络都存在多种类型的日志。桌面和服务器操作系统包含日志；防火墙包含跟踪允许和拦截流量的日志；网络服务器应用程序（如域名系统 `DNS`）也会记录事件。几乎任何系统都可以启用或增强日志记录。\n\
  \n### 提示\n日志需要审查。这一操作似乎显而易见，但这一步经常被忽视。管理员被日常工作淹没，日志审查变得不那么。当记录的事件过多时，审查日志变得更加困难。许多组织使用自动化工具审查关键事件日志。这些工具对关键事件提供警报并跟踪趋势。\n\
  \n系统日志跟踪操作系统上的不同类型事件。例如，Windows 操作系统包含 `System` 日志来记录系统事件。这些事件包括服务的启动或停止以及系统的启动或停止。这些事件被分类为错误、警告和信息事件。\n\
  \n\n\n\n安全日志侧重于安全事件。某些安全事件会被自动记录。然而，可以配置日志来记录额外的可审计事件。例如，可以启用对文件夹的审计，以显示是否有人访问了存放敏感数据的文件夹。此类审计将记录任何人读取、修改或删除数据的详情。\n\
  \n不过，并非所有事件都应该记录。相反，日志应该只包含重要内容。记录过多的事件会消耗额外的资源，包括捕获和记录这些事件所需的处理能力，以及随着日志文件填充而占据的磁盘空间。\n\
  \n## 数据范围和合理性检查\n\n应用程序开发人员使用数据范围和合理性检查来帮助确保他们接收到有效数据。开发者无法确保数据的准确性，但可以确保数据的有效性。\n\
  \n有效数据遵循特定的格式，例如，期望五位美国邮政编码（ZIP Code）的文本框。有效字符只有五个数字。如果用户输入五个数字以外的任何内容，则该数据无效无效。\n\
  \n同理，例如用户的邮政编码为 `23456`。如果用户不小心输入了 `33456`，应用程序无法判断该邮编是错误的。因为 `33456` 是一个有效的五位数字，它将通过验证测试。\n\
  \n验证检查出现在网站上。用户会被提示输入某些数据，如姓名和电子邮件地址。如果用户漏掉或输入错误错误，网站会向用户报错，例如显示一个带有错误说明的红色星号。解释说明可能会显示类似“你必须输入电子邮件地址”之类的内容。\n\
  \n### ![](img/Note.png)注意\n\n数据范围和合理性检查也被称为输入验证。系统会对用户输入的数据进行检查以确保其有效性，并且不使用无效数据。\n\
  \n数据范围检查确保数据在特定范围内。例如，用户可能会被要求输入一个 1 到 100 之间的数字。数据范围检查确保该数字在 1 到 100 之间。如果输入的数据在有效范围之外，则不会被使用。相反，系统会提示用户重试。\n\
  \n同样，日期范围可以验证日期在特定范围内。例如，可以使用出生日期来确保某人超过特定年龄。它会将当前日期与出生日期进行比较。如果用户年龄太小，网站可以将用户重定向到错误页面。\n\
  \n合理性检查确保输入的数据是合理的。例如，预计姓名中会有多少个字母，以及姓名中哪些类型的字符是有效的，这些都需要定义。\n\n参数可能是姓名不能超过 25 个字符且不包含数字。因此，当用户输入姓名数据时，可以根据此参数进行比对。\n\
  \n### ![](img/Tip.png)提示\n\n合理性检查可以防止某些缓冲区溢出攻击。当网页接收到的数据比预期的多时，就会发生缓冲区溢出。如果攻击者尝试向文本框中输入比预期多的数据，验证检查可以拒绝它。由于数据被拒绝，缓冲区溢出就不会发生。\n\
  \n合理性检查可以用于任何类型的数据。只需对数据进行定义。例如，如果对姓名使用合理性检查，则需要定义什么构成姓名。因此，姓名最多五个字母限制是不可接受的。\n\n\
  ## 防火墙和路由器\n\n防火墙和路由器软件被用网络技术控制。它们通过允许某些流量并阻塞其他流量来控制流量。\n\n许多防火墙和路由器使用隐式拒绝策略，除非显式允许，否则所有流量都会被拦截。为了识别允许的流量，防火墙使用规则，而路由器使用访问控制列表\
  \ (`ACLs`）。\n\n路由器根据以下内容对流量进行基本过滤：\n\n* 互联网协议 (IP) 地址\n* 端口\n* 某些协议\n\n### ![](img/Note.png)注意\n\
  \n路由器使用路由表来识别如何路由流量。路由表标识了流量从一个点到另一个点的最佳路径。路由器使用访问控制列表 (`ACLs`) 来控制哪些流量可以从一个点到达另一个点。`ACLs`\
  \ 指定了什么样的流量可以从哪个方向或哪个接口通过。\n\n在图 9-1 中，可以配置路由器允许来自子网 1、2 或 3 上具有 IP 地址的主机的流量。端口用于识别协议。例如，超文本传输协议\
  \ (HTTP) 使用端口 `80`。可以配置 `ACL` 允许 HTTP 流量访问子网 1 上的内网 Web 服务器。简单邮件传输协议 (SMTP) 使用端口\
  \ `25`。可以配置 `ACL` 允许 SMTP 流量访问子网 2 上的邮件服务器。\n\n![图 9-1 使用路由器和防火墙控制的流量。](img/9781284183719_CH09_FIGF01.png)\n\
  \n图 9-1 使用路由器和防火墙控制的流量。\n\n防火墙具有基本的路由能力。然而，大多数防火墙要先进得多。路由器 `ACLs` 每次只能评估单个数据包。但防火墙可以评估整个会话。一旦两个主机建立了会话，防火墙就可以评估它们之间的所有流量，这被称为状态检测。\n\
  \n在防火墙上创建的规则允许网络免受外部攻击。通过只允许特定的流量，限制了来自互联网的攻击者的能力。\n\n### 常用端口\n\n端口 0 到 1023 是常用端口。此范围内的端口分配给特定的协议。\n\
  \n互联网数字分配机构 (IANA) 分配常用端口。可以在 [`www.iana.org/assignments/port-numbers`](http://www.iana.org/assignments/port-numbers)\
  \ 查看完整的端口列表。\n\nHTTP 的常用端口是 80。当系统接收到目标端口为 80 的数据包时，知道将其传递给处理 HTTP 的服务。运行 HTTP 协议的服务器通常是\
  \ Web 服务器。\n\n由于端口 80 是常用端口，不需要包含在统一资源定位符 (URL) 中，但也可以包含。以下 URL 包含了端口：[`www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xml`](https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xml)。\n\
  \n防火墙和路由器使用这些端口号识别允许的流量。例如，如果防火墙想要允许 HTTP 流量，它将有一个允许端口 80 流量的规则。同样，路由器会在 `ACL` 中配置允许\
  \ HTTP 流量。\n\n### 加密\n\n加密将明文数据转换为密文。例如，单词 `password` 是明文，但加密后可能看起来像：`MFIGs3x/$6oD`。数据可以在静态或传输时加密。静态数据是指存储在介上的任何数据，例如硬盘或\
  \ U 盘。如果用户在笔记本电脑上存储敏感数据，可以对其进行加密以保护。如果笔记本丢失或被盗，数据泄露的概率较低。同样，存储在 U 盘上的数据也可以进行加密。\n\
  \n攻击者和管理员可以捕获并读取通过网络传输的数据。例如，Wireshark 是一种免费的数据包分析器，可以捕获通过网络传输的数据。一旦捕获了数据，打开并分析单个数据包的过程是非常简易的。Wireshark\
  \ 允许个人读取网络传输的任何明文数据。\n\n\n\n\n如果有足够的资源和时间，加密数据并非不可解密。然而，加密算法的设计目的是让解密过程变得极其困难且耗时过长，以至于不值得尝试。\n\
  \n例如，多年前，用于互联网的 Rivest、Shamir、Adelman (RSA) 加密使用 40 位密钥，这在当时是安全的。但在 1997 年，加州大学伯克利分校的一名学生在三个半小时内破解了一个\
  \ 40 位 `RSA` 密钥，而今天，这只需要几分钟就能完成。目前，`RSA` 常用 1024 位、2048 位或 4096 位密钥。根据 `RSA` 标准，1024\
  \ 位密钥已被破解，而 2048 位密钥可以一直使用到 2030 年。美国国立标准与技术研究所（NIST）建议 `RSA` 使用 2048 位密钥。\n\n![](img/Note.png)\
  \ 注意\n\n能够捕获流量的数据包分析器通常被称为嗅探器，在网络上捕获数据包被称为`嗅探`。有心的攻击者可以嗅探网络流量并捕获大量数据。\n\n加密分为以下两类：\n\
  \n* ****对称加密**——这种加密使用单一密钥。一个简单的例子是，可以使用密钥 53 同时对数据进行加密和解密。然而，密钥实际上比简单的两位数字要复杂得多。强对称加密算法使用\
  \ 256 位密钥。\n\n* **非对称加密**——非对称加密使用两个密钥。其中一个被称为公钥，另一个被称为私钥。这两个密钥是相互配对的。任何使用公钥加密的数据只能通过匹配的私钥解密。任何使用私钥加密的数据只能通过公钥解密。\n\
  \n高级加密标准 (AES) 是目前最广泛使用的对称加密协议。在 20 世纪 90 年代，NIST 要求开发者提交加密算法进行评估。经过长时间的评估，NIST\
  \ 在 2000 年选中并批准了 `AES` 作为一项标准。\n\n`AES` 既快速又高效。即使在加密小量数据（如在 USB 闪存上）时，它的速度也很快，而且不需要像某些旧加密算法那样消耗大量的处理能力。\n\
  \n尽管加密功能很强大，但不应被认为是万无一击的。加密算法在不断改进，旨在破解算法的密码分析技术也在同步进步。美国国家安全局（NSA）有一句格言：“密码分析只会越来越好，永远不会变。”\n\
  \n## 公钥基础设施\n\n创建公钥基础设施 (`PKI`) 的目的是为了为证书提供支持。尽管 `PKI` 包含多个元素，但所有元素的目的都围绕证书展开。`PKI`\
  \ 的某些元素包括：\n\n* 证书权威机构\n* 证书\n* 公钥和私钥\n* 信任网\n\n证书权威机构 (CA) 颁发并管理证书，可以是公开的，例如 VeriSign。`CA`\
  \ 也可以是私有的。私有 `CA` 创建在公司内部，并在内部颁发证书。\n\n系统有一份它们信任的 `CAs` 列表。如果系统信任某个 `CA`，它会自动信任由该\
  \ `CA` 颁发的任何证书。这种情况类似于由交通管理局（DMV）颁发的驾照。如果出示照作为身份证明，人们会信任它是有效的，因为 `DMV` 是受信任的。`DMV`\
  \ 颁发的所有驾照都会被信任。同样，由受信任 `CA` 颁发的所有证书都会被信任。\n\n![](img/Tip.png) 提示\n\n私有 `CA` 仅仅是一个运行证书权威机构软件的服务器。公开\
  \ `CA` 通常指一家公司。\n\n证书 用于身份识别和辅助加密。证书包含接收实体的详细信息。例如，如果证书颁发给某个服务器，证书将包含该服务器的详细信息（如名称）。服务器可以使用证书作为其身份证明。\n\
  \n公钥和私钥是配对的，用于 `PKI`。使用其中一个密钥加密的数据只能通过匹配的密钥解密。公钥嵌入证书中并传递给他人。私钥始终保持私密。\n\n例如，证书颁发给一个\
  \ Web 服务器。当用户连接到 Web 服务器并启动安全会话时，服务器会将证书发送给用户。证书包含公钥。用户可以使用公钥加密数据并发送给服务器。由于服务器持有私钥，它可以解密数据。由于没有其他实体拥有私钥，其他人无法解密该数据。\n\
  \n证书还与数字签名 使用，提供了身份验证、不可否认性和完整性。\n\n例如，电子邮件可以使用数字签名进行签名。接收者可以验证该邮件是由签名者发送的，而不是冒充签名者发送的。数字签名的创建有两个步骤：\n\
  \n* 创建消息哈希值。\n* 使用发送者的私钥对哈希值进行加密。\n\nFIGURE 9-2** 显示哈希只是通过运行算法生成的数字。例如，消息“Hello”的简单哈希值可能是\
  \ 77。无论运行算法多少次，哈希值始终是 77。然后，使用发送者的私钥对哈希值进行加密。\n\n```\nFIGURE 9-2 使用数字签名。\n```\n\n\
  \n\n\n\n感应卡是一种与信用卡大小的小型设备。它包含电子元件，当它靠近感应读卡器时就会激活。卡片会向读卡器发送信号以识别其身份。如果卡片通过授权，门就会打开。\n\
  \n某些信用卡也使用这种技术。只需将信用卡在信用卡读卡器前挥动，读卡器就会对其记录。遗憾的是，感应读卡器是便携式的。攻击者可以将其放在小盒子或包子里，只需通过在一天内乘坐电梯就能收集信用卡数据。\n\
  \n物理安全最简单的方法就是直接在门上使用锁。这些锁可以是带钥匙的简单锁，也可以需要用户输入数字组合以获得访问权限的密码锁，或者可能需要由员工发放的感应卡。某些感应卡还要求用户输入个人识别码（PIN）。\n\
  \n安保人员也可保护安全区域。安保人员通常会获得一份授权人员名单，只要个人在访问名单上，安保人员就会他们进入。\n\n访问日志提供了谁进出建筑的审计追踪。访问日志可以手动或自动创建。手动创建的例子是安保人员可以记录所有进入或离开建筑的人员日志。自动创建的例子是某些感应或胸卡读卡器可以自动化。每当用户进入或离开建筑时，读卡器都会记录用户的身份以及时间和日期。\n\
  \n### 三屏障防护\n\n许多组织利用三层屏障防护，包括主入口、更安全的员工区域和更安全的计算机区域。这些屏障中的每一个都是分层的，意味着安全的计算机区域位于员工区域内，而员工区域位于主入口内。\n\
  \n主入口通常是开放的，允许任何人进出。然而，主入口通常由视频摄像头监控。\n\n员工区域比主入口稍微安全一些。可能会有安保人员驻守，以确保只有员工或经过授权的访客才能进入员工区域。可以使用密码锁要求员工输入代码以获得访问权限，某些组织向员工发放访问卡，必须使用该卡获得访问权限。\n\
  \n计算机中心是第三层屏障。它们可以是服务器房、布线间或任何存储安全硬件或数据的地方。只有特定的员工组（如管理员）被允许访问。\n\n闭路电视（CCTV）使用视频摄像头监控区域。摄像头可以是固定的，也可以是云台、水平和变焦（PTZ）摄像头。PTZ\
  \ 摄像头可以由安保人员控制，以对焦摄像头覆盖的任何区域。\n\n任何区域的保护级别取决于存储在该处的硬件或数据的重要性。一个组织可能只有有限的物理控制，而另一个组织可能拥有广泛的物理控制。这两种选择没有对错。如果系统或数据有价值，就需要根据其价值投入资金来保护它们。\n\
  \n### 火灾检测与灭火\n\n火灾检测和抑制系统提供保护。火灾可能会迅速发生并蔓；因此，目标是拥有一个能够尽快检测它们的系统。一旦检测到火灾，抑制系统就会尝试扑灭。\n\
  \n检测系统检测指示火正在燃烧的环境变化。这些变化包括热量、烟雾和气体的显著变化。\n\n灭火系统取决于火的类型。火主要分为五类。在美国，它们的分类如下：\n\n\
  - `A 类`——普通可燃物，如木材和纸张\n- `B 类`——易燃液体，如汽油\n- `C 类`——电气火\n- `D 类`——可燃金属，如镁\n- `K 类`——烹饪油和脂肪（厨房火灾）\n\
  \n不同类火灾的扑灭方法不同。例如，`A 类`火灾可以用水扑灭，但绝不能用水扑灭 `C 类`火灾，因为这会损坏设备。此外，如果电源未关闭，电流可能会沿着水流传输并电击消防员。\n\
  \n服务器房最容易发生 `C 类`火灾。扑灭 `C 类`火灾的主要方法是使用气体系统，例如二氧化碳（CO[2]`）和 `FM-200`。气体系统向区域充满气体以排出氧气并中断导致火灾的化学反应。\n\
  \n### ![](img/Note.png)备注\n\n在欧洲、非洲、澳大利亚和新西兰，火灾的分类略有不同。\n\n气体系统对人员可能是危险的。例如，检测到火灾时，技术人员可能正在服务器房内工作。如果没有警告就释放气体，它将移除氧气。大多数气体排放系统都会向人员发出警告，给他们离开房间的时间。\n\
  \n火灾检测和抑制系统是物理控制。然而，它们与保险的程序性控制相结合工作。保险通过支付发生的任何损坏来提供额外的保护层。除非公司具有适当的检测和抑制系统，否则大多数保险公司不会提供保险。\n\
  \n### ![](img/Tip.png)提示\n\n人员安全应始终是首要任务。如果发生了电气火灾，应先关闭电源。\n\n### 水浸检测\n\n某些位置容易受到洪水影响。水损可能是昂贵的，但有方法可以保护区域。例如，在水上升到危险水平之前，可以用水泵将水排出。\n\
  \n水浸检测系统将检测水何时渗入区域。检测系统会自动启动水泵，直到不再检测到水为止。\n\n### 温度和湿度检测\n\n高温度和高湿度会损坏电气设备。当温度升高时，电气元件可能会过热并烧毁。如果湿度太高，水分可能会凝结在设备上，这些水会导致电气短路，从而损坏设备。\n\
  \n大多数服务器房都保持低温以防止热损坏。许多服务器房使用架空地板来冷却房间。**图 9-3**了服务器房内的空调系统。冷空气被泵入架空地板下的区域。设备安装在机柜中，机柜底部空心并安装在架空地板的孔上方。机柜顶部还有强力风扇，将空气从架空地板抽过设备并从机柜顶部排出。\n\
  \n![图 9-3 服务器房内的空调系统。](img/9781284183719_CH09_FIGF03.png)\n\n**图 9-3** 服务器房内的空调系统。\n\
  \n复杂的服务器房使用冷热道。交替行的方向是反的。一组机柜的正面面向另一行机柜的正面。这就是冷道。一组机柜的背面面向另一行机柜的背面。这就是热道。冷空气通过冷道地板上的穿孔泵入，并通过机柜正面被抽入，热空气则从背面排出。\n\
  \n### ![](img/Tip.png)提示\n\n暖、通风和空调（HVAC）系统同时控制温度和湿度。\n\n\n\n\n\n如果空调故障，设备将面临风险。如果温度过热，电气组件将会烧毁，导致故障。电气设备内部的温度通常比房间温度高\
  \ 10 度。许多机构都制定了政策，当空调故障且区域达到特定温度时，将关闭设备。任务的短期损失远好于设备的长期损失。\n\n## 电气接地与断路器\n\n电气接地和断路器可以在发生故障时保护设备免受电击损坏。如果电气系统发生短路（短路），短路可能会在系统外壳上产生危险的电压。如果有人触摸外壳，可能会触电，而当然，这是不可接受的。为了防止这种情况的发生，必须对系统进行接地。\n\
  \n电气接地是一根插入地下的导线，通常配有一个地桩。整座建筑内都可以接入这根接地线。任何电气系统都布有接线，以便能够连接到该地。如果发生故障，危险电压会被传到接地，这有助于确保危险电压不会对人员造成风险。\n\
  \n断路器可以检测热量的变化。如果断路器检测到过热量，它会打开并断开电路，从而防止导致火灾的危险情况。\n\n### 注意\n\n熔丝的功能也类似于断路器。如果有过流通过熔丝，熔丝内部的连接将过热并烧毁，从而断开连接。熔丝和断路器的一个重要区别是，熔丝必须更换，而断路器只需简单重置。\n\
  \n以下是断路器的工作原理：电流沿电线传输，每根电线的额定电流负载都是固定的，以安培（amps）为单位。如果电线电流过大，它可能会过热并引发火灾。为了防止这种情况的发生，会在携带电流的同一条线路上安装断路器。断路器也有以安培为单位的额定负载。如果负载超过额定安培，断路器就会打开，电流停止，从而保护系统。\n\
  \n## 风险缓解安全控制的最佳实践\n\n以下列出了在识别风险缓解安全控制时可以遵循的几项最佳实践：\n\n*   **确保控制有效**——控制应该能够减少或消除威胁或漏洞，它通过预防、恢复和/或检测事件来实现这一点。\n\
  *   **审查所有区域的控制**——审查程序、技术和物理控制。专注于某一个区域的控制而忽视其他区域的控制是非常容易的。\n*   **审查 NIST SP 800-53\
  \ 系列**——这些系列提供了一个很好的检查，以确定是否在整个 IT 基础设施中实施了控制。\n*   **控制变化后重新进行风险评估**——风险评估是在特定时间点进行的。如果控制发生了变化，则需要使用新的控制重新进行风险评估。\n\
  \n## 章总结\n\n本章提供了有关不同类型控制的信息。有效的控制将威胁或漏洞减少或中和到可接受的水平。到位控制正在运行。计划性控制有计划的实施日期。\n\n\
  在考虑额外的控制时，可以在特定的族中进行评估。`NIST SP 800-53` 为 20 个族的控制提供了详细指南。控制也可以被视为程序、技术和物理控制。评估所有族和类控制是重要的。例如，仅凭技术控制无法解决所有风险。\n\
  \n## 核心概念和术语\n\n*   `Advanced Encryption Standard (AES)`\n*   `certificate`（证书）\n\
