  \n© Sai Chan/Shutterstock\n\n# 第一部分\n\n# 风险管理业务挑战\n\n* 第 1 章 风险管理基础\n* 第 2 章 管理风险：威胁、漏洞与利用\n\
  * 第 3 章 理解与维护合性\n* 第 4 章 制定风险管理计划\n\n![© Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n\
  \n© Sai Chan/Shutterstock\n\n## 风险管理基础\n\n风险对于每个组织的成功至关重要；一个不承担风险的组织可能不会失败，但无法繁荣。另一方面，忽视风险的组织在单一威胁被利用时可能会失败。今天，信息技术（IT）及其系统促进了许多组织的成功。然而，IT\
  \ 及其系统具有固有风险，会使组织遭受损害，因此需要进行妥善管理以防止组织失败。\n\n有效的风险管理始于理解需要保护的资产，以及可能影响它们的威胁和漏洞。人们通过识别减轻风险的方法在这些知识的基础上进行构建。风险可以通过减少漏洞或风险的影响来减轻。然后，可以为公司不同区域的风险制定制定定制的缓解计划。公司通常会制定几项风险缓解计划；但需要注意的是，风险是无法完全消除的。\n\
  \n本文将帮助学生在与信息系统和网络安全相关的风险管理方面建立坚实的基础。它充当进入该领域职业生涯的介绍。本文短短几段话中介绍的许多主题可以填满整整章节或一本书。学生学得越多，就越接近成为一个他人寻求其解决问题的专家。\n\
  \n### 第 1 章 主题\n\n本章涵盖了以下主题和概念：\n\n* 什么是风险，以及它与威胁、漏洞和资产损失的关系\n* IT 基础设施风险的主要组成部分是什么\n\
  * 什么是风险管理以及它对组织有多么重要\n* 有哪些风险识别技术\n* 有哪些风险管理技术\n\n### 第 1 章 目标\n\n当你完成本章时，你将能够：\n\
  \n* 定义风险\n* 识别风险的主要组成部分\n* 描述威胁、漏洞、资产与损失影响之间的关系\n* 定义风险管理\n* 描述风险管理与盈利和生存能力之间的关系\n\
  * 解释损失成本与成本之间的关系\n* 描述组织内部不同角色对风险的感知\n* 识别威胁\n* 列出威胁分类\n* 描述识别漏洞的技术\n* 识别并定义风险管理\n\
  * 成本效益分析的目的\n* 定义剩余风险\n\n### 什么是风险？\n\n`风险` 是意外发生的可能性或概率。在信息安全领域，大多数组织关注防止损失。当威胁暴露资产时就会产生损失。风险管理`\
  \ 是识别、评估、控制和减轻风险的实践。在本文讨论中，关键术语如下所示。\n\n![Images/Note.png)\n\nNIST 特别出版物 `800-37\
  \ Rev. 2` 为风险定义：“风险是实体受到潜在情况或事件威胁的程度。风险还取决于情况或事件发生时产生的不利影响以及发生的概率。风险的类型包括计划风险；合规/监管风险；财务风险；法律风险；任务/业务风险；政治风险；安全和隐私风险；项目风险；声誉风险；安全风险；战略规划风险。”\n\
  \n* **威胁**——`threat` 是任何代表可能危险活动。\n* **漏洞**——`vulnerability` 是弱点。\n* **资产**——`asset`\
  \ 是具有保护价值的东西。\n* **损失影响**——损失影响是指业务功能或资产受损导致的损失。\n\n企业的风险可能会导致影响企业及其核心业务功能的损失。公司通常试图限制或控制其风险暴露。总体目标是尽可能减少从风险中产生的损失的影响。\n\
  \n![Images/Note.png)\n\n威胁和漏洞将在本章后面进行更深入的探讨。\n\n#### 业务功能的损害\n\n业务功能是企业为了销售产品和服务而执行的活动。如果这些功能的任何受到负面影响，企业将无法销售尽可能的产品或服务。企业的收入将减少，导致整体损失。\n\
  \n以下是业务功能及其可能损害的一些示例：\n\n* 销售人员经常给客户打电话或发送电子邮件。如果电话或电子邮件的能力降低，销售就会减少。\n* 组织收到几封与业务功能无关的邮件，这会临时占用电子邮件空间并使网络资源不可用。这种情况被称为\
  \ `拒绝服务 (DoS) 攻击`。当 `DoS 攻击` 跨组织网络发生，网络从多个源接收邮件时，被称为 `分布式拒绝服务 (DDoS) 攻击`。\n\n\n\n\
  \n\n-   一个网站在互联网上销售产品。如果网站受到攻击并发生故障，销售额将会损失。\n-   作者编写的文章必须在截止日期前提交才能发布。如果作者的电脑感染了病毒，错过了截止日期，文章的价值就会降低。\n\
  -   分析师编写供管理层用于做决策的报告。数据从内部服务器和互联网源中收集。如果网络连接故障，分析师将无法获取当前数据。管理层可能会根据不准确的信息做出决策。\n\
  -   仓库应用程序被用于运送已购买的产品。它识别了哪些产品已被订购、产品需要发送到何处以及产品位于何处。如果应用程序发生故障，产品将无法按时发货。\n-  \
  \ 某人给某个机构打电话，假装有正当目的，并试图欺骗机构中的某人泄露个人或受保护的信息。这种身份冒装的形式被称为社会工程学，可能会损害组织的业务功能并导致损失。\n\
  \n## 揭秘社会工程学\n\n社会工程学是一种常用的技术，用于欺骗人们泄露敏感信息。在电视节目《杠杆》（*Leverage*）中，内森·福德（又名 Nate）策划了一场针对贪婪和腐败分子的复杂计划，这是社会工程学的一个经典案例。社会工程工程师不会仅仅说“把你的秘密给我”。相反，攻击者会使用奉承和欺骗等技术，通常取决于受害者乐于帮助的意愿。\n\
  \n漏洞评估中常用的常用技术是要求员工提供他们的用户名和密码。这种请求可能以电子邮件、电话甚至面对面的形式出现。\n\n例如，在发送请求用户名和密码的电子邮件时，该邮件可能会被修改，使其看起来像是来自某位高管。这封邮件增加了紧迫感，并可能包含相关引用：\n\
  \n```\nFrom: CEO\nSubject: 项目更新\n\n各位，\n\n我们需要您提供您的用户名和密码，以更新我们的安全设置。请尽快回复。\n\n\
  感谢您的配合。\n\nCEO\n```\n\n社会工程工程师不会仅仅说“把你的秘密给我”。相反，攻击者会使用奉承和欺骗等技术，通常取决于受害者乐于帮助的意愿。\n\
