  \    1. 验证风险要素\n    2. 购买应对措施\n    3. 重新进行风险评估\n    4. 重新进行 CBA（成本效益分析）\n\n12. 正在评估两种可能的缓解风险的应对措施，但管理层只想购买一种。用什么来确定哪种应对措施提供了更好的成本效益？\n\
  \    1. 威胁发生概率/影响矩阵\n    2. 威胁评分\n    3. CBA\n    4. CIA\n\n13. 正在进行成本效益分析以确定是否应该使用应对措施。应该应用以下哪个公式？\n\
