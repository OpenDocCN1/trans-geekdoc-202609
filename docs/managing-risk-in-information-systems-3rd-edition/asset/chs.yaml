  \ Web 服务器服务器。根据现有服务器的能力，可以选择用六台新服务器替换旧服务器。\n*   **为管理员提供培训**——配置和管理故障转移集群可能会变得复杂。如果管理员以前没有过故障转移集群，他们将需要培训。网络负载均衡也是。\n\
  *   **安装和配置**——配置和管理故障转移集群可能会变得复杂。如果管理员以前没有过故障转移集群，他们将需要培训。网络负载均衡也是。\n*   **测试**——在系统上线之前，应对其进行测试。\n\
  *   **实施**——一旦配置稳定，即可实施。\n\n### 优先排序需要风险缓解的风险元素\n\n识别最重要应对措施的方法之一是对风险风险元素进行优先级排序。风险在威胁利用漏洞时发生。风险的重要性可以通过估算其发生概率和影响来确定。极可能发生且影响重大的风险是最重要的。\n\
  \n#### 使用威胁概率/影响矩阵\n\n\n\n威胁会对机密性、完整性或可用性产生负面影响。威胁的严重性通过识别威胁影响这些元素之一的概率来评估，而影响则通过确定其受影响的程度来评估。\n\
  \n## 注意\n\n网络钓鱼是一种社会工程学网络犯罪形式，钓鱼者通过伪装成受信任的来源来攻击目标，通常诱导目标提供敏感数据，例如他们的银行详情。网络钓鱼还可用于投放恶意软件。那些没有过识别此类威胁教育的个人往往会遭受损失，特别是当攻击者能够访问他们的个人身份信息时。\n\
  \n`表 11-2` 显示了一个示例威胁概率/影响矩阵。该矩阵可以用于确定各种威胁的优先级。发生概率在 0% 到 10% 之间的威胁将被分配 10% 的值，发生概率在\
  \ 11% 到 50% 之间的威胁将分配 50% 的值，发生概率在 51% 到 100% 之间的威胁将分配 100% 的值。同样，根据对组织的影响，将分配 10、50\
  \ 或 100 的影响值。\n\n**表 11-2** 威胁概率/影响矩阵\n\n![](img/Table11-2.png)\n\n## 应对措施的优先级排序\n\
  \n威胁概率/影响矩阵可用于风险和应对措施的优先级。得分较高的风险会导致更大的损失，应该在处理得分较低的风险之前处理。\n\n风险是根据当前执行的应对措施评估的。例如，如果一个组织没有使用杀毒软件，那么系统被感染的概率将很高。如果多个系统被感染，影响也将很大。100%\
  \ 的高概率乘以 100% 的高影响等于 100 分的得分。\n\n另一个例子是，公司在所有系统上都安装了杀毒软件，在过去的一年里，只有在一个用户禁用了杀毒软件后，发生了一个恶意软件事件导致了问题。恶意软件试图传播，但很快被其他系统上的杀毒软件检测到。在这个例子中，概率和影响都很低，因此威胁发生的得分为\
  \ 1 分。\n\n## 参考\n\n根据需要，分配给词汇值的数值值可以不同。例如，低影响可以分配 0 的值而不是 10。高概率可以分配 90% 的值而不是 100%。此外，数据点可以多于三个，并可以使用不同的名称，如低、中低、中、中严重和严重。`表\
  \ 11-3` 显示了如何使用威胁概率/影响矩阵来对威胁进行优先级排序。每个威胁都根据当前的应对措施分配了概率和影响。\n\n**表 11-3** 用于威胁优先级排序的威胁得分\n\
  \n![](img/Table11-3.png)\n\n来自表 11-3 的信息显示，目前最大的威胁是得分均为 50 的两个：\n\n*   对 DMZ 服务器的攻击\n\
  *   关键数据库服务器上的数据丢失\n\n这两个威胁在处理其建议的应对措施时可能会被赋予高优先级。\n\n对 DMZ 服务器的攻击是一种威胁，因为这些服务器每六个月才更新一次。这些更新旨在修复软件发布以来发现的漏洞\
  \ 和漏洞。如果漏洞没有修复，服务器就会很脆弱。许多攻击者寻找未安装最新补丁的服务器，这使得该风险具有高概率。\n\n在这种情况下，解决方案是简单的。将实施应对措施以确保服务器是最新的。有几种方法可以实现这一点。\n\
  \n\n\n然而，在这个示例中，应用程序和数据库开发人员可能已经采取了措施来解决问题。许多简单的编程技术可以降低这种风险。应用程序开发者忽略这些技术的常见原因是他们并不了解这些风险。基于这一情景，重新评估风险和解决方案是值得的。可以对应用程序开发人员进行访谈，确定他们采取了哪些措施来修复漏洞，然后对该解决方案进行评估以确定其有效性。\n\
  \nIT 管理员甚至可能决定将此解决方案作为应对措施。他或她将编写一项政策，以确保所有易受 SQL 注入攻击威胁的代码都使用这种应对措施，并且所有应用程序在发布前都必须经过\
  \ `SQL injection` 漏洞测试。\n\n也许原始的解决方案是购买某种产品。然而，如果风险不再存在，就不应该在应对措施上花费资金。\n\n### 对已识别的风险进行成本效益分析\n\
  \n[成本效益分析 (CBA)](https://wiki.example.org/cost-benefit_analysis) 有助于确定是否应该使用应对措施。如果应对措施的收益大于成本，则该应对措施就能产生收益；如果存在两种可以缓解相同风险的应对措施，可以完成两次\
  \ CBA 以确定哪种的收益更好。然后，就可以实施该应对措施。\n\n### ![](img/Note.png)注意\n\n如果风险评估和缓解计划开始之间的时间很快，那么这一步就不那么重要。风险评估将识别风险因素以及建议的缓解措施。管理层随后批准这些措施。\n\
  \n#### 计算 CBA\n\n在执行 CBA 时，起点是识别没有应对措施时的预期损失以及实施应对措施后的预期损失。这计算出了预期收益。公式为：\n\n应对措施前的损失\
  \ - 应对措施后的损失 = 预期收益\n\n接下来确定应对措施的成本。公式为：\n\n预期收益 - 应对措施成本 = 应对措施价值\n\n### ![](img/Tip.png)提示\n\
  \n防止`SQL 注入`攻击的一种方法是使用存储过程来验证输入。存储过程是数据库应用程序内部的一种脚本或微程序。不是直接使用用户输入的数据，而是将其传递给存储过程。存储过程在使用之前对其进行验证。它会拒绝用于\
  \ `SQL injection` 攻击的无效数据。\n\n如果结果为正值，则应对措施产生了成本收益；而如果应对措施的成本高于收益，则该应对措施无法产生成本收益。如果这两个数值接近，就可以计算投资回报率\
  \ (`ROI`)。`ROI` 计算应对措施在整个生命周期内的价值。\n\n这一过程中最重要的部分是识别成本和收益。目标是识别有形和无形价值。如果没有准确识别成本和收益，CBA\
  \ 将失去价值并可能需要重新完成。\n\n完成准确的 CBA 可能需要大量时间。由于时间要求，不会对每种可能的应对措施都进行 CBA。例如，如果熟练的管理员可以编写脚本来缓解风险，那么应对措施的成本几乎为零。因此，没有必要进行\
  \ CBA。另一方面，\n\n#### CBA 报告\n\n任何 CBA 通常包含以下元素：\n\n### ![](img/Note.png)注意\n\n* \
  \  **年度预期损失**：使用 `ALE` 来确定风险。\n*   **建议的应对措施**：此处提供了应对措施的详细信息。\n*   **待缓解的风险**：提供了威胁/漏洞对的详细信息。如果应对措施是消除漏洞，将包含其实现方式的概述；如果应对措施是减少漏洞，将包含成功率的估计。\n\
  *   **年度预期收益**：将直接和间接收益计算为年度金额价值。\n*   **初始成本**：在此列出初始成本，包括购买价格和实施应对措施的任何间接成本。\n\
  *   **年度或经常性成本**：某些应对措施需要持续维护成本。\n*   **成本与收益的比较**：这是报告的主要目的。\n\n\n\n任何项目都会存在不确定因素和意外，对于复杂的防御措施来说尤其如此。然而，前期的计划规划可以将这些不确定因素降至最低。如果没有充分的计划，项目可能会超出预算或频繁延误。\n\
  \n任何一种问题都可能导致管理层改变对防御措施价值的判断。如果实施成本过高或耗时过长，管理层会对该防御措施的价值产生怀疑。\n\n## 保持在预算范围内\n\n\
  在本章之前提到的添加 Web 农场和故障备集群的示例中，在实施后，它们将减少停机时间并提高网站的可用性。这些都是复杂防御措施的示例。\n\n如果识别了实施计划的所有成本，项目将进展顺利；但如果如果某些成本未被识别，项目就会出现问题。这些问题可能出现在以下任何领域：\n\
  \n*   **初始购买成本**——设备价格昂贵，且备备集群中使用的服务器有特定的技术要求。如果有人决定削减成本以牺牲备备集群要求为代价购买廉价的服务器，可能会遇到额外的问题。可能需要进行大量的测试，以最终确定廉价的服务器在备备集群中是否可靠。更糟糕的是，廉价的服务器可能无法在备备集群中工作，需要购买更多服务器。\n\
  *   **设施成本**——新服务器可能无法放入现有的设备机柜，这将需要设施成本来容纳它们。此外，服务器的增加可能会导致房间电源过载，并导致断路器跳闸，从而导致其他服务器停机。空调可能不足以充分冷却房间，导致导致过热并对现有服务器造成设备损坏。如果这些问题没有尽早解决，其中任何一个问题都可能是巨大的。\n\
  *   **安装成本**——如果内部人员不具备安装防御措施的专业知识，将产生专业安装的额外费用，并导致项目延误。缺乏必要专业知识的内部技术人员尝试但未能完成安装和配置，将浪费宝贵的工时，更糟糕的是，他们的努力实际上可能会损害防御措施。\n\
  *   **培训成本**——如果技术人员不知道如何操作防御措施，它可能只会呆在角落里吃灰。是的，它是一台可以完成很棒事情的高级新服务器。但如果没有人知道如何使用它，在技术人员安装后，它可能一直留在箱子里或关闭电源，在人员接受充分培训之前，实施将会延误。\n\
  \n这些任何额外成本都可能轻易打破预算。如果防御措施的成本超过分配预算，管理层可能会决定放弃该防御措施。此外，每当识别出一个额外成本时，都需要重新评估 `CBA`，因为实施防御措施的最初决定是基于原始成本做出的。随着成本的增加，防御措施的价值就会降低。\n\
  \n## 保持进度\n\n任何项目的一个重要考虑因素都是进度。任务应该经过计划，以确保它们按照特定的顺序发生，这意味着如果任何任务延误，其他任务也可能延误，而这些延误可能会影响实际实施日期。\n\
  \n可以用于保持进度的工具之一是里程碑图。图 11-5 显示了本章讨论的 Web 服务器升级的示例里程碑图。项目经理通常使用项目管理软件来自动创建这些图表。\n\
  \n![图 11-5 里程碑计划图。](img/9781284183719_CH11_FIGF05.png)\n\n**图 11-5** 里程碑计划图。\n\n\
  在使用项目管理软件时，可以输入里程碑日期和任何特定任务的长度。然后软件允许以多种格式显示数据。\n\n例如，图 11-6 以甘特图格式显示了同一个项目。一旦数据输入项目管理软件中，以另一种格式显示数据是相对容易的。通常，更改格式只需要点击几次鼠标。\n\
  \n![图 11-6 甘特图。](img/9781284183719_CH11_FIGF06.png)\n\n**图 11-6** 甘特图。\n\n某些任务之间存在依赖关系。例如，在向机柜供电之前，需要需要得先安装新的设备机柜，而且培训的时机非常重要。如果培训提供得太早，当技术人员需要安装设备时，他们已经忘记了；反之，如果提供得太晚，他们可能在没有培训的情况下安装设备，或者项目进度可能会滞后。\n\
  \n关键路径图显示了依赖关系，如图 11-7 所示。如果关键路径中的任何项目发生滞后，整个项目将延误。经理必须密切关注关键路径项目，以确保项目按时完成。\n\n\
  ![图 11-7 关键路径图。](img/9781284183719_CH11_FIG07.png)\n\n**图 11-7** 关键路径图。\n\n例如，项目\
  \ 2 和 5 不在关键路径上。服务器的购买和房间空调可以延迟。当然，它们不能无限期延误。在安装和配置服务器时，这些里程碑必须满足。\n\n所使用的工具并不重要，重要的是意识到它们是可。对于简单的项目，进度可能只是在餐巾上勾勒，但较大的项目将从更复杂的可用工具中获益。\n\
  \n## 跟进风险缓解计划\n\n管理的一个重要部分是跟进，以确保计划按预期执行，风险管理也不例外。在跟进风险缓解计划时，应包含以下两个元素：\n\n*   确保防御措施已实施\n\
  *   确保安全漏洞已关闭\n\n### 确保防御措施已实施\n\n用于确保防御措施实施的主要工具是 `POAM`。`POAM` 随随评估创建，但它是一个动态文档，因为经理会定期更新它。当风险转换为风险缓解计划时，`POAM`\
  \ 文档会扩展。\n\n`POAM` 包含了所有批准的防御措施及其时间表。简单的防御措施可能只有一个或两个里程碑，而复杂的防御措施可能有多个里程碑。如果里程碑按预期完成，确保进度的概率会更高。换句话说，关注最终日期不如关注里程碑日期重要。\n\
  \n如果错过了任何一个里程碑，整个项目可能会延误。正如之前提到的，关键路径图对于确定必须满足哪些里程碑以确保项目按时完成是非常价值的。\n\n当使用项目管理软件时，一眼屏幕通常就能显示防御措施的实施是否按计划。项目管理软件使用颜色标记的状态符号。例如，绿色圆形可能表示项目按计划进行；黄色圆形，项目稍微延迟；红色圆形，严重延误。许多项目经理在报告中使用术语指示项目处于“绿灯”还是“红灯”。绿灯”表示按计划进行，“红灯”表示严重延误，这通常会引起高层管理的注意。\n\
  \n\n\n\n### 注意\n\n![NOTE](img/Note.png) 注意\n\n可以专门为风险缓解计划创建一个独立的 POAM（计划、预算和里程碑）。例如，风险评估中的\
  \ POAM 可能要求在特定日期之前创建风险缓解计划。无论使用什么来跟踪计划进度，关键点在于必须对其进行跟踪。\n\n#### 确保安全漏洞已关闭\n\n必须对应对措施进行检查，以确保它们按预期工作。由于应对措施的目的是缓解风险，因此它应该要么减少威胁的影响，要么减少脆弱性。\n\
  \n对于任何产品都是如此；它应该按预期 own 工作。看电视广告可能会让人们相信广告中的产品将帮助他们减肥、发财或改善健康。然而，当他们收到产品并发现其性能未达到预期时，他们就会意识到自己浪费了钱。\n\
  \n同样，并不是所有的应对措施都能按预期工作。发现其性能的唯一方法是进行测试和评估，而且某些应对措施比其他措施更容易评估。例如，漏洞扫描器检测到了漏洞，风险评估建议采取某种应对措施来消除该漏洞。在实施应对措施后，运行相同的漏洞扫描。如果扫描没有检测到该风险，那么显然应对措施已经关闭了安全漏洞。然而，如果扫描仍然检测到该风险，显然安全漏洞仍然处于开放状态，需要采取额外步骤。风险评估并不非要从头开始，但应该解决该漏洞。\n\
  \n在 Web 集群和故障转移集群的示例中，目标是消除停机并增加可用性。停机将表明解决方案不起作用。然而，停机会导致收入损失。与其等待停机，不如进行测试来衡量应对措施的性能。可以使用的一些测试和测量包括：\n\
  \n*   **衡量 Web 集群的负载**：在正常运行期间，负载应该在服务器之间平衡，并可以使用负载均衡软件进行测量。也可以衡量单个服务器的资源。如果服务器硬件相似，则每台服务器的处理器、内存、网卡和磁盘使用应该是大致相。\n\
  *   **从 Web 集群中移除服务器**：移除服务器模拟了 Web 集群中服务器的故障，不应影响整个集群。也就是说，如果从 Web 集群中移除一台服务器，其他服务器应该接管负载。此外，新客户端不应被重定向不存在的服务器。\n\
  *   **向 Web 集群中添加服务器**：如果网站经历了更大的增长，它应该能够处理向 Web 集群中添加另一个 Web 服务器，这允许 Web 集群向外扩展。网络负载均衡软件随后应与新服务器平衡负载。因此，可以在不更改实际服务的情况下向\
  \ Web 服务中添加更多客户端。\n*   **逻辑上传输故障转移集群上的节点**：故障转移集群包含可以逻辑上交换节点的软件。例如，它可以用于在逻辑上将 `node\
  \ 2` 从非活动切换为活动，并将 `node 1` 从活动切换为非活动。如果此切换在测试期间失败，不会导致停机，但它表明集群在实际故障期间无法防止停机。\n\
  *   **关闭故障转移集群上的活动节点**：如果逻辑传输正常，就可以模拟活动节点的实际故障。\n\n#### 从风险评估中启用缓解计划的最佳实践\n\n以下列表列出了应该遵循的若干最佳实践：\n\
  \n*   **保持在范围之内**：缓解计划不应超出范围。如果不进行管理，成本可能会很容易失控。\n*   **在发现新成本时重新进行 CBA**：通常要求对应对措施完成成本效益分析。如果识别出额外成本，风险仍然存在。\n\
  *   **应对措施的优先排序**：应该根据其重要性对应对措施进行优先排序。\n*   **分析中包含当前应对措施**：在对应对措施评分时，必须考虑当前的应对措施。例如，某个威胁可能具有高影响，但现有的应对措施已将其影响降低。\n\
  *   **控制成本**：成本应保持在预算范围内。如果额外成本过高，应对措施的价值可能会大幅降低。\n*   **控制进度**：当进度延迟时，成本通常会增加，实施越推迟，面临风险的时间就越长。\n\
  *   **跟进**：应该检查批准的应对措施，以确保它们已实施并缓解了风险。\n\n### 提示\n\n![TIP](img/Tip.png) 提示\n\n在故障转移集群的寿命范围内，可以定期交换节点。这样做的一个常见原因是维护。例如，可以在\
  \ `node 1` 激活时更新 `node 2`。随后，可以将 `node 2` 上线并激活，从而允许 `node 1` 下线进行更新。\n\n### 总结\n\
  \n本章涵盖了在将风险评估转换为风险缓解计划时应该考虑的许多细节。起点是彻底审查应对措施，过程通常包括将威胁与脆弱性进行匹配，并识别与之相关的所有成本，包括任何隐藏成本。如果成本发生变化，可能需要重新进行成本效益分析。\n\
  \n如果自风险评估批准以来已经过了长时间，必须验证风险要素的存在以及应对措施缓解风险的有效性。执行计划时的两个关键目标是保持在预算并按进度进行。最后，应进行跟进，以确保批准的应对措施已经实施，并按预期缓解了风险。\n\
  \n### 核心概念和术语\n\n*   `account management policy`\n*   `cost-benefit analysis (CBA)`\n\
  *   `implicit deny`\n*   `network load balancing`\n*   `password policy`\n\n\n\n\
