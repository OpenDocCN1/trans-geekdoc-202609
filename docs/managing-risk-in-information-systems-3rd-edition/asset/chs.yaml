  \ 的人表示他们有安全策略计划。10% 的人表示他们在过去一年中测试过该计划。\n\n### 理解并管理威胁\n\n威胁是指任何对资产构成可能危险的因素或活动。威胁包括任何不利影响机密性完整性和可用性的情况。威胁是创建风险的公式的一部分：\n\
  \n风险 = 威胁 × 漏洞 × 资产\n\n任何管理风险尝试都需要对威胁有深入了解。本节包括：\n\n*   威胁的不可消除性\n*   无意威胁\n*  \
  \ 故意威胁\n*   管理威胁的最佳实践\n\n#### 威胁的不可消除性\n\n意识到关于威胁的一些基本事实是重要的：\n\n*   威胁无法被消除。\n\
  *   威胁始终存在。\n*   有时威胁会持续存在。某些威胁在资产中长期存在未被发现。\n*   可以采取措施来减少威胁发生的可能性。\n*   可以采取措施来减少威胁的影响。\n\
  \n\n\n\n\n- **人为错误**——由人员引起的错误。简单的按键错误就可能导致错误或无效数据的输入。用户可能会忘记输入关键数据。技术人员可能未能遵循备份程序，导致备份不完整。管理员可能会编写不完整或错误的备份程序。未发现的软件漏洞也可能导致严重问题。\n\
  - **事故**——从轻微失误到重大灾难的任何事情。挖掘机为新电缆挖新沟时可能会意外切断电源或数据电缆。员工可能会在休息室意外引发火。\n- **故障**——设备问题。硬盘可能会崩溃，服务器可能会故障，路由器可能会停止路由流量。空调可能会停止吹冷风，导致多个系统过热并故障。这些任何故障都可能导致数据或服务的可用性丢失。\n\
  \n尽管这些威胁是非故意的，但可以通过风险管理计划来应对。以下是一些常用方法：\n\n- **管理环境威胁**——可以通过购买保险来减少许多环境威胁的影响。企业可能会决定搬迁以减少威胁。例如，位于圣海伦斯火山地区的企业可以搬迁以避开喷发。位于飓风带的公司可以将业务转移到其他地方。\n\
  - **减少人为错误**——自动化和输入验证是减少错误的常用方法。任何可以自动化的过程都会以一致的方式运行。输入验证在在使用数据前检查数据以确保其有效性。例如，如果程序期望一个名字，输入验证器会检查该数据看起来像不像有效的名字。有效名字的规则可能不超过\
  \ 20 个字符，不含数字，且仅允许特定的特殊字符。输入验证无法确保数据的准确性，但它可以确保数据的有效性。\n- **防止事故**——在密歇根州，可以联系 `1-800-MISS-DIG`\
  \ 公司或其他地区的类似公司或机构，以便在挖掘前识别地下电缆。服务器房应安装空调以防止崩溃。为了防止常见事故，应该强调安全意识。\n- **规避故障**——可以使用容错系统和冗余系统来防止故障的即时影响。独立磁盘冗余（`RAID`）系统有助于确保数据可用性，而故障转移集群有助于确保用户能够随时访问服务器。\n\
  \n## 故意性威胁\n\n`故意性威胁`是对组织具有敌意的行为。通常涉及一个或多个实施者参与执行此类威胁。实施者的动机通常源于以下因素：\n\n- **贪婪**——许多攻击者想要通过攻击获利。攻击者窃取数据并利用其进行欺诈。他们从数据库中窃取客户数据并实施身份盗窃。犯罪分子从竞争对手窃取专利数据。社会工程师试图骗用户交出财务网站的密码。\n\
  - **愤怒**——当愤怒是动机时，攻击者通常希望受害者付出代价。愤怒可能导致破坏资产或中断运营的尝试。这些威胁通常会导致可用性丢失。\n- **破坏欲**——某些攻击者只想造成破坏。其结果与受愤怒驱动的攻击者相同。破坏会导致可用性丢失。\n\
  \n尽管上述列表有助于理解攻击者的动机，但这些项目并未识别出攻击者是谁。某些人脑海中仍留存着无聊的青少年在房间里发起随机威胁的形象。然而，如今的攻击者要复杂得多。\n\
  \n### 提示\n\n美国政府国土安全部维护着网站网站提供了常见威胁及其描述。可以访问该网站：[`www.us-cert.gov/us-cert-tip-categories/threats`](https://www.us-cert.gov/us-cert-tip-categories/threats)。\n\
  \n如今一些较常见的攻击者包括：\n\n- **犯罪分子**——通过网络攻击获利的机会导致犯罪活动增长。此外，如今的犯罪活动比以往任何时候都更有组织性。此类活动包括欺诈和盗窃。例如，`rogueware`\
  \ 骗用户安装虚假的防病毒软件。然后，他们必须付费才能删除。犯罪分子已使用流氓软件勒索了数百万美元。近期，流氓软件已变为 `ransomware`（勒索软件）。犯罪分子限制对系统的访问并向用户显示信息，要求赎金以获取对计算机和/或文件的访问权限。犯罪子的另一种常见攻击是\
  \ `formjacking`（表单注入）。此类攻击使用恶恶的 `JavaScript` 代码在电子商务网站的结算阶段窃取客户的个人财务详情，如信用卡信息。\n\
  - **高级持续性威胁 (APTs)**——这些攻击者专注于特定目标，具有高水平的专业知识和几乎无限的资源。国家力量或恐怖组织经常赞助他们。他们同时攻击政府和私人目标。极光行动（Operation\
  \ Aurora）就是一个 APT 攻击示例。调查表明该 APT 攻击源自中国。它攻击了包括 `Google` 在内的几家私营公司。McAfee 一篇题为“揭秘：影子\
  \ RAT 行”的白皮书讨论了 71 种不同的 APT 攻击。其中 21 种针对政府目标，50 种针对私人公司。\n- **破坏者**——某些攻击者致力于制造破坏。他们仅仅是为了破坏东西而破坏。他们的目标通常是机会性目标。\n\
  - **破坏破坏**——破坏者实施破坏行为。破坏可能是针对竞争公司或其他国家。其主要目标是导致可用性丢失。\n- **不满的员工**——不满的员工通常会对公司构成重大威胁。员工产生不满的原因有无数种，例如，没有获得加薪。拥有大量访问权限的员工可能会造成巨大的损害。\n\
  - **活动人士**——偶尔，活动人士会对公司构成威胁。他们通常以“目的证明手段正当”的心态运营。换句话说，如果公司做了活动人士不认可的事情，活动人士就会认为进行攻击是可以接受的。有时，这些攻击发生在国家层面，由动机是希望国家政策或决策发生某种变化的非国家行为者发起。\n\
  - **其他国家**——国际间谍是一个常见且持续的威胁。例如，McAfee 的“影子 RAT 行”白皮书详细介绍了被广泛认为来自中国的间谍活动。攻击者使用远程访问工具（`RATs`）收集信息。他们渗透了多个政府和私营公司。许多国家将网络战作为其进攻和防御策略的一部分。\n\
  - **黑客**——黑客试图破解系统。根据黑客的目标，其动机可能从无意的好奇心到恶意意图不等。\n\n### 提示\n\n黑客（hacker）和破解者（cracker）之间存在技术上的区别。`Hackers`\
  \ 在历史上被称为白帽黑客或伦理黑客，即“好人”。他们入侵系统是为了学习如何实现，但不是为了个人利益。`Crackers` 被称为黑帽黑客或恶意黑客，即“坏人”。他们入侵系统是为了进行破坏、盗取或实施欺诈。许多黑帽黑客伪装成白帽黑客，声称他们的行为是无害的。然而，大多数主流媒体将所有黑客归为黑帽类。普遍认知是所有黑客都是坏人。\n\
  \nIT 基础设施中风险管理的最佳实践\n\n\n\n\n\n可以通过许多步骤来管理 IT 基础设施中的风险。以下列表代表了 IT 安全专业人员认为的最佳实践步骤：\n\
  \n*   **制定安全策略**——高级管理人员识别并支持安全角色，并制定一项安全策略，该策略对安全目标提供了高层概述，但不包含如何实施安全技术的细节。管理人员利用此策略来识别资源并制定实施该策略的计划。安全策略是减少威胁影响的重要第一步。一旦安全策略获得批准，就需要进行实施和执行。\n\
  \n*   **购买保险**——公司购买保险以减少威胁的影响。他们通常会购买火灾、盗窃以及由于环境事件导致损失的保险。这里需要考虑的一个重要原则是：\n\n \
  \   *   **比例原则**——用于缓解风险的支出金额（例如购买保险）应与风险成正比。例如，不应为价值 $50,000 的资产购买保额为 $100,000\
  \ 的保险。\n\n*   **使用访问控制**——用户应被要求身份验证，并仅授予其所需的访问权限。使用访问控制包括以下两个原则：\n\n    *   **最小权限原则**——最小权限原则涉及仅授予用户执行其工作所需的权利和权限，不能更多。通过这样做，可以防止用户无意或蓄意地引起问题。\n\
  \n    *   **知其原则原则**——知其原则涉及仅授予用户执行其工作所需的数据访问，不能更多。例如，某人可能拥有机密（Secret）数据的安全许可。但该人员并不会自动获得所有机密数据的访问。相反，该人员仅被授予其工作所需的访问。这有助于防止不必要的访问被滥用。\n\
  \n*   **使用自动化**——应尽可能使流程自动化，以减少人为错误。\n\n*   **包含输入验证**——为了确定数据是否有效，在任何应用程序使用它之前对其进行测试。\n\
  \n*   **提供培训**——培训可以提高安全意识并减少事故，还可以通过增强安全意识来减少安全事件。\n\n*   **使用杀毒软件**——所有系统都应安装杀毒软件，并应安排病毒定义更新自动进行。\n\
  \n*   **保护边界**——至少应使用防火墙来保护内网与互联网之间的边界。还可以使用入侵检测系统（IDS）作为额外的保护层。\n\n![](img/Tip.png)\
  \ 提示\n\n安全策略可能包含几项单独的策略。例如，它可以包含密码策略、可接受使用策略和防火墙策略。\n\n![](img/Note.png) 注意\n\n\
  特权包括权利和权限。`Rights`（权利）是指用户对对象可以执行的操作。例如，用户可能拥有更改系统时间的权利。`Permissions`（权限）是指对象的访问。例如，用户可能拥有读取和修改文件的权限。`最小权限原则`包含了权利和权限。`知其原则`侧重于数据权限。\n\
  \n#### 2018 年全球全球安全调查\n\n专业服务公司安永（Ernst & Young）包含了 1,400 名首席信息官、首席安全官和其他高管的回复。一些显著的发现如下：\n\
  \n*   报告显示每天发送的邮件达 5 亿封。\n*   2017 年数据泄露的成本约为 362 万美元。\n*   25% 的组织报告其网络安全预算与去年相比保持不变，15%\
  \ 的组织报告网络安全预算下降了 25%。\n\n*   在受访者中，约 17% 的人认为客户信息对网络攻击者最有价值，22% 的人认为钓鱼是最大的网络威胁，20%\
  \ 的人报告了恶意软件。\n\n*   受访者报告，漏洞最大的来源（34%）是疏忽/缺乏意识的员工，26% 的人指出来源是过时的安全控制。\n\n*   受访者表示，组织需要向较新的技术上投入资金，例如云计算、网络安全分析、移动计算、人工智能、机器学习、机器人流程自动化和区块链。\n\
  \n*   受访者对治理的必要性表示认同，表明网络安全需要进入组织的基因。\n\n### 理解和管理漏洞\n\n漏洞可以是资产或环境中的弱点。弱点也可以被视为任何系统或业务流程中的缺陷。\n\
  \n漏洞可能会导致风险，尽管它本身不会变成损失。当威胁利用漏洞时，损失就会发生，这也称为“威胁/漏洞对”。\n\n`FIGURE 2-1` 显示了从威胁到损失的流程。缓解技术可以用于减少漏洞、损失或两者。\n\
  \n![FIGURE 2-1 威胁/漏洞对的流程。](img/9781284183719_CH02_FIGF01.png)\n\n**图 2-1** 威胁/漏洞对的流程。\n\
  \n本节介绍以下主题：\n\n*   威胁/漏洞对\n*   缓解漏洞\n*   缓解技术\n*   IT 基础设施内管理漏洞的最佳实践\n\n## 威胁/漏洞对\n\
  \n当威胁利用漏洞时，就会产生威胁/漏洞对。\n\n\n\n\n\n表 2-1 展示了威胁/漏洞对及其潜在损失的示例。此表只是冰山一角。任何单一网络的漏洞列表都可能非常详尽。\n\
  \n### 表 2-1 威胁/漏洞对示例及潜在损失\n\n| 威胁 | 漏洞 | 有害事件或损失 |\n| --- | --- | --- |\n| 火灾 |\
  \ 缺乏火灾检测和灭火设备 | 可能导致业务全盘损失 |\n| 人为 | 未锁的计算机实验室 | 设备和数据丢失 |\n| 恶意软件 | 缺乏杀毒软件；定义库过旧\
  \ | 感染（损失影响取决于恶意软件的载荷） |\n| 设备故障 | 数据未备份 | 数据可用性丢失（损失影响取决于数据价值） |\n| 数据被盗取 | 访问控制实施得不当\
  \ | 数据机密性丢失 |\n| 拒绝服务 (DoS) 或分布式拒绝服务 (DDoS) 攻击 | 公网端服务器未受防火墙和入侵检测系统 (IDS) 保护 | 服务可用性丢失\
  \ |\n| 用户 | 弱密码 | 机密性丢失 |\n| 社会工程人员 | 缺乏安全意识和教育 | 损失取决于攻击者的目标和成功与 |\n\n#### 漏洞可以被缓解\n\
  \n缓解或减少漏洞可以降低潜在风险。风险的降低源于以下一项或多项组合：\n\n* 识别并优先处理漏洞\n* 减少漏洞的暴露面\n* 降低发生率\n* 减少损失的影响\n\
  * 提供安全教育、培训和意识提升\n\n完全消除威胁是罕见的。相反，更常见的是风险降低到可接受的水平。剩余的风险被称为`剩余风险`。表 2-2 将表 2-1 中的威胁/漏洞对与可能的缓解步骤相对应。\n\
  \n### 表 2-2 常见威胁/漏洞对及可能的缓解步骤\n\n| 威胁 | 漏洞 | 缓解措施 |\n| --- | --- | --- |\n| 火灾 |\
  \ 缺乏火灾检测和灭火设备 | 安装火灾检测和灭火设备；购买保险 |\n| 飓风、地震、龙卷风 | 位置 | 购买保险；指定备用站点 |\n| 恶意软件 | 缺乏杀毒软件；定义库过旧\
  \ | 安装杀毒软件；至少每周更新定义库 |\n| 设备故障 | 数据未备份 | 定期备份数据；保留异地备份副本 |\n| 数据被盗取 | 访问控制实施得不当\
  \ | 同时实施身份验证和访问控制；按需告知原则 |\n| DoS 或 DDoS 攻击 | 公网端服务器未受防火墙和 IDS 保护 | 实施防火墙；实施 IDS；定期监控\
  \ Web 服务器 |\n| 用户 | 弱密码 | 同时实施身份验证和访问控制；创建强密码 |\n| 社会工程人员 | 缺乏安全意识 | 提供培训；通过海报、定期邮件和简短演示提高意识\
  \ |\n\n### 缓解技术\n\n任何企业都可以使用多种缓解技术。在探索本节介绍的技术时，应将以下因素记在心中：\n\n* 技术的有效性\n* 技术的初始成本和持续成本\n\
  \n例如，杀毒软件有初始成本，其中包括在一段时间内（如一年）的更新订阅。当订阅过期时，必须续订。\n\n在估计这些任何一项技术的价值和成本时，可以考虑资源的价值和损失的影响。例如，基础社会工程学策略的培训每年可能花费\
  \ 10,000 美元。但是如果用户没有接受培训，公司可能会损失 100,000 美元。因此，培训的价值为 90,000 美元。\n\n然而，在估计缓解技术的价值时，还有其他变量需要考虑。某公司去年损失了\
  \ 100,000 美元。如果进行了培训，公司预计只会损失 10,000 美元。因此，培训价值为 5,000 美元。计算方法如下：\n\n去年的损失 - 培训成本\
  \ - 今年的损失\n\n100,000 - 10,000 - 5,000 = 85,000\n\n以下列表识别了任何企业都可以使用的常用缓解技术：\n\n*\
  \ **政策和程序**——书面政策和程序提供了标准。标准明确了应该实施什么以及如何实施。如前所述，应定期审查政策和程序。\n* **文档**——文档在许多领域都很有用。最新的网络文档使得故障排除更容易。一旦发生问题，可以更快地修复，从而提高可用性。随着网络和系统的变化，需要更新文档。\n\
  * **培训**——培训帮助员工理解安全是每个人的责任。某些培训面向所有用户，其他培训针对特定用户。例如，终端用户应了解社会工程人员，管理员应了解威胁和漏洞，经理应了解风险管理策略。培训是持续性工作；随着情况变化，应提供更新的课程。\n\
  * **职责分离**——职责分离 原则也称为权限分离，确保没有个人控制关键流程的所有功能。该原则旨在防止欺诈、盗窃和错误。例如，会计部门将应收和应付分开。一个部门接收并批准账单，另一个部门支付。职责分离还有助于防止利益冲突。\n\
  * **配置管理**——当系统配置标准化时，系统更容易进行故障排除和维护。配置管理 的一种方法是使用基准。例如，对系统进行配置然后创建一个系统镜像。将镜像部署到其他\
  \ 100 台系统中，使每个系统都完全相同。这些每个系统的维护方法都是一样的。当技术人员学会一个系统时，他们学会了所有系统。如果没有基准，系统可能会有 100\
  \ 种不同的配置方式，导致技术人员在提供有效支持之前学习每个系统的配置。随着配置的变化，需要更新镜像。配置管理还确保系统不被不当修改。大多数组织都有变更管理流程，确保只进行授权的更改。通过合规性审计确保不发生未经的更改。\n\
  \n\n\n\n\n* **补丁管理**——随着时间的推移，软件中可能会发现漏洞。软件漏洞是可以被利用的缺陷。当漏洞被发现时，厂商会对其进行修补；然而，攻击者也会发现这些漏洞。未打补丁的系统容易受到攻击。全面的补丁管理策略规定如何理解、测试以及将补丁部署到系统和客户端。该策略应包含合规审计，以验证客户端是否处于最新状态。补丁管理还可以包括隔离未补补客户端的能力。补丁管理是一个几乎持续的过程。\n\
  \n* **入侵检测系统**——入侵检测系统 (IDS)旨在检测威胁而非预防威胁。被动 IDS 会记录事件并可能提供警报。主动 IDS 可以在检测到攻击后修改环境以阻止攻击。许多\
  \ IDS 系统使用定义类似于病毒毒软件使用签名。基于网络的入侵检测系统（NIDS）提供整体网络保护。基于主机的入侵检测系统（HIDS）可以保护单个系统。\n\n\
  * **事件响应**——当公司做好准备并能够响应事件时，它更有可能减少影响。响应事件时的一个重要步骤是遏制，这确保事件不会扩散到其他系统。事件响应团队试图识别发生了什么。他们寻找导致事件发生的漏洞，然后寻求未来减少这些漏洞的方法。另一方面，有些公司希望尽快让事件成为过去。他们试图修复眼前的问题，而不去解决根本问题。必须解决根本问题，以减少相同问题再次发生事件的概率。\n\
  \n* **持续监控**——安全工作永远没有完工之日。持续监控是必要的。实施控制措施，然后对其进行检查和审计，以确保控制仍然有效。部署补丁，随后通过合规审计验证所有系统都已打补丁。通过访问控制，系统和数据被锁定。随后，对其进行检查以确保它们未被修改。大量的活动被记录在日志中，然后监控日志的趋势和可疑事件。幸运的是，有很多工具可以用于审计和监控网络内的系统。这些工具是*安全分析*的基础，安全分析是一种用于主动分析安全数据模式的方法，以便捕获并处理任何异常情况。\n\
  \n* **技术控制**——技术控制是利用技术减少漏洞的措施。IT 专业人员实施这些控制，并由计算机执行。例如，在 IT 专业人员安装杀毒软件后，该软件会防止感染。技术控制的其他示例还包括\
  \ IDS、访问控制和防火墙。随着新漏洞的发现，可以实施新的技术控制。\n\n* **物理控制**——物理控制是防止未经授权的人员访问区域或系统的措施。例如，服务器应位于服务器房内，并保持机房门锁。网络设备应放置在配线间内，并保持配线间门锁。物理安全还可以包括保镖、摄像头和其他监控设备。对于移动设备（如笔记本电脑），可以使用线锁或硬件锁。\n\
  \n### ![](img/Note.png)\n\nSymantec 的 Ghost 用于桌面、笔记本电脑和服务器的镜像。关于 Ghost 的更多信息请访问\
  \ `https://www.symantec.com/products/ghost-solutions-suite`。\n\n微软每月在补丁周二？\n\n利用程序\
  \ 是利用漏洞的行为。利用程序通过对 IT 系统执行命令或程序来利用弱点以达到目的。结果是系统、应用程序、数据或人员受到损害。利用程序也可以被视为由代码甚至人类执行的攻击。社会工程攻击利用了员工对威胁缺乏知识。\n\
  \n在代码背景下，利用程序主要攻击面向网络的服务器。换句话说，它攻击互联网上可用的服务器。常见的互联网服务器有：\n\n* Web 服务器\n* 简单邮件传输协议\
  \ (SMTP) 邮件服务器\n* 文件传输协议 (FTP) 服务器\n\n\n\n\n\nFIGURE 2-2 展示了这些面向用户的服务器通常如何在网络中配置的。它们被放置在两个防火墙之间，防火墙被配置为非军事化区\
  \ (DMZ)。DMZ 也称为`缓冲区区域`或`边界区域。连接到互联网的防火墙允许访问这些面向用户的服务器。连接到内部网络的防火墙则限制来自互联网的流量。\n\n\
  ![图 2-2 两个防火墙边界的 DMZ 中的面向用户的服务器。](img/9781284183719_CH02_FIGF02.png)\n\n**图 2-2**\
  \ 两个防火墙边界的 DMZ 中的面向用户的服务器。\n\n由于 DMZ 中的服务器是面向公众的，因此任何具有公共互联网协议（IP）地址的人都可以访问它们，这包括攻击者或黑客。\n\
  \n虽然内部服务器容易受到员工的攻击，但员工利用漏洞攻击内部服务器的情况并不常见。员工可以发动攻击并造成损害；然而对于他们来说，窃取数据或实施破坏活动要容易得多。内部人员通常不会花时间编写一个程序来攻击内部系统。内部人员拥有至少一些基本员工权限和内部知识的优势。通常，内部网络是被信任的，因此公司对内部网络上的漏洞关注较少。\n\
  \n缓冲区溢出 是一种常见的漏洞类型。当攻击者发送比系统或应用程序预期的更多或不同的数据时，就会发生这种情况。当系统或应用程序未准备好拒绝这些数据时，就会产生漏洞，这会导致系统运行不稳定。此外，如果漏洞的创建者特别\
  \ get，漏洞将运行额外的指令，从而让攻击者在系统上获得额外的权限。\n\n通常，系统会验证并拒绝非预期的数据。偶尔，由于漏洞允许无效数据被使用。\n\n例如，这里有一个简单的验证计算：`X\
  \ / Y = Z`。程序期望提供 `X` 和 `Y` 的值。然后它将两者相除以计算 `Z` 的值。然而，如果将零作为 `X` 或 `Y` 的值，则无法计算 `Z`。零不能被任何数字除尽。如果程序没有检查并确保\
  \ `X` 和 `Y` 是有效数字，那么当用户输入零时程序可能会崩溃。如果错误没有被妥善处理，攻击者可能会利用这一失败。\n\n缓冲区溢出错误允许攻击者插入额外数据，这些数据通常以要立即运行的意外命令的形式存在。该命令可以插入在网络中传播的蠕虫，或者导致服务器关闭且无法重启，也可能是寻找并销毁系统上数据的代码。\n\
  \n当供应商发现缓冲区溢出漏洞时，他们会修补代码以防止未来发生此类错误。此补丁应该被下载并应用以堵住漏洞。\n\n### ![](img/Note.png)注意\n\
  \n虽然除以零的错误很容易解释，但它在今天产生问题可能不大。大多数应用程序都会检测到问题并永远不会尝试除以零。然而，还有许多未被预测到的高级错误。\n\n###\
  \ Nimda 病毒\n\nNimda 病毒是一个较旧病毒的例子，它利用了微软互联网信息服务 (IIS) 中的缓冲区溢出问题。该病毒有助于解释 IT 风险管理中学到的许多教训。\n\
  \n首先，在安装 Windows 2000 Server 时会默认安装 IIS。因为 IIS 是默认安装的，它经常没有被管理，而未管理的服务更容易受到攻击。\n\
  \n当缓冲区溢出被发现时，微软发布了一个补丁，只要应用了该补丁就能修复问题。然而，当时补丁管理处于起步阶段。许多公司没有有效的补丁管理计划，并且没有一致地应用补丁。许多系统管理员错误地得出结论，因为他们没有使用\
  \ IIS，所以他们的系统不是脆弱的。然而，由于 IIS 是默认安装的，他们的系统实际上是有漏洞的。\n\nNimda 发布在互联网上，采用了多管齐下的方法。缓冲区溢出允许它利用\
  \ IIS 系统，它包含一个蠕虫组件，允许它寻找并感染内部网络上的其他系统，它在互联网上寻找易受相同缓冲区溢出影响的其他 IIS 服务器，并将网络活动减慢到爬行速度并破坏数据。\n\
  \nNimda 强化的两个基本安全实践措施是：\n\n*   **减少服务器的攻击面**——不应安装不需要的服务和协议。如果安装了，就应该将其移除。如果服务器上没有安装\
  \ IIS，它就不会受到 Nimda 的攻击。这种情况在本文稍后部分进行了解释。\n*   **保持系统更新**——如果 IIS 服务器已使用发布的补丁进行更新，它们就不会受到该攻击。\n\
  \n其他漏洞还包括：\n\n*   **SQL 注入攻击**——SQL 注入攻击 利用对用户提供的数据审查或检查不严。许多网站要求用户在文本框或网页地址中输入数据。如果用户提供的数据没有经过适当验证，这些数据可以直接被用\
  \ SQL 语句，这就是 SQL 注入攻击中发生的情况。通常，在提供预期数据之后，会添加一个 SQL 命令。这种注入攻击执行了一段不同的 SQL 代码。这段不同的代码可能会破坏数据库。通过使用先检查代码的参数和存储过程，很容易避免\
  \ SQL 注入攻击。\n*   **拒绝服务 (DoS) 攻击**——拒绝服务 (DoS) 攻击 旨在防止系统提供服务。例如，SYN 泛洪攻击](#29_glossary.xhtml#gloss180)\
  \ 是常见的。通常，传输控制协议 (TCP) 使用三次握手建立连接。主机发送一个带有 SYN 标志的数据包。服务器带有 SYN 和 ACK 标志进行响应。主机随后带有\
  \ ACK 标志以完成握手。在 SYN 泛洪攻击中，主机从未响应第三个数据包。这种场景可以比作主机和服务器出手握手，但主机收回了手，导致服务器的手悬在空中。当在短时间内重复此操作时，会消耗服务器资源并导致其崩溃。\n\
  *   **分布式拒绝服务 (DDoS) 攻击**——分布式拒绝服务 (DDoS) 攻击 从多个客户端同时发起。例如，许多犯罪分子和攻击者从控制中心运行僵尸网络。僵尸网络控制多个主机作为`克隆`或`僵尸`。这些克隆主机可以随时收到攻击命令，并且它们同时攻击。攻击可能只是简单地持续\
  \ ping 同一台服务器。如果有成千上万的客户端同时 ping 一台服务器，它就无法容易响应其他请求。\n\n### ![](img/Note.png)注意\n\
  \n结构化查询语言 (SQL) 是用于查询和修改数据库的语言。它必须遵循特定的规则。动态 SQL 是一种直接接受用户输入的 SQL 语句。例如，语句可能是 `SELECT\
  \ FROM Users Where LName = ‘txt.Name’`。在这个例子中，`txt.Name` 的值是从名为 `txt.Name` 的文本框中检索的并在程序运行时使用的。在进行输入过滤的情况下直接允许用户输入是不建议的。\n\
  \n#### 攻击者如何发起漏洞攻击？\n\n\n\n\n\n# 攻击概述\n\n大多数攻击都是由攻击者开发的程序发起的。攻击者创建并运行这些程序来针对漏洞计算机。\n\
  \n`Script kiddies`（脚本小子）是指那些对计算机知识匮乏或有限的攻击者，有时还是青少年。然而，他们可以从互联网下载脚本和小型程序，然后发动攻击。他们不需要精通计算机，甚至不需要了解自己行为可能造成的潜在伤害。有些程序非常简单，脚本小子只需输入一个\
  \ `IP` 地址并点击 `Go` 即可发起攻击。\n\n然而，大多数公司所担心的攻击者要比老练得多。他们拥有编程技能，知道如何针对特定的服务器，并了解渗透网络的方法。他们会删除证据以掩盖行迹。他们是职业攻击者。\n\
  \n想象一个拥有丰富计算机知识且对美国敌对的国家。例如，我们听说过来自俄罗斯的攻击，以及据报道它如何干预美国选举。一个敌对国家可以创建一个拥有不同部门的内部秘密机构。每个部门都可以被分配特定的工作或任务，这些部门可以在漏洞一旦出现时立即协作发动攻击。该部门可能包含以下部门：\n\
  \n*   **公共服务器发现**——互联网上的每个系统都有一个公共 `IP` 地址。该部门可以使用 `ping` 扫描器来识别具有公共 `IP` 地址的运行系统。`IP`\
  \ 地址是根据地理分配的，因此服务器也可以映射到地理位置。\n\n*   **服务器指纹识别**——该部门可以使用多种方法尽可能地获取有关已发现服务器的信息。可以使用\
  \ `ping` 来识别系统运行的是 `UNIX` 还是 `Microsoft` 操作系统。该部门可以使用 `port scans` 来识别哪些端口是开放的。根据开放的端口，它可以识别出运行的协议。例如，端口\
  \ `80` 是超文本传输协议 (`HTTP`) 的已知端口。因此，如果 `port 80` 是开放的，那么 `HTTP` 可能正在运行。如果 `HTTP` 正在运行，该服务器可能是一个\
  \ Web 服务器。该部门可以使用其他技术确定该服务器是 `Apache` 还是 `IIS` Web 服务器。\n\n*   **漏洞发现**——该部门的调查人员和黑客不断寻找新的缺陷。他们可以尝试新事物看看可以做什么，或者潜伏在新闻组中收听未为人知的新漏洞。他们可能会订阅专业期刊或阅读\
  \ IT 安全专家的博客，如果他们发现了漏洞，就可以将其传递给程序员或攻击者进行利用。\n\n*   **程序员**——在漏洞被发现后，程序员可以编写代码或应用程序来利用它们。几行代码被嵌入网页中，并在用户访问网站时被下载。可以发布病毒来利用该缺陷，或者在僵尸计算机上安装应用程序，等待\
  \ `botnet command` 发起攻击。这些程序员中有些人是黑黑客。\n\n*   **攻击者**——攻击者发起利用。例如，攻击者可能发现 `Apache`\
  \ 服务器的一个新漏洞。他们可能想针对华盛顿特区（Washington, DC）的服务器。他们可以从其他部门获取一份在 `DC` 运行 `Apache` 的服务器列表，然后对这些服务器发动攻击。这个小组可能会定期发动旧攻击，而目前的补丁会阻止这些攻击。大多数系统都会打上补丁，但如果小组成员发现未打补丁的系统，他们就可以利用。例如，他们对\
  \ `10,000` 台计算机发动攻击。即使他们的成功率只有 `1 percent`，他们也利用了 `100` 台计算机。\n\n这个敌对国家的秘密部门被认为是虚构的。然而，一个国家对另一个国家的网络攻击并非虚构。新闻经常报道网络攻击。`Operation\
  \ Aurora`（极光行动）和 `Operation Shady RAT`（在本章之前提到过）是近期的两个例子。如果有人想对敌对国家发动网络战，他们会如何做呢？他们可能会设计一个具有类似部门的类似机构。\n\
  \n即使是单个犯罪者发起的攻击，上述步骤也是分开的。攻击者会花时间通过侦察尽可能多地了解目标，甚至可能开发一个程序来自动化攻击。无论如何，实际攻击通常是快速的。\n\
  \n意识到攻击者经常将 `100 percent` 的工作时间花在攻击上是非常重要的。因为他们的攻击通常带来大量资金，他们并不害意每周工作超过 `40 hours`。他们花时间发现目标、识别弱并计划攻击。当机会出现时，他们就会冲出来攻击，就像猫头鹰攻击田鼠一样快。\n\
  \n### ![](img/Note.png)注意\n\n攻击者在发动攻击时经常使用转移性策略。他们不是从自己的电脑发起攻击，而是控制一台或多台计算机。然后他们从那台远程计算机引导攻击。\n\
  \n#### 犯罪者从哪里获取有关漏洞和利用的信息？\n\n犯罪者可以从许多惊人的来源中学习漏洞和利用。一个主要来源是安全专业人员分享信息。当然，当安全专业人员编写或讨论某项利用时，危险在于他们正在教育敌人。由于这种可能性，一些人认为不应该讨论这些缺陷。然而，当无口如言时，系统在\
  \ IT 专业人员毫无察觉的情况下受到攻击。\n\n目前的主流心态是，讨论漏洞应该侧重于缓解。换句话说，不建议公开分享如何利用漏洞的细节，但应该自由分享如何防止漏洞的细节。\n\
  \n即使分享防止漏洞的细节也会为攻击者提供信息。他们可以使用这些信息来了解缺陷并对其进行利用。然而，另一种选择更糟。如果不分享如何减少缺陷的信息，更多的系统将暴露。\n\
  \n以下列表列出了攻击者可以获取信息的某些来源：\n\n*   **博客**——许多安全专业人员经常记录他们的发现。当他们怀疑有漏洞时，通常会讨论。许多职业安全专业人员对发布的内容非常谨慎，因为他们意识到读者群体复杂，并尽量避免提供过多细节。\n\
  \n*   **论坛**——IT 和安全专业人员经常在各种论坛上分享想法。有时，用户遇到他们不理解的问题，就会在论坛上发布这些问题。其中一些问题会暴露可以被利用的漏洞。\n\
  \n*   **安全简报**——许多安全简报定期发送给邮件列表中的任何人，任何人都可以注册。虽然公司使用简报进行广告和推广产品，但简报也提供了价值内容。此类内容包括有关威胁和漏洞的信息。攻击者甚至可以使用美国政府发布的简报。本章稍后将讨论其中一些简报，包括如何订阅它们。\n\
  \n*   ***2600: The Hacker Quarterly***——该杂志可以在线上订阅，也可以在书店购买印刷版。该杂志经常包含可利用漏洞的代码和细节。\n\
  \n\n\n\n\n*   **常见漏洞与暴露 (CVE) 列表**——本章稍后将对 CVE 进行详细讨论。当有人发现漏洞时，可以将其提交给 MITRE 公司以收录此列表。关于该漏洞的条目将包含有关更多详情资源信息。\n\
  \n*   **逆向工程**——此前提到过“补丁周二”是微软发布补丁的日子，即每个月的第二个星期二。第二天被某些攻击者称为漏洞利用周三。他们经常对补丁进行逆向工程以发现漏洞。一旦理解了该弱点，就会编写漏洞利用程序来攻击该弱点。\n\
  \n*   **暗网**——暗网代表了只有使用特殊软件才能访问的万维网部分。专业黑客利用暗网共享漏洞和利用应用程序的方法。暗网网站的一些示例包括 The Hidden\
  \ Wiki、SojlentNews、ProPublica、DuckDuckGo 和 Galaxy3。如果网络安全知识较少的个人考虑访问这些网站，他们应该使用虚拟专用网络\
  \ (VPN) 连接。\n\n一种应该采用的良好哲学是：如果存在漏洞，坏人就知道它，而只需要一个知道漏洞的坏人就可以攻击不受保护的系统。所有系统都必须受到保护才能保持安全。\n\
  \n### ![](img/Note.png) 注意\n\n暗网通常被用于非法活动。深层网是指其他所有内容。暗网包含在典型搜索引擎（如 Google）中找不到的内容。它是通过匿名方式访问的，仅通过特殊的隐藏软件网络访问。\n\
  \n### 缓解技术\n\n缓解技术是保护易受攻击系统所需的各个步骤。这些步骤通常被称为服务器加固。加固服务器使其比默认安装更安全。\n\n为了保护面向公共服务器可以采取的一些特定缓解技术包括：\n\
  \n*   **删除或更改默认设置**——如果操作系统或应用程序具有默认设置，请确保在安装系统后立即删除或更改这些设置。例如，将默认密码更改为安全密码。通常，还会更改特权账户名称，例如\
  \ `Administrator` 账户。这样做可以阻挡猜测密码的尝试。\n\n*   **减少攻击面**——攻击面指的是服务器上可以被攻击的服务数量。例如，如果服务器上运行着\
  \ 10 个服务，但只需要 7 个，则可以通过禁用那 3 个不必要的服务来减少攻击面。为了减少整体攻击面并降低风险，应该移除所有不必要的的服务和协议。\n\n\
  *   **保持系统更新**——应该使用补丁管理系统来确保漏洞得到修补，并在补丁发布后尽快应用。每过去一个没有没有补丁的小，都会为攻击者提供更多时间来逆向工程补丁并开始攻击。合规性审计确保补丁能够一致地应用于所有系统。\n\
  \n*   **启用防火墙**——防火墙过滤进入网络的流量，而 DMZ 使用防火墙创建网络缓冲区区域。还可以在每台服务器上启用主机防火墙，作为额外的保护层。\n\
  \n*   **启用 IDS**——活跃的 `IDS` 可以检测攻击并采取措施阻止它们。\n\n*   **启用入侵防御系统**——入侵防御系统 (IPS) 串联在流量中。它检测并拦截恶意流量，以防止攻击到达内部网络。\n\
  \n*   **安装杀病毒软件**——在所有系统（包括服务器）连接网络之前，应安装杀病毒软件。许多服务器需要不同版本的杀病毒软件。例如，Microsoft Exchange\
  \ 邮件服务器需要特殊版本的杀病毒软件，以便检查邮件存储。\n\n#### 在 IT 基础设施中管理漏洞利用的最佳实践\n\n可以使用几种最佳实践来降低漏洞利用的风险。其中许多技术与基础风险管理实践直接相关：\n\
  \n*   **加固服务器**——上一节提到了加固服务器的方法。它们包括减少攻击面和保持系统更新等基本步骤。\n\n*   **使用配置管理**——系统应配置有一致的安全设置和安全基准，以确保系统的配置方式相同。安全基准可以来自使用\
  \ Symantec Ghost 等工具创建镜像。也可以通过技术（如 Microsoft 组策略）向所有系统应用设置来实现安全基准。应该执行合规性审计，以确保系统保持相同的配置。\n\
  \n*   **进行风险评估**——通过进行风险评估可以了解相关的威胁和漏洞。然后，可以识别并评估应对措施。\n\n*   **进行漏洞评估**——本章之前提到了漏洞评估。它们也可以作为管理漏洞利用的最佳实践。\n\
  \n*   **使用安全信息和事件管理 (SIEM) 工具**——SIEM 工具通过对在系统中收集的安全事件和活动数据，对来自系统的安全警报进行实时分析。\n\n\
  ## 美国联邦政府风险管理计划\n\n美国联邦政府已采取许多步骤帮助公司管理 IT 风险。本节涵盖的计划包括：\n\n*   国家标准与技术研究院 (NIST)\n\
  *   国土安全部 (DHS)\n*   国家网络安全和通信集成中心 (NCCIC)\n*   美国计算机应急响应小组 (US-CERT)\n*   MITRE\
  \ 公司和 CVE 列表\n\n图 2-3 显示了这些组织之间的关系。存在两条主要路径，分别属于美国商务部或国土安全部。\n\n\n\n\n特别出版物 800\
  \ (SP 800) 系列包含了多份记录了信息技术实验室（ITL）工作的报告。该系列涵盖了计算机安全领域的研究、指导和推广工作，旨在成为结合工业界、政府和学术组织成果的协作努力。SP\
  \ 800 系列中的许多出版物可以在互联网上获取。美国国家标准与技术研究院（NIST）修订了其中许多文档，因此数量可能无法反映当前版本的相对日期。\n\n###\
  \ ![](img/Note.png)注意\n\nITL 和 ITIL 是两个不同的计划。信息技术基础库（ITIL）由英国开发，由英国政府商业办公厅（OGC）管理。ITIL\
  \ 是一系列书籍，为 IT 的成功运行提供指导和最佳实践。由 NIST 管理的 ITL 是一个美国计划。\n\n以下列表包含了其中的部分出版物：\n\n*  \
