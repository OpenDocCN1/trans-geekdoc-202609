  \n\n\n\n*   **ITIL 服务过渡**——本书侧重于引入服务，并包括对服务的修改或更改。大多数公司已经通过教训了解到，如果不对变更进行管理，可能会导致系统崩溃。变更管理对许多公司来说变得越来越重要。\n\
  *   **ITIL 服务运营**——本书侧重于日常运营。\n*   **ITIL 持续服务改进**——本书侧重于用于改进服务的方法论。\n\n### ![](img/Note.png)注意\n\
  \nITIL 的缺点之一是书籍的价格。五本 ITIL 书籍的零售价格在 300 美元或以上。\n\n### 参考\n\nITIL 以服务为中心。服务是向客户交付价值的手段，即提供客户想要的东西。服务并不要求客户承担服务交付的成本和风险。例如，电子邮件是一种服务，大多数客户希望能够收发邮件。然而，大多数客户并不希望拥有和管理电子邮件服务器。在这种背景下，IT\
  \ 部门为员工提供电子邮件。员工是客户，IT 部门是服务提供者。\n\n`FIGURE 3-5` 显示了 ITIL 生命周期五个阶段之间的关系。在 IT 组织内部实施和管理的任何服务都会经过几个阶段，每个阶段都有其自身的关注点和要求。\n\
  \n![FIGURE 3-5 ITIL 生命周期。](img/9781284183719_CH03_FIGF05.png)\n\n`FIGURE 3-5` ITIL\
  \ 生命周期。\n\n以电子邮件作为提供的服务为例，某公司正在从外包电子邮件迁移到内部电子邮件服务器。该公司可以在 ITIL 生命周期中应用于实施的每个阶段：\n\
  \n*   **服务策略阶段**——评估服务以确定其对组织是否具有价值。由于沟通改善，电子邮件可以通过提高销售和生产力来提供价值。如果确定内部邮件将提供价值，则继续进入下一个阶段。\n\
  *   **服务设计阶段**——IT 为组织内部的使用设计服务。在此阶段，IT 将设计公司的电子邮件解决方案。例如，公司的 IT 网络可能是 Microsoft\
  \ Windows 域，因此 IT 将设计 Microsoft Exchange 解决方案。将确定需要添加多少服务器以及为了支持这些服务器对网络所需的任何更改。\n\
  *   **服务过渡阶段**——此阶段包括添加、修改和删除过时的服务。该阶段的首要目标是确保过渡不会导致中断。例如，添加 Microsoft Exchange\
  \ 电子邮件解决方案将包含多个元素。需要修改 Active Directory 架构，并可能需要添加全局目录服务器。需要构建 Microsoft Exchange\
  \ 服务器，并在用户的计算机上安装应用程序。从终端用户到维护新服务器的技术人员，所有人都需要接受培训。\n*   **服务运营阶段**——任何服务的日常运营和支持都在此阶段处理。对于电子邮件，这些服务可以包括定期维护和处理影响服务的事件。它们还包括执行备份和测试恢复。这里的目标是确保端用户在他们需要邮件时可以访问其邮件。\n\
  *   **持续服务改进阶段**——此阶段侧重于对服务和过程进行测量和监控。目标是确定可以改进服务的领域，这包括对电子邮件服务器进行定期监控和性能调优。可以使用分析在变成实际问题之前识别问题区域，并为可以改进的领域提供见解。\n\
  \n可以在 [`www.itlibrary.org`](https://www.itlibrary.org/) 获取 ITIL 资源。\n\n### ITIL\
  \ 认证\n\n越来越多的组织认可 ITIL 的价值，并要求 IT 人员学习并采用 ITIL 实践。就像人们希望由经过认证的医疗保健人员为他们治疗一样，许多组织也希望确保一定比例的\
  \ IT 员工获得 ITIL 认证。\n\nITIL 认证验证了不同级别的知识。第一级是 ITIL 基础认证（Foundation）。IT 管理员和经理通常追求这种知识。从那里开始，人员可以专注于\
  \ ITIL 的不同领域。最高水平是 ITIL 大师资格（Master）。\n\nZipRecruiter 在 2019 年进行了薪资调查。拥有 ITIL 认证的人员列在高薪范围内。拥有基础\
  \ ITIL 基础证书的人平均收入超过 88,000 美元，前 6% 的人员收入在 146,000 到 158,000 美元之间。应该注意的是，大多数拥有 ITIL\
  \ 认证也具备其他技能。\n\n### 能力成熟模型集成\n\n能力成熟模型集成 (CMMI) 是一种过程改进方法。它使用不同的级别来确定过程的成熟度。\n\n\
  CMMI 可用于三个领域：\n\n*   产品和服务的开发\n*   服务的建立、管理和交付\n*   产品和服务的采购\n\n`FIGURE 3-6`\n\n\
  `FIGURE 3-6` 显示了 CMMI 的六级，也被称为 CMMI 特性。这些级别可以确定组织内安全的有效性。以下列表列出了这些级别以及如何使用它们评估安全性。虽然这里列出了第\
  \ 0 级，有时会被省略：\n\n*   **第 0 级：不存在**——未建立安全控制。对安全需求没有认识。\n*   **第 1 级：初始**——有时此级被称为临时的（ad\
  \ hoc）或按需的。在威胁利用漏洞后考虑风险。\n*   **第 2 级：受管理**——组织认识风险和安全需求。然而，它们是根据直觉执行控制，而不是根据详细计划。响应是反应性的。\n\
  *   **第 3 级：定义**——组织建立了安全策略。它具有一定的安全意识，行动是主动的。\n*   **第 4 级：量化管理**——组织衡量并控制安全过程。它有正式的政策和标准，并定期进行风险和漏洞评估。\n\
  *   **第 5 级：优化**——组织在各处建立了正式的安全流程。它持续监控安全并侧于过程改进。这一级显示了最高程度的成熟度。\n\n#### 通用数据保护条例\n\
  \n\n\n\n\n`通用数据保护条例 (GDPR)`(#29_glossary.xhtml#gloss86) 是欧盟 (EU) 法律的一部分。该条例在 2018\
  \ 年取代了 `数据保护指令 95/46/ec`，成为监管公司如何保护欧盟公民个人数据的首要法律。它被设计成一个法律框架，为收集和处理居住在欧盟和欧洲经济区 (EEA)\
  \ 个人的个人信息制定准则。该条例适用于所有处理居住在欧盟或 EEA 地区个人个人数据的业务，无论这些公司位于何处。所有公司（包括此前已合规的公司）都必须遵守\
  \ 2018 年的 `GDPR` 指令，否则将面临严厉的惩罚和罚款。以下列出了 `GDPR` 下的一些关键变化以及它们与之前法规的差异之处：\n\n*   **扩大的领土管辖范围（域外适用性）**——`GDPR`\
  \ 适用于所有处理居住在欧盟或 EEA 地区个人个人数据的公司，无论公司位于何处。之前的指令并未明确这一点；相反，它指的是“在设立机构的背景下”的数据处理。\n\
  *   **惩罚**——违反 `GDPR` 的公司罚金最高可达年度全球营业额的 4% 或 2200 万美元，以较高者为准。此金额代表了公司可能承担的最高金额，例如，未获得处理数据的充分客户同意或违反了隐私原则。\n\
  *   **同意**——公司必须以易于理解且易于获取的形式提供同意，并说明附于该同意的数据处理目的。同意必须是清晰的，且与其他事项区分开来，并能够以给予时相同的方式轻松撤回。\n\
  *   **数据主体权利**——其数据被收集和处理的个人拥有多受以下原则约束的权利：\n\n    *   违规通知\n    *   访问权\n    * \
  \  被遗忘权\n    *   数据可移动性\n    *设计即隐私\n    *   数据保护官\n\n## 美国国防部信息保证认证与核准流程\n\n`美国国防部信息保证认证与核准流程\
  \ (DIACAP)`(#29_glossary.xhtml#gloss59) 是一种适用于美国国防部 (DoD) 使用的 IT 系统的风险管理过程。它在 `DoD\
  \ instruction 8510.1` 中有详细记录。\n\n`DIACAP` 详细说明了 IT 系统必须经过的特定阶段。核心目标是确保系统符合要求。这些阶段包括：\n\
  \n*   **第一阶段：启动与计划**——在 `DIACAP` 注册系统。分配信息保证 (`IA`) 控制。创建 `DIACAP` 团队。制定 `DIACAP`\
  \ 策略。启动 `IA` 计划。\n*   **第二阶段：实施与验证**——实施 `IA` 计划。如有需要更新 `IA` 计划。执行验证活动以验证系统的合规性。记录验证结果。\n\
  *   **第三阶段：做出认证与核准决策**——分析剩余风险。审查文档以验证认证。然后决定是否核准该系统。一旦系统获得核准，它将获得运行授权 (`ATO`)。\n\
  *   **第四阶段：维护 ATO/审查**——维护系统。目标是确保其符合 `ATO` 的要求。定期对系统进行合规审查。\n*   **第五阶段：退役**——注销系统。处理\
  \ `DIACAP` 数据。\n\n### ![](img/Note.png) 注意\n\n`DIACAP` 在 2007 年取代了 `DITSCAP`。`DITSCAP`\
