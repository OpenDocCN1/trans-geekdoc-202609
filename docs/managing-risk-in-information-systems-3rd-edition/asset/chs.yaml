  \n`BCP` 可能会识别具有其他职责的人员。这些人员会因组织而异。他们可能包括：\n\n- **关键供应商**（Critical vendors）——如果需要从关键供应商获取特定的供应或其他资源，`BCP`\
  \ 将明确其职责。关键供应商可以是特定部件的唯一来源供应商。\n\n*(注：由于原文后半部分存在大量重复乱码字符，以上翻译已根据可识别语义进行了修复处理。)*\n\
  \n\n\n相比之下，地震不会发出任何通知。相反，它会突然降临。而且，在重大地震发生后，预计会有多次余震。\n\n考虑到这一点，针对地震的 `BCP` 将具有完全不同的通知和激活阶段。`BCP`\
  \ 甚至可以被编写成：要求人员在地震发生时即使没有收到正式通知也必须采取特定行动。例如，响应团队成员可以立即向其负责人汇报以获取指示。\n\n`BCP 协调员`\
  \ 仍会激活 `BCP`，以确保每个人都收到通知。然而，如果发生地震，该地区的任何人来说，发生的情况都是显而易见的。\n\n### 通知程序\n\n通知程序可能因组织而异。然而，最重要的步骤是确保\
  \ `BCP 协调员` 收到 `BCP` 涵盖的任何中断或灾害。如果在工作时间内发生中断或灾害，`BCP 协调员` 可能很快到达现场。如果发生在下班后，应该找到并联系\
  \ `BCP 协调员`。\n\n使用某种类型的电话树来通知团队和成员是常见的。例如，`BCP 协调员` 可以通知 `EMT`、`DAT` 和 `TRT` 的团队负责人。团队负责人随后可以通知其团队的所有成员。\n\
  \n### ![](img/Tip.png)提示\n\n在这种情况下，为 `BCP 协调员` 配备手机是合理的支出。`BCP 协调员` 应该在白天或夜晚的任何时候都能联系，以应对重大中断或灾害。\n\
  \n### 损害评估程序\n\n`DAT` 负责评估损害并报告给 `BCP 协调员`。该团队的首要目标是尽快确定损害范围。\n\n再次，`DAT` 开始行动的时间取决于中断的情况。如果是飓风，成员将在风暴袭击时评估建筑内部的损害。例如，他们将在由于风暴损坏导致的内部淹水和漏水发生时对其进行评估。当风暴过去、人们可以安全地外出时，`DAT`\
  \ 将评估外部损害。如果中断是即时灾害（例如地震），`DAT` 将在成员到达现场时立即行动。\n\n数据将传递给 `EMT` 团队负责人和 `BCP 协调员`。他们共同工作，根据所有报告确定损害范围。\n\
  \n`EMT` 团队负责人将对该做什么做出决定。如果关键业务可以在现场继续运行，`TRT` 将开始恢复工作。如果损害严重且关键业务无法在原地点继续，业务可能需要转移到备选地点。\n\
  \n### 计划激活\n\n`BCP 协调员` 负责激活 `BCP`，但是根据预定义的标准执行。换句话说，`BCP 协调员` 不仅仅根据直觉做决定。\n\n例如，以下项目是激活\
  \ `BCP` 的有效理由：\n\n*   人员安全\n*   影响 `CBFs` 的建筑损坏\n*   影响一个或多个 `CBFs` 的业务中断\n*   `BCP`\
  \ 中确定的特定标准，例如飓风预警或地震\n\n计划激活时的特定职责包括：\n\n*   `BCP 协调员`——`BCP 协调员`在激活计划后的主要职责是确保每个人都意识到计划已激活，包括所有参与该计划的人员。`BCP\
