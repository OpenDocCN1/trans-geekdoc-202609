  \    4. 残差风险\n\n11. 定性风险评估使用什么来确定风险优先级？\n    1. 概率和影响\n    2. SLE、ARO 和 ALE\n  \
  \  3. 安全价值\n    4. 成本效益分析\n\n12. 定量风险评估使用什么来确定风险优先级？\n    1. 概率和影响\n    2. SLE、ARO\
  \ 和 ALE\n    3. 安全价值\n    4. 成本效益分析\n\n13. 一家组织购买了一种控制措施并将其安装在几台服务器上。该控制措施消耗了过多的服务器资源，导致服务器无法运行。在购买该控制措施之前没有评估什么？\n\
  \n\n\n\n\n1. 实现控制的成本和时间\n2. 控制对业务的影响\n3. 现有的控制和计划中的控制\n4. 风险的影响\n\n14. 风险评估中包含哪些有助于证明控制成本合理的因素？\n\
  1. 概率和影响\n2. `ALE`\n3. `CBA`\n4. `POAM`\n\n15. 通过风险评估创建了什么内容以跟踪控制的实施情况？\n1. `CBA`\n\
  2. `POAM`\n3. `ALE`\n4. `SLE`\n\n## 章节总结\n\n风险评估的执行包含几个特定的步骤。第一步是对待评估的系统进行明确的定义。只要可能，应该考虑管理结构，以确保建议易于实施。\n\
  \n接下来，识别威胁和漏洞。相关的威胁/漏洞对可以识别出实际风险。然后，评估缓解这些风险的控制。这些建议连同 `CBA` 提交给管理层进行决策。最后，使用 `POAM`\
  \ 来跟踪已批准的建议。\n\n## 核心概念与术语\n\n- `asset valuation`（资产价值）\n- `audit trail`（审计跟踪）\n\
  - `blacklist`（黑名单）\n- `change management`（变更管理）\n- `configuration management`（配置管理）\n\
  - `control`（控制）\n- `countermeasure`（应对措施）\n- `exploit assessment`（利用评估）\n- `Group\
  \ Policy`（组策略）\n- `host-based intrusion detection system (HIDS)`（基于主机的入侵检测系统）\n\
