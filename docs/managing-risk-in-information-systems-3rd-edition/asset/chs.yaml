  \ Rev. 1，开展风险评估\n*   SP 800-12，信息安全导论\n\n### ![](img/Note.png)注意\n\n特别出版物的的完整列表可以通过\
  \ `https://csrc.nist.gov/publications` 获取。\n\n#### 国土安全部\n\n美国国土安全部 (DHS) 是为了应对\
  \ 2001 年 9 月 11 日的恐怖攻击而成立的。DHS 包括许多机构：\n\n*   美国秘密调查局\n*   美国海岸卫队\n*   美国移民海关执法局\n\
  *   联邦应急管理局\n\n#### 网络安全与通信中心\n\n国家网络安全与通信中心 (NCCIC) 运行于 DHS 内部。它与公共和私人合作保障网络安全。美国计算机准备小组\
  \ (US-CERT) (`https://csrc.nist.gov/publications/`) 是 DHS 的一部分。US-CERT 负责响应网络攻击。其主要任务是为以下对象提供支持：\n\
  \n*   州政府\n*   国际合作伙伴\n*   其他联邦机构\n\n### ![](img/Note.png)注意\n\n*网络*泛指任何计算机资产，通常指互联网上的资产。互联网上的全球网络通常被称为*网络空间*。*网络战争*（网络战）是指国家或公司发起的攻击和反击。\n\
  \nUS-CERT 收集的信息通过国家意识系统与公众共享。该系统包括网站、邮件列表和简单信息订阅（RSS）频道。\n\n用户可以通过此链接接收 US-CERT\
  \ 的电子邮件和警报：`http://www.us-cert.gov/mailing-lists-and-feeds/`。用户还可以订阅以下源：\n\n*  \
  \ **警报**：这些警报包含当前安全问题、漏洞和利用的及时信息，根据需要发布。它们面向系统管理员和经验丰富的用户。之前的警报请访问 `http://www.us-cert.gov/ncas/alerts`。\n\
  *   **简报**：这些简报提供了上周安全问题和漏洞的每周摘要。它们面向系统管理员和经验丰富的用户。之前的简报请访问 `http://www.us-cert.gov/ncas/bulletins`。\n\
  *   **动态**：这些电子邮件提供高影响类型安全活动的信息。根据当前威胁，可能会每天发送多次或每周发送几次。之前的更新请访问 `http://www.us-cert.gov/ncas/current-activity/`。\n\
  *   **提示**：这些提示针对家庭、企业和新用户。每两周发布一次，提供许多安全主题的信息。之前的安全提示请访问 `http://www.us-cert.gov/ncas/tips`。\n\
  \n### MITRE 公司与 CVE 列表\n\n\n\n\nMITRE 公司管理着四个联邦资助的研究与开发中心（FFRDCs）。这些 FFRDCs 为美国政府的几个主要部门开展研究工作。\n\
  \nMITRE 公司维护着 `CVE` 列表。MITRE 是该列表的编辑者并负责分配编号。`DHS` 是 `CVE` 的赞助商。\n\n`CVE` 是一份详尽的已知漏洞和暴露列表。随着新发现的出现，它们会被作为候选项目提交到列表中。该列表的主要优势是标准化的命名和描述。\n\
  \n在 `CVE` 出现之前，一家公司可能会用 `Exploit234a` 来描述一个问题。同一个问题可能被另一家公司描述为 `X42A`。两家公司都可能发布过关于同一个问题的论文，但要判断两个问题是否不同是非常困难的。\n\
  \n`CVE` 为任何单一漏洞或暴露提供一个名称。其格式为 `CVE-yyyy-nnnnnn`，其中 `yyyy` 是漏洞添加到列表的年份，`nnnnnn` 是该年份的唯一数字。从\
  \ 2014 年 1 月 1 日起，数字扩展到了六位。以前只允许四位，将漏洞数量限制在 9,999 个 `CVE` ID。通过六位数字，MITRE 可以分配多达\
  \ 99,999 个 `CVE` ID。条目包括漏洞的简短描述以及一个或多个用户可以访问以获取更多信息的参考文献。以下示例了 2018 年的一个 `CVE` 条目：\n\
  \n* **Name**—`CVE-2018-1999046`\n* **Description**—`Jenkins` `2.137` 及之前的版本、`2.121.2`\
  \ 及之前的 `Computer.java` 中存在敏感信息暴露漏洞，该漏洞允许具有全局/读取权限的攻击者访问任何代理的连接日志。\n* **References**—URL:\
  \ [`www.cvedetails.com/cve/CVE-2018-1999046/`](https://www.cvedetails.com/cve/CVE-2018-1999046/)\n\
  \n### 注意事项\n\nMITRE 是一个缩写，但其首字母并没有特殊含义。许多原始员工来自麻省理工学院（`MIT`）。这些员工从事研究与工程（`RE`）。然而，MITRE\
  \ 并不是 `MIT` 的一部分。\n\n`NIST` 在国家漏洞数据库（`NVD`）中使用 `CVE` 名称和描述。`NVD` 包含了与 `CVE` 相同的信息，但增加了影响和严重性评分。[`cve.mitre.org/cve/`](http://cve.mitre.org/cve/)\
  \ 页面包含了在 MITRE 的 `CVE` 列表或 NIST 的 `NVD` 列表中搜索条目的链接。\n\n`CVE` 被认为是信息安全漏洞名称的标准。MITRE\
  \ 于 1999 年启动了 `CVE`，并迅速获得了认可。一些相关的里程碑包括：\n\n* **2000 年**——超过 40 种产品被声明与 `CVE` 兼容。`CVE`\
  \ 被 29 个组织使用。\n* **2001 年**——超过 300 种产品和服务被声明兼容。`CVE` 被 150 多家公司使用。\n* **2002 年**——`NIST`\
  \ 建议美国机构使用 `CVE`。发布了 `NIST 800-51`《常见漏洞与暴露 (CVE) 漏洞命名方案的使用》。`SP 800-51` 在 2011 年进行了更新并重命名。目前的名称为《漏洞命名方案指南》。\n\
  * **2003 年**——启动了 `CVE` 兼容性流程。该流程允许产品和服务获得官方兼容状态。\n* **2004 年**——美国国防信息系统局（`DISA`）要求使用带有\
  \ `CVE` 标识的产品。\n* **2007 年**——`NVD` 对基于 `CVE` 的数据库进行了多项升级。这些升级提高了可用性并改进了评分系统。此后许多其他实体也采用了\
  \ `NVD`，这增加了 `CVE` 作为标准的使用率。\n* **2008 年**——`CVE` 对多个跨站脚本（`XSS`）漏洞提供了重大更新。2008 年\
  \ 12 月 29 日 [SCMagazine.com](http://SCMagazine.com) 上的一篇为“微软否认 Windows Media 播放器存在漏洞”的文章中提到了\
  \ `CVE`。\n* **2009 年**——数据库更新以包含多个媒体和搜索引擎的重大安全漏洞。`CVE` 庆祝成立 10 周年，编录了超过 38,000 个漏洞。\n\
  * **2010 年**——`CVE` 扩大了范围和认可度。2010 年 6 月份的《Hacking》杂志中一篇题为“安全网络 IP 电话 (`VoIP`)”的文章中提到了\
  \ `CVE`。\n* **2011 年**——DHS 网站上 2011 年 12 月 12 日发布的《安全网络未来蓝图：国土安全企业的网络安全战略》提到了 `CVE`。\n\
  * **2012 年**——`CVE` 获得新的认可。`CVE`、常见弱点枚举（CWE）以及 `CWE/SANS` 前 25 个最危险漏洞出现在 2012 年\
  \ 3/4 月份的《CrossTalk：软件工程期刊》中一篇题为“供应链风险管理”的文章中。\n* **2013 年**——`CVE` 格式进行了修订。MITRE\
  \ 发布了常见漏洞报告框架（`CVRF`）。\n* **2014 年**——`CVE` 公知漏洞字典。\n* **2015 年**——`CVE` 影响 `Apple`\
  \ 和 `Linux` 操作系统的公已知漏洞字典。\n* **2016 年**——2015 年 9 月份国际电信联盟（`ITU`）的一份题为“电信与信息技术安全”的技术报告中提到了\
  \ `CVE`。\n* **2017 年**——`CVE` 头条包含了较小的 `HttpOnly` 标记，如 `EternalBlue`。\n* **2018\
  \ 年**——`CVE` 达到 100,000 条条目。\n* **2019 年**——`CVE` 已运行 20 年。\n\n### 总结\n\n威胁始终存在且无法消除。威胁造成的危害或威胁产生的影响可以减少，但无法消除威胁本身。然而，可以采取许多措施来减少漏洞。\n\
  \n美国联邦政府提供了许多组织可以使用的资源。美国国立标准与技术研究院（`NIST`）发布了多份特别出版。`SP 800` 系列包含了许多针对 IT 安全的出版物。国土安全部有许多关注\
  \ IT 安全的部门。其资源对 IT 专业人员免费。\n\n## 核心概念与术语\n\n* `攻击面`\n* `缓冲区溢出`\n* `配置管理`\n* `持续监控`\n\
