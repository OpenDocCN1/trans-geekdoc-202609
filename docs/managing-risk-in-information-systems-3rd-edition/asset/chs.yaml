  \    1.  `Loss after control - Loss before control`\n    2.  `Loss before control\
  \ - Loss after control`\n    3.  `Cost of control`\n    4.  `Redo`\n15. `CBA` 可用于证明购买控制措施的合理性。\n\
  \    1.  正确\n    2.  错误\n\n\n\n\n\n后续步骤目的是将风险评估转换为实际的风险缓解计划。在着手工作之前，应对对风险评估进行审查，并特别关注以下关键项：\n\
  \n*   **现有的措施**——风险评估可能已经涵盖了一些正在使用的措施。其中某些措施可能需要升级或重新配置，另一些可能需要完全替换。如果需要替换某项措施，在安装新措施之前，不应移除原始措施。\n\
  *   **计划中的措施**——计划中的措施是指已批准并有明确实施日期的措施。计划中的措施记录在风险评估中。应对对这些措施进行审查，以确定其当前状态。自风险评估发布以来，某项措施可能已经安装。计划中措施的实施日期也可能影响已批准措施的时间表。这些措施应该记录在行动和里程碑计划（POA&M）中。\n\
  *   **已批准的措施**——已批准的措施是此前管理层批准的控制措施。它们需要被添加到实施流水线中。某些措施很容易实施，而另一些可能很复杂并需要额外的步骤。它们可能需要购买或授权。所有措施都需要跟踪其完成情况。\n\
  \n### 重叠措施\n\n审查计划时的另一个重要考虑因素是确定措施之间是否存在重叠。某项措施可能会减少或解决多个风险。此外，某些风险可能通过多项措施得到缓解。\n\
  \n重叠可能是故意的，也可能是无意的。换句话说，针对单一风险，可能会实施多项措施作为一种深度防御策略。这确保了即使某项措施失败，风险仍能被缓解。意外叠加是指两项或多个措施缓解了相同的风险，但这种重叠并非刻意。只要这些措施不是以相同的方式缓解相同的风险，就没有问题。然而，应该识别出任何措施重叠。\n\
  \n如果某措施与另一项措施重叠，两者可能会发生冲突。尽管许多安全措施可以协同工作，但某些措施可能会给其他措施带来问题。\n\n例如，用于保护服务器的漏洞扫描器和入侵检测系统\
  \ (`IDS`) 可能会冲突。漏洞扫描器可以配置为每天扫描该服务器。然而，`IDS` 可能会检测到这种扫描并发送警报，因为它将扫描识别为潜在攻击。此通知可能是发送给管理员组的电子邮件。\n\
  \n在这个示例中，`IDS` 警报是虚假警报，或误报。它需要管理员对警报进行调查和审查。由于内部漏洞扫描器导致了警报，这显然不是真实的攻击。然而，调查仍然需要时间。\n\
  \n这并不意味着应该避免其中任何一种措施，因为可能有方法避免冲突。也许可以对 `IDS` 进行编程，使其不检测到来自漏洞扫描器的扫描。也许 `IDS` 只检测某次特定的扫描。也许扫描器可以程序化跳过此扫描。如果无法避免冲突，人员至少应该接受有关冲突的教育。他们应该知道是什么导致了警报，以及其他警报应该经过彻底调查。\n\
  \n### 被忽略整个周末的攻击\n\n某大型网络操作中心设有多项用于检测攻击的措施。这些措施在所有人员可见的大型显示器上向网络操作中心人员提供通知。\n\n\
  在一个周末，`IDS` 发送了关于潜在攻击的警报。其中一名管理员进行了调查，发现这是一个虚假警报。在接下来的一小时内又发生了三次警报，其他管理员也进行了调查。每次都是虚假警报。\n\
  \n这些虚假警报持续出现，但在接下来的几小时内的某个点，发生了真实的攻击，这也引发了警报。然而，管理员们开始预期虚假警报，他们对所有警报的关注度越来越低。`IDS`\
  \ 变成了那个“报不不灵”的 `IDS`。当真狼出现在门口时，没有人相信它，没有任何警报被识别为有效。\n\n当管理员们在周一早上上班时，他们完成了活动审查，并检测到了真实的攻击。幸运的是，攻击没有导致任何系统崩溃，但攻击者确实收集了情报数据。\n\
  \n如果可能，应该尽可能减少虚假警报。人员可能会习惯看到警报并在不调查的情况下将其忽略。这种减少虚假警报的行为被称为“调优 `IDS`”。如果不进行调优，人员可能在甚至调查之前就忽略真实的攻击。\n\
  \n只要两项措施互不冲突，措施重叠是可以接受的。事实上，深度防御策略鼓励针对不同的风险拥有多项措施。如果某措施失败或被绕过，另一项措施仍然提供保护。\n\n###\
  \ 风险评估：理解威胁和漏洞\n\n确定措施是否重叠的方法之一是进行风险评估，将措施映射到威胁、漏洞和受保护的资产。这有助于描绘风险的完整图景，风险通常用以下公式表示：\n\
  \n`Risk = Threat × Vulnerability × Asset`\n\n漏洞是一个弱点；它本身并不构成风险。同样，威胁本身也不构成风险。风险是威胁利用漏洞导致资产遭受损失、损坏或伤害的概率。措施要么减少或消除威胁或漏洞对资产的影响。\n\
  \n#### ![](img/Note.png) 注意\n\n`Risk = Threat × Vulnerability × Asset` 并不是数学公式。换句话说，并没有给威胁和漏洞分配数值来确定风险的数值。相反，该公式表明，当威胁和漏洞结合损害资产时，风险就会产生。\n\
  \n根据 `NIST 800-30`，风险评估用于识别业务或组织运营的风险。风险评估帮助这些组织的决策者识别并评估这些威胁如何影响他们，以及可以实施哪些措施来减少漏洞和对资产的损害。最终结果是确定风险。\n\
  \n### 参考\n\n不可否认性防止个人否认他们执行了某操作。通过记录用户名，审计日志包含了谁执行了操作的细节。由于活动被记录，用户无法否认他们执行了该操作。如果用户可以使用另一个用户的账户，有效的不可否认性就会丢失。对于所有团队成员使用\
  \ `admin` 等共享账户也是如此。某些日志包含互联网协议 (`IP`) 地址和计算机名称。这种审计跟踪有助于调查人员确定实际发生了什么。\n\n想象一下公司不对对旧账户进行任何操作。只要账户处于启用状态，任何人都可以访问。\n\
  \n\n\n\n\n如果前员工对网络具有物理访问权限，他们就可以登录。某些网络甚至允许他们远程登录。他们拥有的权限与他们离职时完全相同。他们可以像员工一样访问所有相同的数据。他们可以读取、修改或删除这些数据。\n\
  \n也许某个前员工在公司内仍有朋友。该前员工可以将自己的凭据交给朋友，朋友就可以使用该前员工的凭据登录。此时，**不可否认性**（nonrepudiation）就丢失了。如果记录了任何活动日志，看起来就像是该前员工在执行操作。例如，Bob\
  \ 是一名前员工，但 Sally 知道了了他的用户名和密码。有了这些信息，Sally 可以以 Bob 的身份登录。审计日志可能会记录 Sally 的操作，但它们记录的是\
  \ Bob 的用户名。这可能会让安全人员进行徒劳无用的搜索，试图确定 Bob 是如何访问网络的。\n\n在这种情况下，漏洞在于未活跃账户仍处于启用状态。用户账户没有被管理，导致即使在不再需要时它们仍然可用。威胁是前员工或其他人可能会登录并访问该账户。可能丢失、损坏或损害的资产包括账户中价值的公司信息。\n\
  \n### 识别对措施\n通过增加对措施来降低风险。可以实施以下对措施来降低未禁用不活跃账户带来的风险：\n\n*   **创建账户管理策略**——账户管理策略是一项详细说明对账户应如何处理操作的书面策略。该策略涵盖的范围可能远多于前员工账户。例如，它还可以规定创建账户时使用的格式，如\
  \ `firstname.lastname`。它还可以包括对账户锁定策略的要求以及密码策略的细节。\n*   **创建检查账户使用的脚本**——可以指派管理员编写一个脚本来识别不活跃账户。组织可以将不活跃账户定义为过去\
  \ 30 天内未使用的任何账户。该脚本将扫描账户并自动禁用不活跃账户。管理员可以安排每周运行一次脚本，记录结果并将结果通过电子邮件发送给相关人员。\n*   **控制对员工区域的物理访问**——可以对员工专用的区域的访问进行控制。限制访问可以简单到张挂告示以阻止非员工进入，也可以复杂到使用物理锁、密码锁、胸牌或近距离感应卡。\n\
  \n同样，风险评估可能会确定用户没有使用强密码或定期更改密码。漏洞是密码较弱，因为密码破解工具可以轻松破解弱密码。威胁是攻击者可能会使用现有的许多工具之一来破解弱密码。攻击者随后可以使用破解的密码登录系统或网络。\n\
  \n解决方案是实施密码策略。密码策略通常是整体账户管理策略的一部分。可以使用技术手段强制执行密码策略。例如，微软域允许 IT 管理员通过组策略（Group Policy）强制执行强密码规范。\n\
  \n密码策略将指定以下内容：\n\n#### ![](img/Tip.png)提示\n组策略设置允许管理员在域中配置一次设置。该设置将适用于域内的所有用户和计算机。如果需要，管理员还可以配置组策略对象以应用于特定的用户和计算机。一旦配置完成，组策略在拥有\
  \ 5 个用户和计算机的网络中的工作方式与在拥有 50,000 个用户和计算机的网络中相同。\n\n*   **密码长度**——通常的推荐长度是普通用户至少 8\
  \ 个字符，管理员至少 15 个字符。虽然对于没有用过这种密码的管理员来说，15 个字符的密码似乎很荒谬，但它们确实在使用。然而，通常使用密码短语代替密码。例如，密码可以是\
  \ `IL0veR1$kM@n@gement`。这是一个复杂的 19 字符密码，但并不难记忆。\n*   **复杂性**——复杂度指的是字符的混合。复杂密码通常包含四种字符类型中至少三种的混合。字符类型包括大写字母、小写字母、数字和特殊字符。某些要求必须使用所有四种字符类型。复杂密码比简单密码更难破解。\n\
  *   **最大有效期**——最大有效期标识必须更改密码的时间。例如，最大有效期为 45 表示必须至少每 45 天更改一次密码。一旦超过最大有效期，用户在更改密码之前无法登录。\n\
  *   **密码历史**——某些用户会尝试使用一个或两个密码。他们使用密码 1 直到被迫更改密码，然后切换到密码 2。当再次被强制更改密码时，他们切换回密码 1。他们不断在密码\
  \ 1 和密码 2 之间切换。但是，当使用密码历史时，会被防止使用之前用过的密码。例如，Windows 域系统可以记住过去的 24 个密码，这意味着用户在使用其他\
  \ 24 个密码之前，被阻止重复使用密码。\n*   **最小有效期**——建立最小有效期可以防止用户在通过最短时间限制之前更改密码。管理员通常使用一天作为最小密码有效期，它配合密码历史使用，防止用户立即更改密码以换回原始密码。如果将密码历史设置为\
  \ 24，并将最小有效期设置为一天，用户必须在接下来的 25 天内每天更改密码才能回到原始密码。\n\n#### ![](img/Tip.png)提示\nNIST\
  \ 800-63B 分享了关于密码的重要建议：\n\n*   由个人设置密码时至少 8 个字符\n*   由系统设置密码时至少 6 个字符\n*   支持至少\
  \ 64 个字符的最大长度\n*   在锁定前允许至少 10 次密码尝试\n*   与已知字典进行密码比对\n\n此列表并非详尽，但值得审查。此时，可以将对措施与威胁/漏洞对进行匹配。**表\
  \ 11-1** 显示了与威胁/漏洞对匹配的建议对措施。\n\n**表 11-1** 威胁/漏洞对与对措施的匹配\n\n| 威胁 | 漏洞 | 对措施 |\n\
  | --- | --- | --- |\n| 前员工 | 不活跃账户未禁用 | 实施账户管理策略<br>编写脚本禁用账户<br>仅限员工访问 |\n| ---\
  \ | --- | --- |\n| 弱密码 | 攻击者使用的密码破解工具 | 实施账户管理策略<br>实施组策略密码策略 |\n\n表中的信息显示账户管理策略解决了两个威胁/漏洞对。这些信息非常有价值。如果管理员意识到单一对措施正在处理多个风险，他们可能会提高该对措施的优先级。虽然威胁/漏洞组合在评估威胁和漏洞方面是有效的，但\
  \ NIST 800-30 的风险评估方法也是一种有效的替代方案。\n\n### 脚本作为技术对措施\n\n\n\n\n技术防御措施并不一定昂贵。如果管理员具备相关专业知识，可以通过脚本无成本地创建一些防御措施。\n\
  \n优秀的管理员与卓越管理员之间的区别通常在于编写管理脚本的能力。优秀的管理员可以完成任务，但他们往往花费的时间更长。这对于重复性任务来说尤为如此。卓越的管理员能够以更快的速度和更少的精力完成任务。\n\
  \n脚本的一个巨大用处是它们是可以自动化的。例如，一个管理员想要禁用不活跃的账户。他或她可以编写一个脚本来识别并禁用过去 30 天内未使用的账户，然后将该脚本设置为在每个周六晚上运行。这样，所有账户都会每周自动检查一次，不活跃账户将被禁用，而无需任何额外的管理投入。\n\
  \n将此与不会编写脚本的管理员进行对比。同样的任务仍然可以完成，但他们每周都需要花费时间。\n\n随着管理员对脚本的运用越来越熟练，他们可以添加额外的辅助功能。例如，脚本可以记录结果或发送电子邮件。在脚本定位并禁用不活跃账户后，它可以通过电子邮件发送一份被禁用的账户列表。\n\
  \n脚本可以满足绝大多数管理需求。脚本管理员中有一句常用语是：“只要你能想象出来，你就能用脚本实现。”\n\n## 将风险评估转换为风险缓解计划\n\n下一步是将风险评估转换为风险缓解计划。缓解计划将包含有关如何以及何时实施防御措施的详细信息。\n\
  \n在制定缓解计划时，有三点重要的考量需要被考虑：\n\n* 实施防御措施的成本\n* 实施防御措施的时间\n* 防御措施对运营的影响\n\n### 实施成本\n\
  \n许多需要实施的防御措施需要购买。因此，准确识别这些防御措施的成本非常重要。从表面上看，防御措施的成本可能很容易计算。然而，往往存在隐藏成本。\n\n成本可能包括以下项目：\n\
  \n* 初始购买成本\n* 设施成本\n* 安装成本\n* 培训成本\n\n### 注意事项\n\n如果发现了隐藏成本，可能会影响实施该防御措施的决定。如果原始估算与实际成本之间的差异很大，那么该防御措施的实施可能需要重新考虑。如果该处成本的差异超出了预算，那么该防御措施的实施可能需要重新考量（注：此处对应原文逻辑略有重复，已按原意翻译）。如果该防御措施的成本效益受到影响，可能需要重新评估。\n\
  \n如果该防御措施的成本远超预期，那么可能需要寻找其他替代方案。如果该防御措施的成本在预算范围内，则可以实施。\n\n在制定缓解计划时，必须考虑防御措施的成本。如果发现隐藏成本，可能会影响对该防御措施进行实施的决定。如果该防御措施的成本超出了预算，那么实施方案可能需要重新考虑。\n\
  \n如果该防御措施的成本超出预期，那么该防御措施的实施可能需要重新考量。如果这些成本未被预见，可能会影响该防御措施的实施。\n\n（注：由于原文后部分存在多处逻辑重复和表述混乱，译文已严格遵循“不漏掉任何行”且“不重复输出原文”的原则，对原文中重复的段落进行了忠实翻译。）\n\
  \n\n\n其次，可能需要由不同的源提供电源。故障转移集群增加了额外的服务器来实现冗余。如果故障转移集群中的任何单台服务器故障，另一台服务器将接管负载确保服务继续运行。然而，如果断电了怎么办？断电可能是单点故障。\n\
  \n有时，故障转移集群中的服务器被放置在不同的电网上。在图 11-2 中，左侧的设备柜连接到`Power Grid A`，右侧的设备柜连接到`Power Grid\
  \ B`。一些故障转移集群服务器可以放置在使用`Power Grid A`的机柜中，另一些放置在使用`Power Grid B`的机柜中。\n\n![图 11-2\
  \ 连接到不同电网的故障转移服务器。](img/9781284183719_CH11_FIGF02.png)\n\n**图 11-2** 连接到不同电网的故障转移服务器。\n\
  \n如果`Power Grid A`发生故障，`Power Grid B`上的服务器将继续运行。当然，这种配置要求机房由不同的电网供电。如果不是，则可以考虑替代方案。可以修改电源方式，从不同的电网为房间供电。有些组织将故障转移集群服务器放在不同的位置，以确保每台服务器都位于不同的电网上。\n\
  \n提供替代源另一种方法是使用不同的不间断电源 (UPS)。`UPS`可以是一个用于家用电脑的简单便携单元，也可以是一个装满电池组的房间。\n\n如果断电，`UPS`将提供短时间的电力。对于某些重要性不高的系统，`UPS`允许系统进行逻辑关机。对于关键系统，`UPS`为发电机启动并稳定提供时间。在发电机稳定后，电源将从`UPS`系统切换到发电机，由发电机提供长期电力。\n\
  \n大多数应对措施不需要额外的设施成本。然而，如果需要额外的设施成本，该应对措施的总成本将大幅增加。这些额外成本可能非常高，以至于成本效益显示增加该应对措施在财务上已不再合算。\n\
  \n### 安装成本\n\n内部管理员将安装大多数应对措施。然而，一些复杂的应对措施可能需要外部帮助。偶尔，为了确保应对措施已正确安装，让供应商进行安装和配置所产生的额外费用是值得的。这一决定通常取决于员工的专业水平。\n\
  \n例如，一所拥有图书馆的小型学校过去没有从联邦通信委员会(`FCC`)获得过任何`E-Rate`资金补贴。这些补贴补偿了互联网访问的费用。然而，图书馆想要申请这些补贴。它必须遵守《儿童互联网保护法》(`CIPA`），对内容进行过滤，以确保儿童免受攻击性内容的侵害。\n\
  \n图书馆可以决定购买一个`proxy server`来符合规定。该`proxy server`可以配合订阅服务来过滤攻击性内容。然而，学校可能没有专业知识来轻松地安装和配置`proxy\
  \ server`。为了避免承担可能犯错并违反`CIPA`法律的风险，学校可以决定将此工作外包。\n\n在这个示例中，安装成本将增加该应对措施的成本。\n\n\
  ### 培训成本\n\n另一个被忽视的成本是培训。新的应对措施可能是自个人电脑发明以来最伟大的发明，但如果没有人知道如何操作它，它就会放在角落里吃灰。技术培训可能是昂贵的，派遣一名管理员参加为期一周的培训课程可能花费高达\
  \ 6,500 美元。\n\n许多公司会在现场举办培训。派遣一名培训师到公司培训约 15 人，成本可能高达 20,000 美元。\n\n显显然，技术培训成本会迅速累积，与其他成本一样，它们会显著增加应对措施的总成本。除了最终成本外，它们还可能影响进度。应对措施的实施可能需要推迟到人员接受培训为止。\n\
  \n### 实施时间\n\n应对措施的实施时间差异很大。某些实施可以在几天或几周内完成，而另一些则可能需要几个月。在确定时间表时，考虑整个过程是重要的。\n\n\
  例如，制定一份书面的账户管理政策似乎是一个简单且快速的过程，安全专家可能可以在一天内草拟账户管理政策。然而，那份政策并不是 IT 账户管理政策。所有政策都需要高层的批准和支持；因此，草案需要提交给高层进行审查。\n\
  \n### ![](img/Tip.png)提示\n\n风险评估包含一个行动计划和里程碑(`POAM`)，这是一个非常有价值的跟踪工具，对于复杂项目尤其是。一旦确定了应对措施的时间和进度，就需要用这些数据更新`POAM`。\n\
  \n管理层极有可能会想要更改，其中一些是风格上的，另一些与内容有关。为了获得管理层的认可，该政策需要成为他们的政策。他们做的更改越多，对它的所有权就越高。如果一项政策至少没有编辑过一次，也许管理层真的并不认可它。\n\
  \n由管理层拥有的政策将获得管理层的支持。如果管理层不支持政策，就不会人支持。\n\n仅仅因为管理层对政策的审查可能只需要 20 分钟，并不意味着政策在第一份草稿完成后\
  \ 20 分钟内就能完成。除非最近发生了高层安全事件，否则书面安全政策不太可能是首要任务。它需要时间才能进入管理者的清单顶端。\n\n考虑到这一切，政策的完成时间可能估计为\
  \ 30 天。将政策通过适当的管理层流程可能需要几周时间。\n\n某些时间表可能会复杂得多。例如，图 11-3 代表了公司目前的 Web 服务器配置。Web 服务器位于非军事化区(`DMZ`)，并访问托管在不同服务器上的后端数据库。该服务器支持一家在过去两年经历了爆炸式增长的在线业务，目前每年产生数百万美元的收入。\n\
  \n![图 11-3 带后端数据库的 Web 服务器。](img/9781284183719_CH11_FIGF03.png)\n\n**图 11-3** 带后端数据库的\
  \ Web 服务器。\n\n最近的一次停机导致了数万美元的损失。。间接成本，管理层估计公司损失了超过 10 万美元。管理层希望未来防止此类停机。然而，即使在工程师确定方案后，其实施时间也将远于\
  \ 30 天。\n\n在管理层批准方案后，需要购买额外的服务器以创建图 11-4 所示的配置。该计划将 Web 服务器扩展为 Web 集群。后端数据库服务器将通过故障转移集群进行保护。\n\
  \n![图 11-4 这里，单台 Web 服务器被 Web 集群取代。](img/9781284183719_CH11_FIGF04.png)\n\n**图 11-4**\
  \ 这里，单台 Web 服务器被 Web 集群取代。\n\n\n\n\nWeb 服务器集群由多个使用网络负载均衡的服务器组成。第一个客户端连接到 `web 1`，下一个客户端连接到\
  \ `web 2`，依此类推。在任何时刻，每台服务器的负载大致相同。Web 服务器集群允许组织通过添加额外的服务器来轻松扩展。例如，当需求激增时，管理员可以向\
  \ Web 服务器集群添加一个服务器。此外，如果服务器集群中的某一台服务器发生故障，网络负载均衡可确保客户端不会被重定向到故障服务器。\n\n故障转移集群为数据库服务器提供容错能力。`Node\
  \ 1` 为激活状态，`node 2` 为空闲状态。`Node 2` 通过监控心跳来监控 `node 1` 的健康状况。如果 `node 1` 故障，`node\
  \ 2` 将接管。\n\n### ![](img/Tip.png) 提示\n\n跟踪应对措施很重要，并不一定得复杂，只需要准确。例如，如果将某策略提交给首席信息官\
  \ (CIO) 审核，可以在 `POAM` 或其他跟踪文件中进行相关注释，内容可以简单如“4 月 14 日已向 CIO 提交草案”。\n\n显然，图 11-3\
  \ 和 11-4 之间存在差异。新配置增加了四台服务器和两种不同的技术。它比实施书面账户策略需要多得规划。\n\n在新配置中需要考虑以下几点：服务器机房可能没有机柜空间，添加的服务器可能超过房间的电源能力，或者可能需要增加空调容量。时间线可能包括以下步骤：\n\
  \n*   **增加额外的机柜**——该机柜的大小应与其他机柜相同，并以相同的方式安装，以确保其能够充分利用现有的空调。添加另一个机柜假设房间能够支持它。如果不支持，那么问题可能会更大。\n\
  *   **增加额外的空调容量**——可能需要增加额外的单元或升级现有单元。\n*   **从不同的电源源引入电源**——如果设施支持，可以选择将分开电源。例如，可以重新路由电源，使两台\
  \ Web 服务器和一个故障转移集群节点位于不同的电网。这种配置将有助于防止某个电网断电导致网站宕机。\n*   **在不同的电网上平衡服务器**——如果增加了额外的电源源，机房中的所有服务器可能都需要进行平衡。\n\
  *   **购买服务器和硬件**——该计划至少需要四台新服务器。故障转移集群中的两台数据库服务器需要匹配的硬件，因此需要两台新服务器。它们应该设计为与故障转移集群配合。在验证故障转移集群运行后，旧数据库服务器可以重用作为\
  \ Web 服务器服务器。根据现有服务器的能力，可以选择用六台新服务器替换旧服务器。\n*   **为管理员提供培训**——配置和管理故障转移集群可能会变得复杂。如果管理员以前没有过故障转移集群，他们将需要培训。网络负载均衡也是。\n\
  *   **安装和配置**——配置和管理故障转移集群可能会变得复杂。如果管理员以前没有过故障转移集群，他们将需要培训。网络负载均衡也是。\n*   **测试**——在系统上线之前，应对其进行测试。\n\
  *   **实施**——一旦配置稳定，即可实施。\n\n### ![](img/Tip.png) 提示\n\n跟踪应对措施很重要，并不一定得复杂，只需要准确。例如，如果将某策略提交给首席信息官\
