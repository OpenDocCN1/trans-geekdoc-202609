  \ (US-CERT)]\n- [版本控制]\n\n## 第 2 章评估\n\n1. 什么是安全策略？\n    1. 一份创建了一套严格规则的文件，目的是让人们明确遵守这些规则以确保有效性并避免技术问题\n\
  \    2. 用于执行安全的安全控制措施\n    3. 用于执行安全的物理控制措施\n    4. 一份由高级管理人员创建的文档，确定了安全在组织中的作用，并作为保护组织资产的防御机制\n\
  \n2. 应该使用什么来确保用户仅被授予执行其工作所需的权限？\n    1. 最小权限原则\n    2. 知情性原则\n    3. 权利限制原则\n  \
  \  4. 职责分离\n\n3. 应该使用什么来确保缓解风险的支出（如购买保险）与风险成正比？\n    1. 最小权限原则\n    2. 比例原则\n  \
  \  3. 权利限制原则\n    4. 权限限制原则\n\n4. 以下哪种安全原则通过划分工作职责来减少欺诈？\n    1. 知情性\n    2. 最小权限\n\
  \    3. 职责分离\n    4. 强制休假\n\n5. 可以什么什么确保系统不会发生未经授权的更改？\n    1. 输入验证\n    2. 补丁管理\n\
  \    3. 版本控制\n    4. 配置管理\n\n6. 入侵检测系统工哪两种类型？\n    1. 故意和无意\n    2. 自然和人为\n    3.\
  \ 基于主机的和基于网络的\n    4. 技术和物理\n\n7. 技术控制可以防止未经授权的人员物理访问安全区域或安全系统。\n    1. 正确\n   \
