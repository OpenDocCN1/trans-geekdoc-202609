  \nISO 27002 是一组用于安全管理的准则和原则。当前版本是 ISO 27002:2013。该版本源自英国标准 (BS) 7799，这是一份备受尊敬的标准。\n\
  \n该文档的 ISO 多年年来发生了变化。以下列表显示了这些变化的历史：\n\n* `ISO/IEC 17799:2000`——该文档的 ISO 版本\n* `ISO/IEC\
  \ 17799:2005`——对 `ISO/IEC 17799:2000` 的更新\n* `ISO/IEC 17799:2005/Cor 1:2007`——一份修正文档\n\
