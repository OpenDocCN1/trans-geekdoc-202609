  \n© Sai Chan/Shutterstock\n\n# 通过业务连续性计划降低风险\n\n## 第 13 章\n\n业务连续性计划（BCPs）是风险管理中的重要要素。它们帮助组织为重大中断或灾难制定计划，并确保关键业务功能（CBFs）继续运行。业务影响分析（BIA）通过识别\
  \ `CBFs` 为 `BCP` 奠定基础。随后，`BCP` 协调员制定支持这些 `CBFs` 的 `BCP`。`BCP` 协调员接受来自一个或多个 `BCP`\
  \ 团队及团队长的协助。\n\n如果发生中断，活动将在不同阶段进行。第一阶段是由 `BCP` 协调员发布的通知/激活阶段。第二阶段是恢复阶段，`CBFs` 在恢复并恢复全面运行。最后一个阶段是重建阶段，组织恢复正常运营。为了使\
  \ `BCP` 成功，需要对人员进行培训，并对 `BCP` 进行测试和演练。此外，还需要定期审查 `BCP` 并保持更新。\n\n### 第 13 章主题\n\
  本章涵盖了以下主题和概念：\n* 什么是业务连续性计划（`BCP`）\n* `BCP` 的要素有哪些\n* `BCP` 如何降低组织的风险\n* 实施 `BCP`\
  \ 的最佳实践是什么\n\n### 第 13 章目标\n完成本章后，你将能够：\n* 定义什么是 `BCP`\n* 识别 `BCP` 的要素\n* 描述 `BCP`\
  \ 的目的以及 `BCP` 经常包含的章节\n* 识别与 `BCP` 相关的人员的关键职责\n* 描述 `BCP` 通知和激活阶段的程序\n* 描述 `BCP`\
  \ 恢复阶段的程序\n* 描述 `BCP` 重建阶段的程序\n* 识别用于 `BCP` 的不同类型的测试和演练\n* 识别用于维护 `BCP` 的不同步骤\n\
  * 描述 `BCP` 如何降低组织的风险\n* 列出从风险评估制定风险缓解计划的最佳实践\n\n## 什么是业务连续性计划？\n业务连续性计划（`BCP`）是一种旨在帮助组织在中断期间及之后继续运行的计划。这种中断可以是蓄意的攻击，也可以是自然灾害。其目标是业务运营的持续。\n\
  \nBCPs 可以应对任何类型的中断或灾难。在美国南部海岸附近运营的组织为飓风制定计划，内陆地区“龙卷风带”中心的企业为龙卷风制定计划，加利福尼亚人为地震制定计划，而每个人都会为火灾制定计划。\n\
  \n中断也可能来自攻击或故障。关键服务器宕机可能是由攻击者通过互联网、恶意软件感染或硬件或软件故障引起的。如果该服务器是 `CBF`，则 `BCP` 需要确保已制定相关计划，以便尽快恢复运行。\n\
  \n`BCP` 的范围包含了对组织、信息技术（IT）系统、设施和人员的全局视图，这并不意味着组织的所有要素在中断期间都必须继续运行。相反，这意味着 `BCP`\
  \ 会检查所有要素，然后识别出对任务至关重要且需要继续运行的要素。不需要继续运行的非任务关键要素不在 `BCP` 的考虑范围之内。\n\n### 提示\n（此处原文为\
  \ TIP）\n`BCP` 的范围可以局限于组织的某些部分。例如，它可能只包含特定的地点或特定的 `CBFs`。然而，`BCP` 关注的是整体业务功能，而不仅仅是单个\
  \ IT 系统。\n\n`mission-critical`（任务关键）系统是指那些被识别为对组织功能维持至关重要的系统。`mission critical`\
  \ 一词也适用于功能或流程。\n\n业务影响分析（`BIA`）作为 `BCP` 的一部分包含其中。`BIA` 有几个直接支持 `BCP` 的目标目标包括：\n\
  * **识别关键业务功能 (CBFs)**——`CBF` 是任何被认为对组织至关重要的功能。如果 `CBF` 失败，组织将失去执行任务关键操作的能力。\n* **识别支持\
  \ CBFs 的关键流程**——关键流程是为了支持 `CBFs` 所采取的步骤或行动。\n* **识别支持 CBFs 的关键 IT 服务，包括任何依赖关系**——这些服务包括支持关键流程所需的服务器和其他硬件。许多服务都具有依赖性。例如，应用程序服务器可能需要数据库服务器才能保持运行。\n\
  * **确定 CBFs、流程和 IT 服务的可接受停机时间**——`BIA` 将这种停机时间定义为最大可接受中断（`MAO`）。在考虑 `BCP` 时，还应确定一年中不同时间是否有不同的\
  \ `MAOs`。例如，数据库服务器在年底处理期间可能是关键的，但在其他时间则不关键。\n\n所有这些目标在 `BCP` 中汇合，以使组织的优先级保持一致。`BIA`\
  \ 识别任务关键的系统、应用程序和操作，而 `BCP` 则提供了确保它们即使在灾难发生时也能继续运行的计划。\n\n同样，`BCP` 包含了灾难恢复计划（`DRPs`），它们帮助组织在灾难后恢复\
  \ IT 服务。任何组织都可以使用符合其需求的程序创建 `BCP`。然而，`BCP` 的总体步骤是：\n* 授权 `BCP` 并创建 `BCP` 范围声明\n\
  * 完成 `BIA`\n* 识别应对措施和控制措施\n* 开发各个 `DRPs`\n* 提供培训\n* 测试和演练\n* 维护更新计划\n\n## BCP 的要素\n\
  BCPs 是大型且全面的文档。它们包含许多要素，并涵盖许多突发情况。单一格式无法涵盖所有组织。然而，某些建议包含某些要素。\n\n### 业务连续性与灾难恢复\n\
  `business continuity`（业务连续性，`BC`）和 `disaster recovery`（灾难恢复，`DR`）术语并非同义，而是两个独立但相关的过程，尽管有些人会混淆并交替使用。BC\
  \ 涵盖业务的所有功能，以确保在发生中断时能够运行，并包含了 `BIA` 和 `DRP`。DR 在很大程度上是 IT 的功能，包含了从灾难中恢复所需的要素，如备份、恢复和还原。DR\
  \ 也可以更广泛，包括备用站点等要素。然而，`DRP` 是更大 `BCP` 的一部分。\n\n例如，一家银行位于受飓风威胁的海岸。客户使用银行网站进行网上银行。如果飓风袭击，银行希望确保网站继续可用。因此，BCP\
  \ 可以包含一个 DRP，其中包括在其他地点恢复网站所需的步骤。\n\n天气服务会在特定的时间段提供预警，例如在预计飓风将在 72 小时内登陆时发布警告。`BCP`\
  \ 可以规定 72 小时、48 小时和 24 小时的特定步骤，而 `DRP` 将提供有关将网站迁移到备选地点的细节。\n\n`BCP` 可能处理飓风的其他非技术要素。例如，银行何时关门？何时锁金库？保安人员是否应该留在室内？是否需要其他安全预防措施？\n\
  \n在灾难过后，`BCP` 和 `DRP` 将有不同的目标，但它们将共同工作。再次，`BCP` 关注于让整体业务功能恢复正常，而 `DRP` 关注恢复和重建 IT\
  \ 功能。\n\n\n\n\n\n例如，以下章节通常包含在业务连续性计划（BCP）中：\n\n- 目的\n- 范围\n- 假设与规划原则\n- 系统描述与架构\n\
  - 职责\n- 通知与激活阶段\n- 恢复阶段\n- 重建阶段\n- 计划测试与演练\n- 计划维护\n\n以下章节描述了这些部分的具体内容。\n\n### 目的\n\
  \nBCP 的目的是确保组织的关键要素在发生中断后仍继续运行，中断可以是任何可能导致运营停止的事件。当中断发生或即将发生时，便会实施 BCP。随后，BCP 将一直有效直到正常运营恢复。\n\
  \n在中断期间，仅维护 `CBFs`（关键业务功能），这意味着在灾难期间不会照常进行业务。`BIA`（业务影响分析）会识别 `CBFs` 及其优先级，而 `BCP`\
  \ 则确保所有要素已就绪以维护这些 `CBFs`。\n\n`BIA` 还包括可接受的停机时间。某些 `CBFs` 可能需要保持最小停机时间以运行，而其他 `CBFs`\
  \ 的优先级较低。根据 `BIA` 中确定的恢复时间目标，这些低优先级的 `CBFs` 可能会中断数小时甚至几天。\n\n### 范围\n\n与任何项目一样，`BCP`\
  \ 的范围需要被定义，因为项目的成功取决于人员对任务的理解。如果没有范围声明可能会可能会两个问题。首先，预期的任务无法完成，这意味着 `BCP` 是不完整的。其次，可能会发生范围蔓延。范围蔓延发生在项目不断承担额外任务时。例如，预想的范围可能涵盖单个地点，但实际上\
  \ `BCP` 却包含了对五个地点的研究和建议。\n\n范围声明可以包含几个关键条目，如地点、系统、员工和供应商。应仅包含 `BIA` 中识别出的关键系统。支持关键系统的必要员工应包含在内，并按头衔或职位进行标识，而不是姓名。如果部件或用品只能从特定来源获得，则该供应商应包含在\
  \ `BCP` 中。\n\n尽管 `BCP` 将从全球视角看待组织，但它不必覆盖整个组织。`BCP` 可以仅涵盖特定的地点。例如，一家公司在亚特兰大有主办公室，在芝加哥、洛杉矶和迈阿密有区域办公室。\n\
  \n它可以为每个地点创建四个独立的 `BCPs`。\n\n单个部门或分支可能面临较小的威胁，需要从业务连续性的角度进行处理，但通常情况下，这些部门使用应急计划或冗余措施。这些较小的威胁通常不会通过单独的\
  \ `BCPs` 来解决。\n\n### 假设与规划原则\n\n每个 `BCP` 都需要一些基本假设和规划原则，这些原则对 `BCP` 的初始开发非常有帮助，在实施阶段也有用。\n\
  \n一个关键的规划原则是公司预计在 `BCP` 下持续运营直到恢复正常运营的时间。例如，一家公司可以计划在飓风发生后根据 `BCP` 继续运营七天。那么，七天就成为许多其他要素的指导原则，例如七天的物资、七天的发燃料或人员七天的食物和水。\n\
  \n![TIP](img/Tip.png)\n\n这些假设和原则将驱动大部分决策过程，因此它们需要是准确的。例如，如果公司假设永远不会停电，它就不会为备用电源制定计划。然而，如果中断确实导致了停电，计划的其他部分将毫无用处。\n\
  \n假设和原则可以在几个不同的类别中进行审查和评估，包括计划中要处理的事件，以及策略、优先级和所需支持等要素。以下章节为这些领域提供了指导。\n\n### 要包含和排除的事件\n\
  \n许多 `BCPs` 会识别要包含和排除的特定事件。例如，`BCP` 可能设计用于应对由于飓风或地震引起的特定中断，或应对通用事件，如由于任何原因导致的停电。\n\
  \n例如，一个组织位于飓风易发地区。在飓风袭击之前，它会有几个小时甚至几天的提前通知。飓风的安全预防措施和准备步骤是广为人知的，例如固定任何可能被吹走的物品，并为风害以及某些地区的洪水做好准备。\n\
  \n现在，将该组织与位于地震易发地区的组织对比。该组织不会接收到任何地震即将发生的通知。前一刻一切都很平静，下一秒建筑就开始倒塌。取决于地震的严重程度，损害范围从极小到毁灭性破坏不等。\n\
  \n对这些每个事件的响应非常不同。因此，了解 `BCP` 将用于响应哪些事件，将更好地了解应该包含哪些步骤。\n\n另一方面，某些事件是通用的。例如，`BCP`\
  \ 可以包括在停电时为组织提供备用发电机电的计划，无论电力如何丢失都可以使用该计划。还可能包括如果某个地点不可用，则搬到另一个地点的计划。同样，地点不可用的原因并不重要。可能是火灾、洪水、龙卷风、地震或其他原因。\n\
  \n### 策略\n\n`BCP` 的策略识别了计划的一些关键要素，可能包括地点、通知和交通。\n\n如果一个组织位于单一地点，策略将是处理这个地点；而如果组织位于多个地点，则需要为每个地点识别一种策略。例如，一个组织可能决定关键的\
  \ IT 资源将集中位于并维护，例如在一所拥有遍布广阔校区的内的许多建筑的大型大学里。与其在每栋建筑中维持运营，不如 `BCP` 可以识别出在 във或多个中心建筑中维护的特定资源。\n\
  \n如果发生了或即将发生事件，将需要通知 `BCP` 团队成员。因此，识别如何通知所有关键参与者是重要的。其中一种方法是使用电话树。通过电话树，一个人通过拨打几位关键人员（如团队负责人）开始该过程。然后，团队负责人拨打他们名单上的人员，依此类推，直到最终每个人都收到通知。\n\
  \n交通可能是一个考虑的问题。如果成员需要从一个区域到另一个区域的交通，`BCP` 应处理这个问题。例如，可以指定公司车辆根据需要运送人员。或者，如果需要移动设备，则应在\
  \ `BCP` 中确定如何进行。\n\n如果持续运营需要物资，那么它们是一个重要的考虑因素。例如，如果公司需要物资继续生产产品，则这些物资必须可用。需要水、电、气等公用事业。如果策略是根据\
  \ `BCP` 计划继续运营七天，公司将需要提供七天的公用事业。\n\n通信是另一个问题，因为典型的通信在中断期间经常中断。陆地电话可能无法工作，在某些情况下，手机也将无法工作。许多组织使用对讲机功能手机，它们既可以作为手机使用，也可以作为对讲机。即使在紧急情况下手机功能停止工作，对讲机功能仍然有效。\n\
  \n\n\n\n按键讲机手机的优点是它们对讲机功能不需要外部资源，因为它们只需在某个频率上进行广播。只要另一部手机在覆盖范围内，就能接收到信息。一种方法是购买此类按键讲机手机，并在计划的第一阶段将其分发给关键人员。\n\
  \n## 优先级\n\n`BIA` 识别了关键业务功能（CBFs）以及关键资源及其优先级。通常，`BCP` 会重新确认这些优先级，并确保工作集中在优先恢复最高优先的系统。这些最高优先系统将拥有大部分资源用于恢复它们。\n\
  \n## 所需的支持\n\n`BCP` 在每个阶段都需要支持，最重要的是管理层的支持。如果没有这种支持，来自人员的所需的投入和支持以及所需的资金将无法到位。因此，如果没有高层管理者的支持，`BCP`\
  \ 注定会失败。\n\n在本章的后后部分，将列出个人和团队的职责。显然，这些团队必须为 `BCP` 提供支持，并在其努力过程中获得支持。\n\n在通知和激活阶段，所有人员都需要尽快做出响应。某些人员可能被识别为任务关键人员，他们他们在紧急情况下需要留在现场。\n\
  \n### ![](img/Tip.png)提示\n\n准备持续生产所需的物资可能与其他组织的原则产生冲突。例如，许多组织使用“准时制”理念，即零件和物资在需要时到达。始终为\
  \ `BCP` 储备七天的物资会将资金占用在库存中。此外，某些物资需要进行轮换，以确保它们不会过期或过时。\n\n### 系统描述与架构\n\n`BCP` 识别了在中断期间需要保持运行的关键业务功能（CBFs）。每个\
  \ CBF 都有支持其的独立系统。因此，拥有这些系统的当前描述和文档是重要的。这些文档需要足够详细，以识别出关键系统和支持架构。如果文档可用或已过期，维护和恢复\
  \ CBF 将变得困难得多。\n\n在为 `BCP` 编写 CBF 系统文档时，可以识别出恢复计划中需要解决的元素。例如，文档可能显示系统必须通过广域网（`WAN`）链路保持连接以维持运行。如果计划不包含备选，该\
  \ WAN 链路将成为单点故障。例如，图 13-1 显示了一个 WAN 链路连接总部办公室的数据库服务器和远程位置。如果 WAN 链路故障，CBF 就会故障。因此，WAN\
  \ 链路必须保持运行以支持 CBF。\n\n![图 13-1 通过 WAN 链路连接的数据库服务器。](img/9781284183719_CH13_FIGF01.png)\n\
  \n**图 13-1** 通过 WAN 链路连接的数据库服务器。\n\n图 13-2 显示了相同的两台服务器，具有备用通信方法。服务器在大多数时间内通过 WAN\
  \ 链路通信。如果链路故障，服务器将通过调制解调器通信。尽管调制解调器链路明显慢于 WAN 链路，但在中断期间仍然可以满足组织的需求。\n\n![图 13-2\
  \ 具有主、备用连接方式的数据库服务器。](img/9781284183719_CH13_FIGF02.png)\n\n**图 13-2** 具有主、备用连接方式的数据库服务器。\n\
  \n后续章节识别了需要包含在 `BCP` 中的一些常见文档。\n\n### ![](img/Tip.png)提示\n\n确保采取措施为员工家庭提供保障，如果员工在中断期间需要留在现场时尤其如此。员工在紧急情况下绝不应该在照顾家庭或照顾组织之间做出选择。在本书编写期间，世界大部分地区正经历着大病（`COVID-19`），大多数服务业已关闭，包括学校和办公室。个人和家庭被困在家里，许多人在照顾亲人的同时远程工作。\n\
  \n## 概述\n\n概述部分从宏观角度提供了关键业务功能（CBF）的描述。例如，以下是对位于组织总部关键数据库的描述。总部在数据库服务器上托管销售数据库，该数据库对几个业务功能至关重要：\n\
  \n*   总部的管理人员使用此数据库识别并跟踪全公司的销售情况。\n*   订单和生产人员使用此数据库订购并跟踪发往商店的产品。\n*   数据库跟踪每家商店的库存。任何商店的员工都可以查询数据库以确定某物品是在本地有货还是在其他商店。\n\
  \n每家商店都有本地数据库服务器，用于托管该商店的数据库并记录商店销售额，商店数据库每小时与总部数据库服务器同步一次。这些信息没有提供细节，但提供了足够理解大观情况的信息。\n\
  \n## 功能描述\n\n功能描述通过提供系统的更多细节建立在概述的基础上。\n\n### ![](img/Note.png)备注\n\n在此示例中，托管在总部的数据库服务器是至关重要的。如所述，没有迹象表明商店数据库服务器是关键的，这意味着商店数据库服务器可能会故障而不影响总部数据库。然而，在另一家公司，每家商店位置的数据库服务器可能是关键的。在这种情况下，所有它们都可以包含在同一个\
  \ `BCP` 中，或者为每家商店创建一个 `BCP`。\n\n许多系统与其他关键系统相互作用，因此尽可能包含图表是有有价值的。例如，图 13-3 显示了概述中描述的数据库图，展示了每个外商店如何通过\
  \ WAN 链路连接到总部。\n\n![图 13-3 商店与总部连接的数据库服务器。](img/9781284183719_CH13_FIGF03.png)\n\
  \n**图 13-3** 商店与总部连接的数据库服务器。\n\n描述将提供更多细节。例如，它将包括商店名称、商店位置以及 WAN 链路的细节，如果存在冗余 WAN\
  \ 链路，它将描述它们。\n\n总部服务器的细节也很重要。此描述应包括服务器名称、操作系统和使用的数据库应用程序。例如，服务器可以运行 `Windows Server\
  \ 2019` 和 `SQL Server 2019`。\n\n如果服务器包含任何容错能力，将在这里提到。例如，数据库服务器可能处于故障转移集群中，并包含冗余磁盘阵列（`RAID`）系统。双节点故障转移集群允许一个服务器故障而不影响数据库提供的服务。有了\
  \ `RAID`，即使驱动器故障系统也将继续运行。\n\n## 数据敏感性与操作关键性\n\n`BCP` 包含了系统数据敏感性的信息以及系统操作关键性的细节。\n\
  \n任何组织都会有一些秘密或专利数据。组织必须对这些数据进行分类，因为分类决定了数据所需的保护级别。某些数据可能被分类为私并仅供组织内部使用，而其他数据可能是公开的并可免费获取的。\n\
  \n\n\n\n如果系统存储了数据，则必须根据其分类级别对数据进行保护。基于这一原则，`BCP` 需要记录数据的敏感性。在紧急情况下，并不是每个人都会将预防措施放在首要位置。然而，如果由于\
  \ `BCP` 中记录了敏感性，人们就会知道该采取哪些预防措施。例如，数据库可能会收集客户信息，包括信用卡数据和销售数据。如果数据库服务器发生迁移，则需要采取措施保护传输过程中的数据以及原始位置和备用位置的数据。总部服务器上托管了这些数据，是因为这些数据包含了客户信息和销售金额，而大多数组织都试图保持这些信息的机密。\n\
  \n业务关键性确定了服务失败后的影响。关键性通常记录在 `BIA` 中以确保清晰。例如，该陈述可以用于上一个示例中提到的总部服务器：如果数据库服务器故障，分支机构将无法从数据库查询产品。由于现有产品可用，新产品的订购将将会延迟。\n\
  \n## 识别关键设备、软件、文档和供应品\n\n出于以下原因，`BCP` 应列出该系统中所有关键组件：\n1. 第一，`BCP` 明确说明了 CBF 需要哪些组件。\n\
  2. 第二，它提供了一个可以从零开始使用的列表。\n\n此列表包括任何设备，例如交换机和路由器。由于服务器可能需要从零开始重建，`BCP` 应该列出支持系统所需的操作系统和任何应用程序。如果使用镜像重建服务器，则会列出版本号。\n\
  \n### 提示\n\n安全系统的首要目标是保护机密性、完整性和可用性。在编写 `BCP` 的这一部分时，应考虑这三者任何者的损失。列表上的项目可以包括托管在系统上的数据库；任何类型的文件（如电子表格）；以及所需的供应品。这些供应品可以是简单的办公用品，如纸张和打印墨盒。对于某些系统，列表可以包括技术供应品，例如维护所需的机械或工具。尽可能，应包含这些物品的位置。有些组织会创建“抢救推车”（crash\
  \ carts），其中包含了重建系统所需的所有组件。它们包含了重建系统所需的 CD。\n\n在编写 `BCP` 时，应尽可能包含重建系统所需的组件、应用程序和基础的指令。\n\
  \n## 电信\n\n`BCP` 中与其他系统的必要连接是一个重要元素。这包括内部网络、电话线路、专用线路。外部连接通常使用互联网服务提供商（ISPs）的线路。对于\
  \ `WAN` 和虚拟专用网络（VPN），任何必要的连接都应记录。例如，如果使用 `VPN` 线路，这些信息应包含在内。有些系统具有冗余线路。\n\n### 职责\n\
  \n应分配 `BCP` 内部的职责。分配职责可以让相关人员一了然。当任务未完成或进度落后时，知道负责人更容易让项目回到轨道。\n\n员工将担任 `BCP` 中的特定角色。这些角色包括项目经理、协调员、团队负责人，以及团队成员。\n\
  \n### BCP 项目经理\n\nBCP 项目经理（PM）通常管理大型组织内的多个 `BCP` 项目。例如，一个大型组织可能有多个地点和相应的 `BCP`。BCP\
  \ 协调员管理单个 `BCP` 并向 PM 报告。BCP 项目经理确保每个 `BCP` 都按预期进展。PM 可以利用项目管理技能来管理这些 `BCP`。例如，每个\
  \ `BCP` 都有开始日期、里程碑和开发阶段的结束日期，并将包含评审的开始日期。这些评审也有里程碑和结束日期。\n\nBCP 项目经理负责确保每个 `BCP`\
  \ 都在正常进行。根据组织的层次结构，BCP 项目经理可能对单个 BCP 协调员没有权限，这使得 PM 需要具备卓越的沟通能力。\n\n其他组织可能设有专门的\
  \ PM 部门，他们拥有专业的项目管理技能。首席 PM 监督其他 PM。在这种情况下，BCP PM 对 BCP 协调员拥有直接权限。\n\n### BCP 协调员\n\
  \nBCP 协调员负责特定的 `BCP`。此个人根据 `BCP` 的阶段有两种角色：\n\n*   在 `BCP` 完成并激活之前，此人负责开发和完成它。\n\
  *   在 `BCP` 完成并激活后，BCP 协调员负责宣布紧急情况并激活 `BCP`。\n\n当宣布紧急情况时，BCP 协调员会联系相应的团队或负责人。例如，如果使用了紧急管理团队，协调员将联系紧急管理团队负责人。\n\
  \n### BCP 团队\n\n`BCP` 不能由一个人来计划、实施和执行。相反，组建团队来协助这一过程。\n\n如果组织较小，可能只有一个 `BCP` 团队，该团队承担后续章节中提到的所有个人团队的职责。成员拥有不同的专业水平。某些成员在不同阶段会比其他更活跃。\n\
  \n\n\n\n\n- **应急管理团队**（Emergency management team）——该团队由高级管理人员组成。他们拥有系统恢复的总体权限，同时也与\
  \ `BCP` 协调员紧密合作。在此阶段，存在冲突的可能。谁来负责？`BCP` 协调员还是 `EMT` 负责人？为了避免这种冲突，`BCP` 会明确由谁做出最终决策。例如，`BCP`\
  \ 协调员可能一直负责直到 `EMT` 负责人出现，然后权限将移交给 `EMT` 负责人。无论如何，`EMT` 都会与 `DAT` 紧密合作以识别损害。`EMT`\
  \ 还与 `BCP` 协调员紧密合作以确定响应方案。\n\n- **损害评估团队**（Damage assessment team）——该团队评估损害并宣布事件的严重程度。成员主要收集并报告数据，但不采取行动。例外是他们发现了需要帮助的人员。\n\
  团队可以包括 IT 人员、设施人员以及任何监督资源的人员。团队成员向 `EMT` 报告。`BCP` 可能指定供团队使用的特定表格来报告他们的发现。例如，损害评估表将允许成员记录他们发现的损害位置和严重程度。\n\
  \n- **技术恢复团队**（Technical recovery team）——该团队负责恢复关键 IT 资源。在中断期间，只有在 `BIA` 中识别出的 IT\
  \ 资源将得到恢复和重建。`TRT` 的成员需要与他们正在恢复的资源直接相关的技能。例如，如果团队成员需要恢复数据库服务器，他们需要具备如何操作的知识。\n\n\
  ## 关键人员\n\n![](img/Tip.png) Tips (TIP)\n\n较小的组织可能为 `BCP` 使用单一团队，其中将包含一名或多名高级管理员工以履行执行管理团队的角色、能够调查和评估关键资源损害的人员，以及能够恢复关键资源的成员。\n\
  \n`BCP` 可能会识别具有其他职责的额外人员。这些人员会因组织而异。他们可能包括：\n\n- **关键供应商**（Critical vendors）——如果需要从关键供应商获取特定的供应或其他资源，`BCP`\
