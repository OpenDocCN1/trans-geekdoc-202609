  \ 将评估外部损害。如果中断是即时灾害（例如地震），`DAT` 将在成员到达现场时立即行动。\n\n数据将传递给 `EMT` 团队负责人和 `BCP 协调员`。他们共同工作，根据所有报告确定损害范围。\n\
  \n`EMT` 团队负责人将对该做什么做出决定。如果关键业务可以在现场继续运行，`TRT` 将开始恢复工作。如果损害严重且关键业务无法在原地点继续，业务可能需要转移到备选地点。\n\
  \n### 人员控制表\n\n许多组织使用花名单。此表识别人员的姓名和联系方式。它可以有许多用途，但主要目的是在必要时联系人员。\n\n例如，考虑一个因飓风激活\
  \ `BCP` 的组织。员工可以使用此表通知人员。同样，此表也可供 `BCP 协调员` 使用。格式可以像表 13-2 所示所示简单。\n\n### 恢复阶段\n\
  \n通知和激活阶段之后的步骤是恢复阶段。这是 `TRT` 成员工作的阶段。他们有几个目标，包括：\n\n*   恢复关键系统的临时运行\n*   修复对原始系统造成的损坏\n\
  *   恢复原始系统的损坏\n\n当 `TRT` 完成工作后，关键业务将恢复运行。`TRT` 并不专注于恢复所有所有业务，而是只关注 `BIA` 中确定的 `CBFs`。\n\
  \n\n\n另一方面，恢复目标可能更加完整。例如，一个机构可能在某地提供服务。当灾害发生时，它可能需要在另一个地点恢复所有功能。\n\n`TRT` 将执行实现恢复目标的工作。`DRP`\
  \ 负责指导这些工作，但根据恢复的深度，这些工作可能会分阶段进行。当业务必须迁移到不同的地点时，情况尤为如此。\n\n## 技术恢复团队负责人\n\n`TRT`\
  \ 负责人负责监督 `TRT` 执行的工作。该团队负责人需要非常熟悉现有的 `DRPs`，甚至可能亲手编写过这些计划。团队负责人还负责向 `EMT` 负责人和\
  \ `BCP` 协调员汇报进展。\n\n## 技术恢复团队\n\n`TRT` 执行恢复工作。其工作范围将取决于损害程度以及业务是否发生了迁移。例如，飓风可能导致服务器机房遭受水浸。现场人员可能通过快速切断电源并在水淹没之前移动服务器来限制损害范围，这可能使恢复工作变得非常简单，只需清理水渍、将服务器移回并重启即可。\n\
  \n另一方面，地震可能会破坏建筑并将服务器埋在瓦砾碎片之下，这使得恢复工作变得复杂得多。`TRT` 成员必须在替代地点恢复服务器，这意味着他们需要获取离线备份并将其运送到备用地点，然后需要对其上的数据进行恢复和配置。\n\
  \n`TRT` 的成功通常取决于它在 `DRP` 方面所做的准备工作。理想情况下，相应的人员已经测试过 `DRP` 并保持其更新。如果没有这样做，`TRT` 可能会遇到意料之外的问题。此外，将业务从一个地点迁移到另一个地点是一项巨大的工程，应该预见到会有问题的出现。但如果人员从未测试过\
  \ `DRP`，则可能会出现更多问题。\n\n## 重组阶段（恢复正常运行）\n\n最后一个阶段是重组阶段，此时关键和非关键功能都将恢复到正常。该阶段在发生以下两种情况之一时开始：\n\
  \n* 原地点的损坏已得到修复。\n* 管理层决定将业务永久迁移到备用地点。\n\n### 先迁移最不关键的功能\n\n在将 `CBFs` 从备用地移回原地时，应先迁移最不关键的功能，这将有助于确保最关键的功能不受中断。\n\
  \n当原地恢复功能时，过程最初可能并不顺利，但如果先迁移最不关键的功能，那么只有它们会受到影响。在解决流程中的问题后，就可以迁移更关键的功能。\n\n### 原地或新场地的恢复\n\
  \n如果原地点的损害严重，管理层可能会决定迁移业务，这一决定将涉及许多因素。例如，火灾损坏了公司的主大楼。作为回应，`TRT` 在区域办事处恢复了关键业务运营。随后，`DAT`\
  \ 确定火灾损害非常严重，公司需要重建原建筑。现在，管理层必须决定将这些业务迁移到何处。\n\n尽管关键业务位于备用地点，但它们可能无法支持非关键业务。管理层可能会决定将所有业务迁移到新场地并在那里恢复。另一方面，损害可能只是微小的，那么关键业务则需要从备用地点移回原地。无论何种情况，`TRT`\
  \ 都将执行主要工作，因为他们对 `DRPs` 以及恢复功能所需采取的步骤最为熟悉。\n\n### 并发处理\n\n并发处理意味着业务同时在两个不同的地点运行。例如，某中断导致业务迁移到备用地点，之后将在主地点重建系统。在这种情况下，许多专家建议从两个地点同时运行三到五天，以确保主地点系统运行正常，后再关闭备用地点的业务。\n\
  \n### ![](img/Note.png) 注意\n\n并非所有系统都支持并发处理。其中某些系统可能面临技术挑战，阻止同时运行两个系统。\n\n### 计划停用\n\
  \n在此阶段仍需考虑几点。首先，仅仅让原站点恢复运行并不意味着一切都已恢复正常。例如，如果业务曾迁移到备用地点，该地点需要进行清理。\n\n那里可能已经备齐了所有设备，但如果没有，可能有多台服务器、路由器和交换机被运到了那里。现在，目标是将备用地点恢复到中断之前的状态，甚至更好。\n\
  \n另一个重要的考虑是数据。有时，在重大灾害之后，管理层决定将一些硬件留在备用地点。然而，如果这些系统上留有数据，就会产生不必要的风险，因为任何任何物理接触到备用地点的人都可以获取这些数据。\n\
  \n同样，`TRT` 将负责完成这些步骤。在 `BCP` 中包含清单是有价值的，以确保不会遗漏任何关键事项。一旦一切恢复正常，就可以停用 `BCP`。\n\n\
  ### 计划培训、测试与演练\n\n虽然创建 `BCP` 是巨大的一步，但仅有创建是不够的。需要采取步骤让人员了解该计划。计划还需要经过测试，并需要进行证明其有效的演练。这些步骤的目标是：\n\
  \n* **培训**——向人员讲解关于 `BCP` 的细节\n* **测试**——验证 `BCP` 将按计划运行\n* **演练**——演示计划将如何运作\n\n\
  #### BCP 培训\n\n`BCP` 协调员负责确保所有人员都过培训，其中最重要的是团队成员。他们应该很好地理解 `BCP` 激活时的实际职责。\n\n每个\
  \ `BCP` 团队的职责不同，但不需要所有团队同时接受所有职责的培训。可以举办以下培训课程：\n\n* **全体团队培训**——让大家对计划有一个整体了解，以及每个团队如何融入其中。\n\
  * **EMT 培训**——针对 `EMT` 成员，识别他们的特定职责。\n* **DAT 培训**——针对 `DAT` 成员。强调评估的重要性并识别要使用的工具或清单。\n\
  * **TRT 培训**——针对 `TRT` 成员。包括对每份单独恢复计划的审查。\n\n培训应至少每年进行一次，除非 `BCP` 或系统发生变化，在这种情况下，培训需要更频繁。例如，如果\
  \ `BCP` 中确定的关键系统被替换，则需要修改 `BCP`。领域专家会更新 `DRP`，如果其发生了变化，`TRT` 成员随后需要接受新的 `DRP` 培训。\n\
  \n#### BCP 测试\n\n\n\n\n\nBCP（业务连续性计划）测试至少每年完成一次。测试的目标是证明 BCP 内的步骤是可行的，并为团队成员提供一个演练计划步骤的机会。\n\
  \n测试可能包括以下步骤：\n\n*   **测试 BCP 每个阶段中的各个单独步骤**——这种测试需要对 BCP 进行逐行审查。某些程序（例如执行召回）只能通过调取召回名单并拨打名单上的人员来测试。\n\
  *   **测试所有灾难恢复计划（DRP）**——这种测试确保 DRP 中的步骤能够按照文字描述完成。例如，DRP 可能会识别重建和恢复数据库服务器的步骤。管理员将在离线系统上执行\
  \ DRP，以确定步骤是否成功。\n*   **定位并测试备用资源**——如果计划确定了备用地点或资源，则需要对它们进行测试。例如，如果计划确定了备用地点，则测试该地点以看它是否实际上能支持关键业务功能（CBFs）。\n\
  \n测试应该揭示计划中的任何问题或缺陷，包括步骤、资源或人员方面的任何问题，并应尽快解决它们。\n\n### BCP 测试演练\n\nBCP 演练的首要目的是展示\
  \ BCP 将如何运作。这些演练应该是具有挑战性但现实的，并且应该呈现可以解决的问题。\n\n除了测试 BCP 的能力外，演练还将建立参与者的信心。如果发生实际紧急情况，人们将能够想起演练的内容。如果一切都失败了，他们在紧急情况下将对计划感到非常不确定，甚至可能在紧急情况下放弃或尝试绕过它。\n\
  \n许多组织采用分阶段的方法来演练计划。他们起初不是进行全规模演练，而是进行桌面演练和功能性演练。\n\n![](img/Tip.png) 提示\n\nBCP\
  \ 演练不应影响正常的任务操作。任何影响操作的步骤都可以通过模拟进行测试。多个场景可以作为桌面演练进行。例如，其中一个场景可能是天气相关的事件，如飓风。BCP\
  \ 协调员可以识别该阶段，团队负责人或成员可以通过识别他们将做什么来响应。另一个场景可以更具紧迫性，例如半夜发生的火灾。\n\n记录和评估演练非常重要，可以由不属于任何\
  \ BCP 团队的人员来完成。这种外部视角对于确保所有问题得到解决非常有价值。\n\n**桌面演练。** 桌面演练将所有成员聚集在一起讨论过程。在这种演练中，所有团队成员坐在会议室桌旁，然后\
  \ BCP 协调员向他们展示一个场景。\n\n团队成员识别他们将如何应对该场景。此时此时，BCP 已经编写并获得批准，理想情况下，团队成员的响应将与 BCP 的规定一致。然而，在这种环境下，参与者可能会将自己置于实际情境中并识别出不同的问题。\n\
  \n**功能性演练。** 功能性演练评估 BCP 内的特定功能。例如，BCP 为某些关键功能确定了备用地点。可以执行功能性演练来恢复位于备用地点的所有关键资源。\n\
  \n功能性演练的戏剧性较低，资源消耗也较少。例如，简单地启动召回名单即可验证其准确性，并确定完成召回需要多长时间。\n\n记录和评估演练非常重要，可以由不属于任何\
  \ BCP 团队的人员来完成。这种外部视角对于确保所有问题得到解决非常有价值。\n\n**全规模演练。** 全规模演练涉及在模拟环境中实际实施 BCP。这是最全面的演练类型，需要最多的资源和协调。它允许组织不仅测试计划，还测试所有参与人员的协调和响应。\n\
  \n![](img/Note.png) 注意\n\n测试与功能性演练的主要区别在于，测试是在没有时间限制的情况下完成的。完成演练所需的时间应该记录。\n\n###\
  \ 计划维护\n\nBCP 协调员负责 BCP，包括审查和更新。更新 BCP 有几个具体原因，例如：\n\n*   IT 基础设施的更改\n*   定期更新（如每年一次）\n\
  *   在测试或演练之后\n\n#### BCP 计划修订跟踪\n\n对 BCP 的所有修订都需要记录。这确保了人们可以轻松判断文档是否被修改过，并且他们拥有最新版本。许多组织使用简单的版本控制页。例如，`Table\
  \ 13-3` (`24_chapter13_02.xhtml#tab13-3`) 显示了版本控制页的示例。\n\n**表 13-3** BCP 版本控制页\n\
  \n![](img/Table13-3.png)\n\n除了在版本控制页中记录变更外，所有相关方都必须通知变更。例如，如果变更直接影响应急响应小组（EMT）成员，他们应该知道这些变更是什么。\n\
  \n#### 根据基础设施内部的变化更新 BCP\n\n当 IT 基础设施发生任何重大变化时，应审查 BCP，特别是在对关键系统进行任何更改之后。\n\n例如，单个服务器托管了在线销售的\
  \ Web 服务器和数据库。BCP 包含一个 DRP 以在灾难发生时恢复此服务器。如果该系统升级为具有双节点故障转移集群后端数据库服务器的四节点 Web 池，这种更改是巨大的，但原始的\
  \ BCP 和 DRP 没有涵盖这种新配置。如果这些服务器移动到备用地点，原始的 BCP 和 DRP 将无法提供太大帮助。因此，适当的做法是审查 BCP，然后升级\
  \ BCP 和 DRP 以反映这些更改。\n\n\n\n\n\n`BCP` 协调员负责至少每年审查一次 `BCP`，即使在没有变更的情况下如此。此审查确保 `BCP`\
  \ 仍然涵盖并满足组织的所有要求。它包括对 `BIA` 的审查，以确保 `CBFs` 未被修改且仍被视为关键业务；对运营和安全性要求的审查；以及对任何单个流程（如召回）和更具技术性的程序（如\
  \ `DRPs`）的审查。\n\n审查过程可以与重写过程分开。例如，可以指派 `TRT` 成员负责审查作为 `BCP` 附件包含的某项特定 `DRP`。审查可能会发现系统发生了变化，导致\
  \ `DRP` 过时。`TRT` 成员应将审查结果报告给 `BCP` 协调员，然后由 `BCP` 协调员让 `TRT` 负责人更新 `DRP`。\n\n`BCP`\
  \ 协调员应通过适当的人员传达变更。如果变更直接影响 `TRT`，则变更应通过 `TRT` 负责人获取其意见。此外，在变更完成后，应通知所有受影响人员。例如，应由\
  \ `TRT` 负责人或 `BCP` 协调员通知所有 `TRT` 成员该变更。\n\n## BCP 测试\n\n对 `BCP` 的审查还应包括对培训、测试和演练信息的审查。在这些活动中可以学习到非常有价值的信息，例如确定\
  \ `BCP` 中的某些程序将运行良好，而另一些程序需要通过更新 `BCP` 来改进。\n\n理想情况下，`BCP` 应在这些活动报告完成后尽快进行更新。然而，对这些报告的审查也可以纳入\
  \ `BCP` 的年度审查中，以确保在培训、测试和演练中识别的所有问题得到解决。\n\n## BCP 如何降低组织的风险？\n\n`BCPs` 通过确保组织对灾难做好更好的准备来降低组织的风险。如果发生灾难，组织将能够在未雨绸缪和规划的益处下应对它。另一方面，如果组织没有\
  \ `BCP`，经理们必须做出临时决定。\n\n飞行员通常因其在面对灾难时冷静反应的能力而备受赞誉。例如，切斯利“萨利”·萨伦伯格机长在 2009 年意识到他的最佳选择是将喷气式飞机降落在哈德逊河，这促使他对着麦克风冷静地说：“我们要进哈德逊河了。”\n\
  \n他为什么如此冷静？因为飞行员对灾难进行了过多次训练，以至于他们知道需要做什么。即使在危机中，他们也能冷静地确定采取的最佳步骤，以减轻灾难的影响。\n\n另一方面，如果一个飞行员从未对灾难进行过训练，然后突然两台喷气发动机停止工作，他可能会尝试任何方法让一切重新运行。他的大部分精力将浪费在尝试那些无法成功或会让情况变得糟糕的行动上。\n\
  \n同样，`BCP` 帮助组织为灾难进行规划和培训，这样如果真的发生了灾难，组织将会有更好的准备来应对。\n\n### 提示\n![](img/Tip.png)\n\
  \n在没有 `BCP` 的情况下，严重的损失导致了整个公司的失败。安德鲁·海尔斯（Andrew Hiles）在《业务连续性管理权威手册》（*The Definitive\
  \ Handbook of Business Continuity Management*）中写道，失去设施但没有 `BCP` 的公司，有 60% 到 90%\
  \ 在 24 个月内完全失败。`BCP` 就像保险。公司总是想拥有它，但从未想使用它。\n\n![© Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n\
  \n© Sai Chan/Shutterstock\n\n## 使用灾难恢复计划降低风险\n\n灾难会发生，没有任何办法可以阻止它们。因此，最好的办法是为它们做好准备，而制定灾难恢复计划（`DRP`）是组织做到此点的最好方法。灾难来袭时，`DRP`\
  \ 可以减轻短期长期损害。\n\n在开发 `DRP` 时，需要考虑几个对其成功至关重要的因素。这些因素包括管理层必须提供的元素、`DRP` 开发人员的需求，以及对几个主要关注点的理解。这些主要关注点包括恢复时间目标（`RTOs`）、对备用位置的需求以及预算。没有资金，`DRP`\
  \ 注定会失败。\n\n单个 `DRPs` 的内部元素可能不同，但总的来说，通常包含几个元素。所有 `DRPs` 都从定义其目的、范围以及它们应对的灾难开始。\n\
  \n### 主题\n本章涵盖了以下主题：\n*   什么是灾难恢复计划（`DRP`）\n*   什么是关键成功因素（`CSFs`）\n*   `DRP` 的元素有哪些\n\
  *   `DRP` 如何降低组织的风险\n*   实施 `DRP` 的最佳实践是什么\n\n### 目标\n当你完成本章后，你将能够：\n*   描述 `DRP`\
  \ 的需求和目的\n*   定义 `DRP` 的 `CSFs`\n*   识别管理层必须提供什么以确保 `DRP` 的成功\n*   识别 `DRP` 开发人员需要什么以确保\
  \ `DRP` 的成功\n*   描述 `DRP` 中用到的 `RTOs` 及其用法\n*   定义并对比冷备（cold sites）、热备（hot sites）、温备（warm\
  \ sites）和移动站点（mobile sites）\n*   定义冗余备份站点（redundant backup site）\n*   描述规划备用位置时的访问问题\n\
  *   描述灾难恢复预算的目的\n*   识别 `DRP` 的元素\n*   描述 `DRP` 中使用的步骤和程序\n*   识别 `DRP` 使用的测试类型\n\
  *   识别维护 `DRP` 使用的步骤\n*   描述 `DRP` 如何降低组织的风险\n*   列出实施 `DRP` 的最佳实践\n\n## 什么是灾难恢复计划？\n\
  \n灾难恢复计划（`DRP`）是在灾难发生后恢复关键业务流程或系统运行的计划。`DRP` 可用于应对各种灾难，包括飓风、龙风和洪水等天气事件；地震等自然事件；任何来源的火灾。\n\
  \n`DRP` 还可以用于在硬件或软件故障后重建系统。如果关键系统崩溃，运营就会停止。虽然这不像地震那样灾难，但对于该系统来说是一个灾难。\n\n### 提示\n\
  ![](img/Tip.png)\n\n业务连续性计划（`BCPs`）是针对整体业务开发的。相比之下，`DRP` 针对特定系统，是 `BCP` 的元素。\n\n\
  ### 容错能力不是灾难恢复\n\n许多组织为系统提供了容错能力。它有助于确保系统在组件故障后继续运行。然而，容错能力和灾难恢复不是一回事。\n\n例如，独立磁盘磁盘阵列（`RAID`）为磁盘提供了容错能力。如果系统中的一个磁盘发生故障，故障会被容忍，系统将继续运行。然而，如果灾难摧毁了服务器，容错的\
  \ RAID 系统无法克服这种失败。必须能够重建服务器并恢复丢失的数据才能进行灾难恢复。\n\n\n\n\n同样，容错能力并不意味着不需要备份。如果服务器受到\
  \ RAID 系统的保护，仍然需要进行备份。RAID 能够防止单块磁盘故障，但如果服务器发生火灾或灾难性故障损坏了所有磁盘，RAID 上的数据将会丢失。因此，如果没有备份，数据将永远丢失。\n\
  \n容错能力和灾难恢复技术都是必要的。容错能力即使在发生孤立停机时也能提高系统的可用性，而灾难恢复则提供了在重大故障发生后恢复系统的程序。\n\n灾难恢复计划可以用许多术语来描述，但它们本质上是相同的。除了`灾难恢复计划`术语外，还可以以下术语：\n\
  \n*   应急计划\n*   应急管理程序\n*   业务恢复计划\n*   企业应急预案\n*   业务中断计划\n*   灾难准备\n\n在处理 `DRPs`\
  \ 时，理解几个与 `DRP` 相关的术语非常重要。这些术语包括：\n\n*   `关键业务功能 (CBFs)`——`CBFs` 是任何被认为对组织至关重要的功能。在发生中断时，必须恢复这些关键功能以保护组织的资产。如果\
  \ `CBF` 失败，组织将失去执行履行其义务甚至继续生存所需的关键操作的能力。个人信息技术 (`IT`) 系统和服务支持支持 `CBFs`。\n*   `最大可接受中断时间`——最大可接受中断时间\
  \ (MAO)，也称为最大容忍时间 (`MTD`)，系统或服务在影响组织目标或生存之前可以停机的最长时间。`MAO` 直接影响所需的恢复时间，因为系统必须在达到\
  \ `MAO` 时间之前是可恢复的。\n*   `恢复时间目标`——恢复时间目标 (RTO) 是系统或功能必须恢复的时间，以避免不可接受的业务后果。`RTO`\
  \ 等于或小于 `MAO`。例如，如果 `MAO` 为 10 分钟，则 `RTO` 为 10 分钟或更短。与 `MAO` 不同，`RTO` 不一定影响业务的生存能力。\n\
  *   `业务影响分析`——业务影响分析 (BIA) 是一项识别 `CBFs` 和 `MAOs`、当一个或多个 `IT` 功能失败时对业务的影响以及不同关键系统的优先级的研究。\n\
  *   `业务连续性计划 (BCP)`——`BCP` 是一项帮助组织准备不同类型紧急情况的综合计划。其目标是确保在中断或灾难发生后，关键任务功能继续运行。`BCP`\
  \ 包含 `BIA` 和一个或多个 `DRPs`。\n*   `最小业务连续性目标`——最小业务连续性目标 (MBCO) 是组织在灾难期间满足其业务需求和目标所需的最低服务水平。\n\
  \n### DRP 的必要性\n\n每个拥有关键任务的组织都需要为灾难制定计划。如果支持任务的操作停止，业务就会停止。除非组织可以在任何时间段不需要关键业务系统，否则它就需要一个\
  \ `DRP`。\n\n规划灾难的时间是在灾难发生之前，而不是在灾难期间。一旦灾难发生，再来确定哪些系统是关键的、哪些关键系统比其他系统更重要以及哪些方法是恢复最重要系统的最佳方法就就太晚了。\n\
  \n然而，如果 `BCP` 识别了关键系统且 `DRP` 提供了如何恢复这些系统的细节，组织就准备好应对了。如果没有 `DRP`，组织可能无法恢复。\n\n###\
  \ DRP 的目的\n\n大多数 `DRPs` 包含一个目的声明，帮助识别 `DRP` 的目标，这些目标通常是多个。这些包括：\n\n*   `拯救生命`——人员的保护和安全始终是重要的。如果保护人员需要任何步骤，`DRP`\
  \ 将识别这些步骤。这些步骤包括为了应对即将到来的灾难（如飓风）应该做什么，以及在灾难发生期间和过去之后应该做什么。\n*   `确保业务连续性`——`DRP`\
  \ 包含了在发生灾难时恢复 `CBFs` 的程序。这些程序的目的是确保关键任务操作在灾难期间和之后继续运行。\n*   `在灾难后恢复`——`DRP` 涵盖了每个阶段。该阶段恢复业务运行。\n\
  \n## 为组织实施 BCP 的最佳实践\n\n在实施 `BCP` 时，可以使用多项最佳实践。以下是其中的许多：\n\n*   `尽早完成 BIA`——`BIA`\
  \ 应该在过程的早期完成。没有 `BIA`，没有人知道哪些系统是关键的，或者应该使用什么优先级进行恢复。\n*   `从替代位置恢复功能时要谨慎`——当将功能从替代位置恢复到主位置时，应考虑这些最佳实践：\n\
  \    *   `先恢复最不关键的功能`——如果系统已在主位置重建，在切断替代位置的服务之前，它们应该运行三五五。\n*   `定期审查和更新 BCP`——`BCP\
  \ 协调员`应至少每年审查和更新 `BCP`。如果在年度审查之间关键系统发生了更改或修改，应在发生这些更改或修改时审查 `BCP`。\n*   `测试计划的所有部分`——测试包括基础程序（如召回）以及\
  \ `DRPs` 中记录的更详细的程序。\n*   `演练计划`——通过进行演练来验证计划。这些演练不应影响正常操作。\n\n## 章节总结\n\n本章涵盖了\
  \ `BCPs` 的细节。`BCP` 的主要目标是确保组织在中断或灾难后能够继续运行。`BCP` 包含了 `CBFs` 的细节，包括为了保持其运行需要做什么。许多个人和团队共同负责。`BCP\
  \ 项目经理`监督所有 `BCPs`，`BCP 协调员`管理一个或多个 `BCPs`。多个带有个人负责人的团队在 `BCP` 的开发和实施期间为 `BCP 协调员`提供支持。\n\
  \n`BCP` 有三个主要阶段。在通知和激活阶段，`BCP 协调员`启动活动；在恢复阶段，关键系统得到恢复和修复；在重建阶段，灾难结束后恢复正常运行。所有 `BCP`\
  \ 团队成员和负责人都应接受 `BCP` 的培训，并对其进行测试和演练以确保其完整性。\n\n### 核心概念和术语\n\n损害评估小组 (DAT)\n\n\n\
  \n\n# 应急管理小组 (EMT) (#24_chapter13_02.xhtml#gloss68)\n\n# 关键任务 (#24_chapter13_01.xhtml#gloss118)\n\
  \n# 技术恢复小组 (TRT) (#24_chapter13_02.xhtml#gloss183)\n\n## 第 13 章评估\n\n1. `\\_\\_\\\
  _\\_\\_\\_\\_\\_` 是一项帮助组织在中断或灾难发生期间及之后继续运行的计划。\n2. 业务连续性与灾难恢复是同一回事。\n    1. 正确\n\
  \    2. 错误\n3. `BCP` 包含了特定的地点、系统、员工和供应商，这些需求在 `\\_\\_\\_\\_\\_\\_\\_\\_` 声明中被识别。\n\
  4. `BCP` 的目的是什么？\n    1. 识别 `CBFs`\n    2. 减少或消除威胁\n    3. 确保组织的关键任务元素在中断后继续运行\n\
  \    4. 以上所有\n5. 在中断或灾难发生期间及之后，`BCP` 帮助保护什么？\n    1. 机密性、信息和认证\n    2. 证书、身份和认可\n\
  \    3. 关键任务和非关键任务的 `CBFs`\n    4. 机密性、完整性和可用性\n6. `\\_\\_\\_\\_\\_\\_\\_\\_` 负责宣布紧急情况并激活\
  \ `BCP`。\n7. `BCP` 激活后，由谁对系统恢复拥有总体权限？\n    1. `EMT`\n    2. `DAT`\n    3. `TRT`\n\
  \    4. `CAT`\n8. `BCP` 激活后，由谁来评估损失？\n    1. `BCP coordinator`\n    2. `EMT`\n \
  \   3. `DAT`\n    4. `TRT`\n9. `BCP` 激活后，由谁来恢复和还原关键 IT 服务？\n    1. `BCP coordinator`\n\
  \    2. `EMT`\n    3. `DAT`\n    4. `TRT`\n10. `BCP` 的三个阶段是什么？\n    1. 通知与激活、传输、恢复\n\
  \    2. 通知与激活、恢复、重组\n    3. 恢复、更新、重组\n    4. 传输、恢复、通知\n11. 一大中断迫使公司将业务转移到备用地。中断已结束，现在需要开始业务正常化流程。哪些业务应该先移回原地点？\n\
  \    1. 最少的 `CBFs`\n    2. 最多的 `CBFs`\n    3. 非关键任务人员\n    4. 关键任务人员\n12. 一大中断迫使公司将业务转移到备用地。中断已结束，现在需要开始业务正常化流程。主地点已重建了若干台服务器。应该怎么做？\n\
  \    1. 测试服务器然后关闭备用地的服务器。\n    2. 将服务器上线并关闭备用地服务器。\n    3. 与备用地并发运行三到五天。\n    4.\
  \ 在上线前对服务器进行三到五天的测试。\n13. 可以做什么来证明 `BCP` 按计划运行？\n    1. `BCP planning`\n    2. `BCP\
  \ training`\n    3. `BCP testing`\n    4. `BCP exercises`\n14. 哪些类型的练习可以演示 `BCP`\
  \ 的运行？（选择三项）\n    1. 演练（Tabletop exercises）\n    2. 功能演习（Functional exercises）\n\
  \    3. 拔插头演习（Pull-the-plug exercises）\n    4. 全规模演习（Full-scale exercises）\n15.\
  \ `BCP` 开发完成后，应定期对其进行审查和更新，例如每年一次。\n    1. 正确\n    2. 错误\n\n### 关键成功因素\n\n`DRP`\
  \ 的成功取决于几个关键成功因素 (CSFs)。`CSF` 是计划成功要素的要素。例如，任何组织都有若干个必须成功的 `CSFs` 才能确保该组织的成功。同样，`DRPs`\
  \ 也有 `CSFs`。如果 `DRP` 中不包含这些因素，它成功的机会就会降低。\n\n对 `DRP` 成功至关重要的要素包括：\n* 管理支持\n* `DRP\
  \ developers` 具备知识和权限\n* 识别主要关注点，例如 `RTOs` 和备用地的需求\n* 灾难恢复预算\n\n以下章节将深入探讨这些灾难恢复计划\
  \ `CSFs`。\n\n### 管理必须提供什么\n\n就像风险管理和安全计划一样，`DRPs` 需要管理的支持。某些支持可能仅仅是公开认可该计划，而其他支持可能更具实质性，例如提供资金。\n\
  \n管理支持并不保证 `DRP` 的成功，因为其他要素也是必要的，但如果没有管理层的支持，`DRP` 可能会失败。如果管理层不支持 `DRP`，组织内的其他人也不会支持它。\n\
  \n#### 资源\n\n管理层提供的主要资源是人员，他们是创建、测试和更新 `DRP` 所需要的。他们可以是内部员工，也可以是精通灾难恢复的外部顾问。\n\n\
  管理层的财务支持也是必要的。例如，如果公司需要备用地，只有通过财务支持才能获得。\n\n### 领导力\n\n管理还必须提供领导力。领导者理解 `DRP` 的重要性，并帮助灾难团队认识其价值。\n\
  \n![提示](img/Tip.png)\n\n当老板和领导并不是回事。老板拥有权威并指示人们完成任务。人们为老板完成任务是因为被要求这样做。相反，领导者影响他人实现共同目标并在表现上卓越。领导者帮助他人看到如何做出贡献。人们为领导者完成任务是因为共享愿景。\n\
  \n管理层必须以身作则。如果管理层希望其他人支持 `DRP` 的需求，他们必须支持 `DRP`。如果管理层希望其他人投入精力关注 `DRP`，那么运营经理需要在需要时投入。\n\
  \n### DRP 开发人员的需求\n\n`DRP` 的开发者需要特定的知识和权限才能成功。不能仅仅任务给任何系统专家 (`SME`) 并期望他们能编写 `DRP`。同样，也不能期望某些灾难恢复专家能够编写\
  \ `DRP`。\n\n相反，需要具备综合技能的人员。`DRP developers` 需要理解灾难恢复以及组织运作。他们通常可以与各个 `SMEs` 协作识别系统的特定步骤。\n\
  \n### 灾难恢复知识\n\n`DRP team` 必须通晓灾难恢复，特别是什么是 `BIA`、什么是 `BCP`，以及 `DRP` 如何与 `BIA` 和\
  \ `BCP` 结合。\n\n提醒一下，`BIA` 识别关键系统并对其进行排序。`BCP` 包含了 `BIAs` 和 `DRPs`。`DRPs` 提供了恢复特定系统的细节。某些\
  \ `DRPs` 在中断后立即处理 `CBFs` 的系统恢复。其他 `DRPs` 则在灾难过去后处理所有业务功能的系统恢复。\n\n\n\n\n\nDRP 开发者必须理解\
  \ DRP 的目的以及它如何融入整体 BCP（业务连续性计划）中。否则，DRP 将缺乏重点。不同风险管理概念（如 `BIA`、`DRP` 和 `BCP`）之间的关系如\
  \ `图 14-1` 所示。\n\n![FIGURE 14-1 风险管理：BIA、DRP 和 BCP.](img/9781284183719_CH14_FIGF01.png)\n\
  \n**图 14-1** 风险管理：BIA、DRP 和 BCP。\n\n## 组织运作方式的知识\n\n了解组织的运作方式对于编写高效的 DRP 至关重要。例如，军事基地的\
  \ DRP 与小企业的 DRP 将会有很大不同。军事基地可能需要每天 24 小时每周 7 天的支持，而小企业可能只需要在周一至周五的 9:00 到 5:00 提供支持。\n\
  \n### ![](img/Tip.png)`提示`\n\n许多公司聘请外部顾问来帮助制定 DRP 和 BCP。这些顾问可以与管理层和领域专家（SMEs）合作，以确保\
  \ DRP 符合组织的需求。\n\n除了营业时间外，任何组织都有 DRP 开发者需要理解的特定流程，其中某些流程是至关重要的。要么是 DRP 支持这些流程，要么是\
  \ DRP 可以假设这些流程将保持运行。其他流程不是关键的，不应让 DRP 依赖它们。\n\n例如，某个组织可能同时配备了不间断电源（`UPSs`）和发电机。即使失去市用电，这些设备也能为关键系统提供持续电源。DRP\
  \ 可能包含相关步骤，以确保灾难发生时手头的燃料能够维持特定时长。\n\n另一个组织可能使用云计算处理某些 `CBFs`（关键业务功能），例如数据服务。如果是这样，则将制定服务水平协议（`SLAs`）以确保第三方供应商保持这些服务的运行，因此\
  \ DRP 就不需要处理这些服务。\n\n## 权限\n\nDRP 开发者在创建 DRP 时需要一些权限。例如，DRP 开发者在编写 DRP 之前需要收集数据。如果开发者不是领域专家，这一点尤为如此。为了成功，DRP\
  \ 开发者需要权限去采访这些系统的专家。\n\n如果 DRP 跨越了部门边界，DRP 作者需要做出可能影响多个部门的决策。考虑到这一点，DRP 作者需要管理层的支持来做出初始决策。\n\
  \n### 主要关注点\n\nDRP 应解决几个主要的关注点，DRP 开发者在编写 DRP 之前应该对这些点有清晰的认识。一个重要的关注点是 `RTOs`（恢复时间目标），它确定了\
  \ DRP 的关键性。某些系统需要立即恢复，而另一些系统在恢复之前可以离线数日。\n\n了解所需的离地资源也很重要。至少，备份副本需要存储在离地。DRP 还可能涉及使用备用地点进行运营的操作。本章的其他章节都探讨了这些主题。\n\
  \n## 恢复时间目标\n\n`RTOs` 确定了系统必须何时恢复，并派源自 `BIA` 中确定的 `MAO`（最大中断时间）。超过 `MAO` 的停机将对组织产生严重的负面影响，这意味着如果故障没有在\
  \ `RTO` 内解决，将影响任务的执行。\n\n`MAO` 可以是 60 分钟、24 小时或其他数值。然而，这个数字驱动了 `RTO`。例如，如果 `MAO`\
  \ 是 60 分钟，则编写 DRP 时需要满足小于 60 分钟的 `RTO`。如果 `MAO` 是 24 小时，则 `RTO` 相应设定。\n\n了解离地资源的需求同样重要。至少，备份副本需要存储在离地。DRP\
  \ 还可能涉及使用备用地点进行运营。所有这些主题在这一章的其他章节中都有了探讨。\n\n（注：由于原文后续多处存在重复或逻辑断层，翻译时已根据指令“不要重复输出原文”的原则进行了处理。针对原文的\
  \ `RTO` 逻辑及重复描述，翻译文如下：）\n\n## 恢复时间目标\n\n`RTOs` 确定了系统必须何时恢复，并派源自 `BIA` 中确定的 `MAO`。超过\
  \ `MAO` 的停机将对组织产生严重的负面影响，这意味着如果故障没有在 `RTO` 内解决，将影响任务的执行。\n\n`MAO` 可以是 60 分钟、24 小时或其他数值。然而，这个数字驱动了\
  \ `RTO`。例如，如果 `MAO` 是 60 分钟，则编写 DRP 时需要满足小于 60 分钟的 `RTO`。如果 `MAO` 是 24 小时，则 `RTO`\
  \ 相应设定。\n\n## 离地存储、备份与恢复\n\n执行备份以确保数据可用，是任何恢复计划中不可或缺的一部分。如果数据无法恢复，对组织将是灾难性的。\n\n\
  为了确保数据可用，备份通常是恢复计划的一部分，并派源于备份策略。备份策略确定了需要备份哪些数据以及保留多久。许多备份计划包含了测试恢复的细节。\n\n### 恐怖故事\n\
  \n备份数据的目标是为了能够恢复它，这似乎显而易见，但事实并非总是如此，正如关于无法恢复的备份的无数恐怖故事所示。只有当组织需要恢复丢失或损坏的数据时，技术人员才会发现备份是损坏的。这种常见问题可以通过测试恢复（即从最近的备份尝试恢复数据）来轻松避免。如果测试成功，则说明备份是有效的；反之，则需要处理备份过程。\n\
  \n备份主要针对数据。然而，在某些情况下，可能对程序进行备份。例如，如果组织开发应用程序，则其备份必须可用。自然，源代码应该保持安全，但也需要对这些源代码进行备份。\n\
  \n备份的另一个关键要素是确保备份副本存储在离地。所有的备份都不应存储在服务器所在的地点。如果火灾摧毁了建筑，也会摧毁服务器和备份；而如果备份副本存储在不同的地点，即使火灾完全摧毁了建筑，可以使用它们来恢复数据。\n\
  \n以下两个术语标识了不同的冗余传输类型，它们通常作为整体应急恢复计划的一部分：\n\n\n\n\n\n*   **电子金库技术（Electronic vaulting）**——这种方法通过广域网（WAN）链路或\
  \ Internet 隧道将备份数据传输到场外地点。\n*   **远程日志（Remote journaling）**——这种方法首先在远程位置创建数据的完整副本，然后将主位置的更改日志发送到备用位置。这些更改会被批的形式应用于备用位置。应用后，备用位置即为最新。\n\
  \n数据库可以实现远程日志的轻微变体。这些变体包括数据库镜像和数据库影子技术。\n\n### 提示\n有多种方法可以将数据从一个数据库服务器复制到另一个服务器。可以创建镜像服务器并让它们都上线；可以创建备用服务器，让其中一个在线而另一个离线以接收复制的数据；还可以创建包含分发器、发布者和订阅者的复杂复制模型。\n\
  \n#### 备选位置\n许多公司需要确保即使发生严重中断，其业务也能继续运行。例如，在加利福尼亚州圣德烈亚斯断层附近工作的企业面临着几乎不断的地震威胁。如果发生地震，业务可能无法在原位置运行。\n\
  \n如果组织必须在发生重大灾难后继续运营，则需要确定一个或多个备选位置。这些备选位置可以是不同的建筑、不同的城市，甚至是不同的州，这取决于要准备的灾难类型。例如，如果火灾摧毁了一栋建筑，同一城市的备选位置即可；但如果是防范地震，可能需要另一个城市甚至不同州的备选位置。\n\
  \n共有四种类型的备选位置：冷备（cold sites）、温备（warm sites）、热备（hot sites）和移动备件（mobile sites）。每个站点必须具备托管主位置关键数据和程序的能力。然而，每个站点的成本和初始能力不同。作为介绍，表\
  \ 14-1 提供了冷备、温备、热备和移动站点能力的概述。\n\n**表 14-1** 冷备、温备、热备和移动站点的比较\n\n![](img/Table14-1.png)\n\
  \n**冷备。** 冷备 是一个可用的建筑，拥有电力、自来水和厕所，但没有任何关键业务所需的任何设备、数据或应用程序。如果需要支持服务器环境，它可能拥有架空地板。\n\
  \n例如，一个组织可以租另一栋建筑的空间来防备重大灾难。如果发生灾难，他们会将设备和数据移到该位置并在那里设置 CBF（关键业务功能）。显然，移动和设置设备需要大量工作。\n\
  \n冷备的维护成本很低，因为它们只是空建筑。然而，测试冷备既困难又昂贵。\n\n### 注意\n在另一栋建筑租赁空间作为冷备时，确保该空间未被租给他人非常重要。例如，某些企业会将可用空间租给两个或多个组织。当灾难来临时，好几个组织可能会尝试进入同一个空间。\n\
  \n**热备。** 热备 包含了接管业务功能所需的所有设备和数据。热备能够在几小时内（有时是几分钟内）承担运营。它通常在现场每天 24 小时、每周 7 天配备人员。\n\
  \n热备的维护成本很高。然而，一些新技术使其管理变得稍微容易了一些。云计算和虚拟化是有时用于热备的两种新技术。云计算是任何涉及通过公共网络（如 Internet）托管服务的通用术语。\n\
  \n### 提示\n组织经常与第三方供应商签约通过云计算提供服务。组织经常与第三方供应商签约通过云计算提供服务。由于云计算涉及任何涉及通过公共网络（如 Internet）托管的服务，云计算是任何涉及通过公共网络（如\
  \ Internet）托管服务的通用术语。如图 14-3 所示，这些服务托管在 Internet 上。由于这些服务可以访问。\n\n![图 14-3 云计算](img/978128418319_CH14_FIG03.png)\n\
  \n**图 14-3** 云计算\n\n这对于热备非常有用。例如，如果关键业务需要从区域办公室而不是总部进行管理，迁移几乎是无缝的。这些服务可以访问。虚拟化是另一种可用于热备的技术。多个虚拟服务器托管在单个物理服务器上。每个虚拟服务器在网络上作为单独的服务器运行。\n\
  \n#### 通过云计算提供的考勤服务\n许多组织已转向使用云计算来跟踪工时。基于 Web 的服务器托管考勤应用程序，员工然后使用网络浏览器登录。\n\n某些服务允许员工在每天上班时登录并“打卡”，在离开时登录并“下班”。这些网站通常配置为防止员工从家里打卡和下班。\n\
  \n在薪期结束时，主管批准工时，然后将数据交给财务部门处理工资单。\n\n考勤服务显著减少了组织管理工资单的时间，由于这是提供服务的公司的主要功能，它能够高效且低廉地完成工作。\n\
  \n在图 14-4 中，`SRV1` 是物理服务器，它托管了四个服务器 `SRV2`、`SRV3`、`SRV4` 和 `SRV5`。所有五个服务器在网络上像独立的服务器一样运行。`SRV1`\
  \ 比典型的服务器拥有更多的资源，因为它拥有多个处理器、大量的随机内存（RAM）和快速硬盘。管理员会将这些资源的一部分分配给每个虚拟服务器。\n\n![图 14-4\
  \ 一个物理服务器托管四个虚拟服务器](img/978128418319_CH14_FIG04.png)\n\n**图 14-4** 一个物理服务器托管四个虚拟服务器\n\
  \n一旦创建了虚拟机，它就可以轻松地从一个物理服务器移动到另一个物理服务器。虚拟机由存储在物理服务器上的一组文件组成。诚然，这些文件很大。然而，可以关闭虚拟机，将文件复制到另一个物理服务器，然后在那里启动虚拟机。\n\
  \n如果带宽足够，可以通过 WAN 链路传输虚拟机文件。如果带宽不足，大容量通用串总线（USB）硬盘也是一种选择。只需将虚拟机文件复制到 USB 硬盘，将其插入新的物理服务器，并将文件复制到物理服务器上。复制这些文件的过程取决于虚拟化软件。例如，在微软的\
  \ `Hyper-V` 中，从原始服务器导出文件，然后将其导入新服务器。\n\n\n\n\n\n虚拟服务器所需的设施支持也较少。如果四台服务器托管在一台物理服务器上，其所需的物理空间就少于五台物理服务器所需的空间。此外，这台物理服务器消耗的电力更少，对空调的需求也比五台物理服务器低。\n\
  \n### 温备场 (Warm Site)\n温备场 是冷备场和热备场之间的折中方案。它包含了所需的大或全部设备，但数据通常不会保持更新。设备维持在运行状态。如果发生灾难，将用当前数据更新系统并上线。\n\
  \n温备场通常是用于非关键业务功能的完全运行的站点。当灾难发生时，非关键功能将停止，该站点将用于关键业务功能。\n\n温备场的主要优点之一是管理层能够将预期成本与可接受停机时间相匹配，这意味着，如果较长的\
  \ `MAO`是可以接受的，管理层就可以平衡成本，以匹配启动温备场所需的时间。\n\n### 移动站点 (Mobile Site)\n移动站点 可以设置在靠近受影响站点的外部空间。移动站点的优势之一是可以在\
  \ 36 到 72 小时内就位。然而，它也有一些缺点。恢复时间通常比热备场长，访问受影响的设施可能困难，且运输移动站点设备可能是一个挑战。\n\n### 冗余备用站点\
  \ (Redundant Backup Site)\n另一种选择是外包数据恢复站点。公司无需维护备选地点，而是可以与第三方供应商签约，在冗余备用站点中托管其数据和服务。如果发生灾难，可以将关键服务切换到备选地点，这通常对运营的影响微乎其微。\n\
  \n全冗余备用站点具有托管所有数据和服务的能力，它们可以同时作为主环境和备用环境。在这种情况下，所有数据和服务都外包给第三方供应商的主场地。如果发生灾难，由供应商负责切换到备用环境。\n\
  \n### 用户访问 (User Access)\n如果业务迁移到备选地点，用户必须能够访问数据和服务。在这种情况下，他们获得访问所需的条件取决于他们如何使用这些数据和服务。\n\
  \n如果用户通过互联网访问服务，则备选地点必须包含具有所需带宽的互联网访问权限。然而，用户通常在内部或通过私有 `WAN` 链接访问服务。如果是如此，备选地点必须具备将数据传输给用户的能力，这可能需要额外的\
  \ `WAN` 链接。\n\n### 管理访问 (Management Access)\n管理层在灾难期间可能也需要访问数据和服务，在许多情况下，管理层仅代表了另一个用户。如果用户拥有访问权限，那么管理层也有访问权限。\n\
  \n然而，在某些情况下，管理层可能有特定需求，例如对时间敏感的数据。例如，如果接近财年结束，由于报告要求，管理层必须访问某些数据。必须识别这些特定的管理需求。当这些需求得到解决时，`DRP`\
  \ 可以满足它们。\n\n### 客户访问 (Customer Access)\n客户必须拥有他们所需的访问权限。客户访问需求因组织而异，取决于客户通常如何访问组织的网络，以及客户在灾难期间的预期是什么。\n\
  \n例如，对于当地银行，大多数银业务可以在银行现场完成。然而，今天越来越多的客户使用在线银行。如果发生灾难，客户可以使用在线站点满足许多银行业务。`DRP` 应确保即使重大中断影响了银行的物理位置，银行网站也能继续运行。\n\
  \n今天，许多组织都有网站，其中大多数组织外包了网站托管，这意味着网站并未托管在组织所在地的服务器上。相反，组织租用网络服务器空间，由托管提供商托管网站。在这个示例中，托管提供商负责灾难恢复。\n\
  \n然而，这并不意味着不应该考虑网站。如果灾难影响了网站托管供应商怎么办？这种情况将如何影响组织？低成本托管提供商通常没有的灾难恢复流程，轻微和重大中断经常会导致网站崩溃。\n\
  \n### 灾难恢复财务预算 (Disaster Recovery Financial Budget)\n`DRP` 需要考虑的最后一个 `CSF` 是资金。没有预算，`DRP`\
  \ 就无法成功开发和实施，因为需要资金来支付准备和执行。\n\n#### 预算考虑\n\n- **备份 (Backups)**：虽然大多数方案包含备份软件，但它通常只进行基础操作。此外，备份介质可能昂贵。\n\
  - **备选地点 (Alternate locations)**：任何类型的备选地点都会产生额外费用。站点的选择取决于可用预算。\n- **燃料 (Fuel)**：如果组织需要长时间发电，必须有人购买燃料。`BCP`\
  \ 识别了关键业务在没有支持的情况下需要持续多久。\n- **食物和水 (Food and water)**：如果人员在灾难期间需要支持系统，他们需要食物和水。数量取决于有多少人留在该地点以及预计他们停留多少天。\n\
  - **应急资金 (Emergency funds)**：灾难发生后往往需要资金来应对不可见的情况。预算应包含这些开支的资金，且这些资金必须是可用的。\n\n\
  除了建立预算，还需要确定可以释放资金的人员，对于灾难期间及之后之后所需的任何资金尤其是如此。这些人可以在 `DRP` 或 `BCP` 中确定。\n\n\n\n\n\
  \n*   **恢复**——灾难恢复（DR）人员将关键业务（CBFs）恢复到全面运行，这包括恢复设施资源（如电力）、连接性（如局域网 LAN 和广域网 WAN\
  \ 连接）以及支持 CBFs 的系统。\n*   **恢复正常**——灾难过去后，灾难恢复人员将系统恢复到正常运行，这可能包括从发电机切换回市电，并将功能从备用地点迁回主地点。\n\
  *   **休息与放松**——应急响应人员在事件发生后需要休息，并对他们帮助组织度过灾难表示感谢。\n*   **重新评估与重新记录**——识别做得好的地方和可以改进的地方。记录任何教训。审查计划中的任何弱环节或缺陷。使用这些数据更新计划。\n\
  \n灾难恢复计划（DRP）应该经过测试和维护。测试验证程序的有效性。此外，应定期审查和更新 DRP 以确保其时效性。以下章节将更深入地探讨这些要素。\n\n###\
  \ 目的\nDRP 起于一个识别其目的的简单声明。DRP 通常是为了支持某个功能、服务或系统而编写的。DRP 可能是为了在灾难后恢复单个数据库服务器的功能而编写的。它将包含故障后恢复数据库服务器所需的步骤。\n\
  \nDRP 也可以为了恢复多个共同工作托管服务的服务器而编写。例如，一个网站可能由多个元素支持，包括 Web 农场中的多个 Web 服务器和故障转移集群中的多个数据库服务器。如果灾难导致网站宕机，DRP\
  \ 将包含恢复或重建所有这些要素的步骤。\n\n无论何种方式，DRP 的目的都需要在过程早期定义并包含在最终产品中。在定义目的时，应考虑以下活动：\n\n* \
  \  **恢复**——服务中断立即发生后，系统应该是可恢复的，这包括在必要时完全重新构建系统以及恢复所有数据。`RTO` 定义了此过程应该花费的最长时间。\n\
  *   **维持业务运营**——即使在灾难期间，CBFs 也需要继续运行。可以使用几种方法来确保这些 CBFs 继续运行，可能包括完全冗余的数据中心、备用地点或冗余数据站点。使用的方法应符合服务需求和可用预算。\n\
  *   **归一化**——灾难过去后，系统需要进行归一化，这意味着取决于为了维持业务运营而所做的工作。例如，如果使用了备用地点，归一化就包括将 CBFs 迁回原始地点。\n\
  \n### 范围\n任何项目的范围都有助于识别边界。它帮助所有方理解哪些在范围内，哪些不在范围内。如果没有定义的范围，善意的人可能会导致项目增长和扩张，这通常被称为范围蔓延（scope\
  \ creep）。\n\nDRP 的目的驱动着范围。根据 DRP 的目的，可以识别应该包含的和不应该包含的要素。虽然包含的要素对某些人可能是显而易见的，但它们仍需要在\
  \ DRP 中进行标识。\n\n在制定范围时，应考虑以下领域：\n\n*   **硬件**——硬件包括支持它们所需的服务器和网络设备。替换服务器和支持设备（如办公设备或关键服务器的备件）应在现场或另一个地点可用。\n\
  *   **软件**——需要考虑所有支持 CBFs 的软件，包括操作系统和应用程序。许多组织使用镜像技术。一个 `image`（镜像）是计算机操作系统、应用程序、设置和其他文件的精确副本。IT\
  \ 人员每隔几个月可能会捕捉通用服务器的镜像。然后，当系统崩溃时，IT 人员可以使用此镜像快速恢复服务器运行。\n*   **数据**——数据考虑必须包含在计划的范围内。这些考虑包括备份计划，如果\
  \ CBFs 需要数据，则要识别备份需求。恢复点目标（`RPOs`）确定了可以接受的数据丢失量，这取决于数据的价值。\n*   **连接性**——与服务消费者的连接也应包含在内，取决于消费者是谁，可能包括用户、经理和客户的连接性。连接性可以是到互联网的冗余互联网提供商（ISP）链路或冗余\
  \ WAN 链路。\n\n### 灾难/紧急情况宣布\n当发生或即将发生紧急情况时，将实施 DRP。通常，首先激活整体业务连续性计划（BCP），然后根据 DRP\
  \ 的作用激活 DRP 以支持 BCP。\n\n例如，一场飓风正在接近。BCP 协调员可以在飓风在 96 小时后时激活 BCP。DRP 可能会规定，当飓风在 48\
  \ 小时后时，恢复团队部署到备用地点，准备系统接管运营。在这个例子中，DRP 并没有随着 BCP 立即激活。BCP 可能会指定立即采取的其他行动，但它们与此 DRP\
  \ 是分开的。相反，此 DRP 在飓风距离袭击还有 48 小时内被激活。\n\n点在于，DRP 需要明确说明其激活的原因。激活可能会导致人员的召集和设备的移动。当需要采取这些步骤时，再这样做。然而，在必要之前采取这些步骤会导致不必要的支出。\n\
  \n再次考虑飓风。飓风并不总是沿直线移动。距离袭击还有 96 小时的飓风很容易转向或减弱。如果没有飓风级的风，该地区可能只是下雨，在这种情况下，不应激活 DRP。\n\
  \n### 通信\n几个通信要素对 DRP 的成功至关重要。这些包括：\n\n*   **召集**——DRP 应该识别激活时应通知的所有人员。包括在 DRP 中承担任何职责的人员和高级管理人员。电话树通常作为\
  \ BCP 的一部分并用于此目的。\n*   **用户**——需要通知用户 DRP 是否影响了他们。例如，关键业务运营可能不包括用户期望常规功能。应该通知他们由于灾难哪些服务不可用。这种通知可以在灾难发生前进行。随后，可以向用户发送关于这些服务的提醒。\n\
  *   **客户**——如果中断影响了客户，应通知他们。例如，一个在线网站可能会移动到备用地点，导致其在短时间内宕机。网站可以发布一个页面，说明正在响应灾难实施\
  \ DRP，并说明网站将在特定时间内再次恢复运行。客户会理解并感激这一点。相比之下，如果网站无法访问并显示错误信息，则表明组织未对灾难做好准备。\n*   **通信计划**——DRP\
  \ 通常包含主备和备用通信计划，以确保人员在中断期间能够进行通信。这些计划可能是基于 IT 的（例如电子邮件或即时消息），也可以使用手机或对讲机。它们甚至可以包括在中心地点设立的“作战室”举行特定的会议时间，而不是使用电子通信。\n\
  \n#### 应急响应\n\n\n\n\n\nDRP（灾难恢复计划）可以包含一个针对突发灾害的应急响应要素。例如，地震会在毫无预警的情况下发生，龙卷风的预警时间也非常短。同样，火灾可能导致需要应急响应的灾难。\n\
  \n应急响应步骤可能包括：\n*   人员的召回与通知\n*   损害评估\n*   计划激活\n*   特定步骤和流程的实施\n\n根据组织所在地，DRP 可以针对特定的灾难进行编写。例如，美国东海岸的许多组织都制定了涵盖飓风的\
  \ DRP。该 DRP 将包含许多准备步骤，但应急响应步骤直到计划的较后阶段（即飓风袭击之后）才会出现。\n\n## 活动\n\n应急响应部分确定了几个需要采取的应急响应步骤，例如召回人员和评估损害。DRP\
  \ 还确定了应对灾难时需要采取的其他活动。\n\n任何 DRP 的首要活动是确保人员安全得到保障。确保人员安全和保护生命始终应该是任何 DRP 的首要任务。换句话说，明确的信息应该是`人`优先，`物`次。\n\
  \nDRP 中定义的活动取决于 DRP 的目的和范围。如果 DRP 针对单个系统的恢复，则活动是有限且集中的。如果它针对一个大型、复杂的系统，则需要更多的活动。\n\
  \n如果灾难有预先预警，活动可能包括准备环境。这在天气相关的事件（如飓风和其他严重风暴）中是可能的。然而，许多其他灾难并不提供任何预警。\n\n使用备选地点时，首要活动是准备备选地点。冷备（cold\
  \ site）的工作量最大。所有需要的设备都需要移动到备选地点、安装并配置，这将导致大量的准备活动。冷备的活动部分将非常详尽。\n\n另一方面，建立热备（hot\
  \ site）所需的活动是极少的。可以指派人员组成快速反应小组（flyaway team）前往热备站点接管运营。需要确定业务如何以及何时切换到热备站点。\n\n\
  温备（warm site）是热备和冷备之间的折中方案。启动并运行温备的活动取决于通常情况下在备选地点准备了多少设备和数据。如果温备更倾向于冷备而非热备，那么活动部分可能会非常详尽。移动站点也可能很贵，尽管比热备便宜。需要运输设备，且恢复时间通常比热备多几天。\n\
  \n### 恢复程序\n\n恢复步骤和流程描述了恢复系统或功能所需的所有特定操作。该部分通常包含多个流程。例如，每个关键功能都可以有一个单独流程。不同人员将恢复不同的系统，因此所有流程可以同时实施。\n\
  \n恢复程序还应考虑意外情况。例如，如果某些恢复步骤不起作用，流程应该为恢复人员提供指导。此外，流程应该处理依赖关系。如果服务器需要访问互联网或另一个服务器的特定权限，流程应当说明这些要求。\n\
  \n### 恢复系统\n\n恢复程序确定了灾难后重建和恢复系统的步骤。它们通常包括从零开始恢复系统的步骤，包括安装操作系统和所有应用程序。如果需要数据，计划将指定如何恢复数据。\n\
  \n例如，一个数据库服务器可能在 `Microsoft Windows Server` 操作系统上运行 `Oracle` 数据库。恢复程序将从安装 Windows\
  \ 操作系统的指令开始。安装之后，流程将描述如何安装 `Oracle`，最后，流程将描述如何恢复数据库。\n\n恢复计划应当明确在移动到下一个步骤之前必须完成哪些步骤。换句话说，在操作系统和应用程序成功安装之前，不应将数据恢复到服务器上。\n\
  \n### ![](img/Tip.png)提示\n\n恢复操作在激活 DRP 并评估损害后开始。恢复侧重于恢复 IT 能力和修复损害的必要措施。目标是在原始位置或备选地点恢复关键任务的能力。\n\
  \n对托管 `Oracle` 的服务器进行镜像（image）是可能的。如果服务器崩溃，可以将镜像安装到系统上。它将包含操作系统、完全配置的 `Oracle` 应用程序以及捕获镜像时系统中的数据。IT\
  \ 人员必须从最近的备份中更新数据。恢复镜像比从零开始重新安装一切快得多。\n\nDRP 可以包含针对多个服务器和服务的特定恢复程序。可以为每个程序创建单独的书面文档。DRP\
  \ 可以引用这些程序作为独立的附录。\n\n这些程序是 DRP 中需要测试的最元素之一。尽管 DRP 中的许多步骤在性质上可能是通用的，但这些恢复程序通常具有很的技术性。\n\
  \n### ![](img/Tip.png)提示\n\n如果服务器已经有了镜像，可能需要定期重新捕捉镜像。例如，如果操作系统或应用程序已更新或修改，原始镜像将不会包含这些更改。必须在更改后重新捕捉镜像，或者必须在镜像恢复到服务器后验证更改已重新应用。\n\
  \n在灾难期间，优秀的管理员可能不在。相反，初级技术人员可能恢复系统。考虑到这一点，确保程序步骤清晰易于遵循。\n\n### 备份计划\n\n如果需要恢复数据，必须有一个有效的备份计划。制定备份计划的第一步之是识别关键数据。关键数据是支持\
  \ `CBFs` 的数据。此类数据可以是大型数据库或任何其他关键文件。\n\n备份计划确定了几个元素，包括：\n*   要备份的数据\n*   数据的备份程序\n\
  *   保留数据的时间\n*   备份类型，例如定期备份、电子金库备份或远程日志记录\n*   异地存储位置，包括在灾难期间如何检索备份\n*   恢复程序和计划的测试\n\
  *   灾难恢复程序\n\n`RPOs` 确定了任何数据允许的数据丢失量。因此，备份计划中考虑了 `RPO`。如果 `RPO` 是一个很短的时间（例如几分钟而不是小时或几天），则必须更频繁地执行备份。如果\
  \ `RPO` 时间较长，则可以减少备份的频率。\n\n例如，对于高量数据库，`RPO` 可以是 10 分钟，表示接受超过 10 分钟的数据丢失。每 10 分钟备份一次数据库事务日志，以确保可以恢复最后\
  \ 10 分钟的数据。该事务日志备份在其他数据库备份恢复后进行恢复。\n\n### 关键任务操作\n\n\n\n\n\n业务恢复计划（DRP）针对的是关键任务业务。关键业务功能（CBF）支持这些业务，而特定的服务器和服务支持这些\
  \ CBF。由于 CBF 是任何被认为对组织至关重要的功能，如果组织失去了执行 CBF 的能力，就会失去执行关键任务业务的能力。通过处理 CBF，DRP 有助于确保关键服务器和服务的持续运行。\n\
  \n### 提示\n\nDRP 确保关键数据拥有备份计划。然而，组织可能拥有保护组织内其他数据的备份计划。\n\n例如，图 14-5 显示了一个连接到后端数据库的\
  \ Web 服务器群。该集群中的 Web 服务器托管了一个在线销售产品的应用程序。在这个示例中，关键任务业务是产品销售。\n\n![图 14-5 带有后端数据库的\
  \ Web 服务器群](img/9781284183719_CH14_FIGF05.png)\n\n**图 14-5** 带有后端数据库的 Web 服务器群。\n\
  \n多个 CBF 支持产品销售。首先，Web 服务器群托管了 Web 应用程序。一个 CBF 负责为客户端提供网页服务。用户访问网站，Web 服务器群中的一台服务器向客户端发送网页。此外，后端数据库服务器托管着数据库，包括产品数据库。Web\
  \ 服务器查询数据库服务器，并在网页中填充产品数据。\n\n一旦客户决定购买，另一个 CBF 就会介入。将从客户数据库中检索现有的客户数据。数据库在销售后还会存储新客户数据。一旦客户购买了产品，另一个\
  \ CBF 将处理支付流程。另一个 CBF 则负责确保产品发货。所有这些 CBF 都支持产品销售这一关键任务业务。\n\n图 14-5 显示，需要几台服务器来支持其中一些\
  \ CBF。具体来说，Web 服务器群中的 Web 服务器和后端数据库服务器都是需要的。DRP 将确保这些服务器被包含在内。\n\n### 关键业务、客户服务与业务恢复\n\
  \nDRP 识别关键任务业务和需要支持的 CBF。然而，为业务的其他要素指定步骤通常也很重要。\n\n例如，当灾难发生时，客户服务活动会停止吗？或者，客户服务活动会迁移吗？如果通过电话提供客户服务，这些功能可以轻松切换到另一个位置。另一方面，如果组织很少提供客户服务，它可能不会认为在灾难期间进行恢复足够重要。可以为客户提供简单的通知。例如，可以在组织的网页上发布通知，或在电话系统中录制一条短消息。\n\
  \n同样，公司可能还有其他需要恢复的业务，这些业务不一定被视为任何 CBF 的一部分，但管理层可能仍认为它们足够重要而需要恢复。例如，某些人员可能正在从事关键研究项目。虽然这些研究对于目前的现金流至关重要，但管理层可能希望确保其能够继续运行。在这种情况下，研究所需的系统和服务将需要恢复。\n\
  \n本节还可以对正常业务提供另一个视角。在准备 DRP 期间，应该审查哪些被视为 CBF，哪些不是。某些操作看起来是至关重要的，但在查看日常活动时最初可能被排除在\
  \ DRP 之外，结果它们确实被遗漏了。这些操作应该被添加进来。\n\n### 恢复与正常化\n\n一旦灾难过去，人员会将注意力转移到恢复和正常化。某些 DRP\
  \ 将此称为重组阶段。业务连续性计划（BCP）协调员通常是宣布何时开始正常化的权威。它可能在原始位置的损坏修复后开始。管理层也可能根据其他考虑决定提早开始正常化。\n\
  \n人员在此阶段将所有关键任务和非关键任务功能恢复到正常。然而，这些功能并非同时完成的。DRP 规定了它们发生的顺序。\n\n在正常化阶段，可以预见到不可预的问题。由于这些问题，首先恢复最不关键的功能是重要的，特别是当功能被移动到另一个位置时。这样做可以确保在问题出现时，最关键的功能不会受到中断。\n\
  \n在某些情况下，DRP 可能要求并行处理。例如，当关键功能在主位置正常化时，恢复的系统在备用位置保持运行。如果问题影响了主位置，负载可以很容易移回备用位置。\n\
  \n### 测试\n\n测试 DRP 对于确保其按预期运行非常重要。由于 DRP 是为了恢复 CBF 而编写的，因此 DRP 的测试不应影响 CBF 的运行。测试的目标是识别\
  \ DRP 中的任何问题或遗漏。\n\n与 BCP 类似，可以使用不同的方法来测试 DRP。以下是常见的测试方法：\n\n*   **桌面演练**——在桌面演练中，参与者在会议环境中会合。参与者讨论\
  \ DRP 的步骤。桌面演练类似于 BCP 中使用的桌推演练。\n*   **模拟**——模拟以受控的方式执行各个步骤和程序。目标是确保 DRP 能按照所述的顺序完成。模拟可以测试\
  \ DRP 的部分内容而不测试全部。例如，可以只恢复备用位置的数据以确保此程序有效。\n*   **全方位 DRP 测试**——全方位 DRP 测试将像发生实际灾难一样执行所有步骤和程序，并有助于确定完成每个步骤和程序所需的实际时间。全方位\
  \ DRP 测试最有可能干扰业务运行。因此，应该计划进行全方位测试，以使其对业务的影响降至最低。\n\n所有测试的结果都应该进行详尽记录，并包括测试期间发现的任何教训、错误或弱点。这些文档随后可用于改进\
  \ DRP。如果测试识别出任何缺陷，通常会更新 DRP。\n\n测试的益处之一是它将提供准确的恢复时间范围。例如，对于数据库服务器，一位管理员可能认为技术人员可以在\
  \ 30 分钟内重建并恢复它，而另一位管理员可能估计需要长达四个小时。实际上，重建和恢复服务器将给出一个准确所需的时间。清单对于跟踪各个步骤的时间范围很有帮助。清单的形式可能类似于表\
  \ 14-2。\n\n**表 14-2** 恢复时间清单\n\n| 步骤 | 开始时间 | 结束时间 |\n| --- | --- | --- |\n| 定位服务器并安装操作系统\
  \ | | |\n| --- | --- | --- |\n| 在服务器上安装应用程序 | | |\n| --- | --- | --- |\n| 找到备份带并恢复数据\
  \ | | |\n| 通知 DRP 协调员已完成 | | |\n\n### 维护与 DRP 更新\n\nDRP 需要定期审查和更新。这样做可以确保它在需要时可用。IT\
  \ 系统会定期更新和升级，这些任何变化都可能影响 DRP 的可用性。\n\n\n\n\n\n-   **系统**——验证灾难恢复计划（DRP）涵盖的系统自上次审查以来未发生更改。这些更改包括任何可能影响系统恢复方式的重大变更。即使是较小的更改也应进行调查，以确定是否对\
  \ DRP 影响。\n-   **关键业务功能**——验证 DRP 涵盖了关键业务功能（CBFs），且优先级没有发生变化。组织可能会发生变化，导致某些关键业务功能比其他更重要。\n\
  -   **备用站点**——如果 DRP 需要备用站点，请确保指定的站点仍然支持 DRP，并且备用站点的变更不会对 DRP 产生不利影响。如果可能，在审查 DRP\
  \ 时应该访问这些备用站点，以确定它们是否仍然满足公司的需求。\n-   **联系人**——联系信息必须准确。联系信息包括需要通知的管理人员的联系方式，以及电话树中使用的召回信息。\n\
  \n与其他文档一样，跟踪 DRP 的更改至关重要。DRP 应该包含一个变更页面或版本控制页面，用于识别变更内容、更改时间以及执行人。\n\n### 注意事项\n\
  \n`phone tree`（电话树）是一种便于呼叫大量人群的方法。电话树是一个金字塔形状的联系列表。首先，顶端的人拨给几个人，然后这些人每个人再拨给分配给他们的几个人。这个过程一直持续，直到所有联系人都收到通知。\n\
  \n### DRP 如何降低组织的风险？\n\nDRP 通过减小灾难的影响来降低风险。灾难（如地震、龙卷风或飓风）是威胁，这种威胁无法无法的。然而，通过做好准备可以减少威胁的影响，DRP\
  \ 有助于进行这种准备工作，以减轻短期和长期损害。\n\n例如，DRP 可以帮助缩短灾难后的停机时间。建立了 DRP 的组织比没有 DRP 的组织能够更轻松地处理灾难。当然，DRP\
  \ 的存在并不保证成功。\n\n有了灾难恢复计划，公司将为恢复关键业务功能做好更充分的准备。冷备（cold site）在规划阶段需要大量工作来搭建。所有设备都必须移动、安装和配置。通过额外的资源和预计划，公司可以计划使用热备（warm\
  \ site）。然而，如果没有计划，工作量将增加一倍。\n\n除了没有 DRP 恢复更加困难外，还会遇到更多的错误和问题。DRP 有助于并在问题发生之前对其应用批判性思维，并鼓励逻辑性地思考应该做什么来尽量减少这些问题。可以咨询专家帮助解决问题，并对计划进行测试。如果没有\
  \ DRP，公司将在没有任何这些收益的情况下被抛到危机的中心。运气的话，灾难不会破坏业务。但是，大多数高管并不希望依赖运气。\n\n###为组织实施 DRP 的最佳实践\n\
  \n在实施 DRP 时，可以采取若干最佳实践。以下是其中许多最佳实践的列表：\n\n-   **确保 BIA 已完成**——BIA（业务影响分析）识别关键业务功能，这些功能被用于识别关键业务操作以及关键的服务器和服务。\n\
  -   **从明确的目的和范围开始**——目的和范围声明有助于确保 DRP 保持专注。当采取 DRP 范围之外的步骤和程序时，会浪费资源。\n-   **定期审查和更新\
  \ DRP**——DRP 应至少每年审查一次。如果 DRP 涵盖的关键系统发生更改，则应审查 DRP 以确定更改是否影响了它。\n-   **测试 DRP**——测试确保\
  \ DRP 可以按预期实施。在测试 DRP 时，不应影响正常运行。\n\n使用清单通常是值得的，以确保所有相关问题都得到解决。以下清单可以在创建 DRP 之前、期间和之后使用，以识别公司的准备情况：\n\
  \n-   组织的 BIA 是否为最新的？如果 BIA 已经超过一年，必须首先更新它。\n-   自 BIA 完成以来，任何被 BIA 涵盖的系统是否发生了更改？如果是，则需要修订\
  \ BIA。\n-   是否定义了关键业务功能？是否清楚哪些系统需要优先恢复？\n-   DRP 是否规定了为关键业务功能提供的服务水平？换句话说，如果业务在灾难期间必须继续运行，DRP\
  \ 是否识别了哪些服务需要恢复？\n-   是否分配了具体的职责？部门或个人是否知道在紧急情况下不同阶段对他们的期望是什么？\n-   是否清楚应该恢复哪些硬件、软件和数据？DRP\
  \ 是否包含了支持关键业务功能所需的任何支持设备？\n-   DRP 是否包含备份计划？该备份计划是否包含用于测试恢复的测试元素？DRP 是否包含用于数据恢复的步骤？\n\
  -   备份是否存储在异地？如果发生灾难，异地备份是否易于访问？\n-   是否有通信计划？它是否有替代的通信方法？\n-   是否需要备用站点？想要什么类型的备用站点？预算允许购买理想的站点吗？\n\
  -   是否考虑了设施需求？此类别包括 UPS、备用电源以及空调系统。\n-   是否处理了支持服务？例如，如果需要备用发电机，现场是否有足够的燃料在灾难期间支持组织？是否有足够的食物和水供现场使用？\n\
  -   人员是否接受过 DRP 培训？他们是否知道在灾难发生前、期间和发生后的职责是什么？\n-   DRP 是否经过了测试？程序是否经过测试以确保按预期工作？\n\
  -   DRP 是否至少每年审查一次？当其内容受到影响时是否进行了更新？\n\n## 章节总结\n\n本章涵盖了使用灾难恢复减轻减轻的重要要素。它定义了 DRP\
  \ 及其目的。若干因素对 DRP 的成功至关重要。管理层必须提供资源和领导。DRP 开发人员需要理解灾难恢复概念和组织运作方式。DRP 必须解决几个主要问题。RTO（恢复时间目标）识别了关键业务功能必须恢复运行的时间。必要时，关键业务功能可以移动到替代位置。热站点可以在几分钟或几小时内使用，但实施成本最高。冷站点只是具有电力、水和其他设施支持的建筑。它是最便宜的但也最难测试。暖站点是两者之间的折中。移动站点是位于受影响设施附近的站点。另一个关键成功因素是预算。DRP\
  \ 必须有资金才能成功。\n\nDRP 可以包含不同的要素。从目的范围声明开始是常见做法，以确保各方都清晰。识别范围有助于范围蔓延。DRP 将包含具体的步骤和程序。当灾难发生时，使用\
  \ DRP 中的步骤和程序恢复系统。DRP 应该经过测试以验证其按计划工作，并需要定期以及根据更改进行更新。\n\n### 核心概念和术语\n\n-   业务连续性计划\
  \ (BCP)\n-   业务影响分析 (BIA)\n-   云计算\n-   冷备\n\n\n\n\n\n- 关键成功因素 (CSF)\n- 灾难恢复计划 (DRP)\n\
  - 热备地\n- 最大可接受中断时间 (MAO)\n- 最小业务连续性目标 (MBCO)\n- 移动站点\n- 恢复时间目标 (RTO)\n- 虚拟化\n- 温备地\n\
  \n# 第 14 章 评估\n\n1. `\\_\\_\\_\\_\\_\\_\\_\\_` 是一种用于在发生中断或灾难后恢复关键业务功能运行的计划。\n\n\
  2. `DRP` 有多个目的，包括拯救生命、确保业务连续性以及在灾难后进行恢复。\n   - 正确\n   - 错误\n\n3. 灾难恢复和容错能力是同一回事。\n\
  \   - 正确\n   - 错误\n\n4. `\\_\\_\\_\\_\\_\\_\\_\\_` 是成功所必需的要素。例如，`DRP` 的成功取决于管理支持和灾难恢复预算等要素。\n\
  \n5. 业务影响分析 (`BIA`) 包含一个最大可接受中断时间 (`MAO`)。`MAO` 用于确定系统必须恢复的时间。在 `DRP` 中用什么术语来代替\
  \ `MAO`？\n   - 关键业务功能 (`CBF`)\n   - DRP 行项 (`DRPAI`)\n   - 恢复行动项 (`RAI`)\n   - 恢复时间目标\
  \ (`RTO`)\n\n6. 某个 `DRP` 涵盖了一个托管大型数据库的系统。为了确保数据被复制到异地，可以使用什么？\n   - 数据复制\n   - 电子保险库\n\
  \   - 远程日志\n   - 以上所有\n\n7. 备份的副本应存储在 `\\_\\_\\_\\_\\_\\_\\_\\_`，以确保组织能够从主地的灾难性事故中生存。\n\
  \n8. 正在为 `DRP` 考虑备选地点，并且需要将成本最低。会选择哪种站点？\n   - 冷备地\n   - 温备地\n   - 热备地\n   - 移动站点\n\
  \n9. 正在为 `DRP` 考虑备选地点，且必须尽快上线。会选择哪种站点？\n   - 冷备地\n   - 温备地\n   - 热备地\n   - DRP 站点\n\
  \n10. 正在为 `DRP` 考虑备选地点，且该地是一个运行非关键业务功能的业务场所。该地点已拥有大部分所需的设备。这是哪种站点？\n    - 冷备地\n\
  \    - 温备地\n    - 热备地\n    - DRP 站点\n\n11. 哪些要素通常包含在 `DRP` 中？\n    - `BCP`、`BIA`、通信和恢复程序\n\
  \    - `BCP`、备份计划和恢复程序\n    - 目的、范围、通信和恢复程序\n    - 目的、范围、`CIRT` 激活和恢复程序\n\n12. 正在考虑将热备地作为备选地点。还在考虑各种技术以保持数据更新并缩短热备地上线所需的时间。哪些技术可能有帮助？\n\
  \    - 数据复制\n    - 云计算\n    - 虚拟化\n    - 以上所有\n    - 仅 A 和 B\n\n13. 在以下内容中，什么对任何\
  \ `DRP` 都是关键的？\n    - 第三方备份软件\n    - 预算\n    - 备选地点\n    - 发电机燃料\n\n14. 一个组织已经创建了\
  \ `DRP`，但尚未测试。可以使用以下哪种方法进行测试？\n    - 桌面测试\n    - 模拟测试\n    - 完整的 `DRP` 测试\n    -\
  \ 以上所有\n\n15. 一旦创建了 `DRP`，就不需要更新。\n    - 正确\n    - 错误\n\n![© Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n\
  © Sai Chan/Shutterstock\n\n## 通过计算机事件响应团队计划缓解风险\n\n# 第 15 章\n\n计算机安全事件可能导致数据或服务的机密性、完整性或可用性丢失。攻击者会发起攻击，事件也会发生。然而，组织可以通过配备计算机事件响应团队\
  \ (`CIRTs`) 来做好准备。这些团队经过训练，并具有减少攻击所造成损害的知识和专业技能。他们的行动受到 `CIRT` 计划的指导。\n\n`CIRT`\
  \ 计划的首要目的是帮助组织为事件做好准备并减轻损害。该计划确定了角色和职责，并包含了与事件相关的策略声明。\n\n### 第 15 章主题\n\n本章涵盖以下主题：\n\
  * 什么是计算机事件响应团队 (`CIRT`) 计划\n* `CIRT` 计划的目的是什么\n* `CIRT` 计划的要素是什么\n* `CIRT` 计划如何缓解组织的风险\n\
  * 实施 `CIRT` 计划的最佳实践是什么\n\n### 第 15 章目标\n\n完成本章后，你将能够：\n* 定义 `CIRT`\n* 定义 `CIRT`\
  \ 计划\n* 描述 `CIRT` 成员的角色和职责\n* 描述 `CIRT` 策略\n* 定义计算机事件\n* 描述事件处理流程\n* 描述通信程序\n* 描述事件处理程序\n\
  * 描述 `CIRT` 计划如何缓解组织的风险\n* 列出实施 `CIRT` 计划的最佳实践\n\n## 什么是计算机事件响应计划？\n\n计算机事件 是安全策略或安全实践的违反或威胁。它包括任何影响计算机系统或网络安全的事件或活动，并可能导致机密性、完整性或可用性的丢失。\n\
  \n### 提示\n*计算机事件*和*计算机安全事件*相同，可以互换。例如，某些组织使用安全事件响应团队 (`CSIRTs`) 和 `CSIRT` 计划，而不是计算机事件响应团队\
  \ (`CIRTs`) 和 `CIRT` 计划。\n\n### 注意\n有时会用 `CERT`（正式为计算机应急响应团队的缩写）代替 `CIRT`。`CERT^`\
  \ 是注册商标，指联邦资助的 CERT 协调中心 (`CERT/CC`)。`CERT/CC` 是卡内基梅隆大学 (`CMU`) 的一部分。\n\n`CERT/CC`\
  \ 不同于美国国家 CERT (`US-CERT`)，后者负责协调网络攻击的防御和响应。如果一个组织使用 `CERT` 术语，则侵犯了 CMU 的商标权。\n\n\
  \n\n\n\n-   **拒绝服务 (DoS) 攻击**——DoS 攻击是一种阻止系统提供服务的攻击。DoS 攻击来自单个攻击者。分布式拒绝服务 (DDoS)\
  \ 攻击则来自多个系统。\n-   **恶意代码**——恶意代码是任何类型的恶意软件或恶意软件，包括病毒、蠕虫、特洛木马和其他旨在感染系统的软件。正在复制并对计算机造成危害的病毒和其他其他恶意软件被称为“野外活跃（in\
  \ the wild）”。\n-   **未经授权的访问**——每当攻击者能够在未经授权的情况下访问数据时，就发生了未经授权的访问。未经授权的访问可以通过不同类型的社会工程攻击以及用于获取系统访问或控制的技术攻击来实现。未经授权的访问通常会导致机密性丢失。\n\
  -   **不当使用**——当员工或内部用户违反可接受使用政策（AUP）或其他内部政策时，就会发生不当使用。这可能只是用户访问了 AUP 中识别为禁止的恶意网站、用户将专有数据从安全系统复制到不安全的系统，或者用户在\
  \ AUP 禁止的情况下在其系统上安装了点对点（P2P）软件。\n-   **多组件**——多组件是指同时包含两个或多个事件的事件。例如，恶意软件可以感染系统，然后被用于对其他系统发起\
  \ DoS 攻击。\n\n计算机事件响应小组 (CIRT)是一组响应事件的人员。CIRT 团队可以提前指定，也可以根据需要组成。例如，大型组织可能会指定一组安全专业人员作为\
  \ CIRT。当事件发生时，CIRT 负责响应。较小的组织可能没有正式的 CIRT。相反，当事件发生时，信息技术（IT）专业人员作为非正式 CIRT 响应事件。\n\
  \nCIRT 计划是一份概述组织对计算机事件响应措施的正式文档。它正式定义了安全事件，并可能指定 CIRT 团队。以下章节概述了 CIRT 计划的目的和要素。\n\
  \n### CIRT 计划的目的\n\nCIRT 计划的目的是帮助组织识别并准备计算机事件。安全人员随后可以确定最佳响应措施以减少潜在损害。\n\nCIRT 计划的目的与灾难恢复计划\
  \ (DRP)的目的相似。通过花时间制定计划，可以对潜在问题应用批判性思维，寻求专家的建议，并研究最佳响应类型。\n\n然而，如果没有计划，当事件发生时，响应人员将无法获得这些好处，这导致他们别无选择，只能使用试错法。这些即兴技术可能会成功，但另一方面，它们可能允许攻击者继续并对组织造成极大的损害。\n\
  \nCIRT 计划概述了响应工作的目的，通常来说是尽可能完整地识别事件然后将其遏制。回答“五个 W”（5 Ws）是一个很好的起点。它们是*什么*(what)、*何处*(where)、*谁*(who)、*何时*(when)和*为什么*(why)。为了保险起见，还可以添加它是*如何*发生的。\n\
  \n**什么*识别了发生了什么类型的攻击。可能是 DoS 攻击、恶意软件攻击、未经授权的访问或不当使用。了解发生了什么有助于确定影响并优先考虑响应方案。CIRT\
  \ 计划通常包含确定攻击影响和优先级的工具。\n\n接下来，*何处*识别了攻击发生的地点。在至少一个发出警报的系统中，症状是明显的。然而，还应该检查其他系统以查看它们是否受到影响。如果影响了多个系统，可能需要重新评估影响和优先级。\n\
  \n### ![](img/Note.png) 注意\n\n本章稍后出现的“事件处理程序”部分展示了确定事件影响和优先级的工具示例。表 15-1 显示了影响定义的示例，表\
  \ 15-2 显示了关键性定义的示例，表 15-3 显示了事件影响评级的示例。\n\n如果可能，应该识别*谁*发起了攻击。确定是谁发起攻击的一种有效方法是检查日志。可以检查系统的审计日志以及防火墙和路由器日志。如果用户通过了身份验证，日志将识别出用于攻击的用户账户。如果攻击来自外部源，日志将识别出外部互联网协议\
  \ (IP) 地址，可以阻止该地址以停止攻击。\n\n### 技术贴士\n\n攻击者经常劫持其他系统来发动攻击。例如，控制僵尸网络的攻击者向僵尸发送命令，然后由僵尸发起攻击；或者攻击者可以只需到处寻找直到找到一个开放的无线网络，攻击者随后可以使用该网络发动攻击。追溯到该无线网络的攻击不会识别实际攻击者，但会识别出无线网络。等到攻击追溯到\
  \ IP 地址时，实际攻击者早已离开。\n\n识别攻击发生的*何时*远比识别发现症状的时间要得多。攻击者在攻击之前通常会进行侦察，日志条目可能显示侦察攻击在过去一周内从同一源发生过多次。\n\
  \n回答*为什么*攻击者攻击有助于理解他们的动机。过去的攻击者往往是因为无聊而攻击的；他们这样做的原因就像乔治·马洛里（George Mallory）想爬埃穆玛峰的原因一样——“因为在那里”。然而，今天的攻击者通常受贪婪驱动，因此他们偷取可以兑换现金的数据。\n\
  \n### 事件的增长\n\n1988 年 11 月，当莫里斯蠕虫袭击时，计算机受到攻击的消息了新闻。CMU 成立了 CERT 进行响应，并开始统计事件。\n\n\
  图 15-1 显示了多年事件的增长。1988 年发生了 8 次事件；1998 年为 3734 次；2003 年为 137529 次。CMU 的 CERT 上一次报告事件数量是在\
  \ 2003 年。如果今天仍在统计和报告事件数量，数字将超出图表。除非计算机不开启或完全隔离，否则它就会受到攻击。\n\n![图 15-1 CERT 跟踪的事件历史](img/9781284183719_CH15_FIGF01.png)\n\
  \n**图 15-1** CERT 跟踪的事件历史。\n\n\n\n\n\n最后，必须确定攻击是如何发生的，这反过来有助于识别被攻击系统中所存在的漏洞。一旦确定了攻击是如何成功的，就可以确定未来如何防止此类事件发生。换句话说，识别攻击成功的原理有助于识别防止未来攻击的控制措施或对策略。\n\
  \n### CIRT 计划的要素\n\n不同 CIRT 包含的要素可能有所不同。然而，一个 CIRT 通常包括有关 CIRT 组成的信息、策略信息，以及通信方法和事件响应程序的详细说明。以下章节概述了这些常见要素。\n\
  \n### 注意 ![](img/Note.png)\n\n本节并非意在说明这些是 CIRT 计划的唯一元素，也不是为了说明这些元素必须存在。CIRT 计划将满足特定组织的需求，而不同组织之间存在差异。\n\
  \n### CIRT 成员\n\n虽然 CIRT 计划确定了 CIRT 成员，但这些成员很可能参与了计划的制定。CIRT 成员包括 IT 和安全专业人员，他们了解威胁网络和系统的风险。在开发\
  \ CIRT 时，确定团队成员的角色、责任和问责制至关重要。\n\n可以使用不同的模型来开发 CIRT。美国国家标准技术研究院（NIST）定期发布特别出版物（SPs）。`NIST\
  \ SP 800-61 Rev. 2` 识别了以下团队模型：\n\n* **中央事件响应团队**——单一地点的组织可以使用单一团队来响应所有事件。一个团队甚至可以覆盖多个地点，所有成员都对所有地点地有远程访问权限。如果需要，他们还可以随时提供外勤支持（flyaway\
  \ support）。\n* **分布式事件响应团队**——如果组织在多个地点拥有主要的计算设施，可能会选择在每个地点设置一个团队，并对所有团队进行集中管理。例如，如果组织有多个区域地点且每个地点都有团队，总部的人员仍将对这些团队进行集中管理。\n\
  * **协调团队**——该团队包括富有知识的人员，为其他团队提供建议。团队成员对其他团队没有权限。然而，当偏远地区发生事件时，团队成员根据需要提供协助。\n\n\
  ### 注意 ![](img/Note.png)\n\n在计划中，CIRT 的成员通常通过头衔而非姓名来确定。\n\n### 角色\n\nCIRT 需要平衡的技能组合。总体目标是确保团队拥有来自组织不同领域的具有多种技能的成员。团队成员可能担任一个或多个角色。团队成员担任的一些角色包括：\n\
  \n* **团队负责人**——团队负责人负责团队的行动，通常是位具有安全专业知识的高级经理。然而，某些 CIRT 将团队负责人确定为第一个到达现场的团队成员。此人负责主管事件并指导其他成员的活动。\n\
  * **信息安全成员**——这些人员可能是边界保护方面的专家，包括网络边缘的防火墙和路由器。他们能够识别泄露源并建议解决方案。这些成员还可能是入侵检测系统（IDS）以及其他包含审计日志和审计跟踪的系统的专家。\n\
  * **网络管理员**——网络管理员了解网络的细节，例如哪些系统连接在一起、它们是如何连接的，以及哪些系统可以从 Internet 访问。他们了解正常的流量流，并能识别异常流量。\n\
  * **物理安全**——由于攻击者可能是社交工程人员，并可能出现在公司财产上，因此物理安全人员需要加入团队。他们了解组织使用了哪些物理安全控制措施及其位置和目的。他们还了解组织内部使用的不同类型的监控方法，例如视频摄像头及其功能。\n\
  * **法律**——法律人员在事件发生之前、期间和之后就组织的法律责任和法律救济措施提供建议。法律人员了解对攻击者可以采取哪些法律行动，以及采取法律行动所需的条件。\n\
  * **人力资源（HR）**——如果攻击源自员工，HR 需要参与，因为 HR 理解组织的政策并知晓可行的执行方法。例如，如果员工违反了 `AUP`，第一次违规可能导致正式书面警告，第二次或第三次违规可能导致解雇。HR\
  \ 人员会知道员工之前是否收到过警告。\n* **通信**——如果事件公开，公共公关（PR）人员将成为组织的门面。他们帮助呈现出坚决的形象，即使一切并不完全处于控制之中。如果不使用\
  \ PR  representative，团队成员可能会对攻击表示沮丧或困惑，这可能会给组织的客户、供应商和股东留下不好的印象。\n\n### 责任\n\nCIRT\
  \ 承担着若干责任，例如协助制定计划、响应事件和记录事件。团队的每个成员对团队都有特殊的技能和责任。然而，团队整体也有特定的责任。\n\nCIRT 的主要责任包括：\n\
  \n* **制定事件响应程序**——这些程序可以是对响应任何类型事件的通用程序，也可以是不同类型事件的详细清单。例如，恶意软件感染和 DoS 攻击可能各有自己的清单。\n\
  * **调查事件**——当事件发生时，CIRT 负责响应并调查事件。根据事件的优先级和影响，可能由单个团队成员响应。对于高优先级、高影响的事件，整个团队可能共同响应。\n\
  * **确定事件原因**——调查的目标之一是确定原因，因为通过理解原因，CIRT 能够更好地确定最佳响应。例如，用户从家里带了一个受感染的通用串总线（`USB`）闪盘。插入系统后，杀毒软件检测并隔离了它。因此，原因是用户通过\
  \ `USB` 驱动将病毒从家里带到了工作电脑。幸运的是，杀毒软件检测到了，但遗憾的是，某些病毒会绕过杀毒软件。这类事件导致许多组织在网络中禁止使用 `USB`\
  \ 闪盘。\n* **建议防止未来事件的控制措施**——CIRT 成员通常知道防止再次发生相同事件的最佳解决方案。即使他们他们不知道，他们也有专业知识和经验来识别控制措施，这可能仅仅是升级安全策略，也可能需要购买和安装硬件或软件。无论如何，CIRT\
  \ 成员都会提供建议。\n* **保护收集的证据**——证据在收集时不应被修改。例如，警察人员不会走在犯罪现场的血迹上，因为这样做会影响证据。同样，CIRT 成员不应修改证据，例如访问文件或关闭计算机，除非他们已经捕获了\
  \ RAM 内容（如果需要）。他们使用位拷贝工具复制硬盘，以在不修改数据的情况下获得完整副本。\n\n\n\n\n\n- **使用监管链**——CIRT 成员负责在收集证据后立即对其进行管理。`chain\
  \ of custody`（监管链）有助于确保稍后提交的证据与最初收集的证据是同一份。监管链应在扣押证据时建立，并在证据的整个生命周期内维护。监管链日志记录了在任何时刻谁拥有证据，以及证据何时被妥善存放在半永久存储地点中。\n\
  \n## 计算机取证\n\n计算机取证在几年中变得越来越流行。就像电视剧 `CSI` 中的法医专家可以从犯罪现场发现隐藏的细节一样，计算机取证专家也可以从计算机中发现隐藏的细节。\n\
  \n计算机取证调查通常分为三个阶段：\n\n- **获取证据**——在这一阶段，使用工具包在不修改数据的情况下捕获系统数据。例如，位位复制工具可以创建硬盘的完整镜像，而不会修改硬盘上的任何比特位。此外，为了防止数据被修改，第一响应人员不得访问任何文件或关闭系统。\n\
  - **验证证据**——通过监管链表单来跟踪证据，以证明数据在收集后受到了保护和控制，从而验证了证据的可靠性。如果未使用监管链，证据可能无法在法庭上采用，因为它被认为已受到污染。\n\
  - **分析证据**——在此阶段对数据进行检查和查看。如果数据包括磁盘上的文件，则对磁盘副本进行分析。如果需要验证原始数据，调查人员将从原始磁盘创建另一个副本并进行分析。\n\
  \n计算机取证是计算机专业人员领域一个不断发展的领域。许多 IT 专业人士扩展了他们的安全知识，成为计算机取证专家。\n\n任何组织的 CIRT 计划都可能规定上述职责，并可能根据其需求或预期列出\
  \ CIRT 的额外职责。例如，成员可能被要求订阅不同的安全公告或采取其他步骤以确保他们对当前风险保持关注。\n\n### 责制\n\nCIRT 还对组织负责，对任何事件提供主动响应。虽然事件无法避免，但预计团队将尽可能地减少任何事件的影响。\n\
  \n组织通常会在团队成员身上投入大量的时间和资金。目标是确保他们接受过培训并具备处理事件的能力。然而，严重事件并不常见，这并不意味着团队成员不经常考虑安全。团队成员需要保持对安全威胁和可能应对措施的关注，这需要每位团队成员的奉献。\n\
  \n### CIRT 政策\n\nCIRT 计划还包括 CIRT 政策。这些政策可能是简单的陈述，也包含在计划末尾的附中。它们为团队在任何事件过程中提供指导。\n\
  \n要考虑的首要政策之一是 CIRT 成员是否可以反击。换句话说，在调查事件期间，团队成员有机会对攻击者发动攻击。他们应该这样做吗？\n\n答案几乎总是坚定的否定。首先，可能存在法律后果。即使小偷偷了公司的东西，公司不能以此为借口偷窃他们的东西，因为如果公司被抓到，可能会被起诉。“但他先干的”这种辩护不会给法官留下好印象。同样，即使攻击者违反法律攻击了公司的网络，公司也没有理由违反法律进行反击。\n\
  \n如果公司进行反击，它还面临着加剧自身与攻击者之间事件的风险。例如，如果某人在繁忙的街道上撞碰了另一个人，他们都可以说“对不起”，事件就结束了。即使其中一人很无礼并故意撞击另一个人，如果被撞的人说“对不起”并离开，事件也就结束了。然而，如果被撞的人转身对对方挥舞手臂、推搡并大喊，事件就没有结束。相反，事件将升级为冲突，其结果取决于哪一方愿意给对方造成最大的伤害。\n\
  \n同样，如果攻击者攻击公司网络并失败了，他或她可能只是转向一个更容易的目标。然而，如果公司攻击了攻击者，事件将会升级。攻击者现在可能将公司的攻击视为个人恩怨，他或她将意图入侵网络并造成尽可能大的损害。\n\
  \n考虑到，考虑攻击者可能会花费多少工作时间进行攻击是值得的。如果涉及到个人利益（例如数百万美元），在短期内每天工作 12 小时或每周工作 80 小时是可行的。同样，如果攻击者对一个敢于反击的组织有个人私仇，他或她可能会投入所有的清醒时间来满足复仇之情。\n\
  \n简而言之，最佳实践是不将攻击升级为双边冲突。将任何报复留给执法部门。攻击者给组织造成的损害和成本可能比组织给攻击者造成的要得多，这使得组织没有理由引发更多的伤害。这并不是说组织应该永远不反击。警察、政府和军事机构可能拥有专门训练过攻击的特定部队，以收集犯罪活动的证据，或对政府的敌人进行有针对性的网络战。然而，如果这不是该组织的使命，请克制反击。\n\
  \nCIRT 中包含的其他政策可能还包括与证据、通信和安全相关的政策。调查期间收集的证据未来可能需要用于起诉。然而，存在特定的规则来规范证据的收集和存储，CIRT\
  \ 计划可以包含定义这些规则的政策。\n\n与媒体的沟通对于任何没有在这经验的人来说都是挑战性的。然而，CIRT 应该有一个公关人员。一个简单的政策可以规定，只有公关人员可以与媒体讨论任何事件。如果媒体查询其他人，回应是将其转给公关部门或特定的公关人员。\n\
  \n虽然计算机事件不像灾害（如飓风或地震）那样危险，但可能涉及危险。CIRT 计划通常规定人员安全是最，并且不要采取任何危害人员安全的行动。\n\n### 事件处理流程\n\
  \nCIRT 计划确定了事件处理流程，根据详细程度，这可能是计划的大部分。`NIST SP 800-61 Rev. 2，计算机安全事件处理指南`概述了事件的四个阶段。`FIGURE\
  \ 15-2` (#26_chapter15_03.xhtml#fig15-2) 将这四个阶段显示为事件响应生命周期。\n\n```\n![FIGURE 15-2\
  \ 事件响应生命周期。(Images/9781284183719_CH15_FIGF02.png)\n```\n\n**FIGURE 15-2** 事件响应生命周期。\n\
  \n`NIST SP 800-61 Rev. 2` 概述的四个阶段如下：\n\n- **准备**——准备工作包括创建 CIRT 计划、定义事件和创建 CIRT。团队成员接受了培训并有特定的角色和职责。他们知道如何识别、抑制和缓解事件。\n\
  - **检测与分析**——这一阶段使用各种控制措施来检测事件，包括 IDS 和防病毒软件。由于检测到的某些事件可能并非事件，因此需要对它们进行调查和分析，以确定它们是实际事件还是误报。\n\
  \n\n\n\n- **遏制、清除与恢复**——在检测到事件后，需要尽快对其进行遏制。这种遏制可以简单从受影响系统的网络接口卡（`NIC`）上拔掉电缆，从而移除攻击源。例如，如果系统感染了恶意软件，则应该对恶意软件进行隔离或删除。然后，系统就可以恢复正常运行。攻击通常包含多个元素。在清除一个元素后，通常必须重复检测和分析步骤。这一过程不断重复，直到确认所有恶意元素都已清除。在此之后，才会启动事后恢复阶段。\n\
  \n- **事后恢复**——此阶段包括事后审查，通过对事件和响应进行检查，以确定响应在哪些方面可以改进。如有必要，将相应地修改 `CIRT` 计划。\n\n对于任何类型的事件，准备阶段都是相同的，即组织内的人员花时间进行计划和准备。同样，事后恢复阶段对于任何事件都是相同的。然而，中间的两个阶段通常不同。以下章节将讨论不同类型的事件，并包括预防、检测和响应它们的方法。\n\
  \n### 处理 DoS 攻击事件\n\nDoS 攻击试图通过过度负载系统以消耗其资源，从而阻止系统或网络提供服务。任何系统都有四种主要资源：处理器、内存、磁盘和带宽。当这些资源正在响应攻击时，它们无法用于正常操作。\n\
  \nDDoS 攻击从多个系统发起，这些系统通常由僵尸网络控制。`图 15-3` 显示了多个被恶意软件感染的僵尸（或克隆计算机），它们现在由攻击者从命令与控制中心控制。当攻击者发布命令时，僵尸就会发动攻击。\n\
  \n![图 15-3 从僵尸网络发起的 DDoS 攻击](img/9781284183719_CH15_FIGF03.png)\n\n**图 15-3** 从僵尸网络发起的\
  \ DDoS 攻击。\n\n#### ![](img/Note.png)注意\n\n僵尸网络通常包含数万台计算机。网络犯罪分子管理僵尸网络并将访问权限租给其他犯罪分子。例如，攻击者可以租用权限对特定服务器发动\
  \ DDoS 攻击。\n\nDoS 攻击针对单个系统。有几个迹象表明正在发生 DoS 攻击，这些包括：\n\n* 用户报告系统不可用\n* `IDS` 对攻击的告警\n\
  * 受攻击系统的资源占用增加\n* 经由防火墙到达受攻击系统的流量增加\n* 未解释的连接丢失\n* 未解释的系统崩溃\n\n可以通过检查可用日志来确认怀疑的攻击。系统日志包含系统活动信息，防火墙日志可以显示发往系统的网络流量，而\
  \ `IDS` 收集的日志可以识别许多特定类型的攻击。\n\n响应取决于攻击的类型。如果攻击由于漏洞引起（例如未打补丁的系统），首要响应应该是修复漏洞，在这种情况下即为系统打补丁。许多攻击可以在网络防火墙处被拦截，其他攻击可以在系统防火墙处拦截。\n\
  \n许多 `IDS` 包含自动响应能力，例如更改防火墙规则以拦截特定类型的流量。例如，如果攻击是互联网控制消息协议（`ICMP`），`IDS` 可以拦截特定类型的流量。（注：此处原文存在大量重复语句，翻译已进行清理）。\n\
  \n![](img/Tip.png)提示\n\nNIST SP 800-83 Rev. 1，恶意软件事件预防与处理指南\n\n### 处理恶意软件事件\n\n\
  恶意软件事件是各种因素的结果，且每天出现。某些类型包括：\n\n* **病毒**——病毒附加到应用程序并执行。它们有三个阶段：复制、激活和目标。它们的首要目标是复制到其他应用程序，然后激活。\n\
  * **虫**——蠕虫是自我复制程序。它们不需要病毒样的宿主应用程序，但它们通常通过网络传播并安装病毒。\n* **移动代码**——移动代码包括在用户访问网站或打开电子邮件时执行的不同类型恶意软件。使用的某些语言和方法包括\
  \ Java、ActiveX、JavaScript 和 VBScript。\n* **木马**——木马看起来是有用的，但它包含恶意组件。例如，它可能看起来像游戏或屏幕保护程序，但也包含恶意软件。即使卸载了应用程序，某些木马仍会保持恶意软件安装状态。\n\
  \n### \n\n木马以希腊神话中的木马命名。这匹木马看起来是神灵送给特洛伊人的礼物，因此特洛伊人将木马推入城内，并日夜庆祝他们的好运。但当城内入睡时，隐藏的攻击者从木马中爬出来并打开大门让进攻军进入，从而迅速攻陷了特洛伊城。今天的教训与过去是一样的：警惕来自未知来源的礼物。\n\
  \n\n\n\n如果恶意软件感染了电子邮件服务器，在恶意软件被遏制之前，隔离该服务器是最佳做法。根据恶意软件的程度，这可能需要 IT 人人员关闭电子邮件服务器并对其进行重构。也可能意味着在移除恶意软件之前，简单地拔掉\
  \ `NIC` 上的电缆。\n\n此外，许多组织会配置网络浏览器和邮件阅读器以防止执行恶意移动代码。例如，Microsoft 域可以使用 `Group Policy`\
  \ 来配置网络中的所有系统。`Group Policy` 设置可以一次性，用以限制所有用户系统上脚本或未签名 ActiveX 控件的执行。\n\n### 处理未经授权的访问事件\n\
  \n当某人在没有获得授权的情况下获取资源访问时，就会发生了未经授权的访问事件。有时，未经授权的访问可能是意外获得的。例如，如果管理员授予了用户过多的权限，用户可能会偶然发现机密数据。然而，本节的重点是攻击者获取未经授权的访问，他们可以通过社会工程学或技术攻击来实现这一目标。\n\
  \n一旦获得访问权限，攻击者就会尝试利用它，通常通过使用权限提升技术来获取额外的访问权限。未经授权访问事件的示例包括：\n\n*   攻击并破坏网页服务器界面\n\
  *   从文件传输协议 (`FTP`) 服务器上传或下载数据\n*   未经许可使用无人值守的工作站\n*   在未经授权的情况下查看或复制敏感数据\n*  \
  \ 使用社会工程学技术收集组织数据\n*   猜测或破解密码并使用这些凭据登录\n*   运行数据包嗅探器（如 `Wireshark`）来捕获网络上传输的数据\n\
  \n此类攻击的大多数源于组织外部的攻击者。由于面向互联网的服务器最容易受到基于互联网的攻击，攻击者经常通过互联网访问服务器或其他内部资源。\n\n可以采取的基本保护步骤之一是确保所有服务器都经过了加固。加固服务器的步骤包括：\n\
  \n*   **减少攻击面**——如果不使用某些服务，则将其禁用。如果不使用某些协议，则将其移除。如果攻击者使用服务器上未安装的协议发起攻击，该服务器将受到保护。\n\
  *   **保持系统更新**——软件供应商发布补丁和更新，以消除导致安全漏洞的缺陷。必须定期应用这些更新以保护系统。\n*   **启用防火墙**——防火墙过滤所有流量，以确保不需要的流量不会到达易受攻击的系统。基于网络的防火墙为网络中的计算机提供一层保护，而基于主机的防火墙提供另一层保护。因此，应该启用两种类型的防火墙。\n\
  *   **启用 IDS**——`IDSs` 通过被动或主动方式检测攻击。被动 IDS 检测到攻击后提供通知，而主动 IDS 则可以修改环境并在任何损害发生之前阻止攻击者。\n\
  \n此外，基本的访问控制也提供了保护。这些控制确保所有用户在获取资源访问之前在网络上进行身份验证。此外，最小权限原则确保用户仅访问他们需要的数据，而不会更多。\n\
  \n如果没有用于网络身份验证的凭据，外部攻击者将无法成功获得访问。然而，他们缺乏访问权限并不能防止使用社会工程学策略，通过欺骗或诱导用户交出贵贵信息（如用户名和密码）来发现网络凭据，然后他们可以使用这些信息来发起攻击。\n\
  \n可以通过多种方法检测未经授权的访问事件。`IDSs` 通常会提供警告。`IDSs` 检测到攻击后提供通知，而主动 IDS 则可以修改环境并在任何损害发生之前阻止攻击者。例如，攻击者可能会扫描系统以确定哪些端口是开放的。如果端口是开放的，攻击者就会意识到关联协议可能正在服务器上运行。例如，如果端口\
  \ `80` 是开放的，那么超文本传输协议 (`HTTP`) 最可能运行在服务器上。\n\n\n\n\n\n用户接受政策（AUPs）通常限制 P2P 软件的使用，人们经常使用这些软件下载和分享盗版音乐、视频和应用程序。然而，P2P\
  \ 软件的主要问题之一是`data leakage`，即 P2P 软件在用户不知情的情况下共享用户数据的情况。例如，用户的计算机上可能存有个人数据文件（如密码或信用卡信息），而\
  \ P2P 软件可能包含保护这些文件的步骤。但如果用户不保护这些文件，P2P 程序可能会将这些文件与任何使用相同 P2P 程序的其他人共享。同样，如果用户的计算机上安装了\
  \ P2P 程序，该用户也可能共享专有数据。\n\n### 技术提示\n\n`anonymizer` 网站试图隐藏用户的活动。当用户访问匿名网站并通过该网站访问其他网站时，匿名网站会获取网页，但将其呈现得就像源于其本身一样。例如，用户可以通过匿名网站访问赌博网站，如果内部代理服务器跟踪了用户的活动，它将识别出来自匿名网站的流量，而不是来自赌博网站的流量。在许多组织中，仅使用匿名网站就被视为严重的违规行为。\n\
  \n可以通过多种方法发现不当使用事件，包括警报、日志审查和其他用户的报告。由于防火墙和代理服务器会记录所有通过它们的流量，因此可以对其进行扫描，以确定用户是否违反了策略。此外，还可以配置\
  \ `IDS` 来自动检测并报告禁止活动。\n\n许多组织还使用数据泄露防护（`DLP`）软件，管理员可以在其中配置与专有数据相关的关键词，并寻找个人身份信息（`PII`）。例如，社会安全码包含九个数字和两个横线。`DLP`\
  \ 扫描器可以查找匹配类似于 `###-##-####` 掩码的文本。它扫描进出网络的所有流量，并在检测到匹配项时发送警报。\n\n### “海军一号”直升机计划被伊朗共享\n\
  \n2008 年，一家政府承包商无意中向互联网上的所有人共享了新的“海军一号”直升机设计图，该直升机用于接送总统。\n\n该承包商在家和办公使用的计算机上安装了\
  \ P2P 应用。在某个时刻，“海军一号”直升机计划和其他秘密数据进入了承包商的计算机。该计算机的用户可能并没有意识到这一点，但 P2P 应用正在共享该计算机上的数据，其中包括带有“海军一号”计划的秘密数据。这是典型的数据泄露。P2P\
  \ 程序在用户不知情的情况下在系统上共享数据。\n\n私营公司 Tiversa 的人员于 2008 年夏天在互联网上发现了这些数据，并立即向承包商报告。随后，承包商通知了海军和白宫，Tiversa\
  \ 向所有方提供了其拥有的所有数据。接着，在 2009 年，相同的数据出现在伊朗的一台计算机上，这引发了新闻，Tiversa 再次发现并报告了它。\n\n请注意，尽管数据最早在\
  \ 2008 年夏天泄露，但直到 2009 年媒体才报道了这起泄露，这引发了一个问题：还有多少数据被泄露但未被新闻报道？2010 年，美国联邦贸易委员会警告企业和政府，由于通过\
  \ P2P 网络泄露了健康、财务和社会安全数据，面临数据泄露风险。因此，大多数组织禁止使用 P2P 软件，用户通常认为他们这样做是为了控制盗版。然而，真实原因是与数据泄露相关的极端风险。\n\
  \n另一种检测不当使用的方法是通过其他用户。例如，员工可能会收到另一位员工发送的垃圾邮件，广告业务或推广宗教，或者他们可能会在违规者的计算机上看到不当图像。当员工报告这些事件时，组织会做出响应。\n\
  \n主要的响应是基于现有策略的，当员工报告这些事件时，组织会做出响应。如果不存在策略，则组织可能需要创建策略。除了拥有策略外，还有是显而易见：它们必须被执行。\n\
  \n### 处理多重事件\n\n多重事件是指包含两个或多个单一事件，这些事件相互关联但并不总是明显的。例如，在多重事件的第一起事件中，用户收到一封带有恶意软件附件的邮件，打开后感染了该系统。恶意软件有三个目标。首先，它释放一个蠕虫寻找组织网络上的计算机并感染它们。这是第二个事件。接下来，恶意软件连接到管理\
  \ `botnet` 的服务器。在这种角色下，该组织的感染系统充当了 `zombie`。它等待 `botnet` 控制服务器的命令并执行其指令。由于该组织的感染系统感染了网络上的其他系统，多个系统很容易被感染，且每个系统都在寻找其他要感染的对象。它们也是\
  \ `botnet` 的成员。接下来，`botnet` 控制服务器向所有感染系统发出指令，让它们对互联网服务器发起攻击。感染网络中的僵尸随后攻击，这就是第三起事件。从被攻击服务器的角度来看，感染组织看起来正在进行攻击。被攻击方可能会查询感染组织的\
  \ `ISP` 并报告攻击。`ISP` 可能会威胁停止该组织的服务。请注意，`ISP` 的联系可能是感染组织出现问题的迹象，因为在之前问题可能并不显易见。\n\n\
  \n\n\n基于异常的入侵检测系统（IDS）可能会注意到网络上活动量的增加。它从正常活动的基准开始，当活动增加到超出设定的阈值之外时，IDS 就会对异常情况发出警报。\n\
  \n### 提示\n基于行为的 IDS 与基于异常的 IDS 相同。这两个系统都从正常活动的基准开始，并对其进行监控以及与入侵活动进行比较。\n\n当发现一个多组件事件时，必须识别其根源，在上述示例中，该根源是初始的恶意软件。如果可以移除根源，其他问题也可能被消除。然而，多组件事件中的任何一个单独的组件都可能独立运行，并引发另一起多组件事件。\n\
  \n## 通信升级程序\n\n当有人确定某个事件为安全事件时，他或她会宣布其为安全事件，这被称为升级（escalation）。宣布事件后的首要步骤之一是召回一个或多个\
  \ `CIRT` 成员，这可以通过电话树或任何其他传统的召回方式完成。\n\n但事件可能会恶化。例如，最初报告可能是单台计算机上的病毒，但 `CIRT` 成员可能会发现恶意软件正从邮件服务器传输到网络中的每个客户端。看起来像是个小问题，现在可能会变成灾难性后果。在这种情况下，`CIRT`\
  \ 成员可以升级响应级别，如有必要，组织可以激活整个 `CIRT`。\n\n在事件期间，通信非常重要，但可能会受到干扰。例如，电子邮件或即时消息系统可能无法使用。如果这些是主要的通信手段且没有备用计划，通信将变得具有挑战性。\n\
  \n## 组织的声誉\n\n组织外的通信也需要处理。如果媒体机构听到了事件，他们就会开始关注。在事件期间，通信非常重要，但可能会受到干扰。例如，电子邮件或即时消息系统可能无法使用。如果这些是主要的通信手段且没有备用计划，通信将变得具有挑战性。\n\
  \n（注：原文后续部分存在大量重复文本，已按要求完成翻译逻辑处理）\n\n在此情况下，`CIRT` 成员可以升级响应级别，如有必要，组织可以激活整个 `CIRT`。\n\
  \n这种影响。\n\n在这种情况下，`CIRT` 成员可以升级响应级别，如有必要，组织可以激活整个 `CIRT`。\n\n在事件期间，通信非常重要，但可能会受到干扰。例如，电子邮件或即时消息系统可能无法使用。如果这些是主要的通信手段且没有备用计划，通信将变得具有挑战性。\n\
  \n 组织的声誉\n\n组织外的通信也需要处理。如果媒体机构听到了事件，他们就会开始关注。在事件期间，通信非常重要，但可能会受到干扰。例如，电子邮件或即时消息系统可能无法使用。如果这些是主要的通信手段且没有备用计划，通信将变得具有挑战性。\n\
  \n（注：由于提供的原文文本包含大量重复的句子，以上翻译已严格遵循指令对内容进行处理。）\n\n\n\n\n`(Current effect rating ×\
  \ .25) + (Projected effect rating × .25) + (Criticality rating × .50)`\n\n`(10 ×\
  \ .25) + (50 × .25) + (50 × .50)`\n\n`2.5 + 12.5 + 25`\n\n`Incident impact score\
  \ = 40`\n\n在确定事件影响评分后，即可对事件的影响进行评估。`表 15-3` 显示了示例事件评分表。请注意，`40` 分表示该事件属于中等影响。\n\n\
  **表 15-3** 事件影响评级\n\n| 分数 || 评级和优先级 |\n| --- | --- |\n| 0 到 25 || 极微，低优先级 |\n| 26\
  \ 到 50 || 中等，中优先级 |\n| 51 到 100 || 严重，高优先级 |\n\n这些数字可能会让人产生困惑，尤其在危机期间，但可以创建一个工具来自动计算。例如，可以创建一个在评级旁边带有复选框的表格。创建评级需要进行一些底层计算，但这些计算可以被隐藏并锁定。CIRT\
  \ 成员成员只需打开表格并选择相应的复选框即可。\n\n### 使用通用检查清单\n\n一旦确定了影响和优先级的计算方法，就可以创建检查清单。以下是通用检查清单的示例：\n\
  \n*   **验证事件是否已发生**——这种验证确保了该事件是真实的事件，而不仅仅是误报。例如，某些 `IDS` 在活动并非实际事件时会对异常活动发送警报。\n\
  *   **确定事件类型**——确定事件是 `DoS`、`malware`、未经授权的访问、不当使用还是多种类型的事件。如果存在针对事件的检查清单，请从 CIRT\
  \ 计划中提取。某些事件可能需要专家，如果是，必须召回相应的专家。\n*   **确定事件的影响或潜在影响**——确定攻击的范围。例如，攻击可能是影响单个工作站的病毒、影响多个服务器的蠕虫，或者是导致每小时产生超过\
  \ `$20,000` 收入的主 Web 服务器宕机的 `DoS` 攻击。如果影响很大，相应的响应将具有高优先级。\n*   **报告事件**——如果报告事件的人不是\
  \ CIRT 成员，他或她应该向 CIRT 成员报告事件。如果可能，应包含事件的影响和严重性并将事件报告给管理层。高影响事件应尽快报告，低优先级事件可以在得到控制后报告。\n\
  *   **获取有关事件的任何可用证据**——必须保留证据。因此，从收集证据开始，就应建立监管链（chain of custody）。监管链日志应包含接收证据的时间、日期和人员姓名。如果证据从一个人传递给另一个人或进入存储，必须更新监管链日志，且不得修改证据。不应访问任何文件。\n\
  *   **控制事件**——必须防止事件扩散。必须将受感染的系统与网络隔离。如果攻击无法被阻止，`ISP` 可能可以提供帮助。\n*   **消除事件**——必须识别允许攻击的漏洞。如果涉及恶意软件，则必须将其完全清除。\n\
  *   **从事件中恢复**——一旦消除事件，系统即可恢复正常。如果服务器遭受了长期损害，必须对其进行修复。\n*   **记录事件**——文档包括许多元素，其中之一是描述事件和所有恢复措施的行动后报告。\n\
  \n### 处理 DoS 攻击事件\n\n如果攻击是 `DoS`，则可以使用为处理 `DoS` 攻击设计的检查清单。该清单可以单独使用，也可以与通用清单配合使用。\n\
  \n在创建 `DoS` 攻击检查清单时，应考虑以下事项：\n\n*   **控制**——必须尽快停止 `DoS` 攻击。一种方法是在`路由器`或`防火墙` 上添加过滤器，根据\
  \ `IP 地址`、`端口`或`协议` 流量。如果攻击无法被阻止，`ISP` 可能可以提供帮助。\n*   **消除**——必须识别允许 `DoS` 攻击的漏洞。例如，漏洞可能源于未充分加固的服务器。\n\
  *   **恢复**——恢复后，必须对系统进行测试以确保其正常运行。\n\n\n\n\n**恢复**——任何被删除或隔离且系统运行所需的文件都必须替换，并必须验证系统不再受感染。如果清理系统需要多个步骤，则在将系统恢复运行之前，应考虑再次运行一次完整扫描。\n\
  \n## 处理未经授权的访问事件\n\n针对未经授权的访问事件可以采取若干措施。与其他类型的事件一样，可以创建单独的清单来涵盖未经授权访问事件，并可以在通用清单的基础上补充针对未经授权访问事件的清单。\n\
  \n### ![](img/Note.png)注意\n\n`多部分病毒`是一种使用多种感染方法的病毒。与简单的恶意软件相比，它通常需要更多的步骤或更复杂的程序才能清除。\n\
  \n在创建未经授权访问事件的清单时，应考虑以下事项：\n\n* **遏制**——如果发现正在进行的攻击，必须识别受攻击的系统并将其与网络隔离，可以通过拔掉 `NIC`\
  \ 线缆或禁用 `NIC` 来。可以使用基于主机的防火墙拦截所有流量，同时记录所有连接尝试。如果事件来自内部账户，必须禁用该账户并验证其遵循了最小权限原则。还应判断攻击者是否劫持了该账户，以及是否有其他系统受到攻击，因为成功攻击一个系统的攻击者通常会尝试攻击同一网络中的其他系统。如有必要，可以对其他系统进行遏制。\n\
  \n* **清除**——必须识别导致攻击成功的弱点，并验证所有加固服务器的步骤均已完成且未被修改。必须使用强密码，并可能需要在系统上进行更改。如果在攻击期间创建了额外的账户，则必须禁用并可能需要删除它们。\n\
  \n* **恢复**——在解决漏洞后，可以重新连接系统并验证其运行正常。应该对系统进行测试，以确保其按预期运行。可能需要考虑增加监控（例如 `IDS`），以便尽快发现未来的事件。\n\
  \n在创建未经授权访问的跟进报告时，需要考虑攻击期间被访问的数据。如果是私有的客户数据（如信用卡数据），组织可能面临与事件相关的特定责任，这些责任需要被确定并包含在报告中。管理层负责决定如何处理这些责任。\n\
  \n## 处理不当使用事件\n\n不当使用事件需要采取特定的应对措施来减轻其影响。减轻影响的步骤可以与通用清单中的步骤结合，也可以创建一个单独的清单来逐一处理不当使用事件。\n\
  \n提醒一下，当内部用户违反组织政策时，就会发生不当使用事件。在创建不当使用事件的清单时，应考虑以下事项：\n\n* **遏制**——在管理层采取行动之前，可以禁用用户的账户。例如，如果用户正在向组织内的所有人发送宗教材料，可以禁用该用户的电子邮件访问。由于员工在网络访问被禁用后无法履行常规工作职责，这对于用户及其主管来说都增加了问题的紧迫性。\n\
  \n* **清除**——某些组织要求用户在恢复访问之前完成特定培训，而其他组织则要求主管在员工的记录中记录该活动。如果员工是惯犯者或事件足够严重，可能会可能会被终止合同。\n\
  \n* **恢复**——在完成适当行动后，可以重新连接系统并验证其运行正常。如果账户已被禁用，则应将其删除。\n\n## CIRT 计划如何降低组织的风险？\n\
  \nCIRT 计划帮助组织为事件做好准备。当组织做好准备时，其响应会更快且行动更有针对性。CIRT 计划的主要优势之一是识别 CIRT 成员，让组织知道他们是谁，团队成员也知道自己的责任。如果没有计划，IT\
  \ 和安全专业人员就没有时间分析他们的响应措施。他们可能会拔掉 `NIC` 线缆来停止服务器的 `DoS` 攻击，虽然这样做会停止攻击，但也会阻止服务器执行预期的服务。\n\
  \n##  CIRT 计划的最佳实践\n\n在为组织实施 CIRT 计划时，可以使用若干最佳实践。以下是其中一些列表：\n\n* **定义计算机安全事件**——不同组织对事件的解释不同。在\
  \ CIRT 计划中定义事件时，所有方都清楚哪些事件属于事件。\n\n* **在 CIRT 计划中包含政策以指导 CIRT 成员**——这些政策可能与 CIRT\
  \ 成员反击攻击者有关，并包括关于保管或其他保护证据的声明，以及与通信和安全的政策，这些取决于组织的重要性。\n\n* **提供培训**——必须对 CIRT 成员和终端用户进行培训。CIRT\
  \ 成员应该理解自己的责任，并知道应对不同类型事件的最佳方式，所有人员都应该理解威胁以及可以采取减轻这些威胁的基本步骤。\n\n* **包含清单**——清单可以是按特定顺序执行的正式分步说明，也可以旨在确保\
  \ CIRT 成员不会遗漏关键数据的非正式项目列表。可以包含通用清单或针对特定类型事件的清单。\n\n* **订阅安全通知**——许多描述不同类型威胁（包括新出现的威胁）的安全公告可以通过电子邮件订阅获取。`US-CERT`\
  \ 定期发送电子邮件和警报。请访问 `https://www.us-cert.gov/mailing-lists-and-feeds/` 注册接收这些电子邮件。\n\
  \n## 章节总结\n\n\n\n\n\n本章涵盖了计算机应急响应团队（CIRTs）和 CIRT 计划。组织应该预料可能导致计算机安全事件的攻击，且目前存在多种类型的事件。拒绝服务攻击试图阻止系统提供服务。恶意软件攻击包括病毒、蠕虫、特洛伊马和其他类型的恶意软件。当个人获取了他们不应访问的数据时，就会发生未经授权的访问事件。未经授权的访问可能来自技术攻击也可能来自社会工程策略。当员工或内部用户违反组织政策时，就会发生不当使用事件。某些事件包含多个组成部分。\n\
  \n`CIRT` 可以响应攻击并减轻其影响。`CIRT` 计划确定了组织政策。例如，某项政策可能会解释 `CIRT` 成员可以反击攻击者的条件。它肯定会包含在响应不同类型事件时使用的程序或清单。通过准备和培训，`CIRT`\
  \ 计划可以帮助组织降低与事件相关的风险。\n\n## 核心概念与术语\n\n- 匿名器\n- CIRT 计划\n- 计算机事件\n- 计算机应急响应团队 (CIRT\n\
  - 数据泄露\n- 恶意软件\n\n## 第 15 章评估\n\n1. 某种 `\\_\\_\\_\\_\\_\\_\\_` 是对安全策略或安全实践的违背。\n\
