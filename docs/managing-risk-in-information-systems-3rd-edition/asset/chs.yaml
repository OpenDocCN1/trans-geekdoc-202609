  \ 章 在整个组织内规划风险缓解\n* 第 11 章 将风险评估转换为风险缓解计划\n\n![© Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n\
  \n© Sai Chan/Shutterstock\n\n## 第 5 章 风险评估方法定义\n\n**进行风险评估**是为了识别最严重的风险。风险管理技术包括避免、共享或转移、缓解或接受风险。风险评估允许对风险进行优先级排序。高优先级风险将得到管理，低优先级风险将被接受。风险评估有助于识别控制风险的最佳方法，这有助于确保购买的控制措施能够提供最大的益处。\n\
  \n创建风险评估主要有两种方法：定量分析和定性分析。定量分析可以使用预定义的公式。例如，年度预期损失（`ALE`）可以通过年度发生率（`ARO`）乘以单次损失预期（`SLE`）来计算，表达式为\
  \ `ALE = ARO × SLE`。也可以使用定性方法。在定性方法，会对风险发生的概率和风险发生时的影响分配数值或词汇。理解这两种方法的方法都至关重要，以便它们能够应用于不同的场景中。\n\
  \n### 第 5 章主题\n\n本章涵盖了以下主题和概念：\n\n* 什么是风险评估\n* 风险评估的关键组成部分是什么\n* 有哪些类型的风险评估可用\n\
  * 应该解决哪些风险评估的挑战\n* 风险评估的最佳实践是什么\n\n### 第 5 章目标\n\n在完成本章后，你将能够：\n\n* 定义风险评估\n* 描述风险评估的重要性\n\
  * 解释何时应该进行风险评估\n* 解释风险评估和风险评估范围的目的\n* 解释识别风险评估关键区域的含义\n* 识别风险评估的主要类型\n* 描述定量和定性风险评估的要素\n\
  * 识别定量和定性风险评估之间的区别\n* 识别定量和定性风险评估的优点和局限性\n* 列出风险评估的挑战\n* 描述数据一致性和不确定性水平的重要性\n* Identify\
  \ 如何为风险评估提供有用的结果\n* 列出与风险评估相关的最佳实践\n\n### 理解风险评估\n\n风险评估也称为`风险分析`，是一个用于识别和评估风险的过程。然后根据其重要性或影响严重程度对风险进行量化。随后，对这些风险进行优先级排序。\n\
  \n风险评估是整个风险管理计划的重要部分。它们有助于识别哪些风险最重要。风险评估与风险管理计划之间的主要区别在于，风险评估是针对某一时刻创建的，而风险管理计划是一个持续的过程。\n\
  \n风险评估有助于识别实施哪些保护措施。保护措施也称为控制措施。它们被用于控制或减少风险。控制措施可以减少脆弱性或减少威胁的影响。无论何种方式，控制措施都能降低风险。\n\
  \n所有公司的资金都是有限的。安全专家可能不断希望在安全上投入更多资金，但这是有 limit 的。如果在安全上花费太多，利润就会受到影响。多少才算太多？限在哪里？风险评估可以帮助决定在哪里划分界限。\n\
  \n![Images/Note.png)备注\n\n公司必须考虑盈利和生存能力。风险评估有助于公司在这两个目标之间保持平衡。\n\n例如，一家公司收集了多年的研究数据。同一公司还有关于下周食堂供应什么食物的数据。如果对安全资金进行优先级排序，哪些数据将获得更多资金？显然是研究数据。识别这个例子中的优先级很容易，但事实并非如此。\n\
  \n![Images/Note.png)备注\n\n`HIPAA`监管健康相关数据的控制。`SOX`监管财务数据的准确性。\n\n现在，在这个例子中，同一公司持有同时受《健康保险流通与责任法案》（`HIPAA`）和《萨班斯-奥莱法》（`SOX`）法律法规的数据。哪些数据更重要？哪些数据应该具有更高的保护优先级？应该实施哪些控制来保护这些数据？这些问题很难回答。对`HIPAA`和`SOX`数据进行风险评估有助于回答这些问题。\n\
  \n### 风险评估的重要性\n\n风险评估是风险管理过程的重要部分。没有风险评估，确定哪些系统需要保护将变得困难，且如何保护尚不明确。然而，风险评估有助于识别最需要保护的系统，并为哪些控制措施能提供最大的价值提供见解。\n\
  \n在以下情况下完成风险评估：\n\n* **评估风险时**：风险评估是风险管理过程的一部分。在任何使用风险管理的情况下，它都是用的，特别是当需要对风险进行优先级排序时。\n\
  * **评估控制措施时**：风险评估可以用于评估控制措施的性。经理无法批准所有的控制措施。风险评估帮助经理决定采用哪些控制措施。\n\n\n\n\n\n- **在实施控制措施后定期进行**——风险评估是一个时间点的文档。然而，风险并非静态。攻击者在不断升级他们的技术和战术。在实施控制措施后，应该定期安排风险评估。其目的是确定该控制措施是否仍然有效。\n\
  \n### 风险评估的目的\n\n风险评估是协助管理的重要工具。它们帮助管理层量化风险，并识别和评估控制措施的有效性。风险评估有助于：\n\n- **支持决策**——风险评估会对风险进行排序，帮助决策者确定哪些风险应该减少。需要提醒的是，并不是所有风险都必须减少。风险可以被避免、共享或转移、缓解或接受。高优先级风险应该被缓解，但低优先级风险可以被接受。\n\
  - **评估控制有效性**——实施控制措施是为了减少风险。风险评估为特定控制措施针对特定风险的有效性提供了见解。\n\n开发风险评估涉及许多步骤。它不是一项可以在一次坐席、一天或甚至一周内完成的任务。当操作得当时，开发风险评估涉及多个关键参与者的投入。开发风险评估涉及的步骤如下：\n\
  \n1. **识别威胁和漏洞**——当威胁利用漏洞时，损失就会发生。如果组织识别了可能出现的威胁和漏洞，就可以减少损失。\n2. **识别风险发生的概率**——这一过程可以基于历史数据或意见。例如，某项风险在过去三年中平均发生四次。如果不采取任何减少该风险的措施，它在明年可能会发生四次。如果没有历史数据，专家可以对风险发生的概率提供意见。\n\
  3. **识别资产价值**——资产的价值有助于确定风险的影响。资产可以是硬件、软件或数据。某些可能会可能会这三者。\n4. **确定风险的影响**——这一过程也可以基于历史数据或意见。例如，在过去三年中，某项风险导致了平均每年\
  \ 20,000 美元的损失。如果不采取任何减少该风险的措施，它明年可能会导致约 20,000 美元的损失。如果没有历史数据，专家可以对风险发生的影响提供意见。\n\
  5. **确定保护措施或控制措施的有用性**——保护措施或控制措施可以减少风险或风险的影响。某些控制措施比其他更有效。风险评估有助于确定实施哪些措施。\n\n\
  风险评估识别针对当前系统的威胁和漏洞。它假设当前的控制措施按预期运行。另一种说法是，风险评估是基于当前状况在某一时间点进行的，而风险管理是一个持续的过程。\n\n\
  ## 风险评估的关键组件\n\n在风险评估过程早期，应完成三个关键步骤。这些步骤识别了风险评估的主要组件，并将直接影响其成功。这些步骤是：\n\n- 识别范围\n\
  - 识别关键领域\n- 识别团队成员\n\n后续章节将深入探讨这些步骤中的每一个。\n\n### 识别范围\n\n范围确定了风险评估的边界。当参与者理解范围时，他们就不可能改变它。识别风险评估的范围有助于其保持正轨。相比之下，不受控制的变化会导致范围蔓延（scope\
  \ creep）。范围蔓延会导致成本超和错过截止日期。\n\n例如，`FIGURE 5-1` 显示了配置在网络中的 Web 服务器。该服务器托管一个可以通过互联网访问的网站。客户可以访问该网站并购买产品。Web\
  \ 服务器托管网站应用程序。后端数据库服务器托管数据。\n\n![图 5-1 带有 Web 服务器和数据库服务器的网络图。](img/9781284183719_CH05_FIGF01.png)\n\
  \n**图 5-1** 带有 Web 服务器和数据库服务器的网络图。\n\n范围可以设定为仅关注 Web 服务器。或者，范围可以包括 Web 服务器和数据库服务器。位于非军事化区（DMZ）的防火墙也可以包含在内。\n\
  \nWeb 服务器在过去一年中遭受了多次攻击。现有控制保护了数据库服务器上的数据未被不当访问或丢失。在这种情况下，数据库服务器可能不会包含在内。风险评估识别了针对当前系统的威胁和漏洞。确保现有控制能够防御当前风险。管理层最终将决定包含哪些内容。在范围中包含或排除内容没有对错之分。重要的是做出选择。\n\
  \n### 识别关键领域\n\n风险评估还识别了应该包含的关键领域。识别这些关键领域有助于风险评估团队关注重要事项。例如，范围可以包括 Web 服务器、数据库服务器和防火墙。然后风险评估可以识别以下关键领域：\n\
  \n- **Web 服务器**——涵盖 Web 服务器的所有元素包括硬件、操作系统和网站应用程序。对于硬件，重点是任何单点故障。单点故障（SPOF）是指任何导致网站崩溃的硬件设备。应该考虑定期更新操作系统的过程，以及防止网站应用程序攻击的最佳实践，包括缓冲区溢出和\
  \ SQL 注入攻击。\n- **数据库服务器**——数据库服务器托管约 20 个数据库。风险评估应仅通过防火墙由 Web 服务器访问的数据库。绝对应该考虑 SQL\
  \ 注入攻击。然而，SQL 注入攻击的主要防护将在网站应用程序中实施。\n- **内部防火墙**——内部防火墙控制进出内部网络的所有流量。风险评估不需要包含所有流量。只需要处理影响\
  \ Web 服务器和数据库服务器之间通信的规则。\n\n![Images/Note.png)注意\n\n缓冲区溢出和 SQL 注入攻击是面向互联网的 Web 服务器的常见攻击。\n\
  \n![Images/Tip.png)提示\n\n通常，范围关注于谁拥有该系统，这使得实施建议更容易。例如，想象一个包含三台服务器的风险评估。这三台服务器中的每一个由不同的部门所有。部门之间可能存在冲突的目标和利益，导致建议难以实施。在这种情况下，应为每个部门创建一个单独风险评估。\n\
  \n在识别关键领域时，对业务最重要的领域应该是关注重点。利润和生存能力在本章之前已经提到。风险评估需要平衡潜在的利润和损失。威胁组织生存的损失是关键的。\n\n\
  \n\n\n\n虽然仅包含关键区域确实很有道理，但风险评估团队可能无法理解管理层认为哪些是关键的。团队应该专注于管理层认为重要的事情。\n\n### 识别团队成员\n\
  \n风险评估团队的人员不应与负责纠正缺陷的人是同一拨，这有助于避免利益冲突。\n\n例如，管理员负责在 Web 服务器上实施控制措施。他或她的意见可能会因为实施控制措施的愿望而产生偏见。如果由中立方提供意见，更有可能获得准确、客观的数据。\n\
  \n无论如何，都应该从负责部门获取意见。该部门员工可能对问题以及如何修复它们具有极的洞察力。然而，在确定风险优先级和控制措施有效性时，纠正缺陷人员的意见不应是决定因素。\n\
  \n## 风险评估的类型\n\n在考虑风险评估时，必须首先确定使用哪种方法。IT 领域使用的两种主要方法是：\n\n*   **定量 (Quantitative)**——定量方法是客观的。它使用数字，例如实际美元金额。定量风险评估需要大量数据。收集这些数据通常需要时间。如果数据可用，这种类型的风险评估通过使用公式就会变成一个简单的数学问题。\n\
  \n*****定性 (Qualitative)**——定性方法是主观的。它基于专家意见使用相对值。专家对风险的概率和影响提供意见。定性风险评估使用词汇如 `low`、`medium`\
  \ 和 `high`，而不是数字。它可以相对快速地完成。\n\n接下来的章节将对这两种方法进行更深入的探讨。\n\n记住没有哪种方法是优于另一种是重要的。它们都有优点和局限性。然而，在特定情况下，一种方法比另一种方法更有效。了解这些选项可以更容易地为特定情况选择正确的方法。\n\
  \n### 定量风险评估\n\n`quantitative risk assessment` 使用数字，例如美元价值。收集数据然后将其输入标准公式。结果可以帮助识别风险的优先级。结果还可以用于确定控制措施的有效性。\n\
  \n与定量风险评估相关的一些关键术语包括：\n\n*   **单次损失预期 (Single loss expectancy)**——单次事件的预期总损失为 `single\
  \ loss expectancy (SLE)`。当威胁利用漏洞时，就会发生事件。损失以美元金额表示，例如 `$5,000`。损失的美元价值包括硬件、软件和数据的价值。资产价值\
  \ (`AV`) 乘以暴露因子 (`EF`) 等于 `SLE`。`EF` 描述了由于威胁导致资产遭受的损失，以百分比表示。因此，`SLE = AV × EF`。例如，如果\
  \ `AV` 为 `$10,000` 且 `EF` 为 `0.5`（即对威胁的暴露率为 50%），那么 `SLE` 为 `$5,000`。\n\n*   **年度发生率\
  \ (Annual rate of occurrence (ARO))**——预计每年发生事件次数为 `annual rate of occurrence (ARO)`。如果过去一年中每月发生一次事件，则\
  \ `ARO` 为 `12`。假设什么都不变，`ARO` 为 `12`。\n\n*   **年度损失预期 (Annual loss expectancy (ALE))**——年的预期损失为\
  \ `annual loss expectancy (ALE)`。`ALE` 通过 `SLE` 乘以 `ARO` 计算。例如，如果 `SLE` 为 `$5,000`\
  \ 且 `ARO` 为 `12`，则 `ALE` 为 `$60,000`。\n\n\n\n\n最后，公式使用了可验证且客观的衡量标准。如果一个网站每小时产生 $2,000\
  \ 的收入，那么它如果宕机一小时就会损失这部分收入，这是一个可验证的事实。\n\n## 局限性\n\n使用定量分析有其局限性。最大的局限性之一是并不总是拥有准确的数据，这在识别\
  \ `ARO` 减少量时尤为如此。这些估计的准确性可能难以验证。\n\n例如，早前的一个例子提到，如果购买了硬件锁，`ARO` 将从 4 减少到 1。换句话说，每年不再是被盗四台笔记本电脑，而是只会被盗一台。将\
  \ `ARO` 从 4 减少到 1 听起来很不错，但它是真实的吗？在向持怀疑态度或不支持的经理汇报时，这种困难性也是一种漏洞。\n\n另一个局限性是确保人们按照预期使用控制措施。示例中提到了硬件锁来保护笔记本电脑。只要大家都使用硬件锁，它们就会发挥作用。然而，用户可能认为它们不方便。仅仅因为组织购买了锁并不意味着员工会使用它们。\n\
  \n### ![](img/Note.png)注意\n\n成本效益分析为决策者提供了有意义的数据。如果控制措施的收益大于成本，就可以实施该控制措施来降低风险。如果成本大于收益，则可以接受该风险。\n\
  \n可能需要采取额外步骤来确保用户意识到控制措施的重要性。尽管笔记本电脑经常被盗，但当这种情况发生在自己身上时，用户仍然感到非常惊讶。可能需要制定要求使用控制措施的策略。此外，可能需要包含培训以加强控制措施的重要性。\n\
  \n### 定性风险评估\n\n定性风险评估并不分配美元价值。相反，它根据对风险概率和影响的更主观的分配来确定风险水平，这与基于成本估计计算的定量风险评估不同。这些值是通过收集专家意见来确定的。\n\
  \n概率和影响定义如下：\n\n*   `Probability`——威胁利用漏洞的可能性。当威胁利用漏洞时，风险就会发生。可以使用量表来定义风险发生的概率。该量表可以基于词汇值，如`低`、`中`或`高`。然后可以为这些词汇分配百分比值。例如，可以给低概率分配\
  \ 10% 的值，给高概率分配 100%。\n\n*   `Impact`——风险发生时的负面结果。影响用于识别风险的程度。风险会导致某种损失。然而，影响评估不是将损失量化为金额，而是可以使用词汇，如`低`、`中`或`高`。这些类别也可以用于识别概率。然而，当概率以百分比形式表示时，影响则表示为相对值。例如，`低`可以是\
  \ 10，`中`可以是 50，而`高`可以是 100。\n\n可以使用以下公式计算风险水平：\n\n`风险水平 = 概率 × 影响`\n\n`表格 5-1`和`5-2`显示了在风险评估中定义量表的一种方法。每个量表的值都是根据当前已知的威胁、漏洞以及当前的控制措施分配的。注意，专家以词汇（如`低`和`中`）分配概率和影响。随后，完成风险评估的人根据量表将词汇转换为数字。例如，如果专家分配了低概率，则风险评估将给出一个\
  \ 10% 的值。专家并不一定知道实际的值和范围。相反，他们是根据描述来分配的。\n\n**概率表 5-1**\n\n| 概率 | 描述 | 数值/范围 |\n\
  | :--- | :--- | :--- |\n| 低 | 风险发生的可能性较低。威胁不太可能利用漏洞。 | 0-10% |\n| 中 | 风险发生的可能性中等。存在可能。\
  \ | 11-50% |\n| 高 | 风险发生的可能性很大。威胁极有可能利用漏洞。 | 51-100% |\n\n**影响表 5-2**\n\n| 影响 |\
  \ 描述 | 值/范围 |\n| :--- | :--- | :--- |\n| 低 | 风险发生时，对公司的影响很小。不会影响关键业务。 | 1-10 |\n\
  | 中 | 风险发生时，对公司产生中等影响。会影响关键业务但程度有限。 | 11-50 |\n| 高 | 风险发生时，对公司产生巨大影响。会影响关键业务并造成重大损失。\
  \ | 51-100 |\n\n\n\n\n**表 5-3**显示了结果可能的样子。平均概率和影响已经汇总并输入到每个框中。例如，对于 `DoS` 攻击，平均概率和影响均被确定为\
  \ 100。概率和影响是通过对不同专家的每个输入取平均值计算出的。风险水平通过公式 `Probability × Impact` 确定。\n\n**表 5-3**\
  \ 定性分析调查结果 \n\n![](img/Table5-3.png)\n\n### 确定风险的调查\n\n我们正试图识别对我们网站最严重的风险。请针对下表列出的每个类别，在每个标题下输入“低”、“中”或“高”的值。您的决策应基于当前的控制和保护措施。例如，该网站目前部署在互联网上，并受到基于主机的防火墙的保护。假设该防火墙将保持不变。\n\
  \n定性分析调查\n\n| 类别 || 风险发生的概率（低、中或高） || 风险发生后的影响（低、中或高） |\n| --- | --- | --- |\n|\
  \ `DoS attack` || ||  |\n| --- | --- | --- |\n| `Web defacing` || ||  |\n| `Loss\
  \ of data from unauthorized access` || ||  |\n| `Loss of website data from hardware\
  \ failure` || ||  |\n\n这些数据可以用许多方式以图形化形式呈现。**图 5-2**中的风险矩阵显示了一种方法。\n\n![FIGURE 5-2\
  \ 风险矩阵。](img/9781284183719_CH05_FIGF02.png)\n\n**图 5-2** 风险矩阵。\n\n此时，表 5-3 显示最高风险来自\
  \ `DoS` 攻击，其风险水平为 100。最低的风险水平是由于未经授权的访问导致的数据丢失，为 3。\n\n数据丢失听起来非常重要。然而，如果现有的控制和实践已经消除了大部分风险，那么影响就会降低。例如，管理员可能已经从网站上删除了所有私有数据。尽管有人可能尝试黑入网站以获取数据，但影响很低，因为该网站仅持有公共数据。\n\
  \n另一方面，`DoS` 攻击的风险显然上升为最大的风险。根据当前的控制措施，专家们认为系统将受到攻击。当受到攻击时，他们也认为影响将是巨大的。\n\n###\
  \ 参考信息\n\n不同的[独立磁盘冗余阵列 (RAID)](#29_glossary.xhtml#gloss150）（也称为*廉价磁盘冗余阵列*）允许系统在磁盘驱动器故障时继续运行。复杂的\
  \ `RAIDs` 允许系统在多个磁盘驱动器故障时仍运行。`RAID` 还提供了容错能力。发生故障，磁盘子系统可以承受，这意味着它将继续运行。\n\n从重要到不重要的风险列表为：\n\
  \n*   **优先级 1**—`DoS attack`，值为 100\n*   **优先级 2**—`Web defacing`，值为 50\n*   **优先级\
  \ 3**—`Loss of website data from hardware failure`，值为 27\n*   **优先级 4**—`Loss of\
  \ data from unauthorized access`，值为 15\n\n\n\n\n\n### 4. 共享结果\n结果共享的形式将根据项目阶段的不同而异。如果刚刚整理出一份风险列表，现在可以要求团队识别每种风险的概率和影响。当开始开展控制措施时，可以重复此过程。可以要求提供一份缓解风险的控制列表。然后，可以要求团队识别不同控制对特定风险的有效性。\n\
  \n### 5. 根据需要重复\n该过程可以一直重复，直到收集到所有数据。\n\n德尔法法（Delphi method）非常灵活。今天，调查通常可以通过电子邮件完成。许多电子邮件程序实际上允许发送调查，用户只需点击按钮即可。用户还可以填写在内部服务器上创建的调查，这可能需要一些时间来开发，但可以快速汇总结果。\n\
  \n独立收集数据至关重要。如果数据是在会议上收集的，参与者的回答可能会受到房间内其他人意见的影响而偏斜。强势的参与者可能会影响他人，并防止团队的充分参与。\n\n\
  ### 局限性\n定性评估具有若干局限性。这些包括：\n\n* **主观性**——分析和结果更多基于意见而非事实。对这些意见的不同观点可能会提供完全不同的结果。如果意见是在小组中收集的，强势参与者可能会塑造整个小组的想法。\n\
  \n* **基于专家的专业知识**——评估的价值取决于专家的专业水平。如果专家拥有坚实的知识基础和广泛的经验，结果将是有价值的。另一方面，如果没有真正的专家可用，结果的价值可能有限。\n\
  \n* **无成本效益分析 (CBA)**——定性评估不包含 `CBA`。控制措施的有用性没有定量分析那样清晰。虽然专家的意见仍然很有价值，但结果对管理层来说可能不够清晰。管理层在决定使用哪些保护措施时可能会更加困难。\n\
  \n* **缺乏真实标准**——公司需要定义过程中使用的刻度。例如，刻度可以简单到低、中、高。然而，需要为参与者开发并定义刻度，这需要理解风险评估和数据如何用途的人的专业知识。\n\
  \n### 定量与定性风险评估的比较\n提醒一下，两种方法都不被认为优于对方。它们都有自己的优点和局限性。总结来说，以下是定量与定性风险评估之间的一些对比。\n\
  \n**定量分析：**\n* 客观\n* 使用数值（如美元金额）\n* 可靠地重复\n* 更耗时\n* 需要访问大量的历史数据\n* 数据并不总是容易获得\n\
  * 基于 `SLE`、`ARO` 和 `ALE` 公式\n* 以美元值显示清晰的损失和节约\n* 数据可以很容易地用于 `CBA`\n\n**定性分析：**\n\
  * 主观\n* 基于专家的意见\n* 比定量分析完成更快、成本更低\n* 使用词汇值（如低、中、高）\n* 需要对风险评估中使用的刻度进行定义\n\n### 风险评估大纲示例\n\
  风险评估以报告结束，管理层可以利用该报告决定实施哪些控制措施。以下是风险评估报告中常见的主题列表：\n\n* **引言**——引言提供了风险评估的目的和范围。它包含了对风险评估中所考虑系统的组件、用户和位置的描述。\n\
  \n* **风险评估方法**——此部分识别了用于完成风险评估的方法。它包含了关于如何收集数据以及谁参与其中的细节。如果使用定性方法，此部分将描述风险刻度。\n\n\
  * **系统特征**——此部分提供了有关系统的更多详细信息。它可以包括硬件、软件或网络连接的细节，并可能包含图形化显示受评估系统的图表。\n\n* **威胁声明**——此部分列出了潜在威胁、威胁源和威胁行为。例如，一种威胁可能是针对面向网络的服务器的攻击。\n\
  \n* **风险评估结果**——此部分列出了风险评估结果，以威胁/漏洞对表示风险。根据现有安全控制措施描述风险。风险发生的概率取决于使用哪种分析。定量方法使用\
  \ `SLE`、`ARO` 和 `ALE` 等术语。定性方法根据定义的刻度识别概率和影响。所有这些数据都有支持。\n\n* **控制建议**——提供建议的保护措施列表。此列表可以包含对控制有效性的意见。定量方法通常会伴随\
  \ `CBA`。定性方法通常会对控制措施的有效性进行排名。\n\n* **总结**——总结可以是一个或多个表格的形式。这种格式便于管理层根据风险评分看到最高风险。总结也易于批准任何建议。\n\
  \n### 风险评估挑战\n在完成风险评估时，必须解决并克服若干挑战。许多挑战取决于所选的评估类型。定量和定性评估都有自己的挑战。这些挑战在上一节中作为局限性列出。\n\
  \n还存在一些额外挑战。这些包括：\n* 使用静态过程评估移动目标\n* 资源和数据的可用性\n* 数据一致性\n* 估计影响因素\n* 提供支持资源分配和风险接受的结果\n\
  \n这些挑战将在后续章节中探讨。\n\n### 使用静态过程评估移动目标\n如前所述，风险评估是针对特定时间的评估。它根据已知风险和当前的控制措施来评估系统。换句话说，风险评估是一个静态过程。然而，安全并不是静态的，因为攻击者和攻击手段不断变化。\n\
  \n当攻击者成功攻击时，安全专家会实施控制。在某些时刻，这些攻击变得不再成功。攻击者随后会学习新的方法。安全专家会修改或实施新的控制，战斗仍在继续。\n\n\n\
  \n\n随后，在 2008 年夏天，`Dan Kaminsky` 发现并发布了一个漏洞。转瞬之间，`DNS 缓存投毒` 再次成为一个问题。一旦结果公布，攻击者迅速学会了如何利用该漏洞。`DNS\
  \ 缓存投毒` 再次被认为是一个严重的问题。安全措施解决了这一漏洞，`DNS 缓存投毒` 再次变得罕见。\n\n如果风险评估在 3 月完成，但在 6 月公布了一个影响该系统的漏洞，那么评估的有效性就会受到影响。出于这个原因，在新的风险出现时保持警觉是必要的。\n\
  \n### FYI（供参考）\n\n了解漏洞的一种方法是订阅美国计算机应急响应小组（`US-CERT`）的警报。关注警报可以发现每周都有新漏洞被。其中某些漏洞代表了非常严重的风险。接收\
  \ `US-CERT` 团队的电子邮件和警报注册可以在 [`www.us-cert.gov/mailing-lists-and-feeds/`](http://www.us-cert.gov/mailing-lists-and-feeds/)\
  \ 完成。\n\n### 资源和数据的可用性\n\n可用性挑战主要存在于两个领域。一个领域与资源的可用性有关，另一个领域与数据的可用性有关。在风险评估过程早期，解决这两个问题至关重要。如果不予处理，可能会严重影响质量。\n\
  \n关于资源，参与评估的人员应该对他们正在评估的系统了如指掌。具有更高水平的专业知识可以获得更高质量的评估。如果风险评估团队缺乏所需的高水平知识和经验，他们可能不得不诉诸猜测。\n\
  \n风险评估需要高层的支持。这种支持将有助于确保管理层为团队分配足够的资源。如果风险评估负责人在从特定部门获取支持时遇到困难，高层可以提供帮助。另一方面，如果项目无法获得高层支持，负责者得到的支持将越来越少。\n\
  \n至于数据，其可用性也同样重要。数据的可用性将决定所执行的评估类型。例如，如果可以获得大量与实际性能和停机相关的内部历史数据，就可以将其来进行定量风险评估。这些历史数据可用于确定\
  \ `SLE` 和 `ARO` 的值。如果这些数据不可用，可能会改为进行定性风险评估。\n\n在缺乏合适的人员和正确数据的情况下，风险评估的完成将变得困难得多。如果尽早解决这些问题，成功的机会将会更大。\n\
  \n### !![](img/Tip.png)提示\n\n即使能够访问历史数据，可能仍会选择定性风险评估。选择定性评估而非定量评估的原因之一可能是时间考虑。定性风险评估通常比定量风险评估能更快完成。\n\
  \n### 数据一致性\n\n风险评估的另一个挑战是数据一致性。数据一致性指的是数据的准确性。几个问题可能会影响数据一致性，包括：\n\n*   数据格式的差异\n\
  *   数据收集方式的变化\n*   业务的变化\n\n这些问题每一个都会直接影响数据的准确性。然而，即使数据准确率未达到 100%，也不意味着这些数据无法使用。\n\
  \n某些风险评估通过`不确定性水平` 来处理数据的准确性。\n\n\n\n尽管销售数据可能显示销售额正在下降，但新经理可能正在实施变革以增加销售，且初步迹象可能显示出增长。所有这些因素都可能导致所用数字的不确定水平发生。\n\
  \n## 估计影响因素\n\n任何风险的潜在影响都很估计。最重要的一点是意识到影响只是一个估计。如果未来发生的事情可以被准确预测，那么 IT 或网络安全领域可能不会是一个选择。\n\
  \n在估计影响时，多个因素会发挥作用，即使在有准确的历史数据时也是如此。例如，网站可能受到攻击，导致数小时的停机。在排除故障的过程中，技术人员学到了很多知识。是的，首要任务是解决当前的故障。然而，从中获得的知识和经验会被记录下来。下次服务器发生故障时，恢复时间可能会快得多。\n\
  \n即使是这个例子也取决于几个变量。IT 专业人员流失率高的公司积累的经验水平与流失率低的公司不同。如果系统由于与六个月前相同的原因宕机，但这是新技术人员第一次遇到它，那么停机时间可能依然一样长。\n\
  \n另一方面，之前的攻击可能由于系统存在漏洞而成功。如果这些漏洞被发现，它们很可能已经被修复了。然而，即使被修复了，修复内容可能可能被记录。\n\n如果没有对之前修复的记录，今天的一切看起来可能与上次攻击时完全一样。相反，可能已经实施了一些更改，降低了攻击的可能性或攻击的影响。在这个例子中，不确定性水平可能取决于组织内部管理实践的变化。\n\
  \n### ![](img/Note.png) 注意\n\n变更管理是一个流程，确保只有在经过评审流程后才进行更改，并对更改进行记录。它是信息技术基础设施基础库（ITIL）涵盖的一个重要流程。许多公司即使没有遵循\
  \ ITIL 实践，也会使用变更管理流程。\n\n## 提供支持资源分配和风险接受的结果\n\n风险评估的结果需要是有用的，这并不出意料。然而，安全专业人员可能会陷入认为“不惜一切代价地追求安全”的陷阱，事实并非如此。必须不断考虑盈利与生存能力之间的适当平衡。\n\
  \n需要考虑的两个重要点是：\n\n* 资源分配\n* 风险接受\n\n### 资源分配\n\n安全团队并没有无限的资金或人员。相反，安全将获得固定百分比的资源，在进行风险评估时，记住这一点非常重要。\n\
  \n任何建议都应该是现实的。它们需要考虑业务文化以及建议被接受的实际潜力。\n\n### 风险接受\n\n某些组织愿意接受比其他组织更多的风险，这既不是对也不是错；接受更多风险只是业务运营的方式。对于某些业务来说，承担风险是其创新能力的一种体现。在创建风险评估时，意识到业务文化至关重要。\n\
  \n接受更多风险有两个方面：\n\n1. 风险越大，回报越高。\n2. 更大的风险可能导致更大的损失。\n\n例如，现存的许多公司其股票曾一度低于 1 美元。任何购买了其价值\
  \ 10,000 美元股票的人在今天都是百万富翁。然而，实际上很少有人真的购买了那些价值 10,000 美元的股票。原因是，当股价低位时，没有人知道公司是否能生存下来。有些人承担了风险并获得了丰厚的回报。然而，其他人在其他由于已经破产的公司身上承担了类似的风险。他们的风险投资被证明是巨大的损失。\n\
  \n记住高级管理人员负责为公司做出重大决策是重要的。他们负责识别哪些风险需要缓解、共享、转移、避免或接受。向高级管理人员提出的建议应基于并符合他们预期接受的剩余风险。\n\
  \n### ![](img/Note.png) 注意\n\n剩余风险是在管理层决定实施控制措施后任何任何风险。高级管理层负责做出这些决策。此外，高级管理层还对因剩余风险而导致的任何损失负责。\n\
  \n无论如何，呈现所有数据的责任仍然存在。如果某些建议显然不会被接受，可以将它们包含在报告中，但不要包含在实际建议列表中。\n\n## 风险评估的最佳实践\n\n\
  风险评估在不同组织中的进行方式可能有所不同。对网络服务器的风险评估与评估 HIPAA 数据的评估看起来可能大不相同。然而，可以包含几项内容以确保成功。\n\n\
  以下列表识别了风险评估方法的几项最佳实践：\n\n*   **从明确的目标和定义的范围开始**——风险评估应包含一个范围声明。范围声明有助于保持评估不离正途，并防止范围蔓延。\n\
  *   **争取高级管理层的支持**——高级管理层需要致力于风险评估。没有支持，风险评估就会失去价值。当风险评估团队意识到风险评估没有被重视时，他们投入的时间和精力就会减少。没有高级管理人员支持的评估从一开始就几乎注定会失败。\n\
  *   **建立强大的风险评估团队**——风险评估的价值基于风险评估团队的能力和专业知识。团队成员应该具有该系统的专业知识。例如，在进行定性分析时，如果是从非专家的人员那里收集的数据，那么他们的意见就不会像专家那里收集的数据那样价值。团队成员还应该理解用于风险评估的方法论。\n\
  *   **定期重复风险评估**——威胁、风险和漏洞不断演变；因此，应该定期重复风险评估。某些联邦机构要求至少每三年重复一次风险评估。许多组织制定风险评估政策，识别组织预期定期执行的事项，并为任何风险评估定义通用目标。\n\
  *   **定义要使用的方法论**——通过一致地使用相同的方法，人们会变得更擅。例如，公司可以决定定期进行定性风险评估。如果是这样，应该定义使用的量表。当以相同的方式反复评估时，它们更容易完成，并往往提供更高质量的结果。\n\
  *   **提供清晰风险和建议的报告**——每份风险评估都应以识别发现的报告结束，并应清晰陈述。确保风险被清晰定义是重要的。更重要的是确保建议是清晰的。风险评估的最终目的是通过建议的控制措施来缓解风险。如果建议不清晰，报告将失去很大价值。\n\
  \n## 章节总结\n\n\n\n\n\n风险评估用于识别和量化风险。它们通过识别威胁和漏洞，然后应用评估方法对风险进行优先级排序来实现这一目标。一旦风险被量化，就可以确定控制措施和保护措施。风险评估还可以用于确定要实施的最佳控制措施。\n\
  \n两种主要的风险评估方法是定量和定性。当历史数据易于获取时，会使用定量风险评估。这些数据可以根据 `SLE` 和 `ARO` 导出 `ALE`：`ALE =\
  \ SLE × ARO`。定性风险评估使用专家的意见。它没有预定义的公式，而是要求创建一个量表，例如低、中、高。定量风险评估提供 `CBA`。另一方面，定性风险评估可以在更短的时间内完成。\n\
  \n## 核心概念与术语\n\n- `年度损失预期 (ALE)`\n- `发生率 (ARO)`\n- `暴露因子 (EF)`\n- `概率`\n- `定性风险评估`\n\
  - `定量风险评估`\n- `独立磁盘冗阵列 (RAID)`\n- `保护措施`\n- `保护措施价值`\n- `单次损失预期 (SLE)`\n- `单点故障\
  \ (SPOF)`\n- `不确定性水平`\n\n## 第 5 章评估\n\n1. 使用什么可以帮助量化风险？\n    - `SLE`\n    - `ARO`\n\
  \    - `风险评估`\n    - `风险缓解计划`\n    - 以上所有\n2. `_\\_\\_\\_\\_\\_\\_` 描述了由于威胁将对资产造成的损失，以百分比值表示。\n\
  3. 风险评估是一个静态过程。\n    - 正确\n    - 错误\n4. `_\\_\\_\\_\\_\\_\\_` 风险评估使用 `SLE`。\n5.\
  \ 定性分析中包含哪些元素？\n    - `SLE`、`ALE` 和 `ARO`\n    - `ALE`、`ARO` 和 `ARP`\n    - 概率和影响\n\
  \    - 威胁和漏洞\n6. 定量分析中包含哪些元素？\n    - `SLE`、`ALE` 和 `ARO`\n    - `ALE`、`ARO` 和 `ARP`\n\
  \    - 概率和影响\n    - 威胁和漏洞\n7. 定性分析比定量分析耗时间。\n    - 正确\n    - 错误\n8. `_\\_\\_\\_\\\
  _\\_\\_` 风险评估的一个主要优点是它可以比其他方法更快地完成。\n9. `_\\_\\_\\_\\_\\_\\_` 风险评估的一个主要优点是它包含了成本效益分析的细节。\n\
  10. 在执行定性风险评估时必须定义什么？\n    - 用于 `ALE` 的公式\n    - 用于定义概率和影响的量表\n    - 用于定义 `SLE`\
  \ 和 `ALE` 的量表\n    - 可接受的风险水平\n11. `_\\_\\_\\_\\_\\_\\_` 风险评估是客观的。它使用可以验证的数据。\n\
  12. `_\\_\\_\\_\\_\\_\\_` 风险评估是主观的。它依赖于专家的意见。\n13. 风险评估面临的挑战之一是获取准确的数据。风险评估报告中包含什么可以指示数据的可靠性？\n\
  \    - 概率声明\n    - 准确性量表\n    - 有效性水平\n    - 不确定性水平\n14. 一位 IT 安全团队负责人正在她的公司进行定性风险评估。她正在考虑最终报告。在提供结果和建议时，IT\
  \ 安全团队负责人应该考虑什么？（选择两项）\n    - 资源分配\n    - 风险接受\n    - `SLE` 和 `ARO`\n    - `SLE`\
  \ 和 `ALE`\n15. 在执行风险评估时，以下哪项被认为是最佳实践？\n    - 从明确的目标和定义的范围开始\n    - 寻求高级管理层的支持\n\
  \    - 定期重复风险评估\n    - 提供明确的建议\n    - 以上所有\n\n![© Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n\
  \n© Sai Chan/Shutterstock\n\n## 执行风险评估\n\n风险评估与风险分析是同义词。它是识别业务运营风险的过程。此类风险包括资产、人员、技术和运营，例如企业的使命、功能和声誉。美国国家标准与技术研究院（NIST）的特别出版\
  \ `800-53` 提供了风险管理指南，包括风险评估、威胁和漏洞分析以及安全控制。\n\n执行风险评估必须采取几个步骤。第一步是明确定义要评估的内容，这涉及描述系统。然后收集数据以识别威胁和漏洞。接下来，确定缓解风险的控制措施和保护措施，并对已实施和计划中的控制措施进行评估。风险评估的最后一步是评估和建议。\n\
  \n### 第 6 章主题\n\n本章涵盖了以下主题：\n\n- 选择风险评估方法时考虑的因素\n- 如何识别管理结构\n- 如何识别资产和活动\n- 如何识别和评估威胁\n\
  - 如何识别和评估漏洞\n- 如何识别和评估控制措施\n- 如何根据需求选择方法\n- 如何制定缓解建议\n- 风险评估结果的内容\n- 执行风险评估的最佳实践是什么\n\
  \n### 第 6 章目标\n\n完成本章后，你将能够：\n\n- 选择合适的风险评估方法\n- 定义被评估系统的运行特征和使命\n- 说明回顾之前的发现和状态的重要性\n\
  - 描述管理结构与风险评估的相关性\n- 识别纳入风险评估的资产类型\n- 列出识别和评估威胁的步骤\n- 列出识别和评估漏洞的行动\n- 列出识别和评估控制措施的行动\n\
  - 描述用于评估威胁、漏洞和利用方式的过程\n- 描述用于制定缓解建议的过程\n- 描述风险评估的结果\n- 列出风险评估的最佳实践\n\n\n\n\n\n*\
  \   **用户和计算机管理**——该部门负责网络和账户的日常管理，并可能包括基础的安全措施。例如，`组策略`\n`组策略`是一项自动化管理工具。策略可以设置一次并应用于域内的所有用户和计算机。例如，可以设置一种适用于所有用户的密码策略，用以确保用户使用强密码并定期更换。\n\
  \n一个小型组织可能同时对许多系统进行风险评估。然而，较大的组织可能会将风险评估分开。例如，一个大型组织托管着电子商务网站。网站的元素包括 Web 服务器、数据库服务器和防火墙。然而，组织内的不同部门负责管理这些不同的元素。一个部门管理\
  \ Web 服务器；另一个部门管理数据库服务器；第三个部门管理网络安全（包括防火墙）。对所有三个元素进行单次风险评估可能是具有挑战性的，尤其在实施建议时尤为如此。不同部门的经理可能会有相互竞争的目标、时间表和优先事项。\n\
  \n然而，如果组织一次只评估一个部门，结果将更容易实施。例如，可以进行三次独立的风险评估，分别针对 Web 服务器、数据库服务器和防火墙进行。每项评估都将针对系统所有者提出具体的建议。\n\
  \n### 在风险评估边界内识别资产和活动\n\n`资产评估`\n本节介绍了与风险评估相关的资产和活动。\n\n只有风险评估边界内的资产才应该被评估。当对风险评估范围之外的资产进行评估时就会发生范围蔓延，这一过程会导致时间和资源的浪费。\n\
  \n资产的价值可以从不同的角度来看：\n\n*   **重置价值**——重置价值是购买新资产来替换现有资产的成本。例如，如果笔记本电脑损坏或被盗，购买一台具有相似硬件软件的新笔记本电脑的价格可能为\
  \ 1,500 美元。\n*   **恢复价值**——恢复价值是在故障后使资产运行的成本。例如，如果服务器的硬盘故障，则不会更换整台服务器。相反，只需更换硬盘，并采取措施恢复系统，这可能需要重新安装操作系统从备份中恢复数据。执行维修所需也需要考虑在内。例如，如果维修需要两个小时，那么系统在这小时内无法使用。例如，如果该系统是每小时产生\
  \ 10,000 美元收入的 Web 服务器，那么 20,000 美元将作为恢复价值的一部分。\n\n确定任何资产的价值时需要考虑几个因素。这些包括：\n\n\
  *   系统访问和可用性\n*   系统功能\n*   硬件和软件资产\n*   人员资产\n*   数据和信息资产\n*   设施和用品\n\n#### 系统访问和可用性\n\
  访问和可用性是指资产需要如何以及何时可用。某些资产需要每天 24 小时、每周 7 天可用。其他资产仅需周一至周五的办公时间内可用。资产的可用性要求越高，与停机相关的风险就越大。\n\
  \n例如，Web 服务器用于通过互联网销售产品。客户可以随时访问网站，但如果当客户尝试访问时网站未运行，公司将失去一笔订单。此外，可能失去一个客户。\n\n考虑到这一点，风险评估需要考虑与该网站在任何时间宕机相关的风险，包括如何在不关闭网站的情况下对系统进行维护。维护包括对数据进行备份并保持系统更新。\n\
  \nWeb 服务器可能是 Web 集群中的许多服务器之一，也可能是备备集群中几个 Web 服务器之一。这两种配置都允许单台服务器宕机而网站继续运行，但如果运行单台服务器，停机可能是灾难性的。\n\
  \n另一方面，系统可能有一个文件服务器，供员工在周一至周五上午 8 点到下午 5 点工作期间在内部使用。这种安排允许在员工不工作时有充裕的时间进行备份或其他维护。\n\
  \n### 系统功能\n在确定资产价值时，应考虑提供服务的系统的功能。特别重要的是这些功能是手动执行还是通过自动化执行的。\n\n例如，正在评估组织邮件的价值。邮件系统可能包含多个元素，包括垃圾邮件过滤器。研究显示，通过互联网发送的邮件高达\
  \ 90% 是垃圾邮件。垃圾过滤器将消除部分垃圾邮件，目标是不消除任何有效邮件。\n\n过滤掉高达 30% 垃圾邮件的过滤器可以显著减少垃圾邮件，同时高程度地确保有效邮件不会被过滤。图\
  \ 6-3](#16_chapter06_03) 显示了带有垃圾邮件过滤器的电子邮件服务器。在图中，所有邮件从互联网通过垃圾邮件设备。过滤器过滤掉部分垃圾邮件并将其余邮件发送到电子邮件服务器。\n\
  \n```\n![FIGURE 6-3 带垃圾邮件过滤器的电子邮件服务器。](img/9781284183719_CH06_FIGF03.png)\n```\n\
  \n**FIGURE 6-3** 带垃圾邮件过滤器的电子邮件服务器。\n\n考虑到这一点，垃圾邮件过滤器的价值是多少？它使用自动化过程，因此其价值就是设备的价值。如果它损坏或发生故障，就可以更换。\n\
  \n\n\n\n然而，某些垃圾邮件过滤器需要多得多的交互，例如需要专门的技术人员不断查看被过滤的垃圾邮件，以确保其中不包含任何有效电子邮件。这些技术人员可以将有效邮件源地址添加到白名单，并将已知的垃圾邮件发送者添加到黑名单。\n\
  \n### 注意\n![](img/Note.png)\n\n邮件 `whitelist`（白名单）是一份批准的电子邮件地址或域名列表。例如，可以将 `ProfJohnson@xyz.edu`\
  \ 添加到白名单，以确保来自此地址的任何邮件都不会被标记为垃圾邮件。也可以添加 `xyz.edu` 域名，以确保该域名内任何人的邮件都不会被标记为垃圾邮件。添加到\
  \ `blacklist`（黑名单）的地址会自动标记为垃圾邮件。\n\n### IT 设备\n许多 IT 设备的存在让 IT 工作变得简单一些。技术人员不需要了解设备的工作原理；只需将其插上即可。\n\
  \n作为对比，操作烤面包机不需要了解其内部的技术细节。面包放进去，热吐司出来。当然，即使是烤面包机也有旋钮和控制按钮，并且需要用户交互。\n\n垃圾邮件设备的工作原理类似。它连接到电源，输入端用于接收外部邮件，输出端将邮件发送到服务器。它会自动过滤掉一些垃圾邮件。管理员仍然可以与垃圾邮件过滤器交互；他们可能想要查看过滤后的垃圾邮件或调整垃圾邮件过滤器的灵敏度。许多垃圾邮件过滤器还允许添加地址，并允许某些邮件始终被拦截或允许。\n\
  \n防火墙设备是另一个例子。它在插电后几乎不需要配置。管理员仍然可以根据特殊需求对其进行微调；然而，它开箱即能完成大部分所需工作。\n\n在计算手动管理的垃圾邮件设备的价值时，还需要考虑管理员所的工作。如果初始配置和管理还需要额外的劳动力和专业知识，那么该资产的价值可能会更高。\n\
  \n### 硬件和软件资产\n硬件资产是任何可以物理接触的资产，包括计算机，如笔记本电脑、工作站和服务器。硬件资产还包括网络设备，如路由器、交换机和防火墙。\n\
  \n设备之间的价值差异巨大。一台简单的台式 PC 成本可能低于 500 美元。然而，一台高端服务器可能花费数万美元。\n\n软件资产包括操作系统和应用程序。操作系统是计算机运行的基础；操作系统可以是微软系统，如\
  \ `Windows 10` 或 `Windows Server 2016`，也可以是 UNIX 或 Macintosh 系统。\n\n应用程序允许执行任务。例如，`Microsoft\
  \ Word` 是一个允许创建和编辑文档的应用程序。同样，`Oracle` 是用于管理数据库的服务器级应用程序。\n\n操作系统和应用程序的成本也可能很大。例如，台式\
  \ PC 的操作系统和应用程序费用在数百美元之间。然而，服务器的操作系统和应用程序费用可以轻松达到数千美元。\n\n## 人员资产\n人员资产需要进行评估。一个能够留住人才的组织通常比人员流动率高的组织问题更少。组织可以采取特定措施来留住优秀人才。\n\
  \n例如，组织提供不同级别的福利方案，其中可能包括不同类型的保险（如医疗、牙科和人寿），或退休计划（如匹配 `401(k)` 缴）。许多组织还采取额外步骤来提高员工的士气工作环境。\n\
  \n留住员工所采取措施通常取决于他们的受重视程度。当 IT 管理员具备保持网络正常运行所需的高水平知识时，他们对组织具有很高的价值。\n\n### 数据和信息资产\n\
  数据和信息资产的价值取决于数据本身，可能不同。大多数组织都会采取步骤识别数据的分类。例如，组织可以识别出以下数据分类：\n\n- **公共数据**（Public\
  \ data）——公共数据任何人都可以获取。它可以通过公共渠道（如新闻稿或其他出版物）或组织的网站获取。\n- **隐私数据**（Private data）——隐私数据是内部数据。它包括员工和客户的数据。由于其敏感性，应该保护个人数据，以防信息被滥用（例如用于身份盗用）。它还可能包括内部流程的数据。\n\
  - **专利数据**（Proprietary data）——专利数据是高价值数据，需要高水平的保护。如果丢失这些数据可能会严重影响公司的盈利。例如，公司可能花费数百万美元研发，目标是创建一个公司将销售的产品。如果竞争对手获得了这些数据，他们可能会比原公司抢先上市并销售产品，导致研发资金损失。\n\
  \n### 设施和用品\n在评估资产时需要考虑的其他项目是运行业务所需的设施和用品。在计算公司的保险需求时，需要这些信息。\n\n保险是企业一直想要但从不想使用的项目之一。如果公司遭受损失，它能提供一层保护。然而，损失很少是无痛的。即使保险公司赔偿了损失，过程也是困难的。\n\
  \n某些组织可能意识到，他们的某个设施非常重要，因此需要冗余。在这种情况下，`redundancy`（冗余）是另一个可以执行相同功能的站点。四种备用站点类型为：\n\
  \n- **热备**（Hot site）——能够在短时间内接管另一个地点运行的地点。热备拥有执行原始站点关键功能所需的所有硬件、软件和数据，是四种备用站点中最贵的。\n\
  - **冷备**（Cold site）——一个有电力和自来水的建筑，外无一物。可以将计算机和数据带到这里以建立运行。冷备是四个站点中最便宜的。然而，它的建立时间最长，测试也最困难。\n\
  - **温备**（Warm site）——热备和冷备之间的折中。它可能包含所有硬件，但数据可能不是最新的，可能需要一天或更长时间来实施。\n- **移动备**（Mobile\
  \ site）——温备和冷备之间的折中。它带有必要硬件和软件的可移动结构。移动备的温度取决于可用的基础设施；因此，它几乎可以像温备或冷备一样运行。\n\n选择哪种备用站点取决于主点的价值。需要考虑存储在那里的物资，以确保备用站点可以执行相同的工作。当然，可能根本不需要备用站点。\n\
  \n### 识别和评估相关威胁\n威胁是对数据、硬件或系统的任何潜在危险。威胁评估是识别威胁的过程。\n\n理解威胁如何与整体风险相互作用非常重要。**图 6-4**\
  \ 显示了威胁、攻击、漏洞和损失之间的关系。产生攻击，攻击利用漏洞。当威胁/漏洞对发生时，就会产生损失。\n\n![图 6-4 威胁与漏洞。](img/9781284183719_CH06_FIGF04.png)\n\
  \n\n\n\n# 图 6-4 威胁与漏洞。\n\n在图中，攻击者被呈现为一个威胁。然而，威胁可以是任何可能损害机密性、完整性可用性的因素。威胁可以是外部的或内部的、自然灾害或人为的、或是故意的或无意的。\n\
  \n### ![](img/Note.png)备注\n\n本节介绍了与风险评估相关的威胁和活动。\n\n可以使用两种主要方法之一来识别威胁。它们是：\n\n*\
  \   审查历史数据\n*   进行威胁建模\n\n### 审查历史数据\n\n历史往往会重演，IT 系统也是也是如此。通过审查历史数据来识别现实中存在的威胁，可以节省大量时间。\n\
  \n在审查历史数据时，以下事件至关重要：\n\n*   **攻击**——如果一个组织的网站以前受到过攻击，那么它很可能再次受到攻击。下一次攻击的成功取决于自那时实施的保护水平，这对于任何类型的事件都是如此的。\n\
  *   **自然事件**——如果飓风曾袭击过公司的所在地，它们未来很可能再次发生。大多数处于飓风、龙卷风和地震等自然灾害风险区域的组织都制定了灾难恢复和业务连续性计划。这些计划应定期进行审查，至少进行测试，例如每年一次。\n\
  *   **事故**——事故可以是任何影响机密性、完整性或可用性的意外事件，包括用户不小心删除数据。事故还包括用户错误或工作场所的失误。\n*   **设备故障**——设备故障会导致停机，某些系统比其他系统更容易故障。此外，某些故障对业务目标的影响大得多。通过分析过去的故障，通常可以预测未来的故障。应该识别出哪些系统将从额外的冗余硬件中获益。\n\
  \n## 进行威胁建模\n\n威胁建模 是一种通过从攻击者的角度观察系统来识别系统可能威胁的过程。威胁建模的结果是一份称为“威胁模型”文档。\n\n威胁模型提供了以下信息：\n\
  \n*   **系统**——包含系统的背景信息。\n*   **威胁剖面**——威胁剖面是一个威胁列表，识别攻击者可能尝试对系统做的操作，包括攻击的可能目标。例如，一种攻击可能尝试攻宕系统，而另一种攻击可能尝试访问系统中的数据。\n\
  *   **威胁分析**——对威胁剖面中的每个威胁进行分析，以确定资产是否存在漏洞。威胁分析包括审查现有的控制措施，以确定其对威胁的有效性。\n\n威胁建模允许根据攻击发生的概率和潜在危害对攻击进行优先级排序。\n\
  \n## 识别和评估相关漏洞\n\n漏洞是物理、技术或操作安全方面的弱点。它可以是程序的、技术性的或物理的。\n\n有两点与漏洞肯定相关：\n\n*   **所有系统都有漏洞**——消除所有漏洞就像消除所有风险一样不可能。目标是识别相关的漏洞，以便实施控制措施来减少弱点。\n\
  *   **并非所有漏洞都会导致损失**——只有当威胁和漏洞结合成“威胁/漏洞”对时，才会发生损失。只需要识别和评估相关的漏洞。\n\n识别和评估漏洞的方法之一是通过评估。两种主要的评估是：\n\
  \n*   漏洞评估\n*   利用评估\n\n## 漏洞评估\n\n漏洞评估 是一种用于发现系统弱点的过程。评估随后将对漏洞进行优先级排序，以确定哪些弱点是相关的。\n\
  \n漏洞评估可以在内部或外部进行。内部评估尝试从网络内部发现弱点，外部评估则尝试发现公司外攻击者可能看到什么。\n\n### ![](img/Note.png)备注\n\
  \n执行漏洞评估是为了发现弱点。然而，记住攻击者也可以执行相同的步骤是非常重要的。许多流行的漏洞评估套件都包含可用于利用评估的工具。\n\n漏洞评估通常从收集信息开始，使用漏洞扫描器进行网络侦察。漏洞评估类似于敌方侦察目标以对其进行评估并识别最佳的攻击方法。漏洞评估可能有几个目标，例如：\n\
  \n*   **识别 IP 地址**——Ping 扫描工具可以识别哪些 IP 地址正在被使用。当系统对 ping 响应时，说明该 IP 地址对应的系统处于运行状态。\n\
  *   **识别名称**——对于互联网上的计算机，可以使用“Whois”工具从 IP 地址识别计算机的名称。\n*   **识别操作系统**——指纹工具可以识别\
  \ IP 地址上运行的是哪种操作系统。工具向系统发送流量并从系统接收流量，然后分析流量以确定运行的是哪种操作系统。例如，微软操作系统在互联网控制消息报协议（ICMP）流量中包含独特的位位。这些位位验证了它是微软产品。同样，某些\
  \ UNIX 和 Linux 操作系统在 ICMP 包中也包含识别这些操作系统的位。\n*   **识别开放端口**——端口扫描识别开放端口，端口识别了正在运行的哪些协议和和服务。例如，如果端口\
  \ 80 是开放的，则系统上运行着超文本传输协议（HTTP），这表明它是一个 Web 服务器。\n*   **识别弱密码**——密码破解器确定一个或多个账户的密码。密码破解器的成功很大程度上取决于密码的强度，这意味着密码破解器可以发现弱密码。\n\
  *   **捕获数据**——通过网络传输的数据可以被捕获和分析。如果以明文传输或未加密，就可以被读取。\n\n### ![](img/Note.png)备注\n\
  \n本节介绍了识别和评估漏洞的过程。\n\n有多种工具可用于漏洞评估。某些工具只执行特定功能，例如将 IP 地址转换为名称。其他工具则包含多个功能，例如 Microsoft\
  \ Office，它包含了一整套应用程序。\n\n一些常用的漏洞评估工具包括：\n\n*   **Nmap**——Nmap 是一个免费的网络映射工具。它结合了\
  \ Ping 扫描器（用于发现 IP 地址）和端口扫描器（用于确定开放端口）。然后它使用其他技术发现远程系统的操作系统和其他细节。\n*   **Nessus**——Nessus\
  \ 是一个提供全套工具的商业产品。例如，它可以运行 `Nmap` 或其他几个端口扫描器，可以检测系统配置中的常见漏洞，并包含密码破解器。Tenable Network\
  \ Security 销售 Nessus，该公司通过以插件形式发布新工具来定期改进产品。\n*   **SAINT**——SAINT 是系统管理员集成网络工具的缩写。正如\
  \ Nessus 包含全套漏洞工具一样，SAINT 也是。Saint Corporation 销售 SAINT 和其他安全工具。\n\n# 利用评估\n\n\n\
  \n\n\n漏洞利用评估尝试发现攻击者可以利用哪些漏洞。这些评估也被称为渗透测试。漏洞利用评估通常从漏洞评估开始。在发现弱点后，再尝试进行漏洞利用。\n\n漏洞利用评估与漏洞评估之间存在显著差异。具体来说，漏洞利用评估是侵入性的；其目标是测试漏洞利用。如果漏洞利用评估成功，可能会中断业务运行。考虑到这一点，执行漏洞利用评估时应非常谨慎，且绝不能在没有明确授权的情况下进行。意外停止生产服务可能会导致某人的漏洞评估职业生涯突然结束。\n\
  \n## 识别和评估控制措施\n\n控制也被称为对策，是一种安全控制措施或保护措施。实施控制是为了降低风险，而风险可以通过减少漏洞或威胁的影响来降低。\n\n\
  在识别和评估控制措施时，应当考虑以下因素：\n\n*   **现有的控制（In-place controls）**——现有的控制是指当前已安装在操作系统中的控制措施。\n\
  *   **计划中的控制（Planned controls）**——计划中的控制是指那些有指定实施日的控制措施。\n\n### 现有与计划中的控制\n\n控制措施需要成本。在购买控制措施之前，组织会评估其选项。在评估替代控制措施期间，组织将收集相关的文档。在执行风险评估时，应当审查这些控制措施的文档，因为它们可以揭示许多问题。\n\
  \n如果控制措施已经到位，就可以衡量其有效性。理想情况下，控制措施的有效性与其预期一致，但某些控制措施的效果不如其他措施。例如，可能添加入侵检测系统产生了大量的误报，导致管理员最终忽略了它们；或者可能添加了垃圾邮件设备，会将有效邮件标记为垃圾邮件。\n\
  \n需要确定为什么现有控制无效。风险评估可以包含对该控制措施的评估，以确定采取何不同的做法。了解控制措施是否有效也很重要。\n\n计划中的控制可能不会改变。然而，审查建议该控制的文档仍具有价值。可以对当前系统进行评估，以确保原始威胁和漏洞仍然存在。可能还存在额外的工具或技术可以对原始建议进行增强。\n\
  \n## 控制类别\n\n控制措施有多种组织或分类的方法。流行的方法之一是根据以下三个类别对其进行定义：\n\n*   程序性控制\n*   技术性控制\n*\
  \   物理控制\n\n以下章节将解释这三个类别，但也会使用其他类别。NIST 发布了许多与信息安全相关的文档。SP 800-53 Rev. 4《联邦信息系统和组织的安全与隐私控制》于\
  \ 2013 年 4 月发布。\n\n### ![](img/Note.png)备注\n\n本节介绍了控制措施的识别和评估。\n\nNIST SP 800-53\
  \ 在第 4 版之前将这些族类分类为管理控制、技术控制或操作控制。然而，每个族中的某些控制措施结合了管理、技术和操作类类别。NIST 在 SP 800-53 Rev.\
  \ 4 中删除了这些分类。**表 6-1**\n\n**表 6-1** NIST 控制族\n\n| 控制族 | 控制措施数量 |\n| :--- | :---\
  \ |\n| 访问控制 (Access Control) | 23 |\n| 审计与责任 (Audit and Accountability) | 16 |\n\
  | 意识与培训 (Awareness and Training) | 11 |\n| 配置管理 (Configuration Management) | 4 |\n\
  | 应急计划 (Contingency Planning) | 12 |\n| 识别与认证 (Identification and Authentication)\
  \ | 11 |\n| 事件响应 (Incident Response) | 10 |\n| 维护 (Maintenance) | 6 |\n| 媒体保护 (Media\
  \ Protection) | 8 |\n| 物理环境保护 (Physical and Environmental Protection) | 19 |\n|\
  \ 规划 (Planning) | 6 |\n| 人员安全 (Personnel Security) | 8 |\n| 风险评估 (Risk Assessment)\
  \ | 5 |\n| 系统与服务获取 (System and Services Acquisition) | 20 |\n| 系统与通信保护 (System and\
  \ Communications Protection) | 4 |\n| 系统与信息完整性 (System and Information Integrity)\
  \ | 16 |\n| 程序管理 (Program Management) | 16 |\n\n#### 程序性控制\n\n许多程序性控制是通过高层实施的，这意味着它们是书面文件。程序性控制的示例包括：\n\
  \n*   **策略与程序（Policies and procedures）**——这种控制可能是安全策略。例如，它可以是备份服务器。\n*   **安全计划（Security\
  \ plans）**——这些计划是全面的，帮助组织应对诸如地震或地震等事件。\n*   **保险（Insurance）**——保险可以降低风险的影响。常见的例子包括火灾险和洪水险。\n\
  *   **人员检查（Personnel checks）**——组织可能制定相关政策对人员进行不同类型的检查；可能包括背景检查或财务检查。\n*   **意识与培训（Awareness\
  \ and training）**——许多组织定期采取措施提高人员的安全意识，这可以通过例如正式培训、海报和电子邮件来实现。\n*   **行为准则（Rules\
  \ of behavior）**——许多组织使用行为准则，也称为可接受使用策略（AUP），让人们知道他们可以在计算机和系统上做什么。AUP 通常是用户在入职时阅读并签署的文档。通常要求员工定期审查这些文档，例如每年一次。\n\
  \n### ![](img/Note.png)备注\n\n旧版本的 NIST SP 800-53 将程序性控制称为管理控制。\n\n#### 技术性控制\n\n\
  技术性控制使用计算机或软件来保护系统。技术性控制的优点是它是自动化的，这意味着只需设置一次，即可持续执行该控制措施。\n\n技术性控制的一些示例是：\n\n*\
  \   **登录标识符（Logon identifier）**——用户在获得系统访问之前之前提供凭据，这也被称为认证。存在三种主要的认证因素：\n    * \
  \  用户知道的，例如用户名和密码\n    *   用户拥有的，例如智能卡\n    *   关于用户的（生物特征），例如通过生物识别采集的信息\n*   **会话超时（Session\
  \ time-out）**——许多系统在空闲一段时间后会自动超时。例如，受密码保护的屏幕保护程序会在几分钟后锁定计算机。当时间过去后，屏幕保护程序启动，用户必须输入凭据才能再次访问系统。\n\
  *   **系统日志（System logs）**——系统日志记录由系统、用户或攻击者执行的操作。例如，系统日志可以识别服务器何时关闭，以及特定服务何时停止或启动。应用程序日志可以记录特定的应用程序活动。\n\
  *   **审计追踪（Audit trails）**——许多类型的审计日志可以创建审计追踪。安全日志可以记录对特定文件的所有访问，防火墙日志可以记录进入或离开网络的所有流量。\n\
  \n\n\n\n\n*   **输入验证**——应用程序在使用数据之前，可以使用数据范围和合理性检查对数据进行验证。一个简单的例子是，除以零是不可能的。接受用于除法操作的值的程序可以在使用该值之前确保该值不为零。\n\
  \n*   **防火墙**——网络防火墙可以控制进入和离开网络的流量。基于主机的防火墙可以限制单个系统的流量。\n\n*   **加密**——数据在存储于驱动器或通过网络传输时可以进行加密，从而提供数据的机密性。\n\
  \n### 物理控制\n\n物理控制控制物理环境。物理控制包括用于限制物理访问的锁和安保人员，以及控制环境的要素，例如加热和冷却系统。\n\n物理控制的示例有：\n\
  \n*   **锁住的门**——可以锁上机房以保护服务器，托管路由器和交换机的布线间也可以锁上。还可以通过锁上门和文件柜来保护专有数据，例如员工文件或研究数据。\n\
  \n*   **安保人员和访问日志**——可以聘请安保人员控制敏感区域的访问，例如建筑正门或内部区域，并可以使用访问日志列出获得授权访问的个人。安保人员仅允许此列表上的人员进入。访问日志也可用于记录访问过房间的人员。\n\
  \n*   **摄像头**——摄像头可以持续监控某些区域。闭路电视（CCTV）系统作为威慑手段非常好，因为许多 CCTV 系统可以录制来自多个摄像头的数据。\n\
  \n*   **火灾检测和灭火**——火灾可以在短时间内破坏大量数据和硬件。有效的检测和灭火系统能在火势过大之前对其进行检测，然后迅速将其扑灭。\n\n*  \
  \ **漏水检测**——某些区域容易发生洪水。当检测到水时，可以自动启动水泵排除水。如果洪水无法控制，检测系统可以关闭电气系统以减少可能的损坏。\n\n*  \
  \ **温度和湿度检测**——系统需要在特定的温度范围内运行。如果温度过高，电气元件会过热并发生故障。高湿度会导致系统产生凝露，这也可能导致故障。暖、通风和空调（HVAC）系统控制温度和湿度。\n\
  \n*   **电气接地和断路器**——适当的接地确保在电气系统故障时将危险电压引至地。接地保护设备和人员，而断路器保护系统和布线。当故障导致过流时，断路器将在过流引起火或损坏设备之前切断电源。\n\
  \n### 根据评估需求选择方法论\n\n一旦单独识别并评估了各个要素，就需要计算相关风险。可以使用的两种主要方法论是：\n\n*   定量风险评估\n\n*\
  \   定性风险评估\n\n## 定量方法\n\n定量方法使用预定义的公式。收集的数据用于识别以下数值：\n\n*   受影响因子 (EF)——`EF` 描述了由于威胁导致资产将发生的损失，以百分比值表示。\n\
  \n*   单次损失预期 (SLE)——`SLE` 是任何单次事件的预期损失。它以货币形式表示，例如 $1,000。资产价值 (`AV`) 乘以 `EF` 等于\
  \ `SLE`。\n\n*   年发生率 (ARO)——这是预计威胁在一年内发生的次数。\n\n*   年度损失预期 (ALE)——`ALE` 是一年的总预期损失。其计算方法为\
  \ `SLE * ARO`。\n\n*   保护措施价值——这是安全控制提供的损失减少量。其计算方法为 `ALE (控制前) - ALE (控制后)`。\n\n\
  \n\n\n概率和影响允许对风险进行排序。这种排序允许对最重要和不重要的风险进行优先级排序。\n\n在例例中，正在对 Web 服务器的缓冲区溢出攻击、SQL 注入攻击和网页篡改进行评估。根据保护服务器的现有控制措施，专家提供了表\
  \ 6-2 所示的数据。\n\n**表 6-2** 现有控制措施的定性分析调查\n\n![](img/Table6-2.png)\n\n这些风险中的每一个都可以进行优先级排序：\n\
  \n*   `Buffer overflow`（缓冲区溢出）——风险分 5。计算方法为 `.10 × 50`。\n*   `SQL injection attacks`（SQL\
  \ 注入攻击）——风险分 67.5。计算方法为 `.75 × 90`。\n*   `Web defacing`（网页篡改）——风险分 6.25。计算方法为 `.25\
  \ × 25`。\n\n表 6-2 中的信息清楚地表明，基于现有控制措施的风险来自 SQL 注入攻击。现在，可以确定缓解此风险的控制措施。\n\n然后，可以咨询专家以确定将提供最佳收益的控制措施。可以使用类似的调查来确定在实施控制措施后风险的概率和影响。\n\
  \n# 制定缓解建议\n\n在执行分析后，可以向管理层提供具体的建议。这些建议应该降低风险。可以包含收集的数据以支持这些建议。\n\n支持性数据可能包括：\n\n\
  *   威胁/漏洞对\n*   实施成本和时间的预估\n*   运营影响预估\n*   成本效益分析\n\n## 威胁/漏洞对\n\n建议的控制措施应该针对特定的风险。当威胁利用漏洞时，风险就会产生。如果不存在可以利用漏洞的威胁，则风险就不存在。同样，如果不存在威胁可以利用的漏洞，风险就不存在。\n\
  \n例如，恶意软件是一个非常真实的威胁。然而，如果创建了一个永远不会连接互联网或不从其他源接收数据的隔离系统，那么它就是脆弱的。在这个例中，并不存在威胁/漏洞对，因为威胁无法与漏洞匹配。相比之下，典型的计算机系统可以访问互联网、接收电子邮件并允许用户连接通用串行总线（`USB`）设备，所有这一切使其非常脆弱。\n\
  \n控制措施需要针对特定的威胁/漏洞对。每项建议都将处理一个或多个威胁/漏洞对。如果控制措施无法与威胁/漏洞对关联，则该控制措施是没必要的，这成了验证控制措施有效性的简单检查方法。\n\
  \n这也可以与物理控制进行类比。如果计算机实验室由于是有意还是无意未锁门，那么人类威胁就可以利用未锁的实验室获得对其中计算机的访问权限。风险源于威胁（人类）利用漏洞（未锁的门）来损害资产（实验室计算机及其包含的信息）。为了控制这一点，实验室的门和计算机必须锁好并仅供授权的人员使用。此外，还可以安装\
  \ CCTV 摄像头作为额外的控制机制。\n\n许多控制措施将涉及多个威胁/漏洞对。如果该控制措施可以缓解多个对，则应该列出每一对。\n\n#### 实施成本和时间的预估\n\
  \n控制措施的成本应包含在建议中，并包含在 CBA（成本效益分析）中。通过包含直接成本和间接成本来准确识别这些成本是重要的。\n\n直接成本仅仅是购买控制措施的费用。然而，间接成本并不总是容易识别的。例如，间接成本可能包括学习该控制措施所需的劳动以及培训成本。\n\
  \n一个常见的错误是低估了实施控制措施所需的成本。例如，一个复杂的防火墙可能需要接受过培训的管理员。如果获取了防火墙但管理员没有使用它的知识，它就会被闲置。管理员随后需要自己精通它或参加正式课程。在此期间，防火墙会一直待在箱子里。\n\
  \n还应该包含实施控制措施的时间表或时间。对于简单的控制措施，时间可以忽略不计。对于其他控制措施，时间可能会非常长。例如，决定在用户登录时增加安全性。。不再使用用户名和密码，而是使用智能卡，这将需要分阶段进行。需要添加公钥基础结构（`PKI`）来颁发证书，并在所有系统中添加读卡器。然后，就可以向用户发放智能卡了。\n\
  \n#### 运营影响预估\n\n有时，控制措施消耗过多的系统资源，导致系统无法执行其主要工作。如果控制措施对系统的正常运行有任何影响，它就具有运营影响。控制措施的运营影响可以被确定为微小的、低的、中的、高的或压倒性的。理想情况下，控制措施对正常运行的影响非常小。如果影响太大，该控制措施可能无法使用。在制定建议时，考虑运营影响很重要。\n\
  \n任何计算机系统都有四种主要资源。如果控制措施产生运营影响，该影响通常会出现在这些资源中：\n\n*   `Processor`（处理器）——处理器执行大部分计算工作。桌面\
  \ PC 通常具有单核处理器，服务器通常具有多个处理器。控制措施可能会消耗大量的处理能力。如果服务器处理器的使用率接近 100%，系统将变得极其缓慢。\n* \
  \  `Memory`（内存）——处理器只能与内存中的数据一起工作。系统内存量通常是一个限制因素。如果系统内存不足，它会在内存和磁盘之间交换数据。\n*   `Disk`（磁盘）——磁盘系统的容量和速度需要考虑。控制措施通常需要一定的磁盘空间。此外，数据存储在磁盘上直到处理器需要。当处理器需要数据时，它将其交换到内存中。如果磁盘速度慢，交换数据可能会降低速度。\n\
  *   `Network interface card`（网卡）——计算机使用网卡访问网络资源。如果所考虑的控制措施将在网络传输数据，则应考虑网卡的当前带宽。\n\
  \n\n\n\n\n应当包含 `CBA`（成本效益分析）来支持所有建议，因为这证明了成本是合理的。理想情况下，`CBA` 将显示前期投入少量的资金从长期来看可以节省大量的资金。`CBA`\
  \ 是管理层证明成本合理性的重要工具。\n\n如前所述，定量风险评估包含金额数字，这些数字可以用于 `CBA`。另一方面，定性风险评估不包含直接的金额数字。因此，在使用定性风险评估时，需要采取额外的步骤来创建\
  \ `CBA`。\n\n## 演示风险评估结果\n\n风险评估完成后，将创建一份记录结果的报告。该报告应包含两个阶段。\n\n在第一阶段，将建议提交给负责决定实施哪些建议的经理，他们可能不会批准每一项建议。\n\
  \n经理可能会认为某项建议的 `CBA` 无法证明其成本是合理的。对于另一项建议，他们可能决定想要接受该风险。在实施控制措施后剩余任何风险都是残差风险。由于经理决定实施哪些控制措施，他们也对残差风险负责。\n\
  \n在第二阶段，将记录经理做出的决策。然后，创建一个行动计划和里程碑（`POAM`）。`POAM` 可用于跟踪和监控控制措施。它有助于确保控制措施的实施，并有助于跟踪实际成本。\n\
  \n# 执行风险评估的最佳实践\n\n为了确保执行风险评估时取得成功，可以采取若干步骤。以下列表列出了执行风险评估的最佳实践：\n\n*   **确保系统被完整描述**——描述包括系统的运行特性和使命。确保数据的实效性非常重要，因为\
  \ IT 系统会随着升级和改进而发生变化。如果不使用当前的文档，就会浪费资源。\n*   **审查过去的审计**——如果执行过审计，请确保审查了审计结果。审计会识别漏洞，并通常包含具体的建议。这些建议应当已经实施，或者已在计划中。\n\
  *   **审查过去的风险评估**——如果进行过之前的风险评估，则应对对其进行审查。某些系统会定期进行评估，例如每年或每三年一次。这些信息可以进行审查并与近期活动进行比较。例如，新的威胁或漏洞可能导致之前未解决的停机。\n\
  *   **将风险评估与管理结构匹配**——风险评估应根据系统的所有权或责任归进行。当风险评估跨越管理层时，实施控制措施会比只有一个所有者时更加困难。\n* \
  \  **识别风险评估边界内的资产**——在识别资产时，确保仅包含风险评估范围内的资产。这将有助于消除范围蔓延。\n*   **识别和评估相关威胁**——应仅评估相关的威胁。可以审查历史数据以确定哪些威胁在过去引起过问题。`threat\
  \ modeling`（威胁建模）也可用于识别威胁。\n*   **识别和评估相关漏洞**——存在许多缺陷，但并非所有缺陷都应包含在，仅包含与风险评估相关的。\n\
  *   **识别和评估控制措施**——确保所有控制措施都与至少一个威胁/漏洞对相关，并且 `CBA` 证明了控制措施成本的合理。\n*   **跟踪结果**——记录风险评估的结果和批准的建议，并创建一个\
  \ `POAM` 来跟踪建议的实施情况。\n\n## 章节总结\n\n风险评估的执行涉及几个特定步骤。对要评估的系统有清晰的定义是第一步。只要可能，就考虑管理结构，以确保建议于实施。\n\
  \n接下来，识别威胁和漏洞。相关的威胁/漏洞对识别出实际风险。然后，评估减轻这些风险的控制措施。这些建议同 `CBA` 一起提交给管理层做出决策。最后，使用 `POAM`\
  \ 来跟踪已批准的建议。\n\n## 关键概念和术语\n\n*   资产估值\n*   审计跟踪\n*   黑名单\n*   变更管理\n*   配置管理\n\
  *   控制\n*   应对措施\n*   利用评估\n*   组策略\n*   基于主机的入侵检测系统 (HIDS)\n*   现地控制\n*   运营影响\n\
  *   计划控制\n*   程序控制\n*   威胁建模\n*   漏洞评估\n*   白名单\n\n## 第 6 章评估\n\n1. 一家公司正在对某系统进行风险评估。系统的\\\
  _\\_\\_\\_\\_ 特性和使命应该在风险评估早期定义。\n   1. 战术性的\n   2. 战略性的\n   3. 运营的\n   4. 愿景性的\n\
  \n2. 在风险评估期间，应该识别以下哪些项？\n   1. 资产\n   2. 威胁\n   3. 漏洞\n   4. 控制措施\n   5. 以上所有\n\n\
  3. 在下各项中，哪项被视为资产？\n   1. 硬件\n   2. 软件\n   3. 人员\n   4. 数据和信息\n   5. 以上所有\n\n4. 在定义风险评估的系统时，应该包含什么？\n\
  \   1. 系统的标题\n   2. 系统的当前配置\n   3. 可能的攻击列表\n   4. 之前的风险评估列表\n\n5. 以下哪项*不*包含在风险评估中？\n\
  \   1. 组织使命\n   2. 人\n   3. 国家\n   4. 风险管理\n   5. 以上\n\n6. 哪种类型的评估可以在不利用漏洞的情况下识别漏洞？\n\
  \   1. 漏洞评估\n   2. 风险评估\n   3. 利用评估\n   4. 渗透测试\n\n7. 可接受使用政策是\\_\\_\\_\\_\\_ 控制措施的示例。\n\
