  \n合规是当今信息技术（IT）领域的一个重要课题。如果有任何法律或指南约束一个组织，该组织就需要确保其合规性，因为不合规的代价可能非常高。验证合规性的第一步是识别适用于组织的相关法律和指南，然后对适用的条款进行组织内部的合规性评估。\n\
  \n## 第 10 章主题\n\n本章涵盖了以下主题和概念：\n\n*   组织应该从哪里开始风险缓解\n*   组织的风险管理范围是什么\n*   如何理解和评估法律及合规问题对组织的影响\n\
  *   如何转化法律和合规对组织产生的影响\n*   如何评估法律和合规影响对典型 IT 基础设施七个领域的影响\n*   如何评估安全防御措施和保护措施如何协助风险缓解\n\
  *   法律和合规要求的运营影响是什么\n*   如何为整个组织识别风险缓解和风险降低要素\n*   什么是成本效益分析\n*   在组织范围内规划风险缓解的最佳实践是什么\n\
  \n## 第 10 章目标\n\n完成本章学习后，你将能够：\n\n*   描述组织应该如何开始风险缓解\n*   识别组织内部的风险管理范围\n*   将风险管理范围概念应用于关键业务运营\n\
  *   将风险管理范围概念应用于客户服务交付\n*   将风险管理范围概念应用于任务关键型业务系统、应用程序和数据访问\n*   将风险管理范围概念应用于典型\
  \ IT 基础设施的七个领域\n*   将风险管理范围概念应用于系统安全漏洞\n*   评估组织内部法律和合规问题的影响\n*   列出适用于组织的合规法律、法规和指令\n\
  *   描述组织内部的法律和合规影响\n*   描述法律和合规影响对典型 IT 基础设施七个领域的影响\n*   评估协助风险缓解的安全防御措施和保护措施\n\
  *   描述法律和合规要求的运营影响\n*   列出风险缓解和风险降低要素\n*   描述成本效益分析\n*   列出组织范围内规划风险缓解的最佳实践\n\n\
  ## 组织应该从哪里开始风险缓解？\n\n组织应该从识别资产开始。资产清单有助于其确定系统、服务和数据的价值。资产的价值可以是金钱，也可以是相对。例如，可以为资产分配高、中、低等价值。这些价值并不等同于设备成本，还包括资产受损、离线或丢失时可能对业务的影响。该价值并非任何特定风险的计算影响，因为该价值会随不同问题发生巨大变化，而这种评估稍后进行。\n\
  \n例如，资产清单可能会得出以下优先级：\n\n*   数据库服务器—高\n*   文件服务器—高\n*   邮件服务器—高\n*   网络基础设施—高\n*\
  \   Web 服务器—中\n*   用户桌面系统—中\n*   用户笔记本电脑—低\n\n![](img/Note.png) 注意\n\n此列表并非所有资产的完整列表。相反，它提供了组织如何优先考虑资产的示例。\n\
  \n接下来是识别并分析威胁和漏洞，这是通过威胁评估、漏洞评估和利用完成的。可以对资产进行威胁和漏洞评估。例如，提问包括：\n\n*   `confidentiality`——数据敏感吗？\n\
  *   `integrity`——数据准确吗？\n*   `availability`——服务可访问吗？\n\n美国国家标准与技术研究院（NIST）特别出版（SP）`800-53`\
  \ 包含了关于控制的广泛文档。如果这些控制适用于组织，则应将其纳入计划。接下来，对这些控制进行评估，以确定哪些应该实施。这一步骤的重要部分是进行成本效益分析（`CBA`），这将在后文中介绍。\n\
  \n## 组织的风险管理范围是什么？\n\n风险管理范围指一个关注领域，也可以被视为控制领域。某些事物是可以控制的，而另一些则不能。例如，飓风和地震是无法的，但可以通过规划组织如何应对来减轻其影响。\n\
  \n### 参考信息\n\n范围确定了项目的边界。不识别范围最大的问题是范围蔓延（scope creep）。当项目目标或交付物在不受控制的情况下增长时就会发生范围蔓延。例如，人员可能在低价值资产上花费精力和资源，而牺牲了高价值资产的利益。如果项目范围得不到控制，项目可能会消耗比需要更多的资源、产生更高成本并花费更多时间。在风险管理的情况下，边界可能会超出管理风险的可用资源或时间，导致组织无法识别或评估新风险，而已评估的风险得不到响应。\n\
  \n在考虑组织内部的风险管理范围时，请考虑以下事项：\n\n...#### `关键业务运营`\n\n风险管理的早期步骤是识别哪些业务运营是关键的。这些业务运营是必须保持正常以确保组织生存的运营。\n\
  \n业务影响分析（`BIA`）是此步骤使用的关键工具。它帮助组织识别当各种风险发生时对业务的影响。\n\n`BIA` 的关键要素之一是识别直接和间接成本。直接成本反映了停机的直接成本。例如，如果\
  \ Web 服务器故障且无法处理销售，期间损失的销售额就是直接成本。间接成本包括客户信誉的损失以及恢复该信誉的成本。\n\n这些成本有助于确定服务或功能的优先级。如果停机成本很高，那么花钱防止停机就是合理的。\n\
  \n\n\n\n\n业务影响分析（BIA）确定了最大接受中断时间（MAO)。MAO 是系统或服务在影响任务之前允许停机的最长时间。MAO 也称为最大可忍中断时间（MTO）或最大可忍中断期限（MTPOD）。\n\
  \n#### ![](img/Tip.png)提示\n风险管理必须由业务需求驱动，这意味着管理的风险是那些具有影响业务潜力的风险。管理此范围之外风险的成本是不正当的。\n\
  \nMAO 直接影响恢复时间。例如，如果某个系统的 MAO 为 30 分钟，这意味着恢复计划必须能够在 30 分钟内恢复故障的系统。\n\nBIA 的很大一部分工作是数据收集。可以通过查阅可用报告和访谈人员来收集数据。\n\
  \n在完成特定服务或功能的 BIA 时，应回答以下关键问题：\n\n* 该服务对如何影响组织的盈利能力？\n* 该服务如何影响组织的生存能力？\n* 该服务如何影响组织的形象？\n\
  * 停机将如何影响员工？\n* 停机将如何影响客户？\n* 该服务何时需要可用？\n* 该服务的 MAO 是多少？\n\n##### 客户服务\n风险管理包括对组织向客户提供的服务的评估。在这种背景下，客户是指任何接收服务的实体。\n\
  \n明显的客户是指购买组织的服务的群体。例如，如果组织为小企业提供电子邮件服务，那么这些小企业就是该组织的客户。这些企业不再管理自己的电子邮件服务器，而是将服务外包给该组织。\n\
  \n这些客户对该服务有预期。他们可能期望电子邮件每天 24 小时每周 7 天可用。或者，他们可能只期望在工作时间内访问电子邮件。无论何种情况，识别他们的预期至关重要。\n\
  \n服务水平协议（SLA)是一份识别预期性能水平的文档，其中包含了最小运行时间或最大停机时间。组织将 SLA 作为服务提供商与客户之间的合同。SLA 可以规定在未满足协议条款时，违约方应支付的金钱罚款。\n\
  \n如果一个组织与其他组织签有 SLA，则应将它们纳入风险管理审查中，并特别关注任何金钱罚款。例如，SLA 可能规定四小时的最大停机时间（即 MAO），之后将开始按小时累计罚款。当然，承诺低水平停机的\
  \ SLA 成本更高。收取这些额外费用是为了支付提供更高级服务所需的额外控制费用。\n\n不那么明显的客户是内部客户。任何接收服务的员工或部门都是客户。以下是提供给内部员工的一些常见服务：\n\
  \n* 电子邮件服务\n* 访问互联网\n* 网络访问\n* 服务器应用程序（如数据库服务器）\n* 访问内部服务器（如文件服务器）\n* 桌面电脑支持\n\n\
  #### ![](img/Note.png)注意\n组织内部的实体通常有类似于 SLA 的协议，但这些协议更非正式，且不包含金钱罚款。例如，远程办事处可能与总部达成协议，在工作时间期间提供虚拟专用网络（VPN）服务。\n\
  \n员工不会与 IT 部门签署 SLA，但他们对相关服务有预期。如果任何服务故障时间过长，停机将开始影响员工履行工作的能力，反过来又影响组织的任务。通过识别停机影响任务的时间范围，就可以确定\
  \ MAO。\n\n仅仅因为某项服务没有外部客户，并不意味着它应该被忽视。许多服务是内部客户所需要的。\n\n##### 任务关键业务系统、应用程序和数据访问\n\
  许多组织拥有任务关键的系统、应用程序和数据。当这些关键资产不可用时，任务就会受到影响。因此，在审查风险管理和风险缓解计划时，识别并审查这些资产至关重要。\n\n\
  任务关键业务系统是指对组织不可或缺的任何系统或过程。识别这些系统需要对业务深入理解，可以通过首先识别组织的关键业务功能（CBFs)](29_glossary.xhtml#gloss49）来帮助。\n\
  \nCBF 是任何被认为对组织至重要的功能。如果 CBF 失败，组织将失去执行基本操作的能力（如向客户销售）。如果组织无法执行该功能，将通过收入损失或间接损失导致亏损。\n\
  \nCSF 是执行组织任务所需的任何元素。组织会有几个要素必须成功，组织才能成功。例如，对于今天的许多公司来说，可靠的网络基础设施可能被视为一个 CSF。如果网络基础设施故障，通信就会停止。\n\
  \nCBF 由几个元素支持。例如，一个组织在互联网上销售产品。图 10-1,10-2 和 10-3 显示了完整交易中不同的支持元素。通过分析这些元素，可以识别\
  \ CBF。\n\n在图 10-1 中，客户进行购买。在这个例子中，客户从互联网 Web 服务器购买商品，后端数据库服务器记录交易。\n\n```\n![图 10-1\
  \ 关键业务功能：购买](img/9781284183719_CH10_FIGF01.png)\n```\n**图 10-1** 关键业务功能：购买\n\n这里的\
  \ CBF 有：\n\n* 互联网访问——Web 服务器必须有可靠的互联网访问。如果访问失败，客户将无法访问 Web 服务器。\n* Web 服务器可用性——Web\
  \ 服务器必须运行，包括 Web 服务器和 Web 应用程序。如果 Web 服务器故障，客户将无法完成购买。\n* 数据库服务器可用性——数据库服务器记录交易，包括客户、购买的产品和支付信息。如果数据库服务器故障，Web\
  \ 应用程序将无法完成交易。\n\n图 10-2 显示了如何接收付款。虽然支付处理通常作为交易的一部分发生，但为了清晰起见，将其分开。信用卡交易在互联网上很常见，使用这些的组织必须遵守支付卡行业数据安全标准（PCI\
  \ DSS）以进行处理。\n\n```\n![图 10-2 关键业务功能：接收资金](img/9781284183719_CH10_FIGF02.png)\n\
  ```\n**图 10-2** 关键业务功能：接收资金\n\n这一步需要与购买步骤相同的 CBF，以及一个额外的元素。需要符合 PCI DSS 标准，这确保了组织满足了信用卡数据的最低安全标准。如果组织不符合\
  \ PCI DSS 规定，可能会失去处理信用卡的能力并被处以罚款。\n\n\n\n\n\nPCI DSS 将在本章后续的“法律要求、合规法律、法规和指令”部分中进行讨论。\n\
  \n`图 10-3` 显示了流程的最后一步，即人员使用仓库应用程序识别要发运的产品。该应用程序与数据库服务器交互，该服务器包含购买产品、客户和产品位置的详细信息。然后，仓库人员将产品发给客户。\n\
  \n![图 10-3 关键业务功能：发运产品](img/9781284183719_CH10_FIGF03.png)\n\n`图 10-3` 关键业务功能：发运产品。\n\
  \n这一步骤包含几个额外的关键业务功能（CBFs）：\n\n* **仓库应用程序服务器**——该应用程序必须对人员可用，并能够与数据库服务器交互。如果应用程序不可用，人员将无法识别要发运的产品，从而导致发货停止。\n\
  * **数据库服务器**——需要数据库服务器来识别要发送哪些产品以及发货位置的详细信息。如果无法获取该服务器的数据，发货将停止。\n* **人员**——人员负责包装和发运购买的产品。如果人员不可用，发货就会停止。即使组织已经能够实现某些功能（如检索产品），仍需要人员来完成流程。此外，人工交互对于质量控制非常有价值。\n\
  * **仓库**——产品在仓库中存储并发运。如果仓库受损，将影响到两个方面。首先，库存可能会丢失。例如，火灾可能会破坏仓库中的部分或全部库存。其次，发运可能会停止或减慢。如果发运区域损坏，发运可能会完全停止。如果产品损坏，这些产品的发运将延迟。\n\
  \n### ![](img/Tip.png) 提示\n\n仓库数据库服务器持有与 Web 数据库服务器大部分的数据，但它们可能是独立的服务器，因为它们的可用性需求不同。Web\
  \ 应用程序需要一直运行，而仓库应用程序只需要在人员发运货物时可用。自动化技术会定期将数据从 Web 数据库移动到仓库数据库服务器。\n\n确定 CBF 后，现在可以转向风险管理。可以对这些功能中的每一个进行审查，以确保已采取充分措施来保护它们。\n\
  \n注意，某些功能需要不同层次的保护。例如，Web 服务器和 Web 数据库服务器需要一直运行，这使得它们的最大允许中断（MAO）很短。服务器可能需要备用集群，以确保即使服务器故障，服务也能继续运行。然而，发运可能每周只在白天进行，这意味着仓库服务器不需要与\
  \ Web 服务器和 Web 数据库服务器相同级别的保护。该服务器的 MAO 将长得多。\n\n### 典型 IT 基础设施的七域\n\n也可以对典型 IT 基础设施的七域进行审查以识别风险。通过查看这些领域的每一个一个，可以确定组织所需的风险管理范围。`图\
  \ 10-4`\n\n`图 10-4` 典型 IT 基础设施的七域。\n\n### 用户域\n\n每个组织都有用户，因为尽管计算机可以做很多工作，但它们还无法完成一切。相反，计算机被用于支持用户。因此，查看与用户域相关的风险是非常重要的。与用户相关的主要风险与社会工程有关，这涉及社会工程师试图欺骗用户交出信息或执行不安全的操作。\n\
  \n这些风险可以通过提高用户意识来缓解。提高用户意识可以包括建立可接受使用策略（`AUP`），这有助于确保用户知道他们应该做什么和不该做什么；使用登录横幅提醒用户\
  \ `AUP`；偶尔发送带有安全小贴士的电子邮件以让用户保持安全意识；以及在员工区域张海告示以帮助提高意识。\n\n### 工作站域\n\n工作站域由用户将使用的计算机组成。在某些组织中，所有员工桌上都有电脑，但在另一些组织中，台式电脑可能是有限的。例如，仓库中的并不是每个用户都需要计算机。\n\
  \n然而，当用户确实拥有计算机时，计算机就面临风险。与工作站相关的某些主要风险与恶意软件有关。用户可以通过通用串行总（`USB`）闪存盘从家里带来恶意软件，可能无意中从网站下载恶意软件，或者从恶意邮件中安装恶意软件。\n\
  \n计算机的主要保护措施是确保安装防病毒软件并定期更新防病毒特征，因为不能依靠用户来保持其特征更新。许多防病毒软件供应商提供工具，可以在工作站上自动安装和更新软件。\n\
  \n操作系统也必须保持更新。当安全补丁可用时，应根据需要对其进行评估和部署。许多此类安全补丁消除了漏洞；因此，如果没有补丁，系统将处于易受状态。就像有工具可以确保防病毒软件保持更新一样，也有工具可以保持系统补丁。\n\
  \n#### LAN 域\n\nLAN 域包括连接局域网（`LAN`）上系统的网络组件。这些组件包括硬件，如路由器和交换机，以及用于连接用户到 LAN 的布线和配线间。\n\
  \n计算机通常通过服务器访问网络资源。例如，在微软环境中，客户端连接在微软网域中，该网域包含至少一个作为域控制器的服务器。在微软网域中，每个用户都必须有一个账户来登录域，每台计算机在域中也一个账户。\n\
  \nLAN 域面临巨大的风险。路由器具有访问控制列表（`ACLs`），用于控制允许通过的流量，交换机也可以编程实现特定功能。\n\n路由器和交换机通常位于配线间或服务器房内，这有助于确保它们受到物理安全性的保护。如果攻击者不受限制地访问这些设备，`ACLs`\
  \ 可能会被修改，或者攻击者可以连接无线访问点以捕获并传输通过任何这些设备的流量。\n\n许多组织还实施端口安全作为附加控制。端口安全确保只有特定的计算机能够连接到网络设备，这意味着如果攻击者带来一台计算机，他或她将无法将其连接到网络。\n\
  \n#### LAN 到 WAN 域\n\nLAN 到 WAN 域标记了私有网络与公共网络相接的边界。在这种下，公共网络是互联网。\n\n多种攻击来自互联网。这里主要的保护措施是使用一个或多个防火墙。防火墙可以检查通过其的流量并根据规则允许或阻止流量。\n\
  \n尽管大多数组织都部署了防火墙，但这里的主要问题是防火墙的管理。常见问题是防火墙规则过多，允许了过流量。防火墙应该进行区分并仅允许某些类型的流量。\n\n\n\
  \n\n组织通常使用非常复杂的硬件防火墙。管理员通常需要额外的培训，以确保他们知道如何管理和维护这些设备。经过培训的管理员理解限制防火墙规则数量的重要性。\n\n\
  ## WAN 域 (WAN Domain)\n\nWAN 域包括所有可以通过广域网（WAN）访问的系统。这些系统主要指可以通过互联网访问的服务器。\n\n互联网上的可用服务器具有公网网协议（IP）地址。它们可以从互联网上的任何系统访问，这使得它们容易成为攻击目标。\n\
  \n保护 WAN 域系统的一种主要方法是使用非军事化区（DMZ）。DMZ 使用两个防火墙，其中一个直接连接互联网，另一个直接连接内部网络。两个防火墙之间的区域被称为\
  \ DMZ。\n\n### ![](img/Note.png)注意\n\nWAN 域还可以包括通过半有 WAN 链路访问的系统，这种链路是半私有的。例如，一个组织可以从电信公司租赁线路，其他客户也会共享这些线路。这些线路不像互联网那样公开，但该组织的系统仍然受到租用相同线路的其他客户的攻击。\n\
  \n尽管 DMZ 无法阻止攻击者访问服务器，但它可以限制攻击者的访问权限。例如，可以将 Web 服务器放置在 DMZ 中托管网站。不安全和安全的 Web 服务器都使用超文本传输协议（HTTP）。HTTP\
  \ 和安全超文本传输协议（HTTPS）的常用端口分别为 `80` 和 `443`。可以配置 DMZ 仅允许通过 `80` 和 `443` 端口流量访问 Web\
  \ 服务器，并阻止所有其他流量。\n\n这些服务器还需要保持更新。当发布安全补丁时，应尽快进行评估并进行测试，以确保它们不会产生任何负面影响，之后再部署到服务器。\n\
  \n### ![](img/Note.png)注意\n\nDMZ 通常使用两个防火墙。面向用户的服务器配置在防火墙之间的 DMZ 中。\n\n## 远程访问域\
  \ (Remote Access Domain)\n\n远程访问域允许远程用户访问私有网络。如果远程访问服务器是拨号服务器，用户就可以拨号接入。虽然拨号服务器不再常见，但它们仍然在使用。一种更流行的选择是\
  \ VPN，它允许用户通过公共网络（如互联网）访问私有网络。\n\n使用拨号远程访问服务器的组织需要意识到系统从任何电话访问所带来的风险，这意味着攻击者只需要知道电话号码就可以攻击。使用\
  \ VPN 服务器的组织还需要意识到 VPN 服务器具有可以在互联网任何地方公开访问的 IP 地址所带来的风险，这使其容易受到世界任何地方的攻击。\n\n可以使用几种不同的控制措施来保护远程访问域中的服务器。自动回拨是拨号远程访问服务器使用的一种方法，尽管这种方法在今天很少使用。例如，Sally\
  \ 在家中工作。她的账户信息包括电话号码。当她拨号时，系统会提示她登录。一旦她登录，远程服务器就会挂断并拨打她的家庭电话。\n\n远程访问策略是另一种用于远程访问的控制措施。策略用于指定多个条件以确保连接安全。例如，策略可以规定仅允许二层隧道协议（`L2TP`）连接。此外，可能需要\
  \ IP 安全协议（`IPSec`）来加密连接。\n\n### ![](img/Note.png)注意\n\n定位远程访问服务器的一种旧技术是战争拨号（war\
  \ dialing）。攻击者随机拨号直到调制解调器响应。一旦调制解调器响应，攻击者就会尝试登录。\n\n远程访问监控是另一种用于远程访问的控制措施。它报告远程用户的活动，包括他们在\
  \ VPN 连接期间的状态。监控控制台用于跟踪客户端连接，包括各种服务器配置的连接数量和持续时间。\n\n## 系统/应用域 (System/Application\
  \ Domain)\n\n系统/应用域包含基于服务器的应用程序，包括电子邮件服务器和数据库服务器，以及任何具有专用应用程序的服务器或系统。\n\n例如，`Oracle\
  \ Database` 在服务器上托管数据库，`Microsoft Exchange` 是流行的电子邮件服务器，而 `Apache` 在 Web 服务器上托管\
  \ Web 应用程序。这些应用程序每一个都是专门的，并且每个都有独特的风险。它们通常需要专业知识来管理和配置。此外，它们需要关注细节以保持安全。\n\n保持这些系统安全的首要要求是确保管理员拥有足够的培训和知识。此外，配置和变更管理实践也是有的。配置管理确保系统使用良好的安全实践进行配置，而变更管理则确保在没有经过充分审查的情况下不修改配置。\n\
  \n系统应用程序经常有漏洞，供应商在识别出漏洞后会发布安全补丁。这些系统的管理员需要与供应商保持联系，以便在补丁发布时能够知晓。遗憾的是，某些补丁会导致其他问题，例如系统崩溃；因此，管理员通常会测试补丁以确保它们没有任何负面影响，并且在测试后才应用补丁。此外，他们经常使用软件来验证系统是否有当前的补丁。当系统未更新时，软件会向管理员发送警。在某些组织中，网络访问控制（`NAC`）软件会隔离未修复的系统。在软件更新之前，这些系统的访问受到限制。\n\
  \n### 信息系统安全漏洞 (Information Systems Security Gap)\n\n信息系统安全漏洞指的是已实施控制措施与所需控制措施之间的差异。在完美的世界里，现有控制措施将解决所有的威胁和漏洞。然而，威胁和漏洞在不断变化。\n\
  \n## 深度防御 (Defense in Depth)\n\n即使你有激进的风险管理和风险缓解计划，通常仍然存在安全漏洞。要实现 100% 的系统完全安全是不可能的。然而，深度防御\
  \ 是一种增加多层重叠保护的安全实践。即使系统的某层出现漏洞，它也有可能受到其他层面的保护。\n\n例如，防病毒保护通常采用三管齐下的方法。在防火墙上安装防病毒软件以扫描输入数据，在电子邮件服务器上安装以扫描恶意附件或脚本，并在所有工作站和服务器上安装。\n\
  \n\n\n\n风险评估提供了一个特定时间点的报告。它可以用于将现有的威胁和漏洞与现有的控制措施进行比较。即使上一次风险评估是完美的，它也无法解决风险评估完成后出现的威胁和漏洞。\n\
  \n在处理法律合规性时，通常会使用差距分析报告。例如，在审查对《健康保险流动性与责任法案》（`HIPAA`）或《萨班斯-奥克斯法案》（`SOX`）的合规情况时，可以使用差距分析报告。差距分析报告记录了安全差距。\n\
  \n差距分析报告应与补救计划结合使用，该计划确定了如何缩小安全差距，即对实施哪些控制措施提供建议。\n\n### 理解并评估法律和合规问题对组织的影响\n\n\
  一个组织必须了解哪些法律和法规适用于自己，因为不合规可能会导致严重后果。某些法律会对组织处巨额罚款，某些法律可能导致监禁，而某些法律可能会对组织的业务能力产生负面影响。一旦确定了相关的法律法规，组织就需要确保其合规性。\n\
  \n在此背景下，合规是一种缓解控制措施。实施控制措施是为了降低风险，其方法是将威胁或漏洞降低或中和到可的水平。\n\n例如，《健康保险流动性与责任法案》（`HIPAA`）对错误的罚款每年高达\
  \ 25,000 美元，而《通用数据保护条例》（`GDPR`）的罚款高达 2200 万美元或企业全球年度营业额的 4%，以较高者为准。内部合规计划可以确保这些昂贵的错误不再发生。在评估组织合规问题的影响时，需要采取两个不同的步骤。第一步是确定适用于组织的合规问题，第二步是评估这些问题对组织业务运营的影响。这两个主题将在接下来的章节中介绍。\n\
  \n### 合规法律的发展\n\n贪婪和腐败渗透到任何地方，包括大型组织。当问题被发现时，人们会感到愤怒并要求正义。在美国，国会颁布法律来提供这种正义。\n\n\
  在过去的几十年里，合规性变得越来越突出。20 世纪 60 年代，通用电气和西屋电气公司因违反多项反垄断条例而被定罪。他们是一场广泛的围投标和价格操纵共谋的一部分。国会于\
  \ 1977 年通过了《美国反海外腐败法》（`FCPA`）作为回应。\n\n1991 年，通过了《美国联邦组织伦理判刑指南》立法。它包含了惩罚组织犯罪行为的条款，以及检测和预防犯罪的威慑激励。\n\
  \n安然公司丑闻发生在 2001 年。一群高管在多年里利用各种策略隐藏了因失败的交易和项目而产生的数十亿美元债务。当他们被揭露时，安然公司的股价从每股 90 美元跌至不足\
  \ 1 美元，导致投资者损失了约 110 亿美元。几名高管被起诉并被判入监狱。\n\nWorldCom 的高管也通过多年来利用各种策略，将公司价值人为推高了约\
  \ 110 亿美元。当首席执行官（`CEO`）于 2002 年 4 月下台时，事情开始崩溃，欺诈行为于 2002 年 6 月被发现。WorldCom 于 2002\
  \ 年 7 月申请破产。\n\n### 法律要求、合规法规和授权\n\n尽管有许多适用于 IT 的法律法规，但并非全部都适用于 IT。因此，首先需要理解的重要问题之一是哪些法律适用于组织。\n\
  \n提醒一下，适用于组织的一些关键法律包括：\n\n*   《健康保险流动性与责任法案》（`HIPAA`）\n*   《萨班斯-奥克斯法案》（`SOX`）\n\
  *   《联邦信息安全管理法》（`FISMA`）\n*   《联邦信息安全现代化法》（`FISMA`）\n*   《家庭教育权利与隐私法》（`FERPA`）\n\
  *   《儿童互联网保护法》（`CIPA`）\n*   《支付卡行业数据安全标准》（`PCI DSS`）\n*   《格姆-莱奇-布莱利法》（`GLBA`）\n\
  *   《通用数据保护条例》（`GDPR`）\n\n后续章节将介绍组织如何确定法律是否适用于自己。某些法律范围特定且狭窄，而其他法律（如`HIPAA`）适用于广泛组织。\n\
  \n### 健康保险流动性与责任法案 (HIPAA)\n\nHIPAA 适用于任何处理健康信息的组织。处理健康信息的明显组织是医院和诊所。然而，`HIPAA`的范围远远于医疗行业。\n\
  \n\n\n\n\n健康信息包括任何与个人健康相关的数据。这些数据包括个人的过去、现在和未来的健康状况；状况、身体健康或心理健康；以及任何过去、现在或未来的医疗保健费用支付。如果一个机构创建或接收了健康信息，它必须遵守\
  \ `HIPAA`，这包括雇主、健康计划赞助者、医疗保健提供者、公共卫生部门等。如果一个机构没有参与医疗保健但提供了健康计划，它也属于 `HIPAA` 的管辖。\n\
  \n### 萨班斯-奥克斯利法 (SOX)\n\n`SOX` 适用于任何要求在证券交易委员会注册的业务，这包括所有上市公司。换句话说，如果有人可以购买该公司的股票，那么\
  \ `SOX` 就适用。\n\n`SOX` 建立了一套标准。即使这些标准不直接适用于私营企业，私营企业也可以使用相同的标准。如果该机构以后面临法律问题，可以将其行为解释为规避这些问题的诚意努力。\n\
  \n### 联邦信息安全管理法 (FISMA)\n\n`FISMA` 适用于所有美国联邦机构。其目标是确保联邦机构采取措施保护其数据。\n\n美国国家标准与技术研究院\
  \ (`NIST`) 受 `FISMA` 委托，制定标准、指南和最佳实践以支持 `FISMA`。`NIST` 为 `FISMA` 创建的特别出版物可在 http://csrc.nist.gov/publications/PubsSPs.html\
  \ 获取。\n\n### 家庭教育权利与隐私法 (FERPA)\n\n`FERPA` 适用于所有接受美国教育部 (`ED`) 管理的任何计划资助的教育机构和部门。\n\
  \n显而易见的例子是任何从幼儿园到 12 年级的公立学校。然而，许多其他实体也可以从 `ED` 获得资金，包括任何提供学前项目的学校或机构，以及任何高等教育机构，如学院和大学。\n\
  \n资金通常是间接的。虽然公立小学直接从 `ED` 获得资金，但其他机构是间接获得资金。`ED` 为大学提供学生助学金拨款。如果学生收到了这些资金并将其用于大学学费，该大学就接收了\
  \ `ED` 的资助。\n\n`ED` 在 2012 年更新了 `FERPA`。修正案允许更多地披露学生个人信息和学校目录中的学生信息。它们还规定了学生证和电子邮件地址。\n\
  \n### 儿童网络保护法 (CIPA)\n\n`CIPA` 适用于任何从美国教育费率（E-Rate）计划获得资金的学校或图书馆，该计划由联邦通信委员会 (`FCC`)\
  \ 赞助。它提供互联网访问折扣。\n\n学校和图书馆不需要使用 E-Rate 计划，但如果他们选择利用这些折扣，则受 `CIPA` 管理。年度 E-Rate 要求学校和图书馆证明他们遵守\
  \ `CIPA`。\n\n### 支付卡行业数据安全标准 (PCI DSS)\n\n`PCI DSS` 并不是法律。相反，它是一个由几家信用卡公司共同创建的标准，由支付卡行业\
  \ (`PCI`) 安全标准委员会监督。任何接受信用卡支付的机构必须遵守。\n\n许多信用卡公司支持 `PCI DSS`。包括 Visa International、MasterCard\
  \ Worldwide、American Express、Discover Financial Services 和 JCB International。`PCI`\
  \ 安全标准委员会包含了这些公司的员工。\n\n较小的公司可以通过完成自评估问卷来证明其合规，而大型机构则由合格的安全评估员进行独立审计。\n\n`PCI` 安全标准委员会于\
  \ 2018 年 5 月发布了 `PCI DSS` v3.2。\n\n![](img/Tip.png)提示\n\n`PCI` 合规和 `PCI DSS` 合规是同一个意思。\n\
  \n### 通用数据保护条例 (GDPR)\n\n`GDPR` 是一项关于数据和隐私保护的欧盟法规。该法律涉及欧盟和欧洲经济区 (`EEA`) 居民个人信息传输到其地区之外的问题。该法律寻求让该地区的个人对其个人数据和信息的控制权，特别是当涉及在欧盟和\
  \ EEA 之外交易的国际组织时。该法律适用于任何业务，无论其所在地和数据主体的国籍。\n\n该法律区分了数据控制者和数据处理者。数据控制者决定收集的个人数据目的及其处理方式的业务或个人。另一方面，处理者是代表控制者行事的业务或个人，但不包括控制者的员工。该法律受到多项隐私保护原则的支持。`GDRPR`\
  \ 是所有网站请求许可使用 `cookie`（`cookie` 允许他们跟踪访问）的主要原因。\n\n#### 评估法律和合规问题对机构业务运营的影响\n\n\
  一旦确定了机构的合规要求，下一步是确定这些要求对机构产生的影响。根据适用的法律或标准，影响可能会有显著差异。\n\n以下章节介绍了一些常见法律和标准的潜在影响。\n\
  \n### 健康保险流动性与责任法案 (HIPAA)\n\n`HIPAA` 影响业务的广泛范围，且不合规的成本很高。合规所需的步骤可能很复杂，取决于机构处理多少健康相关信息。\n\
  \n首先，如果不遵守规定，处罚将非常严厉。机构对于每次违规可能被罚 100 美元元，对于错误每年最高可罚 25,000 美元元。如果有人故意获取或发布其不应获得的数据，处罚可能高达\
  \ 50,000 美元并处监禁一年。如果是在虚假借口下获取或披露数据，处罚最高可达 100,000 美元并监禁五年。如果为了个人利益或恶意损害获取或披露数据，处罚可能高达\
  \ 250,000 美元并监禁 1 十年。\n\n然而，合规也可能很昂贵。处理健康数据的机构必须采取特定步骤保护数据，包括保护他们创建、接收或发送的任何数据，以及保护处理健康数据的任何系统。\n\
  \n确保数据安全的责任由机构承担。数据在静态存储时必须受到保护，这意味着如果它存储在硬盘或文件柜中，就必须受到保护。静态数据保护可以通过访问控制或物理安全来实现，取决于数据的类型。\n\
  \n健康信息的使用是受限制的。处理和审查健康信息的员工必须接受培训，以便他们了解要求。例如，在没有患者书面同意的情况下不能向第三方发布数据。\n\n数据在传输时也必须受到保护。当任何健康数据进行传输时，必须以特定的格式传输。好消息是，健康计划提供者非常熟悉\
  \ `HIPAA`。外包健康计划的公司也可以外包健康数据的处理。例如，可以委托健康计划提供者为员工提供保险，然后将员工引导至健康计划提供者的网站进行注册。当以这种方式管理健康计划时，提供者托管了几乎信息。原始公司的数据非常少，风险也有限。\n\
  \n\n\n\n\n`SOX` 的业务影响是对数据准确性具有极高的法律责任。高层人员（如 `CEOs` 和首席财务官 `CFOs`）必须亲自核实并证明财务数据的准确性。其目标是避免特大丑闻，例如\
  \ `Enron` 投资者遭受的 110 亿美元损失。\n\n由于这种高额的责任，机构被要求采取额外步骤来确保数据的准确性和完整性，包括实施内部控制，并要求进行内部和外部审计以验证合规性。两个主要优势是：`SOX`\
  \ 增强了高管为了股东利益行动的责任感，且其要求的监控有助于对内部成本提供更好的控制。\n\n`SOX` 的一些反对者认为合规成本过高。然而，根据 `Protiviti`\
  \ 2013 年的一项调查，大多数机构的成本是可控的。\n\n## 联邦信息安全管理法 (FISMA)\n\n由于 `FISMA` 仅适用于联邦机构，因此它不会影响任何机构的收入。但它可能会对运营产生重大影响。\n\
  \n`FISMA` 的核心要求是识别、认证合规并授权组织内所有的 IT 系统运行，这一过程可能非常漫长。主要问题之一是新系统的实施缓慢。\n\n`FISMA`\
  \ 鼓励使用基准。只要一个系统遵循与另一个系统相同的基准，就可以快速获得认证和授权。\n\n### ![](img/Note.png) 注意\n\n基准是任何已知的起点。IT\
  \ 系统的基准代表与另一个系统相同的硬件、软件和配置。例如，如果一台服务器已使用基准获得授权，那么另一台服务器可以使用相同的基准快快地获得授权。\n\n## 家庭教育权利与隐私法\
  \ (FERPA)\n\n`FERPA` 要求受保护的机构与学生或其父母共享学生记录。如果学生或家长提出请求，学校必须遵守。\n\n学生或家长可以请求更正学生记录中的错误，学校有义务考虑该请求。然而，学校并不要求执行学生要求的所有更改。例如，如果学生要求删除记录中的一个低分，但该分数是准确的，则学校没有义务将其其删除。\n\
  \n学生可以授权特定的第三方访问其记录。例如，学生在申请学院或大学录取时可能会授予访问权限。某些特定的第三方会自动获得记录的访问权限。例如，许多学校官员不需要学生的许可即可查看记录。\n\
  \n`FERPA` 对业务运营最大的影响是确保员工了解规则，这可以通过培训来实现。如果一个未满 18 周岁的学生请求访问其记录，员工应该知道该权利属于父母。如果一个\
  \ 20 岁学生的父母请求访问，员工应该知道该权利属于学生。同样，如果第三方请求访问，员工应该知道是否应该授予访问权限。\n\n### ![](img/Tip.png)\
  \ 提示\n\n`FERPA` 赋予 18 岁以下学生父母特定的权利。然而，当学生满 18 岁时，这些权利将转移给学生，在没有学生知情同意的情况下，父母不再拥有这些信息的权利。\n\
  \n### 儿童互联网保护法 (CIPA)\n\n`CIPA` 对学校和图书馆实施了多项技术要求。他们能够过滤攻击性内容，以确保未成年人不受影响。\n\n`CIPA`\
  \ 对学校和图书馆实施了多项技术要求。他们能够过滤攻击性内容，以确保未成年人不受影响。\n\n`CIPA` 对学校和图书馆实施了多项技术要求。他们能够过滤攻击性内容，以确保未成年人不受影响。\n\
  \n`CIPA` 对学校和图书馆实施了多项技术要求。他们能够过滤攻击性内容，以确保未成年人不受影响。\n\n`CIPA` 对学校和图书馆实施了多项技术要求。他们能够过滤攻击性内容，以确保未成年人不受影响。\n\
  \n`CIPA` 对学校和图书馆实施了多项技术要求。他们能够过滤攻击性内容，以确保未成年人不受影响。\n\n`CIPA` 对学校和图书馆实施了多项技术要求。他们能够过滤攻击性内容，以确保未成年人不受影响。\n\
  \n\n\n\n# 组织法律与合规影响翻译\n\n合规影响可能会产生深远的影响。与其他威胁和漏洞一样，损失可能是直接的也可能是间接的。例如，如果一个组织因与 `HIPAA`\
  \ 的错误被罚款 10,000 美元，直接损失就是 10,000 美元。然而，一旦这些信息传出，该组织将面临间接损失。\n\n媒体可能会报道某公司处理健康数据不当。如果客户在该机构存储了健康数据，他们可能会离开。即使客户没有在该机构存储健康数据，他们也可能对机构处理其他数据的方式产生怀疑。同样，员工可能会意识到他们的数据正被处理不当并离开公司。\n\
  \n有时，公关（PR）活动可以恢复组织的声誉。然而，公关费用并不廉。。创建有效的活动需要人才和资金来实施。但是，积极投入资金进行公关活动可以减少事件产生的影响，这最终将为组织节省资金。\n\
  \n## 评估法律与合规影响对典型 IT 基础设施七个领域的影响\n\n本章之前介绍了典型 IT 基础设施的七个领域。在评估法律和合规影响时，应该检查对这些每个领域的影响：\n\
  \n*   **用户领域 (User Domain)**——大多数合规问题都会以某种方式影响用户领域。需要培训用户以确保他们遵守程序。例如，`HIPAA` 要求用户理解他们可以提供哪些数据，`CIPA`\
  \ 要求管理员知道如何为成人关闭 `TPM`，而 `PCI DSS` 则要求用户拥有唯一的登录账号。\n*   **工作站领域 (Workstation Domain)**——如果员工使用工作站访问受保护的数据，则需要对工作站进行检查。如果系统中存储了\
  \ `HIPAA` 或 `SOX` 数据，则需要通过访问控制保护这些数据。许多小型公司使用桌面 PC 作为销售点（POS）系统。`POS` 系统是电子收银员，它需要符合\
  \ `PCI DSS` 指南。任何桌面系统都需要安装防病毒软件。\n*   **局域网领域 (LAN Domain)**——`LAN` 需要保持安全，以防止攻击者捕获数据，包括\
  \ `HIPAA`、`SOX` 和 `PCI DSS` 数据。可能需要加密技术来确保传输的数据安全，如果组织使用无线网络则尤其如此。在过去，攻击者曾坐在企业的停车场里捕获无线交易的详情。\n\
  *   **局域网到广域网领域 (LAN-to-WAN Domain)**——防火墙保护 `LAN` 免受潜在的 `WAN` 攻击，`PCI DSS` 特别要求使用防火墙。图书馆可以使用代理服务器作为\
  \ `TPM` 以符合 `CIPA`。代理服务器具有访问互联网和内部网的权限，因此需要额外的安全措施来使其免受外部攻击。\n*   **广域网领域 (WAN Domain)**——某些\
  \ `PCI DSS` 系统可能直接访问互联网以传输交易数据；因此，它们需要额外的保护。例如，传输需要加密，并且需要保护系统免受试图访问存储数据的攻击者的侵害。\n\
  *   **远程访问领域 (Remote Access Domain)**——许多组织使用 `VPNs` 连接总部和远程办公室。许多法律强制要求保护数据传输。如果用户通过\
  \ `VPN` 传输敏感数据，则必须验证 `VPN` 是安全的。例如，如果用户通过 `VPN` 传输 `HIPAA` 数据，数据应该被加密。\n*   **系统/应用程序领域\
  \ (System/Application Domain)**——受 `HIPAA` 和 `SOX` 辖的健康数据和财务数据通常托管在数据库服务器上，需要对这些服务器进行检查以确保它们符合这些法律。访问控制应确保实施最小权限原则。用\
  \ `TPMs` 满足 `CIPA` 要求的代理服务器必须包含在成人使用服务时禁用 `TPM` 的方法。\n\n## 评估安全措施、控制和保护措施如何协助缓解风险\n\
  \n控制、措施和保护措施的主要目的是缓解风险。控制在特定时期实施以减少当时的风险。然而，威胁和漏洞会发生变化，正因为这些变化，控制的有效性可能会发生变化。因此，定期评估控制以确保其有效性是重要的。\n\
  \n控制的有效性可以通过确定其实现目标的程度来衡量。控制将通过以下方式缓解风险：\n\n*   **将威胁的影响降低到可接受的水平**——例如，飓风威胁无法停止，但一个确定业务备选地的业务连续性计划可以减少威胁。\n\
  *   **将漏洞降低到可接受的水平**——例如，某些拒绝服务（`DoS`）攻击可以导致未补丁的服务器崩溃。通过保持服务器更新最新插件，它们对已知 `DoS`\
  \ 攻击的漏洞会降低。\n\n风险评估将评估特定时间的威胁和漏洞，并在进行评估时根据已知风险推荐控制措施。它应该定期重复。\n\n此外，如果控制发生了变化，应重复进行风险评估。例如，如果硬件防火墙更换为不同的型号，原始风险评估将不再有效，应使用新防火墙重新进行。\n\
  \n### TIP ![](img/Tip.png)\n\n`countermeasure`（措施）、`safeguard`（保护措施）和 `control`（控制）这些术语互换使用。它们都用于缓解风险。\n\
  \n## 理解法律和合规要求的运营影响\n\n合规要求通常会影响系统的运行方式。在考虑法律和合规要求时，需要考虑合规如何影响运营。\n\n以下是一些示例：\n\n\
  *   **HIPAA**——`HIPAA` 要求保护所有健康相关数据。当这些数据以电子形式存储时，使用网络中的标准访问控制进行控制将变得更容易。公司可能会选择从纸质记录转向电子记录，这将影响员工访问数据的方式并代表运营程序的改变。\n\
  *   **SOX**——`SOX` 要求保护财务数据，这些数据可能存储在数据库服务器上。如果是这样，数据库服务器将受到其他服务器可能需要的额外控制。管理员可能需要采取额外步骤来保护数据以及用户访问数据。\n\
  *   **FISMA**——`FISMA` 要求政府机构购买和部署系统有特定的程序。如果公司购买了非标准的系统，获取其认证和授权的过程可能会很长，这种延迟可能会影响机构及时推出新系统的能力。\n\
  *   **FERPA**——`FERPA` 规定学生或父母可以访问教育记录。如果学校有大量此类请求，其日常运营可能会受到影响。为了避免这种情况，学校可以选择限制授予记录的时间。\n\
  *   **CIPA**——`CIPA` 要求保护未成年人受攻击性内容的影响，但成人应该能够无限制地访问。管理员过去可能不需要管理系统。然而，他们可能需要接受关于如何关闭成人\
  \ TPM 的培训。\n*   **PCI DSS**——如果一个组织已经在执行标准的安全实践，`PCI DSS` 对正常运营的影响很小。然而，如果组织的安全实践薄弱，`PCI\
  \ DSS` 标准可能会彻底改变运营。虽然从长远来看这是好事，但在短期内用户可能会感到不习惯。\n\n\n\n\n\n* `GDPR`—GDPR 区分了数据控制者与数据处理者的职责和责任。数据控制者有义务仅聘用那些提供足够保证、能够实施适当的技术和组织措施以保护数据主体权利的处理者。数据处理者也必须遵循所有适用的措施以保护数据主体的个人数据。\n\
  \n### 识别整个组织的风险缓解和风险削减要素\n\n虽然查看单个系统和功能可能存在的风险非常重要，但采取更广泛的视角同样重要。对组织的宏观视角可以识别所有部分是如何结合在一起的。\n\
  \n大多数组织都有由高级管理层制定的安全策略。该策略概述了组织的安全哲学，并确定了宏观的安全目标。安全控制是根据安全策略的指导实施的。\n\n具有组织宏观视图的一些控制包括：\n\
  \n*   **账户管理控制**——这些控制确保了账户管理的安全性。通过账户管理控制，每个用户都被分配一个独立的账户，在用户离开时将禁用该账户，并对账户使用密码管理策略。\n\
  \n*   **访问控制**——尽管访问控制应用于单个系统，但它们是使用全局系统创建的。例如，微软域使用 Active Directory Domain Services\
  \ 作为分配权限和控制访问的基础。大多数组织会创建一个管理模型，定义如何使用组来组织用户。然后，将访问权限授予组，而不是单个用户。最小权限原则是访问控制中强制执行的核心原则。\n\
  \n*   **物理访问**——如果攻击者对系统拥有不受限制的物理访问，那么攻入系统只是时间问题。因此，物理访问控制是必要的，通过限制对资产的物理访问来保护这些资产。它们可以包括锁、密码锁、感应卡和闭路电视\
  \ (CCTV) 系统。\n\n*   **人事政策**——人事政策（如职责分离和强制休假）被用于帮助防止欺诈。这些政策并非针对个人，而是针对职位的，例如人员有权接触组织资金的会计职位。\n\
  \n*   **安全意识和培训**——某些培训针对特定群体（如经理或管理员），其他培训则面向所有人员。无论如何，培训和意识计划可用于提高所有人员的安全意识。\n\
  \n还有许多额外的控制可供审查。这里最重要的一点是，组织的控制措施不应仅聚焦于单个系统。一个健全的安全计划将结合了广泛和狭窄的安全控制。\n\n### 执行成本效益分析\n\
  \n在评估控制措施时，创建成本效益分析 (CBA) 是关键一步。在 CBA 中，将控制措施的成本与风险发生时的成本进行比较。如果实施该控制措施的成本高于风险带来的成本，那么该控制措施就不具有成本效益。\n\
  \n执行有效的 CBA 需要两项数据：控制措施的成本和控制措施的预期收益。预期收益可以使用以下公式计算：\n\n`控制前的损失 − 控制后的损失 = 预期收益`\n\
  \n然后，确定是否应该使用该控制措施可以使用此公式计算：\n\n`预期收益 − 控制成本 = 控制价值`\n\n如果结果为正值，则该控制措施是值得的；但如果结果为负值，则该控制措施的成本超过了收益，不应购买。\n\
  \n例如，一个组织有一个托管大型数据库的数据库服务器，并定期完成备份。\n\n\n\n\n\n*   **当控制措施变更时重新进行风险评估**——风险评估是在特定时间完成的。因此，如果控制措施发生变化，风险评估将不再有效。\n\
  *   **包含成本效益分析 (CBA)**——CBA 为控制措施提供了合理性，并有助于确定其价值。CBA 可以清晰地证明是否应该购买某种控制措施，或者该措施是否值其成本。\n\
  \n## 章节总结\n\n本章涵盖了整个组织风险缓解的重要要素。实施控制措施通过减少威胁的影响或减少脆弱性来降低风险，并根据这两项要求对控制措施的有效性进行衡量。这些措施在防止组织中任何关键业务运营的风险方面应该是最有效的。\n\
  \n近年来，IT 法律合规性问题变得越来越重要。适用的法律法规越来越多，且不合规的成本可能非常昂贵。因此，花时间识别相关的法律和指南是重要的，因为法规对组织的影响各异，在实施支持性控制措施时应当考虑这些因素。\n\
  \n## 核心概念与术语\n\n*   关键业务功能 (CBF)\n*   关键成功因素 (CSF)\n*   深度防御\n*   E-Rate 资金\n* \
  \  最大可接受中断时间 (MAO)\n*   代理服务器\n*   投资回报率 (ROI)\n*   服务水平协议 (SLA)\n*   技术保护措施 (TPM)\n\
