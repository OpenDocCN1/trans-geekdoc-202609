  \    4. 用于提取、加载和转换数据仓库的过程\n\n9. 资产管理系统可以与什么进行比较以确保覆盖整个组织？\n    1. 硬件和软件资产\n    2.\
  \ 软件资产\n    3. 人员和数据资产\n\n\n\n\n\n## 4. 典型 IT 基础设施的七个领域\n\n10. 在更新组织的业务连续计划时，应仅包含\
  \ `\\_\\_\\_\\_\\_\\_\\_` 系统。\n\n11. 下列哪项是可能影响源自欧洲经济区数据的隐私法规？\n1. `HIPAA`\n2. `GDPR`\n\
  3. `PCI DSS`\n4. `FOIP`\n\n12. 如果组织想确定特定 IT 服务器故障时会产生什么影响，它应该使用什么？\n1. `BIA`\n2.\
  \ `BCP`\n3. `DRP`\n4. `BCC`\n\n13. 如果组织想确保在灾难发生时能够继续执行关键任务业务，它应该使用什么？\n1. `BIA`\n\
