  \ 是 `国防部信息技术安全认证与核准流程` 的缩写。\n\n`(ISC)² 提供了一种基于民用的认证，可用于 `DoD 8570.1`。它被称为 `认证与核准专业人员\
  \ (CAP)`。它要求在认证和核准领域拥有两年的经验。\n\n\n\n\n\n**7. 处理信用卡的商户被要求实施数据安全。他们应该遵循哪种标准？\n1. `GAISP`\n\
  2. `CMMI`\n3. `COBIT`\n4. `PCI DSS`\n\n8. NIST 发布了特别出版 800-30。它涵盖了什么内容？\n1. `风险评估`\n\
