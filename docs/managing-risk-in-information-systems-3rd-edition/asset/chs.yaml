  \n© Sai Chan/Shutterstock\n\n## 前言\n\n### 本书目的\n\n本书是 Jones & Bartlett Learning\
  \ 信息系统安全与保障系列丛的一部分（[`www.jblearning.com/cybersecurity/issa`](https://www.jblearning.com/cybersecurity/issa)）。该系列面向\
  \ IT 安全、网络安全、信息保障和信息系统安全的课程及教学大纲，对这一关键领域的最新思想和趋势进行了全面、一致的探讨。该系列书籍提供了大量实际应用和示例的基础信息安全原则。书中由认证信息安全专业人员（CISSP）编写，提供了关于信息安全各方面的全面信息。这些书籍经过领域领先技术专家的逐字审阅，不仅具有时代性，而且具有前瞻性，使你能够应对不仅是今天而且未来的网络安全挑战。\n\
  \n本书提供了管理信息系统风险的全面视角。它涵盖了风险和风险管理的基础知识，并在三个主要部分包含了对更全面的风险管理主题的深入细节。\n\n第一部分“风险管理业务挑战”探讨了许多与当今业务相关的问题。它涵盖了风险、威胁和漏洞的细节。相关主题帮助学生理解风险管理在组织中的重要性，包括许多管理风险的技术。书中介绍了几项现行法律，并清晰描述了它们与组织中的相关性。书中还包含了一个描述风险管理计划内容的章节。\n\
  \n第二部分“缓解风险”侧重于风险评估。介绍的主题包括风险评估方法，包括执行风险评估的总体步骤。它涵盖了识别资产的重要性，以及识别针对这些资产的潜在威胁、漏洞和利用程序。第\
  \ 9 章涵盖了可用于缓解风险的控制类型。该部分的最后两章确定了如何在整个组织规划风险缓解，并将风险评估转换为风险管理计划。\n\n第三部分“风险缓解计划”涵盖了风险缓解计划的许多元素，例如业务影响分析和业务连续性计划。\n\
  \n### 学习特色\n\n本书的写作风格非常实用。每个章节都从学习目标开始。使用图表来阐明材料。每个章节末尾都包含章节总结。文中穿插了许多侧栏。\n\n###\
