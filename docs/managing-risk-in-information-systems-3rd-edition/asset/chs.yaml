  \ 风险管理—风险评估技术`\n\n12. 下列哪个 ISO 文档提供了风险管理的通用指南？\n1. `ISO 73 风险管理—术语`\n2. `ISO 27002\
  \ 信息技术安全技术`\n3. `ISO 31000 风险管理原则和指南`\n4. `IEC 31010 风险管理—风险评估技术`\n\n13. 下列哪项法律旨在确保组织符合某些要求？\n\
  1. `GLBA`\n2. `HIPAA`\n3. `GADP`\n4. `GDPR`\n\n14. 在 `CMMI` 中，\\_\\_\\_\\_\\_\\\
  _ 表示成熟度。\n\n15. `DIAP` 是为了什么？在认证后会发生什么？\n1. 停用。\n2. 授权。\n3. 验证。\n4. 运营。\n\n![处理信用卡数据](https://www.shutterstock.com/image-photo/credit-card-security-data-protection-1123456789)\n\
  \n# 风险管理计划\n\n\n\n\n\n*   **识别资产**——资产是公司在遭受攻击时可能丢失的重要物品，可能包括：\n    *   以销售额量化的潜在损失\n\
  \    *   以商誉或声誉损失衡量的潜在损失\n*   **分配责任**——将责任分配给特定部门以收集数据，这些数据将用于制定建议。稍后在计划中，将责任分配给各个部门以实施和跟踪计划。\n\
  *   **识别停机成本**——包括直接成本和间接成本。直接成本是停机期间损失的销售额。如果服务器宕机 15 分钟或更久，损失的收入将根据销售数据得出。间接成本包括客户商誉的损失以及恢复商誉的成本。\n\
  *   **提供建议**——包含一份缓解风险的建议列表。这些建议可以减少弱性，也可能减少威胁的影响。例如，可以通过建议硬件冗余来解决硬件故障威胁。可以通过实施更新计划来解决缺乏更新的问题。\n\
  *   **识别建议的成本**——确认为并列出每项建议的成本。\n*   **提供成本效益分析（CBA）**——为每项建议提供一份成本效益分析。该分析将比较建议的成本与实施该建议为公司带来的收益。收益可以用增加的收入或减少的停机成本来表示。\n\
  *   **记录采纳的建议**——经理将选择实施哪些建议。他们可以接受、推迟或修改建议。这些选择将记录在计划中。\n*   **跟踪实施情况**——计划将跟踪这些选择及其实施情况。\n\
  *   **创建计划行动措施（POAM）**——包含一份分配责任的 POAM。经理将使用 POAM 来跟踪和跟进项目。\n\n### ![](img/Note.png)注意\n\
  \n`firewall` 过滤流量。防火墙规则配置为专门允许某些流量。大多数防火墙会阻止所有未被专门允许的流量。网络防火墙和基于主机的防火墙都可以。网络防火墙通常由硬件和软件组成，为网络过滤流量。单个系统可以拥有软件防火墙，为单个系统过滤流量。\n\
  \n### 目标示例：HIPAA 合规\n\n某公司最近收购了 Mini Acme。对 Mini Acme 记录的检查显示健康信息未受到保护。因此，收购公司不符合\
  \ HIPAA 标准，不合规可能导致罚款和监禁。\n\n本计划的目的是确保符合 HIPAA 标准。该计划的目标是：\n\n*   **识别威胁**——威胁可以是内部的也可以是外部的。\n\
  *   **识别漏洞**——漏洞是弱性。它们可能包括：\n    *   缺乏防止信息共享的策略\n    *   数据存储时缺乏保护\n    *   数据传输时缺乏保护\n\
  *   **分配责任**——将责任分配给特定部门识别威胁和漏洞。这些数据将用于识别纠正措施。稍后，可以将责任分配给部门以实施和跟踪计划。\n*   **识别不合规成本**——成本包括与不合规相关的法律罚款。诉讼或失去客户信任可能会导致成本。\n\
  *   **提供建议**——创建一份建议列表。\n*   **识别建议的成本**——确认为并列出每项建议的成本。\n*   **提供成本效益分析（CBA）**——为每项建议提供一份成本效益分析。该分析将比较建议的成本与实施该建议为公司带来的收益。\n\
  *   **记录采纳的建议**——经理将选择实施哪些建议。他们可以接受、推迟或修改建议。这些选择将记录在计划中。\n*   **跟踪实施情况**——计划将跟踪这些选择及其实施情况。\n\
  *   **创建计划行动措施（POAM）**——包含一份分配责任的 POAM。经理将使用 POAM 来跟踪和跟进项目。\n\n### 风险管理计划范围\n\n\
  除了目标之外，确定风险管理计划的`scope`也很重要。边界可以包括整个组织或单个系统。如果没有定义的边界，计划可能会失去控制。许多项目的共同问题是 `scope\
  \ creep`（范围蔓延）。随着变化的侵入，`scope` 会随之增长。变化带来了额外的需求，不受控制的变化会导致成本超支和错过截止日期。\n\n例如，在提到的\
  \ HIPAA 合规示例中，目标是让 Mini Acme 符合标准。假设发现了更多未受保护的数据，例如财务数据、研究数据或用户数据。如果这些数据被纳入项目，将扩大项目，因为需要识别威胁和漏洞、计算数据丢失的成本，并识别额外的建议及其成本。\n\
  \n说项目的 `scope` 永远不改变是不现实的。关键在于控制变化。风险管理项目经理应该与利益相关者合作，确定哪些变化是可以接受的。这些变化理想情况下应通过变更控制委员会（`CCB`），这是一个由学科专家和项目利益相关者组成的委员会，他们负责评估此类变化并决定是否接受。\n\
  \n### 识别利益相关者\n\n公司通常有 C 级高管，如 `CCOs`、`CEOs`、`CFOs`、`CIOs`、`CSOs` 和 `CTOs`。`CCO`\
  \ 是首席合规官，`CEO` 是首席执行官，`CFO` 是首席财务官，`CIO` 是首席信息官，`CSO` 是首席安全官（也称为 `CISO`，首席信息安全官），`CTO`\
  \ 是首席技术官。\n\n`stakeholder`（利益相关者）是指对项目成功有利益或兴趣的个人或群体。关键利益相关者是指对项目决策有权的人，包括授予额外资源。关键利益相关者的例子可以是公司高管（例如首席信息官或首席财务官）；项目完成后将“拥有”该项目的副总裁；或者特定领域的专家首席合规官（例如\
  \ HIPAA 合规）。\n\n利益相关者应该参与编写范围声明。他们的参与可以是从起草声明到批准任何形式。利益相关者应该对项目拥有所有权，这也被称为对项目的支持（buy-in）。\n\
  \n### 应用开发中的范围蔓延\n\n`scope creep` 是应用开发中的一个常见问题。程序员经常看到如何通过微调来改进程序。虽然程序员的初衷是好的，但这些变化可能会产生深远影响。\n\
  \n\n\n\n在一个项目中，一名程序员为程序添加了一个额外功能，允许用户对数据进行搜索。这一变更显然超出了项目范围，且没有经过 `CCB` 的评估和授权。然而，编写该功能并没有花费多少时间，该变更在未通知任何人的情况下被添加了程序。随后，程序带着这项新功能交付给了客户。\n\
  \n客户成功地运行了程序几个月。此后，数据格式发生了变化。格式的改变并没有影响程序的主要目的；它仍然按照要求运行。然而，额外的搜索功能不再工作了。\n\n谁来负责修复这个问题？应用程序开发人员负责。\n\
  \n一个最初看起来是增加增值的变更实际上变成了增加了额外负担。尽管搜索功能在项目范围之外，但它已成为应用程序的一部分。这个增加的功能必须像应用程序的其他任何部分一样进行维护。开发人员并没有多少选择。如果开发者拒绝修复问题，程序的感知易用性就会受到影响。\n\
  \n此时，这个增加的功能并不容易删除。它看起来和用起来就像一个特性。虽然如果从未添加过也不会被怀念，但现在如果删除，人们就会怀念它。\n\n真正的利益相关者对项目有切利益，并希望项目成功。另一方面，一个被列为名义人物但对项目没有利益的利益相关者则将其视为一种麻烦。没有真正利益相关者的项目往往会由于缺乏支持而死亡：资源没有得到分配，决策无法做出，团队成员意识到项目没有支持，并最终停止贡献。\n\
  \n例如，在寻找与 `HIPAA` 无关未保护数据的 `HIPAA` 示例中，如果风险管理团队发现了未保护的财务数据，该团队可以向项目经理 (`PM`) 汇报他们的担忧。`PM`\
  \ 可以评估数据并确定这些数据均与 `HIPAA` 无关，但意识到其重要性。`PM` 可以将信息传递给利益相关者，作为一个关注的问题。利益相关者可能会指示 `PM`\
  \ 将数据纳入计划。在那时，它变成了一项受控变更。\n\n后续章节将提供网站和 `HIPAA` 合规性项目的范围说明示例。\n\n## 范围示例：网站\n\n\
  风险管理计划的目的是确保 `Acme Widgets` 网站的安全。计划范围包括：\n\n* 托管网站的服务器安全\n* 网站本身的安全\n* 网站的可用性\n\
  * 网站数据的完整性\n\n该项目的利益相关者包括：\n\n* 销售副总裁\n* 信息技术 (`IT`) 支持部门主管\n\n本计划范围之外的所有活动均需书面批准。\n\
  \n## 范围示例：HIPAA 合规\n\n风险管理计划的目的是确保 `Mini Acme` 数据符合 `HIPAA` 规定。计划的范围包括：\n\n* 识别所有健康数据\n\
  * 存储健康数据\n* 使用健康数据\n* 传输健康数据\n\n该项目的利益相关者包括：\n\n* `CIO`\n* 人力资源 (`HR`) 部门主管\n\n\
  本计划范围之外的所有活动均需书面批准。\n\n## 分配责任\n\n风险管理计划规定了责任，提供了问机制。如果没有分配责任，任务很容易被忽略。责任可以分配给：\n\
  \n* 风险管理 `PM`\n* 利益相关者\n* 风险管理 `PM`\n* 利益相关者\n* 风险管理 `PM`\n* 利益相关者\n\n### 注意\n\n\
  风险管理 `PM` 有时被称为风险管理协调员。成功的风险管理 `PM` 所需的技能与任何项目中成功的项目经理所需的技能相同。\n\n以下事项可以分配个人责任：\n\
  \n* **识别风险**——这项责任包括识别威胁和漏洞。\n* **评估风险**——这项责任涵盖识别可能性和影响。\n* **报告**——这项责任涉及计划所创建的文档。\n\
  \n网站和 `HIPAA` 合规项目的范围说明示例见后续章节。\n\n### 提示\n\n考虑创建一个威胁-可能性-影响矩阵。为每个可能性分配一个 `10` 到\
  \ `100` 的百分比。影响严重分配一个 `10` 到 `100` 之间的值。然后通过两个值相乘计算数值。数值越高表示越需要优先处理。较低的值表示可以接受的风险。\n\
  \n## 责任示例：网站\n\n`CFO` 将为 `IT` 部门提供资金，以聘请协助 `IT` 部门的安全顾问。\n\n`IT` 部门负责提供：\n\n* 威胁列表\n\
  * 漏洞列表\n* 建议列表\n* 每项建议的成本\n\n`sales` 部门负责提供：\n\n* 所有超过 `15` 分钟停机的直接成本\n* 所有超过 `15`\
  \ 分钟停机的间接成本\n\n`CFO` 将验证由 `IT` 和 `sales` 部门提供的数据。随后 `CFO` 将完成 `CBA`。\n\n## 责任示例：HIPAA\
  \ 合规\n\n`HR` 部门负责识别 `Mini Acme` 持有的所有健康信息。`HR` 部门负责提供：\n\n## 使用亲性图\n\n虽然分配责任很容易，但识别任务可能并不简单。挑战之一是生成真实的威胁、漏洞和建议列表。亲性图可以帮助完成任务。\n\
  \n`亲性图` 通过四个基本步骤创建：\n\n1. **识别问题**——创建一个基础问题陈述。例如，考虑网站问题。问题可以表述为“网站宕机导致销售损失”。\n\n\
  \n\n\n\n## 2. **产生想法**——越多越好。这些想法可以关于问题的任何任何元素。它们可以包括威胁、漏洞和建议的解决方案。头脑风暴是可以使用的一种方法。在头脑风暴会议中，鼓励参与者提到脑海中浮出的任何想法。所有的想法在不加判断的情况下被记录下来。创作过程往往能产生大量的想法。\n\
  \n## 3. **将想法归类到相关组**——产生想法后，将它们进行分组。对于风险管理计划，这些组通常被分为威胁、漏洞和建议等类别。其中某些类别可能包含子类别。例如，漏洞可以分为网络弱点和服务器漏洞。\n\
  \n## 4. **创建亲和图**——**图 4-1**显示了亲和图的示例。它将所有想法组合在一起。\n\n![图 4-1 亲和图。](img/9781284183719_CH04_FIGF01.png)\n\
  \n**图 4-1** 亲和图。\n\n在实际场景中，亲和图可能会大得多。威胁可以分为外部和内部。漏洞列表几乎是无尽的。\n\n*   所有健康信息来源的列表\n\
  *   所有数据源关于 HIPAA 合规性的检查结果：\n    *   数据如何存储\n    *   数据如何保护\n    *   数据如何传输\n* \
  \  Mini Acme 使用的现有 HIPAA 政策列表\n*   需要的 HIPAA 政策列表\n*   确保符合 HIPAA 标准的建议解决方案列表\n\
  *   每种建议解决方案的成本\n*   不合规相关的成本\n\nIT 部门负责提供：\n\n*   用于数据访问控制的标识\n*   确保符合 HIPAA 标准的建议解决方案列表\n\
  *   每种建议解决方案的成本\n\nCFO 将验证由 IT 部门和销售部门提供的数据，然后完成成本效益分析（CBA）。\n\n### 描述执行的程序和进度\n\
  \n风险管理计划的这部分在项目启动后创建。针对威胁或漏洞会包含一个建议的解决方案，目标是降低相关风险。虽然解决方案可以用一个短语来总结，但解决方案本身通常包含多个步骤。\n\
  \n例如，现有的防火墙可能会使服务器暴露在多个漏洞中。解决方案可以是升级防火墙。这种升级可以分解为几个步骤，例如：\n\n*   确定应该允许哪些流量\n* \
  \  创建防火墙策略\n*   购买防火墙\n*   安装防火墙\n*   配置防火墙\n*   测试防火墙\n*   实施防火墙\n\n### ![](img/Note.png)注意\n\
  \nMITRE 在其网站上提供了风险管理工具包区域，地址为 [`www.mitre.org/work/sepo/toolkits/risk/index.html`](http://www.mitre.org/work/sepo/toolkits/risk/index.html)。该网站包含关于创建亲和图的信息。\n\
  \n这些步骤中的每一个都可以被更详细地描述。此外，可以包含一个每个步骤的完成时间表。\n\n此时有几点需要记住：\n\n*   管理层负责进度\n*   管理层负责风险\n\
  \n由于进度尚未最终确定，以下仅为示例：\n\n#### 程序示例：网站\n\n该网站容易受到拒绝服务（DoS）攻击。可以完成以下任务来降低风险：\n\n* \
  \  **建议**——提高意识。\n*   **理由**——明确不合规可能会导致每年错误总计 25,000 美元的罚款。\n*   **程序**——使用以下步骤提高意识：\n\
  \n例如，现有的防火墙可能会使服务器暴露在多个漏洞中。解决方案可以是升级防火墙。这种升级可以分解为几个步骤，例如：\n\n*   确定应该允许哪些流量\n* \
  \  创建防火墙策略\n*   购买防火墙\n*   安装防火墙\n*   配置防火墙\n*   测试防火墙\n*   实施防火墙\n\n#### 程序示例：HIPAA\
  \ 合规\n\nMini Acme 的员工不了解 HIPAA。他们不懂法律的要求，也不理解不合规的后果。可以完成以下任务来降低不合规的风险：\n\n*   **建议**——提高对\
  \ HIPAA 的认识。\n*   **理由**——明确不合规可能会导致每年错误总计 25,000 美元的罚款。\n*   **程序**——使用以下步骤提高意识：\n\
  \n    1.  要求所有员工阅读并遵守 HIPAA 政策——不要创建新政策。要求 Mini Acme 的员工阅读并确认目前实行的 HIPAA 政策。这可以在\
  \ 30 天内完成。\n    2.  为所有员工提供 HIPAA 合规性培训——培训将包括 HIPAA 涵盖的数据。它还包括不合规的后果。如果获得批准，创建培训材料大约需要\
  \ 60 天。培训可以在 30 天内完成。\n\n### 报告要求\n\n在收集了有关风险和建议的数据后，需要将这些数据包含在报告中。该报告将提交给管理层。报告的主要目的是让管理层决定使用哪些建议。\n\
  \n报告要求有四大大类：\n\n*   **提交建议**——这些建议是风险响应建议。\n*   **记录管理层对建议的响应**——管理层可以接受、修改或推迟任何建议。\n\
  *   **记录并跟踪已接受建议的实施情况**——这一过程成为实际的风险响应计划。\n*   **创建 POAM**——POAM 跟踪风险响应行动。\n\n\n\
  \n\n收集的数据被汇成一份报告，其中包含威胁、漏洞和建议列表。该报告将提交给管理层。管理层将根据这些数据决定采取哪些措施。\n\n在此阶段，记住风险管理计划的总体目标非常。目标是识别风险并建议减少这些风险的策略。大多数风险无法消除，而是会被降低到可以接受的水平。每个识别出的风险都将带有相应的降低风险建议。\n\
  \n此报告应包含以下信息：\n\n* 发现\n* 建议成本和时间范围\n* 成本效益分析 (CBA)\n\n## 发现\n\n发现结果列出了事实。请记住，当威胁利用漏洞时，就会产生风险损失。风险管理发现需要包含威胁、漏洞和潜在损失。发现结果被描述为原因、标准和结果：\n\
  \n* `Cause`（原因）——原因是威胁。例如，攻击者可能会尝试发起 `DoS` 攻击。在这种情况下，威胁是攻击者。识别根本原因同样重要。攻击成功取决于攻击者是否拥有权限以及系统是否存在漏洞。风险管理试图减少原因的影响或减少漏洞。\n\
  \n* `Criteria`（标准）——识别允许威胁成功的标准，即漏洞。例如，如果满足以下标准，服务器就会受到 `DoS` 攻击的影响： \n\n    * `人力不足`——如果人力不足以执行安全步骤，则站点就会存在漏洞。\n\
  \    * `未管理的防火墙`——每个开放的端口都代表一个漏洞。如果不在防火墙上管理端口，则可能允许不受的流量进入。\n    * `无入侵检测系统 (IDS)`——取决于\
  \ `IDS` 的类型，它不仅能检测入侵，还能对入侵和环境的变化做出响应。\n    * `操作系统未更新`——在补丁发布并测试后立即应用到系统中是至关重要的。如果不应用更新，系统将受到新漏洞的威胁。\n\
  \    * `未安装和更新杀毒软件`——杀毒软件可以检测恶意软件。软件应更新定义库以确保它能检测到新的恶意软件。\n\n* `Effect`（结果）——结果通常是某种类型的停机。例如，对网站的影响可能是该网站无法再次访问。\n\
  \n### NOTE\n\n`DoS` 攻击是旨在防止系统提供服务的任何攻击。分布式 `DoS (DDoS)` 攻击是从多个系统同时发起的 `DoS` 攻击。`DDoS`\
  \ 攻击通常包括受僵尸网络控制的机器人计算机。\n\n记录发现结果时一个重要的考虑因素是资源可用性。可能，所有发现的问题之前已经已知。然而，过去可能没有分配资金来购买解决方案。此外，可能人力不足以实施这些解决方案。\n\
  \n当没有足够的人力时，往往为了易用性而牺牲安全性。考虑网站的示例。第一个目标可能是确保网站运行。一旦上线，资源可能被用于其他工作。网站可能仍然不安全，可能没有进行备份，或者可能存在其他安全问题。\n\
  \n可以使用 `因果图` 来发现和记录发现结果。`FIGURE 4-2` 显示了网站场景的因果图示例。在图中，首要原因是攻击。其余项目是允许攻击成功的影响因素。结果是停机。\n\
  \n![FIGURE 4-2 网站因果图。](img/9781284183719_CH04_FIGF02.png)\n\n**FIGURE 4-2** 网站因果图。\n\
  \n使用因果图具有几个优势。它可以帮助引导发现过程中的讨论，并帮助在文档中可视化原因和结果之间的关系。因果图可任何问题。\n\n因果图从创建线条和最终结果开始。在\
  \ `Figure 4-2` 中，结果是停机。然后添加额外的项目（原因），使图表看起来像鱼骨。图可以对任何元素进行扩展。例如，“攻击”可以扩展为包含特定类型的攻击。攻击可能包括恶意软件、`DoS`、`缓冲区溢出`或其他类型的攻击。\n\
  \n### NOTE\n\n因果图也被称为 `石川图 (Ishikawa diagram)` 或 `鱼骨图`。它用于将问题与原因联系起来。\n\n在创建因果图时，可能会出现创意枯竭或集中于单一主题的情况。为了平衡图表，可以考虑以下五个元素，但不需要全部包含在内。然而，任何元素都可以用于帮助识别原因：\n\
  \n* `Methods`（方法）——哪些方法可能导致停机？\n* `Machinery`（设备）——哪些设备问题可能导致停机？\n* `Manpower`（人力）——哪些人力问题可能导致停机？\n\
  * `Materials`（材料）——哪些材料问题可能导致停机？\n* `Environment`（环境）——哪些环境问题可能导致停机？\n\n`FIGURE\
  \ 4-3` 显示了因果图的另一个示例。在这个例子中，原因是机密性丢失。其余项目显示了允许数据丢失的标准。对于 `HIPAA`，结果可能是巨额罚款或刑事指控（如监禁）。\n\
  \n![FIGURE 4-3 HIPAA 因果图。](img/9781284183719_CH04_FIGF03.png)\n\n**FIGURE 4-3**\
  \ HIPAA 因果图。\n\n## 建议成本和时间范围\n\n除了发现之外，报告还将包含一份建议列表。这些建议将针对导致负面结果的潜在原因和标准。\n\n###\
  \ NOTE\n\n单个持续成本可能很，但累计需求可能更大。在这个示例中，维护这些解决方案的时间可能增加一名管理员。\n\n每个项目都应包含实施所需的成本。还应包含实施解决方案的时间表。管理层将根据这些数据决定是否应该应用该解决方案。\n\
  \n例如，可以将以下建议列表包含在网站风险计划中：\n\n* `升级防火墙`——初始成本 `$4000`。持续成本每年 `$1000`。初始成本将涵盖购买防火墙。持续成本与培训和维护有关。防火墙应在批准后\
  \ 30 天内购买并安装。\n* `购买并安装 IDS`——初始成本 `$1500`。持续成本不计。`IDS` 应在批准后 30 天内购买并安装。\n* `创建保持系统更新的计划`——初始成本：人力。持续成本：人力。系统应在批准后\
  \ 30 天内完成安装。\n* `在服务器上安装杀毒软件`——初始成本 `$75`。持续成本不计。软件应在批准后 30 天内购买并安装。\n* `更新杀毒软件`——初始成本不计。持续成本不计。安装后应配置杀毒软件自动更新。\n\
  * `增加一名 IT 管理员`——成本：协商确定的薪资。由于这些建议的持续维护需求，需要一名额外的管理员。\n\n## 成本效益分析\n\n\n\n\n\n`CBA`\
  \ 是一种用于确定如何管理风险的过程。如果控制措施的收益大于成本，则可以实施该控制措施以降低风险。如果成本大于收益，则可以接受风险。\n\n在此背景下，`CBA`\
  \ 应该包含两个项目：\n\n*   建议的成本——建议是指旨在管理风险的控制措施。如果预计会有持续性成本，则应将其纳入计算。\n*   预期收益——收益以美元为单位计算。它们可以表示为赚取的资金或减少的损失。\n\
  \n管理层负责做出如何管理风险的决策。准确的 `CBA` 能让管理层做出明智决策。\n\n以下是一个网站建议的 `CBA` 示例：\n\n*   建议——在 Web\
  \ 服务器上安装病毒毒软件。\n*   建议成本——$75。\n*   背景——由于性能考虑，过去 Web 服务器上没有安装病毒毒软件。过去的一年里，恶意软件曾多次感染\
  \ Web 服务器，导致多次宕机。总停机时间为五小时。Web 服务器每运行 15 分钟产生约 $500 的收益，即每小时 $2,000。预计病毒毒软件可以防止\
  \ 90% 的感染。\n*   使用病毒毒软件前的损失——$30,000。宕机导致 $10,000 的直接收入损失（`2,000 × 5 hours`）。间接损失估计为\
  \ $20,000，其中包括为了挽回流失客户的广告费用。\n*   使用病毒毒软件后的损失——$3,000。预计病毒毒软件将减少 90% 的损失 `[$30,000\
  \ − ($30,000 × .9) = $3,000]`。\n*   病毒毒软件的收益——$27,000 (`$30,000 × .9 = $27,000`）。\n\
  *   CBA——$26,925。`CBA` 的计算方法为：\n    *   使用毒毒前的损失 − 使用毒毒后的损失 − 病毒毒软件成本\n    *   `$30,000\
  \ − $3,000 − $75 = $26,925`\n\n准确数据的准确性不言而喻。完成准确 `CBA` 的关键在于从准确的数据开始。再次，有时准确的数据很难获得。寻找准确数据通常需要深入表面之下以确定成本。\n\
  \n探究性问题通常能揭示数据中的缺陷。以下是需要考虑的场景和问题：\n\n*   如果某项控制措施被认为能减少 90% 的损失，请问：“你是如何得出 90% 这个数字的？”\n\
  *   如果给出了控制措施的成本，请问：“这包含任何持续成本吗？”\n\n探究性问题不需要具有指责性。目标不是制造冲突，而是验证数据。提问时应采用“帮我理解”的语气。如果数据有缺陷，演示者很容易产生防御心理。另一方面，如果数据是有效的，演示者可以用事实回答问题以支持其观点。\n\
  \n### 风险陈述\n\n报告通常在风险陈述中摘要。风险陈述用于传达风险及其产生的影响。它们通常使用“如果/那么”语句编写。陈述中的“如果”部分识别风险的要素，“那么”部分识别其影响。例如，以下风险陈述可以用于网站：\n\
  \n*   如果 Web 服务器上没有安装病毒毒软件，那么服务器被感染的概率很高。Web 服务器与互联网保持持续连接。\n*   如果服务器被感染，那么可能会发生宕机。任何宕机都会导致每停机\
  \ 15 分钟损失 $500 的销售。\n\n风险陈述应当与项目的范围和目标相匹配。如果陈述不在范围或目标之内，则风险评估可能偏离轨道，这意味着发现或建议需要重点关注。\n\
  \n### 成本估算的准确性\n\n由于 `CBA` 的准确性取决于其成本估算，因此获取准确的数据至关重要。然而，这样做可能很。理解数据如何被扭曲是非常重要的。\n\
  \n解决方案的成本往往被低估。例如，持续成本可能未包含在初始成本估计中。看起来易管理的 la 可能需要昂贵的培训。\n\n解决方案的成功可能会被高估。某解决方案可能预计能减少\
  \ 90% 的事件，但在实践中，减少比例可能接近 50%。\n\n有时，人员对于提供准确信息没有切身利益。例如，关注初期销售的销售人员可能会忽略持续成本。预计他们还会强调其产品最积极的方面。\n\
  \n### 记录管理对建议的响应\n\n在向管理层提交建议后，他们将决定做什么。他们可以接受、延迟或修改建议：\n\n*   接受——管理层可以批准建议。获批的建议将获得资金并实施。它们随后被添加到\
  \ `POAM` 中进行跟踪。\n*   延迟——管理层可以延迟某项建议。该建议可能在以后实施。然而，该建议不会包含在接受建议列表中。\n*   修改——管理层可以修改建议。例如，可能建议安装防火墙，但管理层决定安装两个防火墙以实现非军事化区。\n\
  \n### 非军事化区 (DMZ)\n\n非军事化区 (`DMZ`) 通常用于保护面向互联网的服务器。它通常由防火墙组成。一个防火墙过滤互联网到 `DMZ` 的流量，另一个过滤内部网络到\
  \ `DMZ` 的流量。\n\n### 记录接受建议的实施\n\n记录管理层做出的决策很重要。随着时间的推移，如果不记录，决策可能会失真，在建议被延迟或修改时尤其如此。\n\
  \n例如，在网站风险管理计划中，建议购买病毒毒软件，但建议被延迟了。三个月后，系统被恶意软件感染。四小时的宕机导致损失超过 $8,000。人们可能会问为什么没有购买软件。\n\
  \n如果对决策进行了记录，这将是一个易于解决的问题。如果没有记录，结果可能是尴尬的互相指责。\n\n记录不需要很详尽。它可以是一个列出建议和决策的简单文档。它可能像这样：\n\
  \n*   购买病毒毒软件建议——接受。尽快购买软件（注：此处原文为病毒毒软件，修正为病毒毒软件，此处原文此处可能有笔误）。\n`POAM` 被用于分配责任并允许管理层进行跟进：\n\
  \n*   购买病毒毒软件——接受。尽快购买软件。\n*   招聘 IT 管理员——延迟。IT 部门需要提供更清晰的理由。在此期间，IT 部门获授权加班以确保安全需求。\n\
  *   购买 SS75 防火墙——修改。尽快购买两个 SS75 防火墙。这两个防火墙将配置为 `DMZ`。\n\n### 行动计划和里程碑\n\n行动计划和里程碑\
  \ (POAM) 是一种用于跟踪进展的文档。`POAMs` 用于许多类型的项目管理。`POAM` 用于分配责任并允许管理层进行跟进：\n\n*   分配责任——`POAM`\
  \ 明确了谁负责每项任务。当任务未按计划完成时，它也明确了该向谁追责。\n\n\n\n\n\n- **管理跟进**——项目经理（PM）和高层管理可以使用 `POAM`\
  \ 来跟进项目。`POAM` 允许经理快速确定任何项目的状态。当使用项目管理工具时，问题的根源往往很容易识别。\n\n`POAMs` 对于审计过的项目也有用。例如，`HIPAA`\
  \ 要求进行定期审查。`POAM` 可以显示公司在实现合规方面所取得的进展。如果一家公司没有达到 100% 合规，但能够证明其已取得了重大进展，则可能会豁免或减少罚款。如果公司没有任何任何表明进展的文档，则可能被处以最高额罚款。\n\
  \n`POAM` 不要求特定的格式。某公司可能在 Microsoft Excel 表格中创建 `POAM`，为每个项目设置 15 列。另一家公司可能在 Microsoft\
  \ Word 文档中创建 `POAM`。\n\n### ![](img/Note.png)注意 \n\n`POAM` 也缩写为 `POA&M`。\n\n`POAM`\
  \ 是一个动态的文档。它不是一个创建一次就完成的报告。相反，`POAM` 应该在项目的整个生命周期内不断更新。此外，`POAM` 的外观可能根据项目的阶段而有所不同。在项目早期，`POAM`\
  \ 可能是通用的，但在项目后期，它可能会变得更具体。\n\n例如，在网站风险管理计划中，网站遭到了攻击。在过去的两个月里，它经历了两次重大停机。这两起事件的原因可能是为人知的。然而，所有的威胁和漏洞可能都是未知的。初始的\
  \ `POAM` 可能包含以下通用项目：\n\n* 批准风险管理计划：分配给 \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\\
  _\\_\n* 识别威胁：分配给 \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\\_\n* 识别漏洞：分配给 \\_\\\
  _\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\\_\n* 识别潜在解决方案：分配给 \\_\\_\\_\\_\\_\\_ 截止日期\
  \ \\_\\_\\_\\_\\_\\_\\_\n* 准备风险管理计划报告：分配给 \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\\
  _\\_\\_\n* 批准风险响应计划：分配给 \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\\_\n* 开始实施计划：分配给\
  \ \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\\_\n* 完成实施计划：分配给 \\_\\_\\_\\_\\_\\\
  _ 截止日期 \\_\\_\\_\\_\\_\\_\\_\n\n随后，当管理层批准了具体的建议时，可以为已批准和修改的建议创建一个 `POAM`。`POAM`\
  \ 中的每项建议都可能包含多个行项目。例如，升级防火墙的任务可以是一个大的里程碑。当所有任务完成后，该里程碑即告达成。\n\n* 记录当前防火墙活动：分配给 \\\
  _\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\\_\n* 购买两个 SS75 防火墙：分配给 \\_\\_\\_\\_\\\
  _\\_ 截止日期 \\_\\_\\_\\_\\_\\_\\_\n* 创建防火墙策略：分配给 \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\\
  _\\_\\_\\_\\_\n* 测试防火墙：分配给 \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\\_\n* 实施外部防火墙：分配给\
  \ \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\\_\n* 实施内部防火墙：分配给 \\_\\_\\_\\_\\_\\\
  _ 截止日期 \\_\\_\\_\\_\\_\\_\\_\n* 将 Web 服务器移动到 DMZ：分配给 \\_\\_\\_\\_\\_\\_ 截止日期 \\\
  _\\_\\_\\_\\_\\_\\_\n\n### ![](img/Note.png)注意 \n\n里程碑 是一个计划中的事件。它表示一项主要任务或一组任务的完成。里程碑通常用于项目管理，以验证项目的进展情况。\n\
  \n\n\n\n\n图 4-5 显示了甘特图的一个示例。阴影项目表示已完成的任务。注意，甘特图显示了 DMZ 实施的详细步骤。\n\n![图 4-5 甘特图。](img/9781284183719_CH04_FIGF05.png)\n\
  \n**图 4-5** 甘特图。\n\n甘特图允许经理快速查看项目的进度和状态。在图 4-5 中，所有本应在今天之前完成的任务都已完成。项目经理（PM）只需要关注正在进行中的任务或未来的任务即可。\n\
  \n### ![](img/Note.png) 注意\n\n甘特图由亨利·甘特（Henry Gantt）开发，他在第一次世界大战期间曾于陆军军械局工作。他意识到，如果将过程分解为更小的元素，就可以更容易地控制。正如常说的格言：“如何吃掉大大象？象一口吃。”\n\
  \n另一方面，如果之前的任务没有完成，PM 可以快速识别出关注重点。例如，如果防火墙尚未安装，`Install Firewalls`任务将不会被填充。PM 可以看到该元素已过期并解决问题。\n\
  \n大多数项目管理软件会自动创建甘特图。此外，当项目中的任务完成时，图表会自动指示完成。在计算机普及之前，这些图表是手动填充的。\n\n### 关键路径图\n\n\
  项目中的某些任务延迟不会影响项目的截止日期。其他任务必须按时完成。关键路径图 显示了必须按时完成的任务列表。如果路径中的任务延迟，整个项目将延迟。例如，在购买防火墙之前无法安装。如果购买延迟，安装也将延迟。这两项处于关键路径。另一方面，创建防火墙日志可以延迟。只要延迟时间不是过长，就不会影响整体进度。\n\
  \n图 4-6 显示了防火项目的关键路径图示例。对比图 4-5 和 4-6。注意图 4-6 中缺少两个任务：`Log Firewall Activity`和`Create\
  \ Firewall Policy`。如果这两个任务稍微延迟，不会延迟整个项目。唯一的要求是它们要在`Install Firewalls`任务开始之前完成。\n\
  \n![图 4-6 关键路径图。](img/9781284183719_CH04_FIGF06.png)\n\n**图 4-6** 关键路径图。\n\n###\
  \ NIST 风险管理框架\n\n美国标准与技术研究院风险管理框架 (RMF) 是实施风险管理计划的参考指南。RMF 是一个将安全与风险管理相结合的过程，它遵循七步骤：\n\
  \n1. **准备步骤**——包括所有帮助组织管理安全和隐私风险的活动。\n2. **分类步骤**——对系统以及任何处理、存储和传输的信息进行分类。\n3. **选择步骤**——根据安全分类为系统设置一组基线控制措施。\n\
  4. **实施步骤**——实施控制措施并记录它们在系统运行中使用方式。\n5. **评估步骤**——使用适当的方法评估控制措施的实施程度，并检查它们是否按预期产生正确的结果。\n\
  6. **授权步骤**——根据对组织运营、资产、人员、技术、其他组织和国家的风险判定授权系统运行。\n7. **监控步骤**——持续监控和评估所选的安全控制措施，对系统运行的变化进行影响分析，并报告系统的安全状态。\n\
  \n## 章节总结\n\n风险管理计划是一种特定的项目计划。该项目旨在识别和缓解风险，通过创建目标和项目范围开始。然后识别风险。最后，创建一个响应计划作为缓解风险的建议。管理可以选择接受、延迟或修改这些建议。风险管理计划应包含风险注册表。\n\
  \n然后实施这些建议。跟踪建议的主要工具是行动里程碑计划 (POAM)。POAM 是在整个项目过程中更新的动态文档。可以使用各种图表工具补充 POAM 以简化项目管理任务。NIST\
  \ RMF (SP 800-37 Rev. 2) 是实施风险管理计划时可以有效指南。\n\n### 核心概念和术语\n\n- `亲和图`](#13_chapter04_07.xhtml#fig4-5)\n\
