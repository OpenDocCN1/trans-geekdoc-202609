  ## 威胁、漏洞、资产与影响\nThreats, Vulnerabilities, Assets, and Impact -> 威胁、漏洞、资产与影响\n\n\
  （注：由于您提供的英文文本后半部分存在极其严重的段落重复，为了遵循“绝对不要重复输出原文”的指令，上述译文仅保留了核心内容的翻译。如果需要对每一个重复行进行逐一翻译，请确认。）\n\
  \n\n\n\n\n# 资产价值\n\n资产可以具有有形价值和无形价值。有形价值是资产的实际成本，可以用货币表示，例如 5,000 美元。企业的有形资产包括其库存、家具和机械。有形\
  \ IT 资产的示例包括：\n\n*   `计算机系统`——服务器、台式 PC 和移动计算机\n*   `网络组件`——路由器、交换机、防火墙以及保持网络运行所需的任何其他组件\n\
  *   `软件应用程序`——任何可以安装在计算机系统上的应用程序\n*   `数据`——包括许多企业不可或缺的大型数据库；还包括每位员工或客户使用和处理的数据\n\
  \n无形价值是无法通过成本衡量的价值，例如客户信誉或公司声誉。通常接受的公认会计原则（GAAP）将客户信誉称为商誉。\n\n例如，一家公司通过网站销售产品，每小时产生\
  \ 5,000 美元的收入。托管网站的 Web 服务器故障并停机两小时。修复费用总为 1,000 美元。有形损失是多少？\n\n*   `损失收入`——5,000\
  \ 美元乘以两小时，等于 10,000 美元\n*   `修复成本`——1,000 美元\n*   `总有形价值`——11,000 美元\n\n无形价值并不容易计算，但仍然很重要。例如，一个有紧急需求的客户在网站宕机时尝试购买。如果相同的产品在其他地方可用，他或她可能会选择在其他地方购买。这种经历可能会损害该客户对组织的声誉，而且如果客户在其他业务的体验是良好的，客户下次想购买此产品时可能会直接去第二家公司。这种未来业务的损失是无法衡量的，这使其成为无形。\n\
  \n无形价值包括：\n\n*   `未来的收入损失`——客户在另一家公司的任何额外购买对于网站宕机的公司来说都是损失。\n*   `获取客户的成本`——吸引客户投入了大量资金。向回头客户进行销售比获取新客户容易得多。如果公司失去了一个客户，公司的投资就付了。\n\
  *   `客户影响`——客户有朋友、家人和业务伙伴。他们经常与他人分享他们的经历，特别是当这种经历特别积极或消极时。\n*   `声誉`——客户会与他人分享他们的负面经历，因此一个客户的糟糕经历可能会影响其他当前或潜在客户避免未来的业务交易。\n\
  \n风险管理的早期步骤之一是识别公司的资产以及与资产相关的成本。这些数据被用于对不同资产的风险进行排序。一旦确定了风险的优先级，识别保护资产的风险管理流程就会变得更容易。\n\
  \n### 影响\n\n影响是损失的，可以用货币表示，例如 5,000 美元。硬件和软件的价值通常很容易确定。如果一台笔记本电脑被盗，可以使用购买或重置价值来确定被盗笔记本电脑的价值。然而，某些损失并不容易确定。如果那台笔记本电脑存有数据，那么数据的价值就很难估计。\n\
  \n可以使用描述性术语而非货币术语来解释损失的影响。例如，可以用相对术语描述损失，如高、中、低，这有助于组织通过描述潜在危害来量化损失。这种危害可能是针对运营的，例如无法执行关键业务功能；针对资产的，例如硬件或设施；针对个人的，例如个人信息泄露、受伤或丧命；针对其他组织，导致财务损失或关系破裂；或针对国家的，影响政府运营或国家安全。\n\
  \n由美国国家标准与技术研究院（NIST）发布的《风险评估指南》（`NIST SP 800-30`）包含了以下用于评估威胁对企业资产之影响的量表：\n\n* \
  \  `极高`——表示存在多个严重或灾难性的负面影响。`严重`或`灾难性`表示关键业务功能的丧失。这种损失可能会导致巨大的财务损失或人员严重受伤。\n*   `高`——表示严重或灾难性的负面影响。`高`表示关键业务功能的丧失。`极高`表示多个负面影响。\n\
  *   `中等`——表示严重的负面影响。`严重`表示关键业务功能下降。该组织可能仍能运行但无法恢复正常状态。造成的损害可能是重大的。\n*   `低`——表示有限的负面影响。`有限`表示关键业务功能下降。造成的损害是微道的。\n\
  *   `极低`——表示可以忽略的负面影响。`可以忽略`表示对关键业务功能的影响很小且难以察觉。\n\n## 分类业务风险\n\n个人和企业使用资产的方式在所有行业中各不。如果一个人考虑风险及其对公司的影响，他或她可能会在试图创建一个所有威胁和漏洞的完整列表时迅速感到崩溃。幸运的是，有几种技术可以帮助这一点。以下方法通过将任务集中在人员、流程和技术带来的风险来实现这一点。\n\
  \n### 人员风险\n\n理想情况下，组织中的所有人员都应该易于理解如果不管理风险，会对公司健康造成什么威胁。遗憾的是，风险和风险管理的感知往往不同。在涉及组织安全威胁方面，人员往往是最弱的环节。\n\
  \nIT 资源有效风险管理的挑战之一是在安全性和可用性之间实现适当的平衡。图 1-2 显示了一幅图。在图中，左侧计算机被完全锁定，安全级别高到至于控制措施可能会阻止用户充分履行职责。右侧计算机易于使用，但忽视了安全。在中间，实现了两者之间的平衡。\n\
  \n```\n![图 1-2 组织中安全与可用性的平衡](img/9781284183719_CH01_FIGF02.png)\n```\n\n**图 1-2**\
  \ 组织中安全与可用性的平衡。\n\n平衡的安全很少让所有人满意。安全人员想要紧锁系统，而终端用户认为这些安全控制不方便并希望更高的可用性。\n\n以下角色的人员对风险的感知不同是常见现象：\n\
  \n*   `领导和经理`——领导和经理主要关注盈利和生存能力。由于攻击会导致 C-I-A 损失，领导愿意投入资金来减轻风险。然而，他们对风险的看法通常基于风险和控制相关的成本。经理需要准确的事实来就实施哪些控制措施来保护公司资产做出决策。\n\
  \n\n\n\n\n### 角色\n\n- **系统管理员**——系统管理员负责保护 IT 系统。当他们理解风险时，往往希望尽可能严密地封锁系统。管理员通常是技术水平极高的人员。有时，他们会忽视平衡安全成本与盈利之间关系的需求。有些组织设有管理员（通常是\
  \ 1 级管理员），作为 IT 支持的第一道防线。这些管理员被授予有限的管理权限。他们通常将安全控制视为执行工作的阻碍，并且并不总是意识到这些控制的重要性。例如，他们并不总是理解使用变更管理流程的必要性。出于良好的技术人员为了解决一个问题可能会跳过变更流程，但无意中制造了另一个问题。这些未经批准的更改可能会导致业务损失。\n\
  \n- **开发人员**——某些公司拥有内部应用开发人员。他们编写可供内部使用或作为公司产品的一部分出售的应用程序。许多开发者已经养成了安全计算思维。他们意识到安全需要从设计阶段开始，一直贯到发布阶段。当开发者没有养成安全思维时，他们往往尝试在开发周期的末尾修复安全漏洞。这种补丁思维很少能解决所有问题，并导致发布带有漏洞的软件。理想情况下，安全应该是软件或应用开发生命周期中不可或缺的步骤。\n\
  \n- **终端用户**——终端用户只希望计算机为他们工作。他们最关注的是可用性，通常不理解安全控制和限制的原因。相反，安全被视为一种不便。出于善好的用户经常尝试绕过控制以完成工作。例如，由于\
  \ USB 优盘经常在用户不知情的情况下传输病毒，公司经常实施限制使用优 盘的策略。然而，一个需要将文件从一台电脑传输到另一台电脑以完成项目截止日的用户，可能会将\
  \ USB 优盘视为必要的解决方案。\n\n![](img/Tip.png) **提示**\n\n可以通过书面政策（告诉人们不要使用优 盘）以及使用技术控制来限制优\
  \ 盘的使用。计算机用户可以很容易忽略书面政策，但无法轻易绕过技术控制。最佳实践是创建并执行书面和技术这两种类型的策略。\n\n这些不同角色持有者的认知可以通过针对性培训来解决。某些培训可以涵盖所有员工。其他培训应针对特定角色。针对性培训有助于角色持有者更好地理解大局。它还可以帮助他们理解安全的重要性及其对公司成功的价值。负责管理风险的人必须考虑到所有的认知。如果任何控制可以被绕过，情况尤为如此。例如，笔记本电脑被盗是某些公司的常见问题。员工可能离开笔记本电脑去会议现场休息，结果回来时发现电脑不见了。如果公司购买硬件锁（可以将笔记本电脑固定在桌子或其他家具上），这种风险几乎可以被消除。然而，如果用户不认为该风险是真实的，他们可能简单地不使用锁；因此，必须让他们接受培训，以理解控制以及不遵守控制对（公司和他们自己）造成的后果。\n\
  \n### 缺乏流程带来的风险\n\n流程代表为了达到预期结果而采取的行动。缺乏正式流程是任何组织风险的产生因素。例如，如果没有创建配方和培训厨师的流程，面包店就无法持续生产出美味的杯蛋糕，并面临收入损失的风险。如果没有库存控制流程，销售公司可能会面临因供应不足而失去客户的风险。对于许多组织来说，这些流程以政策、标准和指南的形式存在。列表描述了与\
  \ IT 资源的一些流程：\n\n- **策略**——策略是由组织领导层直接发布的正式声明，例如可接受使用政策，它描述了在使用公司拥有的计算机和网络资源时可接受和不可接受的行为。\n\
  \n- **标准**——标准是旨在支持或至少为策略提供某些方向的强制性规则。例如，密码标准可以遵循可接受使用政策。\n\n- **指南**——指南不是强制性的，但对特定行为提供指导。例如，编写了关于如何创建强密码的指南。\n\
  \n理想情况下，所有组织都应该有一份通用的信息安全策略，并可能制定特定的策略来定义业务将如何处理访问控制、远程访问、电子邮件使用、事件响应、灾难恢复、业务连续性和其他风险状况。\n\
  \n### 技术带来的风险\n\n无论是在小型企业、大型政府机构还是上市公司，大多数 IT 基础设施都由图 1-3**所示的七个领域组成：用户、工作站、LAN、LAN-到-WAN、WAN、远程访问和系统/应用程序。每个领域都带来自己的一套风险。识别技术带来的风险的一种方法是审查每个领域，重点关注威胁、漏洞和损失的影响。\n\
  \n![FIGURE 1-3 典型 IT 基础设施的七个领域。](img/9781284183719_CH01_FIGF03.png)\n\n**图 1-3**\
  \ 典型 IT 基础设施的七个领域。\n\n以下示例描述了每个领域的*某些*风险；每个领域存在的风险比描述的要多。企业必须在每个领域中都提供保护。任何一个领域的弱点都可能被攻击者利用，即使其他六个领域存在漏洞。\n\
  \n#### 用户领域\n\n用户领域定义了人们与组织信息系统交互的方式。他们可以是客户、员工、承包商或顾问。“链条的强弱取决于最薄弱的一环”这句老话也适用于\
  \ IT 安全。人往往是 IT 安全中最薄弱的一环。例如，一个组织可能要求使用难以破解的强且复杂的密码，但员工可能会将密码写在便利贴上，导致组织面临未经授权访问的风险。\n\
  \n#### 工作站领域\n\n工作站可以是台式机或笔记本电脑、特殊用途终端，或任何连接到组织网络的设备；工作站是用户首次访问组织系统、应用程序数据的地方。工作站领域需要严密的安全和访问控制。此外，操作系统和应用程序中不断发现\
  \ Bug 和漏洞。软件供应商定期发布补丁和修复程序，以帮助保护系统。\n\n#### LAN 领域\n\nLAN 领域是防火墙内部的区域。局域网（LAN）可以是小型家庭办公室网络中连接的单一工作站和打印机，也可以拥有成千上万设备的大网络。由于这些设备共享网络资源，它们容易受到攻击单个设备的威胁。例如，用户可能会访问风险网站，并在不知情的情况下下载会感染整个网络的病毒。\n\
  \n#### LAN-to-WAN 领域\n\n\n\n\n局域网到广域网（LAN-to-WAN）域是 IT 基础设施连接到广域网（WAN）和互联网的地方。局域网到广域网为整个组织提供互联网访问，并作为广域网的边界。边界的公侧通常连接到互联网，是黑客寻找漏洞以未经授权访问局域网频繁的目标。\n\
  \n## WAN 域\n\n广域网（WAN）域连接远程地点。管理 WAN 域的目标是让用户尽可能获得访问权限，同时确保进出数据是安全的。为了确保 WAN 域内主机的安全，需要大量的安全性。与此域相关的风险包括窃听和授权访问，因为该域的大部分流量是以明文发送的，这意味着黑客可以获取用户名和密码。此外，数据还面临损坏和恶意攻击。\n\
  \n### 远程访问域\n\n远程访问域将远程用户连接到组织的 IT 基础设施。对于在现场或家里工作的员工（例如外销代表、技术支持专家或医疗保健专业人员），远程访问至关重要。Wi-Fi\
  \ 热点使用户轻松连接到虚拟专用网络（VPN）以访问电子邮件和其他业务应用程序，但如果员工设备被盗或未妥善保护，也会对组织的专有数据构成风险。\n\n### 注意\n\
  ![](img/Note.png)\nVPN 连接使用隧道协议来降低数据被捕获的风险。隧道协议加密通过网络发送的流量，这使得攻击者更难捕获和读取数据。\n\n\
  ## 系统/应用程序域\n\n系统/应用程序域是存储数据的地方。这些数据可以是私有客户数据、知识产权或国家安全信息。数据是攻击者在 IT 系统深处寻求的东西。无论是由于攻击、灾难还是疏忽导致的数据丢失，都是系统/应用程序域最大的威胁。\n\
  \n### 提示\n![](img/Tip.png)\n应该根据托管应用程序所需的特定安全要求锁定服务器。换句话说，电子邮件服务器需要一套保护措施，这与数据库服务器所需的保护不同。\n\
  \n## 风险识别技术\n\n本章前面介绍了风险和损失。风险是某些意外情况发生的可能性或概率。某些风险会导致损失。当威胁暴露漏洞并损害资产时就会产生损失。要识别风险需要遵循以下三个步骤：\n\
  \n1. 识别威胁\n2. 识别漏洞\n3. 估计威胁利用漏洞损害资产的可能性\n\n接下来的章节将探讨这些概念。\n\n### 识别威胁\n\n威胁是任何可能导致损失的状况或事件。换句话说，它是任何代表可能危险的活动。损失或危险与以下内容直接相关：\n\
  \n*   **机密性丢失**——某人看到了个人的密码或公司的“秘密配方”。\n*   **完整性丢失**——邮件信息在传输过程中被修改、病毒感染了文件，或有人对网站进行了未经授权的更改。\n\
  *   **可用性丢失**——电子邮件服务器宕机导致无法访问电子邮件，或文件服务器宕机导致无法使用文件。\n\n威胁识别是创建威胁列表的过程。公司应尝试识别组织的所有可能威胁，这并不是一项易事。该列表可能非常详尽。\n\
  \n为了编制此威胁列表，企业通常会考虑以下几类威胁：\n\n*   **外部或内部**——外部威胁位于组织边界之外。它们也可以被认为是组织控制范围之外的风险。内部威胁位于组织边界之内。它们可能与有权访问资源的员工或其他人员有关。内部威胁可能与业务控制的任何硬件或软件有关。\n\
  *   **自然或人为**——自然威胁通常与天气有关，如飓风、龙卷风和冰雹风暴。地震和海啸也是自然威胁。人为威胁是人类引起的。任何破坏资源的尝试都是人为的。可能是人为或自然的，取决于火是如何引起的。\n\
  *   **故意或意外**——破坏机密性、完整性或可用性的尝试是故意的。员工错误或用户错误是意外的。损坏数据的故障程序被认为是意外的。\n\n识别威胁列表的方法之一是头脑风暴会议。在头脑风暴中，参与者提出脑海中的任何想法。所有想法都被记录。这种创意过程有助于发现仅通过逻辑分析问题时可能遗漏的想法。\n\
  \n组织的威胁示例包括：\n\n*   未经授权访问数据的员工\n*   任何类型的恶意软件\n*   攻击者篡改网站\n*   任何 DoS 或 DDoS 攻击\n\
  *   试图访问数据的外部攻击\n*   任何数据丢失\n*   任何服务中断\n*   社会工程欺骗员工泄露秘密\n*   地震、洪水或飓风\n*   雷击\n\
  *   电力、供暖或空调故障\n*   火灾\n\n当这些威胁暴露漏洞并可能损害资产时，它们代表了可能的风险。\n\n当然，还会识别出特定组织的威胁和漏洞。事实上，拥有多个地点的业务在每个地点可能都有独特的威胁和漏洞。\n\
  \n### 识别漏洞\n\n漏洞是弱点这一点在章节前面介绍过。漏洞在威胁利用它们时变得明显。理想情况下，漏洞在威胁利用它们之前被识别出来。幸运的是，大多数组织都有资源可以帮助做到。\n\
  \n常用的资源包括：\n\n*   **审计**——许多组织定期进行审计。检查系统和流程以验证公司是否遵守现有法律法规。审计人员在报告中记录发现，列出与漏洞直接相关的发现。\n\
  *   **认证和认可记录**——有多种标准用于检查和认证 IT 系统。如果系统符合标准，则 IT 系统可以获得认可。整个过程包括详细文档。审查这些文档可以识别现有和潜在漏洞。\n\
  *   **系统日志**——许多类型的计算机系统日志可用于识别威胁。审计日志可以确定用户是否访问敏感数据。防火墙日志可以识别试图入侵网络的流量以及被恶意软件接管作为僵尸运行的计算机。域名系统（DNS）日志可以识别未经授权的数据传输。\n\
  *   **先例事件**——之前的安全事件是数据的来源。作为已发生风险的证据，它们有助于证明控制的合理性。它们展示了已经发生的问题并可以显示趋势。理想情况下，安全事件产生的漏洞会在事件发生后立即解决。\n\
  \n\n\n\n-   **故障报告**——大多数公司使用数据库来记录故障电话。这些数据库可能包含丰富的信息。通过少量的分析，可以使用它们来识别趋势和弱点。\n\
  -   **应急响应团队**——某些公司设有应急响应团队。这些团队将调查公司内部所有的安全事件。可以对团队成员进行访谈以获取丰富的信息，因为他们通常渴望帮助减少风险。\n\
  \n### 使用典型 IT 基础设施的七个领域识别弱点\n\n识别弱点的另一种方法是检查典型 IT 基础设施的七个领域，这些领域在本章之前已经介绍过。每个领域都可以单独进行检查。此外，每个领域都可以由该领域的专家进行检查。以下列表提供了这些领域中漏洞示例：\n\
  \n-   **用户域**——社会工程是一个巨大的漏洞。例如，Sally 接到一个电话：“你好，我是帮助台的 Bob。我们在你的电脑上发现了一个病毒。”随后 Bob\
  \ 试图引导 Sally 完成一个漫长而详细的过程，然后说：“我为什么不直接帮你修复它，这样你就可以回去工作了？我只需要你的密码。”\n\n-   **工作站域**——未打补丁的计算机可能会被利用。如果它们没有安装杀毒软件，就可能被感染。\n\
  \n-   **局域网域**——网络上任何未通过适当访问控制保护的数据都是脆弱的。弱密码会被破解。未正确分配的权限会导致未经授权的访问。\n\n-   **局域网到广域网域**——如果允许用户访问恶意网站，他们可能会下载恶意软件。开启了不必要端口的防火墙允许从互联网访问内部网络。\n\
  \n-   **广域网域**——任何面向公共服务器都容易受到 DoS 和 DDoS 攻击。允许匿名上传的文件传输协议（FTP）服务器可能会托管来自黑客的盗版软件（warez）。\n\
  \n-   **远程访问域**——远程用户可能感染了病毒但不知。当他们通过远程访问连接到内部网络时，病毒可能会感染网络。\n\n-   **系统/应用域**——数据库服务器可能会受到\
  \ SQL 注入攻击。在 SQL 注入攻击中，攻击者可以读取整个数据库。SQL 注入攻击还可以修改数据库中的数据。\n\n本节并不代表完整的列表；它做不到。IT\
  \ 系统中发现的漏洞数量正在不断增加。MITRE 公司的目录 常见漏洞与披露 (CVE) 目前包含超过 40,000 项。\n\n#### ![](img/Tip.png)\
  \ 提示\n\n某些恶意软件可以控制多台计算机并将其作为机器人控制。控制计算机发出攻击命令，计算机便进行攻击。单个计算机被称为 `zombies`（僵尸）。受控计算机的网络被称为\
  \ `botnet`（僵尸网络）。\n\n#### ![](img/Tip.png) 提示\n\n`Warez`读作“wares”）是一个描述盗版文件的术语。示例包括盗版游戏、MP3\
  \ 文件和电影。Warez 网站通常包含任何人都可以下载的黑客工具，包括黑客。\n\n#### ![](img/Tip.png) 提示\n\n`SQL 注入攻击`\
  \ 尝试访问网站的数据。SQL 语句被输入到文本框中。如果网站没有进行防御性编程，这些 SQL 语句就可以针对数据库执行。目前已有许多程序可以发起 SQL 注入攻击并检索整个数据库。\n\
  \n### 评估影响和可能性\n\n识别风险的第三步是估计威胁利用漏洞损害资产的可能性。将威胁与现有的漏洞进行匹配，以确定威胁对组织的影响。\n\n在之前的“识别威胁”部分列出了几种威胁。表\
  \ 1-1 选取了部分威胁并将它们与漏洞匹配，以识别可能损失的影响。\n\n**表 1-1** 评估威胁的影响\n\n| 威胁 | 漏洞 | 影响 |\n| ---\
  \ | --- | --- |\n| 未经授权的员工尝试访问服务器上的数据。 | 组织未使用适当的身份验证和访问控制。 | 可能的损失取决于数据的敏感性及其使用方式。例如，如果未经授权的员工访问了工资数据并自由分享，可能会影响士气生产力。\
  \ |\n| 任何类型的恶意软件（如病毒或蠕虫）进入网络。 | 杀毒软件未能检测到病毒。 | 病毒可能会安装在系统上。病毒通常会导致机密性、完整性或可用性的丢失。\
  \ |\n| 攻击者修改或篡改网站。 | 网站未受保护。 | 取决于攻击者如何修改网站，公司的信誉可能会受到影响。 |\n| 社会工程师欺骗员工透露密码。 |\
  \ 用户未经过充分培训。 | 密码可能会泄露。获得密码的攻击者可以接管用户的帐户。 |\n\n在将威胁与漏洞配对时，通常使用以下公式：\n\n```\n风险 =\
  \ 威胁 × 漏洞\n```\n\n然而，这不是一个真正的数学公式。威胁和漏洞并不总是具有数值。相反，该公式显示了两者之间的关系。\n\n如果可以识别价值，公式稍微修改为：\n\
  \n```\n总风险 = 威胁 × 漏洞 × 资产价值\n```\n\n#### 平衡风险与成本\n\n管理风险的成本必须与影响价值进行平衡。如果可用，成本可以用货币衡量。也可以通过相对值（如`低`、`中`和`高`）来平衡。表\
  \ 1-2 显示了如何分配相对值的示例。可能性纵向显示，影响值横向显示。如果威胁发生的概率为 0% 到 10%，则赋值为低。如果概率在 11% 到 50% 之间，赋值为中。如果概率在\
  \ 51% 到 100%，则赋值为高。同样，影响可以分为低、中、高。\n\n**表 1-2** 威胁-可能性–影响矩阵\n\n![](img/Table1-2.png)\n\
  \n有时，风险发生的可能性及其影响都非常大，这提供了一个容易的选择。例如，没有杀毒软件的系统会被感染。这种威胁很常见。可能性很高。当这种情况发生时，感染的系统可能会导致业务数据的泄露或破坏。影响也很大。这种风险需要缓解。杀毒软件的成本远低于影响成本。因此，企业中常用杀毒软件。\n\
  \n其他情况下，可能性较低，但影响很大。例如，数据中心发生灾的风险较低。然而，影响很大。企业通常会配备火灾检测和灭火设备，以防止火灾发生时的影响。还会购买保险以减少火灾造成损害时的影响。\n\
  \n\n\n\n\n不符合合理性测试的风险是可以接受的。例如，核战争的威胁确实存在。公司可以投入资源为所有员工建造防空洞，并储备维持 30 年的食物和水。然而，这种情景并不合理。\n\
  \n另一个例子是考虑一家位于佛罗里达州东岸的公司。飓风是一个非常真实的威胁，应该被考虑在内。然而，大地震席卷佛罗里达州东岸的可能性相对较小，不需要处理。但是，位于旧金山的企业则有不同的考虑。那里的地震是真实的威胁，但飓风不是。因此，对于旧金山来说，飓风风险是可以被接受的，而地震风险则是不被接受的。\n\
  \n### 提示\n![Tip](img/Tip.png) \n\n可以创建一个更详细的“威胁可能性-影响”矩阵。例如，与其为威胁可能性分配低、中、高值，不如可以分配实际的百分比。此外，可以使用更多的类别，而不仅仅是三个。使用更多类别可以增加它们之间的区分度。同样，可以为影响范围分配一个范围内的任何数字。表\
  \ 1-2 中的矩阵使用了 10、50 和 100 的范围，但 1 到 100 之间的任何数字都可以。\n\n合理性的另一个标准仅关注组织内部或被评估系统内部的漏洞。外部漏洞通常不处理。例如，如果空调故障，服务器很可能会故障。这种情况在识别机房的漏洞时会被处理。而这种漏洞并不会针对机房内\
  \ 50 台服务器中的每一台进行单独处理。同样，商业用电可能会中断。这种情况可以通过配备不间断电源（UPS）和发电机来解决。然而，不需要为商业供电公司寻找替代方案。\n\
  \n### 风险管理流程\n在本章前面的部分，风险管理被定义为识别、评估、控制和缓解风险的实践。识别与组织相关的威胁和漏洞是一个重要步骤，就像了解资产的价值有助于确定其损失的影响一样。有了这些信息，就可以采取行动来减少这些风险对资产造成的潜在损失。\n\
  \n意识到风险管理不等同于消除风险是非常重要的。消除风险并不是一个合理的目标。相反，风险管理试图识别可以以合理成本降至最低的风险，并实施控制措施来实现这一点。风险管理包括几个要素：\n\
  \n*   **评估风险**——风险管理从风险评估或风险分析开始。风险风险有几个步骤：\n    *   **识别组织的资产及其价值**——当关注 IT 时，这些资产可以包括数据、硬件、软件、服务以及\
  \ IT 基础设施本身的组件。\n    *   **识别针对资产的威胁和漏洞**——对威胁和漏洞进行优先级排序。\n    *   **识别漏洞被威胁利用的可能性**——这些漏洞就是风险。\n\
  \    *   **识别风险的影响**——影响较大的风险应该优先处理。\n*   **识别风险响应**——风险可以被规避、分担、转移、缓解或接受。\n*  \
  \ **选择控制措施**——在识别风险之后，可以选择控制措施。\n*   **实施并测试控制措施**——一旦实施了控制措施，应对对其进行测试。\n*   **评估控制措施**——风险管理是一个持续的过程。\n\
  \n### 提示\n![Tip](img/Tip.png)\n\n## 成本效益分析\n可以进行成本效益分析 (CBA)以帮助确定实施哪些控制措施或应对措施。如果收益大于成本，通常会选择该控制措施。\n\
  \nCBA 比较了业务影响与实施成本。\n\n### 提示\n启动 CBA 从收集数据开始，以识别控制措施的成本以及实施它们后的收益。\n\n*   **控制成本**——控制成本包括购买成本加上该控制措施在整个生命周期内的运营成本。\n\
  *   **预期收益**——预期收益包括实施控制措施后可能获得的潜在收益。这些收益通过检查损失成本以及如果实施控制措施后损失将减少多少来确定。\n\n控制措施并不总是能消除损失。相反，它是减少损失。例如，某项当前风险的年度损失平均为\
  \ 100,000 美元。如果实施了控制措施，这些损失可能会减少到 10,000 美元。因此，该控制措施的收益为 90,000 美元。\n\n可以使用以下公式确定应该使用该控制措施：\n\
  \n```\n控制前的损失 − 控制后的损失 = 控制成本\n```\n\n例如，公司去年在没有实施任何控制措施的情况下损失了 100,000 美元。如果实施了控制措施，预计每年损失为\
  \ 12,000 美元。控制措施的成本估计为 7,000 美元。为：\n\n```\n$100,000 − $7,000（控制成本） − $12,000（预期剩余损失）\
  \ = $81,000\n```\n\n实施该控制措施代表了 81,000 美元的收益。\n\n\n\n\n执行成本效益分析（CBA）面临的最大挑战之一是获取准确的数据。虽然当前的损失通常容易获得，但未来的成本和收益则需要进行估计。成本往往被低估，而收益往往被高估。\n\
  \n控制措施的即时成本通常是可见。然而，有时持续性成本是隐藏的。某些隐藏成本可能包括：\n\n*   培训员工的成本\n*   持续维护成本\n*   软件和硬件更新成本，例如订阅费用\n\
  \n根据比例原则，如果成本超过了收益，组织可能会选择不实施该控制。相反，它可能会选择接受、分担、转移或规避风险。\n\n## 盈利能力与生存能力的对比\n\n\
  在评估风险管理成本时，必须同时考虑盈利能力和生存能力：\n\n*   `Profitability`（盈利能力）——盈利能力是指公司获取利润的能力。其计算方法为收入减去成本。\n\
  *   `Survivability`（生存能力）——生存能力是指公司遭受风险导致损失的能力。某些损失（如火灾）可能是灾难性的，并将导致业务失败。\n\n从盈利能力来说，损失可能会摧毁一家业务。从生存能力来说，损失可能导致公司永远无法盈利。与风险管理相关的成本并不直接贡献于收入增长。相反，这些成本有助于确保公司即使在遭受损失时也能继续运营。\n\
  \n关于盈利能力和生存能力，应考虑以下几项：\n\n*   `Out-of-pocket costs`（自付费用）——减少风险的成本来自现有资金。\n*   `Lost\
  \ opportunity costs`（机会成本）——花费用于减少风险的资金无法用于其他地方，如果这笔钱可以用于其他用途，可能会导致机会流失。\n*   `Future\
  \ costs`（未来成本）——某些应对措施需要持续或未来的成本。这些成本可能是用于更新硬件或软件。未来成本还包括实施这些应对措施的人员成本。\n*   `Client\
  \ and stakeholder confidence`（客户和利益相关者的信任）——客户和利益相关者的信任价值同样重要。如果风险得不到，当威胁利用漏洞时，客户和利益相关者可能会失去信任，给公司带来重大损失。\n\
  *   `Total cost of security`（安全总成本）——安全总成本包括一次性成本（例如在 `IDS` 上花费资金）以及持续性或经常性的成本（例如防病毒软件的订阅费用）。这项成本可能很高，花费的资金减少了公司的整体利润。但替代方案是什么呢？如果不采取这些保护，整个业务可能会停滞。如果这种情况发生得频繁或持续过久，业务可能会失败。\n\
  \n数据通常是企业拥有的价值最高的资产之一。它可以包括客户数据、会计数据（如应付账款和应收账款）以及员工数据。列表可以一直列下去。这些数据对于业务的成功至关重要，因此通常会定期备份。\n\
  \n例如，一家企业每年花费 15,000 美元进行数据备份，这项成本不会增加收入或利润。在整的一年里，数据永远不会丢失，也永远不需要备份。如果仅考虑盈利能力，管理层可能会决定消除这项成本。一旦停止备份，但第二年数据可能会丢失，导致公司失败和破产。\n\
  \n然而，确实需要根据盈利能力来权衡成本。例如，如果一家公司的年度利润仅为 10,000 美元，那么公司每年花费 15,000 美元来保护数据就是没有意义的。\n\
  \n另一方面，例如，一家公司有 100,000 美元的年度利润。它选择不花 15,000 美元进行备份，但病毒在企业内部传播，摧毁了所有客户和会计数据。公司不再拥有应收账款的可靠记录，也没有人可以访问客户群。这样的场景可能是业务终性的灾难性事件。\n\
  \n## 风险处理策略\n\n风险管理也可以被视为处理风险。记住风险管理并不是消除风险是非常重要的。一个不愿意承担任何风险的企业无法长久经营，因为消除所有风险的成本将消耗所有的利润。\n\
  \n风险管理的最终目标是保护组织。它有助于确保业务能够继续运营并盈利。风险管理包括几个步骤：\n\n*   识别风险\n*   评估风险\n*   确定哪些风险将被处理，哪些风险将被接受\n\
  *   采取措施将风险降低到可接受的水平\n\n风险可以被规避、分担或转移、缓解或接受。接下来的章节将解释每种技术。\n\n### 规避\n\n管理风险的方法之一是直接规避它们。规避风险的主要理由是风险的影响超过了资产的收益。\n\
  \n组织可以通过以下方式规避风险：\n\n*   `Eliminating the source of the risk`（消除风险源）——公司可以停止风险活动。例如，公司可能有一个易受攻击的无线网络。可以通过移除无线网络来规避风险，如果无线网络不是公司的重要资产，就可以这样做。\n\
  *   `Eliminating the exposure of assets to the risk`（消除资产对风险的暴露）——公司可以移动资产。例如，数据中心可能因为位于地震频发地区面临风险。可以将其移动到无地震带以消除这种风险，但移动数据中心的成本会很高。\n\
  \n### 分担或转移\n\n<a id=\"\" href=\"#\">分担</a>或转移风险意味着将责任转移给另一方。转移风险转移整个责任。分担风险转移部分责任或责任。组织可以外包部分或全部活动。\n\
  \n*   保险——公司可以购买保险来保护自己免受损失。如果发生损失，保险将涵盖。多种类型的保险均可用，包括火灾险。\n*   活动外包——例如，公司可能希望在网上托管网站。公司可以将网站托管给网络托管提供商。公司和供应商可以就安全、备份和可用性的责任归达成协议。\n\
  \n### 缓解\n\n通过减少漏洞来降低风险。这一过程的主要策略是缓解风险。缓解风险也被称为风险降低。\n\n实施控制措施或应对措施可以减少漏洞。控制措施的成本不应超过收益。确定成本和收益通常需要\
  \ `CBA`，这在本章之前讨论过。\n\n缓解步骤的示例：\n\n*   `Alter the physical environment`——将集线器更换为交换机。将服务器位于锁定的机房内。\n\
  *   `Change procedures`——实施备份计划。异地存储备份副本并测试备份。\n*   `Add fault tolerance`——对存储在磁盘上的重要数据使用\
  \ `RAIDs`。使用故障转移集群保护服务器。\n*   `Modify the technical environment`——增加防火墙的安全性。增加 `IDS`。保持防病毒软件更新。\n\
  *   `Train employees`——培训技术人员如何实施控制措施。培训终端用户识别社交工程攻击。\n\n通常，目标不是消除风险，而是让攻击者付出的代价过高。这里有两个公式：\n\
  \n\n\n\n\n*   `攻击者的成本 < 攻击者的收益`——当此情况成立时，攻击对攻击者来说具有吸引力。\n*   `攻击者的成本 > 攻击者的收益`——当此情况成立时，攻击者不太可能实施攻击。\n\
  \n加密是增加攻击者成本的方法之一。如果公司以明文形式跨网络发送数据，数据可能会被捕获并分析。如果公司对数据进行加密，攻击者必须在分析之前对其进行解密。加密的目标不是让数据无法解密，相反，目标是让攻击者破解数据的成本变得过高或耗时过长。\n\
  \n![Note](img/Note.png)\n备注\n\n简单的备备集群可以包含两台服务器。一台服务器为用户提供服务，另一台作为备用。如果在线服务器发生故障，备用服务器可以感知故障并自动接管。\n\
  \n### 接受\n\n`接受` 风险是另一种选择。公司可以评估风险、理解潜在损失并选择接受它，这通常在控制措施的成本超过潜在损失时这样做。\n\n例如，一家公司托管了一个用于电子商务的\
  \ Web 服务器。该服务器每月产生约 1,000 美元的收入。可以使用备用集群保护该服务器。然而，估计表明，备用集群的成本约为 10,000 美元。如果服务器宕机，可能只宕机一或两个小时，这相当于少于\
  \ 3 美元（每小时收入 = $1,000 × 12 / 365 / 24 = $1.37）。\n\n### 剩余风险\n\n`剩余风险` 是在应用控制措施后仍然留的风险。消除所有风险是不可行的。相反，应采取步骤将风险降低到可接受的水平。留下的风险就是剩余风险。\n\
  \n在本章前面，给出了风险的以下两个公式：\n\n`风险 = 威胁 × 漏洞`\n\n`总风险 = 威胁 × 漏洞 × 资产价值`\n\n可以使用以下公式计算剩余风险：\n\
  \n`剩余风险 = 总风险 – 控制措施`\n\n高层管理人员对由于剩余风险导致的损失负责。他们决定风险应该被规避、共享、转移、缓解还是接受。他们还决定实施哪些控制措施。由于他们的决策导致的任何损失都由他们承担。\n\
  \n## 章节总结\n\n当威胁利用漏洞并导致损失时，风险就会发生。损失可能会损害资产和核心业务功能。损失的影响可以在业务成本中看出。风险管理的步骤是识别威胁和漏洞，然后可以将它们配对，以帮助确定风险的影响。通过实施控制措施，可以减少漏洞。在控制措施上的支出应与风险成正比。\n\
  \n通过选择四种技术之一：规避、共享或转移、缓解或接受，可以管理风险。主要的风险管理技术是缓解风险，也称为风险消减或风险处理。如果已完成成本效益分析（CBA），决定接受损失将变得更容易。\n\
  \n## 核心概念与术语\n\n*   `接受 (accepting)`\n*   `资产 (asset)`\n*   `可用性 (availability)`\n\
  *   `规避 (avoiding)`\n*   `审计 (audit)`\n*   `业务功能 (business function)`\n*   `常见漏洞和披露\
  \ (CVE)`\n*   `机密性 (confidentiality)`\n*   `控制(控制措施) (control)`\n*   `成本效益分析 (CBA)`\n\
  *   `拒绝服务 (DDoS) 攻击`\n*   `侦探性控制 (detective control)`\n*   `灾难恢复 (disaster recovery)`\n\
  *   `分布式拒绝服务 (DDoS)`\n*   `利用 (exploit)`\n*   `商誉 (goodwill)`\n*   `影响 (impact)`\n\
  *   `无形价值 (intangible value)`\n*   `完整性 (integrity)`\n*   `缓解 (mitigating)`\n* \
  \  `策略 (policy)`\n*   `预防性控制 (preventive control)`\n*   `原则 (principle)`\n*   `合理性\
  \ (reasonableness)`\n*   `剩余风险 (residual risk)`\n*   `风险 (risk)`\n*   `风险评估 (risk\
  \ assessment)`\n*   `风险管理 (risk management)`\n*   `风险消减 (risk reduction)`\n*   `共享\
  \ (sharing)`\n*   `标准 (standard)`\n*   `可生存性 (survivability)`\n*   `有形价值 (tangible\
  \ value)`\n*   `威胁 (threat)`\n*   `转移 (transferring)`\n*   `漏洞 (vulnerability)`\n\
  \n### 评估\n\n1. 以下哪项正确定义了风险？\n    1. `威胁 × 漏洞`\n    2. `风险 – 缓解`\n    3. `风险 – 控制`\n\
  \    4. `威胁 × 漏洞 × 资产价值`\n\n2. 只要公司盈利，就不需要考虑可生存性。\n    1. 正确\n    2. 错误\n\n3. 以下哪些是威胁的准确配对？（选二）\n\
  \    1. 外部和内部\n    2. 自然和超自然\n    3. 蓄意和意外\n    4. 计算机和用户\n\n4. 失去客户信任或公众信任是损失的一个例子。\n\
  \n5. `控制` 用于减少漏洞。\n\n6. 信息安全计划的主要目标是什么？\n    1. 与员工行为相关的损失\n    2. 通过风险消除风险\n  \
  \  3. 减少与剩余风险相关的损失\n    4. 减少与机密性、完整性和可用性的损失\n\n7. `CVE` 是行业认可的常见漏洞列表。\n\n8. 以下哪项是风险管理的目标？\n\
  \    1. 识别风险与控制之间的正确平衡\n    2. 通过控制消除风险\n    3. 消除与风险相关的损失\n    4. 计算与剩余风险相关的价值\n\
  \n9. 如果收益超过成本，则实施控制措施。成本和收益通过完成成本效益分析（CBA）来确定。\n\n10. 公司通过购买保险来减少威胁的损失，这被称为风险转移。\n\
  \n11. 如何管理风险？（选三）\n    1. 接受\n    2. 转移\n    3. 规避\n    4. 迁移\n\n12. 在应用了降低环境风险的控制措施后，剩余的风险称为什么？\n\
  \    1. 剩余风险\n    2. 缓解风险\n    3. 管理的风险\n    4. 剩余风险\n\n13. 谁对由于剩余风险导致的损失最终负责？\n\
  \    1. 终端用户\n    2. 技术人员\n    3. 高层管理人员\n    4. 安全人员\n\n\n\n\n**组织资产**包括数据、人员、流程和技术系统。这些资产每天面临着真实的威胁，有时这些威胁是不可避免的。为了管理这些威胁带来的风险，必须识别哪些资产需要保护以及这些威胁的来源。此外，了解资产中存在哪些可能被威胁利用的漏洞也至关重要。威胁通常利用漏洞来损害资产。理解威胁与漏洞之间的关系（也称为**威胁/漏洞对**）对于降低风险至关重要。\n\
  \n美国联邦政府在信息安全领域做出了许多努力，包括开发相关框架以帮助理解和管理与组织资产相关的风险。框架的一个示例是美国国家标准与技术研究所（`NIST`）提供的风险管理框架（`RMF`）。`NIST\
  \ RMF 800` 特别出版物系列涵盖风险活动生命周期的政策和标准。这些出版物可以在 `NIST.gov` 网站免费获取。此外，国土安全部（`DHS`）监督其他几项与信息技术（`IT`）安全相关的计划。\n\
  \n## 第 2 章主题\n\n本章涵盖了以下主题和概念：\n\n*   什么是资产以及为什么它们需要管理\n*   什么是威胁以及如何管理它们\n*   什么是漏洞以及如何管理它们\n\
  *   什么是利用（exploits）以及如何管理它们\n*   美国联邦政府资助的风险管理计划的价值是什么\n\n## 第 2 章目标\n\n完成本章后，你将能够：\n\
  \n*   解释什么是资产以及为什么它们需要被保护\n*   描述威胁的不可控性\n*   列出无意和故意威胁\n*   识别管理威胁的最佳实践\n*   识别威胁/漏洞对\n\
  *   定义 `mitigation`（缓解）\n*   列出并描述用于缓解漏洞的方法\n*   识别管理漏洞的最佳实践\n*   定义 `exploit`（利用）\n\
  *   描述者在漏洞和利用中的角色\n*   识别缓解技术\n*   识别管理利用的最佳实践\n*   识别美国联邦政府风险管理计划的目的\n\n## 理解与保护资产\n\
  \n资产代表任何需要保护的有价值的事物。在 `IT` 世界中，资产包括数据、人员、流程和技术系统。运行技术系统的人员以及组织开发的流程（如策略、标准和指南）都是值得保护的重要资产，正如技术系统中的数据一样。这些领域中的任何弱点都可能被威胁利用来损害这些资产。组织需要保护其资产；否则，业务将变得极难管理甚至停止存在。\n\
  \n## 理解与管理威胁\n\n威胁是指任何代表对资产可能产生危险的行为或活动。威胁包括任何可能对业务资产的机密性、完整性可用性产生不利影响的情况或事件。\n\n\
  威胁是产生风险的方程式的一部分：\n\n```\nRisk = Threat × Vulnerability × Asset\nR = TVA\n```\n\n\
  任何管理风险的尝试都需要对威胁有深入了解。本节包含以下主题：\n\n*   威胁的不可控性\n*   无意威胁\n*   故意威胁\n*   在 `IT` 基础设施中管理威胁的最佳实践\n\
  \n### 威胁的不可控性\n\n意识到关于威胁的几个基本事实是非常重要的：\n\n*   威胁无法消除。\n*   威胁始终存在。\n*   有时，威胁会持续。某些威胁在资产（如网络）中持续很长时间仍未被检测到。\n\
  *   可以采取行动来减少威胁发生的可能性。\n*   可以采取行动来减少威胁的影响。\n\n例如，无法阻止小偷想要进入计算机实验室偷取电脑或其包含的数据。然而，可以采取措施来增强或减少针对计算机实验室的威胁。为了增加小偷闯入计算机实验室的机会，可以采取措施，但为了减少计算机实验室的威胁，也可以采取措施。为了增加小偷闯入计算机实验室的概率，可以采取措施，但为了减少这种威胁，可能导致门未关闭。在任何情况下，都可以采取措施来减少威胁发生的概率。\n\
  \n然而，可以采取措施来减少计算机的影响的影响。\n\n`IT` 软件的威胁也是类似的。雷击袭击建筑，恶意软件作者不断编写新程序，脚本小子（script kiddies）只是为了看看能做什么。专业攻击者花费百分之百的时间试图进入个人、政府和公司网络。无法阻止他们想要这样做，但可以通过增加其难度来挫败他们。\n\
  \n### 无意威胁\n\n`无意威胁`是指那些没有犯罪行为者的威胁；它们不是因为有人刻意攻击而发生的。自然事件和灾害、人为错误和简单的意外被视为无意威胁。\n\
  \n无意威胁主要分为四类：\n\n*   `环境`——影响环境的威胁。它们包括天气事件，如洪水、龙卷风和飓风。地震和火山也是环境威胁。疾病流行病会导致劳动力损失并减少系统的可用性。\n\
  *   `人为`——人为引起的错误。击键错误可能导致输入错误或无效数据。用户可能会忘记输入关键数据。技术人员可能未能遵循备份程序导致备份不完整。管理员可能会编写不完整或错误的备份程序。未发现的软件漏洞也可能导致严重问题。\n\
  *   `意外`——从微小失误到重大灾难的任何。挖掘机在为新电缆挖掘新沟时可能会不小心切断电源或数据电缆。员工可能在休息室意外引发火灾。\n*   `故障`——设备问题。硬盘崩溃、服务器故障或路由器停止路由流量。空调可能停止吹冷风，导致多个系统过热并故障。任何这些故障都可能导致数据或服务的可用性丢失。\n\
  \n尽管这些威胁是无意的，但可以通过风险管理计划来应对。以下是一些常见方法：\n\n*   `管理环境威胁`——可以购买保险来减少许多环境威胁的影响。企业可能会决定搬迁以减少威胁。例如，位于圣海伦山火山附近的企业可以搬迁以避开火山喷发。飓风带的公司可以将业务转移到其他地方。\n\
  \n\n\n\n*   **减少人为错误**——自动化和输入验证是减少错误的常用方法。任何可以自动化的过程都将以一致的方式运行。输入验证在数据数据之前进行检查以确保其有效性。例如，如果程序期望一个名字，输入验证器会检查该数据看起来是否像一个有效的名字。有效名字的规则可能是不超过\
  \ 20 个字符、不包含数字，且仅允许特定的特殊字符。输入验证无法确保数据的准确性，但它可以确保数据的有效性。\n\n*   **防止事故发生**——在密歇根州，在挖掘之前，可以联系\
  \ `1-800-MISS-DIG` 公司或其他地区的类似公司或机构来识别地下电缆。服务器房应安装空调以防止设备崩溃。为了防止常见事故，应该强调安全性的重要。\n\
  \n*   **避免故障**——可以使用容错和冗余系统来防止故障的即时影响。独立磁盘冗余阵（`RAID`）系统有助于确保数据的可用性，而故障转移集群有助于确保用户随时访问服务器。\n\
  \n## 蓄意威胁\n\n蓄意威胁是对组织具有敌意的行为。一个或多个实施者参与执行这些威胁。实施者的动机通常源于以下因素之一：\n\n*   **贪婪**——许多攻击者想通过攻击获利。攻击者窃取数据并利用其进行欺诈。他们从数据库中窃取客户数据并实施身份盗窃。犯罪分子从竞争对手处窃取专利数据。社会工程师试图欺骗用户放弃财务网站的密码。\n\
  \n*   **愤怒**——当愤怒成为动机时，攻击者通常希望受害者付出代价。愤怒可能导致破坏资产或中断运营的尝试。这些威胁通常会导致可用性损失。\n\n*  \
  \ **破坏欲望**——某些攻击者只想造成破坏。其结果与受愤怒驱动的攻击者相同。这种破坏可能导致可用性损失。\n\n虽然上述列表有助于理解攻击者的动机，但这些项目并没有识别攻击者是谁。有些人人脑海中仍然留有无聊的青少年在房间里发起随机威胁的印象。然而，如今的攻击者要复杂得多。\n\
  \n### 提示\n![](img/Tip.png)\n\n美国政府的国土安全部维护着一个网站，提供常见威胁及其描述。可以通过 [`www.us-cert.gov/us-cert-tip-categories/threats`](https://www.us-cert.gov/us-cert-tip-categories/threats)\
  \ 访问该网站。\n\n今天常见的攻击者有：\n\n*   **犯罪分子**——通过在线攻击获利的机会导致犯罪活动增长。此外，如今的犯罪活动比以往任何时候都更有组织。这种活动包括欺诈和盗窃。例如，`rogueware`（流氓软件）欺骗用户安装假的防病毒软件。然后，他们必须付费才能将其删除。犯罪分子利用流氓软件勒索了数百万美元。最近，流氓软件已变为\
  \ `..`。犯罪分子限制对系统的访问并向用户显示索金信息以获取对计算机和/或文件的访问。犯罪分子的另一种常见攻击是 `formjacking`（表单劫持）。这种类型的攻击使用恶意的\
  \ JavaScript 代码在电子商务网站的结算阶段窃取客户的个人财务详情，如信用卡信息。\n\n*   **高级持续性威胁 (APT)**——这些攻击者专注于特定目标，具有高水平的专业知识和几乎无限的资源。国家力量或恐怖组织通常资助他们。他们同时攻击政府和私营目标。“极光行动”（Operation\
  \ Aurora）就是一个 APT 攻击的例子。调查表明该 APT 攻击源自中国。它攻击了包括 `Google` 在内的几家私营公司。McAfee 名为《揭秘：影子行动》（Revealed:\
  \ Operation Shady RAT）的白皮书讨论了 71 种不同的 APT 攻击。这些攻击中有 21 个针对政府目标，50 个针对私营公司。\n\n*\
  \   **破坏者**——某些攻击者致力于造成破坏。他们为了破坏而破坏。他们的目标通常是机会性目标。\n\n*   **破坏分子**——破坏分子实施破坏行为。破坏可能是针对竞争公司或其他国家。首要目标是导致可用性损失。\n\
  \n*   **不满的员工**——不满的员工经常对公司构成重大威胁。员工不满的原因有无数，例如，没有获得加薪。拥有大量访问权限的员工可能会造成巨大的破坏。\n\n\
  *   **活动分子**——偶尔，活动分子会对公司构成威胁。他们通常以“目的证明手段正当”的心态运作。换句话说，如果公司做了活动分子不认可的事情，活动分子认为攻击是可以接受的。有时，这些攻击发生在国家层面，由希望对国家政策或决策进行某种形式变革的非国家行为者发起。\n\
  \n*   **其他国家**——国际间谍是一个常见且持续的威胁。例如，McAfee 的《影子行动》白皮书详细介绍了被广泛认为来自中国的间谍活动。攻击者使用远程访问工具\
  \ (`RATs`) 来收集信息。他们渗透了多个政府和私营公司。许多国家将网络战作为其进攻策略的一部分。\n\n*   **黑客**——黑客试图入侵系统。根据黑客的目标，其动机从好奇到恶意意图不等。\n\
  \n### 提示\n![](img/Tip.png)\n\n黑客和破坏者之间存在技术区别。`黑客` 在历史上被称为白帽黑客或伦理黑客（好人）。他们入侵系统是为了学习如何操作，而不是为了个人利益。破坏者一直被称为黑帽黑客或恶意黑客（坏人）。他们入侵系统是为了破坏、盗取或欺诈。许多黑帽黑客伪装成白帽黑客，声称他们的行为是无意的。然而，主流媒体将所有黑客归为黑帽类。\n\
  \n## IT 基础设施内风险管理的最佳实践\n\n在 IT 基础设施内可以采取许多措施来管理风险。以下列表是 IT 安全专业人员认为的最佳实践步骤：\n\n\
  *   **创建安全策略**——高层管理识别并支持安全工作，并创建安全策略，策略提供了安全目标的高级概述，但不包含实施安全技术的细节。经理利用该策略识别资源并制定实施计划。安全策略是减少威胁影响的重要一步。\n\
  \n*   **购买保险**——公司购买保险以减少威胁的影响。他们通常购买火灾、盗窃和环境事件损失的保险。这里需要考虑的重要原则是：\n\n    *   **比例原则**——用于缓解风险的支出（如购买保险）应与风险成比例。例如，不应为\
  \ 50,000 美元的资产购买 100,000 美元的保单。\n\n*   **使用访问控制**——用户需要进行身份验证，并仅授予其所需的访问权限。使用访问控制包括以下两个原则：\n\
  \n\n\n\n\n*   **最小权限原则**——最小权限原则涉及仅授予用户执行其工作所需的权利和权限，而不提供更多。通过这种方式，可以防止用户意外或蓄意地造成问题。\n\
  *   **知其需要原则**——知其需要原则涉及仅授予用户访问其工作所需的数据，而不提供更多。例如，某人可能拥有 `Secret`（机密）数据的安全许可。然而，该人员并不会自动获得所有\
  \ `Secret` 数据的权限。相反，该人员仅被授予其工作所需的访问权限。这有助于防止对不必要的访问的滥用。\n*   **使用自动化**——流程应尽可能地自动化，以减少人为错误。\n\
  *   **包含输入验证**——为了确定数据是否有效，在任何应用程序使用它之前对其进行测试。\n*   **提供培训**——培训可以提高安全意识并减少事故，还可以提高安全防护意识以减少安全事件。\n\
  *   **使用防病毒软件**——所有系统都应安装防病毒软件，并应安排自动更新病毒库。\n*   **保护边界**——至少应使用防火墙来保护内网与互联网之间的边界。入侵检测系统（`IDSs`）也可以作为额外的保护层。\n\
  \n### 提示\n![](img/Tip.png) \n\n安全策略可能包含几项单独的策略。例如，它可能包含密码策略、可接受使用策略和防火墙策略。\n\n###\
  \ 注意\n![](img/Note.png) \n\n权限包括权利和许可。`Rights`（权利）指的是用户在对象上可以执行的操作。例如，用户可能拥有更改系统时间的权利。`Permissions`（许可）指的是对对象的访问。例如，用户可能拥有读取和修改文件的许可。`最小权限原则`包含了权利和许可。`知其需要原则`则侧重于数据权限。\n\
  \n#### EY 全球信息安全调查 2018–2019\n\n安永集团（Ernst & Young）作为一家专业服务公司，定期进行调查，以识别许多与 IT 安全相关的趋势。2018–2019\
  \ 年的报告包含了来自 1400 多名安全从业人员的回复，包括首席信息官、首席信息安全官和其他高管。\n\n该报告中一些显著的发现包括：\n\n*   网络风险正在不断演变；任何认为自己免受网络攻击威胁的组织都可能面临冲击。\n\
  *   企业被要求在三个方面取得进展：通过侧于识别资产和构建防御线来保护企业；通过侧重于停止低价值活动、提高效率并将资金重新投入到新兴和创新技术中以增强现有的保护来优化安全性；以及通过将实施“安全设计”作为大多数组织正在经历的数字化转型的关键成功因素来推动增长。\n\
  *   报告显示，全球每天发送 64 亿封虚假邮件，2017 年数据泄露的平均成本总计达 362 万美元。2018 年发送的钓鱼邮件数量约为 5.5 亿封。\n\
