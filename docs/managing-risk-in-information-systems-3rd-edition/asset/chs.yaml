  \ 健康保险流通性与责任法案\n- `HR` 人力资源\n- `HTTP` 超文本传输协议\n- `HTTPS` 安全超文本传输协议\n- `HVAC` 暖空调系统\n\
  \n### **I**\n- `IA` 信息保证\n- `IANA` 互联网分配编号机构\n- `ICMP` 互联网控制消息协议\n- `ICS-CERT` 工业控制系统网络应急响应小组\n\
  - `IDPS` 入侵检测与防御系统\n- `IDS` 入侵检测系统\n- `IEC` 国际电工委员会\n- `IP` 知识产权或网协议\n- `IPS` 入侵防御系统\n\
  - `IPSec` 协议协议安全\n- `IS` 信息安全\n- `(ISC)²` 国际信息系统安全认证联盟\n- `ISO` 国际标准组织\n- `ISP`\
  \ 互联网服务提供商\n- `ISSA` 信息系统安全协会\n- `IT` 信息技术\n- `ITG` 信息技术治理\n- `ITIL` 信息技术基础库\n-\
  \ `ITL` 信息技术实验室\n\n### **L**\n- `L2TP` 二层隧道协议\n- `LAN` 局域网\n- `LOB` 业务线\n\n### **M**\n\
  - `MAC` 介质访问控制\n- `MAO` 最大可接受中断时间\n- `MBCO` 最小业务连续性目标\n- `MTBF` 平均故障间隔\n- `MTD`\
  \ 最大可忍机时间\n- `MTO` 最大可忍停机时间\n- `MTPD` 最大可忍中断时间\n- `TPOD` 最大可忍中断\n\n### **N**\n-\
  \ `NAC` 网络访问控制\n- `NCCIC` 网络与通信集成中心\n- `NCUA` 国家信贷管理局\n- `NIC` 网卡\n- `NIDS` 网络入侵检测系统\n\
  - `NIPS` 网络入侵防御系统\n- `NIST` 美国标准与技术研究院\n- `NNTP` 网络新闻协议\n- `NSA` 国家安全局\n- `NVD`\
  \ 漏洞数据库\n\n### **O**\n- `OLTP` 联机事务处理\n- `OMB` 管理与预算局\n- `OS` 操作系统\n\n### **P**\n\
  - `P2P` 点对点\n- `PBX` 电话交换机\n- `PCI` 支付卡\n- `PCI DSS` 支付行业数据安全标准\n- `PGP` 良好隐私\n\
  - `PHI` 保护健康信息\n- `PII` 个人身份信息\n- `PIN` 个人密码\n- `PKI` 公钥基础设施\n- `PM` 项目经理\n- `POAM`\
  \ 行动计划里程碑\n- `POC` 联系人\n- `POS` 销售点\n- `PR` 公共关系\n- `PTZ` 云台变焦\n\n### **R**\n- `RAID`\
  \ 冗余磁盘阵\n- `RAM` 随机访问存储器\n- `RAT` 远程访问工具\n- `RMF` 风险管理框架\n- `ROI` 投资回报率\n- `RPO`\
  \ 恢复点目标\n- `RSA` Rivest、Shamir 和 Adleman 算法\n- `RTO` 恢复时间目标\n\n### **S**\n- `SEC`\
  \ 证券交易委员会\n- `SID` 安全标识符\n- `SIEM` 安全信息事件管理\n- `SLA` 服务水平协议\n- `SLE` 单次损失预期\n- `SME`\
  \ 领域专家\n- `SMTP` 简单邮件传输协议\n- `SOX` 萨班斯-奥克斯法案（也称为 Sarbox）\n- `SP` 服务包或特别出版\n- `SPOF`\
  \ 单点故障\n- `SQL` 结构化查询语言\n- `SSCP` 系统认证实践师\n- `SWIFT` 全球银行间电信协会\n- `SYN` 同步\n\n###\
  \ **T**\n- `TARP` 资产纾救计划\n- `TB` 太字节\n- `TCP` 传输控制协议\n- `TPM` 技术保护措施或可信平台模块\n- `TRT`\
  \ 技术恢复小组\n- `UPS` 不断电源\n- `URL` 通用资源定位符\n- `USB` 通用总线\n\n### **U**\n- `US-CERT`\
  \ 美国计算机应急准备小组\n\n### **V/W**\n- `VoIP` IP 电话\n- `VP` 副总裁\n- `VPN` 虚拟专用网络\n- `WAN`\
  \ 广域网\n- `WEP` 有线等效加密\n- `Wi-Fi` 无线连接\n- `WIPO` 世界知识产权组织\n- `WLAN` 无线局域网\n- `WPA`\
  \ 无线安全保护\n- `WPA2` 无线安全保护 2\n\n### **X**\n- `XSS` 跨站脚本\n\n\n\n\n\n# A\n\n可接受政策 (AUP)\
  \ 一种告知员工哪些 IT 系统和数据用途被认为是接受的策略。有时，会使用横幅和登录屏幕来提醒人员该策略。\n\n接受 (accepting) 管理风险的技巧之一。当降低风险的成本大于潜在损失时，则接受该风险。如果管理层认为该风险对业务是必要且可忍的，则也接受该风险。\n\
  \n账户管理策略 一项旨在确保安全管理用户和计算机账户而创建的书面策略。它确定了创建账户的细节（例如使用 `firstname.lastname` 格式），并规定了对未使用账户的处置方法。它还可以包括对账户锁定和密码策略的要求。该书面策略通常通过技术策略强制执行。\n\
  \n高级加密标准 (AES) NIST 定义的对称加密标准。它速度快、高效，通常用于加密驱动器上的数据，包括通用串行总线（USB）闪盘。\n\n亲和图 (affinity\
  \ diagram) 一种用于创建威胁、漏洞或响应列表的方法。它从一个大主题（如问题描述）开始，然后将问题缩小到具体的来源。\n\n年度预期损失 (ALE) 给定风险在一年内的预期总损失。ALE\
  \ 通过乘以 SLE × ARO 计算得出。ALE 是定量风险评估的一部分。\n\n年度发生率 (ARO) 预期给定威胁导致的损失在一年内发生的次数。它与 SLE\
  \ 配合计算 ALE。ARO 是定量风险评估的一部分。\n\n匿名器 (anonymizer) 一种用于隐藏用户在互联网上活动的网站。用户访问匿名器网站，然后向其他网站请求页面。匿名器检索网页并像从匿名器网站提供一样提供这些网页。\n\
  \n资产 (asset) 代表对组织有价值的数据、设备或基础设施的实体。\n\n资产管理 用于管理所有类型的资产，包含比库存管理系统更详细的信息。例如，它将包括已安装的组件、硬件外设、已安装的软件、更新版本等。\n\
  \n资产估值 确定资产公平市场价值的过程。资产的价值可以根据实际成本或根据资产为组织提供的价值来确定。\n\n攻击面 (attack surface) 服务器可被攻击的程度。每个额外的运行或开启的服务或协议都会增加攻击面。通过禁用不需要的服务或协议，可以缩小攻击面。\n\
  \n总检察长 (AG) 一个州或联邦职位。州总检察在所有法律事务中代表该州。美国总检察长是美国司法部的部长。\n\n审计 (audit) 检查组织是否遵循规则和准则的检查。漏洞评估审计检查是否遵循了内部策略。\n\
  \n审计追踪 (audit trail) 记录在一个或多个日志中的系列事件。审计追踪事件记录了谁、什么、在何地以及何时。它们可以存在操作系统日志（如 Microsoft\
  \ 安全日志），也可以是应用程序日志（如防火墙日志）。\n\n可用性 (availability) 确保在需要时数据或服务是用的。使用容错和冗余技术保护数据和服务。\n\
  \n规避 (avoiding) 管理风险的技巧之一。通过消除风险源或消除资产对风险的暴露，可以规避风险。公司可以停止产生风险的活动或移动资产。\n\n## B\n\
  \n大数据 (big data) 规模巨大且复杂，以以使用现有数据库工具处理的数据集。相反，专家构建新的应用程序来满足这些大型数据集的需求。\n\n黑名单 (blacklist)\
  \ 垃圾邮件过滤器中用于拦截邮件的地址或域名列表。它们被添加到黑名单中以确保来自这些源的邮件始终被标记为垃圾邮件。\n\n头脑风暴 (brainstorming)\
  \ 一种用于就某个主题产生大量想法的创意方法。鼓励参与提到脑海中浮出的任何想法。在不进行判断的情况下记录想法。\n\n缓冲区溢出 (buffer overflow)\
  \ 一种针对面向公共服务器的常用攻击手段。缓冲区溢出攻击中的攻击者发送比预期更多或不同的数据。他们可以使用它来获取系统的额外权限。\n\n业务连续性计划 (BCP)\
  \ 一项帮助公司准备不同类型紧急情况的综合计划。其目标是确保灾难发生后，关键功能仍继续运行。\n\n业务功能 (business function) 执行的活动，包括核心功能和支持功能。\n\
  \n业务影响分析 (BIA) 业务连续性计划的一部分。它识别一个或多个 IT 功能故障时对业务的影响。\n\n## C\n\n能力成熟模型集成 (CMMI) 一种管理过程改进方法。它包括从\
  \ 0 到 5 的六级。0 级表示过程不存在。5 级表示过程非常成熟且有效。\n\n因果图 (cause and effect diagram) 也称为石川图或鱼骨图。它显示了原因与问题之间的关系。\n\
  \n证书 (certificate) 一种用于安全的文件，包括身份识别和加密。证书可以颁给用户或系统，然后由其提交给其他实体。证书包含一个与他人共享的公钥。公钥与私钥匹配，私钥始终保密。\n\
  \n证书机构 (CA) 发行和管理证书的实体。CA 可以是公共的或私有的。公共 CA 可以在网上访问，而私有 CA 是组织内部的。用户和系统出于安全目的（如身份识别和加密）使用证书。\n\
  \n变更管理 (change management) 一项要求建议变更经过审查程序的正式流程。只有在批准后才实施更改，这有助于减少未经授权更改引起的停机。\n\n\
  儿童互联网保护法 (CIPA) 2000 年通过的一美国法律。它要求接收 E-Rate 资金的学校和图书馆过滤互联网内容。其主要目的是保护未成年人免色情或有害图像的侵害。\n\
  \nCIRT 计划 组织创建的响应计算机事件的正式计划。它包括对计算机事件的定义，并正式指定了计算机事件响应小组 (CIRT)。\n\n云计算 (cloud computing)\
  \ 一种允许组织通过公共网络（如互联网）访问所需服务的技术。组织通常与第三方供应商合作使用云计算提供服务。\n\nCOBIT 参见 信息和相关技术控制目标。\n\
  \n冷备 (cold site) 用于灾难恢复的备选地点。该站点是有电力、自来水和厕所的建筑，但现场没有部署任何设备或数据。冷中心的维护成本低，但需要大量努力才能运行，且很难测试。其他备选地点是温备中心和热备中心。\n\
  \n常见漏洞与披露 (CVE) 由 MITRE 公司维护的漏洞数据库。MITRE 与美国国土安全部合作维护 CVE。该列表包含超过 40,000 个项目。\n\n\
  合规 (compliance) 当组织遵守相关法律和法规时，即为合规。许多组织制定了计划以确保他们保持合规。\n\n计算机事件 (computer incident)\
  \ 也称为计算机安全事件。任何威胁计算机系统安全的活动。它影响组织的安全，并可能导致机密性、完整性或可用性的损失。\n\n\n\n\n\n计算机事件响应小组 (CIRT)\
  \ 一组负责响应事件的人员。`CIRT` 可以是预先指定的正式团队，也可以是在事件发生后创建的临时团队。\n\n机密性 保护数据免受未经授权的泄露。使用访问控制和加密技术保护数据。\n\
  \n配置管理 用于确保系统配置相似的标准。此外，可以定期进行合规审计，以确保系统没有被不当修改。\n\n持续监控 一种以“安全需要持续努力”为原则的理念。实施控制措施，并在随后进行检查和审计，以确保它们仍按预期工作。\n\
  \n控制 为了减少削弱性或潜在损失而采取的行动或更改。控制也被称为对策措施（countermeasure）。\n\n信息和相关技术控制目标 (COBIT) 一个用于\
  \ IT 管理的良好实践框架。`COBIT` 广受尊重并频繁使用。它包含五个原则和七个赋能因素。`COBIT` 原本是信息和相关技术控制体系的缩写。`ISACA`\
  \ 现在仅使用 `COBIT` 的简写。\n\n纠正控制 按其功能分类的一类控制。纠正控制试图扭转被利用漏洞的影响。例如，杀毒软件可以通过清理感染文件来作为纠正控制，从而修复问题。\n\
  \n成本效益分析 (CBA) 用于确定如何管理风险的过程。如果控制的收益大于成本，则可以实施该控制以降低风险。如果成本大于收益，则可以接受该风险。\n\n对策措施\
  \ 一种安全控制或保护措施。其建立目的是降低风险，通过减少漏洞或威胁影响来实现这一点。\n\n关键业务功能 (CBF) 被认为对组织至关重要的功能。如果 `CBF`\
  \ 失败，组织将失去执行其使命所需的关键操作的能力。\n\n关键路径图 项目中关键任务的图表。如果关键路径中的任何任务延迟，整个项目都将延迟。\n\n关键成功因素\
  \ (CSF) 组织成功运行的要素。`CSFs` 往往对关键业务功能 (`CBFs`) 有贡献。\n\n## **D**\n\n损害评估小组 (DAT) 一个在中断发生后收集数据以确定损害程度的团队。`DAT`\
  \ 收集有关系统和设施损坏的数据，并将数据报告给应急管理小组 (`EMT`)。`EMT`、`DAT` 和技术恢复小组 (`TRT`) 由 `BCP` 指定。\n\
  \n暗网 互联网的一部分，包含加密的在线内容，且对传统的搜索引擎不可见。\n\n数据泄露 组织之外的数据丢失。许多点对点 (`P2P`) 程序会导致数据泄露。`P2P`\
  \ 程序通常用于下载盗版音乐、电影和应用程序。用户通常并没有意识到 `P2P` 程序也会共享其系统中的数据。当用户系统上的数据在用户不知情的情况下被共享共享时，就会发生数据泄露。\n\
  \n数据挖掘 从数据仓库中检索数据的过程。数据挖掘允许决策者从不同角度查看数据，并对未来的行为或结果做出预测。\n\n数据仓库存储 从不同的数据库收集数据并对其进行集中化存储的过程。使用提取、转换、加载\
  \ (`ETL`) 过程。数据从原始数据库中提取，然后进行转换以匹配目标数据库。最后，将其加载到目标数据库中。\n\n深网 也称为不可见网，这一概念代表了互联网中内容未被典型搜索引擎索引的部分。\n\
  \n深度防御 一种用于提供多层控制的安全原则。尽管某项控制措施可能提供保护，但会添加额外的控制措施以提供更强的保护。深度防御策略确保即使某项控制失效，风险也能得到缓解。\n\
  \n非军事区 (DMZ) 隔绝互联网与内部网络的缓冲区。`DMZ` 通常由两个独立的防火墙创建。然后将面向公众的服务器（如 Web 服务器或电子邮件服务器）放在\
  \ `DMZ` 中。\n\n拒绝服务 (DoS) 攻击 一种旨在防止系统提供服务的攻击。`DoS` 攻击从单个客户端发起。\n\n美国国防部信息保证认证与授权流程\
  \ (DIACAP) 应用应用于美国国防部 (`DoD`) 系统的风险管理过程。它完整记录在 `DoD` 指令 `8510.1` 中。系统在被授权运行之前，必须经过正式的认证和授权流程。\n\
  \n美国国土安全部 (DHS) 美国政府的一个主要部门，负责保护美国免受威胁和紧急情况的影响。\n\n检测性控制 按其功能分类的一类控制。检测性控制检测漏洞何时正在被利用。入侵检测系统\
  \ (`IDS`) 是检测性控制的一个示例。\n\n数字签名 一种用于识别的方法。数字签名使用证书权威颁发的证书。创建消息的哈希值，并用发送者的私钥对哈希值进行加密。如果接收者可以使用发送者的公钥解密加密后的哈希值，则验证了该哈希是使用发送者的私钥加密并发送的。只有发送者拥有私钥。\n\
  \n灾难恢复 在系统失败后将其恢复服务的程序。灾难恢复发生在灾难之后。灾难恢复步骤记录在灾难恢复计划中，该计划是业务连续性计划的一部分。\n\n灾恢复计划 (DRP)\
  \ 用于在灾难后恢复一个或多个系统的计划。`DRP` 是业务连续性计划的一部分。\n\n分布式拒绝服务 (DDoS) 攻击 `DoS` 攻击是从多个客户端同时发起的。`DDoS`\
  \ 攻击通常包括由僵尸网络控制的僵尸主机。\n\n尽责义务 采取合理的步骤来防止风险。\n\n尽职调查 投入合理的时间精力来识别风险。进行尽职调查的人或组织调查风险以了解它们。\n\
  \n## **E**\n\n应急管理小组 (EMT) 由高级管理人员组成的团队，在中断或灾难期间拥有总体权限。`EMT`、损害评估小组 (`DAT`) 和技术恢复小组\
  \ (`TRT`) 由 `BCP` 指定。\n\nE-Rate 资助 一个为学校和图书馆提供互联网访问折扣的计划。任何根据 E-Rate 计划申请折扣的学校或图书馆都必须遵守儿童互联网保护法\
  \ (`CIPA`) 规则。`CIPA` 强制对 17 岁以下儿童的互联网内容进行过滤。\n\n利用漏洞的行为。当执行命令或程序以利用弱点时就会发生。示例包括缓冲区溢出、`DoS`\
  \ 攻击和 `DDoS` 攻击。\n\n利用评估 尝试发现攻击者可以利用哪些漏洞。利用评估也称为渗透。\n\n利用测试 尝试利用漏洞。漏洞测试识别潜在漏洞，而利用测试确定漏洞是否真的可以被利用。利用测试可能会导致系统崩溃。\n\
  \n利用周三 补丁周二的第二天。在补丁发布后，攻击者尝试对补丁进行逆向工程以了解漏洞。然后在补丁被广泛应用之前，他们创建利用这些漏洞的攻击。对比 *补丁周二*。\n\
  \n暴露因子 (EF) 如果威胁变为现实，资产遭受的损失百分比。`EF` 通常是主观的。\n\n## **F**\n\n\n\n\n\n# 故障转移集群 (Failover\
  \ cluster) 一种确保即使服务器故障服务也能继续运行的技术。故障转移集群至少包含两台服务器。一台处于活动状态，另一台服务器处于空闲状态，但在活动服务器故障时可以随时接管。\n\
  \n# 家庭教育权利与隐私法 (FERPA) 1974 年通过的一项美国法律，强制要求保护学生记录。学生记录包括所有包含教育或健康数据的记录。所有接收联邦教育资助的机构都受此法律的管辖。\n\
  \n# 联邦存款保险公司 (FDIC) 1933 年成立的联邦机构，为受 FDIC 保险银行的存款人资金提供保险。其目标是增强对美国银行的信心。\n\n# 联邦信息安全管理法\
  \ (FISMA) 2002 年通过的一项美国法律，要求联邦机构保护 IT 系统和数据。此外，各机构必须进行年度检查，以对安全计划进行独立评估。\n\n# 联邦贸易委员会\
  \ (FTC) 1914 年成立的联邦机构，其首要目标是促进消费者保护。它还致力于防止不公平的竞争手段。\n\n# 受托责任 (fiduciary responsibility)\
  \ 两个实体之间的信任关系。受托人可以是受信任的人，并有责任维护这种信任。\n\n# 防火墙 (firewall) 过滤流量。在防火墙上配置规则以定义哪些流量是被允许的，哪些是被阻塞的。网络防火墙是硬件和软件的结合。单个系统可以包含单一的软件防火墙。\n\
  \n# 防火墙设备 (firewall appliance) 一种独立的防火墙解决方案。它包含硬件和软件，为网络提供安全保护。\n\n# 防火墙策略 (firewall\
  \ policy) 一份识别允许或阻塞哪些流量的文档。防火墙策略通常用于在防火墙上实施规则。\n\n## G\n\n# 甘特图 (Gantt chart) 用于显示项目进度的条形图。甘特图常用于项目管理，用于风险管理计划。\n\
  \n# 缺口分析 (gap analysis) 通过比较应该受控制的漏洞与已受控制的漏洞而创建报告。任何未受控制的漏洞都代表安全上的缺口。当组织试图遵守 HIPAA\
  \ 等法律要求时，通常会进行缺口分析。\n\n# 通用数据条例 (GDPR) 一项法律框架，为收集和处理居住在欧盟和欧洲经济区 (EEA) 个人的个人信息制定了指南。\n\
  \n# 声誉 (goodwill) 有帮助且合作的态度。\n\n# 格拉姆-莱奇-布莱利法 (GLBA) 1999 年通过的一项适用于金融机构的法律。财务隐私规则和保护规则适用于\
  \ IT 安全。公司需要告知客户数据如何被使用，并采取措施保护财务数据。\n\n# 组策略 (Group Policy) 一种自动化管理工具，可以配置一次设置并将其等等地应用于所有用户或计算机，这比在单台计算机上配置设置要高效得多。\n\
  \n# 指南 (guideline) 帮助实现行动的原则、指示或方向。\n\n## H\n\n# 服务器加固 (hardening a server) 使服务器变得比默认设置更安全的行为。更改默认设置、缩小攻击面并保持系统处于最新状态。\n\
  \n# 健康保险可流动性与责任法 (HIPAA) 1999 年通过的一项美国法律，强制要求保护健康信息。任何处理类型健康信息的组织（包括医疗保健提供者和提供医疗计划的雇主）都必须遵守此法律。\n\
  \n# 基于主机的入侵检测系统 (HIDS) 安装在单个主机（如工作站或服务器）上的入侵检测系统。任何入侵检测系统都能检测入侵和攻击。\n\n# 热备机 (hot\
  \ site) 用于灾难恢复的备选地点。该站点包含在短时间内接管业务功能所需的所有设备和数据，能够在几小时甚至几分钟内内承担运营。热备机的维护非常昂贵。其他备选地点是冷备机\
  \ (cold sites) 和温备机 (warm sites)。\n\n## I\n\n# 影响 (impact) 威胁利用漏洞导致的损失。损失可以用货币或相对值表示。影响确定损失的严重程度。影响源于专家意见。\n\
  \n# 隐式拒绝 (implicit deny) 应用于路由器和防火墙的哲学。除非明确允许，否则所有流量均被阻塞。例如，可以通过防火墙规则开放 `80` 端口以允许\
  \ HTTP 流量。如果没有其他规则，则不允许任何其他流量。即使防火墙没有显式拒绝 `77` 端口（或除 `80` 以外的任何端口）流量的规则，它仍会被拒绝。\n\
  \n# IT 治理 (ITG) 确保 IT 资源能够帮助组织实现目标的过程。\n\n# IT 基础库 (ITIL) 由英国政府商业办公室开发的一组书籍。这些书籍记录了可用于\
  \ IT 网络的良好实践。\n\n# 现有的控制 (in-place control) 当前已安装的控制措施。控制可以是已实施的也可以是计划中的。\n\n# 无形价值\
  \ (intangible value) 与物理资产实际成本不直接相关的价值。无形资产可以包括未来的收入损失、客户信心和客户影响。与有形价值相比。\n\n# 完整性\
  \ (integrity) 确保数据或 IT 系统不被修改或破坏。`Hashing` 通常用于确保完整性。\n\n# 知识产权 (IP) 由个人或组织创建的数据。它可以包括创意作品，如文学、音乐或艺术作品。它还可以包括工业设计、商标、发明和专利。\n\
  \n# 蓄意威胁 (intentional threat) 对组织敌意的行为。蓄意威胁来自犯罪分子、破坏者、不满的员工等。\n\n# 国际电工委员会 (IEC)\
  \ 一个专注于电气、电子及相关技术的国际标准组织。IEC 与 ISO 合作制定标准。IEC 发布了 `IEC 31010 风险管理——风险评估技术`。\n\n\
  # 国际标准组织 (ISO) 一个国际标准组织。ISO 发布的三个风险相关的文档是 `ISO 27002`、`ISO 31000` 和 `ISO 73`。\n\n\
  # 入侵检测系统 (IDS) 一种监控网络并在检测到入侵时发送警报的系统。基于主机的 IDS (HIDS) 和基于网络的 IDS (NIDS) 系统是常用的。被动\
  \ IDS 记录并报警事件。主动 IDS 可以阻止检测到的攻击。\n\n# 入侵防御系统 (IPS) 串联在流量路径中以监控入侵的系统。它可以防止恶意流量到达内部网络。\n\
  \n# 资产管理 (inventory management) 用于管理硬件库存。包含基本信息，如型号、序列号和位置。\n\n# IT 治理 (ITG) 确保\
  \ IT 资源能够帮助组织实现目标的过程。IT 治理还有助于确保这些资源有效高效。\n\n## J\n\n# 岗位轮换 (job rotation) 让员工在不同工作之间轮换，对过去的交易进行额外的监督。它可以帮助防止或减少合谋等欺诈活动，并增加对特定系统的技术知识。\n\
  \n## M\n\n# 恶意软件 (malware) 恶意软件，包括病毒、蠕虫、木木马或其他任何类型的恶意代码。\n\n# 强制休假 (mandatory vacation)\
  \ 要求员工每年必须至少连续休假五天。在员工休假期间，必须由其他人执行该工作，这增加了非法活动被发现的概率。\n\n\n\n\n\n最大可接受中断时间 (MAO)\
  \ 系统或服务在影响公司任务之前可以停机的最长时间。MAO 直接影响所需的恢复时间，这意味着系统必须在达到 MAO 时间之前是可恢复的。\n\n最大可忍中断时间\
  \ (MTPD) 这有助于确定在灾难发生后需要尽快恢复和启动哪些关键业务功能，识别启动关键业务功能 (CBF) 所需特定资源，并帮助确定这些系统需要多快进行恢复。\n\
  \n里程碑 (milestone) 项目中预设的事件，表示某个主要任务或一组任务的完成。里程碑用于跟踪项目的进度。\n\n里程碑计划图 (milestone plan\
  \ chart) 一种对主要里程碑的图形表示，显示了里程碑之间的时间关系和依赖关系。\n\n最小业务连续性目标 (MBCO) 组织在灾难期间为满足其业务需求和目标所接受的最低服务水平。\n\
  \n任务关键 (mission critical) 指被识别为对组织任务至关重要的系统、功能或流程。任务关键系统和活动对于维持组织的运行是必须的。\n\n缓解\
  \ (mitigating) 用于管理风险的技术之一。缓解也称为风险降低。通过实施控制措施或应对措施来减少漏洞。\n\n移动站点 (mobile site) 一个可以在受影响站点附近的外部空间在\
  \ 36 到 72 小时内快速搭建的站点。它介于热备和冷备之间。\n\n## N\n\n国家网络安全与通信集成中心 (NCCIC) 美国国土安全部 (DHS)\
  \ 内的一个机构。它与私人、公共和国际伙伴合作，确保网络空间和美国网络资产的安全。\n\n国家标准与技术研究院 (NIST) 美国商务部的一个部门，其使命是促进美国的创新和工业竞争力。信息技术实验室\
  \ (ITL) 属于 NIST。ITL 出版广泛用于 IT 风险管理的特殊出版物。\n\n网络负载均衡 (network load balancing) 一种允许在几台服务器之间分配负载的技术。当新客户端连接时，它们被重定向到负载最小的服务器。负载均衡用于\
  \ Web 农场。\n\nNIST 风险管理框架 (NIST Risk Management Framework) 联邦政府通过国家标准与技术研究院 (NIST)\
  \ 开发的一信息安全策略和标准。\n\n不可否认性 (nonrepudiation) 用于防止某人否认其执行过某项操作。审计日志记录了事件的执行人、执行内容、何地和何时等细节。如果审计日志记录了用户登录后的操作，该用户就无法可信地否认该操作。数字签名也用于不可否认性。\n\
  \n## O\n\n运营影响 (operational impact) 安全控制对业务的影响。控制经常会消耗资源，如果不加控制，可能会影响正常运行。\n\n##\
  \ P\n\n密码策略 (password policy) 一种规定密码安全要求的书面或技术策略。要求包括长度、有效期和复杂度。例如，密码策略可能规定密码必须至少包含\
  \ 8 个字符，并且每 90 天更改一次。复杂度要求规定了大写字母、小写字母、符号和数字。\n\n补丁管理 (patch management) 确保在需要时部署补丁。由于软件经常产生漏洞，供应商会发布补丁来修复问题。补丁管理确保部署适当的补丁。许多漏洞构成了严重的安全风险，因此如果不部署补丁，系统将易受到攻击。\n\
  \n补丁周二 (Patch Tuesday) Microsoft 发布其产品补丁的日期。补丁周二是每月的第二个星期二。对比“漏洞周三”(Exploit Wednesday)。\n\
  \n支付支付卡行业数据安全标准 (PCI DSS) 用于保护信用卡数据的国际标准，其要求由 PCI 安全委员会制定。商户必须遵守这些标准。\n\n渗透测试 (penetration\
  \ testing) 为检查漏洞是否可以被利用而进行的测试。渗透测试在漏洞评估后进行。它可能是侵入性的，并可能导致系统崩溃。\n\n物理控制 (physical\
  \ control) 一种限制对区域或系统的物理访问或保护物理环境的控制。示例包括锁定的房间、保镖、摄像头以及控制环境的加热和冷却系统。\n\n行动计划与里程碑\
  \ (POAM) 一种用于跟踪风险管理计划中活动的文档。POAM 为特定任务分配责任，使管理层更容易跟进任务。\n\n计划控制 (planned control)\
  \ 计划在未来某个时候添加的控制。控制措施可以是已实施的，也可以是计划中的。\n\n策略 (policy) 一种由组织领导直接发布的正式声明，例如可接受使用策略，描述了在使用公司拥有的计算机和网络资源时可接受和不可接受的行为。\n\
  \n预防性控制 (preventive control) 一类根据功能分类的控制措施。预防性控制试图防止风险发生。例如，从服务器上移除不必要的协议以进行加固，从而防止针对该协议的任何攻击。\n\
  \n最小权限原则 (principle of least privilege) 一种安全原则，仅授予用户执行其工作所需的最小权利和权限。这一原则与“知情原则”相似。然而，知情原则仅关注对数据的权限，而不关注权利。\n\
  \n知情原则 (principle of need to know) 一种安全原则，仅授予用户访问执行其工作所需的数据。这与最小权限原则相似。然而，最小权限原则包含了权利和权限，而知情原则仅关注对数据的权限。\n\
  \n比例原则 (principle of proportionality) 这一原则简单地指出，在控制措施上的花费金额应与风险成正比。\n\n概率 (probability)\
  \ 指风险发生的可能性，源于专家意见，用于定性风险评估。当威胁利用漏洞时，风险就会发生。\n\n程序性控制 (procedural control) 基于高层管理指导的规则和准则而实施的控制。它也被称为管理控制。\n\
  \n程序 (procedure) 一种正式、既定的办事方法。\n\n盈利能力 (profitability) 公司盈利的能力。计算方法为收入减去成本。风险管理既考虑盈利能力也考虑生存能力。\n\
  \n代理服务器 (proxy server) 一种用于接受客户端网页请求、检索网页并向客户端提供网页的服务器。代理服务器可以过滤请求，使用户无法访问某些网页，并作为《儿童互联网保护法》(CIPA)\
  \ 的技术保护措施。\n\n## Q\n\n定性风险评估 (qualitative risk assessment) 一种用于风险评估的主观方法，基于专家意见的相对值。定性风险评估可以较快地完成。定性风险评估没有预设的公式。\n\
  \n定量风险评估 (quantitative risk assessment) 一种使用数字（如实际金额）进行风险评估的客观方法。定量风险评估需要大量数据，这些数据有时难以获取。然后将数据输入公式中。\n\
  \n## R\n\n合理性 (reasonableness) 一种公司可以用来判断是否应该管理风险的判断标准。如果一个合理的人认为该风险应该被管理，那么就应该被管理。\n\
  \n\n\n\n\n恢复点目标 (RPO) 系统可接受的最大数据丢失量。RPO 可以短至不足一分钟，也可以长到故障发生时，甚至更长，例如一天或一周。RPO 取决于数据的价值及其复制能力。\n\
  \n恢复时间目标 (RTO) 系统或功能必须恢复的时间。RTO 等于或小于最大接受停机时间 (`MAO`)。例如，如果 `MAO` 为 10 分钟，则 `RTO`\
  \ 将为 10 分钟或更短。\n\n独立磁盘冗余阵 (RAID) 也称为廉价磁盘冗余阵列。通过使用多个磁盘来提供容错能力。磁盘可能会发生故障，系统可以容忍并继续运行。\n\
  \n剩余风险 也称为可接受风险。在实施控制措施后仍然留的风险。剩余风险通过以下公式表示：`剩余风险 = 总风险 – 控制措施`。\n\n投资回报率 (ROI)\
  \ 决定购买或改进系统所带来的金钱收益的价值。如果控制措施的成本接近预计收益，则可以计算 ROI 以确定该控制在其整个寿命内是否具有价值。\n\n风险 一可能导致损失的不确定性。当威胁利用漏洞时，就会发生损失。风险通常表示为\
  \ `风险 = 威胁 × 漏洞`。\n\n风险评估 一种根据对资产威胁和漏洞的分析来识别和评估风险的过程。根据重要性或影响程度对风险进行量化。然后对这些风险进行排序。\n\
  \n风险管理 识别、评估、控制和缓解风险的实践。管理风险的技术包括避免、共享或转移、缓解和接受风险。\n\n风险陈述 一用于总结风险的陈述。风险陈述通常使用“如果/那么”格式。陈述的“如果”部分识别风险的要素。“那么”部分识别结果。\n\
  \n行为准则 用户在访问系统之前必须阅读的文档，该文档确定了他们在系统上可以做什么和不能做什么。美国管理和预算局 (`OMB`) A-130 号通告附录 III\
  \ 规定 `OMB` 管辖下的机构必须使用行为准则。在大多数私人组织中，行为准则文档也被称为可接受使用策略 (`AUP`)。\n\n## S\n\n保护措施 控制的另一种说法。保护措施和控制措施用于缓解风险。它们可以通过减少威胁的影响或减少漏洞来降低风险。\n\
  \n保护措施价值 保护措施或控制措施的实际成本。此数据可用于完成成本效益分析。\n\n萨班斯-奥克斯利法 (`SOX`) 2002 年通过的一部美国法律，适用于任何上市公司。高级官员和董事成员对数据的准确性直接负责。如果数据报告错误，他们可能会被罚款并入狱。\n\
  \n水平扩展 (scale out) 通过向服务添加额外服务器来增加能力的方法。高效水平扩展技术不需要修改核心应用程序。例如，可以在不更改核心 Web 的情况下向\
  \ Web 集群添加额外的服务器。负载然后在服务器之间均匀分布。\n\n垂直扩展 (scale up) 通过向服务器添加额外资源来增加能力的方法。可以通过添加额外的\
  \ `RAM` 或升级处理器来扩展服务器。\n\n范围 风险管理计划的边界，定义了计划应该涵盖的内容。定义范围有助于防止范围蔓延。\n\n范围蔓延 项目由于不受控制的变化引起的问题。应该避免范围蔓延，因为它会导致成本超支和错过截止日期。\n\
  \n脚本小子 (script kiddie) 对编程知识或其可能造成的伤害了解不多的攻击者。其想法是某些黑客工具非常容易使用，以至于小孩都能使用。\n\n证券交易委员会\
  \ (`SEC`) 一个监管证券行业的联邦机构。证券包括股票、期权和其他证券。任何上市公司或交易证券的公司都必须遵守 `SEC` 规则。\n\n安全策略 由高级管理层创建的书面策略，包括识别资源和在组织中实施安全措施。它通常包括个人策略，例如密码策略、可接受使用策略和防火墙策略。\n\
  \n职责分离 一项确保单人控制关键过程的所有功能的原则。它旨在防止欺诈、盗窃和错误。\n\n服务水平协议 (`SLA`) 一份识别预期性能水平的文档。它可以指定最小运行时间或最大停机时间。它通常被写为服务提供商和客户之间的合同。`SLA`\
  \ 可以在未满足条款时确定金钱罚款。\n\n服务包 (`SP`) 一组适用于特定操作系统的更新、补丁和修复程序。大多数 `SP` 都是累积的。它们包含了自操作系统首次发布以来自所有的更新、补丁和修复程序。\n\
  \n单次损失预期 (`SLE`) 单次事件导致的总损失。损失以美元价值表示，包括硬件、软件和数据的价值。它用于帮助计算 `ALE` (`ALE = SLE ×\
  \ ARO`)。`SLE` 是量化风险评估的一部分。\n\n单点故障 (`SPOF`) 任何单个组件的故障都可能导致系统的完全丢失。`SPOF` 通常通过增加冗余来解决。例如，磁盘驱动器可以使用\
  \ `RAID` 配置进行保护，故障转移集群消除了服务器作为单点故障。\n\n嗅探器 (sniffer) 用于捕获网络流量以进行分析的工具。`Wireshark`\
  \ 是一个免费的封包分析器，可以作为嗅探器。如果数据以明文发送，捕获的流量可以被轻易读取。\n\n社会工程 用于欺骗人们披露敏感信息或采取不安全行为的策略。社会工程策略包括电话或面对面的欺骗，以及网络钓鱼和其他技术策略。\n\
  \n叉式网络钓鱼 (spear phishing) 针对特定公司的网络钓鱼尝试。它通常看起来来自公司内部，对未经培训的员工更为有效。\n\nSQL 注入攻击 针对访问数据库的网站。攻击者使用结构查询语言\
  \ (`SQL`) 代码检索或修改数据库中的数据。开发者遵循最佳实践来防止 SQL 注入攻击。\n\n利益相关 对项目成功有利益或兴趣的个人或群体。利益相关对项目拥有某些权限，并能为项目提供资源。\n\
  \n标准 一种旨在支持或至少为策略提供指导的强制性规则。例如，密码标准可以跟在可接受使用策略之后。\n\n生存 公司从风险损失中生存的能力。某些损失非常严重，如果不进行管理将导致业务失败。\n\
  \n## T\n\n有形价值 资产的实际成本。与无形价值对比。\n\n技术控制 使用技术减少漏洞的控制。示例包括防病毒软件、入侵检测系统、访问控制和防火墙。技术控制提供了自动化。\n\
  \n技术恢复小组 (`TRT`)负责在中断或停机后恢复关键系统的团队。`BIA` 识别关键系统。应急管理小组 (`EMT`)、损害评估小组 (`DAT`) 和\
  \ `TRT` 由 `BCP` 指定。\n\n\n\n\n\n# 技术术语表\n\n### 技术保护保护措施 (TPM)\n《儿童互联网保护法》(CIPA) 的要求。TPM\
  \ 会过滤学校和图书馆电脑上的攻击性内容，确保未成年人不会接触到攻击性内容。如果成人需要使用电脑，可以禁用 TPM。\n\n### 威胁\n任何代表潜在危险的活动，包括任何对企业资产的机密性、完整性或可用性产生不利影响的状况或事件。\n\
  \n## 威胁评估\n用于识别和评估潜在威胁的过程。其目标是尽可能地识别潜在威胁。然后对这些威胁进行评估，以确定威胁利用漏洞的概率。\n\n### 威胁建模\n\
  用于识别系统上可能威胁的过程。威胁建模试图从攻击者的角度来观察系统。\n\n## 威胁/漏洞对\n威胁利用漏洞将导致有害事件或损失。\n\n### 总风险\n\
  当受影响资产的价值已知时的风险量。总风险通常表示为 `总风险 = 威胁 × 漏洞 × 资产价值`。\n\n### 事务\n一个数据库术语。事务允许多个数据库语句作为一个整体成功，或者如果其中任何一条语句失败，则整个事务都失败。失败的事务不会应用到数据库中。\n\
  \n### 转移\n管理风险的技巧之一。通过将责任转移给另一方来转移风险。风险可以通过转移风险来完全转移，也可以通过部分转移风险来共享。这可以通过购买保险或外包活动来实现。\n\
  \n## U\n\n### 不确定性水平\n一种指示数据准确性的方法。通过评估数据一致性来确定确定性水平。不确定性水平可以计算为 100 减去确定性的百分比。\n\
  \n### 无意威胁\n没有特定执行者的威胁。这些威胁包括以下类别的威胁：环境、人为、事故和故障。\n\n### 不间断电源 (UPS)\n一种电池或电池组，用于在主电源发生故障时为系统提供即时电源。UPS\
  \ 设备旨在提供短期电源，为系统留出足够的时间进行正常关闭或切换到长期电源。\n\n### 美国计算机应急响应小组 (US-CERT)\n国家网络安全部门的一部分。US-CERT\
  \ 为对抗网络攻击者提供响应支持和防御。其关注重点是保护联邦政府资源。它与州、地方政府以及其他公共和私营部门合作并共享信息。\n\n### 美国司法部长 (U.S.\
  \ AG)\n高级联邦执法官员；美国司法部首脑，总统内阁的成员。\n\n## V\n\n### 版本控制\n一种确保文件更改受到控制和跟踪的过程。版本控制通常用于应用程序开发。程序员检出（check\
  \ out）模块或文件，进行更改，然后检回文件（check in）。\n\n### 虚拟化\n一种允许单一物理服务器托管多个虚拟机的技术，从而节省硬件和设施成本。此外，虚拟化可用于灾难恢复，因为虚拟机可以作为文件复制并轻松移动到不同的位置。\n\
  \n### 漏洞\n对威胁的弱点或暴露。漏洞可能存在于资产或环境中。控制措施可以减轻漏洞相关的风险。\n\n## 漏洞评估\n用于发现系统弱点的过程。评估对漏洞进行优先级排序，识别出对组织风险最大的漏洞。\n\
  \n## W\n\n### 温备站点\n用于灾难恢复的替代位置。该站点是冷备和热备之间的折中方案。\n\n### Web 服务器群\n一组用于托管 Web 应用程序服务器。Web\
  \ 服务器群通过将请求分发到多个服务器来实现高可用性和负载均衡。\n\n### 白名单\n允许访问特定资源的实体、域名或地址列表。\n\n## 参考文献\n\n\
