  \ control`（检测控制）\n*   `digital signature`（数字签名）\n*   `nonrepudiation`（不可否认性）\n*\
  \   `preventive control`（预防控制）\n*   `rules of behavior`（行为规则）\n*   `sniffer`（嗅探器）\n\
