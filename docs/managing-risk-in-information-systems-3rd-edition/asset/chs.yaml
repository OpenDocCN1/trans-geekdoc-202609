  \ 2. 错\n\n## 第三部分\n\n横向扩展\n\n纵向扩展\n\n不间断电源 (UPS\n\nWeb 服务器集群\n\n## 风险缓解\n\nBIA 包含了对业务连续性计划\
  \ (BCP) 生至关重要的系统\n\n### 业务连续性计划\n\n![业务连续性计划](img/Part-Opener.jpg)\n\n## 应急响应计划\n\
  \n![应急响应计划](img/Part-Opener.jpg)\n\n## 灾难恢复计划\n\n![灾难恢复计划](img/Part-Opener.jpg)\n\
  \n## 计算机响应计划\n\n![计算机响应计划](img/Part.Opener.jpg)\n\n## 影响分析\n\n业务影响分析 (BIA) 是一种用于识别信息技术\
  \ (IT) 功能中断可能导致的影响的研究。另一种理解 BIA 的方式是，它关注对组织至关重要的系统。某些损失是极其严重的，如果不进行管理，可能会导致业务失败。\n\
  \n在处理 BIA 时，有必要对以下术有基本了解：\n\n- **最大可接受中断时间**：`MAO` 定义了系统的最大可接受停机时间。如果中断超过了 `MAO`\
  \ 时间，将对组织的使命产生负面影响。\n- **关键业务功能**：`CBFs` 包括被认为对组织至关重要的功能。如果 `CBF` 失败，组织将失去执行基本操作的能力，例如向客户销售产品。如果组织无法执行该功能，将会损失金钱。\n\
  - **关键成功因素**：`CSFs` 包括执行组织使命所需的要素。一个组织会有几个要素必须成功，组织才能取得成功。例如，可靠的网络基础设施可能被认为是许多公司的\
  \ `CSF`。\n\n### 主题\n\n本章涵盖了以下内容：\n- 什么是业务影响分析\n- 业务影响分析的范围是什么\n- 业务影响分析的目标是什么\n\
  - 什么是关键业务功能\n- 业务功能和流程如何映射到系统\n\n### 目标\n\n完成本章后，你能够：\n- 定义业务影响分析\n- 识别业务影响分析的范围\n\
  - 识别业务影响分析的目标\n- 识别关键业务功能\n- 将业务功能和流程映射到 IT 系统\n- 列出执行业务影响分析的最佳实践\n\n## 什么是业务影响分析？\n\
  \n`BIA` 是一种用于识别信息技术 (IT) 功能中断可能导致的影响的研究。另一种理解 `BIA` 的方式是，它关注对组织至关重要的系统。某些损失是极其严重的，如果不进行管理，可能会导致业务失败。\n\
  \n\n\n\n\n什么使一个业务功能变得关键？任何利益相关者都可以判断一个业务功能是否关键。如果利益相关者认为该功能的丢失将导致不可接受的损失，那么它就是关键功能。利益相关者根据经验和意见做出这一决定，而且绝非轻率。一旦该功能被指定为关键功能，利益相关者就需要投入资源（资金和人员）来保护它。\n\
  \n此外，法律也可以规定某项功能被视为关键功能。例如，《健康保险流通与与责任法案》（`HIPAA`）强制保护健康相关信息。访问控制和其他保护措施是维持 `HIPAA`\
  \ 合规性的关键组件。\n\n`BIA` 在很大程度上是一个数据收集过程。输入来自组织内的利益相关者、用户、流程所有者等人员。数据可以通过访谈、问卷和调查或通过审查可用报告来收集；任何能够提供目标系统信息的方法都可以。\n\
  \n`BIA` 并不提供解决方案，而是更大的业务连续性计划（`BCP`）的一部分，并为 `BCP` 提供输入，而 `BCP` 则包含了解决方案。例如，`BCP`\
  \ 可能会为控制措施提供建议，以减少停机的影响。\n\n将 `BIA` 与 `risk assessment`（风险评估）对比有助于理解 `BIA` 的目的。`risk\
  \ assessment` 关注威胁和漏洞。当威胁利用漏洞损害资产时，就会产生风险，`risk assessment` 的主要目标是通过减少或消除漏洞，或减少威胁及其对资产的影响来降低风险。\n\
  \n另一方面，`BIA`并不像 `risk assessment` 那样处理威胁或漏洞。相反，它关注的是停机的影响。虽然 `BIA` 的重点主要是业务连续性，但\
  \ `BIA` 也可以用于 `risk assessment`。换句话说，如果目标是确定确定哪些系统需要通过 `risk assessment` 进行评估，那么可以考虑使用\
  \ `BIA` 来识别并对关键系统进行优先级排序。\n\n同样，如果已经完成了 `risk assessment`，这些数据可以用来帮助创建 `BIA`。进行\
  \ `risk assessment` 的首要步骤之一是识别资产，这可以帮助识别对组织重要的资产。\n\n### 收集数据\n\n在 `BIA` 数据收集过程中，有多种方法可以收集数据。其中一种方法是与关键人员进行访谈。为了提高从这些访谈中收集的数据质量，应对其进行计划，例如确保被访谈人员有时间回答问题，并准备好正确的问题。这些问题应该关注\
  \ `CBFs`（关键业务功能）和支持性资源的 `MAO`（最大允许中断）。\n\n另一种方法是使用纸质或计算机的限制且性的问卷、表单或调查，换句话说，一次只关注一个流程。例如，可以使用\
  \ `SharePoint` 网站来收集和汇总数据。如果表单太长，人们可能没有足够的时间回答，而较短的表单可以引出更多实用的信息。\n\n另一种收集输入的方法是举办会议或电话会议。这种格式的处是人之间可以互动，从而提供更丰富的结果。然而，达成共识可能是困难的，尤其是在尝试确定不同系统的优先级时。\n\
  \n### 应急计划的七步\n\n美国国家标准与技术协会（`NIST`）发布了特别出版（`SP`）`800-34 Rev. 1`，即《联邦信息系统应急计划指南》。应急计划帮助组织识别在紧急情况或灾难后恢复服务的措施。`SP\
  \ 800-34 Rev. 1` 包含了 `BIAs` 的信息。尽管 `SP 800-34 Rev. 1` 专注于联邦信息系统，但它也可以私营公司。\n\n`SP\
  \ 800-34 Rev. 1` 确定了应急计划的七步。这七步是：\n\n1. 制定应急计划政策声明\n2. 执行业务影响分析\n3. 识别预防性控制\n4.\
  \ 创建应急策略\n5. 制定信息系统应急计划\n6. 确保计划的测试、培训和演练\n7. 确保计划的维护\n\n从第二步可以看出，`BIA` 驱动大部分应急计划。只需要对\
  \ `BIA` 识别为关键的系统进行应急预案。\n\n### 不同的数据收集方法\n\n可以使用多种数据收集方法。例如，由于某些人可能拥有大量信息，访谈可能是恰当的。但因为访谈了一个人，并不意味着每个人都应该被访谈。\n\
  \n如果人们已经由于大量的会议压得喘不过气，他们可能会对另一个 `BIA` 会议反感。另一方面，他们可能欢迎利用空闲填写在线表单的机会。\n\n## 定义业务影响分析的范围\n\
  \n与任何项目一样，在过程早期定义 `BIA` 的范围或边界是重要的。定义范围有助于确保 `BIA` 聚焦于重点，并分析正确的功能。\n\n范围受组织规模的影响。对于小型组织，`BIA`\
  \ 的范围可能涵盖整个组织。对于规模较大的组织，范围可能仅包含某些区域。例如，一个 `BIA` 可能仅包含大型企业的在线销售部门，而其他 `BIAs` 将检查业务的其他区域。\n\
  \n`图 12-1` 显示了一个带有后端数据库的在线 Web 服务器，用于电子商务。`BIA` 可以仅关注支持该 Web 服务器的关键功能。根据该图，支持在线销售的系统是\
  \ Web 服务器、防火墙和数据库服务器，代表了客户购买产品的阶段。它不包括其他阶段，例如产品发货，这在图 12-2 中所示。这两个阶段的功能截然不同，它们的\
  \ `MAO` 也是如此。网站的 `MAO` 短短于发货功能的 `MAO`。\n\n### ![](img/Tip.png)提示\n\n在确定范围时也应考虑预算。如果组织足够大，可以聘请安全顾问来协助\
  \ `BIA`，而如果预算有限，可能无法聘请安全顾问。\n\n另一方面，如果发货末端发生停机，其影响并不是立即的。即使持续一整天，它可能只导致发货轻微延迟，这并不关键。\n\
  \n仅仅因为停机在发货阶段的影响不是关键的，并不意味着它不应该包含在 `BIA` 中。相反，重点是范围应该具体识别。这里有一个模糊范围陈述的示例：\n\n`BIA`\
  \ 的范围将涵盖网站的功能。\n\n\n\n\n\n执行业务影响分析（BIA）的人可能会将此范围解释为仅包含购买阶段。如果 BIA 的意图是包含购买和发货阶段，那么该\
  \ BIA 将是不完整的。另一个人可能会将其解释为包含购买和发货阶段。如果意图是让 BIA 仅涵盖购买阶段，那么同时执行这两个阶段就会浪费资金。\n\n以下范围声明更为清晰：\n\
  \nBIA 的范围将涵盖网站在客户购买阶段的功能，包括所有支持客户访问和购买的功能。发货阶段不包含在此 BIA 范围内。\n\n如果需要包含发货阶段，可以将范围声明修改为如下：\n\
  \nBIA 的范围将涵盖在线网站的所有功能，包括所有支持客户访问和购买的功能，以及所有支持产品发货的功能。\n\n## 业务影响分析的目标\n\nBIA 的总体目标是识别停机的影响。具体而言，目标是识别可能影响组织的关键功能。在确定关键功能后，就可以确定支持这些功能的关键资源。\n\
  \n每个资源都有一个 `MAO`（最大允许中断时间）以及在故障时会产生的影响。最终目标是识别恢复需求。`图 12-3`](#23_chapter12_03.xhtml#fig12-3)\
  \ 显示了这些总体步骤：从流程所有者和专家处收集输入以帮助识别 `CBFs（关键业务功能）以及支持它们的关键资源，识别资源的影响和 `MAO`，并根据 `MAO`\
  \ 确定恢复需求。\n\n![图 12-3 BIA 的目标](img/9781284183719_CH12_FIGF03.png)\n\n`图 12-3` BIA\
  \ 的目标。\n\nBIA 的间接目标是为资金提供理由。在确定 BIA 中的恢复需求后，将确定在 `BCP（业务连续性计划）中支持这些需求的控制措施。如果影响很大，投入资金防止停机将具有成本效益。\n\
  \n`NIST SP 800-34 Rev. 1` 包含一张与 `图 12-4`](#23_chapter12_03.xhtml#fig12-4) 类似的图。它显示了成本与停机时间之间的关系。标记为\
  \ `Cost of Disruption`（中断成本）的线表示，在停机发生后，中断成本非常低。然而，随着停机时间的增加，中断成本也会增加。另一条线识别了 `Cost\
  \ to Recover from an outage`（恢复停机的成本）。为了能够几乎立即从停机中恢复，成本是非常高的。然而，如果接受较长的停机时间，恢复成本就会较低。\n\
  \n![图 12-4 成本的关系](img/9781284183719_CH12_FIGF04.png)\n\n`图 12-4` 成本的关系。\n\n例如，如果一个在线销售产品的网站故障持续\
  \ 60 秒，中断成本将非常低；而如果停机持续几天，中断成本将非常高。可以实施控制措施使网站能够从 60 秒的停机中立即恢复，但成本将非常高。相比之下，在恢复控制上花费极少资金会导致更长的停机时间。\n\
  \n这些考虑有助于确定最佳成本点。在该点，公司将花费最少的资金进行恢复控制，同时仍最大限度地减少中断成本。\n\n以下章节将更详细介绍 BIA 的目标。\n\n\
  ### 识别关键业务功能\n\n对于 IT 专家来说，`CBFs` 并不总是显而易见的。例如，安全专家可能不知道网站的 `CBFs`。对他们来说，Web 服务器是一个显而易见的组件，但还有其他组件。\n\
  \n采访或调查专家有助于获得对支持 Web 服务器的所有组件的洞察，并且识别 `CBFs` 的底层步骤通常很有用。例如，以下列表详细说明了在线网站购买的步骤：\n\
  \n1. **客户访问网站**——客户使用网络浏览器访问网站。网站托管位于组织去军事化区 (`DMZ`）的 Web 服务器上，防火墙在提供安全的同时也提供了对\
  \ Web 服务器的访问。\n2. **客户浏览产品目录**——当用户搜索特定产品时，网站向后端数据库发送查询。数据库服务器位于第二层防火墙后的内部网络中。Web\
  \ 服务器使用数据库查询结果构建网页，并将其发送回客户。\n3. **客户选择产品**——在浏览期间，客户可以将产品添加到购物车。\n4. **客户结账**——当客户准备好完成购买时，他们点击结账按钮，启动一个安全会话。现有客户可以登录访问之前使用过的信息，如地址和信用卡号。这些信息来自第二层防火墙后的后端数据库服务器。新客户会被提示输入客户数据。Web\
  \ 服务器将新客户的数据发送到后端数据库服务器进行存储。订单完成后，Web 服务器向客户发送确认电子邮件。\n5. **向订单处理应用程序发送消息**——数据库服务器向订单处理应用程序发送消息，该应用程序托管在内部网络中的另一个服务器上。该应用程序处理产品发货，这是一个独立流程。\n\
  6. **处理订单**——订单处理应用程序跟踪订单并发送到仓库应用程序。仓库人员发货订单并将信息输入仓库应用程序。订单处理应用程序向客户发送电子邮件，让他们知道订单状态，包括订单何时发货以及针对发货问题（如延迟）的跟进邮件。\n\
  \n![提示](img/Tip.png)\n\n首先识别 `CBFs` 是一种自上而下的方法，然后是识别支持它们的关键和服务基础设施。自下而上的方法可能会漏掉重要的元素，例如，尝试确定服务器支持哪些功能。\n\
  \n在例例中，`CBFs` 是：\n\n* 客户访问网站\n* Web 服务器访问数据库服务器\n* 订单处理应用程序跟踪订单\n\n### 识别关键资源\n\n\
  关键资源是支持 `CBFs` 所需的资源。一旦确定了 `CBFs`，就可以对它们进行分析，以确定每个功能的关键资源。\n\n网站的示例展示了如何从 `CBFs`\
  \ 识别关键资源。网站的一个 `CBF` 是客户访问网站。支持此功能需要以下 IT 资源：\n\n* 互联网访问\n* Web 服务器\n* Web 应用程序\n\
  * 网络连接\n* `DMZ` 互联网侧的防火墙\n\n![注意](img/Note.png)\n\n这并不是流程设计的唯一方式。产品数据库可以托管在 `DMZ`\
  \ 中的服务器上，以便更快检索数据，而客户数据库可以单独托管在内部网络中。`DMZ` 也可以不同的设计。存在许多设计可能性，这就是为什么询问专家很重要。他们会知道流程是如何配置的。\n\
  \n第二个 `CBF` 是 Web 服务器对数据库的访问。数据库服务器托管了产品和客户信息。客户信息用于客户购买时以及针对返回客户的广告投放。支持此功能需要以下\
  \ IT 资源：\n\n* Web 服务器\n\n\n\n\n\n* Web 应用程序\n* 数据库服务器\n* 网络连接性\n* DMZ 内部侧的防火墙\n\n\
  第三个 CBF（关键业务功能）是订单处理应用程序。它需要从数据库服务器接收订单，并能够跟踪订单直到交付。支持此功能需要以下 IT 资源：\n\n* 托管订单处理应用程序的服务器\n\
  * 数据库服务器\n* 仓库应用程序\n* 网络连接性\n* 互联网访问\n\n### 没有 BIA 时的恢复\n\n想象一下一个没有进行过业务影响分析（BIA）的组织在灾难后的恢复步骤。管理员应该首先恢复哪些系统？他们应该首先恢复哪些\
  \ CBF？如果没有任何指导，恢复工作可能将变得毫无章法。\n\n管理员可能对某些系统更加熟悉，并尝试首先启动它们。当然，当他们做这些工作时，经理可能会将他们引导到自己的心仪项目上让他们优先启动，或者高管可能会再次引导他们优先启动他们最喜欢的系统。尽管这些系统中可能没有一个对组织的生存至关重要，但在没有\
  \ BIA 的情况下，管理员仍然可能关注这些非关键系统上。\n\n相比之下，BIA 可以识别 CBF，并帮助组织内的每个人理解什么对组织是重要的。具体来说，它帮助管理员理解他们应该首先启动哪些系统。\n\
  \n因此，执行 BIA 的时间应该在灾难发生之前，这样员工就会知道优先级，优先级在 BIA 中会有文字规定。如果没有文档，任何事情都可能发生，但有一点是定的——在灾难期间冷静无法占据优势。\n\
  \n在许多情况下，关键资源会重叠。换句话说，一个功能所需的关键资源可能也是另一个功能所需的。例如，Web 服务器是两个功能需要的，而设施支持（例如电力、供暖和空调）是所有功能需要的。\n\
  \n一个资源可以列出一次适用于所有功能，也可以针对每个功能分别列出。对于 IT 资源，将每个资源与每个功能对应列出是更好的主意。例如，所有 IT 资源都需要设施支持。它们可以如下列出一次：\n\
  \n* **电力**——需要不间断电源和发电机以确保系统在停电期间保持运行。\n* **供暖和空调**——需要供暖和空调以确保所有系统能够运行。\n\n###\
  \ 识别 MAO 和影响\n\n一旦确定了 CBF 以及支持它们的 IT 资源，下一个考虑的因素就是 MAO（最大可接受中断）和影响。MAO 也称为最大可容中断时间\
  \ (MTPD)。MAO 有助于确定灾难发生后哪些 CBF 需要尽快恢复和重启，识别重启 CBF 所需的特定资源，并帮助确定这些系统需要多快恢复。\n\n此过程中的其他考虑因素是对业务业务的影响，这种影响是金钱上的，但不需要以金钱形式表示。相反，影响通常用相对值表示，如高、中、低，但也可以用数字表示，例如\
  \ 1 到 4 级。\n\n一旦确定了影响水平，就可以将其与 MAO 匹配。**表 12-1** 显示了组织中如何定义影响值层级的示例。每个级别都与 MAO 匹配，以确定系统在产生影响之前可以停机多久。\n\
  \n**表 12-1** 影响级别示例\n\n| 影响值级别 | 最大可接受停机时间和影响 |\n| --- | --- |\n| **1 级** | 业务功能在所有业务时间内必须可用。在线系统必须\
  \ 24 小时、每周 7 天可用。 || 两小时。任何停机都会对业务产生即时影响。 |\n| **2 级** | 业务流程在没有该业务功能的情况下可以生存一段时间。\
  \ || 一天。如果停机时间超过一天，将对业务产生影响。 |\n| **3 级** | 业务流程在没有业务功能的情况下可以生存一天或以上。 || 三天。如果停机时间长达三天，对业务不会产生影响。\
  \ |\n| **4 级** | 业务流程在没有业务功能的情况下可以长时间生存。 || 一周。除非停机时间超过一周，否则对业务不会产生重大影响。 |\n\n在计算组织的\
  \ MAO 时，必须同时考虑直接成本和间接成本。\n\n### 直接成本\n\n![](img/Note.png) 注意事项\n\nMAO 值由每个组织内部指派，这意味着一个组织使用的值和恢复目标与另一个组织使用的可能完全不同。\n\
  \n直接成本通常比间接成本更容易计算。其中一些成本是显而易见的，另一些则不是。以下列表显示了一些直接成本：\n\n* **即时销售和现金流损失**——这是最明显的损失。在停机期间，公司无法销售其产品或服务，并失去这些销售带来的的正常现金流。\n\
  * **设备更换成本**——如果设备损坏，则需要维修或更换。根据设备的不同，这些成本可能是巨大的。\n* **建筑更换成本**——如果建筑因火灾或自然灾害丢失，则需要重建或更换。虽然保险涵盖了大部分成本，但很少能覆盖所有成本，组织必须弥补差额。\n\
  * **延迟交货罚金**——服务水平协议（SLA）规定了预期服务水平，如果未达到要求，通常会产生罚金。\n* **违规罚金**——某些法律对违规行为处以罚款。如果失败导致违规，应包含此项成本。\n\
  * **创建或恢复数据的成本**——停机期间丢失的数据需要重新或恢复。某些数据可能需要手动创建，其他数据可以通过备份恢复。恢复数据可能涉及人工成本。\n* **支付给因停机闲置员工的工资**——如果停机导致无法正常工作，员工仍需上班，这意味着公司仍需为无法进行的工作支付工资。\n\
  \n\n\n\n识别间接成本比识别直接成本更困难，但必须识别这些成本，因为它们的价值也会影响影响估值。以下列表显示了需要考虑的某些间接成本：\n\n-   **客户流失**——无法从公司购买产品的客户可能会向竞争对手处购买，在此过程中，他们可能会发现这种体验很满意且再也不回来。吸引新客户来补偿流失的成本需要花费巨资。\n\
  -   **公众信誉的损失**——停机可能会导致组织在公众眼中的吸引力下降。例如，如果停机导致客户个人身份信息泄露，他们可能会开始不信任该组织；如果他们的信用卡数据被泄露，他们可能不再与该组织做生意。\n\
  -   **重新获得市场份额的成本**——当失去客户和信誉时，公司会失去市场份额，而竞争对手则会获得。大多数公司意识到，留住客户远比吸引新客户容易得多。\n-\
  \   **重新获得良好品牌形象的成本**——如果公司的品牌受损，公司必须采取措施进行修复。修复受损的声誉需要大量的广告资金，有些公司永远无法恢复。\n-  \
  \ **信用损失或信贷成本增加**——当停机影响公司的现金流时，也会影响公司的信用评级。较低的信用评级会导致成本增加，更糟糕的是，公司可能会失去现有的信用。\n\
  -   **恢复期间错失的机会**——当组织处理停机事件时，员工花费时间处理它。这些员工原本可能正在致力于吸引新业务的项目，这意味着这些新业务变成了一个错失的机会。\n\
  \n### 识别恢复需求\n\n恢复需求确定了系统必须恢复的时间范围，并识别了必须恢复的数据。例如，某些数据丢失是可以接受的，而另一些数据丢失则不可接受。\n\n\
  与恢复需求相关的两个主要术语是恢复时间目标 (RTO)和恢复点目标 (RPO)。虽然 `RTO` 适用于系统或功能，但 `RPO` 仅适用于数据。更具体地说，`RPO`\
  \ 指存储在数据库中的数据。\n\n`RTO` 是系统或功能必须恢复的时间，应等于或小于 `MAO`。例如，如果 `MAO` 为一小时，则 `RTO` 需要为一小时或更短。\n\
  \n`RPOs` 确定了组织可以接受的最大数据丢失量，即可接受的数据延迟。例如，一个数据库每分钟可能记录数百笔销售交易。组织可能需要将这些数据恢复到故障发生时的刻，这是一个昂贵的过程，但由于每笔交易都代表收入，这种成本是合理的。另一方面，另一个数据库可能每周只导入一次数据；为了确保不丢失任何数据，唯一需要恢复的数据是自上次导入以来添加的数据，这是一个廉\
  \ Solution 得多的过程。\n\n`RTO` 也可以被视为时间关键型，而 `RPO` 被视为任务关键型。`RTO` 确定了系统恢复的时间，而 `RPO`\
  \ 确定了任务关键的数据。某些过程必须及时恢复，这需要短的 `RTO`。其他过程的恢复可以延迟，只要所有数据都已恢复。\n\n### 提示\n\n![](img/Tip.png)\n\
  \n虽然可以实现较低的 `RTO`，但要贵得多。因此，在访谈利益相关者时，将成本与 `RTO` 联系起来是非常重要的。例如，确保数据库可以恢复到故障发生时的刻是可能的，即使在地震等重大灾害之后，但这将需要独立的站点、独立的服务器和即时数据复制，所有这些都是昂贵的。一旦利益相关者认识了成本，他们可能会决定不同的\
  \ `RTO`。\n\n\n\n\n用于记录销售的数据库不能接受大量数据丢失，因为每一分钟的数据丢失都代表着销售收入的损失。另一方面，其他数据库的变化可能并不频繁，且其更改可以手动重建。如果变化不多且易于重建，则可以接受更多的数据丢失。例如，一个数据库每周手动更新五次，且更新有纸质记录显示需要重建的内容。因此，该数据库丢失一周的数据是可以被接受的。因为更新有纸质记录，数据库可以恢复并重建这些更新。\n\
  \n# 业务影响分析（BIA）流程的步骤\n\nBIA 的大部分工作是收集与 BIA 范围内的关键业务功能（CBF）相关的数据。收集数据后，将对其进行分析。最后阶段是发布\
  \ BIA 报告。某些组织可能希望包含满足恢复时间的建议，但这在技术上不属于 BIA 的一部分。通常，控制措施的建议出现在 BIA 之后。\n\nBIA 的总体步骤为：\n\
  \n1. 识别环境\n2. 识别利益相关者\n3. 识别关键业务功能 (CBFs)\n4. 识别关键资源\n5. 识别最大可中断时间 (MAO)\n6. 识别恢复优先级\n\
  7. 开发 BIA 报告\n\n尽管这些步骤识别了要采取的行动，但可以进行不同的组合或排序。最需要记住的一点是，BIA 的目标是识别关键资源和恢复优先级。实现这一目标的实际步骤在不同组织之间可能不同。\n\
  \n### 识别环境\n\n第一步是识别整体 IT 环境，这意味着对业务功能有彻底的理解。如果业务产生销售收入，了解销售金额（包括客户数量和交易次数）是非常重要的。销售收入意味着停机期间损失的销售额。\n\
  \n对于不产生销售收入的 CBF，也可以执行 BIA。例如，电子邮件系统是许多组织的 CBF。它可能为 5,000 名员工提供服务，每天处理数万封电子邮件。尽管它不产生任何直接销售收入，但大多数组织仍会将其识别为\
  \ CBF。\n\n识别环境可能包括确定哪些内容是关键的，包括获取 BIA 范围内 IT 系统的整体概览。根据范围的不同，这一步可能包括收集图表和技术文档，这将有助于确定哪些组件是关键的。\n\
  \nBIA 可以针对整个组织完成，也可以仅针对其部分完成。例如，对于一个用户少于 100 人的小公司，可以针对整个公司完成 BIA。另一方面，一个在全国范围内设有办事处的公司可能需要进行多个\
  \ BIA，而不是仅仅一个巨大的 BIA。可以针对任何一个小办公室以及组织内的不同功能进行单独的 BIA。例如，可以为在线销售执行一个 BIA，为数据库支持执行另一个\
  \ BIA。\n\n在完成这一步后，管理员将对将哪些系统纳入 BIA 有了更好的了解，并能够识别出利益相关者。\n\n### 贴士\n![](img/Tip.png)\n\
  \nBIA 并不关注识别或实施恢复方法，但它是一个重要的前提。在管理员不知道需要恢复什么之前，他或她无法开始寻找恢复方法。\n\n### 识别利益相关者\n\n\
  利益相关者是指那些对项目成功有直接利益或兴趣的个人或群体。例如，销售副总裁对销售的成功有直接利益。利益相关者了解 CBF。\n\n利益相关者可以帮助确保有充足的资源可用，这包括简单的事务，如确保有人员抽空时间参加\
  \ BIA 访谈，以及较大的问题，如识别 MAO。\n\n个人利益相关者可以识别任何系统或功能为关键的，因为他们对停机造成的损失负责。他们还负责投入资源来保护这些系统。因为这是他们的责任，所以利益相关者的意见是最重要的。\n\
  \n### 识别关键业务功能\n\n某些 BIA 从一开始就设计为关注某个特定的 CBF。例如，可以专门为某个在线网站委托 BIA。因此，涉及的过程就成了唯一需要识别的内容。\n\
  \n另一个 BIA 可能会侧重于远程办事处，因此首先需要做的是识别远程办事处执行哪些功能。例如，远程办事处大部分工作可能是离线完成的，例如定期向客户现场提供演示。根据这种情景，即使那里的人失去了一周或更长时间的所有\
  \ IT 功能，那里的人仍然可以进行这些演示。在这种情况下，没有任何功能会被认为是关键的。\n\n另一方面，远程办事处可能销售产品或服务，这意味着办事处在营业期间需要与主办公室保持持续连接。如果远程办事处丢失连接，员工将无法完成交易。如果这些员工产生了大量收入，组织可能会将连接视为一项关键功能。\n\
  \n### 识别关键资源\n\n关键资源是支持 CBF 和流程所需的资源。它们可能包括硬件（如服务器或路由器）和软件（如操作系统和应用程序）。\n\n在识别关键资源时，必须包含支持基础设施。例如，\
  \ Web 服务器必须每天 24 小时、每周天运行，并需要设施支持，可能包括电力、供暖和空调。如果关键系统需要支持人员进行操作，则食物和饮用水等项目应被视为关键资源。\n\
  \n识别关键人员同样重要。任何系统都有几位对其成功至关重要的关键人员，例如高管、经理、主管、管理员或关键客户或供应商。\n\n在之前提到的带有后端数据库的在线\
  \ Web 服务器示例中，将包含以下系统：\n\n* Web 服务器\n* 数据库服务器\n* 内部防火墙\n* 外部防火墙\n\n访谈专家对于识别支持任何 CBF\
  \ 的关键系统至关重要。例如，在微软域内的电子邮件服务中，明显的系统是任何电子邮件服务器。然而，在微软域内，还有几个服务器是关键的，包括域控制器 (DC)、作为全局目录的\
  \ DC 以及用于定位域内服务器的域名系统 (DNS) 服务器。如果其中任何服务器不可用，电子邮件服务将无法工作。\n\n### 识别 MAO\n\n一旦识别了关键资源，就可以确定它们的\
  \ MAO。这些资源每一个都支持一个 CBF。如果资源的 MAO 不明确，则必须识别其所支持的 CBF 的 MAO，这也就是该资源的 MAO。\n\n在识别 MAO\
  \ 之外，还应该包含一份影响声明，以说明损失的影响。影响可以通过识别在这种情况下无法做的事情来直接说明，也可以以货币形式陈述。\n\n例如，电子邮件服务可能是关键的。然而，组织在遭受严重影响之前可能还可以运行\
  \ 8 小时。另一方面，每小时产生 60,000 美收入的 Web 服务器每分钟损失高达 1,000 美直接销售额。组织可以将该 Web 服务器的 MAO 确定为\
  \ 5 分钟。\n\n**表格 12-3** 显示了此步的示例输出。\n\n\n\n\n# 表 12-3 特定资源的 MAO 及其影响\n\n| 资源 | MAO\
  \ | 影响 |\n| --- | :--- | :--- |\n| Web 服务器 | 五 分钟 | 损失大量直接销售收入和间接损失。五分钟的停机会导致约 $5,000\
  \ 美元的直接销售损失。 |\n| 数据库服务器 | 五 分钟 | 损失大量直接销售收入和间接损失。用户仍可以浏览网站。五分钟的停机会导致约 $5,000$ 美元的直接销售损失。\
  \ |\n| 电子邮件服务器 | 八小时 | 公司内部主要通信中断。与供应商和客户的主要通信中断。 |\n\n## 确定恢复优先级\n\n业务影响分析（BIA）的这部分识别了最重要和不重要的关键系统。最高优先级根据最短的\
  \ MAO 进行分配。例如，将一个停机 5 分钟后就会影响运营的系统与另一个可以停机 8 小时才会产生影响的系统进行比较，显然，MAO 为 5 分钟的系统应该优先恢复。\n\
  \n此阶段 BIA 的输出可以简单地列出带有指定优先级（如 1、2 和 3）的关键系统列表。优先级也可以进行分类。例如，最系统系统可以被归类为“高”，而其他类别可以列为“中”或“低”。\n\
  \n表 12-4 显示了如何为组织的系统列出恢复优先级。该表使用 1 到 5 的量表，1 为最高优先级。桌面 PC 被列为最低优先级。\n\n### 表 12-4\
  \ 恢复优先级\n\n| 系统 | 优先级 |\n| --- | --- |\n| Web 服务器 | 1 |\n| 数据库服务器 | 1 |\n| 电子邮件服务器\
  \ | 2 |\n| 桌面 PC | 5 |\n\n## 编制 BIA 报告\n\nBIA 报告汇总了收集的数据。没有特定的格式要求，但它通常包含以下部分：\n\
  \n*   **初步系统信息**——初步系统信息包括通用信息，如组织、系统名称和系统文档。\n*   **系统联系人 (POCs)**——POC 是为 BIA\
  \ 提供输入的系统专家和利益相关者。也可以向他们提问任何跟进问题。根据 BIA 的范围，可以包含内部和外部 POC。\n*   **系统资源**——此节列出了具体的资源，包括硬件、软件以及任何人员或其他资源。\n\
  *   **关键角色**——某些 POC 可能担任与系统相关的关键角色。如果是这样，可以在此节中识别出他们，这将便于后续跟进。\n*   **关键角色与关键资源关联的表格**——此表将人员与系统进行匹配。例如，如果电子邮件服务被认为是关键的，则电子邮件\
  \ POC 将与此系统匹配。\n*   **识别资源、停机影响和 MAO 的表格**——此表列出了 BIA 中识别的每个关键资源。对于每个资源都包含了停机影响和\
  \ MAO。该表是 BIA 最重要的元素之一。\n\n\n\n\n然后必须确定这些系统的优先级，如表 12-5 所示。它使用了与表 12-4 中相同的量表。优先级\
  \ `1` 为最高，`5` 为最低。如果数据库服务器或仓库应用程序服务器故障，将无法进行发货。然而，发货的某些延迟是可以接受的，因此这些系统被分配的优先级为 `2`。\n\
  \n**表 12-5** 关键业务系统优先级\n\n| 系统 || 优先级 |\n| --- | --- |\n| 数据库服务器 || 2 |\n| --- |\
  \ --- |\n| 仓库应用程序服务器 || 2 |\n| 连接到 Web 服务器 || 3 |\n\n如果与 Web 服务器的连接中断，新订单将无法传递到仓库，但仓库工作人员仍可以处理现有订单。因此，该连接被分配的优先级为\
  \ `3`。\n\n### 组织执行业务连续影响分析 (BIA) 的最佳实践\n\n在执行 BIA 时，可以使用几项最佳实践。以下是其中一些的列表：\n\n*\
  \   **从明确的目标开始**——所有参与 BIA 的人员都必须理解其范围，这最好最好通过书面形式定义。许多项目之所以偏离轨道，仅仅是因为个人对需求的理解各异。\n\
  *   **不要遗忘目标**——BIA 的目的是识别关键功能、关键系统和最大可接受中断时间 (MAO)。这些数据被用于确定恢复优先级。\n*   **采用自上而下的方法**——从关键业务功能\
  \ (CBFs) 开始并深入到支持它们的 IT 服务，这是自上而下的方法；相反，如果从服务器开始，将会遗漏实现 CBFs 成功所需的重要元素。\n*   **多样化的数据收集方法**——在收集数据时，使用的方法必须与组织的惯做法相匹配。通过对某些人员进行个人访谈可以获得可靠的数据，但可能无法对其他人进行个人访谈。在这种情况下，可以使用问卷。在收集\
  \ BIA 数据时，小组讨论通常很有用，此类讨论可以通过电话会议、会议和工作坊进行协调。\n*   **提前计划面试和会议**——数据收集是 BIA 的重要部分，因此确保参与者有足够的时间提供所需的数据非常重要。如果他们被仓促或没有做好准备，可能无法提供所需的数据。\n\
  *   **不要寻找快速解决方案**——BIA 是非常耗时的，特别是在数据收集、评估和确定优先级的过程中。走捷径可能会忽略关键功能或流程。\n*   **将 BIA\
  \ 视为一个项目**——所有的正常项目管理实践都适用。应该设定里程碑并跟踪进度。\n*   **考虑使用工具**——有很多工具可以帮助完成灾备备项目，这些工具也可以帮助开发\
  \ BIA。\n\n### 考虑使用工具\n\n现有的工具可以帮助完成 BIA。例如，`BIA Professional` 是 Sungard Availability\
  \ Services 销售的多种工具之一。它包含了帮助收集和汇总信息的工具，并引导用户完成从开始到结束的过程。\n\n该工具包含了基于网络的调查。这些问题可以设计成根据用户的回答进行分支。换句话说，对特定流程没有直接知识的用户将不会被问有关该流程的问题。一旦创建了问题，就可以将调查链接发送给专家，他们可以通过互联网在任何地方回答问题。\n\
  \n`BIA Professional` 是 Sungard 整体连续性管理解决方案套件的一部分。可用的替代工具包括 ReliaSoft 的 `BlockSim`\
  \ 和 Factonomy 的 `BCM`。\n\n## 章节总结\n\nBIA 是一个有助于识别关键系统和资源的宝贵工具。一旦识别出它们，就可以确定资源的 `MAO`\
  \ 时间。确定停机影响后，就可以确定恢复优先级。某些系统可能立即恢复运行。\n\n与 BIA 相关的重要的术语是 `RTO` 和 `RPO`。\n\n## 核心概念与术语\n\
  \n* 业务影响分析 (BIA)\n* 关键业务功能 (CBF)\n* 关键成功因素 (CSF)\n* 最大可接受中断时间 (MAO)\n* 最大容忍中断时间\
  \ (MTPD)\n* 恢复点目标 (RPO)\n* 恢复时间目标 (RTO)\n\n## 第 12 章评估\n\n1. 然后必须确定这些系统的优先级，如表 12-5\
  \ 所示。它使用了与表 12-4 中相同的量表。优先级 `1` 为最高，`5` 为最低。如果数据库服务器或仓库应用程序服务器故障，将无法进行发货。然而，发货的某些延迟是可以接受的，因此这些系统被分配的优先级为\
  \ `2`。\n\n2. 在执行 BIA 时，可以使用几项最佳实践。以下是其中一些的列表：\n\n    *   **从明确的目标开始**——所有参与 BIA\
  \ 的人员都必须理解其范围，这最好通过书面形式定义。许多项目之所以偏离轨道，仅仅是因为个人对需求的理解各异。\n    *   **不要遗忘目标**——BIA\
  \ 的目的是识别关键功能、关键系统和最大可接受中断时间 (MAO)。这些数据被用于确定恢复优先级。\n    *   **采用自上而下的方法**——从关键业务功能\
  \ (CBFs) 开始并深入到支持它们的 IT 服务，这是自上而下的方法；相反，如果从服务器开始，将会遗漏实现 CBFs 成功所需的重要元素。\n    * \
  \  **多样化的数据收集方法**——在收集数据时，使用的方法必须与组织的惯做法相匹配。通过对某些人员进行个人访谈可以获得可靠的数据，但可能无法对其他人进行个人访谈。在这种情况下，可以使用问卷。在收集\
  \ BIA 数据时，小组讨论通常很有用，此类讨论可以通过电话会议、会议和工作坊进行协调。\n    *   **提前计划面试和会议**——数据收集是 BIA 的重要部分，因此确保参与者有足够的时间提供所需的数据非常重要。如果他们被仓促或没有做好准备，可能无法提供所需的数据。\n\
  \    *   **不要寻找快速解决方案**——BIA 是非常耗时的，特别是在数据收集、评估和确定优先级的过程中。走捷径可能会忽略关键功能或流程。\n   \
  \ *   **将 BIA 视为一个项目**——所有的正常项目管理实践都适用。应该设定里程碑并跟踪进度。\n    *   **考虑使用工具**——有很多工具可以帮助完成灾备备项目，这些工具也可以帮助开发\
  \ BIA。\n\n3. 现有的工具可以帮助完成 BIA。例如，`BIA Professional` 是 Sungard Availability Services\
  \ 销售的多种工具之一。它包含了帮助收集和汇总信息的工具，并引导用户完成从开始到结束的过程。\n\n    该工具包含了基于网络的调查。这些问题可以设计成根据用户的回答进行分支。换句话说，对特定流程没有直接知识的用户将不会被问有关该流程的问题。一旦创建了问题，就可以将调查链接发送给专家，他们可以通过互联网在任何地方回答问题。\n\
  \n    `BIA Professional` 是 Sungard 整体连续性管理解决方案套件的一部分。可用的替代工具包括 ReliaSoft 的 `BlockSim`\
  \ 和 Factonomy 的 `BCM`。\n\n    BIA 是一个有助于识别关键系统和资源的宝贵工具。一旦识别出它们，就可以确定资源的 `MAO` 时间。确定停机影响后，就可以确定恢复优先级。某些系统可能立即恢复运行。\n\
  \n    与 BIA 相关的重要的术语是 `RTO` 和 `RPO`。\n\n    * 业务影响分析 (BIA)\n    * 关键业务功能 (CBF)\n\
  \    * 关键成功因素 (CSF)\n    * 最大可接受中断时间 (MAO)\n    * 最大容忍中断时间 (MTPD)\n    * 恢复点目标 (RPO)\n\
  \    * 恢复时间目标 (RTO)\n\n4. 然后必须确定这些系统的优先级优先级，如表 12-5 所示。它使用了与表 12-4 中相同的量表。优先级 `1`\
  \ 为最高，`5` 为最低。如果数据库服务器或仓库应用程序服务器故障，将无法进行发货。然而，发货的某些延迟是可以接受的，因此这些系统被分配的优先级为 `2`。\n\
