  \n*(注：由于原文中存在大量重复段落，译文已根据逻辑进行了精简处理，确保内容连贯并符合高级文档工程师要求。)*\n\n[content]\n聚类有许多应用。它已被应用于生物学，将动物和植物归类为种、属、科等。最近，它也被应用于遗传学，用以寻找基因组之间的相似性，并识别可能存在致病基因突变的区域。其他应用还包括营销研究，将消费者归类为某些产品或服务的潜在买家。异常检测在最近的研究中引起了广泛关注，因为它能够检测网络流量中的异常并防御潜在的威胁和数据泄露，或者根据机器传感器数据中的异常帮助防止工厂停机。聚类被用于图像分割，以检测图像中的区域用于目标识别。聚类还被用于分析地震数据，以寻找新的油源或检测地震区域的危险区域。此外许多应用领域。需要注意的是，在许多现实世界的应用中，“类”的概念并没有明确定义，这可能导致意外的类或某些实例落入错误的类中。例如，在对书籍进行聚类时，一位政治人物的传记可能会被分到政治类而不是传记类。由于在聚类项目开始时，所需的类数量通常是未知的，因此可能会出现一个或多个意外的类，例如，一个包含政治人物传记的类。聚类定义的模糊导致了许多不同的聚类算法。此外，不同的聚类方法在文献中的分类方式也不同。\n\
  \n由于聚类将数据分成具有相似特征的划分，因此它可以被看作一种分类方法。然而，在聚类中，标签是从数据中得出的，且通常不是预先知的。\n\n## 6.1 聚类的类型\n\
  \n聚类可以是排斥性的，即每个实例都属于一个类。硬聚类（Hard clustering）中每个点恰好属于一个类。模糊聚类（Fuzzy clustering）中，实例可以属于多个类，类是重叠的。**图\
  \ 6.1：排斥聚类与非重叠聚类。** \n\n由于在聚类项目开始时，所需的类数量通常是未知的，因此可能会出现一个或多个意外的类，例如，一个包含政治人物传记的类。聚类定义的模糊导致了许多不同的聚类算法。此外，不同的聚类方法在文献中的分类方式也不同。\n\
