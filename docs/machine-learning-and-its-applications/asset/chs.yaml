- "# 机器学习及其应用\n\n\n\n\n\n\n\n\n\n\n\n\n\n**名称：** Wlodarczak, Peter，作者。\n\n\n\n\n##\
  \ 前言\n\n人工智能或 `AI`，特别是机器学习，由于我们在该领域看到的快速进展，在媒体中受到了广泛关注。自新世纪初以来，机器学习获得了巨大的动力，我们在许多研究领域和实践中看到了惊人的新应用。互联网使得前所未有的数据公开可用，机器学习在实践中经历了大量的研究。\n\
  \n机器学习被用于垃圾邮件过滤、医学图像分析、语音命令、自动驾驶汽车以及分析物联网的传感器数据等（仅列举部分）。现在每部高端智能手机都支持 AI。深度学习被用于预测地震、自动语言翻译、黑白电影自动上色以及金融预测。火星探测器“好奇号”利用人工智能高精度地自主选择具有检查价值的土壤和岩石样本。此类比比。\n\
  \n最近，机器学习还引起了大量关注，由于是人们担心工作被机器取代、自主系统的危险（例如可能变坏的机器人）、对生存基础设施控制权的丧失，甚至由于人工智能引发战争的担忧。然而，需要注意的是，人工智能正如其名，是人工的，与人类智能无关。机器可能能够识别图片中的动物是狮子还是老虎，但它无法理解其所识别内容背后的概念，即它不理解“生命”的概念。深度学习器本质上是一个巨大的数学公式。它与人类大脑的工作方式（即执行生化过程的地方）无关。人工神经网络受自然启发。它包含了我们对大脑工作方式的一丝理解，并结合了大量的数学。在我们对大脑有更好的了解之前，机器取代医生诊断患者或取代律师判处罪犯的愿景可能还太过早了。\n\
  \n\n\n\n\n当我开始从事机器学习时，有许多优秀的书籍解释了机器学习算法中使用的数学知识。也有一些关于数据挖掘和知识发现的优秀书籍。其中一些被列在参考文献部分。它们可以用于学习和参考。然而，并没有书籍解释机器学习背后的基本概念以及它们如何在实践中应用。理解机器学习中使用的数学和算法是关重要的。但是，为了能够有效地将它们用于解决现实世界的问题，并不需要了解算法的所有细节。在过去的几年里，机器学习已经发展到许多复杂性被隐藏在\
  \ `TensorFlow` 或 `Apache Mahout` 等框架中的程度。数据科学家可以在不了解实现细节的情况下使用这些框架。许多流行的编程语言都拥有可以直接在程序中使用的实现库。`R`、`Python`、`Java`\
  \ 或 `Scala` 都有许多不同的机器学习方法实现，数据科学家可以通过包含最符合目的的库来继续使用他们偏好的编程语言。还有一些工具，例如 `RapidMiner`、`Weka`\
  \ 或 `Knime` 等，不需要编程技能即可以图形化方式创建机器学习工作流。显然，除了开源实现外，不同供应商还提供了商业工具供选择。\n\n本书旨在解释机器学习背后的基本概念和机器学习方法。这是多年在各种项目中实践应用这些方法的经验结晶。它试图对算法及其背后的数学进行简洁描述，使其达到有助于解释其内部工作原理的水平。然而，它的目的并不是给出一个包含所有推导的详尽数学描述。此外，机器学习可以追溯到\
  \ 20 世纪 40 年代，并从那时以后不断演变，发展出了许多不同的技术，多到无法在一本书中描述。此外，对于几乎每种机器学习方法，都提出了变体，某些变体可能比其他更适用于某些问题。尽管如此，一些基本概念适用于许多此类方法，理解它们可以很容易熟悉以前未使用过的新方法。本书的编写方式使得每一章都可以独立阅读，但需要注意的是章节之间存在某些冗余。希望这本书能让读者更容易开始学习机器学习，并支持他们在数据科学和机器学习的迷人旅程中不断前进。\n\
  \n\n\n\n\n\n\n\n\n\n机器学习（ML）是人工智能（AI）的一个子领域。人工智能的核心科学目标是理解使自然系统或人工系统产生智能行为的原理[31]]。早期的人工智能研究对让计算机推理和推断事实表现出极大兴趣。近年来，人工智能的研究重点已转向设计和构建能够智能行动的智能体。智能体可以是生物体，如人类或动物，也可以是机器人、传感器或汽车。\n\
  \n\n\n\n机器学习的目标是使计算机能够自主学习。机器学习是关于让计算机修改或适应其行为（无论这些行为是预测还是控制机器人），以便这些行为变得更加准确，其中准确性通过所选行为反映正确行为的良好程度来衡量\
  \ [25]。通过机器学习，计算机可以自己学习规则，而不需要程序员来手动开发这些规则。当规则复杂到开发者无法实现，或者规则过多无法通过手动编程完成时，这尤为有用。机器学习的一个应用是垃圾邮件过滤器。垃圾过滤器将邮件分类为合法邮件和未经请求的邮件（即垃圾邮件）。新形式的垃圾邮件不断出现，垃圾邮件类型繁多，无法通过手动编写规则来识别它们。垃圾过滤器从过去的垃圾邮件中学习规则，并在新类型的垃圾邮件出现时学习新规则。计算机如何在没有被显式编程的情况下学习解决问题，是本书试图回答的核心问题。\n\
  \n机器学习并非新鲜事物。“机器学习”（Machine Learning）一词是由 Arthur Samuel 在 1959 年于 IBM 工作期间提出的。他将机器学习定义为一种赋予计算机在没有经过显式编程的情况下学习能力的研究领域\
  \ [2]。在他开创性的著作《利用国际棋进行机器学习学习的一些研究》[35] 中，他可能描述了第一个具有学习能力的程序。他的国际棋程序学会了自动提高自己的游戏水平。计算机可以被编程，使其学会玩出比编写程序的人更高水平的国际棋\
  \ [35]。然而，机器学习的历史可以追溯到 20 世纪 40 代，当时有 McCulloch 和 Pitts 的生物学习理论 [26] 以及 Rosenblatt\
  \ 在 1958 年描述的第一个人工神经元——感知器 [34]。\n\n由于在某些领域取得了巨大进展，机器学习在过去几年中获得了动力，特别是在目标识别、语音识别以及自主系统（如自动驾驶汽车、自动机器翻译、图像描述生成或黑白图像上色）中对深度学习器的应用。\n\
  \n机器学习是一门基于统计学、概率论、神经科学、心理学和物理学的跨学科研究领域。机器学习是学习的数学形式化。因此，人类和动物的自然学习（一种生物化学过程）与计算机学习（一种数学抽象）之间存在差异。在人类身上，学习是在湿性硬件（wetware）中进行的，而在计算机中它是在硬件中进行的。\n\
  \n## 1.1 数据挖掘\n\n数据挖掘（DM）被定义为从数据中发现模式的过程 [40]。文献中数据挖掘和机器学习之间没有明确的区分。在某些出版中，数据挖掘侧重于提取数据模式和发现数据之间的关系\
  \ [10]，而机器学习侧重于做出预测 [36]。数据挖掘是在数据中发现有用模式的过程 [17]。预测分析是从数据集中提取信息的过程 [17]。机器学习是数据挖掘的一个子领域，其中学习了规则。人类从经验中学习。数据是所有机器学习的起点。数据挖掘需要领域知识\
  \ [35]。\n\n## 1.2 数据挖掘步骤\n\n典型的数据挖掘工作流经过几个步骤。这些步骤包括数据收集、清洗、转换、聚合、建模、预测分析和分发。然而，取决于当前的问题，这些步骤可能会有所不同。如果一个数据挖掘项目旨在检测金融交易中的欺诈和洗钱，或将新闻文章分类为“政治”、“商业”等类别，则适用不同的技术。熟悉应用领域并设定数据挖掘项目的目标是必要的准备工作。领域知识对于评估已训练学习器的性能也是必要的。图\
  \ 1.1 总结了数据挖掘步骤。\n\n![图 1.1: 数据挖掘步骤。](img/fig1_1.jpg)\n\n数据挖掘是一个高度迭代的过程，需要经过多次迭代直到获得满意的结果。数据挖掘项目必须非常谨慎地执行。过去几年数据的增长促进了新的数据挖掘应用的发展，但这些应用的内部运行机制并没有记录。黑箱方法是危险的，因为结果可能难以解释，或导致错误的结论。例如，医学图像中未检测到的癌症组织，或自动驾驶汽车误读的交通状况。这些应用可以轻易操纵数据，加上嵌入黑箱软件中强大的数据挖掘算法的威力，使得其误用的风险成比例地增加\
  \ [17]。\n\n## 1.3 数据收集\n\n数据收集是接入数据源并提取训练和测试模型所需数据的过程。数据源包括数据库、数据仓库、事务数据、互联网、物联网的传感器数据或流数据，但还有更多。如果数据以原始格式存储，则被称为数据湖。数据可以是历史性的或实时的（流数据）。例如，训练垃圾邮件过滤模型需要历史的、标记过的合法邮件和垃圾邮件来进行训练和测试。通常会有多个数据源并合并多个数据源，这个过程被称为数据集成。作为一种通用技术，只要数据对目标应用有意义，数据挖掘就可以应用于任何类型的数据\
  \ [10]。\n\n\n\n\n收集足够的训练数据通常是困难的。数据有时无法公开，或者出于隐私或安全原因无法访问。为了缓解数据集稀疏的问题，可以创建合成数据，或者应用交叉验证等训练技术。此外，训练学习器需要带标记的数据。原始数据（如电子邮件）是没有标记的，而产生带标记的训练集可能是一项艰巨的工作。在这些情况下，可以使用主动学习等半监督技术。主动学习是在线学习的一种形式，智能体通过行动来获取有用的示例并从中进行学习`[31]`。在离线学习中，所有训练数据预先都是可用的，而在在线学习中，训练数据在学习器训练的过程中到达。学习算法可以在数据到达时主动请求智能体对数据进行标记。数据的可用性（无论是否已标记）对于机器学习项目的成功至关重要，并且应该在启动机器学习项目之前予以明确。\n\
  \n## 1.4 数据预处理\n\n困扰实际机器学习的一个问题是数据质量低劣`[40]`。现实世界的数据通常充满噪声且不一致，不能直接用于实际的机器学习应用。此外，现实世界的数据很少是能够直接作为机器学习方案输入的格式。这就是为什么需要数据预处理。数据预处理通常是花费时间最多的地方。在数据挖掘项目中，预处理占用高达\
  \ 70% 的精力并不罕见。\n\n虽然机器学习技术与领域无关，但数据预处理具有高度的领域特定性。例如，取决于分析的是文本数据还是图像，适用不同的预处理步骤。预处理任务也取决于所应用的学习算法。某些算法比其他算法能更好地处理噪声。例如，线性回归对离群值非常敏感，这使得移除离群值成为强制性的预处理步骤。\n\
  \n有很多不同的预处理技术。除了移除离群值，典型的数据预处理任务还包括相关性过滤、数据去重、数据转换、实体解析和数据增强。例如回到垃圾过滤器示例，垃圾邮件中包含“在线购买”、“在线药房”等词汇或链接的频率通常高于合法邮件。某些单词或短语的频率可以指示邮件是垃圾邮件还是合法邮件。首先从邮件中删除无关的词、字符或符号，这个过程称为停用词移除。没有权威的停用词列表，它们取决于挖掘的内容。停用词是语言中最常见的词，例如“the”、“who”、“that”。在移除停用词后，会统计剩余单词的频率，创建一个带有频率的词列表。生成的列表被称为词袋（bag-of-words）。词袋随后被用作机器学习方案的输入`图\
  \ 1.2`显示了预处理前电子邮件。\n\n由于机器学习算法通常不接受文本作为输入，创建一个带有频率的词袋是许多文本分析任务中非常常见的预处理步骤。对于情感挖掘、文本分类或信息检索等任务，它是简单且有效的。\n\
  \n![图 1.2: 电子邮件预处理。](img/fig1_2.jpg)\n\n`图 1.2:]` 电子邮件预处理。\n\n从数据集中提取相关信息被称为特征提取。它从原始数据中选择相关的观测点。有时特征集会被简化，这个过程称为特征选择。特征选择有助于避免过拟合，因为它降低了复杂度，但它仍然应该以足够的准确性描述数据。生成的特征集表示为特征向量。特征向量是许多机器学习算法使用的输入。特征可以是数值的（例如人的年龄），也可以是类别的（例如人的职业职称）。机器学习算法的输入可以是任意维数的张量。如果张量有一维，它就是一个向量；如果有两个维度，它就是一个矩阵。\n\
  \n数据转换是另一个常见的数据预处理步骤。它将数据转换为机器学习机器学习算法输入的格式。例如，将英尺转换为米、将字符串转换为数值或将连续值转换为离散值都是常见的转换任务。\n\
  \n1997 年，IBM 深蓝击败了国际象棋冠军加里·卡斯帕夫。这被誉为机器学习的里程碑之一。从预处理的角度来看，象棋是一项简单的任务，因为象棋有明确定义的规则，像“象\
  \ c3 - d4”这样的移动是不产生歧义的。换句话说，象棋数据没有噪声且规则集有限。\n\n## 1.5 数据分析\n\n数据分析是知识发现的过程。在数据分析阶段，会创建预测模型。有很多不使用机器学习技术的数据分析方法。然而，本书重点关注使用机器学习的数据分析，其他方法超本书的范围。\n\
  \n机器学习分为监督学习、半监督学习和无监督学习。一些广泛使用的学习方法包括集成学习、强化学习和主动学习。集成学习结合多种监督方法以形成更强大的学习器。强化学习是基于奖励的算法，学习如何实现复杂的客观（即目标）。主动学习是半监督学习的一种特殊形式。\n\
  \n### 1.5.1 监督学习\n\n当存在带标记数据时应用监督学习技术。带标记的数据用于训练和测试。标记通常是一个手动过程，可能耗时且昂贵。每条训练数据记录都与正确的标签相关。对于垃圾邮件过滤，带标记的数据意味着包含垃圾邮件和合法邮件的数据集。在这里，标签是“垃圾邮件”和“合法”。在训练期间，机器学习算法学习电子邮件与相关标签“垃圾邮件”或“合法”之间的关系。学习到的关系随后被用于将学习器以前未见的新邮件分类到它们相应的类别中。\n\
  \n监督方法可以用于分类和回归。分类将数据分为类别。垃圾邮件过滤是一个分类问题，因为邮件被分为垃圾邮件和合法邮件。类别就是标签。由于有两个类别，所以它是一个二分类问题。如果有两个以上的类，则被称为多分类或多标签分类问题。\n\
  \n\n\n\n回归分析用于估计变量之间的关系。它试图确定一组变化变量（即自变量，通常用 `X` 表示）与因变量（通常用 `Y` 表示）之间关系的强度。如果只有一个因变量，则称为简单线性回归；如果有多个一个因变量，则称为多元线性回归。在分类任务中，你寻找的是标签；而在回归任务中，你寻找的是一个数字。预测明天是否会下雨是一个分类问题，标签为“下雨”或“晴天”；而预测会下多少毫米的雨是一个回归问题。目标变量或因变量\
  \ `y` 是连续变量。相反，离散变量取有限数量的值。典型的监督学习方法包括贝叶斯模型、人工神经网络、支持向量机、k-近邻、回归模型和决策树归纳。\n\n###\
  \ 1.5.2 无监督学习\n\n当没有标记数据时，使用无监督学习技术。换句话说，没有 `y`。最流行的无监督方法之一是聚类。聚类的目标是通过寻找数据的底层结构来理解数据。聚类根据某些相似性度量将数据进行分组。例如，一家公司将其具有相似购买行为和人口统计特征的在线用户分为不同的客户群，以便通过营销活动更好地针对他们。在这个例子中，相似性是购买习惯和年龄组。由于没有标记数据，评估一个聚类并不是一项显而易见的任务。没有真值（ground\
  \ truth）可以与聚类任务的结果进行比较。\n\n聚类还可以用于以更压缩的格式表示数据（降维），用于数据摘要，同时保留其结构和用处。聚类也可以作为监督机器学习算法的预备步骤，例如通过降低维度来提高监督学习器的性能。\n\
  \n典型的聚类算法包括 k-means 聚类、层次聚类或主成分分析（PCA）。在 k-means 聚类中，算法将数据点分成分 `k` 组，其中 `k` 是组的中心，被称为质心。质心也称为几何中心或重心，代表一个聚类组所有数据点的平均位置。在\
  \ k-means 聚类中，数据点围绕质心分组。距离质心 `k` 最近的点被添加到聚类中。例如，仓库库存可以根据销售活动进行分组，或者在物联网（IoT）应用中的传感器数据可以分为正常和异常传感器数据以进行异常检测。\n\
  \n在 k-means 聚类中，`k` 的数量必须预定义。选择聚类的数量并不总是项显而易见的任务。例如，将动物图像分组为它们的生物家族（如猫科、犬科等），需要先关于待聚类图像中有多少个家族的先知识。k-means\
  \ 简单易用且收敛快，这通常使其成为机器学习项目的良好起点。\n\n层次聚类或层次聚类分析（HCA）通过创建树或树图（dendrogram）对数据进行分组。有两种方法：自底向上的凝聚法，每个数据点从它自己的聚类开始；以及自顶向下的划分法，将所有观测值放入一个聚类并执行划分以创建一个通常以树图呈现的层次结构。\n\
  \n人类和动物的学习很大程度上是无监督的。人类通过观察世界来学习，而不是通过告知每个对象的标签，这使得无监督学习在生物学上更合理。\n\n### 1.5.3 半监督学习\n\
  \n半监督学习通常用于存在少量标记数据和大量未标记数据的情况。对于数据科学家来说，标记数据通常是一项手动且耗力的工作。这暴露了在模型中引入人类偏差的危险。使用半监督方法通常可以提高模型的准确性，同时减少生成模型的时间和成本，因为并非所有数据都需要标记。例如，对于数据科学家来说，手动标记基因测序数据是一项无法逾越的任务，因为数据量巨大；人类二倍体基因组大约有六十亿个碱基对。半监督方法通过只标记少量数据可以缓解这个问题。换句话说，从少量的标记数据中学习特征。首先，我们用少量标记数据训练一个模型。然后使用效果最好的训练模型对未标记数据集进行标记。这产生了大量的伪标记数据。现在我们将标记数据集和伪标记数据集结合起来训练模型。通过这种方式，我们应该能够更好地捕获底层数据分布，且模型泛化得更好。通常，还有其他的半监督技术。半监督方法提供了利用大量数据进行训练的机会，同时最大限度地减少了标记训练数据花费的时间。理想情况下，半监督方法甚至可以发现新的标签。\n\
  \n半监督学习可以与人类的概念学习相关。父母在孩子第一次看到某个物体或动物时告诉他们它们的名字，这就是对其进行标记。少量的父母标记就足够孩子们在看到新物体时对其进行标记。\n\
  \n### 1.5.4 机器学习与统计学\n\n机器学习使用了大量的统计学。这就是为什么你经常会在文献中发现统计术语和机器学习术语互用。例如，“因变量”和“自变量”是统计术语，而“特征”和“标签”是它们在机器学习中的对应词。[表\
  \ 1.1] 对了一些流行的机器学习术语及其对应的统计术语。\n\n统计学习一词有时与机器学习混淆。这两种方法之间存在微妙的差别。两种方法都是基于数据的。然而，机器学习使用数据来提高系统的性能。统计学习基于假设。统计学习的基本假设是数据与某种规律性共享某些属性。因此，统计学习可以使用概率方法，概率分布可以用来描述统计规律性。机器学习不基于假设。统计学习是数学密集型的，通常使用特征较少较小数据集，而机器学习可以使用数十亿个实例和特征。统计学要求对数据有良好的理解，而机器学习可以通过更少的人力通过迭代识别模式。因此，机器学习通常比统计学更受欢迎。然而，由于统计学要求我们熟悉数据，它有助于我们对模型获得更大的信心。\n\
  \n表 1.1：机器学习与统计学术语。\n\n| 统计学 || 机器学习 |\n| --- | --- |\n| 拟合 (Fitting) || 学习 (Learning)\
  \ |\n| --- | --- |\n| 分类、回归 || 监督学习 |\n| 聚类、密度估计 || 无监督学习 |\n| 自变量、协变量 || 特征 (Feature)\
  \ |\n| 因变量、响应 || 标签 (Label) |\n| 观测值 (Observation) || 实例 (Instance) |\n\n\n\n机器学习有时被批评为仅仅是华丽版的统计学。虽然机器学习确实使用了大量的统计学方法，但它也使用了其他概念，例如数据挖掘或神经计算，因此，它是计算机科学的一个子领域。统计学是数学的一个子领域。机器学习和统计学习都是从数据中学习的方法。然而，机器学习是一种能够从数据中学习的算法，而不需要开发人员进行编程。统计学习是以等式形式表示的变量之间关系的数学形式化。\n\
  \n## 1.6 数据后处理\n\n数据后处理包括数据可视化（知识可视化），通常使用仪表板（dashboard）、报告或对结果进行发布。结果是在数据挖掘过程中发现的有用或感兴趣的模式。数据挖掘可能会生成成千上万种模式，但并非所有模式都是有趣的。如果一个模式可以被轻松理解、具有潜在的用处、在新的未见数据上经过了验证，或者它验证了你想要确认的某些假设，那么这个模式就是有趣的。例如，为了预测性维护而训练的模型可以检测故障。\n\
