  sum\\\\limits\\_{i = 1}^{k}{\\\\sum\\\\limits\\_{j = 1}^{({n{(i)}})}\\\\left\\|\
  \ {x\\_{j}^{i} - c\\_{i}} \\\\right\\\\|^{2}}}$ || (6.2) |\n\n其中 `n(`i*`) 是簇 `i`\
  \ 中的实例数量，`x`[`i*]`^(*i*)` 是簇 `i` 中的第 `j` 个实例，而 `c[i]` 是簇 `i` 的质心。算法 6.1 的第三步和第四步尝试最小化目标函数——误差平方和。误差平方和也称为离散度（scatter）。误差平方和越小，意味着质心（簇的原型）比误差平方和更高的簇能更好地代表该簇中的点。一旦\
  \ `k-means` 算法连续两次迭代之间的误差平方和之差小于指定值，过程就会停止。\n\n有几点备注：`k-means` 不限于欧几里得空间。`k-means`\
  \ 聚类是一种通用的聚类算法，可以用于多种数据类型，包括文档数据和时间序列。`k-means` 对初始质心非常敏感。对于同一个数据集，不同的初始质心可能会产生不同的结果。缓解这一问题的一种方法是运行多次\
  \ `k-means`，并根据目标函数或观察到的主要的聚类分配选择产生最佳结果的运行。另一种方法是首先随机选择一个样本数据集，并使用层次聚类来确定 `k` 的数量。\n\
  \n由于 `k-means` 将实例分配给最近的质心，因此簇形成超球体，换句话说，它们是球形形状，质心即为中心。`k-means` 聚类对于非球形的簇效果并不佳。可以使用变换对数据集进行预处理来解决这一问题。\n\
  \n## 6.3 层次聚类\n\n层次聚类，也称为层次聚类分析（HCA），是一系列密切相关的聚类算法，这些算法构建了簇的层次结构。层次聚类不仅对数据进行划分，还描绘了簇之间的关系。聚类主要有两种基本方法：合并聚类（agglomerative\
  \ clustering）和分裂聚类（divisive clustering）。合并聚类遵循自下而上的策略，每个实例开始都是自己的一个簇。每个数据点根据相似性与一个或多个点融合，形成更大的簇。在最后一步，我们得到一个包含所有实例的簇。分裂聚类是一种自上而下的方法，工作方式相反。聚类从一个单一簇开始，将其分为子簇。子簇在接后的迭代中进一步细分，直到每个数据点都属于自己的簇。分裂聚类不需要经过所有迭代，一旦满足停止标准即可停止。这两种方法如图[图\
  \ 6.2]所示。合并方法在程序实现上往往更简单，而分裂方法似乎更接近人类大脑的工作方式。在实践中，合并聚类被更广泛。\n\n![图 6.2: 合并与分裂聚类。](img/fig6_2.jpg)\n\
  \n[图 6.2:] 合并与分裂聚类。\n\n![图 6.2: 合并与分裂聚类。](img/fig6_2.jpg)\n\n[图 6.3:] 单链连接、完全连接和平均连接。\n\
  \n![图 6.3: 单链连接、完全连接和平均连接。](img/fig6_3.jpg)\n\n## 6.4 聚类可视化\n\n层次簇通常以树图（dendrogram，即树状图）的形式显示，如图[图\
  \ 6.4]所示。树图显示了簇、它们的关系以及它们被融合或分裂的顺序。\n\n可以在特定层级剪切树图以创建单独的簇。然而，树图不能用于确定簇的数量，但它通常能给出一个正确的数量。在库的示例中，用户必须定义在哪里进行切割。对于历史书籍来说，可能有一个簇就足够了。如果历史书太多，那么使用子簇（如“古代世界”、“中世纪”和“现代”）并将它们放在不同的书架上可能是有意义的。\n\
  \n![图 6.4: 树图聚类。](img/fig6_4.jpg)\n\n## 6.5 聚类评估\n\n如前所述，评估簇是一项挑战性工作，因为通常没有标准的真值（ground\
  \ truth）。聚类分析通常用于探索性数据分析项目。因此，聚类评估的重要性似乎并不显而易见。评估簇具有以下几个原因：\n\n1. 不同的聚类分析方法可能会发现不同的簇。\n\
  2. 正确的簇数量可能只有在聚类评估期间才会变得明显。\n3. 发现的簇并不相关，或者即使在不存在聚类数据的情况下也发现了簇。\n\n```\nAlgorithm\
  \ 6.2 合并聚类算法\n1. 计算距离矩阵\n2. repeat\n3. 合并两个最近的簇\n4. 计算新簇的距离并更新距离矩阵\n5. until 只剩一个簇\n\
  ```\n\n\n\n\n如果发现了聚类，即存在非随机结构，那么我们需要确定聚类执行的准确性。如果没有地面真值（ground truth），如标记数据，则必须使用内在方法。内在方法通过检查聚类之间的分离程度以及聚类的紧凑程度来评估聚类效果[[10]]。此外，不同类型的聚类分析方法需要不同的评估方法。例如，误差平方和对于\
  \ k-means 聚类效果良好，但对于基于密度的聚类效果不佳。许多聚类类型的质量可以使用凝聚性（紧凑性、紧密性）和分离性（隔离性）等指标进行评估。凝聚性衡量聚类内实例彼此之间的紧密程度。在统计学术语中，这等同于标准差较小（即接近平均值）[[43]]。换句话说，凝聚性衡量的是实例距离质心的距离。分离性衡量一个聚类与其他聚类之间的区分程度或分离程度。通常情况下，我们希望聚类既具有凝聚性又能良好地分离。结合这两者的方法是轮廓系数。\n\
  \n### 6.5.1 轮廓系数\n\n轮廓系数是衡量聚类内实例（凝聚性）与其他聚类（分离性）相似性的指标。轮廓系数的范围在 -1 到 1 之间。索引越高，实例与其所属聚类中的对象越相似，与其他聚类中的对象越不同。如果大多数实例具有高索引，则意味着聚类具有良好的凝聚性和分离性。轮廓系数可以使用欧式距离或曼哈顿距离等距离量来计算。轮廓系数仅适用于划分聚类，而不适用于层次聚类。\n\
  \n为了计算轮廓系数，我们需要计算 `a`(`o`)，即实例 `o` 与其所属聚类中其他实例的平均距离。`a`(`o`) 是衡量聚类紧凑性的指标。对于一个具有\
  \ `n` 个对象和 `k` 个聚类 `C`[1]、… `C`[k] 的数据集 `D`，我们对每个对象 `o` ∈ `D`（其中 `o` ∈ `C``i` =\
  \ \\frac{\\sum\\\\_{o\\\\prime \\\\in C_{i,}o \\\\neq 0\\\\prime}{dist\\\\left(\
  \ {o,o\\\\prime} \\\\right)}}{\\left| C_{i} \\\\middle| - 1 \\\\right.}$ || (6.3)\
  \ |\n\n以及 `b`(`o`)，即实例 `o` 到所有其不所属聚类的最小平均距离：\n\n| $b\\\\left( o \\\\right) = \\\
  min\\\\limits\\\\_{C_{{i}:1 \\\\leq j \\\\leq k,j \\\\neq i}\\\\left\\\\{ \\\\frac{\\\
  sum\\\\_{o\\\\prime \\\\in C_{{j}}{dist\\\\left( {o,o\\\\prime} \\\\right)}}{\\\
  left| C_{{j} \\\\right|} \\\\right\\\\}$ || (6.4) |\n\n轮廓系数 `o` 则定义为：\n\n| $s\\\\\
  left( o \\\\right) = \\frac{b\\\\left( o \\\\right) - a\\\\left( o \\\\right)}{max\\\
  \\left\\\\{ {a\\\\left( o \\\\right),b\\\\left( o \\\\right)} \\\\right\\\\right}$\
  \ || (6.5) |\n\n较小的 `a`(`o`) 意味着聚类具有凝聚性，较大的 `b`(`o`) 意味着 `o` 与其他聚类分离良好。如果轮廓系数 `s`(`o`)\
  \ 接近 1，则聚类质量更高。如果 `s`(`o`) 为负，则 `o` 更靠近另一个聚类中的实例。为了衡量聚类的整体质量，可以计算所有数据对象 `o` 的平均轮廓系数。为了衡量单个聚类的质量，我们可以计算该聚类内所有实例的平均\
  \ `s`(`o`)。如果某些聚类的轮廓比其他聚类窄得多，这通常意味着 `k` 的选择不当。也可以绘制轮廓系数图以启发式地确定聚类的自然数量。\n\n通常，还有其他的内在聚类评估方法。Dunn\
  \ 指数和 Davies-Bouldin 指数都属于这类聚类评估算法。Dunn 指数像轮廓系数一样是一种完全取决于数据本身的聚类评估方法，不依赖任何外部地面真值。其目标与轮廓系数相同：获得分离良好且紧凑的聚类。聚类内的实例方差应该很小。轮廓和\
  \ Dunn 指数是内部指标，因为它们只使用数据集中存在的信息。针对外部数据（如金标准数据）进行聚类评估也是可能的。例如熵，它衡量了聚类数据与外部数据的匹配程度。\n\
  \n# 第 7 章\n\n# 半监督学习\n\n**目录**\n\n7.1 期望最大化\n\n7.2 伪标记\n\n监督方法使用标记数据进行训练，无监督方法应用于未标记数据，并且必须自己确定特征重要性。半监督方法采用混合方法。有时，我们拥有少量的标记实例和大量的未标记实例。例如，金融机构的欺诈检测应用可能检测出已知的欺诈类型，但可能有许多新的、未知的欺诈类型会被系统漏掉。在这种情况下，可以使用半监督方法。这有几个优势。标记数据是一种耗时昂贵的方法，通常由数据科学家完成。手动标记还会引入人类偏见。在训练期间使用未标记数据可以提高准确性，且半监督方法的性能通常远于无监督方法。例如，人类基因组包含约\
  \ 30 亿个碱基对。全基因组测序对整个基因组进行标记几乎是不可能的。使用半监督方法可以访问无法分配监督信息的大未标记数据。半监督方法试图通过使用标记和未标记数据来提高分类准确性，而不是仅在小部分手动标记数据上训练模型，或对未标记数据使用无监督方法。然而，使用半监督方法并不总是可能的，我们往往不知道未标记数据的分布。\n\
  \n有两种基本的半监督方法：直推学习（transductive）和归纳学习（inductive）。在直推学习中，我们尝试使用标记数据来推断未标记数据的标签。这与归纳学习形成对比，后者的目标是输出一个定义在整个空间\
  \ X 上的预测函数 [4]。在归纳学习中，我们尝试从标记数据中得出应用于未标记数据的规则。\n\n直推方法通过以下步骤：\n\n首先，我们训练一个学习器（如朴素贝叶斯分类器）来学习类别。然后，我们应用训练好的学习器为未标记数据分配类别概率。这一步被称为“期望”步。然后，我们使用所有数据的标签训练一个新的学习器。这一步被称为“最大化”步。重复这些步骤，直到模型收敛，即模型不再产生不同的估计值。该过程被称为期望最大化算法或\
  \ EM 算法。每次期望最大化迭代都会使模型更泛化。期望最大化过程保证在每次迭代中找到具有相等或更高似然值的模型参数 [40]。\n\n\n\n\n期望极大化（expectation\
  \ maximization, EM），也称为期望极大化聚类分析，是一种解决极大似然估计问题的方法。通常来说，期望极大化是一种当模型中的某些变量无法直接观测（即隐变量）时，极大似然函数的算法。期望极大化假设数据由多个多元正态分布组成，这是一个很强的假设。它通过交替改进模型和对象对模型的分配来迭代尝试寻找最优模型。查看图\
  \ 7.1，上方的图显示了黑点和灰点。为了表征每个组，我们可以使用黑点的均值（约为 3）和灰点的均值（约为 6）。这被称为极大似然估计。给定一组数据，我们尝试找到能最好解释每个数据组的值或多个值。如果我们有相同的数据点但不知道每个实例属于哪一组，在某些条件下，我们仍然可以通过迭代应用期望极大化来确定每个组的均值。我们可以使用期望极大化来确定每个组的均值和标准差参数。\n\
  \n第一步是估计每个组的均值和标准差。这些是随机值，无法产生良好的估计。在图 7.2 中，我们有两个正态分布曲线。第一组的均值约为 3，第二组约为 6。在图 7.2\
  \ 中，第一个钟形曲线的均值约为 2.5，第二个钟形曲线的均值约为 7.5。在第二步中，我们利用两组均值和标准差的猜测，通过正态分布的概率密度函数计算每个数据点的似然。这告诉我们每个数据点属于一组或另一组的概率。这两个似然值（数据点属于某一组的概率和属于另一组的概率）在第三步中转换为权重。使用估计值和新计算的权重，我们计算两组均值和标准差的新估计值。这是第四步。使用所有数据点计算两次均值和标准差，一次针对一组，一次针对另一组。这是关键的一步，数据点对某一组的权重越大，它对下一次估计中该组估计的影响就越大。俗可以说，数据点被“拉”向正确的方向。图\
  \ 7.3 显示了一个改进的近似。在我们计算出新估计后，回到第二步并重复该过程以改进估计。我们重复这些步骤，直到估计收敛。\n\n![图 7.1: 极大似然估计。](img/fig7_1.jpg)\n\
  \n**图 7.1:** 极大似然估计。\n\n![图 7.2: 极大似然初始估计。](img/fig7_2.jpg)\n\n**图 7.2:** 极大似然初始估计。\n\
  \n我们如何确定聚类的数量？在聚类分析中，没有正确的答案。期望极大化聚类分析像所有的聚类分析方法一样，是一个知识发现过程。选定的聚类数量应该大于类别数量。假设我们想要训练一个分类器来区分鸟类、哺乳动物和鱼类。我们不能假设数据由三个精确的正态分布组成。然而，我们可以假设存在多种鸟类、哺乳动物和鱼类。因此，我们不仅仅是使用三个聚类，而是为飞行鸟、不会飞的鸟等创建单独的聚类。所以我们可能会得到\
  \ 20 个聚类。一旦学习器训练能够区分这 20 个类别，我们将聚类合并回三个原始聚类。有些可能很难分类，例如生活在海里的鲸或海牛，它们仍然是哺乳动物。为了验证类别是否存在某种结构而不仅仅是随机数据，可以将算法应用于单个类别。\n\
  \n![图 7.3: 极大似然近似。](img/fig7_3.jpg)\n\n**图 7.3:** 极大似然近似。\n\n期望极大化算法往往非常慢。特别是在处理高维数据时，期望步骤可能非常缓慢。此外，算法可能会陷入远离全局最大值的局部极大值。这时我们需要从头开始。\n\
  \n## 7.2 伪标签 (#06_Contents.xhtml#sec7_2)\n\n伪标签（pseudo labeling）是一种用于半监督学习的简单且高效的技术。它也用于深度学习。事实上，伪标签可以用于大多数神经网络和训练方法。在半监督学习中，我们从标记数据中学习特征。我们希望利用未标记数据中的信息来更好地理解数据的结构。伪标签可以用于从未标记数据中学习。伪标签的基本思想是使用标记数据集训练模型，然后使用该模型对未标记数据进行标记。伪标签遵循以下步骤：\n\
  \n1. 使用标记数据集训练一个或多个模型。训练数据集可能需要手动标记。\n2. 将表现最好的模型用于未标记数据以预测其的类别。\n3. 将训练集与带有伪标签的数据合并。\n\
  4. 像以前一样使用合并后的数据训练模型。\n\n伪标签可能不正确，但它们应该有高概率。如果结果不理想，可能需要另一次迭代，我们必须使用不同的方法从头开始。\n\
  \n按照惯例，我们将合并后的数据集分为训练数据和测试数据，以训练学习器。可能不存在底层结构，就像聚类问题一样，可能没有有用的结果。网页分类是半监督学习的一个典型问题。我们希望将网页分类为“新闻页面”、“讨论论坛”等。互联网上有大量的网页，但手动标记成千上万个网页的成本非常高昂。我们可以通过在少量标记网页上训练分类器，对原始网页使用伪标签。然后，我们可以像之前的那样使用训练好的学习器对想要分类的网页进行标记。深度学习器通常使用无监督方法进行预训练。深度神经网络的初始权重通过逐层无监督训练初始化。权重初始化后，使用标记数据和反向传播算法以监督的方式进行微调。这在使用半监督方法同样有效。我们可以使用额外的未标记数据进行无监督预训练。最终，如果我们想用未标记数据来丰富标记数据，我们可以在任何监督任务上使用半监督方法。在许多情况下，即使使用较旧的方法（例如朴素贝叶斯分类器），通过添加未标记数据并使用半监督学习，我们也可以获得更优的性能。\n\
  \n\n\n\n## 8.5 深度信仰网络\n\n## 8.6 深度自动编码器\n\n深度学习是一种以人工神经网络为基础的技术，近年来已成为机器学习领域的一项强大工具，有望重塑人工智能的未来\
  \ [[33]]。深度学习者依赖大量的标记训练数据集来获得最先进的结果。深度学习已应用于图像分类、机器翻译或语音识别，深度学习模型出现在许多现代智能手机中，用于语音命令或人脸识别。它们还被用于自动驾驶汽车、手写识别、无人机侦察或黑白图像和电影上色等应用。尽管在许多领域取得了成功，但它们在根本上与传统的人工神经网络并没有区别。与旧的网络（如多层感知器）不同的是，它们通常使用整流器作为激活函数，而不是\
  \ sigmoid 曲线，但它们仍然使用反向传播和梯度下降（即随机梯度下降）进行训练。然而，由于其规模庞大，计算可能会非常消耗资源，因为我们必须处理高维数据和大量的特征。例如，德语估计有\
  \ 330,000 个单词。在语音识别中，每个单词都是一个特征。如果我们想识别图像中的动物，网络必须针对自然界估计存在的 870 万种物种进行训练，且涵盖不同的角度、不同的年龄和不同的性别。训练数据的可用性通常是一个挑战，获取所需格式的标记训练数据集成本可能非常高昂。\n\
  \n如今有许多不同的深度学习架构投入使用。在 GPU（图形处理器）出现之前，已经提出了一些理论想法，但 GPU 提供了加速深度学习架构发展的算力支持。深度学习者的计算（例如卷积神经网络\
  \ CNN）可以被高度并行化，且矩阵乘法和卷积等代数操作可以转移到 GPU 上。GPU 提供了许多深度学习模型高效工作所需的计算能力。现在已经有了专门为 AI\
  \ 操作开发的芯片。\n\n## 8.1 深度学习基础\n\n文献中并没有一个公认的定义来规定学习者何时被称为深度学习者，何时被称为浅学习者。本质上，深度学习是具有许多层的人工神经网络。通常，具有一个以上隐藏层的神经网络被认为是深度学习者。深度学习者可以用于监督、半监督和无监督学习。在过去的几年里，由于对计算机视觉、自然语言处理和生物信息学的影响，深度学习变得非常流行。深度学习者的一项核心能力是自动提取特征的能力。低层特征通过通过深层神经网络的不同层，被抽象为高层特征。\n\
  \n目前已经提出了许多不同的深度学习架构。流行的深度学习架构包括卷积神经网络、深度信仰网络和深度递归网络。\n\n深度学习者属于表示学习器一类。表示学习器在做出最终预测之前会创建特征的内部表示。深度学习者在将特征映射到最终预测之前，会将特征转换为多种表示。例如，用于物体识别的卷积神经网络在不需要手动设计特征的情况下学习物体表示。它们的灵感源于动物的视觉皮层，并创建输入图像的内部表示。当信号通过网络层时，利用对象的层级特性，低层特征被转换为更高层次的抽象；边缘形成轮廓，轮廓形成形状，形状形成物体，以此此类推。\n\
  \n在使用深度学习者时有几点需要考虑。训练深度学习者需要大量的标记训练数据。寻找最优的深度学习架构可能是一项艰巨的任务。过拟合和收敛可能会导致问题，网络层数越多，该问题就越严重。在深度学习者的训练过程中，神经元可能会“死亡”，这意味着它们对任何输入始终输出相同的值。死掉的单元也不可能恢复，且不会在训练后的网络中发挥作用。这主要发生在使用整流器作为激活函数时。另一个问题是梯度消失问题。在训练使用反向传播期间，误差函数的导数可能会变得很小，导致权重不再变化。在最坏的情况下，网络将完全停止学习。这些以及其他一些问题需要深度学习的补充学习策略。\n\
  \n### 8.1.1 激活函数\n\n如前所述，深度学习者与浅层神经网络没有太大区别。然而，深度学习者通常使用不同类型的激活函数。深度神经网络中最常用的激活函数是修正线性单元，或称\
  \ `ReLU`。它是一个非常简单的函数，对于负输入返回 0，对于任何正 `x` 返回一个值（注：此处原文表述，应为返回其本身）。它可以写为：\n\n| `f(x)\
  \ = max(0, x)` | (8.1) |\n| --- | --- |\n\n`ReLU` 是一种斜坡函数，从图形上看如图 8.1 所示。尽管非常简单，但它处理非线性和交互效应的效果异常地。非线性效应简单意味着自变量与预测之间的关系不是线性的，换句话说，图表的斜率不是恒定的。交互效应意味着变量\
  \ `a` 对预测的影响取决于变量 `b` 的取值。例如，如果我们想根据体重预测患者心血管疾病的风险，我们还需要知道患者的高度。\n\n`ReLU` 在处理非线性方面效果如此好的原因是因为\
  \ `ReLUs` 可以以许多不同的方式组合。深度学习者本质上是非常巨大的函数。首先，对于我们在第 2 章和第 4 章中看到的每个节点都有一个偏置（bias）。正如我们看到的，偏置只是在训练期间学习的常数，它沿着\
  \ `x` 轴向左或向右移动激活函数。由于 `ReLU` 只有两个斜率，它是一个非线性函数，而偏置移动了斜率变化点。每个节点在同一层内甚至可以有自己的偏置，且每个节点可以在不同的点改变斜率。第二个原因初看起来违背直觉。正如我们所看到的，传统网络使用\
  \ sigmoid 激活函数，浅层神经网络最流行的激活函数之一是双曲正函数，如公式 8.2 所示。激活函数的主要用途之一是解释非线性，由于双曲正函数是非线性的，事实上它在处处都是弯曲的，我们可能会认为它效果良好。然而，如果层数很多，它会引起许多困难。它相当平坦，除了大约\
  \ -2 到 2 之间的小范围外，这意味着在该范围之外其导数非常小。如前所述，深度学习者使用梯度下降进行训练的，由于双曲正函数的导数在大部分时候很小，很难改进权重。模型层数越多，这个问题就越发严重。这被称为梯度消失问题。\n\
  \n![图 8.1: 修正线性单元。](img/fig8_1.jpg)\n\n\n\n\n\n# 图 8.1: 修正线性单元。\n\n| `f(x)` = `tanh(x)`\
  \ || (8.2) |\n| --- | --- |\n\nReLU 的导数在曲线的平坦部分为 0，在倾斜部分为 1。对于较大的训练集，在任何给定的节点通常会有产生正输出的实例。因此，平均导数很少接近于\
  \ 0。这使得梯度下降能够持续优化权重。然而，ReLU 有时会被推入一种对所有输入都处于非激活的状态，导致没有梯度回传到神经元，这是梯度消失问题的一种形式。ReLU\
  \ 有多种变体。例如，softplus 函数是 ReLU 的平滑近似，如图图 8.2 所示。它由公式 8.3 定义。\n\n| `f(x)` = `log(1+e^x)`\
  \ || (8.3) |\n| --- | --- |\n\nsoftplus 函数的导数是逻辑函数（logistic function），这也是 ReLU 导数的近似。\n\
  \n![图 8.2: Softplus 函数。](img/fig8_2.jpg)\n\n**图 8.2:** Softplus 函数。\n\nReLU 有几个优点。它们是单侧的且没有负输出，这在生物学上更合理。它们在计算也非常高效，因为它们只使用加法、乘法和比较操作。整器（Rectifiers）已成为深度学习者的首选激活函数，因为与\
  \ sigmoid 函数相比，即使在具有大型数据集的大型网络上，它们也能实现更快更高效的训练。此外，它们不需要任何半监督预处理步骤。尽管它们可以利用额外的未标记数据利用半监督设置，但深度整器网络可以在不需要对纯监督任务（带有大型标记数据集）进行任何无监督预训练的情况下，达到其最佳性能\
  \ [7]。\n\n## 8.1.2 特征学习\n\n特征学习是一套技术，允许机器自动检测特征，而不需要特征工程师手动提取感兴趣的特征。例如，图像中物体识别的传统方法需要特征工程师分离出图像中物体所在的区域并忽略背景。使用深度架构，可以自动检测感兴趣的对象，这一过程被称为目标检测。深度架构能够同时完成目标检测和物体识别。深度学习器的分层架构在每一层都创建了输入的更高层次的抽象。每一层的输出都是输入的低维投影。只要深度网络经过了最优权重分配，网络的输出就是原始数据的高级抽象，代表了一个自动的特征集。该特征集随后可以作为实际分类任务的输入。自动特征检测也有助于避免人类偏差。例如，使用卷积神经网络，卷积层充当了特征提取器。\n\
  \n特征学习是自动化整个端到端机器学习过程努力的一部分，被称为自动机器学习（AutoML）。自动机器学习旨在自动化通常由手动完成的所有机器学习任务，例如模型选择或超参数调优。然而，自动特征提取并不总是可行的。特征学习并不限于深度学习，它已用于浅层学习器，如\
  \ k-means 聚类或主成分分析。\n\n## 8.2 卷积神经网络\n\n卷积神经网络（CNN），也称为 ConvNets，在图像分析任务中非常流行，如图像分类和标记、物体识别、人脸检测和识别以及光学字符识别。它们的灵感来源于人类视觉皮层如何同化视觉信息，并且是专为图像分析开发的。最早的卷积神经网络之一由\
  \ Yann LeCun 在 1998 年提出 [19]，他是深度学习的三位父亲之一，另外 Yoshua Bengio、Geoffrey Hinton 和 Yann\
  \ LeCun [28]。然而，第一个卷积网络可以追溯到 20 世纪 80 年代，从那时提出了许多不同的卷积神经网络架构。\n\n由于卷积神经网络使用图像作为输入，某些图像处理属性已体现在它们的架构中。卷积神经网络由一组交替的前馈层组成，这些层实现了卷积滤波器，随后是减半层、整流层或池化层。与我们在第\
  \ 4 章中看到的多层感知器不同，卷积神经网络不是全连接的。此外，在卷积神经网络中，神经元以三维方式排列，并接受固定尺寸的三维输入图像。输出是一个单一向量。否则，它们与我们已经看到的传统神经网络以及我们看到的许多训练技术没有太大区别。我们见过的许多训练技术可以用于卷积神经网络。用于照片识别的卷积网络是一种特殊的前馈网络\
  \ [8]。它们由具有可学习权重和偏置的神经元组成。使用损失函数、反向传播和梯度下降进行训练。在实践中，超过三层很少有助于提高神经网络的准确性。相比之下，使用深度学习器，深度对于识别应用至关重要，卷积神经网络通常有十到二十层可学习层。由于每一层都投影出更高层次的抽象，具有多个层是直观的，因为物体由形状组成，形状由边缘组成，依此类推。\n\
  \n本质上，卷积神经网络由五类层组成：输入层、输出层以及三种中间层：卷积层、池化层和非线性层（通常为 ReLU）。\n\n*   输入层接受固定尺寸的三维像素数组：`[宽度\
  \ 高度 颜色通道]`\n*   卷积层从图像的小区域提取空间特征，并将这些区域连接到下一层的单个单元\n*   池化层将相邻特征合并为单个单元，这种下采样操作减了图像尺寸\n\
  *   ReLU 层应用激活函数，如 `max(0, x)`，图像大小保持不变\n*   输出层以全连接多层感知器（MLP）的形式存在，计算分类并输出一个持有分数的向量\n\
  \n应该注意的是，某些卷积神经网络也可以处理不同尺寸的图像。\n\n图 8.3 展示了一个卷积神经网络的示例架构，包含一系列不同类型的处理层。它接受原始图像作为输入并通过不同的层。全连接多层感知器的输出是一个持有类别分数的向量。为了方便表示，图\
  \ 8.3 是二维形式绘制的。本质上，卷积神经网络充当多层感知器的特征提取器。卷积层提取相关特征，池化层使特征对尺度和平移具有等变性。\n\n\n\n\n\n\
  `卷积层`(convolutional layer)承担了大部分计算工作。带有可学习参数的`卷积`(convolutions)用于在多个位置提取相似的特征。更准确地说，`感受野`(receptive\
  \ fields)对输入进行`卷积`(convolve)，并将`感受野`与下一层的一个单元连接起来，创建一个`特征图`(feature map)。其结果是一个`激活图`(activation\
  \ map)。网络学习`特征检测器`(feature detectors)或`过滤器`(filters)，它们在遇到`视觉特征`(visual feature）（如边缘或形状）时激活。`特征检测器`相互复制，因此共享相同的`权重`。通过这种方式，`视觉特征`可以在`图像`的任何地方被检测到。我们最终获得了一组`卷积层`，每层都有一个二维`激活图`。\n\
  \n`池化层`(pooling layer)将特征还原为单个单元。`池化`(Pooling)是一种基于样本的离散化过程，也称为`最大池化`(max pooling)，因为它对不重叠的子区域应用了`最大滤波器`(max\
  \ filter)，目标矩阵的每个元素都是该区域的最大值。然而，还有其他类型的`池化`。`池化层`周期性地放置在`卷积层`之间，以减小`表示`(representation)的大小并创建一个几乎`尺度不变的表示`(scale\
  \ invariant representation)。因此，`卷积神经网络`无论物体出现在`图像`的什么位置都能检测特征（`位置不变性`）。`池化层`也有助于避免`过拟合`。整个过程见图\
  \ 8.4。\n\n如前所述，`ReLU`已成为深度学习者的首选激活函数，因为它所需的功率更少，且缩短了训练时间。`ReLU`的运行比例如`tanh`函数快几倍。\n\
  \n`卷积层`只连接到输入的`局部区域`(local region)。它不像`感知器`(perceptron)中的层那样是全连接的。此外，`卷积层`中的许多神经元共享`参数`。否则，它与`全连接层`没有区别。`卷积网络`的巨大成功源于它们的架构。人们已经提出了许多不同的架构，但它们本质上都是图\
  \ 8.4 中基础`循环神经网络`(recurrent neural network)的变体。它们都使用了`卷积`、`池化`和`全连接层`。\n\n![图 8.4:\
  \ 卷积神经网络。](img/fig_4)\n\n**图 8.4:** 卷积神经网络。\n\n`卷积神经网络`主要归功于在`计算机视觉`中的成功应用。然而，它们也被用于`自然语言处理`、`视频分析`和`医学分析`。它们还被训练用于游戏，如国际象棋和围棋。尽管`卷积网络`具有吸引人的特性，但在大规模应用于`高分辨率图像`时，成本仍然高得惊人\
  \ [16]。\n\n## 8.3 循环神经网络\n\n`感知器`和`卷积网络`的一个局限性是它们需要`固定大小的向量`作为输入，并产生`固定大小的输出向量`。此外，`传统神经网络`的输入是独立的。`循环神经网络`(rNN)\
  \ 在值序列 `x[1], …, x[τ]` 上运行，并可以产生向量序列作为输出。处理`时间序列`(temporal sequences)的能力使得它们成为输入大小未知任务的理想选择。例如在`机器翻译`中，我们想要从一种语言翻译成另一种语言的`文本`或`语音`的长度可能预未知。因此，我们也不知道翻译后文本的长度。处理序列的能力使得`循环神经网络`适用于`时间序列分析`、理解口语或具有可变输入的情感分析等任务。大多数`循环网络`还可以处理变长度的序列\
  \ [8]。\n\n`循环神经网络`的基础工作由`Hopfield`完成，并于 1982 年发表 [13]。从那以后，开发了许多类型的`循环神经网络`，包括`El\
  \ 曼网络`(Elman networks)、`门控循环单元`(gated recurrent units)、`双向循环网络`(bidirectional recurrent\
  \ networks)和`深度循环神经网络`等。与`前馈网络`不同，`循环神经网络`包含`方向循环`(directed cycles)。然而，`循环神经网络`和`卷积网络`很少单独使用，它们通常是更广泛架构的一部分，通常与`感知器`结合使用，正如我们在第\
  \ 8.2 节中所看到的。\n\n我们在第 4 章中已经介绍了`循环神经网络`，那里涵盖了浅层学习器。本质上，如之前所述，`循环神经网络`在网络架构中增加了`循环`(loops)。`循环神经网络`中的神经元可能会向同一层内的另一个神经元横向传输信号，除了与下一层神经元的连接外，可能与自己建立连接。网络的`输出序列`也可以作为下一个输入序列的反馈。图\
  \ 8.5 显示了一些可能的`循环网络架构`。\n\n![图 8.5: 循环网络类型。](img/fig_5.jpg)\n\n**图 8.5:** 循环网络类型。\n\
  \n`循环连接`(recurrent connections)为网络增加了`记忆`或`状态`。`状态`通常以`状态向量`的形式存储并受网络控制。`状态向量`通过`学习函数`与输入相结合，产生一个新的`状态向量`。通过这种方式，`循环神经网络`不仅考虑当前输入，还考虑过去感知的内容。时间步`t`的决策受到时间步`t-1`的影响。这是非常直观，因为我们根据经验做决定。`序列信息`保存在`隐藏状态`中，允许`循环神经网络`发现随时间的相关性，称为`长期依赖`。时间`t`\
  \ 处的隐藏状态 `h`可以使用公式 8.4 计算：\n\n| `h[t] = σ(W*x[t] + U*h[t-1])` | (8.4) |\n| --- |\
  \ --- |\n\n其中\n\n| `h[t]` = 时间步 `t`的隐藏状态 |\n| --- | --- |\n| `x[t]` = 时间步 `t`的输入向量\
  \ |\n| `W` = 权重矩阵 |\n| `U` = 转换矩阵 |\n| `h[t-1]` = 时间步 `t-1`的隐藏状态 |\n| `σ` = 激活函数\
  \ |\n\n`转换矩阵`是`隐藏状态到隐藏状态的矩阵`，代表`循环神经网络`的`记忆`。`隐藏状态`包含了之前所有`隐藏状态`的痕迹，而不只是最后一个。`权重矩阵``W`决定了输入的重要性程度，正如我们在其他类型网络中看到的。`激活函数``σ`通常是`逻辑`函数或`双正切`函数。\n\
  \n`循环神经网络`并不一定是深度学习器。如图 8.5 所示，`循环网络`也被组织成层，如果它超过一个`隐藏层`，则通常被称为`深度循环神经网络`。\n\n\n\
  \n\n\n循环神经网络使用反向传播和梯度下降进行训练，这与前馈网络相似。然而，由于循环的存在，反向传播机制的工作方式与前馈网络不同。在前馈网络中，算法从最终误差开始通过层层反向移动，并向上或向下调整权重以减少误差。为了训练循环网络，使用了反向传播的一种扩展方法——随时间反向传播，或\
  \ `BPTT`。随时间反向传播是一种基于梯度的循环网络训练方法。在随时间反向传播中，时间是由从一个时间步到另一个时间步的有序计算序列定义的。本质上，循环神经网络的结构被展开了。创建了包含循环的神经元的副本，并将循环神经网络的循环图转换为无环图，从而将循环神经网络变为前馈网络。每个副本共享相同的参数。循环网络和展开后的网络如图图\
  \ 8.6 所示。\n\n![图 8.6: 随时间展开。](img/fig8_6.jpg)\n\n**图 8.6：** 随时间展开。\n\n然而，随时间反向传播在解释大脑中的随时间学习方面面临着前馈反向传播未遇到的特定问题，而且它与大脑的关系通常研究得较少\
  \ [21]`。神经网络（无论循环与否）都是形式为 `f`(`g`(`h`(`x`))) 的嵌套函数。在循环神经网络中，循环扩展了我们需要计算导数并应用链式法则函数序列。\n\
  \n并不是所有的循环神经网络都可以展开。对于某些架构，无法使用随时间反向传播。同样，如往常，随时间反向传播也有变体，例如截断随时间反向传播，它是完整随时间反向传播的近似。当时间步过多导致计算缓慢时，便会使用截断随时间反向传播。此外，循环神经网络（特别是当它们有很多层时）深受我们之前看到的梯度消失问题的困扰。如果我们无法确定梯度，就不知道如何朝着减少误差的方向调整权重。在坏的情况下，网络完全停止学习。针对梯度消失问题已经提出了许多解决方案。正如之前看到的，当使用\
  \ `ReLU` 作为激活函数时，我们不会遇到这个问题。另一个解决方案是使用残差网络，或 `ResNet`。残差网络是许多短网络（通常为三层）的集成。`ResNet`\
  \ 将深度学习器拆分成更小的块。`ResNet` 不需要额外的参数或其他训练机制。它们提供了梯度消失问题最有效的解决方案之一。\n\n正如我们看到的，循环神经网络对于文本和语音分析以及时间序列分析非常有效。它们还用于机器人控制、文本推荐、文本自动填充或呼叫中心的客户满意度分析。它们与\
  \ `ConvNets` 协同工作进行图像识别，这里仅举几个应用。\n\n## 8.4 受限玻尔兹曼机 (#06_Contents.xhtml#sec8_4)\n\
  \n受限玻尔兹曼机或 `RBMs` 是浅层双层网络，可用于分类、回归、降维、协同过滤或特征学习。它们没有其他类型的网络那么知名。然而，它们在 Netflix 奖赛中取得了顶级结果\
  \ [36] 并击了绝大多数竞争者。它们在深度学习章节中被介绍，因为它们构成了深度信念网络的构建模块。\n\n受限玻尔兹曼机是概率性的，即它们不分配离散值而是分配概率。受限玻尔兹曼机是一种玻尔兹曼机。然而，玻尔兹曼机是循环网络，而受限玻尔兹曼机不允许隐藏单元之间的层内连接。这就是它们被称为“受限”的原因。\n\
  \n受限玻尔兹曼机仅包含两层：输入层和隐藏层，如图图 8.7 所示。它们没有输出层。预测方式与普通的前馈网络不同。它们属于基于能量的模型。基于能量的模型试图最小化能量函数，高能量意味着准确性差。受限玻尔兹曼机分为可见单元和隐藏单元。可见单元接收训练集。训练期间通过调整权重、偏置以及可见单元和隐藏单元的状态来使能量函数达到最小值，这一过程被称为模拟退火。每个可见节点连接到每个隐藏节点。可见节点接受低级特征，例如图像的像素。如果一张图像有\
  \ 1024 个像素，受限玻尔兹曼机就需要 1024 个可见节点。输入与权重相乘并加上偏置。求和后的输入随后传递给 sigmoid 激活函数。这与我们在其他网络看到的无异。然而，受限玻尔兹曼机不使用随机梯度下降进行训练。它们使用\
  \ `Gibbs sampling` 和 `contrastive divergence` 来更新权重。训练机制超出了本书的涉及范围。\n\n![图 8.7:\
  \ 受限玻尔兹曼机。](img/fig8_7.jpg)\n\n**图 8.7：** 受限玻尔兹曼机。\n\n如果有多个层，隐藏层的输出 `a` 将作为下一隐藏层的输入。\n\
  \n受限玻尔兹曼机学习如何以无监督的方式重建输入。激活值 `a` 在反向传播中用作输入。它们与输入 `x` 相同的权重相乘。乘积之和加上可见层的偏置。可见层的偏置与隐藏层的偏置不同。产生的输出是原始输入的重构或近似。在正向传播期间，受限玻尔兹曼机计算给定加权\
  \ `x` 的情况下输出的概率：`p(`a`|`x`; `w`)`。在反向传播期间，受限玻尔兹曼机估计给定加权激活 `a` 的情况下输入 `x` 的概率：`p(`x`|`a`;\
  \ `w`)`。两种估计都导向 `x` 和 `a` 的联合概率分布：`p(`x, a*)`。训练经过多次正向和反向传播。不断权重，直到原始输入的概率分布 `p(`x*)`\
  \ 和估计输入的概率分布 `q(`x*)` 收敛。\n\n\n\n\n一旦受限玻尔兹曼机（RBM）训练完成，隐藏层的激活值将成为下一个隐藏层的输入。第二个隐藏层将不断训练，直到它能够近似上一个隐藏层的输入。这种在受限玻尔兹曼机中逐步训练隐藏层的方法是最常见的深度学习策略之一，因为它允许高效地训练许多隐藏层。它是无监督的，因为训练时不需要标记数据。这种多层网络的顺序构建方法允许通过创建特征层级结构来学习更复杂的表示。预训练的多层受限玻尔兹曼机构成了深度信念网络的基础。随后，可以使用监督学习对预训练的深度信念网络进行训练，例如用于分类。通过初始化权重预训练网络是受限玻尔兹曼机的主要用例之一。\n\
  \n## 8.5 深度信念网络\n\n深度信念网络（DBN）是上一章介绍的受限玻尔兹曼机的序列。它是一种深度学习器，由多个隐藏层组成，层与层之间以及层之间存在连接，但层内部没有连接。与受限玻尔兹曼机一样，它可以学习重建其输入。分层架构允许快速的无监督训练。预训练的深度信念网络是一种无监督预训练网络。每一层都充当特征检测器。一旦训练完成，就可以以监督的方式进一步训练，以创建一个分类器。深度信念网络最后可能会以输出层结束，例如\
  \ softmax 层或 logit 层，用于分类。深度信念网络可以以贪心的方式进行训练，即每层都单独训练。每个隐藏层都成为下一个隐藏层的可见层。\n\n深度信念网络有很多用例。深度信念网络可以用于分类、图像识别或图像生成。它也可以用于聚类。在这种情况下，没有输出层。深度信念网络的其他用例是视频序列和动作捕获数据生成。在实践中，深度信念网络有许多现实应用。它们被用于分类高分辨率卫星图像或医学图像、药物发现或分析脑电图。\n\
  \n深度信念网络接受二进制输入作为数据。其扩展版本连续深度信念网络也接受连续的十进制。\n\n## 8.6 深度自动编码器\n\n自动编码器是一种用于以无监督方式学习数据集表示（编码）的网络。自动编码器将数据压缩为代码，然后再次解压缩为接近输入的内容。通过这种方式，它被训练为忽略数据中的噪声。自动编码器同时学习压缩输入（即编码）和重建输入。近年来，自动编码器变得流行，因为它们被包含在许多强大的深度学习架构中。它们通常被用于降维。自动编码器也可以作为生成模型。学习到的代码可以用于构建自动编码器从未见过的事物的图像。\n\
  \n在最简单的形式，自动编码器是一个具有输入、输出和一个隐藏层的前馈网络。输入层和输出层具有相同数量的神经元。自动编码器总是对输入进行编码和解码。自动编码器尝试学习函数\
  \ `h`使得 `hW,b` ≈ `x`，其中参数 `W` 是权重，`b` 是偏置。换句话说，它们试图近似恒等函数。恒等函数总是返回作为参数传递给函数的相同值。自动编码器通过最小化损失函数（如平方误差）以无监督的方式进行训练。如果隐藏层大于输入层，自动编码器就可以学习恒等函数并完全重建输入。\n\
  \n深度自动编码器由两个对称的深度信念网络组成。它们能够压缩数据（如图像）。它们也可以用于主题建模。主题建模是发现一组文档中一个或多个主题的过程。\n\n深度自动编码器由一个编码部分和一个对称的解码部分组成。每个部分由一个或多个深度信念网络组成。[图\
  \ 8.8]显示了简单的深度自动编码器架构。\n\n自动编码器接受二进制数据作为输入（例如像素数组），但也可以使用实值数据作为输入。如果输入是 `32*32 =\
  \ 1024` 像素的图像，输入层应包含大约 1200 个单元，由于 sigmoid 玻尔兹曼单元的容量有限，这比 1024 个输入像素略大。随后的单元数量将类似于\
  \ 600、300、150 和 50，其中 50 是输入图像的编码版本。它是带有压缩表示的潜向量。潜变量无法直接观测，它们是从观测变量推断出来的。自动编码器的解码部分由相同数量的层和节点组成，但顺序相反。它接受压缩向量作为输入并学习如何重建图像。还有隐藏向量大于输入层的变体。如果隐藏代码小于输入的维度，则认为自动编码器是欠完全的（undercomplete）。如果更大，则被称为过完全的（overcomplete）。\n\
  \n![Figure 8.8: Deep autoencoder.](img/fig8_8.jpg)\n\n**[图 8.8:]** 深度自动编码器。\n\n\
  自动编码器可以被视为前馈网络的特殊情况，并可以使用所有相同的技术进行训练，通常是跟随通过反向传播计算的梯度进行小批量梯度下降 [8]。学习通过最小化损失函数 `L`\
  \ 实现，描述如方程 8.5 所示：\n\n```\nL(x,g(f(x)))\n```\n\n通过惩罚 `g(f(x))` 与 `x` 不同来实现。\n\n\
  通常，在使用自动编码器时，我们感兴趣的不是输出，而是压缩表示的属性。该表示可以用于主题建模，但对文档的信息检索也很有用，因为隐藏代码包含了最显著的特征。它们还用于图像搜索引擎。当一个图像的隐藏代码与另一个图像的隐藏代码相似时，它会被翻译为匹配的图像并返回。自动编码器为了卷积卷积（ConvNets）作为编码和解码网络，而不是深度信念网络。\n\
  \n\n\n在机器学习中，学习是在可能的表示空间中进行搜索，以找到最拟合当前数据的表示。因此，学习可以被视为一种搜索。机器学习中的“机”指的是执行搜索的算法。算法是数学与逻辑的结合。通常，搜索空间太大，无法被完全遍历。这有时被称为“维度灾难”。诸如降维等技术可以缓解这个问题。此外，某些学习技术可以帮助提高高维情况下学习算法的性能。\n\
  \n## 9.1 学习问题\n\n学习一种表示是在许多需求之间进行权衡 [31]。表示越丰富，通常对后续问题就越有用。然而，为了创建更丰富的表示，需要大量的数据。通常，所需数据的可用性往往是一个问题。交叉验证等技术有助于缓解数据稀缺问题。此外，机器学习方案容易出现过拟合。从统计学意义上说，“拟合”意味着我们寻找能够合理地拟合数据的最佳描述\
  \ [40]。过拟合模型无法从训练数据很好地泛化到未见数据，捕捉的是噪声而非底层信号。基本上，学习到的模型与其构建它的特定训练数据结合得太紧密了 [40]。过拟合模型也被称为过度训练。\n\
  \n在预测建模中，信号是你想要从数据中学习的真实底层模式。噪声是指数据集中的无关信息或随机性。当表示无法充分捕获数据的底层结构时，被称为欠拟合或学习不足。欠拟合模型的预测方差通常较小，但对错误预测的偏差较大。偏差（Bias）是期望值与测量（观测）预测值之间的差异。方差（Variance）是学习算法对特定数据集的敏感性。高方差模型会根据所使用的训练数据集产生非常不同的模型。低方差、高偏差的学习者倾向于更简单，但具有僵硬的底层结构。朴素贝叶斯或回归模型属于这一类。另一方面，低偏差、高方差的学习者倾向于更复杂，但具有更灵活的底层结构。深度决策树和\
  \ k 近邻学习器属于这一类。这种复杂性的权衡被称为偏差-方差权衡，因为学习者不可能同时是复杂的又是简单的。集成学习器倾向于具有更小的偏差和方差误差。\n\n\
  ### 9.1.1 偏差-方差权衡\n\n偏差-方差权衡是监督学习的一个基础问题，适用于分类和回归。它是关于同时减少两种误差来源（偏差和方差）的问题。为了在偏差和方差之间找到良好的平衡，一个良好的预测模型会减少总误差。总误差定义为：\n\
  \n```\nTotal error = Bias² + Variance + Irreducible error || (9.1)\n```\n\n| | |\n\
  | --- | --- |\n| Bias | = 期望值与实际值之间的偏差 |\n| Variance | = 对训练集微小波动的敏感性产生的误差 |\n|\
  \ Irreducible | = 不可约误差是真实关系中的噪声项 |\n\n偏差指的是模型误差，而方差指的是模型应用于其他数据集时预测准确性的一致性 [1]。不可约误差（也称为噪声）在训练过程中无法通过任何模型从根本上减少。它有时可以通过执行更好的数据预处理步骤（通常是更好的数据清洗）来减少。不可约误差源于数据本身，而偏差和方差源于学习算法的选择。在无限训练数据的情况下，理论上可以将偏差和方差降低到\
  \ 0（渐近一致性和渐近有效性）。然而，某些学习者即使有足够的数据也无法拟合模型。例如，`linear` 无法拟合数据。如 `Figure 9.1` (`21_Chapter9.xhtml#fig_1`)所示，`perceptronron`\
  \ 显示了数据。偏差和方差是评估质量的两个标准。遗憾的是，我们无法同时减少偏差和方差，我们需要找到一个最佳平衡，如`equation 9.2` (`21_Chapter9.xhtml#eq_2`)所示。\n\
  \n偏差-方差权衡是监督学习的一个基础问题，适用于分类和回归。它是关于同时减少两种误差来源（偏差和方差）的问题。为了在偏差和方差之间找到良好的平衡，一个良好的预测模型会减少总误差。总误差定义为：\n\
  \n```\nMSE = Bias² + + Variancereducible || ( (9.)))\n```\n\n\n| | |\n\n\n\n\n|\
  \ --- | --- |\n| Bias | = 期望值与实际值之间的偏差 |\n| Variance | = 对训练集微小波动的敏感性产生的误差 |\n|\
  \ Irreducible | = 不可约误差是真实关系中的噪声项 |\n\n偏差指的是模型误差，而方差指的是模型应用于其他数据集时预测准确性的一致性 [1]。不可约误差（也称为噪声）在训练过程中无法通过任何模型从根本上减少。它有时可以通过执行更好的数据预处理步骤（通常是更好的数据清洗）来减少。不可约误差源于数据本身，而偏差和方差源于学习算法的选择。在无限训练数据的情况下，理论上可以将偏差和方差降低到\
  \ 0（渐近一致性和渐近有效性）。然而，某些学习者即使有足够的数据也无法拟合模型。例如，`linear` 无法拟合数据。如 `Figure 9.1` (`21_Chapter9.xhtml#fig_1`)所示，`perceptronron`\
  \ 显示了数据。偏差和方差是评估质量的两个标准。遗憾的是，我们无法同时减少偏差和方差，我们需要找到一个最佳平衡，如`equation 9.2` (`21_Chapter9.xhtml#eq_2`)所示。\n\
  \n偏差-方差权衡是监督学习的一个基础问题，适用于分类和回归。它是关于同时减少两种误差来源（偏差和方差）的问题。为了在偏差和方差之间找到良好的平衡，一个良好的预测模型会减少总误差。\n\
  \n![Figure 9.1: Linear fitting.](img/fig_1.jpg)\n\n**Figure 9.1: Linear fitting.**\
  \ (07_Listof.xhtml#fig_1)\n\n```\nMSE = Bias² + Variance + Irreducible || (9.2)\n\
  ```\n\n由于我们无法同时减少偏差和方差，我们需要找到一个最佳平衡，如`Figure 9.2` (`21_Chapter9.xhtml#fig_2`)所示。有几种策略管理偏差和方差。简化模型可以减少方差，例如通过特征选择或降维。此外，使用更大的训练集倾向于减少方差。\n\
  \n如前所述，不同的学习者行为往往不同，一个关键区别是它们产生的偏差和方差。这就是为什么通常会训练并评估多个学习者，以找到最适合问题的算法。另一种方法是使用集成。Bagging（自助聚合法）是一种简单而强大的集成方法。它是一种也可以减少方差的通用过程。Bagging\
  \ 是 bootstrap aggregating 的缩写，是一种重采样技术，通过有放回的随机选择创建不同的训练集（这意味着我们可以多次选择同一个实例）。每个样本用于训练一个模型。然后通过平均和多数投票组合预测值。虽然\
  \ Bagging 最初是为决策树开发的，但该思想适用于任何产生具有足够变异预测值的算法 [1]。为了获得良好的 Bagged 集成，单个模型应该是过拟合的，这意味着偏差很低。Bagging\
  \ 通过平均预测值来减少方差。Bagging 可以被视为方差消除技术。Bagging 的另一个特征是生成的模型使用整个特征空间进行节点分裂。\n\n\n\n\n\
  ![图 9.2: 偏差-方差权衡。](img/fig9_2.jpg)\n\n**图 9.2：** 偏差-方差权衡。\n\n正如提到的，管理偏差和方差本质是处理欠拟合和过拟合。应用适当的学习方法对于获得拟合良好的模型至关重要。哪种学习方法最取决于取决于因素。例如，如果可用的训练数据有限，交叉验证是一种有效的学习方法。交叉验证将可用数据分为若干子集，交替用于训练和测试，从而以优化的方式利用所有数据。降维是指减少变量数量的过程，可能用于防止过拟合。降维可以指特征选择（基本上是选择原始变量的一个子集进行训练），也可以指特征提取（即降低空间的维度）。这两种方法都可以用于防止过拟合。需要注意的是，寻找最佳拟合点在计算上通常是不可行的。\n\
  \n## 9.2 交叉验证\n\n交叉验证是一种统计方法，用于评估机器学习模型在数据数据上的泛化能力。它通常用于预测任务，以评估模型在实际应用中的表现准确性。由于其易于实现和解释，它经常用于比较和选择预测模型。其结果往往比其他模型具有低的偏差。\n\
  \n一种常用的交叉验证类型是`k-折交叉验证`。`k-折交叉验证`是一种在训练数据有限时使用的重采样程序。通常数据集被分为训练数据、验证数据和测试数据，而`k-折交叉验证`使用所有观测值进行训练和测试。基本思想是将训练数据随机分成`k`\
  \ 个等大的折，并使用`k - 1` 个折进行训练，将其留的一个折用于测试。此过程重复`k` 次，直到每个折都恰好被用于测试一次。通过这种方式，所有实例都被用于训练，每个观测值仅被用于验证一次。例如，如果\
  \ `k = 10`，它也称为`10-折交叉验证`。\n\n`k-折交叉验证`中唯一的可配置参数是`k`。通常，设置 `k = 10` 可以产生性能良好的学习器。在许多不同数据集上使用不同学习技术进行的广泛测试表明，10\
  \ 是获得最佳误差估计的合适的折数，也有一些理论证据支持这一点。然而，当重复交叉验证实验并随机选择一组新的折时，结果往往会有不同。一种方法是重复 10-折交叉验证\
  \ 10 次，然后对结果取平均。缺点是，在这种情况下学习算法被调用了 100 次，这在计算上可能是昂贵的。\n\n一种变体是`留一法交叉验证`。`留一法交叉验证`是`k-折交叉验证`的一种极端版本，其中\
  \ `k` 等于 `n`（数据集的大小）。学习器在 `n–1` 个观测值上进行训练，并对剩余的观测点进行预测。与之前一样，重复此过程直到每个数据点都被用于验证一次，并对结果取平均。这听起来在计算上很贵，但某些实现所需的计算时间并不比其他方法更多。\n\
  \n分层（Stratification）是一种经常与交叉验证一起使用的技术。分层有助于减少方差，但不能完全消除它。在使用分层时，折的选取方式确保了所有折中类别标签的分布相等，以避免标签在任何数据子集中出现过度代表或代表不足的情况。分层在第\
  \ 3.2 节中解释过。当与分层结合使用时，被称为`分层 k-折交叉验证`。例如，当用于二分类时，两个类别的比例在每个折中大致分布相等。分布或折都不需要完全精确。数据被划分为大致相等的折。`分层\
  \ 10-折交叉验证`已成为准标准方法，如果选择 `k` 导致困难，这是一个很好的起点。通常，如果将 `k` 设置为 5 或 20，结果差异并不大。\n\n##\
  \ 9.3 集成学习\n\n集成学习（Ensemble learning）从相同的数据中结合多个训练好的模型，这些模型通常是同一类别的。获取训练数据并从中推出几个不同的训练集，从每个训练集中学习一个模型并将它们组合产生学习模型的集成通常是有优势的。集成通常允许通过结合几个较弱的学习器创建一个强学习器，从而提高模型的预测性能。如果训练了几个学习方案，与其使用性能最好的那个，不如结合所有已训练学习器的结果。集成可以用于监督学习和无监督学习。\n\
  \n两种常见的集成学习技术是`bagging`和`boosting`。在`bagging`（自助聚合的缩写）中，训练了多个相似的学习器。另一种 bagging\
  \ 技术使用不同的训练数据集训练多个不同的学习器。然后通过平均或多数投票来组合结果。这有助于减少过拟合和方差。方差反映了模型的敏感性，当模型复杂度增加时，方差随之增加。高方差模型倾向于过拟合，在训练数据集之外的泛化能力不好。\n\
  \n在`boosting`中，模型是增量创建的。每个模型都在前一个模型分类错误的实例上进行训练。最流行的 boosting 算法是`AdaBoost`（自适应提升）。`AdaBoost`\
  \ 较不容易过拟合，但它对数据中的噪声或离群值敏感。它是一种潜在提高学习器性能的启发式方法。机器学习的一个问题是存在大量的特征，即高维度问题。`AdaBoost`仅通过降低维度来潜在提高模型的预测能力，从而缩短执行时间。\n\
  \n## 9.4 强化学习\n\n强化学习是一种基于奖励的学习技术。它的灵感源于自然，可以与训练狗直立进行比较，例如，当狗学会直立时它会得到 get 饼干。同样，在强化学习中，有一个奖励函数用于训练智能体如何行动。强化学习与监督学习不同，因为训练时不需要正确的输入/输出对。本质上，在强化学习中，智能体学习对环境做出反应。它被认为是独立于监督和无监督学习的学习范式。\n\
  \n![图 9.3: 强化学习。](img/fig9_3.jpg)\n\n**图 9.3：** 强化学习。\n\n\n\n\n强化学习是一种逐步进的方法，如图\
  \ 9.3 所示，在每个时间步 `t`，智能体可以从可用动作集中选择一个动作 `a`。智能体通过一系列状态-动作对，直到预测出智能体可以采取的最佳路径。该预测被建模为一个称为“策略”（policy）的映射。在每个时间步\
  \ `t`，与智能体交互的环境会在时间步 `t+1` 移动到状态 `s`，并计算转移到新状态的奖励 `r`。奖励可以是正的也可以是负的。奖励是通过奖励函数计算的，该函数将智能体的状态和动作作为输入，并映射到可能的奖励。智能体的目标是针对任何状态选择最好的动作，并收集尽可能多的奖励。动作的选择方式对学习者的性能至关重要。\n\
  \n强化学习可以与神经网络结合，并且近年来与深度学习器结合时取得了巨大成功。深度学习器是在输入层和输出层之间具有许多隐藏层的神经网络。强化学习与深度学习的结合已成功应用于许多问题，例如玩游戏、机器翻译和机器人控制。\n\
  \n## 9.5 主动学习 (#06_Contents.xhtml#sec9_5)\n\n主动学习是一种在线学习的形式，智能体通过采取行动来获取有用的示例进行学习\
  \ [31]。主动学习是一种迭代的监督学习类型，适用于数据丰富但类别标签稀缺或获取成本高昂的情况 [10]。它是学习中的一种特殊情况，学习者可以主动查询用户或其他信息源以获取标签。主动学习背后的想法是，如果学习算法能够自己选择想要学习的数据，它的表现将会更好。由于是学习者选择了呈现给用户的示例，示例的数量可以远少于监督学习所需的数量。主动学习是一种有助于自动识别具有信息量的未标记示例的方法\
  \ [23]。\n\n在主动学习中，会随机选择未标记数据的一个小子集并人工标注。根据目前为止已标注的数据，新实例被提交给用户进行标注。学习者可以从随机采样中选择优越的数据点。这一过程不断重复，直到找不到更多有用的实例为止。\n\
  \n主动学习的优势在于，算法可以选择要标注的示例，随后比从底层分布中随机选择样本的方法用更少的数据获得更好的效果。如何选择标注的数据点是研究的一个主要领域。\n\
  \n## 9.6 机器教学 (#06_Contents.xhtml#sec9_6)\n\n机器教学发生在模型不是由人类训练，而是设备之间相互通信并共享知识时。基本上，它们在相互学习。这可以是合作性的，例如自动驾驶汽车共享路况状况信息；也可以是竞争性的，例如两台机器对弈下棋。机器共享数据并为彼此创建合成经验，产生自我放大的效应。一个很大的优势是，机器教学可能跳过了对训练的需求。\n\
  \n## 9.7 自动机器学习 (#06_Contents.xhtml#sec9_7)\n\n由于数据科学家并不容易找到，人们在自动化机器学习方面付出了许多努力。然而，某些步骤仍然需要人类判断。调整学习者的超参数是通常需要的工作。超参数搜索的目标是尽可能快地找到全局最优。一些用于自动化搜索的工具包括\
  \ `TensorFlow` 的 `Vizier` 和 `Arbiter`。\n\n在有限范围内，特征选择可以是自动化的。某些特征对于问题并不一定有用。即使自动选择了特征，数据科学家仍然会查看它们以验证其相关性。特征选择通常是从零开始的。\n\
  \n模型选择涉及比较多个已训练模型的准确率。尽管如此，一个学习者可能具有良好的准确率但 `F1-score` 较差，而另一个学习者则相反，这使得选择哪一个变得并不明显。通常，机器学习应用的结果需要由人类进行评估，即该结果对于当前问题是否有用。通常，机器学习需要领域知识和对使用数据的理解，这限制了可以自动化的任务。\n\
  \n| 机器学习应用 (#06_Contents.xhtml#sec5) | V (#06_Contents.xhtml#sec5) |\n| --- | ---\
  \ |\n\n# 第 10 章 (#06_Contents.xhtml#ch10)\n\n# 机器学习应用 (#06_Contents.xhtml#ch10)\n\
  \n**目录**\n\n### 10.1 异常检测 (#23_Chapter10.xhtml#sec10_1)\n#### 10.1.1 安全性 (#23_Chapter10.xhtml#sec10_1_1)\n\
  #### 10.1.2 预测性维护 (#23_Chapter10.xhtml#sec10_1_2)\n\n### 10.2 生物医学应用 (#23_Chapter10.xhtml#sec10_2)\n\
  #### 10.2.1 医学应用 (#23_Chapter10.xhtml#sec10_2_1)\n\n### 10.3 自然语言处理 (#23_Chapter10.xhtml#sec10_3)\n\
  #### 10.3.1 文本挖掘 (#23_Chapter10.xhtml#sec10_3_1)\n情感分析（第 10.3.3.1a 章）\n\n### 10.4\
  \ 其他应用 (#23_Chapter10.xhtml#sec10_4)\n\n机器学习几乎适用于每一个领域。无论是在金融、科学还是学术界，只要需要分析大量数据或需要许多复杂的规则，就应该考虑使用机器学习。应该注意的是，尽管机器学习具有多功能性，但它并不是任何类型问题的解决方案，也绝不是万灵妙药。如果可以使用简单的规则进行预测，那么可以在不使用机器学习的情况下开发出稳健的解决方案。\n\
  \n\n\n\n- 数据足够且数据质量足够良好\n- 项目有明确的目标\n\n当存在大量数据且存在真值（ground truth）时，机器学习就能良好运行。近期的技术发展，如物联网（IoT）、移动设备和云计算的出现，可能会产生不断增长的数据量。机器学习提供了有效分析所产生的海量数据的功能，可以预见，机器学习的重要性在未来将会增加。机器学习技术已经包含在许多手机和物联网解决方案中，并将无缝地集成到未来的许多应用中。本章概述了机器学习的应用，但远非详尽的。\n\
  \n## 10.1 异常检测\n\n机器学习最常用的应用之一是异常检测。异常检测指的是一系列不寻活动，例如欺诈性银行交易、网络安全违规或暗示机器即将发生故障的异常传感器数据。\n\
  \n日益数字化的世界和物联网的出现产生了不断增加的交易数据和传感器数据。数字化的主要目标是提高生产力和效率，并最终降低成本。机器学习被用于识别与优化容量相关的数据点和模式，也被用于检测那些由于偏离大多数数据而可疑的观测值。偏离数据通常由某些问题引起，例如银行欺诈、设备故障、网络入侵或医疗问题。\n\
  \n有不同的方法来识别异常数据点。在某些简单的情况下，可以使用数据可视化，例如检测位于正常数据分布之外的离群值。然而，通常不是仅凭一个变量就能让我们发现异常，而是多个变量的组合或需要识别的模式。\n\
  \n检测异常最简单的方法是验证某些值（如传感器数据测量值）超出范围。如果超过了某些阈值，就会发送报警。这种方法的问题在于存在高误报率的风险，或者某些异常未被检测到。通常，我们在确定设备健康状况时，不能单独考虑单个传感器值，我们需要考虑传感器值的组合，换句话说模式。\n\
  \n### 10.1.1 安全\n\n异常检测的一个问题是，异常可能是未见的，并且没有可以反映该异常的历史数据。例如，不断检测到以前未知的安全威胁，因此，机器学习算法无法在现有数据上进行训练。零日漏洞就是这样一种未知或未处理的安全漏洞，可以被黑客利用。由于目前还没有来自未知漏洞或安全泄露的数据，与其训练一个机器学习方案来检测网络流量中的异常，不如训练训练学习器来识别正常网络流量的什么样。如果它检测到某些偏离流量，它就会发出报警，安全专家可以分析可疑流量。什么是偏离流量取决于通过网络传输的内容。例如，如果网络被用于金融交易，异常可能是转账金额异常高或向不寻常的国家进行转账。当我们拥有一组网络流量数据点集合时，它们通常具有特定的分布，例如高斯分布。为了检测异常，我们首先从数据点中计算概率分布\
  \ `p(x)`。对于每个新数据点 `x`，计算它属于该概率分布的概率并与阈值进行比较。如果 `p(x)` 小于阈值，则 `x` 被视为异常。正常数据点往往具有较大的\
  \ `p(x)`，而异常数据点往往具有较小的 `p(x)`。\n\n### 10.1.2 预测性维护\n\n预测性维护用于监测设备的健康状态。它通过判断部件或整个机器是否即将故障并需要维护，帮助避免生产现场昂贵的停机。现代机器配备了收集数据，如温度、湿度、振动或其他值，取决于设备的类型。通过分析传感器值，可以确定材料疲劳或磨损等问题，并在整个机器甚至整个生产现场故障之前更换受影响的部件。例如，航空公司无法在他们降落的每个机场都设有备件仓库，特别是对于昂贵的部件，如耗资数百万的发动机。他们需要提前知道飞机是否需要维护。现代客机在机翼和发动机上配备了数千个传感器，以便早期检测技术问题。可以在需要时订购零件，无需维护仓库。这被称为智能物流，因为它优化了备件的物流和维护人员的调度。服务技术人员可以提前安排并在需要时部署。技术问题的早期检测和避免也被称为预测性和预防维护。智能物流和预防维护是物联网的两个主要应用领域和驱动力。\n\
  \n预测性维护的一种解决方案是使用 10.1.1 节描述的方法，并判断数据点是否属于概率分布。另一种方法使用自编码器。自编码器在 8.6 节中描述过。自编码器创建传感器值及其相关性和交互的低维表示，并将其重构回原始值。自编码器在代表正常运行状态的正常传感器数据上进行训练。如果监测的设备老化，变量之间的相互作用发生变化，导致重建输入值的误差增加。我们使用重建误差的概率分布来判断数据点是否正常，或者我们是否有异常。\n\
  \n## 10.2 生物医学应用\n\n### 10.2.1 医学应用\n\n机器学习在制药和医学领域找到了巨大的应用领域。它被用于辅助医生识别和诊断疾病、药物发现寻找新药或用于个性化治疗。\n\
  \n机器学习方法，特别是 8.2 节中描述的卷积神经网络 `CNN`，已成功应用于分析医学图像，如 CT 扫描、X 光和 MRI 扫描。分析医学图像是耗耗时的，并且始终存在忽视医疗问题的危险。卷积神经网络可以检测图像中肉眼隐藏的病理性异常。卷积神经网络已用于阿尔茨海默症或纤维化等疾病的早期检测。它们还用于将图像或组织样本分类为恶性或良性肿瘤。\n\
  \n\n\n\n机器学习在远程监控和诊断方面也具有巨大的潜力。患者可以拍摄伤口或可见症状的照片，并将其上传到医疗机构的服务器，医生可以查看照片并使用机器学习进行诊断和开处方。远程监控不仅限于图像。来自健康追踪器的数据（如血压或血糖水平）也可以进行传输。机器学习可以显著改善医疗保健，因为它允许需要定期看医生或需要静止治疗的患者能够接受远程监控，让他们过上更独立的生活。由于所有工业化国家都面临人口快速老龄化和医疗成本不断增长的挑战，远程监控和治疗是电子健康（eHealth）中机器学习的一个重点。\n\
  \n在许多情况下，个性化治疗仍然局限于负担得起的人。基于遗传材料和症状，预测分析可以帮助规模化提供个性化治疗。例如，由于肿瘤已经产生适应性导致化疗不再有效，则需要进行相应的调整。机器学习是个性化治疗的主要推动者，因为它不仅能够分析海量数据，还能关联不同类型的数据，例如白细胞水平和遗传信息。使用预测分析进行疾病评估和管理，有助于医生选择正确的治疗方案，并在某些数值变化时快速进行调整。\n\
  \n## 10.3 自然语言处理\n\n理解人类语言仍然是计算机科学中的主要挑战之一。自然语言是人类说话和书写的语言，而利用算法从文本或演讲中提取信息的尝试被称为自然语言处理或\
  \ `NLP`。自然语言处理涵盖了理解人类语言（例如理解智能手机上的语音命令）以及生成自然语言（例如为视障人士读取网页的文本转语音应用）。自然语言处理可以追溯到\
  \ 20 世纪 50 年代机器学习的初期，当时艾伦·图灵（Alan Turing）写了一篇名为《计算机器与智能》的开创性论文。在这篇论文中，图灵提出了一个“模仿游戏”（imitation\
  \ game），提问者需要通过提问来确定一个看不见的男人和一个女人的性别。如果其中一个不可见的人被计算机取代，且提问者无法再判断自己是在与人还是计算机对话，那么计算机就可以产生人类的认知能力。这现在被称为图灵测试。\n\
  \n研究和实践中对自然语言处理有着浓厚的兴趣，因为它简化了人机交互；然而，目前自然语言处理的能力仍有局限。机器能够理解口头指令或确定文本的主题，但对人类来说，一个句子或文本是有意义的，对机器来说，它只是一个字符数组。机器不理解上下文，这使得词义消消除成为一项棘手的任务。单词“meeting”可以是名词，如“we\
  \ are in a meeting”（我们正在开会），也可以是动词，如“we are meeting in my office”（我们将在我的办公室见面）。\n\
  \n### 10.3.1 文本挖掘\n\n文本挖掘或文本分析旨在自动从文本中提取信息。文本挖掘的应用数不胜完。文本挖掘用于文本分类、文本聚类、文档摘要或意见挖掘，但也存在许多其他用例。我们已经涵盖了垃圾邮件过滤，这是文本分类的一种应用。邮件被分为合法邮件和垃圾邮件。\n\
  \n#### 情感分析\n\n情感分析也称为意见挖掘，是一项分析人们对产品、服务、组织、个人、问题、事件、主题及其属性等实体的观点、情感、评价、鉴定、态度和情绪的研究领域。公司广泛使用情感分析来确定产品或服务的受欢迎程度，以便进行改进。它也被用于政治领域，预测选举结果或确定电视节目或剧集的流行程度。随着社交媒体（如\
  \ Twitter 或 Facebook）的出现，任何人在互联网上发布对电影或新产品的观点都变得非常简单。因此，分析社交媒体已成为许多领域的主流。社交媒体挖掘用于个性化广告或目标营销活动。它还被用于判断个人的信誉状况。如果一个贷款或抵押贷款的申请人有很多富有\
  \ Facebook 朋友，他很可能也很富有并被认为具有信誉。\n\n情感分析使用自然语言处理方法来确定文本中的观点或情感。我们已经见过“词袋模型”（bag-of-words）方法。统计情感词，如“great”（极好的）、“excellent”（优秀的）和“poor”（糟糕的）。如果一个文本包含许多正面情感词，或者正面情感词多于负面情感词，它被视为正面评价。然而，词袋模型只考虑单个单词，无法处理情感极性反转器（sentiment\
  \ polarity shifter）。情感极性反转器会将表达的意思改变为相反。例如，“the new Tesla is great”（新款特斯拉非常棒）是一个正面陈述，而“the\
  \ new Tesla is not great”（新款特斯拉并不棒）是负面的。在这里，单词“not”充当了极性反转器。我们已经在 4.1.2 节中见过词袋模型，例如用于朴素贝叶斯垃圾邮件过滤。我们还见过一种更复杂的方法，使用\
  \ n-grams 来捕捉单词之间的关系。使用 `tokenizer`（分词器）将文本分割为单词序列。如果我们有两个单词的序列，它们被称为双元词（bigrams），我们分析单词\
  \ `X` 之后跟随单词 `Y` 的频率，就可以确定它们之间的关系。现在的一种方法是统计双元词并对双元词进行频率分析。如果我们有很多如“not great”（不棒）或“very\
  \ bad”（非常糟糕）之类的双元词，该文本被视为负面评价。\n\n神经网络，特别是深度学习，已用于情感分析。深度学习的一个巨大优势是它们自动提取特征的能力，正如我们在第\
  \ 8 章看到的。在使用浅层学习器（如多层感知器）时，我们必须手动提取特征。特征可能是单词的词性标记。在词性标记中，我们根据单词与文本中相邻及相关单词的关系，为该单词分配特定的词性。单词被识别为名词、动词、形容词等，以进行词类消歧。例如，单词“fly”当它是名词时指“昆虫”，当它是动词时指“飞行”。在分词和词性标记之后，提取词根（如果存在），并根据词根对单词进行分组，这一过程被称为词干还原（lemmatization）。单词“had”、“has”和“having”被归在一起，因为它们有相同的词根“have”。词元通过基于词根的单词组扩展了特征集。使用深度学习，这些步骤（如词干还原和词性标记）会自动完成的，这相对于浅层方法是一个巨大的优势。然而，深度学习需要大量的训练数据，而这些数据并不总是可用的。\n\
  \n## 10.4 其他应用\n\n\n\n\n机器学习有许多应用，无法在一个章节或一本书中完全涵盖，但机器学习应用的一个显著领域是军事。无人机监视会产生海量数据，这些数据需要在大潜在敌人消失之前进行快速分析。例如，美国国防部专门建立了一个`Algorithmic\
  \ Warfare Cross-Functional Team (AWCFT)`，以便在整个行动执行过程中更有效地整合人工智能和机器学习，从而保持对能力日益增强的对手和竞争对手的优势\
  \ [42]。根据建立该团队的备忘录，通过人工智能，`Project Maven` 最初将为目标检测、分类和警报提供视觉算法。谷歌为五角大楼提供了其 `Tensor-Flow`\
  \ 机器学习框架的特殊 API，用于分析来自无人机的图像。谷歌正为五角大楼的 `Project Maven` 提供人工智能，该项目旨在通过自动分类`MQ-9 Reaper`无人机拍摄的对象和图像来加速视频片段的分析。其目标是让无人机自动攻击军事目标。最终，目标是开发自主系统（例如无人机和其他空中战术区域系统），这些系统能够进行独立攻击。\n\
  \n如前所述，机器学习可以用于分析和响应网络攻击。机器学习已用于网络安全领域，检测网络流量中的异常和恶意软件。然而，机器学习也可以用于创建恶意软件。开发恶意软件、木马、勒索软件或恶意脚本对于网络罪犯来说，在很大程度上是一个手动过程。机器学习可以自动化这一过程或显著提高其速度。基于生成对抗网络（GAN）的算法已经被提出\
  \ [12]。机器学习可以生成传统入侵检测系统无法检测的恶意软件。恶意软件作者通常无法访问恶意软件检测系统所使用的机器学习模型的详细结构和参数，因此，他们只能进行黑盒攻击\
  \ [12]。通过使用机器学习，他们可以随时修改代码并适应检测系统，从而形成多态恶意软件。他们还可以投毒检测系统的机器学习引擎，就像病毒对 `AntiVirus`\
  \ 软件所做的那样。更复杂的攻击使用僵尸网络和群智能。集群是一个去中心化的、自组织的系统。通过互联网连接的机器人形成了一个僵尸网络。僵尸网络中的计算机群在未经所有者许可的情况下，跨越网络发送垃圾邮件或病毒\
  \ [43]。自学习集群机器人形成蜂巢网络（hivenet）。蜂巢网络共享信息以创建定制攻击。例如，它们可以攻击公司网络中的任何访问点。机器人可以运行在任何连接互联网的设备上，手机、婴儿电话、电视盒或音箱。\n\
  \n物联网（IoT）是互联网的演进，将冰箱、传感器或执行器等日常物体连接到互联网并能够与其他设备通信。物联网是互联网向物理世界的延伸。技术的进步使得智能物体能够识别、定位、感知和连接，从而导致了人与物、物与物之间新的通信形式\
  \ [6]。物联网产生大量数据，只有当数据能够被有效分析时才有用处。物联网为机器学习提供了一个全新的应用领域。物联网启用设备产生的数据可以是任何形式：数值数据、流式数据、文本数据或二进制数据。\n\
  \n### 云计算与边缘计算\n物联网设备产生的数据可以是任何形式：数值数据、流式数据、文本数据或二进制数据。数据被传输到云端，在云端为终端用户进行分析和可视化。云计算已成为向消费者交付内容的客观标准平台\
  \ [9]。物联网可以连接整个生产厂的所有设备，以监控其健康状态并判断设备或部件是否需要维护。通常，由于带宽限制或云端存储有限，将所有数据传输到云端是不可行的。所有物联网技术的无缝集成，结合\
  \ `IPv6` 和语义服务，使该行业处于一个过早的状态 [29]。无线技术的重大进展、射频识别（RFID）以及电池技术的改进实现了物联网，但有效分析数据仍然是一项挑战。通常，数据在靠近物理设备的系统上进行预处理和分析，只将汇总数据发送到云端。这被称为`边缘计算`。数据分析软件部署在`边缘计算`上。边缘计算支持机器学习，通常也支持深度学习。`边缘计算`根据[10.1.2\
  \ 节](#23_Chapter10.xhtml#sec10_1_2）所述，通过预测性和预防性维护监控连接设备的潜在问题。如果它判断设备需要维护，它会向云端发送警报，在那里可以指派维修人员来解决问题。通常，会部署多个边缘计算，每个计算机监控和分析不同的设备。云端的数据挖掘系统分析从不同边缘计算传输的汇总信息。这被称为`分布式分析`。分布式分析将工作负载分散到多个节点（即`边缘计算`）上。这被称为`雾计算`或`雾网网络`，其中连接的边缘计算网络承载了大量的计算和存储。这使得能够快速地洞察连接设备的健康状况。理想情况下，边缘计算可以相互通信并进行协作机器学习。\n\
  \n### 总结\n基于机器学习的物联网解决方案不仅限于预测性和预防性维护。它们可用于优化工厂的生产，节省能源或原材料等资源并减少浪费。\n\n\n\n文献中对于人工智能并没有统一的定义。但总的来说，人工智能描述的是通常在计算机上由人类完成的任务。然而，机器执行人类任务的方式与人类执行的方式在本质上是不同的，在许多任务中人类仍然处于优地位。无论是孩子学习区分猫狗，还是老年人学习纸牌游戏的规则，人类都拥有无比拟的学习能力。孩子只需看一眼猫，就知道猫是什么，无论体体大小或毛色颜色如何。而机器学习方案则需要在数千张处于不同位置、不同年龄的猫的图像上进行训练，才能识别具有不同毛纹模式的猫。\n\
  \n人类非常擅长将看到的事物进行分类。这对于我们的生存至关重要。远古人类在狩猎时必须能够快速区分敌人和猎物。同样，我们需要能够区分潜在的危险交通状况和正常状况。由于我们不断地遇到新的交通状况，我们必须能够快速评估它们是否具有潜在危险。我们在街道上看到很多被忽略的车辆，但突然之间，所有的注意力都会集中在某辆做出奇怪动作的车辆上。目前，人类如何潜意识地决定哪些信息是相关的很大为人未知。这是自动驾驶汽车必须解决的重大挑战之一。\n\
  \n在过去的几十年里，在揭示人类学习在分子水平如何运作方面取得了巨大进展。近年来，神经科学对记忆是如何形成的有了相对深入的理解。学习和记忆形成与脑细胞之间连接的增强和削弱有关。频繁交互的神经元形成纽带，使它们之间能够更容易、更准确地传递信息。形成鲜明对比的是，我们对这些相同记忆如何维持的理解非常有限\
  \ [27]。\n\n我们如何回想过去的片段并在脑海中像电影一样重放它们，很大为人未知。编码和检索我们日常个人经历的能力被称为情景记忆，它由内侧颞叶（MTL）电路的支持，包括海马体，海马体与许多特定的分布式皮层和皮层下结构广泛相互作用\
  \ [5]。人类大脑中有三个区域涉及显性记忆存储：海马体、新皮层和杏仁核。目前尚不清楚记忆是如何被存储的。一些研究表明，学习会修改 DNA [27]。表观遗传机制可能在突触塑性和记忆形成中起着重要作用\
  \ [20]。DNA 是人体中最稳定的记忆位置，因此是保留信息的逻辑场所，但这纯粹是推测。\n\n人类也会遗忘事物。遗忘的能力是为了保护我们免受信息过载的影响。记忆分为三个存储区域：存储感觉信息的感官记忆、短期记忆（STM）和长期记忆（LTM）。感官记忆极短，仅保留信息几秒钟。短期记忆正如其名，存储信息的时间很，通常在\
  \ 20 到 30 秒之间。如果信息经过复述，它会被保留得更久，并可能变成长期记忆。大脑如何过滤它保留的信息以及它如何决定遗忘哪些信息，目前尚不清楚。我们可能记得去年的一场争吵，但只模糊地记得几周前的一次对话。在这里，我们仍然不知道大脑认为哪些信息是值得保留的，而它又忘记了什么。一场激烈的争吵可能更值得存储，因为它们可能比关于天气的对话产生更大的后果，但这种过滤器是如何工作的，我们并不可知。\n\
  \n这些未知因素是人工智能和机器学习中的巨大挑战。当我们不知道某事在现实生活中如何运作时，如何在计算机上模仿它呢？即使我们对人类学习和记忆运作的许多方面仍然一无知，但在尝试模仿它时，我们学会了大自然为了赋予我们这些能力必须解决哪些问题。通过模仿生物机制来学习有助于我们更好地理解当前的问题，即使我们找到的解决方案与自然界中的解决方案非常不同。\n\
  \n为了推进人工智能和机器学习，我们需要两者：对生物机制更深入的理解，以及尝试模仿它们的改进实现。机器学习是一个跨学科的研究领域，预计我们将看到更多研究人员相互合作，以汇聚不同领域的知识。语言学家将与数据科学家合作以改进文本挖掘能力，神经生物学家将与计算机科学家和机器人专家合作，以提高机器人和自主系统的技能。工业界和学术界已经出了许多努力，因为改进系统有助于我们提高生产场所或交通效率，并减少能量消耗和排放。机器学习有望降低医疗服务和老年护理成本，提高道路和工作场所的安全措施，这只是几个应用领域。我们可能还会看到尚未想过的新应用领域。\n\
  \n## 11.1 研究方向 (#06_Contents.xhtml#sec11_1)\n\n目前，机器学习算法是针对单一任务训练的，例如将文本从一种语言翻译成另一种语言，或者引导机器人或自动驾驶汽车。这与人类智能形成对比。人类可以读写、计算、踢足球、唱歌和弹钢琴。目前正在进行大量研究来开发能够学习不同任务的算法。这一研究领域被称为通用人工智能（AGI），与人工人工智能（ANI）相反。AGI\
  \ 的目标是执行人类可以完成的任何智力任务。与其说开发一个可以学习任何内容的单一系统，我们可能会看到多个系统协同工作进行协作学习。目前已经有可以部署多个学习者的系统，例如，一个训练用于将英语翻译成俄语的系统，另一个训练用于将英语翻译成德语的系统。这些机器学习引擎的优势在于它们可以模块化的方式构建和增强，例如添加新语言或新功能（如文本转语音功能）。模块化系统更容易维护和测试。\n\
  \n\n\n\n物联网（IoT）为机器学习提供了一个全新的应用领域。物联网以高速度产生了海量的、不同格式的异构数据。物联网系统也是是动态的，因为可以添加或移除新的传感器，整栋建筑可以相互互连以实现智能建筑控制，而且整个生产现场都可以进行布线。因此，机器学习系统也需要进行增强，以分析新连接的机器人或安全系统的数据。与其使用新连接系统的数据重新训练机器学习方案，不如通过新模块来增强机器学习引擎，但新连接的生产现场可能已经有了一套数据挖掘系统。该数据挖掘系统必须集成到可能使用不同技术的现有解决方案中。机器学习引擎将需要集成能力，以便使用多种技术进行协作学习。\n\
  \n更好的解决方案可能是一个持续学习系统。与其对机器学习引擎进行训练、测试和部署，它可以从新数据中持续学习，而无需重新训练和重新部署。这种系统需要在新类型的数据到达时，自动执行预处理、特征提取、学习和评估任务。这种系统被称为自动机器学习系统。自动机器学习系统能够能够在无人工干预的情况下，自动完成从数据预处理到分析的端到端过程。目前全自动机器学习系统尚不存在，但由于显而易见的原因，自动机器学习是一个活跃的研究领域。如果它们能自己执行繁琐的任务，成本会更低，速度也更快。无监督学习可能会是自动机器学习的首选方法，因为不需要标记数据。此外，在自然界，大多数学习都是无监督的。未来的大多数学习可能可能是持续的、无监督的学习。\n\
  \n我们最近在机器学习领域看到的进展，在很大程度上归于硬件发展的进步。特别是 GPU 的发展为高效执行机器学习算法提供了算力支持。今天，芯片已专门为机器学习和人工智能而开发。硬件发展的下一次演进很可能是量子计算机。量子计算将显著加速计算操作，并在数量级上提高学习算法的训练速度并短机器学习算法的执行时间。\n\
  \n训练好的机器学习系统的“黑箱”方法引起了社会不安，例如机器人突然袭击人类，或自动驾驶汽车在不清楚谁承担责任的情况下发生事故等场景正在媒体上流传。这些恐惧许多目前都是没有根据的。首先，目前还没有此类先进的系统可用；其次，将完全控制权交给机器是不符合愿望的。没有公司希望将自己的安全交给机器。没有医生会让机器诊断他的患者。机器学习将支持许多专家，例如检测网络安全漏洞或医学图像中的异常，但陆军将在战争中部署不可控的机器人是不可能发生的场景。即使机器学习引擎在自己做决策，只要机器不能清晰地证明并解释它们的行为，对应该做什么最终选择仍将留在人类手中。\n\
  \n机器学习方案能够确定文本的主题或传感器数据中的异常，但它们并不理解文本的上下文，或者为什么某个传感器值是不正常的。机器学习引擎能够理解上下文和含义，还需要更多的研究。当学习者确定一本书是关于第二次世界大战时，它仍然不理解其在人类历史中的背景。如果机器学习方案检测到异常，它并不理解异常的后果。人工智能系统应该能够解释其结论，最终，它应该能够进行推理。然而，按照目前的研发速度，我们看到此类系统还有很长的路要走。\n\
