  \n# 第 2 章 机器学习基础\n\n\n## 2.1 监督学习\n\n## 2.2 无监督学习\n\n## 2.3 半监督学习\n\n## 2.4 函数近似\n\
  \n## 2.5 生成与判别模型\n\n## 2.6 评估：偏差与方差\n\n机器学习是关于智能体在环境中通过最大化某些奖励进行的行为。监督、半监督和无监督学习方法用于分类。图\
  \ 2.1 显示了分类方法。\n\n![图 2.1 机器学习领域](img/fig2_1.jpg)\n\n**图 2.1 机器学习领域**\n\n机器学习主要试图模仿人类，基于数据进行预测。对于监督方法，需要标签数据。标签数据是用于训练的。算法将学习数据与数据之间的关系，这使得评估变得更具挑战性。\n\
  \n- 朴素贝叶斯\n- 决策树\n- 神经网络（多层感知机）\n- 线性回归\n- 逻辑回归\n- 支持向量机\n- K 近邻\n\n常见的无监督方法包括：\n\
  - 主成分分析 (PCA)\n\n分类并不是互斥的，因为某些学习方案可以用于任务。例如，人工神经网络可以用于\n\n## 2.1 监督学习\n\n监督学习需要标记数据进行训练。训练样本称为数据点或实例，由输入和输出对组成(`x,\
  \ y`)。`y` 是输入 `x` 的输出或真实值。与监督学习相反，在无监督学习中，数据只提供输入。训练样本形成了数据集。训练数据集称为金标准数据，尽可能接近真实。训练集用于产生预测函数\
  \ `f`（也称为决策函数），该函数将输入 `x` 映射到 `y`。目标是产生一个能够处理训练之外示例的预测器。换句话说，`f` 需要泛化能力。`f` 在未见数据上提供近似。输入\
  \ `x` 是特征向量或协变量，输出 `y` 是响应。特征向量 `ϕ(x)` 是特征名称到特征值的映射，即字符串到双精度浮。特征向量 `ϕ(x) ∈ ℝ` 是一个实向量\
  \ `ϕ(x) = ϕ[1, ϕ2, … ϕn]`，其中每个分量 `ϕi`（`i = 1, … n`）表示一个特征。特征向量由特征提取器 `ϕ` 计算，可以被视为高维空间中的一点。特征向量中的特征可以加，这意味着每个特征对预测都有贡献。权重是一个与特征值相乘的实数。权重表示在独立的向量中，因为我们希望有一个适用于任何输入的单一预测器。给定特征向量\
  \ `ϕ(x)` 和权重向量 `w`，我们通过两者的内积计算预测分。我们预先不知道向量 `w` 中的权重，它们是在训练过程中学习的。\n\n\n\n如果我们尝试将数据分为不同的类别，例如将医学图像分类为健康组织或病理组织，我们就面临一个分类问题。分类具有离散的输出，例如“真”或“假”，或“0”或“1”。如果只有两个类别，就是一个二分类问题。通常，输出是概率，例如，一封邮件是垃圾邮件的概率为\
  \ 80%。换句话说，输出的二元性并不是强制性的。\n\n 如果有更多类别，例如使用李克特量表的餐厅评论，如图 2.2 所示，它就是一个多分类问题。\n\n![图\
  \ 2.2: 李克特量表。](img/fig2_2.jpg)\n\n**图 2.2：** 李克特量表。\n\n如果我们有一个二分类问题，我们正在寻找一个函数 `f`，它可以将输入\
  \ `x`（例如电影评论）分类为“正面”和“负面”评论，如方程 2.1 所示。\n\n| `x→f→y∈{+1,−1}` | (2.1) |\n| --- |\
  \ --- |\n\n其中\n\n| `x` = 电影评论 |\n| --- | --- |\n| `y` = +1 ≡ 正面；−1 ≡ 负面 |\n\n从技术上讲，如果标签是\
  \ `+1` 和 `−1`，它可以被视为一个回归问题。如果我们有一个多分类问题，`y` 是一个类别。例如，预测明天的天气是一个多分类问题，类别可以是“晴天”、“雨天”、“雾天”等。如果我们想预测明天会下多少雨，我们就面临一个回归问题。回归具有连续输出。\n\
  \n其他预测任务包括排序和结构化预测。例如，预测谁将赢得马拉松，谁将获得第二和第三名等，如方程 2.2 所示，这是一个排序问题，`y` 是一个排列。\n\n|\
  \ `1,2,3,4→f→3,4,1,2` | (2.2) |\n| --- | --- |\n\n结构化预测预测的是结构化对象而非真实或离散值。在结构化预测中，输出是由部分构建的，例如翻译，其输出（翻译成另一种语言的内容）是由目标语言中的单词构建的。结构化预测在自然语言处理（NLP）、语音识别和计算机视觉中具有广泛的应用，仅限于此。\n\
  \n### 2.1.1 感知机\n\n感知机是一种简单的神经网络，由 Rosenblatt 于 1958 年提出，成为机器学习历史上的一个里程碑 [10]。它是最老的机器学习算法之一。感知机由单个神经元组成，是一个二分类器，可以将一个输入\
  \ `x`（一个实值向量）线性分离为单个二分类值。\n\n![图 2.3: 感知机。](img/fig2_3.jpg)\n\n**图 2.3：** 感知机。\n\
  \n存在不同类型的感知机。感知机执行三个步骤：\n\n1. 输入乘以权重\n2. 对输入值求和\n3. 将输出传递给激活函数\n\n使用激活函数方程 2.3 计算输出：\n\
  \n```\nf(x) = wx + b\n```\n\n| `f(x) = wx + b` | (2.3) |\n| --- | --- |\n\n其中\n\n\
  | `w` = 权重 |\n| --- | --- |\n| `x` = 输入 |\n| --- | --- |\n| `b` = 偏置 |\n\n感知机只返回\
  \ 0 或 1。换句话说，它是一个二分类器。它只能线性分离数据点。数据点可以被视为平面上的一个点。输入向量表示点的坐标。感知机使用直线将数据点分离为两组，如图\
  \ 2.4 所示。例如，我们可以将医学图像分为正常组和病理组。然而，并不是所有的二分类问题都是线性可分的。图 2.4 中坐标系中的点无法线性分离。其他机器学习算法，如多层感知机或支持向量机，能够非线性地分离数据点。在训练期间，感知机学习在哪里放置分离线。存在无限可能的决策边界，如图\
  \ 2.6 左所示。感知机无法区分不同的分离线。一类被称为间隔分类器的机器学习算法还会考虑数据点与决策边界之间的距离。支持向量机属于这一类。\n\n![图 2.4:\
  \ 线性可分与不可分的数据。](img/fig2_4.jpg)\n\n**图 2.4：** 线性可分与不可分的数据。\n\n感知机可以具有不同类型的激活函数。激活函数定义了感知机的输出。它简单的形式是阶跃函数，此时感知机触发或不触发。如果神经网络需要超越线性分离，则需要多个感知机。激活函数可以具有曲线形式，如图\
  \ 2.5 右侧所示。这类激活函数被称为 sigmoid 激活函数，能够以不同的速率触发。随着输入的增加，它以越来越快的速率触发。我们将在后面的章节中看到其他类型的激活函数，如常用于深度学习者的整流激活函数。\n\
  \n\n\n\n\n并不是图 2.6 中的所有数据点都由决策边界正确分开。某些点位于线的错误侧。这反映了机器学习算法通常返回的是近似值，而不是完美的分割。一个能够完美分离训练数据点的分类器在新数据上的表现通常并不良好。学习器需要进行泛化，以便处理训练数据以外的数据。否则，我们就会得到一个过拟合的学习器。\n\
  \n![图 2.5：激活函数。](img/fig2_5.jpg)\n\n**图 2.5：** 激活函数。\n\n![图 2.6：线性与非线性拟合。](img/fig2_6.jpg)\n\
  \n**图 2.6：** 线性与非线性拟合。\n\n图 2.6 中的平面只有两个维度。当特征多于一个时，需要超过两个维度的坐标系。这取决于输入向量以及所使用的学习器。为了更好的演示性，即使可能或需要更多维度，我们通常也只使用两个维度。\n\
  \n## 2.2 无监督学习 (#06_Contents.xhtml#sec2_2)\n\n在监督学习中，我们有输入数据和输出数据。在无监督学习中，我们没有标记的训练数据。换句话说，我们只有输入数据，没有输出数据，即没有\
  \ `y`。我们不是预测或近似变量，而是尝试将数据分为不同的类。例如，我们有一群网商店用户，试图将其分为不同类型的买家。这些类型可以是社交购物者、生活狂热者和疏离内向者。在这种情况下，我们有三个簇。如果一个观测点只能属于一个簇，它就是排他性类；如果允许属于多个簇，它就是非排他性类，换句话说，类是可以重叠的。\n\
  \n令 `N` 为 `d` 维特征空间中的一组未标记实例 `D = x[1],x[2], …, x[N]`，在聚类中，`D` 被划分为若干个不交的子集 `D[j]`：\n\
  \n| $D = \\cup\\_{j = 1}^{k}D\\_{j}$ || (2.5) |\n\n| --- | --- |\n\n其中\n\n`D[i]\
  \ ∩ D[j] = ∅`\n\n`i ≠ j`\n\n每个子集 `D[j]` 中的点根据给定的标准 ∅ 相互相似。相似性通常通过某些距离度量表示，例如欧几里德距离或曼哈顿距离。\n\
  \n聚类分析可以通过根据相似性将数据集分为若干类，从而理解其底层结构。将相似的对象归为具有概念意义的类有许多应用。例如，我们将动物分为类，如啮齿类、犬科动物、猫科动物、反刍、有袋动物等。聚类还用于信息检索，例如将搜索结果分为新闻、社交媒体、论坛、营销等。每个类别可以进一步分为子类别。例如，新闻分为政治、经济等。这种过程被称为层次聚类。人类甚至儿童擅长将对象归入相应的类。这对于人类理解周围的世界至关重要。聚类还可以作为离群值检测的中间步骤。\n\
  \n### 2.2.1 k-means 聚类 (#06_Contents.xhtml#sec2_2)\n\nk-means 聚类是最流行的机器学习算法之一。k-means\
  \ 聚类属于基于质心的类。质心本身不需要是一个观测点。图 2.7 显示了具有 3 个簇的 k-means 聚类。在这里，聚类的标准是距离。在基于质心的聚类中，`n`\
  \ 个观测值被分为 `k` 个簇。\n\n在 k-means 聚类中，需要预定义簇的数量 `k`，这有时是一个问题，因为可能未知。例如，在生物学中，如果我们根据特征对植物进行分类，可能不知道有多少种植物。其他的聚类方法（如层次聚类）不需要假设簇的数量。此外，没有绝对的标准；必须由用户定义以便聚类结果符合分析任务的目标。质心也称为重心。质心是几何平面的几何中心。\n\
  \n**图 2.7：** k-means 聚类。\n\n人类和动物主要通过经验学习，而不是从标记数据学习。人类通过观察发现世界，而不是被告知每个物体的标签。因此，人类学习很大程度上是无监督的。这就是为什么一些作者认为无监督学习未来将比监督学习更重要\
  \ [18]。\n\n## 2.3 半监督学习 (#06_Contents.xhtml#sec2_3)\n\n半监督学习结合了标记和未标记数据。它通常用于具有少量标记数据和大量未标记数据的情况。由于半监督学习仍然需要标记数据，因此它可以被认为是监督学习的一个子集。然而，除了分类之外，其他的部分监督形式也是可能的。\n\
  \n\n\n\n有很多不同的半监督训练方法。在分类中使用无标记数据的最早想法很可能是自学习（self-learning），它也被称为自训练（self-training）、自标记或决策引导学习\
  \ [4]。自学习的基本思想是使用标记数据集来训练学习算法，然后使用训练好的学习器迭代地对无标记数据块进行标记，直到所有数据都使用伪标签完成标记。然后，使用训练好的学习器通过自身的预测进行重新训练。自学习面临的风险是，伪标记数据可能对学习器没有影响，或者在不知道自学习基于什么假设的情况下发生了自标记。使用半监督学习的核心问题是：在什么情况下，考虑无标记数据有助于提高准确率？在最坏的情况下，无标记数据会降低预测准确率。\n\
  \n## 2.4  函数近似\n\n函数近似（Function approximation, FA）有时与回归等用。回归是近似给定数据集的一种方法。函数近似可以被视为一个更通用的概念，因为有很多不同的方法来近似数据或函数。函数近似的目标是找到一个函数\
  \ `f`，将输入映射到输出向量。该函数是在定义的类中选择的，例如二次函数或多项式。例如，方程 4.14 是一个一次多项式方程。与函数拟合（function fitting，即对一组数据点拟合曲线）相反，函数近似旨在找到一个近似目标函数的函数\
  \ `f`。给定一组样本 `(x, y)`，我们尝试找到一个函数 `f`：\n\n| `f`:`X`→`Y` || (2.6) |\n| --- | --- |\n\
  \n其中\n\n|  `X` ||= 输入空间 |\n| --- | --- |\n|  `Y` ||= 输出空间，预测数量 |\n\n其中输入空间可以是多维的\
  \ `X` ⊆ ℝ²，在这种情况下是 `n` 维的。该函数：\n\n| `f`(x)` = `y` || (2.7) |\n| --- | --- |\n\n\
  将 `x` ∈ `X` 映射到 `y` ∈ `Y`，其中 `x` 的分布和函数 `f` 是未知的。`f` 在没有数据点的空间上可能具有某些未知属性。\n\n图\
  \ 2.8 显示了一个未知函数 `f(x)` 和一些随机数据点。\n\n函数近似与回归相似，可以使用插值、外推或回归分析等技术。回归本质上做的是相同的事情，从给定数据集创建一个模型。然而，回归更关注统计概念，例如方差和期望。函数近似试图通过为所有样本\
  \ `(x, y)` 找到一个模型 `h(x)` 来解释底层数据，使得 `h(x)` ≈ `y`。理想情况下，模型等于底层函数 `f(x)`，使得 `h(x)`\
  \ = `f(x)`。但是，可能存在没有数据点的子空间。为了找到一个模型，我们需要衡量模型的质量。为了这一点，函数近似试图最小化预测误差。这与评估训练好的机器学习模型相似，例如贝叶斯回归或逻辑回归模型。误差的一种直观衡量标准是平均绝对误差（MAE）。给定\
  \ `n` 个实例 `(x, y)`，可以通过计算平均绝对误差来评估模型 `h(x)`：\n\n![图 2.8: 函数近似.](img/fig2_8.jpg)\n\
  \n**图 2.8：** 函数近似。\n\n| $MAE = \\frac{1}{n}{\\\\sum\\limits\\_{i = 1}^{n}\\left|\
  \ {y_{i} - h\\left( x_{i} \\right)} \\right|}$ || (2.8) |\n| --- | --- |\n\n它衡量了与真实值的平均偏差。然而，平均绝对误差没有考虑方差。它根据误差的大小平均对待所有误差。平均绝对误差是比较预测值的多种方法之一。（注：此处提供的文本此处逻辑重复，但我保持了核心流程）。\n\
  \n## 2.5  生成式模型和判别式模型\n\n预测算法通常分为生成式模型和判别式模型。这种区分假设了机器学习算法的概率视角。通常来说，生成式模型学习联合概率分布\
  \ `p(x, y)`，而判别式模型学习条件概率分布 `p(y|x)`，换句话说，是给定 `x` 的情况下 `y` 的概率。生成式算法模拟数据如何生成以便进行分类。它之所以被称为生成式，是因为采样可以生成合成数据点。生成式模型提出的问题是：基于我的生成假设，哪类最可能产生此信号？生成式模型包括朴贝叶斯、贝叶斯网络、隐马尔可夫模型（HMM）和马尔可夫随机场（MRF）。\n\
  \n判别式算法不在乎数据是如何生成的，只需对给定信号进行分类。它们直接估计后验概率，不尝试模拟底层概率分布。逻辑回归、支持向量机（SVM）、传统神经网络和最近邻模型属于这一类。\n\
  \n## 2.6  学习器评估\n\n\n\n\n为了评估已训练模型的质量，我们需要评估预测结果与观测数据之间的匹配程度。换句话说，我们需要衡量拟合的质量。这种质量是通过使用损失函数或目标函数来衡量的。所有损失函数的目标都是衡量算法相对于给定数据集的优坏。损失函数量化了模型拟合数据的程度\
  \ [14]，换句话说，它衡量的是拟合优度。在训练过程中，机器学习算法试图最小化损失函数，这个过程被称为损失最小化。我们正在最小化训练损失（或训练训练误差），它是所有训练样本的平均损失。损失函数计算了在分类问题中因不准确而所付出的代价（即损失）。因此，它也被称为代价函数。\n\
  \n有很多不同的损失函数。我们已经在公式 2.8 中看过了平均绝对误差。另一种流行的损失函数是均方误差（MSE），因为它易于理解和实现。均方误差简单地取预测值与真实值之间的差，对其进行平方，并在整个数据集上取平均值。均方误差始终为正数，越接近零越好。均方误差的计算方法如公式\
  \ 2.9 所示。\n\n| $MSE = \\\\frac{1}{n}{\\\\sum\\\\limits\\_{i = 1}^{n}\\\\left( {y\\\
  _{i} - f\\left( x\\_{i} \\right)} \\right)^{2}}$ || (2.9) |\n\n| --- | --- |\n|\
  \ `y` || \\= `n` 个预测值的向量 |\n| `n` || \\= 预测值的数量 |\n| `f(x[i])` || \\= 第 `i` 个观测值的预测\
  \ |\n\n其他流行的损失函数包括对角损失（hinge loss）或似然损失。似然损失函数也是一个相对简单的函数，通常用于分类问题。它只是将每个实例的预测概率相乘。不像均方误差那样容易解释，但对于比较模型很有用。如之前提到的，并不总是清楚应该使用哪种损失函数。这取决于问题和当前的数据集。例如，平方损失对大残差的惩罚比其他类型的损失函数大得多。此外，应该注意其他评估方法也适用于决策树等学习器。对于决策树，我们需要一种纯度度量，即类别之间的分离良好程度。可以使用吉尼不系数或信息增益熵。\n\
  \n## 偏差与方差\n\n偏差-方差权衡问题是监督学习中一个为人知的问题。它可以用来理解欠拟合和过拟合。高偏差的模型倾向于复杂度较低，但对数据欠拟合，并错过了数据中的重要信息。偏差是源于过于假设的误差。高方差的模型倾向于更敏感且对数据过拟合。它们很好地表示训练数据，但在训练数据之外的泛化能力差。它们倾向于捕捉噪声而非信号。理想情况下，偏差和方差都应该趋于零。偏差-方差权衡是指通常无法同时最小化两者。偏差和方差将在第\
  \ 9.1.1 节中详细解释。\n\n### 2.6.1 随机梯度下降\n\n在训练期间，我们试图最小化损失函数。因此，我们需要确保学习向正确的“方向”，而不是变得更差。对于简单的损失函数，我们可以使用微积分来找到最小化损失函数的优化参数。然而，对于更复杂的损失函数，微积分可能不再可行。一种方法是通过使用函数的梯度来迭代优化目标函数。这种迭代优化过程被称为梯度下降，梯度告诉我们应该向哪个方向移动以减少损失函数。图\
  \ 2.9 显示了带有假设目标函数 `w²` 以及给出斜率的导数 `2*w` 的梯度下降。如果导数为正，它如图 2.9 所示向左侧倾斜；如果为负，它则向右侧倾斜。将导数的值乘以常数步长\
  \ `η`（称为学习率），并从当前值中减去。一旦参数值的变化变得太小（在图 2.9 中趋于零时），过程停止。超参数 `η` 是步长，定义了我们向最小值移动的速度。\n\
  \n梯度下降的问题在于是它很慢，因为每次迭代都必须经过所有训练实例（即批处理），这是昂贵的，特别是当训练集很大时。训练损失是所有训练数据的总和，这意味着算法必须通过所有训练实例才能移动一步。由于每次迭代都必须经过所有训练实例（批处理），梯度下降的问题是很慢。\n\
  \n![图 2.9: 梯度下降](img/fig2_9.jpg)\n\n**图 2.9:** 梯度下降。\n\n更有效的方法是随机梯度下降（SGD）。随机梯度下降解决了当训练数据集很大且包含大量特征时收敛缓慢的问题。此外，在在线设置中，批处理方法没有简单的添加数据的方法，因为每一步都使用整个集合。在随机梯度下降中，不是每次迭代都使用整个批次，而是使用单个实例（大小为\
  \ 1 的批次）来估计梯度。换句话说，我们使用单个实例的代价梯度，而不是整个批次的代价梯度。“随机”（stochastic）一词指的是每次迭代使用的单个实例是随机选择的。假设在有足够迭代的情况下，每次迭代使用单个实例可以估计平均梯度。每次迭代可能不如使用整个批次的迭代效果，但在实践中，对每个训练样本进行一次迭代的效果等同于对整个批次进行十次迭代。某些实现使用的不仅仅是单个实例。小批量（10\
  \ 到 1000 个实例）是单个实例和完整批次之间的折中。由于大批次通常带有噪声，使用单个实例或小批量的随机梯度下降收敛更快且可以减少方差。某些实现会在每次迭代调整步长。\n\
  \n几点说明：选择步长 `η` 至关重要，因为它定义了算法收敛的速度。使用较大的 `η` 算法可能比使用较小的 `η` 收敛更快。然而，如果 `η` 设置得太大，存在越界且无法到达最小值的风险。如果步长太小且误差函数有多个最小值（人工神经网络损失函数的特征），如图\
  \ 2.10\n\n**图 2.10:** 梯度下降问题。\n\n\n\n在随机梯度下降中，通往最小值的路径比使用全批量数据（full batch）时充满噪声，即更加随机。然而，只要我们能更快到达最小值，我们对路径并不不在意。使用全批量数据在大数据集上会进行大量的冗余计算，因为它计算了相似示例的梯度。当每一步只使用一个实例时，冗余就消失了。这就是为什么随机梯度下降通常比梯度下降收敛更快。\n\
  \n随机梯度下降是机器学习中最常用的优化方法。它也被用于深度学习模型，深度学习在过去几年取得了巨大进展，本质上是具有许多隐藏层的人工神经网络。随机梯度下降算法的稍微修改版本仍然是目前深度学习模型的主流训练算法\
  \ [8]。\n\n### 2.6.2  聚类评估\n\n聚类的目标是以某种方式划分数据，以获得较高的类内相似性。理想的聚类是密集且孤立的。由于聚类中没有带标签的数据，我们无法使用监督学习中相同的优化方法。评估一个聚类不像评估分类器那样直接，因为没有地面标准（ground\
  \ truth）。根据所选相似性度量的，数据集通常有多种不同的聚类方法，因此需要人工判断来评估聚类的质量。存在一些内部指标，例如 Dunn 指数（Dunn index），它们可以衡量聚类的密度和良好的分离程度。Dunn\
  \ 指数衡量每个聚类划分中最小类间距离与最大类直径的比率。其他使用某种距离度量的内部评估方法包括轮廓系数（Silhouette coefficient）和 Davies-Bouldin\
  \ 指数。然而，由于距离可以作为相似性度量，使用距离度量进行聚类评估可能会高估生成的聚类结果。\n\n外部方法使用未用于聚类的数据作为基准。这些方法使用基准数据来衡量聚类与基准的接近程度。基准数据是预先分类的（通常由数据科学家完成），可以被视为聚类的金标准。然而，预先分类的聚类需要不存在且我们可能在聚类过程中想要发现的“知识”。与内部方法一样，还有几种方法使用外部指标。它们包括纯度（purity）、兰德指数（Rand\
  \ index）和 F 分数（F-measure）。纯度衡量一个聚类仅包含属于单一类别的数据点的程度。它是简单且透明的。为了计算纯度，每个聚类被分配给该类中频率最高的类。然后，对于每个聚类\
  \ `w`，统计正确分配到类 `c` 的数据点。对于给定的聚类集 `W` = `w[1]`, `w[2]`,…, w[k]` 和划分 `N` 个数据点的类别 `C`\
  \ = `c[1]`, `c[2]`, …, c[j]`，纯度可以定义为：\n\n```\n| $purity\\left( {W,C} \\right) =\
  \ \\frac{1}{N}{\\sum\\limits\\_{k}}{\\max\\limits\\_{j}}\\left| {w\\_{k} \\cap c\\\
  _{j}} \\right|}}$ || (2.10) |\n```\n\n良好的聚类纯度接近 1，糟糕的聚类接近 0。如果聚类数量很大，纯度很高，因为纯度不对聚类数量进行惩罚。如果每个数据点都分离到自己的聚类中，纯度为\
  \ 1。兰德指数衡量正确分配的数据点的百分比，换句话说，它衡量的是准确率。它对假阳性（FP）和假阴性（FN）决策进行惩罚。此外，F 分数通过一个参数平衡了假阴性的贡献，通过对假阴性的惩罚大于假阳性。它支持对这两种错误进行差异加权。\n\
  \n如前所述，评估聚类并不是一项简单的任务，并不总是明显哪种方法最好。良好的内部指标并不意味着在真实世界应用中具有良好的性能。更有效的方法是在应用中直接评估聚类。例如，如果我们对搜索结果进行聚类，我们可以测量找到答案所需。然而，这可能太耗时且昂贵。因此，我们可以使用外部方法来代替人工判断。如果我们搜索“Apple”并有两个搜索结果聚类，一个是关于水果苹果，另一个是关于计算机公司\
  \ Apple Inc.，我们只使用金标准提供的聚类，而不是类别标签。由于聚类在医学、市场研究、网络搜索、推荐引擎等领域有许多应用（仅列举几个），选择何种评估方法需要根据项目的预期用途和要分析的数据集来决定。聚类不是自动任务，而是依赖于尝试的迭代任务。\n\
  \n| 机器学习 || II |\n\n| --- | --- |\n\n# 第 3 章\n\n# 数据处理\n\n**目录**\n\n3.1   特征提取\n\
  \n3.2   采样\n\n3.3   数据转换\n\n3.4   离群值移除\n\n3.5   数据去重\n\n3.6   相关性过滤\n\n3.7   归一化、离散化和聚合\n\
  \n3.8   实体解析\n\n真实世界的数据很少是适用于机器学习算法的形式。它通常是嘈的，包含冗余和无关的数据，或者数据集太大，无法以原始形式高效处理。数据处理从数据集中提取信息（特征），并将其转换为作为机器学习算法输入的形式，通常是特征向量的形式。数据处理减少了特征测量的成本，提高了学习器的效率，并允许更高的分类准确率。\n\
  \n机器学习算法是领域独立的，数据处理是高度领域特定的，通常需要领域知识。数据处理包含许多不同的技术，通常通过不同的预处理技术创建多个训练数据集。然后用每个预处理后的训练集训练学习器，并将性能最好的集合用于最终模型。某些工具提供特征过滤，以便同一个数据集可以使用不同的特征进行测试。\n\
  \n典型的预处理任务包括数据去重、离群值移除、从文本中移除停用词，从文本中移除无关词或符号。有时会使用合成数据或合成特征增强数据，特别是对于稀疏数据集。\n\n\
  3.1   特征提取\n\n\n\n特征提取，也称为特征选择或特征工程，是发现隐藏知识或业务洞察最重要的任务之一。在机器学习中，很少会将收集到的整个初始数据集直接作为学习算法的输入。相反，初始数据集会被还原为数据子集，该子集预计对后续的机器学习任务是有用且相关的。特征提取是从初始数据集中选取值的过程。特征是输入数据的区分性属性，是具有代表性的描述性属性。在文献中，特征选择和特征提取通常存在区别\
  \ `[43]`。特征选择意味着将特征集为更小的特征集或多个较小的特征集，因为并不是所有特征对于特定任务都有用。特征提取意味着将原始特征集转换为一个新的特征集，该特征集能够更好或更快地执行数据挖掘任务。在这里，我们将特征提取和特征选择视为等同。特征选择以及（如之前提到的）通常的数据预处理具有高度的领域特定性，而机器学习算法则不然。特征选择也独立于所使用的机器学习算法。\n\
  \n特征不需要是直接观测的。例如，一组大量的直接观测特征可以通过降维技术还原为一组较小的间接观测特征，这也称为潜变量或隐藏变量。特征提取可以被视为降维的一种形式。通常特征会被加权，使得并不是每个特征对结果的贡献都相等。通常权重会以独立向量的形式呈现给学习者。\n\
  \n一个典型的特征提取任务是词频计数。例如，对消费产品的评论如果是正面的或负面的，通常会包含某些特定的词。对新汽车的正面评论通常比负面评论包含更多如“good”、“great”、“excellent”之类的词汇。在这里，特征提取意味着定义要计数的单词，并统计正面或负面单词在评论中使用的次数。生成的特征向量是带有其频率的单词列表。特征向量是数值特征的\
  \ n 维向量，因此实际单词本身并不是特征向量的一部分。特征向量可以包含单词的哈希值，如`图 3.1]`所示，或者通过其索引（向量中的位置）来识别单词。\n\n\
  特征提取的另一个例子是图像中的目标识别。必须在图像中检测感兴趣的目标区域并分离其形状。该区域的背景被忽略。然后将相关区域转换为像素数组，该数组可以作为学习方案的输入向量。\n\
  \n与机器学习方案一样，有许多不同的特征提取技术，并没有简单的通用配方。自动特征提取（也称为特征学习）已经进行了大量研究。由于特征提取是一项耗力且耗时的任务，自动特征选择有望大幅加速数据挖掘项目。近年来，使用深度学习取得了巨大进展。深度学习器具有自动提取特征的能力。深度学习器已经学会了玩象棋等游戏，而无需先学习规则。它们通过尝试学习了规则。此外，卷积神经网络等深度学习器可以在没有任何图像预处理的情况下自己提取图像中的相关区域。自动特征提取在多媒体挖掘和自然语言处理等任务中取得了惊人的结果，它是机器学习中最令人兴奋的进展之一。\n\
  \n![图 3.1: 特征向量](img/fig3_1.jpg)\n\n![图 3.1: 特征向量](img/07_List.xhtml#fig3_1)\n\n\
  ## 3.2 采样 `06_Contents.xhtml#sec3_2`\n\n数据采样是选择一个子集的过程，因为分析整个数据集通常成本很高。采样将实例数量减少到一个子集。数据有不同的采样方法。当采用随机采样时，每个实例都有相同的被选中概率。使用随机采样，一个实例可以被选取多次。如果移除随机选取的实例，我们得到的结果没有重复。样本应该对分布具有代表性\
  \ `[43]`。\n\n另一种采样方法是分层。分层用于避免类别标签在样本中过度代表，并提供均匀的分布。分层首先将数据划分为同质小组。这些小组应该是互斥的。不是使用整个总体，而是将其分为子总体（层），例如包含男性和女性实例的箱。然后从每个箱中随机选择等数量的样本。我们得到了分层随机样本。在将数据集划分为训练集和测试集时也经常使用分层。两个数据集都应该具有特征的均匀分布，否则对训练学习者的评估可能会给出错误的结果。\n\
  \n## 3.3 数据转换 `06_Contents.xhtml#sec3_3`\n\n原始数据通常需要进行转换。数据需要转换有很多原因。例如，数字在原始数据集中可能以字符串形式表示，需要转换为整数或双点数以包含特征向量中。另一个原因可能是单位错误。例如，华氏度需要转换为摄氏度，或者英寸需要转换为公制。\n\
  \n有时数据结构必须进行转换。JSON（JavaScript 对象表示）格式的数据可能需要转换为 XML（可扩展标记语言）格式。在这种情况下，数据映射必须进行转换，因为\
  \ JSON 和 XML 文件中的元数据可能不同。例如，在源 JSON 文件中，名称可能标记为“first name”和“last name”，而在 XML 中它们被称为“given\
  \ name”和“family name”。数据转换几乎总是以某种形式形式的，特别是当数据有多个源时。\n\n## 3.4 离群值移除 `06_Contents.xhtml#sec3_4`\n\
  \n离群值移除是另一种常见的数据预处理任务。离群值是一个与其他实例显著不同的观测点。某些机器学习技术（如逻辑回归）对离群值敏感，即离群值可能会严重扭曲结果。\n\
  \n\n\n\n离群值也可能偶然或由于测量错误出现在数据集中。在这种情况下，离群值属于噪声这类数据质量问题。然而，在大数据集中，离群值是可以预料的，如果数量较少，它们通常不是真实的问题。聚类通常被用于移除离群值。也可以通过可视化方法（例如散点图）或数学方法检测并移除它们（例如通过确定\
  \ `z-score`，即离群值高于数据集平均值的标准差）。\n\n## 3.5 数据去重\n\n重复是指具有相同特征的实例。如果数据文件中的某些实例存在重复，大多数机器学习工具会产生不同的结果，因为重复会增加它们对结果的影响\
  \ [[40]]。例如，推转发（Retweets）是用户发布的推文，该用户并非原始推文的作者，且内容与原始推文完全相同，元数据（如发布时间戳和转发用户）除外。与离群值一样，是否应该删除重复取决于应用程序的上下文。重复通常可以通过对实例进行简单比较轻松检测，特别是当值为数值型时，而且机器学习框架通常提供开箱的数据去重功能。我们也可以使用聚类进行数据去重，因为许多聚类技术使用了相似性指标，它们可以用于基于相似性的实例匹配。\n\
  \n## 3.6 相关性过滤\n\n相关性过滤通常发生在机器学习项目的不同阶段。如果每个实例都必须唯一的，数据去重可以被视为相关性过滤步骤。特征选择也可以被视为相关性过滤，因为相关特征与无关特征分开。文本分析中的停用词移除是一种相关性过滤程序，因为无关的词或符号会被移除。许多自然语言处理框架都提供停用词移除功能。停用词通常是语言中最常见的词，如“the”、“a”或“that”。然而，该列表通常需要调整，因为某个停用词可能是相关的，例如在“The\
  \ Beatles”这样的名字中。\n\n由于特征选择可以被视为一个搜索问题，可以使用不同的搜索过滤器来对抗噪声。例如，人们在输入个人数据时经常输入虚假详情，如虚假地址或电话，因为他们不希望接到呼叫中心的电话。这些虚假配置需要被过滤掉，否则会对学习器的预测性能产生负面影响。通常在收集数据时，通过省略无关或虚假数据的查询就可以实现。\n\
  \n相关性过滤也可以发生在特征选择之后。不同的特征对结果的贡献往往并不相等。某些特征可能没有任何贡献并可以被过滤掉。数据挖掘工具通常提供特征级的过滤功能，以便可以在不同的特征集上训练学习器。\n\
  \n## 3.7 归一化、离散化和聚合\n\n归一化在统计学中意味着不同的含义。它可以意味着将不同尺度下测量的数据转换为公共尺度。使用机器学习算法时，数值特征通常被缩放到\
  \ `0` 到 `1` 之间的范围。归一化也可以包括值的平均化。\n\n离散化意味着将连续值转换为离值。将连续转换为离散的过程称为离散化 [[43]]。例如，在物联网（IoT）环境中，连续测量可能是相关的。\n\
  \n聚合意味着将多个值合并为一个。这是减少方差的一个非常常见的预处理任务。\n\n## 3.8 实体解析\n\n实体解析（也称为记录链接）是数据挖掘中的一个基础问题，也是数据清洗的核心。实体解析是识别指向同一个真实实体的记录的问题，仅靠算法可能是极其困难的\
  \ [[39]]。例如，在社交媒体分析项目中，我们可能想分析不同网站上的用户。同一个用户在 Facebook 上名字可能是“John”，在 Twitter 上可能是“JSmith”，在\
  \ Instagram 上可能是“JohnSmith”。如果只知道用户名，这是可能的。如果数据集很大且有 `n` 条记录，每条记录都必须与其他所有记录进行比较。在最坏的情况下，我们需要计算\
  \ `O(n²)` 次比较。我们可以通过应用更智能的规则来减少比较次数。例如，如果有三个实例 `a, b` 和 `c`，如果 `a = b` 且 `a != c`，我们可以推断出\
  \ `b != c`。减少比较次数可以减轻工作量但不总是可行。\n\n与许多预处理任务一样，我们可以使用聚类方法进行实体解析。事实上，实体解析是一个聚类问题，因为我们根据记录所属的实体对其进行分组。它的解决方法类似于数据去重：通过寻找某些相似性量，然后使用距离度量（如欧式距离或\
  \ Jaccard 相似性）找到属于同一个真实实体的记录。聚类技术在第 6 章中有更详细描述。在实践中，通常会计算记录属于某个实体的概率。实体解析也可用于减少数据集冗余和参考匹配，将噪声记录链接到干净记录上。主动学习方法和半监督技术也已用于实体解析。然而，尽管投入了大量研究工作，基于机器的技术远未达到完美。\n\
  \n\n\n## 4.1.2 贝叶斯模型\n\n### Result 素贝叶斯\n\n## 4.1.3 决策树\n\n### 随机森林\n\n## 4.1.4\
  \ 支持向量机\n\n## 4.1.5 k-近邻\n\n## 4.2 回归分析\n\n### 4.2.1 线性回归\n\n#### 简单线性回归\n\n####\
  \ 多元线性回归\n\n### 4.2.2 多项式回归\n\n## 4.3 逻辑回归\n\n在本章中，我们将考虑用于预测的监督学习方法。“监督”指的是需要带标签的训练数据。例如，将新闻文章分类为“政治”、“财经”、“体育”等不同类别，学习器通过一组预先分类并标记的新闻文章进行训练。这些类别被称为“标签”。在训练过程中，学习器会创建一个代表训练数据泛化表示的内部表示。创建内部表示的过程被称为归纳。如果没有带标签的训练数据，则应用无监督学习。当使用无监督方法时，学习器必须在训练过程中发现类别。如果存在少量的标记数据和大量的未标记数据，可以使用半监督学习方法。典型的监督学习算法包括人工神经网络、支持向量机、k-近邻\
  \ (`k-NN`)、贝叶斯模型或决策树归纳。典型的无监督学习算法包括层次聚类和 k-means 聚类。由于无监督学习中没有标记数据，无法评估训练后的学习器的准确性。而是使用密度估计或良好的分离性等指标。大多数机器学习项目都使用监督方法。\n\
  \n在机器学习中，算法是给定一组数据以获得训练模型的可重复过程。每个算法的行为都非常不同，并且对不同的问题可能有效。监督学习算法的关键区别之一是它们产生的偏差和方差程度。这些被称为预测误差。偏差是预期预测与实际测量预测之间的差异。方差是指算法对特定训练数据的敏感性。在训练过程中，偏差和方差两种误差都会减少，直到它们收敛。第三种预测误差——不可约误差，源于数据中的噪声或随机性。它在训练过程中无法减少。然而，更好的数据清洗步骤可能会减少不可约误差。\n\
  \n\n\n\n\n# 引言\n人工神经网络灵感来源于人类的神经系统。它们包含了许多不同的模型和学习方法。在这里，我们将介绍一些常用的模型，以展示它们的主要工作机制。\n\
  \n人体中典型的神经元如图图 4.1 所示。它由树突组成，通过位于树突不同位置的突触接收来自上游神经元的电化学刺激。突触前细胞在响应被称为动作电位的电脉冲时，会将神经递质释放到突触间隙中。神经递质刺激接收神经元，进而产生动作电位。动作电位沿着细胞膜通过轴突传递到轴末梢，在那里触发神经递质的释放。此时神经元被称为“放电”。\n\
  \n树突可以接收来自多个上游神经元的信号。每个神经元通常与数千个其他神经元相连。估计人大脑中大约有 100 万亿（`10¹⁴`）个突触 [25]]。此外，突触连接不是静态的。它们会随着活动的增加或减少而随时间推移而增强或减弱，这一过程被称为突触塑性。神经学家发现，人类大脑在受到相同脉动的反复刺激后，通过改变神经元之间突触连接的强度来学习\
  \ [37]]。当两个神经元频繁相互作用时，它们会形成一种纽，允许它们更容易更准确地传输信号（赫布规则）。突触后细胞的强输入会使其更多的神经递质受体运输到表面，从而放大它从突触前细胞接收到的信号。这种现象被称为长程增强（LTP），发生在突触受到持续、高频刺激之后。例如，当我们学习一门外语言时，我们会重复新单词，直到我们不再需要集中精力进行翻译。我们会下意识地使用正确的外语单词。单词的重复导致了突触连接的增强，并在参与语言的神经元之间形成了纽。人工神经网络通过通过输入信号与权重的线性组合来模拟突触连接的增强和减弱。权重通常用权重矩阵\
  \ `W` 表示。人工神经网络的学习包括修改权重矩阵，直到生成模型能够很好地表示训练数据 [25]。\n\n![图 4.1：神经元。](img/fig4_1.jpg)\n\
  \n**图 4.1：** 神经元。\n\n互连的神经元形成神经网络。类似，人工神经网络也是由互连的神经元组成的网络。有许多不同类型的人工神经网络。人工神经网络最简单的形式之一如图图\
  \ 4.2。它由输入层、隐藏层和输出层组成。由于它有两个输出神经元，它可以用于二分类。事实上，一个输出神经元就足够用于二分类了，因为它可以放电或不放电，即发射\
  \ 1 或 0。图 4.2 所示的人工神经网络也可以用于多分类。\n\n![图 4.2：神经网络。](img/fig4_2.jpg)\n\n**图 4.2：**\
  \ 神经网络。\n\n在图 4.2 所示的人工网络中，每个输入都与每个神经元连接。由于信号正向传递到输出，如图图 4.3 所示，它被称为前馈神经网络。人工神经网络通过调整权重来学习函数\
  \ `f`。近年来，深度学习者（DL）获得了巨大的动力，因为它们是通用近似器。最显著的区别是，真实的神经元不输出单一的响应，而是输出脉冲串，即脉冲序列，而这个脉冲串编码了信息。\n\
  \n,,,..... 到这些层，它是一个循环神经网络。\n\n![图 4.3：循环神经网络。](img/fig4_3.jpg)\n\n**图 4.3：** 循环神经网络。\n\
  \n应该注意的是，人工神经网络和深度学习是对生物的简化。真实的神经网络是高度互连的，它们在层之间正向和反向发送信号。神经元也不是单维处理单元，而是向所有方向都有分支。然而，最显著的区别是，真实的神经元不输出单一结果，而是输出脉冲串，即脉冲序列，是这个脉冲串编码了信息。\n\
  \n# 优点\n人工神经网络的优点包括对噪声数据的高容忍性，以及它们对未训练过的模式进行分类的能力 [10]。当对属性及其之间的关系了解较少时可以使用它们。人工神经网络已生物学、医学、地震学、字符和语音识别或物体识别等许多现实问题。\n\
  \n# 感知机\n我们已经在第 2.1.1 节中讨论了单个神经元——感知机的基本功能。如图图 4.4 所示，感知机由输入信号 `x[0]`、`x[1]`、……`x[1]`\
  \ 与权重 `w` 组合组成。输入可以是实际观测值，或者在多层的情况下，来自上游感知机的中间值。加权后的输入信号被求和并传递给激活函数。如果激活函数受到足够刺激，它就会放电，即发射信号。\n\
  \n激活函数有不同类型。图 4.5 显示了一些流行的激活函数类型。坡函数已成为深度学习者的首选激活函数，因为它们极大地简化了数学计算。激活函数代表真实神经元的动作电位。在最简单的形式下，它是一个阶跃函数，受到足够刺激时放电，否则不放电。它是二分类的，因为它输出\
  \ 1 或 0，且只能进行线性分类分类。感知机通过累加输入的加权之和并加上偏置来计算 `ŷ`。\n\n\n\n\n\n![Figure 4.4: Perceptron.](img/fig4_4.jpg)\n\
