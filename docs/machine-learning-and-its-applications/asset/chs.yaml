  \ {\\\\text{if~}w\\_{0}x_{0} + w_{_{1}x_{1} + w_{_{2}x_{2} + b > 0} \\\\\\\\ {0,}\
  \ & {\\\\text{if~}w\\_{0}x_{0} + w_{_{1}x_{1} + w_{_{2}x_{2} + b \\leq 0} \\\\\\\
  \\ \\\\end{cases}$ || (4.2) |\n\n| --- | --- |\n\n输入节点在经过任何转换的情况下将信号传输到输出节点。输出节点对加权输入求和并加上偏置。偏置\
  \ `b` 是一个常数，作用类似于截距。它沿着 x 轴向左或向右移动激活函数。\n\n如方程 2.3 所示，输入信号与权重 `w` 和偏置 `b` 线性组合。正因如此，带有阶跃函数的感知机只能线性分类类别。将实例分为\
  \ -1 和 1 两个类的直线被称为决策边界。它是一个线性超平面。如果我们需要非线性分类，则需要多个感知机。\n\n权重在训练过程中使用方程 4.3 给出的权重更新公式进行学习。\n\
  \n| `w`[*j*]^(*k* + 1) = `w`[*j*]^(*k*) + `λ`(`y`[*i*]−`ŷ`[*i*]^(*k*))*x`[*i**j*]\
  \ || (4.3) |\n\n| --- | --- |\n\n其中\n\n|  `w^k` || \\= `k^(th)` 次迭代后 `i^(th)` 输入的权重\
  \ |\n| --- | --- |\n\n|  `λ` || \\= 学习率 |\n|  `ŷ`[*i*]^(*k*) || \\= 预测输出 |\n|  `x[ij]`\
  \ || \\= 训练实例 `x[i]` 的 `j^(th)` 属性的值 |\n\n初始权重通常用随机值设置。预测误差计算为 (`y`−`ŷ``)。新权重是旧权重和预测误差的组合，如方程\
  \ 4.3 所示。学习算法会进行所需的迭代，直到输出收敛，即感知机的输出正确地分类了训练实例。学习率 `λ` 是 0 到 1 之间的一个值，控制每次迭代权重调整的幅度。如果学习步长太小（即\
  \ `λ` 接近 0），算法可能需要很长时间才能收敛；如果太大，则可能永远无法完全收敛。因此，某些实现也会训练期间调整学习率。\n\n## 多层感知机\n\n\
  多层感知机是一类前馈网络，由至少三层组成：输入层、一个或多个隐藏层和一个输出层，如图 4.2 所示。除了输入层外，这些层由具有非线性激活函数的感知机组成。前馈网络信号单向从输入层通过中间层传递到输出层，没有任何循环。这被称为正向传播。多层感知机可以分离非线性可的数据点。通常，多层感知机使用\
  \ sigmoid 激活函数。同一神经网络中的所有神经元并不需要相同类型的激活函数。多层感知机中的典型激活函数包括 sigmoid 或逻辑激活函数（如方程 4.4\
  \ 所示，它也用于逻辑回归）以及双曲正切函数（如方程 4.5 所示）。\n\n| `y`[*i*]) = (1+`e`)^( − 1) || (4.4) |\n\
  | --- | --- |\n\n其中\n\n|  `e` || \\= 欧拉数 |\n| --- | --- |\n\n| `y`[*i*]` || \\=\
  \ `i*th` 节点的输出，`e` 是欧拉数。`x[i]` 是节点的输入，`e` 是输入加上偏置的加权和。 |\n\n| `y`[*i*]) = `tanh`(`x`[*i*])\
  \ || (4.5) |\n| --- | --- |\n\n双曲正切函数看起来与逻辑函数相似，但范围从 -1 到 1。如图 4.5 所示。带有激活函数 `f`\
  \ 的感知机的输出由方程 4.6 给出。\n\n| `y`[*i*]) = `f`(`w*[1]*x*[1]+`w*[2]*x*[2]+…+`w`[*j*]*x`[*j*]+`b`)\
  \ || (4.6) |\n| --- | --- |\n\n其中\n\n|  `y(x[i])` || \\= `i*th` 感知机的输出 |\n| ---\
  \ | --- |\n\n|  `w[j]` || \\= `i*th` 神经元的 `j*th` 输入的权重 |\n|  `b` || \\= 偏置 |\n\n\
  神经网络的学习意味着学习权重。在训练期间，调整权重直到网络输出期望的结果。权重使用反反向传播机制进行调整，该机制将在 4.1.1 节中解释。\n\n根据前一层感知机的数量，感知机可以有一个或多个输入。多层感知机是全连接的，这意味着每个感知机都与下一层的所有感知机连接。多层感知机可以用于近似非常的问题，被称为通用函数近似器。由于存在更简单的模型（如支持向量机），且深度学习最近已成功应用于许多问题（包括物体识别、语音识别和机器翻译），多层感知机已不再那么流行。深度学习器与多层感知机并没有很大区别。它们也使用反向传播进行训练，但通常具有更多的层和非全连接的神经元。\n\
  \n\n\n\n反向传播（Backpropagation）是一种在训练过程中调整权的算法。在每次训练迭代后，都会计算多层感知器输出端的误差或损失，并将其反向传播回整个网络。调整权重使得下一次迭代的误差最小化。初始权重通常是随机设置的。我们不知道隐藏层的正确权重是什么。这一事实使得网络中间的神经元得出了名字；它们被称为隐藏层（或隐藏层），因为无法直接检查和纠正它们的值\
  \ [25]。\n\n首先，我们需要计算输出处损失函数或误差函数的梯度。梯度是通过使用损失函数的导数计算得的，然后应用链式法则来计算每一层的梯度。在每次迭代中，梯度被不断极小化，直到找到函数的最小值。这个过程被称为梯度下降。梯度下降算法使用反向传播来调整权重。这有时被称为误差的反向传播。\n\
  \n梯度下降是一种用于寻找函数最小值的迭代优化方法。梯度下降以及陷入局部最优值的问题在第 2 章中有所介绍。为了计算梯度，损失函数需要是可微的。机器学习中最常见的损失函数是均方误差（MSE）函数\
  \ 2.9，该函数在第 2 章中也介绍过。通过平方，误差越大，受到的惩罚越重，且误差始终为正值。均方误差是通过计算测量输出、预测输出与真实值之间的差，将其平方并在整个训练集上取平均值得出的。均方误差函数可以很容易求导，通常用于回归分析。其他流行的损失函数包括用于分类的对数损失函数。与通常，还存在其他损失函数及其变体。\n\
  \n一个完整的训练迭代通过以下步骤：\n\n1. **正向传播**\n   (a) 将输入正向通过网络以计算输出\n   (b) 计算输出处的误差\n2. **反向传播**\n\
  \   (a) 将误差反向通过网络\n   (b) 调整权重\n\n几点说明：多层感知器可以近似任何连续函数，因此是一个通用函数近似器。从数学上可以证明，一个隐藏层就足够近似任何函数。这被称为通用近似定理。这并不意味着多层感知器总能提供有意义的结果。现实情况是，有时，越复杂的神经网络要么过拟合数据，要么无法收敛到最优解\
  \ [1]。在实际应用中，我们很少看到超过两层的结构，而且正如之前提到的，一层足够了。然而，我们不知道需要多少个感知器。节点数量必须通过实验，通过训练和评估具有不同数量的网络来确定。\n\
  \n多层感知器被批评为难以解释，特别是其内部机制，与易于解释的决策树不同。我们知道训练网络的权重和激活函数，但这并没有告诉我们太多信息。我们在深度学习中也面临相同的问题。\n\
  \n多层感知器使用批量训练进行训练。在每次训练迭代中，网络都会接收整个训练集。这个循环被称为一个 `epoch`。计算误差和并将其反向传播。\n\n## 4.1.2\
  \ 贝叶斯模型\n\n贝叶斯模型基于贝叶斯定理。通常来说，贝叶斯分类器最小化误分类的概率。它利用了先验分布和似然，这两者通过贝叶斯规则相关 [30]。它从 `P(c)`\
  \ 和 `P(x)` 计算出后验概率 `P(c|x)`，如方程 4.7 所示：\n\n```\nP(c|x) = (P(x|c) * P(c)) / P(x)\n\
  ```\n\n其中：\n- `P(c|x)`：给定 `x` 时类别 `c` 的后验概率\n- `P(x|c)`：给定类别 `c` 时预测值的似然\n- `P(c)`：类别\
  \ `c` 的先验概率\n- `P(x)`：预测值 `x` 的先验概率\n\n贝叶斯模型中的概率表示为对事件的信念程度，并且会随着新信息的出现而改变。贝叶斯规则告诉我们如何从数据进行推理。学习和预测可以被视为推理的形式。当\
  \ `x` 很大时，计算 `P(x|c)` 并不，需要更多的计算能力。然而，由于更强大的计算机出现，贝叶斯方法在近年来变得流行。\n\n### 朴素贝叶斯\n\n\
  简单的贝叶斯模型之一，也是简单的机器学习方法之一是朴素贝叶斯分类器。它是一种生成式概率模型，通常是机器学习项目的起点，因为它与其他分类器相比，即使在大数据集上运行也极快，且实现简单。在实践中，朴素贝叶斯分类器因其易用性而被广泛使用，尽管它很简单，但在许多机器学习问题已被证明是有效的。例如，垃圾邮件过滤器经常使用贝叶斯过滤来计算邮件是垃圾邮件或正常的概率。它使用词频（词袋）作为输入来检测垃圾邮件，并证明是一种有效的过滤方法。朴素贝叶斯分类器引入了所有变量\
  \ `v[j]` 独立独立的假设。这是一个天真的假设（因此得此名），因为变量之间通常相互依赖。这一假设将方程 4.7 = P(c) * PI_{j=1 to n}\
  \ P(v_j|c) / P(x)\n```\n\n其中：\n- `x`：`n` 个属性的向量\n\n当假设成立时，朴素贝叶斯分类器与所有其他分类器相比是最准确的\
  \ [10]。但在实践中，变量之间可能存在依赖关系。\n\n\n\n\n尽管独立假设通常是错误的，但朴素贝叶斯分类器在实际应用中的表现依然惊人，即使训练数据集很小也是如此。它的优点之一不仅返回预测结果，还返回确定程度，这通常非常有用。此外，它使得处理缺失值变得简单。由于其简单性，朴素贝叶斯分类器比神经网络更不容易过拟合。除了文本分析外，它还用于天气预测、医学诊断、人脸识别和推荐引擎等。\n\
  \n## 4.1.3 决策树\n\n决策树或决策树归纳另一种广泛使用的分类器。决策树归纳是从带有标签的训练元组中学习决策树 [[10]]。它生成一个树形结构，其中除叶节点外的每个节点代表一个属性的决策。树是计算机科学中最常见且最强大的数据结构之一。[图\
  \ 4.7]显示了一个简单的决策树，根据温度和湿度属性预测是否可能发生雷暴。\n\n顶端节点称为根节点，持有第一个属性；端节点称为叶子节点，持有类别标签。分支代表对属性进行决策的结果。在[图\
  \ 4.7]中，我们有两个只有“是”或“否”的二分划分。划分可以多于两个。在这种情况下，我们有一个非二叉树。例如，我们想根据“收入”、“年龄”、“家庭状况”等属性预测潜在客户将购买什么类型的汽车。我们可能会有一个包含三个分支的划分，如“家庭用车”、“跑车”和“豪华车”。\n\
  \n![Figure 4.7: Decision tree.](img/fig4_7.jpg)\n\n**[图 4.7:]** 决策树。\n\n新数据从根节点开始遍历决策树，然后传递到叶节点。在向叶子节点进展的过程中，每个节点都会评估一个特征，直到接收实例的分类结果（类别标签）。如果目标变量是类别的（例如“家庭用车”、“跑车”等），它就是分类树；如果目标变量是连续的，它就是回归树。在最简单的情况下，决策树可以由一组\
  \ if-then 规则（逻辑析取）组成。决策树类似于流程图，由于由节点和节点之间的边组成，因此本质上是受限的图。\n\n开发创建决策树的算法比使用它复杂得多。然而，大多数算法都基于相同的原理。在每一步中，我们应该根据已知知识选择能提供最多信息的属性。如果我们想对对象进行分类，在问“它是卡车吗？”之前，应该问更通用的问题，如“它是车辆吗？”。根据某些先验知识决定每个问题提供了多少信息是信息理论的任务，并且具有挑战性。幸运的是，决策树生成的算法（如\
  \ `ID3`、`C4.5` 和 `CART`）已经存在了几十年。\n\n评估树的方法与其他分类器不同。我们使用`Gini index`或`entropy`来确定不纯度。Gini\
  \ 指数也称为 Gini 系数、Gini 不纯度或 Gini 比例，是经济学中使用的离散度量，用于表示一个国家的财富分布。在构建决策树时，它介于 0 和 1 之间。如果分离是完美的，Gini\
  \ 指数为 0。如果指数为 1，则属性在两个划分中分布均匀。因此，我们希望划分具有较低的 Gini 指数。`CART`算法使用 Gini 不纯度。Gini 指数定义为：\n\
  \n```\nD = 1 - \\sum_{i = 1}^{c}p_{i}^{2}\n```\n\n其中：\n- `p_i`: `D` 中的元组属于类别 `i`\
  \ 的概率\n- `c`: 类别数量\n\n信息增益基于信息理论中熵的概念。信息增益是父节点的熵减去子节点的熵。它通过类别概率的`log`对类别概率进行加权。熵的定义为：\n\
  \n```\nE = \\sum_{i = 1}^{c}{- p_{i}\\log_{2}p_{i}}\n```\n\n其中：\n- `p_i`: 子节点中每个类别的百分比\n\
  - `c`: 类别数量\n\n熵值越小越好，换句话说，父节点之间的熵差异越大。Gini 指数的上限是 1，而熵的最大值取决于类别的数量。它是基于`log`的，对于两个类别，最大熵为\
  \ 1；对于四个类别为 2，以此此类推。\n\n由于几个原因，决策树是非常受欢迎的分类器。决策树直观且易于解释。它们通常与文本特征而非数值特征一起使用，使其人类可读。构建树的计算成本相当低，而使用它的成本更低：`O(log\
  \ N)`，其中`N` 是数据点的数量 [[25]]。决策树分类器的构建不需要任何领域知识或参数设置，因此适用于探索性知识发现 [[10]]。决策树可以用一组逻辑析取来表示，这些析取可以很容易地编程。\n\
  \n随机森林\n\n\n\n\n\n随机森林是一种集成学习器，它通过结合多个决策树模型，仅使用单个弱决策树就能形成一个更强大的学习器。这是一种分而治的方法，用于提高单个决策树模型的性能。随机森林集成器对每个单独决策树的结果取平均值。简单来说，随机森林创建了多个决策树并将它们合并以获得更好的预测。随机森林通常使用袋装法（bagging）进行训练。在\
  \ bagging 中，多个模型（这里是决策树）在训练数据的子集上进行训练，其中子集中的数据点是随机有放回选择的（自助法）。bagging 通过减少方差来提高预测性能。决策树对训练数据非常敏感。当训练数据发生变化时，生成的决策树可能会非常不同，因此结果也可能差异巨大。bagging\
  \ 通过平均每个模型的预测来改进结果。例如，如果我们有五棵决策树，每棵树都用不同的训练数据子集进行训练，每棵树产生的天气预报为：“晴”、“晴”、“多云”、“雨”、“晴”，我们取频率最高的预测结果：“晴”。bagging\
  \ 算法的工作原理如下：\n\n1. 以有放回的方式创建训练数据集的随机子集，这意味着相同的数据可以被重复使用\n2. 使用随机子集训练每棵决策树\n3. 使用新数据集计算所有决策树的平均预测值\n\
  \n使用 bagging 时，我们不关心单个树的偏差和方差。通常情况下，它们具有高方差和低偏差。树的数量需要通过实验来确定，例如通过在每次运行中增加树的数量，直到预测性能不再提高为止。bagging\
  \ 可以像决策树一样用于分类和回归。bagging 将在第 9 章中进行详细描述。\n\nbagging 的一个问题是树之间通常非常相似，因此它们的预测结果是高度相关的。如果结果之间不相关或仅弱弱相关，集成器的效果会更好。随机树通过改变子树的训练方式，使得单棵树的结果不相关。随机森林背后的原理非常简单。`CART`算法在决定最佳分裂特征时会查看所有变量。随机森林算法从变量中随机选择一个子集，从中选择最佳特征进行分裂。随机特征的数量\
  \ `n` 需要预先定义并通过实验确定。分类的良好起点是 $n = \\sqrt{p}$，其中 `n` 是随机特征的数量，`p` 是特征的总数，回归则取 $n\
  \ = \\frac{p}{3}$。通常情况下，`n` 越小，树间的相关性越小，单棵树的强度越低。图 4.8 展示了一个由三棵决策树组成的随机森林。\n\n![图\
  \ 4.8：随机森林。](img/fig4_8.jpg)\n\n**图 4.8：** 随机森林。\n\n未用于训练的实例（留样本）可用于估计随机森林的性能。随机森林可以用于分类和回归。它们可以处理缺失或不平衡的数据。与其他机器学习算法相比，它们不容易过拟合。随机森林几乎总是优于决策树。随机树的典型应用包括银行交易中的欺诈检测系统、推荐引擎和特征选择。\n\
  \n### 4.1.4 支持向量机 支持向量机（SVM）是一种广泛用于分类和回归的机器学习算法，它通过解决一个优化问题来工作。相比于神经网络，支持向量机通常更简单，且可以获得高精度。支持向量机的核心思想是在\
  \ n 维空间中找到一个能够区分类别的超平面。在二维空间中，超平面就是一条直线。在支持向量机中，我们使用特征的线性组合来预测 `y`，这与神经网络是相同的。如果我们有两个维度，如图\
  \ 4.10\n\n**图 4.9：** 支持向量机。\n\n在二维空间中，超平面为直线。超平面的维度比空间低一。使用支持向量机，我们拥有输入 `x[1]`、`x[2]`……`x[n]`\
  \ 以及一组权重 `w[i]`，通过线性组合进行预测。这与神经网络是相同的。然而，在使用支持向量机时，我们通过使用支持向量来优化间隔。换句话说，我们只使用对决定超平面位置和方向重要的特征。这是与神经网络的主要区别。如果我们有两个维度，如图\
  \ 4.10 所示，我们寻找 `a, b, c` 使得数据是线性可分的。在支持向量机中，超平面是位于 `n` 维空间中的。在两个坐标系中，可以看到 `a, b,\
  \ c` 有许多可能的解，因此有许多可能的超平面，但可能都不是最优的。在图 4.10 的左侧坐标系中，可以看到，取决于超平面的位置，间隔可以更宽（`b11`）或更窄（`b2`）。\n\
  \n![图 4.10：支持向量机超平面。](img/fig4_10.jpg)\n\n**图 4.10：** 支持向量机超平面。\n\n与线性回归或神经网络考虑所有数据点不同，使用支持向量机时，只有训练集中的支持向量会影响超平面的位置。支持向量恰好触及间隔的边界。\n\
  \n\n\n\n\n$\\begin{array}{lll} {w^{T}x + b \\geq 0} & {for} & {d_{i} = + 1} \\\\\
  \ {w^{T}x + b < 0} & {for} & {d_{i} = - 1} \\\\ \\end{array}$\n\n其中\n\n|  `d` ||=\
  \ 分离间隔 (Margin of separation) |\n| --- | --- |\n\n间隔 `d` 是超平面与最近数据点之间的距离。最大间隔即为最优超平面。在现实世界中，数据通常带有噪声，无法通过超平面进行完美分离。因此，最大间隔规则通过引入称为松弛变量（slack\
  \ variables）的额外系数被放宽。这允许某些数据点落在超平面的错误侧。这被称为软间隔分类器（soft margin classifier）。然而，引入新系数增加了复杂性并需要更多的计算能力。\n\
  \n正如我们之前所看到的，数据往往不是线性可分的。图 4.11 中左侧图中的数据点无法用直线分隔。为了解决这个问题，我们可以使用核技巧（kernel trick）。我们使用函数\
  \ `φ` 将数据映射到不同的空间。为了实现这一点，我们不使用数据点本身，而是使用任意两个数据点的内积。使用 `φ` 而不是计算点积 `x[i]`·`x[j]`，我们必须计算\
  \ `φ(x[i])·φ(x[j])`，其中 `x[i]` 和 `x[j]` 是两个特征向量。这在计算上是非常昂贵的。使用核函数 `K`，使得 `K(x[i],\
  \ x[j]) = φ(x[i])·φ(x[j])`，我们不需要计算甚至不需要 `φ`。换句话说，核函数定义了变换空间中的内积。\n\n![图 4.11: 核技巧。](img/fig4_11.jpg)\n\
  \n**图 4.11:** 核技巧。\n\n核定义了变换空间中新数据点与支持向量之间的相似性。点积是相似性的度量。核函数泛化了“内积相似性”的概念。\n\n核有许多不同类型。多项式核和径向核（radial\
  \ kernels）将输入空间转换为更高维。多项式核不需要点积。多项式核可以写为：\n\n| `K(x,x[i])` = `(x·x[i]+1)^(p)` ||\
  \ (4.12) |\n| --- | --- |\n\n|  `p` ||= 先验定义 |\n| --- | --- |\n\n幂 `p` 需要用户定义。如果\
  \ `p = 1`，则为线性核。多项式核允许输入空间中存在弯曲超平面。\n\n径向核可以写为：\n\n| $K\\left( {x,x_{i}} \\right)\
  \ = exp\\left( {- \\frac{\\\\left\\| {x - x_{i}} \\right|^{2}}{2\\sigma^{2}}} \\\
  right)$ || (4.13) |\n| --- | --- |\n\n|  `σ[2]` ||= 先定义的宽度 |\n| --- | --- |\n\n\
  这是一个径向基函数（radial basis function）。径向基函数的输出完全取决于输入与原点的距离。宽度 `σ` 通常在 0 到 1 之间，可以被认为是决策区域的扩散程度。径向核可以在特征空间内创建复杂的区域。径向基函数偶尔也用作神经网络中的激活函数。\n\
  \n学习支持向量机是一个优化问题。我们可以使用随机梯度下降来搜索超平面的系数。然而，还有更高效的方法，例如序列最小优化法（sequential minimal\
  \ optimization method）。支持向量机得到了广泛研究，有很多关于该主题的论文和书籍。在这里我们只能涵盖基本概念。\n\n支持向量机有很多应用。由于其多功能性且通常更简单，它们的超参数较少，并且通常优于神经网络。它们被广泛应用于生物和其他科学的分类任务。它们也被应用于文本分类、图像分类和手写识别。核不仅可以定义在向量上，还可以定义在树、字符串等。尽管即使是最快的支持向量机的训练时间也可能非常缓慢，但由于其建模复杂非线性决策边界的能力，它们非常准确\
  \ [10]。人工神经网络相对于支持向量机的一个明显优势是，人工神经网络可以任意数量的输出，而支持向量机只有一个。然而，支持向量机和神经网络都是黑箱，不如决策树等那样直观理解。\n\
  \n## 4.1.5 k-近邻\n\nk-近邻（k-NN）是一种广泛使用的分类技术，也可以用于回归。它被广泛使用是因为输出可以很容易解释，且需要的计算时间短。k-近邻属于懒学习者（lazy\
  \ learners）一类。与支持向量机或决策树等急进学习者相反，学习并不在训练实例出现时立即发生，而是在新实例出现后才发生。急进学习创建一个模型。懒学习者（如\
  \ k-近邻）将学习推迟到看到新实例。这是基于实例的学习（instance-based learning），需要部署测试实例。基于实例的学习也称为基于内存的学习，因为训练实例被存储在内存中。k-近邻是最简单的机器学习算法之一。如果用于分类，输出是类别成员身份，即离散值。如果用于回归，输出是对象的数值，即连续值。k-近邻利用特征相似性来确定训练与新实例之间的距离。有时会使用多个邻居并取距离的平均值。此时被称为\
  \ k-邻居，其中 `k` 是邻居的数量。在图 4.12 的左象限中，`k = 3`，星形实例属于灰色类别。在右象限，如果 `k = 3`，新实例也属于灰色类别，因为\
  \ 3 个邻居中有 2 个是灰色，只有一个属于深灰色类别。如果 `k = 5`，新实例属于深灰色类别，因为最近的实例中有 3 个是深灰色。因此，选择参数 `k`\
  \ 对于该算法至关重要。\n\n基于实例的学习者的复杂度随训练数据而增加。训练实例越多，需要的计算能力越大。基于实例的学习者的一个优势是能够适应新数据。它们只需存储新的训练实例，而不需要重新训练模型。\n\
  \n\n\n\n如前所述，选择 `k` 对于 k-近邻算法至关重要，因为不同的 `k` 值可能会产生不同的预测。由于 `k` 是基于多数投票的，较小的 `k`\
  \ 会使得预测变得不太稳定，因为只有少数实例决定了类别分配。随着 `k` 的增大，决策边界会变得不明显。找到最优的 `k` 值并不是一项易事，需要经过一些尝试和错误。我们可以从较低的\
  \ `k` 开始确定预测的准确性，然后不断增加 `k`，直到准确性不再提高或变差。将 `k` 设置为奇数是一个良好的做法，否则我们可能会出现平局，例如在二分类中，A\
  \ 类 2 票，B 类 2 票。\n\n几点备注：k-近邻是一种非参数、懒性学习算法。非参数意味着该算法对底层数据分布不作任何假设。这使得在没有底层数据分布先验知识的情况下，k-近邻是一个很好的选择。现实世界的数据并不符合理论假设，这使其成为许多非线性数据集的“自然”选择。k-近邻也易于理解和解释，但仍然提供高准确性，使其成为机器学习项目的良好起点。缺点是，由于\
  \ k-近邻存储了所有或几乎所有的训练数据，它需要大量的内存和计算能力，特别是当 `k` 很大时。\n\nk-近邻的一个典型应用是市场细分。具有年龄、收入、家庭状况等相似特征的人可能具有相似的购买行为。因此，k-近邻可以用于推荐引擎和营销活动。然而，如果数据量过大（例如\
  \ Netflix 或亚马逊等极其庞大的数据集），k-近邻就不再可行了，因为每个新实例都必须与所有训练实例进行比较。确定信誉是 k-近邻的另一个应用。具有相似财务特征的人将获得相同的信用评级。\n\
  \n## 4.2 回归分析\n\n回归分析是一组用于估计变量之间关系的统计方法。它被用于确定变量之间是否存在相关性。回归分析可能是最重要的数据分析方法之一。线性回归和逻辑回归是机器学习中最流行的回归分析算法，但还存在更多方法。\n\
  \n回归分析被用于做出数据驱动的决策，例如预测（如预测销售额）、时间序列分析（例如一段时间内股价的变化）或相关性分析。然而，重要的是，相关性并不意味着因果关系。如果回归线很好地拟合了一组数据点，这并不意味着存在因果关系。例如，在雨天，人们往往比晴天更倾向于购物。天气与销售额之间存在相关性，但这并不意味着坏天气导致了销售。\n\
  \n![图 4.13: 回归分析。](img/fig4_13.jpg)\n\n**[图 4.13:]** 回归分析。\n\n本质上，回归分析旨在对一组数据点拟合直线或曲线，使得直线或曲线到数据点的距离最小化。`图\
  \ 4.13` 显示了拟合到一组数据点的回归曲线。\n\n关于 `图 4.13` 的备注：\n\n- 并非所有点都在曲线上，某些点可能离回归线很远\n- 回归线是一个近似值\n\
  - 它指示了因变量和自变量之间是否存在显著关系\n- 可以使用不同的尺度来比较所测量变量的影响\n\n回归分析是一种用于理解输入变量和输出变量之间关系的统计方法。在机器学习中，我们更关注如何通过最小化模型误差来做出准确预测。我们使用回归来确定：\n\
  \n1. 一组预测变量对结果（因变量）的预测效果如何\n2. 特别哪些变量对结果是重要的\n\n有许多不同的回归技术可以进行预测。此外，还可以创建新的回归方法。在\
  \ `图 4.13` 中，拟合了一条条曲线，因为直线无法为数据点提供良好的拟合。哪种回归方法最合适主要取决于三个因素：\n\n- 自变量的数量\n- 因变量的类型\n\
  - 回归线的形状\n\n回归分析用于解释现象（例如，为什么上个月销售额会下降），为了对未来做出预测（例如每天吸烟量与心脏病风险的关系），或者支持决策过程（例如哪种促销活动对销售额的影响最大）。回归分析让我们从数学上确定哪些变量有影响，哪些因素最重要，哪些可以忽略，因素之间是如何相关的，最重要的是，我们对这些因素有多大的把握。\n\
  \n除了线性回归和逻辑回归，还有其他类型，例如多项式回归、lasso（最小绝对收缩和选择算子）回归以及逐步回归或岭回归等。如果需要，还可以组合回归模型。通常首先使用线性模型。如果找不到合适的拟合模型，可以尝试非线性模型，因为非线性模型可以拟合更广泛的曲线。\n\
  \n与所有机器学习方案一样，回归分析的第一步是收集数据。例如，如果我们想预测下季度的销售额，我们首先收集过去一年的销售额，并如 `图 4.14` 左象限所示绘制。\n\
  \n![图 4.14: 回归分析步骤。](img/fig4_13.jpg)\n\n**[图 4.14:]** 回归分析步骤。\n\n`y` 轴显示销售额（因变量），`x`\
  \ 轴显示季度。`y` 轴总是因变量，即我们想要预测的变量。每个数据点代表一周的数据。右象限的曲线总结了销售额与季节之间的关系。这些销售商品可能是夏季卖得比冬天更多的烧烤用品。\n\
  \n### 4.2.1 线性回归\n\n线性回归是研究两个连续变量之间关系的统计方法。它是机器学习中最简单的方法之一。线性回归试图通过对观测数据拟合线性方程来估计标量因变量和自变量（解释变量）之间的关系。如果存在一个自变量，称为简单线性回归；如果存在多个自变量，则称为多元线性回归。\n\
  \n\n\n\n![图 4.15: 过拟合的回归曲线。](img/fig4_15.jpg)\n\n**图 4.15：** 过拟合的回归曲线。\n\n线性回归是一种用于预测分析的基本方法。它是一种对因变量\
  \ `y` 与一个或多个解释变量或独立变量 `x` 之间关系进行建模的线性方法。线性方程 4.14\n\n| `y`  = `a`*x`  + `b` || (4.14)\
  \ |\n| --- | --- |\n\n其中\n\n|  `x` || \\= 独立变量 |\n| --- | --- |\n|  `y` || \\= 因变量\
  \ |\n|  `a` || \\= 斜率 |\n|  `b` || \\= 截距 |\n\n只有一个因变量和一个独立变量的回归方程的最简单形式。`a` 和 `b`\
  \ 是系数，也称为回归系数或权重。线性回归假设输入变量或变量 `x` 与单一输出变量 `y` 之间存在线性关系。使用机器学习，这些系数是从数据中学习的。换句话说，我们试图为给定的数据点找到拟合直线。在机器学习中，变量被称为特征（feature）。因变量在机器学习术语中被称为目标（target）、预测器或标签（label）。\n\
  \n图 4.16 显示了拟合数据的回归线。\n\n如果数据无法进行线性拟合，则多项式或曲线可能更好地拟合，此时可以使用多项式回归或曲线回归等技术。\n\n描述\
  \ `y` 如何与 `x` 关系的方程称为回归模型。它在方程 4.14 中给出。它根据已知 `x` 值计算 `y` 的平均值。在训练过程中，调整系数 `a` 和\
  \ `b` 直到找到最佳拟合线，即回归线。这是通过最小化数据点与回归线之间距离的平方差和来实现的。\n\n首先，我们需要确定因变量和独立变量之间是否存在关系。例如，我们可能想确定体重与预期寿命之间是否存在关系。如果存在关系，我们就可以预测新体重的预期寿命。\n\
  \n![图 4.16: 线性回归。](img/fig4_16.jpg)\n\n**图 4.16：** 线性回归。\n\n拟合线性回归的最常用的方法是普通最小二乘法（ordinary\
  \ least squares method）。这也被称为普通最小二乘线性回归或简称最小二乘回归。普通最小二乘法通过计算每个数据点到回归线的距离、将其平方并将所有平方相加来估计系数值。普通最小二乘法试图最小化平方误差和。普通最小二乘回归的变体包括\
  \ Lasso（最小绝对收缩和选择算）回归和岭回归（ridge regression）。Lasso 回归也旨在最小化平方误差和，但它还执行特征选择。岭回归旨在最小化平方误差和。\n\
  \n#### 简单回归\n\n简单回归（也称为双变量回归）由对组成，包含一个独立变量 `x` 和一个因变量 `y`。直线即为预测。最佳拟合是预测误差尽可能小的。\n\
  \n`x` 与 `y` 之间的关系在方程 4.15 中表示：\n\n| `y`  = `a`*x`  + `b` || (15) |\n| --- | ---\
  \ |\n\n其中\n\n|  `x` || \\= 独立变量 |\n| --- | --- |\n|  `y` || \\= 因变量 |\n|  `a` ||\
  \ \\= 斜率 |\n|  `b` || \\= 截距 |\n|  `ε` || \\= 误差项 |\n\n误差项 `ε` 代表回归并非完全精确的事实。回归线是偏差之和。如果回归线向上倾斜，我们具有正相关关系；如果向下倾斜，我们具有负相关关系。一些例子是学习小时和考试分数，或者酒精摄入量和血液水平。\n\
  \n#### 多元回归\n\n简单线性回归仅使用一个预测器。在许多现实世界问题中，存在多个独立变量，因此被称为多元回归或多元回归。多元回归试图通过对数据点拟合线性方程来对解释（独立）变量与响应（因）变量之间的关系建模。\n\
  \n给定 `n` 个观测值，模型定义可以如方程 4.16 所示：\n\n| `y`  = `β[0]` + `β[1]`x[1]`  + `β[2]`x[2]`\
  \  +… `β[n]`x[n]`  + `ε` || (16) |\n| --- | --- |\n\n其中\n\n|  `x` || \\= 预测变量 |\n\
  | --- | --- |\n|  `y` || \\= 因变量 |\n|  `β` || \\= 回归系数 |\n|  `n` || \\= 观测值数量 |\n\
  |  `ε` || \\= 误差项 |\n\n多元回归假设：\n\n- 因变量与独立变量之间存在线性关系\n- 独立变量之间没有过度相关；不存在多共线性\n-\
  \ 回归残差呈正态分布\n\n由于我们有多个独立变量 `x`，我们正在多维空间中拟合一个超平面。如果我们有 `n` 个独立预测变量，我们尝试在 `n + 1`\
  \ 维空间中拟合一个超平面。为了找到最佳拟合超平面，可以使用与简单线性回归相同的方法并最小化残差和。使用多个独立变量的例子包括估计取决于位置、房屋大小、年龄等的房屋价格。\n\
  \n### 4.2.2 多项式回归\n\n\n\n\n\n当变量 `x` 和 `y` 之间存在非线性关系时，可以使用多项回归。因变量 `y` 与自变量 `x`\
  \ 之间的关系使用 `n` 次多项式进行建模。对于单个预测变量 `x`，该模型定义如方程 4.17 所示：\n\n| `y`[`i`] = `β`[`0] + `β`[`1]``x`[`1]` + `β`[`2``x`² + … + `β`[`n`]`x`^(*n*) + `ε`\
  \ || (4.17) |\n| --- | --- |\n|  `x` || \\= 预测变量 |\n| --- | --- |\n|  `y` || \\\
  = 因变量 |\n|  `β` || \\= 回归系数 |\n|  `n` || \\= 多项式次数 |\n|  `ε` || \\= 误差项 |\n\n多项回归可以拟合非线性模型，但由于回归函数是线性的，因此它被视为多元线性回归的一个特例。尽管\
  \ `x`² 是二次的，但未知系数 `β`[`0]`、`β`[`1]`… 是线性的，且估计器将 `x[n]` 视为另一个变量。我们可以像多元线性回归一样，使用最小二乘等相同的分析程序。\n\
  \n方程 4.17 相对简单，但多项回归模型可以包含更多的预测变量。寻找多项式的阶并不是直观的。根据经验法则，多项式的次数不应超过样本量的一半。良好的做法是绘制数据和拟合曲线，然后使用人类判断来评估主观的拟合优度：确定“实际意义”与“统计显著性”。\n\
  \n在拟合多项回归模型时需要考虑的几条指南是：\n\n- 你不应超出样本数据点的范围进行外推\n- 如果模型包含 `x^n` 且 `x^n` 显示出统计学显著的预测能力，你也应该包含\
  \ `x^m`（其中 `m` < `n`），即使 `x^m` 的显著性较低\n- 如果生成的曲线图看起来合理，仅使用统计显著性来支持一个模型\n\n## 4.3\
  \ 逻辑回归\n\n逻辑回归（LR）或称为 logit 回归，用于根据一个或一组离散解释值来估计二分类因变量。它是机器学习中广泛使用的模型，应用于许多不同领域。逻辑回归不需要因变量和自变量之间存在线性关系。当因变量是二分类（二分）的，例如\
  \ 0/1 或真/假时，它用于分类。这就是为什么它也被称为二分类逻辑回归。逻辑回归计算事件（如成功/失败）发生的概率。如果因变量超过两个类别，则被称为多项回归。\n\
  \n逻辑回归的核心是逻辑函数。逻辑函数或 logit 函数是一个 sigmoid 曲线。sigmoid 曲线是 0 到 1 之间的一个 S 形曲线，它永远不会达到\
  \ 0 或 1，如图 17 所示。数学上，logit 函数的定义如方程 18 所示。\n\n| $logit( x) = \\frac{1}{1 + e^{-\
  \ x}}$ || (4.18) |\n| --- | --- |\n|  `x` || \\= 自变量 |\n| --- | --- |\n|  `e` ||\
  \ \\= 欧常数 |\n\n![图 17：逻辑回归](img/fig17.jpg)\n\nlogit 函数将实数 `x` 映射到 0 到 1 之间。在逻辑回归中，logit\
  \ 函数可以如下形式所示：\n\n| $p(x) = \\frac{1}{1 + e^{-(\\beta_{0} + \\beta_{1}x}}}$ || (4.19)\
  \ |\n| --- | --- |\n|  `x` || \\= 自变量 |\n| --- | --- |\n|  `e` || \\= 欧常数 |\n|  `β`[`0]`\
  \ || \\= 截距 |\n|  `β`[`1]` || \\= 回归系数 |\n\n`p` 是因变量属于某一类（如“成功”或“失败”）的概率。由于因变量是二分类（二分）的，逻辑回归预测输出为\
  \ 0 或 1。在实践中，我们使用阈值 0.5：\n\n```\ny = \\begin{cases} {1,} & \\text{if}p \\geq 0.5\
  \ \\\\ {0,} & \\text{otherwise} \\end{cases}\n```\n\n$\\beta_{0}$ 和 $\\beta_{1}$\
  \ 在训练期间学习。极大似然估计是用于优化系数的常用算法，在逻辑回归中被用于许多机器学习算法。极大似然估计利用似然函数来最大化观测数据，从而最小化预测误差。将在第\
  \ 7 章详细介绍。逻辑回归研究诸如：每多抽一包烟患癌症的概率。使用逻辑回归需要注意的几点：\n\n- 逻辑回归可能难以解释\n- 预测变量之间不应存在高度相关（共线性）\n\
  - 为了表现良好，逻辑回归需要较大的样本量\n- 逻辑回归假设输出变量没有误差，因此，分类错误的样本应从数据集中移除\n\nlogit 函数也用于人工神经网络作为激活函数。逻辑回归已成为许多二分类问题的首选方法。逻辑回归广泛应用于医学，预测患者的死亡或疾病的严重程度。它也被用于生命科学或营销，预测客户流失或营销活动的效果。它还用于地震预测或根据地震活动寻找新油田。\n\
  \n\n\n\n为了评估监督机器学习方案的学习效果如何，我们通常使用未用于过训练的标记数据。通常，我们将数据划分为三个数据集：一个用于训练，一个用于评估，一个用于测试学习器。训练集用于训练学习算法，验证集用于优化学习算法的参数，测试数据集则用于计算最终训练好的算法的真实错误率。每个数据集都需要相互独立，以便获得对错误率的可靠估计。数据集通常被随机划分为三部分。每个数据集都需要具有代表性，且任何特征都不应在某一个集合中被过度代表或代表不足。集合的比例取决于问题和可用数据量。通常使用最大比例用于训练，我们可能会使用如\
  \ 60:20:20 或 70:15:15 的比例。缺点是这减少了我们可用于训练的数据量。如果数据短缺，可以使用 `k`-折交叉验证等技术。将数据随机划分为 `k`\
  \ 个数据子集，使用 `k - 1` 个数据集进行训练，并将一个留出数据集作为验证集。重复此过程，直到 `k` 个子集都作为评估集使用过一次。\n\n学习器也需要进行评估，以便它可以与其他学习器进行比较。通常，会训练多个模型，我们希望使用最适合我们问题的学习方案。无论我们只训练一个学习算法还是训练多个，我们仍然需要评估结果的好坏。\n\
  \n有很多不同的指标可以衡量预测器的性能，但并非所有指标都适用于所有学习器。某些适用于分类，而另一些可能适用于回归分析。\n\n评估学习器是一项重要任务，因为它能告诉我们训练好的模型在新数据上的表现将如何。事实上，改进的评估方法为机器学习和深度学习近期的成功做出了贡献。\n\
  \n## 5.1.1 准确率\n\n评估分类模型的一个指标是准确率。准确率简单是指模型分类正确的预测占比例。形式上，准确率定义为：\n\n| $Accuracy\
  \ = \\frac{Number\\ of\\ correct\\ predictions}{Total\\ number\\ of\\ predictions}$\
  \ || (5.1) |\n| --- | --- |\n\n然而，准确率并不能说明问题。假设我们要将组织样本的医学图像分类为癌性组织和良性组织。假设我们有 100\
  \ 个样本，其中 91 个是良性的，9 个是癌性的。如果分类器正确地确定了 90 个组织样本为良性，1 个为癌性，使用 [公式 5.1]，我们得到的准确率为 $\\\
  frac{90 + 1}{100} = 0.91$。91% 是一个非常好的准确率，然而，9 个癌性样本中只有 1 个被正确分类为恶性。尽管准确率很高，但大多数恶性样本未被诊断。换句话说，我们需要考虑误分类的数量。在数据集类别不平衡的情况下，准确率的表现特别糟糕，这意味着存在巨大的差异。准确率对待所有样本一视同仁。\n\
  \n### 5.1.2 精率和召回\n\n评估学习器是一项重要任务，因为它能告诉我们训练好的模型在新数据上的表现将如何。事实上，改进的评估方法为机器学习和深度学习近期的成功做出了贡献。\n\
  \n（注：原文中存在大量重复内容，译文已根据核心逻辑进行翻译并整理。）\n\n\n\n\n![图 5.3: 多类混淆矩阵。](img/fig5_3.jpg)\n\
  \n**[图 5.3:]** 多类混淆矩阵。\n\n还有其他变体。混淆矩阵可以包含微平均（micro-averaged）结果，它是所有对多（one-versus-all）矩阵中结果之和。如果我们我们将主对角线元素之和除以矩阵中所有元素之和（得到正确回答的比例），我们就得到了准确率\
  \ `[[25]]`。我们可以将准确率定义为真正例数量与真负例数量的和除以样本总数，如[公式 5.5] 所示。\n\n| $Recall = \\frac{TP\
  \ + TF}{TP + FP + TN + FN}$ | (5.5) |\n| --- | --- |\n\n我们已经看到准确率并不能为我们提供分类器性能的全貌，可以使用精确率（precision）和召回率（recall）来帮助我们解释结果。另一个有用的指标是受试者工作特征。\n\
  \n### 5.1.4 受试者工作特征\n\n受试者工作特征（`ROC`）是真正例率（也称为敏感性或召回率）随假正例率（也称为特异性）变化的函数图。它被用于衡量不同阈值设置下二分类分类器的性能。真正例率是如[公式\
  \ 5.3] 中定义的敏感性或召回率。假正例率是 1–特异性，其中特异性的定义如[公式 5.6]：\n\n| $Specificity = \\frac{TN}{TN\
  \ + FP}$ | (5.6) |\n| --- | --- |\n\n假正例率的定义如[公式 5.7] 所示：\n\n| $FPR = 1 - Specificity\
  \ = \\frac{FP}{TN + FP}$ | (5.7) |\n| --- | --- |\n\n对于完美的分类器，受试者工作特征曲线将沿 y 轴直向上移动直到达到\
  \ `y = 1`，然后沿 x 轴移动（100% 敏感性，100% 特异性）。如果受试者工作特征曲线是对角线，则这些值是完全随机的。ROC 曲线上的每个点都代表对应特定决策阈值的敏感性/特异性对。通常，曲线位于对角线上方的某处。曲线越靠近左上角，分类器的准确性越高。[图\
  \ 5.4] 显示了受试者工作特征曲线。它也被称为曲线下面（`AUC`）或 `AUC-ROC`。曲线下的面积是分类器对随机选择的数据点的评分高于随机选择的负样本数据点的概率。通过观察[图\
  \ 5.4]，可以使用受试者工作特征曲线来选择一个阈值，在最大化真正例的同时最小化假正例。\n\n![图 5.4: 受试者工作特征。](img/fig5_4.jpg)\n\
  \n**[图 5.4:]** 受试者工作特征。\n\n受试者工作特征曲线允许我们评估分类器在其整个工作范围内的性能。在机器学习中，受试者工作特征曲线通常用于比较统计模型。可以使用单个阈值来比较两个或多个分类器在该点的的性能，也可以比较整条曲线。小于\
  \ 0.5 的受试者工作特征曲线可能表明分类器发现的关系与我们的预期相反，且实验可能设置得错误。\n\n使用受试者工作特征曲线诊断具有两个以上类别的分类器需要更多维度，且复杂度急剧增加。目前已有尝试使用用于三类别的受试者工作特征曲线，称为三分类\
  \ `ROC`。由于受试者工作特征曲线的流行，人们已尝试使用它来评估其他监督模型。即，已经提出了用于回归模型的受试者工作特征，称为回归误差特征（`REC`）曲线和回归\
  \ ROC（`RROC`）曲线。\n\n# 第 6 章\n\n# 无监督学习\n\n**目录**\n\n## 6.1 聚类类型\n\n### 6.1.1 基于质心、中值点和基于原型的聚类\n\
  \n### 6.1.2 基于密度的聚类\n\n## 6.2 k-means 聚类\n\n## 6.3 层次聚类\n\n## 6.4 聚类的可视化\n\n## 6.5\
  \ 聚类评估\n\n### 6.5.1 轮廓系数\n\n\n\n\n\n聚类有许多应用。它已被应用于生物学，将动物和植物归类为种、属、科等。最近，它也被应用于遗传学，用以寻找基因组之间的相似性，并识别可能存在致病基因突变的区域。其他应用还包括营销研究，将消费者归类为某些产品或服务的潜在买家。异常检测在最近的研究中引起了广泛关注，因为它能够检测网络流量中的异常并防御潜在的威胁和数据泄露，或者根据机器传感器数据中的异常帮助防止工厂停机。聚类被用于图像分割，以检测图像中的区域用于目标识别。聚类还被用于分析地震数据，以寻找新的油源或检测地震区域的危险区域。此外许多许多应用领域。需要注意的是，在许多现实世界的应用中，“类”的概念并没有明确定义，这可能导致意外的类或某些实例落入错误的类中。例如，在对书籍进行聚类时，一位政治人物的传记可能会被分到政治类而不是传记类。由于在聚类项目开始时，所需的类数量通常是未知的，因此可能会出现一个或多个意外的类，例如，一个包含政治人物传记的类。聚类定义的模糊导致了许多不同的聚类算法。此外，不同的聚类方法在文献中的分类方式也不同。\n\
  \n由于聚类将数据分成具有相似特征的划分，因此它可以被看作一种分类方法。然而，在聚类中，标签是从数据中得出的，且通常不是预先知的。\n\n## 6.1 聚类的类型\n\
  \n聚类可以是排斥性的，即每个实例都属于一个类；聚类也可以是重性的，即某些实例可能属于多个类。硬聚类（Hard clustering）中每个点恰好属于一个类。模糊聚类（Fuzzy\
  \ clustering）中，实例可以属于多个类，类是重叠的。**图 6.1：排斥聚类与非重叠聚类。** \n\n由于在聚类项目开始时，所需的类数量通常是未知的，因此可能会出现一个或多个意外的类，例如，一个包含政治人物传记的类。聚类定义的模糊导致了许多不同的聚类算法。此外，不同的聚类方法在文献中的分类方式也不同。\n\
