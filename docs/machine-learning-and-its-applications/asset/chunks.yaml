    随机森林是一种集成学习器，它通过结合多个决策树模型，仅使用单个弱决策树就能形成一个更强大的学习器。这是一种分而治的方法，用于提高单个决策树模型的性能。随机森林集成器对每个单独决策树的结果取平均值。简单来说，随机森林创建了多个决策树并将它们合并以获得更好的预测。随机森林通常使用袋装法（bagging）进行训练。在
    bagging 中，多个模型（这里是决策树）在训练数据的子集上进行训练，其中子集中的数据点是随机有放回选择的（自助法）。bagging 通过减少方差来提高预测性能。决策树对训练数据非常敏感。当训练数据发生变化时，生成的决策树可能会非常不同，因此结果也可能差异巨大。bagging
    通过平均每个模型的预测来改进结果。例如，如果我们有五棵决策树，每棵树都用不同的训练数据子集进行训练，每棵树产生的天气预报为：“晴”、“晴”、“多云”、“雨”、“晴”，我们取频率最高的预测结果：“晴”。bagging
    算法的工作原理如下：


    1. 以有放回的方式创建训练数据集的随机子集，这意味着相同的数据可以被重复使用

    2. 使用随机子集训练每棵决策树

    3. 使用新数据集计算所有决策树的平均预测值


    使用 bagging 时，我们不关心单个树的偏差和方差。通常情况下，它们具有高方差和低偏差。树的数量需要通过实验来确定，例如通过在每次运行中增加树的数量，直到预测性能不再提高为止。bagging
    可以像决策树一样用于分类和回归。bagging 将在第 9 章中进行详细描述。


    bagging 的一个问题是树之间通常非常相似，因此它们的预测结果是高度相关的。如果结果之间不相关或仅弱弱相关，集成器的效果会更好。随机树通过改变子树的训练方式，使得单棵树的结果不相关。随机森林背后的原理非常简单。`CART`算法在决定最佳分裂特征时会查看所有变量。随机森林算法从变量中随机选择一个子集，从中选择最佳特征进行分裂。随机特征的数量
    `n` 需要预先定义并通过实验确定。分类的良好起点是 $n = \sqrt{p}$，其中 `n` 是随机特征的数量，`p` 是特征的总数，回归则取 $n =
    \frac{p}{3}$。通常情况下，`n` 越小，树间的相关性越小，单棵树的强度越低。图 4.8 展示了一个由三棵决策树组成的随机森林。


    ![图 4.8：随机森林。](img/fig4_8.jpg)


    **图 4.8：** 随机森林。


    未用于训练的实例（留样本）可用于估计随机森林的性能。随机森林可以用于分类和回归。它们可以处理缺失或不平衡的数据。与其他机器学习算法相比，它们不容易过拟合。随机森林几乎总是优于决策树。随机树的典型应用包括银行交易中的欺诈检测系统、推荐引擎和特征选择。


    ### 4.1.4 支持向量机 支持向量机（SVM）是一种广泛用于分类和回归的机器学习算法，它通过解决一个优化问题来工作。相比于神经网络，支持向量机通常更简单，且可以获得高精度。支持向量机的核心思想是在
    n 维空间中找到一个能够区分类别的超平面。在二维空间中，超平面就是一条直线。在支持向量机中，我们使用特征的线性组合来预测 `y`，这与神经网络是相同的。如果我们有两个维度，如图
    4.10


    **图 4.9：** 支持向量机。


    在二维空间中，超平面为直线。超平面的维度比空间低一。使用支持向量机，我们拥有输入 `x[1]`、`x[2]`……`x[n]` 以及一组权重 `w[i]`，通过线性组合进行预测。这与神经网络是相同的。然而，在使用支持向量机时，我们通过使用支持向量来优化间隔。换句话说，我们只使用对决定超平面位置和方向重要的特征。这是与神经网络的主要区别。如果我们有两个维度，如图
    4.10 所示，我们寻找 `a, b, c` 使得数据是线性可分的。在支持向量机中，超平面是位于 `n` 维空间中的。在两个坐标系中，可以看到 `a, b,
    c` 有许多可能的解，因此有许多可能的超平面，但可能都不是最优的。在图 4.10 的左侧坐标系中，可以看到，取决于超平面的位置，间隔可以更宽（`b11`）或更窄（`b2`）。


    ![图 4.10：支持向量机超平面。](img/fig4_10.jpg)


    **图 4.10：** 支持向量机超平面。


    与线性回归或神经网络考虑所有数据点不同，使用支持向量机时，只有训练集中的支持向量会影响超平面的位置。支持向量恰好触及间隔的边界。


