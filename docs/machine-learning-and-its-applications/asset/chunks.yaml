    \ years. Progress in artificial intelligence has been slow in the 1990’s and a\
    \ certain disillusionment was noticeable in research since artificial intelligence\
    \ did not seem to live up to the expectation. Since the beginning of the new century,\
    \ machine learning has seen rapid progress due to new approaches, in particular,\
    \ deep learning. Deep learning goes further back, however, due to recent advances\
    \ in other areas, in particular, the development of graphics processing units\
    \ that provide the necessary computing power, and the Internet, that made an unprecedented\
    \ amount of data publicly available, machine learning has gained a lot of momentum\
    \ and we have seen an incredible amount of new applications in many areas of research\
    \ and in practice. Machine learning is used for spam filtering, for medical image\
