- raw: 'The goal of machine learning is to enable computers to learn on their own.
    Machine learning is about making computers modify or adapt their actions (whether
    these actions are making predictions, or controlling a robot) so that these actions
    become more accurate, where accuracy is measured by how well the chosen actions
    reflect the correct ones \[[25](#25_References.xhtml#ref25)\]. Using machine learning,
    a computer can learn rules by itself without the need of a programmer to develop
    them manually. This is particularly useful when the rules get too complex for
    a developer to implement, or when there are too many rules to be programmed manually.
    An example where machine learning is used are spam filters. Spam filters classify
    mails into legitimate and unsolicited mails, i.e., spam. There are constantly
    new forms of spam appearing and there are simply too many different types of spam
    mails for it to be possible to program the rules to recognize them manually. Spam
    filters learn the rules from past spam mails and learn new rules as new types
    of spam appear. How computers learn to solve problems without being explicitly
    programmed is the central question this book tries to answer.


    Machine learning is nothing new. The term “Machine Learning” was coined by Arthur
    Samuel in 1959 while working at IBM. He defined machine learning as a field of
    study that gives computers the ability to learn without being explicitly programmed
    \[[2](#25_References.xhtml#ref2)\]. In his seminal work “Some Studies in machine
    learning Using the Game of Checkers” \[[35](#25_References.xhtml#ref35)\], he
    probably describes the first program with the capability to learn. His checkers
    program learned to improve its playing by itself. A computer can be programmed
    so that it will learn to play a better game of checkers than can be played by
    the person who wrote the program \[[35](#25_References.xhtml#ref35)\]. However,
    machine learning goes further back, to the 1940s, with Mc-Culloch and Pitts’ theories
    of biological learning \[[26](#25_References.xhtml#ref26)\] and Rosenblatt’s perceptron,
    the first artificial neuron, described in 1958 \[[34](#25_References.xhtml#ref34)\].


    Machine learning has gained momentum in the past years due to big progresses,
    in particular using deep learners, that have been made in object and speech recognition
    and autonomous systems, such as autonomously driving cars, automatic machine translation,
    image caption generation or coloring black and white images.


    Machine learning is an interdisciplinary area of research based on statistics,
    probability, neuroscience, psychology and physics. Machine learning is a mathematical
    formalization of learning. As such, there is a discrepancy between natural learning
    in humans and animals, which is a biochemical process, and learning on computers,
    which is a mathematical abstraction. In humans, learning is carried out in wetware,
    in computers it is carried out in hardware.


    ## [1.1    Data mining](#06_Contents.xhtml#sec1_1)


    Data mining (DM) is defined as the process of discovering patterns in data \[[40](#25_References.xhtml#ref40)\].
    There is no clear distinction in literature between data mining and machine learning.
    In some publications, data mining focuses on extracting data patterns and finding
    relationships between data \[[10](#25_References.xhtml#ref10)\], whereas machine
    learning focuses on making predictions \[[36](#25_References.xhtml#ref36)\]. Data
    mining is the process of discovering useful patterns and trends in large data
    sets. Predictive analytics is the process of extracting information from large
    data sets in order to make predictions and estimates about future outcomes \[[17](#25_References.xhtml#ref17)\].
    Therefore the distinction is in the aim. Data mining aims to interpret data, to
    find patterns that can explain some phenomenon. Machine learning on the other
    hand, aims to make predictions by building models that can foresee some future
    outcome. However, clustering is a machine learning technique that aims to understand
    the underlying structure of the data and has similar goals to data mining. Here,
    we treat machine learning as a subarea of data mining where the rules are learned
    automatically.


    Humans learn from experience, machines learn from data. Data is the starting point
    for all machine learning projects. Machine learning techniques learn the rules
    from historic data in order to create an inner representation, an abstraction,
    that is often difficult to interpret. Programming computers to learn from experience
    should eventually eliminate the need for much of this detailed programming effort
    \[[35](#25_References.xhtml#ref35)\].


    ## [1.2    Data mining steps](#06_Contents.xhtml#sec1_2)


    A typical data mining workflow goes through several steps. These steps include
    data collection, cleansing, transformation, aggregation, modeling, predictive
    analysis, visualization and dissemination. However, depending on the problem at
    hand, those steps might vary or additional steps might be necessary. Data mining
    requires domain specific knowledge. If a data mining project is supposed to detect
    fraud and money laundering in financial transactions or group news articles into
    categories such as “Politics”, “Business”, “Science” etc., different techniques
    apply. Getting familiar with the domain of the application and setting the goals
    of the data mining project are necessary preliminary tasks in order for the data
    mining project to complete successfully. Domain knowledge is also necessary to
    evaluate the performance of a trained learner. [Figure 1.1](#10_Chapter01.xhtml#fig1_1)
    summarizes the data mining steps.


    ![Figure 1.1: Data mining steps.](images/fig1_1.jpg)


    **[Figure 1.1:](#07_ListofFig.xhtml#fig1_1)** Data mining steps.


    Data mining is a highly iterative process and typically goes through many iterations
    until satisfactory results are achieved. Data mining projects have to be executed
    with great care. The growth of data in the past years has fostered the development
    of new data mining applications where the internal workings often go undocumented.
    The black-box approach is dangerous since the results can be difficult to explain,
    or lead to erroneous conclusions. For instance, cancer tissue in medical images
    that was undetected or a traffic situation that was misinterpreted by an autonomously
    driving car. The ease with which these applications can manipulate data, combined
    with the power of the formidable data mining algorithms embedded in the black-box
    software, make their misuse proportionally more hazardous \[[17](#25_References.xhtml#ref17)\].
    Ultimately, one can find anything in data and if a machine learning project is
    carried out without proficiency it can lead to expensive failures.


    ## [1.3    Data collection](#06_Contents.xhtml#sec1_3)


    Data collection is the process of tapping into data sources and extracting the
    data needed for training and testing a model. Data sources include databases,
    data warehouses, transaction data, the Internet, sensor data from the Internet
    of Things or streaming data, but many more sources exist. If the data is stored
    in its original format, it is called a data lake. The data can be historic or
    real-time, streaming data. For instance, training a model for spam filtering needs
    historic, labeled legitimate and spam mails for training and testing. Spam mails
    are artfully crafted in order to avoid elimination by spam filters, making spam
    filtering a tricky task. Spam filtering is one of the most widely-used applications
    of machine learning.


    Often there is more than one data source and multiple data sources need to be
    combined, a process called data integration. As a general technology, data mining
    can be applied to any kind of data as long as the data are meaningful for a target
    application \[[10](#25_References.xhtml#ref10)\].'
