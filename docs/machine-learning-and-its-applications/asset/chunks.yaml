    the function reaches a minimum, a process called simulated annealing. Each visible
    node is connected to every hidden node. A visible node accepts a low level feature,
    e.g., a pixel from an image. If an image has 1024 pixels, the restricted Boltzmann
    machine requires 1024 visible nodes. The inputs are combined with weights and
    added to a bias. The summed up inputs are then passed to a sigmoid activation
    function. This is not different from what we have seen with other networks. However,
    restricted Boltzmann machines are not trained using stochastic gradient descent.
    They use `Gibbs sampling` and `contrastive divergence` to update the weights.
