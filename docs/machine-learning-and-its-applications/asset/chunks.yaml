    期望极大化（expectation maximization, EM），也称为期望极大化聚类分析，是一种解决极大似然估计问题的方法。通常来说，期望极大化是一种当模型中的某些变量无法直接观测（即隐变量）时，极大似然函数的算法。期望极大化假设数据由多个多元正态分布组成，这是一个很强的假设。它通过交替改进模型和对象对模型的分配来迭代尝试寻找最优模型。查看图
    7.1，上方的图显示了黑点和灰点。为了表征每个组，我们可以使用黑点的均值（约为 3）和灰点的均值（约为 6）。这被称为极大似然估计。给定一组数据，我们尝试找到能最好解释每个数据组的值或多个值。如果我们有相同的数据点但不知道每个实例属于哪一组，在某些条件下，我们仍然可以通过迭代应用期望极大化来确定每个组的均值。我们可以使用期望极大化来确定每个组的均值和标准差参数。


    第一步是估计每个组的均值和标准差。这些是随机值，无法产生良好的估计。在图 7.2 中，我们有两个正态分布曲线。第一组的均值约为 3，第二组约为 6。在图 7.2
    中，第一个钟形曲线的均值约为 2.5，第二个钟形曲线的均值约为 7.5。在第二步中，我们利用两组均值和标准差的猜测，通过正态分布的概率密度函数计算每个数据点的似然。这告诉我们每个数据点属于一组或另一组的概率。这两个似然值（数据点属于某一组的概率和属于另一组的概率）在第三步中转换为权重。使用估计值和新计算的权重，我们计算两组均值和标准差的新估计值。这是第四步。使用所有数据点计算两次均值和标准差，一次针对一组，一次针对另一组。这是关键的一步，数据点对某一组的权重越大，它对下一次估计中该组估计的影响就越大。俗可以说，数据点被“拉”向正确的方向。图
    7.3 显示了一个改进的近似。在我们计算出新估计后，回到第二步并重复该过程以改进估计。我们重复这些步骤，直到估计收敛。


    ![图 7.1: 极大似然估计。](img/fig7_1.jpg)


    **图 7.1:** 极大似然估计。


    ![图 7.2: 极大似然初始估计。](img/fig7_2.jpg)


    **图 7.2:** 极大似然初始估计。


    我们如何确定聚类的数量？在聚类分析中，没有正确的答案。期望极大化聚类分析像所有的聚类分析方法一样，是一个知识发现过程。选定的聚类数量应该大于类别数量。假设我们想要训练一个分类器来区分鸟类、哺乳动物和鱼类。我们不能假设数据由三个精确的正态分布组成。然而，我们可以假设存在多种鸟类、哺乳动物和鱼类。因此，我们不仅仅是使用三个聚类，而是为飞行鸟、不会飞的鸟等创建单独的聚类。所以我们可能会得到
    20 个聚类。一旦学习器训练能够区分这 20 个类别，我们将聚类合并回三个原始聚类。有些可能很难分类，例如生活在海里的鲸或海牛，它们仍然是哺乳动物。为了验证类别是否存在某种结构而不仅仅是随机数据，可以将算法应用于单个类别。


    ![图 7.3: 极大似然近似。](img/fig7_3.jpg)


    **图 7.3:** 极大似然近似。


    期望极大化算法往往非常慢。特别是在处理高维数据时，期望步骤可能非常缓慢。此外，算法可能会陷入远离全局最大值的局部极大值。这时我们需要从头开始。


    ## 7.2 伪标签 (#06_Contents.xhtml#sec7_2)


    伪标签（pseudo labeling）是一种用于半监督学习的简单且高效的技术。它也用于深度学习。事实上，伪标签可以用于大多数神经网络和训练方法。在半监督学习中，我们从标记数据中学习特征。我们希望利用未标记数据中的信息来更好地理解数据的结构。伪标签可以用于从未标记数据中学习。伪标签的基本思想是使用标记数据集训练模型，然后使用该模型对未标记数据进行标记。伪标签遵循以下步骤：


    1. 使用标记数据集训练一个或多个模型。训练数据集可能需要手动标记。

    2. 将表现最好的模型用于未标记数据以预测其的类别。

    3. 将训练集与带有伪标签的数据合并。

    4. 像以前一样使用合并后的数据训练模型。


    伪标签可能不正确，但它们应该有高概率。如果结果不理想，可能需要另一次迭代，我们必须使用不同的方法从头开始。


    按照惯例，我们将合并后的数据集分为训练数据和测试数据，以训练学习器。可能不存在底层结构，就像聚类问题一样，可能没有有用的结果。网页分类是半监督学习的一个典型问题。我们希望将网页分类为“新闻页面”、“讨论论坛”等。互联网上有大量的网页，但手动标记成千上万个网页的成本非常高昂。我们可以通过在少量标记网页上训练分类器，对原始网页使用伪标签。然后，我们可以像之前的那样使用训练好的学习器对想要分类的网页进行标记。深度学习器通常使用无监督方法进行预训练。深度神经网络的初始权重通过逐层无监督训练初始化。权重初始化后，使用标记数据和反向传播算法以监督的方式进行微调。这在使用半监督方法同样有效。我们可以使用额外的未标记数据进行无监督预训练。最终，如果我们想用未标记数据来丰富标记数据，我们可以在任何监督任务上使用半监督方法。在许多情况下，即使使用较旧的方法（例如朴素贝叶斯分类器），通过添加未标记数据并使用半监督学习，我们也可以获得更优的性能。

