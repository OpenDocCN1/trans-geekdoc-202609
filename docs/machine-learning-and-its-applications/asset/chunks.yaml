    # 8.5 Deep belief networks


    # 8.6 Deep autoencoders


    Deep learning, a technique with its foundation in artificial neural networks,
    has emerged in recent years as a powerful tool for machine learning, promising
    to reshape the future of artificial intelligence [[33]]. Deep learners rely on
    large labeled training data sets in order to obtain state-of-the-art results.
    Deep learning has been applied for image classification, machine translation or
    speech recognition and deep learners are present in many modern smart phones for
    voice commands or for face recognition. They are also used for autonomously driving
    cars, handwriting recognition, drone reconnaissance or coloring black and white
    images and films, to name a few applications. Despite their success in many fields,
    they do not work fundamentally different from traditional artificial neural networks.
    Contrary to older networks, such as the multilayer perceptron, they often use
    rectifiers as activation function, not sigmoid curves, but they are trained using
    backpropagation and gradient descent, i.e., stochastic gradient descent. However,
    due to their massive size, the computations can be very resource intensive since
    we have to deal with high dimensionality and a large number of features. For instance,
    the German language has an estimated 330,000 words. In speech recognition, every
    word is a feature. If we want to recognize animals in images, the network has
    to be trained with images of all the estimated 8.7 million species that exist
    in nature from different angles, at different ages and with different sexes. The
    availability of training data is often a challenge and it can be very costly to
    obtain labeled training data sets in the required formats.


    Many different deep learning architectures are in use today. A number of theoretical
    ideas had been proposed prior to GPUs (Graphics processing unit), but GPUs have
    provided the processing power to accelerate the development of deep learning architectures.
    The calculations of deep learners, such as convolutional neural networks (CNN),
    can be heavily parallelized and algebraic operations such as matrix products and
    convolutions can be transferred to GPUs. GPUs have provided the computing power
    that made many deep learners require to work efficiently. Now there are chips
    specifically developed for AI operations.


    ## 8.1 Deep learning basics


    There is no agreed upon definition in literature for when a learner is called
    a deep learner and when it is a shallow learner. Deep learners are, in essence,
    artificial neural networks with many layers. Often, neural networks having more
    than one hidden layer are considered deep learners. Deep learners can be used
    for supervised, semi-supervised and unsupervised learning. Deep learners have
    become very popular over the past years due to their impact on computer vision,
    natural language processing and bioinformatics. A key capability of deep learners
    is their ability to automatically extract features. Low-level features are abstracted
    into higher-level features by passing through the different layers of a deep neural
    network.


    Many different deep learning architectures have been proposed. Popular deep learning
    architectures include convolutional neural networks, deep belief networks and
    deep recurrent networks.


    Deep learners belong to the class of representation learners. Representation learners
    create an internal representation of the features prior to making the final prediction.
    Deep learners transform features into multiple representations prior to mapping
    them to the final prediction. For instance, convolutional neural networks that
    have been used for object recognition, learn object representations without the
    need to design features manually. They are inspired by the animal visual cortex
    and create inner representations of an input image. As the signal passes through
    the network layers, low-level features are transformed into higher level abstractions
    by exploiting the hierarchical nature of objects; edges form contours, contours
    form shapes, shapes form objects, etc.


    There are several considerations when using deep learners. Training a deep learner
    requires an extensive amount of labeled training data. Finding an optimal deep
    learning architecture can be a laborious task. Overfitting and convergence can
    cause problems, a problem that is aggravated the more layers the network has.
    In deep learners, during training, neurons can “die”, meaning, they always output
    the same value for any input. Dead units are also unlikely to recover and will
    not take a role in the trained network. This mainly happens when rectifiers are
    used as activation function. Another issue is the vanishing gradient problem.
    During training, when using backpropagation, the derivative of the error function
    can become small, causing the weights to not change the anymore. In the worst
    case, the network stops learning at all. These and some other issues require supplementary
    learning strategies for deep learning.


    ### 8.1.1 Activation functions


    As mentioned before, deep learners are not very different from shallow neural
    networks. However, deep learners often use a different type of activation function.
    The most common activation function used in deep neural networks is the rectified
    linear unit, or `ReLU`. It is a very simple function that returns 0 for negative
    input, and a value for any positive `x`. It can be written as:


    | `f(x) = max(0, x)` | (8.1) |

    | --- | --- |


    A `ReLU` is a ramp function and graphically it looks as shown in Figure 8.1. Despite
    its simplicity, it can handle non-linear and interaction effects surprisingly
    well. Non-linear effects simply means that the relationship between the independent
    variables and the predictions is not linear, in other words, the slope of the
    graph is not constant. Interaction effects means that a variable `a` affects a
    prediction differently depending on variable `b`. For instance, if we want to
    predict the risk of cardiovascular problems in patients based on body weight,
    we also need to know the height of the patients.


    The reason the `ReLU` works so well for non-linearities is that `ReLUs` can be
    combined in many different ways. Deep learners are, in essence, very large functions.
    For one, there is the bias for every node that we have seen in Chapters 2 and
    4. As we have seen, the bias is just a constant that is being learned during training
    and that shifts the activation function to the left or right along the `x` axis.
    Since the `ReLU` only has two slopes, it is a non-linear function and the bias
    moves the point where the slope changes. Every node can have its own bias even
    within a layer and each node can change slope at different points. The second
    reason seems counter-intuitive at first. As we have seen, traditional networks
    use sigmoid activation functions and one of the most popular activation functions
    for shallow neural networks is the hyperbolic tangent, given in equation 8.2.
    One of the main purposes of the activation function is to account for non-linearities
    and, since the hyperbolic tangent is non-linear, in fact it is curved everywhere,
    we might expect that it works well. However, if there are many layers, it causes
    many difficulties. It is rather flat, except for the small range between about
    2 and 2, meaning the derivative is very small outside that range. As mentioned
    before, deep learners are trained using gradient descent, and since the derivative
    of the hyperbolic tangent is mostly small, it is difficult to improve the weights.
    This problem gets worse the more layers the model has. This is called the problem
    of the vanishing gradient.


    ![Figure 8.1: Rectified linear unit.](images/fig8_1.jpg)

