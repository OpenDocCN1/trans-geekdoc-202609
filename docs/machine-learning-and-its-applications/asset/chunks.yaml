    the evaluation of the trained learner might give flawed results.


    ## 3.3 Data transformation `06_Contents.xhtml#sec3_3`


    Raw data often needs to be transformed. There are many reasons why data needs
    to be transformed. For instance, numbers might be represented as strings in a
    raw data set and need to be transformed into integers or doubles to be included
    into a feature vector. Another reason might be the wrong unit. For instance, Fahrenheit
    needs to be converted into Celsius, or inch needs to be converted into metric.


    Sometimes the data structure has to be transformed. Data in JSON (JavaScript Object
    Notation) format might have to be transformed into XML (Extensible Markup Language)
    format. In this case, data mapping has to be transformed since the metadata might
    be different in the JSON and XML file. For instance, in the source JSON file names
    might be denoted by “first name”, “last name” whereas in the XML it is called
    “given name” and “family name”. Data transformation is almost always needed in
    one or another form, especially if the data has more than one source.


    ## 3.4 Outlier removal `06_Contents.xhtml#sec3_4`


    Outlier removal is another common data pre-processing task. An outlier is an observation
    point that is considerably different from the other instances. Some machine learning
    techniques, such as logistic regression, are sensitive to outliers, i.e., outliers
    might seriously distort the result.

