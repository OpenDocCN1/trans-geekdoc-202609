    Restricted Boltzmann machines consist of just two layers, an input layer and a
    hidden layer, as shown in [Figure 8.7](#19_Chapter08.xhtml#fig8_7). They do not
    have an output layer. The predictions are made differently from regular feed-forward
    networks. They fall into the category of energy-based models. Energy-based models
