  trans: '

    如前所述，选择 `k` 对于 k-近邻算法至关重要，因为不同的 `k` 值可能会产生不同的预测。由于 `k` 是基于多数投票的，较小的 `k` 会使得预测变得不太稳定，因为只有少数实例决定了类别分配。随着
    `k` 的增大，决策边界会变得不明显。找到最优的 `k` 值并不是一项易事，需要经过一些尝试和错误。我们可以从较低的 `k` 开始确定预测的准确性，然后不断增加
    `k`，直到准确性不再提高或变差。将 `k` 设置为奇数是一个良好的做法，否则我们可能会出现平局，例如在二分类中，A 类 2 票，B 类 2 票。


    几点备注：k-近邻是一种非参数、懒性学习算法。非参数意味着该算法对底层数据分布不作任何假设。这使得在没有底层数据分布先验知识的情况下，k-近邻是一个很好的选择。现实世界的数据并不符合理论假设，这使其成为许多非线性数据集的“自然”选择。k-近邻也易于理解和解释，但仍然提供高准确性，使其成为机器学习项目的良好起点。缺点是，由于
    k-近邻存储了所有或几乎所有的训练数据，它需要大量的内存和计算能力，特别是当 `k` 很大时。


    k-近邻的一个典型应用是市场细分。具有年龄、收入、家庭状况等相似特征的人可能具有相似的购买行为。因此，k-近邻可以用于推荐引擎和营销活动。然而，如果数据量过大（例如
    Netflix 或亚马逊等极其庞大的数据集），k-近邻就不再可行了，因为每个新实例都必须与所有训练实例进行比较。确定信誉是 k-近邻的另一个应用。具有相似财务特征的人将获得相同的信用评级。


    ## 4.2 回归分析


    回归分析是一组用于估计变量之间关系的统计方法。它被用于确定变量之间是否存在相关性。回归分析可能是最重要的数据分析方法之一。线性回归和逻辑回归是机器学习中最流行的回归分析算法，但还存在更多方法。


    回归分析被用于做出数据驱动的决策，例如预测（如预测销售额）、时间序列分析（例如一段时间内股价的变化）或相关性分析。然而，重要的是，相关性并不意味着因果关系。如果回归线很好地拟合了一组数据点，这并不意味着存在因果关系。例如，在雨天，人们往往比晴天更倾向于购物。天气与销售额之间存在相关性，但这并不意味着坏天气导致了销售。


    ![图 4.13: 回归分析。](img/fig4_13.jpg)


    **[图 4.13:]** 回归分析。


    本质上，回归分析旨在对一组数据点拟合直线或曲线，使得直线或曲线到数据点的距离最小化。`图 4.13` 显示了拟合到一组数据点的回归曲线。


    关于 `图 4.13` 的备注：


    - 并非所有点都在曲线上，某些点可能离回归线很远

    - 回归线是一个近似值

    - 它指示了因变量和自变量之间是否存在显著关系

    - 可以使用不同的尺度来比较所测量变量的影响


    回归分析是一种用于理解输入变量和输出变量之间关系的统计方法。在机器学习中，我们更关注如何通过最小化模型误差来做出准确预测。我们使用回归来确定：


    1. 一组预测变量对结果（因变量）的预测效果如何

    2. 特别哪些变量对结果是重要的


    有许多不同的回归技术可以进行预测。此外，还可以创建新的回归方法。在 `图 4.13` 中，拟合了一条条曲线，因为直线无法为数据点提供良好的拟合。哪种回归方法最合适主要取决于三个因素：


    - 自变量的数量

    - 因变量的类型

    - 回归线的形状


    回归分析用于解释现象（例如，为什么上个月销售额会下降），为了对未来做出预测（例如每天吸烟量与心脏病风险的关系），或者支持决策过程（例如哪种促销活动对销售额的影响最大）。回归分析让我们从数学上确定哪些变量有影响，哪些因素最重要，哪些可以忽略，因素之间是如何相关的，最重要的是，我们对这些因素有多大的把握。


    除了线性回归和逻辑回归，还有其他类型，例如多项式回归、lasso（最小绝对收缩和选择算子）回归以及逐步回归或岭回归等。如果需要，还可以组合回归模型。通常首先使用线性模型。如果找不到合适的拟合模型，可以尝试非线性模型，因为非线性模型可以拟合更广泛的曲线。


    与所有机器学习方案一样，回归分析的第一步是收集数据。例如，如果我们想预测下季度的销售额，我们首先收集过去一年的销售额，并如 `图 4.14` 左象限所示绘制。


    ![图 4.14: 回归分析步骤。](img/fig4_13.jpg)


    **[图 4.14:]** 回归分析步骤。


    `y` 轴显示销售额（因变量），`x` 轴显示季度。`y` 轴总是因变量，即我们想要预测的变量。每个数据点代表一周的数据。右象限的曲线总结了销售额与季节之间的关系。这些销售商品可能是夏季卖得比冬天更多的烧烤用品。


    ### 4.2.1 线性回归


    线性回归是研究两个连续变量之间关系的统计方法。它是机器学习中最简单的方法之一。线性回归试图通过对观测数据拟合线性方程来估计标量因变量和自变量（解释变量）之间的关系。如果存在一个自变量，称为简单线性回归；如果存在多个自变量，则称为多元线性回归。

    '
