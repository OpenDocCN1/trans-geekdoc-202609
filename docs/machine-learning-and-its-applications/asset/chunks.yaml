    ## 2.1 监督学习


    监督学习需要标记数据进行训练。训练样本称为数据点或实例，由输入和输出对组成(`x, y`)。`y` 是输入 `x` 的输出或真实值。与监督学习相反，在无监督学习中，数据只提供输入。训练样本形成了数据集。训练数据集称为金标准数据，尽可能接近真实。训练集用于产生预测函数
    `f`（也称为决策函数），该函数将输入 `x` 映射到 `y`。目标是产生一个能够处理训练之外示例的预测器。换句话说，`f` 需要泛化能力。`f` 在未见数据上提供近似。输入
    `x` 是特征向量或协变量，输出 `y` 是响应。特征向量 `ϕ(x)` 是特征名称到特征值的映射，即字符串到双精度浮。特征向量 `ϕ(x) ∈ ℝ` 是一个实向量
    `ϕ(x) = ϕ[1, ϕ2, … ϕn]`，其中每个分量 `ϕi`（`i = 1, … n`）表示一个特征。特征向量由特征提取器 `ϕ` 计算，可以被视为高维空间中的一点。特征向量中的特征可以加，这意味着每个特征对预测都有贡献。权重是一个与特征值相乘的实数。权重表示在独立的向量中，因为我们希望有一个适用于任何输入的单一预测器。给定特征向量
    `ϕ(x)` 和权重向量 `w`，我们通过两者的内积计算预测分。我们预先不知道向量 `w` 中的权重，它们是在训练过程中学习的。

