    ![Figure 8.8: Deep autoencoder.](images/fig8_8.jpg)


    **[Figure 8.8:]** Deep autoencoder.


    Autoencoders may be thought of as being a special case of feedforward networks
    and may be trained with all the same techniques, typically minibatch gradient
    descent following gradients computed by back-propagation [8]. Learning happens
    through minimizing a loss function `L` that can be described as shown in equation
    8.5:


    ```

    L(x,g(f(x)))

    ```


    by penalizing `g(f(x))` for being dissimilar to `x`.


    Typically, when using an autoencoder, we are not interested in the output but
