- raw: 'In stochastic gradient descent, the path to the minimum is noisier, i.e.,
    more random, than when using the full batch. However, we are indifferent to the
    path as long as we get to the minimum faster. Using the full batch does a lot
    of redundant calculations on large data sets since it calculates the gradients
    of similar examples. When using one instance in each step, the redundancy goes
    away. That is why stochastic gradient descent usually converges faster from gradient
    descent.


    Stochastic gradient descent is the most common optimization method used in machine
    learning. It is also used for deep learners, which have been making a lot of progress
    in the past years and which are, in essence, artificial neural network’s with
    many hidden layers. Slightly modified versions of the stochastic gradient descent
    algorithm remain the dominant training algorithms for deep learning models today
    \[[8](#25_References.xhtml#ref8)\].


    ### [2.6.2    Cluster evaluation](#06_Contents.xhtml#sec2_6_2)


    The goal of clustering is to partition data in a way to attain a high intra-cluster
    similarity. The ideal cluster is dense and isolated. Since we do not have labeled
    data in clustering, we cannot use the same optimization methods used in supervised
    learning. Evaluating a cluster is not as straight forward as evaluating a classifier
    since there is no ground truth. Since there are usually several different possible
    ways to cluster a data set, depending on the similarity metric chosen, human judgment
    is required in order to evaluate the quality of a cluster. There are internal
    measures, such as the Dunn index, that measure the cluster densities and the well
    separateness of a cluster. The Dunn index measures the ratio between the minimal
    and maximal inter-cluster distance for each cluster partition. Other internal
    evaluation methods that use some form of distance measure are the Silhouette coefficient
    and the Davies-Bouldin index. However, since distance can be used as similarity
    measure, using a distance metric for cluster evaluation might overrate the resulting
    cluster.


    External methods use data that was not used for clustering as benchmark. These
    methods use benchmark data to measure how close the cluster is to the benchmark.
    The benchmark data is pre-classified, often by a data scientist, and can be considered
    the gold standard for clustering. However, pre-classified clusters require “knowledge”
    that is not present and that we might want to discover during clustering. As with
    internal methods, there are several methods using external measures. They include
    purity, the Rand index and the F-measure. Purity measures the extend to which
    a cluster only contains data points belonging to a single class. It is simple
    and transparent. To calculate purity, each cluster is assigned to the class most
    frequent in the cluster. Then, for each cluster *w*, the correctly assigned data
    points to class *c* are counted. For a given set of clusters *W* = *w*[1], *w*[2],…,
    *w[k]* and classes *C* = *c*[1], *c*[2], …, *c[j]* partitioning *N* data points,
    the purity can be defined as


    | $purity\\left( {W,C} \\right) = \\frac{1}{N}{\\sum\\limits\_{k}{\\max\\limits\_{j}\\left|
    {w\_{k} \\cap c\_{j}} \\right|}}$ || (2.10) |


    | --- | --- |


    Good clusters have a purity close to 1, bad clusters close to 0. If the number
    of clusters is large, purity is high since purity does not penalize a high number
    of clusters. If every data point is separated out in it’s own cluster, purity
    is 1. The Rand index measures the percentage of correctly assigned data points,
    in other words, it measures accuracy. It penalizes both false positive (FP) and
    false negative (FN) decisions. In addition to this, the F-measure balances the
    contribution of false negative through a parameter by penalizing false negatives
    more than false positives. It supports differential weighting of these two types
    of errors.


    As mentioned before, evaluating a cluster is not an easy task and it is not always
    obvious which method works best. A good internal measure does not necessarily
    translate into good performance in a real world application. A more effective
    approach is evaluating a cluster directly in the application. For instance, if
    we cluster search results we can measure the time it took to find an answer. However,
    this might be too time consuming and expensive. So, we can use an external method
    as a substitute for human judgment. If we search for “Apple” and have two clusters
    with search results, one for apple the fruit, and one for Apple Inc. the computer
    company, we only use the cluster provided by the gold standard and not the class
    label. Since clustering has many applications in medicine, market research, web
    search, recommendation engines, etc., just to name a few, which evaluation method
    to select needs to be decided based on the intended use of the project and on
    the data set to be analyzed. Clustering is not an automatic task but an iterative
    optimization task that relies on trial and error.


