- raw: 'Outliers can also appear in a data set by chance or through a measurement
    error. In this case, outliers are a data quality problem like noise. However,
    in a large data set outliers are to be expected and if the number is small, they
    are usually not a real problem. Clustering is often used for outlier removal.
    Outliers can also be detected and removed visually, for instance, through a scatter
    plot, or mathematically, for instance, by determining the z-score, the standard
    deviations by which the outlier is above the mean value of the data set.


    ## [3.5    Data deduplication](#06_Contents.xhtml#sec3_5)


    Duplicates are instances with the exact same features. Most machine learning tools
    will produce different results if some of the instances in the data files are
    duplicated, because repetition gives them more influence on the result \[[40](#25_References.xhtml#ref40)\].
    For example, Retweets are Tweets posted by a user that is not the author of the
    original Tweet and have the exact same content as the original Tweet except for
    metadata such as the timestamp of when it has been posted and the user who posted,
    retweeted, it. As with outliers, if duplicates should be removed or not depends
    on the context of the application. Duplicates are usually easily detectable by
    simple comparison of the instances, especially if the values are numeric, and
    machine learning frameworks often offer data deduplication functionality out of
    the box. We can also use clustering for data deduplication since many clustering
    techniques use similarity metrics and they can be used for instance matching based
    on similarities.


    ## [3.6    Relevance filtering](#06_Contents.xhtml#sec3_6)


    Relevance filtering typically happens at different stages of a machine learning
    project. Data deduplication can be considered a relevance filtering step if every
    instance has to be unique. Feature selection can also be considered relevance
    filtering since relevant features are separated from irrelevant ones. Stop words
    removal in text analysis is a relevance filtering procedure since irrelevant words
    or signs such as smileys are removed. Many natural language processing frameworks
    offer stop words removal functionality. Stop words are usually the most common
    words in a language such as “the”, “a”, or “that”. However, the list often needs
    to be adjusted since a stop word might be relevant, for instance, in a name such
    as “The Beatles”.


    Since feature selection can be considered a search problem, using different search
    filters can be used to combat noise. For instance, people often enter fake details
    when entering personal data, such as fake addresses or phone numbers, since they
    do not want to be contacted by a call center. These fake profiles need to be filtered
    out otherwise they can negatively influence the predictive performance of a learner.
    Often this already happens when data is collected by using queries that omit irrelevant
    or fake data.


    Relevance filtering can also happen after the features have been selected. Different
    features often do not contribute equally to the result. Some features might not
    contribute at all and can be filtered out. Data mining tools usually provide filter
    functionality at the feature level so learners can be trained on different feature
    sets.


    ## [3.7    Normalization, discretization and aggregation](#06_Contents.xhtml#sec3_7)


    Normalization can mean different things in statistics. It can mean transforming
    data, that has been measured at different scales into a common scale. Using machine
    learning algorithms, numeric features are often scaled into a range from 0 to
    1. Normalization can also include averaging of values, e.g., calculating the means
    of a time series of data over specific time periods, such as hourly or daily means.
    Sometimes, the whole probability distribution is aligned as part of the normalization
    process.


    Discretization means transferring continuous values into discrete values. The
    process of converting continuous features to discrete ones and deciding the continuous
    range that is being assigned to a discrete value is called discretization \[[43](#25_References.xhtml#ref43)\].
    For instance, sensor values in a smart building in an Internet of Things (IoT)
    setting, such as temperature or humidity sensors, are delivering continuous measurements,
    whereas only values every minute might be of interest. An other example is the
    age of online shoppers, which are continuous and can be discretized into age groups
    such as “young shoppers”, “adult shoppers” and “senior shoppers”.


    Data aggregation means combining several feature values in one. For instance,
    going back to our Internet of Things example, a single temperature measurement
    might not be relevant but the combined temperature values of all temperature sensors
    in a room might be more useful to get the full picture of the state of a room.


    Data aggregation is a very common pre-processing task. Among the many reasons
    to aggregate data are the lack of computing power to process all values, to reduce
    variance and noise and to diminish distortion.


    ## [3.8    Entity resolution](#06_Contents.xhtml#sec3_8)


    Entity resolution, also called record linkage, is a fundamental problem in data
    mining and is central for data integration and data cleaning. Entity resolution
    is the problem of identifying records that refer to the same real-world entity
    and can be an extremely difficult process for computer algorithms alone \[[39](#25_References.xhtml#ref39)\].
    For instance, in a social media analysis project, we might want to analyse posts
    of users on different sites. The same user might have the user name “John” on
    Facebook, “JSmith” on Twitter and “JohnSmith” on Instagram. Here, entity resolution
    aims to identify the user accounts of the same user across different data sources,
    which is impossible if only the user names are known. Also, there is the danger
    that users are confused and the user name “JSmith” is associated with a different
    user, e.g., “James Smith”. In this case, record disambiguation methods have to
    be applied. If the data set is large and we have *n* records, every record has
    to be compared with all the other records. In the worst case, we have *O*(*n*²)
    comparisons to compute. We can reduce the amount of comparisons by applying more
    intelligent comparison rules. For instance, if we have three instances *a, b*
    and *c*, if *a* = *b* and *a* ≠ *c* we can infer that *b* ≠ *c*. Reducing the
    number of comparisons can diminish the effort but is not always feasible and a
    considerable amount of research has been conducted to develop automated, machine-based
    techniques.


    As with many pre-processing tasks, we can use clustering methods for entity resolution.
    In fact, entity resolution is a clustering problem since we group records according
    to the entity they belong to. It can be addressed similar to data deduplication
    by finding some similarity measures and then using a distance measure, such as
    the Eucledian distance or the Jaccard similarity, to find records that belong
    to the same real-world entity. Clustering techniques are described in more detail
    in [Chapter 6](#16_Chapter06.xhtml). In practice, the probability that a record
    belongs to a certain entity is usually calculated. Entity resolution can also
    be used for reducing redundancies in data sets and reference matching, where noisy
    records are linked to clean ones. Active learning methods and semi-supervised
    techniques have also been used for entity resolution. However, machine-based techniques,
    despite all the research effort that has been invested, are far from being perfect.


