- raw: 'When I started to work with machine learning there were excellent books explaining
    the math used in machine learning algorithms. There were also excellent books
    about data mining and knowledge discovery. Some of them are listed in the reference
    section. They can be used for studying and for reference. However, there were
    no books explaining the basic concepts behind machine learning and how they are
    applied in practice. It is important to understand the math and the algorithms
    used in machine learning. However, it is not necessary to know all the details
    about the algorithms to be able to effectively use them for real world problems.
    Machine learning has evolved over the past years to the point where a lot of the
    complexity is hidden in frameworks such as TensorFlow or Apache Mahout. A data
    scientist can use these frameworks without knowing the implementation details.
    Many popular programming languages have libraries with implementations that are
    ready to be used in programs. R, Python, Java or Scala have many different implementations
    of machine learning methods and the data scientist can continue using his preferred
    programming language by including the libraries that fit the purpose best. There
    are also tools, such as RapidMiner, Weka or Knime to name a few, where no programming
    skills are required and machine learning workflows can be created graphically.
    Obviously, next to the open source implementations, there are also commercial
    tools offered by different vendors to choose from.


    This book aims to explain the basic concepts behind machine learning and the machine
    learning methods. It is the work of several years of experience in applying these
    methods in practice in various projects. It tries to give a concise description
    of the algorithms and the math behind them to the level where it helps explain
    the inner workings. However, it is not intended to give an exhaustive mathematical
    description with all the derivations. Also, machine learning goes back to the
    1940’s and has evolved since then and many different techniques have been developed,
    too many to describe in one single book. Also, for virtually every machine learning
    method, variations have been proposed that might be more suitable for certain
    problems than others. Nevertheless, some of the basic concepts apply to many of
    these methods and understanding them makes it easy to familiarize oneself with
    new methods that have not been used before. This book is written in such a way
    that each chapter can be read individually with the caveat that some redundancy
    exists in the chapters. This book will hopefully make it easier for the reader
    to get started with machine learning and support them in the fascinating journey
    through the world of data science and machine learning.


