    ## Preface


    Artificial intelligence or `AI`, and in particular, machine learning has received
    a lot of attention in media due to the rapid advances we have seen in this area.
    Since the beginning of the new century, machine learning has gained a lot of momentum
    and we have seen an incredible amount of new applications in many areas of research
    and in practice. The Internet, that made an unprecedented amount of data publicly
    available, machine learning has seen a lot of research in practice.


    Machine learning is used for spam filtering, for medical image analysis, for voice
    commands, for autonomously driving cars and to analyze sensor data for the Internet
    of Things just to name a few. Every high-end smart phone is now AI enabled. Deep
    learning is used to predict earthquakes, for automatic language translation, for
    automatic coloring of black and white movies and for forecasting in finance. The
    Mars rover Curiosity utilizes artificial intelligence to autonomously select inspection-worthy
    soil and rock samples with high accuracy. The list goes on.


    Recently, machine learning also attracted a lot of attention due to visions of
    jobs being lost to machines, dangers of autonomous systems, such as robots who
    could turn evil, loss of control over existential infrastructure or even a war
    starting due to artificial intelligence. However, it should be noted that artificial
    intelligence, as the name suggests, is artificial and has nothing to do with human
    intelligence. A machine may be capable of recognizing whether an animal in a picture
    is a lion or a tiger, but it is not able to understand the concept behind what
    it recognized, i.e., it does not understand the concept of a living being. A deep
    learner is, in essence, a huge mathematical formula. It has nothing to do with
    how the human brain works, where biochemical processes are executed. An artificial
    neural network is inspired by nature. It has a grain of how we think the brain
    works and a lot of math thrown at it. Visions of machines replacing doctors in
    diagnosing a patient or lawyers in sentencing a perpetrator are probably premature.


    Before we have a better understanding of the brain, it is unlikely that we will
    be able to replace it, no matter how much math we apply.

