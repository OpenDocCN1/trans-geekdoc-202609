    ReLU 的导数在曲线的平坦部分为 0，在倾斜部分为 1。对于较大的训练集，在任何给定的节点通常会有产生正输出的实例。因此，平均导数很少接近于 0。这使得梯度下降能够持续优化权重。然而，ReLU
    有时会被推入一种对所有输入都处于非激活的状态，导致没有梯度回传到神经元，这是梯度消失问题的一种形式。ReLU 有多种变体。例如，softplus 函数是 ReLU
    的平滑近似，如图图 8.2 所示。它由公式 8.3 定义。


    | `f(x)` = `log(1+e^x)` || (8.3) |

    | --- | --- |


    softplus 函数的导数是逻辑函数（logistic function），这也是 ReLU 导数的近似。


    ![图 8.2: Softplus 函数。](img/fig8_2.jpg)


    **图 8.2:** Softplus 函数。


    ReLU 有几个优点。它们是单侧的且没有负输出，这在生物学上更合理。它们在计算也非常高效，因为它们只使用加法、乘法和比较操作。整器（Rectifiers）已成为深度学习者的首选激活函数，因为与
    sigmoid 函数相比，即使在具有大型数据集的大型网络上，它们也能实现更快更高效的训练。此外，它们不需要任何半监督预处理步骤。尽管它们可以利用额外的未标记数据利用半监督设置，但深度整器网络可以在不需要对纯监督任务（带有大型标记数据集）进行任何无监督预训练的情况下，达到其最佳性能
    [7]。


    ## 8.1.2 特征学习


    特征学习是一套技术，允许机器自动检测特征，而不需要特征工程师手动提取感兴趣的特征。例如，图像中物体识别的传统方法需要特征工程师分离出图像中物体所在的区域并忽略背景。使用深度架构，可以自动检测感兴趣的对象，这一过程被称为目标检测。深度架构能够同时完成目标检测和物体识别。深度学习器的分层架构在每一层都创建了输入的更高层次的抽象。每一层的输出都是输入的低维投影。只要深度网络经过了最优权重分配，网络的输出就是原始数据的高级抽象，代表了一个自动的特征集。该特征集随后可以作为实际分类任务的输入。自动特征检测也有助于避免人类偏差。例如，使用卷积神经网络，卷积层充当了特征提取器。


    特征学习是自动化整个端到端机器学习过程努力的一部分，被称为自动机器学习（AutoML）。自动机器学习旨在自动化通常由手动完成的所有机器学习任务，例如模型选择或超参数调优。然而，自动特征提取并不总是可行的。特征学习并不限于深度学习，它已用于浅层学习器，如
    k-means 聚类或主成分分析。


    ## 8.2 卷积神经网络


    卷积神经网络（CNN），也称为 ConvNets，在图像分析任务中非常流行，如图像分类和标记、物体识别、人脸检测和识别以及光学字符识别。它们的灵感来源于人类视觉皮层如何同化视觉信息，并且是专为图像分析开发的。最早的卷积神经网络之一由
    Yann LeCun 在 1998 年提出 [19]，他是深度学习的三位父亲之一，另外 Yoshua Bengio、Geoffrey Hinton 和 Yann
    LeCun [28]。然而，第一个卷积网络可以追溯到 20 世纪 80 年代，从那时提出了许多不同的卷积神经网络架构。


    由于卷积神经网络使用图像作为输入，某些图像处理属性已体现在它们的架构中。卷积神经网络由一组交替的前馈层组成，这些层实现了卷积滤波器，随后是减半层、整流层或池化层。与我们在第
    4 章中看到的多层感知器不同，卷积神经网络不是全连接的。此外，在卷积神经网络中，神经元以三维方式排列，并接受固定尺寸的三维输入图像。输出是一个单一向量。否则，它们与我们已经看到的传统神经网络以及我们看到的许多训练技术没有太大区别。我们见过的许多训练技术可以用于卷积神经网络。用于照片识别的卷积网络是一种特殊的前馈网络
    [8]。它们由具有可学习权重和偏置的神经元组成。使用损失函数、反向传播和梯度下降进行训练。在实践中，超过三层很少有助于提高神经网络的准确性。相比之下，使用深度学习器，深度对于识别应用至关重要，卷积神经网络通常有十到二十层可学习层。由于每一层都投影出更高层次的抽象，具有多个层是直观的，因为物体由形状组成，形状由边缘组成，依此类推。


    本质上，卷积神经网络由五类层组成：输入层、输出层以及三种中间层：卷积层、池化层和非线性层（通常为 ReLU）。


    *   输入层接受固定尺寸的三维像素数组：`[宽度 高度 颜色通道]`

    *   卷积层从图像的小区域提取空间特征，并将这些区域连接到下一层的单个单元

    *   池化层将相邻特征合并为单个单元，这种下采样操作减了图像尺寸

    *   ReLU 层应用激活函数，如 `max(0, x)`，图像大小保持不变

    *   输出层以全连接多层感知器（MLP）的形式存在，计算分类并输出一个持有分数的向量


    应该注意的是，某些卷积神经网络也可以处理不同尺寸的图像。


    图 8.3 展示了一个卷积神经网络的示例架构，包含一系列不同类型的处理层。它接受原始图像作为输入并通过不同的层。全连接多层感知器的输出是一个持有类别分数的向量。为了方便表示，图
    8.3 是二维形式绘制的。本质上，卷积神经网络充当多层感知器的特征提取器。卷积层提取相关特征，池化层使特征对尺度和平移具有等变性。


