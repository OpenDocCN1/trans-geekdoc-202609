    ## 3.8 Entity resolution


    Entity resolution, also called record linkage, is a fundamental problem in data
    mining and is central for data cleaning. Entity resolution is the problem of identifying
    records that refer to the same real-world entity and can be extremely difficult
    for algorithms alone [[39]]. For instance, in social media analysis project, we
    might want to analyse users on different sites. The same user might have the name
    “John” on Facebook, “JSmith” on Twitter and “JohnSmith” on Instagram. This is
    impossible if only user names are known. If the data set is large and we have
    `n` records, every record has to be compared with all the other records. In the
    worst case, we have `O(n²)` comparisons to compute. We can reduce the amount of
    comparisons by applying more intelligent rules. For instance, if we have three
    instances `a, b` and `c`, if `a = b` and `a != c` we can infer that `b != c`.
    Reducing the number of comparisons can diminish the effort but is not always feasible.


    As with many pre-processing tasks, we can use clustering methods for entity resolution.
    In fact, entity resolution is a clustering problem since we group records according
    to the entity they belong to. It can be addressed similar to data deduplication
    by finding some similarity measures and then using a distance measure, such as
    the Euclidean distance or the Jaccard similarity, to find records that belong
    to the same real-world entity. Clustering techniques are described in more detail
    in Chapter 6. In practice, the probability that a record belongs to a certain
    entity is usually calculated. Entity resolution can also be used for reducing
    redundancies in data sets and reference matching, where noisy records are linked
    to clean ones. Active learning methods and semi-supervised techniques have also
    been used for entity resolution. However, machine-based techniques, despite all
    the research effort that has been invested, are far from being perfect.

