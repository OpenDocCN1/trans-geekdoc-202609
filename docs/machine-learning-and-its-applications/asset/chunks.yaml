    ## 3.7 Normalization, discretization and aggregation


    Normalization can mean different things in statistics. It can mean transforming
    data, that has been measured at different scales into a common scale. Using machine
    learning algorithms, numeric features are often scaled into a range from `0` to
    `1`. Normalization can also include averaging of values.


    Discretization means transferring continuous values into discrete values. The
    process of converting continuous to discrete is called discretization [[43]].
    For instance, in Internet of Things (IoT) setting, continuous measurements might
    be relevant.


    Aggregation means combining several values into one. It is a very common pre-processing
