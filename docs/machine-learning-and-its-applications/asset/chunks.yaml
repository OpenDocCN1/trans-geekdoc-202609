    than one data source and multiple data sources need to be combined, a process
    called data integration. As a general technology, data mining can be applied to
    any kind of data as long as the data are meaningful for a target application [[10](#25_References.xhtml#ref10)].

    '
  trans: '

    机器学习的目标是使计算机能够自主学习。机器学习是关于让计算机修改或适应其行为（无论这些行为是预测还是控制机器人），以便这些行为变得更加准确，其中准确性通过所选行为反映正确行为的良好程度来衡量
    [25]。通过机器学习，计算机可以自己学习规则，而不需要程序员来手动开发这些规则。当规则复杂到开发者无法实现，或者规则过多无法通过手动编程完成时，这尤为有用。机器学习的一个应用是垃圾邮件过滤器。垃圾过滤器将邮件分类为合法邮件和未经请求的邮件（即垃圾邮件）。新形式的垃圾邮件不断出现，垃圾邮件类型繁多，无法通过手动编写规则来识别它们。垃圾过滤器从过去的垃圾邮件中学习规则，并在新类型的垃圾邮件出现时学习新规则。计算机如何在没有被显式编程的情况下学习解决问题，是本书试图回答的核心问题。


    机器学习并非新鲜事物。“机器学习”（Machine Learning）一词是由 Arthur Samuel 在 1959 年于 IBM 工作期间提出的。他将机器学习定义为一种赋予计算机在没有经过显式编程的情况下学习能力的研究领域
    [2]。在他开创性的著作《利用国际棋进行机器学习学习的一些研究》[35] 中，他可能描述了第一个具有学习能力的程序。他的国际棋程序学会了自动提高自己的游戏水平。计算机可以被编程，使其学会玩出比编写程序的人更高水平的国际棋
    [35]。然而，机器学习的历史可以追溯到 20 世纪 40 代，当时有 McCulloch 和 Pitts 的生物学习理论 [26] 以及 Rosenblatt
    在 1958 年描述的第一个人工神经元——感知器 [34]。


    由于在某些领域取得了巨大进展，机器学习在过去几年中获得了动力，特别是在目标识别、语音识别以及自主系统（如自动驾驶汽车、自动机器翻译、图像描述生成或黑白图像上色）中对深度学习器的应用。


    机器学习是一门基于统计学、概率论、神经科学、心理学和物理学的跨学科研究领域。机器学习是学习的数学形式化。因此，人类和动物的自然学习（一种生物化学过程）与计算机学习（一种数学抽象）之间存在差异。在人类身上，学习是在湿性硬件（wetware）中进行的，而在计算机中它是在硬件中进行的。


    ## 1.1 数据挖掘


    数据挖掘（DM）被定义为从数据中发现模式的过程 [40]。文献中数据挖掘和机器学习之间没有明确的区分。在某些出版中，数据挖掘侧重于提取数据模式和发现数据之间的关系
    [10]，而机器学习侧重于做出预测 [36]。数据挖掘是在数据中发现有用模式的过程 [17]。预测分析是从数据集中提取信息的过程 [17]。机器学习是数据挖掘的一个子领域，其中学习了规则。人类从经验中学习。数据是所有机器学习的起点。数据挖掘需要领域知识
    [35]。


    ## 1.2 数据挖掘步骤


    典型的数据挖掘工作流经过几个步骤。这些步骤包括数据收集、清洗、转换、聚合、建模、预测分析和分发。然而，取决于当前的问题，这些步骤可能会有所不同。如果一个数据挖掘项目旨在检测金融交易中的欺诈和洗钱，或将新闻文章分类为“政治”、“商业”等类别，则适用不同的技术。熟悉应用领域并设定数据挖掘项目的目标是必要的准备工作。领域知识对于评估已训练学习器的性能也是必要的。图
    1.1 总结了数据挖掘步骤。


    ![图 1.1: 数据挖掘步骤。](img/fig1_1.jpg)


    数据挖掘是一个高度迭代的过程，需要经过多次迭代直到获得满意的结果。数据挖掘项目必须非常谨慎地执行。过去几年数据的增长促进了新的数据挖掘应用的发展，但这些应用的内部运行机制并没有记录。黑箱方法是危险的，因为结果可能难以解释，或导致错误的结论。例如，医学图像中未检测到的癌症组织，或自动驾驶汽车误读的交通状况。这些应用可以轻易操纵数据，加上嵌入黑箱软件中强大的数据挖掘算法的威力，使得其误用的风险成比例地增加
    [17]。


    ## 1.3 数据收集


    数据收集是接入数据源并提取训练和测试模型所需数据的过程。数据源包括数据库、数据仓库、事务数据、互联网、物联网的传感器数据或流数据，但还有更多。如果数据以原始格式存储，则被称为数据湖。数据可以是历史性的或实时的（流数据）。例如，训练垃圾邮件过滤模型需要历史的、标记过的合法邮件和垃圾邮件来进行训练和测试。通常会有多个数据源并合并多个数据源，这个过程被称为数据集成。作为一种通用技术，只要数据对目标应用有意义，数据挖掘就可以应用于任何类型的数据
    [10]。

    '
