  trans: '


    循环神经网络使用反向传播和梯度下降进行训练，这与前馈网络相似。然而，由于循环的存在，反向传播机制的工作方式与前馈网络不同。在前馈网络中，算法从最终误差开始通过层层反向移动，并向上或向下调整权重以减少误差。为了训练循环网络，使用了反向传播的一种扩展方法——随时间反向传播，或
    `BPTT`。随时间反向传播是一种基于梯度的循环网络训练方法。在随时间反向传播中，时间是由从一个时间步到另一个时间步的有序计算序列定义的。本质上，循环神经网络的结构被展开了。创建了包含循环的神经元的副本，并将循环神经网络的循环图转换为无环图，从而将循环神经网络变为前馈网络。每个副本共享相同的参数。循环网络和展开后的网络如图图
    8.6 所示。


    ![图 8.6: 随时间展开。](img/fig8_6.jpg)


    **图 8.6：** 随时间展开。


    然而，随时间反向传播在解释大脑中的随时间学习方面面临着前馈反向传播未遇到的特定问题，而且它与大脑的关系通常研究得较少 [21]`。神经网络（无论循环与否）都是形式为
    `f`(`g`(`h`(`x`))) 的嵌套函数。在循环神经网络中，循环扩展了我们需要计算导数并应用链式法则函数序列。


    并不是所有的循环神经网络都可以展开。对于某些架构，无法使用随时间反向传播。同样，如往常，随时间反向传播也有变体，例如截断随时间反向传播，它是完整随时间反向传播的近似。当时间步过多导致计算缓慢时，便会使用截断随时间反向传播。此外，循环神经网络（特别是当它们有很多层时）深受我们之前看到的梯度消失问题的困扰。如果我们无法确定梯度，就不知道如何朝着减少误差的方向调整权重。在坏的情况下，网络完全停止学习。针对梯度消失问题已经提出了许多解决方案。正如之前看到的，当使用
    `ReLU` 作为激活函数时，我们不会遇到这个问题。另一个解决方案是使用残差网络，或 `ResNet`。残差网络是许多短网络（通常为三层）的集成。`ResNet`
    将深度学习器拆分成更小的块。`ResNet` 不需要额外的参数或其他训练机制。它们提供了梯度消失问题最有效的解决方案之一。


    正如我们看到的，循环神经网络对于文本和语音分析以及时间序列分析非常有效。它们还用于机器人控制、文本推荐、文本自动填充或呼叫中心的客户满意度分析。它们与 `ConvNets`
    协同工作进行图像识别，这里仅举几个应用。


    ## 8.4 受限玻尔兹曼机 (#06_Contents.xhtml#sec8_4)


    受限玻尔兹曼机或 `RBMs` 是浅层双层网络，可用于分类、回归、降维、协同过滤或特征学习。它们没有其他类型的网络那么知名。然而，它们在 Netflix 奖赛中取得了顶级结果
    [36] 并击了绝大多数竞争者。它们在深度学习章节中被介绍，因为它们构成了深度信念网络的构建模块。


    受限玻尔兹曼机是概率性的，即它们不分配离散值而是分配概率。受限玻尔兹曼机是一种玻尔兹曼机。然而，玻尔兹曼机是循环网络，而受限玻尔兹曼机不允许隐藏单元之间的层内连接。这就是它们被称为“受限”的原因。


    受限玻尔兹曼机仅包含两层：输入层和隐藏层，如图图 8.7 所示。它们没有输出层。预测方式与普通的前馈网络不同。它们属于基于能量的模型。基于能量的模型试图最小化能量函数，高能量意味着准确性差。受限玻尔兹曼机分为可见单元和隐藏单元。可见单元接收训练集。训练期间通过调整权重、偏置以及可见单元和隐藏单元的状态来使能量函数达到最小值，这一过程被称为模拟退火。每个可见节点连接到每个隐藏节点。可见节点接受低级特征，例如图像的像素。如果一张图像有
    1024 个像素，受限玻尔兹曼机就需要 1024 个可见节点。输入与权重相乘并加上偏置。求和后的输入随后传递给 sigmoid 激活函数。这与我们在其他网络看到的无异。然而，受限玻尔兹曼机不使用随机梯度下降进行训练。它们使用
    `Gibbs sampling` 和 `contrastive divergence` 来更新权重。训练机制超出了本书的涉及范围。


    ![图 8.7: 受限玻尔兹曼机。](img/fig8_7.jpg)


    **图 8.7：** 受限玻尔兹曼机。


    如果有多个层，隐藏层的输出 `a` 将作为下一隐藏层的输入。


    受限玻尔兹曼机学习如何以无监督的方式重建输入。激活值 `a` 在反向传播中用作输入。它们与输入 `x` 相同的权重相乘。乘积之和加上可见层的偏置。可见层的偏置与隐藏层的偏置不同。产生的输出是原始输入的重构或近似。在正向传播期间，受限玻尔兹曼机计算给定加权
    `x` 的情况下输出的概率：`p(`a`|`x`; `w`)`。在反向传播期间，受限玻尔兹曼机估计给定加权激活 `a` 的情况下输入 `x` 的概率：`p(`x`|`a`;
    `w`)`。两种估计都导向 `x` 和 `a` 的联合概率分布：`p(`x, a*)`。训练经过多次正向和反向传播。不断权重，直到原始输入的概率分布 `p(`x*)`
    和估计输入的概率分布 `q(`x*)` 收敛。


