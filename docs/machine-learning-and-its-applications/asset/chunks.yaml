- raw: 'Despite the fact that the independence assumption is often wrong, the na¨ıve
    Bayesian classifier still performs surprisingly well in real-world applications,
    even with small training data sets. One advantage is that it returns not only
    the prediction but also the degree of certainty, which is often very useful. Also,
    it makes dealing with missing values easy. Due to its simplicity, the naïve Bayesian
    classifier is less prone to overfitting from artificial neural networks, for example.
    Besides text analysis, it is also used for weather prediction, medical diagnosis,
    face recognition and recommendation engines, to name a few.


    ### [4.1.3    Decision trees](#06_Contents.xhtml#sec4_1_3)


    Decision trees or decision tree induction is an other type of widelyused classifiers.
    Decision tree induction is the learning of decision trees from class-labeled training
    tuples \[[10](#25_References.xhtml#ref10)\]. It generates a tree-like structure,
    where each node represents a decision for an attribute except the leaf nodes.
    Trees are one of the most common and powerful data structures in computer science
    in general. [Figure 4.7](#14_Chapter04.xhtml#fig4_7) shows a simple decision tree
    to predict whether there will likely be a thunderstorm or not, based on the attributes
    of temperature and humidity.


    The top node is called root node and holds the first attribute, the end nodes
    are called leaf nodes and hold a class label. The branches represent the outcome
    of a decision on an attribute. In [Figure 4.7](#14_Chapter04.xhtml#fig4_7), we
    have two binary splits with just “yes” or “no”. There can be more than just two
    splits. In this case, we have a nonbinary tree. For instance, we want to predict
    what type of car a potential customer is going to buy based on some attributes
    such as “income”, “age”, “family status”, etc. We might have a split with three
    branches such as “family car”, “sports car” and “luxury car”.


    ![Figure 4.7: Decision tree.](images/fig4_7.jpg)


    **[Figure 4.7:](#07_ListofFig.xhtml#fig4_7)** Decision tree.


    New data navigates through a decision tree starting at the root node and then
    passing down to the leaf nodes. Each feature is evaluated in a node while progressing
    to the leaf nodes where we receive the classification result, the class label,
    of an instance. If the target variable is categorical, such as “family car”, “sports
    car”, etc., it is a classification tree, if the target variable is continuous,
    it is a regression tree. In it’s simplest form, a decision tree can consist of
    just a set of if-then rules (logical disjunctions). Decision trees are flowchart-like
    and, since decision trees consist of nodes and edges between the nodes, they are
    essentially restricted graphs.


    Developing an algorithm that creates a decision tree is far more complicated than
    using it. However, most algorithms are based on the same principle. At each step
    we should choose the attribute that gives us most information based on what we
    already know. If we want to classify objects, we should ask more general questions
    such as “is it a vehicle?” before we ask “is it a truck?”. Deciding how much information
    is provided by each question based on certain prior knowledge is a task for information
    theory and can be challenging. Fortunately, algorithms for decision tree generation,
    such as ID3, which stands for Iterative Dichotomiser 3, C4.5 and CART, which stands
    for Classification And Regression Trees, have been around for decades and implementations
    of modern variations can be found in popular machine learning frameworks, such
    as WEKA.


    Evaluating decision trees differs from other classifiers. We cannot use a loss
    function since the order of the splits matters in a decision tree. So, we cannot
    just evaluate the result at the output against a gold standard. When constructing
    the decision, tree we need to make the better splits early in the tree. We do
    this by evaluating the information gain at each step. We can use the Gini index
    or the information entropy to determine the impurity of the data set *D*, which
    is a training set of tuples. The Gini index is defined by [equation 4.9](#14_Chapter04.xhtml#eq4_9):


    | $D = 1 - {\\sum\\limits\_{i = 1}^{c}p\_{i}^{2}}$ || (4.9) |


    | --- | --- |


    where


    |  *p[i]* || \= Probability that a tuple in D belongs to class *C[i]* |


    | --- | --- |


    |  *c* || \= Number of classes |


    The Gini index, also called Gini coefficient, Gini impurity or Gini ratio, is
    a measure of statistical dispersion used in economics and has been developed to
    represent the wealth distribution of the residents of a nation. When building
    a decision tree, the Gini index is evaluating the splits and lies between 0 and
    1. The Gini index considers a binary split for each attribute \[[10](#25_References.xhtml#ref10)\].
    If the separation is perfect, the Gini index is 0. If the index is 1, the attributes
    are equally distributed in each of the two splits. So, we want splits with a low
    Gini index. The CART algorithm uses the Gini impurity to generate a tree.


    Information gain is based on the notion of entropy from information theory. The
    information gain is the entropy of the parent node minus the entropy of the child
    nodes. It weights the probability of a class by the *log*[2] of the class probability.
    The entropy is defined by [equation 4.10](#14_Chapter04.xhtml#eq4_10):


    | $E = {\\sum\\limits\_{i = 1}^{c}{- p\_{i}\\log\_{2}p\_{i}}}$ || (4.10) |


    | --- | --- |


    where


    |  *p[i]* || \= Percentage of each class present in the child node |


    | --- | --- |


    |  *c* || \= Number of classes |


    *p*[1], *p*[2], … represent the percentage of each class in the child node and
    add up to 1. The information gain is then the entropy of the parent node minus
    the entropy of the child nodes. The smaller the entropy value the better, in other
    words, the difference between the parent nodes entropy is larger. The Gini index
    caps at 1, whereas the maximum value for entropy depends on the number of classes.
    It is based on *log*[2], so for two classes, the maximum entropy is 1, for four
    classes it is 2, and so on.


    Decision trees are very popular classifiers for several reasons. Decision trees
    are intuitive and easy to interpret. They are often used with text features instead
    of numeric features, making them human readable. The computational cost of making
    the tree is fairly low, and the cost of using it is even lower: *O*(log*N*), where
    *N* is the number of datapoints \[[25](#25_References.xhtml#ref25)\]. The construction
    of decision tree classifiers does not require any domain knowledge or parameter
    setting, and, therefore, is appropriate for exploratory knowledge discovery \[[10](#25_References.xhtml#ref10)\].
    A decision tree can be represented by a set of logical disjunctions that can be
    easily programmed.


