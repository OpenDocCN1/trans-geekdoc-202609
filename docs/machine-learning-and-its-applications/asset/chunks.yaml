- raw: 'To evaluate how well a supervised machine learning scheme has learned, we
    usually use labeled data that was not used for training. Typically, we divide
    the data into three data sets: One data set for training, one for evaluating and
    one for testing the learner. The training set is used to train the learning algorithm,
    the validation set is used to optimize the parameters of the learning algorithm
    and the test data set in order to calculate the true error rate on the final,
    trained algorithm. Each data set needs to be independent in order to obtain a
    reliable estimate of the error rate. Data sets are typically randomly divided
    into the three sets. Each data set needs to be representative and no feature should
    be over- or underrepresented in one set. The proportion of the sets depends on
    the problem and the amount of available data. Typically the largest amount is
    used for training and we might use proportions such as 60:20:20 or 70:15:15. The
    drawback is that this reduces the amount of data that we can use for training.
    If there is a shortage of data, techniques such as *k*\-fold cross-validation
    can be used. The data is randomly divided into *k* data subsets and *k* − 1 data
    sets are used for training and one holdout data set is used as the validation
    set. This process is repeated until each of the *k* subsets has been used as the
    evaluation set once.


    A learner also needs to be evaluated so that it can be compared with other learners.
    Often, more than one model is trained, and we want to use the learning scheme
    that best works for our problem. Regardless of whether we train only one learning
    algorithm or more, we still need to evaluate how good the result is.


    There are many different metrics to measure the performance of a predictor and
    not all can be used for all learners. Some are suited for classification where
    others might be for regression analysis.


    Evaluating a learner is an important task since it gives us an indication as to
    how well a trained model will perform on new data. In fact, improved evaluation
    methods have contributed to the recent successes in machine learning and in deep
    learning.


    ### [5.1.1    Accuracy](#06_Contents.xhtml#sec5_1_1)


    One metric for evaluating classification models is accuracy. Accuracy is simply
    the fraction of predictions the model classified correctly. Formally, accuracy
    is defined as:


    | $Accuracy = \\frac{Number\\ of\\ correct\\ predictions}{Total\\ number\\ of\\
    predictions}$ || (5.1) |


    | --- | --- |


    However, accuracy does not tell the full story. Lets assume we want to classify
    medical images of tissue samples into cancerogenous and benign tissue samples.
    Lets assume we have 100 samples, of which 91 are benign and 9 are cancerogenous.
    If a classifier correctly determined 90 tissue samples as benign and 1 as cancerogenous,
    using [equation 5.1](#15_Chapter05.xhtml#eq5_1) we end up having an accuracy of
    $\\frac{90 + 1}{100} = 0.91$. 91% is a very good accuracy, however, only one of
    the 9 cancerogenous samples was correctly classified as malign. Despite the high
    accuracy, most malign samples go undiagnosed. In other words, we need to take
    the number of misclassifications into consideration. Accuracy works particularly
    poorly in situations where we have a class-imbalanced data set, meaning there
    is a big difference in the number of positive, cancerogenous, and negative, benign,
    samples. Accuracy treats all samples the same. However, in real world problems,
    imbalanced data sets are the rule. A metric that is much more suited for class-imbalanced
    data sets is precision and recall.


    ### [5.1.2    Precision and recall](#06_Contents.xhtml#sec5_1_2)


    Precision and recall take into account the correctly as well as the incorrectly
    classified instances. We use the terms true positives (TP), true negatives (TN),
    false positives (FP), and false negatives (FN). Positive and negative refers to
    the classifiers prediction. True positives and true negatives are correctly classified
    instances. For instance, true positives are correctly classified medical images
    as cancerogenous and true negatives are correctly classified images as benign.
    False positives and false negatives are incorrectly classified images. [Figure
    5.1](#15_Chapter05.xhtml#fig5_1) visualizes the result of a classification task
    with the distribution of TP, TN, FP and FN.


    ![Figure 5.1: Precision recall.](images/fig5_1.jpg)


    **[Figure 5.1:](#07_ListofFig.xhtml#fig5_1)** Precision recall.


    For a classification task, precision, also called positive predictive value, is
    the proportion of correct positive classifications. Precision is defined as:


    | $Precision = \\frac{TP}{TP + FP}$ || (5.2) |


    | --- | --- |


    Recall, also called true positive rate or sensitivity, is the proportion of actual
    positives correctly identified. Recall is defined as:


    | $Recall = \\frac{TP}{TP + FN}$ || (5.3) |


    | --- | --- |


    We can visualize precision and recall by using the fractions of TP, FP and FN,
    as shown in [Figure 5.2](#15_Chapter05.xhtml#fig5_2).


    To fully evaluate the result of a classification task, we need to examine both,
    precision and recall. In practice, improving precision often reduces recall and
    vice versa. If the number of false positives decreases, the number of false negatives
    increase. There is always a tradeoff between precision and recall and it depends
    on the problem at hand what good values are for both. It is difficult to compare
    models with high precision and low recall or vice versa.


    ![Figure 5.2: Precision and recall.](images/fig5_2.jpg)


    **[Figure 5.2:](#07_ListofFig.xhtml#fig5_2)** Precision and recall.


    A metric for the accuracy of a classification task, which considers both precision
    and recall, is the F-score, or F1-score. F-score is the harmonic mean of precision
    and recall and is defined in [equation 5.4](#15_Chapter05.xhtml#eq5_4):


    | $F - score = 2 \\times \\frac{precision \\times recall}{precision + recall}$
    || (5.4) |


    | --- | --- |


    An F1-score reaches 1 for perfect precision and recall, and 0 in the worst case.
    Since the F1-score uses both, precision and recall, it is useful to compare models
    with high precision and low recall or vice versa. In practice, F1-score is often
    used in natural language processing tasks, such as document classification, or
    to evaluate the performance of search result classification.


    ### [5.1.3    Confusion matrix](#06_Contents.xhtml#sec5_1_3)


    A common way of visualizing the result of a classification task is to use a contingency
    table called a confusion matrix. The rows of the confusion matrix represent the
    predicted values, the columns represent the actual values. A confusion matrix
    can have two or more columns depending on the number of labels. A confusion matrix
    makes it easy to determine if the classifier is confusing two classes, hence its
    name. For instance, we can visualize the result of the cancer tissue classification
    using a confusion matrix, as shown in [Table 5.1](#15_Chapter05.xhtml#tab5_1).


    [**Table 5.1:**](#08_ListofTab.xhtml#tab5_1) Confusion matrix for the cancer tissue
    example.


    ![Image](images/tab5_1.jpg)


    If all samples were correctly classified only the fields in the diagonal white
    cells of [Table 5.1](#15_Chapter05.xhtml#tab5_1) have values, the other fields
    are all null. A confusion matrix allows a more detailed analysis of a classification
    result than using mere proportions of classifications and misclassifications since
    it contains all results.


    If there are more that two class labels and we have a multiclass classification
    problem, the confusion matrix has a row and column for each class label. For instance,
    if we want to classify wines according to their grape species, we might get a
    confusion matrix as shown in the upper matrix of [Figure 5.3](#15_Chapter05.xhtml#fig5_3).
    A confusion matrix also lets us compare one class versus all the other classes,
    as shown in the lower matrix in [Figure 5.3](#15_Chapter05.xhtml#fig5_3), where
    Shiraz is compared with all the other grape species.'
