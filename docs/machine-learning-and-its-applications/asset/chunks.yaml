    \ discretization and aggregation](#13_Chapter03.xhtml#sec3_7)\n\n[3.8    Entity\
    \ resolution](#13_Chapter03.xhtml#sec3_8)\n\nReal world data is seldom in a form\
    \ suitable for machine learning algorithms. It is typically noisy, contains redundant\
    \ and irrelevant data, or the data set is too large to be processed efficiently\
    \ in its original form. Data pre-processing extracts the relevant information,\
    \ the features, from a data set and transforms it into a form that can be used\
    \ as input for an machine learning algorithm, usually in the form of a feature\
    \ vector. Data pre-processing reduces the cost of feature measurement, increase\
    \ the efficiency of a learner, and allows for higher classification accuracy.\n\
    \nMachine learning algorithms are domain independent, data preprocessing is highly\
    \ domain specific and usually requires domain knowledge. Data pre-processing comprises\
    \ a large number of different techniques and often several training data sets\
    \ are created by using different pre-processing techniques. The learner is then\
    \ trained with each of the pre-processed training sets and the best performing\
    \ set is used for the final model. Some tools offer feature filtering so the same\
    \ data set can be tested with different features.\n\nTypical pre-processing tasks\
    \ include data deduplication, outlier removal, stop word removal from texts, where\
    \ irrelevant words or signs are removed from the original text. Sometimes data\
    \ is enriched with synthetic data or synthetic features, especially for sparse\
    \ data sets.\n\n[3.1    Feature extraction](#13_Chapter03.xhtml#sec3_1)\n[/content]\n\
