    ## 8.3 Recurrent neural networks


    A limitation of `perrons` and `convolutional networks` is that they require a
    `fixed-sized vector` as input and create a `fixed-sized output vector`. Also,
    the inputs to `traditional neural networks` are independent. `Recurrent neural
    networks` (`rNN`) operate over sequences of values ``x[1]`, …, `x[τ]` and they
    can produce sequences of vectors as output. The capability of processing `temporal
    sequences` makes them ideal for tasks where the input size is not known beforehand.
    For instance, in `machine translation`, the length of a `text` or `speech` we
    want to translate from one language into another might not be known beforehand.
    Consequently, we also not know the length of the translated text. The capability
    of processing sequences makes `recurrent neural networks` suitable for tasks such
    as `time series analysis`, understanding spoken words or sentiment analysis with
    variable sized inputs. Most `recurrent networks` can also process sequences of
    variable length [[8](#25_References.xhtml#ref8)].


    The foundational work on `recurrent neural networks` was performed by `Hopfield`
    and published in 1982 [[13](#25_References.xhtml#ref13)]. Since then, many types
    of `recurrent neural networks` have been developed, including `Elman networks`,
    `gated recurrent units`, `bidirectional recurrent networks` and `deep recurrent
    neural networks`, to name a few. Contrary to `feed-forward networks`, `recurrent
    neural networks` contain `directed cycles`. However, `recurrent neural networks`
    as well as `convolutional networks` are rarely used alone but are often part of
    a broader architecture often in combination with a `perceptron`, as we have seen
    in [section 8.2](#19_Chapter08.xhtml#sec_2).


    We have already introduced `recurrent neural networks` in [Chapter 4](#14_Chapter04.xhtml)
    where shallow learners were covered. In essence, as mentioned before a `recurrent
    neural network` adds `loops` to the network architecture. A neuron in a `recurrent
    neural network` might transmit a signal sideways to another neuron within the
    same layer or it might have a connection with itself in addition to the connection
    with a neuron in the next layer. The `output sequence` of the network might also
    be used as feedback with the next input sequence. [Figure 8.5](#19_Chapter08.xhtml#fig_5)
    shows some possible `recurrent network architectures`.


    ![Figure 8.5: Recurrent network types.](images/fig_5.jpg)


    **[Figure 8.5:](#07_ListofFig.xhtml#fig_5)** Recurrent network types.


    The `recurrent connections` add `memory` or `state` to the network. The `state`
    is usually stored in form of a `state vector` that is under the networks'' control.
    The `state vector` is combined with the input using a `learned function` to produce
    a new `state vector`. In this way, a `recurrent neural network` not only take
    into account the current input but also what it has perceived back in time. The
    decision at time step `t` is influenced by time step `t - 1`. This is very intuitive
    since we decide based on past experiences. The `sequential information` is preserved
    in a `hidden state` that allows the `recurrent neural network` to find correlations
    over time, called `long-term dependencies`. The hidden state `h` at time `t` can
    be calculated using [equation 8.4](#19_Chapter08.xhtml#eq_4):


    | `h[t] = σ(W*x[t] + U*h[t-1])` | (8.4) |

    | --- | --- |


    where


    | `h[t]` = Hidden state at time step `t` |

    | --- | --- |

    | `x[t]` = Input vector at time step `t` |

    | `W` = Weight matrix |

    | `U` = Transition matrix |

    | `h[t-1]` = Hidden state at time step `t-1` |

    | `σ` = Activation function |


    The `transition matrix` is the `hidden-state-to-hidden-state matrix` and represents
    the `memory` of the `recurrent neural network`. The `hidden state` contains traces
    of all previous `hidden states`, not just the last one. The `weight matrix` `W`
    determines how much importance to accord to the input in the same way as we have
    seen with other types of networks. The `activation function` `σ` is usually a
    `logistic` or a `hyperbolic tangent function`.


    A `recurrent neural network` is not necessarily a deep learner. As shown in [Figure
    8.5](#19_Chapter08.xhtml#fig_5), a `recurrent network` is also organized into
    layers and a `recurrent neural network` is usually called `deep recurrent neural
    network` if it has more than one `hidden layer`.

