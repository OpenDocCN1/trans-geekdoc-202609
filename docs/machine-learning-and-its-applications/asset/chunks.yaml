    的质心。算法 6.1 的第三步和第四步尝试最小化目标函数——误差平方和。误差平方和也称为离散度（scatter）。误差平方和越小，意味着质心（簇的原型）比误差平方和更高的簇能更好地代表该簇中的点。一旦
    `k-means` 算法连续两次迭代之间的误差平方和之差小于指定值，过程就会停止。


    有几点备注：`k-means` 不限于欧几里得空间。`k-means` 聚类是一种通用的聚类算法，可以用于多种数据类型，包括文档数据和时间序列。`k-means`
    对初始质心非常敏感。对于同一个数据集，不同的初始质心可能会产生不同的结果。缓解这一问题的一种方法是运行多次 `k-means`，并根据目标函数或观察到的主要的聚类分配选择产生最佳结果的运行。另一种方法是首先随机选择一个样本数据集，并使用层次聚类来确定
    `k` 的数量。


    由于 `k-means` 将实例分配给最近的质心，因此簇形成超球体，换句话说，它们是球形形状，质心即为中心。`k-means` 聚类对于非球形的簇效果并不佳。可以使用变换对数据集进行预处理来解决这一问题。


    ## 6.3 层次聚类


    层次聚类，也称为层次聚类分析（HCA），是一系列密切相关的聚类算法，这些算法构建了簇的层次结构。层次聚类不仅对数据进行划分，还描绘了簇之间的关系。聚类主要有两种基本方法：合并聚类（agglomerative
    clustering）和分裂聚类（divisive clustering）。合并聚类遵循自下而上的策略，每个实例开始都是自己的一个簇。每个数据点根据相似性与一个或多个点融合，形成更大的簇。在最后一步，我们得到一个包含所有实例的簇。分裂聚类是一种自上而下的方法，工作方式相反。聚类从一个单一簇开始，将其分为子簇。子簇在接后的迭代中进一步细分，直到每个数据点都属于自己的簇。分裂聚类不需要经过所有迭代，一旦满足停止标准即可停止。这两种方法如图[图
    6.2]所示。合并方法在程序实现上往往更简单，而分裂方法似乎更接近人类大脑的工作方式。在实践中，合并聚类被更广泛。


    ![图 6.2: 合并与分裂聚类。](img/fig6_2.jpg)


    [图 6.2:] 合并与分裂聚类。


    ![图 6.2: 合并与分裂聚类。](img/fig6_2.jpg)


    [图 6.3:] 单链连接、完全连接和平均连接。


    ![图 6.3: 单链连接、完全连接和平均连接。](img/fig6_3.jpg)


    ## 6.4 聚类可视化


    层次簇通常以树图（dendrogram，即树状图）的形式显示，如图[图 6.4]所示。树图显示了簇、它们的关系以及它们被融合或分裂的顺序。


    可以在特定层级剪切树图以创建单独的簇。然而，树图不能用于确定簇的数量，但它通常能给出一个正确的数量。在库的示例中，用户必须定义在哪里进行切割。对于历史书籍来说，可能有一个簇就足够了。如果历史书太多，那么使用子簇（如“古代世界”、“中世纪”和“现代”）并将它们放在不同的书架上可能是有意义的。


    ![图 6.4: 树图聚类。](img/fig6_4.jpg)


    ## 6.5 聚类评估


    如前所述，评估簇是一项挑战性工作，因为通常没有标准的真值（ground truth）。聚类分析通常用于探索性数据分析项目。因此，聚类评估的重要性似乎并不显而易见。评估簇具有以下几个原因：


    1. 不同的聚类分析方法可能会发现不同的簇。

    2. 正确的簇数量可能只有在聚类评估期间才会变得明显。

    3. 发现的簇并不相关，或者即使在不存在聚类数据的情况下也发现了簇。


    ```

    Algorithm 6.2 合并聚类算法

    1. 计算距离矩阵

    2. repeat

    3. 合并两个最近的簇

    4. 计算新簇的距离并更新距离矩阵

    5. until 只剩一个簇

    ```


