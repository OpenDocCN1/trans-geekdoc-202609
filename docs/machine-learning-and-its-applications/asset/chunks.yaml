  fmt: '

    Despite the fact that the independence assumption is often wrong, the na¨ıve Bayesian
    classifier still performs surprisingly well in real-world applications, even with
    small training data sets. One advantage is that it returns not only the prediction
    but also the degree of certainty, which is often very useful. Also, it makes dealing
    with missing values easy. Due to its simplicity, the naïve Bayesian classifier
    is less prone to overfitting from artificial neural networks, for example. Besides
    text analysis, it is also used for weather prediction, medical diagnosis, face
    recognition and recommendation engines, to name a few.


    ### 4.1.3 Decision trees


    Decision trees or decision tree induction is an other type of widelyused classifiers.
    Decision tree induction is the learning of decision trees from class-labeled training
    tuples [[10]]. It generates a tree-like structure, where each node represents
    a decision for an attribute except the leaf nodes. Trees are one of the most common
    and powerful data structures in computer science in general. [Figure 4.7] shows
    a simple decision tree to predict whether there will likely be a thunderstorm
    or not, based on the attributes of temperature and humidity.


    The top node is called root node and holds the first attribute, the end nodes
    are called leaf nodes and hold a class label. The branches represent the outcome
    of a decision on an attribute. In [Figure 4.7], we have two binary splits with
    just “yes” or “no”. There can be more than just two splits. In this case, we have
    a nonbinary tree. For instance, we want to predict what type of car a potential
    customer is going to buy based on some attributes such as “income”, “age”, “family
    status”, etc. We might have a split with three branches such as “family car”,
    “sports car” and “luxury car”.


    ![Figure 4.7: Decision tree.](images/fig4_7.jpg)


    **[Figure 4.7:]** Decision tree.


    New data navigates through a decision tree starting at the root node and then
    passing down to the leaf nodes. Each feature is evaluated in a node while progressing
    to the leaf nodes where we receive the classification result, the class label,
    of an instance. If the target variable is categorical, such as “family car”, “sports
    car”, etc., it is a classification tree, if the target variable is continuous,
    it is a regression tree. In it’s simplest form, a decision tree can consist of
    just a set of if-then rules (logical disjunctions). Decision trees are flowchart-like
    and, since decision trees consist of nodes and edges between the nodes, they are
    essentially restricted graphs.


    Developing an algorithm that creates a decision tree is far more complicated than
    using it. However, most algorithms are based on the same principle. At each step
    we should choose the attribute that gives us most information based on what we
    already know. If we want to classify objects, we should ask more general questions
    such as “is it a vehicle?” before we ask “is it a truck?”. Deciding how much information
    is provided by each question based on certain prior knowledge is a task for information
    theory and can be challenging. Fortunately, algorithms for decision tree generation,
    such as `ID3`, `C4.5` and `CART`, have been around for decades.


    Evaluating the tree differs from other classifiers. We use `Gini index` or `entropy`
    to determine the impurity. The Gini index, also called Gini coefficient, Gini
    impurity or Gini ratio, is a measure of dispersion used in economics and has been
    developed to represent the wealth distribution of a nation. When building a decision
    tree it lies between 0 and 1. If the separation is perfect, the Gini index is
    0. If the index is 1, the attributes are equally distributed in the two splits.
    So, we want splits with low Gini index. The `CART` algorithm uses Gini impurity.
    The Gini index is defined by:


    ```

    D = 1 - \sum_{i = 1}^{c}p_{i}^{2}

    ```


    Where:

    - `p_i`: Probability that a tuple in `D` belongs to class `i`

    - `c`: Number of classes


    Information gain is based on the notion of entropy from information theory. The
    information gain is the entropy of the parent node minus the entropy of the child
    nodes. It weights the probability of a class by the `log` of the class probability.
    The entropy is defined by:


    ```

    E = \sum_{i = 1}^{c}{- p_{i}\log_{2}p_{i}}

    ```


    Where:

    - `p_i`: Percentage of each class in the child node

    - `c`: Number of classes


    The smaller the entropy value the better, in other words, the difference between
    the parent nodes entropy is larger. The Gini index caps at 1, whereas the maximum
    value for entropy depends on the number of classes. It is based on `log`, so for
    two classes, the maximum entropy is 1, for four classes it is 2, and so on.


    Decision trees are very popular classifiers for several reasons. Decision trees
    are intuitive and easy to interpret. They are often used with text features instead
    of numeric features, making them human readable. The computational cost of making
    the tree is fairly low, and the cost of using it is even lower: `O(log N)`, where
    `N` is the number of datapoints [[25]]. The construction of decision tree classifiers
    does not require any domain knowledge or parameter setting, and, therefore, is
    appropriate for exploratory knowledge discovery [[10]]. A decision tree can be
    represented by a set of logical disjunctions that can be easily programmed.


