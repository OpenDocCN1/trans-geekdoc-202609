- raw: '![Figure 9.2: The bias-variance tradeoff.](images/fig9_2.jpg)


    **[Figure 9.2:](#07_ListofFig.xhtml#fig9_2)** The bias-variance tradeoff.


    As mentioned, managing bias and variance is essentially dealing with under- and
    overfitting. Applying an appropriate learning method is crucial for obtaining
    well fitted models. Which learning method is most suitable depends on several
    factors. For instance, if there is only limited training data available, cross-validation
    can be an effective learning method. Cross-validation divides the available data
    into subsets that are used alternatively for training and testing and, thus, eventually
    exploiting all data in an optimized way. Dimensionality reduction, which refers
    to the process of reducing the number of variables, might be used to prevent overfitting.
    Dimensionality reduction can mean feature selection, basically selecting a subset
    of the original variables for training, or feature extraction, which means reducing
    the dimensionality of the space. Both methods can be used to prevent overfitting.
    It should be noted that it is often computationally not feasible to find the best
    fit.


    ## [9.2    Cross-validation](#06_Contents.xhtml#sec9_2)


    Cross-validation is a statistical method for assessing how well machine learning
    models generalize on new data. It is usually used for predictive tasks in order
    to evaluate how accurately a model will perform in practice. It is often used
    to compare and select predictive models since it is easy to implement and interpret.
    The results tend to have lower bias than other models.


    A frequently used type of cross-validation is k-fold cross-validation. k-fold
    cross-validation is a resampling procedure that can be used when there is limited
    training data. Whereas normally a data set is split into training, validation
    and test data, k-fold cross-validation uses all observations for training and
    testing. The basic ideas is to split the training data into *k* equal sized folds
    randomly and use *k* − 1 folds for training and the remaining hold out fold for
    testing. This procedure is repeated *k* times until every fold has been used exactly
    once for testing. In this way, all the instances are used for training and every
    observation is used for validation only once. If, for instance, *k* = 10 it is
    also called 10-fold cross-validation.


    The only configurable parameter in k-fold cross-validation is *k*. Usually, setting
    *k* = 10 yields a learner that performs well. Extensive tests on numerous different
    datasets, with different learning techniques, have shown that 10 is about the
    right number of folds to get the best estimate of error, and there is also some
    theoretical evidence that backs this up \[[40](#25_References.xhtml#ref40)\].
    However, when a cross-validation experiment is repeated, and a new set of folds
    is randomly selected, the results can often be different. A common approach is
    to repeat 10-fold cross-validation 10 times and then average the results. The
    downside is that, in this case, the learning algorithm is invoked 100 times, which
    can be computationally expensive.


    A variation is leave-one-out cross-validation. Leave-one-out cross-validation
    is an extreme version of k-fold cross-validation where *k* equals *n*, the data
    set. The learner is trained on *n*–1 observations and a prediction is made for
    the remaining observation point. As before, this process is repeated until each
    data point has been used for validation once and the results are averaged. This
    sounds computationally expensive, but there are implementations that do not require
    more computing time than other methods.


    Stratification is a technique that is often used with cross-validation. Stratification
    helps reduce variance but it does not eliminate it entirely. When using stratification,
    the folds are selected in such a way as to assure equal distribution of the class
    labels in all folds to avoid over-or underrepresentation of a label in any data
    subset. Stratification was explained in [section 3.2](#13_Chapter03.xhtml#sec3_2).
    When used with stratification, it is called stratified k-fold cross-validation.
    When used, for instance, for binary classification, the proportion of the two
    classes are roughly equally distributed in each fold. Neither the distribution
    nor the folds have to be exact. The data is divided into approximately equal folds.
    Stratified 10-fold cross-validation has become the quasi standard method and it
    is a good starting point if choosing *k* is causing difficulties. Usually, the
    results do not differ much if 5 or 20 is set for *k*.


    ## [9.3    Ensemble learning](#06_Contents.xhtml#sec9_3)


    Ensemble learning, or ensembling, combines several trained models from the same
    data, usually of the same class. It is often advantageous to take the training
    data and derive several different training sets from it, learn a model from each,
    and combine them to produce an ensemble of learned models \[[40](#25_References.xhtml#ref40)\].
    Ensembling often allows to improve the predictive performance of a model by combining
    several rather weak learners to create a strong one. If several learning schemes
    have been trained, instead of using the best performing one, the results of all
    the trained learners are combined. Ensembling can be used for supervised and unsupervised
    learning.


    Two common ensemble learning techniques are bagging and boosting. In bagging,
    an abbreviation of bootstrap aggregating, several similar learners are trained.
    Another bagging technique trains several different learners using different training
    data sets. Then the results are combined either through averaging or through modal
    votes. This helps reduce overfitting and variance. Variance reflects the sensitivity
    of the model and it increases when the complexity of the model increases. A model
    with high variance tends to be overfitted and does not generalize well beyond
    the training data set.


    In boosting, a model is incrementally created. Each model is trained on the instances
    the previous model misclassified. The most popular boosting algorithm is AdaBoost,
    adaptive boosting. AdaBoost is less prone to overfitting, but it is sensitive
    to noise in the data or to outliers. AdaBoost is a heuristic approach that potentially
    improves the performance of the learner. A problem of machine learning is that
    there are potentially a large number of features, the problem of high dimensionality.
    AdaBoost only selects the features that potentially improve the predicting power
    of the model by reducing the dimensionality and, thus, reduces execution time.


    ## [9.4    Reinforcement learning](#06_Contents.xhtml#sec9_4)


    Reinforcement learning is a reward-based learning technique. It is inspired by
    nature and can be compared with, for instance, training a dog to stand on its
    back feet. The dog gets a dog biscuit when it learns to stand on the back feet.
    Similarly, in reinforcement learning, there is a reward function used to train
    an agent how to act. Reinforcement learning is different from supervised learning
    since no correct input/output pairs need to be present for training. In essence,
    in reinforcement learning, an agent learns to react to an environment. It is considered
    a separate learning paradigm from supervised and unsupervised learning.


    ![Figure 9.3: Reinforcement learning.](images/fig9_3.jpg)


    **[Figure 9.3:](#07_ListofFig.xhtml#fig9_3)** Reinforcement learning.'
  fmt: '

    ![Figure 9.2: The bias-variance tradeoff.](images/fig9_2.jpg)


    **[Figure 9.2:](#07_ListofFig.xhtml#fig9_2)** The bias-variance tradeoff.


    As mentioned, managing bias and variance is essentially dealing with under- and
    overfitting. Applying an appropriate learning method is crucial for obtaining
    well fitted models. Which learning method is most suitable depends on several
    factors. For instance, if there is only limited training data available, cross-validation
    can be an effective learning method. Cross-validation divides the available data
    into subsets that are used alternatively for training and testing and, thus, eventually
    exploiting all data in an optimized way. Dimensionality reduction, which refers
    to the process of reducing the number of variables, might be used to prevent overfitting.
    Dimensionality reduction can mean feature selection, basically selecting a subset
    of the original variables for training, or feature extraction, which means reducing
    the dimensionality of the space. Both methods can be used to prevent overfitting.
    It should be noted that it is often computationally not feasible to find the best
    fit.


    ## 9.2 Cross-validation


    Cross-validation is a statistical method for assessing how well machine learning
    models generalize on new data. It is usually used for predictive tasks in order
    to evaluate how accurately a model will perform in practice. It is often used
    to compare and select predictive models since it is easy to implement and interpret.
    The results tend to have lower bias than other models.


    A frequently used type of cross-validation is `k-fold cross-validation`. `k-fold
    cross-validation` is a resampling procedure that can be used when there is limited
    training data. Whereas normally a data set is split into training, validation
    and test data, `k-fold cross-validation` uses all observations for training and
    testing. The basic ideas is to split the training data into `k` equal sized folds
    randomly and use `k - 1` folds for training and the remaining hold out fold for
    testing. This procedure is repeated `k` times until every fold has been used exactly
    once for testing. In this way, all the instances are used for training and every
    observation is used for validation only once. If, for instance, `k = 10` it is
    also called `10-fold cross-validation`.


    The only configurable parameter in `k-fold cross-validation` is `k`. Usually,
    setting `k = 10` yields a learner that performs well. Extensive tests on numerous
    different datasets, with different learning techniques, have shown that 10 is
    about the right number of folds to get the best estimate of error, and there is
    also some theoretical evidence that backs this up. However, when a cross-validation
    experiment is repeated, and a new set of folds is randomly selected, the results
    can often be different. A common approach is to repeat 10-fold cross-validation
    10 times and then average the results. The downside is that, in this case, the
    learning algorithm is invoked 100 times, which can be computationally expensive.


    A variation is `leave-one-out cross-validation`. `leave-one-out cross-validation`
    is an extreme version of `k-fold cross-validation` where `k` equals `n`, the data
    set. The learner is trained on `n–1` observations and a prediction is made for
    the remaining observation point. As before, this process is repeated until each
    data point has been used for validation once and the results are averaged. This
    sounds computationally expensive, but there are implementations that do not require
    more computing time than other methods.


    Stratification is a technique that is often used with cross-validation. Stratification
    helps reduce variance but it does not eliminate it entirely. When using stratification,
    the folds are selected in such a way as to assure equal distribution of the class
    labels in all folds to avoid over-or underrepresentation of a label in any data
    subset. Stratification was explained in section 3.2. When used with stratification,
    it is called `stratified k-fold cross-validation`. When used, for instance, for
    binary classification, the proportion of the two classes are roughly equally distributed
    in each fold. Neither the distribution nor the folds have to be exact. The data
    is divided into approximately equal folds. `Stratified 10-fold cross-validation`
    has become the quasi standard method and it is a good starting point if choosing
    `k` is causing difficulties. Usually, the results do not differ much if 5 or 20
    is set for `k`.


    ## 9.3 Ensemble learning


    Ensemble learning, or ensembling, combines several trained models from the same
    data, usually of the same class. It is often advantageous to take the training
    data and derive several different training sets from it, learn a model from each,
    and combine them to produce an ensemble of learned models. Ensembling often allows
    to improve the predictive performance of a model by combining several rather weak
    learners to create a strong one. If several learning schemes have been trained,
    instead of using the best performing one, the results of all the trained learners
    are combined. Ensembling can be used for supervised and unsupervised learning.


    Two common ensemble learning techniques are `bagging` and `boosting`. In `bagging`,
    an abbreviation of bootstrap aggregating, several similar learners are trained.
    Another bagging technique trains several different learners using different training
    data sets. Then the results are combined either through averaging or through modal
    votes. This helps reduce overfitting and variance. Variance reflects the sensitivity
    of the model and it increases when the complexity of the model increases. A model
    with high variance tends to be overfitted and does not generalize well beyond
    the training data set.


    In `boosting`, a model is incrementally created. Each model is trained on the
    instances the previous model misclassified. The most popular boosting algorithm
    is `AdaBoost`, adaptive boosting. `AdaBoost` is less prone to overfitting, but
    it is sensitive to noise in the data or to outliers. It is a heuristic approach
    that potentially improves the performance of the learner. A problem of machine
    learning is that there are potentially a large number of features, the problem
    of high dimensionality. `AdaBoost` only selects the features that potentially
    improve the predicting power of the model by reducing the dimensionality and,
    thus, reduces execution time.


    ## 9.4 Reinforcement learning


    Reinforcement learning is a reward-based learning technique. It is inspired by
    nature and can be compared with, for instance, training a dog to stand on its
    back feet. The dog gets a dog biscuit when it learns to stand on the back feet.
    Similarly, in reinforcement learning, there is a reward function used to train
    an agent how to act. Reinforcement learning is different from supervised learning
    since no correct input/output pairs need to be present for training. In essence,
    in reinforcement learning, an agent learns to react to an environment. It is considered
    a separate learning paradigm from supervised and unsupervised learning.


    ![Figure 9.3: Reinforcement learning.](images/fig9_3.jpg)


    **[Figure 9.3:](#07_ListofFig.xhtml#fig9_2)** Reinforcement learning.

    '
  trans: '


    ![图 9.2: 偏差-方差权衡。](img/fig9_2.jpg)


    **图 9.2：** 偏差-方差权衡。


    正如提到的，管理偏差和方差本质是处理欠拟合和过拟合。应用适当的学习方法对于获得拟合良好的模型至关重要。哪种学习方法最取决于取决于因素。例如，如果可用的训练数据有限，交叉验证是一种有效的学习方法。交叉验证将可用数据分为若干子集，交替用于训练和测试，从而以优化的方式利用所有数据。降维是指减少变量数量的过程，可能用于防止过拟合。降维可以指特征选择（基本上是选择原始变量的一个子集进行训练），也可以指特征提取（即降低空间的维度）。这两种方法都可以用于防止过拟合。需要注意的是，寻找最佳拟合点在计算上通常是不可行的。


    ## 9.2 交叉验证


    交叉验证是一种统计方法，用于评估机器学习模型在数据数据上的泛化能力。它通常用于预测任务，以评估模型在实际应用中的表现准确性。由于其易于实现和解释，它经常用于比较和选择预测模型。其结果往往比其他模型具有低的偏差。


    一种常用的交叉验证类型是`k-折交叉验证`。`k-折交叉验证`是一种在训练数据有限时使用的重采样程序。通常数据集被分为训练数据、验证数据和测试数据，而`k-折交叉验证`使用所有观测值进行训练和测试。基本思想是将训练数据随机分成`k`
    个等大的折，并使用`k - 1` 个折进行训练，将其留的一个折用于测试。此过程重复`k` 次，直到每个折都恰好被用于测试一次。通过这种方式，所有实例都被用于训练，每个观测值仅被用于验证一次。例如，如果
    `k = 10`，它也称为`10-折交叉验证`。


    `k-折交叉验证`中唯一的可配置参数是`k`。通常，设置 `k = 10` 可以产生性能良好的学习器。在许多不同数据集上使用不同学习技术进行的广泛测试表明，10
    是获得最佳误差估计的合适的折数，也有一些理论证据支持这一点。然而，当重复交叉验证实验并随机选择一组新的折时，结果往往会有不同。一种方法是重复 10-折交叉验证
    10 次，然后对结果取平均。缺点是，在这种情况下学习算法被调用了 100 次，这在计算上可能是昂贵的。


    一种变体是`留一法交叉验证`。`留一法交叉验证`是`k-折交叉验证`的一种极端版本，其中 `k` 等于 `n`（数据集的大小）。学习器在 `n–1` 个观测值上进行训练，并对剩余的观测点进行预测。与之前一样，重复此过程直到每个数据点都被用于验证一次，并对结果取平均。这听起来在计算上很贵，但某些实现所需的计算时间并不比其他方法更多。


    分层（Stratification）是一种经常与交叉验证一起使用的技术。分层有助于减少方差，但不能完全消除它。在使用分层时，折的选取方式确保了所有折中类别标签的分布相等，以避免标签在任何数据子集中出现过度代表或代表不足的情况。分层在第
    3.2 节中解释过。当与分层结合使用时，被称为`分层 k-折交叉验证`。例如，当用于二分类时，两个类别的比例在每个折中大致分布相等。分布或折都不需要完全精确。数据被划分为大致相等的折。`分层
    10-折交叉验证`已成为准标准方法，如果选择 `k` 导致困难，这是一个很好的起点。通常，如果将 `k` 设置为 5 或 20，结果差异并不大。


    ## 9.3 集成学习


    集成学习（Ensemble learning）从相同的数据中结合多个训练好的模型，这些模型通常是同一类别的。获取训练数据并从中推出几个不同的训练集，从每个训练集中学习一个模型并将它们组合产生学习模型的集成通常是有优势的。集成通常允许通过结合几个较弱的学习器创建一个强学习器，从而提高模型的预测性能。如果训练了几个学习方案，与其使用性能最好的那个，不如结合所有已训练学习器的结果。集成可以用于监督学习和无监督学习。


    两种常见的集成学习技术是`bagging`和`boosting`。在`bagging`（自助聚合的缩写）中，训练了多个相似的学习器。另一种 bagging
    技术使用不同的训练数据集训练多个不同的学习器。然后通过平均或多数投票来组合结果。这有助于减少过拟合和方差。方差反映了模型的敏感性，当模型复杂度增加时，方差随之增加。高方差模型倾向于过拟合，在训练数据集之外的泛化能力不好。


    在`boosting`中，模型是增量创建的。每个模型都在前一个模型分类错误的实例上进行训练。最流行的 boosting 算法是`AdaBoost`（自适应提升）。`AdaBoost`
    较不容易过拟合，但它对数据中的噪声或离群值敏感。它是一种潜在提高学习器性能的启发式方法。机器学习的一个问题是存在大量的特征，即高维度问题。`AdaBoost`仅通过降低维度来潜在提高模型的预测能力，从而缩短执行时间。


    ## 9.4 强化学习


    强化学习是一种基于奖励的学习技术。它的灵感源于自然，可以与训练狗直立进行比较，例如，当狗学会直立时它会得到 get 饼干。同样，在强化学习中，有一个奖励函数用于训练智能体如何行动。强化学习与监督学习不同，因为训练时不需要正确的输入/输出对。本质上，在强化学习中，智能体学习对环境做出反应。它被认为是独立于监督和无监督学习的学习范式。


    ![图 9.3: 强化学习。](img/fig9_3.jpg)


    **图 9.3：** 强化学习。


    '
