    The ReLU has a derivative of either 0 for the flat part of the curve, or 1 for
    the skewed part. For a large training set, there will usually be instances that
    yield positive outputs at any given node. So, the average derivative is rarely
    close to 0. This allows gradient descent to keep improving the weights. However,
    ReLUs can sometimes be pushed into a state where they become inactive for all
    inputs and no gradients flow back to the neuron which is a form of the vanishing
    grade problem. There are variants to the ReLU. For instance, the softplus function
    is a smooth approximation of the ReLU, as shown in [Figure 8.2](#19_Chapter08.xhtml#fig8_2).
    It is defined by [equation 8.3](#19_Chapter08.xhtml#eq8_3).


    | *f*(*x*) = *l**o**g*(1+*e*^(*x*)) || (8.3) |


    | --- | --- |


    The derivative of the softplus function is the logistic function, which is also
    an approximation of the derivative of the ReLU.


    ![Figure 8.2: Softplus function.](images/fig8_2.jpg)


    **[Figure 8.2:](#07_ListofFig.xhtml#fig8_2)** Softplus function.


    ReLUs have several advantages. They are one sided and have no negative outputs,
    which is biologically more plausible. They are also efficient for computation
    since they only use addition, multiplication and comparison operations. Rectifiers
    have become the activation functions of choice for deep learners since, in comparison
    to sigmoid functions they allow for faster and more efficient training even on
    large networks with large data sets. Also, they do not need any semi-supervised
    pre-processing steps. Even though they can take advantage of semi-supervised setups
    with extra-unlabeled data, deep rectifier networks can reach their best performance
    without requiring any unsupervised pre-training on purely supervised tasks with
    large labeled datasets \[[7](#25_References.xhtml#ref7)\].


    ### [8.1.2    Feature learning](#06_Contents.xhtml#sec8_1_2)


    Feature learning is a set of techniques that allows a machine to automatically
    detect features without the need of a feature engineer to manually extract the
    features of interest. For instance, traditional approaches for object recognition
    in an image require a feature engineer to isolate the area in the image where
    the object is located and to omit the background. Using deep architectures, the
    object of interest is automatically detected, a process called object detection.
    A deep architecture is capable of doing both, object detection and object recognition.
    The layered architecture of a deep learner creates higher abstractions of the
    input in every layer. The output of every layer is a lower dimensional projection
    of the input. Provided the deep network is optimally weighted, the output of the
    network is a high-level abstraction of the raw data representing an automatic
    feature set. This feature set can then be used as input for the actual classification
    task. Automatic feature detection also helps to avoid human bias. Using, for instance,
    a convolutional neural network, the convolutional layer acts as a feature extractor.


    Feature learning is part of an effort to automate the whole end-to-end machine
    learning process, called automated machine learning. Automated machine learning
    aims to automate all machine learning tasks that are usually done manually, such
    as model selection or hyperparameter. However, automatic feature extraction is
    not always feasible. Feature learning is not restricted to deep learning and has
    been used with shallow learners, such as k-means clustering or principal component
    analysis.


    ## [8.2    Convolutional neural networks](#06_Contents.xhtml#sec8_2)


    Convolutional neural networks (CNN), also called ConvNets, have become very popular
    for image analysis tasks, such as image classification and tagging, object recognition,
    face detection and recognition and optical character recognition. They are inspired
    by the human visual cortex and how it assimilates visual information and have
    been developed specifically for image analysis. One of the first convolutional
    neural networks was proposed by Yan LeCun in 1998 \[[19](#25_References.xhtml#ref19)\],
    one of the three fathers of deep learning, Yoshua Bengio, Geoffrey Hinton, and
    Yann LeCun \[[28](#25_References.xhtml#ref28)\]. However, the first convolutional
    network goes further back to the 1980s and many different convolutional neural
    network architectures have been proposed since then.


    Since convolutional neural networks use images as input, some of the image processing
    properties have been reflected in their architecture. Convolutional neural networks
    consist of an interleaved set of feed-forward layers implementing convolutional
    filters followed by reduction, rectification or pooling layers. Contrary to the
    multilayer perceptron that we have seen in [Chapter 4](#14_Chapter04.xhtml), a
    convolutional neural network is not fully connected. Also, in a convolutional
    neural network, neurons are arranged in three dimensions and they accept a three
    dimensional fixed size input image. The output is a single vector. Otherwise,
    they are not very different from traditional neural networks that we have already
    seen and many training techniques that we have seen can be used for convolutional
    neural networks. The convolutional networks used for object recognition from photos
    are a specialized kind of feed-forward network \[[8](#25_References.xhtml#ref8)\].
    They consist of neurons with learnable weights and biases. They are trained using
    a loss function, backpropagation and gradient descent. In practice, having more
    than three layers rarely helps improve the accuracy of a traditional neural network.
    In contrast, using deep learners, depth is extremely important for a recognition
    application and a convolutional neural network typically has ten to twenty learnable
    layers. Since every layer projects a higher level of abstraction of the image,
    having several layers is intuitive since objects are made up of shapes, shapes
    are made up of edges, and so on.


    In essence, a convolutional neural network consists of five types of layers, an
    input layer and an output layer and three types of intermediate layers: convolutional
    layers, pooling layers and non-linearity layers, typically a ReLU.


    ▪  The input layer accepts an image, a fixed size three dimensional pixel array:
    \[width x hight x color channel\]


    ▪  The convolutional layer extracts spatial features from small regions of the
    image and connects these regions with one unit in the next layer


    ▪  The pooling layer reduces neighboring features into single units, this downsampling
    operation reduces the size of the image


    ▪  The ReLU layer applies the activation function, such as *max*(0, *x*), the
    image size remains unchanged


    ▪  The output layer in form of a fully connected multilayer perceptron (MLP) calculates
    the class score and outputs a vector holding the score


    It should be noted that some convolutional neural networks can also process variable
    sized images.


    [Figure 8.3](#19_Chapter08.xhtml#fig8_3) shows an example architecture of a convolutional
    neural network with a succession of the different types of processing layers.
    It takes a raw image as input and passes it through the different layers. The
    output of the fully connected multilayer perceptron is a vector holding the class
    scores. For ease of representation, [Figure 8.3](#19_Chapter08.xhtml#fig8_3) is
    drawn in 2D. In essence, the convolutional neural network acts as a feature extractor
    for the multilayer perceptron. The convolutional layer extracts the relevant features,
    the pooling layers makes the features equivariant to scale and translation.


    ![Figure 8.3: Convolutional neural network layers.](images/fig8_3.jpg)


    **[Figure 8.3:](#07_ListofFig.xhtml#fig8_3)** Convolutional neural network layers.'
