- raw: 'Feature extraction, also called feature selection or feature engineering,
    is one of the most important tasks to find hidden knowledge or business insides.
    In machine learning, rarely is the whole initial data set that was collected used
    as input for a learning algorithm. Instead, the initial data set is reduced to
    a subset of data that is expected to be useful and relevant for the subsequent
    machine learning tasks. Feature extraction is the process of selecting values
    from the initial data set. Features are distinctive properties of the input data
    and are representative descriptive attributes. In literature, there is often a
    distinction between feature selection and feature extraction \[[43](#25_References.xhtml#ref43)\].
    Feature selection means reducing the feature set into a smaller feature set or
    into smaller feature sets, because not all features are useful for a specific
    task. Feature extraction means converting the original feature set into a new
    feature set that can perform a data mining task better or faster. Here, we treat
    feature extraction and feature selection interchangeably. Feature selection and,
    as mentioned before, generally data pre-processing is highly domain specific,
    whereas machine learning algorithms are not. Feature selection is also independent
    of the machine learning algorithm used.


    Features do not need to be directly observable. For instance, a large set of directly
    observable features might be reduced using dimensionality reduction techniques
    into a smaller set of indirectly observable features, also called latent variables
    or hidden variables. Feature extraction can be seen as a form of dimensionality
    reduction. Often features are weighted, so that not every feature contributes
    equally to the result. Usually the weights are presented to the learner in a separate
    vector.


    A sample feature extraction task is word frequency counting. For instance, reviews
    of a consumer product contain certain words more often if they are positive or
    negative. A positive review of a new car typically contains words such as “good”,
    “great”, “excellent” more often than negative reviews. Here, feature extraction
    means defining the words to count and counting the number of times a positive
    or negative word is used in the review. The resulting feature vector is a list
    of words with their frequencies. A feature vector is an n-dimensional vector of
    numerical features, so the actual word is not part of the feature vector itself.
    The feature vector can contain the hash of the word as shown in [Figure 3.1](#13_Chapter03.xhtml#fig3_1),
    or the word is recognized by its index, the position in the vector.


    Another example of feature extraction is object recognition in an image. The region
    of the object of interest has to be detected in the image and the shape has to
    be isolated. The background of the region is omitted. The relevant region is then
    converted into a pixel array which can be used as the input vector for a learning
    scheme.


    As with machine learning schemes, there are many different feature extraction
    techniques and there are no simple recipes. A lot of research has been conducted
    in automatic feature extraction, also called feature learning. Since feature extraction
    is a laborious and time consuming task, automatic feature selection can potentially
    speed up a data mining project considerably. In recent years, great advances have
    been made using deep learners. Deep learners have the capability to automatically
    extract features. Deep learners have learned how to play games such as chess without
    being trained to learn the rules first. They learned the rules through trial and
    error. Also, deep learners such as convolutional neural networks can extract the
    relevant areas in an image by themselves without any image pre-processing. Next
    to the astoundingly good results of deep learners in tasks such as multimedia
    mining and natural language processing, automatic feature extraction is one of
    the most exciting advancements in machine learning.


    ![Figure 3.1: Feature vector.](images/fig3_1.jpg)


    **[Figure 3.1:](#07_ListofFig.xhtml#fig3_1)** Feature vector.


    ## [3.2    Sampling](#06_Contents.xhtml#sec3_2)


    Data sampling is the process of selecting a data subset, since analyzing the whole
    data set is often too expensive. Sampling reduces the number of instances to a
    subset that is processed instead of the whole data set. Samples can be selected
    randomly so every instance has the same probability to be selected. The selection
    process should guarantee that the sample is representative of the distribution
    that governs the data, thereby ensuring that results obtained on the sample are
    close to ones obtained on the whole data set \[[43](#25_References.xhtml#ref43)\].


    There are different ways data can be sampled. When using random sampling, each
    instance has the same probability to be selected. Using random sampling, an instance
    can be selected several times. If the randomly selected instance is removed from
    the data set, we end up with no duplicates in the sample.


    Another sampling method uses stratification. Stratification is used to avoid overrepresentation
    of a class label in the sample and provide a sample with an even distribution
    of labels. For instance, a sample might contain an overrepresentation of male
    or female instances. Stratification first divides the data in homogeneous subgroups
    before sampling. The subgroups should be mutually exclusive. Instead of using
    the whole population, it is divided into subpopulations (stratum), a bin with
    female and a bin with male instances. Then, an even number of samples is selected
    randomly from each bin. We end up with a stratified random sample with an even
    distribution of female and male instances. Stratification is also often used when
    dividing the data set into a training and testing subset. Both data sets should
    have an even distribution of the features, otherwise the evaluation of the trained
    learner might give flawed results.


    ## [3.3    Data transformation](#06_Contents.xhtml#sec3_3)


    Raw data often needs to be transformed. There are many reasons why data needs
    to be transformed. For instance, numbers might be represented as strings in a
    raw data set and need to be transformed into integers or doubles to be included
    into a feature vector. Another reason might be the wrong unit. For instance, Fahrenheit
    needs to be converted into Celsius, or inch needs to be converted into metric.


    Sometimes the data structure has to be transformed. Data in JSON (JavaScript Object
    Notation) format might have to be transformed into XML (Extensible Markup Language)
    format. In this case, data mapping has to be transformed since the metadata might
    be different in the JSON and XML file. For instance, in the source JSON file names
    might be denoted by “first name”, “last name” whereas in the XML it is called
    “given name” and “family name”. Data transformation is almost always needed in
    one or another form, especially if the data has more than one source.


    ## [3.4    Outlier removal](#06_Contents.xhtml#sec3_4)


    Outlier removal is another common data pre-processing task. An outlier is an observation
    point that is considerably different from the other instances. Some machine learning
    techniques, such as logistic regression, are sensitive to outliers, i.e., outliers
    might seriously distort the result. For instance, if we want to know the average
    number of Facebook friends of Facebook users we might want to remove prominent
    people such as politicians or movie stars from the data set since they typically
    have many more friends than most other individuals. However, if they should be
    removed or not depends on the aim of the application, since outliers can also
    contain useful information.'
