- raw: 'There are many different semi-supervised training methods. Probably the earliest
    idea about using unlabeled data in classification is self-learning, which is also
    known as self-training, self-labeling, or decision-directed learning \[[4](#25_References.xhtml#ref4)\].
    The basic idea of self-learning is to use the labeled data set to train a learning
    algorithm, then use the trained learner iteratively to label chunks of the unlabeled
    data until all data is labeled using pseudo labels. Then the trained learner is
    retrained using its own predictions. Self-learning bears the risk that the pseudo-labeled
    data will have no effect on the learner or that self-labeling happens without
    knowing on which assumptions the self-learning is based on. The central question
    for using semi-supervised learning is, under which conditions does taking into
    consideration unlabeled data contribute to the prediction accuracy? In the worst
    case, the unlabeled data will deteriorate the prediction accuracy.


    ## [2.4    Function approximation](#06_Contents.xhtml#sec2_4)


    Function approximation (FA) is sometimes used interchangeably with regression.
    Regression is a way to approximate a given data set. Function approximation can
    be considered a more general concept since there are many different methods to
    approximate data or functions. The goal of function approximation is to find a
    function *f* that maps an input to an output vector. The function is selected
    among a defined class, e.g., quadratic functions or polynomials. For instance,
    [equation 4.14](#14_Chapter04.xhtml#eq4_14) is a first degree polynomial equation.
    Contrary to function fitting, where a curve is fitted to a set of data points,
    function approximation aims to find a function *f* that approximates a target
    function. Given one set of samples (*x, y*), we try to find a function *f*:


    | *f*:*X*→*Y* || (2.6) |


    | --- | --- |


    where


    |  *X* || \= Input space |


    | --- | --- |


    |  *Y* || \= Output space, number of predictions |


    where the input space can be multidimensional **X** ⊆ ℝ², in this case *n*\-dimensional.
    The function:


    | *f*(*x*) = *y* || (2.7) |


    | --- | --- |


    maps *x* ∈ *X* to *y* ∈ *Y*, where the distribution of *x* and the function *f*
    are unknown. *f* can have some unknown properties for a space where no data points
    are available.


    [Figure 2.8](#11_Chapter02.xhtml#fig2_8) shows an unknown function *f*(*x*) and
    some random data points.


    Function approximation is similar to regression and techniques such as interpolation,
    extrapolation or regression analysis can be used. Regression does essentially
    the same thing, create a model from a given data set. However, regression focuses
    more on statistical concepts, such as variance and expectation. Function approximation
    tries to explain the underlying data by finding a model *h*(*x*) for all samples
    (*x, y*), such that *h*(*x*) ≈ *y*. Ideally, the model equals the underlying function
    *f*(*x*) such that *h*(*x*) = *f*(*x*). However, there might be sub-spaces where
    no data points are available. To find a model, we need to measure the quality
    of the model. To do so, function approximation tries to minimize the prediction
    error. This is similar to evaluating a trained machine learning model, such as
    a Bayesian or a logistic regression model. An intuitive measure for the error
    is the mean absolute error (MAE). Given *n* instances (*x, y*), the model *h*(*x*)
    can be evaluated by calculating the mean absolute error as:


    ![Figure 2.8: Function approximation.](images/fig2_8.jpg)


    **[Figure 2.8:](#07_ListofFig.xhtml#fig2_8)** Function approximation.


    | $MAE = \\frac{1}{n}{\\sum\\limits\_{i = 1}^{n}\\left| {y\_{i} - h\\left( x\_{i}
    \\right)} \\right|}$ || (2.8) |


    | --- | --- |


    which measures the average deviation from the actual value. However, the mean
    absolute error does not take variance into account. It treats all errors evenly
    according to their magnitude. The mean absolute error is one of a number of ways
    to compare the predicted value with their eventual outcome. Other well established
    alternatives include the mean squared error or the root mean squared error. It
    is not always easy to decide which measure is appropriate. The squared error measures
    and root squared error measures weigh large discrepancies much more heavily than
    small ones, whereas the absolute error measures do not \[[40](#25_References.xhtml#ref40)\].
    Fortunately, in practical situations, the best prediction model is still the best,
    no matter which error measure is used.


    In the simplest form of function approximation, the type of function is known.
    When the underlying function type is known, e.g., polynomial, exponential or elliptic,
    only the parameters of the function have to be found and we have a curve fitting
    or model fitting problem. For instance, if the function *y* = *ax*² + *bx* + *c*
    has to be fitted to a given set of data points, we have to find the coefficients
    *a, b* and *c*. However, the underlying function type is often not known and needs
    to be found. The chosen function type is a best guess and a wrong assumption about
    the function type might result in poor quality models. Instead of using a predefined
    function, arbitrary models can be built using non-parametric regression. Using
    approaches such as interpolation, the function does not need to be specified in
    advance. The draw back is that learning takes considerably longer. There are many
    function approximation approaches and describing them is beyond the scope of this
    book. However, some of the machine learning approaches, such as artificial neural
    networks (ANN) and regression, can be used for function approximation and will
    be described in later chapters.


    ## [2.5    Generative and discriminative models](#06_Contents.xhtml#sec2_5)


    Predictive algorithms are often categorized into generative and discriminative
    models. This distinction presumes a probabilistic perspective on machine learning
    algorithms. Generally speaking, a generative model learns the joint probability
    distribution *p*(*x, y*), whereas a discriminative model learns the conditional
    probability distribution *p*(*y*|*x*), in other words, the probability of *y*
    given *x*. A generative algorithm models how the data was generated in order to
    categorize a signal. It is called generative since sampling can generate synthetic
    data points. Generative models ask the question: Based on my generation assumptions,
    which category is most likely to generate this signal? Generative models include
    na¨ıve Bayes, Bayesian networks, Hidden Markov models (HMM) and Markov random
    fields (MRF).


    A discriminative algorithm does not care about how the data was generated, it
    simply categorizes a given signal. It directly estimates posterior probabilities,
    they do not attempt to model the underlying probability distributions. Logistic
    regression, support vector machines (SVM), traditional neural networks and nearest
    neighbor models fall into this category. Discriminative models tend to perform
    better since they solve the problem directly, whereas generative models require
    an intermediate step. However, generative models tend to converge a lot faster.


    ## [2.6    Evaluation of learner](#06_Contents.xhtml#sec2_6)'
