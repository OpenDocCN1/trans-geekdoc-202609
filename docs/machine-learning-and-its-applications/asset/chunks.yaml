    # 8.5 深度信仰网络


    # 8.6 深度自动编码器


    深度学习是一种以人工神经网络为基础的技术，近年来已成为机器学习领域的一项强大工具，有望重塑人工智能的未来 [[33]]。深度学习者依赖大量的标记训练数据集来获得最先进的结果。深度学习已应用于图像分类、机器翻译或语音识别，深度学习模型出现在许多现代智能手机中，用于语音命令或人脸识别。它们还被用于自动驾驶汽车、手写识别、无人机侦察或黑白图像和电影上色等应用。尽管在许多领域取得了成功，但它们在根本上与传统的人工神经网络并没有区别。与旧的网络（如多层感知器）不同的是，它们通常使用整流器作为激活函数，而不是
    sigmoid 曲线，但它们仍然使用反向传播和梯度下降（即随机梯度下降）进行训练。然而，由于其规模庞大，计算可能会非常消耗资源，因为我们必须处理高维数据和大量的特征。例如，德语估计有
    330,000 个单词。在语音识别中，每个单词都是一个特征。如果我们想识别图像中的动物，网络必须针对自然界估计存在的 870 万种物种进行训练，且涵盖不同的角度、不同的年龄和不同的性别。训练数据的可用性通常是一个挑战，获取所需格式的标记训练数据集成本可能非常高昂。


    如今有许多不同的深度学习架构投入使用。在 GPU（图形处理器）出现之前，已经提出了一些理论想法，但 GPU 提供了加速深度学习架构发展的算力支持。深度学习者的计算（例如卷积神经网络
    CNN）可以被高度并行化，且矩阵乘法和卷积等代数操作可以转移到 GPU 上。GPU 提供了许多深度学习模型高效工作所需的计算能力。现在已经有了专门为 AI
    操作开发的芯片。


    ## 8.1 深度学习基础


    文献中并没有一个公认的定义来规定学习者何时被称为深度学习者，何时被称为浅学习者。本质上，深度学习是具有许多层的人工神经网络。通常，具有一个以上隐藏层的神经网络被认为是深度学习者。深度学习者可以用于监督、半监督和无监督学习。在过去的几年里，由于对计算机视觉、自然语言处理和生物信息学的影响，深度学习变得非常流行。深度学习者的一项核心能力是自动提取特征的能力。低层特征通过通过深层神经网络的不同层，被抽象为高层特征。


    目前已经提出了许多不同的深度学习架构。流行的深度学习架构包括卷积神经网络、深度信仰网络和深度递归网络。


    深度学习者属于表示学习器一类。表示学习器在做出最终预测之前会创建特征的内部表示。深度学习者在将特征映射到最终预测之前，会将特征转换为多种表示。例如，用于物体识别的卷积神经网络在不需要手动设计特征的情况下学习物体表示。它们的灵感源于动物的视觉皮层，并创建输入图像的内部表示。当信号通过网络层时，利用对象的层级特性，低层特征被转换为更高层次的抽象；边缘形成轮廓，轮廓形成形状，形状形成物体，以此此类推。


    在使用深度学习者时有几点需要考虑。训练深度学习者需要大量的标记训练数据。寻找最优的深度学习架构可能是一项艰巨的任务。过拟合和收敛可能会导致问题，网络层数越多，该问题就越严重。在深度学习者的训练过程中，神经元可能会“死亡”，这意味着它们对任何输入始终输出相同的值。死掉的单元也不可能恢复，且不会在训练后的网络中发挥作用。这主要发生在使用整流器作为激活函数时。另一个问题是梯度消失问题。在训练使用反向传播期间，误差函数的导数可能会变得很小，导致权重不再变化。在最坏的情况下，网络将完全停止学习。这些以及其他一些问题需要深度学习的补充学习策略。


    ### 8.1.1 激活函数


    如前所述，深度学习者与浅层神经网络没有太大区别。然而，深度学习者通常使用不同类型的激活函数。深度神经网络中最常用的激活函数是修正线性单元，或称 `ReLU`。它是一个非常简单的函数，对于负输入返回
    0，对于任何正 `x` 返回一个值（注：此处原文表述，应为返回其本身）。它可以写为：


    | `f(x) = max(0, x)` | (8.1) |

    | --- | --- |


    `ReLU` 是一种斜坡函数，从图形上看如图 8.1 所示。尽管非常简单，但它处理非线性和交互效应的效果异常地。非线性效应简单意味着自变量与预测之间的关系不是线性的，换句话说，图表的斜率不是恒定的。交互效应意味着变量
    `a` 对预测的影响取决于变量 `b` 的取值。例如，如果我们想根据体重预测患者心血管疾病的风险，我们还需要知道患者的高度。


    `ReLU` 在处理非线性方面效果如此好的原因是因为 `ReLUs` 可以以许多不同的方式组合。深度学习者本质上是非常巨大的函数。首先，对于我们在第 2 章和第
    4 章中看到的每个节点都有一个偏置（bias）。正如我们看到的，偏置只是在训练期间学习的常数，它沿着 `x` 轴向左或向右移动激活函数。由于 `ReLU`
    只有两个斜率，它是一个非线性函数，而偏置移动了斜率变化点。每个节点在同一层内甚至可以有自己的偏置，且每个节点可以在不同的点改变斜率。第二个原因初看起来违背直觉。正如我们所看到的，传统网络使用
    sigmoid 激活函数，浅层神经网络最流行的激活函数之一是双曲正函数，如公式 8.2 所示。激活函数的主要用途之一是解释非线性，由于双曲正函数是非线性的，事实上它在处处都是弯曲的，我们可能会认为它效果良好。然而，如果层数很多，它会引起许多困难。它相当平坦，除了大约
    -2 到 2 之间的小范围外，这意味着在该范围之外其导数非常小。如前所述，深度学习者使用梯度下降进行训练的，由于双曲正函数的导数在大部分时候很小，很难改进权重。模型层数越多，这个问题就越发严重。这被称为梯度消失问题。


    ![图 8.1: 修正线性单元。](img/fig8_1.jpg)


