- raw: 'The Internet of Things (IoT) has given machine learning a whole new application
    field. IoT creates a tsunami of heterogeneous data in different formats at high
    velocity. IoT systems are also dynamic since new sensors can be added or removed,
    whole buildings can be interconnected for smart building control and whole production
    sites are wired. A machine learning system needs, thus, to be enhanced as well
    in order to analyze the data of a newly connected robot or security system. Instead
    of retraining a machine learning scheme with data from newly connected systems,
    the machine learning engine can be enhanced with a new module, but a newly connected
    production site might already have a data mining system in place. The data mining
    system has to be integrated in an existing solution that might use a different
    technology. Machine learning engines will need integration capabilities for collaborative
    learning using multiple technologies. A better solution might be a system for
    continuous learning. Instead of training, testing and deploying a machine learning
    engine, it can continuously learn from new data without retraining and redeployment.
    Such a system needs to automatically perform the pre-processing, feature extraction,
    learning and evaluating tasks as soon as new types of data arrive. Such a system
    is called an automated machine learning system. An automated machine learning
    system performs the end-to-end process of data pre-processing untill analysis,
    automatically, without human intervention. Fully automated machine learning systems
    do not exist yet but automated machine learning is an active area of research
    for obvious reasons. They are cheaper if they perform laborious tasks themselves
    and they are faster. Unsupervised learning will probably be the method of choice
    for automated machine learning since no labeled data is required. Also, in nature,
    most learning is unsupervised. Most of the learning in the future will probably
    be continuous, unsupervised learning.


    The recent progress we have seen in machine learning is owed, among other, to
    advances in hardware developments. In particular, the development of GPUs has
    provided the computing power to execute machine learning algorithms efficiently.
    Today, chips are developed specifically for machine learning and artificial intelligence.
    The next evolution in hardware development will be most likely be quantum computers.
    Quantum computing considerably speeds up computing operations and will increase
    the velocity of training a learning algorithm and decrease the execution time
    of machine learning algorithms by magnitudes.


    The black box approach of trained machine learning systems has caused unease in
    society and scenarios such as a robot who suddenly attacks humans or an autonomously
    driving car causing an accident without an understanding of who is liable are
    circulating in the press. Many of those fears are currently unfounded. For one,
    there are currently no such advanced systems available, and secondly, giving total
    control to a machine is not desirable. No company wants to leave its security
    in the hands of a machine. No physician will let a machine diagnose his patients.
    Machine learning will support many specialists, for instance, in detecting cyber
    security breaches or anomalies in medical images, but an Army general deploying
    uncontrollable robots in warfare is an unlikely scenario. Even if machine learning
    engines are making decisions by themselves, the ultimate choice of what should
    be done will still remain in human hands as long as machines cannot clearly justify
    and explain their actions.


    Machine learning schemes are capable of determining the topic of a text or an
    anomaly in sensor data, but they do not understand the context of the text or
    why a certain sensor value is abnormal. More research is required for a machine
    learning engine to be capable of understanding context and meaning. When a learner
    has determined that a book is about the second world war, it still does not understand
    its context in human history. If an anomaly has been detected by a machine learning
    scheme, it does not understand the consequence of the anomaly. The artificial
    intelligence system should be able to explain its conclusions, ultimately, it
    should be able to reason. However, at the current rate of research and development,
    there is still a long way to go until we will see such advanced systems.


