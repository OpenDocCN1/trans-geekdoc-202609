- raw: 'Regression analysis is used for estimating the relationship among variables.
    It tries to determine the strength of the relationship between a series of changing
    variables, the independent variables, usually denoted by *X*, and the dependent
    variable, usually denoted by *Y*. If there is one dependent variable, it is called
    simple linear regression, if there is more than one dependent variable, it is
    called multiple linear regression. In classification, you are looking for a label,
    in regression for a number. Predicting if it is going to rain tomorrow is a classification
    problem where the labels are “rainy” or “sunny”, predicting how many millimeters
    it is going to rain is a regression problem. The target or dependent variable
    *y* is a continuous variable. Contrarily, discrete variables take on a finite
    number of values. Typical supervised methods are Bayesian models, artificial neural
    networks, support vector machines, k-nearest neighbor, regression models and decision
    tree induction.


    ### [1.5.2    Unsupervised learning](#06_Contents.xhtml#sec1_5_2)


    Unsupervised learning techniques are used when no labeled data is present. In
    other words, there is no *y*. One of the most popular unsupervised approaches
    is clustering. The goal of clustering is to understand the data by finding the
    underlying structure of data. Clustering groups data based on some similarity
    measure. For instance, a company groups it’s online users into customer groups
    with similar purchasing behavior and demographics in order to better target them
    with a marketing campaign. In this example the similarities are the purchasing
    habits and the age group. Since there is no labeled data, evaluating a cluster
    is not an obvious task to do. There is no ground truth that the result of a clustering
    task can be compared with.


    Clustering can also be used to represent data in a more compressed format (dimensionality
    reduction), for data summarization, while keeping it’s structure and usefulness.
    Clustering can also be used as a preliminary step for supervised machine learning
    algorithms, for instance, to reduce dimensionality to improve performance of the
    supervised learner.


    Typical clustering algorithms include k-means clustering, hierarchical clustering
    or principal component analysis (PCA). In k-means clustering, the algorithm groups
    data points into *k* groups where *k* is the center of a group and is called centroid.
    The centroid is also called geometric center or barycenter and represents the
    mean position of all the data points of a cluster group. In k-means clustering,
    the data points are grouped around the centroids. The points closest to the centroid
    *k* are added to the cluster. For instance, a warehouse inventory is grouped by
    sales activity or sensor data in an Internet of Things (IoT) application is grouped
    into normal and deviant sensor data for anomaly detection.


    In k-means clustering, the number of *k* has to be defined beforehand. Selecting
    the number of clusters is not always an obvious task to do. For instance, grouping
    images of animals into their biological families such as felines, canines, etc.,
    requires prior knowledge about how many families there are going to be in the
    images to be clustered. k-means is easy and converges quickly, which often makes
    it a good starting point for a machine learning project.


    Hierarchical clustering or hierarchical cluster analysis (HCA), groups data by
    creating a tree or dendrogram. There are two approaches, a bottom up or agglomerative
    approach, where each data point starts in it’s own cluster, and the top down or
    divisive approach, where all observations are put into one cluster and splits
    are performed in order to create a hierarchy that is usually presented as a dendrogram.


    Human and animal learning is largely unsupervised. Humans learn from observing
    the world, not by being told the label of every object, making unsupervised learning
    more biologically plausible.


    ### [1.5.3    Semi-supervised learning](#06_Contents.xhtml#sec1_5_3)


    Semi-supervised learning is typically used when a small amount of labelled data
    and a large amount of unlabelled data is present. Labeling data is often a manual
    and laborious task for a data scientist. This bares the danger of introducing
    a human bias on the model. Using semi-supervised methods can often increase the
    accuracy of the model and, at the same time, reduce the time and cost for producing
    a model since not all data needs to be labeled. For instance, manually labelling
    data for gene sequencing is an insurmountable task for a data scientist due to
    the large volumes of data; there are approximately six billion base pairs in a
    human, diploid genome. Semi-supervised methods can alleviate this problem by only
    labelling a small amount of data. In other words, the features are learned from
    a small amount of labelled data. First, we train a model with the small amount
    of labeled data. Then we label the unlabeled data set with the trained model that
    gave the best results. This yields a large volume of pseudo-labeled data. We now
    combine the labeled and pseudo-labeled data sets in order to train a model. This
    way, we should be able to better capture the underlying data distribution and
    the model generalizes better. As usual, there are other semi-supervised techniques.
    Semi-supervised methods give access to large amounts of data for training while
    minimizing the time spent for labeling training data. Ideally, semi-supervised
    methods can even reveal new labels.


    Semi-supervised learning can be associated to human concept learning. Parents
    tell children the name of an object or animal when they see it the first time,
    they label it. The small amount of parental labelling suffices for children to
    be able to label new objects when they see them.


    ### [1.5.4    Machine learning and statistics](#06_Contents.xhtml#sec1_5_4)


    Machine learning uses a lot of statistics. That is why you will often find statistical
    terms and machine learning terms used interchangeably in literature. For instance,
    the terms dependent and independent variable are statistical terms, feature and
    label are their machine learning equivalents. [Table 1.1](#10_Chapter01.xhtml#tab1_1)
    opposes some popular machine learning terms and their corresponding statistical
    terms.


    The term statistical learning is sometimes confused with machine learning. There
    is a subtle difference between the two methods. Both methods are data-based. However,
    machine learning uses data to improve the performance of a system. Statistical
    learning is based on a hypothesis. The basic assumption in statistical learning
    is that the data share some properties with a certain regularity. Therefore, statistical
    learning can use probabilistic methods and probabilistic distributions can be
    used to describe the statistical regularity. Machine learning is not based on
    assumptions. Statistical learning is math intensive and usually uses smaller data
    sets with fewer features, whereas machine learning can use billions of instances
    and features. Statistical learning requires a good understanding of the data,
    whereas machine learning can identify patterns iteratively with much less human
    effort. Therefore, machine learning is often preferred over statistical learning.
    However, since statistical learning requires us to familiarize ourselves with
    the data, it helps us gain more confidence in our model.


    [**Table 1.1:**](#08_ListofTab.xhtml#tab1_1) Machine learning and statistical
    terminology.


    | Statistics || Machine Learning |


    | --- | --- |


    | Fitting || Learning |


    | --- | --- |


    | Classification, Regression || Supervised Learning |


    | Clustering, Density estimation || Unsupervised Learning |


    | Independent variable, covariate || Feature |


    | Dependent variable, Response || Label |


    | Observation || Instance |'
