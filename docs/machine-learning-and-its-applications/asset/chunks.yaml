- raw: 'There is no agreed upon definition of artificial intelligence in literature.
    But generally speaking, artificial intelligence describes tasks that are normally
    done by humans on a computer. However, the way machines undertake human tasks
    is fundamentally different from how humans do them, humans are still superior
    in many of them. Whether it is a child learning to distinguish cats from dogs
    or old people learning the rules of a card game, humans have an unparalleled capability
    for learning. A child sees a cat once and then knows what a cat is, independent
    of its size or fur color. A machine learning scheme needs to be trained on thousands
    of images of cats in different positions and at different ages to be able to recognize
    a cat with a different fur pattern. Humans are excellent at classifying things
    we see into categories. This is essential for our survival. Primordial human beings
    had to be able to quickly distinguish foe from prey when hunting. Similarly, we
    need to be able to distinguish potentially dangerous traffic situations from normal
    ones. Since we constantly encounter new traffic situations, we have to be able
    to quickly assess if they are potentially dangerous or not. We see many vehicles
    on the street that we ignore, but suddenly all our attention is focused on the
    one that makes a strange maneuver. It is largely unknown today how humans subconsciously
    decide what is relevant. This is one of the big challenges autonomously driving
    cars have to solve.


    Over the past few decades, a lot of progress has been made in unraveling how human
    learning works at the molecular level. In recent years, neuroscience has gained
    a relatively deep understanding of how memories are formed. Learning and memory
    formation are linked to the strengthening and weakening of connections among brain
    cells. Neurons that frequently interact form a bond that let them transmit information
    more easily and accurately between eachother. In stark contrast, is our limited
    understanding of how these same memories are maintained \[[27](#25_References.xhtml#ref27)\].


    How we recall episodes from the past and replay them like a movie in our head
    is largely unknown. The ability to encode and retrieve our daily personal experiences,
    called episodic memory, is supported by the circuitry of the medial temporal lobe
    (MTL), including the hippocampus, which interacts extensively with a number of
    specific distributed cortical and subcortical structures \[[5](#25_References.xhtml#ref5)\].
    There are three areas in the human brain involved in explicit memory storage:
    The hippocampus, the neo-cortex and the amygdala. How the memories are stored
    is not well understood today. Some studies have shown that learning modifies the
    DNA \[[27](#25_References.xhtml#ref27)\]. Epigenetic mechanisms probably have
    an important role in synaptic plasticity and memory formation \[[20](#25_References.xhtml#ref20)\].
    The DNA is the most stable memory location in the human body and would, thus,
    be a logical place to retain information, but this is pure speculation. Humans
    also forget things. The capability to forget is to protect us from an information
    overflow. The memory is divided into three stores, the sensory memory, that stores
    information from our senses, the short-term memory (STM) and the long-term memory
    (LTM). The sensory memory is extremely short, it retains information only for
    a few seconds. The STM, as the name suggests, stores information for a short period
    of time, usually between 20 and 30 seconds. If the information is rehearsed, it
    is retained longer and might become a LTM. How the brain filters the information
    that it retains and how it decides what information it forgets is not well understood.
    We might remember an argument from last year, but only vaguely remember a conversation
    we had a couple of weeks ago. Here, again, we do not know what the brain considers
    relevant to retain and what it forgets. A heated argument is probably more important
    to store since it might have greater consequences than a conversation about the
    weather, but how this filter works, we do not know.


    These unknowns are a big challenge in artificial intelligence and in machine learning.
    How can we imitate something on the computer when we do not know how it works
    in real life? Even if we are still in the dark about many aspects of how learning
    and memorizing works in humans, when trying to imitate it, we learn what problems
    nature had to solve to give us the capabilities we have. Learning by imitating
    a biological mechanism helps us better understand the problem at hand, even if
    the solution we find to solve it is very different from the solution in nature.
    To advance artificial intelligence and machine learning we need both, a better
    understanding of the biological mechanisms and improved implementations that try
    to imitate them. Machine learning is an interdisciplinary field of study and it
    is expected that we will see more researchers cooperating with each other to bring
    together the knowledge of different areas. Linguists will collaborate with data
    scientists to improve the text mining capabilities, neurobiologists will collaborate
    with computer scientists and roboticists to advance the skills of robots and autonomous
    systems. A lot of effort has already been undertaken in the industry and in academia
    since improved systems help us to make production sites or traffic more efficient
    and reduce energy consumption and emissions. Machine learning can potentially
    reduce health services and elderly care costs, improve safety measures oin the
    roads and in the work space, to name a few application areas. We will also likely
    see new application fields that we might not have thought of yet.


    ## [11.1    Research directions](#06_Contents.xhtml#sec11_1)


    Currently, a machine learning algorithm is trained for one thing, for instance,
    to translate text from one language into another or to steer a robot or an autonomous
    car. This is in contrast to human intelligence. Humans can read and write, make
    calculations, play football, sing and play the piano. A lot of research is performed
    to develop algorithms that are capable of learning different tasks. This research
    area is called artificial general intelligence (AGI), contrary to artificial narrow
    intelligence (ANI). AGI has the aim to perform any intellectual task a human can
    do. Instead of developing one single system that can learn anything, we will probably
    see several systems working together for collaborative learning. There are already
    systems available where several learners can be deployed, for instance, one that
    is trained to translate English into Russian and another one trained to translate
    English to German. The advantage of these machine learning engines is that they
    can be modularly built and enhanced, for instance, with new languages or with
    new capabilities, such as text to speech functionality. Modular systems are easier
    to maintain and test.'
