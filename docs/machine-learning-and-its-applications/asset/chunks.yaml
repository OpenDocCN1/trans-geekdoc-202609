  trans: '


    当变量 `x` 和 `y` 之间存在非线性关系时，可以使用多项回归。因变量 `y` 与自变量 `x` 之间的关系使用 `n` 次多项式进行建模。对于单个预测变量
    `x`，该模型定义如方程 4.17 所示：


    | `y`[`i`] = `β`[`0] + `β`[`1]``x`[`1]` + `β`[`2``x`² + … + `β`[`n`]`x`^(*n*) + `ε`
    || (4.17) |

    | --- | --- |

    |  `x` || \= 预测变量 |

    | --- | --- |

    |  `y` || \= 因变量 |

    |  `β` || \= 回归系数 |

    |  `n` || \= 多项式次数 |

    |  `ε` || \= 误差项 |


    多项回归可以拟合非线性模型，但由于回归函数是线性的，因此它被视为多元线性回归的一个特例。尽管 `x`² 是二次的，但未知系数 `β`[`0]`、`β`[`1]`…
    是线性的，且估计器将 `x[n]` 视为另一个变量。我们可以像多元线性回归一样，使用最小二乘等相同的分析程序。


    方程 4.17 相对简单，但多项回归模型可以包含更多的预测变量。寻找多项式的阶并不是直观的。根据经验法则，多项式的次数不应超过样本量的一半。良好的做法是绘制数据和拟合曲线，然后使用人类判断来评估主观的拟合优度：确定“实际意义”与“统计显著性”。


    在拟合多项回归模型时需要考虑的几条指南是：


    - 你不应超出样本数据点的范围进行外推

    - 如果模型包含 `x^n` 且 `x^n` 显示出统计学显著的预测能力，你也应该包含 `x^m`（其中 `m` < `n`），即使 `x^m` 的显著性较低

    - 如果生成的曲线图看起来合理，仅使用统计显著性来支持一个模型


    ## 4.3 逻辑回归


    逻辑回归（LR）或称为 logit 回归，用于根据一个或一组离散解释值来估计二分类因变量。它是机器学习中广泛使用的模型，应用于许多不同领域。逻辑回归不需要因变量和自变量之间存在线性关系。当因变量是二分类（二分）的，例如
    0/1 或真/假时，它用于分类。这就是为什么它也被称为二分类逻辑回归。逻辑回归计算事件（如成功/失败）发生的概率。如果因变量超过两个类别，则被称为多项回归。


    逻辑回归的核心是逻辑函数。逻辑函数或 logit 函数是一个 sigmoid 曲线。sigmoid 曲线是 0 到 1 之间的一个 S 形曲线，它永远不会达到
    0 或 1，如图 17 所示。数学上，logit 函数的定义如方程 18 所示。


    | $logit( x) = \frac{1}{1 + e^{- x}}$ || (4.18) |

    | --- | --- |

    |  `x` || \= 自变量 |

    | --- | --- |

    |  `e` || \= 欧常数 |


    ![图 17：逻辑回归](img/fig17.jpg)


    logit 函数将实数 `x` 映射到 0 到 1 之间。在逻辑回归中，logit 函数可以如下形式所示：


    | $p(x) = \frac{1}{1 + e^{-(\beta_{0} + \beta_{1}x}}}$ || (4.19) |

    | --- | --- |

    |  `x` || \= 自变量 |

    | --- | --- |

    |  `e` || \= 欧常数 |

    |  `β`[`0]` || \= 截距 |

    |  `β`[`1]` || \= 回归系数 |


    `p` 是因变量属于某一类（如“成功”或“失败”）的概率。由于因变量是二分类（二分）的，逻辑回归预测输出为 0 或 1。在实践中，我们使用阈值 0.5：


    ```

    y = \begin{cases} {1,} & \text{if}p \geq 0.5 \\ {0,} & \text{otherwise} \end{cases}

    ```


    $\beta_{0}$ 和 $\beta_{1}$ 在训练期间学习。极大似然估计是用于优化系数的常用算法，在逻辑回归中被用于许多机器学习算法。极大似然估计利用似然函数来最大化观测数据，从而最小化预测误差。将在第
    7 章详细介绍。逻辑回归研究诸如：每多抽一包烟患癌症的概率。使用逻辑回归需要注意的几点：


    - 逻辑回归可能难以解释

    - 预测变量之间不应存在高度相关（共线性）

    - 为了表现良好，逻辑回归需要较大的样本量

    - 逻辑回归假设输出变量没有误差，因此，分类错误的样本应从数据集中移除


    logit 函数也用于人工神经网络作为激活函数。逻辑回归已成为许多二分类问题的首选方法。逻辑回归广泛应用于医学，预测患者的死亡或疾病的严重程度。它也被用于生命科学或营销，预测客户流失或营销活动的效果。它还用于地震预测或根据地震活动寻找新油田。


    '
