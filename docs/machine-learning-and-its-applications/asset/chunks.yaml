- raw: 'Polynomial regression can be used if there is a nonlinear relationship between
    the variables *x* and *y*. The relationship between the dependent and the independent
    variable *y* and *x* is modeled using a *n*th degree polynomial. For one single
    predictor *x*, the model can be defined as shown in [equation 4.17](#14_Chapter04.xhtml#eq4_17):


    | *y*[*i*] = *β*[0] + *β*[1]*x*[1] + *β*[2]*x*² + … + *β*[*n*]*x*^(*n*) + *ε*
    || (4.17) |


    | --- | --- |


    where


    |  *x* || \= Predictor Variable |


    | --- | --- |


    |  *y* || \= Dependent Variable |


    |  *β* || \= Regression coefficient |


    |  *n* || \= Degree of the polynomial |


    |  *ε* || \= Error term |


    Polynomial regression can fit a nonlinear model, but since the regression function
    is linear, it is considered a special case of multiple linear regression. Even
    though *x*² is quadratic, the unknown coefficients *β*[0], *β*[1] … are linear
    and the estimator considers *x[n]* just as another variable. We can use the same
    analysis procedures such as least squares just as in multiple linear regression.


    The [equation 4.17](#14_Chapter04.xhtml#eq4_17) is relatively simple but polynomial
    regression models can have many more predictor variables. Finding the order of
    the polynomial is not straight forward. As a rule of thumb, the degree of the
    polynomial should not exceed half the sample size. It is good practice to plot
    the data and the fitted curve, then use human judgement to assess the subjective
    goodness of fit: determine “practical significance” versus “statistical significance”.


    A few guidelines to consider when fitting a polynomial regression model are:


    ▪  You should not extrapolate beyond the limits of the sample data points


    ▪  If the model includes *x^n* and *x^n* shows to be a statistical significant
    predictor, you should also include *x^m* where *m* < *n* even if *x^m* is less
    significant


    ▪  If the resulting plot of the curve looks reasonable use statistical significance
    only to support a model


    ## [4.3    Logistic regression](#06_Contents.xhtml#sec4_3)


    Logistic regression (LR), or logit regression, is used to estimate the binary
    dependent variable based on one or on a set of discrete explanatory values. It
    is a widely-used model in machine learning and is used in many different areas.
    Logistic regression does not need a linear relationship between the dependent
    and the independent variable. It is used for classification when the dependent
    variable is binary (dichotomous), e.g., 0/1 or true/false. This is why it is also
    called binary logistic regression. Logistic regression calculates the probability
    of an event, such as success/failure. If the dependent variable has more than
    two categories, it is called multinomial logistic regression.


    At the core of logistic regression is the logistic function. The logistic function
    or logit function is a sigmoid curve. A sigmoid curve is an S-shaped curve between
    0 and 1 that never reaches 0 or 1 as shown in [Figure 4.17](#14_Chapter04.xhtml#fig4_17).
    Mathematically the logit function is defined as shown in [equation 4.18](#14_Chapter04.xhtml#eq4_18).


    | $logit\\left( x \\right) = \\frac{1}{1 + e^{- x}}$ || (4.18) |


    | --- | --- |


    where


    |  *x* || \= Independent variable |


    | --- | --- |


    |  *e* || \= Euler’s number |


    ![Figure 4.17: Logistic regression curve.](images/fig4_17.jpg)


    **[Figure 4.17:](#07_ListofFig.xhtml#fig4_17)** Logistic regression curve.


    The logit function maps any real number *x* into a value between zero and one.
    In logistic regression the explanatory variable *x* is linearly combined with
    coefficient values *β*[0] and *β*[1]. These coefficients are learned during training.
    The logit function can then take the form as shown in [equation 4.19](#14_Chapter04.xhtml#eq4_19).


    | $p\\left( x \\right) = \\frac{1}{1 + e^{- {({\\beta\_{0} + \\beta\_{1}x})}}}$
    || (4.19) |


    | --- | --- |


    where


    |  *x* || \= Explanatory variable |


    | --- | --- |


    |  *e* || \= Euler’s number |


    |  *β*[0] || \= Intercept |


    |  *β*[1] || \= Regression coefficient |


    *p* is interpreted as the probability of the dependent variable belonging to a
    class such as “success” or “failure”. Since logistic regression yields a binary
    prediction, the probabilities need to be transformed into 1 or 0. Ideally, the
    coefficients *β*[0] and *β*[1] are learned in a way that the learner predicts
    values close to 0 or 1. In practice, we can use the probability directly using
    a threshold, for example 0.5:


    $y = \\begin{cases} {1,} & {\\text{if~}p \\geq 0.5} \\\\ {0,} & \\text{otherwise}
    \\\\ \\end{cases}$


    *x* can be any positive or negative value to infinity, the resulting probability
    is always between 0 and 1. *x* can be a combination of several explanatory variables.


    Usually for logistic regression the maximum likelihood estimation is used to learn
    the coefficients. The maximum likelihood estimation is a common learning algorithm
    used to optimize the coefficients for a variety of machine learning algorithms.
    Maximum likelihood estimation uses the likelihood function to maximize the likelihood
    that the coefficients found for the model describe the data that is actually observed
    and, thus, minimize the prediction error. Maximum likelihood estimation will be
    explained in more detail in [Chapter 7](#17_Chapter07.xhtml).


    Logistic regression examines questions such as: What is the probability of getting
    lung cancer for every additional pack of cigarettes smoked per day. Some points
    to consider with logistic regression are:


    ▪  Logistic regression can be difficult to interpret


    ▪  Outliers should be removed from the data set


    ▪  There should be no high correlations (multi collinearity) among the predictors,
    otherwise the expected likelihood estimation process that learns the coefficients
    might fail to converge


    ▪  To perform well, logistic regression needs large sample sizes


    ▪  Logistic regression assumes no error in the output variable *y*, misclassified
    instances should, thus, be removed from the training set


    Other variants of the logistic regression equation from the one shown in [equation
    4.19](#14_Chapter04.xhtml#eq4_19) are possible. The logit function is also used
    in artificial neural networks as activation function.


    Logistic regression has become the preferred method for many binary classification
    problems. Logistic regression is widely used in medicine to predict mortality
    of patients or the severity of an illness. It is also used in life science or
    in marketing to predict customer churn or the success of a marketing campaign.
    Is is also used for earthquake prediction or to find new oil sources based on
    seismic activity.


