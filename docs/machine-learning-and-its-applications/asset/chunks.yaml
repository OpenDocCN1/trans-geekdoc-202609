    \ is now AI enabled. Deep learning is used to predict earthquakes, for automatic\
    \ language translation, for automatic coloring of black and white movies and for\
    \ forecasting in finance. The Mars rover Curiosity utilizes artificial intelligence\
    \ to autonomously select inspection-worthy soil and rock samples with high accuracy.\
    \ The list goes on.\n\nRecently, machine learning also attracted a lot of attention\
    \ due to visions of jobs being lost to machines, dangers of autonomous systems,\
    \ such as robots who could turn evil, loss of control over existential infrastructure\
    \ or even a war starting due to artificial intelligence. However, it should be\
    \ noted that artificial intelligence, as the name suggests, is artificial and\
    \ has nothing to do with human intelligence. A machine may be capable of recognizing\
    \ whether an animal in a picture is a lion or a tiger, but it is not able to understand\
    \ the concept behind what it recognized, i.e., it does not understand the concept\
    \ of a living being. A deep learner is, in essence, a huge mathematical formula.\
    \ It has nothing to do with how the human brain works, where biochemical processes\
    \ are executed. An artificial neural network is inspired by nature. It has a grain\
    \ of how we think the brain works and a lot of math thrown at it. Visions of machines\
    \ replacing doctors in diagnosing a patient or lawyers in sentencing a perpetrator\
    \ are probably premature. It is more likely that we will see artificial intelligence\
    \ supporting a doctor or a lawyer in his daily work instead of replacing her or\
    \ him in the near future.\n\nHowever, we will likely see many more applications\
    \ of artificial intelligence in areas that we have not thought of yet. Artificial\
    \ intelligence and machine learning pose many interesting problems in practice\
    \ and in research. The fact that we try to imitate nature gives us a better understanding\
    \ of what problems nature had to solve during evolution. It also helps us to better\
    \ understand how it solved them. However, how human learning works is still largely\
    \ unknown. Before we have a better understanding of how the brain works, it is\
    \ unlikely that we will be able to replace it, no matter how much math we apply."
