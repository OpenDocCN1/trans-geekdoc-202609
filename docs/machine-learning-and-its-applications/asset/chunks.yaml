- raw: 'Artificial neural networks are inspired by the human nervous system. They
    encompass a large number of different models and learning methods. Here, we cover
    some of the widely-used models inorder to show their principal functioning.


    A typical neuron, as found in the human body, looks as depicted in [Figure 4.1](#14_Chapter04.xhtml#fig4_1).
    It consists of dendrites that receive electrochemical stimulation from upstream
    neurons through synapses located in different places on the dendrites. Presynaptic
    cells release neurotransmitters into the synaptic cleft in response to spikes
    of electrical activity known as action potentials. The neurotransmitter stimulates
    the receiving neuron which, in turn, creates an action potential. The action potential
    is transmitted along the cell membrane down the axon to the axon terminals where
    it triggers the release of neurotransmitters. The neuron is said to “fire”.


    The dendrites can receive signals from more than one upstream neuron. Each neuron
    is typically connected to thousands of other neurons. It is estimated that there
    are about 100 trillion (10^(14)) synapses within the human brain \[[25](#25_References.xhtml#ref25)\].
    Also, synaptic connections are not static. They can strengthen and weaken over
    time as a result of increasing or decreasing activity, a process called synaptic
    plasticity. Neurologists have discovered that the human brain learns by changing
    the strength of the synaptic connection between neurons upon repeated stimulation
    by the same impulse \[[37](#25_References.xhtml#ref37)\]. When two neurons frequently
    interact, they form a bond that allows them to transmit the signal more easily
    and accurately (Hebb’s rule). Strong input to a postsynaptic cell causes it to
    traffic more receptors for neurotransmitters to its surface, amplifying the signal
    it receives from the presynaptic cell. This phenomenon, known as long-term potentiation
    (LTP), occurs following persistent, high-frequency stimulation of the synapse.
    For instance, when we learn a foreign language, we repeat new words until we do
    not have to concentrate on the translation anymore. We subconsciously use the
    correct foreign language words. The repeating of the words results in the strengthening
    of the synaptic connections and formation of a bond between the neurons involved
    in language speaking. The strengthening and weakening of synaptic connections
    is imitated in artificial neural networks by linearly combining the input signals
    with weights. The weights are usually represented in a weight matrix *W*. Learning
    in an artificial neural network consists of modifying the weight matrix until
    the generative model represents the training data well \[[25](#25_References.xhtml#ref25)\].


    ![Figure 4.1: Neuron.](images/fig4_1.jpg)


    **[Figure 4.1:](#07_ListofFig.xhtml#fig4_1)** Neuron.


    Interconnected neurons form a neural network. In a similar fashion, artificial
    neural networks are interconnected neurons that form a network. There are many
    different types of artificial neural network. One of the simplest forms of artificial
    neural networks is shown in [Figure 4.2](#14_Chapter04.xhtml#fig4_2). It consists
    of an input layer, a hidden layer and an output layer. Since it has two output
    neurons, it can be used for binary classification. In fact, one output neuron
    sufices for binary classification since it can fire or not fire, i.e., emit 1
    or 0. The artificial neural network that is shown in [Figure 4.2](#14_Chapter04.xhtml#fig4_2)
    can also be used for multiclass classification.


    ![Figure 4.2: Artificial neural network.](images/fig4_2.jpg)


    **[Figure 4.2:](#07_ListofFig.xhtml#fig4_2)** Artificial neural network.


    In the artificial neural network shown in [Figure 4.2](#14_Chapter04.xhtml#fig4_2),
    each input neuron is connected with every neuron in the hidden layer and every
    neuron is connected to every neuron in the output layer; the layers are said to
    be fully connected. Since the signal passes from the input layer straight to the
    output layer, it is called a feedforward neural network. Neurons can also have
    recurrent connections with themselves, as shown in [Figure 4.3](#14_Chapter04.xhtml#fig4_3),
    or can have connections with upstream neurons to form a recurrent neural network.


    An artificial neural network learns a function *f* that maps an input to an output
    by adjusting the weights in the weight matrix. Artificial neural networks are
    also called universal function approximators since they can learn any continuous
    function with just one hidden layer. In recent years, deep learners (DL) gained
    a lot of momentum since they perform exceptionally well in tasks such as natural
    language processing or object recognition. Deep learners are not very different
    from shallow artificial neural networks in their inner workings. There is no clear
    definition in literature as to when an artificial neural network is a shallow
    learner and when a deep learner. Deep learners are, in essence, artificial neural
    networks with many hidden layers. Like artificial neural networks, deep learners
    learn a function *f*, but they perform extremely well when the data is very complex.
    Real world data is often noisy, which can result in *f* being complicated. Natural
    language problems, such as machine translation, use large vocabulary sizes. Image
    analysis requires the processing of large pixel arrays, which can result in many
    features. In these situations, deep learners often perform much better in learning
    *f* from shallow learners.


    ![Figure 4.3: Recurrent neural network.](images/fig4_3.jpg)


    **[Figure 4.3:](#07_ListofFig.xhtml#fig4_3)** Recurrent neural network.


    It should be noted that artificial neural networks and deep learners are simplifications
    of actual neural networks in living human beings. Real neural networks are highly
    interconnected, they send signals forward and backwards between layers. Neurons
    are also not unidimensional processing units but have branches in all directions
    and they process signals non-digitally as well as digitally. However, the most
    noticeable difference is that real neurons do not output a single output response,
    but a spike train, that is, a sequence of pulses, and it is this spike train that
    encodes information \[[25](#25_References.xhtml#ref25)\].


    Advantages of artificial neural networks include their high tolerance of noisy
    data as well as their ability to classify patterns on which they have not been
    trained \[[10](#25_References.xhtml#ref10)\]. They can be used when there is little
    knowledge of the attributes and the relationship between them. Artificial neural
    networks have been applied to a wide range of real-world problems in Biology,
    Medicine, Seismology, character and voice recognition or object recognition, to
    name a few.


    Perceptron


    We have already discussed the basic functioning of a single neuron, the perceptron,
    in [section 2.1.1](#11_Chapter02.xhtml#sec2_1_1). A perceptron, as shown in [Figure
    4.4](#14_Chapter04.xhtml#fig4_4), consists of input signals *x*[0], *x*[1], …
    *x*[1] that are combined with weights *w*. The inputs can be actual observations
    or, in the case of multiple layers, intermediate values from upstream perceptrons.
    The weighted input signals are summed up and passed to an activation function.
    If the activation function is sufficiently stimulated, it fires, i.e., it emits
    a signal.


    There are different types of activation functions. [Figure 4.5](#14_Chapter04.xhtml#fig4_5)
    shows some popular types of activation functions. Ramp functions have become the
    preferred activation functions for deep learners since they simplify the math
    considerably. An activation function represents the action potential of a real
    neuron. In its simplest form, it is a step function that either fires, if sufficiently
    stimulated, or not. It is binary since it outputs either 1 or 0 and can only linearly
    separate classes. The perceptron calculates *ŷ* by adding up the weighted sum
    of its inputs and adding the bias.'
