    Machine learning is one of many subfields of artificial intelligence or AI. Machine
    learning algorithms automatically build models that can identify useful patterns
    in data and make predictions without being explicitly programmed. Machine learning
    can be roughly divided into supervised, semi-supervised and unsupervised methods.
    Supervised methods are used for classification and regression, whereas unsupervised
    methods are used for clustering. Reinforcement learning is concerned with how
    agents act in an environment by maximizing some notion of reward. Figure 2.1 shows
    the subareas of machine learning and summarizes the tasks. However, in literature,
    other classifications of machine learning methods can be found.


    ![Figure 2.1: Machine learning areas.](images/fig2_1.jpg)


    **Figure 2.1:** Machine learning areas.


    Machine learning tries to imitate human learning on a computer. Human learning
    is mostly based on experience, machine learning is based on data. Data is the
    starting point of a machine learning project and is used to train and test a model.
    For supervised methods, labelled data has to be present. Labeled data is data
    with correctly assigned tags. The labeled data is used for training and evaluating
    the accuracy of the learner. For instance, a learner that is supposed to do handwriting
    recognition needs a training data set with handwritten letters and their associated
    blockletters. The algorithm will then learn the relationship between the handwritten
    letters and the print letters and create a mapping between them. Unsupervised
    learners do not use labeled data, which makes evaluating a trained cluster algorithm
    more challenging.


