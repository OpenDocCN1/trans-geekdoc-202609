- raw: '$\\begin{array}{lll} {w^{T}x + b \\geq 0} & {for} & {d\_{i} = + 1} \\\\ {w^{T}x
    + b < 0} & {for} & {d\_{i} = - 1} \\\\ \\end{array}$


    where


    |  *d* || \= Margin of separation |


    | --- | --- |


    The margin *d* is the separation between the hyperplane and the closest data point.
    The maximal margin is the optimal hyperplane. In a real world setting, the data
    is typically noisy and cannot be perfectly separated with a hyperplane. The maximum
    margin rule is, hence, relaxed by introducing additional coefficients called slack
    variables. This allows for some data points to end up on the wrong side of the
    hyperplane. This is called the soft margin classifier. However, introducing new
    coefficients increases complexity and requires more computing power.


    As we have seen before, data is often not linearly separable. The data points
    in the left graphic in [Figure 4.11](#14_Chapter04.xhtml#fig4_11) cannot be separated
    using a line. To solve this problem, we can use the kernel trick. We use a function
    *φ* to map the data into a different space. To do this, instead of using the data
    points themselves, we use the inner product of any two given data points. Using
    *φ*, instead of computing the dot product *x[i]*·*x[j]*, we will have to compute
    *φ*(*x[i]*)·*φ*(*x[j]*), where *x[i]* and *x[j]* are the two feature vectors.
    This is computationally expensive. Using a kernel function *K*, such that *K*(*x[i],
    x[j]*) = *φ*(*x[i]*)·*φ*(*x[j]*), we do not need to compute or even know *φ*.
    In other words, the kernel function defines the inner products in the transformed
    space.


    ![Figure 4.11: Kernel trick.](images/fig4_11.jpg)


    **[Figure 4.11:](#07_ListofFig.xhtml#fig4_11)** Kernel trick.


    The kernel defines the similarity of the new data points and the support vectors
    in the transformed space. The dot product is the similarity measure. Kernels generalize
    the notion of “inner product similarity”.


    There are many different types of kernels. Polynomial and radial kernels transform
    the input space into higher dimensions. Polynomial kernels do not need the dot
    product. Polynomial kernels can be written as:


    | *K*(*x*,*x*[*i*]) = (*x*⋅*x*[*i*]+1)^(*p*) || (4.12) |


    | --- | --- |


    where


    |  *p* || \= Defined a priori |


    | --- | --- |


    The power *p* needs to be defined by the user. If *p* = 1 it is a linear kernel.
    Polynomial kernels allow for curved hyperplanes in the input space.


    A radial kernel can be written as:


    | $K\\left( {x,x\_{i}} \\right) = exp\\left( {- \\frac{\\left\\| {x - x\_{i}}
    \\right\\|^{2}}{2\\sigma^{2}}} \\right)$ || (4.13) |


    | --- | --- |


    where


    |  *σ*[2] || \= The width defined a priori |


    | --- | --- |


    This is a radial basis function. The output of a radial basis function depends
    solely on the distance of the input from the origin. The width *σ* is usually
    between 0 and 1 and can be thought of as the spread of the decision region. A
    radial kernel can create complex regions within the feature space. Radial basis
    functions are also occasionally used as activation function in neural networks.


    Learning a support vector machine is an optimization problem. We can use stochastic
    gradient descent to search for the coefficients of the hyperplane. However, there
    are more efficient techniques, such as the sequential minimal optimization method.
    Support vector machines have been extensively studied and many papers and books
    on the subject exist. Here, we can only cover the basic concepts.


    Support vector machine have many applications. Due to their versatility and the
    fact that they are usually simpler, they have fewer hyperparameters and they are
    often preferred over neural networks. They are widely used in biology and other
    sciences for classification tasks. They also have been applied to text classification
    problems, image classification and hand-written character recognition. Kernels
    cannot only be defined over vectors but also over trees, strings, etc. Although
    the training time of even the fastest support vector machines can be extremely
    slow, they are highly accurate, owing to their ability to model complex nonlinear
    decision boundaries \[[10](#25_References.xhtml#ref10)\]. One obvious advantage
    of artificial neural networks over support vector machines is that artificial
    neural networks can have any number of outputs, whereas support vector machines
    have only one. However, support vector machines as well as neural networks are
    both black boxes and are not as intuitive to understand as decision trees, for
    example.


    ### [4.1.5    k-nearest neighbor](#06_Contents.xhtml#sec4_1_5)


    k-nearest neighbor (k-NN) is a widely-used classification technique that can also
    be used for regression. It is widely used since the output can be easily interpreted
    and it requires low computing time. k-nearest neighbor falls into the category
    of lazy learners. Contrary to eager learners, such as support vector machines
    or decision trees, learning does not happen as soon as training instances appear,
    but only after new instances appear. Eager learners create a generalization from
    test instances. Lazy learners, such as k-nearest neighbor, compare each new instance
    with existing ones using a distance measure, delaying learning until new instances
    are seen by the learner. In other words, learning happens at prediction time.
    This is also called instance-based learning and requires the test instances to
    be deployed with the model. It is a completely different way of representing the
    “knowledge” from the training data since it uses the instances itself and not
    a rule set or decision tree inferred from the training instances. A new instance
    is assigned to the class of the closest existing instance. This is called nearest-neighbor
    classification. Typically, the Euclidean distance is used. Instance-based learning
    is also called memory-based learning since the training instances are stored in
    memory. k-nearest neighbor is one of the simplest machine learning algorithms.
    If it is used for classification, the output is a class membership, i.e., a discrete
    value. The new instance is classified by a majority vote of its neighbors. If
    it is used for regression, the output is the value for the object, i.e., it predicts
    continuous values. k-nearest neighbor uses feature similarity to determine the
    distance between the training and the new instance.


    Sometimes more than one neighbor is used and the average (median) of the distances
    is used. It is then called k-nearest neighbor, where *k* is the number of neighbors.
    In the left quadrant of [Figure 4.12](#14_Chapter04.xhtml#fig4_12), *k* = 3 and
    the new star-shaped instance belongs to the class of the light grey instances.
    On the right quadrant, if *k* = 3, the new instance also belongs to the class
    of the light gray instances since 2 of the 3 closest neighbors are light gray
    and only one belongs to the class of dark grey instances. If *k* = 5, the new
    instance belongs to the class of the dark grey instances, since 3 of the closest
    instances are dark grey. So choosing the parameter *k* is crucial in this algorithm.


    The complexity of instance-based learners grows with the training data. The more
    training instances we have the more computing power is required. One advantage
    of instance-based learners is their ability to adapt to new data. They simply
    store new training instances without the need to retrain a model.


    ![Figure 4.12: k-nearest neighbor.](images/fig4_12.jpg)


    **[Figure 4.12:](#07_ListofFig.xhtml#fig4_12)** k-nearest neighbor.


    k-nearest neighbor usually stores a subset of the training instances in order
    to reduce complexity, and not the whole training data set. The training set is
    divided into several classes. A new data point is assigned to a class based on
    feature similarity. The assignment is calculated by a majority vote of its neighbors.
    The predicted class is the most common among its *k* neighbors. If k-nearest neighbor
    is used for regression, the average of the values of its *k* nearest neighbors
    is calculated.'
