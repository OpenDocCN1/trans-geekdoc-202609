    ## 8.6 Deep autoencoders


    An autoencoder is a network used to learn a representation (encoding) of a data
    set in an unsupervised manner. An autoencoder compresses the data into a code,
    then uncompresses it again into something close to the input. In this manner,
    it is trained to ignore noise in data. The autoencoder learns both to compress,
