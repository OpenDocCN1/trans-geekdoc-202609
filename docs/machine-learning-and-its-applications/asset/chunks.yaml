  trans: '

    回归分析用于估计变量之间的关系。它试图确定一组变化变量（即自变量，通常用 `X` 表示）与因变量（通常用 `Y` 表示）之间关系的强度。如果只有一个因变量，则称为简单线性回归；如果有多个一个因变量，则称为多元线性回归。在分类任务中，你寻找的是标签；而在回归任务中，你寻找的是一个数字。预测明天是否会下雨是一个分类问题，标签为“下雨”或“晴天”；而预测会下多少毫米的雨是一个回归问题。目标变量或因变量
    `y` 是连续变量。相反，离散变量取有限数量的值。典型的监督学习方法包括贝叶斯模型、人工神经网络、支持向量机、k-近邻、回归模型和决策树归纳。


    ### 1.5.2 无监督学习


    当没有标记数据时，使用无监督学习技术。换句话说，没有 `y`。最流行的无监督方法之一是聚类。聚类的目标是通过寻找数据的底层结构来理解数据。聚类根据某些相似性度量将数据进行分组。例如，一家公司将其具有相似购买行为和人口统计特征的在线用户分为不同的客户群，以便通过营销活动更好地针对他们。在这个例子中，相似性是购买习惯和年龄组。由于没有标记数据，评估一个聚类并不是一项显而易见的任务。没有真值（ground
    truth）可以与聚类任务的结果进行比较。


    聚类还可以用于以更压缩的格式表示数据（降维），用于数据摘要，同时保留其结构和用处。聚类也可以作为监督机器学习算法的预备步骤，例如通过降低维度来提高监督学习器的性能。


    典型的聚类算法包括 k-means 聚类、层次聚类或主成分分析（PCA）。在 k-means 聚类中，算法将数据点分成分 `k` 组，其中 `k` 是组的中心，被称为质心。质心也称为几何中心或重心，代表一个聚类组所有数据点的平均位置。在
    k-means 聚类中，数据点围绕质心分组。距离质心 `k` 最近的点被添加到聚类中。例如，仓库库存可以根据销售活动进行分组，或者在物联网（IoT）应用中的传感器数据可以分为正常和异常传感器数据以进行异常检测。


    在 k-means 聚类中，`k` 的数量必须预定义。选择聚类的数量并不总是项显而易见的任务。例如，将动物图像分组为它们的生物家族（如猫科、犬科等），需要先关于待聚类图像中有多少个家族的先知识。k-means
    简单易用且收敛快，这通常使其成为机器学习项目的良好起点。


    层次聚类或层次聚类分析（HCA）通过创建树或树图（dendrogram）对数据进行分组。有两种方法：自底向上的凝聚法，每个数据点从它自己的聚类开始；以及自顶向下的划分法，将所有观测值放入一个聚类并执行划分以创建一个通常以树图呈现的层次结构。


    人类和动物的学习很大程度上是无监督的。人类通过观察世界来学习，而不是通过告知每个对象的标签，这使得无监督学习在生物学上更合理。


    ### 1.5.3 半监督学习


    半监督学习通常用于存在少量标记数据和大量未标记数据的情况。对于数据科学家来说，标记数据通常是一项手动且耗力的工作。这暴露了在模型中引入人类偏差的危险。使用半监督方法通常可以提高模型的准确性，同时减少生成模型的时间和成本，因为并非所有数据都需要标记。例如，对于数据科学家来说，手动标记基因测序数据是一项无法逾越的任务，因为数据量巨大；人类二倍体基因组大约有六十亿个碱基对。半监督方法通过只标记少量数据可以缓解这个问题。换句话说，从少量的标记数据中学习特征。首先，我们用少量标记数据训练一个模型。然后使用效果最好的训练模型对未标记数据集进行标记。这产生了大量的伪标记数据。现在我们将标记数据集和伪标记数据集结合起来训练模型。通过这种方式，我们应该能够更好地捕获底层数据分布，且模型泛化得更好。通常，还有其他的半监督技术。半监督方法提供了利用大量数据进行训练的机会，同时最大限度地减少了标记训练数据花费的时间。理想情况下，半监督方法甚至可以发现新的标签。


    半监督学习可以与人类的概念学习相关。父母在孩子第一次看到某个物体或动物时告诉他们它们的名字，这就是对其进行标记。少量的父母标记就足够孩子们在看到新物体时对其进行标记。


    ### 1.5.4 机器学习与统计学


    机器学习使用了大量的统计学。这就是为什么你经常会在文献中发现统计术语和机器学习术语互用。例如，“因变量”和“自变量”是统计术语，而“特征”和“标签”是它们在机器学习中的对应词。[表
    1.1] 对了一些流行的机器学习术语及其对应的统计术语。


    统计学习一词有时与机器学习混淆。这两种方法之间存在微妙的差别。两种方法都是基于数据的。然而，机器学习使用数据来提高系统的性能。统计学习基于假设。统计学习的基本假设是数据与某种规律性共享某些属性。因此，统计学习可以使用概率方法，概率分布可以用来描述统计规律性。机器学习不基于假设。统计学习是数学密集型的，通常使用特征较少较小数据集，而机器学习可以使用数十亿个实例和特征。统计学要求对数据有良好的理解，而机器学习可以通过更少的人力通过迭代识别模式。因此，机器学习通常比统计学更受欢迎。然而，由于统计学要求我们熟悉数据，它有助于我们对模型获得更大的信心。


    表 1.1：机器学习与统计学术语。


    | 统计学 || 机器学习 |

    | --- | --- |

    | 拟合 (Fitting) || 学习 (Learning) |

    | --- | --- |

    | 分类、回归 || 监督学习 |

    | 聚类、密度估计 || 无监督学习 |

    | 自变量、协变量 || 特征 (Feature) |

    | 因变量、响应 || 标签 (Label) |

    | 观测值 (Observation) || 实例 (Instance) |

    '
