  trans: "\n\n当我开始从事机器学习时，有许多优秀的书籍解释了机器学习算法中使用的数学知识。也有一些关于数据挖掘和知识发现的优秀书籍。其中一些被列在参考文献部分。它们可以用于学习和参考。然而，并没有书籍解释机器学习背后的基本概念以及它们如何在实践中应用。理解机器学习中使用的数学和算法是关重要的。但是，为了能够有效地将它们用于解决现实世界的问题，并不需要了解算法的所有细节。在过去的几年里，机器学习已经发展到许多复杂性被隐藏在\
    \ `TensorFlow` 或 `Apache Mahout` 等框架中的程度。数据科学家可以在不了解实现细节的情况下使用这些框架。许多流行的编程语言都拥有可以直接在程序中使用的实现库。`R`、`Python`、`Java`\
    \ 或 `Scala` 都有许多不同的机器学习方法实现，数据科学家可以通过包含最符合目的的库来继续使用他们偏好的编程语言。还有一些工具，例如 `RapidMiner`、`Weka`\
    \ 或 `Knime` 等，不需要编程技能即可以图形化方式创建机器学习工作流。显然，除了开源实现外，不同供应商还提供了商业工具供选择。\n\n本书旨在解释机器学习背后的基本概念和机器学习方法。这是多年在各种项目中实践应用这些方法的经验结晶。它试图对算法及其背后的数学进行简洁描述，使其达到有助于解释其内部工作原理的水平。然而，它的目的并不是给出一个包含所有推导的详尽数学描述。此外，机器学习可以追溯到\
