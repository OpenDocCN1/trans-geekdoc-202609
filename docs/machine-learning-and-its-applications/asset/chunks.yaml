    ![Figure 2.3: Perceptron.](images/fig2_3.jpg)


    **[Figure 2.3:](#07_ListofFig.xhtml#fig2_3)** Perceptron.


    There are different types of perceptrons. A perceptron performs three steps:


    1. The input is multiplied by a weight

    2. The input values are summed up

    3. The output is passed to an activation function


    The output is calculated using activation function [equation 2.3](#11_Chapter02.xhtml#eq2_3):


    ```

    f(x) = wx + b

    ```


    | `f(x) = wx + b` | (2.3) |

    | --- | --- |


    where


    | `w` = Weight |

    | --- | --- |

    | `x` = Input |

    | --- | --- |

    | `b` = Bias |


    The perceptron only returns 0 or 1. In other words, it is a binary classifier.
    It can only linearly separate a set of data points. A data point can be considered
    a point in two dimensional plain. The input vector represents the coordinates
    of a point. The perceptron separates the data points into two sets using a line,
    as shown in [Figure 2.4](#11_Chapter02.xhtml#fig2_4). We can separate, for instance,
    medical images into a set of normal and a set of pathologic tissue. However, not
    all binary classification problems are linearly separable. The points in the coordinate
    system in [Figure 2.4](#11_Chapter02.xhtml#fig2_4) cannot be separated linearly.
    Other machine learning algorithms, such as a multilayer perceptron or support
    vector machines, are capable of nonlinearly separating data points. During training,
    the perceptron learns where to position the separation line. There can be an infinite
    number of possible decision boundaries, as shown in [Figure 2.6](#11_Chapter02.xhtml#fig2_6)
    on the left. The perceptron cannot distinguish between different separation lines.
    A class of machine learning algorithms called margin classifiers also consider
    the distance between the data points and the decision boundary. Support vector
    machines fall into this category.


    ![Figure 2.4: Linearly separable and inseparable data points.](images/fig2_4.jpg)


    **[Figure 2.4:](#07_ListofFig.xhtml#fig2_4)** Linearly separable and inseparable
    data points.


    A perceptron can have different types of activation functions. An activation function
    defines the output of the perceptron. Its simplest form is a step function, where
    the perceptron either fires or not. If the neural network is required to separate
    beyond linear separation, several perceptrons are required. An activation function
    can have a curved form, as shown in [Figure 2.5](#11_Chapter02.xhtml#fig2_5) on
    the right side. This type of activation function is called a sigmoid activation
    function and is capable of firing with different rates. As the input increases,
    it fires at an increasing rate. We will see other types of activation functions
    such as rectifiers often used for deep learners in later chapters.

