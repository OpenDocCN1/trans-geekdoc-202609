    ## 6.5 Evaluation of clusters


    As mentioned before, evaluating a cluster is challenging since there is normally
    no ground truth is available. Cluster analysis is often used in an exploratory
    data analysis project. As such, it does not seem obvious why cluster evaluation
    is important. Evaluating a cluster is important for several reasons:


    1. Different cluster analysis methods might find different clusters.

    2. The correct number of clusters might only become obvious during cluster evaluation.

    3. Clusters that have been found are not relevant or clusters are found even though
    there is no cluster data present.


