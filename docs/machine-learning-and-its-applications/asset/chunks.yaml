  trans: '

    特征提取，也称为特征选择或特征工程，是发现隐藏知识或业务洞察最重要的任务之一。在机器学习中，很少会将收集到的整个初始数据集直接作为学习算法的输入。相反，初始数据集会被还原为数据子集，该子集预计对后续的机器学习任务是有用且相关的。特征提取是从初始数据集中选取值的过程。特征是输入数据的区分性属性，是具有代表性的描述性属性。在文献中，特征选择和特征提取通常存在区别
    `[43]`。特征选择意味着将特征集为更小的特征集或多个较小的特征集，因为并不是所有特征对于特定任务都有用。特征提取意味着将原始特征集转换为一个新的特征集，该特征集能够更好或更快地执行数据挖掘任务。在这里，我们将特征提取和特征选择视为等同。特征选择以及（如之前提到的）通常的数据预处理具有高度的领域特定性，而机器学习算法则不然。特征选择也独立于所使用的机器学习算法。


    特征不需要是直接观测的。例如，一组大量的直接观测特征可以通过降维技术还原为一组较小的间接观测特征，这也称为潜变量或隐藏变量。特征提取可以被视为降维的一种形式。通常特征会被加权，使得并不是每个特征对结果的贡献都相等。通常权重会以独立向量的形式呈现给学习者。


    一个典型的特征提取任务是词频计数。例如，对消费产品的评论如果是正面的或负面的，通常会包含某些特定的词。对新汽车的正面评论通常比负面评论包含更多如“good”、“great”、“excellent”之类的词汇。在这里，特征提取意味着定义要计数的单词，并统计正面或负面单词在评论中使用的次数。生成的特征向量是带有其频率的单词列表。特征向量是数值特征的
    n 维向量，因此实际单词本身并不是特征向量的一部分。特征向量可以包含单词的哈希值，如`图 3.1]`所示，或者通过其索引（向量中的位置）来识别单词。


    特征提取的另一个例子是图像中的目标识别。必须在图像中检测感兴趣的目标区域并分离其形状。该区域的背景被忽略。然后将相关区域转换为像素数组，该数组可以作为学习方案的输入向量。


    与机器学习方案一样，有许多不同的特征提取技术，并没有简单的通用配方。自动特征提取（也称为特征学习）已经进行了大量研究。由于特征提取是一项耗力且耗时的任务，自动特征选择有望大幅加速数据挖掘项目。近年来，使用深度学习取得了巨大进展。深度学习器具有自动提取特征的能力。深度学习器已经学会了玩象棋等游戏，而无需先学习规则。它们通过尝试学习了规则。此外，卷积神经网络等深度学习器可以在没有任何图像预处理的情况下自己提取图像中的相关区域。自动特征提取在多媒体挖掘和自然语言处理等任务中取得了惊人的结果，它是机器学习中最令人兴奋的进展之一。


    ![图 3.1: 特征向量](img/fig3_1.jpg)


    ![图 3.1: 特征向量](img/07_List.xhtml#fig3_1)


    ## 3.2 采样 `06_Contents.xhtml#sec3_2`


    数据采样是选择一个子集的过程，因为分析整个数据集通常成本很高。采样将实例数量减少到一个子集。数据有不同的采样方法。当采用随机采样时，每个实例都有相同的被选中概率。使用随机采样，一个实例可以被选取多次。如果移除随机选取的实例，我们得到的结果没有重复。样本应该对分布具有代表性
    `[43]`。


    另一种采样方法是分层。分层用于避免类别标签在样本中过度代表，并提供均匀的分布。分层首先将数据划分为同质小组。这些小组应该是互斥的。不是使用整个总体，而是将其分为子总体（层），例如包含男性和女性实例的箱。然后从每个箱中随机选择等数量的样本。我们得到了分层随机样本。在将数据集划分为训练集和测试集时也经常使用分层。两个数据集都应该具有特征的均匀分布，否则对训练学习者的评估可能会给出错误的结果。


    ## 3.3 数据转换 `06_Contents.xhtml#sec3_3`


    原始数据通常需要进行转换。数据需要转换有很多原因。例如，数字在原始数据集中可能以字符串形式表示，需要转换为整数或双点数以包含特征向量中。另一个原因可能是单位错误。例如，华氏度需要转换为摄氏度，或者英寸需要转换为公制。


    有时数据结构必须进行转换。JSON（JavaScript 对象表示）格式的数据可能需要转换为 XML（可扩展标记语言）格式。在这种情况下，数据映射必须进行转换，因为
    JSON 和 XML 文件中的元数据可能不同。例如，在源 JSON 文件中，名称可能标记为“first name”和“last name”，而在 XML 中它们被称为“given
    name”和“family name”。数据转换几乎总是以某种形式形式的，特别是当数据有多个源时。


    ## 3.4 离群值移除 `06_Contents.xhtml#sec3_4`


    离群值移除是另一种常见的数据预处理任务。离群值是一个与其他实例显著不同的观测点。某些机器学习技术（如逻辑回归）对离群值敏感，即离群值可能会严重扭曲结果。

