    measures the goodness of fit. During training, the machine learning algorithm
    tries to minimize the loss function, a process called loss minimization. We are
    minimizing the training loss, or training error, which is the average loss over
    all the training samples. A loss function calculates the price, the loss, paid
    for inaccuracies in a classification problem. It is, thus, also called the cost
    function.


    There are many different loss functions. We have already seen the mean absolute
    error in [equation 2.8](#11_Chapter02.xhtml#eq2_8). Another popular loss function
    is the mean squared error (MSE) since it is easy to understand and implement.
    The mean squared error simply takes the difference between the predictions and
    the ground truth, squares it, and averages it out across the whole data set. The
    mean squared error is always positive and the closer to zero the better. The mean
    squared error is computed as shown in [equation 2.9](#11_Chapter02.xhtml#eq2_9).


    | $MSE = \\frac{1}{n}{\\sum\\limits\_{i = 1}^{n}\\left( {y\_{i} - f\\left( x\_{i}
    \right)} \\right)^{2}}$ || (2.9) |


    | --- | --- |

    | `y` || \= Vector of `n` predictions |

    | --- | --- |

    | `n` || \= Number of predictions |

    | `f(x[i])` || \= Prediction for the `i`th observation |


    Other popular loss functions include hinge loss or the likelihood loss. The likelihood
    loss function is also a relatively simple function and is often used for classification
    problems. It just multiplies the predicted probabilities for each instance. It
    is not as easily interpreted as the mean squared error, but it is useful for comparing
    models. As mentioned before, it is not always obvious which loss function to use.
    It depends on the problem and the data set at hand. For instance, the squared
    loss penalizes large residuals a lot more than other types of loss functions.
    Also, it should be noted that other evaluation methods apply for learners such
    as decision trees. For decision trees, we need a measure for the purity, which
    means, how well the classes are separated. The Gini impurity or the information
    gain entropy can be used.


    ## Bias and variance


    The bias-variance tradeoff problem is a well known problem in supervised learning.
    It can be used to understand under- and over-fitting. Models with high bias tend
    to be less complex but underfit the data and miss important information in the
    data. Bias is an error that stems from over simplistic assumptions. Models with
    high variance tend to be more sensitive and overfit the data. They represent the
    training data well but do not generalize well beyond the training data. They tend
    to capture noise instead of the signal. Ideally, both bias and variance should
    tend towards zero. The bias-variance tradeoff refers to the fact that it is typically
    impossible to minimize both at the same time. Bias and variance will be explained
    in more detail in Chapter 9.1.1.


    ### [2.6.1 Stochastic gradient descent](#06_Contents.xhtml#sec2_6_1)


    During training we try to minimize a loss function. So we need to make sure we
    learn into the right “direction” and not getting worse. For a simple loss function,
    we could use calculus to find the optimal parameters that minimize the loss function.
    However, for a more complex loss function, calculus might not be feasible anymore.
    One approach is to iteratively optimize the objective function by using the gradient
    of the function. This iterative optimization process is called gradient descent
    where the gradient tells us which direction to move to decrease the loss function.
    [Figure 2.9](#11_Chapter02.xhtml#fig2_9) shows gradient descent with a hypothetical
    objective function `w²` and the derivative `2*w` that gives us the slope. If the
    derivative is positive, it slopes downwards to the left as shown in [Figure 2.9](#11_Chapter02.xhtml#fig2_9),
    if it is negative, it slopes to the right. The value of the derivative is multiplied
    by the constant step size `η`, called the learning rate, and subtracted from the
    current value. Once the change of the parameter value becomes too small, in [Figure
    2.9](#11_Chapter02.xhtml#fig2_9) when it approaches zero, the process stops. The
    hyperparameter `η` is the step size, which defines how fast we move to the minimum.


    The problem with gradient descent is that it is slow since every iteration has
    to go through all the training instances, the batch, which is expensive, especially
    if the training set is large. The training loss is the sum over all the training
    data, which means, the algorithm has to go through all training instances to move
    one step down.


    ![Figure 2.9: Gradient descent.](images/fig2_9.jpg)


    **[Figure 2.9:](#07_ListofFig.xhtml#fig2_9)** Gradient descent.


    A much more efficient method is stochastic gradient descent (SGD). Stochastic
    gradient descent addresses the issue of slow convergence when the training data
    set is large and when it contains a large number of features. Furthermore, in
    an online setting, there is no easy way to add data in batch methods, where the
    entire set is used for each step. In Stochastic gradient descent, instead of using
    the entire batch in every iteration, the gradient is estimated using only one
    instance, a batch of size 1, for every step. In other words, we use the cost gradient
    of one instance, instead of the sum of the cost gradient of full batch. The term
    stochastic refers to the fact that the single instance that is used per iteration
    is chosen randomly. The assumption is that, given enough iterations, using one
    instance per iteration, we can estimate the gradient on average. Each iteration
    might not be as good as an iteration using the full batch, but this way we can
    make many iterations and in practice, making just one pass over each training
    example performs equally well to going through, say, ten iterations over the full
    batch. Some implementations use more than just training instance. Mini-batches
    of ten to one thousand instances are a compromise between using one instance and
    a full batch. Since very large batches are often noisy, stochastic gradient descent
    using single or mini-batches still converges fast and can reduce variance. Some
    implementations adapt the step size for every iteration.


    A few remarks: Choosing the step size `η` is crucial since it defines how fast
    the algorithm converges. Using a large `η` the algorithm might converge faster
    than with a small `η`. However, with `η` set too large, there is the risk that
    the search overshoots and the algorithm never reaches the minimum. If the step
    size is too small and the error function has several minima (typical for loss
    functions of artificial neural networks) as shown in [Figure 2.10](#11_Chapter02.xhtml#fig2_10),
    it might get caught in a local minimum and never reach the absolute minimum. To
    avoid this, some implementations adapt the step size as mentioned before. A suggested
    approach sets the step size to one and decreases it during training. In other
    approaches, the learning rate is halved as convergence slows down or it can be
    annealed at each iteration. Many extensions and variations have been proposed,
    since setting the learning rate is crucial to obtain good results.


    ![Figure 2.10: Gradient descent issues.](images/fig2_10.jpg)


    **[Figure 2.10:](#07_ListofFig.xhtml#fig2_10)** Gradient descent issues.

