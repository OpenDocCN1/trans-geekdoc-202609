    在机器学习中，学习是在可能的表示空间中进行搜索，以找到最拟合当前数据的表示。因此，学习可以被视为一种搜索。机器学习中的“机”指的是执行搜索的算法。算法是数学与逻辑的结合。通常，搜索空间太大，无法被完全遍历。这有时被称为“维度灾难”。诸如降维等技术可以缓解这个问题。此外，某些学习技术可以帮助提高高维情况下学习算法的性能。


    ## 9.1 学习问题


    学习一种表示是在许多需求之间进行权衡 [31]。表示越丰富，通常对后续问题就越有用。然而，为了创建更丰富的表示，需要大量的数据。通常，所需数据的可用性往往是一个问题。交叉验证等技术有助于缓解数据稀缺问题。此外，机器学习方案容易出现过拟合。从统计学意义上说，“拟合”意味着我们寻找能够合理地拟合数据的最佳描述
    [40]。过拟合模型无法从训练数据很好地泛化到未见数据，捕捉的是噪声而非底层信号。基本上，学习到的模型与其构建它的特定训练数据结合得太紧密了 [40]。过拟合模型也被称为过度训练。


    在预测建模中，信号是你想要从数据中学习的真实底层模式。噪声是指数据集中的无关信息或随机性。当表示无法充分捕获数据的底层结构时，被称为欠拟合或学习不足。欠拟合模型的预测方差通常较小，但对错误预测的偏差较大。偏差（Bias）是期望值与测量（观测）预测值之间的差异。方差（Variance）是学习算法对特定数据集的敏感性。高方差模型会根据所使用的训练数据集产生非常不同的模型。低方差、高偏差的学习者倾向于更简单，但具有僵硬的底层结构。朴素贝叶斯或回归模型属于这一类。另一方面，低偏差、高方差的学习者倾向于更复杂，但具有更灵活的底层结构。深度决策树和
    k 近邻学习器属于这一类。这种复杂性的权衡被称为偏差-方差权衡，因为学习者不可能同时是复杂的又是简单的。集成学习器倾向于具有更小的偏差和方差误差。


    ### 9.1.1 偏差-方差权衡


    偏差-方差权衡是监督学习的一个基础问题，适用于分类和回归。它是关于同时减少两种误差来源（偏差和方差）的问题。为了在偏差和方差之间找到良好的平衡，一个良好的预测模型会减少总误差。总误差定义为：


    ```

    Total error = Bias² + Variance + Irreducible error || (9.1)

    ```


    | | |

    | --- | --- |

    | Bias | = 期望值与实际值之间的偏差 |

    | Variance | = 对训练集微小波动的敏感性产生的误差 |

    | Irreducible | = 不可约误差是真实关系中的噪声项 |


    偏差指的是模型误差，而方差指的是模型应用于其他数据集时预测准确性的一致性 [1]。不可约误差（也称为噪声）在训练过程中无法通过任何模型从根本上减少。它有时可以通过执行更好的数据预处理步骤（通常是更好的数据清洗）来减少。不可约误差源于数据本身，而偏差和方差源于学习算法的选择。在无限训练数据的情况下，理论上可以将偏差和方差降低到
    0（渐近一致性和渐近有效性）。然而，某些学习者即使有足够的数据也无法拟合模型。例如，`linear` 无法拟合数据。如 `Figure 9.1` (`21_Chapter9.xhtml#fig_1`)所示，`perceptronron`
    显示了数据。偏差和方差是评估质量的两个标准。遗憾的是，我们无法同时减少偏差和方差，我们需要找到一个最佳平衡，如`equation 9.2` (`21_Chapter9.xhtml#eq_2`)所示。


    偏差-方差权衡是监督学习的一个基础问题，适用于分类和回归。它是关于同时减少两种误差来源（偏差和方差）的问题。为了在偏差和方差之间找到良好的平衡，一个良好的预测模型会减少总误差。总误差定义为：


    ```

    MSE = Bias² + + Variancereducible || ( (9.)))

    ```



    | | |





    | --- | --- |

    | Bias | = 期望值与实际值之间的偏差 |

    | Variance | = 对训练集微小波动的敏感性产生的误差 |

    | Irreducible | = 不可约误差是真实关系中的噪声项 |


    偏差指的是模型误差，而方差指的是模型应用于其他数据集时预测准确性的一致性 [1]。不可约误差（也称为噪声）在训练过程中无法通过任何模型从根本上减少。它有时可以通过执行更好的数据预处理步骤（通常是更好的数据清洗）来减少。不可约误差源于数据本身，而偏差和方差源于学习算法的选择。在无限训练数据的情况下，理论上可以将偏差和方差降低到
    0（渐近一致性和渐近有效性）。然而，某些学习者即使有足够的数据也无法拟合模型。例如，`linear` 无法拟合数据。如 `Figure 9.1` (`21_Chapter9.xhtml#fig_1`)所示，`perceptronron`
    显示了数据。偏差和方差是评估质量的两个标准。遗憾的是，我们无法同时减少偏差和方差，我们需要找到一个最佳平衡，如`equation 9.2` (`21_Chapter9.xhtml#eq_2`)所示。


    偏差-方差权衡是监督学习的一个基础问题，适用于分类和回归。它是关于同时减少两种误差来源（偏差和方差）的问题。为了在偏差和方差之间找到良好的平衡，一个良好的预测模型会减少总误差。


    ![Figure 9.1: Linear fitting.](img/fig_1.jpg)


    **Figure 9.1: Linear fitting.** (07_Listof.xhtml#fig_1)


    ```

    MSE = Bias² + Variance + Irreducible || (9.2)

    ```


    由于我们无法同时减少偏差和方差，我们需要找到一个最佳平衡，如`Figure 9.2` (`21_Chapter9.xhtml#fig_2`)所示。有几种策略管理偏差和方差。简化模型可以减少方差，例如通过特征选择或降维。此外，使用更大的训练集倾向于减少方差。


    如前所述，不同的学习者行为往往不同，一个关键区别是它们产生的偏差和方差。这就是为什么通常会训练并评估多个学习者，以找到最适合问题的算法。另一种方法是使用集成。Bagging（自助聚合法）是一种简单而强大的集成方法。它是一种也可以减少方差的通用过程。Bagging
    是 bootstrap aggregating 的缩写，是一种重采样技术，通过有放回的随机选择创建不同的训练集（这意味着我们可以多次选择同一个实例）。每个样本用于训练一个模型。然后通过平均和多数投票组合预测值。虽然
    Bagging 最初是为决策树开发的，但该思想适用于任何产生具有足够变异预测值的算法 [1]。为了获得良好的 Bagged 集成，单个模型应该是过拟合的，这意味着偏差很低。Bagging
    通过平均预测值来减少方差。Bagging 可以被视为方差消除技术。Bagging 的另一个特征是生成的模型使用整个特征空间进行节点分裂。

