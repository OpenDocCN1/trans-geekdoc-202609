  trans: '

    文献中对于人工智能并没有统一的定义。但总的来说，人工智能描述的是通常在计算机上由人类完成的任务。然而，机器执行人类任务的方式与人类执行的方式在本质上是不同的，在许多任务中人类仍然处于优地位。无论是孩子学习区分猫狗，还是老年人学习纸牌游戏的规则，人类都拥有无比拟的学习能力。孩子只需看一眼猫，就知道猫是什么，无论体体大小或毛色颜色如何。而机器学习方案则需要在数千张处于不同位置、不同年龄的猫的图像上进行训练，才能识别具有不同毛纹模式的猫。


    人类非常擅长将看到的事物进行分类。这对于我们的生存至关重要。远古人类在狩猎时必须能够快速区分敌人和猎物。同样，我们需要能够区分潜在的危险交通状况和正常状况。由于我们不断地遇到新的交通状况，我们必须能够快速评估它们是否具有潜在危险。我们在街道上看到很多被忽略的车辆，但突然之间，所有的注意力都会集中在某辆做出奇怪动作的车辆上。目前，人类如何潜意识地决定哪些信息是相关的很大为人未知。这是自动驾驶汽车必须解决的重大挑战之一。


    在过去的几十年里，在揭示人类学习在分子水平如何运作方面取得了巨大进展。近年来，神经科学对记忆是如何形成的有了相对深入的理解。学习和记忆形成与脑细胞之间连接的增强和削弱有关。频繁交互的神经元形成纽带，使它们之间能够更容易、更准确地传递信息。形成鲜明对比的是，我们对这些相同记忆如何维持的理解非常有限
    [27]。


    我们如何回想过去的片段并在脑海中像电影一样重放它们，很大为人未知。编码和检索我们日常个人经历的能力被称为情景记忆，它由内侧颞叶（MTL）电路的支持，包括海马体，海马体与许多特定的分布式皮层和皮层下结构广泛相互作用
    [5]。人类大脑中有三个区域涉及显性记忆存储：海马体、新皮层和杏仁核。目前尚不清楚记忆是如何被存储的。一些研究表明，学习会修改 DNA [27]。表观遗传机制可能在突触塑性和记忆形成中起着重要作用
    [20]。DNA 是人体中最稳定的记忆位置，因此是保留信息的逻辑场所，但这纯粹是推测。


    人类也会遗忘事物。遗忘的能力是为了保护我们免受信息过载的影响。记忆分为三个存储区域：存储感觉信息的感官记忆、短期记忆（STM）和长期记忆（LTM）。感官记忆极短，仅保留信息几秒钟。短期记忆正如其名，存储信息的时间很，通常在
    20 到 30 秒之间。如果信息经过复述，它会被保留得更久，并可能变成长期记忆。大脑如何过滤它保留的信息以及它如何决定遗忘哪些信息，目前尚不清楚。我们可能记得去年的一场争吵，但只模糊地记得几周前的一次对话。在这里，我们仍然不知道大脑认为哪些信息是值得保留的，而它又忘记了什么。一场激烈的争吵可能更值得存储，因为它们可能比关于天气的对话产生更大的后果，但这种过滤器是如何工作的，我们并不可知。


    这些未知因素是人工智能和机器学习中的巨大挑战。当我们不知道某事在现实生活中如何运作时，如何在计算机上模仿它呢？即使我们对人类学习和记忆运作的许多方面仍然一无知，但在尝试模仿它时，我们学会了大自然为了赋予我们这些能力必须解决哪些问题。通过模仿生物机制来学习有助于我们更好地理解当前的问题，即使我们找到的解决方案与自然界中的解决方案非常不同。


    为了推进人工智能和机器学习，我们需要两者：对生物机制更深入的理解，以及尝试模仿它们的改进实现。机器学习是一个跨学科的研究领域，预计我们将看到更多研究人员相互合作，以汇聚不同领域的知识。语言学家将与数据科学家合作以改进文本挖掘能力，神经生物学家将与计算机科学家和机器人专家合作，以提高机器人和自主系统的技能。工业界和学术界已经出了许多努力，因为改进系统有助于我们提高生产场所或交通效率，并减少能量消耗和排放。机器学习有望降低医疗服务和老年护理成本，提高道路和工作场所的安全措施，这只是几个应用领域。我们可能还会看到尚未想过的新应用领域。


    ## 11.1 研究方向 (#06_Contents.xhtml#sec11_1)


    目前，机器学习算法是针对单一任务训练的，例如将文本从一种语言翻译成另一种语言，或者引导机器人或自动驾驶汽车。这与人类智能形成对比。人类可以读写、计算、踢足球、唱歌和弹钢琴。目前正在进行大量研究来开发能够学习不同任务的算法。这一研究领域被称为通用人工智能（AGI），与人工人工智能（ANI）相反。AGI
    的目标是执行人类可以完成的任何智力任务。与其说开发一个可以学习任何内容的单一系统，我们可能会看到多个系统协同工作进行协作学习。目前已经有可以部署多个学习者的系统，例如，一个训练用于将英语翻译成俄语的系统，另一个训练用于将英语翻译成德语的系统。这些机器学习引擎的优势在于它们可以模块化的方式构建和增强，例如添加新语言或新功能（如文本转语音功能）。模块化系统更容易维护和测试。


    '
