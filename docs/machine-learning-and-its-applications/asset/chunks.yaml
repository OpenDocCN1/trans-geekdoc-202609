    ![图 4.15: 过拟合的回归曲线。](img/fig4_15.jpg)


    **图 4.15：** 过拟合的回归曲线。


    线性回归是一种用于预测分析的基本方法。它是一种对因变量 `y` 与一个或多个解释变量或独立变量 `x` 之间关系进行建模的线性方法。线性方程 4.14


    | `y`  = `a`*x`  + `b` || (4.14) |

    | --- | --- |


    其中


    |  `x` || \= 独立变量 |

    | --- | --- |

    |  `y` || \= 因变量 |

    |  `a` || \= 斜率 |

    |  `b` || \= 截距 |


    只有一个因变量和一个独立变量的回归方程的最简单形式。`a` 和 `b` 是系数，也称为回归系数或权重。线性回归假设输入变量或变量 `x` 与单一输出变量 `y`
    之间存在线性关系。使用机器学习，这些系数是从数据中学习的。换句话说，我们试图为给定的数据点找到拟合直线。在机器学习中，变量被称为特征（feature）。因变量在机器学习术语中被称为目标（target）、预测器或标签（label）。


    图 4.16 显示了拟合数据的回归线。


    如果数据无法进行线性拟合，则多项式或曲线可能更好地拟合，此时可以使用多项式回归或曲线回归等技术。


    描述 `y` 如何与 `x` 关系的方程称为回归模型。它在方程 4.14 中给出。它根据已知 `x` 值计算 `y` 的平均值。在训练过程中，调整系数 `a`
    和 `b` 直到找到最佳拟合线，即回归线。这是通过最小化数据点与回归线之间距离的平方差和来实现的。


    首先，我们需要确定因变量和独立变量之间是否存在关系。例如，我们可能想确定体重与预期寿命之间是否存在关系。如果存在关系，我们就可以预测新体重的预期寿命。


    ![图 4.16: 线性回归。](img/fig4_16.jpg)


    **图 4.16：** 线性回归。


    拟合线性回归的最常用的方法是普通最小二乘法（ordinary least squares method）。这也被称为普通最小二乘线性回归或简称最小二乘回归。普通最小二乘法通过计算每个数据点到回归线的距离、将其平方并将所有平方相加来估计系数值。普通最小二乘法试图最小化平方误差和。普通最小二乘回归的变体包括
    Lasso（最小绝对收缩和选择算）回归和岭回归（ridge regression）。Lasso 回归也旨在最小化平方误差和，但它还执行特征选择。岭回归旨在最小化平方误差和。


    #### 简单回归


    简单回归（也称为双变量回归）由对组成，包含一个独立变量 `x` 和一个因变量 `y`。直线即为预测。最佳拟合是预测误差尽可能小的。


    `x` 与 `y` 之间的关系在方程 4.15 中表示：


    | `y`  = `a`*x`  + `b` || (15) |

    | --- | --- |


    其中


    |  `x` || \= 独立变量 |

    | --- | --- |

    |  `y` || \= 因变量 |

    |  `a` || \= 斜率 |

    |  `b` || \= 截距 |

    |  `ε` || \= 误差项 |


    误差项 `ε` 代表回归并非完全精确的事实。回归线是偏差之和。如果回归线向上倾斜，我们具有正相关关系；如果向下倾斜，我们具有负相关关系。一些例子是学习小时和考试分数，或者酒精摄入量和血液水平。


    #### 多元回归


    简单线性回归仅使用一个预测器。在许多现实世界问题中，存在多个独立变量，因此被称为多元回归或多元回归。多元回归试图通过对数据点拟合线性方程来对解释（独立）变量与响应（因）变量之间的关系建模。


    给定 `n` 个观测值，模型定义可以如方程 4.16 所示：


    | `y`  = `β[0]` + `β[1]`x[1]`  + `β[2]`x[2]`  +… `β[n]`x[n]`  + `ε` || (16) |

    | --- | --- |


    其中


    |  `x` || \= 预测变量 |

    | --- | --- |

    |  `y` || \= 因变量 |

    |  `β` || \= 回归系数 |

    |  `n` || \= 观测值数量 |

    |  `ε` || \= 误差项 |


    多元回归假设：


    - 因变量与独立变量之间存在线性关系

    - 独立变量之间没有过度相关；不存在多共线性

    - 回归残差呈正态分布


    由于我们有多个独立变量 `x`，我们正在多维空间中拟合一个超平面。如果我们有 `n` 个独立预测变量，我们尝试在 `n + 1` 维空间中拟合一个超平面。为了找到最佳拟合超平面，可以使用与简单线性回归相同的方法并最小化残差和。使用多个独立变量的例子包括估计取决于位置、房屋大小、年龄等的房屋价格。


    ### 4.2.2 多项式回归


