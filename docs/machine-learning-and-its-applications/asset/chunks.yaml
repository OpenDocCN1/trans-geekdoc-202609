- raw: 'Once the restricted Boltzmann machine training is completed, the activations
    of the hidden layer become the input of the next hidden layer. The second hidden
    layer is trained until it is able to approximate the input from the previous hidden
    layer. This step by step approach of training hidden layers in an restricted Boltzmann
    machine is one of the most common deep learning strategies since it permits to
    train many hidden layers efficiently. It is unsupervised, since it does not require
    labeled data for training. This sequential construction of a multilayered network
    allows to learn more complex representations by creating a feature hierarchy.
    The pre-trained multilayered restricted Boltzmann machine forms the basis for
    a deep belief network. The pre-trained deep belief network can then be trained
    for instance for image classification using supervised learning. Pre-training
    a network by initializing the weights is one of the main use cases for restricted
    Boltzmann machines.


    ## [8.5    Deep belief networks](#06_Contents.xhtml#sec8_5)


    A deep belief network (DBN) is a sequence of the restricted Boltzmann machines
    that were introduced in the previous chapter. It is a type of deep learner that
    consists of multiple hidden layers with connections from previous and to subsequent
    layers but not within layers. Like a restricted Boltzmann machine, it can learn
    to reconstruct its input. The layered architecture allows for fast unsupervised
    training. The pre-trained deep belief network is a type of unsupervised pre-trained
    network. Each layer acts as a feature detector. Once training is completed, it
    can be trained further in a supervised fashion in order to create a classifier.
    The deep belief network might then end with an output layer, such as a softmax
    or logit layer, for classification. A deep belief network can be trained in a
    greedy fashion, where each layer is trained separately. Each hidden layer becomes
    the visible layer for the next hidden layer.


    There are many use cases for a deep belief network. A deep belief network can
    be used for classification, image recognition or image generation. It can also
    be used for clustering. In this case there is no output layer. Other use cases
    of deep belief networks are video sequences and motion-capture data generation.
    In practice, deep belief networks have many real-world applications. They are
    used to classify high resolution satellite or medical images, for drug discovery
    or to analyze electroencephalograms.


    A deep belief network accepts binary input as data. An extension, continuous deep
    belief networks, also accepts continuous decimal values.


    ## [8.6    Deep autoencoders](#06_Contents.xhtml#sec8_6)


    An autoencoder is a network used to learn a representation (encoding) of a data
    set in an unsupervised manner. An autoencoder compresses the data into a code,
    then uncompresses it again into something close to the input. In this manner,
    it is trained to ignore noise in data. The autoencoder learns both to compress,
    i.e., encode, the input and to reconstruct the input. Autoencoders have gained
    popularity in the past years since they have been included in many powerful deep
    learning architectures. They are typically used for dimensionality reduction.
    Autoencoders can also be used as a generative model. The learned codes can be
    used to construct an image of something the autoencoder has not seen before.


    In its simplest form, an autoencoder is a feedforward network with an input, an
    output and one hidden layer. The input and output layer have the same number of
    neurons. An autoencoder always encodes and decodes an input. Autoencoders try
    to learn a function *h* such that *h[W,b]*(*x*) ≈ *x* where the parameters *W*
    are the weights and *b* is the bias. In other words, they are trying to approximate
    the identity function. An identity function always returns the same value that
    was passed to the function as an argument. Autoencoders are trained in an unsupervised
    fashion by minimizing a loss function such as the squared error. If the hidden
    layers are larger than the input layer, an autoencoder can learn the identity
    function and reconstruct the input identically.


    Deep autoencoders consist of two symmetrical deep belief networks. They are capable
    of compressing data, such as images. They can also be used for topic modeling.
    Topic modeling is the process of discovering the topic or the topics in a set
    of documents.


    Deep autoencoders consist of one encoding part and one symmetrical decoding part.
    Each part consists of one or more deep belief networks. [Figure 8.8](#19_Chapter08.xhtml#fig8_8)
    shows a simple deep autoencoder architecture.


    An autoencoder takes binary data as input, such as pixel arrays, but it can also
    use real-valued data as input. If the input is an image of 32\*32 = 1024 pixels,
    the input layer should contain about 1200 units, slightly larger than the 1024
    input pixels due to the limited capacity of the sigmoid belief units. The subsequent
    number of units will be something like 600, 300, 150 and 50, where 50 is an encoded
    version of the input image. It is the latent vector with the compressed representation.
    Latent variables cannot directly be observed. They are inferred from the observed
    variables. The decoding half of the autoencoder consists of the same number of
    layers and nodes but in reverse order. It accepts the condensed vector as input
    and learns how to reconstruct the image. There are also variations where the hidden
    vector is bigger than the input layer. If the hidden code is smaller than the
    dimension of the input, the autoencoder is said to be undercomplete. If it is
    bigger, it is called overcomplete.


    ![Figure 8.8: Deep autoencoder.](images/fig8_8.jpg)


    **[Figure 8.8:](#07_ListofFig.xhtml#fig8_8)** Deep autoencoder.


    Autoencoders may be thought of as being a special case of feedforward networks
    and may be trained with all the same techniques, typically minibatch gradient
    descent following gradients computed by back-propagation \[[8](#25_References.xhtml#ref8)\].
    Learning happens through minimizing a loss function *L* that can be described
    as shown in [equation 8.5](#19_Chapter08.xhtml#eq8_5):


    | *L*(*x*,*g*(*f*(*x*))) || (8.5) |


    | --- | --- |


    by penalizing *g*(*f*(*x*)) for being dissimilar to *x*.


    Typically, when using an autoencoder, we are not interested in the output but
    rather in the properties of the compressed representation. The representation
    can be used for topic modelling, but is also useful for information retrieval
    in documents since the hidden code contains the most salient features. They are
    also used for image search engines. When the hidden code of an image is similar
    to the hidden code of another image, it is translated into the matching image
    that is then returned. Autoencoders have also been developed using ConvNets as
    encoding and decoding networks instead of deep belief networks.


    | [LEARNING TECHNIQUES](#06_Contents.xhtml#sec4) || [IV](#06_Contents.xhtml#sec2)
    |


    | --- | --- |


    # [Chapter 9](#06_Contents.xhtml#ch9)


    # [Learning Techniques](#06_Contents.xhtml#ch9)


    **CONTENTS**


    [9.1    Learning issues](#21_Chapter09.xhtml#sec9_1)


    [9.1.1    Bias-Variance tradeoff](#21_Chapter09.xhtml#sec9_1_1)


    [9.2    Cross-validation](#21_Chapter09.xhtml#sec9_2)


    [9.3    Ensemble learning](#21_Chapter09.xhtml#sec9_3)


    [9.4    Reinforcement learning](#21_Chapter09.xhtml#sec9_4)


    [9.5    Active learning](#21_Chapter09.xhtml#sec9_5)


    [9.6    Machine teaching](#21_Chapter09.xhtml#sec9_6)


    [9.7    Automated machine learning](#21_Chapter09.xhtml#sec9_7)'
