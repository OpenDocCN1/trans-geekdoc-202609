- raw: 'Machine learning has many more applications that cannot all be covered in
    one chapter or book, but some notable area of machine learning utilization is
    the military. Drone surveillance produces a tsunami of data that needs to be analyzed
    quickly before, for instance, a potential enemy has disappeared. The Department
    of Defence has specifically established an Algorithmic Warfare Cross-Functional
    Team (AWCFT) in order to integrate artificial intelligence and machine learning
    more effectively across operations so as to maintain advantages over increasingly
    capable adversaries and competitors \[[42](#25_References.xhtml#ref42)\]. Using
    AI, Project Maven will initially provide vision algorithms for object detection,
    classification, and alerts, according to the memo establishing the team. Google
    has supported the Pentagon with a special API to its Tensor-Flow machine learning
    framework for analyzing images from drones. Google is providing AI to the Pentagon
    Project Maven, which aims to speed up analysis of drone footage by automatically
    classifying images of objects and people in the MQ-9 Reaper drone. Its goal is
    to make the drone attack military targets automatically. Ultimately, the goal
    is to develop autonomous systems, such as drones and other airborne tactical areal
    systems, that can attack independently.


    Machine learning can be used to analyze and respond to cyber attacks as described
    before. Machine learning has been used in cyber security for detecting anomalies
    in network traffic and malware. However, machine learning can also be used to
    create malware. Developing malware, Trojans, ransomeware or malicious scripts,
    is largely a manual process for a cyber criminal. Machine learning can automate
    this process or speed it up considerably. Algorithms based on generative adversarial
    network (GAN) have already been proposed \[[12](#25_References.xhtml#ref12)\].
    Machine learning can generate malware which is not detectable by traditional intrusion
    detection systems. Malware authors usually have no access to the detailed structures
    and parameters of the machine learning models used by malware detection systems,
    therefore, they can only perform black-box attacks \[[12](#25_References.xhtml#ref12)\].
    Using machine learning, they can modify code on the fly and adapt to detection
    systems and, thus, form polymorphic malware. They can also poison the machine
    learning engine of the detection system, like viruses already do for AntiVirus
    software. More sophisticated attacks use botnets and swarm intelligence. A swarm
    is a decentralized, self-organizing system. Bots that are interconnected through
    the Internet form a botnet. The community of computers in a botnet transmit spam
    or viruses across the web without their owners permission \[[43](#25_References.xhtml#ref43)\].
    Self-learning swarmbots form a hivenet. Hivenets share information to create a
    customized attack. They can, for instance, attack any access point in a company
    network. Bots can run on any device connected to the internet, smart phones, baby
    phones, TV boxes or soundbars.


    The Internet of Things (IoT) is an evolution of the Internet where everyday objects
    such as refrigerators, sensors or actuators are connected to the Internet and
    can communicate with other devices. Internet of Things is the connectivity of
    the Internet into the physical world. Technological advancements lead to smart
    objects being capable of identifying, locating, sensing and connecting and, thus,
    leading to new forms of communication between people and things and things themselves
    \[[6](#25_References.xhtml#ref6)\]. Internet of Things produces a lot of data
    and is only useful when the data can be analyzed effectively. Internet of Things
    has given machine learning a whole new application field. The data produced by
    Internet of Things enabled devices can be of any form; numeric data, streaming
    data, text data or binary data. The data is transmitted to the cloud, where it
    is being analyzed and visualized for end users to be assessed. Cloud computing
    has become a de facto platform to enable content delivery to consumers \[[9](#25_References.xhtml#ref9)\].
    Internet of Things can connect all equipment in a whole production plant to monitor
    its health state and determine if a device or part needs maintenance or replacement.
    Often, it is not feasible to transmit all data into the cloud due to limited bandwidth
    or storage in the cloud. The premise of seamless integration of all Internet of
    Things enabling technologies, along with advancements in IPv6 and semantic services,
    positioned the industry in a premature state \[[29](#25_References.xhtml#ref29)\].
    Major advancements in wireless technology, Radio-frequency identification (RFID)
    and improvements in battery technology enabled Internet of Things, but effectively
    analyzing the data produced is still challenging. Often, the data is pre-processed
    and analyzed on systems close to the physical devices and only a consolidated
    data set is sent to the cloud. This is called edge computing. Data analysis software
    is deployed on the edge computer. Edge computers are machine learning enabled
    and usually support deep learning too. The edge computer monitors the connected
    devices for potential problems using predictive and preventive maintenance as
    described in [section 10.1.2](#23_Chapter10.xhtml#sec10_1_2). If it determines
    that an equipment needs maintenance, it sends an alert to the cloud where a service
    technician can be assigned to correct the problem. Often, several edge computers
    are deployed, each monitoring and analyzing different equipment. The data mining
    system in the cloud analyses the consolidated information transmitted from the
    different edge computers. This is called distributed analytics. Distributed analytics
    spreads the workload aver multiple nodes, the edge computers. This is called fog
    computing or fog networking, where a network of connected edge computers carry
    a substantial amount of computing and storage. This results in faster insights
    into the health state of the connected devices. Ideally, the edge computers can
    communicate with each other and do collaborative machine learning, see [section
    11.1](#24_Chapter11.xhtml#sec11_1). However, current Internet of Things solutions
    are not as advanced yet.


    Machine learning enabled Internet of Things solutions are not limited to predictive
    and preventive maintenance. They can be used to optimize the production in a factory,
    save resources such as energy or raw materials and reduce waste.


    # [Chapter 11](#06_Contents.xhtml#ch11)


    # [Future Development](#06_Contents.xhtml#ch11)


    **CONTENTS**


    [11.1  Research directions](#24_Chapter11.xhtml#sec11_1)'
  fmt: '

    Machine learning has many more applications that cannot all be covered in one
    chapter or book, but some notable area of machine learning utilization is the
    military. Drone surveillance produces a tsunami of data that needs to be analyzed
    quickly before, for instance, a potential enemy has disappeared. The Department
    of Defence has specifically established an `Algorithmic Warfare Cross-Functional
    Team (AWCFT)` in order to integrate artificial intelligence and machine learning
    more effectively across operations so as to maintain advantages over increasingly
    capable adversaries and competitors [[42](#25_References.xhtml#ref42)].`. Using
    AI, `Project Maven` will initially provide vision algorithms for object detection,
    classification, and alerts, according to the memo establishing the team. Google
    has supported the Pentagon with a special API to its `Tensor-Flow` machine learning
    framework for analyzing images from drones. Google is providing AI to the Pentagon
    `Project Maven`, which aims to speed up analysis of drone footage by automatically
    classifying images of objects and people in the `MQ-9 Reaper` drone. Its goal
    is to make the drone attack military targets automatically. Ultimately, the goal
    is to develop autonomous systems, such as drones and other airborne tactical areal
    systems, that can attack independently.


    Machine learning can be used to analyze and respond to cyber attacks as described
    before. Machine learning has been used in cyber security for detecting anomalies
    in network traffic and malware. However, machine learning can also be used to
    create malware. Developing malware, Trojans, ransomeware or malicious scripts,
    is largely a manual process for a cyber criminal. Machine learning can automate
    this process or speed it up considerably. Algorithms based on generative adversarial
    network (GAN) have already been proposed [[12](#25_References.xhtml#ref12)].`.
    Machine learning can generate malware which is not detectable by traditional intrusion
    detection systems. Malware authors usually have no access to the detailed structures
    and parameters of the machine learning models used by malware detection systems,
    therefore, they can only perform black-box attacks [[12](#25_References.xhtml#ref12)].`.
    Using machine learning, they can modify code on the fly and adapt to detection
    systems and, thus, form polymorphic malware. They can also poison the machine
    learning engine of the detection system, like viruses already do for `AntiVirus`
    software. More sophisticated attacks use botnets and swarm intelligence. A swarm
    is a decentralized, self-organizing system. Bots that are interconnected through
    the Internet form a botnet. The community of computers in a botnet transmit spam
    or viruses across the web without their owners permission [[43](#25_References.xhtml#ref43)].`.
    Self-learning swarmbots form a hivenet. Hivenets share information to create a
    customized attack. They can, for instance, attack any access point in a company
    network. Bots can run on any device connected to the internet, smart phones, baby
    phones, TV boxes or soundbars.


    The Internet of Things (IoT) is an evolution of the Internet where everyday objects
    such as refrigerators, sensors or actuators are connected to the Internet and
    can communicate with other devices. Internet of Things is the connectivity of
    the Internet into the physical world. Technological advancements lead to smart
    objects being capable of identifying, locating, sensing and connecting and, thus,
    leading to new forms of communication between people and things and things themselves
    [[6](#25_References.xhtml#ref6)].`. Internet of Things produces a lot of data
    and is only useful when the data can be analyzed effectively. Internet of Things
    has given machine learning a whole new application field. The data produced by
    Internet of Things enabled devices can be of any form; numeric data, streaming
    data, text data or binary data.


    ### Cloud and Edge Computing

    The data produced by Internet of Things enabled devices can be of any form; numeric
    data, streaming data, text data or binary data. The data is transmitted to the
    cloud, where it is being analyzed and visualized for end users. Cloud computing
    has become a de facto platform to enable content delivery to consumers [[9](#25_References.xhtml#ref9)].`.
    Internet of Things can connect all equipment in a whole production plant to monitor
    its health state and determine if a device or part needs maintenance. Often, it
    is not feasible to transmit all data into the cloud due to limited bandwidth or
    storage in the cloud. The premise of seamless integration of all Internet of Things
    technologies, along with `IPv6` and semantic services, positioned the industry
    in a premature state [[29](#25_References.xhtml#ref29)].`. Major advancements
    in wireless technology, `Radio-frequency identification (RFID)` and improvements
    in battery technology enabled Internet of Things, but effectively analyzing the
    data is still challenging. Often, the data is pre-processed and analyzed on systems
    close to the physical devices and only a consolidated data is sent to the cloud.
    This is called `edge computing`. Data analysis software is deployed on the `edge
    computer`. Edge computers are machine learning enabled and usually support deep
    learning too. The `edge computer` monitors the connected devices for potential
    problems using predictive and preventive maintenance as described in [section
    10.1.2](#23_Chapter10.xhtml#sec10_1_2). If it determines that an equipment needs
    maintenance, it sends an alert to the cloud where a service technician can be
    assigned to correct the problem. Often, several edge computers are deployed, each
    monitoring and analyzing different equipment. The data mining system in the cloud
    analyses the consolidated information transmitted from the different edge computers.
    This is called `distributed analytics`. Distributed analytics spreads the workload
    aver multiple nodes, the `edge computers`. This is called `fog computing` or `fog
    networking`, where a network of connected edge computers carry a substantial amount
    of computing and storage. This results in faster insights into the health state
    of the connected devices. Ideally, the edge computers can communicate with each
    other and do collaborative machine learning.


    ### Summary

    Machine learning enabled Internet of Things solutions are not limited to predictive
    and preventive maintenance. They can be used to optimize the production in a factory,
    save resources such as energy or raw materials and reduce waste.

    '
  trans: '

    机器学习有许多应用，无法在一个章节或一本书中完全涵盖，但机器学习应用的一个显著领域是军事。无人机监视会产生海量数据，这些数据需要在大潜在敌人消失之前进行快速分析。例如，美国国防部专门建立了一个`Algorithmic
    Warfare Cross-Functional Team (AWCFT)`，以便在整个行动执行过程中更有效地整合人工智能和机器学习，从而保持对能力日益增强的对手和竞争对手的优势
    [42]。根据建立该团队的备忘录，通过人工智能，`Project Maven` 最初将为目标检测、分类和警报提供视觉算法。谷歌为五角大楼提供了其 `Tensor-Flow`
    机器学习框架的特殊 API，用于分析来自无人机的图像。谷歌正为五角大楼的 `Project Maven` 提供人工智能，该项目旨在通过自动分类`MQ-9 Reaper`无人机拍摄的对象和图像来加速视频片段的分析。其目标是让无人机自动攻击军事目标。最终，目标是开发自主系统（例如无人机和其他空中战术区域系统），这些系统能够进行独立攻击。


    如前所述，机器学习可以用于分析和响应网络攻击。机器学习已用于网络安全领域，检测网络流量中的异常和恶意软件。然而，机器学习也可以用于创建恶意软件。开发恶意软件、木马、勒索软件或恶意脚本对于网络罪犯来说，在很大程度上是一个手动过程。机器学习可以自动化这一过程或显著提高其速度。基于生成对抗网络（GAN）的算法已经被提出
    [12]。机器学习可以生成传统入侵检测系统无法检测的恶意软件。恶意软件作者通常无法访问恶意软件检测系统所使用的机器学习模型的详细结构和参数，因此，他们只能进行黑盒攻击
    [12]。通过使用机器学习，他们可以随时修改代码并适应检测系统，从而形成多态恶意软件。他们还可以投毒检测系统的机器学习引擎，就像病毒对 `AntiVirus`
    软件所做的那样。更复杂的攻击使用僵尸网络和群智能。集群是一个去中心化的、自组织的系统。通过互联网连接的机器人形成了一个僵尸网络。僵尸网络中的计算机群在未经所有者许可的情况下，跨越网络发送垃圾邮件或病毒
    [43]。自学习集群机器人形成蜂巢网络（hivenet）。蜂巢网络共享信息以创建定制攻击。例如，它们可以攻击公司网络中的任何访问点。机器人可以运行在任何连接互联网的设备上，手机、婴儿电话、电视盒或音箱。


    物联网（IoT）是互联网的演进，将冰箱、传感器或执行器等日常物体连接到互联网并能够与其他设备通信。物联网是互联网向物理世界的延伸。技术的进步使得智能物体能够识别、定位、感知和连接，从而导致了人与物、物与物之间新的通信形式
    [6]。物联网产生大量数据，只有当数据能够被有效分析时才有用处。物联网为机器学习提供了一个全新的应用领域。物联网启用设备产生的数据可以是任何形式：数值数据、流式数据、文本数据或二进制数据。


    ### 云计算与边缘计算

    物联网设备产生的数据可以是任何形式：数值数据、流式数据、文本数据或二进制数据。数据被传输到云端，在云端为终端用户进行分析和可视化。云计算已成为向消费者交付内容的客观标准平台
    [9]。物联网可以连接整个生产厂的所有设备，以监控其健康状态并判断设备或部件是否需要维护。通常，由于带宽限制或云端存储有限，将所有数据传输到云端是不可行的。所有物联网技术的无缝集成，结合
    `IPv6` 和语义服务，使该行业处于一个过早的状态 [29]。无线技术的重大进展、射频识别（RFID）以及电池技术的改进实现了物联网，但有效分析数据仍然是一项挑战。通常，数据在靠近物理设备的系统上进行预处理和分析，只将汇总数据发送到云端。这被称为`边缘计算`。数据分析软件部署在`边缘计算`上。边缘计算支持机器学习，通常也支持深度学习。`边缘计算`根据[10.1.2
    节](#23_Chapter10.xhtml#sec10_1_2）所述，通过预测性和预防性维护监控连接设备的潜在问题。如果它判断设备需要维护，它会向云端发送警报，在那里可以指派维修人员来解决问题。通常，会部署多个边缘计算，每个计算机监控和分析不同的设备。云端的数据挖掘系统分析从不同边缘计算传输的汇总信息。这被称为`分布式分析`。分布式分析将工作负载分散到多个节点（即`边缘计算`）上。这被称为`雾计算`或`雾网网络`，其中连接的边缘计算网络承载了大量的计算和存储。这使得能够快速地洞察连接设备的健康状况。理想情况下，边缘计算可以相互通信并进行协作机器学习。


    ### 总结

    基于机器学习的物联网解决方案不仅限于预测性和预防性维护。它们可用于优化工厂的生产，节省能源或原材料等资源并减少浪费。

    '
