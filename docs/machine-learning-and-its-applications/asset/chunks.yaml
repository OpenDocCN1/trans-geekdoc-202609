- raw: 'Backpropagation is a learning algorithm for adjusting the weights during training.
    After every training iteration, the error or loss at the output of the multilayer
    perceptron is calculated and propagated back through the network. The weights
    are adjusted such that the error in the next iteration is minimized. The initial
    weights are usually set randomly. We do not know what the correct weights of the
    hidden layer are. This fact gives the neurons in the middle of the network their
    name; they are called the hidden layer (or layers), because it is not possible
    to examine and correct their values directly \[[25](#25_References.xhtml#ref25)\].
    First, we need to calculate the gradient of the loss or error function at the
    output. The gradient is calculated using the derivative of the loss function and
    then the chain rule is applied in order to calculate the gradients of each layer.
    In every iteration, the gradient is minimized until the minimum of the function
    is found. This process is called gradient descent. Backpropagation is used by
    the gradient descent algorithm to adjust the weights. This is sometimes called
    backpropagation of errors. Gradient descent is an iterative optimization method
    for finding the minimum of a function. Gradient descent and the issue of getting
    stuck in a local minimum has been covered in [Chapter 2](#11_Chapter02.xhtml).
    To calculate the gradient, the loss function needs to be differentiable. The most
    common loss function in machine learning is the mean squared error (MSE) function
    2.9 that was also covered in [Chapter 2](#11_Chapter02.xhtml). By using the square,
    the bigger the errors are the more they are penalized and the error is always
    positive. The mean squared error is calculated by taking the difference between
    the measured, predicted output and the ground truth, squaring it and averaging
    it across the whole training set. The mean squared error function can be easily
    differentiated and is often used for regression analysis. Other popular loss functions
    include the log loss function that is used for classification. As usual, other
    loss functions and variants exist.


    A full training iteration goes through following steps:


    1.  Forward propagation


    (a)  Propagate input forward through the network to calculate the output


    (b)  Calculate the error at the output


    2.  Backpropagation


    (a)  Backpropagate the error through the network


    (b)  Adjust the weights


    A few remarks: A multilayer perceptron can approximate any continuous function
    and is, thus, a universal function approximator. It can be shown mathematically
    that only one hidden layer suffices to approximate any function. This is called
    the universal approximation theorem. This does not mean that a multilayer perceptron
    always provides meaningful results. The reality is that, sometimes, the more complex
    neural networks either overfit the data or fail to converge to an optimum solution
    \[[1](#25_References.xhtml#ref1)\]. In real world applications, we rarely see
    more than two layers, and, as mentioned before, one layer is enough. However,
    we do not know how many perceptrons we need. The number of nodes has to be determined
    through experimentation by training and evaluating networks with different number
    of nodes.


    Multilayer perceptrons have been criticized for being difficult to interpret,
    particularly their inner workings, unlike decision trees, that are easily interpreted.
    We know the weights of a trained network and the activation functions, but this
    does not tell us much. We face the same problem with deep learners too.


    The multilayer perceptron is trained using batch training. In every training iteration,
    the network is presented with the whole training set. The average sum-of-squared
    errors is calculated and propagated back in order to adjust the weights. The whole
    cycle is called an epoch, where all the training instances have been passed through
    the network. A much simpler way to implement training is sequential training,
    where the error is computed and the weights are adjusted for every training input.
    This is usually less efficient, but since it is easier to program, we often also
    see sequential training implementations.


    ### [4.1.2    Bayesian models](#06_Contents.xhtml#sec4_1_2)


    Bayesian models are based on Bayes theorem. Generally speaking, the Bayes classifier
    minimizes the probability of misclassification. It is a model that draws its inferences
    from the posterior distribution. Bayesian models utilize a prior distribution
    and a likelihood, which are related by Bayes’ theorem. Bayes rule decomposes the
    computation of a posterior probability into the computation of a likelihood and
    a prior probability \[[30](#25_References.xhtml#ref30)\]. It calculates the posterior
    probability *P*(*c|x*) from *P*(*c*), *P*(*x*) and *P*(*x|c*), as shown in [equation
    4.7](#14_Chapter04.xhtml#eq4_7).


    | $P\\left( c \\middle| x \\right) = \\frac{P\\left( x \\middle| c \\right)P\\left(
    c \\right)}{P\\left( x \\right)}$ || (4.7) |


    | --- | --- |


    where


    |  *P*(*c|x*) || \= Posterior probability of class *c* (target) given predictor
    *x* |


    | --- | --- |


    |  *P*(*x|c*) || \= Likelihood which is the probability of predictor given class
    *c* |


    |  *P*(*c*) || \= Prior probability of class *c* |


    |  *P*(*x*) || \= Prior probability of predictor *x* |


    The probability in Bayesian models is expressed as a degree of belief in an event
    that can change in the evidence of new information. The Bayes rule tells us how
    to do inference about hypotheses from data where uncertainty in inferences is
    expressed using a probability. Learning and prediction can be seen as forms of
    inference. Calculating *P*(*x|c*) is not easy when *x* = *v*[1], *v*[2], … *v[n]*
    is large and requires a lot of computing power. However, Bayesian methods have
    become popular in recent years due to the advent of more powerful computers.


    Naïve Bayes


    One of the simplest Bayesian models and one of the simplest machine learning methods
    is the naïve Bayes classifier. It is a generative probabilistic model and is often
    a good starting point for an machine learning project since it can be extremely
    fast in comparison to other classifiers, even on large data sets, and it is simple
    to implement. In practice, the na¨ıve Bayes classifier is widely used because
    of its ease of use and despite its simplicity it has proven to be effective for
    many machine learning problems. For instance, spam filters often use Bayesian
    spam filtering to calculate the probability that an email is spam or legitimate.
    It uses word frequencies, a bag of words, as input to detect spam mails and has
    proved to be an effective filtering method. The na¨ıve Bayes classifier introduces
    the assumption that all variables *v[j]* are conditionally independent. This is
    a na¨ıve assumption, hence the name, since variables often depend on each other.
    This assumption simplifies [equation 4.7](#14_Chapter04.xhtml#eq4_7) to:


    | $P\\left( c \\middle| x \\right) = P\\left( c \\right)\\frac{\\Pi\_{j = 1}^{n}P\\left(
    v\_{j} \\middle| c \\right)}{P\\left( x \\right)}$ || (4.8) |


    | --- | --- |


    where


    |  *x* || \= Vector of *n* attributes |


    | --- | --- |


    |  *P*(*x|c*) || \= Likelihood which is the probability of predictor given class
    *c* |


    |  *P*(*c*) || \= Prior probability of class *c* |


    |  P(*x*) || \= Prior probability of predictor *x* |


    When the assumption holds true, the naïve Bayesian classifier is the most accurate
    in comparison with all other classifiers \[[10](#25_References.xhtml#ref10)\].
    In practice, however, dependencies can exist between variables.'
