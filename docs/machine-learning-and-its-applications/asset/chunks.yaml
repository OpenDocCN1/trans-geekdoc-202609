- raw: 'Clustering has many applications. It has been applied in biology to group
    animals and plants into species, genus, families, etc. More recently, it has also
    been applied in genetics to find similarities in genomes and identify regions
    with possible pathogenic gene mutations. Other applications include marketing
    research, where consumers are grouped into potential buyers of certain products
    or services. Anomaly detection has gained a lot of attention in recent research
    since it can detect anomalies in network traffic and fend off potential threads
    and data breaches or help prevent outages in factories based on anomalies in sensor
    data from machines. Clustering is used for image segmentation to detect regions
    in an image for object recognition. Clustering is also used for analyzing seismographic
    data to find new oil sources or detect dangerous zones in earthquake areas. Many
    more application fields exist. It should be noted that in many real-world applications,
    the notion of cluster is not well defined which can lead to unwanted clusters
    or instances ending up in the wrong cluster. For instance, when books are clustered,
    a biography of a political figure might end up in the politics cluster instead
    of the biography cluster. Since the number of desired clusters is often unknown
    at the beginning of a clustering project, there might be one or more unwanted
    clusters, for instance, a cluster with biographies about political figures. The
    imprecise definition of clustering led to a wide variety of different cluster
    algorithms. Also, different clustering methods are categorized differently in
    literature.


    Since clustering groups data into partitions with similar features, it can be
    considered a classification method. However, in clustering, the labels are derived
    from the data and often not known beforehand.


    ## [6.1    Types of clustering](#06_Contents.xhtml#sec6_1)


    Clustering can be exclusive, where every instance belongs to exactly one cluster.
    This is also called hard clustering. Clusters can also be overlapping, where some
    instances belong to more than one cluster. [Figure 6.1](#16_Chapter06.xhtml#fig6_1)
    shows an exclusive cluster, where every data point belongs to a single cluster,
    and a non-exclusive cluster where data points can simultaneously belong to more
    than one cluster.


    In fuzzy clustering, each instance belongs to every cluster to a certain degree.
    Every data point is assigned a weight or a likelihood that it belongs to a certain
    cluster.


    ![Figure 6.1: Exclusive and non-exclusive clusters.](images/fig6_1.jpg)


    **[Figure 6.1:](#07_ListofFig.xhtml#fig6_1)** Exclusive and non-exclusive clusters.


    In a cluster, every data point is closer, or more similar, to any data object
    in the cluster than to any object in another cluster. Ideally, the clusters are
    far from each other. This is the notion of well-separateness. A cluster is well-separated
    if the distance between the data objects in a cluster is small, i.e., the cluster
    is cohesive, and the distance between data points in different clusters is large.
    Clusters do not have to be globular, as shown in [Figure 6.1](#16_Chapter06.xhtml#fig6_1),
    but can have any shape. Also, clusters can have more than two dimensions.


    ### [6.1.1    Centroid, medoid and prototype-based clustering](#06_Contents.xhtml#sec6_1_1)


    In centroid-based clustering, the data points are grouped around a centroid, the
    mean of all the objects in a cluster. A centroid usually does not correspond to
    an actual data point. By contrast, a medoid must be a data point. A medoid is
    the most representative data point in a cluster. It is used when there is no meaningful
    centroid, e.g., when the data is categorical and not continuous. The prototype
    in prototype-based clustering defines the cluster. Each data point is closer or
    more similar to the prototype than a prototype in any other cluster. The prototype
    is often the centroid. The prototype can be regarded as the most central point
    and the clusters tend to be globular. If the clusters have no centroid, the prototype
    can be the medoid.


    ### [6.1.2    Density-based clustering](#06_Contents.xhtml#sec6_1_2)


    A cluster is a high density region of instances surrounded by a low density area.
    The high density area can be of any shape and the clusters can be intertwined.
    Density-based models are used when the clusters are irregular and when noise and
    outliers are present.


    ## [6.2    k-means clustering](#06_Contents.xhtml#sec6_2)


    k-means clustering is one of the most widely-used clustering algorithms. We have
    already introduced k-means clustering in Chapter 2.2.1. It is a prototype-based,
    partitional clustering algorithm. Partitional clustering means, each instance
    is assigned to a cluster exactly once, and no instance remains unassigned to clusters
    \[[43](#25_References.xhtml#ref43)\]. k-means clustering groups instances into
    *k* disjoint clusters where *k* is user defined. A *k* that has been selected
    inappropriately can yield poor results.


    k-means clustering is an iterative approach. The algorithm starts by randomly
    selecting *k* initial centroids from the data set. *k* has to be selected by the
    user and is not necessarily known at the beginning of a clustering project. Each
    instance of the data set is then assigned to a cluster, based on its distance
    to the centroid. Usually, the Euclidean distance is used. The Euclidean distance
    works well in a two dimensional setting. However, depending on the data at hand
    and in higher dimensional environments, other distance measures, such as the Jaccard
    index or Chebyshev distance, might perform better. After each instance has been
    assigned to a cluster, the centroids are recomputed by calculating the mean of
    each instance in a cluster. This process is repeated until the centroids do not
    change anymore. The basic k-means algorithm is formally defined as described in
    algorithm 6.1.


    **Algorithm 6.1** k-means algorithm


    1: *Randomly select k initial centroids*


    2: ***repeat***


    3:  *Assign each point to the closest centroid*


    4:  *Recalculate the centroids of each cluster*


    5: ***until*** *centroids do not change anymore*


    Often, a weaker convergence criterion is used. The centroids are shifting as long
    as points move from one cluster to another. Instead of converging when no points
    move anymore, the steps three and four in algorithm 6.1 are repeated until, for
    example, more than 1% of the points are moving.


    The k-means algorithm can be very time consuming, since a lot of distance measures
    have to be calculated in every iteration to compute the similarity to a centroid.
    Many variants to k-means have been proposed in order to improve performance. Especially
    in low dimensional Euclidean space, many similarity computations can be avoided,
    thus, significantly speeding up the algorithm. The Euclidean distance is given
    in [equation 6.1](#16_Chapter06.xhtml#eq6_1).


    | $d\\left( {X,Y} \\right) = \\sqrt{\\sum\\limits\_{i = 1}^{n}\\left( {x\_{i}
    - y\_{i}} \\right)^{- 2}}$ || (6.1) |


    | --- | --- |


    where


    |  *X* || \= (*x*[1], *x*[2], …, *x[n]*) |


    | --- | --- |


    |  *Y* || \= (*y*[1], *y*[2], …, *y[n]*) |


    *X* and *Y* are *n*\-dimensional feature vectors in ℝ^(*n*). The goal of clustering
    is usually expressed by an objective function. For instance, we can use the distance
    of the instances to each other or to the centroid. We then try to minimize the
    squared distance of each instance to its closest centroid. Using the Euclidean
    distance, we can calculate the sum of squared errors (SSE). In other words, the
    error is the squared Euclidean distance of each data point to the closest centroid.
    In two iterations of the k-means algorithm, the set of clusters which produce
    the smallest total sum of squared errors is preferred. Using the distance measure
    in [equation 6.1](#16_Chapter06.xhtml#eq6_1), we can calculate the sum of squared
    errors as:'
