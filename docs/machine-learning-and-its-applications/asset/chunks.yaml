    为了评估监督机器学习方案的学习效果如何，我们通常使用未用于过训练的标记数据。通常，我们将数据划分为三个数据集：一个用于训练，一个用于评估，一个用于测试学习器。训练集用于训练学习算法，验证集用于优化学习算法的参数，测试数据集则用于计算最终训练好的算法的真实错误率。每个数据集都需要相互独立，以便获得对错误率的可靠估计。数据集通常被随机划分为三部分。每个数据集都需要具有代表性，且任何特征都不应在某一个集合中被过度代表或代表不足。集合的比例取决于问题和可用数据量。通常使用最大比例用于训练，我们可能会使用如
    60:20:20 或 70:15:15 的比例。缺点是这减少了我们可用于训练的数据量。如果数据短缺，可以使用 `k`-折交叉验证等技术。将数据随机划分为 `k`
    个数据子集，使用 `k - 1` 个数据集进行训练，并将一个留出数据集作为验证集。重复此过程，直到 `k` 个子集都作为评估集使用过一次。


    学习器也需要进行评估，以便它可以与其他学习器进行比较。通常，会训练多个模型，我们希望使用最适合我们问题的学习方案。无论我们只训练一个学习算法还是训练多个，我们仍然需要评估结果的好坏。


    有很多不同的指标可以衡量预测器的性能，但并非所有指标都适用于所有学习器。某些适用于分类，而另一些可能适用于回归分析。


    评估学习器是一项重要任务，因为它能告诉我们训练好的模型在新数据上的表现将如何。事实上，改进的评估方法为机器学习和深度学习近期的成功做出了贡献。


    ### 5.1.1 准确率


    评估分类模型的一个指标是准确率。准确率简单是指模型分类正确的预测占比例。形式上，准确率定义为：


    | $Accuracy = \frac{Number\ of\ correct\ predictions}{Total\ number\ of\ predictions}$
    || (5.1) |

    | --- | --- |


    然而，准确率并不能说明问题。假设我们要将组织样本的医学图像分类为癌性组织和良性组织。假设我们有 100 个样本，其中 91 个是良性的，9 个是癌性的。如果分类器正确地确定了
    90 个组织样本为良性，1 个为癌性，使用 [公式 5.1]，我们得到的准确率为 $\frac{90 + 1}{100} = 0.91$。91% 是一个非常好的准确率，然而，9
    个癌性样本中只有 1 个被正确分类为恶性。尽管准确率很高，但大多数恶性样本未被诊断。换句话说，我们需要考虑误分类的数量。在数据集类别不平衡的情况下，准确率的表现特别糟糕，这意味着存在巨大的差异。准确率对待所有样本一视同仁。


    ### 5.1.2 精率和召回


    评估学习器是一项重要任务，因为它能告诉我们训练好的模型在新数据上的表现将如何。事实上，改进的评估方法为机器学习和深度学习近期的成功做出了贡献。


    （注：原文中存在大量重复内容，译文已根据核心逻辑进行翻译并整理。）

    '
