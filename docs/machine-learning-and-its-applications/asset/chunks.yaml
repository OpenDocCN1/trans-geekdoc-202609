- raw: '![Figure 4.15: An overfitted regression curve.](images/fig4_15.jpg)


    **[Figure 4.15:](#07_ListofFig.xhtml#fig4_15)** An overfitted regression curve.


    Linear regression is a basic approach used for predictive analysis. It is a linear
    approach for modelling the relationship between the dependent variable *y* and
    one or more explanatory or independent variables *x*. The linear [equation 4.14](#14_Chapter04.xhtml#eq4_14)


    | *y* = *a**x* + *b* || (4.14) |


    | --- | --- |


    where


    |  *x* || \= Independent Variable |


    | --- | --- |


    |  *y* || \= Dependent Variable |


    |  *a* || \= Slope |


    |  *b* || \= Intercept |


    is the simplest form of the regression equations with one dependent and one independent
    variable. *a* and *b* are the coefficients, also called regression coefficients
    or weights. Linear regression assumes a linear relationship between the input
    variable or variables *x* and the single output variable *y*. Using machine learning,
    the coefficients are learned from data. In other words, we try to find the best
    fit line for the given data points. A variable is called feature in machine learning.
    The dependent variable is called target, predictor or label in machine learning
    terms.


    [Figure 4.16](#14_Chapter04.xhtml#fig4_16) shows the regression line that has
    been fitted to the data.


    If the data cannot be fitted linearly, a polynomial or curved line might better
    fit and techniques such as polynomial or curvilinear regression might apply.


    The equation that describes how *y* relates to *x* is called regression model.
    It is given in [equation 4.14](#14_Chapter04.xhtml#eq4_14). It calculates the
    mean value of *y* for a known value of *x*. During training, the coefficients
    *a* and *b* are adjusted until a best fitting line is found, the regression line.
    This is achieved by minimizing the sum of the squared difference of the distance
    between the data points and the regression line.


    First, we need to determine, if there is a relationship between the dependent
    and the independent variables. For instance, we might want to determine if there
    is a relation between body weight and life expectation. If a relationship exists,
    we can predict the life expectation for new weights.


    ![Figure 4.16: Linear regression.](images/fig4_16.jpg)


    **[Figure 4.16:](#07_ListofFig.xhtml#fig4_16)** Linear regression.


    The most common method for fitting a linear regression line is the ordinary least
    squares method. This is also called ordinary least squares linear regression or
    just least squares regression. Ordinary least squares estimates the values of
    the coefficients by calculating the distance of each data point from the regression
    line, squaring it and adding all the squares together. Ordinary least squares
    tries to minimize the summed up squared errors. Variations on the ordinary least
    squares regression are lasso (least absolute shrinkage and selection operator)
    regression and ridge regression. Lasso regression also aims to minimize the sum
    of the squared error, but it also performs feature selection and minimizes the
    absolute sum of the coefficients (Lasso regularization). Ridge regression also
    minimizes the squared error, additionally in minimizes the squared absolute sum
    of the coefficients. Lasso and ridge regression are two popular regularization
    methods that can prevent overfitting.


    Simple linear regression


    In simple linear regression, also called bivariate regression, an observation
    consists of pairs of variables, one independent, *x*, and one dependent variable
    *y*. A straight line expresses the relationship between the two variables. The
    best fit for the regression line is expressed using the least square approach.
    The best fit line is the one where the prediction error or residual for each data
    point is as small as possible. The residual is the vertical distance between the
    observer data point and the regression line. If the prediction error is not squared,
    the positive and negative errors would cancel each other out.


    The relationship between *x* and *y* is expressed in [equation 4.15](#14_Chapter04.xhtml#eq4_15):


    | *y* = *a**x* + *b* + *ε* || (4.15) |


    | --- | --- |


    where


    |  *x* || \= Predictor Variable |


    | --- | --- |


    |  *y* || \= Dependent Variable |


    |  *a* || \= Slope |


    |  *b* || \= Intercept |


    |  *ε* || \= Error term |


    The error term *ε* or regression residual represents the fact that regression
    is an approximation and not perfectly precise. The error term is needed in order
    to correct for a prediction error between the observed and predicted value. It
    is also called residual, disturbance or remainder term and is created when the
    model does not fully represent the actual relationship between the independent
    variables and the dependent variables. It is the sum of the deviations with the
    regression line and it is an observable estimate.


    If the regression line slopes up we have a positive relationship, if it slopes
    down we have a negative relationship. A vertical regression line means there is
    no relationship between the variables. Some examples of possible relationships
    are hours of study and test mark, alcohol consumption and blood alcohol level
    or years of experience and income.


    Multiple linear regression


    Simple linear regression uses only one predictor variable to predict the factor
    of interest. In many real-world problems, more than one independent variable influences
    the prediction, so, usually more than one predictor is considered for regression
    analysis. If two or more independent variables exist, it is called multiple linear
    regression or multivariable linear regression. Multiple linear regression attempts
    to model the linear relationship between the the explanatory (independent) variables
    and the response (dependent) variable by fitting a linear equation to observed
    data points.


    Given *n* observations, the model can be defined as shown in [equation 4.16](#14_Chapter04.xhtml#eq4_16):


    | *y* = *β*[0] + *β*[1]*x*[1] + *β*[2]*x*[2] + … + *β*[*n*]*x*[*n*] + *ε* || (4.16)
    |


    | --- | --- |


    where


    |  *x* || \= Predictor Variable |


    | --- | --- |


    |  *y* || \= Dependent Variable |


    |  *β* || \= Regression coefficient |


    |  *n* || \= Number of observations |


    |  *ε* || \= Error term |


    Multiple linear regression assumes that:


    ▪  There is a linear relationship between the dependent variable and the independent
    variables


    ▪  The independent variables are not too highly correlated; absence of multicollinearity


    ▪  The regression residuals are normally distributed


    Since we have more than one independent variable *x*, we are fitting a hyperplane
    into a multidimensional space. If we have *n* independent predictor variables
    we try to fit a hyperplane into a *n* + 1-dimensional space. To find the best
    fitting hyperplane we can use the same method as for simple, linear regression
    and minimize the sum of squared residuals. However, with high dimensionality the
    calculations can become quickly complicated and optimized methods using linear
    algebra are employed to make the computation more efficient. Also, since regression
    analysis provides an estimation, we need to test the model for significance. ANOVA
    (Analysis of variance) is a set of statistical methods that can be used to test
    the significance of the parameters. However, these methods are described extensively
    in literature and are beyond the scope of this book.


    Some examples of relationships where more than one independent variable is used
    are estimating house price that depends on the location, the size of the house,
    its age etc., or life expectancy that depends on body weight, sporting activities,
    medical history etc.


    ### [4.2.2    Polynomial regression](#06_Contents.xhtml#sec4_2_2)'
