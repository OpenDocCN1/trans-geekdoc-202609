    Machine Learning (ML) is a sub-area of artificial intelligence, or AI. The central
    scientific goal of artificial intelligence is to understand the principles that
    make intelligent behavior possible in natural or artificial systems \[[31](#25_References.xhtml#ref31)\].
    Early artificial intelligence research showed a lot of interest in making computers
    reason and deduce facts \[[25](#25_References.xhtml#ref25)\]. In recent research,
    the focus of artificial intelligence has shifted towards designing and building
    agents that act intelligently. An agent can be a living object, such as a human
    or an animal, or it can be a robot, a sensor or a car. In artificial intelligence,
    we are interested in computational agents whose decisions can be explained. Artificial
    intelligence is founded on mathematics, logic, philosophy, probability theory,
    linguistics, neuroscience, and decision theory. It has many applications in computer
    vision, robotics, natural language processing (NLP) and machine learning.'
