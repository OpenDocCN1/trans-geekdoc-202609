    ![Figure 4.4: Perceptron.](img/fig4_4.jpg)


    **图 4.4:** 感知机。


    ![Figure 4.5: Activation functions.](img/fig4_5.jpg)


    **图 4.5:** 激活函数。


    | $f\\left( x \\right) = \hat{y} = \begin{cases} {1,} & {\\text{if~}w\_{0}x_{0}
    + w_{_{1}x_{1} + w_{_{2}x_{2} + b > 0} \\\\ {0,} & {\\text{if~}w\_{0}x_{0} + w_{_{1}x_{1}
    + w_{_{2}x_{2} + b \leq 0} \\\\ \\end{cases}$ || (4.2) |


    | --- | --- |


    输入节点在经过任何转换的情况下将信号传输到输出节点。输出节点对加权输入求和并加上偏置。偏置 `b` 是一个常数，作用类似于截距。它沿着 x 轴向左或向右移动激活函数。


    如方程 2.3 所示，输入信号与权重 `w` 和偏置 `b` 线性组合。正因如此，带有阶跃函数的感知机只能线性分类类别。将实例分为 -1 和 1 两个类的直线被称为决策边界。它是一个线性超平面。如果我们需要非线性分类，则需要多个感知机。


    权重在训练过程中使用方程 4.3 给出的权重更新公式进行学习。


    | `w`[*j*]^(*k* + 1) = `w`[*j*]^(*k*) + `λ`(`y`[*i*]−`ŷ`[*i*]^(*k*))*x`[*i**j*]
    || (4.3) |


    | --- | --- |


    其中


    |  `w^k` || \= `k^(th)` 次迭代后 `i^(th)` 输入的权重 |

    | --- | --- |


    |  `λ` || \= 学习率 |

    |  `ŷ`[*i*]^(*k*) || \= 预测输出 |

    |  `x[ij]` || \= 训练实例 `x[i]` 的 `j^(th)` 属性的值 |


    初始权重通常用随机值设置。预测误差计算为 (`y`−`ŷ``)。新权重是旧权重和预测误差的组合，如方程 4.3 所示。学习算法会进行所需的迭代，直到输出收敛，即感知机的输出正确地分类了训练实例。学习率
    `λ` 是 0 到 1 之间的一个值，控制每次迭代权重调整的幅度。如果学习步长太小（即 `λ` 接近 0），算法可能需要很长时间才能收敛；如果太大，则可能永远无法完全收敛。因此，某些实现也会训练期间调整学习率。


    ## 多层感知机


    多层感知机是一类前馈网络，由至少三层组成：输入层、一个或多个隐藏层和一个输出层，如图 4.2 所示。除了输入层外，这些层由具有非线性激活函数的感知机组成。前馈网络信号单向从输入层通过中间层传递到输出层，没有任何循环。这被称为正向传播。多层感知机可以分离非线性可的数据点。通常，多层感知机使用
    sigmoid 激活函数。同一神经网络中的所有神经元并不需要相同类型的激活函数。多层感知机中的典型激活函数包括 sigmoid 或逻辑激活函数（如方程 4.4
    所示，它也用于逻辑回归）以及双曲正切函数（如方程 4.5 所示）。


    | `y`[*i*]) = (1+`e`)^( − 1) || (4.4) |

    | --- | --- |


    其中


    |  `e` || \= 欧拉数 |

    | --- | --- |


    | `y`[*i*]` || \= `i*th` 节点的输出，`e` 是欧拉数。`x[i]` 是节点的输入，`e` 是输入加上偏置的加权和。 |


    | `y`[*i*]) = `tanh`(`x`[*i*]) || (4.5) |

    | --- | --- |


    双曲正切函数看起来与逻辑函数相似，但范围从 -1 到 1。如图 4.5 所示。带有激活函数 `f` 的感知机的输出由方程 4.6 给出。


    | `y`[*i*]) = `f`(`w*[1]*x*[1]+`w*[2]*x*[2]+…+`w`[*j*]*x`[*j*]+`b`) || (4.6) |

    | --- | --- |


    其中


    |  `y(x[i])` || \= `i*th` 感知机的输出 |

    | --- | --- |


    |  `w[j]` || \= `i*th` 神经元的 `j*th` 输入的权重 |

    |  `b` || \= 偏置 |


    神经网络的学习意味着学习权重。在训练期间，调整权重直到网络输出期望的结果。权重使用反反向传播机制进行调整，该机制将在 4.1.1 节中解释。


    根据前一层感知机的数量，感知机可以有一个或多个输入。多层感知机是全连接的，这意味着每个感知机都与下一层的所有感知机连接。多层感知机可以用于近似非常的问题，被称为通用函数近似器。由于存在更简单的模型（如支持向量机），且深度学习最近已成功应用于许多问题（包括物体识别、语音识别和机器翻译），多层感知机已不再那么流行。深度学习器与多层感知机并没有很大区别。它们也使用反向传播进行训练，但通常具有更多的层和非全连接的神经元。

    '
