    为了评估已训练模型的质量，我们需要评估预测结果与观测数据之间的匹配程度。换句话说，我们需要衡量拟合的质量。这种质量是通过使用损失函数或目标函数来衡量的。所有损失函数的目标都是衡量算法相对于给定数据集的优坏。损失函数量化了模型拟合数据的程度
    [14]，换句话说，它衡量的是拟合优度。在训练过程中，机器学习算法试图最小化损失函数，这个过程被称为损失最小化。我们正在最小化训练损失（或训练训练误差），它是所有训练样本的平均损失。损失函数计算了在分类问题中因不准确而所付出的代价（即损失）。因此，它也被称为代价函数。


    有很多不同的损失函数。我们已经在公式 2.8 中看过了平均绝对误差。另一种流行的损失函数是均方误差（MSE），因为它易于理解和实现。均方误差简单地取预测值与真实值之间的差，对其进行平方，并在整个数据集上取平均值。均方误差始终为正数，越接近零越好。均方误差的计算方法如公式
    2.9 所示。


    | $MSE = \\frac{1}{n}{\\sum\\limits\_{i = 1}^{n}\\left( {y\_{i} - f\left( x\_{i}
    \right)} \right)^{2}}$ || (2.9) |


    | --- | --- |

    | `y` || \= `n` 个预测值的向量 |

    | `n` || \= 预测值的数量 |

    | `f(x[i])` || \= 第 `i` 个观测值的预测 |


    其他流行的损失函数包括对角损失（hinge loss）或似然损失。似然损失函数也是一个相对简单的函数，通常用于分类问题。它只是将每个实例的预测概率相乘。不像均方误差那样容易解释，但对于比较模型很有用。如之前提到的，并不总是清楚应该使用哪种损失函数。这取决于问题和当前的数据集。例如，平方损失对大残差的惩罚比其他类型的损失函数大得多。此外，应该注意其他评估方法也适用于决策树等学习器。对于决策树，我们需要一种纯度度量，即类别之间的分离良好程度。可以使用吉尼不系数或信息增益熵。


    ## 偏差与方差


    偏差-方差权衡问题是监督学习中一个为人知的问题。它可以用来理解欠拟合和过拟合。高偏差的模型倾向于复杂度较低，但对数据欠拟合，并错过了数据中的重要信息。偏差是源于过于假设的误差。高方差的模型倾向于更敏感且对数据过拟合。它们很好地表示训练数据，但在训练数据之外的泛化能力差。它们倾向于捕捉噪声而非信号。理想情况下，偏差和方差都应该趋于零。偏差-方差权衡是指通常无法同时最小化两者。偏差和方差将在第
    9.1.1 节中详细解释。


    ### 2.6.1 随机梯度下降


    在训练期间，我们试图最小化损失函数。因此，我们需要确保学习向正确的“方向”，而不是变得更差。对于简单的损失函数，我们可以使用微积分来找到最小化损失函数的优化参数。然而，对于更复杂的损失函数，微积分可能不再可行。一种方法是通过使用函数的梯度来迭代优化目标函数。这种迭代优化过程被称为梯度下降，梯度告诉我们应该向哪个方向移动以减少损失函数。图
    2.9 显示了带有假设目标函数 `w²` 以及给出斜率的导数 `2*w` 的梯度下降。如果导数为正，它如图 2.9 所示向左侧倾斜；如果为负，它则向右侧倾斜。将导数的值乘以常数步长
    `η`（称为学习率），并从当前值中减去。一旦参数值的变化变得太小（在图 2.9 中趋于零时），过程停止。超参数 `η` 是步长，定义了我们向最小值移动的速度。


    梯度下降的问题在于是它很慢，因为每次迭代都必须经过所有训练实例（即批处理），这是昂贵的，特别是当训练集很大时。训练损失是所有训练数据的总和，这意味着算法必须通过所有训练实例才能移动一步。由于每次迭代都必须经过所有训练实例（批处理），梯度下降的问题是很慢。


    ![图 2.9: 梯度下降](img/fig2_9.jpg)


    **图 2.9:** 梯度下降。


    更有效的方法是随机梯度下降（SGD）。随机梯度下降解决了当训练数据集很大且包含大量特征时收敛缓慢的问题。此外，在在线设置中，批处理方法没有简单的添加数据的方法，因为每一步都使用整个集合。在随机梯度下降中，不是每次迭代都使用整个批次，而是使用单个实例（大小为
    1 的批次）来估计梯度。换句话说，我们使用单个实例的代价梯度，而不是整个批次的代价梯度。“随机”（stochastic）一词指的是每次迭代使用的单个实例是随机选择的。假设在有足够迭代的情况下，每次迭代使用单个实例可以估计平均梯度。每次迭代可能不如使用整个批次的迭代效果，但在实践中，对每个训练样本进行一次迭代的效果等同于对整个批次进行十次迭代。某些实现使用的不仅仅是单个实例。小批量（10
    到 1000 个实例）是单个实例和完整批次之间的折中。由于大批次通常带有噪声，使用单个实例或小批量的随机梯度下降收敛更快且可以减少方差。某些实现会在每次迭代调整步长。


    几点说明：选择步长 `η` 至关重要，因为它定义了算法收敛的速度。使用较大的 `η` 算法可能比使用较小的 `η` 收敛更快。然而，如果 `η` 设置得太大，存在越界且无法到达最小值的风险。如果步长太小且误差函数有多个最小值（人工神经网络损失函数的特征），如图
    2.10


    **图 2.10:** 梯度下降问题。

