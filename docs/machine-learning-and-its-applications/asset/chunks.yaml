  trans: '


    并不是图 2.6 中的所有数据点都由决策边界正确分开。某些点位于线的错误侧。这反映了机器学习算法通常返回的是近似值，而不是完美的分割。一个能够完美分离训练数据点的分类器在新数据上的表现通常并不良好。学习器需要进行泛化，以便处理训练数据以外的数据。否则，我们就会得到一个过拟合的学习器。


    ![图 2.5：激活函数。](img/fig2_5.jpg)


    **图 2.5：** 激活函数。


    ![图 2.6：线性与非线性拟合。](img/fig2_6.jpg)


    **图 2.6：** 线性与非线性拟合。


    图 2.6 中的平面只有两个维度。当特征多于一个时，需要超过两个维度的坐标系。这取决于输入向量以及所使用的学习器。为了更好的演示性，即使可能或需要更多维度，我们通常也只使用两个维度。


    ## 2.2 无监督学习 (#06_Contents.xhtml#sec2_2)


    在监督学习中，我们有输入数据和输出数据。在无监督学习中，我们没有标记的训练数据。换句话说，我们只有输入数据，没有输出数据，即没有 `y`。我们不是预测或近似变量，而是尝试将数据分为不同的类。例如，我们有一群网商店用户，试图将其分为不同类型的买家。这些类型可以是社交购物者、生活狂热者和疏离内向者。在这种情况下，我们有三个簇。如果一个观测点只能属于一个簇，它就是排他性类；如果允许属于多个簇，它就是非排他性类，换句话说，类是可以重叠的。


    令 `N` 为 `d` 维特征空间中的一组未标记实例 `D = x[1],x[2], …, x[N]`，在聚类中，`D` 被划分为若干个不交的子集 `D[j]`：


    | $D = \cup\_{j = 1}^{k}D\_{j}$ || (2.5) |


    | --- | --- |


    其中


    `D[i] ∩ D[j] = ∅`


    `i ≠ j`


    每个子集 `D[j]` 中的点根据给定的标准 ∅ 相互相似。相似性通常通过某些距离度量表示，例如欧几里德距离或曼哈顿距离。


    聚类分析可以通过根据相似性将数据集分为若干类，从而理解其底层结构。将相似的对象归为具有概念意义的类有许多应用。例如，我们将动物分为类，如啮齿类、犬科动物、猫科动物、反刍、有袋动物等。聚类还用于信息检索，例如将搜索结果分为新闻、社交媒体、论坛、营销等。每个类别可以进一步分为子类别。例如，新闻分为政治、经济等。这种过程被称为层次聚类。人类甚至儿童擅长将对象归入相应的类。这对于人类理解周围的世界至关重要。聚类还可以作为离群值检测的中间步骤。


    ### 2.2.1 k-means 聚类 (#06_Contents.xhtml#sec2_2)


    k-means 聚类是最流行的机器学习算法之一。k-means 聚类属于基于质心的类。质心本身不需要是一个观测点。图 2.7 显示了具有 3 个簇的 k-means
    聚类。在这里，聚类的标准是距离。在基于质心的聚类中，`n` 个观测值被分为 `k` 个簇。


    在 k-means 聚类中，需要预定义簇的数量 `k`，这有时是一个问题，因为可能未知。例如，在生物学中，如果我们根据特征对植物进行分类，可能不知道有多少种植物。其他的聚类方法（如层次聚类）不需要假设簇的数量。此外，没有绝对的标准；必须由用户定义以便聚类结果符合分析任务的目标。质心也称为重心。质心是几何平面的几何中心。


    **图 2.7：** k-means 聚类。


    人类和动物主要通过经验学习，而不是从标记数据学习。人类通过观察发现世界，而不是被告知每个物体的标签。因此，人类学习很大程度上是无监督的。这就是为什么一些作者认为无监督学习未来将比监督学习更重要
    [18]。


    ## 2.3 半监督学习 (#06_Contents.xhtml#sec2_3)


    半监督学习结合了标记和未标记数据。它通常用于具有少量标记数据和大量未标记数据的情况。由于半监督学习仍然需要标记数据，因此它可以被认为是监督学习的一个子集。然而，除了分类之外，其他的部分监督形式也是可能的。


    '
