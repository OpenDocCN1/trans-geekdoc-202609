    **[Figure 4.15:](#07_ListofFig.xhtml#fig4_15)** An overfitted regression curve.


    Linear regression is a basic approach used for predictive analysis. It is a linear
    approach for modelling the relationship between the dependent variable `y` and
    one or more explanatory or independent variables `x`. The linear [equation 4.14](#14_Chapter04.xhtml#eq4_14)


    | `y`  = `a`*x`  + `b` || (4.14) |

    | --- | --- |


    where


    |  `x` || \= Independent Variable |

    | --- | --- |

    |  `y` || \= Dependent Variable |

    |  `a` || \= Slope |

    |  `b` || \= Intercept |


    is the simplest form of the regression equations with one dependent and one independent
    variable. `a` and `b` are the coefficients, also called regression coefficients
    or weights. Linear regression assumes a linear relationship between the input
    variable or variables `x` and the single output variable `y`. Using machine learning,
    the coefficients are learned from data. In other words, we try to find the best
    fit line for the given data points. A variable is called feature in machine learning.
    The dependent variable is called target, predictor or label in machine learning
    terms.


    [Figure 4.16](#14_Chapter04.xhtml#fig4_16) shows the regression line that has
    been fitted to the data.


    If the data cannot be fitted linearly, a polynomial or curved line might better
    fit and techniques such as polynomial or curvilinear regression might apply.


    The equation that describes how `y` relates to `x` is called regression model.
    It is given in [equation 4.14](#14_Chapter04.xhtml#eq4_14). It calculates the
    mean value of `y` for a known value of `x`. During training, the coefficients
    `a` and `b` are adjusted until a best fitting line is found, the regression line.
    This is achieved by minimizing the sum of the squared difference of the distance
    between the data points and the regression line.


    First, we need to determine, if there is a relationship between the dependent
    and the independent variables. For instance, we might want to determine if there
    is a relation between body weight and life expectation. If a relationship exists,
    we can predict the life expectation for new weights.


    ![Figure 4.16: Linear regression.](images/fig4_16.jpg)


    **[Figure 4.16:](#07_ListofFig.xhtml#fig4_16)** Linear regression.


    The most common method for fitting a linear regression line is the ordinary least
    squares method. This is also called ordinary least squares linear regression or
    just least squares regression. Ordinary least squares estimates the values of
    the coefficients by calculating the distance of each data point from the regression
    line, squaring it and adding all the squares together. Ordinary least squares
    tries to minimize the summed up squared errors. Variations on the ordinary least
    squares regression are lasso (least absolute shrinkage and selection operator)
    regression and ridge regression. Lasso regression also aims to minimize the sum
    of the squared error, but it also performs feature selection. Ridge regression
    also aims to minimize the sum of the squared error.


    #### Simple regression


    In simple regression, also called bivariate regression, it consists of pairs,
    one independent `x`, and one dependent variable `y`. A straight line is the prediction.
    The best fit is the one where the prediction error is as small as possible.


    The relationship between `x` and `y` is expressed in [equation 4.15](#14_Chapter04.xhtml#eq4_15):


    | `y`  = `a`*x`  + `b` || (15) |

    | --- | --- |


    where


    |  `x` || \= Independent Variable |

    | --- | --- |

    |  `y` || \= Dependent Variable |

    |  `a` || \= Slope |

    |  `b` || \= Intercept |

    |  `ε` || \= Error term |


    The error term `ε` represents the fact that regression is not perfectly precise.
    The regression line is the sum of deviations. If the regression line slopes up
    we have a positive relationship, if it slopes down we have a negative relationship.
    Some examples are hours of study and test mark, or alcohol consumption and blood
    level.


    #### Multiple regression


    Simple linear regression uses only one predictor. In many real-world problems,
    more than one independent variable exists, so it is called multiple regression
    or multivariable regression. Multiple regression attempts to model the relationship
    between the explanatory (independent) variables and the response (dependent) variable
    by fitting a linear equation to data points.


    Given `n` observations, the model can be defined as shown in [equation 4.16](#14_Chapter04.xhtml#eq4_16):


    | `y`  = `β[0]` + `β[1]`x[1]` + `β[2]`x[2]` +… `β[n]`x[n]` + `ε` || (16) |

    | --- | --- |


    where


    |  `x` || \= Predictor Variable |

    | --- | --- |

    |  `y` || \= Dependent Variable |

    |  `β` || \= Regression coefficient |

    |  `n` || \= Number of observations |

    |  `ε` || \= Error term |


    Multiple regression assumes that:


    - There is a linear relationship between the dependent variable and the independent
    variables

    - The independent variables are not too correlated; absence of multicollinearity

    - The regression residuals are normally distributed


    Since we have more than one independent variable `x`, we are fitting a hyperplane
    into a multidimensional space. If we have `n` independent predictor variables
    we try to fit a hyperplane into a `n` + 1-dimensional space. To find the best
    fitting hyperplane we can use the same method as for simple, linear regression
    and minimize the sum of squared residuals. Some examples where more than one independent
    variable is used are estimating house price that depends on the location, the
    size of the house, its age etc.


