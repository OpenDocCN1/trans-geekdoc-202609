    $\begin{array}{lll} {w^{T}x + b \geq 0} & {for} & {d_{i} = + 1} \\ {w^{T}x + b
    < 0} & {for} & {d_{i} = - 1} \\ \end{array}$


    其中


    |  `d` ||= 分离间隔 (Margin of separation) |

    | --- | --- |


    间隔 `d` 是超平面与最近数据点之间的距离。最大间隔即为最优超平面。在现实世界中，数据通常带有噪声，无法通过超平面进行完美分离。因此，最大间隔规则通过引入称为松弛变量（slack
    variables）的额外系数被放宽。这允许某些数据点落在超平面的错误侧。这被称为软间隔分类器（soft margin classifier）。然而，引入新系数增加了复杂性并需要更多的计算能力。


    正如我们之前所看到的，数据往往不是线性可分的。图 4.11 中左侧图中的数据点无法用直线分隔。为了解决这个问题，我们可以使用核技巧（kernel trick）。我们使用函数
    `φ` 将数据映射到不同的空间。为了实现这一点，我们不使用数据点本身，而是使用任意两个数据点的内积。使用 `φ` 而不是计算点积 `x[i]`·`x[j]`，我们必须计算
    `φ(x[i])·φ(x[j])`，其中 `x[i]` 和 `x[j]` 是两个特征向量。这在计算上是非常昂贵的。使用核函数 `K`，使得 `K(x[i],
    x[j]) = φ(x[i])·φ(x[j])`，我们不需要计算甚至不需要 `φ`。换句话说，核函数定义了变换空间中的内积。


    ![图 4.11: 核技巧。](img/fig4_11.jpg)


    **图 4.11:** 核技巧。


    核定义了变换空间中新数据点与支持向量之间的相似性。点积是相似性的度量。核函数泛化了“内积相似性”的概念。


    核有许多不同类型。多项式核和径向核（radial kernels）将输入空间转换为更高维。多项式核不需要点积。多项式核可以写为：


    | `K(x,x[i])` = `(x·x[i]+1)^(p)` || (4.12) |

    | --- | --- |


    |  `p` ||= 先验定义 |

    | --- | --- |


    幂 `p` 需要用户定义。如果 `p = 1`，则为线性核。多项式核允许输入空间中存在弯曲超平面。


    径向核可以写为：


    | $K\left( {x,x_{i}} \right) = exp\left( {- \frac{\\left\| {x - x_{i}} \right|^{2}}{2\sigma^{2}}}
    \right)$ || (4.13) |

    | --- | --- |


    |  `σ[2]` ||= 先定义的宽度 |

    | --- | --- |


    这是一个径向基函数（radial basis function）。径向基函数的输出完全取决于输入与原点的距离。宽度 `σ` 通常在 0 到 1 之间，可以被认为是决策区域的扩散程度。径向核可以在特征空间内创建复杂的区域。径向基函数偶尔也用作神经网络中的激活函数。


    学习支持向量机是一个优化问题。我们可以使用随机梯度下降来搜索超平面的系数。然而，还有更高效的方法，例如序列最小优化法（sequential minimal
    optimization method）。支持向量机得到了广泛研究，有很多关于该主题的论文和书籍。在这里我们只能涵盖基本概念。


    支持向量机有很多应用。由于其多功能性且通常更简单，它们的超参数较少，并且通常优于神经网络。它们被广泛应用于生物和其他科学的分类任务。它们也被应用于文本分类、图像分类和手写识别。核不仅可以定义在向量上，还可以定义在树、字符串等。尽管即使是最快的支持向量机的训练时间也可能非常缓慢，但由于其建模复杂非线性决策边界的能力，它们非常准确
    [10]。人工神经网络相对于支持向量机的一个明显优势是，人工神经网络可以任意数量的输出，而支持向量机只有一个。然而，支持向量机和神经网络都是黑箱，不如决策树等那样直观理解。


    ### 4.1.5 k-近邻


    k-近邻（k-NN）是一种广泛使用的分类技术，也可以用于回归。它被广泛使用是因为输出可以很容易解释，且需要的计算时间短。k-近邻属于懒学习者（lazy learners）一类。与支持向量机或决策树等急进学习者相反，学习并不在训练实例出现时立即发生，而是在新实例出现后才发生。急进学习创建一个模型。懒学习者（如
    k-近邻）将学习推迟到看到新实例。这是基于实例的学习（instance-based learning），需要部署测试实例。基于实例的学习也称为基于内存的学习，因为训练实例被存储在内存中。k-近邻是最简单的机器学习算法之一。如果用于分类，输出是类别成员身份，即离散值。如果用于回归，输出是对象的数值，即连续值。k-近邻利用特征相似性来确定训练与新实例之间的距离。有时会使用多个邻居并取距离的平均值。此时被称为
    k-邻居，其中 `k` 是邻居的数量。在图 4.12 的左象限中，`k = 3`，星形实例属于灰色类别。在右象限，如果 `k = 3`，新实例也属于灰色类别，因为
    3 个邻居中有 2 个是灰色，只有一个属于深灰色类别。如果 `k = 5`，新实例属于深灰色类别，因为最近的实例中有 3 个是深灰色。因此，选择参数 `k`
    对于该算法至关重要。


    基于实例的学习者的复杂度随训练数据而增加。训练实例越多，需要的计算能力越大。基于实例的学习者的一个优势是能够适应新数据。它们只需存储新的训练实例，而不需要重新训练模型。


    '
