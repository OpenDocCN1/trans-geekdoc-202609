    **[Figure 4.4:](#07_ListofFig.xhtml#fig4_4)** Perceptron.


    ![Figure 4.5: Activation functions.](images/fig4_5.jpg)


    **[Figure 4.5:](#07_ListofFig.xhtml#fig4_5)** Activation functions.


    | $f\\left( x \\right) = \\hat{y} = \\begin{cases} {1,} & {\\text{if~}w\_{0}x\_{0}
    + w\_{1}x\_{1} + w\_{2}x\_{2} + b > 0} \\\\ {0,} & {\\text{if~}w\_{0}x\_{0} +
    w\_{1}x\_{1} + w\_{2}x\_{2} + b \\leq 0} \\\\ \\end{cases}$ || (4.2) |


    | --- | --- |


    The input node transmits the signal to the output node without any transformation.
    The output node sums up the weighted inputs and adds the bias. The bias *b* is
    a constant and works similar to the intercept. It shifts the activation function
    along the x-axis to the left or the right.


    As shown in [equation 2.3](#11_Chapter02.xhtml#eq2_3), the input signals are linearly
    combined with the weights *w* and the bias *b*. Because of this, a perceptron
    with a step function can only linearly separate classes. The line that separates
    the instances into classes −1 and 1 is called a decision boundary. It is a linear
    hyperplane. If we need non-linear separation, more than one perceptrons is needed.


    The weights are learned during training using a weight update formula given in
    [equation 4.3](#14_Chapter04.xhtml#eq4_3).


    | *w*[*j*]^(*k* + 1) = *w*[*j*]^(*k*) + *λ*(*y*[*i*]−*ŷ*[*i*]^(*k*))*x*[*i**j*]
    || (4.3) |


    | --- | --- |


    where


    |  *w^k* || \= Weight for *i^(th)* input after *k^(th)* iteration |


    | --- | --- |


    |  *λ* || \= Learning rate |


    |  *ŷ*[*i*]^(*k*) || \= Predicted output |


    |  *x[ij]* || \= Value of *j^(th)* attribute of training instance *x[i]* |


    The initial weights are usually set with random values. The prediction error is
    calculated as (*y*−*ŷ*). The new weight is a combination of the old weight and
    the prediction error as shown in [equation 4.3](#14_Chapter04.xhtml#eq4_3). The
    learning algorithm goes through as many iterations as needed until the output
    is converging, i.e., the output of the perceptron correctly classifies the training
    instances. The learning rate *λ* is a value between 0 and 1 and controls the amount
    of weight adjustment per iteration. If the learning steps are too small, i.e.,
    *λ* is close to 0, the algorithm might take a long time to converge, if it is
    too large it might never fully converge. Therefore, some implementations also
    adjust the learning rate during training too.


    Multilayer Perceptron


    Multilayer perceptrons are a class of feedforward networks that consist of at
    least three layers: An input layer, one or more hidden middle layers and an output
    layer, as shown in [Figure 4.2](#14_Chapter04.xhtml#fig4_2). Except for the input
    layer, the layers consist of perceptrons with nonlinear activation functions.
    Feedforward networks pass the signal in one direction from the input layer through
    the middle layer(s) to the output layer without any cycles. This is called forward
    propagation. The multilayer perceptron can separate data points that are not linearly
    separable. Typically, a multilayer perceptron uses a sigmoid activation function.
    Not all neurons within the same neural network need to have the same type of activation
    function. Typical activation functions in a multilayer perceptron include the
    sigmoid or logistic activation function, shown in [equation 4.4](#14_Chapter04.xhtml#eq4_4),
    that is also used in logistic regression, and the hyperbolic tangent, shown in
    [equation 4.5](#14_Chapter04.xhtml#eq4_5).


    | *y*(*x*[*i*]) = (1+*e*^( − *x*[*i*]))^( − 1) || (4.4) |


    | --- | --- |


    where


    |  *e* || \= Euler’s number |


    | --- | --- |


    where *y[i]* is the output of the *i*th node and *e* is Euler’s number, after
    the Swiss mathematician Leonhard Euler. *x[i]* is the input to the node and is
    the weighted sum of the input signals plus the bias. The sigmoid function is called
    after its S-shaped form and ranges from 0 to 1, but never reaches 0 or 1 as *x*
    → ±*∞*.


    | *y*(*x*[*i*]) = tanh (*x*[*i*]) || (4.5) |


    | --- | --- |


    The hyperbolic tangent function looks similar to the logistic function with its
    sigmoid shape, but ranges from −1 to 1. It is shown in [Figure 4.5](#14_Chapter04.xhtml#fig4_5).
    The activation functions linearly combine the input signals with weights then
    sum them up and add the bias.


    The output of a perceptron with activation function *f* is given in [equation
    4.6](#14_Chapter04.xhtml#eq4_6).


    | *y*(*x*[*i*]) = *f*(*w*[1]*x*[1]+*w*[2]*x*[2]+…+*w*[*j*]*x*[*j*]+*b*) || (4.6)
    |


    | --- | --- |


    where


    |  *y*(*x[i]*) || \= Output of *i*th perceptron |


    | --- | --- |


    |  *w[j]* || \= Weight of the *j*th input of the *i*th neuron |


    |  *b* || \= Bias |


    Learning in the neural network means learning the weights. During training, the
    weights are adjusted until the network outputs the desired results. The weights
    are adjusted using a mechanism called backpropagation that will be explained in
    [section 4.1.1](#14_Chapter04.xhtml#sec4_1_1).


    A perceptron can have one or more inputs depending on the number of perceptrons
    in the preceding layer. Multilayer perceptrons are fully connected, meaning that
    every perceptron is connected with all perceptrons of the next layer.


    Multilayer perceptrons can be used to approximate very complex problems and are
    also called universal function approximators. Multilayer perceptrons have become
    less popular since there are much simpler models, such as support vector machines,
    and deep learners have recently been successfully applied for many problems, including
    object recognition, speech recognition and machine translation. Deep learners
    are not very different from multilayer perceptrons. They also use backpropagation
    for training but they typically have many more layers and neurons that are not
    fully connected.


    ![Figure 4.6: Hyperbolic tangent.](images/fig4_6.jpg)


    **[Figure 4.6:](#07_ListofFig.xhtml#fig4_6)** Hyperbolic tangent.


    Backpropagation'
