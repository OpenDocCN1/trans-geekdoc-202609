- raw: 'If we try to classify the data into categories, e.g., medical images into
    healthy or pathologic tissue, we have a classification problem. Classification
    has discrete outputs such as “true” or “false” or “0” or “1”. If there are just
    two categories, it is a binary classification problem. Often, the outputs are
    probabilities, e.g., a mail is spam with 80 percent probability. In other words,
    the dichotomy of the output is not imperative.


    If there are more categories, e.g., restaurant reviews using a Likert scale, as
    shown in [Figure 2.2](#11_Chapter02.xhtml#fig2_2), it is a multiclass classification
    problem.


    ![Figure 2.2: Likert scale.](images/fig2_2.jpg)


    **[Figure 2.2:](#07_ListofFig.xhtml#fig2_2)** Likert scale.


    If we have a binary classification problem, we are looking for a function *f*
    that will classify an input *x*, e.g., movie reviews, into “positive” and “negative”
    reviews, as represented by [equation 2.1](#11_Chapter02.xhtml#eq2_1).


    | *x*→*f*→*y*∈{+1,−1} || (2.1) |


    | --- | --- |


    where


    |  *x* || \= Movie review |


    | --- | --- |


    |  *y* || \= +1 ≡ positive; −1 ≡ negative |


    Technically, if the labels are +1 and −1 it could be considered a regression problem.
    If we have a multiclass classification problem, *y* is a category. For instance,
    predicting tomorrows weather is a multiclass classification problem where the
    categories could be “sunny”, “rainy”, “foggy”, etc. If we want to predict how
    much it is going to rain tomorrow, we have a regression problem. Regression has
    continuous outputs.


    Other prediction tasks include ranking and structured predictions. For instance,
    predicting who is going to win the marathon, who is going to be second and third,
    etc., as represented in [equation 2.2](#11_Chapter02.xhtml#eq2_2), is a ranking
    problem and *y* is a permutation.


    | 1,2,3,4→*f*→3,4,1,2 || (2.2) |


    | --- | --- |


    Structured predictions predict structured objects rather than real or discrete
    values. In structured predictions, the output is built from parts, such as a translation,
    where the output, the translation into another language, is built from words in
    the target language. Structured predictions have a wide variety of applications
    in natural language processing (NLP), speech recognition and computer vision,
    to name a few.


    ### [2.1.1    Perceptron](#06_Contents.xhtml#sec2_1_1)


    The perceptron is a simple neural network, proposed in 1958 by Rosenblatt, which
    became a landmark in early machine learning history \[[10](#25_References.xhtml#ref10)\].
    It is one of the oldest machine learning algorithms. The perceptron consists of
    a single neuron and is a binary classifier that can linearly separate an input
    *x*, a real valued vector, into a single, binary output. It is an online learning
    algorithm. Online learning means it processes one input at a time. The data is
    presented in a sequential order and updates the predictor at each step using the
    best predictor. The perceptron is modeled after a neuron in the brain and is the
    basic element of a neural network.


    ![Figure 2.3: Perceptron.](images/fig2_3.jpg)


    **[Figure 2.3:](#07_ListofFig.xhtml#fig2_3)** Perceptron.


    There are different types of perceptrons. They can have one or more input and
    output links. The input links correspond to the dendrites of a real neuron, the
    output links to the synapses. Also, there are different types of activation functions.
    The perceptron shown in [Figure 2.3](#11_Chapter02.xhtml#fig2_3) consists of three
    weighted input links, a sum function, a step activation function and one output
    link.


    A perceptron performs three processing steps:


    1.  Each input signal *x* is multiplied by a weight *w*: *w[i]x[i]*


    2.  All signals are summed up


    3.  The summed up inputs are fed to an activation function


    The output is calculated using the output function *f*(*x*), as defined by [equation
    2.3](#11_Chapter02.xhtml#eq2_3).


    | $f\\left( x \\right) = {\\sum\\limits\_{i = 1}{w\_{i}x\_{i} + b}}$ || (2.3)
    |


    | --- | --- |


    where


    |  *w* || \= Weight |


    | --- | --- |


    |  *x* || \= Input |


    |  *b* || \= Bias |


    A few remarks: Each input signal has its own weight that is adjusted individually.
    During training, the weights are adjusted until the desired result is obtained.
    Usually, the initial weights are all zero or assigned random numbers, usually
    between 0 and 1. After each learning iteration, the error at the output is calculated.
    The weights are adjusted based on the calculated error, in such a way that the
    next result is closer to the desired result.


    The scaled up or down inputs are summed up to a single value. The summed up value
    is assigned an offset, called bias *b*. The perceptron also adjusts the bias during
    training. The bias shifts the activation curve to the left or right. However,
    the bias does not depend on any input.


    The summed up input values are passed to an activation function. In it’s most
    basic form, the activation function returns 1 if the input is positive, and 0,
    if it is negative, see [equation 2.4](#11_Chapter02.xhtml#eq2_4). If 1 is returned,
    the perceptron is said to fire.


    | $f\\left( x \\right) = \\begin{cases} 1 & {\\text{if~}wx + b > 0} \\\\ 0 & \\text{otherwise}
    \\\\ \\end{cases}$ || (2.4) |


    | --- | --- |


    The perceptron only returns 0 or 1. In other words, it is a binary classifier.
    It can only linearly separate a set of data points. A data point can be considered
    a point in a two dimensional plain. The input vector represents the coordinates
    of a point. The perceptron separates the data points into two sets using a line,
    the decision boundary, as shown in the left Cartesian coordinate system in [Figure
    2.4](#11_Chapter02.xhtml#fig2_4). We can separate, for instance, medical images
    of tissue into a set of images with normal and a set of images with pathologic
    tissue. However, not all binary classification problems are linearly separable.
    The points in the right coordinate system in [Figure 2.4](#11_Chapter02.xhtml#fig2_4)
    cannot be separated linearly. Other machine learning algorithms, such as a multilayer
    perceptron or support vector machines, are capable of nonlinearly separating data
    points.


    During training, the perceptron learns where to position the separation line.
    There can be an infinite number of possible decision boundaries, as shown in [Figure
    2.6](#11_Chapter02.xhtml#fig2_6) on the left. The perceptron cannot distinguish
    between different separation lines. A class of machine learning algorithms called
    margin classifiers also consider the distance between the data points and the
    decision boundary. Support vector machines fall into this category. This class
    of machine learning schemes tends to generalize better on new, unseen data.


    ![Figure 2.4: Linearly separable and inseparable data points.](images/fig2_4.jpg)


    **[Figure 2.4:](#07_ListofFig.xhtml#fig2_4)** Linearly separable and inseparable
    data points.


    A perceptron can have different types of activation functions. An activation function
    defines the output of the perceptron. Its simplest form is a step function, where
    the perceptron either fires or not. If the neural network is required to separate
    beyond linear separation, several perceptrons are required. An activation function
    can have a curved form, as shown in [Figure 2.5](#11_Chapter02.xhtml#fig2_5) on
    the right side. This type of activation function is called a sigmoid activation
    function and is capable of firing with different rates. As the input increases,
    it fires at an increasing rate. We will see other types of activation functions
    such as rectifiers often used for deep learners in later chapters.'
