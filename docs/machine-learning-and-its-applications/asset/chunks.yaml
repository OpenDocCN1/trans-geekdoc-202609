- raw: 'Machine learning is sometimes criticised as just being glorified statistics.
    Whereas it is true that machine learning uses a lot of statistics, machine learning
    also uses other concepts, such as data mining or neuro-computing, and is, as such,
    a subarea of computer science. Statistics is a subarea of mathematics. Both, machine
    learning and statistical learning are methods that learn from data. However, machine
    learning is an algorithm that learns from data without the need to be programmed
    by a developer. Statistical learning is a mathematical formalization of relationships
    between variables in the form of equations.


    ## [1.6    Data post-processing](#06_Contents.xhtml#sec1_6)


    Data post-processing includes data visualization (knowledge visualization), typically
    using a dashboard, reporting or dissemination of a result. A result is a useful
    or interesting pattern found during data mining. Data mining may generate thousands
    of patterns, not all of which are interesting. A pattern is interesting if it
    can easily be understood, if it is potentially useful, if it has been validated
    on new, unseen data or if it validates some hypothesis that you wanted to confirm.
    For instance, a model trained for predictive maintenance to detect a machine failure
    before it occurs should detect certain conditions, such as material fatigue or
    abrasion. It should be clear why a model predicts a machine failure and it should
    have been validated on test data.


    It should be noted that these data mining steps are not comprehensive. Also, the
    steps do not need to be in the described order. Data cleansing can happen during
    data pre-processing, but it can also be necessary as a post-processing step in
    order to be able to interpret the result more easily or to increase readability
    before visualization. Also, supervised and unspuervised methods are not mutually
    exclusive. For instance, clustering can be used as preliminary step for a supervised
    learning task, for instance, to reduce the amount of data clustering can be used
    for data compression. It can also be used as a post-processing step, for instance,
    for data summarization.


    # [Chapter 2](#06_Contents.xhtml#ch2)


    # [Machine Learning Basics](#06_Contents.xhtml#ch2)


    **CONTENTS**


    [2.1    Supervised learning](#11_Chapter02.xhtml#sec2_1)


    [2.1.1    Perceptron](#11_Chapter02.xhtml#sec2_1_1)


    [2.2    Unsupervised learning](#11_Chapter02.xhtml#sec2_2)


    [2.2.1    k-means clustering](#11_Chapter02.xhtml#sec2_2_1)


    [2.3    Semi-supervised learning](#11_Chapter02.xhtml#sec2_3)


    [2.4    Function approximation](#11_Chapter02.xhtml#sec2_4)


    [2.5    Generative and discriminative models](#11_Chapter02.xhtml#sec2_5)


    [2.6    Evaluation of learner Bias and variance](#11_Chapter02.xhtml#sec2_6)


    [2.6.1    Stochastic gradient descent](#11_Chapter02.xhtml#sec2_6_1)


    [2.6.2    Cluster evaluation](#11_Chapter02.xhtml#sec2_6_2)


    Machine learning is one of many subfields of artificial intelligence or AI. Machine
    learning algorithms automatically build models that can identify useful patterns
    in data and make predictions without being explicitly programmed. Machine learning
    can be roughly divided into supervised, semi-supervised and unsupervised methods.
    Supervised methods are used for classification and regression, whereas unsupervised
    methods are used for clustering. Reinforcement learning is concerned with how
    agents act in an environment by maximizing some notion of reward. [Figure 2.1](#11_Chapter02.xhtml#fig2_1)
    shows the subareas of machine learning and summarizes the tasks. However, in literature,
    other classifications of machine learning methods can be found.


    ![Figure 2.1: Machine learning areas.](images/fig2_1.jpg)


    **[Figure 2.1:](#07_ListofFig.xhtml#fig2_1)** Machine learning areas.


    Machine learning tries to imitate human learning on a computer. Human learning
    is mostly based on experience, machine learning is based on data. Data is the
    starting point of a machine learning project and is used to train and test a model.
    For supervised methods, labelled data has to be present. Labeled data is data
    with correctly assigned tags. The labeled data is used for training and evaluating
    the accuracy of the learner. For instance, a learner that is supposed to do handwriting
    recognition needs a training data set with handwritten letters and their associated
    blockletters. The algorithm will then learn the relationship between the handwritten
    letters and the print letters and create a mapping between them. Unsupervised
    learners do not use labeled data, which makes evaluating a trained cluster algorithm
    more challenging.


    Typical supervised methods include:


    ▪  Naïve Bayes


    ▪  Decision trees


    ▪  Neural networks (Multilayer perceptron)


    ▪  Linear regression


    ▪  Logistic regression


    ▪  Support vector machines


    ▪  k-nearest neighbor


    Typical unsupervised methods include:


    ▪  k-means clustering


    ▪  Hierarchical clustering


    ▪  Principal component analysis (PCA)


    The classification is not exclusive, since some learning schemes can be used for
    supervised and unsupervised tasks. For instance, artificial neural networks can
    be used in a supervised as well as in an unsupervised setting.


    ## [2.1    Supervised learning](#06_Contents.xhtml#sec2_1)


    Supervised learning needs labeled data for training. A training example is called
    a data point or instance and consists of an input and output pair (*x, y*). *y*
    is the output or ground truth for input *x*. Contrary to supervised learning,
    in unsupervised learning, the data only provides inputs. A multiset of training
    examples forms the training data set. The training data set is also called gold
    standard data and is as close to the ground truth as possible. The training set
    is used to produce a predictor function *f*, also called decision function, that
    maps inputs *x* to *y* = *f*(*x*). The goal is to produce a predictor *f* that
    works with examples other than the training examples. In other words, *f* needs
    to generalize beyond the training data and provide accurate predictions on new,
    unseen data. *f* provides an approximation on unseen data. The input *x* is a
    feature vector or covariates, the output *y* is the response. A feature vector
    *ϕ*(*x*) is a map of feature names to feature values, i.e., strings to doubles.
    A feature vector *ϕ*(*x*) ∈ ℝ is a real vector *ϕ*(*x*) = \[*ϕ*[1](*x*), *ϕ*[2](*x*),
    … *ϕ[n]*(*x*)\], where each component *ϕ[i]*(*x*) with *i* = 1, … *n* represents
    a feature. The feature vector is computed by the feature extractor *ϕ* and can
    be thought of as a point in a high-dimensional feature space. A feature in a feature
    vector can be weighted, which means, not every feature necessarily contributes
    equally to a prediction. A weight is a real number that is multiplied with the
    feature value. The weights are represented in a separate weight vector because
    we want one single predictor that works on any input. Given a feature vector *ϕ*(*x*)
    and a weight vector *w*, we calculate the prediction score as the inner product
    of the vectors *w* · *ϕ*(*x*). We do not know the weights in vector *w* beforehand,
    they are learned during training.


    To predict, for instance, if a news article is about politics or sports, we need
    to find out what properties of input *x* might be relevant to predict if the article
    belongs to the category “politics” or “sports”. This process is called feature
    extraction. There are machine learning techniques where no function is generated.
    For example, decision tree induction creates a decision tree, as the name suggests,
    usually represented as a dendrogram and not a function. To begin with, we will
    start with a function and explain other techniques in later chapters.'
  fmt: '

    Machine learning is sometimes criticised as just being glorified statistics. Whereas
    it is true that machine learning uses a lot of statistics, machine learning also
    uses other concepts, such as data mining or neuro-computing, and is, as such,
    a subarea of computer science. Statistics is a subarea of mathematics. Both, machine
    learning and statistical learning are methods that learn from data. However, machine
    learning is an algorithm that learns from data without the need to be programmed
    by a developer. Statistical learning is a mathematical formalization of relationships
    between variables in the form of equations.


    ## 1.6 Data post-processing


    Data post-processing includes data visualization (knowledge visualization), typically
    using a dashboard, reporting or dissemination of a result. A result is a useful
    or interesting pattern found during data mining. Data mining may generate thousands
    of patterns, not all of which are interesting. A pattern is interesting if it
    can easily be understood, if it is potentially useful, if it has been validated
    on new, unseen data or if it validates some hypothesis that you wanted to confirm.
    For instance, a model trained for predictive maintenance to detect a machine failure
    before it occurs should detect certain conditions, such as material fatigue or
    abrasion. It should be clear why a model predicts a machine failure and it should
    have been validated on test data.


    It should be noted that these data mining steps are not comprehensive. Also, the
    steps do not need to be in the described order. Data cleansing can happen during
    data pre-processing, but it can also be necessary as a post-processing step in
    order to be able to interpret the result more easily or to increase readability
    before visualization. Also, supervised and unspuervised methods are not mutually
    exclusive. For instance, clustering can be used as preliminary step for a supervised
    learning task, for instance, to reduce the amount of data clustering can be used
    for data compression. It can also be used as a post-processing step, for instance,
    for data summarization.


