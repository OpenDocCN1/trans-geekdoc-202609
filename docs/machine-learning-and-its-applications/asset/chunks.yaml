    Instead of predicting a class as we do with supervised learning, clustering partitions
    data points into groups based on some similarity measure. In clustering, the goal
    is to understand data by finding the underlying structure in the data set. Since
    there is no ground truth in clustering, the evaluation of a cluster is more challenging
    than evaluating supervised learners. For instance, in a library, books are grouped
    into fiction, children’s books, travel books, cooking books, etc. The similarity
    is the subject of the books. However, children’s books are often fictional too
    and might belong to more than one cluster. It is not always obvious how to measure
    the performance of a cluster algorithm and the measurement is often subjective.
    The clusters have to be useful for the problem at hand.


    We can use clustering to understand data, but we can also use clustering as a
    starting point for other data mining tasks. For instance, if a data set is too
    large to be processed efficiently, clustering can be used for data summarization.
    Data is grouped in clusters based on similarity to a cluster prototype. A prototype
    is often a medoid, the most representative object in a cluster. Each cluster prototype
    is then presented to the data analysis algorithm separately, instead of the whole
    data set. If many instances in a data set are highly similar, clustering can be
    used for data compression. Instead of analyzing the whole data set, each cluster
    prototype is assigned an index that is tabulated. The data is compressed whilst
    maintaining its structure and usefulness.

