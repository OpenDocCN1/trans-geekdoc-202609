  trans: '


    收集足够的训练数据通常是困难的。数据有时无法公开，或者出于隐私或安全原因无法访问。为了缓解数据集稀疏的问题，可以创建合成数据，或者应用交叉验证等训练技术。此外，训练学习器需要带标记的数据。原始数据（如电子邮件）是没有标记的，而产生带标记的训练集可能是一项艰巨的工作。在这些情况下，可以使用主动学习等半监督技术。主动学习是在线学习的一种形式，智能体通过行动来获取有用的示例并从中进行学习`[31]`。在离线学习中，所有训练数据预先都是可用的，而在在线学习中，训练数据在学习器训练的过程中到达。学习算法可以在数据到达时主动请求智能体对数据进行标记。数据的可用性（无论是否已标记）对于机器学习项目的成功至关重要，并且应该在启动机器学习项目之前予以明确。


    ## 1.4 数据预处理


    困扰实际机器学习的一个问题是数据质量低劣`[40]`。现实世界的数据通常充满噪声且不一致，不能直接用于实际的机器学习应用。此外，现实世界的数据很少是能够直接作为机器学习方案输入的格式。这就是为什么需要数据预处理。数据预处理通常是花费时间最多的地方。在数据挖掘项目中，预处理占用高达
    70% 的精力并不罕见。


    虽然机器学习技术与领域无关，但数据预处理具有高度的领域特定性。例如，取决于分析的是文本数据还是图像，适用不同的预处理步骤。预处理任务也取决于所应用的学习算法。某些算法比其他算法能更好地处理噪声。例如，线性回归对离群值非常敏感，这使得移除离群值成为强制性的预处理步骤。


    有很多不同的预处理技术。除了移除离群值，典型的数据预处理任务还包括相关性过滤、数据去重、数据转换、实体解析和数据增强。例如回到垃圾过滤器示例，垃圾邮件中包含“在线购买”、“在线药房”等词汇或链接的频率通常高于合法邮件。某些单词或短语的频率可以指示邮件是垃圾邮件还是合法邮件。首先从邮件中删除无关的词、字符或符号，这个过程称为停用词移除。没有权威的停用词列表，它们取决于挖掘的内容。停用词是语言中最常见的词，例如“the”、“who”、“that”。在移除停用词后，会统计剩余单词的频率，创建一个带有频率的词列表。生成的列表被称为词袋（bag-of-words）。词袋随后被用作机器学习方案的输入`图
    1.2`显示了预处理前电子邮件。


    由于机器学习算法通常不接受文本作为输入，创建一个带有频率的词袋是许多文本分析任务中非常常见的预处理步骤。对于情感挖掘、文本分类或信息检索等任务，它是简单且有效的。


    ![图 1.2: 电子邮件预处理。](img/fig1_2.jpg)


    `图 1.2:]` 电子邮件预处理。


    从数据集中提取相关信息被称为特征提取。它从原始数据中选择相关的观测点。有时特征集会被简化，这个过程称为特征选择。特征选择有助于避免过拟合，因为它降低了复杂度，但它仍然应该以足够的准确性描述数据。生成的特征集表示为特征向量。特征向量是许多机器学习算法使用的输入。特征可以是数值的（例如人的年龄），也可以是类别的（例如人的职业职称）。机器学习算法的输入可以是任意维数的张量。如果张量有一维，它就是一个向量；如果有两个维度，它就是一个矩阵。


    数据转换是另一个常见的数据预处理步骤。它将数据转换为机器学习机器学习算法输入的格式。例如，将英尺转换为米、将字符串转换为数值或将连续值转换为离散值都是常见的转换任务。


    1997 年，IBM 深蓝击败了国际象棋冠军加里·卡斯帕夫。这被誉为机器学习的里程碑之一。从预处理的角度来看，象棋是一项简单的任务，因为象棋有明确定义的规则，像“象
    c3 - d4”这样的移动是不产生歧义的。换句话说，象棋数据没有噪声且规则集有限。


    ## 1.5 数据分析


    数据分析是知识发现的过程。在数据分析阶段，会创建预测模型。有很多不使用机器学习技术的数据分析方法。然而，本书重点关注使用机器学习的数据分析，其他方法超本书的范围。


    机器学习分为监督学习、半监督学习和无监督学习。一些广泛使用的学习方法包括集成学习、强化学习和主动学习。集成学习结合多种监督方法以形成更强大的学习器。强化学习是基于奖励的算法，学习如何实现复杂的客观（即目标）。主动学习是半监督学习的一种特殊形式。


    ### 1.5.1 监督学习


    当存在带标记数据时应用监督学习技术。带标记的数据用于训练和测试。标记通常是一个手动过程，可能耗时且昂贵。每条训练数据记录都与正确的标签相关。对于垃圾邮件过滤，带标记的数据意味着包含垃圾邮件和合法邮件的数据集。在这里，标签是“垃圾邮件”和“合法”。在训练期间，机器学习算法学习电子邮件与相关标签“垃圾邮件”或“合法”之间的关系。学习到的关系随后被用于将学习器以前未见的新邮件分类到它们相应的类别中。


    监督方法可以用于分类和回归。分类将数据分为类别。垃圾邮件过滤是一个分类问题，因为邮件被分为垃圾邮件和合法邮件。类别就是标签。由于有两个类别，所以它是一个二分类问题。如果有两个以上的类，则被称为多分类或多标签分类问题。


