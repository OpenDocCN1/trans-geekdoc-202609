- raw: 'Machine learning also has great potential for remote monitoring and diagnoses.
    A patient can take a picture of a wound or of visible symptoms and upload it to
    a server in a medical facility where a doctor can look at it and use machine learning
    for diagnosis and prescriptions. Remote monitoring is not limited to images. Data
    from a health tracker, such as blood pressure or blood sugar levels, can also
    be transmitted. Machine learning can significantly improve healthcare by allowing
    patients who need to regularly see a doctor or who need stationary treatment to
    be monitored remotely, allowing them to live a more independent life. Since all
    industrialized countries have a rapidly aging population and ever-growing health
    care costs, remote monitoring and treatment is a main focus of machine learning
    in eHealth.


    Personalized treatment remains, in many cases, restricted to people who can afford
    it. Based on the genetic material and on the symptoms, predictive analysis can
    help provide personalized treatment on scale. For instance, chemotherapy that
    is not working anymore because the tumor has adapted needs to be adapted accordingly.
    Machine learning is a major enabler of personalized treatments since it has the
    capability to analyze large amounts of data, but also to correlate different types
    of data such as leukocyte levels and genetic information. Using predictive analysis
    for disease assessment and management helps physicians to select the right treatment
    and adapt it quickly if some values have changed.


    ## [10.3  Natural language processing](#06_Contents.xhtml#sec10_3)


    Understanding human language remains one of the major challenges in computer science.
    Natural language is the language humans speak and write and the attempt to extract
    information from texts or speeches using algorithms is called natural language
    processing or NLP. Natural language processing encompasses understanding human
    language, e.g., understanding voice commands on a Smart Phone, and generating
    natural language, e.g., a text to speech application that reads Web pages to people
    with visual impairments. Natural language processing dates back to the beginnings
    of machine learning in the 1950s, when Alan Turing wrote a seminal paper called
    “Computing machinery and intelligence” \[[38](#25_References.xhtml#ref38)\]. In
    this paper, Turing proposes an imitation game where an interrogator needs to figure
    out the gender of a man and a woman invisible to him, by asking them questions.
    If one of the invisible persons is replaced by a computer and the interrogator
    cannot determine anymore if he is talking to the human or the computer, the computer
    can generate human cognitive capabilities. This is now called the Turing test.


    There is a lot of interest in natural language processing in research and practice
    since it simplifies human-machine interaction, however there are still limits
    to what natural language processing can do today. Machines are capable of understanding
    spoken commands or determine the subject of a text, but, to humans, a sentence
    or text has meaning, to a machine it is an array of characters. A machine does
    not understand the context what makes word sense disambiguation a tricky task.
    The word “meeting” can be a noun, as in “we are in a meeting”, or a verb, as in
    “we are meeting an my office”.


    ### [10.3.1  Text mining](#06_Contents.xhtml#sec10_3_1)


    Text mining or text analysis, aims to extract information from texts automatically.
    The applications of text mining are innumerable. Text mining is used for text
    categorization, text clustering, document summarization or opinion mining, but
    many other use cases exist. We have already covered spam filtering, which is an
    application of text classification. Emails are classified into legitimate and
    into spam mails.


    Sentiment analysis


    Sentiment analysis, also called opinion mining, is the field of study that analyzes
    peoples opinions, sentiments, evaluations, appraisals, attitudes, and emotions
    towards entities such as products, services, organizations, individuals, issues,
    events, topics, and their attributes \[[24](#25_References.xhtml#ref24)\]. Sentiment
    analysis is extensively used by companies to determine the popularity of products
    or services in order to improve them. It is also used in politics to make predictions
    on the outcome of elections or to determine the popularity of TV programs or series.
    With the advent of Social Media, such as Twitter or Facebook, it has become very
    easy for anybody to post an opinion on a movie or on a new product on the internet.
    Analyzing Social Media has, thus, become mainstream in many areas. Social media
    mining is used for personalized ads or for targeted marketing campaigns. It has
    also been used to determine the credit worthiness of a person. If an applicant
    for a load or mortgage has wealthy Facebook friends, he is likely to be wealthy
    himself and considered credit worthy.


    Sentiment analysis uses natural language processing methods to determine the opinions
    or sentiments in a text. We have already seen the bag-of-words approach. Sentiment
    words, such as “great”, “excellent” and “poor” are counted. If a text contains
    many positive sentiment words or more positive than negative sentiment words,
    it is considered a positive review. However, the bag-of-words approach considers
    only individual words and cannot handle sentiment polarity shifters. A sentiment
    polarity shifter changes the meaning of an expression to the opposite. For instance
    “the new Tesla is great” is a positive statement, “the new Tesla is not great”
    is negative. Here the word “not” acts as a polarity shifter. We have already seen
    the bag-of-words approach in [section 4.1.2](#14_Chapter04.xhtml#sec4_1_2), used,
    for instance, in na¨ıve Bayes spam filtering. We have also seen a more sophisticated
    approach that uses n-grams to capture the relationship between words. A tokenizer
    is used to split a text into sequences of words. If we have sequences of two words,
    they are called bigrams, and we analyze how often a word X is followed by word
    Y. we can determine the relationship between them. One approach is now to count
    bigrams and do frequency analysis on the bigrams. If we have many bigrams such
    as “not great” or “very bad” the text is considered a negative review.


    Neural networks and, in particular, deep learners have been used for sentiment
    analysis. One big advantage of deep learners is their capability to automatically
    extract features as we have seen in [Chapter 8](#19_Chapter08.xhtml). When using
    a shallow learner, such as the multilayer perceptron, we have to extract the features
    manually. A feature might be a part-of-speech tag on a word. In part-of-speech
    tagging, we assign a word in a text to a particular part of speech based on its
    relationship with adjacent and related words in a text. A word is identified as
    noun, verb, adjective, etc., for word-category disambiguation. For instance, the
    word “fly” can mean the insect, when it is a noun, or “to fly”, when it is a verb.
    After tokenization and part-of-speech tagging, the word stem, if found, and the
    words are grouped according to their word stems, a process called lemmatization.
    The words “had”, “has” and “having” are grouped since they have the same word
    stem, “have”. Lemmas extend the feature set by adding word groups based on stems.
    Using deep learners, these steps, such as lemmatization and part-of-speech tagging,
    are done automatically, which is a big advantage over shallow approaches. However,
    deep learners require a large amount of training data that is not always available.


    ## [10.4  Other applications](#06_Contents.xhtml#sec10_4)'
