- raw: 'Random forests are a class of ensemble learners that combine several decision
    tree models to form a stronger learner from just using a single weak decision
    tree. It is a divide-and-conquer approach, used to improve the performance of
    individual decision tree models. Random forest ensemblers average the result of
    the individual decision trees. In simple words, random forests create several
    decision trees and merge them in order to get a better prediction. Random forests
    are usually trained using bagging. In bagging, several models, here decision trees,
    are trained on subsets of the training data where the data points in the subsets
    are selected randomly with replacement (bootstrapping). Bagging improves the prediction
    performance by reducing variance. Decision trees are sensitive to the training
    data. When the training data changes, the resulting decision tree can be very
    different and, hence, the result can be quite different too. Bagging improves
    the result by averaging the prediction from each model. For instance, if we have
    five decision trees, each trained with a different training data subset, where
    each tree produces a weather forecast: “sunny”, “sunny”, “cloudy”, “rainy”, “sunny”,
    we take the most frequent prediction: “sunny”. The bagging algorithm works as
    follows:


    1.  Create random subsets of the training data set with replacement, meaning the
    same data can be reused


    2.  Train each decision tree with the random subsets


    3.  Using a new data set, calculate the average prediction of all decision trees


    Using bagging, we are not concerned with the individual trees’ bias and variance.
    Typically, they have high variance and low bias. The number of trees needs to
    be determined through experimentation, for instance, by increasing the number
    of trees in each run until there is no improvement in the predictive performance
    anymore. Bagging can be used for classification and regression just like decision
    trees. Bagging will be described in more detail in [Chapter 9](#21_Chapter09.xhtml).


    A problem with bagging is that the trees are often very similar and their predictions
    are, therefore, highly correlated. Ensemblers work better if the results are not
    or only weakly correlated. Random trees change how the sub-trees are trained in
    a way that the results of the individual trees are not correlated. The idea behind
    random forests is simple. The CART algorithm looks through all variables when
    deciding on the best feature to split. The random forests algorithm randomly selects
    a subset of variables from which it can choose the best feature for the split.
    The number of random features *n* needs to be defined beforehand and determined
    by experimentation. A good starting point for classification is $n = \\sqrt{p}$
    where *n* is the number of random features and *p* the total number of features,
    and $n = \\frac{p}{3}$ for regression. Generally speaking, the smaller *n* the
    smaller the inter-tree correlation and the strength of the individual tree goes
    down. [Figure 4.8](#14_Chapter04.xhtml#fig4_8) shows a random forest consisting
    of three decision trees.


    ![Figure 4.8: Random forest.](images/fig4_8.jpg)


    **[Figure 4.8:](#07_ListofFig.xhtml#fig4_8)** Random forest.


    The instances that have not been used for training, the left out samples, can
    be used to estimate the performance of the random forest. Random forests can be
    used for classification and regression. They can handle missing or unbalanced
    data. They are less prone to overfitting than other machine learning algorithms.
    Random forests are almost always better than decision trees. Typical applications
    of random trees are fraud detection systems in banking transactions, recommendation
    engines and feature selection.


    ### [4.1.4    Support vector machines](#06_Contents.xhtml#sec4_1_4)


    A support vector machine (SVM) is a widely-used machine learning algorithm that
    can be applied for classification and regression problems. It is a discriminative,
    non-probabilistic binary linear classifier. It is often preferred over other machine
    learning algorithms, such as neural networks, since support vector machines are
    simpler, less computation is required and yet a high accuracy can often be achieved.
    There are also variants for non-linear classification. The basic idea behind support
    vector machines is to find a hyperplane in an *n*\-dimensional space that distinctly
    separates the data points in two classes, where *n* is the number of features.
    In machine learning, a hyperplane is a decision boundary that is used to classify
    data points. If the data is linearly separable, we can find two parallel hyperplanes
    that separate the two classes of data. In [Figure 4.9](#14_Chapter04.xhtml#fig4_9),
    the two hyperplanes, *R*[1] and *R*[2], are represented by the two dotted lines.
    The hyperplane that lies in the middle of the two dotted hyperplanes is the maximum
    margin hyperplane. The support vector machine algorithm finds the hyperplane with
    the maximum distance from the nearest training samples. The data points on the
    two dotted hyperplanes are the support vectors. They influence the position and
    orientation of the hyperplane. In [Figure 4.9](#14_Chapter04.xhtml#fig4_9), the
    support vectors are shown as solid dots. They are at the nearest distance *b*
    from the hyperplane. The hyperplane is learned using a procedure that maximizes
    the margin, i.e., that finds a plane with the maximum distance between the data
    points of both classes. We use the support vectors to maximize the margin of *b*.
    The support vector machine algorithm is, thus, called a maximum margin classifier.
    The larger the margin the better the generalization.


    ![Figure 4.9: Support vector machine.](images/fig4_9.jpg)


    **[Figure 4.9:](#07_ListofFig.xhtml#fig4_9)** Support vector machine.


    In a two dimensional space, a hyperplane is just a line. A hyperplane has one
    dimension less than the ambient space. Using support vector machines, we have
    a set of input features *x*[1], *x*[2], … *x[n]* and a set of weights *w[i]* that
    we linearly combine with the features, to predict *y*. This is identical to neural
    networks. However, using support vector machines, we optimize the margin by just
    using the weights for the support vectors. In other words, we only use the features
    that matter for deciding on the position and orientation of the hyperplane. This
    is the main difference to neural networks. If we have two dimensions, as in [Figure
    4.10](#14_Chapter04.xhtml#fig4_10), we try to find the coefficients *a, b, c*
    such that *ax* +*by* ≥ *c* for the solid dots and *ax* + *by* < *c* for the pale
    dots. Looking at the left coordinate system in [Figure 4.10](#14_Chapter04.xhtml#fig4_10),
    we see that there are many possible solutions for *a, b, c* and, hence, many possible
    hyperplanes, but none might be optimal. In the right coordinate system, we can
    see that, depending on the position of the hyperplanes, the margin can be wider,
    *b*[1], or narrower, *b*[2], depending on the position.


    ![Figure 4.10: Support vector machine hyperplanes.](images/fig4_10.jpg)


    **[Figure 4.10:](#07_ListofFig.xhtml#fig4_10)** Support vector machine hyperplanes.


    Contrary to linear regression or neural networks, where all the data points are
    considered, using support vector machines only the support vectors of the training
    set influence the position of the dividing hyperplane. The support vectors just
    touch the boundary of the margin. Finding the optimal hyperplane is an optimization
    problem. The margin is calculated as the perpendicular distance from the support
    vectors to the hyperplane. The hyperplane is defined by [equation 4.11](#14_Chapter04.xhtml#eq4_11):


    | *w*^(*T*)*x* + *b* = 0 || (4.11) |


    | --- | --- |


    where


    |  *w^T* || \= The weight vector |


    | --- | --- |


    |  *x* || \= The input vector |


    |  *b* || \= Bias |


    For a given weight vector *w* and a bias *b* we can then write:'
