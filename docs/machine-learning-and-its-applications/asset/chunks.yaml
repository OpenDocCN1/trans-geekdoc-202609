- raw: 'As mentioned before, choosing *k* is crucial for the k-nearest neighbor algorithm
    since different values for *k* might yield different predictions. Since *k* is
    based on majority voting, a small *k* makes the prediction less stable since only
    a few instances decide on the class assignment. As *k* gets bigger, the decision
    boundary becomes less distinct. Finding an optimal value for *k* is not an easy
    task and requires some trial and error. We can start with a low *k* and determine
    the accuracy of the prediction. We then increase *k* until the accuracy does not
    improve anymore or gets worse. It is good practice to have an odd number for *k*,
    otherwise we might end up with a draw, e.g., for binary classification 2 votes
    for class A and 2 votes for class B.


    A few remarks: k-nearest neighbor is a non-parametric, lazy learning algorithm.
    Non-parametric means the algorithm does not make any assumptions on the underlying
    data distribution. This makes k-nearest neighbor a good choice if there is no
    prior knowledge about the underlying data distribution. Real-world data does not
    follow theoretical assumptions which makes it a “natural” choice for many non-linear
    data sets. k-nearest neighbor is also simple to understand and easy to interpret
    but still provides high accuracy which makes it a good choice of starting point
    for a machine learning project. On the down side, since k-nearest neighbor stores
    all or almost all training data, it requires a lot of memory and computing power,
    especially when *k* is big.


    A typical application of k-nearest neighbor is market segmentation. People with
    similar features such as age, income, family status, etc., are likely to have
    similar purchasing behavior. So, k-nearest neighbor can be used for recommendation
    engines and marketing campaigns. However, if the data volumes get too large, such
    as the Netflix or Amazon data sets that are enormous, k-nearest neighbor is not
    feasible anymore since every new instance has to be compared with all the training
    instances. Determining creditworthiness is another application of k-nearest neighbor.
    People with similar financial features are given the same credit rating.


    ## [4.2    Regression analysis](#06_Contents.xhtml#sec4_2)


    Regression analysis is a set of statistical methods applied to estimate the relationship
    among variables. It is used to determine if a correlation exists between variables.
    Regression analysis is probably one of the most important data analysis methods.
    Linear and logistic regression are the most popular regression analysis algorithms
    in machine learning, but many more exist.


    Regression analysis is used to make data driven decisions, such as forecasting,
    e.g., predicting sales volumes, time series analysis, e.g., development of share
    price over a period of time, or correlation analysis. However, it is important
    to notice that correlation does not imply causation. If a regression line fits
    a set of data points well, this does not mean that there is a cause-and-effect
    relation. For instance, on a rainy day, people tend to go shopping more than on
    a sunny day. There is a correlation between weather and sales volumes, but that
    does not mean that bad weather causes the sales.


    ![Figure 4.13: Regression analysis.](images/fig4_13.jpg)


    **[Figure 4.13:](#07_ListofFig.xhtml#fig4_13)** Regression analysis.


    In essence, regression analysis aims to fit a line or curve to a set of data points
    in such a way that the distance of the line or curve to the data points is minimized.
    [Figure 4.13](#14_Chapter04.xhtml#fig4_13) shows a regression curve fitted to
    a set of data points.


    Some remarks about [Figure 4.13](#14_Chapter04.xhtml#fig4_13):


    ▪  Not all points are on the curve, some might even be distant from the regression
    line


    ▪  The regression line is an approximation


    ▪  It indicates if there is a significant relationship between the dependent and
    independent variable


    ▪  The effects of the measured variables can be compared using different scales


    Regression analysis is a statistical approach for understanding the relationship
    between input and output variables. In machine learning we are more concerned
    about making accurate predictions by minimizing the error of a model. We use regression
    to determine:


    1.  how well a set of predictor variables predict an outcome, the dependent variable(s)


    2.  which variables in particular are significant for the outcome


    There are many different kinds of regression techniques available to make predictions.
    Also, new regression methods can be created. In [Figure 4.13](#14_Chapter04.xhtml#fig4_13),
    a curve has been fitted, since a straight line would not provide a good fit for
    the data points. Which regression method is most suited depends mostly on three
    factors:


    ▪  The number of independent variables


    ▪  The type of the dependent variables


    ▪  The shape of the regression line


    Regression analysis is used to explain a phenomenon, for instance, why did sales
    numbers drop last month, in order to make a prediction about the future, for instance,
    the risk of heart disease in relation to daily number of cigarettes smoked, or
    to support the decision making process, for instance, which promotion will have
    the biggest effect on sales volumes. Regression analysis lets us determine mathematically,
    which variables have an impact, which factors matter most, which ones can be ignored,
    how the factors are correlated, and, most importantly, how certain we are about
    these factors.


    Next to linear and logistic regression, there are other types, such as polynomial
    regression, lasso (least absolute shrinkage and selection operator) regression
    and stepwise or ridge regression, to name a few. Regression models can also be
    combined if needed. Typically, a linear model is used first. If no adequate fit
    can be found, a nonlinear model can be tried, since nonlinear models can fit a
    wider variety of curves.


    As with all machine learning schemes, the first step in regression analysis is
    collecting data. For instance, if we want to predict sales volumes in the next
    quarter, we first collect sales volumes over the past year and plot the data as
    shown in the left quadrant of [Figure 4.14](#14_Chapter04.xhtml#fig4_14).


    ![Figure 4.14: Regression analysis steps.](images/fig4_14.jpg)


    **[Figure 4.14:](#07_ListofFig.xhtml#fig4_14)** Regression analysis steps.


    The *y* axis shows the sales volumes, the dependent variable, and the quarter
    on the *x* axis. The *y* axis is always the dependent variable, the variable we
    want to predict. Each data point represents one week’s data. The curved line in
    the right quadrant summarizes the relationship between sales volumes and the quarter
    of the year. The sales goods could be grillables that are typically sold more
    in summer than in winter.


    As with all machine learning algorithms, overfitting is a problem in regression
    analysis. When the input data is highly correlated, linear regression will overfit.
    Other regression models, such as polynomial regression, also tend to overfit,
    so data regularization techniques must be used to prevent nonsensical results.
    [Figure 4.15](#14_Chapter04.xhtml#fig4_15) shows an overfitted regression curve.
    An overfit learner captures noise and does not generalize well on new, unseen
    data. Some regression models, such as lasso or ridge regression, have been developed,
    to mitigate the problem.


    ### [4.2.1    Linear regression](#06_Contents.xhtml#sec4_2_1)


    Linear regression is a statistical method of studying the relationships between
    two continuous variables. It is one of the simplest methods used for machine learning.
    Linear regression attempts to estimate the relationship between scalar dependent
    and independent (explanatory) variables by fitting a linear equation to observed
    data. If one explanatory variable is present, it is called simple linear regression,
    if more than one explanatory variable is present, it is called multiple linear
    regression.'
