  trans: '


    `卷积层`(convolutional layer)承担了大部分计算工作。带有可学习参数的`卷积`(convolutions)用于在多个位置提取相似的特征。更准确地说，`感受野`(receptive
    fields)对输入进行`卷积`(convolve)，并将`感受野`与下一层的一个单元连接起来，创建一个`特征图`(feature map)。其结果是一个`激活图`(activation
    map)。网络学习`特征检测器`(feature detectors)或`过滤器`(filters)，它们在遇到`视觉特征`(visual feature）（如边缘或形状）时激活。`特征检测器`相互复制，因此共享相同的`权重`。通过这种方式，`视觉特征`可以在`图像`的任何地方被检测到。我们最终获得了一组`卷积层`，每层都有一个二维`激活图`。


    `池化层`(pooling layer)将特征还原为单个单元。`池化`(Pooling)是一种基于样本的离散化过程，也称为`最大池化`(max pooling)，因为它对不重叠的子区域应用了`最大滤波器`(max
    filter)，目标矩阵的每个元素都是该区域的最大值。然而，还有其他类型的`池化`。`池化层`周期性地放置在`卷积层`之间，以减小`表示`(representation)的大小并创建一个几乎`尺度不变的表示`(scale
    invariant representation)。因此，`卷积神经网络`无论物体出现在`图像`的什么位置都能检测特征（`位置不变性`）。`池化层`也有助于避免`过拟合`。整个过程见图
    8.4。


    如前所述，`ReLU`已成为深度学习者的首选激活函数，因为它所需的功率更少，且缩短了训练时间。`ReLU`的运行比例如`tanh`函数快几倍。


    `卷积层`只连接到输入的`局部区域`(local region)。它不像`感知器`(perceptron)中的层那样是全连接的。此外，`卷积层`中的许多神经元共享`参数`。否则，它与`全连接层`没有区别。`卷积网络`的巨大成功源于它们的架构。人们已经提出了许多不同的架构，但它们本质上都是图
    8.4 中基础`循环神经网络`(recurrent neural network)的变体。它们都使用了`卷积`、`池化`和`全连接层`。


    ![图 8.4: 卷积神经网络。](img/fig_4)


    **图 8.4:** 卷积神经网络。


    `卷积神经网络`主要归功于在`计算机视觉`中的成功应用。然而，它们也被用于`自然语言处理`、`视频分析`和`医学分析`。它们还被训练用于游戏，如国际象棋和围棋。尽管`卷积网络`具有吸引人的特性，但在大规模应用于`高分辨率图像`时，成本仍然高得惊人
    [16]。


    ## 8.3 循环神经网络


    `感知器`和`卷积网络`的一个局限性是它们需要`固定大小的向量`作为输入，并产生`固定大小的输出向量`。此外，`传统神经网络`的输入是独立的。`循环神经网络`(rNN)
    在值序列 `x[1], …, x[τ]` 上运行，并可以产生向量序列作为输出。处理`时间序列`(temporal sequences)的能力使得它们成为输入大小未知任务的理想选择。例如在`机器翻译`中，我们想要从一种语言翻译成另一种语言的`文本`或`语音`的长度可能预未知。因此，我们也不知道翻译后文本的长度。处理序列的能力使得`循环神经网络`适用于`时间序列分析`、理解口语或具有可变输入的情感分析等任务。大多数`循环网络`还可以处理变长度的序列
    [8]。


    `循环神经网络`的基础工作由`Hopfield`完成，并于 1982 年发表 [13]。从那以后，开发了许多类型的`循环神经网络`，包括`El 曼网络`(Elman
    networks)、`门控循环单元`(gated recurrent units)、`双向循环网络`(bidirectional recurrent networks)和`深度循环神经网络`等。与`前馈网络`不同，`循环神经网络`包含`方向循环`(directed
    cycles)。然而，`循环神经网络`和`卷积网络`很少单独使用，它们通常是更广泛架构的一部分，通常与`感知器`结合使用，正如我们在第 8.2 节中所看到的。


    我们在第 4 章中已经介绍了`循环神经网络`，那里涵盖了浅层学习器。本质上，如之前所述，`循环神经网络`在网络架构中增加了`循环`(loops)。`循环神经网络`中的神经元可能会向同一层内的另一个神经元横向传输信号，除了与下一层神经元的连接外，可能与自己建立连接。网络的`输出序列`也可以作为下一个输入序列的反馈。图
    8.5 显示了一些可能的`循环网络架构`。


    ![图 8.5: 循环网络类型。](img/fig_5.jpg)


    **图 8.5:** 循环网络类型。


    `循环连接`(recurrent connections)为网络增加了`记忆`或`状态`。`状态`通常以`状态向量`的形式存储并受网络控制。`状态向量`通过`学习函数`与输入相结合，产生一个新的`状态向量`。通过这种方式，`循环神经网络`不仅考虑当前输入，还考虑过去感知的内容。时间步`t`的决策受到时间步`t-1`的影响。这是非常直观，因为我们根据经验做决定。`序列信息`保存在`隐藏状态`中，允许`循环神经网络`发现随时间的相关性，称为`长期依赖`。时间`t`
    处的隐藏状态 `h`可以使用公式 8.4 计算：


    | `h[t] = σ(W*x[t] + U*h[t-1])` | (8.4) |

    | --- | --- |


    其中


    | `h[t]` = 时间步 `t`的隐藏状态 |

    | --- | --- |

    | `x[t]` = 时间步 `t`的输入向量 |

    | `W` = 权重矩阵 |

    | `U` = 转换矩阵 |

    | `h[t-1]` = 时间步 `t-1`的隐藏状态 |

    | `σ` = 激活函数 |


    `转换矩阵`是`隐藏状态到隐藏状态的矩阵`，代表`循环神经网络`的`记忆`。`隐藏状态`包含了之前所有`隐藏状态`的痕迹，而不只是最后一个。`权重矩阵``W`决定了输入的重要性程度，正如我们在其他类型网络中看到的。`激活函数``σ`通常是`逻辑`函数或`双正切`函数。


    `循环神经网络`并不一定是深度学习器。如图 8.5 所示，`循环网络`也被组织成层，如果它超过一个`隐藏层`，则通常被称为`深度循环神经网络`。


