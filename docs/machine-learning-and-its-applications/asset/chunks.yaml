- raw: 'It is often difficult to collect enough training data. Data is sometimes not
    publicly available or cannot be accessed for privacy or security reasons. To mitigate
    the problem of sparse data sets, synthetic data can be created, or training techniques
    such as cross-validation can be applied. Also, to train a learner, labeled data
    is needed. Raw data, such as emails, are not labeled, and producing labeled training
    sets can be a laborious task. Semi-supervised techniques such as active learning
    can be used in these situations. Active learning is a form of online learning
    in which the agent acts to acquire useful examples from which to learn \[[31](#25_References.xhtml#ref31)\].
    In offline learning, all training data is available beforehand, whereas in online
    learning the training data arrive while the learner is trained. The learning algorithm
    can actively ask the agent to label data while it arrives. Data availability,
    whether labeled or not, is crucial for the success of a machine learning project
    and should be clarified before a machine learning project is initiated.


    ## [1.4    Data pre-processing](#06_Contents.xhtml#sec1_4)


    A problem that plagues practical machine learning is poor quality of the data
    \[[40](#25_References.xhtml#ref40)\]. Real world data is often noisy and inconsistent
    and cannot be used as is for practical machine learning applications. Also, real
    world data is seldom in a format that can be directly used as input for a machine
    learning scheme. That is why data pre-processing is needed. Data pre-processing
    is usually where most of the time is spent. It is not unusual that it takes up
    to 70% of the effort in a data mining project.


    Whereas machine learning techniques are domain independent, data pre-processing
    is highly domain specific. For instance, depending on whether text data is analyzed
    or images, different pre-processing steps apply. The pre-processing tasks also
    depend on the learning algorithm applied. Some algorithms can handle noise better
    than others. For instance, linear regression is very sensitive to outliers, which
    makes outlier removal a mandatory pre-processing step.


    There are many different pre-processing techniques. Typical data pre-processing
    tasks next to outlier removal include relevance filtering, data deduplication,
    data transformation, entity resolution and data enrichment. For instance, going
    back to the spam filter example, spam mails typically contain words or phrases
    such as “buy online”, “online pharmacy” or hyperlinks more often than legitimate
    mails. The frequency of certain words or phrases gives an indication of whether
    the mail is spam or legitimate. Irrelevant words, characters or symbols are first
    removed from the mail, a process called stop word removal. There is no authoritative
    list of stop words and they depend on what is being mined for. Stop words are
    the most common words in a language, e.g., “the”, “who”, “that”. After stop word
    removal, the frequencies of the remaining words are counted, to create a word
    list with their frequencies. The resulting list is called a bag-of-words. The
    bag-of-words is then used as input for a machine learning scheme. [Figure 1.2](#10_Chapter01.xhtml#fig1_2)
    shows an email before and after pre-processing.


    Since machine learning algorithms usually do not take text as input, creating
    a bag-of-words with their frequencies is a very common pre-processing step in
    many text analysis tasks. It is simple but effective for tasks such as opinion
    mining, text classification or information retrieval.


    ![Figure 1.2: Email pre-processing.](images/fig1_2.jpg)


    **[Figure 1.2:](#07_ListofFig.xhtml#fig1_2)** Email pre-processing.


    Extracting the relevant information from a data set is called feature extraction.
    It selects the relevant observation points from raw data. Sometimes the feature
    set is reduced, a process called feature selection. Feature selection helps to
    avoid overfitting since it reduces the complexity, but it should still describe
    the data with sufficient accuracy. The resulting set of features is represented
    as a feature vector. A feature vector is what many machine learning algorithms
    use as input. Features can be numerical, e.g., the age of a person, or categorical,
    e.g., the job title of a person. The input for a machine learning algorithm can
    be a tensor with any number of dimensions. If the tensor has one dimension it
    is a vector, if it has two dimensions it is a matrix.


    Data transformation is another common data pre-processing step. It converts data
    into a format that can be used as input for machine learning algorithms. For instance,
    converting feet into meters, strings into numeric values or continuous into discrete
    values are common transformation tasks.


    In 1997, IBM’s Deep Blue defeated chess champion Garry Kasparov. This was hailed
    as one of the milestones of machine learning. From a pre-processing point of view,
    chess is a simple task since chess has clearly defined rules and a move such as
    “Bishop c3 - d4” is unambiguous. In other words, chess data has no noise and a
    limited set of rules.


    ## [1.5    Data analysis](#06_Contents.xhtml#sec1_5)


    Data analysis is the process of knowledge discovery. During the data analysis
    phase, the predictive model is created. There are many data analysis methods that
    do not use machine learning techniques. However, this book focuses on data analysis
    using machine learning, other methods are beyond the scope of this book.


    Machine learning is divided into supervised, semi-supervised and unsupervised
    learning. Some widely-used learning methods include ensemble learning, reinforcement
    learning and active learning. Ensemble learning combines several supervised methods
    to form a stronger learner. Reinforcement learning are reward-based algorithms
    which learn how to attain a complex objective, the goal. Active learning is a
    special form of semi-supervised learning.


    ### [1.5.1    Supervised learning](#06_Contents.xhtml#sec1_5_1)


    Supervised learning techniques are applied when labeled data is present. The labeled
    data is used for training and testing. Labeling is often a manual process and
    can be time consuming and expensive. Every training data record is associated
    with the correct label. For spam filtering, labeled data will mean a data set
    of spam and of legitimate mails. Here, the labels are “spam” and “legitimate”.
    During training, the machine learning algorithm learns the relationship between
    the email and the associated label, “spam” or “legitimate”. The learned relationship
    is then used for classifying new emails that the learner has not seen before into
    their corresponding category.


    Supervised methods can be used for classification and regression. Classification
    groups data into categories. Spam filtering is a classification problem since
    mails are classified into spam and legitimate mails. The classes are the labels.
    Since there are two categories, it it a binary classification problem. If there
    are more than two classes, it is called a multi-class or multi-label classification
    problem.'
