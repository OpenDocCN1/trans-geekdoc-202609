- raw: 'Reinforcement learning is a stepwise approach, as shown in [Figure 9.3](#21_Chapter09.xhtml#fig9_3),
    where at each time step *t* the agent can choose an action *a* from a set of available
    actions. The agent goes through sequences of state-action pairs until it predicts
    the best path for the agent to take. The prediction is modelled as a map called
    a policy. At each time step *t*, the environment, with which the agent interacts,
    moves to a new state *s* at time step *t*+1 and the reward *r* for the transition
    to the new state is computed. The reward can be positive or negative. The reward
    is calculated using a reward function that takes the state of the agent and the
    action as input and maps it to a possible reward. The goal of the agent is to
    pick the best possible action for any state and to collect as much reward as possible.
    The way the actions are selected is crucial for the performance of the learner.


    Reinforcement learning can be used with neural networks and has been particularly
    successful in recent years in combination with deep learners. Deep learners are
    neural networks that have many hidden layers between the input and output layer.
    Reinforcement learning in combination with deep learning has been successfully
    applied to many problems, such as playing games, machine translation and robot
    control.


    ## [9.5    Active learning](#06_Contents.xhtml#sec9_5)


    Active learning is a form of online learning in which the agent acts to acquire
    useful examples from which to learn \[[31](#25_References.xhtml#ref31)\]. Active
    learning is an iterative type of supervised learning that is suitable for situations
    where data are abundant, yet the class labels are scarce or expensive to obtain
    \[[10](#25_References.xhtml#ref10)\]. It is a special case of learning in which
    the learner can actively query the user or some other information sources to obtain
    labels. The idea behind active learning is that the learning algorithm can perform
    better if it chooses the data it wants to learn from by itself. Since the learner
    chooses the examples presented to the user, the number of examples can be considerably
    lower than the number required for supervised learning. Active learning is an
    approach that helps identify informative unlabeled examples automatically \[[23](#25_References.xhtml#ref23)\].


    In active learning, a small subset of the unlabeled data is randomly selected
    and labeled manually. Based on the data labeled so far, new instances are presented
    to the user for labeling. The learner can select superior data points from random
    sampling. This is repeated until no more useful instances can be found.


    The advantage of active learning is that the algorithm can choose the examples
    to label, and subsequently perform better with a smaller amount of data from methods
    that randomly select samples from the underlying distribution. How to select the
    data points to label is a major area in research.


    ## [9.6    Machine teaching](#06_Contents.xhtml#sec9_6)


    Machine teaching happens when a model is not trained by a human, but devices communicate
    with each other and share knowledge. Basically, they learn from eachother. This
    can be cooperative, for instance, when autonomously driving cars share information
    about road conditions, or it can be competitive, for instance two machines playing
    chess against each other. The machines share data and create synthetic experiences
    for each other and cause a self-amplifying effect. One big advantage is that machine
    teaching potentially bypasses the need for training data. The other advantage
    is that machine teaching helps avoid human bias.


    ## [9.7    Automated machine learning](#06_Contents.xhtml#sec9_7)


    A lot of effort has been made to automate machine learning since many tasks are
    time consuming and require skilled data scientists that are not easy to find.
    However, while some machine learning steps can be automated, human experts are
    still required for many tasks. Many tasks require a trial and error approach since
    there is no recipe for what method works best.


    Tuning the hyperparameters of a learner is something usually done by a data scientist.
    The goal of hyperparameter tuning is to find the global optimum as fast as possible.
    The right fine tuning requires experience and different combinations have to be
    tried and evaluated. Hyperparameter search is something that can be automated
    and there are already many libraries available for automating the search. Tensor-Flow’s
    Vizier is a service for black-box optimization of many learners. Other libraries
    for hyperparameter tuning include Eclipse Arbiter and the Python library Spearmint.


    To a limited degree, feature selection can be automated. Some tools can select
    the features based on their relevance and usefulness for the problem. Automated
    feature selection is particularly useful in situations where there are too many
    for a human to choose. However, the most relevant features are not necessarily
    the best explanatory variables for a specific problem. Even if features are selected
    automatically, a data scientist will still most likely look at the variables in
    order to verify that they are relevant. Feature selection and verification requires
    domain knowledge and features are usually problem dependent and are, thus, selected
    manually for each data set from scratch.


    Model selection involves comparing the prediction accuracy of several trained
    learners. It is one of the more obvious tasks to automate, since selecting the
    best performing model involves comparing numerical values. Nevertheless, results
    might not always be conclusive and different evaluation metrics might be optimal
    for different models. For instance, one learner might have a good accuracy but
    a poor F1-score, whereas for the other it is the opposite, which makes it not
    always obvious which one to chose.


    Often, the results of a machine learning application need to be evaluated by a
    human expert. Whether the result is useful for the problem at hand or not requires
    human judgement and cannot be automated. Generally speaking, machine learning
    requires domain knowledge and an understanding of the data used, which limits
    the tasks that can be automated.


