- raw: 'The convolutional layer does most of the computational work. The convolutions
    with learnable parameters are used to extract similar features at multiple locations
    with few parameters. Receptive fields slide, more precisely, convolve, over the
    input image, and connect the receptive fields with one unit in the next layer,
    creating a feature map. The result is an activation map. The network learns feature
    detectors or filters that activate when they come across a visual feature, such
    as an edge or a shape of some color. The feature detectors replicate each other
    and, hence, share the same weights. In this way, a visual feature can be detected
    anywhere in an image. We end up having a set of convolutional layers with a two-dimensional
    activation map in each layer.


    The pooling layer reduces neighboring features into single units. Pooling is a
    sample-based discretization process and is also called max pooling since it applies
    a max filter to a region. The max filter is usually applied to non-overlapping
    subregions, where each element of the target matrix is the maximum of a region
    in the original input. However, there are also other types of pooling. The pooling
    layers are placed periodically in between a series of convolutional layers to
    reduces the size of the representation and the parameters. This downsampling reduces
    computing power and creates an almost scale invariant representation. Convolutional
    neural networks are, thus, able to detect features regardless of where an object
    appears in an image (location invariance). The pooling layer also helps to avoid
    overfitting. The whole process is shown in [Figure 8.4](#19_Chapter08.xhtml#fig8_4).


    As mentioned before, the ReLU has become the activation function of choice for
    deep learners since it requires much less computing power and decreases training
    time. ReLUs are several times faster than, for instance, the conventional tanh
    function.


    The convolutional layer is only connected to a local region of the input. It is
    not fully connected like the layers in a multilayer perceptron. Also, many neurons
    in a convolutional layer share parameters. Otherwise, it is not different from
    a fully connected layer. A lot of the success of convolutional neural networks
    lays in their architecture. Many different architectures have been proposed but
    they are, in essence, variations of the basic convolutional neural network in
    [Figure 8.4](#19_Chapter08.xhtml#fig8_4). They all use convolutional, pooling
    and fully connected layers.


    ![Figure 8.4: Convolutional neural network.](images/fig8_4.jpg)


    **[Figure 8.4:](#07_ListofFig.xhtml#fig8_4)** Convolutional neural network.


    Convolutional neural networks are mostly credited for their successful application
    to computer vision problems. However, they are also used for natural language
    processing, for video analysis and for medical analysis. They have also been trained
    to play games, such as checkers and Go. Despite the attractive qualities of convolutional
    neural networks, and despite the relative efficiency of their local architecture,
    they have still been prohibitively expensive to apply in large scale to high-resolution
    images \[[16](#25_References.xhtml#ref16)\].


    ## [8.3    Recurrent neural networks](#06_Contents.xhtml#sec8_3)


    A limitation of multilayer perceptrons and convolutional neural networks is that
    they require a fixed-sized vector as input and create a fixed-sized output vector.
    Also, the inputs to traditional neural networks are independent. Recurrent neural
    networks (rNN) operate over sequences of values *x*[1], …, *x[τ]* and they can
    produce sequences of vectors as output. The capability of processing temporal
    sequences makes them ideal for tasks where the input size is not known beforehand.
    For instance, in machine translation, the length of a text or speech we want to
    translate from one language into another might not be known beforehand. Consequently,
    we also do not know the length of the translated text beforehand. The capability
    of processing sequences of inputs makes recurrent neural networks suitable for
    tasks such as time series analysis, understanding spoken words or sentiment analysis
    with variable sized inputs. Most recurrent networks can also process sequences
    of variable length \[[8](#25_References.xhtml#ref8)\].


    The foundational work on recurrent neural networks was performed by John Hopfiled
    and published in 1982 \[[13](#25_References.xhtml#ref13)\]. Since then, many types
    of recurrent neural networks have been developed, including Elman networks, gated
    recurrent units, bidirectional recurrent neural networks and deep recurrent neural
    networks, to name a few. Contrary to feed-forward networks, recurrent neural networks
    contain directed cycles. However, recurrent neural networks as well as convolutional
    neural networks are rarely used alone but are often part of a broader architecture
    often in combination with a multilayer perceptron, as we have seen in [section
    8.2](#19_Chapter08.xhtml#sec8_2).


    We have already introduced recurrent neural networks in [Chapter 4](#14_Chapter04.xhtml)
    where shallow learners were covered. In essence, as mentioned before a recurrent
    neural network adds loops to the network architecture. A neuron in a recurrent
    neural network might transmit a signal sideways to another neuron within the same
    layer or it might have a connection with itself in addition to the connection
    with a neuron in the next layer. The output sequence of the network might also
    be used as feedback with the next input sequence. [Figure 8.5](#19_Chapter08.xhtml#fig8_5)
    shows some possible recurrent network architectures.


    ![Figure 8.5: Recurrent network types.](images/fig8_5.jpg)


    **[Figure 8.5:](#07_ListofFig.xhtml#fig8_5)** Recurrent network types.


    The recurrent connections add memory or state to the network. The state is usually
    stored in form of a state vector that is under the networks control. The state
    vector is combined with the input using a learned function to produce a new state
    vector. In this way, a recurrent neural network does not only take into account
    the current input but also what it has perceived back in time. The decision at
    time step *t* is influenced by time step *t* − 1. This is very intuitive since
    we decide based on past experiences. The sequential information is preserved in
    a hidden state that allows the recurrent neural network to find correlations over
    time, called long-term dependencies. The hidden state *h* at time *t* can be calculated
    using [equation 8.4](#19_Chapter08.xhtml#eq8_4):


    | *h*[*t*] = *σ*(*W**x*[*t*]+*U**h*[*t* − 1]) || (8.4) |


    | --- | --- |


    where


    |  *h[t]* || \= Hidden state at time step *t* |


    | --- | --- |


    |  *x[t]* || \= Input vector at time step *t* |


    |  *W* || \= Weight matrix |


    |  *U* || \= Transition matrix |


    |  *h[t−1]* || \= Hidden state at time step *t*−1 |


    |  *σ* || \= Activation function |


    The transition matrix is the hidden-state-to-hidden-state matrix and represents
    the memory of the recurrent neural network. The hidden state contains traces of
    all previous hidden states, not just the last one. The weight matrix *W* determines
    how much importance to accord to the input in the same way as we have seen with
    other types of networks. The activation function *σ* is usually a logistic or
    a hyperbolic tangent function.


    A recurrent neural network is not necessarily a deep learner. As shown in [Figure
    8.5](#19_Chapter08.xhtml#fig8_5), a recurrent network is also organized into layers
    and a recurrent neural network is usually called deep recurrent neural network
    if it has more than one hidden layer.'
