- raw: 'If clusters have been found, i.e., there are non-random structures present,
    we need to determine how accurately the clustering has been performed. If no ground
    truth, such as labeled data, is available, intrinsic methods have to be used.
    Intrinsic methods evaluate a clustering by examining how well the clusters are
    separated and how compact the clusters are \[[10](#25_References.xhtml#ref10)\].
    Also, different types of cluster analysis methods require different evaluation
    methods. For instance, sum of squared errors works well for k-means clustering
    but will not work well for density-based clusters. The quality of many cluster
    types can be evaluated using measures such as cohesiveness (compactness, tightness)
    and separateness (isolation). Cohesiveness measures how close instances in a cluster
    are to each other. In statistical terms, this is equivalent to having a small
    standard deviation (i.e., being close to the mean value) \[[43](#25_References.xhtml#ref43)\].
    In other words, cohesiveness measures how close instances are to the centroid.
    Separateness measures how distinct or well separated a cluster is from others.
    In general, we want clusters that are both, cohesive and well separated. A method
    that combines both is the Silhouette index.


    ### [6.5.1    Silhouette coefficient](#06_Contents.xhtml#sec6_5_1)


    The silhouette coefficient is a measure for how similar instances are within a
    cluster (cohesion), compared to other clusters (separation). The silhouette coefficient
    ranges between −1 and 1. The higher the index, the more similar an instance is
    to objects in its own cluster and dissimilar to objects in other clusters. If
    most instances have a high index, this means the clustering is cohesive and well
    separated. The silhouette index can be calculated using a distance measure such
    as the Euclidean distance or the Manhattan distance. The silhouette index is only
    useful for partitional, not for hierarchical clustering.


    To calculate the silhouette coefficient we need to compute *a*(*o*), the average
    distance between *o* and the other instances in the cluster to which *o* belongs.
    *a*(*o*) is a measure for the compactness of the cluster. For a data set *D* with
    *n* objects and *k* clusters, *C*[1], … *C[k]*, we calculate for each object *o*
    ∈ *D* where *o* ∈ *C[i]*(1 ≤ *i* ≤ *k*):


    | $a\\left( o \\right) = \\frac{\\sum\_{o\\prime \\in C\_{i,}o \\neq 0\\prime}{dist\\left(
    {o,o\\prime} \\right)}}{\\left| C\_{i} \\middle| - 1 \\right.}$ || (6.3) |


    | --- | --- |


    and *b*(*o*), the minimum average distance from *o* to all the clusters to which
    *o* does not belong:


    | $b\\left( o \\right) = \\min\\limits\_{C\_{i}:1 \\leq j \\leq k,j \\neq i}\\left\\{
    \\frac{\\sum\_{o\\prime \\in C\_{j}}{dist\\left( {o,o\\prime} \\right)}}{\\left|
    C\_{j} \\right|} \\right\\}$ || (6.4) |


    | --- | --- |


    The silhouette coefficient *o* is then defined as:


    | $s\\left( o \\right) = \\frac{b\\left( o \\right) - a\\left( o \\right)}{max\\left\\{
    {a\\left( o \\right),b\\left( o \\right)} \\right\\}}$ || (6.5) |


    | --- | --- |


    A small *a*(*o*) means the cluster is cohesive, a large *b*(*o*) means *o* is
    well separated from the other clusters. If the silhouette coefficient *s*(*o*)
    approaches 1, the quality of the clustering is greater. If *s*(*o*) is negative,
    *o* is closer to instances in another cluster. To measure the overall quality
    of a clustering, the average silhouette coefficient of all data objects *o* can
    be calculated. To measure the quality of a single cluster, we can calculate the
    average *s*(*o*) of all the instances within this cluster. If some clusters have
    much narrower silhouettes from others, this typically means a poor choice of *k*.
    The silhouette coefficient can also be plotted in order to heuristically determine
    the natural number of clusters.


    As usual, there are other intrinsic cluster evaluation methods. The Dunn index
    and Davies-Bouldin index both belong to this class of cluster evaluation algorithms.
    The Dunn index, like the Silhouette index, is a method for cluster evaluation
    that depends solely on the data itself, not on any external ground truth. The
    aim is the same as with the Silhouette index: To obtain clusters that are well
    separated and compact. The instances within a cluster should have little variance.
    The higher the Dunn index, the better the clustering. The Silhouette and Dunn
    index are internal measures since they only use information present in the data
    set. Cluster evaluation against external data such as a gold standard data is
    also possible. An example is entropy, which measures how well the clustering data
    matches external data.


    # [Chapter 7](#06_Contents.xhtml#ch7)


    # [Semi-supervised Learning](#06_Contents.xhtml#ch7)


    **CONTENTS**


    [7.1    Expectation maximization](#17_Chapter07.xhtml#sec7_1)


    [7.2    Pseudo labeling](#17_Chapter07.xhtml#sec7_2)


    Supervised methods use labeled data for training, unsupervised methods are applied
    on unlabeled data and have to determine feature importance by themselves. Semi-supervised
    methods follow a hybrid approach. Sometimes, we have a small number of labeled
    instances and a large number of unlabeled instances. For instance, a fraud detection
    application in a financial institution might be able to detect known types of
    fraud, but there are many new, unknown types of fraud that the system might miss.
    In this case, semi-supervised methods can be applied. This has several advantages.
    Labeling data, which is a time consuming and costly approach, is often performed
    by a data scientist. Manual labeling can also introduce human bias. Using unlabeled
    data during training can improve accuracy and often semi-supervised methods perform
    considerably better than unsupervised methods. For instance, the human genome
    consists of approximately 3 billion base pairs. Labeling the whole DNA for whole
    genome sequencing is virtually impossible.  Using semi-supervised methods gives
    access to large amounts of unlabeled data where assigning supervision information
    would be impossible. Semi-supervised methods attempt to improve classification
    accuracy by using both, labeled and unlabeled data instead of training the model
    just on a small portion of manually labeled data or using an unsupervised approach
    on the unlabeled data. However, using semi-supervised methods is not always possible
    and we often do not know the distribution of the unlabeled data.


    There are two basic semi-supervised approaches: Transductive and inductive learning.
    In transductive learning, we try to use the labeled data in order to infer the
    labels of the unlabeled data. This is in contrast to inductive learning, where
    the goal is to output a prediction function which is defined on the entire space
    X \[[4](#25_References.xhtml#ref4)\]. In inductive learning, we try to deduce
    rules from the labeled data that can then be applied to the unlabeled data set.


    A transductive approach goes through following steps:


    First we train a learner, such as na¨ıve Bayes classifier, to learn the classes.
    We then apply the trained learner to assign class probabilities to the unlabeled
    data. This step is called the “expectation” step. We then train a new learner
    using the labels of all the data. This step is called the “maximization” step.
    The steps are repeated until the model converges, i.e., the model does not produce
    a different estimate any-more. This procedure is called the expectation maximization
    algorithm or EM algorithm. Each expectation maximization iteration generalizes
    the model more. The expectation maximization procedure guarantees finding model
    parameters that have equal or greater likelihood at each iteration \[[40](#25_References.xhtml#ref40)\].


    ## [7.1    Expectation maximization](#06_Contents.xhtml#sec7_1)'
