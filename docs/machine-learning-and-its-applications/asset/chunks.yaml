    # 引言

    人工神经网络灵感来源于人类的神经系统。它们包含了许多不同的模型和学习方法。在这里，我们将介绍一些常用的模型，以展示它们的主要工作机制。


    人体中典型的神经元如图图 4.1 所示。它由树突组成，通过位于树突不同位置的突触接收来自上游神经元的电化学刺激。突触前细胞在响应被称为动作电位的电脉冲时，会将神经递质释放到突触间隙中。神经递质刺激接收神经元，进而产生动作电位。动作电位沿着细胞膜通过轴突传递到轴末梢，在那里触发神经递质的释放。此时神经元被称为“放电”。


    树突可以接收来自多个上游神经元的信号。每个神经元通常与数千个其他神经元相连。估计人大脑中大约有 100 万亿（`10¹⁴`）个突触 [25]]。此外，突触连接不是静态的。它们会随着活动的增加或减少而随时间推移而增强或减弱，这一过程被称为突触塑性。神经学家发现，人类大脑在受到相同脉动的反复刺激后，通过改变神经元之间突触连接的强度来学习
    [37]]。当两个神经元频繁相互作用时，它们会形成一种纽，允许它们更容易更准确地传输信号（赫布规则）。突触后细胞的强输入会使其更多的神经递质受体运输到表面，从而放大它从突触前细胞接收到的信号。这种现象被称为长程增强（LTP），发生在突触受到持续、高频刺激之后。例如，当我们学习一门外语言时，我们会重复新单词，直到我们不再需要集中精力进行翻译。我们会下意识地使用正确的外语单词。单词的重复导致了突触连接的增强，并在参与语言的神经元之间形成了纽。人工神经网络通过通过输入信号与权重的线性组合来模拟突触连接的增强和减弱。权重通常用权重矩阵
    `W` 表示。人工神经网络的学习包括修改权重矩阵，直到生成模型能够很好地表示训练数据 [25]。


    ![图 4.1：神经元。](img/fig4_1.jpg)


    **图 4.1：** 神经元。


    互连的神经元形成神经网络。类似，人工神经网络也是由互连的神经元组成的网络。有许多不同类型的人工神经网络。人工神经网络最简单的形式之一如图图 4.2。它由输入层、隐藏层和输出层组成。由于它有两个输出神经元，它可以用于二分类。事实上，一个输出神经元就足够用于二分类了，因为它可以放电或不放电，即发射
    1 或 0。图 4.2 所示的人工神经网络也可以用于多分类。


    ![图 4.2：神经网络。](img/fig4_2.jpg)


    **图 4.2：** 神经网络。


    在图 4.2 所示的人工网络中，每个输入都与每个神经元连接。由于信号正向传递到输出，如图图 4.3 所示，它被称为前馈神经网络。人工神经网络通过调整权重来学习函数
    `f`。近年来，深度学习者（DL）获得了巨大的动力，因为它们是通用近似器。最显著的区别是，真实的神经元不输出单一的响应，而是输出脉冲串，即脉冲序列，而这个脉冲串编码了信息。


    ,,,..... 到这些层，它是一个循环神经网络。


    ![图 4.3：循环神经网络。](img/fig4_3.jpg)


    **图 4.3：** 循环神经网络。


    应该注意的是，人工神经网络和深度学习是对生物的简化。真实的神经网络是高度互连的，它们在层之间正向和反向发送信号。神经元也不是单维处理单元，而是向所有方向都有分支。然而，最显著的区别是，真实的神经元不输出单一结果，而是输出脉冲串，即脉冲序列，是这个脉冲串编码了信息。


    # 优点

    人工神经网络的优点包括对噪声数据的高容忍性，以及它们对未训练过的模式进行分类的能力 [10]。当对属性及其之间的关系了解较少时可以使用它们。人工神经网络已生物学、医学、地震学、字符和语音识别或物体识别等许多现实问题。


    # 感知机

    我们已经在第 2.1.1 节中讨论了单个神经元——感知机的基本功能。如图图 4.4 所示，感知机由输入信号 `x[0]`、`x[1]`、……`x[1]` 与权重
    `w` 组合组成。输入可以是实际观测值，或者在多层的情况下，来自上游感知机的中间值。加权后的输入信号被求和并传递给激活函数。如果激活函数受到足够刺激，它就会放电，即发射信号。


    激活函数有不同类型。图 4.5 显示了一些流行的激活函数类型。坡函数已成为深度学习者的首选激活函数，因为它们极大地简化了数学计算。激活函数代表真实神经元的动作电位。在最简单的形式下，它是一个阶跃函数，受到足够刺激时放电，否则不放电。它是二分类的，因为它输出
    1 或 0，且只能进行线性分类分类。感知机通过累加输入的加权之和并加上偏置来计算 `ŷ`。


