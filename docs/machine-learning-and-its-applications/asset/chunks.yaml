    尽管独立假设通常是错误的，但朴素贝叶斯分类器在实际应用中的表现依然惊人，即使训练数据集很小也是如此。它的优点之一不仅返回预测结果，还返回确定程度，这通常非常有用。此外，它使得处理缺失值变得简单。由于其简单性，朴素贝叶斯分类器比神经网络更不容易过拟合。除了文本分析外，它还用于天气预测、医学诊断、人脸识别和推荐引擎等。


    ### 4.1.3 决策树


    决策树或决策树归纳另一种广泛使用的分类器。决策树归纳是从带有标签的训练元组中学习决策树 [[10]]。它生成一个树形结构，其中除叶节点外的每个节点代表一个属性的决策。树是计算机科学中最常见且最强大的数据结构之一。[图
    4.7]显示了一个简单的决策树，根据温度和湿度属性预测是否可能发生雷暴。


    顶端节点称为根节点，持有第一个属性；端节点称为叶子节点，持有类别标签。分支代表对属性进行决策的结果。在[图 4.7]中，我们有两个只有“是”或“否”的二分划分。划分可以多于两个。在这种情况下，我们有一个非二叉树。例如，我们想根据“收入”、“年龄”、“家庭状况”等属性预测潜在客户将购买什么类型的汽车。我们可能会有一个包含三个分支的划分，如“家庭用车”、“跑车”和“豪华车”。


    ![Figure 4.7: Decision tree.](img/fig4_7.jpg)


    **[图 4.7:]** 决策树。


    新数据从根节点开始遍历决策树，然后传递到叶节点。在向叶子节点进展的过程中，每个节点都会评估一个特征，直到接收实例的分类结果（类别标签）。如果目标变量是类别的（例如“家庭用车”、“跑车”等），它就是分类树；如果目标变量是连续的，它就是回归树。在最简单的情况下，决策树可以由一组
    if-then 规则（逻辑析取）组成。决策树类似于流程图，由于由节点和节点之间的边组成，因此本质上是受限的图。


    开发创建决策树的算法比使用它复杂得多。然而，大多数算法都基于相同的原理。在每一步中，我们应该根据已知知识选择能提供最多信息的属性。如果我们想对对象进行分类，在问“它是卡车吗？”之前，应该问更通用的问题，如“它是车辆吗？”。根据某些先验知识决定每个问题提供了多少信息是信息理论的任务，并且具有挑战性。幸运的是，决策树生成的算法（如
    `ID3`、`C4.5` 和 `CART`）已经存在了几十年。


    评估树的方法与其他分类器不同。我们使用`Gini index`或`entropy`来确定不纯度。Gini 指数也称为 Gini 系数、Gini 不纯度或 Gini
    比例，是经济学中使用的离散度量，用于表示一个国家的财富分布。在构建决策树时，它介于 0 和 1 之间。如果分离是完美的，Gini 指数为 0。如果指数为 1，则属性在两个划分中分布均匀。因此，我们希望划分具有较低的
    Gini 指数。`CART`算法使用 Gini 不纯度。Gini 指数定义为：


    ```

    D = 1 - \sum_{i = 1}^{c}p_{i}^{2}

    ```


    其中：

    - `p_i`: `D` 中的元组属于类别 `i` 的概率

    - `c`: 类别数量


    信息增益基于信息理论中熵的概念。信息增益是父节点的熵减去子节点的熵。它通过类别概率的`log`对类别概率进行加权。熵的定义为：


    ```

    E = \sum_{i = 1}^{c}{- p_{i}\log_{2}p_{i}}

    ```


    其中：

    - `p_i`: 子节点中每个类别的百分比

    - `c`: 类别数量


    熵值越小越好，换句话说，父节点之间的熵差异越大。Gini 指数的上限是 1，而熵的最大值取决于类别的数量。它是基于`log`的，对于两个类别，最大熵为 1；对于四个类别为
    2，以此此类推。


    由于几个原因，决策树是非常受欢迎的分类器。决策树直观且易于解释。它们通常与文本特征而非数值特征一起使用，使其人类可读。构建树的计算成本相当低，而使用它的成本更低：`O(log
    N)`，其中`N` 是数据点的数量 [[25]]。决策树分类器的构建不需要任何领域知识或参数设置，因此适用于探索性知识发现 [[10]]。决策树可以用一组逻辑析取来表示，这些析取可以很容易地编程。


    随机森林


