    ![图 5.3: 多类混淆矩阵。](img/fig5_3.jpg)


    **[图 5.3:]** 多类混淆矩阵。


    还有其他变体。混淆矩阵可以包含微平均（micro-averaged）结果，它是所有对多（one-versus-all）矩阵中结果之和。如果我们我们将主对角线元素之和除以矩阵中所有元素之和（得到正确回答的比例），我们就得到了准确率
    `[[25]]`。我们可以将准确率定义为真正例数量与真负例数量的和除以样本总数，如[公式 5.5] 所示。


    | $Recall = \frac{TP + TF}{TP + FP + TN + FN}$ | (5.5) |

    | --- | --- |


    我们已经看到准确率并不能为我们提供分类器性能的全貌，可以使用精确率（precision）和召回率（recall）来帮助我们解释结果。另一个有用的指标是受试者工作特征。


    ### 5.1.4 受试者工作特征


    受试者工作特征（`ROC`）是真正例率（也称为敏感性或召回率）随假正例率（也称为特异性）变化的函数图。它被用于衡量不同阈值设置下二分类分类器的性能。真正例率是如[公式
    5.3] 中定义的敏感性或召回率。假正例率是 1–特异性，其中特异性的定义如[公式 5.6]：


    | $Specificity = \frac{TN}{TN + FP}$ | (5.6) |

    | --- | --- |


    假正例率的定义如[公式 5.7] 所示：


    | $FPR = 1 - Specificity = \frac{FP}{TN + FP}$ | (5.7) |

    | --- | --- |


    对于完美的分类器，受试者工作特征曲线将沿 y 轴直向上移动直到达到 `y = 1`，然后沿 x 轴移动（100% 敏感性，100% 特异性）。如果受试者工作特征曲线是对角线，则这些值是完全随机的。ROC
    曲线上的每个点都代表对应特定决策阈值的敏感性/特异性对。通常，曲线位于对角线上方的某处。曲线越靠近左上角，分类器的准确性越高。[图 5.4] 显示了受试者工作特征曲线。它也被称为曲线下面（`AUC`）或
    `AUC-ROC`。曲线下的面积是分类器对随机选择的数据点的评分高于随机选择的负样本数据点的概率。通过观察[图 5.4]，可以使用受试者工作特征曲线来选择一个阈值，在最大化真正例的同时最小化假正例。


    ![图 5.4: 受试者工作特征。](img/fig5_4.jpg)


    **[图 5.4:]** 受试者工作特征。


    受试者工作特征曲线允许我们评估分类器在其整个工作范围内的性能。在机器学习中，受试者工作特征曲线通常用于比较统计模型。可以使用单个阈值来比较两个或多个分类器在该点的的性能，也可以比较整条曲线。小于
    0.5 的受试者工作特征曲线可能表明分类器发现的关系与我们的预期相反，且实验可能设置得错误。


    使用受试者工作特征曲线诊断具有两个以上类别的分类器需要更多维度，且复杂度急剧增加。目前已有尝试使用用于三类别的受试者工作特征曲线，称为三分类 `ROC`。由于受试者工作特征曲线的流行，人们已尝试使用它来评估其他监督模型。即，已经提出了用于回归模型的受试者工作特征，称为回归误差特征（`REC`）曲线和回归
    ROC（`RROC`）曲线。


