    # [Chapter 10](#06_Contents.xhtml#ch10)


    # [Machine Learning Applications](#06_Contents.xhtml#ch10)


    **CONTENTS**


    [10.1  Anomaly detection](#23_Chapter10.xhtml#sec10_1)


    [10.1.1  Security](#23_Chapter10.xhtml#sec10_1_1)


    [10.1.2  Predictive maintenance](#23_Chapter10.xhtml#sec10_1_2)


    [10.2  Biomedicale applications](#23_Chapter10.xhtml#sec10_2)


    [10.2.1  Medical applications](#23_Chapter10.xhtml#sec10_2_1)


    [10.3  Natural language processing](#23_Chapter10.xhtml#sec10_3)


    [10.3.1  Text mining](#23_Chapter10.xhtml#sec10_3_1)


    [Sentiment analysis](#23_Chapter10.xhtml#sec10_3_1a)


    [10.4  Other applications](#23_Chapter10.xhtml#sec10_4)


    Machine learning has applications in virtually every domain. Whether it is in
    finance, science or academia, as soon as a lot of data needs to be analyzed or
    many and complex rules are required, machine learning should be considered. It
    should be noted that, despite the versatility of machine learning, it is not a
    solution for any type of problem and it is certainly not a silver bullet. If the
    predictions can be made using simple rules, it is possible to develop a robust
    solution without machine learning. Machine learning should be considered when:


    ▪  Complexity: The rules are too complex or there are too many rules


    ▪  Scalability: The data volumes are too large for traditional data mining methods


    It is also important to realize that machine learning does not always provide
    results. Sometimes the data quality is too poor or there is no pattern in the
    data at all. Before a machine learning project is started, the following conditions
    should be verified:


    ▪  There is an infrastructure to conduct a machine learning project'
