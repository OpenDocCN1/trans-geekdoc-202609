  trans: '


    - 数据足够且数据质量足够良好

    - 项目有明确的目标


    当存在大量数据且存在真值（ground truth）时，机器学习就能良好运行。近期的技术发展，如物联网（IoT）、移动设备和云计算的出现，可能会产生不断增长的数据量。机器学习提供了有效分析所产生的海量数据的功能，可以预见，机器学习的重要性在未来将会增加。机器学习技术已经包含在许多手机和物联网解决方案中，并将无缝地集成到未来的许多应用中。本章概述了机器学习的应用，但远非详尽的。


    ## 10.1 异常检测


    机器学习最常用的应用之一是异常检测。异常检测指的是一系列不寻活动，例如欺诈性银行交易、网络安全违规或暗示机器即将发生故障的异常传感器数据。


    日益数字化的世界和物联网的出现产生了不断增加的交易数据和传感器数据。数字化的主要目标是提高生产力和效率，并最终降低成本。机器学习被用于识别与优化容量相关的数据点和模式，也被用于检测那些由于偏离大多数数据而可疑的观测值。偏离数据通常由某些问题引起，例如银行欺诈、设备故障、网络入侵或医疗问题。


    有不同的方法来识别异常数据点。在某些简单的情况下，可以使用数据可视化，例如检测位于正常数据分布之外的离群值。然而，通常不是仅凭一个变量就能让我们发现异常，而是多个变量的组合或需要识别的模式。


    检测异常最简单的方法是验证某些值（如传感器数据测量值）超出范围。如果超过了某些阈值，就会发送报警。这种方法的问题在于存在高误报率的风险，或者某些异常未被检测到。通常，我们在确定设备健康状况时，不能单独考虑单个传感器值，我们需要考虑传感器值的组合，换句话说模式。


    ### 10.1.1 安全


    异常检测的一个问题是，异常可能是未见的，并且没有可以反映该异常的历史数据。例如，不断检测到以前未知的安全威胁，因此，机器学习算法无法在现有数据上进行训练。零日漏洞就是这样一种未知或未处理的安全漏洞，可以被黑客利用。由于目前还没有来自未知漏洞或安全泄露的数据，与其训练一个机器学习方案来检测网络流量中的异常，不如训练训练学习器来识别正常网络流量的什么样。如果它检测到某些偏离流量，它就会发出报警，安全专家可以分析可疑流量。什么是偏离流量取决于通过网络传输的内容。例如，如果网络被用于金融交易，异常可能是转账金额异常高或向不寻常的国家进行转账。当我们拥有一组网络流量数据点集合时，它们通常具有特定的分布，例如高斯分布。为了检测异常，我们首先从数据点中计算概率分布
    `p(x)`。对于每个新数据点 `x`，计算它属于该概率分布的概率并与阈值进行比较。如果 `p(x)` 小于阈值，则 `x` 被视为异常。正常数据点往往具有较大的
    `p(x)`，而异常数据点往往具有较小的 `p(x)`。


    ### 10.1.2 预测性维护


    预测性维护用于监测设备的健康状态。它通过判断部件或整个机器是否即将故障并需要维护，帮助避免生产现场昂贵的停机。现代机器配备了收集数据，如温度、湿度、振动或其他值，取决于设备的类型。通过分析传感器值，可以确定材料疲劳或磨损等问题，并在整个机器甚至整个生产现场故障之前更换受影响的部件。例如，航空公司无法在他们降落的每个机场都设有备件仓库，特别是对于昂贵的部件，如耗资数百万的发动机。他们需要提前知道飞机是否需要维护。现代客机在机翼和发动机上配备了数千个传感器，以便早期检测技术问题。可以在需要时订购零件，无需维护仓库。这被称为智能物流，因为它优化了备件的物流和维护人员的调度。服务技术人员可以提前安排并在需要时部署。技术问题的早期检测和避免也被称为预测性和预防维护。智能物流和预防维护是物联网的两个主要应用领域和驱动力。


    预测性维护的一种解决方案是使用 10.1.1 节描述的方法，并判断数据点是否属于概率分布。另一种方法使用自编码器。自编码器在 8.6 节中描述过。自编码器创建传感器值及其相关性和交互的低维表示，并将其重构回原始值。自编码器在代表正常运行状态的正常传感器数据上进行训练。如果监测的设备老化，变量之间的相互作用发生变化，导致重建输入值的误差增加。我们使用重建误差的概率分布来判断数据点是否正常，或者我们是否有异常。


    ## 10.2 生物医学应用


    ### 10.2.1 医学应用


    机器学习在制药和医学领域找到了巨大的应用领域。它被用于辅助医生识别和诊断疾病、药物发现寻找新药或用于个性化治疗。


    机器学习方法，特别是 8.2 节中描述的卷积神经网络 `CNN`，已成功应用于分析医学图像，如 CT 扫描、X 光和 MRI 扫描。分析医学图像是耗耗时的，并且始终存在忽视医疗问题的危险。卷积神经网络可以检测图像中肉眼隐藏的病理性异常。卷积神经网络已用于阿尔茨海默症或纤维化等疾病的早期检测。它们还用于将图像或组织样本分类为恶性或良性肿瘤。


