- raw: 'A recurrent neural network is trained using backpropagation and gradient descent,
    just like a feedforward network. However, because of the loops, the backpropagation
    mechanism does not work in the same way like for a feedforward network. In a feedforward
    network, the algorithm moves backwards from the final error through the layers
    and adjusts the weights up or down, whichever reduces the error. To train a recurrent
    network, an extention of backpropagation called backpropagation through time,
    or BPTT is used. Backpropagation through time is a gradient-based method for training
    recurrent networks. In backpropagation through time, time is defined by the ordered
    series of calculations moving from one time step to the other. In essence, the
    structure of the recurrent neural network is unfolded. A copy of the neurons that
    contain loops is created and the cyclic graphs of the recurrent neural network
    are transformed into acyclic graphs, turning the recurrent neural network into
    a feedforward network. Every copy shares the same parameters. A recurrent network
    and the unfolded network are shown in [Figure 8.6](#19_Chapter08.xhtml#fig8_6).


    ![Figure 8.6: Unfold through time.](images/fig8_6.jpg)


    **[Figure 8.6:](#07_ListofFig.xhtml#fig8_6)** Unfold through time.


    The role of backpropagation through time in explaining learning through time in
    the brain, however, has particular problems not faced by feedforward backprop,
    and its relationship to the brain is less well-studied in general \[[21](#25_References.xhtml#ref21)\].
    Neural networks, whether recurrent or not, are nested functions of the form *f*(*g*(*h*(*x*))).
    In an recurrent neural network, the loops extend the series of functions for which
    we have to calculate the derivatives and apply the chain rule.


    Not all recurrent neural networks can be unfolded. With some architectures, it
    is not possible to use backpropagation through time. Also, as usual, there are
    variations of backpropagation through time, such as truncated backpropagation
    through time, which is an approximation of the full backpropagation through time.
    Truncated backpropagation through time is used when there are many time steps
    making computation slow. Also, recurrent neural networks, particularly when they
    have many layers, are plagued by the vanishing gradient problem we have seen before.
    If we cannot determine the gradient we do not know how to adjust the weights in
    a direction that decreases the error. In the worst case, the network stops learning
    at all. Many solutions to the vanishing gradient problem have been proposed. As
    we have seen before, when using a ReLU as activation function we do not have this
    problem. An-other solution is using residual networks, or ResNet. A residual network
    is an ensemble of many short, typically three layered networks. ResNets split
    a deep learner into smaller chunks. ResNets do not require any additional parameters
    or other training mechanisms. They provide one of the most effective solutions
    for the vanishing gradient problem.


    Recurrent neural networks are very effective for text and speech analysis as well
    as time series analysis, as we have seen. They are also used for robot control,
    for text recommendation and text autofill or customer satisfaction analysis in
    call centers. They work together with ConvNets for image recognition and provide
    a description to name a few applications.


    ## [8.4    Restricted Boltzmann machines](#06_Contents.xhtml#sec8_4)


    Restricted Boltzmann machines or RBMs are shallow, two layer networks that can
    be used for classification, regression, dimensionality reduction, collaborative
    filtering or feature learning. They are less well known than other network types.
    However, they achieved state of the art results in the Netflix prize \[[36](#25_References.xhtml#ref36)\]
    and outperformed most of the competition. They are covered in the deep learning
    chapter because they constitute the building blocks of deep belief networks.


    Restricted Boltzmann machines are probabilistic, i.e., they do not assign discrete
    values but probabilities. A restricted Boltzmann machine is a type of Boltzmann
    machine. However, Boltzmann machines are recurrent networks, whereas restricted
    Boltzmann machines do not allow intralayer connections between hidden units. That
    is why they are called “restricted”.


    Restricted Boltzmann machines consist of just two layers, an input layer and a
    hidden layer, as shown in [Figure 8.7](#19_Chapter08.xhtml#fig8_7). They do not
    have an output layer. The predictions are made differently from regular feed-forward
    networks. They fall into the category of energy-based models. Energy-based models
    try to minimize an energy function where high energy means bad accuracy. Restricted
    Boltzmann machines are divided into visible and hidden units. The visible units
    receive the training set. The energy function is minimized during training by
    adjusting the weights, biases and the states of the visible and hidden units until
    the function reaches a minimum, a process called simulated annealing. Each visible
    node is connected to every hidden node. A visible node accepts a low level feature,
    e.g., a pixel from an image. If an image has 1024 pixels, the restricted Boltzmann
    machine requires 1024 visible nodes. The inputs are combined with weights and
    added to a bias. The summed up inputs are then passed to a sigmoid activation
    function. This is not different from what we have seen with other networks. However,
    restricted Boltzmann machines are not trained using stochastic gradient descent.
    They use Gibbs sampling and contrastive divergence to update the weights. The
    training mechanism is beyond the scope of this book.


    ![Figure 8.7: Restricted Boltzmann machine.](images/fig8_7.jpg)


    **[Figure 8.7:](#07_ListofFig.xhtml#fig8_7)** Restricted Boltzmann machine.


    If there is more than one layer, the output *a* of the hidden layer is used as
    input for the next hidden layer.


    Restricted Boltzmann machines learn how to reconstruct the input in an unsupervised
    fashion. The activations *a* are used as input in a backwards pass. They are multiplied
    by the same weights the input *x* was multiplied. The summed up products are added
    to a bias of the visible layer. The biases of the visible layer are different
    from the biases of the hidden layer. The resulting output is a reconstruction
    or approximation of the original input. During the forward pass, the restricted
    Boltzmann machine calculates the probability of the output given a weighted *x*:
    *p*(*a*|*x*; *w*). During the backwards pass, the restricted Boltzmann machine
    estimates the probability of the inputs *x* given the weighted activations *a*:
    *p*(*x*|*a*; *w*). Both estimations lead to the joint probability distribution
    of *x* and *a*: *p*(*x, a*). The training goes through several forward and backward
    passes. The weights are adjusted until the probability distribution of the original
    input *p*(*x*) and the probability distribution of the estimated input *q*(*x*)
    converge.'
