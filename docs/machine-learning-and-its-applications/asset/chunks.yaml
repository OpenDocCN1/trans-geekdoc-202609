- raw: '▪  There is enough data and the data is of good enough quality


    ▪  There is a clear goal for the project


    Machine learning works well if there is a lot of data and if there is a ground
    truth. Recent technological developments, such as the advent of the Internet of
    Things (IoT), mobile devices and cloud computing, are likely to produce an ever
    increasing amount of data. Machine learning provides the functionality to effectively
    analyze the volumes of data produced and it is to be expected that the importance
    of machine learning will increase in the future. Machine learning technology is
    already included in many mobile phones and Internet of Things solutions and will
    seamlessly be integrated in many applications to come. This chapter gives an overview
    of machine learning applications, but by far not a comprehensive one.


    ## [10.1  Anomaly detection](#06_Contents.xhtml#sec10_1)


    One of the most used applications of machine learning is anomaly detection. Anomaly
    detection refers to a wide range of unusual activities, such as fraudulent bank
    transaction, network security breaches or abnormal sensor data suggesting imminent
    machine failure.


    The increasingly digitized world and the advent of Internet of Things produces
    an ever-increasing amount of transactional and sensor data. The main goal of digitization
    is to increase productivity and efficiency and ultimately reduce costs. Machine
    learning is used to identify the data points and patterns that are relevant to
    optimize capacity, but it is also used to detect observations that are suspicious
    since they are deviant from the majority of the data. Deviant data is usually
    caused by some kind of problem, such as bank fraud, malfunctioning equipment,
    network intrusions or medical problems.


    There are different methods to identify abnormal data points. In some simple cases,
    data visualization can be used, for instance, to detect outliers that are located
    outside the normal data distribution. However, it is often not one variable alone
    that allows us to find an anomaly but a combination of many variables or a pattern
    that need to be identified.


    The easiest way to detect anomalies is to verify that certain values, such as
    sensor data measurements, are out of bounds. If some threshold is exceeded, an
    alarm is sent. The problem with this approach is that there is the risk of having
    a high false positive rate or that some anomalies go undetected. Usually, we cannot
    consider single sensor values on their own when determining the health of an equipment,
    we need to take into account combinations of sensor values, in other words, patterns.


    ### [10.1.1  Security](#06_Contents.xhtml#sec10_1_1)


    One problem with anomaly detection is that an anomaly might be unseen and there
    is no historic data available that reflects the anomaly. For instance, there are
    constantly new security threads detected that have been unknown and, hence, a
    machine learning algorithm cannot be trained on existing data. A zero-day vulnerability
    is such an unknown or unaddressed security vulnerability that can be exploited
    by hackers. Since there is no data yet from unknown vulnerabilities or security
    breaches, instead of training a machine learning scheme to detect anomalies in
    network traffic, the learner can be trained to recognize what normal network traffic
    looks like. If it detects some deviant traffic, it issues an alarm and a security
    specialist can analyze the suspicious traffic. What deviant traffic is depends
    on what is transmitted over the network. For instance, if the network is used
    for financial transactions, an anomaly might be unusually high amounts of money
    transferred or transfers to an unusual country. When we have a collection of data
    points from network traffic they typically have a certain distribution, such as
    a Gaussian distribution. To detect anomalies, we first calculate the probability
    distribution *p*(*x*) from the data points. For every new data point *x*, the
    probability that it belongs to the probability distribution is calculated and
    compared against a threshold. If *p*(*x*) is smaller than the threshold, *x* is
    considered an anomaly. Normal data points tend to have a large *p*(*x*), whereas
    anomalous data points tend to have a small one.


    ### [10.1.2  Predictive maintenance](#06_Contents.xhtml#sec10_1_2)


    Predictive maintenance is used to monitor the health state of an equipment. It
    helps to avoid costly outages of production sites by determining if a part or
    a whole machine is going to fail soon and needs maintenance. Modern machines are
    equipped with sensors that collect data, such as the temperature, humidity, vibration
    or other values, depending on the type of equipment. By analyzing the sensor values,
    problems such as material fatigue or abrasion can be determined and the affected
    parts can be replaced before the whole machine or even a whole production site
    fails. For instance, airline companies cannot have a spare parts depot in every
    airport they land, especially for expensive parts, such as propulsion engines
    that cost several millions. They need to know in advance if an airplane needs
    maintenance. Modern airliners are equipped with thousands of sensors in the wings
    and engines for early detection of technical problems. Replacement parts can then
    be ordered when needed and no warehouse needs to be maintained. This is called
    smart logistics since it optimizes the logistics of spare parts and the scheduling
    of maintenance personnel. The service technicians can be scheduled in advance
    and deployed when needed. The early detection and avoidance of technical problems
    is also called predictive and preventive maintenance. Smart logistics and preventive
    maintenance are two main application fields and drivers of Internet of Things.


    One solution for predictive maintenance is to use the approach described in [section
    10.1.1](#23_Chapter10.xhtml#sec10_1_1) and determine if a data point belongs to
    a probability distribution or not. Another approach uses an autoencoder. Autoencoders
    were described in [section 8.6](#19_Chapter08.xhtml#sec8_6). The autoencoder creates
    a lower dimensional representation of the sensor values with their correlations
    and interactions and reconstructs them back to the original values. The autoencoder
    is trained on normal sensor data that represents the normal operating state. If
    the monitored equipment degrades, the interactions between the variables change,
    which results in an increase of the error of the reconstructed input values. We
    use the probability distribution of the reconstruction error in order to determine
    if a data point is normal or if we have an anomaly.


    ## [10.2  Biomedicale applications](#06_Contents.xhtml#sec10_2)


    ### [10.2.1  Medical applications](#06_Contents.xhtml#sec10_2_1)


    Machine learning has found a large application field in pharma and medicine. It
    is used to support physicians in disease identification and diagnosis, for medicine
    discovery to find new drugs or for personalized treatments.


    Machine learning methods and, in particular, convolutional neural networks (CNN)
    that were described in [section 8.2](#19_Chapter08.xhtml#sec8_2) have been successfully
    applied to analyze medical images such as CAT scans, X-rays and MRI scans. Analyzing
    medical images is time-consuming and there is always the danger of overlooking
    a medical problem. A convolutional neural network can detect pathogenic abnormalities
    in images that are hidden to the human eye. Convolutional neural networks have
    been used for early detection of illnesses such as Alzheimer’s or fibrosis. They
    are also used to classify images or tissue samples into malign or benign tumors.'
