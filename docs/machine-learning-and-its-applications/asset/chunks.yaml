- raw: 'Expectation maximization (EM), also called expectation maximization cluster
    analysis, is a method to solve maximum likelihood estimation problems. Generally
    speaking, expectation maximization is an algorithm for maximizing a likelihood
    function when some of the variables in the model cannot be directly observed,
    i.e., latent variables. Expectation maximization assumes that the data is composed
    of multiple multivariate normal distributions, which is a strong assumption. It
    iteratively tries to find an optimal model by alternatingly improving the model
    and the object assignment to the model. Looking at [Figure 7.1](#17_Chapter07.xhtml#fig7_1),
    the upper graphic shows black and grey dots. To characterize each group, we can
    use the mean of the black dots, which is around 3, and the gray dots, which is
    around 6. This is called the maximum likelihood estimation. Given a set of data,
    we try to find the value or the values that best explain each data group. If we
    have the same data points but we do not know which group each instance belongs
    to, under certain conditions we might still be able to determine the means for
    each group by iteratively applying expectation maximization. We can use expectation
    maximization to determine the mean and standard deviation parameters for each
    group.


    The first step is to estimate the mean and standard deviation for each group.
    These are random values and do not produce good estimates. In [Figure 7.2](#17_Chapter07.xhtml#fig7_2),
    we have two normal distribution curves. The mean for the first group is around
    3, for the second group around 6. In [Figure 7.2](#17_Chapter07.xhtml#fig7_2),
    the mean of the first bell curve is around 2.5, the mean of the second bell curve
    is around 7.5. In the second step we calculate the likelihood of each data point
    by using the probability density function for a normal distribution using the
    current guesses at the mean and standard deviation for both groups. This tells
    us for each data point the likelihood that it belongs to one or the other group.
    These two likelihood values, the likelihood that a data point belongs to one group
    and the likelihood that it belongs to the other group, are turned into weights
    in the third step. Using the estimates and the newly calculated weights, we compute
    new estimates for the mean and standard deviation of both groups. This is step
    four. The mean and standard deviation are calculated twice using all data points,
    once for one group and once for the other group. This is the key step where the
    greater the weight of a data point for one group, the more it influences the estimate
    for that group in the next estimate. The data point is “pulled” in the right direction,
    so to speak. [Figure 7.3](#17_Chapter07.xhtml#fig7_3) shows an improved approximation.
    After we calculate the new estimates, we go back to step two and repeat the process
    to improve the estimate. We repeat these steps until the estimates converge.


    ![Figure 7.1: Maximum likelihood estimation.](images/fig7_1.jpg)


    **[Figure 7.1:](#07_ListofFig.xhtml#fig7_1)** Maximum likelihood estimation.


    ![Figure 7.2: Maximum likelihood initial estimation.](images/fig7_2.jpg)


    **[Figure 7.2:](#07_ListofFig.xhtml#fig7_2)** Maximum likelihood initial estimation.


    So how do we determine the number of clusters? In cluster analysis, there is no
    correct solution. Expectation maximization cluster analysis, like all cluster
    analysis methods, is a knowledge discovery process. The number of clusters selected
    should be larger than the number of classes. Lets assume we want to train a classifier
    to tell apart birds, mammals and fish. We cannot assume the data consists of three
    exact normal distributions. However, we can assume there is more than one type
    of bird, mammal and fish. So instead of just using three clusters, we create separate
    clusters for flying birds, flightless birds, etc. So, we might end up with 20
    clusters. Once the learner has been trained to distinguish the 20 classes, we
    merge the clusters back into the three original clusters. Some might be difficult
    to classify, such as whales or manatees that live in the sea, but are still mammals.
    To verify whether there is some structure in the class and not just random data,
    the algorithm can be applied to single classes.


    ![Figure 7.3: Maximum likelihood approximation.](images/fig7_3.jpg)


    **[Figure 7.3:](#07_ListofFig.xhtml#fig7_3)** Maximum likelihood approximation.


    The expectation maximization algorithm tends to be very slow. Especially with
    high dimensional data, the expectation step can be very slow. Also, the algorithm
    can get stuck in a local maxima that is far from the global maxima. We then need
    to restart from scratch.


    ## [7.2    Pseudo labeling](#06_Contents.xhtml#sec7_2)


    Pseudo labeling is a simple and efficient technique used for semi-supervised learning.
    It is also used in deep learning. In fact, pseudo labeling can be used for most
    neural networks and training methods. In semi-supervised learning, we learn the
    features from the labeled data. We would like to take advantage of the information
    in the unlabeled data to get a better understanding of the structure of the data.
    Pseudo labeling can be used to learn from the unlabeled data. The basic idea of
    pseudo labeling is to use the labeled data set to train a model, then use that
    model to label the unlabeled data. Pseudo labeling goes through following steps:


    1.  Train a model or several models using the labeled data set. The training data
    set might have to be manually labeled.


    2.  The model which performed best is then used on the unlabeled data to predict
    the class.


    3.  Combine the training set with the labels and the one with the pseudo labels.


    4.  Train the model like before but with the combined data sets.


    The pseudo labels might not be correct but they should have a high predicted probability.
    If the results are not satisfactory, another iteration might be necessary and
    we have to start from scratch using different methods.


    As usual, we divide the combined data set into training and testing data in order
    to train a learner. There might not be an underlying structure and, as with a
    clustering problem, there might not be a useful result. Web page classification
    is a typical problem for semi-supervised learning. We want to classify web pages
    into “news pages”, “discussion forums”, etc. There is an abundance of web pages
    on the Internet, but it is expensive to manually label thousands of web pages.
    We can use pseudo labeling on raw web pages by training a classifier on a small
    number of labeled web pages. Then, we can use the trained learner to label the
    web pages we want to classify as described before. Deep learners often use unsupervised
    methods for pre-training. The initial weights of the deep neural network are initialized
    by applying layer-wise unsupervised training. After the weights are initialized,
    they are fine-tuned using labeled data and the backpropagation algorithm in a
    supervised fashion. This also works using semi-supervised methods. We can use
    extra unlabeled data for unsupervised pre-training. Ultimately, we can use semi-supervised
    methods on any supervised task if we want to enrich our labeled data with unlabeled
    data. In many cases, even when using older approaches, such as the naïve Bayes
    classifier, we can obtain superior performance by adding unlabeled data and using
    semi-supervised learning.


    | [DEEP LEARNING](#06_Contents.xhtml#sec3) || [III](#06_Contents.xhtml#sec3) |


