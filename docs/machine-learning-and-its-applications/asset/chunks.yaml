    # [Chapter 3](#06_Contents.xhtml#ch3)


    # [Data Pre-processing](#06_Contents.xhtml#ch3)


    **CONTENTS**


    [3.1    Feature extraction](#13_Chapter03.xhtml#sec3_1)


    [3.2    Sampling](#13_Chapter03.xhtml#sec3_2)


    [3.3    Data transformation](#13_Chapter03.xhtml#sec3_3)


    [3.4    Outlier removal](#13_Chapter03.xhtml#sec3_4)


    [3.5    Data deduplication](#13_Chapter03.xhtml#sec3_5)


    [3.6    Relevance filtering](#13_Chapter03.xhtml#sec3_6)


    [3.7    Normalization, discretization and aggregation](#13_Chapter03.xhtml#sec3_7)


    [3.8    Entity resolution](#13_Chapter03.xhtml#sec3_8)


    Real world data is seldom in a form suitable for machine learning algorithms.
    It is typically noisy, contains redundant and irrelevant data, or the data set
    is too large to be processed efficiently in its original form. Data pre-processing
    extracts the relevant information, the features, from a data set and transforms
    it into a form that can be used as input for an machine learning algorithm, usually
    in the form of a feature vector. Data pre-processing reduces the cost of feature
    measurement, increase the efficiency of a learner, and allows for higher classification
    accuracy.


    Machine learning algorithms are domain independent, data preprocessing is highly
    domain specific and usually requires domain knowledge. Data pre-processing comprises
    a large number of different techniques and often several training data sets are
    created by using different pre-processing techniques. The learner is then trained
    with each of the pre-processed training sets and the best performing set is used
    for the final model. Some tools offer feature filtering so the same data set can
    be tested with different features.


    Typical pre-processing tasks include data deduplication, outlier removal, stop
    word removal from texts, where irrelevant words or signs are removed from the
    original text. Sometimes data is enriched with synthetic data or synthetic features,
    especially for sparse data sets.


    ## [3.1    Feature extraction](#06_Contents.xhtml#sec3_1)'
