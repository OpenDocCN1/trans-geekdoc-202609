    In its simplest form, an autoencoder is a feedforward network with an input, an
    output and one hidden layer. The input and output layer have the same number of
    neurons. An autoencoder always encodes and decodes an input. Autoencoders try
    to learn a function `h` such that `h[W,b](x)` ≈ `x` where the parameters `W` are
    the weights and `b` is the bias. In other words, they are trying to approximate
    the identity function. An identity function always returns the same value that
    was passed to the function as an argument. Autoencoders are trained in an unsupervised
    fashion by minimizing a loss function such as the squared error. If the hidden
    layers are larger than the input layer, an autoencoder can learn the identity
    function and reconstruct the input identically.


    Deep autoencoders consist of two symmetrical deep belief networks. They are capable
    of compressing data, such as images. They can also be used for topic modeling.
    Topic modeling is the process of discovering the topic or the topics in a set
    of documents.


    Deep autoencoders consist of one encoding part and one symmetrical decoding part.
    Each part consists of one or more deep belief networks. [Figure 8.8] shows a simple
    deep autoencoder architecture.


    An autoencoder takes binary data as input, such as pixel arrays, but it can also
    use real-valued data as input. If the input is an image of `32*32 = 1024` pixels
    the input layer should contain about 1200 units, slightly larger than the 1024
    input pixels due to the limited capacity of the sigmoid belief units. The subsequent
    number of units will be something like 600, 300, 150 and 50, where 50 is an encoded
    version of the input image. It is the latent vector with the compressed representation.
    Latent variables cannot directly be observed. They are inferred from the observed
    variables. The decoding half of the autoencoder consists of the same number of
    layers and nodes but in reverse order. It accepts the condensed vector as input
    and learns how to reconstruct the image. There are also variations where the hidden
    vector is bigger than the input layer. If the hidden code is smaller than the
    dimension of the input, the autoencoder is said to be undercomplete. If it is
