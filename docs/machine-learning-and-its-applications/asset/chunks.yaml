    # 第 3 章


    # 数据处理


    **目录**


    3.1   特征提取


    3.2   采样


    3.3   数据转换


    3.4   离群值移除


    3.5   数据去重


    3.6   相关性过滤


    3.7   归一化、离散化和聚合


    3.8   实体解析


    真实世界的数据很少是适用于机器学习算法的形式。它通常是嘈的，包含冗余和无关的数据，或者数据集太大，无法以原始形式高效处理。数据处理从数据集中提取信息（特征），并将其转换为作为机器学习算法输入的形式，通常是特征向量的形式。数据处理减少了特征测量的成本，提高了学习器的效率，并允许更高的分类准确率。


    机器学习算法是领域独立的，数据处理是高度领域特定的，通常需要领域知识。数据处理包含许多不同的技术，通常通过不同的预处理技术创建多个训练数据集。然后用每个预处理后的训练集训练学习器，并将性能最好的集合用于最终模型。某些工具提供特征过滤，以便同一个数据集可以使用不同的特征进行测试。


    典型的预处理任务包括数据去重、离群值移除、从文本中移除停用词，从文本中移除无关词或符号。有时会使用合成数据或合成特征增强数据，特别是对于稀疏数据集。


    3.1   特征提取

