  trans: '

    机器学习在远程监控和诊断方面也具有巨大的潜力。患者可以拍摄伤口或可见症状的照片，并将其上传到医疗机构的服务器，医生可以查看照片并使用机器学习进行诊断和开处方。远程监控不仅限于图像。来自健康追踪器的数据（如血压或血糖水平）也可以进行传输。机器学习可以显著改善医疗保健，因为它允许需要定期看医生或需要静止治疗的患者能够接受远程监控，让他们过上更独立的生活。由于所有工业化国家都面临人口快速老龄化和医疗成本不断增长的挑战，远程监控和治疗是电子健康（eHealth）中机器学习的一个重点。


    在许多情况下，个性化治疗仍然局限于负担得起的人。基于遗传材料和症状，预测分析可以帮助规模化提供个性化治疗。例如，由于肿瘤已经产生适应性导致化疗不再有效，则需要进行相应的调整。机器学习是个性化治疗的主要推动者，因为它不仅能够分析海量数据，还能关联不同类型的数据，例如白细胞水平和遗传信息。使用预测分析进行疾病评估和管理，有助于医生选择正确的治疗方案，并在某些数值变化时快速进行调整。


    ## 10.3 自然语言处理


    理解人类语言仍然是计算机科学中的主要挑战之一。自然语言是人类说话和书写的语言，而利用算法从文本或演讲中提取信息的尝试被称为自然语言处理或 `NLP`。自然语言处理涵盖了理解人类语言（例如理解智能手机上的语音命令）以及生成自然语言（例如为视障人士读取网页的文本转语音应用）。自然语言处理可以追溯到
    20 世纪 50 年代机器学习的初期，当时艾伦·图灵（Alan Turing）写了一篇名为《计算机器与智能》的开创性论文。在这篇论文中，图灵提出了一个“模仿游戏”（imitation
    game），提问者需要通过提问来确定一个看不见的男人和一个女人的性别。如果其中一个不可见的人被计算机取代，且提问者无法再判断自己是在与人还是计算机对话，那么计算机就可以产生人类的认知能力。这现在被称为图灵测试。


    研究和实践中对自然语言处理有着浓厚的兴趣，因为它简化了人机交互；然而，目前自然语言处理的能力仍有局限。机器能够理解口头指令或确定文本的主题，但对人类来说，一个句子或文本是有意义的，对机器来说，它只是一个字符数组。机器不理解上下文，这使得词义消消除成为一项棘手的任务。单词“meeting”可以是名词，如“we
    are in a meeting”（我们正在开会），也可以是动词，如“we are meeting in my office”（我们将在我的办公室见面）。


    ### 10.3.1 文本挖掘


    文本挖掘或文本分析旨在自动从文本中提取信息。文本挖掘的应用数不胜完。文本挖掘用于文本分类、文本聚类、文档摘要或意见挖掘，但也存在许多其他用例。我们已经涵盖了垃圾邮件过滤，这是文本分类的一种应用。邮件被分为合法邮件和垃圾邮件。


    #### 情感分析


    情感分析也称为意见挖掘，是一项分析人们对产品、服务、组织、个人、问题、事件、主题及其属性等实体的观点、情感、评价、鉴定、态度和情绪的研究领域。公司广泛使用情感分析来确定产品或服务的受欢迎程度，以便进行改进。它也被用于政治领域，预测选举结果或确定电视节目或剧集的流行程度。随着社交媒体（如
    Twitter 或 Facebook）的出现，任何人在互联网上发布对电影或新产品的观点都变得非常简单。因此，分析社交媒体已成为许多领域的主流。社交媒体挖掘用于个性化广告或目标营销活动。它还被用于判断个人的信誉状况。如果一个贷款或抵押贷款的申请人有很多富有
    Facebook 朋友，他很可能也很富有并被认为具有信誉。


    情感分析使用自然语言处理方法来确定文本中的观点或情感。我们已经见过“词袋模型”（bag-of-words）方法。统计情感词，如“great”（极好的）、“excellent”（优秀的）和“poor”（糟糕的）。如果一个文本包含许多正面情感词，或者正面情感词多于负面情感词，它被视为正面评价。然而，词袋模型只考虑单个单词，无法处理情感极性反转器（sentiment
    polarity shifter）。情感极性反转器会将表达的意思改变为相反。例如，“the new Tesla is great”（新款特斯拉非常棒）是一个正面陈述，而“the
    new Tesla is not great”（新款特斯拉并不棒）是负面的。在这里，单词“not”充当了极性反转器。我们已经在 4.1.2 节中见过词袋模型，例如用于朴素贝叶斯垃圾邮件过滤。我们还见过一种更复杂的方法，使用
    n-grams 来捕捉单词之间的关系。使用 `tokenizer`（分词器）将文本分割为单词序列。如果我们有两个单词的序列，它们被称为双元词（bigrams），我们分析单词
    `X` 之后跟随单词 `Y` 的频率，就可以确定它们之间的关系。现在的一种方法是统计双元词并对双元词进行频率分析。如果我们有很多如“not great”（不棒）或“very
    bad”（非常糟糕）之类的双元词，该文本被视为负面评价。


    神经网络，特别是深度学习，已用于情感分析。深度学习的一个巨大优势是它们自动提取特征的能力，正如我们在第 8 章看到的。在使用浅层学习器（如多层感知器）时，我们必须手动提取特征。特征可能是单词的词性标记。在词性标记中，我们根据单词与文本中相邻及相关单词的关系，为该单词分配特定的词性。单词被识别为名词、动词、形容词等，以进行词类消歧。例如，单词“fly”当它是名词时指“昆虫”，当它是动词时指“飞行”。在分词和词性标记之后，提取词根（如果存在），并根据词根对单词进行分组，这一过程被称为词干还原（lemmatization）。单词“had”、“has”和“having”被归在一起，因为它们有相同的词根“have”。词元通过基于词根的单词组扩展了特征集。使用深度学习，这些步骤（如词干还原和词性标记）会自动完成的，这相对于浅层方法是一个巨大的优势。然而，深度学习需要大量的训练数据，而这些数据并不总是可用的。


    ## 10.4 其他应用


