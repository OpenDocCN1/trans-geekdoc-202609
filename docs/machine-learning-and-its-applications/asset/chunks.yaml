- raw: 'In machine learning, learning is a search through the space of possible representations
    to find the representation that best fits the data at hand. As such, learning
    can be considered a search. Machine in machine learning refers to the algorithm
    that performs the search. An algorithm is a combination of math and logic. Typically
    the search space is too large to be searched entirely. This is sometimes called
    the curse of dimensionality. Techniques such as dimensionality reduction can be
    used to alleviate the problem. There are also learning techniques that help improve
    the performance of a learning algorithm in high dimension.


    ## [9.1    Learning issues](#06_Contents.xhtml#sec9_1)


    Learning a representation is a compromise between many desiderata \[[31](#25_References.xhtml#ref31)\].
    The richer the representation, the more useful it usually is for subsequent problems.
    However, in order to create richer representations, a lot of data is required.
    Often, the availability of required data is a problem. Techniques such as cross-validation
    help to mitigate a data scarcity problem. Also, machine learning schemes are prone
    to over-fitting. “Fit” in a statistical sense means we seek the best description
    that fits the data reasonably well \[[40](#25_References.xhtml#ref40)\]. An overfitted
    model does not generalize well from training data to unseen data and captures
    noise instead of the underlying signal. Basically, the learned model is too closely
    tied to the particular training data from which it was built \[[40](#25_References.xhtml#ref40)\].
    An overfitted model is also called overtrained.


    In predictive modeling, the signal is the true underlying pattern that you want
    to learn from the data. Noise refers to irrelevant information or randomness in
    a dataset. When the representation cannot adequately capture the underlying structure
    of the data, it is called underfitted or underlearned. Underfitted models tend
    to have less variance in their predictions but more bias towards wrong predictions.
    Bias is the difference between the expected and the measured (observed) prediction.
    Variance is the sensitivity of the learning algorithm to specific data sets. A
    model with high variance will produce very different models depending on the training
    data set used. Learners with low variance and high bias tend to be simpler, but
    have a rigid underlying structure. Naïve Bayes or regression models fall into
    this category. On the other hand, learners with low bias and high variance tend
    to be more complex, but have a more flexible underlying structure. Decision trees
    with high depth and k-nearest neighbor learners fall into this category. This
    tradeoff in complexity is called bias-variance tradeoff, since a learner cannot
    be complex and simple at the same time. Ensemble learners tend to have less bias
    and variance errors.


    ### [9.1.1    Bias-variance tradeoff](#06_Contents.xhtml#sec9_1_1)


    The bias-variance tradeoff is a fundamental problem of supervised learning and
    applies for classification and regression. It is the problem of reducing two sources
    of error, bias and variance, simultaneously. To find a good balance between bias
    and variance, a good predictive model reduces the total error. The total error
    is defined as:


    | *T**o**t**a**l* *e**r**r**o**r* = *B**i**a**s*² + *V**a**r**i**a**n**c**e* + *I**r**r**e**d**u**c**i**b**l**e* *e**r**r**o**r*
    || (9.1) |


    | --- | --- |


    where


    |  Bias || \= Deviation between the expected and the actual value |


    | --- | --- |


    |  Variance || \= Variance is error from sensitivity to small fluctuations in
    the training set |


    |  Irreducible || \= Irreducible error is the noise term in the true relationship
    |


    Bias refers to model error and variance refers to the consistency in predictive
    accuracy of models applied to other data sets \[[1](#25_References.xhtml#ref1)\].
    The irreducible error, also called noise, cannot fundamentally be reduced during
    training by any model. It can be reduced sometimes by performing better data pre-processing
    steps, usually better data cleansing. The irreducible error stems from the data
    itself, bias and variance from the choice of the learning algorithm. With infinite
    training data it should be possible to reduce bias and variance towards 0 (asymptotic
    consistency and asymptotic efficiency). However, some learners are not capable
    of fitting a model even if enough data is available. For instance, algorithms
    that linearly separate the data, such as the perceptron, cannot fit data that
    has a non linear pattern. [Figure 9.1](#21_Chapter09.xhtml#fig9_1) shows data
    that can and cannot be fitted using a linear algorithm.


    Bias and variance are two independent criteria for assessing the quality of a
    learner. Ideally, we want low bias and low variance. However, this is difficult
    to achieve simultaneously. Unfortunately, low bias on training data usually means
    high variance because the model was overfit. Low variance usually comes with the
    cost of high bias. For instance, when training a k-Nearest Neighbor learner, a
    small value for k provides the most flexible fit, which will have low bias but
    high variance \[[14](#25_References.xhtml#ref14)\]. The high variance is due to
    the fact that a low k means a prediction in a region depends on only one observation.
    The mean squared error (MSE) loss function that we have seen in [Chapter 2](#11_Chapter02.xhtml)
    in [equation 2.9](#11_Chapter02.xhtml#eq2_9) combines bias and variance, which
    makes it a very good evaluation method. The mean squared error is equal to the
    sum of the variance and the squared bias of the estimator. It can be partitioned
    in bias and variance, as shown in [equation 9.2](#21_Chapter09.xhtml#eq9_2).


    ![Figure 9.1: Linear fitting.](images/fig9_1.jpg)


    **[Figure 9.1:](#07_ListofFig.xhtml#fig9_1)** Linear fitting.


    | *M**S**E* = *B**i**a**s*² + *V**a**r**i**a**n**c**e* || (9.2) |


    | --- | --- |


    where


    |  Bias || \= Error from wrong assumptions of the model |


    | --- | --- |


    |  Variance || \= Variance is error from sensitivity to small fluctuations in
    the training set |


    Since we cannot reduce bias and variance at the same time, we need to find an
    optimal balance, as shown in [Figure 9.2](#21_Chapter09.xhtml#fig9_2). There are
    several strategies to manage bias and variance. Simplifying the model can decrease
    variance, for instance through feature selection or dimensionality reduction.
    Also, using a larger training set tends to decrease variance.


    As mentioned before, different learners often behave very differently and one
    key differentiator is how much bias and variance they produce. That is why usually
    several learners are trained and evaluated to find the best suitable algorithm
    for the problem. Another approach is using  ensembling. Bagging is a simple yet
    powerful ensemble method. It is a general procedure that can also be used to reduce
    variance. Bagging, short for bootstrap aggregating, is a resampling technique
    where different training sets are created using random selection with replacement
    (meaning we can select an instance multiple times). Each sample is used to train
    a model. The predicted values are then combined through averaging and majority-voting.
    Although bagging was first developed for decision trees, the idea can be applied
    to any algorithm that produces predictions with sufficient variation in the predicted
    values \[[1](#25_References.xhtml#ref1)\]. To get good bagged ensemblers, the
    individual models are overfit, meaning the bias is low. Bagging is reducing variance
    by averaging the predictions. Bagging can be considered a variance reduction technique.
    Another feature of bagging is that the resulting model uses the entire feature
    space for node splits. The biggest weakness of bagging is that it might produce
    correlated trees, thereby increasing bias and reducing variance. Random forests,
    that were discussed in [Chapter 4](#14_Chapter04.xhtml), are a simple yet effective
    way to avoid inter-tree correlations.'
