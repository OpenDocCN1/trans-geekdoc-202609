- raw: 'Not all data points in [Figure 2.6](#11_Chapter02.xhtml#fig2_6) are correctly
    separated by the decision boundary. Some points are on the wrong side of the line.
    This reflects the fact that machine learning algorithms often return an approximation,
    not a perfect separation. A classifier that perfectly separates the training data
    points often does not work well on new data. A learner needs to generalize in
    order to work on data other than the training data. Otherwise, we have an overfit
    learner.


    ![Figure 2.5: Activation functions.](images/fig2_5.jpg)


    **[Figure 2.5:](#07_ListofFig.xhtml#fig2_5)** Activation functions.


    ![Figure 2.6: Linear and nonlinear fitting.](images/fig2_6.jpg)


    **[Figure 2.6:](#07_ListofFig.xhtml#fig2_6)** Linear and nonlinear fitting.


    The planes in [Figure 2.6](#11_Chapter02.xhtml#fig2_6) have just two dimensions.
    Coordinate systems with more than two dimensions are needed when there is more
    than one feature. This depends on the input vector and on the learner that is
    being used. For better presentability, we will often use just two dimensions,
    even if more are possible or needed.


    ## [2.2    Unsupervised learning](#06_Contents.xhtml#sec2_2)


    In supervised learning, we have input and output data. In unsupervised learning,
    we do not have labeled training data. In other words, we only have input data,
    no output data, i.e., there is no *y*. Instead of predicting or approximating
    a variable, we try to group the data into different classes. For instance, we
    have a population of online shop users that we try to segment into different types
    of buyers. The types could be social shopper, lifestyle junkie and detached introvert.
    In this case, we have three clusters. If an observation point can only belong
    to one cluster, it is an exclusive cluster, if it is allowed to be part of more
    than one cluster, it is a non-exclusive cluster, in other words, the clusters
    can be overlapping.


    Let *N* be a set of unlabeled instances *D* = *x*[1],*x*[2], …, *x[N]* in a *d*\-dimensional
    feature space, in clustering *D* is partitioned into a number of disjoint subsets
    *D[j]*s:


    | $D = \\cup\_{j = 1}^{k}D\_{j}$ || (2.5) |


    | --- | --- |


    where


     *D[i]* ∩ *D[j]* = ∅


     *i* ≠ *j*


    The points in each subset *D[j]* are similar to each other according to a given
    criterion ∅. Similarity is usually expressed by some distance measure, such as
    the Euclidean distance or Manhattan distance.


    Cluster analysis can be used for understanding the underlying structure of a dataset
    by grouping it into classes based on similarities. Grouping similar objects into
    conceptually meaningful classes has many real-life applications. For instance,
    biologists spent a considerable amount of time on grouping plants and animals
    into classes, such as rodents, canines, felines, ruminants, marsupials, etc. Clustering
    is also used for information retrieval, for instance, by grouping Web search results
    into categories, such as news, social media, blogs, forums, marketing, etc. Each
    category can then be divided into subcategories. For example, news is divided
    into politics, economics, sports, etc. This process is called hierarchical clustering.
    Humans, even young children, are skilled at grouping objects into their corresponding
    classes. This capability is important to humans for understanding and describing
    the world around us. This is crucial for our survival. We need to know which groups
    of animals are harmful or which traffic situations are potentially dangerous.


    Cluster analysis can also be used as an intermediate step for other data analysis
    tasks, such as outlier removal, data summarization, data compression or as input
    for other machine learning algorithms, such as the k-nearest neighbor algorithm.
    In data summarization, instead of applying a machine learning algorithm to the
    entire data set, it can be applied to each cluster individually, thus, reducing
    processing power and time. This can speed up computing time for machine learning
    schemes, such as k-nearest neighbor. Outliers can have a negative impact on some
    algorithms, e.g., regression models. Clustering can be used as a preliminary step
    for outlier removal in regression analysis.


    ### [2.2.1    k-means clustering](#06_Contents.xhtml#sec2_2_1)


    k-means clustering is one of the most popular cluster and machine learning algorithm.
    k-means clustering falls into the category of centroid-based algorithms. A centroid
    is the geometric center of a geometric plane figure. The centroid is also called
    barycenter. In centroid-based clustering, *n* observations are grouped into *k*
    clusters in such a way that each observation belongs to the cluster with the nearest
    centroid. Here, the criterion for clustering is distance. The centroid itself
    does not need to be an observation point. [Figure 2.7](#11_Chapter02.xhtml#fig2_7)
    shows k-means clustering with 3 clusters.


    In k-means clustering, the number of clusters *k* needs to be defined beforehand,
    which is sometimes a problem since the number of clusters might not be known beforehand.
    For instance, in biology, if we want to classify plants given their features,
    we might not know how many different types of plants there are in a given data
    set. Other clustering methods, such as hierarchical clustering, do not need an
    assumption on the number of clusters. Also, there is no absolute criterion; it
    has to be defined by the user in such a way that the result of the clustering
    will suite the aim of the analytics task at hand. Cluster analysis is often just
    the starting point for other purposes, for instance a pre-processing step for
    other algorithms.


    ![Figure 2.7: k-means clustering.](images/fig2_7.jpg)


    **[Figure 2.7:](#07_ListofFig.xhtml#fig2_7)** k-means clustering.


    Humans and animals learn mostly from experience, not from labeled data. Humans
    discover the world by observing it, not by being told the label of every object.
    So, human learning is largely unsupervised. That is why some authors argue that
    unsupervised learning will become fare more important than supervised learning
    in the future \[[18](#25_References.xhtml#ref18)\].


    ## [2.3    Semi-supervised learning](#06_Contents.xhtml#sec2_3)


    Semi-supervised learning uses a combination of labeled and unlabeled data. It
    is typically used when a small amount of labeled data and a large amount of unlabeled
    data is present. Since semi-supervised learning still requires labeled data, it
    can be considered a subset of supervised learning. However, other forms of partial
    supervision other than classification are possible.


    Data is often labeled by a data scientist, which is a laborious task and bares
    the risk of introducing a human bias. Bias stems from human prejudice that, in
    the case of labeling data, might result in the under-or overrepresentation of
    some features in the data set. Machine learning heavily depends on the quality
    of the data. If the data set is biased, the result of the machine learning task
    will be biased. However, human bias cannot only negatively influence machine learning
    through data but also through algorithms and interaction. Human bias does not
    need to be conscious. It can originate from ignorance, for instance, an under-representation
    of minorities in a sample population or from a lack of data that includes minorities.
    Generally speaking, training data should equally represent all our world.'
