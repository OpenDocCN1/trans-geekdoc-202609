    ## 前言


    人工智能或 `AI`，特别是机器学习，由于我们在该领域看到的快速进展，在媒体中受到了广泛关注。自新世纪初以来，机器学习获得了巨大的动力，我们在许多研究领域和实践中看到了惊人的新应用。互联网使得前所未有的数据公开可用，机器学习在实践中经历了大量的研究。


    机器学习被用于垃圾邮件过滤、医学图像分析、语音命令、自动驾驶汽车以及分析物联网的传感器数据等（仅列举部分）。现在每部高端智能手机都支持 AI。深度学习被用于预测地震、自动语言翻译、黑白电影自动上色以及金融预测。火星探测器“好奇号”利用人工智能高精度地自主选择具有检查价值的土壤和岩石样本。此类比比。


    最近，机器学习还引起了大量关注，由于是人们担心工作被机器取代、自主系统的危险（例如可能变坏的机器人）、对生存基础设施控制权的丧失，甚至由于人工智能引发战争的担忧。然而，需要注意的是，人工智能正如其名，是人工的，与人类智能无关。机器可能能够识别图片中的动物是狮子还是老虎，但它无法理解其所识别内容背后的概念，即它不理解“生命”的概念。深度学习器本质上是一个巨大的数学公式。它与人类大脑的工作方式（即执行生化过程的地方）无关。人工神经网络受自然启发。它包含了我们对大脑工作方式的一丝理解，并结合了大量的数学。在我们对大脑有更好的了解之前，机器取代医生诊断患者或取代律师判处罪犯的愿景可能还太过早了。


    '
