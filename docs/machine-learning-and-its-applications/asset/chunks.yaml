    Once the difference of the sum the squared errors between two consecutive iterations
    of the k-means algorithm is smaller than a specified value, the process stops.


    A few remarks: k-means is not restricted to Euclidean spaces. k-means clustering
    is a very general clustering algorithm that can be used for a very wide variety
    of data types, including document data and time series. k-means is very sensitive
    to the initial centroids. It can produce different results on the same data set
    for different initial centroids. A way to mitigate this problem is to run k-means
    several times and select the run that produced the best result based on the objective
    function or the cluster assignment that is mostly observed. Another approach is
    to first randomly select a sample data set and use hierarchical clustering to
    determine the number of *k*.


    Since k-means assigns the instances to the closest centroid, the clusters form
    a hyper-sphere, in other words, they are globular in shape with the centroid being
    the center. k-means clustering does not work well for clusters that are nonspherical.
    Pre-processing the data set using transformations can be used to solve this problem.


    ## [6.3    Hierarchical clustering](#06_Contents.xhtml#sec6_3)


    Hierarchical clustering, also called hierarchical cluster analysis (HCA), is a
    collection of closely-related cluster algorithms that build hierarchies of clusters.
    Hierarchical clustering does not only partition the data, it also depicts the
    relationships among the clusters. There are two basic approaches, agglomerative
    and divisive clustering. Agglomerative clustering follows a bottom-up strategy,
    where each instance starts as its own cluster. Each data point is fused with one
    or more other points to form larger clusters based on similarity. In the last
    step, we end up with one cluster containing all instances. Divisive clustering
    is a top-down approach and works in the opposite way. The clustering starts with
    one single cluster that is divided into subclusters. The subclusters are further
    subdivided in the next iterations until each data point is in its own cluster.
    Divisive clustering does not need to go through all iterations and can halt once
    a stop criterion is met. The two approaches are shown in [Figure 6.2](#16_Chapter06.xhtml#fig6_2).
    Agglomerative approaches tend to be simpler to implement programmatically, whereas
    divisive approaches seem to be closer to how the human brain works. In practice,
    agglomerative clustering is more widely used.


    ![Figure 6.2: Agglomerative and divisive clustering.](images/fig6_2.jpg)


    **[Figure 6.2:](#07_ListofFig.xhtml#fig6_2)** Agglomerative and divisive clustering.


    ![Figure 6.3: Single, complete and average linkage.](images/fig6_3.jpg)


    **[Figure 6.3:](#07_ListofFig.xhtml#fig6_3)** Single, complete and average linkage.


    Before any clustering can be performed, the distance of each data point has to
    be determined using a distance function. The distances are stored in a proximity
    matrix. In each iteration, the proximity matrix has to be updated with the distances
    between each cluster. The distance between two clusters can be determined by measuring
    the distance of the two most similar points in each cluster. This is called single
    linkage or nearest neighbor. In complete linkage or farthest neighbor the two
    data points that are furthest apart in each cluster, in other words, that have
    the greatest distance, are measured. In average linkage, the distance between
    each data point in one cluster with all the data points in the other cluster is
    measured. The three methods are shown in [Figure 6.3](#16_Chapter06.xhtml#fig6_3).


    There is no theoretical justification for the selection of the linkage method.
    The choice should be made based on the domain of the application. Also, as with
    virtually any machine learning technique, there are variations and other methods
    exist. In practice, the Ward method is widely applied. Ward’s method uses the
    increase in the squared error that results when two clusters merge as proximity
    measure. It uses an objective function approach and an agglomerative hierarchical
    cluster algorithm. It uses the same objective function that we have seen in [equation
    6.2](#16_Chapter06.xhtml#eq6_2) for k-means clustering. In each iteration, the
    pair of clusters that produce the minimum increase in intracluster variance are
    merged. Variance is measured by the sum of squared errors. The sum of squares
    starts out as zero since every data point is in its own cluster. It increases
    as clusters grow. Ward’s method aims to keep the growth as small as possible.
    To select a new cluster, every combination must be considered, what makes Ward’s
    method computationally expensive. However, it still requires significantly less
    computation than other methods.


    The basic agglomerative hierarchical clustering algorithm is described in algorithm
    6.2


    Algorithm 6.2 Agglomerative hierarchical clustering algorithm


    1: *Calculate the proximity matric*


    2: ***repeat***


    3:  *Merge the two closest clusters*


    4:  *Calculate the proximities of the new clusters and update the proximity matrix*


    5: ***until*** *only one cluster remains*


    ## [6.4    Visualizing clusters](#06_Contents.xhtml#sec6_4)


    A hierarchical cluster is often displayed graphically as a dendrogram, a tree-like
    diagram, as shown in [Figure 6.4](#16_Chapter06.xhtml#fig6_4). A dendrogram shows
    the clusters, their relationships and the order in which they were fused or split.


    A dendrogram can be cut at a certain level to create individual clusters. However,
    the dendrogram cannot be used to determine the number of clusters. It can often
    suggest a correct number. In the library example, the user has to define where
    to make the cut. It might be enough to have one cluster with history books. If
    there are too many history books it might make sense to use subclusters such as
    “Ancient world”, “Middle ages” and “Modern age” and put them in different shelves.


    ![Figure 6.4: Dendrogram clustering.](images/fig6_4.jpg)


    **[Figure 6.4:](#07_ListofFig.xhtml#fig6_4)** Dendrogram clustering.


