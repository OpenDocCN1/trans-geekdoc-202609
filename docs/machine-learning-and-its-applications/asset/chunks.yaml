    [4.2.2    Polynomial regression](#14_Chapter04.xhtml#sec4_2_2)


    [4.3    Logistic regression](#14_Chapter04.xhtml#sec4_3)


    In this chapter, supervised learning methods to make predictions are considered.
    “Supervised” refers to the fact that labeled training data is required. For instance,
    for classifying news articles into different categories such as “Politics”, “Business”,
    “Sports”, etc., the learner is trained with a set of pre-classified, labeled,
    news articles. The categories are called “labels”. During training, the learner
    creates an internal representation that represents a generalization of the training
    data. The process of creating internal representations is called induction. If
    no labeled training data is present, unsupervised learning applies. When using
    unsupervised methods, the learner must discover the categories during training.
    If a small amount of labeled data and a large amount of unlabeled data is present,
    semi-supervised learning methods can be used. Typical supervised learning algorithms
    include artificial neural networks, support vector machines, k-nearest neighbor
    (k-NN), Bayesian models or decision tree induction. Typical unsupervised learning
    algorithms include hierarchical clustering and k-means clustering. Since there
    is no labeled data in unsupervised learning, the accuracy of the trained learner
    cannot be evaluated. Measures such as density estimation or well separateness
    are used instead. The majority of machine learning projects use supervised methods.


    In machine learning, an algorithm is a repeatable process to obtain a trained
    model given a set of data. Each algorithm behaves very differently and can be
    effective for different problems. One of the key distinctions of supervised learning
    algorithms is how much bias and variance they produce. These are called prediction
    errors. Bias is the difference between the expected and the actual, measured prediction.
    Variance refers to an algorithms sensitivity to a particular set of training data.
    During training, both errors, bias and variance, are reduced until they converge.
    A third prediction error, the irreducible error, stems from noise in the data
    or randomness. It cannot be reduced during training. However, better data cleansing
    steps might diminish the irreducible error in some cases.


    Supervised learning is used for classification and regression. Classification
    is used when the target features are discrete, regression is used when the target
    features are continuous. For instance, predicting tomorrows weather is a classification
    task. The classes could be “sunny”, “rainy”, “snowy”, etc. Predicting how many
    millimeters it will rain tomorrow is a regression task. In this example, the amount
    of rain is the dependent variable, whereas the input variables, e.g., barometric
    pressure, are the independent variables or predictors. Typically, many supervised
    learning schemes (but not all) calculate probabilities, e.g., the probability
    that it is going to rain tomorrow.


    The majority of analytic problems are addressed using classification techniques,
    since they can be applied to support decision making. For instance, should we
    contact a specific customer in a marketing campaign or should we invest in a certain
    startup are typical classification problems. Some machine learning techniques,
    such as k-nearest neighbor, can be used for both classification and regression.


    Supervised learning requires, next to training data:


    ▪  Input features


    ▪  Target features


    ▪  Measure of improvement


    The input features, typically represented as an input vector, are extracted from
    the training data. The target feature(s) is the output or response variable(s).
    The measure of improvement is used to determine if we are getting better in every
    learning cycle. During training, the machine learning scheme learns to map the
    input features to target features. In other words, the internal representation
    of the learner is adjusted until the desired accuracy is reached. Often, the mapping
    is an approximation and 100% accuracy is not achieved. Accuracy is a performance
    metric for a learner. Many other evaluators exist, such as precision and recall
    or the receiver operating characteristic. Some will be discussed in [section 5.1](#15_Chapter05.xhtml#sec5_1).


    A full training cycle typically goes through the following steps:


    1.  Data collection


    2.  Data pre-processing


    3.  Training a machine learning algorithm, i.e., fitting model parameters


    4.  Testing/evaluating trained learning scheme


    5.  Measuring error


    Training a machine learning algorithm is an iterative process and typically goes
    through many iterations until satisfactory results are obtained. Also, often several
    machine learning algorithms are trained and evaluated. The best performing model
    is then used to make predictions on new, unseen data. Usually, it is good practice
    to start with a simple model, such as a Bayesian model or the k-nearest neighbor
    learner, that can then be used as benchmark. If the results are not satisfactory,
    more sophisticated learning schemes can be trained and evaluated. If two learners
    perform equally well, the simpler one should be chosen in accordance with the
    Occam’s razor principle. The Occam’s razor principle states that if two problem
    solving solutions exist, the simpler one should be chosen. The ultimate goal is
    to have a model that isolates the signal and ignores the noise. How closely a
    models predicted values match the observed values is referred to as goodness of
    fit.


    ## [4.1    Classification](#06_Contents.xhtml#sec4_1)


    In classification, we try to assign a label to a test instance, e.g., we try to
    predict if the animal in a picture is a “cat” or a “dog”. In other words, we assign
    a new observation to a specific category. The learning algorithm that assigns
    the instance to a category is called classifier. Classification answers questions
    such as: “is that bank client going to repay the loan?”, “will the user who clicked
    on an ad buy?”, “who is the person in the Facebook picture?”. Classification predicts
    a discrete target label *y*. If there are two labels such as “spam” / “not spam”,
    we have a binary classification problem, if there are more labels, we have a multiclass
    classification problem, e.g., assigning blood samples to the blood types “A”,
    “B”, “AB” and “O”.


    A classifier learns a function *f* that maps an input *x* to an output *y*, as
    shown in [equation 4.1](#14_Chapter04.xhtml#eq4_1). Sometimes, the function *f*
    is referred to as classifier instead of the algorithm that implements the classifier.


    | *y* = *f*(*x*) + *ε* || (4.1) |


    | --- | --- |


    where


    |  *f* || \= Function that maps *x* to *y*, learned from labeled training data
    |


    | --- | --- |


    |  *x* || \= Input, independent variable |


    |  *y* || \= Output, dependent variable, predicted from unlabeled testing data
    |


    |  *ε* || \= Epsilon, irreducible error |


    *ε* is the irreducible error that stems from noise and randomness in the training
    data and that, as the name suggests, cannot be reduced during training. It can
    be reduced in some cases through more data preprocessing steps, however, *ε* is
    a theoretical limit of the performance of the learning algorithm.


    Typical classifiers include Bayesian models, decision trees, support vector machines
    and artificial neural networks.


    ### [4.1.1    Artificial neural networks](#06_Contents.xhtml#sec4_1_1)'
