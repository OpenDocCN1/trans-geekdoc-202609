- raw: '![Figure 5.3: Multiclass confusion matrix.](images/fig5_3.jpg)


    **[Figure 5.3:](#07_ListofFig.xhtml#fig5_3)** Multiclass confusion matrix.


    There are other variants. A confusion matrix can contain the micro-averaged results
    which are the sum of the results in the one-versus-all matrices. If we divide
    the sum of the elements on the leading diagonal by the sum of all of the elements
    in the matrix, which gives the fraction of correct responses, we get the accuracy
    \[[25](#25_References.xhtml#ref25)\]. We can then define accuracy as the sum of
    the number of true positives and true negatives divided by the total number of
    examples as shown in [equation 5.5](#15_Chapter05.xhtml#eq5_5).


    | $Recall = \\frac{TP + TF}{TP + FP + TN + FN}$ || (5.5) |


    | --- | --- |


    We have already seen that accuracy is not giving us the complete picture of how
    well a classifier performs and we can use precision and recall to help us interpret
    the result. Another useful metric is the receiver operator characteristic.


    ### [5.1.4    Receiver operating characteristic](#06_Contents.xhtml#sec5_1_4)


    The receiver operating characteristic (ROC) is a plot of the true positive rate,
    also called sensitivity or recall, in function of the false positive rate, also
    called specificity. It is used to measure the performance of a binary classifier
    at various threshold settings. The true positive rate is the sensitivity or recall
    as defined by [equation 5.3](#15_Chapter05.xhtml#eq5_3). The false positive rate
    is 1–*specificity*, where specificity is defined as is [equation 5.6](#15_Chapter05.xhtml#eq5_6):


    | $Specificity = \\frac{TN}{TN + FP}$ || (5.6) |


    | --- | --- |


    The false positive rate is then defined as in [equation 5.7](#15_Chapter05.xhtml#eq5_7):


    | $FPR = 1 - Specificity = \\frac{FP}{TN + FP}$ || (5.7) |


    | --- | --- |


    For a perfect classifier, the receiver operating characteristic curve will move
    up straight along the y axis untill it reaches *y* = 1, then along the x axis
    (100% sensitivity, 100% specificity). If the receiver operating characteristic
    curve is the diagonal, the values are purely random. Each point on the receiver
    operating characteristic curve represents a sensitivity/specificity pair corresponding
    to a particular decision threshold. Normally, the curve lies somewhere above the
    diagonal. The closer the curve is to the upper left corner the higher the accuracy
    of the classifier. [Figure 5.4](#15_Chapter05.xhtml#fig5_4) shows a receiver operating
    characteristic curve. It is also called area under the curve (AUC) or AUC-ROC.
    The area under the curve is the probability that a classifier will score a randomly
    selected data point higher from a randomly selected negative one. By looking at
    [Figure 5.4](#15_Chapter05.xhtml#fig5_4), the receiver operating characteristic
    curve can be used to select a threshold which maximises the true positives, while
    minimising the false positives.


    ![Figure 5.4: Receiver operating characteristic.](images/fig5_4.jpg)


    **[Figure 5.4:](#07_ListofFig.xhtml#fig5_4)** Receiver operating characteristic.


    The receiver operating characteristic curve lets us evaluate the performance of
    a classifier over its entire operating range. Most often in machine learning,
    the receiver operating characteristic curve is used to compare statistical models.
    A single threshold can be used to compare the performance of two or more classifiers
    at that point, or the entire curve can be compared. A receiver operating characteristic
    curve of less than 0.5 might indicate that the classifier finds relationships
    that are the opposite of what we expect and the experiment might have been set
    up incorrectly.


    Using the receiver operating characteristic curve to diagnose classifiers with
    more than two classes requires more dimensions and complexity increases dramatically.
    Some efforts have been made using receiver operating characteristic curves for
    three classes called three-way ROC. Due to the popularity of receiver operating
    characteristic curves, efforts have been made to use receiver operating characteristic
    curves to asses other supervised models. Namely, receiver operating characteristic
    for regression models, called regression error characteristic (REC) curves and
    regression ROC (RROC) curves, have been proposed.


    # [Chapter 6](#06_Contents.xhtml#ch6)


    # [Unsupervised Learning](#06_Contents.xhtml#ch6)


    **CONTENTS**


    [6.1    Types of clustering](#16_Chapter06.xhtml#sec6_1)


    [6.1.1    Centroid, medoid and prototype-based clustering](#16_Chapter06.xhtml#sec6_1_1)


    [6.1.2    Density-based clustering](#16_Chapter06.xhtml#sec6_1_2)


    [6.2    k-means clustering](#16_Chapter06.xhtml#sec6_2)


    [6.3    Hierarchical clustering](#16_Chapter06.xhtml#sec6_3)


    [6.4    Visualizing clusters](#16_Chapter06.xhtml#sec6_4)


    [6.5    Evaluation of clusters](#16_Chapter06.xhtml#sec6_5)


    [6.5.1    Silhouette coefficient](#16_Chapter06.xhtml#sec6_5_1)


    Unsupervised learning methods are used when there is no labeled data. In other
    words, there is no ground truth. The most widely used unsupervised method is clustering.
    Instead of predicting a class as we do with supervised learning, clustering partitions
    data points into groups based on some similarity measure. In clustering, the goal
    is to understand data by finding the underlying structure in the data set. Since
    there is no ground truth in clustering, the evaluation of a cluster is more challenging
    than evaluating supervised learners. For instance, in a library, books are grouped
    into fiction, children’s books, travel books, cooking books, etc. The similarity
    is the subject of the books. However, children’s books are often fictional too
    and might belong to more than one cluster. It is not always obvious how to measure
    the performance of a cluster algorithm and the measurement is often subjective.
    The clusters have to be useful for the problem at hand. In the library example,
    clustering is useful if it helps in finding books more easily in a library.


    We can use clustering to understand data, but we can also use clustering as a
    starting point for other data mining tasks. For instance, if a data set is too
    large to be processed efficiently, clustering can be used for data summarization.
    Data is grouped in clusters based on similarity to a cluster prototype. A prototype
    is often a medoid, the most representative object in a cluster. Each cluster prototype
    is then presented to the data analysis algorithm separately, instead of the whole
    data set. If many instances in a data set are highly similar, clustering can be
    used for data compression. Instead of analyzing the whole data set, each cluster
    prototype is assigned an index that is tabulated. The data is compressed whilst
    maintaining its structure and usefulness. Compression can be used if a substantial
    reduction in data size is required and some information loss is acceptable.'
