  trans: '

    一旦受限玻尔兹曼机（RBM）训练完成，隐藏层的激活值将成为下一个隐藏层的输入。第二个隐藏层将不断训练，直到它能够近似上一个隐藏层的输入。这种在受限玻尔兹曼机中逐步训练隐藏层的方法是最常见的深度学习策略之一，因为它允许高效地训练许多隐藏层。它是无监督的，因为训练时不需要标记数据。这种多层网络的顺序构建方法允许通过创建特征层级结构来学习更复杂的表示。预训练的多层受限玻尔兹曼机构成了深度信念网络的基础。随后，可以使用监督学习对预训练的深度信念网络进行训练，例如用于分类。通过初始化权重预训练网络是受限玻尔兹曼机的主要用例之一。


    ## 8.5 深度信念网络


    深度信念网络（DBN）是上一章介绍的受限玻尔兹曼机的序列。它是一种深度学习器，由多个隐藏层组成，层与层之间以及层之间存在连接，但层内部没有连接。与受限玻尔兹曼机一样，它可以学习重建其输入。分层架构允许快速的无监督训练。预训练的深度信念网络是一种无监督预训练网络。每一层都充当特征检测器。一旦训练完成，就可以以监督的方式进一步训练，以创建一个分类器。深度信念网络最后可能会以输出层结束，例如
    softmax 层或 logit 层，用于分类。深度信念网络可以以贪心的方式进行训练，即每层都单独训练。每个隐藏层都成为下一个隐藏层的可见层。


    深度信念网络有很多用例。深度信念网络可以用于分类、图像识别或图像生成。它也可以用于聚类。在这种情况下，没有输出层。深度信念网络的其他用例是视频序列和动作捕获数据生成。在实践中，深度信念网络有许多现实应用。它们被用于分类高分辨率卫星图像或医学图像、药物发现或分析脑电图。


    深度信念网络接受二进制输入作为数据。其扩展版本连续深度信念网络也接受连续的十进制。


    ## 8.6 深度自动编码器


    自动编码器是一种用于以无监督方式学习数据集表示（编码）的网络。自动编码器将数据压缩为代码，然后再次解压缩为接近输入的内容。通过这种方式，它被训练为忽略数据中的噪声。自动编码器同时学习压缩输入（即编码）和重建输入。近年来，自动编码器变得流行，因为它们被包含在许多强大的深度学习架构中。它们通常被用于降维。自动编码器也可以作为生成模型。学习到的代码可以用于构建自动编码器从未见过的事物的图像。


    在最简单的形式，自动编码器是一个具有输入、输出和一个隐藏层的前馈网络。输入层和输出层具有相同数量的神经元。自动编码器总是对输入进行编码和解码。自动编码器尝试学习函数
    `h`使得 `hW,b` ≈ `x`，其中参数 `W` 是权重，`b` 是偏置。换句话说，它们试图近似恒等函数。恒等函数总是返回作为参数传递给函数的相同值。自动编码器通过最小化损失函数（如平方误差）以无监督的方式进行训练。如果隐藏层大于输入层，自动编码器就可以学习恒等函数并完全重建输入。


    深度自动编码器由两个对称的深度信念网络组成。它们能够压缩数据（如图像）。它们也可以用于主题建模。主题建模是发现一组文档中一个或多个主题的过程。


    深度自动编码器由一个编码部分和一个对称的解码部分组成。每个部分由一个或多个深度信念网络组成。[图 8.8]显示了简单的深度自动编码器架构。


    自动编码器接受二进制数据作为输入（例如像素数组），但也可以使用实值数据作为输入。如果输入是 `32*32 = 1024` 像素的图像，输入层应包含大约 1200
    个单元，由于 sigmoid 玻尔兹曼单元的容量有限，这比 1024 个输入像素略大。随后的单元数量将类似于 600、300、150 和 50，其中 50
    是输入图像的编码版本。它是带有压缩表示的潜向量。潜变量无法直接观测，它们是从观测变量推断出来的。自动编码器的解码部分由相同数量的层和节点组成，但顺序相反。它接受压缩向量作为输入并学习如何重建图像。还有隐藏向量大于输入层的变体。如果隐藏代码小于输入的维度，则认为自动编码器是欠完全的（undercomplete）。如果更大，则被称为过完全的（overcomplete）。


    ![Figure 8.8: Deep autoencoder.](img/fig8_8.jpg)


    **[图 8.8:]** 深度自动编码器。


    自动编码器可以被视为前馈网络的特殊情况，并可以使用所有相同的技术进行训练，通常是跟随通过反向传播计算的梯度进行小批量梯度下降 [8]。学习通过最小化损失函数
    `L` 实现，描述如方程 8.5 所示：


    ```

    L(x,g(f(x)))

    ```


    通过惩罚 `g(f(x))` 与 `x` 不同来实现。


    通常，在使用自动编码器时，我们感兴趣的不是输出，而是压缩表示的属性。该表示可以用于主题建模，但对文档的信息检索也很有用，因为隐藏代码包含了最显著的特征。它们还用于图像搜索引擎。当一个图像的隐藏代码与另一个图像的隐藏代码相似时，它会被翻译为匹配的图像并返回。自动编码器为了卷积卷积（ConvNets）作为编码和解码网络，而不是深度信念网络。

    '
