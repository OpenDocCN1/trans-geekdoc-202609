    \ a robust solution without machine learning. \n\n[content]\nBefore a machine\
    \ learning project is started, the following conditions should be verified:\n\n\
    - There is an infrastructure to conduct a machine learning project\n"
  trans: '

    强化学习是一种逐步进的方法，如图 9.3 所示，在每个时间步 `t`，智能体可以从可用动作集中选择一个动作 `a`。智能体通过一系列状态-动作对，直到预测出智能体可以采取的最佳路径。该预测被建模为一个称为“策略”（policy）的映射。在每个时间步
    `t`，与智能体交互的环境会在时间步 `t+1` 移动到状态 `s`，并计算转移到新状态的奖励 `r`。奖励可以是正的也可以是负的。奖励是通过奖励函数计算的，该函数将智能体的状态和动作作为输入，并映射到可能的奖励。智能体的目标是针对任何状态选择最好的动作，并收集尽可能多的奖励。动作的选择方式对学习者的性能至关重要。


    强化学习可以与神经网络结合，并且近年来与深度学习器结合时取得了巨大成功。深度学习器是在输入层和输出层之间具有许多隐藏层的神经网络。强化学习与深度学习的结合已成功应用于许多问题，例如玩游戏、机器翻译和机器人控制。


    ## 9.5 主动学习 (#06_Contents.xhtml#sec9_5)


    主动学习是一种在线学习的形式，智能体通过采取行动来获取有用的示例进行学习 [31]。主动学习是一种迭代的监督学习类型，适用于数据丰富但类别标签稀缺或获取成本高昂的情况
    [10]。它是学习中的一种特殊情况，学习者可以主动查询用户或其他信息源以获取标签。主动学习背后的想法是，如果学习算法能够自己选择想要学习的数据，它的表现将会更好。由于是学习者选择了呈现给用户的示例，示例的数量可以远少于监督学习所需的数量。主动学习是一种有助于自动识别具有信息量的未标记示例的方法
    [23]。


    在主动学习中，会随机选择未标记数据的一个小子集并人工标注。根据目前为止已标注的数据，新实例被提交给用户进行标注。学习者可以从随机采样中选择优越的数据点。这一过程不断重复，直到找不到更多有用的实例为止。


    主动学习的优势在于，算法可以选择要标注的示例，随后比从底层分布中随机选择样本的方法用更少的数据获得更好的效果。如何选择标注的数据点是研究的一个主要领域。


    ## 9.6 机器教学 (#06_Contents.xhtml#sec9_6)


    机器教学发生在模型不是由人类训练，而是设备之间相互通信并共享知识时。基本上，它们在相互学习。这可以是合作性的，例如自动驾驶汽车共享路况状况信息；也可以是竞争性的，例如两台机器对弈下棋。机器共享数据并为彼此创建合成经验，产生自我放大的效应。一个很大的优势是，机器教学可能跳过了对训练的需求。


    ## 9.7 自动机器学习 (#06_Contents.xhtml#sec9_7)


    由于数据科学家并不容易找到，人们在自动化机器学习方面付出了许多努力。然而，某些步骤仍然需要人类判断。调整学习者的超参数是通常需要的工作。超参数搜索的目标是尽可能快地找到全局最优。一些用于自动化搜索的工具包括
    `TensorFlow` 的 `Vizier` 和 `Arbiter`。


    在有限范围内，特征选择可以是自动化的。某些特征对于问题并不一定有用。即使自动选择了特征，数据科学家仍然会查看它们以验证其相关性。特征选择通常是从零开始的。


    模型选择涉及比较多个已训练模型的准确率。尽管如此，一个学习者可能具有良好的准确率但 `F1-score` 较差，而另一个学习者则相反，这使得选择哪一个变得并不明显。通常，机器学习应用的结果需要由人类进行评估，即该结果对于当前问题是否有用。通常，机器学习需要领域知识和对使用数据的理解，这限制了可以自动化的任务。


