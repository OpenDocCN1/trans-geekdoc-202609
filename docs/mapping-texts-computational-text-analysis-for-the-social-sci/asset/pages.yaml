  md: "respectively.16 Then, this vector representation of the document is passed\
    \ to the same layers as in our first model.\n\n```\nke_mod <- keras_model_sequential()\n\
    \nke_mod <- ke_mod |>\n  layer_embedding(input_dim = v_vocab, output_dim = 128,\n\
    \                  input_length = n_words) |>\n  layer_global_average_pooling1d()\
    \ |>\n  layer_dense(units = 1200, activation = \"relu\") |>\n  layer_dense(units\
    \ = 3, activation = \"softmax\")\n```\n\nOur loss, optimizer, and accuracy metric\
    \ are the same as before. The only thing to note is that we need to use our *document-sequence\
    \ matrix* to predict our outcome labels.\n\n```\nke_mod <- ke_mod |>\n  compile(loss\
    \ = \"categorical_crossentropy\",\n          optimizer = \"sgd\",\n          metrics\
    \ = \"accuracy\")\n\nhistory <- ke_mod |>\n  fit(seq_trn, y_trn, epochs = 10)\n\
    \nke_mod |> evaluate(seq_tst, y_tst, verbose = 0)\n```\n\nloss accuracy\n0.7066723\
    \ 0.7628990\n\nInterestingly, our loss increased and our accuracy decreased. Perhaps\
    \ using pretrained word embeddings might help? We turn to this in the next section.\n\
    \n# DEDUCITIVE ANALYSIS WITH PRETRAINED MODELS\n\nIn the preceding example, we\
    \ trained our own models. Eventually, we’d use these models on data not used in\
    \ the training process—not just “testing” data, but also unlabeled data. This\
    \ is what is meant by using a *pretrained* model. As open science gains ground,\
    \ pretrained models will proliferate. How do we go about using them to augment\
    \ deductive methods?\n\nHere, we'll focus on pretrained *word embeddings*. Recall\
    \ pretrained models are typically made up of weights on features, and sometimes\
    \ they include methods for matching inputs to the necessary features. Embeddings\
    \ are typically matrices, where the rownames are the terms, and the columns are\
    \ the *d* dimensions of the embedding space. Each unique word is represented by\
    \ a vector of length *d*. To use these embeddings, we’ll match all the words in\
    \ our documents to those in the embeddings.17\n\n16 Recall, this is equivalent\
    \ to defining a semantic centroid.\n\n17 For example, if the terms in the embeddings\
    \ are stemmed or uppercased, then we need to stem or uppercase the terms in our\
    \ corpus."
