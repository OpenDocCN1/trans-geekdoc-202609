  md: "First, using base R , we'll use the %in% operator, which means “every X contained\
    \ in Y.” This creates a vector of TRUE and FALSE elements the length of the rows\
    \ in our dataframe. We can use this to keep every TRUE and remove every FALSE\
    \ . Second, we'll use dplyr ’s filter() while negating the %in% operator.24 Third,\
    \ we'll use dplyr ’s anti_join().25 The fourth, and last, method uses quanteda\
    \ ’s functions for removing words from a token-list.\n\n24 When preceded with\
    \ the negator ! , it means “every X NOT contained in Y.”\n\n25 Most join functions\
    \ “merge” two dataframes by matching columns. This function removes all the rows\
    \ that match.\n\n```\n# create a token-count dataframe\ndf_tkns <-  carroll |>\n\
    \  select(title, text) ->\n  unnest_tokens(word, text) |>\n  count(title, word,\
    \ sort = TRUE)\n```\n\n```\n# #1 filter with Base R subsetting\nidx <- !df_tkns$word\
    \ %in% list_stop\ndf_tkns1 <- df_tkns[idx, ]\n```\n\n```\n# #2 filter with filter()\n\
    df_tkns2 <- df_tkns |> filter(!word %in% list_stop)\n```\n\n```\n# #3 filter with\
    \ anti_join()\ndf_stop <- data.frame(word = list_stop)\ndf_tkns3 <- df_tkns |>\
    \ anti_join(df_stop, by = \"word\")\n```\n\n```\n# #4 removing words from quanteda's\
    \ token-list\nls_tkns <- tokens(carroll$text)\nls_tkns4 <- tokens_remove(ls_tkns,\
    \ list_stop)\n```\n\nFinally, let's look at removing words if we have a DTM. Removing\
    \ words this way is efficient because we only need to match a term once and delete\
    \ its corresponding column from our matrix. quanteda and text2map provide functions\
    \ to remove columns from DTMs.\n\n```\n# create a quanteda dtm\ndtm <- tokens(carroll$text)\
    \ |>\n  dfm()\n# #5 remove words from a quanteda dtm\ndtm <- dfm_remove(dtm, pattern\
    \ = list_stop)\n# #8 remove words from a text2map dtm\ndtm <- dtm_stopper(dtm,\
    \ stop_list = list_stop)\n# #9 removing column names not matching our list\ndtm\
    \ <- dtm[ , !colnames(dtm) %in% list_stop]\n```\n\nNow we know how to remove words.\
    \ How do we decide which words? In practice, there are three strategies to identify\
    \ candidates for “stopping.” The first uses frequency. Most words infrequently\
    \ occur (i.e., Zipf’s law). As proportions, nearly any document of similar length\
    \ (in the same language) shares a high proportion of words! In many cases, however,\
    \ our research questions hinge on how documents differ. For instance, Nelson (2021a)\
