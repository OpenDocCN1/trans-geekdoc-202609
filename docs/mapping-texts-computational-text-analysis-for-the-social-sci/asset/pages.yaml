  md: "If our observed q is larger than 95% of the simulated q, randomness is unlikely\
    \ to generate an observed q at least that large. If our observed q is smaller\
    \ than 95% of the simulated q, randomness is unlikely to generate an observed\
    \ q at least that small. In either case, we conclude that random chance does not\
    \ account for what we see in our network.\n\nLet's walk through an example using\
    \ the backbone network we created with the ATN DTM. Our quantity of interest,\
    \ q, is the mean degree centrality. We'll use a CUG test to see if q reflects\
    \ randomness or some unique quality of this network.\n\nWe first define a function\
    \ to calculate the mean degree centrality, which we'll pass to cug.test(). We\
    \ want all simulated networks to be the same size as our observed network, which\
    \ we specify with the cmode parameter. We'll also specify an undirected graph\
    \ with mode .\n\nLet's generate 100 simulated networks (output in the margin).43\n\
    \n```\nmean_degree <- function(x) {\n  mean(rowSums(x))\n}\nset.seed(2063)\ncug.test(dsm_backbone,\
    \ FUN = mean_degree, mode = \"graph\",\n         cmode = \"size\", reps = 100)\n\
    ```\n\n43 Normally, we'd set this much higher. We also need to set a seed since\
    \ the algorithm generates random networks.\n\nObserved Value: 371.035\nPr(X>=Obs):\
    \ 1\nPr(X<=Obs): 0\n\nAll simulated q are larger than or equal to the observed\
    \ q: Pr(X>=Obs): 1 or 100%. No simulated q is smaller than or equal to the observed\
    \ q: Pr(X<=Obs): 0 or 0%. So, on average, these news articles share less significant\
    \ vocabulary overlap than we expect by random chance.\n\n# Multivariate Network\
    \ Inference\n\nCUG tests are limited to hypothesis testing on one variable. What\
    \ about multivariate modeling? We can handle this with the quadratic assignment\
    \ procedure (QAP) (Cranmer et al. 2020). QAP is a method for adjusting p-values\
    \ in dyadic regression models, where observational independence (an assumption\
    \ of regular regression models) is not justifiable.\n\nThe unit of analysis in\
    \ dyadic regression is the dyad—as opposed to individuals in regular regression\
    \ models. For a document network, this is the presence (or absence) of significant\
    \ vocabulary overlap between documents—not the documents themselves. Once the\
    \ coefficients are estimated,44 QAP then computes the proportion of coefficients\
    \ from simulated networks at least as extreme as the coefficient we get from the\
    \ observed network.\n\n44 We can conduct dyadic regression with a variety of linear\
    \ and generalized-linear estimators.\n\nLet's assess the “political homophily”\
    \ effect in our backbone network. In network theory, homophily is when two nodes\
    \ have a higher probability"
