- pgno: 94
  md: "| Document Frequency (DF) | Total documents in which a term occurs |\n| Inverse\
    \ DF (IDF) | Log of the total documents divided by the DF |\n| Relative DF | Term's\
    \ corpus count divided by term's DF |\n| TF-IDF | Multiply RF with the IDF |\n\
    | Pointwise Mutual Information (PMI) | log2 of TF divided by expected count |\n\
    | Positive PMI (PPMI) | Same as PMI, but negative values set to 0 |\n\n# TERM\
    \ FEATURES\n\nIn addition to mapping the meaningful patterns in documents, we\
    \ often want to summarize ways tokens are used. Broadly, we do this by looking\
    \ at a token’s **context**. At the simplest, we can consider the “dispersion”\
    \ or locations of tokens within a text (Carpeña et al. 2009; Ortuño et al. 2002).\
    \ Not only are some words much more frequent in a corpus, but some words are also\
    \ much more evenly distributed within documents than others. To see this, let’s\
    \ create a “lexical dispersion” plot.\n\nThe first step is associating a given\
    \ token with a given location in a document or corpus. Let’s use Star Trek scripts\
    \ and see how words are dispersed over each episode.\n\n```\ndata(\"corpus_tng_season5\"\
    , package = \"text2map.corpora\")\n```\n\nLet's pick keywords that occur with\
    \ roughly the same frequency but have different dispersions. Here, “vulcan” occurs\
    \ 72 times; “every” occurs 72; “romulan” occurs 78; and “klingon” occurs 84 times\
    \ in the season.\n\n```\nkey_words <- c(\"vulcan\", \"romulan\", \"klingon\",\
    \ \"every\")\ndf_token_position <- corpus_tng_season5 |>\n  unnest_tokens(word,\
    \ line) |>\n  mutate(position = 1:n()) |>\n  filter(word %in% key_words)\n```\n\
    \n```\ndf_token_position |>\\nggplot(aes(x = position, y = 1)) +\\n  geom_segment(aes(xend\
    \ = position, yend = 0)) +\\n  facet_grid(word ~ .) +\\n  labs(y = NULL, x = \"\
    Position\") +\\n  theme(panel.grid.major.y = element_blank(),\\n        axis.ticks.y\
    \ = element_blank(),\\n        axis.text.y = element_blank())\n```\n\nIn Figure\
    \ 6.3, we interpret concentrated terms, like “klingon,” as significant to the\
    \ show’s plot. We can glean that earlier in the season, “vulcan” was important.\n\
    \nWe can efficiently represent the features of a term’s context with a term-context\
    \ matrix (TCM). Whereas the DTM represents the content\n\n+   THIS SECTION NEEDS:\n\
    +   * tidyverse\n+   * text2map\n+   * quanteda\n+   * text2vec\n+   * tidytext\n\
    +   * tokenizers\n+   * Matrix\n+   * ggraph\n+   * tidygraph"
