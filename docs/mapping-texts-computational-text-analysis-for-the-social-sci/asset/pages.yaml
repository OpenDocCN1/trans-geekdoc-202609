    beginner to a position of sophistication and technical virtuosity, leading to
    not only a practical mastery of cutting edge techniques, nor just plus a clear
    understanding of the mathematical bases, but also gives the reader an intuitive
    feel for the larger social contexts that produce the text data analyzed, and all
    this without dropping a single equation in the reader’s lap! A true gem.”—John
    Levi Martin, Florence Borchert Bartling Professor of Sociology at The University
    of Chicago and author of Thinking Through Methods


