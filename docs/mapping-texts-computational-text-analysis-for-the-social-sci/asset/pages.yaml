    # KNOWLEDGE TAKES A VILLAGE


    Three millennia after Babylonian astronomers carved the habits of Venus into the
    tablet of Ammisaduqa, Venera 1 grazed the Venusian atmosphere; two millennia after
    Anaximander flattened the earth to paper, Tenzing Norway and Edmund Hillary used
    this tool to summit Earth''s highest point. Maps offload cognitively demanding
    tasks, create snapshots of ever-changing conditions, and allow us to visualize
    obscured attributes in startling relief.16


    16 “A map does not just chart it, it formulates meaning; it forms bridges between
    here and there, between disparate ideas that we did not know were previously connected”
    (Larsen 2009:138).


    Mapping, too, seeks to make representations of complex domains in ways that facilitate
    ongoing conversations.


    We hope this book is an invitation to join these conversations. Like all scholarly
    research, computational text analysis is a community activity. Our work stands
    on the shoulders of many, and we hope this has been clear throughout. We believe
    more researchers and more collaborations—not more data and larger models—are the
    paths to more robust insights into social and cultural experience. Repeating our
    analyses, documenting our analytic procedures, sharing our data and code, and
    participating in ongoing discussions—are all necessary to push human understanding
    forward.'
