- pgno: 181
  md: '18 There are non-random ways to start clustering (e.g., Hartigan 1975:88; Pena
    et al. 1999).


    19 There are different versions of k-means clustering. The base R function kmeans()
    —which we use—defaults to the Hartigan-Wong algorithm (1975; 1979).


    20 We''ll also use the default algorithm, Hartigan-Wong, but we could specify
    another with the algorithm = parameter.


    21 We can set nstart = which reruns the initial clustering nstart times and uses
    the initial clusters with the minimum SSE.


    First, we must pick k number of clusters. Then, each document is randomly18 allocated
    to one of the k clusters. We then calculate the vector means or “centroids” of
    all documents in a cluster. With our typical DTM, these vectors are term counts.
    The result is k number of means. The algorithm minimizes the errors for all documents
    in a cluster to find the most “compact” solution.19


    The error is the squared difference between each document’s vector and the cluster’s
    centroid. We then sum these errors to get the “sum of squared errors” (SSE). Each
    document is moved to a new cluster to see if this reduces the SSE, and remains
    in the cluster leading to the largest reduction in SSE. Once all documents are
    assessed (and moved, if applicable), the k vector means and SSE are recalculated.
    The algorithm continues until the SSE can be minimized no further—that is, the
    clusters are as compact as possible.


    Let’s continue with our SOTU example. We’ll use kmeans() from base R. In addition
    to our DTM, we’ll need to provide k. Let’s start with k = 5 since the silhouette
    width statistics favored that number.20 As we randomly sort the documents into
    initial clusters, we’ll use set.seed() to reproduce the cluster solution.21


    ```

    set.seed(589901)

    kmeans_sotu <- kmeans(dtm_sotu, 5)

    ```


    We can now look at which speeches are in each cluster.


    ```

    kmeans_sotu$cluster

    ```


    The clusters seem to differentiate on the president giving the speech. Let’s look
    at the words unique to each cluster relative to the corpus as a whole. We’ll use
    the same function as before, only this time providing the clusters from k-means
    (see Table 10.2).


    ```

    get_clust_words(dtm_sotu, kmeans_sotu$cluster, n_words = 5)

    ```


    # Table 10.2: Five Clusters and Top Words (k-Means Clustering)


    | Cluster | N Documents | Top Words |

    | :--- | :--- | :--- |

    | 4 | 4 | people, work, say, welfare, cut |

    | 5 | 8 | must, century, ask, st, children |

    | 2 | 8 | iraq, terrorists, must, america, security |

    | 3 | 4 | jobs, energy, get, like, businesses |

    | 1 | 4 | american, thank, great, administration, united |'
