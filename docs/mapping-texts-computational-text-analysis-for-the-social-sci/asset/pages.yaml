  md: 'learn how to select and acquire text, wrangle and structure, annotate and tag,
    and apply inductive and deductive approaches for discovering meaningful patterns
    from text. The examples use R , a widely used and open-source programming language
    for data analysis. Our conceptual discussions, however, are applicable across
    programming languages. Our intent is not to teach how to use specific tools (although
    we do), but rather to think about the motivations underlying the major techniques
    of contemporary computational text analysis.


    3 Those already familiar with R can mostly skip this chapter save for installing
    the required packages. We also recommend heading to the Appendix for the table
    of all packages used, and the table of all functions associated with packages.


    We organized this as follows. In Part I (**Bounding Texts**), we introduce our
    general approach to language and text as an object of study and consider how selection
    influences the patterns we may find in corpora. In Part II (**Prerequisites**),
    we introduce basic computing ideas with R . <sup>3</sup> We then briefly review
    basic mathematical concepts. Together, these chapters provide a primer, refresher,
    and cheat sheet we refer back to throughout the book—pay attention to **margin
    notes**!


    In Part III (**Foundations**), we discuss how different kinds of texts are acquired
    and converted into a machine-readable form and then outline the initial steps
    involved in converting texts into numbers using fundamental data structures. In
    Part IV (**Below the Document**), we discuss “wrangling” text by removing and
    replacing characters and words, followed by a chapter on corpus annotation, tagging,
    and parsing. We move to the document and corpus level in Part V (**The Document
    and Beyond**). We organize these chapters into **inductive** and **deductive**
    approaches.<sup>4</sup> In the first, researchers allow patterns to emerge from
    the data; in the second, researchers seek out preconceived patterns. Although,
    the specific techniques discussed can often be used inductively or deductively.
    In practice, researchers will combine these into an abductive workflow, oscillating
    between these modes. Finally, we group techniques into **core** and more **extended**,
    with the latter building upon concepts and methods provided in the former.


    4 Inductive: What are the themes in a set of news articles? Deductive: Which news
    articles talk about Akira Kurosawa?


    # WHAT WE LEFT OUT


    This book touches on computational social science, critical data science, and
    research design, but is not a comprehensive introduction to any of those topics.
    For research design we recommend Evidence (Becker 2017), Thinking Through Methods
    (Martin 2017), Abductive Analysis (Tavory and Timmermans 2014) and Thinking Clearly
    With Data (de Mesquita and Fowler 2021). For critical data science, we recommend
    Decoding the Social World (González-Bailón 2017) and Data Feminism (D’ignazio
    and'
