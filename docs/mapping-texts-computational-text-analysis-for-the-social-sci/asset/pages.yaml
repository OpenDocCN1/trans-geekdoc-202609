    > 18 For a comparison, see Gonçalves et al. (2013) and Ribeiro and colleagues
    (2016).


    > 19 Weighted dictionaries, in general, are probably ill-suited for long documents
    (Aslanidis 2018:1245–50; Hanna 2013:376–9; Stoltz and Taylor 2021).'
