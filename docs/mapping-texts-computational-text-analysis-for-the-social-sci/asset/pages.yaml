  md: '![](img/ccc0ce559da97114ef913045f55e3801_70_0.png)


    Figure 5.6: arXiv Papers with a Statistics Classification.


    # LEGAL AND ETHICAL SIDE OF SCRAPING


    Let''s reflect on the ethics of data acquisition before we move on.


    By social science standards, much text data is easy to get. We (usually) access
    it publicly via the Internet and thus require no interviewees, survey respondents,
    experiment participants, consent forms, expensive sampling designs, or even much
    time. Ease, however, does not mean fair game—even when the data exist, ostensibly,
    in the public sphere.


    We''ll address three ethical dilemmas we might encounter related to (1) terms
    of service, (2) intellectual property, and (3) individual and organizational privacy.
    This discussion is informed heavily by the ethical/legal framework for Web scraping
    proposed by Krotov, Johnson, and Silva (2020:549).23


    # Terms of Service


    In the case of developer APIs, we typically enter a formal agreement constraining
    how we use the service. The services R interacts with often block activity that
    violates this agreement: for example, requesting too much material too quickly.
    When building a custom scraper things get more complicated. Generally, publicly
    available text—that is, text that does not require a login to access—is fair game
    for scraping, at least legally.


    23 Our discussion is not an exhaustive review of this framework. The authors also
    cover issues with Web-scraped data for decision-making (p. 549), how scraping
    can negatively impact the value of websites’ services (p. 549), and how parties
    engaged in scraping might be liable for any material damage to a website or server
    (p. 546). We do not discuss these points here.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'In 2019, the Ninth Circuit Court of Appeals upheld a lower court ruling that
    collecting publicly available data (i.e., data that does not require a login to
    access) does not violate the Computer Fraud and Abuse Act (CFAA). Websites have
    “Terms of Use” agreements; however, the court argued that accessing a website
    does not signal that the user entered into an explicit agreement. Furthermore,
    to hold a scraper in violation of the CFAA, “the website must establish that it
    incurred material damages (i.e., overload servers) as the result of the breach
    of the “Terms of Use”” (Krotov et al. 2020:563). Therefore, legally, scraping
    when Terms of Use forbid this activity is not considered a “breach of contract.”
    Moreover, it is not always straightforward what activity is disallowed. For example,
    arXiv (which we scraped in the previous section) provides an API “to maximize
    its openness and interoperability”; however, the websites’ robots.txt²⁴ states:
    “Indiscriminate automated downloads from this site are not permitted.” While we
    strongly suggest using the API, we leave it as a task for the reader whether our
    scraping example is “indiscriminate” downloading.


    24 This is a de facto standard for telling “robots” like search engine crawlers
    how they should interact with the site. The initial impetus was to prevent overloading
    a website.


    Whether one should follow the Terms of Use (or robots.txt rules) depends on the
    researchers’ judgment and whether the research justifies going against the website
    owner’s will. Researchers doing non-commercial studies for the public good and
    exploring issues of social significance should be allowed access to public resources
    on the Web, provided that access does not create material damages (Vaccaro et
    al. 2015).


    # Intellectual Property


    Text data may be copyrighted. As such, using such data might be subject to any
    copyright law within the researchers’ locale. Much text data of interest are not
    usually “owned” by the hosting website—for example, social media sites such as
    Twitter or Facebook.²⁵ But what if we scrape texts that *are* copyrighted, like
    books or song lyrics? Even in these cases, scraping the texts themselves might
    not constitute copyright infringement; rather, *publishing* the texts in “some
    tangible medium” (US Copyright Office 2022b)—for example, an academic article—might
    lead to issues (Krotov et al. 2020:546). This is especially problematic if the
    author receives any financial or material benefits from the republished work.


    25 Even this point is contentious. Both Twitter’s and Facebook’s Terms of Service
    claim the end-user owns their content. But, in *People of the State of New York
    v. Malcolm Harris*, the court concluded that Twitter had to surrender user data
    for Malcolm Harris—an Occupy Wall Street protester (Jeong and Hoven 2012).


    In the US, researchers often rely on “Fair Use” legal doctrine to argue that their
    uses of copyrighted materials are not subject to claims of copyright law violations.
    “Fair Use” is laid out in the Copyright Act of'
