  md: "include the focal document to the total number of shortest paths between those\
    \ two documents at all. If weighted, the shortest path between two documents is\
    \ the inverse of the “path of least resistance” (Opsahl et al. 2010:248; Newman\
    \ 2001). This is the weighted path between two documents with the largest sum.36\n\
    \nLet’s get some weighted betweenness scores for our documents. We’ll use igraph,\
    \ which treats the weights in a network as costs rather than strengths. So, we\
    \ must invert the weights before passing to betweenness().\n\n```\nget_betweenness\
    \ <- function(x) {\n  gr <- graph.adjacency(x, mode = \"undirected\",\n      \
    \                  weighted = TRUE, diag = FALSE)\n  E(gr)$weight <- 1 / E(gr)$weight\n\
    \  df <- data.frame(centrality = betweenness(gr))\n  return(df)\n}\n```\n\n```\n\
    get_betweenness(doc_proj) |>\nslice_max(centrality, n = 4, with_ties = FALSE)\n\
    ```\n\n36 Just as with degree, high weighted betweenness can be driven by two\
    \ things: the (1) document being on a large number of longer paths with higher\
    \ weights, or the (2) document being on a large number of shortest paths. See\
    \ Opsahl and colleagues (2010) for a correction.\n\nOur article with the highest\
    \ degree is also the biggest broker in the text network (see Table 12.2). Perhaps\
    \ this is because computational social science is an interdisciplinary field that\
    \ bridges across other (sometimes disparately connected) specializations.\n\n\
    # Table 12.2: Documents with Highest Betweenness Centrality\n\n| | centrality\
    \ |\n|---|---|\n| Computational Social Science and Sociology | 235 |\n| Urban\
    \ Mobility and Activity Space | 59 |\n| Relational Work in the Economy | 32 |\n\
    | Organizations and the Governance of Urban Poverty | 28 |\n\n# Network Backbones\n\
    \nText networks are usually undirected, weighted, and very dense. For the document\
    \ network, a tie is absent if two documents share no words. Absent heavy-handed\
    \ vocabulary pruning and short texts, this is unlikely. In other words, our document\
    \ networks are fully connected graphs, where every possible tie is present.\n\n\
    This complicates visualization—the “hairball” problem—but also the statistical\
    \ analysis of the network. We can address this with two non-exclusive procedures:\
    \ removing ties and removing weights. We can do this manually—recode weights to\
    \ “0” if the weight is below the 75th"
