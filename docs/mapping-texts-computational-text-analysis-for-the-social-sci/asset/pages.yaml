    # MEMOING AND DATASHEETS


    In qualitative research, especially ethnography, it is common practice to write
    “analytic memos.” This is different from “field-notes” in that the focus is self-reflection
    and self-observation. What did we do today? What did we learn? How has our thinking
    changed today? What will we do differently tomorrow? This is also where we explicitly
    bring together theory and analysis. This is the narrative counterpart to our coding.
    Certainly, researchers will have different strategies, but at minimum, we should
    approach a day of coding as a day in the field and set aside time for memoing,
    and periodically review these memos as a project progresses.


    Despite some tendencies to use the largest available corpora, we cannot ignore
    the ways every analysis of text is drawn from a subset. We need to know, as best
    we can, what subset we’re studying. If we do not consider this, we can mistake
    patterns in the assembly of the corpus for patterns within the texts. Essential
    to this process, then, is documenting—in meticulous detail—the steps we take to
    collect and select our texts.


    Our analytic memos, with our scripts, can be used later to create datasheets.
    To keep in step with open science, our corpus and/or derivatives will need to
    be shared with our community. Without accompanying documentation, researchers
    may use our corpus but misunderstand their findings. Therefore, following Gebru
    and colleagues (2021:86), we argue that “every dataset be accompanied with a datasheet
    that documents its motivation, composition, collection process, recommended uses,
    and so'
