  md: 'These pre-compiled lists vary, for example, whether lists include all forms
    of a word or are built using frequency and grammatical considerations. Documentation
    is, unfortunately, difficult to find. Even worse, publications often state only
    that “stop words were removed,” without being explicit about *which* words were
    removed. We should always proceed with caution when choosing to remove words from
    our data since this can dramatically impact our findings.


    We built a minimal stoplist called “tiny” (in `textmap`) with the intent to remove
    only the most frequent tokens in any genre. We began by selecting the top 20 words
    in several large corpora: the Brown Corpus, the Google Books 1 Trillion Word Corpus,
    and Wikipedia (as of 2019). The only verb we include is “to be” which includes
    8 different forms (“be”, “is”, “are”, “was”, “am”, “were”, “being”, and “been”).
    We omitted negated forms and contractions. We include singular and plural pronouns,
    but not gendered or possessive pronouns. The resulting stoplist includes 33 tokens.
    It is a lightweight and documented alternative frequency.


    To recap, words are pruned based on their (1) frequency, (2) grammatical class,
    or using (3) pre-compiled stoplists. Words are removed to aid visualization, speed
    up computational processes, and remove redundant information. However, such processes
    may not help us understand the texts and may even curtail some analytical techniques
    (Schofield et al. 2017). We must always keep our research aims in mind when deciding
    to remove words. As a best practice, we should test how removing words shapes
    our findings and documenting which words are removed when sharing these findings
    with our communities.


    +   THIS SECTION NEEDS:

    +   * textstem

    +   * tidyverse

    +   * stringi

    +   * tidytext

    +   * text2map

    +   * proustr

    +   * udpipe

    +   * textclean

    +   * text2vec


    30 To identify, say, news media organizations, the entries for CBS references
    might be “CBS”; then we do not want to “remove” capitalization since “CBS” would
    become “cbs.”


    # REPLACING WORDS


    In the previous sections, we removed or replaced *characters* (e.g., deleting
    punctuation or extra whitespace), and we removed entire tokens (for example, with
    stoplists). When might we want to *replace words*?


    First, we often don’t want to. If using a dictionary, modifying word forms can
    hamper matches.30 Or, if we’re counting different parts of speech, we’ll want
    to keep our words as is. “Running,” “runs,” and “ran” are all inflections of the
    base “run.” If researchers need to differentiate between these inflections—say,
    to identify who *will run* for political office, who *is running* for office,
    and who *ran* for office—again, words should be left as is.


    Are we agnostic to the differences between “run,” “running,” “runs,” and “ran,”
    and only wish to identify references to the act of “going faster'
