    \ corpus. Here, the rows of the TCM are target words, and columns are **contexts**\
    \ to which the target term is associated. In the example above, the context is\
    \ simply a word's position in a string of words. We could also rotate a DTM to\
    \ get a *term-document matrix*, where the document is the term's context. Finally,\
    \ in a term co-occurrence matrix, each row is a term, _i_, and each column is\
    \ also a term, _j_, that _i_ appears alongside. These are all TCMs; their “contexts”\
    \ vary by scale—as if zooming in and out of a map.32\n\n32 We'll add considerable\
    \ complexity to TCMs in Extended Inductive.\n\nTerm co-occurrence matrices capture\
    \ two kinds of word _associations_. First, we get **syntagmatic** similarities:\
    \ two words are literally used together. Second, we get **paradigmatic** associations:\
    \ two words can be used in similar places but might never co-occur.\n\nLet's explore\
    \ this with Taylor Swift's songs from her first ten albums. We'll again do minimal\
    \ preprocessing (lowercase, remove punctuation).\n\n```\ndata(\"corpus_taylor_swift\"\
    , package = \"textmap.corpora\")\ndf_swift <- corpus_taylor_swift |>\n  mutate(text\
    \ = tolower(song$text),\n         text = gsub(\"[:punct:]\", \" \", text),\n \
    \        text = trims(text))\n```\n\nThen, we'll create a DTM where each row is\
    \ a song.\n\n```\ndtm <- dtm_builder(df_swift, text, song_id)\ndim(dtm) # 120\
    \ songs and a vocab of 3240\n```"
