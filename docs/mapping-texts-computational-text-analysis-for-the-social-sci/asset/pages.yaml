  img_proc: true
- pgno: 184
  md: 'If we take each singular value, square it, and then divide by the sum of the
    squared singular values, then we can express the singular values in the form of
    *proportion of the total variance in the DTM that is explained by that topic*.
    We then retain the number of topics where even the “smallest” topic explains a
    reasonable amount of variance.


    After deciding on *k*, we’ll need to get the top terms for that *k*. First, we’ll
    transpose the topic-term matrix. Then we’ll sort the terms’ loadings (i.e., their
    “weights” on the topic) in descending order for each column. We’ll retain enough
    terms to interpret the topic. We then repeat this process with the document-topic
    matrix<sup>25</sup> to find the documents loading the highest on each topic. These
    documents are candidates for close reading. Let’s work through an example with
    our SOTU corpus.<sup>26</sup>


    ```

    data("data_corpus_sotu", package = "quanteda.corpora")

    ```


    There is no need to transpose this matrix, since the dimensions are already in
    the columns.


    ```

    df_sotu <- tidy(data_corpus_sotu) |>\n  filter(Date >= "1993-02-17") |>\n  mutate(\n    year
    = gsub("\\d+-.-.*", "\\1", Date),\n    doc_id = paste0(President, "_", year),\n    text
    = tolower(text),\n    text = gsub("\\w+[\\d.]+\\w+", "", text),\n    text = gsub("[[:punct:]]+",
    "", text),\n    text = gsub("[[:digit:]]+", "", text),\n    text = str_squish(text)\n  )

    ```


    Note that the preprocessing retains inter-word punctuation and removes words in
    the Snowball stoplist.


    ```

    dtm_sotu <- df_sotu |>\n  dtm_builder(text, doc_id) |>\n  dtm_stop(stop_list =
    get_stoplist("snowball2014"))

    ```


    Base R has `svd()`. There are also dedicated packages for LSA like `lsa` — with
    convenience functions for applying SVD to DTMs. We’ll use both to show their equivalence.
    Let’s pass our DTM to `svd()`. We’ll use the raw term frequencies as our weighting
    scheme.<sup>27</sup>


    The DTM is often weighted by *tf-idf* scores when using LSA in information retrieval
    research.


    ```

    svd_sotu <- svd(dtm_sotu)\nlengths(svd_sotu)

    ```


    ```

    d       u       v\n28      784   243768

    ```


    Look at the resulting object, `svd_sotu`. We’ll see three matrices: our diagonal
    matrix of singular values ( `$ d` ), the document-topic matrix ( `$ u` ), and
    the topic-term matrix ( `$ v` ). We’ll also see that we have 28 topics – as expected,
    since an SVD on a $28 \times 9477$ DTM produces 28 non-negative singular values
    (the length of the rows or columns, whichever is the smallest). Let’s look at
    the distribution of variance explained. Recall we do this by squaring our singular
    values and dividing them by the sum of the squared singular values.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '```

    prop.table(svd_sotu$d^2) |> head()

    ```


    ```

    [1] 0.70084810 0.03687220 0.03266792

    0.02435380 0.02101393 0.01654950

    ```


    Dimension #1 accounts for over 70% of the variance in our DTM. The explanatory
    power of the remaining dimensions drops off considerably: the next three explain
    only 10% combined.


    It might be tempting to retain only this first dimension. However, `lsa` recommends
    a slightly different strategy. Let''s first generate our SVD using `lsa`. The
    function expects a TDM instead of DTM, so we''ll first take the transpose of our
    SOTU DTM.28


    28 lsa() gives the same output whether the input is a DTM or a TDM, but mislabels
    the output for a TDM. So, we''ll supply a TDM to avoid that confusion.


    ```

    lsa_sotu <- lsa(t(dtm_sotu))

    # quick look

    lengths(lsa_sotu)

    ```


    ```

    tk dk sk

    69648 224 8

    ```


    Comparing `lsa_sotu` to `svd_sotu`, we''ll see they are almost identical.


    +   - `$d` in `svd_sotu` (the vector of singular values) is `$sk` in `lsa_sotu`.

    +   - `$u` in `svd_sotu` (the document-topic matrix) is `$dk` in `lsa_sotu`.

    +   - `$v` in `svd_sotu` (the term-topic matrix) is `$tk` in `lsa_sotu`.


    Notice one significant difference: only eight dimensions in `lsa_sotu`. This is
    because `lsa()` keeps the dimensions accounting for at least 50% of the variance
    in the original DTM.


    Following the strategy above, though, this should result in only one topic—not
    eight. The difference is that `lsa()` doesn''t square the singular values; instead,
    each singular value is divided by the sum of the singular values. So, if we take
    `svd_sotu$d` and apply `prop.table()` as before but with no squaring, we should
    see that the first eight topics account for at least 50% of the variance and that
    the first seven do not.


    ```

    prop.table(svd_sotu$d)[1:8] |> sum() # first 8 dimensions

    prop.table(svd_sotu$d)[1:7] |> sum() # first 7 dimensions

    ```


    Sure enough, using this strategy, the first eight topics account for 52% of the
    variance, while the first seven accounts for 49%. Eight topics it is.


    Each term and each document have a loading on these topics. While these loadings
    are not probabilities, they do mean documents engage more than one topic.'
