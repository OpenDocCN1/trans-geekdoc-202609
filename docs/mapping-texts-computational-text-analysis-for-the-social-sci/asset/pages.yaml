  md: "```\n# we can also create a TCM with the cross product\n# column by column\
    \ (i.e., term by term) matrix\ntcm <- crossprod(dtm)\n\n# this creates a document-similarity\
    \ matrix\n# row by row (i.e., document by document) matrix\ndsm <- tcrossprod(dtm)\n\
    ```\n\nWe'll either get a matrix of document-by-document similarities (DSM), or\
    \ a term-by-term co-occurrence matrix (TCM). The output is a square N x N matrix,\
    \ where N is either the size of the vocabulary or N is the number of documents\
    \ in the corpus. In a TCM, the features are now the context terms with which a\
    \ target term tends to co-occur within a sequence (here, an entire song). Now,\
    \ cosine similarities will measure paradigmatic associations between words.\n\n\
    ```\nvec1 <- as.vector(tcm[\"shake\", ])\nvec2 <- as.vector(tcm[\"love\", ])\n\
    vec3 <- as.vector(tcm[\"alone\", ])\n\ncos_sim(vec1, vec2)\ncos_sim(vec2, vec3)\n\
    cos_sim(vec3, vec1)\n```\n\n[1] 0.4689983\n[1] 0.862345\n[1] 0.5598621\n\nThe\
    \ magnitudes have changed considerably, but the rank of similarities has not changed.\
    \ “Alone” and “love” remain the most similar.\n\nOften the document is too large\
    \ to provide an informative context for each term, or there is too much variation\
    \ in document lengths. We can refine the TCM by changing the size of the “context.”\
    \ Rather than an entire document, the context might be paragraphs, sentences,\
    \ or a moving window (i.e., a skipgram or shingle) of a certain number of words.\n\
    \nWe'll create a TCM with a context window of five tokens for Swift's songs using\
    \ `fcm()` (i.e., feature co-occurrence matrix). Let's also include a corpus of\
    \ Beyonce's songs to compare.\n\n```\ndata(\"corpus_beyonce\", package = \"text2map.corpora\"\
    )\ndf_beyonce <- corpus_beyonce |>\n  mutate(text = tolower(song_text),\n    \
    \     text = gsub(\"[[:punct:]]\", \" \", text),\n         text = trimws(text))\n\
    ```\n\nAs a loose rule, smaller windows (e.g., one to three words) are more “syntactic,”\
    \ while larger windows (e.g., four- to ten-word windows) are more “semantic.”36\
    \ Since we’re using songs, let’s set the window to four.\n\n36 Linguists debate\
    \ this distinction (Bybee et al. 1994). Another way of thinking about the difference\
    \ is a spectrum from more specific meaning (semantic) to more generic meanings\
    \ (syntactic) (Sweetser 1988)."
