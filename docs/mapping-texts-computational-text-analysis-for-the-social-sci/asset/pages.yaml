  md: 'between them. Many phenomena are networks: for example, disease contagion,
    genealogies, the diffusion of market products, and our nervous system. We cannot
    understand these processes without considering the relations between elements.
    Every network comprises nodes (or vertices) and ties (or edges, or links). We
    get this jargon from graph theory, and often call networks graphs.31


    What these nodes and ties comprise varies—really, we are constrained only by our
    imagination. In a social network, nodes are usually social actors—individuals,
    groups, organizations, etc. Ties are whatever connects these social actors—say,
    friendship, cohabitation, similar tastes, etc. Using graph theory, we can analyze
    the “structural” properties of those patterns. For instance, we could assess gossip
    flowing through a network of company emails or find brokers in an organizational
    hierarchy.


    A matrix can represent any graph. As such, networks lead a double life: as graphs
    and matrices.32 Let’s consider a real-world social network, both as a matrix and
    graph. Below is the matrix representation of the Florentine Families data (Padgett
    and Ansell 1993). This dataset comprises marriages between 16 families in Renaissance-period
    Florence, Italy. We’ll only look at the first five rows and five columns.


    ```

    ```

    data("flo", package = "network")

    flo[1:5, 1:5]

    ```

    ```


    | | Acciaiuol | Albizzi | Barbadori | Bischeri | Castellan |

    |---|---|---|---|---|---|

    | Acciaiuol | 0 | 0 | 0 | 0 | 0 |

    | Albizzi | 0 | 0 | 0 | 0 | 0 |

    | Barbadori | 0 | 0 | 0 | 0 | 1 |

    | Bischeri | 0 | 0 | 0 | 0 | 0 |

    | Castellan | 0 | 0 | 1 | 0 | 0 |


    In the matrix, an ij (row-column) pair gets a 1 if there was at least one marriage
    between those two families and a 0 if not. We typically call these adjacency matrices.
    When they are unweighted like this (just 0s and 1s), we call them binary matrices,
    and when they are symmetric (i.e., the rows and columns are the same entities
    and a tie has either no direction or is bidirectional), we call them undirected
    matrices.


    Let’s look at it in graph form (see Figure 4.4), using ggraph .33


    ```

    ```

    set.seed(59812) # set a seed to make layout reproducible

    flo |>

    ggraph(layout = "fr") +

    geom_edge_link() +

    geom_node_label(aes(label = name)) +

    theme_graph()

    ```

    ```


    Graphs and networks are not strictly synonyms, but we’ll still use them interchangeably.
    Sorry, mathematicians!


    Network science, then, is a fusion of graph theory and matrix algebra.


    The network itself is an igraph object. igraph is the most popular network analysis
    packages in R . ggraph is preferred for creating visualizations of graphs inline
    with the gggplot2 grammar.'
