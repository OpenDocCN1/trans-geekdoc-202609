  md: "Since we are interested in submissions *over time* per tag, we need to wrangle\
    \ the `paper_date` column so only the submission date remains. We'll use `gsub()`\
    \ and `parse_date_time()` to do so below.\n\n```\n```\ndf_arxiv$submit_date <-\
    \ gsub(\"^.*Submitted\\\\s*\\\\|\\\\s*.*$\", \"\",\n                         \
    \        df_arxiv$paper_date)\ndf_arxiv$date_new <- parse_date_time(df_arxiv$submit_date,\n\
    \                                         orders = c(\"dmy\"))\n```\n```\n\nWe\
    \ will \"melt\" or \"pivot\" our `df_arxiv` dataframe so each row is a date by\
    \ tag. This makes plotting easier and involves turning a wide dataframe into a\
    \ long dataframe.\n\n```\n```\nmelt_arxiv <- df_arxiv |>\n  select(date_new, tag_1:tag_6)\
    \ |>\n  pivot_longer(!date_new)\n```\n```\n\nThere are over a hundred unique tags;\
    \ since we focused on statistics papers, we'll filter out non-statistics tags.\
    \ Then, rename them with more meaningful labels. Finally, we use `group_by()`\
    \ to count each time a tag occurs on each date.\n\n```\n```\nmelt_arxiv <- melt_arxiv\
    \ |>\n  filter(grepl(\"stat.\", value, fixed = TRUE)) |>\n  mutate(stats = recode(value,\n\
    \                            \"stat.AP\" = \"Applications\",\n               \
    \             \"stat.CO\" = \"Computation\",\n                            \"stat.ME\"\
    \ = \"Methodology\",\n                            \"stat.ML\" = \"Machine Learning\"\
    ,\n                            \"stat.OT\" = \"Other Statistics\")) |>\n  group_by(stats,\
    \ date_new) |>\n  summarize(count = n())\n```\n```\n\n21 Using smoothed conditional\
    \ means.\n\n22 Of course, we cannot conclude that this pattern characterizes this\
    \ statistics in general. There is quite possibly an affinity between submitting\
    \ papers to arXiv and studying machine learning—see Corpus Building.\n\nUsing\
    \ `ggplot()`, we'll divide our data into separate plots using `facet_wrap()` and\
    \ fit a line that summarizes the data.<sup>21</sup> We see in Figure 5.6 that\
    \ \"Machine Learning\" dominates the statistics papers on arXiv with 30 submissions\
    \ on average per day.<sup>22</sup>\n\n```\n```\nmelt_arxiv |>\n  ggplot(aes(x\
    \ = date_new, y = count)) +\n    geom_smooth() +\n    labs(x = \"Date\", y = \"\
    Average\",\n         subtitle = \"Papers per Stats Category\") +\n    facet_wrap(~stats,\
    \ nrow = 1)\n```\n```\n\nBy building this custom scraper, we have an \"infrastructure\"\
    \ that can expand to include, for example, all 85,000+ statistics papers or continually\
    \ update our corpus as new papers are submitted. Building scrapers takes time\
    \ and effort, but the more difficult-to-reach communities and troublesome datasets\
    \ may lead to new insights precisely because fewer scholars have the opportunity\
    \ to analyze them (cf. Martin 2017:218)."
