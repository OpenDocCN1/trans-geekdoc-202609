    # APPLICATION PROGRAMMING INTERFACES (APIs)


    Web scraping identifies and collects content from pages hosted on the World Wide
    Web (Ignatow and Mihalcea 2017:82). Three common targets of scraping are news
    media, social media, and crowdsourced websites. Using news media in scholarly
    research goes back to the foundations of quantitative text analysis over a century
    ago (Speed 1893) and communications research in the 1940s (Lazarsfeld 1940). News
    was studied both for its potential influence on readers (Fenton 1910), and as
    a way to track the “social weather” of a region (Tenney [1912] 2008). Social media
    is the star of recent “Big Data” efforts in the social sciences. Projects using
    social media data range from studies on misinformation diffusion (Bail et al.
    2020) to friendship formation (Wimmer and Lewis 2010) and the impact of legislation
    on online sentiment (Flores 2017). These data are cheaper than surveys and are
    relatively immediate—and potentially less moderated—thoughts and feelings. Lastly,
    there are crowdsourced websites, where volunteers—often driven by passion—contribute
    information. This includes Wikipedia, Song Genius, and Fandom. Such sites are
    valued both for their ability to produce semi-structured datasets—for example,
    categorizing every Marvel superhero’s powers (Muscio 2023)—and loci of well-documented
    collective production and governance (Adams and Brückner 2015; Konieczny 2009).


    7 As the pop-culture Cuisinart Alfred Yankovic states, “As it turns out, there
    is a thing called the Internet, and stuff does go out there whether the suits
    like it or not” (Press 2007).


    To scrape such sites, we''ll interact with an application programming interface
    (API). When typing the URL for a website, our browser sends a request to a server.
    The server then “responds” to the browser—hopefully, by returning the requested
    webpage. The portion of the server responsible for processing and making requests
    is the API (Gazarov 2016). An API is an intermediary that allows applications
    to “talk” to each other and defines the standardized “terms of engagement.” This
    interface is commonly written in XML or JSON. Think of an API as a “user interface.”
    Instead of human users, though, it makes navigation easier for client software
    (i.e., software on our “data-requesting” computer) (Berlind 2015; McLevey 2021:63–87).


    8 These are markup languages—like HTML —for storing and representing datasets.


    9 Wrappers are at the mercy of the organization offering the API (Freelon 2018).
    In fact, volatility is why we removed a Twitter example. If the following code
    breaks, be patient! Explore the recent documentation for the wrapper.


    Those more familiar with R can interact directly with these markup languages.
    Luckily, “wrappers” exist to make this easy, for example, academictwitteR, rtimes,
    geniusr, WikideliR and many more. Many websites have separate APIs specifically
    for automated interaction.'
