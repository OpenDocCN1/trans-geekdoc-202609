    # Text Data


    # Languages and Dialects


    That there are languages (plural) is based mainly on the intersubjective notion
    of “mutual intelligibility.” Typically, the difference between a language and
    a dialect is that the latter is a spoken difference (accent or pronunciation).
    To the extent “dialect” includes distinct grammar, vocabulary, and even spelling
    differences, we must ensure our tools take this into account.


    Some tools, for instance, “correct” so-called misspelled words. As we discuss,
    this has the benefit of reducing complexity (while increasing homogeneity). We
    use scare quotes because there is no “correct” way to represent meaning with a
    set of characters, only more and less conventional ways.16 The boundaries between
    those who adhere to these conventions are also fuzzy and overlapping, given that
    people can often switch or mix dialects (as well as languages).


    16 A sentiment shared by Mark Twain: “I don’t see any use in having a uniform
    and arbitrary way of spelling words. We might as well make all clothes alike and
