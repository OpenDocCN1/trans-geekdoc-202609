  md: 'There are four reasons to use pretrained embeddings. First, we save time and
    resources. Second, it increases replicability across studies. Third, our focal
    corpus may be too small for training purposes. Finally, embeddings trained on
    only our focal corpus may be overfit.


    +   THIS SECTION NEEDS:

    +   * tidyverse

    +   * stringi

    +   * textclean

    +   * keras

    +   * reticulate


    # Neural Networks with Pretrained Embeddings


    We’ll use posts on a popular discussion board from Reddit (i.e., a subreddit)
    called “Am I the Asshole” (AITA). The guidelines are simple: “Tell us about any
    non-violent conflict you have experienced; give us both sides of the story, and
    find out if you’re right, or you’re the asshole.” Forum members decide which party
    is in the wrong: the author, the other party, everyone, no one—or in some cases,
    not enough information to determine. Predicting “who is the asshole” using text
    is a complicated classification task.


    ```

    ```

    data(corpus_reddit_aita10k, package = "text2map.corpora")


    df_aita <- corpus_reddit_aita10k |>

    mutate(text = stri_trans_general(text,

    id = "Any-Latin; Latin-ASCII"),

    text = tolower(text),

    text = replace_curly_quote(text),

    text = replace_contraction(text),

    text = gsub("[[:punct:]]+", " ", text),

    text = gsub("[[:digit:]]+", " ", text),

    text = str_squish(text)

    )

    ```

    ```


    We will use Python packages again, so set the conda environment.


    ```

    ```

    use_condaenv(condaenv = "myenv")

    ```

    ```


    Let’s use the embeddings we used previously, the fastText embeddings trained on
    the Common Crawl, found in text2map.pretrained . We’ll assume the model is already
    downloaded.


    ```

    ```

    # load the model each session

    data("vecs_fasttext300_commoncrawl", package = "text2map.pretrained")

    ft_wv <- vecs_fasttext300_commoncrawl # rename so it''s tidier

    ```

    ```


    Let’s turn our corpus into a document-sequence matrix using only the first 2,000
    words in each post.


    ```

    ```

    n_words <- 2000


    seq_trn <- df_aita |>

    seq_builder(text, maxlen = n_words) |>

    as.matrix()

    ```

    ```


    We also need to prepare the outcome variable, which has five categories indicating
    who is in the wrong according to the majority: Other,'
