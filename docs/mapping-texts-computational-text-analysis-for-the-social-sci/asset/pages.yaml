  md: 'layers called geoms (geometric objects) which roughly correspond to kinds of
    plots, such as dot plots, bar charts, line graphs, etc.


    The default aesthetics of ggplot2 are pretty good. The code can get pretty complex
    as we fine-tune our visualization. To replicate this book''s plots exactly, we
    built a custom theme. To set the theme, install the text2map.theme package from
    GitLab:


    ```

    install_gitlab("culturalcartography/text2map.theme")

    ```


    Then, each time we load a new session of R , run this:


    ```

    text2map.theme::set_theme()

    ```


    Let''s generate two plots (see Figure 3.2). We''ll add a “grouping” variable to
    specify color (for the borders) and/or fill (for the insides) for each geom().
    We''ll also perform operations on one of our variables using mutate() before passing
    the data to ggplot() in a chain. Next, we''ll create the two different plots and
    print them together using ggarrange(). 17


    ```

    p3 <- mtcars |>

    mutate(cyl = paste(cyl, "cylinders")) |>

    ggplot(aes(x = wt, y = mpg, color = cyl()))

    p3.a <- p3 + geom_point()

    p3.b <- p3 + geom_boxplot(aes(fill = cyl()))

    ggarrange(p3.a, p3.b, ncol = 2)

    ```


    Our theme builds on the Urban Institute''s. We use colors from viridis , which
    is optimized for data representation (i.e., perceptually uniform), easier to read
    for those with colorblindness, and translates to grayscale. Open Sans and Lato
    are both good fonts for data visualizations because they have high readability
    at small sizes and even spacing.


    17 Note the + operator. This operates like a pipe |> , but is only used with ggplot
    objects and functions.


    ![](img/ccc0ce559da97114ef913045f55e3801_37_0.png)


    Figure 3.2: Example Data Visualization.


    We''ll use data visualizations similar to this throughout the book. Visualizations
    are powerful tools for “seeing” our data and the transformations of our data that
    mapping entails.'
