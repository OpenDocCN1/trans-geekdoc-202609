  md: 'graph into two separate weighted unipartite graphs—one for each mode—and carry
    out analyses on those. We’ll take this third strategy.


    We already know how to get a weighted document-by-document matrix where the cell
    entries tell us how much vocabulary overlap there is between two documents using
    `tcrossprod()`. We can get the term-by-term matrix with `crossprod()`.


    ```

    doc_proj <- tcrossprod(dtm_ars)

    term_proj <- crossprod(dtm_ars)

    ```


    When visualizing, the document graph would render quickly but not the term graph.
    We won’t even try to visualize the term graph here because it takes considerable
    computational power and the figure would not be insightful. The term graph would
    be what network researchers call a “hairball” (Dianiati 2016)—the ties in the
    middle would make a gray blob.


    The one-mode projections from a DTM are usually very dense. Unless we have concise
    texts, it is unlikely that two documents share no vocabulary or two terms share
    no documents. Second, even a tiny vocabulary still means potentially thousands
    of nodes. Even though the document-level graph is typically denser than the term-level
    one, there will be fewer nodes.


    In our case, the ARS corpus has only 33 documents. The term graph has 510 nodes
    and 59,616 ties. These documents are already short (just article abstracts). The
    document graph has a network density of 0.97—that is, 97% of the possible ties
    in the document network are actually present!


    When visualizing, setting ties with small weights to zero might help, but this
    may not help us interpret the patterns. To aid interpretation, then, we can turn
    to standard network metrics. We focus on the most common: centrality.


    # Centrality


    Node centrality is a way to measure each node’s importance in a graph.33 Definition
    of “importance” can vary, but there are two in particular (we focus on document-level
    analyses here, though the same applies to the term network):


    +   1. The strength of a document’s similarity to other documents.

    +   2. The extent a document is a broker between other documents that otherwise
    do not have much in common.'
