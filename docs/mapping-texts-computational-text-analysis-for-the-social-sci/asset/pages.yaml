    al. 2015). For example, if there is more fiction than non-fiction, this affects
    any conclusions we draw from word frequencies. And, indeed, the 2020 corpus did
    have significantly more fiction because of shifting relationships between Google,
    libraries, and publishers—as well as the rapid expansion of e-books and self-publishing
    during that period. The study of "cognitive distortions" was possibly measuring
