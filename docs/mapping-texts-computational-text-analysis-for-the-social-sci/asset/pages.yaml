  md: '![](img/ccc0ce559da97114ef913045f55e3801_100_0.png)


    Figure 6.4: Term Similarities with PMI-Weighted TCMs.


    We added a diagonal line where terms above it are more similar to “sorry” in Beyonce’s
    songs and terms below are more similar to “sorry” in Swift’s songs. “Single” is
    more similar in Swift’s corpus, while “fake” is more similar in Beyonce’s.


    What jumps out when we see this scatter plot, though, is that the words are kind
    of a mess. Language is high-dimensional or feature-rich. Songs, like any other
    text, have multiple levels of meanings (Barthes and Duisit 1975). To map these
    meanings, we often *reduce these dimensions* to facilitate interpretation.


    # DIMENSION REDUCTION


    The matrices we use to represent document- and term- features are often “high
    dimensional.” In plain terms, this means our matrices have lots of columns. Consider,
    for example, the co-occurrences of words in a short piece of text: the excerpt
    from Kennedy’s Rice speech we previously auto-transcribed. It contains 35 unique
    types.'
