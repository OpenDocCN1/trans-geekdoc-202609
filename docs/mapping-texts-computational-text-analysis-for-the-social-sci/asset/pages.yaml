    +   - tidytext\n+   - tokenizers\n+   - reshape2\n+   - quanteda\n+   - text2map\n\
    \nOnce tokenized, each document is a list of tokens. We then count how often each\
    \ *unique* token<sup>10</sup> occurs in each document. With a single document,\
    \ we represent its content as a vector of numbers. The position in the vector\
    \ references a unique type. The number is how often that type occurs in that document.\n\
    \n> This is called a *type* in contrast to a *token*.\n\nThere are two things\
    \ to note when transforming a token list into a token-count list. First, we won't\
    \ retain the *order of the words* in a document. Second, we collapse tokens that\
    \ are *precisely* the same characters. For example, \"The\" and \"the\" would\
    \ be counted as distinct tokens, as would \"Raúl\" and \"Raul.\" Let's use an\
    \ excerpt from Mary Shelley's *Frankenstein*.\n\n```\ndoc <- \"nothing is so painful\
    \ to the human mind\n as a great and sudden change the sun might\n shine or the\
    \ clouds might lower but nothing\n could appear to me as it had done the day\n\
    \ before a fiend had snatched from me every\n hope of future happiness no creature\
    \ had ever\n been so miserable as I was so frightful an\n event is single in the\
    \ history of man\"\n```\n\nWe'll tokenize using `strsplit()` and the regular \"\
    space.\" The output of this function is a **token list**. Next, we'll use `table`\
    \ to count how many times each unique token occurs in the document, creating a\
    \ **token-count list**.\n\n```\n# tokenize by splitting into words by space\n\
    docs_tokens <- strsplit(doc, \" \", fixed = TRUE)\n\n# get word frequencies\n\
    docs_freqs <- table(docs_tokens)\n```"
