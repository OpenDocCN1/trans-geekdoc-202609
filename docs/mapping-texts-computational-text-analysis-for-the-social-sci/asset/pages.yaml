  md: '# AUTOMATED WEB SCRAPING


    # THIS SECTION NEEDS:


    +   - tidyverse

    +   - lubridate

    +   - rvest


    Many websites with APIs have no R wrappers and no public API. Sometimes those
    with APIs and wrappers are too restrictive, too expensive, or are suddenly deprecated
    (Freelon 2018). In these scenarios, we’ll turn to custom scrapers.12


    rvest is a popular package for building scrapers. First, we’ll need a URL of a
    webpage to scrape. Let’s scrape some data from arXiv—a free repository of scientific
    “e-prints” (digital preprints and postprints) of scientific articles.13 Say we
    want all papers uploaded to arXiv with the statistics classification. Let’s go
    to arxiv.org in our Web browser, click on “Advanced Search,” check the “Statistics
    (stats)” subject box, ensure that the “All Dates” is checked, and then click “Search.”


    As of June 2022, this search returns 82,286 results. Figure 5.5 (left panel) is
    a screenshot of the results page. This page gives useful information for each
    paper: the arXiv ID, subject tags, title, authors, abstract, abstract date, and
    announcement date. We want to collate this information into a dataframe. Here’s
    where rvest comes in.


    First, we need the base URL for this search. Copy the URL from the Web browser’s
    search bar. Assign it to an object in R (ensure there are no spaces). It is long,
    so we’ll break ours into pieces and paste them together. The link should end with
    “announced_date_first”.


    ```

    url <- paste0(

    "https://arxiv.org/search/advanced?advanced=&",

    "terms-0-operator=AND&terms-0-term=&",

    "terms-0-field=title&",

    "classification-physics_archives=all&",

    "classification-statistics_y=",

    "classification-include cross list=include&",

    "date-filter_by=all_dates&date-year&",

    "date-date_type=date_type&",

    "date-date_type=submitted_date&",

    "abstracts=show&size=50&",

    "order=-announced_date_first"

    )

    ```


    We need to know how many pages we could scrape but arXiv doesn’t tell us. So,
    we need to guess.14 Each page displays 50 papers, for example, page two displays
    papers 51–100. With about 85,000 papers (see Figure 5.5, left panel), that would
    be around 1700 pages—that’s too many for our demonstration! Let’s grab the first
    5,000 papers.


    This code produces a string of numbers, from 0 to 4,950 (with the first page starting
    at 0 and the 100th page starting at 4,950 for a total of 5,000 returned papers
    and 100 total pages).


    There are downsides to scrapers. We need to tailor them for each site and minor
    updates could “break” the scraper. However, the skillset is highly transferable
    across sites.


    arxiv.org does offer an API, a point we’ll return to in the next section.


    It is also possible to click the “Next” button using follow_link in rvest .'
