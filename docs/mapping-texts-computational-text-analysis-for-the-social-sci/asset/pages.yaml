  md: 'than a walk" (Merriam-Webster 2020)? Or do we not care that "boat" is a noun,
    "boated" is a verb, and "boating" can be a noun or a verb, and only care about
    the general discourse around boating? If the latter is the case, we can drastically
    reduce the dimensions of our data by either *stemming* or *lemmatizing* our tokens.
    Let’s discuss stemming first.


    # Stemming


    **Stemming** is the process of reducing words down to their “stems” or “roots”—that
    is, the “core” character sequence without *affixes*.31 Automated word-stemming
    procedures use rule- or dictionary-based functions to return one or more of these
    word stems per word in a text or corpus.


    Consider the following words: “roll,” “rolls,” “rolling,” and “rolled” Let’s take
    each word and separate the base form from the affix—specifically, the suffix:


    +   - roll -

    +   - roll - s

    +   - roll - ing

    +   - roll - ed


    **Roll** is the stem; it is the base to which suffixes are attached to indicate
    plurality (-s), continuous tense (-ing), and past tense (-ed). These are all examples
    of *inflectional suffixes*: suffixes used to change a word’s grammatical features,
    such as the number or tense, but which do not alter the word’s part of speech
    or meaning.


    Now consider the word **roller**: a person who (or thing that) revolves. We can
    decompose this word down to its stem and suffix as well:


    +   - roll - er


    This is a *derivational suffix*: it creates a noun (if treating “roll” and its
    inflections as verbs), or a different type of noun (if treating “roll” and its
    inflections as nouns). All *prefixes* in English are also derivational since they
    alter the grammatical category and/or meaning of the base word, such as *un-roll*.


    Stemming algorithms try to reduce terms to common forms: for example, “roll.”
    Two popular stemmers are the “Porter” and “Porter2” stemmers. These stemmers mostly
    deal with inflectional rather than derivational affixes, and both focus on suffixes.
    The Porter stemmer uses a rule-based system first outlined in a 1980 paper by
    Martin Porter (Porter, et al. 1980) to strip (mostly) inflectional suffixes.32
    The Porter2 stemmer—also known as the “English stemmer”—is a revision of the original
    Porter algorithm, but functions the same way (Porter et al.


    31 While the social scientist may be more interested in the stems, the linguist
    may find the affixes more useful, for example, for studying morphology.


    32 As an undergraduate, the computational linguist Julie Beth Lovins published
    the first paper (1968) systematically comparing potential stemming algorithms,
    discussed key challenges in developing stemmers, and also proposed the Lovins
    Stemmer.'
