  md: '# Tagging Words


    > > ...all the familiar landmarks of thought—our thought, the thought that hears
    the stamp of our age and our geography—breaking up all the ordered surfaces and
    all the planes with which we are accustomed to tame the wild profusion of existing
    things...

    > > —M. Foucault


    BORGES'' infamous (tongue-in-cheek) taxonomy of animals from the Celestial Emporium
    of Benevolent Knowledge epitomizes a notion we often encounter in the social sciences:
    classifications are shaky. Realizing this shakiness led to Foucault''s "laughter
    that shattered, as [he] read [Borges''] passage, all the familiar landmarks of
    [his] thought" (Foucault 2005).


    +   - embalmed ones

    +   - suckling pigs

    +   - stray dogs

    +   - fabled ones

    +   - those included in this classification


    While there are regularities to our perception of the world (Lakoff 2008), a discrete
    and complete classification of anything is unlikely (Douglas 1966). Many of our
    tools incorporate classification schemes that we did not craft for our corpora,
    but rather impose upon them. When we classify text, we often rely on someone''s
    interpretation, which is contextual and open to revision.1


    1 This is also why we need to carefully document our analytical decisions—see
    Project Workflow.


    Classifiers are automated processes that associate text with labels based on patterns
    in the text. These boundaries between labels are often fuzzy and graded. But this
    is not unique to text analysis. Ponds and lakes are "bodies of water surrounded
    by land," and the difference is that one is larger, deeper, or colder. How much
    larger, deeper, or colder? There is no precise answer.


    It is common to use "accuracy" and "performance" to describe a classifier''s validity.
    However, as we''ll see throughout this book, classifiers are compared to someone''s
    interpretation. So, it is more appropriate to think of the agreement between our
    tools and other benchmarks of meaning, including with our own judgment.


    2 For example, whether a review in a set of Amazon product reviews is a "good
    review" or a "bad review." See Extended Deducive.


    Document classifiers tell us whether a piece of text—in its entirety—belongs to
    a predefined category.2 Below we introduce sub-document classifiers, or taggers.
    Taggers share much with qualitative content analysis because pieces of relatively
    short pieces of texts are "coded" as instantiating a category or theme and each
    document may contain multiple tags.


    3 In Lao Tzu''s quote "A journey of a thousand miles begins with one step," thousand
    is an adjectival modifier of miles and therefore "depends on it" in the sentence''s
    syntactical structure.


    Tagging can be a method of analysis in itself—for example, finding the "dependencies"
    between words or phrases3 in a sentence to'
  merge: -1
  img_proc: true
- pgno: 130
  md: "identify semantic motifs (Stuhler 2022b) or subject-action-object grammars\
    \ (Franzosi 2004). Or, researchers might use a tagger to further preprocess texts\
    \ (say, to identify the part of speech for each word) for later analysis, or use\
    \ tagging to extract useful variables (e.g., named people or organizations). The\
    \ goal, then, is to \"label\" words (or other sub-document units) as being of\
    \ different linguistic types or meaningful categories using rule- and dictionary-based\
    \ methods. In the rule-based approach, semantic and syntactic features inform\
    \ how a target unit is tagged. In the dictionary-based approach, units are matched\
    \ (either literal characters or regex patterns) to a key, and given the associated\
    \ value.\n\n# DICTIONARY TAGGING\n\nWe begin with a straightforward (computationally,\
    \ at least) example: tagging the “gender” of pronouns, titles, and names. This\
    \ method relies on dictionaries, a data structure with a **key** (here, a unique\
    \ given name, title, or pronoun) and a **value** (here, the gender category associated\
    \ with that name, title, or pronoun). Let’s create a simple pronoun tagger by\
    \ building a dictionary (see output in the margin).\n\n```\n# basic gender - tagging\
    \ dictionary\nfem_pronouns <- c(\"she\", \"her\", \"hers\")\nmas_pronouns <- c(\"\
    he\", \"him\", \"his\")\n\ngender <- data.frame(\n  word = c(fem_pronouns, mas_pronouns),\n\
    \  gender = c(rep(\"feminine\", 3), rep(\"masculine\", 3))\n)\ngender\n```\n\n\
    Let’s test this dictionary on a sample of 100 posts from the CMU Political Blogs\
    \ Corpus (Eisenstein and Xing 2010).\n\n```\ndata(\"corpus_cmu_blogs100\", package\
    \ = \"text2map.corpora\")\n\n# let's unnest by token and join our tagger by \"\
    word\"\ncorpus_cmu_blogs100 |>\n  unnest_tokens(word, text) |>\n  left_join(gender,\
    \ by = \"word\") |>\n  count(gender)\n```\n\nWe also have a slightly larger gender-tagger,\
    \ the tiny_gender_tagger() (in text2map), which uses the same dictionary-based\
    \ method, but includes more pronouns as well as titles (mother, father, mister,\
    \ mrs, etc.).\n\nLet’s compare.\n\n```\ncorpus_cmu_blogs100 |>\n  unnest_tokens(word,\
    \ text) |>\n  left_join(tiny_gender_tagger(), by = \"word\") |>\n  count(gender)\n\
    ```\n\n+   THIS SECTION NEEDS:\n+   * tidytext\n+   * tidyverse\n+   * text2map\n\
    +   * gender\n+   * genderdata\n+   * stringi\n\n| word | gender |\n|---|---|\n\
    | she | feminine |\n| her | feminine |\n| hers | feminine |\n| he | masculine\
    \ |\n| him | masculine |\n| his | masculine |\n\n| gender | n |\n|---|---|\n|\
    \ 1 feminine | 117 |\n| 2 masculine | 532 |\n| 3 <NA> | 46817 |\n\n| gender |\
    \ n |\n|---|---|\n| 1 feminine | 184 |\n| 2 masculine | 668 |\n| 3 <NA> | 46614\
    \ |"
