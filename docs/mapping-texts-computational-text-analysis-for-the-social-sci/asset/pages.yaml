  md: '![](img/ccc0ce559da97114ef913045f55e3801_55_0.png)


    # Figure 4.4: Florentine Family Network as a Graph.


    34 The layout of this graph uses the Fruchterman-Reingold force-directed algorithm
    (Fruchterman and Reingold 1991). There are numerous layouts to choose from.


    The row and column names of the matrix are the nodes and the cell entries are
    the ties. Since this network is unweighted, the presence of a tie corresponds
    to a "1" in the matrix and the absence of a tie is a "0" in the matrix. The network
    is also undirected; thus, the absence of arrows indicating the "flow" of the tie.34


    This is an example of a unipartite graph, and the corresponding matrix is a unimodal
    matrix. We know this because the nodes are all the same kinds of things, here
    families. We''ll also work with bimodal matrices: the row and column entities
    are different. An example from network analysis is the Southern Women dataset
    (Davis et al. 1941), documenting which of 14 social events (columns) 18 women
    in a Mississippi town (rows) attended.


    Recall the one-mode projection. A bimodal matrix has two projections (i.e., two
    possible "modes"): the row-level projection and the column-level projection. Since
    graphs and matrices are two ways to represent the same network, projecting a bipartite
    graph into two unipartite graphs is equivalent to projecting an incidence matrix
    into two adjacency matrices.


    # A LITTLE MATH GOES A LONG WAY


    Unlike the mathematics that many encounter in statistics courses, this chapter
    approaches quantification first from the perspective of linear algebra.35 Most
    of what gets called "Artificial Intelligence" and "machine learning" are built
    with basic linear algebra operations like the dot product, matrix multiplication,
    and singular value decomposition. This is a simplification, of course, but not
    an inaccurate one. Whenever a technique in this book uses a mathematical tool
    covered in this chapter, we''ll refer readers back in a margin note.


    35 For an accessible introduction to this branch of mathematics, see Strang (2020).'
