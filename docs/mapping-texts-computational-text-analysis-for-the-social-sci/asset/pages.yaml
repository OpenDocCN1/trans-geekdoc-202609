- pgno: 183
  md: 'Butler''s *Parable of the Sower* partially with “climate change” and partially
    with “inequality.”


    The most popular form of fuzzy clustering is **topic modeling**. There are several
    topic modeling methods. They all share a focus on uncovering the *latent themes*
    of a corpus. These are all dimension reduction methods, where the goal is to find
    the major axes of variation, or dimensions, along which word co-occurrences are
    organized. We could call these dimensions a variety of things—categories, themes,
    labels—but we’ll stick with topics.


    Most of what goes by “topic modeling” are probabilistic models. We’ll start, though,
    with a non-probabilistic form of topic modeling, but one which nonetheless allows
    topics to be present in documents to varying degrees.


    # Topic Modeling with LSA


    The most basic form of topic modeling is using *singular value decomposition*
    (SVD) on the DTM.22 This method has been around for quite some time, though by
    a different name: *latent semantic analysis* (LSA) (Deerwester et al. 1990), also
    known as *latent semantic indexing*.


    Assuming the DTM has d documents and t terms in it (i.e., d rows and t columns),
    the square document-topic matrix23 will have d × d topics and the square topic-term
    matrix will have t × t topics. The diagonal of the diagonal matrix will have as
    many non-zero entries as there are documents or terms, whichever is smallest (usually
    documents); the rest of the diagonal—including the non-diagonal entries—are zero.


    We haven’t reduced the dimensionality of the DTM yet—if anything, we’ve increased
    it! First, we can ignore the topics (singular vectors) from the topic-term matrix
    that extend beyond the dimensionality of the document-topic matrix (or vice versa,
    if we have more documents than we do terms). These topics will have singular values
    of zero. So, now we are left with d × d and a t × d matrices.24


    Recall that singular vectors and singular values are rank-ordered: this means
    that the kth topic of the document-topic matrix and the kth topic of the transpose
    of the topic-term matrix correspond to the kth singular value, and these are arranged
    by *variance explained*. Still, we don’t know how many topics we want to retain.
    This is, just like clustering, an open question. We want topics that make sense
    (we’ll get to interpretation soon). We also want to discard topics with tiny singular
    values because they explain little variance in the semantic structure of the DTM.


    22 See Math Basics.


    23 Our “dimensions” or “singular vectors” from SVD are “topics” in LSA nomenclature.


    24 The number of non-zero singular values is the *rank* of the original DTM.'
