  md: 'TRUE or FALSE). This is a species of categorical measure. A term may be associated
    with a label, and by using that term, a document is tagged with that label.⁶


    Discrete indicators can involve several categories; thus, binary indicators are
    categorical, but not all categorical indicators are binary.


    Recall a dictionary is a data structure comprising a key and a value. The key
    is any unique character string (or regular expression). In the simplest case,
    the value is a simple tag of presence (and by omission, absence). Therefore, the
    binary indicator is likely the most pervasive technique in computer-assisted text
    analysis.


    Consider Griswold''s “The Fabrication of Meaning.” The evidence Griswold uses
    to support the claim that multivocal cultural objects garner more cultural power
    is, in part, whether reviews of the Barbadian novelist George Lamming''s books
    were “positive” or not and referred to the book as depicting “ambiguity” or not.
    In Table 9.1 below (reproduced from Griswold (1987:1109), we compare the proportion
    of book reviews engaging a unit of meaning by a single covariate: the novel a
    review is targeting.


    Table 9.1: Ambiguity and Evaluation by Novel


    | Novel | Mention Ambiguity | Favorable |

    |---|---|---|

    | In the Castle of My Skin | 50% | 67% |

    | The Emigrants | 31% | 19% |

    | Of Age and Innocence | 42% | 75% |

    | Season of Adventure | 33% | 25% |

    | Water with Berries | 63% | 50% |

    | Natives of My Person | 40% | 47% |


    Griswold tagged each review by hand. Correll and colleagues (2020:1031–2), similarly
    hand-label over two hundred employee performance evaluations using a team of three
    researchers (see also Hallett et al. 2019:552).


