    The first singular value explains roughly 89% of the variance in the original
    matrix. We can use this singular value to create the approximation of the original
    matrix using the following.


    ```

    # prepare the first component matrices

    u1 <- - UDV$u[, 1, drop = FALSE]

    v1 <- - UDV$v[, 1, drop = FALSE]

    d1 <- - diag(UDV$d)[1, 1, drop = FALSE]

    # approximate the original

    A1 <- u1 %*% d1 %*% t(v1)

    A1

    ```


    ```

    [,1] [,2] [,3] [,4]

    [1,] 1.333 1.333 0 1.333

    [2,] 1.000 1.000 0 1.000

    [3,] 1.000 1.000 0 1.000

    [4,] 1.000 1.000 0 1.000

    [5,] 0.667 0.667 0 0.667

    [6,] 0.667 0.667 0 0.667

    ```


    30 This is the motivation behind all dimension reduction techniques.


    If we include more than the first singular value, we’d more precisely reproduce
    the original matrix. We can also create a “reduced” matrix to approximate the
    original.30 The rows of our original matrix are vectors of four dimensions. Only
    two singular values are not zero, though. So, let’s reduce the matrix to two.


    ```

    k_seq <- seq_len(2L)

    v_r <- - UDV$v[, k_seq, drop = FALSE]

    d_r <- - diag(UDV$d)[k_seq]

    u_reduced <- A_mat %*% v_r %*% d_r

    round(u_reduced, 2)

    ```


