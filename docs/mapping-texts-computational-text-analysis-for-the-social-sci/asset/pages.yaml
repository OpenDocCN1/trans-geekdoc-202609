  md: 'Next, we''ll decide on our **model architecture**, which includes the (1) number
    and types of “layers,” how we’ll (2) measure accuracy and (3) update our weights
    as we go. First, we initialize a “sequential” network.

    We then decide to use two layers (in addition to our “input” layer).


    The first `layer_dense()` is our “hidden” layer between the input and output steps.12
    Here, we reduce our input matrix, which has 15,758 columns, to just 1,200. This
    is arbitrary, though, and changing it may improve our final results. The informal
    rule is to select a number somewhere between the size of the input (here, 15,758)
    and the size of the output (here, 3).


    Our one hidden layer uses the popular activation function RELU, in which negative
    inputs return a zero, while positive inputs return the input value.


    The final layer is just logistic regression. “Logistic” is a family of similar
    functions. When we only have two classes, we use the “sigmoid” function; when
    we have more than two, we use “softmax.” The number of units of this output layer
    is the number of labels to predict.


    ```

    ke_mod <- keras_model_sequential()

    ke_mod |>

    layer_dense(units = 1200,

    activation = "relu",

    input_shape = ncol(ke_dtm_trn)) |>

    layer_dense(units = 3,

    activation = "softmax")

    ```


    To recap, our neural network has three layers: (1) the input DTM with 15,758 “dimensions,”
    (2) the “hidden” layer reduces our 15,758 to 1,200 using the RELU activation function,
    and (3) the output layer reduces 1,200 down to just 3 using logistic regression.
    Without the hidden layer, we’d just be doing logistic regression!


    Next, we''ll configure how to measure performance and use that information to
    update our weights during each iteration. There are many **loss functions** that
    measure how well a model predicts our labels. The “categorical cross-entropy”
    is suited for more than two labels.13 To update, we’ll use “stochastic gradient
    descent” (SGD), which compares the predicted values to a random sample of the
    input. This reduces the complexity for each pass, but does require more iterations
    to converge than if we used the entire input every time. Finally, when the model
    converges, we’ll want to see some metrics on the final predictions. **Accuracy**
    tells us the percent of the documents that were labeled correctly.

    Configure our loss, optimizer, and accuracy measures:


    12 It’s “hidden” because we won’t inspect or use it outside of this task. We do
    see the input data, of course, and we’ll be inspecting and using our output (i.e.,
    weights on features and predicted labels).


    13 Cross-entropy compares the “entropy” (the negative log of a probability) for
    the predicted labels and the actual labels.'
