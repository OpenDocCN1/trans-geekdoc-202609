- pgno: 191
  md: 'LDA, and most topic model algorithms stemming from it, follow a generative
    Bayesian model. This means the algorithm (1) assumes a document-generating process,
    and (2) given that process, uses an iterative procedure to maximize the likelihood
    that we’d observe the data that we do in our DTM.


    First, there is the document-generating process. With LDA we assume that, for
    any given document, we: (1) randomly choose a probability distribution over a
    set of k topics (where the size of k is selected by researchers). Then, (2) we
    randomly choose one of the topics from the distribution, and then (3) randomly
    choose a word from that topic (Blei 2012:78). We continue this process for each
    word in a document as if this is how one goes about writing anything.


    Let''s walk through that idea. Imagine we''re writing a story about zombies. The
    generative assumption is that we first establish the range of topics we might
    cover in the story. This might include “eating brains,” “zombie apocalypse,” “contagious
    virus,” and “consumerism.” We’re also more likely to discuss some topics over
    others. For example, if we quantify it, we might say that we have a 40% chance
    of writing about eating brains, a 10% chance of writing about a zombie apocalypse,
    a 26% chance of writing about a contagious zombie virus, and a 24% chance of writing
    about consumerism (using zombies as a critique of American mass consumption).
    This forms the documents’ probability distribution over k (and here, k = 4) topics
    from step (1) above.


    From here, we then choose one of the topics to write about. In our example, the
    most probable candidate is “eating brains,” since it has the highest probability
    of being chosen (40%). Within that topic, we are more likely to use some words
    over others. For example, in this topic, we’re more likely to use words like “brains,”
    “skull,” and “gore” than words like “virus,” “contagious,” or “lab.” So, within
    that topic, we have another probability distribution—but instead of a distribution
    of our document over a set of k topics, now we have a distribution of the “eating
    brains” topic over ν words, where ν is our vocabulary. Within this topic-word
    distribution, then, we pick a word. In our case, we’ll favor words that communicate
    something about eating brains. This is the word that gets put down on the page.


    Writing is a sequential process, so all we have to do is iterate for each word
    in the document. Keeping the document-topic distribution from step (1), we repeat
    steps (2) and (3) above to create our zombie story. Then, for any other zombie
    story in the corpus (produced by us or someone else), we again pick a probability
    distribution over those k topics'
  merge: -1
  img_proc: true
- pgno: 192
  md: '(i.e., repeat step [1]), and then go back to steps (2) and (3). And on and
    on we go until each story is finished.


    Notice we assume two types of distributions: each document’s probability over
    topics and each topic’s probability over the vocabulary. These are parameters
    that we do not *initially* derive from the data.35 The trick, then, is to randomly
    pick these distributions and then continuously simulate this document-generating
    process—each time updating these parameters until, eventually, we get the maximum
    log-likelihood of getting the observed DTM.36


    If we row-bind our document-topic distributions and row-bind our topic-word distributions,
    then we get two inductively derived matrices: a *document-topic probability matrix*
    and a *topic-term probability matrix*. The first is often called the *gamma* (or
    *theta*) matrix, while the second is called the *beta* (or *phi*) matrix.


    These matrices are the core output from LDA. We’ll use the topic-term probability
    matrix to determine what each topic is about, and we use the document-topic probability
    matrix to determine which topics (or combinations of topics)37 are more prevalent
    in the document.


    Let’s use the same SOTU subset from the LSA example. Recall, we have two versions
    of our SOTU DTM: one with non-distinguishing terms removed ( `dtm_sotu_sub` )
    and one without those terms removed ( `dtm_sotu` ). We’ll start with the latter
    and see if those terms (or new terms) must be removed to give better topics.


    We’ll use `topicmodels` and the `LDA()` function. We need to supply our DTM and
    our *k*. Our last LSA model gave us 9 topics, so let’s roll with that. We can
    also specify our estimation method—either variational inference ( `"VEM"` ) or
    collapsed Gibbs sampling ( `"Gibbs"` ). The original LDA paper uses variational
    inference (Blei et al. 2003), which is also the default.38 Since there is randomness
    to this procedure (unlike LSA), we’ll also set a “seed” so our results can be
    reproducible.


    ```

    opts <- list(seed = 61761)

    lda_sotu <- LDA(dtm_sotu, k = 9, control = opts)

    ```


    Let’s look at the terms with the highest probability of being associated with
    each topic. `topicmodels` has a convenience function for this: `terms()` .


    ```

    terms(lda_sotu, 5)

    ```


    | | Topic 1 | Topic 2 | Topic 3 | Topic 4 | Topic 5 |

    |---|---|---|---|---|---|

    | [1,] | "people" | "must" | "must" | "people" | "america" |

    | [2,] | "us" | "people" | "america" | "can" | "world" |


    > 35 These distributions are random draws from *Dirichlet distributions*—thus,
    the model’s name.


    > 36 There are various strategies for doing this with iteration, namely, collapsed
    Gibbs sampling and variational inference.


    > 37 LDA is, therefore, like LSA in that it is fuzzy clustering. LDA models are
    “mixed membership” (Blei et al. 2003). Each word gets a vector of probabilities
    across all topics, and each document is assigned a probability for each topic.


    > 38 It’s a good idea to compare outputs using both estimation types (Grimmer
    et al. 2022:149).'
