    # Genres and Topics


    As we delimit further, we arrive at more specific conventions regarding the content
    of a given text. Knowing that a given selection is science fiction, for instance,
    we can make inferences about the content of the text, but likely not the media—this
    could be subtitles of a popular streaming series or chapters from a book series.
    At the level of genres and topics, we no longer attempt to impose a mutually exclusive
    classification scheme atop our text. Any selection of text may be placed in multiple
    genres or engage with several topics at once (Fowler 1982:37).19 Even within this
    dimension of variation are levels of generality. Fiction and non-fiction are among
    the most general. Philosophers and literary theorists have debated this distinction
    for millennia, but it still provides useful guardrails when building a corpus.20
    This is because genres and topics tell us something about the community and context
    of a text—hints about the intents and desires of authors and audiences. They inform
    the “substantive hunch” (Martin 2001) that animates our analysis.


    19 As Derrida (1980) explains: “Every text participates in one or several genres,
    there is no genreless text.”


    20 Aristotle (1907:35) states: “The work of Herodotus might be put into verse,
    and it would still be a species of history, with meter no less than without it....
    Poetry, therefore, is a more philosophical and a higher thing than history: for
    poetry tends to express the universal, history the particular.”


    # Registers and Styles


    In the same way as genres and topics cut across media, domain, etc., so do register
    and style. Register is commonly equated with formality. For example, in Turkish
    and French it is common to speak in the plural to indicate a level of social distance,
    and in Shakespeare, “thou” is informal and singular while “you” is formal and
    plural. In addition to formality, register typically includes perspective—first-,
    second-, third-person, but may also incorporate broader linguistic elements such
    as grammar and vocabulary.


    The sociologist Basil Bernstein studied the distinct class-related “registers”
    of talk, which he divided into elaborated and restricted “codes.” In extreme cases
    of restricted codes of talk, what is being said is “wholly predictable for speakers
    and listeners” (2003:126). His examples here are religious services or types of
    storytelling. He argued that the identity of working-class folk in London in the
    1950s was so thoroughly shared—because “of their common occupational function
    and social status”—this “reduces the need to verbalize intent so that it becomes
    explicit” (2003:111–3). Speaking is fast and condensed. So, he concludes that
    working-class people speak in a more restricted register than those in the middle
    class.'
