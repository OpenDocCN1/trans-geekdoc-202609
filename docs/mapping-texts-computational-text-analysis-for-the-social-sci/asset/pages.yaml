- pgno: 135
  md: 'In what follows, we''ll first address—in a general sense—how NER works. We''ll
    then provide a demonstration of NER tagging in R .


    # How Named-Entity Recognition Works


    Consider the following text (adapted from Mack 2019). NER taggers that are optimized
    correctly should return these “named entities” and the entity tags to which they
    belong, like so:


    > Star Trek: Picard, which debuted in January 2020 [Date/Time] on CBS [Organization]
    All Access, saw Patrick Stewart [Person] reprise his role as the noble leader
    more than 20 years after Star Trek: Next Generation ended. The trailer for the
    new show showed Picard retired at a vineyard on Earth [Location], but feeling
    out of place and longing for space travel.


    In this example, there are four entity taggers: ones that identify person names,
    organization names, dates/times, and locations, respectively. These are common
    entity tags, but this varies by the specific NER tagger used. entity also has
    taggers for money and percentages. The Stanford NLP Group’s CoreNLP library comes
    with more, including nationality, religion, and even cause of death (Manning et
    al. 2014).


    How NER algorithms “learn” to identify entity tags varies. They all rely on training
    data. These training data are sentences that have already been tagged by a human
    (or set of humans). For example, training data for a “person name” tagger would
    look like this:8


    8 The training data format must match the software being used. For the OpenNLP
    library, there must be one annotated sentence per line (Apache 2020).


    ```

    The CEO of Apple , <START:person> Tim Cook <END> , unveiled the new iPhone . Mr
    . <START:person> Cook <END> was joined on the stage by Chief Operating Officer
    , <START:person> Jeff Williams <END> .

    ```


    The training file would need to contain at least 15,000 line-separated annotated
    sentences (Apache 2020).


    So, the training documents are parsed by sentence, separated by line breaks, and
    the names are hand-labeled. A model then iterates through pre-specified context
    variables—what is called a “feature set” (Apache 2020).9 Some context variables
    might include: Is the word capitalized? Does the word follow a prefix such as
    “Mr.”, “Mrs.”, or “Dr.”?


    9 NER models typically have pre-specified context variables, but we can provide
    custom feature sets.


    10 The OpenNLP NER tool uses generalized iterative scaling for this.


    The algorithm uses co-occurrences between the tagged words and the context variables
    to develop a weight for each variable indicating the strength of the association
    between that variable and a class—here, either “is a person” or “is not a person.”10
    The output of any NER model are weights—that is, the “importance”—for each of
    the context variables.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'The trained NER model can then be used to predict the entity classes in new,
    unannotated texts.11 The NER model we''ll use is **pretrained**. So, no annotated
    training data are necessary. The OpenNLP NER model appears to have been12 trained
    on 318 *Wall Street Journal* articles forming the training set for a series of
    NLP evaluation tasks at the Sixth Message Understanding Conference (MUC-6) (Nouvel
    et al. 2016:61).


    11 This is done with maximum entropy (“maxent”) modeling in the case of OpenNLP
    .


    12 The OpenNLP training data was difficult to ascertain. We sleuthed the MUC-6
    data from a 2010 discussion post by Joern Kottmann on the OpenNLP SourceForge
    repository.


    # Named Entities in R


    The package we''ll use for named entity recognition is entity .13 It is an R “wrapper”
    for the Java-based OpenNLP library maintained by the Apache Software Foundation.14
    Let''s use the *Star Trek: Picard* paragraph as a quick illustration (output in
    the margin):


    ```

    para <- "Star Trek: Picard, which debuted in January 2020 on CBS All Access, saw
    Patrick Stewart reprise his role as the noble leader more than 20 years after
    Star Trek: Next Generation ended. The trailer for the new show showed Picard retired
    at a vineyard on Earth, but feeling out of place and longing for space travel."


    person_entity(para)

    organization_entity(para)

    location_entity(para)

    date_entity(para)

