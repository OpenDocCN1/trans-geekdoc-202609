- pgno: 72
  md: '1976, Section 107, and is meant to carve out the space to use certain amounts
    of copyrighted material without the need for licensed approval. Research is one
    area for which “Fair Use” is meant to apply, including “criticism, comment, news
    reporting, teaching, [and] scholarship” (US Copyright Office 2022a). But this
    provision is not meant to be a Get Out of Jail Free card; people using a work
    under the auspices of any of these types of uses can still have a copyright infringement
    claim bought against them. Per the 1976 Copyright Act, users (and, if the situation
    arises, courts) are to use the following factors when determining whether a use
    is “protected” by the “Fair Use” doctrine (US Copyright Office 2022a):26


    +   1. Purpose and character of the new use. Is the new use going to generate
    a profit or some sort of revenue? How different is the new use from the copyrighted
    work? Is it purely “derivative,” or is it “transformative”?


    +   2. Nature of the original work. How “creative” is the original work? Is it,
    say, a novel, or a newspaper article? Since copyright law is meant to protect
    creative activity from exploitation, the former sets a higher bar for meeting
    “fair use” than the latter.


    +   3. Amount. How much of the original copyrighted work is being used in the
    new use? Regardless of the quantitative amount, is the “essence” of the copyrighted
    work being copied?


    +   4. Effect on the market for the original work. Is the new work going to directly
    or indirectly harm the original work’s ability to generate any profit or revenue?


    So, if a researcher is analyzing a collection of murder mystery novels and prints
    multiple pages of a book’s content and includes a portion that gives away a major
    plot spoiler, then the original copyright holder for the book might have grounds
    to bring an infringement claim. As in many legal contexts, “it depends.”


    Importantly, copyright law protects the material medium within which an idea is
    fixed—not the idea itself (Krotov et al. 2020). So, in theory, an analysis of
    a collection of texts is fair-game if no excerpts are provided—for example, the
    data is transformed into a document-term matrix (as discussed later). But, social
    science audiences often want to see some text to support the researchers’ claims.
    This is a reasonable request, but it also means that researchers should be mindful
    of how they are pulling from the copyrighted material.27


    26 Copyright laws vary by country. For example, “Fair Use” is not understood as
    broadly in European countries as in the US. Furthermore, this is not as harmonized
    across European Union member countries as are other areas of copyright law (Bently
    and Aplin 2019). To avoid copyright infringement, researchers are encouraged to
    explore copyright law in their own locale.


    27 If researchers decide to use, say, a company logo in their work, they may also
    be subject to trademark law.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Individual and Organizational Privacy


    One great thing about automated scraping is that we can collect, in a short period,
    far more webpages than we could read. Often we may not know whether it includes
    sensitive information. This is true even with ostensibly anonymized text, as was
    the case when the research arm of AOL released search data for 650,000 users,
    but without identifying the users. Nevertheless, _The New York Times_ showed how
    easy it was to identify one user from their search queries alone (Barbaro and
    Zeller 2006). Recall, also, text acquired from the Internet is “readymade.”28
    Therefore, “it is best to assume all data are potentially identifiable and potentially
    sensitive” (Salganik 2019:314).


    28 The producers did not create the text thinking of how it would contribute to
    our research projects—it is “unprompted” (Ignatow and Mihalcea 2016:13).


    Furthermore, automated collection from multiple sources, especially if we are
    merging them, could lead to “de-anonymization.” For example, say we are scraping
    Reddit, and we collect posts from a Redditor using a pseudonym. We might extract
    enough details from their Reddit posts—however vague—to learn their general occupation,
    general location, marital status, and perhaps some interests they prefer to keep
    secret. Perhaps one post from several years ago links to their Twitter account
    where, at one point, they posted a link to a job opening at their place of employment.
    With this information, we could de-anonymize their activity on Reddit. This hypothetical
    scenario shows how expectations of privacy are not always clear. As Nissenbaum
    (2009:2) argues, “What people care most about is not simply restricting the flow
    of information but ensuring that it flows appropriately.”


    When scraping, the website owners are not the only parties whose expectations
    of privacy may be compromised. For academics, some considerations are addressed
    by the institutional review board (IRB); but as Salganik (2019) argues, the IRB
    is a floor and not a ceiling. Privacy considerations neither begin and end with
    IRB approval, when scraping is completed, nor even when we publish our research.
    It is instead a continuous process. When we scrape text and structure it into
    an organized dataset, we become the stewards of the data, and also the stewards
    of those who produced, and are represented by, the text. We should continually
    revisit privacy issues and evaluate how our data—and transformation or publication
    of that data—may breach expectations.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 6

    From Text to Numbers


    > A map is not the territory it represents, but, if correct, it has a similar
    structure

    > to the territory, which accounts for its usefulness.

    > —A. Korzybski


    HUMANS started etching stone, ceramics, and metals over ten millennia

    ago. Ever since, writing proliferates, accumulating into a vast stock of

    human intentions, and resulting in a fundamental complication: How do

    we find a specific writing among all the other writings? This question blurs

    three technical considerations: (1) How do we represent texts efficiently?

    (2) How do we summarize the contents of a text? (3) How do we retrieve

    a text based on its contents? Many text analysis tools emerged to answer

    these very questions about **information retrieval**.


    The computer-assisted representation of textual data has remained

    a relatively niche suite of social scientific methods until the last two

    decades (e.g., Franzosi 2004; Weber 1984; Roberts 1989; Carley 1993;

    Mohr 1994), but scholars often used computer programs to *retrieve*

    relevant literature.


    For a long time, researchers melded representation and retrieval.

    Dewey, for example, a librarian at Amherst College in the 1870s,

    represented books’ content by an index. This index also designated the

    location of the books on the shelves. Later, several automated “retrieval”

    systems were developed that relied on microfilm—such as Vannevar

    Bush’s hypothetical “Memex” (Bush 1945). Although processing power

    increases yearly, increasing computerization exacerbates retrieval prob-

    lems as we accumulate text. Cumbersome top-down classification

    schemes like Dewey’s soon gave way to the *automated* representation of

    documents’ contents.


    In addition to information retrieval research, we rely on tools

    developed in **corpus linguistics**. This pragmatic—and staunchly anti-

    Chomskyan—approach emerged in the 1950s, aided by computeriza-

    tion. This field explored the frequency distribution of words, syllables,

    phrases, or grammatical features, as well as the “collocation” or the extent

    linguistic features co-occur in particular contexts (Firth 1957; McEnery

    and Hardie 2011).'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'We''ll draw extensively on these two fields—information retrieval and corpus
    linguistics. The first step in our journey involves turning words into a structured
    dataset with useful numeric quantities.


    1 A DTM is a common type of document-feature matrix (DFM), where the terms are
    our features.


    We''ll rely on two generic data structures as the primary cartographic tools:
    the (1) **document-term matrix (DTM)**¹ and the (2) **term-context matrix (TCM)**.
    The former is a tabular structure where the rows are our documents and the columns
    are the contexts in which a word appears. The latter is also a tabular structure,
    but the rows are terms and the columns may be the documents in which the terms
    appear (i.e., a rotated DTM) or the other terms a target term occurs alongside
    (a term-co-occurrence matrix) within a given window. We''ll continue to use these
    text matrices throughout this book.


    # THIS SECTION NEEDS:


    +   - tidyverse

    +   - tokenizers


    # UNITS OF ANALYSIS


    2 As we do in Extended Deductive.


    **Documents** are any collection of words, ranging from short social media posts
    or paragraphs to book chapters or full books. **Features** are sub-document units.
    Typically, this means characters, words, terms, or phrases, which we often call
    “tokens” and sometimes, n-grams. We may transform, summarize, or collapse tokens
    into more complex features, such as lemmas, syntax, topics, concepts, etc. By
    **authors**, we mean individuals, groups, or organizations responsible for the
    production of a document. Finally, a **corpus** is any collection of documents.
    For example, if we study the extent each play in Shakespeare’s First Folio engages
    with the concept of death,² each play is a *document*, the First Folio is a *corpus*,
    and we assume Shakespeare is the *author*. If we are instead interested in how
    a character’s gender in *The Comedy of Errors* influences what they say (e.g.,
    Hota et al. 2006), each speaking part is a *document* and the single play becomes
    our *corpus*.


    Generally, researchers want to make inferences about the documents or the authors
    by extracting patterns in their use of words. Say we collect tweets posted during
    the Fukushima Disaster. We may want to know which tweets are “conversational”
    and which are “informational” (Truong et al. 2014) or which authors experienced
    the disaster. We also want to make inferences about the meanings of the words
    themselves. These may, in turn, facilitate inferences about documents and authors.
    For example, “clean up” means something slightly different in tweets about the
    Fukushima disaster than those about restaurants. The first step, though, is to
    **tokenize**.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Tokenizing


    We often break a document into smaller units to represent the content of that
    document. The smallest units are called **tokens** and the process is called tokenizing.3
    These sub-document units are typically what''s in mind when we think of a “word”;
    however, we can tokenize a document into more complex units, such as n-grams—for
    instance, bigrams (every two sequential words) or trigrams (every three sequential
    words).4 We could also tokenize by character n-grams—for example, every two sequential
    characters.


    The simplest way to proceed is to assume that a “word” is our token. But trying
    to come up with a clear “rule” to tell an algorithm where each word begins and
    ends can be tricky. Again for simplicity, let’s say that all words are cleanly
    separated on either side by a single whitespace. This assumption fits best with
    Latin-based scripts, like English.5 Even then, it is easy to find exceptions to
    our rule. Is “New York City” or “merry-go-round” or “to and fro” one or three
    tokens? Is “I’ve” and “don’t” one or two?


    Let’s work through a demonstration. We prepared television scripts for Star Trek:
    The Next Generation using `rtrek`. The season 5 scripts are available in `text2map.corpora`.
    Below we’ll tokenize the seventeenth line of the season premiere (titled “Redemption,
    Part 2”). We’ll tokenize using the literal space between characters. In any tokenizing
    process, this is typically the fastest option.


    ```

    data("corpus_tng_season5", package = "text2map.corpora")

    df_trek <- corpus_tng_season5 # rename so it''s tidier

    dim(df_trek) # how many rows and columns

    ```


    This will tokenize by splitting into words on the *single space* (fixed = TRUE
    tells `R` this is literal characters).


    ```

    strsplit(df_trek$line[17], " ", fixed = TRUE)

    ```


    +   [[1]]

    +   [1] "Captain''s"     "log,"

    +   [3] "stardate"      "45020.4."

    +   [5] "We''ve"         "have"

    +   [7] "arrived"       "at"

    +   [9] "Starbase"      "Two-thirty-four,"

    +   [11] "where"         "I"

    +   [13] "have"          "taken"

    +   [15] "the"           "opportunity"

    +   [17] "to"            "make"

    +   [19] "a"             "proposal"

    +   [21] "to"            "Fleet"

    +   [23] "Admiral"       "Shanthi."


    3 As discussed previously, that language in general, and text in particular, can
    and should be segmented is an assumption (Aronoff 1992), but a necessary one for
    computational text analysis.


    4 A single word is often called a unigram.


    5 Tokenizing for Arabic scripts is particularly complex because characters may
    change depending upon their positions in a word. A word can be realized as four
    distinct tokens and requires morphological analysis before tokenizing (Attia 2007;
    Farghaly and Shaalan 2009).


    The backslash \\ is used to either make a literal character into a special one,
    or make a special character literal (often called “escaping”). As R also uses
    the backslash to “escape,” this can get complicated. We must use two backslashes
    so R passes just one backslash to the regex engine—this also means we need four
    backslashes to match one literal backslash!'
  merge: -1
  img_proc: true
- pgno: 77
  md: "That worked pretty well. However, words are separated by characters other than\
    \ a single space. For example, there are double-spaces, tabs ( \\t ), returns\
    \ ( \\r ), and newlines ( \\n ). To make sure we split on *any* whitespace between\
    \ characters, we can use the **regular expression** (regex)^6 \\s and add a +\
    \ to match one or more. Because we are now using a regex pattern rather than the\
    \ literal character, we remove fixed = TRUE .\n\n^6 Regular expressions are special\
    \ sequences matching a pattern of characters, rather than literal (i.e., fixed)\
    \ characters. The Unix operating system popularized regex and is now used across\
    \ programming languages. There are different regex “flavors” and these patterns\
    \ are often hard to read without a lot of practice.\n\n```\n```\n# tokenize by\
    \ splitting into regex whitespace\nstrsplit(df_trek$line[17], \"\\\\s+\")\n```\n\
    ```\n\nInstead of whitespace, we can use regex patterns to tokenize on any non-word\
    \ character ( \\w ).^7 We can also *negate* a match by putting characters in brackets\
    \ beginning with the caret ( [^] ). For example, a-z matches all lowercase English\
    \ letters, A-Z matches the uppercase, and 0-9 matches numerals, the following\
    \ matches any string of characters that is *not* within these sets: [^a-ZA-Z0-9]+\
    \ .\n\n^7 Capitals in regex often mean “not,” meaning the \\w pattern matches\
    \ word characters and \\W matches non-word characters.\n\n```\n```\n# tokenize\
    \ by splitting on non-word characters\nstrsplit(df_trek$line[17], \"\\\\W\")\n\
    # tokenize by splitting on non-alphanumerics\nstrsplit(df_trek$line[17], \"[^a-ZA-Z0-9]+\"\
    )\n```\n```\n\nWe can continue to customize our pattern—say, for example, if treating\
    \ dashed words like “two-thirty-four” as a single token—or we can use a pre-developed\
    \ solution for tokenizing with tokenizers . This package follows a list of over\
    \ a dozen rules to define word boundaries.^8 Notice that tokenize_strings() removed\
    \ capitalization and punctuation as part of the tokenizing process.\n\n^8 These\
    \ rules were developed by the International Components for Unicode (site.icu-project.org).\n\
    \n```\n```\ntokenize_words(df_trek$line[17])\n```\n```\n\n```\n```\n[[1]]\n [1]\
    \ \"captain's\" \"log\"\n [3] \"stardate\" \"45020.4\"\n [5] \"we\" \"have\"\n\
    \ [7] \"arrived\" \"at\"\n [9] \"starbase\" \"two\"\n[11] \"thirty\" \"four\"\n\
    [13] \"where\" \"i\"\n[15] \"have\" \"taken\"\n[17] \"the\" \"opportunity\"\n\
    [19] \"to\" \"make\"\n[21] \"a\" \"proposal\"\n[23] \"to\" \"fleet\"\n[25] \"\
    admiral\" \"shanthi\"\n```\n```\n\n^9 A related, but less common, way of tokenizing\
    \ is the skip n-gram, where we allow a certain number of words to be between two\
    \ or more words.\n\nWe may also want to treat otherwise separate words as a single\
    \ piece. For example, perhaps we want to divide our documents into every two-word\
    \ sequence, or bigram, in a text. We could include phrases on up to any n-sized\
    \ n-gram.^9"
  merge: -1
