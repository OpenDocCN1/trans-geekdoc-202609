    ```\nD_mat <- sqrt(round(eigen(ATA)$values))\nround(D_mat, 3)\n\n[1] 4.123 1.414\
    \ 0.000 0.000\n```\n```\n\nLet’s compare this to `svd()`.\n\n```\n```\nUDV <-\
