- pgno: 8
  md: 'Klein 2020). For computational social science, we recommend Bit by Bit (Salganik
    2019), Doing Computational Social Science (McLevey 2021), Data Analysis for Social
    Science (Llaudet and Imai 2022), and Statistical Rethinking (McElreath 2020).


    Finally, no equations! Regarding the mathematical details of a given measure,
    we show it with reproducible examples instead of formal equations. This does mean
    we sometimes must sacrifice precision for clarity. Anyone with at least high school
    math (and our Math Basics chapter) should be able to complete the analyses in
    this book. That being said, for a deeper understanding of the content in the Extended
    chapters, we suggest Strang (2020) and Roberts et al. (2022).


    # Suggested Course Readings for Instructors


    Below are some selections from this book for various courses not specific to computational
    text analysis.5 These suggested readings could pair well with other materials
    for a week on text data, for example. Chapters 3 and 4 are listed in almost every
    set, but these might be removed for upper-level courses.


    5 We, of course, recommend that you use the whole book for that class! Although,
    Extended chapters could be omitted for lower-level courses and the Computing Basics
    and Math Basics could be omitted for upper-level courses.


    +   - Introduction to Social Data Science: Chapters 3 and 4 for an overview of
    computing and math basics, the sections on “Supervision and Validation” and “Classic
    Training with Supervision” for an introduction to supervised learning, the section
    on “Document Clustering” in Chapter 10 (Core Inductive) for an introduction to
    unsupervised learning, and Chapter 13 (Project Workflow and Iteration) for data
    management.

    +   - Supervised Learning: Chapters 3 and 4 for an overview of computing and math
    basics, and Chapters 9 and 12 on Core Deductive and Extended Deductive methods,
    respectively.

    +   - Unsupervised Learning: Chapters 3 and 4 for an overview of computing and
    math basics, and Chapters 10 and 11 on Core Inductive and Extended Inductive methods,
    respectively.

    +   - Network Science: Chapters 3 and 4 for an overview of computing and math
    basics, the section on “Document Similarity” in Chapter 10 (Core Inductive) and
    the section on “Inference with Text Networks” in Chapter 12 (Extended Deductive).

    +   - Sociology of Language: Chapter 1 (Text in Context) and Chapter 2 (Corpus
    Building).'
