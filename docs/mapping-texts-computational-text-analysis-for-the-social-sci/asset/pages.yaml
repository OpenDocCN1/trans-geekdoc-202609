    Now, not only do we want to predict these labeled data, but also we want to use
    our model to, eventually, predict unlabeled data. If our model exactly fits our
    training data, but doesn''t work on new data, we call this **overfitting**. The
    standard way to address overfitting is by dividing our labeled corpus into a training
    set and then one or more "hold out" or "unseen" datasets (James et al. 2021:176).27
    We then later compare results using the two separate sets. Typically, we hold
    out about 25 to 30 percent of our data (cf. Afendras and Markatou 2019; Joseph
    2022). We''ll use helper functions from `rsample`. Since the function we''ll use
    to divide our sample—`initial_split()`—makes the splits randomly (in our case,
    stratifying by news source), we''ll set a seed to make the results reproducible.


    27 This is a form of **cross validation**—which cut its teeth debunking Rorschach
    tests as a predictor of job success (Kurtz 1948). The final sample used is typically
    called the "test" set and the one or more intermediary samples are called "validation"
    sets used to fine-tune a model (Ripley 1996:354).


    ```

    set.seed(5439)\ninit <- initial_split(df, prop = 3 / 4, strata = "source")\ndf_trn
    <- training(init)\ndf_tst <- testing(init)

    ```


    Next, we''ll represent our documents as DTMs, weighted by relative term frequencies
    (using `normalize()`). Note we are creating two DTMs, but the vocabulary must
    be the same. `dtm_builder()` has the `vocab` option for this. Again, for illustration,
    let''s restrict terms to only those that show up in at least 15 documents in our
    training set and less than 2,700 documents.


    ```

    dtm_trn <- df_trn |>\n  dtm_builder(text, doc_id = doc_id) |>\n  dtm_stopper(stop_doc_freq
    = c(15, 2700))\ndtm_trn <- dtm_trn[, sort(colnames(dtm_trn))]\ndtm_tst <- df_tst
    |>\n  dtm_builder(text, doc_id = doc_id,\n              vocab = colnames(dtm_trn))\ndtm_trn
    <- normalize(dtm_trn)\ndtm_tst <- normalize(dtm_tst)

    ```


    28 glmnet performs penalized regression. These models are preferred when there
    is a large number of predictors relative to observations. `cv.glmnet` performs
    the regression by separating the observations into k subsets—or "folds." Using
    all observations outside of that fold, it predicts the labels in the heldout subset
    to find the weight (lambda) for how much the penalty term should factor into the
    model''s cost function.


    As the outcome is binary, we''ll again use logistic regression. This time, however,
    our data is quite large: we''ll predict the labels of several thousand documents
    with potentially thousands of terms. So, we''ll use `glmnet` to fit our model.28


    ```

    fit <- cv.glmnet(\n  x = dtm_trn,\n  y = df_trn$positive,\n  family = "binomial",\n  intercept
    = FALSE\n)

    ```


    Next, we''ll use the model to "predict" the labels of our test set. As we also
    know the intended labels, we can calculate the accuracy of our prediction (or,
    the agreement between our tool and human annotators).'
