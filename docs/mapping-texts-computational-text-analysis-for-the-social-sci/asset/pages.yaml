- pgno: 180
  md: "it.17 The larger that difference, the more unique that word is to that cluster.\
    \ We then make a table that sorts each cluster's unique words in descending order\
    \ and reports the top 5 (see Table 10.1). These words facilitate interpretation.\n\
    \n> 17 This is the difference between each word's probability of occurring in\
    \ a cluster and all probability of occurring at all in the corpus.\n\n```\nget_clust_words\
    \ <- function(dtm, clusters, n_words) {\n  prop <- colSums(dtm) / sum(dtm)\n \
    \ k <- unique(clusters)\n  words <- lapply(k, function(x) {\n    sub <- dtm[clusters\
    \ == x, ]\n    res <- colSums(sub) / sum(sub) - prop\n    res <- names(sort(res,\
    \ decreasing = TRUE))\n    res <- paste(res[seq.int(n_words)], collapse = \",\
    \ \")\n    return(res)\n  })\n  return(data.frame(\n    cluster = k,\n    size\
    \ = tabulate(clusters),\n    top_words = unlist(words)))\n}\n```\n\n```\nget_clust_words(dtm_sotu,\
    \ hier_sotu$cluster, n_words = 5)\n```\n\n# Table 10.1: Five Clusters and Top\
    \ Words (Hierarchical Clustering)\n\n| Cluster | N Documents | Top Words |\n|---|---|---|\n\
    | 1 | 4 | people, care, health, government, work |\n| 2 | 5 | must, children,\
    \ century, ask, challenge |\n| 3 | 7 | iraq, terrorists, america, terror, freedom\
    \ |\n| 4 | 8 | jobs, energy, get, like, businesses |\n| 5 | 4 | american, thank,\
    \ great, administration, united |\n\nA quick inspection of the top words seems\
    \ to suggest five general themes that differentiate the SOTUs: healthcare policy,\
    \ community and its challenges, terrorism and national security, economy and jobs,\
    \ and “make American great again” (MAGA) discourse.\n\n# k-Means Clustering\n\n\
    An alternative to hierarchical clustering is k-means clustering. Both are “hard”\
    \ partitions: each document belongs to one and only one cluster. k-means clusters,\
    \ though, are formed by recursively moving documents to find the most “compact”\
    \ clusters. With this algorithm, documents within groups will be very similar.\
    \ Unlike hierarchical clustering, though, we are not trying to maximize the difference\
    \ between groups."
