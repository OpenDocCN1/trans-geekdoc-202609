- pgno: 40
  md: 'Often we''ll summarize the numbers in a vector to create a single number (i.e.,
    a scalar). The most common is the average or mean, which we get by summing all
    the numbers and dividing by how many numbers there are. We''ll also encounter
    the norm of the vector. The L1-norm involves adding the absolute values of all
    the numbers in the vector. The L2-norm results from squaring all the numbers,
    adding them, and getting the square root.


    ```

    vec1 <- c(1, 4, 4, 5)

    avg <- vec1 / sum(vec1)

    l1n <- sum(abs(vec1))

    l2n <- sqrt(sum(vec1^2))

    ```


    Depending on context, this is sometimes called the length, magnitude, or distance
    from the origin.


    The Pythagorean Theorem is a famous version of this formula, but we''re using
    it for more than just measuring triangles and spreading fava bean propaganda.


    Sometimes we subtract the mean from the vector, which shifts each number by precisely
    the amount of the mean. This is centering. One reason we might center is to make
    two vectors more easily compared. In the code below, after centering vec1 and
    vec2 , they now have the same means (at zero), and lower bound (at -2.5). This
    tends to make the math easier.


    ```

    vec1 <- c(1, 4, 4, 5)

    vec2 <- c(0, 5, 1, 4)

    ## centering vectors

    vec1 - mean(vec1)

    vec2 - mean(vec2)

    ```


    ```

    [1] -2.5  0.5  0.5  1.5

    [1] -2.5  2.5 -1.5  1.5

    ```


    In other cases, we''ll want to normalize or norm (as a verb) a vector, which involves
    changing our vector, so its norm equals one, i.e., a unit vector. We accomplish
    this by dividing the vector by a respective norm. The two most common are the
    L1- and L2-norms.


    ```

    vec1 <- c(37, 42, 47, 1138)

    # Normalize by L1 Norm

    norm1 <- sum(abs(vec1))

    vecL1 <- vec1 / norm1


    ## Normalize by L2 Norm

    norm2 <- sqrt(sum(vec1^2)) # L2 norm

    vecL2 <- vec1 / norm2


    # respective norms now equal 1

    sum(abs(vecL1))

    sqrt(sum(vecL2^2))

    ```


    ```

    [1] 1

    [1] 1

    ```'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Comparing Vectors


    In computational analysis, we often compare two vectors: Is this list of numbers
    different from another list of numbers, and if so, how different? Say we asked
    three people how many years they’ve worked at their job and how much they make
    per hour. We’ll have a list of years and a list of wages.


    ```

    years <- c(31, 41, 5)

    wages <- c(92, 65, 35)

    ```


    The order matters because each person’s answers must align. Response in the first
    position on the years vector should align with the response in the first position
    on the wages vector. When we compare the two, we’ll want to know if the numbers
    seem to go up in the same positions and down in the same positions. In our example,
    this helps us see patterns in how people’s wages relate to their years of experience.


    # Dot Product


    4 This is also called the inner product or scalar product.


    The cornerstone of methods for comparing vectors is the dot product.4 The dot
    product of two vectors involves multiplying each number in the first vector with
    its corresponding number in the second vector. Then we sum them to get a scalar.
    If we square a single vector and then sum all its elements, this is the dot product
    of a single vector with itself.5


    5 Note the L2-norm is the square root of the dot product of a vector with itself.


    ```

    vec1 <- c(1, 2, 4, 2)

    vec2 <- c(2, 3, 1, 1)

    dt1 <- sum(vec1 * vec2)

    dt2 <- 1 * 2 + 2 * 2 + 3 * 4 + 1 + 2 * 1

    all.equal(dt1, dt2)

    ```


    [1] TRUE


    6 Y to the sky! X to the left!


    Vectors are lists of numbers where the order matters, and we can think of them
    as coordinates in a space or the address on a map. As is tradition, on a flat
    plot with a vertical and horizontal number line, the side-to-side line is called
    x, and the vertical line is called y.6 Because we only have two number lines,
    we can know precisely where any point is with two numbers. Say we have three points.
    Call them Galifrey, Magrathea, and Trisolaris. The first vector is [1, 2], the
    second [3.5, 1], and the third [2.5, 3.5]. Plotting these points gives us a vector
    space (see Figure 4.1).'
  merge: -1
  img_proc: true
- pgno: 42
  md: '![](img/ccc0ce559da97114ef913045f55e3801_42_0.png)


    Figure 4.1: Vectors in a Two-Dimensional Vector Space.


    # Euclidean Distance and Cosine Similarity


    The similarity between two vectors is now about space: What is the **distance**
    between each point? We primarily measure distances in two ways: Euclidean and
    cosine. Euclidean distance is the shortest line between two points. This metric
    ranges from 0 (identical points) to some unknown upper bound that varies from
    dataset to dataset. Cosine—or **cosine similarity**—is the angle formed when drawing
    a line from each point to the origin [0, 0]. This ranges from 1 (identical points)
    to either 0 or −1, depending on the data.<sup>7</sup>


    The key to both is the _dot product_. To find the Euclidean distance, we’ll first
    subtract the two vectors. This result is a vector of the differences between the
    original two vectors. Next, we’ll square this difference vector, sum it, and then
    find the square root. In the case of a single vector, this is the square root
    of the dot product of the vector with itself—that is, the _L_<sub>2</sub>- norm
    (output in margin).


    ```

    magrathea <- c(3, 1)

    gallifrey <- c(3.5, 1)

    # Difference vector

    dif <- magrathea - gallifrey

    # Dot product

    dif_dot <- sum(dif^2)

    # Square root

    euc_dist <- sqrt(dif_dot)


    euc_dist

    ```


    To find the cosine similarity, we’ll first find the dot product between the two
    vectors. We’ll then find the _L_<sub>2</sub>-norms for both the original


    <sup>7</sup> We’ll compare Euclidean and cosine metrics in more detail in **Core
    Inductive**.


    [1] 0.5'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'vectors. Then we divide the dot product by the product of their respective
    norms.


    ```

    ## Dot products

    dot <- .sum(magrathea * gallifrey)

    rom_dot <- sum(magrathea^2)

    gal_dot <- sum(gallifrey^2)

    # l2 norms

    l2_rom <- sqrt(rom_dot)

    l2_gal <- sqrt(gal_dot)

    # Cosine similarity

    cos_sim <- dot / (l2_rom * l2_gal)

    cos_sim

    ```


    [1] 0.5646839


    Similarities are just the inverse of distances. If we invert Euclidean distance,
    we get Euclidean similarity; if we invert cosine similarity, we get cosine distance.
    If we have **distances**, smaller numbers indicate that two vectors are closer
    in space. If we have **similarities**, larger numbers indicate vectors are closer.


    # Correlation


    Perhaps the most common method to compare two vectors is **correlation** (de Meschouia
    and Fowler 2021:13–36).⁸ Again, the cornerstone of this measure is the *dot product*.
    A correlation is the cosine of two vectors, only we first subtract the means from
    the vectors (i.e., center).⁹ Let’s use the same example vectors as before. Let’s
    walk through calculating correlation by hand.


    ```

    Magrathea <- c(3.5, 1)

    gallifrey <- c(1, 3)


    ## Center vectors

    c_rom <- Magrathea - mean(Magrathea)

    c_gal <- gallifrey - mean(gallifrey)

    ## Dot products

    dif_dot <- sum(c_rom * c_gal)

    rom_dot <- sum(c_rom^2)

    gal_dot <- sum(c_gal^2)

    ## L2 norms of centered vectors

    l2_rom <- sqrt(rom_dot)

    l2_gal <- sqrt(gal_dot)

    ## Cosine distance

    res1 <- dif_dot / (l2_rom * l2_gal)

    ```


    Now, calculate correlations with R ’s function `cor()` and see if the two results
    are identical with `all.equal()` (output in margin).


    ```

    res2 <- cor(Magrathea, gallifrey)


    all.equal(res1, res2)

    ```


    [1] TRUE


    In our example, there was a perfect negative association: when a number is low
    in one vector, it is high in the other vector, and vice versa. With correlations,
    we quantify the degree two vectors vary together and'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'the direction of this association.¹⁰ However, correlations cannot tell us *how
    much* one vector increases with every increase in another vector. For instance,
    how much do wages tend to increase with an additional year of experience? For
    this, we need another tool called regression.


    ¹⁰ This is true whether we are comparing locations in a vector space or years
    of experience with wages.


    # Regression


    **Regression** is a family of methods that summarizes the variation in our data
    (de Mesquita and Fowler 2021:74–93). We’ll discuss the bread-and-butter technique
    known as **Ordinary Least Squares** (OLS) regression (Tufte 1974:65–134). With
    OLS, we want a line through our data that “fits” with minimal errors.¹¹


    ¹¹ We often call regression and similar techniques “fitting a model.”


    Recall that the correlation between two vectors is their cosine, but first, we
    center the vectors by subtracting their means. Also, recall that cosine is the
    dot product of two vectors divided by the product of their *L2*-norms. Standard
    OLS makes a critical alteration to these steps: we only center and norm *one*
    of our vectors.


    With regression, one vector is an *outcome variable*,¹² that is, the *Y*, and
    one or more vectors are *predictor variables*,¹³ that is, *X*s. We are interested
    in the extent a change in the outcome variable is associated with a change in
    the predictor variable. With OLS, we *won’t* norm or center the *Y* (the outcome
    variable). Let’s use a fictitious survey of how many puppies people have (predictor)
    and their happiness level (outcome).


    ¹² Also called *dependent* or *response* variables.


    ¹³ Also called *independent* or *explanatory* variables.


    ```

    x_puppy <- c(0, 1, 4, 3, 2)

    y_happy <- c(1, 3, 6, 7, 5)


    c_puppy <- x_puppy - mean(x_puppy) # center our predictor(s)

    dot <- sum(y_happy * c_puppy) # dot product

    dot_pup <- sum(c_puppy^2) # dot product

    L2_pup <- sqrt(dot_pup) # L2 norm of predictor(s)


    coef1 <- dot / (L2_pup * L2_pup) # calculate OLS

    ```


    Let’s compare our step-by-step OLS with base R ’s OLS function. We must bind our
    two vectors into a dataframe to work with `lm()` .


    ```

    dfa <- data.frame(puppy = x_puppy, happy = y_happy)

    ols <- lm(happy ~ puppy, data = dfa)

    coef2 <- coef(ols)["puppy"]


    all.equal(coef1, coef2, check.attributes = FALSE)

    ```


    [1] TRUE


    Both give us the same answer: 1.4. What does this mean? Since we didn’t transform
    our outcome variable (the *Y*), the number is *in the same metric* as that outcome:
    for every one unit increase in puppies, we expect our respondents’ happiness level
    to increase by 1.4 units.¹⁴


    ¹⁴ This number is called the slope, coefficient, estimate, or beta.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'There are many extensions to this model. Multiple OLS regression, where we
    have more than one predictor (Tufte 1974:135–163), allows us to explore how happiness
    is related to both how many puppies people have and, say, how noisy their homes
    are.


    ```

    x1_noise <- c(2, 4, 2, 1, 1)

    x2_puppy <- c(0, 1, 4, 3, 2)

    y_happy <- c(1, 3, 6, 7, 5)

    ## center our predictors

    c1_noise <- x1_noise - mean(x1_noise)

    c2_puppy <- x2_puppy - mean(x2_puppy)

    ## dot products

    dot_x1 <- - sum(c1_noise^2)

    dot_x2 <- - sum(c2_puppy^2)

    dot_y1 <- sum(y_happy * c1_noise)

    dot_y2 <- - sum(y_happy * c2_puppy)

    dot_x1x2 <- - sum(c1_noise * c2_puppy)

    ## Beta 1

    betal <- ((dot_x2 * doty_x1) - (dot_x1x2 * doty_x2)) /

    ((dot_x1) * (dot_x2) - (dot_x1x2)^2)

    ## beta 2

    beta2 <- ((dot_x1 * doty_x2) - (dot_x1x2 * doty_x1)) /

    ((dot_x1) * (dot_x2) - (dot_x1x2)^2)

    betal

    beta2

    ```


    ```

    [1] -0.3529412

    [1] 1.2941176

    ```


    Let''s double-check using base R ''s own OLS estimates.


    ```

    df <- data.frame(noise = x1_noise, puppy = x2_puppy, happy = y_happy)

    ols <- lm(happy ~ noise + puppy, data = df)

    coef(ols)[c("noise", "puppy")]

    ```


    ```

    noise

    -0.3529412

    puppy

    1.2941176

    ```


    Checks out! A one-unit increase in noisiness is associated with a 0.35 decrease
    in happiness. Notice that our puppy coefficient is still positive but not the
    same as the previous “fit.” Here, for every additional puppy we expect a 1.29
    unit increase in happiness conditional on noisiness. Table 4.1 lists some of the
    common vector measures we’ve reviewed here.


    There are assumptions OLS expects and which our data do not always meet. We won’t
    go into detail, but OLS is a “linear model,” or LM. Extensions to this are called
    “generalized linear models” or GLMs. For example, one GLM we’ll encounter in this
    book is **logistic regression** which is appropriate when our outcome variable
    is categorical, like “yes” or “no.”15


    15 If the outcome is categorical but ordinal, then we would probably want what
    is called ordered logistic regression. If the outcome is categorical and consists
    of three or more unordered categories, then we’d probably want multinomial logistic
    regression.


    Like regular OLS regression, logistic regression predicts an outcome using some
    predictors. Here, we’ll assume our outcome has two values: yes or no. Logistic
    regression is especially suited for this scenario. Technically, our outcome is
    whether an observation is a 1 or a 0, but we’ll model the probability of getting
    a 1 or 0.


    With OLS regression, the outcome and predictors can (in theory) range from positive
    infinity to negative infinity. For reasons we won’t'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Table 4.1: Common Vector Measures


    | Measure | Explanation |

    |---|---|

    | Dot Product | sum of the product of two vectors or sum of the square of one
    vector |

    | L2-Norm | square root of the dot product of vector to itself |

    | Difference Vector | result of subtracting two vectors |

    | Cosine | normed dot product of two vectors |

    | Correlation | normed/centered dot product of difference vector |

    | OLS | dot product of two (or more) vectors, but one vector is *not* normed/centered
    |


    discuss, this makes the math simple. With logistic regression, we want something
    with the same bounds—but how? We first “trick” our model by taking the probability
    over one minus the probability. This is called the odds. Here our range is now
    between 0 and positive infinity—halfway there! We then take the logarithm of those
    odds, giving a range between negative infinity and positive infinity. *Then* we
    can treat it more like a bread-and-butter OLS regression.16 Whenever we’re trying
    to find the probability some observation falls into a category, logistic regression
    is a good place to start.


    ^16 The log of the odds is also called a *logit*. Logits are not very intuitive
    and we have to do a little math to convert our results *back* into probabilities.


    # COMPARING DISTRIBUTIONS


    Sometimes we just care about the numbers in our vector, and not so much the order.
    In other words, we care about the **distribution** of the numbers in our list.17
    For instance, how many people have one puppy? Two? Three? There are three things
    we’ll need to summarize a distribution: **central tendency, dispersion**, and
    the **type of distribution**.


    ^17 If the numbers in our vector sum to 1, we’ll often call this a *probability
    distribution*.


    # Central Tendency


    Recall that sometimes we’ll find a single number (i.e., scalar) that summarizes
    a vector. Measuring the *central tendency* in our list of numbers is one way of
    doing this. We already discussed the mean, which generally refers to the *arithmetic
    mean*: summing the numbers and dividing that by how many numbers there are. Two
    other common central tendencies are *median* and *mode*. The former is the middle
    value separating the lower half of our list from the upper half. The latter is
    whichever number occurs the most frequently.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Dispersion


    Another way to summarize our vector is to measure how spread out or dispersed
    our numbers are. Measures of dispersion include the **range** and the **variance**.
    The first is the difference between the smallest and biggest number. The second
    involves subtracting the mean from our vector, then squaring and summing that
    vector (that’s right, _dot product_ again) and then dividing by the number of
    observations.<sup>18</sup>


    18 We might also divide by the number of observations _minus one_, which is common
    when we are working with samples as opposed to a full population.


    19 Elmo and Kermit are precisely 24 inches while Big Bird is at 98 inches!


    Finally, the **standard deviation** is the square root of the variance. The standard
    deviation has the benefit of being interpreted in the metric units of the variable:
    for example, if we measured a sample of Muppets on _Sesame Street_ and find a
    mean of 24 inches and a standard deviation of 9 inches, then Muppet’s heights
    in this sample deviate from the mean of 24 inches by, on average, about 9 inches.<sup>19</sup>


    # Types of Distributions


    Statistics, as used in the social sciences, often begins with the assumption that
    when we measure something in the world, it will have a _normal_ (or _Gaussian_)
    distribution.<sup>20</sup> So, let’s start there.


    20 Or, that the distribution of means from repeated samples of that “something”
    will be normal when the sample sizes are sufficiently large. This is known as
    the **Central Limit Theorem**.


    Our list is normally distributed if the numbers are symmetrical above and below
    the mean. Here, we’ll simulate two vectors with normal distributions, slightly
    different means, and one with different standard deviations. These distributions
    are shown in Figure 4.2.


    Figure 4.2: Normal (Gaussian) Distributions.


    ![](img/ccc0ce559da97114ef913045f55e3801_47_0.png)


    21 We’ll encounter plenty of non-normal distributions in this book.


    There are also many non-normal distributions—too many to elaborate here. We should
    not assume our data follow a normal distribution.<sup>21</sup> When comparing
    the two vectors, it is not enough to determine if their central tendencies differ,
    but also their overall dispersions and the form of their distributions.'
  merge: -1
  img_proc: true
- pgno: 48
  md: "# OUR DEAR FRIEND, THE MATRIX\n\nWe'll end this primer with the **matrix**,22\
    \ which is a collection of vectors stacked on top of each other or side by side.\
    \ What's handy about a matrix is that we can work on several vectors simultaneously.\n\
    \nFirst, let's create an example matrix by building vectors and then “binding”\
    \ them as rows.\n\n```\nvec1 <- c(1, 2, 4, 2)\nvec2 <- c(3, 3, 3, 1)\nvec3 <-\
    \ c(4, 4, 4, 1)\nmat <- rbind(vec1, vec2, vec3)\nmat\n```\n\n```\n       [,1]\
    \ [,2] [,3] [,4]\nvec1    1    2    4    2\nvec2    3    3    3    1\nvec3   \
    \ 4    4    4    1\n```\n\nWe'll often need to **transpose** a matrix, which tips-and-flips\
    \ it, so the rows become the columns and vice versa:\n\n```\nt(mat)\n```\n\n```\n\
    \      vec1 vec2 vec3\n[1,]    1    3    4\n[2,]    2    3    4\n[3,]    4   \
    \ 3    4\n[4,]    2    1    1\n```\n\nA matrix is a mathematical object like any\
    \ other, which means we can also do arithmetic with them, but again we’ll need\
    \ to work with _all the numbers_ and keep track of their positions in our matrix.\
    \ Let’s create two small matrices and add them.\n\n```\nmat1 <- matrix(c(1:4),\
    \ ncol = 2)\nmat2 <- matrix(c(5:8), ncol = 2)\nmat1 + mat2\n```\n\n```\n     \
    \ [,1] [,2]        [,1] [,2]        [,1] [,2]\n[1,]    1    3   +   [1,]    5\
    \    7   =   [1,]    6   10\n[2,]    2    4       [2,]    6    8       [2,]  \
    \  8   12\n```\n\nWe added the numbers in the corresponding row-column position\
    \ (i.e., cell) in each matrix. What happens if we add a scalar to our matrix?\
    \ Every cell increases by the amount of that single number.\n\nThis gets more\
    \ complicated when the matrices are not the same shape. We cannot add or subtract\
    \ them, but we can multiply matrices of differing shapes. **Matrix multiplication**\
    \ is a little different than regular multiplication, and instead of using * in\
    \ R , it requires a particular\n\n> 22 Matrix comes from Latin for womb or mother:\
    \ “I have ... defined a ‘Matrix’ as a rectangular array of terms, out of which\
    \ different systems of determinants may be engendered as from the womb of a common\
    \ parent” (Sylvester 1851:247)."
  merge: -1
  img_proc: true
- pgno: 49
  md: 'operator, %*% (output in margin). It''s central to much of what we''ll do later.


    ```

    mat1 %*% mat2

    ```


    ```

    [,1] [,2]

    [1,] 23 31

    [2,] 34 46

    ```


    Here, we find the sum of each cell-by-cell product between each row vector in
    the first matrix and each column vector in the second. In other words, we found
    the dot product of two vectors. These two vectors, though, are not the corresponding
    rows in the matrices. The first result is the dot product of the first row in
    the first matrix with the first column in the second matrix, etc. (output in margin).


    ```

    sum(mat1[1, ] * mat2[, 1])

    sum(mat1[2, ] * mat2[, 1])

    sum(mat1[1, ] * mat2[, 2])

    sum(mat1[2, ] * mat2[, 2])

    ```


    ```

    [1] 23

    [1] 34

    [1] 31

    [1] 46

    ```


    We can multiply matrices of different shapes, but their dimensions must be compatible:
    the number of rows of one matrix *must* equal the number of columns of the other
    matrix. The output is a square matrix: a matrix with the same number of rows and
    columns.


    # Matrix Projection


    A common scenario where we need matrix multiplication is when conducting **projection**
    (Breiger 1974; Everett and Borgatti 2013). Sometimes, the rows and columns of
    our matrix are the same kinds of things. A typical example is a friendship network,
    where we line the same people along the rows and columns, and if two people are
    friends, we''d place a "1" wherever their respective rows and columns intersect.
    We call this a one-mode matrix. Often our matrix rows are different kinds of things
    than our columns. Say we ask people what fruits they ate for lunch. We''d place
    a "1" at the intersection of a person''s row and a food''s column. We call this
    a two-mode matrix.


    23 More on networks in a bit.


    ```

    fruits <- c("huckleberry", "guava", "mango", "fig", "cherry")

    titania <- c(1, 0, 0, 1, 0)

    oberon <- c(0, 1, 0, 1, 1)

    puck <- c(1, 0, 1, 1, 0)

    two_mod <- rbind(titania, oberon, puck)

    colnames(two_mod) <- fruits

    two_mod

    ```


    | | huckleberry | guava | mango | fig | cherry |

    |---|---|---|---|---|---|

    | titania | 1 | 0 | 0 | 1 | 0 |

    | oberon | 0 | 1 | 0 | 1 | 0 |

    | puck | 1 | 0 | 1 | 1 | 0 |'
  merge: -1
  img_proc: true
- pgno: 50
  md: "Often we’ll convert this two-mode into a one-mode matrix, and we call this\
    \ *matrix projection*. Projection involves matrix multiplication with one extra\
    \ step: we *transpose one matrix*. Recall the dimensions of the resulting matrix\
    \ depend on which matrix is first. If the transposed matrix is first in the order\
    \ of operations, then we get a food-by-food matrix. If the transposed matrix is\
    \ second, then we get a person-by-person matrix. Let’s see this in action.\n\n\
    ```\ntwo_mod %*% t(two_mod)\n             titania oberon puck\ntitania   2   \
    \ 1   2\noberon    1    3   1\npuck      2    1   3\n```\n\n```\nt(two_mod) %*%\
    \ two_mod\n                 huckleberry guava mango fig cherry\nhuckleberry  \
    \  2    0   1   2   0\nguava          0    1   0   1   1\nmango          1   \
    \ 0   1   1   0\nfig            2    1   1   3   1\ncherry         0    1   0\
    \   1   1\n```\n\nIn the first projection, the numbers are how many fruits the\
    \ row person had in common with the column person. Titania and Puck both ate huckleberries\
    \ and figs, for example. In the second projection, the numbers are how many people\
    \ the row fruit and the column fruit had in common. One person who ate a fig also\
    \ ate a mango, for example. Base\n\nR provides two efficient functions 24 for\
    \ this:\n\n```\n## row-by-row matrix: two_mod %*% t(two_mod)\ntcrossprod(two_mod)\n\
    ## column-by-column matrix: t(two_mod) %*% two_mod\ncrossprod(two_mod)\n```\n\n\
    Matrices help us organize our data, but they also correspond to two other mathematical\
    \ objects: spaces and graphs. Both are intuitive ways of representing the patterns\
    \ in our data. Let’s briefly discuss how matrices are related to spaces with singular\
    \ value decomposition before discussing how they relate to graphs.\n\n# Vector\
    \ Spaces and Singular Value Decomposition\n\nWhat does it mean to “reduce” the\
    \ dimensionality of a matrix? The most common methods involve singular value decomposition,\
    \ or SVD (Martin and Porter 2012). To understand SVD, we can think about how a\
    \ matrix has a corresponding geometric interpretation. We call the columns of\
    \ our matrix *dimensions* because they define positions along the dimensions of\
    \ a vector space.\n\n> 24 A few operations are called “cross product.” Here, it\
    \ refers to the inner product of the row vectors of a matrix and the column vectors\
    \ of its transpose (Williams 2010:768)."
  merge: -1
  img_proc: true
- pgno: 51
  md: 'A linear transformation is when we change the space in some way that a straight
    line before the transformation stays a straight line after. For example, imagine
    holding a mirror to our space: any straight lines in the space are still straight
    in the reflection. What''s useful is that any stretching, compressing, flipping,
    or shearing25 of the space is a linear transformation if we first rotate the space
    correctly.


    +   25 This means turning a square into a rhombus by pushing on the top corner.


    Say we have a two-column matrix and so a two-dimensional space. We can draw a
    square in this space using the axes, origin, and a single point (Figure 4.3, left
    panel). When we apply SVD, we are converting our square into a rectangle. But,
    we''re trying to compress, stretch, flip, and rotate it such that one side of
    our rectangle is as long as possible.


    +   26 This generalizes to a space with any number of dimensions, but we lose
    the ability to visualize it.


    The lengths of the sides of our rectangle are the singular values, and the first
    singular value is the longest side.26 As the right panel in Figure 4.3 shows,
    singular values describe how much the space is “stretched” in any direction. The
    coordinates of the new point are the singular vector. Significantly, we can “recover”
    our original data by reversing those same linear transformations.


    ![](img/ccc0ce559da97114ef913045f55e3801_51_0.png)


