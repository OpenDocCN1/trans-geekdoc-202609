- pgno: 213
  md: "Let's move to our corpus of season 5 of _Star Trek: The Next Generation_.\n\
    Load the corpus and do some preprocessing.\n\n```\ndata(\"corpus_tng_season5\"\
    , package = \"text2map.corpora\")\n\ndf_st <- corpus_tng_season5 |> \n  mutate(text\
    \ = stri_trans_general(line, \"Any-Latin; Latin-ASCII\"),\n         text = replace_contraction(text),\n\
    \         text = tolower(text),\n         text = gsub(\"[[;:punct:]]+\", \" \"\
    , text),\n         text = gsub(\"\\\\s+\", \" \", text)\n  )\n```\n\nNow we can\
    \ make our TCM, which we'll convert to a sparse matrix.\n\n```\ntcm <- df_st$text\
    \ |> tokens() |>\n  fcm(context = \"window\", window = 10) |>\n  as(\"dgCMatrix\"\
    )\n```\n\nJust to speed up the process, let's only keep words with at least 30\
    \ co-\noccurrences.\n\n```\ntcm <- tcm[colSums(tcm) > 30, colSums(tcm) > 30]\n\
    ```\n\n20 Adapted from text2vec's coherence().\n\nNow we can define a function\
    \ for PPMI weighting.<sup>20</sup> Then we'll apply\nthe weighting scheme to the\
    \ TCM.\n\n```\nweight_ppmi <- function(tcm) {\n  ## fix zero self-occurrences\n\
    \  diag(tcm) <- diag(tcm) + 1\n  ## weight by PMI\n  tcm <- tcm %% diag(1 / diag(tcm))\n\
    \  tcm <- log(tcm)\n  ## positive PMI\n  tcm[tcm < 0] <- 0\n  return(Matrix(tcm,\
    \ sparse = TRUE))\n}\n```\n\n```\ntcm_ppmi <- weight_ppmi(tcm)\n```\n\nOnce we\
    \ have a PPMI-weighted TCM, we can measure the similarities\nbetween two rows\
    \ (i.e., target words) using the cosine similarity statistic\nwe discussed in\
    \ the previous chapter.\n\n```\nvec1 <- tcm_ppmi[\"captain\", , drop = FALSE]\n\
    vec2 <- tcm_ppmi[\"picard\", , drop = FALSE]\nvec3 <- tcm_ppmi[\"crusher\", ,\
    \ drop = FALSE]\n\nsim2(vec1, vec2, method = \"cosine\")\nsim2(vec1, vec3, method\
    \ = \"cosine\")\n```\n\nWe see “captain” and “picard” occurring in more similar\
    \ contexts than\n“captain” and “crusher”—which we expect given that while Picard\
    \ and\nCrusher are both characters on the show, Picard is a captain and Crusher\n\
    is not."
