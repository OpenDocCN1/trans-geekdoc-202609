    We want the topic a.k.a. “beta matrix.”39 In addition to wrangling this matrix
    into a dataframe, the probabilities have been logged, so they must be exponentiated.
    We’ll keep only the terms with top 10 probabilities per topic by using group_by()
    with slice_max().


    ```

    df_terms <- tidy(lda_sotu_sub_20, "beta")

    df_top <- df_terms |>

    ```


