    \  authors = unlist(paper_authors),\n  title = unlist(paper_title),\n  abstract\
    \ = unlist(paper_abstract),\n  tags = unlist(paper_subj),\n  paper_date = unlist(paper_date),\n\
    \  scrape_date = Sys.Date()\n)\n# look at our work\nhead(df_arxiv)\n```\n```\n\
    \nWe have 5,000 rows—one per paper.18 This is what we expected. Some variables\
    \ are not as tidy as we need. For example, each statistic paper is “tagged” with\
    \ keywords about its content. For example, “cs.AI” is Computer Science-Artificial\
    \ Intelligence.19 Let’s say we are interested in paper submissions over time for\
    \ different tags.\n\nRight now, several tags are grouped into a single column,\
    \ separated by whitespace. To count each tag separately, we need to expand those\
    \ into their own columns.\n\nWe first trim the excess whitespace in the variable\
    \ and then count how many tags are in each row by counting every one or more non-space\
    \ characters.\n\n```\n```r\ndf_arxiv <- df_arxiv |>\n  mutate(tags = str_squish(tags))\n\
    maximum <- max(str_count(df_arxiv$tags, \"\\\\S+\"))\n```\n```\n\nNow that we\
    \ know how many columns we need, we can separate each tag per paper into a column\
    \ using `separate()`.20\n\n```\n```r\ndf_arxiv <- df_arxiv |>\n  separate(tags,\
    \ paste0(\"tag_\", seq_len(maximum)),\n    extra = \"merge\", sep = \"\\\\s+\"\
