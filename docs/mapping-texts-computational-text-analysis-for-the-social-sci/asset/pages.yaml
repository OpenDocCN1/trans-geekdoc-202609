  md: "# Table 7.2: Common Non-Printing Characters\n\n| Description | Characters |\n\
    |---|---|\n| Tab | \\\\t |\n| Newline | \\\\n |\n| Carriage return | \\\\r |\n\
    | Space | \\\\s | Includes \\\\t \\\\n \\\\r |\n| Line separator | \\\\r\\\\n\
    \ |\n| Horizontal space | \\\\h |\n| Vertical tab | \\\\v |\n| Word boundary |\
