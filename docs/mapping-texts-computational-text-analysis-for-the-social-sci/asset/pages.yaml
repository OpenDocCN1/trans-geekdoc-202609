    Alternatively, text2map’s dtm_builder() also produces a DTM of class dgCMatrix
    .


    ```

    dtm_text2map <- df_europarl |> dtm_builder(text, doc_id)

    # what kind of object is it?

    class(dtm_text2map)

    is(dtm_text2map, "Matrix")

    ```


    Another popular method for creating DTMs involves creating a token-count dataframe
    using tidytext .19 After using unnest() , the dataframe is in a narrow format
    with two columns: one for the document name, one for each token in each document.
    At this point, all the tokens and the order they occur in each document are retained.
    Next, we’ll use count() to sum each time a unique token occurs in each document.
    The result is a triplet dataframe, with three columns: document, token-type, and
    token-count.20


    19 This creates a tibble , a kind of “enhanced” dataframe.


    20 This dataframe can also be “cast” into the several kinds of DTMs output by
    the pack-ages above.


    ```

    # this creates a triplet dataframe

    df_tidy <- df_europarl |>

    unnest_tokens(word, text) |>

    count(doc_id, word, sort = TRUE)

    dtm_quanteda <- df_tidy |> cast_dfm(doc_id, word, n)

    dtm_sparse <- df_tidy |> cast_sparse(doc_id, word, n)

    ```


    21 These new matrices have the same dimensions, but the packages order the columns
    (vocab) differently, some alphabetically and some by overall frequency.


    Lastly, sometimes there is the need to convert these sparse matrices to a standard
    base R dense matrix. This is usually accomplished with as.matrix() . This likely
    increases the memory required. The following are all equivalent.21


    ```

    dtm_base2 <- as.matrix(dtm_quanteda)

    dtm_base3 <- as.matrix(dtm_sparse)

    dtm_base4 <- as.matrix(dtm_text2map)

    ```


    # TOKEN DISTRIBUTIONS


    22 See Math Basics.


    Using the DTM, it is simple to get basic statistics about the terms in our corpus.
    Here, we’ll learn one of the most fundamental insights from corpus linguistics:
    words are not distributed normally.22 This has widespread implications for text
    analysis. For instance, most documents will share most of their words, even if
    they’re about very different topics. Let’s explore these distributions.'
