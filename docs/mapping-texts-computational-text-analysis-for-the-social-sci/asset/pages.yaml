  md: "```\nke_mod |>\ncompile(loss = \"categorical_crossentropy\",\n optimizer =\
    \ \"sgd\",\n metrics = \"accuracy\")\n```\n\nWe have our model architecture; now\
    \ we can “fit” or train the model. Also, instead of waiting for the model to converge\
    \ on its own, let’s just go through ten rounds for this example.\n\n```\nhistory\
    \ <- ke_mod |>\nfit(ke_dtm_trn, y_trn, epochs = 10)\n```\n\nRecall the loss function\
    \ is a continuous measure of error, while accuracy is a discrete measure. Therefore,\
    \ we can find ourselves in four situations: (1) low accuracy, but big errors on\
    \ most predictions; (2) low accuracy, but small errors on most predictions; (3)\
    \ high accuracy, but big errors on a few data; and finally (4) high accuracy and\
    \ small errors overall.\n\nNow that we’ve trained the model, let’s see how well\
    \ it predicts the labels of our test set.\n\n```\nke_mod |> evaluate(ke_dtm_tst,\
    \ y_tst, verbose = 0)\n```\n\n```\nloss accuracy\n0.480646 0.818000\n```\n\nOur\
    \ model is pretty good at predicting the test set labels. Let’s complicate our\
    \ neural network, and see if we can improve this. Let’s add a word embedding layer.\
    \ Instead of using a DTM, we are also going to use a document-sequence matrix.\
    \ To do so, we first associate each word in the vocabulary with a unique integer,\
    \ for the v most frequent words. The matrix includes the first N words. The columns\
    \ are the position of a word, while the cell is the integer associated with the\
    \ word. Let’s set n_words to the first 100 words in each document.14\n\n14 If\
    \ we don't want to truncate any documents, we’d set n_words to whatever the longest\
    \ document is.\n\n```\nn_words <- 100\nseq_trn <- df_trn |>\n seq_builder(text,\
    \ maxlen = n_words)\nseq_tst <- df_tst |>\n seq_builder(text, maxlen = n_words)\n\
    # add 1 for \"zero\"\nv_vocab <- length(attr(seq_trn, \"dic\")) + 1\n```\n\n15\
    \ This uses the SGNS word2vec algorithm. See Extended Inductive.\n\nBelow we added\
    \ a new first layer: an embedding layer.15 This creates word embeddings with 128\
    \ dimensions, and only uses co-occurrences within a 100-word limit. After we’ve\
    \ created these embeddings, the input to the next hidden layer won’t be the right\
    \ “shape.” So, we’ve added another layer that averages all the vectors in each\
    \ document,"
