  md: '38 Your results should be very close, but not identical to ours. text2vec automatically
    parallelizes. This makes setting seeds and reproducing exact results tricky—for
    example, see this comment by Selivanov: github.com/dselivanov/text2vec/issues/251


    divide other word-pairs (assuring very infrequent word-pairs get smaller weights).
    We set this to 20.38


    ```

    g_model <- GlobalVectors$new(rank = 100, x_max = 20)

    ```


    Then we pass our TCM to this model for training. We need to make a TCM for the
    Star Trek data (now using a symmetric context window of size 5).


    ```

    # Create our TCM

    words <- space_tokenizer(df$st$text)

    iterate <- itoken(words)

    vocab <- create_vocabulary(iterate)

    vocab_vec <- vocab_vectorizer(vocab)

    st_tcm <- create_tcm(iterate, vocab_vec, skip_grams_window = 5L)

    st_vectors <- g_model$fit_transform(st_tcm, n_iter = 50)

    ```


    We''ll see progress updates. The “epoch” is the number of iterations that GloVe
    takes to minimize the cost function. We set that to 50 with n_iter . The number
    labeled as “loss” is the numerical value of the cost function. The smaller that
    number, the better the predictions—that is, the word vectors should closely reproduce
    the TCM.


    GloVe produces target word (row) vectors and context word (column) vectors. These
    are roughly equivalent when the TCM is symmetric (like ours). The st_vectors are
    the target word vectors; the context word vectors are in an object called $components
    . There are benefits to combining these two vectors (Pennington et al. 2014:1538–9),
    which we''ll do.39


    39 GloVe can also create “positional vectors,” tracking the position of each word
    in the window, and later concatenated (Ibrahim et al. 2021).


    ```

    st_vectors <- st_vectors + t(g_model$components)

    ```


    We have GloVe vectors! One way to get a snapshot of the embedding space is with
    a scatterplot. Of course, this is tricky with high-dimensional spaces. We can
    reduce this to two dimensions with SVD.40 We''ll remove words from the Snowball
    2014 stoplist before passing the vectors to the svd() .


    40 There are other proposed methods for visualizing 2D or 3D reductions of embedding
    spaces, such as tSNE.


    ```

    st_2d <- st_vectors |>

    as.data.frame() |>

    mutate(name = rownames(st_vectors)) |>

    filter(!name %in% get_stoplist("snowball2014")) |>

    select(!name)

    vw_coords <- svd(st_2d)$u

    vw_coords <- vw_coords |>

    as.data.frame() |>

    select(V1, V2) |>

    mutate(name = rownames(st_2d))

    ```


    Then visualize the first two reduced dimensions, only plotting the word labels
    for those loading high on at least one of the dimensions. In Figure 11.7, we can
    see various clusters of related terms, like “bajoran,”'
