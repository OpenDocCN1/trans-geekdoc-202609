  md: "We'll quickly cover two measures, one corresponding to one of these definitions\
    \ of importance: degree centrality and betweenness centrality.34\n\n# ## Degree\
    \ Centrality\n\n**Weighted degree centrality** is the sum of the tie weights of\
    \ a particular node. For our document network, this means, for each document,\
    \ summing its dot products (excluding the dot product with itself, if we ignore\
    \ the diagonal of the matrix). The higher the value, the more similar that document\
    \ is to other documents in that corpus.\n\nThe simplest way to get this is by\
    \ summing the rows of the document- level projection with the self-references\
    \ (i.e., diagonal) zeroed.35 Let’s do that below and then find the five documents\
    \ with the highest degree centralities (Table 12.1).35\n\n```\ndoc_proj <- tcrossprod(dtm_ars)\n\
    diag(doc_proj) <- 0\ndata.frame(degree = rowSums(doc_proj)) |> \n  slice_max(degree,\
    \ n = 4, with_ties = FALSE)\n```\n\n# Table 12.1: Documents with Highest Degree\
    \ Centrality\n\n| | centrality |\n|---|---|\n| Computational Social Science and\
    \ Sociology | 854 |\n| Urban Mobility and Activity Space | 663 |\n| Tracking US\
    \ Social Change Over a Half-Century | 587 |\n| Relational Work in the Economy\
    \ | 551 |\n\n\"Computational Social Science and Sociology\" is the most central,\
    \ suggesting that this abstract has the most vocabulary overlap with the other\
    \ abstracts in the corpus.\n\n# ## Betweenness Centrality\n\nNext up is _betweenness\
    \ centrality_, which measures the extent to which a node is a bridge in a network.\
    \ Higher values indicate a node is adjacent to nodes that otherwise are not adjacent\
    \ to one another. If we think about the \"flow\" of a network, the idea is that\
    \ nodes with high betweenness monopolize that flow.\n\nIf unweighted, betweenness\
    \ centrality is the sum of ratios of shortest paths (also known as _geodesics_)\
    \ between any two documents that"
