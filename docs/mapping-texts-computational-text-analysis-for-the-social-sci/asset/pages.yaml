    # # Inference with Text Networks


    We’ve focused on documents’ attributes: the words in a document, the authors,
    when it was written, the topics it engages, etc. This glosses over questions of
    relations—for example, relations between documents or relations between terms.
    This is the purpose of text networks (Bail 2016; Stoltz and Taylor 2019b; Basov
    et al. 2020; Segev 2020). Text networks have been around for some time, with roots
    tracing at least to Carley’s pioneering work on semantic networks (Carley and
    Kaufer 1993; Carley 1997; Carley and Palmquist 1992).


    Unlike text analysis, network science is largely agnostic about data—if it can
    be conceptualized as a relational matrix, then we have a network. If a corpus
    is a document-by-document network, we can inquire into which documents bridge
    across topics, which authors are peripheral and which are central, or which authors
    exert the most influence over other authors.


    There are several excellent resources for learning network methods—specifically,
    inferential network analysis (Cranmer et al. 2020; Crane 2018; Minhas et al. 2019).
    We’ll discuss common network centrality measures and then introduce tools for
    making inferences with text networks:'
