- pgno: 203
  md: "matrices and array are the following, where _k_ is the number of topics and\
    \ _v_ is the length of the vocabulary, and _c_ is how many levels are in the content\
    \ covariate:\n\n+   1. A _k_-by-_v_ matrix of rate deviations for each term per\
    \ topic from the term’s rate in the corpus.\n+   \n+   2. A _c_-by-_v_ matrix\
    \ of rate deviations for each term per level of the covariate from the term’s\
    \ rate in the corpus.\n+   \n+   3. A _c_-by-_k_-by-_v_ array of rate deviations\
    \ of topic by covariate interactions.^7\n\nEach rate deviation is logged, so the\
    \ document’s distribution over the vocabulary is the _exponentiated_ sum of these\
    \ logged rate deviations for each term.\n\nFinally, we randomly pick a topic from\
    \ the document-specific probability distribution we drew earlier and then randomly\
    \ choose a word from that topic’s probability distribution over the vocabulary.\
    \ We repeat this process for each word in the document as if we were the author.\n\
    \nSTM uses an iterative algorithm^8 to find the best-fitting parameters. The parameters\
    \ of interest are (1) the document-topic and (2) topic-word probability distributions,^9\
    \ and also the (3) topic-prevalence coefficients and the (4) topic-content rate\
    \ deviations.\n\nNow that we’ve got the basics of the model out of the way, we\
    \ can ask: What’s the significance of prevalence and content covariates for my\
    \ topic model analysis? Let’s start with prevalence.\n\nTopic **prevalence** is\
    \ the effect of a covariate on the extent a document engages a topic. We saw,\
    \ for instance, that newer works of fiction that were also more in the gray area\
    \ between fiction and nonfiction tended to devote more words in the “late-20th-century\
    \ US political thrillers” topic. Here, however, STM incorporates those covariates\
    \ _when estimating_ topics.\n\nTo demonstrate topic prevalence, let’s use an example\
    \ from Bohr and Dunlap (2018). The researchers use STM on abstracts from environmental\
    \ sociology articles to map the main topics in the field and how the prevalence\
    \ of those topics varied over time (among other things). They used Web of Science’s\
    \ Social Science Citation Index (SSCI) to scrape English-language abstracts from\
    \ articles published between 1990 and 2014 and containing key terms relevant to\
    \ environmental sociology. The researchers retained only those journals listed\
    \ by SSCI under the “sociology” category.^10 The corpus also comes with three\
    \ covariates for each article: publication year, citations per year, and journal\
    \ ranking.^11\n\nLet’s load the data and take care of wrangling. We’ll replace\
    \ curly quotes with ASCII double-quotes, transliterate the text to “Basic Latin”\n\
    \n^7 An array is a data structure with any number of dimensions. A matrix is a\
    \ two-dimensional array. This array is three-dimensional.\n\n^8 Namely, partially\
    \ collapsed variational expectation-maximization.\n\n^9 Typically, the first matrix\
    \ is called _beta_, but stm calls the second matrix _theta_, while most others\
    \ call it _gamma_. We call it gamma.\n\n^10 Our version of the corpus contains\
    \ 817 articles, though the published article only includes 815 articles.\n\n^11\
    \ Journal ranking is the h5-index score for that journal at the time the authors\
    \ downloaded the article (Bohr and Dunlap 2018:3)."
