    encoding (see Table 7.1).


    # Table 7.1: Common “Mojibake” Encoding Errors


    | Expected | Mojibake | Unicode | Expected | Mojibake | Unicode |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | " | â€œ | U+201C | '' | â€™ | U+2019 |

    | " | â€� | U+201D | — | â€” | U+2014 |

    | , | â€~ | U+2018 | ... | â€| | U+2026 |


    The above examples offer enough reason to become familiar with encodings, understand
    the encoding of our locale, and be consistent throughout our pipeline (as best
    we can). Doing so will mitigate unintended encoding errors in our corpus, making
    it less likely that we end up analyzing gibberish.


    # THIS SECTION NEEDS:


    +   * stringi

    +   * quanteda

    +   * tidytext

    +   * tidyverse

    +   * textclean

    +   * tokenizers

    +   * gutenbergr

    +   * hunspell


    # MARKUP CHARACTERS


    When reading in a browser (like Mozilla Firefox or Apple Safari) or a word processor
    (like Microsoft Word or OpenOffice Writer), the text is “what you see is what
    you get” or WYSIWYG. We see different fonts and sizes, some words bold or italicized,
    words grouped into paragraphs or columns, etc. Behind the scenes is a range of
    characters that are not printed. Rather, the browser or word processor is interpreting
    those characters as formatting or style. These non-content characters are often
    called markup.


    6 For example, Microsoft Notepad, gedit on Linux, or the editors built into IDEs
    like RStudio or VS Code.


    Unlike word processors or browsers, plain-text editors6 do not interpret markup
    language. Rather, they operate as “what you see is what you mean” or WYSIWM. If
    we open a webpage HTML (Hypertext Markup Language) file in a plain-text editor,
    we see both content and markup characters. Aside from HTML, the most common markup
    languages include XML,7 LATEX, SGML, and Markdown. Within basic ASCII there are
    markup characters we’ll encounter regularly. These are non-printing characters
    as they define whitespace formatting around the printed characters (see Table
    7.2).


    7 The Microsoft Word “DOCX” format is a compressed archive (ZIP) of an XML file.
    We can “unzip” the DOCX and open the XML file in a plain-text editor.


    The regularity of these markup languages can be a resource for wrangling text.
    Several packages can interpret markup and either remove it or use it to convert
    text into specific data structures. For example, html_text() in rvest removes
    all HTML markup tags.'
