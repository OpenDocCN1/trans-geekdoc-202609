    , \" \", text),\n  ## spaces\n  text = gsub(\"[[ :space:]]+\", \" \", text),\n\
    \  text = trimws(text)\n)\n```\n```\n\nWhat about the more specialized issues\
    \ we raised, such as hashtags, encoding problems, misspellings, etc? We only need\
