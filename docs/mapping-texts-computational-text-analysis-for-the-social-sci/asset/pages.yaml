  md: '# Figure 6.5: Term Adjacency Network.


    ![](img/ccc0ce559da97114ef913045f55e3801_102_0.png)


    between upper and lowercase letters. Whether the trade-off is worth it always
    depends on the research question.


    There are also more practical reasons we might want to reduce the dimensionality
    of our text data: memory and time. It is increasingly straightforward to download
    immense corpora. For example, Wikipedia provides its “data dump”42 of all articles
    at a given time. This is dozens of gigabytes of data, millions of unique word
    types, and billions of tokens. Even if represented as a sparse DTM, such a corpus
    could surpass the memory capacity of even high-end personal computers. Another
    consideration relates to time. Even with fast processors, certain computations
    take a long time (days, weeks, or longer). Parallelization, where more than one
    processor or core performs computations on different pieces of the dataset, is
    one way to increase speeds. Reducing the dimensions of our dataset beforehand,
    through preprocessing, also reduces the time required to perform operations on
    our text data. Therefore, we often discard information not because it is useless
    but because we could not perform the analysis otherwise.


    42 dumps.wikimedia.org/ backup-index.html


    An overarching theme in text analysis relates to how we reduce the columns of
    our matrices (i.e., dimensions or features) without losing information relevant
    to our questions. At each point in our analysis, it is crucial to remember that
    there are no dimension reduction methods that we should always use. Which method
    is the best is always related to the questions we wish to answer: how do we intend
    to use our textual map. Regardless of these critical considerations, reduction
    will always involve a combination of deletion, extraction, replacement, and summarization.
    In the next chapter, we discuss “preprocessing” sub-document units as a valuable
    form of reduction.'
