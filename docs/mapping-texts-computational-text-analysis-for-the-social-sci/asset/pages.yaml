  md: '# Core Deductive


    TELESCOPES amplify the eye, allowing us to examine the entrails of celestial bodies
    or chart the cosmic neighborhood of the Milky Way. In the previous chapters, we
    took a microscope to our texts, altering and classifying sub-document units. In
    the following chapters, we’ll take a telescopic view, classifying documents and
    measuring meaning over our corpora.


    Deductive approaches begin with a targeted meaning. For instance, perhaps we are
    interested in “whether and when the new issue of rising economic inequality was
    covered by the media” (Nelson et al. 2021:206) or the extent “popular music addresses
    inequality” (Carbone and Mijs 2022:2). With such research aims, we begin with
    a concept in mind, here inequality, and then use tools to find this concept.


    Targeted meanings rely on classification schemes that emerge from iteratively
    (and inductively) close-reading a sample of our corpus (Nelson 2020; Small 2009).
    Schemes may draw on other metadata—for example, how a website or database classifies
    a document, or author-level variables like social identity or affiliation. We
    often build on prior work, where schemes are adopted and fine-tuned. Developing
    a classification scheme is an interpretive process that we won’t rehash here.¹
    What is important is the structure of the classification scheme.


    First, we can measure if documents either are or are not associated with a label
    discretely. We can also measure whether a document is more or less associated
    with each label gradationally. This may be probabilistic or rank order.²


    The second concerns the extent the labels cover the space of possible meanings.
    Labels are exhaustive if each document could be, in theory, placed into one category
    at a consistent level of generality.³ Labels are exclusive such that a document
    is only in a single category. This matters because we need to know how necessary
    it is to place every document into a category.


    Once we have a classification scheme, how do we assign these labels to the appropriate
    documents? In traditional qualitative content analysis, we’d systematically read
    the texts, assigning labels as we go. With'
