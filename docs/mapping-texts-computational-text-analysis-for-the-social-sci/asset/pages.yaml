    \ Network Inference\n\nThe conditional uniform graph (CUG) test is the network\
    \ analog to the one-sample z- and t-test for a mean.41 The idea is: We measure\
    \ something about our observed network, call it q.42 We then randomly draw simulated\
    \ networks. These simulated networks are the same size as the observed network\
    \ and drawn from a uniform probability distribution (i.e., where each random network\
    \ of that size is equally likely to be selected). We then calculate q for each\
    \ simulated network. Like before, we also need a significance level, say 0.05.\
    \ With that, we can find two proportions:\n\n41 For a much more detailed overview\
    \ of CUG tests and the dyadic regression we cover in the next section, see Cramer,\
    \ Desmarais, and Morgan (2020). 42 This can be anything, say, the graph-level\
    \ transitivity or mean degree centrality.\n\n+   1. The proportion of simulated\
    \ q larger than or equal to our observed q (the empirically derived right-tailed\
    \ p-value).\n+   2. The proportion of simulated q smaller than or equal to our\
    \ observed q (the empirically derived left-tailed p-value)."
