- pgno: 165
  md: 'packages), and we can also request dictionaries from researchers. And, like
    Mosier''s sentiment dictionary, many are buried in appendices, waiting to be rediscovered.


    These dictionaries fall into several groups. The simplest are the various "stoplists"
    discussed earlier.23 A second group, and closely related, are word frequency lists.
    Frequency lists were useful for teaching, and one of the earliest was Thorndike''s
    Teacher''s Word Book of 30,000 Words (Bontrager 1991; Fries 1941). With the onset
    of digitized corpora, Kucera and Francis''s (1967) list became the gold standard,
    with frequencies calculated on the Brown Corpus. More recent frequency dictionaries
    for English are based on the Common Crawl of webpages, Wikipedia data dumps, the
    Google Web Trillion Word Corpus, Google Books N-Gram Corpus, or collections of
    film and television subtitles (Brysbaert and New 2009).


    23 See Wrangling Words.


    A third group relates to Osgood''s tripartite evaluation, potency, and activity
    (i.e., valence, dominance, and arousal) which include sentiment dictionaries (the
    evaluation or valence dimensions). In addition to psychological research using
    Osgood''s semantic differential method (Warriner et al. 2013), affect control
    theory researchers in sociology continue to build and validate dictionaries in
    this tradition (Smith-Lovin 2019).


    24 See Yeomans (2021) for a comparison.


    A fourth set emerges from studies of word "concreteness"—also called "abstractness,"
    "constral," or "imagery."24 For example, "pray" is more concrete, while "religion"
    is less so. This work began with language instruction as more concrete words are,
    typically, easier to remember (De Groot and Keijzer 2000). As early work on concreteness
    focused on the visual modality, this spurred expanding word norms to all sensorimotor
    modalities (Lynott et al. 2020).


    25 These other dictionaries are often stored as easily shared and edited plain-text
    files or spreadsheets.


    A final group relates to the Linguistic Inquiry and Word Count project, or LIWC.
    This project encompasses a variety of "psychological" dictionaries building upon
    the General Inquirer (Stone et al. 1966) and MRC (Wilson 1988)—caged in proprietary
    software. So, LIWC lacks the transparency and flexibility of the dictionaries
    discussed previously.25 We mention it mainly because researchers build dictionaries
    formatted to work with LIWC''s user interface—for example, the Moral Foundations
    dictionary (Hopp et al. 2021). quanteda''s dictionary() can work with LIWC-formatted
    dictionaries.


    # Building Dictionaries with Supervised Learning


    The last dictionary construction method we''ll discuss falls under the label "supervised
    learning." This procedure requires we already know how a set of texts ought to
    be classified—this is what is meant by "supervised." We then "learn" what best
    predicts those labels. We call the output a "model," but in the examples below,
    it is a weighted dictionary like any other.


    To begin, we need a hand-labeled corpus. This is often called "ground truth" or
    "gold standard" because validity is established by human raters. For example,
    a human coder might label a review of the 1999 science-fiction film The Matrix
    as "positive" if the reviewer discusses "enjoying the movie" or they might label
    a campaign speech as addressing "refugees" if it discusses "sanctuary cities."'
