  md: 'new, presumably less profane, word. Like when “assassinate” becomes “buttbuttinate”
    (Moore 2008).


    The reasons to alter our text include: (1) fixing technical errors and (2) simplifying
    our texts. The first addresses unintended misalignments between the human-readable
    and machine-readable forms of a text. For example, when using automated transcription
    and optical character recognition, words that look or sound alike may be mixed
    up. Or, in the case of encoding errors, the text may be garbled as presented to
    the human reader. For the second, we may want to collapse two or more word forms
    into a single word. This could include removing capitalization or replacing a
    “misspelled” word with the canonical form. While correcting technical errors is
    more aptly called “cleaning,” whenever we simplify our texts, we are reducing
    the dimensionality of our corpus. This makes our corpus easier to analyze and
    share with other researchers as well as reduces the memory and processing requirements.


    # CHARACTER ENCODING


    The smallest sub-document unit is typically called a character. This includes,
    for example, Arabic numerals; letters of the Latin, Cyrillic, Arabic, and Mkhedruli
    alphabets; Chinese logographics; alphasyllabary abugidas like the Devanagari;
    featureal alphabets like Korean Hangul; syllabaries like the Japanese Kana and
    Cherokee—and more! Characters also include punctuation, mathematical symbols,
    and a range of “non-printing characters” such as the space, tab, newline, and
    return.4 Now, we’re about to get technical.


    4 The term character is a holdover from early computer programming of the 1950s
    and 1960s. Functionally, it corresponds to the linguistic concept of grapheme,
    but not precisely (Haralambous and Dürst 2018). How best to segment a given writing
    tradition is an ongoing discussion, complicated by ligatures and cursivity. Furthermore,
    many graphetic qualities of writing, for example, fonts, are not encoded at the
    character level.


    When our texts are digital, each unique character in our texts must be “encoded”—or
    associated with a unique numerical sequence (i.e., code). This allows our operating
    systems, browsers, etc., to distinguish between each character and spit out the
    correct character to a user’s screen. Perhaps the most famous character “encoding”
    is Morse code, where unique strings of short sounds and long sounds are matched
    to each letter of the English alphabet.


    As it relates to modern computing, the most well-known character encoding system
    is ASCII (American Standard Code for Information Interchange), developed in the
    1960s out of several projects attempting to standardize data processing (Mackenzie
    1980). These codes represented commonly used characters in English writing. For
    example, the space is'
