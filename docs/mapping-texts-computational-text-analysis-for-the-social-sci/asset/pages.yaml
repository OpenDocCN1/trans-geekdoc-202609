    # BALANCE, RANGE, AND REPRESENTATIVENESS


    Early quantitative linguists were quick to generate **frequency lists** (Bontrager
    1991). Without corpora, only intuition could provide evidence for how common a
    word or phrase was in a given language community. An early concern was whether
    these frequencies could be generalized to a *language* from a corpus, rather than
    the peculiarities of a given genre. To address this concern, Kučera and Francis
    at Brown University composed 500 samples of American English, totaling 1 million
    words (Table 2.1). This **Brown Corpus** was structured to *balance* contributions
    across a range of fifteen genres in an attempt to be representative of work published
