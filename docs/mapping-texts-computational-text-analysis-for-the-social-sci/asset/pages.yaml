- pgno: 162
  md: 'and “bright” with “happy.” The semantic differential method involved asking
    a respondent to place a word along several continua “definable by a pair of polar
    terms” (1952:227), for example, kind-cruel, sad-happy, fast-slow, big-small, fair-unfair,
    etc. Osgood goes further to suggest that different “ways in which meanings vary”
    may be “essentially equivalent” and thus reducible to a single, shared dimension.17


    Through a series of studies, they found that something like Mosier’s favorableness,
    alongside two other dimensions, can explain a large proportion of variation in
    these continua which they label evaluation, potency, and activity (elsewhere called
    valence, dominance, and arousal, respectively).


    Broadly, it is this discovery—diverse judgments can be “explained” by a few linear
    spectra—that provides the theoretical justification for weighted dictionaries.
    In each dictionary, a token (typically, a unigram or lemma) is rated along one
    or a few meaningful dimensions. For example, Bail and colleagues (2017) use the
    LIWC dictionaries (Tausczik and Pennebaker 2010) designed to measure psychological
    content to capture the public discussion surrounding advocacy organizations from
    Facebook comments.


    In addition to being the (probable) first weighted dictionaries (with Mosier’s
    work), sentiment dictionaries are also the most commonly used dictionary of any
    kind. Flores (2017), using a sentiment dictionary (like Mosier’s), found an increase
    in negative sentiment toward Mexican and Hispanic immigrants in a corpus of tweets
    resulting from an uptick in anti-immigrant users. Using Google’s autocomplete
    search data, Dorius and Swindle (2019) show a positive relationship between the
    sentiment of the autocomplete text associated with a country and its position
    on global development indices. The first study used the Liu and colleagues (2005)
    dictionary, while the second used the SenticNet dictionary, and dozens more such
    dictionaries exist. lexicon , for example, contains fourteen.18


    To measure the sentiment of a text, each token is matched to a term in the dictionary
    and the token is then assigned the weight of that term. Let’s work through a toy
    example. First, load the Jockers-Rinker sentiment dictionary.


    ```

    data("hash_sentiment_jockers_rinker", package = "lexicon")

    df_jr <- hash_sentiment_jockers_rinker # rename so it''s tidier

    head(df_jr)

