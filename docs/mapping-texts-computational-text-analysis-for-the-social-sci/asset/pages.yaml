  md: 'Therefore, another way to think about text wrangling and building a DTM is
    as a kind of **feature selection**, that is, isolating some attributes of texts
    among all the possible ones.³ This reinforces the notion that when we engage in
    “preprocessing,” the analysis has already started and may directly impact how
    well our classifier works. This basic affinity also allows document and image
    classification research to cross-fertilize.


    > ³ This is why **quanteda** uses **DFM** instead of **DTM**.


    # Splitting Corpora


    If our model fits our training data precisely but doesn’t work on new data, it
    is “overfitted.” Why are we concerned with overfitting? Our training documents
    are a possible manifestation of an otherwise “latent” meaning.⁴ The documents
    in our corpora are an exposed instance of this hidden range. Furthermore, each
    document is never *just* about a single meaning. When training then, our model
    may identify a pattern that accurately predicts the labels, but this pattern may
    not exist in another sample of texts.


    Say we collect tweets in July of 2021 using the word “wedding.” We’re interested
    in which discuss “celebrity” weddings. We hire a dozen raters to hand-label tweets
    as whether they are about a “celebrity wedding” or not. We fit a model to this
    corpus and find it achieves over 90% accuracy. Great! We then collect more tweets
    a few months later and use our model to predict the “celebrity wedding” category.
    But, when we manually inspect these new results, they do not seem valid. We return
    to the training data and notice most of our “celebrity wedding” tweets share a
    hashtag: #thedishulwedding. Our classifier isn’t good at identifying “celebrity
    wedding,” but rather really good at identifying the tweets discussing the wedding
    of the singer Rahul Vaidya and actress Disha Parmar on July 16, 2021.


    > ⁴ For example, there are many ways one could discuss opulence, and Veblen’s
    *Leisure Class* is but one. These unseen but theoretically plausible manifestations
    may exist outside our sample, waiting to be collected, or simply be hypothetical
    possibilities.


    We may have a training data issue, but before we collect more data, the standard
    strategy is to divide our labeled corpus into a training set and one or more “hold-out”
    or “unseen” datasets (James et al. 2021:176). Recall we often hold out about 25
    to 30% of our data.⁵


    > ⁵ Specifically, revisit building a weighted sentiment dictionary using logistic
    regression in Core Deductive.


    After hand-labeling documents, representing them as features, and splitting our
    corpus into training and test sets, we enter the meat-and-potatoes of machine
    learning: selecting how to **weight** the features to predict the associated labels.
    The output of any training algorithm—many we’ve already encountered—are (1) weights
    associated with features, and then the (2) method for representing a new input
    as these compatible “features.” By now, we’re experts on representing texts as'
