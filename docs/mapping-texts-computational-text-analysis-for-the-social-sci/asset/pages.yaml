    Finally, we can also go the opposite direction by tokenizing with *characters*\
    \ rather than full words or phrases by breaking words into phonemes/morphemes\
    \ or even single letters. Character-based n-grams are sometimes used with logographic\
    \ scripts like those used with Chinese or Korean (Lee and Ahn 1996; Nie and Ren\
    \ 1999).\n\n```\n# tokenize by each character\ntokenize_characters(df_trek$line[3])\n\
    # tokenize by clusters of 3 characters\ntokenize_character_shingles(df_trek$line[3],\n\
    \    n = 3,\n    n_min = 3\n)\n```\n\n```\n[[1]]\n[1] \"a\" \"f\" \"t\" \"s\"\
    \ \"h\" \"i\" \"e\" \"l\" \"d\" \"s\"\n[11] \"a\" \"r\" \"e\" \"g\" \"o\" \"n\"\
    \ \"e\"\n[[1]]\n[1] \"aft\" \"fts\" \"tsh\" \"shi\" \"hie\" \"iel\"\n[7] \"eld\"\
    \ \"lds\" \"dsa\" \"sar\" \"are\" \"reg\"\n[13] \"ego\" \"gon\" \"one\"\n```\n\
    \nAny computational text analysis begins with tokenizing regardless of which rules\
    \ are used to tokenize. The output of tokenizing is a list. Typically, this is\
    \ a list of lists, where the first-order list is each “document,” and the second-order\
    \ list is each token. This list of lists is often a necessary, but *intermediary*,\
    \ data structure.\n\n# Chunking\n\nAs discussed, our “documents” can be any length\
    \ of text. Often, we take documents in the form we collect them: each tweet, article,\
    \ or book is a document. The contexts of the text’s production dictate where such\
    \ documents begin and end. Sometimes, though, we’ll extract a chunk of text from\
    \ a large work. Perhaps we have an entire book, but we need"
