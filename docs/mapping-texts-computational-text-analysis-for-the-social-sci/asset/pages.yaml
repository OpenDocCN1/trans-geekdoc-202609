    \ | \"eric\" | \"kumiko\" | \"jacqueline\" |\n| [51] | \"joshua\" | \"melinda\"\
    \ | \"felix\" | \"stefan\" | \"rebecca\" |\n| [56] | \"abdoulmalik\" | \"kathleen\"\
    \ | \"erin\" | \"alyssa\" | \"liang\" |\n| [61] | \"malcolm\" | \"liz\" | \"mariana\"\
    \ | \"ethan\" | \"mary\" |\n| [66] | \"carlos\" | | | | |\n\nThere are 70 authors,\
    \ but some share first names, resulting in 66 unique names. Next, let's load a\
    \ package specifically for associating names with gender. This package also requires\
    \ downloading additional datasets. But first, important words of caution from\
    \ the package authors (Mullen 2021:2):\n\n+   1. Your analysis and the way you\
    \ report it should take into account the limitations of this method, which include\
    \ its reliance on data created by the state and its inability to see beyond the\
    \ state-imposed gender binary. At a minimum, be sure to read our article explaining\
    \ the limitations of this method, as well as the review article that is critical\
    \ of this sort of methodology, both cited below.\n\n+   2. Do not use this package\
    \ to study individuals: it is at most useful for studying populations in the aggregate."
