    The DTM is a structured and efficient method for representing the content in our
    documents and also easily comparing each document by standardized features (here,
    each unique term in the corpus).


    # Sparsity


    There are several functions dedicated to building DTMs. These functions produce
    slightly different objects than our base `R` matrix, though. This is because DTMs
    are matrices with lots of zeros or words in the vocabulary that do not appear
    in a document. Let’s calculate the “sparsity” of a matrix (i.e., the percent of
    cells that are zeros) and how many words show up only once in our corpus.


    ```

    # calculate the overall sparsity of a matrix:

    total_cells <- ncol(dtm) * nrow(dtm)

    zero_cells <- sum(dtm == 0)

    zero_cells / total_cells

    ```


    ```

    [1] 0.9985835

    ```


    ```

    # how many terms in our vocabulary occur just once?

    total_vocab <- ncol(dtm)

    total_hapax <- sum(colSums(dtm) == 1)

    total_hapax / total_vocab

    ```


    ```

    [1] 0.3944386

    ```


    Over 99% of the cells are empty! Over a third of the unique words only occur once
    in any document, that is, only one row in the column would have a non-zero value.14
    This is not unique to European Parliament sentences but it is a standard feature
    of any corpus.


    A sparse matrix is also a class of R objects designed for matrices with high sparsity.
    Instead of allocating memory for the number zero, sparse classes assume zero is
    wherever memory is not allocated. How much more memory-efficient sparse classes
    are depends on the sparsity of the matrix and the type of representation (integer,
    real number, or logical). For example, our DTM as a base `R` dense matrix is around
    1200 Mbs (1.2 Gb), but as a `Matrix` sparse matrix, it shrinks to 4.4 Mbs.15


    14 In corpus linguistics, any word that only appears once in a corpus is called
    hapax legomenon. If a type occurs just twice, it is dis legomenon.


    15 As an `R` object, these special matrices are class `dgCMatrix`, `dgTMatrix`,
    `lgCMatrix`, if built with `Matrix`, or `simple_triplet_matrix` if built with
    `slam`.'
