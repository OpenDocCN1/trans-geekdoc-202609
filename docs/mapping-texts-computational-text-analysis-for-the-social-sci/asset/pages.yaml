    # Part-of-Speech Tagging for French


    +   27 universalddependencies.org/


    tagger uses tools trained entirely on English-language corpora. udpipe offers
    a suite of tokenizing, parsing, and tagging tools that currently works with 65
    languages, trained on treebanks from the Universal Dependencies project (McDonald
    2013).27


    As an example, let’s return to the Europarl Corpus from a previous chapter, which,
    as a refresher, contains 5,000 sentences in French and the same 5,000 sentences
    in English from the European Parliament Proceedings (1996–2011).


    First, we need to download language-specific models. Many languages have several
    language models to choose from with udpipe . For French, we’ll use the treebank
    based on the UD French GSD corpus (Guillaume et al. 2019), the original corpus
    for the French Universal Dependencies project, with 400,000 tokens from newspaper
    articles, Wikipedia articles, blogs and consumer reviews. For English, we’ll use
    the treebank based on the GUM Corpus (Zeldes 2017), with Web-based texts expanded
    over the years to include 113,385 tokens.


    ```

    # download language models, this may take a couple minutes

    ud_fr <- udpipe_download_model(language = "french-gsd")

    ud_en <- udpipe_download_model(language = "english-gum")

    ud_fr <- udpipe_load_model(file = ud_fr$file_model)

    ud_en <- udpipe_load_model(file = ud_en$file_model)

    ```


    Next, use these models to annotate the lines of text. Be sure to limit the text
    by the language column. The output is large because each word in each line has
    its own POS tag.


