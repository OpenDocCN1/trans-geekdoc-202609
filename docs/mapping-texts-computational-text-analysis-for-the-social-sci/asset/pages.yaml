  md: '(1994:336). Importantly, dictionaries often must be tailored to the focal corpus.11


    11 Note the term “dumb” in Table 9.2 below (Mohr 1994:335–338). As this analysis
    used t he 1907 New York City Charity Directory, “dumb” was used (at the time)
