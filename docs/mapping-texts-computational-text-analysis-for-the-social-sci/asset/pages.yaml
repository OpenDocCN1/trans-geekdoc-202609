- pgno: 217
  md: '31 For example, the frequency of "picard" in the first episode of season 5
    of Star Trek: The Next Generation is a summary statistic independent of any "local"
    context in which any one instance of "picard" occurs in that episode.


    because it is a decomposition of a matrix of statistics for the entire corpus.31


    The second method that GloVe considers—window-sliding methods—does consider local
    context. Neural network approaches such as word2vec (which we discuss below) are
    based on this technique, where word vectors are learned from a series of word
    prediction tasks within context windows. GloVe combines both these methods by
    decomposing a matrix that itself is derived from a sliding context window. What
    is this matrix? It is the TCM we''ve been discussing!


    There are two key differences in how GloVe treats the TCM relative to what we
    did previously. First, the weighting scheme is different. With GloVe, each pairwise
    instance of a target word and context word is weighted by the inverse of the distance
    between the two words in the window sequence.


    Look back at the first line in our JFK speech excerpt example: “We choose to go
    to the moon.” Say our target word is “go” and we use a symmetric context window
    of size 3—meaning three words on either side of the word “go.” The words “We,”
    “choose,” “the,” and “moon” contribute a 1 to the cell count between “go” (as
    the target row) and that word (as the context column) in the TCM and “to” would
    contribute 2 since it occurs twice in this context window. With the GloVe weighting,
    however, this instance of the word “We” would contribute a 0.333—1/3 ≈ 0.333—to
    the cell count between “go” (in its row position) and “We” (in its column position).
    Why? Because “We” is three words removed from “go” in this window. If there is
    a later context window where “We” is right next to “go” in the word sequence—
    for example, “We go to the moon”—then that instance of “We” would contribute a
    1 to the cell count.


    Context words occurring further from the target word in the windows contribute
    less to the target-context cell in the TCM. This rewards “better” context words,
    which we assume are those words consistently appearing pretty close to the target
    word in sequence.


    Let’s create this with our JFK TCM. Let’s move over to text2vec since we’ll use
    it to train GloVe vectors later. We’ll use a context window of size 3.


    32 Adapted from the developer''s tutorial.


    In the code below,32 we first tokenize each document, and create an iterator to
    loop over the tokens. create_vocabulary() uses that iterator to identify our unique
    vocabulary and the term frequencies and document frequencies for those terms.
    We then use that output to vectorize our vocabulary (i.e., associate each term
    with an index to speed up the process).'
