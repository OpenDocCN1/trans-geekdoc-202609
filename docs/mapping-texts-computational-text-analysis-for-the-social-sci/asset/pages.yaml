    \ seq_len(4L)]\nV_mat <- eigen(ATA)$vectors\n```\n```\n\nNext, the singular values\
    \ (*D*) are the square root of the eigenvalues. Note that the eigenvalues for\
    \ both \\(AA^T\\) and \\(A^TA\\) are the same (but \\(AA^T\\) has more zeros).\\\
    (^\\text{28}\\)\n\nWe’ll round them because the zeros will often be almost zero,\
    \ and sometimes negative, for example, -0.00000000013.\n\n```\n```\nround(eigen(AAT)$values)\n\
