  md: "```\ntoy_corpus_2 <- data.frame(\n  id = 1:3,\n  docs = c(c(\"hold fast to\
    \ dreams hold fast to dreams\"),\n           c(\"for when dreams go\"),\n    \
    \       c(\"life is a barren field\"))\n)\ntoy_dtm_2 <- toy_corpus_2 |> dtm_builder(docs,\
    \ id, dense = TRUE)\n```\n\n# How do the Euclidean distances and cosine similarities\
    \ compare?\n\n```\n# Euclidean distance for the original DTM\ndist(toy_dtm, method\
    \ = \"euclidean\") |> as.matrix()\n# Euclidean distance for the new DTM\ndist(toy_dtm_2,\
    \ method = \"euclidean\") |> as.matrix()\n```\n\n```\nOriginal DTM       New DTM\n\
    1   2   3         1   2   3\n0.00000 2.44949 3  0.000000 4 4.582576\n2.44949 0.00000\
    \ 3  4.000000 0 3.000000\n3.00000 3.00000 0  4.582576 3 0.000000\n```\n\n```\n\
    # Cosine similarity for the original DTM\nsim2(toy_dtm, method = \"cosine\")\n\
    # Cosine similarity for the original DTM\nsim2(toy_dtm_2, method = \"cosine\"\
    )\n```\n\n```\nOriginal DTM       New DTM\n1     2     3      1     2     3\n\
    1.00 0.25 0        1.00 0.25 0\n0.25 1.00 0        0.25 1.00 0\n0.00 0.00 1  \
    \      0.00 0.00 1\n```\n\nThe Euclidean distances between the first document\
    \ and the other two increase. But, not for the cosine similarities, which remain\
    \ the same.\n\n5 At least, if the DTM contains only positive values, for example,\
    \ when the DTM weighting is term frequencies, relative frequencies, or tf-idf\
    \ scores.\n\nNote that cosine similarity ranges between [0,1].5 Euclidean distances\
    \ have minimum values of 0, but the maximum Euclidean distance varies: it is the\
    \ maximum possible square root of the sum of squared differences.\n\nLet’s make\
    \ the two metrics more comparable by dividing each Euclidean distance by the maximum\
    \ possible (not necessarily the maximum observed) Euclidean distance. This is\
    \ tricky when the columns are word counts with no known possible maximum. We’ll\
    \ assume the longest observed document in the corpus has the highest “possible”\
    \ word count. We then find the Euclidean distance between two simulated documents\
    \ which are this maximum length but sharing no words. Let’s create a function\
    \ that finds this.\n\n```\nget_maxeuc <- function(dtm) {\n  mx <- max(rowSums(dtm))\n\
    \  d1 <- c(mx, 0)\n  d2 <- c(0, mx)\n  re <- dist(rbind(d1, d2), method = \"euclidean\"\
    )[1]\n  return(re)\n}\n```"
