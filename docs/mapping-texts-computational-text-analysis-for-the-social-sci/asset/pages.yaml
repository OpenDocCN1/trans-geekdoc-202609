    # REPEATING, REPLICATING, AND SIMULATING THE NULL


    When sharing datasheets, data, scripts, and methodological appendices, our primary
    goal is **repetition**: Can we or anyone else repeat all the steps necessary to
    exactly re-create analyses presented in publications? This is the bare minimum
    for open science. Could different researchers start with the raw text, and follow
    our instructions such that they end with the same findings? By sharing this information
    other researchers may, for example, discover coding errors that change findings—advancing
    our collective knowledge.14


    14 Precise repetition is not always possible given dependencies and “floating-point
    errors.”


    Datasheets and scripts can also help with **replication**: Can we replicate the
    finding _using different data_? Given the many steps involved in wrangling messy
    text into neat dataframes, we must describe what was done and why it was done
    so other researchers can use those same steps on new texts. Even if our code were
    to “break,” researchers could re-implement the detailed procedure in our methodological
    appendices. We should also present detailed corpus statistics in any publication—just
    as we usually report summary statistics for our datasets in survey research.


    While there is a recent push for replication, computational methods are uniquely
    suited for _anti-replication_. By this we mean testing the limits of theories
    by simulating the circumstances that—if the theories’ tenets are valid—should
    not produce a finding. Or, approaching it from the opposite direction, what if
    we have a 1 in 10,000 finding that only holds under a random initialization with
    a specific seed? Easy: we loop through our analysis 10,000 times using different
    seeds.


    Questions on randomization-based inference are not new in statistics circles (Darlington
    and Hayes 2016; Edgington and Onghena 2007; Ernst 2004; Taylor 2020). In this
    sense, if computational methods involve iteration, then many of us have been using
    computational methods under the guise of things like Monte Carlo permutation tests
    for quite some time. What is a relatively new idea is simulating “new worlds”
    by redoing our analyses but slightly altering the steps in our computational infrastructure.
    This is similar to _computational multimodel analysis_ (Young and Holsteen 2017;
    Muñoz and Young 2018), which aims to'
