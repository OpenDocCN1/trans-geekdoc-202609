  md: 'Our outcome is whether a document is a “1” or a “0”—a “yes” or a “no”—but we
    model the *probability* of getting a “1” or “0.” Then, we typically assign labels
    discretely using a probability threshold (e.g., above and below 0.5).


    8 See Math Basics.


    Let’s begin by preparing our text. We’ll use the 2,000 articles from the ISOT
    Fake News dataset, which includes several news articles labeled real or fake news
    by reference to their sources.


    ```

    data("corpus_isot_fake_news2k", package = "text2map.corpora")

    df_isot <- corpus_isot_fake_news2k |>\n  mutate(text = tolower(text),\n         text
    = gsub("[[:punct:]]+", " ", text),\n         text = gsub("[[:digit:]]+", " ",
    text),\n         text = str_squish(text)\n  )

    ```


    We’ll also split our corpus into a training and test set.


    ```

    set.seed(19063)

    init <- initial_split(df_isot, prop = 3 / 4, strata = "rating")

    df_trn <- training(init)

    df_tst <- testing(init)

    ```


    The “features” (i.e., terms) in our DTM must be identical across all training
    and test sets: same words in the exact order. So, we’ll create a DTM for the training
    set, and remove rare words. Then, we’ll use the vocabulary from that DTM as the
    input to `vocab` when building the second DTM. This assures both matrices have
    identical features.


    ```

    dtm_trn <- df_trn |>\n  dtm_builder(text, doc_id = doc_id) |>\n  dtm_stopper(stop_docfreq
    = c(3L, Inf))\ndtm_tst <- df_tst |>\n  dtm_builder(text, doc_id = doc_id, vocab
    = colnames(dtm_trn))

    ```


    Here, we’ll use `quanteda`’s text regression functions so we can stay with the
    same terminology across training methods. To fit a logistic regression, then,
    we just use:


    ```

    lr_fit <- textmodel_lr(\n  x = as.dfm(dtm_trn),\n  y = as.factor(df_trn$rating)\n)

    ```


    9 In Core Deductive, we used generic functions to fit a logistic regression, cv.glmnet()
    and glm().


    Here, x is our features (or, in our case, the term frequencies), and y is the
    document labels to predict (in our case, whether a news article is “fake news”
    or “real news”). The function also turns our DTM from a raw count matrix into
    a relative frequency DTM, by dividing by each cell by the sum of its respective
    row.


    The output or “model” is a list of features (again, here they are terms) and the
    associated weights. We can then use our test documents by'
