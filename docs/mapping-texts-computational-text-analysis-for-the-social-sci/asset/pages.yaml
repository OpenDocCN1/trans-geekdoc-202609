    ```\n\n```\n{html_document}\n<html lang=\"en\">\n[1] <head>\\n<meta http-equiv=...\n\
    [2] <body>\\n \\n \\n <header>...\n```\n\nWe are technically building an automated\
    \ “bot.” So, we might get blocked. Let’s “create a session” so it looks a bit\
    \ more like we are using a Web browser:\n\n```\nuast <- paste0(\n  \"Mozilla/5.0\
    \ (Windows NT 6.1) AppleWebKit/537.36 \",\n  \"(KHTML, like Gecko) Chrome/41.0.2228.0\
    \ Safari/537.36\"\n)\n\nsess <- session(\"https://arxiv.org/\", httr::user_agent(uast))\n\
    ```\n\nNow use this session to “jump to” the pages we need. `HTML` content is\
    \ organized in a nested hierarchy. Each section in that hierarchy has a unique\
    \ identifier called a node or element. As we don’t need most of the `HTML`, `rvest`\
    \ provides a handy function, `html_elements()`, to grab specific content using\
    \ these identifiers. Let’s see how many unique elements are on the page:\n\n```\n\
    url |>\nsession_jump_to(x = sess) |>\nhtml_elements(\"**\") |> # asterisk matches\
    \ any string\nunique() |>\nlength()\n```\n\n```\n[1] 1766\n```\n\nThat’s a lot!\
    \ Narrow this down by getting the unique IDs or “tags” for elements containing\
    \ the content we’re interested in scraping. To find these, we could inspect the\
    \ raw `HTML` of the page,15 or we can use browser extensions like SelectorGadget\
    \ (for Google Chrome) or SelectorsHub (on Firefox).\n\n15 Use CTRL+SHIFT+I on\
    \ Google Chrome and Mozilla Firefox on a PC, and OPTION+COMMAND+U for Mac users.\n\
    \nAssuming we want the full abstracts, we first need to click the “More” button\
    \ for one of the abstracts on the page before using SelectorGadget— that way we\
    \ can get the identifier for the full abstract and not the “short” abstract. As\
    \ we see in the screenshot below (Figure 5.5, right panel), “.abstract-full” is\
