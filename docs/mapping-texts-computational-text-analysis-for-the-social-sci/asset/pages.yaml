    The previous section used dictionaries to classify documents as engaging a concept
    or composing a category in an either/or (a.k.a. binary, or Boolean) fashion. Often
    researchers also use keyword occurrences to indicate magnitude: higher counts
    mean an increase in engagement with an idea or more attention toward an entity.
    This is an example of a weighted indicator.


    For example, Mohr and colleagues (2013) used Named-Entity Recognition12 to inductively
    build a dictionary of the “actors” in a set of political texts—the US National
    Security Strategy reports. An obvious set of actors identified were various nation-states.
    Using a heat map, which associates darker shades with higher frequencies, they
