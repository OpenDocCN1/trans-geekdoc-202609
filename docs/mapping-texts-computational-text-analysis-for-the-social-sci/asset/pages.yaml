  md: "# Figure 10.5: Coherence and Exclusivity.\n\n![](img/ccc0ce559da97114ef913045f55e3801_196_0.png)\n\
    \nNow, let's `tidy()` the beta matrix, then grab the top 10 terms within each\
    \ topic, and then sort the resulting dataframe by those probabilities.\n\n```\n\
    df_terms <- tidy(lda_sotu_10, \"beta\")\n\ndf_top <- df_terms |>\n  group_by(topic)\
    \ |>\n  slice_max(n = 10, beta) |>\n  ungroup() |>\n  arrange(topic, beta) |>\n\
    \  mutate(order = row_number())\n```\n\nNow, we can create a bar chart—like with\
    \ the 20-topic solution—and only select the first 4 topics (Figure 10.6).\n\n\
    ```\ndf_top |>\n  filter(topic <= 4) |>\n  ggplot(aes(order, beta)) +\n  geom_col(show.legend\
    \ = FALSE) +\n  coord_flip() +\n  ylim(0, 0.015) +\n  labs(x = NULL, y = \"Probability\
    \ of Term in Topic\") +\n  facet_wrap(~topic, scale = \"free\", ncol = 4) +\n\
    \  theme(axis.text.x = element_blank()) +\n  scale_x_continuous(breaks = df_top$order,\
    \ labels = df_top$term)\n```\n\nThere are still some non-distinguishing terms\
    \ making it difficult to interpret the topics. Instead of removing these terms,\
    \ let's take another interpretation strategy.\n\n**Term relevance** is the sum\
    \ of two term-specific measures: probability and lift. We've already discussed\
    \ probability: each term has a probability of being allocated to each topic. Terms\
    \ with a high probability of being used in a topic help determine what that topic\
    \ is about. Lift, on the other hand, is a measure of how *distinctive* the term\
    \ is to each topic"
