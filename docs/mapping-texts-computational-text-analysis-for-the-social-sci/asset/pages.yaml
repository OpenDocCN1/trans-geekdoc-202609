    One limitation of LDA is that topics are (more or less) independent of one another.
    Assuming that the document-generation process begins with drawing document-topic
    probabilities from a Dirichlet distribution comes with the constraint that no
    high or low probabilities for one topic are predictive of high or low probabilities
    for another topic. This is a tough constraint, as it is easy to imagine that topics
    will co-occur in a document. We''ll return to this issue in the next chapter when
