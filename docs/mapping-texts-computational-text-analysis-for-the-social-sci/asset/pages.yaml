- pgno: 195
  md: "If this holds across topics for a given k, the coherence value will be smaller\
    \ and that k may not be the best.\n\n**Exclusivity**, by contrast, measures the\
    \ extent to which a topic tends to monopolize the presence of particular words\
    \ (Bischof and Airoldi 2012). A larger exclusivity score means that the topic's\
    \ most probable terms are more isolated to that topic (they have low probabilities\
    \ across the other topics).\\(^\\text{41}\\)\n\n41 Proposed measurement of exclusivity\
    \ includes the frequency-exclusivity harmonic mean (Bischof and Airoldi 2012:3)\
    \ and the FREX score (Roberts et al. 2014:1068).\n\nCoherence and exclusivity\
    \ are topic-level statistics. If we take the averages across all topics for a\
    \ particular k, we'll see which number of topics best balances internal consistency\
    \ and topic separation. Let's see what k this workflow recommends. First, we need\
    \ to estimate several topic models with different k. We'll get models ranging\
    \ from k = 4 to k = 16, going up in increments of 2. We'll also create a new function\
    \ to use with `lapply()` .\\(^\\text{42}\\)\n\n42 Note that this chunk of code\
    \ may take about 20 minutes, so feel free to reduce the upper bound on our k.\n\
    \n```\nk_topic <- seq(4, 16, by = 2)\nopts <- list(seed = 10001)\nmulti_lda <-\
    \ function(k, dtm, opts) {\n  print(k)\n  return(LDA(dtm, k, control = opts))\n\
    }\nlda_mods <- lapply(k_topic, multi_lda, dtm_sotu_sub, opts)\n```\n\nNow, we\
    \ get the diagnostic statistics for each model using functions from `topicdoc`\
    \ . We'll derive our coherence and exclusivity statistics using the top 10 terms\
    \ per topic.\n\n```\ndiag_list <- lapply(lda_mods, topic_diagnostics, dtm_sotu_sub,\
    \ 10)\nnames(diag_list) <- k_topic\ndf_diag <- bind_rows(diag_list, .id = \"K\"\
    )\n```\n\nAnd, now we get the average coherence and exclusivity per k using `group_by()`\
    \ and `summarize()` . Then, we'll plot each k's statistics to see which topic\
    \ best balances them.\n\n```\ndf_diag |>\n  group_by(K) |>\n  summarize(coherence\
    \ = mean(topic_coherence),\n    exclusivity = mean(topic_exclusivity)) |>\nggplot(aes(coherence,\
    \ exclusivity)) +\n  geom_text(aes(label = K)) +\n  labs(x = \"Coherence\", y\
    \ = \"Exclusivity\")\n```\n\nIn Figure 10.5, the best candidates are those toward\
    \ the top right. Although k = 16 has the highest exclusivity, it has a lower coherence.\
    \ So, let's go with k = 10, which has a better balance. We can use the 10-topic\
    \ solution we already estimated; we only need to extract it from the `lda_models`\
    \ list. In our case, it is the 4th element of the list.\n\n```\nlda_sotu_10 <-\
    \ lda_models[[4]]\n```"
