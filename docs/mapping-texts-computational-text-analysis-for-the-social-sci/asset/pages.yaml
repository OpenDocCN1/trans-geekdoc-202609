- pgno: 272
  md: "Each plain-text file with only code (no prose) is a **script**. There are three\
    \ primary steps for computational methods involving pattern detection, pattern\
    \ refinement, and pattern confirmation (Nelson 2020). As we argue, however, there\
    \ is never just one pattern waiting to be unearthed. Every instance of pruning,\
    \ stopping, tagging, and transforming our texts involves an analytic decision.\
    \ If we can automate the reproduction of these decisions with scripts, we should.6\
    \ The best practice is to focus our scripts around one or very few outputs—this\
    \ helps identify the sources of errors (i.e., debugging). For example, we can\
    \ have one script for wrangling our raw text into a dataframe or matrix, or one\
    \ script for creating word embeddings. The goal is to run the script from top-to-bottom\
    \ without error, reproducing a given output. We must also annotate our code so\
    \ that other researchers (and our future selves!) know what the code is doing\
    \ and why we need it.\n\n**Outputs** include figures (PNGs, PDFs, etc.), models,\
    \ or datasets processed in some way. With each output, we should know precisely\
    \ how to re-create it. We also want to maintain a version of our **data** in its\
    \ raw form—how we found or collected it originally. Not only will we be able to\
    \ fix mistakes, but this practice also forces us to keep track of _how_ we got\
    \ from the raw form to the final form. Lastly, we will need to keep track of **administrative\
    \ documents** such as IRB approval forms, consent forms, funding documents, and\
    \ labeling protocols. In the margin, see the example folders for a well-organized\
    \ project directory (Navarro 2022).\n\nEvery time we open `R` to work on a project,\
    \ the top-level folder—here, `new_project`—is our designated working directory.\
    \ This should also be self-contained: we can move `new_project` to, say, a new\
    \ hard drive and the code would still work.\n\nNote the **archive** folders. A\
    \ best practice is to **never delete** anything we’ve written—or, at least, the\
    \ bar for deleting is very high. Instead, we archive. A piece of software that\
    \ aids this is _git_.7 This is a _version control system_ that tracks changes\
    \ in project directories and changes within any plain-text files. Git is also\
    \ how repository websites like GitLab, Codeberg, and GitHub operate.8 While the\
    \ benefits of git are legion, there is a steep learning curve. A low-tech alternative\
    \ is to copy files into archive folders periodically. Again, though, we should\
    \ avoid the burden of remembering:\n\n> \"You need regular, redundant, automatic,\
    \ offsite backups of your work. Because you are lazy and prone to magical thinking,\
    \ you will not do this responsibly by yourself. This is why the most useful backup\
    \ systems are the ones that require a minimum amount of work to set up and, once\
    \ organized, back up _everything_ automatically without you having to remember\
    \ to do anything.\"\n> \n> (Healy 2018b:11–2)\n\nThis way, we’re more likely to\
    \ catch our errors, but also other people may catch our errors when they attempt\
    \ to replicate using our scripts.\n\n```\nDocuments\n|-- new_project\n    |--\
    \ admin\n    |   |-- IRB\n    |   |-- funding\n    |-- data\n    |   |-- archive\n\
    \    |-- figures\n    |-- memos\n    |-- paper\n    |-- scripts\n    |-- archive\n\
    ```\n\n> \"Everything not saved will be lost.\" — Nintendo \"Quit Screen\" Message\n\
    \nMercurial and Subversion are common alternatives.\n\nWe used git and GitLab\
    \ as our version control system for this book."
