    1.2 Gb

    4.4 Mb


    Most dedicated text analysis packages rely on matrices represented as these special
    sparse classes (and when working on large corpora, we often *need* them). To grasp
    the benefit, imagine working with hundreds of thousands or millions of documents.16
    The downside to the sparse matrix format, however, is that we lose the intuitiveness
    of a base `R` matrix, and we sometimes need to use special functions to perform
    regular matrix operations.


    16 As dense matrices, this would require 5 to 10 times more RAM than most personal
    computers have today.


    # Dedicated DTM Functions


    Previously, we used a base `R` method to create a DTM. Usually, we''ll use a dedicated
    text analysis package instead (see Table 6.1). Keep in mind: many functions create
    objects tagged as "special" classes. Underneath them, though, are the basic data
    structures we''re already familiar with: lists, dataframes, and matrices.


    # Table 6.1: Packages with DTM Functions


    | quanteda | tm | text2vec | tidytext |

    | --- | --- | --- | --- |

    | text2map | udpipe | qdap | koRpus |

    | corpustools | textmineR | gofastr | textTinyR |


    Below we outline a few packages.17 There is much overlap in the functionality
    of these packages, and when we inspect the outputs of each, we see they produce
    similar R objects.


    17 These packages tend to use similar nomenclature. To prevent clashes, we can
    be explicit by using the double colon :: between the package name and the function.


    quanteda is a popular text analysis package. To create a DTM with quanteda , we
    use dfm() . But first, we need to turn each document into a **token list** and
    we''ll use quanteda ''s tokens() to do so.18


