    \ 4\n```\n\n# DOCUMENT FEATURES\n\nWhat a *feature* refers to depends on how we\
    \ tokenize the document and how we categorize or summarize those tokens. As we\
    \ mentioned earlier, the most common document-feature matrix is a document-term\
    \ matrix (DTM). This represents documents by a vector of term counts and the positions\
