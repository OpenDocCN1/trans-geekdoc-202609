  md: "```\ndtm <- df_trek |> mutate(doc_id = rownames(df_trek)) |> dtm_builder(lemma,\
    \ doc_id) |> dtm_stoplist(stop_list = stoplist(\"snowball2014\"))\n```\n\nLook\
    \ at the first few columns of our DTM.\n\n```\ndtm[1:5, 1:7]\n```\n\n```\naft\
    \ shield buckle transfer auxiliary power go\n1 1 1 . . . . .\n2 . 1 1 1 1 1 .\n\
    3 1 1 . . . . 1\n4 . . . . . . .\n5 . . . . . . .\n```\n\nThe dictionary lookup\
    \ method has a limitation: How to deal with homonymy? Consider the word “saw.”\
    \ This word could be a past-tense verb (“I saw an airplane fly by.”), a verb indicating\
    \ “to cut” (“I had to saw the plank of wood in half.”), or a noun (“I had to buy\
    \ a saw for the project.”). Ideally, lemmatizers can distinguish between homonyms.\
    \ For this, some lemmatizers “tag” each token with its predicted part of speech.36\
    \ The lemma for the token is assigned conditional on that token’s part of speech.\n\
    \nThe TreeTagger model does this (Schmid 2013). We can also use udpipe . We’ll\
    \ talk more about udpipe in the next chapter on non-English part-of-speech tagging;\
    \ for now, though, we’ll quickly illustrate lemmatizing with parts of speech using\
    \ this package. First, we’ll download an English language model37 that allows\
    \ us to tag the parts of speech and then assign lemmas using those tags.\n\n```\n\
    eng <- udpipe_download_model(language = \"english-gum\")\nud_eng <- udpipe_load_model(eng$file_model)\n\
    ```\n\nNow let's do some tagging. We’ll first create a small corpus using the\
    \ “saw” homonym issue. We’ll then use udpipe_annotate() to tag the documents and\
    \ assign the lemmas.\n\n```\ndocs <- c(\n  \"I saw an airplane,\",\n  \"I had\
    \ to saw the wood\",\n  \"I have a saw for work\"\n)\nudpipe_annotate(x = docs,\
    \ object = ud_eng) |>\n  as.data.frame() |>\n  select(doc_id, token, lemma, upos)\n\
    ```\n\nAnd we'll get the following output (we’re printing only the document ID,\
    \ token, lemma, and part of speech tag here).\n\n```\ndoc_id token lemma upos\n\
    1 doc1 I I PRON\n2 doc1 saw see VERB\n```"
