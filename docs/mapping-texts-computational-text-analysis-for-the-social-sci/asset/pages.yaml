  md: "# # Zipf's Law and Herdan-Heaps' Law\n\nLooking at the distributions of term\
    \ frequencies, we’ll see an important property of language: words are not evenly\
    \ (or evenly normally) distributed. Rather, they follow a long tail distribution,\
    \ where a few words occur a lot, and most words occur few times or even just once.\
    \ This is **Zipf’s Law**, where the frequency of a word is inversely proportional\
    \ to its rank among word frequencies.24 In large English corpora—say several billion\
    \ tokens—the word “the” is most frequent and occurs twice as often as the second\
    \ most common word “of.” Even with our medium-sized corpus of a couple of million\
    \ tokens (with the Europarl sentences), we see roughly the same distribution—across\
    \ two different languages! We can even visualize Zipf's Law by generating a frequency-rank\
    \ plot with our DTM and see how closely the slope fits –1. Let’s do this for the\
    \ English and French sentences separately. We should expect the plots to look\
    \ virtually identical across the two languages.25\n\n24 There are several theories\
    \ (e.g., Mandelbrot 1953; Miller 1957) as to why we see this. For example, Zipf\
    \ (1949) considered the reason the “principle of least effort.”\n\n25 We add a\
    \ 1 to the frequencies before logging them to avoid taking the log of zero, which\
    \ is undefined.\n\n```\n#the first 5000 lines are French, the last 5000 are English\n\
    term_freqs_fr <- sort(colSums(dtm[1:5000,]),\n                      decreasing\
    \ = TRUE)\nfreq_rank_fr <- data.frame(\n  freq = term_freqs_fr,\n  rank = seq_along(term_freqs_fr),\n\
    \  lang = \"French\"\n)\n```\n\n```\nterm_freqs_en <- sort(colSums(dtm[5001:nrow(dtm),]),\n\
    \                      decreasing = TRUE)\nfreq_rank_en <- data.frame(\n  freq\
    \ = term_freqs_en,\n  rank = seq_along(term_freqs_en),\n  lang = \"English\"\n\
    )\n```\n\n```\nfreq_rank <- rbind(freq_rank_fr, freq_rank_en)\n```\n\n```\nfreq_rank\
    \ |>\n  ggplot(aes(x = rank, y = freq+1)) +\n  geom_point(alpha = .2) +\n  scale_x_log10()\
    \ +\n  scale_y_log10() +\n  geom_smooth(method = \"lm\", linetype = 2, se = FALSE)\
    \ +\n  labs(x = \"Rank\", y = \"Count\",\n       subtitle = \"Terms' Rank by Frequency\"\
    ) +\n  facet_wrap(~lang)\n```\n\nFigure 6.1 (top row) shows these plots. The slopes\
    \ are negative and seem close to a 45-degree angle, suggesting a slope near –1.26\n\
    \n26 If we ran OLS models (see Math Basics) on these data, we would find that\
    \ the slopes are, indeed, nearly –1 as expected.\n\nAnother feature of word distributions\
    \ to remember is the fact that total unique words in a document (or corpus) increase\
    \ as the length of that document (or corpus) increases. This is **Herdan-Heaps'\
    \ Law**."
  merge: -1
  img_proc: true
- pgno: 88
  md: "To show this, first, we'll *binarize* our DTM, which means creating a matrix\
    \ with only ones and zeros (or `TRUE` and `FALSE`), where a one indicates that\
    \ the word occurs at least once in a document.\n\n```\n```r\n# 4 ways to create\
    \ a binary matrix\nbin_dtm <- dfm_weight(adtm_quanteda, scheme = \"boolean\")\n\
    bin_dtm <- as(dtm, \"lMatrix\")\nbin_dtm <- ifelse(dtm > 0, 1, 0)\nbin_dtm <-\
    \ dtm[] > 0\n```\n```\n\nWhen we sum the rows of our binarized DTM, we’ll get\
    \ the number of types in each document. We then divide that by the total number\
    \ of tokens in each document (the document length)—this is the *type-token ratio*.\n\
    \n```\n```r\ndoc_types <- rowSums(bin_dtm) # get number of types\ndoc_lengths\
    \ <- rowSums(dtm) # get number of tokens in each document\n```\n```\n\n```\n```r\n\
    type_token <- data.frame(\n  types = doc_types,\n  tokens = doc_lengths,\n  lang\
    \ = c(rep(\"French\", 5000),\n           rep(\"English\", 5000))\n)\n```\n```\n\
    \n```\n```r\ntype_token |>\n  ggplot(aes(x = tokens, y = types)) +\n  geom_point(alpha\
    \ = .2) +\n  labs(x = \"Tokens\", y = \"Types\",\n       subtitle = \"Total Tokens\
    \ by Total Type\") +\n  facet_wrap(~lang)\n```\n```\n\nThe plots are in the bottom\
    \ two rows of Figure 6.1. There are, once again, striking similarities across\
    \ the languages—as we would expect.\n\nThese two intertwined laws—Zipf’s and Herdan-Heaps’—hold\
    \ for virtually any n-grams. They are a feature of corpora in most—possibly all—languages\
    \ (Yu et al. 2018). This is the case even in “artificial” languages like Esperanto\
    \ and Klingon (Smaha and Fellbaum 2015)! Regardless of the language we’re working\
    \ with, then, *most documents will share most of their words*.\n\n# # WEIGHTING\
    \ AND NORMING\n\n+   THIS SECTION NEEDS:\n+   * tidyverse\n+   * tidytext\n+ \
    \  * quanteda\n+   * text2map\n+   * gggpubr\n\nUp to this point, we have primarily\
    \ been working with DTMs where the cells are the raw frequency counts of unique\
    \ terms, typically called *term frequencies* or *tf* (1975:4). Information retrieval\
    \ researchers argued that “the frequency of word occurrence in an article furnishes\
    \ a useful measure of word significance” (Luhn 1958:160)."
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Figure 6.1: Visualizing Zipf''s and Herdan-Heaps'' Laws.


    ![](img/ccc0ce559da97114ef913045f55e3801_89_0.png)


    ![](img/ccc0ce559da97114ef913045f55e3801_89_1.png)


    However, there is an established relationship between raw counts of types, on
    one hand, and the total number of tokens in a collection, on the other. The more
    total words, the more likely we encounter a new type of word—Herdan-Heaps'' Law!
    Therefore, it is common practice to re-weight the DTM to shift the importance
    we place on different features of our DTM.


    # Relative Term Frequency


    The most common DTM weighting scheme is to norm the DTM by dividing these raw
    counts by the document lengths (i.e., the row sums of our matrix).27 This is extremely
    common and is often called relative frequency, or rf. To show how, we''ll weight
    our DTM by each document''s length. Let''s use Europarl again, but this time only
    use the English sentences.


    27 As term frequencies are necessarily vectors of positive integers, this is,
    in effect, the L1-norm (see Math Basics).'
