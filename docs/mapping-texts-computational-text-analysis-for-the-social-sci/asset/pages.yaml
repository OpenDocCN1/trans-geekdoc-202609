  md: '# # 2 Corpus Building


    > > Words don’t mean anything. People mean things with words, and you need to
    know what they are trying to do to know what their words mean.

    > > — J. L. Martin


    CARTOGRAPHY involves establishing the boundaries around the domain or terrain
    to be mapped. What is determined to be inside and outside of the mapping space
    determines not only what is to be represented but also what it means. For example,
    detailed topographical maps of the Bob Marshall Wilderness Preserve in Montana
    are indispensable to the hiker and useless to the motorist driving around it.
    This is also the case for the text analyst. Before any analysis can take place,
    we must bound text. That is, we must determine which texts we will include and
    which we will exclude, and importantly, how it is a given text is available for
    us to select at all.


    For at least four hundred years, humans have used text as data in systematic analyses
    (Krippendorff 2018:3–5). This began with theological studies, followed closely
    by analyses of newspapers. Several studies of the press emerged in the early 20th
    century, with the most optimistic suggesting that such data “would constitute
    a series of observations of the ‘social weather’ comparable in accuracy to the
    statistics of the United States Weather Bureau” (Tenney [1912] 2008:19).


