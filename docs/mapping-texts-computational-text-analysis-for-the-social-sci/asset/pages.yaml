    After tuning, the resulting embeddings are used for several downstream tasks.47


    One critique of BERT (and similar models) is that it is “overparam- eterized”:
    layers or dimensions may be redundant. As a response, new models attempt to “distill”
    BERT into a smaller base model. These include DistilBERT and tinyBERT (Sanh et
    al. 2019; Jiao et al. 2019). These are significantly smaller, have faster tuning,
    and achieve near-identical performance to BERT on various benchmarks.


    It is, perhaps, too early to know when more involved (and computationally intensive)
    token embeddings are more appropriate for social scientific analyses (c.f., Li
    et al. 2021; van Loon and Freese 2022; McLevey et al. 2022). Furthermore, these
    token embeddings are often averaged together to achieve, presumably, more context-aware
    “static” type embeddings. However, it is not obvious that token embeddings outperform
    type embeddings, especially when these type embeddings are themselves tuned or
    post-processed. The next section includes several tuning methods to “contextualize”
    otherwise “static” word-type vectors for inductive analysis.


    47 In particular for supervised classification. See Extended Deductive.


    # ## INDUCTIVE ANALYSIS WITH WORD EMBEDDINGS


    As we can see, there are many ways to train word embeddings—each with benefits
    and limitations. What can we do in our research with an embedding space? We’ll
    explore some methods here and in the next chapter.


    +   THIS SECTION NEEDS:

    +   - text2map

    +   - text2map_pretrained

    +   - text2vec

    +   - stringi

    +   - tidyverse

    +   - textclean

    +   - rtrek


    # ## Semantic Change


    Word embeddings are uniquely suited to analyze semantic change, or the extent
    of a word’s discursive context shifts from one time to another. Hamilton and colleagues
    (Hamilton et al. 2016:2), for instance, use embed- dings to find that the “word
    gay shifted from meaning ‘cheerful’ or ‘frolicsome’ to referring to homosexuality”
    over two centuries based on the relative distance between those terms.


    For this, we first need a corpus that varies across periods of time. We then subset
    the corpus by period, and train word vectors separately for each subset.48 Next,
    we “align” the vectors across the periods to position them in the same “coordinate
    system.”


    48 These are called diachronic embeddings, a common type of variable-space (as
    opposed to fixed-) embeddings (Stoltz and Taylor 2021).'
