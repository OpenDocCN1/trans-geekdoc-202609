    group_by(topic) |> slice_max(n = 10, beta) |> ungroup() |> arrange(topic, beta)
    |> mutate(order = row_number())

    ```


    Now, we''re ready to create a bar chart for each topic using `facet_wrap()` with
    `geom_col()`, but for space we''ll only show the first 4 topics. The bar plots
    are shown in Figure 10.4.


    ```

    df_top |> filter(topic <= 4) |> ggplot(aes(order, beta)) + geom_col(show.legend
    = FALSE) + coord_flip() + ylim(0, .013) + labs(x = NULL, y = "Probability of Term
    in Topic") + facet_wrap(~topic, scale = "free", ncol = 4) + theme(axis.text.x
    = element_blank()) + scale_x_continuous(breaks = df_top$order, labels = df_top$term)

    ```


    ![](img/ccc0ce559da97114ef913045f55e3801_194_0.png)


    Figure 10.4: Top Terms for 20-Topic Solution (first 4 topics).


    These look a little better. There are still terms that are prevalent across many
    topics. This makes it hard to discriminate between topics.


    Before removing more words, however, let''s see if the issue is our _k_. While
    the topics should always pass the eye test with a deep reading of the documents
    with high probabilities per topic, we can also use some diagnostic statistics
    to help us locate the right _k_. We follow Roberts and colleagues (Roberts et
    al. 2014) and recommend two complementary statistics: *semantic coherence* and
    *exclusivity*.


    **Semantic coherence** quantifies the extent high-probability terms in a topic
    occur in the same documents (Mimno et al. 2011).40 Topics with high-probability
    terms rarely co-occurring might signal a noisy topic.


    40 A smoothing number —usually, 1—is added to avoid the logarithm of zero. While
    coherence typically ranges from 0 and below, this smoothing number allows for
    positive coherence in the limiting case where co-occurrence equals occurrence.'
