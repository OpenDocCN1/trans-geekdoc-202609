  md: '# 7


    # Wrangling Words


    > My spelling is Wobbly. It''s good spelling but it Wobbles, and the letters get
    in the wrong places

    > —Winnie-the-Pooh


    METAPHORS orient us. When mapping, we aim to simplify our texts to make their
    “patterns accessible for joint exploration” (Lee and Martin 2014:1). At this stage
    in our journey, we consider what must be *deleted, extracted, replaced, and summarized*.
    These procedures typically involve decisions made *before* constructing text matrices
    or more complex analyses. As a result, it’s often called **preprocessing** or
    **cleaning**. These labels are somewhat misleading (Rawson and Muñoz 2016), though.
    They imply that our analysis has yet to begin, that researchers must always take
    these steps, or that some words are “dirt” we must sweep away. Just as deciding
    whether to include elevation, road labels, or political boundaries is part of
    mapping terrain, the techniques that tend to fall under the labels “preprocessing”
    or “cleaning” are part of the analysis—forms of simplification and distillation.
    We must scrutinize how each step relates to our research aim.


    Below we discuss **text wrangling**: systematically altering the characters of
    our text. There are two ways to do this: (1) replacing and (2) removing. In both
    cases, we use **rules** and **dictionaries**. Both rules and dictionaries rely
    on *matching strings* in our text. So, the order we process our text matters.
    This also means that we must think through possible *mismatches*.


    A useful cautionary tale is when content moderation systems unintentionally remove
    content. An online forum operator, for example, wants to stop people from using
    profanity and so they construct a dictionary of profane terms. If any words match
    this dictionary, the post is blocked. But, sometimes profane words are spelled
    like nonprofane words (i.e., homonyms) and may even occur *inside* mundane words.
    If we look for exact matches, we’ll find many false positives. This is called
    the Scunthorpe problem. Examples include Facebook banning a Belgian political
    candidate named Luc Anus or forums preventing discussion of cocker spaniels or
    Alfred Hitchcock. A variation on this, dubbed the Clbuttic Mistake, occurs when
    we replace matched words with a


    ¹ A rule is a basic operation of the form “if this, then that,” and primarily
    involves regular expressions.


    ² A dictionary is a data structure involving a collection of pairs, typically
    a **key** and a **value**. Each key is unique but can be any collection of characters.
    When we find a match for a key, the dictionary returns the associated value, which
    may be a string or a number.


    ³ In 1996, the Internet provider AOL prevented the residents of Scunthorpe (among
    other towns) from creating accounts because the town name contained a word in
    the banned list.'
