- pgno: 122
  md: 'lemmatizing uses a lemma-token dictionary lookup to find the lemma that matches
    that token.


    In the case of words such as “rolls” and “rolling,” the returned lemma and stem
    are the same: “roll.” But now consider the words “continue,” “continues,” and
    “continuing.” The stem for each of these words is “continu.” If we lemmatize these
    words using a lemma-token dictionary, then we’ll get “continue” as the lemma for
    each word. Already we see a potential benefit to lemmatizing over stemming: lemmatizing
    always returns a conventional word. For example, “universities” is lemmatized
    as “university,” “universes” becomes “universe.”


    Consider when verb tense necessitates a different word. The verb “be,” which,
    depending on tense, can form “being” (continuous tense), “was”/“were” (past tense),
    “been” (past participle), or “am”/“are”/“is” (present tense). Other than “being”
    and “been,” none stem to “be.” Lemmatization, however, only requires that these
    conjugations be “linked” (as tokens) with a common lemma. In our case, it returns
    “be” for all these conjugations.


    An advantage of lemmatizing over stemming is that it can normalize irregular verbs
    (i.e., words that don’t conjugate using standard suffix rules). Say we want to
    lemmatize “break,” “breaks,” “broke,” and “broken.” While Porter2 stemming would
    normalize “break” and “breaks” to “break,” it would not normalize “broke” and
    “broken”—which stem to “broke” and “broken,” respectively. Lemmatizing returns
    the same lemma for each word: “break.” Chances are this is what we want.


    Let’s use lemmatize_words() to lemmatize “be” and its other verb forms. This involves
    eight different words, so we’ll first dump the words into a character vector and
    then pass this function using pipes.


    ```

    ```

    data("hash_lemmas", package = "lexicon")

    c("be", "being", "was", "were", "been", "am", "are", "is") |>

    lemmatize_words(dictionary = hash_lemmas)

    ```

    ```


    As we can see, this process returns “be” as the lemma for each word. This is what
    we expected to see.


    Notice that we specified a lemma-token dictionary instead of a stemming language.
    lexicon contains many dictionaries for text analysis. The dictionary of interest
    here is called hash_lemmas . 33 textstem also provides functionality to create
    corpus-specific dictionaries derived from the Hunspell and TreeTagger (Schmid
    2013) dictionaries.


    33 This uses Michal Měchura’s English lemmatizer dictionary: github.com/michmech/lemmatization-lists'
