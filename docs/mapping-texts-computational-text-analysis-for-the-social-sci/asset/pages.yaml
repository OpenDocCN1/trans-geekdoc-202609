    \n```\ntokens <- tokens(df_europarl$text)\ndtm_quanteda <- dfm(tokens)\nquanteda_rf_dtm\
    \ <- dfm_weight(dtm_quanteda, \"prop\")\n```\n\n28 There are two drawbacks to\
    \ storing our documents in a relative frequency DTM. First, we cannot recover\
    \ the raw counts unless we retained the document lengths. Second, storing \"real\
    \ values\" consumes more memory. In `R`, integers (and logicals) consume 4 bytes,\
    \ while real values consume 8 bytes."
