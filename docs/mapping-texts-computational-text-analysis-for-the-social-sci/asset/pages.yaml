    # Concept Mover’s Distance with Pretrained Embeddings


    Recall that supervision means we’re using labels to train the classifier. They
    are not optional. A strength of dictionary methods is that they do not require
    labeling.


    Could we augment dictionary methods with pretrained models? Specifically, could
    we use word embeddings to account for the semantic similarities between terms?
    Good news everybody! We can with **Concept Mover’s Distance** (CMD) (Stoltz and
    Taylor 2019a; Taylor and Stoltz 2021). This method extends dictionary methods
    as we’ll need one or more “anchor” terms. We’ll then use pretrained word embeddings
    to augment this process by weighting each word in our documents by its cosine
    to these anchors.21


    > 21 To do this, CMD relies on Word Mover’s Distance; see Extended Inductive.


    Our anchor list defines a location in the embedding space. In the simplest scenario,
    this is a single word—say “death.” We then associate each word in our DTM with
    a location in the embedding space. Documents,'
