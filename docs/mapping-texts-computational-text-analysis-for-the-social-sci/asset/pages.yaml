  md: "This last point is important. Neural networks are not always the right tool.\
    \ Simpler procedures often outperform (or perform on par with) more advanced techniques\
    \ (Salganik 2020). It is on the researcher to justify the need for more complex\
    \ techniques. Calling it “state-of-the-art” doesn’t cut the mustard! As a general\
    \ rule, begin with simpler methods and try to end with simpler methods.\n\nNow,\
    \ let’s get acquainted with neural networks as document classifiers. We’ll be\
    \ using Python packages, so we’ll need to set our conda environment before loading\
    \ the required packages.11\n\n```\nuse_condaenv(condaenv = \"myenv\")\n```\n\n\
    Load a new corpus of food ratings and reviews from Amazon, for example, “I love\
    \ this flavor of ramen! Five stars!” This time we’ll use three outcome labels:\
    \ a score of four or higher is 0, exactly three is a 1, and two or less a 2.\n\
    \n```\ndata(\"corpus_finefoods10k\", package = \"textmap.corpora\")\ndf_food <-\
    \ corpus_finefoods10k |>\n  mutate(text = tolower(text),\n         text = gsub(\"\
    [[:punct:]]+\", \" \", text),\n         text = gsub(\"[[:digit:]]+\", \" \", text),\n\
    \         text = str_squish(text),\n         label = case_when(\n           score\
    \ >= 4 ~ 0,\n           score == 3 ~ 1,\n           score <= 2 ~ 2\n         )\n\
    )\n```\n\n```\nset.seed(19063)\ninit <- initial_split(df_food, prop = 3 / 4, strata\
    \ = \"label\")\ndf_trn <- training(init)\ndf_tst <- testing(init)\n```\n\n```\n\
    dtm_trn <- df_trn |>\n  dtm_builder(text, doc_id = review_id) |>\n  dtm_stopper(stop_docfreq\
    \ = c(3L, Inf))\ndtm_tst <- df_tst |>\n  dtm_builder(text, doc_id = review_id,\
    \ vocab = colnames(dtm_trn))\n```\n\nNeural networks work with matrices in specific\
    \ shapes. We’ll use array_reshape() and to_categorical() from keras to handle\
    \ reshaping our predictors (here, term frequencies) and outcomes (the food was\
    \ reviewed as good, neutral, or bad).\n\n```\nke_dtm_trn <- array_reshape(as.matrix(dtm_trn),\
    \ dim = dim(dtm_trn))\nke_dtm_tst <- array_reshape(as.matrix(dtm_tst), dim = dim(dtm_tst))\n\
    y_trn <- to_categorical(df_trn$label, num_classes = 3)\ny_tst <- to_categorical(df_tst$label,\
    \ num_classes = 3)\n```"
