  md: "In addition to counting explicitly gendered pronouns and titles in texts, researchers\
    \ often want to infer the gender of named individuals in texts or the authors\
    \ of texts. For this, we can treat databases, like those from the US Social Security\
    \ Administration, as dictionaries.\n\nTo see this in action, we'll use a dataset\
    \ comprising the 2020 Annual Review of Sociology, which includes 70 authors. Each\
    \ row in the dataset is one author; therefore, co-authors are associated with\
    \ the same titles, abstracts, etc. First, we'll grab only the first name of each\
    \ author. We'll use `gsub()` with a regex pattern to extract anything before the\
    \ first space, and add the first name as a new column using `mutate()`. The package\
    \ we'll use also requires lowercase names, so we'll use `tolower()` .\n\n```\n\
    data(\"corpus_annual_review\", package = \"text2map.corpora\")\ndf_ars <- corpus_annual_review\
    \ |>\n  mutate(fname = gsub(\"^(.*)\\\\s.*\", \"\\\\1\", authors),\n         fname\
    \ = tolower(fname))\nunique(df_ars$fname)\n```\n\n| [1] | \"samuel\" | \"claude\"\
    \ | \"nora\" | \"jennifer\" | \"achim\" |\n|---|---|---|---|---|---|\n| [6] |\
    \ \"tom\" | \"danielle\" | \"christopher\" | \"fabian\" | \"paula\" |\n| [11]\
    \ | \"nora\" | \"peter\" | \"michael\" | \"thomas\" | \"rachel\" |\n| [16] | \"\
    cameron\" | \"edward\" | \"raina\" | \"matthew\" | \"adam\" |\n| [21] | \"geneviève\"\
    \ | \"anna\" | \"dorothy\" | \"oliver\" | \"lauren\" |\n| [26] | \"nicole\" |\
