  md: "presence of a term. This is called the *posterior* probability. Finding this\
    \ involves Bayes theorem: the posterior is equal to the product of the probability\
    \ that the word occurs in a document assigned to the label times the probability\
    \ of the label in the corpus, divided by the probability of the word in the corpus.\n\
    \nOne problem with classic Bayes theorem is that we'd need to calculate the probability\
    \ of a term conditional upon a label *and all other terms*. As our predictor variables\
    \ are term frequencies, and we typically have tens of thousands of terms, this\
    \ is computationally unfeasible. This is where the “naïve” part comes in. We assume\
    \ that each term is independent, and this cuts the complexity considerably. What\
    \ we end up doing in the naive Bayes case, then, is finding, for each document,\
    \ the probability of a label given the words in that document, which is proportional\
    \ to the probability of the label in the corpus times the product of each word’s\
    \ probability given that it occurs in a document assigned to that label. Let’s\
    \ fit a naive Bayes classifier (output in the margin):\n\n```\nnb_fit <- textmodel_nb(\n\
    \  x = as.dfm(dtm_trn_wo),\n  y = as.factor(df_trn$rating)\n)\n```\n\n```\nnb_pred\
    \ <- predict(nb_fit, newdata = as.dfm(dtm_tst_wo))\nconfusionMatrix(nb_pred, as.factor(df_tst$rating))\n\
    ```\n\nThe methods discussed thus far can easily be generalized beyond binary\
    \ labels to predicting several labels a.k.a. multinomial classifiers.\n\n# TRAINING\
    \ WITH NEURAL NETWORKS\n\nImagine taking the output of logistic regression and\
    \ fitting *another* logistic regression on that output. The second logistic regression\
    \ is predicting the labels like usual. The first one, though, is predicting membership\
    \ in some arbitrary number of categories. This first step is applying “dimension\
    \ reduction” to our DTM. We then use this lower-dimensional matrix to predict\
    \ the labels in the next step.\n\nA **neural network**<sup>10</sup> is roughly\
    \ equivalent. However, instead of only logistic functions, we can use any number\
    \ of **activation functions**, and instead of just two steps or **layers**, we\
    \ can add as many as we want. The minimal neural network has three layers: input,\
    \ hidden, and output. The hidden layer makes this different from the classic methods\
    \ already discussed.\n\nReference Prediction fake real\nfake 5409 282\nreal 298\
    \ 5072\n\nAccuracy : 0.9476\n\n# THIS SECTION NEEDS:\n\n+   - tidyverse\n+   -\
    \ text2map\n+   - rsample\n+   - caret\n+   - keras\n+   - reticulate\n\n<sup>10</sup>\
    \ More technically, “a multi-layer setup that models the output (Y) as a concatenation\
    \ of simple nonlinear functions of the linear combinations of inputs (X)” (Molina\
    \ and Garip 2019:31). For an overview see McLevey (2021:394–410) and for a theoretical\
    \ grounding see Roberts and colleagues (Roberts et al. 2022)."
