- pgno: 178
  md: 'Starting from the right of Figure 10.1, each speech starts in its own cluster—as
    expected with agglomerative clustering. The first cluster (i.e., the first time
    two documents are grouped) consisted of Clinton’s 1998 and 2000 speeches. We know
    this because, if we “read” right to left, those are the first two speeches merging
    under one line. This clustering process continues until all speeches are in one
    cluster.


    As this illustrates, where we “cut” the dendrogram leads to different cluster
    solutions. For instance, cutting the dendrogram at 0.1 (following the x-axis)
    creates 28 clusters—one for each document. Cutting at 0.6, though, creates three
    clusters (since we would cross three horizontal lines if we sliced at x = 0.6).
    The inevitable question is: Where to cut?


    There are two broad ways to decide on k: interpretive and statistical. First,
    we can compare the cluster solution against domain knowledge and theory. For instance,
    does it make sense for Bush’s ’01 speech to be in the same cluster as Clinton’s
    ’94 and ’95 speeches? What were they talking about? Did they take place during
    similar social, political, cultural, and/or economic contexts that would account
    for semantic similarity?


    There are also many “fit statistics” to guide the decision for k: the silhouette
    width statistic, gap statistic, and gamma index, to name a few.14 We’ll focus
    on one of our favorites: the **silhouette width** statistic.


    14 NbClust provides 30 different fit statistics (Charrad et al. 2014).


    For each document at a given solution, we calculate its silhouette width by finding
    the average cosine distance between that document and the other documents in its
    cluster. Call this c_i. We then calculate the average cosine distance between
    that document and all other documents cluster by cluster. The smallest average
    distance between the document and the other clusters is c''_i. The silhouette
    width for that document is then found by subtracting c_i from c''_i and then dividing
    that difference by the larger of those two values.


    We can then find the average of all documents’ silhouette widths. Values range
    from -1 to 1, where values closer to 1 indicate excellent average cluster placement
    and values closer to -1 indicate very poor average cluster placement. If we made
    our decision for k purely on the silhouette width (which we probably wouldn’t
    want to do in practice), we would want the k with the largest average value.


    How many clusters does the (average) silhouette statistic recommend? We can determine
    this using `fviz_nbclust()`. To make this work, we first want to define a function
    that specifies that we want to perform hierarchical clustering with Ward’s method
    iteratively at different ks.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Then we pass that function to `fviz_nbclust()` , where we also indicate that
    we want “silhouette,” we want to get the average silhouette width from one cluster
    to `k.max` , and that we have a distance matrix, which we indicate with `diss`
    . We set `k.max` to 20, and must also supply the original DTM.^15


    15 Code adapted from Lopez (2017).


    ```

    ward_link <- function(diss, k) {

    hcut(diss, k, hc_method = "ward.D2")

    }

    fviz_nbclust(dtm_sotu,

    FUNcluster = ward_link,

    method = "silhouette",

    diss = cos_sotu,

    k.max = 20

    )

    ```


    Figure 10.2: Silhouette Width for Hierarchical Clustering.


    ![](img/ccc0ce559da97114ef913045f55e3801_179_0.png)


    The best statistical fit is five clusters (see Figure 10.2). If we want to group
    documents into the fewest groups but which are as spread apart as possible, five
    groups is our best choice. Let’s create that now.


    ```

    hier_sotu <- cos_sotu |>

    as.dist() |> hcut(k = 5, hc_method = "ward.D2")

    ```


    Let’s assume that, at face value, these clusters make substantive and/or theoretical
    sense. If they don’t, then maybe statistical fit is not the best option for deciding
    on the number of clusters. In fact, in most social science applications, interpretive
    validity is the best measure of cluster fit.^16


    16 Remember: text analysis is about mapping, not mining, so different cluster
    solutions can come with different interpretations! Perhaps some more relevant
    to our research questions than others.


    We can dive into mapping what these clusters *mean*. We’ve borrowed code from
    Jones (2021) and turned it into a function. First, calculate the proportion of
    the corpus’ total word count that is accounted for by each unique word (that’s
    `prop`). For each cluster (`k`), we subset the DTM to only the documents in that
    cluster. Then we calculate the proportion of *that cluster’s* total words accounted
    for by each unique word in the cluster and then subtract each word’s proportion
    in the corpus from'
