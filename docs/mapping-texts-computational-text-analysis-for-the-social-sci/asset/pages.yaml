    | 5 | . | 0.100 | 0.125 | . | 0.025 |\n\nThe relative frequency DTM is the same\
    \ dimensions, but the cells are no longer integers. Now they are *proportions*—real\
    \ numbers that cannot be greater than one or less than zero.28\n\nIf a cell has\
    \ a 1, it would mean that *all the words* in this document are the same word.\
    \ If a cell had a 0.5, this would mean half of the words in this document are\
    \ this word. And, if summing all the rows, they each will equal 1 (output in margin).\n\
    \n```\nrowSums(dtm_rf_sub)\n```\n\nBelow we walk through how to get a relative\
