  md: "# Figure 10.6: 10-Topic Solution (first 4 topics).\n\n![](img/ccc0ce559da97114ef913045f55e3801_197_0.png)\n\
    \n43 Specifically, weighting a term's topic-specific probability by some scalar\
    \ (call it λ) and weight the topic-specific lift for that same term by the one\
    \ minus that weight (1 − λ). We then add these two weighted values to get our\
    \ term's relevance score.\n\n(Sievert and Shirley 2014:65). It is the ratio of\
    \ the term's probability in a topic to the term's probability across all the documents.\n\
    \nLift can give terms that are idiosyncratic to specific documents. Luckily, term\
    \ relevance means that we do not have to think about high probability and high\
    \ lift separately from one another. With term relevance, Sievert and Shirley (Sievert\
    \ and Shirley 2014:66) provide a way to blend the two metrics.43\n\nOf course,\
    \ we should also read the documents with high probabilities on these topics to\
    \ ensure they engage the topics in ways we expect. If they do not, then we need\
    \ to adjust our interpretations. Our document-topic probability matrix is stored\
