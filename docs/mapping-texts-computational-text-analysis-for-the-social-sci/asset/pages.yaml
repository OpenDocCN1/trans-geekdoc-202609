- pgno: 225
  md: "Now we need to train the vectors. We’ll go with 300 dimensions, a co-occurrence\
    \ maximum of 10 for establishing the weighting function on the cost function,\
    \ a learning rate⁵⁰ of 0.05, and just 10 training iterations to speed things up\
    \ (this takes ~10 minutes). We’ll also dump this into a function and use `lapply()`.\
    \ We’ll put our vectors in a list object called “dia_vecs.”\n\n50 The learning\
    \ rate is a limit on how quickly we can improve during each iteration. For reasons\
    \ we won't get into, we want to limit improvement because otherwise our model\
    \ may get “stuck” in non-optimal solutions (McLevey 2021:400-4).\n\n```\nmake_vectors\
    \ <- function(tcm) {\n  g_model <- GlobalVectors$new(\n    rank = 300, x_max =\
    \ 10,\n    learning_rate = 0.05\n  )\n  vectors <- g_model$fit_transform(tcm,\
    \ n_iter = 10)\n  vectors <- vectors + t(g_model$components)\n  return(vectors)\n\
    }\n\ndia_vecs <- lapply(dia_tcm , make_vectors)\n```\n\nThere is one more step\
    \ needed to compare *across* embeddings—which we’re doing with longitudinal analysis\
    \ of semantic change. We need to *align* our matrices. More specifically, we will\
    \ align one matrix to a “reference” matrix. This ensures word vectors in different\
    \ embedding matrices are projected onto the same “coordinate system” (Hamilton\
    \ et al. 2016:4).\n\nA popular method for doing this is the Procrustes method\
    \ (Schönemann 1966). This preserves the within-matrix cosines while minimizing\
    \ between-matrix differences by rotating, flipping, etc.⁵¹\n\n51 Understanding\
    \ the math isn’t necessary, so we won’t discuss it here. But, it uses SVD (see\
    \ Math Basics).\n\nFor our analysis, our reference matrix is the The Original\
    \ Series matrix. To keep things simple, we’ll limit the vocabulary in each matrix\
    \ to the words shared across all matrices.\n\n```\nshared_words <- Reduce(\n \
    \ intersect,\n  lapply(dia_vecs, rownames)\n)\ndia_vecs <- lapply(\n  dia_vecs,\n\
    \  function(i) i[shared_words, ]\n)\n\naligned_vecs <- list()\n\nfor (i in seq_len(length(dia_vecs)))\
    \ {\n  if (i == 1) {\n    aligned_vecs[[i]] <- find_transformation(\n      dia_vecs[[i]],\n\
    \      ref = dia_vecs[[1]],\n      method = \"align\"\n    )\n  } else {\n   \
    \ aligned_vecs[[i]] <- dia_vecs[[i]]\n  }\n}\n\nnames(aligned_vecs) <- names(dia_vecs)\n\
    ```"
