  md: "We first filtered the 204,135 articles to only those mentioning “immigrant”\
    \ or “immigration” at least once (irrespective of capitalization or punctuation).56\
    \ We load data below and take care of some preprocessing.\n\n```\ndata(\"corpus_atm_immigr\"\
    , package = \"text2map.corpora\")\ndata(\"contractions\", package = \"qdapDictionaries\"\
    )\n\ndf_atm <- corpus_atm_immigr |>\n  mutate(\n    text = replace_non_ascii(text),\n\
    \    text = replace_url(text, replacement = \"\"),\n    text = replace_html(text,\
    \ replacement = \"\"),\n    text = replace_contraction(text,\n               \
    \                contraction.key = contractions,\n                           \
    \    ignore.case = TRUE),\n    text = str_replace_all(text, \"[[:punct:]]\", \"\
    \ \"),\n    text = replace_ordinal(text),\n    text = str_replace_all(text, \"\
    \\\\\\\\s+\", \" \"),\n    text = tolower(text)\n  )\n```\n\n56 There are only\
    \ 17 organizations in the random sample after filtering. This sample of articles\
    \ is in text2map.corpora .\n\nNow we can create a DTM. Since we’ll be visualizing\
    \ these, let’s remove words in the Snowball stoplist and very infrequent words.\n\
    \n```\ndtm_atm <- df_atm |>\n  dtm_builder(text, doc_id) |>\n  dtm_stopder(stop_list\
    \ = get_stoplist(\"snowball2014\"),\n              stop_docprop = c(.01, Inf))\n\
    ```\n\nThis time, we won’t create word vectors. Instead, we’ll use a pretrained\
    \ model—a set of readymade word vectors. The pretrained models we’ll use are typically\
    \ good at picking up on nuanced semantic relationships because they are trained\
    \ on enormous corpora. Using pretrained models might be ideal when researchers\
    \ are interested in prevalent “public” meanings. In contrast, locally trained\
    \ (vectors the researcher trains themselves on their own corpus) might be better\
    \ for picking up on idiosyncratic relationships—especially when the document producers\
    \ behind the documents in the corpus use argotic language (Rodriguez and Spirling\
    \ 2022).57 The articles in the ATN corpus are (more or less) from mainstream news\
    \ outlets, so this is a good candidate for relying on a pretrained model.\n\n\
    There are many well-known pretrained embedding models—for example, the Stanford\
    \ GloVe, the HistWords, and Facebook’s fastText embeddings. We’ll use the fastText\
    \ embeddings trained on the Common Crawl.58 This matrix comprises roughly 2 million\
    \ word vectors (trained on 600 billion tokens), across 300 dimensions. Let’s load\
    \ them.59 It might take a while for the model to load into the session; it is\
    \ big.\n\n```\n# download the model once\ndownload_pretrained(\"vecs_fasttext300_commoncrawl\"\
    )\n# load the model each session\n```\n\n57 Pretrained models might also be better\
    \ when the local corpus is tiny or when the researcher believes the semantic relationships\
    \ within a corpus are not overly idiosyncratic (Rodriguez and Spirling 2022:114).\n\
    \n58 We can also download the vectors directly from the fastText website: fasttext.cc/docs/en/english-vectors.html.\n\
    \n59 We only need to download them once."
