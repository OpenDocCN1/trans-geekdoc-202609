    Following Leech (2014:xix), "[W]e have to be cautious in drawing general inferences
    from the results of a corpus analysis, and alert to the influence of hidden variables
    implicit in the way we collected and sampled the data." For example, in critiquing
    a study (Bearman and Stovel 2000) of the "narrative networks" of Nazis based on
    "life stories," Biernacki (2012:29–30) argued that the study used abridged stories.
    The abridger, moreover, "was prone to deleting the musings on personal life decisions
    or self-reflection on family relations ... the very stuff [reported] as strangely
    missing [in the original study]." By relying on abridged stories, the study''s
    conclusions were, at best, incomplete.


    Computational advances do not ally these concerns; indeed, they potentially compound
    them. Researchers may be inclined toward "analysing only what is easy to find,
    and counting what is easiest to count" (Ball 1994:295). Just like the study of
    individuals or groups in a population, we must take care that we select a "site"
    that it isn''t predisposed to mislead [us] into overly confident inference" (Martin
    2017:38).6 This is more of a concern for text analysis, since the ability to collect
    a large amount of data is getting easier. Size does not guarantee a fair sample;
