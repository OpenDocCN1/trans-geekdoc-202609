  md: '2002). Both stemmers are implemented in Snowball—a programming language for
    implementing stemmers across a range of human languages (Porter 2001).


    We can use the Porter2 algorithms to stem whole documents. Consider the following
    corpus of lines from Durkheim’s (1895) The Rules of Sociological Method.


    ```

    ```

    docs <- c(

    "society is not the mere sum of individuals",

    "the system formed by their association",

    "it is from this combination that social life arises",

    "individuals give birth to a being"

    )

    ```

    ```


    We''ll use stem_strings() . This function tokenizes each string—that is, each
    document— stems each token, and then pastes the stemmed tokens together. We''ll
    set language = "english" which indicates we want to use Porter2.


    ```

    ```

    stem_strings(docs, language = "english")

    ```

    ```


    This returns the following:


    ```

    ```

    [1] "societi is not the mere sum of individu''u"

    [2] "the system form by their associ"

    [3] "it is from this combin that social life aris"

    [4] "individu give birth to a be"

    ```

    ```


    Stemming doesn''t always do what we want. Sometimes the stemming is too aggressive.
    For example, “Universities” would be stemmed as “Univ.” A different word—“Universes”—would
    also stem to “Univ.” Chances are we don''t care that both words derive from the
    Latin word for “the whole” and we do not want these words to be equivalent in
    our DTM. We can address issues such as these by turning to a different form of
    word normalization: lemmatizing.


    # Lemmatizing


    Whereas (rule-based) stemming involves affix-stripping, lemmatization is a dictionary-based
    method that maps inflected forms of a word onto its canonical form, “headword,”
    or “lemma” (Crystal 2011:273): “an abstract representation, subsuming all ...
    lexical variations which may apply.”


    Consider again “roll” and its inflected variants: “rolls,” “rolling,” and “rolled.”
    Lemmatizing takes each word as inputs and returns “roll” as the output. But the
    pathway to get there is different. Stemming returns “roll” for each inflection
    using a series of “if-then” rules—if a word ends in -ing, for instance, then drop
    that suffix. In the simplest case,'
