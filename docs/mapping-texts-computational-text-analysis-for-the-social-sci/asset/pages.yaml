  md: 'want to increase the centrality of _discriminant_ words. We could do this by
    weighting our DTM to place more emphasis on words unique to a document (i.e.,
    _tf-idf_). Or, we could remove the most common (i.e., “non-discriminant”) words
    in _all our documents_.<sup>26</sup>


    A second strategy for identifying “non-discriminant” words is grammar. The grammatical
    types likely to be candidates for removal include articles, prepositions, conjunctions,
    demonstratives, and pronouns. Sometimes researchers remove the most frequent words
    falling into one of these classes, or remove all the words within a class. Other
    times, however, these are precisely the words to retain. For example, an investigation
    (Mosteller and Wallace 1963) of who authored the anonymous _Federalist Papers_
    compared the frequency of _by_, _from_, and _to_ with writing samples by three
    potential authors, Hamilton, Madison, and Jay. Alternatively, we may only want
    to retain nouns and verbs (e.g., Mohr et al. 2013). In either case, we’d need
    to sort words into grammatical classes.<sup>27</sup>


    The final strategy is to use _pre-compiled_ stoplists (at least for English) are
    provided in text analysis packages (see Table 7.5).<sup>28</sup> The most widely
    used English stoplists are based on the information retrieval research from the
    1960s and 1970s (e.g., Van Rijsbergen 1979), and subsequent stoplists extend these
    earlier lists (Kaur and Buttar 2018). Although, in theory, early stoplists included
    only _frequent_ words, it was Fox’s “A Stop List for General Text” (1989) that
    first incorporated empirical word frequencies into generating a stoplist.<sup>29</sup>


    # Table 7.5: A Selection of Stoplists


    | List | Year | N words | Packages |

    |---|---|---|---|

    | van Rijsbergen | 1979 | 250 | text2map |

    | Fox | 1990 | 421 | text2map |

    | SMART | 1993 | 571 | stopwords , text2map |

    | ONIX | 2000 | 198 | text2map |

    | Snowball | 2001 | 127 | text2map |

    | Snowball | 2014 | 175 | stopwords , text2map |

    | NLTK | 2009 | 179 | stopwords , text2map |

    | Jockers | 2013 | 5902 | lexicon |

    | Loughran-McDonald | 2015 | 570 | lexicon |

    | Marimo | 2020 | 237 | stopwords , text2map |

    | Tiny | 2020 | 33 | text2map |


    > 26 It is also common to remove words occurring very infrequently. This will
    reduce our vocabulary considerably, and thus the computational requirements of
    our analysis. Recall, one-quarter of the vocabulary, or more, appears just once!


    > 27 See Tagging Words.


    > 28 The **Snowball stoplist** (the original 2001 or 2014 version) used in Martin
    Porter’s Snowball stemmer (1980) is the default English stoplist for most packages.
    The NLTK package and CoreNLP stoplists build on the Snowball list. The Snowball
    stoplist is, in turn, based on van Rijsbergen’s 250 word **Van stoplist**. The
    **SMART stoplist** is another common negative dictionary based on the SMART retrieval
    system (Salton 1981).


    > 29 Fox used the Brown Corpus (Kučera and Francis 1967).'
