  md: '# 5

    Acquiring Text


    > One book after another, one invention after another, one work of art after another
    all add up to an endless, formless mass...

    > —G. Simmel


    MOUNTAINS and deltas, narrow creeks and vast canyons, sprawling neighborhoods
    and cramped cities can all be mapped. And, the same place can foment a diversity
    of maps—political, topographic, cadastral. But, mapping a place begins, of course,
    with the choice of a place.


    Just as any place can be mapped, we can use any piece of text: interviews, fieldnotes,
    archival documents, webpages, books, magazines, speeches, journal articles, social
    media posts, meeting minutes, a collection of notes passed in class—any text will
    do. But, mapping a text begins, of course, with the acquisition of text. This
    considers locating texts, collecting them, and making them useable in R. We’ll
    end the chapter by considering the ethical implications of collecting these data.


    Regardless of how the document is produced, it must be in a machine-readable form
    (which is increasingly less of a hurdle). Our strategy for making it machine-readable
    depends on the text. Here, we review five methods: (1) public datasets, (2) optical
    recognition of images, (3) automated transcription of audio files, (4) application
    programming interfaces (APIs), and (5) Web scraping.


    # PUBLIC TEXT DATASETS


    The easiest way to acquire text is to use one of the numerous publicly available
    text datasets. The most accessible are provided with R packages. For example,
    both the text2map.corpora package hosted on GitLab and the quanteda.corpora package
    hosted on GitHub contain several.1


    ```

    install_github("quanteda/quanteda.corpora")

    install_gitlab("culturalcartography/text2map.corpora")

    ```


    After installing once, we can use the data() function to load a dataset from a
    specified package. Let’s load the US State of the Union Address (SOTU) corpus
    from quanteda.corpora .


    +   THIS SECTION NEEDS:

    +   - remotes

    +   - tidyverse

    +   - tidytext


    1 CRAN—the official repository for R packages—caps package sizes. Packages hosted
    on GitHub or GitLab can be much larger and thus include larger datasets.'
