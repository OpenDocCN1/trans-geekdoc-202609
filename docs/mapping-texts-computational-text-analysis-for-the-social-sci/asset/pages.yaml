    # Data Objects, Types, and Structures


    Data structures are how we organize our data. In R , these include **vectors**,
    **lists**, **matrices**, and **dataframes** (Table 3.1). Vectors and lists are
    similar because they are _flat_ (think of a grocery list, a record of cattle weights,
    or a tally of coin flips). Matrices and dataframes, on the other hand, are squares
    with rows and columns (e.g., Excel spreadsheets or gradebooks).


    # Table 3.1: Basic Data Structures


    | Structure | Different Types? | Rows and Columns? |

    |---|---|---|

    | Vector | NO | NO |

    | List | YES | NO |

    | Matrix | NO | YES |

    | Dataframe | YES | YES |


    Typically, we’ll use “dimensions” to refer to how many rows or columns dataframes
    and matrices have, or the length of vectors and lists.


    With vectors and matrices, all the elements must be the same _type_. Lists and
    dataframes, however, can be collections of different _types_ of elements. Types
    tell R what can be done with the objects—it sets expectations. There are four
    basic types, from most to least encompassing: character , numeric or double ,
    8 integer , logical (see Table 3.2). R automatically picks the type that can encompass
    all the elements in a vector. Here are some quick examples (outputs in the margin).
    We’ll “combine” elements with c() to create vectors.


    Naming in R is case sensitive, and lowercase words with underscores between them
    (i.e. snake case) is preferred. Typically, we’ll want to avoid single-character
    names because they are hard to search for and can make debugging tricky.


    If these are not closed, the R console will show a new line with a + , waiting
    for the remaining code. Typing CTRL+C or CMD+C will end the run and so we can
    fix the code.


    ```

    words <- c("space", "is", "big")

    typeof(words)

    ```


    ```

    nums <- c(1.2, 2.8, 2)

    typeof(nums)

    ```


    R calls these “double” because of “double-precision floating-point vector.”


