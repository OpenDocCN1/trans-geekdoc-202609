    # Table 9.2: Example Dictionary from Mohr (1994)


    | Value | Key | |

    |---|---|---|

    | blind/deaf | Speech is defective | Blinded |

    | | Defective sight | Deaf |

    | | Defective hearing | Deafness |

    | | Speech disorders | Deaf-mutes |

    | Blind | | Dumb |


    Using this binary indicator, Mohr then constructed a matrix of identities (rows)
    by relief activities (columns) associated with those identities where the cells
    were the absence (0) or the presence (1) of co-occurrences of these identities
    and activities (Mohr 1994:342–3).


    In practice, it is common to use automated dictionary methods to tag documents
    alongside hand-labeling (e.g., Friedman and Reeves 2020). For example, consider
    Bonikowski and Gidron’s (2016) “The Populist Style in American Politics.” The
    authors use over 2,400 public speeches from the Annenberg/Pew Archive of Presidential
    Campaign Discourse. They build a dictionary to automatically classify speeches,
    which includes a set of unigrams and up to a five-gram. After using the dictionary
    to tag a subset of speeches as populist, they manually code each—identifying false
    positives. This method allowed the authors to save significant time.


    Let’s replicate part of their analysis. Begin by loading the public campaign speeches
    from `text2map.corpora`.


    ```

    data("corpus_presidential", package = "text2map.corpora")

    df_pres <- corpus_presidential |> select(year, party, text)

    ```


    The dimensions of the dataframe are 2,475 rows and 13 columns. Let’s grab the
    variables we need: year, party, and text. Bonikowski and Gidron provide their
    final dictionary, which they break down into unigrams on up to one five-gram.
    Below, we’ll create a version of this dictionary. We’ll focus on the unigrams
    and bigrams, starting with building the unigram dictionary.


    ```

    unigrams <- c("bureaucrat", "loophole", "millionaire",

    "baron", "venal", "crooked",

    "unresponsive", "uncaring", "arrogant")

    ```


