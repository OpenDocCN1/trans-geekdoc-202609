  md: "Let’s move on to interpreting our topics. For each topic in the term-topic\
    \ matrix, we’ll sort the terms (rows) in descending order and focus on the 10\
    \ highest-loading terms. Before that, though, we confront a shortcoming of LSA:\
    \ nothing prevents negative values in the document-topic and term-topic matrices.\
    \ Do negatives indicate dissimilarity, or is it the absolute value that matters?\n\
    \nThese are not settled debates: some recommend focusing on the terms and documents\
    \ with the largest absolute loadings on the dimensions; others recommend focusing\
    \ only on those with the highest positive loadings. The question is: Is a topic\
    \ one “pole” of a dimension? Or is a topic *the dimension*, and the two poles\
    \ are the different extremes of that topic? For example, are discussions of poverty\
    \ on a spectrum from wealth to deprivation, or just deprivation? This is a case\
    \ where our research aims will guide our selection.\n\nWe’ll focus on terms with\
    \ the largest absolute values to define the topics. We’ll also use scatterplots\
    \ of the dimensions to see if the poles can help interpret the contrasts internal\
    \ to a topic. We’ll get the top 4 terms for all topics with a for-loop.\n\n```\n\
    top_names <- paste0(\"V\", seq.int(8))\nfor (i in top_names) {\n  abs(lsa_sut$tk)\
    \ |>\n  as.data.frame() |>\n  arrange(desc(get(i))) |>\n  rownames() |>\n  head(4)\
    \ |>\n  print()\n}\n```\n\n```\n[1] \"people\" \"new\" \"can\" \"america\"\n[1]\
    \ \"must\" \"jobs\" \"children\" \"ask\"\n[1] \"america\" \"people\" \"work\"\
    \ \"iraq\"\n[1] \"people\" \"now\" \"health\" \"government\"\n[1] \"thank\" \"\
    people\" \"american\" \"america\"\n[1] \"plan\" \"us\" \"must\" \"care\"\n[1]\
    \ \"must\" \"ask\" \"help\" \"challenge\"\n[1] \"government\" \"health\" \"care\"\
    \ \"new\"\n```\n\nThere are words consistent across topics—for example, “american”\
    \ and “people.”29 SOTUs are quite formalized and formulaic. Other words are not\
