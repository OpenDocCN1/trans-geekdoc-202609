  md: "then, are clouds of locations. We want to measure the *minimum cost* of moving\
    \ all the words in our documents to this single point. Cost is a function of distance\
    \ and weight: for us, cosine and relative frequency, respectively.\n\nWe’ll try\
    \ to predict the “deaths” in 37 plays from Shakespeare’s First Folio using metadata\
    \ we created about the plays. This includes the unique ID of the work hosted on\
    \ Project Gutenberg. We’ll then use gutenbergr to download each play, creating\
    \ a dataframe where each row is a line in the play. Let’s also collapse these\
    \ lines so there is one row per play.\n\n```\ndata(\"meta_shakespeare\", package\
    \ = \"text2map\")\nmy_mirror <- \"mirrors.xmission.com/gutenberg/\"\ndf_text <-\n\
    \  select(gutenberg_id) |>\n  gutenberg_download(mirror = my_mirror) |\n  group_by(gutenberg_id)\
    \ |>\n  summarize(text = paste(text, collapse = \" \")) |>\n  mutate(gutenberg_id\
    \ = as.character(gutenberg_id))\n```\n\nThese are OCRed documents, so let’s transliterate,\
    \ and take care of these pesky curly quotes, expand any contractions we can, and\
    \ then remove punctuation and numbers. Then, build a DTM.\n\n```\ndf_text <- df_text\
    \ |>\n  mutate(text = replace_non_ascii(text),\n         text = tolower(text),\n\
    \         text = replace_curly_quote(text),\n         text = replace_contraction(text),\n\
    \         text = gsub(\"[[:punct:]]+\", \" \", text),\n         text = gsub(\"\
    [[:digit:]]+\", \" \", text),\n         text = str_squish(text)\n  )\ndtm <- df_text\
    \ |>\n  dtm_builder(text, doc_id = gutenberg_id)\n```\n\nLoad the fastText embeddings.\n\
    \n```\ndata(\"vecs_fasttext300 commoncrawl\", package =\"text2map.pretrained\"\
    )\nft_wv <- vecs_fasttext300_commoncrawl # rename so it’s tidier\n```\n\nSince\
    \ “death” is similar to “life,” let’s also calculate each play’s engagement with\
