  md: "The vocabulary of the embeddings and the TCM must match. To ensure this, we'll\
    \ subset both with the intersection of their vocabularies.\n\n```\n```\nvocab\
    \ <- intersect(rownames(ft_wv), rownames(tcm_sh))\ntcm_sh <- tcm_sh[vocab, vocab]\n\
    pre_wv <- ft_wv[vocab, ]\n```\n```\n\nNext, we'll \"tag\" our pretrained embeddings\
    \ to better fit our local TCM. This is \"retrofitting\" (also \"fine-tuning\"\
    \ and \"enriching\") and there are several useful methods that incorporate information\
    \ from the TCM built on a local corpus (Dingwall and Potts 2018), information\
    \ from semantic databases like WordNet (Faruqui et al. 2014), or even the demographics\
    \ of the authors of texts (Hovy and Fornaciari 2018).23 We can incorporate this\
    \ information by retrofitting.\n\n23 For instance, perhaps reviews of George Lamming's\
    \ novels written by American authors are more likely to reference \"revolution\"\
    \ and \"colonialism\" than those by British authors (Griswold 1987).\n\nWe'll\
    \ use a \"retrofitter\" function building on the previous chapters.24 Remember\
    \ creating word embeddings using just the TCM and SVD? Let's follow similar procedures\
    \ to create cheap word vectors fitting the local corpus. We then \"align\" the\
    \ SVD embeddings with our pretrained embeddings—as we did with diachronic analysis.\
    \ Finally, recall training the GloVe embeddings, we added embeddings together—this\
    \ function does the same. Adding SVD embeddings should \"pull\" the pretrained\
    \ embeddings slightly, creating an embedding space fitting our local corpus a\
    \ bit more.25\n\n24 See Extended Inductive.\n\n25 We could also use the following\
    \ procedure to create out-of-vocabulary embeddings.\n\n```\n```\nretrofitter <-\
    \ function(x, ref) {\n  x <- find_transformation(x, method = \"norm\")\n  ref\
    \ <- find_transformation(ref, method = \"norm\")\n  ref <- rsvd(ref, k = ncol(x))$v\n\
    \  ref <- find_transformation(ref, x, method = \"align\")\n  ref <- x + ref\n\
    \  ref <- find_transformation(ref, method = \"norm\")\n  return(ref)\n}\n```\n\
    ```\n\nLet's get our retrofit word embeddings by using our Shakespeare TCM as\
    \ reference. This decreases the most extreme differences between our word embeddings\
    \ and the co-occurrences of the local corpus.26\n\n26 We could create an \"error\"\
    \ metric and iteratively retrofit our already retrofit embeddings to decrease\
    \ this error.\n\n```\n```\nret_wv <- retrofitter(pre_wv, tcm_sh)\n```\n```\n\n\
    Let's use them on a single play, Two Gentlemen of Verona—believed to be Shakespeare's\
    \ first play. We'll remove a bit of the front matter (e.g., table of contents)\
