    # SELECTING AND BUILDING DICTIONARIES


    The methods discussed here all rely on dictionaries in various ways, which are
    the pairing of a key and value: a _vocabulary_, on the one hand, and some _rule_
    about what is to be done when a word is matched to this vocabulary, on the other.
    Here, we focus a bit more on selecting and building these dictionaries.


    When we are first exploring our data, we may decide to build a dictionary by hand.
    This process begins with deciding what kind of dictionary we need—binary or weighted—and
    then selecting our vocabulary. Binary dictionaries are the least resource-intensive
    as the presence of keywords is enough to justify classifying a given piece of
    text as engaging our concept (or not). This is an _iterative_ process (e.g., DeSoueey
    and Waggoner 2022; Bonikowski and Gidron 2016).


    When building a weighted dictionary—where all or at least most) of the words in
    our corpus would receive an associated value—researchers often recruit several
    raters and take the average of their ratings. Today, researchers often use crowd-sourcing
    platforms like Amazon MTurk. The downside of this procedure is that it may be
    cost-prohibitive. Another option is to hand-modify already existing dictionaries.


    # Pre-Built Dictionaries


    Why rebuild the wheel? Pre-constructed dictionaries are a great place to start
    when exploring our corpus. We already discussed several (often included with'
