  md: 'represented in binary as “010 0000” and capital A is “100 0001.” “Latin 1”
    is another common encoding system, which extends ASCII and should cover most languages
    using a Latin script.


    At the moment, though, the best encoding follows the Unicode standard, specifically
    UTF-8. The benefit of UTF-8 is that it is the default encoding on most machines
    and locales5 and supports a much larger range of characters than does ASCII or
    Latin 1—including non-English Latin scripts.


    5 To check your system''s locale run `Sys.getlocale()` in your `R` session or
    `sessionInfo()` . We can set the locale with `Sys.setlocale()` .


    Furthermore, all ASCII and Latin 1 encodings are compatible with UTF-8. The reverse,
    however, isn’t true and can lead to some weird outputs. If, for example, a character
    cannot be converted into ASCII, this character is often replaced with its Unicode
    equivalent “U-code.”


    Let’s work with an example. The first sentence has special “curved” double quotation
    marks (called smart quotes). If we used `cat()` to print it, those quotation marks
    are replaced with U-codes, but with angle brackets <> on either side.


    ```

    ```

    my_text <- c(‘ Why do you call to my remembrance ’)

    Encoding(my_text) <- "UTF-8"

    cat(my_text)

    ```

    ```


    <U+201C>Why do you call to my remembrance<U+201D>


    What’s happening? Before `cat()` is printing, there is a conversion going on behind
    the scenes: a UTF-8 string is input, then converted into the locale encoding,
    which here happens to be ASCII. ASCII doesn’t have a way to encode curved quotation
    marks. So, a character string representing the U-codes with angle brackets (which
    do contain characters that can be represented in ASCII) takes their place. The
    string is then re-encoded into UTF-8, but the U-codes are now treated like literal
    characters.


    ```

    ```

    # let’s explicitly reproduce the example:

    iconv(my_text, from = "UTF-8", to = "ASCII", sub = "Unicode")

    ```

    ```


    Even worse is when text is decoded using an unintended character encoding protocol.
    Rather than replacing characters not represented by the encoding, it may still
    attempt to interpret the character, resulting in gibberish known as mojibake (mo-ji
    bah-keh). A commonly encountered example of mojibake is when UTF-8 is interpreted
    as Windows-1252 (a pre-Windows 10 Latin encoding system). The smart, right-side,
