    ```\n```\n\nThe output is a nested list. We’ll need to wrangle these into dataframes\
    \ by first counting each unique tag with `table()` .\n\n```\n```r\ndf_lib <- names(pos_lib[[1]])\
    \ |>\\n  table(dnn = \"pos\") |>\n  data.frame() |>\n  mutate(lean = \"Liberal\"\
    )\n\ndf_con <- names(pos_con[[1]]) |>\\n  table(dnn = \"pos\") |>\n  data.frame()\
    \ |>\n  mutate(lean = \"Conservative\")\n\ndf_pos <- rbind(df_lib, df_con)\n\n\
    df_pos <- df_pos |>\n  filter(Freq >= 2) |>\n  mutate(pos = reorder_within(pos,\
    \ by = Freq, within = lean))\n```\n```\n\nAnd now we plot (see Figure 8.4).\n\n\
    ```\n```r\ndf_pos |>\n  ggplot(aes(x = pos, y = Freq, fill = lean)) +\n  geom_col()\
    \ +\n  labs(x = \"Parts of Speech\",\n       y = \"Proportion of Total Words\"\
    ) +\n  facet_wrap(~lean, scales = \"free_y\") +\n  coord_flip() +\n  scale_x_reordered()\n\
    ```\n```\n\nOutside of linguistics, these fine-grained grammatical mappings may\
    \ not be useful—for example, the difference between a superlative and a comparative\
    \ adjective. We can simplify the tagset with two functions: `as_universal()` and\
    \ `as_basic()` . `as_universal()` transforms the tags into the “universal” tagset—that\
    \ is, more or less universal across many languages (Petrov et al. 2011). This\
    \ tagset reduces the 48 Penn Treebank tags22 to 12 tags: nouns, verbs, adjectives,\
    \ adverbs, pronouns, determiners/articles, prepositions/postpositions, numbers,\
    \ conjunctions, particles, “.” for all punctuation, and “X” for unidentified word\
    \ senses (Petrov et al. 2011:2). The `as_basic` returns an even simpler tagset,\
    \ consisting of nouns, verbs, adjectives, adverbs, prepositions,\n\n22 tagger\
    \ appears to use 46 Penn Treebank tags. penn_tags() does not include the pound\
    \ sign (#), the opening single quotation mark (‘), or the closing single quotation\
    \ mark (’). However, the pound sign is still successfully tagged using the package;\
    \ the single quotation marks are tagged with their double quotation mark counterparts\
    \ (“ and ”)."
