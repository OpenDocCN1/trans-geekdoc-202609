    \ = \"doc_id\")\n```\n\n```\ndf_europarl <- df_europarl |\n    mutate(\n     \
    \   text = tolower(text), # lowercase\n        text = gsub(\"[[:punct:]]\", \"\
    \ \", text), # remove punctuation\n        text = gsub(\"[[:digit:]]\", \" \"\
    , text), # remove numbers\n        text = gsub(\"[[:space:]]+\", \" \", text)\
    \ # remove excess space\n    )\n```\n\n<sup>12</sup> See Wrangling Words.\n\n\
    Above, we loaded our text dataset and transformed the text by lowercasing, removing\
    \ punctuation, removing numbers, and removing any double spaces.<sup>12</sup>\
    \ Now each sentence looks like one long string of lower-cased non-numeric character\
    \ sets with single whitespaces between them. Next, we'll tokenize each document\
    \ by turning each into a list of tokens, this time using `tokenizer` .\n\n```\n\
    docs_tokens <- tokenize_words(df_europarl$text)\n```\n\nOnce we have our documents\
    \ represented as token lists, the next step is to count the times each unique\
    \ token (a.k.a. type) occurs in each document. Computationally, this involves\
    \ determining which elements are exact matches. `table()` takes care of this matching\
    \ and counting. Below we use it with `lapply()` which “applies” a function to\
    \ each element of the list (i.e., each document).\n\n```\ndocs_freq <- lapply(docs_tokens,\
    \ table)\n```\n\nThe final output is a list of lists. Recall, the first-order\
    \ list is each document, and the second-order list is the token-counts for each\
    \ document. Using `melt()` , we turn this into a “triplet” dataframe consisting\
    \ of three columns: term, count, and document id. Both `tidytext` and `udpipe`\
    \ , discussed below, use this as a primary data structure."
