  md: "this is a useful method for deductively mapping a particular concept in our\
    \ texts without labeling them first.\n\n# Retrofitting Pretrained Embeddings for\
    \ Deductive Analysis\n\nA criticism of the previous process might be that fastText\
    \ embeddings are trained on the 2015 Wikipedia Data Dump, but Shakespeare was\
    \ writing over 400 years ago. Recall many embedding methods (implicitly or explicitly)\
    \ assign words vectors such that their cosine approximates their probability of\
    \ co-occurring in the corpus. In other words, we can use pairwise cosine to re-create\
    \ a TCM.\n\n+   THIS SECTION NEEDS:\n+   * tidyverse\n+   * stringi\n+   * gutenbergr\n\
    +   * text2map\n+   * text2map.pretrained\n+   * text2vec\n+   * rsvd\n+   * tidytext\n\
    +   * spacyr\n+   * semgram\n\nWe can also go the other way: use a focal TCM to\
    \ “retrofit” pretrained embeddings. We’ll start with all the plays in the First\
    \ Folio, but won’t collapse lines. Then we’ll do the same preprocessing as before\
