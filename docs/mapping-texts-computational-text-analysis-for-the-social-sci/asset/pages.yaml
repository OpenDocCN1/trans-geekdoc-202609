  md: "```\ntkens_ts <- tokens(df_swift$text)\ntkns_be <- tokens(df_beyonce$text)\n\
    \ntcm_ts <- fcm(tkens_ts, context = \"window\", window = 4L, tri = FALSE)\ntcm_be\
    \ <- fcm(tkns_be, context = \"window\", window = 4L, tri = FALSE)\n```\n\nIn corpus\
    \ linguistics, the TCM formalizes Firth’s (1957:11) famous quip “you shall know\
    \ a word by the company it keeps.” If the context window is relatively small,\
    \ the TCM captures a special kind of co-occurrence called **collocation**. This\
    \ refers to words that are often right next to each other, for example, “fast\
    \ food,” or “european union.” One use for collocations is determining which *n*-grams\
    \ we may want to retain during tokenization.\n\nHow do we measure whether two\
    \ (or more) terms co-occur an *unusual amount* in a corpus? We find the probability\
    \ a target term occurs with a context term *controlling for* the probability of\
    \ those terms appearing on their own. If we take the natural log of this, then\
    \ we have the **pointwise mutual information** (PMI).37 Although there are packages\
    \ for this, let’s build a function step-by-step (adapted from textvec’s `coherence()`\
    \ ).\n\n```\nget_ppmi <- function(tcm, tkns) {\n  # how big of context windows\
    \ did we use\n  n_windows <- round(sum(lengths(tkns)) / 4L)\n  # small constant\
    \ to avoid a logarithm of zero\n  constant <- 1e-10\n  # get overall probabilities\n\
    \  tcm_pmi <- (tcm / n_windows) + constant\n  # get the diagonal: how many times\
    \ a word occurs at all\n  tcm_diag <- diag(tcm_pmi)\n  # divide the cells by the\
    \ diagonal\n  tcm_pmi <- tcm_pmi / tcm_diag\n  # fix the diagonal and log\n  tcm_pmi\
    \ <- tcm_pmi * %*% diag(1 / tcm_diag)\n  tcm_pmi <- log(tcm_pmi)\n\n  # convert\
    \ it to a base R matrix\n  tcm_pmi <- as.matrix(tcm_pmi)\n  colnames(tcm_pmi)\
    \ <- rownames(tcm_pmi)\n  return(tcm_pmi)\n}\n```\n\nAfter running our function,\
    \ we can use it to weight our TCMs.\n\n```\ntcm_pmi_ts <- get_ppmi(tcm_ts, tkns_ts)\n\
    tcm_pmi_be <- get_ppmi(tcm_be, tkns_be)\n\n# have a look\ntcm_pmi_ts[1:3, 1:3]\n\
    tcm_pmi_be[1:3, 1:3]\n\ni       1.723724 16.46247 3.281868\nblew   16.462466 23.02585\
    \ 20.946410\nthings  3.281868 20.94641  7.306280\n```\n\n37 A TCM weighted by\
    \ PMI is foundational to “word embeddings” (Levy and Goldberg 2014); see Extended\
    \ Inductive."
