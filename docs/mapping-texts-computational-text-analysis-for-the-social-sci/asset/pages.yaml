  md: 'Python packages in a “virtual environment.” This means we need to “call” this
    virtual environment whenever using these packages. Let’s set that up now.


    First, install the following R packages:


    ```

    pkgs <- c("reticulate", "keras", "spacyr")

    install.packages(pkgs)

    ```


    The virtual Python environment manager we’ll use is called “miniconda” or “conda.”
    We’ll create this with reticulate. We can name our environment anything, but we’ll
    need to remember that name to reuse it later.


    ```

    library(reticulate)

    install_python()

    # miniconda_uninstall()

    install_miniconda()

    conda_create(envname = "myenv")

    ```


    After we create the environment, we’ll install a few Python packages in it.


    ```

    py_pkgs <- c("tensorflow", "spacy", "keras")

    conda_install(envname = "myenv", packages = py_pkgs, pip = TRUE)

    ```


    We reactivate this virtual environment whenever we need to access these packages
    with use_condaenv().


    ```

    use_condaenv(condaenv = "myenv")

    ```


