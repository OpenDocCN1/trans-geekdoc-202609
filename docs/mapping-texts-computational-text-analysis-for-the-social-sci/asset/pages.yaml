- pgno: 271
  md: 'into a few categories. We also learned how to identify the topics or themes
    a collection of documents’ authors are discussing. For instance, Flugstein and
    colleagues (2017) were interested in how participants of Federal Open Market Committee
    meetings understood the “economy” leading up to the 2008 Financial Crisis. Using
    methods discussed in this book, they divided this discursive space into fifteen
    frames—a manageable number. In all these cases, we are reducing complexity and
    summarizing semantic patterns.


    Mapping texts is an iterative process. A project vacillates between the familiar
    and the strange and novel—the hallmark of an abductive approach. We begin in mid-conversation
    with prior studies, social scientific theories, and—importantly—the actual texts
    under analysis. In their study of militant groups, Karell and Freedman (2019)
    used computational methods to “defamiliarize” radicalism: “[W]e used the computational
    measurement of the corpus to identify puzzling aspects of radical expression”
    (2019:730).


    Computational methods are uniquely equipped to iterate. We are not only building
    an organizational scheme but an architecture for repetition. Crucially, though,
    we need to know what we did and why we did it. As we log our journey through a
    project, we should always annotate code and write analytic memos as if for someone
    else because, in a few months, we will be someone else.4 We will, for example,
    forget small steps or change our understanding of a concept. We should not burden
    ourselves with remembering every detail when we can simply write it down. Only
    then can we understand our patterns, be prepared for the novel, simulate the null,
    and share our findings with our communities. Therefore, in keeping with the spirit
    of this book, science, language, and Finnegans Wake, we end by returning to the
    beginning.


    4 We annexed this quote from Alessandra Lembo. Thanks, Ale!


    # CONTAINERIZE OUR PROJECTS


    We aspire to create projects that are entirely contained. The main pieces of any
    project include: (1) prose, (2) scripts, (3) data, (4) outputs, and (5) administrative
    documents.


    Programming languages are written in plain text. We can also write prose (reports,
    articles, memos, etc.) in plain text—no need for clunky word processors.5 A benefit
    of writing in plain text is that we can embed code alongside prose. Plain text
    is also relatively future-proof. It has been around as long as personal computing
    and can be used on any platform—no proprietary software required!


    5 See Healy (2018b). This doesn’t work for everyone all the time, but IDEs include
    spell-checkers and other add-ons to aid writing. We wrote this entire book in
    RMarkdown!'
