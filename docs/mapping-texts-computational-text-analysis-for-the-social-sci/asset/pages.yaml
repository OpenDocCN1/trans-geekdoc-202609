  md: "# Table 7.6: Common Text Wrangling Decisions\n\n| Step | Specification |\n\
    | :--- | :--- |\n| Punctuation | What punctuation is removed and retained? |\n\
    | Transliteration | Are some characters replaced with equivalents? |\n| Numbers\
    \ | Are all numbers removed? Are they replaced? |\n| Lowercasing | Are all tokens\
    \ lowercased? Are some retained? |\n| Stopped Words | Were tokens removed (stopped)?\
    \ Which words? |\n| Stemming | Are tokens stemmed? How are they stemmed? |\n|\
    \ Lemmatizing | Are tokens lemmatized? How are they lemmatized? |\n\nTypically,\
    \ we do not want our findings to change drastically by any single decision; if\
    \ it does, we need to theorize why this might be the case.\n\nUsing mutate(),\
    \ we can remove a task by “commenting out” a line with the # . For example, if\
    \ we want to remove all numbers, rather than replace them with their written equivalents,\
    \ we comment out all the five replace_* lines, and uncomment gsub() that matches\
    \ the [[ :digit:]]+ regex pattern.\n\n```\n```\ndf_text <- df_text |> mutate(\n\
    \  ## transliterate and lowercase\n  text = stri_trans_general(\n    text,\n \
    \   id = \"Any-Latin;Latin-ASCII\"\n  ),\n  text = tolower(text),\n  ## punctuation\n\
