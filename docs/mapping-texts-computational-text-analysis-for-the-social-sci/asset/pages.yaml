    \ to break long pieces of text into lines and paragraphs. Let’s use a selection\
    \ from Kennedy’s Rice speech. Below we arrange the speech as one long string,\
    \ but after each line, we include \\\\n to indicate a newline.\n\n```\n```r\n\
    jfk_text <- c({\n\"we choose to go to the moon\\\\nwe choose to go to the moon\\\
    \\n\"\nwe choose to go to the moon in this decade and\\\\ndo the other\nthings\
