    Let''s do several procedures (output in margin), one at a time:


    ```

    df$z <- df$x^df$y # create new column as the x^y

    df$a <- df$z / sqrt(df$z) # sum the column z divided by square root of z

    sum(df$a) # sum the column

    ```


    We can do each of the above operations at the same time by nesting them:


    ```

    sum((df$x^df$y) / sqrt(df$x^df$y))

    ```


    We can also do the same operations by chaining them with the |> or "pipe" operator.12
    This dialect was popularized by the packages in tidyverse .Below mutate() and
    select() are from dplyr , which we make available when loading tidyverse with
    library() .


    12 The base R pipe requires version 4.1 or later. Check with R.Version . We can
    also use %>% from magrittr .


    ```

    library(tidyverse)

    df |>

    mutate(z = x^y) |>

    mutate(a = z / sqrt(z)) |>

    select(a) |>

    sum()

    ```


    # Control Processes: Functions, Loops, and Apply


    A key strength of computational tools is their capacity to iterate. Let''s say
