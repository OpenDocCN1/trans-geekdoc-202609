  md: "Finally, we create our TCM.33 The output is a sparse matrix. Since the TCM\
    \ is symmetric (as the context window is symmetric), only the top triangle of\
    \ the matrix is returned. (We'll print the output as a regular matrix to get column\
    \ names printed, and only print the first 10 columns.)\n\n```\nwords <- space_tokenizer(df_jfk$text)\n\
    iterate <- itoken(words)\nvoc <- create_vocabulary(iterate)\nvocab_vec <- vocab_vectorizer(voc)\n\
    tcm <- create_tcm(iterate, vocab_vec, skip_grams_window = 3L)\n```\n\n   and decade\
    \ do in other things this We choose go\nand  0 1 1.0 0.33 0.50 0.33 0.50 0 0 0\
    \ 0 0\ndecade 0 0 0.5 0.50 0.33 0.00 1.00 0 0 0 0 0\ndo 0 0 0.0 0.00 1.00 0.50\
    \ 0.33 0 0 0 0 0\nin 0 0 0.0 0.00 0.00 0.00 1.00 0 0 0 0 0\nother 0 0 0.0 0.00\
    \ 0.00 1.00 0.00 0 0 0 0 0\nthings 0 0 0.0 0.00 0.00 0.00 0.00 0 0 0 0 0\nthis\
    \ 0 0 0.0 0.00 0.00 0.00 0.00 0 0 0 0 0\nWe 0 0 0.0 0.00 0.00 0.00 0.00 0 3 1.0\n\
    choose 0 0 0.0 0.00 0.00 0.00 0.00 0 1.5\ngo 0 0 0.0 0.00 0.00 0.00 0.00 0 0 0\n\
    moon 0 0 0.0 0.00 0.00 0.00 0.00 0 0 0\nthe 0 0 0.0 0.00 0.00 0.00 0.00 0 0 0\n\
    to 0 0 0.0 0.00 0.00 0.00 0.00 0 0 0\n\nThe \"go\"-\"We\" cell is a 1, which we\
    \ expect since \"We\" occurs in \"go\"'s context window one time in each document\
    \ and at the very end of the window each time, so 1/3 + 1/3 + 1/3 = 1.\n\nWeighting\
    \ is the first difference from our SVD example. The second difference is how this\
    \ TCM is factorized. As noted previously, the performance of SVD diminishes as\
    \ corpora grow larger (Pennington et al. 2014:1539). GloVe borrows from context-sliding\
    \ approaches by turning the factorization into a prediction task using a model34\
    \ to find the word vectors where each pair of word vectors have a dot product35\
    \ that best minimizes the error in predicting the log of that word pair's cell\
    \ entry in the TCM. Of course, each word pair's prediction error cannot be minimized\
    \ in isolation, so GloVe finds the total set of word vectors that minimizes a\
    \ global cost function.36 This cost function is itself weighted so very frequent\
    \ word pairs and very infrequent terms do not contribute too much when learning\
    \ the vectors.\n\nLet's walk through an example using the Star Trek data.37 We\
    \ already preprocessed our data; it is the dataframe called df_st . In what follows,\
    \ we first define a GloVe model specifying that we want 100 dimensions. The x_max\
    \ parameter is part of the weighting scheme for the cost function: it is the “ceiling”\
    \ on word-pair co-occurrences (preventing very frequent word pairs from getting\
    \ too big) and the number by which we\n\n33 We can specify symmetric or asymmetric\
    \ windows with skip_grams_window_context .\n\n34 Specifically, a global log-bilinear\
    \ regression model.\n35 See Math Basics.\n36 This is the same logic behind minimizing\
    \ the sum of squared errors in OLS regression.\n37 This is adapted from Selivanov's\
    \ tutorial."
