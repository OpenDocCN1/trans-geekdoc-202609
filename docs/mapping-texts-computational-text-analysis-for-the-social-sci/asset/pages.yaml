  md: 'fair selection of texts. By “balance,” we mean different sources of variation
    are equally proportioned across our corpus. By “range,” we mean more than one
    dimension of variation is accounted for when selecting texts. By “representativeness,”
    we mean the extent our selection of texts includes all sources of variability
    relevant to our case (Biber 1993:243).


    The following sources of variation may be a principle for delimiting a corpus
    or a principle for balancing a corpus. For example, we can select only recent
    fiction, but balance with a range of genres. Each source of variation “reweight[s]
    the probabilities” of observing a given linguistic pattern (Martin 1997:85).


    These sources of variation may be more internal to a text’s content or more external
    to this content. We use this observation to organize our sources of variation.
    Text metadata is information associated with a text, but perhaps only indirectly
    derived from the text’s contents, including: authors and audiences, publication
    location and date, and domain and media. Text data is information derived from
    the text’s contents, including: languages and dialects, genres and topics, registers
    and styles. We discuss each below.


    # Text Metadata


    # Authors and Audiences


    Documents must be written.12 This is the first act of selection; an act that is
    typically outside researchers’ control. To understand authors’ motivations for
    writing anything, we could dive into the content. But, we must still understand
    why they wrote at all. What compelled and enabled them to produce a piece of text?
    What types of authors may be underrepresented (Brown et al. 2016)? And, later,
    we can consider why these words in this order and quantity?


    Related, we must consider to whom the author is writing as well as those who will
    eventually read it—that is, the audiences of the text. Broadly, the text we use
    for analysis can either be custom-made or ready-made (Salganik 2019). Custom-made
    text data is made explicitly to answer a scientific question. Here, researchers
    are audience members who craft its production. This includes interviews, observational
    fieldnotes, and open-ended survey questions. The reasons such text is produced
    are largely aligned with motivations for participation in any other kind of social-scientific
    study.


    Ready-made text, by contrast, is produced to communicate with friends, advertise
    products, persuade political rivals, entertain audiences,'
  merge: -1
