    \ and Enterprise. We'll make a unique dataframe of transcript lines for each series,\
    \ and then put all those dataframes into a single list.\n\n49 We could also collapse\
    \ the lines to make each document a unique script.\n\n```\ndia_df_list <- list()\n\
    for (i in unique(df_trek$series)) {\n  dia_df_list[[i]] <- dia_df[dia_df$series\
    \ == i, ]\n}\n```\n\nNext, we'll make the TCMs—again, one for each series. We'll\
    \ follow the same procedure for creating the TNG season 5 TCM above, but now we'll\
    \ dump it all into a function. We'll use `lapply()` to apply the function to each\
    \ dataframe in our list of dataframes.\n\n```\nmake_tcm <- function(df) {\n  words\
    \ <- space_tokenizer(df$text)\n  iter <- itoken(words)\n  vocab <- create_vocabulary(iter)\n\
    \  vocab_vec <- vocab_vectorizer(voc)\n  tcm <- create_tcm(iterate, vocab_vec,\
    \ skip_grams_window = 5L)\n  return(tcm)\n}\ndia_tcm <- lapply(dia_df_list, make_tcm)\n\
