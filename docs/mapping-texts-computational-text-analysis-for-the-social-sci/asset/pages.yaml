- pgno: 175
  md: 'These three lists—from the projections, Euclidean distances/similarities, and
    cosine similarities—all look somewhat different. While many factors could cause
    discrepancies between metrics, that document length changes our Euclidean measures
    is why cosine similarity is far more popular. There are many other similarity
    metrics to explore that could cross-validate discrepancies. Each metric, though,
    should be compared with a close reading of a sample of documents.


    # DOCUMENT CLUSTERING


    Cluster analysis is a ubiquitous technique and one of the first forms of “unsupervised
    learning” discussed in data science texts. Document clustering is a suite of methods
    for inductively grouping texts based on similar distributions. These distributions
    could be word counts across a vocabulary, topics, emotion classification scores—anything.


    +   THIS SECTION NEEDS:

    +   * stringr

    +   * text2map

    +   * text2vec

    +   * factoextra

    +   * tidyverse

    +   * tidytext


    Clustering methods find the partition of documents minimizing the differences
    between documents within a cluster and maximizing the differences between documents
    across clusters (Evans and Aceves 2016:32). This is done with an objective function
    (we’ll flesh this out shortly) used to successively determine whether any two
    documents should be clustered together.


    Miller (1997), for example, used hierarchical clustering to identify “frames”
    in a corpus of Associated Press news articles on wetlands issues; around the same
    time, Kabanoff, Waldersee, and Cohen (1995) used a type of k-means clustering
    to identify the value structures across a sample of Australian organizations using
    their organizational literature. Document clustering is still in rotation in contemporary
    computational text analysis—clustering is integrated with topic modeling (more
    on that later) to, for example, cluster authors (Tierney et al. 2021). We focus
    on two popular forms: hierarchical clustering and k-means clustering (Grimmer
    et al. 2022:123–37). One of these requires a distance matrix and one does not.


    # Hierarchical Clustering


    Hierarchical clustering creates not one cluster solution, but many. This forms
    a hierarchy, where lower-level clusters are nested within higher-level clusters.
    Just as each document is in only one cluster, so too must each cluster be nested
    within a single cluster at the higher level. This means the maximum number of
    clusters is the total documents in the


    6 Documents need not be the units to be clustered. For example, instead of clustering
    documents based on similar word count distributions, we could instead cluster
    the words in the vocabulary based on their similar distributions across documents.


    7 This is any partition into k number of clusters.'
  merge: -1
  img_proc: true
- pgno: 176
  md: "corpus ($k = N$, where $N$ is the total document count), while the minimum\
    \ number is one ($k = 1$).\n\nThere are two forms of hierarchical clustering:\
    \ *agglomerative* and *divisive* (Jain et al. 1999:274).$^8$ We'll focus on agglomerative\
    \ clustering because it is more popular than divisive clustering (Roux 2018:345).\n\
    \nSo, we start with each document in its own cluster and then successively merge\
    \ clusters until all documents are in one. We merge clusters based on similarity.\
    \ But how do we decide which two clusters are the most similar? This is where\
    \ the **distance matrix** comes in. Two clusters are merged if they are the closest\
    \ to one another relative to all other possible pairwise cluster comparisons,\
    \ based on the distance between them.\n\nImplicit here is our **objective function**:\
    \ minimizing distances between all documents within a cluster. We'll need to select\
    \ a **merging criterion**: a means of deciding whether the distance between two\
    \ clusters is the smallest possible given all other possible cluster mergers,\
    \ and then joining those two clusters based on that minimization. There are many\
    \ merging criteria but the most popular are the complete-linkage, single-linkage,\
    \ and Ward's method (Jain et al. 1999:275).\n\nNo one merging criterion is consistently\
    \ favored. Justification for selecting one criterion is rarely provided, outside\
    \ of picking the one passing the “eye-test”—that is, providing clusters matching\
    \ expectations given researchers’ substantive knowledge or theory.\n\nRegardless\
    \ of criterion, clustering provides inductively derived groups of semantically\
    \ similar documents. Let’s see. We’ll work with the State of the Union speeches—specifically\
    \ Bill Clinton’s first SOTU in 1993 to Donald J. Trump’s speech in 2020.$^9$\n\
    \nLoad the data, take care of some wrangling, and create the DTM. We’ll remove\
    \ all punctuation except for any underscores, commas, or dashes internal to a\
    \ word, and also remove capitalization, numbers, and excess spaces. We eventually\
    \ want to see the top words per cluster, so we’ll remove words in the 2014 Snowball\
    \ stoplist as part of our DTM construction. The functions we’ll use for clustering\
    \ only work with base R dense matrices.$^{10}$\n\n```\n```\ndata(\"data_corpus_sotu\"\
    , package = \"quanteda.corpora\")\n\nsotu <- tidy(data_corpus_sotu) |>\n  filter(Date\
    \ >= \"1993-02-17\") |>\n  mutate(\n    year = gsub(\"\\\\d+-.-*\", \"\\\\1\"\
    , Date),\n    doc_id = paste0(President, \"_\", year),\n    text = tolower(text),\n\
    ```\n```\n\n^8 They differ in their starting point in the hierarchical clustering\
    \ structure. With agglomerative clustering, each document starts as its own cluster.\
    \ Then, the most similar documents—that is, those closest—are grouped. This process\
    \ is repeated until, theoretically, all documents occupy a single cluster. Divisive\
    \ clustering works in the other direction: all documents occupy the same cluster\
    \ and then documents are successively separated until each document occupies its\
    \ own cluster.\n\n^9 Tree-based clustering can quickly become computationally\
    \ demanding with even modestly sized corpora.\n\n^10 Recall, this is less memory\
    \ efficient. See Text to Numbers."
  merge: -1
  img_proc: true
