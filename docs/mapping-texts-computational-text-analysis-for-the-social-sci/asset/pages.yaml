    \ measure the best of our energies and skills\\\\n\"\nbecause that challenge is\
    \ one that we're willing to accept\\\\n\"\none we are unwilling to postpone and\
    \ one we intend to win\"\n})\n```\n```\n\nWe can turn this long string into separate\
    \ strings for each line by splitting on the newline character. This will structure\
    \ our lines as discrete units of analysis.\n\n```\n```r\nstrsplit(jfk_text, split\
    \ = \"\\\\n\")\n```\n```\n\n```\n```\n[[1]]\n [1] \"we choose to go to the moon\"\
    \n [2] \"we choose to go to the moon\"\n [3] \"we choose to go to the moon in\
    \ this decade and\"\n [4] \"do the other things not because they are easy\"\n\
    \ [5] \"but because they are hard\"\n [6] \"because they measure the best of our\
    \ energies and skills\"\n [7] \"because that challenge is one that we're willing\
    \ to accept\"\n [8] \"one we are unwilling to postpone and one we intend to win\"\
    \n```\n```\n\n# REMOVING AND REPLACING CHARACTERS\n\nIt is often useful to replace\
    \ one character with a similar alternative or a shared root character. This “collapses”\
    \ two versions of what researchers consider the “same” token. Unlike character\
    \ encoding errors, these are"
