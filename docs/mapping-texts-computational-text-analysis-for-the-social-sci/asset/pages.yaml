- pgno: 113
  md: "# \"Misspelled\" Words\n\nWe often find “unconventional” terms. Perhaps they\
    \ are rendered incorrectly (e.g., common with OCR), or have encoding issues. Other\
    \ times, they are kerned (spaces between letters, “W H Y ?”), or elongated (“Whyyyyyyy?”),\
    \ use different regional spellings (e.g., color vs. colour), are slang words,\
    \ nonsense words or catchphrases,13 or are intentionally or unintentionally “misspelled”\
    \ words.\n\n+   13 “Cowabunga,” “pi-kapika,” and “snoochie boochies” may be notorious\
    \ blatherskite, but they’re still words!\n\nRecall that part of the reason we\
    \ are altering our text is to limit our feature space before the analysis. The\
    \ question is, as always, what information are we losing when we reduce these\
    \ spelling variations to a conventional form?\n\nThere are many tools for dealing\
    \ with “non-standard” words. textclean offers functions that attempt to “fix”\
    \ both kerning and elongation. Both use a combination of dictionaries and rules.\
    \ The elongation function looks for characters (any case) repeated at least three\
    \ times in a row. These words are replaced with their “canonical” form by dropping\
    \ all consecutive letters but the first one, and then attempting to match it to\
    \ the most common word form in Google’s n-gram dataset.14 The kerning function\
    \ looks for 3 or more capital letters in a row with spaces between them.\n\n+\
    \   14 storage.googleapis.com/books/ngrams/books/datasetsv2.html\n\n```\nelong\
    \ <- c(\"l o o k\", \"moorley's!\", \"real coooool!\",\n           \"heeeeere's\
    \ Johnny!\", \"Khaaaaaann!\", \"as\",\n           \"I'm liiiike whyyyyy me?\"\
    )\nreplace_word_elongation(elong)\nkerned <- c(\"I'm\", \"a l l\", \"O U T\",\
    \ \"O F\", \"B U B B L E G U M\")\nreplace_kern(kerned)\n```\n\n+   15 hunspell.github.io/\n\
    \ntextclean also provides a function for common misspellings. This uses hunspell\
    \ on the back-end—so let’s look at this package instead. Hunspell15 is the spell\
    \ checker for a variety of common applications, like Mozilla Firefox and Google\
    \ Chrome. Like most of the tools we’ve discussed, Hunspell uses a combination\
    \ of rules and dictionaries to identify and deal with potential misspellings.\
    \ First, the function tokenizes the text by unigrams. It then breaks these unigrams\
    \ into “stems” and “affixes.”16 Next, the function compares the stem + affix combination\
    \ with language-specific dictionaries. If there is no match, that token is considered\
    \ potentially misspelled.\n\n+   16 We’ll cover stemming later in this chapter.\n\
    \n+   17 This is an online library of free ebooks founded by Michael Hart, the\
    \ inventor of the ebook.\n\nLet’s use Lewis Carroll’s works. We can download them\
    \ from Project Gutenberg17 using gutenbergr . The output is a dataframe with 3,907\
    \ lines—one for each line in each book."
  merge: -1
  img_proc: true
- pgno: 114
  md: "```\nbook_ids <- c(11, 12, 13, 620, 651)\nmy_mirror <- \"http://mirrors.xmission.com/gutenberg/\"\
    \n\ncarroll <- gutenberg_download(book_ids,\n\ta    meta_fields = \"title\",\n\
    \tmirror = my_mirror)\n```\n\n```\n# wrangle the lines a bit\ncarroll <- carroll\
    \ |>\n\tmutate(\n\t\ttext = replace_curly_quote(text),\n\t\ttext = replace_contraction(text),\n\
    \t\ttext = gsub(\"\", \"\", text),\n\t\ttext = gsub(\"[[ :punct: ]]+\", \" \"\
    , text),\n\t\ttext = gsub(\"[[ :space: ]]+\", \" \", text),\n\t\ttext = trimws(text)\n\
    \t)\n```\n\n```\n# tokenize, create token-count list\ntkens <- tibble(token =\
    \ tokenize_words(carroll$text) ) |>\n\tunnest(token) |\n\tcount(token, sort =\
    \ TRUE)\n```\n\nNext, we'll feed each unique token to `hunspell_check()` and find\
    \ the “misspelled” words in Carroll's books.\n\n```\ntkens <- tkens |>\n\tmutate(correct\
    \ = hunspell_check(token) ) |>\n\tunnest(correct, keep_empty = TRUE)\n```\n\n\
    ```\ntkens |>\n\tfilter(correct == FALSE) |>\n\tprint(n=30)\n```\n\n`hunspell`\
    \ flagged several types as misspelled. Many top “misspelled” words are names or\
    \ “nonsense” words that Carroll invented (e.g., Jabberwock, Bandersnatch). We'll\
    \ also find acronyms and company names (or other proper nouns) flagged as misspelled.¹⁸\n\
    \n`hunspell` also suggests alternative spellings—how? First, it uses a dictionary\
    \ of common typos (e.g., “alot” for “a lot”). Second, it compares the character\
    \ sequence to the “closest” correct sequence in the dictionary. Here, “closest”\
    \ is the nearest neighbor on the keyboard! For example, it would suggest “node”\
    \ for the token “nide,” because “o” is right next to “i” on the standard QWERTY\
    \ keyboard.\n\n```\ntkens |>\n\tfilter(correct == FALSE) |>\n\tfilter(token !=\
    \ \"oo\") |> # let's skip this token\n\tmutate(replacement = hunspell_suggest(token)\
    \ ) |> \n\tunnest(replacement) |>\n\tprint(n=30)\n```\n\nThis is one algorithm\
    \ for comparing string similarities based on **edit distance**.¹⁹ There are many\
    \ slight variations on this including, the Hamming, Levenshtein, and Jaro-Winkler\
    \ distance. Let's compare our\n\n¹⁸ The Cupertino effect is when a spell checker\
    \ erroneously replaces words because they are *not* in its dictionary. In the\
    \ 1990s, Microsoft Word would change the non-hyphenated “cooperation” to “Cupertino”\
    \ (the corporate headquarters of Apple Inc.).\n\n¹⁹ Edit distance quantifies how\
    \ many “edits”—editons, deletions, replacements—it would take to turn one string\
    \ into another. For example, to turn “water” into “wine,” would entail one deletion\
    \ and two replacements."
  merge: -1
  img_proc: true
- pgno: 115
  md: "20 In addition to reducing dimensionality by merging similarly spelled words,\
    \ these measures of string similarity can be especially useful when working with\
    \ archival records that have been OCRed and linking different datasets by text-based\
    \ variables—see especially RecordLinkage .\n\nflagged words to the unflagged words\
    \ using Levenshtein, the default in `adist()`.<sup>20</sup>\n\n```\n```\ncorrect\
    \ <- tkms[tkms$correct==TRUE, ]\nincorrect <- tkms[tkms$correct==FALSE, ]\nleven\
    \ <- adist(x = correct$token, y = incorrect$token,\n               ignore.case\
    \ = FALSE, counts = FALSE)\nrownames(leven) <- unlist(correct$token)\ncolnames(leven)\
    \ <- unlist(incorrect$token)\n```\n```\n\nWhich word is the \"max\" and \"min\"\
    \ distance from Jabberwock?\n\n```\n```\nwhich.max(leven[, \"Jabberwock\"] )\n\
    which.min(leven[, \"Jabberwock\"] )\n```\n```\n\nA popular alternative to \"edit\
    \ distance\" comparisons is **soundex**, which converts a string into a phonetic\
    \ \"soundex\" code. A pairwise comparison gets a 1 if two tokens have the same\
    \ soundex code; otherwise, 0. `stringdist` provides several \"edit distance\"\
    \ measures including soundex, and `ipa` provides tools to convert to phonetic\
    \ alphabets for comparison.\n\n# THIS SECTION NEEDS:\n\n+   - quanteda\n+   -\
    \ tidytext\n+   - tidyverse\n+   - text2map\n+   - gutenbergr\n\n# REMOVING WORDS\
    \ AND STOPLISTS\n\nWhy would we remove or \"stop\" words entirely from our corpus?\
    \ First, many text sources interact with automated content creators—for example,\
    \ bots or metadata. If we are analyzing emails, there is some automated content\
    \ in the email, but we typically only care about the human-produced content. Consider,\
    \ for instance, an analysis of the pager messages sent during the September 11th\
    \ terrorist attacks in the US. Back and colleagues (2010) placed words in each\
    \ message into one of three emotion categories: sadness, anxiety, anger. They\
    \ found _anger_ intensified as compared to sadness and anxiety. Unfortunately,\
    \ they failed to catch one automated technical code that included the word \"\
    critical\" (Pury 2011; Back et al. 2011). Had they accounted for this, they would\
    \ have found no evidence that anger increased over the timeline. In some cases,\
    \ though, our research may center on automated content, such as how bots may spread\
    \ hate speech on social media (Uyheng and Carley 2020).\n\nSecond, if we have\
    \ fewer types of words—by definition—we have fewer dimensions! Removing words\
    \ limits the feature space. Third, removing types of words can reduce computational\
    \ demands—hopefully with minor trade-offs. Fourth, sometimes we’ll want to visualize\
    \ words, but there are just too many (e.g., it looks like a ball of flies). Here\
    \ too,"
  merge: -1
  img_proc: true
- pgno: 116
  md: "we hope to keep the most visually “informative” words. Finally, we often remove\
    \ words that are not *discriminant*, those which distinguish one document from\
    \ another.²¹\n\nResearchers often compile a list of words to remove or “stop”\
    \ into a negative dictionary or **stoplist**. This practice started with information\
    \ retrieval as early automated indexing prioritized efficiency. As computing resources\
    \ improved, however, the “general trend in [information retrieval] systems …[is\
    \ from] standard use of quite large stop lists (200–300 terms) to very small stop\
    \ lists (7–12 terms) to no stop list whatsoever” (Manning et al. 2010:27).\n\n\
    There are no such things as “stopwords”²²—that is, there is no explicitly agreed-upon\
    \ set of words (in any language) we *must* remove in every analysis. Which words\
    \ are “stopped” is often a matter of convention—treated like the angel’s share\
    \ of whiskey—and reinforced by default settings on functions. This is problematic\
    \ because it obscures a dimension reduction step. Nevertheless, the misnomer “stopword”\
    \ is a fixture of text analysis.\n\nBefore we dive into constructing stoplists,\
    \ let’s review several ways to remove words from our text data. The method depends\
    \ on our data structure: we can remove words directly from our **raw text**, from\
    \ a **token-list** or **token-count list**, and finally, we can remove words from\
    \ a DTM. Let’s demonstrate using Carroll’s works again.\n\n```\n```\nbook.ids\
    \ <- c(11, 12, 13, 620, 651)\nmy_mirror <- \"http://mirrors.xmission.com/gutenberg/\"\
    \ncarroll <- gutenberg_download(book.ids,\n  meta_fields = \"title\",\n  mirror\
    \ = my_mirror)\ncarroll <- carroll |> mutate(text = tolower(text))\n```\n```\n\
    \nWe’ll first use `gsub()` to create a new column of text with stoplist words\
    \ removed. For this, collapse the stoplist with `paste()` using the vertical bar\
    \ `|`.²³ In effect, this tells `R` to substitute a “no-space” whenever it encounters\
    \ *word*1 or *word*2, on up to *word*n in our stoplist.\n\n```\n```\n# create\
    \ stoplist\nlist_stop <- c(\"bandersnatch\", \"jabberwock\")\nstop_pattern <-\
    \ paste(list_stop, collapse = \"|\")\ncarroll$text <- gsub(stop_pattern, \"\"\
    , carroll$text,\n  ignore.case = TRUE)\n```\n```\n\nWhat if we have a token-list\
    \ or token-count list? If we turn them into dataframes, we can remove any *rows*\
    \ matching words in our stoplist. Let’s work through four methods to remove rows\
    \ based on a word matched in a negative dictionary.\n\n> This, of course, depends\
    \ on our question. If our question concerns the topics or concepts distinguishing\
    \ documents within a corpus, we may be more interested in nouns or less frequent\
    \ words. If we wish to compare authors’ writing styles, though, we’re more interested\
    \ in words and grammatical classes that vary little by topic.\n\n> For better\
    \ or worse, the term “stopword” was coined in 1958 by Hans Peter Luhn when introducing\
    \ the Keyword-in-Context (KWIC) indexing technique. However, Barbara Flood (1999)\
    \ likely coined the more appropriate term “stop list.”\n\n> This is a logical\
