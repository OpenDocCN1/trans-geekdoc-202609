    # Dependency Parsing


    We can take tagging further by retaining the relations between different words.
    This is called dependency parsing. Let’s consider a short example using spacy
    .25 Then, as with udpipe , we’ll need to select an English-specific language model.
    The en_core_web_sm is a lightweight model pretrained on blogs, news articles,
    and social media comments. As this uses the Python package spacy , we’ll need
    to download the language model to our conda environment .26 We’ll also use this
    environment to “initialize” the model, which makes it available to R functions.


    ```

    spacy_download_langmodel("en_core_web_sm", envname = "myenv")

    ```


    ```

    spacy_initialize(model = "en_core_web_sm", condaenv = "myenv")

    ```


    Dependency parsing builds on POS tagging by tracking how the different entities
    in the text interact. For example, take the sentence “Elmo and Bert scare the
    pigeons.” Here, there are three main entities and an action. Basic co-occurrence
    methods would note Elmo, Bert, and pigeon co-occur with “scare,” but not who is
    scared by whom. Dependency parsing keeps track of of the “head token” of each
    word. For instance, the head token of “the” is “pigeon,” but the head token of
    “pigeon” is “Elmo.”


    ```

    text <- "Elmo and Bert scare the pigeons"

    spacy_parse(text, dependency = TRUE) |>

    select(token_id, token, pos, head_token_id, dep_rel)

    ```


    | token_id | token | pos | head_token_id | dep_rel |

    |---|---|---|---|---|

    | 1 | Elmo | ADJ | 4 | nsubj |

    | 2 | and | CCONJ | 1 | cc |

    | 3 | Bert | PROPN | 1 | conj |

    | 4 | scare | VERB | 4 | ROOT |

    | 5 | the | DET | 6 | det |

    | 6 | pigeons | NOUN | 4 | dobj |


    We can visualize the dependency between words using a directed graph like Figure
    8.5.


    udpipe also provides dependency parsing functions.


    See Computing Basics.'
