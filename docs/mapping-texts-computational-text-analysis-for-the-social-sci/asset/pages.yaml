    \ Weight, scales = \"free\", ncol = 1) +\n  coord_flip() +\n  labs(subtitle =\
    \ \"Top Terms in Kennedy’s Addresses\")\n```\n```\n\n```\n```r\nggarrange(plot_kennedy,\
    \ plot_nixon, common.legend = TRUE)\n```\n```\n\n# Summary of Weightings\n\nWe\
    \ covered several types of DTMs: term frequency, relative term frequency, binary,\
    \ and term frequency/inverse document frequency. There are several more weighting\
    \ schemes, however. Nearly all try to overcome the problem of the non-normal distribution\
    \ of words. While we won’t go over all of these here, Table 6.2 contains additional\
    \ weighting schemes that we can explore on our own.\n\n# Table 6.2: Selection\
    \ of DTM Weighting Schemes\n\n| Weighting | Description |\n|---|---|\n| Term Frequency\
    \ (TF) | Term's count in a document |\n| Relative TF (RF) | Divide TF by total\
    \ terms in a document |\n| Binary or Boolean | Zero cells are 0 (FALSE); otherwise,\
    \ 1 (TRUE) |"
