    to think about the difference between directions and centroids is that directions
    are better for picking up on relational biases (i.e., terms that favor one pole
    at the exclusion of the other), while centroids are better for identifying general
    contexts or the intersection of contexts.


    Ultimately, though, this depends on what meanings we are attempting to measure.
    Some meanings are tightly organized into binary spectra; others are not. A more
    theoretical way to consider the contrast between centroids and directions is using
    the linguist Gremais “semio­tic square” (Gremais 1983). Gremais organized meanings
    in terms of four poles. In our example, these would be “immigration” and “citizenship,”
    as well as “not-immigration” and “not-citizenship.” While semantic'
