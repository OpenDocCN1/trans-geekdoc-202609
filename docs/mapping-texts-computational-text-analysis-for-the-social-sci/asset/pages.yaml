    \ Structural topic modeling, or STM (Roberts et al. 2019), incorporates document-level\
    \ covariates in topic estimation and estimates the effects of these covariates\
    \ on topic prevalence and topic content.\n\nLet's briefly discuss the basics of\
    \ STM so we can see where the prevalence and content covariates come into play\
    \ in the data-generation process assumed by STM.⁵\n\nSTM is a probabilistic model.⁶\
    \ It attempts to reverse-engineer the data-generating process by finding the model\
    \ that maximizes the likelihood of observing the documents' word counts that we\
    \ do. Following Roberts and colleagues (Roberts et al. 2016:991; Roberts et al.\
    \ 2019:2–3), we randomly draw a probability distribution for each document in\
    \ the corpus from a logistic normal distribution that has been conditioned on\
    \ that document's “prevalence” covariates.\n\nThen, if there is a content covariate\
    \ (which we discuss next), STM decomposes the document's topic distributions over\
    \ the corpus vocabulary into two matrices and an array (Roberts et al. 2016:991).\
    \ The\n\n+   THIS SECTION NEEDS:\n+   * tidyverse\n+   * textclean\n+   * textstem\n\
    +   * stringi\n+   * tidytext\n+   * text2map\n+   * stm\n+   * stminsights\n\
    +   * marginaleffects\n+   * ggtern\n\n⁵ STM builds on CTM, and reduces to it\
    \ when there are no covariates. There are excellent statistical overviews (e.g.,\
