  md: '# 13

    Project Workflow and Iteration


    > “That’s another thing we’ve learned from your Nation,” said Mein Herr, “map-making.
    But we’ve carried it much further than you.... We **actually made a map of the
    country, on the scale of a mile to the mile!”**

    > “Have you used it much?” I enquired.

    > “It has never been spread out, yet,” said Mein Herr: “the farmers objected:
    they said it would cover the whole country, and shut out the sunlight! So now
    we use the country itself, as its own map, and I assure you it does nearly as
    well.”

    > —L. Carroll


    # THE PARADOX OF THE COMPLETE MAP


    **COMPUTATIONAL** methods are often lauded for their ability to **scale**. Indeed,
    we even discuss how corpora may be so large as to render traditional qualitative
    content analysis impracticable. Computational methods step in to augment the human
    reader, directing our attention, sharing the workload, providing insight, etc.


    Scale is not an endless virtue, however. A one-to-one map of Okinawa, the exact
    size of this Ryukyuan island, would be a 1,200 square kilometer hindrance to Okinawan
    life. In mapping texts too, size can be a hindrance to understanding. Large Language
    Models (LLMs) epitomize this paradox. In one sense, they are “overfitted” for
    social scientific purposes—the computational equivalent of adding theoretical
    nuance for the sake of nuance. Social scientists should be skeptical of scale-hype.
    Not only because of the potential environmental and social costs of ever-larger
    models. But also what does our community learn when we (humans) project meaning
    onto a language model parroting probabilistic prose (Bender et al. 2021)? We could
    learn much more from better documentation on corpus construction and model architecture
    than from greater complexity.


    When mapping texts, we simplify their information for particular uses. Mapping,
    then, is reduction to aid interpretation (Lee and Martin 2014). For example, we
    learned several methods for sorting documents


    1 “It blocks the process of abstraction on which theory depends, and it inhibits
    the creative process that makes theorizing a useful activity” (Healy 2017:119).


    2 Training GPT-3 produced the carbon equivalent of driving a car 435,000 miles—nearly
    to the moon and back (Quach 2020), and CEO of OpenAI described the “compute costs”
    of ChatGPT as “eye-watering.”


    3 This isn’t a rhetorical question.'
