- pgno: 79
  md: 'chapters or even paragraphs as our documents or want to standardize the size
    of our texts to facilitate comparison.


    Just as we used regex patterns to tokenize texts, we can use regex patterns to
    split our larger documents into smaller chunks. For example, we could use punctuation
    to divide text into sentences, or we could use those special characters for different
    kinds of whitespace—tabs ( \t ), returns ( \r ), and newlines ( \n ). We may also
    chunk documents by a certain token count.


    ```

    # chunk by punctuation

    strsplit(df_trek$line[17], "[!.?,]")


    # chunk by newlines

    strsplit(df_trek$line[17], "[\n]")


    # chunk by every N tokens

    chunk_text(df_trek$line[17], chunk_size = 10)

    ```


    Finally, sometimes we want a “moving window”—that is, a shingle— where each chunk
    of text is partially overlapping with the previous. This is equivalent to tokenizing
    by n-grams discussed above. The difference is how we intend to use the output.
    When tokenizing, we are looking for ways to represent the content of our documents,
    whereas with chunking we are, in effect, creating our documents.


    ```

    # chunk text into a moving window of 3 tokens

    tokenize_ngrams(df_trek$line[17], n = 3L, n_min = 3L)


    [[1]]

    [1] "captain''s log stardate" "log stardate 45020.4"

    [3] "stardate 45020.4 we" "45020.4 we have"

    [5] "we have arrived at" "have arrived at"

    [7] "arrived at starbase" "at starbase two"

    [9] "starbase two thirty" "two thirty four"

    [11] "thirty four where" "four where i"

    [13] "where i have" "i have taken"

    [15] "have taken the" "taken the opportunity"

    [17] "the opportunity to" "opportunity to make"

    [19] "to make a" "make a proposal"

    [21] "a proposal to" "proposal to fleet"

    [23] "to fleet admiral" "fleet admiral shanthi"

    ```


    Alternatively, instead of breaking larger pieces of text into chapters, paragraphs,
    sentences, n-gram windows, etc., we may want to aggregate up from these smaller
    chunks. For example, perhaps we have sentences, but we want paragraphs or even
    a full book. For example, rtetk gives lines, but we want an episode’s full script
    instead. First, we group all lines by the episode number, then “summarize” this
    grouping. Second, we collapse the lines using paste0() and the whitespace character
    indicating a newline ( \n ). We should now have one row for each episode.'
