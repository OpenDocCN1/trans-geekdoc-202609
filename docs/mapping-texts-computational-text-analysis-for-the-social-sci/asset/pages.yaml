    \ scale = \"free\")\n```\n\nFigure 11.8 shows, to the extent US-based news media\
    \ articles tend to adopt the public meanings of citizenship and immigration (as\
    \ defined by the massive Common Crawl archive), citizenship is “local,” synonymous\
    \ with “community” and “providing.” In contrast, immigration is “non-white,” colonization,”\
