- pgno: 140
  md: '**tagging** classifies each word in a document by its predicted part of speech:
    for instance, whether a word is a noun, verb, adverb, preposition, and the like.


    Again, this could be accomplished with a dictionary—for example, whenever there
    is a /the/ we tag it with the POS “article.” We could also add a rule involving
    the context: for example, whatever word follows /the/ is a “noun.” Finally, we
    can train a probabilistic model on already tagged text. Often, POS tagging uses
    a combination of the above, with researchers using a pretrained model and improving
    it with rules and dictionaries.


    # How POS Tagging Works


    Models, rules, and dictionaries for POS tagging vary by how fine-grained the grammatical
    classes are. Stanford NLP Group’s POS tagger, for example, identifies nine different
    classes: adjectives, adverbs, conjunctions, determiners, nouns, numbers, prepositions,
    pronouns, and verbs. In comparison, models trained on the Penn Treebank17 annotation
    scheme comprise 48 tags, detailed in Table 8.1 (adapted from Taylor et al. 2003:8).


    Consider the Star Trek example paragraph again. Read it to get a quick sense of
    the different word senses: in the first sentence, “Star Trek: Picard” is a noun,
    “debuted” is a verb, “in” is a preposition, and “2020” is a number.18


    The package we use in the demonstration below, tagger —an R wrapper for the Java-based
    OpenNLP library like entity —is trained to tag English parts of speech using the
    Penn Treebank (Taylor et al. 2003).19 POS tags are standard annotations in treebanks.


    Like its NER counterpart, the OpenNLP POS tagger uses a maxent model to predict
    the appropriate Penn Treebank tag. Researchers may supply their own annotated
    training data, but we’ll rely on the pretrained OpenNLP POS model below.


    # Part-of-Speech Tagging in R


    To show how we can get the counts of parts-of-speech, we’ll use tagger .20 Consider
    the Star Trek: Picard paragraph again. Let’s pass that along to . tag_pos() :


    ```

    para <- "Star Trek: Picard, which debuted in January 2020 on CBS All Access, saw
    Patrick Stewart reprise his role as the noble leader More than 20 years after
    Star Trek: Next Generation ended. The trailer for the new show showed Picard retired
    at a vineyard on Earth, but feeling out of place and longing for space travel."

    tag_pos(para)

    ```


    > 17 A treebank is a corpus where the words have been annotated to capture different
    linguistic elements.


    > 18 POS tagging is a form of word sense “disambiguation.”


    > 19 The Penn Treebank is a corpus of 7 million POS-annotated words from “IBM
    computer manuals, nursing notes, Wall Street Journal articles, and transcribed
    telephone conversations, among others” (Taylor et al. 2003:5)


    > 20 As with entity , we may need to install this from GitHub: trinker/tagger
    . We must also install termco and coreNLPsetup from trinker/ .'
