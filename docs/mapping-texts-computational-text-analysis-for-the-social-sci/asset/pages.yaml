  md: '“features”—typically, a preprocessed selection of terms. So, we’ll dive into
    the task of associating weights with those features.


    # THIS SECTION NEEDS:


    +   - tidyverse

    +   - tidyModels

    +   - tidytext

    +   - text2map

    +   - rsample

    +   - text2vec

    +   - quanteda.textmodels

    +   - quanteda

    +   - caret


    6 Recall that LDA and STM are generative models—see Core Inductive and Extended
    Inductive.


    # Classic Training with Supervision


    Training methods are commonly divided into two main types. Logistic regression
    is a classic example of a family called discriminative classifiers. The alternative
    is a family called generative classifiers, and the classic example here is naive
    Bayes. Generative classifiers, as the name implies, try to model how the observed
    data are generated.6 This model is then used to find a boundary within our data.
    Discriminative classifiers are just trying to find this boundary directly.


    As Vapnik states (Vapnik 1998:12), we should “try to solve the problem directly
    and never solve a more general problem as an intermediate step,” and so discriminative
    classifiers are (at least) a good place to start. On the other hand, generative
    models are considered less susceptible to overfitting.


    The generative/discriminative distinction, however, is less clear than it appears.
    There are “hybrid” generative-discriminative models, and we can use some models
    like logistic regression for both. A more pressing distinction is between models
    which assign labels discretely and models which assign them gradationally.


    In the following, we’ll walk through popular supervised learning methods based
    on, (1) logistic regression, (2) naive Bayes, and finally, (3) neural networks.
    We’ll get a sense of the differences between each method, but also their similarities.
    Namely, each entails several iterations, checking its accuracy at the task,7 and
    updating the weights as it does (i.e., optimizing). The model stops when the improvements
    are minimal (i.e., the model converges), or after a set number of iterations (McLevey
    2021:400–4).


    7 That is, the “agreement” between model predictions and actual labels.


    # Logistic Regression


    Like regular linear regression, logistic regression tries to predict an outcome
    using some other variables. Here, we’ll keep it simple and assume our outcome
    is a variable with two values: yes or no? Is the document in a category or not?
    Researchers encounter questions like this when, for example, attempting to subset
    an otherwise enormous corpus for close reading. Logistic regression is especially
    suited for this scenario.'
