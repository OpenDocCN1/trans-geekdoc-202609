- pgno: 214
  md: '# Dimension Reduction with Singular Value Decomposition


    PPMI vectors don’t solve the sparsity problem! The length of the vector is still
    the size of the vocabulary, and likely to be tens of thousands elements long.
    When we start reducing these long vectors to “lower-dimensional” vectors, we take
    a step toward **word embeddings**. The easiest way to reduce the dimensions of
    either our raw count or PPMI-weighted TCM is to apply singular value decomposition
    (SVD).27


    ```

    svd_tng <- svd(tcm_ppmi)

    ```


    Somewhere between 100 and 300 dimensions is optimal for representing words (see
    Yin and Shen 2018). Since we limited our vocabulary, it is best to limit the number
    of dimensions of our embeddings to the lower end.


    ```

    wv_tng <- svd_tng$v[, 1:100]

    rownames(wv_tng) <- rownames(tcm_ppmi)

    ```


    Now, instead of a term-by-term term-context matrix with over 3,000 terms and 3,000
    contexts, we have a term-by-dimension context matrix with over 3,000 terms and
    exactly 100 dimensions. Though both TCMs are technically word vector matrices,
    the latter is what most mean by word vectors. These new word vectors form a *simpler*
    representation of the corpus’ meanings while still retaining most of the covariances.


    Since our word vectors form a geometric space, we can use basic arithmetic to
    add and subtract word vectors. The classical example goes: If we subtract the
    vector for “man” from the vector for “king” and then add the vector for “woman,”
    we get a synthetic vector very close to the vector for “queen.”


    Let’s try it. If we subtract the vector for “jean” from the vector for “picard”
    and then add the vector for “william,” we should find that one of the closest
    words is “riker”.28


    27 See Math Basics.


    28 Jean-Luc Picard and William Riker are two main characters on the show.


    ```

    vec1 <- wv_tng["picard", , drop = FALSE]

    vec2 <- wv_tng["jean", , drop = FALSE]

    vec3 <- wv_tng["william", , drop = FALSE]


    vec_syn <- vec1 - vec2 + vec3


    sim <- sim2(wv_tng, vec_syn, method = "cosine")

    sim[, 1] |> sort(decreasing = TRUE) |> head(n = 5)

    ```


    ```

    picard riker william welcome macduff

    0.7496190 0.4816914 0.4608522 0.4011149 0.3690412

    ```


    Sure enough, “riker” is one of the closest words to our synthetic vector.'
  merge: -1
  img_proc: true
- pgno: 215
  md: "We can use these geometric properties of the word vector space to consider\
    \ more social scientific analyses. For example, if we get the cosine of each word\
    \ from the vector for “boy” and then the vector for “girl” and then take the difference\
    \ in these cosines, we should see which words in the series were used in more\
    \ “masculine” contexts and which were used in more “feminine” contexts. Differences\
    \ in cosine similarities above zero indicate a word more associated with masculinity.\
    \ Those below zero are more associated with femininity.\n\nLet's try this with\
    \ the Star Trek data. First, get each corpus word's cosine similarity from the\
    \ “boy” and “girl” vectors and put the results into a new dataframe.\n\n```\n\
    ```\nfocal <- c(\"boy\", \"girl\")\nvecs <- wv_tng[focal, ]\nsims <- sim2(vecs,\
    \ wv_tng, method = \"cosine\")\n\ndf_sims <- data.frame(\n  word1 = sims[1, ],\n\
    \  word2 = sims[2, ],\n  term = colnames(sims)\n)\n```\n```\n\nNow we’ll define\
    \ a new column, “gender_bias,” which is each word’s difference in cosine similarities.\
    \ We’ll also create a column called “gender” which indicates whether the word\
    \ is used in more masculine contexts or more feminine contexts. Then we’ll plot\
    \ the top masculine and top feminine words in Figure 11.6.\n\n```\n```\ndf_plot\
    \ <- df_sims |> \\\\\n  mutate(gender_bias = word1 - word2,\\\\\n         gender\
    \ = ifelse(gender_bias > 0, \"boy\", \"girl\"),\\\\\n         gender_bias = abs(gender_bias)\\\
    \\\n  )\n```\n```\n\n```\n```\ndf_plot |> \\\\\n  group_by(gender) |> \\\\\n \
    \ slice_max(gender_bias, n = 30) |> \\\\\n  mutate(term = fct_reorder(term, gender\
    \ bias)) |> \\\\\n  ggplot(aes(term, gender_bias, fill = gender, label = term))\
    \ +\\\\\n  geom_col() +\\\\\n  coord_flip() +\\\\\n  facet_wrap(~gender, scale\
    \ = \"free\")\n```\n```\n\nAmong other things, leadership words (leader, certain,\
    \ integrity) are more associated with “boy,” and vulnerability words (prisoner,\
    \ confined, asylum) are more associated with “girl.” We’ll return to this idea\
    \ of exploring how contexts vary along sociologically interesting dimensions later\
    \ in the chapter when we discuss how we might carry out inductive analyses with\
    \ word embeddings."
