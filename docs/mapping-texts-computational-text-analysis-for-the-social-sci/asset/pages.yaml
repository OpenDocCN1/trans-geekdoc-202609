    34 This uses `split_tokens()` to tokenize before applying the lemmatizer. This
    function first removes all capitalization and disambiguates between words and
    punctuation flush against the words. Be mindful when using a tokenizer or lemmatizer
    that does not do these things.


    35 Related, lemmatizing does not replace contractions; for this, we can use `replace_contraction()`
    .


    `lemmatize_words()` uses a lookup procedure to match tokens to their lemma and
    then replace that token with that lemma. Let''s find the assorted tokens associated
    with the “be” lemma in the Měchura dictionary (see the marginal note).


    ```

    filter(hash_lemmas, lemma == "be")

    ```


    All these tokens are lemmatized to the same lemma—that''s exactly what we want!
    Now let''s lemmatize a whole document using the excerpt from Durkheim (1895) using
    `lemmatize_strings()`. 34


    ```

    lemmatize_strings(docs, dictionary = hash_lemmas)

    ```


    ```

    [1] "society be not the mere sum of individual"

    [2] "the system form by their association"

    [3] "it be from this combination that social life arise"

    [4] "individual give birth to a be"

    ```


    Let''s incorporate lemmatizing into the wrangling workflow we just discussed using
    the *Star Trek: The Next Generation* corpus.


    ```

    data("corpus_tng_season5", package = "text2map.corpora")

    df_trek <- corpus_tng_season5 |

    filter(!is.na(line)) |

    select(number, title, airdate, character, line)

    ```


    ```

    df_trek <- df_trek |

    mutate(

    lemma = tolower(line),

    lemma = gsub("[[:digit:]]+", " ", lemma),

    lemma = lemmatize_strings(lemma, dictionary = hash_lemmas),

    lemma = gsub("[[:punct:]]+", " ", lemma),

    lemma = gsub("[[:space:]]+", " ", lemma),

    lemma = trimws(lemma)

    )

    ```


    Now we see how line #17 looks with lemmatizing:


    ```

    df_trek$lemma[17]

    ```


    ```

    "captain s log startdate we have arrive at starbase

    two thirty four where i have take the opportunity

    to make a proposal to fleet admiral shanthi"

    ```


    In addition to lemmatizing, we removed capitalization, numbers, punctuation, and
    excess whitespace. Lemmatizing, unlike stemming, does not automatically remove
    -''s (denoting possession)—for example, -''s in “captain’s”. `gsub()` removed
    _all_ punctuation, replacing it with a space.


    There''s multiple ways we can avoid getting "captain s" here. We could retain
    all punctuation between word characters, remove all instances of -''s, or remove
    tokens consisting of only one character.35


    Using our preprocessed and lemmatized lines, let''s create a DTM and remove words
    from the Snowball stoplist.'
