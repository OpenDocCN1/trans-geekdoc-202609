  md: 'generate revenue, etc. Ready-made texts tend to evoke a different set of selection
    biases: what is available is, typically, *all that is available*. In other words,
    “the data are already in” (Martin 2017:194).13 We must theorize audiences—and
    the authors’ assumptions about their audiences—when making our selection. Authors
    are producing texts *for someone* and this shapes the meanings in those texts.


    13 Some argue this mitigates desirability bias. This is true regarding the researchers’
    desires, but not the audiences’.


    # Time and Location


    14 This is called diachronic analysis. If a corpus is continually updated, this
    is called a **monitor corpus**.


    A recurring question for text analysis is: How do textual variables change over
    time?14 As in the study of “cognitive distortions” discussed earlier, we must
    be mindful of how text’s internal *and* external properties may change. Commenting
    on an initial study of cultural change using the Google Books corpus, Schwartz
    (2011) remarks: “If the fossil record shows more dinosaur footprints in one period
    than another, it does not necessarily mean that there were more dinosaurs—it may
    be that there was more mud.”


    Focusing on a specific time, as many corpora implicitly do, does not solve this
    issue. Some phrases may be especially common or uncommon in a given year, but
    this may or may not be unique to that year. Such problems plague the use of “generations”
    in studies of social change. How one sets the cutoffs may change the findings.


    These concerns are paralleled when considering the locations from which texts
    are produced. Moving from the roughly one billion Anglophones worldwide—those
    who inhabit India, New Zealand, South Africa, Barbados, Canada, the United Kingdom,
    etc.—to the English spoken in only Australia systematically increases homogeneity.
    Taking the whole Anglophone world, we may find some phrases are over-represented
    precisely because specific locations produce (or maintain) the bulk of the texts.


    # Domains and Media


    Each piece of text is produced within a broad social domain and through a given
    form of media. Using domain and media as principles of variation means being oriented
    toward the social activity involved in the production and maintenance of the text,
    as well as the affordances offered by different avenues of communication.


    Is the speech originally spoken, but then transcribed? Was the written text in
    a book or a newspaper? An email or a text message? Was the document intended for
    public consumption or personal uses'
