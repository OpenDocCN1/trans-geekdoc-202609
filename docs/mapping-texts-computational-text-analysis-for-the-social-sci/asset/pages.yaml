  md: '2 The weights in, for example, a precompiled sentiment dictionary form a simple
    “model,” but we don’t call it “learning” because the weights were assigned by
    people, and not “statistically learned” from the data.


    dictionary methods. By matching terms in our dictionary to terms in our documents,
    we can assign labels to documents.² Here, we’ll also discuss using pretrained
    models to augment these basic dictionary methods.


    Whether labels are used explicitly in the model training process, labels are often
    still used in the validation step. Our process will associate labels to documents
    even if the results are nonsense. Regardless of the specifics, our goal is to
    ensure that pairing a document with a label would make sense to a human rater.
    There will always be some “error.” And, we wouldn’t even expect agreement across
    all human raters all the time. Accepting that, we still hope there is face validity
    to how our classifier assigns labels to documents and does so better than chance.


    # Representing Objects as Features


    We’ll discuss a range of document classifiers falling under the label “machine
    learning” or “statistical learning” (Vapnik 1998). These methods begin by representing
    the objects to be classified by a set of “features.” Consider a simple image classification
    task. Let’s use the Fashion-MNIST Dataset, several thousand greyscale images labeled
    as one of ten clothing items.


    Figure 12.1: Images as Feature Matrices.


    ![](img/ccc0ce559da97114ef913045f55e3801_237_0.png)


    Each fashion item is a greyscale image loaded as a matrix (see Figure 12.1). Each
    cell identifies a “pixel” in our image. The number in the cell is the color along
    the greyscale spectrum, with higher numbers being closer to black. Next, we “unroll”
    that matrix into a long string, where each column is now a unique row-column from
    the original matrix. Our basic greyscale image becomes a feature vector. Each
    image is a 28 by 28 matrix and becomes a vector with 784 numbers. If we stacked
    those vectors, we’d have an image-feature matrix.'
