- pgno: 15
  md: 'speak, write, and gesture. There is no sufficient set of rules that speakers
    must follow (Fillmore 1979; Bauer 1998). The divisions between styles, accents,
    dialects, and languages are always drifting.


    Sixth, **language is a field**. Language is organized and patterned, and so scholars
    commonly describe language as a “system.” But, “system” connotes an autonomous
    set of arranged parts where change is internal: altering one part alters all parts.⁵
    While it is true that language is patterned, has regularities, and may even have
    internal sources of change, language is “too unwieldy to be understood directly
    as a whole” (Di Paolo et al. 2018:106). Understanding language as a field—an organized
    yet open-ended structure—better captures both the regularities and dynamics inherent
    in speaking and writing.


    ⁵ The linguist Ferdinand de Saussure, for example, asserted that language is a
    “self-contained whole” and “everything that changes the system in any way is internal”
    (Saussure 1986:23).


    The preceding propositions have implications for how we think about the boundaries
    of language. No sample of language, no matter how large, is ever a self-contained
    whole. No language change is wholly instigated by internal mechanisms. Meaning
    is not constituted solely by relations between words or other linguistic units.
    There is no necessarily correct instance of language use. No crisp set of linguistic
    rules sufficiently explains all patterns in language data. All this complexity
    makes carrying out a text analysis more difficult. Still, by thinking through
    each step and documenting our decisions clearly, we can contribute to the scholarly
    understanding of language and its role in social life.


    ⁶ For this book, we are not dealing with meaningful content which may accompany
    context, for example, diagrams or pictures (Prior 2003; Bauer and Gaskell 2000).


    # WHAT IS TEXT?


    Writing is a subset of language. Like speaking or gesturing, it is an attempt
    to associate a perceptible form with meanings such that, through it, a writer’s
    intentions are communicated to a reader, even when the writer is absent.⁶ Here,
    we attempt to “bound” our object of investigation further by outlining five propositions
    about written text.


    ⁷ Characters are often associated with speech sounds, with varying degrees of
    refinement (Daniels and Bright 1996; Okrent 2021). The “International Phonetic
    Alphabet” aims for maximum fidelity to articulation. Specialized systems for capturing
    prosody also exist (Jefferson and Others 2004). While sound shapes language (e.g.,
    Hinton et al. 2006), we’ll presume characters do not necessarily represent sound.


    First, **texts are a set of characters**. That text can be segmented is a precondition
    of computer-assisted text analysis (c.f. Aronoff 1992)⁷ — numerals, alphabets,
    abjads, logographics, alphasyllabaries, syllabaries, punctuation, diacritics,
    and even spaces or other word dividers. These characters are not abstractions
    but perceptible through sight and touch. A writer arranges this set so a reader
    could, more or less, recover meaning—provided that the writer generally follows
    conventions familiar to the reader. That text comprises a relatively finite set
    of re-arrangeable characters is a minimal assumption in contemporary text analysis.


    Second, **texts re-present**. “The ethnographer,” Geertz (1973:19) tells us, “inscribes”
    social activity and “turns it from a passing event . . . into an'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'account, which exists in its inscriptions and can be consulted.”8 Interview
    researchers, similarly, transcribe their analytic conversations with participants.
    Speeches, music lyrics, dictated instructions, or recorded meetings may also be
    transformed from sound into writing. Writing is an attempt to capture an event,
    and text is the means through which such occurrences are captured. Text does re-present
    other modes of communication, mediums of perception and expression, or even thoughts.


    8 Verba volant, scripta manent


    Third, texts are language. Speaking likely preceded writing. This prompted the
    linguist Leonard Bloomfield to assert: “Writing is not language, but merely a
    way of recording language” (Bloomfield 1933:21; see also Saussure 1986:23). Those
    inspired by the linguist Noam Chomsky go further by presuming both speaking and
    writing are simply reflections of language in the mind (c.f. Aronoff 1992). True,
    writing does record speech and thought, but it does not only record. The written
    word also has its own norms, intents, and constraints—which shape other modes
    of communication, our minds, and our very theories of language (Ong 2013; Olson
    1996; Coulamas 2003).


    > “Everything not saved will be lost.”—Nintendo ‘Quit Screen’ Message.


    Fourth, texts are durable and decay. Text is an attempt to fix the fleeting; it
    is durable. Yet, no text is indestructible; it decays.9 We can only analyze what
    is preserved, and “all other things equal, selectivity increases with the age
    of documents” (Martin 2017). We are only privy to a small portion of these ancient
    texts and thus the range of meanings within these communities. This remains true
    in the digital age, with “bitrot” an ever-present concern and texts easily deleted
    with a few keystrokes or perhaps irreversibly encrypted. More troubling for the
    social scientist, text is not lost and preserved at random (e.g., King et al.
    2013). This means we must theorize the political and organizational projects that
    shape access to texts to accurately interpret those texts (Brown et al. 2016).


    9 Consider, for example, the origins of writing such as the Jiahhu bone inscriptions,
    the tattoos on the mummified Ötzi, the Vinča symbols on pottery, or the cuneiform
    clay tablets of ancient Uruk.


    Fifth, texts are objects. Texts are objects because they are durable and decay,
    but also because they are produced and maintained (Prior 2003). Whenever we encounter
    a text, an interconnected network of people, groups, organizations and other texts
    are all implicated. For example, the novel is produced and distributed by an author,
    but also literary agents, publishers, editors, book stores, book clubs, critics,
    etc. (Childress 2017).


    Taken together, with our working theory of language, the above five propositions
    have important implications for the first step in any text analysis: selection.
    We can never study the entire population of any language, as text or otherwise.
    We’ll always—intentionally or not—study a subset of all the texts that could be
    studied. Being principled about selection is essential for rigorous and reproducible
    text analysis.'
