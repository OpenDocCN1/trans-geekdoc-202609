  md: 'these fundamental meanings? The cornerstone of this approach is the study of
    word norms in general, and Osgood and colleagues'' semantic differential method
    in particular.


    In the early 20th century, the idea that attitudes could be measured along a single
    spectrum was central to several methodological innovations. Here, respondents
    are presented with a series of statements about a topic or object. They then indicate
    how favorable or unfavorable they find the statement along a numerical scale.
    A respondent''s answers are then aggregated to arrive at a summary attitude about
    the topic or object.


    For example, using 256 words drawn from Thorndike''s (1921) The Teacher''s Word
    Book, Charles Mosier (1941:125–7) “presented [them] to subjects for their judgments
    as to the degree of favorableness or unfavorableness” with 11 being the most favorable
    and 1 being the least. The “subjects” were undergraduate “students in introductory
    and second courses in psychology.” Each word had around 140 “judges.” Mosier discovered
    that the rankings of most words were linear enough to be placed on a single-dimensional
    scale, defining “completely unsatisfactory” as zero (see Table 9.3).16


    16 What Mosier is presenting is one of the first examples of a weighted sentiment
    dictionary and possibly the first weighted dictionary.


    # Table 9.3: Terms in Mosier''s Favorableness Scale


    | Term | Scale Value |

    | --- | --- |

    | completely unsatisfactory | 0.00 |

    | repulsive | 0.50 |

    | disgraceful | 1.00 |

    | wrong | 1.50 |

    | unnecessary | 2.00 |

    | disputable | 2.36 |

    | excusable | 2.85 |

    | average | 3.08 |

    | pardonable | 3.48 |

    | comfortable | 4.04 |

    | desirable | 4.50 |

    | highly agreeable | 5.02 |

    | diving | 5.50 |

    | very, very desirable | 5.66 |


    Mosier selected words explicitly about judgment. Osgood''s insight was to generalize
    this: unlike some theoretical constructs which may be “distributed along a single
    continuum ... we accept at the outset that meanings vary in some unknown number
    of dimensions” (1952:222). In one study, for example, Osgood found that nearly
    all subjects associated “large” with “loud,” “near” with “fast,”'
