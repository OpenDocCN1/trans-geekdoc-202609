    \ favorable terms while perpetuating racialized stereotypes about immigrants.64\n\
    \nRelated to the semantic direction is the *semantic centroid*. A centroid is\
    \ an averaged vector.65 Semantic centroids are useful on their own if we want\
    \ to know what the discursive context of some domain of interest is, rather than\
    \ the context of that domain *relative* to another (which is what we get with\
    \ directions). For example, we may want to know the general context in which “immigration”\
    \ is discussed — not *relative* to how “citizenship” is discussed. Nelson (2021b),\
    \ for instance, uses semantic centroids in her analysis of the *intersection*\
    \ of social categories of people across institutional spheres in first-person\
    \ narratives in the 19th-century US South, and Lix and colleagues (2022) also\
    \ used centroids to study how discursive diversity impacts the work performance\
    \ of remote software development teams.\n\nLet’s use `get_centroid()` to see the\
    \ terms most similar to an “immigration” centroid.66\n\n64 For research on the\
    \ association between Blackness and immigration in US discourse, see Mora and\
    \ Paschel (2020).\n\n65 This is what we’d get with the pooled method for vector\
    \ offsetting but before taking the difference between our two average vectors.\
    \ This is also one strategy for creating sentence embeddings.\n\n66 The centroid\
    \ is labeled with the first word in the anchor list followed by “_centroid.”"
