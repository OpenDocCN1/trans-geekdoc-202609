- pgno: 199
  md: '# 11


    Extended Inductive


    INDUCTIVE analysis entails finding *latent* groupings of texts (or text units)
    or relations between texts (or text units) without preconceived notions about
    those groupings or relations. This chapter continues down this path. In the following
    chapters, we extend our core methods and combine them in complex ways.


    We''ll return to topic modeling but focus on estimating how topic *engagement*
    and *content* vary by other covariates. For example, how have the topics covered
    in *The Washington Post* changed in the last decade? We''ll also extend the term
    similarity measures discussed in **Text to Numbers** with **word embeddings**.
    We''ll see that embeddings are flexible tools for finding relations between words
    and documents and mapping semantic changes. For example, how have authors used
    the “network” metaphor differently over two centuries (Yung 2021)?


    # INFERENCE AND TOPIC MODELS


    THIS SECTION NEEDS:


    +   - tidyverse

    +   - broom

    +   - marginaleffects


    # Predicting Topics with Covariates


    In this section, we’ll cover a few ways researchers might include covariates (or
    “predictors,” or “independent variables”) into their topic model analysis.


    We’ve done all the work to get our topics. We’ve chosen an algorithm— LDA, or
    perhaps something like CTM (Blei and Lafferty 2007), or maybe the biterm topic
    model for short texts (Yan et al. 2013) or one that allows us to supply keywords
    (Eshima et al. 2020). We’ve run the model with different *k*, comparing fit statistics
    across solutions. We’ve interpreted the topics. Now what? We can treat these topics
    like any other variable.


    We can see how topics may shape other factors. For instance, we might test the
    effects of positive tax news from US presidential communications on private consumption
    and investment (Dybowski and Adämmer 2018). We can also see how other factors
    may shape topics. For example, we can use transcripts from Federal Open Market
    Committee meetings to assess if speakers with private banking experience were
    more likely to discuss finance (Fligstein et al. 2017).'
  merge: -1
  img_proc: true
- pgno: 200
  md: "Remember topic modeling results in two probability matrices: a document-topic\
    \ matrix that shows the probability of documents across topics and a topic-word\
    \ matrix that shows the probability of topics across the vocabulary. We assume\
    \ most covariates are at the document or author level, so we'll focus on the document-topic\
    \ probabilities.\n\nLet's explore a topic model on English-language fiction between\
    \ 1880 to 1999,¹ estimated by Underwood and colleagues (2022). This study considers\
    \ the extent changes in culture are explained by “period”—for example, the culture\
    \ of the 1980s—versus “cohort”—for example, those born in the 1980s. Their model\
    \ includes 200 topics,² and each work has covariates such as first publication\
    \ date and whether that author is/was American.\n\nThe topics were estimated for\
    \ chunks of each work: each volume spans multiple rows, with each row corresponding\
    \ to a (roughly) 10,000-word chunk. For the sake of space, we only include a subset.\
    \ Instead of a random sample of rows, we randomly sample 1,000 unique works.\n\
    \nThe supplementary file for the study contains the labels and keywords for each\
    \ of the 200 topics. We'll focus on one topic—topic #3, labeled “late-20th-century\
    \ US political thrillers.” Higher probabilities for this topic indicate a work\
    \ is more likely to be in the US political thriller genre.\n\nSay we want to assess\
    \ time trends for this topic. Are newer or older works in the corpus more likely\
    \ to be a (or written like) late-20th-century US political thrillers? Or, maybe\
    \ we want to know whether author demographics are associated with this topic?\
    \ Perhaps American authors are more likely to write on this topic than authors\
    \ from elsewhere. Lastly, since some works exist in the “gray area” between fiction\
    \ and nonfiction (Underwood et al. 2020:7), are works in this gray area more likely\
    \ to be in this topic than in others? Let's investigate these questions now.\n\
    \nLet's run an OLS regression with this topic as the outcome.³ The predictors\
    \ are the (1) date of first publication, a (2) dichotomous variable for whether\
    \ the author is/was American (“False” or “True”), and the (3) probability the\
    \ work was nonfiction. The topic of interest is “V6.” For the date, we'll allow\
    \ the magnitude and/or direction to be nonlinear by adding a quadratic term (\
    \ poly(firstpub, 2) ).\n\n```\ndata(\"stm_fiction_cohort\", package=\"text2map.pretrained\"\
    )\nstm_fic <- stm_fiction_cohort |>\n  mutate(us_national = factor(us_national))\n\
    lm(V6 ~ poly(firstpub, 2) + nonficprob + us_national,\n   data = stm_fic) |> tidy()\n\
