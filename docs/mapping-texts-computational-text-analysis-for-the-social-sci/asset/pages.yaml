    # PART-OF-SPEECH AND DEPENDENCY PARSING


    Many methods rely on “bags-of-words” representations of documents (i.e., a DTM).
    An assumption behind these sorts of models is that outside of some measure of
    word co-occurrence, the order of words within a document does not matter. Similarly,
    in “bags-of-words” approaches, the syntactical structure (i.e., grammar) of the
    documents does not matter.


    Researchers may, however, need to know something about grammar—16 Klebanov and
    colleagues (2008), for example, coded the verbs, nouns, adjectives, adverbs, and
    proper names in their analysis of Margaret Thatcher’s rhetorical style using her
    1977 speech at the Conservative Party Conference. Graesser and colleagues (2006)
    used parts of speech to identify complex syntax in survey questions. Diemeier
    and colleagues (2012:44) used parts of speech in US congressional speeches to
    disambiguate between word senses and how they predict senators’ ideological positioning
    (where, e.g., taxing as a verb was predictive of conservative speech, but not
    tax as a noun). In addition to using parts of speech, these studies share another
    thing in common: they each used an automated part-of-speech tagger to do so. Part-of-speech
    (POS)'
