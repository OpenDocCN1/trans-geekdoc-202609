    \ CBOW, SNGS, and fastText\n\nWhile word2vec did not introduce using neural networks41\
    \ to create embeddings, it is one of the most popular methods. Like GloVe, word2vec\
    \ learns reduced representations of term-co-occurrences to predict one of two\
    \ objectives.\n\nWith Continuous Bag-of-Words (CBOW), the model predicts the target\
    \ word given a context word. With the Continuous Skip-Gram, the model tries to\
    \ predict a context word given a target word. The developers note CBOW is faster,\
    \ while Skip-Gram is better for infrequent words. More technically, both maximize\
    \ the average log-probability of a target"
