    | 2: abandon | -0.75 |

    | 3: abandoned | -0.50 |

    | 4: abandoner | -0.25 |

    | 5: abandonmment | -0.25 |

    | 6: abandons | -1.00 |


    Given the expectation that sentiment varies through longer texts (e.g., in a political
    speech, the orator may move from anger or fear to end on joy and hope), it is
    generally understood that scores should be assigned to chunks smaller than a paragraph—such
    as a sentence or a tweet.19 For instance, consider a quote from a real positive
    guy, Mr. Rogers: “Taking care is one way to show your love” (output in the margin).


