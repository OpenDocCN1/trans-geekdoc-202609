  md: "# 4 Math Basics\n\n> Mathematics compares the most diverse phenomena and discovers\
    \ the secret analogies that unite them\n> —J. Fourier\n\nCOMPUTATIONAL text analysis\
    \ involves math. No surprises there! Luckily, a little math goes a long way. Below\
    \ is an overview of some mathematical concepts and measures we’ll use.¹ Anyone\
    \ with at least high school math and this chapter should be able to complete the\
    \ analyses in this book. This chapter is an introduction, refresher, and cheatsheet\
    \ we’ll continually reference.\n\n¹ We promised no equations, and we’re sticking\
    \ to it.\n\n# THE FUNDAMENTALS\n\nQuantification begins with the scalar: a single\
    \ number. Integers or “whole numbers” are one kind of scalar, and real numbers\
    \ or “whole numbers with decimals” are another kind of scalar. A vector is a list\
    \ of scalars where the order matters.\n\n```\n## Scalars\n a_int <- 8 # integer\n\
    \ a_real <- 6.5 # real number\n\n ## Vectors\n a_vec <- c(8, 6.5)\n```\n\nAdding\
    \ scalars is as simple as two plus two equals four. When we add vectors, though,\
    \ we have to account for all the numbers and their order (output in margin).\n\
    \n```\n## adding scalars\nscal1 <- 1\nscal2 <- 15\nscal1 + scal2\n```\n\n```\n\
    ## adding vectors\nvec1 <- c(1, 4, 4, 5)\nvec2 <- c(0, 5, 1, 4)\nvec1 + vec2\n\
    ```\n\nWe added the numbers in the same position in each vector. Subtracting vectors\
    \ from vectors works the same. What happens if we add a scalar to a vector? Each\
    \ number in the vector is increased by the amount of the scalar. Subtracting scalars\
    \ from vectors works in the same way."
