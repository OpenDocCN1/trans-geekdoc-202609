    \ = get_stoplist(\"snowball2014\"), dense = TRUE)\n```\n\nNow we need to get our\
    \ document-by-document distance matrix. Let's go with cosine. We'll use dist2().\
    \ 11\n\n11 Similarities are the inverse of distances, so we could use sim2() again\
    \ and then subtract the resulting similarities by 1 to get the cosine distances.\n\
    \n```\ncos_sotu <- dist2(dtm_sotu, method = \"cosine\")\n```\n\nNext, we'll create\
    \ our cluster tree.12 We'll let hcut() know this is a distance matrix with as.dist().\
    \ For our merging criterion, we'll use Ward's method, which we specify with hc_method\
    \ = \"ward.D2\".\n\n12 We'll use factoextra , although there are many packages\
    \ for hierarchical clustering.\n\n```\nhier_sotu <- hcut(as.dist(cos_sotu), hc_method\
    \ = \"ward.D2\")\n```\n\nLet's inspect the tree structure of the hierarchical\
    \ clustering— visualized in the form of a dendrogram. We'll use fviz_dend() for\
    \ this, starting with k = 2.13\n\n13 The cex parameter controls the size of the\
    \ document labels, and horiz turns the plot left to right.\n\n```\nfviz_dend(hier_sotu,\
    \ cex = .5, k = 2, horiz = TRUE,\n          k_colors = c(\"#440154FF\", \"#3ASE8CFF\"\
    ))\n)\n```\n\nFigure 10.1: Dendrogram for Hierarchical Clustering.\n\n# Cluster\
    \ Dendrogram\n\n![](img/ccc0ce559da97114ef913045f55e3801_177_0.png)"
