    means that only a particular set of users can publish their blocks. Permissionless
    blockchain allows anyone to publish (read/write) a new block without any authorization.
    For example, a permitted blockchain is similar to a controlled corporate intranet,
    whereas a permissionless blockchain is similar to the public Internet which permits
    anyone to participate.


    # 1.3.1.1 Permitted Blockchain


