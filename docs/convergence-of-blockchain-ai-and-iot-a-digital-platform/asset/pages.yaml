    # 3.2 Anomaly Detection of Trained Sensor Data Using the SVM and PCA Mechanism


    Anomaly detection is an important research topic in data mining and machine learning.
    Anomaly detection refers to the problem of finding patterns in data that do not
    conform to expected behavior. These nonconforming patterns are referred to as
    anomalies, outliers, discordant observations, exceptions, aberrations, peculiarities,
    contaminants in different application domains. Anomaly detection finds extensive
    use in various applications such as fraud detection for credit cards, insurance
    or health care, intrusion detection for cybersecurity, fault detection in safety-critical
    systems and military surveillance of enemy activities [5].


    However, most anomaly detection methods are typically implemented in batch mode
    and cannot be easily extended to large-scale problems without sacrificing computation
    and memory requirements. The existing methods include normal data with multicustering
    structure and in a higher-dimensional space. It is typically not easy for the
    former case to use linear models as PCA to estimate the data distribution if there
    are multiple clusters present. Moreover, many learning algorithms encounter the
    “curse of dimensionality” problem in a highly high-dimensional space. Although
    handling high-dimensional data does not need to compute or keep the covariance
    matrix, PCA might not be preferable in estimating the principal directions for
    such kinds of data.'
