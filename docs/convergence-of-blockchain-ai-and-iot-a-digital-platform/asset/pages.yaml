  md: '# 2 Basic Fundamentals of the Internet of Things, Artificial Intelligence and
    Blockchain


    The entities in the Internet of Things (IoT) require diverse sets of standards
    and protocols to enable communication over a network. The communication technologies
    include RFID (radio frequency identification), NFC (nearfield communication),
    Bluetooth, Zigbee, Wi-Fi, etc. and are for short-, medium- and long-range communication.
    The architectural framework integrates components for their seamless cooperation
    among each other to solve complex tasks. AI systems are capable of learning which
    facilitates improvements of their performance over time. AI include machine learning,
    predictive analysis and deep learning, which increase the ability for learning,
    reasoning, thinking and decision-making. Furthermore, the future predictions for
    AI are explored in depth and potential solutions are recommended to solve the
    problems faced in the coming decades. Blockchain is an open-source hyperledger
    to track the provenance of different items in many sectors such as healthcare,
    manufacturing, retail industry, finance and insurance, etc. The convergence of
    these technologies has become vital, beneficial and inevitable in the fourth digital
    revolution.


    # 2.1 Basic Framework and Architecture of the Internet of Things


    The IoT facilitates physical objects to listen, hear, think and perform tasks
    by allowing them to interact with one another, exchange information and make decisions.
    By using primary technologies such as ubiquitous and widespread computing, embedded
    devices, networking technologies, wireless sensor networks (WSNs), IPs and other
    applications, the general IoT transforms these smart things from conventional
    to smart. Domain-specific applications (vertical markets) are made up of smart
    objects and their supposed functionalities, whereas domain-independent applications
    are made up of ubiquitous computing and analytical services (horizontal markets).
    In that case, if domain-specific IoT application communicates with domain-independent


