    # 6.1.6.12 Centralized Architecture


    As the data in the IoT are stored in a centralized cloud, this makes it easier
    for hackers to intrude into the system and attack the cloud server, which leads
    to loss of the confidentiality, availability and integrity of the data. This can
    be recovered by using the blockchain concept, as there is no centralized system
    in the transmission of data [15].


    # 6.1.6.13 IoT Environment


    The IoT environment is composed of sensors, actuators, embedded devices and servers.
    It collects data from heterogeneous devices, however, as there is no unique mechanism
    for all heterogeneous devices, the major challenging factor is the connection
    between different types of devices, making it difficult to detect any failure
    of a single device from a large number of devices.


    # 6.1.6.14 Scalability


    The primary requirement of an IoT device is to possess scalability as it is a
    collection of heterogeneous devices connected to different individuals, therefore
    it is difficult to obtain the property of scalability [16], and it involves the
    process of handling a large amount of data in a particular network or system.
    It reduces the risks in the IoT and simplifies recording of the environment.


    # 6.1.6.15 Storage Space


    In the IoT data are recorded continuously and stored in the cloud. The data need
    a huge volume for storage. This data may not be essential after a specific duration
    of time. Therefore the cloud service provider manages the server space for the
    future, where the redundant data may be removed with the knowledge of the user.


    # 6.1.6.16 Processing Time


    The main advantage of the IoT is the distance between the user and the IoT environment
    where the user will be able to access the data respective his/her location; if
    the space is nominal, then the access time and notifications will be faster and
    reliable, but the issue arises when the user reaches the maximum limit, which
    may lead to a delay in the processing time of the IoT devices.'
