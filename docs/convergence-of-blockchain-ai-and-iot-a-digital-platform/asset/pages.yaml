    # 6.4.10 Proof of Stake


    Bitcoin uses an enormous amount of energy to secure its network, and mining new
    coins needs a lot of computing power because the proof of work algorithm. Therefore,
    there have to be some other alternatives than cryptocurrency. In 2011, a Bitcoinalk
    user called QantumMechanic proposed a technique called “proof of stake.” The basic
    idea behind stake was that competing against one another with mining is wasteful.
    Instead of this, the proof of stake uses an election process in which only one
    node is randomly chosen to validate the next block. Unlike proof of work, there
    are no miners in proof of stake; instead, they are called validators, and it does
    not let people mine a new block but instead they “mint” or “forge” new block and
    the process is called minting or forging.


    To become a validator, one node has to deposit several coins in the network as
    a security deposit. The size of the stake determines the chances of a validator
    being chosen to forge the next block. Although this might not look fair because
    electing a validator the rich, in reality, it is more appropriate as compared
    to proof of work. With proof of work, the affluent users can enjoy the benefits
    and power of economics at scale. The user pays prices for mining equipment and
    the electricity does not go linearly; instead, the more they buy, the better their
    prices. However, in proof of stake, if the node is chosen to validate the next
    block, the user will check if all the transactions are valid. If everything checks
    out, the node signs off on the block and adds it to the blockchain, and as a reward,
    the node will receive the fees associated with each transaction. But now the question
    arises as how the validators can be trusted on the network. That’s where the role
    come in; the validators will lose a part of their stake if they approve any fraudulent
    transaction; as long as the stakes of the validator are higher than what validators
    get from the transaction fees, it would prove that the validators are correctly
    doing their job, and if not they will lose more money compared to what they gain.
    This is a financial motivator and holds up as long as the stakes are higher than
    the sum of all transaction fees. If any node stops being a validator, his stake
    and all the transaction fees that he has received will be released after a certain
    period after discovering some of the blocks were fraudulent.'
