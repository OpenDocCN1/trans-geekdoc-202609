    # 7.2.3 Smart Contract in the Digital World


    One of the key technology innovations of second-generation blockchains has been
    developing what are called smart contracts. A smart contract is a computer code
    stored inside a blockchain that includes the contractual agreements. Smart contracts
    are a self-executable code that comes with the terms of agreement or operation
    directly written in two lines of code stored and executed on a blockchain computer
    [38]. In a traditional sense, a contract is a binding agreement between two or
    more parties to do or not do something. Each party must trust the other parties
    to fill their side of the obligation. They are written or spoken agreement that
    is intended to be enforced by law. An assortment of contractual agreements forms
    the institutional foundations of our modern society and economy, which have evolved
    since ancient times. The economy of any country is a massive set of contracts
    that are created and enforced by a centralized authority, as insurance companies
    and banks, which are again supported by the higher centralized authority in the
    system. Our society and economies are entirely dependent upon third-party organizations
    to maintain and enforce these contractual agreements. Smart contracts feature
    these kinds of deals to act or not act, but they remove the need for the trusted
    third party between the members involved in the arrangements. This is because
    a smart contract is defined by the computer code and executed or enforced without
    discretion at such blockchains. Innovative contract technology can rely on the
    centralized system and enable people to create contractual agreements that can
    be automatically enforced and executed by a computer code. These smart contracts
    are decentralized in they do not exist on a single centralized server but are
    distributed and self-executing across a network of nodes. This means that an untrusted
    third party can trust with each other in a much fluid fashion without depending
    upon the third parties to initiate and maintain the transaction rules.


    Likewise, the smart contract enables autonomy between members that means after
    it is launched and running an agreement in its initiating, agents need not be
    in further contracts. One example of this situation is one in which four people
    are pooling their money to invest in something that will return interest to them.
    A smart contract could be programmed on the blockchain to take any claim created
    divided into four and send each amount to the corresponding wallets of the different
    stakeholders. A smart contract is'
