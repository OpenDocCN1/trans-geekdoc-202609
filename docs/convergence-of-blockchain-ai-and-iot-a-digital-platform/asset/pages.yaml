- pgno: 13
  md: '# # Preface


    The world is growing with technological and scientific developments which provide
    intense benefits in human quality of life and economic growth. The availability
    and manipulation of data is a crucial area. The three main aspects in data science,
    blockchain, IoT and artificial intelligence, are combined with different aspects
    which shows similarities when we focus more deeply. Convergence of Blockchain,
    AI and IoT. Digital Platform discusses a transformation in the digital world to
    a new revolution in the computing world.


    At its core, the optimization of the Internet of Things with its resilience and
    reliability mechanisms is discussed in this book The deep brain mechanism involved
    in this book discusses the next-generation innovation in industrial aspects of
    the blockchain mechanism. With the convergence of these three technologies will
    enhance economic growth with digital currency and clinical diagnosis. This book
    also enhances strategic technological trends through spectrum computing and smart
    contract techniques The swarm intelligent mechanism described in this book provides
    a diversion to artificial intelligence towards blockchain. The key concepts of
    this book will provide a futuristic overview towards the reader about the new
    technologies and their combination with realistic nature in a wider sense in this
    digital world.


    This book is categorized into seven general areas:


    +   1: Optimization of the IoT through Artificial Intelligence

    2: Fundamentals of the IoT, AI and Blockchain

    3: Transformation of Artificial Intelligence towards the IoT

    4: Transformation of Artificial Intelligence towards Blockchain

    5: Technological Transformation of the IoT towards Blockchain

    6: Futuristic approach to the IoT, AI and Blockchain

    7: Revolutionary Aspects in the Digital World'
  merge: -1
  img_proc: true
