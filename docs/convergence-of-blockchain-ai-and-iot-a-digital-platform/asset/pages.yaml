    is one technology that is becoming increasingly popular. This technology is providing
    services to the community in tracking and analyzing data and resources. However,
    as with any new technology, there are some associated challenges which may cause
    some organizations not to implement it in their business.


    # 7.1.10 Security


    IoT technology deals in data collection, and all data collection technology comes
    with security threats; these security threats can be hazardous, whether from a
    nation or a cyber-gang. Hackers attempt to find out and hack data like sensitive
    and insecure. like healthcare data needs greater protection from various risks.
    Cloud computing could be one option to the data collected by IoT devices. Cloud
    computing could protect data to some extent, but both cloud computing and the
    IoT are not easy for new users.


    # 7.1.11 Integration


    Integration of IoT devices with other systems is a challenge and may become complicated.
    Integration of the IoT includes IoT devices, data integration, back-end systems
    and sometimes third-party middleware. Therefore, implementation and integration
    of the IoT with other system may be extremely difficult. To deal with these complications,
    organizations have been using different methods to add sensors and cameras into
