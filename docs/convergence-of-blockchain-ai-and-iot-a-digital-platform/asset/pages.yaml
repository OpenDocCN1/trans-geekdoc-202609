    services, sensors and actuators in each domain interact directly with one another.
    Further, the IoT is anticipated to have substantial commercial applications in
    the future, leading to enhanced quality of life and global economic development.
    Smart homes, for example, would allow residents to unlock their garage doors when
    they arrive home, make coffee, and control TVs, automated climate control and
    other appliances.


    Emerging technologies and developments, as well as service implementations, must
    expand proportionately to market demands and consumer needs in order to realize
    the capacity for rapid growth. Furthermore, devices must be designed to meet consumer
    demands for accessibility anywhere and at any time. To obtain compatibility among
    heterogeneous objects during communication, new protocols are also required (living
    beings, goods, phones, automated vehicles, appliances, etc.). Furthermore, standard
    architecture can be seen as a spine for the IoT, allowing businesses to compete
    by delivering high-quality products.


    Moreover, conventional Internet architecture must be updated to meet the IoT challenges.
    Many underlying protocols, for example, should take into account where immense
    number of objects are ready to link to the Internet. In 2010, the number of Internet-linked
    smart objects overtook the global human population. As to satisfy consumer demands
    for smart objects, a wide address space (e.g., IPv6) is required. Because of the
    inherent heterogeneity of smart objects and the capability to track and manipulate
    physical entities, security and privacy are the most important criteria for IoT
    systems. Furthermore, IoT systems should be managed and controlled so as to guarantee
    that high-quality services are provided to consumers at less cost.


    # 2.1 Basic Components of the IoT System


    Recognizing the IoT basic building components will assist in achieving a better
