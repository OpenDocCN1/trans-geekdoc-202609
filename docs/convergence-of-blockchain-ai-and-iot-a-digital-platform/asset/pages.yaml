    # 2.1.1.5 Services


    Generally, IoT services can be characterized into four categories: (a) identity-related
    services, (b) information aggregation services, (c) collaborative-aware services
    and (d) ubiquitous services.


    +   - Identity-based services are the significant primary services that are exploited
    in various kinds of services. Any application that desires to carry real-world
    objects into the virtual world must find them initially.


    +   - Information-aggregation services gather and review the sensory measurements
    which are required in IoT applications.


    +   - Collaborative-aware services are mostly functioned on the top-level of information-aggregation
    services; the obtained data are used for efficient decision-making and act accordingly.


    +   - Ubiquitous services, on the other hand, focus on delivering collaborative-aware
    services to everyone, anywhere, at any time. Several IoT applications strive to
    achieve the status of ubiquitous services as their ultimate target.


    The information-aggregation category includes smart healthcare and smart grids,
    while the collaborative-aware type includes smart buildings, smart homes, industrial
    automation and intelligent transportation networks (ITNs).


    Smart home IoT services enable people''s lives by making it simpler and more convenient
    to remotely track and control home appliances and devices (such as heating systems,
    energy consumption meters, air conditioners, etc.). For example, with weather
    forecasting applications, a smart home can automatically close the windows and
    lower the shutters of upstairs windows. Smart homes interact with both the internal
    and external surroundings on a regular basis. The internal atmosphere may include
    even devices and appliances which are connected to the Internet, whereas the external
    atmosphere might have objects that will not be the smart home control, such as
    smart grid entities.


    Building automation systems (BAS) are connected to the Internet in smart buildings.
    A BAS enables the control and management of various devices including HVAC, safety,
    security, lighting and shading, and entertainment, with the help of sensors and
    actuators. BAS may result in the reduction of energy consumption and building
    maintenance costs. For instance, a cooling/heating system or a blinking dishwasher
    may provide an alarm if there is an issue that needs to be investigated and resolved.
