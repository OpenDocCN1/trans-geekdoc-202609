    # 1.2.2 Building Blocks of Artificial Intelligence


    There are in all building blocks of AI that are necessary in the process of designing
    and assembling of any AI system. Any AI system that is created always possesses
    the basic functionality and building blocks the system is often modified by companies
    in order to customize the system to their specific needs. A simple AI system could
