    below.


    # 1.2.2.1 Knowledge Engineering


    Knowledge engineering (KE) refers to all technical, scientific and social aspects
    involved in building, maintaining and using knowledge-based systems [8]. One of
    the first examples of an expert system was Meissen, an application to perform
    medical diagnoses. In the Meissen system the domain experts were medical doctors
    and the knowledge represented their expertise and diagnosis. Expert systems were
    first developed in artificial intelligence laboratories as an attempt to understand
    complex human decision-making based on positive results from these initial prototypes
    [9]. The technology was adopted by the US business community and later worldwide
    in the 1980s. The Stanford heuristic programming projects were led by Edward Feigenbaum,
    who was one of the leaders in defining and developing the first expert systems.
    In the early days of expert systems there was little or no formal process for
    the creation of the software. Researchers sat down with domain experts and started
    programming, often developing the required tools, for example, inference engines,
    at the same time as the applications themselves. As expert systems moved from
    academic prototypes to business systems it was realized that a methodology was
    required to bring predictability and control to the process of building the There
    were two approaches that were attempted, the first was to use conventional software
    development methodologies and the second was to develop special methodologies
    tuned to the requirements of building expert systems. Many of the early expert
    systems were developed by large consulting and system integration firms, such
    as Anderson consulting. These firms already had well-tested conventional waterfall
