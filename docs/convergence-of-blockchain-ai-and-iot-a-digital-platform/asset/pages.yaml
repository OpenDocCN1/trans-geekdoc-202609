- pgno: 54
  md: '# 38 Convergence of Blockchain, AI and IoT


    temperature, vibration, humidity, etc. [1]. The perception layer uses the standardized
    plug-and-play mechanisms to configure the objects which are heterogeneous. Also,
    the perception layer transmits data to the next layer, called the object abstraction
    layer. Moreover, the generation of big data by IoT devices is initiated in this
    layer.


    # 2.1.2.2 Object Abstraction Layer


    Object abstraction uses safe channels to transfer data from the previous layer
    to the next layer, the service management layer. RFID, Bluetooth Low Energy (BLE),
    Wi-Fi, UMTS, GSM, 3G, ZigBee, infrared and other communication technologies can
    be used to transmit data. Furthermore, other functionalities, such as cloud storage,
    data management, etc. are also managed at this object abstraction layer.


    # 2.1.2.3 Middleware/Service Management Layer


    The middleware/service management layer matches a service with the details of
    the requester using names and addresses. Also, the middleware layer allows programmers
    to proceed with their tasks with a variety of heterogeneous entities without exploiting
    any particular hardware platform. Furthermore, this middleware layer also receives
    data, processes them by making an efficient decision, and delivers the desired
    services with the support of network communication protocols.


    # 2.1.2.4 Application Layer


    Customers request services, which are generally offered by the application layer.
    For example, this layer will provide air humidity and temperature measurements
    to a customer who requests them. This layer is essential for the IoT system since
    it can deliver high-quality services in order to satisfy customer requirements.
    Smart building, smart healthcare, industrial automation and transportation, smart
    home, etc. are some of the significant vertical markets covered by this layer.


    # 2.1.2.5 Business/Management Layer


    The operations and department services of the complete IoT system are controlled
    by the management layer. Also, this business layer’s responsibility include creating
    a business model, graphs, flowcharts and visual representations of the data obtained
    from the previous layer. Moreover, it is also responsible for the design, analysis,
    implementation, evaluation, monitoring and development of IoT device components.
    In general, this layer enables decision-making processes based on big data analysis
