    measured until a highly effective output is received. Another form is generalized
    AI, which is implemented in robots where there is a pre- input to the system and
    predefined outputs, and the generalized AI doesn''t vary too much.


    # 7.1.5 Internet of Things (IoT)


    The Internet of Things, or IoT, is influencing our lifestyle, in the form of how
    we react to our behavior. These devices vary from air conditioners that we can
    be controlled with a smartphone of any user, smart cars for providing the shortest
    routes, or a smartwatch that can be used for tracking the daily activity of a
    person. The IoT is a giant network with connected devices. These devices share
    the data about how they are used and the environment in which they are operated.
    All this is done by the sensors embedded in every physical device, be it a mobile
    phone or an electrical appliance, bar code sensor, traffic lights, whatever that
    comes in our day-to-day life. Sensors continuously emit data about the state of
    devices. The question may arise about how the sensors can share this massive amount
    of data and how the data can be put to good use. The IoT provides a common platform
    for all these devices to dump their data, and with a common language, all the
    devices are communicate with each other [14]. Data are emitted from various sources
    and sent to the IoT platform for security. The IoT platform integrates the collected
    data from multiple sources, other analytics are performed on the collected data,
    and the valuable information is extracted as per the requirement. Finally, the
    result is shared with other devices to improve the user experience and efficiency.


    # 7.1.6 Healthcare Using the IoT


    Healthcare is one of the most important areas of any society, with multiple problems
    being faced. Doctors find it difficult to visit rural areas and clinics frequently.
    Patients have to join long queues to obtain an appointment and treatment. For
    minor illnesses, there is no need for a physical check-up. Also, there may be
    no medical history available, either with the patient or with the clinic. With
    the use of IoT, disease management can be improved. When the patient is monitored
    continuously, real-time health data are available; thus, the disease can be treated
    before it worsens [15]. The IoT could be beneficial in remote monitoring of patient
    health, statistics and diagnosis [16]. The IoT has enabled diagnosis and medication
    to reach previously unreachable areas. Thus, the connected healthcare solutions
    and virtual infrastructures make the treatment precise and more effective. According
    to the “Alliance for Internet of Things Innovation (aioli. E.U.)” in its article
    on “Research and Innovation Priorities for IoT,” the advanced automation and analytics
    of the IoT allows for more effective emergency support services. With this the
    patient receives a reminder to take their prescribed'
