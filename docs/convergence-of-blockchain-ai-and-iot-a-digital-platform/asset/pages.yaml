    # 2.2.4 Types of Artificial Intelligence


    Now that we have looked at different examples of systems that use AI, we will
    briefly look at some approaches to AI and to solving AI tasks. One way of looking
    at AI is either as strong or weak. Strong AI aims to build machines that can truly
    reason and solve problems. Strong AI includes machines that are self-aware and
    whose overall intellectual ability is indistinguishable from that of a human.


    Therefore, strong AI proponents want to develop systems that are completely intelligent
    and can do things using their own intelligence. Such systems can be human-like,
    or non-human but rational. When AI was conceived in the 1950s and 1960s there
    was huge optimism about it and a prediction that some AI would be able to overtake
    humans and be everything that a human can do, and carry out tasks much better
    and faster than humans.


    However, such optimism has ill founded, and this was partly the reason that some
    people lost faith in AI techniques. However, after over 50 years of research into
    AI, we are in a position to understand and appreciate the true difficulty of the
    problems that AI faces. Weak AI, deals with the creation of some AI that cannot
    truly reason and solve problems as if it were intelligent. Therefore, the proponents
    of weak AI claim that machines which have been suitably programmed to simulate
    human cognition, appear to behave intelligently, and appear to do tasks well and
    intelligently without really having the same intelligence or understanding as
    humans. Therefore, strong AI really deals with machines that have mental states
    that think, reason, and understand their behavior,'
