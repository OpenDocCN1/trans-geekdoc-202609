    The UWB technology has been developed to facilitate communications within a short-range
    coverage area while using high bandwidth and low energy, and its applications
    to link such kinds of sensors grown substantially.


    Wi-Fi is another networking technology in which radio waves are used to send and
    receive data within a 100-meter range. In ad hoc configurations, Wi-Fi permits
    smart devices to connect and share information even without the use of a router.
    Bluetooth is a communication technology using short-wavelength radio to transfer
    data among devices within short distances with minimum power consumption. Bluetooth
    4.1 was recently announced by the Bluetooth Special Interest Group (SIG), and
    Bluetooth Bluetooth Energy with high-speed connectivity that is a provision of
    IoT systems. Also, the IEEE 802.15.4 description specifies a physical layer as
