    else in the future. Throughout history, value has taken many forms, and people
    have used many different materials to represent money. However, for any other
    materials in place of money, people need to trust the material. It should be valuable
    and remain valuable enough to redeem its value in the future. Since it was challenging
    to carry values all the time, paper money was invented, and banks and government
    hold this paper money. Therefore, spending money was much easier than using values.
    Now that paper money is in use, the value of today''s money comes from a legal
    status given to it by a central authority such as the government. Thus, the trust
    model has changed from trusting something to trusting someone (government). There
    are two issues with paper money; one is that it is centralized (there is a central
    authority that controls and issues it like a bank or government) and second, it
    is not limited in quantity, which means the government or central authority can
    print money as much as they want whenever needed, which may inflate the money
    supply in the market and, as a consequence, the value of money drops.'
