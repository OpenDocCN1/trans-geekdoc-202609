    # 6.4.2 Double spending Problem


    Double spending involves a cash scheme in which the same single digit token is
    spent twice or more. This is possible as the digital token consists of a digital
    file that can be duplicated or falsified. As with counterfeit money, double-spending
    creates inflation by creating a new amount of currency that has not existed before
    that during the duplication and falsification of the digital file. This process
    devalues the currency relative to other monetary units. The fundamental cryptographic
    technique prevents double-spending problem while preserving anonymity of transactor''s
    blind signature, particularly during offline system splitting. The prevention
    of double spending has taken general forms of centralized and decentralized. This
    is usually implemented using an online trusted third party to verify if a token
    has been spent. This represents a single point of failure from both the availability
    and trust viewpoint. By 2007, several distributed systems for double-spending
    prevention had been proposed. Then, in early 2009, a solution was implemented.
    Bitcoin uses proof-of-work to avoid the need for a trusted third party to timestamp
    the transactions. All these timestamps are recorded in the public ledger called
    the blockchain, thereby avoiding double spending.


