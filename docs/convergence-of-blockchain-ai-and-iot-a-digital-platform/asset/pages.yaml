    # 7.2.2 Brain Wave Mechanism in the Digital World


    A brain wave is the electrical voltage that oscillates in the brain, and measures
    a few millionths of a volt [34]. When a person is in a deep sleep or watching
    a video or by taking an exam, the human brain is abuzz with that activity. There
    are millions of electrical pulses passing between the neurons that are sending
    messages to each other. Now, when signals start, clusters of neurons stop getting
    feedback from other neurons and a network of cells to synchronize their firing.
    However, it becomes a repeating cycle or a brainwave, or according to neuroscientists,
    also called oscillations. Organized electrical activity is strong enough to be
    detected by electrodes on the scalp with a technique called electroencephalography
    (EEG). EEG allows brainwaves to be studied to make sense of the brain. The brainwaves
    can be linked to things like consciousness, memory, and maybe even specific diseases.
    There are many different patterns, defined by their frequency. They are measured
    in cycles or the number of times the neurons are firing per second. Brainwaves
    also vary in amplitude, with lower amplitudes as they speed up. There are five
    main types, and there are no hard and fast rules about their function, but generally,
    the higher the frequency of the wave [35], the more alert and awake the person
    is. The slowest of these five waves, which are relatively high amplitude, are
    delta waves. The delta waves are typically linked with deep sleep. Slightly faster
    than delta waves are theta. Theta are often associated with day-dreaming, being
    deeply relaxed or meditating. After theta waves are alpha waves, which are common
    when the person is awake but very relaxed, such as when the person is sitting
    with their eyes closed. Beta waves are even higher in frequency and lower amplitude
    and seem to happen when the person is awake but thinking about something. The
    smallest, fastest oscillations are gamma waves. These tend to occur when the person
    is intensely focused on something. Whether position or activity the person is
    involved with, the reality is that the human brain is abuzz with all different
    frequency waves. However, any particular brainwave is very dominant at any specific
    moment, depending upon what the person is doing and how the person feels at that
    point in time. Let us suppose a person sitting in the park and lots of alpha and
    theta waves are present, there will still be beta waves that might be going on
    in the background. The brain does not have the frequencies throughout an whole
    episode.


    The five types of brain waves are described in Table 7.1. From individual reading
    obtained on an EEG, it has been observed that different brain regions are more
    commonly linked with certain waves. Alpha waves, for instance, are usually the
    strongest at the back of the brain in the occipital lobe... One of the fantastic
    things with brain waves is that these expected frequencies are remarkably similar
    across different species such as cats, bats and humans [36]. However, at the same
    time, they can be very different between individuals. Some'
