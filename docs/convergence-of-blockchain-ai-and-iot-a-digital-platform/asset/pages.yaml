  md: '# Revolution of the Digital World by Strategic Technology Trends 177


    happened. In this way, we can see how the distributed ledgers and smart contracts
    are a crucial part in enabling a genuine service to the economy where the temporal
    usages displace the ownership through the on-demand provisioning of services.


    Second, the smart contract could be beneficial in reducing corruption any in the
    world [41]. Since smart contracts are a transparent program code in their working
    and automatic execution, this leaves little room for an organization or individual
    to modify it to their advantage.


    Third, they reduce the dependency upon a centralized organization as people can
    set up their contractual agreements peer to peer. Thus, limiting the arbitrary
    power of centralized organizations.


    Last, a smart contract can also deliver certainty as they guarantee a specific
    set of predetermined outcomes, enabling all parties to know exactly what will
    happen.


    There are some limitations associated with smart contracts. By automating a contract,
    they are dependent upon rules with well-specified inputs and leave very little
    room for an assortment of eventualities which laws may be slightly altered because
    of unforeseen circumstances. Many unpredictable and unexpected events in the real
    world would occur, and rules sometimes to be flexible and adaptive to accommodate
    this fact. This is one advantage of having oversight as people are much more capable
    of judging such circumstances and responding appropriately to complex unforeseen
    eventualities. Hence, the degree to which the smart contract is relative to the
    kind of environment operated in more complex situations, will often need a governing
    body to intervene when needed. This creates new complications surrounding governance
    that are yet to be figured out.


