    and duplicate testing. Decision support systems can quickly decipher a large amount
    of data within an electronic medical record [10]. AI technology is also taking
    the uncertainty out of viewing patient scans by highlighting the problem areas
    on the images, aiding in the screening and diagnosis process [11]. AI helps with
    the issue of physician burnout by collecting the patient''s data through a mobile
    app, or some text messaging BOTS ask patients series of questions regarding their
    symptoms, on the basis of these symptoms, the BOTS carry out self-diagnosis based
    on some guesswork, thus saving the time, and effort of both the patient and provider
    [12]. With AI integration becoming more innovative it enables solutions to various
    issues for patients, hospitals and the healthcare industry.


    # 7.1.3 Artificial Intelligence in Finance and Banking


    From security to customer services, artificial intelligence is changing the way
    banking is done. Artificial intelligence is a technology by which machines learn
    from experience and perform the tasks that would previously require human intellect.


    The use of technology has become prevalent in recently, and is most popular in
    banks. There are some finance companies that aid businesses with financial technology,
    including the technological innovation of payments and the automation of lending
    and borrowing. Banking and financial institutions are known for their personalized
    customer services, therefore everything is dependent on the customer service agents.
    Agents are responsible for various customer services such as phone calls, emails
    and websites. There are millions of calls per month through interactive voice
    response (IVR), distributed among agents and other operators in the present scenario.
    This is a huge task that requires significant human resources and work. To automate
    this traditional method of banks'' customer services, Centrosoft introduced its
    AI technology-based customer response management. CRM solutions work as a smart
    solution for the banking sector and can handle thousands of instances without
    any intervention with the vision of automating the system and controlling the
    cost of live agents. The CRM solutions prove to be in achieving the desired targets.
    Centrosoft is the first company to produce this AI-based solution, which is a
    unique multilingual system. Centrosoft promises to deliver 100% accuracy for speech
    and text recognition services. There are some other benefits provided by Centrosoft,
    which include the banking policies and procedures can be fed to the system for
    error-free services for the customer. Banking-related might might have queries
    related to user account information such as recent transactions, and these and
    all other queries can be handled efficiently. The AI solution will act as a live
    agent to support bank customers and solve their queries. The system has been developed
    to save time, money and the related resources and to provide error-free quick
    responses.'
