    # 7.1.13 Blockchain: Adding Value to a Business Process


    Blockchain technology has seen remarkable growth recently, with the technology
    being used for various purposes in addition to cryptocurrency. The technology
    is being used in multiple sectors, including education, healthcare and improving
    the quality of business processes. For different companies, a matter of concern
    is the design, execution, monitoring and improvement of the business process.
    For many companies are using multiple systems that support the execution of the
    process. A business relies on mutual trust with its customers and other business
    partners. Blockchain provides an environment where the interorganizational process
    can operate and execute in a trustworthy manner, without requiring the trust of
    a specific individual,, rather depending on the data in the blockchain. The blockchain
    network can provide end-to-end traceability, and real-time audits can be done
    using timestamps and digital signatures. Transactions that are an essential part
    of a business process can use the smart contracts of blockchain technology where
    the transactions are executed transparently to other participants in the blockchain
    network. Smart contracts are small piece of code or programs. Smart contracts
    run automatically whenever certain conditions are fulfilled. Thus, smart contracts
    can be used as an agreement between the blockchain network users to verify the
    transaction without the interference of a third party, and the rules once created
    cannot be changed or modified, which allows the business parties to work transparently.


    Blockchain can benefit a business by tracing back the item or product that it
    is trading. We know that it becomes challenging if the thing we are dealing with
    is lost or becomes untraceable. Blockchain thus comes into the picture as the
    complete information of the item with the exact date and time of the item being
    sent or received is recorded on the blockchain. There is no possibility that the
    data will get lost not able to be recovered. However, every business needs to
    take precautions when investing in blockchain technology'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Revolution of the Digital World by Strategic Technology Trends


    [27] as it is not guaranteed that every company will benefit from a blockchain
    network in both design and process improvement, and any unorganized or disorderly
    structure that is implemented on blockchain may lead to strategic failures. Thus,
