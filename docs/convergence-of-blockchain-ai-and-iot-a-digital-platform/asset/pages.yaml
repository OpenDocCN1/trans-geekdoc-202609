    # 2.1.1.6 Semantics


    In the IoT, semantic means the capability of various devices to acquire knowledge
    intelligently in order to provide the necessary services. Discovering and utilizing
    tools, as well as modeling data, are all part of knowledge extraction. It also
    entails identifying and evaluating data in order to provide the correct decision
    with the best service.


    # 2.1.2 IoT—Layered Architecture


    The IoT can normally interconnect billions of heterogeneous devices, hence a versatile
    architecture is essential. The ever-increasing number of proposed architectures
    has made it difficult to choose a standard one. The primary model is a three-layer
    architecture composed of the application, network and perception layers, which
    was chosen from a collection of proposed models. Some other reference models that
    bring greater refinement to the existing IoT architecture have been proposed recently.
    Three-layered and five-layered reference models are depicted in Figure 2.1. A
    discussion on the five-layered model follows.


    # 2.1.2.1 Perception/Object Layer


    The perception/object layer is the first layer that characterizes the IoT’s sensors
    to capture and process data. In addition, this layer contains sensors and actuators
    that can query position, acceleration, motion, weight,


    ![](img/b56ecff464f3e05f86f0996097658b3b_53_0.png)


    FIGURE 2.1

    IoT layered architecture.'
