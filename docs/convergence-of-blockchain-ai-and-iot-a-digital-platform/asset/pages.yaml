    # 7.1.12 Lack of Experience and Expertise


    Employees working on IoT technology and related devices must have experience and
    expertise of working with these IoT devices to better integrate and implement
    devices with the system. However, the problem arises when organizations are unable
    to find a person with experience working with the IoT. Many employees have previous
    experience of working with the technology, but moving on to a new technology may
