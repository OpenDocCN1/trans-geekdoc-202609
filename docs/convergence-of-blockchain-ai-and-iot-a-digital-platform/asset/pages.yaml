  md: '# 8 Conclusion


    As this book discusses the convergence of blockchain, the IoT, and artificial
    intelligence, it will be a useful handbook for upgrading readers’ knowledge, which
    will enhance a new thought process of interdependent components into a common
    aspect. The digital platforms are the most changing platforms in the current era,
    and so their advancement in any platform will affect the whole process. The IoT
    mechanism faced problems of security and privacy concerns as it converges with
    blockchain technology, however the pitfalls have become advantages in the various
    applications. The first chapter gave an overview of the three technologies, blockchain,
    the IoT, and artificial intelligence with their fundamental aspects described.
    The following chapters explained the transformation of this mechanism in correlation
    with each other, While the final chapters discussed the futuristic approaches
    of these technologies with some examples (Figure 8.1).


