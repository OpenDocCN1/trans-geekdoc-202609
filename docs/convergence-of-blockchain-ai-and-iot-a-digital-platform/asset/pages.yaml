  md: '# 7.1.4 Hurdles in Artificial Intelligence


    Artificial intelligence is a technology that is going to impact the future of
    all countries. There are multiple use cases nowadays which are implemented on
    this technology. Still, this technology faces a number of hurdles and challenges
    that need to be resolved as soon as possible if we want the technology to reach
    its fullest potential [13].


    +   Lack of Computing Power

    Artificial intelligence is all about working on data and machine learning and
    deep learning, which could require a considerable number of calculations and computations
    which have to be made very quickly. The processing power of the system has to
    be higher to do such significant estimation and calculations. The computing power
    we nowadays will not manage the growing volume of data processing. Thus, the lack
    of computing power may slow down the computing and processing of continuously
    data.


    +   Lack of Knowledge

    Over the last few years, artificial intelligence has been used in many companies
    and organization for developing new devices and the technology has been used in
    many different sectors. However, there are not enough people and organizations
    moving their businesses or ideas on using artificial intelligence technology.
    One reason be that there is a lack of people with knowledge of working on technology
    and the related machines. Another possible reason could be the platforms and tools
    required to drive the AI. Some organizations may be reluctant to choose and build
    the tools from scratch and prefer adopting tools and platforms from a ready-made
    solution to put the data into the device and get the result, while ignoring the
    technical operations inside the instrument.


    +   Trust Issues

    Artificial intelligence is like a block box. Using the tools and platforms for
    this technology does not provide information about what is happening inside. They
    may not understand how the decision is made, making them uncomfortable with the
    technology. Since artificial intelligence works on multilayer neural networks,
    a person with little technical knowledge will not understand the predictions made
    by the system, which sometimes makes people uncomfortable with the technology,
    and building trust is not easy.


    +   Working on Similar Tasks

    Implementing AI technology can be done either in a highly specialized manner or
    in a generalized way. A highly specialized AI can also be called AI, which is
    used to perform specific tasks, including giving a set of all valid inputs to
    the system and getting the result'
