    - Content availability

    - Awareness

    - Privacy and security

    - Physical harm.


    # 5.5.2.11 Hardware Implementation


    The major challenge in AR is the implementation of hardware, as mobile devices
    are not fully equipped with the requirements of AR for interactive experiences.
    The unique AR headset is still a work-in-progress, as consumer needs the headsets
    to experience the virtual environment more actively (Al-Shuwaili, Ali, and Osvaldo
