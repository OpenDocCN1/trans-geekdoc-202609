    difficult to compute the input from the output digest [e.g., finding "a" from
    hash (a) = digest]. Second pre-image resistant means that it is computationally
    difficult to interpret the second input which resulted in the same output [e.g.,
    finding a, b where hash (a) = hash (b)]. Collision resistant, it is computationally
    difficult to find two inputs which resulted in the same output [e.g., finding
    a and b where hash (a) = hash (b)]. A nonce is an arbitrary random number along
    with input data given for the hash function to create the digest as output. The
    different nonce values for the same input produce various digest values. The cryptographic
    nonce is followed in the Proof-of-Work (PoW) consensus mechanism. A hash function
    called the Secure Hash Algorithm (SHA) with 256 bits output (SHA-256) SHA-256
    produces 32 bytes of output in 64-character digits decimal format (as shown in
    Table 1.1).

    The hash function accomplishes the following tasks in the blockchain network:


    +   - Seeds the block header and data

    - Creates unique identifiers

    - Derives an address.'
