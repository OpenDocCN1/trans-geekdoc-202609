  md: '# Basic Fundamentals of IoT, AI and Blockchain


    # 2.1.1.1 Identification


    Identification is critical in IoT systems for naming and matching services on
    demand. There are a number of IoT identification methods available, including
    electronic product codes (EPCs) and ubiquitous codes (uCode). In addition, addressing
    smart devices in IoT systems is crucial for distinguishing the object identifier
    and address. The object identifier is the name of an object including T1 for a
    specific temperature sensor, and the address is its position within a communications
    network. IPv6 and IPv4 are also used as addressing methods for IoT objects. LoWPAN
    uses an IPv6 header compression method that makes it ideal for low-power consumption
    wireless networks. Since identifying objects are not globally specific, distinguishing
    among identifiers and addresses is critical. Addressing helps in identifying objects
    in a unique manner. Furthermore, objects on the network can use public IP addresses
    rather than private addresses. Identification mechanisms are exploited to give
    each object in the network a distinct identity.


    # 2.1.1.2 Sensing


    Sensing in an IoT environment gathering data from the connected objects and transmitting
    them to a data warehouse, database or the cloud. Also, the information gathered
    is evaluated in order to proceed with appropriate actions on the services required.
    Smart sensors, actuators and wearable sensing systems are examples of IoT sensors.
    Several companies, for example, provide smart applications that permit people
    to use their smartphones to track and manage thousands of smart appliances within
    buildings. Building IoT devices, single-board computers (SBCs) with sensors, security
    functions and in-built TCP/IP are commonly used (e.g., Raspberry PI, Arduino,
    etc.). Customers usually request data from such devices, which are connected to
    a central management server.


    # 2.1.1.3 Communication


    The communication technologies allow heterogeneous objects to communicate with
    one another in order to provide precise smart services. With the existence of
    noisy communication links, IoT nodes can typically operate at low power. IEEE
    802.15.4, Wi-Fi, Bluetooth, LTE-Advanced and Z-wave, are examples of IoT networking
    protocols. RFID, ultra-wide band and near-field communication (NFC) are communication
    technologies that are also used. RFID (tag and reader) is the primary technology
    to bring the M2M idea into practice. The RFID tag is a simple chip that is fixed
    to an item to identify it. Also, the RFID reader sends a signal to the tag and
    obtains a reflected signal, which is then sent to the database. The database uses
    a processing center to classify objects in the range of 10 cm to 200 m based on
    reflected signals. Active tags, passive tags, and semi-passive and active'
  merge: -1
  img_proc: true
