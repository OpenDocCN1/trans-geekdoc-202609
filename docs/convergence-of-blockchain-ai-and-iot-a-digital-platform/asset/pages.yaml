    # 2.2 Understanding the Basic Concepts of Artificial Intelligence


    # 2.2.1 Introduction to AI


    AI is concerned with the design of intelligence. If fact, it is actually concerned
    with the design of intelligence in artificial artifacts and artificial devices.
    Thus, artificial systems or man-made systems are building intelligence into this.
    This term was coined by McCarthy in 1956 at the Dartmouth conference [2]. Now,
    the term artificial is easy to understand, but what is intelligence?


    It is very difficult to define intelligence. Often, intelligence is perceived
    as something that characterizes humans. If you take human beings to be intelligent
    you say that artificial intelligence means behavior which is similar to that of
    a human. In fact, there are two thoughts here. First, is to have a machine or
    system that behaves like a human. Humans are not always completely intelligent,
    although they have a good level of intelligence. In fact, although humans are
    relatively intelligent, they do not behave intelligently. Second, the other idea
    that artificial intelligence is concerned with intelligence which results in the
    ideal, best, or most rational behavior. There is another dichotomy in this definition.
    When we talk about behavior what sort of behavior are we talking about? There
    are two main types of behavior that people generally refer to. The first is: thinking
    intelligently, reasoning properly and intelligently in order to come with a solution.
    The second approach is to talk about not thinking but acting, that is how the
    system actually acts or behaves. Therefore, we can talk about intelligence as
    something that characterizes humans or something that means behavior in the best
    possible manner or behaving rationally.'
  merge: -1
  img_proc: true
