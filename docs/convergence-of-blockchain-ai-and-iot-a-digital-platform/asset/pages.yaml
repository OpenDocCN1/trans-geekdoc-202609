    # 3.2.1 Principal Component Analysis


    Principal component analysis (PCA) is a well-known unsupervised dimension reduction
    method that determines the distribution’s principal directions. PCA is a well-established
    technique for dimensionality reduction and multivariate analysis [5]. Examples
    of its many applications include data compression, image processing, visualization,
    exploratory data analysis, pattern recognition and time series prediction. The
    popularity of PCA is due to three essential properties. First, it is the optimal
    linear scheme for compressing high-dimensional vectors into a set of lower-dimensional
    vectors and reconstructing the original location. Second, the model parameters
    can be computed directly from the data—by diagonalizing the sample covariance
    matrix. Third, compression and decompression are easy operations to perform given
    the three model parameters—they require only matrix multiplication. A multidimensional
    hyperspace is often challenging to visualize [6].


    The main objectives of unsupervised learning methods are to reduce dimensionality,
    considering all observations based on a composite index and similar clustering
    together based on multivariate attributes. Summarizing attributes by two or three
    variables that can display graphically with minimal loss of information is helpful
    in knowledge discovery. Because it is hard to visualize a multidimensional space,
    PCA is mainly used to reduce the dimensionality of d multivariate attributes into
    two or three dimensions. In mathematical terms, PCA is a technique where n correlated
    random variables are transformed into n uncorrelated variables. The uncorrelated
    variables are linear combinations of the original variables and can express the
    data in a reduced form. Typically, the first principal component of the transformation
    is the linear combination of the original variables with enormous variance.


    The first principal component is the projection on the direction in which the
    variance of the projection is maximized. The second principal component is the
    linear combination of the original variables with the second-largest variance
    and orthogonal to the first principal component, and so'
