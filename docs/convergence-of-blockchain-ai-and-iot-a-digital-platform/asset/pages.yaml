  md: '# 7.1 Use of Case Studies and Technical Hurdles in AI,

    the IoT and Blockchain for a New Revolution


    # 7.1.1 Artificial Intelligence in Agriculture


    Agriculture has always been a primary source of income in many countries, and
    all farmers want to cultivate the best crop so they can obtain the best price.
    Farmers are engaged in multiple technologies. There is a considerable gap in the
    technology, and there can be a massive loss of food because of a simple mistake.
    Complex situations constantly challenge the farmers, who need to take diligent
    care of their crops. These devices are described as sensing, as they need to know
    what is happening and the real needs of the crops. So, where does artificial intelligence
    fit in with agriculture?


    AI can provide benefits, especially in the thinking process, or we could say that
    AI is a digital thinking friend. The data processing and action where data can
    be gathered by most recent technology, the processing of data is the thinking,
    and this is where most of the artificial intelligence comes into action [5]. So,
    what are the benefits of AI in agriculture? AI can be beneficial in seed breeding
    [6], which is the selection of seeds, requiring millions of genes to be identified
    to find the best source for that specific condition. This can be done by artificial
    intelligence on of the farmer. Artificial intelligence could also be beneficial
    in checking the fertility of the soil [7]. Many companies are providing services
    and products based on artificial intelligence.


    There are some challenges associated with artificial intelligence which slow down
    the processes [8]:


    +   - The availability of the data, if there is no data input, there will be no
    data output and no artificial intelligence.


    +   - The data quality because if the gathered data are pure junk, then the creation
    received would also be pure junk in digital terms.


    +   - The policies and regulation associated with the devices based on artificial
    intelligence.


    # 7.1.2 Artificial Intelligence in Healthcare


    This age of technology knows no bounds. At one time AI was thought to be a futuristic
    trend to humankind. AI is now changing and saving lives, and is not intended to
    replace clinicians or clinical judgment. AI serves the purpose of enhancing and
    complementing the human interaction between a provider and patient [9]. In healthcare,
    AI is a game changer with its applications, decision support image analysis, and
    patient triage to reduce the variations'
  merge: -1
  img_proc: true
