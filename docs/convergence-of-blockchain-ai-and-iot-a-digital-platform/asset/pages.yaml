    # 6.4.13 Byzantine Fault Tolerance (BLT)


    The BFT consensus algorithm is based on a prevalent problem known as the Byzantine
    General problem. The Byzantine general problem is a question of consensus. Mountains
    and other barriers surrounded the generals; these generals can communicate only
    by sending messengers. In addition to this, they had not decided whether to attack
    the city or go up and retreat. Now, only after observing the enemy, they agree
    on a joint plan of action. Only an attack launched by all generals once can successfully
    conquer the city. Having gone this far, they send the messenger with their votes
    on how to proceed. However, the problem is that some of the generals have been
    bribed. In exchange for their betrayal, they will earn themselves a fortune from
    the city. These traitor generals will provide incorrect information to their peers
    to fail the attack and prevent consensus. Also, their messengers could get lost
    or corrupt their messages. The question arises as to how peace can be then again.
    There is no solution in the presence of one-third or a higher percentage of potential
    traitor generals. This traitor generals are known as the Byzantine nodes, and
    they may act maliciously or arbitrarily.


    Practical Byzantine Fault Tolerance, released in 1993 by Miguel Castro and Barbara
    Liskov, gives an algorithm to allow nodes to reach a consensus with no more than
    one-third Byzantine nodes. This paper has inspired many iterations of Byzantine
    fault tolerance algorithms, especially as research into'
