- pgno: 15
  md: '# Author Biographies


    ![](img/b56ecff464f3e05f86f0996097658b3b_15_0.png)


    **Dr. B. Balamurugan** completed his Ph.D. at VIT University, Vellore and currently
    works as a Professor in Galgotias University, Greater Noida, Uttar Pradesh. He
    has 15 years of teaching experience in the field of computer science. His areas
    of interest lie in the field of the Internet of Things, big data and networking.
    He has published more than 100 international journals papers and contributed numerous
    book chapters.


    ![](img/b56ecff464f3e05f86f0996097658b3b_15_1.png)


    **Dr. T. Poongodi** works as an Associate Professor, in the School of Computing
    Science and Engineering, Galgotias University, Delhi–NCR, India. She has completed
