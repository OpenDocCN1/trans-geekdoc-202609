  md: '# Disruptive Technological Aspect of the IoT toward Blockchain


    # 5.4.1.4 Symmetric Encryption


    In this method, a single key is used for both encryption and decryption by the
    sender as well as the receiver, this single key is called a private or secret
    key (Li et al. 2019).


    +   - Examples: AES (Advanced Encryption Standard)

    - Data Encryption System (DES), Triple DES, RC2, RC4, RC5, IDEA, Blowfish, Stream
    cipher, Block cipher.


    # 5.4.1.5 Asymmetric Encryption


    In this type of encryption there are two keys, public access which is used for
    encryption, and the private key which is used for decryption. The advantage of
    this encryption method is that the public and private keys are different. Therefore
    if an intruder compromises one key, it is not possible for them to breach the
    message.

    Examples: Diffie Hellman key exchange algorithm, RSA algorithm.


    # 5.4.1.6 Hash Functions


    These are the mathematical notations whereby one number is changed into another
    value with a smaller value. The significant advantage of this function is that
    the input can be of any length, but the output will be of a fixed length. It is
    more essential in applications which need to provide maximum security. The most
    efficient hash functions for the IoT environment are SHA-1 and MD5. The most efficient
    hash functions for the IoT environment are SHA-1 and MD5, as shown in Figure 5.8.


    # 5.4.1.7 Blockchain-Integrated IoT System


    Blockchain can be used to enhance IoT security as it is a decentralized environment,
    where it cannot be tracked by any intruder for the location of data (Patel et
    al. 2020). It can bridge the gap of security, privacy and scalability issues in
    the IoT environment. The decentralized architecture makes the data stored in servers
    in multiple locations, and so a single point of failure will not affect the recorded
    data, unlike a cloud-based IoT system, where data is held in a single place, leading
    to lost data in the case of a crash in the cloud server (Mistry et al. 2020).


    # 5.4.1.8 Components of Blockchain


    Blockchain consists of the major components described in Table 5.2.'
