    the scalability and reliability of communication. Next, LTE (Long-Term Evolution)
    is another wireless communication protocol focusing on GSM/UMTS networks for data
    transmission at a high speed over mobile phones. It has the ability to cover fast-moving
    devices while also providing broadcasting and multicasting facilities. LTE-A (LTE
    Advanced) is a more advanced variant of LTE that includes up to 100 MHz of bandwidth
    expansion, spatial multiplexing, lower latency, better throughput and extended
    coverage.


