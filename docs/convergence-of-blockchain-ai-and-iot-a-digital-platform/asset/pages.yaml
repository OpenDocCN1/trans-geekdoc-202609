    # 6.4.11 Difference between Proof of Work (PoW) and Proof of Stake (PoS)


    Proof of stake does not let everyone mine for new blocks and, therefore, uses
    considerably less energy and is more decentralized. In proof of work, there is
    something called mining pools, where the users team up to increase their chances
    of mining a new block and thus collecting the rewards. However, these pools can
    control a large portion of the Bitcoin blockchain. They centralize the mining
    process, which is quite dangerous. If, let says three to four mining pools merge,
    they would have the majority stake in the network and the possibility that they
    could start approving fraudulent transactions. This type of problem is known as
    a 51% attack.


    Another most advantage is that setting up a node for a proof of stake-based blockchain
    is much less expensive compared to a proof of work-based one. There is absolutely
    no need encourages more users to set up a node and make the network more decentralized
    and secure. However, even proof of stake isn''t perfect and has some flaws. For
    example, if a user buys a majority of the stake in a network, the user can effectively
    control the web and approve fake transactions (51% attack).


    Proof of stake also has to be very careful when selecting the following validators.
    This cannot be random because the size of the stake has to be factored in. Still,
    at the same time, the stake alone isn''t enough because it will favor affluent
    users, who will be chosen more frequently and collect more transactions fees and,
    in, become more affluent, which again increases the chance of them being selected
    as a validator even more often.


    Another problem is when the network chooses the next validator, but the user does
    not come up for this job; then it selects a large number of backup validators
    as a fallback.


    Peercoin, Lisk and Nxt are some of the coins that use the proof of stake algorithm
    as a mining algorithm. Ethereum, for example, is working on implementing a proof
    of stake system called Casper. It is currently deployed on the Ethereum test net
