  md: '# # 7nRevolution of the Digital World by Strategic Technology Trends


    The digital revolution arrived with the advancement of technology from analogue
    electronics devices to mechanical devices. The process that was started in the
    1980s today has reached the most advanced digital technologies and is still on-going.
    The revolution started over 30 years ago, and was also called the digital process,
    and was marked as the starting phase of the information era. The first digital
    revolution started in 1947 when the transistor was invented for data transfer
    devices [1]; since then, the digital process has advanced greatly in many different
    sectors. The digital revolution has played an essential role in the economic growth
    of all countries. Over the past decade, the digital process has increased with
    new technologies coming in; therefore organizations have to adopt these new technologies
    to increase their production, customer satisfaction, and most importantly, automated
    the process of incoming and outgoing items, this is a payment or manufacturing
    of products. The technologies like artificial intelligence, the Internet of Things,
    and blockchain have received a positive response from society. Many organizations,
    industries and other sectors have obtained benefits from these new technologies.
    Since data are very valuable data, analyze the data, and provide privacy and security.
    With the digital revolution, not only the data but also the currency we have moved
    to a digital platform [2]. Cryptocurrency is one type of digital currency generated
    and used for payments [3]. With the invention of cryptocurrency, the user is not
    dependent on a central authority for currency generation. The user can generate
    any cryptocurrency and use this form of digital currency to buy and sell any product
    or make payments to an individual.


    There are many cases available for technologies like artificial intelligence,
    the Internet of Things, and blockchain. These claims are already implemented and
    provide benefits to society or are in the process of implementation. Hence, the
    digital revolution makes devices intelligent and offers good security and privacy
    for the users of these devices [4].'
