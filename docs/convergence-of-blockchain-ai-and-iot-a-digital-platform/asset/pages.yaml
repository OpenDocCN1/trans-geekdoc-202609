    # 6.4.4 Bitcoin Mining


    Bitcoin was created as a decentralized alternative to the banking system. This
    means that the system can transfer funds from one account to another without any
    central authority. The central authority transferring funds is relatively easy,
    just information to the bank to transfer the amount from one account to another.
    In this case, the bank has the authority to do this only as the bank has the ledger,
    which holds the balances to update the version for everyone in the system. Thus,
    a decentralized system was invented where the sender can directly transfer funds
    to the receiver without any central authority intervention. The rules applied
    in the Bitcoin system protocol solve this in a very creative and efficient manner.
    Anyone can participate in Bitcoin’s mining process as it is open to anyone in
    the network or wishing to join the. To make a Bitcoin, the user has to predict
    a random number. The computer makes this prediction of the random number. The
    more fast and powerful the system, the faster are the guesses of this random number
    per second; if the user manages to guess the correct random number, they earn
    a Bitcoin and get on the next page of the Bitcoin transaction on blockchain.


    Let’s now discuss the mining process in a bit more detail. Once your mining computer
    comes up with the right guess, the mining program determines which of the current
    pending transactions will be grouped into the next block of transactions. The
    block created and the solution for finding the correct random number are sent
    to the whole of the blockchain network so that other computers present on the
    web can validate the new transaction. Each computer on the network that validates
    the solution updates its copy of the Bitcoin transaction ledger locally on the
    computers with the trade that has been chosen to be included in the next block.


    Since mining is based on guessing for each block, any miner can guess the correct
    number and get access to the blockchain. It is a fact that a miner having greater
    computing power will succeed more often. However, due to the law of statistical
    probability, it is doubtful that every miner will go to do the same job again
    and again. Also, when this stage is completed, the system generates a fixed number
    of Bitcoins. The user receives the reward for compensation for the time and energy
    spent solving the mathematical problem. In addition to this, the user also gets
    paid any transaction fees attached to the transactions inserted into the block.
