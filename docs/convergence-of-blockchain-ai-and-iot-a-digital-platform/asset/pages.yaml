  md: 'like Bankchain, participation is restricted and requires special permissions
    to join (referred to permissioned blockchains). Bankchain only permits banks to
    run the node application. However, in the Bitcoin ecosystem, anyone can download
    and install the node application and participate in the ecosystem.


    # 4.2 Shared Ledger


    The distributed ledger is a data structure managed inside the node application.
    Once you have the node application running, you can view the respective ledger
    (or blockchain) contents for that ecosystem. Interactions are done according to
    the rules of the ecosystem in which it resides. You can run as many node applications
    as you like, and are permitted to use, and each will participate in its respective
    blockchain ecosystems. It is important to note that the number of ecosystems you
    are a participant doesn''t matter as you will only have one shared ledger for
    each ecosystem.


    # 4.3 Consensus Algorithm


    The consensus is implemented as a portion of the node application by providing
    the “rules of the game” for how the ecosystem will arrive at a single view of
    the ledger. Different ecosystems have different methods for attaining consensus
    depending on the desired features the ecosystem needs. Participation in the consensus-building
    process, the method for determining the “world state” of the ecosystem, can be
    vested in several different schemes: proof-of-work, proof-of-stake, proof-of-elapsed-time;
    each plan qualifies nodes as honest in different ways before participating in
    the consensus-building process.


