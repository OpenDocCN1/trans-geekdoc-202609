    in the blockchain network. In the Ethereum platform, smart contracts are available
    using special addresses by creating a contract account. The account address is
    computed and generated, and permits the contract to be executed once the transaction
    is received. The wallet is software that acts as a private key storage to secure
    and manage the user''s private keys in the blockchain network. It can store public
