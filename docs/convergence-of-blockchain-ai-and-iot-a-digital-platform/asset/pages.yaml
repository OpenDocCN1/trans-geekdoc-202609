    send data from the street lights of a particular area [21]. The IoT devices would
    be able to send fault reports and alerts if any street light was damaged or not
    working correctly. Thus, the complete information from all the areas in regard
    to maintenance work could be done quickly and in a single visit. IoT waste automation
    helps to ensure a clean'
