  md: 'then really just an account on the blockchain controlled by the code instead
    of the user because it is on the blockchain; it is immutable, which means there
    is no possibility of changing the code. Thus, the investor is assured that they
    will get their fair share automatically. The code will dictate how the process
    takes place, and no individual has the power to change the code, be an organization,
    government or censor. Nothing can alter or manipulate the smart contract. In this
    sense, it is said that code is law in the sense that the code will definitely
    execute no matter what. As an example, a logistic company could receive cash on
    delivery at this particular location, then it triggers a supplier request to store
    a new item since the existing article has just been delivered.


    A combination of smart contract with a smart-encoded property will give an idea
    of intellectual property [39]. Bright property whose ownership is controlled through
    blockchain-encoded contractual agreements. For example, a pre-established smart
    contract could automatically transfer the right of a vehicle title from the holding
    company to the individual owner when all loan installments have been cleared.
    The key idea of the smart property is controlling the ownership and access to
    an asset by registering it as a digital asset on the ledger and connecting to
    a smart contract. In some cases, the physical world assets could quite literally
    be controlled through blockchain.


    Like all, any smart contract would require an input value and can only act if
    certain conditions are met. When a particular deal is reached, the smart contract
    changes its state and executes predefined algorithms, automatically triggering
    an event on the blockchain. Thus, the working of the overall contracts can only
    be as good as the inputted data. If both the data are inputted into the system,
    the system might give false results. Blockchain cannot access its data outside
    its network, which requires some form of trusted data feed as input to the system,
    called an oracle [40]. An oracle is a data feed provided by an external service
    for smart contracts on the blockchain. Oracle provide the external data and trigger
    the smart contract executions when some predefined conditions are met. Such a
    condition could be any data like temperature or quantity of items in stock. An
    oracle in the blockchain and smart contract context is an agent that finds and
    verifies real-world occurrences and provides this information to the blockchain
    network that the smart contract can use. However, an oracle is part of the blockchain
    consensus mechanism. Thus, whether it is a newsfeed website or a source, the source
    of information needs to be trustworthy.


    First, the smart contract is automatic, and so it can remove the time and cost
    associated with managing and enforcing them, making them more efficient as they
    are cheaper and faster to run. Through this form of automation, a much more significant
    amount of exchanges could take place that otherwise would never have'
