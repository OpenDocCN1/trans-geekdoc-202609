  \n### 使用 Oraclize 服务进行外部信息查询\n\n此演示展示了\n\n![](img/rId582_edit_140086950893040.png)\n\
  \n- 如何查询外部信息，例如通过 JSON-REST 接口并将其加载到以太坊智能合约，尽管智能合约无法访问外部服务。\n\n\n\n\n\n智能合约可以执行程序代码和计算，并将结果存储在区块链中。但智能合约无法与外部世界进行通信。然而，对于某些智能合约，必须执行查询才能检查特定的“现实世界”条件，例如股市价格、航班延误或天气数据。所谓的预言机（Oracles）被程序化为中间件（“数据馈送”）（例如在\
  \ `Solidity` 中）并被添加到区块链中。[A](https://solidity.readthedocs.io/) 智能合约可以查询预言机，预言机可以调用外部接口（例如通过\
  \ REST `/ JSON`），并通过回调将结果传输给智能合约。另见：Oracle Services (Christoph Niemann), Types of\
  \ oracles, [, 为[以太坊构建一个预言机](https://www.maibornwolff.de/sites/default/files/news/files/javaspektrum_orakeldienste_blockchain_drchristophniemann.pdf)\
  \ [Ethereum](https://www.maibornwolff.de/sites/default/files/news/files/javaspektrum_orakeldiese_blockchain_drchristophniemann.pdf)\
  \ (** [John Weldon), O](https://blockchainhub.net/blockchain-oracles/) 预言机为区块链带来数据（Jules](https://medium.com/@mustwin/building-an-oracle-for-an-ethereum-contract-6096d3e39551)\
  \ [Dourlen](https://medium.com/@mustwin/building-an-oracle-for-an-ethereum-contract-6096d3e39551)\
  \ s), 以太坊与预言机 (Vitalik Buterin), Oraclize.it:](https://ethereumdev.io/oracles-getting-data-inside-blockchain/)\
  \ 数据载体](https://blog.ethereum.org/2014/07/22/ethereum-and-oracles/) 用于去中心化应用。](https://blog.ethereum.org/2014/07/22/ethereum-and-oracles/)\n\
  \n![](img/rId589_edit_140086949765968.png)\n\n此类预言机服务最著名的提供商之一[是](http://www.oraclize.it/)\
  \ `Oraclize.it`。下面展示了一个使用该服务的智能合约。\n\n![](img/rId593_edit_140086949768592.png)\n\
  \n### 1. 使用 Oraclize 服务\n在私有以太坊区块链上使用 Oraclize 服务要复杂一些，因为需要安装 `Ethereum bridge`（以太坊桥接）。[这就是为什么](https://docs.oraclize.it/#integrations）在这里使用了\
  \ Rinkeby 以太坊区块链，在其中不需要这一点。\n\n![](img/rId595_edit_140086949768848.png)\n\n### 2.\
  \ 设置环境\n如果你还没有这样做，请从上述创建的由[B](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#starte-Rinkeby-Ethereum-Blockchain.bat)\
  \ 创建的 Rinkeby-Test-Ethereum-Blockchain 文件开始：\n\n```bash\ncd \\Workspace\\Demo start-Rinkeby-Ethereum-Blockchain.bat\n\
  ```\n\n![](img/rId596_edit_140086949767568.png)\n\n你可能需要等待区块链同步。\n\n1. 你的账户必须有 Ether：`web3.eth.accountsload('src/checkBalances.js')`\n\
  \n![](img/rId597_edit_140086949767312.png)\n\n如果你还没有创建任何账户：参见上文[Public Rinkeby](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Rinkeby)\n\
  \n![](img/rId599_edit_140086949765392.png)\n\n你有账户但还没有 ether：请看上文如何将 eth 转移到 Rinkeby\
  \ 账户。如果你[已经](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Rinkeby)\
  \ 转移了 Ether，但在重启后 Ether 数量显示为 0：你可能需要等待更长时间的区块链同步。最好通过 `https://rinkeby.etherscan.io/address/`（将\
  \ `{my account address}` 替换为账户地址）检查 Rinkeby 账户是否有 ether。\n\n（注：原文包含一些碎片换行，已合并以提高读性）\n\
  \n### 3. 汇率查询\n1. 将演示从英镑到欧元的汇率查询。为此应通过以下 REST URL 访问的服务：`http://api.fixer.io/latest?symbols=USD,GBP`\n\
  \n![](img/rId503_edit_140086949768784.png)\n\n例如，JSON 结果如下（显示方式取决于不同的网页浏览器）：![](img/rId504_edit_140086949767632.png)\n\
