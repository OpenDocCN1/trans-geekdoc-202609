  \ EUR-GBP 汇率在此期间发生了变化，你将看到新值。\n\n18. 当然，仅仅将市场价值转移到区块链是没有意义的。但根据市场价值，智能合约可以做出进一步的决策或启动操作。在\
  \ `http://dapps.oraclize.it [你可以找到](http://dapps.oraclize.it/) “基于 Oraclize 的 DApps”示例。\n\
  \n19. 从理论上讲，`Oraclize` 服务可能会伪造传输的信息。为了排除这一点，可以查看 [Oraclize 真实性证明](https://docs.oraclize.it/#ethereum-quick-start-authenticity)\
  \ (Images/rId618_edit_140086949768144.png) 区块和交易的分析 (Images/rId620_edit_140086949768528.jpeg)\n\
  \n在 `Common JavaScript snippets for get` 下，你会找到一些实用的 Geth 脚本，例如当区块链运行时使用的 `getTransactions()`：\n\
  \n```javascript\nfunction getTransactionsByAccount(myaccount, startBlockNumber,\
  \ endBlockNumber) {\n  if (endBlockNumber == null) {\n    endBlockNumber = eth.blockNumber;\n\
  \    console.log(\"Using endBlockNumber:\" + endBlockNumber);\n  }\n  if (startBlockNumber\
  \ == null) {\n    startBlockNumber = endBlockNumber - 50;\n    console.log(\"Using\
  \ startBlockNumber:\" + startBlockNumber);\n  }\n  console.log(\"Searching for transactions\
  \ to \" + myaccount + \" within blocks\" + startBlockNumber + \"and\" + endBlockNumber);\n\
  \  for (var i = startBlockNumber; i <= endBlockNumber; i++) {\n    if (i % 10 ==\
  \ 0) {\n      console.log(\"block\" + i);\n    }\n    var block = eth.getBlock(i,\
  \ true);\n    if (block != null && block.transactions != null) {\n      block.transactions.forEach(function\
  \ (e) {\n        if (myaccount == \"*\" || myaccount == e.from || myaccount == e.to)\
  \ {\n          console.log(\"tx hash: \" + e.hash +\n            \"nonce: \" + e.nonce\
  \ +\n            \"blockHash: \" + e.blockHash +\n            \"blockNumber: \"\
  \ + e.blockNumber +\n            \"transactionIndex: \" + e.transactionIndex +\n\
  \            \"from: \" + e.from +\n            \"to: \" + e.to +\n            \"\
  value: \" + e.value +\n            \"time: \" + new Date(block.timestamp * 1000).toGMTString()\
  \ +\n            \"gasPrice: \" + e.gasPrice +\n            \"gas: \" + e.gas +\n\
  \            \"input: \" + e.input);\n        }\n      });\n    }\n  }\n}\n```\n\
  (Images/rId624_edit_140086949766480.png)\n\n2. 随后你可以在 Geth JavaScript 控制台中查看某些交易，例如所有账户的最后交易：`getTransactionsByAccount(\"\
  *\")`\n\n![](img/rId625_edit_140086949768976.png)\n\n3. 或者在特定区块范围内特定账户：`getTransactionsByAccount(eth.accounts\
