  18. 文档记录\n\n![](img/rId66_edit_14008694777420.png)\n\n\n\n\n以下文本侧重于简单性和良好的可读性。目前仅使用命令行工具。图形化工具将在稍后介绍。\n\
  \n![](img/rId77_edit_140086947771920.png)\n\n在本示例中，将建立一个仅存在于个人电脑上的私有以太坊区块链。稍后将展示如何使用公共以太坊区块链。\n\
  \n![](img/rId78_edit_140086947771984.png)\n\n显示的命令适用于 Windows 系统。当使用 Linux 或 Mac\
  \ OS X 时，通常只需将路径规范中的 `\\` 替换为 `/`，将 PATH 规范中的 `;` 替换为 `:`，并将占位符 `%MEINE_VARIABLE%`\
  \ 替换为 `$MEINE_VARIABLE`。\n\n按照下面列出的步骤操作。\n\n### 1. 切换到你所在的工作目录（例如 `\\MyWorkspace`）\n\
  \n![](img/rId79_edit_140086947770512.jpeg)\n\n进入你的 Workspace 并执行以下命令：\n\n```bash\n\
  cd \\MyWorkspace\n```\n\n![](img/rId81_edit_140086947770704.png)\n\n```bash\nmkdir\
  \ EthereumDemo\n```\n\n![](img/rId82_edit_140086947770640.png)\n\n```bash\ncd EthereumDemo\n\
  ```\n\n![](img/rId83_edit_140086947770576.png)\n\n```bash\nmkdir solc\n```\n\n![](img/rId84_edit_140086947770768.png)\n\
  \n```bash\nmkdir src\n```\n\n![](img/rId85_edit_140086947770832.png)\n\n```bash\n\
  tree /F\n```\n\n![](img/rId86_edit_140086947770896.png)\n\n### 2. 安装 solc (Solidity\
  \ 编译器)\n\n从 `https://github.com/ethereum/solidity/releases` 下载适用于你操作系统的安装文件，例如适用于\
  \ Windows 的：`solidity-windows.zip`。\n\n![](img/rId89_edit_140086947770960.png)\n\
  \n在 Windows 下，将此 zip 文件解压到目录：\n`\\MyWorkspace\\EthereumDemo\\solc`。\n\n对于其他操作系统，请以类比的方式操作或按照：[安装\
  \ Solidity 编译器](https://solidity.readthedocs.io/en/develop/installing-solidity.html)\
  \ 中的描述进行。\n\n1. 在命令行窗口执行：\n```bash\ncd \\MyWorkspace\\EthereumDemo\\solc\nsolc.exe\
  \ --version\nsolc.exe --help\n```\n\n两个命令都必须显示合理的结果。\n\n![](img/rId92_edit_140086947771024.png)\n\
  \n### 4. 安装 geth (Go Ethereum)\n\n![](img/rId94_edit_140086947771152.jpeg)\n\n从\
  \ `https://geth.ethereum.org/downloads/` 下载适用于你操作系统的 Geth 版本，例如适用于 Windows 的 \"\
  Geth 1.8.2 for Windows\"。\n\n不要使用 Geth 1.8.0 和 1.8.1 版本，因为会出现 [Web3j](https://github.com/web3j/web3j/issues/318)\
  \ Issue 318 问题。对于 Windows，你将获得文件 `geth-windowsamd64-1.8.2-b8b9f7f4.exe`。运行此文件。安装会将\
  \ Geth 目录扩展 Windows PATH。\n\n![](img/rId97_edit_140086947771344.png)\n\n对于其他操作系统，请按照\
  \ `https://www.ethereum.org/cli` 或 `https://github.com/ethereum/ethereum/wiki/Building-Ethereum`\
  \ 中的描述操作。\n\n![](img/rId100_edit_140086947771216.png)\n\n[构建以太坊](https://github.com/ethereum/ethereum/wiki/Building-Ethereum)\n\
  \n1. 打开一个新的命令行窗口以使配置和 PATH 扩展生效。在其中执行：\n```bash\ncd \\MyWorkspace\\EthereumDemo\n\
  geth version\ngeth help\n```\n\n![](img/rId101_edit_140086947771472.png)\n![](img/rId102_edit_140086947771600.png)\n\
  ![](img/rId103_edit_14008694777128.png)\n\n两个命令都必须显示合理的结果。你可以在[命令行选项](https://github.com/ethereum/ethereum/wiki/Command-Line-Options)\
  \ 下找到 `geth` 的选项列表。\n\n![](img/rId105_edit_140086947771792.png)\n\n### 6. 元区块\n\n\
  要启动自己的私有以太坊区块链，需要手动初始化元区块。在 `src` 子目录中创建文件：`genesis-block.json`。\n\n![](img/rId106_edit_140086947771304.png)\n\
  \n```json\n{\n  \"alloc\": {},\n  \"coinbase\": \"0x0000000000000000000000000000000000000000\"\
  ,\n  \"config\": {},\n  \"difficulty\": \"0x4000\",\n  \"extraData\": \"0x4711\"\
  ,\n  \"gasLimit\": \"0xffffff\",\n  \"mixhash\": \"0x00000000000000000000000000000000\"\
  ,\n  \"nonce\": \"0x0000000000000042\",\n  \"parentHash\": \"0x00000000000000000000000000000000\"\
  ,\n  \"timestamp\": \"0x00\"\n}\n```\n\n保存时，确保文件以 Unix 换行符和无 BOM 的 ASCII 格式保存。你可以在[创建元区块](https://github.com/ethereum/ethereum/wiki/Private-network)\
  \ 查看关于元区块的一些注意事项。\n\n![](img/rId108_edit_140086947716112.png)\n\n1. 通过运行以下命令创建元区块：\n\
  ```bash\ncd \\MyWorkspace\\EthereumDemo\ngeth -datadir \"Private-Blockchain\" init\
  \ src/genesisblock.json\n```\n\n![](img/rId109_edit_140086947716368.png)\n\n你会收到如下信息：\n\
  \n![](img/rId111_edit_140086947716496.png)\nSuccessfully wrote genesis\n\n### 8.\
  \ 启动自己的以太坊区块链（目前不挖矿）：执行（一行）：\n\n```bash\ngeth -networkid 77 --identity \"MyDevChain\"\
  \ -datadir \"Private-Blockchain\" --nodiscover --rpc --rpcapi \"db, net, web3, personal,\
  \ txpool\" --rpccors \"*\" console\n```\n\n![](img/rId112_edit_140086947776624.png)\n\
  ![](img/rId113_edit_140086947776752.png)\n\n你会收到如下信息：\n\n![](img/rId114_edit_140086947776880.png)\n\
  Starting peer-to-peer node\nHTTP endpoint opened: `http://127.0.0.1:8545`\n欢迎来到\
  \ Geth JavaScript 控制台！你获得了 Geth-JavaScript-Console，你可以在其中输入 Geth-JavaScript 命令。\n\
  \n### 9. 分别查看 `web3.eth` 命令的文档：[web3.eth](https://web3js.readthedocs.io/en/1.0/web3-eth.html)。Web3\
  \ 0.20.x JavaScript API。\n\n查询你正在使用的 Web3.js 版本：\n```javascript\nweb3.version.api\n\
  ```\n\n![](img/rId118_edit_140086947771136.png)\n![](img/rId119_edit_140086947771264.png)\n\
  \n1. 测试账户是否已存在。如果 Ctrl + V 插入命令无效，请尝试右鼠标键点击“插入”并回车：\n```javascript\nweb3.eth.accounts\n\
  ```\n\n![](img/rId120_edit_140086947771392.png)\n\n你会得到空结果：\n\n![](img/rId121_edit_140086947771752.png)\n\
  \n### 11. 创建账户\n\n创建一个账户（想一个复杂的密码并记住它）：\n\n```javascript\npersonal.newAccount(\"\
  My Passphrase\")\n```\n\n![](img/rId122_edit_140086947771648.png)\n\n你会收到一个 40 位的十六进制作为账户地址，例如：\n\
  `0x2f94831a57a9604106d9d0c24583b12f80f2a5`\n\n1. 再次测试现有账户：\n```javascript\nweb3.eth.accounts\n\
  ```\n\n![](img/rId124_edit_140086947771904.png)\n例如，这次你会得到：`[\"0x2f94831a57a9604106d9d0c24583b12f80f2a5\"\
  ]`\n\n### 13. 查询账户余额\n\n在 `src` 子目录中创建 JavaScript 文件：`checkAllBalances.js`。\n\n\
  ![](img/rId126_edit_140086947718032.png)\n\n```javascript\nfunction checkAllBalances\
  \ () {\n  web3.eth.getAccounts (function (err, accounts) {\n    accounts.forEach\
  \ (function (id) {\n      web3.eth.getBalance (id, function (err, balance) {\n \
  \       console.log (\"\" + id + \": \\tbalance:\" + web3.fromWei (balance, \"ether\"\
  ) + \"ether\");\n      });\n    });\n  });\n}\n\ncheckAllBalances ()\n```\n\n1.\
  \ 在 Geth JavaScript 控制台中运行：`loadScript ('src / checkAllBalances.js')`\n\n你收到：\n\n\
  ![](img/rId127_edit_140086947778160.png)\n\n\n\n\n\n# 0x2f94831a57a96041064d9d0c24583b12f807f2a5:balance:\
  \ 0 ether\n\n### 15. 手动开始挖矿：\n\n执行（不要过快地连续执行单个 JavaScript 命令）：\n\n```\nminer.setEtherbase\
  \ (web3.eth.accounts [0])\nminer.start (1)\n```\n\n![](img/rId129_edit_140086947118288.png)\n\
  \n你将看到持续输出的挖矿命令：\n\n![](img/rId130_edit_140086947118416.png)\n\n启动挖矿操作 Commit\n\
  成功密封新挖矿任务 Successfully sealed\n挖掘新区块潜在区块 potential block\n. ...\n\n如果挖矿没有启动：有时挖矿可能在\
  \ 10 分钟后才开始。\n给挖矿一些时间，大约一分钟。之后你将在账户上发现 Ether。\n\n### 16. 退出测试以太坊区块链：exit\n\n![](img/rId131_edit_140086947118544.png)\n\
  \n### 17. 启动脚本：\n\n在 EthereumDemo 项目目录中创建名为 `start-test-Ethereum-Blockchain.bat`\
  \ 的批文件，内容如下（一行）：\n\n```bash\ngeth --networkid 77 --identity \"MeineDevChain\"\n\
  ```\n\n![](img/rId132_edit_140086947118672.png)\n\n*   `- datadir \"Private-Blockchain\"\
  \ --nodiscover --rpc`\n*   `- rpcapi \"db, eth, net, web3, personal, txpool\"`\n\
  *   `- rpccorsdomain \"*\" --mine --minerthreads 1 console 2 >> priv-geth.log`\n\
  \n![](img/rId133_edit_140086947118800.png)\n\n注意，这次通过 `\"--mine -- minerthreads\
  \ 1\"` 自动激活了挖矿，并且通过 `\"2 >> priv-geth.log\"` 将大量输出重定向到日志文件中。\n\n### 18. 启动我们包含挖矿的测试以太坊区块链：执行：\n\
  \n```bash\ncd \\\\ MeinWorkspace \\\\ EthereumDemo\nstart-test-Ethereum-Blockchain.bat\n\
  ```\n\n例如，你会得到：\n\n![](img/rId134_edit_140086947118928.png)\n\n欢迎来到 Geth JavaScript\
  \ 控制台！\ninstance: Geth / MeineDevChain / v1.8.2-stable-b8b9f7f4 / windows-amd64\
  \ / go1.9 coinbase:\n0x2f94831a57a96041064d9d0c24583b12f807f2a5\nat block: 1448\
  \ (Mon, 22 Jan 2018 12:53:13 CET)\ndatadir: \\\\ MeinWorkspace \\\\ EthereumDemo\n\
  modules: admin: 1.0 debug: 1.0 eth: 1.0 miner: 1.0 net: 1.0 personal: 1.0 rpc: 1.0\
  \ txpool: 1.0 web3: 1.0\n\n### 19. 在 Geth JavaScript 控制台中运行：\n\n```javascript\n\
  loadScript ('src / checkBalances.js')\n```\n\n![](img/rId135_edit_140086947119056.png)\n\
  \n这次你将收到一个正数金额，例如：\n\n![](img/rId136_edit_1400869471116048.png)\n0x2f94831a57a96041064d9d0c24583b12f807f2a5:balance:\
  \ 4.711 ether\n\n1. 执行进一步命令以互相了解，例如：\n\n```javascript\nadmin.datadir()\n```\n\n\
  ![](img/rId137_edit_140086947115152.png)\n\n```javascript\nadmin.nodeInfo()\n```\n\
  \n![](img/rId138_edit_140086947115280.png)\n\n### eth\n\n```javascript\neth.getBlock\
  \ (\"latest\")\n```\n\n![](img/rId139_edit_140086947115408.png)\n\n```javascript\n\
  miner.getHashrate ()\n```\n\n![](img/rId140_edit_140086947115536.png)\n\n```javascript\n\
  personal.listAccounts()\n```\n\n![](img/rId141_edit_140086947115664.png)\n\n```javascript\n\
  txpool.content()\n```\n\n![](img/rId142_edit_140086947115792.png)\n\n### web3\n\n\
  请查看管理命令的解释：https://github.com/ethereum/ethereum/wiki/Management-APIs.\n\n![](img/rId144_edit_140086947115144.png)\n\
  \n### 21. 退出测试以太坊区块链\n\n![](img/rId145_edit_140086947115044.png)\n\n### 22. 检查密钥文件和测试以太坊区块链：执行：\n\
  \n![](img/rId147_edit_140086947115088.png)\n\n这是密钥文件：https://www.torsten-horn.de/techdocs/\n\
  \n![](img/rId149_edit_140086947115320.png)\nUTC - 2018-01-22T09:50-2f94831a57a96041064d9d0c24583b12f807f2a5\n\
  \n### 23. 我们的测试以太坊区块链结构现在如下（Windows 和 Linux 下）：\n\n![](img/rId150_edit_140086947115377.png)\n\
  \n```text\n\\\\ MeinWorkspace \\ EthereumDemo\n- start-test-Ethereum-Blockchain.bat\n\
  - priv-geth.log\n- target\n  - Greeter.abi\n  - Greeter.bin\n- src\n  - checkBalances.js\n\
  \  - Greeter.js\n- genesis.json\n```\n\n### 第一个智能合约：hello world\n\n![](img/rId151_edit_140086947115014.png)\n\
  \n遵循以下步骤：\n\n1. [基础安装](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Installation-Geth-Solc-Test-Blockchain)\
  \ 如下：Geth、Solc、测试以太坊区块链。上述步骤都已执行。\n\n![](img/rId152_edit_140086947115043.png)\n\n\
  这个 demo 展示了：\n-   一个简单的 Solidity 脚本可以像这样。\n-   Solidity 脚本被编译。\n-   智能合约被部署到以太坊区块链。\n\
  \n在这个 demo 中，仅使用了命令行工具。请在下方查看。\n\n![](img/rId153_edit_140086947115026.png)\n\n2.\
  \ 切换到你的 EthereumDemo 目录：cd \\\\ MeinWorkspace \\\\ EthereumDemo\n\n![](img/rId154_edit_140086947115068.png)\n\
  \n3. 在 src 子目录中创建 Greeter.sol：\n\n```solidity\npragma solidity 0.49;\n\ncontract\
  \ mortal {\n    address owner;\n\n    function Mortal() public {\n        owner\
