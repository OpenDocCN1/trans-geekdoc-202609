  \n### 5. 项目开发\n8. 点击网站左上角的加号启动新项目。在“File Name”中输入：`ExampleContract.sol`\n\n9. 在位于中间标题为“File\
  \ / ExampleContract.sol”的窗口中粘贴来自 `https://docs.oraclize.it/#ethereum-quickstart`\
