  \ `[public] post`。然后在自己的独立窗口中打开该帖子，并复制浏览器中显示的 URL，例如：`\"https: //plus.google.com/1016\
  \ ... / posts / ZZLx ...\"`。请包含此 URL [`faucet.rinkeby.io`](https://faucet.rinkeby.io/)并在右侧“Give\
  \ me Ether”旁边选择：“3 Ethers / 8 hours”。你将收到确认信息“Funding request accepted”。然后等待大约 1\
  \ 分钟进行矿。\n\n## 13. 由于 Rinkeby-Ethereum-Blockchain 是公有链，你可以通过公共的 Etherscan 互联网服务查询账户余额：`https://rinkeby.etherscan.io/address/`[`[我的账户](https://rinkeby.etherscan.io/address/0x39bbbe004272e72dba0c13a0e60443cfcceead3c)\
