  ```\n\n## 15. 在下方查看如何使用 Node.js 或 Embark 通过 DApp 在 truffle 区块链中调用智能合约，以便于快速开发和快速测试\n\
  \n此演示展示了 [Embark 开发框架](https://github.com/embark-framework) 的安装：\n- 如何使用 Embark\
  \ 创建、部署和执行你自己的智能合约。\n- 如何使用 Embark 和集成的测试区块链用 JavaScript 创建非常快速的测试。\n- 请注意：此演示仅使用了\
  \ Embark 许多功能中的一小部分。\n- 查看 [Embark 文档](https://embark.readthedocs.io/)，它可以与上面介绍的\
  \ [ Truffle](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Truffle)\
  \ 相竞争。\n\n使用了以下版本：\n- `nvm` 0.33.8\n- `npm` 5.6.0\n- `node` 9.5.0\n- `Solidity`\
  \ 0.4.17\n- `embark` 2.6.6\n- `ganache-cli / ethereumjs-testrpc` 6.0.3\n- `Ubuntu`\
  \ 04/16/3 LTS\n- `Windows 10` 版本 1709\n\n如顶部所示，使用了 WSL (Windows 的 Linux 子系统) 的 bash。如果你直接在\
