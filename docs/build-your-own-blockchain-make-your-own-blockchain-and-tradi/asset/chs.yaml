  - 如何实现回调方法 `function __callback (bytes32 myid, string result)`\n- 以及如何通过 `oraclize_query(\"\
  \", json(http://api.fixer.io/latest?symbols = USD, GBP).rates.GBP)` 查询外部 JSON 接口并从\
