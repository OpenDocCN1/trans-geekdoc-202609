  \ 测试：`MeinTokenTest.js` ![](img/rId504_edit_140086949246352.png)\n\n```javascript\n\
  const MyToken = artifacts.require(\"MyToken\");\ncontract('MyToken', function ()\
  \ {\n  let instance;\n  before(async function () {\n    instance = await MeinToken.deployed();\n\
  \  });\n  it(\"Initial MeinToken account balances:999/0\", async function () {\n\
  \    let balance0 = await instance.balanceOf(accounts[0]);\n    let balance1 = await\
  \ instance.balanceOf(accounts[1]);\n    assert.equal(balance0.valueOf(), 999, \"\
  Account 0 MeinToken balance is not 999\");\n    assert.equal(balance1.valueOf(),\
  \ 0, \"Account 1 MeinToken balance is not 0\");\n  });\n  it(\"Transfer of 11 MeinToken,\
  \ then988/11\", async function () {\n    await instance.transfer(accounts[1], 11);\n\
  \    let balance0 = await instance.balanceOf(accounts[0]);\n    let balance1 = await\
  \ instance.balanceOf(accounts[1]);\n    assert.equal(balance0.valueOf(), 988, \"\
  Account 0 MeinToken balance is not 988\");\n    assert.equal(balance1.valueOf(),\
  \ 11, \"Account 1 MeinToken balance is not 11\");\n  });\n});\n``` 你必须将初始金额 999\
  \ 发送至上述 [2_MyToken_migration.js](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#MeinToken)\
