    \ Run this file. The installation extends the Windows search PATH to include the\
    \ Geth directory.\n\n![](Images/rId97_edit_140086947771344.png)\n\nFor other operating\
    \ systems, proceed as described under: `https://www.ethereum.org/cli` or `https://github.com/ethereum/go-ethereum/wiki/Building-Ethereum`\n\
    \n![](Images/rId100_edit_140086947771216.png)\n\n[- ethereum / wiki / Building-Ethereum.](https://github.com/ethereum/go-ethereum/wiki/Building-Ethereum)\n\
    \n1. Open a new command line window for configuration changes and PATH extensions\
    \ to take effect. In it do:\n```bash\ncd \\MyWorkspace\\EthereumDemo\ngeth version\n\
    geth help\n```\n\n![](Images/rId101_edit_140086947771472.png)\n![](Images/rId102_edit_140086947771600.png)\n\
    ![](Images/rId103_edit_140086947771728.png)\n\nBoth commands must show plausible\
    \ results. You can also find a list of the command line options of `geth` under\
    \ [Command line options](https://github.com/ethereum/go-ethereum/wiki/Command-Line-Options).\n\
    \n![](Images/rId105_edit_140086947771792.png)\n\n### 6. Genesis block\n\nTo start\
    \ your own private Ethereum blockchain, manual initialization of the first Genesis\
    \ block is required. Create the JSON file in `src` subdirectory: `genesis-block.json`.\n\
    \n![](Images/rId106_edit_140086947716304.png)\n\n```json\n{\n  \"alloc\": {},\n\
    \  \"coinbase\": \"0x0000000000000000000000000000000000000000\",\n  \"config\"\
    : {},\n  \"difficulty\": \"0x4000\",\n  \"extraData\": \"0x4711\",\n  \"gasLimit\"\
    : \"0xffffff\",\n  \"mixhash\": \"0x00000000000000000000000000000000\",\n  \"\
    nonce\": \"0x0000000000000042\",\n  \"parentHash\": \"0x00000000000000000000000000000000\"\
    ,\n  \"timestamp\": \"0x00\"\n}\n```\n\nWhen saving, make sure that the file must\
    \ be saved with Unix line characters and as an ASCII file without UTF-BOM. You\
