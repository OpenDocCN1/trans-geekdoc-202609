    import org.web3j.protocol.core.response.EthGetTransaction;\nimport org.web3j.protocol.core.response.EthSendTransaction;\n\
    import org.web3j.protocol.core.response.TransactionReceipt;\nimport org.web3j.protocol.http.HttpService;\n\
    import org.web3j.tx.Contract;\nimport org.web3j.tx.ManagedTransaction;\nimport\
    \ org.web3j.utils.Convert;\nimport java.math.BigInteger;\nimport java.util.Optional;\n\
    \npublic class EtherTransfer{\n    public static void main(String[] args) throws\
    \ exception {\n        // 扩展程序以读取或传输参数：\n        transfer(\"http://localhost:8545\"\
    ,\n            在此在此处输入两个账户的地址（web3.eth.accounts 的结果）：\n            \"0x4597a26af991b297b5ccc2a8c0966ea1a7035\"\
    ,\n            \"0x63d7d5b64dc9cc074dedf87971f8b0777de26\",\n            在此处输入要传输的金额和口令：\n\
    \            \"10\", \"My Test Passphrase\");\n    }\n\n    public static void\
    \ transfer(String ethereumUrl, String senderAdresse, String receiverAddress, String\
    \ amountEther, String passphrase) throws exception {\n        Admin admin = Admin.build(new\
    \ HttpService(ethereumUrl));\n        PersonalUnlockAccount personalUnlockAccount\
    \ = admin.personalUnlockAccount(senderaddress, passphrase).send();\n        if\
    \ (!personalUnlockAccount.accountUnlocked()) {\n            System.out.println(\"\
    \\nError: Account unlock failed.\");\n            return;\n        }\n       \
    \ Web3j web3j = Web3j.build(new HttpService(ethereumUrl));\n        EthGetTransaction\
    \ txCount = web3j.ethGetTransactionCount(senderAdresse, DefaultBlockName.LATEST).sendAsync().get();\n\
    \        BigInteger nonce = txCount.getTransactionCount();\n        BigInteger\
    \ amount = Convert.toWei(amountEther, Convert.Unit.ETHER).toBigInteger();\n  \
    \      Transaction transaction = Transaction.createEtherTransaction(senderAdresse,\
    \ nonce, ManagedTransaction.GAS_PRICE, Contract.GAS_LIMIT, receiverAddress, amount);\n\
    \        EthSendTransaction response = web3j.ethSendTransaction(transaction).sendAsync().get();\n\
    \        if (response.hasError()) {\n            System.out.println(\"\\nError:\"\
    \ + response.getError().getMessage());\n            return;\n        }\n     \
    \   String txHash = response.getTransactionHash();\n        System.out.print(\"\
    \\nTxHash:\" + txHash + \"\\nWaiting for mining\");\n        for (int i = 0; i\
    \ < 600; i++) {\n            Optional<TransactionReceipt> transactionReceipt =\
    \ web3j.ethGetTransactionReceipt(txHash).send().getTransactionReceipt();\n   \
    \         if (transactionReceipt.isPresent()) {\n                System.out.println(\"\
    \\nTransfer of\" + amountEther + \"Ether completed, amount of gas used: \"+ +\
    \ transactionReceipt.get().getGasUsed());\n                return;\n         \
    \   }\n            System.out.print(\".\");\n            Thread.sleep(1000);\n\
    \        }\n        System.out.println(\"\\nThe transfer could not be completed\
    \ within 10 minutes. Is mining active?\");\n    }\n}\n```\n\n![](img/rId311_edit_14008694916692.png)\n\
