    ```bash\nmkdir solc\n```\n\n![](img/rId84_edit_140086947770768.png)\n\n```bash\n\
    mkdir src\n```\n\n![](img/rId85_edit_140086947770832.png)\n\n```bash\ntree /F\n\
    ```\n\n![](img/rId86_edit_140086947770896.png)\n\n### 2. 安装 solc (Solidity 编译器)\n\
    \n从 `https://github.com/ethereum/solidity/releases` 下载适用于你操作系统的安装文件，例如适用于 Windows\
    \ 的：`solidity-windows.zip`。\n\n![](img/rId89_edit_140086947770960.png)\n\n在 Windows\
