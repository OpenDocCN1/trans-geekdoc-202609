    \ Error processing request: unknown transaction`\n\n那么你可能在使用 Geth 和 Web3j 的某种不兼容的组合。例如，当\
    \ Geth 1.8.0 到 1.8.1 与 Web3j 3.2.0 到 3.3.1 组合时，会出现此错误。另请参见：\n\n`Web3j` [Issue\
    \ 318.](https://github.com/web3j/web3j/issues/318)\n\n![](img/rId350_edit_140086954838736.png)\n\
    \n请使用 1.7.3 或至少 1.8.2 版本的 Geth 以避免此错误。\n\n![](img/rId351_edit_140086954837200.png)\n\
    \n## 使用 Java 智能合约的 DApp 网站\n\n### 此演示展示了：\n\n![](img/rId352_edit_140086954836816.jpeg)\n\
    \n- 可以创建一个 `DApp` [(去中心化应用)](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html#DApp)，并使用上述以太坊智能合约\
    \ [`MyToken`](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Mini-Token-Demo)。\n\
    - 如何使用由 [Java](https://www.java.com/de/about/whatis_java.jsp) 和 [JSP is](http://www.oracle.com/technetwork/java/javaee/jsp/index.html)\
    \ 创建的网站来实现。\n- 像一个 Maven Web 项目一样，通过集成 [Web3j](https://web3j.io/) 并使用 [Jetty web\
    \ server](https://www.eclipse.org/jetty/) 可以可以部署运行。\n- 如何通过 Java DApp 网站转移你自己的智能合约代币。\n\
    \n此演示使用了 `JSP` (JavaServer Pages) 以保持示例简洁。](http://www.oracle.com/technetwork/java/javaee/jsp/index.html)。在实际应用中，更有可能使用可以与\
    \ Java 配合的其他 Web 框架，例如 `JSF`、`Spring MVC` [or](https://www.torsten-horn.de/techdocs/jsf.htm)\
    \ `Angular`](https://www.torsten-horn.de/techdocs/Spring-DI-AOP.html#Spring-MVC-Demo)。\n\
    \n![](img/rId357_edit_140086954837456.png)\n\n作为一个智能合约，上面显示的再次使用了 [`MeinToken`](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Mini-Token-Demo)\
    \ 智能合约](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Mini-Token-Demo)。\n\
    \n![](img/rId360_edit_140086954838544.png)\n\n## 按照下面列出的步骤操作。\n\n1. 必须执行下 [使用\
    \ Web3j 和 Java 转移你自己的智能合约代币](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#MeinTokenWeb3jDemo)\
    \ [and](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#MeinTokenWeb3jDemo)\
    \ 中描述的步骤。\n\n![](img/rId361_edit_140086954839760.png)\n\n2. 在 `EthJavaDApp` 项目目录中，替换\
    \ Maven 项目配置文件的内容：`pom.xml`\n\n![](img/rId362_edit_140086954838416.png)\n\n```xml\n\
    <project xmlns = \"http://maven.apache.org/POM/4.0.0\" xmlns: xsi = \"http://www.w3.org/2001/XMLSchema-instance\"\
    \nxsi: schemaLocation = \"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\
    \ \">\n<modelVersion> 4.0.0 </modelVersion>\n<groupId> de.mycompany.myproject\
    \ </groupId>\n<artifactId>EthJavaDApp</artifactId>\n<version> 1.0-SNAPSHOT </version>\n\
    <packaging> was </packaging>\n<name> EthJavaDApp </name>\n<properties>\n<project.build.sourceEncoding>\
    \ ISO-8859-1 </project.build.sourceEncoding>\n</properties>\n<build>\n<plugins>\n\
    <plugin>\n<groupId> org.apache.maven.plugins </groupId>\n<artifactId> maven-compiler-plugin\
    \ </artifactId>\n<version> 3.7.0 </version>\n<configuration>\n<source> 1.8 </source>\n\
    <target> 1.8 </target>\n</configuration>\n</plugin>\n<plugin>\n<groupId> org.eclipse.jetty\
    \ </groupId>\n<artifactId> jetty-maven-plugin</artifactId>\n<version> 9.4.0 </version>\n\
    <configuration>\n<contextPath>/</contextPath>\n</configuration>\n</plugin>\n</plugins>\n\
    </build>\n</project>\n```\n\n3. 创建 `src/main/webapp` 目录。\n\n4. 在 `src/main/webapp/WEB-INF`\
    \ 目录下创建 `web.xml` 文件：\n\n![](img/rId363_edit_1400869548)\n\n5. 在 `src/main/webapp`\
    \ 目录下创建 `index.jsp` 文件：\n\n![](img/rId364_edit_14008695483732.png)\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<web-app xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\
    \n         xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:schemaLocation=\"\
    http://xmlns.jcp.org/xml/ns/javaee http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd\"\
    \n         version=\"3.1\">\n    <welcome-file-list>\n        <welcome-file>index.jsp</welcome-file>\n\
    \    </welcome-file-list>\n</web-app>\n```\n\n"
