    \ [Ethereum](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Installation-Geth-Solc-Test-Blockchain)\
    \ **区块链**。必须执行上述描述的步骤。\n\n![](img/rId315_edit_140086949848528.png)\n\n1. 启动测试以太坊区块链：`cd\
    \ \\ MeinWorkspace \\ EthereumDemo start-test-Ethereum-Blockchain.bat`\n\n![](img/rId316_edit_140086949848464.png)\n\
    \n**在 Geth JavaScript 控制台中查询账户和以太坊余额：**\n\n```\nloadScript ('src / checkAllBalances.js')\n\
    ```\n\n![](img/rId317_edit_140086949848336.png)\n\n必须至少有两个账户。如果只有一个，请按照上述描述的方法创建另一个。\n\
    \n![](img/rId318_edit_140086949848976.png)\n\n## 10. 现在有三种选择：\n\n- 最合理的方案是，至少在开发阶段，使用\
    \ IDE（例如，[IntelliJ IDEA](https://www.torsten-horn.de/techdocs/IntelliJ-IDEA.html)\
    \ 或 [Eclipse](https://www.torsten-horn.de/techdocs/java-eclipse.htm)) 在其中打开并运行项目。\n\
    \n![](img/rId319_edit_140086949848080.png)\n\n- 或者，你可以通过组装插件（assembly plug-in）来扩展\
    \ `pom.xml`，如下文所示：[包含可执行 jar 文件](https://www.torsten-horn.de/techdocs/maven.htm#MvnJarMitLibs)\n\
    \n![](img/rId321_edit_140086949848720.png)\n\n[带有组装插件的依赖](https://www.torsten-horn.de/techdocs/maven.htm#MvnJarMitLibs)\n\
    \n![](img/rId322_edit_140086949849168.png)\n\n然后你就可以直接运行生成的 jar 文件。\n\n- 第三种可能性是将所有需要的\
    \ jar 库拷贝到子目录，将此目录添加到类路径中，并用运行编译后的 `EtherTransfer.class`。\n\n## 11. 运行 EtherTransfer\
    \ 程序。\n例如，你将收到：\n\n![](img/rId323_edit_140086949850384.png)\n\n```\nTxHash: 0xdc96314d6443c81d86c7a4afc6413b2b4127fee739b9bb7ae607ef7267bad417\
    \ Waiting for mining ........................................ Transfer of 10 Ether\
    \ completed, amount of gas used: 21000\n```\n\n使用你的钱包应用程序或在 Geth JavaScript 控制台中通过\
    \ `loadScript ('src / checkAllBalances.js')](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#checkAllBalances.js)\
    \ 以太坊账户余额。\n\n10 个以太成功从一个账户传输到另一个账户。\n\n![](img/rId325_edit_140086949851024.png)\n\
    \n## 使用 Web3j 和 Java 传输自己的智能合约令牌\n\n此演示展示了：\n\n![](img/rId326_edit_140086949849552.jpeg)\n\
    \n- 如何使用 Java 与以太坊区块链上的智能合约交互。\n- 如何从智能合约定义文件自动生成 Java 接口类。\n- 如何使用 Java 程序传输你自己的智能合约令牌。\n\
    - 此示例创建了一个 Java 命令行应用程序。在下方创建了与 Java 智能合约对应的 [DApp 网站](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Java-DApp-Webseite)。\n\
    \n![](img/rId327_edit_140086949847824.png)\n\n上述显示用作智能合约 [MeinToken](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Mini-Token)。\n\
    \n![](img/rId328_edit_14008694985012.png)\n\n执行以下操作：\n\n上述的 [MeinToken](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Mini-Token)\
    \ **智能合约**与 [Web3j 和 Java 传输 Transfer of Ether with Web3j and Java](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Mini-Token)\
    \ 所示的步骤已执行。\n\n2. 为了与智能合约交互，从 [github.com/web3j/releases](https://github.com/web3j/releases)\
    \ 下载 `web3j` 工具。\n\n将其解压到 `EthereumDApp` 目录。\n\n3. 下述命令假设 `EthereumDApp` 目录位于以太坊区块链上的\
    \ [MeinToken](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Mini-Token)\
    \ **智能合约**。如果不同，请调整路径：\n\n4. 在 `src/main/java/de/project` 子目录中创建 Java 类：\n\n`EtherTransfer.java`\n\
    \n```java\npackage de.project;\n// ... (省略代码，实际翻译应根据原文保留)\n```\n\n(此处为代码块，保持不翻译)\n\
    \n![](img/rId328_edit_14008694985012.png)\n\n"
