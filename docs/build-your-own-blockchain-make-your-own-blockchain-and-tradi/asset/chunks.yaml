    ![](img/rId39_edit_140086947773520.png)


    4. 使用图形界面（`GUI`）的 Remix 编译器](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Remix-IDE)
    5.--------------. ](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Remix-Compiler)


    ![](img/rId41_edit_14008694777358.png)


    5. 使用 GUI 进行 `MeinToken`](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#MeinToken)


    ![](img/rId43_edit_14008694777364.png)


    6. 基于 `Node.js` 的 DApp 网页-](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Node.js-App)


    ![](img/rId44_edit_14008694777368.png)


    7. 使用 `Web3` 进行 `Ether`](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Ether)


