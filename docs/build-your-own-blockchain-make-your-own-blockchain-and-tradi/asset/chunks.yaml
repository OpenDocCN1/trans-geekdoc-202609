    \ 下找到 `geth` 的选项列表。\n\n![](img/rId105_edit_140086947771792.png)\n\n### 6. 元区块\n\
    \n要启动自己的私有以太坊区块链，需要手动初始化元区块。在 `src` 子目录中创建文件：`genesis-block.json`。\n\n![](img/rId106_edit_140086947771304.png)\n\
