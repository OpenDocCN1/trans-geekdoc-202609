    ## 区块链


    | | | 查找 | | | |

    | --- | --- | --- | --- | --- |

    | | | | | | |

    | | | | | | |


    [区块链](https://de.wikipedia.org/wiki/Blockchain)是指一个不断扩展的数据记录列表，这些记录通过加密过程相互链接，使得数据记录链是不可更改且防伪造的。新的交易经过验证并打包成区块，区块在通过共识算法并发送到所有其他区块链服务器后会被添加到区块链中。


    ![](img/rId17_edit_140086947772560.jpeg)


    [以太坊](https://www.ethereum.org/) 基于公有区块链，该区块链用于](https://www.ethereum.org/)许多以太坊服务器上的去中心化对等网络，并以](https://www.ethereum.org/)
    `DLT` 的方式运行。以太坊](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html#DLT)包含了加密货币`Ether`
    并且](https://www.ethereum.org/)还支持“智能合约”。这使得合约](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html#Kryptowaehrung)可以被编程，然后进行电子化的执行和检查。](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html#Ethereum-Ether-ETH-ETC)为了这一目的，创建了脚本（主要使用编程语言
    `Solidity`）并在以太坊虚拟机（`EVM`）中执行。


    ![](img/rId23_edit_140086947773264.png)


    这开启了非常多样的可能性，例如许多项目是基于 `ICOs` 的。](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html#ICO)然而，在编写智能合约时必须格外小心：那些被编程的](Images/rId28_edit_140086947773200.png)安全漏洞可能会导致致命后果，例如“DAO
    被黑客攻击”，](https://www.wired.de/collection/wie-aus-dem-hack-blockchain-fonds-ein-wirtschaftrimi-wurde)这导致了以太坊的硬叉——以太坊经典（Ethereum
    Classic）。


    ![](img/rId30_edit_140086947773008.png)


    基础解释可以在此处找到：[加密货币](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html)、`Bitcoin`、以太坊、区块链](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html)。下面展示了几个智能合约的简单编程示例。


    Images/rId32_edit_14008694777328.png)


    1. 基础安装：`Geth`、`Solc`、私有测试以太坊`blockchain](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Installation-Geth-Solc-Test-Blockchain)](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Installation-Geth-Solc-Test-Blockchain)


    ![](img/rId35_edit_140086947773392.png)


