  trans: "\n点击右上三分处的“Run”选项卡，在“Environment”下选择“Web3 Provider”，确认“Are you sure you\
    \ want to connect to an ethereum node?”提示框，并在“Web3 Provider Endpoint”中输入“http:\
    \ // localhost: 8545”。\n\n### 9. 测试连接：\n\n在下方中间的窗口的最底部，紧邻 `>` 符号的地方，输入：\n\n```javascript\n\
    web3.eth.accounts\n```\n\n你将收到你的账户地址，例如：\n\n![](img/rId229_edit_140086947600656.png)\n\
    \n* `web3.eth.accounts`\n\n```json\n[\n  \"0x4597a26af9991b297b5ccc2a8c0966e9a1a17035\"\
    ,\n  \"0x63d7d5b64dc9cc0744dedf87971f8b0777d7e226\"\n]\n```\n\n### 10. 将你的 MeinToken\
    \ 智能合约部署到本地区块链：\n\n在下方中间的窗口的最底部，紧邻 `>` 符号的地方，输入：\n\n```javascript\nweb3.personal.unlockAccount(web3.eth.accounts[0],\
    \ \"My Ethereum test passphrase\")\n```\n\n然后在右侧窗口的中间部分为 `uint256 initialSupply`\
    \ 输入一个初始代币数量，例如 888，并点击旁边的“Create”按钮。例如，你将收到：\n\n![](img/rId230_edit_140086947600784.png)\n\
    \n* `web3.personal.unlockAccount(web3.eth.accounts[0], \"My Ethereum test passphrase\"\
    ) true`\n\ncreation of MeinToken pending ...\n\n`[block: 2532 txIndex: 0] from:\
    \ 0x459 ... 17035, to: MeinToken. (constructor), value: 0 wei, 0 logs, data: 0x606\
    \ ... 00378, hash: 0xc25 ... c86b1`\n\nMeinToken 智能合约已成功部署到本地区块链。\n\n### 11. 查询通过\
    \ `web3.eth.accounts` 确定的第一个账户地址的代币余额：\n\n在右侧三分处“address”下方`balanceOf`按钮旁边连续输入两个账户地址，并在每次情况下点击`balanceOf`按钮。确保你输入的是以“0x”开头并用引号括起来的十六进制地址，例如如下：\n\
    \n\"0x4597a26af9991b297b5ccc2a8c0966e9a1a17035\"\n\n你将获得 888 和 0。\n\n### 12. 使用\
    \ MeinToken 智能合约转账代币：\n\n在下方中间的窗口的最底部，紧邻 `>` 符号的地方，输入：\n\n```javascript\nweb3.personal.unlockAccount(web3.eth.accounts[0],\
    \ \"My Ethereum test passphrase\")\n```\n\n然后在右侧三分处“transfer”按钮旁边的 `address _to,\
    \ uint256 _value` 输入第二个账户地址（同样包含引号）和一个金额，例如所示：\n\n\"0x63d7d5b64dc9cc0744dedf87971f8b0777d7e226\"\
    , 111 点击“transfer”按钮并稍等候挖矿。\n\n1. 使用“balanceOf”按钮再次检查两个账户的代币余额：\n\n你获得了 777 和\
    \ 111。\n\n代币已在 MeinToken 智能合约的账户之间成功转账。\n\n![](img/rId231_edit_140086947600912.jpeg)\n\
    \n### 使用 GUI 工具 Mist 进行 MeinToken 转账\n\n此演示展示：\n\n![](img/rId233_edit_140086947601232.jpeg)\n\
    \n- 使用 GUI 工具代替命令行工具 geth [Dam](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html#Mist)。\n\
    - 程序如何与它自己的以太坊交互。\n- 如上述示例部署的智能合约“[MeinToken.so](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#MeinToken.sol)”，如何调用其转账方法以及如何查询实现的代币账户余额。\n\
    \n"
