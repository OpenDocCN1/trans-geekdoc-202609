    ## blockchain


    | | | Seek | | |

    | --- | --- | --- | --- | --- |

    | | | | | | |

    | | | | | | |


    [Blockchain](https://de.wikipedia.org/wiki/Blockchain) refers to a continuously
    expandable list of data records, which are linked to one another by means of cryptographic
    processes, so that the chain of data records is unchangeable and forgery-proof.
    New transactions are validated and packed into blocks, and the blocks are appended
    to the blockchain after going through a consensus algorithm and sent to all other
    blockchain servers.


    ![](Images/rId17_edit_140086947772560.jpeg)


    [Ethereum](https://www.ethereum.org/) is based on a public blockchain, which is
    used in a](https://www.ethereum.org/) decentralized peer-to-peer network on many
    Ethereum servers as](https://www.ethereum.org/) `DLT` is operated. Ethereum](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html#DLT)
    includes the Cryptocurrency `Ether` and](https://www.ethereum.org/) also enables
    "Smart contracts". This allows](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html#Kryptowaehrung)
    contracts](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html#Ethereum-Ether-ETH-ETC)
    to be programmed, which are then executed and checked electronically. For this
    purpose, scripts are created (mostly in the programming language `Solidity`) and
    executed in the Ethereum Virtual Machine (`EVM`).


    ![](Images/rId23_edit_140086947773264.png)


    This opens up very diverse possibilities, for example many are based `ICOs` on.](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html#ICO)
    However, special care must be taken when programming smart contracts: those are
    programmed](Images/rId28_edit_140086947773200.png) Security gaps can have fatal
    consequences, as "The DAO Hack",](https://www.wired.de/collection/wie-aus-dem-hack-blockchain-fonds-ein-wirtschaftrimi-wurde)
    which](https://www.wired.de/collection/wie-aus-dem-hack-blockchain-fonds-ein-wirtschaftrimi-wurde)
    led to the Ethereum hard fork Ethereum Classic.


    ![](Images/rId30_edit_140086947773008.png)


    Basic explanations can be found under: Cryptocurrencies](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html),
    `Bitcoin`, Ethereum, Blockchain](https://www.torsten-horn.de/techdocs/Kryptowaehrungen.html).
    Some simple programming examples for smart contracts are shown below.


    Images/rId32_edit_14008694777328.png)


    1. Basic installations: `Geth`, `Solc`, private test Ethereum `blockchain](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Installation-Geth-Solc-Test-Blockchain)](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Installation-Geth-Solc-Test-Blockchain)


    ![](Images/rId35_edit_140086947773392.png)


    2. First smart contract: hello world demo](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Hallo-Welt-Demo)


    ![](Images/rId37_edit_140086947773456.png)


    3. Mini token smart contract: MeinToken demo](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Mini-Token-Demo)


    ![](Images/rId39_edit_140086947773520.png)


    4. `Remix Online Solidity Compiler` as a graphical development environment (`GUI-IDE`https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Remix-Online-Solidity-Compiler)](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Remix-Online-Solidity-Compiler)


    ![](Images/rId41_edit_140086947773584.png)


    5. Perform a `MeinToken` transfer with the GUI tool `Mist](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#MeinToken-Mist)


    ![](Images/rId44_edit_140086947773648.png)


    6. DApp website for the smart contract with `Node.js](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Node.js-DApp-Webseite)
    7. Transfer of `Ether` with `Web3j` and `Java](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#EtherWeb3jDemo)


    ![](Images/rId47_edit_140086947773712.png)


    8. Transfer of your own smart contract tokens with `Web3j` and `Java](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#MeinTokenWeb3jDemo)


    ![](Images/rId50_edit_140086947773776.png)


    9. DApp website for the smart contract with `Java](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Java-DApp-Webseite)


    ![](Images/rId52_edit_140086947773840.png)


    10. Public `Rinkeby` Test Ethereum blockchain instead of private `blockchain](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Rinkeby)](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Rinkeby)


    ![](Images/rId54_edit_140086947773904.png)


    11. Deploy smart contract in the public `Rinkeby` blockchain](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Smart-Contract-Rinkeby)


    ![](Images/rId57_edit_140086947773968.png)


    12. DApp website for the smart contract in the `Rinkeby](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Rinkeby-DApp-Webseite)](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Rinkeby-DApp-Webseite)


    ![](Images/rId59_edit_140086947774032.png)


    13. `Truffle` for easy development and

    14. `Embark` for easy development and testing


    ![](Images/rId62_edit_140086947774096.png)


    15. DApp website for the smart contract with both `Truffle` and `Embark](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#DApp-Webseite-Truffle-Embark)](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#DApp-Webseite-Truffle-Embark)


    ![](Images/rId65_edit_140086947774160.png)


    16. Use of the `Oraclize` service for external information


    17. Analysis of the blocks and transactions


    ![](Images/rId68_edit_140086947774224.png)


    18. `Solidity` plug-in for JetBrains `IntelliJ IDEA`


    ![](Images/rId71_edit_140086947774288.png)


    19. documentary


    ![](Images/rId75_edit_140086947774416.png)


    ## Basic installations: Geth, Solc, private test Ethereum blockchain


    This demo shows:


    - As `geth` will be installed.

    - As `solc` will be installed.

    - Like your own private Test Ethereum Blockchain is set up and started.

    - As a Account created and Mining is started.


    The following versions are used:


    - `geth 1.8.2`

    - `solc 0.4.19`

    - `web3 0.20.1`

    - `Windows 10`

