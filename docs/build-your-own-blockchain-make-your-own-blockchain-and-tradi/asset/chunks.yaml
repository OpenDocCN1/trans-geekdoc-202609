    \n![](Images/rId108_edit_140086947716112.png)\n\n1. Create the Genesis Block by\
    \ running:\n```bash\ncd \\MyWorkspace\\EthereumDemo\ngeth -datadir \"Private-Blockchain\"\
    \ init src/genesisblock.json\n```\n\n![](Images/rId109_edit_140086947716368.png)\n\
    \nYou will receive, among other things:\n\n![](Images/rId111_edit_140086947716496.png)\n\
    Successfully wrote genesis state\n\n### 8. Start of the own Ethereum blockchain\
    \ (without mining for the time being): Execute (in one line):\n\n```bash\ngeth\
    \ -networkid 77 --identity \"MyDevChain\" -datadir \"Private-Blockchain\" --nodiscover\
    \ --rpc --rpcapi \"db, net, web3, personal, txpool\" --rpccors \"*\" console\n\
    ```\n\n![](Images/rId112_edit_1400869477716624.png)\n![](Images/rId113_edit_1400869477716752.png)\n\
    \nYou will receive, among other things:\n\n![](Images/rId114_edit_1400869477716880.png)\n\
    Starting peer-to-peer node\nHTTP endpoint opened: `http://127.0.0.1:8545`\nWelcome\
    \ to the Geth JavaScript console! And you get the Geth-JavaScript-Console, in\
    \ which you can enter Geth-JavaScript commands.\n\n### 9. Take a look at the documentation\
    \ on the `web3.eth` commands: [web3.eth](https://web3js.readthedocs.io/en/1.0/web3-eth.html)\
    \ respectively. Web3 0.20.x JavaScript API.\n\nQuery the Web3.js version you are\
    \ using:\n```javascript\nweb3.version.api\n```\n\n![](Images/rId118_edit_140086947771136.png)\n\
    ![](Images/rId119_edit_140086947771264.png)\n\n1. Test whether accounts already\
    \ exist. If the insertion of commands with Ctrl + V does not work, try the right\
    \ mouse button, \"Insert\" and Return:\n```javascript\nweb3.eth.accounts\n```\n\
    \n![](Images/rId120_edit_140086947771392.png)\n\nYou will get an empty quantity:\n\
    \n![](Images/rId121_edit_140086947717520.png)\n\n### 11. Create Account\n\nCreate\
    \ an account (think of a difficult password and remember it well):\n\n```javascript\n\
    personal.newAccount(\"My Ethereum Passphrase\")\n```\n\n![](Images/rId122_edit_140086947771648.png)\n\
    \nYou will receive a 40-digit hex number as an account address, for example:\n\
    `0x2f94831a57a96041064d9d0c24583b12f807f2a5`\n\n1. Test again for existing accounts:\n\
    ```javascript\nweb3.eth.accounts\n```\n\n![](Images/rId124_edit_140086947771904.png)\n\
    For example, this time you will get: `[\"0x2f94831a57a96041064d9d0c24583b12f807f2a5\"\
    ]`\n\n### 13. Query account balances\n\nCreate the JavaScript file in the `src`\
    \ subdirectory: `checkAllBalances.js`.\n\n![](Images/rId126_edit_140086947718032.png)\n\
    \n```javascript\nfunction checkAllBalances () {\n  web3.eth.getAccounts (function\
    \ (err, accounts) {\n    accounts.forEach (function (id) {\n      web3.eth.getBalance\
    \ (id, function (err, balance) {\n        console.log (\"\" + id + \": \\tbalance:\"\
    \ + web3.fromWei (balance, \"ether\") + \"ether\");\n      });\n    });\n  });\n\
    }\n\ncheckAllBalances ()\n```\n\n1. Run in the Geth JavaScript Console: `loadScript\
    \ ('src / checkAllBalances.js')`\n\nYou receive:\n\n![](Images/rId127_edit_140086947718160.png)\n"
  trans: "\n以下文本侧重于简单性和良好的可读性。目前仅使用命令行工具。图形化工具将在稍后介绍。\n\n![](img/rId77_edit_140086947771920.png)\n\
