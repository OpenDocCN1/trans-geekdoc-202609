    \n```bash\nmkdir EthereumDemo\n```\n\n![](Images/rId82_edit_140086947770640.png)\n\
    \n```bash\ncd EthereumDemo\n```\n\n![](Images/rId83_edit_140086947770576.png)\n\
    \n```bash\nmkdir solc\n```\n\n![](Images/rId84_edit_140086947770768.png)\n\n```bash\n\
    mkdir src\n```\n\n![](Images/rId85_edit_140086947770832.png)\n\n```bash\ntree\
    \ /F\n```\n\n![](Images/rId86_edit_140086947770896.png)\n\n### 2. Install solc\
    \ (Solidity Compiler)\n\nDownload from `https://github.com/ethereum/solidity/releases`\
    \ the installation file suitable for your operating system, e.g. for Windows:\
    \ `solidity-windows.zip`.\n\n![](Images/rId89_edit_140086947770960.png)\n\nUnder\
    \ Windows, unzip this zip file in the directory:\n`\\MyWorkspace\\EthereumDemo\\\
    solc`.\n\nFor other operating systems, proceed either analogously or as described\
    \ under: [In stalling the Solidity Compiler](https://solidity.readthedocs.io/en/develop/installing-solidity.html).\n\
    \n1. Execute in the command line window:\n```bash\ncd \\MyWorkspace\\EthereumDemo\\\
    solc\nsolc.exe --version\nsolc.exe --help\n```\n\nBoth commands must show plausible\
    \ results.\n\n![](Images/rId92_edit_140086947771024.png)\n\n### 4. Install geth\
    \ (Go Ethereum)\n\n![](Images/rId94_edit_140086947771152.jpeg)\n\nDownload from\
    \ `https://geth.ethereum.org/downloads/` a Geth version suitable for your operating\
