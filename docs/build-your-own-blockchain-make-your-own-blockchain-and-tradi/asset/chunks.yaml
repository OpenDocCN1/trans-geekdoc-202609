    \n1. 启动测试以太坊区块链，包括挖矿 `cd \\\\ MeinWorkspace \\\\ EthereumDemo start-test-Ethereum-Blockchain.bat`\n\
    \n![](img/rId174_edit_140086948409488.png)\n\n9. 在 Geth 控制台中执行以下三个命令，并检查每个情况的结果（两个\
    \ `loadScript()` 响应来自 `GreeterDeploy.js`，而 `Greeter.greet()` 响应来自智能合约）：\n\n`personal.unlockAccount(web3.eth.accounts\
    \ \\[0\\], \"My Ethereum Passphrase\")`\n\n![](img/rId175_edit_140086948409424.png)\n\
    \n`true`\n\n![](img/rId176_edit_14008694841088.png)\n\n`loadScript ('src / GreeterDeploy.js')`\n\
    \n![](img/rId177_edit_14008694841240.png)\n\n`Contract transaction send: TransactionHash:\
    \ 0xe194 ... 7dad waiting to be mined ... true . . .`\n\n`Contract mined! Address:\
    \ 0xcd5e3f508e24fb8424ea38425f3f0c86b52372d`\n\n`Greeter.greet ();`\n\n![](img/rId178_edit_140086948409936.png)\n\
    \n`\"Hello World!\"`\n\n你已成功执行以太坊智能合约。\n\n10. 由于 Solidity 脚本包含 `kill()` 方法，可以按照以下方式从区块链中移除：\n\
    \n`personal.unlockAccount (web3.eth.accounts \\[0\\], \"My Ethereum test passphrase\"\
    )`\n\n![](img/rId180_edit_14008694841280.png)\n\n`Greeter.kill.sendTransaction\
    \ ({from: eth.accounts \\[0\\]})`\n\n![](img/rId181_edit_140086948410768.png)\n\
    \n通过 `eth.getCode (Greeter.address)` 进行控制。\n\n![](img/rId182_edit_140086948413264.png)\n\
    \n你收到了：\n\n![](img/rId183_edit_14008694841230.png)\n\n`\"0x\"`\n\n![](img/rId184_edit_140086948409872.png)\n\
    \n小型代币智能合约：此演示展示了：\n\n*   一个自己的代币（可以代表加密货币），但是一个非常简单的版本，用于说明基本原理。\n*   更完整的 ERC20\
    \ 代币可以在此处找到：[Token](https://www.ethereum.org/token)\n\n![](img/rId186_edit_14008694841102.png)\n\
    \n*   最初使用命令行工具 `Geth` 和 `Solc` 实现。下面是使用图形化工具 `Remix Online IDE` 和 `Damn` 实现的相同演示。\n\
    \n![](img/rId187_edit_14008694842496.png)\n\n开发框架 `Truffle` 和 `Embark`。\n\n![](img/rId188_edit_14008694841000.png)\n\
    \n*   首先，智能合约部署并在自己的私有区块链上执行。后续在公共 Rinkeby 区块链上完成。\n\n按照下面的步骤操作：\n\n1. 以上所有基础安装：Geth,\
    \ Solc, 私有以太坊。\n\n2. 进入准备好的 EthereumDemo 目录（例如 `cd MeinWorkspace \\\\ EthereumDemo`）：\n\
    \n![](img/rId190_edit_14008694841056.png)\n\n3. 在 `src` 子目录下创建 Solidity 脚本：\n\n\
    `MyToken.sol`\n\n![](img/rId191_edit_14008694841472.png)\n\n"
