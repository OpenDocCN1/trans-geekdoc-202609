    ```bash\ncd \\MyWorkspace\\EthereumDemo\ngeth -datadir \"Private-Blockchain\"\
    \ init src/genesisblock.json\n```\n\n![](img/rId109_edit_140086947716368.png)\n\
    \n你会收到如下信息：\n\n![](img/rId111_edit_140086947716496.png)\nSuccessfully wrote genesis\n\
    \n### 8. 启动自己的以太坊区块链（目前不挖矿）：执行（一行）：\n\n```bash\ngeth -networkid 77 --identity\
    \ \"MyDevChain\" -datadir \"Private-Blockchain\" --nodiscover --rpc --rpcapi \"\
