    \ in path specifications and `;` in PATH specifications. with `:` and with placeholders\
    \ `%MEINE_VARIABLE%` by `$MEINE_VARIABLE`.\n\nFollow the steps outlined below.\n\
    \n### 1. Change to your preferred workspace directory (e.g. `\\MyWorkspace`)\n\
    \n![](Images/rId79_edit_140086947770512.jpeg)\n\nMein Workspace and execute the\
