- raw: '**Smart contracts can execute program code and calculations and store the
    results in the blockchain. But smart contracts cannot communicate with the outside
    world. For some smart contracts, however, queries have to be carried out in order
    to be able to check certain "real-world" conditions, for example stock exchange
    prices, flight delays or weather data. So-called oracles are programmed as intermediaries
    ("data feed") (e.g. in** **Solidity) and added the blockchain.** [A](https://solidity.readthedocs.io/)
    **smart contract can query the Oracle, and the Oracle can call up external interfaces,
    for example via REST / JSON, and transmit the result to the smart contract via
    callback. See also:** **Oracle Services (Christoph Niemann), Types of oracles**
