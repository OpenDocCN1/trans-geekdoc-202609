    \ JavaScript 命令）：\n\n// 第一个账户必须有 ether（你可能需要等待挖挖完成）：\n```javascript\nloadScript\
    \ ('src / checkAllBalances.js')\n```\n\n![](img/rId203_edit_140086948411664.png)\n\
    \n// 创建另一个账户（至少需要两个账户）：\n```javascript\npersonal.newAccount (\"My Ethereum Test\
    \ Passphrase\")\n```\n\n![](img/rId204_edit_140086948409680.png)\n## )\n\n```javascript\n\
    web3.eth.accounts\n```\n\n![](img/rId205_edit_140086947598416.png)\n\n// 部署智能合约：\n\
    ```javascript\npersonal.unlockAccount (web3.eth.accounts [0], \"My Ethereum passphrase\"\
    )\n```\n\n![](img/rId206_edit_140086947598672.png)\n\n```javascript\nloadScript\
    \ ('src / MeinTokenDeploy.js')\n```\n\n![](img/rId207_edit_140086947598544.png)\n\
    \n- 等待出现 \"Contract mined!\"。\n- 定义并解锁默认账户：\n```javascript\nweb3.eth.defaultAccount\
    \ = web3.eth.accounts [0]\n```\n\n![](img/rId208_edit_140086947598736.png)\n```javascript\n\
    personal.unlockAccount (web3.eth.defaultAccount, \"My Ethereum passphrase\")\n\
    ```\n\n![](img/rId209_edit_140086947598864.png)\n// 检查新代币的余额（初始：88/0，参见 MeinTokenDeploy.js）：\n\
    ```javascript\nMeinToken.balanceOf (web3.eth.accounts [0])\n```\n\n![](img/rId210_edit_140086947598992.png)\n\
    ```javascript\nMeinToken.balanceOf (web3.eth.accounts [1])\n```\n\n![](img/rId211_edit_140086947599120.png)\n\
    // 执行代币转账（转移 188 个代币）：\n```javascript\nMeinToken.transfer (web3.eth.accounts [1],\
    \ 188);\n```\n\n![](img/rId212_edit_140086947599248.png)\n\n- 等待约 30 秒进行挖矿。\n\
    - 检查余额余额（700/188）：\n```javascript\nMeinToken.balanceOf (web3.eth.accounts [0])\
    \ MeinToken.balanceOf (web3.eth.accounts [1])\n```\n你收到：\n![](img/rId213_edit_140086947599376.png)\n\
    ```javascript\nMeinToken.transfer (web3.eth.accounts [1], 188); \"0xc99b4eff8724c6e774f8dd36ab71da385d14b330479514e90f41\"\
    )\n```\n```javascript\nMeinToken.balanceOf (web3.eth.accounts [0])\n```\n700\n\
    ```javascript\nMeinToken.balanceOf (web3.eth.accounts [1])\n```\n188\n你成功使用自己的代币实现了智能合约，并将代币从一个账户转移到另一个账户。\n\
    \n1. 在 Geth-JavaScript-控制台中执行：`MeinToken.address`\n\n![](img/rId216_edit_140086947599504.png)\n\
    你需要记住这个用于后续演示的十六进制地址。将其保存在 `MeinToken.address` 文件中。\n\n11. 这个小代币演示显然缺少许多真实代币的功能。请参阅\
    \ [ERC20 代币示例。](https://www.ethereum.org)\n\n## 作为图形化开发环境的 Remix Solidity Compiler\n\
    \n此演示展示了：\n与其使用命令行工具 `Geth` 和 `solc`，通过图形化开发环境 [Remix Online Solidity Compiler](http://remix.ethereum.org/)\
    \ 可以实现上述[微代币智能合约](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Mini-Token-Demo)\
    \ [MeinToken 演示](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Mini-Token-Demo)。\n\
    \n![](img/rId221_edit_14008694760016.png)\n\n基于浏览器的 Remix Online Solidity Compiler\
    \ 不仅可以编译 Solidity 代码，还提供语法高亮、自动补全（代码补全）和查找引用。它可以显示语法错误，创建用于部署的 Web3 JavaScript\
    \ 代码，甚至部署、运行和调试 Solidity 代码。\n\n查看 [Remix - Solidity IDE](http://remix.readthedocs.io/)\
    \ 和 [Remix Wiki](https://theethereum.wiki/w/index.php/Remix) 的文档。以下是上述[微代币](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Mini-Token-Demo)\
    \ 演示-智能合约的实现和用法。\n\n1. 必须安装你自己的本地测试以太坊区块链，如果可能，与下面的基础安装类似：Geth, Solc,](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Installation-Geth-Solc-Test-Blockchain)\
    \ [私有测试以太坊区块链](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#Installation-Geth-Solc-Test-Blockchain)。\n\
    \n![](img/rId224_edit_140086947600144.png)\n\n1. 启动包含挖矿的测试以太坊区块链：\n```bash\ncd\
    \ \\ MeinWorkspace \\ EthereumDemo start-test-Ethereum-Blockchain.bat\n```\n\n\
    ![](img/rId225_edit_140086947600272.png)\n\n3. 打开 Remix Online Solidity Compiler\
    \ 网站：`http://remix.ethereum.org`\n\n![](img/rId226_edit_140086947600400.png)\n\
    \n4. 点击网站左上角的加号启动新项目。\n对于“文件名”，输入：`MeinToken.sol`\n\n5. 在上方中间标题为 \"browser / MyToken.sol\"\
    \ 的空窗口中粘贴来自 [MeinToken.sol.](https://www.torsten-horn.de/techdocs/Ethereum-Smart-Contracts.html#MeinToken.sol)\
    \ 的 Solidity 脚本源码。\n\n![](img/rId228_edit_140086947600528.png)\n\n1. 点击右上三分处的“Compile”选项卡，然后点击“Start\
    \ to compile”按钮。\n\n2. 点击 Details 按钮查看编译结果。在“WEB3DEPLOY”下你会找到一个部署 MeinToken 智能合约的完整\
    \ JavaScript 程序。你可以像上面所示，使用命令行工具 Geth 在 Geth JavaScript 控制台中执行该 JavaScript。但在本演示中，所有操作都通过图形化开发环境完成。\n\
    \n"
