  \n支持伴侣实现他们的梦想，并让他们允许你实现你的梦想。让你的想法蓬勃。如果你的伴侣想在家里有一个艺术工作室，帮助他们创造创作艺术的空间。如果你的伴侣想去徒步旅行，帮助他们选择完美的背包。找到一种真正生活生活的方式，不要阻碍彼此的目标。当你们在一段关系中都感到自由时，你们都会是幸福的。\n\
  \n## 我的伴侣爱我\n你们可以给彼此买一个特殊的杯子。分别挑选杯子，尝试买一个你想象伴侣会喜欢的杯子。想象他们觉得这非常**惊人**。接受伴侣为你买的任何杯子，并称它为“我老公爱我杯”或“我老婆爱我杯”或“我伴侣爱我杯”。每当你用它喝咖啡或茶时，都对自己说：“老公爱我”或“老婆爱我”或“伴侣爱我”。\n\
  \n对待礼物要放松。获取一些关于伴侣喜欢的线索，买一些你认为他们会喜欢的。保持礼物小巧。如果你们中任何一方想要或需要某东西，给自己买，而不是指望别人能读懂你的心思。这样你就会快乐。\n\
  \n不要让别人让你失望。如果你想要一个**惊人**的生日，请自己组织：只有你 true 真正想要什么。不要只说“**惊人的**生日”。拿起电话，邀请你的朋友，预订餐厅，预订彩球、水疗日或高尔夫比赛。掌控你自己的幸福。\n\
  \n### 巧克力布朗尼技巧\n尝试用积极的方式说话。没有人会对批评产生良好的反应。从积极的事情开始，并以另一个积极的事情结束：“你在……方面做得非常好……我需要告诉你……你也可以尝试这样做……总之，继续保持努力。”你可以用积极或消极的方式说同样的话。巧克力布朗尼直接从烤箱里出来时可以是轻盈、柔软且流心的，但如果它是直接从冰箱里拿出来，它可能是冰冷、坚硬且沉重的：你吃的是同一种东西，却有两种完全不同的体验。在与人交谈时考虑一下巧克力布朗尼。你带给他们的是温暖、柔软流心的感觉，还是冰冷、坚硬沉重的感？\n\
  \n- 用友好的方式说话，创造**惊人**的关系。\n\n## 忘记过去\n放下过去的关系。如果它们是注定的，它们就会发生。有太多的人执着于旧关系，这会让他们的大脑混乱并阻止他们前进，这会影响新的关系。生活一直关乎不断前进——从幼儿园到小学，再到中学，然后到职场。每当我们前进时，人们进入并离开我们的生活。将今天看作一次冒险，看作新的、更好的关系出现的机会。生活是一场旅程，如果我们允许，它就会变得越来越好。\n\
  \n## 提防欺凌者\n学校里的欺凌者可能会在工作、家里和关系中继续成为欺凌者。意识到你是否正在欺凌别人，或者你生活中的某人正在欺凌你。对欺凌者最好的方法是接受他们就是这样，这样你就可以尝试理解他们的思维方式。他们可能生活在黑白地带，看不到不同选择的灰色地带，例如：“你应该按照我的方式做事或思考。”在你的脑海中，将他们的评论变成幽默，并将情况看作动画片。\n\
  \n通过增强自我信念和改进交流方式来学会维护自己，以便你能用他人能理解的方式解释事情。例如：“因为我们是不同的人，我们对此观点不同。”通过感觉自己良好和相信自己来赋予自己力量。\n\
  \n如果有人提问，是因为他们不知道答案。欺凌者可能会嘲讽这个问题，暗示那个人应该知道答案。欺凌者已经陷入了糟糕行为的习惯。因此，通过观察他们的行为以及他们对你和其他说话的方式，意识到他们的问题。\n\
  \n当你带着**微笑**思考问题时，假设事情会进展得**惊人地**顺利。通过自笑来打破被欺凌的习惯，仿佛欺凌者在电视情景剧里。让任何糟糕的经历赋予你力量，推动你向另一个积极的水平迈进。\n\
  \n\n\n\n如果你有那些让你精疲力竭或让你觉得很消极的朋友/家人，尝试寻找新的聚会方式。例如，一起出去玩一天，让你们的对话围绕这一天的活动展开，而不是围绕他们的问题。去剧院、博物馆、乘船旅行，或者做任何其他激发你灵感的事情。如果你真的无法忍受和他们在一起，就放手让他们自由，通过尊重自己的感受并与最适合你的人在一起来放过你自己。如果某人对你有好处，他们会在合适的时间回到你的生活中。\n\
  \n## 与好朋友的关系\n\n朋友会进出你以及你伴侣的生活。当你见到好朋友时，他们总会让你感觉很“对味”。不要强求友谊，如果一个朋友在特定时期处于不同的心境，也不感到失望。放手让他们，他们会像回镖一样，在时机合适时回到你的生活中。\n\
  \n随着你变得越来越向积极，一些朋友可能不习惯待在你的正能量周围，而你可能对他们的消极情绪感到不适。但他们未来可能会变得更加积极，所以始终为他们回到你的生活留一扇门。\n\
  \n### 对话照片法\n\n尝试对着你想交谈的人的照片说话，也许是你的丈夫/妻子、朋友、同事或孩子。在实际与他们面谈之前，把心里的话说出来是个好主意。一旦你对照片说完了你想说的一切，你可能会发现没有必要和那个人进行讨论了。当你真正见到他们时，你会变得更冷静、更理性，并可能觉得气氛已经缓和。\n\
  \n为你自己和你生活中的每一个人留出特别的时间，感受那种**极好**的感觉。\n\n### 章节总结\n\n* 使用放松技巧：让问题过去。说：“一切都好。一切都在解决中。”\n\
  * 使用观察技巧：享受看着别人向你讲述他们感兴趣的事情。\n* 召开会议来冷静地讨论问题。\n* 对你的伴侣浪漫浪漫。\n* 了解你的伴侣喜欢什么。\n* 赞美他人——每个人都喜欢感觉很特别。\n\
  * ![image](img/img1.jpg)使用巧克力布尼蛋糕技巧：带出人们内心的温暖，而不是冰冷。\n* 第 1 步：放弃僵化的非黑即白思维。\n* 第\
  \ 2 步：记住每个人都是个体。\n* 第 3 步：关注人的优点。\n\n*选择和决定创造了良好或糟糕的关系。*\n\n![第 10 章：关系规则](img/contents.xhtml#toc10)\n\
  \n## 所有良好的关系都关于遵循一套规则\n\n* 掌控我们关系的是我们自己而不是别人，取决于我们是否准备好忍受某些事、是否有能力解决问题，或者期望过高或过低。尝试保持平衡，并始终想象寻找解决问题的方法让事情顺利进展。但要做好准备，有些事情是无法修复的。\n\
  * 记住找到解决方案的灰色地带。避免非黑即白的思维。\n* 足够爱自己，不让他人的行为影响你。无论别人说什么或做什么都不重要，你仍然可以让自己感觉良好。对自己说：“我是**极棒的**”和“他们也**极棒**”，这将会消除你们之间的负面情绪。\n\
  * 别人也很**极棒**。微笑，并想象你激发了他们身上**优秀**的一面。\n* 对他人的想法和意见保持开放，记住做事情有许多方法，而不只有一种。与他人*合作*，而不是对抗。提醒他们，你观察某些事情的角度可能与他们的视角不同。\n\
  * 不要花时间担心别人的问题。想象事情对他们来说进展得**极好**，让他们去处理好他们自己的生活吧。\n* 不要拯救他人。相反，要拯救你自己。每当你为别人解决问题时，他们就不需要学会自己做。拯救他们只会推迟他们的成长。\n\
  * 对自己和别人说：“你可以、也会解决这个问题的。你擅长解决问题。”如果他们也在帮助自己，那么帮助他们是可以的。\n* 不要陷入负面的戏剧中。相反，多和积极的人在一起。\n\
  * 有些人思维逻辑性强，有些人感性，有些人富有创造力。我们需要所有类型的人让世界运转。如果我们都以同一种方式思考，社会将无法运作。对你的伴侣和周围的人产生兴趣，并欣赏他们的特质。\n\
  * 对过去微笑。把它看作一部情景剧并大笑。笑带你进入一个积极的“当下”。\n* 如果有人很刁剔，不要生气，只需对自己微笑，想象你正处于一部喜剧片中。\n* 如果你是关系中的那个“难搞的人”，请解决你的问题。例如，你酒量很大吗？你不整洁吗？你要求很多吗？你是否谈论一些你从不做的事情？你是否通过他人的成就来生活？你是否在负面八卦？你是否认为自己比其他人都好？你很烦人吗？你懒惰吗？你过度活跃吗？看看你自己，成为一个更好的自己。采纳他人的评价和建议。倾听。\n\
  \n\n\n\n\n*   如果你对配偶或孩子所做或未做的事情感到不悦，请开会冷静地讨论这些事情，感受那些奇妙的解决方案顺利解决后的放松感。试着在问题出现时就解决它们，以此享受生活的每一个阶段。\n\
  *   为你生活中的每一个人（包括家里和工作中）想出你喜欢他们的 10 个理由。这将帮助你看到每个人身上积极的一面。\n*   当与人相处得很愉快时，在脑海中“快照”那个时刻，将其加入你的\
  \ `AMAZING` 区域记忆库。\n*   接受每个人都有自己的道路，这条路可能与你的不同。允许他人做出自己的决定，就像你做出自己的决定一样。\n*   一个笑话只有在听话的人觉得好笑时才是幽默的。\n\
  *   你可能需要说一个小善谎来避免冒犯某人。但如果你经常撒谎，你需要问问自己为什么要撒谎，以及你的生活中有什么部分是需要改变的。\n*   在任何关系中，你们双方都是对的，也是错的。你们都以自己的方式看待问题。\n\
  *   如果你正处于一段挑战性的关系中（无论是个人还是职业上的），感受它进展得极其奇妙的感觉。这可能意味着你们将分道扬扬，或者你们解决了任何存在的问题。对自己说：“也许这会变得极其奇妙。”\n\
  \n***\n\n**第 1 步。让你的奇妙绽放。**\n\n**第 2 步。让他人的奇妙绽放。**\n\n**第 3 步。想象事情奇迹地进展。**\n\n***\n\
  \n*减轻压力，为你和周围的人创造一个奇妙且平静的生活。*\n\n![第 11 章：压力、休息与放松](img/contents.xhtml#toc11)\n\n\
  ## 你创造了自己疯狂的生活\n\n近年来的生活节奏变得更快了。我们生活在一个“奔冲、奔冲、奔冲”的社会里，人们被要求工作时间更长、在更短时间内完成更多事情；我们以及他人对自己有很高的期望，而技术填满了我们本可能拥有的任何空闲时间。你能为自己做的最重要的事情之一就是简化生活，消除压力。\n\
  \n*   减轻你的日程表压力。对见谁、做什么要有选择性。\n*   提前计划并保持有条理。\n*   放下科技产品，并将其禁在卧室。\n*   有意识地努力专注于当下，而不是担心未来的事情。\n\
  *   在不需要时停止匆忙。试着向内收敛以保持冷静。\n*   将你奔冲、奔冲、奔冲的生活变成慢、慢、慢的生活，花时间放松。\n*   对那些会增加你压力水平或让你感到压力的事情说“不”。\n\
  *   下班后切换状态，并在休息时间忽略工作信息。\n*   夺回你的安静时光。夺回你的理智。\n*   减少看的新闻量，因为这些可能是负面且充满压力的。\n\
  *   掌控你的债务和财务。\n\n大多数压力是许多小事的累积，而这些事是可以很容易解决的。识别你周内可以改变的事情来缓解压力。你一周中最困难的时刻是什么时候？最给你压力的事情是什么？识别出压力，然后尝试为这些问题寻找解决方案。总有解决方案。总有其他方法。\n\
  \n如果你生活中的压力太大，可能会导致你陷入抑郁或焦虑的情绪，让你感到更加疲惫和力竭。不要为自己必须忍受现状找借口。你可能无法立即找到解决方案，但通过识别问题，你将开始找到帮助你做出正确改变的答案。\n\
  \n以下列表将帮助你识别生活中的压力。\n\n*   工作压力太大？\n*   财务拮据？\n*   仅仅在勉强生活？\n*   太忙了？\n*   太孤独了？\n\
  *   成瘾：酒精、吸烟、药物？\n*   感觉在生活中被困住了？\n*   关系问题？\n*   育儿挣扎？\n*   健康问题？\n*   考试担忧？\n\
  *   职业压力？\n*   家庭问题？\n\n写下你的问题，然后写下解决每个问题的答案。学会通过自言自让自己变得积极。你感到压力的绝大多数事情都非常容易解决。如果你今天不知道答案，下次再回来来看那个问题。你可以定期写下这些问题和答案，以停止压力的累积。通过这样做，你将从问题中剔情绪，让你想出理性的解决方案。放下重复的负面想法会让你的大脑放松。你会感觉更好、更加专注，因此更有能力推动事情向前。\n\
  \n以下是一些压力示例。利用它们来帮助你看到如何找到创造性的解决方案，让你放下压力。\n\n1.  **问题：** 无论我赚多少钱，似乎都不够花。\n    **解决方案：**\
  \ 像大多数人一样，你可能在开支上过度了了。不存钱、缺乏计划，以及认为冲动消费没关系的想法可能已经困扰了你。开始制定一个可以削减的计划并开始储蓄。设立一个储蓄账户，为生日、圣诞节和假期存款。\n\
  \n2.  **问题：** 我对周中和同事或客户一起小酌感到压力，因为这意味着我回家太晚了，而且酒精对我身体不好。\n    **解决方案：** 从喝软饮料开始，喝一杯酒精，然后找借口离开。当其他人喝了几杯酒时，他们甚至不会注意到你离开了。想象你在合理的时间回到家，感到健康且奇妙。\n\
  \n3.  **问题：** 我被朋友或家庭问题感到压力且精力竭。\n    **解决方案：** 假装自己很忙，这样你就不会卷入他们的剧情。你有权拥有自己的生活，所以学会让他们自己解决自己的问题。告诉他们可以并且会解决好事情。然后为你自己有信心让他们承担自己的责任感到良好。\n\
  \n4.  **问题：** 我对周三感到压力并恐惧，因为孩子们放学后有太多活动要参加，这让进餐时间变成了噩梦。\n    **解决方案：** 与其他家长分担接送孩子。提前准备饭菜，以便在合适的时间喂给大家。选择易于加热的食物，比如炖菜。想象周三是轻松且奇妙的。\n\
  \n5.  **问题：** 我无法应对截止日期、考试或学习/工作压力。它们让我如此担忧。\n    **解决方案：** 在周内重新安排你的日程表。将截止日期设定在实际日期的一两天之前，这样你可以高效利用时间。对自己说：“我可以做到。我正在做。已经完成了。”视觉化你完成的工作，并在脑海中看到自己在截止日期一天前放松，一切都已按时轻松完成。想象你正在庆祝出色的成绩。\n\
  \n\n\n\n\n完美主义在某些情况下是有用的，例如如果你想成为一名顶尖运动员，或者在某些工作环境中。但在大多数其他情况下，它会演变成一种负担，让你精疲力竭，并让周围的人抓狂。停止微管理你的生活和他人的生活。学会放手。如果你想过上轻松的生活，就从调整心态开始，让生活变得轻松。\n\
  \n## 学习放松\n\n从花时间休息开始，过你想要的生活。注意你对自己和对他人的说话方式。留意你的语气中何时存在不必要的紧迫感，然后放软并放慢你的语速。正是日常生活中这些微小的压力导致了你感到并处于压力之中。\n\
  \n从别人身上学习他们是如何放松的。几年前，我住在法国朋友家里，他们当时有两个幼童。每个周六下午，全家人都会回到卧室度过一段时光或睡觉。当我成为一个忙碌的上班妈妈时，我也采取了同样的作息，如果周末需要休息，我就不会感到内疚，尤其是当我有一个漫长的夜晚要过，或者我只想在忙碌的一周后放松一下时。\n\
  \n试着顺应身体给你的信号。如果你需要休息，就休息。这非常简单。此外，对自己重复：“我可以找到**奇妙的方法**来放松，”不久后你就会创造出一套适合自己的良好放松习惯。当你更加放松时，你周围的人也会如此。很快，你就会对自己的做事方式做出**奇妙的**调整。\n\
  \n这些建议和下一页的提示听起来可能是常识，但许多人因为太匆忙而往往忘记去做它们。\n\n*   在工作结束后换上衣服。\n*   下班后洗热水澡或泡澡。\n\
  *   喝洋甘菊茶，在枕头上喷上薰衣草香。\n*   在家里运动——瑜伽动作、俯卧撑，任何你喜欢的。\n*   每天去散步。\n*   听你喜欢的音乐。\n*\
  \   听舒缓的音乐。\n*   平静地说话。\n*   平静地活动。\n*   让你的家和办公室充满平静的词汇，如爱、休息、放松、冷静、快乐的家（放在桌子上、靠垫上、作为装框画）。\n\
  *   多休息。\n*   微笑。\n\n在睡觉之前，让你的大脑释放压力。许多人整天以每小时 100 英里的速度奔波，然后看电视直接睡觉，没有时间留给自己相处并让大脑放松。\n\
  \n### 压力释放技术\n\n每天花 5-10 分钟来放松你的大脑。在脑海中平静地对自己谈论明天，让你让你感到完全准备就绪：“我会完成它的。我将度过**奇妙的**的一天。”当你**微笑**时，感受明天一切顺利良好的感觉。闭上眼睛，想象一切进展顺利。你可以让眼睛从左到右、从上向下，并做圆周运动，感受眼睛在所有位置时的平静、良好的感觉。这将释放眼睛周围的紧张情绪，并帮助你相信你想要做的改变。\n\
  \n你可以重复这些短语：“生活很简单。生活很平静。我睡得很好。我是一个**奇妙的**睡眠者。我很好。我很放松。”\n\n在睡觉之前，写下任何让你感到担心的事情。你需要掌控自己的健康并对其进行改进。\n\
  \n### 日常减压技术\n\n定时留意身体的感觉。使用这些技术来减轻压力并感知你的环境。专注于积极的想法，消除导致压力的根源。\n\n### 章节总结\n\n\
  *   掌控你的健康并对其进行改进。\n*   创造一套放松习惯。\n*   识别压力。\n*   消除压力。\n*   学习放松。\n\n### 健康焦虑\n\
  \n每个人都会认识某些曾受健康问题影响的人，或者你可能可能正在经历健康问题。要过上任何类型的的生活，你都需要你的身体。\n\n要克服任何健康焦虑，请使用“天空中的云”技术。用右手手指揉搓或按压左手指节，想象压力或担忧像天空中的云一样飘过。同时，在脑海中想象一个红三角形，将恐惧放入其中并将其缩小。\n\
  \n\n\n\n\n尝试将这段健康旅程看作一场冒险，你将在沿途中遇到许多**不起的人**。你将面临许多非常棒的测试，它们将帮助你获得正确的诊断，你并将以最好的方式发现问题所在，从而获得卓越的治疗方案和解决方案，帮助你度过人生的这一阶段。你将进入一个全新的世界，并享受这段体验。\n\
  \n人们往往害怕医学检查，但每当你进行扫描、血检或任何其他诊断测试时，请对自己说：“对我来说这太棒了。这对我有好处。这正在帮助我尽可能地恢复健康。”如果你正在接受治疗，请说：“我的身体对这种治疗的反应**非常好**。”\n\
  \n想象一下一年后，一切都进展得**非常顺利**。关注手术、操作或治疗后的那一天，就好像一切都**非常顺利地**完成了。这将帮助你在脑海中创造一个光光明的未来，并跳过所有“万一”的担忧。想想：“万一结果非常棒呢？”\n\
  \n即使你得到了艰难的诊断，你仍然可以想象它已经以最理想的方式得到了解决，你可能会感到意外的惊喜——也许是因为你获得了一种革命性的新疗法。尽一切努力改善你的状况，并尽可能多地**积极思考**。保持冷静对你的健康大有益。\n\
  \n### 波浪技巧\n\n想象自己正站在海滩的水边。想象轻柔的波浪涌入又退去。留意水的流动和每一波浪的运动。每一波浪都是不同的。每一波浪都是流动的。每一波浪都在移动。正如每一天都是不同且在流动一样，你的身体也与众不同，你可以找到最适合自己的方法。顺着治疗流动。顺着任何测试流动。顺着生活和解决方案流动。总有可以发现的东西，所以对可能出现的机会保持开放态度。每当你考虑到健康问题时，就重复这种技巧。\n\
  \n尝试尽力享受每一天。即使有疾病需要应对，也试着在你的生活中发现积极的一面。\n\n我曾帮助一位正在经历健康危机的朋友。我告诉她：“从现在起，开始真正地过好每一天。给自己买一个纸巾架，里面装满漂亮、色彩斑斓的纸巾，每天使用它们，以此提醒自己今天是特别的。不要等到生日或节日才用精美的纸巾。活在当下。”\n\
  \n你可能会奇怪这有什么帮助，但对许多人来说，使用精美的纸巾确实感觉很特别。当纸巾放在桌子上时，你每天都会看到它们，由于用餐时间每天都会到来，你会被定期提醒要保持积极。这些纸巾将帮助你把注意力从周围发生的任何负面事情转移开。我的朋友说，看到桌子上的纸巾让她感到宽慰，让她对自己的处境感到积极。她拍了这些纸巾的照片，这样她在外面时就可以看，提醒自己无论身在何处都要说：“事情会**非常顺利地**解决的。”\n\
  \n你还在等什么？每当你拿起纸巾时都感到**非常棒**，并提醒自己你生活中那些美好的事。健康危机可以是一个推使你尽情生活的动力。如果你有一个不舒服的朋友，给他们买一个非常精美的纸巾架，装满鲜艳的纸巾，并告诉他们这个故事。一束花是一份色彩丰富的的礼物，但花只能维持几天，而纸巾是每一餐、每一天的提醒，提醒着事情将以最**惊不起**的方式解决。\n\
  \n人们通常希望医生拥有所有的答案，并能提供神奇的药丸来消除他们所有的疾病和忧虑。事实上，你需要自己完成一些工作。许多症状可能是由压力和焦虑引起的，包括压力性头痛、睡眠差以及各种酸痛。务必咨询你的医生/营养师，但要对尝试不同的放松技术保持开放，并确保你的饮食和生活方式支持良好健康。\n\
  \n大多数雇主在员工员工健康方面的投入很少，因此保持尽可能的健康并定期处理工作压力取决于你自己。催眠治疗录音提供了廉价的解决方案——你可以在睡觉入睡时听它们。催眠可以帮助改变糟糕的饮食、饮酒和吸烟习惯，并应对压力和睡眠失调，这些都会直接影响你的身体健康。当你开始感到更加放松时，你将能够思考解决方案，而不是陷入负面思维中。\n\
  \n在你的生活中建立边界以支持你的健康，限制与那些消耗你能量的人相处的时间，限制工作时间，并在空闲时间让大脑从工作中切换出来。\n\n*   每天花几分钟时间**微笑**并对自己说：“我有一个**非常健康**的身体。”\n\
  \n如果你身体不适，由于没有明确的诊断而找不到问题所在，请采取上述所有方法让自己尽可能地积极和放松。然后用你的能量继续坚持，直到你获得诊断。我告诉所有客户同样的话：坚持下去，直到你发现问题所在。通过相信那个**极佳**的结果，你将在正确的时间出现在正确的地方，获得现有的最佳诊断和治疗。但尽一切努力照顾自己同样重要。\n\
  \n健康不仅仅是一个非黑即白的问题：“我生病了，就那样，”或“我患有这种疾病，我无能为力。”总有些事你可以做的。记住那些改变方案所在的灰色地带。即使你病得无法下床，也可以使用积极的心态技巧保持冷静。当你冷静时，你的身体就可以利用能量来治愈。当你愤怒时，无论生理还是心理，一切似乎都变得糟糕得多。\n\
  \n想想你可以为了帮助自己所做的一切事，并想象自己良好的状态。学会为自己争取你需要的。如果医生无法帮助你，你可以向他们提出可能开启新途径的建议。你的身体是复杂的，可能有些东西被忽视了。\n\
  \n1992 年女儿出生后，我非常不舒服。我有许多症状、酸痛，还有疲劳和脑雾。我被困在家里，有时甚至连抱不起女儿。医生无法查明我出了什么问题。但我知道一定有解决我问题的办法，我决心找到它。\n\
  \n最终，在两年半后，发现我有严重的激素功能失调。我接受了新的激素治疗，在五周内我的症状就消失了。当我康复后，当我们在街上遇到朋友或和女儿去商店时，她会告诉别人：“妈妈下午不再午睡了。”对她来说，看到我健康是一个完全的发现，因为她也经历了了这场疾病。\n\
  \n所以记住，你变好不仅是为了你自己。你也是为了那些爱你并依赖你的人。\n\n## 保持积极\n\n“我可以度过难关。我正在度过难关。我正在做到。”\n\n**微笑**并不断提醒自己一切都进展得**非常顺利**。将你的经历转化为某些**不起**的事情。尝试享受你人生这一阶段中你可以享受的部分。对我来说，虽然那是一段身体上很艰难的时期，但那段时光最棒的部分是我生病时与女儿在一起的时光：如果我是健康的，我可能不会请假来陪伴她。\n\
  \n\n\n\n\n有一天，一位客户步履蹒跚地走进我的诊所，几乎无法坐下。他患有严重的背痛、关节炎，而且饮酒过量。“我老了，我只能接受现实，”他告诉我。事实上，他正用绝望和阴郁的情绪在进行自我催眠，我知道，只要他改变心态，他就会感觉好起来。\n\
  \n我使用催眠疗法让他放松，让他感到更健康，并让他的思维专注于解决方案。在一次复诊那天，我向向诊所窗外望去，看到他正轻快地跳着走。当他蹦进房间时，他说他已经开始使用治疗性磁石来改善关节炎症状，减少了饮酒，并且感觉好多了。他心态积极，看起来像年轻了\
  \ 20 岁的年轻人。\n\n**与健康问题相关的有两个重要因素：一个是生理疾病本身，另一个是应对压力以及压力对你生活的影响。**\n\n催眠治疗录音是帮助你释放压力并抵消健康问题负面影响的极佳工具。催眠治疗对于帮助预防压力相关的健康问题也有帮助。你无法控制一切，但你可以拥抱可能有帮助的事情。\n\
  \n乐于做出许多小改变，这些改变将帮助你管理健康问题、好好转并保持健康。记住，每天进步 1%，然后是 10%，在你发觉之前，你已经进步了 50%。你也可以将这种“百分比规则”应用于生活的其他领域，帮助你找到解决方案并实现目标。\n\
  \n互联网上充满了健康信息，如果能配合`supportive doctor`明智地使用，它们就能以十年前不可能的方式为你提供健康相关问题的答案。寻找改善你健康的解决方案。\n\
  \n## 帮助生病的人\n\n对生病的人保持支持和善良。鼓励他们寻找解决方案。提醒他们：“一切会进展得**非常顺利**，”以及“任何处境都能产生好结果。”记住，当某人生生病或痛苦时，很难保持积极。对他们要有耐心——如果你是那个生病的人，也要对自己有耐心。虽然大多数人会乐意接受帮助，但并不是每个人都愿意采纳你提出的建议。有时，人们只想按照自己的方式行事，这是需要被尊重的。\n\
  \n如果一种疾病占据了你的生活，想象在脑海中将其放入一个红色三角形内，并缩小它让它变小。视觉化自己正在做喜欢的或想做的爱好。相信有一条回归健康和财务独立之路。当你相信有解决健康问题的方法时，你就会发现更好的方式通向最佳健康状态。想象有一根弯曲的线条引导你找到所需的答案。\n\
  \n人们可能会判定你为疑病症，但不要对此介意：他们可能除了感冒流感外从未生过病，他们并不真正理解你的经历。但在世界上其他地方也有其他人经历着同样的体验。所以不要感到孤独。将局面转化为积极的事物，这样有一天你可以分享你的知识帮助他人。（你可以分享你的故事，在网上分享信息，或者只是与某人聊天来帮助他们。）\n\
  \n### 音乐控制设置技术\n\n**想象你的大脑和生活就像录音室音乐技术员的控制面板，上面有可以开关的滑动按钮和开关。当你思考自己的健康或家人、朋友的健康时，想象所有那些不同的控制设置。进入控制面板的健康部分，当你想象事情正以最完美的方式进展时，上下滑动设置。当你对正在发生的积极变化感到良好时，移动滑块。当你对生活变得和谐感到良好时，调整设置。**\n\
  \n**随着设置的调整，以不同的方式滑动按钮，如果你想的话，也可以关闭其中一些。只需按照你自己的创造力去做正确的事。微小的调整会创造新的选择和决定。通过在这里那里微调设置，你将调整对健康的态度并找到解决方案。这就像在你的脑海和生活中都接受了按摩，让你感觉更好。如果你想，可以闭上眼睛。**\n\
  \n*   你是一个个体，所以要找到适合`YOU`的最佳解决方案，以过尽可能长、最快乐的生活。\n\n## 承担责任\n\n英国拥有一套完美的免费国家医疗服务体系（NHS）。这**不可思议**，但它确实让人们更依赖他人提供的解决方案，而不是自己去寻找解决方案。如果\
  \ NHS 不提供某些服务，请准备好投入时间和金钱来康复。健康快乐的生活方式是承担责任的最佳起点。\n\n## 听从身体的声音\n\n对你的健康局限保持现实。例如，如果飞半地球会损害你的健康，就不要去。相反，做一些本地活动。当你不舒服时，你必须学会接受计划可能改变的事实。如果你周围的人给你带来压力，听听你的身体。根据身体对某些情况和人的反应，你可能需要改变与他们的互动方式或避开他们。在生活方式上尊重你的身体。做一份适合你身体并能让你尽可能健康的工作。你可能需要根据健康状况调整职业。\n\
  \n## 积极思考\n\n专注于你希望发生的事情。微笑并感到**不可思议**。想象你身体健康状况良好，正在跑步或打网球，最重要的是，你在生活中很快乐：“我的健康**太棒了**。我的身体**太棒了**。”\n\
  \n重视你自己的生命和他人的生命。不要等别人病了才去感激他们。\n\n**从生活中切除健康危害，并感到不可思议。**\n\n### 章节总结\n\n*   每天准备彩色的纸巾，提醒自己享受当下。\n\
  *   使用波浪技术：像潮汐涨落一样顺应你的健康状况。\n*   记住百分比规则：所有有帮助的小事都会汇聚成让你好起来。\n*   保持专注以获得正确的诊断和治疗。\n\
  *   使用音乐控制设置技术：调整设置，让你对健康变得和谐感到良好。\n*   让自己尽可能冷静舒适，以助于健康。\n*   调整生活方式以支持良好健康。\n\n\
  **第 1 步。照顾自己。**\n\n**第 2 步。说“健康太不可思议了”。**\n\n**第 3 步。尽可能保持健康。**\n\n*识别助长你成瘾的压力和情绪。然后处理它们并释放自我。*\n\
  \n![第 13 章：成瘾与执迷](img/contents.xhtml#toc13)\n\n## 重夺控制\n\n你或你认识的人可能受到成瘾行为的影响。在本章中，我针对以下主题提供提示和建议：\n\
  \n| 酒精 | 抗衰老 | 身体形象 | 药物 | 食物 | 赌博 | 游戏 | 八卦 | 色情 | 购物 | 吸烟 | 压力与焦虑 | 技术、社交媒体和手机\
  \ | 偷窃 | 工作 |\n\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- | --- | --- | --- |\n\n任何我们花费大量时间做的事情最终都会成为我们的一部分。一旦我们变成了那样的人，我们就必须花时间重新编程自己，学习不同的行为以打破坏习惯。是`YOU`，只有你才能做出改变，无论是独自还是在支持下。\n\
  \n\n\n\n\n每个人在某个时刻都会有成瘾行为或对某些事物的弱点。我建议你接受这个事实，然后弄清楚你需要做什么来控制你可能存在的弱点或成瘾。你是一个独立的个体，所以你需要做对你有利的事情。但不要对他人发现的有效解决方案关上心脑门。你永远不知道：对他人有帮助的东西可能也对你有效。\n\
  \n你需要专注于做出能够打破坏习惯的改变。做下面这个实验，向你自己证明适应新事物是可能的。\n\n移动你厨房里垃圾桶的位置。在一段时间内，你会习惯性地回到原来的地方，但很快，你就会习惯垃圾桶在别处，并自动地走向那里，而无需刻意思考。你想要改变的成瘾或坏习惯也是同样的道理：你需要改变这种行为并重复这样做，直到你习惯新的相处方式。这之所以有效，是因为你将习惯储存在潜意识中，一旦你重新编程了自己，以新方式行为对你来说就会变得很自然。\n\
  \n*   你在学习成瘾行为上投入了时间。你也需要花时间来打破这些坏习惯。\n\n通常情况下，上瘾的人考虑的是行为的短期回报，而不是长远后果。不上瘾的人意识到后果，并决定做出更好的选择和决策来避免成瘾。\n\
  \n你的选择和决策 = 后果。\n\n*   如果你摄入过量，你就会增加。\n*   如果你经常喝酒，随着时间的推移，你对酒精的依赖会越来越大。\n*   如果你吸毒，可能会上瘾。\n\
  *   如果你花你没有的钱，你最终会陷入债务。\n*   如果你赌博，你会赔钱。\n*   如果你看太多色情片，你会损害你的关系。\n*   如果你玩电脑游戏时间太久，你的人生成就就会越少。\n\
  *   如果你过度使用技术，它会侵占你的生活。\n*   如果你吸烟，可能会缩短寿命。\n*   如果你过度工作，可能会精疲力竭并损害你的关系。\n*   如果你反复偷窃，你最终可能会被抓。\n\
  \n有成瘾的人住在幻想世界里，而不是存在后果的现实世界里。避免成瘾的人能够看到后果。\n\n每种成瘾的背后都是系列导致某人无法离开所渴望事物的原因。通常，成瘾源于童年问题，如缺乏关注或来自父母及学校的压力太大，加上自尊心低、压力、反叛、感觉被困、迷失或无聊、填充时间或逃避压力。每个人的成长背景不同，每个人对生活的事件反应也不同。在我的催眠录音中，我通过通用处理生活问题来治愈整体。一旦潜意识感到更加满足，人就会感到更加冷静、快乐和放松。当你感受到舒适的感觉时，你不需要任何外部事物——物体或行为——来让你感到完整。\n\
  \n我不赞同详细追溯过去，因为这可能会带来压力，甚至是具有破坏性的。但识别成瘾行为的可能原因，然后让大脑从这些事件中解脱出来是很。放下怨恨或责备很重要，并记住你见过的每个人都是根据自己的性格和信念尽了他们所能。催眠是一个帮助大脑从过去事件中解出来的绝佳工具，通过打破根植于潜意识中的坏习惯，你将能够恢复满足感。\n\
  \n我选择成为催眠治疗师是因为它可以很快对某人的生活产生真正的改变。通过我的催眠录音，我已帮助成千上万的人打破了坏习惯。催眠加速了大脑的重新编程，使其放弃负面习惯并建立积极、良好的习惯。录音是实现这一点的极佳方式，因为你可以在自己的私密空间听它们，也许在睡觉时播放以提高睡眠质量，它们非常有成本效益，而且你可以通过一系列标题来帮助你生活的各个领域。\n\
  \n大多数人并不完全清楚催眠是什么。了解它的最好方法是亲身体验。我在生活压力巨大的时期尝试过它，并亲眼发现了它是多么**惊人**。正是这种积极的经历激励了我成为一名催眠治疗师，这是我目前今为止所做过的最佳决定之一。对于大多数人来说，催眠是一种快速简单的方法，可以将大脑从欲望中释放出来，打破坏习惯，同时处理可能是任何负面成瘾根源的情绪和压力。在催眠过程中滴入你潜意识的积极信息，会在你日常生活中难以保持积极时，变成一个令人安心的背景音。\n\
  \n## 你的生活正在创造你的成瘾\n\n识别你生活中让你喝酒、吸烟、暴饮暴食、赌博……压力。然后努力从你的生活中消除这些问题。很多人说：“我没有任何问题。我只是喜欢喝酒/吃东西/吸毒。”但总有东西在助长成瘾。\n\
  \n你可以扑灭火灾，但如果你不修理电路故障，火会再次发生。通过做出创造不同现实的改变，努力修复你生活和大脑中的电路。解决你生活中的问题并改变你对它们的反应方式。感到**惊人**并想象事情进展顺利。不要让自己在没有做出意识决定的情况下反复沉溺于某事。识别你生活的哪个方面正在按按钮并导致你产生成瘾行为。\n\
  \n在审视自己的同时，也观察其他人并向他们学习。分析他们的行为，并试图弄清楚他们为什么会成瘾。他们缺乏自信吗？他们饱受压力或患有糟糕的关系吗？他们以某种方式对自己的生活感到糟糕吗？他们是因为过去发生的事情而受伤吗？他们是否被具有特定行为的人长期包围，以至于看不到有其他方法？\n\
  \n无论你到目前为止取得了什么成就，花时间看看你给他人带来的改变。为了社会的正常运作，每个人都相互依赖，你的角色和任何人一样重要。每个人、每物都有目的，所以要对自己感到自豪。如果你对自己的成就或目前为止的生活不满意，请使用书中的技术引导自己向新的、更好的方向发展。\n\
  \n每个人都有特殊的天赋和才华。你可能已经在从事你非常擅长的工作，但你可能还没有看到真实的自己。或者你可能寻求职业转型、成为家庭主夫或已退休。无论你是谁，都应该对自己感到自豪。如果不是，有答案和解决方案可以帮助你。\n\
  \n为了得到不同的结果，你需要做一些不同的事情。从今天开始。这周，尝试用不同于上周的方式做事：购买不同的食物，避开有毒品或酒精的地方，去咖啡馆而不是酒吧，换一条路线以避开博彩店，改变你能改变的一切以获得你想要的结果。外面有一个与你习惯的世界完全不同的新世界。出去寻找它吧。\n\
  \n### *感觉良好的技巧*\n\n*问题：* **我因为无法停止我的成瘾行为而感到很没用。我怎么了？**\n\n\n\n\n\n**回答：** 有这种感觉并不好，但它会过去的。对自己重复：“我可以掌控局面。我正在掌控局面。我做出健康的选择。”视觉化你所有掌控局面的时刻，并在脑海中建立这些影像。想象你完全掌控着自己的未来。想象一条弯曲的线条引导你走向一个受你控制的生活。当你想到从现在起做出良好的选择和决定时，请**微笑**。\n\
  \n## 酒酒\n\n生活真的不仅仅是饮酒。出去寻找一种不依赖酒精的**精彩**生活。使用`SMILE`技巧，让你对自己的一天感觉更好，并激发你建立**精彩**生活的动力。\n\
  \n在你的一生中，你可能被周围喝酒的人、电视节目、广告，或者生活在一个让饮酒在你脑中正常化的文化环境中所“洗脑”。记住，世界上每个国家都有饮酒极少但依然过得很快愉快的人。\n\
  \n### 什么是正常饮酒？\n正常饮酒是在他人相伴时偶尔喝几杯，并抱着“随缘”的态度。如果你正在用酒精来帮助自己放松或以任何方式依赖它，请尝试寻找其他与酒精无关的方式来放松和享受，以免你的饮酒行为最终失控。如果你开始计算酒精单位了，说明你已经喝得太多了。偶尔喝几杯即可。通过做出新的、更好的选择和决定来整理你生活的每一个领域。\n\
  \n我建议在睡前听催眠录音来打破饮酒习惯，并帮助释放情绪压力，让你感到放松并睡得更好。你也可以听其他主题的催眠录音，如“自信”和“放松”，这将增强你对自己的积极感受。当你自然放松时，你就不会产生渴望的的感觉。\n\
  \n*   下班后洗个澡或泡个澡放松一下。\n*   工作结束后换上舒适的衣服。\n*   晚上喝草本茶。\n*   在葡萄酒杯中加入一片柠檬片喝气泡水代替酒精。\n\
  *   下班后或睡觉时听催眠录音。\n*   使用书中的技巧让你的生活变得更好。\n\n在没有酒精的情况下，**去掉 `booze`（酒）和 `ooze`（流脓/颓废）性格中的\
  \ `b` 字母**。即使不喝酒也能成为派对的焦点。提升你的自信，让你不再觉得必须喝酒才能让自己开心。\n\n### 视觉化积极生活技巧\n**放下脑海中关于自己是“醉鬼”的负面影像。相反，视觉化自己正在利用时间做健康的事情，例如去剧院、航海、跑步、看电影、读书……这是你的选择。想象一下自己在没有酒精的情况下度过这一周。**\n\
  \n### 照片饮酒日志\n**使用手机相机制作照片饮酒日志，拍摄你摄入的一切（酒精和非酒精饮料）。这样你就能真正看到自己摄入了什么。将照片分享给支持你的朋友，这样你就不得不面对自己摄入的内容。最终，你的照片饮酒日志将主要包含非酒精饮料，偶尔有酒精。**\n\
  \n**想到不用喝酒也能快乐时，请微笑。**\n\n## 与酒者一起生活\n\n如果你和一个酗酒者或酒精依赖者生活，他们可能对酒精的热爱超过对生活本身。但大多数喝酒的人都希望更好地掌控自己的生活，因此他们很想要改变。拍摄或记录他们的行为，这样你就可以坐下来平静向他们展示事实。解释和他们一起生活是什么感受。建议他们定期听减酒催眠录音。你可以在他们醉酒时背景播放催眠录音，随着时间的推移，信息会过滤进他们的潜意识中。\n\
  \n我强烈建议你也通过听增强自信和放松的催眠录音来完善自己。这些将帮助你打破与饮酒者互动时形成的任何负面习惯，并给你足够的信心来维护自己的立场。\n\n想象无论你们是否继续在一起生活，事情都会进展得非常**精彩**。\n\
  \n## 抗衰老\n\n看一张你 10 年前的照片，看看那时候的你多么漂亮。从现在起 10 年后你会回过头想：“我 10 年前在担心什么？”今天就是爱你自己以及你的外貌的一天。从你现在的年龄开始做你自己，接受这就是真实的你。担心衰老是有压力的，而压力会导致衰老。所以，停止为你的外表感到压力。相反，享受生活的这个阶段并感觉非常**精彩**。\n\
  \n尽力吃好、睡好、保持放松，并明智、安全地运动。\n\n你可能已经把自己洗脑了，痴迷于衰老。催眠可以释放坏习惯，帮助你放松并对自己感觉良好。我的许多客户在催眠治疗后看起来年轻得多，因为我们所有的脸部和身体都承载着生活的压力。此外，催眠可以帮助你放弃糟糕的饮食或饮酒习惯，让你的身体能够排毒和修复。\n\
  \n享受你自己以及你在生活中所做的一切。照顾自己，让你从内外健康年轻。\n\n**微笑**，接受自己，感觉非常**精彩**。\n\n## 身体形象\n\n每个“身体（body）”都是不同的。是的，世界上数十人中的每一个身体都与其他任何身体完全不同。你的身体是你的一部分，你为什么要改变它呢？爱你拥有的身体，真正地爱它，感激它为你做的一切，并照顾它。\n\
  \n使用催眠对自己感到自信。没有人是完美的，所以在保持健康的同时做最好的自己。不要迎合他人对外貌的期待。相反，创造你自己的样子和风格。保持自然的美或帅。\n\n\
  当你关注外貌的积极方面时，请微笑。\n\n## 毒品\n\n保持独立，不要随大流。你可能认为每个人吸毒，但那是因为你周围都是毒友。当然，大多数人并没有吸毒。你需要通过寻找不涉及毒品的事情来改变你的生活。开始一些让你内心歌唱的新活动或爱好。对某些人来说，这可能只是简单的烘焙蛋糕或画画。与不接触毒品或其他毒友的人交新朋友。\n\
  \n问问自己，过去内在的痛苦让你产生了渴望快感的感觉，以及你的日常生活不够充实。尝试通过良好的想法和建立精彩的生活来获得快感，而不是通过毒品。你可以戒毒，但你需要治愈内心那个受伤的部分。我建议通过催眠来处理内在自信问题，治愈情感过去，并重新训练你的大脑去过充实幸福的生活。\n\
  \n**去掉 `drug`（毒品）中的 `d` 字母，停止把你的情绪问题和过去的痛苦扫在毯子下。** 面对你的问题。开始无毒生活，因为你热爱生活。坚强、自信，建立一个你期待去生活的。说：“我可以掌控我的生活。我可以做到。我正在做到。我已经做到了。我正在创造一个精彩的生活。”\n\
  \n微笑会在大脑中产生积极化学物质，就像毒品曾经做的那样。所以，把你的毒瘾习惯变为微笑，因为你是天生快乐的。\n\n\n\n如果你与吸毒者生活在一起，他们对毒品的喜爱可能超过对生命本身。想象一下，无论你留在他们身边还是离开，事情都会变得**极其顺利**。通过倾听增强自信的催眠治疗录音来完善自己，这将帮助打破你与伴侣之间形成的任何负面习惯，让你能够维护自己。\n\
  \n### 戒毒技巧\n\n`双手合十并用力握紧。感受你所拥有的力量。想象你的身体运作良好，身体洁净安全，内心平衡。现在想一想你想到的最无聊的事情。这可能是青少年时期在课上感到无聊、学校作业、长途飞行、听枯燥的演讲，或者任何让你觉得无聊的事物。将这个念头留在脑海中，并在你握紧双手的同时，想象它变得无聊了十倍。专注于那种无聊的感觉。现在将思绪转移到毒品，想象它们很无聊，真的无聊。当你想到毒品时，你会自动对它们感到无味。它们毫无意义且无聊。片刻后，松开双手。这时，你会发现毒品是给别人用的，而你已经准备好抛弃它们。放松并放下你的手。`\n\
  \n## 食品\n\n商店里装满了你不需要的食物。想要苗条，你需要规律饮食，少量多次摄入健康食物，偶尔奖劳一下自己，并定期运动。除此之外没有别的了。你可能觉得自己并不喜欢节食，但均衡的饮食是瘦子人的正常饮食方式。没有奇迹般的疗法，没有魔力药物，也没有什么流行的节食法。你只需要学会管理自己的饮食。找到最适合你的方法并坚持下去。接受这样一个事实：为了变瘦，你需要摄入身体所需的食物，进行适量的运动并保持良好睡眠。\n\
  \n尽可能吃新鲜的家常菜。从学习烹饪一道健康的菜谱开始。一旦精通了它，就学习另一个菜谱，然后又是，直到你掌握这么多菜谱，以至于你烹饪的全是健康食品。\n\n定期使用催眠治疗录音将帮助你保持积极的心态并遏制食欲。反复对自己说：“我可以吃得很健康。我可以运动，而且我正在这样做。我很苗条、健壮且健康。”不要说“我太胖了”。想象自己苗条、健壮且健康的形象。如果你无法想象，就把你的头部贴在苗条身体的照片上，并把它放在你经常能看到的相框里。\n\
  \n### 照片食谱\n\n`通过拍摄你所吃和喝的一切来制作照片食谱，这样你就能真正看到自己摄入了什么。也许可以把照片分享给支持你的朋友，这样你就不得不面对自己正在吃的东西了。`\n\
  \n做最苗条的人。尽一切努力让你自己和身体处于最佳状态。穿适合你体型的衣服。微笑，鼓励并接受自己。\n\n## 赌博\n\n你最大的资产是你自己以及你每月产生的收入。在追求财务梦想时，放弃通过赌博来浪费金钱。相反，通过提升自我和增加收入能力来掌控你的命运，为你现在和未来的自己及家庭提供保障。开始减少支出，把原本要花在赌博上的钱存入一个特殊的储蓄账户里。更好地利用你的时间：花时间重新培训，分析并调整你的财务状况以储蓄，并增加收入。投入时间研究如何安全地投资你的资金。\n\
  \n催眠将帮助你放弃赌博习惯，增加财富并与金钱建立更好的关系。\n\n### 照片赌博金钱日记\n\n`拍下你花在赌博上所有的钱——现金、收据、在线交易——这样你就能真正看到你的习惯是如何影响你的财务的。你可能会对自己的花费之多感到震惊。想想如何利用这笔钱投资你的未来。将照片分享给支持你的朋友，这样你就不得不面对你正在做的一切了。`\n\
  \n## 游戏\n\n游戏是一种催眠：你的大脑完全敞开，并专注于你正在接收的信息——对于游戏来说，就是通过观看。意识到这一点，因为游戏的图像和动作正在你的脑海中植下印象，这些印象最终将成为你思考的一部分。负面的游戏可能会让你变得更具攻击性和更消极。\n\
  \n在一个圣诞假期期间，我玩了一个农场游戏 App，想看看沉浸在游戏中是什么感觉。除了发现它很上瘾外，我甚至梦到了它，早上醒来时脑海里还在播放游戏中的画面和音乐。我在短短三周内就被催眠了。\n\
  \n农场游戏还是挺积极的，但例如战争游戏可能会产生很大伤害。我在完成挑战后选择了停止，因为我知道催眠的力量有多大。坦率地说，我宁愿做一些更有意义、更能增强生活的事，而不是看着虚拟鸡被喂食。事实上，如果我继续玩那个农场游戏，我今年就不会写这本书了。\n\
  \n一个朋友告诉我，她被叫去儿子就学的学校开会，所有男学生的家长都被告知，这些男孩在上学时很疲倦，无法集中注意力，因为他们在玩游戏，而且现在落后于女孩了。所以游戏确实产生了影响，这不应该被轻视。\n\
  \n除了孩子玩游戏，有些父母也在玩，而不是与孩子互动，这意味着在一些家庭里几乎没有交流。睡前玩游戏也是一件坏事，因为你最终会晚睡，睡眠模式会被干扰，因为这不会帮助你放松，反而会让你更清醒。寻找更健康的方式来放松或限制你玩游戏的时间。在我看来，玩游戏的人正在浪费他们本可以用来建立美好生活和财务安全未来的时间。不要让你的生活从指尖流过。\n\
  \n微笑并思考更好地使用时间的方法。催眠治疗是帮助你重塑并养成更健康习惯的绝佳工具。\n\n## 八卦\n\n你说的每一句话都在塑造你的生活。如果你花几个小时讨论他人的问题或陷入负面的闹剧中，你的生活就会变成一部肥皂剧。关注你自己的问题并解决它们，而不是讨论别人的。如果你爱八卦，你的生活就会陷入负面模式。如果你能为他人感到高兴并分享他们的好消息，你自己的生活就会蓬勃并变得更好。\n\
  \n对他人友好并支持。每天对别人说一些积极的话。在思考别人的优点时微笑。\n\n### 坏消息成瘾者\n\n注意你的言。你是那个分享坏消息的人吗？你喜欢关于他人的坏消息吗，因为这让你对自己感觉好受吗？你喜欢一个充满绝望的故事来宣泄你对世界上坏消息的愤怒吗？试着注意你什么时候说负面内容的时候，并将话题转向积极的故事。\n\
  \n每天告诉某人一些好消息。\n\n## 色情\n\n性图像在日常生活中无处不在，在杂志、电视和音乐录影带中。因此，它们在我们潜意识中变得常态化，因为我们被环境所塑造。在线看色情对很多人来说也变得可以接受了，特别是因为它太容易获得。但这影响了我们的关系。\n\
  \n\n\n\n\n当你与伴侣亲热时，你会感受到吸引力。触碰、嗅闻以及你所有的其他感官都被吸引其中，这增强了你与伴侣之间的亲密感。当你看色情时，你是在允许一个性影像来刺激你，而不是与伴侣建立一对一的连接。大脑可能会被图像和性期待所过载，导致你对这种奖励上瘾，就像你会对那些能产生良好化学物质的物质上瘾一样。\n\
  \n### 色情与关系\n\n一段健康的关系需要双方的互动。任何拉开你们距离的事情都会伤害你们的关系。在伴侣背后看色情无不利于建立健康、幸福且长期的关系，因为你的伴侣可能会发现你在做什么，并感到被背叛。\n\
  \n我认识一对夫妇，他们平时不住在一起，发现自己正渐行渐远。那个女性在周末看到伴侣时会性兴奋，但他却没那么。他们最终意识到，当她期待周末与他亲密时，他却在在外时看色情片，所以见到她时并没有那么兴奋。在深入交流后，他决定在周期间不看色情，他们的性生活又好转了。\n\
  \n如果你的伴侣愿意偶尔和你一起看色情片，你们可以一起这样做。但要敏感，不要给他们压力，因为他们需要感到舒适，而且看色情片并不适合每个人。重要的是与伴侣一起开心、一起大笑并保持亲密。对伴侣浪漫，让他们觉得自己很特别。\n\
  \n如果你独自看色情片，你只是在脑海中发展性的视觉影像，而不是与伴侣建立健康肢体关系的能力。这可能会阻碍你走出去寻找健康的关系，而当你真的找到一个想要约会的人时，你可能对他们的外表和性表现产生不现实的期望。你可能对伴侣性关系中正常和可接受的标准产生扭曲的看法。当你遇到伴侣时，他们可能觉得你的色情习惯没有吸引力。浪漫对于一段幸福、平衡的关系至关重要，而色情片会让你停止努力浪漫，因为你想要即刻的结果。\n\
  \n### 红色三角形法\n\n在脑海中想象一个红三角形。想象把你过去看过的所有色情片放入这个红三角形中，然后在脑海中缩小这个形状。重复这种技术几次，以帮助重编程你的大脑。想象与伴侣拥有一段健康、幸福的关系。\n\
  \n* 逐渐戒掉影像。\n* 使用催眠治疗录音来打破色情片成瘾的习惯。\n* 有意识地努力与伴侣建立联系。\n* 专注于在充满关系中与伴侣在一起的感觉。\n*\
  \ 创建一段幸福的关系，其中性是你生活的一部分，而不是唯一的焦点。\n* 阅读关于关系的章节`第九章`\n\n## 购物\n\n商店里充满了精美的物品和**惊人**的设计。总会有你想买的东西。但你不能总是拥有新东西。接受这一点，充分利用你所拥有的，享受售卖中所有可爱的物品，但把它们留在商店里。\n\
  \n* 为自己设定一个年度预算，并分配到各个季节。\n* 明智地使用你的钱。\n* 赚钱需要花费大量精精力，而花钱只需要几分钟，所以思考你在做什么。\n* 珍惜你已经拥有的。\n\
  * 卖掉你不再需要的物品。\n* 永远不要贷款购买。如果你今天买不起，你就买不起——此话为止。\n* 记录你的每一笔开支。\n* 入少于出。\n* 记住，还有人比你拥有的少。\n\
  \n为你已经拥有的东西**微笑**。\n\n### 花钱\n\n陷入花费你没有的钱的成瘾循环，与任何其他类型的成瘾没有区别。准备好听听你所做事的真相。你的消费是你的责任。不要自私地期望在你过度消费时由别人收拾残局。你必须接受，如果你买不起某些物品，你就不能拥有。学会预算并为你想要的东西存钱。记住，收入的金额必须大于花费金额。\n\
  \n一想到无债就**微笑**，然后按照`第七章`中描述的步骤变得无债。\n\n## 吸烟\n\n当你真正积极并过着良好的生活时，吸烟将不会成为生活的一部分，因为它违背了健康幸福生活的初衷。吸烟是在掩盖你真实的内心感受。吸烟抑制了你的真实情感，以便你应对日常生活。当危机出现时，烟民直接走到外面点烟，而非吸烟者不需要香烟就能处理压力。\n\
  \n你可能想相信这只是化学成瘾，但吸烟也是对生活中已经发生或正在发生的事情的逃避。学习在没有香烟的情况下处理你的压力和情绪。一点一点地改变你的生活，然后放弃吸烟。戒烟将从各个方面增强你的生活，但重要的是先处理好自己，否则你可能会养成另一个坏习惯来试图应对压力，例如饮酒或吃得更多。\n\
  \n对于大多数烟民来说，催眠治疗是告别香烟、渴望和情感问题的绝佳工具。你可能需要去几次，但你投入在戒烟上的钱是花得值的。除非你尝试，否则你不知道它对你是否有效。\n\
  \n### 目标\n\n给自己设定一个只有在你身体健康时才能实现的积极目标，例如训练跑马拉松、参加慈善跑步或进行徒步旅行/骑行假期。这样，戒烟就有了真正的意义。\n\
  \n### 照片日记\n\n使用你的手机相机制作照片日记，通过拍摄你抽的每一支烟来让你看到自己有多少。我建议在抽每支烟前拍一张照片，抽完后再拍一张。将照片分享给支持你的朋友，这样你就不得不面对现实。\n\
  \n整天**微笑**以创造积极的情绪，并想想你过去花在吸烟上可以做的事情。\n\n## 压力与焦虑\n\n你是否做得太多，以至于压力变成了一种生活方式且你已经对此上瘾了？或者你倾向于过度思考一切，以至于对不需要担心的事情感到担忧？\n\
  \n每当你发现自己正在担心某事时，像安慰朋友一样，引导自己向积极的方向思考。和自己谈谈你希望事情如何发展。告诉自己：“情况会进展得**非常顺利**。”用右手手指揉搓、按或敲击左手的指节，想象问题像天空中的云一样飘过，同时说出这些词：“让它过去吧。”（`第三章`中有更多关于如何放下担忧的。）\n\
  \n**微笑**并想想那些进展顺利的时刻。\n\n## 技术、社交媒体与手机\n\n限制你对技术、社交媒体和手机的使用。如果你不这样做，它们可能会接管你的生活，影响你的关系并阻碍你发挥真正的潜力。\n\
  \n\n\n\n最近我在坐火车时，看到一个年轻女性给男朋友打电话，告诉他她一整天的所有情况，从她离开家到上火的每一个细节都说了一遍。她告诉他她买了一件外套，解释了为什么买这件而不是买另一件，然后她说：“好了，我得走了。我要下车了。我们一等会儿见，在车站外见。”\
  \ 整个车厢的人都听了她生活的每一个细节，因为她等不及要面对面和男朋友说话了。\n\n*   永远不要用技术代替与周围的人交谈。\n*   使用技术要保持平衡。意识到过度使用技术可能会引发争吵。\n\
  *   与朋友约定关闭手机，以便你们可以进行有意义的对话。\n*   等你面对面见到人们时再告诉他们你的消息。\n*   避免痴迷于与人联系。\n*   避免不断查看新闻和社交媒体。\n\
  *   当手机响起时正有人陪伴，不要自动接听。尊重你正在交谈的人。\n*   进入卧室前将手机切换到“飞行模式”。你的闹钟仍然会响，但你不会被信息、警报或设备的辐射打扰。\n\
  *   避免在卧室看电视或使用技术。\n*   你睡前最后听到的声音将留在你的脑海中，所以确保它是积极的。也许可以在睡觉时播放一些宁静的音乐。\n*   催眠治疗可以帮助重新编写你的坏习惯。\n\
  \n微笑，让你在日常生活中保持快乐。不要被技术吸收，要留意你的周围环境——树上的叶子、照耀阳光——以及你周围的人。\n\n## 偷窃\n\n偷窃是一种坏习惯，就像任何其他坏习惯一样。也许你想要那些无法通过其他方式得到的东西。或者你仅仅因为它们在那里且你可以拿走就拿了。或者你认为你理应得到那些东西。或者你认为拥有某个特定物品会让你更快乐。或者你认为被你偷走东西的人负担得起这种损失。\n\
  \n一旦你将偷窃视为一种习惯，你就可以通过做出不同的选择和决定开始改变它。例如，避免去你过去会偷东西的地方。如果你觉得想要的东西遥不可及，你正在非黑即白地带思考，而不是在寻找解决方案的灰色地带。\n\
  \n不要对自己说：“我必须偷这件东西，因为我买不起”，要说：“如果我改变生活中的选择和决定，我可能会找到一种不同的生活方式。”\n\n对自己说：“也许有一天，我可以拥有这些东西。”\n\
  \n不要说：“我买不起这些东西，但我可以偷走而不被抓到”，要说：“我可能根本不需要这些东西。也许我可以通过做出**卓越**的选择和决定来改善生活，从而变得更富有。”\n\
  \n### 红三角技术\n\n在脑海中视觉化一个红色三角形。将想要不属于自己的东西的负面念头连同问题和行为放入三角形中。然后在脑海中不断缩小三角形，直到它小如一粒尘埃，并想象把这粒尘埃吹走。随着三角形的溶解，你将在未来的几天或几周内让极其卓越的解决方案向你显现。为自己能够掌控自己的选择和决定感到自豪。根据需要反复重复这个练习。假设好事从今天起就会到来，并且人们对你有好评。\n\
  \n“**卓越**的事情发生在我身上，因为我做出了正确的选择和决定。我找到了极其积极的方式让我的生活变得顺畅。”\n\n## 工作\n\n尝试通过意识到自己正在过度工作来打破过度加班的习惯。你可能觉得自己一直在原地打转，因为你认为这是唯一的行为方式。开始相信你可以获得成功，并保持冷静和放松。一旦你的意识意识到你做得太多了，你就可以开始寻找解决问题的办法。我建议你在一天中有意识地定时感知自己的身体，以此让自己冷静下来。对自己说：“我可以在更短的时间内完成一切。”\n\
  \n逐渐夺回对局势的控制。设定边界，例如下班后关闭手机，为家人、朋友和爱好留出时间。睡前听宁静的放松音乐，获得充足的睡眠。\n\n## 帮助释放的技巧\n\n\
  ### 影像对话技术\n\n找一张你快乐时的照片。看着照片，告诉自己你需要改变什么。说出这些话：“你的价值远比这高得多。你可以脱出这种困境。开始相信你可以解决这个问题。你非常**卓越**。我会一直在这里支持你。”重复这个练习。\n\
  \n### 新音乐技术\n\n私下花几分钟听一些滋养灵魂的积极音乐。在做这件事时**微笑**。你可以自由地活动。选择新的、不同风格的音乐，而不是可能让你想起过去往事的旧喜好。从现在起，重点是创造“新的”积极体验。\n\
  \n### 积极未来技术\n\n训练你的大脑看到没有成瘾的生活的积极画面。说出你想要成为的那个人的话。意识到是谁或什么在这一过程中帮助了你。感激每一个小进步并继续前进。如果某些事以前帮助过你，尝试再次使用。建立一个帮助你的物品的武器库。\n\
  \n*   视觉化自己在没有成瘾的情况下过生活。\n*   说：“我可以掌控。我是掌控者。我做着健康的选择。”\n*   使用红三角技术：将成瘾放入脑海中的红色三角形中，并将其缩小，直到它像一粒尘埃。\n\
  *   对着自己的照片说话。说：“你可以把这转化为积极的。你可以解决这个问题。你可以克服它。”\n*   伴随着让灵魂歌唱的积极音乐自由律动。\n\n**步骤\
  \ 1. 识别你的问题。**\n\n**步骤 2. 对事情会有极其卓越的结果感到更加积极。**\n\n**步骤 3. 改变你的生活方式，创造新习惯来戒掉成瘾。**\n\
  \n切断成瘾的根源，释放自我，感觉非常**卓越**。\n\n\n\n\n\n如果你经历过某种失去，你可能会感到心力交瘁，并认为自己再也无法真正享受生活。生活确实会变得不同，但没有任何理由你不能最终用快乐来取代你所经历的痛苦。俗话说时间是治愈的良药。但治愈你的并不是时间本身，而是你如何利用时间。如果你告诉自己你会找到方法让生活变得精彩，甚至比以前更加美好，你的大脑就会变得关注解决方案，并对那些能帮助你的事情保持开放态度。\n\
  \n### 垫脚石技术\n\n接受你的感受，接受释放所有的情绪可能需要一些时间。给自己需要的空间和时间，然后想象所有的感受都是你人生道路的一部分。将所发生的事件看作是你过去长长垫脚石之路中的一块，并深知未来你还会创造更多的垫脚石。每当你想起那个人或那个事件时，把它看作一块垫脚石，而不是脑海中反复播放的电影。通过掌握控制并停止过去事件的电影，你将走出情绪的螺旋。想象你面前有一条弯曲的线条，引导你走向你能够接受并走出失去或丧亲所需的一切。\n\
  \n*   如果你感到悲痛，就静静地坐着，让它流逝，同时说：“一切进展得极其棒。”\n\n在每种情境中都能产生美好，你每天都要起来，准备好去发现属于你的美好。一旦你找到了能帮助你的美好，将来有一天你就可以利用自己的知识和经验来帮助他人。记住，你并不孤单。世界上有许多失去——它是生活的一部分。\n\
  \n你无法做任何事改变过去，但你可以改变你对过去的感受，从而向你的未来迈进。为你经历过的美好时光感到高兴。感到知足。从所发生的事情中汲取教训。记住，其他人都在创造自己的生活，就像你必须向前创造属于自己的新生活一样。\n\
  \n如果你遭受了不公，请记住每个人都力所能及。每个人都有局限性，所以试着接受他们现在（或过去）的真实。假设所发生的一切都是注定会发生的，允许自己过上更好的生活。\n\
  \n我们从小起就被教化为认为万事都应该是完美的，但现实中，我们都是自然的一部分，而生活是不可预测的。如果你的潜意识从小就教导你失去和丧亲可能会发生，并且如果某些事件确实发生了，你会感觉良好，那么当它们发生时，你可能会轻松应对。但更有可能的是，你被告诉生活本应该是某种特定的样子，而当你经历失去时，它并没有向那样发展。你是一个敏感且充满爱的人，你也足够强大可以度过发生的一切。你可以的，你会的，而且你正在度过。尝试以下练习来帮助你。\n\
  \n### 快乐照片技术\n\n找一张你和你所失去之人的快乐照片。\n\n1.  对自己的影像说话。对自己说你想说的任何话。让情绪发出来。说那些伤心的话，说那些美好的话，流下不快的泪，流下快乐的泪。让悲伤的情绪释放，让快乐的情绪再次流淌。告诉自己你可以再次快乐起来。告诉自己你会再次找到幸福。不要让别人破坏了你的快乐。像安慰小孩子一样对自己说话。说：“事情会都会进展得极其棒。你的生活会变得更好。你会找到方法让这整个阶段处理得尽可能好。”\n\
  2.  对你失去之人的影像说话。告诉他们你想说的一切。告诉自己：“没有了你我的生活将是一场极其精彩的冒险。我会向你证明，我的生活将会是精彩的。”\n\n###\
  \ 季节变换技术\n\n我们都是自然的一部分，就像自然一样，生活是一系列季节：花朵在春天开始绽放；在夏天它们开得更盛了；在秋天叶子从树上落下；在冬天，寒冷的日子让我们欣赏家中的温暖。没有热量，你就不会理解寒冷；没有雨，你就不会注意到阳光。像自然一样，你的生活是一场不断变化的旅程。其中一些变化将涉及个人困难，它们会教你一些事情，例如对他人的怜悯和善良。生活中总会有变化。从你失去的经历中学习，永远不要让变化对你的影响大至于让你痛苦。生活如此宝贵，不要让它被伤害如此突然中断。让它消散吧。每种情境都有美好。学会顺势而为。冷静深呼吸，当你思考季节更替、生活从现在起再次流淌时，对这种情况感到放松。\n\
  \n几年前，我因癌症失去了一位亲近的朋友。我决定不让她的离开成为一段痛苦的经历。因此，为了纪念她，我每天都在桌子上放上精美的餐巾（不再等待生日和特殊场合）。使用精美的餐巾提醒我要充实地过每一天，拥有一个极其精彩的生活。这也有帮助我在想起我的朋友时感到更加积极。纸餐巾有一种积极、振奋的感觉，因为它们与庆祝联系在一起，所以它们会让你想起美好的时光。\n\
  \n一天，我姐姐来访，评论说我在桌上的餐巾架里放了一堆色彩鲜艳的有图案的餐巾真好。“我们在等什么？”我问她。“我的意思是，真的，我们在等什么？让我们开始生活吧！”“你说得对，”我姐姐说，“我也要开始用餐巾了！”\n\
  \n即使在餐馆，当别人提供餐巾时，我也会微笑，因为这提醒了我要享受生活。\n\n买一个餐巾架，装满彩色的餐巾，并开始过好每一天。（并且，请给我发送你餐巾的照片：Ails\
  \ Frank 博客、Twitter @AilsFrank 或 Instagram ailsfrank）\n\n*   真的没有比现在更好的时候了。\n*  \
  \ 重新找到生活的意义。\n*   让日常生活变成一种快乐的经历。\n\n\n\n\n男性和女性在离婚时会感受到同样的痛苦。感到沮丧和难过是很常见的。一位客户曾对她的前夫充满了愤怒，因为他跟另一个女人私奔了。在与我进行过几次咨询后，她开始意识到这段关系实际上是随着时间的推移而破裂的。她意识到自己有时也不够理智——她并不总是对讨论持开放态度，而且看问题非黑即白——也许这部分也是他离开的原因，因为没有妥协的空间。她也接受了一个事实，由于她的前夫仍在继续提供经济支持，所以她没有金钱之忧。她开始更加感激他的经济支持，而不是感到怨恨。最终，她的愤怒消散了，她和前夫成了朋友，这让孩子们的生活好多了。当她接受了他身边有了别人时，她能够继续自己的生活。接着她也遇到了另一个人，她从那段经历中汲了教训。\n\
  \n- `接受事情已经变成现在的样子将有助于消除压力和伤害。`\n\n如果你在离婚中失去了孩子，你需要保持与他们的联系，让他们知道你爱他们，并在你的生活中做一些\
  \ AMAZING 的事情来填补空虚。记住，孩子们会长大的，有一天情况可能会发生变化，你可能会再次与他们亲近。\n\n我们都是在童话中长大的，童话告诉我们世界上有一个属于自己的王子或公主，只要我们在一起，就能永远幸福地生活下去。现实中，有很多王子和公主，但哪一个是完全完美的。你会找到另一个人，当你找到时，你将能够利用过去的经验来把事情做对，通过保持理智、与那个人良好沟通并共同解决问题。\n\
  \n你会走出你经历过的感情破裂，并向前迈。世界上有数百万人，我向你保证，那里有一个适合你的你。适合你的人绝不止一个。所以请相信，会有更好的人进入你的生活。\n\n\
  以下建议将对你有帮助。\n\n1. 将这段感情际关系看作是你人生旅程中的一块垫脚石。把它看作是过去的事，是通向绝佳关系道路的一部分。每当你的前伴侣出现在你脑海中时，就看到那块垫脚石。\n\
  2. 如果那个人是适合你的，事情本会顺利发展的。对自己说：“我是 AMAZING 的，我值得和对待我很好的人在一起。”\n3. 对自己说：“一切都在进展得 AMAZING\
  \ 地好。”无论发生什么，都要假设一切都会进展得 AMAZING 地好，而且你的生活会比你留在那个人身边时变得更好。\n4. 努力完善自己。你越快乐、越自信，就越可能遇到尊重你的人。\n\
  5. 永远不要让别人夺走你的幸福。出去，通过做你喜欢的事情来创造新的快乐。在课程中学习一些东西，或者做一些其他 AMAZING 的事情，这样当你回首这段时光时，它是你让自己的生活变得更好的时刻。\n\
  6. 爱每一个人，即使你和他们意见不合。看到每个人、每件事幽趣的一面。学会自嘲和对世界大笑。每个人都在尽所能地。\n7. 跳出非黑即白的、僵化的思维，例如：“这已经发生了，所以现在一切全是垃圾了。”相反，开始生活在灰色地带，那里才有解决办法。生活在一个充满可能性的世界里。说：“这件事已经发生了，但我可以并且将会把它变成一件好事。”\n\
  \n定期阅读这一章，直到你感觉好起来。\n\n对那些触动你生活的人身上的好事事 `SMILE, SMILE, SMILE`。如果你愿意，一切都会进展得 AMAZING\
  \ 地好。\n\n`切断悲伤，感受 AMAZING。`\n\n***\n\n### 章节总结\n\n- 做一些你在失去之前没有做过的新奇、有趣的事。\n- 想象有一根扭曲的线条引导着你走向从这些事件中完全康复所需的一切。\n\
  - 使用“快乐照片法”：对着自己的照片说话，告诉自己你的感受，释放出情绪，然后告诉自己一切都会进展得 AMAZING 地好。对着你失去的人的照片说，你将让你的生活变成一场\
  \ AMAZING 的冒险。\n- 建立一个照顾自己的自己的习惯。\n- 每顿饭都准备彩色的纸巾，提醒自己珍惜每一个时刻。\n- 计划已经改变了，你可以应对新计划。\n\
  - 计划一些值得期待的事。\n\n**第一 步：接受事情已经发生。**\n**第二 步：理解你将再次感觉感觉良好。**\n**第三 步：允许事件转变为积极的事物。**\n\
  \n***\n\n*如果你只是坐着等它发生，它就不会发生。但如果你开始过你热爱的生活，你会感到更加满足，并找到一个很棒的伴侣。*\n\n![第 15 章：寻找爱情](img/contents.xhtml#toc15)\n\
  \n在你生活的国家有数百万人，绝对不止有一个适合你的人。认为你最终将孤单伶只是疯了的。当然，你可以找到某人，就像你可以在生活中让任何事情发生一样。通过做出良好的选择和决定，你可以发现、培养并享受一段良好的关系。如果你只是坐着等它发生，它就不会发生。通过过你热爱的生活，你的积极态度将为你的生活带来更多快乐，你最终会找到一个很棒的伴侣。\n\
  \n做你喜欢的事，照顾好自己，建立自信，打理外表并感觉 AMAZING。你的积极态度会吸引属于你的伴侣的注意。\n\n\n\n\n反思你过去在关系中哪里出了错，以及从现在起你可以如何做出何种改变。将关系的破裂归咎于前任的行为是很容易的。但是如果例如，他们欺负了你，你为什么不反抗呢？这次你可以做得更好吗？你从父母的关系中学习到了什么？是好是坏？从你目前的人生经验中，你对关系学到了什么？你能做什么来确保自己做对决定？\n\
  \n摸着良心说，你可能知道过去的关系并不对劲。也许是你或你的伴侣，或者你们双方都没有解决这些问题。确保这次当你找到一个可以建立良好长期关系的人时，找到解决问题的方法。但要避免过度补偿。例如，也许你在过去的关系中很有控制欲，你认为这导致了分手，因此在新的关系中你退后并允许自己被欺负。人们往往会走向另一个极端，而不是找到中间地带并平衡，这很常见。\n\
  \n我的一位客户最近遇到了一个她非常喜欢的男生。他们在一起过得很开心，一起去看电影、散步、在酒馆花园喝饮料，或者只是在家里看电视。“但他不是我的类型，”她告诉我，“他对我来说有点太‘正常’了。我不确定是否应该和他在一起。我觉得很困惑。我习惯了和那些更外向、派对型的男生约会。”\n\
  \n我告诉她，生活不只是派对，她真的需要一个在日常生活中让她感到舒服的人。我提醒她，她过去认识过的那些酷酷、爱派对、长得帅男生最后总是让她心碎或利用了她。我建议她把关于新男朋友的任何决定放在脑中的“架子”上，日后再重新考虑，让她在关系发展的同时享受他的陪伴。\n\
  \n这是我在客户身上经常遇到的问题——他们害怕对某人投入，因为他们认为外面可能有更好的人。但一段幸福、平衡、充满爱的关系是基于你们一对一的互动方式。我与我的客户讨论了这一点，她意识到旧类型的男朋友可能不再适合她了。她决定继续和那个男生约会，这样她就可以更好地了解他，并给关系一个发展的机会。一段时间后，她告诉我，“这种新类型”绝对是她的菜，她和男朋友生活得很幸福，他们正计划一起组家庭，而我们所做的工作改变了她的生活。\n\
  \n虽然如果你打算不继续这段关系就误导别人是不公平的，但有时你只需要给事情一个机会，并给自己足够的时间和空间来做出正确的决定。\n\n### 搁置法 (Shelve-it\
  \ technique)\n\n尝试放松心情，让生活成为一场冒险。如果你今天不知道某个问题的答案，不要担心。把它放在你脑中的“架子”上，在一周、一个月或六个月后重新回顾它。如果你今天不知道答案，可能今天不是做决定的合适时机。搁置它，永远\
  \ true 它会以极其出色的方式解决。\n\n如果某人因为处于另一段关系而不准备对你投入，请继续前进。如果你接受了做次优选择，你会被那样对待。问问自己，为什么对自己的要求这么低？你为什么想证明你可以抢走别人的伴侣？告诉他们：“这对我来说还不够。我建议你回到你的伴侣那里解决你们的问题。谢谢，但不必了。我有我的生活要经营。”离开那些浪费时间的人。会有一个非常棒的人在等着你。\n\
  \n我经常听到客户说：“好男人/女孩都被抢光了。”然后几周后，在和我进行了一些治疗课程后，他们回来告诉我遇到了一个非常棒的人。\n\n#### 负面暗示 (Negative)\n\
  \n- 如果你对自己说：“男人/女人都是没用的，”你就会和那些没用的伴侣在一起。\n- 如果你对自己说：“好男人/女孩都被抢光了，”你就遇不到好男人或好女孩。\n\
  - 如果你对自己说：“我永远和一个人定下来，”你永远无法和一个人定下来。\n- 如果你对自己说：“我将永远痛苦且孤独，”你将永远痛苦且孤独。\n\n#### 正面暗示\
  \ (Positive)\n\n- 如果你对自己说：“我正和一个非常出棒、善良且体贴的男人/女孩在一起，”你就会和那个人在一起。\n- 如果你对自己说：“我婚姻美满，住在美丽的家里，”你就会过那样的生活。\n\
  - 如果你对自己说：“对我充满爱的体贴伴侣来说，我是一个完美的体贴伙伴，”那么你就拥有一段充满爱的关系。\n\n事实是关系中的双方都需要保持独立，共享时间，保持理智，并在关系中感到自由。如果你认为为了进入关系你永远不需要改变，说明你太固板了，良好的关系是基于灵活性的。你们都需要互相适应才能良好地合作。\n\
  \n## 完整性 (Being complete)\n\n### 全圆圈法 (Whole circle technique)\n\n你出生在这个世界上是完整而完美的，像一个完美的圆。然后，生活逐渐侵蚀着你，直到这个圆变得有些扭曲和变形。如果你没有表现出完整的自我，你可能会吸引一个你自身反映的伴侣。这个你认为完美的伴侣，实际上也是一个扭曲的圆，像你一样受到了生活的影响。想象你的生命之圆是完整且圆的，正如你回到了真实的自我。\n\
  \n为了找到正确的伴侣，你需要通过使用书中的技巧回到真实的自我，并建立你热爱的生活。然后，一旦你了解了自己是谁，你就会遇到一个与你处于同一积极水平的人。你将再次成为一个完整的圆，他们也是一个完整的圆，你们将都会感到幸福和自信。你会感激过去关系的结束，这让你能够发现自我并遇到这个新人。\n\
  \n彼此灵活和开放是适应彼此做事方式的关键。通常人们在关系早期就会分手，是因为其中一方对投入感到畏缩。如果发生这种情况，不要担心。如果一段关系注定会发生，它就会发生。放手让对方离开要要知道无论你是否和他们在一起，一切都会极其出色地解决。有时，人们需要时间来适应与某人在一起的想法，当他们不再和你在一起时，他们会意识到失去了什么。让关系顺其自然发展。\n\
  \n\n\n\n将约会看作是寻找房产。买或租第一眼看到的某处房子是很罕见的。大多数人都会仔细观察，在看好几处房子后，才决定最适合自己的那一个。有时，人们认为自己找到了合适的房子，结果交易失败了，这让他们感到非常失望。但他们最终总能找到更好的。享受“找房”的过程，但当合适的人出现时要准备好投入。享受约会，并向你的目标迈进。你会找到属于你的人。在此期间，尽情享受单身生活吧，要知道爱情已经在路上了！\n\
  \n## 单身寻找爱情——“寻找一双舒适的鞋子”\n\n我使用的另一个类比是：良好的关系有点像一双合脚且感觉良好的舒适鞋子，而一段糟糕的关系就像一双并不舒适、但你又太想要所以还是买下的鞋子。从买下那双不合脚的鞋那刻起，它们就会给你带来麻烦。它们让你起水泡，让脚部肿胀疼痛，但你却坚持下去，因为你在这些鞋上投入了这么多精力，不能就这样放弃它们。有时，你买了一双自己并不完全确定的鞋，但它们最终成了你最爱的，因为它们能搭配你任何想穿的衣服。\n\
  \n试着把寻找伴侣看作是买一双好鞋子。对自己诚实，给这段关系时间去观察它是否合适。但如果它真的不舒服，也不适合你，请做好放手的准备。\n\n## 寻找理想的伴侣\n\
  \n如果你现在就想要爱情，就积极地表达并让它发生。对自己充满自信。微笑并对自己说：“我**太棒了**。当然会有人爱我。我可以拥有一个很棒伴侣。”像对待生活的其他任何部分一样去对待它。为了让它发生，去做你需要的一切。去些地方，参加课程，变得有趣，过充实的生活。\n\
  \n想想你生活中那些顺利完成的事情，在考虑拥有伴侣时感受同样的感觉。开始相信一段美好的关系会发生在你身上。让自己处于最积极的状态中。当你感到快乐和满足时，你将会遇到一个让你感到快乐和满足的人。不要专注于对想和在一起的人的预设预期。相反，要专注于与一个易于相处且在生活各个方面都契合的人在一起的感觉。关注爱、幸福和拥有一段**极其棒的**关系。\n\
  \n*   与一个通情且体面的人结婚并生子。\n*   良好的关系完全在于获得正确的平衡并良好合作。\n\n### “携手偕老”技巧\n\n想象你和你那极好的（新）伴侣一起老了。想象回首你们的人生，回顾你们共同度过的的一切，比如假期、孩子、孙辈或任何你希望发生过的事情。定期重复这种技巧。当你看到其他幸福的夫妇时，微笑着对自己说：“这真是**太棒了**。我也有一个很可爱的伴侣。”\n\
  \n通过说这样的话让自己进入积极的心理：“我**太棒了**。我是一个很棒的伴侣。我爱我那**极其棒的**伴侣。我嫁得很好。一切都进展得**极其棒极**。”\n\n\
  不要再坐着等某个人了，让它**极其棒地**发生。\n\n### 章节总结\n\n*   保持完整和平衡，这样你就能遇到同样完整且平衡的人。\n*   使用“搁置法”：如果你无法做出决定，就把问题放在脑海中的架子子上。\n\
  *   通过结识他人来给关系机会。\n*   互相教对方了解你们都喜欢什么。\n*   将约会看作是寻找房产。只要你对现实情况保持开放态度，你最终会找到合适的那个。\n\
  *   寻找一个像一双非常合脚的舒适鞋一样的伴侣。\n*   不要向朋友负面评价约会。关注积极的一面。\n\n**第一步。理解过去是你学习的一部分。**\n**第二步。让你的生活变得有趣。**\n\
  **第三步。对不同类型的关系保持开放态度。**\n\n*从你自己的童年汲取好的方面，然后比你父母做得更好。*\n\n![第 16 章：教养](img/contents.xhtml#toc16)\n\
  \n## 你正通过教导孩子世界运作的方式来引导他们\n\n你的父母，或者任何其他抚养你的人，对你的影响最大，而你对孩子的影响也最大。良好的教养在于平衡。从你自己的童年汲取好事，将它们与常识相结合，比你父母做得更好。\n\
  \n通过转向天平的另一端来过度补偿悲惨的童年是常见的。例如，父母不关注他们的孩子可能会对自己的孩子投入过多关注，导致他们感到被困住。或者你的父母对你的童年进行了微观管理，这让你感到恼恼，并让你对待自己的孩子时变得过于散漫。如果这种情况发生在你身上，你可能不会设定边界和解决行为问题，因为你希望孩子感到自由。但自由需要与结构和常规保持平衡，而孩子也喜欢这些。\n\
  \n与其关注你的父母哪里错了，我建议你看看他们做对的地方，因为每个父母都会根据他们当时拥有的知识尽力而为。即使你不是由自己的亲父母抚养的，也许他们已经在当时的情况下和能力范围内尽了所能了。也许不和他们在一起对你更好。或者也许他们为你做的一切已经是那些必须做决定的人所能做到的最好的。无论你的成长环境如何，它都会包含一些让你变得更好的事情。\n\
  \n记住你父母或抚养者做对过，比如给你讲故事、为你做饭、带你游泳、教你开车或做饭、去度假、为你提供住所、或以他们自己的方式爱你。下当关于他们的负面想法进入你的脑海时，将你的想法转向童年中的好的方面。\n\
  \n作为父母，你的工作是向孩子解释我们为什么要做这些事、规则是什么以及我们需要遵守规则，以便他们理解世界是如何运作的。如果孩子被要求坐好却不知道为什么，他们就不会学会为每件事寻找理由或自己解决。当你要求孩子做某事时，始终给出理由和解释。\n\
  \n## 规则需要逻辑\n\n有一天我和一个朋友和孩子在外面。当时下着雨，我们刚从河上的船下来。那是很糟糕的一天，孩子一直问：“我现在可以吃冰淇淋吗？”每当她问时，妈妈都说“不”。过了一会儿，妈妈转向我问：“你能帮一下吗，艾莎？”\n\
  \n“我们不能吃冰淇淋了，因为在下雨，如果我们站在雨里吃会太冷了，”我对孩子说，“我们去咖啡馆吧，那里温暖又干燥。”孩子说了“好的”，因为这对她来说合逻辑，妈妈也意识到向孩子解释比单纯说“不”要好。\n\
  \n\n\n\n\n作为一名治疗师，我见过许多父母试图控制他们孩子生活的方方面面。一种典型的说法是：“我们非常有动力、很有进取心，我们只想让孩子像我们一样。”有些父母告诉我，他们的孩子没有遵守他们为设计的思维导图计划，并且抱怨在学校假期期间每天都要学习。有时他们谈论的对象甚至是年仅九岁的孩子。我个人认为，在学校假期期间应该禁止所有作业，这样孩子们才能从学校的所有压力中彻底放松出来。\n\
  \n请记住，当你还是个孩子的时候，你并没有现在可能拥有的那种动力和决心。你只是个孩子。所以，让你的孩子也做孩子吧，不要指望他们像大人一样思考。你可以告诉他们，只要他们努力，就会获得回报，而且他们需要在生活中找到自己的特殊立足点，因为每个人都有自己的长处。你可以向他们解释，我们都必须遵守规则，完成学业是非常重要的。但要让他们自己选择如何度过闲闲时间，让他们去做感兴趣的爱好。\n\
  \n如果你希望孩子变得自信，就让他们去做他们擅长的活动，这样他们就能对自己所做的事情自信。如果他们讨厌在训练中受伤，并且对武术完全不感兴趣，那么把他们送去武术班并打算让他们变得自信是没有意义的。成功的人可能会通过在孩子太小时推着他们，以及设定他们无法触及的目标来让他们生活变得更加艰难，导致他们最终放弃。\n\
  \n## 给孩子带来压力是一种虐待\n\n生活本身已经足够压力了，不需要父母再给孩子的生活增加负担。孩子们必须和父母生活在一起直到他们长大并能够自立。对于孩子来说，和一个给他们带来压力的父母生活，就像是一个被困在无法逃脱的高压力工作中的。父母的执念——希望孩子成为班霸、最好的运动员、班级上第一个阅读的人——会给孩子带来最极端的压力。为了解决你自己的问题，我建议听听育儿催眠治疗录音，这将帮助你感到放松并与孩子进行良好的沟通。\n\
  \n如果你的孩子想学设计，不要推他们去学医。如果你这样做，你就会让他们走上人生错误的道路。他们现在做出的每一个选择和决定都将影响他们的未来。所以，鼓励他们去建立*他们*想要的生活。如果你不让他们做自己，你最终会和他们之间产生距离，因为他们最终会挣脱出来，在不商量的情况下做出自己的选择，因为他们不想让你控制或影响他们的决定。\n\
  \n我认识过一些父母，他们说只有当儿子克里斯（Chris）选择学术性学科时，他们会在大学期间提供经济支持。克里斯在国家另一端的某大学找到了他想读的平面设计学位。他的父亲说离家太远，而且课程不够学术化。所以，克里斯违背了自己的意愿，去了一所离家近的大学学习法律，只为了让他父亲开心。开始课程后不久，克里斯在没有告诉父母的情况下申请了一年的海外学习。他的决定引起了许多争吵，因为他的父母担心他离家太远。但他还是参加了交换，最终，他父母的操纵适得其反，导致他们和儿子之间产生了隔阂。\n\
  \n*   处理好你自己的压力，保持冷静。\n*   调整你的生活，使你能够应对日常生活。\n*   对孩子有健康且现实的期望。\n*   教孩子追随梦想。\n\
  *   信任孩子的想法和选择。\n*   记住，学术成就只是任何孩子才华的一小部分。\n*   允许孩子拥有自信、外向的性格，这将使他们在生活中取得长远。\n\n\
  ## 人生的池塘会越来越大\n\n在托儿所或幼儿园，成为“班霸”可能非常容易，因为池塘很小。然后孩子进入小学和初中，虽然大池塘里孩子更多，但成为班霸可能仍然相当容易。当孩子进入高中时，池塘变得更大，成为顶尖学生也变得更加困难，尽管这仍然可能。接着，如果他们上大学或学院，成为顶尖学生将更加困难，因为池塘现在装满了其他学术顶尖学生。一旦你的孩子离开教育进入职场或育儿世界，突然之间就没有所谓的“第一人”了。\n\
  \n世界上有这么多的人，每个人对这个世界的运行都发挥着作用。我们购买的每件物品和服务的都依赖于源源不断的人。教你的孩子，每个人都有价值，他们必须在生活中找到最适合自己的路线。放弃对孩子成为“班霸”的执念，将让他们蓬勃发展并发挥他们真正的潜力，而不是在努力满足你过高的期望而处于持续的压力之中。\n\
  \n如果你教孩子做自己、为自己努力、发展技能并寻找解决方案，同时也保持快乐和放松，那么你孩子的生活将是*精彩非凡*的。教他们自己解决问题，让他们大脑养成这种习惯。如果你一直为他们处理好事情或为他们做决定，他们长大后可能仍然依赖你来做同样的事情。\n\
  \n对你的孩子说：“你们会解决的。一切都会进展得*非常顺利*。”提醒他们那些事情顺利解决的时刻。\n\n如果老师告诉你的孩子他们上不了大学，告诉他们，如果他们想去，就会找到方法。教他们他们*可以*找到方法。教他们想象自己正在完成学位，并且他们为获得学位所做的一切努力，如果那是他们想要的。作为个人，创造我们想要的生活取决于我们，而你的工作是告诉孩子，他们可以让生活变成他们想要的任何样子。但要让他们自己寻找方法。\n\
  \n职场变化很快，现在出现了许多十年前不存在的行业。所以，不要让你的局限思维阻止孩子找到正确的职业道路。让他们对未来做出符合他们自己的选择和决定。等他们离开学校时，可能会有更多你还不知道的新职业。当他们对某些事表现出兴趣时，那可能是他们以后职业产生共鸣的事情。\n\
  \n*   一个看时尚杂志时间比学习还多的青少年，可能会经营一家时尚公司。\n*   一个热爱游戏的电脑极客，可能会成为一名 IT 专家。\n\n这一切关键在于平衡。显然，你不希望孩子沉迷游戏。但如果你鼓励他们深入探索自己的爱好，例如在\
  \ YouTube 或其他网站上寻找关于电脑游戏如何制作、或者计算机如何工作和构建的教育视频，他们可能会学到一些用的专注能力和对计算机的兴趣。\n\n## 不要让生活变成一场戏\n\
  \n\n\n\n你的孩子是你的镜像。所以，如果你担心小偷闯入家中，他们也会担心。如果你对交通堵感到压力，你的孩子也会如此。如果你大吼，你的孩子也会大吼。事实上，你的孩子会使用\
  \ `your` 的语言，所以如果你抱怨别人，他们也会变得爱埋怨。如果你告诉他们你自己的恐惧——例如关于全球变暖，或者关于某个特定的选举结果将证明是对国家来说的一场灾难——他们可能比你还要担心，甚至可能担心世界末日到来。如果你对蜘蛛有恐惧，请“解决好你的恐惧”，因为无论你如何努力掩盖，你的孩子都会察觉到，他们可能也会产生类似的恐惧。\n\
  \n尝试通过保持积极态度和避免戏剧化来化解局面。例如，如果你的孩子没有在学校剧中获得角色，或者没有入选足球队，不要陷入这种情绪中。相反，要说：“没事的。会有更好的事情发生。一切会进展得**非常棒**的。”或者“也许你下次就能入选了。”\n\
  \n## 你的言语充满力量，所以谨慎用词\n\n如果你把你的孩子称为“害虫”，他们长大后可能会认为自己阻碍了别人。如果你把你的孩子称为“顽皮”，他们就会名不虚传。与其给他们贴上标签，不如尝试让他们分散负面行为的注意力。\n\
  \n保持积极冷静并说：“一切都会进展得**非常棒**的。”\n\n## 成为一个出色的榜样\n\n如果你在生活中遭遇情绪崩溃，不要指望你的孩子成为你的照顾者。相反，通过寻求外部帮助来调整好你自己。保护你的孩子免受你负面故事的影响。如果你想说的话不能改善他们的生活，就完全不要说。\n\
  \n当你的孩子上大学、独自出去旅游或离开家时如果你会哭，你需要寻找爱好或工作来填补这种空虚。使用书中的技巧来帮助你建立人生的下一个**精彩**的阶段。你的孩子应该能够过好自己的生活，而不必担心你。当你的孩子开启人生的冒险之旅时，你应该为他们感到高兴。\n\
  \n如果你对你的孩子提出要求，要求他们解决你的问题，请意识到你在做什么，解决好你自己的问题并释放他们。你的孩子不是为了当你的心理顾问，也不是为了帮你解决金钱、婚姻、工作或健康问题。\n\
  \n也许你自己的父母也把你放在了他们问题解决者的角色上。如果是这样，就开始通过告诉他们来设定界限：“你们能处理好的。”相信有**精彩**的方法可以解决问题，因为一切都可以改善和解决的。不要听命于你的孩子或你的父母。如果你、你的成年孩子和你的父母住在不同的大陆，你们都必须解决自己的问题。显然，可能会某一天你的父母老了需要支持。但等这些问题出现时，再寻找最**精彩**的方法来处理它们。\n\
  \n- 在你、孩子和父母的支持与独立之间取得正确的平衡。\n- 教导你的儿子女成为体面的人，尊重所有他人、动物和环境。\n- 以适合他们年龄的方式向孩子解释事情。有时，他们需要了解真相，而在其他时候，保护他们免受他们不需要知道的负面消息可能更好。\n\
  \n## 教导与引导\n\n你可以利用同样的活动教孩子一些，也可以什么都不教。想象在秋天，两个不同花园里有两个彼此独立、不相关的父母。第一位父母对他的孩子说：“小心树根。别绊倒。别把手弄脏。小心带刺的冬青。”另一位父母要求孩子帮助收集秋叶并装进袋子里。袋子很快就满了，当孩子们认为装满时，父母告诉他们站在上面压缩叶子，为更多叶子腾出空间。第二个花园的孩子比那些被强迫症父母微管理的孩子玩得更开心。第一个花园的父母教给孩子的除了恐惧和花园里处处是危险之外什么都没教，而第二个花园的父母在教给孩子知识和技能。\n\
  \n让你的孩子从小就做出自己的选择和决定。让他们参与到为朋友和家人挑选礼物。只要他们想这么做，就让他们自己选择穿什么。你不需要从他们拥有的每件衣服提供全部选择。只需要在几套装服之间给他们有限的选择即可。随着他们年龄增长，做决定更快，你可以给他们更多选择。你的着装反映了你的很多信息，所以让你的孩子的个性绽放。通过让他们对自己的身份认同建立自信，他们也将学会独立。如果你习惯于控制他们的选择，他们长大后会质疑自己的决定。\n\
  \n## 咖啡与甜甜圈\n\n花时间与孩子建立联系。去咖啡馆坐坐，听听他们想说什么，这是一个在没有家庭干扰的情况下与彼此交流的好方法。（关掉手机！）尝试与你的每个孩子度过单独相处的时间。不要找没时间的借口。让它成为可能：“我可以。我正在做。已经完成了。我优先考虑。”\n\
  \n重新安排你的生活，留出与孩子交流的时间。在一起度过轻松的时光，对他们和他们的生活感兴趣。也谈谈你的生活，让他们习惯于讨论不仅仅是关于他们。一个良好的沟通者会提问，并对他人感兴趣。教教他们这一点。谈论他们感兴趣的话题。建立一段终身的关系。爱他们，接纳他们。如果他们没有达到你的预期，就接受吧。如果你今天都和孩子相处得不好，以后还会吗？很多人不和父母或兄弟姐妹交流。这一切从现在开始。\n\
  \n## 沟通\n\n我经常在咖啡馆观察父母。有些在微管理孩子，有些忽视他们并沉浸在电脑或手机中，而有些则与他们进行愉快的对话。\n\n与孩子面对面交流。全家人一起坐在桌旁吃晚餐。如果你对孩子无话可说，问问自己为什么？我能做得更好？观察孩子的肢体语言。当你说某些话时他们退缩时，谈谈他们感兴趣的积极话题。\n\
  \n如果你是单亲父母或离婚了，不要在孩子面前谈论你的前伴侣或感情生活。说话前先思考。\n\n## 分散注意力\n\n有一天，我在伦敦地铁站看到一个小孩子在闹情绪。母亲告诉他停下来并站好，但他继续胡闹。他们面前的墙上有一些飞机海报，母亲可以通过说“哇，看那些飞机！”来分散孩子的注意力。但她太关注他的行为了，以至于没有注意到那些海报。\n\
  \n寻找周围的事物来分散孩子负面行为的注意力。如果你感到沮丧，你的孩子可能也是。地铁站的妈妈可能累了，但有时分散对话比战斗要轻松。。随身带一个活动包，因为小孩子在旅行或在餐厅时很容易感到无聊。\n\
  \n\n\n孩子们从与你的对话中学习学习。不要依赖技术来娱乐他们，或者让他们坐在电视机前而忽视他们。限制他们每天看电视的时间，并花时间与他们聊天。当你的孩子还小时候，通过去博物馆、观察自然或看书等活动，用他们感兴趣的话题激发他们。\n\
  \n*   那个玩过艺术品拍卖棋盘游戏、并被祖父母带到美术馆的小女孩，后来在大学学习了艺术史，并在巴黎获得了艺术商务硕士学位。最后，她在一家拍卖行工作。\n\n\
  **请记住，无论你的孩子周围是什么，它们都会成为他们的一部分。**\n\n## 保护你的孩子\n\n你决定了孩子周围应该充满什么，而你对生活的反应会影响他们。如果你选择在茶几上摆满充满人物负面形象的杂志，并且不向孩子解释所描绘的行为并不正常，他们长大后会认为这没问题。如果你让他们看恐怖电影或玩暴力游戏，他们易受影响的心灵就会受到暴力和恐怖的影响，这可能导致他们感到恐惧、担心、做噩梦或自己变得暴力。请务仔细考虑你让孩子们看的内容。\n\
  \n孩子在入睡前听到的最后一句话会在脑海中持续一整晚。因此，我建议你只在孩子睡觉前让他们听积极、平静的音乐或积极的录音。我有许多孩子客户习惯于在睡前看暴力电影或负面新闻，然后会被这些素材诱发噩梦。\n\
  \n*   确保你的孩子只接触适合其年龄的内容。\n*   睡觉时收起他们的手机。\n*   控制他们玩的游戏，即使这意味着不让他们玩他们朋友在玩的游戏。\n\
  *   在你的电脑上开启家长控制以保护你的孩子。\n*   限制他们使用社交媒体。\n*   帮助你的孩子培养健康的兴趣，如烹饪、运动、艺术、手工制作、舞蹈。\n\
  *   告诉他们世界上有很多好事，而不仅仅是新闻中显示的负面消息。\n*   让孩子解决自己的问题。给他们建议，但让他们学会为自己努力。\n*   保护你的孩子免受兄弟姐妹的虐待。不要假设你无能为力或这是正常行为——事实并非如此。\n\
  *   如果你的幼儿不喜欢去托儿所，找个办法让他们适应。不要责怪他们，因为他们做不像其他孩子那样做。对自己说：“一切进展得非常顺利。”\n*   如果你的孩子在寄宿学校且不喜欢那里，请听听他们的想法，并尽力改变现状。\n\
  *   教你的孩子，每个人都在根据所学知识尽力而，即使他们的表现并不完美。\n*   教你的孩子多和对他们有用的人相处。\n\n## 成为好父母\n\n来自任何背景的任何人都可以成为好父母或坏父母。所有父母的共同点是，他们都可以改进自己的教养方式。从现在开始，努力改善你与孩子的关系。在参与其中和知道何时保持沉默之间找到平衡。教你的孩子对他人的友善。教他们体贴，也许可以通过为某人制作生日卡或礼物。如果某天他们忘记为你买生日卡了，不要让这让你心烦。只需轻轻地提醒他们下次，并接受他们可能有其他心事的事。\n\
  \n## 让生活变得有趣\n\n从小以有趣的方式学习某事会为孩子们创造快乐的回忆。\n\n*   如果你通过扮演服务员来收拾桌上的餐具，他们将总是愿意在厨房里帮忙，因为这会与快乐的感觉联系在一起。\n\
  *   如果你在洗头时玩理发师或理发店游戏，他们实际上会期待洗头。\n*   如果你在一起打扫房间时播放好听的音乐并合唱，他们将总是喜欢收东西。\n*   如果他们在边计时玩游戏的同时边整理房间，他们会乐意捡起衣服并收拾好自己的东西。\n\
  \n如果你的儿子和女儿们知道如何照顾自己，并且尊重他人且乐于助人，他们长大后将拥有幸福的关系或婚姻。\n\n## 职场父母与全职父母\n\n有些人如果因为工作而不得不把年幼的孩子留在托儿所，或让年较大的青少年留在家中，会感到愧疚。另一些人如果他们留在家中没有职业或不赚钱会感到不好。许多人还觉得，他们在教养孩子方面做出的决定正受到其他父母或家庭成员的评判。\n\
  \n每个人在生孩子之前都是不同的——有些人有事业，而另一些人没有。所以他们在生完孩子后也会是不同的。作为父母，找到最适合你和你的家人的方法是取决于你自己的决定的，因为做某事并没有一种一成不变的方法。无论你如何安排事务，无论你是工作还是留在家，只要对你有效就没关系。\n\
  \n无论其他父母是工作还是留在家，都要给予支持。记住，其他人也是个体，他们决定如何做某事与你无关。我的许多女性客户告诉我，在生完孩子后，她们对什么才适合自己感到困惑。我总是鼓励她们将生活和职业引向最适合自己的方向。你需要听从内心。你需要找到正确的平衡。\n\
  \n不要让孩子成为你停止建立安全的财务未来和职业的借口。相反，要说：“我有一份非常棒的工作，薪水很高且能兼顾孩子。我有非常棒的育儿解决方案。”如果你想得很好，你就能找到非常棒的解决方案和正确的平衡。我在客户身上反复看到这种情况。例如，会有一些妈妈愿意通过照孩子来赚点外钱，而你的孩子也会乐意去朋友家里，并从他人陪伴中获得独立。\n\
  \n如果你是自雇人士，支付更多的育儿费用是有用的，可以为你提供更专注的时间来完成更多工作。你会发现，支付更多的育儿费用，总收入会增加。最好是让孩子照看一整天，而不是零星的一小时，这样你就有完整的工作日来进入工作状态。\n\
  \n## 顺应工作\n\n你可能需要在人生的不同阶段调整你的职业。所以，随着孩子需求的变化，顺应每个阶段最有效的方法。想象你和孩子的生活像铁轨一样平行顺畅地运行。\n\
  \n## 教孩子金钱观\n\n你的孩子需要学习如何管理金钱，以便培养能够在现实世界中管理财务的技能。鼓励他们储蓄零花钱和生日钱。教他们做预算。这完全关乎选择和决定。如果他们选择把钱花在某件事上，那么以后他们想买其他东西时就没有钱了。教他们储蓄大部分收到的钱，总是将一部分存入储蓄账户。\n\
  \n\n\n我把一份我的催眠录音 `Money – Increase your Wealth` 给了我的擦窗工，他之前一直在抱怨他成年的儿子开销失控，他不得不不断在金钱上为儿子兜底。我意识到他和儿子在财务上存在一些边界问题，而我的录音可以解决这些问题。六周后当他再次来擦我的窗户时，他涨了价。我真为他能够要更多钱而感到自豪。不过这确实让我忍俊不禁，我明明是那个送给他“增加财富”录音的人，他却反向我收了更多的钱！催眠给了他收取更高价格的自信，并让他对此感到良好。结果，他每月多赚了\
  \ 500 英镑，这是一个相当巨大的增长——而且他决定让儿子自己承担自己的财务责任。\n\n## 姻亲\n\n你的姻亲对你可能很有用，所以对他们提供的任何帮助表示感谢。如果他们愿意照顾你的孩子让你喘口气气，就让他们去做吧。接受他们处理事情可能与你不同。如果你和姻亲的关系很紧张，试着把这些情况看作动画片，这样你就可以付笑一笑，而不是感到愤怒。\n\
  \n记住，你的姻亲一生都受到了这本书中提到的所有问题的影响。无论他们表现如何，他们都在力所能及，就像其他人一样。如果你有无法愉快相处的姻亲，而且他们似乎执意于在你允许的情况下摧毁你的婚姻，请想象一下“不可思议的解决方案”和“一切进展顺利”。如果你的伴侣无法反抗他的她的父母，请接受这一点，并找到一种绕开他们的方法。\n\
  \n## 孩子与分离/离婚\n\n如果你正处于一段糟糕的关系中，你需要尽一切努力解决问题。我相信书中的技巧将帮助你解决大多数关系问题。如果你确实决定分道扬扬，你有责任在金钱和情感上都支持你的孩子，并尽力经常见到他们。从过去的错误中学习，确保自己不会再次落入另一段破坏性的关系中。\n\
  \n如果你已经离婚，请与你的孩子保持联系，即使他们看起来对你不感兴趣。每个人都需要感到自己被需要。你的孩子可能面临来自周围人的压力，说他们不想见你。请超越你和前任创造出的任何混乱，做一个成年人，并尽一切努力保持与孩子的关系。\n\
  \n通过给他们寄信或包裹来保持定期联系。每周给他们零花钱，让他们觉得他们与你有定期的联系。如果你不确定前任是否允许孩子收到你寄出的信件，请复印你的信件，这样等你的孩子长大后，你可以向他们证明你确实尝试过建立联系。\n\
  \n如果你确实与孩子保持定期联系，不要只打开电视指望他们自己娱乐。让你们相处的时光变得真正特别，让他们对与你在一起有美好的回忆，并想要更频繁地见到你。\n\n\
  * 在孩子的生活中找到属于你的独特角色。\n* 不要对孩子说关于你前任的负面话。试着对他们的另一半说一些不可思议的事情，也对你自己说一些不可思议的事情。\n\n\
  ## 什么时候是孩子的孩子的时机？\n\n如果你在年轻时生孩子，你的财务状况可能不够稳定，事业可能刚刚起步，你可能会错过和朋友出去玩耍的机会，并且可能为这种责任感到挣扎。但你以后会受益，因为当孩子长大后，你有时间继续过自己的生活。\n\
  \n如果你在晚一点生孩子，你的财务状况可能更稳定、更成熟，因此更有应对能力。但你可能在适应上感到挣扎，也许是因为你已经习惯了自己的生活方式，而且身体状况可能较差。\n\
  \n无论你在什么年龄生孩子，都必须做出牺牲，就像任何父母都会一样。如果你觉得你生孩子的时机不对，请接受既定事实，不要沉溺于自怜。如果你注定要在不同的时间生他们，你就会那样做。保持开放心态，听取那些经历过此事的经验丰富的父母的建议。\n\
  \n生孩子的现实并没有真正告诉过年轻女性，因此她们的潜意识中没有存储这些信息。\n\n## 希望你后悔没生孩子\n\n有些女性在有了孩子后感到完整。有些人希望自己根本没有生过孩子。有些人偶尔会产生转瞬即逝的遗憾。父母对于某些人来说可能是一个真正的挑战。但我建议你顺应它，而不是与之对抗。\n\
  \n你有这样的感受是没关系的。你是一个个体，你过去是，将来也永远。对自己说：“成为父母带来了不可思议的事情。”进入为人父母的角色，让你的孩子让你能够体验和理解生活的完全另一面。让它成为一场冒险。\n\
  \n通过确保自己每周都有一些自己的高质量时间来管理你的情绪。和伴侣安排时间，不要让孩子完全接管生活。如果你是单亲，你需要和朋友共度高质量时光。通过发挥创意，你会找到获得平衡的方法。始终相信事情会以不可思议的好结果解决，会让好事的发生。在你的脑海中，留意生孩子的优点。如果你觉得生孩子让你精疲力竭，记住这只是一个阶段，会持续到他们长大。你可能无法做或负担不起以前能做和负担的事，但有一天它们将再次可能。\n\
  \n你有时可能会觉得：“我无法应付这些孩子了。他们让我疯了。我无法应对。”如果这种情况发生了，请提醒自己这个阶段不会永远持续。\n\n为人父母是一系列阶段，最终将是孩子长大并承担自己的责任。在此期间，尝试用不同的做法。做出更好的选择和决定，找到更简单的方法处理它们。识别出真正让你感到压力的来源——可能是他们的作业或整个睡前程序——然后解决它。\n\
  \n对自己说：“我可以做到。我正在做。已经完成了。”像对待这个阶段是一部幽默疯狂的电视情景剧一样，对它大笑出来吧！\n\n\n\n对于孩子身上发生的每一个问题，总会有解决方案。改变做法就能获得不同的结果。例如，在晚饭前洗澡，或者让你的孩子打电话给学校的朋友寻求作业上的帮助——毕竟，他们的朋友当时在课堂上，而你不在。\n\
  \n## 也为你自己建立一种生活\n\n**记住，你的生活和孩子的生活应该是并行的。在某些时期，当他们还很小时，你必须为他们做更多。但在此过程中，也要为自己建立一种生活。拥有自己的生活也将帮助你在孩子离开家后避免空巢候症。**\n\
  \n有些女性热爱为人母，所以当孩子们离开家独立时，她们感觉就像失去了一份永远无法回去的工作。如果你不小心，可能会因为这种失落而陷入抑郁。\n\n一个朋友告诉我，女儿上大学时，她每天都哭了两个月。我告诉她：“其实，什么都没有改变。你女儿上幼儿园的时候，你也每天哭了好几周。”我还提醒了我的朋友，在她女儿上上小学时的一次家长说明会上，校长把她从学校礼堂里请了出去，因为她的哭声让其他家长感到不安！我说：“是时候改掉这种为孩子哭泣的习惯了。”她也同意自己的行为很荒唐。\n\
  \n我建议，如果你是因为育儿阶段的结束而感到难过，你应该花时间去帮助许多许多需要支持和指导的孩子，无论是担任志愿者还是付费的角色。让你的孩子看到你在经营自己的生活，这样他们才能快乐地经营好自己的生活。\n\
  \n*   不要做一个极端的父母。\n*   乐于看到孩子迈向人生的下一个阶段。\n*   庆祝他们的进步。\n*   不要让育儿成为你不去经营美好生活的借口。\n\
  \n### 风筝技巧\n\n**想象你和你的孩子在一个美丽的地方，也许是在海滩上或多草的山坡上。让你的想象力带你去一个对你来说特别的地方。想象每个人手里都有一个正在放的风筝。想象你们都控制着自己的风筝。想象你们每个人都在他人的风筝周围穿行。每只风筝都运行得很好。它们彼此很近，但可以在空中彼此自由移动。有些风筝飞得很高，有些则位置较低。你们在放风筝时都在微笑。风筝提醒你，你们既可以很好地共同合作，也可以独立完成工作。重复这个练习，这将让你记住每个人的独特性。**\n\
  \n## 享受你的孩子\n\n如果你在孩子人生的每个阶段都放松、快乐、平衡且积极，他们也会变成这些样子，你将与他们保持一生的良好友谊。记住，你的孩子需要自由。如果他们选择住在世界的另一端，你必须放手让他们。确保在陪伴孩子的同时，在每个阶段都拥有自己充实而有趣的生活。\n\
  \n在孩子面前做一个平衡的自己。看到他们身上的优点，并教导他们成为更好的自己。微笑，允许你与孩子的关系成长为非常非不起的事情。\n\n你就是孩子的未来。投入于良好的教养，让他们的未来充满光明。\n\
  \n**抛弃育儿中的废话，感受非凡。**\n\n***\n\n### 章节总结\n\n*   对孩子感兴趣，但也要让他们独立。\n*   解释我们为什么要这么做。\n\
  *   要讲理。\n*   不要在孩子每次跌倒时拯救他们。如果你这样做，他们将永远期待被捡起来。\n*   ![image](img/img1.jpg)使用书中的技巧帮助你成为一个冷静、理性的父母。\n\
  *   在享受孩子时，在脑海中“快照”快乐时刻，建立你的非凡区域能量库。\n*   使用红色三角形技巧：想象一个红色三角形，把你的担心放入其中。然后随着你的放手和压力的消散，让它缩小。\n\
  *   视觉化你的孩子长大，并与他们保持积极的关系。\n*   让当父母成为一场积极的冒险。\n*   说：“一切都在非常非凡地进展着。”\n*   使用弯曲线条技巧：想象一根弯曲的线条引导你找到通往获得顺畅育儿体验所需的一切。\n\
  *   使用风筝技巧：想象你和你的孩子在放风筝。看到他们有能力并掌控着自己的风筝。看到你们所有人作为一个团队很好地工作，在彼此的风筝间穿行，并感到放松。\n\n\
  **第一步：顺服于育儿。**\n**第二步：一切都只是一个阶段。享受每个阶段。**\n**第三步：建立一段持续一辈子的关系。**\n\n***\n\n*相信非凡的可能性。像拼图一样拼凑你的生活，让它成为一段奇妙的经历。*\n\
  \n![第 17 章：抛除借口，在生活中感到自在](img/contents.xhtml#toc17)\n\n人们往往不会走出自己的舒适区。相反，他们编造各种借口来避免改变。听听自己的声音，这样你就能意识到自己何时在找借口。付出极大的自觉努力去改变。\n\
  \n**完善你自己。不要拯救他人。先拯救你自己。将你的精力投入到创造你想要的生活。当他们准备好时，他们会在自己的时间找到道路。**\n\n虽然帮助他人是好事，但不要浪费时间在那些用借口回避改变的人身上同样重要。要意识到人们何时在为自己设置障碍。\n\
  \n\n\n\n有些人一个接一个地找借口，甚至不知道自己正在找借口，因为逃避改变对他们来说已经变成了一种常态。有时很难识别出借口到底在哪里。但每当你不再对他人的建议持开放态度时，借口就一定会悄悄溜入。虽然你不需要按照建议去做任何事情，但你可以从他人的想法中学习。人们很容易产生防御心理，满脑都是父母、老师和朋友过去的评判，大多数成年人都有与俱生的防御机制，这阻止了他们接受改变。请让自己务必始终对改变保持开放态度。\n\
  \n你正在阅读这本书这一事实，可能意味着你*已经*准备好为生活做出改变了。读这本书，重读它，翻来覆去，让它成为一种**惊艳**的生活方式。从改变日常习惯开始——移动水壶，调整厨房橱子里食物的位置，换一条新路线上班，在超市里换一条路走，甚至去另一家商店购物。创造尽可能多的小微改变，让你感觉到自己的生活正向着新的方向流动。通过自我暗示让自己进入积极的一面：“我可以的。我正在做。已经完成了。”\n\
  \n*   **改变将让你获得自由。**\n\n### 秋叶技巧\n\n想象大大的橡树树上，色彩斑斓的秋叶在微风中飘动。想象叶子一片一片地从树枝上落下。想象微风将它们吹向高空，让它们在天空中起舞。想象叶子被扫向远方，直到逐渐消失。你可以花任何需要的时间来这样做，每当你放手一片叶子时都是。当你想象叶子在微风中飘动时，让所有的借口从脑海中释放。感受清凉微风吹过树木的感觉，轻轻吹动树枝上的叶子，你轻松地让借口随着叶子一起消失在远方。\n\
  \n当你准备好时，想象树木已准备好让新芽生长和繁茂，正如你的想法也可以蓬勃发展，当你感到准备好迎接新的开始，让美好的事情发生在你身上。逐渐想象新的绿色叶子，明亮而清新，阳光在它们身上跳跃，它们在春天的空气中轻轻飘动。当你发展自己积极的想法和生活时，想象你的想法正在蓬勃发展。在让生活繁盛的同时，做出积极的选择和决定。\n\
  \n偶尔重复这个练习，帮助你的思想向新的、更好的事物进。\n\n### 保持热情，训练自己思考你可以做的事，并开始相信自己\n\n你不需要知道下一个转角处有什么。只需做你觉得正确的事情到达那个转角，这样你就有机会看清后面。你不需要知道完整的人生计划。只需做些事情让自己向前移动。不要成为那种让生活从身边溜走的人。相反，鼓励自己。看到一根弯曲的线条引导着你找到一路上你需要的一切。\n\
  \n*   **从生活中切除借口，感受**惊艳**的感觉。**\n\n### 你的生活就像一个家\n\n你可以选择生活里想要和不想要的东西。把你的生活想象成你的你的家。你可以选择如何装饰和布置你居住的地方。你可以定期进行清理，丢掉那些不再需要的旧东西。没错，你的生活也是如此。可能有些你已经不再适应了，另一些是你渴望拥有的东西。定期回顾你的生活状态是一个好主意，这样你就能识别出哪些可以“带进来”或“拿出去”来改善它。定期清理你真实的家也是一个好主意，因为它是你的反映。\n\
  \n用那些能提醒你向往生活的物品包围自己，例如关于成功者的书籍、鲜花、汽车杂志、墙上积极的图片，也许还包括一张你的学位证书照片或快乐假期的照片，以及写有字样的枕头。在让生活繁盛的同时，做出积极的选择和决定。\n\
  \n偶尔重复这个练习，帮助你的思想向新的、更好的事物迈进。\n\n\n\n\n2005 年，Ailsa 接受了培训并获得了催眠治疗师资质。现在，她利用自己的生活经验帮助他人克服所面临的困难，成为最好的自己。她撰写了《Cut\
  \ the Crap and Feel Amazing》（别废话，感觉棒极），与人们分享应对日常生活压力以及世界发生事件所需的答案和工具。\n\nAilsa 喜欢简单的生活，喜欢可爱的狗、SPA、幸福和下午茶。\n\
