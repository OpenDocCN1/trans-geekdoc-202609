- "# 别说废话，感受奇妙：如何放下负面情绪并进入卓越状态\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n排版：Matt Swann Creative。\n\
  献给在写此书期间的客户 Assaf、Francesca、Jane、Dana，以及参与我我生活的每个人。\n\n\n- 引言\n- 关于作者\n- 加入 Hay\
  \ House 大家\n\n## 引言\n\n生活中的每一个行动都有后果，这种后果可能是短暂且局部的，也可能像向湖里投入石子产生的涟漪一样向外扩散。有时，我们生活中出现的情况是我们自己行动和反应的结果，而有时他人的行为发出的涟漪创造了我们的现实。\n\
  \n当我们小时候，对生活的环境几乎完全没有控制权。尽管成年后我们拥有了控制权，但我们做出的选择和决定将基于我们的成长和童年经历。但无论那些经历如何，我们每个人最终都有引导自己人生轨迹的能力。\n\
  \n我之所以能写这本书，是因为我的生活经历，是因为我提过的问题、我发现的答案，以及我作为治疗师工作的多年里，帮助人们改善心态并更好地应对自己的生活。\n\n生活仅仅是一系列阶段，每个阶段都引导你走向下一个，如果你正经历压力巨大或挑战性的时期，这值得记住：无论发生什么都是一个阶段，你将会度过它。\n\
  \n2002 年，我的生活从外表看是完美的。然而，在幕后，我 19 年的婚姻正在崩溃。我也在崩溃。在那一年的秋天，我精神崩溃，并在精神科部门留了一段时间，从那时起我的整个世界都改变了。我的生活发生了剧烈的转折：从工作并成为我\
  \ 10 岁漂亮女儿的母亲，变成了后来独自生活在一个单间公寓里。\n\n我曾是一个善良且体贴的人，但在不断照顾他人的过程中，我忽视了自己的需求太久，直到最后我被所有人的关怀和责任淹没，以至于迷失了自我。然后，在婚姻破裂后，我以为会支持我的人并没有出现。我知道，其中一些人是因为他们被我精神崩溃期间的行为吓到了，不知道该如何对我做出反应。\n\
  \n事实情况是，我不仅失去了理智，还失去了女儿的监护权、我的房子、家庭、朋友、宠物、金钱、汽车和个人物品。这好像我的整个世界都像黑板上的粉笔一样被擦掉了。作为一个充满爱且奉献的母亲，我花了\
  \ 10 年时间试图让我女儿的世界变得完美。然后，在瞬间之间，我让她失望了。我最终确实与她重建了关系，但在她在生日当天再次见到她之前已经过了整整八年，而在之后又更久的时间才再次和她一起度过圣诞节。在那段时间里，我最想念的仅仅是陪在她身边，做那些我们认为理所当然的常事。\n\
  \n通过了最艰难、最孤独的时期，我挣扎着重建生活，并接受了一个事实：我无法简单地回到我离开的世界，因为我的崩溃改变了一切。相反，我必须寻找帮助自己的方法，让我变得坚强，不仅是为了我自己，也为了我的女儿。那段时间我选择不服用抗抑郁药物，因为我知道那些药物只会掩盖我的底层问题。我必须做的是面对我的困境，并学会适应我的新现实。\n\
  \n在康复期的早期，我就做了一个决定，无论发生了什么，我的生活将会是不可不起的（AMAZING）。今天，也许最不可不起的事情就是我与女儿现在拥有的关系。\n\n\
  \n\n\n幸运的是，在我人生的低谷时期，我遇到了一个爱我并支持我的人，因为他能看透真实的我。他后来告诉我，他之所以在我那些低谷时刻一直留在我身边，是因为他看到，即使当我因为无法与孩子联系而感到绝望时，我也在不断地前进。那个男人现在是我的丈夫，他在那段糟糕时光给予我的支持对我帮助极大部分。那时我意识到，改善生活的关键在于通过改变心态来不断地改变和进化，这样你就永远不会被困在困境中。\n\
  \n尽管我现在和家人以及前丈夫保持着良好的关系，但我知道不被朋友和家人信任或认可是一种怎样的感受，也知道必须独自学会应对是多么困难。我也知道，如果我能改变自己和我的生活处境，那么每一个带着迷茫、压力、心心或无法应对的情绪来到我这里的客户，也可以让他们的生活变得**精彩不可思议（AMAZING）**的。\n\
  \n当我开始成为一名治疗师时，我希望能够利用我自己获得的知识来帮助哪怕一个人。我万万没想到自己最终帮助了数千人，这让我感到非常自豪，因为每个人的生命都很有意义——不仅对他们自己，对我也是如此。\n\
  \n我写这本书是为了与尽可能多的人分享我发现有效的知识和工具，让他们能够规避或为自己的问题找到解决方案，并学会如何**切掉废话（Cut the Crap）并感到精彩无比（Feel\
  \ AMAZING）**。许多人根据自己的人生经历所拥有的技能和知识比他们意识到的要多。所以，即使你认为自己无法实现某事，你很可能也可以。“切掉废话并感到精彩无比”完全关乎超越负面情绪和戏码，学会如何更好地管理生活，并改变任何需要改变的东西，让你进入“精彩状态”（AMAZING\
  \ zone）。通过应用我的创意技术让你的思维转向积极思考，结合一些常识，你可以学会帮助自己。\n\n从你开始读这本书的一刻起，你将开始改变你的思维方式。从一开始就把“精彩无比”应用到你的生活中，见证转化过程的开始。读这本书，再读一遍——或者至少读与你最相关的章节。然后将这些简单的技巧融入你的日常生活，让它们成为你生活的一部分。你即将阅读的内容将让你的梦想变得更加积极，并帮助你实现这些梦想。\n\
  \n停止试图控制一切。\n\n让你的生活成为冒险。\n\n剔除负面，感受精彩无比。\n\n\n关注想要的生活，而不是你拥有的生活\n\n（此处省略重复段落，已按要求不重复输出）\n\
  \n什么是精彩状态？\n\n多年前，我开发了“精彩状态”（AMAZING zone）的概念，是为了在压力下工作时帮助自己。后来，我将其应用到个人生活中，帮助我应对困难时期，并通过我的催眠治疗来帮助客户。“精彩状态”绕过了恐惧、忧虑、自我怀疑和痛苦。这是一个易于记忆的简单概念，并且有效。我向我的催眠治疗客户教授“精彩状态”，其中许多人后来回来向我讲述他们生活是如何变得如此精彩的故事。\n\
  \n作为一名催眠治疗师，我知道不被朋友和家人信任或认可是一种怎样的感受，也知道独自学会应对是多么困难。我也知道，如果我能改变自己和我的生活处境，那么每一个带着迷茫、压力、心心或无法应对的情绪来到我这里的客户，也可以让他们的生活变得**精彩不可思议（AMAZING）**的。\n\
  \n“精彩状态”绕过了恐惧、忧虑、自我怀疑和痛苦。这是一个易于记忆的简单概念，并且有效。我向我的催眠治疗客户教授“精彩状态”，其中许多人后来回来向我讲述他们生活是如何变得如此精彩的故事。\n\
  \n困境中也可以产生好结果\n\n后来，我知道不被朋友和家人信任或认可是一种怎样的感受，也知道独自学会应对是多么困难。我也知道，如果我能改变自己和我的生活处境，那么每一个带着迷茫、压力、心心或无法应对的情绪来到我这里的客户，也可以让他们的生活变得**精彩不可思议（AMAZING）**的。\n\
  \n“精彩状态”绕过了恐惧、忧虑、自我怀疑和痛苦。这是一个易于记忆的简单概念，并且有效。我向我的催眠治疗客户教授“精彩状态”，其中许多人后来回来向我讲述他们生活是如何变得如此精彩的故事。\n\
  \n（此处省略重复段落，已按要求不重复输出）\n\n\n\n\n人们的生活可能会很糟糕。真正可怕的事情可能会发生，或者日常生活可能充满挑战。我并不是说你应该简单地将这些经历掩盖并遗忘它们。重要的是**接受**这些事的发生，**理解**它们为何发生，从从中**学习**并从中**向前迈**。你可以想象将那些不想要的念绪像石子一样扔进池塘里，这样你就能尽可能快地回到**卓越的区域（AMAZING\
  \ zone）**。练习那种**卓越的**感觉。\n\n尝试在任何情况下寻找好的一面。许多人将负面经历转化为积极的改变人生的事件。低谷是转折点。有时，非常糟糕的情况会迫使你面对问题，或者你不得不做出被证明是**卓越的**改变。最糟糕的是陷入一种吞噬你的负面情绪中。你需要找到内在的力量从中出来。为自己要求更好的事物，并发挥创意寻找解决方案，利用**卓越的**感觉将你从现在的处境提升到内心更好的地方。从那些因负面情况而产生积极结果的人获得启发，例如：\n\
  \n* 失去孩子后创立了一家**卓越的**慈善机构来帮助癌症儿童的父母\n* 康复的戒瘾者，帮助年轻人建立**卓越的**生活\n* 丢业后创立了一家雇佣他人的**卓越的**企业的人\n\
  * 失去亲人后为了纪念他们而过上**卓越**生活的人\n\n我们所关注、谈论、思考或自言自语的内容会成为我们的现实，因为我们正在为自己编程，就像那些下决心要成为医生的人，尽管每个人都告诉他们做不到，他们却通过相信自己可以、努力学习并实现目标，证明了所有人都是错的。\n\
  \n生活其实很简单：你越关注你想要的东西，你就越会成为那些事物。如果你纠结于过去，你就会与未来之间产生更多距离。如果你关注未来，设定目标并执行需要采取的步骤，你将更快地到达那个未来。如果你坚持相信**卓越的**生活，那这正是你将拥有的。\n\
  \n在生活中创造积极事物的最简单方法就是说：“它是**卓越的**。”即使现在发生的事情充满挑战，也要说：“它是**卓越的**。它进展得**极其顺利**。”\n\n\
  当你养成看到积极一面的习惯时，你就会重新编程自己去积极思考，很快你就会活在积极之中。是你创造了它，而不是外力或其他人，因为是你的潜意识掌握着你的信念体系。一切从你开始，因为你如何选择看待事物以及你使用的词汇，实际上是在对你进行催眠。\n\
  \n如果两个人经历着相似的情况，其中一个人可能会陷入负面的剧剧中，而另一个可能会说“它是**卓越的**”，并且在他们意识到之前，整个局面就会发生好转，或者从中产生积极的事物。有时，困难教会了我们生活中最重要的课程。将一切看作是改进的机会。逐渐从你的生活中切除负面因素，感受**卓越**。\n\
  \n### 垫脚石技术\n\n接受仅仅意味着承认事情并不总是那么完美，并想象你的过去只是你人生旅程中的一系列垫脚石。在脑海中将你所有的过去经历看作垫脚石——坚实的物体，对你从一块坚实地面移动到另一块坚实地面非常有用。让过去的任何愤怒情绪消散吧。我们经历的一切，无论好坏，都有助于塑造我们的性格，赋予我们生活经验，帮助我们感受全方位的情感，并让我们对不想要什么有更多了解，从而去追求我们想要的。\n\
  \n每块石头都代表宝贵的学习。历史上的每个人都根据他们所有的知识尽了最大的努力。你认识的每个人都做了他们所能的。你也做了你所能的。\n\n想象在沿着垫脚石路径向前走时，将过去留在过去。从现在起，相信伟大的事物，并决心在机会出现时抓住它们，让它们引导你走向你想要的生活。将你的过去和未来的经历看作垫脚石，将让你放下过去的情绪并释放对未来的恐惧。让生活重新平衡的关键是开始在内心感觉更好，从而创造出良好的选择，反过来又创造出和谐的生活。随时想象垫脚石，感受那种行走在一条后方（过去）和前方（未来）都很坚实的路径上的感觉。\n\
  \n再次阅读这一节并练习它描述的技术可能会帮助。\n\n## 那么我该如何让我的生活变得**卓越**呢？\n\n从对自己说“我的生活是**卓越的**”开始。在接下来的章节中，你将学习如何转变生活中每个领域的负面信念。试图对尚未发生的事情感到良好可能是困难的。做到的一种方法是视觉化你想要的结果。催眠治疗师与客户合作，帮助他们看到他们想要的结果。例如，一个吸烟者想象自己是一个不吸烟者，想象他们整天没有烟的情况下感觉如何。如果你想象你想要发生的事情已经以**极其顺利**的方式实现了，并且你在事件发生后庆祝一个良好的结果，这将让你更容易更强烈地感受到那种**卓越的**感觉。赛车手使用这些技术，在开车绕赛道之前，反复视觉化绕赛道的过程。在他们的脑海中，他们练习每个弯道的换挡和刹车点。\n\
  \n人们往往忙于奔波生活，以没有注意到周围正在发生的**卓越**事物。当你意识到一个美好的时刻时，有意识地为那个时刻拍一张“脑内快照”，记录时刻本身、它的感受以及那种**卓越的**感觉。通过在“当下”意识到那个积极的时刻，你可以在未来的任何时候强烈地回想起那段记忆。在时刻发生时建立一个**卓越**“快照”时刻记忆库，以增强你的卓越区域。\n\
  \n* 想象你正在从事一份**卓越的的工作。\n* 想象你刚从一次**卓越的**假期回来。\n* 想象你住在一个**卓越的**家里。\n\n\n\n\n\n创造**惊人**感受的最佳方法就是去思考那些过着精彩生活的人。一种实用的催眠技巧是想象一个拥有你所想要的一切的人的生活。通过进入他人的生活，你可以开始想象那是什么感觉。想想那些拥有你想要的东西的人。对某些人来说，那将是一段幸福的婚姻；对另一些人来说，财务安全、一份好工作，或者一种轻松快乐的生活。**我们每个人都是不同的，我们享受的事物也不同。**所以，想想那些在生活中拥有某些能让你的生活变得有趣的元素的人。想象一下，拥有你所思考的那人的安全感、爱、幸福和选择是什么感觉。此外，回想那些发生在你身上的**惊人**事情——例如你意料中遇见了某人，或者在重重困难下赶上了公交或火车。我们的人生中都经历过事情进展顺利的时刻。感受当事情顺利时你内心的满足感和解脱感。从今天开始，记住越来越多已经发生在你身上的好事。这将帮助你对自己进行积极编程，开发出你的**惊人领域（AMAZING\
  \ ZONE）**。\n\n从现在起，假设一切对你来说都是**惊人的**。每个人都经历过事情最初没有发生或进展不顺，然后更好的事情接踵而至——例如，没有得到你真正认为适合自己的工作，随后更好的工作向你走来；或者你看中某处房产没买到，结果却得到了一处更适合你的。你不能总是看到全貌，但当全貌揭晓时，你会纳闷自己为什么担心那么多。换句话说，开始相信**惊人**的事情正在发生，一切对你来说都在进展顺利。一个例子是某人生生了疾病。这似乎是末日临头。但随后疾病让他们重新审视生活，改变压力水平，开始规律进食并照顾好自己，并珍惜身边的人。事实上，这场疾病演变成了一次觉醒，促使那个人将生活转变为非常积极的模样。\n\
  \n想象你正在庆祝生命中发生的**惊人**事情。自动地感受到事情尽如可能顺利发展的庆祝喜悦感。对自己说：“是的，结果进展得**惊人**地顺利。”\n\n拥有**惊人**的感受并不是逃避完成工作的借口。你仍然需要继续生活并做出决策。但你正在创造内在的平静，因为你知道一切都会顺利解决的。\n\
  \n用改变生活的解决方案对自己进行编程，让你感觉更好。\n\n如果你的生活太忙碌，你会觉得没有时间留给自己。如果你为自己留出时间，你会变得更快乐。\n\n如果你的生活很空虚，你会感到孤独。如果你能找到有趣的事物充实你的生活，你的生活将变得更有意义。\n\
  \n如果你的生活财务紧张，你会觉得钱不够。如果你削减开支，你会对自己的财务状况感到更快乐。\n\n然而，如果你允许自己感受**惊人**的感觉，你的生活将变得真正**惊人**。\n\
  \n在`第 3 章`中，你将学会如何放下可能阻碍你感受**惊人**情绪的障碍。如果你饱受抑郁或低落困扰，请花额外时间吸收`第 3 章`中的信息。\n\n通过将你的感受变为**惊人**的感受，你对生活的感受将不同，然后积极的事情将开始发生，你会更关注解决方案。\n\
  \n### **惊人**一天技巧\n\n我教导客户在睡觉前睡觉**微笑**，并想象明天过得非常**惊人**。同时在脑海中放映一部正面的电影，记录你在白天的快乐。当你第二天早上醒来时，你会感到更加积极，这将有助于创造你已经设定好发生的**惊人**的一天。如果你想象事情是**惊人**的，你会完成更多事情，在这一天中做出更好的选择，并且变得更加放松。\n\
  \n想想你新发现的**惊人**时刻，这种感觉会像魔法一样让事情发生。这种感觉会消除你的负面情绪。\n\n正如上所述，如果你允许自己感受**惊人**的感觉，你的生活将变得真正**惊人**。\n\
  \n\n\n\n\n*   使用“池中投石”法：想象石子代表你脑海中的任何负面情绪，然后将它们投入花园池塘并让它们融化。\n*   对事情会进展得**极其顺利**保持乐观态度。\n\
  *   说：“太棒了。太棒了。一切进展得**极其顺利**。它已经进展得**极其顺利**了。”\n*   使用“垫脚石”法：想象你的生活是一系列垫脚石，身后是过去坚实的土地，前方是未来的道路。\n\
  *   对自己说些积极的话。\n*   你越早开始关注你想要的生活，你就越早能过上那种生活。\n*   使用“精彩的一天”技巧：在每天睡觉时保持**微笑**，并想象每一天都是**精彩**的。\n\
  *   你可能在生活的某些方面非常优秀，但在其他方面却如此。切断负面并进入**精彩**状态将帮助你改变现状。\n*   ![image](img/img1.jpg)让生活成为一场**精彩**的冒险。\n\
  *   在脑海中捕捉生活中发生的**精彩**瞬间。\n*   将良好的经历储存在你的**精彩**区域。\n*   不要陷入负面情绪中。相反，要说：“别废话了，感觉**棒极了**。”\n\
  \n### 第一步。跳出戏剧性戏码。\n### 第二步。假设一切都会进展得**极其顺利**。\n### 第三步。说“太棒了”。\n\n***\n\n你的**微笑**是你改善生活最**精彩**的工具。它是免费的，无论你去哪里都带着它。把嘴角上扬露一个**微笑**，感觉更加**精彩***。\n\
  \n\n很多年前，我正在读一本关于如何冥想的书。正如你可以想象的，边看书边冥想是很的！我想一定有更简单的方法。于是，我放下书，闭上眼睛，问自己什么是最简单、最好、最有力量、最**精彩**的冥想技巧是什么。然后，在一个灵光一现的时刻，我得到了答案：只需**微笑**。\n\
  \n为了加强**精彩**区域，我向客户教授我的“SMILE 技巧”。当你**微笑**时，你的大脑产生一种化学物质——名为`dopamine`——它能提升你的情绪，产生积极、快乐的感觉。\n\
  \n你可以在任何时间、任何地点**微笑**。只需放松，将嘴角上扬露一个**微笑**。只要你一这样做，你就会开始感到快乐，你的身体在生理上会变得更加放松，情绪也会变好。\n\
  \n我曾对许多客户使用过这种技巧来消解抑郁或负面情绪。当你**微笑**时，很难感到低落，尤其是当你的大脑告诉你你感觉很好时。当你**微笑**时，你会发现你的大脑变得以解决方案为中心，因此你可以找到处理日常问题的最佳方法，这反过来也会帮助你创造美好的未来。\n\
  \n我教了两种方法：\n\n#### 1. SMILE 技巧\n在做日常事务时简单地**微笑**，例如刷牙、工作、做家务、整理房间、读书、在超市里逛逛、开车或学习。在**微笑**的同时，允许自己深入思考。你会发现自己感觉变得更积极了。\n\
  \n#### 2. SMILE 冥想\n在合适的地点感到放松时（如在床上、沙发上、坐在火车或飞机上），闭上眼睛。**微笑**并让积极的情绪席卷全身。当你**微笑**时，思考你的生活以及你想要实现的目标。你会自动觉得那是可以实现的。让任何挫败或负面的情绪流走。当你**微笑**时，一切看起来都会变好。你会感到事物变软了，它们看起来不再那么糟糕。这不仅让你在当时感觉更好，还会建立一个积极的情库，帮助你创造一个更积极的未来。\n\
  \n我建议你亲自测试一下 SMILE 技巧。尝试在不**微笑**的情况下思考一个问题，然后在**微笑**的情况下思考同一个问题。只要你一**微笑**，你就会以解决方案为中心，并对处境感到更加积极。例如：\n\
  \n*   不**微笑**时，某人可能感到为金钱焦虑。\n*   **微笑**时他们会感到：财务状况尚可，我会找到解决办法。\n\n通过 SMILE 技巧，你会发现更容易创造**精彩**的感觉。你还会意识到，缺乏**微笑**是许多人转向抗抑郁药物的部分原因。你越**微笑**，感觉就越快乐、健康。\n\
  \n自我表达是一个自然的过程，我们需要通过它来保持快乐。随着西方孩子长大，他们的生活变得缺乏表达力且受控越来越多。当他们成年时，裂痕已开始出现，对于某些人来说，积累的顺从最终会导致中年危机。\n\
  \n2004 年我有机会访问了尼日利亚。在那里期间，我在一家孤儿院对孩子们进行艺术治疗。那些孩子们住在一个狭窄的房子里，晚上睡在地板上，并不是每天都能吃饭。他们的年龄从\
  \ 3 岁到 18 岁不等。从外人的角度来看，他们几乎没有什么值得快乐的。但他们拥有极其令人置信的积极精神，那种发自内心的喜悦我在英国从未见过。\n\n起初，我无法确定是什么创造了孤儿院孩子的快乐。后来我意识到，那是他们的自由感。他们在艺术创作上非常有创意，并从中获得了巨大的快乐。在同样的旅行期间，我带着同样的艺术材料进入了一所英国国际学校。这一次，孩子们更加内敛，等待着对艺术材料的批准和指示。挂在绳子上的是一排甲虫画，所有的画都一模一样——甚至斑点的位置都一样。\n\
  \n与孤儿院的孩子相比，国际学校的孩子看起来有些忧郁。我意识到，教育系统正在扼杀他们的快乐。标准化他们的艺术品使其沦为毫无意义的流水产物。\n\n\n\n\n\
  记住，你无法改变周围的人，但通过改变你的感受方式，人们对你的反应就会有所不同。当你变得快乐时，你会散发出更正向的能量，而他人也能感知到。有些人不想待在你正能量场里，但它会吸引其他人。你新的正能量可能并不适合所有的朋友，所以请让你的关系随着人们进入或离开你的生活而自然演变。\n\
  \n即使对于那些说“我已经很经常微笑了”的人，多微笑（SMILE）也会创造更好的事情。\n\n对他人友善，但不要陷入他们的戏剧或负面情绪中。意识到他们正处于负面状态，或许可以为他们建议一些尝试的技术，或者让他们读读这本书。但请记住，并不是每个人都准备好了，所以不要做一个救世主。他人的负面情绪会阻止你感受奇妙（AMAZING）的感觉。所以要教人们学会对自己负责。\n\
  \n虽然你无法逃避世界上正在发生的所有负面事情，但你*可以*看清负面事情的本质，向后退一步，不让它们进入你的身体。任何事情总能从中产生积极的一面。因此，请预设奇迹将会发生——你不需要知道是什么、何时或如何发生。\n\
  \n记住，总会有比你处境更糟糕的人。与其纠结于这个事实，不如尽你所能为世界带来积极的改变。一个善举对于一个真实的人的一天可以产生深远的影响。与老年人聊天可以让他们减少孤独。向慈善箱里投钱会给世界上某地的某人带来改变。注意到你妻子或丈夫的优点并告诉他们，会让你们的关系更幸福。\n\
  \n微笑（SMILE），每天花几分钟生活大笑，热爱你所处的地方并接纳它。一旦你能看到幽默的一面，你就已经开始让生活变得更好。无论你走到哪里，你都可以带着微笑。\n\
  \n**为生活大笑，感受奇妙。**\n\n***\n\n### 章节总结\n\n*   用微笑加强奇妙（AMAZING）领域。\n*   每周做一件真正让你微笑的事情。\n\
  *   对自己和对他人都友善。\n*   让你的独特性闪放光芒。\n\n**第一步：嘴角上扬，微笑。**\n\n**第二步：在执行日常任务时保持微笑。**\n\n\
  **第三步：带着微笑思考思考。**\n\n***\n\n每一个挑战都已经被世界上某个地方的人克服了。你也可以做到。\n\n\n# 放下负面情绪，为正能量腾道路\n\
  \n为了能够创造积极、快乐的感觉，你必须放下负面情绪。我们所有人都会在某些时刻为某些事担心、感到压力大或产生负面想法。我教给客户的首要任务之一，就是控制他们那些螺旋上升的负面情绪，这些情绪会导致焦虑和压力，并占据了可以用于积极用途的时间。由于我们“想”的内容决定了我们是谁或我们将成为什么样，因此在思考时使用积极的词汇至关重要。你越早改进思考方式，就越早能积极地改变你的生活。\n\
  \n如果你和邻居发生争执，与其纠结于压力或因为觉得无能为力而感到受困，不如专注于它会圆满解决，这样它可能得到解决。积极的态度将给你能量去寻求建议并收集所有能产生改变的信息。与其感到疲惫、精疲力竭和无助，不如让局面赋予你力量，从而找到奇妙（AMAZING）的解决方案。\n\
  \n你可能经历过你认为无法轻易过去的挑战性时期。通过一些关于事件如何发生的信息和理解，将更容易把它们抛在脑后。或者你产生负面想法仅仅是因为你正在处理困难的日常问题。抑郁和低落情绪部分是纠结于过去或感到被生活所困的结果，导致大脑反复重想某些事件。当你的潜意识、意识意识和现实不匹配时，这些情绪也会发生。\n\
  \n*   ‘如果当初那件事发生了就好了，或者这件事没发生就好了。’\n*   ‘那时候的生活好多了。’\n*   ‘我应该比现在做得更好。我本预期达到 Y，但我只实现了\
  \ X。’\n\n这些信念中的一些是由社会、父母、学校、电影，基本上就是你周围的生活刻在你脑子里的。抗抑郁药会掩盖你的负面情绪，但它们不会改变你的信念。一点点改变生活将带你跳出负面的泥潭。即使你正在服用抗抑郁药，你仍然可以改变生活，之后与医生合作停药（如果合适的话）。这种技术有助于防止陷入绝望的情绪。\n\
  \n### 爬出深坑技术\n\n**为了帮助释放被生活困住或低落、抑郁的感觉，你可以想象自己正从一个黑暗的洞爬向光明。将其看作一个游戏关卡，进入下一阶段的光。直到你感到周围环绕着光。**\n\
  \n**这种视觉化将帮助你面对目前面临的局面。通过想象自己取得进步，你会让你的大脑相信有路可走。这将帮助你找到解决方法。你可以在任何时间、任何地点进行这项练习。**\n\
  \n### 相册技术\n\n**想象你的过去就像一张相册。不要看单张照片，只需看到大脑中的照片集。现在想象图像归档到文件夹中。想象过去的事件归档在一个感觉合适的地方。让某些照片和文件夹溶解并消失可能是正确的。再次，不要看照片。只需相信它们正进入正确的位置。看到你大脑中的图像正在自动归位。当你执行这项练习时，放下过去，知道一切都为你积极地改变生活做好了准备。想象一个全新的空白相册，你可以用未来所有的冒险来填充它。当你感到自己纠结于过去时，重复这项练习。**\n\
  \n我有一位客户无法接受孩子离开家。。她有太多关于当全职妈妈的快乐记忆。通过这项练习，她觉得她已经把过去的照片归档并释放了大脑，以便她规划未来并进入她生活的下一个精彩篇章。\n\
  \n## 回到完整与完美\n\n为了讨论起见，让我们假设你出生在这个世界上是完整且完美的。想象你出生时就像一个完美的圆。然后生活开始侵蚀你——老师、测试、考试、父母、兄弟姐妹、期望和失望——直到你不再是一个完美的圆，你也不再是真实的你了。你变成了一个缩水版本，那个圆也开始变得有些扭曲和不规则。\n\
  \n每当你坐在教室学习那些你并不真正理解或看起来与你的生活无关的信息时，每当你被误解或感到尴尬和局促时，这个圆就会变得更加扭曲。最终，你开始进行负面的自我对话。\n\
  \n*   ‘我很笨。’\n*   ‘我到底怎么了？’\n\n\n\n\n你可能曾为某些特定的事情感到担心、表现过度或无礼，也可能因为你的直觉在说一套，而周围的人在说另一套，让你感到自卑。于是，内心的斗争和每一种糟糕的情绪掩盖了真实、快乐的你。你停止使用那个本促你做正确事的直觉。相反，你随心意地去做，或者选择了次优方案。有时你能遵循直觉，但其他时候你又怀疑自己的决定，并学会了违背那些你认为是正确的感受。\n\
  \n好消息是，你可以改变这一切。是你的思维扭曲了局面，现在你的思维也能让它恢复正常。是时候回归真实的自我，夺回对大脑的控制权了。记住，那些欺负、争吵、自我怀疑或嫉妒的人也经历过同样的混乱。\n\
  \n- `停止`把事情放在放在心里：他人也正处于困境中。\n- `停止`让别人贬低你，`开始`更加相信自己。\n- 每个人都在根据他们所知的知识尽力而为。这可能并不完美，但已经是他们能做的最好的。\n\
  - 与适合你的人在一起。\n- 你的许多个人品质和生活的许多方面都是棒的，但一个改进版本的你将会是`AMAZING`的。\n- 记住你在学校学到的好习惯，比如专注和遵守常规。保留那些你你不喜欢的好的习惯。\n\
  \n忧虑或恐惧可能会偶尔出现。有时我们必须解决它们。但在其他时候，担心是没必要的，而且毫无帮助。每当你产生负面念头时，可以采用以下技巧来防止其失控。如果我们抓住一个念头并在脑海中反复琢磨，它就会变得纠结。在坏念头出现时就停止它们。\n\
  \n- 接受坏念头的存在，处理它们并让它们流走。\n- 你脑中的念头可能是：“我觉得我很糟。生活太公平了。”\n- 你脑中的回答可以是：“太棒了。非常棒。没关系。我现在让这些念头像天空中的云一样飘走。”\n\
  \n我向所有客户教授这些练习，帮助他们控制情绪。每当你感到紧张、焦虑、过度活跃或消极时，尝试经常使用这些方法。\n\n### 云朵技巧\n\n要释放负面念头或忧虑，用右手手指揉搓、轻敲或按压左手的指节，以此告诉自己一切都会好起来。你可以在别人面前微妙地这样做——如果你交叠双手，没有人会注意到你在揉搓、轻敲或按压指节。对自己说：“放手吧。让它过去。”想象那种糟糕的感觉流过。念头是流动的物体，如果你允许它们，它们就会飘过天空。在一天中经常这样做。\n\
  \n### 红色三角形技巧\n\n在脑海中想象一个红色三角形。将负面念头、糟糕的感觉、不舒服的情绪、偏执的念头、坏习惯和压力放入三角形中。然后想象三角形缩小，直到小像一个小尘埃。然后想象把这粒尘埃吹走。随着三角形的消失，你将为未来几天或几周内`AMAZING`解决方案的出现腾出空间。你可以尽可能地重复这个练习。假设从今天起，好事将会发生，人们会对你有好评。通过上述技巧放掉过去的怨恨、忧虑和焦虑，从而`解放`你自己。大多数事情并不重要。\n\
  \n焦虑是对未来的恐惧：“如果发生了糟糕的事情怎么办？”我教客户：“如果发生了某些`AMAZING`的事情呢？如果结果证明那是最好的安排呢？”下一次当你担心未来时，对自己开玩笑说：“如果那是最`AMAZING`的事情呢？”并`微笑`。如果某事没有发生，假设会有更好的事情发生。如果出了问题，就拥抱它，像爱心爱的宠物一样爱它：对它感到良好，它就会变成更好的。如果你在担心别人，假设事情会为他们`AMAZINGLY`地解决。\n\
  \n始终保持事情已经`AMAZINGLY`地解决的感觉。这将使你跳过任何负面的忧虑或担心，反过来让你内心感觉更好。焦虑源于允许负面念头螺旋式上升。所以要约束它们，尝试感受积极的情绪。另一种技巧是想象庆祝，仿佛未来的事件已经`AMAZINGLY`地完成了。\n\
  \n我的一个客户曾为女儿参加学校郊游大巴而焦虑到抓狂。我让她想象女儿在旅行结束后下车时的情景：安全、微笑、过得很愉快。这让母亲瞬间感到对孩子尽在掌握并感到放松。使用这种“事后”视觉化技巧也对她的整体生活产生了巨大的影响。\n\
  \n另一个客户担心他的房子在极端降雨期间会被淹没。我用书中的技巧帮助他释放焦虑，并告诉他想象一切已经`AMAZINGLY`地解决了。他想象洪水消失了，他的房子一直是干燥的。当他几周后回来时，他说他的房子是村子里极少数没有被淹没的房子之一，并告诉我：“这太`AMAZING`了！”\n\
  \n涉及到当地和国际新闻时，想象世界上所有问题都在`AMAZINGLY`地解决。在历史上，世界各地的人都克服了各种问题。我看新闻是为了了解发生了什么，但不允许自己卷入负面的戏剧冲突中。无论选举或公投的结果如何，我都假定一切最终都会得到解决。也许这些事件最终会导致更好的结果，也许在\
  \ 5 或 10 年后。无论新闻中发生了什么，都要学会管理你的头绪和情绪。记住，新闻并不包括世界上发生的所有好事。所以不要关注那些没有进展顺利的事情。相反，想想那些每天努力为他人的生活做出真实改变的人。\n\
  \n对事情感到良好，并想象积极的结果。使用`SMILE`技巧帮助你感受积极的情绪。在脑海中使用积极的语言，并在脑海中放映积极的事件片段。\n\n如果有人要乘飞机旅行，想象他们已经安全到达目的地，或者在假期结束后安全回到家，并且正在家里向你讲述他们`AMAZING`的旅行。想象他们躺在床上，安然无事。\n\
  \n如果你正在申请工作，想象你已经在那份工作了。如果你没有得到那份工作，在申请下一份工作时也这样做。感受通勤上班的感觉。最终，凭借这种积极的态度，你会得到一份`AMAZING`的工作。\n\
  \n如果你担心你的孩子，就感受他们长大并在生活中过得快乐、从事`AMAZING`的工作、拥有`AMAZING`的人关系并住在`AMAZING`的房子里的感觉。\n\
  \n\n\n\n如果你担心社交或结识他人，请想象活动进行得**非常出色**，感受那种带着微笑回家的感觉，因为你对聚会的进展感到非常满意。对自己说些鼓励性的话：“我很好。这没关系。我是一个很棒的伴侣，人们喜欢我。”\n\
  \n如果你担心支付账单或负债，请感受每个月都有额外资金，并且银行里有**惊人**的储蓄的感觉。\n\n如果你担心你的投资，请感受做出明智投资决策以及一切都进展得**非常顺利**的感觉。\n\
  \n如果你担心健康问题，请想象它们都解决得**非常顺利**，让你和你的爱人们身体健康。当事情进展得顺利时，请好在脑海中定格这些时刻，以建立你的**精彩**区域记忆库。\n\
  \n有时人们很难想象积极的未来。下面的练习将有所帮助。\n\n### 弯折线技巧\n\n`将未来想象成一根弯曲的线，引导你在生活中进行一场**精彩**的寻宝探险。想象这根线向不同的方向延伸：它向左、向右、向下、向上扭动，并引导你找到你需要的东西。让你的生活成为一场冒险。这个练习将帮助你在对待生活的态度上变得顺畅且灵活。相信**精彩**的事情会发生。当你相信会有出路可走时，你就会找到它。`\n\
  \n当你对未来感到担忧或被过去拖累时，你无法在当下感到自由和舒适。活在当下需要你将过去视为建立你今天的人格的坚实基础，将未来视为在前方等待着你的的冒险。对自己说：“生活是一场**精彩**的冒险。”\n\
  \n如果你更多关注良好的感受，少关注糟糕的感受，你可以与真正糟糕的时期和解。通过阅读这一章，你已经开始了改变的过程。这些技巧将让你的大脑放下过去，创造积极的新思维。\n\
  \n你并不能总是快速改变现状。改变可能需要一些时间。所以要继续做出良好的选择和决策，并对最终获得**非常顺利**的结果感到**惊喜**。\n\n将过去的事件视为脑海中的垫脚石、旅程的一部分以及力量的基石。我们从生活经历中培养性格。如果没有糟糕的事情，我们就无法珍惜美好。拥抱你的过去，它是你今天生活中美好的一部分。\n\
  \n负面经历中总能产生积极的一面，即使只是因为你的知识而帮助了另外一个人。我相信那是一件好事。\n\n**从你的生活中切除负面情绪，感受这种棒极了的感觉。**\n\
  \n### 章节总结\n\n*   重要的不是发生了什么，而是你如何对此做出反应。\n*   使用“爬出洞技巧”：想象自己正爬向光亮处。\n*   使用“相册技巧”：想象过去被储存在相册中。\n\
  *   你无法改变过去，但你可以改变你对过去的感受。\n*   通过**微笑**和接纳，软化对过去和未来的反应。\n*   ![image](img/img1.jpg)使用“天之云技巧”：让忧虑像穿过天空的云一样飘散，通过揉搓、按压或轻敲指关节来安慰自己。\n\
  *   从你的生活中切除忧虑，感受**棒极了**的感觉。\n*   想象现在是一年后，你已经度过了**非常精彩**的一年。\n*   使用“红三角技巧”：想象一个红色三角形，将忧虑放入其中，然后将其缩小。\n\
  *   使用“弯折线技巧”：将未来想象成一根弯曲的线，引导你开启一场**精彩**的冒险。\n\n**第一步。识别负面因素。**\n\n**第二步。有意识地放下负面因素。**\n\
  \n**第三步。说：“如果它是非常精彩的会呢？”**\n\n*通过做出良好的选择和决策，你可以创造一个**精彩**的人生。你还在等什么？*\n\n![第 4 章：选择与决策](img/contents.xhtml#toc4)\n\
  \n如果你分析自己的生活，你会发现它仅仅是一系列大小不同的选择和决策。这些选择和决策是构建你现在的人格和你所过生活的基石。通过理解这一点，你可以开始每天做出更好的选择和决策，来改善你的生活。小时候时，你无法掌控选择和决策，但作为成年人，你可以。做出良好的微小选择将引导你走向更重大的积极结果。\n\
  \n如果你感到被困住了，因为你认为自己想要的生活道路太远，请意识到这只是心态让你产生了这种感觉。就在此时，此刻，你可以通过做出更好的决策来开始改变你的生活。当你这样做时，你就能看到过去所有的选择和决策是如何引导你走到现在的。\n\
  \n*   **定期做出更好的小选择和决策，将让你重回**精彩**人生的正轨。**\n\n不要跳出你目前的生活并逃离它。相反，开始做出不同的选择，来改善你的每天、每周、人际关系，并最终改善整个生活。随着你逐渐做出改变，你将开始看到进步。有些事情会变得顺利，另一些可能永远不会。但总要在你内心状态良好时做出决策，否则你可能会从一个糟糕的境遇逃到另一个虽然不同但同样糟糕的境遇。\n\
  \n如果你不喜欢你的工作，换一条路线开车上班，或者早到并在开始一天之前喝杯咖啡。或者在下班后去游泳以避开高峰期——你可能会晚一点回家，但至少你是放松的。并没有规则规定你必须像别人一样开车回家。你这样做仅仅是因为大家都这样做。\n\
  \n与其对通勤感到沮丧，不如**微笑**并做出积极陈述，例如：“我有段**精彩**的旅程。我有**精彩**的生活。”你的大脑会听你说的话，然后你会做出创造**精彩**生活所需的改变。但如果你在脑子里抱怨，重复愤怒或沮丧的话语，你就会拖垮自己，你的大脑会给你更多负面的事情去抱怨。对日常生活进行微调将提升你的每周：\n\
  \n*   积极的心态将帮助你做出更好的选择和决策。\n*   在一天中选择不同的做法会让你对所做的事感觉更好，你的一天也会更好。\n\n选择不对坏消息做出反应。相反，记住世界上正在发生的所有美好善良的事情。\n\
  \n很好的例子是英国电视节目 Jade Goody 在 2009 年 3 月不幸因宫颈癌去世，年仅 27 岁。Jade 在 2002 年参加 4 频道的真人秀《秀秀秀》时曾赢得了全国人民的心，之后她主演了几档自己的电视节目。\n\
  \n2007 年，她回归了名人版的《秀秀秀》，期间由于卷入与印度演员希尔帕·谢蒂引发的种族歧视欺凌事件，她的名声因此变成了臭名。之后 Jade 道了歉，并在 2008\
  \ 年 8 月参加了印度版的《秀秀秀》（Big Boss）。正是在直播节目期间，Jade 被告知患有宫颈癌，当她随后返回英国时，发现癌症已是晚期。在确诊后，Jade\
  \ 继续着非常公开的生活，甚至允许摄像组跟随她的抗癌历程，制作了纪录片《Jade 的癌症之战》。\n\n\n\n\n\n许多人曾在电视上关注过 Jade 的故事并目睹她在医院接受治疗，许多人觉得自己很了解她。在她去世后，涌入了许多因她的去世而深受痛苦的客户，我告诉他们：“凡事总有好的一面。是的，对\
  \ Jade 和她的家人来说这是悲剧性的。但爱她的人应该为她感到自豪，因为她足够勇敢分享了自己的故事，并将拯救许多其他生命。事实上，在 Jade 去世后，有数百位从未关注过宫颈筛查的女性走出来接受检查。从长远来看，\
  \ Jade 将继续帮助其他女性，她们现在能够活到孩子长大。如果你从大局来看，你会发现即使当我们无法控制某些事情时，万物中依然存在积极。”\n\n### 拥抱乐观\n\
  \n尝试成为一个乐观主义者，这样你就能对周围发生事件的反应做出更好的选择和决定。例如，如果有人失去了工作，尝试寻找积极的一面，并假设他们会找到更好的工作。如果你度过了一个糟糕的周末（可能是因为宿醉或深夜饮酒太累），你可以计划一个没有酒精的周末，去水疗中心、航海、玩卡丁，甚至租一辆保时捷去兜风。做什么并不重要，如何度过时间是你的选择。但不要重复旧的行为，不要做那些让你消沉的事。这听起来显而易见，但对于那些陷入生活惯性的人来说往往并非如此。\n\
  \n*   不要做同样的事情却期待不同的结果。\n*   相反，做不同的事情，获得不同的结果。\n*   更好的是，做惊人的事情，获得惊人的结果。\n\n###\
  \ 管理压力与压力\n\n如果孩子让你精疲力竭，请计划一些闲暇活动，例如家庭影院，关上窗帘，准备一桶爆米花（最好是他们和你一起制作的）。或者让他们帮助你制作和打包野餐，然后去公园让他们跑跑跳跳自娱，而你则放松。\n\
  \n如果你感到疲惫或压力大，请选择一个放松的周末。提前计划并做出能改善你周末的有意识选择和决定。开始掌控你所有的选择和决定。问问自己你可以做些什么不同的。\n\n\
  *   你不需要成为孩子的奴隶。\n*   你不需要成为这一天的奴隶。\n*   你不需要成为工作的奴隶。\n*   你不需要成为伴侣、家人或朋友的奴隶。\n\n\
  ### 小改变的力量\n\n我的一位客户周中住在家外，住一家廉价且并不怎么样的酒店里。他有些抑郁，所以每晚都喝酒来排忧愁。我问他：“你为什么要顶着交通拥堵回到空荡荡的酒店房间？为什么不在下班后去某个地方坐坐，喝杯咖啡看看报纸，甚至吃一顿便宜的晚餐呢？当其他人都在交通流中挣扎时，你可以放松并享受你的夜晚。这样当你回到酒店时，你就不会需要喝酒了。你可以洗个澡或冲个热水，然后在电视上看点有趣的内容。”几周后，他带着这些改变回来，告诉我他的生活变得非常不同，感觉好多了。所以，小改变真的可以让你的一周享受程度产生巨大差异。\n\
  \n### 使用直觉和创造力\n\n利用你的直觉做出良好的选择和决定，并发挥创意。有时，恐惧会产生阻碍。所以要识别：是害怕离开舒适区的恐惧阻止了你做某事，还是确实存在你需要避开的真实风险。如果你无法对某事做出决定，可能今天不是决定的时机。这没关系——只需把这个问题放在脑海的架子上，改天再回。当你回来处理时，你可能拥有更多信息，让你做出正确的选择。\n\
  \n### 评估转型\n\n有时，人们想辞职去做些别的事，但他们所做的可能只是重新创造同样的问题。识别你想要改变的原因，以及你可以做得更好的地方。在换工作之前，问自己以下问题，这将将帮助你做出正确的选择。\n\
  \n*   我拥有哪些技能？\n*   我在学习已知知识上投入了多少时间？\n*   我如何在其他地方应用这些技能？\n*   继续做现在的事对我有什么好处？\n\
  *   到目前为止我成就了什么？\n*   如果不换工作，我该如何更好地享受每一天，或让自己感觉好些？\n\n### 职场健康\n\n在生活中照顾好自己会帮助你在工作时少一点累，并更喜欢你的工作。如果你享受通勤的过程、休息午餐时间、吃营养丰富的食物并在整天多次喝水，你会感到没那么累。\n\
  \n你可以做很多事情来改善你的工作以及你对工作的感觉。你甚至可以开始在目前公司寻找晋升或其他职位。或者，你可能觉得是时候进行职业转型了，你可以从容地开始计划和准备。\n\
  \n我的很多客户后来都爱上了他们以前讨厌的工作，因为需要改变的不是工作，而是他们的态度和生活方式。他们中的一些后来确实换了工作，但这种转型比可能的情况更积极、更顺畅，因为他们对自己的感觉更好。\n\
  \n### 向前迈\n\n当你越来越享受每天的每个部分，感到非常棒，并知道如果改变是答案，你就会向着正确的方向移动。你最大的资产是你自己，你的特质以及你拥有的技能。所以不要把一切扔进垃圾桶然后被迫重新开始。在你已取得成就的基础上继续。通过做出更好的选择和决定，你将引导生活走向正确的方向。每当你面前有一堵墙时，记得做出新的选择和决定，以便你绕过它。\n\
  \n\n\n\n\n如果工作或家里发生了一团乱，尽管说：“太棒了。太棒了。太极了。这简直太棒了。”感受那种通过做出正确选择和决定来摆脱困境的感觉。你可能会感到沮丧，但让它过去吧。通过培养超越问题的习惯，你将会更好地处理事情。例如，如果你有一个难以对付的邻居或老板，只需说：“太棒了。我会找到处理这种局势的解决方案。”为局势的解决而感觉良好。\n\
  \n这之所以是“太棒的”的原因之一，是因为你正在识别问题，从而能够解决它。使用 `SMILE`（微笑）技巧，让你对这种状况大笑出来。通过感觉太棒或绝妙，你已经感觉好多了。一旦你感觉好起来，你就会把它变成一个更好的局面。`SMILE`\
  \ 一，想象事情已经以一种极好的的方式解决了。感受你内心那种良性的庆祝感，就好像一切都进展得很顺利。\n\n你的生活可能非常忙，以至于你没有大脑空间去思考解决办法。或者你可能一直在用同样的局限思维来设定你自己，这些思维阻止了你从不同的角度看待问题。当人们去度假时，他们能够用全新的眼光审视生活。通常，这让他们对事情的感觉变好一点，因为他们回到家里后可以看到从哪里进行调整。这是因为他们在离开期间拥有更多的大脑空间。\n\
  \n我教客户一种练习，帮助按摩掉那些卡住、僵化的选择和决定。这真的就像是在你的脑海中进行按摩。这项练习非常强大，随时都可以做，并且通过让你释放那些受困、卡住和过载的情绪，产生巨大的影响。这项技术将帮助你不断不断调整，以保持你生活的流顺畅。\n\
  \n### 音乐控制设置技巧\n\n想象你的大脑和你的生活就像录音室里音乐技师的控制面板，上面有很多可以滑动的按钮和开启关闭的开关。当你思考想要改进生活的某个领域时，现在想象所有那些不同的控制设置。来到控制面板的这部分，当你想象你生活的这个领域正在发生积极调整时，上下滑动设置。当你对正在发生的积极变化感觉良好时，移动滑块。当你对你的生活变得和谐而感觉良好时，调整设置。随着设置的调整，以不同的方式滑动滑块按钮。如果你喜欢，就关掉其中的一些。只需按照你自己的创造力做觉得对的事。通过在这里那里微调设置，这些小的调整将帮助你创造新的选择和决定。如果你想，可以闭上眼睛。这就像是在你的脑海中和你的生活中都进行了一次按摩，让你感觉更好。\n\
  \n想象你生活的每个领域都由控制面板的某个区域代表。尽可能视觉化地在特定区域进行工作，通过移动控制装置、调整并重置它们，直到你感到放松。你会发现，如果你经常做这项练习，你的大脑就会开始改变，让你能够想出更多解决方案。你对以前引起紧张和压力的事情会有不同的感觉。那些曾经看起来不可能的事情将得到解决。\n\
  \n你可以任何时候使用这项技术。早晨醒来时，想象设置正在调整你的一天，使其运行良好。在上班路上、在交通堵塞中、等公交时、当你上厕所时或在任何空闲时间做这项练习。过了一段时间，它将成为你的本能，因为你的大脑会顺畅地处理一切。经常使用，它将帮助通过微调、微调、不断微调你的情绪、压力、工作、自信问题、忧虑、金钱和人际关系的设置，将你的大脑从旧坏习惯中释放出来。\n\
  \n在一天中保持创意。在的一周中保持创意。在你的周末保持创意。不要只做你昨天、上周、上周末做过的事，或者你认为由于你的年龄或处境而应该做的事。在学校里，你必须符合别人对你的期望，并通常做大家都在做的事。但你现在不在学校了。所以要对你的时间非常有创造力。要有个性。\n\
  \n客户经常问我：“我如何能让我的周末填满积极的事情？有什么可以做的？没什么可做的。”我告诉他们：“看看你现在所在的地方，有这么多事情要做。外面有的人进行各种活动：园艺、遛狗（如果需要就借只狗）、去当地的咖啡馆、加入俱乐部、阅读、研究感兴趣的话题、去画廊和博物馆、参加在线课程或大学的课程。”\n\
  \n如果你有孩子，和他们一起做与其年龄层相关的事情，这样你可以在他们生活的每个阶段享受家庭时光。了解你所在地区有哪些资源。我们生活在一个拥有这么多机会和免费活动的国家，无论你的预算如何，你都能找到可以做的事。\n\
  \n从周一早上开始，说：“哇，我过了一个太棒的周末。它太绝妙了。我参加了一个课程并遇到了一些太棒的人。”听听你对周末的想法、感受和说的话。\n\n你的生活已经开始改变了。当你开始做出更好的选择和决定时，你的世界将会开启，好事将会发生。你可以通过将你的选择和决定与“太棒的”短语结合，例如“我正在做出太棒的选择和决定”以及“我让太棒的事情发生”，来加强你的选择和决定。起初，这可能感觉就像是在玩游戏，但你很快就会看到积极的结果。\n\
  \n你生活中的进步不是发生在你之外的事情。它发生在你内在。你的语言和行动在每天的每一刻都指挥着你前进的方向，因为你的潜意识会吸收你设定进它的信息。这一切从你开始。你掌握着控制权。你越使用这些技巧，你生活中看到改变的速度就越快。\n\
  \n我告诉所有的客户，改变是最重要的事情：改变、改变、改变、改变、改变。所以开始改变你看待事物的方式，记住万事皆有可能。\n\n每当你写下负面评价时，你都在向外发送关于你是谁负面信息。相反，给出现问题的公司写下建设性的建议，在发布公开投诉之前给他们改进的机会。大多数企业都努力为客户提供优质的产品和服务。如果他们并不总是做对，值得记住他们的员工只是凡人，他们可能只是犯了错。更好，与其关注对你的经历说负面话，不如选择为那些做得正确的公司写正面评价。\n\
  \n\n\n\n\n- 在你感到平衡且心情良好时做出选择和决定。\n- **卓越**的选择和决定将创造出**卓越**的结果。\n- 让你的生活变得有趣且丰富化。\n\
  - 你或他人所做的每一种选择和决定都成就了现在的你。你现在可以通过做出更好的选择和决定来掌握控制权，从而带你走向你想去的地方。\n- 使用音乐`control-settings`技巧：视觉化控制面板的设置，并对其进行调整以改善你生活的每一个领域。\n\
  - 写一份优缺点列表来帮助你做决定。\n- 结合你的直觉和理脑做出选择和决定。\n\n### 第 1 步：确定你想要改进的地方。\n### 第 2 步：思考的方法。\n\
  ### 第 3 步：记住从现在起做出**卓越**的选择和决定。\n\n*如果每个人都做对他们自己的事，人们将会取得更大的成就。任何人都可以实现他们坚信的事。*\n\
  \n\n## 我可以做到。我正在做。已经完成了。\n\n每个人在某个时刻都曾对某些事感到停滞或缺乏动力。你可能现在有必须要做的事或想要实现的目标，但你可能无法开始，或者看不到实现更大目标的途径。\n\
  \n## 黑/白/灰思维\n\n人们倾向于将事情看作非黑即白，而没有意识到两者之间存在着整个灰色地带，那里才是所有解决方案所在地。\n\n黑白思维的一个例子是：\n\
  \n- `black` = 某人想换工作，但他们不知道如何做，所以他们自动地想……\n- `white` = “我必须留在这里”或“找份新工作太难了”……\n\
  - 而答案就在灰色地带，那里有解决方案……\n- `grey` = 他们可以开始寻找其他的职业机会，或者研究新的培训，或者申请一些工作。\n\n在灰色地带寻找一件可以帮助你实现正在尝试的任何事情是一个好主意。将一切都看作非黑即白会让你感到局促，当你感到局促时，你可能会拖延并最终无事可做。通常情况下，思考要做某事比实际去做更耗费精力，特别是当“去做”仅仅涉及拿起电话并解决它时。寻找所有可用选项。在寻找答案时要有创意。而且，从现在起，记住灰色地带。\n\
  \n你可以每天使用本章中的信息，也可以用来改善生活的某个特定领域。让你的生活朝着你想去的方向移动，不要被微小的局限性想法困扰。\n\n例如，与其想“我买不起中中的房子，所以我永远被困在这里了”，你可以扩大你的房产搜索范围，包括其他许多同样良好但你负担得起的居住街道。或者你可以找到一种省更多钱的方法，以便买下你想要的房子。或者和朋友一起买。或者找一份薪水更高的工作来改善财务状况。一旦你开始在灰色地带寻找解决方案并采取行动，你就会开始取得进展，在你意识到之前，你就会搬进新家了。\n\
  \n你不需要站在现在的位置就能看到下一个转角之后的情况。你只需要到达转角。当你到达那里时，看一眼转角并知道下一步该做什么将变得易如。想象一下站在新家里，手里拿着新钥匙的那种**卓越**的感觉。你不需要知道是哪栋房子，只需要知道它是你喜爱的，而且它是**卓越**的。\n\
  \n另一个局限思维的例子是：“我不知道我应该复习的所有内容。我完全是个没用的人。”记住，没有人了解一切。每个人都有自己的长处和缺点，只要你尽力而为就很好。即使你没有通过，你也可以找到更好的方法。意识到灰色地带的存在是有帮助的。\n\
  \n（注：此处根据原文逻辑翻译）你可以每天使用本章中的信息，也可以用来改善生活的某个特定领域。让你的生活朝着你想去的方向移动，不要被微小的局限性想法困扰。\n\n\
  （注：此处为原文逻辑重复或段落重复，按意译翻译）例如，与其想“我买不起中中的房子，所以我永远被困在这里了”，你可以扩大你的房产搜索范围，包括其他许多同样良好但你负担得起的居住街道。\n\
  \n\n\n\n-   让过去的事情过去吧。\n-   整理好你的财务状况。\n-   改善你的健康。\n-   处理情绪问题。\n-   减肥、戒烟或减少酒精摄入。\n\
  \n以下是一些帮助你摆脱困境的建议：\n\n-   明确自己到底想要实现什么目标。\n-   从做一件能让你实现目标的小事开始。\n-   消除干扰源，例如借口或阻碍你实现目标的活动：关闭手机、社交媒体、电视，并停止听他人的问题。\n\
  -   明智利用你的时间。\n-   坚持核心任务，不要偏离重点。\n-   记住你年轻时的决心，并利用那种心态。\n-   穿上那种干练、成功人士穿的衣服，这样你就会感到自信，别人也会尊重你。\n\
  \n从现在开始，对于你想要改变或实现的事情，只使用积极的语言。\n\n-   “一切都在步入正轨。”\n-   “事情进展得**极其棒了**。”\n-   “我正在做到。”\n\
  -   “我对自己做得这么好感到**非常惊讶**。”\n-   “已经完成了。”\n\n### 教师技巧\n\n为了执行这项技巧，我发现无论你在何处站起来都是个好主意，因为比起瘫在椅子上，站着会感到更警觉、更积极。如果你无法站起来，就在椅子上尽可能坐直。积极的姿态会帮助你的内心感到更加积极。嘴角上扬，露出一个温柔的**微笑**。想象自己作为一个积极但坚定的老师，那种“掌控感”，正在告诉孩子们他们要做什么。但现在你不是在告诉一个班级的孩子，而是告诉你自己要做什么。\n\
  \n想一个目标或你想实现的事情——例如，一个简单的任务、一份新工作、买房或通过考试。现在，听听你自己扮演老师，告诉自己你将要做这件事，你会做得非常好，你会完成它。就像听老师说话一样听自己说话。用你自己的名字对自己说话，例如：“莎拉，你会去看一些房产。你会去看一些新区域。你会找到一个非常好的买区。莎拉，你会去房产经纪那里登记。莎拉，你可以申请贷款。你会查看贷款方案并安排贷款。你会找到一处**极其棒的**房子和一家非常棒的搬家公司。莎拉，你会找到一种美丽装饰新家的方法。”大声说出来并听自己说，将帮助你觉得你要做的事情是很常的。它会带给你信心和一种一切都可以轻松完成的感觉。在家里练习时，不要害羞。\n\
  \n为自己设定时间范围，就像为课程、作业、学校日程和假期设定的那样。对自己果断。每当你想完成某事或规划目标时，都要记住这项技巧。从实现你设定的目标需要采取的每个行动开始。你可以使用“微笑”技巧，因为微笑会让你感到更积极，而且在自我引导时可以说“**极其棒了**（AMAZING）”。\n\
  \n使用“也许”这个词也能帮助诱导去做事情。“也许”会减轻你的压力，因为它让一切听起来都像是可选的。“也许我可以为我的目标做点什么。也许我可以完成那项任务。也许我可以开始并完成这个项目。”\n\
  \n### 满足感技巧\n\n感受完成今天任务的感觉。感受那种满足和解脱感，仿佛这一天过得很圆满，你完成了你想做的一切。视觉化你获得最终结果，例如：你想要的考试成绩、拿着学位证书、在刚刚装修好的新家里放松、开车往返于你出色的新工作地点，或与可爱的伴侣幸福生活。\n\
  \n花时间做日梦而不是告诉自己你想要什么是很常见的。当你命令自己去做事时，你就会去做的。\n\n有些事情很难做到，例如获得大学学位，但要专注于坚持下去的好处，以及实现它后将获得的回报。养孩子可能具有挑战性，但同样，要专注于做好工作带来的良好结果，并享受他们成长的每个阶段。工作可能具有挑战性，但回报是知道自己正在做得很好，并为世界贡献了有价值。\n\
  \n你所做的一切只是人生的一个阶段。享受这个阶段。将你所做的一切视为一次提升生活经验和技能储备的新学习体验。\n\n### 拳击手自信技巧\n\n想象自己是一个拳击手。站起来，做出拳击手的动作——当然，是在你自己的体能范围内！当你做拳击动作时，用手击、用腿踢，对着你想要实现的目标说积极的陈述。\n\
  \n-   “我可以做到。我正在做。这完成了。”\n-   “我正在做。我正在做。我正在做。”\n-   在句子开头加上你的名字：“[你的名字]，我正在做这件事。”\n\
  \n当你做这个练习时，你会感到有一股积极的能量流全身，帮助你相信你可以完成任何你需要的东西。你的身体有肌肉记忆模式，这会训练它在每一个层面上感受那种让你相信自己的积极感受。\n\
  \n每当你需要相信自己时，定期重复这项练习。例如，当你有学习任务或文件工作要处理时，说：`[你的名字]，我可以做到。我正在做。已经完成了。` 每当你产生其他想法时，提醒自己重新集中注意力。人们倾向于通过与自己进行负面对话来自我破坏。这里是一些可以取而代之的积极的话。\n\
  \n**一个学生**可能会说：“我可以学习这些信息。我正在学习。我正在记住它们。已经完成了。我的考试表现得**极其棒了**。我是一个**极其棒的**学生。”\n\
  \n**一位母亲**可能会说：“我可以快速轻松地让孩子们上床。我正在做到。已经完成了。我的孩子们能一睡到晚。我对孩子们感到很放松。”\n\n**一个处于挑战性工作中的人**可能会说：“我可以完成这项工作。我正在做。已经完成了。客户很满意。员工很支持。一切都**极其棒了**。”\n\
  \n**一个寻找爱情的人**可能会说：“我可以有一个很的伴侣。我很幸福地结婚了。我处于一段充满爱的关系中。我自己和我的伴侣都很快乐。我有一个成功的婚姻。已经完成了。”\n\
  \n**一个寻找更好房子的人**可能会说：“我可以拥有一处**极其棒的**房子。我住在预算范围内的一个**极其棒的**家里，这对我来说**极其棒了**。已经完成了。”\n\
  \n**一个负有债务的人**可能会说：“我可以清偿债务。我正在清偿债务。已经完成了。我赚了很多钱。我正在存钱。”\n\n**一个有健康问题的人**可能会说：“我可以变得强壮、健康。我正在强壮、健康。我已经找到了所有可以改善健康的方案。我很好。我正在照顾自己。我很健康。”\n\
  \n你可能不会立即看到想要的所有结果，但你与自己的日常对话将提高你的积极性，你变得越积极，你的生活就会变得越积极。偶尔产生负面情绪是没关系的，但要尽快提醒自己再次积极。有时负面感觉是我们的直觉在告诉我们要避开某些事或做出另一种选择。所以，也要关注你的直觉。决定负面思维或担忧是什么，以及你的直觉可能如何引导你走向正确的方向。始终假设一切都会进展得**极其棒**，你的大脑会帮助让好事情发生。有时，你会感到一种某事必须被完成的感觉，只要它是安全且积极的，就顺从感觉去做。\n\
  \n\n\n\n通过接受人生的现状、定期陈述你想要的结果，并采取改变现状所需的行动，你将使那个结果变为现实。事实上，我们正在通过对自己和对他人说的话来自我催眠。记住，你的言语创造了你的生活。我已经多次亲自尝试并测试了这一理论。在过去，当那些容易认为某事是不可能的情况下，我发现通过自我自语引导自己向积极方面发展会让事情非常迅速地发生。\n\
  \n作为一名催眠治疗师，我理解大脑会听从我们的指令去做。但大多数时候，人们通过使用混乱的自我自语在不断给自己传递矛盾的信息。许多人认为他们正在从外部吸引事物，而事实上，是内心的自我自语导致了外部事情的发生。人们往往将力量交由外部影响。但一切都是由你以及你应对生活的方式创造的。一个成功的男或女商人不会在第一个障碍面前就倒下。如果某件事没有成功，他们不会怀疑自己或能力。他们会找到方法让它发生，就像运动员一样。成功的人拥有一种内在信念和动力，赋予他们一种“我行，尽管放马”的态度。他们通常是乐观的人，喜欢与周围其他积极、志同道合且拥有相似积极观点的人在一起。\n\
  \n我们在生活中都倾向于让自己被与我们频率相似的人包围。所以，如果你觉得周围有负面的人不对，你可能已经准备好向积极的维度迈进，与和你想法一样的人在一起。待在让你感到舒服的人身边感觉很好。当你处于适合你的人身边时，就像在和自己相处一样。随着你完善“我可以行”的观点，你会发现自己开始进入更积极的朋友、家庭和同事圈子。放手你认识的某些人是没关系的，这样让他们可以找到适合他们的人，而你也能找到适合你的人。\n\
  \n记住这一点，开始从你的待办清单上做一件事。这会打破“不做”的习惯，并在你的脑海中开始创造一种“行事的的习惯”。很有可能，如果你从一件事开始，你就会继续做两件、三件，甚至是四五五件事，并可能完成整个列表。\n\
  \n回想你在日常生活中或工作中完成任务或实现目标的时刻。通过提醒自己这些成就，你将开始发现自己一直在推进事务。你现在想要实现的这一件事，与你以前那些甚至没想过就完成了其他事情一样简单。\n\
  \n## 所以，去做其中一件事。\n\n如果你在开始做某件事上感到挣扎，就深呼吸几次，将你所有的思想都集中到执行任务的行动上。当你呼吸时时，在脑海里对自己说：“我可以做到。我正在做。这已经完成了。”即使你做的第一件事只是移动几张纸、打开电脑、点开一封邮件或做一个决定，你已经开启了行动的进程。\n\
  \n*   从最容易的一件事开始，让自己动行动起来。\n*   当我们付诸行动时，事情就会完成。\n*   当我们处于积极的心态时，更多积极的事情就会发生。\n\
  \n### 内在教练技巧\n\n**想一个你仰佩的人，他们正在做你正尝试实现的事情。想象他们是你的教练，并且他们相信你。他们会对你说什么？他们会如何鼓励你？他们会给你什么建议？**\n\
  \n**想象他们对你说出一些惊人的话。那些话是什么？**\n\n**例如，对于一个正在重新设计家居的人，教练可能会说：**“你有惊人的风格和创造能力。你对色彩很有天赋。你非常擅长选择室内装饰。你很聪明，能在预算内取得专业成果。”\n\
  \n**对于一个正努力找新工作的人，教练可能会说：**“你有这么多技能。看看你在你的工作领域表现得多么出色。你有这么多经验。你是一个极优秀的候选人。我一定会雇用你。”\n\
  \n**对于一个正在寻找爱情的人，教练可能会说：**“你是一个如此优秀的人。世界上有数亿人，那里有很多惊人的人等着你。你会找到一个完全崇拜你的特别的人。你看起来非常漂亮/帅。你有着惊人的性格。你如此善良。你是个极好的伴侣。”\n\
  \n**对于一个想要还债的人，教练可能会说：**“你既才华又有技能，你可以利用这些特质找到积极的方法来还债。你很聪明。你会找到控制财务的方法。你会开始储蓄，让自己获得财务安全。从现在起，通过明智地用钱扭转你的财务状况。你可以轻松赚到更多钱。”\n\
  \n**对于一个想要搬家的人，教练可能会说：**“那里有数百万个优质房产，你会找到一个惊人的。你拥有所有的技能来为自己创造好事。”\n\n**对于一个正在学习的人，教练可能会说：**“看看你迄今为止的成就。正是因为你如此惊人，你才坐在这个位置参加这些考试。你拥有惊人的天赋。你会专注于你的学习，并坚持一个合理的时间计划。你会记住这些信息的。你会对结果感到欣喜。你在考试中会感到冷静，并且表现得非常惊人。”\n\
  \n**对于一个想要减肥或减少酒精摄入的人，教练可能会说：**“你可以放下的。你可以明智地饮食。我见过你多次这样做。你非常擅长改变。当你专注时，你是非常成功的。我信任你。”\n\
  \n## 积极谈话\n\n教练不会说任何侮辱或负面的话，就像人们对自己说的话那样。你可能需要时间来适应成为脑海中的积极教练，因为你可能不习惯听自己的赞美。如果你注意到旧的声音回来了，记得切换回你的积极声音。尝试用更积极的词来加强每一句陈述的积极性。让教练的热情变得夸张一些。在吸收赞美时微笑。习惯被自己赞美。\n\
  \n*   即使你只做一次这个技巧，你也将开启你的大脑使其走出负面困境。\n\n我帮助过很多客户使用这些技巧。我知道任何人都可以改变，因为作为一名治疗师，我每天都能看到这种情况。通过改变你脑海中的对话，你可以实现你的目标。\n\
  \n我教了一个打高尔夫的朋友这些技巧。（他说他大部分时候打得很糟糕！）与其说“我希望球不要进长草区”，我告诉他对自己说：“我可以把球击进洞里。球正在进洞里。”几周后，他告诉我，他在发发球时尝试了这种技巧，对自己说：“球向上。球正在向上。球正在向高处飞。”他不断重复着，然后把球击向高空，这是他以前从未做过的。球撞中了他所处练习场的屋顶，然后弹回来，击中了他的头部，差点把他撞晕过去！\n\
  \n我告诉他：“在一个有屋顶的建筑里，告诉你的大脑把球击高可什么好主意！而且，我原以为你要尝试把球击进洞里。”\n\n“我忘了，”他说。\n\n“下次试试吧，”我建议道。\n\
  \n\n\n\n但他他说再次尝试时有点害怕，因为这种技术太强大了，我们俩都笑了。不过，值得注意的是，对于对自己要求要做什么，保持谨慎总是个好主意。\n\n《别废话，感觉极了》（*Cut\
  \ the Crap and Feel AMAZING*是我写的第一本书，在过程中有几个时刻，特别是在开始写的时候，自我怀疑会悄悄袭来。所以我先写了那个关于“我可以行”的激励章节，然后用我正在描述的技巧来激励自己。我还想了以前为录音编写的所有催眠治疗脚本，以及过去几年获得的所有知识，然后通过自言自语说自己相信我可以做到。十周后，我写完了整本书，在那之后的几周后，它就准备好印刷了。\n\
  \n带着这种“我可以行”的态度，**现在**就去你的“待办清单”上做某件事吧。相信我：这将会是**极棒的**。我很想看到你凭借“我可以行”的态度所取得的成就。所以，请将它们发送到我的\
  \ Ailsa Frank 博客、Twitter `@AilsaFrank` 或 Instagram `ailsafrank`。\n\n`从生活中消除自我怀疑，感觉极了。`\n\
  \n***\n\n### 章节总结\n\n*   “我可以行。我正在做。已经完成了。”\n*   不要只把事情看作非黑即白。记住，灰色地带包含了所有的解决方案。处理或解决问题有许多方法。所以要去寻找答案。\n\
  *   尝试一下。你不需要准备好 100% —— 90% 就足够了。\n*   使用老师技巧：告诉你自己你会去做，并像听老师说话一样听你自己的话。\n*   使用满足感技巧：在开始之前，感受你想要实现的目标已经完成的满足和释负感。\n\
  *   人生的每个阶段都是一个时期。通过投入日常生活来享受每一个阶段。\n*   使用踢拳手技巧：站起来，在大声说出你想实现的目标的同时做出踢拳手的动作。说：“我可以行。我正在做。已经完成了。”\n\
  *   ![image](img/img1.jpg)展现良好的形象。穿着得体。展现出自信的姿态。\n*   当好事发生时，在脑海中拍一张“快照”，并将其存入你的“极佳区域”（AMAZING\
  \ zone）。\n*   从一项任务开始。选择最容易的一件事开始，在你还没反应过来时，你就已经完成了需要的工作。\n*   使用内在教练技巧：想象你是你正在尝试实现的目标领域的专家，然后通过自言自语让自己成功。教练会说什么来鼓励你？\n\
  \n**第 1 步。设定目标。**\n\n**第 2 步。思考极佳。**\n\n**第 3 步。让它发生。**\n\n***\n\n*在这个信息共享时代，只要寻找答案，每个人都能获得成功所需的知识。*\n\
  \n\n这是书中最重要的章节之一，因为金钱是你生活的根源。你做出的每一个选择和决定都围绕着你有多少钱展开，这影响了从你在超市里能买什么到你能住在哪里的一切方面。根据我的经验，许多人说：“我不需要更多钱，”或“我在金钱上没有问题，”然后继续向我讲述百零一个实际上都与金钱有关的问题。\n\
  \n重要的不仅仅是你有多少钱。重要的是你对所拥金钱的感觉。许多人在失去财富或财务状况变糟之前并没有意识到自己是富有的。所以，从今天开始，对已有的感到满意，并在此基础上建立。\n\
  \n*   **任何人都可以富有或贫穷。**\n*   **一个低收入的稳定储蓄者最终可能比一个高风险的冒险者更富有。**\n\n有来自最贫穷和最富有背景的人都取得了成功，并经历过对金钱的压力或挫败感。所以请放下过去，尝试停止与他人比较，不要担心你来自哪里，或者你拥有或没有拥有什么。对于创造安全财务能力，你是深受启发还是沮丧，真的是你自己的选择。从现在开始，对金钱感到良好吧。\n\
  \n通过放下负面信念，并结合极佳（AMAZING）和微笑（SMILE）技巧以及良好的选择和决定，你可以开始开你想要的财务生活。开始热爱你的财务。对金钱感到很好。当你对金钱持有积极态度时，你会做出更好的财务决定。如果你为金钱感到沮败，金钱就会让你感到沮败。但如果你热爱你的财务，你将成为一个拥有值得爱的财务的人。\n\
  \n任何人可以在任何类型的超市中购物。有些人更多在昂贵的超市购物，而另一些人则在便宜的超市。无论你是富有还是贫穷，通过明智的决策和选择，你可以在预算范围内在所有超市购物。在更昂贵的商店买件小礼物，即使你一年只能负担得起一次，然后在更注重预算的商店购买日常用品。你不需要等到一直负担得起在昂贵的超市一直购物。通过意识到只要你坚持预算并平衡开支，你负担得起财富的体验，你可以立即感到富足。\n\
  \n你可以将超市概念应用于生活的每个方面，并立即感到富有，而不是等到富有。如果你现在买不起私人飞机，你可以攒够足够的钱去体验！开始创造性地如何过理想的生活。当你相信渴望是可能的，它们就会变成现实。有人甚至会邀请你坐飞机，所以不要假设你必须拥有飞机才能去。\n\
  \n*   **预算 = 花得比赚得少，这样你可以存钱。**\n\n重要的是接受现状——“这就是我所在的地方”——并对此感到良好。微笑并大笑，仿佛你的财务状况极佳一样。如果它们现在不极佳，你会开始对它们大笑，而不是为它们感到压力。如果你的财务状况已经极佳但你想进一步提升，这些建议也会帮助你。\n\
  \n从现在开始，对金钱感到良好。充分利用你的选择和决定，明智地使用你的钱，并用你最好的方式赚收入。意外资金可能会到来，但你需要去获得那份薪水更高的工作。每天重复\
  \ 300 次“大额资金会定期向我来”这样的肯定是没有意义的。相反，就与你最相关的话题进行积极、全面的自言自语。\n\n*   “我有一份热爱且适合我的极佳工作。”\n\
  *   “我的生活中充满了极佳的钱。”\n*   “我有让我微笑的财务状况。”\n*   “我有可以投资的闲钱。”\n*   “我银行里有很多钱。”\n*  \
  \ “我处理金钱很聪明。”\n*   “我有财务安全感。”\n*   “我赚了很多钱。”\n*   “我很擅长赚钱。”\n*   “我可以轻松支付账单。”\n\n\
  保持你的想法积极且多样化，就像脑海里播放的一台电台一样。当你听到负面情绪袭来时，记得再次调回那个积极的电台。\n\n\n\n\n一个从事高薪工作且长时间工作的人，其最终的财务状况可能并不比低收入者好在哪里，因为他们把赚来的每一分钱都花在了奖励自己的辛苦上。他们可能会因为购买昂贵物品、外出就餐或点外卖而力不从心，因为他们没有时间做饭；他们还支付了学费和昂贵的假期费用，并买了一他们负担不起的大房子。最终，他们对金钱的压力可能比那些按预算生活的低收入者还要大。\n\
  \n多年来，我遇到过许多客户，他们因长时间工作以及花费巨资通勤往伦敦而精疲力竭，这也影响了他们的生活质量。人们可能会感到受困于工作和财务承诺中。他们可能深陷于自己创造的生活中，以至于看不到任何脱脱的方法。通过我与这些客户一起工作，我帮助他们看到，通过逐渐做出不同的选择和决定，并开始在日常生活中感到感觉好起来，总有办法改变你的现状。\n\
  \n你可以在上班的路上感到压力，也可以感到放松并享受这段时光，将其视为自己的高质量时光。一旦你开始对自己说“神奇的事情正在发生”，并使用 `SMILE` 技术，你就能识别出那些不适合你的事情，从而开始以微妙的方式调整你的生活。\n\
  \n我的许多客户已经改变了工作，选择了薪水较低的本地工作，这些工作让他们能更早结束一天，从而有时间去做他们想的事，比如烹饪、阅读或进行其他的爱好。他们通常感到更加放松，并有更多时间思考省钱的方法，以便在缩减的预算下过上舒适的生活。最终，他们的财务状况变得更好，拥有更多个人时间，工作压力也更小了，这些都是积极的生活改变。\n\
  \n其他客户则使用我的技巧学习如何更好地管理压力，然后发现他们新的、更积极的态度为生活带来了更好的、财务上报酬更丰厚的机会。通过开始从不同的角度看待问题，他们开始做出更好的选择，并创造他们最初所追求的生活。还有人继续重新培训并获得更好的工作，精简他们的业务，或者以更积极的态攀登职场阶梯，这有助于他们以更轻松的方式处理工作。\n\
  \n你最大的资产是你自己——你如何挣钱、你如何用钱以及你如何选择过生活。生活质量是幸福的关键。虽然金钱很重要，但如果你对自己的生活感觉良好，那么赚大量的金钱也没有意义。\n\
  \n人们在决定职业时，往往不考虑做那份特定工作每天让他们感觉如何，或者实际的日常生活会是什么样的。有些人选择一份工作是因为薪水，而另一些人甚至不考虑他们能赚多少钱。答案是用最适合你的方式使用你的技能，做出对你最好的选择，并创造你热爱的生活。\n\
  \n如果你每天开着一辆华丽昂贵的汽车去上一个你讨厌的工作，那么拥有这辆车毫无意义。与其让自己背负负担不起的开支，不如开一辆不会超出你财务负担的汽车，然后偶尔租一天法拉利，这样更有满足感。这比真正拥有一辆昂贵的汽车要便宜得多。\n\
  \n- **在花钱之前思考。如果你对买某物有不感，就花那笔钱。**\n\n下面的练习将帮助你跳出目前僵化的思维，这种思维可能会限制你在金钱方面的成功。\n\n\
  ### 面团技术\n\n挣钱和获得成功源于一系列过程，这些过程与制作面包的过程相似。这项技术将帮助你利用制作面包的过程来拓展思路，过上富有的生活。\n\n要建立财富，你需要计划、有条理，在过程的各个不同部分——如购买、出售和投资——在正确的时间挣钱，付出体力劳动，然后留出时间让事物成熟和扩大，最后你才能享受努力的成果。在想象制作面包的过程时，思考你的财务状况——称量原料、混合原料、揉面团、面包发酵以及在烤箱中烘烤。你财务的增长也将从类似的系列事件和过程中发展出来。\n\
  \n想象正在揉捏一个面团，移动它，在不同的方向上拉伸它，消除结块并使其光滑。你可以在这样做时移动你的手。当你想象揉面团时那种放松的感觉时，思考你的财务状况，感受处理和整理事情的感觉，这样你就能向财富的下一个水平迈进。\n\
  \n想象你的财务计划进展顺利。当你感受到这些感觉时，想象你的大脑正变得以解决方案为中心，你正在以最好的方式思考，这样你的财务状况就会像面团一样容易、流畅且顺利。\n\
  \n想象事情会自动处理，就像面团会自动发酵，烤箱会自动烘烤面包一样。想象你的生活中发生了很多好事。你会自动做出正确的决定，当某些事情会自动处理时，你采取行动处理其他事情。\n\
  \n当你思考揉面团时，想象自己在正确的时间出现在正确的地方让好事情发生。想象奇妙的事情对你来说是可能的。想象一切进展顺利。\n\n现在想象创造性地将面团变成面包的形状。在脑海中选择一个形状，也许是法棍、小卷或是或一个大面包。选择任何你觉得合适的形状。你每次做这个练习时可能会选择不同的形状。你可以在这样做时移动你的手，做出你选择的面包形状。\n\
  \n当你准备好后，让面团发酵，对你的面包形状、财务形状和财务状况感到满意。想象一切进展顺利。想象将面包放入烤箱，烤箱正在烘烤面包。想象你的财务状况进展到下一个水平，就像面包达到了最后的烹饪阶段。\n\
  \n想象你今天和每天所做的一切都是让你的财富进展到下一个阶段。你每天都在为财务增长做需要的事。就像面包师每天制作面包一样，你每天为财富做出贡献。你创造了财务安全感和富有的生活方式。当你对财务状况感觉良好时微笑（SMILE）。\n\
  \n经常重复这个练习。每当你思考财务状况时，记住它。当你努力每个阶段以建立财务状况时，记住一切进展顺利。你正在一点点处理事情，并做出明智的选择。就像面包发酵一样，你将上升财务安全和财富的下一个水平。将揉面团想象成你在处理问题以创造解决方案，揉你的职业，你的财务……\n\
  \n**掌控你的财务并感到神奇。**\n\n### 章节总结\n\n- 对金钱进行积极的对话。\n- 计划你的财务未来。\n- 说“神奇的钱”并 `SMILE`。\n\
  - 使用面团技术：想象像揉面团一样处理你的财务状况。让你的财务状况像烘焙师制作一个面包一样成熟。\n- 爱你的财务状况，就像你喜欢蜷缩在舒适的床上一样。\n\n\
  **步骤 1. 享受你已经拥有的。**\n\n**步骤 2. 在预算内生活。**\n\n\n\n\n\n# 第三步。努力改善你的财务未来。\n\n你通过一系列选择和决定陷入了债务。你将通过做出新的选择和决定来摆脱债务。\n\
  \n![第 7 章：债务](img/contents.xhtml#toc7)\n\n## 从生活中削减债务，感觉**棒极了**\n\n债务有几种类型：\n\n\
  *   因过度消费而导致的债务——购买你负担不起的东西。\n*   为了生存的债务——收入极低。\n*   因环境改变导致的债务——由于被裁员、收入或财富损失、疾病、丧亲或离婚而导致。\n\
  *   投资性债务——例如抵押贷款或学生贷款。\n\n无论你背负哪种债务，你都需要审视产生债务的原因，以及你可以在哪里削减开支，因为每一小笔储蓄都将帮助你实现财务稳定并偿还贷款。陷入债务可能需要一些时间，因此你可能需要花时间来摆脱它。在这期间，**神奇的**、意想不到的事情也会发生。所以，既要乐观也要现实。你可以通过努力走出任何困境，这正是你需要关注的重点。\n\
  \n审视你花钱购买的每一一样。大多数人可以削减得比他们想象的要多得多。例如，一位客户告诉我：“我的食品购物太贵了，我已经缩减到了最低限度。但这还是花了我一大笔钱。”经过讨论，她透露自己买的是那种裹着帕尔马火腿的鸡胸肉，并为她的五口人准备了新鲜意大利面。对我来说，那种东西应该是派对晚上的菜，而不是周中的家庭午餐。但在她看来，这是常态。虽然对于付负担得起的人来说没问题，但对我的客户来说，这从她紧缩的预算中夺走了她并不有的钱。她奢侈的食品购物阻碍了她储蓄和获得财务安全。\n\
  \n立即开始偿还债务，即使你只还 1 英镑。你可能需要一两年的时间来还清，但首先必须养成还债的习惯。开始养成掌控自己财务的习惯。然后，一旦你清除了债务并养成了储钱的习惯，就可以继续谨慎用钱，积累储蓄并确保你的财务未来。不要在重复旧的坏习惯并积下更多债务的基础上建立财务未来。\n\
  \n你的金钱观念可能是从家庭环境中遗传的。尝试识别你的坏习惯源于何处，以便纠正你的行为。你小时候，你的家里是否经常在饥荒与富足之间摇摆？你是否意识到你的父母欠有债务？你的父母是否是“先买后付”？他们递给你钱时，解释过它的价值吗？你小时候想要什么就能得到什么，所以现在指望拥有你所想要的一切吗？你的父母是否很有钱，而你现在正努力复制你小时候习惯的生活？\n\
  \n*   你的过去是否给你的财务生活投下了负面魔咒？\n*   你是否意识到你父母的开支，现在想避免他们经历过的某些陷阱？\n*   你有哪些方面可以改进？\n\
  \n## 幸福是知足常\n\n你可能喜欢外出吃大餐、开好车、买新衣服和去奢华度假，但如果你负担不起，那么你*真的*负担不起。你必须接受这一点。这听起来可能很难，但如果你不接受，你的消费最终会追上你。你的财务是你的责任，不是政府的，不是家人的责任。你的财务问题是你私人的问题。如果你有孩子，在他们成年之前，他们也是你的责任，无论你是否和他们在一起。不要指望别人为你的财务决策买单。你需要为你自己和你的家庭负责。如果你在过去做出了错误的选择，你需要理解这些错误是什么，以便以后不再重犯，并从现在起做出更好的选择。始终相信**神奇的**解决方案，相信事情会圆满解决。\n\
  \n我曾看到许多人因为生活超支且拒绝放弃他们认为的“必需品”的东西而失去房子。他们并没有改变消费或改善处境，而是简单地积压了更多债务。一旦有人失去了房子，他们往往很容易回过头来看到自己的消费有多么失衡，以及他们因为不接受现状而购买了负担不起的东西。但有些人在一切太晚之前不会改变。许多人不想听从朋友、妻子或丈夫那里听到他们负担不起自己想要的生活方式。\n\
  \n试着听听那些财务安全的人怎么说，因为他们可能为你提供答案。\n\n有些人相信宇宙会供养他们。但一些人未能将此与商业头脑和行动计划相结合。人们生活在财务危机的边缘，期待依靠奇迹，而不是务实地创造财富。奇迹确实会发生，在它们发生时尽情享受吧。但也要在现实世界中脚踏实地。\n\
  \n一位欠有债务并开了新网店的客户决定买一辆更大的车。她的业务类型竞争非常激烈，她每周只有几个订单。她卖的东西其实很小，完全可以提在手包里去邮局。她确实不需要一辆新大车。她本该视觉化并渴望拥有一项值得投资的业务。一个精明的生意人会保持低开支，直到业务能够证明进一步投资的价值。世界上所有的指导，如果不结合常识，都是没用处。\n\
  \n我帮助过许多人通过积极思考和实际行动扭转了财务状况。你拥有的没有任何东西值得为了冒财务安全去购买。\n\n*   停止购买负担不起的东西。\n*   如果你连打折的东西都负担不起，你必须接受现实。\n\
  *   停止追赶，你正在赌上自己的未来。\n*   记住，今天负担不起的东西，明天会给你带来压力。\n*   尽可能获得所有的财务支持和建议。\n*   和比你钱少的人比较，这样你会感觉更富有。\n\
  *   如果你不断渴望，你永远无法停下来欣赏已经拥有的财富。\n*   精简一切以重获控制权。\n*   寻找免费的方式享受生活——去散步或跑步、看书、在公园野餐。\n\
  *   为他人的好运感到高兴。受到灵感，而不是嫉妒。\n*   为你所拥有的钱感到自豪。感觉**棒极了**并微笑吧。\n*   说“拥有那些东西就好了”，而不是需要它们。\n\
  \n\n\n\n\n*   如果你是自雇人士，请在收到款项时就留好税款。\n\n## 不要拿未来赌博\n\n重新评估什么是必要的，并重新评估如何最好利用你的时间。例如，只有免费电视频道是“必要”的。不要看白天的电视。相反，要固守工作时间，早起并积极寻找工作或投入时间进行重新培训。明智地利用晚上的时间，寻找更高薪的工作，或制定改变开支的计划。人们经常将希望寄托在中彩票上，但这仅仅是赌博的形式。相反，要掌控自己的生活。重新培训需要时间，但这是时间的一种良好投资。提高技能将对你的财务状况产生真实影响，因为工作可能是你最大的收入来源。以重新培训需要太长时间为借口，只会延长你处于贫困状态的时间。如果你已经有一份好工作，每天都要为它感到自豪。为你目前所取得的成就感到自豪。\n\
  \n通过赌博来冒金钱风险赚钱，只是在逃避你需要改变自己以及改变对工作、职业、金钱和储蓄的行为的事。多年来，我遇到过许多客户，他们用自己根本没有的钱赌博，在妻子背地里欠债，冒着家庭安全和未来的风险，只为了换取他们认为的快速解决之径和致富的捷径。赌博很少有回报，而做出更好的选择和决策每一次都有效。\n\
  \n将朋友或家人的钱投资到创业中要小心，在交易股票和股份时要保持谨慎。你需要权衡风险，因为一切都可能出错。\n\n## 危机\n\n有时，人们会因为自己无法控制的原因陷入财务危机，例如丧亲、离婚或健康问题。试着相信事情会以**非常出色**的方式解决。使用“放下”技术，例如在\
  \ `../Text/chapter03.xhtml` 中描述的红三角技巧来释放压力。想象将你的忧虑放入脑中的一个红色三角形中，并想象它缩小并溶解。你也可以使用揉搓、按压或敲击左指关节的同时说“让它过去”，看着脑海中的忧虑像天空中的云一样飘过。如果你生病了，尽一切努力尽快康复。知道你会找到度过困难的方法。可能有增加收入的方法，所以对这种可能性持开放态度。如果你正在领取福利金，请朝着实现自给自足的大目标努力。\n\
  \n你越积极，越好。通过自我引导来保持积极的情绪：“我可以做这个。我正在做。已经完成了。我可以把这转化为积极的因素。我可以处理好。我可以克服这个难关。”让你的大脑处于**极其出色**的区域。说：“一切会以**非常出色**的方式解决的。”当你面临真实的危机时，这听起来可能很奇怪。但通过保持这种**极其出色**的感觉，你将确保大脑不会陷入负面思维，并能想出最佳解决方案。通过良好的选择和决策，你将开始扭转局面。当你专注于“**精彩**”的事情正在发生时，精彩的事情就会向你走来。我不是说你会中彩票（尽管你可能！），但机会会找上门来，或者从各种渠道获得额外资金，又可能你会找到一些健康解决方案让你回到工作，或者丧亲之痛可能为你开启新的机会之门。\n\
  \n正如你的处境由于一系列事件而变得糟糕一样，也将有一系列事件会让你的状况再次好起来。始终想象存在有一种**极其出色**的方法可以度过难关，你会感到惊喜。如果有人夺走了你的财富，尽力把它要回来，但不要在负面的过去上浪费时间。相反，要积极地向前看。过去的负面人物是过去问题的一部分，你永远无法与他们共赢。对发生的事情感到良好，从中学习，分析你本可以如何这样做，并感觉到事情会以**非常出色**的方式解决，关注未来而不是过去。当你向前积累新财富时，确保这次你照顾好它。\n\
  \n## 制定行动计划\n\n不要仅仅相信精彩的事情会发生。要采取行动，做需要的事来改善局面。\n\n### 改变财富的行动\n\n当钱找上门来时，不要想：“噢太好了，我可以出去玩了。”相反，要利用这笔额外的钱。\n\
  \n一位名叫 Sue 的客户告诉我，她和丈夫非常努力，但在奢侈品或假期方面负担不起。她一直在把自己和朋友 Katie 比较。Katie 是一个全职妈妈，她的丈夫工作收入不算高，但他们家每年去两次豪华假期，经常出去吃饭，买很多新衣服和昂贵的新车。我的客户\
  \ Sue 说：“这太不公平了。我们做错了什么？”\n\n“你并不了解你朋友的真实情况，”我告诉她，“正如你自己所说，你需要赚很多钱才能过那种生活。大多数人负担不起。也许\
  \ Katie 和她的丈夫有遗产，又也许他们欠了大量的信用卡债来维持他们的生活方式。”\n\n一个月后，在下一次预约时，Sue 说：“你是对的。我的朋友和她的丈夫债台高筑。他们刚刚把房子挂牌出售。”\n\
  \n## 疯狂的想法\n\n买一辆负担不起的大车或租一处负担不起的大房子，然后希望钱会有来支付是疯狂的。研究你尚未准备好购买的东西是个好主，但在购买时要确保你处于良好的状况。\n\
  \n我建议你买你负担得起的最小、最新的汽车，或者租最便宜的房子（这可能意味着缩小规模），以便你存钱重新回到房产市场。如果你正在买房，请对你的负担能力保持现实。\n\
  \n以下是一些疯狂的理财故事，让你思考你可能正在做的哪些可以改变的事：\n\n1. 一名叫 Sue 的客户告诉我，她和丈夫非常努力……（见上文故事）。\n\n\
  **我的建议：** 不要对他人的财富做出假设，因为你并不了解全部事实。相反，通过为你做出**极其出色**的选择和决策，专注于你自己的财富和财务事实。如果由于某种原因你失去了房子，确保你租一个更便宜的地方，以便你存钱重新回到房产市场。\n\
  \n2. Tom 决定要买一辆大新车并申请了贷款，5 年内每月还款 600 英镑。他的妻子不同意这个决定，因为她很满意继续使用他们现有的车。\n\n\n\n\n\
  \n**我的建议：** 人们经常认为出租很贵，但当你考虑到买入和维护第二辆车的所有开销时，经常乘坐出租车可能更便宜。买一辆你能轻松负担得起的最小、最便宜、最新的汽车。想想你做出的决定将带来的感受。当汽车变旧且价值贬值时，当你支付每月月供时会有什么感觉？\n\
  \n3. 埃里克（Eric）在 55 岁之前的生命中一直在花钱，并口说：“这只是 20 英镑、50 英镑或 100 英镑。这不会改变我的生活方式。”他出生于富裕家庭，一直试图维持他习惯的生活方式。最终，所有小额的过度开支让他失去了房子和里面的一切。多年来再抵押贷款和累积的透支终于最终追上了他。在其中一个阶段，他本可以缩小规模，卖掉房子并买一间不需要贷款的小型房子，这样他就能还清债务。但他和妻子不愿放弃那栋大房子，不得不向朋友们承认他们负担不起这种生活方式。最后，他的生活方式发生了巨大的变化，以至于他经常在咖啡馆吃别人剩下的食物。\n\
  \n**我的建议：** 你所做出的每一个选择都有后果。所以要明智地使用你的钱，确保财务安全。\n\n4. 詹姆斯（James）和妻子在大学期间生了孩子，但把所有的储蓄花在了家具、新厨房和浴室。詹姆斯不同意妻子装修子的决定，这给他们带来了压力，并导致他们的关系中产生了很多紧张情绪。詹姆斯担心那些他们负担不起的开支，特别是他们还在孩子上大学期间为他们提供财务支持。\n\
  \n**我的建议：** 创造安全感，不要因为在财务上过度承诺而让自己变得脆弱。在预算范围内装修你的房子——刷层新漆，在浴室里换几个新水龙头，而不是彻底的翻新。当你有了安全感和闲钱资金时，你就可以拥有那个令人惊叹的厨房了。如果你处于一段关系中，你们需要做出在财务上合理的共同决定。\n\
  \n5. 瑞贝卡（Rebecca）投资了太多的房产并将其出租。当经济衰退来临时，她收到的租金不足以支付所有的抵押贷款还款。这给她带来了巨大的压力，因为这些物业的价值低于她支付的价格，所以她无法卖掉。\n\
  \n**我的建议：** 进行可控的投资。有时，人们深陷财务承诺中，将自己推向破产。不要在情况发生变化时无法负担的投资上过度消耗自己。做出令人惊叹的选择和决定，建立一个安全的财务未来。\n\
  \n6. 戴安（Diane）和她的丈夫卖掉了房子，以释放更多资金用于生活并实现无贷款生活。他们不想承担抵押贷款的责任，但一旦他们搬进租的住房，他们意识到租金必须每个月支付，就像之前的抵押贷款一样。而且，他们必须永远支付租金，即使在收入更少的退休生活后也是如此。\n\
  \n**我的建议：** 如果你不想支付抵押贷款，可以将你的房子租出去，找一个更便宜的租用房居住，或者找一个房客帮你支付房贷。但请记住，随着年龄的增长，你可能无法再次获得抵押贷款。所以在在卖掉它之前要仔细考虑。你拥有的物业很可能——虽然不能保证——会增值，如果你在其中拥有一些净值，以后你会有更多居住的选择。\n\
  \n多想些“惊叹”的事，这样你就能在正确的时间出现在正确的房产交易现场。当你处于“惊叹区”时，你甚至可能被提供免费居住的地方！\n\n7. 特蕾妮（Tracey）是一个自雇的已婚职场妈妈，我一直在帮助她处理财务问题，她因缺乏资金而感到压力。每个月没有任何剩余资金来支付所有基本账单以外的任何事情。特蕾妮*真的*想重新装饰客厅，换掉旧的、有污的地的地。我建议把地毯扔掉，漆旧的地板，并买几块廉价的地毯和一些沙发用的散落靠垫。\n\
  \n当我两个月后再次见到特蕾妮时，我询问她漆过的地板看起来怎么样了。她告诉我，她正为没有钱交税单而感到压力，因为在和朋友们讨论了漆旧地板的想法后，她决定花 2000\
  \ 英镑在客厅铺设新的木质地板。她的朋友们打消了她漆旧现有地板的想法，说地板会受损。（事实上，任何损坏都可以用更多的漆轻松地修补。）\n\n所以，拥有新木质地板的良好感觉实际上被由于花掉税款而产生的压力所抵消了。漆的地板本可以给她她想要的客厅焕新，让她留出足够的钱交税，并让她能为新地板的费用攒下一点钱，她可以在几年后拥有它。现在，每当她看向地板时，她都会为那次过度开支感到糟糕。她后来告诉我，这对她来说是一个巨大的教训，她现在很小心地把税款放在一边，并接受如果想买东西就必须存钱，而不是让自己处于财务压力之下。\n\
  \n**我的建议：** 如果你今天付不起，明天你要怎么付？在消费之前先思考。在预算内实现目标要有创意。你的税款不是供你花的。记住这个故事，并尝试打破过度开支的坏习惯。当你收到工作报酬时，将其中的\
  \ 20–30%存入一个税务储蓄账户——并将任何增值税（VAT）存另一个账户。为圣诞和生日礼物预留资金也是个好主意，这样你就能掌控自己的财务。\n\n## 改变你的财务\n\
  \n如果你想象一个大轮子，由于你过度开支并陷入债务它一直在错误的方向旋转，你现在必须转动齿轮让它反向运行。刚开始，这可能涉及一些压力和努力。但如果你专注于摆脱债务并确保财务安全，最终齿轮会轻松移动，你会回到正轨。\n\
  \n是你创造了这个问题，所以你也能让自己出来——只要你不再把头埋在沙子里。\n\n**从生活中切断债务，感到惊叹。**\n\n***\n\n### 总结\n\n\
  * 改变你对金钱的态度。\n* 制定减少债务的计划。建立还款计划。\n* 尽快确保财务安全。\n* 开始定期储蓄，即使只有 1 镑。\n* 从理财的人学习。\n\
  \n**步骤 1. 减少支出。**\n\n**步骤 2. 清偿债务。**\n\n**步骤 3. 明智理财。**\n\n***\n\n*任何人都可以变得更富有。*\n\
  \n![第 8 章：惊叹的金钱故事](img/contents.xhtml#toc8)\n\n\n\n\n\n**像富有的人一样去生活吧——在你的预算范围内——并相信美好的事物。始终把钱留在钱包里，但要训练自己不要花它。如果你没有闲钱可以做到这一点，就在钱包里放几张纸片，让它看起来像要溢出来了一样。当你对金钱感到良好时，奇迹就会发生在你身上。**\n\
  \n## 重新审视你的支出\n\n凯瑟琳（Catherine）是一位 30 岁的职业女性，也是我的客户之一，她告诉我她买不起房产。我们讨论了她在衣服、酒精、外出、冲动购物、杂志、未使用的发用和化妆品上花费了多少钱，并得出结论：这相当于大量的浪费。然后，我和她一起改变了脑海中负面的消费习惯。\n\
  \n在改变消费习惯后的几个月里，凯瑟琳还清了部分信用卡债务。一年内，她存够了首付款，并且通过对能负担得起的购买区域保持现实态度，成功买了一套房产。\n\n**我的建议：**\
  \ 通过观察财务事实，你可以看到自己错在哪里。不同的选择和决定将使你的梦想实现。\n\n## 钱可能从意想不到的来源\n\n一位名叫特丽莎（Trisha）的客户告诉我，她必须搬到国家的另一个地方临时住六个月，她在新地方不需要家具。她感到压力很大，因为她没有钱把家具存放在仓库，直到她回到这个地区；而且她无法把家具留在她只租的公寓里。在帮助她释放负面压力后，我告诉她想象搬家进展得*非常奇妙*，而且在财务上也*极其完美*。她起初很怀疑，但说她愿意一试。\n\
  \n两周后，特丽莎回来进行下一次咨询，讲述了一个最*神奇*的故事。一个潜在的新租客来查看她要搬出的公寓。正当他要离开时，他又探头回到门口说：“如果我租了这套公寓，你不会介意让我租你的家具六个月吧？”于是，在特丽莎搬走的那天，她把食物、衣服和洗漱用品装进车里离开了。作为她能将所有家具和日常家居用品留在公寓里的报答，她每月可以获得\
  \ 400 英镑。她不仅不需要支付仓储费，反而有了收入。现在，这太*奇妙*了！\n\n**我的建议：** 遵循书中的技巧来释放负面信念，然后假设事情会进展得*极其完美*。如果你必须存放物品，请进行一次彻底的大清理，这样你就不必为不需要的东西付费了。\n\
  \n## 奇妙的事情会发生\n\n一位名叫尼格尔（Nigel）的客户告诉我，他无法继续苦苦支付养孩子的所有费用和日常生活费用，由于他的钱只够支付房贷的利息，他的欠款永远不会减少。在咨询期间帮助他释放了负面恐惧后，我告诉他：“事情会发生。情况会改变。往*奇妙*的方向思考。”\n\
  \n不到一周后，尼格尔的岳父决定给他的女儿和丈夫 10 万英镑，以偿还他们的房贷。尼格尔对这种*奇妙*的运作方式感到*非常惊叹*！\n\n**我的建议：** 你可能没有富有的亲戚，但你不需要知道那些*奇妙*的、意想不到的事情是什么。只要知道它们*会*是*奇妙*的。对早还房贷保持开放态度。对自己说：“我们以一种*奇妙*的方式还清了房贷。”\n\
  \n## 即使是糟糕的境地也可以变成最好的\n\n一个自雇客户失去了大客户，这意味着他的收入几乎一夜之间停止了。我帮助他相信对他来说这是件*奇妙*的事。与我见面几天后，他带着开发其他市场的想法醒来。那个老客户让他太忙了，以至于忽略了更丰利的工作领域。他保持了那种*奇妙*的感觉，这使他找到了新的更好的客户，并让他的业务向着*奇妙*的方向发展。\n\
  \n**我的建议：** 通过释放负面信念并保持在*奇妙*领域，你可以让更棒的事情发生。\n\n## 获得你想要的工作和想要的薪水\n\n莎拉（Sarah）是一位自由记者，她获得了一份在杂志工作的理想工作。但她不想接受，因为这涉及到薪水的大幅减少。我对她进行了一些催眠治疗，并使用了书中描述的一些技巧。\n\
  \n\n\n\nSteve 是一位经验丰富的建筑师建筑公司的高管，他曾想过创办一家新的建筑业务，但由于经济衰退，他认为这风险太大。在与我几次面谈后，他决定离开旧工作。然后，通过运用“卓越（AMAZING）状态的感觉”，他通过自我暗示获得了成功，并利用书中描述的其他技巧来保持积极。在他自己的建筑项目投入运行之前，他做了一些自由职业工作来支付账单。他告诉我：“尽管面临经济衰退，我也有信心去追求我的梦想。因为我有了新的内在自信，我辞了职，开始创造自己的命运。”\n\
  \n通过努力工作和对“卓越”的信念，他在第一年的营业额就达到了一百万英镑！到了第三年，他的营业额已达到五百万万英镑。\n\n**我的建议：** 记住，Steve\
  \ 是利用他多年积累的技能开始创业的，这与开始一个你一无所知的新业务完全不同。因此，在你建立新业务和学习新技能的同时，要意识到你可能需要继续做旧工作来维持生活，直到你开始赚钱。自雇是一项辛苦的工作，所以要准备投入时间进行各项筹备。尊重每一位客户，因为他们可能会为你带来更多客户。控制开支，并保持谨慎——建立良好的声誉并创造丰厚的收入可能需要一段时间。在生活中，有时你只需要尽管去做，就因为那些事让你觉得是正确的。你的决心和良好的感受将让你获得成功。\n\
  \n专注决定了你的现实。相信卓越的事情会发生，但也要脚踏实地。\n\n## 有时你可以拥有你认为负担不起的东西\n\nGemma 负担不起假期，所以我配合她一起释放了她的负面信念。我告诉她想象现在是夏末，感觉就像她已经度过了一段卓越的时光。她很容易就能做到这一点，因为在与我进行交流之后，她的思维方式变得积极了许多。几周后，她告诉我，一位多年未见的朋友免费送给她一栋度假屋。所以你猜怎么着：她最终还是度过了一个卓越的假期。\n\
  \n**我的建议：** 卓越且意想不到的事情确实会发生。不要依赖它们，但要始终保持积极的乐观态度。释放负面信念是在潜意识层面保持积极的关键，这将让你真正相信好事情会发生，而不仅仅是假装自己很积极。\n\
  \n## 储蓄，储蓄，储蓄，投资，投资，投资\n\n开设几个储蓄账户，每当你赚到或收到钱时，将其中一部分放入每个账户中。当你认为没有闲钱可以储蓄时，就削减其他地方的开支，以便把钱存入储蓄账户。这在心理学上非常重要，因为当你考虑财务状况时，你会知道除了债务或透支外，你还有一些储蓄。通过储蓄，你为自己设定了程序以遵守更紧的预算，并且你会感激自己能够买得起的东西。\n\
  \n当我建议一位名叫 Graham 的客户这样做时，他说：“我没钱储蓄。”“你承担不起不储蓄的后果，”我告诉他。在我释放了他的负面金钱模式后，尽管有透支，他还是决定挑战一下自己，每月向储蓄账户存入\
  \ 75 英镑。32 个月后，他存下了 2400 英镑。\n\n\n\n对你所拥有的一切感到快乐。**微笑**并对生活中美好的事情感到满足。寻找富有创造性的方法，在预算范围内过上同样精彩的生活——也许出去喝咖啡而不是吃大餐，为假期寻找更划算的优惠或去一个较短的假期，利用你已经拥有的物品。确保你的预算在支出任何其他费用之前，已经考虑到每周或每月存入储蓄账户的资金。\n\
  \n保持你的房贷在可控范围内，并制定还款计划，以便最终拥有你自己的房产。如果你是租房，想象你可以找到一种方法，在今天和每天都能轻松支付房租。如果你想买房，想象你已经找到了**极其不起**的方法来购买和拥有你自己的房子。一切都是可能的。家是你的基础，所以让你的家变得负担得起。\n\
  \n人们通常认为搬家是很昂贵的，但如果你相信这对你来说是**极其不起**且在财务上极佳的，那么它确实如此。几年前，我丈夫的业务需要家里有更大的空间，我开始寻找能够让我们搬家的各种选择。我专注于将其视为次对我们来说财务上极佳的**极其不起**的搬家。朋友和家人试图说服我搬家很贵，但我知道只要我相信**极其不起**的搬家可以发生，事情就会解决的。\n\
  \n一段时间后，我得出结论：离开伦敦再远 10 分钟就能为我们提供更多房产选择，给我们所需的空间。最终，在进行研究并对**极其不起**的房产保持开放态度后，我们发现了一处我以前不会看的潜在**极其不起**的房产。它需要一些装修，但我们认为这些工作是值得的，因为是是之前房子的两倍，位置优美，可以俯瞰高尔夫球场和自己的私人森林。这处房产比我们的另一个地方便宜了近\
  \ 8 万英镑。在扣除搬家费用和一些精心规划的装修后，我们在银行里还剩下 4 万英镑。\n\n当人们来我们新家做客时，他们总是说：“这太**不起**了，”因为这确实是一个特别的地方。我心里暗笑，因为这就是我们在寻找房产之前我就知道它会是这样。\n\
  \n进行**极其不起**的房产搜索并不意味着一个负担得起的梦想家园会掉进你的怀里。但如果你付出努力，出去看房产，同时保持那种**极其不起**的感觉并相信总有办法可以得到**极其不起**的东西，它将会带你到达那个目的地。\n\
  \n因为你的家是如此重要，请确保它是负担得起的，这样你才能在里面放松。当你向往更富裕的生活时，与其绝望于拥有你还没有的生活，不如说：“也许我可以做那样的事。也许我可以拥有那样的东西。”绝望的感觉会产生绝望的结果。通过使用“也许”，你消除了拥有事物的紧迫感。\n\
  \n*   *也许我可以拥有一辆那样的车。*\n*   *也许我可以拥有那样的房子。*\n*   *也许我可以像他/她一样成功。*\n*   *也许我可以成为一个百万翁。*\n\
  *   *也许我可以中彩票。*\n\n计划你想要在财务上实现的目标，并说：“钱就在那里。”通过处于 **SMILE AMAZING** 区域，你还会发现自己自然而然地出现在正确的时间出现在正确的地方。\n\
  \n\n\n\n*   专注于提升你的财富。\n*   在体验享受时，要懂得感激。\n*   通过自我暗示让自己向积极的一面：“我可以做到。我正在做。它已经完成了。”\n\
  *   将**卓越（AMAZING）领域**与商业头脑相结合。\n*   通过重新训练、提高技能或执行想法来增加你的财富。\n*   使用“卓越”一词将你的财富目标写成积极的陈述。正着和倒着写下这些陈述，然后将列表放在你每天都能看到的地方。\n\
  *   在脑海中“快照”积极的财富体验，以建立你的卓越财富库。\n\n### 步骤 1. 安全且明智地储蓄/投资。\n\n### 步骤 2. 增加收入。\n\n\
  ### 步骤 3. 在你的卓越财富基础上不断发展。\n\n***\n\n*每段关系都需要经营。\n\n*你可以选择疏远，也可以选择共同成长。*\n\n![第 9\
  \ 章：关系](img/contents.xhtml#toc9)\n\n世界上的不同角色需要不同的人，因此不同的特征至关重要。在最近一次与一位火箭科学家亲戚的交途中，他建议所有孩子在学校都应该被分流到工程专业，因为工程师非常短缺。\n\
  \n“这并不是适合每个人的正确道路，”我说，“相信我，我不会成为一个合格的工程师。这并不能引起我的共鸣。”但他不同意，认为每个人都有这种能力。\n\n几小时后，我们和其他几位家庭成员一起去购物，因为那位火箭科学家需要一些新衣服。进入马克斯与斯宾商店（Marks\
  \ and Spencer）后几分钟内，我就安排了店员为他量尺寸，然后从架子上挑选了挑选完全合身的裤子、衬衫和外套。我的亲戚住在国外，那里的服装店衣服选择比英国少得多，看到我知道什么衣服适合他并能找到合适的尺码，他非常松了一口气。这一经历恰恰证明了我的观点：我和我的亲戚拥有不同的技能，每个人都是如此。而这是一件好事。正如我们当时达成一致的那样，你肯定不想坐我设计的火箭飞向月球，而你可能也不想让我的亲戚为你挑选衣服！\n\
  \n但尽管我们都有不同的技能，所有的关系本质上都是相似的。我的意思是，你会喜欢某人的某些地方，也可能对他们有某些不喜欢的点，或者他们看待问题的方式与你不同。这完全正常。你无法与任何人在任何时候达成一致。对于某些人，你认同的事情会比分歧的事情多；对于另一些人，你们可能很少有共识。没有人能一直让你满意，因为每个人看待事物和应对生活的方式都不同。但如果你将差异看作是有趣的并互相学习，你仍然可以与人们相处得很好。\n\
  \n**试着不要将事情看作“非黑即白”、“他们的方式”、“我的方式”或“唯一的方式”。相反，请记住灰色地带，那里是寻找解决方案的地方。学会通过放宽自己的观点、接受他人的观点，并意识到有许多处理问题的方法，在家庭、工作以及与朋友之间的所有关系中游刃有余。始终保持开放态度，从他人的角度来看问题。**\n\
  \n以下是我所指的例子。\n\n黑色：“我想预订假期。”\n\n白色：“我不想，所以我们不打算预订。”\n\n灰色：“我希望你能过个假，但我认为我们负担不起*这次*假期。我愿意找一个更便宜的。老实说，如果我们预订了一个我觉得无法轻松支付的假期，我将无法放松和享受，这会违背了休息的初衷。”\n\
  \n**为了化解争论或分歧，你可以说：**“和你不同。你和我不同。这就是为什么我们看待这个问题的角度不同。但没关系。让我们讨论一下如何处理我们不同的意见，以找到一个我们都满意的解决方案。”\n\
  \n有些人更感性，而另一些人则更有逻辑、更务实。不同类型的特质是有用的。所以要互相学习，以建立平衡的关系。不要看人们不能做什么。要看他们*可以*做什么，因为那是他们的长处。如果不同的人利用自己不同的长处，可能更容易更容易取得更多成就。\n\
  \n**非黑即白的思维没有留下任何讨论的空间。灰色地带是你梳理事情的地方。一段健康的关系是双方对讨论开放的。**\n\n对自己说：“我可以让这段关系运作良好。它正在运行良好。”或者，“我可以找到卓越的方法与伴侣良好沟通。”即使你和伴侣没有达成一致，你可能也会找到解决问题的方法。\n\
  \n太多的人花了太多时间抱怨和关注关系中哪里不起作用，而不是关注哪里*正在*起作用，或者寻找解决问题的方法。\n\n### 相册技巧\n\n**将过去的事件看作脑海中的旧照片，归档到合适的相册中，这样你就可以将其存档并继续前进。你可以选择原谅过去发生的一切。你不需要自己之外的任何认可。然后，将你的过去和未来看作一条坚实的垫石之路。当你放下负面情绪时，你就能创造一段卓越的关系。你和你的伴侣可能共同取得了很多成就。开始对那些好事感到愉快，并列出一份不起作用的事单。坐在一起讨论如何改进。**\n\
  \n人与人之间许多细微的坏感觉是由荒谬的事情引起的，例如某人在茶里加多少牛奶，咖啡里加多少糖，或者食物里加多少盐。每个人对食物和饮料的口味不同，在生活中也是如此。试着尊重这一点，并享受与周围人的共同点。大多数问题是可以解决的，所以选择去解决问题。只有当你尝试了一切方法后，才应该分道扬扬。如果你试图逃避问题，它们只会一直跟着你。\n\
  \n\n\n\n\n放下那些你的伴侣可能无法放过去的事情。用右手手指揉搓、按压或轻点左手的指节。过去可能充满压力，但你只需要处理今天发生的事情。从容去度过每一天。不要参与争斗，这样做只会助长负面、破坏性的之火。相反，要平息局势，就像用凉爽、冷静的水去灭火一样。在重复这项技巧时，你可以闭上眼睛。\n\
  \n*   降低对彼此的期望。\n*   作为一个团队共同努力。\n*   互相鼓励。\n*   互相赞美。\n*   假设事情会进展得**极其棒极**。\n\
  *   做你自己，但在关系中要保持灵活性。\n\n生活是一系列的开始与结束。因此，请拥抱你生命中的每一个人，要知道关系中的任何负面情绪都可以随之结束，而舒适的感觉也可以在任何时候开始。尽力让你的关系进入一个良好的状态。利用那种“极其棒了”的感觉来感受事情正在顺利发展。让自己自由，也让别人自由。在你自己学习的同时，帮助他人看清解决问题的道路。\n\
  \n多年来，我帮助许多客户以不同的角度看待他们的关系，一旦大多数人在释放了积累的紧张情绪后，都继续拥有了非常幸福的关系。\n\n任何人都会陷入自己的固有模式中。问问自己：“我能对自己改变什么？我该如何改进自己？我可以做些什么来改善我的关系？”当你变得更好时，随着你们之间建立了新的沟通习惯，周围的人也会随之改变。你无法改变他人，但你可以改变自己。\n\
  \n### 观察技巧\n\n尝试活在当下。不要对正在倾听的人感到无聊或压力，而是观察他们嘴部的动作。你会发现，当他们向你诉说时，你会很享受观察他们的快乐。在心里**微笑**。享受看到别人高兴交谈的样子。让他人的对话让你放松。对他人感兴趣，即使他们谈论的是你并不感兴趣的话题，例如足球、鞋子、舞蹈、电脑游戏……\n\
  \n偶尔尝试一下你伴侣喜欢的事情，你可能会发现自己其实也很喜欢。例如，你可能不喜欢香蜡蜡，但当你感到更加放松时，可能会发现自己并不介意。或者你可能不喜欢体育比赛，但如果你和伴侣偶尔坐在一起，你可能会发现自己很享受。如果你们喜欢的东西不同，那就都花时间追求自己的兴趣，同时也一起做事情。如果其中一个人想去购物而另一个想看运动，就各自做自己的事，然后聚在一起喝杯咖啡。但如果你的伴侣需要你的帮助，请在他们身边。这都关乎平衡。没有人可以一直做他们想做的任何事。\n\
  \n想想你和伴侣为关系带来的不同长处。也许你们其中一个更擅长技术、更有创意、更务实或更有组织性。在工作环境中，公司聘佣那些擅长特定工作所需技能的人。在关系中，决定你们中谁擅长哪项工作，然后分配任务，让每个人都做自己擅长或不介意做的事。你们双方都没有兴趣或能力完成的任务将不得不共同分担。一起完成这些任务，或者付钱让别人去做。\n\
  \n如果你们都坚持这些原则，你们就能克服许多由日常琐事引起的烦恼。当关系中的某个人无法灵活，或不愿从两个角度来看待问题时，困难就会出现。当这种情况发生时，你们可能会陷入僵局。如果你与伴侣沟通感到很困难，请尝试书中的所有技巧。大多数人都能解决他们的关系问题。如果你们的关系可以修复，它终会被修复。如果不能，你们都必须向前看。\n\
  \n不要被“墙那边的草更绿”的想法所欺骗。你可能会发现自己处于类似的境地。也许你也是问题所在之一。通过合作解决你们的问题，并帮助伴侣解决他们的问题。随性。跳出你可能处于任何困境。让自己快乐。\n\
  \n### 会议\n\n全方位支持你的伴侣——在工作、家里以及孩子身上。开个会议讨论需要说的话，就像在工作中进行绩效考核一样。这样，你们就可以在一个受控的环境下提出问题。会议上发生的任何事情都可以留在会议中，而不是让情绪带入你的日常生活。\n\
  \n在任何关系中，都会有需要解决的困难问题，因此接受这一点并以冷静的方式处理。然后结束讨论。尝试将任何负面情绪留在会议中。这并非总是可能的，但随着你习惯了这种处理生活的方式，会变得更容易。\n\
  \n你也可以对自己说：“别说废话了，感觉**极其棒**”，知道通过许多微小的改变，结果将会进展得**极其棒**。\n\n### 性生活\n\n男女女性都可能对婚姻或伴侣关系中的性感到不满意。不要认为出轨会解决你们的问题。它不会的。如果你从根源上建立关系，你将建立一个有趣、强大的关系。看看你和你伴侣的优点，并处理你们双方都需要改变的事情。可能是一系列选择和决定让你们的关系偏离了轨道。因此，只有通过新的选择和决定，你才能让它回到正轨并保持下去。如果你以不同的方式做事，你就会跳出循环，创造充满光彩的关系。在脑海中**捕捉**从现在起创造的美好时光，这样就能积累“极其棒”的感觉。\n\
  \n归结起来，所有的关系都是关于穿着拖鞋一起吃晚餐的舒适感。英国喜剧演员罗塞尔·布兰德在一次采访被问及与美国歌手凯蒂·珀里生活时曾说：“就像其他人一样，讨论日常事物，比如‘你觉得猫需要去看兽医吗？’”\n\
  \n如果你们在性上不和谐，寻找改变的方法，例如按摩或随着喜欢的歌曲跳舞，不要带有压力。经常告诉伴侣他们有多漂亮/帅。讨论你们第一次相遇时的乐趣，并一起去去漂亮的地方创造新的快乐记忆。提醒对方你们身上喜欢的地方。建立信任。\n\
  \n学习亲密而不期待发生性关系，在大多数情况下，如果你不给伴侣压力，它就会自然发展。告诉伴侣：“我不想性。我只想拥抱。”拥抱后，让他们还想要更多。人不是可以开启和关闭的机器。\n\
  \n许多争吵产生是因为人们被周围的事情分散了注意力，技术、体育、孩子、工作、家庭或朋友。当这种情况发生时，可能是某人只在想要性时才会关注伴侣，这非常令人反感。或者他们因为疲劳或对伴侣生气而不想性。同意停止互相侮辱，或说对男性或女性具有侮辱性的话。\n\
  \n\n\n\n\n投入时间经营你与伴侣的关系，这样你就能收获亲密性体验的回报。关系就像花花蕾，阳光明媚时绽放，但如果云朵遮住了阳光，可能无法绽放。花朵还需要蜜蜂授粉，需要雨水帮助它生长发育。如果所有这些要素都不到位，花朵就无法完全绽放。你和伴侣也需要所有元素都到位，但对你来说，这些元素包括善良、浪漫、倾听、支持和互相帮助。\n\
  \n不要期望你的伴侣像你一样思考和感受。如果觉得合适，就讨论一下你们都喜欢什么。很多关系受到色情片的影响，而那并不是给伴侣带来长期满意且亲密体验的来源。相反，尝试在互联网上寻找教育类信息，让你增加对伴侣身体运作方式的了解。尝试新方法来点燃伴侣并与其爱。色情片呈现了健康性生活的扭曲现实。因此，忘掉你从中中学到的所有东西。你偶尔可以从中获得乐趣，但要为性关系建立稳固的基础：\n\
  \n*   多想浪漫喜剧，而不是色情片。\n*   尝试在浪漫音乐中做爱，这将帮助你们建立与性生活相关的新习惯和模式。\n*   尝试不同的方式会产生不同的结果。\n\
  *   通过共同做出新的选择和决定，你可以建立一段**极其非凡**的关系。\n\n## 浪漫举动\n\n和伴侣讨论你们都喜欢的浪漫举动类型。有些人喜欢收到用心的礼物，而另一些人可能更倾向于口头赞美、对方为你做的饭或一个拥抱。基本上，要倾听伴侣，当他们为你做好事时要意识到，这些可能是你以前认为视所当然的。\n\
  \n你可以在网上寻找一些你可以做的浪漫事情的点子。通过花一点时间安排浪漫，你将收获更幸福关系的回报。\n\n*   给伴侣买他们喜欢的零食。\n*   给伴侣发信息告诉他们你爱他们，或者你期待见到他们。\n\
  *   在伴侣想去的地方预订一次惊喜晚餐或周末假期。\n*   互相教对方做某道菜。\n*   给伴侣做按摩。\n*   播放伴侣喜欢的音乐。\n*   安排完成一项实用的家务，例如修理笔记本电脑或装饰房间。\n\
  \n如果伴侣问你生日想要什么，当你心里暗自期待惊喜时，不要说“什么都不要”。引导伴侣从你喜欢的商店买东西，这样他们就会买你想要的东西。你们可以一起列出想要收到的礼物类型清单，例如科技产品、香水、男士须后水或演唱会门票。\n\
  \n如果伴侣为你安排了浪漫举动，无论是什么，都要感到高兴。即使不是你自己会选择的东西，也要表示感谢，不要把这种举动甩在他们脸上。如果你们互相倾听，你们都会发现对方喜欢什么。但如果伴侣忘记了周年纪念之类的活动，请原谅他们，并安排在另一天庆祝。\n\
  \n当可以在网上订礼物和卡片时，提前计划很容易的。不要等伴侣变得浪漫。浪漫的惊喜应该是有趣的，而且不需要花费太多钱。一片心形的吐司、内衣抽屉里、枕头上或便当盒里的情书、一个蛋糕或散落在烛光浴缸周围的玫瑰瓣，都是表达浪漫的廉价方式。但每个人都是不同的，所以要了解伴侣喜欢什么类型的事情。如果跳伞真的是你想做的事，而他们却很讨厌，那么送他们去跳伞毫无意义的！\n\
  \n如果你倾听伴侣的意见，你们会逐渐变得和谐。现在就树立榜样，教导孩子长大后对伴侣保持浪漫。如果你向孩子解释以后在关系中投入精力有多么重要，这对他们来说将是自然的，而不是一项负担。\n\
  \n## 分担育孩子的责任\n\n对伴侣要通情。如果你们互相帮助，你们都应该从照顾孩子中抽空休息。如果你们都在工作，请尽可能多支持对方。如果你是全职妈妈或爸爸，在伴侣下班回家时给他们一些呼吸空间。给他们时间洗个澡或泡杯茶，在你向他们轰炸你当天的事件之前，或者在你要求他们帮助你做家里任何需要做的事情之前。客户经常抱怨配偶期望他们一进门就立刻接手照顾孩子的工作。尝试变得更有组织性，这样你们全家人就能拥有高质量的时光。如果你离婚了，仍然要做好你的一份，让伴侣得到真正的休息，并感谢他们为孩子提供的资金或在照顾孩子方面付出的努力。\n\
  \n## 放下恐惧\n\n排除问题，然后看看剩下什么。不要让像“我们是否应该让孩子们养一只仓鼠？”这样简单的决定变成战场。活在当下。不要为了小问题大惊小怪。尝试从大局来看待问题。相信你们都有好主意，有时顺着伴侣的想法走，看看它们会带向何方。\n\
  \n不些时候，我和丈夫在上海住了一年，在那期间我遇到了一只需要家的的小狗。我当时很务实，考虑我们如何把小狗带回英国而不需要经过隔离。但我丈夫说：“带上它吧。我们会找到办法的。如果我们留不住它，我们会给它找一个更好的家。无论如何，它的处都会比现在好。”于是我们带了那只狗，一切进展顺利，因为我们在法国找到了家庭照顾了它六个月，这样它就可以不用隔离进入英国。带那只狗是一个伟大的决定。一切结果都**非常棒**——对狗和对我们都是如此！\n\
  \n尊重彼此的个性。从伴侣身上获得启发，并教他们也受到你的启发。生活中做什么并不重要，只要快乐就好。如果伴侣想要一些让他们快乐的事（在预算范围内），你可能从中受益。所以要同意尝试这个想法。\n\
