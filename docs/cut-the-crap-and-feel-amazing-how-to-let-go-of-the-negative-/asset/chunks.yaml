- raw: 'The best way to create AMAZING feelings is to think about people who are having
    a great life. A useful hypnotherapy technique is to imagine the life of someone
    who has what you want. By stepping into the life of someone else, you can begin
    to imagine how it might feel. Think of someone who has the things you would like
    to have. For some people, that will be a happy marriage. For others, it will be
    financial security, or a great job, or a relaxed and happy life. WE ARE ALL DIFFERENT
    AND WE ALL ENJOY DIFFERENT THINGS. So think about someone who has some of the
    elements in their life that would make your life enjoyable. Imagine how it would
    feel to have the security, the love, the happiness, the choices that the person
    you are thinking about has. Also, think of times when AMAZING things happened
    to you – for example when you met someone unexpectedly or caught a bus or a train
    against all odds. We have all had moments in our lives when things have worked
    out well. Feel the satisfaction and relief that you feel when things go well.
    Start today to remember more and more good things that have happened to you already.
    This will help you to program yourself positively to develop your AMAZING ZONE.


    From now on, assume that everything is AMAZING FOR YOU. Everyone has experienced
    something not happening or not working out initially, and then something better
    coming along – for example not getting a job that you truly believed to be right
    for you and then better work coming your way, or falling in love with a property
    you didn’t get and then getting something even better suited to you. You can’t
    always see the whole picture, but when it is revealed, you wonder why you worried
    so much. In other words, start trusting that AMAZING things are happening and
    everything is working out well for you. An example of this would be somebody getting
    an illness. It seems that the end of the world has come. But then the illness
    makes them reassess their life, change their stress levels, start eating properly
    and looking after themselves, and value the people close to them. In fact, the
    illness turns out to be a wake-up call that prompts the person to change their
    life into something very positive.


    **Imagine you are celebrating AMAZING things happening in your life. Automatically
    feel the celebration feeling of things working out as well as they can. Say to
    yourself, ‘Yes, it worked out AMAZINGLY well.’**


    Feeling the AMAZING feeling is not an excuse to avoid getting things done. You
    still need to be getting on with your life and making decisions. But you are creating
    inner calm because you know that it will all work out fine.


    **Program yourself with solutions to change your life so that you can feel better.**


    If your life is too busy, you will feel that you have no time to yourself. If
    you make time for yourself, you will be happier.


    If your life is empty, you will feel alone. If you find interesting things to
    fill your life with, your life will become more satisfying.


    If your life is financially overstretched, you will feel that you don’t have enough
    money. If you cut back on your spending, you will become happier about your finances.


    However, if you allow yourself to feel AMAZING, your life will become truly AMAZING.


    In [Chapter 3](../Text/chapter03.xhtml) you will learn how to let go of blockages
    that may be stopping you from feeling AMAZING feelings. If you suffer from depression
    or low feelings, take extra time to absorb the information in [Chapter 3](../Text/chapter03.xhtml).


    By changing your feelings to AMAZING feelings, you will feel different about your
    life, then positive things will begin to happen and you will be more solution-focused.


    ### *AMAZING day technique*


    **I teach clients to SMILE at bedtime before they go to sleep and to imagine tomorrow
    has turned out to be AMAZING. Also imagine a positive film in your mind of you
    being happy during the day. When you get up the next morning, you will feel more
    positive, which will help to create the AMAZING day you have already programmed
    to happen. If you imagine things are AMAZING, you will get more done, you will
    make better choices in your day and you will be more relaxed.**


    Think of your newfound AMAZING feelings as being the result of MARY POPPINS dropping
    into your life to sort everything out. She magically made impossible things happen.
    Your AMAZING feelings will do the same. The AMAZING will dissolve the bad feelings.
    This will give you the head space and clarity of mind to get on with sorting out
    the things you need to sort out.


    Here is an example of how I used the AMAZING feelings to make an AMAZING day happen
    for me. Back in 2003, my new partner who later became my second husband booked
    a photography course in Bradford. When he told me about it, my immediate thought
    was ‘Why Bradford?’ which is nearly 4 hours’ drive from where we were living at
    the time. We lived just an hour from London, where there are many photography
    courses on offer. But instead of asking the question, I immediately reminded myself
    to feel the AMAZING feeling that it would be great for us.


    We travelled up to Bradford the day before the course started and booked into
    a hotel. At 9 o’clock the next morning, I dropped my partner at the course and
    then set off to drive through the city. I had no map or satnav, and no Internet
    on my phone. I felt the feeling of having an AMAZING day and knew that I would
    be back in time to pick him up at 5 p.m. Then I literally followed my instincts,
    turning left at one road junction, going straight ahead at another, but always
    with the feeling of it being AMAZING.


    I drove through Bradford city centre and then out into the countryside. Eventually,
    I pulled up at a huge renovated brick factory building that had been turned into
    an art gallery housing one of the biggest collections of the works of the British
    artist David Hockney. I was smiling to myself, because a few weeks earlier in
    an art class I was attending, the teacher had commented that my style reminded
    her of David Hockney and that it might be of benefit to me to do some research
    into his work. I had seen one of his portraits at a London gallery and had wondered
    at the time where I could find a large collection of his work. But I had said
    to myself ‘AMAZING, I will find his work. It will all work out well.’ Now I found
    myself looking at one of the best collections of his art in the world.


    This is the power of the AMAZING feeling – never making anything a drama or believing
    that something will be hard to achieve, but instead flowing, trusting and feeling
    AMAZING.


    Having had a great day out enjoying the paintings and the little shops and cafés
    in the village of Saltaire, I got back into my car and used my instinct to guide
    me back across Bradford to the photography studio, where I arrived 15 minutes
    before my partner was due to finish his photography course. AMAZING!


    Many people would have had negative feelings about the fact that the course was
    so far away from home. For some couples, it might have been the cause of an argument
    or even a request that the partner didn’t go on the course at all. Remember this
    story when someone else arranges something unexpected. Instead of fighting it,
    try to go with the flow and imagine an AMAZING adventure that is great for you.


    It is possible to spend so much time trying to control everything in your life
    that you prevent life from leading you to AMAZING surprises. If you feel your
    life is mundane, it is probably because you are not allowing things to happen
    to you. You can rectify this right now by feeling the AMAZING feeling of a bright
    future. Soon, AMAZING things will start happening to you.


    **Get into the AMAZING zone and feel AMAZING.**


    * * *


    #### Chapter summary


    *   Add the word AMAZING to your everyday vocabulary.


    *   Write the word AMAZING in your everyday life.'
