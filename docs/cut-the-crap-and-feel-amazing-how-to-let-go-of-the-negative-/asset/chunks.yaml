  trans: '


    一个从事高薪工作且长时间工作的人，其最终的财务状况可能并不比低收入者好在哪里，因为他们把赚来的每一分钱都花在了奖励自己的辛苦上。他们可能会因为购买昂贵物品、外出就餐或点外卖而力不从心，因为他们没有时间做饭；他们还支付了学费和昂贵的假期费用，并买了一他们负担不起的大房子。最终，他们对金钱的压力可能比那些按预算生活的低收入者还要大。


    多年来，我遇到过许多客户，他们因长时间工作以及花费巨资通勤往伦敦而精疲力竭，这也影响了他们的生活质量。人们可能会感到受困于工作和财务承诺中。他们可能深陷于自己创造的生活中，以至于看不到任何脱脱的方法。通过我与这些客户一起工作，我帮助他们看到，通过逐渐做出不同的选择和决定，并开始在日常生活中感到感觉好起来，总有办法改变你的现状。


    你可以在上班的路上感到压力，也可以感到放松并享受这段时光，将其视为自己的高质量时光。一旦你开始对自己说“神奇的事情正在发生”，并使用 `SMILE` 技术，你就能识别出那些不适合你的事情，从而开始以微妙的方式调整你的生活。


    我的许多客户已经改变了工作，选择了薪水较低的本地工作，这些工作让他们能更早结束一天，从而有时间去做他们想的事，比如烹饪、阅读或进行其他的爱好。他们通常感到更加放松，并有更多时间思考省钱的方法，以便在缩减的预算下过上舒适的生活。最终，他们的财务状况变得更好，拥有更多个人时间，工作压力也更小了，这些都是积极的生活改变。


    其他客户则使用我的技巧学习如何更好地管理压力，然后发现他们新的、更积极的态度为生活带来了更好的、财务上报酬更丰厚的机会。通过开始从不同的角度看待问题，他们开始做出更好的选择，并创造他们最初所追求的生活。还有人继续重新培训并获得更好的工作，精简他们的业务，或者以更积极的态攀登职场阶梯，这有助于他们以更轻松的方式处理工作。


    你最大的资产是你自己——你如何挣钱、你如何用钱以及你如何选择过生活。生活质量是幸福的关键。虽然金钱很重要，但如果你对自己的生活感觉良好，那么赚大量的金钱也没有意义。


    人们在决定职业时，往往不考虑做那份特定工作每天让他们感觉如何，或者实际的日常生活会是什么样的。有些人选择一份工作是因为薪水，而另一些人甚至不考虑他们能赚多少钱。答案是用最适合你的方式使用你的技能，做出对你最好的选择，并创造你热爱的生活。


    如果你每天开着一辆华丽昂贵的汽车去上一个你讨厌的工作，那么拥有这辆车毫无意义。与其让自己背负负担不起的开支，不如开一辆不会超出你财务负担的汽车，然后偶尔租一天法拉利，这样更有满足感。这比真正拥有一辆昂贵的汽车要便宜得多。


    - **在花钱之前思考。如果你对买某物有不感，就花那笔钱。**


    下面的练习将帮助你跳出目前僵化的思维，这种思维可能会限制你在金钱方面的成功。


    ### 面团技术


    挣钱和获得成功源于一系列过程，这些过程与制作面包的过程相似。这项技术将帮助你利用制作面包的过程来拓展思路，过上富有的生活。


    要建立财富，你需要计划、有条理，在过程的各个不同部分——如购买、出售和投资——在正确的时间挣钱，付出体力劳动，然后留出时间让事物成熟和扩大，最后你才能享受努力的成果。在想象制作面包的过程时，思考你的财务状况——称量原料、混合原料、揉面团、面包发酵以及在烤箱中烘烤。你财务的增长也将从类似的系列事件和过程中发展出来。


    想象正在揉捏一个面团，移动它，在不同的方向上拉伸它，消除结块并使其光滑。你可以在这样做时移动你的手。当你想象揉面团时那种放松的感觉时，思考你的财务状况，感受处理和整理事情的感觉，这样你就能向财富的下一个水平迈进。


    想象你的财务计划进展顺利。当你感受到这些感觉时，想象你的大脑正变得以解决方案为中心，你正在以最好的方式思考，这样你的财务状况就会像面团一样容易、流畅且顺利。


    想象事情会自动处理，就像面团会自动发酵，烤箱会自动烘烤面包一样。想象你的生活中发生了很多好事。你会自动做出正确的决定，当某些事情会自动处理时，你采取行动处理其他事情。


    当你思考揉面团时，想象自己在正确的时间出现在正确的地方让好事情发生。想象奇妙的事情对你来说是可能的。想象一切进展顺利。


    现在想象创造性地将面团变成面包的形状。在脑海中选择一个形状，也许是法棍、小卷或是或一个大面包。选择任何你觉得合适的形状。你每次做这个练习时可能会选择不同的形状。你可以在这样做时移动你的手，做出你选择的面包形状。


    当你准备好后，让面团发酵，对你的面包形状、财务形状和财务状况感到满意。想象一切进展顺利。想象将面包放入烤箱，烤箱正在烘烤面包。想象你的财务状况进展到下一个水平，就像面包达到了最后的烹饪阶段。


    想象你今天和每天所做的一切都是让你的财富进展到下一个阶段。你每天都在为财务增长做需要的事。就像面包师每天制作面包一样，你每天为财富做出贡献。你创造了财务安全感和富有的生活方式。当你对财务状况感觉良好时微笑（SMILE）。


    经常重复这个练习。每当你思考财务状况时，记住它。当你努力每个阶段以建立财务状况时，记住一切进展顺利。你正在一点点处理事情，并做出明智的选择。就像面包发酵一样，你将上升财务安全和财富的下一个水平。将揉面团想象成你在处理问题以创造解决方案，揉你的职业，你的财务……


    **掌控你的财务并感到神奇。**


    #### 章节总结


    - 对金钱进行积极的对话。

    - 计划你的财务未来。

    - 说“神奇的钱”并 `SMILE`。

    - 使用面团技术：想象像揉面团一样处理你的财务状况。让你的财务状况像烘焙师制作一个面包一样成熟。

    - 爱你的财务状况，就像你喜欢蜷缩在舒适的床上一样。


    **步骤 1. 享受你已经拥有的。**


    **步骤 2. 在预算内生活。**


    '
