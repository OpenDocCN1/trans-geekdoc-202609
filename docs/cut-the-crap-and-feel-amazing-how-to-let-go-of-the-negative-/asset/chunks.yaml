- raw: 'Your children learn from the conversations they have with you. Don’t rely
    on technology to entertain them or sit them down in front of the TV and ignore
    them. Limit their daily TV viewing and make time to talk to them. When your children
    are small, inspire them with subjects they are interested in by doing things like
    going to museums, looking at nature or books.


    *   The little girl who played an art auction board game and was taken to art
    galleries by her grandparents went on to study History of Art at university and
    to do a masters degree in Art Business in Paris. She then ended up working in
    an auction house.


    **Remember that whatever your children are surrounded by can become part of them.**


    ## Protect your children


    You decide what to surround your children with and your reaction to life will
    influence them. If you choose to have magazines on the coffee table full of negative
    images of people and you don’t explain to your children that the behaviour depicted
    isn’t normal behaviour, they will grow up thinking it’s fine. If you let them
    watch horror films or play violent games, their impressionable minds will be influenced
    by violence and horror, which may cause them to be scared, worried, have nightmares
    or be violent themselves. Think very carefully about what you are letting your
    children view.


    The last thing a child hears before they fall asleep will remain in their mind
    throughout the night. So I suggest that you only allow your children to hear positive,
    calming music at bedtime or positive recordings before they go to sleep. I have
    had many child clients who were used to watching violent films or negative news
    items before they went to bed and who then had nightmares triggered by this material.


    *   Make sure your children are exposed only to age-appropriate material.


    *   Take away their phones at bedtime.


    *   Control what games they play, even if it means not allowing them to play the
    ones their friends play.


    *   Put parental controls on your computer to protect your children.


    *   Limit their access to social media.


    *   Help your children develop healthy interests, such as cooking, sport, art,
    making things, dance.


    *   Explain that there are lots of good things going on in the world, not just
    the negative things shown on the news.


    *   Let your children sort out their own issues. Give them advice, but let them
    stand up for themselves.


    *   Protect your child from an abusive sibling. Don’t assume that you can’t do
    anything and that it is normal behaviour – it is not.


    *   If your young child doesn’t like going to the crèche, find a way to make it
    work. Don’t blame them because they won’t do what the other kids do. Tell yourself,
    ‘It’s all working out AMAZINGLY well.’


    *   If your child is at boarding school and doesn’t like being there, listen to
    them and do what you can to change the situation.


    *   Teach your children that everyone is doing their best with the knowledge they
    have, even if their best is not great.


    *   Teach your children to be around people who are good for them.


    ## Being a good parent


    Anyone from any background can be a good or a bad parent. The one thing all parents
    have in common is that they can improve their parenting. Make a conscious effort
    to improve your relationship with your children, starting right now. Get the balance
    right between being involved and knowing when to say nothing. Teach your children
    to be kind to other people. Teach them to be thoughtful, maybe by making a birthday
    card or present for someone. If they forget to buy you a birthday card someday,
    don’t let it upset you. Just remind them gently for next time and accept the fact
    that they may have other things on their mind.


    ## Make life fun


    Learning something in a fun way from an early age creates a happy memory for children.


    *   If you play waiters and waitresses to clear the dishes from the table, they
    will always be willing to help in the kitchen because it will be associated with
    a happy feeling.


    *   If you play a hairdresser or barber game when you wash their hair, they will
    actually look forwards to their hair being washed.


    *   If you play nice music and have a sing-along while you tidy up together, they
    will always enjoy putting things away.


    *   If they tidy their room while being timed against the clock as a game, they
    will be happy to pick up their clothes and tidy up after themselves.


    If your sons and daughters know how to look after themselves and are respectful
    and helpful, they will grow up to have happy relationships or marriages.


    ## Working parents and stay-at-home parents


    Some people feel guilty if they work and have to leave their young children in
    childcare or leave older teenagers at home on their own. Others feel bad if they
    stay at home and don’t have a career or earn money. And many people feel that
    they are being judged by other parents or family members for the decisions they
    make about parenting.


    Everyone is different before they have children – some have careers while others
    don’t. So they will be different after they have had children too. It is up to
    you as parents to find out what works best for you and your family, as there is
    not one way of doing things. It doesn’t really matter how you organize things
    and whether you work or stay at home, as long as it works for you.


    Be supportive of other parents whether they work or stay at home. Remember that
    other people are individuals too and it is none of your business how they decide
    to do things. Many of my female clients tell me that they feel confused about
    what is right for them after they have had children. I always encourage them to
    steer their lives and careers in the best direction for them. You need to follow
    your heart. You need to get the balance right.


    Don’t allow your children to be an excuse to stop you building a secure financial
    future and career. Instead, say, ‘I have AMAZING work which is highly paid and
    fits in with the children. I have AMAZING childcare solutions.’ If you think AMAZING,
    you will find AMAZING solutions and the right balance. I have seen this time and
    time again with clients. For example, there will be other mothers who are happy
    to earn some extra money childminding, while your kids will be happy to have the
    chance to go to a friend’s house and will gain independence from being in the
    company of others.


    If you are self-employed, it can be useful to pay for more childcare to give you
    more focused time to get more work done. You will find that your earnings will
    increase overall when you pay for extra childcare. It’s probably best to pay for
    your children to be looked after for a whole day rather than an hour or two here
    and there, so that you have a full working day and time to get into the rhythm
    of working.


    ## Flowing with work


    You may have to tailor your career at different stages of your life. So just flow
    with what works at each stage as the children’s needs change. Imagine the lives
    of you and your children running smoothly in parallel with each other, like railway
    tracks.


    ## Teach your children about money


    Your children need to learn about managing their money so that they develop the
    skills that will enable them to manage their finances in the real world. Encourage
    them to save their pocket money and birthday money. Teach them to budget. It is
    all about choices and decisions. If they choose to spend their money on one thing,
    it won’t be there if they want to purchase something else in the future. Teach
    them to save most of what they receive by always putting a portion of it into
    a savings account.'
