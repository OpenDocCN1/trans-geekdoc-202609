  trans: '


    投入时间经营你与伴侣的关系，这样你就能收获亲密性体验的回报。关系就像花花蕾，阳光明媚时绽放，但如果云朵遮住了阳光，可能无法绽放。花朵还需要蜜蜂授粉，需要雨水帮助它生长发育。如果所有这些要素都不到位，花朵就无法完全绽放。你和伴侣也需要所有元素都到位，但对你来说，这些元素包括善良、浪漫、倾听、支持和互相帮助。


    不要期望你的伴侣像你一样思考和感受。如果觉得合适，就讨论一下你们都喜欢什么。很多关系受到色情片的影响，而那并不是给伴侣带来长期满意且亲密体验的来源。相反，尝试在互联网上寻找教育类信息，让你增加对伴侣身体运作方式的了解。尝试新方法来点燃伴侣并与其爱。色情片呈现了健康性生活的扭曲现实。因此，忘掉你从中中学到的所有东西。你偶尔可以从中获得乐趣，但要为性关系建立稳固的基础：


    *   多想浪漫喜剧，而不是色情片。

    *   尝试在浪漫音乐中做爱，这将帮助你们建立与性生活相关的新习惯和模式。

    *   尝试不同的方式会产生不同的结果。

    *   通过共同做出新的选择和决定，你可以建立一段**极其非凡**的关系。


    ## 浪漫举动


    和伴侣讨论你们都喜欢的浪漫举动类型。有些人喜欢收到用心的礼物，而另一些人可能更倾向于口头赞美、对方为你做的饭或一个拥抱。基本上，要倾听伴侣，当他们为你做好事时要意识到，这些可能是你以前认为视所当然的。


    你可以在网上寻找一些你可以做的浪漫事情的点子。通过花一点时间安排浪漫，你将收获更幸福关系的回报。


    *   给伴侣买他们喜欢的零食。

    *   给伴侣发信息告诉他们你爱他们，或者你期待见到他们。

    *   在伴侣想去的地方预订一次惊喜晚餐或周末假期。

    *   互相教对方做某道菜。

    *   给伴侣做按摩。

    *   播放伴侣喜欢的音乐。

    *   安排完成一项实用的家务，例如修理笔记本电脑或装饰房间。


    如果伴侣问你生日想要什么，当你心里暗自期待惊喜时，不要说“什么都不要”。引导伴侣从你喜欢的商店买东西，这样他们就会买你想要的东西。你们可以一起列出想要收到的礼物类型清单，例如科技产品、香水、男士须后水或演唱会门票。


    如果伴侣为你安排了浪漫举动，无论是什么，都要感到高兴。即使不是你自己会选择的东西，也要表示感谢，不要把这种举动甩在他们脸上。如果你们互相倾听，你们都会发现对方喜欢什么。但如果伴侣忘记了周年纪念之类的活动，请原谅他们，并安排在另一天庆祝。


    当可以在网上订礼物和卡片时，提前计划很容易的。不要等伴侣变得浪漫。浪漫的惊喜应该是有趣的，而且不需要花费太多钱。一片心形的吐司、内衣抽屉里、枕头上或便当盒里的情书、一个蛋糕或散落在烛光浴缸周围的玫瑰瓣，都是表达浪漫的廉价方式。但每个人都是不同的，所以要了解伴侣喜欢什么类型的事情。如果跳伞真的是你想做的事，而他们却很讨厌，那么送他们去跳伞毫无意义的！


    如果你倾听伴侣的意见，你们会逐渐变得和谐。现在就树立榜样，教导孩子长大后对伴侣保持浪漫。如果你向孩子解释以后在关系中投入精力有多么重要，这对他们来说将是自然的，而不是一项负担。


    ## 分担育孩子的责任


    对伴侣要通情。如果你们互相帮助，你们都应该从照顾孩子中抽空休息。如果你们都在工作，请尽可能多支持对方。如果你是全职妈妈或爸爸，在伴侣下班回家时给他们一些呼吸空间。给他们时间洗个澡或泡杯茶，在你向他们轰炸你当天的事件之前，或者在你要求他们帮助你做家里任何需要做的事情之前。客户经常抱怨配偶期望他们一进门就立刻接手照顾孩子的工作。尝试变得更有组织性，这样你们全家人就能拥有高质量的时光。如果你离婚了，仍然要做好你的一份，让伴侣得到真正的休息，并感谢他们为孩子提供的资金或在照顾孩子方面付出的努力。


    ## 放下恐惧


    排除问题，然后看看剩下什么。不要让像“我们是否应该让孩子们养一只仓鼠？”这样简单的决定变成战场。活在当下。不要为了小问题大惊小怪。尝试从大局来看待问题。相信你们都有好主意，有时顺着伴侣的想法走，看看它们会带向何方。


    不些时候，我和丈夫在上海住了一年，在那期间我遇到了一只需要家的的小狗。我当时很务实，考虑我们如何把小狗带回英国而不需要经过隔离。但我丈夫说：“带上它吧。我们会找到办法的。如果我们留不住它，我们会给它找一个更好的家。无论如何，它的处都会比现在好。”于是我们带了那只狗，一切进展顺利，因为我们在法国找到了家庭照顾了它六个月，这样它就可以不用隔离进入英国。带那只狗是一个伟大的决定。一切结果都**非常棒**——对狗和对我们都是如此！


    尊重彼此的个性。从伴侣身上获得启发，并教他们也受到你的启发。生活中做什么并不重要，只要快乐就好。如果伴侣想要一些让他们快乐的事（在预算范围内），你可能从中受益。所以要同意尝试这个想法。


    尝试对伴侣说：“随你想做。我相信你会做出明智决定。”并在心里想：“结果会**非常棒**的。”一旦你们之间的紧张关系消失，伴侣可能会决定不去做他们想的事。如果是这样，他们是自己得出结论的，以后不会把后果归咎于你。还能避免负面能量的浪费，这对关系是一种很大的消耗。


    如果伴侣不让你做某事，就放下这种渴望，并对自己说：“也许会发生。结果会**非常棒**的。”一旦你放手，你可能会发现自己并没有想象中那么想做它，或者你的伴侣可能会更倾向于让你尝试。


    *   双方的灵活性和开放的心态会创造出流畅的关系。

    *   通过在厨房和浴室收拾好自己、铺床和捡起衣服来对自己负责。

    *   通过保持在预算内对金钱负责。

    *   分担家务。。

    *   保持浪漫。


