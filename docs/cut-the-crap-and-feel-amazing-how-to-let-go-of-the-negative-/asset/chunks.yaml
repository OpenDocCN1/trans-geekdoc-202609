    I had a client who hobbled into my clinic one day and was barely able to sit down.
    He had a bad back, arthritis and was drinking too much alcohol. ‘I am old and
    I just have to accept it,’ he told me. In fact, he was hypnotizing himself with
    doom and gloom and I knew that, once he changed his state of mind, he would feel
    better.


    I used hypnotherapy to relax him, make him feel fitter and allow his mind to be
    solution-focused. On the day of a follow-up appointment, I looked out of the clinic
    window and saw him skipping along with a spring in his step. When he bounced into
    the room, he said that he had started using therapeutic magnets to improve the
    symptoms of the arthritis, had reduced his drinking and was feeling much better.
    He had a positive frame of mind and was like a man 20 years younger.


    **There are two important factors related to ill-health: one is the physical illness
    itself and the other is the need to deal with the stress and the impact it has
    on your life.**


    Hypnotherapy recordings are an excellent tool to help you release the stress and
    counterbalance the negative effects of health issues. Hypnotherapy is also useful
    in helping to prevent stress-related health issues. You can’t control everything,
    but you can embrace things that may help.


    Be open to making lots of small changes that will help you manage your health
    issues, get better and stay well. Remember, 1% better, then 10% better and before
    you know it you will be 50% better. You can use the percentage rule in other areas
    of your life too, to help you to find solutions and reach your goals.


    The Internet is full of health information which, used sensibly in conjunction
    with a `supportive doctor`, can provide you with answers to your health-related
    questions in a way that would have been impossible just a decade ago. Look for
    solutions to improve your health.


    ## Help other people who are ill


    Be supportive and kind to people who are ill. Encourage them to find solutions.
    Remind them, ‘It will work out AMAZINGLY well,’ and ‘Good things can come from
    any situation.’ Remember that when someone is ill or in pain, it can be hard to
    be positive. Be patient with them – and with yourself if you are the person who
    is unwell. Although most people will be open to help, not everyone will want to
    take on board the suggestions you may make. Sometimes, people just want to do
    things their own way, which is something that needs to be respected.


    If an illness is taking over your life, imagine putting it into a red triangle
    in your mind and shrinking it down to make it smaller. Visualize yourself doing
    the hobbies you love or would like to do. Believe that there is a way back to
    good health and financial independence. When you believe there is a way through
    your health issue, you will find a better way to move forwards to the best health
    you can have. Imagine a wiggly string leading you to the answers you need.


    People may judge you as a hypochondriac, but don’t take it personally: they probably
    haven’t ever been ill, except for having a cold or flu, and they don’t really
    understand what you are going through. But there are other people going through
    the same experience somewhere in the world. So don’t feel alone. Turn the situation
    into something positive so that one day you will be able to share your knowledge
    to help someone else. (You might share your story, share information online, or
    just have a conversation with someone that helps them.)


    ### Music control-settings technique


    **Imagine your mind and your life being like a music technician’s control panel
    in a recording studio, with sliding buttons and switches that flick on and off.
    Imagine all those different control settings now, as you think about your health
    or the health of a family member or friend. Go to the health part of the control
    panel and slide the settings up and down as you imagine things working out in
    the best way. Move the sliders as you feel good about positive changes taking
    place. Adjust the settings as you feel good about your life becoming harmonious.**


    **As the settings adjust, glide the slider buttons in different ways and switch
    off some of them if you want. Just do what feels right in your own creative way.
    Small adjustments create new choices and decisions. By tweaking the settings slightly
    here and there, you will tweak your attitude towards health and find solutions.
    It’s like having a massage in your mind and a massage in your life to make you
    feel better. Close your eyes if you want.**


    *   You are an individual, so find the best solutions for `YOU` to live the longest,
    happiest life possible.


    ## Take responsibility


    The UK has a wonderful free National Health Service for everyone. It’s AMAZING,
    but it does make people more reliant on solutions being provided for them rather
    than looking for those solutions themselves. If something is not offered on the
    NHS, be prepared to invest time and money in getting better. Living a healthy,
    happy lifestyle is the best place to start taking responsibility.


    ## Listen to your body


    Be realistic with your health limitations. For example, don’t fly halfway around
    the world if it is going to compromise your health. Instead, do something more
    local. When you are not well, you have to learn to accept the fact that your plans
    may have to change. If people around you cause you stress, listen to your body.
    Depending on how it is reacting to certain situations and people, you may need
    to change your interaction with them or avoid them. Show respect for your body
    in the way you live your life. Do a job that suits your body and keeps you as
    well as you can be. You may need to adjust your career to suit your health.


    ## Think positively


    Focus on things you want to happen. SMILE and feel AMAZING. Imagine you are fit
    and well, running or playing tennis and, above all, that you are happy in your
    life: ‘My health is AMAZING. My body is AMAZING.’


    Value your life and the lives of other people. Don’t wait for people to get ill
    before you appreciate them.


    **Cut the health hazards from your life and feel AMAZING.**


    ### Chapter summary


    *   Have colourful napkins every day to remind you to enjoy the moment.

    *   Use the wave technique: flow with your health like the waves flow in and out
    from the shore.

    *   Remember the percentage rule: all the small things that help will add up to
    you getting better.

    *   Keep focused to get the correct diagnosis and treatments.

    *   Use the music control-settings technique: adjust the settings so you feel
    good about your health becoming harmonious.

    *   Make yourself as calm and comfortable as you can be to help your health.

    *   Adjust your lifestyle to support good health.


    **STEP 1. Look after yourself.**


    **STEP 2. Say ‘AMAZING health’.**


    **STEP 3. Be as well as you can be.**


    *Identify the stresses and emotions that fuel your addictions. Then deal with
    them and set yourself free.*


    [![CHAPTER 13: ADDICTIONS AND OBSESSIONS](Images/ch13.jpg)](../Text/contents.xhtml#toc13)


    ## Taking back control


    You or someone you know may be affected by addictive behaviour. In this chapter
    I give tips and advice on the following topics:


    | Alcohol | Anti-ageing | Body image | Drugs | Food | Gambling | Gaming | Gossip
    | Pornography | Shopping | Smoking | Stress and anxiety | Technology, social media
    and phones | Theft | Work |


    | --- |


    Anything we spend a lot of time doing will eventually become part of who we are.
    Once we’ve become that person, we will have to spend time reprogramming ourselves
    to learn different behaviour in order to break the bad habit. It is `YOU` and
    only you who can make the change, either alone or with support.

    '
  trans: '


    有一天，一位客户步履蹒跚地走进我的诊所，几乎无法坐下。他患有严重的背痛、关节炎，而且饮酒过量。“我老了，我只能接受现实，”他告诉我。事实上，他正用绝望和阴郁的情绪在进行自我催眠，我知道，只要他改变心态，他就会感觉好起来。


    我使用催眠疗法让他放松，让他感到更健康，并让他的思维专注于解决方案。在一次复诊那天，我向向诊所窗外望去，看到他正轻快地跳着走。当他蹦进房间时，他说他已经开始使用治疗性磁石来改善关节炎症状，减少了饮酒，并且感觉好多了。他心态积极，看起来像年轻了
    20 岁的年轻人。


    **与健康问题相关的有两个重要因素：一个是生理疾病本身，另一个是应对压力以及压力对你生活的影响。**


    催眠治疗录音是帮助你释放压力并抵消健康问题负面影响的极佳工具。催眠治疗对于帮助预防压力相关的健康问题也有帮助。你无法控制一切，但你可以拥抱可能有帮助的事情。


    乐于做出许多小改变，这些改变将帮助你管理健康问题、好好转并保持健康。记住，每天进步 1%，然后是 10%，在你发觉之前，你已经进步了 50%。你也可以将这种“百分比规则”应用于生活的其他领域，帮助你找到解决方案并实现目标。


    互联网上充满了健康信息，如果能配合`supportive doctor`明智地使用，它们就能以十年前不可能的方式为你提供健康相关问题的答案。寻找改善你健康的解决方案。


    ## 帮助生病的人


    对生病的人保持支持和善良。鼓励他们寻找解决方案。提醒他们：“一切会进展得**非常顺利**，”以及“任何处境都能产生好结果。”记住，当某人生生病或痛苦时，很难保持积极。对他们要有耐心——如果你是那个生病的人，也要对自己有耐心。虽然大多数人会乐意接受帮助，但并不是每个人都愿意采纳你提出的建议。有时，人们只想按照自己的方式行事，这是需要被尊重的。


    如果一种疾病占据了你的生活，想象在脑海中将其放入一个红色三角形内，并缩小它让它变小。视觉化自己正在做喜欢的或想做的爱好。相信有一条回归健康和财务独立之路。当你相信有解决健康问题的方法时，你就会发现更好的方式通向最佳健康状态。想象有一根弯曲的线条引导你找到所需的答案。


    人们可能会判定你为疑病症，但不要对此介意：他们可能除了感冒流感外从未生过病，他们并不真正理解你的经历。但在世界上其他地方也有其他人经历着同样的体验。所以不要感到孤独。将局面转化为积极的事物，这样有一天你可以分享你的知识帮助他人。（你可以分享你的故事，在网上分享信息，或者只是与某人聊天来帮助他们。）


    ### 音乐控制设置技术


    **想象你的大脑和生活就像录音室音乐技术员的控制面板，上面有可以开关的滑动按钮和开关。当你思考自己的健康或家人、朋友的健康时，想象所有那些不同的控制设置。进入控制面板的健康部分，当你想象事情正以最完美的方式进展时，上下滑动设置。当你对正在发生的积极变化感到良好时，移动滑块。当你对生活变得和谐感到良好时，调整设置。**


    **随着设置的调整，以不同的方式滑动按钮，如果你想的话，也可以关闭其中一些。只需按照你自己的创造力去做正确的事。微小的调整会创造新的选择和决定。通过在这里那里微调设置，你将调整对健康的态度并找到解决方案。这就像在你的脑海和生活中都接受了按摩，让你感觉更好。如果你想，可以闭上眼睛。**


    *   你是一个个体，所以要找到适合`YOU`的最佳解决方案，以过尽可能长、最快乐的生活。


    ## 承担责任


    英国拥有一套完美的免费国家医疗服务体系（NHS）。这**不可思议**，但它确实让人们更依赖他人提供的解决方案，而不是自己去寻找解决方案。如果 NHS 不提供某些服务，请准备好投入时间和金钱来康复。健康快乐的生活方式是承担责任的最佳起点。


    ## 听从身体的声音


    对你的健康局限保持现实。例如，如果飞半地球会损害你的健康，就不要去。相反，做一些本地活动。当你不舒服时，你必须学会接受计划可能改变的事实。如果你周围的人给你带来压力，听听你的身体。根据身体对某些情况和人的反应，你可能需要改变与他们的互动方式或避开他们。在生活方式上尊重你的身体。做一份适合你身体并能让你尽可能健康的工作。你可能需要根据健康状况调整职业。


    ## 积极思考


    专注于你希望发生的事情。微笑并感到**不可思议**。想象你身体健康状况良好，正在跑步或打网球，最重要的是，你在生活中很快乐：“我的健康**太棒了**。我的身体**太棒了**。”


    重视你自己的生命和他人的生命。不要等别人病了才去感激他们。


    **从生活中切除健康危害，并感到不可思议。**


    ### 章节总结


    *   每天准备彩色的纸巾，提醒自己享受当下。

    *   使用波浪技术：像潮汐涨落一样顺应你的健康状况。

    *   记住百分比规则：所有有帮助的小事都会汇聚成让你好起来。

    *   保持专注以获得正确的诊断和治疗。

    *   使用音乐控制设置技术：调整设置，让你对健康变得和谐感到良好。

    *   让自己尽可能冷静舒适，以助于健康。

    *   调整生活方式以支持良好健康。


    **第 1 步。照顾自己。**


    **第 2 步。说“健康太不可思议了”。**


    **第 3 步。尽可能保持健康。**


    *识别助长你成瘾的压力和情绪。然后处理它们并释放自我。*


    ![第 13 章：成瘾与执迷](img/contents.xhtml#toc13)


    ## 重夺控制


    你或你认识的人可能受到成瘾行为的影响。在本章中，我针对以下主题提供提示和建议：


    | 酒精 | 抗衰老 | 身体形象 | 药物 | 食物 | 赌博 | 游戏 | 八卦 | 色情 | 购物 | 吸烟 | 压力与焦虑 | 技术、社交媒体和手机
    | 偷窃 | 工作 |


    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | ---
    | --- | --- |


    任何我们花费大量时间做的事情最终都会成为我们的一部分。一旦我们变成了那样的人，我们就必须花时间重新编程自己，学习不同的行为以打破坏习惯。是`YOU`，只有你才能做出改变，无论是独自还是在支持下。


