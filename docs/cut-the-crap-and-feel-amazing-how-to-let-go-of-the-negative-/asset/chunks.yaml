- raw: 'If it is all kicking off at work or at home, just say, ‘AMAZING. AMAZING.
    Fantastic. This is AMAZING.’ Feel the feeling of making the right choices and
    decisions to get you out of the situation. You may feel frustrated, but let it
    pass. By getting into the habit of rising above issues, you will deal with things
    better. For example, if you have a difficult neighbour or boss to deal with, just
    say: ‘AMAZING. I will find solutions to dealing with this situation.’ Feel good
    about the situation resolving.


    One of the reasons it is AMAZING is because you are identifying the problem so
    that you can resolve it. Use the SMILE technique so that you can laugh at the
    situation. By feeling AMAZING or fantastic, you are already feeling better. Once
    you feel better, you will turn it into a better situation. SMILE and imagine things
    have resolved AMAZINGLY well. Feel the good celebration feeling inside you as
    if it has all worked out well.


    Your life may be so busy that you haven’t had the brain space to work things out.
    Or you may have been programming yourself with the same limiting thoughts that
    have stopped you being able to see things differently. When people go on holiday,
    they are able to see their lives with fresh eyes. Usually, that makes them feel
    a bit better about things because they can see where to make adjustments on their
    return home. This is because they have more brain space while they are away.


    I teach clients an exercise to help massage out those stuck, rigid choices and
    decisions. It’s really like a massage in your mind. The exercise is incredibly
    powerful, easy to do at any time and makes a massive difference by enabling you
    to let go of trapped, stuck and overloaded feelings. This technique will help
    you to make constant adjustments to keep your life flowing.


    ### *Music control-settings technique*


    **Imagine your mind and your life being like a music technician’s control panel
    in a recording studio, with lots of sliding buttons and switches that flick on
    and off. Imagine all those different control settings now, as you think about
    the area of your life you want to work on. Go to this part of the control panel
    and slide the settings up and down as you imagine this area of your life adjusting
    positively. Move the sliders as you feel good about positive changes happening.
    Adjust the settings as you feel good about your life becoming harmonious. As the
    settings adjust, glide the slider buttons in different ways. Switch some of them
    off if you like. Just do what feels right in your own creative way. By tweaking
    the settings slightly here and there, the small adjustments will help you to create
    new choices and decisions. Close your eyes if you want to. It’s like having a
    massage in your mind and a massage in your life, making you feel better.**


    **Imagine each area of your life is represented by a certain area of the control
    panel. Visualize as best you can doing some work in a particular area by moving
    the controls, adjusting and resetting them until you feel relaxed. You will find
    that if you do this exercise regularly, your mind will start to change, allowing
    you to come up with more solutions for yourself. You will feel differently about
    things that previously caused tension and stress. Things that used to seem impossible
    will resolve.**


    **You can use the technique at any time. When you wake up in the morning, imagine
    the settings adjusting your day so that it works out well. Do the exercise on
    the way to work, in a traffic jam, waiting for a bus, when you go to the toilet
    or during any spare moment you have. After a while, it will become second nature
    to you, as your mind processes everything smoothly. Used regularly, it will help
    unlock your mind from the old, bad habits by tweak, tweak, tweaking the settings
    of your emotions, stresses, work, confidence issues, worries, money and relationships.**


    Be creative in your day. Be creative in your week. Be creative in your weekend.
    Don’t just do what you did yesterday, last week, last weekend, or what you think
    you should be doing because of your age group or your circumstances. At school
    you had to fit the mould of what was expected of you and generally do what everyone
    else was doing. But you are not at school now. So be very creative with your time.
    Be individual.


    Often clients ask me, ‘How can I fill my weekend with positive things? What is
    there to do? There is nothing to do.’ And I tell them, ‘If you look around where
    you are right now, there are so many things to do. There are people out there
    doing all sorts of activities, gardening, walking a dog (borrow a dog if you need
    to), going to local cafés, joining clubs, reading, researching topics of interest,
    going to galleries and museums, starting courses online or at colleges.’


    If you have children, do things with them that are relevant to their age group
    so that you can enjoy your time as a family at each stage of their lives. Get
    to know what’s available in your local area. We live in a country that has so
    many opportunities and so many activities that are free that you will be able
    to find something to do, whatever your budget.


    Start your Monday morning by saying, ‘Wow, I had an AMAZING weekend. It was fantastic.
    I went on a course and met some AMAZING people.’ Listen to what you think, feel
    and say about your weekend.


    Already your life has begun to change. When you start to make better choices and
    decisions, your world will open up and great things will happen. You can strengthen
    your choices and decisions by combining them with AMAZING phrases such as, ‘I
    am making AMAZING choices and decisions,’ and ‘I make AMAZING things happen.’
    To begin with, it may feel as though you are just playing a game, but you will
    soon see positive results.


    Your progress in life is not something that is happening outside of yourself.
    It is happening inside you. Your words and actions command the direction you are
    going in every moment of every day as your subconscious mind absorbs the information
    you program into it. It all begins with you. You are in control. The more you
    use these techniques, the faster you will see change in your life.


    I tell all my clients that change is the most important thing: CHANGE, CHANGE,
    CHANGE, CHANGE, CHANGE. So start changing how you see things, and remember that
    all things are possible.


    Every time you write a negative review, you are sending out a negative message
    about who you are. Instead, write constructive suggestions to a company that’s
    got something wrong and give them the chance to improve before posting a public
    complaint. Most businesses work hard to provide good products and services for
    their clients. If they don’t always get things right, it’s worth remembering that
    their staff are only human and they might simply have made a mistake. Even better,
    rather than focusing on saying negative things about your experiences, choose
    to write positive reviews about companies who get things right. Send a thank-you
    card to a business that is doing something well and thank local businesses for
    the services they provide to the people living in your area. Your attitude is
    creating your experience. If you home in on the bad, you will get more of it.
    It’s a bit like Karma – what you give out comes back.


    Use your instinct about what feels right rather than being influenced by a negative
    person’s point of view on a review. More ‘negative’ types of people write reviews
    than positive people. The positive people are too busy getting on with living
    a great life. Let your instinct lead you to a great place to eat as you make life
    an adventure through good choices and decisions. When you make happy choices and
    decisions, you will find yourself in the right place at the right time.


    **Cut the boring routine from your life and feel AMAZING.**


    * * *


    #### Chapter summary


    *   Regular small changes will help you make bigger changes.


    *   Be creative about how you live your life.'
