  trans: '

    Steve 是一位经验丰富的建筑师建筑公司的高管，他曾想过创办一家新的建筑业务，但由于经济衰退，他认为这风险太大。在与我几次面谈后，他决定离开旧工作。然后，通过运用“卓越（AMAZING）状态的感觉”，他通过自我暗示获得了成功，并利用书中描述的其他技巧来保持积极。在他自己的建筑项目投入运行之前，他做了一些自由职业工作来支付账单。他告诉我：“尽管面临经济衰退，我也有信心去追求我的梦想。因为我有了新的内在自信，我辞了职，开始创造自己的命运。”


    通过努力工作和对“卓越”的信念，他在第一年的营业额就达到了一百万英镑！到了第三年，他的营业额已达到五百万万英镑。


    **我的建议：** 记住，Steve 是利用他多年积累的技能开始创业的，这与开始一个你一无所知的新业务完全不同。因此，在你建立新业务和学习新技能的同时，要意识到你可能需要继续做旧工作来维持生活，直到你开始赚钱。自雇是一项辛苦的工作，所以要准备投入时间进行各项筹备。尊重每一位客户，因为他们可能会为你带来更多客户。控制开支，并保持谨慎——建立良好的声誉并创造丰厚的收入可能需要一段时间。在生活中，有时你只需要尽管去做，就因为那些事让你觉得是正确的。你的决心和良好的感受将让你获得成功。


    专注决定了你的现实。相信卓越的事情会发生，但也要脚踏实地。


    ## 有时你可以拥有你认为负担不起的东西


    Gemma 负担不起假期，所以我配合她一起释放了她的负面信念。我告诉她想象现在是夏末，感觉就像她已经度过了一段卓越的时光。她很容易就能做到这一点，因为在与我进行交流之后，她的思维方式变得积极了许多。几周后，她告诉我，一位多年未见的朋友免费送给她一栋度假屋。所以你猜怎么着：她最终还是度过了一个卓越的假期。


    **我的建议：** 卓越且意想不到的事情确实会发生。不要依赖它们，但要始终保持积极的乐观态度。释放负面信念是在潜意识层面保持积极的关键，这将让你真正相信好事情会发生，而不仅仅是假装自己很积极。


    ## 储蓄，储蓄，储蓄，投资，投资，投资


    开设几个储蓄账户，每当你赚到或收到钱时，将其中一部分放入每个账户中。当你认为没有闲钱可以储蓄时，就削减其他地方的开支，以便把钱存入储蓄账户。这在心理学上非常重要，因为当你考虑财务状况时，你会知道除了债务或透支外，你还有一些储蓄。通过储蓄，你为自己设定了程序以遵守更紧的预算，并且你会感激自己能够买得起的东西。


    当我建议一位名叫 Graham 的客户这样做时，他说：“我没钱储蓄。”“你承担不起不储蓄的后果，”我告诉他。在我释放了他的负面金钱模式后，尽管有透支，他还是决定挑战一下自己，每月向储蓄账户存入
    75 英镑。32 个月后，他存下了 2400 英镑。

    '
