- raw: 'A person doing a highly paid job and working long hours may end up being no
    better off financially than a lower-paid person, because they spend everything
    they earn on rewarding themselves for the hard work they do. They may overstretch
    themselves by buying expensive items, eating out or ordering takeaways because
    they haven’t got time to cook, paying for school fees and expensive holidays,
    and buying a big house they can’t afford. Eventually, they may be even more stressed
    about money than someone on a lower wage who is living within their budget.


    Over the years, I have had many clients who were burned out from working long
    hours and paying large sums of money to commute to London, which was also having
    an impact on their quality of life. People can feel trapped in their jobs and
    by financial commitments. They can be so caught up in the life they have created
    that they can’t see any way to get out of it. Through the work I do with these
    clients, I help them to see that there is always a way to change what you are
    doing by gradually making different choices and decisions and by starting to feel
    better in your daily routine.


    You can feel stressed on your journey to work or you can feel relaxed and enjoy
    the time, seeing it as quality time for yourself. Once you start to say to yourself,
    ‘AMAZING things are happening,’ and use the SMILE technique, you will identify
    the things that don’t work for you so that you can start to adjust your life in
    subtle ways.


    Many of my clients have gone on to change their jobs, taking lower-paid local
    jobs that allow them to finish their working day earlier so that they have time
    to do the things they want to do, like cooking, reading or doing other hobbies.
    They generally feel more relaxed and have more time to work out ways of saving
    money so that they can live comfortably on their reduced budget. And they end
    up being financially better off, have more time to themselves and are under less
    pressure at work, which are all positive life changes.


    Other clients use my techniques to learn ways to manage their stress better and
    then discover that their new, more positive attitude brings better, more financially
    rewarding opportunities into their lives. By starting to view things differently,
    they begin to make better choices and create the life they were striving for in
    the first place. Others go on to retrain and get better jobs, streamline their
    businesses or climb the career ladder with a more positive attitude, which helps
    them deal with work in a more relaxed way.


    Your biggest asset is yourself – how you earn your money, how you use your money
    and how you choose to live your life. Quality of life is the key to happiness.
    Although money is important, there is no point earning vast sums of it if you
    don’t feel good about your life.


    People often decide on a career without thinking about how doing that particular
    job will make them feel each day, or what the routine will actually be. Some people
    choose a job because of the money they will be paid, while some don’t even think
    about how much they will earn. The answer is to use your skills in the best way
    for you, make the choices that are best for you, and create the life you love.


    There is no point having a gorgeous, expensive car if you are driving it every
    day to a job you hate. Rather than burden yourself with expenses you can’t really
    afford, it is more satisfying to drive a car that doesn’t overstretch your finances
    and then perhaps hire a Ferrari occasionally for a day. This will be much cheaper
    than actually owning an expensive car.


    *   **Think before you spend. If you have a bad feeling about buying something,
    don’t spend the money.**


    The following exercise will help you to get your mind out of your current rigid
    thinking, which may be limiting your success with money.


    ### *The dough technique*


    **Making money and being successful result from a series of processes, which are
    similar to the processes involved in making bread. This technique will help you
    to expand your mind and have a wealthy life, using the bread-making process.**


    **To build your wealth you need to plan, be organized, do all the different parts
    of the process – such as buy, sell and invest – at the right time to make money,
    exert physical effort and then allow time for things to mature and expand before
    you are eventually able to enjoy the results of your efforts. Think of your finances
    while you imagine the process of making bread – the weighing of the ingredients,
    the mixing of the ingredients, the kneading of the dough, the rising of the bread
    and the baking in the oven. The growth of your finances will also develop from
    a similar series of events and processes.**


    **Imagine kneading a ball of dough, moving it, stretching it in different directions,
    getting rid of the lumps and making it smooth. You can move your hands as you
    do it. As you imagine the relaxing feeling of kneading the dough, think about
    your finances, feel the feeling of working through things and sorting them out
    so that you can progress to the next level of wealth.**


    **Imagine your financial plans working out well. As you feel these feelings, imagine
    that your mind is becoming solution-focused and that you are thinking in the best
    possible way so that your finances will be easy, flowing and smooth like the dough.**


    **Imagine some things taking care of themselves, just as the dough rises on its
    own and the oven bakes the bread. Imagine many good things happening in your life.
    You automatically make good decisions and while certain things take care of themselves,
    you take action to deal with the others.**


    **As you think about kneading the dough, imagine being in the right place at the
    right time for good things to happen. Imagine that wonderful things are possible
    for you. Imagine that things are working out well.**


    **Now imagine creatively turning the dough into bread shapes. Choose a shape in
    your mind, perhaps a baguette or bread rolls or a loaf of bread. Choose whatever
    feels right for you. You might choose a different shape each time you do this
    exercise. You can move your hands as if you are making the bread shape you have
    chosen.**


    **When you are ready, allow the dough to rise and feel satisfied with your bread
    shape, with your financial shape and with your finances. Imagine everything working
    out well. Imagine popping the bread into the oven and the oven baking the bread.
    Imagine your finances progressing to the next level, just as the bread reaches
    its final stage of cooking.**


    **Imagine that you have done everything today and each day to progress your wealth
    to the next stage. Each day you do what needs to be done for your finances to
    grow. Just as the baker makes the bread every day, you make a daily contribution
    to your wealth. You create financial security and a wealthy, happy lifestyle.
    SMILE as you feel good about your finances.**


    Repeat this exercise regularly. Remember it any time you think of your finances.
    Remember things are working out well as you work through each stage to build your
    finances. You are gradually working through things, bit by bit, and making sensible
    choices. Just as the bread rises up, you will rise to the next level of financial
    security and wealth. Think of the kneading of the dough as being you working through
    the problems to create solutions, kneading your career, your finances…


    **Be in control of your finances and feel AMAZING.**


    * * *


    #### Chapter summary


    *   Talk positively to yourself about money.


    *   Plan your financial future.


    *   Say ‘AMAZING money’ and SMILE.


    *   Use the dough technique: imagine working through your finances just as you
    would knead a ball of dough. Allow your finances to mature in the same way as
    a baker makes a loaf of bread.


    *   Love your finances as much as you love being snuggled up in a cosy bed.


    **STEP 1. Enjoy what you already have.**


    **STEP 2. Live life within your budget.**'
