    Men and women can be equally distressed over a divorce. It is common to feel frustration
    and upset. A client had a lot of anger towards her ex-husband because he had run
    off with another woman. After sessions with me, she started to see that the relationship
    had actually broken down over time. She realized that she had sometimes been unreasonable
    too – she had not always been open to discussions and she was seeing things as
    black and white – and maybe that was partly why he left, because there was no
    room for negotiation. She also accepted the fact that because her ex-husband was
    still helping to support her financially, she didn’t have any money worries. She
    started to be more grateful for his financial support instead of feeling resentful.
    Eventually, her anger dissolved and she became friends with her ex-husband, which
    made life very much better for the children. When she came to terms with him being
    with someone else, she was able to move on with her life. And then she met someone
    else too, having learned from the experience.


    - `Accepting things have turned out the way they have will help dissolve stress
    and hurt.`


    If you have lost children in a divorce situation, you need to keep up your contact
    with them, let them know you love them and do something AMAZING with your life
    to fill the void. Remember, children will grow up and one day things might change
    and you could be close to them again.


    We have all been brought up with fairytales that tell us there is one prince or
    princess out there for us and that, once we are together, we will live happily
    ever after. In reality, there are many princes and princesses, none of whom is
    totally perfect. You will find someone else and when you do, you will be able
    to use the experience from the past to get things right, by being reasonable,
    communicating well with that person and working through things together.


    You will get over the relationship break-up you have been through and you will
    move on. There are millions of people in the world and I assure you that there
    is someone out there for you. There is never just one person who is right for
    you. So believe that someone even better will come into your life.


    The following tips will help you.


    1. See the relationship as a stepping stone in your journey of life. See it as
    being behind you, as part of the path leading you to a great relationship. Whenever
    your ex-partner pops into your head, see the stepping stone.

    2. If that person had been right for you, things would have worked out. Say to
    yourself, ‘I am AMAZING and I deserve to be with someone who treats me well.’

    3. Say to yourself, ‘It’s all working out AMAZINGLY well.’ No matter what is going
    on, presume that it will all work out AMAZINGLY well and that your life will get
    even better than it could have been if you had remained with that person.

    4. Work on yourself. The more happy and confident you are, the more likely you
    are to meet someone who respects you.

    5. Never allow others to take away your happiness. Go out and create new happiness
    by doing things you love. Learn something in a class or do something else AMAZING
    so that you can look back at this time as being the time when you made your life
    even better.

    6. Love everyone, even if you don’t see eye to eye with them. See the funny side
    of everyone and everything. Learn to laugh at yourself and at the world. Everyone
    is doing the best they can.

    7. Get out of black-and-white, rigid thinking, such as, ‘This has happened, so
    it’s all rubbish now.’ Instead, start living in the grey area, which is where
    the solutions are. Live in a world that is filled with possibilities. Say, ‘This
    has happened, but I can and I will turn it into something good.’


    Read this chapter regularly until you feel better.


    `SMILE, SMILE, SMILE` at all the good things about the people who have touched
    your life. It will all work out AMAZINGLY well if you let it.


    `Cut the sadness and feel AMAZING.`


    ***


    ### Chapter summary


    - Do new, interesting things you didn’t do before your loss.

    - Imagine a wiggly string leading you to everything you need to make a full recovery
    from the events.

    - Use the happy photo technique: speak to a photograph of yourself, tell yourself
    what you are feeling, let the emotions out and then tell yourself it will all
    work out AMAZINGLY well. Tell a photo of the person you lost that you will make
    your life an AMAZING adventure.

    - Build a positive routine of looking after yourself.

    - Have colourful paper napkins at every meal to remind you to appreciate every
    moment.

    - The plan has changed and you can cope with the new plan.

    - Plan things to look forward to.


    **STEP 1. Accept that the events have happened.**

    **STEP 2. Understand that you will feel fine again.**

    **STEP 3. Allow the event to turn into something positive.**


    ***


    *If you sit around waiting for it to happen, it won’t. But if you start living
    a life you love, you will feel more contented and you will find a great partner.*


    [![CHAPTER 15: FINDING LOVE](Images/ch15.jpg)](../Text/contents.xhtml#toc15)


    There are millions of people in the country you are living in and there is definitely
    more than one person who is suitable for you. It is crazy to think that you will
    end up on your own. Of course you can find someone, in the same way you can make
    anything happen in your life. By making good choices and decisions, you can find,
    nurture and enjoy a good relationship. If you sit around waiting for it to happen,
    it won’t. By living a life you love, your positivity will bring more happiness
    into your life and you will end up finding a great partner.


    Do things you enjoy, look after yourself, build your confidence, make the best
    of your looks and feel AMAZING. Your positivity will catch the attention of a
    good partner for you. But instead of focusing on finding someone, start living
    each day and building the life you want. The more you are your true self, the
    more suitable your new partner will be, as you are quite likely to meet someone
    who is on the same level of positivity as you are. See this phase as a time to
    discover who you really are. Feel a confident feeling that it will all work out
    AMAZINGLY well, in the same way that other things in your life have worked out
    well for you.


    You may be feeling that you can’t move on from a past relationship. It is important
    to free yourself from past upsets and disappointments so that you can embrace
    a new relationship fully.


    ### Moving-on-from-past-relationships technique


    `Read this regularly: My life is flowing and moving. There are solutions to everything.
    I need to be in the grey area, not in the black-and-white area. There is not just
    one way. There are many ways. It’s okay to have a moment that is not so great.
    I can let the feeling pass like clouds in the sky. I can reassure myself using
    the knuckle-rubbing/pressing/tapping technique, stroking my left knuckle with
    the fingers of my right hand until the feeling passes. I can see the way forwards
    as a wiggly string finding the solutions along the way. I can SMILE and let the
    good feelings flow again. Other people must have got over similar things. I can
    too. People do move on from these things all the time. The past was a foundation
    to prepare me for a great partner now. Life is an adventure. I can turn this experience
    into something AMAZING.`


    ## Improve who you are


    Are you a great partner or are you demanding? Are you too giving? Are you needy?
    Do you lack confidence? Or are you so independent that you don’t make time for
    anyone else or don’t allow anyone into your life because you’re afraid of them
    taking too much control? What were you told about relationships when you were
    growing up? Perhaps that it’s best to be independent and that no one needs to
    have a partner?

