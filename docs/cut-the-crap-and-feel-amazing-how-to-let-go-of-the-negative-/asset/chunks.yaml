    If you have difficult friends/family members who drain you or who you find to
    be negative, try to think of new ways to meet up. For example, go out for the
    day so that your conversations are about the day out and not about their problems.
    Go to the theatre or a museum or on a boat trip or do anything else that inspires
    you. If you really can’t bear to be in their company, set them free and set yourself
    free by honouring your feelings and being around the people who suit you best.
    If someone is good for you, they will come back into your life at an appropriate
    time.


    ## Relationships with good friends


    Friends will come in and out of your life and your partner’s life. Good friends
    will always ‘feel’ right when you see them. Don’t force friendships or feel let
    down if a friend is in a different headspace at a particular time. Set your friends
    free and, like boomerangs, they will come back into your life when the time is
    right.


    As you become more positive, some of your friends may not feel comfortable being
    around your positivity, and you may not feel comfortable with their negativity.
    But they may become more positive in the future, so always leave the door open
    for them to come back into your life.


    ### Speak-to-a-photo technique


    Try talking to a photograph of the person you want to speak to, perhaps your husband/wife,
    friend, work colleague or child. It is a good idea to get things off your chest
    before you actually speak to them in person. Once you have told the photograph
    everything you want to say, you may find that there is no need to have a discussion
    with the person themselves. When you do see them, you will be calmer and more
    rational and you may feel that the air has already cleared.


    Make special time for yourself and for each person in your life and feel AMAZING.


    ### Chapter summary


    * Use the relaxation technique: let the problems pass. Say, ‘It’s all fine. It’s
    all resolving.’

    * Use the watching technique: enjoy watching people tell you about the things
    they are interested in.

    * Have a meeting to discuss issues calmly.

    * Be romantic with your partner.

    * Get to know what your partner likes.

    * Praise people – everyone likes to feels special.

    * ![image](Images/img1.jpg)Use the chocolate brownie technique: bring out the
    warmth in people, not the cold.

    * STEP 1. Let go of rigid black-and-white thinking.

    * STEP 2. Remember everyone is individual.

    * STEP 3. Focus on people’s strengths.


    *Choices and decisions create a good or bad relationship.*


    [![CHAPTER 10: RELATIONSHIP RULES](Images/ch10.jpg)](../Text/contents.xhtml#toc10)


    ## All good relationships are about sticking to a set of rules


    * It is us, not other people, who are in control of our relationships, of whether
    or not we are prepared to put up with something, or have the ability to work through
    issues, or expect too much or too little. Try to be balanced and always imagine
    finding a way through things so that they work out well. But be prepared for the
    fact that some things can’t be fixed.

    * Remember the grey area where the solutions are found. Avoid black-and-white
    thinking.

    * Love yourself enough not to let the behaviour of others affect you. It doesn’t
    matter what people say or do, you can still feel good about yourself. Say to yourself,
    ‘I am AMAZING’ and ‘They are AMAZING,’ as this will dissolve the negative between
    you.

    * Other people are AMAZING too. SMILE and imagine that you bring out the AMAZING
    in them.

    * Be open to other people’s ideas and opinions and remember that there are many
    ways to do things, not just one way. Work *with* others, not against them. Remind
    them that you may see some things differently from the way they see them.

    * Don’t spend time worrying about other people’s problems. Imagine things have
    worked out AMAZINGLY well for them and let them get on with sorting out their
    own lives.

    * Don’t rescue other people. Instead, rescue yourself. Every time you sort something
    out for someone else, they don’t have to learn how to do it themselves. Rescuing
    them only delays their development.

    * Say to yourself and to other people, ‘You can and you will sort this out. You
    are good at sorting things out.’ It is okay to help people if they are helping
    themselves too.

    * Don’t buy into negative dramas. Instead, be around positive people.

    * Some people are logical in their thinking, some are emotional and some are creative.
    We need all types of people to make the world go round. If we all thought the
    same way, it would be impossible to function as a society. Be interested by your
    partner and by the people around you and appreciate their special qualities.

    * SMILE at the past. See it as a sitcom and laugh at it. Laughter brings you into
    a positive ‘now’.

    * If someone is being difficult, instead of getting angry, just SMILE to yourself
    and imagine you are in a comedy film.

    * If you are the ‘difficult one’ in a relationship, sort out your problems. For
    instance, do you drink a lot? Are you untidy? Are you demanding? Do you talk about
    things that you never do? Do you live your life through other people’s achievements?
    Do you gossip negatively? Do you believe that you are better than everyone else?
    Are you annoying? Are you lazy? Are you hyperactive? Look at yourself and become
    a better version of you. Take on board other people’s comments and suggestions.
