- raw: 'People’s lives can be terrible. Truly awful things can happen, or life can
    be challenging on a daily basis. I’m not suggesting that you should simply brush
    those experiences under the carpet and forget about them. It’s important to ACCEPT
    that they happened, UNDERSTAND why they happened, LEARN from them and MOVE ON
    from them. You can imagine throwing the unwanted thoughts into the pond like pebbles
    so that you get back into the AMAZING zone as quickly as possible. Practise the
    AMAZING feelings.


    Try to look for the good in any situation. Many people turn a negative experience
    into a positive life-changing event. Low points are turning points. Sometimes
    a really bad situation will make you address an issue, or you’ll have no choice
    but to make changes that turn out to be AMAZING. The worst thing is to get caught
    up in a negative that absorbs you. You need to find an inner strength to get out
    of it. Demand something better for yourself and be creative to find solutions,
    using the AMAZING zone feeling to lift you out of where you are into a better
    place within yourself. Be inspired by people who have done something positive
    as a result of a negative situation, such as:


    *   the parent who loses a child and goes on to create an AMAZING charity to help
    children with cancer


    *   the recovered drug addict who helps young people build AMAZING lives


    *   the person who loses their job and goes on to create an AMAZING business employing
    other people


    *   the person who loses a loved one and goes on to have an AMAZING life as a
    tribute to them.


    What we focus on, talk about, think about or self-chatter about becomes our reality,
    because we program ourselves, just like the person who is determined to become
    a doctor when everyone is telling them they can’t do it and proves them all wrong
    by believing they can, studying hard and making it happen.


    Life is pretty simple: the more you focus on the things you want, the more you
    become those things. If you dwell on the past, you will create more distance between
    you and your future. If you focus on your future, setting goals and actioning
    the steps that need to be taken, you will reach that future place more quickly.
    If you persist in believing in an AMAZING life, that is exactly what you will
    get.


    **The simplest way to create positive things in your life is to say, ‘It is AMAZING.’
    Even if what is going on right now is challenging, say ‘It is AMAZING. It is working
    out AMAZINGLY well.’**


    When you get into the habit of seeing the positive, you will reprogram yourself
    to think the positive and soon you will be living the positive. It is you who
    is creating it, not an outside force or other people, as it is your subconscious
    mind that holds your set of beliefs. It all begins with you, because how you choose
    to see things and the words you use are, in effect, hypnotizing you.


    If two people are going through a similar situation, one of them may get into
    the negative drama, while the other may say ‘It’s AMAZING’ and, before they know
    it, the whole situation will have turned around or something positive will come
    out of it. Sometimes, difficulties teach us our most important lessons in life.
    See everything as an opportunity to improve. Gradually cut the negativity from
    your life and feel AMAZING.


    ### *Stepping-stone technique*


    **Accepting simply means acknowledging that things may not always have been great
    and imagining that your past was simply a series of stepping stones in your journey
    through life. See in your mind all of your past experiences as stepping stones
    – solid objects that are useful to you as you move from one piece of solid ground
    to the next. Let any angry emotions of the past dissolve. Everything we experience,
    whether good or bad, helps to build our character, gives us life experience, helps
    us to feel a full spectrum of emotions, and gives us more understanding of what
    we don’t want so that we can aspire to what we do want.**


    **Each stone represents valuable learning. Everyone in history has done the best
    they could with the knowledge they had. Every person you have known has done the
    best they could do. And you have done the best you could do, too.**


    **Imagine leaving the past in the past as you walk forwards along the stepping-stone
    path. From now onwards, believe in great things and have the determination to
    grasp opportunities as they arise so that they will lead you to the life you want.
    Seeing your past and future experiences as stepping stones will allow you to let
    go of the emotions of the past and release fears about the future. The key to
    getting your life back into balance is to start feeling better in yourself so
    that you create good choices, which in turn will create a harmonious life. Imagine
    the stepping stones at any time and feel the feeling of being on a path that is
    solid both behind you, in your past, and ahead of you, in your future.**


    **It might help to read this section again and practise the technique it describes.**


    ## So how can I make my life AMAZING?


    Start by saying to yourself ‘My life is AMAZING.’ In the following chapters, you
    will read about how to shift the negative beliefs in each area in your life. Trying
    to feel good about something that has not yet happened can be difficult. One way
    of doing it is to visualize the results you want. Hypnotherapists work with clients
    to help them see the outcome of what they want. For example, a smoker imagines
    they are a non-smoker and how they will feel throughout their day without cigarettes.
    If you imagine something you want to happen has already worked out AMAZINGLY well
    and you are celebrating a good result after the event, this will make it easier
    for you to feel the AMAZING feeling more strongly. Racing drivers use these techniques
    by visualizing going repeatedly around the track before they drive around it.
    In their mind, they practise the gear changes and the braking points on each corner.


    People are often so busy rushing through life that they don’t notice the AMAZING
    things going on around them. When you are aware of a good moment, take a conscious
    ‘snapshot in my mind’ of the moment itself, how it feels and the AMAZING feeling.
    By being aware of the positive moment as it happens in the NOW, you can recall
    the memory very strongly at any time in the future. Build a memory bank of AMAZING
    ‘snapshot’ moments as they happen to strengthen your AMAZING zone.


    Having spent years improving people’s belief systems through my work as a hypnotherapist,
    I have found the word ‘AMAZING’ and the ‘AMAZING feeling’ really fast-track you
    to feeling great and living an AMAZING life. ‘AMAZING’ is a powerful word, which
    really works to make great things happen. And it is simple – just one technique
    and one thing to remember.


    *   Imagine you are working in an AMAZING job.


    *   Imagine you have returned from an AMAZING holiday.


    *   Imagine you live in an AMAZING home.'
