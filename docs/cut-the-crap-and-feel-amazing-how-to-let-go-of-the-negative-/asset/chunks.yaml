- raw: "Perfectionism is useful for certain things, for instance if you want to be\
    \ a top athlete and in some work settings. But in most other situations it can\
    \ become a burden that can wear you out and drive those around you mad. Stop micromanaging\
    \ your life and everyone else’s. Learn to let things go. If you want to live a\
    \ relaxed life, start making it relaxed by adjusting your attitude.\n\n## Learn\
    \ to relax\n\nStart living the life you want to live by taking time to rest. Listen\
    \ to the way you speak to yourself and to other people. Notice when there is unnecessary\
    \ urgency in your voice and then soften and slow your speech. It is all the small\
    \ stresses in your day that result in you feeling and being stressed.\n\nLearn\
    \ from other people how they relax. Many years ago, I stayed with friends in France\
    \ who had two young children at the time. On Saturday afternoons, the whole family\
    \ went to their bedrooms for a quiet time or to sleep. I adopted the same routine\
    \ when I was a busy working mum and didn’t feel guilty at the weekend if I needed\
    \ a rest, especially if I had a long evening ahead or if I just wanted to catch\
    \ up after a busy week.\n\nTry to flow with what your body is telling you. If\
    \ you need to rest, then rest. It is very simple. Also, repeat to yourself, ‘I\
    \ can find AMAZING ways to relax,’ and before long you will have created a good\
    \ relaxation routine that suits you. And when you are more relaxed, those around\
    \ you will be too. Soon you will be making AMAZING adjustments to the way you\
    \ do things.\n\nThese suggestions and the tips on the next page may sound like\
    \ common sense, but many people are rushing too much to remember to do them.\n\
    \n*   Change your clothes after your working day finishes.\n\n*   Have a shower\
    \ or bath after work.\n\n*   Drink camomile tea and put lavender scent in your\
    \ pillow.\n\n*   Exercise at home – yoga moves, push ups, whatever you like.\n\
    \n*   Go for a walk every day.\n\n*   Listen to your favourite music.\n\n*   Listen\
    \ to calming music.\n\n*   Speak calmly.\n\n*   Move calmly.\n\n*   Fill your\
    \ home and workplace with calming words such as love, rest, relaxation, calm,\
    \ happy home (on your desk, on cushions, as framed pictures).\n\n*   Rest more.\n\
    \n*   SMILE.\n\nLet your mind offload its stresses before you go to sleep. Many\
    \ people rush around all day at 100 miles per hour, then watch TV and go straight\
    \ to bed, with no time just to be with themselves and let their mind unwind.\n\
    \n### *Offloading your stresses technique*\n\n**Take 5-10 minutes every day to\
    \ relax your mind. Talk calmly to yourself in your head about your day tomorrow\
    \ so that you feel fully prepared: ‘I will get it done. I will have an AMAZING\
    \ day.’ Feel the positive feeling of tomorrow having gone well as you SMILE. With\
    \ your eyes closed, imagine things going well. You can move your eyes from left\
    \ to right, up and down, and rotate them in a circular motion, feeling the calm,\
    \ good feelings with your eyes in all positions. This will release tension around\
    \ your eyes and help you to believe in the changes you want to make. You may find\
    \ falling asleep to calming music will help you sleep deeply.**\n\nYou can repeat\
    \ these phrases: ‘Life is easy. Life is calm. I sleep well. I am an AMAZING sleeper.\
    \ I am fine. I am relaxed.’\n\nBefore you go to bed, write down anything you need\
    \ to do the next day so that you are not worrying about it as you go to sleep.\
    \ You can keep a pen beside your bed in case you think of something in the night.\
    \ It is better to write things down rather than worry about them.\n\n### *Daily\
    \ de-stress technique*\n\n**At intervals throughout the day, take a moment to\
    \ feel calm by being aware of your breathing. Be aware of being in your body.\
    \ Be aware of your surroundings. Be aware of colours. Be aware of how your clothes\
    \ feel against your skin. Be aware of the feel of the seat you are sitting on\
    \ or the feel of your shoes against your feet. Be aware of the sounds and smells\
    \ around you. By being aware, you will be distracted from any stresses and will\
    \ feel more in the moment and calmer.**\n\nIn the morning, be dynamic. Start the\
    \ day focused and with positive self-talk in your mind, rather than with a relaxation\
    \ meditation. I suggest if you wish to meditate, do it after your work has finished\
    \ so that you can relax and offload your stress. But find what works for you.\n\
    \nWhen you think you can’t keep going, remind yourself that you can and, by making\
    \ lots of small changes in the way you do things and the way you feel, you will\
    \ find a way.\n\n**Cut the stress from your life and feel AMAZING.**\n\n* * *\n\
    \n#### Chapter summary\n\n*   Choose to live your life calmly.\n\n*   Make a list\
    \ of ways in which you can improve your week.\n\n*   Create a daily relaxation\
    \ routine.\n\n*   Allow your mind to offload your day before you go to sleep.\n\
    \n*   Keep a pen beside your bed and write down things that you need to do tomorrow.\n\
    \n*   Enjoy just being in your body.\n\n**STEP 1. Identify stress.**\n\n**STEP\
    \ 2. Eliminate stress.**\n\n**STEP 3. Learn to relax.**\n\n* * *\n\n*Protect your\
    \ health, work with the body  \n\nyou have and find solutions that will  \n\n\
    enable you to be as well as you can be.*\n\n[![CHAPTER 12: HEALTH](Images/ch12.jpg)](../Text/contents.xhtml#toc12)\n\
    \nYour body is part of nature, a complex ecosystem within itself. In fact, we\
    \ will all dissolve back into the ground eventually, one way or another. Like\
    \ nature, your body is constantly evolving and responding to the environment around\
    \ it and to what you put into it. If you bombard your body with harsh chemicals,\
    \ excess alcohol, poor nutrition and stress, it will have to work even harder\
    \ to protect and repair itself.\n\nMost people take their body for granted until\
    \ some part of it fails. That failure can be difficult to accept. Your body and\
    \ the way it works – or doesn’t work – are partly the product of your genetic\
    \ make-up and partly due to the things you do with it and for it, such as whether\
    \ you minimize stress and look after yourself as best you can.\n\nAccept where\
    \ your health is right NOW. Whether you are well or not, accept it and say to\
    \ yourself, ‘This is where I am right now.’ From now onwards, through a series\
    \ of new choices and decisions, you can do your best to improve and protect your\
    \ health. To be able to live any kind of life, you need your body. So taking charge\
    \ of your wellbeing is a priority.\n\nEveryone will know someone who has been\
    \ affected by a health issue at some time or another, or you may be going through\
    \ health problems yourself right now. Try to feel that things will work out AMAZINGLY\
    \ well. Create a sense of inner warmth, of things being fine no matter what is\
    \ going on. SMILE as you focus on finding solutions. There isn’t one magic answer,\
    \ but there is a series of things you can do that will all contribute to getting\
    \ better. I call it the percentage rule: one thing may help 10%, another 5%, another\
    \ 20%, and before you know it, you will be almost 50% better. You need to put\
    \ into your body and into your life everything that could help you get better\
    \ and eliminate everything that may be causing your ill-health.\n\n**Remove from\
    \ your life:**\n\n*   Stress (which is a health hazard)\n\n*   Bad food\n\n* \
    \  Alcohol\n\n*   Cigarettes\n\n*   Late nights\n\n*   Worries/anxiety\n\n*  \
    \ Poor sleep\n\n*   Toxic relationships\n\n**Add into your life:**\n\n*   Looking\
    \ after yourself\n\n*   Healthy nutrition and drinks\n\n*   Pamper evenings/spa\
    \ days\n\n*   Exercise/sport\n\n*   Relaxing music\n\n*   Things that make you\
    \ laugh\n\n*   Rest\n\n*   Good-quality sleep\n\n*   Positive visualization of\
    \ you being well\n\n*   Positive language: ‘I am as healthy as I can be,’ and\
    \ ‘It is working out AMAZINGLY well.’\n\n## Health anxiety\n\nTo get over any\
    \ health anxieties, use the clouds-in-the-sky technique. Rub or press your left\
    \ knuckles using the fingers of your right hand and imagine the stress or worry\
    \ passing like clouds in the sky. Also visualize a red triangle in your mind,\
    \ put the fears into it and shrink it down."
