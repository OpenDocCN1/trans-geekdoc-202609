    Think of dating as being like doing a property search. It is rare to buy or rent
    the first property you see. Most people have a good look around and view quite
    a few properties before deciding on the one that suits them best. Sometimes, people
    think they’ve found the right property and then the sale falls through and they
    are disappointed. But they always find a better one in the end. Enjoy the ‘property
    search’, but be ready to commit when the right one comes along. Enjoy dating and
    getting closer to your goal. You will find the right person for you. In the meantime,
    enjoy your single life while it lasts, knowing that love is on the way!


    ## Single and looking for love – ‘finding a comfy pair of shoes’


    Another analogy I use is that a good relationship is a bit like a comfy pair of
    shoes that fit well and feel right, whereas a bad relationship is like shoes that
    aren’t really comfy but you want them so much you buy them anyway. From the moment
    you buy the ill-fitting shoes, they cause you trouble. They give you blisters
    and swollen, sore feet, but you persevere because you invested so much in getting
    them that you can’t just abandon them and let them go. Sometimes, you buy a pair
    of shoes that you are not entirely sure about but that end up being your favourite
    pair because they go with everything you ever want to wear.


    Try to think of finding a partner as being like getting a good pair of shoes.
    Be honest with yourself and give the relationship time to see if it works out.
    But be prepared to let it go if it’s really not comfortable and not the right
    thing for you.


    ## Finding a great partner


    If you want love right now, speak positively and make it happen. Be confident
    in yourself. SMILE and say to yourself, ‘I am AMAZING. Of course someone is going
    to love me. I can have a great partner.’ Tackle it as you would any other part
    of your life. Do what you need to do to make it happen. Go to places, join classes,
    be interesting, have a full life.


    Think of things in your life that have worked out well and feel the same feeling
    as you think about having a partner. Start believing in a great relationship happening
    for you. Get yourself in the most positive place. When you are happy and contented,
    you will meet someone who you feel happy and contented with. Don’t focus on preconceived
    expectations of who you want to be with. Instead, focus on the feeling of being
    with someone who is easy to get along with and compatible in each area of your
    life. Focus on love, happiness and having an AMAZING relationship.


    *   Marry and have children with someone who is a reasonable and decent person.

    *   A good relationship is all about getting the right balance and working well
    together.


    ### Growing-old-happily-together technique


    Imagine you and your wonderful (new) partner have grown old together. Imagine
    looking back over your life at all the things you have shared together, such as
    holidays, children, grandchildren or whatever you would like to have happened.
    Repeat this technique regularly. When you see other happy couples, SMILE and say,
    ‘It’s AMAZING. I have a lovely partner too.’


    Self-talk yourself into the positive by saying, ‘I am AMAZING. I am a great partner
    to be with. I love my AMAZING partner. I married well. It has all worked out AMAZINGLY
    well.’


    Cut the waiting around for someone and make it happen AMAZINGLY.


    ### Chapter summary


    *   Be whole and balanced so that you meet someone who is whole and balanced too.

    *   Use the shelve-it technique: if you can’t make a decision, put the problem
    on a shelf in your mind.

    *   Give relationships a chance by getting to know people.

    *   Teach each other to know what you both like.

    *   Think of dating as doing a property search. You will find the right one in
    the end if you are open to what is realistic for you.

    *   Find a partner who is like a comfy pair of shoes that fit really well.

    *   Don’t speak negatively about a date to friends. Focus on the positives.


    **STEP 1. Understand the past was part of your learning.**

    **STEP 2. Make your life interesting.**

    **STEP 3. Be open to a different type of relationship.**


    *Take the good from your own childhood and then do a better job than your parents
    did.*


    [![CHAPTER 16: PARENTING](Images/ch16.jpg)](../Text/contents.xhtml#toc16)


    ## You are guiding your children by teaching them how the world works


    Your parents, or whoever brought you up in their place, were the biggest influence
    on you and you are the biggest influence on your children. Good parenting is about
    balance. Take the good things from your own childhood, mix them with common sense
    and do a better job than your parents did.


    It is common to overcompensate for a miserable childhood by swinging to the other
    end of the scale. For instance, the person whose parents were not interested in
    them may pay too much attention to their own children, causing them to feel trapped.
    Or perhaps your parents micro-managed your childhood, which annoyed you and made
    you too laid-back with your own children. If this did happen to you, you may not
    set boundaries and address behavioural issues because you want your children to
    feel free. But freedom needs to be balanced with structure and routine, which
    children enjoy too.


    Rather than focusing on what your parents got wrong, I suggest that you look at
    the things they did right, as every parent does the best they can with the knowledge
    they have at the time. Even if you were not brought up by your own parents, maybe
    they did the best they could in the circumstances and with their abilities. Maybe
    it was better for you not to be with them. Or maybe what was done for you was
    the best that could be done by the people who had to make the decisions. Whatever
    your upbringing was like, it will have involved at least some things that made
    you a better person.


    Remember some of the things your parents or carers got right, such as reading
    you stories, cooking for you, taking you swimming, teaching you to drive or cook,
    going on holiday, working to pay for things, giving you a home, or loving you
    in their own way. The next time a negative thought about them slips into your
    mind, switch your thoughts to something good that came out of your childhood.


    Your job as a parent is to explain to your children why we do things, what the
    rules are and why we need to stick to them, so that they understand how the world
    works. If children are told to sit still and be quiet but they don’t understand
    why, they will not learn to look for the reasoning in everything or to work things
    out for themselves. Always give a reason and an explanation when you ask your
    children to do something.


    ## Rules need to make sense


    I was out with a friend and her child one day. It was raining and we had just
    got off a boat on a river. It was a pretty miserable day and the child kept asking,
    ‘Can I have an ice cream now?’ Every time she asked, the mother said ‘No.’ After
    a while, the mother turned to me and asked, ‘Can you do something, Ailsa?’


    ‘We can’t have ice cream because it’s raining and it would be too cold to stand
    outside in the rain while we ate it,’ I told the child. ‘Let’s go to a café instead,
    where it will be warm and dry.’ The child said ‘Okay’ because it now made sense
    to her, and the mother then realized that explaining things to the child was better
    than simply saying ‘No.’


    ‘It’s your job to explain everything to your child,’ I told the mother. ‘You are
    her teacher. She needs you to tell her how the world works.’


    ‘I never really saw it that way,’ the mother said. ‘I just thought she was pestering
    me constantly, always going on about things.’

