- raw: "I had a client who hobbled into my clinic one day and was barely able to sit\
    \ down. He had a bad back, arthritis and was drinking too much alcohol. ‘I am\
    \ old and I just have to accept it,’ he told me. In fact, he was hypnotizing himself\
    \ with doom and gloom and I knew that, once he changed his state of mind, he would\
    \ feel better.\n\nI used hypnotherapy to relax him, make him feel fitter and allow\
    \ his mind to be solution-focused. On the day of a follow-up appointment, I looked\
    \ out of the clinic window and saw him skipping along with a spring in his step.\
    \ When he bounced into the room, he said that he had started using therapeutic\
    \ magnets to improve the symptoms of the arthritis, had reduced his drinking and\
    \ was feeling much better. He had a positive frame of mind and was like a man\
    \ 20 years younger.\n\n**There are two important factors related to ill-health:\
    \ one is the physical illness itself and the other is the need to deal with the\
    \ stress and the impact it has on your life.**\n\nHypnotherapy recordings are\
    \ an excellent tool to help you release the stress and counterbalance the negative\
    \ effects of health issues. Hypnotherapy is also useful in helping to prevent\
    \ stress-related health issues. You can’t control everything, but you can embrace\
    \ things that may help.\n\nBe open to making lots of small changes that will help\
    \ you manage your health issues, get better and stay well. Remember, 1% better,\
    \ then 10% better and before you know it you will be 50% better. You can use the\
    \ percentage rule in other areas of your life too, to help you to find solutions\
    \ and reach your goals.\n\nThe Internet is full of health information which, used\
    \ sensibly in conjunction with a **supportive doctor**, can provide you with answers\
    \ to your health-related questions in a way that would have been impossible just\
    \ a decade ago. Look for solutions to improve your health.\n\n## Help other people\
    \ who are ill\n\nBe supportive and kind to people who are ill. Encourage them\
    \ to find solutions. Remind them, ‘It will work out AMAZINGLY well,’ and ‘Good\
    \ things can come from any situation.’ Remember that when someone is ill or in\
    \ pain, it can be hard to be positive. Be patient with them – and with yourself\
    \ if you are the person who is unwell. Although most people will be open to help,\
    \ not everyone will want to take on board the suggestions you may make. Sometimes,\
    \ people just want to do things their own way, which is something that needs to\
    \ be respected.\n\nIf an illness is taking over your life, imagine putting it\
    \ into a red triangle in your mind and shrinking it down to make it smaller. Visualize\
    \ yourself doing the hobbies you love or would like to do. Believe that there\
    \ is a way back to good health and financial independence. When you believe there\
    \ is a way through your health issue, you will find a better way to move forwards\
    \ to the best health you can have. Imagine a wiggly string leading you to the\
    \ answers you need.\n\nPeople may judge you as a hypochondriac, but don’t take\
    \ it personally: they probably haven’t ever been ill, except for having a cold\
    \ or flu, and they don’t really understand what you are going through. But there\
    \ are other people going through the same experience somewhere in the world. So\
    \ don’t feel alone. Turn the situation into something positive so that one day\
    \ you will be able to share your knowledge to help someone else. (You might share\
    \ your story, share information online, or just have a conversation with someone\
    \ that helps them.)\n\n### *Music control-settings technique*\n\n**Imagine your\
    \ mind and your life being like a music technician’s control panel in a recording\
    \ studio, with sliding buttons and switches that flick on and off. Imagine all\
    \ those different control settings now, as you think about your health or the\
    \ health of a family member or friend. Go to the health part of the control panel\
    \ and slide the settings up and down as you imagine things working out in the\
    \ best way. Move the sliders as you feel good about positive changes taking place.\
    \ Adjust the settings as you feel good about your life becoming harmonious.**\n\
    \n**As the settings adjust, glide the slider buttons in different ways and switch\
    \ off some of them if you want. Just do what feels right in your own creative\
    \ way. Small adjustments create new choices and decisions. By tweaking the settings\
    \ slightly here and there, you will tweak your attitude towards health and find\
    \ solutions. It’s like having a massage in your mind and a massage in your life\
    \ to make you feel better. Close your eyes if you want to.**\n\n*   You are an\
    \ individual, so find the best solutions for YOU to live the longest, happiest\
    \ life possible.\n\n## Take responsibility\n\nThe UK has a wonderful free National\
    \ Health Service for everyone. It’s AMAZING, but it does make people more reliant\
    \ on solutions being provided for them rather than looking for those solutions\
    \ themselves. If something is not offered on the NHS, be prepared to invest time\
    \ and money in getting better. Living a healthy, happy lifestyle is the best place\
    \ to start taking responsibility.\n\n## Listen to your body\n\nBe realistic with\
    \ your health limitations. For example, don’t fly halfway around the world if\
    \ it is going to compromise your health. Instead, do something more local. When\
    \ you are not well, you have to learn to accept the fact that your plans may have\
    \ to change. If people around you cause you stress, listen to your body. Depending\
    \ on how it is reacting to certain situations and people, you may need to change\
    \ your interaction with them or avoid them. Show respect for your body in the\
    \ way you live your life. Do a job that suits your body and keeps you as well\
    \ as you can be. You may need to adjust your career to suit your health.\n\n##\
    \ Think positively\n\nFocus on things you want to happen. SMILE and feel AMAZING.\
    \ Imagine you are fit and well, running or playing tennis and, above all, that\
    \ you are happy in your life: ‘My health is AMAZING. My body is AMAZING.’\n\n\
    Value your life and the lives of other people. Don’t wait for people to get ill\
    \ before you appreciate them.\n\n**Cut the health hazards from your life and feel\
    \ AMAZING.**\n\n* * *\n\n#### Chapter summary\n\n*   Have colourful napkins every\
    \ day to remind you to enjoy the moment.\n\n*   Use the wave technique: flow with\
    \ your health like the waves flow in and out from the shore.\n\n*   Remember the\
    \ percentage rule: all the small things that help will add up to you getting better.\n\
    \n*   Keep focused to get the correct diagnosis and treatments.\n\n*   Use the\
    \ music control-settings technique: adjust the settings so you feel good about\
    \ your health becoming harmonious.\n\n*   Make yourself as calm and comfortable\
    \ as you can be to help your health.\n\n*   Adjust your lifestyle to support good\
    \ health.\n\n**STEP 1. Look after yourself.**\n\n**STEP 2. Say ‘AMAZING health’.**\n\
    \n**STEP 3. Be as well as you can be.**\n\n* * *\n\n*Identify the stresses and\
    \ emotions  \n\nthat fuel your addictions. Then deal  \n\nwith them and set yourself\
    \ free.*\n\n[![CHAPTER 13: ADDICTIONS AND OBSESSIONS](Images/ch13.jpg)](../Text/contents.xhtml#toc13)\n\
    \n## Taking back control\n\nYou or someone you know may be affected by addictive\
    \ behaviour. In this chapter I give tips and advice on the following topics:\n\
    \n| AlcoholAnti-ageingBody imageDrugsFoodGamblingGamingGossip || PornographyShoppingSmokingStress\
    \ and anxietyTechnology, social media and phonesTheftWork |\n\n| --- | --- |\n\
    \nAnything we spend a lot of time doing will eventually become part of who we\
    \ are. Once we’ve become that person, we will have to spend time reprogramming\
    \ ourselves to learn different behaviour in order to break the bad habit. It is\
    \ YOU and only you who can make the change, either alone or with support."
