- raw: 'If you live with a drug user, they might love drugs more than they love life
    itself. Imagine things working out AMAZINGLY well whether you remain with them
    or not. Work on yourself by listening to confidence-boosting hypnotherapy recordings,
    which will help break any negative habits that have built up between you and your
    partner, so that you can stand up for yourself.


    ### *Release drugs technique*


    **Clasp your hands together and squeeze them tightly. Feel the strength you have.
    Imagine your body working well, your body clean and safe, your mind balanced.
    Now think of the most boring thing you can think of. It may be being bored in
    a lesson as a teenager, school homework, a long flight, listening to a dull speech,
    or whatever feels boring for you. Hold the thought in your mind and imagine it
    being 10 times more boring as you squeeze your hands together. Focus on the boring
    feeling. Now switch your thoughts to drugs and imagine they are boring, really
    boring. When you think about drugs you automatically feel bored by them. They
    are pointless and boring. After a moment, unclasp your hands. As you do so, you
    will feel that drugs are for other people and that you are ready to leave them
    behind. Release and relax your hands.**


    ## Food


    The shops are filled with foods you don’t need. To be slim, you need to eat regularly,
    small portions of wholesome foods with the occasional treat, and exercise regularly.
    There is nothing else to it. You may feel that you don’t like being on a diet,
    but a well-balanced diet is normal eating for slim people. There is no miracle
    cure, no magic pill or fad diet. You just need to learn to manage your eating.
    Find out what works best for you and stick to it. Accept the fact that to be slim
    you need to eat what your body requires, do the right amount of exercise and sleep
    well.


    Whenever possible, eat fresh, home-cooked foods. Start by learning to cook one
    healthy recipe. Once you have mastered it, learn to make another recipe and then
    another, until you know so many recipes that the only food you cook is healthy
    food.


    Hypnotherapy recordings used regularly will help to keep you in a positive frame
    of mind and keep cravings at bay. Say to yourself repeatedly, ‘I can eat healthily.
    I can exercise and I am doing it. I am slim, fit and healthy.’ Do not say, ‘I
    am so fat.’ Visualize yourself slim, fit and healthy. If you can’t imagine that,
    stick a picture of your head on the photo of a slim body and put it in a photo
    frame somewhere you will see it regularly.


    ### *Photo food diary*


    **Make a photo food diary by photographing everything you eat and drink so that
    you can really see what you are consuming. Maybe share the pictures with a supportive
    friend so that you have to face up to what you are eating.**


    Be the slimmest you can be. Do everything you can to make the best of you and
    your body. Dress in clothes that suit your body shape. SMILE, encourage and accept
    yourself.


    ## Gambling


    Your biggest assets are yourself and the money you generate each month. Let go
    of wasting time and money by gambling as you chase a financial dream. Instead,
    take control of your destiny by improving who you are and how much you can earn
    to provide for yourself and your family today and in the future. Start spending
    less and save all the money you would have spent on gambling in a special savings
    account. Use your time better: spend time retraining, analyse and adjust your
    finances to make savings, and increase your income. Invest time in finding out
    how you can invest your money safely.


    Hypnotherapy will help you to let go of gambling habits, increase your wealth
    and create a better relationship with money.


    ### *Photo gambling-money diary*


    **Take a photo of all the money you spend on gambling – cash, receipts, online
    transactions – so that you really see how your habit is affecting your finances.
    You may be shocked by how much you spend. Think about how you could use that money
    to invest for your future. Share the pictures with a supportive friend so that
    you have to face up to what you are doing.**


    ## Gaming


    Gaming is a form of hypnosis: your mind is totally open and focused on the information
    you are receiving – by watching, in the case of gaming. Be aware of this, as the
    images and actions of the game are planting an impression in your mind that will
    eventually become part of your thinking. Gaming negative material could make you
    more aggressive and negative.


    During one Christmas holiday break, I played a farm-game app to find out what
    it was like to be absorbed in a game. As well as finding it addictive, I dreamt
    about it and woke up in the morning with images and the music from the game playing
    in my head. I had been hypnotized within just three weeks.


    The farm game was pretty positive, but a war game, for example, could be quite
    damaging. I chose to stop after completing the challenge, as I know how powerful
    hypnosis can be. Frankly, I would rather be doing something more positive and
    life-enhancing than looking at virtual chickens being fed. In fact, I wouldn’t
    have written this book this year if I had continued to play the farm game.


    A friend told me that she was called in for a meeting at the school her son attended,
    where all the parents of boy pupils were told that the boys were coming into school
    tired and unable to focus on their work because they were gaming, and that they
    were now lagging behind the girls. So gaming really is having an effect, which
    should not be taken lightly.


    As well as kids gaming, some parents are doing it, too, instead of interacting
    with their kids, which means that there is very little conversation taking place
    in some households. Gaming just before going to bed is also a bad thing, as you
    will end up going to bed late and your sleep patterns will be disturbed because,
    instead of helping you to unwind, it will make you more alert. Find healthier
    ways to relax or limit the time you spend gaming. In my opinion, people who game
    are wasting time they could be using to build a great life and a financially secure
    future. Don’t let your life pass you by.


    SMILE and think of better ways to use your time. Hypnotherapy is a great tool
    to help reprogram you into having healthier habits again.


    ## Gossip


    Every word you speak shapes your life. If you spend hours talking about other
    people’s problems or buying into negative dramas, your life will become a soap
    opera. Focus on your own problems and sort them out instead of talking about other
    people’s. If you gossip, your life will become stuck in a negative pattern. If
    you are pleased for other people and share good news about them, your own life
    will flourish and get better.


    Be kind and supportive to other people. Every day, say something positive about
    someone else. SMILE as you think about the good in other people.


    ### *Bad news junkie*


    Watch your words. Are you the one who shares the bad news? Do you like bad news
    about other people because it makes you feel better about yourself? Do you love
    a good doom- and-gloom story to top up your rage about the bad news in the world?
    Try to notice when you are saying something negative and switch your conversation
    to positive stories.


    Every day, tell someone some good news.


    ## Pornography


    Sexual images are everywhere in daily life, in magazines, on the television and
    in music videos. As a result, they become normalized in our subconscious minds
    because we are programmed by our surroundings. Watching pornography online has
    also become acceptable for many people, particularly because it is so easily accessible.
    But this impacts on our relationships.'
