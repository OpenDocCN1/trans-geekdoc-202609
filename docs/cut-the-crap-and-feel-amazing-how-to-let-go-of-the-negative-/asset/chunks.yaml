  trans: '


    许多人曾在电视上关注过 Jade 的故事并目睹她在医院接受治疗，许多人觉得自己很了解她。在她去世后，涌入了许多因她的去世而深受痛苦的客户，我告诉他们：“凡事总有好的一面。是的，对
    Jade 和她的家人来说这是悲剧性的。但爱她的人应该为她感到自豪，因为她足够勇敢分享了自己的故事，并将拯救许多其他生命。事实上，在 Jade 去世后，有数百位从未关注过宫颈筛查的女性走出来接受检查。从长远来看，
    Jade 将继续帮助其他女性，她们现在能够活到孩子长大。如果你从大局来看，你会发现即使当我们无法控制某些事情时，万物中依然存在积极。”


    ### 拥抱乐观


    尝试成为一个乐观主义者，这样你就能对周围发生事件的反应做出更好的选择和决定。例如，如果有人失去了工作，尝试寻找积极的一面，并假设他们会找到更好的工作。如果你度过了一个糟糕的周末（可能是因为宿醉或深夜饮酒太累），你可以计划一个没有酒精的周末，去水疗中心、航海、玩卡丁，甚至租一辆保时捷去兜风。做什么并不重要，如何度过时间是你的选择。但不要重复旧的行为，不要做那些让你消沉的事。这听起来显而易见，但对于那些陷入生活惯性的人来说往往并非如此。


    *   不要做同样的事情却期待不同的结果。

    *   相反，做不同的事情，获得不同的结果。

    *   更好的是，做惊人的事情，获得惊人的结果。


    ### 管理压力与压力


    如果孩子让你精疲力竭，请计划一些闲暇活动，例如家庭影院，关上窗帘，准备一桶爆米花（最好是他们和你一起制作的）。或者让他们帮助你制作和打包野餐，然后去公园让他们跑跑跳跳自娱，而你则放松。


    如果你感到疲惫或压力大，请选择一个放松的周末。提前计划并做出能改善你周末的有意识选择和决定。开始掌控你所有的选择和决定。问问自己你可以做些什么不同的。


    *   你不需要成为孩子的奴隶。

    *   你不需要成为这一天的奴隶。

    *   你不需要成为工作的奴隶。

    *   你不需要成为伴侣、家人或朋友的奴隶。


    ### 小改变的力量


    我的一位客户周中住在家外，住一家廉价且并不怎么样的酒店里。他有些抑郁，所以每晚都喝酒来排忧愁。我问他：“你为什么要顶着交通拥堵回到空荡荡的酒店房间？为什么不在下班后去某个地方坐坐，喝杯咖啡看看报纸，甚至吃一顿便宜的晚餐呢？当其他人都在交通流中挣扎时，你可以放松并享受你的夜晚。这样当你回到酒店时，你就不会需要喝酒了。你可以洗个澡或冲个热水，然后在电视上看点有趣的内容。”几周后，他带着这些改变回来，告诉我他的生活变得非常不同，感觉好多了。所以，小改变真的可以让你的一周享受程度产生巨大差异。


    ### 使用直觉和创造力


    利用你的直觉做出良好的选择和决定，并发挥创意。有时，恐惧会产生阻碍。所以要识别：是害怕离开舒适区的恐惧阻止了你做某事，还是确实存在你需要避开的真实风险。如果你无法对某事做出决定，可能今天不是决定的时机。这没关系——只需把这个问题放在脑海的架子上，改天再回。当你回来处理时，你可能拥有更多信息，让你做出正确的选择。


    ### 评估转型


    有时，人们想辞职去做些别的事，但他们所做的可能只是重新创造同样的问题。识别你想要改变的原因，以及你可以做得更好的地方。在换工作之前，问自己以下问题，这将将帮助你做出正确的选择。


    *   我拥有哪些技能？

    *   我在学习已知知识上投入了多少时间？

    *   我如何在其他地方应用这些技能？

    *   继续做现在的事对我有什么好处？

    *   到目前为止我成就了什么？

    *   如果不换工作，我该如何更好地享受每一天，或让自己感觉好些？


    ### 职场健康


    在生活中照顾好自己会帮助你在工作时少一点累，并更喜欢你的工作。如果你享受通勤的过程、休息午餐时间、吃营养丰富的食物并在整天多次喝水，你会感到没那么累。


    你可以做很多事情来改善你的工作以及你对工作的感觉。你甚至可以开始在目前公司寻找晋升或其他职位。或者，你可能觉得是时候进行职业转型了，你可以从容地开始计划和准备。


    我的很多客户后来都爱上了他们以前讨厌的工作，因为需要改变的不是工作，而是他们的态度和生活方式。他们中的一些后来确实换了工作，但这种转型比可能的情况更积极、更顺畅，因为他们对自己的感觉更好。


    ### 向前迈


    当你越来越享受每天的每个部分，感到非常棒，并知道如果改变是答案，你就会向着正确的方向移动。你最大的资产是你自己，你的特质以及你拥有的技能。所以不要把一切扔进垃圾桶然后被迫重新开始。在你已取得成就的基础上继续。通过做出更好的选择和决定，你将引导生活走向正确的方向。每当你面前有一堵墙时，记得做出新的选择和决定，以便你绕过它。


    '
