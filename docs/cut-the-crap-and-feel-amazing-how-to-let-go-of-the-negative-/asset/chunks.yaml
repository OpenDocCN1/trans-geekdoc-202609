    *Cut the Crap and Feel AMAZING* is the first book I have written and there were
    a few moments, particularly when I started writing it, when self-doubt crept in.
    So I wrote this ‘I can do it’ motivation chapter first, then used the techniques
    I was describing to motivate myself. I also thought about all the hypnotherapy
    scripts I have written for my recordings and all the knowledge I have gained over
    the last few years, then self-talked myself into believing I could do it. Ten
    weeks later, I had written the whole book, and a few weeks after that, it was
    ready for printing.


    Do something right NOW on your list of ‘things to do’ with this ‘I can’ attitude.
    Trust me: it will be AMAZING. I would love to see photographs of what you have
    achieved with your ‘I can do it’ attitude. So, please do send them to my Ailsa
    Frank blog, Twitter `@AilsaFrank` or Instagram `ailsafrank`.


    `Cut the self-doubt from your life and feel AMAZING.`


    ***


    ### Chapter summary


    *   ‘I can do it. I am doing it. It is done.’

    *   Don’t just see things as being either black or white. Remember that the grey
    area has all the solutions. There are many ways of doing things or resolving things.
    So look for answers.

    *   Give things a try. You don’t need to be 100% ready – 90% is good enough.

    *   Use the teacher technique: tell yourself you will do it and listen to yourself
    as you would listen to a teacher.

    *   Use the feeling satisfied technique: feel the feeling of being satisfied and
    relieved that the things you want to achieve are already done before you begin
    them.

    *   Each stage of your life is a phase. Enjoy every phase by relaxing into everyday
    life.

    *   Use the kick boxer technique: stand up and do the actions of a kick boxer
    as you speak out loud what you want to achieve. Say, ‘I can do it. I am doing
    it. It is done.’

    *   ![image](Images/img1.jpg)Present yourself well. Dress appropriately. Exude
    a confident posture.

    *   When good things happen, make a ‘snapshot in your mind’ and bank it in your
    AMAZING zone.

    *   Start with one task. Pick the easiest thing to do to get you started and before
    you know it you’ll have finished what you needed to get done.

    *   Use the inner coach technique: imagine you are an expert in what you are trying
    to achieve, then self-talk yourself to be successful. What would a coach say to
    encourage you?


    **STEP 1. Set a goal.**


    **STEP 2. Think AMAZING.**


    **STEP 3. Make it happen.**


    ***


    *In this age of information sharing, everyone can access the knowledge they need
    to become successful if they look for the answers.*


    [![CHAPTER 6: MONEY AND WEALTH](Images/ch06.jpg)](../Text/contents.xhtml#toc6)


    This is one of the most important chapters in the book because money is at the
    root of your life. Every choice and decision you make revolves around how much
    money you have, which affects everything from what you can buy in the supermarket
    to where you are able to live. In my experience, many people say, ‘I don’t need
    more money,’ or ‘I haven’t got a problem with money,’ and then go on to tell me
    a hundred and one problems that are, in fact, all related to money.


    It is not just how much money you have that’s important. What also matters is
    how you feel about the money you have. Many people don’t realize they are wealthy
    until they lose their wealth or become financially worse off. So, today, begin
    to feel contented with what you already have and start building on this.


    *   **Anyone can become rich or poor.**

    *   **A lower-income steady saver can end up wealthier than a high-flying risk-taker.**


    There are people from the poorest and the richest backgrounds who become successful
    and who experience being stressed or frustrated about money. So let go of the
    past and try to stop comparing yourself to other people, worrying about where
    you came from or what you did or didn’t have. It really is your choice whether
    you are inspired or disheartened about your ability to create a secure financial
    life. Start to feel good about money from now onwards.


    By letting go of the negative beliefs and using the AMAZING and SMILE techniques
    combined with good choices and decisions, you can begin to carve out the financial
    life you want. Start to love your finances. Feel great about money. When you feel
    positive about money, you will make better money decisions. If you are frustrated
    by money, money will frustrate you. But if you love your finances, you will become
    someone who has finances to love.


    Anyone can shop in any of the different types of supermarkets. Some people shop
    more in the expensive ones, while others shop in the cheaper ones. It doesn’t
    matter how rich or poor you are, by making clever decisions and choices you can
    shop in all of them on your budget. Buy a small treat in a more expensive shop,
    even if you can only afford to do it once a year, and buy everyday things in the
    more budget-conscious shops. You don’t need to wait until you can afford to do
    all your shopping all the time in the expensive supermarket. By realizing that
    you can afford to have the experience of wealth as long as you stick to your budget
    and balance your spending, you can feel well off immediately.


    You can apply the supermarket concept to every aspect of your life and feel wealthy
    straight away, rather than waiting to be wealthy. If you can’t afford your own
    jet right now, you might be able to save up enough money to have one flying lesson!
    Start being creative about how you can begin to live the life you would ideally
    have. But always stick to your budget. When you believe your desires are possible,
    they begin to become reality. Someone may even invite you to go on their jet,
    so don’t assume you have to own a jet to go on one.


    *   **Budgeting = you spend less money than you receive so that you can save too.**


    The important thing is to accept what you have now – ‘This is where I am’ – and
    feel good about it. SMILE and laugh as if your finances are AMAZING. If they are
    not AMAZING right now, you will start to laugh about them rather than feeling
    stressed by them. If your finances are already AMAZING but you want to improve
    them further, these suggestions will also help you.


    From now onwards, feel good about money. Make the most of your choices and decisions
    to use your money wisely and earn income in the best way you can. Unexpected amounts
    of money may come to you, but you need to be practical and get that better-paid
    job too. There is no point saying an affirmation such as, ‘Unexpected huge sums
    of money come to me regularly,’ 300 times a day. It is limiting to fill your head
    with one thought so many times a day. Instead, have a practical, positive general
    self-talk about whatever is most relevant to you.


    *   ‘I have an AMAZING job that I love and that suits me.’

    *   ‘I have AMAZING money in my life.’

    *   ‘I have finances that make me SMILE.’

    *   ‘I have spare money to invest.’

    *   ‘I have plenty of money in the bank.’

    *   ‘I am clever with my money.’

    *   ‘I have financial security.’

    *   ‘I earn plenty of money.’

    *   ‘I am good at earning money.’

    *   ‘I pay my bills easily.’


    Keep your thoughts positive and varied, like a radio station playing in your head.
    If you hear negative thoughts creeping in, remember to tune back in to the positive
    radio station again.

    '
  trans: '

    但他他说再次尝试时有点害怕，因为这种技术太强大了，我们俩都笑了。不过，值得注意的是，对于对自己要求要做什么，保持谨慎总是个好主意。


    《别废话，感觉极了》（*Cut the Crap and Feel AMAZING*是我写的第一本书，在过程中有几个时刻，特别是在开始写的时候，自我怀疑会悄悄袭来。所以我先写了那个关于“我可以行”的激励章节，然后用我正在描述的技巧来激励自己。我还想了以前为录音编写的所有催眠治疗脚本，以及过去几年获得的所有知识，然后通过自言自语说自己相信我可以做到。十周后，我写完了整本书，在那之后的几周后，它就准备好印刷了。


    带着这种“我可以行”的态度，**现在**就去你的“待办清单”上做某件事吧。相信我：这将会是**极棒的**。我很想看到你凭借“我可以行”的态度所取得的成就。所以，请将它们发送到我的
    Ailsa Frank 博客、Twitter `@AilsaFrank` 或 Instagram `ailsafrank`。


    `从生活中消除自我怀疑，感觉极了。`


    ***


    ### 章节总结


    *   “我可以行。我正在做。已经完成了。”

    *   不要只把事情看作非黑即白。记住，灰色地带包含了所有的解决方案。处理或解决问题有许多方法。所以要去寻找答案。

    *   尝试一下。你不需要准备好 100% —— 90% 就足够了。

    *   使用老师技巧：告诉你自己你会去做，并像听老师说话一样听你自己的话。

    *   使用满足感技巧：在开始之前，感受你想要实现的目标已经完成的满足和释负感。

    *   人生的每个阶段都是一个时期。通过投入日常生活来享受每一个阶段。

    *   使用踢拳手技巧：站起来，在大声说出你想实现的目标的同时做出踢拳手的动作。说：“我可以行。我正在做。已经完成了。”

    *   ![image](img/img1.jpg)展现良好的形象。穿着得体。展现出自信的姿态。

    *   当好事发生时，在脑海中拍一张“快照”，并将其存入你的“极佳区域”（AMAZING zone）。

    *   从一项任务开始。选择最容易的一件事开始，在你还没反应过来时，你就已经完成了需要的工作。

    *   使用内在教练技巧：想象你是你正在尝试实现的目标领域的专家，然后通过自言自语让自己成功。教练会说什么来鼓励你？


    **第 1 步。设定目标。**


    **第 2 步。思考极佳。**


    **第 3 步。让它发生。**


    ***


    *在这个信息共享时代，只要寻找答案，每个人都能获得成功所需的知识。*


    ![第 6 章：金与财富](img/contents.xhtml#toc6)


    这是书中最重要的章节之一，因为金钱是你生活的根源。你做出的每一个选择和决定都围绕着你有多少钱展开，这影响了从你在超市里能买什么到你能住在哪里的一切方面。根据我的经验，许多人说：“我不需要更多钱，”或“我在金钱上没有问题，”然后继续向我讲述百零一个实际上都与金钱有关的问题。


    重要的不仅仅是你有多少钱。重要的是你对所拥金钱的感觉。许多人在失去财富或财务状况变糟之前并没有意识到自己是富有的。所以，从今天开始，对已有的感到满意，并在此基础上建立。


    *   **任何人都可以富有或贫穷。**

    *   **一个低收入的稳定储蓄者最终可能比一个高风险的冒险者更富有。**


    有来自最贫穷和最富有背景的人都取得了成功，并经历过对金钱的压力或挫败感。所以请放下过去，尝试停止与他人比较，不要担心你来自哪里，或者你拥有或没有拥有什么。对于创造安全财务能力，你是深受启发还是沮丧，真的是你自己的选择。从现在开始，对金钱感到良好吧。


    通过放下负面信念，并结合极佳（AMAZING）和微笑（SMILE）技巧以及良好的选择和决定，你可以开始开你想要的财务生活。开始热爱你的财务。对金钱感到很好。当你对金钱持有积极态度时，你会做出更好的财务决定。如果你为金钱感到沮败，金钱就会让你感到沮败。但如果你热爱你的财务，你将成为一个拥有值得爱的财务的人。


    任何人可以在任何类型的超市中购物。有些人更多在昂贵的超市购物，而另一些人则在便宜的超市。无论你是富有还是贫穷，通过明智的决策和选择，你可以在预算范围内在所有超市购物。在更昂贵的商店买件小礼物，即使你一年只能负担得起一次，然后在更注重预算的商店购买日常用品。你不需要等到一直负担得起在昂贵的超市一直购物。通过意识到只要你坚持预算并平衡开支，你负担得起财富的体验，你可以立即感到富足。


    你可以将超市概念应用于生活的每个方面，并立即感到富有，而不是等到富有。如果你现在买不起私人飞机，你可以攒够足够的钱去体验！开始创造性地如何过理想的生活。当你相信渴望是可能的，它们就会变成现实。有人甚至会邀请你坐飞机，所以不要假设你必须拥有飞机才能去。


    *   **预算 = 花得比赚得少，这样你可以存钱。**


    重要的是接受现状——“这就是我所在的地方”——并对此感到良好。微笑并大笑，仿佛你的财务状况极佳一样。如果它们现在不极佳，你会开始对它们大笑，而不是为它们感到压力。如果你的财务状况已经极佳但你想进一步提升，这些建议也会帮助你。


    从现在开始，对金钱感到良好。充分利用你的选择和决定，明智地使用你的钱，并用你最好的方式赚收入。意外资金可能会到来，但你需要去获得那份薪水更高的工作。每天重复
    300 次“大额资金会定期向我来”这样的肯定是没有意义的。相反，就与你最相关的话题进行积极、全面的自言自语。


    *   “我有一份热爱且适合我的极佳工作。”

    *   “我的生活中充满了极佳的钱。”

    *   “我有让我微笑的财务状况。”

    *   “我有可以投资的闲钱。”

    *   “我银行里有很多钱。”

    *   “我处理金钱很聪明。”

    *   “我有财务安全感。”

    *   “我赚了很多钱。”

    *   “我很擅长赚钱。”

    *   “我可以轻松支付账单。”


    保持你的想法积极且多样化，就像脑海里播放的一台电台一样。当你听到负面情绪袭来时，记得再次调回那个积极的电台。

    '
