  trans: '


    如果工作或家里发生了一团乱，尽管说：“太棒了。太棒了。太极了。这简直太棒了。”感受那种通过做出正确选择和决定来摆脱困境的感觉。你可能会感到沮丧，但让它过去吧。通过培养超越问题的习惯，你将会更好地处理事情。例如，如果你有一个难以对付的邻居或老板，只需说：“太棒了。我会找到处理这种局势的解决方案。”为局势的解决而感觉良好。


    这之所以是“太棒的”的原因之一，是因为你正在识别问题，从而能够解决它。使用 `SMILE`（微笑）技巧，让你对这种状况大笑出来。通过感觉太棒或绝妙，你已经感觉好多了。一旦你感觉好起来，你就会把它变成一个更好的局面。`SMILE`
    一，想象事情已经以一种极好的的方式解决了。感受你内心那种良性的庆祝感，就好像一切都进展得很顺利。


    你的生活可能非常忙，以至于你没有大脑空间去思考解决办法。或者你可能一直在用同样的局限思维来设定你自己，这些思维阻止了你从不同的角度看待问题。当人们去度假时，他们能够用全新的眼光审视生活。通常，这让他们对事情的感觉变好一点，因为他们回到家里后可以看到从哪里进行调整。这是因为他们在离开期间拥有更多的大脑空间。


    我教客户一种练习，帮助按摩掉那些卡住、僵化的选择和决定。这真的就像是在你的脑海中进行按摩。这项练习非常强大，随时都可以做，并且通过让你释放那些受困、卡住和过载的情绪，产生巨大的影响。这项技术将帮助你不断不断调整，以保持你生活的流顺畅。


    ### 音乐控制设置技巧


    想象你的大脑和你的生活就像录音室里音乐技师的控制面板，上面有很多可以滑动的按钮和开启关闭的开关。当你思考想要改进生活的某个领域时，现在想象所有那些不同的控制设置。来到控制面板的这部分，当你想象你生活的这个领域正在发生积极调整时，上下滑动设置。当你对正在发生的积极变化感觉良好时，移动滑块。当你对你的生活变得和谐而感觉良好时，调整设置。随着设置的调整，以不同的方式滑动滑块按钮。如果你喜欢，就关掉其中的一些。只需按照你自己的创造力做觉得对的事。通过在这里那里微调设置，这些小的调整将帮助你创造新的选择和决定。如果你想，可以闭上眼睛。这就像是在你的脑海中和你的生活中都进行了一次按摩，让你感觉更好。


    想象你生活的每个领域都由控制面板的某个区域代表。尽可能视觉化地在特定区域进行工作，通过移动控制装置、调整并重置它们，直到你感到放松。你会发现，如果你经常做这项练习，你的大脑就会开始改变，让你能够想出更多解决方案。你对以前引起紧张和压力的事情会有不同的感觉。那些曾经看起来不可能的事情将得到解决。


    你可以任何时候使用这项技术。早晨醒来时，想象设置正在调整你的一天，使其运行良好。在上班路上、在交通堵塞中、等公交时、当你上厕所时或在任何空闲时间做这项练习。过了一段时间，它将成为你的本能，因为你的大脑会顺畅地处理一切。经常使用，它将帮助通过微调、微调、不断微调你的情绪、压力、工作、自信问题、忧虑、金钱和人际关系的设置，将你的大脑从旧坏习惯中释放出来。


    在一天中保持创意。在的一周中保持创意。在你的周末保持创意。不要只做你昨天、上周、上周末做过的事，或者你认为由于你的年龄或处境而应该做的事。在学校里，你必须符合别人对你的期望，并通常做大家都在做的事。但你现在不在学校了。所以要对你的时间非常有创造力。要有个性。


    客户经常问我：“我如何能让我的周末填满积极的事情？有什么可以做的？没什么可做的。”我告诉他们：“看看你现在所在的地方，有这么多事情要做。外面有的人进行各种活动：园艺、遛狗（如果需要就借只狗）、去当地的咖啡馆、加入俱乐部、阅读、研究感兴趣的话题、去画廊和博物馆、参加在线课程或大学的课程。”


    如果你有孩子，和他们一起做与其年龄层相关的事情，这样你可以在他们生活的每个阶段享受家庭时光。了解你所在地区有哪些资源。我们生活在一个拥有这么多机会和免费活动的国家，无论你的预算如何，你都能找到可以做的事。


    从周一早上开始，说：“哇，我过了一个太棒的周末。它太绝妙了。我参加了一个课程并遇到了一些太棒的人。”听听你对周末的想法、感受和说的话。


    你的生活已经开始改变了。当你开始做出更好的选择和决定时，你的世界将会开启，好事将会发生。你可以通过将你的选择和决定与“太棒的”短语结合，例如“我正在做出太棒的选择和决定”以及“我让太棒的事情发生”，来加强你的选择和决定。起初，这可能感觉就像是在玩游戏，但你很快就会看到积极的结果。


    你生活中的进步不是发生在你之外的事情。它发生在你内在。你的语言和行动在每天的每一刻都指挥着你前进的方向，因为你的潜意识会吸收你设定进它的信息。这一切从你开始。你掌握着控制权。你越使用这些技巧，你生活中看到改变的速度就越快。


    我告诉所有的客户，改变是最重要的事情：改变、改变、改变、改变、改变。所以开始改变你看待事物的方式，记住万事皆有可能。


    每当你写下负面评价时，你都在向外发送关于你是谁负面信息。相反，给出现问题的公司写下建设性的建议，在发布公开投诉之前给他们改进的机会。大多数企业都努力为客户提供优质的产品和服务。如果他们并不总是做对，值得记住他们的员工只是凡人，他们可能只是犯了错。更好，与其关注对你的经历说负面话，不如选择为那些做得正确的公司写正面评价。


    '
