  trans: '

    反思你过去在关系中哪里出了错，以及从现在起你可以如何做出何种改变。将关系的破裂归咎于前任的行为是很容易的。但是如果例如，他们欺负了你，你为什么不反抗呢？这次你可以做得更好吗？你从父母的关系中学习到了什么？是好是坏？从你目前的人生经验中，你对关系学到了什么？你能做什么来确保自己做对决定？


    摸着良心说，你可能知道过去的关系并不对劲。也许是你或你的伴侣，或者你们双方都没有解决这些问题。确保这次当你找到一个可以建立良好长期关系的人时，找到解决问题的方法。但要避免过度补偿。例如，也许你在过去的关系中很有控制欲，你认为这导致了分手，因此在新的关系中你退后并允许自己被欺负。人们往往会走向另一个极端，而不是找到中间地带并平衡，这很常见。


    我的一位客户最近遇到了一个她非常喜欢的男生。他们在一起过得很开心，一起去看电影、散步、在酒馆花园喝饮料，或者只是在家里看电视。“但他不是我的类型，”她告诉我，“他对我来说有点太‘正常’了。我不确定是否应该和他在一起。我觉得很困惑。我习惯了和那些更外向、派对型的男生约会。”


    我告诉她，生活不只是派对，她真的需要一个在日常生活中让她感到舒服的人。我提醒她，她过去认识过的那些酷酷、爱派对、长得帅男生最后总是让她心碎或利用了她。我建议她把关于新男朋友的任何决定放在脑中的“架子”上，日后再重新考虑，让她在关系发展的同时享受他的陪伴。


    这是我在客户身上经常遇到的问题——他们害怕对某人投入，因为他们认为外面可能有更好的人。但一段幸福、平衡、充满爱的关系是基于你们一对一的互动方式。我与我的客户讨论了这一点，她意识到旧类型的男朋友可能不再适合她了。她决定继续和那个男生约会，这样她就可以更好地了解他，并给关系一个发展的机会。一段时间后，她告诉我，“这种新类型”绝对是她的菜，她和男朋友生活得很幸福，他们正计划一起组家庭，而我们所做的工作改变了她的生活。


    虽然如果你打算不继续这段关系就误导别人是不公平的，但有时你只需要给事情一个机会，并给自己足够的时间和空间来做出正确的决定。


    ### 搁置法 (Shelve-it technique)


    尝试放松心情，让生活成为一场冒险。如果你今天不知道某个问题的答案，不要担心。把它放在你脑中的“架子”上，在一周、一个月或六个月后重新回顾它。如果你今天不知道答案，可能今天不是做决定的合适时机。搁置它，永远
    true 它会以极其出色的方式解决。


    如果某人因为处于另一段关系而不准备对你投入，请继续前进。如果你接受了做次优选择，你会被那样对待。问问自己，为什么对自己的要求这么低？你为什么想证明你可以抢走别人的伴侣？告诉他们：“这对我来说还不够。我建议你回到你的伴侣那里解决你们的问题。谢谢，但不必了。我有我的生活要经营。”离开那些浪费时间的人。会有一个非常棒的人在等着你。


    我经常听到客户说：“好男人/女孩都被抢光了。”然后几周后，在和我进行了一些治疗课程后，他们回来告诉我遇到了一个非常棒的人。


    #### 负面暗示 (Negative)


    - 如果你对自己说：“男人/女人都是没用的，”你就会和那些没用的伴侣在一起。

    - 如果你对自己说：“好男人/女孩都被抢光了，”你就遇不到好男人或好女孩。

    - 如果你对自己说：“我永远和一个人定下来，”你永远无法和一个人定下来。

    - 如果你对自己说：“我将永远痛苦且孤独，”你将永远痛苦且孤独。


    #### 正面暗示 (Positive)


    - 如果你对自己说：“我正和一个非常出棒、善良且体贴的男人/女孩在一起，”你就会和那个人在一起。

    - 如果你对自己说：“我婚姻美满，住在美丽的家里，”你就会过那样的生活。

    - 如果你对自己说：“对我充满爱的体贴伴侣来说，我是一个完美的体贴伙伴，”那么你就拥有一段充满爱的关系。


    事实是关系中的双方都需要保持独立，共享时间，保持理智，并在关系中感到自由。如果你认为为了进入关系你永远不需要改变，说明你太固板了，良好的关系是基于灵活性的。你们都需要互相适应才能良好地合作。


    ## 完整性 (Being complete)


    ### 全圆圈法 (Whole circle technique)


    你出生在这个世界上是完整而完美的，像一个完美的圆。然后，生活逐渐侵蚀着你，直到这个圆变得有些扭曲和变形。如果你没有表现出完整的自我，你可能会吸引一个你自身反映的伴侣。这个你认为完美的伴侣，实际上也是一个扭曲的圆，像你一样受到了生活的影响。想象你的生命之圆是完整且圆的，正如你回到了真实的自我。


    为了找到正确的伴侣，你需要通过使用书中的技巧回到真实的自我，并建立你热爱的生活。然后，一旦你了解了自己是谁，你就会遇到一个与你处于同一积极水平的人。你将再次成为一个完整的圆，他们也是一个完整的圆，你们将都会感到幸福和自信。你会感激过去关系的结束，这让你能够发现自我并遇到这个新人。


    彼此灵活和开放是适应彼此做事方式的关键。通常人们在关系早期就会分手，是因为其中一方对投入感到畏缩。如果发生这种情况，不要担心。如果一段关系注定会发生，它就会发生。放手让对方离开要要知道无论你是否和他们在一起，一切都会极其出色地解决。有时，人们需要时间来适应与某人在一起的想法，当他们不再和你在一起时，他们会意识到失去了什么。让关系顺其自然发展。

    '
