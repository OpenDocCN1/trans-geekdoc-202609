- raw: 'By accepting where you are in life, regularly stating the outcome you want
    and actioning what you need to do to change things, you will make that outcome
    happen. We are, in effect, hypnotizing ourselves with the words we speak to ourselves
    and to other people. Remember that your words create your life. I have tried and
    tested this theory many times for myself. In the past, in situations when it was
    easy to think something was impossible, I found that self-talking myself into
    the positive made things happen very quickly.


    As a hypnotherapist, I understand that the mind does what we tell it to do. But
    most of the time people are giving themselves mixed messages by using confused
    self-talk. Lots of people think they are attracting things from an outside source,
    whereas in fact it is the inner self-talk that is making the outside things happen.
    People often give away their power to outside influences. But everything is being
    created by you and how you deal with life. A successful businessman or businesswoman
    would not fall at the first hurdle. If something doesn’t work out, they don’t
    doubt themselves or their abilities. They find a way to make it happen, just as
    an athlete would do. Successful people have an inner belief and a drive that gives
    them a ‘can-do, go-for-it’ attitude. They are generally positive people who like
    to be around other positive, like-minded people who have a similar positive outlook.


    We all tend to surround ourselves in life with people who are on a wavelength
    that is similar to ours. So, if it doesn’t feel right being around negative people,
    you are probably ready to move up the positive scale and be with people who think
    like you do. It feels good to be around people you feel comfortable with. It feels
    like being with yourself when you are around the right people for you. As you
    improve your ‘I can’ outlook, you will notice that you begin to move in more positive
    circles of friends, family and colleagues. It’s okay to let go of some of the
    people you know so that they can find the right people for them as you find the
    right people for you.


    With this in mind, begin to do one thing from your list of things to get done.
    This will break the ‘not doing’ habit and begin to create a ‘habit of doing’ in
    your mind. The chances are that if you start with one thing, you’ll go on to do
    two or three, even four or five, and will probably finish the whole list.


    Remember all the times you have finished tasks or achieved goals in your daily
    life or at work. By reminding yourself of these achievements, you will begin to
    see that you are getting on with things all the time. The one thing you want to
    achieve now is just as easy as all the other things you have achieved without
    even thinking about them.


    **So, DO ONE THING.**


    If you are struggling to get started with one thing, take some deep breaths in
    and out and channel all your thoughts into the action of doing the task. As you
    are breathing in and out, say to yourself in your head, ‘I can do this. I am doing
    this. It is done.’ Even if the first thing you do is just move some papers, turn
    on the computer, open one email or make one decision, you have already begun the
    process of action.


    *   Begin with the easiest thing to get yourself started.


    *   When we action things, things get done.


    *   When we are in a positive frame of mind, more positive things happen.


    ### *Inner coach technique*


    **Think of someone you admire who does the sort of thing you are trying to achieve.
    Imagine they are your coach and that they believe in you. What would they say
    to you? How would they encourage you? What advice would they give you?**


    **Imagine they say AMAZING things to you. What would those things be?**


    **For example, to someone who is redesigning their home, the coach may say:**
    ‘You have AMAZING style and creative ability. You are great with colours. You
    are fantastic at choosing interior decorations. You are clever at achieving professional
    results within a budget.’


    **To someone who is trying to get a new job, the coach may say:** ‘You have so
    many skills. Look at how good you are in your field of work. You have so much
    experience. You are an excellent candidate. I would definitely employ you.’


    **To someone who is looking for love, the coach may say:** ‘You are such a brilliant
    person. There are millions of people in the world and there are many AMAZING people
    out there for you. You will find someone special who totally adores you. You look
    gorgeous/handsome. You have an AMAZING personality. You are so kind. You are a
    great catch.’


    **To someone who wants to pay off their debts, the coach may say:** ‘You are talented
    and skilled and you can use those traits to find positive ways to pay off your
    debts. You are intelligent. You will find ways to take control of your finances.
    You will start saving so that you can make yourself financially secure. You will
    turn your finances around by being sensible with your money from now on. You can
    easily earn more money.’


    **To someone who wants to move to another home, the coach may say:** ‘There are
    millions of great properties out there and you are going to find an AMAZING one.
    You have all the skills to make good things happen for yourself.’


    **To someone who is studying, the coach may say:** ‘Look at what you have achieved
    so far. It is because you are AMAZING that you are even in this position to sit
    for these exams. You have AMAZING talent. You are going to focus on your studies
    and stick to a sensible time plan. You will remember the information. You are
    going to be delighted with the results. You are going to feel calm in your exams
    and you are going to do AMAZINGLY well.’


    **To someone who wants to lose weight or reduce their alcohol intake, the coach
    may say:** ‘You can let go. You can eat and drink sensibly. I have seen you do
    this many times. You are really good at making changes. You are really successful
    when you focus. I believe in you.’


    ## Positive talk


    The coach would not say anything insulting or negative, like the things many people
    say to themselves. It may take some time to get used to being your own positive
    coach in your head, as you may not be used to hearing positives about yourself.
    If you notice that the old voice is back, remember to switch to your positive
    voice again. Try to strengthen the positivity of every statement with even more
    positive words. Make the coach’s enthusiasm really over the top. SMILE as you
    lap up the compliments. Get used to being praised by yourself.


    *   **Even if you just do this technique once, you will have unlocked your mind
    so that it can climb out of the negative rut.**


    I have helped many clients with these techniques. I know that anyone can change,
    because, as a therapist, I see people do it on a daily basis. By changing the
    conversation in your head, you can achieve your goals.


    I taught these techniques to a friend who plays golf. (He said he plays quite
    badly most of the time!) Instead of saying, ‘I hope the ball doesn’t go in the
    rough,’ I told him to say to himself, ‘I can get the ball into the hole. The ball
    is going into the hole.’ A few weeks later, he told me that he had tried the technique
    when he was teeing off, saying to himself, ‘Ball up. The ball is going up. The
    ball is going high up.’ He kept repeating it and then hit the ball high up in
    the air, in a way he had never done before. The ball hit the roof of the practice
    range in which he was standing and bounced back, hitting him on the head and nearly
    knocking him out!


    I told him, ‘It’s not the best idea to tell your mind to hit the ball up high
    when you are standing in a building with a roof! And, anyway, I thought you were
    going to try to get the ball in the hole.’


    ‘I forgot,’ he said.


    ‘Well, try it next time,’ I suggested.'
