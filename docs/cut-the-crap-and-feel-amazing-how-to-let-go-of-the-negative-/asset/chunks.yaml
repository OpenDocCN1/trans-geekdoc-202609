- raw: "There is always a solution to every problem that occurs with children. Change\
    \ something to get a different result. For instance, have bath time before the\
    \ evening meal or get your child to phone a school friend for help with their\
    \ homework – after all, their friend was in the lesson and you weren’t.\n\n##\
    \ Build a life for yourself too\n\n**Remember, your life and the lives of your\
    \ children should run in parallel with each other. There will be times when they\
    \ are younger when you have to do more for them. But build a life for yourself\
    \ along the way. Having your own life will also help you to avoid empty nest syndrome\
    \ when your children leave home.**\n\nSome women love mothering, so when their\
    \ kids leave home they feel as though they have lost a job they will never get\
    \ back. You could slip into depression because of that loss if you are not careful.\n\
    \nA friend told me that she had cried every day for two months when her daughter\
    \ went to university. ‘Well, nothing has changed,’ I told her. ‘You cried every\
    \ day for weeks when your daughter went to nursery.’ I also reminded my friend\
    \ that she was removed from the school hall by the headmistress during a parent\
    \ induction meeting when her daughter started infant school because her crying\
    \ was upsetting the other parents! ‘It’s about time for you to break the habit\
    \ of crying over your children,’ I said. And she agreed that her behaviour was\
    \ ridiculous.\n\nI would suggest that if you are upset because your parenting\
    \ has come to an end, you should fill your time helping some of the many children\
    \ who need support and guidance, either in a voluntary or a paid role. Let your\
    \ children see you getting on with your life so that they can happily get on with\
    \ theirs.\n\n*   Don’t be the extreme parent.\n\n*   Be happy to see your children\
    \ moving on to the next stage of their lives.\n\n*   Celebrate their progress.\n\
    \n*   Don’t let parenting be an excuse not to build a great life for yourself.\n\
    \n### *Kite technique*\n\n**Imagine you and your children are in a beautiful place,\
    \ perhaps on a beach or on a grassy hillside. Allow your imagination to take you\
    \ to somewhere that feels special for you. Imagine each of you has a kite that\
    \ you are flying. Imagine that you are all in control of your own kites. Imagine\
    \ that each of you navigates your kite around everyone else’s. Each kite is doing\
    \ well. They are all close to each other, but they are free to move in the sky\
    \ around each other. Some kites fly high, while others are at a lower height.\
    \ You are all smiling as you fly the kites. The kites remind you that you can\
    \ all work well together and individually, too. Repeat this exercise, which will\
    \ remind you of each person’s individuality.**\n\n## Enjoy your children\n\nIf\
    \ you are relaxed, happy, balanced and positive at each stage of your children’s\
    \ lives, they will be those things too, and you will have good friendships with\
    \ them for life. Remember that your children need to be free. If they choose to\
    \ live on the other side of the world, you must let them go. Make sure you have\
    \ a full and interesting life at every stage, alongside your children.\n\nBe a\
    \ balanced version of yourself around your children. See the good in them and\
    \ teach them to be good versions of themselves, too. SMILE and allow your relationships\
    \ with your children to flourish into something quite AMAZING.\n\nYou are your\
    \ children’s future. Invest in good parenting to make their future bright.\n\n\
    **Cut the crap from parenting and feel AMAZING.**\n\n* * *\n\n#### Chapter summary\n\
    \n*   Be interested in your children, but also let them be independent.\n\n* \
    \  Explain why we do things.\n\n*   Be reasonable.\n\n*   Don’t rescue your children\
    \ every time they fall down. If you do, they will always expect to be picked up.\n\
    \n*   ![image](Images/img1.jpg)Use the techniques in this book to help you to\
    \ be a calm, rational parent.\n\n*   ‘Snapshot’ happy moments in your mind when\
    \ you are enjoying your children to build your AMAZING zone bank.\n\n*   Use the\
    \ red triangle technique: visualize a red triangle and put your worries into it.\
    \ Then shrink it down as you let go and the stresses dissolve.\n\n*   Visualize\
    \ your children grown up and having positive relationships with them.\n\n*   Let\
    \ being a parent be a positive adventure.\n\n*   Say, ‘It’s all working out AMAZINGLY\
    \ well.’\n\n*   Use the wiggly string technique: visualize a wiggly string leading\
    \ you to everything you need in order to have a smooth parenting experience.\n\
    \n*   Use the kite technique: visualize you and your children flying kites. See\
    \ them as capable and in charge of their own kites. See you all working well as\
    \ a team, navigating around each other’s kites, and feel relaxed.\n\n**STEP 1.\
    \ Surrender to parenting.**\n\n**STEP 2. Everything is just a phase. Enjoy each\
    \ phase.**\n\n**STEP 3. Build a relationship that will last a lifetime.**\n\n\
    * * *\n\n*Believe in AMAZING possibilities. Piece  \n\nyour life together like\
    \ a jigsaw puzzle  \n\nand make it a wonderful experience.*\n\n[![CHAPTER 17:\
    \ CUT THE EXCUSES AND FEEL AT HOME IN YOUR LIFE](Images/ch17.jpg)](../Text/contents.xhtml#toc17)\n\
    \nPeople often won’t venture out of their comfort zone. Instead, they make up\
    \ all sorts of excuses to avoid change. Listen to yourself so that you can be\
    \ aware of when you are making an excuse. Make a very conscious effort to change.\n\
    \n**Work on yourself. Don’t rescue others. Rescue yourself first. Put your energy\
    \ into creating the life you want. Other people will find their way in their own\
    \ time when they are ready.**\n\nWhile it is nice to help other people, it is\
    \ also important not to waste time on people who use excuses to avoid changing.\
    \ Be aware when people are putting barriers in their way so that they are unable\
    \ to progress their lives. Consciously pull back and let them get on with their\
    \ own lives. Avoid spending time listening to people who say the same negative\
    \ things over and over again but who don’t action change. Try to learn from their\
    \ behaviour so that you are aware of sometimes behaving in the same way in some\
    \ areas of your life.\n\nRemember that some people may not be as ready for change\
    \ as you are. Using the information in this book, I believe anyone can change\
    \ for the better. Make a point of identifying excuses and eliminate them from\
    \ your life.\n\n*   Let go of weight-loss excuses.\n\n*   Let go of drinking excuses.\n\
    \n*   Let go of career excuses.\n\n*   Let go of money excuses.\n\n*   Let go\
    \ of family problem excuses.\n\n*   Let go of exercise excuses.\n\nLet excuses\
    \ pass like clouds in the sky. Wave goodbye to them, rub, tap or press your left\
    \ knuckles as you say, ‘Let it pass. Let it go.’\n\nReplace excuses with AMAZING\
    \ choices and decisions.\n\n## Excuses are the main reason for people not creating\
    \ an AMAZING life\n\nI have helped hundreds of people reduce their alcohol intake\
    \ using hypnotherapy. A common excuse I have often heard over the years is that\
    \ they don’t have 15 minutes per day to listen to my recordings. I explain that\
    \ they are wasting hours of their life every evening by sitting on the couch drunk.\
    \ By listening to a recording for 15 minutes a day, they will become sober and\
    \ have whole evenings to do what they want. Spending 15 minutes now will give\
    \ them back a lot more time in the future. There is always another way of seeing\
    \ things. I have never had a client who hasn’t been happy to have reduced the\
    \ amount of alcohol they were drinking. Sometimes change can be scary, but try\
    \ to see it as an adventure and know it will work out AMAZINGLY well.\n\n## Find\
    \ a way to make things happen"
