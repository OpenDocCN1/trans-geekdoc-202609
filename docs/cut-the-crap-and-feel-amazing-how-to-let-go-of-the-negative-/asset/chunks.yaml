    [content]

    Start living as if you are wealthy – within your budget – and believe in great
    things. Always keep money in your wallet, but train yourself not to spend it.
    If you don’t have spare cash to do this, put some pieces of paper in your wallet
    so that it feels as if it’s overflowing. When you feel good about money, AMAZING
    things will happen to you.


    ## Re-address your spending


    Catherine, a 30-year-old professional woman who is one of my clients, told me
    she couldn’t afford to buy a property. We discussed how much she spent on clothes,
    alcohol, going out, impulse purchases, magazines, unused hair and makeup products,
    and came to the conclusion that it amounted to a lot of wasted money. I then worked
    with her to change the negative spending habits in her mind.


    Within a couple of months of making changes to her spending, Catherine had paid
    off some of her credit-card debts. Within a year, she had saved enough for a deposit
    and, by being realistic about the areas she could afford to buy in, was able to
    buy a property.


    **My advice:** By looking at the financial facts, you can see where you are going
    wrong. Different choices and decisions will make your dreams come true.


    ## Money can come from unexpected sources


    A client called Trisha told me that she had to move to another part of the country
    temporarily, for six months, and didn’t need her furniture at the new place. She
    was stressed because she didn’t have the money to put her furniture into storage
    until she returned to the area and she couldn’t leave it in the flat, which she
    was only renting. After working to release the negative stress, I told her to
    imagine the move had all worked out AMAZINGLY well and that it was financially
    AMAZING too. She was sceptical, but said she would give it a go.


    Two weeks later, Trisha came back for another session and told me the most AMAZING
    story. A man who was a potential new tenant came to view the flat she was moving
    out of. As he was leaving, he popped his head back around the door and said, ‘You
    wouldn’t be interested in letting me rent your furniture for six months if I take
    the flat, would you?’ So, on the day Trisha moved out, she packed her food, clothes
    and toiletries into her car and drove away. In exchange for being able to leave
    all her furniture and general household belongings in the flat, she was being
    paid £400 a month. Instead of having to pay storage fees, she had an income. Now,
    that is AMAZING!


    **My advice:** Work to release the negative beliefs by following the techniques
    in this book and then presume things will work out AMAZINGLY well. If you do have
    to store your belongings have a good clear-out so you don’t pay to store things
    you don’t need.


    ## AMAZING things can happen


    A client called Nigel told me he couldn’t continue struggling to pay all the costs
    of having children and general living expenses and that, as he only had enough
    money to pay the interest on his mortgage, the amount he owed was never going
    to reduce. After working in the session to release his negative fears, I told
    him, ‘Things can happen. Things change. Think AMAZING.’


    Less than a week later, Nigel’s father-in-law decided to give his daughter and
    her husband £100,000 to reduce their mortgage. Nigel was AMAZED at how the AMAZING
    had worked!


    **My advice:** You may not have a rich relative, but you don’t need to know what
    the AMAZING, unexpected things will be. Just know that they *will* be AMAZING.
    Be open to paying off your mortgage early. Say to yourself, ‘We’ve paid off the
    mortgage in an AMAZING way.’


    ## Even a bad situation can turn into the best thing


    A self-employed client lost his best customer, which meant that his income stopped
    almost overnight. I helped him to believe that it was AMAZING for him. a few days
    after his appointment with me, he woke up with the idea of pushing into other
    markets. The old client had made him so busy he had overlooked more lucrative
    areas of work. He kept the AMAZING feeling going, which led him to find new, better
    clients and to take his business in an AMAZING direction.


    **My advice:** By releasing the negative beliefs and keeping in the AMAZING zone,
    you can make even better things happen.


    ## Get the job you want with the salary you want


    Sarah, a freelance journalist, was offered a dream job working for a magazine.
    But she didn’t want to accept it because it involved a significant reduction in
    her salary. I did some hypnotherapy sessions with her and used some of the techniques
    described in her. (Wait, the text says: "I did some hypnotherapy sessions with
    her and used some of the techniques described in her.") (Actually, I''ll just
    use the text as it is).

