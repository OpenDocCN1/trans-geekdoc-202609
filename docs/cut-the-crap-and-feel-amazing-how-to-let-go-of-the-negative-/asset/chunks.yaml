- raw: "*   Use the pebbles-in-the-pond technique: imagine the pebbles represent any\
    \ negatives in your mind, then throw them into the garden pond and let them dissolve.\n\
    \n*   Feel optimistic about things working out AMAZINGLY well.\n\n*   Say ‘AMAZING.\
    \ It’s AMAZING. It’s working out AMAZINGLY well. It has worked out AMAZINGLY well.’\n\
    \n*   Use the stepping-stone technique: imagine your life is a series of stepping\
    \ stones that are the solid ground of the past behind you and the future ahead.\n\
    \n*   Speak positively to yourself.\n\n*   The sooner you start focusing on the\
    \ life you want, the sooner you will be living that life.\n\n*   Use the AMAZING\
    \ day technique: SMILE as you fall asleep at bedtime and imagine each day is AMAZING.\n\
    \n*   You might be very good in some areas of your life but not in others. Cutting\
    \ the negative and getting into the AMAZING zone will help you to change this.\n\
    \n*   ![image](Images/img1.jpg)Let life be an AMAZING adventure.\n\n*   Take a\
    \ snapshot in your mind of AMAZING moments happening in your life.\n\n*   Bank\
    \ good experiences into your AMAZING zone.\n\n*   Don’t buy into negative dramas.\
    \ Instead, say ‘Cut the crap and feel AMAZING.’\n\n**STEP 1. Rise above the drama.**\n\
    \n**STEP 2. Presume it will work out AMAZINGLY well.**\n\n**STEP 3. Say ‘AMAZING’.**\n\
    \n* * *\n\n*Your SMILE is the most AMAZING tool  \n\nyou have to improve your\
    \ life.  \n\nIt is free and you carry it with you wherever you go.  \n\nRaise\
    \ the corners of your mouth into a  \n\nSMILE and feel even more AMAZING.*\n\n\
    [![CHAPTER 2: SMILE](Images/ch02.jpg)](../Text/contents.xhtml#toc2)\n\nMany years\
    \ ago, I was reading a book on how to meditate. As you can imagine, it is difficult\
    \ to meditate whilst reading a book! I thought there must be an easier way to\
    \ do it. So I put the book down, closed my eyes and asked myself what would be\
    \ the easiest, best, most powerful, most AMAZING meditation technique. And then,\
    \ in a light-bulb moment, I got the answer: just SMILE.\n\nTo strengthen the AMAZING\
    \ zone, I teach clients my SMILE technique. When you SMILE your brain produces\
    \ a chemical – called dopamine – that lifts your spirits to create positive, happy\
    \ feelings.\n\nYou can SMILE at any time and in any place. Just relax and raise\
    \ the corners of your mouth into a SMILE. As soon as you do this, you will start\
    \ to feel happy feelings, your body will become physically more relaxed and you\
    \ will feel better emotionally too.\n\nI have used this technique with many of\
    \ my clients to dissolve depression or negative feelings. It is difficult to feel\
    \ down when you are smiling, especially when your brain is telling you that you\
    \ feel good. When you SMILE you will notice that your mind becomes solution-focused,\
    \ so you can work out the best way to approach everyday problems, which in turn\
    \ will help you to create a great future.\n\nThere are two ways I teach this:\n\
    \n### *1\\. SMILE technique*\n\nSimply SMILE doing everyday things such as brushing\
    \ your teeth, working, doing the housework, tidying up, reading a book, walking\
    \ around the supermarket, driving the car or studying. Allow yourself to think\
    \ things through while you are smiling. You will notice you feel more positive.\n\
    \n### *2\\. SMILE meditation*\n\n**Close your eyes when you are relaxed in a suitable\
    \ place, such as in bed, on the sofa, sitting on a train or in a plane. SMILE\
    \ and allow the positive feelings to wash over you. While you are smiling, think\
    \ about your life and about something you want to achieve. You will automatically\
    \ feel that it is achievable. Let any frustrated or negative feelings pass. Everything\
    \ will seem better when you are smiling. You will feel things soften and they\
    \ won’t seem so bad. Not only will it make you feel better at the time, it will\
    \ also build a bank of positive feelings to help you create a more positive future.**\n\
    \nI suggest that you test the SMILE technique for yourself. Try thinking of a\
    \ problem without smiling and then SMILE and think of the same problem. As soon\
    \ as you SMILE, you will feel solution-focused and much more positive about the\
    \ situation. For example:\n\nWithout a SMILE someone may feel: worried and stressed\
    \ about money.\n\nWith a SMILE they will feel: my finances are manageable and\
    \ I will find a way to get through this.\n\nBy doing the SMILE technique you will\
    \ find it easier to create AMAZING feelings. You will also realize that you don’t\
    \ have to take life so seriously. The more you SMILE, the happier and healthier\
    \ you will feel.\n\nMaybe a lack of smiling is partly why there are so many people\
    \ turning to anti-depressants – because they are not producing enough ‘happy chemicals’.\
    \ Think of your daily SMILE as your natural anti-depressant.\n\nDepression and\
    \ stress are learned in childhood when children are put under too much pressure\
    \ to perform in a certain way – ‘Sit here. Do this. Be quiet.’ From an early age,\
    \ people are going against their instincts and against what feels natural and\
    \ right for them. Young children naturally SMILE, but once they go to school they\
    \ sit at desks with serious faces, and I believe this is when depression begins\
    \ to form, as it goes against their natural state of being. Rules and regulations\
    \ are necessary for discipline and structure, but children need to express themselves\
    \ through the activities that resonate with them as individuals.\n\nI had the\
    \ opportunity to visit Nigeria in 2004. During my time there, I did some art therapy\
    \ with children at an orphanage. The children lived in a small, cramped house,\
    \ slept on the floor at night, and didn’t eat every day as there wasn’t always\
    \ food. Their ages ranged from 3 to 18. From an outsider’s perspective, they had\
    \ very little, if anything, to be happy about. But they had the most incredibly\
    \ positive spirits and a joy that sang from their hearts in a way I have never\
    \ seen in children in the UK.\n\nAt first I couldn’t put my finger on what was\
    \ creating the happiness in the children in the orphanage. Then I realized that\
    \ it was their sense of freedom. They were creative with the art, which they enjoyed\
    \ enormously. Later during the same trip, I went into a British International\
    \ School with the same art materials. This time, the children were more reserved,\
    \ waiting for approval and instructions about what to do with the art materials.\
    \ Pegged to a piece of string was a row of paintings of ladybirds, all of which\
    \ were identical – even the spots were in the same places.\n\nThe children at\
    \ the International School looked a bit depressed in comparison to the children\
    \ at the orphanage. And I realized that the education system was crushing the\
    \ joy out of them. Standardizing their artwork reduced it to nothing more than\
    \ a manufactured line of pointless paintings. Expressing ourselves is a natural\
    \ process, which we need to do to be happy. As Western children grow up, their\
    \ lives become less expressive and more controlled. By the time they reach adulthood,\
    \ the cracks have begun to show and, for some people, accumulated lack of freedom\
    \ and too much conforming will eventually lead to a midlife crisis.\n\nLearn to\
    \ feel the AMAZING SMILEY feelings that will enable you to move on to better things\
    \ and enjoy what you are doing. It will help you to make good choices to improve\
    \ your life.\n\nBy beginning to SMILE more in your everyday life and by using\
    \ the SMILE meditation as an exercise to create positive feelings, you can start\
    \ to rekindle the flames of the joyful feelings that may have been extinguished\
    \ in your early childhood. The SMILE exercise is good for everyone and can help\
    \ people release depressed and anxious feelings. Start by smiling little and often\
    \ until you get used to smiling regularly again."
