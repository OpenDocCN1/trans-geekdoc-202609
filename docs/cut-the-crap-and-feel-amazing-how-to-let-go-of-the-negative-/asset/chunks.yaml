    *   If you are self-employed, put your tax money away as you receive payments.


    ## Don’t gamble with your future


    Re-evaluate what is essential and re-evaluate how best to use your time. For example,
    only free TV channels are ‘essential’. Don’t watch daytime TV. Instead, stick
    to a working day, get up early and be proactive to source a job or invest your
    time retraining. Use your evenings wisely, searching for better-paid work or making
    a plan of how to change your spending. People often pin their hopes on winning
    the lottery, which is simply a form of gambling. Instead, take control of your
    life. Retraining takes time but is a good investment of your time. Improving your
    skills will make a real difference to your finances, as your job will probably
    be your biggest source of income. Making the excuse that it will take too long
    to retrain will only prolong the time you spend in the poverty state. If you have
    a good job already, make a point each day of feeling good about it. Feel proud
    of what you have achieved so far.


    Risking money by gambling to earn money is just a way of avoiding facing the fact
    that you need to change yourself and your behaviour towards work, career, money
    and savings. I have had many clients over the years who were gambling money they
    didn’t have, running up debts behind their spouses’ back, risking the security
    of their families and future for what they believed was a quick fix and a fast
    route to getting rich. Gambling rarely pays off, whereas making better choices
    and decisions works every time.


    Be careful about investing the money of friends or family in a venture, and be
    cautious about trading in stocks and shares. You need to weigh up the risks, because
    it could all go wrong.


    ## Crisis


    Sometimes, people are plummeted into a financial crisis for reasons beyond their
    control, such as bereavement, divorce or health issues. Try to believe that things
    will work out AMAZINGLY well. Use letting-go techniques, such as the red triangle
    technique described in `../Text/chapter03.xhtml`, to offload stress. Imagine putting
    your worries into a red triangle in your mind and visualize it shrinking down
    and dissolving. You can also use the technique of rubbing, pressing or tapping
    your left knuckles while saying ‘Let it pass’ and seeing the worries in your mind
    pass by like clouds in the sky. If you are ill, do whatever you can to get well
    as quickly as possible. Know that you will find a way through things. There may
    be a way to bring in some income, so be open to this possibility. If you are claiming
    benefits, work towards a bigger picture of becoming self-supporting.


    The more positive you are, the better. Keep a positive feeling by self-coaching:
    ‘I can do this. I am doing this. It is done. I can turn this into a positive.
    I can work through this. I can get over this.’ Keep your mind in the AMAZING zone.
    Say, ‘It will work out AMAZINGLY well.’ This may sound strange when you have a
    real crisis to deal with. But by keeping the AMAZING feeling going, you will ensure
    your mind doesn’t slip into negative thinking and you will come up with the best
    solutions. Through good choices and decisions, you will start to turn things around.
    When you are focused on the ‘AMAZING’ happening, AMAZING things will come your
    way. I am not saying that you will win the lottery (although you may!), but opportunities
    will come your way or extra money from various sources, or maybe you’ll find some
    health solutions so that you can get back to work, or a bereavement could open
    new doors of opportunity for you.


    Just as your circumstances became bad as the result of a series of events, it
    is a series of events that will make your situation good again. Always imagine
    that there is an AMAZING way through things and you will be pleasantly surprised.
    If someone has taken your wealth from you, do what you can to get it back, but
    don’t waste your time on negative past situations. Instead, keep positively moving
    forwards. Negative people from your past are part of the past problem and you
    may never win with them. Feel good about what has happened, learn from it, analyse
    what you could have done differently and feel that it will work out AMAZINGLY
    well, focus on the future not on the past. As you build new wealth moving forwards,
    make sure that, this time, you look after it.


    ## Make a plan of action


    Don’t just believe that AMAZING things happen. Take action and do what needs to
    be done to improve the situation.


    ### Action changing your wealth


    When money comes your way, don’t think, ‘Oh good, I can go out now.’ Instead,
    use the extra money.


    One client, Sue, told me that she and her husband were working very hard but could
    afford little in the way of luxuries or holidays. She was comparing herself to
    her friend Katie. Katie was a stay-at-home mum whose husband had a job that wasn’t
    especially well paid but the family had two luxury holidays a year, ate meals
    out regularly, bought lots of new clothes and expensive new cars. My client Sue
    said, ‘It’s so unfair. What are we doing wrong?’


    ‘You don’t know your friend’s true circumstances,’ I told her. ‘As you said yourself,
    you need to earn a lot of money to have that sort of lifestyle. Most people can’t
    afford it. Maybe Katie and her husband have an inheritance, or maybe they have
    run up credit-card debts to pay for the way they live.’


    A month later, at her next appointment, Sue said, ‘You were right. My friend and
    her husband are in terrible debt. They have just put their house on the market.’


    ## Insane thinking


    Buying a big car or renting a large property you can’t afford and then hoping
    the money will be there to pay for it is insane. It is a good idea to research
    things you are not ready to buy but when you make the purchase make sure you are
    in a good position.


    I would suggest that you buy the smallest, newest car you can afford or rent the
    cheapest home, which may mean downsizing so that you can save to get yourself
    back on the property ladder again. If you are buying a property, be realistic
    about what you can afford.


    The following are some insane money stories to make you think about what you might
    be doing you could change:


    1.  A client called Sue told me that she and her husband were working very hard...
    (see story above).


    **My advice:** Don’t make assumptions about other people’s wealth, because you
    don’t have all the facts. Instead, focus on your own wealth and your financial
    facts by making AMAZING choices and decisions for you. If you lose your house
    for some reason, make sure you rent something cheaper so that you can save to
    get yourself back on the property ladder again.


    2.  Tom decided he wanted to buy a large new car and took out a loan, repayable
    at £600 per month over 5 years. His wife disagreed with his decision, as she was
    quite happy to continue to share the car they already had.


