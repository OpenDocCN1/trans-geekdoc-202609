  trans: '

    最近我在坐火车时，看到一个年轻女性给男朋友打电话，告诉他她一整天的所有情况，从她离开家到上火的每一个细节都说了一遍。她告诉他她买了一件外套，解释了为什么买这件而不是买另一件，然后她说：“好了，我得走了。我要下车了。我们一等会儿见，在车站外见。”
    整个车厢的人都听了她生活的每一个细节，因为她等不及要面对面和男朋友说话了。


    *   永远不要用技术代替与周围的人交谈。

    *   使用技术要保持平衡。意识到过度使用技术可能会引发争吵。

    *   与朋友约定关闭手机，以便你们可以进行有意义的对话。

    *   等你面对面见到人们时再告诉他们你的消息。

    *   避免痴迷于与人联系。

    *   避免不断查看新闻和社交媒体。

    *   当手机响起时正有人陪伴，不要自动接听。尊重你正在交谈的人。

    *   进入卧室前将手机切换到“飞行模式”。你的闹钟仍然会响，但你不会被信息、警报或设备的辐射打扰。

    *   避免在卧室看电视或使用技术。

    *   你睡前最后听到的声音将留在你的脑海中，所以确保它是积极的。也许可以在睡觉时播放一些宁静的音乐。

    *   催眠治疗可以帮助重新编写你的坏习惯。


    微笑，让你在日常生活中保持快乐。不要被技术吸收，要留意你的周围环境——树上的叶子、照耀阳光——以及你周围的人。


    ## 偷窃


    偷窃是一种坏习惯，就像任何其他坏习惯一样。也许你想要那些无法通过其他方式得到的东西。或者你仅仅因为它们在那里且你可以拿走就拿了。或者你认为你理应得到那些东西。或者你认为拥有某个特定物品会让你更快乐。或者你认为被你偷走东西的人负担得起这种损失。


    一旦你将偷窃视为一种习惯，你就可以通过做出不同的选择和决定开始改变它。例如，避免去你过去会偷东西的地方。如果你觉得想要的东西遥不可及，你正在非黑即白地带思考，而不是在寻找解决方案的灰色地带。


    不要对自己说：“我必须偷这件东西，因为我买不起”，要说：“如果我改变生活中的选择和决定，我可能会找到一种不同的生活方式。”


    对自己说：“也许有一天，我可以拥有这些东西。”


    不要说：“我买不起这些东西，但我可以偷走而不被抓到”，要说：“我可能根本不需要这些东西。也许我可以通过做出**卓越**的选择和决定来改善生活，从而变得更富有。”


    ### 红三角技术


    在脑海中视觉化一个红色三角形。将想要不属于自己的东西的负面念头连同问题和行为放入三角形中。然后在脑海中不断缩小三角形，直到它小如一粒尘埃，并想象把这粒尘埃吹走。随着三角形的溶解，你将在未来的几天或几周内让极其卓越的解决方案向你显现。为自己能够掌控自己的选择和决定感到自豪。根据需要反复重复这个练习。假设好事从今天起就会到来，并且人们对你有好评。


    “**卓越**的事情发生在我身上，因为我做出了正确的选择和决定。我找到了极其积极的方式让我的生活变得顺畅。”


    ## 工作


    尝试通过意识到自己正在过度工作来打破过度加班的习惯。你可能觉得自己一直在原地打转，因为你认为这是唯一的行为方式。开始相信你可以获得成功，并保持冷静和放松。一旦你的意识意识到你做得太多了，你就可以开始寻找解决问题的办法。我建议你在一天中有意识地定时感知自己的身体，以此让自己冷静下来。对自己说：“我可以在更短的时间内完成一切。”


    逐渐夺回对局势的控制。设定边界，例如下班后关闭手机，为家人、朋友和爱好留出时间。睡前听宁静的放松音乐，获得充足的睡眠。


    ## 帮助释放的技巧


    ### 影像对话技术


    找一张你快乐时的照片。看着照片，告诉自己你需要改变什么。说出这些话：“你的价值远比这高得多。你可以脱出这种困境。开始相信你可以解决这个问题。你非常**卓越**。我会一直在这里支持你。”重复这个练习。


    ### 新音乐技术


    私下花几分钟听一些滋养灵魂的积极音乐。在做这件事时**微笑**。你可以自由地活动。选择新的、不同风格的音乐，而不是可能让你想起过去往事的旧喜好。从现在起，重点是创造“新的”积极体验。


    ### 积极未来技术


    训练你的大脑看到没有成瘾的生活的积极画面。说出你想要成为的那个人的话。意识到是谁或什么在这一过程中帮助了你。感激每一个小进步并继续前进。如果某些事以前帮助过你，尝试再次使用。建立一个帮助你的物品的武器库。


    *   视觉化自己在没有成瘾的情况下过生活。

    *   说：“我可以掌控。我是掌控者。我做着健康的选择。”

    *   使用红三角技术：将成瘾放入脑海中的红色三角形中，并将其缩小，直到它像一粒尘埃。

    *   对着自己的照片说话。说：“你可以把这转化为积极的。你可以解决这个问题。你可以克服它。”

    *   伴随着让灵魂歌唱的积极音乐自由律动。


    **步骤 1. 识别你的问题。**


    **步骤 2. 对事情会有极其卓越的结果感到更加积极。**


    **步骤 3. 改变你的生活方式，创造新习惯来戒掉成瘾。**


    切断成瘾的根源，释放自我，感觉非常**卓越**。


