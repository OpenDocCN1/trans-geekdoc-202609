- raw: 'As a therapist, I have seen many parents trying to control every aspect of
    their children’s lives. A typical comment is, ‘We are so motivated and driven
    and we just want our child to be like us.’ Some parents tell me that their children
    are not sticking to the mind map programme they have devised for them and that
    they complain about having to study every day during the school holidays. Sometimes
    they are talking about children as young as nine years old. Personally, I think
    all homework should be banned from school holidays so that children can have a
    complete break from all the stresses of school.


    Remember, when you were a child, you did not have the drive and determination
    you may have now. You were just a child. So let your children be children too
    and don’t expect them to think like adults. You can tell them that if they work
    hard, they will reap the rewards and that they need to find their special niche
    in life, because everyone has their own strengths. You can explain to them that
    we all need to stick to the rules and that doing their school work is important.
    But let them choose how they spend their spare time and let them do the hobbies
    that interest them.


    If you want your children to be confident, let them do the activities they are
    good at, so that they can feel confident about what they are doing. There is no
    point sending them to martial arts classes intending to make them more confident
    if they hate being hurt during training sessions and have no interest at all in
    martial arts. Successful people can make it harder for their children by pushing
    them when they are too young and by setting goals that are too far out of their
    reach, so that they end up giving up anyway.


    ## Causing stress to your children is a form of abuse


    Life is stressful enough without parents adding pressure to the lives of their
    children. Children have to live with their parents until they grow up and can
    fend for themselves. For a child, living with a parent who causes them stress
    is like being an adult trapped in a stressful job from which you can’t escape.
    Parents’ obsessions – about their child being top of the class, the best sports
    player, the first in the class to read – can cause children the most extreme kind
    of stress. To deal with your own issues, I recommend listening to hypnotherapy
    recordings for parenting, which will help you to feel relaxed and communicate
    well with your children.


    If your child wants to do design, for example, don’t push them into medicine.
    If you do, you will set them off on the wrong path in life. Every choice and decision
    they make now will affect their future. So encourage them to build the life *they*
    want to live. If you don’t allow them to be themselves, you will end up creating
    distance between you, as they will eventually break free and make their own choices
    without discussing things because they don’t want you to control or influence
    their decisions.


    I knew some parents who said they would only financially support their son, Chris,
    at university if he chose an academic subject. Chris found a degree in graphic
    design he wanted to do at a university at the other end of the country. His father
    said that it was too far from home and the course wasn’t academic enough. So,
    acting against his own wishes, Chris went to a university nearer home to study
    law, just to keep his father happy. Soon after starting the degree, Chris signed
    up for a study year abroad without telling his parents. His decision caused a
    lot of arguments, because his parents were worried about him being so far from
    home. But he went on the study year and, in the end, his parents’ manipulation
    backfired and caused a distance between them and their son.


    *   Deal with your own stresses so that you are calm.


    *   Adjust your life so that you are able to cope with your daily routines.


    *   Have healthy and realistic expectations of your children.


    *   Teach your children to follow their dreams.


    *   Trust in your children’s ideas and choices.


    *   Remember that academic achievements are only a small part of the talents of
    any child.


    *   Allow your child to have a confident, outgoing personality, as this will take
    them far in life.


    ## The ponds in life get bigger and bigger


    At the crèche or nursery, it might be quite easy to be ‘top of the class’ because
    the pond is very small. Then the child goes to infant and junior school where,
    although there are more children in a bigger pond, it still might be fairly easy
    to be top of the class. When the child goes to senior school, the pond is even
    bigger and it becomes even more difficult to be the top student, although it may
    still be possible. Then, if they go to university or college, being the top student
    becomes harder still, as the pond is now filled with other top academic students.
    Once your child leaves education and enters the world of work or parenting, there
    is suddenly no such thing as the ‘top person’.


    There are so many people in the world and everyone has a place in making it function.
    The provision of every item and service we buy relies on a stream of people. Teach
    your children that everyone has a value and that they must find the best route
    for themselves in life. Letting go of the obsession for your child to be ‘top
    of the class’ will allow them to flourish and reach their own true potential,
    rather than being in a constant state of stress as they try to live up to your
    inflated expectations.


    Your child’s life will be AMAZING if you teach them to be themselves, work hard
    for themselves, develop their skills and find solutions, but also to be happy
    and relaxed. Teach them to work things out for themselves so that their mind develops
    the habit of doing it. If you keep sorting things out for them or making decisions
    for them, they could still rely on you to do the same thing when they are grown-up.


    Say to your children, ‘You will work things out. It will all sort out AMAZINGLY
    well.’ Remind them of times when things worked out well.


    If a teacher tells your child that they won’t get to university, tell them that
    if they want to go they will find a way. Teach them that they *can* find a way.
    Teach them to imagine that they are finishing their degree and that they did everything
    they needed to do to get a degree, if that is what they want. It is up to us as
    individuals to carve out the life we want and it is your job to tell your children
    that they can make their life anything they want it to be. But let them find the
    way.


    The workplace is changing rapidly and there are now industries that didn’t exist
    10 years ago. So don’t let your limiting thinking stop your children finding the
    right career path. Let them make choices and decisions about their future that
    make sense for them. By the time they leave school, there may be even more new
    careers that you don’t know about yet. When they show an interest in anything,
    it could be something that resonates with them for a career later.


    *   A teenager who spends more time looking at fashion magazines than studying
    may go on to run a fashion company.


    *   A computer geek who loves gaming may go on to be an IT expert.


    It’s all about balance. Obviously, you don’t want your child to become addicted
    to gaming. But they may pick up some useful focus skills and an interest in computers
    if you encourage them to look deeper into their hobby by finding educational films
    on YouTube or other websites about how computer games are made, or how computers
    work and are built.


    ## Don’t make life a drama'
