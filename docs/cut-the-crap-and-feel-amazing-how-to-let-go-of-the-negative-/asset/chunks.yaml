    \ you want, not the life you have had\n\nI developed the concept of the AMAZING\
    \ zone many years ago to help myself when working under high pressure. Later,\
    \ I applied it to my personal life to help me deal with difficult times and then\
    \ to help clients through my hypnotherapy work. The AMAZING zone bypasses fears,\
    \ worries, self-doubt and distress. It is a simple concept that is easy to remember,\
    \ and it really works. I teach the AMAZING zone to my hypnotherapy clients, many\
    \ of whom come back later to tell me AMAZING stories about the ways in which their\
    \ lives have worked out well.\n\nAs a hypnotherapist, I know the power of the\
    \ subconscious mind: every time you talk to yourself you are, in effect, hypnotizing\
    \ yourself. If what you tell yourself is negative, you will eventually be programmed\
    \ into believing that negative thought. But if your self-talk is positive, you\
    \ will program yourself positively. And it isn’t only what you say to yourself\
    \ that will have this effect. You are also being constantly programmed – positively\
    \ and negatively – by other people, by the situations in which you find yourself\
    \ and by past experiences that have formed the foundation of your belief system.\n\
    \n## What is the AMAZING zone?\n\nImagine all the crap in your life right now\
    \ (stress, worries, fears, negative emotions, money problems, work and relationship\
    \ issues…) and then imagine **rising above it all**, feeling empowered as all\
    \ the negative issues resolve because you have found everything you need to make\
    \ them work out well. Feeling stuck simply leads to more feelings of being stuck.\
    \ By rising above everything, good or bad, saying ‘It’s AMAZING’ and feeling optimistic\
    \ that things will work out AMAZINGLY well, you will expect nothing less than\
    \ AMAZING and, over time, this is the result you will achieve.\n\nWhen you think\
    \ and talk AMAZING, you will find yourself in the right place at the right time\
    \ for AMAZING things to happen. Even when everything seems to be going wrong,\
    \ let the frustration pass and persist in saying ‘AMAZING’. It’s a bit like the\
    \ positive person who falls into dog mess and comes up smelling of roses: if you\
    \ are positive about even a negative event, it will turn out positively.\n\nBeing\
    \ in the AMAZING zone is easy because you only need to remember one thing, which\
    \ is to think and feel AMAZING. There may be moments when a real crisis is occurring\
    \ and you forget to feel AMAZING for a few moments. But that’s okay, because you’ll\
    \ soon remember to get back into AMAZING thinking again.\n\nApply the AMAZING\
    \ to your life right now. Think of all the things you would like to change and\
    \ start to repeat the word ‘AMAZING’.\n\nMany people who try to help themselves\
    \ end up focusing on the life they *had* instead of on the life they want to have.\
    \ There are lots of talking therapies that focus on the negative past without\
    \ providing any tools for dealing with the now. I learned that the best way to\
    \ detach yourself from your negative problems, injustices of the past and emotional\
    \ turmoil, is to cut free from them by focusing all your thoughts on the now and\
    \ on the future life you desire to have. If you hear yourself talking negatively\
    \ or dwelling on something, say to yourself, ‘Just cut the crap and feel AMAZING,’\
    \ and tap into your AMAZING memory bank.\n\nIf you are struggling to feel the\
    \ AMAZING feeling, it is because your subconscious mind is programmed with negative\
    \ beliefs. The following technique will help to release them so that you can begin\
    \ to think more positively.\n\n### *Pebbles-in-the-pond technique*\n\nImagine\
    \ that you are in a garden, standing beside a pond with golden-coloured water\
    \ reflecting the sunlight. Imagine that there are colourful pebbles around the\
    \ edge of the pond, each one representing something negative that you need to\
    \ let go of. Imagine throwing the pebbles into the pond. As each one goes in,\
    \ imagine it dissolving in the colourful water. Let the negative feelings and\
    \ pebbles disappear. Visualize the pebbles dissolving one by one and feel the\
    \ relief as you let them go. As you let go of the negative you will make room\
    \ for positive thoughts in your mind. Think of all the AMAZING things that have\
    \ happened in your life, such as when you got a job, a bargain in a shop, the\
    \ keys to your first home, or some good news. Thinking about those things will\
    \ help to remind you of the good feelings and clear the negative from your mind.\n\
    \nFeel the feeling of being free as you feel AMAZING, for example running on a\
    \ beach or in a field, spinning on the spot with your arms open wide in front\
    \ of the Eiffel Tower, mountain biking with the wind blowing in your face, or\
    \ whatever feels right for you. Feel the feeling of life being exciting, so that\
    \ you can be open to AMAZING things happening to improve your life.\n\n## Good\
    \ can come out of a bad situation"
