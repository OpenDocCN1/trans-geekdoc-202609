    - Make choices and decisions when you feel balanced and in a good frame of mind.

    - AMAZING choices and decisions will create AMAZING outcomes.

    - Make your life interesting and varied.

    - Every choice and decision made by you or by other people has got you to where
    you are. You can now take control by making better choices and decisions that
    will get you to where you want to go.

    - Use the music `control-settings` technique: visualize the settings of a control
    panel and adjust them to improve each area of your life.

    - Write a list of pros and cons to help you make decisions.

    - Use your instinct to make choices and decisions combined with your business
    head.


    ### STEP 1. Identify what you would like to improve.

    ### STEP 2. Think of ways to improve it.

    ### STEP 3. Remember to make AMAZING choices and decisions from now onwards.


    *If everyone did what was right for them, people would be more accomplished. Anyone
    can achieve something they believe in.*


    [![CHAPTER 5: I CAN DO IT](Images/ch05.jpg)](../Text/contents.xhtml#toc5)


    ## I can do it. I am doing it. It is done.


    Everyone has felt stuck or unmotivated about something at some point. You may
    have things you need to do right now or goals you want to achieve, but you may
    not be able to get started or see a way of achieving the bigger goals.


    ## Black/white/grey thinking


    People tend to see things as either black or white and fail to realize that there
    is a whole grey area in between the two, which is where all the solutions are.


    An example of black-and-white thinking is:


    - `black` = someone wants to change their job but they can’t see how to do it
    so they automatically think…

    - `white` = ‘I have to stay here’ or ‘It is too difficult to get a new job’…

    - whereas the answers lie within the grey area, where the solutions are…

    - `grey` = they could start looking for other job options, or investigate new
    training, or apply for some jobs.


    It’s a good idea to look for one thing in the grey area that will help you to
    achieve whatever it is you are trying to do. Seeing everything as either black
    or white can make you feel stuck, and when you feel stuck you may procrastinate
    and end up doing nothing at all. Often, thinking about doing something is more
    taxing than actually doing it, particularly when ‘doing it’ simply involves picking
    up the phone and getting it sorted out. Look for all the available options. Be
    creative when looking for answers. And, from now on, remember the grey area.


    You can use the information in this chapter on a daily basis, as well as to improve
    a particular area of your life. Keep your life moving in the direction you want
    it to go and don’t be put off by small limiting thoughts.


    For instance, instead of thinking, ‘I can’t afford the house I want so I am stuck
    here forever,’ you could expand your property search to include some of the many
    other, equally good, streets that you could afford to live in. Or you could find
    a way to save more money so that you can buy the house you want. Or buy it with
    a friend. Or get a better-paid job to improve your financial situation. Once you
    start looking for solutions in the grey area and taking action, you will start
    making progress and, before you know it, you will be moving to your new home.


    You don’t need to be able to see around the next corner from where you stand now.
    You just need to get to the corner. When you do, seeing around it and knowing
    what your next step needs to be will be easy. Imagine the AMAZING feeling of standing
    in your new home, holding the new keys in your hand. You don’t need to know which
    home it is, just that it’s one you love and that it’s AMAZING.


    Another example of a limiting thought is, ‘I don’t know everything that I am supposed
    to be revising. I am completely useless.’ Remember that no one knows everything.
    Everyone has their own strengths and weaknesses and by doing your best, you will
    probably do well enough. Even if you don’t pass, you could retake the exam, or
    find a better path for yourself. Being aware that the grey area exists will help
    you put things in perspective and make you more likely to look for solutions and
    to do whatever needs to be done to help yourself.


    I have helped lots of students to adopt an ‘I can do it’ attitude. By saying to
    yourself, ‘I can do it. I am doing it. It is done,’ and feeling the AMAZING feeling
    of holding your result paper and being happy with it, you will achieve your goals.


    It is helpful when having conversations with other people to notice when they
    are being black and white in their thinking and not seeing the grey area between
    the two. Looking for solutions to their problems will help you to be creative
    in finding solutions for yourself.


    When people live in a black-and-white world without the grey, it makes them frustrated
    and causes them a lot of stress, which can be avoided simply by seeing the grey
    solutions. When you are speaking to yourself, be aware that there are always solutions
    to every problem: you just need to look for them in the grey middle ground.


    `black` = ‘The election or referendum has turned out this way so I feel worried,
    stressed and upset.’

    `white` = ‘This is a disaster.’

    `grey` = ‘I could change my conversation with myself. There has to be a positive
    way through this. I will find what works for me. Perhaps the divided feelings
    of people will unite everyone in a positive way in the long run. Perhaps there
    will be good changes as a result of this election or referendum. I can find the
    AMAZING way through this for myself and my family. It is up to the people of this
    country to be positive and make sure that this situation works out well.’


    Parents often make black-and-white mistakes. For example, when a child says, ‘I
    am going to the party on Saturday,’ the parent may respond by saying, ‘No, you
    are not.’ What the parent could do instead is remember the grey negotiation area
    and say, ‘Okay, we’ll see how your studies go this week,’ which diffuses any argument
    and focuses the child on working hard during the week to earn the right to go
    out at the weekend.


    If you felt trapped as a child in an education system that often put you under
    pressure, you probably learned that feeling bad about what you are doing is acceptable.
    When you left school, you did more of what you had learned to do and conformed
    to things you don’t really believe. So when you decide that you want to make something
    happen, the inner voice of self-doubt may stop you. You need to rise above your
    past, believe in yourself and say, ‘I can do it. I am doing it. It is done.’


    There may be an area of your life that you would like to improve. Don’t think
    that you have to be 100% ready to make a change. No one is ever totally sure about
    something before they start doing it. Striving for perfection can stop you doing
    anything. So just give new things a go.


    Focus on what you want to happen and don’t share your ideas with other people,
    as they may put you off trying. Because we were constantly judged at school, in
    tests and exams, we are programmed to want the approval of other people. But think
    outside the box, be yourself and be creative. You are an individual, so trust
    in yourself and allow your own ideas and personality to help you get on in life.
    There is not just one way of doing something. Your way will add a sparkle, if
    you let it. Take control of your mind with an ‘I can do it’ attitude. Not everything
    will happen as you expect it to. Some things won’t happen at all. But, with a
    positive, AMAZING attitude, you will be going in the right direction and everything
    will fall into place along the way.


    ## Thinking differently will get different results


    It may be that the change you want to make involves one of the following:


    - Get some tasks done at home or at work.

    - Get a better job.

    - Decorate or tidy your home.

    - Move to a better place.

    - Study well for an exam.

    - Improve a relationship.

    - Find a partner.

