    * ‘I am AMAZED at how well I have done this.’

    * ‘It is done.’


    ### Teacher technique


    To do this technique, I find that it’s a good idea to stand up wherever you are,
    as you will feel more alert and positive when you are standing rather than slumped
    in a chair. If you can’t stand up, sit as upright as you can on your chair. A
    positive posture will help you feel more positive in your mind. Raise the corners
    of your mouth into a gentle SMILE. Imagine the positive ‘in-control feeling’ of
    being a positive but firm teacher telling the children what they are going to
    do. But instead of telling a class of children, you are going to tell yourself
    what to do.


    Think of a goal or something you want to achieve – for example, a simple task,
    a new job, buying a property or passing an exam. Now listen to yourself being
    the teacher and telling yourself that you are going to do it, that you will do
    it really well and that you will get it done. Listen to yourself just as you would
    listen to a teacher. Speak to yourself using your own name, for example, ‘Sarah,
    you will look at some properties. You will look at new areas. You will find a
    great area to buy in. Sarah, you will register with the estate agents. Sarah,
    you can get a mortgage. You will look at mortgage options and arrange your mortgage.
    You will find an AMAZING property and a very good removal company. Sarah, you
    will find a way to decorate your new home beautifully.’ Saying it aloud and listening
    to yourself will help you to feel that what you are going to do is normal. It
    will give you confidence and the feeling that everything can be done easily. Don’t
    be shy while practising this at home.


    Set yourself time frames, just as you would for lessons, homework, school days
    and half-terms. Be assertive with yourself. Remember this technique any time you
    want to get something done and when planning goals. Start by working through each
    action that needs to be taken to achieve the goal that you have set for yourself.
    You can use the SMILE technique, as smiling makes you feel more positive, and
    you can say the word ‘AMAZING’ while coaching yourself.


    Using the word ‘perhaps’ will also help coax you into doing things. ‘Perhaps’
    takes the pressure off you, because it makes everything sound as though it’s optional.
    ‘Perhaps I can do something towards my goal. Perhaps I can do that task. Perhaps
    I can start and finish this project.’


    ### Feeling satisfied technique


    Feel the feeling of accomplishing today’s tasks. Feel the satisfied feeling and
    relief, as if the day has ended well and you have got everything done that you
    wanted to do. Visualize yourself with the end result, e.g. the exam result you
    want, holding your degree certificate, relaxing in your newly refurbished home,
    driving to and from your great new job or living happily with your lovely partner.


    It is common to spend time daydreaming instead of telling yourself what you want.
    When you command yourself to do things, you will do them.


    Some things are tough to do, such as getting a university degree, but focus on
    the benefits of sticking with it and on the rewards you will gain from achieving
    it. Bringing up children can be challenging, but again, focus on the good things
    that will come from doing a great job and enjoy each stage of their upbringing.
    Work may be challenging, but the reward is knowing that you are doing a good job
    and contributing something of value to the world.


    Everything you are doing is just a phase of your life. Enjoy the phase. See everything
    you do as a new learning experience towards developing your life experience and
    your skill set.


    ### Kick boxer confidence technique


    Pretend to be a kick boxer. Stand up and do the actions of a kick boxer – within
    your own fitness capabilities, of course! As you do the kick-boxing actions, boxing
    with your hands and kicking with your leg, say positive statements about what
    you want to achieve.


    * ‘I can do this. I am doing this. This is done.’

    * ‘I am doing it. I am doing it. I am doing it.’

    * Add your own name to the beginning of the sentence: ‘[Your name], I am doing
    this.’


    You will feel a positive energy running through your body as you do this exercise,
    helping you to believe that you can do whatever you need to get done. Your body
    has a muscle memory pattern and this will train it to feel the positive feelings
    that enable you to believe in yourself on every level.


    Repeat the exercise regularly whenever you need to believe in yourself. For example,
    whenever you have studying or paperwork to do, say `[Your name], I can do it.
    I am doing it. It is done.` At any time you are thinking otherwise, remind yourself
    to focus again. People tend to self-sabotage by having negative conversations
    with themselves. Here are some examples of positive things to say instead.


    **A student** may say, `I can learn this information. I am learning it. I am remembering
    it. It is done. I am doing AMAZINGLY well in my exams. I am an AMAZING student.`


    **A mother** may say, `I can get the kids into bed quickly and easily. I am doing
    it. It is done. My kids are sleeping through the night. I am relaxed about the
    kids.`


    **Someone in a challenging job** may say, `I can get this work done. I am doing
    it. It is done. The clients are happy. The staff are supportive. Everything is
    AMAZING.`


    **Someone looking for love** may say, `I can have a great partner. I am happily
    married. I am in a loving relationship. I am happy in myself and with my partner.
    I have a successful marriage. It is done.`


    **Someone looking for a better home** may say, `I can have an AMAZING home. I
    am living in an AMAZING home within budget, which is AMAZING for me. It is done.`


    **Someone in debt** may say, `I can clear my debt. I am clearing my debt. It is
    done. I am earning plenty of money. I am saving my money.`


    **Someone with health issues** may say, `I can be strong and fit. I am strong
    and fit. I have found all the solutions available to me to improve my health.
    I am well. I am looking after myself. I am healthy.`


    You may not see all the results you want immediately, but your general conversation
    with yourself will be improving your positivity, and the more positive you become,
    the more positive your life will become. It’s okay to have a negative moment,
    but quickly try to remind yourself to be positive again. Sometimes a negative
    feeling is our instinct trying to tell us to avoid something or to make another
    choice. So get in tune with your instinct too. Decide what the negative thinking
    or worry is and how your instinct may be trying to steer you in the right direction.
    Always assume things will work out AMAZINGLY well and your mind will help you
    to make good things happen. Sometimes, you will feel a knowing feeling that something
    needs to be done, so go with that feeling, as long as it is safe and positive.

