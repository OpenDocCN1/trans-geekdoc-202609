    *   Use the pebbles-in-the-pond technique: imagine the pebbles represent any negatives
    in your mind, then throw them into the garden pond and let them dissolve.

    *   Feel optimistic about things working out AMAZINGLY well.

    *   Say ‘AMAZING. It’s AMAZING. It’s working out AMAZINGLY well. It has worked
    out AMAZINGLY well.’

    *   Use the stepping-stone technique: imagine your life is a series of stepping
    stones that are the solid ground of the past behind you and the future ahead.

    *   Speak positively to yourself.

    *   The sooner you start focusing on the life you want, the sooner you will be
    living that life.

    *   Use the AMAZING day technique: SMILE as you fall asleep at bedtime and imagine
    each day is AMAZING.

    *   You might be very good in some areas of your life but not in others. Cutting
    the negative and getting into the AMAZING zone will help you to change this.

    *   ![image](Images/img1.jpg)Let life be an AMAZING adventure.

    *   Take a snapshot in your mind of AMAZING moments happening in your life.

    *   Bank good experiences into your AMAZING zone.

    *   Don’t buy into negative dramas. Instead, say ‘Cut the crap and feel AMAZING.’


    ### STEP 1. Rise above the drama.

    ### STEP 2. Presume it will work out AMAZINGLY well.

    ### STEP 3. Say ‘AMAZING’.


    ***


    Your SMILE is the most AMAZING tool you have to improve your life. It is free
    and you carry it with you wherever you go. Raise the corners of your mouth into
    a SMILE and feel even more AMAZING.*


    [![CHAPTER 2: SMILE](Images/ch02.jpg)](../Text/contents.xhtml#toc2)


    Many years ago, I was reading a book on how to meditate. As you can imagine, it
    is difficult to meditate whilst reading a book! I thought there must be an easier
    way to do it. So I put the book down, closed my eyes and asked myself what would
    be the easiest, best, most powerful, most AMAZING meditation technique. And then,
    in a light-bulb moment, I got the answer: just SMILE.


    To strengthen the AMAZING zone, I teach clients my SMILE technique. When you SMILE
    your brain produces a chemical – called `dopamine` – that lifts your spirits to
    create positive, happy feelings.


    You can SMILE at any time and in any place. Just relax and raise the corners of
    your mouth into a SMILE. As soon as you do this, you will start to feel happy
    feelings, your body will become physically more relaxed and you will feel better
    emotionally too.


    I have used this technique with many of my clients to dissolve depression or negative
    feelings. It is difficult to feel down when you are smiling, especially when your
    brain is telling you that you feel good. When you SMILE you will notice that your
    mind becomes solution-focused, so you can work out the best way to approach everyday
    problems, which in turn will help you to create a great future.


    There are two ways I teach this:


    #### 1. SMILE technique

    Simply SMILE doing everyday things such as brushing your teeth, working, doing
    the housework, tidying up, reading a book, walking around the supermarket, driving
    the car or studying. Allow yourself to think things through while you are smiling.
    You will notice you feel more positive.


    #### 2. SMILE meditation

    Close your eyes when you are relaxed in a suitable place, such as in bed, on the
    sofa, sitting on a train or in a plane. SMILE and allow the positive feelings
    to wash over you. While you are smiling, think about your life and about something
    you want to achieve. You will automatically feel that it is achievable. Let any
    frustrated or negative feelings pass. Everything will seem better when you are
    smiling. You will feel things soften and they won’t seem so bad. Not only will
    it make you feel better at the time, it will also build a bank of positive feelings
    to help you create a more positive future.


    I suggest that you test the SMILE technique for yourself. Try thinking of a problem
    without smiling and then SMILE and think of the same problem. As soon as you SMILE,
    you will feel solution-focused and much more positive about the situation. For
    example:


    *   Without a SMILE someone may feel: worried and stressed about money.

    *   With a SMILE they will feel: my finances are manageable and I will find a
    way to get through this.


    By doing the SMILE technique you will find it easier to create AMAZING feelings.
    You will also realize that lack of smiling is partly why there are many people
    turning to anti-depressants. The more you smile, the happier and healthier you
    will feel.


    Expressing ourselves is a natural process, which we need to do to be happy. As
    Western children grow up, their lives become less expressive and more controlled.
    By the time they reach adulthood, the cracks have begun to show and, for some
    people, accumulated lack of freedom and too much conforming will eventually lead
    to a midlife crisis.


    I had the opportunity to visit Nigeria in 2004. During my time there, I did some
    art therapy with children at an orphanage. The children lived in a small, cramped
    house, slept on the floor at night, and didn’t eat every day. Their ages ranged
    from 3 to 18. From an outsider’s perspective, they had very little, if anything,
    to be happy about. But they had the most incredibly positive spirits and a joy
    that sang from their hearts in a way I have never seen in the UK.


    At first I couldn’t put my finger on what was creating the happiness in the children
    in the orphanage. Then I realized that it was their sense of freedom. They were
    creative with the art, which they enjoyed enormously. Later during the same trip,
    I went into a British International School with the same art materials. This time,
    the children were more reserved, waiting for approval and instructions about what
    to do with the art materials. Pegged to a piece of string was a row of paintings
    of ladybirds, all of which were identical – even the spots were in the same places.


    The children at the International School looked a bit depressed in comparison
    to the children at the orphanage. And I realized that the education system was
    crushing the joy out of them. Standardizing their artwork reduced it to nothing
    more than a manufactured line of pointless paintings.

