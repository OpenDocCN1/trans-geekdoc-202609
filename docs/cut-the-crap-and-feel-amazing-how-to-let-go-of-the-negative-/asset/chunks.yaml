    be used positively. As what we ‘think’ is who we are or who we become, it is really
    important that you use positive words when you are thinking. The sooner you improve
    the way you think, the sooner you will change your life positively.


    If you have a dispute with a neighbour and, instead of dwelling on the stress
    or feeling trapped because you think there is nothing you can do, you focus on
    it working out well, it is more likely to be sorted out. Being positive will give
    you the energy to get advice and gather together all the information that will
    make a difference. Rather than feeling tired, drained and helpless, let the situation
    empower you so that AMAZING solutions can be found.


    You may have experienced challenging times that you feel you can’t easily move
    on from. With some information and understanding about how the events occurred,
    it will be easier to put them behind you. Or you may have negative thoughts simply
    because you are dealing with difficult everyday problems. Depression and down
    feelings are partly the result of dwelling on the past or feeling trapped in life,
    allowing the mind to rethink events over and over again. They also occur when
    your subconscious mind, your conscious mind and your reality do not match.


    *   ‘If only that had happened or this hadn’t happened.’

    *   ‘Life was so much better back then.’

    *   ‘I should be doing better than I am doing. I was expecting to be Y and I have
    only achieved X.’


    Some of these beliefs will have been drilled into you by society, parents, schooling,
    films and, basically, just life around you. Anti-depressants will mask your negative
    feelings, but they won’t change your beliefs. Changing your life little by little
    will get you out of a negative rut. Even if you are taking anti-depressants, you
    can still change your life and then work with your doctor later to come off them,
    if that’s appropriate. This technique helps prevent people from slipping into
    hopeless feelings.


    ### Climbing-out-of-a-hole technique


    **To help release the feeling of being stuck in life or having low or depressed
    feelings, you can visualize yourself climbing out of a dark hole into the light.
    See it as a cartoon computer game, as if you are reaching the next level of lightness.
    Keep climbing into the light until you feel you are surrounded by light in your
    mind.**


    **This visualization will help you to look for the way through whatever you are
    facing right now. By imagining yourself making progress, you will program your
    mind to believe that there is a way out of the situation you are in. This will
    help you to find solutions. You can do this exercise at any time in any place.**


    ### Photo album technique


    **Imagine your past is like a photo album. Don’t look at the individual pictures,
    just see a collection of photos in your mind. Now imagine archiving the images
    into folders. Imagine the past events being filed away into a place that feels
    fine. It may feel right to let some of the photos and folders dissolve and disappear.
    Again, don’t look at the pictures. Just trust that they are going into the correct
    places. See the images in your mind sorting themselves out. As you do this exercise,
    let go of the past knowing that everything is in place for you to move your life
    positively. Visualize a blank new photo album that you can fill with images of
    all your future adventures. Repeat the exercise at any time when you feel yourself
    dwelling on the past.**


    I had a client who couldn’t come to terms with her children leaving home. She
    had too many happy memories of being a full-time mum. By doing this exercise,
    she felt that she had filed the photos of the past away and freed her mind so
    that she could plan her future and move on to the next exciting chapter of her
    life.


    ## Getting back to being whole and complete


    For argument’s sake, let’s imagine you were whole and complete when you were born
    into the world. Imagine yourself at birth being like a complete circle. Then life
    began to chip away at you – teachers, tests, exams, parents, siblings, expectations
    and disappointments – until eventually you weren’t a perfect circle any more,
    and you weren’t your true self any more either. You were a lesser version of you,
    and the circle had begun to look a bit distorted and misshapen.


    Every time you had to sit in a classroom learning information that didn’t really
    make sense to you or that appeared to have no relevance to your life, every time
    you were misunderstood or felt awkward and self-conscious, the circle got a little
    bit more bent out of shape. Eventually, you began to negatively self-talk.


    *   ‘I am stupid.’

    *   ‘What’s wrong with me?’

    '
  trans: '

    记住，你无法改变周围的人，但通过改变你的感受方式，人们对你的反应就会有所不同。当你变得快乐时，你会散发出更正向的能量，而他人也能感知到。有些人不想待在你正能量场里，但它会吸引其他人。你新的正能量可能并不适合所有的朋友，所以请让你的关系随着人们进入或离开你的生活而自然演变。


    即使对于那些说“我已经很经常微笑了”的人，多微笑（SMILE）也会创造更好的事情。


    对他人友善，但不要陷入他们的戏剧或负面情绪中。意识到他们正处于负面状态，或许可以为他们建议一些尝试的技术，或者让他们读读这本书。但请记住，并不是每个人都准备好了，所以不要做一个救世主。他人的负面情绪会阻止你感受奇妙（AMAZING）的感觉。所以要教人们学会对自己负责。


    虽然你无法逃避世界上正在发生的所有负面事情，但你*可以*看清负面事情的本质，向后退一步，不让它们进入你的身体。任何事情总能从中产生积极的一面。因此，请预设奇迹将会发生——你不需要知道是什么、何时或如何发生。


    记住，总会有比你处境更糟糕的人。与其纠结于这个事实，不如尽你所能为世界带来积极的改变。一个善举对于一个真实的人的一天可以产生深远的影响。与老年人聊天可以让他们减少孤独。向慈善箱里投钱会给世界上某地的某人带来改变。注意到你妻子或丈夫的优点并告诉他们，会让你们的关系更幸福。


    微笑（SMILE），每天花几分钟生活大笑，热爱你所处的地方并接纳它。一旦你能看到幽默的一面，你就已经开始让生活变得更好。无论你走到哪里，你都可以带着微笑。


    **为生活大笑，感受奇妙。**


    ***


    ### 章节总结


    *   用微笑加强奇妙（AMAZING）领域。

    *   每周做一件真正让你微笑的事情。

    *   对自己和对他人都友善。

    *   让你的独特性闪放光芒。


    **第一步：嘴角上扬，微笑。**


    **第二步：在执行日常任务时保持微笑。**


    **第三步：带着微笑思考思考。**


    ***


    每一个挑战都已经被世界上某个地方的人克服了。你也可以做到。


    ![第三章：抛弃废话并放下忧虑](img/contents.xhtml#toc3)


    # 放下负面情绪，为正能量腾道路


    为了能够创造积极、快乐的感觉，你必须放下负面情绪。我们所有人都会在某些时刻为某些事担心、感到压力大或产生负面想法。我教给客户的首要任务之一，就是控制他们那些螺旋上升的负面情绪，这些情绪会导致焦虑和压力，并占据了可以用于积极用途的时间。由于我们“想”的内容决定了我们是谁或我们将成为什么样，因此在思考时使用积极的词汇至关重要。你越早改进思考方式，就越早能积极地改变你的生活。


    如果你和邻居发生争执，与其纠结于压力或因为觉得无能为力而感到受困，不如专注于它会圆满解决，这样它可能得到解决。积极的态度将给你能量去寻求建议并收集所有能产生改变的信息。与其感到疲惫、精疲力竭和无助，不如让局面赋予你力量，从而找到奇妙（AMAZING）的解决方案。


    你可能经历过你认为无法轻易过去的挑战性时期。通过一些关于事件如何发生的信息和理解，将更容易把它们抛在脑后。或者你产生负面想法仅仅是因为你正在处理困难的日常问题。抑郁和低落情绪部分是纠结于过去或感到被生活所困的结果，导致大脑反复重想某些事件。当你的潜意识、意识意识和现实不匹配时，这些情绪也会发生。


    *   ‘如果当初那件事发生了就好了，或者这件事没发生就好了。’

    *   ‘那时候的生活好多了。’

    *   ‘我应该比现在做得更好。我本预期达到 Y，但我只实现了 X。’


    这些信念中的一些是由社会、父母、学校、电影，基本上就是你周围的生活刻在你脑子里的。抗抑郁药会掩盖你的负面情绪，但它们不会改变你的信念。一点点改变生活将带你跳出负面的泥潭。即使你正在服用抗抑郁药，你仍然可以改变生活，之后与医生合作停药（如果合适的话）。这种技术有助于防止陷入绝望的情绪。


    ### 爬出深坑技术


    **为了帮助释放被生活困住或低落、抑郁的感觉，你可以想象自己正从一个黑暗的洞爬向光明。将其看作一个游戏关卡，进入下一阶段的光。直到你感到周围环绕着光。**


    **这种视觉化将帮助你面对目前面临的局面。通过想象自己取得进步，你会让你的大脑相信有路可走。这将帮助你找到解决方法。你可以在任何时间、任何地点进行这项练习。**


    ### 相册技术


    **想象你的过去就像一张相册。不要看单张照片，只需看到大脑中的照片集。现在想象图像归档到文件夹中。想象过去的事件归档在一个感觉合适的地方。让某些照片和文件夹溶解并消失可能是正确的。再次，不要看照片。只需相信它们正进入正确的位置。看到你大脑中的图像正在自动归位。当你执行这项练习时，放下过去，知道一切都为你积极地改变生活做好了准备。想象一个全新的空白相册，你可以用未来所有的冒险来填充它。当你感到自己纠结于过去时，重复这项练习。**


    我有一位客户无法接受孩子离开家。。她有太多关于当全职妈妈的快乐记忆。通过这项练习，她觉得她已经把过去的照片归档并释放了大脑，以便她规划未来并进入她生活的下一个精彩篇章。


    ## 回到完整与完美


    为了讨论起见，让我们假设你出生在这个世界上是完整且完美的。想象你出生时就像一个完美的圆。然后生活开始侵蚀你——老师、测试、考试、父母、兄弟姐妹、期望和失望——直到你不再是一个完美的圆，你也不再是真实的你了。你变成了一个缩水版本，那个圆也开始变得有些扭曲和不规则。


    每当你坐在教室学习那些你并不真正理解或看起来与你的生活无关的信息时，每当你被误解或感到尴尬和局促时，这个圆就会变得更加扭曲。最终，你开始进行负面的自我对话。


    *   ‘我很笨。’

    *   ‘我到底怎么了？’


    '
