- raw: 'Many people had followed Jade’s story on the television and watched her undergo
    hospital treatment, and many felt they knew her. After she died, I had an influx
    of clients who were traumatized by her death and I told them, ‘Something good
    always comes from everything. Yes, it is tragic for Jade and her family. But the
    people who loved her should be very proud of her because she was brave enough
    to share her story and will save many other lives. In fact, hundreds of women
    who had never bothered to have cervical screening tests came forwards after Jade’s
    death to be screened. In the long term, Jade will continue to help other women
    who will now live to see their children grow up. If you look at the bigger picture,
    you will see that, even when we can’t control things, there is always a positive
    in everything.


    Try to be an optimist so that you make better choices and decisions about how
    you react to the events that occur around you. For example, if someone loses their
    job, try to find the positive and presume they will find a better one. If you
    have a rotten weekend, maybe because you have a hangover or are tired from a late
    night drinking, you could plan an alcohol-free weekend when you could go to a
    spa, go sailing or go-karting or even hire a Porsche and go for a drive. It doesn’t
    matter what you do. How you spend your time is your choice. But don’t repeat old
    behaviour and do the thing that drags you down. It sounds obvious, but it often
    isn’t to people who are caught up in the routine of their lives.


    *   Don’t do the same thing and expect a different result.


    *   Instead, do different things and get different results.


    *   Even better, do AMAZING things and get AMAZING results.


    If the children are tiring you out, plan downtime activities such as a home cinema,
    curtains closed, with a bucket of popcorn that, ideally, they have made with you.
    Or get them to help you make and pack up a picnic, then go to the park and let
    them run around and entertain themselves while you relax.


    If you are tired or stressed, choose to have a relaxing weekend. Plan ahead and
    make conscious choices and decisions that will improve your weekend. Start to
    take control of all your choices and decisions. Ask yourself what you could do
    differently.


    *   You don’t need to be a slave to your children.


    *   You don’t need to be a slave to your day.


    *   You don’t need to be a slave to your work.


    *   You don’t need to be a slave to your partner, family or friends.


    A client of mine was living away from home during the week in a cheap hotel that
    wasn’t very nice. He was a bit depressed, so he was drinking alcohol every night
    to drown his sorrows. I asked him, ‘Why do you battle through the traffic to get
    back to an empty hotel room? Why don’t you go out somewhere after work and have
    a coffee while you read the newspaper, or even for an inexpensive dinner? While
    everyone else is fighting their way through the traffic, you could be relaxing
    and enjoying your evenings. Then, by the time you get back to the hotel, you won’t
    feel the need to have a drink. You could have a bath or shower and then watch
    something interesting on the TV.’ He came back a few weeks later having made the
    changes and told me that his life was very different and he was feeling much better.
    So small changes really can make a massive difference to the enjoyment of your
    week.


    Use your instinct to make good choices and decisions and be creative. Sometimes,
    fear gets in the way. So identify whether it is the fear of being taken out of
    your comfort zone that is stopping you doing something, or whether there is a
    genuine risk that you need to avoid. If you can’t make a decision about something,
    it might not be the right day to decide. And that’s okay – just put the issue
    on a shelf in your mind and go back to it another day. By the time you return
    to it, you may have more information that will enable you to make the right choice.


    Sometimes, people want to leave a job and do something else, but what they may
    do is simply create the same problems all over again. Identify why you want to
    change things and what you could do better. Before you change your job, ask yourself
    the following questions, which will help you to make the right choices.


    *   What skills do I have?


    *   How much time have I invested in learning what I know?


    *   How can I apply these skills somewhere else?


    *   What are the benefits for me continuing to do what I do now?


    *   What have I achieved so far?


    *   If I don’t change my job, how could I enjoy my day better or feel better about
    myself?


    Taking care of yourself in your home life will help you to be less tired at work
    and to enjoy your job more. You will feel less tired if you enjoy your journey
    to and from work, take a lunch break, eat nutritious meals and drink sips of water
    throughout the day.


    There are all sorts of things you can do to improve your job and the way you feel
    about work. You may even start to look for a promotion or another position within
    the company where you are already working. Or you may feel that it is time for
    a career change, which you can begin to plan and prepare for calmly.


    Many of my clients have gone on to love jobs they previously hated, because it
    wasn’t the job that needed changing but their attitude and lifestyle. Some of
    them changed their jobs later, but the transition was more positive and smoother
    than it might otherwise have been, because they felt better about themselves.


    Feel AMAZING as you enjoy each part of each day more and more, knowing that if
    change is the answer, you will move smoothly in the right direction. Your biggest
    asset is yourself, who you are and the skills you have. So don’t throw it all
    into the bin and have to start again unnecessarily. Build upon what you have already
    achieved. By making better choices and decisions, you will guide your life in
    the right direction. Every time there is a brick wall in front of you, remember
    to make new choices and decisions so that you can navigate your way around it.


    If you have problems at home, start to work out what those problems are so that
    you can manage them. If you are arguing with your partner or your kids, or if
    you don’t have a partner, or you have lost a partner, start to think about what
    you could do differently.


    Do as much as you can to change the way you feel about where you are rather than
    running away from your life. Change your interaction with yourself and with other
    people by being more positive. As you feel better and more relaxed, you will become
    better company to be with and you will be able to bring the good out of others,
    too. You may feel that other people won’t change, but if you SMILE and imagine
    things have already gone AMAZINGLY well, you may be surprised by what happens.


    For example, I had a client who visited an old family friend who was normally
    very negative. My client saw her out of duty rather than enjoyment. She usually
    dreaded going to visit her. But then, one day, she made the choice of imagining
    herself coming out of her friend’s house after lunch having had an AMAZING time.
    And that’s exactly what happened. Her friend only spoke of positive things and
    they had a lovely lunch together with lots of laughter, which my client had never
    experienced with her friend before.


    *   **AMAZING choices and decisions will help you feel more in control of your
    life.**


    It is all about making small changes in your day. If you are at your desk and
    you are bored or stressed or have too much to get done, think, ‘How could I tackle
    this differently?’ Make different choices and decisions and most of the problems
    in your life will start to dissolve, simply because you feel different as a result
    of making different choices.'
