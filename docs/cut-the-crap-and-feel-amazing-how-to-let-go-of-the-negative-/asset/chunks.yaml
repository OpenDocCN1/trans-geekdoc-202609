  trans: '


    如果你与吸毒者生活在一起，他们对毒品的喜爱可能超过对生命本身。想象一下，无论你留在他们身边还是离开，事情都会变得**极其顺利**。通过倾听增强自信的催眠治疗录音来完善自己，这将帮助打破你与伴侣之间形成的任何负面习惯，让你能够维护自己。


    ### 戒毒技巧


    `双手合十并用力握紧。感受你所拥有的力量。想象你的身体运作良好，身体洁净安全，内心平衡。现在想一想你想到的最无聊的事情。这可能是青少年时期在课上感到无聊、学校作业、长途飞行、听枯燥的演讲，或者任何让你觉得无聊的事物。将这个念头留在脑海中，并在你握紧双手的同时，想象它变得无聊了十倍。专注于那种无聊的感觉。现在将思绪转移到毒品，想象它们很无聊，真的无聊。当你想到毒品时，你会自动对它们感到无味。它们毫无意义且无聊。片刻后，松开双手。这时，你会发现毒品是给别人用的，而你已经准备好抛弃它们。放松并放下你的手。`


    ## 食品


    商店里装满了你不需要的食物。想要苗条，你需要规律饮食，少量多次摄入健康食物，偶尔奖劳一下自己，并定期运动。除此之外没有别的了。你可能觉得自己并不喜欢节食，但均衡的饮食是瘦子人的正常饮食方式。没有奇迹般的疗法，没有魔力药物，也没有什么流行的节食法。你只需要学会管理自己的饮食。找到最适合你的方法并坚持下去。接受这样一个事实：为了变瘦，你需要摄入身体所需的食物，进行适量的运动并保持良好睡眠。


    尽可能吃新鲜的家常菜。从学习烹饪一道健康的菜谱开始。一旦精通了它，就学习另一个菜谱，然后又是，直到你掌握这么多菜谱，以至于你烹饪的全是健康食品。


    定期使用催眠治疗录音将帮助你保持积极的心态并遏制食欲。反复对自己说：“我可以吃得很健康。我可以运动，而且我正在这样做。我很苗条、健壮且健康。”不要说“我太胖了”。想象自己苗条、健壮且健康的形象。如果你无法想象，就把你的头部贴在苗条身体的照片上，并把它放在你经常能看到的相框里。


    ### 照片食谱


    `通过拍摄你所吃和喝的一切来制作照片食谱，这样你就能真正看到自己摄入了什么。也许可以把照片分享给支持你的朋友，这样你就不得不面对自己正在吃的东西了。`


    做最苗条的人。尽一切努力让你自己和身体处于最佳状态。穿适合你体型的衣服。微笑，鼓励并接受自己。


    ## 赌博


    你最大的资产是你自己以及你每月产生的收入。在追求财务梦想时，放弃通过赌博来浪费金钱。相反，通过提升自我和增加收入能力来掌控你的命运，为你现在和未来的自己及家庭提供保障。开始减少支出，把原本要花在赌博上的钱存入一个特殊的储蓄账户里。更好地利用你的时间：花时间重新培训，分析并调整你的财务状况以储蓄，并增加收入。投入时间研究如何安全地投资你的资金。


    催眠将帮助你放弃赌博习惯，增加财富并与金钱建立更好的关系。


    ### 照片赌博金钱日记


    `拍下你花在赌博上所有的钱——现金、收据、在线交易——这样你就能真正看到你的习惯是如何影响你的财务的。你可能会对自己的花费之多感到震惊。想想如何利用这笔钱投资你的未来。将照片分享给支持你的朋友，这样你就不得不面对你正在做的一切了。`


    ## 游戏


    游戏是一种催眠：你的大脑完全敞开，并专注于你正在接收的信息——对于游戏来说，就是通过观看。意识到这一点，因为游戏的图像和动作正在你的脑海中植下印象，这些印象最终将成为你思考的一部分。负面的游戏可能会让你变得更具攻击性和更消极。


    在一个圣诞假期期间，我玩了一个农场游戏 App，想看看沉浸在游戏中是什么感觉。除了发现它很上瘾外，我甚至梦到了它，早上醒来时脑海里还在播放游戏中的画面和音乐。我在短短三周内就被催眠了。


    农场游戏还是挺积极的，但例如战争游戏可能会产生很大伤害。我在完成挑战后选择了停止，因为我知道催眠的力量有多大。坦率地说，我宁愿做一些更有意义、更能增强生活的事，而不是看着虚拟鸡被喂食。事实上，如果我继续玩那个农场游戏，我今年就不会写这本书了。


    一个朋友告诉我，她被叫去儿子就学的学校开会，所有男学生的家长都被告知，这些男孩在上学时很疲倦，无法集中注意力，因为他们在玩游戏，而且现在落后于女孩了。所以游戏确实产生了影响，这不应该被轻视。


    除了孩子玩游戏，有些父母也在玩，而不是与孩子互动，这意味着在一些家庭里几乎没有交流。睡前玩游戏也是一件坏事，因为你最终会晚睡，睡眠模式会被干扰，因为这不会帮助你放松，反而会让你更清醒。寻找更健康的方式来放松或限制你玩游戏的时间。在我看来，玩游戏的人正在浪费他们本可以用来建立美好生活和财务安全未来的时间。不要让你的生活从指尖流过。


    微笑并思考更好地使用时间的方法。催眠治疗是帮助你重塑并养成更健康习惯的绝佳工具。


    ## 八卦


    你说的每一句话都在塑造你的生活。如果你花几个小时讨论他人的问题或陷入负面的闹剧中，你的生活就会变成一部肥皂剧。关注你自己的问题并解决它们，而不是讨论别人的。如果你爱八卦，你的生活就会陷入负面模式。如果你能为他人感到高兴并分享他们的好消息，你自己的生活就会蓬勃并变得更好。


    对他人友好并支持。每天对别人说一些积极的话。在思考别人的优点时微笑。


    ### 坏消息成瘾者


    注意你的言。你是那个分享坏消息的人吗？你喜欢关于他人的坏消息吗，因为这让你对自己感觉好受吗？你喜欢一个充满绝望的故事来宣泄你对世界上坏消息的愤怒吗？试着注意你什么时候说负面内容的时候，并将话题转向积极的故事。


    每天告诉某人一些好消息。


    ## 色情


    性图像在日常生活中无处不在，在杂志、电视和音乐录影带中。因此，它们在我们潜意识中变得常态化，因为我们被环境所塑造。在线看色情对很多人来说也变得可以接受了，特别是因为它太容易获得。但这影响了我们的关系。


    '
