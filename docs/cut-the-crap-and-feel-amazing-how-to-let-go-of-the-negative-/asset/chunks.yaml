    There is always a solution to every problem that occurs with children. Change
    something to get a different result. For instance, have bath time before the evening
    meal or get your child to phone a school friend for help with their homework –
    after all, their friend was in the lesson and you weren’t.


    ## Build a life for yourself too


    **Remember, your life and the lives of your children should run in parallel with
    each other. There will be times when they are younger when you have to do more
    for them. But build a life for yourself along the way. Having your own life will
    also help you to avoid empty nest syndrome when your children leave home.**


    Some women love mothering, so when their kids leave home they feel as though they
    have lost a job they will never get back. You could slip into depression because
    of that loss if you are not careful.


    A friend told me that she had cried every day for two months when her daughter
    went to university. ‘Well, nothing has changed,’ I told her. ‘You cried every
    day for weeks when your daughter went to nursery.’ I also reminded my friend that
    she was removed from the school hall by the headmistress during a parent induction
    meeting when her daughter started infant school because her crying was upsetting
    the other parents! ‘It’s about time for you to break the habit of crying over
    your children,’ I said. And she agreed that her behaviour was ridiculous.


    I would suggest that if you are upset because your parenting has come to an end,
    you should fill your time helping some of the many children who need support and
    guidance, either in a voluntary or a paid role. Let your children see you getting
    on with your life so that they can happily get on with theirs.


    *   Don’t be the extreme parent.

    *   Be happy to see your children moving on to the next stage of their lives.

    *   Celebrate their progress.

    *   Don’t let parenting be an excuse not to build a great life for yourself.


    ### Kite technique


    **Imagine you and your children are in a beautiful place, perhaps on a beach or
    on a grassy hillside. Allow your imagination to take you to somewhere that feels
    special for you. Imagine each of you has a kite that you are flying. Imagine that
    you are all in control of your own kites. Imagine that each of you navigates your
    kite around everyone else’s. Each kite is doing well. They are all close to each
    other, but they are free to move in the sky around each other. Some kites fly
    high, while others are at a lower height. You are all smiling as you fly the kites.
    The kites remind you that you can all work well together and individually, too.
    Repeat this exercise, which will remind you of each person’s individuality.**


    ## Enjoy your children


    If you are relaxed, happy, balanced and positive at each stage of your children’s
    lives, they will be those things too, and you will have good friendships with
    them for life. Remember that your children need to be free. If they choose to
    live on the other side of the world, you must let them go. Make sure you have
    a full and interesting life at every stage, alongside your children.


    Be a balanced version of yourself around your children. See the good in them and
    teach them to be good versions of themselves, too. SMILE and allow your relationships
    with your children to flourish into something quite AMAZING.


    You are your children’s future. Invest in good parenting to make their future
    bright.


    **Cut the crap from parenting and feel AMAZING.**


    ***


    ### Chapter summary


    *   Be interested in your children, but also let them be independent.

    *   Explain why we do things.

    *   Be reasonable.

    *   Don’t rescue your children every time they fall down. If you do, they will
    always expect to be picked up.

    *   ![image](Images/img1.jpg)Use the techniques in this book to help you to be
    a calm, rational parent.

    *   ‘Snapshot’ happy moments in your mind when you are enjoying your children
    to build your AMAZING zone bank.

    *   Use the red triangle technique: visualize a red triangle and put your worries
    into it. Then shrink it down as you let go and the stresses dissolve.

    *   Visualize your children grown up and having positive relationships with them.

    *   Let being a parent be a positive adventure.

    *   Say, ‘It’s all working out AMAZINGLY well.’

    *   Use the wiggly string technique: visualize a wiggly string leading you to
    everything you need in order to have a smooth parenting experience.

    *   Use the kite technique: visualize you and your children flying kites. See
    them as capable and in charge of their own kites. See you all working well as
    a team, navigating around each other’s kites, and feel relaxed.


    **STEP 1. Surrender to parenting.**

    **STEP 2. Everything is just a phase. Enjoy each phase.**

    **STEP 3. Build a relationship that will last a lifetime.**


    ***


    *Believe in AMAZING possibilities. Piece your life together like a jigsaw puzzle
    and make it a wonderful experience.*


    [![CHAPTER 17: CUT THE EXCUSES AND FEEL AT HOME IN YOUR LIFE](Images/ch17.jpg)](../Text/contents.xhtml#toc17)


    People often won’t venture out of their comfort zone. Instead, they make up all
    sorts of excuses to avoid change. Listen to yourself so that you can be aware
    of when you are making an excuse. Make a very conscious effort to change.


    **Work on yourself. Don’t rescue others. Rescue yourself first. Put your energy
    into creating the life you want. Other people will find their way in their own
    time when they are ready.**


    While it is nice to help other people, it is also important not to waste time
    on people who use excuses to avoid changing. Be aware when people are putting
    barriers in their way.

