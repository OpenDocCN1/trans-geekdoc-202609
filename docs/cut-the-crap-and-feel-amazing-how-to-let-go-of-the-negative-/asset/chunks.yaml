    **My advice:** People often think taxis are expensive, but when you add up all
    the expenses of buying and running a second vehicle, it may be cheaper to use
    taxis quite regularly. Buy the smallest, cheapest, newest car you can easily afford.
    Think of the feelings that will result from the decision you make. How will you
    feel making the monthly payments when the car is getting old and has depreciated
    in value?


    3. Eric had spent his life up to the age of 55 spending money and saying, ‘It’s
    only £20 or £50 or £100. It isn’t going to change my lifestyle.’ He came from
    a wealthy background and was constantly trying to keep up with the lifestyle he
    had been used to. Eventually, all the little overspends cost him his home and
    everything in it. Years of remortgaging and building up overdrafts had finally
    caught up with him. At one stage, he could have downsized, sold his house and
    bought a smaller one mortgage-free so that he could pay off his debts. But he
    and his wife wouldn’t let go of the big house and have to admit to their friends
    that they couldn’t afford their lifestyle. In the end, his lifestyle changed so
    much that he often ate the food other people had left on their plates in cafés.


    **My advice:** Every single choice you make has a consequence. So use your money
    wisely and secure yourself financially.


    4. James and his wife had children at university but spent all their savings on
    furniture, a new kitchen and bathroom. James did not agree with his wife’s decision
    to renovate their house, which put them under pressure and caused a lot of tension
    in their relationship. James was worried about the money, which they couldn’t
    afford to spend, particularly as they were helping their children financially
    while they were at university.


    **My advice:** Create security and don’t leave yourself vulnerable by overcommitting
    financially. Renovate your home on a budget – a fresh coat of paint and some new
    taps in the bathroom rather than a complete makeover. You can have the AMAZING
    kitchen when you have security and money to spare. If you are in a relationship,
    you need to make joint decisions that make sense financially.


    5. Rebecca invested in too many properties, which she rented out. When the recession
    hit, the rent she was getting wasn’t enough to cover all the mortgage repayments.
    This caused her a lot of stress because the properties were worth less than she
    had paid for them, so she couldn’t sell them.


    **My advice:** Make manageable investments. Sometimes, people get too deep into
    financial commitments that push them into bankruptcy. Don’t overstretch yourself
    with investments you won’t be able to afford if circumstances change. Make AMAZING
    choices and decisions to build a secure financial future.


    6. Diane and her husband sold their house to free up more money to live off and
    to be mortgage-free. They didn’t want the responsibility of a mortgage, but once
    they had moved into a rented place, they realized that the rent had to be paid
    every month, just like the mortgage had been. Also, they would have to pay the
    rent forever, even in retirement, when they would have less income.


    **My advice:** Rent out your home and find a cheaper rental property to live in
    if you don’t want to pay a mortgage, or get a lodger to help you pay it. But remember
    that as you get older, you may not be able to get a mortgage again. So think carefully
    before you get rid of it. A property you own is likely – although not guaranteed
    – to increase in value, giving you more options of where to live later if you
    have some equity in it.


    Think ‘AMAZING’ so that you are in the right place at the right time for a good
    property deal. When you are in the AMAZING zone, you may even be offered somewhere
    to live for free!


    7. Tracey, a self-employed, married working mum who I was helping with her finances,
    was feeling pressurized by her lack of money. There was never any money left each
    month to do anything other than pay all the essential bills. Tracey *really* wanted
    to redecorate the lounge and get rid of the old, stained carpet. I suggested throwing
    away the carpet, painting the old floor boards and buying a couple of cheap rugs
    and some scatter cushions for the couch.


    When I saw Tracey again two months later, I asked her how the painted floor was
    looking. She told me she was stressed about not having the money to pay her tax
    bill because, after discussing the painted floor idea with friends, she had decided
    to spend £2000 on having a new wooden floor laid in the lounge. Her friends had
    put her off the idea of painting the existing floor, saying that it would get
    damaged. (In fact, any damage could easily be touched up with more paint.)


    So the good feeling of having the new wooden floor had, in fact, been wiped out
    by the stress caused by spending her tax money. A painted floor would have given
    her the makeover she wanted in the lounge, left her plenty of money to pay her
    tax and allowed her to save a bit towards the cost of a new floor, which she could
    have had in a couple of years’ time. Now, every time she looks at the floor, she
    feels bad about the overspend. She told me later that it was a big lesson for
    her and that she is now careful to put tax money to one side and accept that she
    has to save up if she wants to buy something, rather than put herself under financial
    pressure.


    **My advice:** If you can’t afford it today, how are you going to pay for it tomorrow?
    Think before you spend. Be creative about achieving things on a budget. Your tax
    money is not yours to spend. Remember this story and try to break bad habits of
    overspending. When you receive payments for work done, put 20–30% of it away in
    a special tax savings account – and any VAT into another account. It is a good
    idea also to put money away for Christmas and birthday presents so that you are
    in control of your finances.


    ## Work at changing your finances


    If you imagine a big wheel that has been turning in the wrong direction as you
    were overspending and getting caught up in debt, you now have to turn the cog
    so that the wheel goes the other way. To start with, that can involve some strain
    and effort. But if you remain focused on getting out of debt and making yourself
    financially secure, eventually the cog will move easily and you’ll be back on
    track with everything.


    You created the problem, so you will get yourself out of it too – as long as you
    stop burying your head in the sand.


    **Cut the debt from your life and feel AMAZING.**


    ***


    ### Chapter summary


    * Change your behaviour towards money.

    * Make plans to reduce debt. Set up a debt payment plan.

    * Get yourself financially secure as quickly as possible.

    * Start saving regularly, even if it is only £1 at a time.

    * Learn from people who are good with money.


    **STEP 1. Reduce spending.**


    **STEP 2. Clear debt.**


    **STEP 3. Be sensible with your money.**


    ***


    *It is possible for anyone to become wealthier.*


    [![CHAPTER 8: AMAZING MONEY STORIES](Images/ch08.jpg)](../Text/contents.xhtml#toc8)


    Budget for the occasional affordable treat that will make you feel wealthy. You
    may only be able to afford to do this once a month or once a year. But look forward
    to it, enjoy it while you are doing it and feel great about it after the event.
    When you are enjoying an event, take a ‘snapshot in your mind’ of the happiness
    so that you can remember the feeling of the enjoyment any time you think about
    it in the future. A good memory can be as enjoyable as actually being there. Bank
    the AMAZING feeling to enhance your AMAZING zone. It could be the enjoyment you
    feel when having a meal out, a boat trip or a visit to an expensive jewellery
    shop where you don’t buy anything but have a coffee at the fancy café next door.

