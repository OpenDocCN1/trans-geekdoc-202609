    her own life experiences to help others overcome the difficulties they face and
    to become the best they can be. She wrote *Cut the Crap and Feel Amazing* to share
    with people the answers and tools they need to cope with the stress of everyday
    living, and the events happening in the world.


    Ailsa loves a simple life with cute dogs, spas, happiness and afternoon tea.


