- raw: "*   Make choices and decisions when you feel balanced and in a good frame\
    \ of mind.\n\n*   AMAZING choices and decisions will create AMAZING outcomes.\n\
    \n*   Make your life interesting and varied.\n\n*   Every choice and decision\
    \ made by you or by other people has got you to where you are. You can now take\
    \ control by making better choices and decisions that will get you to where you\
    \ want to go.\n\n*   Use the music control-settings technique: visualize the settings\
    \ of a control panel and adjust them to improve each area of your life.\n\n* \
    \  Write a list of pros and cons to help you make decisions.\n\n*   Use your instinct\
    \ to make choices and decisions combined with your business head.\n\n**STEP 1.\
    \ Identify what you would like to improve.**\n\n**STEP 2. Think of ways to improve\
    \ it.**\n\n**STEP 3. Remember to make AMAZING choices and decisions from now onwards.**\n\
    \n* * *\n\n*If everyone did what was right for them,  \n\npeople would be more\
    \ accomplished.  \n\nAnyone can achieve something they believe in.*\n\n[![CHAPTER\
    \ 5: I CAN DO IT](Images/ch05.jpg)](../Text/contents.xhtml#toc5)\n\n## I can do\
    \ it. I am doing it. It is done.\n\nEveryone has felt stuck or unmotivated about\
    \ something at some point. You may have things you need to do right now or goals\
    \ you want to achieve, but you may not be able to get started or see a way of\
    \ achieving the bigger goals.\n\n## Black/white/grey thinking\n\nPeople tend to\
    \ see things as either black or white and fail to realize that there is a whole\
    \ grey area in between the two, which is where all the solutions are.\n\nAn example\
    \ of black-and-white thinking is:\n\n*   black = someone wants to change their\
    \ job but they can’t see how to do it so they automatically think…\n\n*   white\
    \ = ‘I have to stay here’ or ‘It is too difficult to get a new job’…\n\n*   whereas\
    \ the answers lie within the grey area, where the solutions are…\n\n*   grey =\
    \ they could start looking for other job options, or investigate new training,\
    \ or apply for some jobs.\n\nIt’s a good idea to look for one thing in the grey\
    \ area that will help you to achieve whatever it is you are trying to do. Seeing\
    \ everything as either black or white can make you feel stuck, and when you feel\
    \ stuck you may procrastinate and end up doing nothing at all. Often, thinking\
    \ about doing something is more taxing than actually doing it, particularly when\
    \ ‘doing it’ simply involves picking up the phone and getting it sorted out. Look\
