- raw: '*Answer:* **It’s not great to feel like that, but it will pass. Repeat to
    yourself, ‘I can be in control. I am in control. I make healthy choices.’ Visualize
    all the times you have been in control and build upon these images in your mind.
    See your future with you in control. Visualize a wiggly string leading you to
    a life that’s under your control. SMILE as you think of making good choices and
    decisions from now onwards.**


    ## Alcohol


    There really is more to life than just drinking. Go out and find an AMAZING life
    that does not rely on alcohol. Use the SMILE technique so that you feel better
    about your day and inspired to build an AMAZING life.


    Throughout your life you may have been programmed by people drinking around you,
    by television programmes, adverts or living in a culture of drinking that has
    normalized it in your mind. Remember that there are people in every country in
    the world who drink very little and still have a good time.


    **What is normal drinking?** Normal drinking is having the occasional drink in
    the company of other people with a ‘take it or leave it’ attitude. If you are
    using alcohol to help you relax or are relying on it in any way, try to find other,
    non-alcohol-related ways of relaxing and enjoying yourself so that your drinking
    doesn’t end up getting out of control. If you have started to count alcohol units,
    you are already drinking too much. Just have a couple of drinks occasionally.
    Sort out every area of your life by making new, better choices and decisions.


    I recommend listening to hypnotherapy recordings at bedtime to break drinking
    habits and also to help release emotional stress so that you feel relaxed and
    sleep better. You can listen to other titles of hypnotherapy recordings as well,
    such as ‘Confidence’ and ‘Relaxation’, which will boost your positive feelings
    about yourself. When you are naturally relaxed, you won’t feel the need for a
    drink.


    *   Take a shower or have a bath after work to relax you.


    *   Change into some comfortable clothes when you finish your working day.


    *   Drink herbal tea in the evening.


    *   Drink sparkling water in a wine glass with a slice of lemon instead of alcohol.


    *   Listen to hypnotherapy recordings after work or at bedtime.


    *   Use the techniques in this book to change your life for the better.


    **Take the** *b* **out of** *booze* **and** *ooze* **personality without alcohol**.
    Be the life and soul of the party without a drink. Work on your confidence so
    that you don’t feel you need to have a drink to enjoy yourself.


    ### *Visualize-your-life-positive technique*


    **Let go of the negative film in your mind of you being ‘the drunk’. Instead,
    visualize yourself doing healthy things with your time, such as going to the theatre,
    sailing, running, watching movies, reading books… It’s your choice. Imagine yourself
    going through your week without alcohol.**


    ### *Photo drink diary*


    **Use your phone camera to make a photo drink diary by photographing everything
    you drink (alcoholic and nonalcoholic). This way you will really see what you
    are consuming. Share the pictures with a supportive friend so that you have to
    face up to what you are drinking. Eventually, your photo drink diary will include
    mainly non-alcoholic drinks, with the occasional drink of alcohol.**


    **SMILE as you think about being happy without a drink.**


    ## Living with a drinker


    If you live with a heavy drinker or an alcoholic, they might love drinking more
    than they love life itself. But most people who drink would like to be more in
    control of their lives, so the chances are that they will want to change. Photograph
    or film their behaviour so that you can sit down and present them calmly with
    the facts. Explain what it is like to live with them. Suggest that they listen
    regularly to an alcohol-reduction hypnotherapy recording. You could play the hypnotherapy
    recording in the background when they are drunk so that, over time, the messages
    filter into their subconscious mind.


    I strongly suggest that you also work on yourself by listening to confidence-boosting
    and relaxation hypnotherapy recordings. These will help you to break any negative
    habits that have become established in your interactions with the person who drinks
    and will give you the confidence to be able to stand up for yourself.


    Imagine things working out AMAZINGLY well whether or not you continue to live
    together.


    ## Anti-ageing


    Look at a photograph of yourself taken 10 years ago and see how fabulous you looked
    back then. In another 10 years from now, you will look back and think, ‘What was
    I worrying about 10 years ago?’ Today is the day for loving who you are and how
    you look. Start just being you, at the age you are, and accepting that this is
    who you are. Worrying about ageing is stressful and stress causes ageing. So stop
    getting stressed about the way you look. Instead, enjoy this phase of your life
    and feel AMAZING.


    Do the best you can to eat well, sleep well, be relaxed and exercise sensibly
    and safely.


    You may have brainwashed yourself into obsessing about ageing. Hypnotherapy can
    release the bad habits and help you to relax and feel good about yourself. Many
    of my clients look much younger after hypnotherapy sessions because we all carry
    life stresses in our faces and bodies. Also, hypnotherapy can help you to let
    go of bad eating or drinking habits so that your body can detox and repair.


    Enjoy who you are and what you do in your life. Look after yourself so that you
    are healthy and youthful on the inside as well as on the outside.


    SMILE, accept yourself and feel AMAZING.


    ## Body image


    Every ‘body’ is different. Yes, every single body out of all the billions of people
    in the world is completely different from every other body. Your body is part
    of who you are, so why would you want to change it? Love the body you have, really
    love it, appreciate everything it does for you and look after it.


    Use hypnotherapy to feel confident about who you are. No one is perfect, so be
    the best you can be while being healthy. Don’t buy into other people’s expectations
    about looking a certain way. Instead, create your own unique look and style. Be
    naturally beautiful or handsome.


    SMILE as you focus on the positives about the way you look.


    ## Drugs


    Be an individual and stop following the crowd. You may think that everyone takes
    drugs but that is because you surround yourself with other drug users. Of course,
    most people are not taking drugs. You need to change your life by finding things
    to do that do not involve drugs. Start doing new activities or hobbies that make
    your heart sing. For some people, that might involve something as simple as baking
    cakes or painting. Make new friends with people who have no connection with drugs
    or other drug users.


    Ask yourself what is hurting inside you from your past that is making you feel
    the need to get high and why your everyday life is not fulfilling enough. Try
    to get high on good ideas and building a great life instead of on drugs. You can
    get off drugs, but you need to heal the inner part of you that is hurting. I recommend
    hypnotherapy to deal with inner confidence issues, heal your emotional past and
    retrain your mind to live a full, happy life.


    **Take the** *d* **out of** *drug* **and stop brushing your emotional problems
    and past pain under the** *rug*. Face up to what your problems are. Start living
    drug-free because you love your life. Be strong, be confident, build a life you
    are excited to be living. Say, ‘I can take control of my life. I can do it. I
    am doing it. It is done. I am creating an AMAZING life.’


    SMILING creates positive chemicals in your brain, just like the drugs were doing.
    So switch your drug habit to SMILING because you are naturally happy.'
