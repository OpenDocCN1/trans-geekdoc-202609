- raw: 'Work out where you went wrong in your past relationships and how you could
    be different from now onwards. It is easy to blame the breakdown of a relationship
    on your ex-partner’s behaviour. But if, for example, they bullied you, why did
    you not stand up for yourself? What can you do better this time around? What did
    you learn from your parents’ relationship? Was it good or bad? What have you learned
    about relationships from your life experience so far? What can you do to make
    sure you get things right?


    Hand on heart, you probably knew things weren’t right in past relationships. Maybe
    you or your partner, or both of you, did not work through the problems. Make sure
    that this time, when you find a person with whom you could have a good long-term
    relationship, you find ways to work things out. But avoid overcompensating. For
    example, perhaps you were controlling in your past relationship and you think
    it contributed to the break-up, so you take a back seat in your new relationship
    and allow yourself to be bullied. It is common for people to go too far the other
    way instead of finding the middle ground and getting the balance right.


    A client of mine had recently met a guy she really liked. They were having a lot
    of fun together, going to the cinema, for walks, for drinks in pub gardens and
    just hanging out at home watching TV. ‘But he’s just not my type,’ she told me.
    ‘He’s a bit “normal” for me. I am not sure if I should get involved. I feel confused.
    I am used to going out with men who are more outgoing, party types.’


    I told her that life is not just about partying and that she really needed someone
    she felt comfortable with in everyday life. And I reminded her that the cool,
    party-loving, good-looking guys she had known in the past had always ended up
    breaking her heart or using her. I suggested putting any decision about her new
    boyfriend on a shelf in her mind and revisiting it at a later date to allow her
    to get on with enjoying his company while the relationship developed.


    It is a common issue I encounter with clients – they are worried to commit to
    someone because they think there might be someone better out there. But a happy,
    balanced, loving relationship is based on how you interact on a one-to-one level.
    I discussed this with my client and she realized that the old type of boyfriend
    was probably not right for her any more. She decided that she would keep seeing
    the new guy so that she could get to know him better and give the relationship
    a chance to develop. Sometime later, she told me that ‘the new type’ was definitely
    her thing, she was living happily with her boyfriend and they were planning to
    have a family together and that the work we had done had changed her life.


    Although it isn’t fair to mislead someone if you are not going to stay with them,
    sometimes you just need to give things a chance and allow yourself enough time
    and space to make the right decisions.


    ### *Shelve-it technique*


    **Try to relax and let life be an adventure. If you don’t know the answer to something
    today, don’t worry about it. Just put it on a shelf in your mind and revisit it
    in a week, a month or six months. If you don’t know the answer today, it may be
    that today is not the right day to make the decision. Shelve it, and always know
    that it will work out AMAZINGLY well.**


    If someone is not prepared to commit to you because they are in another relationship,
    move on. If you accept being second best, you will be treated that way. Ask yourself
    why you expect so little for yourself. Why would you want to prove that you can
    take someone else’s partner? Tell them, ‘This isn’t good enough for me. I suggest
    you go back to your partner and sort your issues out. Thanks but no thanks. I
    have a life to get on with.’ Walk away from time wasters. There will be someone
    AMAZING for you.


    I have often heard clients say, ‘All the good men/women are taken.’ Then, a few
    weeks later, after some therapy sessions with me, they come back and tell me they
    have met someone really nice.


    ##### Negative


    *   If you say to yourself, ‘All men/women are useless,’ you will become involved
    with partners who are useless.


    *   If you say to yourself, ‘All the good men/women are taken,’ you won’t meet
    a good man or woman.


    *   If you say to yourself, ‘I can never settle with one person,’ you will never
    settle with one person.


    *   If you say to yourself, ‘I will be sad and alone forever,’ you will be sad
    and alone forever.


    ##### Positive


    *   If you say to yourself, ‘I am with an AMAZING, kind and caring man/woman,’
    you will be with that person.


    *   If you say to yourself, ‘I am happily married and living in a beautiful home,’
    you will be living that life.


    *   If you say to yourself, ‘I am a wonderful, considerate partner to my loving,
    considerate partner,’ then you will have a loving relationship.


    The truth is that both parties in a relationship need to be independent, to share
    time together, to be reasonable and to feel free in that relationship. If you
    think you should never have to change to be in a relationship, you are being inflexible,
    and good relationships are based on flexibility. You both need to adapt to be
    able to work well together.


    ## Being complete


    ### *Whole circle technique*


    **You were born into the world whole and complete like a perfect circle. Then,
    gradually, life chipped away at you until the circle became a bit wiggly and misshapen.
    If you were not your whole self, you probably attracted a partner who was a reflection
    of who you were. This partner, who you thought was perfect, was in fact a wiggly
    circle too, having been affected by life like you had. Visualize your circle of
    life being whole and perfectly round as you imagine you are back to your true
    self again.**


    To find the right partner, you need to get yourself back to your whole true self
    again by using the techniques in this book to improve your confidence and build
    a life you love. Then, once you know who you really are, you will meet someone
    who is on the same level of positivity as you are. You will be a whole, complete
    circle again, they will also be a whole, complete circle, and you will both be
    happy and confident. You will be grateful that any old relationships ended so
    that you were able to discover yourself and meet this new person. Your past break-ups
    have simply set you free.


    Being flexible and open with each other is key to adapting to the way each of
    you does things. Often, people split up early on in a relationship because one
    party gets cold feet about committing. If that happens, don’t worry about it.
    If a relationship is meant to be, it will happen. Set the other person free knowing
    that everything will work out AMAZINGLY whether you are with them or not. Sometimes,
    people need time to get used to the idea of being with someone and they will realize
    what they have lost when they are not with them any more. Allow the relationship
    to develop in its own time. If you are a woman, allow yourself to be courted:
    don’t chase the man you are interested in or he will run a mile. If you are a
    man, be romantic, but know when to stop, particularly if you are getting a clear
    message that the woman you are interested in is not interested in you. It is about
    both sides getting the balance right.


    Alcohol can make people do things they wouldn’t dream of doing without a drink.
    So only ever have sex with someone you would have sex with when sober. And don’t
    use sex to get attention from someone: there needs to be more to a relationship
    than attention-seeking sex.


    ## ‘Getting the right property’'
