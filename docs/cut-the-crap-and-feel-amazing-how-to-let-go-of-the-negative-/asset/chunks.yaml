    \ a wiggly string leading you on an AMAZING treasure hunt through your life. Imagine\
    \ the string going in different directions: it wiggles to the left and to the\
    \ right, down and up, and it leads you to the things you need to find. Let your\
    \ life be an adventure. This exercise will help you to flow and be flexible in\
    \ your attitudes to life. Trust that AMAZING things can happen. When you believe\
