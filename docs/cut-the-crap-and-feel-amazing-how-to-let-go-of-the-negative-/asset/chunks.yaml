    # STEP 3. Work at improving your financial future.


    You got into debt through a series of choices and decisions. You will get out
    of it by making new choices and decisions.


    [![CHAPTER 7: DEBT](Images/ch07.jpg)](../Text/contents.xhtml#toc7)


    ## Cut the debt from your life and feel AMAZING


    There are several types of debt:


    *   Debt due to overspending – buying things you can’t afford.

    *   Debt to survive – being on a very low income.

    *   Debt resulting from a change of circumstances – due to being made redundant,
    loss of income or wealth, illness, bereavement, divorce.

    *   Debt that is an investment, such as a mortgage or a student loan.


    Whichever type of debt you have, you need to look at why you have it and where
    you can cut back on spending, as every small saving will help towards you becoming
    financially stable and paying off your loans. It may have taken some time to get
    into debt, so you may need to spend some time getting out of it. During that time,
    AMAZING, unexpected things can happen too. So be optimistic as well as realistic.
    You can work your way out of any situation, and that is what you need to focus
    on.


    Look at every single thing you are spending your money on. Most people can cut
    back even more than they think they can. For instance, a client told me, ‘My food
    shopping is so expensive I have cut back to the bare minimum. But it still costs
    me a fortune.’ After a discussion, she disclosed that she was buying chicken breasts
    wrapped in Parma ham, which she served with fresh pasta for her family of five.
    To me, that would be something you served at a dinner party, not as a midweek
    family meal. But in her mind it was normal. Although that would be fine for someone
    who could afford it, for my client it was taking money she didn’t have out of
    her tight budget. Her lavish food shopping was preventing her from being able
    to save money and have financial security.


    Some of your expenses are hidden, so really look at the price of everything you
    pick up before you buy it and check for cheaper alternatives. A whole chicken
    works out at half the price of chicken breasts. And what is the point of eating
    chicken breasts if you have credit-card debts that stop you sleeping at night?


    Start clearing your debts immediately, even if you just pay £1 towards them. It
    may take you a year or two to pay them off, but first you have to create the habit
    of doing it. Start to get yourself into the habit of being in control of your
    finances. Then, once you have cleared your debts and have got into the habit of
    putting money aside, you can carry on being careful with your money, build up
    savings and secure your financial future. Don’t build a financial future based
    on repeating old, bad habits and racking up more debt.


    You are likely to have inherited your money habits from your upbringing. Try to
    identify where your bad money habits came from so that you can rectify your behaviour.
    When you were a child, did your household yo-yo between famine and feast? Were
    you aware of your parents being in debt? Did your parents buy now and pay later?
    Were you handed money with no explanation of its value? Did you get what you wanted
    as a child, so expect to have everything you want now? Did your parents have a
    lot of money and you are struggling to replicate the lifestyle you were used to
    as a child?


    *   Did your past cast a negative spell over your financial life?

    *   Were you aware of your parents’ spending and now want to avoid some of the
    pitfalls they experienced?

    *   What can you improve on?


    ## Happiness is being contented with what you have


    You may like to have good meals out, drive a nice car, buy new clothes and go
    on luxury holidays, but if you can’t afford it, then you *really* can’t afford
    it. You have to accept this. It might be hard to hear, but if you don’t accept
    it, your spending will eventually catch up with you. Your finances are your responsibility,
    not the government’s, not a family member’s. And your financial problems are yours
    and yours alone. If you have children, they are also your responsibility until
    they are grown-up, whether you live with them or not. Don’t expect other people
    to pay for your financial decisions. You need to take responsibility for yourself
    and for your family. If you made bad choices in the past, you need to understand
    what they were so that you can avoid making them again and make better choices
    from now onwards. Always believe in AMAZING solutions and in things working out
    well.


    I have seen many people lose their homes due to living beyond their wealth and
    refusing to do without the things they believe to be ‘essential’. Instead of changing
    their spending or improving their circumstances, they simply build up more debt.
    Once someone has lost their home, it is often easy for them to look back and see
    how out of balance their spending was and that they bought things they couldn’t
    afford because they wouldn’t accept their situation. But some people won’t change
    until it is too late. Many people don’t want to hear from a friend or a wife or
    husband that they can’t afford the lifestyle they want.


    Try to listen to what other people who are financially secure have to say, as
    they may have some answers for you.


    Some people believe the universe will provide for them. But some fail to combine
    this with a business head and a plan of action. People can live on the edge of
    financial crisis, expecting to live off miracles instead of being practical about
    creating their wealth. Miracles do happen, so enjoy them when they do. But keep
    your feet on the ground in the real world too.


    A client who had some debt and who had set up a new online shop decided to buy
    a bigger car. There had a lot of competition for her type of business, she only
    had a few orders a week. She was selling items that were quite small and she could
    easily carry to the post box in her handbag. She certainly didn’t need a large
    new car. It would have been better for her to have visualized and aspired to having
    a business that would one day justify delivery. Sometimes, it is easy to become
    wrapped up in something that you don’t see the reality. A good businessperson
    would have kept their expenses low until the business justified further investment.
    All the guidance in the world won’t help if you don’t combine it with common sense.


    I have helped many clients turn their finances around through positive thinking
    and practical action. There is nothing you need to own that is worth risking your
    security to buy.


    *   Stop buying things you can’t afford.

    *   If you can’t afford to buy even reduced sale items, you have to accept it.

    *   Stop playing catch-up. You are gambling with your future.

    *   Remember things you can’t afford to buy today will cause you stress tomorrow.

    *   Get all the financial support and advice you can.

    *   Compare yourself to people who have less. That way you will feel wealthier.

    *   If you constantly aspire, you will never pause long enough to appreciate the
    wealth you already have.

    *   Downsize everything to get back in control.

    *   Find free ways to enjoy your life – go for a walk or a run, read a book, have
    a picnic in the park.

    *   Be happy for other people’s good fortune. Be inspired, not jealous.

    *   Feel great about the money you do have. Feel AMAZING and SMILE.

    *   Say, ‘It would be nice to have those things,’ rather than needing them.

    *   Pay off your debt. Don’t be in a situation where you have negative people
    chasing after you.

    *   Use your skills. Build your skills.

    *   Secure a good foundation of wealth before you try to climb the wealth ladder.

    *   Every money choice and decision is shaping your future. Think before you purchase.

    '
  trans: '


    # 第三步。努力改善你的财务未来。


    你通过一系列选择和决定陷入了债务。你将通过做出新的选择和决定来摆脱债务。


    ![第 7 章：债务](img/contents.xhtml#toc7)


    ## 从生活中削减债务，感觉**棒极了**


    债务有几种类型：


    *   因过度消费而导致的债务——购买你负担不起的东西。

    *   为了生存的债务——收入极低。

    *   因环境改变导致的债务——由于被裁员、收入或财富损失、疾病、丧亲或离婚而导致。

    *   投资性债务——例如抵押贷款或学生贷款。


    无论你背负哪种债务，你都需要审视产生债务的原因，以及你可以在哪里削减开支，因为每一小笔储蓄都将帮助你实现财务稳定并偿还贷款。陷入债务可能需要一些时间，因此你可能需要花时间来摆脱它。在这期间，**神奇的**、意想不到的事情也会发生。所以，既要乐观也要现实。你可以通过努力走出任何困境，这正是你需要关注的重点。


    审视你花钱购买的每一一样。大多数人可以削减得比他们想象的要多得多。例如，一位客户告诉我：“我的食品购物太贵了，我已经缩减到了最低限度。但这还是花了我一大笔钱。”经过讨论，她透露自己买的是那种裹着帕尔马火腿的鸡胸肉，并为她的五口人准备了新鲜意大利面。对我来说，那种东西应该是派对晚上的菜，而不是周中的家庭午餐。但在她看来，这是常态。虽然对于付负担得起的人来说没问题，但对我的客户来说，这从她紧缩的预算中夺走了她并不有的钱。她奢侈的食品购物阻碍了她储蓄和获得财务安全。


    立即开始偿还债务，即使你只还 1 英镑。你可能需要一两年的时间来还清，但首先必须养成还债的习惯。开始养成掌控自己财务的习惯。然后，一旦你清除了债务并养成了储钱的习惯，就可以继续谨慎用钱，积累储蓄并确保你的财务未来。不要在重复旧的坏习惯并积下更多债务的基础上建立财务未来。


    你的金钱观念可能是从家庭环境中遗传的。尝试识别你的坏习惯源于何处，以便纠正你的行为。你小时候，你的家里是否经常在饥荒与富足之间摇摆？你是否意识到你的父母欠有债务？你的父母是否是“先买后付”？他们递给你钱时，解释过它的价值吗？你小时候想要什么就能得到什么，所以现在指望拥有你所想要的一切吗？你的父母是否很有钱，而你现在正努力复制你小时候习惯的生活？


    *   你的过去是否给你的财务生活投下了负面魔咒？

    *   你是否意识到你父母的开支，现在想避免他们经历过的某些陷阱？

    *   你有哪些方面可以改进？


    ## 幸福是知足常


    你可能喜欢外出吃大餐、开好车、买新衣服和去奢华度假，但如果你负担不起，那么你*真的*负担不起。你必须接受这一点。这听起来可能很难，但如果你不接受，你的消费最终会追上你。你的财务是你的责任，不是政府的，不是家人的责任。你的财务问题是你私人的问题。如果你有孩子，在他们成年之前，他们也是你的责任，无论你是否和他们在一起。不要指望别人为你的财务决策买单。你需要为你自己和你的家庭负责。如果你在过去做出了错误的选择，你需要理解这些错误是什么，以便以后不再重犯，并从现在起做出更好的选择。始终相信**神奇的**解决方案，相信事情会圆满解决。


    我曾看到许多人因为生活超支且拒绝放弃他们认为的“必需品”的东西而失去房子。他们并没有改变消费或改善处境，而是简单地积压了更多债务。一旦有人失去了房子，他们往往很容易回过头来看到自己的消费有多么失衡，以及他们因为不接受现状而购买了负担不起的东西。但有些人在一切太晚之前不会改变。许多人不想听从朋友、妻子或丈夫那里听到他们负担不起自己想要的生活方式。


    试着听听那些财务安全的人怎么说，因为他们可能为你提供答案。


    有些人相信宇宙会供养他们。但一些人未能将此与商业头脑和行动计划相结合。人们生活在财务危机的边缘，期待依靠奇迹，而不是务实地创造财富。奇迹确实会发生，在它们发生时尽情享受吧。但也要在现实世界中脚踏实地。


    一位欠有债务并开了新网店的客户决定买一辆更大的车。她的业务类型竞争非常激烈，她每周只有几个订单。她卖的东西其实很小，完全可以提在手包里去邮局。她确实不需要一辆新大车。她本该视觉化并渴望拥有一项值得投资的业务。一个精明的生意人会保持低开支，直到业务能够证明进一步投资的价值。世界上所有的指导，如果不结合常识，都是没用处。


    我帮助过许多人通过积极思考和实际行动扭转了财务状况。你拥有的没有任何东西值得为了冒财务安全去购买。


    *   停止购买负担不起的东西。

    *   如果你连打折的东西都负担不起，你必须接受现实。

    *   停止追赶，你正在赌上自己的未来。

    *   记住，今天负担不起的东西，明天会给你带来压力。

    *   尽可能获得所有的财务支持和建议。

    *   和比你钱少的人比较，这样你会感觉更富有。

    *   如果你不断渴望，你永远无法停下来欣赏已经拥有的财富。

    *   精简一切以重获控制权。

    *   寻找免费的方式享受生活——去散步或跑步、看书、在公园野餐。

    *   为他人的好运感到高兴。受到灵感，而不是嫉妒。

    *   为你所拥有的钱感到自豪。感觉**棒极了**并微笑吧。

    *   说“拥有那些东西就好了”，而不是需要它们。


