- raw: 'You may have worried about specific things, played up or been rude, or you
    may have had low self-esteem, because your instinct was saying one thing while
    life and the people around you were saying something else. Then the inner battle
    with yourself began and every bad feeling masked the true, happy you. You stopped
    using your instinct, which was prompting you to do the right things. Instead,
    you followed half-hearted feelings or opted for safe options. Perhaps other people
    persuaded you against making the right decisions at times. Sometimes you were
    able to follow your instinct, but at other times you questioned your decisions
    and learned to go against what felt right for you. And you learned to feel bad
    about what you were doing.


    The good news is that you can change all this. It was your thinking that bent
    the circle, and it is your thinking that can make it circular again. It is time
    to get back to your true self and take back control of your mind. Remember that
    other people who bully, argue, annoy, self-doubt, are rude or jealous behave that
    way because they have experienced the same inner turmoil. Observe negative people
    and understand that they have their own problems or issues to deal with, which
    make them the way they are.


    *   STOP taking things personally: other people are in a troubled place too.


    *   STOP letting other people put you down and START believing in yourself more.


    *   Everyone is doing the best they can with the knowledge and personality they
    have. It may not be great, but it is the best they can do.


    *   Be around people who are right for you.


    *   Many of your personal characteristics and parts of your life are great, but
    an improved version of you would be AMAZING.


    *   Remember the good things you were taught at school, such as discipline, being
    focused and being able to follow a routine. Keep the good things and change the
    things you don’t like.


    Worries or fears may arise from time to time. Sometimes we have to work them out.
    At other times, worrying is unnecessary and doesn’t help at all.


    Whenever you have a negative thought, you could do the following techniques to
    prevent your feelings spiralling out of control. If we hold on to a thought and
    turn it over and over in our mind, it will become like tangled washing in a washing
    machine. Try to stop the bad thoughts as soon as they arise.


    *   Accept that bad thoughts are there, deal with them and let them pass.


    The thoughts in your head may be: ‘I feel rubbish. I hate myself. Life is unfair.’


    The answer in your head could be: ‘Great. AMAZING. That’s fine. But now I choose
    to let those thoughts pass by like clouds in the sky.’


    I teach these exercises to all my clients to help them control their feelings.
    Try using them regularly whenever you find yourself worrying, feeling nervous,
    anxious, hyperactive, stressed or being negative.


    ### *Clouds-in-the-sky technique*


    **To release negative thoughts or worry, use the fingers of your right hand to
    rub, tap or press the knuckles of your left hand to reassure yourself that everything
    will be fine. You can do this subtly in front of other people – if you clasp your
    hands, no one will notice you rubbing, tapping or pressing your knuckles. Say
    to yourself, ‘Let it go. Let it pass.’ Imagine the bad feeling passing by. Thoughts
    are fluid, moving objects that will pass like clouds drift across the sky if you
    allow them to do so. Repeat the exercise until the bad feelings pass and repeat
    it regularly throughout the day to ward off anxious or worried feelings.**


    ### *Red triangle technique*


    **Visualize a red triangle in your mind. Put the negative thoughts, fears, bad
    feelings, uncomfortable emotions, paranoid thoughts, bad habits and stress into
    the triangle. Then imagine the triangle shrinking until it is as small as a speck
    of dust. Then imagine blowing the speck of dust away. As the triangle disappears,
    you will create space for AMAZING solutions to reveal themselves to you during
    the coming days and weeks. You can say to yourself, ‘I am safe. It’s going to
    be fine.’ Repeat this exercise as often as you want. Presume that, from today,
    good things will come and people will have good things to say about you.**


    *   LIBERATE yourself by letting go of past grudges, worries and anxieties using
    the above techniques. Most things are not important.


    Anxiety is fear of the future: ‘What if something bad happens?’


    I teach clients, ‘What if something AMAZING happens? What if it turns out to be
    the best thing?’


    The next time you worry about the future, joke to yourself, ‘What if it is the
    most AMAZING thing?’ and SMILE.


    If something doesn’t happen, assume that something better will happen instead.


    If something goes wrong, embrace it, love it like a favourite pet: feel good about
    it and it will turn into something better.


    If you are worried about someone else, assume that things will work out AMAZINGLY
    well for them.


    **Always feel the feeling of things having worked out AMAZINGLY well.** This will
    enable you to bypass any negative worries or concerns, which in turn will keep
    you feeling better within yourself. Anxiety results from allowing the negative
    thoughts to spiral. So rein them in and try to feel positive feelings.


    Another technique is to imagine celebrating as if future events have already gone
    AMAZINGLY well.


    A client of mine was worrying herself into a state of frenzy about her daughter
    going away on a school trip on a coach. I got her to visualize her daughter stepping
    off the bus after the trip, safe, smiling and having had a nice time. It made
    the mother feel instantly in control and relaxed about her child. Using this ‘after
    the event’ visualization technique also made a massive difference to her life
    in general.


    Another client was worried that his house would flood during a period of extremely
    heavy rain. I used the techniques in this book with him to release his anxieties
    and told him to imagine that it had all worked out AMAZINGLY well. He imagined
    the floods had gone and his house had remained dry the whole time. When he came
    back a few weeks later, he said that his house was one of very few properties
    in the village that had not been flooded and he told me, ‘It is AMAZING!’


    When it comes to local and world news, imagine all the issues in the world sorting
    out AMAZINGLY well. Throughout history, people all over the world have overcome
    all sorts of problems. I watch the news to know what is going on, but I don’t
    allow myself to get caught up in the negative drama. Whatever the results of an
    election or referendum, I presume that it will all work out in the end. Perhaps
    the events will lead eventually to better outcomes, maybe five or 10 years down
    the line. Whatever is happening in the news learn to manage your mind and your
    feelings. Remember, the news doesn’t include all the good things that are happening
    around the world. So don’t focus on the things that don’t work. Instead, think
    about all the people who are working hard to make a real difference to other people’s
    lives on a daily basis.


    **Feel good about things and imagine positive outcomes. Use the SMILE technique
    to help you feel good feelings. Speak a positive language in your head and run
    a positive film of events in your mind.**


    If someone is going on a plane journey, imagine they have arrived at their destination
    safe and well, or have returned home safely after their holiday, and that they
    are back at home telling you about their AMAZING trip. Imagine them in bed, safe
    and sound.


    If you are applying for a job, imagine you are already working in that job. If
    you don’t get that job, do the same with the next one you apply for. Feel the
    feeling of doing the journey to and from that place of work. Eventually, with
    this positive attitude, you will get an AMAZING job.


    If you worry about your children, feel the feeling of them being grown-up and
    happy in their lives, doing AMAZING jobs, having AMAZING relationships and living
    in AMAZING homes.'
