- raw: 'Let go of events in the past that perhaps your partner can’t let go of. Rub,
    press or tap the knuckles on your left hand using the fingers of your right hand.
    The past might have been stressful, but it is only the events of today that you
    need to deal with. Take each day moment by moment. Don’t engage in battles. Doing
    so will only fuel a negative, destructive fire. Instead, diffuse situations as
    if you were dampening a fire with cool, calming water. You can close your eyes
    when you repeat this technique.


    *   Lower expectations of each other.


    *   Work together as a team.


    *   Encourage each other.


    *   Praise each other.


    *   Presume things will work out AMAZINGLY well.


    *   Be yourself but be flexible within your relationship.


    Life is a series of beginnings and endings. So embrace where you are with each
    person in your life, knowing that any bad feelings within the relationship can
    end and comfortable feelings can begin at any point. Do your best to get your
    relationships into a positive place for you. Use the AMAZING to feel things working
    out well. Feel free and let others be free too. Help other people to see the way
    through things as you learn yourself.


    I have helped many clients over the years to see their relationships differently,
    and most people have gone on to have very happy relationships once they have let
    go of the tensions that had built up.


    Anyone is capable of being stuck in their own ways. Ask yourself, ‘What can I
    change about myself? How can I improve who I am? What can I do to improve my relationships?’
    As you change for the better, those around you will change too as you create new
    habits of communication between you. You can’t change others, but you can change
    yourself.


    ### *Watching technique*


    **Try to be in the moment. Instead of being bored or stressed by the person you
    are listening to, watch their lips moving. You will find you enjoy watching their
    enjoyment, as they tell you what they have to say. SMILE to yourself. Enjoy seeing
    other people happy to be speaking. Let other people’s conversations relax you.
    Be interested in other people, even if they are talking about something that isn’t
    of any interest to you, for example football, shoes, dance, computer games…**


    From time to time, try something your partner likes and you might find that you
    actually quite enjoy it too. For example, you might not like scented candles,
    but you may find you don’t mind them when you are feeling more relaxed. Or you
    might not like watching sport, but if you and your partner sit together occasionally,
    you might find you enjoy it. If you like different things, then both find the
    time to pursue your own interests as well as doing things together. If one of
    you wants to go shopping and the other wants to watch sport, each of you do your
    own thing and then meet up for a coffee afterwards. But if your help is needed,
    be there for your partner. It is all about balance. No one can do everything they
    want all of the time.


    Think about the different strengths you and your partner bring to your relationship.
    Perhaps one of you is more technical, creative, practical or organized. In a work
    environment, companies employ people who are good at whatever their particular
    job requires them to do. In a relationship, decide which of you is good at which
    jobs and then divide up the tasks so that each of you is doing the ones you are
    good at or don’t mind doing. The tasks that neither of you has any interest in
    or ability for will have to be shared. Do those tasks together or pay someone
    else to do them.


    If you both stick to these principles, you can overcome a lot of the irritation
    caused by everyday tasks. The difficulties arise when one person in the relationship
    is unable to be flexible or is unwilling to see both sides of a situation. When
    that happens, you may end up in stalemate. If you are struggling to communicate
    with your partner, try all the techniques in this book. Most people can resolve
    their relationships. If yours can be fixed, it will be. If not, you will both
    have to move on.


    Don’t be tricked into thinking that the grass is greener on the other side of
    the fence. You could find yourself in a similar situation. Perhaps you were half
    the problem. Sort out your problems and help your partner to sort out theirs by
    working together. Be spontaneous. Get out of any ruts you may be in. Be happy
    in yourself.


    ## Meetings


    Support your partner in every way – in work, at home and with your children. Have
    a meeting to discuss what needs to be said, just as you would have an appraisal
    at work. That way, you can bring things up in a controlled setting. Whatever goes
    on in the meeting can remain in the meeting, rather than allowing the emotions
    to be carried with you into your everyday life.


    In any relationship, there will be difficult issues that may need to be addressed,
    so accept this and deal with them in a calm way. Then put closure on the discussion.
    Try to leave any bad feelings in the meeting. It isn’t always possible, but it
    will become easier as you get used to dealing with life this way.


    You can also say to yourself, ‘Cut the crap and feel AMAZING,’ knowing things
    will work out AMAZINGLY well as the result of making lots of small changes.


    ## Sex life


    Both men and women can feel dissatisfied with the sex within their marriage or
    partnership. Don’t think that an affair will solve your problems. It won’t. If
    you build your relationship from the roots up, you will build an interesting,
    strong relationship. Look at the good things about you and your partner and work
    through the things that you both need to change. It may be a series of choices
    and decisions that have blown your relationship off course. So it is through new
    choices and decisions that you can get it back on course again and keep it there.
    If you do things differently, you will get out of the rut and create a relationship
    with a sparkle. ‘Snapshot’ in your mind the good times you create from now onwards
    so that you build a bank of AMAZING zone relationship feelings.


    At the end of the day, all relationships are about feeling comfy with your slippers
    on and eating dinner together. British comedian Russell Brand once said in an
    interview when asked about what it was like to live with American singer Katy
    Perry, ‘It is just the same as anyone else, talking about everyday things such
    as “Do you think the cat needs to go to the vet?”’


    If you are not sexually compatible, find ways to change that, such as massage
    or dancing to your favourite love songs with no sexual pressure. Tell your partner
    regularly how beautiful/handsome they are. Talk about the fun you had when you
    first met and make new, happy memories by going to nice places together. Remind
    each other of the things you like about each other. Build trust.


    Learn to be close without expecting to have sex and eventually, in most cases,
    if you don’t put pressure on your partner, it will develop. Tell your partner,
    ‘I don’t want sex. I just want a cuddle.’ After cuddling, leave them wanting more.
    People are not machines that can be turned on and off.


    Many arguments arise because people are distracted by the things going on around
    them, by technology, sport, kids, work, family or friends. When that happens,
    it may be that the only time someone pays any attention to their partner is when
    they want sex, which is very off-putting. Or maybe they don’t want sex with their
    partner because they are tired or cross with them. Agree to stop insulting each
    other or saying things that are insulting to men or women.'
