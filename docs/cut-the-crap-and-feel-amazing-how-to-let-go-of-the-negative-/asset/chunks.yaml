    # INTRODUCTION


    Every action in life has a consequence, which might be brief and contained or,
    like the ripple created when you drop a pebble into a lake, may spread out. Sometimes,
    situations arise in our lives as the result of our own actions and reactions,
    and sometimes other people’s actions send out the ripples that create our reality.


    As children, we have little, if any, control over the circumstances of our lives.
    And although we have more control as adults, the choices and decisions we make
    will be based on our upbringing and childhood experiences. But whatever those
    experiences have been, each one of us ultimately has the ability to steer our
    own life course.


    I was able to write this book because of my life experiences, because of the questions
    I have asked, the answers I have discovered, and the years I have spent working
    as a therapist, helping people to improve their mindset and cope better with their
    own lives.


    Life is simply a series of phases, each one leading you on to the next, which
    is something worth remembering if you’re experiencing stressful or challenging
    times: whatever is happening is a phase and you will pass through it.


    In 2002, my life looked perfect – from the outside. Behind the scenes, however,
    my 19-year marriage was falling apart. And so was I. In the autumn of that year,
    I had a mental breakdown and spent a period of time in a psychiatric unit, which
    is when my whole world changed. My life flipped dramatically from working and
    being a mother to my gorgeous 10-year-old daughter to later living alone in a
    bedsit.


    I had been a kind and caring person, but in the process of always looking out
    for others I had ignored my own needs for too long, until eventually I’d become
    so swamped by everyone else’s cares and responsibilities I lost myself. Then,
    after my marriage broke down, the people I assumed would be there for me, weren’t.
    I know for some of them it was because they were scared by my behaviour during
    my mental breakdown and didn’t know how to react to me.


    The bottom line was that as well as losing my mind, I lost custody of my daughter,
    my home, my family, my friends, my dog, my money, my car and my belongings. It
    was as if my entire world had been erased like chalk from a blackboard. As a loving
    and devoted mother, I had spent 10 years trying to make my daughter’s world perfect.
    Then, in one fell swoop, I had let her down. I did eventually rebuild my relationship
    with her, but it would be eight years before I saw her on her birthday again,
    and even longer than that before I spent another Christmas day with her. What
    I missed most during that time was just being there for her and doing all the
    normal things we take for granted.


    Through the most difficult and lonely times, I struggled to rebuild my life and
    come to terms with the fact that I couldn’t simply step back into the world I’d
    dropped out of, because my breakdown had changed everything. Instead, I had to
    search for ways to help myself so that I could be strong, not only for my own
    sake but also for my daughter. I chose not to take anti-depressants during that
    time, because I knew that they would simply mask my underlying problems. What
    I had to do was face my circumstances head on and learn to cope with my new reality.


    I made a decision quite early on during the period of my recovery that, somehow,
    my life would be AMAZING, despite everything that had happened. Today, perhaps
    the most AMAZING thing about it is the relationship I now have with my daughter.

