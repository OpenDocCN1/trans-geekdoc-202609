- raw: 'When you make love to your partner, you feel attraction. Touch, smell and
    all your other senses are absorbed, which contributes to the closeness you share
    with your partner. When you watch pornography, you are allowing a sexual image
    to stimulate you rather than a one-to-one connection with a partner. The mind
    can become overloaded with imagery and sexual expectation so that you become addicted
    to the reward in the same way you would become addicted to substances that create
    good chemicals in the body.


    ### *Pornography and relationships*


    A healthy relationship requires both parties to engage with each other. Anything
    that distances you will damage your relationship. Watching pornography behind
    your partner’s back will not contribute to a healthy, happy, long-term relationship,
    because your partner may find out what you are doing and feel betrayed.


    I knew a couple who were not living together in the week and who found that they
    were drifting apart. The woman was sexually excited to see her partner at the
    weekends, but he was less interested. They eventually realized that whereas she
    looked forward to being intimate with him at the weekends, he was watching pornography
    while he was away so was not as excited to see her. After talking it through,
    he decided not to watch pornography during the week and their sex life improved
    again.


    If your partner is open to watching pornography with you occasionally, you may
    do this together. But be sensitive and do not put pressure on them, as they need
    to feel comfortable and watching pornography isn’t for everyone. What’s important
    is having fun with your partner, laughing together and being close. Romance your
    partner and make them feel special.


    If you watch pornography on your own, you are only developing the visual image
    of sex in your mind, not the ability to have a healthy physical relationship with
    a partner. It may hamper you from getting out there and finding a healthy relationship,
    and when you do find someone you want to go out with, you may have unrealistic
    expectations of how they should look and perform sexually. You may have a distorted
    view of what is normal and acceptable in a sexual relationship with your partner.
    When you meet a partner, they are unlikely to find your pornography habits attractive.
    Romance is essential for a happy, balanced relationship and pornography can stop
    you making an effort to be romantic because you want instant results.


    ### *Red triangle technique*


    **Imagine a red triangle in your mind. Imagine putting all the pornography you
    have watched in the past into the red triangle and then shrink the shape down
    in your mind. Repeat this technique several times to help reprogram your mind.
    Imagine having a healthy, happy relationship with your partner.**


    *   Wean yourself off images.


    *   Use hypnotherapy recordings to break the habit of your pornography addiction.


    *   Make a conscious effort to connect with your partner.


    *   Focus on the feeling of being with your partner in a loving relationship.


    *   Create a happy relationship in which sex is part of your life, not the only
    focus.


    *   Read the chapter on relationships ([Chapter 9](../Text/chapter09.xhtml)).


    ## Shopping


    The shops are filled with beautiful items and AMAZING designs. There will always
    be something you want to buy. But you can’t always have new things. Accept this,
    make the most of what you do have, enjoy looking at all the lovely items on sale,
    but leave them in the shops.


    *   Set yourself a budget of what you can spend each year and split it between
    the seasons.


    *   Use your money wisely.


    *   It takes a lot of time and effort to earn money and only a few minutes to
    spend it, so think about what you are doing.


    *   Appreciate what you already have.


    *   Sell items you no longer want.


    *   Never buy on credit. If you can’t afford it today, you can’t afford it – full
    stop.


    *   Keep track of everything you are spending.


    *   Spend less than you earn.


    *   Remember that there are people who have less than you have.


    SMILE about what you have already.


    ### *Spending money*


    Getting caught up in an addictive spiral of spending money you don’t have is no
    different from having any other kind of addiction. Be prepared to hear the truth
    about what you are doing. Your spending is your responsibility. Don’t be selfish
    and expect other people to pick up the pieces when you overspend. You have to
    accept that if you can’t afford items, you can’t have them. Learn to budget and
    save up for the things you want. Remember that the amount of money coming in needs
    to be more than the amount you spend.


    SMILE as you think about being debt free and then follow the steps described in
    [Chapter 7](../Text/chapter07.xhtml) to become debt free.


    ## Smoking


    When you are really positive and living a good life, smoking will not be part
    of that life, as it goes against the grain of healthy, happy living. Smoking is
    masking your real inner feelings. Smoking suppresses your true emotions so that
    you can cope with daily life. When there is a crisis, smokers go straight outside
    to light up, whereas non-smokers can process the stress without a cigarette.


    You may want to believe that it is just a chemical addiction, but smoking is also
    an escape from what has happened or is happening in your life. Learn to deal with
    your stresses and emotions without a cigarette. Little by little, change your
    life and then let go of smoking. Giving up smoking will enhance your life in every
    way, but it is important to sort yourself out first, otherwise you could pick
    up another bad habit to try to cope with stress, such as drinking or eating more.


    For most smokers, hypnotherapy is a great tool for saying goodbye to cigarettes,
    cravings and emotional issues. You may need to go for a few sessions, but the
    money you invest in giving up is money well spent. You won’t know whether it will
    work for you unless you try it.


    ### *Goals*


    Set yourself a positive goal that you will only achieve if you’re fit, such as
    training to run a marathon, doing a charity run or going on a hill-walking or
    biking holiday. That way, there will be a real purpose to stopping smoking.


    ### *Photo cigarette diary*


    **Use your phone camera to make a photo cigarette diary by photographing everything
    you smoke so that you really see how much you are smoking. I suggest taking a
    picture of each cigarette before you smoke it and then another of the butt after
    it is smoked. Share the pictures with a supportive friend so that you have to
    face up to what you are doing.**


    SMILE throughout your day to create positive feelings and think of all the things
    you will be able to do with the time you used to spend smoking.


    ## Stress and anxiety


    Could you be doing too much so that feeling stressed is a way of life and you
    have become addicted to it? Or do you tend to over-think everything so that you
    become worried about things you don’t need to worry about?


    Any time you notice yourself worrying about something, talk yourself into the
    positive as if you were reassuring a friend. Speak to yourself about how you would
    like things to work out. Tell yourself, ‘It will work out AMAZINGLY well.’ Rub,
    press or tap the knuckles on your left hand with the fingers of your right hand
    and imagine the problem passing like a cloud in the sky as you say the words,
    ‘Let it pass.’ (There are more tips in [Chapter 3](../Text/chapter03.xhtml) about
    how to let go of worries.)


    SMILE and think of the times when things worked out well.


    ## Technology, social media and phones


    Limit your use of technology, social media and phones. If you don’t, using them
    could take over your life, affect your relationships and stop you reaching your
    true potential. See technology as a tool to help you in your life, but don’t allow
    it to *become* your life.'
