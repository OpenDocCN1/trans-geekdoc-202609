- raw: 'Try to see this health journey as an adventure on which you will meet AMAZING
    people along the way. You will have AMAZING tests, which will help you get the
    correct diagnosis, and you will find out what is wrong in the best way so that
    you can get AMAZING treatments and solutions to help you through this phase of
    your life. You will enter into a whole new world and you will enjoy the experience.


    People often fear medical tests, but each time you have a scan, blood test or
    any other diagnostic test, say to yourself, ‘This is AMAZING for me. This is good
    for me. This is helping me get as well as I can be.’ If you are receiving treatment,
    say, ‘My body is responding AMAZINGLY well to this treatment.’


    Imagine a year from now when everything has worked out AMAZINGLY well. Focus on
    the day after the procedure, operation or treatment as if it has all gone AMAZINGLY
    well. This will help create a bright future in your mind and bypass all the ‘what
    if’ worries. Say, ‘What if it is AMAZING?’


    If you do receive a difficult diagnosis, you can still imagine it has worked out
    as AMAZINGLY as it could have done, and you may be pleasantly surprised – maybe
    because you are offered a revolutionary new treatment. Do everything you can to
    improve your condition and think AMAZING as much as possible. Keeping calm will
    be beneficial to your health.


    ### *Wave technique*


    **Imagine being on a beach at the water’s edge. Imagine the gentle waves washing
    in and out. Be aware of the flow of the water and the movement of each wave. Every
    wave is different. Every wave is fluid. Every wave is moving. Just as each day
    is different and flowing, your body is different from everyone else’s and you
    can find what is best for you. Flow with the treatment. Flow with any tests. Flow
    with life and solutions. There is always something to discover, so be open to
    opportunities that might come your way. Repeat the technique any time you think
    about health issues.**


    Try to enjoy every day as best you can. Try to find positives in your life, even
    with an illness to cope with.


    I was helping a friend who was going through a health scare. ‘Start really living
    every day from now onwards,’ I told her. ‘Get yourself a napkin holder, fill it
    with beautiful, colourful paper napkins and use them every day as a reminder that
    today is special. Don’t wait for birthdays and holidays to use a nice napkin.
    Live in the moment.’


    You may wonder how this could help but, for many people, using a nice napkin really
    does feel special. As the napkins sit on the table, you will see them every day,
    and as mealtimes occur every day too, you will be reminded regularly to be positive.
    The napkins will help to distract your focus from any negative things going on
    around you. My friend said that seeing them on the table was comforting and made
    her feel positive about her situation. She took a photograph of them so that she
    could look at it when she was out and remind herself, wherever she was, to say,
    ‘Things will work out AMAZINGLY well.’


    What are you waiting for? Feel AMAZING every time you pick up a napkin and, remind
    yourself of the great things in your life. A health crisis can be a nudge to push
    you towards living life to the full. If you have a friend who is unwell, buy them
    a really nice napkin holder, fill it with colourful napkins and tell them this
    story. A bunch of flowers is a colourful gift, but flowers only last a few days,
    whereas napkins are a reminder at every mealtime, every day that things will work
    out in the most AMAZING way.


    People often expect doctors to have all the answers and to be able to provide
    them with a magic pill to take away all their illness and worries. In reality,
    you need to do some of the work yourself. Many symptoms can be caused by stress
    and anxiety, including stress headaches, poor sleep and various aches and pains.
    Always consult your doctor/nutritionist, but be open to trying different relaxation
    techniques and make sure that your diet and lifestyle support good health.


    Most employers do little to invest in their employees’ wellbeing, so it is up
    to you to keep as well as you can and to deal regularly with work pressures. Hypnotherapy
    recordings offer affordable solutions – you can listen to them at bedtime as you
    fall asleep. Hypnotherapy can help change bad eating, drinking and smoking habits
    as well as tackling stress and disrupted sleep, which will directly affect your
    physical health. As you start to feel more relaxed, you will be able to think
    of solutions rather than getting caught up in negative thinking.


    Create boundaries in your life to support your health, limit the time you spend
    with people who drain you, limit your working hours, and switch your mind off
    from work in your spare time.


    *   Spend a couple of minutes every day SMILING and saying to yourself, ‘I have
    an AMAZINGLY healthy body.’


    If you are unwell and can’t find out what is wrong with you because there is no
    clear diagnosis, do everything described above to make yourself as positive and
    relaxed as possible. Then use your energy to keep going until you do get a diagnosis.
    I tell all my clients the same thing: keep going until you find out what is wrong.
    By believing in the AMAZING outcome, you will be in the right place at the right
    time to get the best diagnosis and treatments available. But it is also important
    to do everything you can to look after yourself.


    Health is not just a black-and-white issue: ‘I am ill so that is that,’ or ‘I
    have this illness and there is nothing I can do.’ There is always something you
    can do. Remember the grey area where the solutions for change are. Even if you
    are too ill to get out of bed, you can use positive mind techniques to stay calm.
    When you are calm, your body can use its energy for healing. When you are angry,
    everything seems much worse, both physically and psychologically.


    Think of all the things you could do to help yourself and visualize yourself well.
    Learn to stand up for yourself to get what you need from health professionals.
    Do your own research. If doctors are unable to help you, you could suggest ideas
    to them that might open a new avenue of investigation. Your body is complex and
    there could be something that has been overlooked.


    I was very ill after my daughter was born in 1992. I had so many symptoms, aches
    and pains, as well as fatigue and brain fog. I was housebound and at times struggled
    even to pick up my daughter. The doctors could not work out what was wrong with
    me. But I knew there must be a solution to my problems, and I was determined to
    find it.


    Eventually, after two and a half years, it was discovered that I had a severe
    hormone imbalance. I was given a new hormone treatment and within five weeks my
    symptoms had resolved. Once I was well, when I met friends in the street or went
    into local shops with my daughter, she would tell people, ‘Mummy doesn’t sleep
    in the afternoon any more.’ It was a complete revelation to her to see me well,
    because she had lived through the illness too.


    So remember that you are not just getting better for yourself. You are also doing
    it for the people who love and depend on you.


    ## Keep in the positive


    ‘I can get through this. I am getting through this. I am doing it.’


    SMILE and keep reminding yourself that it’s all working out AMAZINGLY well. Turn
    your experience into something AMAZING. Try to enjoy what you can about this phase
    of your life. For me, even though it was a physically tough time, the AMAZING
    part of it was the time I spent at home with my daughter when I was unwell: if
    I had been well, I may not have taken time off work to be with her.


    Medicine is evolving all the time, so a new test or treatment may soon be available.
    Every day, people all over the world are getting better. Find the positive in
    where you are with your health.'
