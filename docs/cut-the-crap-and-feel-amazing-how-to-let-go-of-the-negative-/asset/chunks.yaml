    \n*   Use the wiggly string technique: imagine the future as being like a wiggly\
    \ string leading you on an AMAZING adventure.\n\n**STEP 1. Identify the negative.**\n\
    \n**STEP 2. Consciously let the negative go.**\n\n**STEP 3. Say, ‘What if it is\
    \ AMAZING?’**\n\n* * *\n\n*By making good choices and decisions,  \n\nyou can\
    \ create an AMAZING life.  \n\nWhat are you waiting for?*\n\n[![CHAPTER 4: CHOICES\
    \ AND DECISIONS](Images/ch04.jpg)](../Text/contents.xhtml#toc4)\n\nIf you analyse\
