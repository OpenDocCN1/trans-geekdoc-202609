    I was on a train recently when a young woman phoned her boyfriend and told him
    all about her day, every detail from the moment she left home until she got on
    the train. She told him about a jacket she had bought, explaining why she bought
    that one and not another one, and then she said, ‘Okay, well I have to go now.
    I’m getting off the train. I’ll see you in a minute, outside the station.’ The
    whole carriage had heard all the details of her life because she couldn’t wait
    until she could talk to her boyfriend in person.


    *   Never use technology rather than talking to the people around you.

    *   Be balanced with your use of technology. Be aware that the overuse of technology
    can cause arguments.

    *   Make an agreement with friends to turn off your phones so that you can have
    meaningful conversations.

    *   Wait until you see people in person to tell them your news.

    *   Avoid being obsessed about getting in contact with people.

    *   Avoid constantly checking the news and social media.

    *   If you are in the company of someone when your phone rings, don’t automatically
    answer it. Respect the person you are talking to.

    *   Switch your phone to ‘flight mode’ before you go into the bedroom. Your alarm
    will still ring, but you won’t be disturbed by messages, alerts or radiation from
    the device.

    *   Avoid watching television or using technology in your bedroom.

    *   The last thing you hear before you go to sleep will be in your mind, so make
    sure it is positive. Perhaps play calming music at bedtime.

    *   Hypnotherapy can help reprogram your bad habits.


    SMILE so that you are happy in everyday living. Instead of being absorbed by technology,
    notice your surroundings – the leaves on the trees, the sun shining – and the
    people around you.


    ## Theft


    Thieving is a bad habit, just like any other bad habit. Perhaps you want things
    that you can’t see any other way of getting. Or you take things simply because
    they are there and because you can. Or you think you deserve the things you take.
    Or you think you’ll be happier if you have a particular item. Or you think that
    the people you are taking something from can afford to lose it.


    Once you see thieving as a habit, you can begin to change it by making different
    choices and decisions. For example, avoid going to places where you would have
    stolen things in the past. If you feel the items you want are out of your reach,
    you are thinking in the black-and-white zone, not the grey zone where solutions
    are found.


    Instead of saying to yourself, ‘I need to steal this item because I can’t afford
    to buy it,’ say, ‘If I change my choices and decisions in life, I might find a
    way to live my life differently.’


    Tell yourself, ‘Maybe one day I could have these things’.


    Instead of saying, ‘I can’t afford these things, but I can take them without getting
    caught,’ say, ‘I probably don’t even need these things. Maybe I can become wealthier
    through making AMAZING choices and decisions to improve my life.’


    ### Red triangle technique


    Visualize a red triangle in your mind. Put the negative thoughts about wanting
    things that are not yours into the triangle, together with the problems and the
    behaviour. Then shrink the triangle down in your mind until it is as small as
    a speck of dust and imagine blowing the speck of dust away. As the triangle dissolves,
    you will allow AMAZING solutions to reveal themselves to you over the coming days
    and weeks. Feel good about yourself for being in control of your choices and decisions.
    Repeat this exercise as many times as you want. Presume that good things will
    come from today and that people have good things to say about you.


    ‘AMAZING things happen to me because I make good choices and decisions. I find
    AMAZINGLY positive ways to make my life go smoothly.’


    ## Work


    Try to break the habit of overworking by being aware that that’s what you are
    doing. You may feel as though you are constantly chasing your tail because you
    believe that this is the only way to behave. Start believing that you can be successful
    and be calm and relaxed. Once you have made your mind aware that you are doing
    too much, you can start to come up with solutions to fix the problem. I suggest
    calming yourself down by just being aware at intervals throughout the day of being
    in your own body. Say to yourself, ‘I get everything done in less time.’


    Gradually work to take back control of the situation. Set boundaries, such as
    turning off your phone after work, and make time for family, friends and interests.
    Listen to calming relaxation music at bedtime and get night’s sleep.


    ## Techniques to help release


    ### Talk-to-photo technique


    Find a photograph of yourself when you were happy. Look at the photo and tell
    yourself what you need to change. Speak the words ‘You are worth so more than
    this. You can get out of this. Start believing you can work through this. You
    are AMAZING. I am here for you.’ Repeat this exercise.


    ### New music technique


    Take a few minutes in private to listen to positive music that feeds your soul.
    SMILE as you do this. You can move freely. Choose new, different styles of music
    rather than old favourites that might remind you of past events. From now onwards,
    it is about creating ‘new’ positive experiences.


    ### Positive future technique


    Train your mind to see positive images of your life without the addiction. Speak
    the words of the person you want to be. Be aware of who or what has helped you
    along the way. Appreciate every little step and keep moving forwards. If something
    helped you before, try it again. Build an armament of the things that help you.


    *   Visualize yourself living your life without the addiction.

    *   Say, ‘I can be in control. I am in control. I make healthy choices.’

    *   Use the red triangle technique: put the addiction into a red triangle in your
    mind and shrink it down until it is like a speck of dust.

    *   Talk to a photo of yourself. Say, ‘You can turn this into a positive. You
    can work through this. You can get over this.’ own*   Move freely to positive
    new music that makes your soul sing.


    **STEP 1. Identify your problems.**


    **STEP 2. Feel more positive about things working out AMAZINGLY well.**


    **STEP 3. Change your lifestyle to create new habits that let go of your addiction.**


    Cut the root of the addiction, free yourself and feel AMAZING.

