  trans: '


    *   专注于提升你的财富。

    *   在体验享受时，要懂得感激。

    *   通过自我暗示让自己向积极的一面：“我可以做到。我正在做。它已经完成了。”

    *   将**卓越（AMAZING）领域**与商业头脑相结合。

    *   通过重新训练、提高技能或执行想法来增加你的财富。

    *   使用“卓越”一词将你的财富目标写成积极的陈述。正着和倒着写下这些陈述，然后将列表放在你每天都能看到的地方。

    *   在脑海中“快照”积极的财富体验，以建立你的卓越财富库。


    ### 步骤 1. 安全且明智地储蓄/投资。


    ### 步骤 2. 增加收入。


    ### 步骤 3. 在你的卓越财富基础上不断发展。


    ***


    *每段关系都需要经营。


    *你可以选择疏远，也可以选择共同成长。*


    ![第 9 章：关系](img/contents.xhtml#toc9)


    世界上的不同角色需要不同的人，因此不同的特征至关重要。在最近一次与一位火箭科学家亲戚的交途中，他建议所有孩子在学校都应该被分流到工程专业，因为工程师非常短缺。


    “这并不是适合每个人的正确道路，”我说，“相信我，我不会成为一个合格的工程师。这并不能引起我的共鸣。”但他不同意，认为每个人都有这种能力。


    几小时后，我们和其他几位家庭成员一起去购物，因为那位火箭科学家需要一些新衣服。进入马克斯与斯宾商店（Marks and Spencer）后几分钟内，我就安排了店员为他量尺寸，然后从架子上挑选了挑选完全合身的裤子、衬衫和外套。我的亲戚住在国外，那里的服装店衣服选择比英国少得多，看到我知道什么衣服适合他并能找到合适的尺码，他非常松了一口气。这一经历恰恰证明了我的观点：我和我的亲戚拥有不同的技能，每个人都是如此。而这是一件好事。正如我们当时达成一致的那样，你肯定不想坐我设计的火箭飞向月球，而你可能也不想让我的亲戚为你挑选衣服！


    但尽管我们都有不同的技能，所有的关系本质上都是相似的。我的意思是，你会喜欢某人的某些地方，也可能对他们有某些不喜欢的点，或者他们看待问题的方式与你不同。这完全正常。你无法与任何人在任何时候达成一致。对于某些人，你认同的事情会比分歧的事情多；对于另一些人，你们可能很少有共识。没有人能一直让你满意，因为每个人看待事物和应对生活的方式都不同。但如果你将差异看作是有趣的并互相学习，你仍然可以与人们相处得很好。


    **试着不要将事情看作“非黑即白”、“他们的方式”、“我的方式”或“唯一的方式”。相反，请记住灰色地带，那里是寻找解决方案的地方。学会通过放宽自己的观点、接受他人的观点，并意识到有许多处理问题的方法，在家庭、工作以及与朋友之间的所有关系中游刃有余。始终保持开放态度，从他人的角度来看问题。**


    以下是我所指的例子。


    黑色：“我想预订假期。”


    白色：“我不想，所以我们不打算预订。”


    灰色：“我希望你能过个假，但我认为我们负担不起*这次*假期。我愿意找一个更便宜的。老实说，如果我们预订了一个我觉得无法轻松支付的假期，我将无法放松和享受，这会违背了休息的初衷。”


    **为了化解争论或分歧，你可以说：**“和你不同。你和我不同。这就是为什么我们看待这个问题的角度不同。但没关系。让我们讨论一下如何处理我们不同的意见，以找到一个我们都满意的解决方案。”


    有些人更感性，而另一些人则更有逻辑、更务实。不同类型的特质是有用的。所以要互相学习，以建立平衡的关系。不要看人们不能做什么。要看他们*可以*做什么，因为那是他们的长处。如果不同的人利用自己不同的长处，可能更容易更容易取得更多成就。


    **非黑即白的思维没有留下任何讨论的空间。灰色地带是你梳理事情的地方。一段健康的关系是双方对讨论开放的。**


    对自己说：“我可以让这段关系运作良好。它正在运行良好。”或者，“我可以找到卓越的方法与伴侣良好沟通。”即使你和伴侣没有达成一致，你可能也会找到解决问题的方法。


    太多的人花了太多时间抱怨和关注关系中哪里不起作用，而不是关注哪里*正在*起作用，或者寻找解决问题的方法。


    ### 相册技巧


    **将过去的事件看作脑海中的旧照片，归档到合适的相册中，这样你就可以将其存档并继续前进。你可以选择原谅过去发生的一切。你不需要自己之外的任何认可。然后，将你的过去和未来看作一条坚实的垫石之路。当你放下负面情绪时，你就能创造一段卓越的关系。你和你的伴侣可能共同取得了很多成就。开始对那些好事感到愉快，并列出一份不起作用的事单。坐在一起讨论如何改进。**


    人与人之间许多细微的坏感觉是由荒谬的事情引起的，例如某人在茶里加多少牛奶，咖啡里加多少糖，或者食物里加多少盐。每个人对食物和饮料的口味不同，在生活中也是如此。试着尊重这一点，并享受与周围人的共同点。大多数问题是可以解决的，所以选择去解决问题。只有当你尝试了一切方法后，才应该分道扬扬。如果你试图逃避问题，它们只会一直跟着你。


