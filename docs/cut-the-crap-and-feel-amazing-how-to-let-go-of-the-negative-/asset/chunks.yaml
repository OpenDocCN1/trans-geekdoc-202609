- raw: "*   Focus on improving your wealth.\n\n*   Appreciate a treat when you experience\
    \ it.\n\n*   Self-talk yourself into the positive: ‘I can do it. I am doing it.\
    \ It is done.’\n\n*   Combine the AMAZING zone with a business head.\n\n*   Retrain,\
    \ improve your skills or follow through with an idea to increase your wealth.\n\
    \n*   Write your money goals as positive statements using the word AMAZING. Write\
    \ the statements backwards as well as forwards, then place the list somewhere\
    \ you will see it daily.\n\n*   ‘Snapshot’ in your mind positive wealth experiences\
    \ to build your AMAZING zone bank.\n\n**STEP 1. Save/invest safely and wisely.**\n\
    \n**STEP 2. Improve your income.**\n\n**STEP 3. Build upon your AMAZING wealth.**\n\
    \n* * *\n\n*Every relationship needs to be nurtured.  \n\nYou can either grow\
    \ apart or grow together.*\n\n[![CHAPTER 9: RELATIONSHIPS](Images/ch09.jpg)](../Text/contents.xhtml#toc9)\n\
    \nThe world needs different types of people for different roles, so different\
    \ characteristics are important. During a recent conversation I had with a relative\
    \ who is a rocket scientist, he suggested that all children should be streamed\
    \ at school into engineering as there is a shortage of engineers.\n\n‘It wouldn’t\
    \ be the right path for everyone,’ I said. ‘Believe me, I wouldn’t be a good engineer.\
    \ It just doesn’t resonate with me.’ But he disagreed, saying that everyone is\
    \ capable.\n\nA few hours later, we went out shopping with several other family\
    \ members, because the rocket scientist needed some new clothes. Within minutes\
    \ of going into Marks and Spencer, I had arranged for a shop assistant to measure\
    \ him and then picked off the shelves trousers, shirts and jackets that fitted\
    \ him perfectly. My relative lives abroad, in a country where there is far less\
    \ choice available in clothes shops than there is in the UK, and he was very relieved\
    \ that I knew what clothes would suit him and was able to find them in the correct\
    \ size. The experience rather proved my point: my relative and I have different\
    \ skills, as we all do. And that’s a good thing. As we agreed at the time, you\
    \ certainly wouldn’t want to fly to the moon in a rocket I’d designed, and you\
    \ might not want my relative to choose your clothes!\n\nBut although we all have\
    \ different skills, all relationships are basically the same. What I mean is,\
    \ there will be some things you like about a person and there may be some things\
    \ you don’t like about them, or they may just see things differently from you.\
    \ That’s totally normal. You can’t agree on everything all of the time with anyone.\
    \ With some people, you will agree about more things than you disagree about;\
    \ with others, you may have very few points of agreement. No one is ever going\
    \ to please you all of the time, because everyone has different ways of viewing\
    \ things and of reacting to life. But you can still get on with people very well\
    \ if you see the differences as interesting and learn from each other.\n\n**Try\
    \ not to see things as ‘black and white’, ‘their way’, ‘my way’ or ‘one way’.\
    \ Instead, remember the grey area, where solutions are found. Learn to navigate\
    \ your way through all your relationships at home, at work, with family and friends\
    \ by softening your views, accepting the views of other people and realizing that\
    \ there are many ways to work through things. And always be open to seeing things\
    \ from someone else’s point of view.**\n\nThe following is an example of what\
    \ I mean.\n\nBlack: ‘I want to book the holiday.’\n\nWhite: ‘I don’t, so we are\
    \ not going to book it.’\n\nGrey: ‘I want you to have a holiday, but I don’t think\
    \ we can afford *this* holiday. I am open to finding a cheaper one. To be honest,\
    \ if we book a holiday that I don’t feel we can comfortably pay for, I won’t be\
    \ able to relax and enjoy it, which would defeat the purpose of having a break.’\n\
    \n**To diffuse an argument or disagreement you can say:** ‘I am different from\
    \ you. You are different from me. That is why we see this issue differently. But\
    \ that’s okay. Let’s discuss how we can work through our different opinions to\
    \ find a solution we are both happy with.’\n\nSome people are more emotional,\
    \ while other people are more logical and matter of fact. Different types of traits\
    \ are useful. So learn from each other to create balanced relationships. Don’t\
    \ see what people can’t do. See what they *can* do, as these are their strengths.\
    \ If different people use their different strengths, it’s possible to achieve\
    \ more, more easily.\n\n**Black-and-white thinking leaves no area for discussion.\
    \ The grey area is the zone where you will sort through things. A healthy relationship\
    \ is one in which both parties are open to discussion.**\n\nSay to yourself, ‘I\
    \ can make this relationship work. It is working.’ Or, ‘I can find AMAZING ways\
    \ to communicate well with my partner.’ You will probably find ways to sort things\
    \ out, even if you and your partner don’t agree.\n\nToo many people spend too\
    \ much time complaining and focusing on what doesn’t work rather than on what\
    \ *is* working within a relationship or on finding solutions to work through things.\n\
    \n### *Photo album technique*\n\n**See past events as old photographs in your\
    \ mind being filed into the appropriate albums so that you can archive them and\
    \ move on. You can choose to forgive for whatever has happened in your past. You\
    \ don’t need approval from anyone but yourself. Then see your past and future\
    \ as a solid path of stepping stones. When you let go of the negative, you will\
    \ be able to create an AMAZING relationship. You and your partner have probably\
    \ achieved quite a lot together. Start to feel good about the good things and\
    \ make a list of the things that don’t work so well. Then work through each item\
    \ that needs improvement. Sit down together to discuss how you can both improve\
    \ the situation.**\n\nSo much of the niggling bad feeling that exists between\
    \ people is caused by ridiculous things, such as how much milk someone puts in\
    \ their tea, or sugar in their coffee or salt on their food. Everyone has different\
    \ tastes in food and drinks, as they do in life in general, too. Try to respect\
    \ this and to enjoy the things you have in common with those around you. Most\
    \ issues are resolvable, so choose to work through problems. Only when you have\
    \ tried everything should you go your separate ways. If you try to run away from\
    \ your problems, they will simply follow you.\n\nA typical example is a husband\
    \ who can’t face family life and arguments with his wife. He decides to run off\
    \ with a younger woman, who later wants to have children – and he ends up in the\
    \ same situation with another young family.\n\n*   Anger = hostility = distress\n\
    \n*   Discussion = solutions = happiness\n\n### *Relaxation technique*\n\n**Try\
    \ to relax by breathing calmly, allowing tensions to dissolve by imagining your\
    \ problems drifting like clouds in the sky. Take a few deep breaths in and out\
    \ and, once the storm clouds have dispersed, you can begin to have reasonable\
    \ discussions again.**\n\n**You and your partner have created behaviour patterns\
    \ that will repeat themselves if you let them. Instead of being frustrated by\
    \ the repetition of old behaviour, work out why it is happening and find a way\
    \ to do things differently. Allow your mind to come up with solutions. Remember,\
    \ there is always a better way. Say ‘It’s all fine. It’s all resolving.’**\n\n\
    Most of the old issues that people in long-term relationships focus on don’t even\
    \ exist any more. Imagine these issues dissolving like clouds evaporating. We\
    \ become programmed to repeat behaviour we have learned, so similar problems may\
    \ have cropped up again and again. Allow new positive habits and patterns to form\
    \ between you and your partner."
