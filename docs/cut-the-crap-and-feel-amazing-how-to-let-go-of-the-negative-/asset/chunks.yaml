    Perfectionism is useful for certain things, for instance if you want to be a top
    athlete and in some work settings. But in most other situations it can become
    a burden that can wear you out and drive those around you mad. Stop micromanaging
    your life and everyone else’s. Learn to let things go. If you want to live a relaxed
    life, start making it relaxed by adjusting your attitude.


    ## Learn to relax


    Start living the life you want to live by taking time to rest. Listen to the way
    you speak to yourself and to other people. Notice when there is unnecessary urgency
    in your voice and then soften and slow your speech. It is all the small stresses
    in your day that result in you feeling and being stressed.


    Learn from other people how they relax. Many years ago, I stayed with friends
    in France who had two young children at the time. On Saturday afternoons, the
    whole family went to their bedrooms for a quiet time or to sleep. I adopted the
    same routine when I was a busy working mum and didn’t feel guilty at the weekend
    if I needed a rest, especially if I had a long evening ahead or if I just wanted
    to catch up after a busy week.


    Try to flow with what your body is telling you. If you need to rest, then rest.
    It is very simple. Also, repeat to yourself, ‘I can find AMAZING ways to relax,’
    and before long you will have created a good relaxation routine that suits you.
    And when you are more relaxed, those around you will be too. Soon you will be
    making AMAZING adjustments to the way you do things.


    These suggestions and the tips on the next page may sound like common sense, but
    many people are rushing too much to remember to do them.


    *   Change your clothes after your working day finishes.

    *   Have a shower or bath after work.

    *   Drink camomile tea and put lavender scent in your pillow.

    *   Exercise at home – yoga moves, push ups, whatever you like.

    *   Go for a walk every day.

    *   Listen to your favourite music.

    *   Listen to calming music.

    *   Speak calmly.

    *   Move calmly.

    *   Fill your home and workplace with calming words such as love, rest, relaxation,
    calm, happy home (on your desk, on cushions, as framed pictures).

    *   Rest more.

    *   SMILE.


    Let your mind offload its stresses before you go to sleep. Many people rush around
    all day at 100 miles per hour, then watch TV and go straight to bed, with no time
    just to be with themselves and let their mind unwind.


    ### Offloading your stresses technique


    Take 5-10 minutes every day to relax your mind. Talk calmly to yourself in your
    head about your day tomorrow so that you feel fully prepared: ‘I will get it done.
    I will have an AMAZING day.’ Feel the positive feeling of tomorrow having gone
    well as you SMILE. With your eyes closed, imagine things going well. You can move
    your eyes from left to right, up and down, and rotate them in a circular motion,
    feeling the calm, good feelings with your eyes in all positions. This will release
    tension around your eyes and help you to believe in the changes you want to make.


    You can repeat these phrases: ‘Life is easy. Life is calm. I sleep well. I am
    an AMAZING sleeper. I am fine. I am relaxed.’


    Before you go to sleep, write down anything that is worrying you. You need to
    take charge of your health and improve.


    ### Daily de-stress technique


    At intervals, notice how your body feels. Use these techniques to de-stress and
    to be aware of your environment. Focus on positive thoughts and eliminate what
    is causing you stress.


    ### Chapter summary


    *   Take charge of your health and improve.

    *   Create a relaxation routine.

    *   Identify stress.

    *   Eliminate stress.

    *   Learn to relax.


    ### Health anxiety


    Everyone will know someone who has been affected by a health issue at some time
    or you may be going through health problems yourself. To be able to live any kind
    of life, you need your body.


    To get over any health anxieties, use the clouds-in-the-sky technique. Rub or
    press your left knuckles using the fingers of your right hand and imagine the
    stress or worry passing like clouds in the sky. Also visualize a red triangle
    in your mind, put the fears into it and shrink it down.

