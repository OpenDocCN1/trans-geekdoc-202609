- raw: 'Make a list of things you can improve on in your relationships. Look at the
    list and see which items you can sort out. Keep ticking things off the list and
    add to it so that you deal with issues as they arise instead of letting them build
    up. Different things will be relevant at different stages of your life. Dip in
    and out of the list and find creative ways to sort things out AMAZINGLY.


    *   Create positive self-talk in your mind about your relationship.


    ## Praise goes a long way


    Everyone loves being praised and feeling special. Notice the things people can
    do and point out to them how well they are doing them. Be interested in other
    people, ask them questions about themselves and be interested in what they have
    to say. Add to conversations by mentioning relevant things that help to keep the
    conversation flowing. No one wants to be around people who talk about themselves
    without being interested in other people too. Have two-way conversations – think
    of it as traffic on a motorway with vehicles going in both directions.


    ## Separation/divorce


    Try to sort out your relationship using the rules in this and the following chapter
    and throughout this book. Remember, running from a relationship may not be the
    answer. You could end up with similar problems in another relationship or there
    may be so much fallout from the split that you hardly gain. You may think that
    getting divorced will resolve your problems. But, if you have children together,
    any friction that exists between you and your ex-partner could make your children
    feel like ‘piggy in the middle’. Or your ex-partner may go on to have a new relationship
    and your children may not like the new step-parent. So try to resolve your marriage
    before you split – unless, of course, you are in danger. Do everything you can
    to get back on track, as most relationships are resolvable if you can both be
    reasonable and see each other’s point of view.


    *   Leaving is not always the solution. But staying together isn’t always the
    solution either.


    *   Presume things will work out AMAZINGLY well and flow with what is best for
    you at each stage.


    ## Improving your relationship


    In a marriage or with a live-in partner, try to live like students or young friends
    sharing accommodation: be free individuals who don’t try to own or control each
    other. Do your share of what needs to be done, just as students have to pull their
    weight because if they don’t, no one will want to live with them for the next
    year.


    Say to your partner, even if only jokingly, ‘You are an AMAZING man/woman, so
    kind, so loving.’ When they hear this positive message and you hear yourself saying
    the words, you will both begin to change. Learn to laugh and give your partner
    the opportunity to get it right next time.


    Support your partner to fulfil their dreams and ask them to allow you to achieve
    your dreams too. Allow your ideas to flourish. If your partner wants to have an
    art studio at home, help them create the space to do their art. If your partner
    wants to go on a hiking holiday, help them to choose the perfect rucksack. Find
    a way to really live your lives and don’t hinder each other’s goals. When you
    both feel free in a relationship, you will both be happy.


    ## My partner loves me


    You could buy each other a special mug. Choose the mugs separately and try to
    get one that you imagine your partner would love. Imagine they think it is AMAZING.
    Accept whatever mug your partner buys for you and call it your ‘My husband loves
    me mug’ or ‘My wife loves me mug’ or ‘My partner loves me mug’. Every time you
    drink your coffee or tea out of it, say to yourself, ‘My husband loves me’ or
    ‘My wife loves me’ or ‘My partner loves me’.


    Be relaxed about presents. Get some clues about what your partner likes and buy
    something you think they would love. Keep the presents small. If there’s something
    either of you wants or needs, buy it for yourself instead of expecting someone
    else to read your mind. This way you will be happy.


    Don’t let others disappoint you. If you want an AMAZING birthday, organize it
    yourself: only you know what you really want. Don’t just say ‘AMAZING birthday’.
    Pick up the phone, invite your friends and book a restaurant, book paint-balling,
    a spa day or a golf tournament. Take control of your own happiness.


    ### *Chocolate brownie technique*


    **Try to speak positively. No one responds well to criticism. Start with something
    positive and end on a positive too: ‘You are doing really well with … I need to
    tell you … You could try to do this … Anyway, keep up the good work.’ You can
    say the same thing either positively or negatively. A chocolate brownie can be
    light, soft and gooey straight from the oven, but if it comes out of a fridge,
    it can be cold, solid and heavy: you are eating the same thing but having two
    completely different experiences. Think about the chocolate brownie when you speak
    to people. Are you bringing out in them the warm, soft gooeyness or the cold,
    solid heaviness?**


    *   **Speak in a nice way to create AMAZING relationships.**


    ## Let go of the past


    Let go of past relationships. If they had been meant to be, they would have been.
    Too many people hold on to old relationships that clutter up their mind and stop
    them moving on, which can affect new relationships. Life is all about constantly
    moving on – from nursery to junior school to senior school and then to the workplace.
    And every time we move on, people come in and out of our lives. See today as an
    adventure and as an opportunity for new and better relationships to come your
    way. Life is a journey that keeps getting better and better if we allow it to.


    ## Beware of bullies


    Bullies at school may go on to be bullies at work, at home and in relationships.
    Be aware of whether you are bullying or whether someone in your life is bullying
    you. The best way to deal with a bully is to accept that this is who they are
    so that you can try to understand the way they think. They are probably living
    in the black-and-white zone without seeing the grey area of different options,
    e.g. ‘You should be doing or seeing things my way.’ In your mind, turn their comments
    into humour and see the situation as a cartoon.


    Learn to stand up for yourself by working on your own self-belief and by improving
    the way you approach conversations, so that you explain things in a way other
    people can understand. For example, ‘We see this point differently because we
    are different people.’ Empower yourself by feeling good about yourself and believing
    in yourself.


    If someone asks a question, it is because they don’t know the answer. A bully
    may sneer at the question, implying that the person should know the answer. Bullies
    have got themselves into bad habits of behaving badly. So be aware of their problems
    by noticing their behaviour and the way they speak to you and to other people.


    Presume that things will work out AMAZINGLY well as you think them through with
    a SMILE. Break the habit of being bullied by laughing to yourself, as if the bully
    is in a TV sitcom. Allow any bad experience to empower you to propel yourself
    forwards to another level of positive.


    *   Some people will deliberately bully.


    *   Some people are unaware that their behaviour is affecting other people.


    *   Some people are so aware of other people that they are unable to do anything
    because they don’t want to offend anyone, which can make them more susceptible
    to being bullied.


    ## Do things differently'
