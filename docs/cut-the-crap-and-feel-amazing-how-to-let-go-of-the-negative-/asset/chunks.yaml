- raw: "*   If you are not happy about something your spouse or child has or hasn’t\
    \ done, have a meeting to discuss things calmly and feel the relaxed feeling of\
    \ AMAZING solutions working out well. Try to enjoy every phase of your life by\
    \ sorting things out as they arise.\n\n*   Think of 10 things you like about each\
    \ person in your life, at home and at work. This will help you to see the positive\
    \ in everyone.\n\n*   When things are going well with people, ‘snapshot’ the moment\
    \ in your mind to add to your AMAZING zone memory bank.\n\n*   Accept that everyone\
    \ is on their own path, which may be different from yours. Allow other people\
    \ to make their own decisions, just as you make yours.\n\n*   A joke is only funny\
    \ if the person on the receiving end of it finds it funny.\n\n*   You may need\
    \ to tell a small white lie to avoid offending someone. But if you are telling\
    \ lies regularly, you need to ask yourself why you need to lie and what it is\
    \ about your life that you need to change.\n\n*   In any relationship, you are\
    \ both right and you are both wrong. You both see things your own way.\n\n*  \
    \ If you are in a challenging relationship, either personally or professionally,\
    \ feel the feeling of it working out AMAZINGLY well. This may mean that you go\
    \ in separate directions or that you resolve whatever the problem is. Say to yourself,\
    \ ‘Maybe this will work out AMAZINGLY well.’\n\n* * *\n\n**STEP 1. Allow your\
    \ AMAZINGness to flourish.**\n\n**STEP 2. Allow the AMAZINGness of other people\
    \ to flourish.**\n\n**STEP 3. Imagine things working out AMAZINGLY.**\n\n* * *\n\
    \n*Cut the stress and create an AMAZINGLY  \n\ncalm life for yourself and those\
    \ around you.*\n\n[![CHAPTER 11: STRESS, REST AND RELAXATION](Images/ch11.jpg)](../Text/contents.xhtml#toc11)\n\
    \n## You create your crazy life\n\nThe pace of life in recent years has become\
    \ even faster. We live in a go, go, go society where more demands are put on people\
    \ to work longer hours and get more done in less time, where we – and other people\
    \ – have high expectations of ourselves and where technology fills up any spare\
    \ time we might otherwise have had. One of the most important things you can do\
    \ for yourself is simplify your life to eliminate your stresses.\n\n*   De-stress\
    \ your diary. Be selective about who you see and what you do.\n\n*   Plan ahead\
    \ and be organized.\n\n*   Put technology down and ban it from the bedroom.\n\n\
    *   Make a conscious effort to be in the moment rather than worrying about things\
    \ in the future.\n\n*   Stop rushing when it is not necessary. Try to pull back\
    \ within yourself to stay calm.\n\n*   Turn your go, go, go life into a slow,\
    \ slow, slow life, making time to relax.\n\n*   Say ‘No’ to things that will push\
    \ up your stress levels or put you under pressure.\n\n*   Switch off from work\
    \ and ignore work communications in your spare time.\n\n*   Reclaim your quiet\
    \ time. Reclaim your sanity.\n\n*   Minimize the amount of news you watch, as\
    \ this can be negative and stressful.\n\n*   Get in control of your debt and finances.\n\
    \nMost stress is a build-up of many small things that can easily be sorted out.\
    \ Identify the things you can change in your week to ease any pressure. What are\
    \ the difficult times during your week? What are the things that stress you most?\
    \ Identify the stresses and then try to find solutions to these problems. There\
    \ are always solutions. There is always another way of doing something.\n\nIf\
    \ you have too much stress in your life, it may cause you to sink into depressed\
    \ or anxious feelings, making you more tired and exhausted. Don’t make excuses\
    \ about why you have to put up with the way things are. You might not find solutions\
    \ immediately, but, by identifying the problems, you will begin to find answers\
    \ that will help you to make the right changes.\n\nThe following list will help\
    \ you identify the stresses in your life.\n\n*   Too much work tension?\n\n* \
    \  Financially stretched?\n\n*   Just about coping with life?\n\n*   Too busy?\n\
    \n*   Too lonely?\n\n*   Addictions: alcohol, smoking, drugs?\n\n*   Feel trapped\
    \ in your life?\n\n*   Relationship issues?\n\n*   Struggling with parenting?\n\
    \n*   Health issues?\n\n*   Exam worries?\n\n*   Career stress?\n\n*   Family\
    \ problems?\n\nWrite down your problems and then write down the answers to solving\
    \ each issue. Learn to self-talk yourself into the positive. Most of the things\
    \ you feel stressed about are very easy to resolve. If you don’t know the answer\
    \ today, go back to that question another time. You can write down these questions\
    \ and answers regularly to stop stresses building up. By doing this, you will\
    \ take the emotions out of the problem, which will allow you to come up with a\
    \ rational solution. Letting go of repeated negative thoughts will relax your\
    \ mind. You will feel better and be more focused, and therefore more able to move\
    \ things forwards.\n\nThe following are some stress examples. Use them to help\
    \ you see how you could find creative solutions that will enable you to let go\
    \ of your stresses.\n\n1.  *Problem:* It doesn’t matter how much I earn, I don’t\
    \ seem to have enough money.\n\n    *Solution:* Like most people, you have probably\
    \ overstretched yourself with your expenses. Not saving any money, lack of planning\
    \ and thinking that it will be all right to make impulsive purchases may have\
    \ caught up with you. Start to make a plan of where you can cut back and begin\
    \ to save. Set up a savings account to save for birthdays, Christmases and holidays.\n\
    \n2.  *Problem:* I get stressed about having midweek drinks with colleagues or\
    \ clients because it means I get home too late, and the alcohol is not good for\
    \ me on a work night.\n\n    *Solution:* Start with a soft drink, have one alcoholic\
    \ drink, then make an excuse and leave. By the time the other people have had\
    \ a couple of alcoholic drinks, they won’t even notice you are departing early.\
    \ Imagine you get home completely sober at a reasonable time feeling healthy and\
    \ AMAZING.\n\n3.  *Problem:* I feel stressed and drained by friends or family\
    \ problems.\n\n    *Solution:* Pretend that you are busy so that you don’t get\
    \ caught up in their latest drama. You are entitled to a life yourself, so learn\
    \ to let other people sort out their own problems. Tell them that they can and\
    \ will sort things out themselves. Then feel good about yourself for having the\
    \ confidence to let others take responsibility for their own situations.\n\n4.\
    \  *Problem:* I feel stressed and dread Wednesdays because the kids have too many\
    \ activities to go to after school, which makes fitting in mealtime a nightmare.\n\
    \n    *Solution:* Share the pick-ups and drop-offs of your kids with other parents.\
    \ Prepare an easy meal in advance so that it is simple to feed everyone at the\
    \ appropriate times. Choose food that will be easy to heat up, such as a casserole.\
    \ Imagine Wednesdays are easy and AMAZING.\n\n5.  *Problem:* I can’t cope with\
    \ deadlines, exam or study/work stress. They cause me so much worry.\n\n    *Solution:*\
    \ Rearrange your diary during the week. Think of your deadline as being a day\
    \ or two before it actually is so that you use your time more efficiently. Repeat\
    \ to yourself, ‘I can do it. I am doing it. It is done.’ Visualize your completed\
    \ work and see yourself in your mind relaxed on the day before the deadline, with\
    \ everything having been achieved easily on time. Imagine you are celebrating\
    \ your great results/grades.\n\n## When you feel yourself tense or stressed, remember\
    \ to find another way\n\nIf you have ever been to London, you may have noticed\
    \ that as soon as you enter the Underground you walk at the fast pace of everyone\
    \ else, even if you are not in a rush. Be aware and slow your life down. It is\
    \ your choice how you live your life. So stop running around like a headless chicken\
    \ and set boundaries of what is acceptable for you to cope with. Allow the world\
    \ to revolve around you rather than you revolving around the world. It will still\
    \ continue to turn on its axis whether you are stressed or not."
  fmt: "\n*   If you are not happy about something your spouse or child has or hasn’t\
    \ done, have a meeting to discuss things calmly and feel the relaxed feeling of\
    \ AMAZING solutions working out well. Try to enjoy every phase of your life by\
    \ sorting things out as they arise.\n*   Think of 10 things you like about each\
    \ person in your life, at home and at work. This will help you to see the positive\
    \ in everyone.\n*   When things are going well with people, ‘snapshot’ the moment\
    \ in your mind to add to your `AMAZING` zone memory bank.\n*   Accept that everyone\
    \ is on their own path, which may be different from yours. Allow other people\
    \ to make their own decisions, just as you make yours.\n*   A joke is only funny\
    \ if the person on the receiving end of it finds it funny.\n*   You may need to\
    \ tell a small white lie to avoid offending someone. But if you are telling lies\
    \ regularly, you need to ask yourself why you need to lie and what it is about\
    \ your life that you need to change.\n*   In any relationship, you are both right\
    \ and you are both wrong. You both see things your own way.\n*   If you are in\
    \ a challenging relationship, either personally or professionally, feel the feeling\
    \ of it working out AMAZINGLY well. This may mean that you go in separate directions\
    \ or that you resolve whatever the problem is. Say to yourself, ‘Maybe this will\
    \ work out AMAZINGLY well.’\n\n***\n\n**STEP 1. Allow your AMAZINGness to flourish.**\n\
    \n**STEP 2. Allow the AMAZINGness of other people to flourish.**\n\n**STEP 3.\
    \ Imagine things working out AMAZINGLY.**\n\n***\n\n*Cut the stress and create\
    \ an AMAZINGLY calm life for yourself and those around you.*\n\n[![CHAPTER 11:\
    \ STRESS, REST AND RELAXATION](Images/ch11.jpg)](../Text/contents.xhtml#toc11)\n\
    \n## You create your crazy life\n\nThe pace of life in recent years has become\
    \ even faster. We live in a go, go, go society where more demands are put on people\
    \ to work longer hours and get more done in less time, where we – and other people\
    \ – have high expectations of ourselves and where technology fills up any spare\
    \ time we might otherwise have had. One of the most important things you can do\
    \ for yourself is simplify your life to eliminate your stresses.\n\n*   De-stress\
    \ your diary. Be selective about who you see and what you do.\n*   Plan ahead\
    \ and be organized.\n*   Put technology down and ban it from the bedroom.\n* \
    \  Make a conscious effort to be in the moment rather than worrying about things\
    \ in the future.\n*   Stop rushing when it is not necessary. Try to pull back\
    \ within yourself to stay calm.\n*   Turn your go, go, go life into a slow, slow,\
    \ slow life, making time to relax.\n*   Say ‘No’ to things that will push up your\
    \ stress levels or put you under pressure.\n*   Switch off from work and ignore\
    \ work communications in your spare time.\n*   Reclaim your quiet time. Reclaim\
    \ your sanity.\n*   Minimize the amount of news you watch, as this can be negative\
    \ and stressful.\n*   Get in control of your debt and finances.\n\nMost stress\
    \ is a build-up of many small things that can easily be sorted out. Identify the\
    \ things you can change in your week to ease any pressure. What are the difficult\
    \ times during your week? What are the things that stress you most? Identify the\
    \ stresses and then try to find solutions to these problems. There are always\
    \ solutions. There is always another way of doing something.\n\nIf you have too\
    \ much stress in your life, it may cause you to sink into depressed or anxious\
    \ feelings, making you more tired and exhausted. Don’t make excuses about why\
    \ you have to put up with the way things are. You might not find solutions immediately,\
    \ but, by identifying the problems, you will begin to find answers that will help\
    \ you to make the right changes.\n\nThe following list will help you identify\
    \ the stresses in your life.\n\n*   Too much work tension?\n*   Financially stretched?\n\
    *   Just about coping with life?\n*   Too busy?\n*   Too lonely?\n*   Addictions:\
    \ alcohol, smoking, drugs?\n*   Feel trapped in your life?\n*   Relationship issues?\n\
    *   Struggling with parenting?\n*   Health issues?\n*   Exam worries?\n*   Career\
    \ stress?\n*   Family problems?\n\nWrite down your problems and then write down\
    \ the answers to solving each issue. Learn to self-talk yourself into the positive.\
    \ Most of the things you feel stressed about are very easy to resolve. If you\
    \ don’t know the answer today, go back to that question another time. You can\
    \ write down these questions and answers regularly to stop stresses building up.\
    \ By doing this, you will take the emotions out of the problem, which will allow\
    \ you to come up with a rational solution. Letting go of repeated negative thoughts\
    \ will relax your mind. You will feel better and be more focused, and therefore\
    \ more able to move things forwards.\n\nThe following are some stress examples.\
    \ Use them to help you see how you could find creative solutions that will enable\
    \ you to let go of your stresses.\n\n1.  **Problem:** It doesn’t matter how much\
    \ I earn, I don’t seem to have enough money.\n    **Solution:** Like most people,\
    \ you have probably overstretched yourself with your expenses. Not saving any\
    \ money, lack of planning and thinking that it will be all right to make impulsive\
    \ purchases may have caught up with you. Start to make a plan of where you can\
    \ cut back and begin to save. Set up a savings account to save for birthdays,\
    \ Christmases and holidays.\n\n2.  **Problem:** I get stressed about having midweek\
    \ drinks with colleagues or clients because it means I get home too late, and\
    \ the alcohol is not good for me on a work night.\n    **Solution:** Start with\
    \ a soft drink, have one alcoholic drink, then make an excuse and leave. By the\
    \ time the other people have had a couple of alcoholic drinks, they won’t even\
    \ notice you are departing early. Imagine you get home completely sober at a reasonable\
    \ time feeling healthy and AMAZING.\n\n3.  **Problem:** I feel stressed and drained\
    \ by friends or family problems.\n    **Solution:** Pretend that you are busy\
    \ so that you don’t get caught up in their latest drama. You are entitled to a\
    \ life yourself, so learn to let other people sort out their own problems. Tell\
    \ them that they can and will sort things out themselves. Then feel good about\
    \ yourself for having the confidence to let others take responsibility for their\
    \ own situations.\n\n4.  **Problem:** I feel stressed and dread Wednesdays because\
    \ the kids have too many activities to go to after school, which makes fitting\
    \ in mealtime a nightmare.\n    **Solution:** Share the pick-ups and drop-offs\
    \ of your kids with other parents. Prepare an easy meal in advance so that it\
    \ is simple to feed everyone at the appropriate times. Choose food that will be\
    \ easy to heat up, such as a casserole. Imagine Wednesdays are easy and AMAZING.\n\
    \n5.  **Problem:** I can’t cope with deadlines, exam or study/work stress. They\
    \ cause me so much worry.\n    **Solution:** Rearrange your diary during the week.\
    \ Think of your deadline as being a day or two before it actually is so that you\
    \ use your time efficiently. Repeat to yourself, ‘I can do it. I am doing it.\
    \ It is done.’ Visualize your completed work and see yourself in your mind relaxed\
    \ on the day before the deadline, with everything having been achieved easily\
    \ on time. Imagine you are celebrating your great results/grades.\n\n## When you\
    \ feel yourself tense or stressed, remember to find another way\n\nIf you have\
    \ ever been to London, you may have noticed that as soon as you enter the Underground\
    \ you walk at the fast pace of everyone else, even if you are not in a rush. Be\
    \ aware and slow your life down. It is your choice how you live your life. So\
    \ stop running around like a headless chicken and set boundaries of what is acceptable\
    \ for you to cope with. Allow the world to revolve around you rather than you\
    \ revolving around the world. It will still continue to turn on its axis whether\
    \ you are stressed or not.\n"
  trans: "\n\n*   如果你对配偶或孩子所做或未做的事情感到不悦，请开会冷静地讨论这些事情，感受那些奇妙的解决方案顺利解决后的放松感。试着在问题出现时就解决它们，以此享受生活的每一个阶段。\n\
    *   为你生活中的每一个人（包括家里和工作中）想出你喜欢他们的 10 个理由。这将帮助你看到每个人身上积极的一面。\n*   当与人相处得很愉快时，在脑海中“快照”那个时刻，将其加入你的\
    \ `AMAZING` 区域记忆库。\n*   接受每个人都有自己的道路，这条路可能与你的不同。允许他人做出自己的决定，就像你做出自己的决定一样。\n* \
    \  一个笑话只有在听话的人觉得好笑时才是幽默的。\n*   你可能需要说一个小善谎来避免冒犯某人。但如果你经常撒谎，你需要问问自己为什么要撒谎，以及你的生活中有什么部分是需要改变的。\n\
    *   在任何关系中，你们双方都是对的，也是错的。你们都以自己的方式看待问题。\n*   如果你正处于一段挑战性的关系中（无论是个人还是职业上的），感受它进展得极其奇妙的感觉。这可能意味着你们将分道扬扬，或者你们解决了任何存在的问题。对自己说：“也许这会变得极其奇妙。”\n\
    \n***\n\n**第 1 步。让你的奇妙绽放。**\n\n**第 2 步。让他人的奇妙绽放。**\n\n**第 3 步。想象事情奇迹地进展。**\n\n\
    ***\n\n*减轻压力，为你和周围的人创造一个奇妙且平静的生活。*\n\n![第 11 章：压力、休息与放松](img/contents.xhtml#toc11)\n\
    \n## 你创造了自己疯狂的生活\n\n近年来的生活节奏变得更快了。我们生活在一个“奔冲、奔冲、奔冲”的社会里，人们被要求工作时间更长、在更短时间内完成更多事情；我们以及他人对自己有很高的期望，而技术填满了我们本可能拥有的任何空闲时间。你能为自己做的最重要的事情之一就是简化生活，消除压力。\n\
    \n*   减轻你的日程表压力。对见谁、做什么要有选择性。\n*   提前计划并保持有条理。\n*   放下科技产品，并将其禁在卧室。\n*   有意识地努力专注于当下，而不是担心未来的事情。\n\
    *   在不需要时停止匆忙。试着向内收敛以保持冷静。\n*   将你奔冲、奔冲、奔冲的生活变成慢、慢、慢的生活，花时间放松。\n*   对那些会增加你压力水平或让你感到压力的事情说“不”。\n\
    *   下班后切换状态，并在休息时间忽略工作信息。\n*   夺回你的安静时光。夺回你的理智。\n*   减少看的新闻量，因为这些可能是负面且充满压力的。\n\
    *   掌控你的债务和财务。\n\n大多数压力是许多小事的累积，而这些事是可以很容易解决的。识别你周内可以改变的事情来缓解压力。你一周中最困难的时刻是什么时候？最给你压力的事情是什么？识别出压力，然后尝试为这些问题寻找解决方案。总有解决方案。总有其他方法。\n\
    \n如果你生活中的压力太大，可能会导致你陷入抑郁或焦虑的情绪，让你感到更加疲惫和力竭。不要为自己必须忍受现状找借口。你可能无法立即找到解决方案，但通过识别问题，你将开始找到帮助你做出正确改变的答案。\n\
    \n以下列表将帮助你识别生活中的压力。\n\n*   工作压力太大？\n*   财务拮据？\n*   仅仅在勉强生活？\n*   太忙了？\n*   太孤独了？\n\
    *   成瘾：酒精、吸烟、药物？\n*   感觉在生活中被困住了？\n*   关系问题？\n*   育儿挣扎？\n*   健康问题？\n*   考试担忧？\n\
    *   职业压力？\n*   家庭问题？\n\n写下你的问题，然后写下解决每个问题的答案。学会通过自言自让自己变得积极。你感到压力的绝大多数事情都非常容易解决。如果你今天不知道答案，下次再回来来看那个问题。你可以定期写下这些问题和答案，以停止压力的累积。通过这样做，你将从问题中剔情绪，让你想出理性的解决方案。放下重复的负面想法会让你的大脑放松。你会感觉更好、更加专注，因此更有能力推动事情向前。\n\
    \n以下是一些压力示例。利用它们来帮助你看到如何找到创造性的解决方案，让你放下压力。\n\n1.  **问题：** 无论我赚多少钱，似乎都不够花。\n  \
    \  **解决方案：** 像大多数人一样，你可能在开支上过度了了。不存钱、缺乏计划，以及认为冲动消费没关系的想法可能已经困扰了你。开始制定一个可以削减的计划并开始储蓄。设立一个储蓄账户，为生日、圣诞节和假期存款。\n\
    \n2.  **问题：** 我对周中和同事或客户一起小酌感到压力，因为这意味着我回家太晚了，而且酒精对我身体不好。\n    **解决方案：** 从喝软饮料开始，喝一杯酒精，然后找借口离开。当其他人喝了几杯酒时，他们甚至不会注意到你离开了。想象你在合理的时间回到家，感到健康且奇妙。\n\
    \n3.  **问题：** 我被朋友或家庭问题感到压力且精力竭。\n    **解决方案：** 假装自己很忙，这样你就不会卷入他们的剧情。你有权拥有自己的生活，所以学会让他们自己解决自己的问题。告诉他们可以并且会解决好事情。然后为你自己有信心让他们承担自己的责任感到良好。\n\
    \n4.  **问题：** 我对周三感到压力并恐惧，因为孩子们放学后有太多活动要参加，这让进餐时间变成了噩梦。\n    **解决方案：** 与其他家长分担接送孩子。提前准备饭菜，以便在合适的时间喂给大家。选择易于加热的食物，比如炖菜。想象周三是轻松且奇妙的。\n\
    \n5.  **问题：** 我无法应对截止日期、考试或学习/工作压力。它们让我如此担忧。\n    **解决方案：** 在周内重新安排你的日程表。将截止日期设定在实际日期的一两天之前，这样你可以高效利用时间。对自己说：“我可以做到。我正在做。已经完成了。”视觉化你完成的工作，并在脑海中看到自己在截止日期一天前放松，一切都已按时轻松完成。想象你正在庆祝出色的成绩。\n\
    \n"
