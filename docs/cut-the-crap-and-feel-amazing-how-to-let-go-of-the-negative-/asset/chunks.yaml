    \ to be negative, try to think of new ways to meet up. For example, go out for\
    \ the day so that your conversations are about the day out and not about their\
    \ problems. Go to the theatre or a museum or on a boat trip or do anything else\
    \ that inspires you. If you really can’t bear to be in their company, set them\
    \ free and set yourself free by honouring your feelings and being around the people\
    \ who suit you best. If someone is good for you, they will come back into your\
    \ life at an appropriate time.\n\n## Relationships with good friends\n\nFriends\
    \ will come in and out of your life and your partner’s life. Good friends will\
    \ always ‘feel’ right when you see them. Don’t force friendships or feel let down\
    \ if a friend is in a different headspace at a particular time. Set your friends\
    \ free and, like boomerangs, they will come back into your life when the time\
    \ is right.\n\nAs you become more positive, some of your friends may not feel\
    \ comfortable being around your positivity, and you may not feel comfortable with\
    \ their negativity. But they may become more positive in the future, so always\
    \ leave the door open for them to come back into your life.\n\n### *Speak-to-a-photo\
    \ technique*\n\n**Try talking to a photograph of the person you want to speak\
    \ to, perhaps your husband/wife, friend, work colleague or child. It is a good\
    \ idea to get things off your chest before you actually speak to them in person.\
    \ Once you have told the photograph everything you want to say, you may find that\
    \ there is no need to have a discussion with the person themselves. When you do\
    \ see them, you will be calmer and more rational and you may feel that the air\
    \ has already cleared.**\n\n**Make special time for yourself and for each person\
    \ in your life and feel AMAZING.**\n\n* * *\n\n#### Chapter summary\n\n*   Use\
    \ the relaxation technique: let the problems pass. Say, ‘It’s all fine. It’s all\
    \ resolving.’\n\n*   Use the watching technique: enjoy watching people tell you\
    \ about the things they are interested in.\n\n*   Have a meeting to discuss issues\
    \ calmly.\n\n*   Be romantic with your partner.\n\n*   Get to know what your partner\
    \ likes.\n\n*   Praise people – everyone likes to feels special.\n\n*   ![image](Images/img1.jpg)Use\
    \ the chocolate brownie technique: bring out the warmth in people, not the cold.\n\
    \n**STEP 1. Let go of rigid black-and-white thinking.**\n\n**STEP 2. Remember\
    \ everyone is individual.**\n\n**STEP 3. Focus on people’s strengths.**\n\n* *\
    \ *\n\n*Choices and decisions create  \n\na good or bad relationship.*\n\n[![CHAPTER\
    \ 10: RELATIONSHIP RULES](Images/ch10.jpg)](../Text/contents.xhtml#toc10)\n\n\
    ## All good relationships are about sticking to a set of rules\n\n*   It is us,\
    \ not other people, who are in control of our relationships, of whether or not\
    \ we are prepared to put up with something, or have the ability to work through\
    \ issues, or expect too much or too little. Try to be balanced and always imagine\
    \ finding a way through things so that they work out well. But be prepared for\
    \ the fact that some things can’t be fixed.\n\n*   Remember the grey area where\
    \ the solutions are found. Avoid black-and-white thinking.\n\n*   Love yourself\
    \ enough not to let the behaviour of others affect you. It doesn’t matter what\
    \ people say or do, you can still feel good about yourself. Say to yourself, ‘I\
    \ am AMAZING’ and ‘They are AMAZING,’ as this will dissolve the negative between\
    \ you.\n\n*   Other people are AMAZING too. SMILE and imagine that you bring out\
    \ the AMAZING in them.\n\n*   Be open to other people’s ideas and opinions and\
    \ remember that there are many ways to do things, not just one way. Work *with*\
    \ others, not against them. Remind them that you may see some things differently\
    \ from the way they see them.\n\n*   Don’t spend time worrying about other people’s\
    \ problems. Imagine things have worked out AMAZINGLY well for them and let them\
    \ get on with sorting out their own lives.\n\n*   Don’t rescue other people. Instead,\
    \ rescue yourself. Every time you sort something out for someone else, they don’t\
    \ have to learn how to do it themselves. Rescuing them only delays their development.\n\
    \n*   Say to yourself and to other people, ‘You can and you will sort this out.\
    \ You are good at sorting things out.’ It is okay to help people if they are helping\
    \ themselves too.\n\n*   Don’t buy into negative dramas. Instead, be around positive\
    \ people.\n\n*   Some people are logical in their thinking, some are emotional\
    \ and some are creative. We need all types of people to make the world go round.\
    \ If we all thought the same way, it would be impossible to function as a society.\
    \ Be interested by your partner and by the people around you and appreciate their\
    \ special qualities.\n\n*   SMILE at the past. See it as a sitcom and laugh at\
    \ it. Laughter brings you into a positive ‘now’.\n\n*   If someone is being difficult,\
    \ instead of getting angry, just SMILE to yourself and imagine you are in a comedy\
    \ film.\n\n*   If you are the ‘difficult one’ in a relationship, sort out your\
    \ problems. For instance, do you drink a lot? Are you untidy? Are you demanding?\
    \ Do you talk about things that you never do? Do you live your life through other\
    \ people’s achievements? Do you gossip negatively? Do you believe that you are\
    \ better than everyone else? Are you annoying? Are you lazy? Are you hyperactive?\
    \ Look at yourself and become a better version of you. Take on board other people’s\
    \ comments and suggestions. Listen, be open and decide whether there is something\
    \ about your behaviour that you need to change so that you and those around you\
    \ will reap the benefits.\n\n*   Once you have made any necessary improvements\
    \ to your behaviour, be yourself and allow other people to be themselves.\n\n\
    *   Listen to what other people have to say, but encourage them to make the right\
    \ choices for themselves. And make the right choices for yourself, too.\n\n* \
    \  Don’t share your ideas with other people who may convince you not to do something\
    \ you were planning to do. Trust your own gut feelings. Many people miss opportunities\
    \ and never do what feels right because they are put off by other people before\
    \ they even get started.\n\n*   You create your own destiny by believing in yourself\
    \ and making things happen. You can change your direction in a split second by\
    \ believing that AMAZIING things will happen and by actioning what needs to be\
    \ done. Be firm in your own mind about what you want, then go out and make it\
    \ happen. Listen to yourself, and if you hear your negative voice, change it to\
    \ positive talk so that better things can happen.\n\n*   Get the right balance\
    \ between voicing your opinions and keeping them to yourself. If you don’t like\
    \ other people’s opinions, understand that it is just their viewpoint. You don’t\
    \ have to agree with them, but you don’t need to tell them when you disagree,\
    \ and risk insulting them unnecessarily.\n\n*   Treat people with respect. Always\
    \ speak on the same level.\n\n*   If someone is aggressive or threatening, seek\
    \ professional advice about how best to cope with the situation.\n\n*   Accept\
    \ kindness from other people and be kind to them. Be respectful of yourself, other\
    \ people, animals and the environment you are in.\n\n*   You wouldn’t tell your\
    \ neighbour how to cut their grass. Treat family members the same way. Don’t tell\
    \ people what to do or how to live their lives. Let your children, family and\
    \ spouse be themselves in your company. Explain the rules and why they are necessary,\
    \ but speak to your family members like you would speak to a neighbour. You don’t\
    \ own anyone.\n\n*   Everyone has strengths. See the strengths in people close\
    \ to you. Don’t expect them to be good at everything you are good at. Remember,\
    \ we are all individuals. Work together and bring your individual strengths to\
    \ your relationships."
