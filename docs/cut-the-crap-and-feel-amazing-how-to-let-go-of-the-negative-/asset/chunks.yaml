- raw: 'Everyone at some point has addictive behaviour or a weakness for something.
    I suggest that you accept this fact and then work out what you need to do to take
    control of whatever your weakness or addiction might be. You are an individual,
    so you need to do what is right for you. But don’t close your mind to solutions
    that other people have found helpful. You never know: what has helped someone
    else might be right for you, too.


    You need to focus on making changes that will break the bad habit. Do the following
    experiment to prove to yourself that it is possible to adapt to something new.


    Move the rubbish bin in your kitchen. For a while, you will keep going back to
    the old place, but before long you will get used to the bin being somewhere else
    and will go to it automatically, without having to think about it. It’s the same
    thing with an addiction or bad habit that you want to change: you need to change
    the behaviour and do it over and over again until you get used to the new way
    of being. It works because you store the habit in your subconscious mind and,
    once you have reprogrammed yourself, it will become natural for you to behave
    in the new way.


    *   You invested time in learning the addictive behaviour. You need to spend time
    breaking the bad habits too.


    Generally, people who become addicted think of the short-term rewards and not
    the long-term consequences of their actions. People who don’t become addicted
    are aware of the consequences and decide to make better choices and decisions
    to avoid addiction.


    Your choices and decisions = consequences.


    *   If you overeat, you will put on weight.


    *   If you drink regularly, you will, over time, become more dependent on alcohol.


    *   If you take drugs, you may become addicted.


    *   If you spend money you don’t have, you will end up in debt.


    *   If you gamble, you will lose money.


    *   If you watch too much pornography, you will damage your relationship.


    *   If you spend too much time playing computer games, you will achieve less in
    life.


    *   If you overuse technology, it will overrun your life.


    *   If you smoke, you could shorten your life.


    *   If you overwork, you could burn yourself out and damage your relationships.


    *   If you steal repeatedly, you will probably get caught eventually.


    **People who have addictions live in a fantasy world, not in the real world of
    consequences. People who avoid addictions are able to see the consequences.**


    At the bottom of every addiction is a series of reasons why the person can’t be
    without the thing they crave. Often, the addiction is based on childhood issues
    such as lack of attention or too much pressure from parents or schooling, plus
    low self-esteem, stress, rebellion, feeling trapped, lost or bored, filling time
    or escaping from pressure. Everyone has a different upbringing and everyone responds
    differently to events in their lives. In my hypnotherapy recordings, I heal the
    whole person by dealing with life issues in a general way. Once the subconscious
    mind feels more contented, the person feels calmer, happier and more relaxed.
    When you feel comfortable feelings, you don’t need anything external – objects
    or behaviour – to make you feel complete.


    I am not a big believer in bringing up the past in great detail, as it can be
    stressful, or even destructive. But it is important to identify the possible causes
    of addictive behaviour and then move the mind on from those events. It’s important
    to let go of grudges or blame and to remember that every person you have ever
    met has been doing the best they could based on their own personality and beliefs.
    Hypnotherapy is a great tool to help move the mind on from past events and, by
    breaking bad habits that are lodged in the subconscious mind, you will be able
    to restore contented feelings.


    I chose to become a hypnotherapist because it can make a real difference to someone’s
    life very quickly. Through my hypnotherapy recordings, I have helped thousands
    of people break bad habits. Hypnotherapy fast-tracks the reprogramming of the
    mind so that it abandons negative habits and creates positive, good habits. Recordings
    are a great way of doing that, as you can listen to them in the privacy of your
    own home, maybe putting them on at bedtime to enhance the quality of your sleep,
    they are very cost-effective, and you can work through a series of titles to help
    various areas of your life.


    Most people don’t know exactly what hypnotherapy is. The best way to find out
    is to experience it for yourself. I tried it during a period of stress in my life
    and discovered firsthand just how AMAZING it is. It was this positive experience
    that inspired me to train as a hypnotherapist, which was one of the best decisions
    I have made in my life so far. For most people, hypnotherapy is a quick and easy
    way to release the mind from cravings, break bad habits and at the same time deal
    with the emotions and stress that might be at the root of any negative addiction.
    The positive messages that are dripped into your subconscious mind during hypnotherapy
    become a reassuring background voice when you are finding it hard to be positive
    in your daily life.


    ## Your life is creating your addictions


    Identify the stresses in your life that make you drink, smoke, overeat, gamble…
    Then work to eliminate those problems from your life. Many people say, ‘I don’t
    have any problems. I just like drinking/eating/taking drugs.’ But there is always
    something fuelling an addiction.


    You can put out the fire, but if you don’t fix the electrical fault, fire will
    break out again. Work at fixing the electrical wiring in your life and in your
    mind by making changes that will create a different reality. Address the problems
    in your life and change the way you react to them. Feel AMAZING and imagine things
    working out well. Don’t allow yourself to be absorbed in things repetitively without
    making conscious decisions and setting boundaries. Identify what aspect of your
    life is pushing the buttons and causing you to behave addictively.


    As well as looking at yourself, look at other people and learn from them. Analyse
    their behaviour and try to work out why they have their addictions. Do they lack
    confidence? Do they suffer from stress or have bad relationships? Do they feel
    bad about their life in some way? Are they hurting because of things that have
    happened in the past? Have they been surrounded by people with a particular behaviour
    for so long they can’t see that there is another way?


    Whatever you have achieved in your life so far, take time to see the difference
    you have made to other people. For society to function, everyone is reliant on
    everyone else, and your role is as important as anyone else’s. Everyone and everything
    has a purpose, so feel good about yourself. If you are not happy with your achievements
    or with your life so far, use the techniques in this book to steer yourself in
    a new and better direction.


    Everyone has special gifts and talents. You may already be doing a job you are
    really good at, but you may not see who you really are. Or you may be looking
    for a career change, be a stay-at-home parent or retired. Whoever you are, you
    should feel good about you. If you don’t, there are answers and solutions that
    will help you. You just need to go out and find them and then grasp the opportunities
    they offer.


    To get a different result, you need to do something different. Start today. This
    week, do things differently from the way you did them last week: buy different
    foods, avoid places where there are drugs or alcohol, go to a café not a pub,
    drive a different route to avoid the betting shop, change whatever you can to
    get the result you want. There is a whole new world out there that is different
    from the one you are used to. Go out and find it.


    ### *Feeling-good technique*


    *Problem:* **I am feeling useless because I can’t stop my addictive behaviour.
    What is wrong with me?**'
