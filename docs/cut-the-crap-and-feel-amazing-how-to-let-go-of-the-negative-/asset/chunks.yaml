- raw: "Remember, you can’t change the people around you, but by changing the way\
    \ you feel, people will respond to you differently. When you are happier, you\
    \ will radiate a more positive energy, which other people will pick up on. Some\
    \ people won’t want to be in your positive space, but it will appeal to others.\
    \ Your new positivity may not suit all your friends, so allow your relationships\
    \ to evolve naturally as people come in and out of your life.\n\nEven for people\
    \ who say, ‘I SMILE a lot already,’ using the SMILE more will create even better\
    \ things.\n\nBe nice to other people, but don’t get caught up in their dramas\
    \ or negativity. Realize that they are in a negative place and perhaps suggest\
    \ some of the techniques for them to try or that they read this book. But remember,\
    \ not everyone is ready for change, so don’t be a rescuer. Other people’s negativity\
    \ will prevent you from feeling the AMAZING feelings. So teach people to take\
    \ responsibility for themselves.\n\nAlthough you can’t run and hide from all the\
    \ negative things going on in the world, you *can* see negativity for what it\
    \ is, step back from it and not allow it to get into your body. There is always\
    \ a positive that can come out of something. So presume AMAZING things will happen\
    \ as a result – you don’t need to know what, when or how.\n\nRemember that there\
    \ is always going to be someone worse off than you are. Instead of dwelling on\
    \ that fact, do your bit to make a positive difference to the world. A kind gesture\
    \ can go a long way in the day of a real person. Talking to an elderly person\
    \ can make them less lonely. Putting money in a charity box will make a difference\
    \ to someone somewhere. Noticing something good about your wife or husband and\
    \ mentioning it to them will make your relationship happier.\n\nSMILE and spend\
    \ a few minutes every day laughing at life, loving where you are and accepting\
    \ it. Once you can see the funny side, you will already have begun to change your\
    \ life for the better. You can carry a SMILE wherever you go.\n\n**Laugh at life\
    \ and feel AMAZING.**\n\n* * *\n\n#### Chapter summary\n\n*   Strengthen the AMAZING\
    \ zone with a SMILE.\n\n*   Do something every week that really makes you SMILE.\n\
    \n*   Be kind to yourself and other people.\n\n*   Let your uniqueness shine.\n\
    \n**STEP 1. Raise the corners of your mouth into a SMILE.**\n\n**STEP 2. SMILE\
    \ as you do everyday tasks.**\n\n**STEP 3. Think things through with a SMILE.**\n\
    \n* * *\n\n*Every challenge has already been  \n\novercome by someone somewhere.\
    \  \n\nYou can do it too.*\n\n[![CHAPTER 3: CUT THE CRAP AND LET GO OF WORRIES](Images/ch03.jpg)](../Text/contents.xhtml#toc3)\n\
    \n## Let go of the negative and make way for the positive\n\nTo be able to create\
    \ positive, happy feelings you have to let go of negative feelings. We all worry\
    \ about something, get stressed or have negative thoughts at some point. One of\
    \ the first things I teach clients is to take control of their spiralling negative\
    \ thoughts, which cause anxiety and stress and which occupy time that could be\
    \ used positively. As what we ‘think’ is who we are or who we become, it is really\
    \ important that you use positive words when you are thinking. The sooner you\
    \ improve the way you think, the sooner you will change your life positively.\n\
    \nIf you have a dispute with a neighbour and, instead of dwelling on the stress\
    \ or feeling trapped because you think there is nothing you can do, you focus\
    \ on it working out well, it is more likely to be sorted out. Being positive will\
    \ give you the energy to get advice and gather together all the information that\
    \ will make a difference. Rather than feeling tired, drained and helpless, let\
    \ the situation empower you so that AMAZING solutions can be found.\n\nYou may\
    \ have experienced challenging times that you feel you can’t easily move on from.\
    \ With some information and understanding about how the events occurred, it will\
    \ be easier to put them behind you. Or you may have negative thoughts simply because\
    \ you are dealing with difficult everyday problems. Depression and down feelings\
    \ are partly the result of dwelling on the past or feeling trapped in life, allowing\
    \ the mind to rethink events over and over again. They also occur when your subconscious\
    \ mind, your conscious mind and your reality do not match.\n\n*   ‘If only that\
    \ had happened or this hadn’t happened.’\n\n*   ‘Life was so much better back\
    \ then.’\n\n*   ‘I should be doing better than I am doing. I was expecting to\
    \ be Y and I have only achieved X.’\n\nSome of these beliefs will have been drilled\
    \ into you by society, parents, schooling, films and, basically, just life around\
    \ you. Anti-depressants will mask your negative feelings, but they won’t change\
    \ your beliefs. Changing your life little by little will get you out of a negative\
    \ rut. Even if you are taking anti-depressants, you can still change your life\
    \ and then work with your doctor later to come off them, if that’s appropriate.\
    \ This technique helps prevent people from slipping into hopeless feelings.\n\n\
    ### *Climbing-out-of-a-hole technique*\n\n**To help release the feeling of being\
    \ stuck in life or having low or depressed feelings, you can visualize yourself\
    \ climbing out of a dark hole into the light. See it as a cartoon computer game,\
    \ as if you are reaching the next level of lightness. Keep climbing into the light\
    \ until you feel you are surrounded by light in your mind.**\n\n**This visualization\
    \ will help you to look for the way through whatever you are facing right now.\
    \ By imagining yourself making progress, you will program your mind to believe\
    \ that there is a way out of the situation you are in. This will help you to find\
    \ solutions. You can do this exercise at any time in any place.**\n\n### *Photo\
    \ album technique*\n\n**Imagine your past is like a photo album. Don’t look at\
    \ the individual pictures, just see a collection of photos in your mind. Now imagine\
    \ archiving the images into folders. Imagine the past events being filed away\
    \ into a place that feels fine. Imagine the images moving into the relevant folders.\
    \ It may feel right to let some of the photos and folders dissolve and disappear.\
    \ Again, don’t look at the pictures. Just trust that they are going into the correct\
    \ places. See the images in your mind sorting themselves out. As you do this exercise,\
    \ let go of the past knowing that everything is in place for you to move your\
    \ life forwards positively. Visualize a blank new photo album that you can fill\
    \ with images of all your future adventures. Repeat the exercise at any time when\
    \ you feel yourself dwelling on the past.**\n\nI had a client who couldn’t come\
    \ to terms with her children leaving home. She had too many happy memories of\
    \ being a full-time mum. By doing this exercise, she felt that she had filed the\
    \ photos of the past away and freed her mind so that she could plan her future\
    \ and move on to the next exciting chapter of her life.\n\n## Getting back to\
    \ being whole and complete\n\nFor argument’s sake, let’s imagine you were whole\
    \ and complete when you were born into the world. Imagine yourself at birth being\
    \ like a complete circle. Then life began to chip away at you – teachers, tests,\
    \ exams, parents, siblings, expectations and disappointments – until eventually\
    \ you weren’t a perfect circle any more, and you weren’t your true self any more\
    \ either. You were a lesser version of you, and the circle had begun to look a\
    \ bit distorted and misshapen.\n\nEvery time you had to sit in a classroom learning\
    \ information that didn’t really make sense to you or that appeared to have no\
    \ relevance to your life, every time you were misunderstood or felt awkward and\
    \ self-conscious, the circle got a little bit more bent out of shape. Eventually,\
    \ you began to negatively self-talk.\n\n*   ‘I am stupid.’\n\n*   ‘What’s wrong\
    \ with me?’"
