  trans: '


    *   如果你是自雇人士，请在收到款项时就留好税款。


    ## 不要拿未来赌博


    重新评估什么是必要的，并重新评估如何最好利用你的时间。例如，只有免费电视频道是“必要”的。不要看白天的电视。相反，要固守工作时间，早起并积极寻找工作或投入时间进行重新培训。明智地利用晚上的时间，寻找更高薪的工作，或制定改变开支的计划。人们经常将希望寄托在中彩票上，但这仅仅是赌博的形式。相反，要掌控自己的生活。重新培训需要时间，但这是时间的一种良好投资。提高技能将对你的财务状况产生真实影响，因为工作可能是你最大的收入来源。以重新培训需要太长时间为借口，只会延长你处于贫困状态的时间。如果你已经有一份好工作，每天都要为它感到自豪。为你目前所取得的成就感到自豪。


    通过赌博来冒金钱风险赚钱，只是在逃避你需要改变自己以及改变对工作、职业、金钱和储蓄的行为的事。多年来，我遇到过许多客户，他们用自己根本没有的钱赌博，在妻子背地里欠债，冒着家庭安全和未来的风险，只为了换取他们认为的快速解决之径和致富的捷径。赌博很少有回报，而做出更好的选择和决策每一次都有效。


    将朋友或家人的钱投资到创业中要小心，在交易股票和股份时要保持谨慎。你需要权衡风险，因为一切都可能出错。


    ## 危机


    有时，人们会因为自己无法控制的原因陷入财务危机，例如丧亲、离婚或健康问题。试着相信事情会以**非常出色**的方式解决。使用“放下”技术，例如在 `../Text/chapter03.xhtml`
    中描述的红三角技巧来释放压力。想象将你的忧虑放入脑中的一个红色三角形中，并想象它缩小并溶解。你也可以使用揉搓、按压或敲击左指关节的同时说“让它过去”，看着脑海中的忧虑像天空中的云一样飘过。如果你生病了，尽一切努力尽快康复。知道你会找到度过困难的方法。可能有增加收入的方法，所以对这种可能性持开放态度。如果你正在领取福利金，请朝着实现自给自足的大目标努力。


    你越积极，越好。通过自我引导来保持积极的情绪：“我可以做这个。我正在做。已经完成了。我可以把这转化为积极的因素。我可以处理好。我可以克服这个难关。”让你的大脑处于**极其出色**的区域。说：“一切会以**非常出色**的方式解决的。”当你面临真实的危机时，这听起来可能很奇怪。但通过保持这种**极其出色**的感觉，你将确保大脑不会陷入负面思维，并能想出最佳解决方案。通过良好的选择和决策，你将开始扭转局面。当你专注于“**精彩**”的事情正在发生时，精彩的事情就会向你走来。我不是说你会中彩票（尽管你可能！），但机会会找上门来，或者从各种渠道获得额外资金，又可能你会找到一些健康解决方案让你回到工作，或者丧亲之痛可能为你开启新的机会之门。


    正如你的处境由于一系列事件而变得糟糕一样，也将有一系列事件会让你的状况再次好起来。始终想象存在有一种**极其出色**的方法可以度过难关，你会感到惊喜。如果有人夺走了你的财富，尽力把它要回来，但不要在负面的过去上浪费时间。相反，要积极地向前看。过去的负面人物是过去问题的一部分，你永远无法与他们共赢。对发生的事情感到良好，从中学习，分析你本可以如何这样做，并感觉到事情会以**非常出色**的方式解决，关注未来而不是过去。当你向前积累新财富时，确保这次你照顾好它。


    ## 制定行动计划


    不要仅仅相信精彩的事情会发生。要采取行动，做需要的事来改善局面。


    ### 改变财富的行动


    当钱找上门来时，不要想：“噢太好了，我可以出去玩了。”相反，要利用这笔额外的钱。


    一位名叫 Sue 的客户告诉我，她和丈夫非常努力，但在奢侈品或假期方面负担不起。她一直在把自己和朋友 Katie 比较。Katie 是一个全职妈妈，她的丈夫工作收入不算高，但他们家每年去两次豪华假期，经常出去吃饭，买很多新衣服和昂贵的新车。我的客户
    Sue 说：“这太不公平了。我们做错了什么？”


    “你并不了解你朋友的真实情况，”我告诉她，“正如你自己所说，你需要赚很多钱才能过那种生活。大多数人负担不起。也许 Katie 和她的丈夫有遗产，又也许他们欠了大量的信用卡债来维持他们的生活方式。”


    一个月后，在下一次预约时，Sue 说：“你是对的。我的朋友和她的丈夫债台高筑。他们刚刚把房子挂牌出售。”


    ## 疯狂的想法


    买一辆负担不起的大车或租一处负担不起的大房子，然后希望钱会有来支付是疯狂的。研究你尚未准备好购买的东西是个好主，但在购买时要确保你处于良好的状况。


    我建议你买你负担得起的最小、最新的汽车，或者租最便宜的房子（这可能意味着缩小规模），以便你存钱重新回到房产市场。如果你正在买房，请对你的负担能力保持现实。


    以下是一些疯狂的理财故事，让你思考你可能正在做的哪些可以改变的事：


    1. 一名叫 Sue 的客户告诉我，她和丈夫非常努力……（见上文故事）。


    **我的建议：** 不要对他人的财富做出假设，因为你并不了解全部事实。相反，通过为你做出**极其出色**的选择和决策，专注于你自己的财富和财务事实。如果由于某种原因你失去了房子，确保你租一个更便宜的地方，以便你存钱重新回到房产市场。


    2. Tom 决定要买一辆大新车并申请了贷款，5 年内每月还款 600 英镑。他的妻子不同意这个决定，因为她很满意继续使用他们现有的车。


    '
