- raw: 'Invest time in developing your relationship with your partner so that you
    reap the rewards of intimate sexual experiences. A relationship is like a flower
    bud that opens when the sun is shining but may not do so if the sun is blocked
    by a cloud. A flower also needs bees to pollinate it and rainwater to help it
    grow and develop. If all these elements are not right, the flower will not fully
    open. You and your partner also need all the elements to be right, but for you
    the elements include kindness, romance, listening to each other, supporting each
    other and helping each other.


    Don’t expect your partner to think and feel like you do. Discuss what you both
    like, if it feels comfortable to do so. Too many relationships are affected by
    pornography, which is not what gives couples long-term satisfying, intimate experiences.
    Instead, try to find educational information on the internet that will enable
    you to develop your knowledge of how your partner’s body works. Experiment with
    new ways of turning your partner on and making love to them. Pornography presents
    a distorted reality of what a healthy sex life is. So let go of everything you
    may have learned from it. You may have fun with it from time to time, but to build
    a strong foundation for a sexual relationship:


    *   Think romantic comedy not pornography.


    *   Try making love to romantic music, which will help you to create new habits
    and patterns related to your sex life.


    *   Doing things differently will create different results.


    *   By making new choices and decisions together, you can build an AMAZING relationship.


    ## Romantic gestures


    Discuss with each other what type of romantic gestures you both like. Some people
    like being bought a thoughtful gift, while others may prefer a verbal compliment,
    having a meal made for them or a hug. Basically, listen to your partner and be
    aware when they are doing something nice for you that you previously may have
    taken for granted.


    You can research online for ideas about romantic things you could do. By investing
    a little bit of time in arranging romance, you will reap the reward of a happier
    relationship.


    *   Buy your partner a food treat they love.


    *   Message your partner telling them you love them or that you are looking forward
    to seeing them.


    *   Book a surprise meal or weekend break somewhere your partner would like to
    go.


    *   Teach each other to cook something.


    *   Give your partner a massage.


    *   Play your partner’s favourite music.


    *   Arrange for a practical chore to be done, such as fixing the laptop or decorating
    a room.


    If your partner asks what you would like for your birthday, don’t say ‘Nothing’
    when you are secretly hoping for a surprise. Guide your partner to buy things
    from a shop you like so that they will buy something you want. You could both
    write lists of the type of things you would like to receive as gifts, such as
    technology gadgets, perfume, aftershave or concert tickets.


    If your partner arranges a romantic gesture for you, be pleased with whatever
    it is. Even if it isn’t something you would have chosen for yourself, be appreciative
    and don’t throw the gesture back in their face. If you listen to each other, you’ll
    each find out what the other person likes. But if your partner forgets an event
    such as an anniversary, forgive them and arrange to celebrate it on another day.


    Planning ahead is easy when you can order gifts and cards online. Don’t wait for
    your partner to be romantic. Romantic surprises should be fun and they don’t need
    to cost much. A heart-shaped piece of toast, a love note in an underwear drawer,
    on a pillow or in a packed lunch, a cake or some rose petals scattered around
    a candlelit bath are all inexpensive ways to be romantic. But everyone is different,
    so get to know what types of things your partner likes. There is no point sending
    them skydiving as a treat if it is really something you want to do and they would
    hate it!


    If you listen to what your partner has to say, you will gradually become harmonious
    together. Teach your children to be romantic with their partner when they grow
    up by setting a good example now. If you explain to your children how important
    it is to put effort into their relationships later, it will feel natural to them
    rather than being a chore.


    ## Sharing responsibility for your children


    Be reasonable with your partner. You should both be able to take breaks from caring
    for your children if you help each other out. If you are both working, do as much
    as you can to support each other. If you are a stay-at-home mum or dad, give your
    partner some breathing space when they return home from work. Give them time to
    take a shower or make a cup of tea before you bombard them with a running commentary
    of your day’s events or before you expect them to help you do whatever needs to
    be done in the house. Clients often complain that their spouses expect them to
    take over the care of the children the moment they walk in the door. Try to be
    more organized so that you can all have quality time together as a family. If
    you are divorced, still do your share to give your partner a proper break and
    thank them for the money they give for the children or for the work they do in
    looking after them.


    ## Let go of the fear


    Eliminate your problems and then see what you are left with. Don’t let simple
    decisions like ‘Should we let the kids get a hamster?’ become a battleground.
    Live in the moment. Don’t make a drama out of small issues. Try to look at the
    bigger scheme of things. Trust that you both have good ideas and sometimes flow
    with your partner’s ideas to see where they lead.


    Some time ago, my husband and I lived in Shanghai for a year, during which time
    I came across a little dog that needed a home. I was being practical, thinking
    through how we would get the dog back to the UK without having to put him in quarantine.
    But my husband said, ‘Just get him. We’ll find a way. And if we can’t keep him,
    we will find him a better home. Either way, he’ll be better off than he is now.’
    So we got the dog and everything worked out fine, because we found a family in
    France who looked after him for six months so he could gain entry to the UK without
    going into quarantine. It was a great decision to get the dog. It all worked out
    AMAZINGLY well – for the dog and for us!


    Respect each other’s individuality. Be inspired by your partner and teach them
    to be inspired by you too. It doesn’t really matter what you do in life as long
    as you are happy. If your partner wants something that will make them happy (within
    budget), you may also end up benefiting from it. So be agreeable to giving the
    idea a go.


    Try to say to your partner, ‘Do what you think. I am sure you will make good decisions.’
    And think to yourself, ‘It will work out AMAZINGLY well.’ Once the tension between
    you dissolves, your partner may decide not to go ahead with whatever they were
    thinking about doing. If so, they will have come to that conclusion on their own
    and won’t blame you later for any consequences. It will also avoid negative wasted
    energy, which can be very draining on a relationship.


    If your partner won’t let you do something, let go of needing it and say to yourself,
    ‘Maybe it will happen. It will work out AMAZINGLY well.’ Once you let go, you
    may find that you don’t want to do it as much as you thought you did, or your
    partner may become more open to you going ahead with whatever it is.


    *   Flexibility and an open mind on both sides will create a flowing relationship.


    *   Take responsibility for yourself by tidying up after yourself in the kitchen
    and bathroom, making the bed and picking up your clothes.


    *   Be responsible with money by staying within budget.


    *   Do your share of household tasks.


    *   Be romantic.'
