- raw: 'I gave a copy of my hypnotherapy recording *Money – Increase your Wealth*
    to my window cleaner, who was complaining that his grown-up son’s spending was
    out of control and that he had to keep bailing him out financially. I realized
    that he had some financial boundary issues with his son, which my recording would
    resolve. When he came back to clean my windows six weeks later, he had put his
    prices up. I was really proud of him for being able to ask for more money. It
    did make me laugh, though, the fact that he charged me more when I was the person
    who had given him the ‘increase your wealth’ recording! The hypnotherapy had given
    him the confidence to charge more and feel good about it. As a result, he ended
    up being £500 per month better off, which is quite a significant increase – and
    he decided to let his son take responsibility for his own finances.


    ## In-laws


    Your in-laws can be useful to you, so be grateful for any help you get from them.
    If they are willing to look after your children to give you a break, let them.
    Accept that they may have ways of doing things that are different from the way
    you do them. If your relationship with your in-laws is strained, try to see the
    situations as cartoons so that you can laugh at them rather than feeling angry.


    Remember that your in-laws have been affected throughout their lives by all the
    issues in this book. However they behave, they are doing the best they can, just
    like everyone else. If you have in-laws you can’t get along with and who seem
    to be intent on destroying your marriage if you allow them to, imagine ‘AMAZING
    solutions’ and ‘everything working out well’. If your partner isn’t able to stand
    up to his or her parents, accept this and find a way to navigate around them.


    ## Children and separation/divorce


    If you are in a bad relationship, you need to do everything possible to sort things
    out. I believe the techniques in this book will help you to resolve most relationship
    issues. If you do decide to go your separate ways, you have a responsibility to
    support your children financially as well as emotionally and to make every effort
    to see them regularly. Learn from past mistakes and make sure that you don’t end
    up in another destructive relationship.


    If you are divorced, keep in contact with your children, even if they don’t seem
    to be interested in you. Everyone needs to feel they are wanted. Your children
    may be under pressure from people around them to say that they don’t want to see
    you. Rise above any mess you and your ex-partner have created by being the adult
    and doing everything you can to keep your relationships going with your children.


    Make regular contact by sending them letters or parcels. Send them pocket money
    every week so that they feel they have regular contact with you. If you are not
    sure whether your ex-partner is allowing your children to receive the post you
    send them, photocopy your letters so that one day, when your children are grown-up,
    you can show them that you did try to make contact.


    If you do get regular contact with your children, don’t just turn on the TV and
    expect them to entertain themselves. Make the time you spend together really special
    so that they have happy memories of being with you and want to see you more often.


    *   Find your special niche role within your children’s lives.


    *   Do not say negative things to your children about your ex-partner. Try to
    say AMAZING things about their other parent and something AMAZING about yourself,
    too.


    ## When is the right time to have children?


    If you have children when you are younger, you may be less financially secure,
    your career may just be starting, you may miss out on going out and having fun
    with friends and you may struggle with the responsibility. But you will benefit
    later, as you will have time to get on with your life once your children have
    grown up.


    If you have children later, you will probably be more financially stable and more
    mature, and therefore more able to cope. But you may struggle to adjust, perhaps
    because you are set in your own ways and possibly less physically fit.


    Whatever age you are when you have your children, sacrifices will have to be made,
    as they are by any parent. If you think you had your kids at the wrong time, just
    accept the way things have happened and don’t wallow in self-pity. If you had
    been meant to have them at a different time, you would have done so. Be open to
    taking advice from experienced parents who have already been there and done it.


    The realities of having children are not really spoken about to young women, so
    there is no information stored in their subconscious mind about how to cope while
    working or taking a career break to have kids. Consequently, I see increasing
    numbers of women who struggle to accept parenting. The subconscious mind holds
    our beliefs, which are programmed into it over a lifetime.


    So, if the plan of being a mum is not in your subconscious mind because you have
    been programmed to want to have a career, it can feel unnatural to give up part
    of your life to have children. I think that understanding and accepting these
    feelings can help you to come to terms with them. It is okay to feel the way you
    do. Women all over the world come to terms with similar feelings every day. And
    it isn’t just a problem that is faced by women. If young men haven’t formed habits
    in the subconscious mind of being a responsible parent and fitting their lives
    around their children, they may struggle with parenting later too.


    The techniques in this book will help you to adjust to the changes. Try to flow
    with parenting. Instead of feeling trapped, imagine a wiggly string leading you
    on an adventure.


    ## Wishing you hadn’t had children


    Some women feel complete when they have children. Some wish they had not had them
    at all. And some feel regret as a passing thought from time to time. Parenting
    can be a real challenge for some people. But I suggest that you surrender to it
    rather than battling against it. Just hold your hands up, surrender, accept that
    this is where you are and feel relief that you haven’t got to fight it any more.


    It is okay to feel the way you do. You are an individual. You always were and
    you always will be. Say to yourself, ‘AMAZING things come from being a parent.’
    Get into the flow of parenting and allow your children to enable you to experience
    and understand a whole other side to life. Let it be an adventure.


    Manage your feelings by making sure you get some quality time for yourself every
    week. And arrange time with your partner so that the kids don’t take over completely.
    If you are a single parent, you need to have quality time with friends. By being
    creative, you will find ways to get the balance right. Always believing that things
    will work out AMAZINGLY well will allow good things to happen. In your mind, notice
    the good things about having children. If you feel that having children has stretched
    you financially, remember that it is just a phase that will last until they grow
    up. You may not be able to do or afford the things you used to do and afford,
    but one day they will be possible again.


    **You may feel at times, ‘I can’t deal with the kids. They drive me insane. I
    can’t cope.’ If that happens, remind yourself that this stage is not going to
    last forever.**


    **Parenting is a series of phases that culminate in the children growing up and
    taking responsibility for themselves. In the meantime, do things differently.
    Make better choices and decisions and find easier ways to deal with them. Identify
    what is actually causing you stress – it might be their homework or the whole
    bedtime routine – and then sort it out.**


    **Say, ‘I can do this. I am doing it. It is done.’ SMILE and laugh at this stage
    as if it is a funny, crazy TV sitcom!**'
