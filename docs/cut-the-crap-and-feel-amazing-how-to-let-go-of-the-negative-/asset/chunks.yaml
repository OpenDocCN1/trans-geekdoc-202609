- raw: 'Feel good about what you have. SMILE and feel contented about the good things
    in your life. Find creative ways to have just as nice a life but within your budget
    – maybe go out for a coffee instead of a meal, get a better deal on a holiday
    or go on a shorter holiday, use things you already have. And make sure that your
    budget takes into account money that you will put into a savings account every
    week or every month before you spend anything else.


    Keep your mortgage manageable and have a plan to pay off the loan so that you
    eventually own your property. If you rent, imagine that you can find a way to
    pay your rent easily today and every day. If you want to buy a property, imagine
    that you have found AMAZING ways to buy and own your own place. Everything is
    possible. Your home is your foundation, so make your home affordable.


    People often think that moving is expensive, but if you believe it will be AMAZING
    and financially fantastic for you, then it will be. A few years ago, my husband
    and I needed more space at home for his business and I began to look at various
    options that would enable us to move. I focused on it being an AMAZING move that
    was financially fantastic for us. Friends and family tried to convince me that
    moving would be expensive, but I knew that it would work out as long as I believed
    that an AMAZING move could happen.


    After some time, I came to the conclusion that moving 10 minutes further away
    from London would open up a lot more properties to us that would give us the space
    we needed. Eventually, after doing my research and being open to an AMAZING property,
    we found a potentially AMAZING property that I wouldn’t have looked at before.
    It needed some renovations, but we felt that it was worth doing the work because
    it was double the size of our previous home and in a gorgeous location overlooking
    a golf course with its own private forest. The property cost nearly £80,000 less
    than our other place. After moving fees and some carefully planned renovations,
    we had £40,000 left in the bank.


    When people come to visit us in our new home they always say, ‘It’s AMAZING,’
    because it truly is a special place. And I laugh to myself, because that is what
    I knew it would be before we began our property search.


    Doing an AMAZING property search doesn’t mean an affordable dream home will just
    land in your lap. But if you put the work in by getting out there and viewing
    properties while keeping the AMAZING feeling alive and believing that there is
    always a way to get something AMAZING, it will lead you to that destination.


    Because your home is so important, make sure that it is affordable so that you
    can relax in it. When you aspire to a wealthier lifestyle, rather than being desperate
    to have the life you haven’t got yet, say, ‘Maybe I could do something like that.
    Maybe I could have something like that.’ A desperate feeling will create a desperate
    result. By using ‘maybe’, you take the urgency out of having things.


    *   ‘Maybe I could have a car like that.’


    *   ‘Maybe I could own a house like that.’


    *   ‘Maybe I could be successful like her/him.’


    *   ‘Maybe I could be a millionaire.’


    *   ‘Maybe I could win the lottery.’


    Plan the things you want to achieve financially and say, ‘The money is there.’
    By being in the SMILE AMAZING zone, you will also find that you are in the right
    place at the right time for a free handout, which is a great way to boost your
    income. There is always someone who wants to get rid of something and somebody
    else who wants it. (You may find a free recycle group in your local area.)


    Recently, I thought about buying a wooden swinging chair for the garden. When
    I went to the garden centre, I couldn’t decide exactly what I wanted. So I just
    thought, ‘Oh, it will be AMAZING. It will all sort out.’


    The next day, a friend phoned to invite my husband and me for Sunday lunch a couple
    of weeks later. While we were there, we went into her garden, where she had a
    wooden swinging chair. ‘I love your swinging chair,’ I told our friend. ‘I am
    going to get one soon.’ ‘Well, do you want mine?’ she asked. ‘I want to get rid
    of it.’


    A couple of days later, my husband hired a van, picked up the garden chair and
    the next weekend I was swinging on it in my own garden. Our friend was happy to
    have got rid of it so easily, and we were delighted to be its new owners. Now,
    that is AMAZING!


    ## Write clear lists of what you want in life


    Set goals/dreams of what you want to achieve, from simple things like finding
    some garden furniture to more substantial ones, such as becoming a property owner.
    Write a concise list of your ideas about the life you want. Place this list somewhere
    your subconscious mind will see it daily, such as inside the bathroom cabinet,
    on the fridge, on your desk or on the wardrobe door. It is important to write
    the words backwards so that you can’t consciously read it but your subconscious
    mind can. Either handwrite it or type it on the computer and then print it off.
    Use the word AMAZING or AMAZINGLY to make the sentences positively powerful. Soon,
    you will really begin to believe that you will have the items, lifestyle, job
    or money on your list.


    Write the phrase forwards and then copy it backwards.


    *   AMAZING gorgeous home – emoh suoegrog GNIZAMA


    *   AMAZING lifestyle – elytsefil GNIZAMA


    *   AMAZING financial security – ytiruces laicnanif GNIZAMA


    *   AMAZING financial success – sseccus laicnanif GNIZAMA


    *   AMAZING income – emocni GNIZAMA


    *   AMAZING investments – stnemtsevni GNIZAMA


    *   AMAZING happy life – efil yppah GNIZAMA


    *   AMAZING dream job – boj maerd GNIZAMA


    *   AMAZING holiday – yadiloh GNIZAMA


    *   AMAZING pension provision – noisivorp noisnep GNIZAMA


    Action tasks that you can do for each item on the list. For example, do research
    into different types of investment, see what other job opportunities are out there
    or look at properties as if you were ready to buy one in the area where you would
    like to live. Between the ages of 21 and 23, I viewed about 40 properties while
    looking for the most perfect cottage my husband and I could afford. When I was
    23, we bought a three-bedroom cottage, which we would never have got if I had
    allowed myself to be put off by the fact I wasn’t really ready to afford one at
    the beginning of the property search. But my determination was stronger than all
    the factors that made it seem impossible. By the time we bought the cottage we
    were in a good financial position to afford it and we bought the property at a
    reduced price as it needed renovations. If you have a dream keep investigating
    until you are able to make it happen.


    When we think about things that are out of our reach, we put negatives in the
    way. When we focus on something, it begins to happen. But when we action something
    by pretending we are ready to make the necessary changes, it starts to feel normal
    and comfortable, and before you know it, it’s happening. The worst thing you can
    do is nothing. Your investigations may make you realize that you don’t actually
    want what you thought you wanted. If that does happen, at least you are one step
    closer to knowing what you *do* want.


    Keep your life moving instead of feeling stuck. Imagine the path that will lead
    you to the wealth or the life you desire is like a wiggly string. Make your list
    as AMAZING as possible.


    ## AMAZING inheritance


    Be generous with your inheritance. Give money to your children and your grandchildren
    to help them have a better life. If you don’t have children, give money to the
    people in your life who have made a difference to you – perhaps you have been
    made to feel part of someone else’s family. You can stipulate how they use the
    money, such as for a property, holidays or education. Don’t assume that people
    aren’t struggling because they seem to be fine. Let your legacy help the next
    generation build something AMAZING.


    **SMILE about your wealth and feel AMAZING.**


    * * *


    #### Chapter summary'
