- raw: 'Steve, an experienced builder and senior executive in a building firm, had
    the idea of starting up a new building business but, due to the recession, he
    thought it might be too risky. After some appointments with me, he decided to
    leave his old job. Then, by using the AMAZING zone feeling, he self-talked himself
    into success and used other techniques described in this book to keep himself
    positive. He did some freelance work to help pay his bills before his own building
    projects were up and running. ‘I had the self-belief to go after my dream despite
    the recession,’ he told me. ‘Because I had a new inner confidence, I packed in
    my job and have begun to create my own destiny.’


    With hard work and believing in the AMAZING, his turnover in the first year was
    one million pounds! By the third year, he was turning over five million pounds.


    **My advice:** Remember, Steve was starting a business with skills he had built
    up over many years, which is very different from starting a new business that
    you know nothing about. So, while you build a new business and new skills, be
    aware that you may need to keep doing your old job to support yourself until you
    start earning money. Being self-employed is hard work, so be prepared to put in
    the hours to set things up. Treat every customer with respect, as they could lead
    you to more customers. Keep expenses down, and be careful – it could be a while
    before you build up a good reputation and create a good income. Sometimes in life,
    you just have to go for things because they feel right. Your determination and
    good feelings will make you successful.


    Focus determines your reality. Believe AMAZING things will happen, but be grounded
    too.


    ## Sometimes you can have what you thought you couldn’t afford


    Gemma couldn’t afford a holiday, so I worked with her to release her negative
    beliefs. I told her to imagine that it was the end of the summer and to feel as
    if she had had an AMAZING time. She was easily able to do this, as she was in
    a much more positive way of thinking after the session I did with her. A couple
    of weeks later, she told me that she had been offered a holiday home free of charge
    by a friend she hadn’t seen for many years. So guess what: she had an AMAZING
    holiday after all.


    **My advice:** AMAZING unexpected things do happen. Don’t rely on them, but always
    feel filled with positive optimism. Releasing the negative beliefs is key to being
    positive on a subconscious level, which will allow you to really believe in good
    things happening instead of just pretending you feel positive.


    ## Save, save, save, invest, invest, invest


    Open several savings accounts and every time you earn or receive money, put some
    of it into each of them. When you think you don’t have any spare money to save,
    cut back somewhere else so that you can put some into the savings accounts. This
    is very important psychologically, because when you think about your finances
    you will know that, as well as having debt or an overdraft, you also have some
    savings. By saving, you will program yourself to keep to a tighter budget and
    you will appreciate the things you are able to buy.


    When I advised a client called Graham to do this, he said, ‘I can’t afford to
    save.’ ‘You can’t afford not to save,’ I told him. After I released his negative
    money patterns, despite having an overdraft, he decided to stretch himself and
    put £75 a month into a savings account. After 32 months, he had saved £2400. And
    when an expensive school trip came up for his daughter, which previously would
    have sent him into stress mode, he paid £200 from his current account and £600
    from the savings account.


    BEFORE he started saving, he said, ‘It doesn’t make sense because I pay more interest
    on my overdraft than the interest I gain on the savings.’


    AFTER saving for 32 months, he said, ‘It feels great knowing I have a buffer.
    It was a wise decision. Even though I pay the occasional overdraft fee, it has
    spurred me on to keep saving in the long term and to spend less so that I don’t
    increase my overdraft. I’ve had a smaller overdraft since I started saving. It’s
    hassle-free because I have a standing order to pay money from the bank into the
    savings account. So it’s like paying any other bill. I was used to being “in overdraft”,
    but now I am used to being “in savings” instead.’


    To get out of overdraft you need to say, ‘I have so much money in my accounts.
    My accounts are overflowing with money. I have plenty of savings.’ This will break
    the negative thinking of the past (‘I never have enough money’).


    I advise people to get rid of store loyalty cards, which tempt you into buying
    goods you don’t need. Buy fresh, simple ingredients – meat, fish, eggs, dairy,
    nuts, pulses, fruit and vegetables – and cook your own food. You don’t need packaged
    goods, so buy as few of them as possible. You also don’t need lots of cleaning
    products, expensive Clingfilm and baking foil. Remember, a lot of goods are luxuries
    you can’t afford. Think wartime and be careful with everything. You will be surprised
    by how much you already have in your cupboards. Be thrifty and create money by
    buying less. Every time you throw something away, ask yourself how much money
    it cost and be aware of how much you are wasting. Over the years, I have noticed
    that some of my wealthiest clients are the ones who quibble most over the cost
    of things. They are always looking for a bargain and a good investment. And they
    look after their money, which is probably one of the reasons why they became rich
    in the first place.


    A really clever wealthy person is someone who creates quality of life too. There
    is no point working seven days a week, getting only four hours sleep a night,
    working away from home and living in airports and hotels, or drinking or smoking
    to cope with stress, if you are irreparably compromising your relationships and
    your health. Be successful, but also be clever. Make conscious money choices.


    SMILE and feel AMAZING as you say:


    *   ‘I am investing AMAZINGLY.’


    *   ‘I have AMAZING savings.’


    *   ‘I have plenty of money in the bank.’


    *   ‘I have AMAZING investments.’


    An investment can involve investing in a suit for an interview, a winter coat
    in the end-of-season sale, which will save you money the following winter (as
    long as you really need a new coat and can afford it at the time), a computer
    to run your business, a university education, going to the dentist to look after
    your teeth, which could cost more later if you don’t take care of them, investing
    time building a balanced financial portfolio by seeking professional advice, buying
    a property in a good area, or coming up with an idea to earn money while you sleep.


    Lucy, a freelance journalist who wrote an article about my client sessions and
    hypnotherapy recordings for increasing her wealth, decided almost immediately
    after her first hypnotherapy session with me to invest in a really good haircut
    to make her feel and look more professional. With her new haircut, she had more
    confidence and was able to get better-paid commissions. She also invested in more
    childcare for her children so that she could spend more time working, which proved
    to be a good investment and within the first month she was £1,000 better off.


    Think about everything you spend your money on and whether it will be a good investment.


    *   Confront your investments and savings head on.


    *   Be smart – listen to other people who are successful with money.


    *   Do work that you believe in.


    *   Live in the cheapest, nicest place you can easily afford.


    *   Learn new skills that could lead to something worthwhile.


    *   Be determined and set specific goals.


    *   Plan and make good things happen for you.'
