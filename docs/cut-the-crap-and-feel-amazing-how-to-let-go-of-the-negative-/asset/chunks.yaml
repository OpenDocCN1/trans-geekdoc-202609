- raw: 'Some people make one excuse after another without even knowing they are making
    them, because it has become normal for them to avoid change. It is sometimes difficult
    to identify where the excuses are. But every time you are not at least open to
    a suggestion from someone else, an excuse is sure to be creeping in. Although
    you don’t need to do whatever has been suggested, you may learn from someone else’s
    ideas. It’s easy to be quite defensive, bearing in mind past judgement by parents,
    teachers and friends, and most adults have a built-in defence mechanism, which
    stops them from being open to change. Make a point yourself of always being open
    to change.


    The fact that you are reading this book probably means that you *are* ready to
    make changes in your life. Read the book, reread it, dip in and out of it and
    make it an AMAZING way of life. Begin by changing everyday routines – move the
    kettle, move the food around in the kitchen cupboards, take a new route to work,
    walk a different way around the supermarket, or even do your shopping in a different
    shop. Create as many small changes as you can so that you feel your life flowing
    in a new direction. Self-talk yourself into the positive: ‘I can do it. I am doing
    it. It is done.’


    *   **Change will set you free.**


    ### *Autumn leaves technique*


    **Imagine brightly coloured autumn leaves blowing in the breeze on a large oak
    tree. Imagine the leaves falling one by one from the tree branches. Imagine the
    breeze blowing them high up into the air so that they dance through the sky. Imagine
    the leaves being swept along into the distance until they gradually disappear.
    You can take as much time as you like to do this as you let go of each leaf. As
    you imagine the leaves blowing in the breeze, allow all the excuses to release
    from your mind. Feel the feeling of a cooling breeze sweeping around the trees,
    moving the leaves gently from the branches as you easily allow the excuses to
    disappear into the distance along with the leaves.**


    **When you are ready, imagine the tree ready for new buds to grow and flourish,
    just as your ideas are able to flourish, too, as you feel ready for a fresh start
    to make good things happen for you. Gradually imagine the new green leaves, bright
    and fresh, with the sunlight dancing across them as they gently blow in the spring
    air. Imagine your ideas flourishing as you develop your positive ideas and life.
    Make positive choices and decisions as you allow life to flourish.**


    **Repeat this exercise occasionally to help move your mind forwards to new and
    better things.**


    ## Be enthusiastic, train yourself to think of things you can do and start believing
    in yourself


    You don’t need to know what is around the next corner. Just do what feels right
    to get to the corner so that you have a chance to see around it. You don’t need
    to know your whole life plan. Just do something to get yourself moving forwards.
    Don’t be the person who lets life pass them by. Instead, encourage yourself. See
    a wiggly string leading you to everything you need to find along the way.


    *   **Cut the excuses from your life and feel AMAZING.**


    ## Your life is like a home


    You can choose what you do and don’t want to have in your life. Think of your
    life as being similar to your home. You can choose how to decorate and furnish
    where you live. You may de-clutter from time to time, getting rid of old things
    you don’t want any more. Well, your life is the same. There may be things you
    have outgrown and other things you aspire to have. It is a good idea regularly
    to take a look at where you are in your life so that you can identify what you
    can ‘bring in’ or ‘take out’ to improve it. And it is also a good idea to de-clutter
    your real home, as it is a reflection of who you are.


    Surround yourself with things that remind you of the life you aspire to have,
    such as books about successful people, fresh flowers, car magazines, positive
    pictures on the walls, perhaps including a picture of your degree certificate
    or photographs of happy holidays, and cushions with words written on them such
    as ‘happy’, ‘calm’, ‘love’ ‘AMAZING’ – in fact, anything that works for you. Surrounding
    yourself with a taste of the lifestyle you want will help you to create that life.
    You may not own that Manhattan penthouse apartment yet, but a book on your coffee
    table about New York skylines will make you SMILE every time you see it and will
    help you to feel closer to that dream. Be selective about ‘what’ and ‘who’ you
    put into your life and into your home. Feel at home in your life and in your home.


    ### *Heart cupboard technique*


    **Imagine a cupboard or cabinet in your mind. Imagine it is heart-shaped or has
    a heart design on it. Visualize opening the doors to reveal the contents. Imagine
    taking the contents out. Let go of the clutter, throw things away, have a good
    clear-out. As you do this, imagine your mind and your body can let go of past
    emotions. As you sort through the contents of the cupboard, let your mind let
    go of the negative past, put the now and the future in place. Make a conscious
    decision to put back only what is useful to you and the things that inspire you.
    Feel your heart filled with warmth and happiness as you SMILE and say ‘It’s AMAZING’.**


    **Much of your life is good, so make sure to keep hold of the things you have
    now which are useful and keep some positive things from the past. But make the
    cupboard comfortable so that your heart is filled with joy. You can decide what
    you would like to put in the cupboard. Let the clutter dissolve and let your heart
    cupboard fill up with happy, warm-hearted, homely feelings, allowing the changes
    to happen at a pace that feels right for you.**


    **Repeat this exercise, maybe each time with different things in the cupboard.**


    Your surroundings will filter into your subconscious mind, programming you to
    create the life they represent and making you believe that it is possible to live
    the life you want to live.


    **Cut the clutter from your life and feel AMAZING.**


    * * *


    #### Chapter summary


    *   Spend time with people who are good for you.


    *   Have quality time with your family.


    *   Have quality time with yourself.


    *   Have quality rest and relaxation.


    *   Enjoy the skills you have at work.


    *   Build upon your skills.


    *   Be clever with your money.


    *   Be kind and treat other people well.


    *   Respect yourself and your body.


    *   Respect women, men, children, animals and the environment you are in.


    *   Support charities you believe in.


    *   Use the autumn leaves technique: let the leaves blow into the distance as
    excuses dissolve. Allow the new spring buds to grow. Allow your ideas to flourish.


    *   Use the heart-shaped cupboard technique: de-clutter the heart cupboard to
    allow the warmhearted, homely feelings to flourish in your life.


    **STEP 1. Live the best life you can.**


    **STEP 2. Make your life AMAZING.**


    **STEP 3. Live a life that makes you SMILE.**


    * * *


    ## [ABOUT THE AUTHOR](../Text/contents.xhtml#toc18)


    ![Ailsa Frank](Images/p253.jpg)


    Photograph: Stephen Payne


    **Ailsa Frank** is a self-help author, motivational coach and leading hypnotherapist
    with a compassionate yet no-nonsense approach. She is well known for helping people
    with heartbreak, alcohol, money, relationship, health, confidence and emotional
    issues. Through workshops, one-to-one therapy and her range of hypnosis downloads,
    Ailsa has already helped thousands of people improve their lives.


    Ailsa was a successful career woman until, in 2002, her life fell apart following
    divorce, mental breakdown and losing custody of her daughter. She chose not to
    take anti-depressants, and instead decided to face her problems head-on by changing
    her mindset and her life. Having worked out how to help herself, she initially
    set a goal to help one other person, as she believes that ‘every life matters’.'
