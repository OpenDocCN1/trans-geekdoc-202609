- raw: 'If you have experienced some kind of loss, you may be feeling devastated and
    believe that you will never really enjoy life again. It’s true that life will
    be different, but there is no reason why you can’t eventually replace the pain
    you have experienced with joy. There is an old saying that time is a great healer.
    But it is not time itself that heals you, it is what you choose to do with it.
    If you tell yourself that you will find ways to make your life wonderful, even
    better than it was before, your mind will become solution-focused and open to
    the things that will help you.


    ### *Stepping-stone technique*


    **Accept the way you feel and that it may take some time to release all your emotions.
    Give yourself the space and time you need and then imagine all those feelings
    are part of the path of your life. See the event that has occurred as a stepping
    stone in a long line of stepping stones in your past and know that you will create
    more stepping stones in the future. Every time you think of the person or event,
    see it as a stepping stone rather than as a movie running repeatedly in your mind.
    By taking control and stopping the movie of past events, you will get out of the
    emotional spiral. Imagine there is a wiggly string in front of you leading you
    to everything you need to be able to accept and move on from your loss or bereavement.**


    *   **If you feel a bereavement feeling, sit with it and let it pass as you say,
    ‘It is working out AMAZINGLY well.’**


    Good can come from every situation and you need to get up each day ready to find
    the good that is out there for you. Once you find the good that will help you,
    you will be able to use your own knowledge and experience to help someone else
    one day. Remember, you are not alone. There is a lot of loss in the world – it
    is part of life.


    There is nothing you can do to change the past, but you can change the way you
    feel about the past so that you can move forwards to your future. Be happy for
    the good times you experienced. Be contented. Find the lessons to be learned from
    what has happened. And remember that everyone else is creating their own life,
    just like you must create your new life going forwards.


    If you have suffered an injustice, remember that everyone is doing the best they
    can. Everyone has limitations, so try to accept them for who they are or were.
    Assume that whatever has happened was meant to happen, and allow yourself to live
    a better life.


    We are programmed from a young age to believe that everything should be perfect,
    whereas in reality we are all part of nature and life can be unpredictable. If
    your subconscious mind was taught from a young age that loss and bereavement may
    happen and if certain events do occur you will feel fine, you would probably cope
    easily when they did. But it’s more likely you were told that life is supposed
    to be a certain way and it didn’t work out that way when you experienced loss.
    You are a sensitive and loving person, and you are also strong enough to get through
    what has happened. You can, you will and you are already getting through it. Try
    the following exercise to help you.


    ### *Happy photo technique*


    **Find a happy photo of yourself and the person you have lost.**


    1.  **Speak to the image of yourself. Tell yourself whatever you want to say.
    Let the emotions out. Say the sad things, say the good things, cry unhappy tears
    and cry good tears. Let the sad feelings release to allow the happy feelings to
    flow again. Tell yourself you can be happy again. Tell yourself you will find
    happiness again. Don’t let other people spoil your happiness. Speak to yourself
    as you would if you were reassuring a small child. Say, ‘Things will work out
    AMAZINGLY well. Your life will be even better. You will find a way to make this
    whole episode work out as well as it can.’**


    2.  **Speak to the image of the person you have lost. Tell them everything you
    want to say. Tell yourself, ‘My life without you is going to be an AMAZING adventure.
    I will prove to you that my life will be AMAZING.’**


    ### *Changing seasons technique*


    **We are all part of nature and, just like nature, life is a series of seasons:
    the flowers begin to open in the spring; in the summer they blossom some more;
    in the autumn the leaves fall from the trees; and in the winter the cold days
    allow us to appreciate the warmth of our homes. Without the heat, you would not
    understand the cold. Without the rain, you would not notice the sun. Like nature,
    your life is a continuous journey of change. Some of those changes will involve
    personal difficulties that will teach you things, such as compassion and kindness
    to others. There will always be changes in life. Learn from your experience of
    loss never to allow change to affect you so much that it causes you pain. Life
    is too precious to allow it to be interrupted so abruptly by hurt. Let it dissolve.
    There is good in every situation. Learn to flow with what is happening. Breathe
    calmly and deeply and feel relaxed about the situation as you think of the seasons
    changing and life flowing again from now onwards.**


    A few years ago, I lost a dear, close friend to cancer. I decided I would not
    let her loss be a painful experience. So, in honour of her, I put nice napkins
    on the table every day (no more waiting for birthdays and special occasions).
    Using a nice napkin is a reminder to me to live every day to the full and to have
    an AMAZING life. It also helped me to feel more positive when I thought about
    my friend. Paper napkins have a positive, uplifting feeling as they are associated
    with celebrations and so they remind you of good times.


    One day, my sister visited and commented how nice it was that I had a pile of
    brightly coloured patterned napkins in a napkin holder on the table. ‘What are
    we waiting for?’ I asked her. ‘I mean, really, what are we waiting for? Let’s
    start living!’


    ‘You are so right,’ my sister said. ‘I am going to start having pretty napkins
    every day too!’


    Even in a restaurant when I am offered a napkin, I SMILE to myself, as it reminds
    me to be happy. The napkin is just a symbol of the need to appreciate life.


    Buy a napkin holder, fill it with colourful paper napkins and start living each
    day. (And, please send me a picture of your napkins: Ailsa Frank blog, Twitter
    @AilsaFrank or Instagram ailsafrank)


    *   There really is no time like the present.


    *   Find purpose to your life again.


    *   Make your daily living a happy experience.


    Remember, before you lost the person, you were getting on with the majority of
    your day or your week independently from them. You will gradually get used to
    being independent and without them all of the time. Focus on getting through the
    next minute or hour or day or week. Take it step by step, but keep moving forwards.


    *   If you have lost a pet, get another one.


    *   If you have been betrayed, find a better partner.


    *   If you have lost a loved one, find hobbies, a career and people to help fill
    the gap.


    *   If you have lost a child, find purpose in your life by doing something AMAZING.


    *   Do something special to replace the loss.


    *   Turn the situation into something AMAZING.


    The plan has changed. You can cope with the new plan, so start feeling excited
    about it. It’s normal to have a bad moment. Let the feelings pass like clouds
    in the sky. Make plans and enjoy the adventures ahead. There will always be something
    positive to help fill the empty space left in your life when you lose someone.
    It will be different, but it can be good.


    ## Getting over the heartache of divorce or a break-up'
