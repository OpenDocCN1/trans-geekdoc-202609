  trans: '


    **像富有的人一样去生活吧——在你的预算范围内——并相信美好的事物。始终把钱留在钱包里，但要训练自己不要花它。如果你没有闲钱可以做到这一点，就在钱包里放几张纸片，让它看起来像要溢出来了一样。当你对金钱感到良好时，奇迹就会发生在你身上。**


    ## 重新审视你的支出


    凯瑟琳（Catherine）是一位 30 岁的职业女性，也是我的客户之一，她告诉我她买不起房产。我们讨论了她在衣服、酒精、外出、冲动购物、杂志、未使用的发用和化妆品上花费了多少钱，并得出结论：这相当于大量的浪费。然后，我和她一起改变了脑海中负面的消费习惯。


    在改变消费习惯后的几个月里，凯瑟琳还清了部分信用卡债务。一年内，她存够了首付款，并且通过对能负担得起的购买区域保持现实态度，成功买了一套房产。


    **我的建议：** 通过观察财务事实，你可以看到自己错在哪里。不同的选择和决定将使你的梦想实现。


    ## 钱可能从意想不到的来源


    一位名叫特丽莎（Trisha）的客户告诉我，她必须搬到国家的另一个地方临时住六个月，她在新地方不需要家具。她感到压力很大，因为她没有钱把家具存放在仓库，直到她回到这个地区；而且她无法把家具留在她只租的公寓里。在帮助她释放负面压力后，我告诉她想象搬家进展得*非常奇妙*，而且在财务上也*极其完美*。她起初很怀疑，但说她愿意一试。


    两周后，特丽莎回来进行下一次咨询，讲述了一个最*神奇*的故事。一个潜在的新租客来查看她要搬出的公寓。正当他要离开时，他又探头回到门口说：“如果我租了这套公寓，你不会介意让我租你的家具六个月吧？”于是，在特丽莎搬走的那天，她把食物、衣服和洗漱用品装进车里离开了。作为她能将所有家具和日常家居用品留在公寓里的报答，她每月可以获得
    400 英镑。她不仅不需要支付仓储费，反而有了收入。现在，这太*奇妙*了！


    **我的建议：** 遵循书中的技巧来释放负面信念，然后假设事情会进展得*极其完美*。如果你必须存放物品，请进行一次彻底的大清理，这样你就不必为不需要的东西付费了。


    ## 奇妙的事情会发生


    一位名叫尼格尔（Nigel）的客户告诉我，他无法继续苦苦支付养孩子的所有费用和日常生活费用，由于他的钱只够支付房贷的利息，他的欠款永远不会减少。在咨询期间帮助他释放了负面恐惧后，我告诉他：“事情会发生。情况会改变。往*奇妙*的方向思考。”


    不到一周后，尼格尔的岳父决定给他的女儿和丈夫 10 万英镑，以偿还他们的房贷。尼格尔对这种*奇妙*的运作方式感到*非常惊叹*！


    **我的建议：** 你可能没有富有的亲戚，但你不需要知道那些*奇妙*的、意想不到的事情是什么。只要知道它们*会*是*奇妙*的。对早还房贷保持开放态度。对自己说：“我们以一种*奇妙*的方式还清了房贷。”


    ## 即使是糟糕的境地也可以变成最好的


    一个自雇客户失去了大客户，这意味着他的收入几乎一夜之间停止了。我帮助他相信对他来说这是件*奇妙*的事。与我见面几天后，他带着开发其他市场的想法醒来。那个老客户让他太忙了，以至于忽略了更丰利的工作领域。他保持了那种*奇妙*的感觉，这使他找到了新的更好的客户，并让他的业务向着*奇妙*的方向发展。


    **我的建议：** 通过释放负面信念并保持在*奇妙*领域，你可以让更棒的事情发生。


    ## 获得你想要的工作和想要的薪水


    莎拉（Sarah）是一位自由记者，她获得了一份在杂志工作的理想工作。但她不想接受，因为这涉及到薪水的大幅减少。我对她进行了一些催眠治疗，并使用了书中描述的一些技巧。


