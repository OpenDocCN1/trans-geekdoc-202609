- raw: "Luckily, during the lowest point in my life, I met someone who loved and supported\
    \ me, because he could see who I really was. He told me later that the reason\
    \ he had stayed with me during some of my low points was because he could see\
    \ that, even when I was desperate because I had no contact with my child, I was\
    \ constantly moving forward. That man is now my husband, and the support he gave\
    \ me at that terrible time helped me enormously. I realized then that the key\
    \ to improving your life is to keep changing and evolving by changing your mindset,\
    \ so that you never become stuck in a bad situation.\n\nAlthough I now have good\
    \ relationships with my family and ex-husband, I know what it feels like not to\
    \ be believed or approved of by your friends and family, and how difficult it\
    \ is to have to learn to cope alone. I also know that if I can change myself and\
    \ the circumstances of my life, every client who comes to me feeling lost, stressed,\
    \ upset or unable to cope can make their life AMAZING too.\n\nWhen I started out\
    \ as a therapist, I hoped to be able to use the knowledge I had gained for myself\
    \ to help just one person. Little did I know that I would end up helping thousands,\
    \ which is something I’m immensely proud of, because everyone’s life matters –\
    \ not just to them, but to me too.\n\nI wrote this book to share with as many\
    \ people as possible the knowledge and tools I have found to be effective, so\
    \ that they can avoid or find solutions to their own problems and learn how to\
    \ Cut the Crap and Feel AMAZING. Many people have more skills and more knowledge\
    \ based on their own life experiences than they realize. So even when you think\
