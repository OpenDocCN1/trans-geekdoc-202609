  trans: '


    *   使用“池中投石”法：想象石子代表你脑海中的任何负面情绪，然后将它们投入花园池塘并让它们融化。

    *   对事情会进展得**极其顺利**保持乐观态度。

    *   说：“太棒了。太棒了。一切进展得**极其顺利**。它已经进展得**极其顺利**了。”

    *   使用“垫脚石”法：想象你的生活是一系列垫脚石，身后是过去坚实的土地，前方是未来的道路。

    *   对自己说些积极的话。

    *   你越早开始关注你想要的生活，你就越早能过上那种生活。

    *   使用“精彩的一天”技巧：在每天睡觉时保持**微笑**，并想象每一天都是**精彩**的。

    *   你可能在生活的某些方面非常优秀，但在其他方面却如此。切断负面并进入**精彩**状态将帮助你改变现状。

    *   ![image](img/img1.jpg)让生活成为一场**精彩**的冒险。

    *   在脑海中捕捉生活中发生的**精彩**瞬间。

    *   将良好的经历储存在你的**精彩**区域。

    *   不要陷入负面情绪中。相反，要说：“别废话了，感觉**棒极了**。”


    ### 第一步。跳出戏剧性戏码。

    ### 第二步。假设一切都会进展得**极其顺利**。

    ### 第三步。说“太棒了”。


    ***


    你的**微笑**是你改善生活最**精彩**的工具。它是免费的，无论你去哪里都带着它。把嘴角上扬露一个**微笑**，感觉更加**精彩***。


    ![第二章：微笑](img/contents.xhtml#toc2)


    很多年前，我正在读一本关于如何冥想的书。正如你可以想象的，边看书边冥想是很的！我想一定有更简单的方法。于是，我放下书，闭上眼睛，问自己什么是最简单、最好、最有力量、最**精彩**的冥想技巧是什么。然后，在一个灵光一现的时刻，我得到了答案：只需**微笑**。


    为了加强**精彩**区域，我向客户教授我的“SMILE 技巧”。当你**微笑**时，你的大脑产生一种化学物质——名为`dopamine`——它能提升你的情绪，产生积极、快乐的感觉。


    你可以在任何时间、任何地点**微笑**。只需放松，将嘴角上扬露一个**微笑**。只要你一这样做，你就会开始感到快乐，你的身体在生理上会变得更加放松，情绪也会变好。


    我曾对许多客户使用过这种技巧来消解抑郁或负面情绪。当你**微笑**时，很难感到低落，尤其是当你的大脑告诉你你感觉很好时。当你**微笑**时，你会发现你的大脑变得以解决方案为中心，因此你可以找到处理日常问题的最佳方法，这反过来也会帮助你创造美好的未来。


    我教了两种方法：


    #### 1. SMILE 技巧

    在做日常事务时简单地**微笑**，例如刷牙、工作、做家务、整理房间、读书、在超市里逛逛、开车或学习。在**微笑**的同时，允许自己深入思考。你会发现自己感觉变得更积极了。


    #### 2. SMILE 冥想

    在合适的地点感到放松时（如在床上、沙发上、坐在火车或飞机上），闭上眼睛。**微笑**并让积极的情绪席卷全身。当你**微笑**时，思考你的生活以及你想要实现的目标。你会自动觉得那是可以实现的。让任何挫败或负面的情绪流走。当你**微笑**时，一切看起来都会变好。你会感到事物变软了，它们看起来不再那么糟糕。这不仅让你在当时感觉更好，还会建立一个积极的情库，帮助你创造一个更积极的未来。


    我建议你亲自测试一下 SMILE 技巧。尝试在不**微笑**的情况下思考一个问题，然后在**微笑**的情况下思考同一个问题。只要你一**微笑**，你就会以解决方案为中心，并对处境感到更加积极。例如：


    *   不**微笑**时，某人可能感到为金钱焦虑。

    *   **微笑**时他们会感到：财务状况尚可，我会找到解决办法。


    通过 SMILE 技巧，你会发现更容易创造**精彩**的感觉。你还会意识到，缺乏**微笑**是许多人转向抗抑郁药物的部分原因。你越**微笑**，感觉就越快乐、健康。


    自我表达是一个自然的过程，我们需要通过它来保持快乐。随着西方孩子长大，他们的生活变得缺乏表达力且受控越来越多。当他们成年时，裂痕已开始出现，对于某些人来说，积累的顺从最终会导致中年危机。


    2004 年我有机会访问了尼日利亚。在那里期间，我在一家孤儿院对孩子们进行艺术治疗。那些孩子们住在一个狭窄的房子里，晚上睡在地板上，并不是每天都能吃饭。他们的年龄从
    3 岁到 18 岁不等。从外人的角度来看，他们几乎没有什么值得快乐的。但他们拥有极其令人置信的积极精神，那种发自内心的喜悦我在英国从未见过。


    起初，我无法确定是什么创造了孤儿院孩子的快乐。后来我意识到，那是他们的自由感。他们在艺术创作上非常有创意，并从中获得了巨大的快乐。在同样的旅行期间，我带着同样的艺术材料进入了一所英国国际学校。这一次，孩子们更加内敛，等待着对艺术材料的批准和指示。挂在绳子上的是一排甲虫画，所有的画都一模一样——甚至斑点的位置都一样。


    与孤儿院的孩子相比，国际学校的孩子看起来有些忧郁。我意识到，教育系统正在扼杀他们的快乐。标准化他们的艺术品使其沦为毫无意义的流水产物。


