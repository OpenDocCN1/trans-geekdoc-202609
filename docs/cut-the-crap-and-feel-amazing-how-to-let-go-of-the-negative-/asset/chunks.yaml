  trans: '


    通过接受人生的现状、定期陈述你想要的结果，并采取改变现状所需的行动，你将使那个结果变为现实。事实上，我们正在通过对自己和对他人说的话来自我催眠。记住，你的言语创造了你的生活。我已经多次亲自尝试并测试了这一理论。在过去，当那些容易认为某事是不可能的情况下，我发现通过自我自语引导自己向积极方面发展会让事情非常迅速地发生。


    作为一名催眠治疗师，我理解大脑会听从我们的指令去做。但大多数时候，人们通过使用混乱的自我自语在不断给自己传递矛盾的信息。许多人认为他们正在从外部吸引事物，而事实上，是内心的自我自语导致了外部事情的发生。人们往往将力量交由外部影响。但一切都是由你以及你应对生活的方式创造的。一个成功的男或女商人不会在第一个障碍面前就倒下。如果某件事没有成功，他们不会怀疑自己或能力。他们会找到方法让它发生，就像运动员一样。成功的人拥有一种内在信念和动力，赋予他们一种“我行，尽管放马”的态度。他们通常是乐观的人，喜欢与周围其他积极、志同道合且拥有相似积极观点的人在一起。


    我们在生活中都倾向于让自己被与我们频率相似的人包围。所以，如果你觉得周围有负面的人不对，你可能已经准备好向积极的维度迈进，与和你想法一样的人在一起。待在让你感到舒服的人身边感觉很好。当你处于适合你的人身边时，就像在和自己相处一样。随着你完善“我可以行”的观点，你会发现自己开始进入更积极的朋友、家庭和同事圈子。放手你认识的某些人是没关系的，这样让他们可以找到适合他们的人，而你也能找到适合你的人。


    记住这一点，开始从你的待办清单上做一件事。这会打破“不做”的习惯，并在你的脑海中开始创造一种“行事的的习惯”。很有可能，如果你从一件事开始，你就会继续做两件、三件，甚至是四五五件事，并可能完成整个列表。


    回想你在日常生活中或工作中完成任务或实现目标的时刻。通过提醒自己这些成就，你将开始发现自己一直在推进事务。你现在想要实现的这一件事，与你以前那些甚至没想过就完成了其他事情一样简单。


    ## 所以，去做其中一件事。


    如果你在开始做某件事上感到挣扎，就深呼吸几次，将你所有的思想都集中到执行任务的行动上。当你呼吸时时，在脑海里对自己说：“我可以做到。我正在做。这已经完成了。”即使你做的第一件事只是移动几张纸、打开电脑、点开一封邮件或做一个决定，你已经开启了行动的进程。


    *   从最容易的一件事开始，让自己动行动起来。

    *   当我们付诸行动时，事情就会完成。

    *   当我们处于积极的心态时，更多积极的事情就会发生。


    ### 内在教练技巧


    **想一个你仰佩的人，他们正在做你正尝试实现的事情。想象他们是你的教练，并且他们相信你。他们会对你说什么？他们会如何鼓励你？他们会给你什么建议？**


    **想象他们对你说出一些惊人的话。那些话是什么？**


    **例如，对于一个正在重新设计家居的人，教练可能会说：**“你有惊人的风格和创造能力。你对色彩很有天赋。你非常擅长选择室内装饰。你很聪明，能在预算内取得专业成果。”


    **对于一个正努力找新工作的人，教练可能会说：**“你有这么多技能。看看你在你的工作领域表现得多么出色。你有这么多经验。你是一个极优秀的候选人。我一定会雇用你。”


    **对于一个正在寻找爱情的人，教练可能会说：**“你是一个如此优秀的人。世界上有数亿人，那里有很多惊人的人等着你。你会找到一个完全崇拜你的特别的人。你看起来非常漂亮/帅。你有着惊人的性格。你如此善良。你是个极好的伴侣。”


    **对于一个想要还债的人，教练可能会说：**“你既才华又有技能，你可以利用这些特质找到积极的方法来还债。你很聪明。你会找到控制财务的方法。你会开始储蓄，让自己获得财务安全。从现在起，通过明智地用钱扭转你的财务状况。你可以轻松赚到更多钱。”


    **对于一个想要搬家的人，教练可能会说：**“那里有数百万个优质房产，你会找到一个惊人的。你拥有所有的技能来为自己创造好事。”


    **对于一个正在学习的人，教练可能会说：**“看看你迄今为止的成就。正是因为你如此惊人，你才坐在这个位置参加这些考试。你拥有惊人的天赋。你会专注于你的学习，并坚持一个合理的时间计划。你会记住这些信息的。你会对结果感到欣喜。你在考试中会感到冷静，并且表现得非常惊人。”


    **对于一个想要减肥或减少酒精摄入的人，教练可能会说：**“你可以放下的。你可以明智地饮食。我见过你多次这样做。你非常擅长改变。当你专注时，你是非常成功的。我信任你。”


    ## 积极谈话


    教练不会说任何侮辱或负面的话，就像人们对自己说的话那样。你可能需要时间来适应成为脑海中的积极教练，因为你可能不习惯听自己的赞美。如果你注意到旧的声音回来了，记得切换回你的积极声音。尝试用更积极的词来加强每一句陈述的积极性。让教练的热情变得夸张一些。在吸收赞美时微笑。习惯被自己赞美。


    *   即使你只做一次这个技巧，你也将开启你的大脑使其走出负面困境。


    我帮助过很多客户使用这些技巧。我知道任何人都可以改变，因为作为一名治疗师，我每天都能看到这种情况。通过改变你脑海中的对话，你可以实现你的目标。


    我教了一个打高尔夫的朋友这些技巧。（他说他大部分时候打得很糟糕！）与其说“我希望球不要进长草区”，我告诉他对自己说：“我可以把球击进洞里。球正在进洞里。”几周后，他告诉我，他在发发球时尝试了这种技巧，对自己说：“球向上。球正在向上。球正在向高处飞。”他不断重复着，然后把球击向高空，这是他以前从未做过的。球撞中了他所处练习场的屋顶，然后弹回来，击中了他的头部，差点把他撞晕过去！


    我告诉他：“在一个有屋顶的建筑里，告诉你的大脑把球击高可什么好主意！而且，我原以为你要尝试把球击进洞里。”


    “我忘了，”他说。


    “下次试试吧，”我建议道。


