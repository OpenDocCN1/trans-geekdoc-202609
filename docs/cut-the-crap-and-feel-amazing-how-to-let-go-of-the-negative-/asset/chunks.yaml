- raw: 'Your children are mirror images of you. So if you are anxious about burglars
    breaking into the house, they will be too. If you are stressed about the traffic,
    your children will be too. If you shout, your children will shout too. In fact,
    your children will use *your* language, so if you bitch about other people, they
    will become bitchy too. If you tell them your own fears – about global warming,
    for example, or about how a particular election result will prove to be a disaster
    for the country – they may become even more worried than you are, and may even
    fear that the world is about to come to an end. If you have a fear of spiders,
    ‘sort your fear out’, because no matter how hard you try to cover it up, your
    kids will sense it and they may develop a similar fear themselves.


    Try to diffuse situations by being positive and avoiding drama. For example, if
    your child doesn’t get a part in the school play or get picked for the football
    team, don’t buy into the drama. Instead, say, ‘It will be fine. Something better
    will happen. It will work out AMAZINGLY well.’ Or ‘Maybe you will get in next
    time.’


    ## Your words are powerful, so be careful about the words you use


    If you call your child a pest, they may grow up to think that they are getting
    in the way of other people. If you call your child naughty, they will live up
    to their reputation. Instead of branding them with names, try to distract them
    from negative behaviour.


    Stay positive and calm and say, ‘It will all work out AMAZINGLY well.’


    ## Be a great role model


    If you are having an emotional meltdown in your life, don’t expect your kids to
    be your carers. Instead, sort yourself out by getting outside help. Protect your
    children from hearing your negative story. If what you want to say is not going
    to enhance their lives, don’t say it at all.


    If you cry when your children go to university, go away on holiday without you
    or leave home, you need to find hobbies or work to fill the void. Use the techniques
    in this book to help you build the next AMAZING phase of your life. Your children
    should be able to get on with their own lives without having to worry about you.
    And you should be delighted for your children when they are getting on with the
    adventure of their lives.


    If you make demands on your children and ask them to sort out your problems, be
    aware of what you are doing, sort out your own problems and set them free. Your
    children are not there to be your counsellor, to sort out your money, marriage,
    work or health problems.


    Perhaps your own parents have put you in the role of problem solver for them.
    If so, start to set boundaries by telling them, ‘You will be able to sort this
    out.’ Believe that there are AMAZING ways to sort things out, as everything can
    improve and be resolved. Don’t be at the beck and call of your children or your
    parents. If you, your adult children and your parents all lived on different continents,
    you would all have to sort out your own problems. Obviously, there may come a
    time when your parents are old and need support. But wait until these issues arise
    and then find the most AMAZING ways to deal with them.


    *   Get the balance right between support and independence for you, your children
    and your parents.


    *   Teach your sons and daughters to be decent people who respect all other people,
    animals and the environment.


    *   Explain things to your children in a way that is appropriate for their age.
    Sometimes, they need to know things, whereas at other times it may be better to
    protect them from negative news that they don’t really need to know about.


    ## Teach and guide


    You can teach children something or nothing using the same activity. Imagine two
    separate, unrelated parents in two different gardens in the autumn time. The first
    parent says to his children, ‘Mind the tree roots. Don’t trip over. Don’t get
    your hands dirty. Be careful of the prickly holly.’ The other parent asks his
    children to help collect the autumn leaves and put them in a sack. The sack fills
    up quickly and when the children think it’s full, the parent tells them to stand
    on top of it to compress the leaves and make room for more. The children in the
    second garden are enjoying themselves more than the ones being micro-managed by
    the obsessive parent. The parent in the first garden is teaching his children
    nothing other than fear and that the garden holds all sorts of dangers, while
    the parent in the second garden is teaching his children lessons and skills.


    Let your children make their own choices and decisions from an early age. Let
    them take part in choosing presents for friends and family. And let them choose
    what to wear as soon as they want to do this. You don’t need to give them a full
    choice from every item of clothing they possess. Just give them a limited choice
    between a couple of outfits. As they get older and can make decisions more quickly,
    you can give them more choice. Your clothes say a lot about you, so let your children’s
    personalities flourish. By allowing them to develop confidence about who they
    are, they will learn to be independent too. If you are in the habit of taking
    control of their choices, they will grow up questioning their own decisions.


    ## Coffee and doughnuts


    Take time to connect with your children. A trip to a café just to sit and hear
    what they have to say is a good way to catch up with each other without the distractions
    of home. (Turn your phone off!) Try to have individual time with each of your
    children. Don’t make excuses that there is no time. Make it possible: ‘I can do
    it. I am doing. It is done. I make it a priority.’


    Rearrange your life to schedule communication time with your children. Have a
    relaxed time together and be interested in them and their lives. Talk about your
    life too, so that they get used to discussions not just being about them. A good
    communicator will ask questions and be interested in other people. So teach them
    this. Talk about subjects that interest them. Build a relationship that will last
    a lifetime. Love them and accept them. If they don’t live up to your expectations,
    just accept that. If you don’t get along with your kids today, will you ever?
    Many people don’t talk to their parents or siblings. Will you be the kind of parent
    that is visited out of a sense of duty rather than because your children really
    want to spend time with you? It all begins now.


    ## Communicating


    I often watch parents in cafés. Some of them micro-manage their children, some
    ignore them and immerse themselves in a computer or phone, and some have enjoyable
    conversations with them.


    Communicate with your children face to face. Sit at the table as a family to eat
    your evening meals. If you have nothing to say to your children, ask yourself
    why? What could I do better? Read your children’s body language. If they shrink
    back when you say something, talk about something more positive that interests
    them.


    If you are a single parent or divorced, don’t talk about your ex-partner or your
    love life in front of your children. Think before you speak.


    ## Distract


    One day, I saw a small child having a tantrum in a London Underground station.
    The mother was telling him to stop and to stand still, but he carried on. There
    were some aeroplane posters on the wall in front of them and the mother could
    have distracted the child by saying, ‘Wow, look at the aeroplanes!’ But she was
    so wrapped up in his behaviour she didn’t even notice them.


    Look for things around you to distract your child from bad behaviour. If you are
    frustrated, your child probably will be too. The mum at the Underground station
    may have been tired, but sometimes it is less tiring to have a distraction conversation
    rather than a battle. Always plan ahead and have an activity bag with you, as
    small children get bored easily when travelling or in restaurants.'
  fmt: '

    Your children are mirror images of you. So if you are anxious about burglars breaking
    into the house, they will be too. If you are stressed about the traffic, your
    children will be too. If you shout, your children will shout too. In fact, your
    children will use `your` language, so if you bitch about other people, they will
    become bitchy too. If you tell them your own fears – about global warming, for
    example, or about how a particular election result will prove to be a disaster
    for the country – they may become even more worried than you are, and may even
    fear that the world is about to come to an end. If you have a fear of spiders,
    ‘sort your fear out’, because no matter how hard you try to cover it up, your
    kids will sense it and they may develop a similar fear themselves.


    Try to diffuse situations by being positive and avoiding drama. For example, if
    your child doesn’t get a part in the school play or get picked for the football
    team, don’t buy into the drama. Instead, say, ‘It will be fine. Something better
    will happen. It will work out AMAZINGLY well.’ Or ‘Maybe you will get in next
    time.’


    ## Your words are powerful, so be careful about the words you use


    If you call your child a pest, they may grow up to think that they are getting
    in the way of other people. If you call your child naughty, they will live up
    to their reputation. Instead of branding them with names, try to distract them
    from negative behaviour.


    Stay positive and calm and say, ‘It will all work out AMAZINGLY well.’


    ## Be a great role model


    If you are having an emotional meltdown in your life, don’t expect your kids to
    be your carers. Instead, sort yourself out by getting outside help. Protect your
    children from hearing your negative story. If what you want to say is not going
    to enhance their lives, don’t say it at all.


    If you cry when your children go to university, go away on holiday without you
    or leave home, you need to find hobbies or work to fill the void. Use the techniques
    in this book to help you build the next AMAZING phase of your life. Your children
    should be able to get on with their own lives without having to worry about you.
    And you should be delighted for your children when they are getting on with the
    adventure of their lives.


    If you make demands on your children and ask them to sort out your problems, be
    aware of what you are doing, sort out your own problems and set them free. Your
    children are not there to be your counsellor, to sort out your money, marriage,
    work or health problems.


    Perhaps your own parents have put you in the role of problem solver for them.
    If so, start to set boundaries by telling them, ‘You will be able to sort this
    out.’ Believe that there are AMAZING ways to sort things out, as everything can
    improve and be resolved. Don’t be at the beck and call of your children or your
    parents. If you, your adult children and your parents all lived on different continents,
    you would all have to sort out your own problems. Obviously, there may come a
    time when your parents are old and need support. But wait until these issues arise
    and then find the most AMAZING ways to deal with them.


    - Get the balance right between support and independence for you, your children
    and your parents.

    - Teach your sons and daughters to be decent people who respect all other people,
    animals and the environment.

    - Explain things to your children in a way that is appropriate for their age.
    Sometimes, they need to know things, whereas at other times it may be better to
    protect them from negative news that they don’t really need to know about.


    ## Teach and guide


    You can teach children something or nothing using the same activity. Imagine two
    separate, unrelated parents in two different gardens in the autumn time. The first
    parent says to his children, ‘Mind the tree roots. Don’t trip over. Don’t get
    your hands dirty. Be careful of the prickly holly.’ The other parent asks his
    children to help collect the autumn leaves and put them in a sack. The sack fills
    up quickly and when the children think it’s full, the parent tells them to stand
    on top of it to compress the leaves and make room for more. The children in the
    second garden are enjoying themselves more than the ones being micro-managed by
    the obsessive parent. The parent in the first garden is teaching his children
    nothing other than fear and that the garden holds all sorts of dangers, while
    the parent in the second garden is teaching his children lessons and skills.


    Let your children make their own choices and decisions from an early age. Let
    them take part in choosing presents for friends and family. And let them choose
    what to wear as soon as they want to do this. You don’t need to give them a full
    choice from every item of clothing they possess. Just give them a limited choice
    between a couple of outfits. As they get older and can make decisions more quickly,
    you can give them more choice. Your clothes say a lot about you, so let your children’s
    personalities flourish. By allowing them to develop confidence about who they
    are, they will learn to be independent too. If you are in the habit of taking
    control of their choices, they will grow up questioning their own decisions.


    ## Coffee and doughnuts


    Take time to connect with your children. A trip to a café just to sit and hear
    what they have to say is a good way to catch up with each other without the distractions
    of home. (Turn your phone off!) Try to have individual time with each of your
    children. Don’t make excuses that there is no time. Make it possible: ‘I can do
    it. I am doing. It is done. I make it a priority.’


    Rearrange your life to schedule communication time with your children. Have a
    relaxed time together and be interested in them and their lives. Talk about your
    life too, so that they get used to discussions not just being about them. A good
    communicator will ask questions and be interested in other people. So teach them
    this. Talk about subjects that interest them. Build a relationship that will last
    a lifetime. Love them and accept them. If they don’t live up to your expectations,
    just accept that. If you don’t get along with your kids today, will you ever?
    Many people don’t talk to their parents or siblings. It all begins now.


    ## Communicating


    I often watch parents in cafés. Some of them micro-manage their children, some
    ignore them and immerse themselves in a computer or phone, and some have enjoyable
    conversations with them.


    Communicate with your children face to face. Sit at the table as a family to eat
    your evening meals. If you have nothing to say to your children, ask yourself
    why? What could I do better? Read your children’s body language. If they shrink
    back when you say something, talk about something positive that interests them.


    If you are a single parent or divorced, don’t talk about your ex-partner or your
    love life in front of your children. Think before you speak.


    ## Distract


    One day, I saw a small child having a tantrum in a London Underground station.
    The mother was telling him to stop and to stand still, but he carried on. There
    were some aeroplane posters on the wall in front of them and the mother could
    have distracted the child by saying, ‘Wow, look at the aeroplanes!’ But she was
    so wrapped up in his behaviour she didn’t even notice them.


    Look for things around you to distract your child from bad behaviour. If you are
    frustrated, your child probably will be too. The mum at the Underground station
    may have been tired, but sometimes it is less tiring to have a distraction conversation
    rather than a battle. Always plan ahead and have an activity bag with you, as
    small children get bored easily when travelling or in restaurants.

