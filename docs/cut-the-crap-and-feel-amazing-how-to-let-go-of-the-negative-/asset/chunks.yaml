    If you worry about socialising or meeting people, imagine the event has gone AMAZINGLY
    well, feel the feeling of returning home with a smile on your face as you are
    pleased with the way the meeting has gone. Speak reassuring words to yourself:
    ‘I am fine. This is fine. I am pleasant company to be with and people like me.’


    If you worry about paying your bills or about being in debt, feel the feeling
    of having extra money every month and AMAZING savings in the bank.


    If you worry about your investments, feel the feeling of making good investment
    decisions and of everything working out AMAZINGLY well.


    If you worry about health issues, imagine them working out AMAZINGLY well so that
    you and your loved ones are fit and healthy. When things do go well, remember
    to snapshot them in your mind to build your AMAZING zone bank.


    It is sometimes hard for people to visualize a positive future. The following
    exercise will help.


    ### Wiggly string technique


    `Visualize the future as being like a wiggly string leading you on an AMAZING
    treasure hunt through your life. Imagine the string going in different directions:
    it wiggles to the left and to the right, down and up, and it leads you to the
    things you need to find. Let your life be an adventure. This exercise will help
    you to flow and be flexible in your attitudes to life. Trust that AMAZING things
    can happen. When you believe there is going to be a way forward, you will find
    it.`


    When you are worried about the future or dragged down by the past, you don’t feel
    free and comfortable in the present. Being in the present time requires you to
    see the past as the strong foundation on which you have built the person you are
    and the future as the adventure that lies ahead of you. Say to yourself, ‘Life
    is an AMAZING adventure.’


    You can come to terms with really terrible times if you focus more on the good
    feelings and less on the bad. You have already started the process of change by
    reading this chapter. The techniques will allow your mind to let go of the past
    and create positive new thinking.


    You can’t always change a situation quickly. Change may take some time. So keep
    making good choices and decisions and feel AMAZING about it eventually working
    out AMAZINGLY well.


    See past events as stepping stones in your mind, part of the journey and foundation
    of your strength. We develop our characteristics from our life experiences. Without
    the bad things, we wouldn’t be able to appreciate the good. Embrace your past
    as part of the good in your life today.


    There is always a positive that can come from a negative experience, even if it
    is only that you can help one other person as a result of your knowledge. I believe
    that has got to be a good thing.


    **Cut the negative from your life and feel AMAZING.**


    ### Chapter summary


    *   It is not what is happening but how you respond to it that is important.

    *   Use the climbing-out-of-a-hole technique: visualize yourself climbing into
    the light.

    *   Use the photo album technique: imagine the past stored in photo albums.

    *   You can’t change the past, but you can change the way you feel about the past.

    *   Soften your reaction to the past and to the future by SMILING and accepting.

    *   ![image](Images/img1.jpg)Use the clouds-in-the-sky technique: let worries
    pass like clouds moving across the sky and rub, press or tap your knuckles to
    reassure yourself.

    *   Cut the worries from your life and feel AMAZING.

    *   Imagine it is a year from now and you have had an AMAZING year.

    *   Use the red triangle technique: visualize a red triangle, put your worries
    into it and then shrink it down.

    *   Use the wiggly string technique: imagine the future as being like a wiggly
    string leading you on an AMAZING adventure.


    **STEP 1. Identify the negative.**


    **STEP 2. Consciously let the negative go.**


    **STEP 3. Say, ‘What if it is AMAZING?’**


    *By making good choices and decisions, you can create an AMAZING life. What are
    you waiting for?*


    [![CHAPTER 4: CHOICES AND DECISIONS](Images/ch04.jpg)](../Text/contents.xhtml#toc4)


    If you analyze your life, you will realize that it is just a series of choices
    and decisions, large and small. Those choices and decisions are the building blocks
    with which you create the person you are and the life you are living. By understanding
    this, you can begin to make better choices and decisions on a daily basis to improve
    your life. As a child, you weren’t in control of choices and decisions, but as
    an adult you are. Making good small choices will lead you to bigger positive outcomes.


    If you feel trapped because you think you are too far off the path of the life
    you want to live, realize that it is only a state of mind making you feel this
    way. Right here, right now, you can begin to change your life by making better
    decisions. When you do, you will be able to see how all your past choices and
    decisions led you to where you are now.


    *   **Regularly making small better choices and decisions will get you back on
    course for an AMAZING life.**


    Don’t leap out of the life you are in and run away from it. Instead, start to
    make different choices that will improve your day, your week, your relationships
    and eventually your whole life. As you gradually make the changes, you will begin
    to see improvements. Some things will turn out fine, others may never do so. But
    always make decisions when you are in a good place within yourself, otherwise
    you may run from one bad situation to another that is different but equally as
    bad.


    If you don’t enjoy your job, drive to work by a different route or get there early
    and go for a coffee before you start your day. Or avoid the rush hour after work
    by going for a swim while the traffic dies down – you may get home a bit later,
    but at least you will be relaxed. There is no rule that says you have to drive
    home when everyone else does. You do it simply because that’s what most other
    people do.


    Instead of feeling frustrated by your commute, SMILE and make positive statements
    such as, ‘I have an AMAZING journey. I have an AMAZING lifestyle.’ Your mind will
    listen to the words you speak and you will then make the changes necessary to
    create an AMAZING lifestyle. But if you moan in your head, repeating angry or
    frustrated comments, you will drag yourself down and your mind will give you more
    negative things to moan about. A few tweaks to your daily routine will enhance
    your week:


    *   A positive state of mind will help you make better choices and decisions.

    *   Choosing to do things differently in your day will make you feel better about
    what you are doing and your day will go better.


    Choose not to react to bad news. Instead, remember all the good, kind things that
    are happening in the world.


    A good example of this is when the British TV personality Jade Goody sadly passed
    away from cervical cancer in March 2009 at the young age of 27. Jade had won the
    hearts of the nation when she took part in the Channel 4 TV reality show, Big
    Brother, in 2002, after which she went on to star in several television programmes
    of her own.


    In 2007, she returned to the celebrity version of Big Brother, during which her
    celebrity turned to notoriety when she became involved in a racial bullying incident
    with the Indian actress Shilpa Shetty. Afterwards Jade apologized and in August
    2008 she appeared on the Indian version of Big Brother called Big Boss. It was
    during the live programme that Jade was told she had cervical cancer and when
    she subsequently returned to the UK, she discovered that the cancer was terminal.
    After her diagnosis, Jade continued to live a very public life, even allowing
    a film crew to follow her cancer journey for the documentary *Jade’s Cancer Battle*.

