    as a path connecting them. By considering the collective influence of all features,
    IFS enhances the accuracy and efficiency of IDSs, ultimately enabling them to
    identify and mitigate potential threats with greater precision and effectiveness.


    # 6.3.1.2 Generating Training and Test Data


    After the requisite features were carefully chosen, the process of extracting
    training and testing data from the dataset connected. To ensure an impartial evaluation
    of threat detection accuracy, a deliberate approach was taken in which the intersection
    of the training set (T₁) and the testing set (T₂) was intentionally null (T₁ ∩
    T₂ = ∅). This was achieved through the implementation of two distinct filter-based
    techniques: Reservoir sampling and SRF, both employed for random selection of
    training and testing data. Notably, Reservoir sampling stands out for its equitable
    probability of being included in the reservoir for each instance from the data
    stream. This mechanism proves particularly advantageous for handling extensive
    datasets, where memory constraints make loading the entire dataset impractical.
    This choice was motivated by the need for efficient training sample generation.
