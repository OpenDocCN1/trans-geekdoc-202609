    data combined with a more extensive unlabeled dataset to improve detection accuracy
    and scalability. By using ML for network intrusion detection in IoT systems, these
    algorithms continuously learn and adapt to new threats, enhancing their ability
    to discern and respond to evolving cyber threats, in a proactive and efficient
    manner.


    In essence, ML-based techniques for network intrusion detection in IoT systems
    involve supervised, unsupervised, and semi-supervised learning approaches. These
    methods enable the analysis of network traffic to differentiate normal behavior
    from potentially malicious activities, contributing to the enhancement of security
    measures in the interconnected landscape of IoT devices. As ML algorithms continuously
    evolve and learn from new data, they play a crucial role in fortifying the resilience
    of IoT networks against emerging threats.


    ML-based NIDS have been proposed for IoT systems. These IDS aim to detect and
    classify attacks in IoT networks using ML algorithms. One approach is the Self-Supervised
    Intrusion Detection (SSID) framework, which enables a fully online IDS that requires
    no human intervention or offline learning [90]. Another approach uses DL-based
    models that use network flow and biometrics to detect intrusions in IoT systems
    [91]. Additionally, an intelligent IDS (IDS) has been developed using ML-algorithms
    such as K-nearest neighbor (KNN), support vector machine (SVM), and artificial
    neural network (ANN) to identify and classify malicious behaviors in IoT network
    packets [92]. These approaches demonstrate the potential of ML-based models in
    enabling network intrusion detection in IoT systems. The machine learning-based
