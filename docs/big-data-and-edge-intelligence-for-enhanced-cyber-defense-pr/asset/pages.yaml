    #  5.1 INTRODUCTION


    #  5.1.1 BACKGROUND AND MOTIVATION


    The Internet of Things (IoT) has revolutionized the way we interact with the world,
    connecting billions of devices to the internet and enabling seamless data exchange.
    IoT applications span diverse sectors, including healthcare, smart cities, industrial
    automation, and home automation. However, this proliferation of interconnected
    devices has also led to the emergence of vulnerable environments susceptible to
    cyber threats [2].


    The security of IoT-based systems has a pressing concern, as cyberattacks on these
    interconnected networks can have severe consequences, compromising data privacy,
    causing service disruptions, and endangering human lives. Figure 5.1 depicts the
    comparison between centralized, distributed, and federated learning approaches.
    Traditional centralized intrusion detection systems face significant challenges
    in coping with the scale, heterogeneity, and dynamic nature of IoT environments.
    As a result, there is a growing need for innovative security solutions that can
    effectively detect and preserve the privacy of sensitive data [3–5].


    #  5.1.2 PROBLEM STATEMENT AND RESEARCH SCOPE


    This research aims to address the shortcomings of traditional intrusion detection
    systems in IoT-based vulnerable environments by leveraging the potential of federated
    learning. The problem statement revolves around designing a decentralized intrusion
    detection system that can collaboratively learn from distributed IoT devices data
    while ensuring privacy and efficiency [6–8].


    The research scope encompasses the following key aspects:


    +   - Investigating the security challenges faced by IoT-based vulnerable environments,
    including diverse device types, communication protocols, and data formats.


