  md: '# Effective Intrusion Detection


    a of the sample. Similarly, another partition-based sampling mechanism SRF of
    Weka simulator used for generating data in terms of 10 test cases. The test cases
    are generated in a way that no instances of test cases are found in training instances,
    test sampling mechanism. At the detection phase a C45-based classification mechanism
    J48Consolidated has been deployed, empowered with CTC algorithm to counter classification
    problem involving a high degree of class imbalance. It has been found that our
    IDS detects threats with 97.12% accuracy with a very low misclassification rate
    of 2.87%. The false alarm generated by our approach is 0.002%.


