    # 7.4 MACHINE LEARNING ENABLED NETWORK INTRUSION DETECTION IN INTERNET OF THINGS
    SYSTEMS


    ML-based model holds immense promise for bolstering NID in IoT systems. In this
    context, ML algorithms are employed to analyze vast amounts of data generated
    by IoT devices, aiming to distinguish normal network behavior and potential security
    threats [56]. ML-based IDSs use various techniques such as supervised, unsupervised,
    and semi-supervised learning to detect anomalies and malicious activities within
    IoT networks [47].


    Supervised learning in ML for network intrusion detection involves algorithms
    on labeled datasets containing examples of both normal and malicious network traffic.
    These methods learn patterns and characteristics associated with different types
    of cyber threats, enabling them to identify and classify data as benign or suspicious
    in real time [47]. Unsupervised learning methods, on the other hand, work without
    labeled data and on detecting anomalies or deviations from patterns within the
    IoT network traffic. These algorithms are proficient in flagging unusual behaviors
    that might indicate potential security breaches or intrusions [64].


    Additionally, semi-supervised learning techniques amalgam aspects of both supervised
    and unsupervised learning. They leverage a small sample of labeled'
