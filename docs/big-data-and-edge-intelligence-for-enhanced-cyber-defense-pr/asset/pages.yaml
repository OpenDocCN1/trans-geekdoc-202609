    # 6.3.1 DATA Pre-PROCESSING


    In the data preparation phase for training and testing the IDS, we utilized the
    CICIDS2017 [45, 46] dataset provided by the Canadian Institute for Cybersecurity.
    This dataset is particularly valuable as it contains both the most and prevalent
