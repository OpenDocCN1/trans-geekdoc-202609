    vastly outnumbers the other (malicious activity). The presence of this imbalance
    results in a bias towards the majority class in classification and detection models,
    resulting in an increase in the number of false alarms. The issue of imbalanced
    high-class distribution poses an challenge in the context of developing an IDS.
    Specifically, it involves the decision-making process of selecting a suitable
    classification model for effectively detecting threats. The classification model
    is a crucial component of an IDS detection engine, and its efficacy significantly
    impacts the overall performance of the system. An elegant IDS is one that deploys
    a classification model capable of astutely identifying threats in adverse conditions.
    For an IDS to be robust, its classification model should excel at detecting and
    identifying threats with the most accuracy, boasting a high true positive (TP
    Rate). Importantly, it must achieve this in the presence of highly imbalanced
    training datasets. The ability to strike a balance between accuracy and class
    balance is a hallmark of a well-designed IDS.


    This work presents a novel approach that utilizes consolidated tree construction
    (CTC) [11] for the purpose of classifying and identifying attacks, taking into
    account the significant obstacles associated with intrusion detection. The J48Consolidated
    classifier, which is commonly used with the CTC approach, serves as the fundamental
    component of our methodology [12]. The key feature of classification is its ability
    to effectively address common intrusion detection issue, class imbalance. The
    CTC mechanism maintains stability and impartiality of the IDS with class issues.
    Reservoir sampling helps us manage large datasets [13]. This method is well-known
    for handling huge datasets effectively using memory. Reservoir sampling visualizes
    the large dataset as a continuous flow of information, eliminating the need to
    load it into the computer''s memory. Our IDS is more efficient using Reservoir
    sampling and CTC. These aspects enable our method to overcome class imbalance
    and large datasets, setting it apart from others. Consequently, it emerges as
    a robust solution for the always changing realm of cybersecurity. In, our methodology
    leverages the capabilities of CTC and Reservoir sampling to an IDS that demonstrates
    exceptional performance in terms of classification accuracy and attack detection,
    while also effectively addressing challenges related to class imbalance and the
    handling of extensive datasets. This novel approach holds the potential to make
    a substantial contribution to the continuous endeavors aimed at strengthening
    cybersecurity.


