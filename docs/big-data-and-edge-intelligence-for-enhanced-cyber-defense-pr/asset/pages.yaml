    # 2.3.3.1 Random Forest


    The goal of random forests is to transform a tree of high-variance, low-bias decision
    trees into a model with low variance and low bias. It is a well-known supervised
    machine learning method. It may be used to solve classification and regression
    issues in machine learning. It is based on the concept of collaborative learning,
    which is a way of merging different classifiers to resolve a complex problem and
    improve the model''s performance. The classifier “Random Forest” “contains a number
    of decision trees based on various subsets of the set in question and chooses
    an average to enhance the accuracy of prediction connected with that dataset.”
    Rather of relying on a single tree of decisions, a random forest forecasts from
    all of them and forecasts the ultimate result based on the overall vote of projections.


    # 2.3.3.1.1 Random Forest Assumptions


    Since the random forest contains several trees to project the class of the dataset,
    certain trees are may anticipate the correct output while others may not. But
    when even one of the individual trees is joined, they correctly forecast the outcome.
    As a consequence, two prerequisites for a better constructed at random forest
    classifier are as follows:


    +   - The collection''s feature variable should have some genuine values so that
    the algorithm can foresee tree outcomes as to guesses.

    - The forecasts of each tree need to have exceptionally low correlations.


