    # Key Characteristics of Edge-IIoTset


    Realistic Scenarios: The dataset comprises network traffic collected from diverse
    IoT devices within industrial environments, closely resembling real-world setups.


    Diverse Behaviors: It encompasses a wide range of behaviors, including both normal
