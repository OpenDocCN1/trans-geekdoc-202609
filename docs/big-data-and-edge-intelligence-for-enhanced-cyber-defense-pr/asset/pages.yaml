    Encryption techniques add another degree of security by converting data into an
    unreadable format, guaranteeing that only authorized parties may access and comprehend
    the data [44]. Sensitive data can be securely transported and stored by employing
    encryption methods within the EdgeAI framework, reducing the risk of unauthorized
