    # 7.7 CONCLUSION


    The increasing use of IoT devices has led to a need for robust security solutions,
    particularly in intrusion detection. ML- and DL-based techniques are crucial for
    IoT security. This chapter surveys AI, ML, and DL-based techniques used in intrusion
    detection for IoT networks and systems, discussing IoT architecture, vulnerabilities,
    and protocol-level attacks. It also reviews research on IoT security methodologies.
    The goal is to provide researchers with comprehensive insights into security challenges
    and potential solutions. This study explores AI, ML, and DL-based NIDS, focusing
    on classification schemes and methodology. It highlights the use of AI, ML, and
    DL-based methods to enhance detection accuracy and reduce false alarm rate (FAR).
    DL approaches, such as Auto Encoder (AE) and DNN, have superior performance but
    require extensive computing resources. Addressing these challenges is crucial
    for real-time NIDS performance, as they can learn features independently and improve
    model fitting. The chapter reveals that 85% of methodologies were tested using
    outdated datasets, limiting their performance in real-time environments. To improve
    detection accuracy, AI, ML, and DL-based NIDS should use updated datasets like
    WUST-IoT-2021, CIC-IoT-2022, and CIC-IoT-2023. The chapter highlights research
    gaps in improving low-frequency attack performance and reducing complexity. Future
    research should focus on designing a lightweight, efficient DL-based NIDS for
    intrusion detection.


