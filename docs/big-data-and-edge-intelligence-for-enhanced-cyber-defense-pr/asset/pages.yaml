    and hybrid techniques [17–20]. Each method’s strengths and limitations are analyzed,
    considering factors such as accuracy, false positive rates (FPRs), resource consumption,
    and scalability. Moreover, we investigate the applicability of these techniques
    in different IoT deployment scenarios, such as smart homes, healthcare, industrial
    IoT, and transportation systems [21–23]. Figure 5.2 depicts the lightweight model
    architectures.


