    With increased internet usage comes security concerns. Because of security weaknesses
    in the systems, malicious malware can disrupt system function and data confidentiality.
    To identify and report assaults, IDSs have been created. Attacks must first be
    discovered in order to be prevented. In this regard, IDS have been designed to
    identify attack traffic, and IDS datasets have been constructed to mimic attack
    types. This research is the first to integrate the results of all prior studies
    on phishing website detection using AI algorithms. The proposed phishing research
    employs a categorical paradigm, in which phishing websites are assumed to automatically
    categorize websites into a specific range legitimate sophisticated values based
    on a multitude of characteristics and the splendor variable. Because there are
    more unregulated websites than ever before. Phishing evolves over time because
    phony websites are frequently revisited and do not remain forever. Using the Ensembles
    Algorithm XGBoost and a well-defined feature, detection of phishing using website
    URLs is expected to produce highly precise outcomes with a suitable bias-variance
    compromise in a resilient and efficient way. According to the statements of the
