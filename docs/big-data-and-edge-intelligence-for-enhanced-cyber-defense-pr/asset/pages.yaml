    threats in network services:


    Attack against network service: An attack against network services in an IoT-based
    system involves exploiting vulnerabilities within the interconnected infrastructure
    to disrupt, compromise, or render unavailable services provided by these networks
    [34]. Such attacks may manifest as DDoS assaults, where a flood of traffic overwhelms
    IoT devices or services, rendering them inaccessible to legitimate users [35].
    Additionally, attackers may leverage protocol weaknesses, zero-day exploits, and
    MitM tactics to interrupt communication between IoT devices and services, leading
    to service disruptions, unauthorized access, or data manipulation [52]. By exploiting
    these vulnerabilities, malicious actors aim to disrupt the functionality, integrity
    of network services within the IoT ecosystem, posing significant risks to the
    overall system''s operations and data security [53].


    Attack against network service: An attack against network services in an IoT-based
    system involves targeted exploitation of vulnerabilities within the interconnected
    infrastructure, aiming to disrupt or compromise the services provided by these
    networks [54]. Attackers may employ tactics such as DDoS assaults, flooding the
    network with excessive traffic to overwhelm IoT devices or render them inaccessible
    to legitimate users. Alternatively, they may exploit weaknesses in communication
    protocols, inject malicious code, or hijack devices to interrupt the flow of data
    between IoT devices and services [55]. These attacks can lead to service disruptions,
    posing risks, functionality, reliability, and security of the entire IoT ecosystem
    [55].


    Internet attack: An Internet attack in an IoT-based system involves exploiting
    vulnerabilities within the Internet-facing devices or infrastructure, aiming to
    compromise or disrupt their functionalities [56]. Attackers often target weaknesses
    in IoT devices'' firmware, web interfaces, or cloud services, exploiting these
    entries to gain unauthorized access, execute remote code, or implant malware.
    Such attacks include DDoS assaults orchestrated through compromised IoT devices,
    flooding servers with overwhelming traffic, and disrupting Internet services [56].
    Moreover, attackers can infiltrate IoT systems to steal sensitive data, manipulate
    device functionalities, or create further malicious activities, posing significant
    risks to the security, privacy, and reliability of the interconnected IoT network
    [57].'
