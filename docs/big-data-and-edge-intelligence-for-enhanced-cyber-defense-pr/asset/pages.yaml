    importance in the context of the investigation. In the realm of digital forensics,
    it is often necessary to employ specialized methodologies, such as carving, in
    order to effectively retrieve and restore information from files that have been
    fragmented or intentionally deleted [23].


    Furthermore, the implementation of encryption has presented a substantial obstacle
