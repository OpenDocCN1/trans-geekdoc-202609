    where $\eta$ is the learning rate.


    Then, the biases are updated (3.23):


    ```

    $b_{j(new)} = b_j - \eta^* \frac{\partial E}{\partial b_j} \quad (3.23)$

    ```


    This backpropagation algorithm iteratively adjusts the weights and biases of the
    neural network to minimize the objective function (MSE) and improve the accuracy
    of the predictions. By updating the weights and biases based on the gradients
    calculated using the chain rule, the model learns to better capture complex patterns
    in the input data.


    EdgeAI enables DL models to handle and evaluate data in real time, dramatically
    lowering the latency associated with data transmission to centralized processing
    centres. This helps investigators to discover and respond to cyber threats more
    quickly, enhancing incident response capabilities.


    Furthermore, the agility and flexibility of DL models make them well-suited for
    dealing with emerging cyber threats. DL models that learn from previous data recognize
    novel patterns and adapt their predictions accordingly. This feature is crucial
    for identifying previously unknown attack pathways and new threats.


