    # 6.3.2 TRAINING THE IDS MODEL


    The IDS model is fortified by the CTC algorithm, as proposed by Ibarguren et al.
    [11]. CTC contracts an innovative resampling approach [12], which leverages the
    concept of "coverage." Coverage represents the minimum percentage of instances
    from any class within the training sample that should be present in the subsample
    with a different class distribution. This approach employs a dynamic strategy
    for determining the optimal number of samples. This determination is based on
    various criteria, including the class distribution of the dataset, the type of
    subsample being used, and the desired coverage value. Unlike traditional methods
    that rely on a fixed quantity of subsamples, the chosen parameters. Notably, in
    situations where significant class imbalances exist in the training data, more
    subsamples are generated to maintain consistent coverage. The distinctive characteristic
    of this method renders it very suitable for our IDS scenario, guaranteeing resilient
    performance when confronted with significant class imbalance in the training data.


