    and 85 features, it posed a potential bottleneck for the IDS. To address this
    challenge, we decided to select a more manageable number of features while maintaining
    a reasonable size for training and testing. Prior to feature selection and sampling,
    a critical step involved removing duplicate instances from the dataset to prevent
    any bias in the sample selection process. We accomplished this by employing Weka''s
    unsupervised RemoveDuplicates filter. Once the remaining unique instances were
    then subjected to feature selection and subsequent sampling procedures.'
