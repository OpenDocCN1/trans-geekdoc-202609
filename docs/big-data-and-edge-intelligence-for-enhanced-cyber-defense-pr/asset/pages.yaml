    # ##6.1 INTRODUCTION


    In the early hours of May 12, 2017, the world was shaken by a catastrophic cyber-attack
    launched by WannaCry ransomware [1, 2], a notorious self-propagating malware.
    The epicenter of this digital onslaught was the British National Health System
    (NHS) hospital network, where the impact was not short of calamity. Reports estimated
    that a staggering toll of 50,000 NHS victims fell victim to this malicious assault,
    bringing healthcare services to the brink of chaos [1]. Yet, the pernicious influence
    of this ransomware extended beyond the borders of the United Kingdom, rapidly
    infiltrating networks in over 150 countries across the globe. WannaCry ransomware
    and its typically gain entry into systems via vulnerabilities of the networks
    or systems [2]. The malicious behavior of these threats chillingly apparent once
    they begin to compromise the integrity of a system''s file structure. It is at
    this pivotal juncture that the importance of an intrusion detection system (IDS)
    becomes abundantly clear.


    An IDS, referred to as IDS, serves as the second line of defense against cyber
    threats, and it plays a crucial role in mitigating the consequences of such attacks
    [2]. This role comes into sharp focus when the primary line of defense, typically
    a firewall, proves inadequate in detecting or countering a threat. The WannaCry
    incident and others let underscore the critical necessity of IDS within the field
    of networked systems.


    In essence, when firewalls fail in their protective duties, IDS step forward as
    vigilant sentinels [3]. They possess the capacity to detect anomalous activities,
    identify suspicious patterns, and trigger alerts upon detecting potential threats
    to the network. This capability is particularly pivotal in safeguarding the integrity,
    confidentiality, and availability of hosts within a network of interconnected
    systems.


    As the digital landscape continues to evolve and threats become increasingly sophisticated,
    it is evident that relying solely on firewalls is insufficient for'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 128 Big Data and Edge Intelligence for Enhanced Cyber Defense


    comprehensive cybersecurity [4]. The ever-evolving reliance on interconnected
    systems necessitates the continued and expanding importance of IDSs. They ensure
    that networks, and by extension, the systems they threaten resilient in the face
    of relentless and ever-evolving cyber threats. The symbiotic partnership between
    firewalls and IDS forms a robust defense mechanism that shields the intricate
    web of interconnected systems in our increasingly digital world.


    The concept of intrusion carries with it a fundamental and critical implication,
    denying unauthorized access to a system or network resources [5]. When considering
    the concept of intrusion in the context of a single host, it may be characterized
    as a series of acts that possess the capability to result in various security
    violations, hence compromising the integrity, confidentiality, availability, and
    authenticity of system resources. Intrusions, in essence, threaten the very foundation
    of cybersecurity, the intrusion detection procedure serves the objective of meticulously
    examining, regulating, evaluating, and generating comprehensive documentation
    on dubious occurrences stemming from system and network operations. It serves
    as the vigilant guardian tasked with identifying and flagging potential threats
    to the system''s well-being. It is essential to recognize that IDS differs from
    an intrusion prevention system (IPS) [6, 7], each playing a vital role in fortifying
    cybersecurity. When properly configured, an IDS identifies events associated with
    suspicious activities. alerting network administrators to potential threats and
    enabling rapid response to mitigate damage. In contrast, an IPS builds upon the
    foundational principles of IDS and takes a proactive stance in securing the network.
    It is not only monitors and identifies attacks but also intervenes by taking immediate
    remedial actions against threats or vulnerable areas within the network. This
    intervention may involve blocking malicious traffic, isolating compromised hosts,
    or applying other measures in real time. The IPS acts as a decisive gatekeeper,
    preventing threats from manifesting into tangible damage.


    The field of intrusion detection poses a myriad of challenges that both IDS and
    IPSs grapple with [8–10]. One of persistent challenges is what is aptly “the curse
    of features." In many instances, the incoming data is inherently raw and unprocessed,
    arriving with an overwhelming array of features. This influx of features significantly
    amplifies the time required for constructing a classifier, a critical component
    of IDS and IPS. The situation exacerbates when the training data comprises an
    immense number of instances. Consequently, the detection model faces a substantial
    computational burden when discerning with patterns in incoming data. However,
    it is imperative to acknowledge that not all features in a dataset are necessary
    for precise classification of attacks. Even with a reduced number of features,
    a classification model can maintain comparable accuracy without categorizing instances,
    as it would with the complete set of features. This highlights the potential for
    feature selection and dimensionality reduction techniques to streamline the model-building
    process and enhance the efficiency of IDS and IPS. Another significant challenge
    lies in the preparation of training data for IDS. Many available training datasets
    suffer from a prevalent issue: high-class imbalance. Data often exhibit a skewed
    distribution, where one class (typically benign activity'
