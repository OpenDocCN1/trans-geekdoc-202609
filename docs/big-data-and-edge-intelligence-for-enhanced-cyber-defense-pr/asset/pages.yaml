    for anomaly detection improves real-time threat detection at the network edge.
    We will look at how EdgeAI enables anomaly detection to advance DFI in real time.


    Organizations can support efficient and proactive anomaly detection by ML techniques
    such as vector machines (SVMs), random forests, and DL models at the network edge
    [40]. EdgeAI''s distributed computing capability allows for the real-time processing
    and analysis of enormous volumes of data streams, lowering response time and increasing
    the overall effectiveness of digital forensics.


    As an example, consider the one-class SVM algorithm. The goal of anomaly detection
    using one-class SVM is to distinguish between normal and anomalous instances in
    a given dataset. The goal is to find a hyperplane that closely encloses the normal
    instances while maximizing the margin between the hyperplane and the data points.
    The weight w and bias b define the hyperplane.


    Given a training dataset X = {x1, x2, ..., xn} consisting of n normal instances,
    the objective function for one-class SVM can be formulated (3.1 and 3.2) as follows:


    ```

    minimize ||w||² + v · ξ

    ```


    ```

    subject to: w · φ(x) ≥ b - ξ and ξ ≥ 0

    ```


    ½ ||w||² represents the regularization term that encourages a large margin and
    reduces the risk of overfitting. v is a parameter controlling the trade-off between
    maximizing the margin and minimizing the number of instances within the margin.
    ξ represents the slack variables that allow for instances within the margin or
    misclassied instances.


    To calculate the anomaly score or distance metric, we use the distance of each
    data point x from the separating hyperplane. The anomaly score, s(x), is calculated
    (3.3) as follows:


    ```

    s(x) = w · φ(x) - b

    ```


    A positive anomaly score indicates that the instance x is an anomaly, while a
    negative score indicates it is a normal instance.


    For statistical methods like Gaussian distribution-based anomaly detection, the
    objective is to estimate the probability density function (PDF) of the normal
    instances. A common approach is to fit a multivariate Gaussian distribution to
    the normal instances and calculate the probability density of each instance. The
    anomaly score is calculated as the negative logarithm of the PDF (3.4):


    ```

    s(x) = -log(p(x))

    ```'
