    # 4.4 BLOCKCHAIN IN DEVELOPMENT OF SMART CITIES


    A communal book of accounts that is distributed and widely accessible is the foundation
    of the cutting-edge technology known as BC. It enables the transport of action-specific
    data in a series of information blocks that link together to form a continuous
    chain. Every activity must verified by a private key, which is a string of symbols
    known only to the parties directly engaged in the transaction. Each block has
    a unique signature that is difficult to fabricate. Changes may only be made by
    the owner of the private key. The safest technique for capturing and storing data
    is BC. It enables the connection between transactions and computational logic
    [60–63]. It is used to document all financial transactions made between transaction
    parties and information regarding economic concerns. With the use of cryptographic
    techniques, BC technology prevents unauthorized changes to information that has
    already been entered into the system. Transparency of transactions means that
    each transaction and all of its components are available to anybody with access
    to a participant''s domain.


    A distinctive alphanumeric character serves as the node''s (user''s) means of
    identification. The users have the option of remaining anonymous or disclosing
    their identity during transactions involving block addresses immutability once
    a transaction has been recorded in the database, it cannot be changed, and'
