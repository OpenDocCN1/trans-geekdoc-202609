  md: '# Big Data and Edge Intelligence for Enhanced Cyber Defense


    An unfortunate outcome of the growth of the Internet and mobile technologies has
    been the challenge of countering cybercrime. This book introduces and explains
    the latest trends and techniques of edge artificial intelligence (EdgeAI) intended
    to help cyber security experts design robust cyber defense systems (CDS), including
    host-based and network-based intrusion detection system and digital forensic intelligence.
    This book discusses the confluence of EdgeAI with big data, as well as demonstrating
    detailed reviews of recent cyber threats and their countermeasure. It provides
    computational intelligence techniques and automated reasoning models capable of
    fast training and timely processing of cyber security big data, in addition to
    other basic information related to network security. In addition, it provides
    a brief overview of modern cyber security threats and well as exploring the advantages
    of EdgeAI to counter these threats, as well exploring various cyber defense mechanisms
    (CDM) based on detection type and approaches. Specific challenging areas pertaining
    to cyber defense through EdgeAI, such as improving digital forensic intelligence,
    proactive and adaptive defense of network infrastructure, and bio-inspired CDM,
    are also discussed. This book is intended as a reference for academics and students
    in the field of network and cybersecurity, particularly on the topics of intrusion
    detection systems, smart grid, EdgeAI, and bio-inspired cyber defense principles.
    The front-line EdgeAI techniques discussed will also be of use to cybersecurity
    engineers in their work enhancing cyber defense systems.


    Ranjit Panigahi is an Assistant Professor at the Department of Computer Applications,
    Sikkim Manipal University. He has actively involved in numerous conferences and
    serves as a member of the review committee for international journals published
    by Springer Nature and Inderscience. His research interests are machine learning,
    pattern recognition, and wireless sensor networks.


