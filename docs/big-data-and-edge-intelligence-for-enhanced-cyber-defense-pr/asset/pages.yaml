    Performance Evaluation: Rigorous evaluation validated the efficacy of our federated
    learning model. Comparative analysis against traditional approaches revealed its
    superior performance in identifying a diverse array of attacks, including fingerprinting,
    MITM, and DDoS. Our framework consistently demonstrated remarkable accuracy, precision,
    recall, F1-score, and AUC-ROC values across these attack categories.


    Security and Privacy: Addressing security and privacy concerns head-on, we examined
    potential risks associated with federated learning and evaluated the effectiveness
    of privacy-preserving mechanisms. Our findings underscored the viability of the
    approach to safeguarding sensitive data while enhancing intrusion detection capabilities.


    Real-World Deployment and Challenges: With an eye toward practicality, we delved
