    function, and Fuzzy ARTMAP. The outcomes demonstrated the superiority of BP and
    PBH in detection, with lower mean squared root error (MSE) values. Additionally,
    the integration of user behavior modeling [30] combines neural networks and expert
    systems for intrusion detection, where neural networks serve as initial filters
    for suspicious audit records, followed by a detailed analysis by an expert system
    module. While these systems exhibit performance in a practical IDS environment
    using up-to-date datasets. P2P Bot detection incorporates an adaptive multilayer
    forward neural network in conjunction with decision trees [31], with a classification
    and regression tree used for feature selection before executing the detection
    process. The resulting model, utilizing a robust back-propagation learning algorithm,
