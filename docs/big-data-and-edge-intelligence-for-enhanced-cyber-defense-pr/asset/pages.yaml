    # 6.3.1.1 Infinite Feature Selection (IFS)


    In the field of intrusion detection, the infinite feature selection (IFS) [47]
    algorithm offers a powerful approach to feature selection. Unlike other feature
    selection methods, IFS operates in two distinct steps. Initially, it independently
    ranks every feature within the dataset, an unsupervised evaluation of their relevance.
    Then, it employs a robust cross-validation strategy to select the top-performing
    m features. What sets IFS apart from its counterparts is its inclusive nature—every
    feature contributes to the assessment of each feature’s weight. This methodology
    is implemented by constructing an affinity graph'
