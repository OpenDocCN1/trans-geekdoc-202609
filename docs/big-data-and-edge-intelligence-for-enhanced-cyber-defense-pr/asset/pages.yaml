    # 7.5 DEEP LEARNING ENABLED NETWORK INTRUSION DETECTION IN INTERNET OF THINGS
    SYSTEMS


    DL-based model, a subset of ML, has emerged as a powerful technique for enhancing
    NID in IoT systems, particularly neural networks with multiple layers, are able
    at automatically extracting intricate patterns and features from complex datasets
    [110, 111]. In the context of IoT security, techniques such as convolutional neural
    networks (CNNs), recurrent neural networks (RNNs), and deep autoencoders are used
    for robust intrusion detection [111].


    CNNs excel in analyzing data, like network traffic, by extracting hierarchical
    representations of features [112, 113]. They can detect patterns within network
    packets and learn to identify irregularities that may signify potential cyber
    threats [113, 114]. RNNs, with their sequential learning ability, are effective
    in capturing temporal dependencies and detecting anomalies in IoT network traffic
    that occur over time, providing insights into possible intrusion intrusion attempts
    [115]. Deep autoencoders, a form of unsupervised learning, are used for anomaly
    detection by reconstructing normal network behavior and flagging deviations from
    this learned representation as potential security breaches [116, 117].'
  merge: -1
  img_proc: true
