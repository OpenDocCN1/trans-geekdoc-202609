    Accuracy: It is proposed as the proportion of categories accurately forecasted
    a model driven by the total number of projections.


    True Positive + True Negative / True Positive + False Positive + False N


    TNR: Ratio of accurate negative and total negative value


    TNR = True Negative / False Negative


    TPR: It is defined as the percentage of accurate forecasts in positive class predictions.


    True Positive Rate = True Positive (True+False Negative), BUT False Negative =
    0, True Positive Rate = True/True = 1.


    False Negative Rate = False/(False Positive +True Negative), but True Negative
    will be 0,


    Therefore, False Positive Rate = False/False Positive + 1.

    PRECISION: The accuracy of an optimistic forecast model by a model. Precision
    is determined by multiplying the total number of correct forecasts by the percentage
    of actual correct predictions.


    F- SCORE: The F-1 score is an artificial learning assessment statistic that gauges
    a model''s prediction. It combines a model''s recall and accuracy ratings. The
    accuracy statistic reveals how many times a model properly throughout the whole
    dataset.


    False Negative Rate: The proportion of false negatives to overall positives.

    False Negative/(False Negative + True Positive) = False Negative Rate.


    FPR: One accuracy statistic that may be assessed on a portion of ML models is
    the positive rate.

    FPR=FALSE NEGATIVE/POSITIVE.


    The precision, accuracy, F-1 Score, TPR, and FPR equations are as follows:


    ```

    TPR= True Positive/True Positive + False Negative

    PRECISION= True Positive/True Positive + False Positive

    FISCORE=2*PRECISION*RECALL/PRECISION+RECAL

    ACCURACY= True Positive +True Negative/True Positive + False Negative

    + True Negative+False Positive

    FPR=False Positive/True Negative + False Positive

    ```'
