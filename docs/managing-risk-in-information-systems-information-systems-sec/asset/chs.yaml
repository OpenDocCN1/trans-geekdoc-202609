  \n## 理解并维护合规性\n\n## 第 3 章\n\n关于信息技术（IT）有许多法律。组织必须实施相关流程以确保他们符合这些法规。合规性对于业务运营至关重要；不合规可能会导致巨额罚款、法律行动甚至监禁。\n\
  \n### 主题\n\n本章涵盖了以下主题和概念：\n* 风险缓解与比例\n* 安全原则（最小权限、职责分离）\n* 输入验证与补丁管理\n* 版本控制与配置管理——服务器加固\n\
  * 侵入检测系统（故意的/无意的、自然的/人为的、基于主机的/基于网络的）\n* 技术/物理访问控制\n* 缓冲区溢出与代码注入\n* 服务器加固步骤\n* 政府机构（NIST,\
  \ DHS, NCCIC, US-CERT, MITRE）\n* 标准与框架（SP 800-30, SP 800-34, SP 800-37, SP 800-84）\n\
  * 漏洞命名（CVE）\n\n### 目标\n\n当你完成本章后，你将能够：\n* 定义 `compliance`\n* 描述 `FISMA` 的目的\n* 识别\
  \ `HIPAA` 的范围\n* 描述 `GLBA` 的目的\n* 识别 `SOX` 的范围\n* 描述 `CIPA` 的目的\n* 列出与合规性相关的联邦实体\n\
  * 描述 `PCI DSS` 的目的\n* 描述 `SP 800-30` 的内容\n* 描述 `COBIT` 的目的\n* 描述 `ISO` 的标准\n* 识别\
  \ `ITIL` 的目的\n* 识别 `CMMI` 的目的\n* 描述 `GDPR` 的目的\n\n### 美国合规法\n\n美国有很多与信息技术（IT）相关的法律。组织被遵守遵守这些法律，这通常被称为\
  \ `compliance`。许多组织内部设有程序，以确保他们符合相关法规。这些程序通常使用内部审计，组织也可以使用认证和认可计划。当法律强制要求合规性时，通常会进行外部审计。这些外部审计提供了第三方验证，证明要求得到了满足。一句古老的法律格言是“无知不是借口”。换句话说，一个人不能在违反法律后说“我不知道”。适用于组织的法律也是如此。\n\
  \n\n\n\n\n首先，2014 年的法律授权国土安全部（DHS）部长协助管理和预算局（OMB）局长管理联邦信息系统的机构信息和安全实践的实施。其次，该法律通过将报告信息的范围改变了机构的报告要求，将报告范围从主要的政策和财务信息变为有关威胁、安全事件以及对安全要求遵循性的特定信息。第三，该更新涵盖了网络泄露通知要求。第四，在更新法律通过的一年内，OMB\
  \ 局长需要修订预算公告 `A-130` 以消除低效的报告。\n\n各机构负责：\n\n*   **保护系统和数据**——各机构负责人负责其机构内所有的系统和数据。\n\
  *   **符合 `FISMA` 的所有要素**——`FISMA` 包含了有关如何保护系统和数据的细节。必须对系统进行盘点，并进行风险评估，以对系统和数据进行分类。可以根据风险水平使用不同的安全控制措施。系统必须经过认证和认可过程。\n\
  *   **在所有过程中整合安全**——安全必须贯穿整个机构，并且必须进行持续监控以确保系统保持安全。\n\n`FISMA` 要求年度检查。每年，各机构必须对其计划进行独立评估。其目标是确定计划的有效性。这些评估包括：\n\
  \n*   **有效性测试**——对具有代表性的政策、程序和实践进行测试。所选的样本应根据组织的预期具有真实性。\n*   **发布评估或报告**——报告识别并列出机构对\
  \ `FISMA` 的遵循情况，以及对其他标准和指南的遵循情况。\n\n### 健康保险流动性与责任法\n\n健康保险流动性与责任法 (HIPAA) 于 1996\
  \ 年通过。它确保了健康信息数据的保护。`HIPAA` 的通过提高了了个人医疗信息的安全性，而这些信息以前是松散且经常被误用的。`HIPAA` 在合规方面涵盖了三个主要领域：行政（保护患者数据并确保只有授权方才能访问的方法）、物理（防止物理盗窃和对受保护数据系统进行未经授权访问的方法）以及技术（利用技术保护计算机网络和设备免受威胁）。\n\
  \n### ![](img/Note.png)NOTE\n\n这些法律与组织中的 IT 公司治理之间存在联系。IT 公司治理由一套规则、实践和流程组成，这些对于最大限度地减少组织的\
  \ IT 风险至关重要。根据组织的类型和位置，合规要求有所不同，例如 `FISMA`、`HIPAA`、`GLBA` 或 `GDPR` 中列出的要求。组织必须在制定全面的\
  \ IT 风险管理计划时考虑公司治理。\n\n2019 年医疗保健信息和管理系统协会（HIMSS）网络安全调查识别了 IT 安全的许多趋势。其中部分数据有助于显示\
  \ `HIPAA` 的影响。以下数据是从调查者处收集的：\n\n*   约 65% 的受访者来自医疗服务行业。\n*   超过 85% 的受访者必须遵守 `HIPAA`。\n\
  *   `HIPAA` 的适用高于任何其他法律。\n\n如果组织处理健康信息，则适用 `HIPAA`，这使得健康信息的定义变得重要。`HIPAA` 将`健康信息`定义为任何：\n\
  \n*   由以下实体创建或接收：\n    * 医疗提供者\n    * 医疗计划\n    * 公共卫生部门\n    * 雇主\n    * 人寿保险公司\n\
  \    * 学校或大学\n    * 医疗保健结算中心\n* 且与个人的健康有关，包括：\n    * 过去、现在或未来的健康状况\n    * 个人的身体健康、心理健康或状况\n\
  \    * 过去、现在或未来的医疗费用\n\n`HIPAA` 的第二部分包含一个名为“行政简化”的章节。该章节包含了 `HIPAA` 对 IT 的要求和标准：\n\
  \n*   **安全标准**——每个处理健康信息的组织都必须保护这些信息。公司还必须保护处理信息的系统，包括组织创建、接收或发送的所有健康数据。特定标准应用于：\n\
  \    * 存储数据\n    * 使用数据\n    * 传输数据\n*   **隐私标准**——在没有患者明确同意的情况下，不得与任何人共享数据。去过医生诊所或医院的人可能已经签过同意书。该表格还告知患者用于保持其健康信息私密所采取的措施。\n\
  \n### ![](img/Note.png)NOTE\n\n这些法律与组织中的 IT 公司治理之间存在联系。IT 公司治理由一套规则、实践和流程组成，这些对于最大限度地减少组织的\
  \ IT 风险至关重要。根据组织的类型和位置，合规要求有所不同，例如 `FISMA`、`HIPAA`、`GLBA` 或 `GDPR` 中列出的要求。组织必须在制定全面的\
  \ IT 风险管理计划时考虑公司治理。\n\n2019 年医疗保健信息和管理系统协会（HIMSS）网络安全调查识别了 IT 安全的许多趋势。其中部分数据有助于显示\
  \ `HIPAA` 的影响。以下数据是从调查者处收集的：\n\n*   约 65% 的受访者来自医疗服务行业。\n*   超过 85% 的受访者必须遵守 `HIPAA`。\n\
  *   `HIPAA` 的适用高于任何其他法律。\n\n如果组织处理健康信息，则适用 `HIPAA`，这使得健康信息的定义变得重要。`HIPAA` 将`健康信息`定义为任何：\n\
  \n*   由以下实体创建或接收：\n    * 医疗提供者\n    * 医疗计划\n    * 公共卫生部门\n    * 雇主\n    * 人寿保险公司\n\
  \    * 学校或大学\n    * 医疗保健结算中心\n* 且与个人的健康有关，包括：\n    * 过去、现在或未来的健康状况\n    * 个人的身体健康、心理健康或状况\n\
  \    * 过去、现在或未来的医疗费用\n\n`HIPAA` 的第二部分包含一个名为“行政简化”的章节。该章节包含了 `HIPAA` 对 IT 的要求和标准：\n\
  \n*   **安全标准**——每个处理健康信息的组织都必须保护这些信息。公司还必须保护处理信息的系统，包括组织创建、接收或发送的所有健康数据。特定标准应用于：\n\
  \    * 存储数据\n    * 使用数据\n    * 传输数据\n*   **隐私标准**——在没有患者明确同意的情况下，不得与任何人共享数据。去过医生诊所或医院的人可能已经签过同意书。该表格还告知患者用于保持其健康信息私密所采取的措施。\n\
  \n### HIPAA 合规计划流程\n\n`HIPAA` 第一部分涉及保险流动性并识别了保险规则。例如，当员工换工作时，`HIPAA` 帮助他们保留保险。第一部分的规则与\
  \ IT 无关。只有第二部分涵盖数据保护，特别是五条规则中的隐私规则，它涵盖受保护健康信息 (`PHI`)。\n\n如果组织包含受 `AA` 保护的数据，则必须有一个合规计划。图\
  \ 3-1 显示了 HIPAA 合规计划的流程：\n\n*   **评估**——评估有助于识别组织是否受 `HIPAA` 约束。如果是，哪些数据需要保护。\n\
  *   **风险分析**——风险分析有助于识别风险。在这一阶段，分析组织如何处理数据。例如，数据是电子存储还是电子传输？\n*   **计划制定**——在识别风险后，制定计划。该计划包含了减少风险的方法。\n\
  *   **计划实施**——实施计划。\n*   **持续监控**——深度安全需要持续监控。应该监控法规和风险的变化，并对计划进行监控以确保其仍在在使用。\n\
  *   **评估**——必须进行定期审查。这些审查确保组织保持合规。\n\n![图 3-1 HIPAA 合规。](img/9781284183719_CH03_FIGF01.png)\n\
  \n**图 3-1** HIPAA 合规。\n\n### ![](img/Note.png)NOTE\n\n*个人身份信息 (PII)* 是信息安全领域常用的术语。PII\
  \ 是所有可用于识别个人身份身份数据。此类数据可以是姓名、社会安全号、生物识别数据或识别个人的数据。多项法律和规定规定必须保护 PII。信息安全中的 PII 与\
  \ HIPAA 中的 PHI 同义。\n\n#### 格姆-莱奇-布莱法案\n\n\n\n\n\n格拉姆-莱奇-布莱法案 (GLBA)又被称为《金融服务现代化法案》，于\
  \ 1999 年通过。GLBA 的范围非常广泛，其大部分内容与银行和保险机构如何合并有关。然而，GLBA 有两个部分与 IT 安全有关并适用于美国的金融机构。它们是：\n\
  \n* `财务隐私规则`——该规则要求公司向客户告知其隐私实践。任何拥有银行账户的人可能都收到过银行的此类通知。任何持有信用卡的人都收到过来自信用卡公司的通知。它解释了银行或公司如何收集和共享数据。\n\
  * `保护措施规则`——公司必须拥有一份安全计划来保护客户信息，该计划应确保数据不会在未经授权的情况下发布，并确保数据的完整性。公司负责确保风险管理计划得到执行。所有员工必须接受有关安全问题的培训。联邦贸易委员会（FTC）于\
  \ 2019 年 4 月提出了对`保护措施规则`的更新，目前正处于审查阶段。\n\n## 萨班斯-奥克斯利法案\n\n萨班斯-奥克斯利法案 (SOX)于 2002\
  \ 年通过。此法律适用于所有上市公司。它旨在让公司高管和董事成员对财务数据承担个人责任。如果数据不准确，这些人员可能会被罚款并入狱。\n\n其目标是减少欺诈。因为个人需要承担责任，因此有更大的压力确保报告数据的准确性。首席执行官（CEO）和首席财务官（CFO）必须能够：\n\
  \n* 验证财务报表的准确性\n* 证明报表是准确的\n\nSOX 的大部分内容不在 IT 的直接范围之内。然而，第 404 节包含直接相关的元素。第 404\
  \ 节涉及数据的准确性，并要求公司使用内部控制来保护数据。第 404 节还需要内部和外部审计师提供报告以验证合规性。对于许多公司来说，审计成本构成了该法律最大的影响。\n\
  \n### 注意\n!![](img/Note.png)\n\nSOX 的通过是为了应对几次重大丑闻事件。在这些丑闻事件中，高管故意误导公众，导致投资者损失了数十亿美元。例如，据报道，安隆（Enron）在\
  \ 2000 年的价值超过 1000 亿美元，但在 2001 年破产了。后来，确定其失败是由欺诈和腐败造成的。许多高级官员和董事成员直接参与其中。\n\n##\
  \ 家庭教育权利与隐私法案\n\n家庭教育权利与隐私法案 (FERPA)于 1974 年通过，从那以后至少修订了九次。该法案的目标是保护学生记录隐私，包括教育和健康数据。\n\
  \nFERPA 适用于所有接受美国教育部部资助的学校。这些学校包括：\n\n* 或地方教育机构\n* 高等教育机构\n* 社区学院\n* 提供学前课程的学校或机构\n\
  * 所有其他教育机构\n\nFERPA 赋予了 18 岁以下学生家长的权利。家长可以检查记录并请求修正。当学生达到 18 岁时，这些权利将移交给学生。\n\n\
  必须保护关于学生的`PII`（个人身份信息）。学校通常需要获得家长或学生的许可才能发布`PII`。\n\n`PII`的访问或发布有几种例外情况：\n\n* 某些学校官员可以查看记录。\n\
  * 如果学生转学，数据可以传输到新学校。\n* 使用某些类型的助学金时，数据可以传输。\n* 认证机构可以访问数据。\n* 法院要求时可以访问数据。\n* 在健康和安全紧急情况下可以访问数据。\n\
  \n## 儿童互联网保护法案\n\n儿童互联网保护法案 (CIPA)于 2000 年通过，旨在限制从学校和图书馆计算机访问攻击性内容。所有获得 E-Rate 计划资助的学校和图书馆都受\
  \ CIPA 保护。关于 E-Rate 计划的更多信息请访问[`www.fcc.gov/consumers/guides/universal-service-program-schools-and-libraries-e-rate`](https://www.fcc.gov/consumers/guides/universal-service-program-schools-and-libraries-e-rate)。\n\
  \nCIPA 要求学校和图书馆：\n\n* 阻止或过滤对以下图片的互联网访问：\n    * 淫秽的\n    * 儿童色\n    * 对未成年人有害的（如果未成年人使用计算机）\n\
  * 采纳并执行监控未成年人在线活动的政策\n* 实施一项互联网安全政策，内容涵盖：\n    * 未成年人访问不当内容\n    * 未成年人在使用电子邮件和聊天室时的安全与保障\n\
  \    * 未经授权的访问\n    * 未成年人在在线上的非法活动\n    * 未经授权使用未成年人的个人信息\n    * 限制未成年人访问材料的措施\n\
  \n关于何时限制未成年人访问材料的措施，由于某些术语难以定义，例如什么是淫秽或对未成年人有害。CIPA 包含一个定义部分，界定了这些术语。\n\n### 注意\n\
  !![](img/Note.png)\n\nE-Rate 计划由联邦通信委员会管理。它为学校和图书馆提供 20%到 90%不等的折扣。\n\n## 儿童在线保护法案\n\
  \n<a id=\"\">儿童在线保护法案 (COPPA)</a>由`FTC`管理，于 1998 年通过并在 2000 年生效。该法案旨在保护 13 岁以下儿童的隐私。\n\
  \n## 使用代理服务器限制内容\n\n大多数组织使用代理服务器作为互联网的网关。组织配置计算机使用代理服务器。代理服务器接收请求，从互联网检索页面，然后将页面提供给客户端。\n\
  \n代理服务器提高了客户端的服务水平。它们也可以用于过滤内容。如果组织不想员工访问某些内容，代理服务器可以拦截对特定网站的请求。\n\n第三方公司根据内容维护列表，然后向需要这些的组织出售订阅。例如，公司可能希望限制从工作电脑访问赌博网站。可以购买并将列表安装到代理服务器上。代理服务器还可以记录用户访问未批准网站的尝试。当网站被拦截时，用户通常会看到类似“警告。根据接受使用政策，对该网站的访问受到限制。您的活动正在被监控。”的消息。\n\
  \n同样，学校和图书馆可以使用代理服务器过滤内容。该技术应用广泛。法律规定：\n\n* 网站在收集或使用年轻网站用户的所有个人信息之前必须要求家长同意。\n*\
  \ 隐私政策的内容，包括要求将政策本身发布在收集数据的地方。\n* 何时以及如何寻求来自监护人的可验证同意。\n* 网站运营者对儿童在线隐私和安全的责任，包括针对\
  \ 13 岁以下儿童的营销类型和方法的限制。\n\n尽管`COPPA`没有定义获得家长同意的过程，但`FTC`分享了指南来帮助网站运营者。其中一些要求包括：\n\
  \n* 必须清晰显示易于下载并通过邮寄或传真发送给运营者的同意表。\n\n\n\n\n\n*   父母必须使用信用卡来验证年龄和身份。\n*   父母必须拨打免费电话。\n\
  *   接受来自父母包含数字签名的电子邮件。\n\nCIPA 曾因言论自由问题而面临挑战。美国最高法院于 2003 年 6 月维持了该法律。所有图书馆被要求在\
  \ 2004 年初完成合规。此时，所有接受 `E-Rate` 资金的学校和图书馆预计已符合 CIPA 标准。\n\n## 与合规相关的法规\n\n除了法律之外，几项法规创建了不同的美国实体。这些实体大部分在联邦层面运营。\n\
  \n其中一些实体对大多数公司的 IT 计划有直接影响。另一些则仅与从事特定活动的公司。本节涵盖的组织包括：\n\n*   证券交易委员会 (SEC)\n*  \
  \ 联邦存款保险公司 (FDIC)\n*   国土安全部 (DHS)\n*   联邦贸易委员会 (FTC)\n*   州检察长 (AG)\n*   美国司法部长\
  \ (U.S. AG)\n\n### 证券交易委员会\n\n证券交易委员会 (SEC) 是一个联邦机构。它负责监管证券行业，包括证券的所有销售或交易。证券包括股票、债券和期权。\n\
  \n如果一家公司涉及证券的销售或交易，那么 IT 安全人员应该了解这些法律：\n\n*   1933 年证券法\n*   1934 年证券交易法\n*   1939\
  \ 年信托债券契约法\n*   1940 年投资公司法\n*   1940 年投资顾问法\n*   2002 年《萨班斯-奥克斯利法案》\n*   2010 年《多德弗兰克法案》\n\
  \n如果一家公司是 `publicly traded`（上市公司），其中许多法律也同样适用，上市公司是指任何允许外部投资者买卖其股票的公司。\n\n### 联邦存款保险公司\n\
  \n联邦存款保险公司 (FDIC) 是 1933 年创建的一个联邦机构。其主要目标是提高对美国银行的信心。FDIC 的建立是 20 世纪 20 年代和 30 年代初银行倒闭的直接结果，这些倒闭导致了大大萧条。\n\
  \n所有受 FDIC 保险的银行资金都是保障的，这意味着即使银行破产，存款户也不会损失资金。其目的是防止发生银行挤兑（即许多存款户急于取款的情况）。\n\n目前，个人存款户的资金保险限额为\
  \ 250,000 美元。国家信用社管理局 (NCUA) 涵盖信用社，并同样保险高达 250,000 美元的存款。\n\n### 国土安全部\n\n国土安全部\
  \ (DHS) 是一个联邦机构。负责保护美国免受恐怖攻击，并负责应对自然灾害。\n\nDHS 于 2002 年成立，是对 2001 年 9 月 11 日恐怖攻击的直接反应。它包括几个与\
  \ IT 相关部门，包括：\n\n*   网络安全办公室\n*   国家网络安全通信中心 (NCSC)\n*   美国联邦应急管理局 (FEMA)\n\n###\
  \ 联邦贸易委员会\n\n联邦贸易委员会 (FTC) 是一个联邦机构。它创建于 1914 年。其主要目标是促进竞争并防止不公平或欺骗性的商业行为。FTC 设有几个关注不同领域的局别。\n\
  \n### 州检察长\n\n每个州都有一名检察长 (AG)。检察长是该州的主要法律顾问，对于许多州来说，检察长还是首席执法官。虽然所有州都有检察长，但具体的职责可能因州而异。\n\
  \n以下是可以分配给州检察长的某些职责：\n\n*   在所有法律事务中代表州\n*   维护法律\n*   为所有州实体提供法律建议\n*   作为首席执法官进行刑事调查并起诉犯罪\n\
  *   审查州所有的契据、租赁合同和合同\n*   通过打击身份盗窃和诈骗来保护消费者\n*   提议立法\n\n某些检察长是选举产生的，另一些则由州长或其他州官员任命。州检察长是被授予代表州权限的人，这类似于通用授权书的使用方式。州检察长可以被视为被授予该州通用授权书的人。\n\
  \n### 美国司法部长\n\n美国司法部长 (U.S. AG) 是美国司法部 (DOJ) 的负责人。美国总统提名美国司法部长。\n\n司法部的具体职责包括：\n\
  \n*   执行法律\n*   根据法律维护美国利益\n*   确保针对威胁的公共安全\n*   在预防和控制犯罪方面提供联邦领导\n*   对违法行为者寻求正当的惩罚\n\
  *   为所有美国人确保公正无偏的司法\n\n### 授权书\n\n授权书可以授予任何个人以赋予某些权利。例如，一个人可以给朋友一份授权书，以便在本人不在时售卖自己的汽车。\n\
  \n也可以授予通用授权书。通用授权书允许一个人在法律事务上代表另一个人，有时在某人丧失精神能力时使用。\n\n\n\n\n\n知识产权（IP）是个人或公司创造的、由创造力产出的任何无形财产。创作所有者被授予特定的权利。知识产权包括音乐、程序、书籍、电影、商标、商业秘密等。创作者和所有者应该能够从创作中获利。然而，当知识产权权利被忽视时，他人就会以创作者为代价获益。\n\
  \n## 合规性组织政策\n\n组织通常实施政策以确保其符合法律法规。这些政策可能包含多个元素。然而，在本章的背景下，最重要的元素是信托责任。\n\n`fiduciary`\
  \ 指的是一种信任关系。受托人可以是受信任持有他人资产的人。受信任的人有责任为了他人的最大利益采取行动。他或她应该避免利益冲突。\n\n一旦有人信任受托人，就存在信托关系。请注意，这种关系需要两个独立的实体。信托责任可以采取许多形式。信托责任的示例包括：\n\
  \n- **律师与客户**——客户信任律师为了客户的最大利益采取行动。\n- **首席执行官（CEO）与董事会**——董事会信任 CEO 为了公司的最大利益采取行动。\n\
  - **股东与董事会**——股东信任董事会为了股东的最大利益采取行动。\n\n在信托关系中授予了大量的信任。正因如此，期望受托人采取额外步骤来维护这种信任。可以采取的两个步骤是尽职调查和尽职责：\n\
  \n- **尽职调查**——受托人花费合理的时间和精力来识别风险。他们对风险进行调查以便理解。未能行使尽职调查可能被视为过失。\n- **尽职责**——如果已知风险，受托人需要采取合理措施来防范风险。未能采取尽职责来保护资产也可以被视为过失。\n\
  \n行使尽职责和尽职调查并不意味着应该消除所有风险。剩余风险是在应用控制措施后剩余的风险量，也被称为接受风险。\n\n受托人应当理解并权衡风险。通过行使尽职责和尽职调查，受托人不太可能被指控为鲁莽行为或疏忽。\n\
  \n组织政策的其他元素可能包括：\n\n- **强制休假**——员工可能被要求休至少五个连续工作日的年假。强制休假的目的是为了减少欺诈或挪用资金。如果员工需要离开办公室，必须由其他人履行职责，这增加了发现非法活动的概率。\n\
  - **岗位轮岗**——员工可以在不同的工作之间轮换。当员工被调到新工作时，通常会对过去的交易进行审查和检查。这种监督可以发现可疑活动。岗位轮岗有助于预防或减少欺诈活动。它也是为了进行交叉培训以扩展员工的技能。\n\
  - **职责分工**——职责分工确保没有单个人控制整个流程。它有助于防止欺诈、盗窃、错误和利益冲突。\n- **可接受使用**——可接受使用政策 (AUP)定义了\
  \ IT 系统和数据的可接受使用。公司通常在雇用员工时告知他们可接受的使用。某些公司使用横幅和登录屏幕来提醒人员该政策。\n\n### 合规性标准和指南\n\n\
  存在若干用于评估和改进安全的标准和指南。这些标准中的大多数是可选的。然而，某些标准对于特定行业是强制性的。例如，使用特定信用卡的商户需要遵守 PCI DSS。\n\
  \n本节涵盖的标准和指南包括：\n\n- 支付卡行业数据安全标准 (PCI DSS)\n- 美国国立标准与技术研究院 (NIST)\n- 通用接受的信息安全原则\
  \ (GAISP)\n- 信息和相关技术控制目标 (COBIT)\n- 国际标准化组织 (ISO)\n- 国际电工委员会 (IEC)\n- 信息技术基础库 (ITIL)\n\
  - 能力成熟模型集成 (CMMI)\n- 通用数据保护条例 (GDPR)\n- 国防部信息保证认证与认可流程 (DIACAP)\n\n#### 支付卡行业数据安全标准\n\
  \n支付卡行业数据安全标准 (PCI DSS)是一项国际安全标准。其目的是增强信用卡数据的安全性。它由 PCI 安全标准委员会创建，并采了几家主要信用卡公司的意见。这些公司包括：\n\
  \n- 美国运通 (American Express)\n- 发现金融服务 (Discover Financial Services)\n- 日本国际信用卡 (JCB\
  \ International)\n- 万事达全球 (MasterCard Worldwide)\n- Visa 国际 (Visa Inc. International)\n\
  \n其目标是阻止信用卡数据的盗窃。如果窃偷获取了某些数据，就会发生欺诈。关键数据字段有：\n\n- 姓名\n- 信用卡号\n- 有期日期\n- 安全代码\n\n\
  如果窃偷拥有所有这些信息，盗窃就会变得容易。\n\n这些数据通常从商户的销售点机和商户计算机传输到授权机构。如果没有加密，它随时可能被拦截并轻松读取。\n\n\
  例如，在 2005 年 7 月到 2006 年 12 月期间，某大型连锁店的多张信用卡数据被拦截。仅 Visa 卡的损失就接近 8300 万美元。数百万客户起诉了发卡银行。其他例子包括\
  \ 2017 年的 Equifax 数据泄露，这影响了 40% 的美国人并泄露了 147 万人的个人信息。2019 年涉及 Capital One 的数据泄露涉及\
  \ 106 万人的记录。所有这些问题都可以通过基础安全措施预防。\n\nPCI DSS 围绕六个原则构建。每个原则都有一个或两个要求。这些原则和要求为：\n\n\
  - **构建和维护安全网络**\n    - 要求 1：安装并维护防火墙。\n    - 要求 2：不要使用默认设置，如默认密码。\n- **保护持卡人数据**\n\
  \    - 要求 3：保护存储的数据。要求 4：加密传输。\n- **维护漏洞管理计划**\n    - 要求 5：使用并更新反病毒软件。要求 6：开发和维护安全的系统。\n\
  - **实施强访问控制措施**\n    - 要求 7：限制对数据的访问。\n    - 要求 8：为每个用户使用唯一登录。不要共享用户名和密码。\n    -\
  \ 要求 9：限制物理访问。\n- **定期监控和测试网络**\n    - 要求 10：跟踪并监控对系统和数据的访问。要求 11：定期测试安全性。\n- **维护信息安全策略**\n\
  \    - 要求 12：维护安全策略。\n\n使用信用卡的商户必须遵守 PCI DSS。合规性由收单行（即验证交易的公司）进行监控。\n\n遵守 PCI DSS\
  \ 是一个三步的持续过程。该过程如 **图 3-3** 所示：\n\n\n\n\n\n*   **评估**（Assessing）——商户对用于信用卡数据的 IT\
  \ 资产和流程进行盘点。它识别现有的持卡人数据，然后分析数据和流程是否存在漏洞。\n*   **修复**（Remediating）——商户修复漏洞。它仅在必要时存储数据。\n\
  *   **报告**（Reporting）——商户向收单银行提交合规报告。\n\n![图 3-3 PCI 合规流程。](img/9781284183719_CH03_FIGF03.png)\n\
  \n**图 3-3** PCI 合规流程。\n\n该过程会在不同的时间重复进行。\n\n尽管 PCI DSS 合规有助于防止损失，但它并非万无一失。例如，在 2013\
  \ 年底一次针对目标公司（Target Corporation）的大型攻击中，攻击者盗取了 4000 万客户的信用卡数据。在同次攻击中，攻击者还盗取了多达 7000\
  \ 万客户的个人信息。2019 年，资本一（Capital One）被盗走了超过 1.06 亿客户的个人数据。目标公司在攻击期间曾认证为 PCI DSS 合规。同样的攻击还导致了尼曼马可（Neiman\
  \ Marcus）的 110 万张信用卡泄露。尼曼马可的首席信息官迈克尔·金斯顿（Michael Kingston）表示，公司的安全措施超过了 PCI 标准。PCI\
  \ DSS 调查可能会揭示认证这些公司的 PCI DSS 评估遗忽略的问题。过去，PCI 合规性曾被追溯撤销，这使得认证机构能够称“没有任何 PCI 合规组织发生过泄露”。然而，许多安全专家建议是时候更新\
  \ PCI DSS 了。\n\n### 国家标准与技术研究院\n\n美国国家标准技术研究院（`NIST`）是美国商务部的一个部门。`NIST` 的使命是促进美国的创新和竞争力。`NIST`\
  \ 设有信息技术实验室（`ITL`）。`ITL` 开发与 IT 相关的标准和指南。它们以特别出版物的形式发布，标题带有前缀 `SP`。在研究风险管理时，`SP\
  \ 800-30 风险评估指南》具有重要价值。\n\n*   **引言**——本简章节识别了目标并提供了一些参考文献。\n*   **基础**——本章讨论了风险的重要性。它包含了许多关键术语的定义。它还展示了用于评估风险的模型。\n\
  *   **过程**——本章描述了风险评估的过程。它包含了关于如何准备和实施评估的信息。它提供了如何执行六项风险任务的详细信息。这些任务是：\n    *  \
  \ 识别相关的威胁源\n    *   识别与威胁源相关的潜在威胁事件\n    *   识别威胁可以利用的漏洞\n    *   确定威胁发生并可能成功的概率\n\
  \    *   通过结合概率和影响来确定负面影响\n\n### 通用接受信息安全原则\n\n通用接受信息安全原则（`GAISP`）是一个较旧的标准，它由 1992\
  \ 年创建的通用接受系统原则（`GASSP`）演变而来。`GAISP` 是 `GASSP` 的更新。`GAISP` 第 3 版本于 2003 年 8 月发布并被信息系统安全协会（`ISSA`）采用。然而，`ISSA`\
  \ 网站上不再提到 `GAISP`。此外，`gaisp.org` 网站也不再维护。`GAISP` 包含两个主要部分：\n\n*   **泛性原则**——这些原则提供了通用指导。目标是建立和维护信息安全（`IS`）。\n\
  *   **广义原则**——这些原则源自泛性原则。它们代表了信息安全的广泛目标。\n\n### 信息及相关技术控制目标\n\n信息及相关技术控制目标（`COBIT`）是一套适用于\
  \ IT 管理和治理的实践。信息技术治理（`ITG`）是指确保组织实现其目标的过程。此外，`ITG` 过程有助于确保这些资源的有效性和效率。`COBIT` 帮助将业务目标与\
  \ IT 目标联系起来。\n\nIT 治理协会（`ITGI`）与 `ISACA` 合作开发了 `COBIT`。`ISACA` 曾名为信息系统审计控制协会。`ISACA`\
  \ 最近发布了 `COBIT 2019`。`COBIT 2019` 是用于 IT 治理和管理的领先框架，它涵盖了整个企业的 IT 资源。可以从 `ISACA`\
  \ 网站 `https://www.isaca.org/resources/cobit` 获取 `COBIT` 资源。`COBIT 2019` 是一个扩展且稳健的集成框架。集成框架避免了在使用多个框架时的冲突。`COBIT\
  \ 2019` 使用了五个原则：\n\n1.  **满足利益相关者的需求**——利益相关者是受影响的实体。在这种情况下，利益相关者通常从 IT 资源中受益。\n\
  2.  **覆盖整个企业**——所有领域都包含在内。\n3.  **应用单一集成框架**——`COBIT 2019` 使用集成框架。\n4.  **采用整体方法**——整体方法确保对作为一个整体进行检查。\n\
  5.  **区分治理与管理**——治理包括评估、指导和监控。管理包括规划、构建、运行和监控。\n\n`图 3-4` 显示了七个 `COBIT` 组件。以下描述了它们：\n\
  \n*   **原则、政策和框架**——这些组件将期望的行为转化为实际指导。\n*   **过程**——过程是在组织内执行的实践和活动。它们有助于组织实现其目标。\n\
  *   **组织结构**——组织结构是指做出决策的实体。许多组织通过组织架构图定义这些实体。\n*   **文化、伦理和行为**——组织内部个人以及整个组织的成功取决于这些因素。\n\
  *   **信息**——组织依赖准确的信息，这对于运营和管理都是如此。\n*   **服务、基础设施和应用程序**——组织依赖这些元素提供的 IT 处理和服务。\n\
  *   **人员、技能和能力**——任务的完成取决于这些组件。\n\n\n\n\nISO 与国际电工委员会 (`IEC`) 合作工作。许多标准以 `ISO/IEC`\
  \ 标准的形式发布；但通常，这些标准仅被标识为 `ISO`。例如，`ISO/IEC 27002` 标准经常被缩短为 `ISO 27002`。\n\n`ISO`\
  \ 发布了许多与风险和 IT 相关的标准。其中三个重要的标准是：\n\n1. `ISO 27002` 安全技术\n2. `ISO 31000` 风险管理实施原则和指南\n\
  3. `ISO 73` 风险管理——术语\n\n这些标准的文档可以从 ISO 网站 [`www.iso.org`](http://www.iso.org/) 购买。\n\
  \n## ISO 27002 信息技术安全技术\n\n`ISO 27002` 是一套用于安全管理的指南和原则。当前版本是 `ISO 27002:2013`。该版本派自英国标准\
  \ (`BS`) `7799`，这是一项备受推崇的标准。\n\n该文档的 `ISO` 编号多年年来发生了变化。以下列表显示了这些变化历史：\n\n* `ISO/IEC\
  \ 17799:2000`——该文档的第一个 ISO 版本\n* `ISO/IEC 17799:2005`——对 `ISO/IEC 17799:2000` 的更新\n\
  * `ISO/IEC 17799:2005/Cor 1:2007`——一份修正文档\n* `ISO/IEC 27002:2005`——包含了 `ISO/IEC\
  \ 17799:2005` 和 `ISO/IEC 17799:2005/Cor 1:2007`。内容与 `17799` 相同，但编号更改为 `27002`。\n\
  * `ISO/IEC 27002:2013`——作为重大更新发布。然而，大多数更改只是位置的移动，且内容重新编写了编号。\n\n组织可以获得 `ISO 27002`\
  \ 合规认证。认证需要两个步骤的过程。首先，组织必须实施某些最佳实践，其次，必须由外部源对这些实践进行评估。\n\n这些最佳实践涉及：\n\n* 安全策略\n\
  * 信息安全组织\n* 资产管理\n* 人力资源安全\n* 物理和环境安全\n* 访问控制\n* 事件管理\n* 业务连续性\n* 合规\n\n## ISO 31000\
  \ 风险管理原则和指南\n\n`ISO 31000:2009` 提供了风险管理的通用指南。换句话说，它适用于 IT 其他领域。组织可以在整个生命周期中使用这些原则和指南，并将其应用于所有类型的风险。\n\
  \n`ISO 31000` 没有认证流程。作为对比，组织可以获得 `ISO 27002` 认证，但不能获得 `ISO 31000` 认证。\n\n与 `ISO\
  \ 31000` 相关的两个补充文档是：\n\n* `ISO 73` 风险管理——术语\n* `IEC 31010` 风险管理——风险评估技术\n\n`ISO\
  \ 73 风险管理——术语` `ISO 73:2009`是一份与风险管理相关的术语列表。该列表的目标是为风险管理中使用的术语提供通用定义。\n\n定义可供以下人员使用：\n\
  \n* 任何管理风险的人\n* 任何参与风险管理的人\n\n`ISO 73:2009` 是一份与风险管理相关的术语列表。该列表的目标是为风险管理中使用的术语提供通用定义。\n\
  \n`ISO 31000:2009` 提供了风险管理的通用指南。换句话说，它适用于 IT 其他领域。组织可以在整个生命周期中使用这些原则和指南，并将其应用于所有类型的风险。\n\
  \n```text\n这些最佳实践涉及：\n\n* 安全策略\n* 信息安全组织\n* 资产管理\n* 人力资源安全\n* 物理和环境安全\n* 访问控制\n\
  * 事件管理\n* 业务连续性\n* 合规\n\n`ISO/IEC 17799:2000`——该文档的第一个 ISO 版本\n`ISO/IEC 17799:2005`——对\
  \ `ISO/IEC 17799:2000` 的更新\n`ISO/IEC 17799:2005/Cor 1:2007`——一份修正文档\n`ISO/IEC 27002:2005`——包含了\
  \ `ISO/IEC 17799:2005` 和 `ISO/IEC 17799:2005/Cor 1:2007`。内容与 `17799` 相同，但编号更改为 `27002`。\n\
  `ISO/IEC 27002:2013`——作为重大更新发布。然而，大多数更改只是位置的移动，且内容重新编写了编号。\n```\n\n### ISO 73 风险管理——术语\n\
  \n`ISO 73:2009` 是一份与风险管理相关的术语列表。该列表的目标是为风险管理中使用的术语提供通用定义。\n\n定义可供以下人员使用：\n\n* 任何管理风险的人\n\
  * 任何参与风险管理的人\n\n### IEC 31010 风险管理——风险评估技术\n\n`IEC 31010` 风险管理——风险评估技术\n\n\n\n\n\
  *   **服务设计阶段**——IT 为组织内部的使用设计服务。在此阶段，IT 将设计公司的电子邮件解决方案。例如，公司的 IT 网络可能是 Microsoft\
  \ Windows 域，因此 IT 将设计一个 Microsoft Exchange 解决方案。该阶段将确定确定需要添加多少台服务器，以及为了支持这些服务器对网络进行的任何更改。\n\
  \n*   **服务过渡阶段**——此阶段包括添加、修改和移除过时的服务。此阶段的主要目标是确保过渡不会导致停机。例如，添加 Microsoft Exchange\
  \ 电子邮件解决方案将包含多个元素。需要修改活动目录（Active Directory）架构，并可能需要添加全局目录服务器。需要构建 Microsoft Exchange\
  \ 服务器，并在用户的计算机上安装应用程序。从终端用户到维护新服务器的技术人员，所有人都需要接受培训。\n\n*   **服务运营阶段**——任何服务的日常运行和支持都在此阶段处理。对于电子邮件，这些服务可以包括定期维护和处理影响服务的事件。它们还包括执行备份和测试性恢复。这里的目标是确保终端用户在需要使用邮件时能够访问到他们的邮件。\n\
  \n*   **持续服务改进阶段**——此阶段侧重于衡量和监控服务及流程。目标是确定服务可以改进的领域，包括对电子邮件服务器进行定期监控和性能调优。可以使用分析在问题变成实际问题之前识别问题区域，并对可以改进的领域提供见解。\n\
  \n可以在 [`www.itlibrary.org`](https://www.itlibrary.org/) 访问 ITIL 资源。\n\n### ITIL\
  \ 认证\n\n越来越多的机构认可 ITIL 的价值，并要求 IT 人员学习并采用 ITIL 实践。就像人们希望由经过认证的医疗保健人员进行治疗一样，许多机构也希望确保一定比例的\
  \ IT 员工获得 ITIL 认证。\n\nITIL 认证验证了不同级别的知识。第一级是 ITIL 基础（Foundation）。IT 管理员和经理通常追求这种知识。从那里，，可以专注于\
  \ ITIL 的不同领域。最高级别是 ITIL 大师（Master Qualification）。\n\nZipRecruiter 在 2019 年进行了薪资调查。拥有\
  \ ITIL 认证的人员位薪资范围的前列。拥有基础 ITIL 基础证书的人员全国平均收入超过 88,000 美元，前 6% 的人员收入在 146,000 美元到\
  \ 158,000 美元之间。\n\n需要注意的是，大多数拥有 ITIL 认证的人还具备其他技能。ITIL 实践者从坚实的 IT 基础开始，这可能使他们成为 IT\
  \ 管理员或 IT 团队的经理。ITIL 知识帮助他们确保 IT 网络尽可能顺利地运行。\n\n### 能力成熟度模型集成\n\n能力成熟度模型集成 (CMMI)\
  \ 是一种管理过程改进方法。它使用不同的级别来确定流程的成熟度。\n\nCMMI 可用于三个主要的关注领域：\n\n*   **产品和服务开发**——CMMI\
  \ 常用于软件开发，以帮助确保最终产品符合原始目标，并在预算和时间限制内完成产品。\n\n*   **服务的建立、管理和交付**——CMMI 可用于衡量服务的有效性，其中之一就是安全性。安全性有助于确保机密性、完整性和可用性。\n\
  \n*   **产品与采购**——能力成熟度模型集成 (CMMI) 是一种管理过程改进方法。它使用不同的级别来确定流程的成熟度。\n\n能力成熟度模型集成 (CMMI)\
  \ 显示了以下级别：\n\n*   **第 0 ：不存在**——未建立安全控制。没有认可。\n*   **第 1 ：初始**——有时，此级别是随机的。考虑到风险。\n\
  *   **第 2 ：已管理**——组织认可并需要。然而，行动是反应性的。\n*   **第 3 ：已定义**——组织拥有政策。它具有某些意识，并且是积极的。\n\
  *   **第 4 ：量化管理**——组织进行衡量和。它有正式政策。\n*   **第 5 ：优化**——组织整个范围内拥有正式流程。它侧重于改进。\n\n![图\
  \ 3-6 CMMI 特性。](img/978128413719_03_F06.png)\n\n**图 3-6** CMMI 特性。\n\n### 通用数据保护条例\n\
  \n通用数据保护条例 (GDPR) 是欧盟 (EU) 法的一部分。该条例在 2018 年取代了数据保护指令 95/46/ec，成为监管公司保护个人数据的主要法律。它被设计为一个法律框架，为收集和处理居住在欧盟个人的个人信息制定指南。该条例适用于所有处理欧盟或欧洲经济区\
  \ (EEA) 个人个人数据的公司。所有公司（包括此前合规的 la）都必须遵守 2018 年的指令，否则将面临严厉惩罚。以下列出了 GDPR 下的关键变化及其与以往的区别：\n\
  \n*   **增加的领土适用范围（域外适用性）**——GDPR 适用于所有处理居住在欧盟或 EEA 个人数据的公司，无论这些公司位于何处。之前的指令没有。\n\
  *   **罚款**——违反 GDPR 的公司可能会被罚以年度全球营业额的 4% 或 2,200 万美元，以高者为准。此金额代表了公司可能承担责任的最高金额，例如，未获得充分的客户同意处理数据或违反了隐私原则。\n\
  *   **同意**——公司必须以易理解且易于访问的形式提供同意，并说明附在该同意上的数据处理目的。同意必须清晰且与其他事项区分开来，并能够以给予相同的方式易于撤回。\n\
  \n### 国防部信息保证认证与授权程序\n\n国防部信息保证认证与授权程序 (DIACAP) 是一种风险管理过程，适用于美国国防部 (DoD) 使用的 IT\
  \ 系统。它在 DoD 指令 8510.1 中有详细记录。\n\n\n\n\n### 评估\n\n1.  IT 系统和数据需要被保护。对于不自行操作的组织，现在有许多法律，其中一些旨在确保\
  \ IT 系统和数据的安全。\n\n2.  除了法律之外，还有许多适用于特定行业的法规，以及大量与 IT 相关的标准和指南。许多组织可以使用这些标准和指南来评估并改进自身的安全。\n\
  \n## 核心概念与术语\n\n-   可接受使用政策 (AUP)\n-   通用检察长 (AG)\n-   能力模型集成 (CMMI)\n-   儿童互联网保护法\
  \ (CIPA)\n-   <a id=\"\" href=\"#\">儿童在线隐私法 (COPPA)</a></a>\n-   合规\n-   信息及相关技术控制目标\
  \ (COBIT)\n-   国防部信息保证认证与授权流程 (DIACAP)\n-   尽责\n-   尽职调查\n-   家庭教育权利与隐私法 (FERPA)\n\
  -   联邦存款保险公司 (FDIC)\n-   联邦信息安全现代化法 (FISMA)\n-   联邦贸易委员会 (FTC)\n-   信托责任\n-   通用数据保护条例\
  \ (GDPR)\n-   格兰姆-莱奇-布莱法案 (GLBA)\n-   健康保险流通与责任法 (HIPAA)\n-   信息技术治理 (ITG)\n-  \
  \ 信息技术基础库 (ITIL)\n-   知识产权 (IP)\n-   国际电工委员会 (IEC)\n-   国际标准化组织 (ISO)\n-   岗位轮岗\n\
  -   强制休假\n-   支付行业数据安全标准 (PCI DSS)\n-   美国班斯斯奥克斯利法案 (SOX)\n\n\n\n\n\n风险管理计划是一种特殊的项目管理类型。应用于风险管理的许多技术，与管理任何项目时所采用的技术是相同的。其核心是对计划的需求。正如俗话所说，如果你不计划，你就注定失败。没有风险管理计划，失败的可能性将远大于成功。\n\
  \n一份文档完备的风险管理计划有助于确保实现预期目标。首先，创建风险管理计划是为了缓解风险。该计划有助于识别风险并选择最佳解决方案。它还有助于跟踪解决方案的执行情况，以确保其在预算和时间内实施。一个完全实施的计划将包含一份行动计划和里程碑（`POAM`），这也可以用于跟踪项目。美国国家标准与技术研究所（`NIST`）的风险管理框架是实施风险管理计划时的一个简用指南。\n\
  \n## 第 4 章主题\n\n本章涵盖了以下主题和概念：\n\n*   风险管理计划的目标是什么\n*   风险管理计划的范围是什么\n*   如何在风险管理计划中分配职责\n\
  *如何在风险管理计划中描述程序和进度\n*   报告要求有哪些\n*   什么是行动计划和里程碑（`POAM`）\n*   如何编制风险管理计划的进度图表\n\
  *   `NIST`风险管理框架的步骤有哪些\n\n## 第 4 章目标\n\n完成本章后，你将能够：\n\n*   描述风险管理计划的目标\n*   描述计划范围的目的\n\
  *   识别风险管理计划的组成部分\n*   识别分配职责的重要性\n*   描述风险管理计划中程序列表的目的\n*   列出风险管理计划的报告要求\n*  \
  \ 记录风险管理计划的发现\n*   创建行动计划和里程碑（`POAM`）\n*   识别里程碑图\n*   识别甘特图并定义关键路径图\n*   识别`NIST`风险管理框架的步骤\n\
  \n## 风险管理计划的目标\n\n风险管理计划的重要第一步之一是建立目标。目标成为计划的路线图。它们有助于识别计划的去向，同样重要的是，有助于了解何时何时实现了计划目标。应该尽可能尽早为计划建立目标。\n\
  \n目标确定了项目的任务。这些目标概述了计划中应该包含的内容。风险管理计划的一些常见目标包括：\n\n*   威胁列表\n*   漏洞列表\n*   与风险相关的成本\n\
  *   减少风险的建议列表\n*   与建议相关的成本\n*   成本效益分析（`CBA`）\n*   一份或多个报告\n\n虽然报告记录了上述项目，但风险管理计划并此结束。一旦高层经理收到报告，他们就能根据数据做出决策。他们可能会接受某些建议，修改另一些，并推迟另一些。\n\
  \n风险管理计划的下一阶段涵盖计划的实施。实施涉及以下任务：\n\n*   记录管理决策\n*   记录并跟踪已接受建议的实施情况\n*   创建 `POAM`\n\
  \n在整个章中使用了两个示例。它们展示了如何为实际项目创建风险管理计划。这两个示例是：\n\n### 网站\n\n在整个章中，使用了两个示例。它们展示了如何为实际项目创建风险管理计划。这两个示例是：\n\
  \n**识别威胁**——计划的目标是：\n\n*   来自互联网的攻击\n*   硬件或软件故障\n*   连接丢失\n\n**识别漏洞**——漏洞是弱点，可能包括：\n\
  \n*   缺乏防火墙的保护\n*   缺乏入侵检测系统的保护\n*   缺乏防防病毒软件\n*   服务器缺乏更新\n\n**识别资产**——资产是公司在遭受攻击可能丢失的重要物品，可能包括：\n\
  \n*   销售方面的潜在损失\n*   商誉或声方面的潜在损失\n\n**分配职责**——将职责分配给特定部门以收集数据，这些数据将用于创建建议。在计划后期，将分配职责以实施和跟踪计划。\n\
  \n**识别停机成本**——包括直接和间接成本。直接成本是停机期间损失的销售。如果服务器宕机 15 分钟或更久，损失将来自销售数据。间接成本包括客户商誉的损失以及恢复商誉的成本。\n\
  \n**提供建议**——包含一份缓解风险的建议列表。这些建议可以减少弱点。它们也可以减少威胁的影响。例如，硬件故障威胁可以通过建议硬件冗余来解决。缺乏更新可以通过实施更新计划来解决。\n\
  \n**识别建议的成本**——识别并列出每项建议的成本。\n\n**提供 `CBA`**——包含每项建议的 `CBA`。`CBA`将比较建议的成本与实施该建议对公司带来的收益。收益可以用收入的增加或停机成本的减少来表示。\n\
  \n**记录已接受的建议**——经理将选择实施哪些建议。他们可以接受、推迟或修改建议。这些选择将记录在计划中。\n\n**跟踪实施**——计划将跟踪这些选择及其实施情况。\n\
  \n**创建 `POAM`**——包含一份分配职责的 `POAM`。经理将使用 `POAM` 来跟踪和跟进项目。\n\n### 健康保险流动性与责任法案 (HIPAA)\n\
  \n健康保险流动性与责任法案（`HIPAA`）于 1996 年通过。健康保险流动性与责任法案（`HIPAA`）涵盖了健康数据的保护。健康保险流动性与责任法案（`HIPAA`）合规性是为了确保保护。健康保险流动性与责任法案（`HIPAA`）合规性与网站相关。健康保险流动性与责任法案（`HIPAA`）合规性为期两个月。\n\
  \n### ![](img/Note.png)注意\n\n\n\n\n\n`firewall` 用于过滤流量。防火墙规则被配置为专门允许某些流量。大多数防火墙会阻止所有未被专门允许的流量。可以使用网络防火墙和基于主机防火墙。网络防火墙通常由硬件和软件组成，为网络过滤流量。单个系统可以拥有软件防火墙，为单个系统过滤流量。\n\
  \n## 目标示例：HIPAA 合规\n\n某公司最近收购了 Mini Acme。对 Mini Acme 记录的检查显示健康信息未受到保护。因此，收购公司不符合\
  \ HIPAA 规定，且不合规可能导致罚款和监禁。\n\n本计划的目的是确保符合 HIPAA 规定。该计划的目标是：\n\n*   **识别威胁**——威胁可能是内部的，也可能是外部的。\n\
  *   **识别漏洞**——漏洞是弱性。它们可能包括：\n    *   缺乏防止信息共享的策略\n    *   数据存储时缺乏保护\n    *   数据传输时缺乏保护\n\
  *   **分配责任**——将责任分配给特定部门以识别威胁和漏洞。这些数据将用于用于识别纠正措施。随后，可以将责任分配给相关部门以实施和跟踪该计划。\n*  \
  \ **识别不合规成本**——成本包括与不合规相关的法律罚款。额外成本可能由于诉讼或客户信任的产生。\n*   **提供建议**——创建一份建议清单。该清单可能包括流程变更、使用访问控制保护数据以及在传输期间对数据加密。\n\
  *   **识别建议成本**——识别并列出每项建议的成本。\n*   **提供成本效益分析 (CBA)**——为每项建议完成一份成本效益分析。它将比较建议的成本与停机产生的成本。\n\
  *   **记录已接受的建议**——经理将选择实施哪些建议。他们可以接受、推迟或修改建议。这些选择将记录在计划中。\n*   **跟踪实施情况**——计划将跟踪选择及其实施情况。\n\
  *   **创建 POAM**——创建一个分配责任的 `POAM`。经理将使用它来跟踪和跟进项目。\n\n## 风险管理计划的范围\n\n除了目标之外，确定风险管理计划的`scope`也很重要。范围确定了计划的边界。边界可以包括整个组织，也可以是单个系统或流程。如果没有定义的边界，计划可能会失去控制。\n\
  \n许多项目中的一个常见问题是`scope creep`（范围蔓延）。范围蔓延源于不受控的变化。随着变更的渗入，项目范围随之扩大。变更带来了额外的需求，而不受控的变更会导致成本超支和错失截止日期。\n\
  \n例如，在前面提到的 HIPAA 合规示例中，该项目的目标是让 Mini Acme 符合 HIPAA 规定。假设发现了更多未受保护的数据，例如财务数据、研究数据或用户数据。\n\
  \n如果这些数据被纳入项目，将会扩大项目范围，因为需要识别威胁和漏洞、计算数据丢失的成本，并识别额外的建议及其成本。完成所有这一切将花费更多的时间和金钱。\n\n\
  ### 注意\n\n![Note](img/Note.png)\n\n公司通常设有 `CCOs`、`CEOs`、`CFOs`、`CIOs`、`CSOs` 和 `CTOs`。`CCO`\
  \ 是首席合规官的缩写，`CEO` 是首席执行官的缩写，`CFO` 是首席财务官的缩写，`CIO` 是首席信息官的缩写，`CSO` 是首席安全官的缩写（也称为\
  \ `CISO`，首席信息安全官），`CTO` 是首席技术官的缩写。\n\n## 应用开发中的范围蔓延\n\n范围蔓延是应用开发中的一个常见问题。程序员经常看到通过对程序进行微调来改进程序。尽管程序员的初意良好，但有时这些更改可能会产生深远的影响。\n\
  \n在一个项目中，程序员向程序中添加了一个额外功能，允许用户搜索数据。这一更改显然超出了项目范围，且没有经过 `CCB` 的评估和授权。然而，编写该功能并没有花费多少时间，而且在无人通知的情况下被添加了。随后，程序带着这个新功能交付给了客户。\n\
  \n客户成功使用了该程序几个月。后来，数据格式发生了变化。格式的更改并没有影响程序的主要目的；它仍然按照要求运行。然而，额外的搜索功能不再工作了。\n\n谁负责修复问题？应用程序开发者负责。\n\
  \n最初看起来是增加值的变更实际上变成了额外的负担。尽管搜索功能在项目范围之外，但已成为应用程序的一部分。这项额外功能必须像应用程序的任何其他部分一样进行维护。开发者并没有选择余地。如果开发者拒绝修复问题，程序的感知可用性将受到影响。\n\
  \n\n\n\n\n例如，在关于与 HIPAA 无关的未保护数据的 HIPAA 中，如果风险管理团队发现了未保护的财务数据，该团队可以向项目经理（PM）提出其疑虑。PM\
  \ 可以评估这些数据并确定其中任何内容都与 HIPAA 无关，但意识到它们很重要。PM 可以将这些信息作为一个关注的问题提交给利益相关者。利益相关者可能会指示\
  \ PM 将数据纳入计划中。此时，它就变成了一个受控变更。\n\n接下来的章节将提供网站和 HIPAA 合规性项目的范围说明示例。\n\n## 范围示例：网站\n\
  \n风险管理计划的目的是保护 Acme Widgets 网站。计划的范围包括：\n\n* 托管网站的服务器安全性\n* 网站本身的安全性\n* 网站的可用性\n\
  * 网站数据的完整性\n\n该项目的利益相关者包括：\n\n* 销售副总裁\n* 信息技术（IT）支持部门主管\n\n本计划范围之外的所有活动均需要书面批准。\n\
  \n## 范围示例：HIPAA 合规性\n\n风险管理计划的目的是确保 Mini Acme 的数据符合 HIPAA 标准。该计划的范围包括：\n\n* 识别所有健康数据\n\
  * 存储健康数据\n* 使用健康数据\n* 传输健康数据\n\n该项目的利益相关者包括：\n\n* 首席信息官（CIO）\n* 人力资源（HR）部门主管\n\n\
  本计划范围之外的所有活动均需要书面批准。\n\n## 分配职责\n\n风险管理计划规定了职责，提供了问责机制。如果不分配职责，任务很容易被遗漏。职责可以分配给：\n\
  \n* 风险管理 PM\n* 利益相关者\n* 部门或部门主管\n* 执行官，例如 CIO 或 CFO\n\n确保任何分配职责的实体都有完成任务的权限是非常重要的。这对\
  \ PM 来说尤为重要。\n\n例如，团队成员可能并不向 PM 工作。例如，技术人员可能在 IT 部门工作。他们被分配为项目的团队成员，但他们可能仍向 IT 部门的主管汇报。因此，来自\
  \ IT 部门和 PM 的任务分配可能会相互冲突。如果 PM 没有解决这些问题，项目的成功可能会受到影响。至少，PM 应该能够接触利益相关者以解决问题。\n\n\
  PM 计划的整体成功。PM 的常见任务包括：\n\n* 确保成本得到控制\n* 确保质量得到维护\n    * 确保项目按进度进行\n    * 确保项目在范围内\n\
  \    * 跟踪并管理所有项目问题\n    * 确保所有利益相关者都能获得信息\n    * 在问题和困难出现时及时提出\n    * 确保他人意识到他们的职责和截止日期\n\
  \n## 注意\n\n![](img/Note.png)\n\n风险管理 PM 有时被称为风险管理协调员。成功的风险管理 PM 所需的技能与几乎任何项目中成功的项目经理所需的技能是相同的。\n\
  \n可以为以下活动分配个人职责：\n\n* `Identifying risk`——此职责包括识别威胁和漏洞。生成的潜在风险列表可能非常详尽。\n* `Assessing\
  \ risk`——此职责涉及识别每个风险发生的概率和影响。威胁矩阵是评估风险的常用方法。\n* `Identifying risk mitigation steps`——此职责涵盖了可以采取以减少弱点的步骤，以及减少风险影响的步骤。\n\
  * `Reporting`——此职责涉及向管理层报告由计划创建的文档。PM 通常负责编制报告。\n\n接下来的两个章节将展示网站和 HIPAA 合规性场景的职责说明示例。\n\
  \n## 提示\n\n![](img/Tip.png)\n\n考虑创建一个威胁-概率-影响矩阵。为每个概率分配一个 10 到 100 的百分比。影响严重程度分配一个\
  \ 10 到 100 之间的值。然后通过两个值相乘计算该值。数值越高表示应优先处理的风险。数值越低表示可以接受的风险。\n\n### 职责示例：网站\n\nCFO\
  \ 将 IT 部门提供资金，以聘请一名安全顾问来协助 IT 部门工作。\n\nIT 部门负责提供：\n\n* 威胁列表\n* 漏洞列表\n* 推荐解决方案列表\n\
  * 每个推荐解决方案的成本\n\n销售部门负责提供：\n\n* 所有持续 15 分钟或更长时间停机的直接成本\n* 所有持续 15 分钟或更长时间停机的间接成本\n\
  \nCFO 将验证由 IT 和销售部门提供的数据。然后，CFO 将完成成本效益分析（CBA）。\n\n### 职责示例：HIPAA 合规性\n\nHR 部门负责识别\
  \ Mini Acme 持有的所有健康信息。HR 部门负责提供：\n\n## 使用亲和图\n\n虽然分配职责很容易，但识别任务可能并不容易。挑战之一是生成真实的威胁、漏洞和建议列表。亲和图可以帮助完成这些任务。\n\
  \n亲和图是通过四个基本步骤创建的：\n\n1. `Identifying the problem`——创建一个基本问题说明。例如，考虑网站问题。问题可以描述为“网站宕机导致销售损失”。\n\
  2. `Generating ideas`——越多越好。想法可以是关于问题的任何元素。它们可以包括威胁、漏洞和推荐的解决方案。头脑风暴是一种可以使用的方法。在头脑风暴会议中，鼓励参与者提到脑海中出现的任何事情。所有想法都被不加判断地记录下来。创作过程通常产生丰富的想法。\n\
  3. `Gathering ideas into related groups`——想法生成后，对它们进行分组。对于风险管理计划，这些组通常符合威胁、漏洞和建议等类别。其中某些类别可能包含子类别。例如，漏洞可以分为网络和服务器缺陷。\n\
  4. `Creating an affinity diagram`——`图 4-1`显示了亲和图示例。它将所有想法聚集在一起。\n\n![FIGURE 4-1\
  \ Affinity diagram.](img/9781284183719_CH04_FIGF01.png)\n\n**图 4-1** 亲和图。\n\n在实际场景中，亲和图可能会大得多。威胁可以分为外部和内部。漏洞列表几乎无限。\n\
  \n* 所有健康信息源列表\n* 所有数据源关于 HIPAA 合规性的检查结果：\n    * 数据如何存储\n    * 数据如何保护\n    * 数据如何传输\n\
  * Mini Acme 使用的现有 HIPAA 政策列表\n* 需要的 HIPAA 政策列表\n* 确保符合 HIPAA 的推荐解决方案列表\n* 每个推荐解决方案的成本\n\
  * 与不合规相关的成本\n\nIT 部门负责提供：\n\n* 用于数据访问控制的识别\n* 确保符合 HIPAA 的推荐解决方案列表\n* 每个推荐解决方案的成本\n\
  \n\n\n\n\n首席财务官（CFO）将验证 IT 和销售部门提供的数据，然后完成 `CBA`。\n\n### 描述完成程序和时间表\n\n风险管理计划的这部分是在项目启动后创建的。针对威胁或漏洞，包含了一个建议的解决方案，旨在降低相关风险。虽然解决方案可以用简短的短语总结，但解决方案本身通常包含多个步骤。\n\
  \n例如，现有的防火墙可能使服务器暴露于多种漏洞。解决方案可以是升级防火墙。此升级可以分为几个步骤，例如：\n\n*   确定哪些流量应该被允许\n*   创建防火墙策略\n\
  *   购买防火墙\n*   安装防火墙\n*   配置防火墙\n*   测试防火墙\n*   实施防火墙\n\n### ![](img/Note.png)注意事项\n\
  \nMITRE 在其网站上提供了风险管理工具包区域，位于 [`www.mitre.org/work/sepo/toolkits/risk/index.html`](http://www.mitre.org/work/sepo/toolkits/risk/index.html)。该网站包含有关创建关联性图的信息。\n\
  \n这些步骤中的每一个都可以进行更详细的描述。此外，还可以为每个步骤的完成包含时间表。\n\n在此阶段有几点需要记住：\n\n*   管理层负责选择实施的控制措施。\n\
  *   管理层对剩余风险负责。\n\n由于管理层尚未审核建议，此时间表通常不包含日期。相反，时间表将列出完成建议可能需要的时间。\n\n例如，一项建议可能包含五个任务。可以为这些任务中的每一个列出所需时间。之后可以添加开始结束日期。\n\
  \n后续章节将给出网站和 HIPAA 示例的程序部分列表列表。\n\n#### 程序示例：网站\n\n该网站容易受到来自互联网的拒绝服务（DoS）攻击。这种风险无法消除。但是，可以完成若干任务来降低风险：\n\
  \n*   **建议**——升级防火墙。\n*   **理由**——当前的防火墙是一个基础路由器。它能过滤数据包，但不提供高级的防火墙功能。\n*   **程序**——可以使用以下步骤来升级新防火墙：\n\
  \n    1.  **启动防火墙日志**——此日志可用于确定当前正在使用哪些端口。日志应至少收集一周。\n    2.  **创建防火墙策略**——`防火墙策略`\
