  \ `BIA` 使用什么类型的方法？\n    1. 自下而上方法\n    2. 自上而下方法\n    3. 中间方法\n    4. 猜测方法\n11.\
  \ 关键业务功能至关重要。它们推导自？\n    1. 关键成功因素\n    2. IT 系统\n    3. 执行领导层\n    4. 员工\n12. 在开发\
  \ `BIA` 时，关键功能应该映射到哪些内容？\n    1. 收入\n    2. IT\n    3. 成本\n    4. 机会\n13. 在以下选项中，哪些是最佳实践？\n\
  \    1. 从明确的目标开始\n    2. 使用数据收集方法\n    3. 缓解风险\n    4. 仅限 BCP\n    5. 以上所有\n14.\
  \ 成本效益分析是 `BIA` 的重要部分。\n    1. 正确\n    2. 错误\n\n\n\n\n`BCP` 的范围包含了对组织及其信息技术（IT）系统、设施和人员的全局视图，这并不意味着组织的所有元素在中断期间都必须继续运行。相反，这意味着\
  \ `BCP` 会审查所有元素，然后识别出那些任务至关重要且需要继续运行的元素。不需要继续运行的非任务关键元素则不在此 `BCP` 的考虑范围内。\n\n###\
  \ ![](img/Tip.png)提示\n\n`BCP` 的范围可以限制在组织的某些部分。例如，它可能只包含某个特定的地点或特定的 `CBFs`（关键业务功能）。然而，`BCP`\
  \ 关注的是整体业务功能，而不仅仅是单个的 IT 系统。\n\n`任务关键型`系统是指被识别为对组织任务至关重要、能够维持组织运转的系统。`任务关键`一词也适用于功能或流程。\n\
  \n业务影响分析（`BIA`）是 `BCP` 的组成部分。`BIA` 有几个直接支持 `BCP` 的关键目标。这些包括：\n\n* **识别关键业务功能 (CBFs)**——`CBF`\
  \ 是任何被认为对组织至关重要的功能。如果 `CBF` 失败，组织将失去执行任务关键操作的能力。\n* **识别支持 CBFs 的关键流程**——关键流程是支持\
  \ `CBFs` 所需采取的步骤或行动。\n* **识别支持 CBFs 的关键 IT 服务，包括任何依赖关系**——这些服务包括支持关键流程所需的服务器和其他硬件。许多服务都存在依赖关系。例如，应用程序服务器可能需要数据库服务器才能保持运行。\n\
  * **确定 CBFs、流程和 IT 服务的接受停机时间**——`BIA` 将这种停机时间定义为最大可接受中断时间（`MAO`）。在考虑 `BCP` 时，还应该确定在一年的不同时间段是否有不同的\
  \ `MAOs`。例如，数据库服务器对于年底处理可能是至关重要的，但在其他时间可能并不重要。\n\n所有这些目标在 `BCP` 中汇合，以对齐组织的优先事项。`BIA`\
  \ 识别出任务关键的系统、应用程序和操作，而 `BCP` 则提供了计划，以确保即使在灾害发生时它们也能继续运行。\n\n同样，`BCP` 还包含了灾难恢复计划（`DRPs`），它们帮助组织在灾害后恢复\
  \ IT 服务。任何组织都可以使用符合其需求的程序创建自己的 `BCP`。然而，`BCP` 的总体步骤如下：\n\n* 授权 `BCP` 并创建 `BCP` 范围声明\n\
  * 完成 `BIA`\n* 识别应对措施和控制措施\n* 开发各个 `DRPs`\n* 提供培训\n* 测试和演练计划\n* 维护和更新计划\n\n### BCP\
  \ 的组成要素\n\n`BCPs` 是大型且全面的文档。它们包含许多元素，并且通常涵盖许多突发情况。单一的格式无法涵盖所有组织的所有。然而，某些指南建议包含特定的元素。\n\
  \n### 业务连续性与灾难恢复\n\n`业务连续性`（`BC`）和`灾难恢复`（`DR`）并不是同义词，而是独立但相关的两个过程，尽管有些人会混淆并交替使用这两个术语。`BC`\
  \ 涵盖业务的所有功能，以确保在中断发生时整个业务能够继续运行，并将 `BIA` 和 `DRP` 作为 `BCP` 的附件。`DR` 在很大程度上是 IT 的功能，包含了从灾难中恢复所需的元素，如备份、恢复和还原。`DR`\
  \ 也可以更广泛，包括如备用站点等元素。然而，`DRP` 是更大规模的 `BCP` 的一部分。\n\n例如，一家银行在受飓风威胁的海岸上运营。客户使用银行的网站进行在线银行业务。如果飓风来袭，该银行希望确保其网站能够继续可用。因此，`BCP`\
  \ 可以包含一个 `DRP`，其中包含了在备用地点恢复网站所需的步骤。\n\n天气服务部门在特定的小时段内提供警报，例如在预计飓风将在 72 小时内袭击时发布警报。`BCP`\
  \ 可以指定 72 小时、48 小时和 24 小时的特定步骤，而 `DRP` 将提供如何将网站移动到备用地地的细节。\n\n`BCP` 可能会处理飓风的其他非技术因素。例如，银行应该何时关闭？何时应该锁金库？保安人员是否应该留在里面？是否需要其他安全预防措施？\n\
  \n灾害过后，`BCP` 和 `DRP` 将有不同的目标，但它们将共同工作。再次，`BCP` 侧重于让整体业务恢复正常，而 `DRP` 侧重于恢复和 IT 功能。\n\
  \n例如，以下章节通常包含在 `BCP` 中：\n\n* 目的\n* 范围\n* 假设和规划原则\n* 系统描述与架构\n* 职责\n* 通知与激活阶段\n*\
  \ 恢复阶段\n* 重建阶段\n* 计划测试与演练\n* 计划维护\n\n以下章节描述了这些章节的内容。\n\n## 目的\n\n`BCP` 的目的是确保在中断发生时组织任务关键的元素能够继续运行，中断是指任何可能停止运营的事件。`BCP`\
  \ 在中断发生或即将发生时实施。`BCP` 将一直持续到正常运行恢复。\n\n在中断期间只维护 `CBFs`，这意味着在灾难期间无法维持常规。`BIA` 识别了\
  \ `CBFs` 及其优先级，`BCP` 则确保有元素来维护这些 `CBFs`。\n\n`BIA` 还包含了接受的停机时间。某些 `CBFs` 需要保持最小停机时间运行，而其他\
  \ `CBFs` 的优先级较低。根据 `BIA` 中确定的恢复时间目标，这些低优先级的 `CBFs` 可能会宕机数小时。\n\n## 范围\n\n与任何项目一样，`BCP`\
  \ 的范围需要定义，因为项目的成功取决于人员对任务的理解。如果没有范围声明，会导致两个问题：首先，预期的任务将无法完成，这意味着 `BCP` 是完整的。其次，可能会出现范围蔓延。范围蔓延发生在项目不断承担额外任务时。例如，预期范围可能涵盖一个地点，但\
  \ `BCP` 包含了五个地点的建议。\n\n范围声明可以包含几个关键项目，如地点、系统、员工和供应商。应包含 `BIA` 中识别的关键系统。支持关键系统的员工应根据职位而非名称包含。如果零件或用品只能从特定来源获取，则供应商应包含在\
  \ `BCP` 中。\n\n尽管 `BCP` 将采取组织的全局视图，但它不必涵盖整个组织。`BCP` 可以仅涵盖特定的地点。例如，一家公司在亚特兰大有主办公室，在芝加哥、洛杉矶和迈阿密有区域办公室。它可以为每个地点创建四个独立的\
  \ `BCPs`。\n\n个人部门或分支可能会有需要从业务连续性角度考虑的较小威胁，但通常，这些部门使用应急计划或冗余措施。这些较小威胁不会通过单独的 `BCPs`\
  \ 来处理。\n\n#### 假设和规划原则\n\n\n\n\n每个 `BCP` 都需要包含一些基础假设和规划原则，这些原则对于 `BCP` 的初始开发非常有帮助，在实施阶段也同样有用。\n\
  \n一个关键的规划原则是公司预计在 `BCP` 之下持续运营直到恢复正常运行的时间。例如，一家公司可以计划在飓风袭击后根据 `BCP` 持续运营七天。那么，这七天就成为许多其他要素的指导原则，例如七天的物资、七天的发电机燃料，或者为人员准备的七天食物和水。\n\
  \n### ![](img/Tip.png)提示\n\n这些假设和原则将驱动大部分决策过程，因此它们必须是准确的。例如，如果公司假设自己永远不会停电，那么它就不会为备用电源制定计划。然而，如果中断确实导致了停电，计划的其余部分将无用武处。\n\
  \n假设和原则可以从几个不同的类别进行审查和评估，包括计划中要处理的事件，以及策略、优先级和所需支持等要素。以下章节为这些领域提供了指导。\n\n#### 应当包含和排除的事件\n\
  \n许多 `BCP` 会识别哪些特定事件包含在内，哪些被排除在外。例如，`BCP` 可能设计用于应对由于飓风或地震引起的特定中断，或者应对通用型事件，例如由于任何原因导致的停电。\n\
  \n例如，某机构位于飓风易发地区。在飓风来袭之前，他们会有几个小时甚至几天的提前通知。对于飓风，安全预防措施和准备步骤是众所周知的，例如固定任何可能被吹走的物品，为风力损坏做准备，以及某些地区的防洪准备。\n\
  \n现在，将该机构与位于地震易发地区的组织进行比较。该组织不会收到地震即将发生的任何通知。前一秒一切都很平静，下一秒建筑就开始倒塌。取决于地震的严重程度，损害可能从微乎其微到毁灭性破坏。\n\
  \n对这些每个事件的响应是完全不同的。因此，了解 `BCP` 将用于响应哪些事件，将有助于很好地了解应该包含哪些步骤。\n\n另一方面，某些事件是通用的。例如，`BCP`\
  \ 可以包括在停电时为组织提供备用发电机电源的计划，无论电力是如何丢失的，该计划都可以。计划还可能包括在某个地点无法使用时搬迁到另一个地点。再次，地点为何无法使用并不重要。原因可能是火灾、洪水、龙卷、地震或其他原因。\n\
  \n## 策略\n\n`BCP` 的策略确定了计划的某些关键要素，可能包括地点、通知和交通。\n\n如果一个组织位于单一地点，策略将是处理这个单一地点；而如果组织位于多个地点，则需要为每个地点确定一个策略。例如，一个组织可能决定关键的\
  \ IT 资源将集中位于并维护，例如在一所拥有广阔校园内许多建筑的大型大学里。与其在每栋建筑中维持运营，`BCP` 可以识别出在一个或多个中心建筑中维护的特定资源。\n\
  \n如果事件已经发生或即将发生，需要通知 `BCP` 团队成员。因此，确定如何通知所有关键参与者非常重要。一种方法是使用电话树。通过电话树，一个人通过拨打几位关键人员（如团队负责人）开始该过程。然后，团队负责人拨打名单上的人员，以此类推，直到最终每个人收到通知。\n\
  \n交通可能是一个问题。如果成员需要从一个区域到另一个区域的交通，`BCP` 解决这个问题。例如，可以指定公司车辆根据需要接送人员。或者，如果需要移动设备，应在\
  \ `BCP` 中明确如何进行移动。\n\n如果持续运营需要物资，那么物资是一个重要问题。例如，如果公司需要物资来继续生产产品，那么这些物资必须可用。需要公用事业，如水、电和气。如果策略是根据\
  \ `BCP` 计划持续运营七天，公司将需要提供七天的自公用事业。\n\n通信是另一个问题，因为在中断期间通信通常会被中断。固定电话可能无法工作，在某些情况下，手机也无法工作。许多组织使用对讲式（push-to-talk）手机，这种手机既可以当手机也可以当对讲机。即使手机功能在紧急情况下停止工作，对讲机功能仍然有效。\n\
  \n对讲手机的好处是，它们的对讲机功能不需要外部资源，因为它们只是在某个频率上广播。只要另一部手机在范围内，就能接收信息。一种方法是购买许多这种对讲手机，并在计划的第一阶段分发给关键参与者。\n\
  \n#### 优先级\n\n`BIA` 识别了关键业务功能（`CBFs`）和关键资源及其优先级。通常，`BCP` 会重新确认这些优先级，并确保工作重点放在优先恢复最高优先级的系统。这些高优先级系统将拥有大部分资源用于恢复它们。\n\
  \n#### 所需支持\n\n`BCP` 在每个阶段都需要支持，最重要的是管理层的支持。没有这种支持，来自人员的必要投入和支持以及所需的资金将无法到位。因此，如果没有高层管理者的支持，`BCP`\
  \ 注定会失败。\n\n在本章的后后部分，列出了个人和团队的职责。显然，这些团队必须为 `BCP` 提供支持，并在他们的努力中获得支持。\n\n在通知和激活阶段，所有人员都需要尽快响应。某些人员可能被识别为任务关键人员，他们需要在紧急情况下留在现场。\n\
  \n### ![](img/Tip.png)提示\n\n手头准备好持续生产的物资可能与其他组织的原则发生冲突。例如，许多组织使用准时制（just-in-time）哲学，即零件和物资在需要时到达。为\
  \ `BCP` 始终储备七天的物资会将资金占用在库存中。此外，某些物资需要轮换以确保它们不会过期或过时。\n\n## 系统描述与架构\n\n`BCP` 识别了在中断期间需要保持运行的\
  \ `CBFs`。这些 `CBF` 中的每一个都有支持它的独立系统。因此，拥有这些系统的当前描述和文档是非常重要的。这些文档需要足够详细，以识别关键系统和支持架构。如果文档可用或已过时，维护和恢复\
  \ `CBFs` 将变得困难得多。\n\n在为 `BCP` 编写 `CBF` 系统文档时，可以识别出恢复计划中需要处理的要素。例如，文档可能显示系统必须通过广域网（`WAN`）链路保持连接以维持运行。如果计划中不包含替代方案，此\
  \ `WAN` 链路将成为单点故障。例如，**图 13-1** 显示了连接总部办公室数据库服务器与远程地点的 `WAN` 链路。如果 `WAN` 链路故障，`CBF`\
  \ 将失效。因此，`WAN` 链路必须保持运行以支持 `CBF`。\n\n![图 13-1 通过 WAN 链路连接的数据库服务器。](img/9781284183719_CH13_FIGF01.png)\n\
  \n\n\n\n\n# 图 13-1 通过 WAN 链路连接的数据库服务器。\n\n`FIGURE 13-2` 显示了相同的两台服务器，但采用了备份通信方法。服务器在大多数时间内通过\
  \ WAN 链路进行通信。如果链路故障，服务器将通过调制解调器通信。尽管调制解调器链路远慢于 WAN 链路，但在中断期间仍然可以满足组织的需求。\n\n![图\
  \ 13-2 具有主备用连接方式的数据库服务器。](img/9781284183719_CH13_FIGF02.png)\n\n## 图 13-2 具有主备用连接方式的数据库服务器。\n\
  \n以下章节识别了包含在业务连续性计划（BCP）中的常见文档。\n\n### ![](img/Tip.png)提示\n应采取措施考虑员工的家庭，如果员工在中断期间需要留守现场，更是如此。在紧急情况下，员工绝不能在照顾家庭或照顾组织之间做出选择。本书编写时，全球大部分地区正经历大流行（COVID-19），大多数服务已关闭，包括学校和办公室。个人和家庭被困在家里，许多人在照顾照顾亲人的同时进行远程工作。\n\
  \n#### 概述\n概述章节从宏观角度描述了关键业务功能单元（CBF）。例如，以下是对一个托管在组织总部地点的关键数据库的描述。总部在数据库服务器上托管销售数据库，该数据库对多个业务功能至关重要：\n\
  \n* 总部的管理人员使用此数据库识别并跟踪全公司的销售情况。\n* 订单和生产人员使用此数据库订购并跟踪运往商店的产品。\n* 数据库跟踪每家商店的库存。任何商店的员工都可以查询数据库，以确定某物品在本地或其他商店是否有货。\n\
  \n每家商店都有一个本地数据库服务器，托管该商店的数据库并记录商店销售情况，商店数据库每小时与总部数据库服务器同步一次。这些信息没有提供细节，但提供了足够理解大局情况的信息。\n\
  \n#### 功能描述\n功能描述在概述的基础上，提供了有关系统的更多详细信息。\n\n### ![](img/Note.png)注意\n在本示例中，托管在总部的数据库服务器是关键的。如描述所示，没有表明商店数据库服务器是关键的，这意味着商店数据库服务器发生故障不会影响总部的数据库。然而，在另一家公司，每个商店地点的数据库服务器可能是关键的。在这种情况下，所有服务器都可以被包含在同一个\
  \ BCP 中，或者为每家商店创建一个 BCP。\n\n许多系统与其他关键系统相互作用，因此尽可能包含图表是有价值的。例如，`FIGURE 13-3`](#24_chapter13_02.xhtml#fig13-3)显示了概述部分中描述的数据库的图，展示了每个偏远商店如何通过\
  \ WAN 链路连接到总部。\n\n![图 13-3 商店与总部之间连接的数据库服务器。](img/9781284183719_CH13_FIGF03.png)\n\
  \n## 图 13-3 商店与总部之间连接的数据库服务器。\n\n描述将提供更多细节。例如，它将包含商店名称、位置以及 WAN 链路的细节，如果存在冗余的 WAN\
  \ 链路，还将对其进行描述。\n\n关于总部服务器的细节同样重要。此描述应包含服务器名称、操作系统以及所使用的数据库应用程序。例如，服务器可能运行带有 `SQL\
  \ Server 2019` 的 `Windows Server 2019`。\n\n如果服务器包含任何容错能力，将在此处提及。例如，数据库服务器可能处于故障转移集群中，并包含冗余磁盘阵列（RAID）子系统。双节点故障转移集群允许一台服务器发生故障而不影响数据库提供的服务。有了\
  \ RAID，即使驱动器故障，系统也将继续运行。\n\n#### 数据敏感性与操作关键性\nBCP 包含了有关系统数据敏感性的信息以及系统操作关键性的详细说明。\n\
  \n任何组织都会有一些秘密或专有数据。组织必须对这些数据定义分类，因为分类决定了数据所需的保护级别。某些数据可能被分类为隐私并仅供组织内部使用，而其他数据可能是公开且可免费获取的。\n\
  \n如果系统存储数据，必须根据其分类级别对数据进行保护。考虑到这一点，BCP 需要记录数据的敏感性。在紧急情况下，安全措施并不是每个人的首要考虑。然而，如果已经在\
  \ BCP 中记录了敏感性，人们就会知道采取哪些预防措施。例如，数据库可能会收集客户信息，包括信用卡数据和所有商店的销售数据。组织可以将这些数据归类为私有或专有。如果移动数据库服务器，则需要采取措施在传输过程中以及原始位置和备用位置保护数据。在之前托管在总部数据库服务器上的数据示例中，由于这些数据包含销售数据，服务器很可能持有客户数据（包括信用卡信息和实际销售金额），大多数组织都会尽可能保持其私密。\n\
  \n操作关键性识别了 IT 服务故障时产生的影响。关键性通常记录在业务影响分析（BIA）中，但在 BCP 中重复出现以确保清晰。关键性可以用简单的陈述来定义。例如，以下陈述可以用于示例中提到的总部数据库服务器：\n\
  \n如果数据库服务器发生故障，偏远商店将无法通过数据库查询产品。他们将无法验证产品是否在自己的商店或其他商店中。如果商店服务器无法与总部服务器同步，它们将在系统中排队等待销售数据，直到可以发送这些数据。\n\
  \n新产品的订购将会延迟，因为现有产品的销售情况将未知，管理层将无法获得当前数据，这可能会影响多个层面的决策。\n\n#### 识别关键设备、软件、数据、文档和物品\n\
  BCP 应列出系统所有的关键组件，原因如下：第一，BCP 明确说明了 CBF 需要哪些组件；第二，它提供了一个可以从头开始恢复系统的列表。\n\n此列表包括任何设备，如服务器、交换机和路由器。由于服务器可能需要从头开始重建，BCP\
  \ 应列出操作系统和支持系统所需的任何应用程序。如果使用镜像来重建服务器，则将列出版本号。\n\n### ![](img/Tip.png)提示\n安全系统的主要目标是保护机密性、完整性和可用性。在编写\
  \ BCP 这一部分时，应考虑这三者任何之一的丢失。例如，如果组织丢失了数据或系统的可用性，会发生什么？\n\n列表上的项目可以包括托管在系统上的数据库；任何类型的文件（如文档或电子表格）；以及任何所需的物品。这些物品可以是简单的办公用品，如打印机纸张和墨盒。对于某些系统，列表可以包括技术物品，例如机器的特殊滑油或维护所需的工具。\n\
  \n\n\n\n尽可能，应该包含这些项目所在的位置。某些组织会创建“应急救护箱”（crash carts），其中包含了重建系统所需的所有组件。它们包括用于操作系统、应用程序或镜像的\
  \ CD 或 DVD，以及用于构建或重建系统的基础说明。\n\n## 电信\n\n与其他系统的必要连接性是业务连续性计划（BCP）中需要记录的重要元素。这种连接性可能来自内部网络、互联网、专用\
  \ WAN 线路或电话线路。\n\n外部连接通常使用电信公司的线路。互联网服务提供商（ISP）提供的不仅仅是接入互联网。他们还可以租赁用于广域网（WAN）和虚拟专用网络（VPN）的线路。\n\
  \n任何必要的通信链路都应予以记录。例如，如果数据库通过 `VPN` 线路接收来自其他数据库的更新，则应包含该信息。某些系统具有多条通信线路以实现冗余。如果系统可以在没有特定电信线路的情况下运行，则应与冗余连接一起识别出来。\n\
  \n## 职责\n\nBCP 内部职责应当进行分配。分配职责可以让所有相关人员都一目了然。当任务未完成或后于进度时，如果知道负责人，更容易让项目回到正轨。\n\n\
  组织中的员工将在 BCP 中担任特定角色。这些角色包括 `BCP 计划经理`、`BCP 协调员`、`BCP 团队负责人`和 `BCP 团队成员`。\n\n下一节将介绍这些角色职责以及可能包含在\
  \ BCP 中的其他关键人员。\n\n## BCP 计划经理\n\n`BCP 计划经理`（`PM`）通常管理大型组织内的多个 `BCP` 项目。例如，一个大型组织可能有多个地点，并且每个地点都有相应的\
  \ `BCP`。`BCP 协调员`管理单一 `BCP` 并向 `BCP PM` 报告。`BCP PM` 确保每个 `BCP` 按预期进展。`PM` 可以使用传统的项目管理技能来管理这些\
  \ `BCP`。例如，每个 `BCP` 都有开始日期、里程碑以及开发阶段的结束日期，并将包含开始评审的日期。这些评审也有里程碑和结束日期。\n\n`BCP PM`\
  \ 负责确保每个 `BCP` 都在正常进行。根据组织的层次结构，`BCP PM` 可能对单个 `BCP` 协调员没有权限，这使得 `PM` 必须具备卓越的沟通能力。\n\
  \n其他组织可能有一个专门具有专业项目管理技能的 `PM` 部门。`首席 PM` 监督其他几位 `PM`。在这种情况下，`BCP PMs` 对 `BCP` 协调员拥有直接权限。\n\
  \n## BCP 协调员\n\n`BCP 协调员`负责某个特定的 `BCP`。此个人根据 `BCP` 的阶段可能承担角色：\n\n- 在 `BCP` 完成并激活之前，此人负责开发和完成它。\n\
  - 当 `BCP` 完成并激活后，`BCP 协调员` 负责宣布紧急状态并激活 `BCP`。\n\n当宣布紧急状态时，`BCP 协调员` 会联系适当团队或团队负责人。例如，如果使用了应急管理团队，`BCP\
  \ 协调员`将联系应急管理团队负责人。\n\n## BCP 团队\n\n`BCP` 无法由一个人来计划、实施和执行。相反，通过组织团队来协助这一过程。\n\n\
  如果组织较小，可能仅有一个 `BCP 团队`，该团队承担后续章节提到的所有独立团队的职责。成员具有不同水平的专业知识。某些成员在不同阶段会比其他人更活跃。较大的组织拥有多个具有不同目标和职责的团队。\n\
  \n尽管不同团队有不同的目标，但成员需要一些共同技能和能力。最重要的是，他们需要合作。一个能够与他人合作并完成工作的成员，比许多擅长挑毛病的“专家”要好。\n\n\
  （注：原文文本在 [_content] [/_content] 标签处结束，内容似乎有截断，译文已基于所提供的文本完整翻译。）\n\n\n\n\n-   **远程办公人员**——远程办公人员通常在家里工作。只要组织运行正常，居家办公就是有效的。然而，在发生中断期间，远程办公人员可能无法访问组织的资源，从而无法完成任何工作。组织可能希望这些员工在不同的地点访问资源。或者，这些人员可能拥有帮助组织度过中断的技能，他们可能需要回到工作现场。业务连续性计划（BCP）规定了组织在中断期间对这些员工的期望。\n\
  \n## 继任顺序与权限委托\n\n在某些灾害中，关键人员可能无法到位。例如，首席执行官（CEO）可能希望在 BCP 激活之前接到 BCP 协调员通知。但如果\
  \ CEO 正在度假且无法联系怎么办？BCP 协调员应该通知谁呢？\n\nBCP 将包含一个继任顺序或指挥链，以处理此类情况。组织可以按照如下指定继任顺序：\n\
  \n*   CEO\n*   首席信息官（CIO）\n*   副总裁（VPs），顺序如下：服务交付、销售和营销\n*   部门经理，顺序如下：服务交付、销售和营销\n\
  \n如果 CEO 或 CIO 在现场，将首先联系他们。如果 CEO 或 CIO 不在，则将联系服务交付副总裁。请注意，如果服务交付和销售副总裁都在场，继任顺序规定服务交付副总裁优先。\n\
  \n同样，确定哪些权限可以被委托的也可以包含在 BCP 中。在重大危机期间做出的决策可能会对组织产生数年的影响。BCP 可能会规定某些决策必须由 CEO 或 CIO\
  \ 做出，即使他们不在现场。如果无法联系到 CEO 或 CIO，则这些决策可以根据继任顺序进行委托。如果 BCP 没有委托权限，且现场人员无法联系高层管理人员，他们将无法做出决策。这种不作为可能造成的损害比做出一个并不完美的决策要大。\n\
  \n## 通知与激活阶段\n\nBCP 协调员宣布通知和激活阶段，此时中断已经发生或即将发生。对比飓风和地震，可以发现该阶段如何根据中断的类型而有所不同。\n\n\
  ### ![](img/Note.png)注意\n\n有时，不同来源报告的时间范围可能不同。例如，一家电视台说飓风将在 75 小时后登陆，而另一家电视台则说将在\
  \ 72 小时后击袭。BCP 协调员有权宣布何时达到特定的飓风阶段。\n\n气象预报员能够对许多飓风提前几天发出警告。虽然预测并非 100% 准确，但它们为组织提供了提前预警，以便在发生发生时做好准备。BCP\
  \ 可以编写为在不同阶段采取不同的步骤。例如`表格 13-1`显示了飓风接近时不同时间应采取的行动。在表中，时间范围通过特定的阶段或级别代码进行标识。该阶段是内部的，表示达到该代码时应采取的行动。这不是一个完整的列表，但它提供了在不同时间采取不同行动的思路。\n\
  \n**表 13-1** 飓风检查清单\n\n| 时间范围 || 行动 |\n| --- | --- |\n| 96 小时 飓风第 4  | 通知所有人员飓风将在\
  \ 96 小时内袭击。开始进行室常规清理，确保在飓风级风中可能变成飞行体的材料移室内。检查其他阶段的步骤和职责。 |\n| 72 小时 飓风第 3  | 检查物资清单。确保所有必需物资已到位。对于易受淹水的建筑，开始堆沙袋。检查其他阶段的步骤和职责。\
  \ |\n| 48 小时 飓风第 2 | 释放非必要人员回家照顾自己和家人。测试备用发电机。通知飓风小组他们处于待命状态，以及何时应该报告到现场。 |\n| 24\
  \ 小时 飓风第 1 | 接入留在整个飓风期间的飓风小组。释放所有其他人员。 |\n\n相比之下，地震不会提供任何通知。它只是直接来袭。此外，在重大地震发生后，预计会有许多余震。\n\
  \n考虑到这一点，地震的 BCP 将具有一个完全不同的通知和激活阶段。BCP 甚至可以编写为：要求人员在地震发生时即使没有收到正式通知也采取特定行动。例如，响应小组成员可以立即向其主管报告寻求指示。\n\
  \nBCP 协调员仍将激活 BCP，以确保每个人都收到通知。然而，如果发生地震，发生的情况对该地区的任何人来说都是显而易见的。\n\n### 通知程序\n\n\
  通知程序可能因组织而异。然而，最重要的步骤是确保 BCP 协调员获知 BCP 涵盖的任何中断或灾害。如果在工作时间期间发生中断或灾害，BCP 协调员可能会很快到达现场。如果发生在下班后，应该找到并联系\
  \ BCP 协调员。\n\n使用某种电话树来通知团队和团队成员是常见的。例如，BCP 协调员可以通知 `EMT`、`DAT` 和 `TRT` 的小组长。小组长随后可以通知他们小组的所有成员。\n\
  \n### ![](img/Tip.png)提示\n\n在这种情况下，为 BCP 协调员配备手机是合理的支出。BCP 协调员在白天或晚上的任何时候都能被联系到，以应对重大中断或灾害。\n\
  \n### 损害评估程序\n\n`DAT` 负责评估并向 BCP 协调员报告。该小组的首要目标是尽快确定损害程度。\n\n同样，`DAT` 开始行动的时间取决于中断。如果是飓风，成员将在风暴袭击时评估建筑内部的损害。例如，他们将评估由于风暴损害造成的内部淹水和泄漏。当风暴过去、人们可以安全地外出时，`DAT`\
  \ 将评估外部损害。如果中断是即时灾害（如地震），`DAT` 成员到达现场时将立即行动。\n\n数据将传递给 `EMT` 小组长和 BCP 协调员。他们共同工作，根据所有报告确定损害程度。\n\
  \n`EMT` 小组长将对对做什么做出决定。如果关键业务可以在现场继续运行，`TRT` 将开始恢复工作。如果损害严重且关键业务无法在原地继续，业务可能需要转移到替代地点。\n\
  \n### 计划激活\n\nBCP 协调员负责激活 BCP，但是根据预定义的标准进行的。也就是说，BCP 协调员不会仅仅根据直觉做决定。\n\n例如，以下项目是激活\
  \ BCP 的有效理由：\n\n*   人员安全\n*   影响关键业务的建筑损坏\n*   影响一个或多个关键业务的业务中断\n*   BCP 中规定的特定标准，例如飓风预警或地震\n\
  \n计划激活时的具体职责包括：\n\n\n\n\n\n- **BCP 协调员**—`BCP coordinator` 在启动计划后的主要职责是确保每个人（包括参与该计划的任何人）都知计划已启动。`BCP\
  \ 协调员` 将通知团队负责人。协调员的职责还包括通知高级管理人员，例如 `CEO` 或 `CIO`。\n- **EMT 负责人**—`EMT lead` 协调\
  \ `EMT` 的行动。团队负责人还会与 `DAT 负责人`以及 `BCP 协调员` 紧密合作。\n- **EMT**—`EMT` 在 `EMT lead` 的指导下与\
  \ `DAT` 和 `TRT` 工作。该团队成员还与组织外部的人员进行互动。例如，该团队的成员将与媒体交流，并确保组织尽可能呈现出一种“一切在掌握”的形象。如果组织看起来处于混乱状态，可能会失去公众信任，这将影响公司未来年的年的誉。\n\
  - **DAT 负责人**—`DAT lead` 协调 `DAT` 的行动，并与 `EMT 负责人` 以及 `BCP 协调员` 紧密合作。\n- **DAT**—`DAT`\
  \ 收集所有关于中断或灾难的信息。其目标是提供关于受损情况和损害程度的具体细节。只要可能，团队都会尝试确定现场是否可以恢复，并将其发现报告给 `DAT 负责人`。\n\
  \n### ![](img/Tip.png)提示\n\n`BCPs` 识别了备选位置，包括热备地、温备地和冷备地。\n\n如果现场在一定时间内无法恢复，可能需要转移到备选位置。`BCP\
  \ 协调员`、`EMT 负责人` 和 `DAT 负责人` 共同工作，根据可用数据确定可能的恢复方案。\n\n#### 替代评估程序\n\n在某些情况下，`DAT`\
  \ 可能无法直接评估损害。如有必要，团队可以根据现有信息进行间接评估。\n\n例如，当 2019 年`巴里飓风`袭击美国`路易斯安那`州时，许多组织不得不撤离，人员无法立即返回。然而，电视图像显示了该地区的损害程度。高管们可能没有看到自己的建筑，但他们看到了附近建筑的损坏，并知道他们短期内不会回到原建筑恢复运营。\n\
  \n#### 人员位置控制表\n\n许多组织使用通知名单。该表单识别了适当人员的姓名和联系信息。它可以用于许多不同的方式，但主要目的是在需要时联系人员。\n\n\
  例如，考虑一个由于即将到来的`飓风`而正在启动 `BCP` 的组织。员工可以使用此表单通知所有适当的人员。`BCP 协调员` 也可以使用此表单定位并与任何团队负责人交流。同样，团队负责人可以使用它来联系他们团队中的人员。格式可以像表\
  \ 13-2 所示那样简单。\n\n**表 13-2** 人员位置控制表\n\n![](img/Table13-2.png)\n\n## 恢复阶段\n\n通知和激活阶段之后的步骤是恢复阶段。这一阶段是\
  \ `TRT` 成员开始工作的时候。他们有几个目标，包括：\n\n- 将关键系统恢复临时操作\n- 修复对原始系统造成的损坏\n- 恢复原始系统的受损\n\n\
  一旦 `TRT` 完成工作，关键业务将开始运行。`TRT` 并不专注于恢复和还原所有业务，而是仅关注在 `BIA` 中识别出的 `CBFs`。\n\n`TRT`\
  \ 成员通常使用特定的 `DRPs` 来恢复单个系统。例如，`BCP` 可能会将网站和数据库服务器指定为关键系统。`DRP` 可以作为 `BCP` 的附件包含，显示如何恢复和还原这些服务。\n\
  \n#### 恢复计划\n\n恢复阶段的成功取决于事先做的恢复计划。正如某人所说，“诺亚造方舟时并没下雨”，这意味着在灾难发生时再做计划就太晚了。计划必须尽早制定。\n\
  \n恢复计划通常采用 `DRP` 格式，它将识别在事件发生后恢复和还原系统的步骤和程序。\n\n#### 恢复目标\n\n恢复目标取决于几个因素。目标可能是恢复\
  \ `CBF` 的部分功能。例如，数据库可能需要运行，以便接受一些更新和查询。然而，它可能不需要能够支持正常业务的全部负载。\n\n另一方面，恢复目标可能更加完整。例如，一个组织可能在某处提供服务。当灾难发生时，它可能需要在另一个地点恢复所有功能。\n\
  \n`TRT` 将执行工作以实现恢复目标的工作。`DRP` 指导工作，但根据恢复的深度，工作可能会分阶段进行。当业务必须迁移到另一个位置时，情况尤其如此。\n\n\
  #### 技术恢复团队负责人\n\n`TRT lead` 监督 `TRT` 的工作。该负责人需要非常熟悉现有的 `DRPs`，甚至可能编写了这些计划。负责人还会向\
  \ `EMT 负责人` 和 `BCP 协调员` 通知进展。\n\n#### 技术恢复团队\n\n`TRT` 执行工作。工作范围取决于损害程度以及业务是否迁移。例如，`飓风`可能导致机房受潮。现场人员可能通过在水到达之前切断电源并移动服务器来限制损害，这可能使恢复变得只需清理水渍并将服务器移回并启动。\n\
  \n另一方面，`地震` 可能破坏了建筑并将服务器埋在碎石下，这使得恢复变得非常复杂。`TRT` 成员必须在备选地点恢复服务器，这意味着他们需要获取异地备份并将其送到备选地点，之后需要在那里恢复并配置数据。\n\
  \n`TRT` 的成功通常取决于它在 `DRP` 上所做的准备。理想情况下，适当的人员测试了 `DRP` 并保持其更新。如果不是，`TRT` 可能会遇到意想不到的问题。此外，将业务从一个位置迁移到另一个位置是一项巨大的工程，应该预见到问题。但是，如果人员从未测试过\
  \ `DRP`，可能会出现更多问题。\n\n#### 重组阶段（恢复正常运营）\n\n最后一个阶段是重组阶段，即关键和非关键功能都恢复正常运行。这一阶段在发生两种情况之一时开始：\n\
  \n- 原地点的损坏已修复。\n- 管理层决定将业务永久迁移到备选地点。\n\n##### 原始站点或新地点的恢复\n\n\n\n\n如果原地点的损害非常严重，管理层可能会决定迁移业务，这一决定将涉及许多因素。例如，一场火灾损毁了公司的主大楼。作为回应，`TRT`\
  \ 在区域办事处恢复了关键业务运营。随后，`DAT` 确定火灾损坏非常严重，公司需要重建原大楼。现在，管理层必须决定将这些业务搬到何处。\n\n尽管关键业务已经在备用地点，但它们可能无法支持非关键业务。管理层可能会决定将所有业务迁移到新站点并在那里恢复。另一方面，损害也可能只是微小的，那么关键业务将需要从备用地迁回原地。无论何种情况，`TRT`\
  \ 都将执行主要工作，因为他们对 `DRPs` 以及恢复功能所需的步骤最为熟悉。\n\n## 并发处理\n\n并发处理意味着业务同时在两个不同的地点运行。例如，某中断导致业务迁移到备用地点，之后系统将在原地重建。在这种情况下，许多专家建议在两个地点同时运行三到五天，以确保在原地系统运行正常后，再关闭备用地的业务。\n\
  \n### ![](img/Note.png)注意\n\n并非所有系统都支持并发处理。其中某些系统可能面临技术挑战，导致无法同时两个系统。\n\n## 计划停用\n\
  \n在此阶段仍需考虑几件事情。首先，仅仅让原站点恢复运营并不意味着一切都已恢复正常。例如，如果业务曾迁移到备用地点，那么该地点需要进行清理。\n\n该地点可能已经备齐了所有设备，但如果没有，可能已经有多台服务器、路由器和交换机被运往那里。现在，目标是让备用地点恢复到中断前的状态，甚至更好。\n\
  \n另一个重要的考虑因素是数据。有时，在重大灾难之后，管理层决定将一些硬件留存在备用地点。然而，如果这些系统上留有数据，就会产生不必要的风险，因为任何能够物理访问备用地点的人都可以检索数据。\n\
  \n同样，`TRT` 将负责完成这些步骤。在 `BCP` 中包含清单是有价值的，可以确保不遗漏任何关键事项。一旦一切恢复正常，就可以停用 `BCP`。\n\n\
  ## 计划培训、测试与演练\n\n虽然创建 `BCP` 是巨大的一步，但仅创建它是不够的。需要采取步骤向人员介绍该计划。计划还需要进行测试，并需要进行证明其可行的演练。这些步骤的总体目标是：\n\
  \n* `培训`——教导人员关于 `BCP` 的细节\n* `测试`——验证 `BCP` 是否能按计划运行\n* `演练`——演示 `BCP` 将如何运作\n\n\
  ### BCP 培训\n\n`BCP` 协调员负责确保所有人员接受培训，其中最重要的是团队成员。他们应该很好地理解在 `BCP` 激活时自己的实际职责是什么。\n\
  \n每个 `BCP` 团队都有不同的职责，但并非所有团队都需要同时对其所有职责进行培训。可以按照以下方式举行多场培训课程：\n\n* `针对所有团队的培训`——这种培训让每个人对计划有一个整体概念，并了解每个团队如何为成功做出贡献。\n\
  * `EMT 培训`——这种培训针对 `EMT` 成员，识别他们的特定职责。\n* `DAT 培训`——这种培训针对 `DAT` 成员。它强调了评估的重要性，并确定了使用的工具或清单。\n\
  * `TRT 培训`——这种培训针对 `TRT` 成员。它对每份灾难恢复计划进行了回顾。\n\n培训应至少每年一次，除非 `BCP` 或系统发生变化，在这种情况下需要更频繁地进行培训。例如，如果\
  \ `BCP` 中的关键系统被替换，则需要修改 `BCP`。领域专家会更新 `DRP`，如果发生了更改，`TRT` 成员随后将需要接受新 `DRP` 的培训。\n\
  \n### ![](img/Tip.png)提示\n\n由于团队负责人需要相互互动，他们所有人都应该参加所有的团队培训。例如，`DAT` 负责人不仅应该参加 `DAT`\
  \ 培训，还要参加 `EMT` 和 `TRT` 培训。\n\n### BCP 测试\n\nBCP 测试应至少每年完成一次。测试的目标是证明 `BCP` 中的步骤是可行的，并为团队成员提供一个熟悉计划步骤的机会。\n\
  \n测试可能包括以下步骤：\n\n* `对 BCP 每个阶段中的步骤进行测试`——这种测试需要对 `BCP` 进行逐行审查。某些程序（如执行召回）只能通过检索召回名单并拨打名单上的电话来测试。\n\
  * `测试所有灾难恢复计划`——这种测试确保 `DRP` 中的步骤能够按照文字执行。例如，`DRP` 可能确定了重建和恢复数据库服务器的步骤。管理员将在离线系统上遵循\
  \ `DRP` 以确定步骤是否成功。\n* `定位并测试备用资源`——如果计划确定了备用地点或资源，则需要对它们进行测试。例如，如果计划确定了备用地点，测试该地点以查看其是否能够支持\
  \ `CBFs`。\n\n测试应该发现计划中的任何问题或缺陷，包括步骤、资源或人员的任何问题，并应尽快解决。\n\n### BCP 测试演练\n\nBCP 演练的主要目的是展示\
  \ `BCP` 如何运作。这些演练应该具有挑战性但现实，并且应该提出可以解决的问题。\n\n除了测试 `BCP` 的能力外，演练还将建立参与者的信心。如果发生紧急情况，人们将回想起演练。如果一切都失败了，他们在紧急情况下对该计划将感到没有信心，甚至在紧急情况下可能会放弃或尝试绕过它。\n\
  \n许多组织采用阶段方法来演练计划。他们一开始不是进行全规模演练，而是进行桌面推演和功能演练。\n\n### ![](img/Tip.png)提示\n\nBCP\
  \ 演练不应影响正常任务操作。任何影响操作的步骤都可以通过模拟进行。多个场景可以作为桌面推演进行。例如，一个场景可能是与天气相关的事件，如飓风。`BCP` 协调员可以识别阶段，团队负责人或成员可以通过识别他们将要做什么来响应。另一个场景可以更具紧迫性，例如半夜发生的火灾。\n\
  \n记录和评估演练是重要的，可以由不属于任何 BCP 团队的人员来完成。这种外部视角对于确保所有问题得到解决非常有价值。\n\n**桌面推演。** 桌面推演将所有成员聚集在一起讨论流程。在这样的演练中，所有团队成员坐在会议室桌旁，然后\
  \ `BCP` 协调员向他们展示一个场景。\n\n\n\n团队成员会确定他们针对该场景将采取应对措施。此时，业务连续性计划（BCP）已经编写并批准，因此理想情况下，团队成员的响应将与\
  \ BCP 的规定一致。然而，在这种情况下，参与者可能会让自己置身于实际情境并识别出不同的问题。\n\n## 功能演练\n功能演练用于评估 BCP 中的特定功能。例如，BCP\
  \ 为某些关键功能指定了备选地点。可以通过执行功能演练来恢复和找回备选地点的所有关键资源。\n\n功能演练的戏剧性较小，对资源的需求也较低。例如，只需启动召回名单就可以验证其准确性，并确定完成召回需要多长时间。\n\
  \n与桌面推演练一样，记录功能演练的结果至关重要。这由 BCP 协调员或不属于任何 BCP 团队的成员来完成。\n\n## 全要素演练\n全要素演练比桌面推演练或功能演练都更具真实性，因为它模拟了关键业务功能（CBFs）的实际中断。团队成员不是坐在桌子旁讨论他们将做什么，而是采取行动。\n\
  \n完成全要素演练需要大量资源，其中首要资源是人员。然而，全要素演练提供了团队成员如何应对实际紧急情况的最真实视角。\n\n与其他演练一样，记录结果至关重要。取决于计划的范畴，让几位外部观察者记录他们所看到的内容可能会有益，并且在演练完成后收集团队成员的反馈也是非常重要的。他们可能对\
  \ BCP 的哪些要素起作用以及如何改进 BCP 有深入的见解。\n\n随后，可以编制一份报告来记录这些数据。此时，应该解决任何发现的问题，这可能需要修改 BCP。\n\
  \n### ![](img/Note.png)注意\n测试与功能演练之间的主要区别在于，测试是在不设定时间限制的情况下完成的。团队成员可以获得提前通知进行测试，并拥有执行测试所需的所有时间。另一方面，功能演练更具即时性，因为团队成员不需要任何提前通知。完成功能演练所需的时间应该记录下来。\n\
  \n## 计划维护\nBCP 协调员负责 BCP 计划，其中包括 BCP 的审查和更新。更新 BCP 有几个具体原因，例如：\n\n* IT 基础设施的变化\n\
  * 定期更新（例如每年一次）\n* 测试或演练之后\n\n### BCP 计划修订跟踪\n对 BCP 的所有修订都必须记录。这确保了人们可以轻松判断文档是否被修改过，并拥有最新版本。许多组织使用简单的版本控制页。例如，`表\
  \ 13-3`\n\n除了在版本控制页中记录更改外，所有相关方都必须知晓这些更改。例如，如果更改直接影响应急管理团队（EMT）成员，他们应该知道这些更改是什么。\n\
  \n### 根据 IT 基础设施内部的变化更新 BCP\n当 IT 基础设施发生任何重大变化时，应审查 BCP，这在对关键系统进行任何更改后尤为如此。\n\n\
  例如，单台服务器托管了在线销售的 Web 服务器和数据库。BCP 包含了一份灾难恢复计划（DRP），以便在灾难发生时恢复此服务器。如果该系统升级为具有四个节点的\
  \ Web 集群，并带有双节点故障转移集群的后端数据库服务器，这种变化是巨大的，但原始的 BCP 和 DRP 未涵盖这一新配置。如果这些服务器被移动到备选地点，原始的\
  \ BCP 和 DRP 将无法提供太大帮助。因此，正确的做法是审查 BCP，然后升级 BCP 和 DRP 以反映这些变化。\n\n建立了变更管理的组织会让这种审查变得容易得多。BCP\
  \ 协调员可以定期审查已批准的变更请求，以确定何时发生了更改。另一个建议是在变更管理审查中包含一个检查项。例如，快速响应团队（TRT）负责人可能被要求验证更改是否会影响\
  \ BCP 或任何 DRP。由于许多更改是无关痛痒，因此不需要更改 BCP。\n\n### BCP 年度更新和内容刷新\nBCP 协调员负责至少每年审查一次 BCP，即使没有已知的更改。这种审查确保\
  \ BCP 仍然处理并满足组织的所有要求。它包括对业务影响分析（BIA）的审查，以确保 CBFs 未被修改且仍被视为关键；对运营和安全要求的审查；以及对任何单个流程（如召回）和更技术性的程序（如\
  \ DRP）的审查。\n\n审查过程可以与重写过程分开。例如，可以指派 TRT 成员审查作为 BCP 附件的特定 DRP。审查可能会发现系统变化已导致 DRP\
  \ 过时。TRT 成员应将审查结果报告给 BCP 协调员。\n\nBCP 协调员应根据结果报告结果，然后让 TRT 负责人更新 DRP。此外，在更改完成后应通知所有影响人员。例如，由\
  \ TRT 负责人或 BCP 协调员通知此类更改。\n\n### BCP 测试\nBCP 的审查还应包括对培训、测试和演练信息的审查。在这些活动中可以学习到许多有价值的信息，例如确定\
  \ BCP 中的某些程序有效，而其他需要改进。理想情况下，在活动报告完成后立即更新 BCP。然而，对这些报告的审查也可以包含在 BCP 年度审查中，以确保培训、测试和演练中发现的所有问题都得到解决。\n\
  \n\n\n缺乏业务连续性计划（BCP）曾导致严重损失导致整个公司的倒闭。安德鲁·海尔斯（Andrew Hiles）在《业务连续性管理权威手册》中写道，60%\
  \ 到 90% 失去关键设施但没有 BCP 的公司在 24 个月内完全倒闭。BCP 就像保险，公司总是希望拥有它，但却从不想使用它。\n\n## 组织实施 BCP\
  \ 的最佳实践\n\n在实施 BCP 时，可以使用若干最佳实践。以下是其中许多项：\n\n*   **尽早完成 BIA**——`BIA` 应该在 BCP 流程的早期完成。没有\
  \ `BIA`，没有人知道哪些系统是关键的，或者应该按什么优先级来恢复系统。\n*   **从备选位置恢复功能时要谨慎**——在将功能从备选位置恢复到主位置时，应考虑这些最佳实践：\n\
  \    *   **优先恢复非关键功能**——这允许在不影响关键功能的情况下消除流程中的错误。\n    *   **在发生中断后使用并行处理**——如果系统已在主位置重建，则在中断备选位置的服务之前，它们应运行三到五天。\n\
  *   **定期审查和更新 BCP**——`BCP coordinator` 应至少每年审查和更新一次 BCP。如果在年度审查之间关键系统发生了更改或修改，应在发生这些更改或修改时审查\
  \ BCP。\n*   **测试计划的所有各个组成部分**——这种测试包括基础程序（如召回）以及记录在 `DRPs` 中更详细的程序。\n*   **演练计划**——应通过执行测试演练来验证计划有效。这些演练不应影响正常运营。\n\
  \n## 章节总结\n\n本章涵盖了 BCP 的细节。BCP 的主要目的是确保组织在中断或灾难后能够继续运营。BCP 包含了关于 `CBFs` 的细节，包括为了保持其运行需要做什么。许多个人和团队共同承担着责任。`BCP\
  \ program manager` 监督所有的 BCP，而 `BCP coordinator` 管理一个或多个 BCP。具有独立团队负责人的多个团队，在 BCP\
  \ 的开发和实施期间也为 `BCP coordinator` 提供支持。\n\nBCP 有三个主要阶段。在通知和激活阶段，由`BCP coordinator`\
  \ 发起活动；在恢复阶段，恢复并还原关键系统；在重建阶段，当灾难过去后恢复正常运营。所有 BCP 团队成员和负责人都应接受有关 BCP 的培训，并对其进行测试和演练，以确保其完整性。`BCP\
  \ coordinator` 负责定期更新 BCP，包括定期更新以及在需要时的额外更新。\n\n### 核心概念和术语\n\n*   `Damage assessment\
  \ team (DAT)`\n*   `Emergency management team (EMT)`\n*   `Mission critical`（任务关键）\n\
  *   `Technical recovery team (TRT)`\n\n## 第 13 章评估\n\n1.  一个（A(n)）`\\_\\_\\_\\_\\\
  _\\_\\_` 是一项帮助组织在中断或灾难期间及之后继续运营的计划。\n2.  业务连续性和灾难恢复是同一件事。\n    1. 正确\n    2. 错误\n\
  3.  BCP 包含了特定的地点、系统、员工和供应商，这些要求在 `\\_\\_\\_\\_\\_\\_\\_` 声明中确定。\n4.  BCP 的目的是什么？\n\
  \    1. 识别 `CBFs`\n    2. 减少或消除威胁\n    3. 确保组织的任务关键元素在中断后继续运营\n    4. 以上所有\n5. \
  \ BCP 在中断或灾难期间及之后帮助保护什么？\n    1. 机密性、信息和身份验证\n    2. 认证、身份和授权\n    3. 任务关键型和非任务关键的\
  \ `CBFs`\n    4. 机密性、完整性和可用性\n6.  `\\_\\_\\_\\_\\_\\_\\_` 负责宣布紧急情况并激活 BCP。\n7. \
  \ BCP 激活后，谁负责恢复？\n    1. `EMT`\n    2. `DAT`\n    3. `TRT`\n8.  BCP 激活后，谁负责评估损坏？\n\
  \    1. `BCP coordinator`\n    2. `EMT`\n    3. `DAT`\n9.  BCP 激活后，谁负责恢复和还原？\n \
  \   1. `BCP coordinator`\n    2. `EMT`\n    3. `TRT`\n10. BCP 的三个阶段是什么？\n    1.\
  \ 通知、激活和恢复\n    2. 通知、激活和重建\n    3. 恢复、更新和重建\n    4. 转移、恢复和通知\n11. 一次中断导致公司移动到备选位置。灾难已经过去，现在需要恢复正常运营。这些是指？\n\
  \    1. `CBFs`\n    2. 大多数 `CBFs`\n    3. 非任务关键人员\n    4. 任务关键人员\n12. 一次中断导致公司移动到备选位置。灾难已经过去，现在需要恢复正常运营。应该做什么？\n\
  \    1. 测试服务器。\n    2. 将服务器上线。\n    3. 与服务器并行运行。\n    4. 让服务器运行三到五天。\n13. 做什么可以证明\
  \ BCP 有效？\n    1. BCP 计划\n    2. BCP 培训\n    3. BCP 测试\n    4. BCP 演练\n14. 哪些类型的演练可以展示\
  \ BCP 的运行？（选择三项。）\n    1. 桌面演练\n    2. 功能性演练\n    3. 拔插头演练\n    4. 全规模演练\n15. BCP\
  \ 开发后，应定期（例如每年）进行审查和更新。\n    1. 正确\n    2. 错误\n\n\n\n## 灾难恢复计划 (DRP) 的需求\n\n每个拥有任务的组织都需要为灾难做好计划。如果支持任务的运营停止了，业务就会停止。除非一个组织可以在一段时间内不需要关键系统，否则它就需要\
  \ `DRP`。\n\n为灾难做好计划的时间是在灾难发生之前，而不是期间。一旦灾难发生，再确定哪些系统是关键的、哪些关键系统比其他系统更重要，以及恢复这些系统的最佳方法就太晚了。\n\
  \n然而，如果 `BCP` 识别了关键系统，并且 `DRP` 提供了恢复这些系统的详细信息，该组织就准备好了。没有 `DRP`，组织可能无法恢复。\n\n##\
  \ 灾难恢复计划 (DRP) 的目的\n\n大多数 `DRPs` 都包含目的声明，以帮助识别 `DRP` 的目标，这些目标通常是多个。这些：\n\n- 拯救生命——人员的安全始终是最重要的。\n\
  - **确保业务连续性**——当灾难发生时，`DRP` 包含了恢复 `CBFs` 的程序。\n- **灾难后恢复**——`DRP` 处理了在灾难过去后恢复组织的过程。\n\
  \n`DRPs` 通常被划分以反映灾难的不同阶段。一个阶段识别了在灾难发生时立即恢复 `CBFs` 的步骤和程序，这可能包括 `CBFs` 转移到备用位置。另一个阶段识别了恢复运营的程序。该阶段将运营返回原始位置。单一\
  \ `DRP` 可以涵盖每个阶段。\n\n\n\n\n灾难恢复计划（DRP）的成功取决于几个关键成功因素（CSFs）。CSF 是计划成功所必需的要素。例如，任何组织都有几个必须取得成功才能确保组织成功的\
  \ CSFs。同样，DRP 也有其 CSFs。如果 DRP 中没有包含这些因素，其成功的概率就会降低。\n\n对 DRP 成功至关重要的要素包括：\n\n* 管理支持\n\
  * DRP 开发人员的知识和权限\n* 识别主要关注点，例如 RTO 和备选位置的需求\n* 灾难恢复预算\n\n接下来的章节将深入探讨这些灾难恢复计划的 CSFs。\n\
  \n## 管理必须提供什么\n\n与风险管理和安全计划一样，DRP 需要管理的支持。某些支持可能仅仅是公开认可该计划，而另一些支持可能更具实质性，例如提供资金。\n\
  \n管理的支持不能保证 DRP 的成功，因为其他要素也是必要的，但如果没有管理层的支持，DRP 可能会失败。如果管理层不支持 DRP，组织内的其他人也不会支持它。\n\
  \n### 资源\n\n管理层提供的主要资源是人员，他们被用于创建、测试和更新 DRP。他们可以是内部员工，也可以是精通灾难恢复的外部顾问。\n\n管理层的财务支持也是必要的。例如，如果公司需要一个备选位置，只有在资金支持下才能获得。如果需要备份，则需要资金购买备份带或其他备份介质。\n\
  \n### 领导力\n\n管理层还必须提供领导力来支持任何 DRP。领导者理解 DRP 的重要性，并知道只有通过团队合作才能实现成功。领导者帮助灾难恢复和业务连续性团队识别\
  \ DRP 的价值。\n\n![](img/Tip.png)提示\n\n做老板和做领导不是一回事。老板拥有权威地位，并指示人们完成任务。人们为老板完成任务是因为他们被要求这样做。相反，领导者影响他人以实现共同目标并在表现上追求卓越。领导者拥有或至少理解整体愿景，并帮助他人看到如何为成功做出贡献。人们为领导者完成任务是因为他们与领导者共享愿景。管理层帮助团队识别项目优先级，或\
  \ MBCO（最小业务连续目标）。例如，如果一个 DRP 包含了几个 DRP，管理层会帮助识别哪些比其他更重要，换句话说，就是 MBCO。如果一个单一 DRP\
  \ 有几个目标，管理层可以帮助作者识别 DRP 内部的优先级。更多的资源将分配给 DRP 中优先级最高的。\n\n管理层还必须以身作则。如果管理层希望其他人支持\
  \ DRP 的要求，他们就必须支持 DRP。如果管理层希望其他人为 DRP 投入时间和关注，那么运营层级的经理在需要时必须对其投入自己的时间和关注。\n\n这一切都转化为支持。当管理层支持灾难恢复团队的努力时，整个灾难恢复过程成功的机会更大。\n\
  \n## DRP 开发人员需要什么\n\nDRP 的开发人员需要某些特定的知识和权限才能成功。任何系统领域专家（SME）不能仅仅被指派任务并被期望能够写出 DRP。某些灾难恢复专家也不应被期望能够写出\
  \ DRP。\n\n相反，需要具备综合技能的人员。DRP 开发人员需要了解灾难恢复以及组织是如何运作的。他们通常可以与各个 SME 合作，确定系统的特定步骤。\n\
  \n### 灾难恢复知识\n\nDRP 团队必须理解通用的灾难恢复，特别是了解什么是 BIA（业务影响分析）、什么是 BCP（业务连续计划），以及 DRP 如何与\
  \ BIA 和 BCP 相结合。\n\n提醒一下，BIA 识别关键系统并对其进行优先级排序。BCP 包含了 BIA 和 DRP。DRP 提供恢复特定系统的详细信息。某些\
  \ DRP 在中断后立即处理关键业务功能（CBFs）的系统恢复。另一些 DRP 则在灾难发生后处理所有业务功能的系统恢复。\n\nDRP 开发人员必须理解 DRP\
  \ 的目的以及它如何融入整体 BCP。如果不是这样，DRP 将缺乏重点。不同风险管理概念（如 BIA、DRP 和 BCP）之间的关系如图**图 14-1**所示。\n\
  \n![图 14-1 风险管理：BIA、DRP 和 BCP。](img/978128413719_)\n\n### 组织运作方式的知识\n\n了解组织如何运作对于撰写\
  \ DRP 至关重要。例如，军事基地的 DRP 将与小企业大不相同。军事基地需要每天 24 小时、每周 7 天的支持，而小企业可能只需要在周一至周五的 9:00\
  \ 到 5:00 支持。\n\n![](img/Tip.png)提示\n\n许多公司聘请外部顾问帮助开发 DRP 和 BCP。这些顾问可以与管理层和 SME 合作，确保\
  \ DRP 满足组织的需求。\n\n除了营业时间，任何组织都有 DRP 开发人员需要理解的流程。\n\n例如，一个组织可能同时配备了不间断电源（UPS）和发电机。即使在失去市电的情况下，这些设备也能为关键系统提供持续电源。DRP\
  \ 可能包含相关步骤，以确保在灾难发生时燃料储备维持足够的时间。\n\n另一个组织可能对某些 CBFs 使用云计算，例如数据服务。如果是这样，将会有服务水平协议（SLA）确保第三方供应商保持这些服务的运行，因此\
  \ DRP 无需处理这些服务。\n\n### 权限\n\nDRP 开发人员在创建 DRP 时需要一些权限。例如，DRP 开发人员在撰写 DRP 之前需要收集数据。如果开发人员不是\
  \ SME，这一点尤为如此。为了成功，DRP 开发人员需要权限来采访了解系统的专家。\n\n如果 DRP 跨越了部门边界，DRP 作者需要做出影响多个部门的决策。考虑到这一点，DRP\
  \ 作者需要管理的支持来做出初始决策。\n\n## 主要关注点\n\nDRP 应该处理几个主要关注点，DRP 开发人员在撰写 DRP 之前应对这些点有明确的想法。一个重要的关注点是\
  \ RTO，它识别了 DRP 的关键性。\n\n### 恢复目标\n\nRTO 识别了系统必须恢复的时间，它源自 BIA 中识别的 MAO（最大允许中断）。超过\
  \ MAO 的故障将对组织产生产生负面影响，这意味着如果故障没有在 RTO 内解决，将将影响任务。\n\n\n\n\n\n`MAO` 可能是 60 分钟、24\
  \ 小时或其他其他时间。然而，这个数字决定了 `RTO`。例如，如果 `MAO` 为 60 分钟，则编写 `DRP` 时需要能够满足少于 60 分钟的 `RTO`。如果\
  \ `MAO` 为 24 小时，则 `RTO` 需要少于 24 小时。\n\n了解这些信息有助于强调 `BIA` 的重要性。如果在开发 `BIA` 之前就开始编写\
  \ `DRP`，则需要采取额外的步骤。如果没有 `BIA`，`MAO` 将无法未知，也无法确定正确的 `RTO`。相反，需要采取额外的步骤来确定 `MAO`，然后确定\
  \ `RTO` 并编写 `DRP`。\n\n## 异地数据存储、备份与恢复\n\n对关键数据进行备份是任何恢复计划中不可或缺的一部分，因为数据不可避免会丢失。如果数据无法恢复，结果对组织来说可能是灾难性的。\n\
  \n备份计划通常作为 `DRP` 的一部分，并源于备份策略。备份策略确定了细节，例如哪些数据应该被备份以及备份数据应该保留多久。备份计划则确定了备份和恢复数据的具体步骤。\n\
  \n## 恢复中的恐怖故事\n\n备份数据的目标是为了能够恢复它，因此显而易见的是，备份中的数据应该是可恢复的。但情况并非总是如此，正如层出不断的关于无法恢复备份的恐怖故事所所示。只有当组织需要恢复丢失或损坏的数据时，技术人员才发现备份已损坏且数据无法恢复。\n\
  \n一家组织要求对关键数据库进行每日备份。这些备份被安排在深夜进行，每天早上，技术人员取出存放备份的磁带并插入新的磁带。然后，他们对备份磁带进行标记并存储。\n\
  \n接着，不可避免的事情发生了，数据库损坏了。技术人员认为恢复数据没有问题，因为他们有备份。他们取回备份磁带，却发现过去一个多月来，大部分备份都没有成功，因为新磁带与备份系统不兼容。这些新磁带虽然被轮换到了系统中，但没有一次备份成功过。最终，技术人员找到一条好的磁带，并恢复了数据库的大部分。遗憾的是，许多数据已经丢失了——永远丢失了。\n\
  \n这种常见问题可以通过执行测试恢复来轻松避免，测试恢复是一个尝试从最近的备份恢复数据的过程。如果测试成功，说明备份是好的；如果失败，则需要处理备份过程。许多备份计划都包含了测试恢复的细节和调度安排。\n\
  \n备份主要关注数据。然而，在某些情况下，程序可能需要被备份。例如，如果该组织开发应用程序，那么它们的备份必须可用。自然地，源代码应该保持安全，但也需要对这些源代码进行备份。\n\
  \n备份的另一个关键要素是确保备份的副本存储在异地。并不是所有的备份都应该存储在与服务器相同的地点。如果火灾摧毁了建筑，就会摧毁服务器和所有备份；而如果备份副本存储在另一个地点，它们始终可以被用于恢复数据。\n\
  \n## 备用地点\n\n许多公司需要确保即使发生中断中断，其业务也能继续运行。例如，在加利福尼亚圣安德烈斯断层附近工作的企业面临着几乎持续不断的地震威胁。如果发生地震，业务可能无法在原地点运行。\n\
  \n如果组织在发生重大事件时必须继续运营，则需要确定一个或多个备用地点。这些地点可以是不同的建筑、不同的城市甚至不同的州，取决于要为何种类型的灾害做准备。例如，如果火灾摧毁了建筑，同一城市的备用地点即可；但如果是为了地震做准备，则需要另一个州的备用地点。\n\
  \n有四种类型的替代地点：冷备、温备、热备和移动。每个站点必须具备托管关键数据和程序的能力。然而，每个站点的成本和初始能力也不同。作为介绍，表 14-1 提供了冷备、温备、热备和移动能力的概述。\n\
  \n### 提示\n\n有多种从一个服务器向另一个复制数据的方法。可以创建镜像服务器，两者都可以在线；可以创建备用服务器，一个在线而另一个离线；还可以创建带有发布者和订阅者的复杂复制模型。\n\
  \n*   **电子金库**：这种方法将数据传输到异地。\n*   **远程日志**：这种方法从远程站点开始完整副本。\n\n### 冷备\n\n`冷备`是一个可用建筑，拥有电力、自来水和厕所，但没有任何关键运营所需的设备、数据或应用程序。如果需要支持服务器环境，它可能配备架空地板。\n\
  \n例如，一个组织可以租用另一个建筑的空间来应对重大灾难。如果发生灾难，他们会将设备和数据移动到该地点并在那里设置 CBF。显然，移动和设置设备将花费大量工作。\n\
  \n冷备的维护成本很低，因为它们只是空建筑。然而，测试冷备是非常困难且昂贵的。\n\n### 注意\n\n在租用另一个建筑的空间作为冷备时，必须确保该空间没有被租给他人。例如，某些企业会将可用空间租给多个组织。当灾难发生时，多个组织可能会尝试进入同一个空间。\n\
  \n\n\n\n\n# 热备地 (Hot Site)\n\n热备地包含了接管业务功能所需的所有设备和数据。热备地能够在几小时内（有时甚至是几分钟内）承担运营。该地点通常配备\
  \ 24 小时、7 天候的人员。\n\n热备地的维护成本高昂。然而，一些新技术使得它们的管理变得稍微容易了一些。云计算计算和虚拟化是有时与热备地一起使用的两种新技术。云计算计算是一个通用术语，指任何涉及通过公共网络（如互联网）托管服务的活动。\n\
  \n## 贴士\n![](img/Tip.png)\n组织通常与第三方供应商签订合同，通过云计算提供服务。组织不需要亲自管理这些服务；而是与提供服务的供应商签署一份\
  \ `SLA`（服务水平协议）。\n\n如`图 14-3`\n\n**图 14-3** 云计算。\n\n这对于热备地非常有用。例如，如果关键业务需要从区域办公室而不是总部进行管理，那么迁移几乎是可以无缝完成的。两个地点都已接入关键服务。唯一可能需要移动到区域办公室的是人员。\n\
  \n虚拟化是另一种对热备地非常有用的技术。在单个物理服务器的网络上可以托管多个虚拟服务器。每个虚拟服务器在网络上的运行方式就像物理服务器一样。\n\n## 通过云计算提供的考勤服务\n\
  许多组织已转向使用云计算来跟踪员工的工作时长。一个基于互联网的 Web 服务器托管考勤应用程序，员工使用 Web 浏览器登录并记录工时。\n\n这些服务中的某些项允许员工记录任何特定日的工小时数，而另一些则要求员工在上班时登录并“打卡”。在离开之前，员工登录并“下卡”。这些网站通常配置为仅允许从员工所在地访问，这防止了员工在家里打卡下卡。\n\
  \n在薪资周期结束时，主管会批准工时，然后将数据移交给财务部门处理工资单。\n\n考勤服务显著减少了组织在管理工资单方面花费的时间，而且由于这是提供服务的公司的主要功能，它能够高效且廉价地完成。\n\
  \n在`图 14-4`\n\n**图 14-4** 托管四个虚拟服务器的单个物理服务器。\n\n一旦创建了虚拟服务器，就可以轻松地从一个物理服务器移动到另一个物理服务器。虚拟服务器由存储在物理服务器上一组文件组成。诚然，这些文件非常大。但是，可以关闭虚拟服务器，将文件复制到另一台物理服务器，并在那里启动虚拟服务器。\n\
  \n如果带宽足够，虚拟服务器文件可以通过 WAN 链路传输。如果没有，大容量的通用串行总（`USB`）驱动器也是一种选择。只需将虚拟服务器文件复制到 `USB`\
  \ 驱动器，插入新的物理服务器，并将文件复制到物理服务器。复制这些文件的过程取决于虚拟化软件。例如，在微软的 `Hyper-V` 中，文件从原始服务器导出，然后导入到新服务器。\n\
  \n虚拟服务器还需要更少的设施支持。如果在一个物理服务器上托管四台服务器，那么所需的物理空间就比五台服务器少得多。此外，这台单一物理服务器消耗的电量比五台物理服务器少，对空调的需求也更小。\n\
  \n## 温备地 (Warm Site)\n\n温备地是冷备地和热备地之间的折中方案。它包含了大部分或全部所需的设备，但数据通常不保持最新。设备处于运行状态。如果发生灾难，将用当前数据更新系统并将其上线。\n\
  \n温备地通常是用于非关键业务功能的完全运行站点。当灾难发生时，非关键功能停止，该站点将用于关键业务功能。\n\n温备地的主要优点之一是管理层能够将预期成本与可接受的停机时间相匹配，这意味着如果较长的\
  \ `MAO`（最大允许中断）是可以接受的，管理层就可以平衡成本，以匹配温备地上线所需的时间。\n\n## 移动备地 (Mobile Site)\n\n移动备地可以设置在受灾地附近的外部空间。移动备地的优点之一是它可以在\
  \ 36 到 72 小时内部署。然而，它也有一些缺点。恢复时间通常比热备地长，访问受灾设施困难，且移动设备是一个挑战。\n\n## 冗余备份地 (Redundant\
  \ Backup Site)\n\n另一种选项是外包数据恢复地。公司不再维护替代地点，而是与第三方供应商签订合同，在冗余备份地托管其数据和服务。如果发生灾难，关键服务可以切换到备用地，这通常对运营的影响很小。\n\
  \n## 用户访问\n\n如果业务迁移到备用地，用户必须能够访问数据和服务。在这种情况下，他们访问所需的条件取决于他们如何使用数据和服务。\n\n如果用户通过互联网访问服务，那么备用地必须包含所需带宽的互联网访问。然而，用户可能通常在内部或通过私有\
  \ WAN 链路访问服务。如果是如此，那么备用地必须具备将数据传输给用户的能力，这可能需要额外的 WAN 链路。\n\n## 管理访问\n\n在灾难期间，管理层可能也需要访问数据和服务，在许多情况下，管理层只是另一个用户。如果用户可以访问，那么管理层也可以访问。\n\
  \n\n\n\n\n## 客户访问\n\n客户必须拥有他们所需的访问权限。客户访问需求因组织而异，取决于客户通常如何访问组织的网络，以及在灾难期间客户的预期。\n\
  \n例如，对于一家本地银行，大多数银业务可以在银行网点完成。然而，如今有越来越多的客户使用在线银行。如果发生灾难，客户可以使用在线站点满足许多银行业务。灾难恢复计划（DRP）应确保即使重大中断影响了银行的物理位置，银行的网站也能继续运行。\n\
  \n如今，许多机构都有网站，并且其中大多数机构将其网站托管外包，这意味着网站并未托管在组织所在地的服务器上。相反，组织租用网络服务器上的空间，由托管提供商负责托管网站。在这个示例中，托管提供商负责灾难恢复。\n\
  \n然而，这并不意味着不应该考虑网站。如果灾难影响了网站托管提供商怎么办？这种情况将如何影响该组织？低成本托管提供商通常没有完善的灾难恢复流程，且小型或重大中断经常导致网站宕机。\n\
  \n## 灾难恢复财务预算\n\n考虑 DRP 的最后一个因素（CSF）是金钱。没有预算，DRP 就无法成功开发和实施，因为在灾难发生时，需要资金支付准备和执行\
  \ DRP。\n\n在准备应对灾难时，有几种成本需要考虑。这些包括：\n\n* **备份**——尽管大多数操作系统都包含备份软件，但它们通常只包含基础功能。大多数组织会购买更易用、功能更强大的第三方备份软件。此外，备份媒体（如多条备份磁带）可能昂贵。当需要备份大量数据时，成本会增加。\n\
  * **备用地点**——任何类型的备用地点都需要额外费用。如前所述，热地（hot sites）最贵，而冷地（cold sites）最便宜。场地的选择取决于多个因素，包括可用。\n\
  * **灾难期间的燃料成本**——如果组织需要长时间发电，必须为发电机购买燃料。业务连续计划（BCP）识别了假设，例如关键业务在没有外部支持（如商业电力）的情况下需要运行多久。这些信息有助于决定购买多少燃料。\n\
  * **灾难期间的食物和水**——如果人员在灾难期间需要支持系统，他们需要食物和水。所需的数量取决于所在地的人数以及预计停留的天数。\n* **灾难发生后的应急资金**——灾难发生后通常需要资金应对不可预见的情况。如果需要，预算应包含这些费用的资金。此外，这些资金在灾难发生时应该是可用的。\n\
  \n除了建立预算，还需要确定可以释放资金的人员，对于灾难期间和之后立即所需的资金尤为如此。这些人员可以在 DRP 或 BCP 中确定。\n\n## DRP 的要素\n\
  \n没有特定的规定规定 DRP 中必须包含的内容。根据公司的需求添加或删除章节和元素。然而，通常包含许多元素。这些是：\n\n* 目的\n* 范围\n* 灾难/紧急情况宣布\n\
  * 通信\n* 应急响应\n* 活动\n* 恢复程序\n* 关键业务、客户服务和业务恢复\n* 恢复与规范化\n\n## 灾难恢复（DR）规划的八个 R\n\n\
  一些 DR 专家列出了恢复规划的八个 R，它们为恢复规划过程提供了一个良好的概述。八个 R 是：\n\n* **规划理由（Reason for planning）**——范围和目的章节说明了\
  \ DR、人员安全以及关键业务功能（CBFs）的原因。\n* **识别（Recognition）**——当灾难被识别时，即被“宣布”。通知人员并做出启动计划的决定。\n\
  * **反应（Reaction）**——管理层和 DR 人员通过评估损坏并决定下一步采取的步骤来应对紧急情况。\n* **恢复（Recovery）**——DR\
  \ 人员按照程序恢复关键系统。如有必要，他们会激活备用地点。\n* **还原（Restoration）**——DR 人员将 CBFs 恢复到完全运行，这可能包括设施资源的恢复（如电力）、连接的恢复（如局域网\
  \ LAN 和 广域网 WAN 连接）以及支持 CBFs 的系统。\n* **恢复正常（Return to normal）**——灾难过去后，DR 人员将系统恢复到正常运行，这可能包括从发电机切换回商业电力，并将功能从备用地点移回主地点。\n\
  * **休息与放松（Rest and relax）**——DRP 响应人员在事件发生后需要休息时间，并对他们帮助组织度过灾难表示感谢。\n* **重新评估与重新撰写文档（Reevaluate\
  \ and redocument）**——识别做得好的地方和可以改进的地方。记录任何经验教训。审查计划中的任何弱点或缺陷。使用这些数据更新计划。\n\nDRP\
  \ 还应该进行测试和维护。测试验证了程序的有效性。此外，应该定期审查和更新 DRP，以确保其保持时效性。以下章节将更深入地探讨这些要素。\n\n## 目的\n\n\
  DRP 从一个识别其目的的简单声明开始。DRP 通常是为了支持某个功能、服务或系统而编写的。一个 DRP 可能是为了在灾难后恢复单个数据库服务器的功能。它将包括在故障后恢复数据库服务器所需的步骤。\n\
  \nDRP 也可以为了恢复多个协同工作以托管服务的服务器而编写。例如，一个网站可能由多个元素支持，这些元素包括 Web 农场中的几个 Web 服务器和故障转移集群中的几个数据库服务器。如果灾难导致网站宕机，DRP\
  \ 将包含恢复或还原所有这些元素的步骤。\n\n无论何种情况，DRP 的目的都需要在过程早期定义，，并包含在最终产品中。在定义目的时，应该考虑以下活动：\n\n\
  * **恢复（Recovery）**——服务中断后后，系统应该是可以恢复的，这包括在必要时进行完整的系统重建以及恢复所有数据。`RTO` 定义了这一过程应花费的最长时间。\n\
  * **维持业务运营（Sustaining business operations）**——CBFs 在灾难期间也需要继续运行。可以使用几种方法来确保这些 CBFs\
  \ 持续，这可能包括完全冗余的数据中心、备用地点或冗余数据站点。使用的方法应符合服务需求和可用预算。\n* **规范化（Normalization）**——一旦灾难过去，系统需要进行规范化，这意味着取决于为维持业务运营做了哪些工作。例如，如果使用了备用地点，规范化就包括将\
  \ CBFs 移回原始位置。\n\n## 范围\n\n任何项目的范围都有助于识别边界。它帮助所有方理解哪些包含在内，哪些不包含。如果没有确定的范围，心意良好的人可能会导致项目增长和扩张，这通常被称为范围蔓延（scope\
  \ creep）。\n\nDRP 的目的驱动范围。根据 DRP 的目的，可以识别应该包含的和不应该包含的元素。虽然包含的元素对某些人可能是显而易见的，但它们仍然需要在\
  \ DRP 中确定。\n\n\n\n\n\n在制定范围时，应考虑以下领域：\n\n*   **硬件**——硬件包括支持它们的服务器和网络设备。备用服务器和办公设备或备用零件应在现场或其他地点可用。\n\
  *   **软件**——所有支持 CBFs 的软件都应被考虑，包括操作系统和应用程序。许多组织使用镜像 `image` 操作系统、设置和其他文件。当系统崩溃时，IT\
  \ 人可以使用此镜像快速恢复服务器操作。\n*   **数据**——数据考量对于计划至关重要。这些考量包括 CBFs 需要的备份计划。恢复点目标 (`RPOs`)\
  \ 定义了可接受的数据丢失量，这取决于数据的价值。\n*   **连接性**——服务消费者的连接性也应包含在内，可以是用户、经理和客户的互联网服务提供商 (`ISP`)\
  \ 连接或冗余 WAN 链路。\n\n### 灾难/紧急宣告\n\n当灾难发生或即将发生时，实施 `DRP`。通常首先激活 `BCP`，然后根据 `DRP` 的执行情况激活\
  \ `DRP` 以支持 `BCP`。\n\n例如，飓风正在接近。`BCP` 协调员可以在飓风提前 96 小时时激活 `BCP`。`DRP` 可能规定，当飓风提前\
  \ 48 小时时，恢复小组部署到备地点以接管操作。在这个示例中，`DRP` 不会立即与 `BCP` 。`BCP` 可能指定立即采取的其他行动，但它们独立于此 `DRP`。相反，`DRP`\
  \ 在飓风登陆前 48 小时内激活。\n\n重点是，`DRP` 应明确说明其激活的原因。激活会导致人员召回和设备移动。当需要采取这些步骤时，请执行。然而，在必要之前采取这些步骤可能会浪费资金。\n\
  \n再次考虑飓风。飓风并不总是沿直线移动。距离登陆还有 96 小时的飓风很容易转向或减弱。该地区可能只是下雨而非飓风级风，在这种情况下，`DRP` 不应激活。\n\
  \n## 通信\n\n若干通信元素对 `DRP` 的成功至关重要。这些包括：\n\n*   **召回**——`DRP` 应识别在 `DRP` 激活时应通知的所有人员。他们包括\
  \ `DRP` 内部具有任何职责的人员和高层。电话树通常作为 `BCP` 的一部分，并用于此目的。\n*   **用户**——可能需要通知用户 `DRP` 是否影响了他们。例如，关键业务可能不包含用户期望的某些常规功能。他们应被通知由于灾难哪些服务不可。这种通知可以在灾难发生前进行。随后，可以向用户发送关于这些服务的提醒。\n\
  *   **客户**——如果中断影响了客户，应通知他们。例如，关键业务可能不包含用户期望的某些常规功能。他们应被通知由于灾难哪些服务不可。这种通知可以在灾难发生前进行。随后，可以向用户发送关于这些服务的提醒。\n\
  *   **通信计划**——`DRP` 应识别在 `DRP` 激活时应通知的所有人员。他们包括 `DRP` 内部具有任何职责的人员和高层。电话树通常作为 `BCP`\
  \ 的一部分，并用于此目的。\n\n## 应急响应\n\n`DRP` 章节识别了若干需要采取的应急响应步骤。例如，应急响应步骤可能包括：\n\n*   召回和通知\n\
  *   损害评估\n*   计划激活\n*   特定步骤的实施\n\n## 活动\n\n`DRP` 识别了若干需要采取的应急响应步骤，例如召回人员和评估损害。`DRP`\
  \ 还识别了其他需要采取的活动。任何 `DRP` 的主要活动都是确保人员安全已得到解决。确保人员安全和保护生命始终处于任何 `DRP` 的首位。换句话之，明确的信息应该是\
  \ `人`优先，`物`其次。\n\n\n\n\n\n恢复程序还应考虑突发情况。例如，如果某些恢复步骤无效，恢复程序应为恢复人员提供指导。此外，程序应处理依赖关系。如果服务器需要访问互联网或另一台服务器的特定权限，程序应说明这些要求。\n\
  \n## 恢复系统\n\n恢复程序确定了在灾难后重建和恢复系统的步骤。它们通常包括从零开始恢复系统的步骤，其中包括安装操作系统和所有应用程序。如果需要数据，该计划将指定如何恢复数据。\n\
  \n例如，一个数据库服务器可能在 `Microsoft Windows Server` 操作系统上运行一个 `Oracle` 数据库。恢复程序将从安装 `Windows`\
  \ 操作系统的指令开始。安装完成后，该程序将描述如何安装 `Oracle`，最后，程序将描述如何恢复数据库。\n\n恢复计划应该明确在移动到下一个步骤之前，哪些步骤是必须完成的。换句话说，在成功安装了操作系统和应用程序之前，不应将数据恢复到服务器上。\n\
  \n### ![](img/Tip.png)TIP\n\n恢复操作在激活 `DRP` 并评估损害后开始。恢复的重点是对于恢复 IT 能力和修复损害的必要措施。目标是在原始位置或备用位置恢复关键任务能力。\n\
  \n捕获托管 `Oracle` 的服务器镜像是可能的。如果服务器崩溃，可以将镜像安装到系统上。它将包含操作系统、完全配置的 `Oracle` 应用程序以及捕获镜像时系统上的数据。IT\
  \ 人员将从最近的备份中更新数据。恢复镜像比从零开始重新安装一切要快得多。\n\n`DRP` 可以包含针对多个服务器和服务的特定恢复程序。可以为每个程序创建单独的书面文档。`DRP`\
  \ 可以引用这些程序作为单独的附录。\n\n这些程序是 `DRP` 中最重要的测试元素之一。尽管 `DRP` 中的许多步骤在本质上是通用的，但这些恢复程序通常非常有技术性。\n\
  \n### ![](img/Tip.png)TIP\n\n如果服务器已经建立了映像，可能需要定期重新捕获镜像。例如，如果操作系统或应用程序已更新或修改，原始镜像将不会包含更改。必须在进行更改后重新捕获镜像，或者必须验证在镜像恢复到服务器后更改是否已重新应用。\n\
  \n在灾难期间，最好的管理员可能不在。相反，初级技术人员可能正在恢复系统。考虑到这一点，请确保程序步骤清晰且易于遵循。\n\n## 备份计划\n\n如果需要恢复数据，必须有一个有效的备份计划。制定备份计划的首要步骤是识别关键数据。关键数据是支持\
  \ `CBFs` 的数据。此类数据可以是大型数据库或任何其他关键文件。\n\n备份计划确定了几个元素，包括：\n\n* 要备份的数据\n* 数据的备份程序\n\
  * 保留数据的时间\n* 备份类型，例如定期备份、电子库或远程日志\n* 异地存储位置，包括在灾难期间如何检索备份\n* 恢复程序和计划测试\n* 灾难恢复程序\n\
  \n`RPOs` 确定了任何数据允许的数据丢失量。因此，备份计划考虑了 `RPO`。如果 `RPO` 时间很短（例如几分钟而不是几小时几天），必须更频繁地执行备份。如果\
  \ `RPO` 时间较长，则可以减少备份的频率。\n\n例如，对于高量数据库，`RPO` 可能为 10 分钟，表示接受不超过 10 分钟的数据丢失。数据库的事务日志可以每\
  \ 10 分钟备份一次，以确保可以恢复最后 10 分钟的数据。此事务日志备份在其他数据库备份恢复后进行恢复。\n\n## 关键任务操作\n\n`DRP` 处理关键任务操作。`CBFs`\
  \ 支持这些操作，而特定的服务器和服务支持这些 `CBFs`。由于 `CBF` 是任何被认为对组织至关重要的功能，如果组织失去了执行 `CBF` 的能力，它就会失去执行关键任务操作的能力。通过处理\
  \ `CBFs`，`DRP` 有助于确保关键服务器和服务的持续运行。\n\n### ![](img/Tip.png)TIP\n\n`DRP` 确保为关键数据存在备份计划。然而，组织可能有保护组织其他数据的备份计划。\n\
  \n例如，图 14-5 显示了连接到后端数据库的 Web 集。Web 集中的 Web 服务器托管着一个在线销售产品的应用程序。在这个示例中，关键任务操作是产品销售。\n\
  \n![图 14-5 带有后端数据库的 Web 集。](img/9781284183719_CH14_FIGF05.png)\n\n**图 14-5** 带有后端数据库的\
  \ Web 集。\n\n几个 `CBFs` 支持产品销售。首先，Web 集托管 Web 应用程序。一个 `CBF` 为客户端提供网页。用户访问网站，Web 集中的一个服务器向客户端发送网页。此外，后端数据库服务器托管数据库，包括产品数据库。Web\
  \ 服务器查询数据库服务器并在网页中填充产品数据。\n\n一旦客户决定购买，另一个 `CBF` 就会发挥作用。从客户数据库中检索现有的客户数据。数据库在销售后还会存储新客户数据。一旦客户购买了产品，另一个\
  \ `CBF` 将处理支付流程。另一个 `CBF` 确保产品已发货。所有这些 `CBFs` 都支持销售这一关键任务操作。\n\n图 14-5 显示，需要几台服务器来支持其中一些\
  \ `CBFs`。具体来说，Web 集中的 Web 服务器和后端数据库服务器都需要。`DRP` 将确保将这些服务器内。\n\n### 关键操作、客户服务和操作恢复\n\
  \n`DRP` 识别关键任务操作和要支持的 `CBFs`。然而，为业务的其他元素指定步骤通常也是重要的。\n\n例如，发生灾难时客户服务活动会停止吗？或者，客户服务活动会迁移吗？如果通过电话提供客户服务，功能可能很容易地切换到另一个位置。另一方面，如果组织很少提供客户服务，它可能不会认为在灾难期间恢复足够关键。可以为客户提供简单的通知。例如，可以在组织的网页上发布通知或在电话系统中录制简短消息。\n\
  \n\n\n\n本节也可以为正常操作提供另一个视角。在准备 `DRP` 时，应该审查哪些被视为 `CBF`，哪些不是。某些操作看起来至关重要，但在审视日常活动时最初被排除在\
  \ `DRP` 之外，尽管它们确实被遗漏了。这些操作应该被添加。\n\n## 恢复与正常化\n\n一旦灾难过去，人员会将注意力转移到恢复和正常化。某些 `DRPs`\
  \ 将此称为重建阶段。`BCP` 协调员通常是宣布何时开始正常化的权威。它可能在原地点损坏修复后开始。管理层也可能根据其他考虑提早开始正常化。\n\n在此阶段，人员将所有任务关键和非任务关键的功能恢复到正常。然而，这些功能并非同时完成的。`DRP`\
  \ 规定了它们发生的顺序。\n\n在正常化阶段，可能会遇到不可预见的问题。由于这些问题，首先恢复最不关键的功能是非常，特别是当功能被迁移到另一个位置时。这样做可以确保在问题出现时，最关键的功能不受中断。\n\
  \n在某些情况下，`DRP` 可能需要并行处理。例如，当主位置的关键功能正在正常化时，恢复的系统在备用位置运行。如果问题影响了主位置，负载可以很容易移回备用位置。\n\
  \n## 测试\n\n测试 `DRPs` 非常重要，以确保它们按照预期运行。由于 `DRP` 是为了恢复 `CBFs` 而编写的，对 `DRP` 的测试不应这些\
  \ `CBFs` 的操作。测试的目标是识别 `DRP` 中的任何问题或遗漏。\n\n与 `BCP` 一样，可以使用不同的方法来测试 `DRP`。以下是常见的测试方法：\n\
  \n*   **桌面演练（Desktop exercise）**——在桌面演练中，参与者在会议室环境中聚会。参与者讨论 `DRP` 的步骤。桌面演练类似于 `BCP`\
  \ 中使用的桌推演练。\n*   **模拟（Simulation）**——模拟以受控的方式执行步骤和程序。目标是确保 `DRP` 能够按照呈现的顺序完成。模拟可以测试\
  \ `DRP` 的部分内容而不测试全部。例如，可以只恢复备用位置的数据以确保此程序有效。\n*   **全面 DRP 测试（Full-blown DRP test）**——全面的\
  \ `DRP` 测试将像实际灾难发生一样执行所有步骤和程序，有助于确定完成每个步骤和程序所需的实际时间。全面的 `DRP` 测试对操作的影响潜力最大。因此，应该计划一次全面测试，使其对操作的影响降至最低。\n\
  \n所有测试的结果都应详细记录，并包括测试期间发现的任何教训、错误或弱点。这些文档此后可用于改进 `DRP`。如果测试识别出任何缺陷，通常会更新 `DRP`。\n\
  \n测试的好处之一是它将提供准确的恢复时间范围。例如，对于数据库服务器，一位管理员可能认为技术人员可以在 30 分钟内重建并恢复它，而另一位管理员可能估计需要四个小时。实际上重建和恢复服务器将给出所需时间的准确时间。检查清单对于跟踪各个步骤的时间范围很有帮助。该清单可能看起来类似于\
  \ 表 14-2。\n\n表 14-2 恢复时间清单\n\n| 步骤 | 开始时间 | 结束时间 |\n| --- | --- | --- |\n| 定位服务器并安装操作系统\
  \ |  |  |\n| 在服务器上安装应用程序 |  |  |\n| 定位备份磁带并恢复数据 |  |  |\n| 通知 DRP 协调员完成 |  |  |\n\
  \n## 维护与 DRP 更新\n\n`DRP` 需要定期进行审查和更新。这样做可以确保它在需要时准备就绪。IT 系统经常更新和升级，这些任何变更都可能影响 `DRP`\
  \ 的可用性。\n\n大多数组织都有建立变更管理流程。这些流程确保在更改发生之前对系统更改进行审查，并记录这些更改。`DRP` 开发者应该参与此过程，以确保他们了解系统变更。当提议进行变更时，`DRP`\
  \ 开发者应审查该变更以确定它是否影响 `DRP`。\n\n`DRP` 审查应包含以下元素：\n\n*   **系统（Systems）**——验证 `DRP`\
  \ 覆盖的系统自上次审查以来未发生更改。这些更改包括可能影响系统恢复方式的重大更改。即使是较小的更改也应该调查，以确定是否影响了 `DRP`。\n*   **关键业务功能（Critical\
  \ business functions）**——验证 `DRP` 覆盖了 `CBFs` 且优先级没有改变。组织可能会发生变化，导致某些 `CBFs` 比其他更重要。\n\
  *   **备用站点（Alternate sites）**——如果 `DRP` 需要备用站点，确保指定的站点仍然支持 `DRP`，并且备用站点的更改不会不利地影响\
  \ `DRP`。如果可能，在审查 `DRP` 期间访问这些备用站点，以确定它们仍然符合公司的需求。\n*   **联系人（Contacts）**——联系信息必须准确。联系信息包括需要通知的管理人员的联系信息，以及电话树中使用的召回信息。\n\
  \n与与其他文档一样，跟踪 `DRP` 的更改是重要的。`DRP` 包含一个变更页或版本控制页，识别变更的内容、更改的时间以及谁执行了变更。\n\n![](img/Note.png)注意\n\
  \n电话树（phone tree）是一种方便呼叫大人群的方法。电话树是金字塔形状的联系列表。开始时，顶部的人拨给几个人，这些人每个人拨给分配给他们的几个人。这个过程一直持续直到所有联系人都收到通知。\n\
  \n## DRP 如何降低组织的风险？\n\n`DRPs` 通过减少灾难的影响来降低风险。灾难（如地震、龙卷风或飓风）是威胁，是无法停止的。然而，通过准备可以减少威胁的影响，而\
  \ `DRP` 有助于这种准备，以减轻短期和长期损害。\n\n例如，`DRP` 可以帮助缩短灾难后的停机时间。拥有 `DRP` 的组织比没有 `DRPs` 的组织能够更容易地处理灾难。当然，`DRP`\
  \ 的存在并不保证成功。\n\n有了灾难恢复计划，公司将能够更好地准备恢复 `CBFs`。冷备（cold site）在规划阶段需要大量工作来准备。所有设备必须移动、设置和配置。通过额外的资源和预计划，公司可以计划使用热备（warm\
  \ site）。然而，如果没有计划，工作将困难一倍。\n\n除了没有 `DRP` 会更加困难之外，还会遇到更多的错误和问题。`DRP` 有助于在问题发生前对其应用批判性思维，并鼓励对如何尽可能减少这些问题进行逻辑思考。可以咨询专家来帮助解决问题，并对进行测试。没有\
  \ `DRP`，公司将没有任何这些利益的情况下被投入危机中心。运气好，灾难不会毁灭业务。\n\n### 为组织实施 DRP 的最佳实践\n\n在实施 `DRPs`\
  \ 时，可以实施许多最佳实践。以下是其中许多最佳实践的列表：\n\n\n\n\n\n- **确保业务影响分析（BIA）已完成**——BIA 用于识别 `CBFs`，这些这些用于识别关键业务操作以及关键的服务器和服务。\n\
  - **从明确的目的和范围开始**——目的和范围声明有助于确保灾难恢复计划（DRP）保持重点。采取 DRP 范围之外步骤和程序会导致资源浪费。\n- **定期审查和更新\
  \ DRP**——DRP 应该至少至少审查一次。如果 DRP 涵盖的关键系统发生变化，则应重新审查 DRP 以确定变化是否对其产生影响。\n- **测试 DRP**——测试确保\
  \ DRP 能按预期实施。在测试 DRP 时，不应影响正常运行。\n\n使用检查清单通常是值得的，以确保所有相关问题都得到解决。以下清单可以在创建 DRP 之前、期间和之后使用，以识别公司的准备情况：\n\
  \n- 组织的 BIA 是否是最新？如果 BIA 已超过一年，必须先进行更新。\n- 自 BIA 完成以来，BIA 涵盖的任何系统是否发生了变化？如果是，则需要修订\
  \ BIA。\n- 是否定义了关键业务功能？是否清楚哪些系统需要首先恢复？\n- DRP 是否规定了为 CBFs 提供的服务水平？换句话说，如果业务在灾难期间必须继续运行，DRP\
  \ 是否识别了哪些服务需要恢复？\n- 是否分配了具体的职责？部门或个人是否知道他们在紧急情况下不同阶段的职责？\n- 是否清楚应该恢复哪些硬件、软件和数据？DRP\
  \ 是否包含了支持 CBFs 所需的所有支持设备？\n- DRP 是否包含备份计划？该备份计划是否包含测试恢复的测试要素？DRP 是否包含了数据恢复的步骤？\n\
  - 备份是否存储在异地？如果发生灾难，异地备份是否容易访问？\n- 是否有通信计划？是否有替代通信方法？\n- 是否需要备用站点？需要哪种类型的备用站点？预算允许获得所需的选址？\n\
  - 是否考虑了设施需求？这一类包括 UPS、备用电源以及暖空调系统。\n- 是否处理了支持服务？例如，如果需要备用发电机，是否有足够的燃料在灾难期间支持组织？是否有足够的食物和水在灾难期间支持现场人员？\n\
  - 人员是否接受了 DRP 培训？他们是否知道在灾难发生前、中、后的职责是什么？\n- DRP 是否经过了测试？程序是否经过了测试以验证它们按预期工作？\n-\
  \ DRP 是否至少每年审查一次？当其内部要素受影响时，是否根据需要进行了更新？\n- DRP 的变更是否得到了跟踪？\n\n## 章节总结\n\n本章涵盖了使用灾难恢复计划进行风险缓解的重要要素。它定义了\
  \ `DRP` 及其目的。若干因素对 DRP 的成功至关重要。管理层必须提供资源和领导力。DRP 开发人员需要理解灾难恢复概念以及组织如何运作。DRP 必须解决几个核心问题。`RTOs`\
  \ 指定了 `CBF` 必须恢复的时间。必要时，`CBFs` 可以移动到替代位置。`hot site` 可以在几或几小时内使用，但成本最高。`cold site`\
  \ 仅仅是一个带有电力、水和其他设施支持的建筑，成本最低但最难测试。`warm site` 是两者的折中方案。`mobile site` 是位于受影响设施附近的站点。另一个关键因素是预算。DRP\
  \ 必须有资金才能成功。DRP 可以包含不同的要素。从目的和范围开始是常见的，以确保各方明确。识别范围有助于防止范围蔓延。DRP 将包含具体的步骤。当灾难发生时，使用\
  \ DRP 中的步骤进行恢复。DRP 应该经过测试以验证它们按计划工作，并需要根据更改进行更新。\n\n## 核心概念与术语\n\n- 业务连续性计划 (BCP)\n\
  - 业务影响分析 (BIA)\n- 云计算\n- 冷备站点 (Cold site)\n- 关键成功因素 (CSF)\n- 灾难恢复计划 (DRP)\n- 热备站点\
  \ (Hot site)\n- 最大可停机时间 (MAO)\n- 最小业务连续性目标 (MBCO)\n- 移动备站点 (Mobile site)\n- 恢复时间目标\
  \ (RTO)\n- 虚拟化\n- 温备站点 (Warm site)\n\n## 第 14 章评估\n\n1. \\_\\_\\_\\_\\_\\_\\_\\\
  _ 是在中断或灾难后恢复关键业务运行的计划。\n2. DRP 有多个目的，包括拯救生命、确保业务连续以及在灾难后恢复。\n    1. 正确\n    2. 错误\n\
  3. 灾难恢复与容错性是同一回事。\n    1. 正确\n    2. 错误\n4. \\_\\_\\_\\_\\_\\_\\_\\_ 是成功的要素。例如，DRP\
  \ 的成功取决于管理支持和恢复预算。\n5. 业务影响分析 (`BIA`) 包含最大可停机时间 (`MAO`)。`MAO` 用于确定系统必须恢复的时间。DRP\
  \ 中用什么术语代替 `MAO`？\n    1. `CBF`\n    2. `DRPA`\n    3. `RAI`\n    4. `RTO`\n6. 某个\
  \ DRP 涵盖托管大型数据库的系统。为了确保数据拷贝到异地位置，可以使用什么？\n    1. `Data replication`\n    2. `Electronic\
  \ vaulting`\n    3. `Remote journaling`\n    4. 以上所有\n7. 备份副本应该存储在 \\_\\_\\_\\_\\\
  _\\_\\_\\_ 以确保组织能够生存主地的毁灭性灾难。\n8. 正在考虑为 DRP 选择一个替代位置，需要最小化成本。会选择哪种站点？\n    1. `cold\
  \ site`\n    2. `warm site`\n    3. `hot site`\n    4. `mobile site`\n9. 正在考虑为 DRP\
