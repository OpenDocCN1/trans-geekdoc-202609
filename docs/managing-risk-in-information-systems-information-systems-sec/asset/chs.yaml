  \n\n\n\n完成一份准确的成本效益分析（CBA）可能需要大量时间。由于这种时间要求，不会对每种可能的建议应对措施都执行 CBA。例如，如果一个熟练的管理员可以编写脚本来缓解风险，那么该措施的成本几乎为零。因此，没有必要执行\
  \ CBA。另一方面，故障转移集群可能非常昂贵，因为必须添加服务器，这可能需要额外的设施成本来容纳这些服务器。\n\n## CBA 报告\n\nCBA 报告可以以任何格式呈现。然而，一致地创建\
  \ CBA（特别是在同一个项目内）是有价值的。例如，对于缓解相同风险的两种应对措施，可能需要创建两个 CBA。管理人员不想同时购买这两种措施，因此他们会确定哪种措施能提供更大的收益。如果两个\
  \ CBA 都使用相同的方法和格式完成，那么比较两者并选择更有价值的控制措施将会更容易。\n\n任何应对措施的 CBA 报告通常都包含以下元素：\n\n###\
  \ ![](img/Note.png)注意\n\n定量风险评估包括由于风险导致的年度预期损失（ALE）的估算。ALE 可以作为“措施实施前的损失”。\n\n-\
  \ **建议的应对措施**——尽可能详细地识别应对措施。例如，风险评估建议使用故障转移集群。关于集群的细节可能包括两台匹配服务器的成本以及故障转移集群硬件的成本，以及管理员培训成本或外包安装故障转移集群的成本。\n\
  - **要缓解的风险**——提供导致风险的威胁/漏洞对的细节。如果使用了威胁矩阵法来确定风险的优先级，则包含威胁发生的概率和影响。如果应对措施是消除漏洞，则包含其如何实现的概述。如果应对措施是减少漏洞，则包含对其成功率的估算。例如，如果预计该应对措施将把事故发生频率从每年\
  \ 10 次减少到每年 1 次，应在此处说明。\n- **年度预计收益**——将直接和间接收益计算为年度货币价值。收益通过计算使用控制措施和不使用控制措施的损失来确定。例如，目前每年有\
  \ 25% 的概率发生一次服务故障。当发生故障时，会导致 20,000 美元的损失。某种应对措施可以将此风险降至零。未实施措施的损失为 $20,000 × .25，即\
  \ $5,000，而实施措施后的损失为零，这表明预计年度收益为 $5,000。\n- **初始成本**——在此处列出初始成本，其中包括购买价格和实施应对措施的任何间接成本。间接成本包括培训费用和修改环境的成本，其中可能包括增加电力容量、升级空调或改进物理访问控制措施。\n\
  - **年度或经常性成本**——某些应对措施需要持续成本来维护。例如，可以使用代理服务器阻止对赌彩网站的访问。手动识别所有赌彩网站并将其输入代理服务器非常耗时。然而，内容过滤公司维护着许多类别（如赌彩网站）的列表。组织与其手动输入这些信息，不如支付订阅服务作为持续成本。\n\
  - **成本与收益的比较**——这是报告的主要目的。如果成本低于收益，则建议采取应对措施。如果成本高于收益，则可能不会实施。\n- **建议**——只有在应对措施提供收益时，才建议实施。\n\
  \n## 实施风险计划\n\n下一步是实施计划。实施时的首要目标是：\n\n- 保持在预算内\n- 按照进度进行\n\n如果成本过高或耗时过长，管理层将质疑其价值。\n\
  \n### 保持在预算内\n\n任何这些额外成本都可能轻易打破预算。如果应对措施的成本超过分配的预算，管理层可能会决定放弃该措施。此外，每识别出一项额外成本，都需要重新评估\
  \ CBA，因为实施应对措施的最初决定是基于原始成本的。随着成本的增加，应对措施的价值就会降低。\n\n### 按照进度进行\n\n进度表是任何项目的重要考虑因素。任务应该经过计划以确保它们按照特定的顺序发生，这意味着，如果任何任务延迟，其他任务也可能延迟，这些延迟可能会影响实际的实施日期。\n\
  \n\n\n\n用于保持按计划执行的工具之一是里程碑图。`FIGURE 11-5`显示了本章讨论的 Web 服务器升级的示例里程碑图。项目经理通常使用项目管理软件来自动创建这些图表。\n\
  \n![FIGURE 11-5 里程碑计划图。](img/9781284183719_CH11_FIGF05.png)\n\n**图 11-5** 里程碑计划图。\n\
  \n当使用项目管理软件时，可以输入里程碑日期和任何特定任务的长度。然后，软件允许以多种格式显示数据。\n\n例如，`FIGURE 11-6`以甘特图格式显示同一个项目。一旦数据输入到管理软件中，以另一种格式显示数据是相对容易的。通常，更改格式只需要鼠标点击几次。\n\
  \n![FIGURE 11-6 甘特图。](img/9781284183719_CH11_FIGF06.png)\n\n**图 11-6** 甘特图。\n\n\
  某些任务是相互依赖的。例如，在为机柜供电之前需要安装新的设备机，而且培训的时间非常重要。如果培训得太早，当技术人员需要安装设备时，他们可能已经忘记了；而如果培训得太晚，他们可能需要在没有经过培训的情况下安装设备，或者项目进度可能会滞后。\n\
  \n关键路径图显示了依赖关系，如`FIGURE 11-7`所示。如果关键路径上的任何项目延误，整个项目将延迟。经理必须密切关注关键路径项目，以确保项目按计划进行。\n\
  \n![FIGURE 11-7 关键路径图。](img/9781284183719_CH11_FIGF07.png)\n\n**图 11-7** 关键路径图。\n\
  \n例如，里程碑 2 和 5 不在关键路径上。购买服务器和硬件以及为房间增加空调可以延迟。当然，它们不能无限期地延迟。到了安装和配置服务器时，必须满足这些里程碑。然而，经理在项目早期可以由于关注关键路径里程碑而减少对里程碑\
  \ 2 和 5 的关注。\n\n所使用的工具并不如意识到它们可用那样重要。对于简单的项目，进度表可能简单地在餐巾上勾勒出来，但较大的项目将受益于现有的更复杂的项目管理工具。\n\
  \n### 跟进风险缓解计划\n\n管理的一个重要部分是跟进，以确保计划按预期执行，风险管理计划也不例外。在跟进风险缓解计划时，应包含以下两个要素：\n\n*\
  \ 确保应对措施已实施\n* 确保安全漏洞已修复\n\n## 确保应对措施已实施\n\n用于确保应对措施已实施的首要工具是 `POAM`。`POAM` 是随风险评估创建的，但它是一个活文档，因为经理会定期更新它。随着风险评估转换为风险缓解计划，`POAM`\
  \ 文档会扩展。\n\n`POAM` 包含了所有已批准的应对措施及其时间表。简单的应对措施可能只有一或两个里程碑，而复杂的应对措施可能有多个里程碑。如果按预期完成了里程碑，那么确保按计划完成的几率更大。换句话说，关注最终日期不如关注里程碑日期重要。\n\
  \n如果错过了一个里程碑，整个项目都可能会延迟。如前提到的，关键路径图对于确定必须完成哪些里程碑以确保项目按计划进行具有无法估量的价值。\n\n使用项目管理软件时，一眼显示通常就能看出应对措施的实施是否按计划进行。项目管理软件使用颜色标记的状态符号。例如，绿色圆可能表示项目按计划进行；黄色圆表示项目略有延迟；红色圆表示严重延迟。许多项目经理在报告中使用术语表示项目处于“绿色区域”（in\
  \ the green）或“红色区域”（in the red）。“绿色区域”表示按计划进行，“红色区域”表示严重延迟，这通常会警报高层管理。\n\n### ![](img/Note.png)备注\n\
  \n可以专门为风险缓解计划创建一个单独的 `POAM`。例如，风险评估中的 `POAM` 可能要求在特定日期创建风险缓解计划。无论使用什么来跟踪计划进度，重点是它必须被跟踪。\n\
  \n## 确保安全漏洞已修复\n\n必须检查应对措施以确保它们按预期工作。由于应对措施的目的是减轻风险，它应该要么减少威胁的影响，要么减少漏洞。\n\n对任何产品也是如此；它应该按预期工作。看电视购物广告可能会让人们相信广告宣传的产品将帮助他们减肥、发财或改善健康。然而，当他们收到产品并发现其性能没有达到预期时，他们会意识到自己浪费了钱。\n\
  \n同样，并不是所有的应对措施都能按预期执行。发现它们性能的唯一方法是对它们进行测试和评估，而且某些应对措施比其他的更容易评估。例如，漏洞扫描器检测到了漏洞，风险评估建议采取一种应对措施来消除该漏洞。在实施应对措施后，运行相同的漏洞扫描。如果扫描没有检测到风险，那么显然应对措施已经修复了漏洞。然而，如果扫描仍然检测到风险，那么显然漏洞仍然存在，需要采取额外步骤。\n\
  \n在 Web 集群和故障转移集群示例中，目标是消除停机并增加可用性。停机将表明解决方案不起作用。然而，停机会导致收入损失。与其等待停机，可以进行测试来衡量应对措施的性能。可以使用的一些测试和测量包括：\n\
  \n* 测量 Web 集群的负载：在正常运行期间，负载应在服务器之间平衡，并可以使用负载均衡软件进行测量。也可以测量每台单独服务器的资源。如果服务器具有类似的硬件，每台服务器的处理器、内存、网卡和磁盘使用应该是大致相。\n\
  * 从 Web 集群中移除服务器：移除服务器模拟了 Web 集群中的服务器故障，不应影响整个集群。换句话说，如果从 Web 集群中移除一台服务器，其他服务器应该接管负载。此外，新客户端不应指向不存在的服务器。\n\
  * 向 Web 集群中添加服务器：如果网站经历了更多增长，它应该能够处理向 Web 集群中添加另一台 Web 服务器，这允许 Web 集群进行扩展。网络负载均衡软件应与新服务器平衡负载。因此，可以在不更改实际服务的情况下向\
  \ Web 服务添加更多客户端。\n* 逻辑上转移故障转移集群节点：故障转移集群包含可以逻辑切换节点的软件。例如，它可以用于逻辑上地将 `node2` 从非活动切换到活动，并将\
  \ `node1` 从活动切换到非活动。如果这种切换在测试期间失败，它不会导致停机，但表明在发生实际故障时集群无法防止停机。\n\n\n\n\n\n- **关闭故障转移集群上的活动节点**——如果逻辑传输工作正常，就可以模拟活动节点的实际故障。故障转移集群通常会识别出用于模拟故障的特定程序。非活动节点应该感知到故障并接管成为活动节点。如果测试失败，系统可以快速切换回，对操作的影响降至最低。这种类型的故障转移测试可能会影响故障转移集群提供的服务。因此，测试应该在业务低峰期进行，并经过充分的预先和规划。首要考虑因素之一是如果发生故障，是否有将系统恢复到正常状态的能力。\n\
  \n任何测试和评估的目标都是为了确保应对措施已以可接受的方式填补了安全漏洞。但是，如果安全漏洞尚未关闭，管理者需要被告知剩余的风险（即残余风险），他们可能会认为该漏洞已得到满意地关闭。管理者还可能决定需要确定额外的应对措施以进一步降低风险。\n\
  \n### 从风险评估启用风险缓解计划的最佳实践\n\n以下列表确定了在从风险评估启用风险缓解计划时可以遵循的几项最佳实践：\n\n- **保持在范围之内**——缓解计划源于风险评估，这意味着缓解计划的范围不应超出风险评估的范围。如果范围得不到管理，成本很容易失控。\n\
  \n- **如果发现新成本则重新进行 CBA**——对应对措施进行成本效益分析通常是风险评估的一部分。如果稍后发现了额外成本，则需要根据准确的成本重新进行 `CBA`。\n\
  \n- **应对措施优先级排序**——应该根据重要性对应对措施进行排序。确定应对措施优先级的常用方法是使用威胁可能性/影响矩阵对其进行评分；应优先实施高优先应对措施。\n\
  \n- **在分析中包含现有应对措施**——在对应对措施进行评分时，必须考虑现应对措施。例如，某个威胁可能产生高影响，但现有的应对措施已将其降低至低影响。在评估威胁时，应考虑现有应对措施并为该威胁分配低影响。\n\
  \n- **控制成本**——成本应保持在分配的预算内。成本的任何变化都可能影响 `CBA`。如果额外成本过高，应对措施的价值可能会大幅降低。\n\n- **控制进度**——当进度延迟时，成本通常会增加，实施推迟越晚，组织面临的风险就越久。\n\
  \n- **跟进**——应该检查已批准的应对措施，以确保它们已经实施，并且按照预期缓解了风险。\n\n### ![](img/Tip.png)提示\n\n在故障转移集群的生命周期内，可以定期更换节点。这样做的一个常见原因是维护。例如，当节点\
  \ 1 活动时，可以更新节点 2。随后，可以将节点 2 上线并激活，从而允许节点 1 下线进行更新。\n\n#### 本章总结\n\n本章涵盖了将风险评估转换为风险缓解计划时应考虑的许多细节。起点是彻底审查应对措施，这一过程通常包括将威胁与漏洞匹配，并识别与它们相关的所有成本（包括任何隐藏成本）。如果成本发生变化，可能需要重新进行成本效益分析。\n\
  \n如果自风险评估批准以来已过长时间，必须验证风险要素的存在以及应对措施在缓解风险方面的有效性。执行计划时的两个关键目标是保持在预算并按计划进行。最后，应该进行跟进，以确保已批准的应对措施已实施，并且它们确实按预期缓解了风险。\n\
  \n### 核心概念和术语\n\n- 账户管理策略\n- 成本效益分析 (CBA)\n- 隐式拒绝\n- 网络负载均衡\n- 密码策略\n- 水平扩展 (Scale\
  \ out\n- 垂直扩展 (Scale up\n- 不间断电源 (UPS\n- Web 农场\n\n### 第 11 章评估\n\n1. 一项(n) \\_\\\
