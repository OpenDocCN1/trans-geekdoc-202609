  \ 程序示例：HIPAA 合规\n\n网站容易受到来自互联网的拒绝服务（DoS）攻击。这种风险无法消除。但是，可以完成若干任务来降低风险：\n\n*   **建议**——升级防火墙。\n\
  *   **理由**——当前的防火墙是一个基础路由器。它能过滤数据包，但不提供高级的防火墙功能。\n*   **程序**——可以使用以下步骤来升级新防火墙：\n\
  \n    1.  **启动防火墙日志**——此日志可用于确定当前正在使用哪些端口。日志应至少收集一周。\n    2.  **创建防火墙策略**——`防火墙策略`\
  \ 识别允许哪些流量通过防火墙。这是一份书文件，基于防火墙日志的内容。\n\n### 报告要求\n\n在收集了风险和建议后，报告将提交给管理层。管理层将使用这些数据决定采取哪些步骤。\n\
  \n#### 提交建议\n\n将收集的数据汇成报告，其中包含威胁、漏洞和建议列表。然后将此报告提交给管理层。在此阶段，记住风险管理计划的总体很重要。目标是识别风险并建议减少风险的策略。大多数风险不会消除，而是降低到可以接受的水平。每个识别出的风险都将有一个降低风险的建议。\n\
  \n此报告应包含以下信息：\n\n*   发现\n*   建议成本和范围\n*   CBA\n\n##### 发现\n\n发现列出了事实。记住风险损失发生在威胁利用漏洞时。风险管理的发现需要威胁、漏洞和潜在损失。发现被描述为原因、标准和结果：\n\
  \n*   **原因**——原因是威胁。例如，攻击者可能会尝试发起 DoS 攻击。在这种情况下，威胁是攻击者。识别根本原因也很重要。攻击成功取决于攻击者拥有权限且系统存在漏洞。风险管理试图减少原因的影响或减少漏洞。\n\
  *   **标准**——识别允许威胁成功的标准，即漏洞。例如，如果满足以下标准，服务器将受到 DoS 攻击的威胁：\n\n    *   **人力不足**——如果没有足够的人力执行安全步骤，站点将是脆弱的。\n\
  \    *   **未管理的防火墙**——每个开放的端口都代表一个漏洞。如果防火墙未管理端口，将允许意外流量进入。\n    *   **没有入侵检测系统 (IDS)**——根据\
  \ IDS 类型，它不仅能检测入侵，还能对入侵和环境变化做出响应。\n\n\n\n\n\n- **操作系统未更新**——在补丁发布并测试后立即对系统进行补丁是至关重要的。如果不进行更新，系统将受到新漏洞的威胁。\n\
  - **未安装和未更新杀毒软件**——杀毒软件可以检测恶意软件。应该用病毒库更新软件，以确保它能检测出新的恶意软件。\n- **影响**——影响通常是某种形式的服务中断。例如，对网站的影响可能是导致网站再无法访问。\n\
  \n### ![](img/Note.png)注意\n\n拒绝服务攻击（DoS attack）是指任何旨在阻止系统提供服务的攻击。分布式拒绝服务攻击（DDoS\
  \ attack）是同时从多个系统发起的 DoS 攻击。DDoS 攻击攻击通常包括受僵尸网络控制的僵尸计算机。\n\n在记录发现结果时，一个重要的考虑因素是资源可用性。可能，所有发现的问题在之前都是已知的。然而，过去可能没有分配资金来购买解决方案。此外，可能当时的人力也不足以以实施这些解决方案。\n\
  \n当没有足够的人力时，安全性往往为了易用性而被牺牲。以网站示例为例，首要目标可能是确保网站运行。一旦网站上线，资源可能会被用于其他工作。网站可能仍然不安全，可能没有进行备份，或者仍然存在其他安全问题。\n\
  \n因果图可以用于发现和记录调查结果。`图 4-2`显示了网站场景的因果图示例。在图中，首要原因是是攻击。其余项目是允许攻击成功的影响因素。结果是服务中断。\n\
  \n![图 4-2 网站因果图。](img/9781284183719_CH04_FIGF02.png)\n\n**图 4-2** 网站因果图。\n\n使用因果图有几个优点。它可以帮助引导发现过程中的讨论，并帮助在文档中可视化呈现原因与结果之间的关系。因果图可用于任何问题。\n\
  \n因果图的创建是从绘制线条和最终结果开始的。在图 4-2 中，结果是服务中断。然后，添加额外的项目（原因），使图看起来类似于鱼骨图。图中的任何一个元素都可以进行扩展。例如，“攻击”可以扩展为包含特定的攻击类型。攻击可能包括恶意软件、DoS、缓冲区溢出或其他类型的攻击。\n\
  \n### ![](img/Note.png)注意\n\n因果图也被称为`石川图`（Ishikawa diagram）或`鱼骨图`（fishbone diagram）。它被用于将问题与原因联系起来。\n\
  \n在创建因果图时，可能会出现思路枯竭或集中于单一主题的情况。为了平衡图表，可以考虑以下五个要素，但不需要全部包含在内。然而，其中任何元素都可以用于帮助识别原因：\n\
  \n- **方法**——哪些方法可能导致服务中断？\n- **机器**——哪些机器问题可能导致服务中断？\n- **人力**——哪些人力问题可能导致服务中断？\n\
  - **材料**——哪些材料问题可能导致服务中断？\n- **环境**——哪些环境问题可能导致服务中断？\n\n`图 4-3`显示了因果图的另一个示例。在这个例子中，原因是机密性丢失。其余项目显示了允许数据丢失的标准。对于\
  \ HIPAA，结果可能是巨额罚款或刑事指控（如监禁）。\n\n![图 4-3 HIPAA 合规性因果图。](img/9781284183719_CH04_FIGF03.png)\n\
  \n**图 4-3** HIPAA 合规性因果图。\n\n### 建议成本和时间范围\n\n使用因果图具有几个优点。它可以帮助引导发现过程中的讨论，并帮助在文档中可视化呈现原因与结果之间的关系。因果图可用于任何问题。\n\
  \n因果图的创建是从绘制线条和最终结果开始的。在图 4-2 中，结果是服务中断。然后，添加额外的项目（原因），使图看起来类似于鱼骨图。图中的任何一个元素都可以进行扩展。例如，“攻击”可以扩展为包含特定的攻击类型。攻击可能包括恶意软件、DoS、缓冲区溢出或其他类型的攻击。\n\
  \n### ![](img/Note.png)注意\n\n因果图也被称为`Ishikawa diagram`或`fishbone diagram`。它被用于将问题与原因联系起来。\n\
  \n在创建因果图时，可能会出现思路枯竭或集中于单一主题的情况。为了平衡图表，可以考虑以下五个要素，但不需要全部包含在内。然而，其中任何元素都可以用于帮助识别原因：\n\
  \n- **方法**——哪些方法可能导致服务中断？\n- **机器**——哪些机器问题可能导致服务中断？\n- **人力**——哪些人力问题可能导致服务中断？\n\
  - **材料**——哪些材料问题可能导致服务中断？\n- **环境**——哪些环境问题可能导致服务中断？\n\n`图 4-3`显示了因果图的另一个示例。在这个例子中，原因是机密性丢失。其余项目显示了允许数据丢失的标准。对于\
  \ HIPAA，结果可能是巨额罚款或刑事指控（如监禁）。\n\n![图 4-3 HIPAA 合规性因果图。](img/9781284183719_CH04_FIGF03.png)\n\
  \n**图 4-3** HIPAA 合规性因果图。\n\n### 建议成本和时间范围\n\n\n\n\n\n准确数据的重要性不言而喻。完成准确的成本效益分析（CBA）的关键在于从准确的数据开始。同样，有时准确的数据很难获取。寻找准确的数据通常需要深入挖掘表面，以确定成本。\n\
  \n探究性问题通常可以揭示数据中的缺陷。以下是需要考虑的场景和问题：\n\n* 如果某项控制措施旨在减少 90% 的损失，请问：“您是如何得出 90% 这个数字的？”\n\
  * 如果给出了控制措施的成本，请问：“这是否包含任何持续成本？”\n\n探究性问题不需要具有指责性。目标不是制造冲突。相反，目标是验证数据。提问时的语气应该是“请帮我理解一下”。如果数据有缺陷，演示者很容易产生防御心理。另一方面，如果数据是有效的，演示者可以用事实回答问题并支持其主张。\n\
  \n## 风险声明\n\n报告通常总结为风险声明。风险声明用于传达风险及其产生的影响。它们通常使用“如果……那么……”的语句编写。陈述中的“如果”部分识别风险的要素，而“那么”部分则识别产生的影响。例如，以下风险声明可用于网站：\n\
  \n* 如果网络服务器上没有安装防毒软件，那么服务器被感染的可能性很高。该网络服务器与互联网保持常连接。\n* 如果服务器被感染，那么可能会发生停机。任何停机都会导致每停机\
  \ 15 分钟损失 500 美元的销售额。\n\n风险声明应当与项目的范围和目标相匹配。如果陈述不在范围或目标之内，则风险评估可能偏离轨道，这意味着发现或建议需要重新聚焦。\n\
  \n## 成本估算的准确性\n\n由于 CBA 的准确性取决于其成本估算，所以获取准确的数据至关重要。然而，这可能是困难的。理解数据如何被扭曲是非常重要的。\n\
  \n解决方案的成本往往被低估。例如，持续成本可能未包含在初始成本估中。一个看起来易管理的产品可能需要昂贵的培训。\n\n解决方案的成功可能会被高估。某解决方案预计可以减少\
  \ 90% 的事件，但在实践中，减少比例可能接近 50%。\n\n有时，人员对于提供准确信息没有切身利益。例如，关注初始销售的销售人员可能会忽略持续成本。预计他们还会强调其产品的最积极方面。\n\
  \n## 记录管理层对建议的响应\n\n向管理层提交建议后，他们将决定如何处理。他们可以接受、延迟或修改建议：\n\n* **接受 (Accept)**——管理层可以批准建议。获批准的建议将获得资金并实施。它们随后会被加入\
  \ POAM 以进行跟踪。\n* **延迟 (Defer)**——管理层可以延迟某项建议。该建议可能在以后实施。但是，该建议不会包含在已接受建议列表中。\n*\
  \ **修改 (Modify)**——管理层可以修改建议。例如，可能建议安装防火墙，但管理层决定安装两个防火墙以实现非军事化区（DMZ）。另一方面，可能建议购买\
  \ 4000 美元的防火墙，但管理层决定购买 800 美元的防火墙。\n\n### ![](img/Note.png)注意\n\n非军事化区（DMZ）通常用于保护面向互联网的服务器。它通常由两个防火墙组成。一个防火墙过滤从互联网到\
  \ DMZ 的流量，另一个防火墙则过滤从内部网络到 DMZ 的流量。\n\n### 记录已接受建议的实施情况\n\n记录管理层所做的决策非常重要。随着时间的推移，如果进行记录，决策可能会发生扭曲，在建议被延迟或修改时尤其如此。\n\
  \n例如，在管理网站的风险管理计划时，计划建议购买防毒软件，但该建议被延迟了。三个月后，系统被恶意软件感染了。四小时的停机导致了超过 8000 美元的损失。人们可能会质问为什么没有购买该软件。\n\
  \n如果决策记录了案，这将是一个很容易解决的问题。如果没有记录，结果可能会导致难堪的互相指责。\n\n文档不需要详尽。它可以是一份列出建议和决策的简单文档。它看起来像这样：\n\
  \n* **购买防毒软件的建议**——接受。将尽快购买软件。\n* **聘请 IT 管理员的建议**——延迟。IT 部门需要为此提供更清晰的理由。在此期间，授权\
  \ IT 部门使用加班以确保满足安全需求。\n* **购买 SS75 防火墙的建议**——修改。将尽快购买两个 SS75 防火墙。这两个防火墙将被配置为 DMZ。\n\
  \n## 行动计划和里程碑\n\n行动计划和里程碑 (POAM) 用于跟踪进展的文档。POAM 用于许多类型的项目管理。POAM 用于分配责任并允许管理层进行跟进：\n\
  \n* **分配责任**——POAM 明确了谁负责每项任务。当某任务没有按时完成时，它也明确了由谁来负责。\n* **管理跟进**——项目经理（PM）和高层管理可以使用\
  \ POAM 跟进项目。POAM 允许经理快速确定任何项目的状态。当使用项目管理工具时，问题源通常很容易识别。\n\nPOAM 对于审计项目也很有用。例如，HIPAA\
  \ 要求定期审查。POAM 可以显示公司在实现合规方面所取得的进展。如果公司没有达到 100% 合规，但能够显示已取得重大进展，罚款可能会被豁免或减少。如果公司没有任何任何表明进展的记录，可能会被处以最高罚款。\n\
  \nPOAM 不需要特定的格式。某公司可能在 Microsoft Excel 表格中创建 POAM，为每个项目设置 15 列。另一家公司可能在 Microsoft\
  \ Word 文档中创建 POAM。\n\n### ![](img/Note.png)注意\n\nPOAM 也缩写为 POA&M。POAM 是一个动态文档。它不是创建一次后就完成的报告。相反，POAM\
  \ 应该在项目的整个生命周期内更新。此外，POAM 的样子可能根据项目的阶段而不同。在项目早期，POAM 可能是通用的，但在项目后期，它可以更具体。\n\n例如，在网站风险管理计划中，网站遭到了攻击。在过去的两个月内发生了两次重大停机。这两起事件的原因可能是已知的。然而，所有的威胁和漏洞可能并未知。初始\
  \ POAM 可能包含以下通用项目：\n\n* 批准风险管理计划：分配给 \\_\\_\\_\\_\\_\\_ 截止 \\_\\_\\_\\_\\_\n* 识别威胁：分配给\
  \ \\_\\_\\_\\_\\_\\_ 截止 \\_\\_\\_\\_\\_\n* 识别漏洞：分配给 \\_\\_\\_\\_\\_\\_ 截止 \\_\\\
  _\\_\\_\\_\n* 识别潜在解决方案：分配给 \\_\\_\\_\\_\\_\\_ 截止 \\_\\_\\_\\_\\_\n* 准备风险管理计划报告：分配给\
  \ \\_\\_\\_\\_\\_\\_ 截止 \\_\\_\\_\\_\\_\n* 批准风险响应计划：分配给 \\_\\_\\_\\_\\_\\_ 截止 \\\
  _\\_\\_\\_\\_\n* 开始实施计划：分配给 \\_\\_\\_\\_\\_\\_ 截止 \\_\\_\\_\\_\\_\n\n\n\n\n\n* 计划的完整实施：指派\
  \ \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\n\n随后，当管理层批准特定的建议后，就可以为已批准和修改的建议创建计划行动措施（POAM）。POAM\
  \ 中的每项建议都可能包含多个行项目。例如，升级防火墙的任务可以是一个主要的里程碑。当所有任务完成后，该里程碑即告达成。\n\n* 记录当前防火墙活动：指派 \\\
  _\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\n* 购买两台 SS75 防火墙：指派 \\_\\_\\_\\_\\_\\_\
  \ 截止日期 \\_\\_\\_\\_\\_\\_\n* 创建防火墙策略：指派 \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\\
  _\n* 测试防火墙：指派 \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\n* 实施外部防火墙：指派 \\_\\_\\\
  _\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\n* 实施内部防火墙：指派 \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\\
  _\\_\\_\\_\n* 将 Web 服务器移动到 DMZ：指派 \\_\\_\\_\\_\\_\\_ 截止日期 \\_\\_\\_\\_\\_\\_\n\n\
  ### ![](img/Note.png)备注\n\n一个`milestone`(#29_glossary.xhtml#gloss115) 是一个计划中的事件。它表示一项主要任务或一组任务的完成。里程碑在项目管理中通常被用于验证项目的进度。当错过里程碑日期时，说明项目进度落后了。\n\
  \n每个行项目可以包含以下细节：\n\n* 任务名称\n* 相关的威胁或漏洞\n* 风险水平（低、中、高）\n* 步骤或里程碑名称\n* 责任分配\n* 络人\n\
  * 估算成本\n* 实际成本\n* 完成任务的预计工时\n* 完成任务的实际人工工时\n* 计划开始日期\n* 实际开始日期\n* 里程碑截止日期\n* 当前状态\n\
  * 计划完成日期\n* 实际完成日期\n* 备注\n\n### 项目管理软件\n\n有许多版本的项目管理软件可用。例如是 Microsoft Office Project，它包含不同的版本，如\
  \ Microsoft Office Project Standard 和 Project Professional。\n\n项目软件包含了用于创建图表的工具。图表工具提供了项目的图形化表示，并可以自动检测项目状态。\n\
  \n某些软件会用颜色（如绿色、黄色或红色）指示项目状态。绿色可能表示按计划且在预算，黄色可能表示有延期或超预算的危险，红色可能表示已延期或超预算。\n\n项目经理（PM）可以在风险管理项目进展输入数据，这些图表将自动更新。可以使用服务器托管多个项目的数据，以便经理可以通过网络浏览器访问任何项目的报告。\n\
  \n可以使用不同的工具来协助跟踪 POAM。这些工具并不是替代 POAM，而是提供 POAM 及其进的图形化表示。这些工具包括：\n\n* 里程碑计划图\n*\
  \ 甘特图\n* 关键路径图\n\n### 风险管理计划的进度图\n\n经理经常使用图表来显示风险管理计划的进度。风险管理计划应该包含一个风险登记，其中记录了以下项目：(1)\
  \ 已识别的风险，(2) 何时评估/评价，(3) 选定的风险响应/缓解措施，以及 (4) 重新评估或剩余风险。图表提供了关键信息的图形化表示。正如俗话所说，“一画胜千言”。同样，一张图表也胜过千言。以下章节涵盖了经理用于跟踪计划进度的常用图表。\n\
  \n#### 里程碑计划图\n\n一个`milestone plan chart`(#29_glossary.xhtml#gloss116) 是主要里程碑的简单图形表示，显示以图形格式列出的它们。如果里程碑之间存在依赖关系，此图表将显示它们。换句话说，如果里程碑\
  \ 1 完成之前无法开始里程碑 2，此图表将显示这种依赖关系。\n\n通常，图表中包含实际的开始和结束日期。`FIGURE 4-4`(#13_chapter04_07.xhtml#fig4-4)\
  \ 显示了里程碑计划图的示例。\n\n![FIGURE 4-4 里程碑计划图。](img/9781284183)\n\n```\n`FIGURE 4-4 里程碑计划图.`\n\
  ](images/9781284183)\n```\n里程碑计划图\n\n`milestone plan chart` 还可以分配资源。例如，如果防火墙还没有安装，则\
  \ `Install Firewalls` 任务将不会被阴影。PM 可以看到该元素已过期。`milestone plan chart` 还可以分配资源。随着项目任务的完成，图表将在图中自动指示已完成。\n\
  \n#### 甘特图\n\n一个`Gantt chart`(#29_glossary.xhtml#gloss84) 显示项目进度。甘特图在项目管理中常用。里程碑计划图和甘特图的主要区别在于甘特图显示了更多细节。\n\
  \n`FIGURE 4-5`(#13_chapter04_07.xhtml#fig4-5) 显示了甘特图的示例。\n\n![FIGURE 4-5 甘特图。](img/9781284183)\n\
  \n```\n`FIGURE 4-5 甘特图.`\n```\n甘特图\n\n#### 关键路径图\n\n项目中的某些任务可以延迟而不影响项目的完成日期。其他任务必须按时完成。一个`critical\
  \ path chart`(#29_glossary.xhtml#gloss48) 显示必须按时完成的项目任务列表。如果路径上的任务延迟，整个项目将延迟。\n\n\
  \n\n\n\n`FIGURE 4-6` 显示了防火墙项目关键路径图的示例。对比 `Figures 4-5` 和 `4-6`。注意 `Figure 4-6` 中缺少两个任务：`Log\
  \ Firewall Activity`（记录防火墙活动）和 `Create Firewall Policy`（创建防火墙策略）。如果这两个任务稍微延迟，不会延迟整个项目。唯一的要求是它们要在\
  \ `Install Firewalls`（安装防火墙）任务开始之前完成。\n\n![FIGURE 4-6 Critical path chart.](img/9781284183719_CH04_FIGF06.png)\n\
  \n`FIGURE 4-6` 关键路径图。\n\n### NIST 风险管理框架的步骤\n\n美国标准与技术研究院`风险管理框架 (RMF)`（`NIST SP\
  \ 800-37 Rev. 2`）是实施风险管理计划时的参考性指南。`RMF` 是一个将安全和风险管理结合作为系统开发生命周期一部分的流程。它遵循七个步骤：\n\
  \n1. **准备步骤 (Prepare Step)**——包含了所有有助于组织准备管理其安全和隐私风险的必要活动。\n2. **分类步骤 (Categorize\
  \ Step)**——涉及对系统以及任何处理、存储和传输的信息进行分类。\n3. **选择步骤 (Select Step)**——涉及根据安全分类为系统设置一组初始基线控制措施。\n\
  4. **实施步骤 (Implement Step)**——实施安全控制，并记录这些控制在运行系统中的如何使用。\n5. **评估步骤 (Assess Step)**——涉及使用适当的方法对安全控制进行评估，以确定其实施程度，并检查控制是否按预期工作并产生正确的结果。\n\
  6. **授权步骤 (Authorize Step)**——根据对组织运营和资产、人员、技术、其他组织以及国家面临风险的判定，授权系统的运行，以确保该风险对他们是可接受的。\n\
  7. **监控步骤 (Monitor Step)**——重点于持续监控和评估所选的安全控制，评估安全控制的有效性，记录系统运行的变更，对变更进行安全影响分析，并报告系统的安全状态。\n\
  \n### 章总结\n\n风险管理计划是一种特定的项目计划。该项目旨在识别和缓解风险，通过创建目标和项目范围开始。然后识别风险。最后，制定响应计划作为缓解风险的建议。管理层可以选择接受、推迟或修改这些建议。风险管理计划应包含一个风险清单。\n\
  \n随后实施这些建议。用于跟踪建议的主要工具是行动和里程碑计划 (`POAM`)。`POAM` 是一个在整个项目过程中更新的动态文档。可以使用各种图表工具补充\
  \ `POAM` 以减轻项目管理任务。`NIST RMF`（`SP 800-37 Rev. 2`）是实施风险管理计划时的有效指南。\n\n## 核心概念与术语\n\
  \n* `affinity diagram`（亲和图）\n* `brainstorming`（脑风暴）\n* `cause and effect diagram`（因果图）\n\
  * `critical path chart`（关键路径图）\n* `firewall`（防火墙）\n* `firewall appliance`（防火墙设备）\n\
  * `firewall policy`（防火墙策略）\n* `Gantt chart`（甘特图）\n* `milestone`（里程碑）\n* `milestone\
  \ plan`（里程碑计划）\n* `National Institute of Standards and Technology (NIST)`（美国标准与技术研究院）\n\
  * `National Institute of Standards and Technology Risk Management Framework (RMF)`（美国标准与技术研究院风险管理框架）\n\
  * `plan of action and milestones (POAM)`（行动和里程碑计划）\n* `risk statement`（风险陈述）\n*\
  \ `scope`（范围）\n* `scope creep`（范围蔓延）\n* `stakeholder`（利益相关者）\n\n## 第 4 章评估\n\n1.\
