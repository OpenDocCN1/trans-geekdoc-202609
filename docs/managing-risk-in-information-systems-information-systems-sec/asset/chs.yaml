  _\\_\\_`攻击。\n\n4. 用户在系统上安装了 `P2P` 软件，组织政策明确规定这是未经授权的。管理员在用户系统上发现了该软件。这是一个计算机安全事件吗？如果是，是哪种类型？\n\
