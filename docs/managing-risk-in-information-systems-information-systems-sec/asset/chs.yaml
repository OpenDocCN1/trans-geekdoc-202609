  \n回答攻击者为什么要 `why` 攻击有助于理解他们的动机。过去的攻击者往往是因为无聊而攻击的；他们这样做仅仅就像乔治·马洛里（George Mallory）想爬埃穆朗玛峰的原因一样——“因为在那里”。然而，今天的攻击者通常受贪婪驱动，因此他们偷取可以转化为金钱的数据。\n\
  \n### 事件的增长\n\n1988 年 11 月，当莫里斯虫袭击时，互联网上遭受受攻击的计算机成为了新闻焦点。卡内梅隆大学（CMU）建立了 CERT 以此应对，并开始统计事件数量。\n\
  \n`图 15-1` (#26_chapter15_02.xhtml#fig15-1) 显示了多年年来事件的增长情况。1988 年发生了 8 起事件；1998\
  \ 年有 3,734 起；2003 年有 137,529 起。CMU 的 CERT 最后一次报告事件数量是在 2003 年。如果今天仍在跟踪和报告事件数量，这些数字将超出图表范围。除非计算机从未开启或保持完全隔离状态，否则它将会被攻击。\n\
  \n![图 15-1 由 CERT 跟踪的事件历史。](img/9781284183719_CH15_FIGF01.png)\n\n**图 15-1** CERT\
  \ 跟踪的事件历史。\n\n`网络攻击`（cyberattack）和`网络恐怖主义`（cyberterrorism）这两个术语被经常使用，两者都是当今互联网上的重大威胁。\n\
  \n例如，一组著名的攻击者经常窃取信用卡数据，并利用这些数据制作伪造信用卡。然后，他们雇佣女性使用这些卡在商场购物。这些女性在奢华的购物狂欢中尽可能多地购买商品，花费数万美元，随后她们将货物带到商场停车场的一个货车上，在那里，一个`接头`（fence）以低价购买货物并迅速售出。\n\
  \n`what` 识别了发生了什么类型的攻击。它可能是 `DoS` 攻击、恶意软件攻击、未经授权的访问或不当使用。了解发生了什么有助于确定影响并优先考虑响应措施。计算机事件响应小组（CIRT）的计划通常包含用于确定影响和攻击优先级的工具。\n\
  \n接下来，`where` 识别了攻击发生的地点。在至少一个发出报警的系统上会有明显的症状。然而，也应该检查其他系统，以查看它们是否受到了影响。如果影响了多个系统，则可能需要重新评估影响和优先级。\n\
  \n### !![](img/Note.png)注意\n\n本章稍后出现的“事件处理程序”部分展示了确定事件影响和优先级的工具示例。表 15-1 显示了影响级定义的示例，表\
  \ 15-2 显示了关键性评级定义的示例，表 15-3 显示了事件影响评级的示例。\n\n如果可能，应该识别出是谁 `who` 发起了攻击。确定谁发起了攻击的一种有效方法是检查日志。可以检查系统的审计日志、防火墙日志和路由器日志。如果用户通过了身份验证，日志将识别出用于攻击的用户账户。如果攻击来自外部源，日志将识别出一个外部互联网协议（IP）地址，可以通过封该地址来停止攻击。\n\
  \n### 技术提示\n\n攻击者经常劫持其他系统来发动攻击。例如，控制僵尸网络的攻击者向僵尸主机发送命令，由僵尸主机发动攻击；或者攻击者可以简单地开车，直到找到一个开放的无线网络，攻击者可以使用该网络发动攻击。追溯到此无线网络的攻击无法识别出真正的攻击者，但会识别出无线网络。等到攻击追溯到\
  \ IP 地址时，真正的攻击者早已去了。\n\n识别攻击发生的 `when` 远比识别发现症状的时间要复杂。攻击者在攻击前通常会进行侦察，日志条目可能显示在过去的一周内从同一个源发生过多次侦察攻击。\n\
  \n回答攻击者为什么要 `why` 攻击有助于理解他们的动机。过去的攻击者往往是因为无聊而攻击的；他们这样做仅仅就像乔治·马洛里（George Mallory）想爬埃穆朗玛峰的原因一样——“因为在那里”。然而，今天的攻击者通常受贪婪驱动，因此他们偷取可以转化为金钱的数据。\n\
  \n### 事件的增长\n\n1988 年 11 月，当莫里斯虫袭击时，互联网上遭受受攻击的计算机成为了新闻焦点。卡内梅隆大学（CMU）建立了 CERT 以此应对，并开始统计事件数量。\n\
  \n`图 15-1` (#26_chapter15_02.xhtml#fig15-1) 显示了多年年来事件的增长情况。1988 年发生了 8 起事件；1998\
  \ 年有 3,734 起；2003 年有 137,529 起。CMU 的 CERT 最后一次报告事件数量是在 2003 年。如果今天仍在跟踪和报告事件数量，这些数字将超出图表范围。除非计算机从未开启或保持完全隔离状态，否则它将会被攻击。\n\
  \n![图 15-1 由 CERT 跟踪的事件历史。](img/9781284183719_CH15_FIGF01.png)\n\n**图 15-1** CERT\
  \ 跟踪的事件历史。\n\n这些事件的名称多年来发生了变化。`网络攻击`（cyberattack）和`网络恐怖主义`（cyberterrorism）这两个术语被经常使用，两者都是当今互联网上的重大威胁。\n\
  \n例如，一组著名的攻击者经常窃取信用卡数据，并利用这些数据制作伪造信用卡。然后，他们雇佣女性使用这些卡在商场购物。这些女性在奢华的购物狂欢中尽可能多地购买商品，花费数万美元，随后她们将货物带到商场停车场的一个货车上，在那里，一个`接头`（fence）以低价购买货物并迅速售出。\n\
  \n\n\n\n\n- **网络管理员**——网络管理员了解网络的细节，例如哪些系统相互连接、它们是如何连接的，以及通过互联网可以访问哪些系统。他们了解正常的流量流，并能够识别异常流量。\n\
  - **物理安全**——由于攻击者可能是社会工程学人员，并且可能出现在公司场所，因此团队中需要物理安全人员。他们了解组织使用了哪些物理安全控制措施、这些措施所在的位置及其目的。他们还了解组织内部使用的不同类型的监控方法，例如视频摄像头及其功能。\n\
  - **法律人员**——法律人员在事件发生前、期间和之后，对组织的法律责任和法律救济措施提供建议。法律人员了解可以对攻击者采取哪些法律行动，以及追究法律行动所需的条件。\n\
  - **人力资源 (HR)**——如果攻击源于员工，则需要人力资源部门参与，因为人力资源部门了解组织的政策并知晓可行的执行方法。例如，如果员工违反了`AUP`（接受使用政策），第一次违规可能导致正式的书面警告，而第二次或第三次违规可能导致解雇。人力资源人员会知道员工之前是否收到过警告。\n\
  - **通讯**——如果事件公开，公共关系（PR）人员将成为组织的门面。他们帮助展示出坚定的形象，即使一切并不完全完全在控制之中。如果没有使用公关代表，团队成员可能会对攻击表达挫败感或困惑，这可能会给组织的客户、供应商和股东留下糟糕的印象。\n\
  \n## 职责\n\n计算机应急响应小组（CIRT）有几项职责，例如协助制定计划、响应事件以及记录事件。团队的每个成员对团队负有特殊的技能和责任。然而，团队整体也有特定的职责。\n\
  \nCIRT 的一些主要职责包括：\n\n- **制定事件响应程序**——这些程序可以是响应任何类型事件的通用程序，也可以是针对不同类型事件的详细检查清单。例如，恶意软件感染和\
  \ `DoS` 攻击可能各有其自己的检查清单。\n- **调查事件**——当事件发生时，CIRT 负责响应并调查事件。根据事件的优先级和影响，可能由单个团队成员进行响应。对于高优先级、高影响的事件，整个团队可能会参与响应。\n\
  - **确定事件原因**——调查的目标之一是确定原因，因为通过理解原因，CIRT 能够更好地确定最佳响应方案。例如，用户从家里带了一个受感染的通用串行总线 (`USB`)\
  \ 闪盘。在插入系统后，杀毒软件检测并隔离了它。因此，原因是用户通过 `USB` 闪盘将病毒从家里传输到了工作电脑。幸运的是，杀毒软件检测到了，但遗憾的是，某些病毒会绕过杀毒软件。这种类型的事件导致许多组织在其网络上禁止使用\
  \ `USB` 闪盘。\n- **建议控制措施以防止未来发生事件**——CIRT 成员通常知道防止相同事件再次发生的最佳解决方案。即使他们还不知道，他们也有专业知识和经验来识别控制措施，这可能简单到升级安全策略，也可能更复杂，需要购买和安装硬件或软件。无论如何，CIRT\
  \ 成员都会提供建议。\n- **保护收集的证据**——证据在收集时不应对其进行修改。例如，警察不会走过犯罪现场的血迹，因为这样做会影响证据。同样，CIRT 成员不应修改证据（例如访问文件或关闭计算机），除非他们需要捕获\
  \ `RAM` 内容。他们使用位拷贝工具复制硬盘，以在不修改数据的情况下获得完整副本。\n- **使用监管链**——CIRT 成员负责在收集证据后立即管理证据。`监管链`（chain\
  \ of custody）有助于确保稍后提交的证据与最初收集的证据是同一个。它应该在获取证据时建立，并在证据的整个生命周期内维护。监管链日志记录了在任何时刻拥有证据，以及证据何时被存放在半永久存储位置中。\n\
  \n## 计算机取证\n\n计算机取证在近几年变得更加流行。正如电视剧《CSI 调查》中的法证专家可以从犯罪现场发现隐藏的细节一样，计算机取证专家可以在计算机上发现隐藏的细节。\n\
  \n计算机取证调查通常分为三个阶段：\n\n- **获取证据**——在此阶段，使用工具箱在不修改数据的情况下捕获系统数据。例如，位拷贝工具可以创建硬盘的完整镜像，而不会修改硬盘上的任何位。此外，为了防止数据被修改，首响应人员不得访问任何文件或关闭系统。\n\
  - **验证证据真实性**——监管链表单跟踪证据，以证明数据在收集后受到了保护和控制，这验证了证据的可信度。如果不使用监管链，证据可能无法在法庭上采纳。\n-\
  \ **分析证据**——在此阶段对数据进行检查和查看。如果数据包含磁盘文件，则对磁盘的副本进行分析。如果需要验证原始数据，调查人员会从原始磁盘创建另一个副本并分析。\n\
  \n计算机取证是计算机专业领域一个不断发展的领域。许多 IT 专业人士正在扩展安全知识并成为计算机取证专家。\n\n任何组织的 CIRT 计划可能会列出上述职责，并根据其需求或预期列出\
  \ CIRT 的额外职责。例如，成员可能被要求订阅不同的安全公告或采取其他步骤以确保他们了解当前的风险。\n\n### 问责制\n\nCIRT 还对组织负责对任何事件做出积极响应。虽然事件无法避免，但团队被要求尽可能地减少事件的影响。\n\
  \n组织通常在团队成员身上投入大量的时间和资金。目标是确保他们接受过培训并能够处理事件。\n\n### CIRT 政策\n\nCIRT 计划还包含 CIRT 政策。这些政策可能是简单的声明，也包含在计划末尾的附中。它们在事件过程中为团队提供指导。\n\
  \n要考虑的主要政策之一是 CIRT 成员是否可以进行反击。换句话说，在调查事件期间，团队成员可能会对攻击者发起攻击。他们应该这样做吗？\n\n\n\n\n答案几乎总是响响的否定。首先，可能存在法律后果。即使小偷从公司偷了东西，公司也不能以此为借口去偷回他们的东西，因为如果公司被抓到，可能会被起诉。“但是他先这么做的”这种辩护并不会给法官留下印象。同样，即使攻击者在攻击公司网络时违反了法律，公司也没有理由通过违反法律来实施反击。\n\
  \n如果公司进行反击，还面临着使其与攻击者之间的事件升级的风险。例如，如果一个人在繁忙的街道上撞到另一个人，他们都可以说声“对不起”，事件就结束了。即使其中一个人很无礼并故意撞到另一个人，如果被撞的人说“对不起”并离开，事件也结束了。然而，如果被撞的人转身对对方大拳大舞、推搡并大喊，那么事件就没有结束。相反，事件将升级为冲突，其结果取决于哪一方愿意给对方造成最大的伤害。\n\
  \n同样，如果攻击者攻击公司网络并失败了，他或她可能只是转向一个更容易的目标。然而，如果公司反击攻击者，事件将会升级。攻击者现在可能将公司的攻击视为人身攻击，他或她将一心于入侵网络并造成尽可能大的破坏。\n\
  \n考虑到这一点，思考攻击者可能在攻击上花费多少工作小时是值得的。如果涉及到个人利益（例如数百万美元），短期内每天工作 12 小时或每周工作 80 小时是可行的。同样，如果攻击者对一个胆敢反击的组织有个人私仇，他或她可能会投入所有的清醒时间来满足这股复仇之情。\n\
  \n简而言之，最佳实践不要将攻击升级为双边冲突。将任何报复行为留给执法部门。攻击者给组织造成的损害和成本可能比公司给攻击者造成的要得多，这让组织几乎没有理由招致更多类似的攻击。这并不是说组织永远不应该反击。警察、政府和军事机构可能拥有特定的单位，他们接受过攻击训练，以收集犯罪活动的证据，或对政府的敌人实施有针对性的网络战争。然而，如果这不是组织的使命，请克制不要反击。\n\
  \nCIRT（计算机应急响应小组）包含的其他策略可能还包括与证据、通信和安全相关的策略。调查期间收集的证据可能需要在未来用于起诉人员。然而，存在管理证据收集和存储的规则，CIRT\
  \ 计划可以包含定义这些规则的政策。\n\n对于没有该领域经验的人来说，与媒体沟通可能是具有挑战性的。然而，CIRT 应该有一个公关人员。一个简单的政策可以规定，唯一可以与媒体讨论任何事件的人是公关人员。如果媒体询问其他人，回答是将该问询转给公共关系办公室或特定的公关人员。\n\
  \n尽管计算机事件没有像飓风或地震等灾难那样危险，但可能涉及某些危险。CIRT 计划通常规定人员安全是最重要的，不应采取危及任何人员安全的行动。\n\n## 事件处理流程\n\
  \nCIRT 计划确定了事件处理过程，根据其详细程度，这可能是计划的很大一部分。`NIST SP 800-61 Rev. 2, 计算机安全事件处理指南`概述了事件的四个阶段。`图\
  \ 15-2`\n\n**图 15-2** 事件响应生命周期。\n\n`NIST SP 800-61 Rev. 2` 中概述的四个阶段描述如下：\n\n*  \
  \ **准备**——准备工作包括制定 CIRT 计划、定义事件以及建立 CIRT。团队成员接受培训，并有特定的角色和职责。他们知道如何识别、遏制和缓解事件。\n\
  *   **检测与分析**——此阶段使用各种控制措施来检测事件，包括 `IDS` 和防病毒软件。由于检测到的某些事件可能实际上并不是事件，因此需要对其进行调查和分析，以确定它们是真实的事件还是误报。\n\
  *   **遏制、根除和恢复**——在检测到事件后，需要尽快对其遏制。这种遏制可以简单地从受影响系统的网络接口卡（`NIC`）上拔掉线，从而攻击源。例如，如果系统被恶意软件感染，则应该对恶意软件进行隔离或清除。然后，系统可以恢复正常运行。攻击通常包含几个元素。在清除一个元素后，通常必须重复检测和分析步骤。这一过程不断重复，直到确认所有恶意元素都已清除。只有那时，才启动事件后恢复阶段。\n\
  *   **事件后恢复**——此阶段包括事回顾，通过对事件和响应进行检查，以确定可以在哪些方面改进响应。在必要时，会相应修改 CIRT 计划。\n\n准备阶段对于任何类型的事件都是相同的，因为组织内的人花时间进行计划和准备。同样，事件后恢复阶段对于任何事件都是相同的。然而，中间两个阶段通常不同。接下来的章节将讨论不同类型的事件，并包括预防、检测和响应它们的方法。\n\
  \n### 处理 DoS 攻击事件\n\nDoS 攻击试图通过过度消耗系统消耗资源来防止系统或网络提供服务。任何系统都有四种主要资源：处理器、内存、磁盘和带宽。当这些资源响应攻击时，它们就无法用于正常操作。\n\
  \nDDoS 攻击从多个系统发出，这些系统通常在僵尸网络中控制。`图 15-3`\n\n**图 15-3** 从僵尸网络发发的 DDoS 攻击。\n\n###\
  \ ![](img/Note.png)注意\n\n僵尸网络通常包含数万台计算机。网络犯罪分子管理僵尸网络并将其访问权限租给其他犯罪。例如，攻击者可以租用访问权限对特定服务器发动\
  \ DDoS 攻击。\n\nDoS 攻击针对单一系统。多种迹象表明正在发生 DoS 攻击。这些包括：\n\n*   用户报告系统不可用\n*   IDS 攻击受攻击系统资源使用增加\n\
  *   通过防火墙到达受攻击系统的流量增加\n*   无法解释的连接丢失\n*   无法解释的系统崩溃\n\n可以通过查看可用日志确认怀疑的攻击。系统日志包含系统活动信息，防火墙日志可以显示指向系统的网络流量，`IDS`\
  \ 收集的日志可以识别许多特定类型的攻击。\n\n\n\n\n响应取决于攻击的类型。如果攻击是由于漏洞引起的（例如未打补丁的系统），首要响应应该是修复漏洞，在这种情况下即对系统打补丁。许多攻击可以在网络防火墙处被拦截，其他攻击可以在系统防火墙处被拦截。\n\
  \n许多入侵检测系统（IDS）包含自动响应能力，例如更改防火墙规则以拦截特定类型的流量。例如，如果攻击是基于互联网控制消息协议（ICMP）的，IDS 可以配置防火墙来拦截\
  \ ICMP 流量。如果攻击是同步（SYN）洪水攻击（即截留传输控制协议（TCP）握手的第三个数据包），IDS 可以配置防火墙来拦截来自攻击者 IP 的流量。\n\
  \n如果 IDS 系统没有对攻击做出自动响应，可以手动进行更改。目标是识别攻击源，并修改防火墙规则以拦截流量。可以在路由器或防火墙上修改基本的数据包过滤规则。可以根据\
  \ IP 地址、端口以及像 ICMP 等协议来拦截流量。\n\n还可以招募互联网服务提供商（ISP）协助响应，通过过滤流量使攻击甚至无法到达网络。\n\n###\
  \ ![](img/Note.png) 注意\n\n尽管 SYN 洪水攻击是一种较老的 DoS 攻击，但攻击者仍然在使用它。他们通过互联网发起 SYN 洪水攻击。\n\
  \n### ![](img/Tip.png) 提示\n\nNIST SP 800-83 Rev. 1《桌面级和笔记本电脑恶意软件事件预防与处理指南》包含了关于如何处理恶意软件事件的细节。\n\
  \n### 处理恶意软件事件\n\n恶意软件事件是任何恶意软件（如病毒和蠕虫）的结果。存在许多类型的恶意软件，每天都有新的病毒出现。某些种类包括：\n\n* `Viruses`——病毒附着在应用程序上，并在程序执行时运行。它们有三个阶段：复制、激活和目标。它们的第一个目标是复制到其他应用程序，并在某个时间，它们会激活并执行目标，即病毒载荷。这是程序中最危险的部分，病毒在此会对系统或网络造成损害。在某些情况下，目标可能是联系僵尸网络中的控制服务器以下载额外的恶意软件。\n\
  \n* `Worms`——蠕虫是自我复制的程序。它们不需要像病毒那样需要宿主程序，但通常包含一个病毒组件。它们利用蠕虫组件在网络上传输，当到达系统时，它们会安装病毒。\n\
  \n* `Mobile code`——移动代码包括不同类型的恶意软件，当用户访问网站或打开电子邮件时执行。使用的某些语言和方法包括 `Java`、`ActiveX`、`JavaScript`\
  \ 和 `VBScript`。\n\n* `Trojan horses`——洛伊木马看起来是有用的东西，但也包含恶意组件。例如，它可能看起来像一个游戏或屏幕保护程序，但也包含了恶意软件。即使卸载了原始应用程序，某些洛伊木马仍会保持恶意软件安装。\n\
  \n### 参考\n\n洛伊木马以希腊神话中的木马命名。这匹木马看起来像是神灵送给特洛人的礼物，因此特洛伊的居民将马推入城门，并日日夜夜地派对庆祝他们的好运。但是，当城市入睡时，隐藏的攻击者就爬了出来。\n\
  \n防止恶意软件的首要措施是教育用户，次要措施是使用防病毒软件。可以采取的基本保护步骤之一是确保所有服务器都经过加固。加固服务器的步骤包括：\n\n* **减少攻击面**——如果不使用某些服务，请将其禁用。如果不使用某些协议，请将其删除。如果攻击者使用服务器上未安装的协议发起攻击，服务器将受到保护。\n\
  \n* **保持系统更新**——软件供应商发布补丁和更新，以消除导致安全漏洞的缺陷。必须定期应用这些更新以保护系统。\n\n* **启用防火墙**——防火墙过滤所有流量，以确保不受欢迎流量到达漏洞系统。基于网络的防火墙为网络中的计算机提供一层保护，基于主机的防火墙提供另一层保护。因此，应启用两种类型的防火墙。\n\
  \n### 处理未经授权的事件\n\n未经访问事件是指某人在未获得授权的情况下获取资源的访问。有时，未经授权的访问可能是意外获得的。例如，如果管理员为用户授予了过多的权限，用户可能会发现机密数据。然而，本节的重点是攻击者获取未经授权的访问，他们可以通过社交工程或技术攻击来实现。\n\
  \n一旦获得访问权限，攻击者就会尝试利用它，通常通过权限提升获取额外的访问权限。未经访问事件的示例包括：\n\n* 攻击并破坏 Web 服务器\n* 从文件传输协议（FTP）服务器上上传或下载数据\n\
  * 未经许可使用无人值的工作站\n* 未经授权查看或复制敏感数据\n* 使用社交工程技术收集组织数据\n* 猜测或破解密码并使用这些凭据登录\n* 运行数据包嗅器（如\
  \ `Wireshark`）来捕获网络上传输的数据\n\n\n\n\n\n# 启用 IDS\n\nIDS（入侵检测系统）通过被动或主动方式检测攻击。被动 IDS\
  \ 在检测到攻击后提供通知，而主动 IDS 则可以在损害发生前修改环境并阻止攻击者。\n\n此外，基本的访问控制也能提供保护。这些控制措施确保所有用户在访问资源之前必须在网络上进行身份验证。此外，最小权限原则确保用户仅访问其所需的数据，而不会超出范围。\n\
  \n如果没有用于网络进行身份验证的凭据，外部攻击者无法成功获得访问。然而，缺乏访问权限并不能阻止他们使用社会工程学策略，通过欺骗或诱导用户交出宝贵信息（如用户名和密码）来获取网络凭据，然后他们就可以利用这些信息发起攻击。\n\
  \n未经授权的访问事件可以通过多种方法检测到。IDS 往往会在攻击发生前对侦察活动发出警告。例如，攻击者可能会扫描服务器的开放端口，以确定正在运行哪些协议。因此在侦察攻击中获得的数据随后会被用于访问攻击。\n\
  \n受过良好教育的用户可以通过识别社会工程师用来诱导他们交秘密的欺骗和诡计，检测出社会工程学的尝试。一旦用户识别出这些尝试，他们就可以向管理员报告。当然，未受过教育的用户往往在没有意识到自己所做的情况下交出秘密，因为大多数人天生乐于助，而这种特质被社会工程师所利用。\n\
  \n然而，某些攻击没有被检测到，因为攻击者可以访问数据库中的数据并在人们察觉之前消失。即使访问记录了日志，实际事件可能仍未被检测到。很多时候，直到后来发现问题时，才意识到未经授权的访问已经发生。被盗的数据可能是研发数据（现在正被竞争对手使用），或者是客户的信用卡信息。例如，2013\
  \ 年底针对 Target 公司的攻击持续了数周，但直到美国司法部通知该公司之前，Target 都没有发现数据泄露。\n\n响应措施取决于攻击类型，但任何攻击中最重要的元素是抑制。如果检测到攻击正在进行，目标是隔离受影响的系统，但不一定将其与所有用户隔离。相反，系统可以仅与攻击者隔离开。例如，可以修改防火墙规则来封攻击者的\
  \ IP 地址。\n\n如果问题源于被破解的账户，可以禁用该账户；但如果该账户是高级账户（例如具有高权限的账户），可能已经用它创建了其他账户。例如，攻击者可能窃取管理员账户的凭据，并在登录后立即创建另一个具有管理权限的账户。因此，即使第一个账户被锁定，攻击者仍然可以使用第二个账户。\n\
  \n## 处理不不当使用事件\n\n当用户违反内部政策时，就会发生不不当使用事件，但这些事件通常没有外部事件那么严重。然而，根据活动内容，这些事件可能会非常严重，并导致组织资金损失。\n\
  \n### 提示\n\n攻击者通常会扫描系统以确定哪些端口是开放的，因为许多协议都使用已知端口。如果端口是开放的，攻击者就会意识到相关协议可能运行在服务器上。例如，如果端口\
  \ `80` 是开放的，则超文本传输协议（HTTP）最可能运行在服务器上，这表明该服务器可能是一个 Web 服务器。\n\n不不当使用的示例包括用户执行以下行为：\n\
  \n*   向同事发送垃圾邮件\n*   访问被禁止的网站\n*   刻意绕过安全策略\n*   使用文件共享或 P2P 程序\n*   向组织外发送带有敏感数据的文件\n\
  *   从组织内部对其他计算机发起攻击\n\n安全策略有助于防止许多此类事件，并通常要求制定 `AUP`（接受使用政策），它规定了哪些是和不是可接受的使用。例如，`AUP`\
  \ 可能规定禁止使用电子邮件广告个人业务，或使用互联网访问赌博或色情网站。同样，策略通常禁止使用匿名网站。大多数代理服务器都可以检测并阻止对匿名器的访问。组织通常会惩戒违反\
  \ `AUP` 的用户。\n\n`AUPs` 通常限制 `P2P` 软件的使用，人们经常使用它来下载和分享盗版音乐、视频和应用程序。然而，`P2P` 软件的主要问题之一是数据泄露，当\
  \ `P2P` 软件在用户不知情的情况下共享用户数据就会发生。例如，用户的计算机上可能存有个人数据文件（如密码或信用卡信息），而 `P2P` 程序可能会将这些文件分享给其他人。这是典型的数据泄露。`P2P`\
  \ 程序在用户不知情的情况下共享了系统上的数据。\n\n### 技术提示\n\n匿名网站试图隐藏用户的活动。当用户访问匿名器并通过它浏览网站时，匿名器获取网页的方式就好像这些网页源于它一样。例如，用户可以通过匿名器访问赌博网站，如果内部代理服务器跟踪了该活动，就能识别出来自匿名器的流量。在许多组织中，仅仅使用匿名器就被视为违规。违规事件可以通过多种方法发现，包括告警、日志审查和用户报告。由于防火墙和代理服务器会记录通过它们的所有流量，可以对其进行扫描以判断用户是否违反策略。此外，`IDS`\
  \ 可以配置为自动检测并报告。\n\n许多组织还使用数据泄露（DLP）软件，管理员可以配置与专利数据相关的关键词以及查找个人身份信息（PII）。例如，社会安全码包含九个数字和两个破折号。\n\
  \n### 海军一号机计划共享\n\n2008 年，一家承包商无意中将用于接送总统的新型海军一号机计划分享给了互联网上的所有人。\n\n该承包商在家里和工作的计算机上安装了\
  \ `P2P` 应用程序。在某个时刻，海军一号机的计划和其他秘密数据进入了承包商的计算机。该计算机的用户可能并没有意识到这一点，但 `P2P` 程序正在共享该计算机上的数据，其中就包含了海军一号机的秘密数据。\n\
  \n\n\n\n请注意，尽管数据在 2008 年夏天就已经泄露，但直到 2009 年才被媒体报道，这引引发了一个问题：还有多少数据被泄露但未在新闻中报道？2010\
  \ 年，美国联邦贸易委员会警告企业和政府，通过 `P2P` 网络泄露健康、财务和社安数据存在着重大的数据泄露风险。因此，绝大多数组织都禁止使用 `P2P` 软件，用户通常认为他们这样做是为了控制盗版。然而，真实原因是与数据泄露相关的极高风险。\n\
  \n检测不当用的另一种方法是通过其他用户。例如，员工可能会收到来自另一名员工的垃圾邮件，广告某个业务或推广宗教，或者他们可能会在违规者的电脑上看到不当图像。当员工报告这些事件时，组织会做出响应。\n\
  \n主要的响应是基于现有的策略，包括安全策略和 `AUP`。如果不存在策略，则需要创建。如果员工违反了策略，则是员工的错；但如果不存在策略，则可能是组织的错。\n\
  \n除了拥有策略外，还有一点是显而易见的事实：策略必须被执行。有些组织只是走形式地创建策略，但当需要执行它们时，他们却视而不见。在这种情况下，员工会很快意识到存在两套策略：一套是写在纸上但不执行的，另一套是不文的常规范。\n\
  \n## 处理多组件事件\n\n多组件事件是一个包含两个或多个其他事件的单一事件，这些事件相互相关，但并不总是一而易见的。例如，在一个多组件事件的第一个事件中，组织的一名用户收到了一封带有恶意软件附件的电子邮件，当打开时，它感染了用户的系统。\n\
  \n该恶意软件有三个目标。首先，它释放一个蠕虫组件，寻找组织网络上的计算机并感染它们。这是第二个事件。\n\n接下来，恶意软件连接互联网上一个管理 `botnet`\
  \ 的服务器。在这种角色下，组织的受感染系统充当了 `zombie`。它等待来自 `botnet` 控制服务器的命令，然后执行命令要求它做的任何事情。\n\n\
  由于组织的受感染系统已经感染了网络上的其他系统，多个系统很容易被感染，而且这些每个系统都在寻找其他系统进行感染。它们在 `botnet` 中也充当着 `zombies`。\n\
  \n接下来，`botnet` 控制服务器向所有受感染系统发布命令，指导它们对一个互联网服务器发起攻击。受感染网络中的所有 `zombies` 随后发动攻击，这就是第三个事件。\n\
  \n从受攻击服务器的角度来看，受感染的组织看起来是在发起攻击。被攻击的一方可能会查询受感染组织的 `ISP` 并报告这些攻击。`ISP` 可能会威胁停止受感染组织的服务。请注意，`ISP`\
  \ 的联系可能是受感染组织出现问题的第一个迹象，因为问题在之前可能并未被察觉。\n\n在这种情况下，主要的防护措施是杀毒软件，并确保杀毒软件是最新的。最新的杀毒软件可以减少系统被感染的概率。然而，最新的杀毒软件并不能保证系统不会被感染。它只是降低了概率。系统总是受到新出现和新兴威胁的威胁。\n\
  \n### 注意\n\n在这种情况下，主要的防护措施是杀毒软件，并确保杀毒软件是最新的。最新的杀毒软件可以减少系统被感染的概率。然而，最新的杀毒软件并不能保证系统不会被感染。它只是降低了概率。系统总是受到新出现和新兴威胁的威胁。\n\
  \n### Tips\n\n在这种情况下，主要的防护措施是杀毒软件，并确保杀毒软件是最新的。最新的杀毒软件可以减少系统被感染的概率。然而，最新的杀毒软件并不能保证系统不会被感染。它只是降低了概率。系统总是受到新出现和新兴威胁的威胁。\n\
  \n#### 通信升级\n\n当有人确定某个事件是一个安全事件时，他或她会宣布如此，这被称为“升级”。在宣布事件时要采取的第一步之一是召回一个或多个 `CIRT`\
  \ 成员，这可以通过电话树或任何其他类型的召回完成。\n\n但事件可能会变得更糟。例如，最初报告可能是单台电脑上的病毒，但 `CIRT` 成员可能会发现恶意软件正从邮件服务器发送到每个客户端。看起来像是个小问题现在现在具有变成灾难性后果的潜力。在这种情况下，`CIRT`\
  \ 成员可以升级响应，并在必要时，组织可以激活整个 `CIRT`。\n\n在事件期间，通信非常重要，但可能会受到阻。例如，电子邮件或即时消息系统可能无法使用。如果这些是主要的通信方法且没有备用计划，通信将变得充满挑战。\n\
  \n## 组织的声誉\n\n组织外的通信也需要处理。如果媒体听到一起事件，他们将开始提问。组织内部人员回答这些问题的方式会影响其声誉。即使组织对事件的响应非常出色，如果对媒体的回应是混乱或矛盾的，可能会导致负面宣传。\n\
  \n最好的选择是寻求 `PR` 专家的帮助，理想情况下，`CIRT` 将包含一名 `PR` 人员。所有人员都应该理解，所有的媒体查询都应该通过这名 `PR` 人员。\n\
  \n`PR` 专家知道如何与与媒体通信。即使在重大事件期间，他们也能够以良好的光形象呈现组织，这并不是说他们知道或提供了所有的答案，但他们确实知道如何给出诚实、积极的答案。\n\
  \n技术人员可能会说类似的话：“这个蠕虫把我们击垮了。我从未见过这么多系统宕机，我不知道该怎么让它们恢复。”\n\n`PR` 人员可能会说：“我们遭了攻击。我们采取了一些控制措施，但这次攻击似乎非常复杂，并同时击中了我们网络的多个部分。我们的计算机事件响应小组正在现场。就在此时，他们正在调查问题的根源并解决它们。”\n\
  \n\n\n\n两种陈述都是准确的，但第一种陈述呈现出一种混乱或失去控制的。虽然技术人员的陈述可能是准确，但它可能会对组织的声誉产生负面影响。另一方面，公关陈述也是准确的，但它维护了组织的声誉。\n\
  \nDRP（灾恢复计划）通常包含潜在通信问题的解决方案，这些解决方案也适用于计算机事件。例如，可以为 `CIRT` 成员配备对按即通电话或对讲机，或者建立一个战室用于面对面交流。战室可以常驻人员，团队成员可以向那里的的人员报告发现的结果。\n\
  \n## 事件处理程序\n\n当怀疑发生事件时，可以使用清单来指导行动。这些清单可以被包含在 `CIRT` 计划中，作为响应事件的程序。IT 专业人员和 `CIRT`\
  \ 成员在响应事件时可以使用这些清单。\n\n虽然无法为每种可能的事件都创建清单，但可以针对不同类型的事件进行定制。例如，可以创建一个通用的清单来匹配大多数事件，然后创建其他清单来识别不同类型事件的特定事项。\n\
  \n### 计算影响和优先级\n\n处理事件时，重要步骤之一是识别其影响和优先级，`CIRT` 计划可以包含帮助人员确定这两者的工具。成员随后可以在事件期间参考这些工具进行澄清。\n\
  \n例如，`表 15-1`中的数据识别了攻击的影响。`CIRT` 成员将风险的实际影响与定义进行比较，从而提供一个值或评分。例如，一个组织在全国范围内有多个地点。对任何地点都没有影响是极小影响。对单个地点产生严重影响是中等影响。对多个地点产生严重影响被认为是关键性影响。这些评分中的每一个都被分配了一个数值。\n\
  \n**表 15-1** 影响等级定义\n\n| 定义 | 等级 | 数值 |\n| --- | --- | --- |\n| 对任何地点或关键基础设施没有影响\
  \ | 极小 | 10 |\n| 对单个地点产生严重影响或对多个地点产生极小影响 | 中等 | 50 |\n| 对多个地点产生严重影响 | 关键 | 90 |\n\
  \n`表 15-1`中的值用于确定当前和预测的影响。例如，一个 `DoS` 攻击可能针对 Web 农场中的多个 Web 服务器之一发起。只要只有一个服务器受到攻击，影响就可能是极小的。然而，如果攻击不及时解决，它可能会影响\
  \ Web 农场中的所有服务器。预测的影响可能被认为是中等水平。\n\n#### 注意\n![](img/Note.png)\n\n本节中的清单源自 `NIST\
  \ SP 800-61 Rev. 2`《计算机安全事件处理指南》。\n\n`表 15-2`\n\n这些示例中使用的定义、值和评分可以扩展以适应任何组织。例如，一个组织可以有五个值和评分而不是三个。根据组织的需要，也可以使用不同的值、评分、甚至定义。\n\
  \n接下来，使用表 15-1 和表 15-2 中的评分来确定总分。只要可能，都应该确定当前和预测的影响：\n\n*   **当前影响评分**——极小，因为攻击目前只影响\
  \ Web 农场中的一个 Web 服务器。分数为 10。该评分将用于总影响分的 25%，即四分之一（`10 × .25 = 2.5`）。\n*   **预测影响评分**——中等，因为攻击具有扩散到\
  \ Web 农场中更多 Web 服务器的潜力。分数为 50。该评分将用于总影响分的 25%，即四分之一（`50 × .25 = 12.5`）。\n*   **关键性评分**——中等，因为该\
  \ Web 服务器 确实影响了单个地点的任务关键性系统。分数为 50。该评分将用于总影响分的 50%，即二分之一（`50 × .50 = 25`）。\n\n然后可以使用以下公式来确定影响：\n\
  \n```\n(当前影响评分 × .25) + (预测影响评分 × .25) + (关键性评分 × .50)\n(10 × .25) + (50 × .25)\
  \ + (50 × .50)\n2.5 + 12.5 + 25\n事件影响分 = 40\n```\n\n在确定事件影响分后，就可以对事件的影响评分。[`表 15-3`](26_chapter15_03.xhtml#tab15-3）显示了事件评分示例。注意，40\
  \ 分表示该事件具有中等影响。\n\n**表 15-3** 事件影响评分\n\n| 分数 | 等级和优先级 |\n| --- | --- |\n| 0 到 25\
  \ | 极小，低优先级 |\n| 26 到 50 | 中等，中等优先级 |\n| 51 到 100 | 关键，高优先级 |\n\n这些数字可能会令人困惑，特别是在危机期间，但可以创建一个工具来自动计算。例如，可以创建一个在评分旁边带有复选框的电子表格。创建评分需要进行一些计算，但可以将其隐藏并锁定。`CIRT`\
  \ 成员只需要打开电子表格并选择适当的复选框。\n\n### 使用通用清单\n\n一旦确定了影响和优先级的计算，就可以创建清单。以下清单是通用清单示例：\n\n\
  *   **验证事件已发生**——这种验证确保该事件是真实的事件，而不仅仅是误报。例如，某些 `IDS` 在活动并非实际事件时会就异常活动发送警报。\n*  \
  \ **确定事件类型**——确定事件是 `DoS`、`恶意软件`、`未经授权的访问`、`不当使用`还是多种类型的事件。如果存在事件清单，请从 `CIRT` 计划中检索。某些事件可能需要专家，如果需要，则必须召回相应的专家。\n\
  *   **确定事件的影响或潜在影响**——确定攻击的范围。例如，攻击可能是影响了单个工作站的病毒、影响了多个服务器的蠕虫，或者是导致了每小时产生收入超过 20,000\
  \ 美元的主 Web 服务器的 `DoS` 攻击。如果影响很大，产生的响应将具有高优先级。\n*   **报告事件**——如果报告事件的人不是 `CIRT` 成员，他/她应该向\
  \ `CIRT` 成员报告事件。可能的，应包含事件的影响和严重性，并向管理层报告事件。高影响事件应尽快报告，低优先级事件可以在得到控制后报告。\n\n\n\n\n\
  \n-   **获取有关事件的任何可用证据**——必须保护证据。因此，一旦收集到证据，应立即建立监管链（chain of custody）。监管链日志应包含接收证据的时间、日期和接收人员的姓名。如果证据从一个人移交给另一个人或存入存储器，必须更新监管链日志，且不得对证据进行修改。不应访问任何文件或关闭任何系统，因为访问文件会修改证据，而关闭系统会删除其内存中的数据。\n\
  \n-   **遏制事件**——必须防止事件扩散到其他系统并对系统进行隔离，这可以通过移除系统中的 `NIC` 或将其禁用来实现。如果有多个系统受到影响，则必须隔离网络，这可以通过隔离网络上的所有系统或隔离网络设备来实现。例如，可以关闭或重新配置路由器以隔离一个子网。\n\
  \n-   **消除事件**——必须识别出被利用的漏洞，并确定减少这些漏洞所需的必要步骤。如果涉及恶意软件，必须将其完全移除。如果攻击针对面向公众的服务器，则必须对该服务器进行加固以防止再次攻击。\n\
  \n-   **从事件中恢复**——一旦事件被消除，系统就可以恢复到正常运行。根据系统和受损情况，系统可能只需要重启，或者可能需要完全重建或重新应用系统映像。如果重建了系统，在恢复运行之前必须进行补丁更新并到最新版本，然后在运行后验证其运行正常。\n\
  \n-   **记录事件**——文档包含许多元素，其中之一是描述事件的行动后报告，该报告包含了事件期间收集的所有细节，以及为消除事件和从事件中恢复而采取的所有步骤。如果创建了监管链，必须与任何收集的证据一起维护，这些证据以后可能被需要。\n\
  \n以下章节显示了可以用于其他类型事件清单的信息。计算机事件响应小组（CIRT）成员在响应事件时，可以使用通用清单也可以可以使用特定类型的清单。\n\n###\
  \ 处理 DoS 攻击事件\n\n如果攻击是 `DoS` 攻击，可以使用专为处理 `DoS` 攻击设计的清单。该清单可以设计为独立使用，也可以与通用清单配合使用。\n\
  \n在创建 `DoS` 攻击清单时，应考虑以下项目：\n\n-   **遏制**——必须尽快停止 `DoS` 攻击。一种方法是在路由器或防火墙上添加过滤器，根据攻击中使用的\
  \ `IP` 地址、端口或协议来拦截流量。如果无法在网络中拦截攻击，`ISP` 可能会提供帮助。只有在万不得已的情况下才断开服务器连接。一旦断开，服务就会停止，这正是\
  \ `DoS` 攻击的主要目标。\n\n-   **消除**——必须识别允许 `DoS` 攻击的漏洞。例如，漏洞可能源于未经过充分加固的服务器，因为系统上可能启用了未使用的协议，或者服务器可能没有安装最新的补丁。在识别漏洞后，需要采取措施来缓解这些漏洞。\n\
  \n-   **恢复**——如果服务器遭受了长期损坏，则必须进行修复。由于攻击可能安装了恶意软件，建议使用更新的防病毒软件进行恶意软件扫描。恢复后，必须对系统进行测试以确保运行正常。\n\
  \n### 处理恶意软件事件\n\n如果事件是恶意软件的结果，除了通用清单中的步骤外，还可以采取几项额外步骤。如果需要，可以为恶意软件事件创建特定清单，或者将它们合并到通用清单中。\n\
  \n在创建恶意软件事件清单时，考虑以下项目：\n\n-   **遏制**——必须识别所有受感染的系统并将其与网络断开，并确定防病毒软件未检测到恶意软件的原因。例如，防病毒软件可能被禁用，或者防病毒特征可能已过期。因此，必须更新防病毒特征并启用软件。如有必要，必须配置防火墙或路由器规则，以阻止恶意软件在受感染系统与外部传输。\n\
  \n-   **消除**——必须在系统上运行完整扫描。防病毒软件供应商（如 `Symantec` 和 `McAfee`）通常会提供页面，显示删除多部分病毒和其他高级恶意软件的详细步骤。如有必要，必须执行单独步骤以从系统中删除所有恶意软件元素，并对受感染的文件进行消毒、隔离或删除。\n\
  \n-   **恢复**——任何被删除或隔离且系统运行所需的文件必须被替换，并验证系统已不再感染。如果清理系统需要多个步骤，应考虑在将系统恢复到运行之前再次运行一次完整扫描。\n\
  \n### 处理未经授权的访问事件\n\n针对未经授权的访问事件可以采取几项措施。与其他类型的事件一样，可以创建单独的清单涵盖未经授权的访问事件，并可以使用未经授权访问清单补充通用清单。\n\
  \n![](img/Note.png) **注意**\n\n`多部分病毒`（multipartite virus）是一种使用多种感染方法的病毒。与简单的恶意软件相比，它通常需要更多的步骤或更复杂的程序来消除。\n\
  \n在创建未经授权访问事件清单时，应考虑以下项目：\n\n-   **遏制**——如果发现正在进行的攻击，必须识别受攻击的系统并将其从网络隔离开，这可以通过拔掉\
  \ `NIC` 电缆或禁用 `NIC` 实现。可以使用基于主机的防火墙来拦截所有流量，同时记录所有连接尝试。如果事件来自内部账户，则必须禁用该账户并验证其遵循最小权限原则。应确定攻击者是否也劫持了账户，以及是否攻击了其他系统，因为攻击者在成功攻击一个系统后通常会尝试攻击同一网络中的其他系统。如果有必要，应对其他系统进行遏制。\n\
  \n-   **消除**——必须识别允许攻击成功的漏洞，并验证所有加固服务器的步骤已完成并经过修改。必须使用强密码并可能需要更改系统上的密码。如果在攻击期间创建了额外的帐户，必须将其禁用并可能删除。\n\
  \n-   **恢复**——在解决漏洞后，系统可以重新连接并验证其运行正常。应该对系统进行测试以确保其按预期运行。可能需要考虑增加额外的监控（如 `IDS`），以便尽早发现未来的事件。\n\
  \n在创建未经授权访问的后续报告时，需要考虑攻击期间被访问的数据。如果是私有客户数据（例如信用卡数据），组织可能面临与事件相关的特定法律责任，这些责任需要确定并包含报告中。管理层将负责决定如何处理这些法律责任。\n\
  \n### 处理不当使用事件\n\n\n\n\n\n不当使用事件需要特定的应对措施来减轻其影响。减轻影响的步骤可以与通用检查清单中的步骤相结合，也可以创建一个单独的检查清单来逐一处理不当使用事件。\n\
  \n提醒一下，当内部用户违反组织政策时，就会发生不当使用事件。在创建不当使用事件的检查清单时，应考虑以下事项：\n\n- `Containment`（封锁）——在管理采取行动之前，可能会禁用用户的账户。例如，如果某个用户正在向组织内的所有人发送宗教材料，可以禁用用户的电子邮件访问权限。由于员工在网络访问被禁用后无法执行日常工作职责，因此这个问题对用户及其主管来说具有紧迫性。\n\
  - `Eradication`（根除）——某些组织要求用户在恢复访问之前完成特定培训，另一些组织要求主管在员工的记录中记录该活动。如果该员工是屡犯者，或事件被认为足够严重，可能会被终止合同。例如，如果用户在雇主拥有的计算机上安装了\
  \ P2P 软件导致数据泄露并导致贵的研发数据丢失，雇主可以立即解雇该员工。\n- `Recovery`（恢复）——如果账户被禁用，在完成适当措施后将重新启用，例如，在员工完成培训或人力资源部门记录了该事件后。如果员工被终止合同，应根据组织政策禁用或删除账户。\n\
  \n## CIRT 计划如何降低组织的风险？\n\nCIRT 计划帮助组织为事件做好准备。当组织做好充分准备时，其应对事件的速度会快得多，行动也更有针对性。CIRT\
  \ 计划的主要优点之一是识别 CIRT 成员，以便组织知道他们是谁，且团队成员也知道自己的角色和职责。一旦确定了计划和成员，组织对支持需求所需的技能将有更好的理解，并且可以对成员进行培训以确保他们具备这些技能。\n\
  \n如果没有计划，IT 和安全专业人员就没有足够时间来分析他们的应对措施。他们可能会拔掉 `NIC` 网线以停止对服务器的 `DoS` 攻击，虽然这样做可以停止攻击，但也会阻止服务器执行预期的服务。不明情的管理员可能会让受感染的系统留在网络中，导致其感染其他系统；或者善意的管理员可能会对攻击者反击，这可能会被发现并导致攻击者发起一系列更强大的攻击。\n\
  \n## 为组织实施 CIRT 计划的最佳实践\n\n在为组织实施 CIRT 计划时，可以使用一些最佳实践。以下是其中列表：\n\n- `定义计算机安全事件`——不同组织对事件的解释不同。当在\
  \ CIRT 计划中定义事件时，所有方都清楚哪些事件属于事件。\n- `在 CIRT 计划中包含政策以指导 CIRT 成员`——这些政策可能与 CIRT 成员反击攻击者有关，并包括关于使用监管链或其他保护证据的声明，以及与通信和安全相关的政策，这些取决于对组织重要的内容。\n\
  - `提供培训`——CIRT 成员和终端用户必须接受培训。CIRT 成员应该理解他们的职责，并知道应对不同类型事件的最佳方法，所有人员都应该理解威胁以及他们可以采取减轻威胁的基本步骤。\n\
  - `包含检查清单`——检查清单可以是必须按特定顺序执行的正式分步说明，也可以旨在确保 CIRT 成员不会遗漏关键数据的非正式要点说明。可以包含通用检查清单或针对特定类型事件的检查清单。\n\
  - `订阅安全通知`——通过电子邮件订阅可以使用许多描述不同类型威胁（包括新出现的威胁）的安全通报。`US-CERT` 定期发送电子邮件和警告。访问 `http://www.us-cert.gov/mailing-lists-and-feeds/`\
  \ 订阅接收这些电子邮件。\n\n## 章节总结\n\n本章涵盖了计算机事件响应小组（CIRT）和 CIRT 计划。组织应该预见到会导致计算机安全事件的攻击，并且存在多种类型的事件。`拒绝服务`（Denial\
  \ of）攻击试图阻止系统提供服务。恶意软件攻击包括病毒、蠕虫、特洛伊木和其他类型的恶意软件。当个人获得他们不应访问的数据时，就会发生未经授权访问事件。未经访问可能来自技术攻击或社会工程策略。当员工或内部用户违反组织政策时，就会发生不当使用事件。某些事件具有多个组成部分。\n\
  \nCIRT 可以应对攻击并减轻影响。CIRT 计划确定了组织政策。例如，某政策可能会解释 CIRT 成员可以在什么条件下攻击攻击者。它将确实包含应对不同类型事件时使用的程序或检查清单。通过准备和培训，CIRT\
  \ 计划帮助组织降低与事件相关的风险。\n\n### 核心概念和术语\n\n- 匿名器\n- CIRT 计划\n- 计算机事件\n- 计算机事件响应小组 (CIRT)\n\
  - 数据泄露\n- 恶意软件\n\n## 第 15 章评估\n\n1. `\\_\\_\\_\\_\\_\\_` 是对政策或安全实践的违反。\n\n2. 系统或网络上的所有事件都是计算机事件。\n\
