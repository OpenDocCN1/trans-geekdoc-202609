  \n## 前言\n\n### 本书目的\n\n本书书是 Jones & Bartlett Learning 信息系统安全与保证系列的一部分（`https://www.jblearning.com/cybersecurity/issa`）。该系列为\
  \ IT 安全、网络安全、信息保证和信息系统安全课程及教学大纲设计，对这一关键领域的最新思想和趋势进行了全面、一致的探讨。该系列书籍提供了基础的信息安全原则，并结合了大量的现实应用和案例。这些书籍由注册信息安全专业人员\
  \ (CISSP) 编写，提供了涵盖信息安全各方面的全面信息。经过领域内领先技术专家的逐字审核，这些书籍不仅具有时代性，而且具有前瞻性，让你能够解决当今乃至未来的网络安全挑战。\n\
  \n本书提供了信息系统风险管理的全面视角。它涵盖了风险和风险管理的基础知识，并包含了更多深度细节。\n\n## 第一部分：风险管理\n\n此部分涵盖了风险和风险管理的基础知识，并包含了更多深度细节。它涵盖了\
  \ `NIST` 风险管理框架、`NIST` `800-37` 以及其他标准。\n\n## 第二部分：缓解风险\n\n此部分关注 `NIST` 风险评估。它涵盖了\
  \ `NIST` 风险管理框架、`NIST` `800-30` 以及 `NIST` `800-33`。全文包含了若干更新后的指南。\n\n## 第三部分：风险缓解\n\
  \n此部分涵盖了 `NIST` 风险管理框架、`NIST` `800-53` 以及 `NIST` `800-36`。它还涵盖了业务连续性和灾难恢复。\n\n##\
  \ 学习特色\n\n本书的写作风格实用且通俗易懂。每章都以学习目标开头。通过图表解释材料。文中穿插了 `Notes`（注释）、`Tips`（提示）和 `FYIs`（参考）。每章末都有章节总结。\n\
  \n## 读者群\n\n本书材料适用于计算机科学或信息专业的本科生或研究生，他们具备 IT 安全的基础知识并希望扩展知识。\n\n## 本版更新\n\n本版进行了广泛更新，包含了新的和新兴概念，例如云计算、分析、移动计算、人工智能、机器学习、机器人流程自动化和区块链。文中包含了对网络安全现状的更新引用，包括美国和国际合规法，如《联邦信息安全现代化法》（`FISMA`）、《健康保险流通与责任法案》（`HIPAA`）、《格拉姆-莱奇-布莱利法案》（`GLBA`）以及欧盟的《通用数据保护条例》（`GDPR`）。书中还引入了《儿童在线隐私保护法》以及\
  \ Equifax 数据泄露事件。文中还包含了对 `ISACA`《信息和相关技术控制目标》（`COBIT`）2019 版的更新引用。书中还包含了更新后的章节末习题。\n\
  \n## 云实验室\n\n本书配有网络安全云实验室。这些实操虚拟实验室提供了沉浸式的模拟基础设施，学生可以在此基础上作为本教材课程的扩展，学习并练习基础网络安全技能。欲了解更多信息或购买实验室，请访问\
  \ `go.jblearning.com/gibson3e`。\n\n\n\n\n\n## 关于作者\n\n`Darril Gibson` 是 YCDA, LLC（You\
  \ Can Do Anything 的缩写）的首席执行官。他经常针对各种安全和技术主题进行写作和咨询，并拥有多认证，包括 MCSE、MCDBA、MCSD、MCITP、ITIL\
  \ v3、Security+、SSCP 和 CISSP。他编写或合著了 30 多本书，其中包括畅销的 `Security+: Get Certified, Get\
  \ Ahead` 系列书籍，并定期在 [`blogs.getcertifiedgetahead.com`](http://blogs.getcertifiedgetahead.com/)\
  \ 上发表博客。\n\n`Andy Igonor` 现任西西部州立大学（Western Governor’s University）学术计划总监兼信息技术/云计算副院长。他曾担任富兰克林大学（Franklin\
  \ University）罗斯商学院院长。他是一位 IT 专业人士和企业家，拥有超过 20 年的经验，涵盖了从教育到医疗保健和咨询等多个行业。他曾在非洲、亚洲、欧洲、中东和北美工作和生活。Andy\
  \ 拥有英国布里斯托商学院（Bristol Business School）的信息系统博士学位。他还持有多种认证，包括注册信息安全经理（CISM）、风险和信息系统控制认证（CRISC）以及健康信息管理与系统专业认证（CPHIMS）。他在信息技术领域发表过数篇文章，并合著了四本书。\n\
  \n\n© Sai Chan/Shutterstock\n\n## 第一部分\n\n# 风险管理业务挑战\n\n\n© Sai Chan/Shutterstock\n\
  \n## 风险管理基础\n\n### 引言\n\n风险管理对于每个组织的成功至关重要；一个不承担风险的组织可能不会失败，但无法繁荣。相反，一个忽视风险的组织在单一威胁被利用时可能会失败。今天，信息技术（IT）及其系统促成了许多组织的成功。然而，IT\
  \ 及其系统具有固有的风险，会使组织遭受损害，因此需要适当的管理来防止组织失败。\n\n有效的风险管理始于对需要保护的资产以及可能影响这些资产的威胁和漏洞的理解。个人通过识别减轻风险的方式在这些知识的基础上进行构建。可以通过减少漏洞或降低风险的影响来缓解风险。然后，可以为公司不同区域的风险缓解创建定制化计划。公司通常会制定几项风险缓解计划；但需要注意的是，风险是无法完全消除的。\n\
  \n本文将帮助学生在与信息系统和网络安全相关的风险管理方面建立坚实的基础。它作为进入该领域职业的介绍。本文在短短几段文字中介绍的许多主题可以填满整章或一本书。学生学得越多，就越接近成为一个他人寻求其以解决问题的专家。\n\
  \n### 第 1 章主题\n\n本章涵盖了以下主题和概念：\n\n* 什么是风险以及它与威胁、漏洞和资产损失的关系\n* IT 基础设施风险的主要组成部分有哪些\n\
  * 什么是风险管理以及它对组织有多重要\n* 一些风险识别技术有哪些\n* 一些风险管理技术有哪些\n\n### 第 1 章目标\n\n当你完成本章时，你将能够：\n\
  \n* 定义风险\n* 识别风险的主要组成部分\n* 描述威胁、漏洞、资产与损失影响之间的关系\n* 定义风险管理\n* 描述风险管理与盈利能力和生存能力的关系\n\
  * 解释损失成本与风险管理成本之间的关系\n* 描述组织对风险的感知\n* 识别威胁\n* 列出威胁的不同类别\n* 描述识别漏洞的技术\n* 定义风险管理技术\n\
  * 说明成本效益分析（CBA）的目的\n* 定义剩余风险\n\n### 什么是风险？\n\n`风险`是指意外情况发生的可能性或概率。这种意外的结果可能是收益也可能是损失。在信息安全领域，大多数组织关注防止资产损失的方法。当威胁暴露漏洞时，损失就会发生。公司采用风险评估策略，以便对如何处理已识别的严重风险做出理性决策。\n\
  \n`风险管理`是识别、评估、控制和减轻风险的实践。在讨论中，个人需要熟悉的术语如下所示。每个术语将在本章后半部分详细讨论。\n\n![](img/Note.png)**注意**\n\
  \nNIST 特别出版物 800-37 第 2 版对风险给出了定义：“风险是指实体受潜在情况或事件威胁的程度。风险还取决于情况或事件发生时产生的不利影响以及发生的可能性。风险类型包括计划风险；合规/监管风险；财务风险；法律风险；任务/业务风险；政治风险；安全和隐私风险（包括供应链风险）；项目风险；声誉风险；安全风险；战略规划风险。”\n\
  \n* **威胁**——`威胁`**注意**\n\n威胁和漏洞将在本章后面的部分进行更深入的探讨。\n\n#### 业务功能的损害\n\n[`业务功能`](10_chapter01.xhtml#gloss23）是企业为了销售产品和服务而执行的活动。如果这些功能的任何受到负面影响，企业将无法销售更多的产品或服务。企业的收入将减少，导致整体损失。\n\
  \n以下是业务功能可能损害的一些示例：\n\n* 销售人员经常给客户打电话或发送电子邮件。如果电话或电子邮件的能力降低，销售就会减少。\n* 组织收到若干与业务功能无关的电子邮件，暂时阻塞电子邮件空间并导致网络资源不可用。这种情况被称为[`拒绝服务（DoS）攻击`](10_chapter01.xhtml#gloss58）。当\
  \ DoS 攻击跨越组织网络发生，网络从多个源接收电子邮件时，被称为[`分布式拒绝服务（DDoS）攻击`](10_chapter01.xhtml#gloss65）。\n\
  \n\n\n\n\n*   一个网站在互联网上销售产品。如果网站受到攻击并故障，会导致销售额损失。\n*   作者的文章必须在截止日期前提交才能发布。如果作者的电脑感染了病毒，导致截止日期过去，文章的价值就会降低。\n\
  *   分析师编制报告供管理层做出决策。数据从内部服务器和互联网源中收集。如果网络连接出现故障，分析师将无法获取当前数据。管理层可能会根据不准确的信息做出决策。\n\
  *   仓库应用程序用于发运已购买的产品。它识别哪些产品已下单、产品需要发送到哪里以及产品位于何处。如果应用程序故障，产品将无法按时发货。\n*   某人给组织打电话，谎称有正当目的，并试图欺骗组织中的人员透露个人信息或受保护的信息。这种冒充的形式被称为社会工程，可能会损害组织的业务功能并导致损失。\n\
  \n## 揭秘社会工程\n\n社会工程是一种常用的技术，用于欺骗人们泄露敏感信息。在电视节目《利益时代》（*Leverage*）中，内森·福特（又名 Nate）策划了一项针对贪婪和腐败之的复杂计划，这是社会工程的一个经典案例。社会工程师不会仅仅说“把你的秘密告诉我”。相反，攻击者会使用奉承和欺骗等技术，通常利用受害者提供帮助的意愿。\n\
  \n漏洞评估中常用的常用技术是要求员工提供他们的用户名和密码。这种请求可能以电子邮件、电话甚至面对面的形式出现。\n\n例如，在发送请求用户名和密码的邮件时，可以对邮件进行修改，使其看起来像是来自某位高管。邮件中增加了紧迫感，并可能提到某个重要项目。例如，用户可能会收到以下邮件：\n\
  \n```\nFrom: CEO\nSubj: Project upgrade\n\nAll,\n\nXYZ 项目面临着落后的风险。如你们所知，这对我们明年的成功至关重要。我们在用户验证方面遇到了问题。我们认为可能是因为密码包含了无法识别的特殊字符。\n\
  \n我需要每个人回复此邮件并提供用户名和密码。我们必须在今天完成这项测试，因此请在收到此邮件后尽快回复。\n\n感谢您的帮助。\n```\n\n当员工接受过保护密码的培训时，他们通常会意识到风险并不会回复。然而，事实证明，当员工没有经过培训时，多达\
  \ 70%的员工可能会做出响应。\n\n由于任何业务功能的受破坏都可能导致收入损失，因此它们都代表着风险。在考虑风险时，任务之一是识别业务的重要功能，并确保组织提供必要的员工培训以减少其薄弱环节（即对技术和安全知识有限的人员）。\n\
  \n任何业务功能的重要性相对于业务而言。换句话说，如果一家公司的所有产品和服务都通过网站销售，那么该网站的故障可能是灾难性的。另一公司可能仅使用其网站为客户提供营业时间；因此，网站故障对业务的影响将较小。\n\
  \n## 威胁、漏洞、资产和影响\n\n之前介绍了与风险相关的关键术语。现在可以看到它们之间的关系。当威胁利用漏洞获取资产的访问权限时，如果资产受到破坏，威胁就可能导致损失。威胁的影响确定了该损失的严重程度。需要注意的是，并非所有资产都被认为是有价值的。资产的价值越高，损失的严重程度就越严重，这使得需要采取控制措施来防止损失扩大。\n\
  \n### 威胁\n\n威胁是任何可能导致损失的状况或事件。威胁也可以被视为任何代表可能危险的活动。威胁始终存在且无法消除，但可以被控制。资产代表任何值得保护的有价值物品。\n\
  \n威胁具有独立的发生概率，这些概率通常不受组织行动的影响。例如，攻击者可能是攻击托管在 `Apache` 上的 Web 服务器的专家。公司在阻止此类攻击者尝试攻击方面能做的非常少。然而，公司可以减少或消除漏洞，以减少攻击者成功的机会。\n\
  \n威胁可以被视为对业务资产的`机密性`](#10_chapter01_01.xhtml#gloss39)、`完整性`](#10_chapter01_01.xhtml#gloss10)或`可用性`](#10_chapter01_01.xhtml#gloss16)的尝试。`图\
  \ 1-1`将这些安全目标显示为一个三角形。如果三角形的任何边被，安全就会失败。换句话说，对`机密性`、`完整性`或`可用性`的风险代表了组织的潜在损失。因此，大量的风险管理集中在保护这些资源上。\n\
  \n\n*   **机密性**：防止未经授权的信息披露。数据应仅供授权用户使用。当数据被无关人员访问时，会导致机密性。使用访问控制和加密保护数据。\n*   **完整性**：确保数据或\
  \ IT 系统不被修改或破坏。如果数据被修改或破坏，它将失去对公司的价值。哈希算法通常用于确保完整性。\n*   **可用性**：确保在需要时数据和服务均可用。IT\
  \ 系统通常使用容错和冗余进行保护。备份用于确保即使整个建筑被毁，数据也能保留。\n\n### 注意\n机密性、完整性和可用性通常被称为*安全三元组*或*C-I-A\
  \ 三元组*。\n\n### 提示\n利用漏洞的方法也可以被称为利用程序。\n\n### 漏洞\n\n漏洞是一个弱点。它可能是程序、技术或管理方面的弱点。它可能是物理、技术或操作安全方面的弱点。正如并非所有威胁都会导致损失一样，并非所有漏洞都会导致损失。只有当攻击者能够利用漏洞时，资产才会发生损失。\n\
  \n考虑一个用于保护服务器机房的锁门，技术人员可能会故意解锁以便方便访问。如果门不能自动关严，它可能会不小心留开。无论何种情况，机房及其内容都会变得脆弱。\n\n\
  ### 资产\n\n业务资产是指对公司具有可衡量价值的任何物品。如果资产具有价值损失的潜力，它就面临风险。价值定义为资产对业务的意义。\n\n\n\n\n资产可以同时具有有形和无形价值。`tangible\
  \ value` 是资产的实际成本，可以用货币形式表示，例如 $5,000。企业的有形资产包括其库存、家具和机器。有形 IT 资产的示例包括：\n\n* `Computer\
  \ systems`—服务器、台式 PC 和移动计算机\n* `Network components`—路由器、交换机、防火墙以及为了保持网络运行所需的其他组件\n\
  * `Software applications`—任何可以安装在计算机系统上的应用程序\n* `Data`—包括对许多企业至关重要的大型数据库；还包括每个员工或客户使用和处理的数据\n\
  \n`intangible value` 是无法通过成本衡量的价值，例如客户信任或公司声誉。通常接受的会计原则 (GAAP) 将客户信任称为`商誉`(goodwill)。\n\
  \n例如，一家公司通过网站销售产品，每小时获得 5,000 美元的收入。托管网站的 Web 服务器故障并停机了两个小时。维修总费用为 1,000 美元。有形损失是多少？\n\
  \n* `Lost revenue`—$5,000 乘以 2 小时等于 $10,000\n* `Repair costs`—$1,000\n* `Total tangible\
  \ value`—$11,000\n\n无形价值没有那么容易计算，但仍然很重要。例如，一个有紧急需求的客户在网站宕机时尝试进行购买。如果相同的产品在其他地方可用，他或她可能会选择在其他地方购买。这种经历可能会损害该客户对组织的声誉，而且如果客户在其他业务的体验是积极的，下次想购买此产品时可能会直接去第二家公司。这种未来业务的损失无法无法量的，这使其成为无形。\n\
  \n无形价值包括：\n\n* `Future lost revenue`—客户在另一家公司进行的任何额外购买对于网站宕机的公司来说都是损失。\n* `Cost\
  \ of gaining the customer`—投入了大量资金吸引客户。回头客户比获取新客户更容易销售。如果公司失去了一个客户，该公司的投资就付诸东。\n\
  * `Customer influence`—客户有朋友、家人和业务伙伴。他们经常与其他分享自己的经历，特别是当这种经历特别积极或消极时。\n* `Reputation`—客户会与其他分享他们的负面经历，因此一个客户的糟糕经历可能会影响其他当前或潜在客户，避免未来的业务交易。\n\
  \n风险管理的早期步骤之一与识别公司的资产以及资产相关的成本有关。这些数据用于对不同资产的风险进行排序。一旦确定了风险的优先级，识别保护资产的风险管理过程就会变得更容易。\n\
  \n### Impact\n影响是损失的金额，可以用货币形式表示，例如 $5,000。硬件和软件的价值通常很容易确定。如果一台笔记本电脑被盗，可以使用购买或更换价值来确定被盗笔记本电脑的价值。然而，某些损失并不容易确定。如果那台笔记本电脑存有数据，那么数据的价值就很难估算。\n\
  \n可以使用描述性术语而非货币术语来解释损失的影响。例如，可以用相对术语描述损失，如高、中、低，这有助于组织通过描述潜在危害来量化损失。这种危害可能针对操作（例如无法执行关键业务功能）、资产（例如硬件或设施）、个人（例如个人信息丢失、受伤或生命丧失）、其他组织（导致财务损失或关系受损）或国家（影响政府运营或国家安全）。\n\
  \n由由美国国家标准与技术研究院发布的《风险评估指南》(NIST SP 800-30）包含了以下评估对业务资产威胁影响的量表：\n\n* `Very high`—表示多个严重或灾难性的负面影响。严重或灾难性意味着关键业务功能的丧失。这种损失可能导致重大的财务损失或人员的严重伤害。\n\
  * `High`—表示严重的或灾难性的负面影响。注意，“高”表示一个负面影响，“很高”表示多个负面影响。\n* `Moderate`—表示严重的负面影响。严重意味着关键业务功能显著下降。该组织可能仍运行，但效率不如正常水平。由此造成的损害可能是重大的。\n\
  * `Low`—表示有限的负面影响。有限意味着关键业务功能下降。造成的损害是微不足道的。\n* `Very low`—表示微不足道的负面影响。微不足道意味着对关键业务功能的影响很小且无法察觉。\n\
  \n### Classify Business Risks\n个人和企业使用资产的方式在所有行业中各相同。如果一个人考虑风险及其对组织的影响，他或她可能会在尝试创建一个影响公司所有可能的威胁和漏洞的完整列表时感到不知所措。幸运的是，有几种技术可以帮助指导这项活动。以下方法通过将任务集中在组织的人、流程和技术所带来的风险来实现这一目标。\n\
  \n#### Risks Posed by People\n理想情况下，组织中的所有人员都应该能够理解，如果不管理风险，对公司健康的威胁将是什么。不幸的是，对风险和风险管理的感知往往非常不同。在涉及组织的安全威胁方面，人员往往是最薄弱的一环。IT\
  \ 资源有效风险管理的挑战之一是在安全性和易用性之间取得适当的平衡。图 1-2 显示了一个图。在图中，左侧的计算机被完全锁定，安全水平很高，以至于控制措施可能会阻止用户充分履行工作。右侧的计算机易于使用，但忽视了安全。在中间，两者取得了平衡。\n\
  \n```\n```\n\n平衡的安全很少让所有人满意。安全人员希望紧锁系统，而终端用户认为这些安全控制措施不方便并希望更多的可用性。以下角色的个人对风险的感知通常会有不同：\n\
  \n* `Leaders and managers`—领导和经理主要关心盈利和生存能力。由于攻击会导致 C-I-A 损失，领导者愿意花钱降低风险。然而，他们对风险的观点基于与风险和控制相关的成本。经理需要准确的事实来决定实施哪些控制措施来保护公司资产。\n\
  \n\n\n\n- **系统管理员**——系统管理员负责保护 IT 系统。当他们理解风险时，通常希望尽可能将系统锁定得越好。管理员通常是技术水平很高的人员。有时，他们会忽视平衡安全成本与盈利能力的需求。某些组织设有管理员（通常是第\
  \ 1 级），他们作为 IT 支持的第一道防线。这些管理员被赋予了有限的管理权限。他们通常将安全控制视为执行工作的阻碍，并且并不总是意识到这些控制的重要性。例如，他们并不总是理解需要使用变更管理流程。意图良好的技术可能会为了解决一个问题而跳过变更管理流程，但无意中制造了另一个问题。这些未经批准的更改会导致业务损失。\n\
  \n- **开发人员**——某些公司拥有内部应用开发人员。他们编写的应用供公司内部使用或作为公司产品的一部分出售。许多开发人员已经采用了安全计算思维。他们意识到安全需要从设计阶段开始一直贯穿到发布阶段。当开发人员没有采用安全思维时，他们往往尝试在开发周期的最后修补安全漏洞。这种“补丁思维”很少能解决所有问题，并导致发布漏洞的软件。理想情况下，安全应该是软件或应用程序开发生命周期中不可或缺的步骤。\n\
  \n- **终端用户**——终端用户只想让计算机为他们工作。他们最关注的是易用性，通常不理解安全控制和限制的原因。相反，安全被视为一种不便。意图良好的用户经常尝试绕过控制以完成工作。例如，因为\
  \ USB 优存盘经常在用户不知情的情况下传输病毒，公司经常实施限制使用优存盘的政策。然而，一个需要将文件从一台电脑传输到另一台电脑以完成截止日期的用户可能会将\
  \ USB 优存盘视为必要的解决方案。\n\n\n可以通过书面政策（告诉人们不要使用）以及通过使用技术控制来限制优存盘的使用。计算机用户可以很容易忽略书面政策，但他们很难绕过技术控制。最佳实践是同时创建并执行书面和技术这两种类型的政策。\n\
  \n这些不同角色持有者的认知可以通过针对性培训来解决。某些培训可以涵盖所有员工。其他培训应针对特定角色进行。针对性培训有助于角色持有者更好地理解大局。它还可以帮助他们理解安全的重要性及其对公司成功的价值。负责风险管理的人必须考虑到所有的认知。如果任何控制措施都可以被绕过，这一点尤为真实。例如，笔记本电脑被盗是某些公司的常见问题。员工可以离开笔记本电脑去会议现场休息，结果回来时发现电脑不见了。如果公司购买硬件锁（可以将笔记本电脑固定在桌子或其他家具上），这种风险几乎可以被消除。然而，如果用户不认为这种风险是真实的，他们可能干脆不使用这把锁；因此，他们必须接受培训，以理解控制措施以及不遵守控制措施对（公司和他们自己）造成的后果。\n\
  \n### 缺乏流程带来的风险\n\n流程代表为了达到预期结果而采取的行动。缺乏正式流程是任何组织风险的来源之一。例如，如果没有创建配方和培训厨师的流程，面包店无法持续生产美味的杯蛋糕，并面临收入损失的风险。如果没有库存控制流程，销售公司可能会因供应不足面临失去客户的风险。对于许多组织来说，这些流程以政策、标准和指南的形式存在。列表描述了一些与\
  \ IT 资源相关的流程：\n\n- **政策**——政策是由组织领导直接发布的正式声明，例如可接受使用政策，它描述了在使用公司所有计算机和网络资源时可接受和不可接受的行为。\n\
  \n- **标准**——标准是为支持或至少为政策提供某些方向而编写的强制规则。例如，密码标准可以遵循可接受使用政策。\n\n- **指南**——指南不是强制性的，但为特定行为提供指导。例如，编写了关于如何创建强密码的指南。\n\
  \n理想情况下，所有组织都应该有一份通用的信息安全政策，并可能制定特定的政策来定义业务将如何处理访问控制、远程访问、电子邮件使用、事件响应、灾难恢复、业务连续性和其他风险状况。\n\
  \n### 技术带来的风险\n\n无论是在小型企业、大型政府机构还是上市公司，大多数 IT 基础设施都由图 1-3 所示的七个领域组成：用户、工作站、LAN、局域网转域网、WAN、远程访问和系统/应用程序。每个领域都带来自己的系列风险。识别技术带来的风险的一种方法是审查每个领域，重点关注威胁、漏洞和损失的影响。\n\
  \n\n**图 1-3** 典型 IT 基础设施的七个领域。\n\n以下示例描述了每个领域的某些风险；风险比每个领域描述的要多。企业必须在每个领域中提供保护。任何一个领域的弱点都可能被攻击者利用，即使其他六个领域没有漏洞。\n\
  \n### 用户领域\n\n用户领域定义了人们与组织信息系统交互的方式。他们可以是客户、员工、承包商或顾问。“链条的强度取决于其最薄弱的一环”的老话也适用于 IT\
  \ 安全。人往往是 IT 安全中最薄弱的一环。例如，一个组织可能要求使用难以破解的强复杂密码，但员工可能会将密码写在便利贴上，导致组织面临未经授权访问的风险。\n\
  \n### 工作站领域\n\n工作站可以是台式机或笔记本电脑、特殊用途终端，或任何连接到组织网络的设备；工作站是用户首次访问系统、应用程序和数据的地方。工作站领域需要严格的安全和访问控制。此外，操作系统和应用程序中不断发现\
  \ Bug 和漏洞。软件供应商定期发布补丁和修复程序，必须应用这些程序以帮助保护系统。\n\n### LAN 领域\n\nLAN 领域是防火墙内部的区域。局域网（LAN）可以是小型家庭办公室网络中的单台工作站和打印机，也可以是拥有成千上万设备的大型网络。由于这些设备共享网络资源，它们容易受到攻击单个设备的威胁的影响。例如，用户可能会访问危险网站，并在不知情的情况下下载会感染整个网络的病毒。\n\
  \n### LAN-to-WAN 领域\n\n\n\n\n局域网到广域网（LAN-to-WAN）域是 IT 基础设施连接到广域网（WAN）和互联网的地方。该域为整个组织提供互联网访问服务，并作为广域网的进出口。边界的公侧通常连接到互联网，是黑客频繁寻找的目标，他们试图寻找允许未经授权访问局域网的漏洞。\n\
  \n### 广域域\n\n广域网（WAN）域连接远程位置。管理广域域的目标是让用户能够获得尽可能的访问权限，同时确保进出数据是安全的。为了确保广域域内主机的安全，需要大量的安全防护。与该域相关的风险包括窃听和授权访问，因为该域中的大多数流量都是以明文发送的，这意味着黑客可以获取用户名和密码。此外，数据还受到损坏和恶意攻击的影响。\n\
  \n## 远程访问域\n\n远程访问域将远程用户连接到组织的 IT 基础设施。对于在现场或从家里工作的员工，例如外勤销售代表、技术支持专家或医疗保健专业人员来说，远程访问至关重要。Wi-Fi\
  \ 热点让用户能够连接到虚拟专用网络（VPN）以访问电子邮件和其他业务应用程序，但如果员工的设备被盗或未妥善保护，也会对组织的专有数据构成风险。\n\n\nVPN\
  \ 连接使用隧道协议来降低数据被捕获的风险。隧道协议加密通过网络发送的流量，这使得攻击者更难捕获和读取数据。\n\n### 系统/应用域\n\n系统/应用域是存储组织数据的地方这些数据可以是私人客户数据、知识产权或国家安全信息。数据是攻击者在\
  \ IT 系统深处寻求的东西。无论是由于攻击、灾难还是疏忽导致数据丢失，都是系统/应用域中最大的威胁。\n\n### ![](img/Tip.png) 提示\n\
  \n应该根据托管应用程序所需的特定安全需求对服务器进行锁定。换句话说，电子邮件服务器需要一套保护措施，这与数据库服务器所需的保护措施不同。\n\n## 风险识别技术\n\
  \n本章前面的部分介绍了风险和损失。风险是指某些意外情况发生的可能性或概率。某些风险会导致损失。当威胁暴露漏洞并损害资产时，损失就会发生。要识别风险，需要遵循以下三个步骤：\n\
  \n1. 识别威胁\n2. 识别漏洞\n3. 估算威胁利用漏洞损害资产的可能性\n\n接下来的章节将探讨这些概念。\n\n### 识别威胁\n\n威胁是任何可能导致损失的状况或事件。换句话说，它是任何代表可能危险的活动。损失或危险与以下内容之一直接相关：\n\
  \n*   **机密性丢失**——某人看到了某一个人的密码或公司的“秘密配方”。\n*   **完整性丢失**——电子邮件邮件在传输过程中被篡改、病毒感染了文件，或有人对网站进行了未经授权的更改。\n\
  *   **可用性丢失**——电子邮件服务器宕机导致无人能访问电子邮件，或文件服务器宕机导致数据文件无法使用。\n\n威胁识别是创建威胁列表的过程。公司应该尝试识别对组织所有可能的威胁，这绝非一项易事。列表可能会非常详尽。\n\
  \n为了编制此威胁列表，企业通常会从以下类别中考虑威胁：\n\n*   **外部或内部**——外部威胁位于组织边界之外。它们也可以被认为是组织控制范围之外的风险。内部威胁位于组织边界之内。它们可能与拥有公司资源访问员工或其他人员有关。内部威胁可能与受业务控制的任何硬件或软件有关。\n\
  *   **自然或人为**——自然威胁通常与天气有关，例如飓风、龙龙卷和冰风暴。地震和海啸也是自然威胁。人类或人为威胁是指人引起的。由于访问公司资源的人员引起的可能是内部威胁。火灾可能是人为的或自然的，取决于火是如何引发的。\n\
  *   **故意或意外**——试图破坏机密性、完整性可用性的尝试是故意的。员工错误或用户错误是意外的。损坏数据的应用程序可以被视为意外。\n\n识别威胁的一种方法是头脑风暴会议。在头脑风暴会议中，参与者会提出脑海中产生的任何想法。所有想法都会记录下来，而对问题仅进行逻辑分析。\n\
  \n对组织的威胁示例包括：\n\n*   未经授权访问数据的员工\n*   任何类型的恶意软件\n*   攻击者污改网站\n*   任何 DoS 或 DDoS\
  \ 攻击\n*   试图访问数据的外部攻击者\n*   任何数据丢失\n*   任何服务中断\n*   社会工程学诱骗员工泄露秘密\n*   地震、洪水或飓风\n\
  *   雷击\n*   电力、供暖或空调故障\n*   火灾\n\n如果这些威胁暴露了漏洞并可能损害资产，那么它们都代表了可能的风险。\n\n当然，还会识别出特定组织的威胁和漏洞。事实上，拥有多个地点的业务每个地点可能都有独特的威胁和漏洞。\n\
  \n### 识别漏洞\n\n在本章前面介绍了漏洞是一种弱点。漏洞在威胁利用它们时变得显现。理想情况下，在威胁利用之前就能识别漏洞。幸运的是，大多数组织都有许多可以帮助此事的来源。\n\
  \n常用的来源包括：\n\n*   **审计**——许多组织定期进行审计。检查系统和流程以验证公司符合现行的法律法规。审计人员在报告中记录发现，列出与漏洞直接相关的发现。\n\
  *   **认证和认可记录**——存在多种标准用于检查和认证 IT 系统。如果系统符合标准，IT 系统即可获得认可。整个过程包括详细文档。通过审查这些文档可以识别现有和潜在漏洞。\n\
  *   **系统日志**——许多类型的计算机系统日志可以识别威胁。审计日志可以确定用户是否正在访问敏感数据。防火墙日志可以识别试图入侵网络的流量以及被恶意软件接管作为僵尸的计算机。域名系统（DNS）日志可以识别未经授权的数据传输。\n\
  *   **先前的事件**——之前的安全事件是极佳的数据来源。作为已经发生的风险的证据，它们有助于证明控制措施的合理性。它们展示了已经过的问题并可以显示趋势。理想情况下，安全事件产生的漏洞会在发生后立即解决。在实践中，有时员工希望尽快忘记事件并尽早遗忘它。\n\
  \n\n\n-   **故障报告**——大多数公司使用数据库来记录故障电话。这些数据库可以包含丰富的信息。通过简单的分析，可以利用它们来识别趋势和弱点。\n-\
  \   **事件响应团队**——某些公司设有事件响应团队。这些团队将调查公司内部所有的安全事件。可以对团队成员进行访谈以获取丰富的信息，因为他们通常乐于帮助降低风险。\n\
  \n### 使用典型 IT 基础设施的七领域识别弱点\n\n识别弱点的另一种方法是检查典型 IT 基础设施的七个领域，这些领域在本章前面已经过。可以对每个领域进行单独检查。此外，每个领域还可以由该领域的专家进行检查。以下列表提供了这些领域中漏洞的示例：\n\
  \n-   **用户领域**——社会工程学是一个巨大的漏洞。例如，Sally 接到一个电话：“你好，我是帮助台的 Bob。我们在你的电脑上发现了一个病毒。”Bob\
  \ 随后尝试引导 Sally 完成一个漫长而详细的过程，然后说：“我为什么不直接帮你修好它，这样你就能回去工作了？我只需要你的密码。”\n-   **工作站领域**——未打补丁的计算机可能会被攻击利用。如果它们没有防病毒软件，就可能被感染。\n\
  -   **LAN 领域**——网络上任何未使用适当访问控制保护的数据都是脆弱的。弱密码可以被破解。分配不当的权限会导致未经授权的访问。\n-   **LAN\
  \ 到 WAN 领域**——如果允许用户访问恶意网站，他们可能会误下载恶意软件。开启了不必要端口的防火墙允许从互联网访问内部网络。\n-   **WAN 领域**——任何面向公众的服务器都容易受到\
  \ `DoS` 和 `DDoS` 攻击。允许匿名上传的文件传输协议 (`FTP`) 服务器可能会托管来自黑黑客的盗版软件。\n-   **远程访问领域**——远程用户可能感染了病毒但不知。当他们通过远程访问连接到内部网络时，病毒可能会感染网络。\n\
  -   **系统/应用领域**——数据库服务器可能会受到 SQL 注入攻击。在 SQL 注入攻击中，攻击者可以读取整个数据库。SQL 注入攻击还可以修改数据库中的数据。\n\
  \n本节并不代表完整的列表；这是无法做到的。IT 系统中发现的漏洞数量不断增加。MITRE 公司的目录 常见漏洞与披露 (CVE) 目前包含超过 40,000\
  \ 项。\n\n### TIP ![](img/Tip.png)\n\n某些恶意软件可以控制多台计算机并将它们像机器人一样控制。控制计算机发出攻击命令，计算机便进行攻击。单台计算机被称为\
  \ `zombies`（僵尸）。受控计算机的网络被称为 `botnet`（僵尸网络）。\n\n### TIP ![](img/Tip.png)\n\n`Warez`（读作\
  \ wares）是一个描述盗版文件的术语。示例包括盗版游戏、MP3 文件和电影。Warez 网站通常包含黑客工具，任何人（包括黑客）都可以下载这些工具。\n\n\
  ### TIP ![](img/Tip.png)\n\n`SQL 注入攻击` 试图访问来自网站的数据。SQL 语句被输入到文本框中。如果网站没有进行防御性编程，这些\
  \ SQL 语句就可以针对数据库执行。目前有许多程序可以发起 SQL 注入攻击并检索整个数据库。\n\n### 评估影响和可能性\n\n识别风险的第三步是估计威胁利用漏洞损害资产的概率。将威胁与现有的漏洞进行匹配，以确定威胁对组织的影响。\n\
  \n在前面的“识别威胁”章节中列出了几种威胁。表 1-1 取了其中几种威胁并将它们与漏洞匹配，以识别可能损失的影响。\n\n**表 1-1** 评估威胁的影响\n\
  \n| 威胁 | 漏洞 | 影响 |\n| --- | --- | --- |\n| 未经授权的员工尝试访问托管在服务器上的数据。 | 未使用适当的身份验证和访问控制。\
  \ | 可能的损失取决于数据的敏感性及其使用方式。例如，如果未经授权的员工访问了薪资数据并自由分享，可能会影响士气和生产力。 |\n| 任何类型的恶意软件（如病毒或蠕虫）进入网络。\
  \ | 防病毒软件未检测到病毒。 | 病毒可能会安装在系统中。病毒通常会导致机密性、完整性或可用性的丢失。 |\n| 攻击者修改或篡改网站。 | 网站未受保护。\
  \ | 根据攻击者修改网站的方式，公司的信誉可能会受到影响。 |\n| 社会工程师欺骗员工泄露密码。 | 用户未经过充分培训。 | 密码可能会泄露。获得密码的攻击者可以控制用户的帐户。\
  \ |\n\n在将威胁与漏洞配对时通常使用以下公式：\n\n```\n风险 = 威胁 × 漏洞\n```\n\n然而，这不是一个真正的数学公式。威胁和漏洞并不总是有数值。相反，该公式显示了两者之间的关系。\n\
  \n如果可以确定资产价值，则对公式稍作修改为：\n\n```\n总风险 = 威胁 × 漏洞 × 资产价值\n```\n\n### 平衡风险与成本\n\n管理风险的成本必须与影响值进行平衡。如果可用，可以用实际货币价值来衡量成本。也可以通过使用相对值（如\
  \ `低`、`中` 和 `高`）来平衡成本。\n\n表 1-2 显示了分配相对值的示例。可能性在垂直方向显示，影响在水平方向显示。如果一个威胁发生的概率为 0%\
  \ 到 10%，则被赋值为 `低`。如果概率在 11% 到 50% 之间，则赋值为 `中`。如果概率在 51% 到 100% 之间，则赋值为 `高`。同样，影响可以评为\
  \ `低`、`中` 和 `高`。\n\n**表 1-2** 威胁-可能性-影响矩阵\n\n![](img/Table1-2.png)\n\n有时，风险发生的可能性和影响很高，这提供了一个容易的选择。例如，没有防病毒软件的系统会受到感染。这种威胁很常见。可能性很高。当这种情况发生时，受感染的系统可能会导致业务数据的泄露或破坏。影响也很大。这种风险需要缓解。防病毒软件的成本远低于影响成本。因此，防病毒软件在业务中很常见。\n\
  \n其他时候，可能性较低但影响很大。例如，数据中心火灾的风险较低，但影响很大。企业通常会配备火灾检测和灭火设备，以防止火灾发生时产生影响。还会购买保险以减少火灾造成损害的影响。\n\
  \n### 合理性\n\n面对许多威胁公司业务的风险，意识到公司不需要管理每一个可能的风险应该是一个好消息。某些风险的管理是合理的，而另一些则不是。\n\n合理性\
  \ 是一种可以应用于风险管理的测试，用于确定是否应该管理该风险。该测试源于法律中的理性人标准。简而言之，这个问题应该回答：“一个理性的人是否会被预期会管理这个风险？”\n\
  \n\n\n不符合合理性测试的风险是可以接受的。例如，核战争的威胁确实存在。公司可能会投入资源为所有员工建造避难所，并储备足够维持 30 年的食物和饮用水。然而，这种情景并不合理。\n\
  \n另一个例子是考虑一家位于佛罗里达州东岸的公司。飓风是一个非常真实的威胁，应该被在范围内。然而，重大地震袭击佛罗里达州东岸的概率相对较小，不需要处理。但是，位于旧金山的企业就有不同的考量。那里的地震是真实的威胁，但飓风不是。因此，对于旧金山来说，飓风风险是可以轻易接受的，而地震风险则不被接受。\n\
  \n### ![](img/Tip.png)`TIP`\n\n可以创建一个更详细的威胁-可能性-影响矩阵。例如，与其为威胁可能性分配低、中、高值，不如分配实际具体的百分比。此外，可以使用更多的类别，而不仅仅是三个。使用更多的类别可以实现它们之间更大的区分度。同样，影响可以分配一个范围内的任何数字。`表\
  \ 1-2`中的矩阵使用了 10、50 和 100 的范围，但 1 到 100 之间的任何数字都可以使用。\n\n合理性的另一个标准是仅关注组织内部或被评估系统内部的漏洞。外部漏洞通常不被处理。例如，如果空调故障，服务器很可能会故障。这种情况在识别服务器机房漏洞时会被处理。这种漏洞不会针对服务器机房内\
  \ 50 台服务器中的每一台进行单独处理。同样，商业用电可能会中断。这种情况可以通过不间断电源（`UPSs`）和发电机来解决。然而，不需要为商业电力公司寻找替代方案。\n\
  \n#### 风险管理流程\n\n在本章前面的部分，风险管理被定义为识别、评估、控制和缓解风险的实践。识别与组织相关的威胁和漏洞是一个重要步骤，就像了解资产的价值有助于确定其损失的影响一样。有了这些信息，就可以采取行动。\n\
  \n意识到风险管理不等同于消除是非常重要的。相反，风险管理试图的是减少。这包含了几个要素：\n\n*   **评估风险**——风险管理从`风险评估`开始。\n\
  *   **识别威胁和漏洞**——收集数据以识别成本和收益。\n*   **识别可能性**——检查损失的成本。\n*   **识别影响**——确定潜在影响。\n\
  *   **识别风险响应**——决定风险是规避、转移还是缓解。\n*   **选择控制措施**——比较影响与实施成本。\n*   **实施和测试**——一旦实施控制措施，就会对其进行定期测试。\n\
  *   **评估控制措施**——风险管理是一个持续的过程。\n\n### ![](img/Tip.png)`TIP`\n\n控制措施并不总是消除损失。相反，控制措施减少了损失。例如，某项风险的年度损失平均为\
  \ $100,000。如果实施了控制措施，这些损失可能会减少到 $10,000。因此，该控制措施的收益为 $90,000。\n\n可以使用以下公式来确定应该使用该控制措施：\n\
  \n`控制前的损失 − 控制后的损失 = 控制成本`\n\n例如，该公司去年在没有实施任何控制措施的情况下损失了 $100,000。如果实施了控制措施，预计每年损失为\
  \ $12,000。控制的成本估计为 $7,000。公式为：\n\n`$100,000 − $7,000 (控制成本) − $12,000 (预期剩余损失) =\
  \ $81,000`\n\n## 成本效益分析\n\n可以进行`成本效益分析 (CBA)` 来帮助确定实施哪些控制措施或对措施。如果收益大于成本，通常会选择该控制措施。\n\
  \n开始 CBA 始于收集数据，以识别控制措施的成本以及实施后可能获得的收益。\n\n*   **控制成本**——控制成本包括购买成本加上控制措施整个生命周期内的运营成本。\n\
  *   **预期收益**——预期收益包括实施控制措施后获得的潜在收益。这些收益通过检查损失的成本以及在实施控制措施后损失将减少多少来确定。\n\n\n\n\n\
  执行成本效益分析（CBA）时面临的最大挑战之一是获取准确的数据。虽然当前的损失通常很容易获得，但未来的成本和收益需要进行估算。成本往往被低估，而收益往往被高估。\n\
  \n控制措施的即时成本通常是可见的。然而，有时持续成本是隐藏的。某些隐藏成本可能：\n\n*   培训员工的成本\n*   持续维护的成本\n*   软件和硬件更新成本，例如订阅费用\n\
  \n根据比例原则，如果成本超过了收益，组织可能会选择不实施该控制。相反，它可能会选择接受、分担、转移或规避风险。\n\n### 盈利能力与生存能力\n\n在评估风险管理成本时，必须考虑盈利能力和生存能力：\n\
  \n*   **盈利能力（Profitability）**——盈利能力是指公司盈利的能力。其计算方法为收入减去成本。\n*   **生存能力（Survivability）**——生存能力是指公司遭受因风险导致的损失的能力。某些损失（如火灾）可能是灾难性的，并将导致业务失败。\n\
  \n从盈利能力来说，损失可能会摧毁一家企业。从生存能力来说，损失可能导致公司永远无法盈利。与风险管理相关的成本并不直接有助于增加收入。相反，这些成本有助于确保公司在遭受损失时能够继续运营。\n\
  \n关于盈利能力和生存能力，应考虑以下事项：\n\n*   **自付现金成本（Out-of-pocket costs）**——减少风险的成本来自现有资金。\n\
  *   **机会成本（Lost opportunity costs）**——用于减少风险的资金无法用于其他地方，如果这些资金可以用于其他用途，可能会导致机会流失。\n\
  *   **未来成本（Future costs）**——一些应对措施需要持续或未来的成本。这些成本可能用于更新硬件或软件。未来成本还包括实施应对措施所需的人员成本。\n\
  *   **客户和利益相关者的信任（Client and stakeholder confidence）**——客户和利益相关者的信任价值同样重要。如果风险得不到解决，当威胁利用漏洞时，客户和利益相关可能会失去信任，给公司带来巨大损失。\n\
  *   **安全总成本（Total cost of security）**——安全总成本包括一次性成本（例如，在 `IDS` 上花费资金）以及持续或经常性的成本（例如，防病毒软件的订阅费用）。这种成本可能很高，花费的资金会减少公司的总利润。但替代方案是什么呢？如果不采取这些保护，整个业务可能会停滞。如果这种情况发生得太频繁或持续过长，业务可能会失败。\n\
  \n数据通常是企业拥有的价值价值资产之一。它可以包括客户数据、会计数据（如应付账款和应收账款）以及员工数据。列表可以一直延伸。这些数据对于企业的成功至关重要，因此通常会定期备份。\n\
  \n例如，一家公司每年花费 $15,000 进行数据备份，这项成本不会增加收入或利润。在整的一年里，数据永远不会丢失，也不需要备份。如果只考虑盈利能力，管理层可能会决定消除这项成本。备份停止了，但明年，数据可能会丢失，导致公司失败和破产。\n\
  \n尽管如此，成本确实需要与盈利能力进行权衡。例如，如果一家公司每年利润仅为 $10,000，那么公司每年花费 $15,000 来保护其数据是不合理的。\n\n\
  另一方面，例如一家公司年利润为 $100,000。它选择不花 $15,000 进行备份，但随后病毒在企业中传播，摧毁了所有客户和会计数据。公司不再拥有可靠的应收账款记录，也没有人可以访问客户群。这种情况可能是导致业务终的灾难性事件。\n\
  \n### 风险处理策略\n\n风险管理也可以被视为处理（handling）。风险管理的最终目标是保护。它包括几个步骤：\n\n*   识别风险\n*   评估风险\n\
  *   确定哪些风险将被处理，哪些将被接受\n\n风险可以被规避、分担或转移、缓解或接受。这些技术解释如下：\n\n#### 规避（Avoiding）\n\n\
  管理风险的一种方法是简单的规避。规避的主要原因是风险的影响超过了收益。组织可以通过以下方式规避风险：\n\n*   **消除风险源**——公司可以停止该活动。例如，公司可能有一个脆弱的网络。\n\
  *   **消除资产对风险的暴露**——公司可以移动资产。例如，数据中心可能位于地震发区而存在风险。它可以移动到无地震的地区，但成本会非常高。然而，如果风险不可接受且数据中心非常重要，则需要这样做。\n\
  \n#### 分担或转移（Sharing or Transferring）\n\n分担或转移风险意味着将责任转向另一方。转移风险转移整个责任。分担风险转移部分责任。组织可以外包部分活动。\n\
  \n*   **保险**——公司可以购买保险来防止损失。如果发生损失，保险将涵盖。有许多类型的保险，包括火险。\n*   **外包活动**——例如，公司可能想在互联网上托管网站。公司可以将网站托管给托管供应商。公司和供应商可以就谁负责安全、备份和可用性达成共识。\n\
  \n#### 缓解（Mitigating）\n\n通过减少漏洞降低降低。这一过程的主要策略是缓解风险。缓解风险被称为风险降低。\n\n实施控制措施或应对措施可以减少漏洞。控制的成本不应超过收益。确定成本和收益通常需要\
  \ CBA，这在本章前面介绍过。\n\n缓解步骤的包括：\n\n*   **改变物理环境**——将集线器更换为交换机。将服务器放在锁好的机室内。\n*   **更改流程**——实施备份计划。将备份存储在异地，并进行测试。\n\
  *   **增加容错能力**——对存储在磁盘上的重要数据使用 `RAIDs`。使用故障转移集群保护服务器。\n*   **修改技术环境**——增加防火墙的安全性。添加\
  \ `IDS`。保持防病毒软件更新。\n*   **培训员工**——培训技术人员如何实施控制措施。培训终端用户识别社交工程策略。\n\n通常，目标不是消除风险，而是让攻击者认为认为成本过高。这里有两个公式：\n\
  \n\n\n\n*   `Attacker’s cost < Attacker’s gain`——当此成立时，攻击对攻击者来说具有吸引力。\n*   `Attacker’s\
  \ cost > Attacker’s gain`——当此成立时，攻击者不太可能实施攻击。\n\n加密是增加攻击者成本的方法之一。如果公司以明文形式在网络上发送数据，数据可能会被捕获并分析。如果公司加密了数据，攻击者必须在分析之前对其进行解密。加密的目标不是让数据无法解密，而是要让攻击者破解这些数据的成本过高或耗时过长。\n\
  \n### ![](img/Note.png)注意事项\n\n简单的备备集群可以包含两台服务器。一台服务器为用户提供服务，另一台服务器作为备用。如果在线服务器故障，备用服务器可以感知到故障并自动接管。\n\
  \n### 接受\n\n`接受` 风险是另一种选择。公司可以评估风险，理解潜在损失并选择接受它，这通常在控制措施成本超过潜在损失时这样做。\n\n例如，一家公司托管了一个用于电子商务的\
  \ Web 服务器。该 Web 服务器每月产生约 1,000 美元的收入。可以使用备备集群保护该服务器。然而，估计显示备备集群的成本约为 10,000 美元。如果服务器宕机，可能只持续一两个小时，这相当于少于\
  \ 3 美元（每小时收入 = $1,000 × 12 / 365 / 24 = $1.37）。\n\n### 剩余风险\n\n`剩余风险` 是应用控制措施后仍然存在的风险。消除所有风险是不行的。相反，应采取措施将风险降低到可以接受的水平。剩下的风险就是剩余风险。\n\
  \n在本章前面，给出了两个关于风险的公式：\n\n`Risk = Threat × Vulnerability`\n\n`Total risk = Threat\
  \ × Vulnerability × Asset value`\n\n可以使用以下公式计算剩余风险：\n\n`Residual risk = Total risk\
  \ − Controls`\n\n高级管理人员对由于剩余风险导致的损失负责。他们决定一个风险应该被规避、共享、转移、缓解还是接受。他们还决定实施哪些控制措施。由于他们的决策而导致的任何损失都由他们承担。\n\
  \n## 章节总结\n\n风险发生在威胁利用漏洞并导致损失时。损失可能会损害资产和核心业务功能。损失的影响体现在业务成本中。风险管理的步骤是识别威胁和漏洞，然后将它们配对以确定风险的影响。通过实施控制措施，可以减少漏洞。在控制措施上的支出应与风险成比例。\n\
  \n通过选择四种技术之一：规避、共享或转移、缓解或接受，可以管理风险。主要的风险管理技术是缓解风险，也称为风险降低或风险处理。如果完成了 `CBA`（成本效益分析），决定接受损失将变得更容易。\n\
  \n### 核心概念和术语\n\n*   `接受`\n*   `资产`\n*   `可用性`\n*   `规避`\n*   `审计`\n*   `业务功能`\n\
