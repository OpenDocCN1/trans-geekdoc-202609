  12. 公司决定通过购买保险来减少威胁造成的损失，这被称为风险 `转移`。\n13. 可以做什么来管理风险？（选择三个）\n    *   接受它\n    *\
  \   转移它\n    *   规避它\n    *   迁移它\n14. 在应用最小化环境风险的控制措施后，剩余风险称为什么？\n    *   剩余风险\n\
  \    *   缓解的风险\n    *   管理中的风险\n    *   剩余风险\n15. 谁对剩余风险导致的损失负最终责任？\n    *   终端用户\n\
  \    *   技术人员\n    *   高级管理人员\n    *   安全人员\n\n\n\n\n\n**组织资产**包括数据、人员、流程和技术系统。这些资产每天都面临真实的威胁，而且有时这些威胁是不可避免的。为了管理这些威胁带来的风险，必须识别哪些资产需要保护以及这些威胁的来源。此外，了解资产中存在哪些可能被威胁利用的漏洞也同样重要。威胁通常利用漏洞来损害资产。理解威胁与漏洞之间的关系（也称为“威胁/漏洞对”）对于缓解风险至关重要。\n\
  \n美国联邦政府在信息安全领域做出了许多努力，包括开发帮助理解和管理组织资产相关风险的框架。其中一个示例是美国国家标准与技术研究院（`NIST`）提供的风险管理框架（`RMF`）。`NIST\
  \ RMF 800`特别出版物系列提供了涵盖风险活动生命周期的政策和标准。这些出版物可以在`NIST.gov`网站上免费获取。此外，国土安全部（`DHS`）还监督其他与信息技术（`IT`）安全相关的倡议。\n\
  \n## 第二 2 章主题\n\n本章涵盖了以下主题和概念：\n\n*   什么是资产以及为什么它们需要管理\n*   什么是威胁以及如何管理它们\n*   什么是漏洞以及如何管理它们\n\
  *   什么是利用（exploits）以及如何管理它们\n*   美国联邦政府资助的风险管理倡议的价值\n\n## 第二 2 章目标\n\n完成本章后，你将能够：\n\
  \n*   解释什么是资产以及为什么它们需要保护\n*   描述威胁的不可控性\n*   列出无意威胁和蓄意威胁\n*   识别管理威胁的最佳实践\n*   识别威胁/漏洞对\n\
  *   定义“缓解”（`mitigation`）\n*   列出并描述用于缓解漏洞的方法\n*   识别管理漏洞的最佳实践\n*   定义“利用”（`exploit`）\n\
  *   描述执行者在漏洞和利用中的作用\n*   识别缓解技术\n*   识别管理利用的最佳实践\n*   识别美国联邦政府风险管理倡议的目的\n\n## 理解与保护资产\n\
  \n资产代表任何需要保护的有价值的物品。在`IT`世界中，资产包括数据、人员、流程和技术系统。运行技术系统的人员以及组织开发的流程（如策略、标准和指南）是值得保护的重要资产，正如技术系统中的数据一样。这些领域中的任何弱点都可能被威胁利用以损害这些资产。组织需要保护其资产；否则，业务将变得难以管理，甚至停止存在。\n\
  \n## 理解与管理威胁\n\n威胁是指任何对资产构成可能危险的行动者或活动。威胁包括任何可能对业务资产的机密性、完整性或可用产生不利影响的状况或事件。\n\n\
  威胁是产生风险方程式的一部分：\n\n```\nRisk = Threat × Vulnerability × Asset\nR = TVA\n```\n\n\
  任何管理风险的尝试都需要对威胁有深入了解。本节包含以下主题：\n\n*   威胁的不可控性\n*   无意威胁\n*   蓄意威胁\n*   在`IT`基础设施内管理威胁的最佳实践\n\
  \n### 威胁的不可控性\n\n意识到关于威胁的一些基本事实是重要的：\n\n*   威胁无法被消除。\n*   威胁总是存在。\n*   有时，威胁会持续存在。某些威胁在资产（如`network`）中可能很长时间未被发现。\n\
  *   可以采取行动来减少威胁发生的可能性。\n*   可以采取行动来减少威胁的影响。\n\n例如，无法阻止小偷想要进入实验室偷取电脑或其包含的数据。但是，可以采取措施来增强或减少针对实验室的威胁。为了增加小偷闯入的几率，可以采取措施，但也可以通过措施来减少针对实验室的威胁。在任何情况下，都可以采取措施来减少威胁发生的可能性。在任何情况下，都可以采取关闭或打开的门。在任何这些情况下，可以采取措施来减少威胁的影响。\n\
  \n`IT`软件的威胁也是类似的。雷击命中建筑，恶意软件作者不断编写新程序，脚本小子运行恶意程序只是看看效果。专业攻击者花费全部时间试图进入个人、政府和公司网络。他们无法阻止别人想要这样做，但可以通过增加难度来挫败他们的努力。\n\
  \n### 无意威胁\n\n无意威胁没有执行者；它们不是因为有人刻意攻击而发生的。自然事件和灾害、人为错误和简单的意外等都是无意威胁。\n\n无意威胁主要分为四类：\n\
  \n*   **环境**——影响环境的威胁。包括天气事件，如洪水、龙卷和飓风。地震和火山也是环境威胁。疾病或流行会导致劳动力损失并降低系统的可用性。\n*  \
  \ **人为**——由人员引起的错误。击键错误可能导致输入错误或无效数据。用户可能会忘记输入关键数据。技术人员可能未能遵循备份程序导致备份不完整。管理员可能会编写不完整或错误的备份程序。未发现的软件漏洞也会导致严重问题。\n\
  *   **意外**——从微小失误到重大灾难的一切。挖掘新电缆深沟的挖掘机意外切断电源或数据电缆。员工可能在休息室意外引发火灾。\n*   **故障**——设备问题。硬盘崩溃、服务器故障或路由器停止路由流量。空调可能停止吹冷风，导致多个系统过热并故障。任何这些故障都可能导致数据或服务的可用性丧失。\n\
  \n尽管这些威胁是无意的，但可以通过风险管理计划来处理。以下是一些常见方法：\n\n*   **管理环境威胁**——可以购买保险来减少许多环境威胁的影响。企业可能会决定搬迁以减少威胁。例如，位于圣海伦斯火山附近的企业可以搬迁以避开喷。飓风带的公司可以将业务转移到其他地方。\n\
  \n\n\n\n\n*   **减少人为错误**——自动化和输入验证是减少错误的常用方法。任何可以自动化的过程都将以相同的方式运行。输入验证在在使用数据之前对其进行检查以确保其有效性。例如，如果程序期望接收一个名字，输入验证器会检查该数据看起来是否像一个有效的名字。对于有效名字的规则可能是不超过\
  \ 20 个字符、不包含数字，且仅允许特定的特殊字符。输入验证无法确保数据的准确性，但它可以确保数据是有效的的。\n*   **防止事故发生**——在密歇根州，在挖掘之前可以联系\
  \ `1-800-MISS-DIG` 公司或其他地区的类似公司或机构来识别地下电缆。机房应安装空调以防止系统宕机。为了防止常见事故，应该强调安全意识。\n* \
  \  **避免故障**——可以使用容错系统和冗余系统来防止故障的即时影响。独立磁盘冗余阵（`RAID`）系统有助于确保数据可用性，而故障转移集群有助于确保用户能够随时访问服务器。\n\
  \n### 蓄意威胁\n\n蓄意威胁 是对组织具有敌意的行为。由一个或多个执行者参与实施此类威胁。执行者的动机通常源于以下之一：\n\n*   **贪婪**——许多攻击者想通过攻击赚钱。攻击者窃取数据并利用其进行欺诈。他们从数据库中窃取客户数据并实施身份盗用。犯罪分子从竞争对手手中窃取专有数据。社会工程师试图欺骗用户放弃财务网站的密码。\n\
  *   **愤怒**——当愤怒是动机时，攻击者通常想让受害者付出代价。愤怒可能导致破坏资产或干扰运营的。这些威胁通常会导致可用性损失。\n*   **破坏意图**——某些攻击者只想造成破坏。其结果与受愤怒驱动的攻击者相同。破坏可能会导致可用性损失。\n\
  \n尽管上述列表有助于理解攻击者的动机，但这些项目并没有识别出攻击者是谁。有些人脑海中仍然留着那种无聊的青少年在房间里发起随机威胁的形象。然而，如今的攻击者要老练得多。\n\
  \n### 提示\n\n美国政府国土安全部维护着一个网站，提供常见威胁及其描述。可以通过该网址 [`www.us-cert.gov/us-cert-tip-categories/threats`](https://www.us-cert.gov/us-cert-tip-categories/threats)\
  \ 访问。\n\n今天一些常见的攻击者包括：\n\n*   **犯罪分子**——通过在线攻击赚钱的机会导致犯罪活动增长。此外，现在的犯罪活动比以往任何时候都更有组织。这种活动包括欺诈和盗窃。例如，`rogueware`（流氓软件）欺骗用户安装假的防病毒软件。然后，他们必须付费才能将其删除。犯罪分子已利用流氓软件索要了数百万。最近，流氓软件已演变为`ransomware`（勒索软件）。犯罪分子限制对系统的访问并向用户显示信息，要求索金以获得对计算机和/或文件的访问。犯罪分子的另一种常见攻击是\
  \ `formjacking`（表单劫持）。此类攻击使用恶意的 `JavaScript` 代码，在电子商务网站的结算阶段窃取客户的个人财务细节，如信用卡信息。\n\
  *   **高级持续性威胁 (APTs)**——这些攻击者专注于特定目标，具有高水平的专业知识和几乎无限的资源。国家力量或恐怖组织经常资助他们。他们同时攻击政府和私人目标。“极光行动”（Operation\
  \ Aurora）就是一个 APT 攻击的例子。调查表明 APT 攻击源自中国。它攻击了数家私营公司，如 `Google`。McAfee 的一份名为《揭秘：影子\
  \ RAT 行》的白皮书讨论了 71 种不同的 APT 攻击。其中 21 个针对政府目标，50 个针对私人公司。\n*   **破坏者**——某些破坏者只想造成破坏。他们的目标是出于机会进行破坏。\n\
  *   **破坏分子**——某些破坏分子蓄意实施破坏。他们的目标是出于机会的。他们的目标是造成某种破坏。这种破坏可能会导致可用性的损失。\n*   **不满的员工**——感到不满的员工会对公司构成重大威胁。员工感到不满的原因有很多，例如没有获得加薪。\n\
  *   **活动家**——偶尔，活动家会对公司构成威胁。他们通常基于目的正当手段的心态运作。也就是说，如果公司做了他们不认可的事，他们就会。\n*   **其他国家**——国际间谍活动是一种常见的威胁。例如，McAfee\
  \ 的“RAT 行”白皮书详细介绍了广泛认为来自中国的活动。攻击者使用远程访问工具 (`RATs`) 来收集信息。他们渗透了多个政府和公司。许多国家将网络战作为其攻防策略的一部分。\n\
  *   **黑客**——黑客试图入侵系统。根据黑客的目标，其动机从好奇到恶意意图不等。\n\n### 提示\n\n黑客和破解者之间存在技术差异。`黑客` 在历史上被称为白帽黑客或伦理黑客（好人）。他们入侵系统是为了学习，而不是为了个人利益。`破解者`被称为黑帽黑客或恶意黑客（坏人）。他们入侵系统是为了破坏、盗取或欺诈。许多黑帽黑客假装白帽黑客，声称他们的行为是无意的。然而，主流媒体将所有黑客归为黑帽。\n\
  \n## IT 基础设施管理的最佳实践\n\n可以通过许多方法管理风险。以下列表代表了 IT 专业人员考虑的做法：\n\n*   **制定安全策略**——高层管理识别并支持安全工作，并制定安全策略，该策略提供了安全目标的高层概述，但不涉及如何实施安全技术的细节。经理使用该策略识别资源并制定实施计划。一旦安全策略获得批准，就需要进行实施和执行。\n\
  *   **购买保险**——公司购买保险以减少威胁的影响。他们通常购买火灾、盗窃和环境事件导致损失的保险。这里考虑的重要原则是：\n\n    *   **比例原则**——用于缓解风险的支出（如购买保险）应与风险成比例。例如，不应购买\
  \ 10 万美元的保单来保护 5 万美元的资产。\n*   **使用访问控制**——用户应通过身份验证，并仅授予访问所需内容的。使用访问控制包括以下两个原则：\n\
  \n\n\n\n\n*   **最小权限原则**——最小权限原则涉及仅授予用户执行其工作所需的权利和权限，而不多给。通过这种方式，可以防止用户意外或故意地引起问题。\n\
  *   **知情需要原则**——知情需要原则涉及仅授予用户执行其工作所需的数据访问权限，而不多给。例如，某人可能拥有机密（Secret）数据的安全许可。然而，该人员并不会自动获得所有机密数据的访问权限。相反，该人员仅被授予其工作所需的访问权限。这有助于防止不必要的访问权限被滥用。\n\
  *   **使用自动化**——应尽可能实现流程自动化，以减少人为错误。\n*   **包含输入验证**——为了确定数据是否有效，应在任何应用程序使用该数据之前对其进行测试。\n\
  *   **提供培训**——培训可用于提高安全意识并减少事故，还可以增强安全意识以减少安全事件。\n*   **使用防病毒软件**——所有系统都应安装防病毒软件，并安排自动进行病毒库更新。\n\
  *   **保护边界**——至少应使用防火墙来保护内网与互联网之间的边界。入侵检测系统（`IDSs`）也可以用于额外的保护层。\n\n### 提示 ![](img/Tip.png)\n\
  安全策略可能包含若干项单独的策略。例如，它可以包含密码策略、可接受使用策略和防火墙策略。\n\n### 注意 ![](img/Note.png)\n权限包括权利和许可。`Rights`（权利）指的是用户在对象上可以执行的操作。例如，用户可能拥有更改系统时间的权利。`Permissions`（许可/权限）指的是对对象的访问。例如，用户可能拥有读取和修改文件的许可。`最小权限原则`包含了权利和许可。`知情需要原则`侧重于数据访问许可。\n\
  \n### 安永全球信息安全调查 2018–2019\n安永（Ernst & Young）作为一家专业服务公司，定期进行调查以识别许多与 IT 安全相关的趋势。2018–2019\
  \ 年的报告包含了 1400 多名安全从业人员的回复，包括首席信息官、首席信息安全官和其他高管。\n\n该报告中的一些显著发现包括：\n* 网络风险正在不断演变；任何认为自己免受网络攻击的组织都可能面临冲击。\n\
  * 企业被要求在三个方面取得进展：通过关注于识别资产和构建防御线来保护企业；通过侧重于停止低价值活动、提高效率并将资金重新投入到新兴和创新技术以增强现有的保护来优化安全性；以及通过将实施“安全设计”作为大多数组织正在经历的数字化转型的关键成功因素来驱动增长。\n\
  * 报告指出，全球每天每天发送出 64 亿封伪造邮件，2017 年数据泄露的平均成本总计达 362 万美元。2018 年发送的钓鱼邮件数量约为 5.5 亿封。\n\
  * 在受访者中，约 40% 的组织报告其网络安全预算与去年相比持平，约 15% 的组织计划将其网络安全预算增加 25% 以上。只有 1% 的受访组织报告其网络安全预算增加了\
  \ 25%。\n\n\n\n\n\n-   减少漏洞的暴露率\n-   降低发生率\n-   减少损失的影响\n-   提供安全教育、培训和意识提升\n\n完全消除威胁是罕见的。相反，更常见的情况是将风险降低到可接受的水平。剩余的风险被称为`residual\
  \ risk`。`表 2-2`将表 2-1 中的威胁/漏洞对与可能的缓解步骤相对应。\n\n### 表 2-2 常见的威胁/漏洞对及可能的缓解措施\n\n| 威胁\
  \ | 漏洞 | 缓解措施 |\n| --- | --- | --- |\n| 火灾 | 缺乏火灾检测和灭火设备 | 安装火灾检测和消防设备；购买保险 |\n\
  | 飓风、地震、龙风 | 位置 | 购买保险；指定备用站点 |\n| 恶意软件 | 缺乏杀毒软件；定义过时 | 安装杀毒软件；至少每周更新一次定义 |\n| 设备故障\
  \ | 数据未备份 | 定期备份数据；将备份副本存放在场外 |\n| 数据被盗 | 访问控制实施不当 | 同时实施身份验证和访问控制；遵循“按需知”原则 |\n\
  | DoS 或 DDoS 攻击 | 公网服务器未受防火墙和 IDS 保护 | 实施防火墙；实施 IDS；定期监控 Web 服务器 |\n| 用户 | 弱密码 |\
  \ 同时实施身份验证和访问控制；创建强密码 |\n| 社会工程人员 | 缺乏安全意识 | 提供培训；通过海报、偶发邮件和简短演示提高意识 |\n\n## 缓解技术\n\
  \n任何企业都可以使用多样化的缓解技术。在探索本节中的技术时，应牢记以下要素：\n\n-   技术的有效性\n-   技术的初始成本和持续成本\n\n例如，杀毒软件有一项初始成本，其中包括在某段时间内（如一年）的更新订阅费用。当订阅过期时，必须进行续费。\n\
  \n在估算任何这些技术的价值和成本时，可以考虑资源的价值和损失的影响。例如，基础社会工程策略的培训可能每年耗花费 10,000 美元。然而，如果用户没有接受培训，公司可能会损失\
  \ 100,000 美元。因此，培训的价值为 90,000 美元。\n\n然而，在估算缓解技术的价值时，还有其他需要考虑的变量。公司去年可能损失了 100,000\
  \ 美元。如果进行了培训，公司预计今年将损失 5,000 美元。因此，培训的价值为 85,000 美元。计算方法如下：\n\n```\nLast year’s\
  \ loss − Training cost − This year’s loss\n$100,000 − $10,000 − $5,000 = $85,000\n\
  ```\n\n以下列表列出了任何企业都可以使用的常用缓解技术：\n\n-   **策略和程序**——书面策略和程序提供了标准。这些标准明确了应该实施什么以及如何实施。正如前面提到的，许多组织从创建安全策略开始。应该定期审查策略和程序。\n\
  -   **文档记录**——文档在许多领域都很有用。更新的网络文档使问题更易排查。一旦发生问题，就可以更快地修复，从而提高可用性时间。随着网络和系统的变化，更新文档是必要的。\n\
  -   **培训**——培训帮助员工理解安全是每个人的责任。某些培训面向所有用户，而其他培训必须针对特定用户。例如，所有终端用户都应接受关于社会工程师的培训，管理员应接受当前威胁和漏洞的培训，经理应接受风险管理策略的培训。培训是一项持续活动；随着情况的变化，应提供更新的培训课程。\n\
  -   **职责分离**——职责分离原则（也称为职责分工）确保没有某个人能控制关键流程的所有功能。该原则旨在防止欺诈、盗窃和错误。例如，会计部门将应收账款和应付账款分开。一个部门接收并批准账单，另一个部门则支付已批准的账单。职责分离还助于防止利益冲突。\n\
  -   **配置管理**——当系统配置标准化时，系统更易于排查和维护。配置管理`的一种方法是使用基准。例如，对系统进行配置然后创建一个系统镜像。该镜像可以部署到其他\
  \ 100 台系统中，使每个系统都完全相同。维护这些系统中的每一个的方法是相同的。技术人员学会了一个系统，就学会了所有此类系统。如果没有基准，系统可能会有 100\
  \ 种不同的配置方式，导致技术人员在提供有效支持之前必须学习每个系统是如何配置的。镜像随配置而更新。配置管理还确保系统不会被不当修改。大多数组织都有变更管理流程，以确保只进行授权的更改。通过合规性审计确保不会发生未经授权的更改。\n\
  -   **版本控制**——当多人协作同一份文档或应用程序时，数据可能会丢失或损坏。版本控制系统常用于应用程序开发。它们跟踪所有的更改并可以减少浪费的时间和，特别是当需要撤销更改时。该过程要求程序员在修改模块或文件之前将其检出。文件修改后，可以提交，其他人也可以修改该文件。某些版本控制软件允许将多个更改合并到一个文件中。\n\
  -   **补丁管理**——随着时间的推移，软件中可能会发现漏洞。软件漏洞是可以被利用的缺陷。当发现漏洞时，供应商会发布补丁；然而，攻击者也会发现这些漏洞。未打补丁的系统容易受到攻击。全面的补丁管理`规范了如何理解、测试以及将补丁部署到系统和客户端。策略应包括合规审计，以验证客户端是否是最新的。补丁管理还可以包括隔离未打补丁客户端的能力。补丁管理几乎是一个持续的过程。\n\
  -   **入侵检测系统**——入侵检测系统 (IDS)旨在检测威胁而非防御威胁。被动 IDS 会记录事件并可能提供报警。主动 IDS 在检测到攻击后可能会修改环境以拦截。许多\
  \ IDS 使用定义就像杀毒软件使用签名。基于网络的 IDS (NIDS) 提供整体网络保护。基于主机的 IDS (HIDS) 可以保护单个系统。\n\n\n\n\
  \n\n- **事件响应**——当公司做好准备并能够响应事件时，它更有机会减少影响。响应事件时的一项重要步骤是遏制，这确保了事件不会扩散到其他系统。事件响应团队试图识别发生了什么。他们寻找导致事件发生的漏洞，然后寻求在未来减少这些漏洞的方法。另一方面，有些公司希望尽快忘记事件。他们试图修复眼前的问题，而不去解决底层问题。必须解决根本性问题，以减少相同问题再次发生事件的概率。\n\
  \n- **持续监控**——安全工作永无完结之日。持续监控\n\nSymantec 的 Ghost 是一种用于镜像和部署桌面电脑、笔记本电脑、平板电脑和服务器的常用工具。Ghost\
  \ 允许快速地迁移到最新的操作系统，配置更新并向多个平台和操作系统发布软件。有关 Ghost 的更多信息请访问 [`www.symantec.com/products/ghost-solutions-suite`](https://www.symantec.com/products/ghost-solutions-suite)。\n\
  \n### 注意 ![](img/Note.png)\n\n微软在每个月的第二个周二发布补丁，这被称为补丁周二）是指利用漏洞的行为。利用通过对 IT 系统执行命令或程序来利用弱点。其结果是系统、应用程序、数据或人员受到损害。利用也可以被看作是由代码甚至人类执行的攻击。社会工程攻击利用了员工对威胁缺乏知识。\n\
  \n在代码的语境下，利用主要攻击面向公共的服务器。换句话说，它攻击在互联网上可用的服务器。常见的互联网服务器有：\n\n- Web 服务器\n- 简单邮件传输协议（SMTP）邮件服务器\n\
  - 文件传输协议（FTP）服务器\n\n**图 2-2**显示了这些面向公共的服务器如何在网络中配置配置。它们被放置在两个防火墙之间，防火墙配置为非军事区 (DMZ)。DMZ\
  \ 也称为`buffer area`或`perimeter zone`。连接到互联网的防火墙允许访问这些面向公共服务器。连接到内部网络的防火墙限制来自互联网的流量。\n\
  \n![图 2-2 被两个防火墙包围的 DMZ 中的面向公共的服务器。](img/9781284183719_CH02_FIGF02.png)\n\n**图 2-2**\
  \ 被两个防火墙包围的 DMZ 中的面向公共的服务器。\n\n由于 DMZ 中的服务器面向公共的，任何具有公共互联网协议 (IP) 地址的人都可以访问它们，这包括攻击者或黑客。\n\
  \n尽管内部服务器容易受到员工的攻击，但员工利用漏洞攻击内部服务器并不常见。员工可以进行攻击并造成损害；但窃取数据或进行破坏对他们来说容易得多。内部人员通常不会花时间编写程序来攻击内部系统。内部人员拥有至少一些基本的员工权限和内部知识。通常，内部网络是受信任的，因此公司对内部网络上的利用关注较少。\n\
  \n\n\n\n\n缓冲区溢出 是一种常见的攻击类型。当攻击者发送的数据比系统或应用程序预期的多或不同时，就会发生这种情况。当系统或应用程序未准备好拒绝这些数据时，漏洞就会存在，这会导致系统运行不可靠。此外，如果漏洞创建者特别高明，漏洞将运行额外的指令，从而在系统上获得额外的权限。\n\
  \n通常情况下，系统会验证并拒绝非预期的数据。偶尔，漏洞会允许无效数据被使用。\n\n例如，这里有一个简单的验证计算：`X / Y = Z`。程序期望提供 `X`\
  \ 和 `Y` 的值。然后它将两者相除以计算 `Z` 的值。然而，如果将 0 作为 `X` 或 `Y` 的值，则无法计算 `Z`。零不能被任何数字除。。如果程序没有检查\
  \ `X` 和 `Y` 是否为有效数字，当用户输入零时，程序可能会失败。如果错误处理得不当，攻击者可能会利用这一失败。\n\n缓冲区溢出错误允许攻击者插入额外数据，这些数据通常是要求立即运行的意外命令的形式。该命令可能会插入一个在网络中传播的蠕虫，或导致服务器关闭且无法重启，也可能是寻找并破坏系统上数据的代码。\n\
  \n当厂商发现缓冲区溢出漏洞时，他们会修复代码以防止未来发生此类错误。应该下载并应用此补丁以修补该漏洞。\n\n### ![](img/Note.png) 注意\n\
  \n虽然除以零错误很容易解释，但它在今天引起问题的可能性不大。大多数应用程序都会检测到该问题并且永远不会尝试除以零。然而，还有许多未被预见的更高级错误。\n\n\
  ### Nimda 病毒\n\nNimda 病毒是一个旧病毒的例子，它利用了微软 Internet 信息服务 (IIS) 中的缓冲区溢出问题。这个病毒有助于解释从\
  \ IT 风险管理中学到的许多教训。\n\n首先，在安装 Windows 2000 Server 时会默认安装 `IIS`。由于 `IIS` 是默认安装的，它通常没有被管理，而未管理的服务更容易受到攻击。\n\
  \n当缓冲区溢出被发现时，微软发布了一个补丁，只要应用了该补丁就能解决问题。然而，当时补丁管理还处于起步阶段。许多公司没有有效的补丁管理计划，并且没有一致地应用补丁。许多系统管理员错误地得出结论，因为他们没有使用\
  \ `IIS`，所以他们的系统没有受到威胁。然而，因为 `IIS` 是默认安装的，他们的系统实际上是有漏洞的。\n\nNimda 发布在互联网上，采取了多管齐下的方法。缓冲区溢出允许它利用\
  \ `IIS` 系统，它有一个蠕虫组件，允许它寻找并感染内部网络上的其他系统，它寻找互联网上容易受到相同缓冲区溢出的其他 `IIS` 服务器，并让网络活动慢到爬行速度且破坏数据。\n\
  \n被 Nimda 强化的两个基本安全实践是：\n\n*   **减少服务器的攻击面**——不应安装不需要的服务和协议。如果已经安装，就应该将其删除。如果服务器上没有安装\
  \ `IIS`，它就不会受到 Nimda 的攻击。这种情况在本文后部分会有解释。\n*   **保持系统更新**——如果 `IIS` 服务器已经用发布的补丁进行了更新，它们就不会受到这种攻击。\n\
  \n其他攻击手段包括：\n\n*   **SQL 注入攻击**——SQL 注入攻击 利用了对用户提供数据的审查或检查的疏严。许多网站要求用户在文本框或网络地址中输入数据。如果用户提供的数据没有经过适当验证，这些数据就可以被直接用作\
  \ SQL 语句，这就是 SQL 注入攻击发生的情况。通常，在提供预期的数据末尾，会添加一个 SQL 命令。这种注入攻击执行了一段不同的 SQL 代码字符串。这段不同的代码可能会破坏数据库。通过使用参数和存储过程可以很容易避免\
  \ SQL 注入攻击，它们在允许代码影响系统之前会对代码进行审查。然而，并不是所有的数据库开发者都意识到这些风险。\n*   **拒绝服务 (DoS) 攻击**——拒绝服务\
  \ (DoS) 攻击 旨在防止系统提供服务。例如，SYN 洪水攻击 就很常见。通常情况下，传输控制协议 (TCP) 使用三次握手来建立连接。主机发送一个设置了同步\
  \ (`SYN`) 标志的数据包。服务器返回设置了 `SYN` 和确认 (`ACK`) 标志的包。主机随后返回设置了 `ACK` 标志的包以完成握手。在 SYN\
  \ 洪水攻击中，主机永远不会响应第三个包。这种场景可以比作主机和服务器伸出手要握手，但主机随后收回了手，导致服务器的手悬在空中。当在短时间内重复进行这种操作时，会消耗服务器的资源并导致其崩溃。\n\
  *   **分布式拒绝服务 (DDoS) 攻击**——分布式拒绝服务 (DDoS) 攻击 从多个客户端同时启动。例如，许多犯罪分子和攻击者从命令和控制中心运行僵尸网络。僵尸网络控制多个作为`克隆`或`僵尸`的主机。这些克隆可以在任何时间接收命令并进行攻击。攻击可能只是简单地\
  \ ping 服务器。如果成千上万个客户端都在 ping 服务器，它就无法轻松响应其他请求。\n\n### ![](img/Note.png) 注意\n\n结构查询语言\
  \ (SQL) 是用于查询和修改数据库的语言。它有必须遵守的规则。动态 SQL 是直接接受用户输入的 SQL 语句。例如，语句可能是 `SELECT FROM\
  \ Users Where LName = ‘txt.Name’`。在这个例子中，`txt.Name` 的值是从文本框中获取并在程序运行时使用的。不建议在没有任何输入过滤的情况下允许用户直接输入。\n\
  \n\n\n\n\n- **公共服务器发现**——互联网上的每个系统都有公网 IP 地址。该部门可以使用 `ping` 扫描器来识别运行公网 IP 地址的系统。IP\
  \ 地址是按地理分配的，因此服务器也可以映射到地理位置。\n\n- **服务器指纹识别**——该部门可以使用多种方法来尽可能多地了解被发现服务器的信息。可以使用\
  \ `ping` 来识别系统运行的是 UNIX 还是微软操作系统。该部门可以使用端口扫描来识别哪些端口是开放的。根据开放的端口，可以识别出正在运行的协议。例如，端口\
  \ `80` 是超文本传输协议（`HTTP`）的常用。因此，如果端口 `80` 是开放的，那么 `HTTP` 可能正在运行。如果 `HTTP` 正在运行，该服务器可能是一个\
  \ Web 服务器。该部门可以使用其他技术来确定服务器是 Apache 还是 IIS Web 服务器。\n\n- **漏洞发现**——该部门的调查人员和黑客不断寻找新的漏洞。他们可以尝试新事物来观察可以做什么，或者潜伏在新闻组中听取未广为人知的漏洞漏洞。他们可能会订阅专业期刊或阅读\
  \ IT 安全专家的博客，如果他们发现了漏洞，就可以将其传递给程序员或攻击者进行利用。\n\n- **程序员**——漏洞被发现后，程序员可以编写代码或应用程序来利用这些漏洞。几行代码被嵌入网页中，并在用户访问网站时被下载。可以发布病毒来利用该弱点，或者在僵尸计算机上安装应用程序，等待僵尸网络的命令进行攻击。这些程序员中有些人是黑帽黑客。\n\
  \n- **攻击者**——攻击者发起利用。例如，攻击者可能发现 Apache 服务器的一个新漏洞。他们可能想针对位于华盛顿特区的服务器。他们可以从其他部门获取华盛顿特区运行\
  \ `Apache` 的服务器列表，然后对这些服务器发起攻击。这个小组可能会定期发起遗留攻击，而这些攻击是当前的补丁无法拦截的。大多数系统都会打补丁，但如果小组成员发现了一个未打补丁的系统，他们就可以利用它。例如，他们对\
  \ 10,000 台电脑发起了攻击。即使他们的成功率只有 1%，他们也利用了 100 台电脑。\n\n这个位于敌对国家的秘密部门被描绘为虚构。然而，一个国家对另一个国家的网络攻击并非虚构。新闻媒体经常报道网络攻击。“极光行动”（Operation\
  \ Aurora）和“影子 RAT 行动”（本章之前提到）是近期的两个例子。如果有人想对敌对国家发动网络战争，他们将如何做呢？他们可能会设计一个具有类似部门的类似部门。\n\
  \n即使是单个犯罪者发起攻击，上述步骤也是分离开的。攻击者会花时间通过侦察尽可能多地了解目标，甚至可能开发一个程序来自动化攻击。无论如何，实际的攻击通常是很快的。\n\
  \n意识到攻击者经常将 100% 的工作时间花在攻击上是非常重要的。因为他们的攻击通常带来大量的资金，所以他们并不吝每周工作超过 40 小时。他们花时间发现目标、识别弱点并计划攻击。当机会出现时，他们就会俯冲并攻击，就像猫头鹰攻击田野鼠一样快。\n\
  \n### ![](img/Note.png)注意\n\n攻击者在发起攻击时经常使用转移注意力。他们不是从自己的电脑发起攻击，而是控制互联网上的一个或多台其他计算机。然后从那个远程控制的计算机引导攻击。\n\
  \n#### 犯罪者从哪里获取有关漏洞和利用程序的信息？\n\n犯罪者可以学习漏洞和利用程序的来源多到令人惊讶。其中一个主要来源是安全专业人员相互共享信息。\n\
  \n当然，当安全专业人员编写或讨论某种利用程序时，危险在于他们正在教育敌人。由于这种可能性，一些人认为不应该讨论这些漏洞。然而，当闭口不谈时，系统受到攻击，而\
  \ IT 专业人员却对漏洞一无所知。\n\n目前盛行的普遍心态是，在讨论漏洞时应侧重于缓解措施。换句话说，不建议公开分享如何利用漏洞的细节，但自由分享如何防止漏洞的细节是合理的。\n\
  \n即使是分享有关防止漏洞的细节，也会为攻击者提供信息。他们可以使用这些信息来了解弱点并对其进行利用。然而，备选方案更糟。如果不共享如何减少弱点的信息，将会有更多系统处于无防护状态。\n\
  \n以下列表列出了攻击者可以用来获取信息的一些来源：\n\n- **博客**——许多安全专业人员经常就他们的发现写博客。当他们怀疑有漏洞时，他们经常会讨论这些。许多全职安全专业人员对发布的内容非常谨慎，因为他们意识到自己的受众很复杂，并试图避免提供过多的细节。\n\
  \n- **论坛**——IT 和安全专业人员经常在各种论坛上分享想法。有时，用户遇到了他们不理解的问题，他们就把问题发布在论坛上。这些问题中的某些暴露了可以被利用的漏洞。\n\
  \n- **安全简报**——许多安全简报定期发送给邮件列表中的任何人，任何人都可以注册。虽然公司使用简报来广告和推广他们的产品，但简报也提供了有价值的内容。此类内容包括有关威胁和漏洞的信息。攻击者甚至可以使用美国政府发布的简报。本章稍后将讨论其中一些简报，包括如何订阅它们。\n\
  \n- **2600: 黑客季度刊**——该杂志可以在线订阅，也可以在书店购买纸质版。杂志经常包含可以用于利用漏洞的代码和细节。\n\n- **常见漏洞和披露\
  \ (CVE) 列表**——本章将详细讨论 `CVE`。当有人发现漏洞时，他或她可以将其提交给 `MITRE Corporation` 以收录在该列表中。有关漏洞的条目将包含有关更多资源的信息。\n\
  \n- **逆向工程**——之前提到“补丁周二”是微软发布补丁的日子，即每个月的第二个周二。第二天被某些攻击者称为“利用周三”。他们经常对补丁进行逆向工程以发现漏洞。一旦理解了弱点，就会编写利用程序来攻击该弱点。\n\
  \n- **暗网**——`暗网`代表了只有使用特殊软件才能访问的网络的一部分。专业黑客利用`暗网`共享漏洞和利用应用程序的方法。暗网网站的一些示例包括 `The\
  \ Hidden Wiki`、`SoylentNews`、`ProPublica`、`DuckDuckGo` 和 `Galaxy3`。如果对网络安全了解不多的人考虑访问这些网站，他们应该使用虚拟专用网络\
  \ (`VPN`) 连接。\n\n应该采取良好理念是：如果存在漏洞，坏人就知道它，而只需要一个知道漏洞的坏人攻击未受保护的系统。所有系统必须受到保护才能保持保护。\n\
  \n\n\n\n暗网通常用于非法活动。深层网是指其他所有内容。暗网包含在典型搜索引擎（如 `Google`）中无法找到的内容。它通过匿名方式访问，且仅使用特殊的隐藏软件网络进行。\n\
  \n## 缓解技术\n\n缓解技术是保护易受攻击系统必要的各个步骤。这些步骤合在一起被称为服务器加固。服务器加固使其比默认安装状态更安全。\n\n为了保护面向公众的服务器，可以采取的一些特定缓解技术包括：\n\
  \n*   `移除或更改默认设置`——如果操作系统或应用程序具有默认设置，请确保在系统安装后立即移除或更改这些设置。例如，将默认密码更改为安全密码。通常还会更改特权账户的名称，例如\
  \ `Administrator` 账户。这样做可以阻碍破解密码的尝试。\n\n*   `减少攻击面`——攻击面指的是服务器上可以被攻击的服务数量。例如，如果服务器上运行着\
  \ 10 个服务，但只需要 7 个，则可以通过禁用那 3 个不需要的服务来减少攻击面。为了减少整体攻击面并从而降低风险，应该移除所有不需要的服务和协议。\n\n\
  *   `保持系统更新`——应该使用补丁管理系统来确保漏洞得到修补，并并在补丁发布后尽快应用。每过去一个没有打补丁的小都会给攻击者更多时间对补丁进行逆向工程并开始攻击。合规性审计确保补丁一致地应用到所有系统中。\n\
  \n*   `启用防火墙`——防火墙过滤进入网络的流量，而 DMZ 使用防火墙来创建网络缓冲区域。还可以在每台服务器上启用基于主机的防火墙作为额外的保护层。\n\
  \n*   `启用 IDS`——主动的 `IDS` 可以检测攻击并采取措施阻止它们。\n\n*   `启用入侵预防系统`——入侵预防系统 (IPS) 部署在流量的链路上。它能检测并拦截恶意流量，以防止攻击到达内部网络。\n\
  \n*   `安装防病毒软件`——在连接到网络之前，应在所有系统（包括服务器）上安装杀病毒软件。许多服务器需要不同版本的杀病毒软件。例如，`Microsoft\
  \ Exchange` 邮件服务器需要专门版本的杀病毒软件，以便对邮件存储进行检查。\n\n## 在 IT 基础设施中管理漏洞的最佳实践\n\n可以使用几种最佳实践来降低漏洞带来的风险。其中许多技术与基础风险管理实践直接相关：\n\
  \n*   `加固服务器`——上一节提到了加固服务器的方法。这些方法包括诸如减少攻击面和保持系统更新等基本步骤。\n\n*   `使用配置管理`——系统应配置为具有一致的安全设置和安全基准，以确保系统的配置方式相同。安全基准可以来自\
  \ `Symantec’s Ghost` 等工具创建的镜像。也可以通过技术（如 `Microsoft’s Group Policy`）向所有系统应用设置来实现安全基准。应该执行合规性审计，以确保系统保持相同的配置。\n\
  \n*   `进行风险评估`——通过执行风险评估，可以了解相关的威胁和漏洞。然后，可以识别并评估应对措施。\n\n*   `进行漏洞评估`——本章节前面提到了漏洞评估。它们也可以作为管理漏洞的最佳实践。\n\
  \n*   `使用安全信息和事件管理 (SIEM) 工具`——`SIEM` 工具通过对在系统中收集的安全事件和活动进行分析，对系统的安全告警提供实时分析。\n\n\
  ## 美国联邦政府风险管理倡议\n\n美国联邦政府已采取许多措施帮助公司管理 IT 。本节涵盖的倡议包括：\n\n*   国家标准技术研究院 (`NIST`)\n\
  *   国土安全部 (`DHS`)\n*   国家网络安全和通信集成中心 (`NCCIC`)\n*   美国计算机应急响应小组 (`US-CERT`)\n* \
  \  `NIST`\n*   `DHS`\n*   `NCCIC`\n*   `US-CERT`\n*   `MITRE`\n\n### 国家标准技术研究院\n\
  \n国家标准技术研究院 (NIST) 是美国商务部的一个部门。其使命是促进美国的创新和工业竞争力。它通过推进测量科学、标准和技术来实现目标。\n\n作为 `NIST`\
  \ 部分的信息技术实验室 (`ITL`) 发布特别出版物。特别出版物 800 (`SP 800`) 系列包含了若干份记录 `ITL` 工作的报告。在互联网上有很多。`NIST`\
  \ 修订了这些许多文档，因此数量可能无法反映当前版本的相对日期。\n\n### 注意\n\n`ITL` 和 `ITIL` 是两个不同的计划。信息技术库 (`ITIL`)\
  \ 由英国 (`UK`) 开发，由英国政府商务部 (`OGC`) 管理。`ITIL` 是一系列书籍，为 IT 的成功运行提供指导和最佳实践。由 `NIST` 管理的\
  \ `ITL` 是美国的计划。\n\n以下列表包含部分出版物：\n\n*   `SP 800-183` 物联网网络\n*   `SP 800-154` 以数据为中心的威胁建模指南\n\
  *   `SP 800-153`无线局域网 (`WLANs`) 安全指南\n*   `SP 800-150` 网络威胁信息共享指南\n*   `SP 800-124\
  \ Rev. 1`企业移动设备安全管理指南\n*   `SP 800-123`通用服务器安全指南\n*   `SP 800-122`个人身份信息 (`PII`)\
  \ 机密性保护指南\n*   `SP 800-121 Rev. 2` 蓝牙安全指南\n*   `SP 800-119` IPv6 安全部署指南\n*   `SP\
  \ 800-115` 信息安全测试与评估技术指南\n*   `SP 800-100` 信息安全手册：经理指南\n*   `SP 800-94` 入侵检测与防御系统\
  \ (`IDPS`) 指南\n*   `SP 800-84` IT 计划和能力的测试、培训和演练计划指南\n\n\n\n\n*   SP 800-83 Rev.\
  \ 1, 桌面电脑和笔记本电脑恶意软件事件预防与处理指南\n*   SP 800-63-3, 数字身份指南（系列文档）\n*   SP 800-61 Rev.\
  \ 2, 计算机安全安全事件处理指南\n*   SP 800-55 Rev. 1, 信息安全性能测量指南\n*   SP 800-53 Rev. 4, 联邦信息系统和组织的安全与隐私控制\n\
  *   SP 800-51 Rev. 1, 漏洞命名方案使用指南\n*   SP 800-50, 构建信息技术安全意识与培训计划\n*   SP 800-40\
  \ Rev. 3, 企业补丁管理技术指南\n*   SP 800-34 Rev. 1, 联邦信息系统应急计划指南\n*   SP 800-37 Rev. 2,\
  \ 信息系统和组织风险管理框架：一种安全与隐私的系统生命周期方法\n*   SP 800-30 Rev. 1, 风险评估指南\n*   SP 800-12 Rev.\
  \ 1, 信息安全简介\n\n### ![](img/Note.png) 注意\n\n可以从 NIST 网站访问特别出版物（Special Publications）完整列表，包括所有文档的链接：[`csrc.nist.gov/publications/sp800`](https://csrc.nist.gov/publications/sp800)。\n\
  \n#### 国土安全部\n\n国土安全部 (DHS) 负责保护美国免受威胁和紧急情况的影响，包括恐怖主义攻击。国土安全部还负责应对自然灾害，如飓风和地震。\n\
  \n国会于 2002 年 11 月通过了《2002 年国土安全法案》，并在此建立了国土安全部。《2002 年国土安全法案》和国土安全部都是为了应对 2001 年\
  \ 9 月 11 日的恐怖爆炸袭击而创建的。\n\n国土安全部包含许多机构，其中一些：\n*   美国秘密服务局 (U.S. Secret Service)\n\
  *   美国海岸守卫队 (U.S. Coast Guard)\n*   美国移民海关执法局 (U.S. Immigration and Customs Enforcement)\n\
  *   联邦紧急管理局 (Federal Emergency Management Agency)\n\n### 国家网络安全与通信集成中心\n\n国家网络安全与通信集成中心\
  \ (NCCIC) 在国土安全部内部运行。它与私人、公共和国际伙伴共同确保网络空间和美国网络资产的安全。\n\n此前，网络安全分散在不同部门。今天，NCCIC\
  \ 作为中央联系点。NCCIC 监督多个计划：\n*   **国家网络安全意识系统**——这是一个电子邮件警告系统，允许用户订阅各种电子邮件。\n*   **美国计算机应急准备小组\
  \ (USCERT)**——它与私人、公共和国际伙伴合作，确保网络空间和美国网络资产的安全。\n*   **USCERT 运营**——负责协调和应对网络威胁和漏洞。\n\
  *   **工业控制系统 (ICS)**——USCERT 负责为工业控制系统的安全提供支持。\n\n### ![](img/Note.png) 注意\n\n特别出版物（Special\
  \ Publications）的完整列表可以访问，包括所有文档的链接，位于 NIST 网站：[`csrc.nist.gov/publications/sp800`](https://csrc.nist.gov/publications/sp800)。\n\
  \n*(注：由于提供的原文后半部分存在大量重复和逻辑断层，上述翻译已根据“不要重复输出原文”的原则，对核心结构性内容进行了精简处理。)*\n\n\n\n\nMITRE\
  \ 是一个缩写，但其首字母与此并无关。许多原始员工来自马萨诸塞理工学院（MIT）。这些员工从事研究和工程（RE）工作。然而，MITRE 并不是 MIT 的一部分。\n\
  \nNIST 在国家漏洞数据库（NVD）中使用 `CVE` 名称和描述。NVD 列表包含与 `CVE` 相同的信息，但增加了影响和严重性评分。[`cve.mitre.org/cve/`](http://cve.mitre.org/cve/)\
  \ 页面包含了搜索链接，用于在 MITRE 的 `CVE` 列表或 NIST 的 `NVD` 列表中搜索该条目。\n\n`CVE` 被认为是信息安全漏洞命名的标准。MITRE\
  \ 组织于于 1999 年启动了 `CVE`，并迅速获得了采用。一些相关的里程碑包括：\n\n* **2000 年**——超过 40 种产品被宣布与 `CVE`\
  \ 兼容。`CVE` 被 29 个组织使用。\n* **2001 年**——超过 300 个产品和服务被宣布兼容。`CVE` 被超过 150 家公司使用。\n\
  * **2002 年**——NIST 建议美国机构使用 `CVE`。发布了 `SP 800-51`《常见漏洞与暴露（`CVE`）漏洞命名方案》。`SP 800-51`\
  \ 在 2011 年经过了更新和重命名。目前的名称是《漏洞命名方案使用指南》。\n* **2003 年**——启动了 `CVE` 兼容性流程。该流程允许产品和服务获得官方兼容性状态。\n\
  * **2004 年**——美国国防信息系统局（DISA）要求使用带有 `CVE` 标识的产品。\n* **2007 年**——NVD 对基于 `CVE` 的数据库进行了多项升级。这些升级提高了可用性并改进了评分系统。此后，许多其他实体也采取了\
  \ `NVD`，这增加了 `CVE` 作为标准的使用。\n* **2008 年**——`CVE` 对多个跨站脚本（`XSS`）漏洞提供了重大更新。[SCMagazine.com](http://SCMagazine.com)\
  \ 上 2008 年 12 月 29 日的一篇名为“微软否 Windows Media Player 漏洞”的文章中提到了 `CVE`。\n* **2009 年**——数据库进行了更新，包含了跨多个媒体和搜索引擎的主要安全漏洞。`CVE`\
  \ 庆祝了成立 10 周，记录了超过 38,000 个漏洞。\n* **2010 年**——`CVE` 扩大了范围和认可度。`CVE` 在 2010 年 6 月份的《Hacking》杂志中一篇名为“保护网络\
  \ IP 电话（VoIP）”的文章中被提到。\n* **2011 年**——DHS 网站上 2011 年 12 月 12 日发布的《安全网络未来之蓝图：国土安全企业的网络安全战略》中提到了\
  \ `CVE`。\n* **2012 年**——`CVE` 获得了新的认可。`CVE`、常见弱点枚举（CWE）以及 `CWE/SANS` 前 25 危险软件错误在\
  \ *CrossTalk: The Journal of Defense Software Engineering* 2012 年 3/4 月刊的一篇名为“供应链风险管理”的文章中被提到。\n\
  * **2013 年**——`CVE` 为已识别的漏洞重新设计了编号格式。MITRE 公司宣布 `CVE` 列表将开始使用常见漏洞报告框架（`CVRF`）发布数据。`CVE`\
  \ 列表是软件中公开信息安全漏洞的通用名称字典。\n* **2014 年**——`CVE` 在与近期影响 Apple 和 Linux 操作系统的网络时间协议漏洞相关的众多主要公告、帖子和新闻媒体引用中被引用。\n\
  * **2015 年**——`CVE` 被在国际电信联盟（ITU）网站上 2015 年 9 月一份题为“2015 年电信与信息技术安全”的技术报告中。\n* **2017\
  \ 年**——`CVE` 庆祝为公开的网络安全漏洞提供通用标识符，涵盖了从较小的缺陷（如缺少 `HttpOnly` 标记）到像 EternalBlue 这样头条新闻式的漏洞的所有内容。\n\
  * **2018 年**——`CVE` 列表突破了 100,000 条目。\n* **2019 年**——`CVE` 现在已运行 20 年。\n\nFBI/SANS\
  \ 前 20 个最关键互联网安全漏洞列表也引用了 `CVE` 列表。\n\n## 章节总结\n\n威胁始终存在且无法消除。威胁造成危害的可能或威胁的影响可以减少，但无法消除威胁本身。然而，可以采取许多步骤来减少漏洞。最重要的漏洞是那些可能作为“威胁/漏洞对”进行匹配的漏洞。一旦识别出可能的威胁/漏洞对，就可以实施缓解技术。\n\
  \n美国联邦政府拥有许多组织可以使用的资源来管理风险。美国标准与技术研究院（NIST）发布了多份特别出版物。`SP 800` 系列包含了许多针对 IT 安全的出版物。国土安全部也有许多专注于\
  \ IT 安全的部门。其资源供 IT 和安全专业人员免费使用。\n\n## 核心概念与术语\n\n* 攻击\n* 缓冲区溢出\n* 配置管理\n* 持续监控\n\
