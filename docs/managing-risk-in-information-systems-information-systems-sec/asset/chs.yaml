  \ E-Rate 资助\n### 4. 是否为联邦机构\n\n### 12. 什么决定了一个组织是否受 CIPA 的管辖？\n1. 是否已在证券交易委员会注册\n\
  2. 其员工是否处理健康相关信息\n3. 是否接收 E-Rate 资助\n4. 是否为联邦机构\n\n### 13. 对一项预期控制措施进行了成本效益分析（CBA）。CBA\
  \ 显示该控制措施的成本与其预期收益相差不多。应该怎么办？\n1. 识别投资回报率 (ROI)\n2. 购买控制措施\n3. 取消购买控制措施\n4. 重新进行\
  \ CBA\n\n### 14. 下列哪个是识别控制措施预期收益的有效公式？\n1. 控制后损失 − 控制前损失\n2. 控制前损失 − 控制后损失\n3. 控制成本\
  \ + 损失\n4. 控制成本 / 12\n\n### 15. CBA 可证明购买控制措施的合理性。\n1. 正确\n2. 错误\n\n![© Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n\
  \n© Sai Chan/Shutterstock\n\n将风险评估转换为风险缓解计划\n\n## 第 11 章\n\n一旦风险评估完成并获得批准，下一步就是创建风险缓解计划。该计划将实施已批准的应对措施。如果距离风险评估完成已经过了很长时间，应该检查发现的结果，以确保它们仍然有效。例如，某些威胁或漏洞可能已经消失。\n\
  \n风险缓解计划的重要部分是识别成本。理想情况下，风险评估已经识别了成本，但可能忽略了一些隐藏成本。如果发现了额外的成本，则需要重新计算成本效益分析。最后，跟进风险缓解计划至关重要，这包括确保所有批准的应对措施都已实施，并且这些措施按预期缓解了风险。\n\
  \n### 第 11 章主题\n本章涵盖以下主题和概念：\n* 什么是风险评估审查\n* 将风险评估转换为风险缓解计划涉及什么\n* 如何对风险元素排序\n*\
  \ 验证风险元素涉及什么\n* 风险元素的成本效益分析包括什么\n* 执行风险缓解计划包括什么\n* 如何跟进风险缓解计划\n* 实现风险缓解计划的最佳实践\n\
  \n### 第 111 章目标\n完成本章后，你将能够：\n* 评估为基础设施创建的风险评估\n* 描述将风险评估转换为风险缓解计划的过程\n* 讨论风险元素排序的重要性\n\
  * 描述验证哪些风险元素可以被缓解的过程\n* 执行风险元素的成本效益分析\n* 描述实施风险缓解计划的过程\n* 描述跟进风险缓解计划的过程\n* 根据风险评估列出实现风险缓解计划的最佳实践\n\
  \n### 审查 IT 基础设施的风险评估\n一旦风险评估完成并获得批准，就可以对 IT 基础设施进行审查。\n\n* 识别并评估威胁。\n* 识别并评估相关的漏洞。\n\
  * 识别并评估应对措施。\n* 制定建议。\n\n#### **现场应对措施**\n一旦风险评估完成并获得批准，就可以对 IT 基础设施进行审查。\n\n####\
  \ **计划中的应对措施**\n一旦风险评估完成并获得批准，就可以对 IT 基础设施进行审查。\n\n#### **已批准的应对措施**\n一旦风险评估完成并获得批准，就可以对\
  \ IT 基础设施进行审查。\n\n#### 重叠应对措施\n审查计划时的另一个重要考虑因素是确定应对措施之间是否存在重叠。一项应对措施可能会减少或解决多个一个风险。此外，某些风险可能会被多个应对措施缓解。\n\
  \n重叠可能是故意的也可能是意外的。换句话说，对于单个风险可能会实施多项应对措施。这确保了即使某应对措施失败，风险也能得到缓解。意外重叠发生在两个或多个应对措施缓解了同一个风险，但这种重叠并非刻意。只要应对措施不是以相同的方式缓解相同的风险，就没有问题。然而，任何应对措施的重叠都应该被识别。\n\
  \n如果一个应对措施与其他应对措施重叠，两者可能会发生冲突。尽管许多安全应对措施协同工作，但某些应对措施可能会给其他应对措施带来问题。\n\n例如，用于保护服务器的漏洞扫描器和入侵检测系统（IDS）可能会冲突。漏洞扫描器可以配置为每天扫描此服务器。然而，IDS\
  \ 可能会检测到此扫描并发送警报，因为它将扫描识别为潜在攻击。此通知可能是发送给管理员组的电子邮件。\n\n在这个示例中，IDS 警报是虚假警报（或误报）。它需要管理员对警报进行调查和审查。由于内部漏洞扫描器导致了警报，显然这不是真实的攻击。然而，调查仍然需要时间。\n\
  \n### 被忽略的持续整个周末的攻击\n一个大型网络操作中心设有几项应对措施来检测攻击。这些应对措施通过所有人员均可见的大型显示器向网络操作中心人员发送通知。\n\
  \n\n\n\n\n某个周末，一个入侵检测系统（IDS）发送了潜在攻击的警报。其中一名管理员进行了调查，发现这是一个虚假警报。在接下来的一小时内又发生了三次警报，其他管理员进行了调查。每一次都是虚假警报。\n\
  \n这些虚假警报持续不断，但在之后的几小时内的某个时刻，发生了真实的攻击，这也引发了警报。然而，管理员开始预期虚假警报，对所有警报的关注越来越少。这个 IDS\
  \ 变成了一个“狼来了”的 IDS。当真狼出现在门口时，没有人相信，没有任何警报被识别为有效。\n\n当管理员在周一早晨上班时，他们完成了活动审查并检测到了真实的攻击。幸运的是，攻击没有导致任何系统崩溃，但攻击者收集了一些侦察数据。\n\
  \n应尽可能减少虚假警报。人员可能会习惯看到警报并在不进行调查的情况下将其忽略。这种减少虚假警报的行为被称为“调优 IDS”。如果不进行调优，人员可能在调查之前就忽略正在进行的攻击。\n\
  \n只要两项防御措施互不冲突，重叠的防御措施是可以接受的。事实上，深度防御策略鼓励针对不同的风险采取多项防御措施。如果某项防御措施失败或被绕过，另一项防御措施仍然提供保护。\n\
  \n## 风险评估：理解威胁与漏洞\n\n确定防御措施是否重叠的方法之一是进行风险评估，将防御措施映射到威胁、漏洞和受保护的资产上。这有助于描绘完整的风险蓝图，风险通常用以下公式表示：\n\
  \n`Risk = Threat × Vulnerability × Asset`\n\n漏洞是一个弱点；它本身并不构成风险。同样，威胁本身也不构成风险。风险是指威胁利用漏洞对资产造成损失、损坏或伤害的概率。防御措施旨在减少或消除威胁或漏洞对资产的影响。\n\
  \n### ![](img/Note.png)注意\n\n`Risk = Threat × Vulnerability × Asset` 并不是一个数学公式。换句话说，并没有给威胁和漏洞分配数值来确定风险的数值值。相反地，该公式表明，当威胁和漏洞结合在一起并损害资产时，风险就会发生。\n\
  \n根据 `NIST 800-30`，风险评估用于识别、估计和优先考虑业务或组织运营面临的风险。风险评估帮助这些组织中的决策者识别并评估这些威胁如何影响他们，以及可以实施哪些防御措施来减少漏洞和对资产的伤害。最终结果是对风险的判定。\n\
  \n### 提示\n\n不可否赖性防止个人否认他们执行过某项操作。通过记录用户名，审计日志包含了执行操作人员的详细信息。由于活动被记录，用户无法否认他们执行了该操作。如果一个用户可以使用另一个用户的账户，有效的不可否赖性就会丢失。对于所有团队成员都使用的共享账户（例如“admin”），情况也是如此。某些日志包含互联网协议（IP）地址和计算机名称。这种审计跟踪有助于调查人员确定实际发生了什么。\n\
  \n例如，考虑离职员工的账户。作为一种最佳实践，在员工离开时，应该禁用账户而不是删除账户。如有必要，管理员稍后可以使用不同的密码启用账户。这允许主管访问前员工的数据。在主管检查并复制重要数据后，管理员将删除该离职员工的账户。\n\
  \n想象一家公司对旧账户没有采取任何措施。只要账户处于启用状态，任何人都可以访问。\n\n如果之前的员工对网络拥有物理访问权限，他们就可以登录。某些网络甚至允许他们远程登录。他们将拥有与从未离开工作时相同的权限。他们就可以像作为员工一样访问所有相同的数据。他们可以读取、修改或删除数据。\n\
  \n也许之前的员工在公司内仍有朋友。离职员工可以将他的凭据交给朋友，朋友可以使用该离职员工的凭据登录。此时，不可否赖性就丢失了。如果记录了任何活动，看起来就像是离职员工在执行该操作。例如，Bob\
  \ 是一个离职员工，但 Sally 知道了了他的用户名和密码。有了这些信息，Sally 可以以 Bob 的身份登录。审计日志可能会记录 Sally 做了，但记录的是\
  \ Bob 的用户名。这可能会让安全人员徒费劳力，试图确定 Bob 是如何进入网络的。\n\n在这种情况下，漏洞是未激活账户仍然处于启用状态。用户账户没有被管理，导致它们处于可用状态。威胁是之前的员工或其他可能登录并访问该账户。可能丢失、损坏或伤害的资产包括公司信息。\n\
  \n## 识别防御措施\n\n通过添加防御措施来缓解风险。可以实施以下防御措施来缓解未禁用账户带来的风险：\n\n-   **创建账户管理策略**：账户管理策略是一项明确说明对账户应该如何处理的书面策略。该策略涵盖的范围可能远不止离职员工账户。例如，它还可以解决创建账户时使用的格式，如\
  \ `firstname.lastname`。它可能包括账户锁定策略的要求以及密码策略的详细信息。\n-   **创建检查账户使用的脚本**：可以指派管理员编写一个脚本来识别未活动的账户。组织可以将未活动账户定义为任何过去\
  \ 30 天内未使用的账户。该脚本将扫描账户并自动禁用未活动的账户。管理员可以安排脚本每周运行一次，记录结果并将结果通过电子邮件发送给相关人员。\n-   **控制对员工区域的物理访问**：可以对员工专用的区域的访问进行控制。限制访问可以简单地张贴告示以阻挡非员工进入，也可以通过复杂的手段，如使用物理锁、密码锁、磁卡或感应卡来实现。\n\
  \n同样，风险评估可能会确定用户没有使用强密码或没有定期更改密码。漏洞是密码很弱，因为密码破解工具可以轻松破解弱密码。威胁是攻击者可能会使用现有的许多工具之一来破解弱密码。攻击者随后可以使用破解的密码登录系统或网络。\n\
  \n解决方案是实施密码策略。密码策略通常是整体账户管理策略的一部分。可以使用技术手段强制密码策略。例如，Microsoft 域允许 IT 管理员通过组策略强制强密码规范。\n\
  \n### ![](img/Tip.png)提示\n\n组策略设置允许管理员在域中配置一次设置。该设置将适用于域中的所有用户和计算机。如果需要，管理员还可以配置组策略对象以应用于特定的用户和计算机。一旦配置完成，组策略在拥有\
  \ 5 个用户和计算机的网络中工作的方式，与在拥有 50,000 个用户和计算机的网络中工作的方式一样。\n\n\n\n\n\n-   **密码长度**——常见的建议长度为普通用户至少\
  \ 8 个字符，管理员至少 15 个字符。虽然对于没用过这种长度密码的管理员来说，15 位密码似乎很荒谬，但它们确实在使用。不过，通常使用短语（passphrases）代替密码。例如，密码可以是\
  \ `IL0veR1$kM@n@gement`。这是一个复杂的 19 字符密码，但并不难记忆。\n\n-   **复杂度**——复杂度指的是字符的混合情况。复杂密码通常包含四种字符类型中的至少三种。字符类型包括大写字母、小写字母、数字和特殊字符。某些要求必须使用所有四种字符类型。复杂密码比简单密码更难破解。\n\
  \n-   **最大有效期**——最大有效期确定了必须更改密码的时间。例如，45 天的最大有效期表示每 45 天必须更改一次密码。一旦超过最大有效期，用户在更改密码之前无法登录。\n\
  \n-   **密码历史**——某些用户会尝试只使用一或两个密码。他们使用密码 1 直到被强制更改，然后切换到密码 2。当再次被强制更改密码时，他们又切回密码\
  \ 1。他们在密码 1 和密码 2 之间不断切换。然而，使用密码历史记录时可以防止用户使用之前用过的密码。例如，Windows 域系统可以记住过去的 24 个密码，这意味着在用户使用其他\
  \ 24 个密码之前，将会被阻止重复使用密码。\n\n-   **最小有效期**——设置最小有效期可以防止用户在通过最短时间后更改密码。管理员通常将一天作为最小密码有效期，这配合密码历史记录，可以防止用户通过立即更改密码来换回原始密码。如果将密码历史设置为\
  \ 24，最小有效期设置为一天，用户必须在接下来的 25 天内每天都更改密码才能回到原始密码，这让用户规避策略意图的行为变得过于困难。相反，用户将遵循策略的意图，即将密码更改为新密码。\n\
  \n### ![](img/Tip.png)提示\n\nNIST 800-63B 分享了关于密码的宝贵建议：\n\n-   个人设置密码时，最小长度为 8 个字符\n\
  -   系统设置密码时，最小长度为 6 个字符\n-   支持最大长度至少为 64 字符\n-   在锁定前允许至少 10 次密码尝试\n-   将所选密码与已知字典进行比对\n\
  \n此列表并非详尽，但值得复习。\n\n此时，可以将应对措施与威胁/漏洞对进行匹配。`表 11-1` 显示了与建议的应对措施相匹配的威胁/漏洞对。\n\n**表\
  \ 11-1** 威胁/漏洞对与应对措施的匹配\n\n| 威胁 | 漏洞 | 应对措施 |\n| --- | --- | --- |\n| 前员工 | 未禁用的空闲账户\
  \ | 实施账户管理策略<br>编写脚本以禁用账户<br>仅限制员工访问 |\n| 弱密码 | 攻击者启动的密码破解工具 | 实施账户管理策略<br>实施组策略密码策略\
  \ |\n\n表中的信息显示，账户管理策略正在处理两个威胁/漏洞对。这些信息可能很有价值。如果管理员意识到某项应对措施正在解决多个风险，他们可能会决定增加该应对措施的优先级。虽然威胁/漏洞配对在评估威胁和漏洞方面是有效的，但\
  \ NIST 800-30 的风险评估方法也是一种有效的替代方案。\n\n### 脚本作为技术应对措施\n\n技术应对措施并不一定昂贵。如果管理员具备专业知识，可以通过脚本免费创建一些。\n\
  \n优秀的管理员和卓越管理员之间的区别通常在于编写管理脚本的能力。优秀的管理员可以完成任务，但通常花费的时间更长。这对于重复性任务尤其如此。卓越的管理员可以更快、更省力地完成任务。\n\
  \n脚本的一个巨大优势是它们可以被自动化。例如，管理员想要禁用空闲账户。他或她可以写一个脚本来识别并禁用过去 30 天内未使用的账户，然后调度该脚本在每周六晚上运行。这样，每周都会检查所有账户，并在不需要任何额外管理工作的情况下禁用空闲账户。\n\
  \n将其与不会编写脚本的管理员相比。同样的任务仍然可以完成，但每周都需要花费时间。\n\n随着管理员对脚本变得越来越熟练，他们可以添加额外的功能。例如，脚本可以记录结果或发送电子邮件。在脚本找到并禁用空闲账户后，它可以发送一封被禁用的账户列表。\n\
  \n脚本可以满足大多数管理需求。脚本管理员之间有一句俗言：“如果你能想象出来，你就能写出脚本。”\n\n### 将风险评估转化为风险缓解计划\n\n下一步是将风险评估转换为风险缓解计划。缓解计划将包含有关如何以及何时实施应对措施的细节。\n\
  \n在制定缓解计划时有三个重要的考虑因素：\n\n-   实施应对措施的成本\n-   实施应对措施的时间\n-   应对措施对运营的影响\n\n## 实施成本\n\
  \n实施的许多应对措施需要购买。因此，能够准确识别这些应对措施的成本至关重要。从上看，应对措施的成本可能很容易计算。然而，经常存在隐藏成本。\n\n成本可能包括以下：\n\
  \n- 初始购买成本\n- 设施成本\n- 安装成本\n- 培训成本\n\n### 其他\n\n如果发现了隐藏成本，可能会影响实施应对措施的决策。如果原始估计与实际成本之间的差异巨大，该应对措施可能不再具有成本效益。在这种情况下，应该重新进行成本效益分析。如果结果显示应对措施改变了原始成本效益分析，应将数据提交给管理层。管理层可能会决定继续或停止购买应对措施。此阶段常见的问题之一是资金不足。理想情况下，风险评估应准确识别应对措施的成本，但如果发现了新成本，可能会导致问题。新成本可能超出原始预算金额，这可能导致应对措施的成本从预算项目变为未获资金的需求。未获资金的需求可能只能等到下一年再实施。\n\
  \n##### 初始购买成本\n\n初始购买成本是产品的价格。对于软件（例如软件漏洞扫描器），成本是零售价减去给机构的任何折扣。对于硬件（例如路由器或服务器），初始购买成本是硬件的价格。\n\
  \n\n\n\n某些应对措施可能在内部开发。例如，本章提到了作为应对措施的脚本。如果组织拥有一才华横溢的管理员，他或她可能轻松地编写脚本。编写脚本不会花费太多时间，也不会影响其他任务的完成。\n\
  \n另一方面，如果脚本对于管理员来说是一项新功能，则可能需要计算人工成本。管理员在编写第一个脚本时将花费大量时间，但编写后续脚本时花费的时间会越来越少，因为它们会变得越来越容易完成。\n\
  \n初始购买价格通常在风险评估中被准确识别。如果正在购买产品，可以与供应商核实价格。\n\n### 设施成本\n\n设施需求包括空间、电力和空调，但有时这些需求会被忽视。如果需要这些需求但未被识别，可能会导致进度出现严重问题，甚至可能影响成本效益分析的准确性。\n\
  \n许多人认为机房拥有无限的空间，但事实并非如此。服务器通常安装在设备机柜中，机柜的宽度和深度大约相当于家用冰箱，高度约为 6 英尺。`FIGURE 11-1`\
  \ (#21_chapter11_02.xhtml#fig11-1) 显示了设备是如何安装在设备机柜中的。\n\n![FIGURE 11-1 托管服务器和其他组件的机柜](img/9781284183719_CH11_FIGF01.png)\n\
  \n`FIGURE 11-1` 托管服务器和其他组件的机柜。\n\n左侧的机柜有四台大型服务器。它们可能是拥有 32 个处理器和 2 太字节 (TB) 内存的大型系统。右侧的机柜有七台较小的服务器。这些可能是拥有\
  \ 4 个处理器和 32 吉字节 (GB) 随机访问内存 (RAM) 的较小系统。服务器上的应用程序决定了尺寸。例如，托管大型数据库的数据库服务器比用于托管用户文件的文件服务器需要更多资源。\n\
  \n设备机柜通常托管其他组件，如 `Figure 11-1` (#21_chapter11_02.xhtml#fig11-1) 所示，图中显示了配线架、磁盘驱动阵列、带驱动器等。\n\
  \n作为设施成本的一个示例，缓解计划要求在只有两个机柜的现有机房中增加两台服务器。它们无法放入现有的机柜中。必须从这些机柜中移除设备，或者增加另一个机柜。如果在此之前没有识别这一需求，将为应对措施增加额外成本。\n\
  \n### ![](img/Note.png)注意\n\n`Figure 11-1` (#21_chapter11_02.xhtml#fig11-1) 显示了服务器之间的间隔，但画出来仅是为了看到各种组件。然而，在实际的机柜中，这些这些空间。服务器和组件会直接堆叠在一起，或者会安装金属板来防止机柜内的气流并覆盖这些空间。\n\
  \n除了空间之外，还应该考虑空调和电力需求。空调单元提供一定水平的冷却功率。例如，保持 1000 平英尺房屋凉爽所需的空调单元比保持 2000 平英尺房屋凉爽所需的要小得多。\n\
  \n### 安装成本\n\n内部管理员将安装大多数应对措施。然而，一些复杂的应对措施可能需要外部帮助。有时，花额外的费用让供应商安装和配置应对措施以确保其已正确安装是值得的。\n\
  \n\n\n另一个被忽视的成本是培训。新的应对措施可能是自个人电脑发明以来最伟大的发明，但如果没有人知道操作它，它就会在角落里吃灰。技术培训可能是昂贵的的，派遣一名管理员参加为期一周的培训课程费用可能高达\
  \ 6,500 美元。\n\n许多公司会在现场进行培训。派遣一名培训师到公司培训约 15 个人，成本可能高达 20,000 美元。\n\n显然，技术培训的成本会迅速累积，而且和其他成本一样，它们会显著增加应对措施的总成本。除了最终成本，它们还可能影响进度。应对措施的实施可能需要推迟到人员完成培训。\n\
  \n## 实施时间\n\n实施应对措施的时间差异很大。某些实施工作可以在几天或几周内完成，而另一些则可能需要几个月。在确定时间表时，考虑整个过程是非常重要的。\n\
  \n例如，制定一份书面的账户管理政策似乎是一个简单且快速的程序，安全专家可能可以在一天内起草好账户管理政策。然而，该政策并不是 IT 账户管理政策。所有政策都需要高层的批准和支持；因此，草案需要提交给高层进行审查。\n\
  \n### ![](img/Tip.png)提示\n\n风险评估包括一份行动计划和里程碑（`POAM`），这是一个价值的跟踪工具，特别是对于复杂项目。一旦确定了应对措施的时间和进度，就需要用这些数据更新\
  \ `POAM`。\n\n管理层很可能想要更改，其中一些是风格上的，另一些与内容有关。为了获得管理层的认可，该政策需要成为他们的政策。他们做的修改越多，他们对政策的拥有感就越高。如果政策至少没有被过一次，也许管理层真的并不认可它。\n\
  \n管理层拥有的政策将获得管理层的支持。如果管理层不支持该政策，没有人会支持。\n\n仅仅因为管理层对政策的审查可能只需要 20 分钟，并不意味着政策在完成第一份草稿后\
  \ 20 分钟内就能完成。除非最近发生过高级安全事件，否则书面安全策略不太可能成为首要任务。它需要时间才能进入管理层待办事项的顶端。\n\n考虑到所有这些因素，政策的完成时间可以估计为\
  \ 30 天。通过适当的管理人员传达政策可能需要几周时间。政策将进行修改；然后，它将重新提交最终审批和签署，这可能还需要大约一周时间。\n\n某些时间表可能会复杂得多。例如，图\
  \ 11-3` 代表了公司目前的 Web 服务器配置。Web 服务器位于非军事化区（`DMZ`），并访问托管在不同服务器上的后端数据库。该服务器支持一项在线业务，该业务在过去两年中经历了爆炸式增长，目前每年产生数百万美元收入。\n\
  \n![图 11-3 带后端数据库服务器的 Web 服务器](img/9781284183719_CH11_FIGF03.png)\n\n**图 11-3**\
  \ 带后端数据库服务器的 Web 服务器。\n\n最近的停机导致了数万美元的销售损失。结合间接成本，管理层估计公司损失了超过 100,000 美元。经理希望未来防止此类停机。然而，即使在工程师确定解决方案后，其实施时间也将比\
  \ 30 天长得多。\n\n在管理层批准解决方案后，需要购买额外的服务器来创建图 11-4`所示的配置。该计划将 Web 服务器扩展为 Web 农。后端数据库服务器将使用故障集群进行保护。\n\
  \n![图 11-4 这里，单台 Web 服务器被 Web 农取代](img/9781284183719_CH11_FIGF04.png)\n\n**图 11-4**\
  \ 这里，单台 Web 服务器被 Web 农取代。\n\nWeb 农由多台使用网络负载均衡的服务器组成。第一个客户端连接到 `web 1`，下一个客户端连接到\
  \ `web 2`，依此类推。在任何时刻，每台服务器的负载基本相同。Web 农允许组织通过添加额外的服务器来轻松扩展。例如，如果需求激增，管理员可以向 Web\
  \ 农添加一台服务器。此外，如果 Web 农中的一台服务器故障，网络负载均衡可确保客户端不会被引导到故障服务器。\n\n故障集群为数据库服务器提供容错。`Node\
  \ 1` 是激活状态，`node 2` 是非激活状态。`Node 2` 通过监控心跳来监控 `node 1` 的健康状况。如果 `node 1` 故障，`node\
  \ 2` 将接。\n\n### ![](img/Tip.png)提示\n\n跟踪应对措施很重要，而且不需要复杂，只需要准确。例如，如果将政策提交给首席信息官（`CIO`）审查，可以在\
  \ `POAM` 或其他跟踪文件中进行此类注释，内容简单如“于 4 月 14 日向 CIO 提交草案”。\n\n显然，图 11-3`和图 11-4`之间存在差异。新配置增加了四台服务器和两种不同的技术。它比实施书面政策需要更多的规划。在新配置中需要考虑以下几点：\n\
  \n- **增加设备机柜**：机柜应与其他机柜大小相同，并以相同的方式安装，以充分利用现有的空调。增加另一个机柜假设房间能够支持它。\n- **增加空调容量**：可能需要增加一个单元或升级现有单元。\n\
  - **从不同的电源源供电**：如果设施支持，可能会选择将电源分开。例如，可以重新路由电源，使两台 Web 服务器和故障集群中的一个节点位于不同的电网。这种配置将有助于防止某一电网的断电导致网站宕机。\n\
  - **在不同电网上平衡服务器**：如果添加了额外的电源，则服务器机房内的所有服务器可能需要进行平衡处理。\n- **购买服务器和硬件**：该计划至少需要四台新服务器。故障集群中的两台数据库服务器需要具有匹配的硬件，因此需要两台新服务器。在验证故障集群运行正常后，旧的数据库服务器可以重用为\
  \ Web 农服务器。根据现有服务器的能力，可能会选择用六台新服务器替换旧服务器。\n- **为管理员提供培训**：配置和管理故障集群可能会变得复杂。如果管理员以前没有处理过故障集群，他们将需要培训。网络负载均衡很容易使用，但管理员可能也需要针对这方面的培训。\n\
  - **安装和配置服务器**：这一步取决于管理员的经验。例如，故障集群的安装和配置可以外包。许多销售故障集群解决方案的公司都提供安装支持。\n\n\n\n\n\
  -   **测试**—在系统上线之前，需要对 Web 服务器群和备备集群进行测试，以验证它们能够按预期方式工作，因为每个系统都会出现需要解决的技术问题。\n-\
  \   **实施**—将原始配置切换到新配置，有时会分阶段实施。例如，可能先实施备备集群；一旦其稳定，就可以实施 Web 服务器群。\n\n### TIP ![](img/Tip.png)\n\
  当需求增加时，系统或服务应该能够进行向上扩展（Scale up）或横向扩展（Scale out）。向上扩展 意味着为服务器添加额外的资源。例如，升级处理器或添加额外的内存。横向扩展\
  \ 意味着为服务添加额外的服务器。具有网络负载均衡功能的 Web 服务器群可以在不改变核心应用程序的情况下支持横向扩展。在这种情况下，核心应用程序是托管在 Web\
  \ 服务器上的 Web 应用程序。\n\n### TIP ![](img/Tip.png)\n实施新配置既耗时又昂贵，但根据最近一次停机超过 100,000 美元的损失来看，这种成本是合理的。此外，这些这些措施来确保网站的可用性，以帮助其继续产生收入。\n\
  \n## 运营影响\n一方面，系统越安全，越越使用。另一方面，系统越容易使用，安全性越低。简而言之，任何防御措施都可能对正常运营产生影响。\n\n应该尽早识别运营影响，以便采取措施将其降至最低。例如，目标是尽可能减少允许通过防火墙的流量，这可以通过实施隐式拒绝哲学来实现。\n\
  \n隐式拒绝哲学从阻塞所有流量开始，然后添加规则来识别允许的流量。防火墙允许匹配显式规则的流量并阻塞所有其他流量。即使防火墙没有显式拒绝某些流量的规则，它们也会被隐式地拒绝。\n\
  \n挑战在于识别哪些流量是被允许的。一种方法是阻塞所有流量并等待人们投诉，但那种方法肯定会影响运营。\n\n更好的方法是在现有的防火墙上启用详尽的日志记录。然后可以分析日志来确定防火墙目前允许哪些流量。大多数日志可以导入到其他工具中进行更好的分析。例如，文本日志可以导入到数据库中，这比在文本文件中分析数据要容易得多。\n\
  \n仅仅因为流量正在通过网络并不意味着它应该通过。例如，书面安全策略可能规定限制网络新闻传输协议 (`NNTP`) 流量。`NNTP` 使用传输控制协议 (`TCP`)\
  \ 端口 `119`。对流量日志的审查可能会显示有大量流量在使用此端口。应该调查这种情况，以查看是安全策略过时，还是可能有人在防火墙上进行了未经授权的更改以允许此类流量。\n\
  \n对于看起来陌生的流量应该进行调查，而不是在不加考虑的情况下直接阻塞。例如，公司可能有一条业务线 (`LOB`) 应用程序用于从供应商处订购零件和物资，该程序正在使用端口\
  \ `5678`。如果该端口被阻塞，应用程序将被阻止，员工将无法再次使用 `LOB` 应用程序订购零件和物资。显然，这将对运营产生不利影响。\n\n#### 对需要风险缓解的风险元素进行优先级排序\n\
  识别最重要的防御措施的方法之一是对风险元素进行优先级排序。当威胁利用漏洞时，风险就会发生。风险的重要性可以通过估计其发生概率和影响来确定。风险的发生概率反映了威胁利用漏洞的可能性，而影响则确定了对组织造成的损害。极有可能发生且产生高影响的风险是最重要的。\n\
  \n## 使用威胁概率/影响矩阵\n威胁会负面影响机密性、完整性或可用性。威胁的严重性通过识别威胁影响这些元素之一的可能性来评估，而影响则通过确定其受影响的程度来评估。\n\
  \n### NOTE ![](img/Note.png)\n网络钓鱼是一种社会工程网络犯罪，网络钓鱼者通过伪装成信赖来源来攻击目标，通常诱导目标提供敏感数据，例如他们的银行详情。网络钓鱼还用于投放恶意软件。未受过识别此类威胁教育的人员通常会遭受损失，特别是当攻击者能够访问他们的个人身份信息时。\n\
  \n表 11-2 显示了威胁概率/影响矩阵示例。该矩阵可以用于确定各种威胁的优先级。发生概率在 0% 到 10% 之间的威胁将被分配 10% 的值，发生概率在\
  \ 11% 到 50% 之间的威胁将具有 50% 的值，发生概率在 51% 到 100% 之间的威胁将具有 100% 的值。同样，根据对组织的影响，将分配 10、50\
  \ 或 100 的影响值。\n\n**表 11-2** 威胁概率/影响矩阵\n\n![](img/Table11-2.png)\n\n#### 防御措施的优先级排序\n\
  威胁概率/影响矩阵可对风险和防御措施进行优先级排序。得分较高的风险会导致较高的损失，应该在处理得分较低的风险之前处理。\n\n根据现有的防御措施对风险进行评估。例如，如果一个组织没有使用防病毒软件，那么系统被感染的可能性将很高。如果多个系统被感染，影响也将是高的。100%\
  \ 的高概率乘以 100 的高影响等于 100 分。\n\n在另一个示例中，该公司在所有系统上都安装了防病毒软件，在过去的一年里，只有一次由于用户禁用了防病毒软件导致的问题。恶意软件试图传播，但被其他系统上的防病毒软件迅速检测到。在这个例子中，概率和影响都很低，该威胁的得分为\
  \ 1 分。\n\n### FYI\n根据需要，分配给词值的数值值可以不同。例如，低影响可以分配 0 的值而不是 10。高概率可以分配 90% 的值而不是 100%。此外，数据点可以多于三个，并且可以使用不同的名称，例如低、中低、中等、中度严重和严重。表\
  \ 11-3 显示了使用威胁概率/影响矩阵对威胁进行优先级排序的示例。每个威胁根据当前的防御措施分配了概率和影响。\n\n**表 11-3** 用于威胁优先级排序的威胁评分\n\
  \n![](img/Table11-3.png)\n\n[表 11-3]的信息显示，当前最大的威胁是两个得 50 分的：\n\n- 对 DMZ 服务器的攻击\n\
  - 关键数据库服务器的数据丢失\n\n这两个威胁可能会被优先处理，以采取其建议的防御措施。\n\n\n\n\n\n对 DMZ（脱敏区）服务器的攻击是一种威胁，因为这些服务器每六月才更新一次。这些更新旨在修复软件发布以来发现的漏洞和缺陷。如果漏洞没有被修复，服务器就会处于脆弱状态。许多攻击者会寻找未安装最新补丁的服务器，这使得这种风险发生的概率很高。\n\
  \n在这种情况下，解决方案是简单的。可以实施一种应对措施来确保服务器保持最新状态。有多种方法可以实现这一点，但如果风险评估建议了特定的应对措施并获了批准，则应该使用该措施。\n\
  \n同样，表 11-3 指出了备份程序中的漏洞。首先，备份是不不可靠的。其不可靠性可能是因为没有备份计划或没有备份程序，或者从未进行过数据恢复测试以验证备份的有效性。建立备份可靠性的常用应对措施是制定备份计划和备份程序。该计划可以包括每周执行一次测试恢复的要求。\n\
  \n### 作为备份计划一部分的测试恢复\n\n管理层常用的一句话是：“无法衡量的就无法管理”，这也包含了备份的有效性。然而，通过定期进行测试恢复并跟踪成功率，可以很容易地衡量备份的有效性。\n\
  \n测试恢复经常作为备份计划的一部分被强制要求。测试恢复简单地调取备份磁带并尝试从中恢复数据。如果数据可以恢复，则说明测试成功。如果数据无法恢复，则测试失败。应该对失败的测试进行调查。\n\
  \n测试失败可能由于许多原因：\n\n* `磁带可能已经老旧或损坏`——应该重新评估磁带在轮换中存放的时间，或者购买更高质量的磁带。\n* `磁带驱动器可能存在故障`——需要尽快修复此问题。如果驱动器故障，则所有备份都值得怀疑。\n\
  * `备份程序可能存在故障`——应该审查并纠正这些程序。如果程序不正确，所有备份都可能存在问题。\n\n无论问题是什么，好消息是测试恢复在危机发生之前就能发现它。如果实际数据丢失且无法恢复，问题将严重得多。\n\
  \n衡量备份的公司通常力争 95% 以上的成功率。不衡量备份有效性的公司，其成功率可能在 0% 到 100% 任何范围内。在数据丢失之前，他们不知道数据是否可以恢复。\n\
  \n威胁评分并不一定完美。它们需要少量的人工交互来确保组织的需求得到满足。例如，“火灾导致数据丢失”的威胁得分为 10 分。仅仅因为这个分数低于两个 50 分，并不意味着它不能尽早处理。\n\
  \n管理层可能会决定，尽管分数较低，但影响足够大，需要尽快处理。该威胁的应对措施非常简单：将备份磁带的副本存储在异地。\n\n### 验证风险元素及其如何被缓解\n\
  \n在将风险评估转换为风险缓解计划时，可能需要验证风险元素，因为风险评估是针对特定时间点的评估，威胁和漏洞可能已经发生了变化。此外，还需要验证已获批准的应对措施，以确保它仍然能够缓解当前的风险。\n\
  \n风险评估中使用的步骤也可用于验证风险元素。例如，风险评估可能使用了漏洞扫描器发现了一个 SQL 注入漏洞，并可以使用渗透测试来验证该漏洞是否可以被利用。\n\
  \n然后，在风险评估批准之前经过了三个月。可以再次执行相同的漏洞扫描以查看漏洞是否仍然。。如果仍然存在，可以重新运行渗透测试。如果漏洞可以被利用，则风险依然存在。\n\
  \n然而，在风险评估批准前三个月，可以再次执行相同的漏洞扫描以查看漏洞是否仍然。如果漏洞仍然存在，可以重新运行渗透测试。如果漏洞可以被利用，则风险依然存在。\n\
