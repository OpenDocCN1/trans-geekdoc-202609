  \ 保护 2\n`XSS` 跨站脚本\n\n![© Safe Chan/Shutterstock](img/Opener.jpg)\n\n关键术语表\n\n可接受使用策略\
  \ (AUP) 告知员工在互联网上什么是可接受的策略。\n\n接受 一种用于管理风险的技巧。当降低风险的成本大于潜在损失时，风险会被接受。\n\n账户管理策略\
  \ 创建以确保账户安全管理的策略。它还包括账户锁定的要求。该策略通常通过技术手段实施。\n\n高级加密标准 (AES) 由 `NIST` 定义的对称加密。它快速、高效，常用于加密驱动器的加密。\n\
  \n年度损失预期 (ALE) 给定风险每年的预期损失。通过 `SLE` × `ARO` 计算。ALE 是定量分析的一部分。\n\n年度发生率 (ARO) 给定威胁每年预期发生的次数。与\
  \ `SLE` 一用于计算 `ALE`。ARO 是定量分析的一部分。\n\n匿名代理 用于隐藏用户在网上活动的网站。用户访问匿名代理网站并请求其他网站。匿名代理检索页面并像是从匿名代理网站提供一样。\n\
  \n审计 检查组织是否遵循规则和指南。漏洞评估审计检查是否遵循了内部策略。\n\n可用性 确保数据或服务在需要时可用。数据和服务通过容错和冗余技术进行保护。\n\
  \n\n\n\n\n规避（avoiding）用于管理风险的技术之一。可以通过消除风险源或消除资产对风险的暴露来避免风险。公司可以停止产生风险活动，也可以转移资产。\n\
  \n## B\n\n大数据（big data）指规模如此巨大且复杂，以至于使用现有数据库工具难以处理的数据集。相反，专家们构建新的应用程序来满足这些大型数据集的需求。\n\
  \n黑名单（blacklist）在垃圾邮件过滤器中用于拦截邮件的地址或域名列表。它们被添加到 `blacklist` 中，以确保来自这些源的邮件始终被标记为垃圾邮件。\n\
  \n头脑风暴（brainstorming）一种用于针对某一主题产生大量想法的创意方法。鼓励参与者提到脑海中浮出的任何想法。在记录想法时不进行任何判断。\n\n\
  缓冲区溢出（buffer overflow）一种针对面向公共服务器的常用攻击手段。缓冲区溢出攻击中的攻击者发送了比预期更多或不同的数据。他们可以使用它来获取系统中额外的权限。\n\
  \n业务连续性计划 (BCP) 一项帮助公司准备不同紧急情况的综合计划。其目标是确保即使在灾难发生后，关键功能也能继续运行。\n\n业务功能（business\
  \ function）组织开展的活动，包括核心功能和支持功能。\n\n业务影响分析 (BIA) 业务连续性计划的一部分。它识别了当一个或多个 IT 功能故障时对业务的影响。\n\
  \n## C\n\n能力成熟模型集成 (CMMI) 一种管理过程改进方法。它包括从 0 到 5 的六级。0 级表示过程不存在。5 级表示该过程非常成熟且有效。\n\
  \n因果图（cause and effect diagram）也称为石川图或鱼骨图。它显示了原因与问题之间的关系。\n\n证书（certificate）一种用于安全的文件，包含标识和加密。证书可以颁发给用户或系统，然后提交给其他实体。证书包含一个与他人共享的公钥。公钥与私钥匹配，而私钥始终保持私密。\n\
  \n证书机构 (CA) 颁发和管理证书的实体。`CA` 可以是公共的也可以是私有的。公共 `CA` 可以互联网访问，而私有 `CA` 是组织内部的。用户和系统使用证书用于安全目的，如标识和加密。\n\
  \n变更管理（change management）一种正式流程，要求拟议的更改必须经过审查过程。更改仅在获得后后实施，这有助于减少未经授权更改导致的停机。\n\n\
  儿童互联网保护法 (CIPA) 美国 2000 年通过的一项法律。它要求接收 E-Rate 资金的学校和图书馆过滤互联网内容。主要目的是保护未成年人免受色情或有害图像的侵害。\n\
  \nCIRT 计划由组织创建的用于响应计算机事件的正式计划。它包含了对计算机事件的定义，并正式指定了计算机事件响应小组 (`CIRT`)。\n\n云计算（cloud\
  \ computing）一种允许组织通过公共网络（如互联网）访问所需的服务的技术。组织通常与第三方供应商签订合同，使用云计算提供服务。\n\nCOBIT *参见*\
  \ 信息和相关技术控制目标（中文）。\n\n冷备场（cold site）用于灾难恢复的备用地点。该地是一个拥有电力、自来水和厕所的建筑，但现场没有放置任何设备或数据。冷备场的维护成本低，但要使其投入运行需要大量努力，且非常困难。\n\
  \n常见漏洞与暴露 (CVE) 由 MITRE 维护的漏洞数据库。`CVE` 与美国国土安全部合作工作。`CVE` 包含 40,000 多项内容。\n\n合规（compliance）当组织遵守相关法律时，被称为合规。许多组织已经制定了计划来确保这一点。\n\
  \n计算机事件（computer incident）也称为安全事件。任何威胁机密性、完整性或可用性的活动。\n\n计算机事件响应小组 (CIRT) 一组响应事件的人员。`CIRT`\
  \ 可以是预先指定的正式小组，也可以是非正式小组。\n\n机密性（confidentiality）保护数据免受未经授权的泄露。使用访问控制保护数据。\n\n配置管理（configuration\
  \ management）用于确保系统未被不当修改的标准。此外，还可以进行合规性审计。\n\n持续监控（continuous monitoring）一种以安全为中心的哲学，需要持续的努力。实施控制措施，随后进行审计。\n\
  \n控制（control）为了减少弱点而实施的行动或更改。控制也被称为对措施（countermeasure）。\n\n信息和相关技术控制目标 (COBIT) 一个用于\
  \ IT 管理的良好实践框架。`COBIT` 受到广泛尊重并被频繁使用。它包含五个原则和七个要素。`COBIT` 最初是一个缩写词。ISACA 现在使用简写。\n\
  \n纠正控制（corrective control）根据其功能分类的一类控制。`corrective control` 试图扭转被利用漏洞的影响。例如，杀病毒软件可以通过清理感染文件来作为纠正控制。\n\
  \n成本效益分析 (CBA) 用于用于确定如何管理风险的过程。如果控制的收益大于成本，则实施该控制。如果成本大于收益，则可以接受该风险。\n\n对措施（countermeasure）一种安全控制或保护措施。其实施的目的是减少风险，它通过减少漏洞或威胁影响来实现这一点。\n\
  \n关键业务功能 (CBF) 一个被认为对组织至关重要的功能。如果 `CBF` 失败，组织将失去执行其任务所需的关键操作的能力。\n\n关键路径（critical\
  \ path）项目中关键任务的图表。如果 `critical path` 中的任何任务延迟，整个项目都将延迟。\n\n关键成功因素 (CSF) 组织成功的必要要素。`CSFs`\
  \ 往往有助于关键业务功能 (`CBFs`)。\n\n## D\n\n损害评估小组 (DAT) 一组在中断后收集数据以确定损害程度的团队。`DAT` 收集系统和设施受损的数据，并将数据报告给应急管理小组\
  \ (`EMT`)。`EMT`、`DAT` 和技术恢复小组 (`TRT`) 由 `BCP` 指定。\n\n暗网（dark web）互联网的一部分，包含加密的在线内容，传统搜索引擎无法看到。\n\
  \n数据泄露（data leakage）数据流向组织之外。许多点对传输 (`P2P`) 程序会导致数据泄露。`P2P` 程序通常用于下载盗版音乐、电影和应用程序。用户通常不知道\
  \ `P2P` 程序还会共享其系统上的数据。当用户系统上的数据在用户不知情的情况下被共享时，就会发生数据泄露。\n\n\n\n\n\n### 数据仓库 (data\
  \ warehousing) 从不同数据库收集数据并将其集中存储的过程。该过程使用了提取、转换、加载（`ETL`）流程。数据从原始数据库中提取，然后进行转换以匹配目标数据库。最后，将其加载到目标数据库中。\n\
  \n### 深网 (deep web) 也称为隐形网络，这一概念代表了互联网中内容未被典型搜索引擎索引的部分。\n\n### 深度防御 (defense in\
  \ depth) 一种用于提供多层控制的安全性原则。尽管某项控制可能提供保护，但还会增加额外的控制以提供更强的保护。深度防御策略确保即使某项控制失效，风险也能得到缓解。\n\
  \n### 非军事化区 (DMZ) 一种将互联网与内部网络隔离开来的缓冲区域。`DMZ` 通常通过两个独立的防火墙创建。然后将面向公众的服务器（如 Web 服务器或电子邮件服务器）放置在\
  \ `DMZ` 中。\n\n### 拒绝服务攻击 (DoS) attack) 一种旨在防止系统提供服务的攻击。`DoS` 攻击从单个客户端发起。\n\n###\
  \ 美国国防部信息保证认证与认可程序 (DIACAP) 一种应用于美国国防部（`DoD`）系统的风险管理流程。它完整记录在 `DoD` 指令 `8510.1`\
  \ 中。系统在获得运行许可之前必须经过正式的认证和认可流程。\n\n### 美国国土安全部 (DHS) 美国政府的一个主要部门，负责保护美国免受威胁和紧急情况的侵侵害。\n\
  \n### 探测控制 (detective control) 一类根据功能识别的控制措施。探测控制检测漏洞何时正在被利用。入侵检测系统（`IDS`）是探测控制的一个示例。\n\
  \n### 数字签名 (digital signature) 一种用于身份识别的方法。数字签名使用由证书颁机构颁发的证书。创建消息的哈希值并用发送者的私钥对哈希值进行加密。如果接收者可以使用发送者的公钥解密加密的哈希值，则验证了哈希值是用发送者的私钥加密并发送的。只有发送者拥有私钥。\n\
  \n### 灾难恢复 (disaster recovery) 系统故障后将其恢复服务的程序。灾难恢复发生在灾难之后。灾难恢复步骤记录在灾难恢复计划中，该计划是业务连续性计划的一部分。\n\
  \n### 灾难恢复计划 (DRP) 一种用于在灾难后恢复一个系统的计划。`DRP` 是业务连续性计划的一部分。\n\n### 分布式拒绝服务攻击 (DDoS)\
  \ attack) `DoS` 攻击是从多个客户端同时发起的攻击。`DDoS` 攻击通常包括由僵尸网络控制的僵尸。\n\n### 尽职维护 (due care)\
  \ 采取合理措施来防止风险。\n\n### 尽职调查 (due diligence) 花费合理的时间和精力来识别风险。进行尽职调查的人或组织调查风险以了解它们。\n\
  \n## E\n\n### 应急管理小组 (EMT) 由高级管理人员组成的团队，在中断或灾难发生期间拥有总体权限。`EMT`、损害评估小组（`DAT`）和技术恢复小组（`TRT`）由\
  \ `BCP` 指定。\n\n### E-Rate 资助 (E-Rate funding) 一项为学校和图书馆提供接入折扣的计划。任何根据 `E-Rate` 计划申请折扣的学校或图书馆必须遵守《儿童互联网保护法》（`CIPA`）的规则。`CIPA`\
  \ 强制对 17 岁以下的儿童过滤互联网内容。\n\n### 利用 (exploit) 发起漏洞的行为。当执行命令或程序以利用弱点时发生。示例包括缓冲区溢出、`DoS`\
  \ 攻击和 `DDoS` 攻击。\n\n### 利用评估 (exploit assessment) 尝试发现攻击者可以利用哪些漏洞的尝试。利用评估也称为渗透测试。\n\
  \n### 利用测试 (exploit testing) 尝试利用漏洞的测试。漏洞测试识别潜在漏洞，而利用测试确定漏洞是否真的可以被利用。利用测试可能会导致系统崩溃。\n\
  \n### 漏洞周三 (Exploit Wednesday) 补丁周二的第二天。在补丁发布后，攻击者尝试对补丁进行逆向工程以学习漏洞。然后他们创建攻击来利用这些漏洞。对比补丁周二。\n\
  \n### 暴露因子 (EF) 威胁发生时资产损失的百分比。\n\n## F\n\n### 故障转移集群 (Failover cluster) 一种用于确保服务在服务器故障后继续运行的技术。故障转移集群至少包含两个服务器。一台处于激活状态，另一台处于空闲状态，并在激活服务器故障时接管。\n\
  \n### 教育权利与隐私法 (FERPA) 一项于 1974 年通过的美国法律，强制保护学生记录。学生记录包括所有教育或健康数据。接收联邦资金的机构都受此法约束。\n\
  \n### 联邦存款保险公司 (FDIC) 一家于 1933 年创建的联邦机构，为 `FDIC` 担保的银行资金提供保险。目标是增强银行的信心。\n\n###\
  \ 信息安全管理法 (FISMA) 一项于 2002 年通过的美国法律，要求机构保护 IT 系统和数据。此外，机构必须进行年度检查，以对安全计划进行独立评估。\n\
  \n### 联邦贸易委员会 (FTC) 一家于 1914 年创建的联邦机构，其主要目标是促进消费者保护。它还防止不公平竞争。\n\n### 受托责任 (fiduciary\
  \ responsibility) 两个实体之间的信任关系。受托人可以是被信任的人，有责任维护这种信任。\n\n### 防火墙 (firewall) 过滤流量。在\
  \ `防火墙` 上配置规则以定义允许哪些流量和拦截哪些流量。网络防火墙是硬件和软件的。单个系统可以包含基于软件的 `防火墙`。\n\n### 防火墙设备 (firewall\
  \ appliance) 一种独立的防火墙解决方案。它包含为网络提供保护的硬件和软件。\n\n### 防火墙策略 (firewall policy) 一份识别允许或拦截流量的文档。`防火墙策略`\
  \ 通常用于在 `防火墙` 上实施规则。\n\n## G\n\n### 甘特图 (Gantt chart) 一种显示项目进度的条形图。甘特图常用于项目管理，也可用于风险管理计划。\n\
  \n### 差距分析 (gap analysis) 通过比较应该控制的漏洞与已控制的漏洞而创建报告。任何未控制的漏洞都代表了安全缺口。当组织尝试遵守 `HIPAA`\
  \ 等法律要求时，通常会进行差距分析。\n\n### 通用数据条例 (GDPR) 一项为收集和处理欧盟及欧洲经济区（`EEA`）居民个人信息提供指南的法律框架。\n\
  \n### 商誉 (goodwill) 友好且合作的态度。\n\n### 格兰姆-莱希希法案 (GLBA) 一项于 1999 年通过的法律，适用于金融机构。财务隐私规则和安全规则适用于\
  \ IT 安全。公司需要告知客户如何使用客户数据，并采取措施保护财务数据。\n\n### 组策略 (Group Policy) 一种自动化管理工具，使能够配置一次设置并将其应用到所有用户或计算机，这比在单个计算机上配置设置要高效得多。\n\
  \n### 指南 (guideline) 一种帮助实现行动的原则、指示或指导。\n\n\n\n\n\n《健康保险流动性与责任法案》(HIPAA) 一项 1999\
  \ 年通过的美国法律，强制保护健康信息。任何处理任何类型健康信息的组织（包括医疗保健提供者和提供健康计划的主）都必须遵守此法律。\n\n基于主机的入侵检测系统\
  \ (HIDS) 安装在单个主机（如工作站或服务器）上的入侵检测系统。任何入侵检测系统都能检测入侵和攻击。\n\n热备地 (hot site) 用于灾难恢复的备选地点。该站点包含了在短时间内接管业务所需的所有设备和数据，能够在几小时甚至有时几分钟内恢复运行。热备地的维护成本非常昂贵。其他备选地点是冷备地（cold\
  \ sites）和温备地（warm sites）。\n\n## I\n\n影响 (impact) 威胁利用漏洞导致的损失金额。损失可以用货币或相对值表示。影响确定了损失的严重程度。影响源于专家意见。\n\
  \n隐式拒绝 (implicit deny) 一种应用于路由器和防火墙的哲学。除非显式允许，否则所有流量均被拦截。例如，可以通过防火墙规则开放 `port 80`\
  \ 以允许 HTTP 流量。如果没有其他规则，则不允许任何其他流量。即使防火墙没有显式拒绝 `port 77`（或除 80 以外的任何端口）流量的规则，该流量仍然会被拒绝。\n\
  \n信息技术治理 (ITG) 确保 IT 资源能够帮助组织实现其目标的流程。\n\n信息技术基础库 (ITIL) 由英国政府商业局开发的一系列书籍。这些书籍记录了可用于\
  \ IT 网络的良好实践。\n\n现行控制 (in-place control) 当前已安装的控制措施。控制措施可以是现有的，也可以是计划中的。\n\n无形价值\
  \ (intangible value) 与物理资产实际成本不直接相关的价值。无形资产可以包括未来的收入损失、客户信任和客户影响。与有形价值（tangible\
  \ value）相比。\n\n完整性 (integrity) 确保数据或 IT 系统不被修改或破坏。通常使用哈希算法来确保完整性。\n\n知识产权 (IP) 由个人或组织创建的数据。它可以包括创意作品，如文学、音乐或艺术作品。它也可以包括工业设计、商标、发明和专利。\n\
  \n故意威胁 (intentional threat) 对组织具有敌意的行为。故意威胁来自犯罪分子、破坏者、不满的员工、黑客等。\n\n国际电工技术委员会 (IEC)\
  \ 一个个专注于电气、电子及相关技术的国际标准组织。IEC 与 `ISO` 合作制定某些标准。IEC 发布了《IEC 31010 风险管理——风险评估技术》。\n\
  \n国际标准化组织 (ISO) 一个国际标准组织。ISO 发布的的三份与风险相关的文档是：`ISO 27002`、`ISO 31000` 和 `ISO 73`。\n\
  \n入侵检测系统 (IDS) 一种可以监控网络并在检测到入侵时发送警报的系统。基于主机的 IDS (HIDS) 和基于网络的 IDS (NIDS) 系统被广泛使用。被动\
  \ IDS 记录并对事件发出警报。主动 IDS 可以阻止检测到的攻击。\n\n入侵预防系统 (IPS) 放置在流量链路中的系统，用于监控入侵。它可以防止恶意流量到达内部网络。\n\
  \n库存管理 (inventory management) 用于管理硬件库存。包含基本信息，如型号、序列号和存放位置。\n\nIT 治理 (ITG) 帮助确保\
  \ IT 资源能够帮助组织实现目标的流程。ITG 还有助于确保这些资源是有效且高效的。\n\n## J\n\n轮岗 (job rotation) 让员工在不同的工作之间轮换，从而对过去的交易进行额外的监督。它可以帮助防止或减少欺诈活动（如合谋），并增加对特定系统的技术知识。\n\
  \n## M\n\n恶意软件 (malware) 恶意软件，包括病毒、蠕虫、特洛马或任何类型的恶意代码。\n\n强制休息 (mandatory vacation)\
  \ 要求员工每年休至少连续五天的假。在员工休假期间，必须由其他人执行该工作，这增加了发现非法活动的概率。\n\n最大可接受中断时间 (MAO) 系统或服务在影响公司任务之前可以中断的最长时间。MAO\
  \ 直接影响所需的恢复时间，这意味着系统必须在达到 MAO 时间之前是可以恢复的。\n\n最大可容忍中断时间 (MTPD) 这有助于确定在灾难发生后需要尽快恢复并启动哪些关键业务功能，识别启动关键业务功能\
  \ (CBF) 所需的特定资源，并帮助确定这些系统需要尽快恢复。\n\n里程碑 (milestone) 项目的计划事件，表示某项主要任务或一组任务的完成。里程碑用于跟踪项目的进度。\n\
  \n里程碑计划图 (milestone plan chart) 一种主要里程碑的图形表示，显示里程碑之间的时间关系和依赖关系。\n\n最小业务连续性目标 (MBCO)\
  \ 组织在灾难期间满足其业务需求和目标所接受的最低服务水平。\n\n任务关键 (mission critical) 被识别为对组织任务至关重要的任何系统、功能或过程。任务关键系统和活动是维持组织运行必要的。\n\
  \n缓解 (mitigating) 管理风险的技术之一。缓解也称为风险降低。通过实施控制措施或应对措施来减少漏洞。\n\n移动站点 (mobile site)\
  \ 一种可以在受影响站点附近的外部空间在 36 到 72 小时内快速搭建的站点。它介于热备地和冷备地之间。\n\n## N\n\n国家网络安全与通信集成中心 (NCCIC)\
  \ 美国国土安全部 (DHS) 的组成部分。它与私人、公共国际伙伴合作，确保网络空间和美国网络资产的安全。\n\n国家标准与技术研究院 (NIST) 美国商务部的一个部门，其使命是促进美国的创新和工业竞争力。信息技术实验室\
  \ (ITL) 属于 NIST。ITL 发布了在 IT 风险管理中广泛使用的特别出版物。\n\n网络负载均衡 (network load balancing)\
  \ 一种允许将负载分摊到多个服务器的技术。当新客户端连接时，它们被定向到负载最小的服务器。负载均衡用于 Web 农场。\n\nNIST 风险管理框架联邦政府通过国家标准与技术研究院\
  \ (NIST) 开发的一系列信息安全策略和标准。\n\n不可否认性 (nonrepudiation) 用于防止某人否认执行了某项操作。审计日志记录了事件的谁、什么、何地以及何时的细节。如果审计日志记录了用户登录后的操作，用户就无法令人信服地否认该操作。数字签名也用于不可否认性。\n\
  \n## O\n\n业务影响 (operational impact) 安全控制对业务的影响。控制措施通常会消耗资源，如果不加控制，可能会影响正常业务。\n\n\
  ## P\n\n密码策略 (password policy) 规定密码安全要求的书面或技术策略。要求包括长度、有效期和复杂性。例如，密码策略可能规定密码至少为八位字符，并且每\
  \ 90 天更改一次。复杂性要求指定使用大写字母、小写字母、符号和数字。\n\n\n\n\n\n# 补丁管理 (Patch Management)\n确保在需要时部署补丁。由于软件经常产生漏洞，供应商会发布补丁来修复问题。补丁管理确保部署适当的补丁。许多漏洞存在严重的安全风险，因此如果不部署补丁，系统就会受到攻击。\n\
  \n## 补丁周二 (Patch Tuesday)\n微软发布其产品补丁的日子。补丁周二是每个月的第二个星期二。对比`漏洞周三 (Exploit Wednesday)`。\n\
  \n### 支付卡行业数据安全标准 (PCI DSS)\n一种用于保护信用卡数据的国际标准，其要求由 `PCI` 安全委员会制定。商家必须遵守这些标准。\n\n\
  ## 渗透测试 (Penetration Testing)\n为了漏洞是否可以被利用而进行的测试。渗透测试在漏洞评估之后进行。它可能是侵入性的并导致系统崩溃。\n\
  \n## 物理控制 (Physical Control)\n一种限制对区域或系统的物理访问或保护物理环境的控制。示例包括锁上的房间、守卫、摄像头以及控制环境的暖空调系统。\n\
  \n## 行动计划与里程碑 (POAM)\n用于跟踪风险管理计划中活动的文档。`POAM` 为特定任务分配责任，并使管理层更容易跟进任务。\n\n## 计划控制\
  \ (Planned Control)\n计划在未来某个时候添加的控制。控制可以是已生效的，也可以是计划。\n\n## 策略 (Policy)\n由组织领导直接发布的正式声明，例如可接受使用策略，它描述了在使用公司拥计算机和网络资源时可接受和不可接受的行为。\n\
  \n## 预防性控制 (Preventive Control)\n根据其功能识别的一类控制。预防性控制试图防止风险的发生。例如，从服务器上移除不需要的协议以进行加固，这样对该协议的任何攻击现在都会被服务器阻止。\n\
  \n## 最小权限原则 (Principle of Least Privilege)\n一种安全原则，仅授予用户执行其工作所需的最小权利和权限。这一原则与“知情原则”相似。然而，知情原则只关注数据的权限，而不关注权利。\n\
  \n## 知情原则 (Principle of Need to Know)\n一种安全原则，只允许用户访问其执行工作所需的数据。这与最小权限原则相似。然而，最小权限原则包含了权利和权限，而知情原则只关注数据的权限。\n\
  \n## 比例原则 (Principle of Proportionality)\n这一原则简单地说明`在控制上的支出应与风险成正比。`\n\n## 概率 (Probability)\n\
  指风险发生的可能性，源于专家意见并用于定性风险评估。当威胁利用漏洞时，风险就会发生。\n\n## 程序控制 (Procedural Control)\n基于高层管理指导的规则和准则实施的控制。它也被称为行政控制。\n\
  \n## 程序 (Procedure)\n一种正式的、既定的办事方法。\n\n## 盈利能力 (Profitability)\n公司盈利的能力。计算方法为收入减去成本。\n\
  \n## 代理服务器 (Proxy Server)\n用于过滤请求的服务器。代理服务器可以过滤请求然后为客户端服务。\n\n## 风险评估 (Risk Assessment)\n\
  ### 定性风险评估 (Qualitative Risk Assessment)\n一种使用相对值进行风险的主观方法。定性风险评估没有公式。\n\n### 定量风险评估\
  \ (Quantitative Risk Assessment)\n一种使用数字进行风险的客观方法。定量风险评估需要数据。\n\n## 风险 (Risk)\n\
  可能导致损失的不确定性。当威胁利用漏洞时就会产生损失。风险通常表示为 `风险 = 威胁 × 漏洞`。\n\n## 风险管理 (Risk Management)\n\
  识别、评估、控制和缓解风险的实践。管理风险的技术包括避免、共享或转移、缓解和接受风险。\n\n## 风险声明 (Risk Statement)\n用于总结风险的声明。风险声明通常使用\
  \ `if/then` 格式。声明中的 `if` 部分识别风险的要素。声明中的 `then` 部分识别结果。\n\n## 合理性 (Reasonableness)\n\
  一种判断测试。如果一个理性的的人会预期该风险会得到管理。\n\n## 恢复点目标 (RPO)\n系统可接受的最大损失量。RPO 可以短至一分钟，最长可达一周。\n\
  \n## 恢复时间目标 (RTO)\n系统或功能必须恢复的时间。RTO 等于或小于最大可机时间 (`MAO`)。例如，如果 `MAO` 为 10 分钟。\n\n\
  ## 独立磁盘冗余阵 (RAID)\n也称为冗余磁盘。多个磁盘组合使用以提供容错能力。\n\n## 剩余风险 (Residual Risk)\n应用控制措施后剩余的风险。剩余风险的公式为：`剩余风险\
  \ = 总风险 – 控制`。\n\n## 投资回报率 (ROI)\n一种衡量购买或改进系统的金钱收益的价值。如果控制的成本与年度预计收益接近，就可以计算 `ROI`。\n\
  \n## 萨班斯-奥克斯利法案 (SOX)\n2002 年通过的一项美国法律，适用于所有上市公司。高级官员和董事成员对数据的准确性直接负责。如果数据报告错误，他们可能会面临罚款并入狱。\n\
  \n## 横向扩展 (Scale Out)\n通过向服务添加更多服务器来增加能力的方法。高效的横向扩展技术不需要修改核心应用程序。例如，可以在 Web 集群中添加额外的服务器，而无需更改核心\
  \ Web 应用程序。负载然后在服务器之间平均分配。\n\n## 纵向扩展 (Scale Up)\n通过向服务器添加更多资源来增加能力的方法。可以通过增加内存或升级处理器对服务器进行纵向扩展。\n\
  \n\n\n\n\n`scope` 风险管理计划的边界，定义了计划应该涵盖的内容。定义 `scope` 有助于防止 `scope creep`（范围蔓延）。\n\
  \n`scope creep` 项目中由于不受控制的变化而导致的问题。应该避免 `scope creep`，因为会导致成本超支和错失截止日的交付。\n\n`script\
  \ kiddie` 脚本小子。指对编程知识或其可能造成的伤害了解甚少的攻击者。其理念是某些黑客工具非常易于使用，以至于小孩都能使用。\n\n`Securities\
  \ and Exchange Commission` (`SEC`) 美国证券交易委员会。一个监管证券业的联邦机构。证券包括股票、期权和其他证券。任何上市公司或交易证券的实体都必须遵守\
  \ `SEC` 规则。\n\n`security policy` 安全策略。一种由高层管理人员创建的书面策略，包括识别资源和在组织内实施安全措施。它通常包括个人策略，例如\
  \ `password policy`（密码策略）、`acceptable use policy`（可用使用策略）和 `firewall policy`（防火墙策略）。\n\
  \n`separation of duties` 职责分离。一种确保单个人不控制关键过程的所有功能的原则。其设计目的是防止欺诈、盗和错误。\n\n`service\
  \ level agreement` (`SLA`) 服务水平协议。一份识别预期性能水平的文档。它可以指定最小运行时间或最长停机时间。它通常被写为服务提供商与客户之间的合同。`SLA`\
  \ 可以规定在未满足条款时产生的金钱罚款。\n\n`service pack` (`SP`) 服务包。一组适用于特定操作系统的更新、补丁和修复程序。大多数 `SP`s\
  \ 都是累积的。它们包含了自操作系统首次发布以来所有的更新、补丁和修复程序。\n\n`single loss expectancy` (`SLE`) 单次损失预期。由单次事件导致的总损失。损失以美元价值表示，包括硬件、软件和数据的价值。它用于帮助计算\
  \ `ALE`（`ALE = SLE × ARO`）。`SLE` 是定量风险评估的一部分。\n\n`single point of failure` (`SPOF`)\
  \ 单点故障。指任何单个组件的故障都可能导致整个系统的完全崩溃。`SPOF` 通常通过增加冗余来解决。例如，磁盘驱动器可以使用 `RAID` 配置进行保护，而故障转移集群可以消除服务器作为单点故障的风险。\n\
  \n`sniffer` 嗅探器。用于捕捉网络流量以进行分析的工具。`Wireshark` 是一个免费的数据包分析器，可以用作 `sniffer`。如果数据以明文发送，捕获的流量可以被轻易读取。\n\
  \n`social engineering` 社会工程。用于欺骗人们泄露敏感信息或采取不安全行动的策略。社会工程策略包括通过电话或面对面诈骗，以及网络钓鱼和其他技术手段。\n\
  \n`spear phishing` 鱼叉式网络钓鱼。针对特定公司的钓鱼尝试。它通常看起来像是来自公司内部人员，并且对未经培训的员工成功率更高。\n\n`SQL\
  \ injection attack` SQL 注入攻击。针对访问数据库的网站的攻击。攻击者使用结构化查询语言 (`SQL`）代码来检索或修改数据库中的数据。开发者遵循最佳实践来防止\
  \ `SQL injection` 攻击。\n\n`stakeholder` 利益相关者。对项目成功有利益或兴趣的个人或群体。`stakeholder` 对项目拥有某些权限，并可以为项目提供资源。\n\
  \n`standard` 标准。一种为了支持或至少为策略提供方向的强制性规则。例如，`password standard`（密码标准）可以跟在 `acceptable\
  \ use policy`（可用使用策略）之后。\n\n`survivability` 生存能力。公司从风险中生存的能力。某些损失可能非常严重，如果不进行管理，会导致业务失败。\n\
  \n`SYN flood attack` SYN 洪水攻击。一种常见的 `DoS` 攻击，攻击者保留三次握手中的第三个数据包。当攻击者这样做时，服务器可能会崩溃。\n\
  \n## **T**\n\n`tangible value` 有形价值。资产的实际成本。\n\n`technical control` 技术控制。一种利用技术减少漏洞的控制。示例包括\
  \ `antivirus software`（防病毒软件）、入侵检测系统和防火墙。\n\n`technical recovery team` (`TRT`) 技术恢复团队。负责在中断后恢复关键系统的团队。`BIA`\
  \ 负责识别关键系统。\n\n`technology protection measure` (`TPM`) 技术保护措施。`CIPA` 的要求。`TPM` 会过滤攻击性内容。\n\
  \n`total risk` 总风险。当受影响资产的价值已知时的风险数。`Total risk` 通常表示为 `Total risk = Threat × Vulnerability\
  \ × Asset value`。\n\n`transaction` 事务。数据库术语。`Transactions` 允许多个语句作为一个整体成功，或者如果任何单个语句失败，则整个事务都不会应用到数据库中。\n\
  \n`transferring` 转移。用于管理风险的技术之一。通过将责任转移给另一方来转移风险。风险可以通过转移风险来完全转移，或通过转移风险来共享。这可以通过购买保险或外包活动来实现。\n\
  \n## **U**\n\n`uncertainty level` 不确定性水平。一种指示数据准确性的方法。通过评估数据一致性来确定确定性水平。不确定性水平可以计算为\
  \ `100 减确定性百分比`。\n\n`unintentional threat` 无意威胁。没有执行者的威胁。这些威胁包括以下类别：环境、人为、事故和故障。\n\
  \n`uninterruptible power supply` (`UPS`) 不间断电源。用于在主电源故障时为系统即时电源的电池或电池组。`UPS` 设备旨在提供短期电源，为系统提供足够的时间关机或切换到长期电源。\n\
  \n`United States Computer Readiness Team` (`US-CERT`) 美国计算机准备小组。国家网络安全部门的一部分。`US-CERT`\
  \ 针对网络攻击者提供响应支持和防御。其重点是保护联邦政府资源。它与州、地方政府以及其他公营部门合作共享信息。\n\n`U.S. Attorney General`\
  \ (`U.S. AG`) 美国司法检察长。高级联邦执法官员；美国司法部部长，也是总统内阁成员。\n\n## **V**\n\n`version control`\
  \ 版本控制。一种确保文件更改受控并跟踪的过程。`version control` 通常用于应用程序开发。程序员检出模块或文件，进行更改，然后将文件检回库。\n\
  \n`virtualization` 虚拟化。一种允许单个物理服务器托管多个虚拟服务器的技术，从而节省硬件和设施成本。此外，虚拟化可用于灾难恢复，因为虚拟服务器可以被复制为文件并轻松移动到不同位置。\n\
  \n\n\n\n\n`vulnerability`: 漏洞：对威胁的脆弱性或暴露。漏洞可能存在于资产或环境中。控制措施旨在缓解与相关的风险。\n\n`vulnerability\
  \ assessment`: 漏洞评估：一种用于发现系统漏洞的过程。该评估会对漏洞进行优先级排序，识别出对组织风险最大的漏洞。\n\n## W\n\n`warm\
  \ site`: 热备场：用于灾难恢复的备用位置。该站点是冷备场（cold site）和热场（hot site）之间的折中。它通常包含了运营所需的大部分设备，但数据需要更新。通过使用热备场，管理层能够在成本与可接受的机时间内取得平衡。其他备用位置是冷备场和热场。\n\
  \n`web farm`: Web 场：一组用于托管单个网站的多个服务器组。Web 场允许服务通过增加额外的服务器来轻松支持更多客户端。如果 Web 场中的某台服务器故障，客户端将不会被重定向到该服务器，这提供了一种容错机制。\n\
  \n`web of trust`: 信任网：用于与良好隐私（PGP）和 OpenPGP 兼容的系统中，以确保公钥与其所有者之间的绑定是真实的。它是依赖于 CA（证书机构）的\
  \ PKI 的替代方案。\n\n`whitelist`: 白名单：垃圾邮件过滤器中用于允许邮件通过的列表。它是电子邮件地址或电子邮件域的列表。你将地址或域名添加到白名单，以确保来自这些源的邮件不会被标记为垃圾邮件。\n\
