  © Sai Chan/Shutterstock\n\n## 识别与分析风险缓解安全控制\n\n## 第 9 章\n\n控制可以缓解风险，这意味着它们将威胁或漏洞减少或中和到可接受的水平。在任何时候，公司可能都建立了需要更新的控制、计划中的控制以及需要或正在考虑的控制。\n\
  \n在任何环境中都可以实施数百种控制措施。在评估控制时，考虑不同类别的控制是最好的。美国国家标准与技术研究院（NIST）发布了 `SP 800-53`。该文档将\
  \ 212 项控制措施分为 20 个族，并用缩写命名，例如 `AC` 代表访问控制，`IR` 代表事件响应，`CM` 代表配置管理。控制根据通用、自定义和混合三种类型被划分为低、中、高。控制还分为程序性（或管理性）、技术性和物理性控制。`NIST\
  \ SP 800-53 Rev. 5` 强调了以结果为导向的、隐私和威胁情报控制。\n\n### 第 9 章主题\n\n本章涵盖了以下主题和概念：\n* 什么是现置控制（in-place\
  \ controls）\n* 什么是计划内控制（planned controls）\n* NIST 定义的不同控制族是什么\n* 什么是程序性控制\n* 什么是技术性控制\n\
  * 什么是物理性控制\n* 风险缓解安全控制的最佳实践是什么\n\n### 第 9 章目标\n\n在完成本章后，你能够：\n* 区分现置控制和计划内控制\n*\
  \ 识别给定的控制属于哪个族\n* 识别并列出程序性控制\n* 识别并列出技术性控制\n* 识别并列出物理性控制\n* 列出风险缓解安全控制的最佳实践\n\n\
  ### 现置控制 (In-Place Controls)\n\n在识别和分析风险缓解安全控制时，需要识别哪些已经实施的控制。现置控制安装在运行中的系统中。相关文档应说明其目的。\n\
  \n这些现置控制中的某些可能需要替换，这取决于它们是否符合当前目标。例如，网络中的系统可能安装了杀毒软件。然而，这些系统在过去的一年里可能被恶意软件感染过，这促成了将其替换为认为更可靠工具的决定。\n\
  \n基于此类信息，应对对任何现置控制的有效性进行评估。如果某项控制被认为无效，则可以使用替代控制来替换。\n\n控制，也称为对措施（countermeasures），将减少或中和威胁或漏洞。控制有三个主要目标：\n\
  * 预防\n* 恢复\n* 检测\n\n某些控制只关注一个目标，而其他控制则关注多个目标。然而，如果某项控制无法充分满足这些目标中的某一个，就应该被替换。\n\n\
  ### 计划内控制 (Planned Controls)\n\n计划内控制是那些已经批准但尚未安装的控制。\n\n这些现置控制中的某些可能需要替换，这取决于它们是否符合当前目标。例如，网络中的系统可能安装了杀毒软件。然而，这些系统在过去的一年里可能被恶意软件感染过，这促成了将其替换为认为更可靠工具的决定。\n\
  \n基于此类信息，应对对任何现置控制的有效性进行评估。如果某项控制被认为无效，则可以使用替代控制来替换。\n\n控制，也称为对措施，将减少或中和威胁或漏洞。控制有三个主要目标：\n\
  * 预防\n* 恢复 \n* 检测\n\n某些控制只关注一个目标，而其他控制则关注多个目标。然而，如果某项控制无法充分满足这些目标中的某一个，就应该被替换。\n\
  \n计划内控制是那些已经批准但尚未安装的控制。\n\n#### 控制类别 (Control Categories)\n\n有数百种类型的安全控制。为了使这些类型更于理解，风险缓解安全控制被分为若干类。\n\
  \n* **NIST SP 800-53，信息系统和组织的安全与隐私控制**——`NIST SP 800-53` 识别了 20 个族。\n* **实施方法**——使用了三种实施方法进行分类：程序性控制、技术控制和物理控制。\n\
  \n#### NIST 控制族 (NIST Control Families)\n\nNIST 特别出版物对 IT 专业人员来说变得越来越有用。它们记录了安全最佳实践并提供了中心知识源。\n\
  \nNIST 将于 2020 年发布 `SP 800-53 Rev. 5`，它将为 200 多项安全控制提供指导。\n\n`NIST SP 800-53` 可用于审查任何组织的安全性。例如，物理和环境保护族包含了\
  \ 19 项控制。\n\n### 提示\n\n![](img/Tip.png)\n\n`NIST SP 800-53 Rev. 5` 将于 2020 年发布，对隐私和扩展的安全控制了新的关注，并对控制类别引入了新的变化。\n\
  \n### 功能性控制 (Functional Controls)\n\n某些控制是根据其执行的功能识别的。这些功能被分为三大类控制：预防性、检测性和纠正性。\n\
  \n预防性控制 试图防止风险发生。例如，为了加固服务器而采取的许多操作都是预防性的。这些操作包括禁用不需要的服务和移除不需要的协议。如果服务或协议不在服务器上，它就无法被攻击。同样，保持系统更新补丁也是预防性的。\n\
  \n检测性控制 试图检测漏洞何时被利用。审计日志和审计跟踪是被动检测性控制的示例。当审阅日志时，事件就会被发现。入侵检测系统 (`IDS`) 是主动检测性控制的示例。`IDS`\
  \ 可以实时查看日志，从而使其能够在攻击发生时检测到它。\n\n纠正性控制 试图扭转问题的影响。文件恢复和数据修复是纠正性控制的示例。例如，可靠的备份允许在数据损坏时进行恢复。\n\
  \n\n\n\nNIST SP 800-53 Rev. 5 的第 3 章展示了详细的控制目录，记录了这些族中的大多数安全和隐私控制。附录 E 记录了程序管理中的控制措施。SP\
  \ 800-53 是一份动态文档，这意味着目录中记录的安全控制随着时间的推移而变化。某些控制将被添加，某些将被删除，另一些将被修改。\n\n#### ![](img/Note.png)备注\n\
  \nNIST SP 800-53 的之前的版本将控制族分为管理、运维或技术。然而，作者在 NIST SP 800-53 Rev. 4 中删除了这种分类。移除它们的原因是许多控制族包含了这两两种或更多类别的控制措施。NIST\
  \ 800-53 Rev. 5 进行了进一步的修订，更新了控制族。\n\n以下列表提供了控制族的概览。族标识符是两个字母的缩写，列在括号中。控制族包括：\n\n\
  *   **访问控制 (AC)**——该族包含 23 项控制措施，帮助组织实施有效的访问控制。它们确保用户拥有执行工作所需的权利和权限，且不再更多。该族的控制还包括最小权限和职责分离等原则。\n\
  *   **审计与问责 (AU)**——该族包含 16 项控制措施，帮助组织实施有效的审计计划。某些控制确定了要审计的内容，其他控制则提供了保护审计日志的细节。该族还包括关于使用审计日志进行不可否认性的信息。\n\
  *   **意识与培训 (AT)**——该族包含四个控制措施，包括可以用来提高组织内所有用户安全意识的步骤。这些项目帮助组织识别所需的培训并妥记录培训。\n*\
  \   **配置管理 (CM)**——该族包含 12 项控制措施，涵盖变更管理和配置管理。变更控制实践防止未经授权的更改，配置管理控制措施强调使用基准来配置新系统。最小功能控制记录了系统加固的方法，其中包括移除或禁用不必要的协议和服务的常用方法。\n\
  *   **应急计划 (CP)**——这 12 项控制措施用于帮助组织从故障和灾难中恢复。它们包括与故障和灾难的计划、培训和测试相关的控制，以及与用于存储或处理的备用站点相关的控制。NIST\
  \ SP 800-34 是主要参考。\n*   **标识与认证 (IA)**——这 11 项控制措施涵盖了识别和验证用户的不同实践。每个用户都应被唯一标识，这意味着每个用户有一个仅供一个用户使用的账户。同样，设备标识符可以唯一标识网络上的设备。\n\
  *   **事件响应 (IR)**——这 10 项 IR 控制涵盖了安全事件的所有方面，包括培训、测试、处理、监控和报告。NIST SP 800-84 和 SP\
  \ 800-115 是主要参考。\n*   **维护 (MA)**——这 6 项 MA 控制涵盖了与维护相关的安全方面，例如工具、维护人员和及时维护。\n* \
  \  **媒体保护 (MP)**——这 8 项 MP 控制侧重于对移动数字媒体的保护，包括磁带、外部硬盘和 USB 闪存。该族的控制还包括非数字媒体（如纸张和胶片），并涵盖访问和标记。\n\
  *   **人员安全 (PS)**——这 8 项 PS 控制涵盖了与人员相关的安全方面。\n*   **物理和环境保护 (PE)**——这 19 项 PE 控制侧重于物理安全。\n\
  *   **计划 (PL)**——这 6 项 PL 控制侧重于安全计划。\n*   **程序管理 (PM)**——这 16 项 PM 控制解决企业级程序管理。\n\
  *   **风险评估 (RA)**——这 5 项 RA 控制侧重于风险评估。\n*   **评估、授权与监控 (CA)**——这 8 项 CA 控制解决评估和监控。\n\
  *   **系统和通信保护 (SC)**——这 41 项 SC 控制涵盖系统和通信通道。\n*   **系统和信息完整性 (SI)**——这 16 项 SI 控制侧重于维护系统和数据。\n\
  *   **系统和服务采集 (SA)**——这 15 项 SA 控制解决产品服务的购买。\n*   **个人身份信息处理与透明度 (PT)**——这 21 项\
  \ PT 控制解决如何处理 PII。\n*   **供应链风险管理 (SR)**——这 25 项 SR 控制解决供应链风险的考量。\n\n#### ![](img/Note.png)备注\n\
  \n不可否认技术防止某人否认其执行了某项操作。例如，审计日志记录了事件的谁、什么、何地和何时细节。如果审计日志记录了用户删除了文件，该用户无法令人信服地否认。用户登录了，审计日志用用户的登录凭据记录了该操作。唯一的另一种是用户泄露了自己的凭据。数字签名也提供了不可否认性。\n\
  \n#### 程序性控制示例\n\n\n\n\n\n程序控制是指由个人执行的程序。这些程序通常详细记录在组织用于安全的书面文档中。程序控制是高层管理人员关于如何处理组织内部安全的指令。旧版本的\
  \ `NIST SP 800-53` 将这些控制措施称为管理控制。\n\n以下章节提供了这些类别中一些常见程序控制措施的示例：\n\n*   策略与程序\n*\
  \   安全计划\n*   保险与保函\n*   背景与财务检查\n*   数据泄露防护计划\n*   教育、培训与意识\n*   行为准则\n*   软件测试\n\
  \n## 策略与程序\n\n策略和程序是为组织提供指南和规则的书面文档。组织通常会有几项策略和程序。策略是一份高层文档，提供整体方向而不包含具体细节。程序则提供了实施策略所需的详细步骤。\n\
  \n策略的应用非常广泛。它们确定了管理层希望在特定课题上采取的方向，这意味着它们记录了高层管理决策。组织内的人员可以采取措施实施策略。策略还提供了权威性，这种权威可以用于购买支持策略的资源。如果没有策略的支持，购买行为可能更难证明其合理性。\n\
  \n### 注意\n\n程序控制必须获得高层管理的支持。如果管理层不支持这些指南，他们的缺乏支持很快就会被员工察觉。组织将拥有两套策略：一套是书面策略集，另一套是每个人遵循的非书面策略集。\n\
  \n例如，备份策略将根据数据的价值确定哪些数据需要备份。数据可能包括用户数据、数据库、服务器上的应用程序数据等。备份策略还会规定存储和留存要求。它会指定备份副本必须存储在独立的地点，以提供针对火灾等灾害的保护。\n\
  \n备份策略将包含留存策略，确定备份需要保留多久。例如，留存策略可能规定某些数据需保留三年，而其他数据仅保留 30 天。同样，这些选择取决于管理决策，而这些决策被记录在书面策略中。\n\
  \n有了备份策略，负责备份数据的部门就可以购买资源来实施该策略。这些资源包括磁带驱动器、磁带和软件。备份可能会昂贵；如果没有备份策略，有时经理会对成本望而却步。\n\
  \n程序的范围比策略窄，且更以任务为导向。它们确定了实施策略所需的特定步骤。任何策略都可能对应多个程序。\n\n例如，备份策略会规定需要执行备份，但不会说明如何执行。相反，程序则说明了如何执行备份。可以为备份用户数据、数据库和其他应用程序数据，以及将磁带传输到离线地点创建独立的程序。\n\
  \n策略的示例可能包括：\n\n*   `可接受使用策略（AUP）`——通过界定用户在系统上可以做什么和不能做什么来定义系统的可接受使用。有时，`AUP` 被称为行为准则。\n\
  *   `漏洞扫描策略`——为执行定期扫描提供授权。它识别了扫描的具体目标以及执行扫描的频率。\n*   `移动介质策略`——许多组织意识到与移动介质（如 `USB`\
  \ 闪存盘）相关的风险。通过该策略，他们限制了移动介质的使用。\n\n程序的示例可能包括：\n\n*   `可接受使用策略（AUP）`——通过界定用户在系统上可以做什么和不能做什么来定义系统的可接受使用。有时，`AUP`\
  \ 被称为行为准则。\n*   `漏洞扫描策略`——为执行定期扫描提供授权。它识别了扫描的具体目标以及执行扫描的频率。\n*   `移动介质策略`——许多组织意识到与移动介质（如\
  \ `USB` 闪存盘）相关的风险。通过该策略，他们限制了移动介质的使用。\n\n## 安全计划\n\n组织创建不同的计划来处理不同的场景。许多计划对组织是通用的。本节涵盖：\n\
  \n*   业务连续性计划\n*   灾难恢复计划\n*   备份计划\n*   应急响应计划\n\n### 业务连续性计划\n\n业务连续性计划 (`BCP`)\
  \ 是一项综合计划，帮助组织准备应对紧急情况。它确保即使在灾难发生后，关键功能也能持续。`BCP` 通常从业务影响分析 (`BIA`) 开始。`BIA` 识别关键功能，然后记录如何保持其运行。\n\
  \n### 灾难恢复计划\n\n灾难恢复计划 (`DRP`) 提供了灾难后恢复一个或多个系统的细节。有时，`DRPs` 和 `BCPs` 被视为同一。但它们是不同的。`BCP`\
  \ 在灾难期间保持关键功能运行，而 `DRP` 的侧重点更窄，并识别如何恢复系统。\n\n例如，`BCP` 可能会识别组织如何应对飓风，例如将关键功能转移到备用地点。飓风过后，`DRP`\
  \ 识别组织应如何恢复其系统。例如，洪水可能破坏了多台服务器。`DRP` 识别如何恢复这些服务器。`BCP` 还会识别在 `DRP` 恢复服务器后，如何让关键功能恢复正常运行。\n\
  \n### 备份计划\n\n备份计划源于备份策略，通常作为 `DRP` 的一部分。除非事先进行过备份，否则灾难后无法恢复数据。备份策略识别对组织有价值的数据，并规定存储和留存要求。备份计划包含了识别如何备份这些数据的程序，因为并非所有备份方式都相同。\n\
  \n如果数据存储存储，用户数据的备份非常简单。通常，组织要求用户将数据存储在中央服务器上，备份计划记录了这一要求。管理员随后备份服务器上的数据。在每个用户系统上备份数据几乎是不可能的。\n\
  \n托管在数据库服务器上的数据库需要专用软件进行备份。同一软件无法同时备份用户数据和数据库。此外，许多其他服务器应用程序（如电子邮件服务器）需要专用备份软件。\n\
  \n备份计划还识别如何进行测试恢复，以验证备份的数据是否可以恢复。许多恐怖故事讲述了一个组织定期执行数据备份流程，但在需要恢复数据时，技术人员发现没有任何备份是可用的。测试恢复只是恢复一个备份磁带，以确保备份有效。\n\
  \n### 应急响应计划\n\n应急响应计划记录了组织应如何响应安全事件。根据组织的复杂性，组织可能会有多个应急响应计划。\n\n\n\n\n\n安全事件是指任何影响系统或数据机密性、完整性或可用性的事件。当威胁利用漏洞时，就会发生安全事件。\n\
  \n例如，系统感染了恶意软件。该组织的计划可能是采取以下步骤来应对感染：\n\n*   断开局域网连接线。\n*   保持系统电源开启状态。\n*   记录下显示的任何信息。\n\
  *   报告该事件。\n\n针对服务器的拒绝服务（`DoS`）攻击可能会引发更复杂的问题，这需要管理员或安全专业人员的响应。一旦事件得到证实，管理员随后可以采取措施隔离该事件，并保护有关攻击的任何证据。\n\
  \n## 保险与保函\n\n风险可以被规避、共享或转移、缓解或接受。在损害发生概率极低但影响极大的情况下，组织通常选择共享或转移风险。风险共享或转移的主要方式是组织购买保险。\n\
  \n大多数保险保单都规定了保险公司与客户之间的共同责任。例如，火灾险通常涵盖火灾造成的大部分而非全部损失。它还要求客户采取合理的预防措施以防止火灾。在某些情况下，整个风险可以通过保险保单进行转移。\n\
  \n可以购买许多类型的保险。目标是保护公司免受损失。如果风险发生，保险将帮助支付损失，从而防止风险导致公司破产。\n\n某些保险类型，如火险和洪水险是显而易见的。其他类型的保险则需要解释。\n\
  \n业务中断险作为某些保单的附加险购买。例如，公司可以在火灾险保单上增加业务中断险。如果发生火灾且公司无法正常运营，保险将支付损失，直到公司重新开放。这种保险通常涵盖运营费用（如设备租赁），还将支付公司本应可以赚取的利润。\n\
  \n错误与遗漏险（也称为专业责任险）如果公司向其他公司提供服务，那么这种保险非常有价值。例如，想象一家公司对客户的服务器进行维护。在执行维护的过程中，技术人员不小心插反了电源，导致损坏了服务器。客户可能会起诉这家公司。这种保险将提供保护。\n\
  \n同样，公司可能为客户提供咨询服务。顾问可能帮助客户创建备份计划，但忘记了包含异地存储。由于顾问是专家，这是一个明显的疏忽。如果客户遭受火灾并丢失了组织的所有备份，公司可能会提起诉讼。同样，错误与遗漏险提供了保护。\n\
  \n保函（Bonding）是一种涵盖盗窃、欺诈或不诚实导致损失的保险。受保函保险保护的人被称为担保人员。组织在法律要求以及为了向客户提供某种安全保障时会购买保函。\n\
  \n例如，一家公司为客户家中提供 IT 支持。可以购买保函来涵盖技术人员。如果公司的技术人员在提供服务期间偷了客户的财物，保函公司将赔偿损失。保函范围通常非常窄。\n\
  \n## 背景与财务检查\n\n许多组织进行背景和财务检查，以确保员工是值得赖的。背景检查可以查看一个人的犯罪记录。财务检查可以查看一个人的信用历史。\n\n\
  ## 数据丢失防护计划\n\n数据丢失防护计划帮助公司防止数据丢失。数据丢失可以通过两种方式之一发生：\n\n*   **机密性丢失**：当未经授权的实体查看数据时，公司会失去机密性。例如，如果未经授权的用户查看了数据，机密性就会丢失。访问控制不当可能允许未经授权的用户查看数据，攻击者可能黑入网站并访问后端数据库，或者用户可能丢失存有专有信息的笔记本电脑。\n\
  *   **由于损坏导致的丢失**：文件可以通过多种方式变得损坏。磁盘驱动器可能会崩溃，应用程序在写入文件时可能会失败，或者用户可能无意或故意删除数据。数据如何丢失并不如通过备份做好准备那么重要。\n\
  \n组织可以使用两种方法防止机密性丢失。其中一种方法是使用访问控制。身份验证方法识别并验证用户。然后通过权限授予访问授权。最小权限原则确保用户仅拥有他们所需的资源，而没有多余的。\n\
  \n另一种防止机密性丢失的方法是加密。数据可以在静态存储时或传输时进行加密。静态数据是指任何存储在介质上的数据，如硬盘或 USB 闪存驱动器。数据在通过网络传输时也可以进行加密。\n\
  \n![Note](img/Note.png)\n\n**注意**：用于防止数据丢失的实际方法是技术控制。然而，识别需要保护哪些数据的计划是程序性控制。\n\n\
  ## 教育、培训与意识\n\n一个组织可以拥有地球上记录最完善的安全控制。然而，如果员工不知道它们是什么或如何实施它们，这些控制就根本不起作用。教育、培训和意识控制确保员工知道为什么建立安全控制很重要，以及如何实施安全控制，并了解组织的安全标准。\n\
  \n\n\n\n意识计划是通用的，适用于所有人员。它们使用不同的技术来告知和提醒人们安全问题，并试图让用户将安全意识个性化。换句话说，安全不再是他人的责任，而是用户意识到安全是每个人的责任，包括他们自己。提高安全意识的一些示例包括：\n\
  \n* 登录或欢迎横幅\n* 电子邮件\n* 海报\n\n针对不同的受众提供培训。有些培训是通用的，适用于所有人员。例如，所有用户都应该接受社会工程学策略的教育。其他培训是专门的，针对特定群体的。例如，为维护特定防火墙的管理员提供有关如何维护该防火墙的培训。特定的安全专业人员将接受如何运行和解释漏洞扫描的培训。\n\
  \n教育通常侧重于不保护组织带来的风险。它适用于组织高层，并尝试对安全控制、标准和实践进行成本效益分析。\n\n## 行为规则\n\n`行为规则`(`#29_glossary.xhtml#gloss157`)\
  \ 让用户知道他们对系统可以做什么和不能做什么。用户在获得系统权限之前会阅读此文档，并且通常需要签署一份文件表示他们已阅读并理解了行为规则。\n\n管理和预算局\
  \ (OMB) 要求在其管辖范围内的机构使用行为规则。这些规则记录在 `OMB Circular A-130` 的 `Appendix III` 中，该文件还引用了\
  \ `SP 800-53` 中记录的行为规则控制。\n\n行为规则文档中的一些常见元素有：\n\n* `隐私`——许多组织强调用户对隐私没有预期。如果他们使用雇主的资源，将受到监控，并且可以随时查看数据。这些数据包括用户的数据文件、电子邮件文件和用户的互联网活动历史。组织经常扫描所有传出的内容（如电子邮件），这有助于他们确保没有发布个人身份信息\
  \ (`PII`)。\n* `限制活动列表`——大多数系统都会限制某些活动。组织通常会明确限制访问任何包含色情或情内容的网站。限制列表还可以包括游戏、赌博或个人业务。尽管这些限制试图避免冒犯员工，但其他限制旨在保护资源。例如，某些公司限制任何类型的音频或视频流（如在线广播电台），以防止网络被不必要的流量过载。\n\
  * `电子邮件使用`——用户被告知电子邮件的用途以及存在的限制。大多数公司允许用户发送和接收个人电子邮件。然而，用户不应使用电子邮件进行任何类型的骚扰或传输不良材料。\n\
  * `凭证保护`——用户被告知保护他们的凭证（如用户名和密码），并被提供如何创建强密码的信息。\n* `不合规的后果或处罚`——此类后果可能是训诫或吊销权限。严重违规可能导致员工被终止雇。\n\
  \n### TIP\n![](img/Tip.png)\nNIST 在 2003 年发布了 `SP 800-50`《建立信息技术安全意识和培训计划》。它提供了关于如何设计、开发和实施意识及安全培训计划的细节。\n\
  \n### TIP\n![](img/Tip.png)\n在某些组织中，行为规则被称为可接受策略 (`AUP`)。大多数私立组织使用 `AUP`。行为规则和 `AUP`\
  \ 的目的是相同的。\n\n此列表并不是完整的。组织将包含必要的信息以确保用户理解他们的。有些组织会将这些信息限制在一页内，而另一些组织会让列表更长。\n\n\
  ## 测试\n\n开发软件的组织应该花时间进行测试，并且应该有一项强制软件测试的策略。测试软件的首要目的是减少软件中未发现的错误数量。\n\nTricentis\
  \ 的一项 2017 年研究报告，软件故障导致的年度损失达 1.7 万亿美元。IT 软件质量联盟 (`CISQ`) 将其 2018 年的估计值约为 1.1 万亿美元。这些数字反映了通过测试进行软件质量检查日益增长的需求和重要性。\n\
  \n执行的软件测试类型属于技术控制。例如，可以执行数据范围和合理性检查。然而，制定要求软件测试的策略是。\n\n## 技术控制示例\n\n技术控制是实现自动化保护的工具。它们包括使用技术方法执行安全的硬件、软件和固件。技术控制与程序控制有显著不同。程序性控制识别应该做什么，并且通常需要人员干预以确保遵循程序性控制。\n\
  \n相比之下，技术控制是使用技术执行的。例如，在许多系统中可以创建密码强制策略。它可以规定密码必须强强，这意味着它们至少包含八个字符，并且是大写字母、小写字母、数字和特殊字符的混合。策略还可以规定每\
  \ 30 天更改密码。\n\n系统提示用户更改密码。如果他们选择不更改，系统将锁定他们直到他们更改密码。当他们更改时，新密码必须是强，因为系统会拒绝弱密码。\n\
  \n### NOTE\n![](img/Note.png)\n本章稍后的“数据范围和合理性检查”部分将更详细地介绍这些主题。\n\n本节介绍了其他技术控制的示例，包括：\n\
  \n* 登录标识符\n* 会话超时\n* 系统日志和审计跟踪\n* 数据范围和合理性检查\n* 防火墙和路由器\n* 加密\n* 公钥基础设施\n\n### 登录标识符\n\
  \n登录标识符是用户的另一个名称。账户被唯一标识并与用户匹配。用户每次登录时都会使用此账户，这有助于执行其他控制。\n\n访问控制需要登录标识符。如果每个用户都用名为\
  \ `Bob` 的账户登录，那么每个用户都具有相同的访问。用户的真实姓名并不重要。授予 `Bob` 的权限将授予所有使用 Bob 账户登录的用户\n\n###\
  \ TIP\n![](img/Tip.png)\n在微软系统中，登录标识符被称为安全标识 (`SID`)。每个用户账户在创建时都会分配一个 `SID`。这个 `SID`\
  \ 是唯一的，用于授予资源访问。\n\n然而，如果每个用户都使用不同的账户登录，就可以单独分配权限。需要访问资源的用户将获得访问，而不需要访问的用户将不会获得访问。\n\
  \n审计日志记录了谁、什么、何地和何时详情，使用了登录标识符。“谁”来自登录标识符。用户使用自己的账户登录，任何可审计的操作都会用此账户信息进行记录。\n\n\
  登录标识符还提供了不可否认性，这意味着如果操作是用登录标识符记录的，用户就无法令人否认他们执行了某项操作。\n\n### 会话超时\n\n大多数系统包含会话超时控制，这有助于确保未经授权的用户在不提供凭证的情况下无法访问会话\n\
  \n\n\n\n简单会话超时控制的一个示例是屏幕保护程序。可以将屏幕保护程序配置为在闲置 10 分钟后启动，并在屏幕保护程序启动后要求用户重新登录。这样，如果用户离开电脑而未锁定系统，屏幕保护程序将在\
  \ 10 分钟后启动并锁定系统。\n\n### ![](img/Tip.png)提示\n\n许多网站的默认超时时间为 20 分钟，这是一个很长的时间。因此，使用公共电脑的人在完成后应立即注销。如果直接走开并保持会话开启状态，就会允许别人在\
  \ 15 分钟后访问该电脑。入侵者随后就可以访问该会话，只要他们保持其活跃状态，该会话就会一直保持开启。\n\n许多网站包含会话超时功能。例如，许多银行网站会在\
  \ 20 分钟后关闭会话。在提供登录银行网站的凭据后，只要用户在网站上处于活跃状态，会话就会保持开启。此功能允许查看不同的页面无需重新登录。\n\n然而，如果网页处于打开状态但\
  \ 20 分钟内没有活动，超时控制将关闭网页并清除会话数据。要再次访问该页面，必须重新输入登录凭据。\n\n同样，如果公共电脑上的会话闲置 20 分钟，它将被关闭，这有助于防止未经授权的用户访问该网站。\n\
  \n### 系统日志和审计跟踪\n\n操作系统和网络设备具有记录不同类型事件的能力。记录事件并定期检查日志可以帮助识别正在发生的情况。日志可用于调查安全事件和排除故障。\n\
  \n### ![](img/Tip.png)提示\n\nNIST SP 800-53 建议使用内部时钟作为时间戳。内部时为所有事件提供一致的时间。\n\n日志通常记录事件的以下细节：\n\
  \n* 谁执行的操作\n* 发生了什么\n* 在何地发生\n* 何发生\n\n这些信息通常缩短为谁、什么、何地和何时。登录标识符识别谁执行了操作，系统识别发生了什么以及发生在何地，时钟提供时间戳来记录发生的时间。\n\
  \n任何网络都存在多种类型的日志。桌面和服务器操作系统包含日志；防火墙包含日志以跟踪允许和被拦截的流量；网络服务器应用程序（如域名系统 DNS）也会记录事件。在任何系统上都可以启用或增强日志记录功能。\n\
  \n### ![](img/Tip.png)提示\n\n日志需要被审查。这一操作似乎显而易见，但这一步经常被忽视。管理员被日常任务淹没，导致日志审查变得不那么重要。当记录的事件过多时，审查日志变得更加困难。许多组织使用自动化工具对日志中的关键事件进行审查。这些工具会对关键事件提供警报并跟踪趋势。\n\
  \n系统日志跟踪操作系统上的不同类型事件。例如，Microsoft Windows 操作系统包含 `System` 日志来记录系统事件。这些事件包括服务的启动或停止，或系统的启动或停止。这些事件被分为错误、警告和信息事件。\n\
  \n安全日志侧重于安全事件。某些安全事件会被记录记录。然而，可以配置日志来记录额外的可审计事件。例如，可以启用对文件夹的审计，显示是否有人访问了存放敏感数据的文件夹。这种类型的审计将记录任何人读取、修改或删除数据的详细信息。\n\
  \n但并非所有事件都应该被记录。相反，日志应该只包含重要内容。记录过多的事件会占用额外的资源，包括捕获和记录事件所需的处理能力以及随着日志填充所需的磁盘空间。\n\
  \n### 数据范围和合理性检查\n\n应用程序开发使用数据范围和合理性检查来帮助确保他们接收到有效数据。开发人员无法确保数据的准确性，但可以确保数据的有效性。\n\
  \n有效数据遵循特定格式，例如，一个预期五位美国邮政编码的文本框。唯一的有效字符是五个数字。如果用户输入五个数字以外的任何内容，则数据是无效的。\n\n同样，例如，用户的邮政编码是\
  \ `23456`。如果用户不输入了 `33456`，应用程序无法判断邮政编码是错误的。因为 `33456` 是一个有效的五位数字，它将通过验证测试。\n\n\
  验证检查出现在网站上。用户会被提示输入某些数据，例如姓名和邮政编码。如果用户漏掉或输入错误，网站会提示错误。\n\n### ![](img/Note.png)注意\n\
  \n数据范围和合理性检查也被称为输入验证。对数据输入进行检查以确保其有效性。\n\n数据范围检查确保数据在某个范围内。例如，用户可能被要求输入一个 `1` 到\
  \ `100` 之间的数字。范围检查确保该数字在 `1` 到 `100` 之间。如果输入的数据超出范围，则不会被使用。相反，用户会被提示重试。\n\n同样，日期范围可以验证日期是否在范围内。例如，可以使用出生日期来确保某人满年龄。它将当前日期与出生日期进行比较。如果用户年龄太小，网站可以将用户重定向到错误页面。\n\
  \n合理性检查确保输入的数据是合理的。例如，预期姓名中会有多少个字母，以及姓名中哪些类型的字符是有效的，都有定义。\n\n参数可能是姓名不能超过 `25` 个字符，且不能包含数字。因此，当用户输入姓名数据时，可以根据此参数进行检查。\n\
  \n### ![](img/Tip.png)提示\n\n合理性检查可以防止某些缓冲区溢出攻击。当网页接收到的数据超过预期时就会发生缓冲区溢出。如果攻击者尝试向文本框输入比预期多的数据，验证检查可以拒绝它。因为数据被拒绝，缓冲区溢出就不会发生。\n\
  \n合理性检查可以用于任何类型的数据。数据只需要被定义。例如，如果对姓名使用合理性检查，则需要定义什么构成姓名。因此，姓名最多五个个字母是不可接受的。\n\n\
  ### 防火墙和路由器\n\n防火墙和路由器软件被用作网络中的技术控制。它们通过允许某些流量和拦截其他流量来控制流量。\n\n许多防火墙和路由器使用隐式拒绝策略，除非显式允许，否则所有流量都被拦截。为了识别允许的流量，防火墙使用规则，路由器使用访问控制列表\
  \ (`ACLs`)。\n\n路由器提供基本的流量过滤，基于：\n\n* 互联网协议 (IP) 地址\n* 端口\n* 某些协议\n\n### ![](img/Note.png)注意\n\
  \n路由器使用路由表识别如何路由流量。路由表识别从一点到另一点传输流量的最佳路径。路由器使用访问控制列表 (`ACLs`) 来控制从一点到另一点的哪些流量。`ACLs`\
  \ 规定了什么种流量可以从哪个方向或从哪个接口通过。\n\n\n\n\n在`FIGURE 9-1`中，可以将路由器配置为允许来自 IP 地址位于子网 1、2 或\
  \ 3 的任何主机的流量。端口被用于识别协议。例如，超文本传输协议（HTTP）使用 80 端口。可以配置 ACL 允许 HTTP 流量访问子网 1 上的内网 Web\
  \ 服务器。简单邮件传输协议（SMTP）使用 25 端口。可以配置 ACL 允许 SMTP 流量访问子网 2 上的电子邮件服务器。\n\n![FIGURE 9-1\
  \ 带有路由器和防火墙控制的流量。](img/9781284183719_CH09_FIGF01.png)\n\n`FIGURE 9-1` 使用路由器和防火墙控制的流量。\n\
  \n防火墙具备基本的路由能力。然而，大多数防火墙要先进得多。路由器 ACL 每次只能评估单个数据包。然而，防火墙可以评估整个会话。一旦两个主机之间建立了连接，防火墙就可以评估它们之间的所有流量，这被称为状态检测。\n\
  \n在防火墙上创建的规则允许网络受到来自外部攻击的保护。通过只允许特定的流量，限制了互联网攻击者的能力。\n\n## 常用端口\n\n端口 0 到 1023 是常用端口。此范围内的端口被分配给特定的协议。当使用该端口时，操作系统会识别出它是用于相关协议的。\n\
  \n互联网数字分配机构（IANA）分配常用端口。完整的端口列表可以在 [`www.iana.org/assignments/port-numbers`](http://www.iana.org/assignments/port-numbers)\
  \ 查看。\n\nHTTP 的常用端口是 80 端口。当系统接收到目标端口为 80 的数据包时，它知道要将此数据包传递给处理 HTTP 协议的服务。运行 HTTP\
  \ 协议的服务器通常是 Web 服务器。\n\n由于 80 端口是常用端口，它不需要被包含在统一资源定位符（URL）中，但也可以包含。以下 URL 包含了端口号：`https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xml`](https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xml)。\n\
  \n防火墙和路由器使用这些端口号来识别允许的流量。例如，如果防火墙想要允许 HTTP 流量，它将有一个规则允许 80 端口上的流量。同样，路由器将通过 ACL\
  \ 中的条目来允许 HTTP 流量。\n\n### 加密\n\n加密将明文数据转换为密文。例如，`password` 一词是明文，但加密后它可能看起来像：`MFIGs3x/$6o0D`。\n\
  \n数据可以在静态存储或传输时进行加密。静态数据是指任何存储在介质上的数据，例如硬盘或 USB 闪存器。如果用户在笔记本电脑上存储敏感数据，可以对数据进行加密以保护它。如果笔记本丢失或被盗，数据泄露的几就会较小。同样，存储在\
  \ USB 闪盘上的数据也可以加密。如果 USB 闪盘丢失或被盗，加密的数据将很难被任何人读取。\n\n攻击者和管理员可以捕获并读取通过网络发送的数据。例如，Wireshark\
  \ 是一款免费的数据包分析器，可以捕获通过网络发送的数据。一旦数据被捕获，打开并分析单个数据包的过程是非常简单的。Wireshark 允许个人读取通过网络发送的任何明文。\n\
  \n### ![](img/Tip.png)提示\n\n加密为数据提供了机密性并有助于防止未经授权的泄露。只有拥有解密密钥的用户才能解密数据。\n\n在拥有足够资源和时间，加密数据并非无法破解。然而，加密算法的设计使得解密过于困难且耗费时间过多，以至于不值得。\n\
  \n例如，年前，用于互联网的 Rivest、Shamir、Adelman (RSA) 加密使用 40 位密钥，这在当时是安全的。然而，1997 年，伯克利大学分校的一名学生在三个半小时内破解了一个\
  \ 40 位 RSA 密钥，而今天，这可以在几分钟内完成。目前，RSA 常用 1024 位、2048 位或 4096 位密钥。根据 RSA 的说法，1024 位密钥已被破解，2048\
  \ 位密钥可以一直使用到 2030 年。NIST 建议 RSA 使用 2048 位密钥。\n\n### ![](img/Note.png)注意\n\n能够捕获流量的数据包分析器通常被称为嗅探器，在网络上捕获数据包被称为`嗅探`。有耐心的攻击者可以嗅探网络流量并捕获大量数据。\n\
  \n加密分类为：\n\n*   **对称加密**——这种加密使用一个密钥。作为一个简单的例子，可以使用 53 作为密钥来同时加密和后解密数据。然而，密钥比简单的两位数字要复杂得多。强对称加密算法使用\
  \ 256 位。\n\n*   **非对称加密**——非对称加密使用两个密钥。一个密钥称为公钥，另一个密钥称为私钥。这两个密钥是相互匹配的。任何用公钥加密的数据只能用匹配的私钥解密。任何用公钥加密的数据只能用匹配的私钥解密。（注：原文此处重复，译文予以保留）\n\
  \n\n\n\n\n例如，证书会颁发给 Web 服务器。当用户连接到 Web 服务器并启动安全会话时，服务器会将证书发送给用户。证书包含一个公钥。用户可以使用公钥对数据进行加密并发送到服务器。由于服务器持有私钥，它可以解密数据。由于没有其他实体拥有私钥，因此没有其他人可以解密数据。\n\
  \n证书也用于数字签名，数字签名提供了身份验证、不可否认性和完整性。\n\n例如，电子邮件可以使用数字签名进行签名。接收者可以核实该邮件是由签名者发送的，而不是试图冒充签名者的人。数字签名的创建分为两个步骤：\n\
  \n- 创建消息哈希值。\n- 使用发送者的私钥对哈希值进行加密。\n\n`FIGURE 9-2`](##19_chapter09_04.xhtml#fig9-2)显示，哈希值只是通过运行算法生成的数字。例如，消息“Hello”的简单哈希可能是\
  \ 77。无论算法运行多少次，哈希值始终是 77。然后，使用发送者的私钥对哈希值进行加密。结果可能是 `Wozj4W902`。\n\n![FIGURE 9-2\
  \ Using digital signatures.](img/9781284183719_CH09_FIGF02.png)\n\n`FIGURE 9-2`\
  \ 使用数字签名。\n\n加密后的哈希值随消息一起发送。接收者拥有公钥，将其用于解密哈希。这一序列提供了三个安全优势：\n\n- **发送者身份验证**——匹配的公钥解密了哈希，这证明了消息是用发送者的私钥加密的，因为只有发送者才能访问私钥。\n\
  - **不可否认性**——发送者无法否认发送过消息。同样，只有发送者拥有其私钥。如果发送者的匹配公钥解密了哈希，其他人就不可能加密该哈希。\n- **完整性**——接收者可以计算消息的哈希并解密收到的哈希。如果两个哈希值相同，则证明消息没有被修改过。\n\
  \n没有 PKI（公钥基础设施）就不可能实现数字签名，因为需要匹配的公钥和私钥。公钥必须能够封装在证书中。需要 CA（证书颁发机构）来颁发证书。\n\n信任网用于兼容\
  \ PGP 和 OpenPGP 的系统，以确保公钥与其所有之间的绑定是真实的。它是依赖于 CA 的替代方案。信任网基于去中心化的信任模型，而不是 CA 的中心化信任模型。\n\
  \n## 物理控制示例\n\n物理控制保护物理环境，包括基础措施，如保护安全区域的锁以及环境控制。本节介绍了以下物理控制的示例：\n\n- 锁门、守卫、访问日志和闭路电视\n\
  - 火灾探测与灭火\n- 水检测\n- 温度和湿度检测\n- 电气接地和断路器\n\n### 锁门、守卫、访问日志和闭路电视\n\n所有组织都有比其他地方更安全的区域。更安全的区域受物理安全措施保护。\n\
  \n例如，机房存放着不应任何人进入的服务器，因为服务器需要保护。可以使用不同类型的物理安全措施来保护服务器。\n\n### 参考\n\n感应卡是一种信用卡大小的小型设备。它包含在靠近感应阅读器时会激活的电子元件。卡片向读卡器发送信号以识别其身份。如果卡片获得授权，门就会打开。\n\
  \n某些信用卡也使用这种技术。只需在信用卡读卡器前挥一下卡，读卡器就会记录。遗憾的是，感应卡阅读器是便携的。攻击者可以将其放在小盒子或包里，然后只需在电梯里往返一天就能收集信用卡数据。\n\
  \n物理安全最简单的方法直接是在门上加锁。这些锁可以是带钥匙的简单锁，也可以用户需要输入数字组合才能访问的密码锁，或者可能要求使用发放给员工的感应卡。某些感应卡还要求用户输入个人密码（PIN）。\n\
  \n也可以使用守卫来保护安全区域。守卫通常会获得一份授权人员名单，只要个人在访问名单上，守卫就会允许他们进入。\n\n访问日志提供了谁进入和离开过建筑的审计追踪。访问日志可以手动创建或自动创建。手动示例是，守卫可以记录所有进入或离开建筑的人员日志。自动示例是，某些感应或胸卡阅读器可以实现自动化。每当用户进入或离开建筑时，阅读器都会记录用户的身份以及日期和时间。\n\
  \n### 三屏防护\n\n许多组织利用三层防护屏障，包括主入口、更安全的员工区域和更安全的计算机区域。这些屏障都是分层级的，意味着安全的计算机区域位于员工区域内，而员工区域位于主入口内。\n\
  \n主入口通常是开放的，允许任何人进出。然而，主入口通常由视频摄像头监控。\n\n员工区域比主入口稍安全一点。可能会有守卫，以确保只有员工或获得授权的访客可以进入员工区域。可以使用密码锁要求员工输入代码以访问，某些组织还向员工发放访问卡。\n\
  \n计算机中心是第三层屏障。它们可以是机房、配线间或任何存储硬件或数据的地方。只有特定的员工（如管理员）被允许进入。\n\n闭路电视（CCTV）使用视频摄像头监控区域。摄像头可以是固定的，也可以是云台摄像机（PTZ）摄像头。PTZ\
  \ 摄像头可以由安全人员控制以关注覆盖的任何区域。\n\n任何区域的保护水平取决于存储的硬件或数据的重要性。一个组织可能只有有限的物理控制，而另一个组织可能拥有广泛的物理控制。这两种选择没有坏之分。如果系统或数据很有价值，就需要花费资金进行保护。\n\
  \n#### 火灾探测与灭火\n\n火灾探测和灭火系统提供针对火灾的保护。火灾发生蔓延迅速，因此目标是拥有一个能够快速探测它们的系统。一旦发现火灾，灭火系统就会尝试扑灭。\n\
  \n探测系统通过环境的变化来指示火正在燃烧。这些变化包括热量、烟雾和气体的显著变化。\n\n灭火系统随火灾而异。火灾分为五类。在美国如下：\n\n- **A 类**——普通可燃物，如木材和纸张\n\
  - **B 类**——易燃液体，如汽油\n- **C 类**——电气火灾\n- **D 类**——可燃金属，如镁\n- **K 类**——烹饪油和脂肪（厨房火灾）\n\
  \n不同类的火灾扑灭方法不同。例如，A 类火灾可以用水扑灭，但绝不能用水扑灭 C 类火灾，因为水会损坏设备。此外，如果电源未关闭，电流可能会沿着水流传输并导致电击消防员。\n\
  \n\n\n\n机房面临着最大的 `Class C` 火灾风险。扑灭 `Class C` 火灾的主要方法是使用气体系统，例如二氧化碳 (`CO[2]`) 和 `FM-200`。气体系统通过向区域释放气体来排出氧气，并中断导致火灾的化学反应。\n\
  \n### ![](img/Note.png)注意\n\n在欧洲、非洲、澳大利亚和新西兰，火灾的分类略有不同。\n\n气体系统会对人员产生危险。例如，当检测到火灾时，技术人员可能正在机房内工作。如果在没有警告的情况下释放气体，它将移除氧气。大多数气体置位系统都会向人员发出警告，给他们离开房间的时间。\n\
  \n火灾检测和灭火系统属于物理控制。然而，它们与保险的程序性控制相结合工作。保险通过支付任何发生的损害费用来提供额外的保护。除非公司拥有完善的检测和灭火系统，否则大多数保险公司不会提供保险。\n\
  \n### ![](img/Tip.png)提示\n\n人员安全应始终是首要任务。如果发生电气火灾，应先关闭电源。\n\n#### 水检测\n\n某些位置容易受到水淹影响。水损害可能代价高昂，但有方法可以保护区域。例如，可以在水位上升到危险水平之前用水泵将其抽出。\n\
  \n水检测系统会检测水何时渗入某个区域。检测系统会自动启动水泵，水泵将持续运行直到检测不到水为止。\n\n#### 温度和湿度检测\n\n高温度和高湿度会损坏电气设备。当温度升高时，电气组件可能会过热并烧毁。如果湿度太高，水分会凝结在设备上，这些水会导致短路，从而损坏设备。\n\
  \n大多数机房都保持凉爽以防止热损坏。许多机房使用架空地板。`FIGURE 9-3` 显示了机房内的空调系统。冷空气被泵到架空地板下的区域。设备安装在机柜中，机柜具有空心底座，并安装在架空地板的孔上。机柜顶部还有强力风扇，可从架空地板抽入空气穿过设备并从机柜顶部排出。\n\
  \n![FIGURE 9-3 机房内的空调系统。](img/9781284183719_CH09_FIGF03.png)\n\n`FIGURE 9-3` 机房内的空调系统。\n\
  \n复杂的机房使用冷热通道布局。交替行的机柜方向是反向的。某一行机柜的正面对着另一行机柜的正面，这被称为冷通道。某一行机柜的背面对着另一行机柜的背面，这被称为热通道。冷空气通过冷通道地板上的穿孔地板被泵入，并从机柜正面吸入，热空气则从机柜背面排出。\n\
  \n### ![](img/Tip.png)提示\n\n供暖、通风和空调 (`HVAC`) 系统同时控制温度和湿度。\n\n如果空调故障，设备将面临风险。如果温度过热，电气组件会烧毁，导致故障。电气设备内部的温度通常比房间温度高\
  \ 10 度。许多机构都有相关政策。\n\n#### 电气接地和断路器\n\n电气接地和断路器保护设备。如果电流超过额定值，断路器会打开，防止火灾发生。\n\n\
