  \    4. 用于提取、加载和转换数据仓库的过程\n\n9. 为了确保整个组织都被覆盖，资产管理系统可以与什么进行比较？\n    1. 硬件和软件资产\n\
  \    2. 软件资产\n    3. 人员和数据资产\n    4. 典型 IT 基础设施的七个领域\n\n10. 更新组织的业务连续性计划时，应仅包含 `\\\
  _\\_\\_\\_\\_\\_\\_` 系统。\n\n11. 下列哪项可能影响来自欧洲经济区数据的隐私法规？\n    1. HIPAA\n    2. GDPR\n\
  \    3. PCI DSS\n    4. FOIP\n\n12. 如果组织想确定特定 IT 服务器故障会产生什么影响，它应该使用什么？\n    1. BIA\n\
