  \n![© Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n\n# 通过计算机事件响应团队计划缓解风险\n\n\
  ## 第 15 章\n\n计算机安全**事件可能导致数据或服务的机密性、完整性或可用性丢失。攻击者会发起攻击，事件也会发生。然而，组织可以通过建立计算机事件响应团队（CIRTs）来做好准备。这些团队经过了培训，并具备相关的知识和专业技能，可以减少攻击造成的损害。他们的行动受\
  \ `CIRT` 计划的指导。\n\n`CIRT` 计划的主要目的是帮助组织为事件做好准备并减轻损害。该计划根据角色和职责确定成员。它包括了与事件相关的策略声明，例如\
  \ `CIRT` 成员是否有权进行反击，以及关于如何处理事件的详细信息。\n\n### 第 15 章主题\n\n本章涵盖了以下主题和概念：\n* 什么是计算机事件响应团队\
  \ (`CIRT`) 计划\n* `CIRT` 计划的目的是\n* `CIRT` 计划的要素有哪些\n* `CIRT` 计划如何缓解组织的风险\n* 实施 `CIRT`\
  \ 计划的最佳实践是什么\n\n### 第 15 章目标\n\n完成本章后，你将能够：\n* 定义 `CIRT`\n* 定义 `CIRT` 计划\n* 描述 `CIRT`\
  \ 成员的角色和职责\n* 描述 `CIRT` 策略\n* 定义计算机事件\n* 描述事件处理流程\n* 描述通信升级程序\n* 描述事件处理程序\n* 描述\
  \ `CIRT` 计划如何缓解组织的风险\n* 列出组织实施 `CIRT` 计划的最佳实践\n\n### 什么是计算机事件响应团队计划？\n\n`计算机事件`是指违反或即将违反安全策略或安全实践的行为。它包括任何影响计算机系统或网络安全的负面事件或活动。这些负面事件会影响组织的安全，并导致机密性、完整性或可用性的丢失。\n\
  \n### 提示\n\n组织可能会在内部定义安全事件。这种定义更为具体，并可能根据组织的需求而略有不同。\n\n`计算机事件`和`计算机安全事件`这两个术语意思相同，可以互换使用。例如，某些组织拥有计算机安全事件响应团队\
  \ (`CSIRTs`) 和 `CSIRT` 计划，而不是计算机事件响应团队 (`CIRTs`) 和 `CIRT` 计划。\n\n### 参考\n\n有时，术语\
  \ `CERT`（正式为计算机应急响应团队的缩写）被代替 `CIRT`。`CERT`® 是一个注册商标，指由联邦资助的 `CERT` 协调中心 (`CERT/CC`)。`CERT/CC`\
  \ 是卡内基·梅隆大学 (`CMU`) 的一部分。`CERT/CC` 与美国计算机安全中心 (`US-CERT`) 不同，后者负责协调美国境内对网络攻击的防御和响应。如果组织使用\
  \ `CERT` 术语，则是侵犯了 `CMU` 的商标。`CIRT`、事件响应团队 (`IRT`) 和 `CSIRT` 等术语更为常用。\n\n即将发生的违规威胁是指即将发生的事件。该术语通常指的是新兴威胁，例如正在快速传播的病毒或蠕虫。即使组织现在没有被感染，如果不迅速采取行动，也将会被感染。\n\
  \n在本章的语境下，事件是指系统或网络内部任何可观测的发生，包括网络上的任何活动，例如用户访问文件或通过网络传输数据。并非所有事件都是事故。负面事件是指那些产生负面结果的事件。它们可以包括对系统或网络的任何类型的攻击。\n\
  \n多种类型的计算机事件影响组织，包括：\n* **拒绝服务 (DoS) 攻击**——`DoS` 攻击是一种阻止系统提供服务的攻击。`DoS` 攻击来自单个攻击者。分布式拒绝服务\
  \ (`DDoS`) 攻击则来自多个系统。\n* **恶意代码**——恶意代码是任何类型的恶意软件或 `malware`，包括病毒、蠕虫、特洛伊木和其他旨在感染系统的软件。正在复制并对计算机造成危害的病毒和其他恶意软件处于“野外”。\n\
  * **未经授权的访问**——当攻击者能够在未经授权的情况下访问数据时，就会发生未经授权的访问。未经授权的访问可以通过不同类型的社交工程攻击以及用于获取系统访问或控制的技术攻击获得。未经授权的访问通常会导致机密性丢失。\n\
  * **不当使用**——当员工或内部用户违反接受使用政策 (`AUPs`) 或内部策略时，就会发生不当使用。这可能仅仅是用户访问了 `AUP` 中识别为禁止访问的恶意网站、用户从安全系统复制专有数据到不安全的系统，或者用户在\
  \ `AUP` 禁止的情况下在其系统上安装点对点 (`P2P`) 软件。\n* **多组件**——多组件事件是指同时包含两个或多个事件的事件。例如，恶意软件可以感染系统，然后被用于对其他系统发起\
  \ `DoS` 攻击。\n\n`计算机事件响应团队 (CIRT)` 是一组响应事件的人员。`CIRT` 团队可以提前指定或根据需要组成。例如，一个大型组织可能会指定一组安全专业人员作为\
  \ `CIRT`。当事件发生时，`CIRT` 做出响应。较小的组织可能没有正式的 `CIRT`。相反，当事件发生时，信息技术 (`IT`) 专业人员作为非正式的\
  \ `CIRT` 对事件进行响应。\n\n`CIRT 计划`是一份正式文档，概述了组织对计算机事件的响应。它正式定义了安全事件，并可能指定了 `CIRT` 团队。以下章节概述了\
  \ `CIRT` 计划的和要素。\n\n### CIRT 计划的目的\n\n`CIRT` 计划的目的是帮助组织识别并准备计算机事件。安全人员随后可以确定最佳响应以减少潜在损害。\n\
  \n`CIRT` 计划的目的与灾难恢复计划 (`DRP`) 的目的相似。通过花时间制定计划，可以对关键问题进行研究。\n\n然而，如果没有计划，当事件发生时，响应人员将无法获得这些利益，这使他们不得不使用试错法。这些即兴技术可能会成功，但另一方面，它们可能允许攻击者继续，并对组织造成远大的损害。\n\
  \n`CIRT 计划`概述了响应工作的目的，通常来说是尽可能完整地识别事件然后将其控制。回答“五个 W”（什么、何地、谁、何时、为什么）是一个很好的起点。它们是*什么*、*何地*、*谁*、*何时*和*为什么*。为了保险起见，还可以加上它是*如何*发生的。\n\
  \n\n\n\n\n`what` 识别了发生了什么类型的攻击。它可能是 `DoS` 攻击、恶意软件攻击、未经授权的访问或不当使用。了解发生了什么有助于确定影响并优先考虑响应措施。计算机事件响应小组（CIRT）的计划通常包含用于确定影响和攻击优先级的工具。\n\
  \n接下来，`where` 识别了攻击发生的地点。在至少一个发出报警的系统上会有明显的症状。然而，也应该检查其他系统，以查看它们是否受到了影响。如果影响了多个系统，则可能需要重新评估影响和优先级。\n\
  \n### !![](img/Note.png)注意\n\n本章稍后出现的“事件处理程序”部分展示了确定事件影响和优先级的工具示例。表 15-1 显示了影响级定义的示例，表\
  \ 15-2 显示了关键性评级定义的示例，表 15-3 显示了事件影响评级的示例。\n\n如果可能，应该识别出是谁 `who` 发起了攻击。确定谁发起了攻击的一种有效方法是检查日志。可以检查系统的审计日志、防火墙日志和路由器日志。如果用户通过了身份验证，日志将识别出用于攻击的用户账户。如果攻击来自外部源，日志将识别出一个外部互联网协议（IP）地址，可以通过封该地址来停止攻击。\n\
  \n### 技术提示\n\n攻击者经常劫持其他系统来发动攻击。例如，控制僵尸网络的攻击者向僵尸主机发送命令，由僵尸主机发动攻击；或者攻击者可以简单地开车，直到找到一个开放的无线网络，攻击者可以使用该网络发动攻击。追溯到此无线网络的攻击无法识别出真正的攻击者，但会识别出无线网络。等到攻击追溯到\
  \ IP 地址时，真正的攻击者早已去了。\n\n识别攻击发生的 `when` 远比识别发现症状的时间要复杂。攻击者在攻击前通常会进行侦察，日志条目可能显示在过去的一周内从同一个源发生过多次侦察攻击。\n\
  \n回答攻击者为什么要 `why` 攻击有助于理解他们的动机。过去的攻击者往往是因为无聊而攻击的；他们这样做仅仅就像乔治·马洛里（George Mallory）想爬埃穆朗玛峰的原因一样——“因为在那里”。然而，今天的攻击者通常受贪婪驱动，因此他们偷取可以转化为金钱的数据。\n\
  \n### 事件的增长\n\n1988 年 11 月，当莫里斯虫（Morris worm）袭击时，互联网上遭受受攻击的计算机成为了新闻焦点。卡内梅隆大学（CMU）建立了\
  \ CERT 以此应对，并开始统计事件数量。\n\n`图 15-1` (#26_chapter15_02.xhtml#fig15-1) 显示了多年年来事件的增长情况。1988\
  \ 年发生了 8 起事件；1998 年有 3,734 起；2003 年有 137,529 起。CMU 的 CERT 最后一次报告事件数量是在 2003 年。如果今天仍在跟踪和报告事件数量，这些数字将超出图表范围。除非计算机从未开启或保持完全隔离状态，否则它将会被攻击。\n\
  \n![图 15-1 由 CERT 跟踪的事件历史。](img/9781284183719_CH15_FIGF01.png)\n\n**图 15-1** CERT\
  \ 跟踪的事件历史。\n\n这些事件的名称多年来发生了变化。`网络攻击`（cyberattack）和`网络恐怖主义`（cyberterrorism）这两个术语被经常使用，两者都是当今互联网上的重大威胁。\n\
  \n例如，一组著名的攻击者经常窃取信用卡数据，并利用这些数据制作伪造信用卡。然后，他们雇佣女性使用这些卡在商场购物。这些女性在奢华的购物狂欢中尽可能多地购买商品，花费数万美元，随后她们将货物带到商场停车场的一个货车上，在那里，一个`接头`（fence）以低价购买货物并迅速售出。\n\
  \n攻击者经常劫持其他系统来发动攻击。例如，控制僵尸网络的攻击者向僵尸主机发送命令，由僵尸主机发动攻击；或者攻击者可以简单地开车，直到找到一个开放的无线网络，攻击者可以使用该网络发动攻击。追溯到此无线网络的攻击无法识别出真正的攻击者，但会识别出无线网络。等到攻击追溯到\
  \ IP 地址时，真正的攻击者早已去了。\n\n识别攻击发生的 `when` 远比识别发现症状的时间要复杂。攻击者在攻击前通常会进行侦察，日志条目可能显示在过去的一周内从同一个源发生过多次侦察攻击。\n\
