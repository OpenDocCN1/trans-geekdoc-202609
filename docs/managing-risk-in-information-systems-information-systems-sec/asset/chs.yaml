  \ Chan/Shutterstock\n\n## 识别与分析威胁、漏洞与利用\n\n### 第 8 章\n\n威胁能够利用漏洞时，就会产生风险。\n\n在这种背景下，识别和分析威胁、漏洞和利用是有关重要的。这些过程可以通过威胁评估、漏洞评估和利用评估来实现。\n\
  \n威胁评估尝试识别威胁，但无法识别所有可能的威胁。相反，它尝试识别尽可能多的威胁。通过审查历史数据，可以识别威胁。\n\n可以通过漏洞评估发现网络中的漏洞。有很多方法，有些是手的（例如审查文档、执行审计或访问人员），有些是自动化的。\n\
  \n利用评估尝试识别可以被利用的漏洞。\n\n#### 第 8 章主题\n\n本章涵盖以下主题：\n* 什么是威胁评估\n* 什么是漏洞评估\n* 什么是利用评估\n\
  \n#### 第 8 章目标\n\n完成本章后，你将能够：\n* 描述用于识别威胁的技巧\n* 在典型基础设施的七个领域实施威胁评估的最佳实践\n* 描述漏洞评估中审查文档的价值\n\
  * 描述审查系统日志、审计跟踪和入侵检测系统输出的价值\n* 识别用于执行漏洞扫描的工具\n* 描述漏洞评估中执行审计和人员访谈的价值\n* 在漏洞评估背景下描述并对比过程分析和输出分析\n\
  * 描述用于漏洞评估的不同系统测试\n* 在典型信息技术（IT）基础设施的七个领域实施漏洞评估的最佳实践\n* 在基础设施的所有领域中识别利用\n* 描述如何使用差距分析和修复计划缓解利用\n\
  * 说明配置管理和变更管理缓解已识别利用的价值\n* 描述如何验证和确认利用已缓解\n* 在典型基础设施中执行利用评估的最佳实践\n\n## 威胁评估\n\n\
  威胁评估识别并评估潜在威胁。其目标是识别尽可能多的潜在威胁，然后对其进行评估。一个重要要素是对威胁频率的估计。\n\n风险评估和威胁评估有一个共同点，时间。风险评估是在特定时间进行的。今天存在的风险在一年后可能不再存在。同样，威胁评估也是在特定时间进行的。威胁评估评估当前环境中的威胁。\n\
  \n![](img/Note.png)\n**注意**：威胁评估并不总是完整的。列出所有潜在威胁将花费过的时间和精力。相反，目标是识别最可能的威胁。\n\n*威胁*是指代表任何可能危险的活动，包括任何可能对以下内容产生不利影响的情况或事件：\n\
  \n\n\n\n\n- **机密性**——机密性丢失源于数据的未经授权泄露。可以应用访问控制来确保只有特定用户才能访问数据，加密技术有助于保护机密性。\n- **完整性**——完整性丢失源于数据的修改或破坏。访问控制可以保护数据免受想要修改或破坏数据的恶意攻击者的侵害，而哈希技术通过检测数据是否被修改来验证完整性。\n\
  - **可用性**——可用性丢失源于在需要时对服务或系统的访问受限。各种容错策略可以确保即使发生停机，系统和服务业务也能继续运行，并且对数据进行备份，以确保在数据丢失或损坏时可以恢复。\n\
  \n当威胁与漏洞匹配时，就会产生风险。以下公式显示了风险、漏洞和威胁之间的关系：\n\n`Risk = Vulnerability × Threat`\n\n\
  `图 8-1` 显示了对组织的各种威胁。它们通常被归类为人为威胁或自然威胁。人为威胁可以是内部的、外部的、故意的或无意的。自然威胁源于天气或其他非人为事件。\n\
  \n![图 8-1 对组织的威胁。](img/9781284183719_CH08_FIGF01.png)\n\n**图 8-1** 对组织的威胁。\n\n外部攻击者可以是对网络发动拒绝服务（DoS）攻击的黑客；试图访问、修改或破坏组织数据的恶意软件编写者；甚至是对建筑或整个城市发动攻击的恐怖分子。\n\
  \n内部用户也可能造成损害。不满不满的员工可能会访问、修改或破坏组织的数据。如果不使用适当的访问控制，其他员工也可能访问、修改或破坏数据。虽然不满员工的行为是有目的为之，但普通员工的行为是意外的。\n\
  \n尽管恶意内部人员造成的损失一直是公司面临的最大威胁之一，但这一趋势正在发生逆转。根据 2020 年安永全球信息安全调查报告，约 59% 的组织在过去 12\
  \ 个月内面临过安全事件。同一调查显示，48% 的董事会认为与网络安全相关的攻击和泄露将在未来 12 个月对其业务产生中等以上的影响。遗憾的是，尽管 77% 的新计划支出侧重于风险和合规，但只有\
  \ 36% 的组织报告将网络安全纳入任何新业务倡议的规划中。\n\n### 减少内部威胁\n\n内部威胁会造成重大损害。某些内部威胁是意外的，另一些是恶意的。然而，如果对员工进行培训并控制其行为，就能减少大量的威胁。\n\
  \n常见的内部威胁包括：\n\n- **无意访问**——当用户访问他们不需要的数据时，数据就会面临风险，因为用户可能会意外删除数据或将数据分享给不应拥有权限的人。访问控制可以保护数据，包括确保身份验证过程安全，并执行最小权限和知情范围策略。\n\
  - **不满的前任员工**——当员工被解雇时，其用户账户应当被删除或禁用。如果两者都没有执行，离职员工可能能够访问相同的数据或系统，也可以将其凭据交给公司内部的其他人作为代理。未经授权的访问可能导致数据损坏或系统破坏。\n\
  - **应对钓鱼攻击**——钓鱼攻击试图诱导用户放弃信息或执行他们通常不会执行的操作。某些钓鱼邮件包含指向恶意网站的链接。如果用户点击链接，可能会无意中在他们的系统中安装恶意软件。更复杂的钓鱼尝试针对特定公司并欺骗用户。`鱼叉式钓鱼`\
  \ 是一种针对性的钓鱼尝试，看起来来自公司内部的成员。培训有助于用户识别这些攻击。\n- **转发病毒**——用户可能会在不知道危险的情况下打开受感染的邮件并转发给同事，或者从家用通用总线（USB）闪盘带来病毒。最新的杀病毒软件可以提供针对已知病毒的保护，培训帮助用户理解病毒是如何复制的，技术策略防止使用\
  \ USB 闪盘。\n- **笔记本电脑控制**——笔记本电脑很容易被盗。当用户没有对笔记本电脑进行物理控制时，电脑往往会消失，组织失去硬件和软件。此外，笔记本电脑上的数据遭到破解。培训用户笔记本电脑被盗的频率有助于他们理解保护这些设备的必要性。\n\
  - **高级持续性威胁 (APT)**——APT 是由犯罪分子或国家力量在长时间内实施的复杂网络攻击，旨在窃取数据或监控系统。犯罪分子或攻击者通常有明确的目标，他们花费时间和资源来识别他们想要窃取或破坏的资产的漏洞。鉴于其复杂程度，他们可以长时间不被发现。攻击方法可以采取恶意软件的形式，动机可能是财务、政治间谍活动或控制。例如包括钴\
  \ 集团对全球金融机构的攻击，包括对自动取款机（ATM）、卡片处理系统、支付系统和全球银行金融电报协会（SWIFT）系统的攻击。另一个例子是 Mythic Leopard\
  \ 对印度军的攻击，特别是通过假冒印度智库对中央调查局和印度军进行鱼叉式钓鱼攻击。\n\n自然威胁包括火灾和天气事件，如洪水、地震、龙风和雷暴。威胁评估的目标是识别威胁，可以通过审查历史数据和使用威胁建模来实现。\n\
  \n在识别威胁后，需要确定威胁发生的概率，因为某些威胁比其他威胁更容易发生。接下来，对威胁进行优先级排序。有时，可以将威胁与漏洞匹配以确定成本。然而，有时在不完成漏洞评估的情况下无法确定成本。威胁评估的最后一步提供一份列出发现的报告，并在威胁及其概率以及任何识别出的成本。\n\
  \n本节关于威胁评估的内容包括：\n\n- 识别威胁的技术\n在典型 IT 基础设施七个领域内威胁评估的最佳实践\n\n## 识别威胁的技术\n\n识别威胁主要使用两种技术：审查历史数据和进行威胁建模。选择哪种技术很大程度上取决于环境和可用材料，但两种技术也可以结合使用。\n\
  \n如果历史数据可用，审查这些数据通常是更容易的方法。历史数据提供了有关过去威胁的具体信息。然而，无法保证过去的威胁会重复，也无法保证出现新威胁。另一方面，威胁建模比审查历史数据更复杂，因为需要从更广泛的视角检查系统和服务，这可能耗费大量时间。\n\
  \n##### 审查历史数据\n\n确定存在哪些威胁的最佳方法之一是分析过去的事件。这些事件包括组织内部、类似组织以及当地发生的事件：\n\n\n\n\n\n\
  - **组织**——通过对过去事件的回顾可以揭示导致损失的威胁。\n- **相似组织**——相同业务领域的其他组织的事件可以揭示该组织可能面临的威胁。\n- **本地地区**——自然灾害和天气事件可能会再次发生在同一地区。\n\
  \n这些数据可以通过汇总记录和进行访谈来收集。可以从任何现有记录（包括安全记录、保险索赔和故障排除记录）汇总数据，以确定停机及其原因。可以与层层和其他进行访谈。管理层了解导致重大损失的特定威胁，而员工通常非常清楚问题所在以及威胁存在的位置。\n\
  \n## 组织的历史数据\n\n可以回顾组织的历史数据，以识别出由威胁导致的过去事件。过去的事件有多种形式，例如由于用户无意或恶意行为导致的问题，或来自外部攻击者或自然灾害的事件。\n\
  \n以下是由于威胁导致的过去事件示例：\n\n- **内部用户**——用户被授予了他们不需要的数据访问权限，或者他们偶然发现数据并与同事分享，导致机密数据未经授权泄露。\n\
  - **不满员工**——一名员工在周一因故被解雇，但他的账户没有被禁用或删除。该员工在周三访问了他的账户，并删除了大量数据。部分被删除的数据未备份，已永久丢失。\n\
  - **设备故障**——服务器在电压浪涌后崩溃，并一直处于宕机数小时，直到更换了电源。\n- **软件故障**——订单数据库应用程序在数据库服务器上崩溃，必须从头开始服务器。管理员重新安装了操作系统，然后重新安装了数据库应用程序。随后他们从备份中恢复了数据。此过程花费了超过\
  \ 10 小时，在此期间客户无法进行在线订单。\n- **数据丢失**——所有用户都被要求将数据存储在中央文件服务器上，数据每周每周日备份一次。文件服务器在周三崩溃，许多用户丢失了超过两天的工作。\n\
  - **攻击**——邮件服务器感染了病毒，病毒扩散到所有邮件用户的邮箱中。清理系统并将邮件服务恢复给用户大约需要两天才能完成。\n\n### ![](img/Tip.png)\
  \ 提示\n\n“按需原则”和“最小权限原则”规定，用户仅被授予执行其工作所需的访问权限。“按需原则”规定用户仅拥有他们需要的数据。“最小权限原则”规定用户仅拥有执行其工作所需的权利和权限。\n\
  \n这些示例每一个只显示了威胁，但本可以实施各种控制措施来防止威胁的发生。例如，如果用户访问他们不需要的数据，就可以实施最小权限原则和按需原则。然而，现阶段的目标仅仅是识别威胁。\n\
  \n## 相似组织的历史数据\n\n许多威胁对于相似组织来说是常见的。通过识别针对相似组织的威胁，可以识别特定组织可能面临的威胁。例如，攻击者喜欢攻击执法网站。年前，曾发生过许多此类网站被篡改的事件。然而，大多数执法机构现在意识到了这种威胁，并采取了额外措施来保护他们的网站。\n\
  \n任何拥有面向服务器的组织都面临类似的威胁。`Apache` 是一种流行的 Web 服务器产品，运行在 `UNIX`、`Linux` 和 `Microsoft`\
  \ 平台上。它通过互联网提供网页服务。任何托管 `Apache` 的公司都面临着与拥有面向服务器的公司相同的威胁。\n\n### ![](img/Note.png)\
  \ 注意\n\n攻击者通过更改内容来篡改网站。例如，用户看到的可能不是网站的主页，而是色情网站的主页。此外，攻击者经常会留下某种“名片”。在页面的某个地方，攻击者可能会包含类似于“hacked\
  \ by xxx”的文本。另一种变体是“p’wned by xxx”。`Pwn` 和 `p’wned` 是征服或被征服的俚语。句话说，攻击者在炫耀他们征服了网站。\n\
  \n## 本地数据\n\n本地地区的首要考虑因素是天气状况和自然灾害。如果一个地点位于海岸且该海岸过去发生过飓风，未来很可能再次发生飓风。如果一个地点位于洪水区，未来很可能发生洪水。\n\
  \n任何在该地区住过都知道自然威胁是什么。该地区的新人可以访谈员工或其他当地人，应该获得一个以上的视角，因为一个人的灾难可能是另一个人的轻微不便。不应仅根据轶事证据采取措施解决问题。\n\
  \n例如，当地员工可能住在洪泛区。他们可能会讲述洪水如何流入家中并摧毁一楼所有物品的恐怖故事。虽然这一事件对他们来说是可怕的，但它之前的发生并不意味着你的组织未来会发生洪水。这些信息应该与其他来源进行平衡，例如洪水区地图，它精确显示了可能发生洪水的区域。如果组织位于高地且不在洪泛区，则不需要采取措施保护其免受洪水。\n\
  \n## 执行威胁建模\n\n威胁建模比仅仅研究历史威胁数据要复杂得多。它是一个用于评估和记录应用程序或系统安全风险的过程。\n\n理想情况下，威胁建模在应用程序编写之前或系统部署之前进行。它在产品或服务的整个生命周期中都考虑安全性时进行。换句话说，如果只在项目结束时考虑安全性，往往会事不如人意。\n\
  \n使用威胁建模时，首先需要识别要评估的资产。资产管理有助于识别对组织重要的资产，包括它们的价值。然后可以采取步骤识别针对这些价值资产的威胁。\n\n威胁建模的关键部分是像攻击者一样思考，而不是像经理或管理员一样。在这种背景下，攻击者可以是外部攻击者或内部用户。内部用户并不一定具有恶意才是威胁。然而，如果内部用户具有意外伤害的可能性，结果是相同的。\n\
  \n执行威胁建模的一个很好的起点是使用典型基础设施的七个领域。这七个领域将在本节后面结合最佳实践介绍。\n\n在执行威胁建模时，应该询问以下关键问题：\n\n\
  - 什么系统需要保护？\n- 系统是否容易受到攻击？\n- 潜在的攻击者是谁？\n- 潜在攻击者可能会如何攻击？\n- 系统是否容易受到硬件或软件故障的影响？\n\
  - 用户是谁？\n- 内部用户可能会如何滥用系统？\n\n### 无线与 WEP\n\n有线等效隐私 (`WEP`) 是一个说明如果不在整个开发周期中考虑安全性，安全性将会缺缺的例子。在无线网络开发的早期，主要目标是确保设备能够轻松连接，这是一个巨大的成功。\n\
  \n\n\n\n在开发周期的后期，开发人员开始关注无线网络的安全性。他们提出了 `WEP`，旨在为无线网络提供与有线网络同等水平的安全保护，但实际上它远未达到预期目标。\n\
  \n`WEP` 存在多个漏洞，并且已经出现了可以对其进行破解的工具。最终，设计无线网络的团队不得不回到起点，重新设计安全方案。他们提出了 Wi-Fi 保护访问（`WPA`）作为过渡性解决方案，随后推出了\
  \ `WPA2` 作为永久性解决方案。\n\n如今，已经可以创建安全的无线网络了。然而，如果在无线网络生命周期的初始阶段使用了威胁建模技术，`WEP` 的问题可能永远不会发生。开发人员可能会在发布\
  \ `WEP` 之前就识别并修复这些漏洞。\n\n在进行威胁评估时，理解被评估的系统或应用程序至关重要。这种理解包括涉及哪些系统，以及数据如何流入和流出系统。如果对系统没有完全的理解，很难切换到攻击者的视角。理解一个系统通常需要对专家进行访谈并审查有关该系统的文档。\n\
  \n#### 与相似情况和活动的类比与比较\n\n执法人员（包括地方执法部门、FBI、CIA 和秘密勤务局）经常使用威胁评估。例如，每当当地警察接到犯罪现场的电话时，他们都会快速评估局势。例如，一位妻子打电话投诉她的丈夫在虐待她。警察知道这可能是一个暴力且易爆的现场，因为丈夫可能携带武器，或者妻子在意识到丈夫被捕时可能会对警察产生敌意。\n\
  \n同样，每当美国总统前往某地旅行时，秘密勤务局团队会先到达那里进行威胁评估。团队会评估总统将经过的每条路径并寻找潜在威胁。他们会访问目的地并对其进行评估。他们会考虑狙击和炸弹的可能性，评估员工（重点关注新员工），并调查任何线索。\n\
  \n#### 在典型 IT 基础设施七个领域内进行威胁评估的最佳实践\n\n确保所有威胁都得到解决的方法是使用典型 IT 基础设施的七个领域：用户域（`User\
  \ Domain`）、工作站域（`Workstation Domain`）、局域网域（`LAN Domain`）、局域网到广域网（`LAN-to-WAN Domain`）、广域网（`WAN\
  \ Domain`）、远程访问域（`Remote Access Domain`）以及系统/应用域（`System/Application Domain`）。`图\
  \ 8-2`\n\n**图 8-2** 典型 IT 基础设施的七个领域。\n\n有条理地遍历每一个领域并评估威胁，可以从不同的角度评估潜在威胁。以下是评估这些威胁时可以使用的一些最佳实践：\n\
  \n* 不做任何假设，承认事物是在发生变化的。\n* 验证系统是否按预期运行并受控。\n* 每次将评估范围限制在单一领域内。\n* 使用文档和流程图来理解被评估的系统。\n\
  * 识别被评估领域所有可能的入口点。\n* 考虑对机密性、完整性和可用性的威胁。\n* 考虑内部和人为威胁。\n* 考虑自然威胁。\n\n## 漏洞评估\n\n\
  进行漏洞评估是为了识别组织内部的漏洞。漏洞是 IT 基础设施中的任何弱点。它们可能存在于特定的服务器、整个网络或人员身上。\n\n例如，单个 Web 服务器可能受到缓冲区溢出攻击。例如，在\
  \ 5 月发现了一个缓冲区溢出漏洞。如果 Web 服务器直到 7 月才打补丁，那么它在 5 月到 7 月之间将一直处于脆弱状态。\n\n#### ![](img/Note.png)备注\n\
  \n缓冲区溢出攻击发生在攻击者发送比系统或应用程序预期更多或不同的数据时。缓冲区溢出漏洞通过更新或补丁修复。如果服务器不打补丁，漏洞就会存在。\n\n如果未实施访问控制，整个网络都可能是脆弱的。例如，如果授予所有用户相同的网络权限和许可，则不存在访问控制。网络上的所有数据都可能面临未经授权披露的风险。然而，可以使用管理模型来实现访问控制。最小权限原则和知情原则确保用户仅拥有他们所需的访问权限，而更多。\n\
  \n如果人员不理解安全的价值，他们身上就会存在漏洞。社会工程 策略会欺骗人们泄露敏感信息或采取不安全的行动。如果用户不理解安全实践的价值，他们就更容易被欺骗。例如，一名员工可能会接到一个电话，内容如下：“你好，我是\
  \ IT 部的 Joe。我们正在进行系统升级，发现你的用户账户有问题。为了修复这个问题并确保你不丢失任何数据，我们需要从服务器登录你的账户。你能把用户名和密码留给我吗？”\n\
  \n当然，Joe 并不是在 IT 部门工作。他是一个罪犯，试图让用户泄露用户名和密码。如果用户经常向管理员提供密码，这种计谋将很容易成功；但如果他们被告诉永远不要提供密码，可能就不会得逞。\n\
  \n执行漏洞评估是为了检查是否存在任何此类漏洞，而且某些评估的频率会比其他更频繁。\n\n#### 参考信息\n\n员工绝不向任何人泄露密码，包括回复可能为钓鱼尝试的电子邮件，以及通过电话或面对提出的可能是社会工程攻击的请求。当一个组织开始破例时（例如告诉用户向\
  \ IT 部门的人员提供密码是可以的），用户就会感到困惑。他们可能会认为钓鱼尝试或社会工程攻击是另一种例外。对系统的自动化漏洞扫描通常执行得很频繁，可以使用工具每周进行一次。审计可以每年进行一次，以查看安全措施是否按预期使用。例如，年度审计可以检测访问控制是否仍按预期使用。此外，可以每年进行测试，以查看人员如何对社会工程策略做出反应。\n\
  \n\n\n\n\n如果可能，拥有该系统或负责其安全的人员不应执行评估。如果相关人员在让系统看起来良好方面有利益关系，那么保持客观观点将变得困难。沉浸在系统的细节中也会使客观性难以维持，并阻碍以全新的眼光评估漏洞。\n\
  \n获得执行任何漏洞评估的许可始终非常重要，并且应该以书面形式进行。安全专业人员通常将此书面文件称为“免死牌”合同，它应该由职位足够高的人员签署以示负责。虽然大多数漏洞评估是非侵入性的，不会影响运行，但某些漏洞评估方法可能会导致系统崩溃或模拟拒绝服务（DoS）攻击。\n\
  \n关于漏洞评估的本章节包含以下主题：\n\n* 文档审查\n* 系统日志、审计跟踪以及入侵检测与防御系统输出的审查\n* 漏洞扫描和其他评估工具\n* 审计和人员访谈\n\
  * 过程分析和输出分析\n* 系统测试\n* 在典型 IT 基础设施的七个领域内执行漏洞评估的最佳实践\n\n## 文档审查\n\n执行漏洞评估时可以采取的步骤之一是审查来自多个源的可用文档，包括：\n\
  \n* **事件**——如果发生过任何安全事件，应审查该事件的文档。通常，事件的原因与漏洞直接相关。例如，针对面向互联网的服务器的成功缓冲区溢出攻击可能导致恶意软件感染，这可能表明系统更新频率不够。\n\
  * **停机报告**——可以对任何影响业务任务的停机事件进行调查。如果停机影响了业务利润，可能就能识别出漏洞。\n* **评估报告**——应该审查过去的评估报告，以识别常见问题和尚未修正的问题。\n\
  \n## 系统日志、审计跟踪以及入侵检测与防御系统输出的审查\n\n除了审查过去的评估报告，还可以审查其他信息来确定漏洞。三个常见信息源是系统日志、审计跟踪和入侵检测系统（IDSS）。审查这些内容没有特定的顺序。但是，如果网络中有可用数据，则应对所有数据进行审查。\n\
  \n### 系统日志\n\n所有计算机系统都有某种类型的系统日志。这些日志在不同的操作系统中具有不同的名称，但总体目的相同。它们根据系统正在执行的操作记录数据。\n\
  \n例如，Microsoft Windows 系统有一个名为 `System` 的日志。该日志使用 `Windows 事件查看器` 查看。`System` 日志记录系统事件，例如系统和服务的启动或停止，以及错误、警告和信息事件。\n\
  \n通过审查系统日志可以确定系统中正在发生什么。某些事件（如警告和错误）会脱颖而出，表明存在明显的问题。其他事件则需要更多的分析来识别趋势。\n\n### 审计跟踪\n\
  \n`审计跟踪`（audit trail）是记录在一个或多个日志中的系列事件，统称为审计日志，但审计跟踪可以记录在许多类型的日志中。例如，Microsoft Windows\
  \ 包含一个记录可审计事件的 `Security`（安全）日志。此外，安全应用程序（如防火墙）也会记录可审计事件。\n\n任何类型的审计日志都尝试记录至少关于谁、何事、何时以及何地的信息。如果用户已登录，将使用凭据来识别是谁访问了数据。对于某些日志（如防火墙日志），“谁”可能是源的\
  \ Internet 协议（IP）地址而不是用户名。\n\n可审计事件是任何需要跟踪的事件，例如谁访问了某个文件夹。可以启用文件夹审计，这样每次有人访问文件夹内的任何文件时，访问记录都会被记录。事件将包括用户名、访问了什么文件、访问时间以及访问时的服务器或计算机。\n\
  \n许多组织拥有可以审查审计跟踪的自动化系统。自动化系统能够检查来自多个源的日志。有时，这些系统与 IDS 结合使用，IDS 可以审查事件以检测入侵。\n\n\
  ### 注意\n\n虽然入侵检测系统（IDS）和入侵防御系统（IPS）通常被称为入侵检测与防御系统（IDPS），但它们之间存在些不同。IDS 分析并监控网络流量，而\
  \ IPS 则防止并控制网络数据包进入网络。IPS 像防火墙一样部署在网上，位于内部网络和外界之间。\n\n### 入侵检测与防御系统输出\n\n入侵检测与防御系统（IDPS）能够监控网络或系统、捕获流量并在检测到入侵时发送警报。基于主机的\
  \ IDS 安装在单个系统上。基于网络的 IDS 在整个网络中安装了多个监控代理，并向中央服务器报告。基于特征的 IDS 根据已知的恶意攻击序列或模式检测攻击。基于异常的\
  \ IDS 采用机器学习算法检测未知的恶意软件攻击。`FIGURE 8-3` 显示了一个在网络上安装了三个监控代理的基于网络的 IDS 示例。\n\n![FIGURE\
  \ 8-3 网络型入侵检测系统。](img/9781284183719_CH08_FIGF03.png)\n\n**图 8-3** 网络型入侵检测系统。\n\n\
  一个监控代理位于互联网侧，一个位于非军事化区（DMZ），另一个位于内部网络。检查 IDS 输出将揭示几个关键点。这三个代理协同工作，识别针对网络的攻击类型，并对不同缓解技术的成功提供见解。\n\
  \n代理 1 的事件显示了从互联网向网络发起了多少攻击。代理 2 的事件识别了能够穿透外部防火墙的攻击，显示了防火墙对特定类型攻击的有效性，并有助于发现 DMZ\
  \ 中任何面向服务器的漏洞。代理 3 显示了能够穿透 DMZ 第二道防火墙的攻击。这些针对内部网络的攻击如果不加处理，可能会造成巨大损害。\n\n尽管图 8-3\
  \ 的重点是来自互联网的攻击，但内部攻击也是可能的。内部网络上的网络代理负责监控内部攻击。在内部网络安装多个内部代理进行监控是常见做法。\n\n内部攻击并不一定来自恶意用户。它们通常来自感染了网络中一个或多个系统的恶意软件。然而，基于\
  \ IDS 的优势是可以尽早发现感染。\n\n## 漏洞扫描和其他评估工具\n\n有很多工具可以在网络内执行漏洞扫描。一些常用的工具包括 `Nmap`、`Nessus`、`SATAN`\
  \ 和 `SAINT`。\n\n* **识别漏洞**——它们提供了一种快速简单识别漏洞的方法。运行扫描后对报告进行分析。\n\n\n\n\n\n- **扫描系统与网络**：漏洞扫描器可以检查并检测网络以及单个主机上的问题；根据主机上安装的操作系统、应用程序和服务来检测漏洞；并检测网络上的开放端口和访问点。\n\
  - **提供指标**：管理的一个关键部分是衡量。如果某件事可以被衡量，就可以识别其进度，漏洞情况也是如此。在开始运行定期漏洞扫描之初，扫描可能会发现许多漏洞。六个月后，如果对指标进行分析，分析结果应该显示问题显著减少。如果问题没有减少，则涉及其他问题。如果在第一次扫描六个月后仍然存在所有相同的漏洞，说明这些漏洞没有得到修复。\n\
  - **结果记录**：生成的文档为内部合规报告提供输入。扫描器报告可用于证明符合不同的法律法规。\n\n漏洞扫描器确实有其局限性。首先，它们必须定期更新，因为威胁和系统在不断变化。因此，扫描也必须随之改变，以确保它们同时寻找过去和当前的漏洞。\n\
  \n其次，许多扫描器具有高误报率。换句话说，它们会错误地指示漏洞的存在。虽然这可能令人厌恼，但从安全的角度来看是合理的。如果存在错误可能，扫描器宁愿产生过多的警告也不要漏掉。以下是两个例子：\n\
  \n- 系统存在漏洞，但扫描没有检测到。这种情况可能发生在低误报率的情况下。\n- 系统不存在漏洞，但扫描不断识别出漏洞。这种情况可能发生在高误报率的情况下。\n\
  \n### ![](img/Tip.png) 提示\n\n在购买漏洞评估扫描器时，注意扫描器的更新频率很重要。不定期更新的扫描器可能在短时间内有用，而定期更新的扫描器可能值得投入额外的费用。\n\
  \n大多数安全专业人员希望避免第一种情况。他们不希望自己的系统存在未报告的漏洞。\n\n最后，某些扫描器会产生大量的网络流量，如果网络已经繁忙，可能会干扰正常运行。\n\
  \n#### 审计与人员访谈\n\n执行`审计`是为了检查对规则和指南的合规性。漏洞评估审计专门检查组织对现有内部政策的合规情况。\n\n例如，一个组织可能有一项关于离职员工的政策。政策可能规定，如果员工离开公司，应立即禁用用户账户，并在六个月后删除。\n\
  \n审计决定是否遵守了该政策。如果审计人员具备脚本技能，审计可以是快速且自动的。审计人员可以编写一个脚本来检查过去 15 天内未使用的启用账户。然后与人力资源部门核对输出结果，以确定这些用户是否仍在使用职。可以使用类似的脚本来确定是否存在过去六个月内未使用的账户。\n\
  \n可以通过完成人员访谈来获得对可能的新问题的见解。例如，可以询问人员他们认为哪些是当前的漏洞。通常，员工知道问题在哪里，但他们没有被询问。\n\n此外，可以对人员进行访谈以识别他们的安全知识。例如，可以询问员工在什么时候提供密码是许可的。一个安全的组织将有一项政策，规定用户绝不向任何人泄露密码。\n\
  \n#### 过程分析与输出分析\n\n某些系统执行过程分析，以确定其流程中是否存在漏洞。换句话说，不仅是查看输出，而是评估确定输出的流程。另一方面，输出分析是通过检查输出结果来确定是否存在漏洞。\n\
  \n这两种分析没有优优优劣。然而，在某些情况下，一种比另一种更好。例如，防火墙的有效性可能令人担忧。防火墙使用规则来确定是否允许流量。可以使用过程分析或输出分析来确定防火墙的有效性。\n\
  \n`图 8-4` 显示防火墙正在阻止和允许进出网络的流量。过程分析需要审查所有规则，以确定它们是否提供了所需的安全性。输出分析则检查防火墙的输入和输出，以确定只有所需的流量通过防火墙。\n\
  \n![图 8-4 防火墙控制网络流量。](img/9781284183719_CH08_FIGF04.png)\n\n**图 8-4** 防火墙控制网络流量。\n\
  \n如果防火墙只有五条规则，过程分析将完成得很容易。然而，如果防火墙有 100 条规则，执行输出分析可能会更容易。\n\n## 系统测试\n\n系统测试用于测试单个系统的漏洞。这些系统包括单个服务器和单个终端用户系统。在系统上进行的主要测试与补丁和更新有关，因为大多数漏洞是由于补丁解决的\
  \ bug 引起的。例如，一家公司可能有一组运行 `Microsoft Windows Server 2012` 的服务器。自安装以来，这些服务器已发布了多个补丁和更新。系统测试查询服务器以确定它们是否已更新到最新状态。\n\
  \n系统测试可以使用传统的管理工具、漏洞评估工具或两者进行。微软包含了传统工具，如 `Windows Server Update Services (WSUS)`\
  \ 和 `System Center 2012 Configuration Manager (ConfigMgr)`。这些服务器产品每一个都可以查询网络中的系统并确保它们拥有所有适当的更新。如果系统没有更新，`WSUS`\
  \ 或 `ConfigMgr` 可以将更新推送到系统并双检确保其已安装。例如，微软安全公告 `MS14-011` 识别了 `Microsoft Windows`\
  \ 中 `VBScript` 脚本引擎的一个严重漏洞。如果用户访问了特制的网站，该漏洞可能允许远程代码执行。远程代码可以安装恶意软件。有关该漏洞的信息可以在 http://go.microsoft.com/fwlink/?LinkID=391023\
  \ 获取。\n\n微软已为所有受影响系统发布了更新。任何没有 `MS14-011` 更新的系统都是漏洞。`WSUS` 和 `ConfigMgr` 可用于检查客户端漏洞并部署适当的更新。\n\
  \n作为额外的检查，漏洞评估工具可以验证系统是否有适当的更新，但大多数工具并不部署更新。\n\n##### 功能测试\n\n功能测试主要用于软件开发。它有助于确保产品满足为产品定义的功能需求或规格。软件开发中发生的问题之一是范围蔓延，即添加了最初计划之外的功能。换句话说，这些插件超出了原始产品规格的范围。虽然这在表面看起来很好，但它增加了安全问题。\n\
  \n\n\n\n应用程序中添加的每一行额外代码都代表一个潜在的漏洞。如果增加了额外的功能，就需要对其进行测试。如果在没有记录的情况下添加了这些功能，它们极不太可能被测试。\n\
  \n当按照原始功能开发应用程序时，功能测试可确保应用程序按预期工作。功能测试通常包括尝试开发应用程序。\n\n边界测试是一种通常可以检测潜在缓冲区溢出错误的技术。例如，如果期望输入在\
  \ 1 到 100 之间，边界测试会在边界处输入数字。`0` 和 `1` 位于范围的起始边界。`100` 和 `101` 位于范围的外边界。\n\n## 访问控制测试\n\
  \n访问控制测试验证用户的权利和权限。`right`（权利）授予在系统上执行某操作的权限，例如重启系统。`permission`（权限）授予对资源的访问，例如文件或打印机。\n\
  \n大多数组织都建立了管理模型，规定了授予普通用户的权利和权限。这些模型确保用户拥有完成工作所需的权限，但不会更多。它们有助于支持“最小特权”和“知其所需”的安全原则。\n\
  \n在图 8-5 中，公司某些只有销售人员才能访问的资源，以及其他只有 IT 部门人员才能访问的资源。访问限制通过将员工放入相应的组并为组分配权限来实施。\n\n\
  ![图 8-5 应用于用户的访问控制。](img/9781284183719_CH08_FIGF05.png)\n\n**图 8-5** 应用于用户的访问控制。\n\
  \n销售组的所有成员自动获得访问销售资源的权限，IT 组的所有成员也自动获得访问 IT 资源的权限。销售组的成员无法访问 IT 部门资源，IT 组的成员也无法访问销售部门资源。\n\
  \n同样，组织内只有特定用户应该拥有系统的管理权限。尽管从可用性的角度来看，赋予每个人管理访问权限会更容易实现，但这样做会牺牲安全性。通过赋予所有用户执行任何操作的权利违反了“最小特权”原则，通过授予所有用户访问组织内所有数据的权限违反了“知其所需”原则。\n\
  \n是安全性还是可用性？\n\n一家公司在短时间内经历了爆炸式增长，现在面临着一些基础的技术挑战。公司只有一名管理员管理整个网络。尽管在公司规模较小时，这名管理员管理网络得很好，但现在他被公司的增长搞得应接不暇。\n\
  \n他面临着两个竞争目标：安全性和可用。用户请求更改其权利和权限的情况越来越频繁。他理解权利和权限确保用户仅拥有完成工作所需的权限。他也理解“最小特权”和“知其所需”原则的价值。他并没有仅仅进行更改，而是尝试调查这种需求。这些延迟导致了向经理的投诉。\n\
  \n管理员向经理表示他需要额外的帮助。他还试图向经理解释访问控制的目的。遗憾的是，他没有获得任何额外的帮助。经理强调，他不想再听到任何需要额外访问权限的用户提出的投诉。\n\
  \n在这种情况下，经理关注的是可用性，而管理员关注的是安全性。然而，经理是老板，所以经理说了算。\n\n发生了两件事。第一，管理员将所有用户都添加到管理员账户，这确保了所有用户将始终能够访问他们需要的任何内容。这也确保了经理不会再收到任何关于访问控制的投诉。第二，管理员开始寻找新工作，因为他理解这些变化导致问题只是时间问题。至少，它们将导致机密性的丢失。\n\
  \n访问控制测试验证用户是否获得了执行工作所需的权利和权限，且不再更多。它确保管理模型按照其设计的方式使用。\n\n## 渗透测试\n\n渗透测试尝试利用漏洞。它验证了控制或防御措施的有效性。换句话说，在发现漏洞后实施了控制措施，然后进行渗透测试。\n\
  \n渗透测试比漏洞评估测试更具侵入性。具体来说，如果渗透测试成功，可能会导致系统崩溃。考虑到这一点，执行渗透测试时需要非常谨慎。\n\n## 事务与应用程序测试\n\
  \n事务和应用程序测试确保应用程序与后端数据库正常工作。\n\n数据库中的事务是一组语句，它们要么全部成功，要么全部失败。如果任何一个语句失败，整个事务就会失败。\n\
  \n例如，一位女士从 ATM 提取 `$100`。ATM 检查她的账户并确认有资金。然后从她的账户中扣除金额并给她钱。一旦她拿到钱，ATM 认为事务已完成并提交事务，使其生效。然而，如果\
  \ ATM 在给她钱之前断电，ATM 就不会提交事务。该扣款会被识别为未完成事务的一部分，并被回滚。事务测试确保事务按预期运行。\n\n### ![](img/Note.png)NOTE\n\
  \n渗透测试也被称为利用测试。利用测试将在本章中稍后探讨。\n\n应用程序测试用于确保应用程序按预期与后端数据库交互。与后端数据库交互的前端应用程序的一个已知漏洞是\
  \ SQL 注入。有很多工具可以对系统进行 SQL 注入测试。\n\n### ![](img/Note.png)NOTE\n\n在 SQL 注入攻击中，攻击者可以在未经授权读取数据库的部分或整个数据库。SQL\
  \ 注入攻击还可修改数据库中的数据。\n\n\n\n\n*   **确保扫描器保持更新**——漏洞扫描器需要定期更新，这与杀毒软件需要更新病毒定义是相似的。一个不保持更新的杀毒程序仅比完全不安装杀毒程序好一点点，漏洞扫描器也是如此。\n\
  \n*   **执行内部和外部检查**——攻击可能来自内部和外部源，因此应该分别从内部和外部位置进行漏洞评估。检查防火墙后的漏洞；防火墙外的漏洞；以及在有 DMZ\
  \ 的情况下从互联网到 DMZ 的漏洞。\n\n*   **记录结果**——每次漏洞评估的结果都应该记录在案。这些文档可以有多种用途。可以将旧结果与当前结果进行比较以跟踪进度。某些漏洞评估可以用于记录对法律法规的合规性。\n\
  \n*   **提供报告**——汇总重要发现并提供建议的报告提交给管理层。\n\n### 漏洞评估报告\n\n虽然在完成漏洞评估报告时没有必须使用的标准格式，但大多数报告都包含共同信息。在漏洞评估报告中应考虑包含以下信息：\n\
  \n*   **目录**——如果报告很长，应该包含目录，以便读者查找相关信息。\n\n*   **执行摘要**——执行摘要是报告的简要总结。执行摘要通常限制在一页以内，或者对于大型报告，占文档总长度的\
  \ 10%。\n\n*   **方法**——此节识别了使用了哪些工具进行评估。它应该包含足够的细节，以便其他人能够重现结果。同一个人可能在六个月后执行相同的评估，此部分将帮助确保他或执行的是相同的测试。\n\
  \n*   **结果**——此节识别了评估结果。它列出了发现的漏洞。尽可能，此部分还应该包含对漏洞利用概率的估计。\n\n*   **建议**——某些漏洞应该被缓解，而另一些可以被忽略。建议部分识别了哪些漏洞是严重的，哪些是次要的。如果可用，还可以包含控制措施。\n\
  \n### 利用评估\n\n利用评估尝试利用漏洞。换句话说，它们模拟了攻击以确定攻击是否能够成功。利用测试通常从漏洞测试开始以确定漏洞，然后是尝试利用这些漏洞。\n\
  \n许多大型组织拥有专门的安全团队来执行利用评估。另一些组织则聘请外部专业人士。这些人员将近 100% 的工作时间用于学习漏洞和利用。他们学习如何识别漏洞以及如何利用它们。他们还学习保护组织免受利用所需的措施。\n\
  \n除非某人是专注于漏洞和利用评估的安全专业人士，否则他们不会拥有这些团队的详细知识。然而，无论某担任 IT 专业人士还是 IT 管理，都应该理解基础知识。\n\
