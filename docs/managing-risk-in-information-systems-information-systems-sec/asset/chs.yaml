  \n### 事件的增长\n\n1988 年 11 月，当莫里斯虫袭击时，互联网上遭受受攻击的计算机成为了新闻焦点。卡内梅隆大学（CMU）建立了 CERT 以此应对，并开始统计事件数量。\n\
