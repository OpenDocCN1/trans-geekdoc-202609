  \n© Sai Chan/Shutterstock\n\n# 第 5 章：定义风险评估方法\n\n进行**风险评估**是为了识别最严重的风险。风险管理技术包括避免、共享或转移、缓解或接受风险。风险评估允许对风险进行优先级排序。高优先级风险将得到管理，而低优先级风险将被接受。风险评估还有助于识别控制风险的最佳方法，有助于确保购买的控制措施能够提供最大的益处。\n\
  \n创建风险评估主要有两种方法：定量分析和定性分析。定量方法可以使用预定义的公式。例如，年化预期损失（`ALE`）可以通过年度发生率（`ARO`）乘以单次损失预期（`SLE`）来计算，表达式为\
  \ `ALE = ARO × SLE`。也可以使用定性方法。在定性方法中，会对风险发生的概率以及风险发生后的影响分配数值或词汇。理解这两种方法都非常重要，以便将它们应用于不同的场景。\n\
  \n### 第 5 章主题\n\n本章涵盖了以下主题和概念：\n\n* 什么是风险评估\n* 风险评估的关键组成部分是什么\n* 有哪些类型的风险评估\n* 应该解决哪些风险评估挑战\n\
  * 风险评估的最佳实践是什么\n\n### 第 5 章目标\n\n完成本章后，你将能够：\n\n* 定义风险评估\n* 描述风险评估的重要性\n* 解释何时应该进行风险评估\n\
  * 解释风险评估的目的和风险评估范围\n* 解释识别风险评估关键区域的含义\n* 识别风险评估的主要类型\n* 描述定量和定性风险评估的要素\n* 识别定量和定性风险评估之间的差异\n\
  * 识别定量和定性风险评估的优点和局限性\n* 列出风险评估的挑战\n* 描述数据一致性和不确定性水平的使用\n* 识别如何为风险评估提供有用的结果\n* 列出与风险评估相关的最佳实践\n\
  \n### 理解风险评估\n\n风险评估也称为`risk analysis`，是一个用于识别和评估风险的过程。然后根据重要性或影响严重程度对风险进行量化。随后对这些风险进行优先级排序。\n\
  \n风险评估是整体风险管理计划的重要部分。它们有助于识别哪些风险是最重要的。风险评估与风险管理计划之间的主要区别在于，风险评估是针对特定时刻创建的，而风险管理计划是一个持续的过程。\n\
  \n风险评估有助于识别实施哪些保护措施。`Safeguards](#29_glossary.xhtml#gloss158)`也被称为控制。它们被用于控制或减少风险。控制措施可以减少漏洞或减少威胁的影响。无论何种方式，控制措施都会降低风险。\n\
  \n所有公司的资金都是有限的。虽然安全专家可能不断希望在安全上投入更多资金，但这是有限的。如果在安全上花费过多，将影响公司的利润和健康。多少才算过多？限在哪里？风险评估可以帮助决定在哪里划分界限。\n\
  \n### 注意\n\n公司必须考虑盈利和生存能力。风险评估有助于公司在这两个目标之间保持适当平衡。\n\n例如，一家公司通过多年的研究收集了数据。该公司同样的数据可以识别下周食堂将供应什么食物。如果安全资金被优先考虑，哪种数据将获得更多资金？当然是研究数据。在例例中识别优先级很容易，但情况并不总是如此。\n\
  \n### 注意\n\n`HIPAA`管辖健康数据的控制。`SOX`管辖财务数据的准确性。\n\n现在，在这个例子中，同一家公司持有受《健康保险流通与责任法案》（`HIPAA`）和《萨班斯-奥克斯法案》（`SOX`）法律法规涵盖的数据。哪些数据更重要？哪些数据应该具有更高的保护优先级？应该实施哪些控制措施来保护数据？这些问题并不容易回答。针对\
  \ `HIPAA` 和 `SOX` 数据的风险评估可以帮助回答这些问题。\n\n## 风险评估的重要性\n\n风险评估是风险管理过程的重要部分。没有风险评估，确定哪些系统应该受到保护将变得困难，且如何保护它们仍然不明确。然而，风险评估将有助于识别需要保护的最重要系统，并对哪些控制措施将提供最大价值提供见解。\n\
  \n在以下情况下完成风险评估：\n\n* **评估风险时**——风险评估是整体风险管理过程的一部分。在任何使用风险管理的时候它们都是有用的，特别是当需要对风险进行优先级排序时。\n\
  * **评估控制措施时**——风险评估可以评估控制措施的有效性。经理无法批准所有的控制措施。风险评估帮助经理决定采用哪些控制措施。\n* **在实施控制措施后定期进行**——风险评估是一个性文档。然而，风险并不是静止的。攻击者在不断升级他们的技术和战术。在实施控制措施后，应定期安排风险评估。目标是确定该控制措施是否仍然有效。\n\
  \n## 风险评估的目的\n\n风险评估是协助管理的重要工具。它们帮助管理层量化风险并识别和评估控制措施的有效。风险评估倾向于：\n\n* **支持决策**——风险评估对风险进行优先级排序，有助于决策者确定哪些风险应该减少。提醒一下，并不是所有风险都必须减少。风险可以被避免、共享或转移、缓解或接受。高优先级风险应该被缓解，但低优先级风险可能被接受。\n\
  * **评估控制有效性**——实施控制措施是为了减少风险。风险评估提供了特定控制措施对特定风险的有效性的见解。\n\n开发风险评估涉及许多步骤。这不是一个一次坐好、一天、甚至一周就能完成的任务。当执行得当时，开发风险评估涉及几位关键参与者的投入。开发风险评估的步骤如下：\n\
  \n1. **识别威胁和漏洞**——当威胁利用漏洞时就会损失。如果组织识别了可能的威胁和漏洞，就可以减少损失。\n2. **识别风险发生的概率**——这一过程可以基于历史数据或意见。例如，某风险在过去三年中平均发生四次。如果不采取任何措施来减少风险，它明年可能还会发生四次。如果没有可用历史数据，专家可以对风险发生的概率提供意见。\n\
  3. **识别资产价值**——资产的价值有助于确定风险的影响。资产可以是硬件、软件或数据。某些风险可能会影响这三者。\n\n\n\n\n\n## 4. 确定风险的影响\n\
  此过程也可以基于历史数据或意见。例如，在过去的三年中，某项风险导致了平均每年 20,000 美元的损失。如果不采取措施来降低该风险，明年可能会导致约 20,000\
  \ 美元的损失。如果没有可用的历史数据，专家可以风险发生的影响提供意见。\n\n## 5. 确定保护措施或控制措施的有效性\n保护措施或控制措施可以降低风险或风险的影响。某些控制措施会比其他措施更有效。风险评估有助于确定实施哪些措施。\n\
  \n风险评估识别了针对当前系统的威胁和漏洞。它假设当前的控制措施正在按预期工作。另一种说法是，风险评估是根据当前状况在某一时间点进行的评估，而风险管理是一个持续的过程。\n\
  \n## 风险评估的关键组件\n\n在风险评估过程的早期，应该完成三个关键步骤。这些步骤识别了风险评估的主要组件，并将直接影响其成功败。这些步骤是：\n\n*\
  \ 识别范围\n* 识别关键区域\n* 识别团队成员\n\n接下来的章节将深入探讨这些步骤中的每一个。\n\n### 识别范围\n\n范围确定了风险评估的边界。当参与者理解范围时，他们就不太可能改变它。识别风险评估范围有助于使其保持在正轨上。相比之下，不受控制会导致范围蔓延。范围蔓延会导致成本超支和错过截止日期。\n\
  \n例如，`图 5-1`显示了网络中配置的 Web 服务器。该服务器托管一个可以通过互联网访问的网站。客户可以访问该网站并购买产品。Web 服务器托管网站应用程序。后端数据库服务器托管数据。\n\
  \n![FIGURE 5-1 包含 Web 和数据库服务器的网络图。](img/9781284183719_CH05_FIGF01.png)\n\n`FIGURE\
  \ 5-1` 包含 Web 和数据库服务器的网络图。\n\n范围可以设定为仅关注 Web 服务器。或者，范围也可以包含 Web 服务器和数据库服务器。非军事区\
  \ (`DMZ`) 中的两个防火墙也可以包含在内。\n\nWeb 服务器在过去一年遭到多次攻击。其中一些攻击导致网站崩溃或 Web 服务器故障。然而，现有的控制措施保护了数据库服务器上的数据，数据没有被不当访问或丢失。在这个示例中，数据库服务器可能未包含在内。此外，包含数据库服务器也可以为了确保现有的控制措施能够防止当前风险。\n\
  \n在范围中包含或排除哪些内容没有对错之分。管理层最终将决定范围内包含什么。最的一点是做出选择。\n\n### 识别关键区域\n\n风险评估还识别了应该包含的关键区域。识别这些关键区域有助于风险评估团队关注重要事项。例如，范围可以包含一个\
  \ Web 服务器、数据库服务器和一个防火墙。然后风险评估可以识别出以下关键区域：\n\n* **Web 服务器—** 处理 Web 服务器的所有元素，包括硬件、操作系统和网站应用程序。对于硬件，任何单点故障都可能是问题。\n\
  * **数据库服务器—** 数据库服务器托管数据。\n* **防火墙—** 防火墙保护网络。\n\n### 识别团队成员\n\n风险评估人员不应是负责纠缺陷的同一人员，这有助于避免利益冲突。例如，管理员负责在\
  \ Web 服务器上实施控制措施。他或她的意见可能会因为其实施控制措施的愿望而产生偏差。如果由第三方提供意见，更有可能获得准确、客观的数据。\n\n无论如何，都应该从负责部门获取意见。其员工可能对问题以及如何解决这些问题非常有见解。\n\
  \n### 风险评估的类型\n\n在考虑风险评估时，必须首先确定使用哪种方法。IT 使用的两种主要方法是：\n\n* **定量**——定量方法是客观的。它使用数字，例如实际美元价值。定量风险评估需要大量数据。收集这些数据通常需要时间。如果数据可用，这种类型的风险评估变成了使用公式的简单数学问题。\n\
  * **定性**——定性方法是主观的。它基于专家意见的相对值。专家对风险的概率和影响提供意见。定性风险评估使用词汇，如*低*、*中*和*高*，而不是数字。它可以相对快速地完成。\n\
  \n\n\n\n\n# 简介\n定量风险评估 使用数字（如美元金额）。收集数据并将其输入标准公式中。评估结果可以帮助识别风险的优先级。结果还可以用于确定控制措施的有效性。\n\
  \n与定量风险评估相关的关键术语包括：\n\n- `Single loss expectancy`（单损失预期）——单次事件预期的总损失是单损失预期 (SLE)。当威胁利用漏洞时，就会发生事件。损失以美元金额表示，例如\
  \ 5,000 美元。损失的美元价值包含了硬件、软件和数据的价值。资产价值 (`AV`) 乘以暴露因子 (EF) 等于 `SLE`。`EF` 描述了由于威胁导致资产遭受的损失，以百分比表示。因此，`SLE\
  \ = AV × EF`。例如，如果 `AV` 为 10,000 美元且 `EF` 为 0.5（即对威胁的暴露度为 50%），则 `SLE` 为 5,000 美元。\n\
  \n- `Annual rate of occurrence (ARO)`（年度发生率）——一年内预期事件发生的次数是年度发生率 (ARO)。如果过去一年中事件每月发生一次，则\
  \ `ARO` 为 12。在假设不发生变化的情况下，事件在明年发生 12 次是有可能的。\n\n- `Annual loss expectancy`（年度预期损失）——一年的预期损失是年度预期损失\
  \ (ALE)。`ALE` 通过 `SLE × ARO` 相乘得出。由于 `SLE` 以美元金额形式给出，因此 `ALE` 也是以美元金额给出。例如，如果 `SLE`\
  \ 为 5,000 美元且 `ARO` 为 12，则 `ALE` 为 60,000 美元。\n\n- `Safeguard value`（保护价值）——控制措施的成本是保护价值。控制措施用于降低风险。例如，防病毒软件每台电脑的平均成本可能是\
  \ 50 美元。因此，100 台电脑的保护价值为 5,000 美元。\n\n在这种场景下，公司向员工发放笔记本电脑。每台笔记本的价值为 2,000 美元，包括硬件、软件和数据。任何时候都有约\
  \ 100 台笔记本正在使用。在过去的两年里，公司平均每个季度丢失笔记本。这些笔记本是在系统被无人看管时被盗的。根据这些信息可以回答以下问题：\n\n- `SLE`\
  \ 是多少？\n- `ARO` 是多少？\n- `ALE` 是多少？\n\n### TIP ![](img/Tip.png)提示\n理解用于 (ISC)² 系统安全认证从业人员\
  \ (SSCP) 和注册信息系统安全专业人员 (CISSP) 考试的风险评估类型非常重要。充分理解定量和定性方法是必要的，这包含了所有与定量方法相关的术语。\n\
  \n### FYI\n硬件锁是一种可以将笔记本电脑固定在家具上的金属电缆。电缆绕在桌子或椅子上，然后连接到笔记本电脑。一旦锁（通常是组合锁）锁好，就需要输入密码将锁从笔记本电脑上取下。尽管小偷可以使用钢丝钳剪断电缆，或者连同桌子一起带走笔记本，但这两种动作看起来都很可疑。\n\
  \n由于每台笔记本的价值为 2,000 美元，`SLE` 为 2,000 美元。每个季度丢失一台笔记本，导致 `ARO` 为 4。`ALE` 计算为 2,000\
  \ 美元 × 4，即 8,000 美元。\n\n随后可以使用 `ALE` 来确定控制措施的用处。例如，公司可以批量购买笔记本电脑硬件锁，每台成本 10 美元。保护价值为\
  \ 10 美元 × 100 台笔记本，即 1,000 美元。估计如果购买了这些锁，`ARO` 将从 4 减少到 1。公司应该购买这些锁吗？\n\n可以使用以下计算确定控制措施的有效性：\n\
  \n- 当前 `ALE` = $8,000 (`ARO` 为 4 × $2,000)\n- 采用控制措施后的 `ARO` = 1\n- 采用控制措施后的 `ALE`\
  \ = $2,000 (`ARO` 为 1 × $2,000)\n- 采用控制措施的节省 = $6,000 (当前 `ALE` $8,000 − 采用控制措施后的\
  \ `ALE` $2,000)\n- 保护价值（控制措施成本） = $1,000 ($10 × 100)\n- 实际节省 = $5,000 (采用控制措施的节省\
  \ $6,000 – 保护价值 $1,000)\n\n在例例中，第一年的节省为 5,000 美元，这提供了一个成本效益分析 (CBA)，并明确表明应该购买这些锁。如果不采取任何行动，公司可能会损失\
  \ 8,000 美元。然而，通过花费 1,000 美元购买锁，公司将只会损失 2,000 美元。换句话说，公司正在花费 1,000 美元来节省 6,000 美元。\n\
  \n#### 优点\n定量风险评估的主要优点之一是它变成了一个简单的数学问题，这在利用工具进行评估时尤其如此。因如此，`SLE`、`ARO` 和保护价值是准确的。定量风险评估的另一个大优点是它提供了\
  \ CBA，这在上一节中也讨论过。管理层通常对定量术语熟悉。例如，定量评估使用美元术来表示损失。\n\n#### NOTE ![](img/Note.png)注意\n\
  这些公式通常只看一年。如果包含其他成本，计算可能会变得非常复杂。未包含后续年度的折旧、维护更换费用。最后，公式使用了可验证的客观衡量标准。\n\n#### 局限性\n\
  使用定量分析也有其局限性。最大的局限性之一是不总能获得准确的数据，这在识别 `ARO` 减少时尤其如此。这些估计的准确性很难验证。例如，早期的例子提到，如果购买了硬件锁，`ARO`\
  \ 将从 4 减少到 1。换句话说，每年不是被盗四台笔记本，而是只被盗一台。这种困难在向怀疑或不支持的管理层进行报告时也是一个漏洞。\n\n另一个局限性是确保人员按预期使用控制措施。示例中提到了硬件锁是为了保护笔记本电脑。只要大家都使用硬件锁，它们就能发挥作用。然而，用户可能会认为它们不方便。\n\
  \n\n\n\n\n`定性风险评估`并不分配美元价值。相反，它根据对风险`概率`和影响进行更主观的分配来确定风险水平，这与基于成本估算计算的定量风险评估不同。这些值是通过收集专家意见确定的。\n\
  \n概率和影响的定义如下：\n\n*   `概率`——威胁利用漏洞的可能性。当威胁利用漏洞时，风险就会发生。可以使用刻度来定义风险发生的概率。该刻度可以基于词汇值，例如`低`、`中`或`高`。然后可以为这些词分配百分比值。例如，低概率可以分配\
  \ 10% 的取值，高概率可以分配 100% 的取值。\n*   `影响`——风险发生时的负面结果。影响用于识别风险的程度。风险会导致某种损失。然而，影响评估不是将损失量化为金额，而是可以使用词汇，如`低`、`中`或`高`。这些类别也可以用于识别概率。但是，当概率以百分比表示时，影响则以相对值表示。例如，低可以可能是\
  \ 10，中可以可能是 50，高可以是 100。\n\n风险水平可以使用以下公式计算：\n\n`风险水平 = 概率 × 影响`\n\n`表格 5-1`和`5-2`显示了风险评估中定义刻度的一种方法。这些刻度的每个值都是根据当前已威胁、漏洞以及当前的控制措施分配的。注意，专家以词汇（如`低`和`中`）分配概率和影响。随后，完成风险评估的人员将根据刻度将词汇转换为数字。例如，如果专家分配了低概率，风险评估将给出一个\
  \ 10% 的值。专家们并不一定知道实际数值和范围。相反，他们根据描述来做出决策。\n\n**表 5-1** 概率刻度\n\n| 概率 || 描述 || 数值和范围\
  \ |\n| --- | --- | --- |\n| 低 | 风险不太发生。威胁处于非活动状态。漏洞要么未知，要么已被缓解。 | 10% (0 到 10%)\
  \ |\n| 中 | 风险发生的概率中等。过去发生过，但缓解控制措施减少了最近的发生次数。 | 50% (11% 到 50%) |\n| 高 | 风险发生的概率很高。过去发生过，如果不加缓解，将再次发生。\
  \ | 100% (51% 到 100%) |\n\n**表 5-2** 影响刻度\n\n| 影响 || 描述 || 数值和范围 |\n| --- | ---\
  \ | --- |\n| 低 | 如果风险发生，对公司的影响将极小。攻击将不会影响任何关键数据或系统。 | 10 (1 到 10) |\n| 中 | 如果风险发生，对公司将产生中等影响。它可能会影响关键数据或系统，但程度不大。\
  \ | 50 (11 到 50) |\n| 高 | 如果风险发生，对公司将产生巨大影响。它将影响关键数据或系统并造成重大损失。 | 100 (51 到 100)\
  \ |\n\n### ![](img/Note.png)注意\n\n关于定性风险评估需要意识到的一个重要点是，刻度必须被定义。然而，并没有统一的标准。一家公司可能使用低、中、高三个值。另一家公司可能使用五个值：轻微、轻中等、中等、中度严重和严重。只要风险评估中的刻度是有定义的的，可以使用任何刻度。\n\
  \n定性分析可以分为两个部分：\n\n*   第一部分尝试对风险进行排序。\n*   第二部分评估控制措施的有效性。\n\n这两个部分可以同时进行。但是，为了清晰起见，在本章中它们被作为两个独立的动作提出。\n\
  \n#### 风险排序\n\n风险评估这部分的目标是识别哪些风险最重要。通过对已知风险分配概率和影响值来完成识别最重要的风险。\n\n例如，一家公司的网站销售公司产品。由于最近的停机，需要识别该网站最重要的风险。根据几位专家的反馈得出一个列表。这些风险现在需要进行排序。\n\
  \n风险类别为：\n\n*   `DoS 攻击`——任何导致停机的拒绝服务（DoS）或分布式拒绝服务（DDoS）攻击。\n*   `网页篡改`——未经授权方对网站的修改。\n\
  *   `未经授权访问导致的数据丢失`——任何机密性的丢失。这种丢失可能是由于攻击者访问客户数据或任何内部私有数据。这种丢失不包括免费可用数据的丢失。\n* \
  \  `硬件故障导致网站数据丢失`——任何网站数据的丢失。这种丢失可以包括用于向客户显示网页的数据，以及用于检索并将数据格式化为网页的网站应用程序。\n\n网站受`DMZ`保护。网站目前位于非军事化区（DMZ），并受基于主机的防火墙保护。假设此防火墙将保留。\n\
  \n### 确定风险调查\n\n我们正在尝试识别网站最严重的风险。请为下表中的每个类别在每个标题下输入低、中或高值。您的决策应基于当前的控制措施和保护措施。\n\
  \n定性分析调查\n\n| 类别 || 风险发生的概率（低、中或高） || 风险发生后的影响（低、中或高） |\n| --- | --- | --- |\n|\
  \ DoS 攻击 | | |\n| 网页篡改 | | |\n| 未经授权访问导致的数据丢失 | | |\n| 硬件故障导致网站数据丢失 | | |\n\n这些数据可以用许多方法以图形形式表示。`图\
  \ 5-2`中的风险矩阵显示了一种方法。\n\n![图 5-2 风险矩阵。](img/9781284183719_CH05_FIGF02.png)\n\n**图\
  \ 5-2** 风险矩阵\n\n此时，`表 5-3`显示最大的风险是 DoS 攻击，其风险水平为 100。最低风险水平是未经授权访问导致的数据丢失，为 3。\n\
  \n**表 5-3** 定性分析结果\n\n![](img/Table5-3.png)\n\n\n\n\n\n数据丢失听起来非常严重。然而，如果现有的控制措施和实践已经消除了大部分风险，其影响就会降低。例如，管理员可能已经从网站中删除了所有隐私数据。尽管有人可能尝试入侵网站以获取数据，但由于该网站仅持有公共数据，因此影响很小。\n\
  \n另一方面，`DoS` 攻击的风险显然上升为最大的首要风险。根据目前的控制措施，专家们认为系统将受到攻击。当攻击发生时，他们也认为影响将是巨大的。\n\n###\
  \ 参考信息\n\n不同的独立冗余磁盘阵列 (RAID)，也称为`廉价磁盘冗余阵列 (redundant array of inexpensive disks)`,允许系统在硬盘驱动器故障时继续运行。复杂的\
  \ `RAIDs` 允许系统在多个硬盘驱动器故障的情况下运行。RAID 提供了容错能力。故障可能会发生，磁盘子系统可以承受，这意味着它将继续运行。\n\n从重要到最不重要的风险列表如下：\n\
  \n- **优先级 1**—`DoS` 攻击，值为 100\n- **优先级 2**—`网页篡改 (Web defacing)`，值为 45\n- **优先级\
  \ 3**—硬件故障导致网站数据丢失，值为 27\n- **优先级 4**—未经授权访问导致的数据丢失，值为 3\n\n### 评估控制措施的有效性\n\n此时，可以确定对于高影响风险应该应用哪些保护措施或控制措施。调查在这里也可以提供帮助。例如，可以使用缓解选择调查。\n\
  \n注意，“未经授权访问导致的数据丢失”未包含在调查表中。因为专家们已经同意这不构成重大风险，因此没有对其进行缓解。换句话说，在这种情况下，管理层决定接受剩余风险。\n\
  \n### 确定保护措施或控制措施的调查\n\n下表左列列出了措施。顶部列出了风险。请在每个标题下输入低、中、高。你输入的值应表示该控制措施缓解风险的价值。例如，如果你认为将\
  \ Web 服务器放置在 `DMZ` 中防止 `DoS` 攻击的成功率很高，请在该标题下输入 `high`。如果你认为成功率较低，则输入 `low`。\n\n\
  缓解选择调查\n\n```\n![](img/Table5-5.png)\n```\n\n正如风险可以总结一样，控制措施的有效性也可以总结。表 5-4 显示了调查的预期结果。与其他调查一样，“高”值为\
  \ 100，“中”值为 50，“低”值为 10。\n\n**表 5-4** 缓解选择调查结果\n\n```\n![](img/Table5-4.png)\n```\n\
  \n表 5-4 显示，将服务器放在 `DMZ` 中将为 `DoS` 攻击提供最佳保护。此外，`IDS` 也将提供高水平的保护。表格有助于为各个风险匹配最佳控制措施：\n\
  \n- **DoS 攻击**—使用 `DMZ` 和/或 `IDS` 进行保护\n- **网页篡改**—使用 `DMZ` 进行保护\n- **硬件故障导致网站数据丢失**—使用\
  \ `RAID` 和备份计划进行保护\n\n### 优点\n\n定性评估有几个主要优点：\n\n- 使用专家的意见\n- 易于完成\n- 使用单词而非数字，更易表达和理解\n\
  \n数据从最了解系统的专家那里收集。他们丰富的系统知识和经验使他们能够快速识别问题源。只要有专家参与数据收集，风险评估就很容易完成。可以为他们提供调查按自己的进度完成，他们甚至不需要聚在一起；可以分别进行访谈。\n\
  \n定性风险评估使用量表，可以很容易地适应组织的文化。量表允许个人通过他们使用的日常词来理解值的含义，这使得更容易让那些可能是其领域专家但不是安全或 IT 专家的人参与。\n\
  \n例如，人力资源（HR）专家可能对 `HIPAA` 的要求有深入了解。他们了解未受保护数据的危险，以及可以评估的实际罚款或判处监期。HR 专家可以为风险评估提供实质性的投入。\n\
  \n### 使用德尔斐法进行评估\n\n执行定性评估的一种常用方法是德尔斐法，它可以用于收集数据以创建或识别共识。\n\n德尔斐法的主要优点是它允许个人在没有压力的情况下自由分享意见。不是让所有参与者在会议上讨论某个问题，而是独立地收集回复。\n\
  \n德尔斐法可以通过几种方式实现。一种方法是按照以下步骤操作：\n\n1. **识别问题**—问题可能出现在单个 IT 系统或一组服务器上。该问题应在加入团队的专家的知识范围内。例如，问题可能与网站故障有关，可以表述为“WebServer1\
  \ 在过去一年内发生了四次故障，导致了损失”。\n2. **收集专家意见**—将问题发送给专家组，要求他们做出。对于 Web 服务器故障，可以要求他们识别主要风险。如果原因已知，可以要求他们识别主要风险。\n\
  3. **汇总回复**—回复在不同阶段会有不同的形式。例如，回复可以是风险列表、按优先级排序的风险列表或缓解风险的措施列表。\n4. **共享结果**—结果的共享取决于项目阶段的不同形式。如果刚刚汇总了风险列表，现在可以要求团队识别每个风险的概率和影响。当开始研究措施时，可以重复该过程。可以请求缓解风险的措施列表。然后，可以要求团队识别不同措施对特定风险的有效性。\n\
  5. **根据需要重复**—重复该过程直到收集到所有数据。\n\n德尔斐法非常灵活。今天，调查通常可以通过电子邮件完成。许多电子邮件程序允许发送调查，用户只需点击按钮。用户还可以填写在内部\
  \ Web 服务器上创建的调查，这可能需要一些时间，但结果可以快速汇总。\n\n独立收集数据是重要的。如果数据是在会议上收集的，参与者的可能会受他人的意见而偏斜。强势的参与者可能会影响他人并防止团队充分参与。\n\
  \n### 局限性\n\n定性评估有几个局限性，包括：\n\n- **主观性**—分析和结果更多基于意见而非事实。对这些意见的不同视角可能会产生不同的结果。如果意见是在小组中收集的，强势参与者可能会塑造整个小组的想法。\n\
  - **基于专家水平**—评估价值取决于专家的水平。如果专家拥有坚实的知识基础和丰富的经验，结果将很有价值。另一方面，如果没有接触真正的专家，结果的价值可能有限。\n\
  \n\n\n\n\n*   **没有 CBA**——定性评估不包含成本效益分析（CBA）。控制措施的有效性没有定量分析那样清晰。尽管专家的意见仍然具有价值，但结果对管理层来说可能不够清晰。管理层在决定使用哪些保护措施时可能会面临更大的困难。\n\
  *   **没有真实的标准**——公司需要定义过程中使用的刻度。例如，刻度可以简单地分为低、中、高。然而，需要为参与者开发并定义这些刻度，这需要理解风险评估以及数据将如何用途的专业人士。\n\
  \n## 定量与定性风险评估的比较\n\n提醒一下，这两种方法都不被认为优于对方。它们都有自己的优点和局限性。总结来说，以下是定量与定性风险评估之间的几点比较。\n\
  \n### 定量分析：\n*   客观性\n*   使用数值，例如金额\n*   可靠的可重复性\n*   更耗费时间\n*   需要访问大量的历史数据\n*\
  \   数据并不总是容易获得\n*   基于 `SLE`、`ARO` 和 `ALE` 公式\n*   以金额显示清晰的损失和节省\n*   数据可以很容易地用于\
  \ `CBA`\n\n### 定性分析：\n*   主观性\n*   基于专家的意见\n*   比定量分析更快、成本更低地完成\n*   使用词汇值，例如低、中、高\n\
  *   需要定义风险评估中使用的刻度\n\n## 风险评估大纲示例\n\n风险评估以报告结束，管理层可以根据报告来决定实施哪些控制措施。以下是风险评估报告中通常包含的主列表：\n\
  \n*   **引言**——引言提供了风险评估的目的和范围。它包括对风险评估中考虑的系统的组件、用户和位置的描述。\n*   **风险评估方法**——该部分识别了用于完成风险评估的方法。它包含了有关如何收集数据以及参与人员的细节。如果使用定性方法，该部分将描述风险刻度。\n\
  *   **系统特征描述**——该部分提供了有关系统的更多细节。它可能包括硬件、软件或网络连接的细节，并可能包含以图形化方式显示评估系统的图表。\n*   **威胁声明**——该部分列出了潜在的威胁、威胁源和威胁行为。例如，一个威胁可能是攻击者对面向互联网的服务器发起\
  \ `DoS`攻击。\n*   **风险评估结果**——结果可以以威胁/漏洞对的形式列出，代表一种风险。通过现有的安全措施对风险进行描述。列出当前控制措施下风险发生的概率。风险的描述方式取决于使用了哪种分析。定量方法使用\
  \ `SLE`、`ARO` 和 `ALE` 等术语。定性方法根据定义的刻度识别概率和影响。所有这些数据都通过识别结果如何获取的讨论提供了支持。\n*   **控制建议**——提供一份建议的保护措施或控制措施列表。该列表可以包含对控制措施有效性的注释。定量方法通常会为每种控制措施带上\
  \ `CBA`。定性方法通常会对控制措施的有效性进行排名。\n*   **总结**——总结可以用一个或多个汇总结果的表格形式。这种格式使管理层很容易根据风险分级查看最高风险。总结还使易于批准任何建议。\n\
  \n## 风险评估面临的挑战\n\n在完成风险评估时，必须解决并克服若干挑战。其中许多挑战取决于所选择的评估类型。定量和定性评估都有各自的挑战。这些挑战在上一节中作为局限性被列出。\n\
  \n存在一些额外的挑战，包括：\n*   使用静态过程来评估移动目标\n*   资源和数据的可用性\n*   数据一致性\n*   估算影响因素\n*   提供支持资源分配和风险接受的结果\n\
  \n这些挑战在接后的章节中将被探讨。\n\n### 使用静态过程评估移动目标\n\n如前所述，风险评估是一个时间点上的评估。它在特定时间针对已知风险对系统进行评估，并根据当前的控制措施考虑风险。换句话说，风险评估是一个静态过程。然而，安全不是静态的。风险可以且确实在变化，因为攻击者和攻击手段不断变化。\n\
  \n当攻击者成功攻击时，安全专家会实施控制措施。在某个时刻，这些攻击的成功率会降低。攻击者随后学习新的攻击方法。安全专家修改控制措施或实施新的控制措施，战斗每天持续。\n\
  \n某些威胁和漏洞看起来已经成功缓解，不再是风险。但突然之间，它们又作为另一种威胁出现。域名系统（`DNS`）缓存中毒就是一个很好的例子。`DNS`缓存中毒会导致系统将网站名称解析为虚假的互联网协议（`IP`）地址。用户可能尝试用网络浏览器访问\
  \ `Acme.com`，但他们被重定向到了 `Malware4u.com`。`DNS`缓存中毒在年前被确定为重大威胁。它曾被成功缓解并不再使用。从 IT 安全的角度来看，它几乎成了一个历史脚注。\n\
  \n随后，在 2008 年夏天，Dan Kaminsky 发现并发布了一个漏洞。快如闪电，`DNS`缓存中毒再次成为问题。一旦结果发布，攻击者就学会了如何利用该漏洞。`DNS`缓存中毒再次被引起严重关注。安全措施解决了这一缺陷，`DNS`缓存中毒再次变得罕见。\n\
  \n如果风险评估在 3 月完成，但在 6 月公布了影响系统的漏洞，那么评估的有效性就会受到影响。因此，了解新出现的风险是必要的。\n\n### 提示\n\n了解漏洞的一种方法是订阅美国计算机应急响应小组（`US-CERT`）的警报。关注警报显示每周都有新的漏洞被发现。漏洞中的一些代表非常严重的风险。可以通过\
  \ `http://www.us-cert.gov/mailing-lists-and-feeds/` 接收 `US-CERT` 团队的电子邮件和警报。\n\n\
  #### 资源和数据的可用性\n\n可用性挑战存在两个主要领域。一个领域涉及资源的可用性，另一个领域涉及数据的可用性。这两个领域在风险评估过程的早期解决至关重要。如果不解决，将严重影响质量。\n\
  \n关于资源，参与评估的人员应该了解他们所评估的系统。具有更高水平的知识可以获得更高质量的评估。如果风险评估团队没有所需的水平知识和经验，他们可能不得不采取猜测。\n\
  \n\n\n\n就数据而言，其可用性也同样重要。数据的可用性将决定所执行的评估类型。例如，如果有大量与实际性能和故障相关的内部历史数据，则可以使用这些数据来进行定量风险评估。这些历史数据可用于确定\
  \ `SLE` 和 `ARO` 的值。如果这些数据可用，则可能会转而进行定性风险评估。\n\n如果没有合适的人员和准确的数据，风险评估的完成将变得困难得多。如果问题能尽早得到解决，成功的机会会更高。\n\
  \n### ![](img/Tip.png)提示\n\n即使能够访问历史数据，可能仍然选择进行定性风险评估。选择定性而非定量风险评估的原因之一可能是时间考虑。定性风险评估通常比定量风险评估能更快完成。\n\
  \n## 数据一致性\n\n风险评估的另一个挑战是数据一致性。数据一致性指的是数据的准确性。多个问题会影响数据一致性，这些包括：\n\n* 数据格式的差异\n\
  * 数据收集方式的变化\n* 业务本身的变化\n\n这些每一个都可能直接影响数据的准确性。然而，即使数据准确率未达到 100%，也不意味着这些数据无法使用。\n\
  \n某些风险评估通过不确定性水平来处理数据的准确性，该水平指示数据的有效性。如果所有条件都理想，数据将是 100%准确的。在这种情况下，不确定性水平将为 0%。但在现实世界中，0%的不确定性水平是不可能的。\n\
  \n例如，历史数据可能显示网站每小时产生约 $2,000 的收入。当前数据可能显示这一趋势仍在持续并有轻微增长。数据准确的确定性可能是 80%，即有 20%的不确定性水平。在使用这些销售数据计算\
  \ `SLE` 时，也可以提供不确定性水平。\n\n### 数据格式差异\n\n数据格式会影响数据如何使用、处理和解释。通常，数据库在查询和处理大量数据方面效率更高。然而，数据最初可能是在文字处理文档或电子表格中创建的。如果数据是从一种格式迁移另一种格式，可以选择对数据的准确性进行不同的权重。\n\
  \n例如，数据之前存储在 Microsoft Excel 工作表中，但现在存储在 Microsoft SQL Server 数据库中。存储在工作表中时，它满足了用户的需求。但从不同角度查看数据或通过查询显示不同的总计和分项合计并不容易。在数据库中，现在可以使用查询从多个角度查看数据。数据可能非常相似，但数据库现在允许对数据获得更深层次的视角。\n\
  \n考虑到这一点，使用 Excel 工作表的用户可能得出了准确的结论。然而，这些结论可能没有从存储在数据库的数据中得出的结论那样实质。\n\n如果数据来自不同的来源，意识到它们可能被不同的解释是非常重要的。这可能会在比较数据时导致不一致性。所有这一切都会影响数据的不确定性水平。\n\
  \n### 数据收集的变化\n\n数据收集方式的变化也会影响数据的准确性。可能看到的这种变化是从手动数据收集转向自动数据收集。\n\n对人类有很多赞誉，但事实是，人类并不擅长处理枯燥的重复任务。计算机擅长。当人们手动收集和输入数据时，应该预考虑到错误的。\n\
  \n控制和检查有助于发现这些错误。输入验证方法验证数据的有效性。例如，`ZIP Code` 有五位数。输入验证方法可以检测四位或六位的无效 `ZIP Code`\
  \ 输入。此外，一名员工可以双检另一名员工输入的数据。\n\n手动数据输入会对不确定性水平产生负面影响。未能双检数据的准确性也会影响不确定性水平。\n\n另一方面，如果使用自动方法收集数据，数据的预测性要高得多。如果使用自动方法收集、存储和处理数据，其不确定性水平将低得多。\n\
  \n### 业务的变化\n\n一家公司今年的业务量通常与去年不同，这通常是由于增长导致的。然而，对于某些业务来说，业务量的变化可能是由于市场份额的流或其他业务原因。事实是，销售额很少是停滞的。事实上，销售停滞被视为负面信号。\n\
  \n了解过去发生了什么非常重要，以便预测未来将发生什么。然而，未来永远不会与过去完全相同。例如，某个网站去年的每小时收入可能是 $2,000。然而，圣诞期间的销售额可能比去年增加了一倍，目前的预测是今年的销售额也可能翻倍。所有这些因素可能要求将每小时平均销售额从\
  \ $2,000 修改为 $4,000。\n\n同样，公司可能在某个销售市场中失去了市场份额。这种损失可能是因为公司为研发或营销分配的资金较少，或者由于其他十几个原因中的任何一个。所以，如果销售额正在下降，应该考虑这一事实。\n\
  \n话虽如此，尽管销售数据可能显示销售额正在下降，但新经理可能正在实施增加销售额的变革，初步迹象可能显示正在增长。所有这些因素可能导致所用数字的不确定性水平发生变化。\n\
  \n## 影响效应估计\n\n任何风险的潜在影响都很难估计。最重要的一点是意识到影响只是一个估计。如果未来发生的事情可以被准确预测，从事 IT 或网络安全领域可能就不是了。\n\
  \n在估计影响效应时，多个因素会起作用，即使在有准确历史数据的情况下也是如此。例如，网站可能遭受了攻击，导致数小时的故障。在排除故障期间，技术人员学到了很多。是的，首要任务是解决当前的故障。然而，从中获得的知识和经验被积累了起来。下次服务器发生故障时，恢复时间可能会快得多。\n\
  \n这个例子也取决于多个变量。IT 专业人员流失率高的公司无法像流失率低的公司那样积累经验。如果系统由于六个月前相同的原因宕机，但这是新技术人员第一次看到它，故障时间可能和以前一样长。\n\
  \n另一方面，之前的攻击成功可能是由于系统中的漏洞。如果这些漏洞被发现，它们通常会被修复。然而，即使被修复了，这些修复可能也没有被记录。\n\n如果没有对之前修复的记录，今天看起来可能与之前攻击时完全一样。相反，可能已经实施了多项变化，减少了攻击发生的概率或影响。在这个例子中，不确定性水平可能取决于组织管理实践的变化。\n\
  \n### ![](img/Note.png)注意\n\n\n\n\n变更管理是一个流程，它确保只有在经过审查流程后才进行变更，并对变更进行记录。它是信息技术基础架构库（ITIL）涵盖的一个重要流程。许多公司即使没有直接遵循\
  \ ITIL 实践，也会使用变更管理流程。\n\n## 提供支持资源分配和风险接受的结果\n\n风险评估的结果需要是有实际用的，这并不意外。然而，安全专业人员可能会掉入“必须不惜代价地追求安全”的陷阱，但事实并非如此。必须不断考虑盈利能力与生存能力之间的适当平衡。\n\
  \n两个需要考虑的重要点是：\n\n- 资源分配\n- 风险接受\n\n### 资源分配\n\n安全团队的资金或人员数量不是无限的。相反，安全部门将获得有限百分比的资源，在进行风险评估时，这一点是非常重要的。\n\
  \n任何建议都应该是现实的。它们需要考虑业务文化以及这些建议被接受的实际可能性。\n\n### 风险接受\n\n某些组织愿意比其他组织接受更多风险，这既不是错也不对；接受更多风险只是业务运营的一种。对于某些业务来说，承担风险表明了它们的创新能力。在创建风险评估时，了解业务文化非常重要。\n\
  \n接受更多风险有两个侧面：\n\n1. 风险越大，回报越高。\n2. 更大的风险可能导致更大的损失。\n\n例如，现今许多公司曾出现过低于 1 美元的股票。任何购买价值\
  \ 10,000 美元股票的人在今天都会成为百万富翁。然而，很少有人真的购买了价值 10,000 美元的股票。原因是，当股价处于低位时，没有人知道公司是否能够生存。一些人承担了风险并获得了丰厚的回报。然而，其他人在其他公司承担了类似的风险，而这些公司后来破产了。他们的风险投资事实证明是巨大的损失。\n\
  \n记住高层管理人员负责公司的大重大决策是重要的。他们负责识别哪些风险需要减轻、共享、转移、避免或接受。向高层经理提出的建议应该基于并与其预期接受的剩余风险保持一致。\n\
  \n### 注意\n\n剩余风险是在管理层决定实施控制后仍然存在的任何风险。高层管理负责做出这些决策。此外，高层管理还对由于剩余风险导致的任何损失负责。\n\n\
  无论如何，提交所有数据的责任仍然存在。如果某些建议看起来显然不会被接受，可以将它们包含在报告中，但不要放在实际建议列表中。\n\n## 风险评估的最佳实践\n\n\
  风险评估在不同组织中的执行方式可能不同。对网络服务器的风险评估与评估 HIPAA 数据的评估可能会有很大不同。然而，可以包含几项内容以帮助确保成功。\n\n以下列表列出了风险评估方法的几项最佳实践：\n\
  \n- **从明确的目标和定义的范围开始**——风险评估应该包含一个范围声明。范围声明有助于保持评估在正轨上，并防止范围蔓延。\n- **获得高层管理的支持**——高层管理需要对风险评估做出承诺。没有支持，风险评估就会失去价值。当风险评估团队意识到风险评估没有受到重视时，他们投入的时间和精力就会随之减少。没有高层经理支持的评估从一开始就几乎是注定要失败的。\n\
  - **建立一支强大的风险评估团队**——风险评估的价值基于风险评估团队的能力和专业知识。团队成员应该具备该系统的专业知识。例如，在进行定性分析时，如果从非专家人员那里收集数据，那么他们的意见就不会像从专家那里收集的数据那样。团队成员还应该理解用于风险评估的方法论。\n\
  - **定期重复风险评估**——威胁、风险和漏洞在不断演变；因此，应该定期重复风险评估。某些联邦机构要求至少每三年重复一次风险评估。许多组织制定风险评估政策，该政策确定了组织预期定期执行的操作，并为任何风险评估定义通用目标。\n\
  - **定义要使用的方法论**——通过一致地使用相同的方法，人们会变得更加精通。例如，一家公司可以决定定期进行定性风险评估。如果是这样，应该定义所使用的量表。当以相同的方式反复进行评估时，它们更容易完成。\n\
  - **提供包含明确建议的报告**——每次风险评估都应以一份报告结束，报告应识别并清晰陈述发现。评估的最终目的是通过建议的控制措施来减轻风险。如果建议不明确，报告将失去大量的价值。\n\
  \n## 总结\n\n风险评估用于识别和量化风险。它们通过识别威胁和漏洞，然后应用评估来对风险进行排序。一旦风险被量化，就可以确定控制和保护措施。\n\n两种主要的风险评估方法是定量和定性。当可用历史数据时，使用定量风险评估：`ALE\
  \ = SLE × ARO`。定性风险评估则使用专家意见并提供。\n\n## 关键概念和术语\n\n- `annual loss expectancy (ALE)`\n\
  - `annual rate of occurrence (ARO)`\n- `exposure factor (EF)`\n- `probability`\n\
  - `qualitative risk assessment`\n- `quantitative risk assessment`\n- `redundant\
  \ array of independent disks (RAID)`\n- `safeguard`\n- `safeguard value`\n- `single\
  \ loss expectancy (SLE)`\n- `single point of failure (SPOF)`\n- `uncertainty level`\n\
