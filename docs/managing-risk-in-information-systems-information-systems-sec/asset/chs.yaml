  \ 原因、标准和里程碑\n11. 用于识别缓解工具财务重要意义的主要工具是什么？\n    1. `Ishikawa diagram`\n    2. 鱼骨图\n\
  \    3. `CBA`\n    4. `POAM`\n12. 鱼骨图可以将原因与结果联系起来。\n    1. 正确\n    2. 错误\n13. 鱼骨图也被称为：\n\
