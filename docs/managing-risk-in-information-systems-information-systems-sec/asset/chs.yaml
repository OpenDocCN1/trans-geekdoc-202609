  \n© Sai Chan/Shutterstock\n\n## Planning Risk Mitigation Throughout an Organization\n\
  \n## CHAPTER 10\n\nAFTER COMPLETING THE BASICS of identifying assets, threats, and\
  \ vulnerabilities, identifying controls can begin. Controls mitigate risk throughout\
  \ an organization. One of the ways to evaluate controls is to identify critical\
  \ business operations and functions. Controls should be in place to protect against\
  \ risks for these critical areas of a business.\n\nCompliance is an important topic\
  \ in information technology (IT). Compliance is an important topic in information\
  \ technology (IT).\n\n\n\n\n美国国家标准与技术研究所 (NIST) 特别出版 (SP) 800-53 包含了大量的控制措施文档。确保提出正确问题的一种良好方法是使用\
  \ `SP 800-53` 逐一检查这些控制族。如果这些控制措施适用于组织，那么它们应该被纳入风险缓解计划中。\n\n接下来，对控制措施进行评估，以确定哪些措施应该实施。这一步的一个重要部分是进行成本效益分析（`CBA`），这将在本章后面部分介绍。\n\
  \n## 组织的风险管理范围是什么？\n\n风险管理的范围指的是关注的领域，也可以被视为控制区域。某些事物是可以控制的，而另一些则不能。例如，飓风和地震是无法控制的，但可以通过规划组织的响应方式来减少其影响。\n\
  \n## FYI（供参考）\n\n范围确定了项目的边界。不确定范围最大的问题是**范围蔓延**（scope creep）。当项目的目标或交付物不受控制地增长时，就会发生范围蔓延。例如，人员可能会在低价值资产上花费精力和资源，从而牺牲了高价值资产。如果项目范围没有得到控制，项目消耗的资源、成本和所需的时间将比定义好范围后所需的要多。在风险管理的情况下，边界可能会超出管理风险所需的可用资源或时间，这会导致组织无法识别或评估新风险，而已评估的风险却得不到响应。\n\
  \n在考虑组织内部风险管理范围时，请考虑以下事项：\n\n* 关键业务运营\n* 客户服务交付\n* 任务关键业务系统、应用程序和数据访问\n* 典型 IT 基础设施的七个领域\n\
  * 信息系统安全差距\n\n以下章节涵盖了这些主题。\n\n### 关键业务运营\n\n风险管理的早期步骤之一是识别哪些业务运营是关键的。这些业务运营是必须正常运行以确保组织维持生存的业务。\n\
  \n业务影响分析（`BIA`）是这一步使用的关键工具。它帮助组织识别当各种风险发生时对业务的影响。\n\n`BIA` 的关键要素之一是识别直接成本和间接成本。直接成本反映了停机的即时成本。例如，如果\
  \ Web 服务器故障且无法处理销售，在此期间损失的销售额就是直接成本。间接成本包括客户信誉的损失以及恢复该信誉的成本。\n\n这些成本有助于确定服务或功能的优先级。如果停机成本很高，那么花钱防止停机就是合理的。\n\
  \n`BIAs` 识别了最大可停机时间 (MAO)。`MAO` 是系统或服务在影响任务之前可以中断的最长时间。`MAO` 也称为最大可忍停机（`MTO`）或最大可忍中断期（`MTPOD`）。\n\
  \n### ![](img/Tip.png)提示\n\n风险管理必须由业务需求驱动，这意味着管理的风险是那些具有影响业务的风险。管理此范围之外风险的成本是不合理的。\n\
  \n`MAO` 直接影响所需的恢复时间。例如，某个系统的 `MAO` 为 30 分钟，这意味着恢复计划必须能够在 30 分钟内恢复故障的系统。\n\n`BIA`\
  \ 的大部分工作是数据收集。可以通过查阅可用报告和访谈人员来收集数据。\n\n在完成特定服务或功能的 `BIA` 时，应该回答以下关键问题：\n\n* 该服务如何影响组织的盈利能力？\n\
  * 该服务如何影响组织的生存能力？\n* 该服务如何影响组织的形象？\n* 停机将如何影响员工？\n* 停机将如何影响客户？\n* 该服务何时需要可用？\n*\
  \ 该服务的 `MAO` 是多少？\n\n### 客户服务交付\n\n风险管理包括对组织向客户提供的服务的评估。在这种背景下，客户是指任何接收服务的实体。\n\n\
  明显的客户是那些购买组织服务的实体。例如，如果组织为小企业提供电子邮件服务，那么这些小企业就是组织的客户。他们没有管理自己的电子邮件服务器，而是将服务外包给该组织。\n\
  \n这些客户对这项服务有期望。他们可能期望电子邮件每天 24 小时可用。或者，他们可能只期望在工作时间段提供电子邮件。无论何种情况，识别他们的期望都是重要的。\n\
  \n服务水平协议 (SLA) 是识别预期性能水平的文档，其中包括最小运行时间或最大停机时间。组织使用 `SLAs` 作为服务提供商与客户之间的合同。`SLA`\
  \ 可以规定在未满足条款时的金钱罚款。\n\n如果一个组织与其他组织有 `SLAs`，它们应该被纳入风险管理，并对任何金钱罚款给予特殊关注。例如，`SLA` 可能规定四小时的最大停机时间（即\
  \ `MAO`），此后将开始按小时计算罚款。当然，承诺低水平停机时间的 `SLAs` 成本更高。收取这些额外费用是为了支付提供更水平服务所需的额外控制费用。\n\
  \n不那么明显的客户是内部客户。任何接收服务的员工或部门都是客户。以下是提供给内部员工的一些常见服务：\n\n* 电子邮件服务\n* 访问互联网\n* 网络访问\n\
  * 服务器应用程序（例如数据库服务器）\n* 访问内部服务器（例如文件服务器）\n* 桌面计算机支持\n\n### ![](img/Note.png)注意\n\n\
  组织内部实体通常有类似于 `SLA` 的协议，但更加非正式且不包含金钱罚款。例如，远程办事处可能与主办公室约定在工作时间内提供虚拟专用网络（`VPN`）服务。\n\
  \n员工不会与 IT 部门 `SLAs`，但他们对服务有期望。如果任何服务故障过久，停机将开始影响员工工作的能力，从而影响组织的任务。通过识别停机影响任务的时间范围，就可以确定\
  \ `MAO`。\n\n仅仅因为某项服务没有外部客户并不意味着应该忽略它。许多服务是内部客户所需的。\n\n### 任务关键业务系统、应用程序和数据访问\n\n\
  许多组织拥有任务关键的系统、应用程序和数据。当这些关键资产不可用时，任务就会受到影响。因此，在审查风险管理和风险缓解计划时，识别和审查这些资产是非常重要的。\n\
  \n\n\n\n\nCBF（关键业务功能）是指任何认为对组织至关重要的功能。如果 `CBF` 失败，组织将失去执行基本操作的能力，例如向客户销售产品。如果组织无法执行该功能，它将通过收入损失或间接损失导致亏损。\n\
  \nCSF（关键成功因素）是完成组织使命任务所需的任何元素。一个组织会有几个元素必须成功，组织才能取得成功。例如，对于今天的许多公司来说，可靠的网络基础设施可能被视为一个\
  \ CSF。如果网络基础设施失败，通信就会停止。\n\nCBF 由多个元素支持。例如，一个组织在互联网上销售产品。图 10-1、10-2 和 10-3 显示了完整交易中不同的支持性元素。通过分析这些元素，就可以识别出\
  \ CBF。\n\n在图 10-1 中，客户进行购买。在这个示例中，客户从一个互联网 Web 服务器购买产品，后端数据库服务器记录了该交易。\n\n![图 10-1\
  \ 关键业务功能：购买产品](img/9781284183719_CH10_FIGF01.png)\n\n**图 10-1** 关键业务功能：购买产品。\n\n\
  这里的 CBF 是：\n\n*   **互联网访问**——Web 服务器必须具有可靠的互联网访问能力。如果互联网访问失败，客户将无法访问 Web 服务器。\n\
  *   **Web 服务器可用性**——Web 服务器必须处于运行，这包括 Web 服务器和 Web 应用程序。如果 Web 服务器失败，客户将无法完成购买。\n\
  *   **数据库服务器可用性**——数据库服务器记录交易，包括客户详情、购买的产品和支付信息。如果数据库服务器失败，Web 应用程序将无法完成交易。\n\n\
  图 10-2 显示了如何接收款项。虽然支付处理通常作为交易的一部分发生，但在这里为了清晰起见将其分开了。信用卡交易在互联网上很常见，使用这些技术的组织必须遵守支付卡行业数据安全标准（`PCI\
  \ DSS`）来处理它们。Web 应用程序使用数据库中的数据来识别信用卡支付详情，然后向相应的银行发送支付请求。\n\n![图 10-2 关键业务功能：接收资金](img/9781284183719_CH10_FIGF02.png)\n\
  \n**图 10-2** 关键业务功能：接收资金。\n\n这一步需要与购买步骤相同的 CBF，以及一个额外的元素。需要符合 `PCI DSS` 合规，这确保了组织满足了信用卡数据的最低安全标准。如果组织不符合\
  \ `PCI DSS` 规定，它可能会失去处理信用卡的能力，并可能被罚款。\n\n### ![](img/Note.png) 注意事项\n\n`PCI DSS`\
  \ 将在本章稍后的“法律要求、合规法律、法规和指令”部分进行讨论。\n\n图 10-3 显示了该流程的最后一步，员工使用仓库应用程序来识别要发货的产品。该应用程序与数据库服务器交互，服务器中包含购买的产品、客户和产品位置的详情。然后，仓库员工将产品发给客户。\n\
  \n![图 10-3 关键业务功能：发货产品](img/9781284183719_CH10_FIGF03.png)\n\n**图 10-3** 关键业务功能：发货产品。\n\
  \n这一步需要与购买步骤相同的 CBF 以及一个额外的元素。\n\n*   **仓库应用程序**——该应用程序必须可用，以便员工识别发货的产品。如果应用程序不可用，发货将停止。\n\
  *   **数据库服务器**——数据库服务器包含购买的产品、客户和产品位置的详情，供交互。如果服务器不可用，发货将停止。\n*   **员工**——员工负责发货产品。即使组织已经自动化了部分功能，人工操作仍然是必要的。这对于质量控制至关重要。\n\
  *   **仓库**——产品在仓库中存储并发货。如果仓库受损，将产生两方面影响：首先，库存可能会丢失；其次，发货可能会停止。如果仓库区域受损，发货将完全停止。如果产品受损，发货可能会延迟。\n\
  \n### ![](img/Tip.png) 提示\n\n仓库服务器持有与 Web 服务器许多相同的数据，但由于其可用性需求不同，通常是分开的。Web 应用程序需要一直运行，而仓库应用程序在发货时需要。自动化技术会定期将数据从\
  \ Web 服务器移动到仓库服务器。\n\n在确定了 CBF 后，现在可以将转向风险管理。对这些功能可以进行审查，以确保已采取适当措施。\n\n请注意，某些功能需要不同级别的保护。例如，Web\
  \ 服务器和数据库服务器需要一直运行，因此它们的 MAO 很短。如果服务器故障，可能需要故障集群来确保服务继续运行。然而，发货可能每周只需要六天，这意味着仓库服务器不需要同样的保护。该服务器的\
  \ MAO 会长得多。\n\n#### 典型基础设施的七个领域\n\n也可以审查典型基础设施的七个领域以识别风险。通过查看这些领域，可以确定组织所需的风险管理范围。图\
  \ 10-4 显示了典型基础设施的七个领域。\n\n![图 10-4 典型基础设施的七个领域](img/9781284183719_CH10_FIGF04.png)\n\
  \n**图 10-4** 典型基础设施的七个领域。\n\n### 用户领域\n\n每个组织都有用户，因为尽管计算机可以做很多，但还不能完成一切。相反，计算机是用来支持用户的。因此，查看与用户相关的风险是非常重要的。与用户相关的主要的风险与社会工程有关，这涉及社会工程师试图欺骗用户提供信息或执行不安全的操作。\n\
  \n这些风险可以通过提高用户意识来缓解。提高用户意识包括制定接受使用政策（`AUP`），帮助用户了解他们应该和不应该做什么；使用登录横幅提醒用户 `AUP`；定期发送包含安全小贴士的邮件以保持用户的安全意识；在员工区域张贴告示以提高意识。\n\
  \n### 工作站领域\n\n工作领域由用户使用的计算机组成。在某些组织中，所有员工的桌上都有电脑，但在另一些组织中，台式计算机是有限的。例如，并不是每个仓库用户都需要电脑。\n\
  \n\n\n\n然而，当用户确实拥有计算机时，计算机就会面临风险。与工作站相关的一些主要风险与恶意软件。用户可以通过通用串行总线（`USB`）闪盘从家里带来恶意软件，可能会不小心从网站下载恶意软件，或者从恶意邮件中安装恶意软件。\n\
  \n主要的保护措施是确保安装了杀毒软件并定期更新杀毒特征，因为不能指望用户来保持特征库的更新。许多杀毒软件供应商提供了自动在工作站上安装和更新软件的工具。\n\n\
  操作系统也必须保持最新状态。当安全补丁发布时，应该根据需要进行评估和部署。许多此类安全补丁修复了漏洞；因此，如果没有补丁，系统将仍然处于漏洞状态。就像有工具可以确保杀毒软件保持更新一样，也有工具可以保持系统补丁。\n\
  \n## 局域域 (LAN Domain)\n\n局域域包括连接局域网（`LAN`）上系统的网络组件。这些组件包括硬件（如`routers`和交换机）以及用于将用户连接到`LAN`的布线和配线间。\n\
  \n计算机通常通过服务器访问网络资源。例如，在 Microsoft 环境中，客户端连接到 Microsoft 域，该域包含至少一个充当`domain controller`的服务器。在\
  \ Microsoft 域中，每个用户必须有一个账户才能登录域，每台计算机也必须在域中有一个账户。\n\n`LAN`域面临着巨大的风险。`routers`具有访问控制列表（`ACLs`），用于控制允许通过的流量，而`switches`可以针对特定功能进行编程。\n\
  \n`routers`和`switches`通常位于配线间或机房，这有助于确保它们受到物理安全保护。如果攻击者对这些设备拥有不受限制的访问，`ACLs`可能会被修改，或者攻击者可以连接无线接入点来捕获并传输通过任何此类设备的流量。\n\
  \n许多组织还实施`port security`（端口安全）作为一种额外控制。`port security`确保只有特定的计算机能够连接到网络设备，这意味着如果攻击者带来一台计算机，他或她将无法将计算机连接到网络。\n\
  \n## 局域网到广域网 (LAN-to-WAN Domain)\n\n`LAN-to-WAN`域标记了私有网络与公共网络相遇的边界。在此背景下，公共网络是指互联网。\n\
  \n有几种类型的攻击来自互联网。这里的要保护措施是使用一个或多个`firewalls`。`firewalls`可以在流量通过时对其检查并根据规则允许或阻止流量。\n\
  \n尽管大多数组织都部署了`firewalls`，但这里的关注关注是`firewalls`的管理。常见问题是防火墙规则过多导致流量过多。防火墙应该区分并仅允许某些类型的流量。\n\
  \n组织通常使用复杂的硬件`firewalls`。管理员通常需要额外的培训以确保他们知道如何管理和维护它们。经过培训的管理员理解限制防火墙规则数量的重要性。\n\
  \n## 广域域 (WAN Domain)\n\n`WAN`域包括所有可以通过广域网（`WAN`）访问的系统。这些系统指的是通过互联网访问的服务器。\n\n互联网上的可用服务器具有公网协议（`IP`）地址。可以从互联网上的任何系统访问，这使得它们成为容易攻击的目标。\n\
  \n`WAN`域系统的主要保护方法是使用非军事化区（`DMZ`）。`DMZ`使用两个`firewalls`，其中一个直接访问互联网，另一个直接访问内部网络。两个`firewalls`之间的区域被称为`DMZ`。\n\
  \n### ![](img/Note.png)备注\n\n`WAN`域也可以包括通过`WAN`链路访问的系统，该链路是半私有的。例如，一个组织可以从电信公司租赁其他客户共享的线路。这些线路不像互联网那样公开，但该组织的系统仍然容易受到其他租用相同线路的客户的攻击。\n\
  \n尽管`DMZ`不能阻止攻击者访问服务器，但它可以限制攻击者的访问。例如，可以将 Web 服务器放置在`DMZ`中以托管网站。未安全的服务器和安全的 Web\
  \ 服务器都使用超文本传输协议（`HTTP`）。`HTTP`和安全超文本传输协议（`HTTPS`）的已知端口分别为`80`和`443`。`DMZ`可以配置为仅允许通过端口`80`和`443`访问\
  \ Web 服务器的流量，并阻塞所有其他流量。\n\n这些服务器也需要保持最新状态。当发布安全补丁时，应尽快进行评估然后进行测试以确保它们没有任何负面影响，之后即可部署到服务器上。\n\
  \n### ![](img/Note.png)备注\n\n`DMZ`通常使用两个`firewalls`。面向公众的服务器配置在两个`firewalls`之间的`DMZ`中。\n\
  \n## 远程访问域 (Remote Access Domain)\n\n远程访问域允许远程用户访问私有网络。如果远程访问服务器是拨号服务器，用户就可以拨入。虽然拨号服务器不再那么常见，但它们仍在使用。一种更流行的选项是`VPN`，它允许用户通过公共网络（如互联网）访问私有网络。\n\
  \n利用拨号远程访问服务器的组织需要意识到系统从任何电话可访问的相关风险，这意味着攻击者只需要知道电话号码就可以攻击。利用`VPN`服务器的组织也需要意识到`VPN`服务器拥有可以在互联网任何地方公开获取的`IP`地址的风险，这使其容易受到全球任何地的攻击。\n\
  \n组织可以使用不同的控制措施来保护远程访问域的服务器。自动回拨（Automatic callback）是拨号远程访问服务器的一种方法，尽管这种方法现在很少使用。例如，Sally\
  \ 在家里工作。她的账户信息包括电话号码。当她拨入时，会提示她登录。一旦她登录，远程服务器就会挂断并拨打她的家庭号码。\n\n远程访问策略是远程访问的另一种控制措施。策略用于指定多个条件以确保连接安全。例如，策略可以允许二层隧道协议（`L2TP`）连接。此外，可能需要\
  \ IP 安全协议（`IPSec`）来加密连接。\n\n### ![](img/Note.png)备注\n\n定位远程访问服务器的一种旧技术是盲打（war dialing）。攻击者随机拨号直到调制调器响应。一旦调制调器响应，攻击者尝试登录。\n\
  \n远程访问监控是远程访问的另一种控制措施。它报告远程用户的活动，包括他们在`VPN`连接期间的状态。监控控制用于跟踪客户端连接，包括各种服务器配置的连接数量和时长。\n\
  \n## 系统/应用程序域 (System/Application Domain)\n\n系统/应用程序域包含基于服务器的应用程序，包括电子邮件服务器和数据库服务器，以及带有专用程序的服务器或系统。\n\
  \n例如，`Oracle Database`在服务器上托管数据库，`Microsoft Exchange`是流行的电子邮件服务器，而`Apache`在 Web\
  \ 服务器上托管 Web 应用程序。这些应用程序中的每一个都是专业的，每个都有其独特的风险。它们通常需要专业知识来进行管理和配置。此外，它们需要关注细节以保持安全。\n\
  \n\n\n\n保持这些系统安全的首要要求是确保管理员拥有充分的培训和知识。此外，配置和变更管理实践也是有帮助的。配置确保确保使用健全的安全实践进行配置，而变更管理则确保配置在没有经过充分审查的情况下不被修改。\n\
  \n系统应用程序通常存在漏洞，供应商在识别出这些漏洞后会发布安全补丁。这些系统的管理员需要与供应商保持密切联系，以便在补丁发布时获知。遗憾的是，某些补丁会导致其他问题，例如系统崩溃；因此，管理员通常会对补丁进行测试，以确保它们没有负面影响，然后再应用。此外，他们经常使用软件来验证系统是否安装了最新补丁。当系统未更新时，软件会向管理员发送警报。在某些组织中，网络访问控制（`NAC`）会隔离未修复的系统。在软件更新之前，对这些系统的访问将受到限制。\n\
  \n## 信息系统差距\n\n信息系统安全差距是指已实施措施与所需措施之间的差异。在完美的世界中，已实施措施应该应对所有的威胁和漏洞。然而，威胁和漏洞是在不断变化的。\n\
  \n## 深度防御\n\n即使你有激进的风险管理和缓解计划，安全差距通常也会存在。任何时候保持系统 100%的安全是不可能的。然而，`深度防御`是一种增加了多个层保护的安全实践。即使某一层出现了差距，它也有很大可能仍然受到另一层的保护。例如，防病毒保护通常采用三管齐下的方法：防病毒软件安装在防火墙上以扫描传入的数据，安装在电子邮件服务器上扫描恶意附件，并安装在所有工作站和服务器上。既然防火墙和电子邮件服务器已经在扫描恶意软件，为什么要在桌面系统中安装防病毒软件呢？原因是用户可以通过`CD`、`DVD`或`USB\
  \ flash drive`传输病毒。此外，尽管防病毒软件保护了桌面系统，但还需要额外的防病毒软件来扫描电子邮件。恶意软件主要通过电子邮件发送；因此，如果电子邮件服务器没有安装防病毒软件，它会将恶意软件转发给客户端。如果某个系统没有更新或防病毒软件出现故障，它将被感染，并可能迅速扩散。深度防御在短期内成本更高，但它能缩小更多的安全差距，从长远来看可以节省资金。\n\
  \n风险评估提供了一个时间点的报告。它可以用于将现有的威胁和漏洞与已实施的措施进行比较。即使上一次风险评估是完美的，它也无法解决评估完成后出现的威胁和漏洞。差距分析报告通常用于处理法律合规性。例如，在审查对《健康保险流动性与责任法》（`HIPAA`）或《萨班斯-奥克斯利法》（`SOX`）的合规情况时可以使用差距分析。差距分析报告记录了安全差距，并与修复计划相结合，确定如何缩小安全差距，即对实施哪些控制措施提供建议。\n\
  \n## 理解并评估法律和合规问题对组织的影响\n\n组织必须知道适用于它的法律法规，因为不合规可能会导致严重后果。某些法律会对组织处巨额罚款，某些法律可能导致监禁，某些法律可能会对组织的业务能力产生负面影响。一旦确定了相关的法律法规，组织就需要确保其合规性。在这种背景下，合规是一种缓解控制。实施控制措施是为了通过减少或中化威胁或漏洞到可接受的水平来降低风险。\n\
  \n例如，《健康保险流动性与责任法》（`HIPAA`）错误的罚款每年可能高达 25,000 美元，而《通用数据保护条例》（`GDPR`）的罚款可能高达 2200\
  \ 万美元或企业年度营业额的 4%，以较高者为准。内部合规计划可以确保这些昂贵的错误不再发生。在评估组织合规问题对组织的影响时，需要采取两个不同的步骤：第一步是识别适用于组织的合规问题，第二步是评估这些问题对组织业务运营的影响。\n\
  \n## 合规法律的增长\n\n贪婪和腐败可能渗透到任何地方，包括大型组织。当问题被发现时，人们会感到愤怒并要求正义。在美国，国会制定法律来提供这种正义。在过去的几十年里，合规变得越来越重要。20\
  \ 世纪 60 年代，通用电气和西屋斯豪电气被定罪违反了多项反垄断条例。他们是一场范围围投标和价格操纵阴谋的一部分。国会于 1977 年颁布了《反海外腐败法》（`FCPA`）作为回应。\n\
  \n1991 年，《美国联邦组织伦理判刑指南》法案通过。它包含了对组织犯罪行为进行处罚的条款，以及检测和预防犯罪的激励措施。\n\n安然丑闻发生在 2001 年。一群高管在多年里利用各种策略隐藏了由于失败的交易和项目产生的数十亿美元债务。当他们被暴露时，安然的股票价格从每股\
  \ 90 美元跌至不足 1 美元，导致投资者遭受了约 110 亿美元的损失。几名高管被起诉并判处监。\n\nWorldCom 的高管在多年里利用各种策略人为将公司价值夸大了约\
  \ 110 亿美元。当首席执行官（`CEO`）在 2002 年 4 月被下台时，事情开始崩塌，2002 年 6 月，欺诈行为被发现。WorldCom 于 2002\
  \ 年 7 月申请破产，从未偿还大部分债权人的债务。WorldCom 的一些高管也被起诉并判处监。\n\n国会通过法律扩大上市公司财务报告的可靠性来回应这些丑闻。《萨班斯-奥克斯利法》就是此类法律。它增加了对欺骗股东的处罚，并对内部控制实施了更严格的要求。\n\
  \n随后，在 2006 年，美国住房泡沫破灭，导致房价下跌。不幸的是，许多房屋是靠不可靠的次级贷款融资的，导致 2007 年出现了大量抵押赎回。2007 年有超过\
  \ 25 家次级贷款机构破产。这种情况在 2008 年大型全球性银行雷曼兄弟破产时达到了关键阶段。这些事件引发了通常被称为“大衰退”的全球衰退。\n\n\n\n\
  \n许多银行购买了保险来应对因保险巨头 AIG 造成的损失。然而，AIG 无法承担这些损失，自身也面临破产的风险。美国政府在 2008 年通过 850 亿美元的救助使\
  \ AIG 免于破产。随后，美国政府又向 AIG 提供了额外的 378 亿美元。国会于 2008 年底通过了问题资产救援计划（TARP）。TARP 救了许多其他金融公司。国会授权通过\
  \ TARP 支出 7000 亿美元，但政府仅支付了 431 亿美元。截至 2012 年 12 月，美国政府已收回了这些资金中的 405 多亿美元。\n\n国会通过《多德-弗兰克华街改革与消费者保护法案》对次贷贷款危机做出回应。许多专家认为，金融监管的缺失导致了大衰条的发生。多德-弗兰克法的目标之一是防止类似的金融危机发生。虽然多德-弗兰克法对\
  \ IT 资源的影响没有《萨班斯-奥克斯利法案》那么直接，但它确实适用于金融组织的 IT 资源。\n\n这些事件绝不能代表完整的历史，因为还存在更多的欺诈和丑闻。然而，它们提供了一个观察腐败如何增长以及国会如何做出反应的局部视角。\n\
  \n企业合规在某些组织中已变得如此重要，以至于他们了一个新职位：首席合规官（CCO）。有些公司使用首席伦理合规官（CECO）或伦理合规官（ECO）称号。\n\n\
  ## 法律要求、合规法律、法规和指令\n\n尽管有许多适用于 IT 的法律法规，但并非所有法律法规都适用于 IT。因此，首先需要理解的重要问题之一是哪些法律适用于某个组织。\n\
  \n提醒一下，适用于组织的一些关键法律包括：\n\n- 《健康保险可携带性与责任法法案》（`HIPAA`，1996 年颁布）\n- 《萨班斯-奥克斯利法案》（`SOX`，2002\
  \ 年颁布）\n- 《联邦信息安全管理法》（`FISMA`，2002 年颁布）\n- 《联邦信息安全现代化法案》（`FISMA`，2014 年颁布）\n- 《家庭教育权利与隐私法案》（`FERPA`，1974\
  \ 年颁布）\n- 《儿童互联网保护法案》（`CIPA`，2000 年颁布）\n- 《支付卡行业数据安全标准》（`PCI DSS`，2004 年颁布）\n- 《格雷姆-里奇-布莱利法案》（`GLBA`，1999\
  \ 年颁布）\n- 《通用数据保护条例》（`GDPR`，2018 年颁布）\n\n以下章节识别了组织如何确定某法律是否适用于自己。某些法律的范围特定且狭，而另一些法律（如\
  \ `HIPAA`）则适用于广泛组织。\n\n### 健康保险可携带性与责任法案 (HIPAA)\n\n`HIPAA` 适用于处理健康信息的组织。处理健康信息的明显组织是医院和诊所。然而，`HIPAA`\
  \ 的范围远超医疗行业。\n\n健康信息包括任何与个人健康相关的数据。这些数据包括个人的过去、现在和未来的健康；状况、身体健康或心理健康；以及任何过去、现在或未来的医疗费用。如果一个组织创建或接收了健康信息，它必须遵守\
  \ `HIPAA`，这包括雇主、健康计划赞助者、医疗保健供应商、公共卫生部门等。如果一个组织没有参与医疗保健但提供了健康计划，它也属于 `HIPAA` 范围。\n\
  \n### 萨班斯-奥克斯利法案 (SOX)\n\n`SOX` 适用于任何要求向证券交易委员会注册的业务，包括所有上市公司。换句话说，如果有人可以购买公司的股票，那么\
  \ `SOX` 就适用。\n\n`SOX` 建立了一套标准。即使这些标准不直接适用于私营企业，私营企业也可以使用这些标准。如果组织以后面临法律问题，可以将其行为解释为避免这些问题的诚意努力。\n\
  \n### 联邦信息安全管理法 (FISMA)\n\n`FISMA` 适用于所有美国联邦机构。其目标是确保联邦机构采取措施保护其数据。\n\n美国国家标准与技术研究所（`NIST`）受\
  \ `FISMA` 委托，制定标准、指南和最佳实践以支持 `FISMA`。`NIST` 为 `FISMA` 创建的特殊出版物可在 http://csrc.nist.gov/publications/PubsSPs.html\
  \ 获取。\n\n### 家庭教育权利与隐私法案 (FERPA)\n\n`FERPA` 适用于所有接受美国教育部（`ED`）所管理的任何计划资助的教育机构和机构。\n\
  \n明显的例子是任何从学前班到 12 年级的公立学校。然而，许多多 其他实体也可以从 `ED` 获得资助，包括任何提供学前项目的学校或机构，以及任何高等教育机构，如学院和大学。\n\
  \n资助通常是间接的。虽然公立小学直接从 `ED` 接收资助，但其他机构是间接接收资助。`ED` 为大学提供助学金和拨款。如果大学接收了这些资金并用于支付费用，就属于\
  \ `ED` 资助。\n\n`ED` 在 2012 年更新了 `FERPA`。修订允许披露更多学生个人信息和学校目录信息。它们还监管了学生 ID 和电子邮件地址。\n\
  \n### 儿童互联网保护法 (CIPA)\n\n`CIPA` 适用于任何接收联邦通信委员会（`FCC`）赞助的美国 E-Rate 计划的学校或图书馆。该计划为互联网访问提供折扣。\n\
  \n学校和图书馆并非必须使用 E-Rate 计划，但如果他们选择利用折扣，学校和图书馆就受 `CIPA` 管理。每年的 E-Rate 要求学校和图书馆证明它们遵守\
  \ `CIPA`。\n\n### 支付卡行业数据安全标准 (PCI DSS)\n\n`PCI DSS` 并不是法律。相反，它是由几家信用卡公司共同创建的标准，由支付卡行业（`PCI`）安全委员会监督。任何接受信用卡支付的组织都必须遵守。\n\
  \n许多信用卡公司支持 `PCI DSS`。包括 `Visa International`、`MasterCard Worldwide`、`American Express`、`Discover\
  \ Financial Services` 和 JCB International。PCI 安全委员会包含了这些公司的员工。\n\n较小的公司可以通过完成自评估问卷来证明其合规，而大型组织则由合格的安全评估师进行独立审计。\n\
  \nPCI 安全委员会于 2018 年 5 月发布了 `PCI DSS v3.2`。\n\n![](img/Tip.png)\n提示：`PCI` 合规与 `PCI\
  \ DSS` 合规是一个意思的。\n\n### 通用数据保护条例 (GDPR)\n\n`GDPR` 是一项关于数据和隐私保护的欧盟法规。该法律解决了欧盟和欧洲经济区（EEA）居民个人信息传输到该地区之外的问题。该法律旨在让该地区的个人对其自己的个人数据和信息拥有控制权，特别是涉及在欧盟和\
  \ EEA 之外交易的国际组织。该法律适用于任何业务，无论其位置和数据主体国籍如何。\n\n\n\n\n法律将数据控制者与数据处理者区分开来。数据控制者决定所收集个人数据的目的及其处理方式的实体或个人。另一方面，数据处理者是代表控制者行动的实体或个人，但不控制者的员工。该法律受多项隐私保护原则的支持。《通用数据保护条例》（GDPR）是所有网站请求许可使用\
  \ cookie 的主要原因，这些 cookie 允许他们追踪访问。\n\n## 评估法律和合规问题对组织业务运营的影响\n\n一旦确定了组织的合规要求，下一步就是确定这些要求对组织产生的影响。根据所适用的法律或标准，这种影响可能会有显著差异。\n\
  \n接下来的章节介绍了了一些常见法律和标准可能产生的影响。\n\n### 《健康保险可携带性与责任法》(HIPAA)\n\nHIPAA 影响到业务的各个领域，且不合规的成本很高。合规所需的步骤可能非常复杂，取决于组织处理健康相关信息的量。\n\
  \n首先，如果不遵守规则，处罚将非常严厉。组织每每次违规可能被处以 100 美元的罚款，每年最高可达 25,000 美元。如果有人故意获取或发布其不应拥有的数据，处罚最高可达\
  \ 50,000 美元并监禁一年。如果通过伪装获取或披露数据，处罚最高可达 100,000 美元并监禁五年。如果为了个人利益或恶意伤害获取或披露数据，处罚最高可达\
  \ 250,000 美元并监禁 10 年。\n\n然而，合规也可能是昂贵的。处理健康数据的组织必须采取特定步骤来保护数据，包括保护他们创建、接收或发送的任何数据，以及保护处理健康数据的任何系统。\n\
  \n保持数据安全的责任由组织承担。数据在静态存储时必须受到保护，这意味着当数据存储在硬盘或文件柜中时，必须对其进行保护。根据数据的类型，可以通过访问控制或物理安全来对静态数据进行保护。\n\
  \n对健康信息的使用受到限制。处理和审查健康信息的员工必须接受培训，以便他们了解要求。例如，在没有患者书面同意的情况下，不能向第三方发布数据。\n\n数据在传输时也必须受到保护。当传输任何健康数据时，必须以特定的格式进行传输。好消息是，健康计划提供者非常精通\
  \ HIPAA。外包健康计划的公司也可以外包健康数据的处理。例如，可以委托一家健康计划提供者为员工提供保险，然后员工可以被引导至健康计划提供者的网站进行注册。当以这种方式管理健康计划时，提供者托管了几乎所有的信息。源公司的数据非常少，其风险也十分有限。\n\
  \n### 《萨班斯-奥克斯利法》(SOX)\n\nSOX 对业务的影响是对数据准确性承担极高的法律责任。高层官员，如首席执行官（CEO）和首席财务官（CFO），必须亲自验证并证明财务数据的准确性。其目标是避免重大丑闻，例如安然（Enron）投资者损失的\
  \ 110 亿美元。\n\n由于这种高责任，组织被采取额外步骤来确保数据的准确性和完整性，包括实施内部控制并要求内部和外部审计以验证合规性。两个主要优点是：SOX\
  \ 增强了高管为了股东利益行动的责任感，其要求的监控有助于对内部成本提供更好的控制。\n\n一些 SOX 的反对者认为合规成本过高。然而，根据 Protiviti\
  \ 2013 年的一项调查，大多数组织的合规成本是可控的。\n\n### 《联邦信息安全管理法》(FISMA)\n\n由于 FISMA 仅适用于联邦机构，因此它不影响任何组织的收入。然而，它可能对运营产生重大影响。\n\
  \nFISMA 的核心要求是对组织内所有的 IT 系统进行识别、合规性认证和运行授权，这一过程可能非常漫长。主要问题之一是新系统的实施速度缓慢。\n\nFISMA\
  \ 鼓励使用基准（baselines）。只要一个系统遵循与另一个系统相同的基准，就可以快速获得认证和授权。\n\n![Note](img/Note.png)\n\
  > 基准是任何已知的起点。IT 系统的基准代表了与另一个系统相同的硬件、软件和配置。例如，如果一台服务器已使用基准获得了授权，那么另一台服务器就可以使用相同的基准更快速地获得授权。\n\
  \n### 《家庭教育权利与隐私法》(FERPA)\n\nFERPA 要求受保护的组织与学生或其父母分享学生记录。如果学生或家长提出请求，学校必须遵守。\n\n\
  学生或家长可以请求更正学生记录中的错误，学校有义务考虑该请求。然而，学校并不要求执行学生要求的所有更改。例如，如果学生请求从记录中删除一个低分，但该分数是准确的，学校没有要求将其删除。\n\
  \n学生可以授予特定第三方访问其记录的权限。例如，学生在申请学院或大学录取时可能会授予访问权限。某些特定的第三方会自动获得记录的访问权限。例如，许多学校官员不需要学生的许可即可查看记录。\n\
  \nFERPA 对业务运营最大的影响是确保员工了解规则，这可以通过培训来实现。如果一个 18 周岁以下的学生请求访问其记录，员工应该知道该权利属于父母。如果一个\
  \ 20 岁学生的父母请求访问，员工应该知道该权利属于学生。同样，如果第三方请求访问，员工应该知道是否应该授予访问权限。\n\n![Tip](img/Tip.png)\n\
  > FERPA 为 18 岁以下学生的父母赋予了特定权利。然而，当学生满 18 岁时，这些权利转移给学生，在没有学生知情和同意的情况下，父母不再拥有这些信息的权利。\n\
  \n### 《儿童网络保护法》(CIPA)\n\nCIPA 对学校和图书馆实施了多项技术要求。他们必须能够过滤不良内容，以确保未成年人不会接触这些内容。如果学校或图书馆无法遵守\
  \ CIPA，将面临失去所有 E-Rate 折扣的风险。\n\nE-Rate 资助 为学校和图书馆提供互联网接入折扣。任何根据 E-Rate 项目申请折扣的学校或图书馆都必须证明其遵守\
  \ CIPA 规则。\n\n\n\n\n学校和图书馆通过技术保护措施（`TPM`）对内容进行过滤。`FIGURE 10-5` 显示了作为 `TPM` 的代理服务器示例。代理服务器接收客户端的网页请求，检索网页，然后将网页发送给客户端。它还可以过滤请求以拦截内容请求。\n\
  \n![FIGURE 10-5 用作 TPM 使用的代理服务器。](img/9781284183719_CH10_FIGF05.png)\n\n`FIGURE\
  \ 10-5` 代理服务器用作 TPM 使用的。\n\n用户能够通过代理服务器访问互联网。所有内容请求都通过内容过滤器进行过滤。如果内容可以接受，则检索页面并发送给客户端。如果内容不可接受，则拦截内容。\n\
  \n代理服务器通常与第三方服务的数据配合，该服务提供需要过滤的内容列表。该列表通常采用特定网站统一资源定位符（即 `URLs`）的形式。代理服务器使用此列表防止内容到达请求的计算机。\n\
  \nCIPA 将“未成年人”定义为 17 岁以下的任何人。他们的访问应该受到 `TPM` 的限制。然而，任何 17 岁或以上的人都应该能够无限制地使用计算机。例如，如果成年人想使用，他或她可以请求移除\
  \ `TPM` 过滤器。管理员或管理员应该能够及时移除过滤器。\n\n#### 通用数据条例 (GDPR)\n\nGDPR 要求数据控制者和处理者采取适当的技术和组织措施，以保护欧盟/欧洲经济区公民的隐私。GDPR\
  \ 围绕以下原则构建：\n\n*   与个人数据处理相关的原则\n*   处理的合法性\n*   同意的条件\n*   与信息社会服务相关的儿童同意适用条件\n\
  *   特殊类别个人数据的处理\n*   与刑事判决和犯罪相关的个人数据的处理\n*   不需要身份的处理\n\n### 支付卡行业数据安全标准 (PCI DSS)\n\
  \nPCI DSS 围绕以下六个原则和 12 项要求构建：\n\n*   **构建并维护安全网络** \n    * `Requirement 1`: 安装并维护防火墙。\n\
  \    * `Requirement 2`: 不要使用默认设置，例如默认密码。\n*   **保护持卡人数据** \n    * `Requirement 3`:\
  \ 保护存储的数据。\n    * `Requirement 4`: 加密传输。\n*   **维护漏洞管理计划** \n    * `Requirement\
  \ 5`: 使用并更新防病毒软件。\n    * `Requirement 6`: 开发并维护安全系统。\n*   **实施强力访问控制措施** \n    *\
  \ `Requirement 7`: 限制对数据的访问。\n    * `Requirement 8`: 为每个用户使用唯一的登录名。不要共享用户名和密码。\n\
  \    * `Requirement 9`: 限制物理访问。\n*   **定期监控和测试网络** \n    * `Requirement 10`: 跟踪并监控对系统和数据的所有访问。\n\
  \    * `Requirement 11`: 定期测试安全性。\n*   **维护信息安全策略** \n    * `Requirement 12`: 维护安全策略。\n\
  \n所有原则和平都与 IT 相关，但它们也反映了许多常见的最佳实践。如果一个机构在使用最佳实践，`PCI DSS` 对其业务运营不会产生太大影响。然而，如果一个机构目前未使用常用的安全实践，`PCI\
  \ DSS` 合规可能会影响其预算和运营。\n\n#### 为组织翻译法律和合规影响\n\n合规影响可能会产生深远的影响。与其他威胁和漏洞一样，损失既可能是直接的也是间接的。例如，如果一个机构因与\
  \ `HIPAA` 相关的错误被罚 10,000 美元，直接损失是 10,000 美元。然而，一旦这些信息登上新闻，该机构将面临间接损失。\n\n媒体可能会报告某公司处理不当数据。有时，公关（PR）可以恢复组织的声誉。有效的公关活动需要人才和资金来实施。积极的公关活动可以减少事件的影响。\n\
  \n#### 法律和合规影响对典型基础设施七领域的影响评估\n\n之前介绍了典型基础设施的七领域。在评估法律和合规影响时，对这些每个领域的影响如下：\n\n*\
  \   **用户领域**：大多数合规问题影响用户领域。用户需要接受培训以合规。例如，HIPAA 要求用户了解可以提供的数据，CIPA 要求用户了解关闭 `TPM`，`PCI\
  \ DSS` 要求用户使用唯一的登录名。\n*   **工作站领域**：存储在工作站上的 `HIPAA` 或 `SOX` 数据需要接受检查。访问控制应确保实施最小权限原则。许多小型公司将台式电脑作为\
  \ `POS` 系统。`POS` 系统是电子收银机，它需要符合 `PCI DSS`。任何桌面系统都需要安装防病毒软件。\n*   **局域网领域**：LAN 需要安全以防止攻击者获取数据，其中包括\
  \ `HIPAA`、`SOX` 和 `PCI DSS` 数据。可能需要加密技术来确保传输的安全，在组织使用无线网络时尤其如此。过去，攻击者在停车场获取了无线交易详情。\n\
  *   **局域网到广域网领域**：防火墙保护 LAN 免受潜在的 WAN 攻击，`PCI DSS` 特别要求防火墙。图书馆可能使用代理服务器作为 `TPM`\
  \ 以遵守 `CIPA`。代理服务器可以访问互联网和内部网，因此需要额外的安全性来防止外部攻击。\n*   **广域网领域**：某些 `PCI DSS` 系统可能直接访问互联网以传输数据；因此它们需要额外的保护。例如，传输需要加密，系统需要受到可能访问存储数据的攻击者的保护。\n\
  *   **远程访问领域**：许多组织使用 `VPN` 连接主办公室和远程办公室。许多法律规定保护数据传输。如果用户通过 `VPN` 传输敏感数据，则必须验证\
  \ `VPN` 是安全的。例如，如果用户通过 `VPN` 传输 `HIPAA` 数据，则应进行加密。\n*   **系统/应用领域**：受 `HIPAA` 和\
  \ `SOX` 监管的健康数据和财务数据通常托管在数据库服务器上，这些服务器需要检查以确保符合这些法律。访问控制应确保实施最小权限原则。\n\n#### 安全措施、控制和保护措施如何协助缓解风险\n\
  \n\n\n\n\n控制、对措施和保护措施的主要目的是缓解风险。控制是在特定时间实施的，以减少当时的风险。然而，威胁和漏洞会不断变化，正因为它们会变化，控制的有效性也会随之改变。因此，定期评估控制以确保其有效性非常重要。\n\
  \n控制的有效性可以通过确定其与其目标的契合程度来衡量。控制将通过以下方式尝试缓解风险：\n\n*   **将威胁的影响降低到可接受的水平**——例如，飓风威胁是无法避免的，但确定业务备选地的业务连续性计划可以减少这种威胁。\n\
  *   **将漏洞降低到可接受的水平**——例如，某些拒绝服务（DoS）攻击可以导致未补补的服务器崩溃。通过保持服务器更新最新补丁，它们对已知 DoS 攻击的脆弱性就会降低。\n\
  \n风险评估将评估特定时间的威胁和漏洞，并根据执行评估时的已知风险推荐控制措施。评估应定期进行。\n\n此外，如果控制发生了变化，也应该重复风险评估。例如，如果将硬件防火墙更换为不同的型号，原始的风险评估将不再有效，应根据新防火墙重新进行。\n\
  \n### ![](img/Tip.png) 提示\n\n`countermeasure`（对措施）、`safeguard`（保护措施）和 `control`（控制）这些术语可以通用使用。它们都用于缓解风险。\n\
  \n## 理解法律和合规要求的运营影响\n\n合规要求通常会影响系统的运行。在考虑法律和合规要求时，需要考虑合规性如何影响运营。\n\n以下是一些示例：\n\n\
  *   **HIPAA**——`HIPAA` 要求保护所有健康相关数据。当这些数据以电子形式存储时，使用网络中的标准访问控制更容易进行。公司可能会从纸质记录转换为计算机记录，这将影响员工访问数据的方式，并代表了操作程序的变更。\n\
  *   **SOX**——`SOX` 要求保护财务数据，这些数据可能存储在数据库服务器上。如果是这样，该服务器将受到其他数据库服务器可能不需要的额外控制限制。管理员可能需要采取额外步骤来保护数据和访问数据的用户。\n\
  *   **FISMA**——`FISMA` 要求政府机构购买和部署系统时遵循特定程序。如果公司在常规范围之外购买系统，获取认证和授权的过程可能会很长，这种延迟可能会影响机构及时部署新系统的能力。\n\
  *   **FERPA**——`FERPA` 规定学生或父母可以访问教育记录。如果学校有大量此类请求，其正常运营可能会受到影响。为了避免这种情况，学校可以选择限制授予记录的时间。\n\
  *   **CIPA**——`CIPA` 要求保护未成年人免受攻击性内容的影响，但成年人应该能够不受限制地访问。图书管理员过去可能不需要管理系统。但是，他们可能需要接受有关如何关闭用于成人访问的\
  \ `TPM` 的培训。\n*   **PCI DSS**——如果一个组织已经在执行标准的安全实践，`PCI DSS` 对正常运营的影响很小。然而，如果该组织的安全实践薄弱，`PCI\
  \ DSS` 标准可能会彻底改变运营。虽然从长远来看这是好事，但在短期内，用户可能可能感到不习惯。\n*   **GDPR**——`GDPR` 区分了数据控制者与数据处理者的职责和责任。数据控制者有义务仅聘用提供足够保证以实施适当的技术和组织措施来保护数据主体权利的处理者。处理者还必须遵循所有适用措施以保护数据主体的个人数据。\n\
  \n### 识别整个组织的风险缓解和风险降低要素\n\n虽然查看单个系统和功能以发现可能的风险很重要，但采取更广泛的视角同样重要。对组织的宏观视角可以识别所有部分是如何结合在一起的。\n\
  \n大多数组织都有由高层管理人员创建的安全策略。它制定了组织的安全哲学，并确定了宏观的安全目标。安全控制是根据安全策略的指导实施的。\n\n具有组织宏观视角的控制包括：\n\
  \n*   **账户管理控制**——这些控制确保账户管理的安全性。通过账户管理控制，每个用户都获得一个独立的账户，当用户离开时该账户会被禁用，并对账户使用密码管理策略。\n\
  *   **访问控制**——尽管控制应用于单个系统，但它们是使用全局系统创建的。例如，微软域使用 `Active Directory Domain Services`\
  \ 作为分配权限和控制访问的基础。大多数组织创建一个管理模型，定义如何使用组来组织用户。然后，将访问权限授予组而不是单个用户。最小权限是访问控制强制执行的核心原则。\n\
  *   **物理访问**——如果攻击者对系统不受限制的物理访问，那么侵入系统只是时间问题。因此，物理访问控制是必要的，通过限制对资产的物理访问来保护贵重资产。它们可以包括钥匙锁、密码锁、感应卡和闭路电视\
  \ (`CCTV`) 监控。\n*   **人员政策**——人员政策（如职责分离和强制休假）有助于防止欺诈。这些政策不是针对个人的，而是针对岗位的，例如人员可以接触组织资金的会计岗位。\n\
  *   **安全意识和培训**——某些培训针对特定群体（如经理或管理员），而其他培训提供给全体人员。无论如何，培训和意识计划可用于提高所有人员的安全意识。\n\n\
  还有许多额外的控制可供审查。这里最重要的一点是，组织的控制不应仅关注于单个系统。一个健全的安全计划将结合使用广泛和狭窄的安全控制。\n\n### 执行成本效益分析\n\
  \n在评估控制时，创建成本效益分析 (`CBA`) 是一个重要步骤。在成本效益分析中，将控制的成本与风险发生时的成本进行比较。如果实施控制的成本高于风险发生时的成本，那么该控制就不具有成本效益。\n\
  \n执行有效的 CBA 需要两项数据：控制成本和控制的预期收益。预期收益可以使用以下公式计算：\n\n```\n控制前的损失 － 控制后的损失 = 预期收益\n\
  ```\n\n然后，确定是否应该该控制可以使用此公式计算：\n\n```\n预期收益 － 控制成本 = 控制价值\n```\n\n如果结果为正值，则该控制是值得的；但如果结果为负值，则控制成本超过了收益，就不应该购买。\n\
  \n\n\n\n例如，某机构拥有一台托管大型数据库的数据库服务器，并定期完成备份。然而，风险评估确定备份副本存储在与备份服务器相同的房间内。此例中的风险是火灾可能会破坏服务器和所有备份磁带。通过在异地存储一份备份磁带的副本，可以消除这一风险。\n\
  \n### ![](img/Tip.png)提示\n\n成本效益分析（CBA）通常考虑单年度的收益和成本。如果某项控制措施的收益和成本相互接近，就可以计算购买该措施的投资回报率\
  \ (ROI)。投资回报率将指示该措施在其整个生命周期内的价值，并确定投资该措施所获得的货币收益。\n\n执行 CBA 的第一步是识别数据的价值。如果该数据库是该机构的主数据库，其价值可能高达数百万美元。在本例中，价值为\
  \ 100 万美元，这意味着在实施控制措施之前的完全损失为 100 万美元。\n\n外部公司可以每周取走磁带并将其存储在异地。外部公司还可以根据客户公司需要对磁带进行轮换。该服务的费用为每月\
  \ 100 美元，或每年 1200 美元。\n\n订阅此服务意味着最多丢失的数据为七天的量。如果火灾在最近一次备份磁带被取走之前毁了客户大楼，最后七天的数据将丢失。该周数据的价值为\
  \ 10,000 美元。\n\n有了这些信息，所有必要的数字已经确定，现在可以代入公式：控制措施前的损失为 100 万美元，控制措施后的损失为 10,000 美元，控制措施的成本为\
  \ 1200 美元。\n\n控制前损失 − 控制后损失 = 预期收益\n\n$1,000,000 − $10,000 = $990,000\n\n预期收益 −\
  \ 控制成本 = 控制措施价值\n\n$990,000 − $1,200 = $988,800\n\n这些数字显示了异地存储数据的价值，在尝试获得支持以批准购买该控制措施时将非常重要。如果在没有正当理由的情况下每年花费\
  \ 1200 美元，该请求可能会被拒绝。然而，如果提交的请求是为了通过投资 1200 美元来防止潜在 990,000 美元的损失，那么很有可能会获得批准。\n\n\
  ### ![](img/Note.png)注意\n\n虽然火灾险提供了一些数据损失保护，但如果发现机构存在疏忽，保险公司可能不会赔付。换句话说，如果机构没有采取将备份存储在异地的预防措施，保险公司可能不会为数据价值赔偿。保险公司会赔偿丢失的硬件，但可能不会赔偿丢失的数据。\n\
  \n### 贯穿机构风险缓解规划的最佳实践\n\n在为机构规划风险缓解策略时，可以使用几项最佳实践。这些包括：\n\n*   **审查历史文档**——历史文档包括之前的风险评估和业务影响分析（BIA）文档、政策和程序以及安全事件。尽管风险可能已经发生变化，但许多威胁和漏洞将保持不变。\n\
  *   **兼顾狭义和广泛的关注点**——可以识别针对特定系统和功能的特定风险及缓解策略，这代表了狭义关注。然而，关注范围也必须扩大到整个机构。例如，培训和意识计划有助于确保整个机构认识安全重要性。\n\
  *   **确保已识别管治法律**——花时间理解法律对于确定机构内部合规性至关重要。如果某法律适用于该机构，机构需要实施必要的步骤以确保合规。\n*   **在控制措施变更时重新进行风险评估**——风险评估是在特定时间完成的。因此，如果措施发生变化，风险评估将不再有效。\n\
  *   **包含 CBA**——CBA 为控制措施提供了理由并有助于确定其价值。CBA 明确证明了应该购买某项措施或该措施不值其成本。\n\n### 章总结\n\
  \n本章涵盖了贯穿整个机构风险缓解的重要要素。实施控制措施是通过减少威胁的影响或减少漏洞来降低风险，措施的有效性可以根据这两个要求进行衡量。它们在防止机构中任何关键业务操作的风险方面应该是最有效的。\n\
  \nIT 法律合规问题近年来变得越来越重要。适用的法律法规越来越多，不合规的成本可能非常高。因此，花时间识别相关法律和指南是重要的，因为法规对机构的影响各异，在实施支持性控制时应考虑这些因素。\n\
  \n### 核心概念和术语\n\n*   关键业务功能 (CBF)\n*   关键成功因素 (CSF)\n*   深度防御\n*   E-Rate 资助\n*\
  \   最大可停机时间 (MAO)\n*   代理服务器\n*   投资回报率 (ROI)\n*   服务水平协议 (SLA)\n*   技术保护措施 (TPM)\n\
