  \ the content, I have acknowledged the repetition, but typically such repetitive\
  \ deatils in source are handled by translating them once.]\n\n\n\n\n社交工程攻击之所以经常成功，是因为人们具有信任本质。一个简单的例子就是“尾随”（Piggybacking）。\n\
  \n尾随攻击是指一个人在不使用钥匙、胸卡或密码代码的情况下，跟随另一个人进入安全区域。例如，某公司对建筑设置了限制访问。人员需要使用胸卡和个人识别码（`PIN`）来开门。然而，一旦门打开，其他人就可以直接走进去；这些人被称为尾随者（piggybackers）或尾随进入者（tailgaters）。\n\
  \n### ![](img/Tip.png)提示\n\n尾随也被称为 `tailgating`。三级防范门（Mantraps）通常用于防止尾随。一个 `mantrap`\
  \ 每次只允许一个人通过。它可以像地铁站的闸机一样简单，一次只允许一个人通过；也可以是一个一次只允许一个人通过的全尺寸笼子。\n\n一位安全顾问被聘请为一家公司进行安全评估。她在后面等候一个看起来很友善的人。她的手臂上满了书、箱子和公文包。她面前的那个人不仅在没有胸卡的情况下让她进入，实际上还为她扶着门。\n\
  \n大多数人想表现得礼貌和善良，在需要帮助的人面前关门与礼貌背道而驰。然而，在这种情况下，礼貌成了一个问题。漏洞评估表明，该漏洞可以通过利用人的天性礼貌来利用。\n\
  \n### MAC 泛洪攻击\n\n大多数组织用交换机取代集线器，以防止不受限制的嗅探攻击。嗅探攻击允许攻击者将网络网卡连接到未使用的墙上插座并捕获数据。如果使用集线器，攻击者可以捕获任何通过集线器的数据。如果使用交换机，攻击者无法捕获那么多数据。\n\
  \n然而，对交换机的攻击可以使其像集线器一样工作。交换机建立匹配物理端口与介质访问控制（`MAC`）地址的表。大多数系统只有一个 `MAC` 地址。在这种情况下，交换机将一个物理端口匹配到一个\
  \ `MAC` 地址。\n\n在 `MAC flood attack` 中，攻击者向同一个端口发送数百个数据包。然而，这些攻击使用欺骗技术来更改 `MAC` 地址。结果是交换机从同一个端口看到了数百个\
  \ `MAC` 地址。在某个时刻，交换机无法跟上。它会“失效开放”（fails open）并像集线器一样工作。\n\n例如，攻击者或测试人员可以访问会议室内一个不受保护的网络插座。在将计算机插入插座后，他们可以启动\
  \ `MAC flood attack`。过段时间后，交换机进入“失效开放”模式。攻击者随后打开协议分析仪并捕获所有通过交换机的数据。\n\n### TCP SYN\
  \ 泛洪攻击\n\n`TCP SYN flood attack` 是一种针对面向服务器的常见攻击。为了理解这种利用，有助于了解传输控制协议（`TCP`）会话是如何工作的。\n\
  \n`FIGURE 8-6` (#18_chapter08_03.xhtml#fig8-6) 显示了 `TCP` 用于在两个系统之间建立会话的三次握手。第一个系统发送一个设置了同步（`SYN`）标志的数据包。第二个系统响应一个带有\
  \ `SYN` 和确认（`ACK`）标志的数据包。原始系统随后响应一个设置了 `ACK` 标志的数据包。现在两个系统已经建立了会话。\n\n```\n![FIGURE\
  \ 8-6 TCP 三次握手。](img/97812844284.png)\n```\n\n\n\n\n\n当使用配置管理技术时，它们可以提供更高水平的信心，确保系统受到漏洞的保护。例如，一个众知的漏洞可能会针对三年未进行更新的系统。配置管理技术确保在任何新部署中始终包含更新。\n\
  \n`change management`（变更管理）是一个控制系统更改的过程。更改在经过审查和批准后才会执行。变更管理是一个重要的过程，因为许多 IT 机是由未经授权的更改引起的。具有成熟变更管理流程的组织可以减少此类停机。\n\
  \n一个常见的例子是，善意的管理员为了解决本地系统上的小问题而进行了更改。该管理员可能会无意中在网络上引发更大的问题。例如，某个应用程序可能在应用特定更新后无法工作。如果管理员删除了更新，系统就会受到该漏洞的威胁。\n\
  \n### 验证并确认漏洞已缓解\n\n在部署了缓解漏洞的措施后，需要对它们进行检查以确保其有效。换句话说，需要重复测试以确保漏洞已经得到缓解。\n\n存在两种可能性。一种是措施可能完全不起作用。如果是这种情况，则需要更换它。另一种是配置可能需要微调才能完全正常工作。例如，在最初部署措施时可能需要某些设置，但被遗漏了。可以进行这些更改并再次测试措施。\n\
  \n验证漏洞已缓解的最简单方法是使用最初识别它的相同方法。如果漏洞扫描发现了问题，则应该重新运行扫描。如果审计发现了问题，则应对与漏洞相关的特定细节进行审计。\n\
  \n### 在 IT 基础设施中执行漏洞评估的最佳实践\n\n以下列表列出了执行漏洞评估时可以遵循的几项最佳实践：\n\n* **首先获得许可**——漏洞评估可能会导致系统崩溃。确保管理层理解风险并批准该过程至关重要。如果没有许可，可能会出现几个问题。如果由外部顾问执行漏洞评估，他/她可能需要对停机造成的损害负责。如果由内部员工执行漏洞评估，他/她可能会在寻找新工作时获得更新简历的机会。许多安全专业人员在获得书面许可之前绝不会开始评估。\n\
  * **识别尽可能多的漏洞**——在进行漏洞评估时，应使用所有可用工具来识别可能的漏洞，并检查典型 IT 基础设施的所有七个领域。\n* **使用差距分析进行合规性检查**——在识别用于监管合规性（如\
  \ HIPAA）的漏洞时，使用了差距分析。差距分析识别了需求与现有措施之间的差异。这提供了正式文档，证明正在采取步骤以符合法律规定。\n* **验证漏洞已缓解**——在实施了缓解漏洞的措施后，必须验证它们是否有效。应该使用最初用于发现漏洞的相同技术来验证其是否已缓解。\n\
  \n## 章节总结\n\n本章提供了有关威胁评估、漏洞评估和利用评估的信息。每种类型的评估都可以用于识别 IT 基础设施中的潜在风险因素。目标是识别尽可能多的威胁、漏洞和利用点。一旦识别出它们，就可以采取措施对其进行缓解。\n\
  \n威胁评估并不被要求是全方位或完整的。相反，执行这些评估是为了识别可能发生的威胁。这些威胁是通过审查历史数据和进行威胁建模来识别的。漏洞评估识别网络中的弱点。某些漏洞评估可以手动进行。其他漏洞评估则可以使用自动化工具进行，例如流行的漏洞扫描工具\
  \ `Nessus`。任何扫描工具都必须确保系统没有漏洞，因此必须保持最新状态。利用评估确定了弱点是否可以被利用。它可以在实施措施之前和之后执行，以验证措施的有效性。\n\
