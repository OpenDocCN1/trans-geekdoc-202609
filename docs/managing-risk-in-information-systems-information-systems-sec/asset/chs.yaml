  \ 年有 3,734 起；2003 年有 137,529 起。CMU 的 CERT 最后一次报告事件数量是在 2003 年。如果今天仍在跟踪和报告事件数量，这些数字将超出图表范围。除非计算机从未开启或保持完全隔离状态，否则它将会被攻击。\n\
