  \    1. 正确\n    2. 错误\n\n\n\n\n\n# 第 14 章 通过灾难恢复计划缓解风险\n\n# 第 15 章 通过计算机事件响应小组计划缓解风险\n\
  \n![© Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n\n© Sai Chan/Shutterstock\n\
  \n## 通过业务影响分析缓解风险\n\n业务连续性计划 (BCP) 的**重要部分**是业务影响分析 (BIA)。BIA 基本上是一个数据收集过程，有多种方法收集这些数据，包括访谈、调查和会议。\n\
  \n收集数据后，可以对其进行分析以识别关键功能和资源，之后即可确定可的停机时间。资源的最大接受停机时间 (MAO) 决定了恢复目标，主要的两个是恢复时间目标 (RTO)\
  \ 和恢复点目标 (RPO)。\n\n### 第 12 主题\n\n本章涵盖了以下主题和概念：\n\n* 什么是业务影响分析\n* 业务影响分析的范围是什么\n\
  * 业务影响分析的目标是什么\n* 业务影响分析的步骤是什么\n* 什么是关键业务功能和流程\n* 业务功能和流程如何映射到信息技术 (IT) 系统\n* 执行业务影响分析的最佳实践有哪些\n\
  \n### 第 12 目标\n\n当你完成本章时，你将能够：\n\n* 定义业务影响分析\n* 识别业务影响分析的范围\n* 识别业务影响分析的目标\n* 识别关键业务功能和流程\n\
  * 将业务功能和流程映射到 IT 系统\n* 列出执行业务影响分析的最佳实践\n\n## 什么是业务影响分析？\n\n业务影响分析 (BIA) 是一种用于识别业务中断可能产生的影响的研究。它关注于一个或多个关键信息技术\
  \ (IT) 功能的故障。\n\nBIA 的另一种思考方式是，它有助于识别对组织生存至关重要的系统。提醒一下，生存能力是指公司生存由于风险导致损失的能力。某些损失是非常严重的，至于如果不进行管理，可能会导致业务失败。\n\
  \n在处理 BIA 时，有必要对以下术语有基本的理解：\n\n* **最大接受停机时间**——最大接受停机时间 (MAO) 确定了系统可接受的最大停机时间。如果停机时间超过\
  \ MAO 时间，将对组织的使命产生负面影响。MAO 直接影响恢复时间。\n* **关键业务功能**——关键业务功能 (CBF) 包括被认为对组织至关重要的功能。如果\
  \ CBF 发生，组织将失去执行基本操作的能力，例如向客户销售产品。如果组织无法执行该功能，将损失金钱。\n* **关键成功因素**——关键成功因素 (CSF)\
  \ 包括执行组织使命所需的元素。组织将有几个必须成功组织才能成功的元素。例如，对于现今许多公司来说，可靠的网络基础设施可能被认为是一个 CSF。如果网络基础设施故障，所有其他业务功能都可能停止。\n\
  \n### ![](img/Tip.png) 提示\n\nBIA 包含了对公司生存至关重要的系统。然而，也可以包含较次的系统。换句话说，如果丢失电子邮件功能一周，公司可能会遇到严重问题，但公司并不一定会失败。尽管如此，电子邮件可能被认为足够重要而包含在\
  \ BIA 中。\n\nBIA 并不是包含所有的 IT 功能，仅包含关键的 IT 系统和组件，这些系统通过识别 CBF 来确定。支持 CBF 的系统和组件是关键的。\n\
  \n### ![](img/Tip.png) 提示\n\n`stakeholder` 是任何对项目成功有利益或兴趣的个人或群体。利益相关者包括对所在部门或部门成功有利益的高管和经理，这意味着他们希望确保其负责领域的成功。\n\
  \n什么让一个业务功能变得关键？任何利益相关者都可以确定某项业务功能是关键的。如果利益相关者确定该功能的丢失会导致不可接受的损失，那么它就是关键功能。利益相关者根据经验和意见做出此决定，而不是轻率做出的。一旦功能被指定为关键功能，利益相关者就需要投入资源（资金和人员）来保护它。\n\
  \n此外，法律可以规定某项功能被视为关键。例如，《健康保险可携带性与责任法案》(HIPAA) 要求保护健康相关信息。访问控制和其他保护措施是维护 HIPAA 合规性所需的关键组件。\n\
  \nBIA 在很大程度上是一个数据收集过程。输入来自利益相关者、用户、流程所有者以及组织中的其他人员。数据可以通过访谈、问卷和调查来收集，或者通过审查可用报告来收集；任何提供目标系统信息的方法都可以使用。\n\
  \nBIA 不提供解决方案，而是更大业务连续性计划 (BCP) 的一部分，并为 BCP 提供输入，而 BCP 包含了解决方案。例如，BCP 可能会提供减少停机影响的控制措施建议。\n\
  \n将 BIA 与风险评估进行比较有助于理解 BIA 的目的。风险评估查看威胁和漏洞。当威胁利用漏洞损害资产时，就会产生风险，风险评估的主要目标是通过减少或消除漏洞，或减少威胁和损害对资产的影响来降低风险。\n\
  \n另一方面，BIA 并不像风险评估那样处理威胁或漏洞。相反，它关注的是停机的影响。虽然 BIA 的重点主要是业务连续性，但 BIA 也可以用于风险评估中。换句话说，如果目标是确定哪些系统需要通过风险评估进行评估，则可以考虑使用\
  \ BIA 来识别和优先考虑关键系统。\n\n同样，如果已经完成了风险评估，这些数据可以用于帮助创建 BIA。进行风险评估的第一步之一是识别资产，这有助于识别对组织重要的资产。\n\
  \n#### 收集数据\n\n有多种方法可以收集 BIA 数据收集过程的数据。一种方法是与关键人员进行访谈。为了提高从这些访谈中收集的数据质量，应该进行计划，例如确保被访谈人员有时间回答问题，并准备好正确的问题。这些问题应该关注\
  \ CBF 和支持性资源的 MAO。\n\n另一种方法是使用纸质或计算机的问卷、表格或调查，这些调查应是有限且集中的，换句话说，一次只关注一个流程。例如，可以使用\
  \ SharePoint 网站来收集和汇总数据。如果表单太长，人们可能没有时间回答，而较短的表单可以获得更有用的信息。\n\n\n\n\n\n另一种收集输入的方法是举办会议或电话会议。这种格式的优点是人们可以相互互动，从而提供更丰富的结果。然而，达成共识可能是困难的，在尝试确定不同系统的优先级时尤其如此。\n\
  \n## 应急计划的七步\n\n美国国家标准与技术研究所（`NIST`）发布了特别出版物（`SP`）`800-34 Rev. 1，《联邦信息系统应急计划指南》。应急计划帮助组织识别紧急或灾难后恢复服务的措施。`SP\
  \ 800-34 Rev. 1` 包含了关于 `BIAs`的信息。尽管 `SP 800-34 Rev. 1` 侧重于联邦信息系统，但它适用于私营公司。\n\n\
  `SP 800-34 Rev. 1` 确定了应急计划的七步。这七步是：\n\n1. 制定应急计划政策声明\n2. 进行业务影响分析\n3. 识别预防性控制\n\
  4. 创建应急策略\n5. 开发信息系统应急计划\n6. 确保计划测试、培训和演练\n7. 确保计划维护\n\n从第二步可以看出，`BIA` 驱动了应急计划的大部分。只需要对\
  \ `BIA` 识别为关键的系统进行应急计划。\n\n### 多样化的数据收集方法\n\n可以使用多种数据收集方法。例如，由于某些人可能拥有大量信息，访谈可能是合适的。但仅仅因为对一个人进行了访谈，并不意味着每个人都应该接受访谈。\n\
  \n如果人们已经由于大量的会议压得喘不过气，他们可能会对 `BIA` 会议感到反感。另一方面，他们可能欢迎在空闲时填写在线表单的机会。\n\n### 定义业务影响分析的范围\n\
  \n与任何项目一样，在过程早期定义 `BIA` 的范围（或边界）至关重要。定义范围有助于确保 `BIA` 专注于重点，并分析正确的功能。\n\n范围受组织规模的影响。对于小型组织，`BIA`\
  \ 的范围可以涵盖整个组织。对于较大的组织，范围可能只包含某些区域。例如，一个 `BIA` 可能仅包含某家大型企业的在线销售部门，而其他 `BIAs` 将检查该业务的其他区域。\n\
  \n`图 12-1` (#23_chapter12_02.xhtml#fig12-1) 显示了一个用于电子商务的后端数据库在线 Web 服务器。`BIA` 可以仅关注支持此\
  \ Web 服务器所需的关键功能。根据该图，支持在线销售所需的系统是 Web 服务器、防火墙和数据库服务器，代表了客户购买产品的阶段。它不包括其他阶段，例如产品发货，这显示在\
  \ `图 12-2` (#23_chapter12_02.xhtml#fig12-2) 中。这两个阶段所需的功能明显不同，每个 `MAO` 也是如此。网站的 `MAO`\
  \ 比短于发货功能的 `MAO`。\n\n![图 12-1 带有后端数据库的在线 Web 服务器。](img/9781284183719_CH12_FIGF01.png)\n\
  \n**图 12-1** 带有后端数据库的在线 Web 服务器。\n\n![图 12-2 产品发货阶段。](img/9781284183719_CH12_FIGF02.png)\n\
  \n**图 12-2** 产品发货阶段。\n\n例如，如果客户准备好购买产品时网站宕机，那么销售就会丢失，无论宕机时间有多长。同样，如果销售点系统宕机，客户只能用信用卡或借记卡支付，那么销售也会丢失。\n\
  \n### 提示\n\n在确定范围时，还应该考虑预算。如果组织足够大，可以聘请安全顾问来协助 `BIA`；而如果预算有限，可能无法聘请安全顾问。\n\n另一方面，如果发货端发生故障，其影响并不是立时显现的。即使持续了整整一天，它也可能只导致发货的轻微延迟，而这并不是关键的。\n\
  \n仅仅因为发货阶段停机的影响不是关键的，并不意味着它不应该被包含在 `BIA` 中。相反，关键在于应该明确识别范围。以下是一个模糊的范围声明的示例：\n\n\
  `BIA` 的范围将涵盖网站的功能。\n\n执行 `BIA` 的人可能会将此范围解释为仅指购买阶段。如果 `BIA` 的意图是同时包含购买和发货阶段，那么 `BIA`\
  \ 就是不完整的。另一个人可能会将其解释为包含购买和发货两个阶段。如果意图是让 `BIA` 仅涵盖购买阶段，那么在执行两项工作就会浪费资金。\n\n以下范围声明更为清晰：\n\
  \n`BIA` 的范围将涵盖客户购买阶段网站的功能，包括所有支持客户访问和购买的功能。此 `BIA` 不包含发货阶段。\n\n如果要包含发货阶段，可以对范围声明进行修改：\n\
  \n`BIA` 的范围将涵盖在线网站的所有功能，包括所有支持客户访问、购买以及产品运输的功能。\n\n## 业务影响分析的目标\n\n业务 IA 的总体目标是识别故障的影响。更具体地说，目标是识别会影响组织的关键功能。`图\
  \ 12-3` (#23_chapter12_02.xhtml#fig12-3) 显示了这些总体步骤：从所有者和专家处收集输入以帮助识别 `CBFs` 以及支持它们的关键资源，识别资源的\
  \ `MAO` 和影响，并确定恢复需求。\n\n![图 12-3 业务影响分析的目标](img/9781284183719_CH12_FIGF03.png)\n\
  \n**图 12-3** 业务影响分析的目标。\n\n`BIA` 的间接目标是为资金提供合理性。在确定 `BIA` 中的恢复需求后，识别 `BCP` 中支持这些需求的控制措施。如果影响很大，投入资金防止故障将具有成本效益。\n\
  \n`NIST SP 800-34 Rev. 1` 包含一个与 `图 12-4` (#23_chapter12_02.xhtml#fig12-4) 类似的图表。它显示了成本与故障时间之间的关系。标记为“中断成本”的线表明，故障发生后中断成本非常低。然而，随着故障时间的增加，中断成本也会增加。另一条线识别了从故障中恢复的“成本”。为了能够几乎立即从故障中恢复，成本是高高的。然而，如果可以接受较长的故障时间，恢复成本就会较低。\n\
  \n![图 12-4 成本的关系](img/9781284183719_CH12_FIGF04.png)\n\n**图 12-4** 成本的关系。\n\n例如，如果一个在线销售产品的网站故障了\
  \ 60 秒，其中断成本将非常低；而如果故障持续几天，其中断成本将非常高。可以实施控制措施使网站能够从 60 秒的故障中立即恢复，但成本将非常高。相反，在恢复控制上花费很少资金将导致更长的故障时间。\n\
  \n这些考虑有助于确定最佳成本点。在该这一点，公司将在恢复控制措施上花费最少的资金，同时将中断成本降至最低。\n\n\n\n\n\n以下章节将更详细介绍业务影响分析（BIA）的目标。\n\
  \n## 识别关键业务功能\n\n对于 IT 专家来说，`CBFs`（关键业务功能）并不总是显而易见的。例如，安全专家可能不知道某个网站的 `CBFs`。对他来说，Web\
  \ 服务器是一个显而易见的组件，但还有其他组件。\n\n对专家进行访谈或调查可以帮助了解支持 Web 服务器的所有组件，并且识别 `CBFs` 的底层步骤通常非常有用。例如，以下列表详细说明了在线网站购买的步骤：\n\
  \n1. **客户访问网站**——客户使用网络浏览器访问网站。该网站托管位于组织去军事化区（DMZ）的 Web 服务器上，防火墙在提供安全防护的同时提供了对 Web\
  \ 服务器的访问权限。\n2. **客户浏览产品目录**——当用户搜索特定产品时，网站会向后端数据库发送查询。数据库服务器位于第二个防火墙后的内部网络中。Web\
  \ 服务器使用数据库查询结果构建网页，并将其发送回客户。\n3. **客户挑选产品**——在浏览过程中，客户可以将产品添加到购物车。\n4. **客户结账**——当客户准备好完成购买时，他们点击结账按钮，启动一个安全会话。现有客户可以登录以访问之前使用的信息，例如他们的地址和信用卡号。这些信息可以通过第二个防火墙后的后端数据库服务器获取。新客户会被提示输入客户数据。Web\
  \ 服务器将新客户的数据发送到后端数据库服务器进行存储。订单完成后，Web 服务器会向客户发送确认电子邮件。\n5. **消息发送到订单处理应用程序**——数据库服务器向订单处理应用程序发送消息，该应用程序托管在内部网络中的另一台服务器上。该应用程序处理产品运输，这是一个独立过程。\n\
  6. **处理订单**——订单处理应用程序跟踪订单，并将客户订单发送到仓库应用程序进行发货。它还接受来自仓库应用程序的状态数据。仓库人员发货订单并在仓库应用程序中输入信息。订单处理应用程序向客户发送邮件，告知他们订单状态，包括订单发货时间以及针对运输问题（如延迟）的后续邮件。\n\
  \n### ![](img/Tip.png)提示\n\n首先识别 `CBFs` 是一种自上而下的方法，随后识别支持 `CBFs` 的关键 IT 服务和基础设施。自下而上的方法可能会遗漏重要元素，例如，尝试确定服务器支持哪些功能。\n\
  \n在此示例中，`CBFs` 是：\n* 客户访问网站\n* Web 服务器访问数据库服务器\n* 订单处理应用程序跟踪订单\n\n有了这些信息，就可以识别关键资源。\n\
  \n## 识别关键资源\n\n关键资源是支持 `CBFs` 所所需的。一旦确定了 `CBFs`，就可以对它们进行分析，以确定每个功能的关键资源。\n\n网站的示例展示了如何从\
  \ `CBFs` 识别关键资源。网站的 `CBFs` 之一是客户访问网站。支持此功能需要以下 IT 资源：\n* Internet 访问\n* Web 服务器\n\
  * Web 应用程序\n* 网络连接\n* DMZ 互联网侧的防火墙\n\n### ![](img/Note.png)注意\n\n这并不是流程设计的唯一方式。产品数据库可以托管在\
  \ DMZ 的服务器上，以便更快速地检索数据，而客户数据库可以单独托管在内部网络中。DMZ 也可以不同的设计。存在许多设计可能性，这就是为什么询问专家非常重要。他们会知道流程是如何配置的。\n\
  \n第二个 `CBF` 是 Web 服务器访问数据库服务器的能力。数据库服务器托管了这两者。该功能需要以下 IT 资源：\n* Web 服务器\n* Web 应用程序\n\
  * 网络连接\n* DMZ 侧的防火墙\n\n第三个 `CBF` 是订单处理应用程序。它需要接收数据库服务器的订单并跟踪订单。支持此功能需要以下 IT 资源：\n\
  * 托管订单处理应用程序的服务器\n* 数据库服务器\n* 仓库应用程序\n* Internet 访问\n\n## 没有 BIA 的恢复\n\n想象一下在没有进行\
  \ BIA 的情况下进行灾难后的恢复。他们应该先恢复哪些系统？哪些 `CBFs` 应该先恢复？如果没有指导，恢复工作可能没有顺序。\n\n管理员可能会更关注某些系统并优先启动它们。尽管这些系统对组织的生存并非关键，但他们可能会关注这些非关键系统。\n\
  \n相比之下，BIA 识别了 `CBFs`，并帮助组织内的每个人了解哪些是重要的。更具体地说，它帮助管理员了解应该先启动哪些系统。\n\n因此，执行 BIA 的时间是在灾难发生之前，这样员工就能知道优先级。如果没有文档，任何情况都可能发生，但有一点是肯定的——在灾难期间无法保持冷静。\n\
  \n在许多情况下，关键资源会重叠。也就是说，一个功能所需的关键资源可能另一个功能也需要。例如，Web 服务器是两个功能所需的，而设施支持（例如电力、空调）是所有功能所需的。\n\
  \n资源可以为所有功能列一次，也可以随每个功能列出。对于 IT 资源，随每个功能列出资源是更好的主意。例如，所有 IT 资源都需要设施支持，可以一次性列出：\n\
  * **电力**——需要不间电源和发电机以确保停电期间系统运行。\n* **空调**——需要空调确保所有系统运行。\n\n### 识别 MAO 和影响\n\n\
  一旦确定了 `CBFs` 以及支持它们的 IT 资源，下一个要考虑的项是 MAO 和影响。MAO 也称为最大可忍中断时间 (MTPD)。MAO 有助于确定在灾难发生后哪些\
  \ `CBFs` 需要尽快恢复和启动，识别启动 `CBF` 所需特定资源，并帮助确定这些系统需要多快恢复。\n\n该流程中的另一个考虑因素是对业务的影响，它是金钱性的，但不需要以货币形式表示。相反，影响通常以相对值表示，如高、中、低，但也可以用数字表示，如\
  \ 1 到 4。\n\n\n\n\n一旦确定了影响级别，即可将其与最大允许中断（MAO）进行匹配。`表 12-1`展示了如何在组织中定义影响值级别的示例。每个级别都与\
  \ MAO 匹配，以确定在感知到影响之前系统可以停机多久。\n\n#### 表 12-1 影响级别示例\n\n| 影响值级别 | 最大可停机时间及影响 |\n\
  | --- | --- |\n| **1 级** | 业务功能在所有业务时间内必须保持可用。在线系统必须每周 7 天每天 24 小时可用。 || 两小时。任何停机都将对业务产生立即的影响。\
  \ |\n| **2 级** | 业务流程可以在没有业务功能的情况下维持短时间。 || 一天。如果停机时间超过一天，将对业务产生影响。 |\n| **3 级**\
  \ | 业务流程可以在没有业务功能的情况下维持一天或以上。 || 三天。如果停机时间长达三天，不会对业务产生影响。 |\n| **4 级** | 业务流程可以在长时间没有业务功能的情况下维持。\
  \ || 一周。除非停机时间超过一周，否则对业务不会产生重大影响。 |\n\n在计算组织的 MAO 时，必须同时考虑直接成本和间接成本。\n\n##### 直接成本\n\
  \n![](img/Note.png) 注意事项\n\nMAO 值是由每个组织内部分配的，这意味着一个组织使用的值和恢复目标可能与另一个组织使用的值完全不同。\n\
  \n直接成本通常比间接成本更容易计算。这些成本中的一些是显而易见的，另一些则不然。以下列表显示了一些直接成本：\n\n*   **即时销售额和现金流的损失**——这是最明显的损失。在停机期间，公司无法销售其产品或服务，并失去来自这些销售的正常现金流。\n\
  *   **设备更换成本**——如果设备损坏，则需要维修或更换。根据设备的不同，这些成本可能是巨额。\n*   **建筑重建成本**——如果建筑因火灾或自然灾害而损失，则需要重建或更换。虽然保险涵盖了大部分费用，但很少能覆盖所有费用，组织必须补差额。\n\
  *   **延迟交货罚金成本**——服务水平协议 (`SLAs`) 规定了预期服务水平，如果未达到要求，通常会实施罚金，这应被计算为停机的直接成本。\n*  \
  \ **违规问题的罚金成本**——某些法律对不合规行为征收罚金。如果失败导致违反法律，则应将此成本包含在内。\n*   **重新创建或恢复数据的成本**——停机期间丢失的数据需要重新或恢复。某些数据可能需要手动创建，而另一些数据可以使用现有备份进行恢复。恢复数据可能涉及劳动力成本。\n\
  *   **支付给因停机而闲置员工的工资**——如果停机阻止了正常工作，工人仍在上班时间内，这意味着他们仍会获得工资。\n\n##### 灾难后的股票价值损失\n\
  \n如果一个组织是上市公司，其股价将会下跌。Andrew Hiles 在其 2006 年的文章《业务影响分析：你的下行在哪里？》(`http://www.rothstein.com`)\
  \ 中写道，当停机影响到公司时，其价格也会下跌。\n\n##### 间接成本\n\n识别间接成本比识别直接成本更困难，但必须考虑它们。以下列表显示了一些间接成本：\n\
  \n*   **客户损失**——发生停机时，客户可能会从竞争对手处购买。\n*   **公共声誉的损失**——停机可能导致组织在公众看来缺乏吸引力。某些客户可能不再与该组织开展业务。\n\
  *   **恢复市场份额的成本**——当失去客户和声誉时，公司失去了市场份额。留住客户比吸引新客户得多。\n*   **恢复良好品牌形象的成本**——如果公司的品牌受损，必须采取措施进行修复。修复受损的名誉需要大量资金。\n\
  *   **信用损失或更高的信用成本**——当停机影响公司现金流时，也会影响其信用评级。较低的信用评分会导致更高的成本。\n*   **恢复期间丢失的机会**——当组织处理停机问题时，员工花时间处理它。这些员工可能一直在致力于吸引新业务的项目。\n\
  \n## 识别恢复需求\n\n恢复需求确定了必须恢复的时间范围，并识别了必须恢复的数据。例如，某些数据丢失是可以接受的，而另一些数据则不是。\n\n与恢复需求相关的两个主要术语是`恢复时间目标\
  \ (RTO)`#23_chapter12_03.xhtml#gloss149`和`恢复点目标 (RPO)`#23_chapter12_03.xhtml#gloss148。虽然\
  \ RTO 适用于系统或功能，但 RPO 仅适用于数据。具体来说，RPO 针对数据库中的数据。\n\nRTO 是系统或功能必须恢复的时间，应等于或小于 MAO。例如，如果\
  \ MAO 是一小时，那么 RTO 需要在一小时或更短。\n\nRPO 识别组织可以接受的最大数据丢失量，即可接受的数据延迟。\n\n\n\nRTO 也可以被认为是时间关键型（time\
  \ critical），而 RPO 被认为是任务关键型（mission critical）。`RTO` 识别系统恢复的时间，而 `RPO` 则识别任务关键型的数据。某些过程必须及时恢复，这需要较短的\
  \ `RTO`。其他过程的恢复可以延迟，只要所有数据都已恢复。\n\n### ![](img/Tip.png)提示\n\n虽然可以实现更低的 RTO，但其成本要高得多。因此，在与利益相关者面试时，将成本与\
  \ `RTO` 联系起来非常重要。例如，确保数据库在发生重大灾难（如地震）后仍能恢复到故障前一刻的数据是可能的，但这需要独立的站点、独立的服务器以及即时数据复制，而这些都是昂贵的。一旦利益相关者意识到这些成本，他们可能会决定一个不同的\
  \ `RTO`。\n\n在确定 `MAO` 后，确定恢复时间目标就变得容易了。表 12-2 在表 12-1 的基础上增加了一列，即恢复目标，并显示恢复目标与 `MAO`\
  \ 直接相关。\n\n**表 12-2** 影响级别示例\n\n| 影响值级别 | 最大可接受停机时间 | 恢复目标 |\n| --- | --- | ---\
  \ |\n| **1 级** | 业务功能在所有业务时间内必须可用。在线系统必须每天 24 小时每周可用。任何停机都将对业务产生几乎瞬时的影响。 | 两小时。两小时或更短。此类功能必须在两小时内恢复。\
  \ | |\n| **2 级级** | 业务流程可以在没有该业务功能的情况下生存一段时间。如果停机时间超过一天，将对业务产生影响。 | 一天。24 小时或更短。此类功能必须在\
  \ 24 小时内恢复。 | |\n| **3 级** | 业务流程可以在没有业务功能的情况下生存一天或多天。如果停机时间达到三天，将对业务产生影响。 | 三天。72\
  \ 小时或更短。此类功能必须在 72 小时内恢复。 | |\n| **4 级** | 业务流程可以在没有业务功能的情况下生存很长时间。除非停机时间超过一周，否则不会对业务产生重大影响。\
  \ | 一周。七天或更短。此类功能必须在一周内恢复。 | |\n\n查看影响值级别 4，可能会问出一个问题：如果一个组织在最长一周内可以没有某项功能，为什么还要将其纳入\
  \ `BIA` 呢？这一级可以被认为包含了次要的理想功能。虽然组织在没有这些功能的情况下失败，但在有这些功能正常工作的情况下，其运行遇到的问题会更少。例如，一个组织可能不会在任务关键型任务中使用互联网访问，但拥有互联网访问可能会让员工更容易地执行其他工作。\n\
  \n### 恢复数据库\n\n在确定数据库的恢复方案时，有多种方案可供选择。某些 `RPOs` 要求恢复到某一时间点的数据，而另一些则仅要求恢复从一周前的数据。这取决于数据如何被使用和更新。\n\
  \n例如，用于在线事务处理（`OLTP`）的数据库记录销售情况。作为繁忙在线 Web 服务器的后端数据库，每一分钟的数据都非常重要。数据库使用事务日志来记录事务。这些事务日志和定期备份可用于恢复到故障发生一刻的数据。\n\
  \n高级恢复模型将数据从一个服务器复制到另一个服务器。事务日志更新一个服务器上的数据库，然后复制到另一个服务器。复制的日志更新第二个服务器上的数据库。即使主服务器损坏，第二个服务器也拥有自上次复制事务日志以来的所有数据。为了确保丢失的数据不超过五分钟，每隔五分钟将日志复制到另一个服务器。\n\
  \n另一个例子是，数据库存储产品数据并用新数据更新，每周备份一次。如果数据库损坏，可以从一周前的备份中恢复，该备份包含目前的所有数据。即使是在导入之前备份的，也可以在恢复数据库后轻松导入数据以恢复所有数据。\n\
  \n`RPO` 不是固定的。\n\n### 业务影响分析过程\n\nBIA 的大部分工作是收集数据。最后阶段是发布 BIA 报告。某些组织可能包含建议，但这在技术上并不属于\
  \ `BIA` 的部分。\n\n`BIA` 的总体步骤为：\n\n1. 识别环境\n2. 识别利益相关者\n3. 识别 `CBFs`\n4. 识别关键资源\n\
  5. 识别 `MAO`\n6. 识别恢复优先级\n7. 制定 BIA 报告\n\n## 识别环境\n\n第一步是识别整体 IT 环境，这意味着对业务功能有深入的理解。如果业务产生销售收入，了解销售金额（包括客户数量和交易量）是非常重要的。销售收入在停机期间会转化为销售损失。\n\
  \n\n\n\n完成此步骤后，管理员将更清楚地了解哪些系统应纳入业务影响分析（BIA），并能够识别利益相关者。\n\n### 提示 ![](img/Tip.png)\n\
  \nBIA 并不关注识别或实施恢复方法，但它是一个重要的前提。在不知道需要恢复什么内容之前，管理员无法开始寻找恢复方法。\n\n## 识别利益相关者\n\n利益相关者是指对项目成功有直接利益或兴趣的个人或群体。例如，销售副总裁对销售的成功有直接利益。利益相关者了解\
  \ `CBFs`。\n\n利益相关者可以帮助确保可用资源，这包括简单的事务（例如确保有人员参加 BIA 访谈），也包括较大的问题（例如识别 `MAO`）。\n\n\
  个人利益相关者可以将任何系统或功能识别为关键的，因为他们对停机造成的损失负责。他们还负责投入资源来保护系统。由于这些是他们的责任，利益相关者的意见是最重要的。\n\
  \n## 识别关键业务功能\n\n某些 BIA 从一开始就设计为关注特定的 `CBF`。例如，可以专门为某个在线网站委托 BIA。因此，涉及的流程就是唯一需要识别的内容。\n\
  \n另一个 BIA 可能侧于远程办公室，因此首先需要做的工作是识别远程办公室执行了哪些功能。例如，远程办公室的大部分工作可能是离线完成的，例如定期向客户现场提供演示。根据这种情景，即使那里失去了所有\
  \ IT 功能一周或更长时间，那里的人员仍然可以进行这些演示。在这种情况下，没有任何功能会被认为是关键的。\n\n另一方面，远程办公室可能会销售产品或服务，这意味着办公室在营业期间需要与主办公室保持持续连接。如果远程办公室失去连接，员工将无法完成销售交易。如果这些员工产生了大量收入，组织可能会将连接性视为一项关键功能。\n\
  \n## 识别关键资源\n\n关键资源是支持 `CBFs` 和流程所需的资源。它们可能包括硬件（如服务器或路由器）和软件（如操作系统和应用程序）。\n\n在识别关键资源时，必须包含支持性基础设施。例如，Web\
  \ 服务器必须每天 24 小时、每周 7 天运行，并需要设施支持，这可能包括电力、供暖和空调。如果关键系统需要支持人员进行操作，食物和饮用水等物品应被纳入关键资源。\n\
  \n识别关键人员同样重要。任何系统都有几位对其成功至关重要的关键人员，例如高管、经理、主管、管理员或关键客户或供应商。\n\n在之前介绍的带有后端数据库的在线\
  \ Web 服务器示例中，将包含以下系统：\n\n*   `Web server`\n*   `Database server`\n*   `Internal\
  \ firewall`\n*   `External firewall`\n\n访谈专家对于识别支持任何 `CBF` 的关键系统非常重要。例如，在微软域内的电子邮件服务中，显而易见的系统是任何电子邮件服务器。然而在微软域内，还有几个额外的服务器是关键的，包括域控制器\
  \ (`DC`)、作为全局目录服务器的 `DC` 以及用于定位域内服务器的域名系统 (`DNS`) 服务器。如果这些服务器任一不可，电子邮件服务将无法运行。\n\
  \n## 识别 MAO\n\n一旦确定了关键资源，就可以确定它们的每个 `MAO`。这些资源中的每一个都支持一个 `CBF`。如果资源的 `MAO` 不明确，则必须确定其支持的\
  \ `CBF` 的 `MAO`，这也是该资源的 `MAO`。\n\n除了识别 `MAO` 之外，还应该包含一份影响声明，以识别损失造成。影响可以通过识别损失发生时无法执行的操作来直接说明，也可以用货币术语表示。\n\
  \n例如，电子邮件服务可能是关键的。然而，该组织在遭受严重影响之前可以持续运行八小时。另一方面，每小时产生 60,000 美元收入的 Web 服务器每分钟会损失高达\
  \ 1,000 美元的直接销售额。组织可以将该 Web 服务器的 `MAO` 确定为五分钟。\n\n` 12-3` 显示了此步骤的示例输出。\n\n**表 12-3**\
  \ 特定资源的 MAO 和影响\n\n| 资源 || MAO || 影响 |\n| --- | --- | --- |\n| `Web server` | 五分钟\
  \ | 损失显著的直接销售收入和间接损失。五分钟的停机将导致约 5,000 美元的直接销售损失。 |\n| `Database server` | 五分钟 |\
  \ 损失显著的直接销售收入和间接损失。用户仍能浏览网站。五分钟的停机将导致约 5,000 美元的直接销售损失。 |\n| `Email server` | 八小时\
  \ | 损失公司内部的主要通信。损失与供应商和客户的主要通信。 |\n\n## 识别恢复优先级\n\nBIA 的这部分识别了最重要最不重要的关键系统。最高优先级根据最短的\
  \ `MAO` 分配。例如，在比较一个停机五分钟后就会影响运营的系统与另一个可以停机八小时才会产生影响的系统时，显然，具有五分钟 `MAO` 的系统应该先恢复。\n\
  \n此阶段的 BIA 输出可以简单地表现为带有指定优先级（如 1、2 和 3）的关键系统列表。优先级也可以进行分类。例如，最重要的系统可以归类为高，而其他类别可以归类为中或低。\n\
  \n`表 12-4` 显示了如何为组织的系统列出恢复优先级。此表使用 1 到 5 的量级，1 为最高优先级。桌面 PC 被视为最低优先级。\n\n**表 12-4**\
  \ 恢复优先级\n\n| 系统 || 优先级 |\n| --- | --- |\n| `Web server` | 1 |\n| `Database server`\
  \ | 1 |\n| `Email server` | 2 |\n| `Desktop PCs` | 5 |\n\n### 编制 BIA 报告\n\nBIA 报告汇总了所收集的数据。没有特定的格式要求，但它通常包含以下章节：\n\
  \n*   **初步系统信息**：初步系统信息包括通用信息，如组织、系统名称和系统文档。\n*   **系统联系人 (POCs)**：`POCs` 是为 BIA\
  \ 提供输入的系统专家和利益相关者。也可以就任何跟进问题对他们进行提询。根据 BIA 的范围，可能包含内部和外部 `POCs`。\n*   **系统资源**：本节列出了具体的资源，包括硬件、软件以及任何人员或其他资源。\n\
  *   **关键角色**：某些 `POCs` 可能可能与系统相关的关键角色。如果是这样，可以在本节中识别他们，这将便于后续与他们进行跟进。\n*   **将关键角色与关键资源关联的表格**：此表将人员与系统进行匹配。例如，如果电子邮件服务被认为是关键的，则电子邮件\
  \ `POC` 将与该系统匹配。\n\n\n\n\n\n*   **识别资源、中断影响和 MAO 的表格**——此表列出了 `BIA` 中识别出的每个关键资源。对于每种资源，都包含了停机影响和\
  \ `MAO`（最大可中断时间）。该表是 `BIA` 最重要的元素之一。\n*   **识别关键资源恢复优先级的表格**——此表列出了内部开发的恢复优先级，用数字（如\
  \ 1、2 和 3）或词汇（如高、中、低）来指定。\n\n## BIA 报告广受欢迎\n\n一旦 `BIA` 完成，许多人可能想查看它，如果 `BIA` 涉及多个职能，情况更是如此。`BIA`\
  \ 提供了一个通常无法获取的组织概览。\n\n灾难恢复和安全人员通常比组织内的其他人员更了解业务细节，高管人员拥有良好的全局视野，而经理和员工通常非常熟悉自己的领域，但对其他领域没有深入了解。因此，`BIA`\
  \ 对他们所有人来说都是重要的，因为它将所有内容联系在了一起。\n\n由于 `BIA` 对组织的全面概述，高管人员通常将其归为机密。因此，在分发给任何人之前，获得许可是非常重要的。\n\
  \n## 识别任务关键业务职能和流程\n\n开发 `BIA` 的重要一步是识别任务关键业务职能和流程，这项任务并非总是易行的。关于这一过程需要记住最重要的两点是：专家拥有关键信息，并且必须使用不同的数据收集方法来获取这些信息。\n\
  \n任务关键业务职能是指被认为对组织至关重要的功能。它们源于关键成功因素，或 `CSFs`。`CSFs` 是执行任务所需的元素，也是组织成功所必需的。\n\n\
  `图 12-5` 显示，流程是贡献于 `CSFs` 的底层行动。换句话说，某些流程会导致 `CSFs` 的实现。成功的 `CSFs` 导致 `CBFs`（关键业务职能）的执行。\n\
  \n![图 12-5 关键流程、CSFs 和 CBFs。](img/9781284183719_CH12_FIGF05.png)\n\n`图 12-5` 关键流程、CSFs\
  \ 和 CBFs。\n\n例如，一家公司的大部分收入来自在线销售。因此，从网站销售产品就是一项 `CBF`。然而，仅仅说公司需要销售产品才能成功是不够的。必须识别销售产品所需的底层因素和流程。\n\
  \n例如，一家公司在线销售小部件。其一些底层 `CSFs` 可能包括：\n*   市面上最好的小部件\n*   积极的员工\n*   客户满意度\n*   有效的广告\n\
  \n不同的流程支持这些每一个 `CSFs`。例如，支持客户满意度的某些流程包括：\n*   满意的购买体验\n*   具有竞争力的定价\n*   准时交付\n\n\
  许多公司用工作流记录这些流程。如果存在工作流，可以很容易地用于确定流程中的步骤。如果不存在，流程中的步骤仍然能够被记录下来。\n\n准时交付是一个支持客户满意度的重要流程，它包含了几个步骤。记录这些步骤可以更容易识别确保准时交付所需的关键资源。\n\
  \n`图 12-2` 所示。使用了 `表 12-4` 中提到的相同量表。\n\n`表 12-5` 关键业务系统优先级\n\n| 系统 | 优先级 |\n| ---\
  \ | --- |\n| 数据库服务器 | 2 |\n| 仓库应用程序服务器 | 2 |\n| 通往 Web 服务器的连接 | 3 |\n\n如果与 Web 服务器的连接中断，新订单无法传递到仓库，但仓库人员可以处理现有订单。因此，该项分配的优先级为\
  \ 3。\n\n## 组织执行 BIA 的最佳实践\n\n在执行 `BIA` 时，可以使用一些最佳实践。以下是其中一些：\n*   **从明确的目标开始**——所有参与\
  \ `BIA` 的人员必须理解其范围，最好以书面形式定义。\n*   **不要忘记目标**——`BIA` 的目的是识别关键功能、关键系统和 `MAO`。\n*\
  \   **使用自上而下的方法**——从 `CBFs` 开始并深入到支持它们的 IT 服务是自上而下的方法，而从服务器开始则会错过 `CSFs` 成功所需的重要元素。\n\
  *   **多样化数据收集方法**——在收集数据时，使用的方法必须与组织的做法相匹配。一些可靠的数据可以通过个人访谈获得，但可能无法对其他人进行个人访谈。在这种情况下，可以使用问卷。在收集\
  \ `BIA` 数据时，小组讨论通常有用，此类讨论可以通过电话会议、会议和工作坊进行。\n*   **提前计划面试和会议**——数据收集是 `BIA` 的重要部分，因此确保参与者有足够的时间提供所需的数据很重要。如果他们太匆忙或没有做好准备，可能无法提供所需的数据。\n\
  *   **不要寻找解决方案**——`BIA` 非常耗时，特别是在数据收集、评估和确定优先级方面。走捷径可能会忽略关键功能或流程。\n*   **将 BIA 视为一个项目**——适用所有的项目管理实践。应该设定里程碑并跟踪进度。\n\
  *   **考虑使用工具**——有很多工具可以帮助完成灾备准备项目，也可以帮助开发 `BIA`。\n\n\n\n\n\n目前有多种可用的工具可以协助完成 `BIA`。例如，`BIA\
  \ Professional` 是 `Sungard Availability Services` 销售的多种工具之一。它包含了可以帮助收集和编制信息的工具，并引导用户完成从开始到结束的整个过程。\n\
  \n该工具包含基于网络的调查卷。这些问题可以设计为根据用户的答案进行分支。换句话说，对某个特定流程没有直接知识的用户将被问及有关该流程的问题。一旦创建了问题，就可以将调查卷链接发送给专家，他们可以通过互联网在任何地方回答问题。\n\
  \n`BIA Professional` 是 `Sungard` 整体连续性管理解决方案套件的一部分。其他可用替代工具包括 `ReliaSoft` 的 `BlockSim`\
  \ 和 `Factonomy` 的 `BCM`。\n\n## 章节总结\n\n`BIA` 是一项价值贵的工具，可以帮助识别关键系统和资源。一旦识别出这些资源，就可以确定资源的\
  \ `MAO` 时间。然后，根据停机的影响和 `MAO` 来确定恢复优先级。某些系统可能需要在灾难发生后几乎立即恢复运行，而其他系统则可以中断几天。\n\n与\
  \ `BIA` 相关的两个重要术语是恢复时间目标 (`RTO`) 和恢复点目标 (`RPO`)。`RTO` 有助于识别对时间敏感的系统，而 `RPO` 有助于识别持有关键任务数据的系统。\n\
  \n## 核心概念与术语\n\n*   业务影响分析 (BIA)\n*   关键业务功能 (CBF)\n*   关键成功因素 (CSF)\n*   最大可接受中断\
  \ (MAO)\n*   最大容忍中断 (MTPD)\n*   恢复点目标 (RPO)\n*   恢复时间目标 (RTO)\n\n## 第 12 章评估\n\n\
  1.  ______ 定义了系统的最大可接受停机时间。\n2.  以下哪项可以确定哪些是关键功能？\n    1. 客户\n    2. 利益相关者\n   \
  \ 3. 项目团队\n    4. 技术官\n3.  ______ 是业务影响分析的一个部分。\n    1. `MAO`\n    2. `BCP`\n  \
  \  3. 恢复目标\n    4. 范围\n4.  `BIA` 的目标是？（多选）\n    1. 识别最小可接受中断\n    2. 编写政策\n    3.\
  \ 识别关键资源\n    4. 识别关键业务功能\n5.  在开发 `BIA` 时，为了确定特定系统的影响，应该计算直接和 ______ 间接成本。\n6.\
  \  在 `BIA` 中，组织可以接受的最大损失时间被称为？\n    1. `BIA` 时间\n    2. 最大可接受中断\n    3. 恢复目标\n \
