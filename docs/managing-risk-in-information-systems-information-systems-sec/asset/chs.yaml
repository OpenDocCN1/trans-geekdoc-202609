  1. 用于 `ALE` 的公式\n2. 定义概率和影响的量表\n3. 定义 `SLE` 和 `ALE` 的量表\n4. 可接受的风险水平\n\n11. `\\\
  _\\_\\_\\_\\_\\_` 风险评估是客观的。它使用可以验证的数据。\n\n12. `\\_\\_\\_\\_\\_\\_` 风险评估是主观的。它依赖于专家的意见。\n\
  \n13. 风险评估面临的挑战之一是获取准确的数据。风险评估报告中可以包含哪些内容来指示数据的可靠性？\n1. 概率陈述\n2. 准确性等级\n3. 有效性水平\n\
  4. 不确定性水平\n\n14. 一位 IT 安全团队主管正在为她的公司进行定性风险评估。她正在考虑最终报告。在提供结果和建议时，IT 安全团队主管应该考虑什么？（选择两项）\n\
  1. 资源分配\n2. 风险接受\n3. `SLE` 和 `ARO`\n4. `SLE` 和 `ALE`\n\n15. 在以下选项中，执行风险评估时哪项应被视为最佳实践？\n\
  1. 从明确的目标和定义的范围开始\n2. 寻求高层的支持\n3. 定期重复风险评估\n4. 提供明确的建议\n5. 以上所有\n\n![© Sai Chan/Shutterstock](img/Chapter-Opener.jpg)\n\
  © Sai Chan/Shutterstock\n\n# 执行风险评估\n\n## 第 6 章\n\n风险评估与风险分析是同义词。它是识别业务运营风险的过程。此类风险包括资产、人员、技术和运营，例如业务的使命、功能和声誉。美国国家标准与技术研究所（`NIST`）的特别出版物（`SP`）`800-53`\
  \ 提供了风险管理指南，其中包括风险评估、威胁和脆弱性分析以及用于缓解风险的安全控制措施。\n\n执行风险评估必须采取几个步骤。第一步是明确定义要评估的内容，这涉及描述该系统。然后收集数据以识别威胁和脆弱性，这有助于识别风险。接下来，确定缓解风险的控制措施或应对措施，并评估已实施和计划中的控制措施。执行风险评估的最后一步是评估并建议额外的控制措施。这些建议应该得到成本效益分析（`CBA`）的支持。\n\
  \n### 第 6 章主题\n本章涵盖了以下主题和概念：\n* 选择风险评估方法时需要考虑的因素\n* 如何识别管理结构\n* 如何识别资产和活动\n* 如何识别和评估相关的威胁\n\
  * 如何识别和评估相关的脆弱性\n* 如何识别和评估控制措施\n* 如何根据评估需求选择方法\n* 如何制定缓解建议\n* 展示风险评估结果包含什么\n* 执行风险评估的最佳实践\n\
  \n### 第 6 章目标\n完成本章后，你将能够：\n* 选择适当的风险评估方法\n* 定义被评估系统的运行特性和使命\n* 阐述审查之前的发现和状态的重要性\n\
  * 描述管理结构与风险评估的相关性\n* 识别要包含在风险评估中的资产类型\n* 列出识别和评估威胁的步骤\n* 列出识别和评估脆弱性的步骤\n* 列出评估控制措施\n\
  * 描述已实施和计划控制措施之间的差异\n* 描述评估威胁、脆弱性和利用的过程\n* 描述制定缓解建议的过程\n* 描述风险评估的结果\n* 列出风险评估的最佳实践\n\
  \n## 选择风险评估方法\n一旦决定进行风险评估，就需要创建一个大纲来指导具体采取步骤。执行风险评估不是今天决定明天就能完成的。它需要时间和规划。\n\n两种主要的风险评估方法是`定量`和`定性`。本章有助于描绘这两种方法的整体状况。通常，风险评估涉及以下步骤：\n\
  * 识别要处理的资产和活动\n* 识别和评估相关的威胁\n* 识别和评估相关的脆弱性\n* 识别和评估相关的控制措施\n* 评估威胁、脆弱性和利用\n* 评估风险\n\
  * 开发缓解风险的建议\n* 向管理层展示建议\n\n在进行风险评估之前，需要完成两个初步行动：\n* 定义评估\n* 查看之前的发现\n\n#### 定义评估\n\
  必须明确定义什么。如果需要评估一个系统，则需要描述该系统。系统的示例可以是人力资源部门（`HR`）的人员数据库。如果需要评估一个过程，则需要描述该过程。过程的示例可以是财务部门创建发票。\n\
  \n一个重要的因素是描述当前的系统或过程。风险评估是一个特定时间点的评估，而整体风险管理是一个持续的过程。\n\n在描述系统或过程时，通常关注两个主要领域：\n\
  * 运行特性\n* 系统使命\n\n定义风险评估范围也很重要，以防止不受控的变化，这可能会导致成本超支和错过日期。\n\n### ![](img/Note.png)\
  \ 注意\n风险评估范围：根据 `NIST SP 800-30`，“评估范围决定了评估的内容。评估范围影响基于风险决策的信息范围，由请求评估的组织官员和风险管理策略决定。”类似于“范围蔓延”，当项目增加未计划的工作时，风险经理需要定义风险评估范围以避免未计划的数据收集和分析。\n\
  \n##### 运行特性\n运行特性定义了系统在环境中如何运行。仅仅命名系统（例如“电子邮件服务器”）是不够的；相反，需要识别系统是如何配置和运行的。\n\n\
  例如，`图 6-1`（16_chapter06_01.xhtml#fig6-1）显示网络中有一台电子邮件服务器处理进出所有的电子邮件。该服务器还为内部网络中的所有客户端提供电子邮件服务。但`图\
  \ 6-1`（16_chapter06_01.xhtml#fig6-1）中的插图是旧的，没有反映组织目前的配置。\n\n\n\n\n![图 6-1 组织网络中过时的邮件服务器配置](img/9781284183719_CH06_FIGF01.png)\n\
  \n**图 6-1** 组织网络中过时的邮件服务器配置。\n\n另一方面，**图 6-2** 显示了组织当前的网络拓图，其中包含一个非军事化区（DMZ）。DMZ\
  \ 包含一个用于从互联网发送和接收邮件的邮件服务器，以及一个与 DMZ 服务器收发邮件但与互联网不交互的内部邮件服务器。\n\n![图 6-2 显示内部邮件服务器和\
  \ DMZ 中邮件服务器的升级后的图](img/9781284183719_CH06_FIGF02.png)\n\n**图 6-2** 显示内部邮件服务器和 DMZ\
  \ 中邮件服务器的升级后的图。\n\n图 6-1 与图 6-2 之间的差异有助于说明记录当前运行特性的重要性。如果通过评估图 6-1 中的系统威胁来开始风险评估，会发生什么？显而易见的答案是信息将会过时，并在错误的努力上浪费价值的时间。\n\
  \n风险评估需要针对当前系统进行。然而，当前的配置并不总是显而易见或随时可用。有时，发现当前配置需要一些挖掘。可以问以下两个简单的问题：\n\n*   要使用的图是否显示了所有当前系统？\n\
  \n### 系统任务\n\n系统任务定义了系统的功能。与系统的运行特性相比，任务很容易定义。任何单一系统的任务定义可以短如一段话，也可以由简单的项目符号列表组成。\n\
  \n例如，一个邮件系统可以有如下任务：邮件服务器为组织提供所有邮件服务，包括以下功能：\n\n*   在内部客户端之间路由邮件\n*   接收来自外部邮件服务器的邮件并路由到内部客户端\n\
  *   接收来自内部客户端的邮件并路由到外部邮件服务器\n*   扫描所有邮件附件并删除恶意软件\n*   扫描所有邮件以识别垃圾邮件并剔除确认的垃圾邮件\n\n\
  ### 配置与变更管理\n\n配置管理和变更管理是两个重要的风险管理过程，它们对风险评估也有直接影响。有时，这两个过程被放在一起提到，但它们是不同的。\n\n\
  配置管理确保相似系统具有相同或至少相似的配置。它关注系统各个部分的安排。当系统非常相似时，可以使用基线、脚本和自动化等技术更高效地配置它们。共享相同配置的系统更容易进行集体维护和风险评估。\n\
  \n变更管理防止对系统进行未经批准的更改。\n\n## 识别管理结构\n\n管理结构指的是权和责任的分配方式。在定义风险评估范围时，将范围保持在单一实体的所有范围内是有帮助的。与单一实体合作可以更容易实施建议。\n\
  \n小型组织可能有一个单一的信息技术（IT）部门，负责所有的 IT 系统和流程。由于其员工控制所有 IT 系统，他们可以对任何系统实施建议。\n\n然而，较大的组织可能会有多个\
  \ IT 部门。在这种情况下，不同的经理或管理团队负责不同的 IT 系统，每个经理都有不同的职责。例如，一个组织可能设有以下 IT 管理部门：\n\n*   **网络基础设施**——该部门负责网络中所有的路由器和交换机，并可能包括所有的防火墙。\n\
  \n\n\n\n\n-   **用户与计算机管理**——该部门负责网络和账户的日常管理，并可能包括基础的安全措施。例如，`组策略`工具可以管理 Microsoft\
  \ 域中的账户，管理 Microsoft 域的管理员将管理`组策略`。\n-   **电子邮件服务器**——某些大型组织拥有 10 台或更多电子邮件服务器来管理邮件，并配有经过训练的人员专门管理这些服务器。这些人员确保电子邮件的递送，并管理垃圾邮件过滤和恶意附件。\n\
  -   **Web 服务器**——一个组织可以在一个或多个 Web 池中配置几十个 Web 服务器。一个 Web 池可以产生大量的收入，并有专门的人员进行管理。\n\
  -   **数据库服务器**——许多组织在数据库中存储了大量数据。大型数据库存储在专用服务器上。管理这些服务器所需的知识是专业性的，因此某些组织设有专门的数据库管理员来管理它们。\n\
  -   **配置与变更管理**——该部门监督所有服务器或所有系统的配置设置和更改。团队成员可能负责构建新服务器，并协调和记录所有的变更请求。\n\n### ![](img/Note.png)\
  \ 注意\n\n`Group Policy` 是一种自动化管理工具。策略可以设置一次并适用于域内的所有用户和计算机。例如，可以设置一种适用于所有用户的密码策略，以确保用户使用强密码并定期更换。\n\
  \n小型组织可能同时对许多系统进行风险评估。然而，较大的组织可能会将风险评估分开。例如，一个大型组织托管了电子商务网站。网站的元素包括 Web 服务器、数据库服务器和防火墙。然而，组织内部的各个部门负责管理这些不同的元素。一个部门管理\
  \ Web 服务器；另一个部门管理数据库服务器；第三个部门管理网络安全（包括防火墙）。对所有三个元素进行单次风险评估可能是具有挑战性的，在在实施建议时尤为如此。不同部门的经理可能会有竞争性的目标、时间表和优先事项。\n\
  \n然而，如果组织一次评估一个部门，其结果将更容易实施。例如，可以进行三次独立的风险评估，分别针对 Web 服务器、数据库服务器和防火墙进行评估。每项评估都将针对系统所有者提供具体的建议。\n\
  \n### 在风险评估边界内识别资产和活动\n\n`资产估值` 是确定资产公平市场价值的过程，这是风险管理的首要任务之一。资产价值可以根据资产的重置价值、资产为组织提供的价值或恢复资产的成本来确定。价值也可以结合这两种价值来确定。\n\
  \n在确定资产价值后，就可以对其重要性进行排序。如果某个资产价值 1,000 美元，它可能需要一级保护。如果另一项资产价值 100 万美元，那么该资产可能需要另一个级别的保护。\n\
  \n### ![](img/Note.png) 注意\n\n本节介绍了与风险评估相关的资产和活动。\n\n只有处于风险评估边界内的资产才应该被评估。当评估风险评估范围之外的资产时就会发生范围蔓延，这一过程会导致精力和资源的浪费。\n\
  \n资产的价值可以从不同的角度来看：\n\n-   **重置价值**——重置价值是购买新资产来替换现有资产的成本。例如，如果笔记本电脑故障或被盗，购买一台具有相似硬件和软件的新笔记本电脑的价格可能是\
  \ 1,500 美元。\n-   **恢复价值**——恢复价值是在故障后使资产恢复运行的成本。例如，如果服务器的硬盘故障，不会更换整台服务器，而是只会更换硬盘，并采取步骤恢复系统，这可能需要重新安装操作系统并从备份中恢复数据。执行维修所需也需要考虑。例如，如果维修需要两个小时，那么系统将中断两个小时。例如，如果该系统是每小时产生\
  \ 10,000 美元收入的 Web 服务器，那么 20,000 美元将包含在恢复价值中。\n\n确定任何资产的价值时需要考虑几个元素。这些包括：\n\n##\
  \ 系统访问与可用性\n-   系统功能\n-   硬件和软件资产\n-   人员资产\n-   数据和信息资产\n-   设施和用品\n\n## 系统访问与可用性\n\
  \n访问和可用性是指资产需要何时以及如何保持可用。某些资产需要每天 24 小时每周 7 天可用。其他资产仅需周一至周五的办公时间内可用。资产需要的可用性越高，与停机相关的风险就越大。\n\
  \n例如，Web 服务器用于在互联网上销售产品。客户可以随时访问网站，但如果客户在尝试访问时网站未运行，公司就会失去一笔订单。此外，还可能失去一个客户。\n\n\
  考虑到这一点，风险评估需要考虑与该网站在任何时间宕机相关的风险，这包括如何在不关闭网站的情况下对系统进行维护。维护包括对数据进行备份并保持系统更新。\n\nWeb\
  \ 服务器可能是 Web 池中许多服务器之一，也可能是故障转移集群中几个 Web 服务器之一。这两种配置都允许单台服务器宕机而网站继续运行，但如果运行单台服务器，停机可能是灾难性的。\n\
  \n另一方面，系统可能有一个文件服务器，仅供员工在工作时间（周一至周五，上午 8 点至下午 5 点）内部使用。这种时间表为员工不在工作时进行备份或其他维护提供了充足的时间。\n\
  \n## 系统功能\n\n在确定资产价值时，应考虑提供服务的系统的功能。特别重要的是这些功能是手动执行的还是通过自动化执行的。\n\n例如，正在评估组织电子邮件的价值。该电子邮件系统可能有多个元素，包括垃圾邮件过滤器。研究报告，通过互联网发送的邮件中高达\
  \ 90% 是垃圾邮件。垃圾过滤器将消除部分垃圾邮件，且目标是不过滤掉任何有效邮件。\n\n一个过滤掉高达 30% 垃圾邮件的过滤器可以显著减少垃圾邮件，并高程度确保有效邮件不会被过滤。`图\
  \ 6-3`\n```\n\n**FIGURE 6-3** 带有垃圾邮件过滤设备的电子邮件服务器。\n\n考虑到这一点，垃圾过滤器的价值是多少？它使用自动化过程，因此其价值就是设备的价值。如果它损坏或发生故障，就可以更换。\n\
  \n\n\n\n然而，某些垃圾邮件过滤器需要更多的交互，例如需要专门的技术人员不断查看被过滤的垃圾邮件，以确保其中不包含任何有效的收件邮件。这些技术人员可以将有效的电子邮件源地址添加到白名单，并将已知的垃圾邮件发送者添加到黑名单。\n\
  \n### ![](img/Note.png) 注意事项\n\n电子邮件 `白名单` 是已批准的电子邮件地址或域名的列表。例如，可以将 `ProfJohnson@xyz.edu(mailto:ProfJohnson@xyz.edu)`\
  \ 添加到白名单中，以确保来自此地址的任何邮件永远不会被标记为垃圾邮件。也可以添加 `xyz.edu` 域名，以确保来自该域内任何人的邮件都不会被标记为垃圾邮件。被添加到\
  \ `黑名单` 的地址会被自动标记为垃圾邮件。\n\n### IT 设备\n\n存在许多 IT 设备可以帮助让 IT 工作变得简单一些。技术人员不需要了解设备是如何工作的；他们只需要将其接通电源即可。\n\
  \n作为比较，操作烤面包机无需了解烤面包机工作的技术细节。把面包放进去，热的面包就会出来。当然，即使是烤面包机也有一些旋钮和控制按钮，并且需要用户交互。\n\n\
  垃圾邮件设备的工作原理类似。它连接到电源，输入端连接以接收外部电子邮件，输出端将邮件发送到服务器。它会自动过滤掉一些垃圾邮件。管理员仍然可以与垃圾邮件过滤器交互；他们可能想要查看被过滤的垃圾邮件，或调整垃圾邮件过滤器的敏感性。许多垃圾邮件过滤器允许添加地址，并允许邮件始终被拦截或允许。\n\
  \n防火墙设备是另一个例子。它在接通电源后很少需要配置。管理员仍然可以根据特殊需求对其进行微调；然而，它开箱即即可完成大部分所需的工作。\n\n在计算手动管理的垃圾邮件设备的价值时，还需要考虑管理员所做的工作。如果初始配置和管理该设备还需要额外的劳动和专业知识，那么该资产的价值可能会更高。\n\
  \n#### 硬件和软件资产\n\n硬件资产是任何可以物理接触的资产，包括笔记本电脑、工作站和服务器等计算机。硬件资产还包括网络设备，如路由器、交换机和防火墙。\n\
  \n不同设备之间存在巨大的价值差异。一台简单的台式 PC 成本可能低于 500 美元。然而，一台高端服务器的成本可能高达数万美元。\n\n软件资产包括操作系统和应用程序。操作系统是允许计算机运行的基础；操作系统可以是微软系统，例如\
  \ `Windows 10` 或 `Windows Server 2016`，也可以是 `UNIX` 或 `Macintosh` 系统。\n\n应用程序允许执行任务。例如，`Microsoft\
  \ Word` 是一个允许创建和编辑文档的应用程序。同样，`Oracle` 是用于管理数据库的服务器级应用程序。\n\n操作系统和应用程序也可能有广泛的成本范围。例如，台式\
  \ PC 的操作系统和应用程序成本在几百美元不等。然而，服务器的操作系统和应用程序成本很容易达到数千美元。\n\n## 人员资产\n\n人员资产需要进行评估。一个能够留住人员的组织通常比人员流动率高的组织问题更少。组织可以采取特定措施来留住优秀人才。\n\
  \n例如，组织有不同的水平。一个能够留住人员的组织通常比人员流动率高的组织问题更少。组织可以采取特定措施来留住优秀人才。\n\n#### 数据和信息\n\n数据信息资产通常是组织拥有的最有价值的资产。数据以各种形式存在，包括数字和物理形式。数据的价值取决于其对组织的重要性及其敏感性。\n\
  \n数据可以分为不同的类型，包括：\n\n*   **公共数据**：公共数据供任何人免费使用。\n*   **私有数据**：私有数据仅供特定个人或组织使用。它可能是敏感的，泄露可能会对个人或组织造成伤害。\n\
  *   **专利有数据**：专利数据是组织特有的，并提供竞争优势。\n\n#### 设施和用品\n\n在评估资产时，需要考虑的其他项目是设施和用品。备用地点的类型取决于主地点的价值。需要考虑存储在那里的用品，以确保备用地点能够执行相同的工作。当然，可能完全不需要备用地点。\n\
  \n某些组织可能会意识到他们的其中一个设施如此重要，以至于需要冗。在这种情况下，`冗余` 是另一个可以执行相同功能的站点。四种类型的站点有：\n\n*   **热备机房\
  \ (Hot site)**：可以在短时间内接管另一个运行运行。热备机房拥有执行关键功能所需的所有硬件、软件和数据，是四种中最贵的。\n*   **冷机房 (Cold\
  \ site)**：有电力和自来水的建筑，但几乎没有其他东西。可以将计算机和数据带到这里进行设置。冷机房是四种中最便宜的。然而，设置所需的时间最长。\n*  \
  \ **温机房 (Warm site)**：热备机房和冷机房之间的折中。它可能包含所有硬件，但数据可能不是最新的，可能需要一天或更长时间来实施。\n*   **移动机房\
  \ (Mobile site)**：温机房和冷机房之间的折中。它具有带有必要硬件和软件的可移动结构。移动机房的温度取决于可用的基础设施；因此，它几乎可以像温机房一样运行。\n\
  \n### 识别和评估相关威胁\n\n威胁是对数据、硬件或系统的任何潜在危险。威胁评估是识别威胁的过程。\n\n理解威胁如何与整体风险交互至关重要。**图 6-4**\
  \ 显示了威胁、攻击、漏洞和损失之间的关系。威胁产生攻击，攻击利用漏洞。当威胁/漏洞对发生时，就会产生损失。\n\n![图 6-4 威胁与漏洞。](img/9781284183719_CH06_FIGF04.png)\n\
  \n\n\n\n# 图 6-4 威胁与漏洞。\n\n在图中，攻击者被呈现为一个威胁。然而，威胁可以是任何能够损害机密性、完整性可用性的因素。威胁可以是外部的或内部的、自然的或人为的、故意的或意外的。\n\
  \n### 注意 ![](img/Note.png)\n\n本节介绍了与风险评估相关的威胁和活动。\n\n可以使用两种主要方法之一识别威胁。它们是：\n\n*\
  \   审查历史数据\n*   进行威胁建模\n\n## 审查历史数据\n\n历史往往会重演，IT 系统也是如此。通过审查历史数据来识别现实威胁，可以节省大量时间。\n\
  \n在审查历史数据时，以下事件至关重要：\n\n*   **攻击**——如果组织的网站以前遭受过攻击，那么它很可能再次受到攻击。下次攻击的成功取决于自那以后实施的保护水平，这对于任何类型的事件都是如此。\n\
  *   **自然事件**——如果飓风曾袭击过某公司的所在地，它们未来很可能再次发生。大多数处于飓风、龙卷风和地震等自然灾害风险区域的组织都建立了灾难恢复和业务连续性计划。这些计划应该定期（例如每年一次）进行审查，至少要测试。\n\
  *   **事故**——事故可以是任何影响机密性、完整性或可用性的意外事件，包括用户不小心删除数据。事故还包括工作场所的人员错误或意外。\n*   **设备故障**——设备故障会导致中断，某些系统比其他系统更容易故障。此外，某些故障对业务目标的影响大得多。通过分析过去的故障，通常可以预测未来的故障。应该识别出哪些系统将从额外的冗余硬件中受益。\n\
  \n## 进行威胁建模\n\n威胁建模是一个通过从攻击者的角度观察系统来识别系统上可能威胁的过程。威胁建模的结果是一个称为“威胁模型”的文档。\n\n威胁模型提供了以下信息：\n\
  \n*   **系统**——包含系统的背景信息。\n*   **威胁概要**——威胁概要是一份威胁列表，用于识别攻击者可能尝试对系统做的操作，包括攻击的可能目标。例如，一种攻击可能试图击垮系统，而另一种攻击可能试图访问系统中的数据。\n\
  *   **威胁分析**——对威胁概要中的每种威胁都进行分析，以确定资产是否存在漏洞。威胁分析包括审查现有的控制措施，以确定其对威胁的有效性。\n\n威胁建模允许根据攻击发生的概率潜在危害对攻击进行优先级排序。\n\
  \n## 识别和评估相关漏洞\n\n漏洞是物理、技术或操作安全方面的弱点。它可以是程序性的、技术的或物理的。\n\n有两点与漏洞密切相关：\n\n*   **所有系统都有漏洞**——消除所有漏洞与消除所有风险一样不可能。目标是识别相关的漏洞，以便实施控制措施来减少弱点。\n\
  *   **并非所有漏洞都会导致损失**——只有当威胁和漏洞结合成威胁/漏洞对时，才会发生损失。只需要识别和评估相关的漏洞。\n\n识别和评估漏洞的方法之一是通过评估。两种主要的评估是：\n\
  \n*   漏洞评估\n*   利用\n\n## 漏洞评估\n\n漏洞评估是一个用于发现系统弱点的过程。评估将对漏洞进行优先级排序，以确定哪些弱点是相关的。\n\
  \n漏洞评估可以在内部或外部进行。内部评估尝试从网络内部发现弱点，外部评估则尝试发现公司外的攻击者可能看到什么。\n\n### 注意 ![](img/Note.png)\n\
  \n执行漏洞评估是为了发现弱点。然而，记住攻击者也可以执行相同的步骤是很重要的。许多流行的漏洞评估套件都包含可用于利用评估的工具。\n\n漏洞评估通常从收集信息开始，使用漏洞扫描器进行网络侦查。漏洞评估类似于敌方侦察目标以评估其并确定最佳攻击方法。漏洞评估可能有几个目标，例如：\n\
  \n*   **识别 IP 地址**——Ping 扫描工具识别哪些 IP 地址正在使用。当系统对 ping 响应时，说明该 IP 地址正在正常运行。\n*  \
  \ **识别名称**——对于互联网上的计算机，可以使用“Whois”工具从 IP 地址识别计算机名称。\n*   **识别操作系统**——指纹工具可以识别 IP\
  \ 地址上运行的是哪种操作系统。该工具向系统发送并接收流量，然后分析流量以确定运行的是哪种操作系统。例如，微软操作系统在互联网控制消息协议 (ICMP) 流量中包含独特的位。这些位证实了它是微软产品。同样，某些\
  \ UNIX 和 Linux 操作系统在 ICMP 包中也包含识别这些操作系统的位。\n*   **识别开放端口**——端口扫描识别开放端口，从而识别正在运行的哪些协议和和服务。例如，如果端口\
  \ 80 是开放的，则系统上运行着超文本传输协议 (HTTP)，表明它是一个 Web 服务器。\n*   **识别弱密码**——密码破解器确定一个或多个账户的密码。密码破解器的成功很大程度上取决于密码的强度，这意味着密码破解器可以发现弱密码。\n\
  *   **捕获数据**——通过网络传输的数据可以被捕获和分析。如果以明文传输或未加密，就可以被读取。\n\n### 注意 ![](img/Note.png)\n\
  \n本节介绍了识别和评估漏洞的过程。\n\n有多种工具可用于漏洞评估。某些工具只执行特定功能，例如将 IP 地址转换为名称。其他工具则包含多个功能，例如 Microsoft\
  \ Office，它包含全套应用程序。\n\n一些常用的漏洞评估工具包括：\n\n*   **Nmap**——Nmap 是一个免费的网络映射工具。它将 Ping\
  \ 扫描器（用于发现 IP 地址）与端口扫描器（用于确定开放端口）相结合。然后使用其他技术发现远程系统的操作系统和其他细节。\n*   **Nessus**——Nessus\
  \ 是提供全套工具的商业产品。例如，它可以运行 Nmap 或其他端口扫描器之一，可以检测系统配置中的常见漏洞，并包含密码破解器。Tenable Network\
  \ Security 销售 Nessus，该公司定期通过以加载项形式发布新工具来改进产品。\n*   **SAINT**——SAINT 是系统管理员集成网络工具（System\
  \ Administrator’s Integrated Network Tool）的缩写。就像 Nessus 包含全套漏洞工具一样，SAINT 也是如此。Saint\
  \ Corporation 销售 SAINT 和其他安全工具。\n\n#### 利用评估\n\n\n\n\n\n漏洞评估 尝试发现攻击者可以利用哪些漏洞。这些评估也被称为\
  \ `渗透测试`。漏洞评估通常从漏洞扫描开始。在发现弱点之后，再尝试进行漏洞评估。\n\n漏洞评估与脆弱性评估之间存在显著差异。具体来说，漏洞评估是侵入性的；其目标是测试漏洞利用利用。如果漏洞评估成功，可能会中断业务运行。考虑到这一点，执行漏洞评估时应谨慎行事，绝不能在没有明确授权的情况下进行。意外停止生产服务可能会导致某人的漏洞评估职业突然终结。\n\
  \n## 识别和评估控制措施\n\n`控制措施` 也称为`对策措施` 是一种安全控制手段或保护性措施。实施控制措施是为了降低风险，而可以通过减少漏洞或威胁的影响来降低风险。\n\
  \n在识别和评估控制措施时，应考虑以下因素：\n\n* `现实施控制`(In-place controls)——现实施控制是指当前安装在运行系统中的控制措施。\n\
  * `计划性控制`(Planned controls)——计划性控制是指具有指定实施日的控制措施。\n\n### 现实施与计划性控制\n\n控制措施需要成本。在购买控制措施之前，组织将评估各种选项。在评估替代控制措施期间，组织将收集相关文档。在进行风险评估时应审查这些控制措施的文档，因为它们可以揭示许多问题。\n\
  \n如果控制措施到位，就可以衡量其有效性。理想情况下，控制措施的有效性与其预期一致，但某些控制措施的效果不如其他。例如，可能增加了一个入侵检测系统，产生了大量的误报，导致管理员最终忽略了它们；或者增加了一个垃圾邮件设备，将有效邮件标记为垃圾邮件。\n\
  \n需要确定为什么`现实施控制措施` 失效。风险评估可以包含对该控制措施的评估，以确定采取不同的应对措施。了解控制措施是否有效也很重要。\n\n`计划性控制`\
  \ 可能不会发生改变。然而，审查建议它的文档仍然具有价值。可以对当前系统进行评估，以确保原始威胁和漏洞仍然存在。可能还存在额外的工具或技术，可以对原始建议进行增强。\n\
  \n### 控制类别\n\n控制措施以多种方式组织或分类。一种流行的方法是根据以下三个类别来定义它们：\n\n* `程序性控制`(Procedural controls)\n\
  * `技术性控制`(Technical controls)\n* `物理控制`(Physical controls)\n\n以下章节解释了这三个类别，但也使用了其他类别。NIST\
  \ 发布了许多与信息安全相关的文档。`SP 800-53 Rev. 4，联邦信息系统和组织的安全与隐私控制` 于 2013 年 4 月发布。\n\n### ![](img/Note.png)\
  \ 注意\n\n本节介绍了控制措施的识别和评估。\n\n修订版 4 之前的 NIST `SP 800-53` 将这些族分类为管理控制、技术控制或操作控制。然而，每个族中的某些控制措施具有管理、技术和操作类别的组合。NIST\
  \ 在 `SP 800-53 Rev. 4` 中删除了这些分类。`表 6-1` 显示了当前的 NIST 控制族。\n\n**表 6-1** NIST 控制族\n\
  \n| 控制族 || 控制数量 |\n| --- | --- |\n| 访问控制 (Access Control) || 23 |\n| 意识与培训 (Awareness\
  \ and Training) || 4 |\n| 审计与责任制 (Audit and Accountability) || 16 |\n| 安全评估与授权 (Security\
  \ Assessment and Authorization) || 8 |\n| 配置管理 (Configuration Management) || 11\
  \ |\n| 应急计划 (Contingency Planning) || 12 |\n| 身份识别与身份认证 (Identification and Authentication)\
  \ || 11 |\n| 事件响应 (Incident Response) || 10 |\n| 维护 (Maintenance) || 6 |\n| 媒体保护\
  \ (Media Protection) || 8 |\n| 物理与环境保护 (Physical and Environmental Protection) ||\
  \ 19 |\n| 规划 (Planning) || 6 |\n| 人员安全 (Personnel Security) || 8 |\n| 风险评估 (Risk\
  \ Assessment) || 5 |\n| 系统与服务获取 (System and Services Acquisition) || 20 |\n| 系统与通信保护\
  \ (System and Communications Protection) || 41 |\n| 系统与信息完整性 (System and Information\
  \ Integrity) || 16 |\n| 程序管理 (Program Management) || 16 |\n\n无论控制措施如何列出，其目标都是保护系统和数据的机密性、完整性和可用性。\n\
  \n### 程序性控制\n\n`程序性控制` 是根据高层管理指导的规则和准则采取的控制措施，包含了若干特定的控制。然而，关于程序性控制的一个重要点是，它们是通过书面文档实施的。\n\
  \n程序性控制的示例：\n\n* `策略与程序`(Policies and procedures)——这种控制可以是组织的安全策略。例如，它也可以是备份服务器的具体程序。\n\
  * `安全计划`(Security plans)——这些计划是全面的，有助于组织应对不同的事件。例如，灾难恢复计划有助于飓风或地震。\n* `保险`(Insurance)——保险可以减少风险的影响。例如火险和水险。\n\
  * `人员检查`(Personnel checks)——组织可能已有政策对人员进行不同类型的检查；可能包括背景检查或财务检查。\n* `意识与培训`(Awareness\
  \ and training)——许多组织定期采取步骤提高人员的安全意识，可以通过例如正式培训、海报和电子邮件来实现。\n* `行为准则`(Rules of behavior)——许多组织使用行为准则，也称为接受使用策略\
  \ (`AUP`)，让人们知道他们可以在计算机和系统中做什么。`AUP` 通常是用户入职时阅读并签署的文档。通常，员工需要定期审查这些文档，例如每年一次。\n\n\
  ### ![](img/Note.png) 注意\n\n之前的 `SP 800-53` 将`程序性控制`称为`管理控制`。\n\n### 技术性控制\n\n技术性控制使用计算机或软件来保护系统。技术性控制的优点是自动化的，这意味着它设置一次后将持续执行该控制。\n\
  \n技术性控制的一些示例：\n\n* `登录标识符`(Logon identifier)——用户在获得系统访问之前需要提供凭据，这也被称为身份认证。存在三种身份认证因素：\n\
  \    * 用户知道的，例如用户名和密码\n    * 用户拥有的，例如智能卡卡\n    * 关于用户的信息，例如通过生物识别获取的信息\n* `会话超时`(Session\
  \ time-out)——许多系统在不活动一段时间后会自动超时。例如，受密码保护的屏幕保护程序在特定分钟后锁定计算机。时间过去后，屏幕保护程序启动，用户必须输入凭据才能再次访问系统。\n\
  * `系统日志`(System logs)——系统日志记录系统、用户或攻击者执行的操作。例如，系统日志可以识别服务器何时关闭，以及特定服务何时停止或启动。应用程序日志可以记录特定的应用程序活动。\n\
  * `审计跟踪`(Audit trails)——许多类型的审计日志可以创建审计跟踪。安全日志可以记录对特定文件的所有访问，防火墙日志可以记录进入或离开网络的所有流量。\n\
  \n\n\n\n\n*   **输入验证**——应用程序在使用数据之前，可以使用数据范围和合理性检查对数据进行验证。一个简单的例子是，除以零是不可能的。接受用于\
  \ `divide` 操作的值的程序可以确保在使用这些值之前确保该值不为零。\n*   **防火墙**——网络防火墙可以控制进入和离开网络的流量。基于主机的防火墙可以限制单个系统的流量。\n\
  *   **加密**——数据在存储在驱动器上或通过网络传输时可以进行加密，从而提供数据的机密性。\n\n## 物理控制\n\n物理控制用于控制物理环境。物理控制包括限制物理访问的锁和安保人员，以及控制环境的元素，例如加热和冷却系统。\n\
  \n物理控制的示例包括：\n\n*   **锁的门**——服务器房可以锁上以保护服务器，托管路由器和交换机的布线间也可以锁上。还可以通过锁门和文件柜来保护专有数据，例如员工文件或研究数据。\n\
  *   **安保和访问日志**——可以聘请安保人员控制对敏感区域的访问，例如建筑正门或内部区域，并可以使用访问日志列出具有授权访问权限的个人。安保人员只允许列表上的人员进入。访问日志还可以用于记录访问过房间的个人。\n\
  *   **视频摄像头**——摄像头可以持续监控某些区域。闭路电视（CCTV）系统作为威慑手段效果非常好，因为许多 CCTV 系统可以记录来自多个摄像头的数据。\n\
  *   **火灾检测和灭火**——火灾可以在极短时间内破坏大量数据和硬件。有效的检测和灭火系统可以在火势变大之前检测到火灾并迅速扑灭。\n*   **水检测**——某些区域容易发生洪水。当检测到水时，可以自动启动泵排除水分。如果无法控制洪水，检测系统可以关闭电气系统以减少可能的损坏。\n\
  *   **温度和湿度检测**——系统需要在特定的温度范围内运行。如果温度过高，电气元件会因过热而失效。高湿度会导致系统产生冷凝，这可能也会导致故障。加热、通风和空调（HVAC）系统控制温度和湿度。\n\
  *   **电气接地和断路器**——适当的接地可以确保电气系统故障时将危险电压引导到地。接地保护设备和人员，而断路器保护系统和布线。当故障导致过电流时，断路器将在过电流引发火灾或损坏设备之前切电源。\n\
  \n## 根据评估需求选择方法\n\n一旦对各个元素进行了单独识别和评估，就需要计算相关的风险。可以使用的两种主要方法是：\n\n*   定量风险评估\n* \
  \  定性风险评估\n\n## 定量方法\n\n定量方法使用预定义的公式。收集到的数据被用于识别以下值：\n\n*   **显露因子 (EF)**——`EF`\
  \ 描述了由于威胁导致资产将发生的损失，并以百分比值表示。\n*   **单次损失预期 (SLE)**——`SLE` 是任何单次事件的预期损失。它以货币形式表示，例如\
  \ $1,000。资产价值 (`AV`) 乘以 `EF` 等于 `SLE`。\n*   **年度发生率 (ARO)**——`ARO` 是预计每年发生损失的次数。例如，该风险去年可能发生了四次，因此\
  \ `ARO` 为四。\n*   **年度损失预期 (ALE)**——`ALE` 可以计算为 `SLE` × `ARO`。例如，`ALE` 将是 $1,000\
  \ × 4，即 $4,000。\n*   **保护措施或控制价值**——该值是控制的成本，以货币形式表示。\n\n实施控制措施是为了降低风险。更直接地说，控制将减少\
  \ `ARO`。如果实施控制前 `ARO` 为四，那么实施控制后 `ARO` 应该小于四。然后，将控制成本与节省的金额进行比较。\n\n例如，一个网站每小时产生\
  \ $5,000 的收入。在过去的两年里，它发生了两次硬盘故障。每年，系统中的几个硬盘中有一个会发生故障。每次故障都导致了大约三小时的停机。硬盘成本约为 $300。`SLE`、`ARO`\
  \ 和 `ALE` 分别是多少？\n\n*   `SLE` 为 $15,300。计算方法为停机期间 $5,000 × 3。然后加上新硬盘的 $300。`SLE`\
  \ 包含了 `AV`（即如果威胁发生时业务可能面临的损失）乘以 `EF`。如果 `EF` 为 1（即对威胁的显露比例为 100%）且 `AV` 为 $15,300，那么\
  \ `SLE` 等于 1 乘以 $15,300。\n*   `ARO` 为 1。从历史上来看，停机每年发生一次。如果不采取措施降低风险，它可能会每年发生一次。\n\
  *   `ALE` 为 $15,300。计算方法为 $15,300 × 1。\n\n此示例未包含无形成本。例如，在网站宕机时访问的客户可能永远不再回来。找回该客户或获取新客户的成本是无形成本。\n\
  \n可能会决定使用硬件冗独立磁盘阵列 (`RAID`) 来消除这种风险。硬件 `RAID` 成本为 $3,000，这识别了这种风险。如果某个硬盘发生故障，`RAID`\
  \ 可以防止系统崩溃，并将 `ARO` 变为 0。\n\n实施 `RAID` 是否具有效益？通过比较以下几项信息可以做出判断：\n\n*   控制前的 ALE——$15,300\n\
  *   控制成本——$3,000\n*   控制后的 ALE——$300，节省了 $15,000。即使 `RAID` 中的某个硬盘仍然发生故障，也只会产生 $300\
  \ 的成本。\n\n如果控制成本低于控制后的 ALE，则该控制是合理的。换句话说，花费 $3,000 可以节省 $15,000，实现了 $12,000 的节省。\n\
  \n另一方面，如果控制成本为 $50,000，根据现有数据该控制将是不合理的：花费 $50,000 来节省 $15,000，这会导致亏损。\n\n![](img/Note.png)\
  \ 注意\n\n平均故障间隔时间 (`MTBF`) 提供了硬盘的可靠性估计。`RAID` 硬盘通常比标准硬盘具有 `MTBF`。为了简单起见，控制后的 ALE\
  \ 计算假设所有硬盘具有相同的 `MTBF`。\n\n## 定性方法\n\n在这种情况下，实际成本不可用或难以计算。相反，可以使用定性方法。定性方法使用专家的意见来确定两个主要数据点：\n\
  \n*   **概率**——风险发生的可能性。它可以用文字表示，如*低*、*中*或*高*。它也可以以百分比表示，例如 10%、50% 或 100%。\n*  \
  \ **影响**——风险发生时损失的程度。它可以用文字表示，如*低*、*中*或*高*。它也可以以范围内的数字表示，例如 1 到 10 或 1 到 100。\n\n\
  \n\n\n概率和影响可以对风险进行排序。这种排序允许优先考虑最重要和最不重要的风险。\n\n在示例中，我们正在对 Web 服务器的缓冲区溢出攻击、SQL 注入攻击和网页篡改进行评估。根据目前保护服务器的控制措施，专家提供了如表\
  \ 6-2 所示的数据。\n\n**表 6-2** 带有现有控制措施的定性分析调查\n\n![](img/Table6-2.png)\n\n这些风险中的每一个都可以确定优先级：\n\
  \n*   **缓冲区溢出**——风险分为 5。计算方法为 `.10 × 50`。\n*   **SQL 注入攻击**——风险分为 67.5。计算方法为 `.75\
  \ × 90`。\n*   **网页篡改**——风险分为 6.25。计算方法为 `.25 × 25`。\n\n表 6-2 中的信息清楚地表明，基于目前的控制措施，最高风险来自\
  \ SQL 注入攻击。现在，可以识别缓解此风险的控制措施。\n\n然后，可以咨询专家以识别出能提供最佳收益的控制措施。也可以使用类似的调查来识别实施控制措施后风险的概率和影响。\n\
  \n### 制定缓解建议\n\n执行分析后，可以向管理层提供具体的建议。这些建议应该降低风险。可以包含收集的数据以支持这些建议。\n\n支持数据可能包括：\n\n\
  *   威胁/漏洞对\n*   实施成本和时间的估算\n*   运营影响估算\n*   成本效益分析\n\n## 威胁/漏洞对\n\n建议的控制措施应该针对特定的风险。当威胁利用漏洞时，风险就会产生。如果不存在可以利用漏洞的威胁，那么风险就不存在。同样，如果不存在威胁可以利用的漏洞，风险也不存在。\n\
  \n例如，恶意软件是一个非常真实的威胁。然而，如果创建一个永远不会连接互联网或不从其他源接收数据的隔离系统，那么它就是没有漏洞的。在这个示例中，并不存在威胁/漏洞对，因为威胁无法与漏洞匹配。相比之下，典型的计算机系统可以访问互联网、接收电子邮件，并允许用户连接通用总线（`USB`）设备，这些都使其变得非常脆弱。\n\
  \n控制措施需要针对特定的威胁/漏洞对。每项建议将处理一个或多个威胁/漏洞对。如果控制措施无法与威胁/漏洞对关联，则该控制措施是不必要的，这成了检查控制措施有效性的简单方法。\n\
  \n这也可以与物理控制进行类比。如果计算机实验室未锁门（无论是故意的还是无意的），那么人类威胁就可以利用未锁的实验室获得对内部计算机的访问。风险来自于威胁（人类）利用漏洞（未锁的门）来损害资产（实验室计算机及其包含的信息）。为了控制这一点，实验室的门和计算机必须锁好，并仅供授权人员使用。此外，还可以安装\
  \ CCTV 摄像头作为额外的控制机制。\n\n许多控制措施将处理多个威胁/漏洞对。如果该控制措施可以缓解多个对，则每一对都应该列出来。\n\n#### 实施成本和时间的估算\n\
  \n控制措施的成本应包含在建议中，并将纳入 `CBA`。通过包含直接和间接成本来准确识别这些成本是非常重要的。\n\n直接成本就是购买控制措施。然而，间接成本并不总是容易识别。例如，间接成本可能包括学习该控制措施所需的人力以及培训成本。\n\
  \n一个常见的错误是低估实施控制措施所需的成本。例如，复杂的防火墙可能需要一个受过培训的管理员。如果获取了防火墙但管理员没有使用它的知识，它就会闲置。管理员随后需要自己掌握它，或者参加正式课程。在此期间，防火墙会一直待在箱子里。\n\
  \n还应该包含实施该控制措施的时间表或时间。对于简单的控制措施，时间可以忽略不计。但对于其他控制措施，时间可能会很长。例如，决定在用户登录时增加安全性。不再使用用户名和密码，而是使用智能卡，这将需要一个分阶段实施的方法。需要添加公钥基础结构（`PKI`）。\n\
  \n#### 运营影响估算\n\n控制措施的成本应包含在建议中，并将纳入 `CBA`。。通过包含直接和间接成本来准确识别这些成本是非常重要的。\n\n直接成本就是购买控制措施。然而，间接成本并不总是容易识别。例如，间接成本可能包括学习该控制措施所需的人力以及培训成本。\n\
  \n一个常见的错误是低估实施控制措施所需的成本。例如，复杂的防火墙可能需要一个受过培训的管理员。如果获取了防火墙但管理员没有使用它的知识，它就会闲置。管理员随后需要自己掌握它，或者参加正式课程。在此期间，防火墙会一直待在箱子里。\n\
  \n还应该包含实施该控制措施的时间表或时间。对于简单的控制措施，时间可以忽略不计。但对于其他控制措施，时间可能会很长。例如，决定在用户登录时增加安全性。不再使用用户名和密码，而是使用智能卡，这将需要一个分阶段实施的方法。需要添加公钥基础结构（`PKI`）。\n\
  \n任何计算机系统都有四种资源。如果控制措施产生了影响，这种影响通常出现在以下方面：\n\n*   **处理器**——处理器执行大部分计算工作。桌面 PC 通常是多核，而服务器通常有多个处理器。控制措施可能会消耗大量的资源。如果处理器使用率接近\
  \ 100%，系统就会变慢。\n*   **内存**——处理器只能处理内存中的数据。系统内存的大小往往是一个限制因素。如果系统内存不足，它会在内存和磁盘之间交换数据。\n\
  *   **磁盘**——磁盘子系统的容量和速度需要考虑。控制措施通常需要一定的磁盘空间。此外，数据在处理器需要之前存储在磁盘上。当处理器需要数据时，它会被交换到内存中。如果磁盘速度慢，数据交换可能会减慢系统。\n\
  *   **网络接口**——计算机使用 `NIC` 访问网络资源。如果考虑的控制措施将在网络上传输数据，则应考虑 `NIC` 的当前带宽。\n\n## 成本效益分析\n\
  \n\n\n\n\n一个 `CBA`（成本效益分析）应该包含所有建议，因为它显示了成本是合理的。理想情况下，`CBA` 将显示投入少量的资金可以从长远来看节省大量资金。`CBA`\
  \ 是管理层用于证明成本合理的重要工具。\n\n如前所述，定量风险评估包含金额数字，用于 `CBA`。另一方面，定性风险评估不包含金额数字。因此，在使用定性风险评估时，需要采取额外步骤创建\
  \ `CBA`。\n\n## 提交评估结果\n\n风险评估完成后，会创建一个记录结果的报告。该报告应包含两个阶段。\n\n在第一阶段，将建议提交给负责实施的管理人员，他们可能会批准每项建议。管理人员可能会认为某项建议的\
  \ `CBA` 不合理。另一个建议，他们可能决定接受风险。实施控制后剩余任何风险都是剩余风险。管理人员还负责剩余风险。\n\n在第二阶段，记录管理人员做出的决策。然后创建一个行动里程碑计划（`POAM`）。`POAM`\
  \ 可用于跟踪控制。有助于实施控制并跟踪实际成本。\n\n## 执行风险评估的最佳实践\n\n为了确保风险评估的成功，可以采取几个步骤。以下列表识别了执行风险评估的最佳实践：\n\
  \n- **完整描述系统**——描述包括系统的运行特性和任务。确保数据是新的，因为 IT 系统会升级和改进。如果不使用当前的文档，资源将被浪费。\n- **审查过去的审计**——如果执行了审计，应审查其结果。审计识别了漏洞，这些建议通常已经实施或计划中实施。\n\
  - **审查过去的风险评估**——如果执行过之前的风险评估，应对其进行审查。某些系统会定期评估，例如每年或每三年一次。这些信息可以与近期活动进行比较。例如，新的威胁或漏洞可能导致之前未解决的停机。\n\
  - **将风险评估与管理结构匹配**——风险评估应根据系统的所有权或责任进行。当风险评估跨越管理部门时，实施控制会变得困难。\n- **识别风险评估范围内的资产**——在识别资产时，确保包含风险评估范围内的资产。这将防止范围蔓延。\n\
  - **识别并评估相关威胁**——应评估相关的威胁。可以查看历史数据以确定哪些威胁导致过问题。威胁建模也可识别威胁。\n- **识别并评估相关漏洞**——存在许多弱点，但并非所有都要包含，仅包含与风险评估相关的。\n\
  - **识别并评估控制**——确保所有控制都直接对应一个威胁/漏洞对，且 `CBA` 证明了该控制的成本。\n- **跟踪结果**——记录风险评估的结果和批准的建议，并创建一个\
  \ `POAM` 来跟踪建议的实施情况。\n\n## 章节总结\n\n风险评估的执行需要几个特定步骤。第一步是定义要评估的系统。应考虑管理结构以确保建议易于实施。\n\
  \n接下来，识别威胁和漏洞。相关的威胁/漏洞对识别出实际风险。然后评估缓解这些风险的控制。将这些建议同 `CBA` 一起提交管理层决策。最后，使用 `POAM`\
  \ 跟踪已批准的建议。\n\n## 概念和术语\n\n- 资产价值\n- 审计跟踪\n- 黑名单\n- 变更管理\n- 配置管理\n- 控制\n- 对措施\n\
  - 利用评估\n- 组策略\n- 基于主机的入侵检测系统 (HIDS)\n- 现地控制\n- 运营影响\n- 计划控制\n- 程序控制\n- 威胁建模\n- 漏洞评估\n\
  - 白名单\n\n## 第 6 章评估\n\n1. 一家公司开始对一个系统进行风险评估。系统的运行特性和任务应在风险评估的早期阶段定义。\n    A. 战术性的\n\
  \    B. 战略性的\n    C. 运营的\n    D. 愿性的\n\n2. 风险评估识别哪些？\n    A. 资产\n    B. 威胁\n   \
  \ C. 漏洞\n    D. 控制\n    E. 以上所有\n\n3. 在选项中，哪些被视为资产？\n    A. 硬件\n    B. 软件\n    C.\
  \ 人员\n    D. 数据和信息\n    E. 以上所有\n\n4. 定义系统时应包含什么？\n    A. 系统的标题\n    B. 系统的当前配置\n\
  \    C. 可能的攻击列表\n    D. 过去的风险评估\n\n5. 下哪些不包含在风险评估中？\n    A. 组织使命\n    B. 人员\n  \
  \  C. 国家\n    D. 风险管理\n    E. 以上都不是\n\n6. 哪种类型的评估可以识别弱点而不进行利用？\n    A. 漏洞评估\n  \
  \  B. 风险评估\n    C. 利用评估\n    D. 渗透测试\n\n7. 可接受使用策略是`_\\_\\_\\_\\_\\_\\_\\_\\_\\\
  _\\_`控制的示例。\n    A. 运营\n    B. 物理\n    C. 程序\n\n8. 组织要求用户使用令牌登录。这是`_\\_\\_\\_\\\
  _\\_\\_\\_\\_\\_\\_`控制的示例。\n    A. 运营\n    B. 物理\n    C. 程序\n\n9. 视频摄像头用于监控建筑安全区域的入口。这是`_\\\
  _\\_\\_\\_\\_\\_\\_\\_\\_\\_`控制的示例。\n    A. 运营\n    B. 物理\n    C. 程序\n\n10. 哪些项项被与控制进行匹配以缓解相关风险？\n\
  \    A. 威胁\n    B. 漏洞\n    C. 威胁/漏洞对\n    D. 剩余风险\n\n\n\n\n\n1. 执行控制的成本和时间\n2. 控制对业务的影响\n\
  3. 现有控制和计划控制\n4. 风险的影响\n\n14. 风险评估中包含哪些内容有助于证明控制成本成本？\n1. 概率和影响\n2. `ALE`\n3. `CBA`\n\
  4. `POAM`\n15. 通过风险评估创建了什么来跟踪控制的实施？\n1. `CBA`\n2. `POAM`\n3. `ALE`\n4. `SLE`\n\n\
