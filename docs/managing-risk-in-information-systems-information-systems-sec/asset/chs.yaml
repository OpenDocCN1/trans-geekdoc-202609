  ## 识别需要保护的资产和活动\n\n## 第七章\n\n风险管理的**重要第一步**是识别组织中的价值资产。组织拥有各种需要保护的资产，包括显易见的资产，如硬件和软件；数据和人员；以及系统功能和流程。\n\
  \n在组织识别出重要资产后，可以采取措施保护它们。业务影响分析有助于识别某项服务故障时的影响，而灾难恢复计划帮助其识别恢复故障系统所需的步骤。在更大的规模上，组织可以使用业务连续性计划来确保即使在灾难发生后关键系统也能继续运行。\n\
  \n### 第七章主题\n\n本章涵盖了以下主题和概念：\n* 什么是系统访问和可用性\n* 什么是手动和自动系统功能\n* 什么是硬件、软件和人员资产\n*\
  \ 什么是数据和信息资产\n* 资产和库存管理与典型信息技术（`IT`）基础设施七个领域的关系\n* 如何识别维护业务运营所需的设施和用品\n\n### 第七章目标\n\
  \n完成本章后，你将能够：\n* 识别系统访问和可用性的性\n* 区分手动和自动系统功能\n* 识别需要保护的硬件资产\n* 识别需要保护的软件资产\n* 识别需要保护的人员资产\n\
  * 识别组织数据和信息资产\n* 识别客户数据和信息资产\n* 识别知识产权数据和信息资产\n* 识别数据仓库和数据挖掘资产\n* 为 IT 基础设施的七个领域采取的资产管理和库存管理步骤\n\
  * 描述识别关键系统和程序的目的\n* 描述业务影响分析规划的目的\n* 描述业务连续性规划的目的\n* 描述灾难恢复规划的目的\n* 描述业务责任保险规划的目的\n\
  * 描述资产替换保险规划的目的\n\n### 系统访问和可用性\n\n系统访问和可用性是指用户（包括人员和客户）需要系统或服务，这是一个重要的考虑因素。某些系统必须在\
  \ 99.999% 的时间内运行。其他系统仅需在营业时间内运行，例如周一至周五上午 8:00 到下午 5:00。\n\n![![](img/Note.png)备注\n\
  \n九九或 99.999% 的可用时间对于某些服务是必要的，这相当于每年约 5.256 分钟停机时间。计算公式为 `60 minutes × 24 hours\
  \ × 365 days × .00001`。\n\n九九或 99.999% 的可用时间是可以实现的。`图 7-1` 显示了受双节点`failover cluster`保护的数据库服务器。故障转移集群为服务器提供了容错能力，并确保即使服务器故障，服务器提供的服务也能继续运行。它至少包含两个服务器，称为`nodes`。\n\
  \n![图 7-1 受故障转移集群保护的数据库服务器](img/9781284183719_CH07_FIGF01.png)\n\n**图 7-1** 受故障转移集群保护的数据库服务器。\n\
  \n在故障转移集群中，用户似乎连接到单个数据库服务器。图 7-1 显示了受双节点`failover cluster`保护的数据库服务器。故障转移集群为服务器提供了容错能力，并确保即使服务器故障，服务器提供的服务也能继续运行。它至少包含两个服务器，称为`nodes`。\n\
  \n### ![](img/Note.png)备注\n\n故障转移集群可以超过两个节点。例如，可以保护多个服务。外部驱动器可能成为单点故障（`SPOF`）。`SPOF`\
  \ 是系统中任何一个发生故障就会导致整个系统故障的部件。硬件冗余磁盘阵列（`RAID`）通常用于确保即使驱动器故障数据也不会丢失。\n\n故障转移集群还允许在不停机的情况下进行维护，因为可以在非活动节点上进行维护。如果活动节点需要维修，可以切换节点，使非活动节点变为活动节点。\n\
  \n\n\n\n\n虽然 99.999% 的可用性是可以实现的，但其成本非常高昂。它需要配置了故障转移集群配置的多台服务器和硬件 RAID。它甚至可能需要人工进行每天\
  \ 24 小时、每周 7 天、全年 365 天的监控。\n\n所有这些部分的成本可能非常高。虽然企业可能不希望系统出现任何停机，但大多数系统可以接受程度的停机。当经理理解了“五五九”可用性的成本时，他们通常会重新考虑自己的答案。\n\
  \n## 系统功能：手动与自动\n\n服务通常通过结合多个功能提供。这些功能可以是手的、自动的，也可以是两者的结合。在识别系统资产时，理解手动和自动之间的区别非常重要。\n\
  \n用于过滤垃圾邮件的自动垃圾邮件设备就是系统功能的一个示例。垃圾邮件设备也可以被视为提供邮件服务的许多功能之一。邮件的其他功能可能包括扫描恶意软件以及对消息进行签名和加密。\n\
  \n## 手动方法\n\n某些系统使用手动而非技术方法。例如，对于使用手动方法的酒店，员工可以使用纸质日志跟踪从初始预订到退房的所有操作。虽然难以置信，但大约\
  \ 20 年前就是这样做的。如果流程是手动的，则有两个主要的资产价值：\n\n- `Written records`——客户日志是一份手写日志，记录了客人入住和退房的时间。经理使用该日志向客户计费。\n\
  - `Knowledge of the process`——员工将知道如何根据现有记录创建账单。一旦收到付款，将有一个单独的存款存款。如果该酒店是一家由店主经营的小家庭企业，可能只有老板和一两名员工了解整个流程。\n\
  \n在这个例子中，价值在于书面记录和拥有流程知识的人员。虽然今天访问一家仅使用手动方法的酒店已不太可能，但在一家使用手动内部公司流程的公司工作是完全可能的。\n\
  \n### 自动方法\n\n酒店可以实现其许多流程的自动化。由于它是服务行业的一部分，酒店仍然会包含一些人机交互。以下示例展示了酒店如何实现其大部分流程的自动化。\n\
  \n客户可以在线注册，许多酒店都倾向于让他们这样做。有些酒店为在线注册的用户提供折扣。客户可以看到哪些日期有空以及每天的费用。他们可以选择日期并支付定金或全款。在线注册减少了酒店的人力成本。\n\
  \n当客户到达时，预订就会存在于系统中。他们将向友好的接待员办理入住，接待员将通过自动系统检查细节。接待员确认细节后，客户很快就会前往房间，可能还有行李员提着他们的行李。\n\
  \n有些酒店提供便利吧（通常是自动化的），里面有零食和点心。当客户拿走任何东西时，便利吧会感应重量变化，前台在退房时会收到提醒，告知客户可能欠费。这种便利的费用通常非常高。例如，在其他地方购买花费\
  \ 0.75 美元的巧克力棒在这里可能花费 5.00 美元。\n\n许多酒店通常包含一个显示客户账单的电视频道。当客户在餐厅消费或从便利吧取走一瓶冷水时，该账单会自动更新。当客户准备好退房时，他或她访问电视频道支付账单。很快，客户就会前往机场回到温暖的家。\n\
  \n在评估这种自动方法时，还需要考虑其他几个方面，如下：\n\n- `Value to the customers`——这些自动方法通常被认为对客户是有价值的。如果注册流程清晰且高效，客户更有可能使用它。如果退房流程没有错误，退房时的混乱就会消失。这些益处可能难以量化，但这类服务可能会带来更多的回访和口碑广告。\n\
  - `Value to the company`——任何可以自动化的流程都需要更少的人力。确保资产可以实施和维护，减少的人力投入与利润的平衡。信息技术（IT）专业人员可以节省大量成本。\n\
  - `Ensuring process stays up`——确保系统在客户想要访问时可用，这包括保护数据。\n- `Protecting data`——如果这些数据泄露，公司可能要承担责任。这些数据包括姓名、信用卡信息、地址和电话号码。\n\
  \n### ![](img/Note.png)NOTE\n\n许多法律规定保护身份信息 (PII)。PII 是任何可以识别个人的数据，也可以是医疗、财务或犯罪数据。美国标准与技术研究院\
  \ (NIST) 发布了 `SP 800-122`，这是一项帮助政府实体和公共公司保护 PII 的指南。欧盟最近更新了其指南，以反映现在被称为通用数据保护条例\
  \ (GDPR) 的内容。\n\n重要的这一点是，资产不仅仅是物品。它们也可以是提供服务的流程。\n\n## 硬件资产\n\n硬件资产是可以物理接触的资产。它们包括任何类型的计算机，如服务器或桌面电脑；网络设备，如路由器和交换机；以及网络设备，如防火墙和垃圾邮件设备。并不是所有组织的硬件资产都是相同的，因此了解特定公司拥有的资产是重要的。\n\
  \n### ![](img/Note.png)NOTE\n\n大多数组织使用数据库跟踪硬件资产。\n\n然而，识别的信息不仅仅是公司拥数量。其他信息包括：\n\n\
  - 位置\n- 制造商\n- 型号\n- 硬件组件，如处理器和随机存储器 (RAM)\n- 硬件外设备，如插件网卡 (NIC)\n- 基本输入/输出系统 (BIOS)\
  \ 版本\n\n这个列表似乎有些过度，但事实如此。为了成功的安全和配置管理，需要了解硬件的所有细节。以下是这些信息实用的例子。\n\n微软对其操作系统 (OS)\
  \ 发布的补丁导致系统进入无限重启循环。系统启动、崩溃蓝屏、恢复后再次启动并再次崩溃。当这种循环发生时，问题通常出在特定的制造商和型号上。有时，由于特定的驱动程序或系统在出货前的准备方式造成的。在库存中拥有制造商和型号将能够轻松查看微软更新是否会影响运营。\n\
  \n### ![](img/Note.png)NOTE\n\n硬件清单还可以帮助识别不需要的组件。例如，某些系统可能包含调制调器，这可能会带来巨大风险。如果用户拨号接入互联网提供商\
  \ (ISP) 访问互联网，连接是不可控的。\n\n\n\n\n同样，例如，发现了一个影响特定路由器的严重漏洞。如果硬件清单中包含了路由器的制造商和型号，那么将很容易确定哪些路由器是否存在漏洞。如果没有清单，可能在攻击成功发生之后，人们还不知道这些路由器的漏洞情况。\n\
  \n## 控制硬件购买\n\n许多组织都有控制硬件购买的策略。只有在核准的硬件列表上的硬件才能被购买。尽管这对于用户来说通常不方便，但它提供了额外的安全保障。\n\
  \n首先，应该验证核准列表上的硬件是否仅包含环境所需的必要组件。如果某个组件没有被添加，则该组件不存在风险。然而，如果添加了不必要的组件，则需要对其进行管理以减少任何潜在风险。\n\
  \n其次，控制环境中引入的配置数量可以提高可用性。例如，如果所有用户都使用相同的台式电脑，那么桌面支持人员只需要学习一种系统的细节。一旦他们掌握了这一个系统，就可以轻松地排除所有系统的故障。相反，如果环境中有\
  \ 30 种种不同类型的台式电脑，排除故障将变得更加困难。\n\n用户可能会访问通常被代理服务器拦截的网站。他们可能会下载通常会被防火墙过滤的恶意软件。拨号调制调器允许系统绕过所有控制并访问互联网。移除调制调器即可消除风险。\n\
  \n## 软件资产\n\n软件资产包括操作系统（OS）和应用程序。操作系统启动计算机。操作系统的示例有 Microsoft Windows、Mac OS 和 Red\
  \ Hat Linux。应用程序执行特定的功能或任务。应用程序的示例有 Microsoft Word 和 Adobe Reader。大多数组织使用数据库来跟踪硬件资产。使用同一个数据库跟踪软件资产也是常见的。\n\
  \n在识别软件资产时，具体化非常重要。仅将操作系统列为 `Windows` 或 `Linux` 是不够的，因为 `Windows` 和许多 Linux 发行版（也称为\
  \ `distros`）有许多版本。同样，仅将应用程序列为 `Word` 也是不够的。\n\n操作系统的细节应包括：\n\n*   安装操作系统的硬件系统\n\
  *   操作系统的名称，例如 Microsoft Windows 10\n*   已安装的最新服务包\n\n准确的操作系统列表可以帮助 IT 人员快速识别操作系统是否受到新威胁的侵害。例如，IT\
  \ 人员发现了一个针对 Microsoft Windows 10 的新漏洞。了解公司有多少台 Windows 10 系统以及它们在哪里，将帮助他们快速应对该漏洞。\n\
  \n另一方面，如果 IT 人员没有准确的列表，他们的工作将变得困难得多，因为他们必须检查所有系统。即使只需检查 50 个系统也会花费时间。对于 5,000 个系统，这项任务将无法手动完成，这使得自动化资产管理变得十分必要。\n\
  \n然而，如果有准确的清单，工作将变得简单得多。只需查看清单即可识别运行 Windows 10 的系统数量。此外，清单会将操作系统与硬件关联起来，IT 人员将确切知道\
  \ Windows 10 系统所在的位置。\n\n## 提示\n\n服务包 (SP)是一组适用于特定操作系统的更新、补丁和修复程序。服务包偶尔会包含操作系统的额外功能，而且它们通常是累积的。例如，微软于\
  \ 2011 年 3 月发布了 Windows 7 SP1，它包含了在该日期之前发布的所有 Windows 7 的更新、补丁和修复程序。从 Windows 8\
  \ 开始，微软用重大更新取代了服务包。例如，Windows 8.1 是 Windows 8 的第一个重大更新。获取服务包更新的最推荐且最简单的方法是开启计算机上的\
  \ Windows 更新，让 Windows 在您需要的更新准备好安装时通知您。例如，Windows 10 会自动下载并安装所需的更新，允许设备高效安全地运行。\n\
  \n## 自动化资产管理\n\n可以使用许多企业工具来自动化资产管理。这些工具可以识别网络中的所有硬件，包括台式电脑、服务器、交换机和路由器。例如，System\
  \ Center 2016 提供了远程控制、补丁管理、软件分发、操作系统、访问保护以及硬件资产清单的混合云环境管理。`ConfigMgr` 可以识别网络中的所有系统。在正确查询时，大多数系统会显示其型号和序列号。通过这些培训，管理人员可以发现未经授权的软件。\n\
  \n然而，如果有准确的清单，工作将变得简单得多。只需查看清单即可识别运行 Windows 10 的系统数量。此外，清单会将操作系统与硬件关联起来，IT 人员将确切知道\
  \ Windows 10 系统所在的位置。\n\n*(注：由于提供的原文文本中存在部分内容重复或逻辑跳层，上述翻译已根据提供的文本内容完整翻译)*\n\n\n\n\
  \n- **职位轮岗**——人员可以定期轮换到不同的职位，例如每年一次。将人员轮换到不同的职位有助于他们建立各种技术的技能，并有助于确保有两名以上的人知道如何维护任何\
  \ IT 系统。职位轮岗还有助于组织发现危险的捷径或欺诈活动。人员在岗位之间的轮入和轮出有助于 IT 管理员对工作实践获得更深入内部监督，从而确保人员遵守规则和政策，并减少合谋的可能性。合谋是指两个或多个人为了欺诈目的而从事秘密活动的行为。\n\
  \n### 数据和信息资产\n\n另一个需要考虑的资产资产是公司拥有的数据和信息。数据的价值不可言喻。组织丢失数据可能会导致灾难性的结果。\n\n数据通过两种方式得到保护：\n\
  \n- **访问控制**——访问控制保护数据免受未经授权的泄露，并保护数据的机密性。\n- **备份**——备份在数据损坏或被意外删除时保护数据。至少应该存在两份备份。一份备份保在本地，另一份保在不同的地理位置。第二份备份可以防止火灾或洪水等灾害。将数据的唯一备份保存在服务器上，意味着如果服务器房在火灾中烧毁，将没有任何备份。\n\
  \n关于因数据丢失而失败的公司故事层不穷。例如，一家公司一直在增长，其数据存储在单台计算机上，包括账单数据（如应付账款和应收账数据）、客户数据以及公司所有的关键数据。某一天，计算机的硬盘崩溃了。所有数据无法访问，且没有备份。由于客户和账单数据的丢失，公司很快倒闭。另一个例子是公司未能实施双重身份验证。不幸的是，发生了数据泄露，数百万客户记录被盗取，这损害了客户的身份和组织的声誉，并导致了财务损失。\n\
  \n### 数据分类\n\n大多数组织都会花时间对其数据进行分类。不同的分类需要不同级别的保护。\n\n政府使用分类标准，如机密（Confidential）、秘密（Secret）和绝密（Top\
  \ Secret）。每种分类都有正式定义。例如，绝密数据包括一旦未经授权泄露将对国家安全构成最严重威胁的信息。不同级别分类的数据接受不同级别的保护。例如，绝密数据将获得最高级别的保护。\n\
  \n`图 7-2` 显示了组织如何对其数据进行分类。在图中，使用了三种分类：公开（Public）、私有（Private）和专有（Proprietary）。\n\n\
  ![图 7-2 数据分类。](img/9781284183719_CH07_FIGF02.png)\n\n**图 7-2** 数据分类。\n\n组织可以以任何合适的方式定义数据。公开数据（Public\
  \ data）可以定义为任何从公共来源（如网站）访问的数据。私有数据（Private data）可以是客户或员工数据，专有数据（Proprietary data）可以是财务数据或从研发产生的数据。\n\
  \n组织可以使用任何所需的分类标签。标签本身没有使用某种数据分类方法重要。换句话说，分类可以是“未分类（Unclassified）”、“敏感（Sensitive）”和“特权（Privileged）”，而不是“公开（Public）、私有（Private）、专有（Proprietary）”。此外，组织可以根据需要使用尽可能多的数据分类来保护其数据。然而，组织必须考虑员工在创建新数据时能多容易、快速地对其进行分类。\n\
  \n这些故事听起来可能像虚构的，但事实如此。它们在全国的小企业中反复发生。许多组织在数据丢失之前并没有意识到其数据的价值。然而，一旦数据丢失，就太晚无法恢复了。\n\
  \n在确定有价值的数据之后，需要采取措施保护它，包括定期备份数据并保护其免受未经授权的泄露。\n\n数据和信息资产包括以下类别：\n\n- 组织\n- 客户\n\
  - 知识产权\n- 数据仓库\n- 数据挖掘\n\n## 组织\n\n组织数据包括任何内部使用的数据，大部分数据应应保持私密。然而，如果一家公司是上市公司，某些财务数据可能会发布，其中包括：\n\
  \n- **员工数据**——包括有关员工的任何信息。大多数公司都有内部的人力资源（HR）部门来维护员工记录，其中包括个人数据、员工评估、医疗保健选择等。\n-\
  \ **账单和财务数据**——包括应付账款和应收账款数据以及任何与公司财务状况相关的数据，可能包括贷款数据和损益表。\n- **系统配置数据**——每个系统的配置通常记录在数据库中，包括基础系统配置和任何更改。\n\
  - **系统过程数据**——包括显示系统如何运行的文档、识别服务器如何连接的网络拓扑图以及数据流图。例如，图表可以显示电子邮件的流。\n- **供应商数据**——包括有关向公司提供产品或服务的任何信息。\n\
  \n许多法律强制保护不同类型的数据。《健康保险流通与责任法案》（`HIPAA`）强制保护与健康相关的数据。大多数员工文件都包含 HIPAA 数据，即使该组织未涉及医疗保健。《萨班斯-奥克斯莱法案》（`SOX`）涉及上市公司的财务数据准确性。组织必须保护某些财务数据以符合\
  \ SOX 标准。\n\n## 客户\n\n客户数据包括公司持有的客户数据。公司收集和使用客户数据的方式决定了数据是极少数的还是一个完整的数据库。例如，一家公司可能想通过电子邮件向客户发送月度通讯报，这只需要电子邮件地址。如果需要，还可以收集客户姓名以个性化邮件。\n\
  \n另一方面，一家公司可能通过网站进行大量销售，这需要收集尽可能的信息。当客户访问公司网站时，了解他们过去买了什么将允许公司根据这些购买记录自动投放广告或推荐。当客户准备好购买时，不需要重新输入信用卡数据，因为数据已经存储了。\n\
  \n客户数据可能包括：\n\n- 姓名\n- 地址\n- 电话\n- 电子邮件地址\n- 历史购买记录\n- 应收账款数据\n- 信用卡或银行数据\n- 账户名称和密码\n\
  - 人口统计数据，如年龄和性别\n\n存储的数据越多，该数据的价值就越高。例如，入侵一个只存储电子邮件地址的系统并查看这些数据并不关键。然而，如果数据中包含个人身份信息（PII），许多法律强制对其进行保护。此外，如果收集了信用卡数据且攻击者获得了访问权限，公司可能对财务损失承担责任。\n\
  \n## 知识产权\n\n知识产权数据是由个人或组织创建的数据，包括发明、文学艺术作品、符号、名称和图像。世界知识产权组织（`WIPO`）将知识产权分为两类：\n\
  \n- **工业产权**——包括工业设计、商标、发明和专利\n\n\n\n\n\n*   `Copyright`——包括文学和艺术作品（如书籍、电影和音乐）以及艺术作品（如绘画和图画）\n\
  \n根据公司的职能，组织可以拥有一类或两类知识产权。例如，一家录音公司可能侧重于版权知识产权。然而，一家医疗研究公司可能只关注工业产权。\n\n国家法律和国际法律都保护知识产权。然而，小偷仍然会窃取它。如果数据没有得到保护，投入创建这些财产的资金可能会化水。例如，一家电视公司可能花费数几年数百万美元开发一种能够提供色彩鲜艳的\
  \ 3D 视图的新型屏幕。在公司准备上市前约六个月，竞争对手获取了所有研究数据，并创建了类似的产品。由于竞争对手不需要收回研发成本，其实际售价的价格可以比创建它的电视公司更便宜。\n\
  \n任何拥有知识产权的组织都需要保护它。保护程度取决于其价值。\n\n## 数据仓库与数据挖掘\n\n数据仓库和数据挖掘技术相结合起来，可以从非常大的数据库中检索有意义的数据。虽然数据库可以存储海量数据，但这些数据并不是立手可用的。目标是将原始数据转换为有用的智能，这可以通过数据仓库和数据挖掘来实现：\n\
  \n*   **数据仓库**——从不同的数据库收集数据的过程。数据从源数据库中检索并放置在中央数据库中。源数据库之间的新关系在中央数据库中创建，这个中央数据库就是数据仓库。仓库中的数据不被修改。相反，数据是在源数据库中进行修改的。定期对数据仓库中的数据进行刷新，使数据仓库与源数据保持同步。刷新数据仓库可能非常消耗资源。\n\
  \n*   **数据挖掘**——一组用于从数据仓库中检索相关数据的技术。决策者能够从不同的角度查看数据，从而允许他们对未来事件做出预测。例如，经理可以预测公司在\
  \ 12 月将销售多少件特定产品。\n\n大多数数据库被优化为在线事务处理处理（OLTP）数据库，这意味着它们可以快速记录交易。`transaction`是指任何类型的数据添加、删除或修改。例如，OLTP\
  \ 数据库非常擅长记录销售情况。然而，OLTP 数据库对于数据分析来说并不有效。相反，OLTP 数据库在数据仓库中进行重组，并可以与一个或多个其他 OLTP 数据库相结合。一旦数据库经过重组，数据挖掘就可以检索相关数据。\n\
  \n数据挖掘是整个业务智能（BI）解决方案的一部分。BI 解决方案试图在决策者需要时提供可操作的智能信息。BI 解决方案也被称为决策支持系统。其理念是数据库存储了决策者可能提出的任何问题的答案。通过创建数据仓库和使用数据挖掘技术，答案可以很方便地获得。\n\
  \n例如，这里是经理可能提出的某些问题：\n\n*   该组织今年卖了多少个小部件？\n*   小部件销售的峰值是哪个月？\n*   本季度表现最好的销售员是谁？\n\
  *   本季度表现最差的销售员是谁？\n*   本季度每个地区的销售额是多少？这些数字与去年同期的销售额相比如何？\n\n如果一个组织使用数据仓库，则需要建立相关方法来保护源数据库和数据仓库。最重要的元素是拥有有效的备份策略。此外，提取、转换和加载（ETL）过程通常需要大量时间开发。开发人员使用脚本或工具创建\
  \ ETL 过程以识别步骤。ETL 过程应该包含在备份策略中。\n\n## 提取、转换和加载\n\n使用提取、转换和加载（ETL）技术将数据从数据库移动到数据仓库。ETL\
  \ 过程是 BI 解决方案的重要元素。数据库开发人员识别要检索的数据、如何针对目标数据库对其进行修改以及如何加载它。这三个步骤是：\n\n*   **提取**——从现有数据库中检索数据的过程。并不是所有数据都会被提取。相反，只检索与决策者相关的数据。例如，可以提取某些客户销售数据进行分析。然而，其他客户数据（如信用卡数据）可能不需要，因此不进行提取。\n\
  *   **转换**——将数据转换为数据仓库所需的通用格式的过程。例如，一个数据库可能将男性性别识别为“M”，而另一个数据库使用“Male”。“M”或“Male”都不是错误的。但是，该标记在目标数据库中需要保持一致性。转换过程将更改数据，使其在数据仓库中保持一致性。\n\
  *   **加载**——将数据加载到数据仓库的过程。数据在转换为标准格式后被加载。根据数据仓库的配置，可以在不同的位置加载相同的数据。虽然这对于 OLTP 数据库来说是不够高效的，但对于数据挖掘来说是高效的。\n\
  \nETL 过程使用脚本或其他技术实现自动化。如有必要，可以对新数据定期执行，这使得数据仓库能够与实际源数据保持更新。\n\n大数据是许多数据库专家在讨论非常大的数据库时使用的新术语。它指的是任何规模巨大且复杂，以至于用现有数据库工具处理的数据集。相反，专家们构建新的应用程序来满足这些数据集的需求。\n\
  \n## 典型 IT 架构七域内的资产与库存管理\n\n从典型 IT 架构七域的角度来看 IT 管理问题是有用的。这些 IT 管理问题包括资产管理和库存管理。\n\
  \n典型 IT 架构的七域包括：\n\n*   用户域\n*   工作站域\n*   局域域\n*   局域到广域域\n*   广域域\n*   远程访问域\n\
  *   系统/应用域\n\n** 7-3**显示了典型 IT 架构的七域。\n\n![FIGURE 7-3 典型 IT 架构的七域。](img/9781284183719_CH07_FIGF03.png)\n\
  \n**图 7-3** 典型 IT 架构的七域。\n\n库存管理和资产管理之间存在差异。两者的基本定义如下：\n\n*   **库存管理**——用于管理硬件库存，仅包含基本数据，如型号和序列号。它显示了现有资产、所在地以及谁拥有它们。库存管理对于确保资产不易被丢失或被盗用非常有价值。\n\
  *   **资产管理**——用于管理所有类型的资产。它包含比库存管理系统详尽的数据。例如，资产管理将涵盖已安装的组件、硬件外设、已安装软件、更新版本等。\n\n\
  \n\n\n组织可能决定对不同区域使用其中一种或两种类型的管理模式。例如，组织可能对台式 PC 使用库存管理，以确保这些 PC 得到追踪且投资不会损失。然而，同一组织也可以使用自动化资产管理技术。资产管理可确保系统得到正确的补丁。\n\
  \n对于七个领域中的每一个，公司管理层需要根据公司拥有的资产确定两个基本问题的答案：\n\n* 这些资产对组织是否有价值？\n* 它们是否已包含在任何类型的库存管理或资产管理系统中？\n\
  \n如果资产具有价值，则它们应该包含在库存系统或资产管理系统中。\n\n## 用户领域 (User Domain)\n用户领域包括人员或员工。人力资源部门维护员工记录。这些记录可以是手动记录（例如存放在文件柜中的文件夹），也可以存储在服务器上的文件。\n\
  \n关于用户的数据包括：\n\n* 个人和联系数据\n* 员工评估\n* 薪资和奖金数据\n* 医疗选择\n\n用户领域资产管理的一个重要关注点是机密性。数据必须防止未经授权的泄露。至少，数据包含了必须受法律保护的\
  \ `PII`。如果包含任何医疗数据，`HIPAA` 强制要求对其保护。如果薪资和奖金数据泄露，通常会导致士气问题。\n\n## 工作站领域 (Workstation\
  \ Domain)\n工作站领域包括员工使用的 PC，其中可能包括典型的台式 PC 以及移动计算机或笔记本电脑。工作站领域的资产面临需要解决的两种风险：\n\n\
  * `Theft`——组织对这些系统有巨额投资，无法承受它们的丢失。库存管理系统包含相关流程，即定期对每项设备进行手动定位，以验证系统仍处于组织的控制之下。\n\
  * `Updates`——随着更新、修复和补丁的发布，需要将它们应用于系统。如果系统不进行更新，它们就会受到新漏洞的威胁。应该使用自动化资产管理系统来保持系统更新。自动化系统通常执行三个步骤：(1)\
  \ 检查系统当前的更新，(2) 应用更新，(3) 验证更新。\n\n## 局域网领域 (LAN Domain)\nLAN 领域包括用于连接系统和服务器的所有元素。局域网\
  \ (`LAN`) 是组织内部的。主要的硬件组件是集线器、交换机和路由器。\n\n拥有这些设备的基本清单是重要的，包括型号数字、序列号和位置。虽然任何网络设备都包含固件，但功能更强大的网络设备（如\
  \ `routers` 和 `switches`）内置了 `OS`。`OS` 的版本决定了其功能，因此在清单包含版本通常很有用。\n\n资产管理系统中还应包含这些设备的配置数据。例如，可以运行脚本来配置\
  \ `routers` 和 `switches`。这些脚本配置设备以通过或阻塞特定流量。如果设备丢失配置，则再次运行脚本，当然，这前提是脚本可用。如果脚本不可用，则需要逐行输入配置数据。如果没有之前的配置数据记录，则必须对设备进行故障排除，直到恢复到原始配置。\n\
  \n### NOTE\n在当今大多数组织中，交换机已取代了集线器。交换机效率更高，因为它将流量减少到仅必要的程度。此外，交换机通过将网络流量引导到目标系统而不是广播给所有连接的系统，提供了额外的安全层。当使用交换机代替集线器时，使用协议分析器的攻击者只能捕捉到有限的数据。\n\
  \n## 局域网到广域网领域 (LAN-to-WAN Domain)\nLAN-to-WAN 领域是内部 `LAN` 连接到广域网 (`WAN`) 的区域。在这种背景下，`WAN`\
  \ 通常是互联网。这里需要关注的主要设备是防火墙。单个防火墙或通过多个防火墙创建非军事化区 (`DMZ`) 或缓冲区，可以将 `LAN` 与 `WAN` 分隔。\n\
  \nLAN-to-WAN 领域中的防火墙是硬件防火墙。它们可以被编程允许和阻止特定流量。以下信息应包含在资产管理系统中：\n\n* `Hardware information`——包括基础信息，如型号和序列号。如果型号支持不同的附加组件（例如额外的内存或网络接口卡），也应包含在内。\n\
  * `Configuration data`——创建防火墙策略需要花费大量时间，之后应创建防火墙规则以及实施该策略的例外情况。至少，所有这些规则和例外情况都需要记录在案。尽可能情况下，为了实现过程自动化，应该创建脚本并进行备份。\n\
  \n## 广域网领域 (WAN Domain)\nWAN 领域包括直接访问互联网的服务器。这些服务器包括所有具有公共互联网协议 (`IP`) 地址且在 `DMZ`\
  \ 中面向公众的服务器。\n\n### NOTE\n内部计算机可以访问互联网，但不是直接访问。大多数组织通过代理服务器引导客户端流量，以提供客户端间接访问互联网。代理服务器具有具有公共\
  \ `IP` 地址的 `WAN` 连接，以及具有私有 `IP` 地址的内部客户端的连接。\n\n大多数组织在 WAN 领域不会有很多服务器。然而，`WAN` 中的任何服务器都面临更高的风险。采取额外措施确保这些服务器尽可能地加固是非常重要的。\n\
  \n基于 `WAN` 的服务器的清单和资产管理信息包括：\n\n* `Hardware information`——包括基础信息，如型号和序列号。\n* `Update\
  \ information`——`WAN` 中的服务器需要保持更新，这是确保服务器安全的步骤。随着补丁、修复和更新的发布，需要对其进行评估。如果需要更新且测试显示没有负面影响，则应应用。服务器的更新可以是手动或自动的。无论何种方式，拥有已安装更新的准确记录都是重要的。\n\
  \n### NOTE\n加固服务器使其从默认安装变得更安全。要要的工作是移除不需要的服务和协议并启用本地防火墙。此外，应通过定期应用更新来保持服务器更新。\n\n\
  ## 远程访问领域 (Remote Access Domain)\n远程访问技术允许通过外部位置访问内部网络。此过程可以通过直接拨号或虚拟专用网络 (`VPN`)\
  \ 完成。\n\n使用直接拨号时，客户端和服务器拥有调制调器并连接电话线路。使用 `VPN` 时，`VPN` 服务器在互联网上具有公共的 `IP` 地址。客户端访问互联网。\n\
  \n远程访问领域服务器所需的清单和资产管理信息与 WAN 领域类似。然而，对于拨号远程访问服务器，还需要包含拨号设备，包括调制调器和电话分机交换 (`PBX`)\
  \ 设备：\n\n* `Modems`——远程访问服务器的调制调器比客户端简单的调制调器更复杂。它们通常配置成多个调制调器组，并可以被编程响应多条线路的电话。\n\
  * `PBX equipment`——电话系统使用 `PBX` 管理。PBX 通常以带有完整操作系统的微型服务器形式出现。\n\n\n\n\n## 系统/应用领域\n\
  \n系统/应用领域包括用于托管服务器应用程序的服务器。应用服务器的类型示例包括：\n\n* `Email server`——可以是单一电子邮件服务器，也可以是大型的电子邮件解决方案，包括前端和后端服务器配置。\n\
  * `Database server`——可以是 Oracle 或 Microsoft SQL 服务器，以单服务器的形式存在，也可以作为服务器组的一部分。\n\
  * `Web server`——Web 服务器托管网站并为网络客户端提供服务。单个 Web 服务器可以托管一个网站或数百个网站。\n* `Networking\
  \ service server`——包括域名系统 (DNS) 器和动态主机配置协议 (DHCP) 器。\n\n库存和资产管理系统应对系统/应用领域中的任何服务器至少包含以下信息：\n\
  \n* `Hardware information`——包括基础信息，如型号和序列号（就像对工作站进行盘点一样），以及硬件组件的清单。\n* `Update information`——服务器需要保持最新状态，如果任何服务器是面向网络的（例如\
  \ Web 服务器和某些电子邮件服务器），则尤其如此。\n\n### ![](img/Note.png)备注\n\nVPN 通过公共网络（如互联网）访问私有网络。\n\
  \n## 识别维护业务运营所需的设施和物资\n\n事故和灾难会发生，其中某些灾难的严重性会导致业务停止运行。确保业务在灾难后仍能继续运行需要规划。\n\n在规划过程中可以采取几个步骤。这些包括：\n\
  \n* 任务关键系统和应用程序识别\n* 业务影响分析规划\n* 业务连续性规划\n* 灾难恢复规划\n* 业务责任保险规划\n* 资产更换保险规划\n\n###\
  \ 任务关键系统和应用程序识别\n\n任何规划的首要步骤是识别哪些系统和应用程序是任务关键的。任务关键系统是指任何为了确保业务持续运行而必须持续的系统。同样，任务关键应用程序也必须持续运行以确保业务持续运行。\n\
  \n在首先了解一个组织如何运作之前，确定什么是任务关键的是不可能的。例如，公司内的销售人员直接向客户销售产品，客户通过电话或面对面提交订单。然后，销售人员将订单输入连接到后端数据库的应用程序中。在这个示例中，任务关键元素是销售人员、电话、应用程序和后端数据库。\n\
  \n另一方面，一家公司销售与之前示例相同的产品。然而，客户能够直接通过网站下订单。此外，他们可以通过电子邮件向销售人员发送订单，然后由销售人员将订单输入应用程序中。该应用程序与网站使用的同一数据库连接。客户也可以电话下单，但比例不到\
  \ 10%。在这个示例中，该组织拥有的任务关键系统比第一个示例多。销售人员、电话、应用程序和后端数据库仍然是任务关键，但网站应用程序和电子邮件也是任务关键的。\n\
  \n这里需要记忆点是，系统的重要性取决于它的使用方式。一个组织可能认为特定系统是任务关键的，而另一个组织可能认为同一个系统是可以丢弃的。\n\n### 业务影响分析规划\n\
  \n[业务影响分析 (BIA)#29_glossary.xhtml#gloss24)] 识别业务功能突然丢失的影响。影响通常用成本量化。计算影响会使用直接和间接成本。直接成本是销售的即时损失或与恢复损失相关的费用。间接成本与客户信任的丢失有关。\n\
  \nBIA 提供对特定 IT 服务丢失的影响分析。例如，可以使用 BIA 来确定丢失电子邮件或特定数据库的影响。BIA 还有帮助组织确定公司继续运营所需的最小服务集。\n\
  \n例如，远程用户可能使用 `VPN` 技术从远程位置连接到私有网络。如果 `VPN` 服务停止，对业务的影响是什么？可以通过完成 BIA 来做出该判断。\n\n\
  远程用户可能还有其他方法连接到公司。例如，远程用户可能仍然可以使用网页访问电子邮件，远程销售人员可能仍然可以使用电话下订单。BIA 可能会确定，尽管 `VPN`\
  \ 服务很有价值，但它们的丢失对公司整体任务的影响微乎其微。\n\n另一方面，针对电子邮件服务的 BIA 可能会确定，电子邮件的丢失会对公司产生重大影响。电子邮件可能被用于客户接触、项目任务分配、跟踪和其他其他重要通信。\n\
  \n在完成 BIA 时，将采取以下步骤：\n\n* `定义范围`——BIA 的范围局限于特定的 IT 系统。例如，BIA 可以检查丢失电子邮件或网站的影响。如果范围局限于丢失电子邮件，则不应包括额外\
  \ IT 服务的丢失。通过在项目早期定义范围，可以减少范围蔓延（scope creep）的可能性。针对特定地点的服务完全丢失进行 BIA 是可能的。例如，一家公司可能有多个地点，其中一个可能位于地震或飓风地带。BIA\
  \ 可以确定如果灾难导致该地点的服务完全丢失的影响。\n* `识别目标`——BIA 目标与 BIA 的范围有关。目标具体识别了 BIA 应该实现什么。例如，一个\
  \ BIA 任务可能包含以下目标：\n    * 确定电子邮件服务丢失一个工作日的直接影响\n    * 确定电子邮件服务丢失一个工作日的间接影响\n    *\
  \ 计算电子邮件服务丢失三个工作日的影响\n    * 计算电子邮件服务丢失五个工作日的影响\n* `识别任务关键业务功能和过程`——并非所有的业务功能和过程都是任务关键的。某些功能虽然方便并有助于提高效率，但没有它们任务仍然可以生存。BIA\
  \ 区分了关键和非关键功能。\n* `将业务功能和过程映射到 IT 系统`——这一步骤可以简单也可以复杂。例如，如果 BIA 分析由一个电子邮件服务器提供的电子邮件服务，IT\
  \ 系统就是该电子邮件服务器。另一方面，如果组织使用 `Microsoft SharePoint` 来增强员工之间的协作，分析可能是复杂的。`SharePoint`\
  \ 解决方案可能包括 Web 服务器、文件服务器和数据库服务器。有关 IT 系统的文档有助于完成这一步骤。\n\n### ![](img/Note.png)备注\n\
  \nBIA 是业务连续性计划的重要部分，也可以是灾难恢复计划 (DRP) 的一部分。\n\nBIA 的结果是 BIA 报告，记录了分析的发现。它通常包括直接和间接成本、最大可停机时间以及恢复所需的材料或资源。\n\
  \n\n\n\n\n`业务连续性计划 (BCP)` 是一种用于帮助公司制定灾难或紧急情况计划的文档。其目标是确保组织的关键业务持续运行。`BCP` 包含了在发生灾难时恢复业务运行所需的程序和指令。\n\
  \n在完成 `BCP` 时，将采取以下步骤：\n\n1. 确定范围\n2. 识别关键业务领域\n3. 识别关键功能\n4. 识别关键业务领域与关键功能之间的依赖关系\n\
  5. 确定可接受的停机时间\n6. 创建维持业务的计划\n\n`BIA` 报告中的细节有助于创建 `BCP`。`BIA` 和 `BCP` 通常结合结合完成的。\n\
  \n`BCP` 包含了针对不同阶段可以采取的具体步骤。各阶段的内容取决于灾害类型。例如，对于飓风会有充足的预警。其中一个阶段可能是到达前 72 小时，另一个阶段可能是前\
  \ 36 小时。然而，地震或火灾则不包含这些相同的阶段。\n\n`BCP` 阶段包括：\n\n* **通知/激活阶段**——激活评估小组以应对紧急情况。在某些情况下（如飓风），可以在紧急情况发生之前激活这些小组。对于更直接的紧急情况（如火灾），在紧急情况发生时进行通知。该阶段的目标是采取措施继续业务。\n\
  * **恢复阶段**——在此阶段，对损坏进行评估。如果发生任何损失，可以采取立即措施恢复系统。该阶段的重点是任务关键系统。\n* **重组阶段**——在此阶段，组织恢复到正常运行。如果任何任务关键系统通过恢复操作保持了运行，则可以将其恢复正常状态。例如，在恢复阶段移动到备用服务器的操作可以返回到原始服务器。非任务关键系统可以在此阶段恢复运行。\n\
  \n## 灾难恢复计划\n\n`灾难恢复计划 (DRP)` 包含了从灾难中恢复系统所需的细节，并提供了立即响应灾难所需的细节。`DRP` 作为 `BCP` 的一部分包含。\n\
  \n有时，`BCP` 和 `DRP` 术语被互换使用。然而，它们是独立的。它们之间的差异值得注意：\n\n* **BCP**——`BCP` 是用于应急响应的整体计划。它识别组织的关键系统，包括可接受的停机时间。`BCP`\
  \ 包含了各个 IT 系统的 `BIAs` 和 `DRPs`。\n* **DRP**——`DRP` 是 `BCP` 的关键组成部分。它包含了灾难后恢复一个或多个系统所需的细节。例如，火灾可能会销毁服务器机房内的几台服务器。`DRP`\
  \ 识别了恢复服务器所需的步骤，包括从备份中恢复数据。\n\n### BCP 与 DRP\n\n某些文档表明 `BCP` 和 `DRP` 是同一物，但它们并不是。尽管它们经常一起使用，但\
  \ `BCP` 和 `DRP` 确实提供不同的价值。\n\n在学习国际信息系统安全认证联盟 `[(ISC)²]` 认证信息系统安全专业人员 (CISSP) 和系统安全认证从业人员\
  \ (SSCP) 时，`BCP` 和 `DRP` 是不同的。\n\n## 责任保险\n\n主要的风险管理技术包括回避、共享或转移、减轻和接受。可以通过外包和购买保险来共享或转移风险。责任保险用于保护组织免受诉讼。\n\
  \n存在三种主要的责任保险：\n\n* **通用责任**——大多数组织会购买通用保险。它提供针对伤害索赔和财产损失的保护，提供了涵盖大多数诉讼的保险伞。\n*\
  \ **专业责任**——如果员工提供错误或不准确的建议，这种保险保护公司。它包括对执业、错误和疏忽的保护。为其他公司提供 IT 服务的公司可能需要这种。\n*\
  \ **产品责任**——如果客户因使用产品而受伤，这种保险将保护公司。例如，移动电脑中的电池可能会引发风险。如果故障电池导致火灾，这种保险将提供保护。\n\n\
  ## 恢复\n\n另一种可以购买的保险是资产险，旨在替换受灾损坏的资产。这种保险通常与防止灾难的其他步骤结合购买。\n\n例如，组织可能希望保护自己受火灾损坏。它可以安装灭火设备并在建筑各处放置移动灭火器。然而，尽管尽了努力，火灾仍可能发生。\n\
  \n如果火灾导致损坏，火险可以帮助公司更换资产。其他提供资产保护的保险类型包括：\n\n* 水险\n* 飓风、风、龙卷风或其他天气险\n* 某些人员的人险（例如关键官员）\n\
  \n购买的保险取决于许多因素，包括组织资产的价值。对于廉价资产，保险的成本是不合理的。几年的保险成本可能超过更换产品的费用。购买的保险还取决于相关风险。\n\n\
  ## 章节总结\n\n本章提供了关于识别资产的信息。资产识别是任何风险识别过程中重要的第一步。组织的资产包括其硬件和软件、数据和信息资产以及人员。典型 IT 基础设施的七个领域可以确保所有资产都被识别。\n\
  \n\n\n\n一旦识别了资产，就可以使用各种工具对其保护。业务影响分析（BIA）有助于识别服务故障对业务的影响，从而有助于确定最重要资产的优先级。灾难恢复计划（DRP）记录了恢复故障系统所需的所需的步骤。业务连续性计划（BCP）范围更广，用于确保即使在灾难发生后，关键系统也能继续运行。\n\
  \n## 核心概念与术语\n\n* 资产管理\n* 大数据\n* 业务连续性计划 (BCP)\n* 业务影响分析 (BIA)\n* 数据挖掘\n* 数据仓库储\n\
  * 灾难恢复计划 (DRP)\n* 故障转移集群\n* 通用数据保护条例 (GDPR)\n* 库存管理\n* 服务程序包 (SP)\n\n## 第 7 章评估\n\
