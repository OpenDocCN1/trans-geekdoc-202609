    [25]。模型参数是学习来的，并取决于特征和超参数。由于用于训练的特征，单个模型是不可扩展的，且多个模型以非明显的方式相互影响。随着数据变化、方法改进或软件更改，模型如何演变
    [30]。持续部署、定制和重训练是持续的。机器学习系统需要端端软件来促进影响数据溯源、模型训练和推理的所有组件的开发、测试、配置、部署、管理和维护 [31]。


    ## III. 机器学习系统的挑战


