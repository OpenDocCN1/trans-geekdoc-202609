    训练后的模型对新输入值持续执行决策或动作。模型是一种可靠的资产，在退役之前将进行成千上万甚至数百万次预测。重训练推理发生在应用程序后台。推理通常直接服务用户，因此需要可靠性、准确性和高效性。尽管单次预测的资源需求与模型训练相比可能不高，但推理发生的规模要求具有高吞吐量、低延迟和保障性能的高效优化的流程
    [26]。传统上，人们更多地关注优化而非推理。诸如 TensorFlow 和 MXNet 等近期流行的机器学习平台提供了模型优化方法，但仅靠这些是不够的。当机器学习系统代表我们做出决策和行动时，它们必须是可靠的。不同的机器学习系统提供不同的质量和准确性。需要能够保证输出和可靠性估计的方法来为推理提供质量保证
    [28]。此外，可解释推理与对模型工作原理的理解限制有关，对于信任、公平和基于伦理的决策预测是必要的 [29]。


