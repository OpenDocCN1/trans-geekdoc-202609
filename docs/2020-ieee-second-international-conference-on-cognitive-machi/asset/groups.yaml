    # 物联网中的机器学习：

    边缘智能的可信性与权衡


    Wiebe Toussaint

    工程系统与服务

    代尔夫特理工大学

    荷兰，代尔夫特

    w.toussaint@tudel.nl


    Aaron Yi Di

    工程系统与服务

    代尔夫特理工大学

    荷兰，代尔夫特

    aaron.di@tudel.nl


    **摘要—**机器学习系统（MLSys）在物联网（IoT）中兴 way，以提供边缘智能，推动我们迈向无处不在的智能愿景。然而，异构系统的复杂性和物联网的意味着，当机器学习系统在实际场景中运行时，我们面临着诸多挑战。许多学习系统已为大规模部署（例如智慧城市）而开发。为了阐明物联网的复杂性，我们通过涵盖感知与分布、云、边缘及物联网设备领域的最新进展（截至
    2020 年），提出了相关的权衡方案。我们将多层系统和边缘智能定位为一种社会技术性挑战。针对设计边缘智能的挑战，我们提倡一种整体设计方法，以平衡机器学习的需求与权衡，并识别边缘智能的未来研究机会。


    物联网（IoT）[4] 已经从数字连接设备的愿景成熟为智能服务 [5] 和无处不在的智能。例如，一个向服务器流传输视频的监控摄像头已不再足够。相反，摄像头被寄予提供智能服务，例如统计人数或检测入侵者，从而成为一个边缘支持的设备。智能物联网的独特之处在于具有数据处理能力
    [6]，这意味着传感器数据可以被转换为信息和知识。这种抽象允许人类推断出关于系统的见解，这些见解可以用于创造超越想象之外的服务 [7]。


    **索引术**—边缘智能、机器学习、物联网、权衡、可信性、智能系统


    从历史角度看，需要人类认知来从数据中抽象出信息和知识。然而，随着机器学习算法的成功，新型技术驱动的系统可以通过人机交互提供智能服务。在物联网中广泛预测和管理运行的机器学习系统
    [8]，可以从两个角度来看：用于物联网的机器学习系统支持系统的管理和组织。这些系统的设计旨在服务于物联网，通过安全、网络剖析和物联网设备识别等系统方面来改进人机交互
    [10]。


    ## 1 引言


    机器学习系统是无处不在且沉默的助手，它们为现代生活带来了秩序：引导我们进行交通分类并检测植物中的害虫，并在我们无法看到和听到的环境中充当我们的耳朵和眼睛。在这里，我们理解为什么机器学习算法通过固定数据来寻找模式和相关性，这些模式可以被利用以发现趋势和关系，并用于机器处理
    [11]。许多学习算法可以在小数据集上工作，也可以处理更多数据。这使得它们在分析由数字在线服务和应用程序产生的海量数据方面极其成功。特别是深度神经网络为许多基于感知的任务产生了最先进的技术，现在被广泛用于计算机视觉、语音、音频等领域
    [12]。机器学习是一个过程，当系统或过程过于复杂或难以显式建模时，数据可以揭示其演变为何的见解 [13]。同样，如果应用是动态的且随时间变化的，机器学习系统可以使用新数据来更新模式和预测，从而适应应用。


    本文激发了针对多方利益者关心的问题的跨学科研究、设计需求，以及开发用于智能服务的可信边缘智能的努力。机器学习并不被认为是可靠的，因为假设在单一实体的控制和所有下，可靠、丰富、可扩展且几乎免费的网络和计算能力是存在的。在第
    2 节中，我们介绍了机器学习系统以及当前对数据、训练、推理和操作关注。第 3 节强调了物联网在机器学习系统方面面临的额外挑战。在 4 节中，我们从社会技术多利益者的角度考虑了边缘智能的权衡。第
    5 节提出了可信边缘智能的展望，考虑了源于机器学习系统和物联网的关注。我们强调了可信边缘智能的机会，并在第 6 节总结。


    当无法进行监督时，无监督学习不需要标签，可以考虑对模型训练的权衡。通常情况下，这些权衡影响预测性能。由于标签和数据标注的成本，机器学习系统可能会从仓库下载预训练模型，以适应新的领域
    [15]。此外，预训练模型带来了重大的安全风险；


    ## II. 机器学习系统概述


    机器学习算法通过利用转换输入变量的函数从数据中学习，以产生输出值。这通常被称为模型训练。一个训练好的模型用于计算预测值与其相应的真实值之间的误差，这被称为推理
    [1]。典型的机器学习工作流涉及数据收集、模型训练和推理步骤。数据处理有两个目的：首先，通过消除离群值、噪声和错误来收集数据；其次，通过转换数据。这一过程促进了机器学习的部署，并考虑了操作方面。本节强调了数据、训练和推理的关注问题。与其详尽，不如说为物联网提供服务的机器学习系统提出了重要的考量。


    经典的机器学习算法在静态、良性的假设在使用；它们假设数据不会改变，且环境是已知的 [17]，数据中包含了所有类别 [18]。这与现实不符。例如，在医学图像分类中，标签可能包含未见过的类别
    [19]。虽然机器学习可以提高模型对抗攻击的鲁棒性，且终身学习 [21] 通过承认和维护知识来改进未来的学习，尽管机器学习取得了成功，但仍然需要训练出具有良好泛化能力、同时也是资源高效且鲁棒的模型。


    ### A. 模型训练


    监督学习是一种迭代优化过程，旨在从数据中寻找通用参数。模型学习的目标是从有限数据寻找候选模型，使其在新数据上具有最佳性能。训练过程估计这些参数，以减少预测值与其真实值之间的误差。为了收集参数，模型还可以控制复杂性的超参数。为了找到最佳模型，应该探索不同参数和超参数的范围。这些选择中的每一个都需要计算能力、时间和能量，导致预测性能与资源消耗之间的权衡。最先进的机器学习模型（特别是神经网络）拥有数百万参数，所需的计算资源是巨大的。提高机器学习系统性能的方法是使用专用硬件设计它们，以及在云服务器上进行大规模并行模型训练
    [12]。


    除了训练期间消耗的资源外，监督机器学习还需要标注数据，收集既既昂又耗时 [13]。


    ### B. 数据溯缘


    机器学习模型的质量受使用数据质量和分布的影响 [22]。由于数据在机器学习中的核心作用，观测数据的特征（如缺失数据、数据噪声和离群值）会显著影响训练数据的性能。可以通过进一步传播在整个机器学习工作流中生成的数据溯缘来提高性能。为了开发软件方法，此类数据错误是导致机器学习的最终形态
    [23]。一旦部署，数据集就是管理的一部分，因此依赖关系随数据集而增长。随着训练数据的追踪变得日益复杂 [24]。数据依赖和反馈回路通常是隐藏的，并会产生意外影响，使机器学习系统变得脆弱且错误诊断昂贵
    [25]。机器学习系统还容易受到利用其数据依赖性的攻击，通过污染训练数据来实现


