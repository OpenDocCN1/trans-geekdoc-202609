    表 I

    IoT/CPS 的维度与关注点 [51]

    | 维度 | 关注点 |

    | --- | --- |

    | 功能 | 驱动、通信、可控性、功能性、可管理性、可监测性、性能、物理上下文、感知、状态、不确定性 |

    | 业务 | 企业、成本、环境、政策、质量、监管、上市时间 |

    | 人性 | 人性因素、信赖度、可靠性、安全性、安全、逻辑时间、同步、感知、时间间隔和延迟 |

    | 数据 | 数据语义、身份、数据处理、数据间关系、数据量 |

    | 边界 | 行为、责任、组合、适应性、复杂性、可发现性 |

    | 生命周期周期 | 可部署性、可设计性、可维护性、可操作性、可生产性 |


    # IV. 多利益相关者的权衡


    物联网（IoT）不仅是技术的复杂集合，而且多利益相关者环境下的社会技术系统 [51]，其中众多参与者连接了用户、数据生成者、网络提供商、数据处理器、参与者的利益，且设备的使用、管理和所有权是异构的并不断变化的。这种多利益相关者环境为设计智能设备的边缘智能带来了必须考虑的冲突需求和优先事项。


    # A. 物联网中的设计维度与利益相关者的关注点


    工程化系统旨在于不可预测的世界中，在接受的置信范围内提供可靠且稳健的性能。例如，在天气云云变时设计飞机；我们对您的决策是基于合理的信念，即飞机经过了精心设计，交通控制系统由受过训练的飞行员操作，并且交通控制系统受到国际监管的卓越系统保护。从许多服务和行业的角度来看，物联网作为一个更大的基础设施系统。其物理-数字化的本质意味着网络领域的参与者会对环境产生真实后果，并可能改变我们对世界的体验，例如当系统被停用时感到冷。这比纯物理系统或网络系统提出了得多的要求。


    物联网的规范被包含在标准中（例如 [51] 中的引用）。定义需求的一种有效方法是通过涉及一个或多个利益相关者的关注点来实现 [51]。表 I 列出了按类别分组的关注点，旨在为混合信息物理系统的设计提供一个全面的框架，例如相关的且具有可比性的关注点。例如，在考虑不确定性时，网络通信引起的延迟是不确定的。通常，关注点面临权衡，利益相关者可能会以不同的方式对它们进行优先排序。需求可以用于表达解决相关关注点的系统属性。


    # B. 对边缘智能设计的影响


    边缘智能将机器学习系统引入物联网的计算系统。与统计机器学习所发展的低风险潜力设定不同，机器学习系统如果失败，可能会产生现实世界的影响、潜在的危害甚至威胁及生命的后果。由于物联网的存在，对于边缘智能的机器学习系统来说，确认物联网的需求是至关重要的。并且与其他软件系统一样，在需求阶段选择目标系统行为变得具有挑战性。可穿戴设备中的机器学习已经也需要显式的分析过程，以预先指定系统需求
    [51]。这在其他领域并不是常态，而它的存在是为了开发用于应对冲突关注点和需求权衡的方法。我们需要单独和整体地考虑复杂的关注点，以及满足利益相关者优先事项需求的设计选择。


    **机会：** 需要框架和资源来引出挑战、处理冲突的关注点并优先考虑权衡，以便边缘智能做出明智的设计选择。


    由于其性质，物联网中机器学习系统的（隐式）设计侧重于特征工程、算法选择、参数优化、架构设计，目标是优化预测性能。从物联网的角度来看，这解决了功能维面的性能问题，但在其他关注点的短期衡量和优化方面失败了。设备机器学习（第
    III-C 节）解决了关于资源限制、潜在上下文、安全性、隐私、延迟、数据量和容量关注的问题，其中分布和异构性引入了


    > ¹¹物联网和信息物理系统（CPS）的定义随时间推于融合 [52]。我们从统一的视角来看这两个领域，并将其称为物联网。一致性和同步关注点。在服务范式中，质量起着重要作用，它是用户选择服务的衡量因素
    [7]。


    **机会：** 需要针对预测性能的指标和基准，以便边缘智能的机器学习系统能够被评估。问责和透明度等问题是机器学习固有的，某些算法如神经网络被认为是“黑箱”。


    **机会：** 为了与边缘智能相关，物联网的关注点需要扩展以包含以数据为中心的本质。


    # V. 可信边缘智能的展望


    信任技术研究从信任系统扩展到非人类实体。虽然信任和可信是不同的概念，但如果技术的感知水平很高，那么仁爱、诚信和能力等类人的信任构建是良好的信任衡量。可信对于一致性是必要的。


    # A. AI 中的可信


    创造他人社会存在感、促进社交行为（例如对话或接受情感）以及与他人进行交互的技术被认为是类人的。人工智能技术涵盖机器学习系统，因此在定义和设计上都是类人的。提高公众信任必须导致政府和组织快速开发开发框架。主流框架中出现的核心主题是隐私、问责、安全与保障、透明与解释性、公平与无视、技术控制、专业责任以及对价值观的促进
    [75]。这些信任构建与被认为是类人的 AI 技术产生共鸣。虽然框架奠定了理论工作，但要实现可信 AI 需要开发可量的可信。


    **机会：** 机器学习系统的可信关注点需要标准化和操作化，以便进行客观评估。


    # B. 物联网中的可信


    相比之下，物联网中的可信关注点跨行业收集、构建，并正式定义为安全、保障、隐私、可靠性和韧性 [51]。这些关注点确保系统在不同条件下表现适当。它们要求物联网被认为不那么像人，而像机器。其他属性如可控性、可管理性、功能性和不确定性被认为是功能关注点而非可信关注点。


    # C. 可信边缘智能的机会


    无论是 AI 还是物联网的可信关注点都没有解决边缘智能的全关注光谱。例如，边缘智能中的机器学习系统在开放世界假设下运行，可能会产生新的类别、未见的示例、黑天鹅事件和事件攻击模型。在这种情况下，解释性是一个必要的需求。或者安装在与训练数据相似的新环境中的智能设备可能会失效。这可能需要一个可信的模型。


    - 分析边缘智能和智能服务的机器学习系统中产生的可信关注点

    - 探索机器学习与物联网系统之间可信关注点的权衡


