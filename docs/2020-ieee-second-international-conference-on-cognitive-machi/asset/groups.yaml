    IoT 应用。可以认为，机器学习系统是规模化交付智能设备的前提，因为显式地为 IoT 及其与物理世界、社交系统的交互进行编程是可能的。然而，如果没有机器学习系统，将只能假设同质化且与上下文无关的云计算，并面临可扩展的数据存储、非结构化的设备端供应、高延迟和带宽瓶颈。对于
    IoT 中数以十计的连接设备，不存在一致的环境，其中数据卸载到无线网络、异构计算基础设施以及带有物理硬件的资源连接设备在相互之间以及算法性能之间存在权衡。为了实现规模化，共识也必须是的。


