    ## VI. CONCLUSIONS


    Ever-growing, densely populated urban centers need to maintain, care for, and
    nurture their social, natural systems. Smart services, informed by intelligence,
    are viewed as a way of doing this. Machine learning systems enable smart services
    by providing the IoT with edge intelligence. This paper presents challenges and
    trade-offs when designing trustworthy machine learning systems for the IoT, combining
    the two technologies presents new challenges and opportunities. One of.


    We position machine learning systems as a component of the IoT, and intelligence
    as a socio-technical system. We argue that multi-stake concerns, design requirements
    and trade-offs should be taken into consideration when developing edge intelligence,
    and highlight opportunities arise in this field. With an interdisciplinary approach
    is essential, as trust is considered differently in machine learning systems and
    the IoT. By combining perspectives, taking multi-stake considerations, design
    requirements and trade-offs into account, it is possible to perceive of a future
    where trustworthy intelligence and edge services are smart meets.


