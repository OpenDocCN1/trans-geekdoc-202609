    # C. Inference Concerns


    Trained models use values for new inputs to perform decisions or actions on an
    ongoing basis. A model is a reliable asset that will make thousands or millions
    of predictions before it is retired. Retrained inference happens in the background
    of an application. Inference usually serves users directly and consequently needs
    to be reliable, accurate and efficient. Even though the resource requirements
    for a single prediction might be in comparison to those of training a model, the
    scale at which inference happens requires efficient and optimized processes with
    high throughput, low latency and guaranteed performance [26]. Traditionally, more
    attention has been paid to optimizing rather than inference. Recent- popular machine
    learning platforms like TensorFlow and MXNet offer methods for model optimization,
    but alone is not enough. When machine learning systems make decisions and actions
    on our behalf, they must also be reliable. Different machine learning systems
    offer different quality and accuracy. Methods that guarantee output and reliability
    estimates are needed to provide inference with quality assurance [28]. Additionally,
    interpretable inference, which is linked to the limits of understanding of how
    a model works, is necessary for trust, fair and ethical decision-based predictions
    [29].


    computing devices must deliver dynamic and contextaware functionality over multi-layered,
    heterogeneous architectures [7]. For machine learning systems this is both an
    opportunity and a challenge. Learning from data, they are well suited to offer
    IoT applications that function at specific locations, environmental or social
