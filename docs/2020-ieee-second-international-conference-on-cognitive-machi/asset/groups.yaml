    ## B. 跨异构设备的分布


    位于网络边缘的 IoT 终端（例如服务器、传感器或手机）被称为边缘。边缘计算将云的计算能力带到端点 [31]，从而创建了一个用于模型训练和推理的地理分布式处理器网络。边缘在计算能力和连接性上各异，从在底层观察和控制环境的传感器和执行器设备到网关和云服务器。在边缘的数据处理、模型训练和推理可以以设备、网关或云为中心
    [32]。以设备为中心的方法减少了卸载，但受限于计算能力。以网关为中心的方法需要网络通信，以及相关的变性和不确定性。以云为中心的方法提供了无限的存储和数据处理能力，但需要大量的通信。边缘服务器为稳定性能提供了中间解决方案。


    ## C. 资源受限


    电池驱动的 IoT 设备具有有限的内存、电源供应资源，这些资源在数据和处理能力之间可用或共享 [35]。为了消除这些限制，设备端机器学习任务旨在本地进行推理和部分重训练。为了实现这一点，在这样的受限设置下，能量效率至关重要。为了减模型尺寸，使用了量化和剪枝进行模型压缩
    [42]。量化减少参数和梯的浮点精度，可以是基于规则的 [43]，也可以通过位运算和面向符号的权重进行自动处理 [45]。在极端情况下，二值神经网络被量化为
    1、2 或 3 位 [46]，并提供了卓越的效率，但以牺牲预测准确性为代价。将二进制神经网络映射到现场可编程门阵列（FPGA）上的查找表可以进一步降低能耗。这消除了神经网络中大量的参数。尽管剪枝很流行，但设备端剪枝的进展是理想的，特别是当层缺乏标准性能时
    [48]。设备端学习的需求日益增长是架构与神经架构搜索的协同设计。


