    ## A. 卸载到无线通信


    蓝牙和 WiFi 等无线通信网络将设备连接为本地网络，或将单个设备和本地网络连接到互联网网络 [39]。IoT 应用依赖无线通信来卸载设备收集的数据，在这些地方数据可以被清洗并与其他数据融合，从而为未来使用提供机器学习模型。卸载提供了计算能力和存储的访问，但也带来了隐私和性能问题。无线通信链路具有固定的容量和范围
    [32]，可能会产生噪声，特别是当无线网络拥塞时会影响 IoT 应用。此外，机器学习系统在推理期间必须考虑本地计算的一致性，使容错性成为必要的考虑因素 [28]。此外，无线连接为具有抽象层和通信要求的机器学习系统引入了延迟、不确定性和成本。因此，卸载在收益与实时推理需求、以及机器学习系统训练更新的频率、大小和分布之间进行权衡。虽然数据路径、训练和传输量可以通过路由方案、选择和压缩进行优化，以最小化瓶颈和通信成本
