    **Abstract—**machine learning (MLSys) are emerging in the IoT to provide edge
    intelligence, giving our way towards the vision of ubiquitous intelligence. However,
    the complexity of heterogeneous systems and the IoT means we are facing challenges
    when MLSys operate in practical context. Many learning systems have been developed
    for large-scale deployment (e.g., smart cities). To light on the complexity of
    IoT, we offer the trade-offs by covering the latest developments (up to 2020)
    on sensing and distribution cloud, edge, and IoT devices. We position multi-layer
    systems and edge intelligence as a socio-technical challenge. On the challenges
    of designing edge intelligence, we advocate a holistic design approach to balance
    machine learning requirements and trade-offs, and identifying the future research
    opportunities in edge intelligence.


    The Internet of Things (IoT) [4] has matured from a vision of digitally connected
    devices to one of smart services [5] and ubiquitous intelligence. For example,
    a security camera that streams video to a server is no longer sufficient. Instead,
    the camera is expected to provide a smart service, such as counting people, or
    detecting an intruder, thus becoming an edge-enabled device. The intelligent IoT
    distinguishes itself by having data processing capabilities [6], meaning that
    sensor data can be transformed to information and knowledge. This kind of abstraction
    allows humans to infer insights about the system, which can be used to create
    services beyond their imagination [7].


    **Index Terms**—edge intelligence, machine learning, IoT, trade-offs, trustworthiness,
    smart systems


    Historically, human cognition has been needed to abstract information and knowledge
    from data. However, with the success of machine learning algorithms, new types
    of technology-driven systems can deliver smart services through human interaction.
    Machine learning systems widely predict and manage operation in the IoT [8] can
    be viewed from two perspectives: machine learning systems for the IoT support
    system management and organization. These systems are designed in service of the
    IoT to improve human interaction through system aspects like security, network
    profiling and IoT device identification [10].


