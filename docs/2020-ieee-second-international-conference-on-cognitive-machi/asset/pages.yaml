    # IV. MULTI-STAKEHOLDER TRADE-OFFS


    The IoT is not only a complex collection of technologies, but a socio-technical
    system in a multi-stakeholder environment [51] with numerous actors connecting
    interests of users, data generators, network providers, data processors, players
    involved and device use, management and ownership are heterogeneous and can change.
    This multi-stakeholder environment gives rise to conflicting requirements and
    priorities that must be considered when designing edge intelligence for smart
    devices.


    # A. Design Aspects and Stakeholders Concerns in the IoT


    Engineered systems are designed to deliver, reliable and robust performance within
    acceptable bounds of confidence, in an unpredictable world. For example, designing
    a plane when the weather is brewing; we have confidence that your decision based
    on a justified belief that the plane was carefully designed, and that the traffic
    control system is operated by a trained pilot and that the traffic control internationally
    regulated systems of excellence. In vision of many services and industries, the
    IoT serves as a larger infrastructure system. Its physical-digital nature means
    that actors in the cyber realm carry real consequences in the environment and
    can change our experience of the world, like getting cold when a system is deactivated.
    This imposes much more requirements than would be the case for purely physical
    or cyber systems.


    Specifications for the IoT are caught in standards (e.g. references in [51]).
    A useful approach for defining requirements is through concerns that are of one
    or more stakeholders [51]. Table I lists concerns, grouped by category, has been
