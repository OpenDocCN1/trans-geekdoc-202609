    # A. Model Training


    Supervised learning is an iterative optimization process that aims to find general
    parameters in data. Statistics goal of model learning is to find the candidate
    model from limited data, which has the best performance on new data [11]. The
    training process estimates these parameters to minimize the error between a predicted
    value and its corresponding real truth value. In order to collect parameters,
    a model can also have hyperparameters that control complexity. To find the best
    model, a range of different parameters and hyperparameters should be explored.
    However the best model can be selected. Each of these choices requires computational
    power, time and energy, resulting in trade-offs between predictive performance
    and resource consumption. State-of-the-art machine learning models, in particular
    neural networks, have millions of parameters and the computing resources required
    are substantial. Two approaches for improving the performance of machine learning
    systems are designing them with specialized hardware and distributing model training
    for massive, parallel deployment across cloud servers [12].


    In addition to the resources consumed during training, supervised machine learning
    requires labeled data, which is expensive and time consuming to collect [13].


    # B. Data Provenance


    The quality of machine learning model is strongly influenced by the quality and
    distribution of the data used [22]. Due to this central role of data in machine
    learning, features of observational data, like missing data, data noise and outliers,
    significantly impact the performance of the data that is trained. For example,
    the data sample can result from random or systematic errors in the observations,
    or data that is biased. Performance can be improved by further propagating data
    provenance that were generated during data processing through the entire machine
    learning workflow. To develop a software method, such data errors are to make
    machine learning what gets used [23]. Once deployed, a dataset is part of management,
    so dependencies grow over datasets. As the training data becomes increasingly
    complex to track [24]. Data dependencies and feedback loops are often hidden and
    have unexpected effects that make machine learning systems brittle and error diagnosis
    expensive [25]. Machine learning systems are also vulnerable to attacks that exploit
    their dependency on data by polluting training data


