    # II. OVERVIEW OF MACHINE LEARNING SYSTEMS


    Machine learning algorithms learn from data by utilizing functions that transform
    input variables, or to output. This is often called machine training. A trained
    model is used to calculate an input value for a new output, which is called inference
    [1]. When ground truth, labels, or output values are produced by supervised learning.
    A typical machine learning workflow involves data collection, model training,
    and inference steps. Data processing serves two purposes. Firstly, input data
    is collected by removing outliers, noise and errors. Secondly, data is transformed,
    by filtering the features that are at used in the machine learning process. This
    process facilitates the deployment of machine learning workflows, which they take
    operational aspects into consideration. This section highlights data, training,
    inference and operational concerns that currently challenge machine learning systems.
    Rather than being exhaustive, we raise important considerations that are bound
    to supervised machine learning systems used in the IoT to provide services,


