    # C. Inference Concerns


    Trained models use values for new inputs to perform decisions or actions on an
    ongoing basis. A model is a reliable asset that will make thousands or millions
    of predictions before it is retired. Retrained inference happens in the background
    of an application. Inference usually serves users directly and consequently needs
    to be reliable, accurate and efficient. Even though the resource requirements
    for a single prediction might be in comparison to those of training a model, the
    scale at which inference happens requires efficient and optimized processes with
    high throughput, low latency and guaranteed performance [26]. Traditionally, more
    attention has been paid to optimizing rather than inference. Recent- popular machine
    learning platforms like TensorFlow and MXNet offer methods for model optimization,
    but alone is not enough. When machine learning systems make decisions and actions
    on our behalf, they must also be reliable. Different machine learning systems
    offer different quality and accuracy. Methods that guarantee output and reliability
    estimates are needed to provide inference with quality assurance [28]. Additionally,
    interpretable inference, which is linked to the limits of understanding of how
    a model works, is necessary for trust, fair and ethical decision-based predictions
    [29].


    computing devices must deliver dynamic and contextaware functionality over multi-layered,
    heterogeneous architectures [7]. For machine learning systems this is both an
    opportunity and a challenge. Learning from data, they are well suited to offer
    IoT applications that function at specific locations, environmental or social
    situations and even with time over. It could be argued that machine learning systems
    are a prerequisite for delivering smart devices at scale, as explicitly as programming
    for the IoT and its interactions with the physical world and social systems is
    possible. However, without machine learning systems assume homogeneous and context-independent
    cloud computing with scalable data storage and unstructured on-device supply,
    high latency and bandwidth bottlenecks. And consistent environment does not exist
    for the billions of connected devices in the IoT, where data offloading to wireless
    networks, heterogeneous computing infrastructure and resource-connected devices
    with physical hardware presents trade-offs against each other and the performance
    of algorithms. To achieve scale, consensus must also be reliable.


    # D. Machine Learning Operations (ML, Ops)


    The code responsible for training a model is only a small component of the greater
    system, which includes components for configuration, data collection, verification,
    feature extraction, resource management, analysis, process management, serving
    infrastructure and monitoring. Even though machine learning systems are constructed
    from these different components, models are not in the way that software is [25].
    Model parameters are learned and are dependent on the features and the hyperparameters.
    By the features used for training, individual models are not extensible and multiple
    models in non-obvious ways. How model evolves as data changes, methods improve
    or software changes [30]. Ongoing deployment, customization, and retraining are
    continuous. Machine learning systems require end-to-end software that facilitates
    the development, testing, configuration, deployment, management and maintenance
    of all components that affect data provenance, model training and inference [31].


    # III. Challenges FOR MACHINE LEARNING SYSTEMS


    Machine learning systems in smart services are constrained by the nature and requirements
    of the IoT: distributed, physically-bounded and resource-limited, wireless-connected


    # A. Offloading to Wireless Communication


    Wireless communication networks like Bluetooth and WiFi connect devices either
    as a local network, or connect individual devices and locals to the Internet network
    [39]. IoT applications rely on wireless communication to offload data collected
    by the device, where it can be cleaned and fused with other data, which enables
    machine learning models for future use. Offloading gives access to computing power
    and storage, but poses privacy and performance concerns. Wireless communication
    links have a fixed capacity and range [32], may be noisy and especially when wireless
    networks are congested can affect IoT applications. Moreover, machine learning
    systems must consider the consistency of local computing during inference, making
    fault tolerance a necessary consideration [28]. Additionally, wireless connections
    introduce latency, uncertainty and costs to machine learning systems that have
    abstraction layers and communication requirements. Offloading thus weighs against
    gain and real-time inference requirements, and the frequency, size and distribution
    of training updates of machine learning systems. While the data path, training
    and transfer volumes can be optimized through routing schemes, selection and compression
    to minimize bottlenecks and communication costs [35], and may limit reduce accuracy
    and be limited by the power supply and computing capabilities of devices.


    # B. Distribution Across Heterogeneous Devices


    IoT endpoints (e.g. servers, sensors or mobile phones) that are at the periphery
    of the network are called the edge.


