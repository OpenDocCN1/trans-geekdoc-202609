    # V. OUTLOOK-TRUSTWORTHY EDGE INTELLIGENCE


    Trust-technology research extends beyond trust systems to non-human, artificial
    entities. Technologies in their perceived ''humaneness'', use trust technologies
    differently than this [55]. If the perceived level of a technology is high, then
    human-like trust constructs such as benevolence, integrity and ability, are good
    measures of trust. If the perceived level is low, then trustworthiness is appropriate.
    While trust and trustworthiness represent different concepts [6]. Trust is a psychological
    state that whether a user is willing to take a risk in the absence of monitoring
    or external control. Trustworthiness is necessary for consistency and fairness
    on the characteristics of a system. Trustworthy concerns are essential in both
    AI and the IoT, but they are approached from different perspectives in the two
    fields.


    # A. Trustworthiness in AI


    Technologies that create the perception of social presence of others, facilitate
    social behaviour (e.g. in dialogue or receiving affection), and that enable interactions
    with other people are perceived to be human-like [55]. Artificial intelligence
    technologies, which encompass machine learning systems, are thus human-like by
    definition and design. Heightening public trust must lead governments and organisations
    to rapidly develop AI frameworks to specify


    principles for trustworthy. The core themes that emerge from prominent frameworks
    are privacy, accountability, safety and security, transparency and explainability,
    fairness and nondiscrimination, control of technology, professional responsibility,
    and promotion of human values [75]. These trust constructs resonate with the AI
    technologies perceived to be human-like. While the frameworks lay the theoretical
    work, to be trustworthy AI needs to develop measurable trustworthiness that can
    lead to clear specifications.


    **Opportunity:** Trustworthiness concerns of machine learning systems need to
    be standardized and operationalized so they can be incorporated in specifications
    and evaluated objectively in applications.


    # B. Trustworthiness in IoT


    In contrast, trustworthiness concerns in the IoT are gathered across the industry,
    constructed, and formally deined as safety, security, privacy, reliability and
    resilience [51]. The concerns serve to ensure that systems behave appropriately
    under varying conditions. They require that the IoT be perceived as less human-like,
    and more like machine. Other properties such as controllability, manageability,
    functionality, and uncertainty are considered functional concerns rather than
    trustworthiness concerns.


    # C. Opportunities for Trustworthy Edge Intelligence


    Neither AI nor trustworthiness concerns in the IoT address the full spectrum of
    trustworthiness concerns in edge intelligence. For example, a machine learning
    system in edge intelligence operates under open world assumptions, which can create
    new categories, unseen examples, black swan events and event attack models. To
    be able in such scenarios, explainability is a necessary requirement. Or a smart
    device installed in a new context where the environment does not resemble the
    training data may fail to function. This may require a trustworthy model.


