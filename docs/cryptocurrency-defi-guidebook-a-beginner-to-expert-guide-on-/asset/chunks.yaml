- raw: 'The possibility of such enormous losses emphasizes the vulnerabilities inherent
    in Defi, which many people are not paying close attention to. Here are some of
    the dangers that Defi users face:


    1.  Technical risks, like as smart contracts being hacked or flaws being exploited;


    2.  Liquidity risks, such as protocols like Compound running out of liquidity;


    3.  Admin Key Risks: when the protocol''s master private key could be compromised.


    The hazards underscore the importance of acquiring insurance when dealing with
    big sums of Defi. In this part, we will look at two main suppliers of decentralized
    insurance to assist you in protecting your Defi transactions: Nexus Mutual and
    Opyn.


    ## NEXUS MUTUAL


    Nexus Mutual is an Ethereum-based decentralized insurance protocol that provides
    coverage for any smart contract on the Ethereum blockchain.


    **What event is covered by Nexus Mutual?**


    Nexus Mutual currently provides coverage for smart contract failures, protecting
    against potential flaws in smart contract programming. The coverage may result
    in financial damages caused by hacks or exploits in the smart contract code. It
    is important to note that smart contract coverage only protects against “unintended
    uses,” therefore security events such as the loss of private keys or centralized
    exchange attacks are not protected.


    **How does coverage work? **


    To begin, you must first select the Cover Period and the Cover Amount. The Cover
    Amount is the amount for which you want to acquire a cover, and it is the amount
    that will be paid out if a smart contract fails. Following a smart contract failure
    incidence, a Claims Assessment procedure will be initiated, with Claims Assessors
    evaluating the claims. Once the Cover Amount has been approved, it will be paid
    to you.


    **How is the coverage priced? **


    While Nexus Mutual can cover any smart contracts, the cost of Smart Contract Cover
    is determined by several factors, including:


    1.  The smart contract properties that necessitate covering. Examples include
    contract value, transactions completed, and so on.


    2.  Coverage Amount


    3.  Coverage Period


    4.  Risk Assessors'' value staked against the smart contract


    A smart contract that does not have enough value staked against it or has not
    been battle-tested sufficiently will return an un-coverable quotation, indicating
    that the smart contract cannot be covered at the time.


    Assume you purchase 5 ETH of cover for the Compound smart contract when ETH is
    $200. Assuming the coverage is 0.013 ETH every 1 ETH of coverage for a year, this
    would cost you a total of 0.065ETH for the year. If Compound is hacked during
    this period, you will be entitled to recover 5 ETH regardless of the price of
    ETH at the time of the hack. If ETH rose to $300 during the hack, you would still
    receive 5 ETH if your claim was validated.


    It should be noted that anyone can purchase coverage for any smart contract and
    file a claim if the smart contract is used in an unanticipated manner. You do
    not need to provide proof that you invested money in the smart contract and lost
    money.


    **How to Purchase Cover? **


    1.  Specify the smart contract address for which you wish to Cover.


    2.  Enter the Cover Amount, Currency (ETH or DAI), and Cover Period in the appropriate
    fields.


    3.  Use Metamask to generate a quote and complete the transaction.


    4.  You are now fully protected!


    ## NXM Token


    Nexus Mutual has created its native token, NXM. The NXM token is used to purchase
    insurance, participate in risk assessment, and assess claims. It is also used
    to promote capital provision and indicates ownership of the mutual''s capital.
    The value of NXM will rise in tandem with the mutual''s capital pool.


    Users can utilize the platform to do two things: purchase capital protection or
    become a Risk Assessor by staking NXM.


    It employs a token bonding curve that is influenced by the quantity of capital
    available to the mutual and the amount of capital required to meet all claims
    with a specific probability. The NXM cryptocurrency is currently not traded on
    any market and is exclusively utilized internally by Nexus Mutual.


    **What exactly is a Risk Assessor?**


    A Risk Assessor is someone who stakes value against smart contracts (basically
    vouching that the smart contract is safe) and is rewarded in NXM as users take
    cover on their staked smart contracts. A Risk Assessor is someone who understands
    the dangers associated with smart solidity contracts and can either: (1) evaluates
    individual Dapps or (2) believes someone who says the contract is secure (like
    an auditor or other staker)


    ## OPYN


    Opyn is yet another Defi app that offers smart contract insurance. Opyn currently
    protects USDC and DAI deposits on Compound and stablecoin deposits on another
    Defi dapp, Curve. Opyn protects against a variety of risks in addition to smart
    contract failures, such as financial and administrative hazards. Opyn does this
    through the use of financial derivatives, specifically options.


    **What are Options?**


    There are two types of options: call and put. A call option is a right, but not
    a duty, to buy an asset at a given strike price within a specified time frame.
    On the other hand, a put option is a right, but not a duty, to sell an asset at
    a certain strike price within a specified period.


    There must be a seller of an option for every buyer of an option. To get this
    correct, a buyer of an option will pay a premium to the seller of the option.
    There are two primary tastes to choose from: American and European. The distinction
    between the two is that an American option can be exercised at any time before
    the expiry date, while a European option can only be exercised on the strike date.


    **How does Opyn function?**


    Opyn enables users to mitigate the chance of a black swan event occurring on Compound
    by allowing them to purchase Put options on USDC and DAI stablecoin deposits are
    available.


    As stated before in the Compound section, when someone lends DAI, they receive
    cDAI tokens in exchange. A trader can utilize Opyn to purchase oTokens, which
    can be used as a right to sell cDAI and receive DAI in the event of a smart contract
    failure on Compound.


    Purchasing one DAI of insurance on Opyn is equivalent to purchasing an American
    Put option on the cDAI asset with a strike price of $0.92. If Compound fails,
    any DAI deposited on Compound will be valued much less, say $0.10. The insurance
    customer can redeem $0.92 back in ETH using Opyn''s ocDAI token. This shields
    the user against smart contract losses. Because no centralized body is required
    to verify the claim, this is genuinely decentralized insurance.


    NOTE: Opyn only covers your principal deposit and not any interest earned on Compound.
    When you deposit DAI on Compound, you will receive cDAI in return. To lodge a
    claim on Opyn, transmit your cDAI and oDAI insurance tokens to Opyn, and you will
    receive your coverage amount immediately.


    **What is the cost of insurance?**


    At the time of writing, obtaining insurance on Compound with Opyn costs about
    1.22 percent on Dai deposits and 2.61 percent on USDC deposits. This means that
    if you are getting a 5.41 percent uninsured yield on Dai deposits, you are assured
    a 4.19 percent yield after acquiring insurance on Opyn.


    Please keep in mind that Opyn is still in its early stages, having only launched
    in February 2020 and that the cost of insurance may change as the market seeks
    an appropriate equilibrium. Because the insurance is tokenized in the form of
    oTokens, they can be exchanged on DEXs such as Uniswap; therefore, the insurance
    price is set by the market price, which is determined by supply and demand.


    **Why would anyone provide Opyn insurance?**


    Every insurance consumer must have access to an insurance provider (a seller of
    Put options) on Opyn (purchaser of Put option). An ETH holder can earn a return
    on their ETH by becoming an insurance provider on Opyn.'
