- raw: "In the blockchain industry, governance models establish a system in which\
    \ investors directly say how a project is designed and in which direction it is\
    \ heading. Like a company's shareholders, community members can voice their opinions\
    \ and actively contribute to the decision-making process.\n\nGovernance establishes\
    \ absolute decentralization and delegates all planning to a project's investors\
    \ rather than its developers.\n\nWhen writing a paper about Decentralized Autonomous\
    \ Organizations (DAO), Ethereum co-founder Vitalik Buterin referred to governance\
    \ models as companies that work without managers. Instead of relying on a small\
    \ group of executives, the entire system utilizes smart contracts that process,\
    \ execute, and accept various tasks and decisions.\n\nGovernance is important\
    \ for Defi because it transfers ownership of a protocol to its community. Most\
    \ projects have a governance token that grants users voting rights and the ability\
    \ to create governance proposals.\n\nIdeally, governance tokens are fairly distributed.\
    \ This can be done by airdropping a portion of the cryptocurrency's supply to\
