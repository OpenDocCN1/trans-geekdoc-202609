    \ on the other hand, goes a step further by including a margin and leveraged exchange,\
    \ enabling ETH margin trading up to 5X leverage using either DAI or USDC.\n\n\
    **Lending**\n\nIf you are a cryptocurrency owner looking to make some passive\
    \ income from your otherwise inactive crypto assets, consider lending them out\
    \ on dYdX for a yield. It is quite a low risk, and by putting it into dYdX, interest\
