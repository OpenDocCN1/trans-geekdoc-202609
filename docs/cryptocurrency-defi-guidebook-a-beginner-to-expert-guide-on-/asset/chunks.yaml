  trans: '


    此类巨额损失的可能性强调了 Defi 有的脆弱性，而许多人并未对此加关注。以下是 Defi 用户面临的一些风险：


    1. 技术风险，例如智能合约被黑或或漏洞被利用；

    2. 流动性风险，例如 `Compound` 等协议出现流动性枯竭；

    3. `Admin Key` 风险：当协议的主私钥可能被泄露时。


    这些危险凸显了在处理大额 Defi 资金时购买保险的重要性。在这一部分中，我们将介绍两个主要的去中心化保险供应商，以帮助您保护自己的 Defi 交易：`Nexus
    Mutual` 和 `Opyn`。


    ## NEXUS MUTUAL


    `Nexus Mutual` 是一个基于以太坊的去中心化保险协议，为以太坊上的任何智能合约提供保障。


    ### Nexus Mutual 涵盖哪些事件？


    Nexus Mutual 目前为智能合约故障提供保障，防止智能合约编程中的潜在漏洞。该保障可能涵盖因智能合约代码的黑客攻击或漏洞利用导致的财务损失。需要注意的是，智能合约保障仅针对“非预期用途”，因此诸如私钥丢失或中心化交易所攻击等安全事件不在受保护范围内。


    ### 保障如何运作？


    首先，您必须选择 `Cover Period`（保障周期）和 `Cover Amount`（保障金额）。`Cover Amount` 是您想要购买保障的金额，也是智能合约故障时将支付的金额。智能合约故障发生后，将启动
    `Claims Assessment`（理赔评估）程序，由 `Claims Assessors`（理赔评估员）评估索赔。一旦 `Cover Amount`
    获得批准，将支付给您。


    ### 保障如何定价？


    虽然 Nexus Mutual 可以涵盖任何智能合约，但 `Smart Contract Cover`（智能合约保障）的成本取决于多个因素，包括：


    1. 需要保障的智能合约属性。例如合约价值、完成的交易次数等。

    2. `Coverage Amount`（保障金额）

    3. `Coverage Period`（保障周期）

    4. 风险评估员质押在智能合约上的价值。


    如果智能合约没有足够的质押价值或未经足够的测试，将返回不可提供的报价，表明该智能合约目前无法获得保障。


    假设在 `ETH` 价格为 `$200` 时为 `Compound` 智能合约购买了 `5 ETH` 的保障。假设每 `1 ETH` 保障一年的成本为 `0.013
    ETH`，那么一年的总成本将是 `0.065ETH`。如果 `Compound` 在此期间被黑，无论被黑时 `ETH` 的价格如何，您都有权收回 `5 ETH`。如果
    `ETH` 在攻击期间上涨到 `$300`，只要您的索赔通过验证，您仍将获得 `5 ETH`。


    需要注意的是，任何人都可以为任何智能合约购买保障，并在智能合约以意外方式使用时提交索赔。您不需要证明自己曾向智能合约投入过资金并导致了损失。


    ### 如何购买保障？


    1. 指定您想要 `Cover`（保障）的智能合约地址。

    2. 在相应字段中输入 `Cover Amount`、`Currency`（`ETH` 或 `DAI`）和 `Cover Period`。

    3. 使用 `Metamask` 生成报价并完成交易。

    4. 您现在完全受到保护了！


    ## NXM Token


    Nexus Mutual 创建了其原生令牌 `NXM`。`NXM` 令牌用于购买保险、参与风险评估和索赔评估。它还用于促进资本供应并表示对互助资金的所有权。`NXM`
    的价值将与互助资金池同步上升。


    用户可以利用平台做两件事：购买资本保护或通过质押 `NXM` 成为 `Risk Assessor`（风险评估员）。


    它采用了令牌绑定曲线，该曲线受互助可用资金以及满足特定概率的所有索赔所需资金量的影响。`NXM` 加密货币目前不在任何市场上交易，仅供 Nexus Mutual
    内部使用。


    ### 什么是风险评估员？


    `Risk Assessor`（风险评估员）是指针对智能合约质押价值的人（基本上是担保智能合约是安全的），当用户对其质押的智能合约购买保障时，他们将获得 `NXM`
    奖励。`Risk Assessor` 是理解与 solidity 合约相关风险的人，并可以：(1) 评估单个 `Dapps` 或 (2) 相信认为合约安全的人（如审计员或其他质押者）。


    ## OPYN


    Opyn 是另一个提供智能合约保险的 Defi 应用。Opyn 目前保护 `Compound` 上的 `USDC` 和 `DAI` 存款，以及另一个 Defi
    应用 `Curve` 上的稳定币存款。除了智能合约故障外，Opyn 还防止各种风险，例如财务和管理风险。Opyn 通过使用金融衍生品（特别是期权）来实现。


    ### 什么是期权？


    期权有两种：看涨和看跌。`call option`（看涨期权）是一种权利而非义务，可以在指定的时间范围内以给定的行价购买资产。相反，`put option`（看跌期权）是在指定期限内以特定行价出售资产的权利而非义务。


    每个期权买方都必须有一个期权卖方。为了确保正确，期权买方将向期权卖方支付权利金。主要类型可选：`American`（美式）和 `European`（欧式）。两者的区别在于
    `American option`（美式期权）可以在过期前的任何时间行权，而 `European option`（欧式期权）只能在执行日行权。


    ### Opyn 如何运作？


    Opyn 通过允许用户购买 `USDC` 和 `DAI` 稳定币存款的 `Put options`（看跌期权），从而降低 `Compound` 发生黑天鹅事件的概率。


    如前 `Compound` 部分所述，当有人借出 `DAI` 时，他们会收到相应的 `cDAI`。交易者可以利用 `Opyn` 购买 `oTokens`，在智能合约故障时，这些令牌可以用出售
    `cDAI` 并获得 `DAI` 的权利。


    在 `Compound` 上购买 `1 DAI` 的保障等同于购买行价为 `$0.92` 的 `cDAI` 资产的美式看跌期权。如果 `Compound`
    故障，任何 `DAI` 的价值将大幅下降，例如 `$0.10`。用户可以使用 Opyn 的 `ocDAI` 令牌兑回 `$0.92` 的 `ETH`。这保护了用户免受损失。由于不需要机构验证索赔，这是真正的去中心化保险。注意：Opyn
    仅涵盖您的本金，不涵盖在 `Compound` 上赚利息。当您在 `Compound` 存款 `DAI` 时，您会收到 `cDAI`。要在 Opyn 上索赔，请将您的
    `cDAI` 和 `oDAI` 保险令牌发送到 `Opyn`，您将立即获得保障金额。


    ### 保险成本是多少？


    在写作期间，通过 `Opyn` 获取 `Compound` 的保障，`DAI` 存款约为 `1.22%`，`USDC` 存款约为 `2.61%`。这意味着如果您在
    `DAI` 存款上获得 `5.41%` 的无保险收益，在购买 `Opyn` 保障后，您的收益将是 `4.19%`。


    请记住，`Opyn` 仍处于早期阶段（仅于 2020 年 2 月推出），且保险成本随着市场寻求适当平衡而发生变化。由于保险以 `oTokens` 的形式代币化，它们可以在
    `Uniswap` 等去中心化交易所进行交易；因此保险价格由市场价格决定。


    ### 为什么有人提供 Opyn 保险？


    每个保险消费者都必须在 `Opyn` 上找到一个保险提供者（看跌期权的卖方）。`ETH` 持有者可以通过成为 `Opyn` 上的保险提供者从使其 `ETH`
    获得回报。


    '
