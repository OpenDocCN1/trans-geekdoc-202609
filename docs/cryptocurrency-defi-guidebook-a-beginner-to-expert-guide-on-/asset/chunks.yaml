  trans: '

    监管通常发生在产品或服务生命周期的后期，此时在不存在内在独特风险的情况下，触发责任或监管行动的损害更有可能发生。


    鉴于新兴技术规模较小且具有创造性，监管机构更倾向于在早期采取“无害”的方法。对于具有明确已知危害或误用风险的（如罂粟花和武器），其业务受到高度监管，且所有阶段都受到严密监控和控制。大多数技术系统则处于于两者之间的中间地带。


    除了日益成熟，Defi（去中心化金融）服务还有潜力在整个生命周期内变得更加去中心化。去中心化程度也是政策制定者和监管机构的重要考虑因素。应对 Defi 服务潜在危险的规则可以在生命周期的四个阶段被采用：(1)
    开发；(2) 发布；(3) 部署；以及 (4) 。


    通常会有一个可识别的协议开发者群体（尽管他们可能在开源开发社区、非营利基金会、协会或 `DAO` 的伞下运行）。一旦协议发布，多个团队可能会将其开发为服务并向用户推广，这代表了一个组合部署阶段。不同的团队以后可能会对这些服务进行分叉（fork）。协议和智能合约将很大程度上实现服务的自动化，可能由去中心化治理过程进行调节。


    在生命周期的早期施加监管要求可能更简单，因为此时接入点更加明显，并且有更大的机会影响长期轨迹。然而，生命周期越早，与实际可证明的损害之间的联系就越弱，对创新的潜在影响也越大——因此，确定监管介入在何时点与风险成比例至关重要。例如，沙盒、安全港和不采取行动函等可能是解决这一问题的有用工具，而不是在早期阶段强制采取行动。


    **请记住**：此工具包旨在为政策制定者提供一个起点，帮助他们理解 Defi 业务和服务带来的风险与机遇，并制定最佳政策应对措施。


    Defi 的具体表现及其政策问题会随着时间而变化，活动水平以及更广泛区块链和数字资产世界的其他方面也是如此。政策制定者和监管机构将根据其司法管辖区的独特语境采取不同的方法。金融监管义务的重大转变，或跨国标准的实施，可能会改变考虑
    Defi 问题的背景。2009 年之前不存在去中心化数字货币资产，2015 年之前也不存在通用型智能合约平台，因此任何关于对 Defi 这种分支进行适当处理的建议，必须考虑这个快速发展领域中潜在且不可预测的发展。


    显而易见的是，Defi 是一个独特且可能重要的发展，无论是在区块链领域还是整个金融服务领域都是如此。正如本报告记录的，Defi 提供了许多机遇和诸多挑战。即使在没有明确答案的情况下，政策制定者通过考虑要问正确的问题、理解与其监管制度之间的互动和紧张关系，并估计不同行动方案的成本和收益，将获得最大的收益。


    ## 十八


    在继续之前，让我们简要看一眼 Defi 让我们能够做的一些事情：


    *   **透明性**：一个透明且可审计的金融环境。

    *   **访问性**：无限制地访问 Defi 应用，无需担心基于种族、性别、信仰、国籍或地理位置的歧视。

    *   **高效**：编程货币允许消除中心化中间人，从而产生更具效益且更高效的金融市场。

    *   **便利**：通过低廉的价格和很少的等待时间，资金现在可以随时随地发送给任何拥有加密货币钱包的人。


    上述所有内容已让用户能够完成以下操作：提供流动性以获得无产出资产的收益且没有成熟/锁定期，获得贷款（带抵押品）而无需纸质文件并随地还款，以及快速执行自动化交易方法。最棒的部分是，只要有互联网连接，任何人、任何地方、任何时间都可以访问以上所有内容。这就是
    Defi 在访问性方面的力量，而我们才刚刚处于冒险的开始。


    根据区块链平台 Dune Analytics 的统计，Defi 用户数从 2020 年 1 月的 93,000 人增加到 2021 年 4 月的 180 万人。在此期间，市场估值从
    7 亿美元飙升至 580 亿美元。尽管在股市崩盘和流行病期间脱颖而出，去中心化金融仍成为行业的下一个大趋势。Defi 跨越了它的利基地位，完全消除了担心成为另一个
    `ICO` 类现象的担忧。此外，其强劲的表现足以令加密货币中心化交易所感到恐惧，这些交易所已向 `DEXs` 流失了大部分流动性。


    DeFi 的颠覆性潜力不可否认的。一个全新的去中心化未来正降临我们，这在区块链领域并不意外。然而，在实现广泛采用之前，还有其他必须解决的。


    智能合约继续容易受到攻击，匿名开发者继续像秃鹫一样通过发起“拉地毯”（rug pull）行动，而法律的威胁继续悬在我们头顶。目前，Defi 是加密货币的原始西部，创造者和用户都必须达到特定的成熟度，这个专门的生态系统才能在这个十年中确立自己作为一个突出且严肃的领域。


    需要几年时间才能达到完美且平衡的状态，时机将完全取决于社区及其行为。在这些不可预测且混乱的时期，显而易见的是颠覆性技术比任何时候都可能进入现实世界，这是我们做出重大变革的机会。道路可能漫长而艰难，但有一点是肯定的：金融的未来是去中心化的。


    个人用户不想跨多个平台进行交易。用户主要聚集在入口（例如交易所）和钱包（例如 `balance.io`）。由于这些倡议是开源且去中心化的，它们将能够相互对接，在同一平台内实现交易、现有资产存储、保险和其他功能。我们正在看到一些早期变体，例如
    `Trust Wallet` 与 `Dapps` 交互。`Morpher.io` 和 `Abra` 等平台开始将股票等传统工具与代币相结合，这将允许世界偏远地区的人获得此前无法获得的外国资产，发挥重要作用。De-Fi
    平台可能会随着时间的推移减少监管为了保持经济封闭而制造的复杂性，允许没有适当工具（例如专业银行）的普通投资者能够获得商品、奇特资产、衍生品、外汇甚至股票。

    '
