    The lending pools make money available for others to borrow from, and lenders
    receive a portion of the interest paid back to the pool by borrowers. A lender''s
    interest rate is heavily influenced by the amount they contribute to the pool.
    Furthermore, the liquidity of crypto-assets is an important factor in deciding
    the internet rate on Defi lending platforms.


    ## DISADVANTAGES OF DEFI


    Many of the issues and risks that a Defi project faces are related to the technology
    that it is built on: blockchains. Because over 90% of Defi projects are based
    on the `Ethereum` blockchain, we shall consider the Ethereum challenges to be
    Defi challenges:


    ### Unpredictability

    If the blockchain on which a Defi project is hosted is unstable, the project will
    automatically inherit the instability of the host blockchain. The `Ethereum` blockchain
    is still evolving; for example, mistakes made when transitioning from `PoW` to
    the new `Eth 2.0` `PoS` system may introduce new risks to Defi projects.


    ### Scalability

    Another major issue with Defi projects is the host blockchain''s scalability.
    The scalability issue causes two major issues:


    1. Confirmation of transactions takes a lengthy time; and

    2. Transactions are extremely expensive during times of congestion.


    `Ethereum` can process approximately 13 transactions per second at full capacity,
    whereas centralized counterparts can process thousands upon thousands of transactions.


    ### Smart Contract Issues

    For many Defi projects, smart contract vulnerability is a major source of problems.
    The smallest flaw in a smart contract''s code can result in a loss of funds.


    ### Low Liquidity

    Liquidity is one of the essential aspects of Defi token-based projects and blockchain
    protocols. By October 2020, the total value locked in Defi will be more than $12.5
    billion. When compared to established financial systems, this is a drop in the
    bucket.


    ### Excessive collateralization

    As previously said, the crypto lending industry is an appealing offering in Defi.
    However, this firm suffers from over-collateralization, which arises when the
    stock asset value (by borrower) is unreasonably high compared to the loan amount
    itself. To compensate for the absence of hurdles such as credit ratings, Defi
    projects have substantial collateralization.


    ### Low Interoperability

    There are other blockchains, including `Bitcoin`, `Ethereum`, and `Binance Smart
    Chain`, each having its Defi ecosystem and community. Interoperability allows
    Defi platforms, tools, `DApps`, and smart contracts running on multiple blockchains
    to communicate with one another. Many projects are isolated until this gets simpler.


    ### Poor Insurance

    Investors are protected by insurance in the case of a hack or other fraudulent
    activity. Insurance is quite crucial in centralized finance, but it is considerably
    less common in Defi.


    ### Centralization

    The major goal of establishing `bitcoin` and blockchain is to create decentralized
    finance, yet decentralized finance isn''t always as decentralized as it should
    be. Scams are considerably reduced by decentralization.


    Defi worked on the project "Sushiswap." `Sushiswap`''s unknown founder has pulled
    the plug on the project, turning all of his `Sushi` tokens to `ETH` on September
    5, 2020. The value of the `SUSHI` token rose to $10 when it split from the `Uniswap`
    protocol before falling to 0.6$(at the time of writing this article) after the
    founder converted his tokens. This is an illustration of how, even within Defi,
    a single point of failure is feasible.


    ### Your Responsibility

    Even if Defi is risk-free and error-free, it is not liable for your errors. Defi
    shifts responsibility away from intermediaries and toward users. If you lose your
    assets by mistake, no one will hold you accountable; thus, developing tools to
    prevent human errors and mistakes is critical in the Defi area. With independence
    comes a lot of responsibility. Many users aren''t used to having to look after
    themselves in this way, resulting in losing money or being defrauded.


    Defi is a new and experimental technology with some concerns and problems, particularly
    in terms of security. Developers and supporters of decentralized finance expect
    that these issues will be resolved in the future.


    ## Five


    If Defi is an abstract thought that cannot be instantly understood, the best way
    to wrap one''s mind around decentralized finance is by exploring its ecosystem
    and use cases. Defi is a vibrant segment of the blockchain industry that meets
    the demands of everyone and everything. If a financial service or product exists
    in the real world, there is surely a blockchain version of it on `Ethereum`.


    The ecosystem grows day by day, and each month we see at least a few projects
    which are on the road to establishing their dominance on the market. According
    to data from `Defi Pulse`, the entire Defi sector contains $55 billion worth of
    crypto assets. Although most the largest projects are decentralized exchanges
    and lending protocols, there are also notable use cases that we will explore in
    the next section.


    ### Decentralized exchanges

    Decentralized exchanges (`DEXs`) are the heart of Defi. They became popularized
    among crypto investors because they offer decentralized noncustodial trading.
    Centralized exchanges (`CEXs`) are operated by financial services companies in
    the format of order books maintained by market makers (`MMs`). Although CEXs offer
    crypto assets, their platforms are inherently centralized, which negatively affects
    security, trust, and privacy.


    On the other hand, developers manage DEXs, and their format is based on smart
    contracts. Their smart contracts execute trades, hold liquidity, process withdrawals/deposits,
    and anything else that you can think of. As such, there is effectively no intermediary
    that interacts with user funds or controls them.


    Some of the most popular DEXs include `Uniswap`, `Bancor`, `dYdX`, `PancakeSwap`,
    and `SushiSwap`. While most work is based on Automated Market Makers (`AMM`),
    some DEXs offer a `CEX`-like experience using order books. Custodianship is the
    main difference between these two methods.


    In the first case, investors execute trades directly from their wallets. In the
    second case, investors must deposit funds on the DEX before being able to trade.


    ### Automated Market Makers

    An Automated Market Maker (`AMM`) is a smart contract that holds on-chain liquidity
    reserves, replacing order books. An `AMM` attracts liquidity from so-called liquidity
    providers, who are financially incentivized to temporarily lend their cryptocurrency
    in return for rewards in the form of fees.


    Rather than trading on an exchange''s order book, customers engage with a smart
    contract to trade with other users. Such a system has its own set of benefits
    and disadvantages.


    #### Advantages:

    - Decentralization: Smart contracts are preset agreements that work by executing
    instructions autonomously. DEXs, when used in conjunction with governance frameworks,
    essentially transfers ownership of the platform and its assets to its users. There
    is, of course, no centralized entity.

    - Noncustodial: Traders and liquidity providers connect with DEXs directly from
    their cryptocurrency wallets, maintaining complete custody of their assets. Smart
    contracts are then used to specify and handle all transactions.

    - There are no manipulations: CEXs are notorious for market manipulation and insider
    trading. DEXs have no means of influencing pricing in their favor since no one
    benefits from such activities.

