- raw: "One of the most important functions of cryptocurrencies is to allow for the\
    \ decentralized and trustless transfer of money between two parties. As Defi becomes,\
    \ more popular, more innovative payment mechanisms are being developed and tested.\n\
    \nOne Defi initiative discussed in this book attempts to alter how we think about\
    \ payments by repurposing payments as streams rather than traditional transactions.\
    \ The ability to provide payments as streams opens up a slew of new possibilities\
    \ for money. Consider \"pay-as-you-go,\" but on a much smaller scale and with\
    \ more accuracy.\n\nThe nascence of Defi and the rate of innovation will certainly\
    \ offer new ways of thinking about how payments operate, addressing many of the\
    \ current financial system's flaws.\n\nSeven \n\n## What is Ethereum?\n\nThe Ethereum\
    \ blockchain is currently being used to build the majority of Defi Dapps. But,\
    \ what precisely is Ethereum? Ethereum is a decentralized application platform\
    \ that is open-source all around the world. Consider it a global computer that\
    \ cannot be turned off. On Ethereum, software developers can create smart contracts\
    \ that control digital currency based on a set of criteria and are accessible\
    \ from anywhere in the world.\n\nThis book will also look at Decentralized Applications\
    \ (Dapps) that offer financial services, also known as Defi. The building blocks\
    \ of these Dapps are smart contracts written by software programmers. The Ethereum\
    \ network then deploys these smart contracts, operating 24 hours a day, seven\
    \ days a week. The network will keep track of the most recent state and maintain\
    \ the digital value.\n\n## What is a Smart Contract?\n\nA smart contract is a\
    \ programmable contract that allows two parties to agree on transaction parameters\
    \ without relying on a third party to carry out the transaction. For example,\
    \ if Alice wishes to create a trust fund that will pay Bob $100 per month for\
    \ the next 12 months, she may design a smart contract to do the following: 1.\
    \ 2. Verify the current date. Send Bob $100 automatically at the beginning of\
    \ each month 3. Repeat until the smart contract's fund is depleted. Alice has\
    \ eliminated the requirement for a trusted third-party intermediary (lawyers,\
    \ escrow agents, etc.) to transfer the trust money to Bob by utilizing a smart\
    \ contract, and the process has been made visible to all parties involved.\n\n\
    Smart contracts operate on the “if this, then that” logic. When a certain condition\
    \ is met, the smart contract will operate as specified. Multiple smart contracts\
    \ are joined to work with each other to complete more complicated procedures and\
    \ computations, known as a decentralized application (Dapp).\n\n## What is Ether\
    \ (ETH)?\n\nThe Ethereum blockchain's native currency is ether. It functions like\
    \ money and, like Bitcoin, can be used for everyday transactions. You may transfer\
    \ Ether to another individual to buy products and services at market prices. The\
    \ Ethereum blockchain keeps track of the transaction and ensures that it is completed.\n\
    \nIn addition, Ether is used to pay the fee that allows smart contracts and Dapps\
    \ to run on the Ethereum network. A suitable comparison for executing smart contracts\
    \ on the Ethereum network is driving a vehicle. You must have fuel to operate\
    \ a car. On Ethereum, you must pay a charge known as Gas in Ether to execute a\
    \ smart contract.\n\nEther is gradually evolving into its distinct reserve currency\
    \ and store of value. Within the Defi ecosystem, Ether is currently the preferred\
    \ asset choice for use as collateral underlying many Defi Dapps. It ensures the\
    \ financial system's safety and transparency. If this confuses you, don't worry;\
    \ we'll go over it in greater detail later in the book.\n\n## What is gas?\n\n\
    All transactions and smart contract executions on Ethereum incur a modest fee.\
    \ This fee is known as Gas. Gas is the technical term for computational effort\
    \ required to execute an operation or a smart contract. The more complex the execution\
    \ operation, the more gas is required to complete it. Gas fees are entirely paid\
    \ in ETH.\n\nGas prices can fluctuate from time to time, depending on network\
    \ demand. Because of the network's low computer resources, gas prices may rise\
    \ if more people interact on the Ethereum blockchain, such as transacting in ETH\
    \ or executing smart contract operations. In contrast, when the network is underutilized,\
    \ the market price of gas falls.\n\nGas costs may be adjusted manually, and when\
    \ the network is overloaded due to heavy use, transactions with the highest gas\
    \ price are prioritized for validation. Transactions that have been validated\
    \ will be finalized and added to the blockchain. If the gas fees paid are too\
    \ low, the transactions will be queued and may take some time to complete. As\
    \ a result, transactions with lower-than-average gas fees may take significantly\
    \ longer to complete.\n\n## What are Decentralized Applications (Dapps)?\n\nDapps,\
    \ in the context of Ethereum, are interfaces that interact with the blockchain\
    \ via smart contracts. Dapps appear and behave like regular web and mobile applications\
    \ from the outside, except they interact with a blockchain differently. Some of\
    \ the methods include requiring ETH to use the Dapp, storing user data on blockchain\
    \ in an immutable format, etc.\n\n**What are the advantages of Dapps?**\n\nDapps\
    \ are usually developed on top of decentralized blockchain networks such as Ethereum\
    \ and provide the following benefits:\n\n*   Immutability: Once information is\
    \ on the blockchain, it cannot be changed.\n\n*   Smart contracts recorded on\
    \ the blockchain are tamper-proof, which means they can't be altered without notifying\
    \ all other blockchain participants.\n\n*   Transparency: The smart contracts\
    \ that power Dapps are openly auditable.\n\n*   Availability: Dapps built on the\
    \ Ethereum network will remain active and usable as long as the Ethereum network\
    \ is active.\n\n**What are the disadvantages of Dapps?**\n\nWhile a blockchain\
    \ has many advantages, it also has many disadvantages:\n\n*   Smart contracts\
    \ are created by people and are only as good as the person who authored them.\
    \ Immutable smart contracts can magnify inevitable human mistakes.\n\n*   Transparent:\
    \ Because hackers can view the code to find exploits, openly auditable smart contracts\
    \ can also become attack vectors.\n\n*   Scalability: In most cases, a Dapp's\
    \ bandwidth is limited to the blockchain on which it runs.\n\n**What else can\
    \ you do with Ethereum?**\n\nAside from creating Dapps, Ethereum can also be used\
    \ to create Decentralized Autonomous Organizations (DAO) and issue other cryptocurrencies.\
    \ A Decentralized Autonomous Organization (DAO) is a completely autonomous organization\
    \ controlled by code rather than a single person. Based on smart contracts, this\
    \ code allows DAOs to replace the way traditional organizations are typically\
    \ run. Because it is based on code, it is immune to human intervention and operates\
    \ transparently. Any outside influence would have no effect. DAO token voting\
    \ would be used to make governance decisions or rulings.\n\nIn terms of tokens,\
    \ Ethereum can be used as a platform for the creation of other cryptocurrencies.\
    \ On the Ethereum Network, there are currently two popular protocols for tokens:\
    \ ERC-20 and ERC-721. ERC-20 is a protocol standard for the issuing of Ethereum\
    \ tokens that specifies the rules and criteria. ERC-20 tokens are fungible, which\
    \ means they can be exchanged for one another and have the same value. ERC-721\
    \ tokens, on the other hand, are non-fungible, which means they are unique and\
    \ cannot be exchanged. Consider ERC-20 to be money and ERC-721 to be collectibles\
    \ such as action figures or baseball cards.\n\nEight \n\nA wallet is an easy-to-use\
    \ interface to the blockchain network. It manages your private keys, which are\
    \ essential keys to the vault lock for your cryptocurrencies. Wallets are devices\
    \ that allow you to receive, store, and send cryptocurrencies."
