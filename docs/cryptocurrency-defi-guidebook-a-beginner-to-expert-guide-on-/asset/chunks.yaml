- raw: 'Any holder of digital assets can lock up funds as liquidity for potential
    trades, earning a yield paid by traders. Any trade price is determined algorithmically
    based on the ratio of available liquidity in the traded assets.


    Therefore, a trader is dealing against liquidity pools supplied by market makers
    rather than an order book of potential counterparties subject to a bid/ask spread.
    Different design choices for Defi exchanges produce tradeoffs around throughput,
    latency, security, scalability, fees, and slippage (the extent to which a larger
    order alters the price).


    ## CREDIT


    Borrowing and lending are central to finance because they facilitate risk-taking
    and expand the supply of capital through leverage. The classic form of centralized
    credit provision is banking. The bank manages the spread between the interest
    rates it pays to depositors, whose liquid assets and the rates it receives from
    borrowers on longer-term loans. It must assess the credit-worthiness of borrowers
    and set interest rates appropriately to account for defaults.


    By contrast, Defi credit protocols such as Compound and Aave pool together tokens,
    subject to an interest rate determined by the ratio of supply to borrowing. When
    lenders commit capital to Defi credit services, they receive platform-native tokens
    representing their tokens plus the specified interest rate. Net of transaction
    fees—which accrue to service providers—lenders receive and borrowers pay the same
    interest rate, which is typically variable (some platforms now purport to offer
    fixed rates as well). Both sides maintain full custody over their assets and the
    ability to liquidate at any time. Credit terms can be quite complex, and these
    instruments can themselves be securitized and traded.


    Defi loans are generally backed by collateral in the form of digital assets. Because
    loans are secured with assets held in smart contracts, there is no need for credit
    checks or other borrower-specific evaluation before a loan. To buffer against
    price fluctuations, loans are generally overcollateralized, meaning the borrower
    must supply collateral greater than the value of the loan amount. As with asset-backed
    stablecoins, if the collateral value falls below a specified loan value ratio,
    the position is automatically liquidated to pay back the debt. A percentage of
    interest paid by borrowers is typically allocated to a reserve pool to repay lenders
    when a liquidation fails to cover the loan''s value (known as a failed liquidation).
    This requirement means that loans are generally used for leveraged trading or
    accessing new assets.


    ## DERIVATIVES


    Derivatives increase the sophistication of financial transactions beyond lending,
    creating both valuable market opportunities and new risks. A derivative may be
    based on the current or future value of a stock, commodity, or digital asset;
    the cash flow of a business (creating a crowdfunding relationship); or a real-world
    event, such as the outcome of a sporting event or the weather (creating a prediction
    market).


    To purchase or sell futures or options contracts, derivatives traders depend on
    a futures commission merchant and other middlemen in centralized finance. They
    also accept money or other assets from customers to support such orders. Traders
    send their orders to their clearing member companies, who subsequently carry out
    the transaction on their behalf. The clearinghouse serves as a go-between for
    the two clearing firms, taking on the legal counterparty risk of the transaction.
    It handles all aspects of the transaction, including clearing, securing, and settling.


    Defi derivatives services connect buyers and sellers directly, backed by incentivized
    collateral pools and the other major Defi categories. Some allow users to buy
    and sell synthetic exposure to digital assets without actually holding them. The
    derivatives can be associated with leverage, magnifying gains, and losses, or
    inversely connected with the asset price, providing the equivalent of short exposure.
    Other applications involve prediction markets where users can bet on the outcome
    of future events, generating information collectively through the "wisdom of crowds."


    ## INSURANCE


    Risk is essential to finance and is correlated positively over time with returns.
    However, investors and others will often prefer to pay a definite but small amount
    to avoid the possibility of a larger loss. Others will benefit by taking on the
    part of those risks in exchange for a fee. A centralized insurance carrier balances
    premiums collected against investments made to maintain enough capital reserves
    for claims, as well as the risk assessment, underwriting, and claims administration
    that go along with it. While Defi derivatives may be used to insure against financial
    defaults, Defi insurance services primarily focus on the Defi-specific risks presented
    by smart contract failures, successful Defi protocol hacks, game-theoretical hazards
    of incentive systems, and other failures.


    Defi insurance pools are collateralized with digital assets that provide capital
    via unique protocols in exchange for tokens that provide a portion of premiums.
    These funds compensate premium-paying customers in the case of a hack or other
    failure. Claim assessors vote on whether claims are paid, and claim payments are
    usually enforced via token-based economic incentives. Capital providers or holders
    of governance tokens often benefit from surplus and investment returns.


    ## ASSET MANAGEMENT


    Investors entrust their portfolio management and allocation to asset managers.
    In traditional finance, an investment manager would put together a regulated product
    like a mutual fund, exchange-traded fund, separately managed account, or private
    equity stake. Asset allocations are created by wealth managers and delivered to
    customers via financial advisers and brokers. Robo-advisors provide automated
    financial services with minimal to no human intervention or oversight.


    In Defi, the underlying investments can be composed of tokens, digital assets
    capturing traditional exposure, synthetic structured tokens, and interest-bearing
    accounts. Defi asset management protocols combine them through smart contracts
    into “vaults” or “pools,” which function as a diversified portfolio of digital
    assets. The boundaries between asset classes and package types and typical business
    models for these services are still developing.


    ## LENDING AND BORROWING


    Traditional financial systems demand that customers have bank accounts to access
    their services, which 1.7 billion individuals presently lack. Borrowing from banks
    is subject to additional conditions, such as having a high credit score and adequate
    collateral to convince banks that you are creditworthy and capable of repaying
    a loan.


    This barrier is removed with decentralized lending and borrowing, allowing anybody
    to utilize their digital assets as collateral to receive loans. Contributing to
    lending pools and earning interest on these assets may help you earn a return
    on your assets while also allowing you to participate in the lending market. There
    is no need for a bank account or a credit check with decentralized lending and
    borrowing.


    ## LOTTERY


    As Defi evolves, innovative and disruptive financial apps will emerge, democratizing
    access and eliminating middlemen. Adding a Defi twist to lotteries allows the
    pooled money to be transferred to a smart contract on the Ethereum Blockchain.


    DeFi''s modularity allows you to connect a basic lottery Dapp to another Defi
    Dapp to build something more valuable. One of the Defi Dapps we''ll look at in
    this book enables players to pool their money. The pooled funds are then invested
    in a Defi lending Dapp, with the interest gained being distributed to a random
    winner at regular intervals. After the winner is chosen, all lottery ticket buyers
    get a refund, ensuring that no one loses money.


    ## PAYMENTS'
