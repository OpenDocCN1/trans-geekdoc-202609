  fmt: '

    Competing in this space is exceedingly difficult given the complexity of trading
    infrastructure required; the creation of trading bots and improvement in latency
    technologies has minimized any potential for average traders to gain an edge.
    Further, gas-based arbitrage has contributed to congestion on the Ethereum network
    and increased costs significantly.


    ## YIELD ARBITRAGE


    Yield arb strategies are focused on benefitting from price discrepancies across
    different lend/borrow products. Today, all lend/borrow products require collateral-based
    loan structures as unsecured credit extension is essentially non-existent. Suppose
    the `Supply APR` (i.e., the investor lending to the pool) is greater than the
    `Borrow APR` (i.e., the investor takes out an overcollateralized loan). In that
    case, a trader can borrow against their assets and capture an interest rate spread.


    The investor will need to ensure that the lock-up periods are aligned as not to
    cause a liquidity mismatch between assets and liabilities. The spread between
    the lend/borrow rates has traditionally ranged between -5% to about +10%. Understanding
    the interest rate calculation is critical as variable interest rate products can
    impair returns.


    This strategy could be performed on the same platform, across Defi platforms,
    or even across centralized finance (CeFi) platforms. Furthermore, investors could
    take staking risk between two different tokens; for example, swap `XTZ` tokens
    for `DOT` tokens to try and capture an APY spread.


    ## Arbitrage: Key Risk Factors


    ### Liquidity Risk

    While the markets have grown substantially over the last few years, they still
    pale compared to traditional markets such as stocks and bonds. Supply/demand imbalances
    may persist and upset any trading strategy.


    ### Lock Up risk

    When merging different platforms or protocols, it is important to understand lock-up
    periods for each type of smart contract you are interacting with. Staked assets,
    for example, will mandate a holding period to earn rewards.


    ### Basis Risk

    Swapping in between assets carries beta risk pertaining to the underlying token.
    If you swap `DASH` and the same amount of `XTZ` for an APY play, you risk not
    being able to return your principle if one asset gains more than the other.


    For example, say, an investor swaps $100 in `DASH`, earning 5% for $100 in `XTZ`,
    earning 7% to capture a 2% yield differential. If `DASH` appreciates versus `XTZ`,
    the investor may end up executing the trade at a loss.


    Assume at maturity of the contract that the same number of `DASH` units is valued
    at $120 (up from $100), and `XTZ` is valued at $90 (down from $100). The investor
    will have to make up for the $30 gap between the two assets at inception.


    Further, because the `XTZ` staking was token-based, the value of the staked rewards
    would not be as valuable as the `DASH` units received (all in terms of a dollar).
    The investor would only benefit if `XTZ` grew in value relative to `DASH` or if
    values remained equal over the borrowing period.


    Investors with a particular position in direction of the two assets may speculate
    on the differential between the two assets, also benefitting from the net interest
    margin received. As a general rule of thumb, ensure you know what your obligations
    are denominated in vs. what your assets are denominated in.


    ## 3. INSURANCE


    Defi platforms have manifested out of a desire to disrupt intermediaries in financial
    services. In doing so, the elimination/reduction in counterparty risk has led
    to a substantial increase in ‘software risk.’ Given the nascence of the market
    and lack of audit history, there are numerous blind spots in the industry''s future
    growth. Decentralized insurance has emerged as a potential solution; however,
    the depth of liquidity and clarity on payout logistics remains uncertain.


    The Nexus Mutual, for example, has created a marketplace for coverage against
    smart contract failures. Individuals can buy `NXM` tokens to provide liquidity
    to the platform or obtain insurance against their Defi exposures. The amount of
    insurance that the platform can provide is equal to the value of total liquidity
    locked in smart contracts (most denominated in `ETH` today). From there, an algorithm
    determines the optimal pricing and amount of coverage that could be sold. These
    policies can be priced according to supply/demand imbalances, claims frequency,
    type of platform, etc.


    Essentially, Nexus Mutual is creating a marketplace for Defi-focused insurance
    products that will enable the next generation to better price risk in a decentralized
    manner. As of Feb. 8, 2021, coverage on the Nexus Mutual platform stands at $738.7
    million, and total premiums paid equals to $13.2 million. The most interesting
    piece of the puzzle relates to claims assessment and repayment.


    Nexus Mutual has created a “crowd-sourced” model that seeks to incentivize good
    behavior through token incentivization. Another key risk factor relates to oracle
    stability related to claims/risk assessment and payout mechanisms.


    ## Seventeen


    This chapter outlines the main areas in which Defi may interact with policy and
    regulation. Importantly, it lays out key issues and options but does not offer
    prescriptive solutions, as jurisdictions vary in their objectives, regulatory
    regimes, and market composition. The approaches described here are intended to
    be sufficiently generic to apply in the full range of contexts. The remainder
    of this section provides tools and resources.


    Trust-minimized execution, non-custodial services, and composable architectures
    may challenge the existing regulation. Defi can both introduce new risks and may
    help mitigate known risks in financial services. Many of the key challenges for
    policy-makers – how decentralization makes it difficult to identify regulatory
    subjects, new risks due to automation, and how borderless software code complicates
    the application of territorial rules – are extensions of issues for all digital
    assets. Others, such as the creation of building blocks with multiple potential
    use cases and integrations, or the incentive structures of tokenized governance,
    are less familiar. Given the cross-cutting nature of Defi, an integrated strategy
    and vision is needed.


    Generally, it may be wise to consider a technologically neutral approach to balance
    meeting the objectives of regulatory regimes with promoting innovation and market
    development. As with any regulatory initiatives, policy-makers should strive for
    Defi rules that are fair, efficient, effective, and enforceable.


    ## Defi and financial regulation


    The first stage is to determine the appropriate goals and associated policy and
    regulatory categories. Common goals for financial regulation include protection
    of investors and other consumers; market efficiency and integrity; capital formation;
    financial inclusion; prevention of illicit activity; safety and soundness; and
    financial stability. Each provides a distinctive logic for certain kinds of rules.
    For example, regulators focused on investor protection are typically concerned
    that custodians cannot abscond with funds. The noncustodial nature of Defi may
    alleviate some of these worries while creating new ones.


    Defi activity spans many domains of financial regulation, including securities,
    derivatives, exchanges, investment management, bank supervision, financial crime,
    consumer finance, insurance, risk management, and macroprudential oversight. A
    coherent overarching strategy is important and could be delegated to a cross entity
    task force or similar body. Some Defi activity patterns will match established
    legal categories; others will not.


    Existing regulations, retrofitted regulations, and new, bespoke regulations are
    likely to be used in an effective regulatory response to Defi. The European Union''s
    comprehensive Markets in Crypto Assets (MiCA) proposal is part of a developing
    body of digital asset-specific law. However, most jurisdictions are yet to adopt
    bespoke frameworks.

