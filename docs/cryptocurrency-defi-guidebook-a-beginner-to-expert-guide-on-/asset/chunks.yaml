    about to hit the market, attackers can nullify, modify, or even manipulate transactions
    to their benefit. Platforms have implemented policies to mitigate this risk by
    establishing policies such as FIFO, third-party signers, randomized mining, and
    transaction chaining to mitigate risks with front-running.


