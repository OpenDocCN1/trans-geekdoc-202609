- raw: "Custodial vs. Non-Custodial Wallets Wallets are classified into two types:\
    \ custodial and non-custodial. Custodial wallets are wallets in which third parties\
    \ store and manage your cryptocurrencies on your behalf. Non-custodial wallets\
    \ give you complete control and ownership of your cryptocurrencies. This is similar\
    \ to the mantra advocated by many in the blockchain industry to \"be your bank.\"\
    \n\nBy using a custodial wallet, you are putting your trust in an outside party\
    \ to keep your coins safe. This is handy since you don't have to worry about private\
    \ key security; instead, much as with an email account, you just have to worry\
    \ about account credentials security. However, entrusting your cryptocurrencies\
    \ to a third party exposes you to the risk of the custodian losing your cryptocurrencies\
    \ due to mismanagement or hacking. Custodial wallets have been known to lose their\
    \ cryptocurrencies in the past; notably, Mt. Gox being the most prominent example,\
    \ losing over 850,000 bitcoin worth over $450 million in 2014.\n\nBy using a non-custodial\
    \ wallet, you are relying solely on yourself to ensure the safety of your cryptocurrencies.\
    \ However, by using a non-custodial wallet, you shift the burden of security to\
    \ yourself, and you must be fully prepared to safely store your private keys.\
    \ You will lose access to your cryptocurrencies if you lose your private keys.\n\
    \n**Which Wallet Should I Use?**\n\nThere are numerous cryptocurrency wallets\
    \ available on the market. For the sake of this book, we'll go through two Defi-friendly\
    \ wallets that will help you get started with the Ethereum network fast.\n\nArgent\
    \ Wallet for Mobile Users Argent wallet is an option for mobile users. Argent\
    \ is a non-custodial wallet that provides ease of use and high security, which\
    \ does not always go hand in hand. It accomplishes this by using Argent Guardians,\
    \ which are people, devices, or third-party services that can verify your identity.\n\
    \nExamples include family and friends who use Argent, other hardware or Metamask\
    \ wallets, and two-factor authentication services. Argent is reconsidering the\
    \ need for paper-based seed phrase backups when recovering accounts by utilizing\
    \ this limited circle of trust network.\n\nIf you believe your wallet has been\
    \ compromised, Argent Guardians allow you to lock it and instantly freeze all\
    \ funds. Your wallet will be unlocked automatically after five days unless you\
    \ request that your Argent Guardian unlock it sooner.\n\nYou may also enhance\
    \ the security of your wallet by adding additional security features, such as\
    \ a daily transaction limit. This is useful in preventing hackers from withdrawing\
    \ funds from your Argent wallet if they gain access to it. When your daily transaction\
    \ limit is reached, you will be notified, and any transactions that exceed the\
    \ limit will be delayed for more than 24 hours. You can, of course, use your Argent\
    \ Guardians to authorize legitimate large transactions that exceed the limit.\n\
    \nArgent provides free transactions to wallet users and absorbs all Ethereum gas\
    \ fees owed to the network. Argent wallet allows you to interact with Defi Dapps\
    \ directly from the wallet, eliminating the need for another app or device.\n\n\
    **Desktop Users: Metamask**\n\nMetamask is a web browser extension available on\
    \ the Chrome, Firefox, Opera, and Brave browsers. Metamask, like Argent, is a\
    \ non-custodial wallet that serves as both a wallet and an interaction bridge\
    \ for the Ethereum network.\n\nMetamask allows you to store Ethereum and ERC20\
    \ tokens. Metamask, which acts as an interaction bridge, allows you to use all\
    \ Decentralized Applications (Dapps) hosted on the Ethereum Network.\n\nWithout\
    \ using an interaction bridge, such as MetaMask, your browser won’t be able to\
    \ access the Ethereum blockchain except you were operating a complete Ethereum\
    \ node and possessed the whole Ethereum blockchain, which is over 400GB in size,\
    \ downloaded on your computer. On a technical level, MetaMask accomplishes this\
    \ by injecting a javascript library known as web3.js written by core Ethereum\
    \ developers into the page of your browser, allowing you to easily interact with\
    \ the Ethereum network.\n\nMetamask simplifies interaction with Defi Dapps on\
    \ the Ethereum network on your laptop or PC. They are secure because you must\
    \ sign each interaction and transaction you perform on the network. However, to\
    \ keep your Metamask safe and secure, you must take care. Anyone who has your\
    \ password or seed phrase (a secret phrase you were given when you signed up for\
    \ your wallet) will have complete control of your wallet.\n\nNine \n\nCryptocurrency\
    \ prices are extremely volatile. Stablecoins, linked to other stable assets like\
    \ the US dollar, were designed to reduce volatility. Stablecoins were created\
    \ to be a reliable medium of exchange and to help users hedge against price volatility.\
    \ Stablecoins have quickly evolved into a significant component of Defi, which\
    \ is critical to this modular ecosystem.\n\nIn this chapter, we will look at USD-pegged\
    \ stablecoins. Stablecoins are not all the same because they use different mechanisms\
    \ to maintain their peg to the USD. There are two kinds of pegs: fiat-collateralized\
    \ pegs and crypto-collateralized pegs. To keep their USD peg, most stablecoins\
    \ use a fiat-collateralized system.\n\nTo demonstrate the differences in pegging\
    \ management, we will look at two USD stablecoins, Tether (USDT) and Dai (DAI).\n\
    \nTether (USDT) has a one-dollar reserve for each Tether token produced. With\
    \ daily trade volumes reaching over $30 billion in January 2020, Tether is the\
    \ biggest and most frequently utilized USD stablecoin. Tether reserves are held\
    \ in financial institutions, and users must trust Tether as an entity to have\
    \ the reserve amounts they claim. Tether is a centralized, fiat-collateralized\
    \ stablecoin as a consequence.\n\nOn the other side, Dai (DAI) is backed by cryptocurrencies\
    \ like Ethereum (ETH). Its value is fixed at $1, thanks to protocols approved\
    \ by a decentralized autonomous organization and smart contracts. Users can easily\
    \ validate the collateral used to generate DAI at any time. DAI is a crypto-collateralized\
    \ decentralized stablecoin.\n\nTether has an estimated 80% market share of the\
    \ stablecoin market, based on the market capitalization of the top five stablecoins.\
    \ Although DAI's market share is only about 3%, its trading volume is growing\
    \ at a much faster rate. Since the beginning of January 2020, DAI's trading volume\
    \ has increased by over 4,000 percent, compared to Tether's growth of 126 percent.\n\
    \nIn the Defi ecosystem, DAI is the most commonly utilized native stablecoin.\
    \ For Defi trading, lending, and other uses, it is the chosen USD stablecoin.\
    \ To better understand DAI, we will introduce you to its platform, Maker.\n\n\
    ## MAKER\n\nMaker is a smart-contract platform built on Ethereum that includes\
    \ three tokens: the Sai and Dai stablecoins (both algorithmically tied to $1)\
    \ and Maker, the network's governance token (MKR).\n\nSai (SAI), also known as\
    \ Single Collateral Dai, is a cryptocurrency backed solely by Ether (ETH) as collateral.\n\
    \nDai (DAI), also known as Multi-Collateral Dai, was introduced in November 2019.\
    \ It is currently collateralized by Ether (ETH) and Basic Attention Token (BAT),\
    \ with plans to add other assets in the future.\n\nMaker (MKR) is the governance\
    \ token for Maker, and it can be used to vote on platform changes via the Maker\
    \ Improvement Proposals. Maker is what is known as a Decentralized Autonomous\
    \ Organization (DAO). We will investigate this further under the governance section.\n\
    \n**What Is the Difference Between Sai and Dai?**\n\nMaker debuted on December\
    \ 19, 2017, with Single Collateral Dai. It was issued with only Ether (ETH) as\
    \ collateral. On November 18, 2019, Maker announced the introduction of the new\
    \ Multi-Collateral Dai, which can be minted with either Ether (ETH) or Basic Attention\
    \ Token (BAT) as collateral, with plans to support additional cryptocurrencies\
    \ in the future."
