    \ Market Maker Mechanism**\n\nThe Automated Market Maker (AMM) algorithm is used\
    \ to calculate the prices of assets in the pool. AMM operates by keeping a Constant\
    \ Product dependent on the quantity of liquidity on both sides of the pool.\n\n\
    Let's keep the ETH-DAI liquidity pool example going, with 100 ETH and 20,000 DAI.\
    \ Uniswap will combine each of these numbers to calculate the Constant Product.\n\
    \nETH liquidity (x) \\* DAI liquidity (y) = Constant Product (k)\n\n100 \\* 20,000\
    \ = 2,000,000\n\nUsing AMM, the Constant Product (k) must always be 2,000,000\
    \ at any given time. When someone buys ETH using DAI, ETH is taken from the liquidity\
    \ pool, and DAI is added.\n\nThis ETH's price will be determined asymptotically.\
    \ The higher the premium charged, the larger the order. The term \"premium\" refers\
    \ to the increased amount of DAI necessary to purchase 1 ETH over the original\
    \ price of 200 DAI per ETH.\n\n**How can I add a token to Uniswap?**\n\nUniswap\
    \ is a decentralized exchange; thus, unlike centralized exchanges, it does not\
    \ have a staff or gatekeepers to evaluate and select which currencies to provide.\
    \ Instead, any ERC-20 token can be listed and traded on Uniswap by anyone as long\
    \ as liquidity exists for the particular pair. All a user needs to do is engage\
    \ with the platform to register the new token, and a new market for this token\
    \ will be created.\n\n## DYDX\n\ndYdX is a decentralized exchange system that\
    \ facilitates lending, borrowing, and margin/leveraged trading. It currently supports\
