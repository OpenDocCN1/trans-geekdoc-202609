- raw: "Interest rates in Compound are expressed in Annual Percentage Yield (APY)\
    \ and vary depending on the asset. Compound calculates interest rates for various\
    \ assets using algorithms that consider the asset's supply and demand.\n\nCompound\
    \ reduces lending/borrowing friction by allowing suppliers/borrowers to interact\
    \ directly with the interest rate protocol without negotiating loan terms (e.g.,\
    \ maturity, interest rate, counterparty, collaterals), resulting in a more efficient\
    \ money market.\n\n***What is the amount of interest you will receive or pay?***\n\
    \nThe Annual Percentage Yield (APY) varies by asset because it is determined algorithmically\
    \ based on supply and demand. The greater the demand for borrowing, the higher\
    \ the annual percentage yield (APY), and vice versa.\n\nA lender would earn 7.58\
    \ percent (as of February 2020) on the DAI stablecoin, while a borrower would\
    \ pay 8.00 percent interest after a year.\n\n***Is it necessary for me to create\
    \ an account to use Compound?***\n\nYou do not need to establish an account, which\
    \ is one of the advantages of Decentralized Finance apps! Users of the compound\
    \ don’t need to register for anything, unlike conventional financial apps, which\
    \ need users to go through long registration procedures to get started.\n\nCompound\
    \ may be used straight immediately by anybody with a compatible cryptocurrency\
    \ wallet, such as Argent or Metamask.\n\n**Begin earning interest on Compound**\n\
    \nTo earn interest, you must provide assets to the protocol. Compound accepted\
    \ seven different types of tokens as of February 2020.\n\nOnce you've deposited\
    \ your asset into Compound, you'll start earning interest on it right away! Interest\
    \ is calculated after each Ethereum block (on average 13 seconds) and is calculated\
    \ on the amount you have supplied.\n\nYou will receive corresponding amounts of\
    \ cTokens upon deposit. If you supply DAI, you will be rewarded with cDAI; if\
    \ you supply Ether, you will be rewarded with cETH, and so on). Interest is not\
    \ immediately distributed to you; rather, it accrues on the cTokens that you now\
    \ own and are redeemable for the underlying asset and interest it represents.\n\
    \n## cTokens?\n\ncTokens represent your protocol balance and accrue interest over\
    \ time. Interest earned in Compound is not distributed immediately but rather\
    \ accumulates in cTokens. Let's take a look at an example. Assume you supplied\
    \ 1,000 DAI on January 1, 2019, and the APY has remained constant at 10.00 percent\
    \ throughout 2019.\n\nAfter depositing 1,000 DAI, you will be given 1,000 cDAI\
    \ on January 1, 2019. The exchange rate between DAI and cDAI, in this case, is\
    \ 1:1.\n\nAfter one year, your 1,000 cDAI will be worth 10% more on January 1,\
    \ 2020. DAI and cDAI now have a 1:1.1 exchange rate. Your 1,000 cDAI is now worth\
    \ 1,100 DAI.\n\nTo account for accrued interest, cTokens become convertible into\
    \ an increasing amount of the underlying asset they represent over time. Because\
    \ cTokens are ERC-20 tokens, you can easily transfer \"ownership\" of supplied\
    \ assets if someone wants to take over your role as a supplier.\n\n**Begin borrowing\
    \ on Compound**\n\nFirst, you must enter assets into the system as collateral\
    \ for your loan. Every asset has a unique collateral factor. The more assets you\
    \ provide, the more borrowing power you have.\n\nBorrowed assets are delivered\
    \ directly to your Ethereum wallet, where you can use them like any other crypto\
    \ assets—however, you want! Please remember that borrowing incurs a small fee\
    \ of 0.025 percent to prevent spam and misuse of the Compound protocol.\n\n**Price\
    \ movement of collateral asset**\n\nIf you're thinking about putting up collateral\
    \ to get a loan, you might be wondering what happens if the collateral's value\
    \ changes. Let's take a look:\n\n**1. Collateral value rises**\n\nIf the value\
    \ of the item you used as collateral increases, your collateral ratio increases\
    \ as well, which is great - nothing will happen, and you may take out a bigger\
    \ loan if you want to.\n\n**2. Collateral value decreases**\n\nOn the other hand,\
    \ if the collateral value decreases to the point where your collateral ratio is\
    \ now less than the required collateral ratio, your collateral will be partially\
    \ sold off, along with a 5% liquidation fee. Liquidation is the process of selling\
    \ off your collateral to achieve the minimum collateral ratio.\n\n**Liquidation**\n\
    \nWhen the value of the collateral supplied is less than the amount borrowed,\
    \ liquidation happens. This is done to ensure that excess liquidity is always\
    \ available for withdrawal and borrowing of funds while also protecting lenders\
    \ from default risk. The current liquidation fee is 5%.\n\nEleven \n\nWhile Centralized\
    \ Exchanges (CEXs) enable massive deals with plenty of liquidity, there are still\
    \ many hazards because users do not own their assets in exchanges. Over $290 million\
    \ in cryptocurrency were stolen in 2019, and over 500,000 login credentials were\
    \ exposed from exchanges.\n\nAs more people become aware of these dangers, they\
    \ are turning to Decentralized Exchanges (DEXs). DEXs operate by reducing or eliminating\
    \ the need for an intermediary through the use of smart contracts and on-chain\
    \ transactions. Projects such as Kyber Network, Uniswap, Dex Blue, and dYdX are\
    \ examples of popular Decentralized Exchanges.\n\nDEXs are classified into two\
    \ types: order book-based DEXs and liquidity pool-based DEXs. Order book DEXs,\
    \ such as dYdX and dex.blue, function similarly to CEXs in that users can place\
    \ buy and sell orders at their desired limit prices or market prices. The key\
    \ distinction between the two is that assets for trading on CEXs are held on the\
    \ exchange wallet, but assets for trade on DEXs can be held on users' wallets.\n\
    \nLiquidity is one of the most significant issues that order book-based DEXs face.\
    \ Users may have to wait a long period for their orders in the order book to be\
    \ filled. DEXs based on liquidity pools were proposed to address this issue. Liquidity\
    \ pools are essentially token reserves in smart contracts, and users can purchase\
