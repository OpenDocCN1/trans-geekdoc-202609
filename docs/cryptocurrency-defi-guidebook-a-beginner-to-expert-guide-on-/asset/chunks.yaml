    Regulation happens later in the life cycle of a product or service when the damages
    that trigger responsibility or regulatory action are more likely to occur when
    there is no inherent unique risk.


    Given the modest size and creative possibilities of emerging technologies, regulators
    are more inclined to take a “no harm” approach early on. The business is highly
    regulated, and all phases are closely monitored and controlled for goods with
    clearly recognized hazards or misuses, such as poppy flowers and weapons. The
    majority of technological systems lie somewhere in the center.


    In addition to maturing, Defi services have the potential to become more decentralized
    across their life cycle. The degree of decentralization is also an important consideration
    for policy-makers and regulators. Rules to address the potential dangers of Defi
    services can be adopted at four stages of the life cycle: (1) development; (2)
    publication; (3) deployment; and (4) operation.


    There will typically be an identifiable group of protocol developers (although
    it might operate under the umbrella of an open-source development community, non-profit
    foundation or association, or the `DAO`). Once the protocol is published, multiple
    teams might develop it into services and market it to users, representing a combined
    deployment stage. Different teams might later fork those services. The protocol
    and smart contracts will largely automate the operation of the service, perhaps
    moderated by decentralized governance processes.


    Imposing regulatory requirements may be simpler earlier in the life cycle when
    access points are more obvious and have greater opportunities to influence the
    long-term trajectory. However, the earlier in the life cycle, the weaker the nexus
    to actual demonstrable harm and the greater the potential implications for innovation
    – so it is important to determine at what point regulatory involvement is proportionate
    to the risks. Sandboxes, safe harbors, and no-action letters, for example, may
    be useful tools for resolving this issue rather than mandating action at an early
    stage.


    **REMEMBER**: This toolkit is designed as a starting point for policy-makers seeking
    to understand the risks and opportunities posed by Defi businesses and services
    and devise the best policy responses.


    The particular manifestations of Defi and their policy questions will change over
    time, as will activity levels and other aspects of the larger blockchain and digital
    asset world. Policy-makers and regulators will take different approaches based
    on the unique context of their jurisdictions. Larger shifts in financial regulatory
    obligations, or implementation of cross-national standards, may alter the context
    for consideration of Defi issues. There were no decentralized digital currency
    assets before 2009 and no general-purpose smart contract platforms before 2015,
    so any recommendations about the proper treatment of an offshoot such as Defi
    must consider potential and unpredictable developments in a rapidly evolving space.


    What is apparent is that Defi is a unique and possibly important development,
    both within the blockchain and financial services landscapes in general. As this
    report has documented, Defi presents a host of opportunities and many challenges.
    Even when there are no clear answers, policy-makers are best served by considering
    the right questions to ask, appreciating the points of interaction and tension
    with their regulatory regimes, and estimating the costs and advantages of different
    courses of action.


    ## Eighteen


    Before we proceed, let''s take a brief look at some of the things Defi enables
    us to do:


    *   **Transparency**: A financial environment that is transparent and auditable.

    *   **Accessibility**: Unrestricted access to Defi apps without fear of discrimination
    based on race, gender, beliefs, nationality, or geographic location.

    *   **Efficient**: Programmable money allows for the elimination of centralized
    middlemen, resulting in a more economical and efficient financial market.

    *   **Convenience**: For a modest price and with little waiting time, money may
    now be transmitted anywhere, at any time, and to anybody who has access to a cryptocurrency
    wallet.


    All of those mentioned above have enabled users to accomplish the following: supply
    liquidity to earn yields on unproductive assets with no maturation/lock-in period,
    obtain loans (with collateral) without paperwork and repay them whenever they
    want, and quickly execute automated trading methods. The best part is that all
    of the above may be accessible by anybody, anywhere, anytime, as long as they
    have Internet connectivity. That is the power of Defi in terms of accessibility,
    and we are only at the beginning of this adventure.


    According to the blockchain platform Dune Analytics statistics, the number of
    Defi users climbed from 93,000 in January 2020 to 1.8 million in April 2021. The
    market''s valuation climbed from $700 million to $58 billion during the same period.
    Despite emerging to the surface during a stock market meltdown and a pandemic,
    decentralized finance became the industry''s next big thing. Defi transcended
    its niche status and completely dispelled the worry of becoming another `ICO`-like
    phenomenon. Furthermore, its vicious performance was frightening enough to frighten
    crypto''s centralized exchanges, which have lost a major portion of liquidity
    to `DEXs`.


    DeFi''s disruptive potential is undeniable. A new decentralized future is upon
    us, which should come as no surprise in the blockchain sector. However, there
    are other challenges that must be addressed before we can achieve widespread adoption.


    Smart contracts continue to be vulnerable to exploits, anonymous developers continue
    to act like vultures by starting rug pull initiatives, and the threat of laws
    continues to loom over our heads. For the time being, Defi is the wild west of
    crypto, and both creators and users must reach a specific degree of maturity for
    the specialized ecosystem to establish itself as a prominent and serious sector
    in this new decade.


    It will take several years to achieve a perfected and balanced state, and the
    timing will be fully dependent on the community and its conduct. In these unpredictable
    and chaotic times, it seems apparent that disruptive technologies are more likely
    than ever to enter the actual world and that this is our opportunity to make significant
    changes. The road may be long and difficult, but one thing is certain: the future
    of finance is decentralized.


    Individual users will not wish to conduct their transactions across several platforms.
    Users will mostly congregate around on-ramps (for example, exchanges) and wallets
    (e.g., `balance.io`). Because these initiatives are open-source and decentralized,
    they will be able to interface with one another to enable trade, storage of existing
    assets, insurance, and other functions within the same platform. We''re seeing
    some early variants of this, such as `Trust Wallet` interacting with `Dapps`.
    Platforms such as `Morpher.io` and `Abra` are beginning to integrate traditional
    instruments such as equities with tokens, which will play a significant role in
    allowing people in remote parts of the world to gain access to previously unattainable
    foreign assets. De-Fi platforms may, over time, reduce the complexity created
    by regulators in the goal of keeping economies walled off, allowing regular investors
    without the appropriate instruments (e.g., specialist banks) to gain access to
    commodities, exotic assets, derivatives, foreign currencies, and even equity.

