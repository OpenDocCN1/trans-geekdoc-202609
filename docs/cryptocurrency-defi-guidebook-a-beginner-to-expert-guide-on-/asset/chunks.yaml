    \ repurchase 1 ETH for $100 to pay off your debt.\n\n4.  Your total balance is\
    \ 350 DAI, and you make a profit of 50 DAI ($50).\n\nTo enter a short position\
    \ on dYdX, you do not need to own ETH. You can borrow it and enter it all in one\
    \ spot in a short position.\n\n**What exactly is leverage?**\n\nConsider two possible\
    \ leveraged position scenarios (estimated numbers) for a trader with 10 ETH ($150\
    \ per ETH) or $1500. The trader opens a 5x long position with 1 ETH ($150) in\
    \ the first scenario:\n\na. The position would be worth 5 ETH ($750).\n\nb. 10%\
    \ of the Portfolio is at risk (1/10 ETH is used).\n\nc. A 10% price movement ($15\
    \ on ETH) downwards will liquidate the trader's position, indicating very little\
    \ cushion for price spikes.\n\nIn contrast, if the trader opens a 2x long position\
    \ with 1 ETH ($150):\n\na. The position would be worth 2 ETH ($300).\n\nb. 10%\
    \ of the portfolio is at risk (1/10 ETH is used).\n\nc. A 45 percent decrease\
    \ in price ($65 on ETH) will liquidate the trader's position.\n\nLeverage is essentially\
    \ just a factor of how much risk a trader is willing to take (in terms of price\
    \ movement exposure), which defines a trader's distance to liquidation. High stakes,\
    \ high payoff!\n\n**What exactly is liquidation?**\n\nOn dYdX, once a position\
    \ falls below the collateral standard of 115 percent, any existing borrows are\
    \ judged hazardous, and dangerous positions are liquidated to safeguard lenders.\
    \ The collateral used to underpin the loans will be auctioned until zero negative\
    \ balances, plus a 5% liquidation fee.\n\n**How are profits and losses calculated?**\n\
    \nFor example, suppose you establish a 5x long with a deposit of 3 ETH and an\
    \ open price of $220. To purchase 12 more ETH, you will need to borrow $220\\\
    *12 = 2640 DAI (A total of 15 ETH locked in your position)\n\nIf you close the\
    \ position at 250, you must repay your 2640 DAI loan with = 2640/250 ETH = 10.56\
    \ ETH.\n\nThis results in a total of 15 - 10.56 = 4.44 ETH. As a result, your\
    \ profit would be 4.44-3 = 1.44 ETH.\n\n**Profit calculation steps:**\n\n1.  Determine\
    \ the initial leverage and deposit amount to determine the position size (Leverage\\\
    *Deposit).\n\n2.  Loan Amount = (Deposit - Position Size) \\* Open Price\n\n3.\
    \  Loan repayment = Loan Amount / Closing Price\n\n4.  Balance = Position Size\
    \ - Loan to Repay\n\n5.  Profits = Balance - Initial Deposit\n\nTwelve \n\nA derivative\
    \ contract derives its value from another underlying asset, such as stocks, commodities,\
    \ currencies, indices, bonds, or interest rates. Futures, options, and swaps are\
    \ some examples of derivatives. Each sort of derivative serves a particular purpose,\
    \ and investors buy and sell them for various reasons.\n\nInvestors trade derivatives\
    \ for various purposes, including hedging against the underlying asset's volatility,\
    \ speculating on the directional movement of the underlying asset and leveraging\
    \ their holdings. Derivatives are extremely dangerous, and trading them requires\
    \ extensive financial expertise and methods."
