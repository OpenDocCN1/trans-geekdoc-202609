- raw: "The existing banking system is plagued by friction, inaccessibility, and regulatory\
    \ uncertainty, to name a few key problems. Unfortunately, not everyone in today's\
    \ financial system has access to banking, making it impossible for the unbanked\
    \ to compete on an equal footing.\n\nThe Defi movement aims to close these gaps\
    \ and make finance available to everyone without censorship. In short, Defi opens\
    \ up a world of possibilities by allowing users to access various financial instruments\
    \ regardless of race, religion, age, nationality, or geography.\n\nWhen comparing\
    \ traditional and decentralized financial products, there will be advantages and\
    \ disadvantages on both sides. In this book, we'll take you through the ideas\
    \ and potential of decentralized finance so you can put them to work solving real-world\
    \ issues.\n\nTwo \n\nDecentralized finance (Defi) is a popular blockchain-based\
    \ financial infrastructure. In general, the word refers to a protocol stack that\
    \ is open, permissionless, and highly interoperable and is based on public smart\
    \ contract platforms such as the Ethereum blockchain. It's a more open and transparent\
    \ version of present financial services. Defi isn't dependent on middlemen or\
    \ centralized organizations in particular. Instead, open protocols and decentralized\
    \ apps are used (DApps). Code enforces agreements, safe and verifiable transactions\
    \ are performed, and approved state changes are recorded on a public blockchain.\n\
    \nAs a result, this architecture has the ability to generate an unalterable and\
    \ highly interoperable financial system with unparalleled clarity, equal access\
    \ rights, and minimal need for custodians, central clearinghouses, or escrow services,\
    \ as \"smart contracts\" can handle the majority of these functions. For example,\
    \ one can buy USD-pegged assets (so-called stablecoins) on decentralized exchanges.\n\
    \nAll Defi protocols and applications are built on smart contracts. Smart contracts\
    \ are small applications that are stored on a blockchain and run concurrently\
    \ by a large number of validators. The network is built in the context of public\
    \ blockchains so that each participant can participate in and verify the accurate\
    \ execution of each action. As a consequence, as compared to conventional centralized\
    \ computing, smart contracts are relatively inefficient. Smart contracts provide\
    \ a high degree of security since they always function as stated, enabling anybody\
    \ to independently verify the state changes that result. When executed properly,\
    \ smart contracts are highly transparent and limit the possibility of manipulation\
    \ and arbitrary interference.\n\nTo understand the uniqueness of smart contracts,\
    \ we must first investigate standard server-based web apps. When a person interacts\
    \ with such an app, they cannot see the program's underlying logic. In addition,\
    \ the user has no influence over the execution environment. Either (or both) of\
    \ these could be tampered with. As a result, the user must have faith in the application\
    \ service provider. Both difficulties are addressed by smart contracts, which\
    \ ensure that an application runs as planned. The contract code is kept on the\
    \ underlying blockchain, making it publicly accessible. The contract's behavior\
    \ is deterministic, and thousands of network members process function calls (in\
    \ the form of transactions) in parallel, assuring the execution's legality. When\
    \ the execution causes state changes, such as account balance changes, the blockchain\
    \ network's consensus rules apply, and the changes are recorded in and protected\
    \ by the blockchain's state tree.\n\nBecause smart contracts have access to a\
    \ wide instruction set, they are highly customizable. They may also act as a custodian\
    \ for crypto assets, with completely customizable criteria for how, when, and\
    \ to whom they are transferred.\n\nThis paves the way for a slew of new applications\
    \ and ecosystems to emerge. For the first time, Szabo coined the term \"smart\
    \ contract.\" Szabo went on to say that many agreements might be \"hidden in the\
    \ hardware and software we interact with, in such a manner as to make a breach\
    \ of contract expensive...for the breacher,\" citing a vending machine as an example.\
    \ Buterin proposed a decentralized blockchain-based smart contract platform to\
    \ address trust issues regarding the execution environment and enable secure execution\
    \ (composability). Wood formalized the concept and implemented it under the name\
    \ Ethereum. Ethereum is the most prominent smart contract platform in terms of\
    \ market value, viable applications, and development activity despite various\
    \ competitors.\n\nDefi is still a niche industry with modest volumes, but this\
    \ is changing rapidly. The total amount of money invested in Defi-related smart\
    \ contracts has topped $10 billion. It is crucial to realize that these are not\
    \ metrics for transaction volume or market capitalization; the term \"value\"\
    \ refers to reserves held in smart contracts that may be used in various ways\
    \ as described throughout this book.\n\n## HOW DOES DEFI WORK?\n\nFrom a technical\
    \ perspective, Defi is a group of decentralized applications (dApps) primarily\
    \ running on the Ethereum smart contract ecosystem that provides blockchain-based\
    \ financial services without intermediaries. Therefore, understanding how Defi\
    \ works requires knowledge pertaining to three important topics: blockchain technology,\
    \ Ethereum, and smart contracts.\n\n**Blockchain**\n\nBlockchain technology is\
    \ the foundation for not only Defi but everything related to cryptocurrencies\
    \ as well. In short, blockchains are digital ledgers that permanently record immutable\
    \ data made out of publicly shared blocks with everyone.\n\nBitcoin, the first\
    \ blockchain network, was launched in 2009 and is a game-changing idea because\
    \ of security and scarcity.\n\n**Security**\n\nBlockchain networks like Bitcoin\
    \ utilize the Proof of Work (PoW) consensus mechanism to execute transactions.\
    \ PoW entails the employment of energy and hardware power by users known as miners\
    \ to solve difficult mathematical problems in exchange for incentives earned by\
    \ confirming blocks.\n\nA block is a collection of signed transactions submitted\
    \ by ordinary users who wish to send their money. Each transaction has a hash\
    \ that verifies its ledger chronological sequence. As a result, each block has\
    \ its hash linked to the preceding block's hash, creating a sequential chain of\
    \ blocks.\n\nIt is almost difficult to attack Bitcoin since the whole ledger (a\
    \ blockchain's transaction history) is spread in the form of copies across thousands\
    \ of nodes. To create a new consensus and agree to a different version of the\
    \ blockchain, a malevolent person would need to control more than 50% of the network's\
    \ nodes (devices operated by miners).\n\n***Scarcity***\n\nBitcoin is limited\
    \ because there is a finite number of coins available. Unlike fiat currencies,\
    \ it is impossible to manufacture and issue new coins indefinitely on the blockchain\
    \ since the restriction is built into the cryptocurrency. Only 21 million Bitcoin\
    \ will ever exist, and as more miners put coins onto the market, the circulating\
    \ supply will steadily grow.\n\nScarcity enables Bitcoin to function as a store-of-value\
    \ asset, which means it can be used as a haven or hedge in times of need, which\
    \ is why investors refer to Bitcoin as \"digital gold.\" When combined with excellent\
    \ cryptographic security, scarcity makes Bitcoin one of the best-performing investment\
    \ assets of all time.\n\n**Ethereum & Smart Contracts**\n\nEthereum and Smart\
    \ Contracts Ethereum is another cryptocurrency that adds to the usefulness of\
    \ blockchain technology by using smart contracts, which are written in the Solidity\
    \ programming language and used to build a rich dApp ecosystem with on-chain functionality\
    \ other than payments."
  fmt: 'The existing banking system is plagued by friction, inaccessibility, and regulatory
    uncertainty, to name a few key problems. Unfortunately, not everyone in today''s
    financial system has access to banking, making it impossible for the unbanked
    to compete on an equal footing.


    The Defi movement aims to close these gaps and make finance available to everyone
    without censorship. In short, Defi opens up a world of possibilities by allowing
    users to access various financial instruments regardless of race, religion, age,
    nationality, or geography.


    When comparing traditional and decentralized financial products, there will be
    advantages and disadvantages on both sides. In this book, we''ll take you through
    the ideas and potential of decentralized finance so you can put them to work solving
    real-world issues.


    ## Decentralized Finance (Defi)


    Decentralized finance (`Defi`) is a popular blockchain-based financial infrastructure.
    In general, the word refers to a protocol stack that is open, permissionless,
    and highly interoperable and is based on public smart contract platforms such
    as the `Ethereum` blockchain. It''s a more open and transparent version of present
    financial services. Defi isn''t dependent on middlemen or centralized organizations
    in particular. Instead, open protocols and decentralized apps are used (`DApps`).
    Code enforces agreements, safe and verifiable transactions are performed, and
    approved state changes are recorded on a public blockchain.


    As a result, this architecture has the ability to generate an unalterable and
    highly interoperable financial system with unparalleled clarity, equal access
    rights, and minimal need for custodians, central clearinghouses, or escrow services,
    as "smart contracts" can handle the majority of these functions. For example,
    one can buy USD-peged assets (so-called stablecoins) on decentralized exchanges.


    All Defi protocols and applications are built on smart contracts. Smart contracts
    are small applications that are stored on a blockchain and run concurrently by
    a large number of validators. The network is built in the context of public blockchains
    so that each participant can participate in and verify the accurate execution
    of each action. As a consequence, as compared to conventional centralized computing,
    smart contracts are relatively inefficient. Smart contracts provide a high degree
    of security since they always function as stated, enabling anybody to independently
    verify the state changes that result. When executed properly, smart contracts
    are highly transparent and limit the possibility of manipulation and arbitrary
    interference.


    To understand the uniqueness of smart contracts, we must first investigate standard
    server-based web apps. When a person interacts with such an app, they cannot see
    the program''s underlying logic. In addition, the user has no influence over the
    execution environment. Either (or both) of these could be tampered with. As a
    result, the user must have faith in the application service provider. Both difficulties
    are addressed by smart contracts, which ensure that an application runs as planned.
    The contract code is kept on the underlying blockchain, making it publicly accessible.
    The contract''s behavior is deterministic, and thousands of network members process
    function calls (in the form of transactions) in parallel, assuring the execution''s
    legality. When the execution causes state changes, such as account balance changes,
    the blockchain network''s consensus rules apply, and the changes are recorded
    in and protected by the blockchain''s state tree.


    Because smart contracts have access to a wide instruction set, they are highly
    customizable. They may also act as a custodian for crypto assets, with completely
    customizable criteria for how, when, and to whom they are transferred.


    This paves the way for a slew of new applications and ecosystems to emerge. For
    the first time, Szabo coined the term "smart contract." Szabo went on to say that
    many agreements might be "hidden in the hardware and software we interact with,
    in such a manner as to make a breach of contract expensive...for the breacher,"
    citing a vending machine as an example. Buterin proposed a decentralized blockchain-based
    smart contract platform to address trust issues regarding the execution environment
    and enable secure execution (composability). Wood formalized the concept and implemented
    it under the name `Ethereum`. `Ethereum` is the most prominent smart contract
    platform in terms of market value, viable applications, and development activity
    despite various competitors.


    Defi is still a niche industry with modest volumes, but this is changing rapidly.
    The total amount of money invested in Defi-related smart contracts has topped
    $10 billion. It is crucial to realize that these are not metrics for transaction
    volume or market capitalization; the term "value" refers to reserves held in smart
    contracts that may be used in various ways as described throughout this book.


    ## HOW DOES DEFI WORK?


    From a technical perspective, Defi is a group of decentralized applications (`dApps`)
    primarily running on the `Ethereum` smart contract ecosystem that provides blockchain-based
    financial services without intermediaries. Therefore, understanding how Defi works
    requires knowledge pertaining to three important topics: blockchain technology,
    `Ethereum`, and smart contracts.


    ### Blockchain


    Blockchain technology is the foundation for not only Defi but everything related
    to cryptocurrencies as well. In short, blockchains are digital ledgers that permanently
    record immutable data made out of publicly shared blocks. Bitcoin, the first blockchain
    network, was launched in 2009 and is a game-changing idea because of security
    and scarcity.


    ### Security


    Blockchain networks like `Bitcoin` utilize the Proof of Work (`PoW`) consensus
    mechanism to execute transactions. `PoW` entails the employment of energy and
    hardware power by users known as miners to solve difficult mathematical problems
    in exchange for incentives earned by confirming blocks. A block is a collection
    of signed transactions submitted by ordinary users who wish to send their money.
    Each transaction has a hash that verifies its ledger chronological sequence. As
    a result, each block has its hash linked to the preceding block''s hash, creating
    a sequential chain of blocks.


    It is almost difficult to attack Bitcoin since the whole ledger (a blockchain''s
    transaction history) is spread in the form of copies across thousands of nodes.
    To create a new consensus and agree to a different version of the blockchain,
    a malevolent person would need to control more than 50% of the network''s nodes.


    ### Scarcity


    Bitcoin is limited because there is a finite number of coins available. Unlike
    fiat currencies, it is impossible to manufacture and issue new coins indefinitely
    on the blockchain since the restriction is built into the cryptocurrency. Only
    21 million Bitcoin will ever exist, and as more miners put coins onto the market,
    the circulating supply will steadily grow.


    Scarcity enables Bitcoin to function as a store-of-value asset, which means it
    can be used as a haven or hedge in times of need, which is why investors refer
    to Bitcoin as "digital gold."


    ### Ethereum & Smart Contracts


    `Ethereum` is another cryptocurrency that adds to the usefulness of blockchain
    technology by using smart contracts, which are written in the `Solidity` programming
    language and used to build a rich dApp ecosystem with on-chain functionality other
    than payments.'
  trans: '

    现有的银行系统深受摩擦、准入受限以及监管不确定性等关键问题的困扰。遗憾的是，当今金融体系中的并非所有人都能获得银行服务，这使得没有银行账户的人无法平等竞争。


    Defi（去中心化金融）运动旨在消除这些差距，让每个人都能不受审查地获得金融服务。简而言之，Defi 通过允许用户无论种族、宗教、年龄、国或地理访问各种金融工具，开启了一个充满可能的世界。


    在比较传统金融和去中心化金融产品时，双方都有优缺点。在书中我们将带你了解去中心化金融的理念和潜力，以便你利用它们来解决现实世界的问题。


    ## 去中心化金融 (Defi)


    去中心化金融（`Defi`）是一种流行的基于区块链的金融基础设施。通常，这个词指的是一个开放、无许可且高度可操作的协议栈，它基于 `Ethereum` 区块链等公共智能合约平台。它是目前金融服务的更开放、更透明的版本。Defi
    特别地依赖于中间人或中心化组织。相反，它使用开放协议和去中心化应用程序（`DApps`）。通过代码强制执行协议，执行安全且可验证的交易，并将批准的状态更改记录在公共区块链上。


    因此，这种架构能够生成一个不可篡改且高度可的金融系统，具有无与伦比的清晰度、平等的访问权，并且对托管人、中央清算所或托管服务的的需求最小，因为“智能合约”可以处理大部分此类功能。例如，人们可以在去中心化交易所上购买与美元挂钩的资产（所谓的稳定币）。


    所有 Defi 协议和应用程序都构建在智能合约之上。智能合约是存储在区块链上并由大量验证者并发运行的小型应用程序。网络构建在公共区块链背景下，每个参与者都能参与并验证每个操作的准确执行。因此，与传统的中心化计算相比，智能合约的效率相对较低。智能合约提供了高度的安全性，因为它们始终按照说明运行，允许任何人独立地验证产生的状态更改。当执行得当时，智能合约具有高度透明性，并限制了操纵和任意干预的可能性。


    为了理解智能合约的独特性，我们必须首先研究基于服务器的标准 Web 应用程序。当人们与此类程序交互时，他们看不到程序的底层逻辑。此外，用户对执行环境没有影响力。这两者之一（或两者）都可能被篡改。因此，用户必须信任应用程序服务提供商。智能合约解决了这两个困难，它们确保应用程序按计划运行。合约代码保留在底层区块链上，使其可以公开访问。合约的行为是确定性的，成千上万的网络成员并行处理函数调用（以交易的形式存在），确保了执行的合法性。当执行导致状态更改（例如账户余额的更改）时，区块链网络的共识规则将生效，更改被记录在区块链的状态树中并受其保护。


    由于智能合约可以访问广泛的指令集，因此它们具有高度的可定制性。它们还可以作为加密资产的托管人，并对如何转移、何时转移以及转移给谁具有完全可定制的标准。


    这为大量新应用和生态系统的出现铺平了道路。萨博（Szabo）首次创造了“智能合约”这一术语。萨博接着说，许多协议可能“隐藏在我们交互的硬件和软件中，这种方式使得违约对违约者来说变得代价高昂”，并以自动售货机为例。Buterin
    提出了一个基于区块链的去中心化智能合约平台，以解决执行环境方面的信任问题并实现安全执行（可组合性）。Wood 形式化了这一概念并以 `Ethereum` 的名称实现了它。尽管有各种竞争者，但
    `Ethereum` 在市场价值、可行应用和开发活动方面仍是最突出的智能合约平台。


    Defi 仍然是一个规模较小的利基行业，但这种情况正在迅速变化。投资在 Defi 相关智能合约上的总资金已超过 100 亿美元。至关的一点是，这些并不是交易量或市值的指标；价值”一词指的是存储在智能合约中的储备，这些储备可以像书中描述的那样用于用途。


    ## DEFI 如何工作？


    从技术角度来看，Defi 是一组主要运行在 `Ethereum` 智能合约生态系统的去中心化应用程序（`dApps`），它们提供无需中间人的区块链金融服务。因此，理解
    Defi 如何工作需要涉及三个重要主题的知识：区块链技术、`Ethereum` 和智能合约。


    ### 区块链


    区块链技术不仅是 Defi 的基础，也是所有与加密货币相关事物的基础。简而言之，区块链是数字账本，通过公开共享的区块永久记录不可篡的数据。比特币作为第一个区块链网络，于
    2009 年推出，由于其安全性和稀缺性，这是一个改变游戏规则。


    ### 安全性


    像 `Bitcoin` 这样的区块链网络利用工作量证明（`PoW`）共识机制来执行交易。`PoW` 意味着被称为矿工的用户需要投入能量和硬件动力来解决困难的数学问题，以换取确认区块获得的激励。区块是想要发送资金的普通用户提交的签名交易的集合。每笔交易都有一个哈希值，用以验证其在账本中的时间顺序。因此，每个区块的哈希值都与前一个区块的哈希值相连，形成了顺序区块链。


    攻击比特币几乎是不可能的，因为整个账本（区块链的交易历史）以副本的形式分布在数千个节点中。要创建一个新的共识并同意另一个版本的区块链，恶意人员需要控制网络
    50% 以上的节点。


    ### 稀缺性


    比特币是有限的，因为可用代币数量是有限的。与法定货币不同，在区块链上无限制造和发行新币是不可能的，因为这种限制被构建在加密货币之中。比特币总量只会存在 2100
    万个，随着越来越多的矿工将代币投入市场，流通量将稳定增长。


    稀缺性使得比特币能够作为价值存储型资产，这意味着它在需要时可以作为避风港或对冲工具，这就是为什么投资者将比特币称为“数字黄金”。


    ### 以太坊与智能合约


    `Ethereum` 是另一种加密货币，通过使用智能合约增加了区块链技术的实用性。这些智能合约使用 `Solidity` 编程语言编写，用于构建具有支付之外的其他链上功能的丰富
    dApp 生态系统。

