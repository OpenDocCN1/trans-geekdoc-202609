    Bitcoin serves a fundamental and relatively simple use case by storing value over
    time and transacting value as needed. The user can only receive, store, and send
    Bitcoin units. Bitcoin''s significantly limited programming language, which is
    incapable of implementing complex computational logic into Bitcoin transactions,
    is a major weakness (or, depending on your point of view, a major strength). As
    a result, while Bitcoin lacks features, it is precisely this limitation that serves
    the property of security.


    ## ETHEREUM AND SMART CONTRACTS


    Moving off-chain (away from decentralized processing and storing of data) was
    not an option for the emerging blockchain community when trying to enable more
    use cases than simply receiving, storing, and sending Bitcoin. Thus, in 2013,
    five years after the inception of Bitcoin, a group of visionaries lead by Vitalik
    Buterin established Ethereum. Ethereum is a blockchain, just like Bitcoin. Its
    native digital currency, Ether, is equally rare, but it gives developers significantly
    greater leeway to build on. With over 200,000 developers and dozens of applications
    accessible, Ethereum is the world''s premier programmable blockchain. The concept
    of so-called smart contracts is introduced by Ethereum. Smart contracts are programs
    that execute transactions on the blockchain automatically based on previously
    agreed-upon terms and conditions. Smart contracts, like simple blockchain transactions,
    are executed in a decentralized manner, so they are relatively inefficient (in
    terms of latency and throughput) compared to centralized computing.


    Having said that, their strength stems from their high level of security and transparency.
    The results are potentially verifiable by anyone. A collection of interacting
    smart contracts is also known as a decentralized application due to their decentralized
    nature (dApps). In contrast to smart contracts, traditional banking software is
    neither visible nor understandable to the bank''s customers. The user must have
    faith that the programs offered by companies will deliver on their promises. On
    the other hand, smart contracts do not require the trust of any individual, state,
    or company because the code is publicly visible: it is copied thousands of times
    in public ledgers that comprise the blockchain.


    However, we must be fair and point out that only a few people have the knowledge
    and resources to independently analyze smart contract code. Like in the traditional
    financial system, users usually come to rely on certain institutions or individuals,
    such as auditors or experts.


    When comparing the evolution of blockchain technology from Bitcoin to Ethereum,
    one can conclude that Ethereum adopted important aspects of Bitcoin while expanding
    it by enabling computational logic on top of it. If Bitcoin lacked features, Ethereum
    overachieves.


    ## Four


    Consider the history of conventional finance and how we came to recognize the
    need for a system that is not based on strong intermediaries before diving into
    the advantages and downsides of Decentralized Finance (Defi).


    Finance has come a long way, and understanding this brief history will help us
    better understand why we enjoy the notion of incorporating the concept of "Decentralized"
    into "Finance" in as many areas as feasible.


    Finance had no place before the beginning of human history. Hunting for food and
    finding shelter summed up human wants. Humans needed to engage with one another
    as their population increased.


    The most basic form of trade was the direct exchange of one product for another.
    You had more meat than you needed, so you had to barter it with a neighbor for
    wheat. But, in what proportion should this trade occur? Is it 1:1, 2:1, or something
    else?


    There was no definite criterion for judging the worth of items. Another issue
    with this way of trade was that you might not be able to find someone ready to
    exchange his own product for yours, or it might take a long time, wasting your
    goods.


    As the number of goods and products increased, the demand for a criterion and
    index for valuing goods increased. This resulted in the invention of money systems
    and the birth of the first generations of finance. Around 600 B.C., the first
    money in the shape of coins, composed of electrum (a gold and silver alloy), appeared.


    ### A new method of trading


    People could now easily exchange goods for cash and vice versa. Different sorts
    of money and assets became popular with the emergence of industry. With the introduction
    of banks and third-party organizations to coordinate human economic behavior,
    a new generation of finance arose.


    But wait a minute!


    - Were all of the issues resolved?

    - Who was in charge of the money? Governments or people?

    - Was the money distributed in a fair and equal manner?

    - Is all of the money spent on the people''s wellbeing and resolving their problems?

    - Is it possible to maintain money transactions secure in the presence of intermediaries?


    As you might expect, when money is in the jurisdiction of a single entity (such
    as the government), we run into a major issue: Unrestricted Money Printing.


    Through establishing central banks, governments assumed the right to manufacture
    money and established themselves as intermediaries between two trade parties.


    As you may be aware, printing more money raises the price of products while having
    no effect on the quantity or quality of goods.


    On the other hand, rare assets such as gold, rare art, and, these days, Bitcoin
    are becoming more valued. Currency depreciation is caused by two main factors:
    easy monetary policy and excessive inflation. There is no need to single out a
    specific institution or group; yet, the globe has recently faced serious financial
    crises due to the central banks and intermediaries who continue to regulate money''s
    incompetence or maladministration. Many factories and companies went bankrupt,
    and many individuals were sacked or lost their employment as a result.


    People have lost faith in established financial systems as a result of financial
    crises. People are becoming more aware of the advantages of an unmediated financial
    system.


    One of the first steps toward attaining this goal was the creation of Bitcoin.
    With the emergence of Bitcoin and cryptocurrencies, finance has entered a new
    age. Although there have been some significant developments, it is still impossible
    to call it a decentralized financial system. The majority of bitcoin financial
    transactions and services are conducted through centralized exchanges.


    **What is the distinction between a bank and a centralized cryptocurrency exchange?**

