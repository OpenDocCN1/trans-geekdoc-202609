- raw: 'Synths are especially helpful because they improve financial accessibility.
    Someone who does not have access to the U.S. stock market would otherwise have
    no way to trade an asset like GME. Moreover, investors do not have to hold the
    underlying asset and have an easier time trading, buying, or selling assets.


    In the case of Synthetix, DeFi''s decentralization is particularly advantageous
    because anyone can create a synth. Since blockchain-based synths can track all
    kinds of underlying assets, the sky''s the limit when creating derivatives.


    **Yield Farming**


    Yield farming is closely related to how decentralized exchanges work, and it is
    currently the number one use case in Defi. Yield farming is definable as a passive
    income strategy that enables investors to earn more crypto by using existing crypto
    assets. Essentially, yield farmers provide their cryptocurrency to a decentralized
    exchange in the form of liquidity to earn rewards.


    A decentralized exchange incentivizes yield farmers by rewarding them with trading
    fees, which are gained from users who execute trades using the yield farmer''s
    liquidity. Such a system forms a symbiotic relationship between the DEX, traders,
    and liquidity providers, where each side receives something.


    Each farmer earns fees proportionally to his contribution in a liquidity pool.
    The yield farming process can last for an unlimited amount of time. However, users
    are incentivized to jump from one pool to another to chase highly competitive
    yield rates. In yield farming, yield rates are considerably higher compared to
    other similar activities.


    Popular yield farming platforms include Uniswap, Curve Finance, SushiSwap, Yearn
    Finance, Cream Finance, and many others. Most of them are decentralized exchanges
    that use AMMs, meaning yield farming is an inherent feature for DEXs.


    When yield farming, the investor retains custody over his assets by receiving
    liquidity provider (LP) tokens in return. LP tokens represent the investor''s
    share of the pool, and they must be redeemed to receive the original funds back.
    However, yield farmers can also use LP tokens by depositing them to other pools
    and farming more assets. Therefore, it is possible to earn double the rewards
    by simultaneously accessing two passive income strategies.


    **Impermanent loss**


    The issue with providing liquidity to exchanges is that yield farmers face the
    dangers of impermanent loss (IL). Impermanent loss is the opportunity cost of
    holding onto an asset for speculative purposes versus farming it to gain rewards.


    IL is almost unavoidable because cryptocurrencies are volatile assets. If an asset
    loses or gains too much value from the moment of being deposited to a pool, the
    yield farmer would be better off by simply storing the assets in a wallet. In
    the best case, the user will make a little less money than he would have by doing
    nothing. In the worst case, the user will have less money after withdrawing than
    what he originally deposited.


    For the duration of the farming process, impermanent loss is unrealized. The moment
    a yield farmer leaves the pool and redeems his tokens, the loss is realized. Therefore,
    farmers can avoid losses by waiting for prices to retrace to their initial value.


    **Minimizing impermanent loss**


    The best methods to avoid IL are by either joining pools with relatively low volatility
    or by joining pools with high yield rates. In the first case, the chance of facing
    impermanent loss is low since the assets themselves do not gain or lose too much
    value in a short time frame. By the end of the process, the realized losses will
    either be small or non-existent.


    In the second case, the yield rate can be high enough to offset the losses incurred
    by impermanent loss. Since liquidity pools use exchange fees to distribute rewards
    to yield farmers, it is possible to profit greatly from a sudden jump in trading
    volume. Even if one suffers an impermanent loss, the money gained from farming
    will be enough to remain profitable.


    Certain yield farming platforms are designed to minimize IL. For example, Curve
    Finance only offers liquidity pools with stablecoins and wrapped tokens - both
    of which hold onto a stable price point. Since there is little to no volatility,
    it is possible to yield farming without experiencing impermanent loss. However,
    yield rates are naturally lower compared to other liquidity pools.


    **Insurance**


    Smart contracts may be decentralized and transparent, but they are prone to security
    exploits, resulting in millions of dollars in losses. Even audited Defi projects
    can still possess exploits, and if that is the case, a hacker can completely drain
    its liquidity pools.


    In contrast to centralized exchanges, DEXs are not obliged to protect or reimburse
    their clients in the event of an exploit. There are no insurance funds on crypto
    exchanges like Binance, Gemini, and Coinbase.


    On that account, Defi investors must use insurance protocols to protect their
    existing funds. These protocols protect against technical risks (exploits) and
    against liquidity risks and administration risks.


    **How coverage works**


    Nexus Mutual and Opyn are the two largest Defi insurance protocols. Both host
    roughly $400 million worth of crypto assets. When users apply for insurance, they
    pay for so-called ''coverage,'' which covers the user in specific events. As previously
    noted, it is possible to be covered in the event of a smart contract exploit.
    A yield farmer who provides a high amount of liquidity might decide to cover his
    assets, and in this case, he must state the coverage amount and coverage period.


    Coverage amount represents the value of assets that are paid out in the event
    of a smart contract incident. Coverage period accounts for the period during which
    the user can utilize his insurance.


    For example, a yield farmer who plans to contribute crypto assets on Uniswap can
    visit Nexus Mutual and apply for a coverage option that lasts two weeks and covers
    50% of his contributed liquidity. Nexus Mutual initiates a Claims Assessment procedure
    and reimburses the yield farmer if an exploit occurs during this timeframe.


    **Stablecoins**


    Stablecoins are cryptocurrencies whose value is determined by the value of fiat
    currencies. Since cryptocurrencies are volatile, stablecoins are used as a hedge
    to protect oneself against extreme market conditions. Moreover, they are also
    used to quickly secure profits by converting cryptocurrencies into what is essentially
    a tokenized form of fiat.


    The U.S. Dollar is the dominant stablecoin in the crypto market. The method of
    pegging a token''s value against the dollar is different from stablecoin to stablecoin,
    and each project uses its system to ensure zero volatility.


    **Types of stablecoins**


    We can divide stablecoins into two categories: fiat-collateralized and crypto-collateralized.
    Fiat-collateralized stablecoins are backed by real fiat held within a project''s
    reserves. Tether is the most well-known fiat-collateralized stablecoin, and its
    USDT token is linked to $1 by keeping reserves of $1 for every USDT token produced.
    Investors must trust Tether to hold enough fiat reserves for their crypto supplies.
    Their reserves are held in financial institutions and banks. All of these facts
    combined mean that fiat-backed stablecoins are centralized.


    Crypto-collateralized stablecoins are backed by cryptocurrencies rather than fiat.
    For example, DAI is built on top of the Ethereum network and uses smart contracts
    to maintain a $1 peg. Since smart contracts are public, users can confirm whether
    there is enough collateral to back DAI''s token supply. On that account, DAI is
    a decentralized stablecoin.


