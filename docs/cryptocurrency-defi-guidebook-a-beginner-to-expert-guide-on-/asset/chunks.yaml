  trans: '

    鉴于交易所需基础设施的复杂性，在该领域进行竞争极其困难；交易机器的创建和延迟技术的改进已最大限度地减少了普通交易者获得优势的可能。此外，基于 Gas 的套利导致了以太坊网络的拥堵，并显著增加了成本。


    ## 收益套利 (YIELD ARBITRAGE)


    收益套利策略侧重于从不同借贷产品之间的价格差异中受益。如今，所有借贷产品都需要基于抵押的贷款结构，因为无担保信贷扩展实际上是不存在的。假设 `Supply
    APR`（即投资者向池提供的贷款年化收益）大于 `Borrow APR`（即投资者提取的超抵押贷款）。在这种情况下，交易者可以利用其资产进行贷款并捕获利差。


    投资者需要确保锁定期保持一致，以避免资产与负债之间出现流动性错配。传统上，借贷利率之间的差额在 -5% 到约 +10% 之间。理解利率计算至关重要，因为浮动利率产品可能会损害收益。


    这种策略可以在同一平台上执行、跨 Defi 平台执行，甚至可以跨中心化金融 (CeFi) 平台执行。此外，投资者可以在两种不同的代币之间承担质押风险；例如，将
    `XTZ` 代币换为 `DOT` 代币以尝试捕获 APY 差。


    ## 套利：关键风险因素


    ### 流动性风险

    尽管市场在过去几年中大幅增长，但与股票和债券等传统市场相比仍然相形见绱。供需平衡可能会持续并破坏任何交易策略。


    ### 锁定期风险

    在合并不同的平台或协议时，理解你所交互的每种智能合约的锁定期非常重要。例如，质押资产将要求持有特定期限以获得奖励。


    ### 基差风险 (Basis Risk)

    在不同资产之间进行兑换涉及底层代币的 Beta 风险。如果你交换了 `DASH` 和相同金额的 `XTZ` 来进行 APY 交易，如果一种资产的增值超过另一种资产，你可能会面临无法收回本金的风险。


    例如，假设投资者交换了 100 美元的 `DASH`，通过 100 美元的 `XTZ` 获得 7% 的收益以捕获 2% 的收益差。如果 `DASH` 相对于
    `XTZ` 上升，投资者最终可能会亏损执行交易。


    假设在合同到期时，相同数量的 `DASH` 单位价值 120 美元（从 100 美元上涨），而 `XTZ` 价值 90 美元（从 100 美元下降）。投资者必须弥补初始两种资产之间
    30 美元的差距。


    此外，由于 `XTZ` 质押是基于代币的，质押奖励的价值将不如收到的 `DASH` 单位价值（均以美元计）。只有当 `XTZ` 的价值相对于 `DASH`
    增长，或者在借贷期间价值保持相同时，投资者才能受益。


    对两种资产方向有特定头寸的投资者可以对两种资产之间的差异进行投机，并从净利差中受益。作为一个一般原则，请确保你了解你的计价货币与资产计价货币的区别。


    ## 3. 保险 (INSURANCE)


    Defi 平台的出现源于打破金融服务中介的渴望。因此，交易方风险的消除/减少导致“软件风险”的大幅增加。鉴于市场尚处于早期阶段且缺乏审计历史，行业未来的增长存在许多盲点。去中心化保险作为一种的解决方案应运而生；然而，流动深度和赔付逻辑的清晰度仍不确定。


    例如，Nexus Mutual 创建了一个针对智能合约故障的的市场。个人可以购买 `NXM` 代币为平台提供流动性，或针对其 Defi 风险敞口购买保险。平台能提供的保险金额等于锁定在智能合约中的总流动价值价值目前大部分以
    `ETH` 计价）。据此，算法决定可以出售的最优定价和覆盖范围。这些保单可以根据供需平衡、理赔频率、平台类型等进行定价。


    本质上，Nexus Mutual 正在为专注于 Defi 的保险产品创建一个市场，这将使下一代能够以去中心化的方式更好地为风险定价。截至 2021 年 2
    月 8 日，Nexus Mutual 平台上的覆盖额为 7.387 亿美元，总保费等于 1320 万美元。谜题中最有趣的部分与理赔评估和还款有关。


    Nexus Mutual 创建了一种“众包”模型，试图通过代币激励来引导良好行为。另一个关键风险因素与理赔/风险评估及赔付机制相关的预言机稳定性有关。


    ## Seventeen (第十七章)


    本章概述了 Defi 可能与政策和监管交互的主要领域。重要的是，它列出了关键问题和选项，但没有提供规范性的解决方案，因为不同司法管辖的目标、监管机制和市场组成各不相同。这里描述的方法旨在具有通用性，适用于各种背景。本节的剩余部分提供了工具和资源。


    信任最小化执行、非托管服务和可组合架构可能会挑战现有的监管。Defi 既可以引入新风险，也可以帮助缓解金融服务中的已知风险。决策者面临的许多关键挑战——去中心化如何使识别主体变得困难、自动化带来的新风险，以及无国软件代码如何增加地区规则的应用——都是所有数字资产问题的延伸。其他，例如创建具有多个潜在用途和集成的构建模块，或代币化治理的激励结构，较不熟悉。考虑到
    Defi 的跨领域性质，需要整合的战略和愿景。


    通常情况下，考虑技术中立的方法可能是明智的，以平衡监管目标与促进创新和市场发展之间的关系。与任何监管倡议一样，政策制定者应争取制定公平、高效、有效且可执行的
    Defi 规则。


    ## Defi 与金融监管


    第一阶段是确定适当的目标以及相关的政策和监管类别。金融监管共同目标包括保护投资者和其他消费者；市场效率和诚信；资本形成；金融包容；防止非法活动；安全和稳健；金融稳定。每个目标都为某些类型的规则提供了独特的逻辑。例如，关注投资者保护的监管机构通常担心托管人卷走资金。Defi
    的非托管性质可能会缓解这些担忧，同时产生新的担忧。


    Defi 活动跨越了金融监管的许多领域，包括证券、衍生品、交易所、投资管理、银行监管、金融犯罪、消费金融、保险、风险管理和宏观审慎监管。一个贯的整体战略至关重要，可以委托给跨实体工作组或类似机构。某些
    Defi 活动模式将匹配既有的法律分类；某些则不会。


    现有法规、调整后的法规以及新的、定制的法规可能被用于对 Defi 的有效监管应对。欧盟全面的《加密资产市场》(MiCA) 提议是不断发展的数字资产特定法律的一部分。然而，大多数司法管辖区尚未采用定制框架。

    '
