  fmt: 'Interest rates in Compound are expressed in Annual Percentage Yield (APY)
    and vary depending on the asset. Compound calculates interest rates for various
    assets using algorithms that consider the asset''s supply and demand.


    Compound reduces lending/borrowing friction by allowing suppliers/borrowers to
    interact directly with the interest rate protocol without negotiating loan terms
    (e.g., maturity, interest rate, counterparty, collaterals), resulting in a more
    efficient money market.


    ### What is the amount of interest you will receive or pay?


    The Annual Percentage Yield (APY) varies by asset because it is determined algorithmically
    based on supply and demand. The greater the demand for borrowing, the higher the
    annual percentage yield (APY), and vice versa.


    A lender would earn 7.58 percent (as of February 2020) on the DAI stablecoin,
    while a borrower would pay 8.00 percent interest after a year.


    ### Is it necessary for me to create an account to use Compound?


    You do not need to establish an account, which is one of the advantages of Decentralized
    Finance apps! Users of the compound don’t need to register for anything, unlike
    conventional financial apps, which need users to go through long registration
    procedures to get started.


    Compound may be used straight immediately by anybody with a compatible cryptocurrency
    wallet, such as Argent or Metamask.


    ### Begin earning interest on Compound


    To earn interest, you must provide assets to the protocol. Compound accepted seven
    different types of tokens as of February 2020.


    Once you''ve deposited your asset into Compound, you''ll start earning interest
    on it right away! Interest is calculated after each Ethereum block (on average
    13 seconds) and is calculated on the amount you have supplied.


    You will receive corresponding amounts of `cTokens` upon deposit. If you supply
    `DAI`, you will be rewarded with `cDAI`; if you supply `Ether`, you will be rewarded
    with `cETH`, and so on). Interest is not immediately distributed to you; rather,
    it accrues on the `cTokens` that you now own and are redeemable for the underlying
    asset and interest it represents.


    #### cTokens?


    `cTokens` represent your protocol balance and accrue interest over time. Interest
    earned in Compound is not distributed immediately but rather accumulates in `cTokens`.
    Let''s take a look at an example. Assume you supplied 1,000 `DAI` on January 1,
    2019, and the APY has remained constant at 10.00 percent throughout 2019.


    After depositing 1,000 `DAI`, you will be given 1,000 `cDAI` on January 1, 2019.
    The exchange rate between `DAI` and `cDAI`, in this case, is 1:1.


    After one year, your 1,000 `cDAI` will be worth 10% more on January 1, 2020. `DAI`
    and `cDAI` now have a 1:1.1 exchange rate. Your 1,000 `cDAI` is now worth 1,100
    `DAI`.


    To account for accrued interest, `cTokens` become convertible into an increasing
    amount of the underlying asset they represent over time. Because `cTokens` are
    `ERC-20` tokens, you can easily transfer "ownership" of supplied assets if someone
    wants to take over your role as a supplier.


    ### Begin borrowing on Compound


    First, you must enter assets into the system as collateral for your loan. Every
    asset has a unique collateral factor. The more assets you provide, the more borrowing
    power you have.


    Borrowed assets are delivered directly to your Ethereum wallet, where you can
    use them like any other crypto assets—however, you want! Please remember that
    borrowing incurs a small fee of 0.025 percent to prevent spam and misuse of the
    Compound protocol.


    ### Price movement of collateral asset


    If you''re to major trades. Liquidity pools on DEXs can be pooled across many
    platforms, increasing the available liquidity on any particular platform. Kyber
    Network, Bancor, and Uniswap are examples of liquidity pool-based DEXs. This book
    will walk you through the Uniswap example.


    The margin trading function is one of the functions provided by CEXs. Margin trading
    allows an investor to trade leveraged positions, increasing one''s purchasing
    power and potentially increasing returns. Margin trading on DEXs has also seen
    new developments. DEXs that provide decentralized margin trading include `dYdX`,
    NUO Network, and DDEX. This book will look at `dYdX`, which integrates decentralized
    lending and borrowing markets with margin trading on their exchange.


    ## UNISWAP


    Uniswap Exchange is an Ethereum-based decentralized token exchange system that
    allows direct token switching without a centralized exchange. When using a centralized
    exchange, you must deposit tokens, make an order on the order book, and withdraw
    the switched tokens.


    You can trade your tokens immediately from your wallet on Uniswap without having
    to go through the three processes above. Simply send your tokens from your wallet
    to Uniswap''s smart contract address, and you will receive your selected token
    in your wallet. There is no order book, and the exchange rate for tokens is set
    algorithm. All of this is accomplished through the use of liquidity pools and
    the automated market process.


    ### Liquidity Pools


    Liquidity pools are token reserves that are stored on Uniswap''s smart contracts
    and can be used to exchange tokens. For example, utilizing an ETH-DAI trading
    pair with 100 ETH and 20,000 DAI in liquidity reserves, a user wishing to purchase
    ETH using DAI may transfer 202.02 DAI to the Uniswap smart contract in exchange
    for 1 ETH. After the swap, the liquidity pool is left with 99 ETH and 20,202.02
    DAI.

    '
  trans: '

    Compound 中的利率以年化收益率（APY）表示，并根据资产的不同而异。Compound 使用考虑资产供需的算法为各种资产计算利率。


    Compound 通过允许供应者/借款人直接与利率协议进行交互，而无需协商贷款条款（例如：期限、利率、交易对手、抵押品），从而减少了贷/借贷摩擦，产生了更高效的货币市场。


    ### 我将收到或支付多少的利息？


    年化收益率（APY）随资产而异，因为它是根据供需算法决定的。借贷需求越大，年化收益率（APY）越高，反之亦然。


    贷款者 DAI 稳定币可以获得 7.58% 的收益（截至 2020 年 2 月），而借款人在一年后将支付 8.00% 的利率。


    使用 Compound 需要创建账户吗？


    你不需要建立账户，这是去中心化金融（DeFi）应用的优势之一！Compound 用户不需要注册任何东西，与传统金融应用不同，后者需要经过复杂的注册程序才能开始。


    任何拥有兼容加密货币钱包（如 Argent 或 Metamask）的人都可以立即使用 Compound。


    ### 在 Compound 上开始赚利


    要赚利息，你必须向协议提供资产。截至 2020 年 2 月，Compound 已接受七种不同代币。


    一旦你将资产存入 Compound，就会立即开始赚利息！利息在每个以太坊区块（平均 13 秒）后计算一次，并根据你提供的金额进行计算。


    你在存款后将收到相应的 `cTokens`。如果你提供 `DAI`，你将获得 `cDAI`；如果你提供 `Ether`，你将获得 `cETH`，以此此类推。利息不会立即分配给用户，而是积累在你目前拥有的
    `cTokens` 中，这些 `cTokens` 可以兑换为底层资产及其代表的利息。


    #### cTokens？


    来看一个例子。假设你在 2019 年 1 月 1 日提供了 1,000 个 `DAI`，且整个 2019 年的 APY 始终保持在 10.00%。


    在存入 1,000 个 `DAI` 后，你将在 2019 年 1 月 1 日获得 1,000 个 `cDAI`。此时，`DAI` 和 `cDAI` 之间的汇率为
    1:1。


    一年后，你的 1,000 个 `cDAI` 在 2020 年 1 月 1 日的价值将增加 10%。`DAI` 和 `cDAI` 现在的汇率为 1:1.1。你的
    1,000 个 `cDAI` 现在价值 1,100 个 `DAI`。


    为了计算利息，`cTokens` 会随着时间的推移转换为不断增加的底层资产。由于 `cTokens` 是 `ERC-20` 代币，如果有人想接替你的供应者角色，你可以轻松转移供应资产的“所有权”。


    ### 在 Compound 上开始借贷


    首先，你必须将资产存系统作为贷款抵押。每种资产都有独特的抵押因子。提供的资产越多，借贷能力就越大。


    借出的资产将直接交付到你的以太坊钱包，你可以像使用任何其他加密资产一样随意使用！请记住，借贷会产生 0.025% 的小额费用，以防止对 Compound 协议的垃圾邮件和滥用。


    ### 抵押资产的价格波动


    如果你要进行大交易。DEX（去中心化交易所）上的流动性池可以在多个平台汇总，增加任何特定平台的可用流动性。Kyber Network、Bancor 和 Uniswap
    都是基于流动池的 DEX 示例。本书将带你了解 Uniswap 示例。


    融资交易功能是 CEX（中心化交易所）提供的功能之一。融资交易允许投资者进行杠杆交易，增加个人的购买力并可能增加收益。DEX 上的融资交易也取得了新进展。提供去中心化融资交易的
    DEX 包括 `dYdX`、NUO Network 和 DDEX。本书将介绍 `dYdX`，它将去中心化借贷市场与其交易所上的融资交易整合在一起。


    ## UNISWAP


    Uniswap 交易所是一个基于以太坊的去中心化代币交易系统，允许在没有中心化交易所的情况下直接切换代币。使用中心化交易所时，你必须存款代币、在订单簿上下单，并提取兑换后的代币。


    你可以直接在 Uniswap 上从钱包交易代币，而无需经过上述三个过程。只需将代币从钱包发送到 Uniswap 的智能合约地址，你就会在钱包中收到选定的代币。这里没有订单簿，代币汇率通过算法设定。这一切通过使用流动性池和自动市场机制来实现。


    ### 流动性池


    流动性池是存储在 Uniswap 智能合约上的代币储备，用于交换代币。例如，利用流动性储备中拥有 100 ETH 和 20,000 DAI 的 ETH-DAI
    交易对，想要使用 DAI 购买 ETH 的用户可以将 202.02 DAI 发送到 Uniswap 智能合约以换 1 个 ETH。交换后，流动性池将剩余 99
    ETH 和 20,202.02 DAI。

    '
