    # Custodial vs. Non-Custodial Wallets


    lets are classified into two types: custodial and non-custodial. Custodial wallets
    are wallets in which third parties store and manage your cryptocurrencies on your
    behalf. Non-custodial wallets give you complete control and ownership of your
    cryptocurrencies. This is similar to the mantra advocated by many in the blockchain
    industry to "be your bank."


    By using a custodial wallet, you are putting your trust in an outside party to
    keep your coins safe. This is handy since you don''t have to worry about private
    key security; instead, much as with an email account, you just have to worry about
    account credentials security. However, entrusting your cryptocurrencies to a third
    party exposes you to the risk of the custodian losing your cryptocurrencies due
    to mismanagement or hacking. Custodial wallets have been known to lose their cryptocurrencies
    in the past; notably, `Mt. Gox` being the most prominent example, losing over
    850,000 bitcoin worth over $450 million in 2014.


    By using a non-custodial wallet, you are relying solely on yourself to ensure
    the safety of your cryptocurrencies. However, by using a non-custodial wallet,
    you shift the burden of security to yourself, and you must be fully prepared to
    safely store your private keys. You will lose access to your cryptocurrencies
    if you lose your private keys.


    ## Which Wallet Should I Use?


    There are numerous cryptocurrency wallets available on the market. For the sake
    of this book, we''ll go through two Defi-friendly wallets that will help you get
    started with the Ethereum network fast.


    ### Argent Wallet for Mobile Users


    Argent wallet is an option for mobile users. Argent is a non-custodial wallet
    that provides ease of use and high security, which does not always go hand in
    hand. It accomplishes this by using `Argent Guardians`, which are people, devices,
    or third-party services that can verify your identity.


    Examples include family and friends who use `Argent`, other hardware or `Metamask`
    wallets, and two-factor authentication services. Argent is reconsidering the need
    for paper-based seed phrase backups when recovering accounts by utilizing this
    limited circle of trust network.


    If you believe your wallet has been compromised, `Argent Guardians` allow you
    to lock it and instantly freeze all funds. Your wallet will be unlocked automatically
    after five days unless you request that your `Argent Guardian` unlock it sooner.


    You may also enhance the security of your wallet by adding additional security
    features, such as a daily transaction limit. This is useful in preventing hackers
    from withdrawing funds from your `Argent wallet` if they gain access to it. When
    your daily transaction limit is reached, you will be notified, and any transactions
    that exceed the limit will be delayed for more than 24 hours. You can, of course,
    use your `Argent Guardians` to authorize legitimate large transactions that exceed
    the limit.


    Argent provides free transactions to wallet users and absorbs all Ethereum gas
    fees owed to the network. Argent wallet allows you to interact with Defi Dapps
    directly from the wallet, eliminating the need for another app or device.


    ### Desktop Users: Metamask


    Metamask is a web browser extension available on the Chrome, Firefox, Opera, and
    Brave browsers. Metamask, like Argent, is a non-custodial wallet that serves as
    both a wallet and an interaction bridge for the Ethereum network.


    Metamask allows you to store Ethereum and `ERC20` tokens. Metamask, which acts
    as an interaction bridge, allows you to use all Decentralized Applications (Dapps)
    hosted on the Ethereum Network.


    Without using an interaction bridge, such as `MetaMask`, your browser won’t be
    able to access the Ethereum blockchain except you were operating a complete `Ethereum
    node` and possessed the whole Ethereum blockchain, which is over 400GB in size,
    downloaded on your computer. On a technical level, `MetaMask` accomplishes this
    by injecting a javascript library known as `web3.js` written by core Ethereum
    developers into the page of your browser, allowing you to easily interact with
    the Ethereum network.


    Metamask simplifies interaction with Defi Dapps on the Ethereum network on your
    laptop or PC. They are secure because you must sign each interaction and transaction
    you perform on the network. However, to keep your Metamask safe and secure, you
    must take care. Anyone who has your password or seed phrase (a secret phrase you
    were given when you signed up for your wallet) will have complete control of your
    wallet.


    # Stablecoins


    Cryptocurrency prices are extremely volatile. Stablecoins, linked to other stable
    assets like the US dollar, were designed to reduce volatility. Stablecoins were
    created to be a reliable medium of exchange and to help users hedge against price
    volatility. Stablecoins have quickly evolved into a significant component of Defi,
    which is critical to this modular ecosystem.


    In this chapter, we will look at USD-peged stablecoins. Stablecoins are not all
    the same because they use different mechanisms to maintain their peg to the USD.
    There are two kinds of pegs: fiat-collateralized pegs and crypto-collateralized
    pegs. To keep their USD peg, most stablecoins use a fiat-collateralized system.


    To demonstrate the differences in pegging management, we will look at two USD
    stablecoins, `Tether (USDT)` and `Dai (DAI)`.


    ### Tether (USDT)


    Tether (USDT) has a one-dollar reserve for each `Tether` token produced. With
    daily trade volumes reaching over $30 billion in January 2020, Tether is the biggest
    and most frequently utilized USD stablecoin. Tether reserves are held in financial
    institutions, and users must trust `Tether` as an entity to have the reserve amounts
    they claim. Tether is a centralized, fiat-collateralized stablecoin as a consequence.


    ### Dai (DAI)


    On the other side, Dai (DAI) is backed by cryptocurrencies like `Ethereum (ETH)`.
    Its value is fixed at $1, thanks to protocols approved by a decentralized autonomous
    organization and smart contracts. Users can easily validate the collateral used
    to generate `DAI` at any time. DAI is a crypto-collateralized decentralized stablecoin.


    ## MAKER


    Maker is a smart-contract platform built on Ethereum that includes three tokens:
    the `Sai` and `Dai` stablecoins (both algorithmically tied to $1) and `Maker`,
    the network''s governance token.


    `Sai (SAI)`, also known as Single Collateral Dai, is a cryptocurrency backed solely
    by `Ether (ETH)` as collateral.


    `Dai (DAI)`, also known as Multi-Collateral Dai, was introduced in November 2019.
    It is currently collateralized by `Ether (ETH)` and `Basic Attention Token (BAT)`,
    with plans to add other assets in the future.


    `Maker (MKR)` is the governance token for Maker, and it can be used to vote on
    platform changes via the Maker Improvement Proposals. Maker is what is known as
    a Decentralized Autonomous Organization (DAO).

    '
  trans: '


    # 托管型与非托管型钱包


    钱包分为两类：托管型和非托管型。托管钱包是由第三方代表你存储和管理加密货币的钱包。非托管型钱包让你对自己的加密货币拥有完全的控制权和所有权。这类似于区块链行业许多人倡导的格言：“做自己的银行”。


    通过使用托管型钱包，你将信任交给了第三方来确保你的币安全。这非常方便，因为你不需要担心私钥的安全；相反，就像电子邮件账户一样，你只需要担心账户凭据的安全。然而，将加密货币寄托给第三方会让你面临托管人因管理不当或被攻击而丢失你加密货币的风险。托管型钱包曾有过丢失加密货币的记录；其中
    `Mt. Gox` 是最著名的例子，它在 2014 年损失了超过 85 万个比特币，价值超过了 4.5 亿美元。


    通过使用非托管型钱包，你完全依靠自己来确保加密货币的安全。然而，使用非托管型钱包意味着你将安全负担转移到了自己身上，你必须完全准备好安全地存储你的私钥。如果你丢失了私钥，将失去对加密货币的访问权限。


    ## 我应该使用哪种钱包？


    市场上有很多加密货币钱包。为了本本书的内容，我们将介绍两种对 DeFi 友钱包，它们将帮助你快速上手以太坊网络。


    ### 移动用户的 Argent 钱包


    Argent 钱包是移动用户的选择。Argent 是一种非托管钱包，提供了易用性和高安全性，而这两者并不总是兼得。它通过使用 `Argent Guardians`（Argent
    守护者）来实现这一点，这些是可以验证你身份的人、设备或第三方服务。


    示例包括使用 `Argent` 的家人朋友、其他硬件或 `Metamask` 钱包，以及双重认证服务。Argent 正在利用这个有限的信任网络，重新考虑在恢复账户时对纸质助记词备份的需求。


    如果你认为你的钱包已被破解，`Argent Guardians` 允许你锁定并立即冻结所有资金。除非你请求 `Argent Guardian` 提前解锁，否则你的钱包将在五后自动解锁。


    你还可以通过添加额外的安全功能（例如每日交易限制）来增强钱包的安全性。这对于防止黑客在获得你的 `Argent wallet` 访问权限后提取资金非常有用。当达到每日交易限制时，你会收到通知，任何超过限制的交易将延迟
    24 小时以上。当然，你可以使用你的 `Argent Guardians` 来授权超过限制的大额合法交易。


    Argent 为钱包用户提供免费交易，并承担所有支付给网络的以太坊 Gas 费用。Argent 钱包允许你直接从钱包与 DeFi Dapp 交互，无需另一个应用程序或设备。


    ### 桌面用户：Metamask


    Metamask 是一个适用于 Chrome、Firefox、Opera 和 Brave 浏览器的浏览器扩展程序。Metamask 与 Argent 一样，是非托管钱包，既是钱包也是以太坊网络的交互桥梁。


    Metamask 允许你存储以太坊和 `ERC20` 代币。Metamask 作为交互桥，允许你使用托管在以太坊网络上的所有去中心化应用（Dapps）。


    如果不使用像 `MetaMask` 这样的交互桥梁，除非你运行完整的 `Ethereum node` 并将整个以太坊区块链（大小超过 400GB）下载到电脑上，否则你的浏览器无法访问以太坊区块链。在技术层面，`MetaMask`
    通过向你的浏览器页面注入由以太坊核心开发者编写的名为 `web3.js` 的 JavaScript 库来实现这一点，让你能够轻松与以太坊网络交互。


    Metamask 简化了在笔记本电脑或 PC 上与以太坊网络上的 DeFi Dapp 交互。它们是安全的，因为你必须对网络上进行的每次交互和交易进行签名。然而，为了保持你的
    Metamask 安全，你必须小心。任何拥有你的密码或助记词（你在注册钱包时收到的秘密短语）的人将拥有你钱包的完全控制权。


    # 稳定币


    加密货币价格波动极大。稳定币与美元等稳定资产挂钩，旨在减少波动。稳定币的创建是为了作为可靠的交易媒介，并帮助用户对冲价格波动。稳定币已迅速成为 DeFi 的重要组成部分，这对这个模块化生态系统至关重要。


    在本章中，我们将研究锚定美元的稳定币。稳定币并不相同，因为它们使用不同的机制来维持对美元的锚定。锚定有两种类型：法币抵押和加密货币抵押。为了保持美元美元锚定，大多数稳定币使用法币抵押系统。


    为了展示锚定管理的差异，我们将查看两种美元稳定币：`Tether (USDT)` 和 `Dai (DAI)`。


    ### Tether (USDT)


    Tether (USDT) 每产生一个 `Tether` 代币都有一美元储备。随着 2020 年 1 月每日交易量达到超过 300 亿美元，Tether 是最大且最常用的美元稳定币。Tether
    的储备存储在金融机构中，用户必须信任实体 `Tether` 拥有声称的储备金额。因此，Tether 是一种中心化的法币抵押稳定币。


    ### Dai (DAI)


    另一方面，Dai (DAI) 由 `Ethereum (ETH)` 等加密货币支持。得益于去中心化自治组织批准的智能合约，它的价值固定在 1 美元。用户可以随时验证生成
    `DAI` 所使用的抵押品。DAI 是一种加密货币抵押的去中心化稳定币。


    ## MAKER


    Maker 是构建在以太坊上的智能合约平台，包含三种代币：`Sai` 和 `Dai` 稳定币（都通过算法挂钩美元）以及网络治理代币 `Maker`。


    `Sai (SAI)` 也称为单质抵押 Dai，是一种仅由 `Ether (ETH)` 作为抵押品的加密货币。


    `Dai (DAI)` 也称为多质抵押 Dai，于 2019 年 11 月引入。它目前由 `Ether (ETH)` 和 `Basic Attention
    Token (BAT)` 抵押，并计划未来添加其他资产。


    `Maker (MKR)` 是 Maker 的治理代币，可以通过 Maker 提案（PIP）对平台更改进行投票。Maker 就是所知的去中心化自治组织（DAO）。


    '
