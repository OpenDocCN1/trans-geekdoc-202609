  fmt: '

    To do so, first provide `ETH` as collateral to `Opyn`''s smart contract with a
    minimum collateralization ratio of 160 percent to mint `oTokens`. On `Compound`,
    insurance providers can create `oTokens` in either `USDC` or `DAI`.


    Following the issuance of `oTokens`, there are two exciting ways to earn premium:


    ### 1. Being a Uniswap Liquidity Provider

    As a Uniswap Liquidity Provider, you can earn transaction fees from those who
    purchase and sell on the `Opyn` platform via `Uniswap`. Liquidity providers can
    earn a significant but unpredictable return by supplying liquidity on `Uniswap`.
    Liquidity Providers can withdraw funds at any time. Our Uniswap section explains
    how to supply liquidity on `Uniswap`.


    ### 2. Offering oTokens for sale on Uniswap

    The minted `oTokens` can be purchased on `Uniswap`. To compute the Annual Percentage
    Rate for selling `oTokens` on `Uniswap`, go to `Opyn`''s main dashboard and subtract
    the difference between the uninsured yield and the insured yield, which is what
    a user would give up to get covered. As of this writing, the Annual Percentage
    Rate on `DAI` is 1.22 percent, and on `USDC`, it is 2.61 percent.


    The premiums that can be generated on `ETH` collateral are the highest in Defi.
    Earning this yield, however, is not without danger. The option seller assumes
    the risk that there will be no calamity occurrence by selling the `Put` option
    for a yield (e.g., technical risks like a hack, financial risks like `DAI` breaking
    its peg, or a run on `Compound`). To avoid liquidation, one must additionally
    maintain a collateral ratio of more than 160 percent.


    ### Is Opyn risk-free?

    `Opyn` has a publicly verifiable smart contract audited by `OpenZeppelin`, a smart
    contract auditing business. `Opyn` is also noncustodial and trustless, relying
    on incentives to function.


    REMEMBER: Because the pricing of `oTokens` is influenced by demand and supply,
    this can be used as a signaling mechanism to discover if something is wrong with
    `Compound`. If people feel that a black swan event will occur on `Compound`, they
    will begin purchasing more `oTokens`, causing the `oTokens''` price will rise.


    Finally, the decision to insure or not to insure is ultimately up to you, the
    user. However, you’re strongly advised to obtain insurance because you never know
    what can happen, especially in the still-nascent Defi marketplaces.


    # Sixteen

    Given the industry''s nascency, many of these strategies contain significant risk
    (detailed in the section titled “Risk Factors” below) and require sophisticated
    technical knowledge to execute.


    ## 1. LIQUIDITY MINING & YIELD FARMING

    Liquidity mining and yield farming enable holders of digital assets to generate
    yield by earning rewards through a particular protocol. The processes entail lending
    one’s cryptocurrency and locking up the assets in a smart contract to generate
    an additional return on a cryptocurrency investment (traditionally, these strategies
    have been built on `Ethereum`, but recently we have witnessed the growth of alternative
    platforms like the `Binance Smart Chain` platform).


    Strategy implementation: Typically, the yield farming process is executed as follows:


    #### Step 1

    Add funds to a smart contract; typically, liquidity pools underlie lending markets
    or decentralized exchanges. Liquidity pools are smart contracts with aggregated
    funds from various lenders to facilitate lending, borrowing, and trading on a
    Defi platform. Example: If you are long `$ETH`, you can deposit your `$ETH` in
    a decentralized protocol like `AAVE`.


    #### Step 2

    Receive a piece of the fees generated from the Defi platform (referred to as ‘rewards’).
    In a lending model, lenders that provide liquidity are paid an interest rate.
    In decentralized exchange models, users can trade against the pools of aggregated
    liquidity, and liquidity providers receive a pro-rata portion of the trading fees
    as a result.


    #### Step 3

    Platforms require deep liquidity to function properly and scale. As such, many
    platforms are currently incentivizing users to provide liquidity through ‘incentive
    rewards.’ In the case of lending markets, such as `Compound`, users who lend or
    borrow also receive 1-5% of the amount paid in `Compounds’` native governance
    token `COMP`. In liquidity pools, liquidity providers can also stake their `LP`
    tokens (essentially a depository receipt) and receive additional governance tokens.
    These governance tokens offset borrowing costs, provide additional yield, and
    allow for more complex composable strategies.


    Example: Once the `ETH` has been sent to the `Compound` platform, the lender will
    receive `COMP` tokens as a reward for contributing liquidity. Below is An example
    visual of the liquidity mining process.


    1. Crypto holder deposits assets into a liquidity pool.

    2. The liquidity pool provides the assets for trading, lending, and borrowing
    via the Defi platform.

    3. As a result of the services, the crypto holder shares in the fees for services
    performed in step #2 and additional rewards if applicable.


    Deposit reward tokens received in step #2 into other liquidity pools for additional
    yield. Yield can be optimized by analyzing a variety of platforms to improve diversification
    or adjust your risk. This process of financial engineering across various Defi
    platforms to maximize return is known as yield farming. `Yearn Finance` (`$YFI`)
    has emerged to automate the yield farming process management with vaults.


    ### Key Risk Factors: At the protocol layer, the following risk factors are peculiar.

    The risk factors below are not meant to be comprehensive; however, they represent
    key weaknesses in Defi infrastructure that have been or can be taken of. We expect
    more sophisticated techniques to be deployed in the future as these platforms
    continue to blossom.


    It is necessary to monitor and analyze positions before entry, during the holding
    period, and after an exit to maintain a sustainable allocation to Defi.


    ### Smart Contract functionality risk

    In short, this is the ability for smart contracts to function as expected or as
    marketed to the community. Added complexity in the underlying code creates opportunities
    for bad actors to profit from errors and bugs. Given the decentralized nature
    of Defi transactions, it is impossible to reverse a transaction once it is memorialized
    on the blockchain. Such contract failure risk can be mitigated by bringing in
    third-party audit firms (such as `Consensys` or `CoinFabrik`, even `PwC` now offers
    smart contract audit services). Further, these platforms are constantly evolving;
    understanding migration risk for token upgrades is essential to avoid asset loss
    (e.g., pausing smart contracts on `Ocean token`).


    ### External call function risk

    An attack vector focused on a smart contract’s interaction with an external source
    of information, such as a pricing oracle. Pricing oracles, specifically, can be
    manipulated by dumping and are susceptible to low levels of liquidity.


    ### ‘run-on-the-platform’ risk

    Platform users depend on sufficient liquidity and interest rate pricing to ensure
    platforms have enough tokens to meet demand. For example, a utilization rate,
    much like a reserve requirement for banks, determines how much liquidity a platform
    (defined as the total percentage of staked assets that have been lent out) can
    bear before being rendered illiquid.


    ### Frontrunning risk

    '
  trans: '

    要做到这一点，首先需要提供 `ETH` 作为 `Opyn` 智能合约的抵押，最小质押比例为 160%，以铸造 `oTokens`。在 `Compound`
    上，保险提供商可以使用 `USDC` 或 `DAI` 创建 `oTokens`。


    在发行 `oTokens` 后，有两种兴奋的方式赚取溢价：


    ### 1. 成为 Uniswap 流动性提供者

    作为 Uniswap 流动性提供者，你可以从通过 `Uniswap` 在 `Opyn` 平台上买卖的用户那里获得交易费。流动性提供者通过在 `Uniswap`
    上提供流动性可以获得显著但不可预测的回。流动性提供者可以随时提取资金。我们的 Uniswap 章节解释了如何在 `Uniswap` 上提供流动性。


    ### 2. 在 Uniswap 上出售 oTokens

    铸造的 `oTokens` 可以在 `Uniswap` 上购买。要计算在 `Uniswap` 上出售 `oTokens` 的年化率（APR），请前往 `Opyn`
    主仪表板，减去未保险收益与保险收益之间的差额，这就是用户为了获得保障而放弃的收益。截至本文发布，`DAI` 的年化率为 1.22%，`USDC` 为 2.61%。


    在 `ETH` 抵押品上产生的溢价是 DeFi 中最高的。然而，获得这种收益并非没有危险。期权卖者通过出售 `Put` 期权来获取收益，承担了不会发生灾难的风险（例如技术风险如黑客、财务风险如
    `DAI` 脱锚，或对 `Compound` 的挤兑）。为了避免清算，必须额外维持超过 160% 的抵押率。


    ### Opyn 是无风险的吗？

    `Opyn` 拥有经过智能合约审计公司 `OpenZeppelin` 审计的公开可验证智能合约。`Opyn` 也是非托管且去信任的，依赖激励机制来运行。


    记住：由于 `oTokens` 的定价受供需影响，这可以被用作信号机制，来发现 `Compound` 是否存在问题。如果人们认为 `Compound` 将发生黑鹅事件，他们将开始购买更多
    `oTokens`，导致 `oTokens` 的价格上涨。


    最后，是否保险的决定最终取决于你，用户。但是，强烈建议你获得保险，因为你永远不知道会发生什么，特别是在处于婴儿阶段的 DeFi 市场中。


    # 十

    考虑到行业的早期阶段，这些策略中的许多包含重大风险（详见下文“风险因素”章节），并需要复杂的专业知识来执行。


    ## 1. 流动性挖掘与收益耕作

    流动性挖掘和收益耕作让数字资产持有者通过特定协议获得的奖励来产生收益。这些过程涉及出借加密货币并将资产锁定在智能合约中，以产生加密货币投资的额外回报（传统上，这些策略建立在
    `Ethereum` 上，但最近我们见证了如 `Binance Smart Chain` 等替代平台的增长）。


    策略实施：通常，收益耕作过程执行如下：


    #### 第一步

    向智能合约添加资金；通常，流动性池是贷款市场或去中心化交易所的底层。流动性池是汇总了来自各种贷款人的资金的智能合约，用于促进 DeFi 平台上的贷款、借贷和交易。例如：如果你看多
    `$ETH`，可以将你的 `$ETH` 存入 `AAVE` 等去中心化协议。


    #### 第二步

    接收来自 DeFi 平台生成的费用的一部分（称为“奖励”）。在贷款模型中，提供流动性的贷款人将获得利率。在去中心化交易所模型中，用户可以与聚合流动性池进行交易，流动性提供者按比例获得交易费。


    #### 第三步

    平台需要深度流动性才能正常运行和扩展。因此，许多平台目前正在通过“激励奖励”鼓励用户提供流动性。在像 `Compound` 等贷款市场中，贷款或借贷的用户还将获得
    1-5% 的 `Compounds` 原生治理代币 `COMP`。在流动性池中，流动性提供者还可以质押他们的 `LP` 代币（本质上是存款证明）并获得额外的治理代币。这些治理代币抵消了借成本，提供了额外收益，并允许更复杂的组合策略。


    示例：一旦 `ETH` 发送到 `Compound` 平台，贷款人将获得 `COMP` 代币作为贡献流动性的奖励。以下是流动性挖掘过程的示例图。


    1. 加密货币持有者将资产存入流动性池。

    2. 流动性池通过 DeFi 平台提供交易、贷款和借贷的资产。

    3. 作为这些服务的结果，加密货币持有者分享步骤 #2 中执行服务的费用以及（在适用的情况下）额外奖励。


    将第二步中收到的奖励代币存入其他流动性池以获得额外收益。可以通过分析各种平台来优化收益，以提高多样性或调整风险。这种在各种 DeFi 平台之间进行金融工程以实现收益最大化的被称为收益耕作（Yield
    Farming）。`Yearn Finance` (`$YFI`) 的出现是为了通过金库自动化收益耕作过程的管理。


    ### 关键风险因素：在协议层，以下风险因素是特殊的。

    下方的风险因素并非详尽；然而，它们代表了 DeFi 基础设施中已经或可以被利用的关键弱点。我们预计随着这些平台的继续蓬勃发展，未来将部署更先进的技术。


    在入场前、持有期间和退出后，必须对仓进行监控和分析，以维持 DeFi 的持续配置。


    ### 智能合约功能风险

    简而言之，这是智能合约按照预期或向社区承诺的方式运行的能力。底层代码复杂性的增加了坏分子从错误和漏洞中获利的机会。鉴于 DeFi 交易的去中心化性质，一旦在区块链上记录，交易就无法撤销。此类合约故障风险可以通过引入第三方审计机构（如
    `Consensys` 或 `CoinFabrik`，甚至 `PwC`  现在也提供智能合约审计服务）来缓解。此外，这些平台在不断演变；理解代币升级的迁移风险对于避免资产损失至关重要（例如暂停
    `Ocean token` 上的智能合约）。


    ### 外部调用函数风险

    这是一种专注于智能合约与外部信息源（如价格预言机）交互的攻击向量。价格预言机，特别是，可以通过倾倒进行操纵，并容易受到低水平流动性的影响。


    ### “平台挤兑”风险

    平台用户依赖于足够的流动性和利率定价，以确保平台有足够的代币满足需求。例如，利用率（类似于银行的准备金要求）决定了平台（定义为已出借资产的总百分比）在变得流动性枯竭之前可以承受的流动性。


    ### 抢跑风险

