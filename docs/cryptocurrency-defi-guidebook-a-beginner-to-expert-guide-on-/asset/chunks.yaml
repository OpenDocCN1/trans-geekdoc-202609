- raw: 'Inefficiencies in the Ethereum network have made platforms built on ETH susceptible
    to frontrunning attacks where algorithmic arbitrage traders can see your transaction
    in the meme-pool and front-run it by sending an ETH transaction with a higher
    gas fee, so you pay a higher price for the coin. Like traditional markets where
    a rogue trader may invest before knowledge of a significantly larger allocation
    about to hit the market, attackers can nullify, modify, or even manipulate transactions
    to their benefit. Platforms have implemented policies to mitigate this risk by
    establishing policies such as FIFO, third-party signers, randomized mining, and
    transaction chaining to mitigate risks with front-running.


    ***Human risk***


    Access to Defi platforms is overly complex, certainly more than opening a bank
    account and managing your passwords. Losing your private keys, falling victim
    to a phishing attack, or falling victim to a SIM swap attack could cause you to
    lose access to your digital assets. Thoughtful processes and procedures are required
    to store assets.


    ***Regulatory Risk***


    KYC, AML, and taxes are all important regulatory obstacles that specific countries
    will have to overcome for Defi to thrive in the future. While both established
    and developing economies are seeing tremendous growth, regulation may have a chilling
    impact on capital allocation. In the United States, former Comptroller of the
    Currency Brian Brooks noted that "our current bank regulations exist primarily
    to prevent human failings..." and that "in the absence of federal regulatory clarity,
    US states rush to fill the void and create a patchwork of inconsistent rules that
    obstruct the orderly development of a national market."


    When you look at the global landscape, inconsistency in regulation could either
    cripple growth of the industry and accelerate conflict between sovereign states
    and the enterprises that operate within their jurisdictions. Another key factor
    in regulatory risk is to determine the level of decentralization in any platform.
    Platforms like Compound still enable holders of an admin key to access digital
    assets allocated to smart contracts. The degree of centralization can also influence
    interest rates, liquidity, and manipulation.


    ***Opaqueness Risk***


    Having great insight beyond the code is important when determining opportunities.
    Insight into the quality and quantity of the engineering team, strategic direction
    with respect to rewards and governance, and how a project is communicating with
    users are all important factors to consider. Given the collaborative nature of
    the industry, reviewing message boards and white papers can give you an edge with
    respect to a project''s probability of success and an understanding of who else
    believes in the opportunity. Typically, the more successful projects have greater
    transparency, well-known investors, and a raucous following.


    ***Impermanent Loss Risk***


    The impact of price volatility on the assets you lent to a liquidity pool. One
    must understand this risk factor and how automated market makers ("AMM") set prices.
    While many systems are now evolving, Uniswap’s AMM has become increasingly popular.
    Each pool sets the price for assets based on the ratio of two assets. For instance,
    an ETH-Dai pool may include 10 ETH and 15,000 Dai (meaning each unit of ETH will
    be priced at 15,000 Dai / 10 ETH = 1,500 Dai). Now, let us assume that the value
    of ETH increased from 1 ETH = 1,500 Dai to 1 ETH = 2,000 Dai. In this situation,
    traders would have been adding Dai to the pool and removing ETH to increase the
    spread in the ratio.


    Alternatively, if prices were to decline, traders would add ETH and withdraw Dai.
    The ultimate premise is that the total dollar value of the pool remains constant
    over time.


    Back to the scenario where prices increase, the initial investment for each unit
    of ETH would have been 1 ETH and 1,500 Dai (representing 10.0% of the total pool
    for a total value of $3,000). To reach a price of 1 ETH = 2,000 Dai, investors
    would have had to add Dai and remove ETH. In this particular case, the pool would
    change from 15,000 Dai and 10 ETH (ratio of 1,500:1) to approximately 17,193 Dai
    and 8.6 ETH (ratio of 2,000:1).


    An investor withdrawing their assets from the pool at maturity would be able to
    take out 10.0% of the liquidity pool: 1,719.3 Dai and 0.86 ETH (valued at 2,000
    = 1,720 Dai) = 3,439 Dai.


    If the investor chose to hold the ETH instead of contributing it to the liquidity
    pool, the value would be 1 ETH = 1,500 Dai \* (2,000 / 1,500) = 2,666 Dai + 1,500
    Dai = 4,166 Dai.


    The investor’s impermanent loss in this case is 3,439 Dai / 4,166 Dai = 17.4%.
    Typically, the magnitude of the losses is greater with a larger dollar equivalent
    investment and greater price volatility.


    Liquidity pools hope to mitigate the risk by sharing in the fees from trading
    activity linked to the liquidity pool that one lent to. Emerging protocols attempt
    to meet this challenge through novel concepts such as risk distribution or greater
    ROIs, each decision with tradeoffs between speed, security, and interoperability.
    For example, Bancor is now offering single-sided exposure to liquidity pools with
    impermanent loss protection that sets in after 90 days.


    ## 2\. ARBITRAGE: OVERVIEW & STRATEGY IMPLEMENTATION


    A general arbitrage (colloquially referred to as ‘arb’) strategy involves taking
    advantage of price discrepancies in different markets.


    In traditional markets, forex trading has popularized arb trading where there
    may be price inconsistencies among 3 (or more) currencies, known as triangular
    arbitrage.


    For example, assume the following prices at the following financial services organizations:


    Company ABC: USD / MXN: 20.14


    Company EFG: USD / CAD: 1.28


    Company MXN / CAD: 0.063


    If an investor is looking to profit on a 1,000 MXN trade, they may:


    1.  Convert 1,000 MXN to Dollars at a rate of 20.14. This would translate to 1,000
    MXN / 20.14 conversion ratio = $49.65.


    2.  Convert the dollars to CAD at a rate of 1.28. This would translate to $49.65
    \* 1.28 conversion rate = 63.65 CAD.


    3.  Finally, convert back to MXN at a rate of 0.063. This would translate to a
    63.65 CAD / 0.063 conversion ratio = 1,010.32 MXN.


    (Note: Actual figures are not quoted, figures ABOVE are exaggerated to demonstrate
    the trading strategy.)


    The return for this strategy would be 1.0% (1,010.32 MXN / 1,000 MXN – 1) and
    would be implemented by taking advantage of pricE fragmentation among the three
    institutions.


    Over the decades, improved forex trading liquidity has minimized arbitrage opportunities
    through increased competition, lower spreads, and the diversity of traders. Taking
    advantage of these discrepancies now requires advanced trading technologies, leverage,
    and engineering sophistication.


    Defi platforms provide investors with multiple venues with significant price fragmentation
    to take advantage of. Defi arb strategies can be broken down into two categories:
    Yield arb and cross-exchange arb.


    **Exchange Arbitrage**


    Given the early-stage nature of the Defi industry, increased fragmentation has
    provided arb traders an inefficient market ripe for short-term trading opportunities.
    Highly sophisticated trading bots constantly scan for opportunities to execute
    triangular arbitrage strategies for high probability trades. Investors today utilize
    two primary strategies on Ethereum: (i) atomic batch-based processing of transactions
    to implement strict limit order controls on the pricing between exchanges, meaning
    the trades do not execute unless you get the fill on your trade or (ii) priority
    gas auctions where investors attempt to benefit from constantly modifying gas
    fees to miners to execute a particular trade up until the point of profitability.'
