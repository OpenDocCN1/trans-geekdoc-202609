    实际上，严格格式化提供的文本：


    ## SYNTHETIX


    `Synthetix` 正如其名，基于以太坊的合成资产（称为 `Synths`）协议。`Synthetix` 由两部分组成：合成资产 (`Synths`）和它的交易所
    `Synthetix Exchange`。`Synthetix.Exchange` 允许 `Synths` 的创建和交易。


    ### 什么是合成资产 (Synths)？


    `Synths` 与另一物品具有相同价值或影响的资产或资产组合。`Synths` 遵循底层资产的价值，并提供风险敞口，而无需持有实际资产。


    目前可用两种类型的 `Synths`：普通 `Synths` 和反向 `Synths`。普通 `Synths` 与底层资产正相关，而反向 `Synths`
    则为反向相关。


    合成黄金 (`sXAU`) 是合成资产的一个示例，因为它跟踪黄金的价格表现。`Synthetix` 使用 `Chainlink` 跟踪现实资产价值，这是一种智能合约预言机，它从多个信任的第三方来源收集价格信息以防止篡改。


    反向比特币 (`iBTC`) 是反向合成资产的示例，因为它遵循比特币的反向价格表现。每个反向 `Synths` 都有三个关键值：入场价、下限和上限。


    例如，考虑反向合成比特币 (`iBTC`)。假设比特币 (`BTC`) 在形成时的价格为 10,600 美元——这将是入场价。如果比特币从 10,600 美元下跌到
    10,200 美元，`iBTC` Synth 的价值将增加 400 美元，定价为 11,000 美元。反之亦然。如果比特币达到 11,000 美元，`iBTC`
    Synth 现在的价值为 10,200 美元。


    反向 `Synths` 在相对于入场价上下 50% 限制的范围内交易。这限制了你在反向 `Synths` 上可以获得的最大利润或损失。当达到任何限制时，代币的汇率将冻结，头将被清算。这些反向
    `Synths` 只有在禁用并清算后才能在 `Synthetix` 进行交换。在这些预设值处你可以进行交换。它们将使用新的限制重置。


    ### 为什么使用合成资产？


    如前所述，`Synths` 为交易者提供了资产的价格敞口，而无需持有底层资产。合成黄金 (`sXAU`) 让交易者能够比普通的黄金经纪更方便地参与市场（无需注册、无需旅行、没有中间人等）。


    合成资产的另一个优势是它们可以无摩擦地交易，这意味着合成黄金可以在 `Synthetix.Exchange` 上轻松兑换合成日元、合成银或合成比特币。这意味着任何拥有以太坊钱包的人现在都可以无限制地访问任何现实资产！


    ### Synths 是如何创建的？


    创建 `Synths` 的概念与在 `MakerDAO` 上创建 `DAI` 的概念相似。（注：此处提供的文本重复/不完整，我保持了核心逻辑）。


    ### Synths 支持哪些资产？


    在编写时，`Synths` 支持主要的资产类别：


    1. 加密货币：`ETH`、`BTC`、`BNB`、`XTZ`、`MKR`、`TRX`、`LTC`、`LINK`。

    2. 商品：`XAU`、`SLV`、`XAG`。

    3. 法币：美元、澳元、瑞士法、日元、欧元、英镑。

    4. CEX 和 DeFi


    ### 指数资产 (Index Synths)


    `Index Synths` 是 `Synthetix` 上可以的最有趣的 `Synths` 之一。在编写时，有两种 `Index Synths`：`sCEX`
    和 `sDEFI`。


    ### sCEX


    `sCEX` 是一种指数资产，旨在为交易者提供加权市值的中心化交易所 (CEX) 代币敞口。`sCEX` 指数包括 `BNB`、`LEO`、`HT`、`OKB`
    和 `KCS`。


    ### sDEFI


    为了应对对 DeFi 的兴趣增加，推出了 `sDEFI`，为交易者提供 DeFi 工具代币的的指数敞口。目前的 `sDEFI` 指数 `LINK`、`MKR`、`0RX`、`SNX`、`REN`、`LRC`、`KNC`、`BNT`
    和 `MLN`。


    ## Synthetix Exchange


    `Synthetix Exchange` 是一个去中心化交易所平台，用于交换 `SNX` 和 `Synths`，而不使用大多数 DEX 使用的订单簿。与点对点系统（`Uniswap`
    或 `dYdX`）不同，`Synthetix` 不依赖用户提供流动性。用户可以直接与具有适当恒定流动性的合约交易，理论上减少了滑点或缺乏流动性的风险。


    ### 十


    监控你的资产并控制其现金流以获得投资回报的过程被称为资金管理。我们看到创新的 DeFi 团队开始开发让用户以更去中心化的方式管理资金的方法。

