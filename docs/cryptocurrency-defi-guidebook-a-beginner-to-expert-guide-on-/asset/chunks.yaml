- raw: 'The Defi ecosystem as a whole is estimated to be worth roughly $1 billion.
    Today, the majority of this is provided through MakerDAO. If we use token market
    capitalization as a proxy, it is worth less than 1% of the overall ecosystem,
    based on the total market capitalization of $173 billion. However, decentralized
    banking is one of the few areas where a tokenized product is used regularly. It
    can restore utility tokens'' "utility." Decentralized finance has the potential
    to enable applications that were thought to be achievable in 2013 but difficult
    to develop due to scaling issues and volatility. The advent of reliable tokens,
    payment systems, and lending platforms might create opportunities for businesses
    worldwide and bring our financial markets closer together while enhancing transparency.
    While there is significant systemic danger in these systems (e.g., Dai locked
    up with eth, used to buy Eth), they provide an alternative to the banks, which
    may have put an entire generation in jeopardy with their CDOs in 2008. It is far
    too early to declare any of them the clear victors. However, it may be premature
    to conclude that Defi will not add value to the ecosystem.


    When entrepreneurs traveled far and wide in pursuit of new opportunities 400 years
    ago, they issued stock as a method for individuals to share the risks and rewards
    of new companies. It democratized access to wealth-creation tools. When Satoshi
    Nakamoto released the Bitcoin code ten years ago, he developed a financial system
    that ensured an individual''s money stayed theirs.


    Decentralized finance is the natural progression of the same. It has the potential
    to bring our markets closer together than ever before, to eliminate needless middlemen,
    to provide significant cost efficiencies, and to open access to populations that
    have previously been underserved.


    It, like the web, will first serve a privileged few, but its benefits will be
    passed on to an entire generation of underserved consumers who may never have
    had access to loans or the ability to make international payments. If macro trends
    such as the gig economy and globalization continue, the necessary financial infrastructure
    must be put in place.


    We have our first true shot at making it happen with decentralized money. When
    Satoshi published Bitcoin''s whitepaper, banks were on the verge of yet another
    bailout. Decentralized finance expands on his idea of providing individuals with
    dignity, sovereignty, and transparency over the storage and investment of their
    hard-earned money. It isn''t the establishment''s anti-banking stance. It is the
    consumer-friendly option.


    And by constructing it, one is not undermining the power of the government or
    banks but rather enabling the common man to have an option in an ecosystem where
    none has existed for millennia.


    ## THE DEFI USER EXPERIENCE


    While access to Defi apps may be a non-issue, the whole user experience remains
    one of DeFi''s key pain points. Having said that, numerous teams throughout the
    world are working hard to improve the experience. Examine some of them and the
    problems they are seeking to solve:


    Wallet: Argent is developing a dramatically improved user-focused crypto wallet
    experience, including free Ethereum transactions without the requirement for ETH,
    native integration with Compound (and others), and the elimination of seed keys.


    Product participation: DeFiZap abstracts away many of the intricacies and stages
    required with Defi products, allowing customers to access various financial products
    in a single transaction, saving time and effort.


    Gelato Finance has announced their “If this, then that” cryptocurrency development.
    It essentially allows users to define actions that will be carried out when specific
    criteria are satisfied, such as "Buy ETH when it is $200" or "Send some money
    to Alice on her birthday."


    Insurance: The financial market successfully facilitates risk transfer. Another
    person''s profit is another person''s hedge against his position. As previously
    discussed, insurance is now available through Nexus Mutual or Opyn. If you''re
    prepared to accept a lower yield on money you''ve put into lending mechanisms
    like Compound in exchange for peace of mind, it''s now possible.


    Liquidity aggregation: There are numerous decentralized exchanges (DEXes) in the
    market, each with differing liquidity, making it difficult for customers to determine
    which one is ideal for their trade. With liquidity aggregators like 1inch.exchange,
    Paraswap, and DEX.AG that help to automatically divide orders between DEXes to
    assure the best possible prices, this is progressively becoming a thing of the
    past.


    Yield optimization: Do you remember shopping around for the greatest rates on
    fixed deposits at various banks? In Defi, yield bouncers like idle.finance, DeFiSaver,
    and iEarn automatically distribute your crypto assets to the Ethereum blockchain
    locations with the best yield possibilities.


    While there is currently no single "killer app" that bridges the user experience
    divide, we believe it is not far away!


