- raw: "Liquidity pool reserves are provided by liquidity providers who are encouraged\
    \ to earn a proportionate fee of the Uniswap transaction cost of 0.3 percent.\
    \ This cost is applied to each token swap on Uniswap.\n\nThere are no limits,\
