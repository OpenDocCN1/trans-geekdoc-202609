- raw: 'Most financial regulatory regimes focus on those “carrying on business” in
    a certain regulated activity, “dealing,” “arranging,” or “operating” some scheme
    or exchange or “issuing” an offer (or similar).


    Historically, the relevant government entity was relatively clear and focused
    on who ultimately controls an operation. Similarly, service providers often have
    exemptions that merely provide infrastructure, data, or other tools to enable
    others to layer on their financial services. Frameworks contemplate definable
    and centralized operators that are engaged in providing particular financial end
    products and services but are not necessarily the underlying builders.


    In the Defi context, however, there may be no central entity performing the relevant
    activities. The software developers and token holders may be readily identified,
    but individuals who work in conventional regulatory touchpoint positions are not.
    And even when operators can be identified, they may lack the ability to modify
    Defi services or stop transactions because of the decentralized nature of the
    protocols. Smart contracts may interact with assets owned by other smart contracts
    that aren''t linked to a specific user. Regulators must determine who is accountable
    and when a center of responsibility must be established. Even when services are
    ostensibly decentralized, it may be feasible to do so via careful analysis.


    Legal regimes often include mechanisms for vicarious secondary “controlling person,”
    “responsible officer,” or aiding-and-abetting liability based on requirements
    such as knowledge or foresight of harmful consequences. Suppose developers of
    a Defi service or others associated with the Defi business could have identified
    and mitigated legal compliance risks. In that case, policy-makers will need to
    consider whether it is appropriate to mandate that they should have. On the other
    hand, regulating the creation of software raises important concerns of freedom
    of speech and administrability, which should be considered carefully. Defi regulation
    at the national or subnational level is further complicated by the transnational
    nature of blockchain networks and digital assets.


    There are many ways for a policy-maker to approach new financial services or products.
    Below, we first identify some helpful steps regulators have taken to respond to
    the rise of digital assets and token offerings.


    **AVAILABLE POLICY TOOLS**


    **1\. Transitional mechanisms**


    While not completely analogous, how digital assets were originally handled may
    influence policy approaches. Few authorities lacked institutions or expertise
    suitable for purpose during the 2017 initial coin offerings (ICOs) boom, as significant
    capital flowed into new platforms that purported to be beyond the regulatory perimeter.
    In the context of Defi, some of the first answers may be helpful.


    ***Specialized regulatory units:***


    A targeted desk with qualified staffing can serve as an initial gateway to gaining
    new technology experience, interacting with the industry, and providing guidance.
    This knowledge can be shared with policy-makers, and actions may include issuing
    no-action letters under existing regulatory regimes. These groups may provide
    legal clarity to Defi projects and encourage early-stage discussions with regulators.
    Regulators should also invest in technology and technical expertise to understand
    these markets more effectively. Many jurisdictions have used this approach. For
    example, the US Securities and Exchange Commission (SEC) created its FinHub unit
    (upgraded to a formal stand-alone office in late 2020), while Switzerland’s financial
    regulator, FINMA, created the FinTech Desk. Though initially small and limited
    in authority, they quickly became an important point of contact for both internal
    and external communities.


    ***Incentivizing information flow:***


    Disclosure is one of the most common tools of financial regulation. Even when
    the applicability of existing disclosure requirements on Defi platforms is uncertain,
    efforts to encourage broad and consistent information disclosure may prove fruitful
    for regulatory analysis.


    The Monetary Authority of Singapore focused a significant portion of its regulation
    of ICOs on reviews of white papers.


    ***Regulatory sandboxes:***


    Policy-makers may decide to establish regulatory forbearance programs such as
    sandboxes, where companies may test and operate their technology in a limited
    scope and therefore with limited regulatory risks. The scope of such regulatory
    “carve-outs” can be defined by activities, financial thresholds, territorial or
    customer limits and combined with reporting duties to ensure that the regulatory
    authority gains experience in new technology, interacts with the industry, and
    reacts if new risks arise. However, a lack of transparency from the regulatory
    authority about the trajectory may inadvertently stifle innovation, and there
    may be business risks involved for startups building in sandboxes without explicit
    safe harbors. The sandbox allows start-ups to resolve regulatory compliance issues
    while also providing regulators with a better knowledge of the risks and advantages
    of entering a new market.


    A Defi sandbox might go beyond the prior models by establishing a means of monitoring
    the trajectory for projects looking to decentralize control over time to address
    some concerns without creating new ones. The UK Financial Conduct Authority (FCA)
    established a sandbox regime for fintech that included a substantial number of
    blockchain and digital asset services. However, it has had limited applicability
    for Defi because stablecoins are considered to


    be outside the FCA’s scope. Others, such as Colombia´s “la Arenera” sandbox, have
    followed this approach as well. Defi sandboxes will need to be designed carefully
    to avoid prematurely signaling approval from the regulator.


    A variation of this approach is a regulation-free zone, as implemented in Busan,
    South Korea. Under this model, specific jurisdictions within a country may allow
    companies to operate under a limited set of regulations (often not fully “regulation-free”)
    to allow for innovation and testing of services.


    ***Clarifying easy cases.***


    There will always be some new activities that raise regulatory red flags, some
    that do not, and others that are in grey areas. Sometimes, policy-makers and regulators
    can narrow the zone of uncertainty and incentivize compliance activities by taking
    on the easier cases first, especially those where intervention is not warranted.
    A more formal approach for distinguishing easy cases is a safe harbor policy that
    explicitly excludes from regulation services that meet defined criteria. In the
    ICO case, the US SEC’s first official statement was the 2017 investigative report
    on the DAO. It clarified that bitcoin was not considered security but a token
    created for investment purposes. Further, because the DAO had already shut down,
    there was no need for enforcement action. Though it left many questions unanswered,
    the report clarified the SEC’s approach and its concerns, facilitating further
    dialogue.


    ***Coordinating government action.***


    In certain instances, bringing together various government agencies for a coordinated
    response may be beneficial. The revision of the “Volcker Rule” by five federal
    regulatory agencies (the Federal Reserve Board, the Federal Deposit Insurance
    Corporation \[FDIC\], the Office of the Comptroller of the Currency \[OCC\], the
    Commodity Futures Trading Commission \[CFTC\], and the SEC) in the United States
    is an example.


    This isn''t meant to be a complete list, nor does it presuppose the direction
    in which the policy-makers will eventually go. These techniques are equally relevant
    if Defi services are ultimately found to be covered by existing requirements,
    outside the regulatory perimeter, or subject to new, bespoke rules.


    **2. Regulation throughout the life cycle**'
