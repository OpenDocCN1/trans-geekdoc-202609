  trans: "\n\n加密货币最重要的功能之一是允许双方之间进行去中心化且无需信任的资金转移。随着 `Defi` 变得越来越流行，越来越多的创新支付机制正在被开发和测试。\n\
    \n本书讨论的一项 Defi 倡议试图通过将支付重新定义为“流”而非传统的“交易”，来改变我们对支付的认知。以流的形式提供支付的能力为资金开辟了许多可能性。想象一下“按需付费”，但规模要小得多且准确性更高。\n\
    \n`Defi` 的诞生和创新速度无疑为支付的运作方式提供了新的思考角度，解决了当前金融系统的许多缺陷。\n\n七\n\n## 什么是以太坊（Ethereum）？\n\
    \n以太坊区块链目前正用于构建大多数的 `Defi Dapps`。但是，以太坊究竟是什么？`Ethereum` 是一个在全球范围内开源的去中心化应用平台。可以将其看作一台无法关闭的全球计算机。在以太坊上，软件开发者可以根据一组标准创建控制数字货币的智能合约，这些合约可以从世界上任何地方访问。\n\
    \n本书还将介绍提供金融服务的去中心化应用（`Dapps`），也称为 `Defi`。这些 `Dapps` 的构建区块是由软件程序员编写的智能合约。以太坊网络随后部署这些智能合约，每天\
    \ 24 小时不停地运行。网络将跟踪最新状态并维护数字价值。\n\n## 什么是智能合约？\n\n智能合约是一种可编程合约，允许双方在不依赖第三方执行交易的情况下对交易参数达成一致。例如，如果阿里（Alice）希望创建一个基金，在未来\
    \ 12 个月内每月向鲍（Bob）支付 100 美元，她可以设计智能合约来实现以下操作：\n1. 验证当前日期。\n2. 每月初自动向鲍发送 100 美元。\n\
    3. 重复直到智能合约的资金耗尽。通过利用智能合约，Alice 消除了对信任的第三方中间人（律师、托管代理人等）将信任资金转移给鲍的需求，并且该过程对所有参与方都是可见的。\n\
    \n智能合约按照“如果……那么……”的逻辑运行。当满足特定条件时，智能合约将按照指定运行。多个智能合约连接在一起工作，完成更复杂的程序和计算，这被称为去中心化应用（`Dapp`）。\n\
    \n## 什么是以太币（Ether/ETH）？\n\n以太坊区块链的原生货币是 `ether`。它的功能类似于钱，并且像 `Bitcoin` 一样用于日常交易。你可以将\
    \ `Ether` 转给另一个人以市场价格购买商品和服务。以太坊区块链会跟踪交易并确保其完成。\n\n此外，`Ether` 被用于支付允许智能合约和 `Dapps`\
    \ 在以太坊网络上运行的费用。在以太坊网络上执行智能合约的一个合适对比是开车。你必须有燃料才能启动汽车。在以太坊上，你必须支付名为 `Gas` 的 `Ether`\
    \ 费用来执行智能合约。\n\n`Ether` 逐渐演变为其独特的储备货币和价值存储媒介。在 `Defi` 生态系统中，`Ether` 目前是作为许多 `Defi\
    \ Dapps` 底层抵押品的首选资产。它确保了金融系统的安全性和透明。如果这让你感到困惑，不要担心；我们将在书的后部分详细介绍。\n\n## 什么是 Gas（燃料）？\n\
    \n以太坊上的所有交易和智能合约执行都会产生少量的费用。这种费用被称为 `Gas`。`Gas` 是执行某操作或智能合约所需的计算量的技术术语。执行操作越复杂，所需的\
    \ gas 就越多。Gas 费用完全以 `ETH` 支付。\n\nGas 价格会根据网络需求不断波动。由于网络计算资源较低，如果有更多人在以太坊区块链上进行交互（例如进行\
    \ `ETH` 交易或执行智能合约操作），gas 价格可能会上涨。相反，当网络利用率不足时，gas 的市场价格会下降。\n\nGas 成本可以手动调整，当网络由于过度使用而过载时，gas\
    \ 价格最高的交易将优先通过验证。通过验证的交易将确定并添加到区块链中。如果支付的 gas 费用太低，交易将进入队列并可能需要一些时间才能完成。因此，低于平均\
    \ gas 费用的交易可能需要更长时间才能完成。\n\n## 什么是去中心化应用（Dapps）？\n\n在以太坊语境下，`Dapps` 是通过智能合约与区块链交互的接口。`Dapps`\
    \ 从外部看出现和行为类似于普通的网页和移动应用，但它们与区块链交互的方式不同。某些方法包括需要 `ETH` 来使用 `Dapp`、以不可更改的格式在区块链上存储用户数据等。\n\
    \n### Dapps 的优点是什么？\n\n`Dapps` 通常开发在以太坊等去中心化区块链网络之上，并提供以下益处：\n\n*   不可更改性：一旦信息在区块链上，就无法被更改。\n\
    *   防篡改：记录在区块链上的智能合约是防篡改的，这意味着更改时会通知所有参与者。\n*   透明性：驱动 Dapps 的智能合约是公开审计的。\n* \
    \  可用性：只要以太坊网络保持活跃，构建在上面的 `Dapps` 就会保持活跃和可用。\n\n### Dapps 的缺点是什么？\n\n虽然区块链有很多优点，但也有许多缺点：\n\
    \n*   智能合约由人类创建，质量取决于编写者。不可更改的智能合约会放大人为错误。\n*   透明性：由于黑客可以查看代码寻找漏洞，公开审计的智能合约也可能成为攻击向量。\n\
    *   扩展性：在大多数情况下，Dapp 的带宽受限于其运行的区块链。\n\n### 你还能用以太坊做什么？\n\n除了创建 `Dapps`，以太坊还可以用于创建去中心化自治组织（`DAO`）和发行其他加密货币。去中心化自治组织（`DAO`）是一种完全由代码而非单一个人控制的组织。基于智能合约，这种代码允许\
    \ `DAO` 取代传统组织的运行方式。由于它是基于代码的，因此不受人为干预并透明运行。`DAO` 代币投票将用于治理决策或裁决。\n\n在令牌方面，以太坊可以作为创建其他加密货币的平台。在以太坊网上，目前有两种流行的令牌协议：`ERC-20`\
    \ 和 `ERC-721`。`ERC-20` 是发行以太坊令牌的协议标准，规定了规则和标准。`ERC-20` 令牌是同质化的，可以相互交换并具有相同的价值。相反，`ERC-721`\
    \ 令牌是非同质化的，这意味着是唯一的且无法交换。\n\n八 \n\n钱包是与区块链交互的易用界面。它管理你的私钥，私钥是打开加密货币保险库锁的关键。\n\n"
