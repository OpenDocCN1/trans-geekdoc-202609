    Maker will continue to maintain Multi-Collateral Dai as the de-facto stablecoin
    standard, whereas SAI will be phased out and no longer supported. We''ll only
    use Multi-Collateral Dai (`DAI`) to walk through examples in the following sections
    to keep things simple.


    ## In What Way Does Maker Govern The System?


    Remember what we said about Decentralized Autonomous Organizations (DAO)? This
    is where the Maker (`MKR`) token comes into play. `MKR` holders have voting rights
    in the `DAO` proportional to the number of `MKR` tokens they own and can vote
    on Maker Protocol parameters.


    The parameters that `MKR` holders vote on are critical to maintaining the ecosystem''s
    health, which helps keep `Dai` pegged to $1. We will go over three key parameters
    that you will need to be aware of in the `Dai` stablecoin ecosystem:


    ### I. Collateral Ratio

    The collateral ratio determines the amount of `Dai` that can be minted.


    * Ether (`ETH`) collateral ratio = 150 percent

    * Basic Attention Token (`BAT`) collateral ratio = 150 percent. Essentially, a
    collateral ratio of 150 percent means that to mint $100, you must deposit at least
    $150 in `ETH` or `BAT`.


    ### II. Stability Fee

    It is equivalent to the ''interest rate'' that you are required to pay along with
    the vault''s principal debt. As of February 2020, the stability fee is set at
    8%.


    ### III. Dai Savings Rate (DSR)

    The Dai Savings Rate (`DSR`) is the interest paid on `Dai` that has been kept
    for some time. It also serves as a monetary tool to influence `Dai` demand. As
    of February 2020, the `DSR` rate is set at 7.50 percent.


    ## Motives for Issuing DAI

    Why would you want to lock up a higher value of `ETH` or `BAT` just to issue `Dai`
    with a lower value? Instead, you could have sold your assets in USD.


    There are three potential outcomes:


    1. You require funds immediately and have an asset that you believe will be worth
    more in the future. In this case, you could store your asset in the Maker vault
    and receive the funds immediately by issuing `Dai`.

    2. You require cash immediately but do not want to risk triggering a taxable event
    by selling your asset. You will instead obtain the loans by issuing `Dai`.

    3. Leverage in investment. You can use investment leverage on your assets if you
    believe the value of your assets will rise.


    ## What is the best way to get some Dai (DAI)?


    There are two methods for obtaining `Dai` (`DAI`):


    ### 1. Minting Dai

    Using a pawnshop analogy, we will demonstrate how `DAI` can be minted. Assume
    you need $10,000 in cash one day, and you only have gold bars worth $15,000 at
    home. Rather than selling the gold bars for cash, you go to a pawnshop and borrow
    $10,000 using your gold bars as collateral since you think the price of gold will
    increase in the future. For the cash loan, the pawnshop offers to give you $10,000
    at 8% interest. To complete the transaction, you both sign a contract agreement.


    To obtain the `DAI` narrative, let''s alter the terminology:


    * Gold bars (`Collateral`) = `Ether` or `Basic Attention Token` (`Collateral`
    – `Multi-Collateral Dai`)

    * Cash loan = `Dai` (`DAI`)

    * The pawnshop = `Maker`

    * Contract agreement = `Smart Contract` (`Vault`)

    * Loan interest = `Stability Fee`


    You will mint or ‘borrow’ `Dai` using the Maker platform and your `Ether` (`ETH`)
    or `Basic Attention Token` (`BAT`) as collateral. You must return your "loan"
    and the "loan interest," which is the stability charge when you wish to redeem
    your `ETH` or `BAT` after your loan. To give you a quick overview, let''s go over
    how to mint your own `Dai`.


    By putting `ETH` or `BAT` into the vault on the Maker platform (`www.oasis.app`),
    you can borrow `Dai`. Assuming that `ETH` is presently worth $150, you may deposit
    1 `ETH` in the vault and get a maximum of 100 `DAI` ($100) with a 150 percent
    collateral ratio.


    You should not withdraw the maximum of 100 `DAI` allowed but rather leave some
    buffer in case the price of `ETH` falls. It is best to leave a larger gap to ensure
    that your collateral ratio is always greater than 150 percent. This ensures that
    if the price of `ETH` falls and your collateral ratio falls below 150 percent,
    your vault will not be liquidated, and you will not be charged the 13 percent
    liquidation penalty.


    ### 2. Trading DAI

    The methods listed above are all methods for creating `DAI`. Once `DAI` is created,
    it can be sent anywhere. Some users may transfer `DAI` to cryptocurrency exchanges,
    and you may also purchase `DAI` from these secondary markets without having to
    mint them. Purchasing `DAI` in this manner is simpler because you do not have
    to lock up collateral and are not concerned with the collateral ratio or the stability
    fee.


    ## Why should you use Maker?


    There are a variety of stablecoins available, and the primary distinction between
    them is their protocol. Maker, unlike most stablecoin platforms, is entirely based
    on the distributed ledger. As a result, Maker has the characteristics of a blockchain:
    it is secure, immutable, and, most importantly, transparent. Furthermore, Maker''s
    infrastructures have strengthened the system''s security with comprehensive risk
    protocols and mechanisms based on real-time data.


    ## Ten


    The lending and borrowing of funds is one of the most common services the financial
    industry provides, which was made possible by the concepts of credit and collateralization.
    It is possible to argue that the invention of commercial-scale lending and borrowing
    was responsible for the Renaissance age, as the ability for the less wealthy to
    obtain startup funds resulted in a flurry of economic activity. As a result, families
    may obtain a mortgage for a home that would otherwise be costly to purchase in
    cash by collateralizing the house, while entrepreneurs can borrow the upfront
    needed to establish a company by collateralizing the enterprise. On the other
    hand, accumulated wealth can be lent as capital. This system, however, necessitates
    some level of trust and the use of an intermediary. This system reduces the possibility
    of borrowers fleeing with borrowed funds.

    '
  trans: '

    Maker 将继续维护多抵押 Dai（Multi-Collateral Dai）作为事实上的稳定币标准，而 SAI 将被淘汰并不再支持。为了保持简单，我们在后续章节中仅使用多抵押
    Dai (`DAI`) 来演示示例。


    ## Maker 如何治理该系统？


    还记得我们提到过的去中心化自治组织（DAO）吗？这就是 Maker (`MKR`) 令牌发挥作用的地方。`MKR` 持者拥有与其拥有的 `MKR` 令牌数量比例对应的
    `DAO` 投票权，并可以对 Maker 协议参数进行投票。


    投票的参数对于维护生态系统的健康至关重要，这有助于保持 `Dai` 锚定美元。我们将介绍 `Dai` 稳定币生态系统中你需要了解三个关键参数：


    ### I. 抵押率

    抵押率决定了可以铸造 `Dai` 的数量。


    * Ether (`ETH`) 抵押率 = 150%

    * Basic Attention Token (`BAT`) 抵押率 = 150%。本质上，150% 的抵押率意味着为了铸造 100 美元，你必须存入至少价值
    150 美元的 `ETH` 或 `BAT`。


    ### II. 稳定性费用

    这等同于你在支付金库本金债务时需要支付的“利率”。截至 2020 年 2 月，稳定性费用设置为 8%。


    ### III. Dai 储蓄率 (DSR)

    Dai 储蓄率 (`DSR`) 是对存放一段时间的 `Dai` 支付的利息。它也作为一种影响 `Dai` 需求的货币工具。截至 2020 年 2 月，`DSR`
    利率设置为 7.50%。


    ## 发行 DAI 的动机

    为什么要锁定更高价值的 `ETH` 或 `BAT` 仅为了发行价值较低的 `Dai` 呢？相反，你可以用美元出售你的资产。


    有三种可能的结果：


    1. 你立即需要资金，并且拥有一项你认为未来会更值值的资产。在这种情况下，你可以将资产存储在 Maker 金库中，并通过铸造 `Dai` 立即获得资金。

    2. 你立即需要现金，但不想冒通过出售资产来触发纳税事件的风险。你将通过发行 `Dai` 来获得贷款。

    3. 投资杠杆。如果你认为你的资产价值将会上涨，你就可以对你的资产使用投资杠杆。


    ## 获取 Dai (DAI) 的最佳方法是什么？


    获取 `Dai` (`DAI`) 有两种方法：


    ### 1. 铸造 Dai

    使用当铺类比，我们将演示如何铸造 `DAI`。假设某天你需要 10,000 美元的现金，而你家里只有价值 15,000 美元的金条。与其把金条卖成现金，不如去当铺用你的金条作为抵押品借入
    10,000 美元，因为你认为金价未来会上涨。对于现金贷款，当铺提提供 8% 的利率给你 10,000 美元。为了完成交易，双方签署了一份合同协议。


    为了符合 `DAI` 的叙述，让我们改变一下术语：


    * 金条 (`抵押品`) = `Ether` 或 `Basic Attention Token` (`抵押品` – `Multi-Collateral Dai`)

    * 现金贷款 = `Dai` (`DAI`)

    * 当铺 = `Maker`

    * 合同协议 = `智能合约` (`金库`)

    * 贷款利 = `稳定性费用`


    你将使用 Maker 平台并将你的 `Ether` (`ETH`) 或 `Basic Attention Token` (`BAT`) 作为抵押品来铸造或“借入”
    `Dai`。当你贷款结束后想要赎回 `ETH` 或 `BAT` 时，你必须还清“贷款”和“贷款利”（即稳定性费用）。为了让你快速了解，让我们来看看如何铸造你自己的
    `Dai`。


    通过在 Maker 平台 (`www.oasis.app`) 的金库中放入 `ETH` 或 `BAT`，你可以借入 `Dai`。假设 `ETH` 目前价值
    150 美元，你可以在金库中存入 1 个 `ETH`，并获得最多 100 个 `DAI`（100 美元），抵押率为 150%。


    你不应该提取允许的最额 100 个 `DAI`，而是应该留出一些缓冲区以防 `ETH` 价格下跌。最好留出较大的差距，以确保你的抵押率始终大于 150%。这确保了如果
    `ETH` 价格下跌且你的抵押率跌至 150% 以下，你的金库不会被清算，你也不会被收取 13% 的清算罚金。


    ### 2. 交易 DAI

    上述方法都是创建 `DAI` 的方法。一旦创建了 `DAI`，就可以发送到任何地方。某些用户会将 `DAI` 转到加密货币交易所，你也可以从这些二级市场购买
    `DAI` 而无需铸造。通过这种方式购买 `DAI` 更简单，因为你不需要锁定抵押品，也不担心抵押率或稳定性费用。


    ## 为什么要使用 Maker？


    有很多稳定币可用，它们之间的主要区别在于协议。Maker 与大多数稳定币平台不同，完全基于分布式账本。因此，Maker 具有区块链的特性：安全、不可篡改，而且最重要的是透明的。此外，Maker
    的基础设施通过基于实时数据的全面风险协议和机制加强了系统的安全性。


    ## 十


    资金的贷款和借是金融行业提供的最常见服务之一，这是通过信用和抵押的概念实现的。可以认为，商业规模借贷的发明导致了文艺复兴时代，因为较不富的人能够获得创业资金，从而引发了一系列经济活动。结果，家庭可以通过抵押房屋来获得住房贷款，而如果用现金购买，费用将非常昂贵；而企业家可以通过抵押企业来获得建立公司所需的启动资金。另一方面，积累的财富可以作为资本贷出。然而，这种系统需要某种程度的信任和使用中介。这种系统减少了借款人卷走贷款资金的可能性。

    '
