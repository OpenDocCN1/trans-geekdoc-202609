    9. **Payments.** These classifications, as well as the projects that fall under
    them, may evolve over time. As a result of the programmability and modularity
    of Defi services, aggregators have developed to mediate activity between these
    basic categories. Yearn Finance, for example, is a yield farming business that
    optimizes profits from liquidity and collateral supply. Exchange aggregators like
    `1inch` and `Matcha` deliver trading orders to the best-priced exchange. Users
    benefit from `Zapper` and `Zerion`''s integrated interfaces for order routing,
    yield optimization, and other Defi operations across several protocols, which
    reduces complexity. `Tally` aggregates Defi governance token activity to facilitate
    participation in governance decisions. Because of their potential for better,
    aggregators may originate a significant share of Defi activity.


    ### STABLECOINS


    Stablecoins are crucial to Defi because they separate the risk/return calculus
    of Defi services from the often volatility of digital assets. Financial interoperability
    requires stable prices for value exchange, and investors expect a steady unit
    of account for financial services.


    Broadly, stablecoins can be organized into three categories:


    1. **Custodial** or centralized stablecoins such as `USDC` or Facebook''s proposed
    `Diem` use holdings of fiat currency or high-quality liquid assets as a reserve.
    Because they require trust in the custodian, they are not DeFi instruments. However,
    they are included here because they may be incorporated into other Defi services.

    2. **Asset-backed** stablecoins use smart contracts to assemble and liquidate
    collateral in the form of cryptocurrencies or other assets.

    3. **Algorithmic** stablecoins attempt to maintain the peg through dynamic expansion
    and contraction of token supply. Because they operate on a noncustodial, decentralized,
    trust-minimized basis, asset-backed and algorithmic stablecoins are Defi services
    themselves. As with other areas of Defi, projects are experimenting with different
    mechanisms. How effective each will be in maintaining its peg at scale and through
    market market conditions remains a source of uncertainty.


    ### EXCHANGES


    Exchanges are important to Defi in two ways: They allow holders of various digital
    assets to use Defi services and provide opportunities to profit from appreciation
    in the value of tokens. Centralized exchanges require traders to trust an operator
    to safeguard user funds, provide accurate price information, match buyers and
    sellers to process trades, settle transactions, and engage in transaction monitoring.
    This is true whether the exchange is purely fiat-based (such as `NASDAQ`), facilitates
    trading between fiat and digital assets (such as `Coinbase`), or only processes
    trades among digital assets (such as `Uniswap`).


    Defi exchanges, by contrast, decentralize key functions. They can be accessed
    programmatically with noncustodial wallets. Smart contracts automatically process
    transactions on a peer-to-peer basis or against a pool of capital. While exchanges
    can operate order books either on or off the blockchain, the most prominent form
    of Defi exchange, automated market makers (AMMs), does away with the traditional
    order book entirely.

