- raw: '*   Security. To avoid attacks, DEXs are often hosted in a distributed way.
    Furthermore, hackers can only engage with the liquidity pools on a trading platform,
    not with the exchange''s users.


    *   Access to tokens. Because of its decentralized nature, anybody can list an
    asset on a DEX without relying on the platform''s owners'' vouching or verification
    mechanism.


    **Disadvantages:**


    *   Liquidity restrictions are a disadvantage. Centralized exchanges, like decentralized
    exchanges, rely on liquidity supplied by their users, although not to the same
    extent. Because DEXs typically lack their liquidity pools, they must rely on yield
    farmers to donate their assets for other traders to utilize. The exchange would
    be unable to provide trading services without them.


    *   Speed. Compared to their counterparts, they have less efficient order execution,
    which is mostly due to a lack of sophisticated trading tools.


    *   Slippage and volume DEXs have grown in popularity, but customers face significant
    slippage without an order book and a market maker, particularly with big orders.


    *   Fees. There are no reduced costs if there is no order book. All users must
    pay a set trading cost, as well as the Ethereum network''s gas fees. When the
    network is overburdened, a single transaction may cost hundreds of dollars.


    The primary aim of an AMM from a technical standpoint is to maintain a "Constant
    Product." The constant product is an algorithm used to maintain equal reserves
    of two assets that form a trading pair with a 1:1 supply ratio.


    Uniswap uses the following formula to maintain a constant product: **x \* y =
    k**


    In this formula, x and y represent the reserve balances of two tokens in a liquidity
    pool. Any trade on an AMM must not affect the unchangeable k (constant product),
    resulting in a liquidity imbalance.


    Therefore, liquidity providers who fuel these pools are ''forced'' to provide
    equal amounts of both tokens. For example, if we want to provide liquidity to
    an ETH/USDT pool and only have 2 ETH (worth $4,440), we must also provide $4,440
    worth of USDT. Using the formula mentioned above, we receive the following constant
    product: 2 ETH \* 4400 DAI = 8,800


    Without any trades, the figures remain the same. But if a trader wishes to buy
    1 ETH, he will take single Ether out of the pool and give the proportional amount
    of USDT tokens in return. However, the buyer also has to pay an additional USDT
    compared to the original price (1 ETH = $2,200 USDT) as a premium. The larger
    amount of ETH the trader wishes to buy, the larger the premium will be, ensuring
    that the pool never runs out of liquidity. Since the premium ensures a constant
    ratio, K always remains the same.


    **Lending**


    Lending & borrowing is the second-largest use case in Defi. The modern economy
    thrives on loans, and without them, most advanced financial activity is barred
    off for the average person. Whoever cannot take out a loan cannot start a business
    or purchase real estate either.


    The only way to borrow funds is by requesting a loan from an intermediary, which
    is usually a bank. Banks only lend funds to trusted individuals who meet criteria
    like a good credit score, stable job, minimum collateral, and other factors to
    protect their interests.


    These requirements provide various constraints and challenges, which can prevent
    a person from taking out loans, making them exclusively to a specific group of
    people. Defi lending protocols fend off this exclusivity by eliminating all barriers,
    which is especially beneficial to the bankless. Being decentralized and accessible,
    these protocols are available to people of all backgrounds, races, and locations.
    As long as one can provide the necessary collateral, it is possible to take out
    a loan and use the newly gained funds.


    Apart from collateral, there are no other requirements. Moreover, lending protocols
    do not use pervasive identity checks like Know-Your-Customer (KYC) policies. It
    may sound bizarre to someone only familiar with traditional finance, but a Defi
    user can anonymously request a loan and receive it in mere minutes.


    Famous lending protocols include Compound, Aave, Maker, and bZx. In total, they
    host $26 billion worth of collateralized assets which accounts for almost 50%
    of the entire Defi market.


    **Lending in practice**


    Every lending platform consists of two sides: lenders and borrowers. Just like
    traders, both sides interact via liquidity pools contained within smart contracts.
    While lenders supply assets and earn interest, borrowers take out loans and pay
    interest on their debt.


    Every cryptocurrency has its liquidity pool and interest rate, denominated in
    APY (Annual Percentage Yield). The APY rate differs from asset to asset and increases
    or decreases based on the laws of supply and demand.


    It is worth mentioning that APY rates range from 3% to 20% (and even higher in
    extreme cases), making Defi lending far more profitable than banks. APY rates
    can also be fixed or variable, depending on the platform. In the first case, a
    user who lends his assets will receive a constant interest that never changes.
    In the second case, the interest rate can go up or down depending on market conditions.


    **Flash Loans**


    Lending protocols also offer a unique type of loan called a flash loan. A flash
    loan requires no upfront collateral, and users can request millions of dollars
    if they wish. However, the catch is that flash loans need to be repaid almost
    instantly.


    As a matter of fact, flash loans have a life cycle lasting only one transaction
    block. Before the next block arrives, the user must repay the loan. If he fails
    to do so, the original transaction is reverted, and the funds are lost. Flash
    loans are primarily used for swift tasks such as arbitrage trading and debt refinancing.
    Their major disadvantage is that flash loans are so complex that they are vulnerable
    to security exploits.


    To summarize, lending protocols effectively act as intermediaries between lenders
    and borrowers who interact by taking or providing crypto funds. Lenders benefit
    from receiving higher than average interest, while borrowers gain the ability
    to instantly take out loans without filing tons of paperwork in a completely anonymous
    and safe way.


    **Derivatives**


    Aside from simple token swapping, Defi also targets complex trading products.
    More advanced decentralized exchanges offer decentralized derivatives which derive
    their value from an underlying asset such as a currency, stock, index, or commodity.


    Notable derivatives products include futures, options, and synthetic crypto assets.
    Certain investors trade derivatives to hedge against volatility or to speculate
    against assets and use additional leverage. Due to their risky nature, a majority
    of crypto investors refrain from trading derivatives. Nevertheless, the Defi derivatives
    market still plays a key role.


    The most popular Defi derivatives protocols are Synthetix and bZx (Fulcrum). Both
    of them host roughly $2.3 billion in value. While the figure is extremely low
    compared to other niches like decentralized trading and lending, derivatives platforms
    are growing swiftly, and their adoption rate rises along with the introduction
    of new projects and features.


    **Derivatives on Synthetix**


    Synthetix is the largest Defi derivatives protocol, and its products are called
    synths. These synths are different as opposed to traditional derivatives because
    they tokenize their underlying assets.


    A synthetic asset (synth) is simply a tokenized derivative that mimics the value
    of another asset. For example, a stock like Gamestop would have a tokenized version
    called sGME (synthetic GME), representing the real stock. Its price would be tracked
    via a decentralized oracle such as Chainlink, and anyone could trade it.'
