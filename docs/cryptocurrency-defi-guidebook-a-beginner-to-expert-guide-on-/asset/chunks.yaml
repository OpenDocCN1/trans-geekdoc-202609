  trans: '


    在区块链行业中，治理模型建立了一套系统，让投资者可以直接决定项目的设计方式和发展方向。就像公司的股东一样，社区成员可以发表自己的意见，并积极参与决策过程。


    治理实现了绝对的去中心化，并将所有规划工作委托给项目的投资者而非其开发者。


    在撰写一篇关于去中心化自治组织（DAO）的论文时，以太坊创始人维塔林·布特林（Vitalik Buterin）将治理模型比作没有管理者的公司。整个系统不再依赖于少数几位高管，而是利用智能合约来处理、执行并接受各种任务和决策。


    治理对于 DeFi 至关重要，因为它将协议的所有所有权交给了社区。大多数项目都有一种治理代币，赋予用户投票权以及创建治理提案的能力。


    理想情况下，治理代币的分配应该是公平的。这可以通过向活跃用户空投部分加密货币的供应来实现，Uniswap 在 2020 年 9 月推出 `UNI` 时就是这样做的。当时，Uniswap
    通过 400 个 `UNI` 的空投，向社区发放了 `UNI` 创世代币的 60%。


    否则，去中心化协议也可以简单地在交易所列出治理代币，而不进行公平分配。看好项目未来的投资者将通过投资该代币并据此获得投票权。由于代币持有者也是投票者，投资者将受到激励以做出最佳的决策。


    ### 治理在实践中是如何运作的


    投票和参与治理的行为围绕着治理代币的使用展开。一旦发放，持有者就可以提议更改并对现有提案进行投票。此外，社区成员还可以在项目托管的在线论坛上讨论治理问题和即将上线的功能。


    所有治理行为都要求发起者在整个过程中将治理代币锁定在智能合约中。锁定代币对于防止提案垃圾信息（proposal spam）是必要的，并能确保用户在发送提案之前花费更多时间来创建更高质量的提案。


    要让一个提案被考虑，它必须达到法定人数（quorum）。基本上，每项治理提案都必须有最少数量投票者进行投票。如果结果有利于该提案，且已经达到法定人数，智能合约将批准它。


    ### 六大类


    DeFi 涵盖了广泛的活动，满足了无信任、非托管、开放、可编程和非托管金融服务的要求。除了预言机（oracles）和钱包等辅助服务外，我们确定了六大主要的
    DeFi 类别。它们之间的区别并不总是显而易见的。另一方面，这种分类代表了参与者对 DeFi 市场的观点。


    1. **稳定币**（Stablecoins）旨在保持代币相对于另一种资产（通常是美元或其他主要法币）的价值。非托管稳定币本身就是 DeFi 服务。虽然托管稳定币是中心化的，但它们可以被用于
    DeFi 服务。

    2. **交易所**（Exchanges）。用户可以在交易所将一种数字资产交换为另一种。DeFi 交易所通过去中心化订单簿匹配订单或通过算法匹配订单簿来建立价格，从而避免获得用户资产的所有权。

    3. **贷**（Credit）涉及产生具有固定还款日的利息工具，以及匹配贷款人和借款人以发行此类工具。

    4. **衍生品**（Derivatives）是指价值由底层资产或资产组的功能决定的金融工具。期货和期权是衍生品的两种常见形式，与资产未来的价值有关。

    5. **保险**（Insurance）通过用支付小额保费的确定性，换取在发生涵盖事件时获得大额理赔的机会，来防御风险。

    6. **资产管理**（Asset management）通过平衡风险、时间跨度、多样性和其他因素增加资产组合的价值。虽然本报告中处有例子，但必须记住 DeFi
    仍在演变中。

    7. 借贷与贷款（Borrowing and lending）。

    8. 彩票（Lottery）。

    9. **支付**（Payments）。这些分类以及属于这些可能会随着时间的推移而演变。由于 DeFi 服务的编程性和模块化，聚合器已经发展用来调节这些基础类别。例如，Yearn
    Finance 是一个从流动性中优化收益的业务。`1inch` 和 `Matcha` 等交易所聚合器将交易订单路由到最佳价格。用户受益于 `Zapper`
    和 `Zerion` 的收益优化界面和其他 DeFi 操作。`Tally` 聚合 DeFi 治理活动。由于其潜力，聚合器可能产生大量的 DeFi 活动。


    ### 稳定币 (STABLECOINS)


    稳定币对 DeFi 至关重要，因为它们将 DeFi 的风险收益计算与数字资产的波动性隔离开。金融互操作性需要稳定的价格进行价值交换，投资者期望有一个稳定的记账单位。


    广义上，稳定币可以分为三类：


    1. **托管**（Custodial）中心化稳定币（如 `USDC` 或 Facebook 提议的 `Diem`）使用法或高质量流动资产作为储备。由于它们需要信任托管人，因此不是
    DeFi 工具。然而，将其包含在这里是因为它们可以被纳入其他 DeFi 服务。

    2. **资产支持**（Asset-backed）稳定币使用智能合约收集加密货币或其他资产形式的抵押品。

    3. **算法**（Algorithmic）稳定币通过代币供应的动态扩张和收缩尝试维持挂钩。由于它们在非托管、去中心的基础上运行，资产支持和算法稳定币本身就是
    DeFi 服务。与 DeFi 其他领域一样，项目正在尝试不同的机制。它们在大规模和市场条件下维持挂钩的有效性仍然是一个不确定因素。


    ### 交易所 (EXCHANGES)


    交易所从两个方面对 DeFi 很重要：它们允许各种数字资产持有者使用 DeFi 服务，并提供从代币增值中获利的机会。中心化交易所需要交易者信任运营商保护资金、提供准确的价格、匹配买卖双方以处理交易、结算交易并进行交易监控。无论交易所是纯法币的（如
    `NASDAQ`）、促进法币与数字资产之间的交易（如 `Coinbase`），还是仅处理数字资产之间的交易（如 `Uniswap`），都是如此。


    相比之下，DeFi 交易所去中心化了关键功能。可以通过非托管钱包进行编程访问。智能合约会自动对点或针对资金池处理交易。虽然交易所可以在链上或链外运行订单簿，但最著名的
    DeFi 交易所形式——自动做市者（AMMs）完全取消了传统的订单簿。


    '
