- raw: "Competing in this space is exceedingly difficult given the complexity of trading\
    \ infrastructure required; the creation of trading bots and improvement in latency\
    \ technologies has minimized any potential for average traders to gain an edge.\
    \ Further, gas-based arbitrage has contributed to congestion on the Ethereum network\
    \ and increased costs significantly.\n\n**YIELD ARBITRAGE**\n\nYield arb strategies\
    \ are focused on benefitting from price discrepancies across different lend/borrow\
    \ products. Today, all lend/borrow products require collateral-based loan structures\
    \ as unsecured credit extension is essentially non-existent. Suppose the Supply\
    \ APR (i.e., the investor lending to the pool) is greater than the Borrow APR\
    \ (i.e., the investor takes out an overcollateralized loan). In that case, a trader\
    \ can borrow against their assets and capture an interest rate spread.\n\nThe\
    \ investor will need to ensure that the lock-up periods are aligned as not to\
    \ cause a liquidity mismatch between assets and liabilities. The spread between\
    \ the lend/borrow rates has traditionally ranged between -5% to about +10%. Understanding\
    \ the interest rate calculation is critical as variable interest rate products\
    \ can impair returns.\n\nThis strategy could be performed on the same platform,\
    \ across Defi platforms, or even across centralized finance (CeFi) platforms.\
    \ Furthermore, investors could take staking risk between two different tokens;\
    \ for example, swap XTZ tokens for DOT tokens to try and capture an APY spread.\n\
    \n**Arbitrage: Key Risk Factors**\n\n***Liquidity Risk***\n\nWhile the markets\
    \ have grown substantially over the last few years, they still pale compared to\
    \ traditional markets such as stocks and bonds. Supply/demand imbalances may persist\
    \ and upset any trading strategy.\n\n***Lock Up risk***\n\nWhen merging different\
    \ platforms or protocols, it is important to understand lock-up periods for each\
    \ type of smart contract you are interacting with. Staked assets, for example,\
    \ will mandate a holding period to earn rewards.\n\n***Basis Risk***\n\nSwapping\
    \ in between assets carries beta risk pertaining to the underlying token. If you\
    \ swap DASH and the same amount of XTZ for an APY play, you risk not being able\
    \ to return your principle if one asset gains more than the other.\n\nFor example,\
    \ say, an investor swaps $100 in DASH, earning 5% for $100 in XTZ, earning 7%\
    \ to capture a 2% yield differential. If DASH appreciates versus XTZ, the investor\
    \ may end up executing the trade at a loss.\n\nAssume at maturity of the contract\
    \ that the same number of DASH units is valued at $120 (up from $100), and XTZ\
    \ is valued at $90 (down from $100). The investor will have to make up for the\
    \ $30 gap between the two assets at inception.\n\nFurther, because the XTZ staking\
    \ was token-based, the value of the staked rewards would not be as valuable as\
    \ the DASH units received (all in terms of a dollar). The investor would only\
    \ benefit if XTZ grew in value relative to DASH or if values remained equal over\
    \ the borrowing period.\n\nInvestors with a particular position in direction of\
    \ the two assets may speculate on the differential between the two assets, also\
    \ benefitting from the net interest margin received. As a general rule of thumb,\
    \ ensure you know what your obligations are denominated in vs. what your assets\
    \ are denominated in.\n\n## 3\\. INSURANCE\n\nDefi platforms have manifested out\
    \ of a desire to disrupt intermediaries in financial services. In doing so, the\
    \ elimination/reduction in counterparty risk has led to a substantial increase\
    \ in ‘software risk.’ Given the nascence of the market and lack of audit history,\
    \ there are numerous blind spots in the industry's future growth. Decentralized\
    \ insurance has emerged as a potential solution; however, the depth of liquidity\
    \ and clarity on payout logistics remains uncertain.\n\nThe Nexus Mutual, for\
    \ example, has created a marketplace for coverage against smart contract failures.\
    \ Individuals can buy NXM tokens to provide liquidity to the platform or obtain\
    \ insurance against their Defi exposures.The amount of insurance that the platform\
    \ can provide is equal to the value of total liquidity locked in smart contracts\
    \ (most denominated in ETH today). From there, an algorithm determines the optimal\
    \ pricing and amount of coverage that could be sold. These policies can be priced\
    \ according to supply/demand imbalances, claims frequency, type of platform, etc.\n\
    \nEssentially, Nexus Mutual is creating a marketplace for Defi-focused insurance\
    \ products that will enable the next generation to better price risk in a decentralized\
    \ manner. As of Feb. 8, 2021, coverage on the Nexus Mutual platform stands at\
    \ $738.7 million, and total premiums paid equals to $13.2 million. The most interesting\
    \ piece of the puzzle relates to claims assessment and repayment.\n\nNexus Mutual\
