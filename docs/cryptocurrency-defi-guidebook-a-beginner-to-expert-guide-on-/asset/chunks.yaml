    \ As a lender on dYdX, you need to be aware of the earned Interest Rate (APR)\
    \ - this is the amount you will earn by lending out your assets.\n\n**Who is responsible\
    \ for paying the interest on my deposit?**\n\nOther users who borrow the same\
    \ asset as you pay the interest you earn. Over-collateralized loans are not permitted\
    \ on dYdX. This means that borrowers must always have sufficient collateral to\
    \ repay the loaned amount. If a borrower's collateral falls below the 115 percent\
    \ collateral ratio level (i.e., $115 of ETH for a $100 DAI loan), their collateral\
    \ is immediately sold until they cover their position completely.\n\nInterest\
    \ rates are dynamic and fluctuate based on supply and demand, ensuring that users\
    \ always earn market rates. Furthermore, the initial cash and the interest collected\
    \ can be placed and withdrawn at any time.\n\nBorrowing\n\nYou can borrow any\
    \ supported assets (ETH, DAI, and USDC) using dYdX if you keep a 1.25x initial\
    \ / 1.15x minimum collateral ratio. Borrowed funds are directly deposited into\
    \ your wallet and can be freely transferred, exchanged, or traded. As a dYdX borrower,\
    \ you need to be aware of two numbers:\n\n(i) Annual Percentage Rate (APR) - the\
    \ amount you pay to borrow money.\n\n(ii) Account collateralization ratio - This\
    \ is the asset/loan amount ratio. You can borrow until the ratio reaches 125 percent,\
    \ after which you will be liquidated if it goes below 115 percent.\n\n**Trading\
    \ using Margin and Leverage**\n\ndYdX allows you to enter either short or long\
    \ positions with leverages up to 5x. When margin trading on dYdX, funds are immediately\
    \ borrowed from the platform's lenders. Consider the following scenario: you have\
    \ 300 DAI and 0 ETH in your dYdX account. If you want to short ETH (imagine it's\
