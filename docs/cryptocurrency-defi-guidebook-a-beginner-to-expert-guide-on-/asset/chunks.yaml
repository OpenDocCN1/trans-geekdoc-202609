  trans: '


    大多数金融监管体制侧重于那些在某些受监管活动中“开展业务”、“交易”、“安排”或“运营”某些计划、交易所，或“发行”报价（或类似行为）的实体。


    从历史上看，相关的政府实体相对清晰，并侧重于最终控制运营的实体。同样，服务提供商通常拥有豁免条款，这些豁免仅提供基础设施、数据或其他工具，以便其他在其在其叠加金融服务。监管框架考虑了可定义且集中的运营者，他们参与提供特定的金融终端产品和服务，但并不必然是底层的构建者。


    然而，在 `Defi` 的背景下，可能不存在执行相关活动的中心实体。软件开发者和代币持有者可能很容易识别，但从事传统监管触点职位的个人却な无法识别。即使能够识别出运营者，由于协议的去中心化本质，他们可能缺乏修改
    `Defi` 服务或停止交易的能力。`Smart contracts` 可能会与其它 `smart contracts` 拥有的资产交互，而这些智能合约并未与特定用户关联。监管机构必须确定谁应该负责，以及何时必须建立责任中心。即使服务表面上是去中心化的，通过仔细的分析也是可行的。


    法律体制通常包含间接次级“控制人”、“责任官员”或协助与煽唆责任的机制，这些责任基于对有害后果的知情或预见等要求。假设 `Defi` 服务的开发者或其他与
    `Defi` 业务相关的人员本可以识别并缓解法律合规风险。在这种情况下，政策制定者将需要考虑强制他们这样做是否恰当。另一方面，监管软件的创建引发了关于言论自由和可管理性的重要担忧，这些应当被审慎考虑。由于区块链网络和数字资产的跨国性质，国家级或次国家层级的
    `Defi` 监管变得更加复杂。


    政策制定者有许多方法来处理新的金融服务或产品。以下我们首先识别了监管机构为应对数字资产和代币发行的兴起而所采取的一些有用步骤。


    ### 可用政策工具 (AVAILABLE POLICY TOOLS)


    #### 1. 过渡机制


    虽然并非完全等同，但最初处理数字资产的方式可能会影响政策方法。在 2017 年首次代币发行 (`ICOs`) 热潮期间，很少有机构缺乏适合该目标的机构或专业知识，因为大量资金流入了声称处于监管范围之外的新平台。在
    `Defi` 的语境下，最初的一些答案可能有所帮助。


    **专业监管部门 (Specialized regulatory units)：**


    一个拥有合格人员的针对性小组可以作为获取新技术经验、与行业互动以及提供指导的初始门户。这些知识可以与政策制定者共享，行动可能包括在现有监管体制下发布“不采取行动函”（no-action
    letters）。这些小组可以为 `Defi` 项目提供法律清晰度，并鼓励与监管机构进行早期讨论。监管机构还应该投资技术和技术专业知识，以更有效地理解这些市场。许多管辖区都使用了这种方法。例如，美国
    `Securities and Exchange Commission` (`SEC`) 创建了其 `FinHub` 部门（于 2020 年底升级为正式的独立办公室），而瑞士的金融监管机构
    `FINMA` 创建了 `FinTech Desk`。尽管最初规模较小且权限有限，但它们迅速成为内部和外部社区的重要联系点。


    **激励信息流 (Incentivizing information flow)：**


    披露是金融监管最常用的工具之一。即使现有披露要求在 `Defi` 平台上的适用性尚不确定，鼓励广泛且一致的信息披露的努力可能对监管分析产生成效。


    `Monetary Authority of Singapore`（新加坡金融管理局）将其对 `ICOs` 的监管重点放在了对白皮书的审查上。


    **监管沙盒 (Regulatory sandboxes)：**


    政策制定者可能会建立监管宽限计划（如沙盒），公司可以在有限范围内测试和运行其技术，因此具有有限的监管风险。此类监管“豁免”（carve-outs）的范围可以通过活动、财务阈值、领土或客户限制来定义，并结合报告义务，以确保监管机构在新技术方面获得经验、与行业互动并在发生问题时做出反应。然而，监管机构对轨迹缺乏透明度可能会抑制创新，且在没有明确安全风港的情况下，企业可能面临业务风险。沙盒允许初创企业解决合规问题，同时让监管机构对进入新市场的风险和优势有更好的了解。


    `Defi` 沙盒可能会通过建立随时间推移的控制机制来超越先前的的模式。英国 `Financial Conduct Authority` (`FCA`) 为金融科技建立了一个沙盒机制，涵盖大量的区块链和数字资产服务。然而，这对
    `Defi` 的适用性有限，因为稳定币被认为在 `FCA` 的范围之外。其他地区，如哥伦比亚的“Arenera”沙盒也遵循了这种方法。`Defi` 沙盒需要仔细设计，以避免过早发出批准信号。


    这种方法的变体是在韩国釜实施的监管区。在这种模式下，国家内的特定管辖区可以在有限的监管（通常不是完全免监管）下运行，允许创新和服务测试。


    **澄清简单案例 (Clarifying easy cases)：**


    会有某些新活动引发监管红旗，某些不会，另一些则处于灰色地带。有时，政策制定者和监管机构可以通过先处理较简单的案例（特别是那些不需要干预的案例）来缩小不确定区域并激励合规活动。区分简单案例的更正式方法是安全港政策，明确将符合标准的服务排除在监管之外。在
    `ICO` 案例中，美国 `SEC` 的第一个声明是 2017 年关于 `DAO` 的调查报告。它澄清了 `bitcoin` 不被视为证券，而是为了投资目的而创建的代币。此外，由于
    `DAO` 已经关闭，因此没有采取执法行动。尽管报告留下了许多未解决的问题，但它明确了 `SEC` 的方法和担忧，促进了进一步对话。


    **协调政府行动 (Coordinating government action)：**


    在某些情况下，汇集各个政府部门进行协调一致的是有益的。美国五个联邦监管机构（联邦储备理事会、联邦存款保险公司 `FDIC`、货币法体系监员办公室 `OCC`、商品期货交易委员会
    `CFTC` 和 `SEC`）对“沃尔克法规则”的修订就是一个例子。这并不意味着这是一份完整的列表，也没有预设政策制定者最终将采取的方向。如果 `Defi`
    服务最终被发现受现有要求的约束、处于监管范围之外，或受新的定制规则约束，这些技术也同样适用。


