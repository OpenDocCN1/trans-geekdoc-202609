    流动性池储备由流动性提供者提供，他们被鼓励获得 0.3% 的 Uniswap 交易费用的等比例费用。该费用适用于 Uniswap 上的每次代币交换。


    这里没有限制，任何人都可以成为流动性提供者。截至 2020 年 2 月，已有超过 125,000 个 `ETH` 被投入 Uniswap。流动性池维持的储备数量会显著影响自动做市商机制定价的方式。


    ### 自动做市商机制


    自动做市商 (`AMM`) 算法用于计算池中资产的价格。`AMM` 的运行机制是保持一个取决于池两侧流动性数量的恒定积。


    让我们继续 `ETH-DAI` 流动池的例子，假设有 100 个 `ETH` 和 20,000 个 `DAI`。Uniswap 将结合这两个数字来计算恒定积。


    `ETH 流动性 (x) * DAI 流动性 (y) = 恒定积 (k)`


    `100 * 20,000 = 2,000,000`


    使用 `AMM`，恒定积 (`k`) 在任何时刻都必须为 `2,000,000`。当有人使用 `DAI` 购买 `ETH` 时，`ETH` 从流动性池中取出，并加入
    `DAI`。


    该 `ETH` 的价格将渐近地确定。收取的溢价越高，订单越大。“溢价”一词是指购买 1 个 `ETH` 时，相对于原始价格 200 个 `DAI` 所需增加的
    `DAI` 量。


    ### 如何向 Uniswap 添加代币？


    Uniswap 是一个去中心化交易所；因此，与中心化交易所不同，它没有员工或门卫来评估和选择提供哪些货币。相反，只要特定交易对存在流动性，任何人可以在 Uniswap
    上列表并交易任何 `ERC-20` 代币。用户只需与平台交互注册新代币，就会为该代币创建一个新市场。


    ## DYDX


    `dYdX` 是一个去中心化交易所系统，支持借贷、借入和保证金/杠杆交易。它目前支持三种货币：`ETH`、`USDC` 和 `DAI`。`dYdX` 协议通过将链外订单簿与链上结算相结合，承诺构建不受任何中央机构监管的高效、公平且去信任金融市场。


    初看，`dYdX` 与 `Compound` 类似，用户可以提供资产（贷）以赚利息，并在提交抵押后借入资产（借）。另一方面，`dYdX` 更进一步，包含了保证金和杠杆交易所，允许使用
    `DAI` 或 `USDC` 进行高达 5 倍杠杆的 `ETH` 保证金交易。


    ### 借贷


    如果你是加密货币所有者，希望从闲置的加密资产中获得被动收入，可以考虑将其借入 `dYdX` 获取收益。其风险非常低，通过放入 `dYdX`，利息每秒产生，无需任何额外的维护或管理。作为
    `dYdX` 上的贷方，你需要关注所获得的年利率 (`APR`) —— 这是你通过借出资产所收益。


    ### 谁负责支付我的存款利息？


    借用和你相同资产的其他用户将支付你获得的利息。`dYdX` 不允许过度抵押贷款。这意味着借款人必须始终拥有足够的抵押品来偿还贷款金额。如果借款人的抵押品低于
    115% 的抵押率水平（例如，$100 的 `DAI` 贷款对应 $115 的 `ETH`），他们的抵押品将被立即出售，直到完全覆盖其仓。


    利率是动态的，并根据供需波动，确保用户总能获得市场利率。此外，初始资金和收取的利息可以随时存取。


    ### 借入


    你可以通过 `dYdX` 借入任何支持的资产（`ETH`、`DAI` 和 `USDC`），前提是保持 1.25 倍初始/1.15 倍最小抵押率。借入资金直接存入你的钱包，可以自由转移、交换或交易。作为
    `dYdX` 借款人，你需要关注两个数字：


    (i) 年利率 (`APR`) —— 你借钱支付的金额。


    (ii) 账户抵押率 —— 这是资产与贷款金额的比例。你可以一直借贷直到比例达到 125%，之后如果比例低于 115%，你将被清算。


    ### 使用保证金和杠杆交易


    `dYdX` 允许使用 `DAI` 或 `USDC` 进行高达 5 倍杠杆的 `ETH` 保证金交易。`dYdX` 允许使用 `DAI` 或 `USDC`
    进行高达 5 倍杠杆的 `ETH` 保证金交易。


    ### 杠杆到底是什么？


    杠杆本质上只是交易者在价格波动方面愿意承担的风险倍数，这定义了交易者离清算的距离。高风险，高回报！

