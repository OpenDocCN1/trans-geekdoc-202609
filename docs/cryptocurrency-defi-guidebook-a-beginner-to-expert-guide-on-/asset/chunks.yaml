  trans: '


    如前所述，智能合约是自动执行的计算机程序，它们能够根据预设情况自主运行并激活。尽管与中心化数据系统相比，智能合约的执行速度较慢，但它们仍提供了去中心化、安全性和透明性等显著优势。


    任何人都可以查看并分析智能合约的代码，以判断其是否具有恶意，这与银行业形成了鲜明对比。此外，智能合约不会偏袒任何一方，只执行指令操作，确保了 `Ethereum`
    交易永远不会发生意想不到的转向。


    智能合约是第三方中介者，负责处理至少两人之间达成的交易和协议。它们通过允许用户使用智能合约而非依赖对方的信誉，从而在原本缺乏信任的系统中消除了对对方信任的需求。它们还让用户能够避开交易所和银行等中心化中间人，而这些机构通常会协助他们进行链上交易。


    总而言之，`Ethereum` 可以被看作是支持智能合约的比特币版本，它使其能够执行计算逻辑，并实现第一代区块链无法实现的功能。


    ## Gas 费（Gas Fees）


    用户在 Defi 中直接与智能合约交互；因此，没有 Gas 费。所有的商品和服务都是非托管的，这意味着资产可能留在用户的钱包中，而不是存放在平台上。例如，一个人可以直接从他的
    `MetaMask.wallet` 直接在 `Uniswap` 上交易代币。争议的代币永远不会存储在 `Uniswap` 的原生加密钱包中。相反，代币是在交易所的智能合约中与其他代币进行交换。


    虽然非托管功能增加了 Defi 的去中心化程度，但这也付出了高昂的成本，可能会抑制投资者的意愿。中心化交易所通常处理内部交易来转移资产，除了交易费外没有额外费用。由于
    `DEX` 不直接存储资产并需要用户与智能合约交互，因此所有交易都受到 `Ethereum` Gas 费的影响。


    ## 以太坊 Gas 是如何驱动交易的


    所有的区块链网络都由矿工支持，矿工是一组托管节点并确认交易的用户群体。区块链必须通过交易手续费来补偿矿工，以吸引他们并让他们能够开始运行。


    在 `Ethereum` 上，交易成本被称为 Gas 费。每一个可以想象的智能合约交易或活动，如移动代币、验证余额、执行智能合约函数等，都会消耗 Gas。


    Gas 的另一个功能是它为各种任务建立了优先级。费用越高，工作就越困难。因此，Gas 充当了限制因素，防止网络被低成本的基础操作所过载。


    当矿工不足且 `Ethereum` 出现活动激增时，区块链会遇到被称为网络拥堵的现象。此时，Gas 成本飙升，所有交易的 Gas 价格也随之上涨。网络拥堵可能会持续数周甚至几个月，只有当需求减少时，区块链的状态才能恢复正常。在某些情况下，每笔交易的费用可能从
    40 美元到 100 美元，甚至更高。由于费用占了交易的大部分，交易小额的投资者自然倾向于在此期间暂停他们的 Defi 活动。


    ## Defi 有多大去中心化？


    很难说 Defi 的去中心化程度到底如何。为了简单起见，我们将去中心化分为三类：中心化、半去中心化和完全去中心化。


    ### 1. 中心化


    *   特点：托管、中心化价格馈送、中心化利率以及用于强制平的中心化流动性。

    *   示例包括 `Celsius`、`Nexo`、`BlockFi` 和 `Salt`。


    ### 2. 某种程度上去中心化（具有以下一个或多个特征但并非全部）


    *   特点：去中心化的平台开发/更新、去中心化的利率确定、无许可的保证金流动性、无许可的强平启动、去中心化的价格馈送、非托管。

    *   示例包括 `bZx`、`dYdX`、`MakerDAO`、`Compound`。


    ### 3. 完全去中心化


    *   特点：完全去中心化

    *   示例：完全去中心化


