  trans: '


    -   安全性方面稍微复杂一些：区块链技术是比特币的基础。但区块链究竟是什么呢？一个交易列表（或称账本）存储了比特币交易的所有历史。每笔新交易都会添加到此账本并与其相连。然而，这是以块为单位进行的，而不是作为单笔交易。“区块链”一词源于这种区块链。如果这个区块链存储在一个随后被成功攻击的数据中心，那么这种攻击可能会危及整个网络的安全。只需要一次成功的攻击，就能败毁区块链及其记录的区块和交易。因此，账本以去中心化的方式存储在多台计算机上。目前估计，全球分布着约
    10,000 个活跃的全节点（存储区块链完整副本的计算机）。攻击比特币需要同时攻击所有存储区块链的计算机（或其中许多计算机）。这同加密学了一起，构成了比特币安全性的主要原因。


    比特币通过随时间推移价值并根据需要进行价值交易，提供了一个基础且相对简单的用例。用户只能接收、存储和发送比特币单位。比特币的编程语言受到极大限制，无法将复杂的计算逻辑实现到交易中，这是一个主要的弱点（或者取决于你的观点，这是一个巨大的优势）。因此，虽然比特币缺乏功能，但正是这种局限性服务了安全属性。


    ## 以太坊与智能合约


    当新兴的区块链社区试图实现比简单的接收、存储和发送比特币之外的用例时，离链（远离去中心化的数据处理和存储）并不是选项。因此，在 2013 年，即比特币诞生五年后，由维塔里克·布特林（Vitalik
    Buterin）领导的一群远见者建立了以太坊。以太坊也是区块链，比特币一样。它的原生数字货币以太（Ether）同样稀缺，但它为开发者提供了更大的构建空间。凭借超过
    200,000 名开发者和数十种可用的应用程序，以太坊是世界上领先的可编程区块链。所谓的智能合约合约概念是由以太坊引入的。智能合约是根据预先约定的条款和条件在区块链上自动执行交易的程序。智能合约与简单的区块链交易一样，是以去中心化的方式执行的，因此与集中计算相比，它们在延迟和吞吐量方面的效率相对较低。


    尽管如此，它们的优势在于极高的安全性和透明度。结果可能可以被任何人验证。一组相互作用的智能合约由于其去中心化的本质也被称为去中心化应用（dApps）。与智能合约相比，传统的银行软件对银行客户来说既不可见也无法理解。用户必须相信公司提供的程序会履行它们的承诺。另一方面，智能合约不需要任何个人、国家或公司的信任，因为代码是公开的：它在构成区块链的公共账本中被复制了数次。


    然而，我们必须公平地指出，只有少数人拥有知识和资源来独立分析智能合约代码。与传统金融系统一样，用户通常依赖某些机构或个人，例如审计师或专家。


    在比较从比特币到以太坊的区块链技术演变时，可以得出结论：太坊采用了比特币的重要方面，同时通过在其上方启用计算逻辑对其进行了扩展。如果说比特币缺乏功能，以太坊则是功能过剩。


    ## 四


    在深入研究去中心化金融（Defi）的优缺点之前，请考虑传统金融的历史，以及我们是如何意识到需要一个不基于强大中间人的系统的。


    金融已经取得了长远的进步，理解这段简短的历史将帮助我们更好地理解为什么我们喜欢在尽可能多的领域将“去中心化”的概念引入“金融”中。


    在人类历史开始之前，金融没有地位。狩猎食物和寻找避难所总结了人类的需求。随着人口的增加，人类需要相互交流。


    贸易最基本的形式是一个产品另一个产品的直接交换。你拥有的肉比需要的多，所以你必须和邻居用肉换小麦。但这种交易应该以什么比例进行呢？是 1:1、2:1 还是其他比例？


    判断物品价值尚没有明确的标准。这种贸易方式的另一个问题是，你可能找不到愿意用自己的产品交换你的产品的人，或者可能花费很长时间，浪费了你的货物。


    随着商品和产品数量的增加，对评估商品价值的标准和指数的需求也随之增加。这导致了货币系统的发明和第一代金融的诞生。公元前 600 年左右，第一种硬币形式的货币出现了，由电金（金银合金）组成。


    ### 一种交易方法


    人们现在可以很容易将商品兑换现金，反之亦然。随着工业的出现，不同种货币和资产变得流行。随着银行和第三方组织引入协调人类经济行为，新一代金融应生了。


    但等一下！


    -   所有问题都解决了吗？

    -   谁负责钱？政府还是人民？

    -   钱是以公平平等的方式分配的吗？

    -   所有的钱都花在了人们的福祉和解决他们的问题上？

    -   在存在中间人的情况下，能否保持货币交易的安全？


    正如你所预期的，当钱处于单一实体（如政府）的管辖之下时，我们遇到了一个大问题：无限制印钞。


    通过建立中央银行，政府承担了制造货币的权利，并将自己建立为两个交易方之间的中间人。


    正如你所知道的，印更多的钱提高产品价格，而对商品的数量或质量没有影响。


    另一方面，稀缺资产如黄金、稀有艺术品以及如今的比特币变得越来越值。货币贬值由两个主要因素引起：宽松的货币政策和过度通货膨胀。


    不需要指具体的某个机构或团体；但由于中央银行和中间人的无能或管理不当，全球近期面临了严重的金融危机。许多工厂和公司破产，导致许多人被解雇或失去工作。


    '
