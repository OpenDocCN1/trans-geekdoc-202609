    借贷池提供了资金供他人借用，贷款者则获得借款人还给资金池的部分利息。贷款人的利率很大程度上取决于他们向资金池投入的金额。此外，加密资产的流动性是决定 Defi
    借贷平台利率的重要因素。


    ## DEFI 的缺点


    Defi 项目面临的许多问题和风险都与其构建的基础技术——区块链有关。由于由于超过 90% 的 Defi 项目基于 `Ethereum` 区块链，我们把以太坊的挑战视为
    Defi 的挑战：


    ### 不可预测性

    如果托管 Defi 项目的区块链不稳定，那么该项目将自动继承宿主区块链的不稳定性。`Ethereum` 区块仍在进化中；例如，从 `PoW` 迁移到新的 `Eth
    2.0` `PoS` 系统时所产生的错误可能会给 Defi 项目引入新的风险。


    ### 可扩展性

    Defi 项目的另一个大问题是宿主区块链的可扩展性。扩展性问题导致了两个主要问题：


    1. 交易确认需要长时间；以及

    2. 在拥堵期间，交易费用极其昂贵。


    `Ethereum` 在满载状态下每秒只能处理大约 13 交易，而中心化的对手每秒可以处理成千上万笔交易。


    ### 智能合约问题

    对于许多 Defi 项目来说，智能合约漏洞是问题的主要来源。智能合约代码中微小的缺陷会导致资金损失。


    ### 低流动性

    流动性是基于代的 Defi 项目和区块链协议的核心方面之一。到 2020 年 10 月，Defi 的总锁仓价值（TVL）将超过 125 亿美元。与成熟的金融系统相比，这只是冰山一角。


    ### 过度抵押

    如前所述，加密借贷是 Defi 中极具吸引力的产品。然而，这一行业面临着过度抵押的问题，当借款人的抵押资产价值相对于贷款金额本身异常高时就会出现。为了补偿信用评分等障碍的缺失，Defi
    项目需要大量的抵押。


    ### 低互操作性

    还有其他区块链，包括 `Bitcoin`、`Ethereum` 和 `Binance Smart Chain`，每个区块链都有自己的 Defi 生态系统和社区。互操作性允许运行在多个区块链上的
    Defi 平台、工具、`DApps` 和智能合约相互进行通信。在这种情况变得简单之前，许多项目都是孤立的。


    ### 保险匮乏

    在发生攻击或其他欺诈活动时，投资者受到保险的保护。保险在中心化金融中至关重要，但在 Defi 中明显较少。


    ### 中心化

    建立 `bitcoin` 和区块链的主要目标是创建去中心化金融，但去中心化金融并不总是像它应该是的那样去中心化。去中心化减少了诈骗。


    Defi 曾用于“Sushiswap”项目。`Sushiswap` 未知的创始人于 2020 年 9 月 5 日停止了该项目，将其所有的 `Sushi` 代币兑换
    `ETH`。`SUSHI` 代币的价值在从 `Uniswap` 协议分拆时曾升至 10 美元，但在创始人转换其代币后跌至 0.6 美元（撰写本文时）。这说明了即使在
    Defi 内部，单点故障也是可能发生的。


    ### 你的责任

    即使 Defi 是没有风险且没有错误的，它也不对你的错误负责。Defi 将责任从中间人转移到了用户身上。如果你不小心丢失了资产，没有人会追究你的责任；因此，在
    Defi 领域开发防止人为错误的工具至关重要。独立性伴随着巨大的责任。许多用户不习惯以这种方式照顾自己，导致亏钱或被诈骗。


    Defi 是一项全新的、实验性的技术，存在一些担忧和问题，特别是在安全方面。去中心化金融的和支持者预计这些问题将在未来得到解决。


    ## 五


    如果 Defi 是一个无法立即理解的抽象概念，那么理解去中心化金融的最佳方法就是探索它的生态系统和用例。Defi 是区块链行业中一个充满活力的部门，满足每个人和每件事的需求。如果现实世界存在某种金融服务或产品，那么在
    `Ethereum` 上一定有区块链版本。


    生态系统每天都在增长，每个月我们都能看到几个项目正处于建立市场主导地位的过程中。根据 `Defi Pulse` 的数据，整个 Defi 领域包含价值 550
    亿美元的加密资产。虽然大部分项目是去中心化交易所和借贷协议，但我们将在下一节中探讨其他值得关注的用例。


    ### 去中心化交易所

    去中心化交易所 (`DEXs`) 是 Defi 的核心。它们在加密货币投资者中流行起来，是因为它们提供了去中心化的非托管交易。中心化交易所 (`CEXs`)
    由金融服务公司运营，采用由市场做市者 (`MMs`) 维护的订单簿格式。虽然 CEXs 提供加密货币资产，但它们的平台本质上是中心化的，这会对安全、信任和隐私产生负面影响。


    另一方面，开发者管理 DEXs，其格式基于智能合约。它们的智能合约执行交易、持有流动性、处理提现/存款，以及你可以想象到的任何其他操作。因此，实际上没有中间人与用户资金交互或控制它们。


    一些最受欢迎的 DEX 包括 `Uniswap`、`Bancor`、`dYdX`、`PancakeSwap` 和 `SushiSwap`。虽然大多数运行基于自动做市商
    (`AMM`)，但某些 DEXs 使用订单簿提供了类似于 `CEX` 的体验。托管是这两种方法之间的主要区别。


    在第一种情况下，投资者直接从他们的钱包执行交易。在第二种情况下，投资者必须先在 DEX 上存资金才能进行交易。


    ### 自动做市商

    自动做市商 (`AMM`) 是一种持有链上流动性储备的智能合约，取代了订单簿。`AMM` 从所谓的流动性提供者那里吸引流动性，这些人在财务上被激励借出自己的加密货币，以获得费用形式的奖励。


    客户不是在交易所的订单簿上交易，而是通过智能合约与其他用户进行交易。这种系统有其自己的优缺点。


    #### 优点：

    - 去中心化：智能合约是预设的协议，通过自主执行指令工作。当 DEXs 与治理框架结合使用时，本质上是将平台及其资产的所有权转移给用户。当然，这里没有中心化实体。

    - 非托管：交易者和流动性提供者直接从他们的加密货币钱包连接到 DEX，保持对其资产的完全托管权。然后使用智能合约来指定和处理所有交易。

    - 无操纵：CEXs 以市场操纵和内幕交易而闻名。DEXs 无法以有利于自己的方式影响价格，因为没有人能从中活动中获益。

    '
