- raw: "\n\nDecentralized finance is currently one of the blockchain and cryptocurrency\
    \ space's fastest-growing sectors. Defi has grown rapidly in the last year, but\
    \ materials to help people understand the concept have lagged. Defi is a network\
    \ of Decentralized Applications (Dapps) that offer financial services via dispersed\
    \ networks without the need for a central authority. Because the majority of the\
    \ Defi Dapps currently being developed are on the Ethereum blockchain, we will\
    \ focus on Defi for the purposes of this book.\n\nIn 2019 and 2020, Defi has been\
    \ a major theme in Ethereum's development. Defi Dapps had amassed more than $1\
    \ billion in cryptocurrency at the time of writing. Defi is expected to expand\
    \ further in the coming years and is critical in realizing Ethereum's lofty vision\
    \ and ambition.\n\nDefi has grown at an unprecedented rate. In fact, the speed\
    \ at which new concepts and innovations arrive is so dramatic that veterans and\
    \ beginners alike fail with keeping up and understanding its ever-growing importance.\
    \ As with any other subject, information overload is very likely unless we approach\
    \ the right data structured, intuitive, and progressive.\n\nThis book is written\
    \ for beginners who are familiar with basic blockchain and crypto concepts but\
    \ have not yet dared to tread into the world of decentralized finance. This book\
    \ carefully explains every facet of Defi while emphasizing its use cases, features,\
    \ and platforms.\n\nThe majority of this book revolves around comprehending specific\
    \ and popular use cases to understand decentralized finance through practical\
    \ knowledge. By covering decentralized exchanges, yield farming, lending, derivatives,\
    \ stablecoins, insurance, and other topics, you will become capable of knowing\
    \ how Defi works at the level of an experienced user.\n\nOne \n\nTo shed light\
    \ on people who are new to Defi, we will first go over the fundamentals of how\
    \ traditional financial institutions work. For the sake of simplicity, we will\
    \ concentrate on the most leveraged institutions in the traditional financial\
    \ system, banks, and discuss their key areas to identify potential risks.\n\n\
    **The Banks**\n\nBanks are the behemoths of the financial sector, processing payments,\
    \ collecting deposits, and extending credit to people, companies, other financial\
    \ organizations, and even governments. They are so enormous that the combined\
    \ market capitalization of the world's top ten banks exceeds $2 trillion. On the\
    \ other hand, the total market capitalization of the entire cryptocurrency market\
    \ was valued at around $200 billion on December 31, 2019.\n\nBanks are vital parts\
    \ of the financial industry's moving machine, enabling money to travel across\
    \ the globe via value transfer services (deposit, withdrawal, transfers), extending\
    \ credit lines (loans), and more. On the other hand, banks are managed by humans\
    \ and governed by policies that are vulnerable to human-related risks like mismanagement\
    \ and corruption.\n\nThe 2008 global financial crisis exemplified excessive risk-taking\
    \ by banks, and governments were forced to bail out the banks in massive amounts.\
    \ The crisis exposed the traditional financial system's flaws and highlighted\
    \ the need for it to improve.\n\nDefi aims to create a better financial landscape\
    \ enabled by the internet and blockchain technology, focusing on three key segments\
    \ of the banking system:\n\n1.  Payment and clearance system (remittance)\n\n\
    2.  Accessibility\n\n3.  Centralization and Transparency\n\n**1. Payment and Clearance**\n\
    \nSystem If you've ever tried to send money to someone or a business in another\
    \ country, you know how inconvenient it can be—remittances involving banks all\
    \ over the world typically take a few working days to complete and come with several\
    \ fees. There may be issues with documentation, anti-money laundering compliance,\
    \ privacy concerns, and other factors to make matters worse.\n\nFor example, suppose\
    \ you live in the United States and want to send $1,000 from your bank account\
    \ in the United States to a friend's bank account in Australia. In that case,\
    \ you will typically incur three fees: the exchange rate from your bank, the international\
    \ wire outbound fee, and the international wire inbound fee. Furthermore, depending\
    \ on the recipient's bank's location, the recipient will receive the money in\
    \ a few working days.\n\nThe cryptocurrency that powers the Defi movement allows\
    \ you to avoid intermediaries who take the lion's share of the profits from these\
    \ transfers. It is also likely to be faster - your transfers will be processed\
    \ with no questions asked and at a lower fee than banks. Transferring cryptocurrencies\
    \ to any account in the world, for example, would take anywhere from 15 seconds\
    \ to 5 minutes, depending on several factors, plus a small fee (e.g., $0.02 on\
    \ Ethereum).\n\n**2. Accessibility**\n\nChances are, if you're reading this book,\
    \ you're banked and have access to financial services provided by banks, such\
    \ as opening a savings account, taking out a loan, investing, and so on. However,\
    \ many more people are less fortunate and lack access to even the most basic savings\
    \ account.\n\nAccording to the World Bank, as of 2017, 1.7 billion individuals\
    \ lacked access to financial services, with more than half of them living in developing\
    \ nations. They are mostly from low-income families, and their main reasons for\
    \ not having a bank account are poverty, geography, and lack of trust.\n\nAccess\
    \ to banking is difficult for the 1.7 billion unbanked, but Defi has the potential\
    \ to make it easier. In contrast to lengthy verification processes, accessing\
    \ Defi Dapps only requires a mobile phone and internet access. According to the\
    \ World Bank, two-thirds of the 1.7 billion unbanked have access to mobile phones,\
    \ and Defi Dapps, rather than traditional banks, can be their gateway to accessing\
    \ financial products.\n\nDefi is a movement that advocates for borderless, censorship-free,\
    \ and easily accessible financial products for all. Defi protocols are non-discriminatory\
    \ and level the playing field for all.\n\n**3. Centralization and Transparency**\n\
    \nTraditional, regulated financial organizations such as banks, which comply with\
    \ government rules and regulations, are without a doubt among the safest locations\
    \ to keep money. They are not without flaws, however, and even large banks can\
    \ fail. Both Washington Mutual, which had over $188 billion in deposits, and Lehman\
    \ Brothers, which had $639 billion in assets, failed in 2008. Over 500 bank failures\
    \ have been reported in the United States alone.\n\nBanks are one of the financial\
    \ system's centralized points of failure; the failure of Lehman Brothers sparked\
    \ the beginning of the financial crisis of 2008. Given recent instances, the concentration\
    \ of power and cash in the hands of banks is risky.\n\nTransparency is also related\
    \ to this; regular investors cannot fully understand what financial institutions\
    \ do. Credit rating agencies awarding AAA ratings (best and safest investments)\
    \ to high-risk mortgage-backed securities was one of the factors that precipitated\
    \ the 2008 financial crisis\n\nWith Defi, things will be different. Defi protocols\
    \ built on public blockchains like Ethereum are mostly open-sourced for auditing\
    \ and transparency. They typically have decentralized governing organizations\
    \ to ensure that everyone is aware of what is going on and that no bad actors\
    \ can make bad decisions independently.\n\nDefi protocols are written as lines\
    \ of code—you can't cheat the codes because they treat all participants equally\
    \ and without discrimination. Because the codes are available to public scrutiny,\
    \ they operate precisely how they are intended to. Any weaknesses are immediately\
    \ discovered. At the end of the day, DeFi's greatest strength is its ability to\
    \ bypass intermediaries and operate without censorship."
  fmt: '

    Decentralized finance is currently one of the blockchain and cryptocurrency space''s
    fastest-growing sectors. Defi has grown rapidly in the last year, but materials
    to help people understand the concept have lagged. Defi is a network of Decentralized
    Applications (Dapps) that offer financial services via dispersed networks without
    the need for a central authority. Because the majority of the Defi Dapps currently
    being developed are on the `Ethereum` blockchain, we will focus on Defi for the
    purposes of this book.


    In 2019 and 2020, Defi has been a major theme in `Ethereum`''s development. Defi
    Dapps had amassed more than $1 billion in cryptocurrency at the time of writing.
    Defi is expected to expand further in the coming years and is critical in realizing
    `Ethereum`''s lofty vision and ambition.


    Defi has grown at an unprecedented rate. In fact, the speed at which new concepts
    and innovations arrive is so dramatic that veterans and beginners alike fail with
    keeping up and understanding its ever-growing importanceimportance. As with any
    other subject, information overload is very likely unless we approach the right
    data structured, intuitive, and progressive.


    This book is written for beginners who are familiar with basic blockchain and
    crypto concepts but have not yet dared to tread into the world of decentralized
    finance. This book carefully explains every facet of Defi while emphasizing its
    use cases, features, and platforms.


    The majority of this book revolves around comprehending specific and popular use
    cases to understand decentralized finance through practical knowledge. By covering
    decentralized exchanges, yield farming, lending, derivatives, stablecoins, insurance,
    and other topics, you will become capable of knowing how Defi works at the level
    of an experienced user.


    # One


    To shed light on people who are new to Defi, we will first go over the fundamentals
    of how traditional financial institutions work. For the sake of simplicity, we
    will concentrate on the most leveraged institutions in the traditional financial
    system, banks, and discuss their key areas to identify potential risks.


    ## The Banks


    Banks are the behemoths of the financial sector, processing payments, collecting
    deposits, and extending credit to people, companies, other financial organizations,
    and even governments. They are so enormous that the combined market capitalization
    of the world''s top ten banks exceeds $2 trillion. On the other hand, the total
    market capitalization of the entire cryptocurrency market was valued at around
    $200 billion on December 31, 2019.


    Banks are vital parts of the financial industry''s moving machine, enabling money
    to travel across the globe via value transfer services (deposit, withdrawal, transfers),
    extending credit lines (loans), and more. On the other hand, banks are managed
    by humans and governed by policies that are vulnerable to human-related risks
    like mismanagement and corruption.


    The 2008 global financial crisis exemplified excessive risk-taking by banks, and
    governments were forced to bail out the banks in massive amounts. The crisis exposed
    the traditional financial system''s flaws and highlighted the need for it to improve.


    Defi aims to create a better financial landscape enabled by the internet and blockchain
    technology, focusing on three key segments of the banking system:


    1. Payment and clearance system (remittance)

    2. Accessibility

    3. Centralization and Transparency


    ## 1. Payment and Clearance


    System If you''ve ever tried to send money to someone or a business in another
    country, you know how inconvenient it can be—remittances involving banks all over
    the world typically take a few working days to complete and come with several
    fees. There may be issues with documentation, anti-money laundering compliance,
    privacy concerns, and other factors to make matters worse.


    For example, suppose you live in the United States and want to send $1,000 from
    your bank account in the United States to a friend''s bank account in Australia.
    In that case, you will typically incur three fees: the exchange rate from your
    bank, the international wire outbound fee, and the international wire inbound
    fee. Furthermore, depending on the recipient''s bank''s location, the recipient
    will receive the money in a few working days.


    The cryptocurrency that powers the Defi movement allows you to avoid intermediaries
    who take the lion''s share of the profits from these transfers. It is also likely
    to be faster - your transfers will be processed with no questions asked and at
    a lower fee than banks. Transferring cryptocurrencies to any account in the world,
    for example, would take anywhere from 15 seconds to 5 minutes, depending on several
    factors, plus a small fee (e.g., $0.02 on `Ethereum`).


    ## 2. Accessibility


    Chances are, if you''re reading this book, you''re banked and have access to financial
    services provided by banks, such as opening a savings account, taking out a loan,
    investing, and so on. However, many more people are less fortunate and lack access
    to even the most basic savings account.


    According to the World Bank, as of 2017, 1.7 billion individuals lacked access
    to financial services, with more than half of them living in developing nations.
    They are mostly from low-income families, and their main reasons for not having
    a bank account are poverty, geography, and lack of trust.


    Access to banking is difficult for the 1.7 billion unbanked, but Defi has the
    potential to make it easier. In contrast to lengthy verification processes, accessing
    Defi Dapps only requires a mobile phone and internet access. According to the
    World Bank, two-thirds of the 1.7 billion unbanked have access to mobile phones,
    and Defi Dapps, rather than traditional banks, can be their gateway to accessing
    financial products.


    Defi is a movement that advocates for borderless, censorship-free, and easily
    accessible financial products for all. Defi protocols are non-discriminatory and
    level the playing field for all.


    ## 3. Centralization and Transparency


    Traditional, regulated financial organizations such as banks, which comply with
    government rules and regulations, are without a doubt among the safest locations
    to keep money. They are not without flaws, however, and even large banks can fail.
    Both Washington Mutual, which had $188 billion in deposits, and Lehman Brothers,
    which had $639 billion in assets, failed in 2008. Over 500 bank failures have
    been reported in the United States alone.


    Banks are one of the financial system''s centralized points of failure; the failure
    of Lehman Brothers sparked the beginning of the financial crisis of 2008. Given
    recent instances, the concentration of power and cash in the hands of banks is
    risky.


    Transparency is also related to this; regular investors cannot fully understand
    what financial institutions do. Credit rating agencies awarding `AAA` ratings
    (best and safest investments) to high-risk mortgage-backed securities was one
    of the factors that precipitated the 2008 financial crisis.


    With Defi, things will be different. Defi protocols built on public blockchains
    like `Ethereum` are mostly open-sourced for auditing and transparency. They typically
    have decentralized governing organizations to ensure that everyone is aware of
    what is going on and that no bad actors can make bad decisions independently.


    Defi protocols are written as lines of code—you can''t cheat the codes because
    they treat all participants equally and and discrimination. Because the codes
    are available to public scrutiny, they operate precisely how they are intended
    to. Any weaknesses are immediately discovered.

    '
  trans: '

    去中心化金融（DeFi）是目前区块链和加密货币领域增长最快的部门之一。Defi 在过去一年增长迅速，但帮助人们理解这一概念的材料却滞后。Defi 是一个去中心化应用（Dapps）网络，通过分散的网络提供金融服务，无需中央机构。由于目前开发的大多数
    Defi Dapps 都运行在 `Ethereum` 区块链上，本书的重点将放在 Defi。


    2019 年和 2020 年，Defi 是 `Ethereum` 开发的主要主题。在本书书中，Defi Dapps 已经积累了超过 10 亿美元的加密货币。预计
    Defi 将未来几年进一步扩大，它是实现 `Ethereum` 宏伟愿景和雄心的关键。


    Defi 以前所未有的速度增长。事实上，新概念和创新的出现速度非常剧烈，以至于老手和新手都无法跟上并理解其日益增长的重要性。与任何其他学科一样，除非我们采用正确的结构化、直观且循进的数据方法来处理，否则极有可能出现信息过载。


    本书专为熟悉基础区块链和加密货币概念，但尚未敢于涉足去中心化金融世界的初学者编写。本书仔细解释了 Defi 的每一个方面，同时强调了它的用例、特征和平台。


    本书的大部分内容围绕理解特定的热门用例，通过实践知识来理解去中心化金融。通过涵盖去中心化交易所、收益农场、贷款、衍生品、稳定币、保险和其他主题，你将能够像经验用户一样了解
    Defi 的工作原理。


    # 第一章


    为了让初接触 Defi 的人受益，我们将首先回顾传统金融机构运作的基本原理。为了简单起见，我们将集中讨论传统金融系统中杠杆最高的机构——银行，并讨论它们的关键领域以识别潜在风险。


    ## 银行


    银行是金融领域的巨头，负责处理支付、收集存款并向个人、公司、其他金融机构甚至政府提供信贷。它们规模如此巨大，以全球十大银行的市值总超过了 2 万亿美元。另一方面，2019
    年 12 月 31 日，整个加密货币市场的总市值估计约为 2000 亿美元。


    银行是金融行业运行机制中的重要组成部分，通过价值转移服务（存款、取款、转账）让资金跨越全球，提供信贷额度（贷款）等。另一方面，银行由人类管理，并受政策治理，这些政策容易受到管理不当和腐败等人为相关风险的影响。


    2008 年全球金融危机体现了银行的过度冒险行为，政府被迫投入巨额资金救助银行。危机暴露了传统金融体系的缺陷，并凸显了其改进的必要性。


    Defi 旨在通过互联网和区块链技术创造一个更好的金融格局，重点关注银行系统的三个关键领域：


    1. 支付与清算系统（汇款）

    2. 可访问性

    3. 中心化与透明度


    ## 1. 支付与清算系统


    如果你曾尝试向另一个国家的个人或企业汇款，你就知道这有多不方便——涉及全球银行的汇款通常需要几个工作日才能完成，并产生多项费用。文件问题、反洗钱合规性、隐私担忧和其他因素可能让情况变得更糟。


    例如，假设你住在美国，想从你在美国的银行账户向澳大利亚朋友的银行账户发送 1000 美元。在这种情况下，你通常会产生三种费用：银行的汇率差、国际汇出出费和国际汇入入费。此外，取决于接收方银行的位置，接收者将在几个工作日后收到资金。


    驱动 DeFi 运动的加密货币允许你避开在这些转账中获取大部分利润的中介。它还可能更快——你的转账将在不经任何询问的情况下处理，且费用比银行更低。例如，将加密货币转移到世界上任何账户可能需要
    15 秒到 5 分钟不等（取决于多个因素），再加上一小笔费用（例如，在 `Ethereum` 上为 0.02 美元）。


    ## 2. 可访问性


    很有可能，如果你正在阅读这本书，说明你已经拥有银行账户，并可以使用银行提供的金融服务，如开设储蓄账户、贷款、投资等。然而，有更多的人没有那么幸运，甚至无法获得最基础的储蓄账户。


    根据世界银行的数据，截至 2017 年，有 17 亿个人无法获得金融服务，其中超过一半的人居住在发展中国家。他们大多来自低收入家庭，没有银行账户的主要原因是贫困、地理因素和缺乏信任。


    对于这 17 亿没有银行账户的人来说，获取银行服务很困难，但 DeFi 有潜力让其变得更容易。与冗长的验证过程相比，访问 DeFi Dapps 只需要手机和互联网连接。根据世界银行的数据，17
    亿没有银行账户的人中有二之三可以使用手机，而 DeFi Dapps 而非传统银行，可以成为他们获取金融产品的网关。


    DeFi 是一场倡导为所有人提供无边界、无审查且易于获取的金融产品的运动。DeFi 协议是非歧视的，并为所有人创造了平等的竞争环境。


    ## 3. 中心化与透明度


    传统的、受监管的金融机构（如遵守政府规则的银行）无疑是存放资金最安全的地方。然而然而它们并非没有缺陷，即使是大型银行也会倒闭。2008 年，拥有 188 亿美元存款的华盛顿银行和拥有
    6390 亿美元资产的雷曼兄弟银行都倒闭了。仅美国一个国家就报告了 500 多家银行倒闭。


    银行是金融体系的中心化故障点之一；雷曼兄弟的倒闭引发了 2008 年金融危机的开始。鉴于近期的案例，权力和资金集中在银行手中是有风险的。


    透明度也与此相关；普通投资者无法完全理解金融机构的运作。信用评级机构给高风险抵押贷款证券授予 `AAA` 评级（最高级和最安全的投资）是诱发 2008 年金融危机的因素之一。


    有了 DeFi，情况将有所不同。构建在 `Ethereum` 等公共区块链上的 DeFi 协议大多是开源的，以便审计和透明化。它们通常拥有去中心化治理组织，以确保每个人了解发生的情况，并防止坏者独立做出错误决定。

    '
