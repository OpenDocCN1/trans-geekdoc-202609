    \ incorporated into other Defi services.\n\n2\\. **Asset-backed** stablecoins\
    \ use smart contracts to assemble and liquidate collateral in the form of cryptocurrencies\
    \ or other assets.\n\n3\\. **Algorithmic** stablecoins attempt to maintain the\
    \ peg through dynamic expansion and contraction of token supply. Because they\
    \ operate on a noncustodial, decentralized, trust-minimized basis, asset-backed\
    \ and algorithmic stablecoins are Defi services themselves. As with other areas\
    \ of Defi, projects are experimenting with different mechanisms. How effective\
    \ each will be in maintaining its peg at scale and through different market conditions\
    \ remains a source of uncertainty.\n\n## EXCHANGES\n\nExchanges are important\
    \ to Defi in two ways: They allow holders of various digital assets to use Defi\
    \ services and provide opportunities to profit from appreciation in the value\
    \ of tokens. Centralized exchanges require traders to trust an operator to safeguard\
    \ user funds, provide accurate price information, match buyers and sellers to\
    \ process trades, settle transactions, and engage in transaction monitoring. This\
    \ is true whether the exchange is purely fiat-based (such as NASDAQ), facilitates\
    \ trading between fiat and digital assets (such as Coinbase), or only processes\
    \ trades among digital assets (such as Uniswap). While centralized exchanges can\
    \ trade digital assets used in Defi services, they are custodial and neither trust-minimized\
    \ nor programmable.\n\nDefi exchanges, by contrast, decentralize key functions.\
    \ They can be accessed programmatically with noncustodial wallets. Smart contracts\
    \ automatically process transactions on a peer-to-peer basis or against a pool\
    \ of capital. While exchanges can operate order books either on or off the blockchain,\
    \ the most prominent form of Defi exchange, automated market makers (AMMs), does\
    \ away with the traditional order book entirely."
