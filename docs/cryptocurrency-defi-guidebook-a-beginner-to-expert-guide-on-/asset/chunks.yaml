    ## SYNTHETIX


    `Synthetix` is, as the name implies, a protocol for Ethereum-based Synthetic Assets
    (called `Synths`). `Synthetix` is made up of two parts: Synthetic Assets (`Synths`)
    and its exchange, `Synthetix Exchange`. `Synthetix.Exchange` enables the creation
    and exchange of `Synths`.


    ### What are Synthetic Assets (Synths)?


    `Synths` are assets or a combination of assets with the same value or impact as
    another item. `Synths` follow the value of underlying assets and provide exposure
    to them without requiring the actual asset to be held.


    Normal `Synths` and Inverse `Synths` are the two types of `Synths` currently available.
    Normal `Synths` are positively connected with the underlying assets, whereas Inverse
    `Synths` are adversely correlated.


    Synthetic Gold (`sXAU`) is an example of a Synthetic Asset because it tracks the
    price performance of gold. `Synthetix` tracks real-world asset values using `Chainlink`,
    a smart contract oracle that collects price information from various trusted third-party
    sources to prevent tampering.


    Inverse Bitcoin (`iBTC`) is an example of an Inverse Synthetic Asset since it
    follows the inverse price performance of Bitcoin. Each Inverse `Synths` has three
    critical values: the entry price, the lower limit, and the higher limit.


    As an example, consider Inverse Synthetic Bitcoin (`iBTC`). Assume that Bitcoin
    (`BTC`) is priced at $10,600 at the time of formation - this will be the entrance
    price. If Bitcoin falls from $400 to $10,200, the `iBTC` Synth will be worth $400
    more and will be priced at $11,000. The inverse will also be true. If Bitcoin
    reaches $11,000, the `iBTC` Synth is now worth $10,200.


    Inverse `Synths` trade in a range that has a 50% upper and lower limit from the
    entering price. This limits the maximum profit or loss you can make on Inverse
    `Synths`. When any of the limits is reached, the exchange rates for the tokens
    are frozen, and the positions are liquidated. These Inverse `Synths` can only
    be swapped at `Synthetix` once they have been disabled and liquidated. At those
    predetermined values, you can exchange. They are then reset with new limitations.


    ### Why Synthetic Assets?


    As previously said, `Synths` provide traders with price exposure to the asset
    without the requirement to possess the underlying asset. Synthetic Gold (`sXAU`)
    allows traders to engage in the market with far less bother than regular gold
    brokerages (no sign-ups, no traveling, no middleman, etc.).


    Another advantage of synthetics is that they may be traded without friction, which
    means that Synthetic Gold can be readily exchanged for Synthetic JPY, Synthetic
    Silver, or Synthetic Bitcoin on `Synthetix.Exchange`. This also implies that anyone
    having an Ethereum wallet now has unrestricted access to any real-world asset!


