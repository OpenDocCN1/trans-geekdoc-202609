- raw: "Smart contracts, as previously said, are self-executing computer programs\
    \ that operate autonomously and activate based on preset circumstances. Smart\
    \ contracts provide significant advantages such as decentralization, security,\
    \ and transparency, despite their slower execution speed when compared to centralized\
    \ data systems.\n\nAnyone can see and analyze the code of a smart contract to\
    \ see whether it is malicious or not, which is a stark contrast to the banking\
    \ industry. Furthermore, smart contracts do not take sides and only perform what\
    \ they are instructed, ensuring that an Ethereum transaction will never take an\
    \ unexpected turn.\n\nSmart contracts are third-party mediators that handle transactions\
    \ and agreements reached by at least two people. They eliminate the requirement\
    \ for trust in an otherwise trustless system by allowing users to employ smart\
    \ contracts instead of depending on the other party's good faith. They also let\
    \ users avoid centralized middlemen like exchanges and banks, which would normally\
    \ assist them with on-chain transactions.\n\nTo conclude, Ethereum may be seen\
    \ as a smart contract-enabled version of Bitcoin, allowing it to execute computational\
    \ logic and enable functionalities otherwise unavailable in first-generation blockchains.\n\
    \n**Gas Fees**\n\nUsers engage directly with smart contracts in Defi; thus, there\
    \ are no gas fees. All of the goods and services are non-custodial, which means\
    \ that assets may stay in the user's wallet rather than being deposited on the\
    \ platform. A person may, for example, exchange tokens on Uniswap straight from\
    \ his MetaMask.wallet. The disputed coins are never stored in Uniswap's native\
    \ crypto wallets. The tokens are instead exchanged for other tokens in the exchange's\
    \ smart contracts.\n\nWhile the noncustodial feature increases the degree of decentralization\
    \ in Defi, it comes at a high cost, which may discourage investors. A centralized\
    \ exchange typically processes internal transactions to transfer assets, with\
    \ no extra costs other than the trading fees. Because a DEX does not store the\
    \ assets directly and requires the user to engage with smart contracts, all transactions\
    \ are subject to Ethereum's gas fees.\n\n## HOW ETHEREUM GAS POWER TRANSACTIONS\n\
    \nAll blockchain networks are supported by miners, a group of users who host nodes\
    \ and confirm transactions. Blockchains must compensate miners with transaction\
    \ fees to attract them and allow them to function in the first place.\n\nOn Ethereum,\
    \ transaction costs are referred to as gas fees. Every conceivable smart contract\
    \ transaction or activity, like as moving tokens, verifying balances, executing\
    \ a smart contract function, and so on, consumes gas.\n\nAnother function of gas\
    \ is that it establishes priority for various tasks. The greater the expense,\
    \ the more difficult the job. As a result, gas acts as a limit, preventing the\
    \ network from being overburdened by low-cost, basic operations.\n\nWhen there\
    \ aren't enough miners, and Ethereum sees a spike in activity, the blockchain\
    \ encounters a phenomenon known as network congestion. Gas costs soar at that\
    \ point, and the gas price for all transactions rises as well. Congestion on the\
    \ network may persist for weeks, if not months, and the blockchain's status can\
    \ only revert to normal if demand decreases. Fees may run from $40 to $100 per\
    \ transaction, if not more, in certain instances. Because fees make for a major\
    \ part of their transactions, investors who trade small sizes are naturally inclined\
    \ to pause their Defi activity during this time.\n\n## HOW DECENTRALIZED IS DEFI?\n\
    \nIt's difficult to say how decentralized Defi is. For the purpose of simplicity,\
    \ we shall divide decentralization into three categories: centralized, semi-decentralized,\
    \ and entirely decentralized.\n\n1. Centralized\n\n*   Features: Custodial, centralized\
    \ price feeds, centralized interest rates, and centralized liquidity for margin\
    \ calls.\n\n*   Examples include Celsius, Nexo, BlockFi, and Salt.\n\n2. Decentralized\
    \ to a degree (has one or more of these characteristics but not all)\n\n*   Features:\
    \ Decentralized platform development/updates, decentralized interest rate determination,\
    \ permissionless margin liquidity, permissionless initiation of margin calls,\
    \ decentralized price feeds, noncustodial\n\n*   Examples include bZx, dYdX, MakerDAO,\
    \ Compound.\n\n3. Completely Decentralized\n\n*   Features: All the components\
    \ are decentralized\n\n*   Examples include: No Defi protocol is completely decentralized\
    \ yet.\n\n## THE DEFI DASHBOARD\n\nA dashboard is a simple platform that centralizes\
    \ all of your Defi activities. It is a great tool for seeing and tracking the\
    \ location of your assets across various Defi protocols. The dashboard can categorize\
    \ your assets into many categories, such as deposits, debt, and investments.\n\
    \nWhen you access your dashboard, you will typically be required to provide your\
    \ Ethereum address (e.g.: 0x4Cdc86fa95Ec2704f0849825f1F8b077deeD8d39). You could\
    \ also specify your Ethereum Name Service (ENS) domain. A human-readable Ethereum\
    \ address that you can acquire for a set amount of time is known as an ENS domain.\
    \ It's analogous to Internet domain names like www.coingecko.com, which then map\
    \ to the server's IP address where CoinGecko is hosted.\n\nThere are various dashboards\
    \ available on the market that can track your assets, like Frontier, InstaDApp,\
    \ MyDeFi, and Zerion. To keep things simple, we'll look at DeFiSnap, one of the\
    \ more well-known dashboards.\n\n## STEP-BY-STEP GUIDE TO USING DEFISNAP\n\nStep\
    \ 1:\n\n*   Navigate to [https://www.defisnap.io](https://www.defisnap.io)\n\n\
    *   Enter your ENS domain or Ethereum address.\n\n*   I used defiportal.eth here,\
    \ but I can also enter 0x358a6c0f7614c44b344381b0699e2397b1483252.\n\nStep 2\n\
    \n*   You're on the dashboard!\n\n*   You can view your wallet balance as well\
    \ as any Defi deposits, debt, and investments.\n\nYou can also look at the following\
    \ dashboards:\n\n*   [https://mydefi.org/apps](https://mydefi.org/apps)\n\n* \
    \  [https://unspent.io/](https://unspent.io/)\n\n*   [https://zerion.io/](https://zerion.io/)\n\
    \n[https://frontierwallet.com/](https://frontierwallet.com/) (mobile phone dashboard)\n\
    \nThree \n\nHow can investors place more than two billion dollars in decentralized\
    \ applications against which they have no legal recourse and which are frequently\
    \ less than three years old? What is the source of this trust? The answer can\
    \ be found in technology: blockchain technology. In the case of Defi, this level\
    \ of trust is typically provided by the Ethereum blockchain. While we presume\
    \ that readers of this book are already aware of Bitcoin and blockchain in general,\
    \ we will go over several crucial points in this section.\n\n## BITCOIN\n\nBitcoin\
    \ is the first blockchain in the world. Bitcoin's sharp price increase at the\
    \ end of 2017 made it known to larger segments of society for the first time.\
    \ Bitcoin's two primary characteristics are scarcity and security.\n\n*   It is\
    \ scarce because no more than 21 million Bitcoin will ever be issued. When Bitcoin\
    \ was established in 2009, it was the first and only restricted digital resource\
    \ that, unlike a digital picture or text, could not be replicated indefinitely.\
    \ Bitcoin is now referred to as »digital gold« in the investment world, as it\
    \ is primarily regarded as an alternative and uncorrelated investment asset. It\
    \ has never been hacked and currently trades at a price of more than 9,000 USD\
    \ (as of July 2020), resulting in a market cap of 127 billion USD."
