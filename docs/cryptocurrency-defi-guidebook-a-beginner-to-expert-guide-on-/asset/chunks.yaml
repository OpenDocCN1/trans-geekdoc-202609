- raw: "Defi fund management removes the investment manager and allows you to choose\
    \ the asset management plan that best meets your financial needs. Fees are also\
    \ reduced as a result of decentralized fund management.\n\nInstead of doing it\
    \ yourself, the Dapp will use algorithms to perform trades for you. Token Sets\
    \ will be introduced to help you understand how fund management can operate in\
    \ a decentralized ledger.\n\n## TOKENSETS\n\nTokenSets is a marketplace where\
    \ cryptocurrency users can purchase Strategy Enabled Tokens (SET). These tokens\
    \ provide automated asset management strategies that allow you to manage your\
    \ cryptocurrency portfolio without manually executing the trading strategy. With\
    \ an automatic trading approach, you won't have to actively monitor the market\
    \ 24 hours a day, seven days a week, decreasing lost chances and hazards from\
    \ emotional trading.\n\nEach Set is an ERC20 token made up of a basket of cryptocurrencies\
    \ that automatically rebalances its holdings based on your selected strategy.\
    \ SET, in other words, implements cryptocurrency trading strategies in the form\
    \ of tokens.\n\n**What kinds of Sets are available?**\n\nSets are classified into\
    \ two types: I Robo Sets and (ii) Social Trading Sets.\n\n**Robo Sets **\n\nRobo\
    \ Sets are trading algorithms that purchase and sell tokens depending on predetermined\
    \ rules contained in smart contracts. There are now four major categories of algorithmic\
    \ strategies:\n\n1.  Buy and Hold: This approach realigns the portfolio to its\
    \ target allocation to avoid overexposure to any single token and spreads risk\
    \ across multiple tokens.\n\n2.  Trend Trading: Using Technical Analysis indicators,\
    \ this method shifts from target asset to stablecoins based on the established\
    \ strategy.\n\n3.  Range-Bound: This method only works in bearish or neutral markets\
    \ and automates buying and selling inside a predefined range.\n\n4.  Inversion:\
    \ This technique is intended for individuals who want to “short” a benchmark.\
    \ Traders can buy this if they believe a benchmark is due for a correction.\n\n\
    **Social Trading Sets**\n\nSocial Trading Sets allow users to follow the top trading\
    \ methods of some of TokenSets' featured traders. By purchasing this Social Trading\
    \ Set, you will automatically replicate the trades made by these highlighted traders.\
    \ Social Trading Sets, like Robo Sets, are algorithmic-based, but instead of being\
    \ produced by the TokenSets team, they are written by notable traders.\n\n**What\
    \ are the benefits of using Sets?**\n\nTrading techniques are effectively tokenized\
    \ using sets. Set is likely the simplest way to go if you want to test out any\
    \ of the suggested trading techniques or follow in the footsteps of great traders.\n\
    \nThat being said, always use caution. Just because a Set has historically performed\
    \ well does not guarantee that it will continue to perform well in the future.\
    \ The cryptocurrency market is extremely volatile, and the adage “past performance\
    \ is not an indicator of future results” is especially true in this case. Instead,\
    \ investigate and analyze existing tactics to determine which one makes the most\
    \ sense for you, and then use TokenSets to get started quickly.\n\nFor example,\
    \ we will look at one of the best performing Robo Sets, the ETH/BTC RSI Ratio\
    \ Trading Set. The Robo Set in this scenario employs the Trend Trading Strategy,\
    \ which utilizes the Relative Strength Index (RSI) technical indicator. This trading\
    \ method increased in value by 102.33 percent, compared to 41.29 percent for holding\
    \ BTC and 94.17 percent for holding ETH. Because Token Set is still in its early\
    \ stages, there are only performance statistics for the previous three months\
    \ at writing.\n\nFourteen \n\nWhile decentralized payments can currently be made\
    \ by sending ETH or DAI directly, they may be improved—think cheaper and faster\
    \ transactions, timed transfers, transfer by conditions, and standardized invoicing\
    \ formats, among other things. Lighting Network, Request Network, xDai, and Sablier\
    \ are some of the more well-known initiatives focusing on decentralized payments.\
    \ In this chapter, we will look into Sablier, a project that we believe can address\
    \ some of society's most pressing concerns for the most vulnerable members of\
    \ society.\n\n## SABLIER\n\nSablier is a payment streaming application, which\
    \ means that payments and withdrawals can be conducted between multiple parties\
    \ in real-time and in small increments (by the second!). Consider hourly consultation\
    \ work, daily contract labor, or monthly rent payments made in real-time as work/progress\
    \ is completed. Sablier allows you to stream money in the same way that Spotify\
    \ allows you to stream music.\n\n**What Is a Streaming Payment?**\n\nPayments\
    \ are sent in real-time in periods set and agreed upon by both parties, rather\
    \ than having to wait for a predefined amount of time (e.g., monthly, bi-weekly).\
    \ Payees can now receive their pay in real-time and withdraw it whenever they\
    \ wish via Sablier.\n\n**Why is this important?**\n\nSablier, we believe, can\
    \ assist those who live paycheck to paycheck. These are the people who are most\
    \ vulnerable to income delays, as even a few days' delay means they won't be able\
    \ to put food on the table. When this happens, individuals frequently turn to\
    \ uncollateralized short-term payday loans with extremely high interest rates\
    \ (up to 500 percent APR).\n\nWith enormous interest rates and minimal revenue,\
    \ payday loan lenders are especially vulnerable to debt spirals, which have resulted\
    \ in many arrests in the United States for failing to return their loans.\n\n\
    **Trust**\n\nStreamed payment can be especially beneficial for new, remote contract\
    \ workers who previously had to rely on their new employers to pay them for the\
    \ work they did. When a contract is executed using Sablier, all parties are certain\
    \ that payments are being paid and can confirm this in real-time.\n\n**Timing**\n\
    \nSalary payments are often made monthly or bi-weekly, but there may be times\
    \ when money is required immediately—and payment streaming can assist with this.\
    \ A salaried employee does not have to wait until payday to collect his income;\
    \ he can withdraw as much as he has earned up to that point, which may alleviate\
    \ immediate problems.\n\nFurthermore, this aids in the avoidance of delays. Even\
    \ if a worker has complete faith in their company, streaming paychecks ensures\
    \ that the payment will be made in full after the period!\n\n**An illustration\
    \ of how it works**\n\nAssume you give online consulting services for a charge\
    \ of $60 per hour ($1 per minute). To begin, you'll need to decide whether to:\n\
    \n1.  Collect payment upfront, which may be unappealing to certain new clients;\n\
    \n2.  Collect payment later, which means you'll have to trust your client to pay\
    \ you; or\n\n3.  Use an escrow service/platform to safeguard both parties for\
    \ a commission.\n\nHowever, with the introduction of payment streaming, you will\
    \ no longer have to rely on either party to be truthful. You can get paid on a\
    \ minute-by-minute basis to ensure that both you and your clients get your money's\
    \ worth and that if they try to avoid paying, you'll just lose 1 minute of your\
    \ time. In essence, the “trust” component of an online transaction has been transferred\
    \ from a person to lines of immutable codes (the blockchain & smart contract).\n\
    \nFifteen \n\nTo participate in Defi, tokens must be locked in smart contracts.\
    \ Because of the enormous potential payoff, tokens trapped in smart contracts\
    \ are potentially subject to smart contract exploits. While most projects have\
    \ had their codebases audited, there is no way of knowing if the smart contracts\
    \ are genuinely secure, and there is always the risk of a hack that might result\
    \ in a loss.\n\nThere have lately been two high-profile Defi exploits employing\
    \ a Defi Dapp named bZx. Both exploits occurred on February 15th and 18th, 2020,\
    \ resulting in a total loss of 3,649 ETH, or around $1 million. The first exploit\
    \ resulted in a 1,271 ETH loss, while the second was a 2,378 ETH loss. Both attacks\
    \ are extremely complicated transactions involving numerous Defi Dapps."
