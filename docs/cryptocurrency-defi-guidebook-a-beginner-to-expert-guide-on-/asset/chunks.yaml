    \ time, Uniswap distributed 60% of UNI's genesis to the community via a 400 UNI\
    \ airdrop.\n\nOtherwise, decentralized protocols can launch a governance token\
    \ by simply listing it on an exchange without fair distribution. Investors who\
    \ are bullish on the project's future will then invest in the token and gain voting\
    \ rights by doing so. Since token holders are also voters, investors will be incentivized\
    \ to make the best possible decisions.\n\n**How governance works in practice**\n\
    \nThe act of voting and participating in governance revolves around the use of\
    \ governance tokens. Once dispensed, holders can propose changes and vote on existing\
    \ proposals. Additionally, community members can discuss governance issues and\
    \ upcoming features on online forums hosted by the project.\n\nAll acts of governance\
    \ require that the instigator locks governance tokens into smart contracts for\
    \ the duration of the process. Locking tokens is necessary to fight against proposal\
    \ spam and ensure that users spend more time creating higher-quality proposals\
    \ before sending them out.\n\nFor a proposal to be even considered, it must establish\
    \ a quorum. Essentially, each governance proposal must have a minimum number of\
    \ voters who have cast their vote. If the results favor the proposal, smart contracts\
    \ will approve it, given that the quorum has been reached.\n\nSix \n\nDefi encompasses\
    \ a wide range of activities that satisfy the requirements for trust-free, noncustodial,\
    \ open, programmable, and noncustodial financial services. In addition to ancillary\
    \ services like oracles and wallets, we identify six main Defi categories. The\
    \ distinctions between them aren't always obvious. This typology, on the other\
    \ hand, represents participant views of the Defi market in general.\n\n1.  **Stablecoins**\
    \ aims to keep the value of a token constant in relation to another asset, most\
    \ frequently the US dollar or another major fiat currency. Noncustodial stablecoins\
    \ are Defi services in and of themselves. Although custody stablecoins are centralized,\
    \ they may be used in Defi services.\n\n2.  **Exchanges**. Users may swap one\
    \ digital asset for another on exchanges. Defi exchanges avoid taking ownership\
    \ of user assets by matching orders and establishing prices algorithmically via\
    \ a decentralized order book or by using a decentralized order book.\n\n3.  **Credit**\
    \ entails the production of interest-bearing instruments with a set maturity date\
    \ that must be repaid, as well as the matching of lenders and borrowers to issue\
    \ such instruments.\n\n4.  **Derivatives** are financial instruments that have\
    \ their value determined by a function of an underlying asset or group of assets.\
    \ Futures and options are two common instances of derivatives that relate to the\
    \ value of an asset at a future date.\n\n5.  **Insurance** protects against risks\
    \ by exchanging the certainty of a modest premium payment for the chance of receiving\
    \ a big reimbursement in the case of a covered event.\n\n6.  **Asset management**\
    \ increases the value of an asset portfolio by balancing risk, time horizons,\
    \ diversity, and other factors. While there are examples throughout this report,\
    \ it's essential to remember that Defi is still evolving.\n\n7.  Borrowing and\
    \ lending.\n\n8.  Lottery\n\n9.  **Payments.** These classifications, as well\
    \ as the projects that fall under them, may evolve over time. As a result of the\
    \ programmability and modularity of Defi services, aggregators have developed\
    \ to mediate activity between these basic categories. Yearn Finance, for example,\
    \ is a yield farming business that optimizes profits from liquidity and collateral\
    \ supply. Exchange aggregators like 1inch and Matcha deliver trading orders to\
    \ the best-priced exchange. Users benefit from Zapper and Zerion's integrated\
    \ interfaces for order routing, yield optimization, and other Defi operations\
    \ across several protocols, which reduces complexity. Tally aggregates Defi governance\
    \ token activity to facilitate participation in governance decisions. Because\
    \ of their potential for better usability, aggregators may originate a significant\
    \ share of Defi activity in the future.\n\n## STABLECOINS\n\nStablecoins are crucial\
    \ to Defi because they separate the risk/return calculus of the Defi services\
    \ from the often high volatility of digital assets. Financial interoperability\
    \ requires stable prices for value exchange, and investors expect a steady unit\
    \ of account for financial services.\n\nBroadly, stablecoins can be organized\
    \ into three categories:\n\n1\\. **Custodial** or centralized stablecoins such\
    \ as USDC or Facebook's proposed Diem use holdings of fiat currency or high-quality\
