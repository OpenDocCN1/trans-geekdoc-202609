    以太坊网络的低效率使得构建在 ETH 之上的平台容易受到抢跑攻击（frontrunning attacks），算法套利交易者可以在内存池（meme-pool）中看到你的交易，并通过发送带有更高
    gas 费的 ETH 交易来抢跑，从而导致你以更高的价格购买代币。就像传统市场中违规交易者可能在知道巨额资金即将进入市场之前进行投资一样，攻击者可以作废、修改甚至操纵交易以从中获利。平台已经实施了相关政策，通过建立如先进先出（FIFO）、第三方签名者、随机挖矿和交易链等策略，来缓解抢跑带来的风险。


    ### 人为风险

    访问 DeFi 平台过于复杂，远比开通银行账户和管理密码要得多。丢失私钥、遭受钓鱼攻击或遭受 SIM 卡劫骗攻击可能导致你失去对数字资产的访问权限。存储资产需要周全流程和程序。


    ### 监管风险

    `KYC`、`AML` 和税收都是特定国家为了让 DeFi 在未来繁荣而必须克服的重要监管障碍。虽然成熟和发展中经济体都正着巨大的增长，但监管可能会对资本配置产生寒蝉效应。在美国，前货币监事布莱恩·布鲁克斯（Brian
    Brooks）指出，“我们目前的银行监管主要是为了防止人为失误……”并且“在缺乏联邦监管明确的情况下，美国州纷纷填补空白，创造了不一致规则的补丁，阻碍了国家市场的有序发展。”


    观察全球格局，监管的不一致性可能会损害行业增长，并加速主权国家与其管辖范围内运营的企业之间的冲突。监管风险的另一个关键因素是确定任何平台的去中心化程度。像
    `Compound` 这样的平台仍然允许 `admin key` 持有访问分配给智能合约的数字资产。中心化程度还可能影响利率、流动性和操纵行为。


    ### 透明度风险

    在确定机会时，拥有超越代码的敏锐洞察力至关重要。对工程团队的质量和数量、在奖励和治理方面的战略方向，以及项目如何与用户沟通，都是需要考虑的重要因素。鉴于该行业的协作性质，查看留言板和白皮书可以让你在判断项目成功概率方面获得优势，并了解还有谁也看好这一机会。通常，越成功的项目具有更高的透明度、知名的投资者和大量的追随者。


    ### 无常损失风险

    价格波动对你借入流动性池的资产的影响。必须理解这一风险因素以及自动做市商（`"AMM"`）如何设定价格。虽然许多系统现在都在演进，但 `Uniswap` 的
    AMM 变得越来越流行。每个池子根据两种资产的比例为资产定价。例如，一个 `ETH-Dai` 池可能包含 `10 ETH` 和 `15,000 Dai`（这意味着每单位
    `ETH` 的价格为 `15,000 Dai / 10 ETH = 1,500 Dai`）。现在，让我们假设 `ETH` 的价值从 `1 ETH = 1,500
    Dai` 增加到 `1 ETH = 2,000 Dai`。在这种情况下，交易者将向池中添加 `Dai` 并移除 `ETH` 以增加比例上的差额。


    相反，如果价格下跌，交易者将添加 `ETH` 并提取 `Dai`。最终的假设是池的总美元价值随时间推保持不变。


    回到价格上涨的场景，每个单位 `ETH` 的初始投资将是 `1 ETH` 和 `1,500 Dai`（代表总池的 `10.0%`，总价值为 `$3,000`）。为了达到
    `1 ETH = 2,000 Dai` 的价格，投资者必须添加 `Dai` 并移除 `ETH`。在这种特定情况下，池将从 `15,000 Dai` 和 `10
    ETH`（比例为 `1,500:1`）变为约 `17,193 Dai` 和 `8.6 ETH`（比例为 `2,000:1`）。


    到期时从池中提取资产的投资者将提取流动性池 `10.0%` 的流动性：`1,719.3 Dai` 和 `0.86 ETH`（价值 `2,000 = 1,720
    Dai`）= `3,439 Dai`。


    如果投资者选择持有 `ETH` 而不是将其投入流动性池，其价值将是 `1 ETH = 1,500 Dai * (2,000 / 1,500) = 2,666
    Dai + 1,500 Dai = 4,166 Dai`。


    在这种情况下，投资者的无常损失为 `3,439 Dai / 4,166 Dai = 17.4%`。通常，美元等值投资越大、价格波动越剧，损失幅度就越大。


    流动性池希望通过分享与所借入流动性池相关的交易活动费用来缓解风险。新兴协议正尝试通过新颖概念（如风险分配或更高的 `ROIs`）来应对这一挑战，每项决策都在速度、安全性和互操作性之间进行权衡。例如，`Bancor`
    现在为流动性池提供单边敞口，并提供在 90 天后生效的无常损失保护。


    ## 2. 套利：概览与策略实施


    通用的套利（俗称为“‘arb’”）策略涉及利用不同市场之间的价格差异。


    在传统市场中，外汇交易普及了套利交易，其中 3 种（或更多）货币之间可能存在价格不一致，被称为三角套利。


    例如，假设在以下金融服务机构中存在以下价格：


    ABC 公司：`USD / MXN: 20.14`

    EFG 公司：`USD / CAD: 1.28`

    `MXN / CAD: 0.063`


    如果投资者想在一笔 `1,000 MXN` 的交易中获利，他们可以：


    1. 以 `20.14` 的汇率将 `1,000 MXN` 转换为美元。这相当于 `1,000 MXN / 20.14` 转换比例 = `$49.65`。

    2. 以 `1.28` 的汇率将美元转换为 `CAD`。这相当于 `$49.65 * 1.28` 转换率 = `63.65 CAD`。

    3. 最后，以 `0.063` 的汇率转换回 `MXN`。这相当于 `63.65 CAD / 0.063` 转换比例 = `1,010.32 MXN`。


    （注：未未引用，上述数字是为了演示交易策略而夸大的。）


    该策略的收益为 `1.0%`（`1,010.32 MXN / 1,000 MXN – 1`），通过利用这三家机构之间的价格碎片化来实现。


    几十年来，外汇交易流动性的提高通过增加竞争、降低价差和交易者多样化，最大限度地减少了套利机会。现在利用这些差异需要先进的交易技术、杠杆和工程水平。


    DeFi 平台为投资者提供了多个存在严重碎片化的场所供其利用。DeFi 套利策略分为两类：收益套利和跨交易所套利。


    ### 交易所套利

    鉴于 DeFi 行业处于早期，增加的碎片化为套利交易者提供了一个充满短期交易机会的低效市场。高度复杂的交易机器人不断扫描执行高概率交易三角套利策略的机会。如今投资者在以太坊上使用两种主要的策略：(i)
    交易的原子批量处理，对交易所之间的定价实施严格的限价订单控制，这意味着如果不成交，否则交易不会执行；(ii) 优先 gas 费拍卖，投资者尝试通过不断修改给矿工的
    gas 费来执行特定交易，直到达到盈利点。

