  trans: "\n\nDeFi 基金管理消除了投资经理，让你能够选择最符合你财务需求的资产管理计划。由于去中心化的基金管理，费用也随之降低。\n\n你不需要自己操作，`Dapp`\
    \ 将使用算法为你执行交易。引入的 `Token Sets` 将帮助你理解基金管理如何在去中心化账本上运行。\n\n## TOKENSETS\n\n`TokenSets`\
    \ 是一个加密货币用户可以在其中购买策略型令牌（`SET`）的市场。这些令牌提供了自动化资产管理策略，让你能够在无需手动执行交易策略的情况下管理你的加密货币投资组合。通过自动交易的方法，你不需要每天\
    \ 24 小时、每周 7 天地主动监控市场，从而减少了错失的机会和情绪化交易带来的风险。\n\n每个 `Set` 都是 `ERC20` 代币，由一组加密货币组成，并根据你选择的策略自动重新平衡其持仓。换句话说，`SET`\
    \ 以令牌的形式实现了加密货币交易策略。\n\n### 有哪些类型的 Sets？\n\n`Sets` 分为两类：`(i) 机器人 Sets (Robo Sets)`\
    \ 和 `(ii) 社交交易 Sets (Social Trading Sets)`。\n\n### 机器人 Sets (Robo Sets)\n\n`Robo\
    \ Sets` 是交易算法，根据智能合约中预设的规则买卖令牌。目前有四类主要的算法策略：\n\n1. `买入并持有 (Buy and Hold)`：这种方法将投资组合重新调整到目标配置，以避免对任何单一令牌过度过度，并将风险分散到多个令牌上。\n\
    2. `趋势交易 (Trend Trading)`：使用`技术分析 (Technical Analysis)` 指标，根据既定策略从目标资产转向`稳定币`。\n\
    3. `震荡区间 (Range-Bound)`：这种方法仅在熊市或中性市场有效，并在预定义的范围内自动执行买卖。\n4. `反转 (Inversion)`：这种技术适用于想要“做空”基准的个人。如果交易者认为基准即将出现回调，就可以购买这种。\n\
    \n### 社交交易 Sets (Social Trading Sets)\n\n`Social Trading Sets` 允许用户关注 `TokenSets`\
    \ 中一些特色交易者的顶级交易方法。通过购买这种 `Social Trading Set`，你将自动复制这些优秀交易者的交易操作。`Social Trading\
    \ Sets` 与 `Robo Sets` 一样基于算法，但它们不是由 `TokenSets` 团队制作，而是由知名交易者编写的。\n\n 使用 Sets\
    \ 有什么好处？\n\n交易技术通过 `sets` 有效地代化。如果你想尝试任何建议的交易技术或遵循伟大交易者的脚步，`Set` 可能是最简单的方法。\n\n\
    尽管如此，请务必保持谨慎。仅仅因为一个 `Set` 在历史上表现良好，并不能保证它未来继续良好。加密货币市场极其波动，“过去的表现不代表未来结果”这一格言在这种情况下为格外。相反，请研究并分析现有策略，以确定哪种最适合你，然后使用\
    \ `TokenSets` 快速开始。\n\n例如，我们将查看表现最好的 `Robo Sets` 之一——`ETH/BTC RSI 比率交易 Set`。在这种情况下，该\
    \ `Robo Set` 采用了`趋势交易策略`，该策略利用了`相对强度指数 (RSI)` 技术指标。与持有 `BTC` 的 41.29% 以及持有 `ETH`\
    \ 的 94.17% 相比，这种交易方法的价值增加了 102.33%。由于 `Token Set` 仍处于早期阶段，写作时仅有过去三个月的性能统计。\n\n\
    十四\n\n虽然目前的去中心化支付可以通过直接发送 `ETH` 或 `DAI` 完成，但它们可能会……\n\n## SABLI\n\n虽然目前的去中心化支付可以通过直接发送\
    \ `ETH` 或 `DAI` 完成，但它们可能会……（注意：提供的文本在此似乎重复/中断，已根据输入保持了结构）。\n\n\n"
