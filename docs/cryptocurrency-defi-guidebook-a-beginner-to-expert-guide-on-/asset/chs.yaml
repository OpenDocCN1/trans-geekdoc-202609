  \ 资金时购买保险的重要性。在这一部分中，我们将介绍两个主要的去中心化保险供应商，以帮助您保护自己的 Defi 交易：`Nexus Mutual` 和 `Opyn`。\n\
  \n## NEXUS MUTUAL\n\n`Nexus Mutual` 是一个基于以太坊的去中心化保险协议，为以太坊上的任何智能合约提供保障。\n\n### Nexus\
  \ Mutual 涵盖哪些事件？\n\nNexus Mutual 目前为智能合约故障提供保障，防止智能合约编程中的潜在漏洞。该保障可能涵盖因智能合约代码的黑客攻击或漏洞利用导致的财务损失。需要注意的是，智能合约保障仅针对“非预期用途”，因此诸如私钥丢失或中心化交易所攻击等安全事件不在受保护范围内。\n\
  \n### 保障如何运作？\n\n首先，您必须选择 `Cover Period`（保障周期）和 `Cover Amount`（保障金额）。`Cover Amount`\
  \ 是您想要购买保障的金额，也是智能合约故障时将支付的金额。智能合约故障发生后，将启动 `Claims Assessment`（理赔评估）程序，由 `Claims\
  \ Assessors`（理赔评估员）评估索赔。一旦 `Cover Amount` 获得批准，将支付给您。\n\n### 保障如何定价？\n\n虽然 Nexus\
  \ Mutual 可以涵盖任何智能合约，但 `Smart Contract Cover`（智能合约保障）的成本取决于多个因素，包括：\n\n1. 需要保障的智能合约属性。例如合约价值、完成的交易次数等。\n\
  2. `Coverage Amount`（保障金额）\n3. `Coverage Period`（保障周期）\n4. 风险评估员质押在智能合约上的价值。\n\n\
  如果智能合约没有足够的质押价值或未经足够的测试，将返回不可提供的报价，表明该智能合约目前无法获得保障。\n\n假设在 `ETH` 价格为 `$200` 时为 `Compound`\
  \ 智能合约购买了 `5 ETH` 的保障。假设每 `1 ETH` 保障一年的成本为 `0.013 ETH`，那么一年的总成本将是 `0.065ETH`。如果\
  \ `Compound` 在此期间被黑，无论被黑时 `ETH` 的价格如何，您都有权收回 `5 ETH`。如果 `ETH` 在攻击期间上涨到 `$300`，只要您的索赔通过验证，您仍将获得\
  \ `5 ETH`。\n\n需要注意的是，任何人都可以为任何智能合约购买保障，并在智能合约以意外方式使用时提交索赔。您不需要证明自己曾向智能合约投入过资金并导致了损失。\n\
  \n### 如何购买保障？\n\n1. 指定您想要 `Cover`（保障）的智能合约地址。\n2. 在相应字段中输入 `Cover Amount`、`Currency`（`ETH`\
  \ 或 `DAI`）和 `Cover Period`。\n3. 使用 `Metamask` 生成报价并完成交易。\n4. 您现在完全受到保护了！\n\n## NXM\
  \ Token\n\nNexus Mutual 创建了其原生令牌 `NXM`。`NXM` 令牌用于购买保险、参与风险评估和索赔评估。它还用于促进资本供应并表示对互助资金的所有权。`NXM`\
  \ 的价值将与互助资金池同步上升。\n\n用户可以利用平台做两件事：购买资本保护或通过质押 `NXM` 成为 `Risk Assessor`（风险评估员）。\n\
  \n它采用了令牌绑定曲线，该曲线受互助可用资金以及满足特定概率的所有索赔所需资金量的影响。`NXM` 加密货币目前不在任何市场上交易，仅供 Nexus Mutual\
  \ 内部使用。\n\n### 什么是风险评估员？\n\n`Risk Assessor`（风险评估员）是指针对智能合约质押价值的人（基本上是担保智能合约是安全的），当用户对其质押的智能合约购买保障时，他们将获得\
  \ `NXM` 奖励。`Risk Assessor` 是理解与 solidity 合约相关风险的人，并可以：(1) 评估单个 `Dapps` 或 (2) 相信认为合约安全的人（如审计员或其他质押者）。\n\
  \n## OPYN\n\nOpyn 是另一个提供智能合约保险的 Defi 应用。Opyn 目前保护 `Compound` 上的 `USDC` 和 `DAI` 存款，以及另一个\
  \ Defi 应用 `Curve` 上的稳定币存款。除了智能合约故障外，Opyn 还防止各种风险，例如财务和管理风险。Opyn 通过使用金融衍生品（特别是期权）来实现。\n\
  \n### 什么是期权？\n\n期权有两种：看涨和看跌。`call option`（看涨期权）是一种权利而非义务，可以在指定的时间范围内以给定的行价购买资产。相反，`put\
  \ option`（看跌期权）是在指定期限内以特定行价出售资产的权利而非义务。\n\n每个期权买方都必须有一个期权卖方。为了确保正确，期权买方将向期权卖方支付权利金。主要类型可选：`American`（美式）和\
  \ `European`（欧式）。两者的区别在于 `American option`（美式期权）可以在过期前的任何时间行权，而 `European option`（欧式期权）只能在执行日行权。\n\
  \n### Opyn 如何运作？\n\nOpyn 通过允许用户购买 `USDC` 和 `DAI` 稳定币存款的 `Put options`（看跌期权），从而降低\
  \ `Compound` 发生黑天鹅事件的概率。\n\n如前 `Compound` 部分所述，当有人借出 `DAI` 时，他们会收到相应的 `cDAI`。交易者可以利用\
  \ `Opyn` 购买 `oTokens`，在智能合约故障时，这些令牌可以用出售 `cDAI` 并获得 `DAI` 的权利。\n\n在 `Compound` 上购买\
  \ `1 DAI` 的保障等同于购买行价为 `$0.92` 的 `cDAI` 资产的美式看跌期权。如果 `Compound` 故障，任何 `DAI` 的价值将大幅下降，例如\
  \ `$0.10`。用户可以使用 Opyn 的 `ocDAI` 令牌兑回 `$0.92` 的 `ETH`。这保护了用户免受损失。由于不需要机构验证索赔，这是真正的去中心化保险。注意：Opyn\
  \ 仅涵盖您的本金，不涵盖在 `Compound` 上赚利息。当您在 `Compound` 存款 `DAI` 时，您会收到 `cDAI`。要在 Opyn 上索赔，请将您的\
  \ `cDAI` 和 `oDAI` 保险令牌发送到 `Opyn`，您将立即获得保障金额。\n\n### 保险成本是多少？\n\n在写作期间，通过 `Opyn`\
  \ 获取 `Compound` 的保障，`DAI` 存款约为 `1.22%`，`USDC` 存款约为 `2.61%`。这意味着如果您在 `DAI` 存款上获得\
  \ `5.41%` 的无保险收益，在购买 `Opyn` 保障后，您的收益将是 `4.19%`。\n\n请记住，`Opyn` 仍处于早期阶段（仅于 2020 年\
  \ 2 月推出），且保险成本随着市场寻求适当平衡而发生变化。由于保险以 `oTokens` 的形式代币化，它们可以在 `Uniswap` 等去中心化交易所进行交易；因此保险价格由市场价格决定。\n\
  \n### 为什么有人提供 Opyn 保险？\n\n每个保险消费者都必须在 `Opyn` 上找到一个保险提供者（看跌期权的卖方）。`ETH` 持有者可以通过成为\
  \ `Opyn` 上的保险提供者从使其 `ETH` 获得回报。\n\n\n\n\n要做到这一点，首先需要提供 `ETH` 作为 `Opyn` 智能合约的抵押，最小质押比例为\
  \ 160%，以铸造 `oTokens`。在 `Compound` 上，保险提供商可以使用 `USDC` 或 `DAI` 创建 `oTokens`。\n\n在发行\
  \ `oTokens` 后，有两种兴奋的方式赚取溢价：\n\n### 1. 成为 Uniswap 流动性提供者\n作为 Uniswap 流动性提供者，你可以从通过\
  \ `Uniswap` 在 `Opyn` 平台上买卖的用户那里获得交易费。流动性提供者通过在 `Uniswap` 上提供流动性可以获得显著但不可预测的回。流动性提供者可以随时提取资金。我们的\
  \ Uniswap 章节解释了如何在 `Uniswap` 上提供流动性。\n\n### 2. 在 Uniswap 上出售 oTokens\n铸造的 `oTokens`\
  \ 可以在 `Uniswap` 上购买。要计算在 `Uniswap` 上出售 `oTokens` 的年化率（APR），请前往 `Opyn` 主仪表板，减去未保险收益与保险收益之间的差额，这就是用户为了获得保障而放弃的收益。截至本文发布，`DAI`\
  \ 的年化率为 1.22%，`USDC` 为 2.61%。\n\n在 `ETH` 抵押品上产生的溢价是 DeFi 中最高的。然而，获得这种收益并非没有危险。期权卖者通过出售\
  \ `Put` 期权来获取收益，承担了不会发生灾难的风险（例如技术风险如黑客、财务风险如 `DAI` 脱锚，或对 `Compound` 的挤兑）。为了避免清算，必须额外维持超过\
  \ 160% 的抵押率。\n\n### Opyn 是无风险的吗？\n`Opyn` 拥有经过智能合约审计公司 `OpenZeppelin` 审计的公开可验证智能合约。`Opyn`\
  \ 也是非托管且去信任的，依赖激励机制来运行。\n\n记住：由于 `oTokens` 的定价受供需影响，这可以被用作信号机制，来发现 `Compound` 是否存在问题。如果人们认为\
  \ `Compound` 将发生黑鹅事件，他们将开始购买更多 `oTokens`，导致 `oTokens` 的价格上涨。\n\n最后，是否保险的决定最终取决于你，用户。但是，强烈建议你获得保险，因为你永远不知道会发生什么，特别是在处于婴儿阶段的\
  \ DeFi 市场中。\n\n# 十\n考虑到行业的早期阶段，这些策略中的许多包含重大风险（详见下文“风险因素”章节），并需要复杂的专业知识来执行。\n\n##\
  \ 1. 流动性挖掘与收益耕作\n流动性挖掘和收益耕作让数字资产持有者通过特定协议获得的奖励来产生收益。这些过程涉及出借加密货币并将资产锁定在智能合约中，以产生加密货币投资的额外回报（传统上，这些策略建立在\
  \ `Ethereum` 上，但最近我们见证了如 `Binance Smart Chain` 等替代平台的增长）。\n\n策略实施：通常，收益耕作过程执行如下：\n\
  \n#### 第一步\n向智能合约添加资金；通常，流动性池是贷款市场或去中心化交易所的底层。流动性池是汇总了来自各种贷款人的资金的智能合约，用于促进 DeFi\
  \ 平台上的贷款、借贷和交易。例如：如果你看多 `$ETH`，可以将你的 `$ETH` 存入 `AAVE` 等去中心化协议。\n\n#### 第二步\n接收来自\
  \ DeFi 平台生成的费用的一部分（称为“奖励”）。在贷款模型中，提供流动性的贷款人将获得利率。在去中心化交易所模型中，用户可以与聚合流动性池进行交易，流动性提供者按比例获得交易费。\n\
  \n#### 第三步\n平台需要深度流动性才能正常运行和扩展。因此，许多平台目前正在通过“激励奖励”鼓励用户提供流动性。在像 `Compound` 等贷款市场中，贷款或借贷的用户还将获得\
  \ 1-5% 的 `Compounds` 原生治理代币 `COMP`。在流动性池中，流动性提供者还可以质押他们的 `LP` 代币（本质上是存款证明）并获得额外的治理代币。这些治理代币抵消了借成本，提供了额外收益，并允许更复杂的组合策略。\n\
  \n示例：一旦 `ETH` 发送到 `Compound` 平台，贷款人将获得 `COMP` 代币作为贡献流动性的奖励。以下是流动性挖掘过程的示例图。\n\n1.\
  \ 加密货币持有者将资产存入流动性池。\n2. 流动性池通过 DeFi 平台提供交易、贷款和借贷的资产。\n3. 作为这些服务的结果，加密货币持有者分享步骤 #2\
  \ 中执行服务的费用以及（在适用的情况下）额外奖励。\n\n将第二步中收到的奖励代币存入其他流动性池以获得额外收益。可以通过分析各种平台来优化收益，以提高多样性或调整风险。这种在各种\
  \ DeFi 平台之间进行金融工程以实现收益最大化的被称为收益耕作（Yield Farming）。`Yearn Finance` (`$YFI`) 的出现是为了通过金库自动化收益耕作过程的管理。\n\
  \n### 关键风险因素：在协议层，以下风险因素是特殊的。\n下方的风险因素并非详尽；然而，它们代表了 DeFi 基础设施中已经或可以被利用的关键弱点。我们预计随着这些平台的继续蓬勃发展，未来将部署更先进的技术。\n\
  \n在入场前、持有期间和退出后，必须对仓进行监控和分析，以维持 DeFi 的持续配置。\n\n### 智能合约功能风险\n简而言之，这是智能合约按照预期或向社区承诺的方式运行的能力。底层代码复杂性的增加了坏分子从错误和漏洞中获利的机会。鉴于\
  \ DeFi 交易的去中心化性质，一旦在区块链上记录，交易就无法撤销。此类合约故障风险可以通过引入第三方审计机构（如 `Consensys` 或 `CoinFabrik`，甚至\
  \ `PwC`  现在也提供智能合约审计服务）来缓解。此外，这些平台在不断演变；理解代币升级的迁移风险对于避免资产损失至关重要（例如暂停 `Ocean token`\
  \ 上的智能合约）。\n\n### 外部调用函数风险\n这是一种专注于智能合约与外部信息源（如价格预言机）交互的攻击向量。价格预言机，特别是，可以通过倾倒进行操纵，并容易受到低水平流动性的影响。\n\
  \n### “平台挤兑”风险\n平台用户依赖于足够的流动性和利率定价，以确保平台有足够的代币满足需求。例如，利用率（类似于银行的准备金要求）决定了平台（定义为已出借资产的总百分比）在变得流动性枯竭之前可以承受的流动性。\n\
  \n### 抢跑风险\n\n\n\n以太坊网络的低效率使得构建在 ETH 之上的平台容易受到抢跑攻击（frontrunning attacks），算法套利交易者可以在内存池（meme-pool）中看到你的交易，并通过发送带有更高\
  \ gas 费的 ETH 交易来抢跑，从而导致你以更高的价格购买代币。就像传统市场中违规交易者可能在知道巨额资金即将进入市场之前进行投资一样，攻击者可以作废、修改甚至操纵交易以从中获利。平台已经实施了相关政策，通过建立如先进先出（FIFO）、第三方签名者、随机挖矿和交易链等策略，来缓解抢跑带来的风险。\n\
  \n### 人为风险\n访问 DeFi 平台过于复杂，远比开通银行账户和管理密码要得多。丢失私钥、遭受钓鱼攻击或遭受 SIM 卡劫骗攻击可能导致你失去对数字资产的访问权限。存储资产需要周全流程和程序。\n\
  \n### 监管风险\n`KYC`、`AML` 和税收都是特定国家为了让 DeFi 在未来繁荣而必须克服的重要监管障碍。虽然成熟和发展中经济体都正着巨大的增长，但监管可能会对资本配置产生寒蝉效应。在美国，前货币监事布莱恩·布鲁克斯（Brian\
  \ Brooks）指出，“我们目前的银行监管主要是为了防止人为失误……”并且“在缺乏联邦监管明确的情况下，美国州纷纷填补空白，创造了不一致规则的补丁，阻碍了国家市场的有序发展。”\n\
  \n观察全球格局，监管的不一致性可能会损害行业增长，并加速主权国家与其管辖范围内运营的企业之间的冲突。监管风险的另一个关键因素是确定任何平台的去中心化程度。像\
  \ `Compound` 这样的平台仍然允许 `admin key` 持有访问分配给智能合约的数字资产。中心化程度还可能影响利率、流动性和操纵行为。\n\n###\
  \ 透明度风险\n在确定机会时，拥有超越代码的敏锐洞察力至关重要。对工程团队的质量和数量、在奖励和治理方面的战略方向，以及项目如何与用户沟通，都是需要考虑的重要因素。鉴于该行业的协作性质，查看留言板和白皮书可以让你在判断项目成功概率方面获得优势，并了解还有谁也看好这一机会。通常，越成功的项目具有更高的透明度、知名的投资者和大量的追随者。\n\
  \n### 无常损失风险\n价格波动对你借入流动性池的资产的影响。必须理解这一风险因素以及自动做市商（`\"AMM\"`）如何设定价格。虽然许多系统现在都在演进，但\
  \ `Uniswap` 的 AMM 变得越来越流行。每个池子根据两种资产的比例为资产定价。例如，一个 `ETH-Dai` 池可能包含 `10 ETH` 和 `15,000\
  \ Dai`（这意味着每单位 `ETH` 的价格为 `15,000 Dai / 10 ETH = 1,500 Dai`）。现在，让我们假设 `ETH` 的价值从\
  \ `1 ETH = 1,500 Dai` 增加到 `1 ETH = 2,000 Dai`。在这种情况下，交易者将向池中添加 `Dai` 并移除 `ETH` 以增加比例上的差额。\n\
  \n相反，如果价格下跌，交易者将添加 `ETH` 并提取 `Dai`。最终的假设是池的总美元价值随时间推保持不变。\n\n回到价格上涨的场景，每个单位 `ETH`\
  \ 的初始投资将是 `1 ETH` 和 `1,500 Dai`（代表总池的 `10.0%`，总价值为 `$3,000`）。为了达到 `1 ETH = 2,000\
  \ Dai` 的价格，投资者必须添加 `Dai` 并移除 `ETH`。在这种特定情况下，池将从 `15,000 Dai` 和 `10 ETH`（比例为 `1,500:1`）变为约\
  \ `17,193 Dai` 和 `8.6 ETH`（比例为 `2,000:1`）。\n\n到期时从池中提取资产的投资者将提取流动性池 `10.0%` 的流动性：`1,719.3\
  \ Dai` 和 `0.86 ETH`（价值 `2,000 = 1,720 Dai`）= `3,439 Dai`。\n\n如果投资者选择持有 `ETH` 而不是将其投入流动性池，其价值将是\
  \ `1 ETH = 1,500 Dai * (2,000 / 1,500) = 2,666 Dai + 1,500 Dai = 4,166 Dai`。\n\n\
  在这种情况下，投资者的无常损失为 `3,439 Dai / 4,166 Dai = 17.4%`。通常，美元等值投资越大、价格波动越剧，损失幅度就越大。\n\n\
  流动性池希望通过分享与所借入流动性池相关的交易活动费用来缓解风险。新兴协议正尝试通过新颖概念（如风险分配或更高的 `ROIs`）来应对这一挑战，每项决策都在速度、安全性和互操作性之间进行权衡。例如，`Bancor`\
  \ 现在为流动性池提供单边敞口，并提供在 90 天后生效的无常损失保护。\n\n## 2. 套利：概览与策略实施\n\n通用的套利（俗称为“‘arb’”）策略涉及利用不同市场之间的价格差异。\n\
  \n在传统市场中，外汇交易普及了套利交易，其中 3 种（或更多）货币之间可能存在价格不一致，被称为三角套利。\n\n例如，假设在以下金融服务机构中存在以下价格：\n\
  \nABC 公司：`USD / MXN: 20.14`\nEFG 公司：`USD / CAD: 1.28`\n`MXN / CAD: 0.063`\n\n如果投资者想在一笔\
  \ `1,000 MXN` 的交易中获利，他们可以：\n\n1. 以 `20.14` 的汇率将 `1,000 MXN` 转换为美元。这相当于 `1,000 MXN\
  \ / 20.14` 转换比例 = `$49.65`。\n2. 以 `1.28` 的汇率将美元转换为 `CAD`。这相当于 `$49.65 * 1.28` 转换率\
  \ = `63.65 CAD`。\n3. 最后，以 `0.063` 的汇率转换回 `MXN`。这相当于 `63.65 CAD / 0.063` 转换比例 = `1,010.32\
  \ MXN`。\n\n（注：未未引用，上述数字是为了演示交易策略而夸大的。）\n\n该策略的收益为 `1.0%`（`1,010.32 MXN / 1,000 MXN\
  \ – 1`），通过利用这三家机构之间的价格碎片化来实现。\n\n几十年来，外汇交易流动性的提高通过增加竞争、降低价差和交易者多样化，最大限度地减少了套利机会。现在利用这些差异需要先进的交易技术、杠杆和工程水平。\n\
  \nDeFi 平台为投资者提供了多个存在严重碎片化的场所供其利用。DeFi 套利策略分为两类：收益套利和跨交易所套利。\n\n### 交易所套利\n鉴于 DeFi\
  \ 行业处于早期，增加的碎片化为套利交易者提供了一个充满短期交易机会的低效市场。高度复杂的交易机器人不断扫描执行高概率交易三角套利策略的机会。如今投资者在以太坊上使用两种主要的策略：(i)\
  \ 交易的原子批量处理，对交易所之间的定价实施严格的限价订单控制，这意味着如果不成交，否则交易不会执行；(ii) 优先 gas 费拍卖，投资者尝试通过不断修改给矿工的\
  \ gas 费来执行特定交易，直到达到盈利点。\n\n\n\n鉴于交易所需基础设施的复杂性，在该领域进行竞争极其困难；交易机器的创建和延迟技术的改进已最大限度地减少了普通交易者获得优势的可能。此外，基于\
  \ Gas 的套利导致了以太坊网络的拥堵，并显著增加了成本。\n\n## 收益套利 (YIELD ARBITRAGE)\n\n收益套利策略侧重于从不同借贷产品之间的价格差异中受益。如今，所有借贷产品都需要基于抵押的贷款结构，因为无担保信贷扩展实际上是不存在的。假设\
  \ `Supply APR`（即投资者向池提供的贷款年化收益）大于 `Borrow APR`（即投资者提取的超抵押贷款）。在这种情况下，交易者可以利用其资产进行贷款并捕获利差。\n\
  \n投资者需要确保锁定期保持一致，以避免资产与负债之间出现流动性错配。传统上，借贷利率之间的差额在 -5% 到约 +10% 之间。理解利率计算至关重要，因为浮动利率产品可能会损害收益。\n\
  \n这种策略可以在同一平台上执行、跨 Defi 平台执行，甚至可以跨中心化金融 (CeFi) 平台执行。此外，投资者可以在两种不同的代币之间承担质押风险；例如，将\
  \ `XTZ` 代币换为 `DOT` 代币以尝试捕获 APY 差。\n\n## 套利：关键风险因素\n\n### 流动性风险\n尽管市场在过去几年中大幅增长，但与股票和债券等传统市场相比仍然相形见绱。供需平衡可能会持续并破坏任何交易策略。\n\
  \n### 锁定期风险\n在合并不同的平台或协议时，理解你所交互的每种智能合约的锁定期非常重要。例如，质押资产将要求持有特定期限以获得奖励。\n\n### 基差风险\
  \ (Basis Risk)\n在不同资产之间进行兑换涉及底层代币的 Beta 风险。如果你交换了 `DASH` 和相同金额的 `XTZ` 来进行 APY 交易，如果一种资产的增值超过另一种资产，你可能会面临无法收回本金的风险。\n\
  \n例如，假设投资者交换了 100 美元的 `DASH`，通过 100 美元的 `XTZ` 获得 7% 的收益以捕获 2% 的收益差。如果 `DASH` 相对于\
  \ `XTZ` 上升，投资者最终可能会亏损执行交易。\n\n假设在合同到期时，相同数量的 `DASH` 单位价值 120 美元（从 100 美元上涨），而 `XTZ`\
  \ 价值 90 美元（从 100 美元下降）。投资者必须弥补初始两种资产之间 30 美元的差距。\n\n此外，由于 `XTZ` 质押是基于代币的，质押奖励的价值将不如收到的\
  \ `DASH` 单位价值（均以美元计）。只有当 `XTZ` 的价值相对于 `DASH` 增长，或者在借贷期间价值保持相同时，投资者才能受益。\n\n对两种资产方向有特定头寸的投资者可以对两种资产之间的差异进行投机，并从净利差中受益。作为一个一般原则，请确保你了解你的计价货币与资产计价货币的区别。\n\
  \n## 3. 保险 (INSURANCE)\n\nDefi 平台的出现源于打破金融服务中介的渴望。因此，交易方风险的消除/减少导致“软件风险”的大幅增加。鉴于市场尚处于早期阶段且缺乏审计历史，行业未来的增长存在许多盲点。去中心化保险作为一种的解决方案应运而生；然而，流动深度和赔付逻辑的清晰度仍不确定。\n\
  \n例如，Nexus Mutual 创建了一个针对智能合约故障的的市场。个人可以购买 `NXM` 代币为平台提供流动性，或针对其 Defi 风险敞口购买保险。平台能提供的保险金额等于锁定在智能合约中的总流动价值价值目前大部分以\
  \ `ETH` 计价）。据此，算法决定可以出售的最优定价和覆盖范围。这些保单可以根据供需平衡、理赔频率、平台类型等进行定价。\n\n本质上，Nexus Mutual\
  \ 正在为专注于 Defi 的保险产品创建一个市场，这将使下一代能够以去中心化的方式更好地为风险定价。截至 2021 年 2 月 8 日，Nexus Mutual\
  \ 平台上的覆盖额为 7.387 亿美元，总保费等于 1320 万美元。谜题中最有趣的部分与理赔评估和还款有关。\n\nNexus Mutual 创建了一种“众包”模型，试图通过代币激励来引导良好行为。另一个关键风险因素与理赔/风险评估及赔付机制相关的预言机稳定性有关。\n\
  \n## Seventeen (第十七章)\n\n本章概述了 Defi 可能与政策和监管交互的主要领域。重要的是，它列出了关键问题和选项，但没有提供规范性的解决方案，因为不同司法管辖的目标、监管机制和市场组成各不相同。这里描述的方法旨在具有通用性，适用于各种背景。本节的剩余部分提供了工具和资源。\n\
  \n信任最小化执行、非托管服务和可组合架构可能会挑战现有的监管。Defi 既可以引入新风险，也可以帮助缓解金融服务中的已知风险。决策者面临的许多关键挑战——去中心化如何使识别主体变得困难、自动化带来的新风险，以及无国软件代码如何增加地区规则的应用——都是所有数字资产问题的延伸。其他，例如创建具有多个潜在用途和集成的构建模块，或代币化治理的激励结构，较不熟悉。考虑到\
  \ Defi 的跨领域性质，需要整合的战略和愿景。\n\n通常情况下，考虑技术中立的方法可能是明智的，以平衡监管目标与促进创新和市场发展之间的关系。与任何监管倡议一样，政策制定者应争取制定公平、高效、有效且可执行的\
  \ Defi 规则。\n\n## Defi 与金融监管\n\n第一阶段是确定适当的目标以及相关的政策和监管类别。金融监管共同目标包括保护投资者和其他消费者；市场效率和诚信；资本形成；金融包容；防止非法活动；安全和稳健；金融稳定。每个目标都为某些类型的规则提供了独特的逻辑。例如，关注投资者保护的监管机构通常担心托管人卷走资金。Defi\
  \ 的非托管性质可能会缓解这些担忧，同时产生新的担忧。\n\nDefi 活动跨越了金融监管的许多领域，包括证券、衍生品、交易所、投资管理、银行监管、金融犯罪、消费金融、保险、风险管理和宏观审慎监管。一个贯的整体战略至关重要，可以委托给跨实体工作组或类似机构。某些\
  \ Defi 活动模式将匹配既有的法律分类；某些则不会。\n\n现有法规、调整后的法规以及新的、定制的法规可能被用于对 Defi 的有效监管应对。欧盟全面的《加密资产市场》(MiCA)\
  \ 提议是不断发展的数字资产特定法律的一部分。然而，大多数司法管辖区尚未采用定制框架。\n\n\n\n\n大多数金融监管体制侧重于那些在某些受监管活动中“开展业务”、“交易”、“安排”或“运营”某些计划、交易所，或“发行”报价（或类似行为）的实体。\n\
  \n从历史上看，相关的政府实体相对清晰，并侧重于最终控制运营的实体。同样，服务提供商通常拥有豁免条款，这些豁免仅提供基础设施、数据或其他工具，以便其他在其在其叠加金融服务。监管框架考虑了可定义且集中的运营者，他们参与提供特定的金融终端产品和服务，但并不必然是底层的构建者。\n\
  \n然而，在 `Defi` 的背景下，可能不存在执行相关活动的中心实体。软件开发者和代币持有者可能很容易识别，但从事传统监管触点职位的个人却な无法识别。即使能够识别出运营者，由于协议的去中心化本质，他们可能缺乏修改\
  \ `Defi` 服务或停止交易的能力。`Smart contracts` 可能会与其它 `smart contracts` 拥有的资产交互，而这些智能合约并未与特定用户关联。监管机构必须确定谁应该负责，以及何时必须建立责任中心。即使服务表面上是去中心化的，通过仔细的分析也是可行的。\n\
  \n法律体制通常包含间接次级“控制人”、“责任官员”或协助与煽唆责任的机制，这些责任基于对有害后果的知情或预见等要求。假设 `Defi` 服务的开发者或其他与\
  \ `Defi` 业务相关的人员本可以识别并缓解法律合规风险。在这种情况下，政策制定者将需要考虑强制他们这样做是否恰当。另一方面，监管软件的创建引发了关于言论自由和可管理性的重要担忧，这些应当被审慎考虑。由于区块链网络和数字资产的跨国性质，国家级或次国家层级的\
  \ `Defi` 监管变得更加复杂。\n\n政策制定者有许多方法来处理新的金融服务或产品。以下我们首先识别了监管机构为应对数字资产和代币发行的兴起而所采取的一些有用步骤。\n\
  \n### 可用政策工具 (AVAILABLE POLICY TOOLS)\n\n#### 1. 过渡机制\n\n虽然并非完全等同，但最初处理数字资产的方式可能会影响政策方法。在\
  \ 2017 年首次代币发行 (`ICOs`) 热潮期间，很少有机构缺乏适合该目标的机构或专业知识，因为大量资金流入了声称处于监管范围之外的新平台。在 `Defi`\
  \ 的语境下，最初的一些答案可能有所帮助。\n\n**专业监管部门 (Specialized regulatory units)：**\n\n一个拥有合格人员的针对性小组可以作为获取新技术经验、与行业互动以及提供指导的初始门户。这些知识可以与政策制定者共享，行动可能包括在现有监管体制下发布“不采取行动函”（no-action\
  \ letters）。这些小组可以为 `Defi` 项目提供法律清晰度，并鼓励与监管机构进行早期讨论。监管机构还应该投资技术和技术专业知识，以更有效地理解这些市场。许多管辖区都使用了这种方法。例如，美国\
  \ `Securities and Exchange Commission` (`SEC`) 创建了其 `FinHub` 部门（于 2020 年底升级为正式的独立办公室），而瑞士的金融监管机构\
  \ `FINMA` 创建了 `FinTech Desk`。尽管最初规模较小且权限有限，但它们迅速成为内部和外部社区的重要联系点。\n\n**激励信息流 (Incentivizing\
  \ information flow)：**\n\n披露是金融监管最常用的工具之一。即使现有披露要求在 `Defi` 平台上的适用性尚不确定，鼓励广泛且一致的信息披露的努力可能对监管分析产生成效。\n\
  \n`Monetary Authority of Singapore`（新加坡金融管理局）将其对 `ICOs` 的监管重点放在了对白皮书的审查上。\n\n**监管沙盒\
  \ (Regulatory sandboxes)：**\n\n政策制定者可能会建立监管宽限计划（如沙盒），公司可以在有限范围内测试和运行其技术，因此具有有限的监管风险。此类监管“豁免”（carve-outs）的范围可以通过活动、财务阈值、领土或客户限制来定义，并结合报告义务，以确保监管机构在新技术方面获得经验、与行业互动并在发生问题时做出反应。然而，监管机构对轨迹缺乏透明度可能会抑制创新，且在没有明确安全风港的情况下，企业可能面临业务风险。沙盒允许初创企业解决合规问题，同时让监管机构对进入新市场的风险和优势有更好的了解。\n\
  \n`Defi` 沙盒可能会通过建立随时间推移的控制机制来超越先前的的模式。英国 `Financial Conduct Authority` (`FCA`) 为金融科技建立了一个沙盒机制，涵盖大量的区块链和数字资产服务。然而，这对\
  \ `Defi` 的适用性有限，因为稳定币被认为在 `FCA` 的范围之外。其他地区，如哥伦比亚的“Arenera”沙盒也遵循了这种方法。`Defi` 沙盒需要仔细设计，以避免过早发出批准信号。\n\
  \n这种方法的变体是在韩国釜实施的监管区。在这种模式下，国家内的特定管辖区可以在有限的监管（通常不是完全免监管）下运行，允许创新和服务测试。\n\n**澄清简单案例\
  \ (Clarifying easy cases)：**\n\n会有某些新活动引发监管红旗，某些不会，另一些则处于灰色地带。有时，政策制定者和监管机构可以通过先处理较简单的案例（特别是那些不需要干预的案例）来缩小不确定区域并激励合规活动。区分简单案例的更正式方法是安全港政策，明确将符合标准的服务排除在监管之外。在\
  \ `ICO` 案例中，美国 `SEC` 的第一个声明是 2017 年关于 `DAO` 的调查报告。它澄清了 `bitcoin` 不被视为证券，而是为了投资目的而创建的代币。此外，由于\
  \ `DAO` 已经关闭，因此没有采取执法行动。尽管报告留下了许多未解决的问题，但它明确了 `SEC` 的方法和担忧，促进了进一步对话。\n\n**协调政府行动\
  \ (Coordinating government action)：**\n\n在某些情况下，汇集各个政府部门进行协调一致的是有益的。美国五个联邦监管机构（联邦储备理事会、联邦存款保险公司\
  \ `FDIC`、货币法体系监员办公室 `OCC`、商品期货交易委员会 `CFTC` 和 `SEC`）对“沃尔克法规则”的修订就是一个例子。这并不意味着这是一份完整的列表，也没有预设政策制定者最终将采取的方向。如果\
  \ `Defi` 服务最终被发现受现有要求的约束、处于监管范围之外，或受新的定制规则约束，这些技术也同样适用。\n\n\n\n\n监管通常发生在产品或服务生命周期的后期，此时在不存在内在独特风险的情况下，触发责任或监管行动的损害更有可能发生。\n\
  \n鉴于新兴技术规模较小且具有创造性，监管机构更倾向于在早期采取“无害”的方法。对于具有明确已知危害或误用风险的（如罂粟花和武器），其业务受到高度监管，且所有阶段都受到严密监控和控制。大多数技术系统则处于于两者之间的中间地带。\n\
  \n除了日益成熟，Defi（去中心化金融）服务还有潜力在整个生命周期内变得更加去中心化。去中心化程度也是政策制定者和监管机构的重要考虑因素。应对 Defi 服务潜在危险的规则可以在生命周期的四个阶段被采用：(1)\
  \ 开发；(2) 发布；(3) 部署；以及 (4) 。\n\n通常会有一个可识别的协议开发者群体（尽管他们可能在开源开发社区、非营利基金会、协会或 `DAO`\
  \ 的伞下运行）。一旦协议发布，多个团队可能会将其开发为服务并向用户推广，这代表了一个组合部署阶段。不同的团队以后可能会对这些服务进行分叉（fork）。协议和智能合约将很大程度上实现服务的自动化，可能由去中心化治理过程进行调节。\n\
  \n在生命周期的早期施加监管要求可能更简单，因为此时接入点更加明显，并且有更大的机会影响长期轨迹。然而，生命周期越早，与实际可证明的损害之间的联系就越弱，对创新的潜在影响也越大——因此，确定监管介入在何时点与风险成比例至关重要。例如，沙盒、安全港和不采取行动函等可能是解决这一问题的有用工具，而不是在早期阶段强制采取行动。\n\
  \n**请记住**：此工具包旨在为政策制定者提供一个起点，帮助他们理解 Defi 业务和服务带来的风险与机遇，并制定最佳政策应对措施。\n\nDefi 的具体表现及其政策问题会随着时间而变化，活动水平以及更广泛区块链和数字资产世界的其他方面也是如此。政策制定者和监管机构将根据其司法管辖区的独特语境采取不同的方法。金融监管义务的重大转变，或跨国标准的实施，可能会改变考虑\
  \ Defi 问题的背景。2009 年之前不存在去中心化数字货币资产，2015 年之前也不存在通用型智能合约平台，因此任何关于对 Defi 这种分支进行适当处理的建议，必须考虑这个快速发展领域中潜在且不可预测的发展。\n\
  \n显而易见的是，Defi 是一个独特且可能重要的发展，无论是在区块链领域还是整个金融服务领域都是如此。正如本报告记录的，Defi 提供了许多机遇和诸多挑战。即使在没有明确答案的情况下，政策制定者通过考虑要问正确的问题、理解与其监管制度之间的互动和紧张关系，并估计不同行动方案的成本和收益，将获得最大的收益。\n\
  \n## 十八\n\n在继续之前，让我们简要看一眼 Defi 让我们能够做的一些事情：\n\n*   **透明性**：一个透明且可审计的金融环境。\n*   **访问性**：无限制地访问\
  \ Defi 应用，无需担心基于种族、性别、信仰、国籍或地理位置的歧视。\n*   **高效**：编程货币允许消除中心化中间人，从而产生更具效益且更高效的金融市场。\n\
  *   **便利**：通过低廉的价格和很少的等待时间，资金现在可以随时随地发送给任何拥有加密货币钱包的人。\n\n上述所有内容已让用户能够完成以下操作：提供流动性以获得无产出资产的收益且没有成熟/锁定期，获得贷款（带抵押品）而无需纸质文件并随地还款，以及快速执行自动化交易方法。最棒的部分是，只要有互联网连接，任何人、任何地方、任何时间都可以访问以上所有内容。这就是\
  \ Defi 在访问性方面的力量，而我们才刚刚处于冒险的开始。\n\n根据区块链平台 Dune Analytics 的统计，Defi 用户数从 2020 年 1\
  \ 月的 93,000 人增加到 2021 年 4 月的 180 万人。在此期间，市场估值从 7 亿美元飙升至 580 亿美元。尽管在股市崩盘和流行病期间脱颖而出，去中心化金融仍成为行业的下一个大趋势。Defi\
  \ 跨越了它的利基地位，完全消除了担心成为另一个 `ICO` 类现象的担忧。此外，其强劲的表现足以令加密货币中心化交易所感到恐惧，这些交易所已向 `DEXs`\
  \ 流失了大部分流动性。\n\nDeFi 的颠覆性潜力不可否认的。一个全新的去中心化未来正降临我们，这在区块链领域并不意外。然而，在实现广泛采用之前，还有其他必须解决的。\n\
  \n智能合约继续容易受到攻击，匿名开发者继续像秃鹫一样通过发起“拉地毯”（rug pull）行动，而法律的威胁继续悬在我们头顶。目前，Defi 是加密货币的原始西部，创造者和用户都必须达到特定的成熟度，这个专门的生态系统才能在这个十年中确立自己作为一个突出且严肃的领域。\n\
  \n需要几年时间才能达到完美且平衡的状态，时机将完全取决于社区及其行为。在这些不可预测且混乱的时期，显而易见的是颠覆性技术比任何时候都可能进入现实世界，这是我们做出重大变革的机会。道路可能漫长而艰难，但有一点是肯定的：金融的未来是去中心化的。\n\
  \n个人用户不想跨多个平台进行交易。用户主要聚集在入口（例如交易所）和钱包（例如 `balance.io`）。由于这些倡议是开源且去中心化的，它们将能够相互对接，在同一平台内实现交易、现有资产存储、保险和其他功能。我们正在看到一些早期变体，例如\
  \ `Trust Wallet` 与 `Dapps` 交互。`Morpher.io` 和 `Abra` 等平台开始将股票等传统工具与代币相结合，这将允许世界偏远地区的人获得此前无法获得的外国资产，发挥重要作用。De-Fi\
  \ 平台可能会随着时间的推移减少监管为了保持经济封闭而制造的复杂性，允许没有适当工具（例如专业银行）的普通投资者能够获得商品、奇特资产、衍生品、外汇甚至股票。\n\
  \n\n\n整个 DeFi 生态系统的估值预计约为 10 亿美元。如今，这大部分价值是通过 `MakerDAO`提供的。如果我们以代币市值作为指标，根据 1730\
  \ 亿美元的总市值计算，其价值不足了整个生态系统的 1%。然而，去中心化银行是少数代币化产品被经常使用的领域之一。它可以恢复效用代币的“效用”。去中心化金融有潜力实现那些在\
  \ 2013 年被认为可行、但由于扩展性问题和波动性难以开发的应用程序。可靠的代币、支付系统和贷款平台的出现可能会为全球企业创造机会，并在增强透明性的同时让我们的金融市场更加紧密。尽管这些系统中存在重大的系统性风险（例如，用\
  \ `eth` 锁定 `Dai` 并用于购买 `Eth`），但它们为银行提供了替代方案，而银行在 2008 年的 `CDOs` 可能让整整代人陷入危险。现在要宣布其中任何一个为明确的胜利者还远远太早了。然而，认为\
  \ DeFi 不会为生态系统增加价值可能也为过早。\n\n400 年前，当创业者为了追求新机会而远赴他乡时，他们发行股票作为个人分担新公司风险回报的方法。这让财富创造工具的获取变得民主化了。当中本聪在十年前发布\
  \ `Bitcoin` 代码时，他开发了一个确保个人资金仍然属于他们自己的金融系统。\n\n去中心化金融是这一理念的自然演进。它潜力让我们的市场比以往任何时候都联系得更紧密，消除不必要的中间人，提供显著的成本效益，并为以前未服务不足的人群开放渠道。\n\
  \n它像互联网一样，最初将为少数特权阶层服务，但其收益将传递给整代未服务不足的消费者，他们以前可能从未获得过贷款或进行国际支付的能力。如果零工经济和全球化等宏观趋势持续下去，就必须建立必要的金融基础设施。\n\
  \n我们通过去中心化货币获得了实现这一目标的首次真正机会。当中本聪发布 `Bitcoin` 白皮书时，银行正处于又一次救助的边缘。去中心化金融扩展了他的理念，即让个人对其辛苦赚来的资金的存储和投资拥有尊严、主权和透明度。这并不是精英阶层反对银行的立场，而是面向消费者的选择。\n\
  \n通过构建它，人们并不是在削弱政府或银行的权力，而是让普通人在一个几千年来从未存在选择的生态系统中拥有了选择。\n\n## DeFi 用户体验\n\n虽然访问\
  \ DeFi 应用可能不是问题，但整个用户体验仍然是 DeFi 的关键痛点之一。尽管如此，全球的许多团队正在努力改进体验。查看其中的一些团队以及他们试图解决的问题：\n\
  \n- **钱包**：`Argent` 正在开发一种大大改进的以用户为中心的加密货币钱包体验，包括无需 `ETH` 的免费 `Ethereum` 交易、与 `Compound`（以及其他）的原生集成，以及消除种子密钥。\n\
  - **产品参与**：`DeFiZap` 抽象了 DeFi 产品所需的许多复杂性和阶段，允许客户在单次交易中访问各种金融产品，节省时间和精力。\n- **Gelato\
  \ Finance** 宣布了他们的“如果……那么……”加密货币开发工作。它本质上允许用户定义在满足特定标准时将执行的操作，例如“当 `ETH` 价格为 100\
  \ 美元时购买 `ETH`”。\n- **保险**：`Nexus Mutual` 提供去中心化保险解决方案。\n- **流动性聚合**：有许多去中心化交易所（`DEXes`）如\
  \ `1inch`、`Paraswap`，帮助用户找到最佳价格。\n- **收益优化**：`DeFi` 和 `iEarn` 等平台允许用户最大化他们的收益。\n"
