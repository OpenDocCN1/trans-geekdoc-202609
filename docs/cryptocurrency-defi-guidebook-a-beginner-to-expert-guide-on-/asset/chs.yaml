- "# 加密货币DeFi指南：从初学者到专家的去中心化金融指南：比特币与以太坊之后的DeFi与区块链、借贷、贷款、交易、储蓄与投资：点对借贷与挖矿\n\n\n去中心化金融（DeFi）是目前区块链和加密货币领域增长最快的部门之一。Defi\
  \ 在过去一年增长迅速，但帮助人们理解这一概念的材料却滞后。Defi 是一个去中心化应用（Dapps）网络，通过分散的网络提供金融服务，无需中央机构。由于目前开发的大多数\
  \ Defi Dapps 都运行在 `Ethereum` 区块链上，本书的重点将放在 Defi。\n\n2019 年和 2020 年，Defi 是 `Ethereum`\
  \ 开发的主要主题。在本书书中，Defi Dapps 已经积累了超过 10 亿美元的加密货币。预计 Defi 将未来几年进一步扩大，它是实现 `Ethereum`\
  \ 宏伟愿景和雄心的关键。\n\nDefi 以前所未有的速度增长。事实上，新概念和创新的出现速度非常剧烈，以至于老手和新手都无法跟上并理解其日益增长的重要性。与任何其他学科一样，除非我们采用正确的结构化、直观且循进的数据方法来处理，否则极有可能出现信息过载。\n\
  \n本书专为熟悉基础区块链和加密货币概念，但尚未敢于涉足去中心化金融世界的初学者编写。本书仔细解释了 Defi 的每一个方面，同时强调了它的用例、特征和平台。\n\
  \n本书的大部分内容围绕理解特定的热门用例，通过实践知识来理解去中心化金融。通过涵盖去中心化交易所、收益农场、贷款、衍生品、稳定币、保险和其他主题，你将能够像经验用户一样了解\
  \ Defi 的工作原理。\n\n# 第一章\n\n为了让初接触 Defi 的人受益，我们将首先回顾传统金融机构运作的基本原理。为了简单起见，我们将集中讨论传统金融系统中杠杆最高的机构——银行，并讨论它们的关键领域以识别潜在风险。\n\
  \n## 银行\n\n银行是金融领域的巨头，负责处理支付、收集存款并向个人、公司、其他金融机构甚至政府提供信贷。它们规模如此巨大，以全球十大银行的市值总超过了\
  \ 2 万亿美元。另一方面，2019 年 12 月 31 日，整个加密货币市场的总市值估计约为 2000 亿美元。\n\n银行是金融行业运行机制中的重要组成部分，通过价值转移服务（存款、取款、转账）让资金跨越全球，提供信贷额度（贷款）等。另一方面，银行由人类管理，并受政策治理，这些政策容易受到管理不当和腐败等人为相关风险的影响。\n\
  \n2008 年全球金融危机体现了银行的过度冒险行为，政府被迫投入巨额资金救助银行。危机暴露了传统金融体系的缺陷，并凸显了其改进的必要性。\n\nDefi 旨在通过互联网和区块链技术创造一个更好的金融格局，重点关注银行系统的三个关键领域：\n\
  \n1. 支付与清算系统（汇款）\n2. 可访问性\n3. 中心化与透明度\n\n## 1. 支付与清算系统\n\n如果你曾尝试向另一个国家的个人或企业汇款，你就知道这有多不方便——涉及全球银行的汇款通常需要几个工作日才能完成，并产生多项费用。文件问题、反洗钱合规性、隐私担忧和其他因素可能让情况变得更糟。\n\
  \n例如，假设你住在美国，想从你在美国的银行账户向澳大利亚朋友的银行账户发送 1000 美元。在这种情况下，你通常会产生三种费用：银行的汇率差、国际汇出出费和国际汇入入费。此外，取决于接收方银行的位置，接收者将在几个工作日后收到资金。\n\
  \n驱动 DeFi 运动的加密货币允许你避开在这些转账中获取大部分利润的中介。它还可能更快——你的转账将在不经任何询问的情况下处理，且费用比银行更低。例如，将加密货币转移到世界上任何账户可能需要\
  \ 15 秒到 5 分钟不等（取决于多个因素），再加上一小笔费用（例如，在 `Ethereum` 上为 0.02 美元）。\n\n## 2. 可访问性\n\n\
  很有可能，如果你正在阅读这本书，说明你已经拥有银行账户，并可以使用银行提供的金融服务，如开设储蓄账户、贷款、投资等。然而，有更多的人没有那么幸运，甚至无法获得最基础的储蓄账户。\n\
  \n根据世界银行的数据，截至 2017 年，有 17 亿个人无法获得金融服务，其中超过一半的人居住在发展中国家。他们大多来自低收入家庭，没有银行账户的主要原因是贫困、地理因素和缺乏信任。\n\
  \n对于这 17 亿没有银行账户的人来说，获取银行服务很困难，但 DeFi 有潜力让其变得更容易。与冗长的验证过程相比，访问 DeFi Dapps 只需要手机和互联网连接。根据世界银行的数据，17\
  \ 亿没有银行账户的人中有二之三可以使用手机，而 DeFi Dapps 而非传统银行，可以成为他们获取金融产品的网关。\n\nDeFi 是一场倡导为所有人提供无边界、无审查且易于获取的金融产品的运动。DeFi\
  \ 协议是非歧视的，并为所有人创造了平等的竞争环境。\n\n## 3. 中心化与透明度\n\n传统的、受监管的金融机构（如遵守政府规则的银行）无疑是存放资金最安全的地方。然而然而它们并非没有缺陷，即使是大型银行也会倒闭。2008\
  \ 年，拥有 188 亿美元存款的华盛顿银行和拥有 6390 亿美元资产的雷曼兄弟银行都倒闭了。仅美国一个国家就报告了 500 多家银行倒闭。\n\n银行是金融体系的中心化故障点之一；雷曼兄弟的倒闭引发了\
  \ 2008 年金融危机的开始。鉴于近期的案例，权力和资金集中在银行手中是有风险的。\n\n透明度也与此相关；普通投资者无法完全理解金融机构的运作。信用评级机构给高风险抵押贷款证券授予\
  \ `AAA` 评级（最高级和最安全的投资）是诱发 2008 年金融危机的因素之一。\n\n有了 DeFi，情况将有所不同。构建在 `Ethereum` 等公共区块链上的\
  \ DeFi 协议大多是开源的，以便审计和透明化。它们通常拥有去中心化治理组织，以确保每个人了解发生的情况，并防止坏者独立做出错误决定。\n\n\n\n现有的银行系统深受摩擦、准入受限以及监管不确定性等关键问题的困扰。遗憾的是，当今金融体系中的并非所有人都能获得银行服务，这使得没有银行账户的人无法平等竞争。\n\
  \nDefi（去中心化金融）运动旨在消除这些差距，让每个人都能不受审查地获得金融服务。简而言之，Defi 通过允许用户无论种族、宗教、年龄、国或地理访问各种金融工具，开启了一个充满可能的世界。\n\
  \n在比较传统金融和去中心化金融产品时，双方都有优缺点。在书中我们将带你了解去中心化金融的理念和潜力，以便你利用它们来解决现实世界的问题。\n\n## 去中心化金融\
  \ (Defi)\n\n去中心化金融（`Defi`）是一种流行的基于区块链的金融基础设施。通常，这个词指的是一个开放、无许可且高度可操作的协议栈，它基于 `Ethereum`\
  \ 区块链等公共智能合约平台。它是目前金融服务的更开放、更透明的版本。Defi 特别地依赖于中间人或中心化组织。相反，它使用开放协议和去中心化应用程序（`DApps`）。通过代码强制执行协议，执行安全且可验证的交易，并将批准的状态更改记录在公共区块链上。\n\
  \n因此，这种架构能够生成一个不可篡改且高度可的金融系统，具有无与伦比的清晰度、平等的访问权，并且对托管人、中央清算所或托管服务的的需求最小，因为“智能合约”可以处理大部分此类功能。例如，人们可以在去中心化交易所上购买与美元挂钩的资产（所谓的稳定币）。\n\
  \n所有 Defi 协议和应用程序都构建在智能合约之上。智能合约是存储在区块链上并由大量验证者并发运行的小型应用程序。网络构建在公共区块链背景下，每个参与者都能参与并验证每个操作的准确执行。因此，与传统的中心化计算相比，智能合约的效率相对较低。智能合约提供了高度的安全性，因为它们始终按照说明运行，允许任何人独立地验证产生的状态更改。当执行得当时，智能合约具有高度透明性，并限制了操纵和任意干预的可能性。\n\
  \n为了理解智能合约的独特性，我们必须首先研究基于服务器的标准 Web 应用程序。当人们与此类程序交互时，他们看不到程序的底层逻辑。此外，用户对执行环境没有影响力。这两者之一（或两者）都可能被篡改。因此，用户必须信任应用程序服务提供商。智能合约解决了这两个困难，它们确保应用程序按计划运行。合约代码保留在底层区块链上，使其可以公开访问。合约的行为是确定性的，成千上万的网络成员并行处理函数调用（以交易的形式存在），确保了执行的合法性。当执行导致状态更改（例如账户余额的更改）时，区块链网络的共识规则将生效，更改被记录在区块链的状态树中并受其保护。\n\
  \n由于智能合约可以访问广泛的指令集，因此它们具有高度的可定制性。它们还可以作为加密资产的托管人，并对如何转移、何时转移以及转移给谁具有完全可定制的标准。\n\n\
  这为大量新应用和生态系统的出现铺平了道路。萨博（Szabo）首次创造了“智能合约”这一术语。萨博接着说，许多协议可能“隐藏在我们交互的硬件和软件中，这种方式使得违约对违约者来说变得代价高昂”，并以自动售货机为例。Buterin\
  \ 提出了一个基于区块链的去中心化智能合约平台，以解决执行环境方面的信任问题并实现安全执行（可组合性）。Wood 形式化了这一概念并以 `Ethereum` 的名称实现了它。尽管有各种竞争者，但\
  \ `Ethereum` 在市场价值、可行应用和开发活动方面仍是最突出的智能合约平台。\n\nDefi 仍然是一个规模较小的利基行业，但这种情况正在迅速变化。投资在\
  \ Defi 相关智能合约上的总资金已超过 100 亿美元。至关的一点是，这些并不是交易量或市值的指标；价值”一词指的是存储在智能合约中的储备，这些储备可以像书中描述的那样用于用途。\n\
  \n### DEFI 如何工作？\n\n从技术角度来看，Defi 是一组主要运行在 `Ethereum` 智能合约生态系统的去中心化应用程序（`dApps`），它们提供无需中间人的区块链金融服务。因此，理解\
  \ Defi 如何工作需要涉及三个重要主题的知识：区块链技术、`Ethereum` 和智能合约。\n\n### 区块链\n\n区块链技术不仅是 Defi 的基础，也是所有与加密货币相关事物的基础。简而言之，区块链是数字账本，通过公开共享的区块永久记录不可篡的数据。比特币作为第一个区块链网络，于\
  \ 2009 年推出，由于其安全性和稀缺性，这是一个改变游戏规则。\n\n### 安全性\n\n像 `Bitcoin` 这样的区块链网络利用工作量证明（`PoW`）共识机制来执行交易。`PoW`\
  \ 意味着被称为矿工的用户需要投入能量和硬件动力来解决困难的数学问题，以换取确认区块获得的激励。区块是想要发送资金的普通用户提交的签名交易的集合。每笔交易都有一个哈希值，用以验证其在账本中的时间顺序。因此，每个区块的哈希值都与前一个区块的哈希值相连，形成了顺序区块链。\n\
  \n攻击比特币几乎是不可能的，因为整个账本（区块链的交易历史）以副本的形式分布在数千个节点中。要创建一个新的共识并同意另一个版本的区块链，恶意人员需要控制网络\
  \ 50% 以上的节点。\n\n### 稀缺性\n\n比特币是有限的，因为可用代币数量是有限的。与法定货币不同，在区块链上无限制造和发行新币是不可能的，因为这种限制被构建在加密货币之中。比特币总量只会存在\
  \ 2100 万个，随着越来越多的矿工将代币投入市场，流通量将稳定增长。\n\n稀缺性使得比特币能够作为价值存储型资产，这意味着它在需要时可以作为避风港或对冲工具，这就是为什么投资者将比特币称为“数字黄金”。\n\
  \n## 以太坊与智能合约\n\n`Ethereum` 是另一种加密货币，通过使用智能合约增加了区块链技术的实用性。这些智能合约使用 `Solidity` 编程语言编写，用于构建具有支付之外的其他链上功能的丰富\
  \ dApp 生态系统。\n\n\n\n\n如前所述，智能合约是自动执行的计算机程序，它们能够根据预设情况自主运行并激活。尽管与中心化数据系统相比，智能合约的执行速度较慢，但它们仍提供了去中心化、安全性和透明性等显著优势。\n\
  \n任何人都可以查看并分析智能合约的代码，以判断其是否具有恶意，这与银行业形成了鲜明对比。此外，智能合约不会偏袒任何一方，只执行指令操作，确保了 `Ethereum`\
  \ 交易永远不会发生意想不到的转向。\n\n智能合约是第三方中介者，负责处理至少两人之间达成的交易和协议。它们通过允许用户使用智能合约而非依赖对方的信誉，从而在原本缺乏信任的系统中消除了对对方信任的需求。它们还让用户能够避开交易所和银行等中心化中间人，而这些机构通常会协助他们进行链上交易。\n\
  \n总而言之，`Ethereum` 可以被看作是支持智能合约的比特币版本，它使其能够执行计算逻辑，并实现第一代区块链无法实现的功能。\n\n## Gas 费（Gas\
  \ Fees）\n\n用户在 Defi 中直接与智能合约交互；因此，没有 Gas 费。所有的商品和服务都是非托管的，这意味着资产可能留在用户的钱包中，而不是存放在平台上。例如，一个人可以直接从他的\
  \ `MetaMask.wallet` 直接在 `Uniswap` 上交易代币。争议的代币永远不会存储在 `Uniswap` 的原生加密钱包中。相反，代币是在交易所的智能合约中与其他代币进行交换。\n\
  \n虽然非托管功能增加了 Defi 的去中心化程度，但这也付出了高昂的成本，可能会抑制投资者的意愿。中心化交易所通常处理内部交易来转移资产，除了交易费外没有额外费用。由于\
  \ `DEX` 不直接存储资产并需要用户与智能合约交互，因此所有交易都受到 `Ethereum` Gas 费的影响。\n\n## 以太坊 Gas 是如何驱动交易的\n\
  \n所有的区块链网络都由矿工支持，矿工是一组托管节点并确认交易的用户群体。区块链必须通过交易手续费来补偿矿工，以吸引他们并让他们能够开始运行。\n\n在 `Ethereum`\
  \ 上，交易成本被称为 Gas 费。每一个可以想象的智能合约交易或活动，如移动代币、验证余额、执行智能合约函数等，都会消耗 Gas。\n\nGas 的另一个功能是它为各种任务建立了优先级。费用越高，工作就越困难。因此，Gas\
  \ 充当了限制因素，防止网络被低成本的基础操作所过载。\n\n当矿工不足且 `Ethereum` 出现活动激增时，区块链会遇到被称为网络拥堵的现象。此时，Gas\
  \ 成本飙升，所有交易的 Gas 价格也随之上涨。网络拥堵可能会持续数周甚至几个月，只有当需求减少时，区块链的状态才能恢复正常。在某些情况下，每笔交易的费用可能从\
  \ 40 美元到 100 美元，甚至更高。由于费用占了交易的大部分，交易小额的投资者自然倾向于在此期间暂停他们的 Defi 活动。\n\n## Defi 有多大去中心化？\n\
  \n很难说 Defi 的去中心化程度到底如何。为了简单起见，我们将去中心化分为三类：中心化、半去中心化和完全去中心化。\n\n### 1. 中心化\n\n* \
  \  特点：托管、中心化价格馈送、中心化利率以及用于强制平的中心化流动性。\n*   示例包括 `Celsius`、`Nexo`、`BlockFi` 和 `Salt`。\n\
  \n### 2. 某种程度上去中心化（具有以下一个或多个特征但并非全部）\n\n*   特点：去中心化的平台开发/更新、去中心化的利率确定、无许可的保证金流动性、无许可的强平启动、去中心化的价格馈送、非托管。\n\
  *   示例包括 `bZx`、`dYdX`、`MakerDAO`、`Compound`。\n\n### 3. 完全去中心化\n\n*   特点：完全去中心化\n\
  *   示例：完全去中心化\n\n\n\n\n\n-   安全性方面稍微复杂一些：区块链技术是比特币的基础。但区块链究竟是什么呢？一个交易列表（或称账本）存储了比特币交易的所有历史。每笔新交易都会添加到此账本并与其相连。然而，这是以块为单位进行的，而不是作为单笔交易。“区块链”一词源于这种区块链。如果这个区块链存储在一个随后被成功攻击的数据中心，那么这种攻击可能会危及整个网络的安全。只需要一次成功的攻击，就能败毁区块链及其记录的区块和交易。因此，账本以去中心化的方式存储在多台计算机上。目前估计，全球分布着约\
  \ 10,000 个活跃的全节点（存储区块链完整副本的计算机）。攻击比特币需要同时攻击所有存储区块链的计算机（或其中许多计算机）。这同加密学了一起，构成了比特币安全性的主要原因。\n\
  \n比特币通过随时间推移价值并根据需要进行价值交易，提供了一个基础且相对简单的用例。用户只能接收、存储和发送比特币单位。比特币的编程语言受到极大限制，无法将复杂的计算逻辑实现到交易中，这是一个主要的弱点（或者取决于你的观点，这是一个巨大的优势）。因此，虽然比特币缺乏功能，但正是这种局限性服务了安全属性。\n\
  \n## 以太坊与智能合约\n\n当新兴的区块链社区试图实现比简单的接收、存储和发送比特币之外的用例时，离链（远离去中心化的数据处理和存储）并不是选项。因此，在\
  \ 2013 年，即比特币诞生五年后，由维塔里克·布特林（Vitalik Buterin）领导的一群远见者建立了以太坊。以太坊也是区块链，比特币一样。它的原生数字货币以太（Ether）同样稀缺，但它为开发者提供了更大的构建空间。凭借超过\
  \ 200,000 名开发者和数十种可用的应用程序，以太坊是世界上领先的可编程区块链。所谓的智能合约合约概念是由以太坊引入的。智能合约是根据预先约定的条款和条件在区块链上自动执行交易的程序。智能合约与简单的区块链交易一样，是以去中心化的方式执行的，因此与集中计算相比，它们在延迟和吞吐量方面的效率相对较低。\n\
  \n尽管如此，它们的优势在于极高的安全性和透明度。结果可能可以被任何人验证。一组相互作用的智能合约由于其去中心化的本质也被称为去中心化应用（dApps）。与智能合约相比，传统的银行软件对银行客户来说既不可见也无法理解。用户必须相信公司提供的程序会履行它们的承诺。另一方面，智能合约不需要任何个人、国家或公司的信任，因为代码是公开的：它在构成区块链的公共账本中被复制了数次。\n\
  \n然而，我们必须公平地指出，只有少数人拥有知识和资源来独立分析智能合约代码。与传统金融系统一样，用户通常依赖某些机构或个人，例如审计师或专家。\n\n在比较从比特币到以太坊的区块链技术演变时，可以得出结论：太坊采用了比特币的重要方面，同时通过在其上方启用计算逻辑对其进行了扩展。如果说比特币缺乏功能，以太坊则是功能过剩。\n\
  \n## 四\n\n在深入研究去中心化金融（Defi）的优缺点之前，请考虑传统金融的历史，以及我们是如何意识到需要一个不基于强大中间人的系统的。\n\n金融已经取得了长远的进步，理解这段简短的历史将帮助我们更好地理解为什么我们喜欢在尽可能多的领域将“去中心化”的概念引入“金融”中。\n\
  \n在人类历史开始之前，金融没有地位。狩猎食物和寻找避难所总结了人类的需求。随着人口的增加，人类需要相互交流。\n\n贸易最基本的形式是一个产品另一个产品的直接交换。你拥有的肉比需要的多，所以你必须和邻居用肉换小麦。但这种交易应该以什么比例进行呢？是\
  \ 1:1、2:1 还是其他比例？\n\n判断物品价值尚没有明确的标准。这种贸易方式的另一个问题是，你可能找不到愿意用自己的产品交换你的产品的人，或者可能花费很长时间，浪费了你的货物。\n\
  \n随着商品和产品数量的增加，对评估商品价值的标准和指数的需求也随之增加。这导致了货币系统的发明和第一代金融的诞生。公元前 600 年左右，第一种硬币形式的货币出现了，由电金（金银合金）组成。\n\
  \n### 一种交易方法\n\n人们现在可以很容易将商品兑换现金，反之亦然。随着工业的出现，不同种货币和资产变得流行。随着银行和第三方组织引入协调人类经济行为，新一代金融应生了。\n\
  \n但等一下！\n\n-   所有问题都解决了吗？\n-   谁负责钱？政府还是人民？\n-   钱是以公平平等的方式分配的吗？\n-   所有的钱都花在了人们的福祉和解决他们的问题上？\n\
  -   在存在中间人的情况下，能否保持货币交易的安全？\n\n正如你所预期的，当钱处于单一实体（如政府）的管辖之下时，我们遇到了一个大问题：无限制印钞。\n\n\
  通过建立中央银行，政府承担了制造货币的权利，并将自己建立为两个交易方之间的中间人。\n\n正如你所知道的，印更多的钱提高产品价格，而对商品的数量或质量没有影响。\n\
  \n另一方面，稀缺资产如黄金、稀有艺术品以及如今的比特币变得越来越值。货币贬值由两个主要因素引起：宽松的货币政策和过度通货膨胀。\n\n不需要指具体的某个机构或团体；但由于中央银行和中间人的无能或管理不当，全球近期面临了严重的金融危机。许多工厂和公司破产，导致许多人被解雇或失去工作。\n\
  \n\n\n\n\n在某种程度上，意义不大；当一个中间实体在去中心化金融系统中发挥重要角色时，去中心化就会迅速失去价值。让我们假设我们有一个真正去中心化的金融系统（Defi）。这个系统能够满足我们所有的需求吗？\n\
  \nDefi 是加密货币行业中一个快速扩张的领域，数千个应用程序运行在多个区块链上。然而，大多数标准的金融服务可以通过 Defi 提供，而无需银行或其他非银行金融机构等第三方参与。Defi\
  \ 最显著的特征是消除了中间环节。\n\n这是下一代金融服务。许多人认为 Defi 是金融的未来，投资它可能会带来丰厚的回报。但这些投资没有风险吗？\n\n由于初学者可能很难区分\
  \ Defi 的优点和缺点，因此讨论 Defi 的优劣将大有益处。\n\n## Defi 的优势之处\n\n如前所述，大多数传统的金融服务都可以在 Defi 空间内实现：\n\
  \n### 1. 去中心化交易所 (DEX)\n基于智能合约的在线交易服务 `DEXes` 允许用户在不使用中间机构的情况下交换令牌进行交易。\n\n### 2.\
  \ 自动做市商 (AMM)\n`AMMs` 与 `DEXes` 类似；但存在显著差异。`DEX` 平台采用订单簿（包含 P2P 订单）为资产定价，而 `AMM`\
  \ 平台使用专有的数学公式为资产定价，流动性由流动性提供提供，他们通常接收令牌作为奖励，而不是要求用户参与每笔交易的双方。\n\n### 3. 贷款\n许多人发现加密贷款行业是一个很有吸引力的选择。借款人获得资金，而贷款人获得利息支付。使用\
  \ Defi 的借款人可以使用资金作为抵押，并在无需信用评分的情况下贷款。\n\n### 4. 质押 (Staking)\n某些区块链（如 `Bitcoin`）基于工作量证明\
  \ (`PoW`)，而另一些则基于权益证明 (`PoS`)。质押是一种活动，你通过将资产锁定在 `PoS` 网络中以提供安全保障并确认区块链网络交易来获得补偿。\n\
  \n### 5. 非同质化代币 (NFT)\n`NFTs` 是加密领域的一种新现象，具有许多应用，如身份、艺术（数字所有权）、游戏、收藏品、体育、媒体与娱乐、房地产等。\n\
  \n### 6. 无损游戏和彩票\n游戏和彩票是 Defi 空间中其他具有吸引力的产品。“无损”彩票似乎是无风险的。这类彩票的参与者可以取回资金，一名幸运玩家将赢得共享池中产生的所有利润，而这一切在不使用中间机构的情况下，仅通过使用\
  \ Defi 空间中的智能合约实现的。\n\n## DEFI 的优势\n\n### 无许可\n“去中心化”是决定去中心化金融身份的首要且最重要的特征。该概念的定义主要决定了去中心化金融的优。去中心化是区块链的基础元素，有助于降低对企业的依赖。\n\
  \n此外，去中心化金融减轻了依赖机构进行监督、数据存储、服务器空间和其他问题的负担。区块链网络通过确保特定的交易历史可以轻松分发到所有成员，实现了所有这些目标。\n\
  \n去中心化策略对银行和金融的民主化非常有益。Defi 可以为所有人提供方便高效的金融服务访问。对 Defi 优缺点的讨论还将揭示绝大多数 Defi 解决方案运行在\
  \ `Ethereum` 上。`Ethereum` 是第二大区块链系统，其无许可的性质使其高度去中心化。\n\n它也应该让所有参与创建和使用 Defi 应用的人轻松获得。Defi\
  \ 应用中区块链的无许可特性也可能受益于区块链的互操作性。结果是它可以为许多类型的第三方集成提供多功能选择。\n\n同时，重要的是，无许可的区块链能力并非 `Ethereum`\
  \ 所有。由于 `Ethereum` 是构建智能合约的热门网络，它是设计 Defi 应用的稳妥选择。\n\n### 告别人为错误和管理不善\n如前所述，金融危机由于中央银行\
  \ (CBs) 和第三方中间机构 (TPIs) 的管理不当引起。然而，人为错误每天每天被排除；除非合同本身编写得糟糕。\n\n### 持续且即时的访问\n在 Defi\
  \ 之前，如果你需要贷款，必须去银行浪费大量时间。即使在深夜，你只需点击一下即可通过 Defi 获得贷款。只要你有互联网连接，你就可以随时随地访问市场。\n\n\
  ### 更健康的系统\n新冠肺炎证明了传统金融系统 (CeFi) 对全球性冲击的脆弱性。这是因为中心化金融系统依赖于个人之间的直接通信。\n\n维护去中心化金融系统\
  \ (Defi) 所需的物理接触可能减少到零，在当前的健康危机中，`bitcoin` 的价值和公司一直在上升。\n\n### 透明性\n虽然不可篡改性对于 Defi\
  \ 景观提供安全保障是必要的，但透明度也是 Defi 专业人士中的一个显著补充。去中心化意味着更高的透明度，分布式账本包含了所有区块链活动的信息。\n\n区块链的加密原理还确保信息只有在合法性经过验证后才记录。Defi\
  \ 的优缺点展示了客户如何从 Defi 应用的透明度中盈利。\n\n例如，Defi 应用中的透明性能增加尽职调查。同时，Defi 应用可以帮助用户识别并避免潜在的财务诈骗和有害的企业行为。具有适当审计追踪的\
  \ Defi 应用可以更容易识别谁对交易做了更改、何时发生以及如何发生。结果是，没有什么会损害金融生态系统的完整性。\n\n### 借贷应用\nDefi 在促进点对贷款和借贷替代方案的发展也发挥了重要作用。终端用户将从这些贷款和借贷选项中大获益。去中心化货币的优缺点无疑会对加密验证系统产生影响。\n\
  \n同时，它们确保了智能合约的整合。此类功能的可用允许消除银行等中间机构，银行通常负责验证交易中的各方。此外，对于验证借贷交易过程有用。\n\n结果是，Defi\
  \ 为贷款和借贷应用提供了更高效、更直接的验证过程。同时，Defi 为交易对手提供了保护。借贷中的 Defi 应用还将实现更交易解决和更高的访问性。\n\n目前，借贷应用是最知名的\
  \ Defi 应用。`Compound` 是展示 Defi 优点的值得关注的例子之一，尽管它专注于优点。\n\n\n\n借贷池提供了资金供他人借用，贷款者则获得借款人还给资金池的部分利息。贷款人的利率很大程度上取决于他们向资金池投入的金额。此外，加密资产的流动性是决定\
  \ Defi 借贷平台利率的重要因素。\n\n## DEFI 的缺点\n\nDefi 项目面临的许多问题和风险都与其构建的基础技术——区块链有关。由于由于超过\
  \ 90% 的 Defi 项目基于 `Ethereum` 区块链，我们把以太坊的挑战视为 Defi 的挑战：\n\n### 不可预测性\n如果托管 Defi 项目的区块链不稳定，那么该项目将自动继承宿主区块链的不稳定性。`Ethereum`\
  \ 区块仍在进化中；例如，从 `PoW` 迁移到新的 `Eth 2.0` `PoS` 系统时所产生的错误可能会给 Defi 项目引入新的风险。\n\n### 可扩展性\n\
  Defi 项目的另一个大问题是宿主区块链的可扩展性。扩展性问题导致了两个主要问题：\n\n1. 交易确认需要长时间；以及\n2. 在拥堵期间，交易费用极其昂贵。\n\
  \n`Ethereum` 在满载状态下每秒只能处理大约 13 交易，而中心化的对手每秒可以处理成千上万笔交易。\n\n### 智能合约问题\n对于许多 Defi\
  \ 项目来说，智能合约漏洞是问题的主要来源。智能合约代码中微小的缺陷会导致资金损失。\n\n### 低流动性\n流动性是基于代的 Defi 项目和区块链协议的核心方面之一。到\
  \ 2020 年 10 月，Defi 的总锁仓价值（TVL）将超过 125 亿美元。与成熟的金融系统相比，这只是冰山一角。\n\n### 过度抵押\n如前所述，加密借贷是\
  \ Defi 中极具吸引力的产品。然而，这一行业面临着过度抵押的问题，当借款人的抵押资产价值相对于贷款金额本身异常高时就会出现。为了补偿信用评分等障碍的缺失，Defi\
  \ 项目需要大量的抵押。\n\n### 低互操作性\n还有其他区块链，包括 `Bitcoin`、`Ethereum` 和 `Binance Smart Chain`，每个区块链都有自己的\
  \ Defi 生态系统和社区。互操作性允许运行在多个区块链上的 Defi 平台、工具、`DApps` 和智能合约相互进行通信。在这种情况变得简单之前，许多项目都是孤立的。\n\
  \n### 保险匮乏\n在发生攻击或其他欺诈活动时，投资者受到保险的保护。保险在中心化金融中至关重要，但在 Defi 中明显较少。\n\n### 中心化\n建立\
  \ `bitcoin` 和区块链的主要目标是创建去中心化金融，但去中心化金融并不总是像它应该是的那样去中心化。去中心化减少了诈骗。\n\nDefi 曾用于“Sushiswap”项目。`Sushiswap`\
  \ 未知的创始人于 2020 年 9 月 5 日停止了该项目，将其所有的 `Sushi` 代币兑换 `ETH`。`SUSHI` 代币的价值在从 `Uniswap`\
  \ 协议分拆时曾升至 10 美元，但在创始人转换其代币后跌至 0.6 美元（撰写本文时）。这说明了即使在 Defi 内部，单点故障也是可能发生的。\n\n###\
  \ 你的责任\n即使 Defi 是没有风险且没有错误的，它也不对你的错误负责。Defi 将责任从中间人转移到了用户身上。如果你不小心丢失了资产，没有人会追究你的责任；因此，在\
  \ Defi 领域开发防止人为错误的工具至关重要。独立性伴随着巨大的责任。许多用户不习惯以这种方式照顾自己，导致亏钱或被诈骗。\n\nDefi 是一项全新的、实验性的技术，存在一些担忧和问题，特别是在安全方面。去中心化金融的和支持者预计这些问题将在未来得到解决。\n\
  \n## 五\n\n如果 Defi 是一个无法立即理解的抽象概念，那么理解去中心化金融的最佳方法就是探索它的生态系统和用例。Defi 是区块链行业中一个充满活力的部门，满足每个人和每件事的需求。如果现实世界存在某种金融服务或产品，那么在\
  \ `Ethereum` 上一定有区块链版本。\n\n生态系统每天都在增长，每个月我们都能看到几个项目正处于建立市场主导地位的过程中。根据 `Defi Pulse`\
  \ 的数据，整个 Defi 领域包含价值 550 亿美元的加密资产。虽然大部分项目是去中心化交易所和借贷协议，但我们将在下一节中探讨其他值得关注的用例。\n\n\
  ### 去中心化交易所\n去中心化交易所 (`DEXs`) 是 Defi 的核心。它们在加密货币投资者中流行起来，是因为它们提供了去中心化的非托管交易。中心化交易所\
  \ (`CEXs`) 由金融服务公司运营，采用由市场做市者 (`MMs`) 维护的订单簿格式。虽然 CEXs 提供加密货币资产，但它们的平台本质上是中心化的，这会对安全、信任和隐私产生负面影响。\n\
  \n另一方面，开发者管理 DEXs，其格式基于智能合约。它们的智能合约执行交易、持有流动性、处理提现/存款，以及你可以想象到的任何其他操作。因此，实际上没有中间人与用户资金交互或控制它们。\n\
  \n一些最受欢迎的 DEX 包括 `Uniswap`、`Bancor`、`dYdX`、`PancakeSwap` 和 `SushiSwap`。虽然大多数运行基于自动做市商\
  \ (`AMM`)，但某些 DEXs 使用订单簿提供了类似于 `CEX` 的体验。托管是这两种方法之间的主要区别。\n\n在第一种情况下，投资者直接从他们的钱包执行交易。在第二种情况下，投资者必须先在\
  \ DEX 上存资金才能进行交易。\n\n### 自动做市商\n自动做市商 (`AMM`) 是一种持有链上流动性储备的智能合约，取代了订单簿。`AMM` 从所谓的流动性提供者那里吸引流动性，这些人在财务上被激励借出自己的加密货币，以获得费用形式的奖励。\n\
  \n客户不是在交易所的订单簿上交易，而是通过智能合约与其他用户进行交易。这种系统有其自己的优缺点。\n\n#### 优点：\n- 去中心化：智能合约是预设的协议，通过自主执行指令工作。当\
  \ DEXs 与治理框架结合使用时，本质上是将平台及其资产的所有权转移给用户。当然，这里没有中心化实体。\n- 非托管：交易者和流动性提供者直接从他们的加密货币钱包连接到\
  \ DEX，保持对其资产的完全托管权。然后使用智能合约来指定和处理所有交易。\n- 无操纵：CEXs 以市场操纵和内幕交易而闻名。DEXs 无法以有利于自己的方式影响价格，因为没有人能从中活动中获益。\n\
  \n\n\n\n## 概述\n\n- **安全性**：为了避免攻击，`DEXs` 通常以分布式的方式托管。此外，黑客只能与交易平台上的流动性池进行交互，而无法与交易所的用户交互。\n\
  - **代币访问**：由于其去中心化的特性，任何人都可以在 `DEX` 上列出资产，无需依赖平台所有者的背书或验证机制。\n\n## 缺点\n\n- **流动性限制**：这是一个缺点。中心化交易所和去中心化交易所一样，都依赖于用户提供的流动性，尽管程度并不相同。由于\
  \ `DEXs` 通常缺乏自身的流动性池，它们必须依赖收益农民（yield farmers）捐赠其资产以供其他交易者使用。没有他们，交易所将无法提供交易服务。\n\
  - **速度**：与相应的交易平台相比，它们的订单执行效率较低，这在很大程度上是因为缺乏先进的交易工具。\n- **滑点和成交量**：`DEXs` 越来越流行，但由于缺乏订单簿和做市商，客户面临着巨大的滑点，特别是在处理大订单时。\n\
  - **费用**：如果没有订单簿，成本并不会降低。所有用户必须支付固定的交易成本，以及以太坊网络的 Gas 费用。当网络过载时，单笔交易费用可能高达数百美元。\n\
  \n## 自动做市算法 (AMM)\n\n从技术角度来看，`AMM` 的主要目标是维持“恒定积”。恒定积是一种用于维持两种资产相等储备的算法，这些资产以 `1:1`\
  \ 的供应比例形成交易对。\n\n`Uniswap` 使用以下公式维持恒定积：`x * y = k`\n\n在该公式中，`x` 和 `y` 代表流动性池中两个代币的储备余额。`AMM`\
  \ 上的任何交易都不能影响不可变的 `k`（恒定积），否则会导致流动性失衡。\n\n因此，为这些池提供燃料的流动性提供者“被迫”提供等量的两种币。例如，如果我们想为\
  \ `ETH/USDT` 池提供流动性且只有 `2 ETH`（价值 4,440 美元），我们必须提供价值 4,440 美元的 `USDT`。使用上述公式，我们得到以下恒定积：`2\
  \ ETH * 4400 DAI = 8,800`\n\n在没有任何交易的情况下，数字保持不变。但如果交易者想要购买 `1 ETH`，他将从池中取出以太币，并返回等比例的\
  \ `USDT` 代币。然而，买家还需要支付原始价格（`1 ETH = $2,200 USDT`）之外的溢价。交易者想要购买的 `ETH` 越多，溢价越高，这确保了池永远不会耗尽流动性。由于溢价确保了比例恒定，`K`\
  \ 始终保持不变。\n\n### 借贷\n\n借贷是 `Defi` 中第二大用例。现代经济依赖贷款生存，如果没有贷款，大多数先进的金融活动对普通人来说都是禁止的。无法贷款的人也无法开始业务或购买房地产。\n\
  \n借资金的唯一方法是向中介机构（通常是银行）申请贷款。银行只向符合良好信用评分、稳定工作、最低押金等标准的受信誉个人提供贷款，以保护其利益。\n\n这些要求提供了各种限制和挑战，可能会阻止某人贷款，使其仅适用于特定群体。`Defi`\
  \ 借贷协议通过消除所有障碍来抵御这种排他性，这对于没有银行账户的人特别有益。由于其去中心化和可访问性，这些协议适用于所有背景、种族和地区的人。只要能提供必要的押金，就可以获得贷款并使用新获得的资金。\n\
  \n除了押金外，没有其他要求。此外，借贷协议不使用普遍的身份检查，如“了解您的客户” (`KYC`) 政策。对于只熟悉传统金融的人来说，这可能听起来很奇怪，但\
  \ `Defi` 用户可以匿名申请贷款并在几分钟内收到资金。\n\n著名的借贷协议包括 `Compound`、`Aave`、`Maker` 和 `bZx`。它们总共托管了价值\
  \ 260 亿美元的抵押资产，占整个 `Defi` 市场的近 50%。\n\n### 实践中的借贷\n\n每个借贷平台由两方组成：贷款者和借款者。就像交易者一样，双方通过智能合约中的流动性池进行交互。贷款者提供资产并赚利息，而借款者贷款并对其债务支付利息。\n\
  \n每种加密货币都有自己的流动性池和利率，以 `APY`（年化收益率）为单位。`APY` 利率随资产而异，并根据供需法则增加或减少。\n\n值得提到的是，`APY`\
  \ 范围从 3% 到 20%（极端情况下甚至更高），使得 `Defi` 借贷比银行有利得多。`APY` 利率可以是固定的或浮动的，取决于平台。在第一情况下，贷款资产的用户将获得不变化的固定利息。在第二种情况下，利率可以根据市场情况上升或下降。\n\
  \n### 闪电贷\n\n借贷协议还提供一种独特的贷款，称为闪电贷 (`flash loan`)。闪电贷不需要预付押金，用户如果需要可以申请数百万美元。但问题在于闪电贷需要几乎立即偿还。\n\
  \n事实上，闪电贷的生命周期仅持续一个交易区块。在下一个区块到达之前，用户必须偿还贷款。如果失败，原始交易将回滚，资金丢失。闪电贷主要用于套利交易和债务重组等快速任务。其主要缺点是闪电贷非常复杂，容易受到攻击。\n\
  \n总结，借贷协议有效地充当贷款者和借款者之间的中介。贷款者从获得高于平均水平的利息中受益，而借款者能够以完全匿名且安全的方式无需大量文件即可获得贷款。\n\n\
  ## 衍生品\n\n除了简单的代币交换，`Defi` 还针对复杂的交易产品。更高级的中心化交易所提供去中心化衍生品，其价值源自底层资产，如货币、股票、指数或商品。\n\
  \n著名的衍生品产品包括期货、期权和合成加密资产。某些投资者交易衍生品是为了对冲波动，或对资产进行投机。由于其风险性，大多数加密投资者避免交易衍生品。尽管如此，`Defi`\
  \ 衍生品市场仍然着着作用。\n\n最流行的 `Defi` 衍生品协议是 `Synthetix` 和 `bZx` (Fulcrum)。它们都托管了约 23 亿美元的价值。虽然与去中心化交易和借贷等领域相比这一数字极低，但衍生品平台正在快速增长，随着新项目和功能的推出，其采用率也在上升。\n\
  \n### Synthetix 上的衍生品\n\n`Synthetix` 是最大的 `Defi` 衍生品协议，其产品被称为 `synths`。这些 `synths`\
  \ 与传统的衍生品不同，因为它们将其底层资产代币化。\n\n合成资产 (`synth`) 仅仅是模仿另一种资产价值的代币化衍生品。例如，像 Gamestop 这样的股票有一个名为\
  \ `sGME`（合成 GME）的代币版本，代表真实的股票。其价格通过 `Chainlink` 等去中心化预言机跟踪，任何人都可以进行交易。\n\n\n\n\n\
  合成资产（Synths）特别有用，因为它们提升了金融的可访问性。如果无法访问美国股市，这些人将无法交易诸如 `GME` 这样的资产。此外，投资者无需持有底层资产，在交易、买入或卖出资产时会更加方便。\n\
  \n在 Synthetix 的情况下，DeFi 的去中心化特别具有优势，因为任何人都可以创建合成资产。由于基于区块链的合成资产可以追踪各种底层资产，在创建衍生品时几乎是无限的。\n\
  \n## 收益性挖矿 (Yield Farming)\n\n收益性挖矿与去中心化交易所的工作原理密切相关，它目前是 DeFi 中最大的用例。收益性挖矿可以定义为一种被动收入策略，让投资者能够通过使用现有加密资产赚取更多加密货币。本质上，收益性矿工以流动性的形式向去中心化交易所提供其加密货币以赚取奖励。\n\
  \n去中心化交易所通过奖励交易费来激励收益性矿工，这些费用来自使用矿工所提供的流动性进行交易的用户。这种系统在 `DEX`、交易者和流动性提供者之间形成了一种共生关系，双方都能从中受益。\n\
  \n每个矿工根据其在流动性池中的贡献比例获得费用。收益性挖矿的过程可以持续无限的时间。然而，用户被激励从一个池跳到另一个池，以追逐极具竞争力的收益率。在收益性挖矿中，收益率远高于其他类似的活动。\n\
  \n流行的收益性挖矿平台包括 `Uniswap`、`Curve Finance`、`SushiSwap`、`Yearn Finance`、`Cream Finance`\
  \ 等。大部分都是使用 `AMMs` 的去中心化交易所，这意味着收益性挖矿是 `DEXs` 的固有特性。\n\n在进行收益性挖矿时，投资者通过接收流动性提供者（`LP`）代币保留对其资产的托管。`LP`\
  \ 代币代表投资者在池中的份额，必须兑换才能获得原始资金。然而，收益性矿工也可以将 `LP` 代币存入其他池并进行更多资产的矿。因此，通过同时利用两种被动收入策略，有可能获得双倍奖励。\n\
  \n## 无常损失 (Impermanent loss)\n\n向交易所提供流动性的问题在于，收益性矿工面临着无常损失（`IL`）的风险。无常损失是将资产用于投机目的与将其用于挖矿以赚取奖励之间的机会成本。\n\
  \n`IL` 几乎是不可避免，因为加密货币是波动性资产。如果一种资产从存入池的那一刻起价值损失或增值了太多，收益性矿工直接将资产存储在钱包中会更好。在最好的情况下，用户赚的钱会比什么都不做的少一点；在最坏的情况下，用户取回后的钱会比最初存入的钱少。\n\
  \n在挖矿过程期间，无常损失是未实现的。当收益性矿工离开池并兑换其代币的那一刻，损失就实现了。因此，矿工可以通过等待价格回落到其初始值来避免损失。\n\n##\
  \ 最小化无常损失\n\n避免 `IL` 的最佳方法是加入波动率较低的池，或者加入收益率高的池。在第一种情况下，面临无常损失的机会很低，因为资产本身在短时间内价值没有过多的增值或减少。到过程结束时，实现的损失要么很小，要么不存在。\n\
  \n在第二种情况下，收益率可以高到抵消无常损失带来的损失。由于流动性池使用交易费向收益性矿工发放奖励，因此从交易量的突然激增中获利是可能的。即使遭受了无常损失，挖矿获得的钱也足以保持盈利。\n\
  \n某些收益性挖矿平台旨在最小化 `IL`。例如，`Curve Finance` 仅提供稳定币和封装代币（wrapped tokens）的流动性池——这两者都保持稳定的价格点。由于几乎没有波动性，有可能在不经历无常损失的情况下进行收益性挖矿。然而，与其他流动性池相比，收益率自然较低。\n\
  \n## 保险\n\n智能合约可以是去中心化且透明的，但它们容易受到漏洞攻击。稳定币是去中心化的 DeFi 项目仍可能存在漏洞，如果发生这种情况，可能会导致数百万美元的损失。\n\
  \n与中心化交易所相反，`DEXs` 没有在发生漏洞时保护或赔偿客户（在 `Binance`、`Gemini` 和 `Coinbase` 等交易所上）。\n\n\
  在这种情况下，DeFi 投资者必须使用保险协议来保护其资金。\n\n### 保险的工作原理\n\n`Nexus Mutual` 和 `Opyn` 是两个最大的保险协议，它们涵盖了价值数亿美元的加密资产。当用户申请保险时，他们支付所谓的“覆盖（coverage）”，在特定事件中提供保障。覆盖金额代表在发生漏洞时将支付的价值。覆盖期限是指用户可以使用保险的时间。\n\
  \n例如，在 `Uniswap` 上提供加密资产的收益性矿工可以访问 `Nexus Mutual` 并申请为期两周并覆盖其 50% 的覆盖选项。如果发生漏洞，`Nexus\
  \ Mutual` 将启动理赔程序。\n\n# 稳定币\n\n稳定币是以法币价值为基础的加密货币。由于加密货币具有波动性，稳定币被用作对冲以防止极端市场情况。此外，它们还用于通过将加密货币转换为法币的形式来快速锁定利润。\n\
  \n美元是加密市场中的主导稳定币。将代币价值挂钩美元的方法在稳定币之间是不同的，每个项目都使用自己的系统来确保零波动。\n\n\n\n\n在区块链行业中，治理模型建立了一套系统，让投资者可以直接决定项目的设计方式和发展方向。就像公司的股东一样，社区成员可以发表自己的意见，并积极参与决策过程。\n\
  \n治理实现了绝对的去中心化，并将所有规划工作委托给项目的投资者而非其开发者。\n\n在撰写一篇关于去中心化自治组织（DAO）的论文时，以太坊创始人维塔林·布特林（Vitalik\
  \ Buterin）将治理模型比作没有管理者的公司。整个系统不再依赖于少数几位高管，而是利用智能合约来处理、执行并接受各种任务和决策。\n\n治理对于 DeFi\
  \ 至关重要，因为它将协议的所有所有权交给了社区。大多数项目都有一种治理代币，赋予用户投票权以及创建治理提案的能力。\n\n理想情况下，治理代币的分配应该是公平的。这可以通过向活跃用户空投部分加密货币的供应来实现，Uniswap\
  \ 在 2020 年 9 月推出 `UNI` 时就是这样做的。当时，Uniswap 通过 400 个 `UNI` 的空投，向社区发放了 `UNI` 创世代币的\
  \ 60%。\n\n否则，去中心化协议也可以简单地在交易所列出治理代币，而不进行公平分配。看好项目未来的投资者将通过投资该代币并据此获得投票权。由于代币持有者也是投票者，投资者将受到激励以做出最佳的决策。\n\
  \n### 治理在实践中是如何运作的\n\n投票和参与治理的行为围绕着治理代币的使用展开。一旦发放，持有者就可以提议更改并对现有提案进行投票。此外，社区成员还可以在项目托管的在线论坛上讨论治理问题和即将上线的功能。\n\
  \n所有治理行为都要求发起者在整个过程中将治理代币锁定在智能合约中。锁定代币对于防止提案垃圾信息（proposal spam）是必要的，并能确保用户在发送提案之前花费更多时间来创建更高质量的提案。\n\
  \n要让一个提案被考虑，它必须达到法定人数（quorum）。基本上，每项治理提案都必须有最少数量投票者进行投票。如果结果有利于该提案，且已经达到法定人数，智能合约将批准它。\n\
  \n### 六大类\n\nDeFi 涵盖了广泛的活动，满足了无信任、非托管、开放、可编程和非托管金融服务的要求。除了预言机（oracles）和钱包等辅助服务外，我们确定了六大主要的\
  \ DeFi 类别。它们之间的区别并不总是显而易见的。另一方面，这种分类代表了参与者对 DeFi 市场的观点。\n\n1. **稳定币**（Stablecoins）旨在保持代币相对于另一种资产（通常是美元或其他主要法币）的价值。非托管稳定币本身就是\
  \ DeFi 服务。虽然托管稳定币是中心化的，但它们可以被用于 DeFi 服务。\n2. **交易所**（Exchanges）。用户可以在交易所将一种数字资产交换为另一种。DeFi\
  \ 交易所通过去中心化订单簿匹配订单或通过算法匹配订单簿来建立价格，从而避免获得用户资产的所有权。\n3. **贷**（Credit）涉及产生具有固定还款日的利息工具，以及匹配贷款人和借款人以发行此类工具。\n\
  4. **衍生品**（Derivatives）是指价值由底层资产或资产组的功能决定的金融工具。期货和期权是衍生品的两种常见形式，与资产未来的价值有关。\n5.\
  \ **保险**（Insurance）通过用支付小额保费的确定性，换取在发生涵盖事件时获得大额理赔的机会，来防御风险。\n6. **资产管理**（Asset management）通过平衡风险、时间跨度、多样性和其他因素增加资产组合的价值。虽然本报告中处有例子，但必须记住\
  \ DeFi 仍在演变中。\n7. 借贷与贷款（Borrowing and lending）。\n8. 彩票（Lottery）。\n9. **支付**（Payments）。这些分类以及属于这些可能会随着时间的推移而演变。由于\
  \ DeFi 服务的编程性和模块化，聚合器已经发展用来调节这些基础类别。例如，Yearn Finance 是一个从流动性中优化收益的业务。`1inch` 和 `Matcha`\
  \ 等交易所聚合器将交易订单路由到最佳价格。用户受益于 `Zapper` 和 `Zerion` 的收益优化界面和其他 DeFi 操作。`Tally` 聚合 DeFi\
  \ 治理活动。由于其潜力，聚合器可能产生大量的 DeFi 活动。\n\n### 稳定币 (STABLECOINS)\n\n稳定币对 DeFi 至关重要，因为它们将\
  \ DeFi 的风险收益计算与数字资产的波动性隔离开。金融互操作性需要稳定的价格进行价值交换，投资者期望有一个稳定的记账单位。\n\n广义上，稳定币可以分为三类：\n\
  \n1. **托管**（Custodial）中心化稳定币（如 `USDC` 或 Facebook 提议的 `Diem`）使用法或高质量流动资产作为储备。由于它们需要信任托管人，因此不是\
  \ DeFi 工具。然而，将其包含在这里是因为它们可以被纳入其他 DeFi 服务。\n2. **资产支持**（Asset-backed）稳定币使用智能合约收集加密货币或其他资产形式的抵押品。\n\
  3. **算法**（Algorithmic）稳定币通过代币供应的动态扩张和收缩尝试维持挂钩。由于它们在非托管、去中心的基础上运行，资产支持和算法稳定币本身就是\
  \ DeFi 服务。与 DeFi 其他领域一样，项目正在尝试不同的机制。它们在大规模和市场条件下维持挂钩的有效性仍然是一个不确定因素。\n\n### 交易所 (EXCHANGES)\n\
  \n交易所从两个方面对 DeFi 很重要：它们允许各种数字资产持有者使用 DeFi 服务，并提供从代币增值中获利的机会。中心化交易所需要交易者信任运营商保护资金、提供准确的价格、匹配买卖双方以处理交易、结算交易并进行交易监控。无论交易所是纯法币的（如\
  \ `NASDAQ`）、促进法币与数字资产之间的交易（如 `Coinbase`），还是仅处理数字资产之间的交易（如 `Uniswap`），都是如此。\n\n相比之下，DeFi\
  \ 交易所去中心化了关键功能。可以通过非托管钱包进行编程访问。智能合约会自动对点或针对资金池处理交易。虽然交易所可以在链上或链外运行订单簿，但最著名的 DeFi\
  \ 交易所形式——自动做市者（AMMs）完全取消了传统的订单簿。\n\n\n\n\n\n任何数字资产持有者都可以锁定资金作为潜在交易的流动性，并获得交易者支付的收益。任何交易价格都是根据交易资产中可用流动性的比例算法生成的。\n\
  \n因此，交易者是与做市者提供的流动性池进行交易。\n\n## 信用\n\n借贷和贷款是金融的核心，因为它们促进了风险承担并扩大了资本供应。中心化保险公司需要平衡收取的保费与投资投入，以维持足够的资本储备来应对赔付，同时还要处理与之相关的风险评估、承保和赔付管理。\n\
  \n虽然 DeFi 衍生品可用于对冲财务违约风险，但 DeFi 保险服务主要关注由智能合约故障、成功的 DeFi 协议黑客攻击、激励系统的博弈论风险以及其他带来的\
  \ DeFi 特有风险。\n\n相比之下，借款人必须提供大于贷款价值的抵押品。双方对自己的资产拥有完全所有权，并具备随时进行清算的能力。信用条款可能非常复杂，这些工具也可以被证券化并交易。\n\
  \nDeFi 保险池以数字资产作为抵押，通过独特的协议提供资本，以换取部分保费的代币。这些资金在发生黑客攻击或其他故障时补偿支付保费的客户。赔付评估员对是否支付赔付进行投票，赔付通常通过基于代币的经济激励来执行。资本提供者或治理代币持有者通常从剩余和投资回报中受益。\n\
  \n为了缓冲价格波动，贷款通常使用稳定币进行超抵押；如果抵押品价值低于指定的贷款比例，头寸将被自动清算以偿还债务。借款人支付的利息通常分配给储备池。\n\n##\
  \ 衍生品\n\n衍生品增加了金融交易的复杂性，超越了贷款的范畴，创造了有价值的市场机会和新的风险。衍生品可以基于股票、商品或数字资产的当前或未来价值；企业的现金流（创建众筹关系）；或现实世界的事件，例如体育赛事的结果或天气（创建预测市场）。\n\
  \n要购买或卖出期货或期权合约，交易者依赖于中心化金融中的期货佣金和其他中间人。他们还接受客户的资金或其他资产来支持订单。交易者将订单发送给结算会员公司，由这些公司代表他们执行交易。清算所作为两家结算公司之间的中间人，承担交易的法律对手风险。它处理交易的所有方面，包括清算、担保和结算。\n\
  \nDeFi 衍生品服务直接连接买卖双方，并由激励性抵押池和其他主要的 DeFi 类别支持。某些服务允许用户买卖数字资产的合成敞口，而无需实际持有这些资产。衍生品可以与杠杆相关以放大损益，或与资产价格反向连接以提供等于做空敞口。其他应用涉及预测市场，用户可以对未来事件的结果进行下注，通过“群体智慧”产生信息。\n\
  \n## 保险\n\n风险对金融至关重要，并且随着时间的推移与收益正相关。然而，投资者和其他人往往愿意支付一个确定但较小的金额，以避免更大损失的可能性。其他人则通过承担这些风险的部分来受益。\n\
  \n## 资产管理\n\n投资者将投资组合管理和配置委托给资产经理。在传统金融中，投资经理会组合诸如共同基金、交易所基金、单独管理账户或私募股权等受监管的产品。资产配置由财富管理师创建，并通过财务顾问和经纪人交付给客户。机器人顾问提供极少或没有人工干预或监督的自动化金融服务。\n\
  \n在 DeFi 中，底层投资可以由代币、捕捉传统敞口的数字资产、合成结构化代币和计息账户组成。DeFi 资产管理协议通过智能合约将它们组合成“保险库”或“池”，这些池作为数字资产的多样化组合。资产类别与组合类型之间的边界以及这些服务的典型业务模型仍在发展中。\n\
  \n## 贷款与借\n\n传统金融系统要求客户拥有银行账户以访问其服务，而目前有 17 亿人缺乏账户。向银行借贷受限于额外条件，例如高信用评分和足够的抵押品，以说服银行你信用良好且有能力偿还。\n\
  \n这种障碍通过去中心化借贷被消除，允许任何人利用其数字资产作为抵押获取贷款。向贷款池贡献并获得这些资产的利息可以帮助你获得资产回报，同时让你参与贷款市场。\n\
  \n## 彩票\n\n随着 DeFi 的演进，创新且具有破坏性的金融应用将出现，使访问变得民主化并消除中间人。为彩票增加 DeFi 元素允许将池资金转移到以太坊区块链上的智能合约中。\n\
  \nDeFi 的模块化允许你将基础彩票 Dapp 连接到另一个 DeFi Dapp，以构建更有价值的东西。我们在书中将介绍的 DeFi Dapp 之一允许玩家汇集资金。池化资金随后投资于一个\
  \ DeFi 贷款 Dapp，获得的利息将定期分配给随机中奖者。在选出获奖者后，所有彩票购买者都将获得退款，确保没有人亏钱。\n\n\n\n\n\n加密货币最重要的功能之一是允许双方之间进行去中心化且无需信任的资金转移。随着\
  \ `Defi` 变得越来越流行，越来越多的创新支付机制正在被开发和测试。\n\n本书讨论的一项 Defi 倡议试图通过将支付重新定义为“流”而非传统的“交易”，来改变我们对支付的认知。以流的形式提供支付的能力为资金开辟了许多可能性。想象一下“按需付费”，但规模要小得多且准确性更高。\n\
  \n`Defi` 的诞生和创新速度无疑为支付的运作方式提供了新的思考角度，解决了当前金融系统的许多缺陷。\n\n七\n\n## 什么是以太坊（Ethereum）？\n\
  \n以太坊区块链目前正用于构建大多数的 `Defi Dapps`。但是，以太坊究竟是什么？`Ethereum` 是一个在全球范围内开源的去中心化应用平台。可以将其看作一台无法关闭的全球计算机。在以太坊上，软件开发者可以根据一组标准创建控制数字货币的智能合约，这些合约可以从世界上任何地方访问。\n\
  \n本书还将介绍提供金融服务的去中心化应用（`Dapps`），也称为 `Defi`。这些 `Dapps` 的构建区块是由软件程序员编写的智能合约。以太坊网络随后部署这些智能合约，每天\
  \ 24 小时不停地运行。网络将跟踪最新状态并维护数字价值。\n\n## 什么是智能合约？\n\n智能合约是一种可编程合约，允许双方在不依赖第三方执行交易的情况下对交易参数达成一致。例如，如果阿里（Alice）希望创建一个基金，在未来\
  \ 12 个月内每月向鲍（Bob）支付 100 美元，她可以设计智能合约来实现以下操作：\n1. 验证当前日期。\n2. 每月初自动向鲍发送 100 美元。\n\
  3. 重复直到智能合约的资金耗尽。通过利用智能合约，Alice 消除了对信任的第三方中间人（律师、托管代理人等）将信任资金转移给鲍的需求，并且该过程对所有参与方都是可见的。\n\
  \n智能合约按照“如果……那么……”的逻辑运行。当满足特定条件时，智能合约将按照指定运行。多个智能合约连接在一起工作，完成更复杂的程序和计算，这被称为去中心化应用（`Dapp`）。\n\
  \n## 什么是以太币（Ether/ETH）？\n\n以太坊区块链的原生货币是 `ether`。它的功能类似于钱，并且像 `Bitcoin` 一样用于日常交易。你可以将\
  \ `Ether` 转给另一个人以市场价格购买商品和服务。以太坊区块链会跟踪交易并确保其完成。\n\n此外，`Ether` 被用于支付允许智能合约和 `Dapps`\
  \ 在以太坊网络上运行的费用。在以太坊网络上执行智能合约的一个合适对比是开车。你必须有燃料才能启动汽车。在以太坊上，你必须支付名为 `Gas` 的 `Ether`\
  \ 费用来执行智能合约。\n\n`Ether` 逐渐演变为其独特的储备货币和价值存储媒介。在 `Defi` 生态系统中，`Ether` 目前是作为许多 `Defi\
  \ Dapps` 底层抵押品的首选资产。它确保了金融系统的安全性和透明。如果这让你感到困惑，不要担心；我们将在书的后部分详细介绍。\n\n## 什么是 Gas（燃料）？\n\
  \n以太坊上的所有交易和智能合约执行都会产生少量的费用。这种费用被称为 `Gas`。`Gas` 是执行某操作或智能合约所需的计算量的技术术语。执行操作越复杂，所需的\
  \ gas 就越多。Gas 费用完全以 `ETH` 支付。\n\nGas 价格会根据网络需求不断波动。由于网络计算资源较低，如果有更多人在以太坊区块链上进行交互（例如进行\
  \ `ETH` 交易或执行智能合约操作），gas 价格可能会上涨。相反，当网络利用率不足时，gas 的市场价格会下降。\n\nGas 成本可以手动调整，当网络由于过度使用而过载时，gas\
  \ 价格最高的交易将优先通过验证。通过验证的交易将确定并添加到区块链中。如果支付的 gas 费用太低，交易将进入队列并可能需要一些时间才能完成。因此，低于平均\
  \ gas 费用的交易可能需要更长时间才能完成。\n\n## 什么是去中心化应用（Dapps）？\n\n在以太坊语境下，`Dapps` 是通过智能合约与区块链交互的接口。`Dapps`\
  \ 从外部看出现和行为类似于普通的网页和移动应用，但它们与区块链交互的方式不同。某些方法包括需要 `ETH` 来使用 `Dapp`、以不可更改的格式在区块链上存储用户数据等。\n\
  \n### Dapps 的优点是什么？\n\n`Dapps` 通常开发在以太坊等去中心化区块链网络之上，并提供以下益处：\n\n*   不可更改性：一旦信息在区块链上，就无法被更改。\n\
  *   防篡改：记录在区块链上的智能合约是防篡改的，这意味着更改时会通知所有参与者。\n*   透明性：驱动 Dapps 的智能合约是公开审计的。\n*   可用性：只要以太坊网络保持活跃，构建在上面的\
  \ `Dapps` 就会保持活跃和可用。\n\n### Dapps 的缺点是什么？\n\n虽然区块链有很多优点，但也有许多缺点：\n\n*   智能合约由人类创建，质量取决于编写者。不可更改的智能合约会放大人为错误。\n\
  *   透明性：由于黑客可以查看代码寻找漏洞，公开审计的智能合约也可能成为攻击向量。\n*   扩展性：在大多数情况下，Dapp 的带宽受限于其运行的区块链。\n\
  \n### 你还能用以太坊做什么？\n\n除了创建 `Dapps`，以太坊还可以用于创建去中心化自治组织（`DAO`）和发行其他加密货币。去中心化自治组织（`DAO`）是一种完全由代码而非单一个人控制的组织。基于智能合约，这种代码允许\
  \ `DAO` 取代传统组织的运行方式。由于它是基于代码的，因此不受人为干预并透明运行。`DAO` 代币投票将用于治理决策或裁决。\n\n在令牌方面，以太坊可以作为创建其他加密货币的平台。在以太坊网上，目前有两种流行的令牌协议：`ERC-20`\
  \ 和 `ERC-721`。`ERC-20` 是发行以太坊令牌的协议标准，规定了规则和标准。`ERC-20` 令牌是同质化的，可以相互交换并具有相同的价值。相反，`ERC-721`\
  \ 令牌是非同质化的，这意味着是唯一的且无法交换。\n\n八 \n\n钱包是与区块链交互的易用界面。它管理你的私钥，私钥是打开加密货币保险库锁的关键。\n\n\n\
  \n\n\n# 托管型与非托管型钱包\n\n钱包分为两类：托管型和非托管型。托管钱包是由第三方代表你存储和管理加密货币的钱包。非托管型钱包让你对自己的加密货币拥有完全的控制权和所有权。这类似于区块链行业许多人倡导的格言：“做自己的银行”。\n\
  \n通过使用托管型钱包，你将信任交给了第三方来确保你的币安全。这非常方便，因为你不需要担心私钥的安全；相反，就像电子邮件账户一样，你只需要担心账户凭据的安全。然而，将加密货币寄托给第三方会让你面临托管人因管理不当或被攻击而丢失你加密货币的风险。托管型钱包曾有过丢失加密货币的记录；其中\
  \ `Mt. Gox` 是最著名的例子，它在 2014 年损失了超过 85 万个比特币，价值超过了 4.5 亿美元。\n\n通过使用非托管型钱包，你完全依靠自己来确保加密货币的安全。然而，使用非托管型钱包意味着你将安全负担转移到了自己身上，你必须完全准备好安全地存储你的私钥。如果你丢失了私钥，将失去对加密货币的访问权限。\n\
  \n## 我应该使用哪种钱包？\n\n市场上有很多加密货币钱包。为了本本书的内容，我们将介绍两种对 DeFi 友钱包，它们将帮助你快速上手以太坊网络。\n\n\
  ### 移动用户的 Argent 钱包\n\nArgent 钱包是移动用户的选择。Argent 是一种非托管钱包，提供了易用性和高安全性，而这两者并不总是兼得。它通过使用\
  \ `Argent Guardians`（Argent 守护者）来实现这一点，这些是可以验证你身份的人、设备或第三方服务。\n\n示例包括使用 `Argent`\
  \ 的家人朋友、其他硬件或 `Metamask` 钱包，以及双重认证服务。Argent 正在利用这个有限的信任网络，重新考虑在恢复账户时对纸质助记词备份的需求。\n\
  \n如果你认为你的钱包已被破解，`Argent Guardians` 允许你锁定并立即冻结所有资金。除非你请求 `Argent Guardian` 提前解锁，否则你的钱包将在五后自动解锁。\n\
  \n你还可以通过添加额外的安全功能（例如每日交易限制）来增强钱包的安全性。这对于防止黑客在获得你的 `Argent wallet` 访问权限后提取资金非常有用。当达到每日交易限制时，你会收到通知，任何超过限制的交易将延迟\
  \ 24 小时以上。当然，你可以使用你的 `Argent Guardians` 来授权超过限制的大额合法交易。\n\nArgent 为钱包用户提供免费交易，并承担所有支付给网络的以太坊\
  \ Gas 费用。Argent 钱包允许你直接从钱包与 DeFi Dapp 交互，无需另一个应用程序或设备。\n\n### 桌面用户：Metamask\n\n\
  Metamask 是一个适用于 Chrome、Firefox、Opera 和 Brave 浏览器的浏览器扩展程序。Metamask 与 Argent 一样，是非托管钱包，既是钱包也是以太坊网络的交互桥梁。\n\
  \nMetamask 允许你存储以太坊和 `ERC20` 代币。Metamask 作为交互桥，允许你使用托管在以太坊网络上的所有去中心化应用（Dapps）。\n\
  \n如果不使用像 `MetaMask` 这样的交互桥梁，除非你运行完整的 `Ethereum node` 并将整个以太坊区块链（大小超过 400GB）下载到电脑上，否则你的浏览器无法访问以太坊区块链。在技术层面，`MetaMask`\
  \ 通过向你的浏览器页面注入由以太坊核心开发者编写的名为 `web3.js` 的 JavaScript 库来实现这一点，让你能够轻松与以太坊网络交互。\n\n\
  Metamask 简化了在笔记本电脑或 PC 上与以太坊网络上的 DeFi Dapp 交互。它们是安全的，因为你必须对网络上进行的每次交互和交易进行签名。然而，为了保持你的\
  \ Metamask 安全，你必须小心。任何拥有你的密码或助记词（你在注册钱包时收到的秘密短语）的人将拥有你钱包的完全控制权。\n\n# 稳定币\n\n加密货币价格波动极大。稳定币与美元等稳定资产挂钩，旨在减少波动。稳定币的创建是为了作为可靠的交易媒介，并帮助用户对冲价格波动。稳定币已迅速成为\
  \ DeFi 的重要组成部分，这对这个模块化生态系统至关重要。\n\n在本章中，我们将研究锚定美元的稳定币。稳定币并不相同，因为它们使用不同的机制来维持对美元的锚定。锚定有两种类型：法币抵押和加密货币抵押。为了保持美元美元锚定，大多数稳定币使用法币抵押系统。\n\
  \n为了展示锚定管理的差异，我们将查看两种美元稳定币：`Tether (USDT)` 和 `Dai (DAI)`。\n\n### Tether (USDT)\n\
  \nTether (USDT) 每产生一个 `Tether` 代币都有一美元储备。随着 2020 年 1 月每日交易量达到超过 300 亿美元，Tether 是最大且最常用的美元稳定币。Tether\
  \ 的储备存储在金融机构中，用户必须信任实体 `Tether` 拥有声称的储备金额。因此，Tether 是一种中心化的法币抵押稳定币。\n\n### Dai (DAI)\n\
  \n另一方面，Dai (DAI) 由 `Ethereum (ETH)` 等加密货币支持。得益于去中心化自治组织批准的智能合约，它的价值固定在 1 美元。用户可以随时验证生成\
  \ `DAI` 所使用的抵押品。DAI 是一种加密货币抵押的去中心化稳定币。\n\n## MAKER\n\nMaker 是构建在以太坊上的智能合约平台，包含三种代币：`Sai`\
  \ 和 `Dai` 稳定币（都通过算法挂钩美元）以及网络治理代币 `Maker`。\n\n`Sai (SAI)` 也称为单质抵押 Dai，是一种仅由 `Ether\
  \ (ETH)` 作为抵押品的加密货币。\n\n`Dai (DAI)` 也称为多质抵押 Dai，于 2019 年 11 月引入。它目前由 `Ether (ETH)`\
  \ 和 `Basic Attention Token (BAT)` 抵押，并计划未来添加其他资产。\n\n`Maker (MKR)` 是 Maker 的治理代币，可以通过\
  \ Maker 提案（PIP）对平台更改进行投票。Maker 就是所知的去中心化自治组织（DAO）。\n\n\n\n\nMaker 将继续维护多抵押 Dai（Multi-Collateral\
  \ Dai）作为事实上的稳定币标准，而 SAI 将被淘汰并不再支持。为了保持简单，我们在后续章节中仅使用多抵押 Dai (`DAI`) 来演示示例。\n\n###\
  \ Maker 如何治理该系统？\n\n还记得我们提到过的去中心化自治组织（DAO）吗？这就是 Maker (`MKR`) 令牌发挥作用的地方。`MKR` 持者拥有与其拥有的\
  \ `MKR` 令牌数量比例对应的 `DAO` 投票权，并可以对 Maker 协议参数进行投票。\n\n投票的参数对于维护生态系统的健康至关重要，这有助于保持\
  \ `Dai` 锚定美元。我们将介绍 `Dai` 稳定币生态系统中你需要了解三个关键参数：\n\n### I. 抵押率\n抵押率决定了可以铸造 `Dai` 的数量。\n\
  \n* Ether (`ETH`) 抵押率 = 150%\n* Basic Attention Token (`BAT`) 抵押率 = 150%。本质上，150%\
  \ 的抵押率意味着为了铸造 100 美元，你必须存入至少价值 150 美元的 `ETH` 或 `BAT`。\n\n### II. 稳定性费用\n这等同于你在支付金库本金债务时需要支付的“利率”。截至\
  \ 2020 年 2 月，稳定性费用设置为 8%。\n\n### III. Dai 储蓄率 (DSR)\nDai 储蓄率 (`DSR`) 是对存放一段时间的 `Dai`\
  \ 支付的利息。它也作为一种影响 `Dai` 需求的货币工具。截至 2020 年 2 月，`DSR` 利率设置为 7.50%。\n\n## 发行 DAI 的动机\n\
  为什么要锁定更高价值的 `ETH` 或 `BAT` 仅为了发行价值较低的 `Dai` 呢？相反，你可以用美元出售你的资产。\n\n有三种可能的结果：\n\n1.\
  \ 你立即需要资金，并且拥有一项你认为未来会更值值的资产。在这种情况下，你可以将资产存储在 Maker 金库中，并通过铸造 `Dai` 立即获得资金。\n2.\
  \ 你立即需要现金，但不想冒通过出售资产来触发纳税事件的风险。你将通过发行 `Dai` 来获得贷款。\n3. 投资杠杆。如果你认为你的资产价值将会上涨，你就可以对你的资产使用投资杠杆。\n\
  \n## 获取 Dai (DAI) 的最佳方法是什么？\n\n获取 `Dai` (`DAI`) 有两种方法：\n\n### 1. 铸造 Dai\n使用当铺类比，我们将演示如何铸造\
  \ `DAI`。假设某天你需要 10,000 美元的现金，而你家里只有价值 15,000 美元的金条。与其把金条卖成现金，不如去当铺用你的金条作为抵押品借入 10,000\
  \ 美元，因为你认为金价未来会上涨。对于现金贷款，当铺提提供 8% 的利率给你 10,000 美元。为了完成交易，双方签署了一份合同协议。\n\n为了符合 `DAI`\
  \ 的叙述，让我们改变一下术语：\n\n* 金条 (`抵押品`) = `Ether` 或 `Basic Attention Token` (`抵押品` – `Multi-Collateral\
  \ Dai`)\n* 现金贷款 = `Dai` (`DAI`)\n* 当铺 = `Maker`\n* 合同协议 = `智能合约` (`金库`)\n* 贷款利 =\
  \ `稳定性费用`\n\n你将使用 Maker 平台并将你的 `Ether` (`ETH`) 或 `Basic Attention Token` (`BAT`)\
  \ 作为抵押品来铸造或“借入” `Dai`。当你贷款结束后想要赎回 `ETH` 或 `BAT` 时，你必须还清“贷款”和“贷款利”（即稳定性费用）。为了让你快速了解，让我们来看看如何铸造你自己的\
  \ `Dai`。\n\n通过在 Maker 平台 (`www.oasis.app`) 的金库中放入 `ETH` 或 `BAT`，你可以借入 `Dai`。假设 `ETH`\
  \ 目前价值 150 美元，你可以在金库中存入 1 个 `ETH`，并获得最多 100 个 `DAI`（100 美元），抵押率为 150%。\n\n你不应该提取允许的最额\
  \ 100 个 `DAI`，而是应该留出一些缓冲区以防 `ETH` 价格下跌。最好留出较大的差距，以确保你的抵押率始终大于 150%。这确保了如果 `ETH`\
  \ 价格下跌且你的抵押率跌至 150% 以下，你的金库不会被清算，你也不会被收取 13% 的清算罚金。\n\n### 2. 交易 DAI\n上述方法都是创建 `DAI`\
  \ 的方法。一旦创建了 `DAI`，就可以发送到任何地方。某些用户会将 `DAI` 转到加密货币交易所，你也可以从这些二级市场购买 `DAI` 而无需铸造。通过这种方式购买\
  \ `DAI` 更简单，因为你不需要锁定抵押品，也不担心抵押率或稳定性费用。\n\n## 为什么要使用 Maker？\n\n有很多稳定币可用，它们之间的主要区别在于协议。Maker\
  \ 与大多数稳定币平台不同，完全基于分布式账本。因此，Maker 具有区块链的特性：安全、不可篡改，而且最重要的是透明的。此外，Maker 的基础设施通过基于实时数据的全面风险协议和机制加强了系统的安全性。\n\
  \n## 十\n\n资金的贷款和借是金融行业提供的最常见服务之一，这是通过信用和抵押的概念实现的。可以认为，商业规模借贷的发明导致了文艺复兴时代，因为较不富的人能够获得创业资金，从而引发了一系列经济活动。结果，家庭可以通过抵押房屋来获得住房贷款，而如果用现金购买，费用将非常昂贵；而企业家可以通过抵押企业来获得建立公司所需的启动资金。另一方面，积累的财富可以作为资本贷出。然而，这种系统需要某种程度的信任和使用中介。这种系统减少了借款人卷走贷款资金的可能性。\n\
  \n\n\nCompound 中的利率以年化收益率（APY）表示，并根据资产的不同而异。Compound 使用考虑资产供需的算法为各种资产计算利率。\n\nCompound\
  \ 通过允许供应者/借款人直接与利率协议进行交互，而无需协商贷款条款（例如：期限、利率、交易对手、抵押品），从而减少了贷/借贷摩擦，产生了更高效的货币市场。\n\
  \n### 我将收到或支付多少的利息？\n\n年化收益率（APY）随资产而异，因为它是根据供需算法决定的。借贷需求越大，年化收益率（APY）越高，反之亦然。\n\
  \n贷款者 DAI 稳定币可以获得 7.58% 的收益（截至 2020 年 2 月），而借款人在一年后将支付 8.00% 的利率。\n\n使用 Compound\
  \ 需要创建账户吗？\n\n你不需要建立账户，这是去中心化金融（DeFi）应用的优势之一！Compound 用户不需要注册任何东西，与传统金融应用不同，后者需要经过复杂的注册程序才能开始。\n\
  \n任何拥有兼容加密货币钱包（如 Argent 或 Metamask）的人都可以立即使用 Compound。\n\n### 在 Compound 上开始赚利\n\
  \n要赚利息，你必须向协议提供资产。截至 2020 年 2 月，Compound 已接受七种不同代币。\n\n一旦你将资产存入 Compound，就会立即开始赚利息！利息在每个以太坊区块（平均\
  \ 13 秒）后计算一次，并根据你提供的金额进行计算。\n\n你在存款后将收到相应的 `cTokens`。如果你提供 `DAI`，你将获得 `cDAI`；如果你提供\
  \ `Ether`，你将获得 `cETH`，以此此类推。利息不会立即分配给用户，而是积累在你目前拥有的 `cTokens` 中，这些 `cTokens` 可以兑换为底层资产及其代表的利息。\n\
  \n#### cTokens？\n\n来看一个例子。假设你在 2019 年 1 月 1 日提供了 1,000 个 `DAI`，且整个 2019 年的 APY 始终保持在\
  \ 10.00%。\n\n在存入 1,000 个 `DAI` 后，你将在 2019 年 1 月 1 日获得 1,000 个 `cDAI`。此时，`DAI` 和\
  \ `cDAI` 之间的汇率为 1:1。\n\n一年后，你的 1,000 个 `cDAI` 在 2020 年 1 月 1 日的价值将增加 10%。`DAI` 和\
  \ `cDAI` 现在的汇率为 1:1.1。你的 1,000 个 `cDAI` 现在价值 1,100 个 `DAI`。\n\n为了计算利息，`cTokens`\
  \ 会随着时间的推移转换为不断增加的底层资产。由于 `cTokens` 是 `ERC-20` 代币，如果有人想接替你的供应者角色，你可以轻松转移供应资产的“所有权”。\n\
  \n### 在 Compound 上开始借贷\n\n首先，你必须将资产存系统作为贷款抵押。每种资产都有独特的抵押因子。提供的资产越多，借贷能力就越大。\n\n\
  借出的资产将直接交付到你的以太坊钱包，你可以像使用任何其他加密资产一样随意使用！请记住，借贷会产生 0.025% 的小额费用，以防止对 Compound 协议的垃圾邮件和滥用。\n\
  \n### 抵押资产的价格波动\n\n如果你要进行大交易。DEX（去中心化交易所）上的流动性池可以在多个平台汇总，增加任何特定平台的可用流动性。Kyber Network、Bancor\
  \ 和 Uniswap 都是基于流动池的 DEX 示例。本书将带你了解 Uniswap 示例。\n\n融资交易功能是 CEX（中心化交易所）提供的功能之一。融资交易允许投资者进行杠杆交易，增加个人的购买力并可能增加收益。DEX\
  \ 上的融资交易也取得了新进展。提供去中心化融资交易的 DEX 包括 `dYdX`、NUO Network 和 DDEX。本书将介绍 `dYdX`，它将去中心化借贷市场与其交易所上的融资交易整合在一起。\n\
  \n## UNISWAP\n\nUniswap 交易所是一个基于以太坊的去中心化代币交易系统，允许在没有中心化交易所的情况下直接切换代币。使用中心化交易所时，你必须存款代币、在订单簿上下单，并提取兑换后的代币。\n\
  \n你可以直接在 Uniswap 上从钱包交易代币，而无需经过上述三个过程。只需将代币从钱包发送到 Uniswap 的智能合约地址，你就会在钱包中收到选定的代币。这里没有订单簿，代币汇率通过算法设定。这一切通过使用流动性池和自动市场机制来实现。\n\
  \n### 流动性池\n\n流动性池是存储在 Uniswap 智能合约上的代币储备，用于交换代币。例如，利用流动性储备中拥有 100 ETH 和 20,000\
  \ DAI 的 ETH-DAI 交易对，想要使用 DAI 购买 ETH 的用户可以将 202.02 DAI 发送到 Uniswap 智能合约以换 1 个 ETH。交换后，流动性池将剩余\
  \ 99 ETH 和 20,202.02 DAI。\n\n\n\n流动性池储备由流动性提供者提供，他们被鼓励获得 0.3% 的 Uniswap 交易费用的等比例费用。该费用适用于\
  \ Uniswap 上的每次代币交换。\n\n这里没有限制，任何人都可以成为流动性提供者。截至 2020 年 2 月，已有超过 125,000 个 `ETH`\
  \ 被投入 Uniswap。流动性池维持的储备数量会显著影响自动做市商机制定价的方式。\n\n### 自动做市商机制\n\n自动做市商 (`AMM`) 算法用于计算池中资产的价格。`AMM`\
  \ 的运行机制是保持一个取决于池两侧流动性数量的恒定积。\n\n让我们继续 `ETH-DAI` 流动池的例子，假设有 100 个 `ETH` 和 20,000\
  \ 个 `DAI`。Uniswap 将结合这两个数字来计算恒定积。\n\n`ETH 流动性 (x) * DAI 流动性 (y) = 恒定积 (k)`\n\n`100\
  \ * 20,000 = 2,000,000`\n\n使用 `AMM`，恒定积 (`k`) 在任何时刻都必须为 `2,000,000`。当有人使用 `DAI`\
  \ 购买 `ETH` 时，`ETH` 从流动性池中取出，并加入 `DAI`。\n\n该 `ETH` 的价格将渐近地确定。收取的溢价越高，订单越大。“溢价”一词是指购买\
  \ 1 个 `ETH` 时，相对于原始价格 200 个 `DAI` 所需增加的 `DAI` 量。\n\n### 如何向 Uniswap 添加代币？\n\nUniswap\
  \ 是一个去中心化交易所；因此，与中心化交易所不同，它没有员工或门卫来评估和选择提供哪些货币。相反，只要特定交易对存在流动性，任何人可以在 Uniswap 上列表并交易任何\
  \ `ERC-20` 代币。用户只需与平台交互注册新代币，就会为该代币创建一个新市场。\n\n## DYDX\n\n`dYdX` 是一个去中心化交易所系统，支持借贷、借入和保证金/杠杆交易。它目前支持三种货币：`ETH`、`USDC`\
  \ 和 `DAI`。`dYdX` 协议通过将链外订单簿与链上结算相结合，承诺构建不受任何中央机构监管的高效、公平且去信任金融市场。\n\n初看，`dYdX` 与\
  \ `Compound` 类似，用户可以提供资产（贷）以赚利息，并在提交抵押后借入资产（借）。另一方面，`dYdX` 更进一步，包含了保证金和杠杆交易所，允许使用\
  \ `DAI` 或 `USDC` 进行高达 5 倍杠杆的 `ETH` 保证金交易。\n\n### 借贷\n\n如果你是加密货币所有者，希望从闲置的加密资产中获得被动收入，可以考虑将其借入\
