    \nE. Rajesh\n计算机科学与工程系\nGalgotias 大大学\n印度，格莱特诺伊德 (Greater Noida)\nrajrajesh16@gmail.com\n\
    \n摘要——每个学生都梦想在离开大学前拿到工作录取。招聘指标帮助学生了解自身状况以及应该做什么以确保良好的选择。招聘预测器是一种可以预测处于招聘过程的学生概率或表现的设备。此类程序的使用有助于未来年的学术准备。随着数据挖掘和机器学习的兴起，各种模型被广泛应用；本文针对工程专业大四级毕业生介绍了关于不同统计选择模型的文献综述。\n\
    \n预测，以便机构的招聘部门可以为当前学生建立招聘账户。\n\n沿着这些思路，关注不同的招聘预测框架非常重要。本文概述了各种招聘框架及其对学生的应用。\n\n\
    关键词——数据挖掘，逻辑回归，决策树，随机森林。\n\n## II. 文献综述\n\n### A. 使用逻辑回归进行预测\n\n根据统计数据，每年有 600万学生从计算机系毕业。对有技能和合格学生的需求日益增长。校内和校外招聘的人数巨大，但具备技能且合格的学生人数非常少。大学和工业界需要关注带给学生的真实知识的实际应用。招聘是学生生活中充分做好准备的最佳机会，而招聘预测器则帮助判断学生是否获得招聘。该系统还可以帮助识别学生需要参加招聘的领域。该系统使用学生的学术成绩、编码技能等详细信息。该系统使用往年的招聘统计数据和招聘失利等方面。\n\
    \n在模糊逻辑的帮助下，这种方法本质上是预测并将学生数据分解到定义的类别中，这对于公司分析海量学生数据集具有巨大的优势。\n\n```\nLogit(p)\
    \ = \\beta 0 + \\beta X1 + \\beta X2 + \\beta X3\n```\n\n其中成功的概率为“p”。\n\n本文中的方法\
    \ [3] 使用数据挖掘方法进行了详细阐述。创建“模糊逻辑和神经邻居”模型的方程是比该逻辑推理框架更合适的替代方案。“K 最近邻算法 (KNN)”是分类任务的典型近似，并根据分离步骤创建新案例。对效率和准确性的提高已通过可视化进行检查，并且在演示考试之前对每个模型进行了处理。\n\
    \nlogit 过程被称为机会（注：此处原文为 opportunity，可能为误用或指 logit 转换过程）：\n\n```\nLogit(p) = \\\
    log(p/p-1)\n```\n\n- 整体拟合：无效模型的可能性 - 2，当自主因素对结果影响很小时，LO 是导致产生估计的类别。\n- 回归参数：每个因素都与\
    \ $\\beta$ 系数相关。该系数衡量了逻辑系统中用于增加因子或独立变量的输入。添加的逻辑模型参数越多，产生的曲线越平滑。尺度范围在 0 到 1 之间。\n\
    - 最终处理：最后，数据进入来自学生在线测试的逻辑模型。\n\n使用算法来收集数据和制造所需的特征。通过 KNN 分析获得的一致性分别为 97.33% 和模糊逻辑下的\
