    pages 28-29


    # JOBS ROBOTS COULD DO


    Surgeon — robots will be able to do some operations.


    Teacher — people are already learning languages and other skills without humans
    teaching them, but humans will always be better at empathising with pupils and
    understanding what they need.


    Bus driver — driverless cars are already being developed and some trains have
    been travelling without a driver for a long time.


    Street cleaner — street cleaning vehicles are currently driven by people but might
    one day be programmed to run automatically.


    Shop assistant — robots can do simple shop assistant jobs but humans are better
    at giving opinions and answers to customer questions.


    Baker — some things, such as bread and cakes made in factories, are easily made
    by robots, but it’s harder for robots to make up beautiful decorations and designs
    unless a human programs them.


    Builder — robots will be able to put together whole houses from pre-made parts.'
