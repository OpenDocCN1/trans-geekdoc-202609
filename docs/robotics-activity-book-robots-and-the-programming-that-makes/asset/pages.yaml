- pgno: 29
  md: '# FUTURE ROBOT


    What jobs will the robots of the future do? Engineers have developed robots that
    can turn themselves into recycling when they have done their job, that can fool
    humans into thinking that they are talking to another human rather than a robot,
    and that can be powered and controlled by magnets rather than electricity. Exactly
    what the robots of the future could do is limited only by our human imaginations.


    But there are some jobs that humans will never want to hand over to robots such
    as the more creative jobs or ones that are not dangerous.


    Which of these jobs do you think could be done by a robot? Circle them in blue.
    Which of these jobs do you think humans will want to still do in the future? Circle
    them in red. Did you circle any of the jobs in both colours?? Perhaps humans and
    robots will both want to do the same jobs!


    +   - journalist

    - football player

    - surgeon

    - teacher


    +   - builder

    - bus driver

    - baker

    - actor


    +   - illustrator

    - hairdresser


    +   - shop assistant

    - street cleaner


