- pgno: 17
  md: '# CIRCUITS


    Robots are powered by electricity and when the power is switched on, electricity
    flows through wires so the robot can work. Electricity wires are arranged in a
    circuit. When the electric circuit is complete, electricity can flow through the
    wires and power the robot. If the circuit is not complete or is broken, the electricity
    cannot flow around the circuit and the robot won’t work.


    ![](img/6b00ad402c0b9205a84061eb58b93f81_17_0.png)


    ![](img/6b00ad402c0b9205a84061eb58b93f81_17_1.png)


    ![](img/6b00ad402c0b9205a84061eb58b93f81_17_2.png)


    ![](img/6b00ad402c0b9205a84061eb58b93f81_17_3.png)


    Electricity flows from the battery...


    ...continues in a circuit...


    ...and the electric circuit powers the light bulb!


    This switch is open and has broken the circuit, so the circuit can’t power the
    light bulb.


