- pgno: 4
  md: '# WHAT IS ROBOTICS?


    Robotics is the designing and building of robots by engineers to meet a need identified
    by someone such as a scientist or another engineer. Robots are powered machines
    with a particular job to do. Humans enter code into the robot’s program, which
    leads the robot to perform an action.


    # WHAT IS STEM?


    STEM stands for ‘science, technology, engineering and mathematics’. Engineers
    can use these four areas to come up with ways to design and build robots. Robots
    can also do jobs to help us investigate science more deeply by helping do the
    engineering jobs and mathematical calculations that are too difficult for one
    human mind!


    ![](img/6b00ad402c0b9205a84061eb58b93f81_4_0.png)'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# WHAT MAKES

    A ROBOT?


    A robot is a machine that works automatically, and that adapts to feedback – which
    means that it can tell when its job is done or if its surroundings have changed.


    Robots need four things:


    +   A JOB TO DO

    – most robots are designed to do just one job or one series of jobs


    +   SENSORS

    – some way to tell what is happening in its environment


    +   A ‘BODY’

    – to respond to what the sensors are telling it


    +   POWER

    – batteries, or plugged into an electricity source


    ![](img/6b00ad402c0b9205a84061eb58b93f81_5_0.png)'
  merge: -1
  img_proc: true
