- pgno: 7
  md: '# ROBOT DESIGN


    When designing a robot, engineers need to consider four things:


    ![](img/6b00ad402c0b9205a84061eb58b93f81_7_0.png)


    # IDEA


    The starting point: what job will the robot do?


    # MECHANICS


    This is the physical way the robot moves - if it will move, how?


    # ELECTRONICS


    The electronic parts of the robot and how they will be powered.


    ![](img/6b00ad402c0b9205a84061eb58b93f81_7_1.png)


    ![](img/6b00ad402c0b9205a84061eb58b93f81_7_2.png)


    # PROGRAMMING


    Programming the right instructions so the robot can do its job.


    ![](img/6b00ad402c0b9205a84061eb58b93f81_7_3.png)


    ![](img/6b00ad402c0b9205a84061eb58b93f81_7_4.png)'
