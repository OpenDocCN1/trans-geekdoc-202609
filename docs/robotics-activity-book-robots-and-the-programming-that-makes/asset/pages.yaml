- pgno: 27
  md: '# WRITING CODE


    Robots respond to code and engineers program robots by writing the code. The important
    thing to remember about writing code is that robots can only do what we program
    them to do. And they will only do things in the order the code has been written.
    So if you are writing code (or ‘instructions’) for a robot to bake a cake, it
    is a problem if the code tells the robot to put the cake tins into the oven before
    the mixture has been poured into the tins!


    ![](img/6b00ad402c0b9205a84061eb58b93f81_27_0.png)


    This robot needs to travel through this grid without stepping on a square that
    contains a banana skin. Write some code to lead the robot from start to finish
    without slipping up.

    Step 1: Use a pencil to draw a path through the grid that avoids the bananas.

    Step 2: Write a list of the steps the robot needs to take to be able to follow
