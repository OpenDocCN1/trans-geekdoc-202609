    \n英国图书馆目录数据。\n本书的目录记录可从英国图书馆获取。\n\nISBN 978-1-912909-07-0\n\n## 什么是机器人学？\n\n机器人学是工程师为了满足科学家或其他工程师等人员识别出的需求而设计和制造机器人的学科。机器人是拥有特定任务的动力机械。人类将代码输入机器人的程序中，从而引导机器人执行动作。\n\
    \n## 什么是 STEM？\n\nSTEM 代表“科学、技术、工程和数学”。工程师可以利用这四个领域想出设计和制造机器人的方法。机器人还可以通过帮助我们完成那些对于单一人类大脑而言过于困难的工程工作和数学计算，从而帮助我们更深入地研究科学！\n\
    \n![](img/6b00ad402c0b9205a84061eb58b93f81_4_0.png)\n\n## 机器人由什么构成？\n\n机器人是一种自动工作的机器，并且能够根据反馈进行适应——这意味着它能判断自己的任务是否完成，或者周围的环境是否发生了变化。\n\
    \n机器人需要以下四样东西：\n\n- 要做的**工作**\n  - 大多数机器人被设计用来做单一工作或一系列工作\n- **传感器**\n  - 某种方式用来感知其环境中正在发生什么\n\
    - **“身体”**\n  - 以响应传感器提供的信息\n- **动力**\n  - 电池，或连接到电源\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_5_0.png)\n\
    \n## 判断对错\n\n圈出关于机器人的正确陈述，并划掉错误的陈述。请在第 30 页核对你的答案。\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_6_0.png)\n\
    \n机器人可以下棋\n\n机器人总是由金属制成的\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_6_1.png)\n\
    \n![](img/6b00ad402c0b9205a84061eb58b93f81_6_2.png)\n\n机器人可以跳舞\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_6_3.png)\n\
    \n机器人被用于拆除炸弹\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_6_4.png)\n\n机器人有两条胳膊和两条腿\n\
    \n![](img/6b00ad402c0b9205a84061eb58b93f81_6_5.png)\n\n微型机器人可以在你的体内游走来治愈疾病\n\n\
    ## 机器人设计\n\n在设计机器人时，工程师需要考虑以下四件事：\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_7_0.png)\n\
    \n### 创意\n\n起点：机器人将执行什么工作？\n\n### 机械结构\n\n这是机器人移动的物理方式——如果它会移动，它是如何移动的？\n\n###\
    \ 电子系统\n\n机器人的电子部件及其供电方式。\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_7_1.png)\n\
    \n![](img/6b00ad402c0b9205a84061eb58b93f81_7_2.png)\n\n### 编程\n\n编写正确的指令，以便机器人能够完成其工作。\n\
    \n![](img/6b00ad402c0b9205a84061eb58b93f81_7_3.png)\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_7_4.png)\n\
