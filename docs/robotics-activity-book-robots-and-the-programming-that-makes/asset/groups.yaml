    \n![](img/6b00ad402c0b9205a84061eb58b93f81_18_7.png)\n\n## ROBOT MATERIALS\n\n\
    Robots can be made from all sorts of materials and engineers make sure they pick\
    \ the right material for the job. Different materials have different qualities,\
    \ which suit different needs of different robots. Because electricity can make\
    \ heat, it’s important that robot ‘bodies’ are heat and fire resistant. If a robot\
    \ will travel in water, its electronics will need to be kept in waterproof material.\
    \ If a robot is going to fly, it will need to be made of material that’s light.\n\
