    机器人可以由各种各样的材料制成，工程师会确保为任务选择合适的材料。不同的材料具有不同的特性，以适应不同机器人的不同需求。由于电能产生热量，机器人“身体”具备耐温和耐火性能非常重要。如果机器人需要在水中行驶，其电子元件需要使用防水材料。如果机器人要飞行，则需要使用轻便材料制造。


