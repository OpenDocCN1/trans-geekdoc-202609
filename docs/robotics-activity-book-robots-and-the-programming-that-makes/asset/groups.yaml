    # BUILD A ROBOT


    You can design a robot to do several jobs by building in the right hardware to
    do each part of the job. Robots don’t have to look like people but we often think
    they look friendlier if they do!


    ![](img/6b00ad402c0b9205a84061eb58b93f81_13_0.png)


    +   - oven attachment

    - cutlery fingers

    - kettle

    - spatula attachment

    - fridge

    - oven gloves

    - toaster

    - whisk attachment

    - jam squirter'
