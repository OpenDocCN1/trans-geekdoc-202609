    \ 创意\n- 轮子\n- 传感器\n- 电子\n- 动力\n- 反馈\n- 任务\n- 设计\n\n答案见第 30 页。\n\n## 机器人看起来像什么？\n\
    \n你可能认为机器人看起来有点像金属人——有脸、胳膊和腿。但机器人的外观根据它们执行的任务而多种多样。有些看起来像大盒子，而有些则像令人毛骨悚然的爬虫。工厂机器人通常不长得像其他任何东西——它们只是为了执行其特定工作部分而设计的机械装置。\n\
    \n![](img/6b00ad402c0b9205a84061eb58b93f81_9_0.png)\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_9_1.png)\n\
