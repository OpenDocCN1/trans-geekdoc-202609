    \n![](img/6b00ad402c0b9205a84061eb58b93f81_9_8.png)\n\n你想象中的机器人长什么样？在这里画出你的机器人！\n\
    \n需要考虑的事项：\n\n- 你的机器人将执行什么工作？\n- 它如何感知其环境？\n- 它将如何移动？\n- 它的身体会是什么样子？\n- 它的动力来源是什么？\n\
    \n## 机器人身体\n\n在设计机器人的外观时，工程师会考虑机器人将如何移动、它应该多大、它需要去哪里，以及它移动的速度和流畅度。有些机器人长得像人类，因为它们是设计用来做人类所做的工作，但工程师同样可能设计出长得像动物，或者像从未见过的任何东西的机器人！\n\
    \n## 工作\n\n帮助花朵授粉\n\n穿过狭窄的缝隙寻找地震幸存者\n\n为美国军队侦察危险\n\n在你的体内游走来递送药物\n\n携带包裹穿越难以通行的泥泞或雪地\n\
    \n![](img/6b00ad402c0b9205a84061eb58b93f81_11_0.png)\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_11_1.png)\n\
    \n![](img/6b00ad402c0b9205a84061eb58b93f81_11_2.png)\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_11_3.png)\n\
    \n![](img/6b00ad402c0b9205a84061eb58b93f81_11_4.png)\n\n将这些机器人与其执行的工作相匹配。\n\n\
    ## 机器人\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_12_0.png)\n\n6 毫米长\nMILI -\
    \ 一团硅胶\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_12_1.png)\n\nSPOT，机器狗\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_12_2.png)\n\
