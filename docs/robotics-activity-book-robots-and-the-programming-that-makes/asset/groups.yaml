    \ ✓ | ✓ | |\n| PLEXIGLASS | | | | ✓ | ✓ | ✓ | |\n| WOOD | | ✓ | | ✓ | | | |\n\
    | RUBBER | | ✓ | ✓ | | | | ✓ |\n| PLASTIC | ✓ | ✓ | | ✓ | | | |\n\n> There isn't\
    \ always one perfect material to use so robot designers might try a series of\
