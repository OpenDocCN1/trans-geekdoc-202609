    # WHAT DOES A ROBOT LOOK LIKE?


    You might think a robot looks a little like a metal human – with a face, arms
    and legs. But robots can look all sorts of different ways depending on the job
    they do. Some might look like big boxes while some look like creepy crawlies.
    Factory robots don’t usually look like anything else – they are just machinery
    designed to carry out their bit of work.


