    \n大狗\n\n这些都是真实的机器人，尽管其中一些仍在开发中。\n\n## 制造机器人\n\n你可以通过为工作的每个部分内置正确的硬件，来设计一个执行多种工作的机器人。机器人不一定要长得像人，但我们通常认为如果它们长得像人，会显得更友好！\n\
