    ## COGS AND LEVERS\n\nSome robots were invented even before electricity had been\
    \ discovered. Leonardo da Vinci designed a mechanical robot 500 years ago, which\
    \ could sit, stand, turn its head and move its arms. The science of creating movement\
    \ is called 'mechanics', and to make his robot move da Vinci used a combination\
    \ of simple mechanics like cogs and levers - the same sort of mechanics that help\
    \ a bicycle move.\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_21_0.png)\n\n> Levers\
    \ are like see-saws: if you press down at one end, the other end will move upwards.\
    \ If the fulcrum is in the middle of the lever, the lever balances when the weight\
    \ on each end is equal.  \n> If the fulcrum is closer to one end, you can move\
    \ a heavy weight by putting it on the shorter end and pushing down with less force\
    \ on the longer end.\n>\n> A cog is a wheel with teeth that fits into another\
    \ wheel with teeth - so when you turn one wheel, the wheel slotted into it will\
    \ also turn, but in the opposite direction. If two cogs working together are different\
    \ sizes, the smaller one turns more often than the bigger one. The slower turning\
    \ cog has more power than the smaller, faster one.\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_21_1.png)\n\
    \n![](img/6b00ad402c0b9205a84061eb58b93f81_22_0.png)\n\nMechanics can build machines\
    \ by making cogs and levers work together. Using what you know about cogs and\
    \ levers, work out which way each cog will turn and find out if the package at\
    \ the end will end up at A or B.\n\nThe arrows on the first two cogs have been\
    \ done for you.\n\nWire\nB\nA\n\n## WAREHOUSE WORK\n\nRobots can do very complicated\
    \ and precise work but even big jobs are made up of a combination of small jobs\
    \ in a particular order.\n\nTHIS ROBOT CAN DO FOUR SIMPLE JOBS:\n\n![](img/6b00ad402c0b9205a84061eb58b93f81_23_0.png)\n\
