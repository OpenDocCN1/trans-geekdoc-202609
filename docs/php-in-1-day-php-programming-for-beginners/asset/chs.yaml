  \ `queryDB()` 方法。完成后，将结果赋值给变量 `$result`。尝试自己实现这一点。\n\n接下来，我们需要检查 `$result['password']`\
  \ 是否被设置。只有当 `queryDB()` 中的 `fetch()` 方法成功获取到密码时，`$result['password']` 才会被设置。如果 SQL\
  \ 查询中不存在所述用户名的用户，`$result['password']` 将不会被设置。除了检查 `$result['password']` 是否被设置外，我们还需要检查用户输入的密码是否与从数据库获取的密码匹配。为了判断密码是否匹配，我们使用内置函数\
  \ `password_verify()`，它接受两个参数。\n\n```php\nif (isset($result['password']) && password_verify($pPassword,\
  \ $result['password'])) {\n    return true;\n} else {\n    return false;\n}\n```\n\
  \n将上述语句添加到 `isValidLogin()` 方法中，该方法就完成了。\n\n### getLatestPostID()\n\n太棒了！让我们继续 `getLatestPostID()`\
