  ## 6. 编辑 process 文件夹\n\nprocess 文件夹中的文件用于处理 HTML 表单。\n\n#### 1. p-index.php\n\n\
  我们将从 `p-index.php` 开始。这个文件用于处理 `index.php`，后者包含一个供成员登录以阅读“会员专属”文章的表单。`index.php`\
