  \n#### 13.6.5 p-read.php\n\n该文件用于处理 `read.php`，用于向读者显示文章。我们需要在 `p-read.php` 中实现两个核心功能：\n\
  \n首先，根据用户是否登录，我们需要显示不同的文章。如果用户已登录，我们显示所有文章。否则，我们只显示“Public”（公开）文章。\n\n接下来，如果用户已登录，我们需要显示“New”（新）文章。为了实现上述目标，打开\
  \ `p-read.php` 并执行以下操作：\n\n- 首先，声明一个名为 `$h` 的 `Helper` 对象。\n- 接下来，声明一个变量 `$update`\
  \ 并将其赋值为 `false`。\n- 最后但重要的是，声明一个变量 `$_SESSION['username']` 并检查它是否已设置。如果为，说明用户已登录。\n\
  \n结构所示：\n\n```php\nforeach ($posts as $result) {\n    $msgid = $result['id'];\n\
  \    $title = htmlspecialchars($result['title']);\n    $post = strip_tags($result['post'],\
  \ \"<strong><em><p><ol><<ul><<li>><a>\");\n    $username = htmlspecialchars($result['username']);\n\
  \    $postdate = htmlspecialchars($result['post_date']);\n    include \"output_code/messagecard.php\"\
  ;\n}\n```\n\n\n\n\n`strips$result['post']` 会移除除了我们想要的标签之外的所有 HTML 标签。明白了吗？很好！在将\
  \ `$result` 中的所有元素赋值给相应的变量后，我们使用 `include` 语句来引入 `messagecard.php` 文件。`messagecard.php`\
  \ 存储在 `output_code` 文件夹中，包含了显示上述变量值的代码。完成后，`foreach` 循环即结束。根据上述提供的代码和描述，请尝试自己完成第二个\
  \ `if-else` 语句。完成后，我们就可以进入最后一个 `if` 语句了。该语句检查 `$is_member` 是否为真。如果是的话，我们使用 `include`\
  \ 语句来引入 `logout.html` 文件。该文件存储在 `output_code` 文件夹中，包含带有注销链接的 HTML 代码。此外，我们使用一个嵌套\
  \ `if` 语句来检查 `$update` 是否为真。如果是的话，我们使用 `$reader` 对象调用 `BlogMember` 类中的 `updateLastViewedPost()`\
  \ 方法。尝试自己完成这个 `if` 语句。完成后，`pread.php` 文件就写完成了。\n\n太棒了！你已经完成了此项目中最难的文件；我们现在只需要处理一些收尾工作。\n\
  \n### 13.6.6 messagecard.php\n\n首先，我们需要在 `messagecard.php` 文件中添加一些代码。该文件位于 `output_code`\
  \ 文件夹内。如上所述，该文件包含了显示从“posts”表中检索的帖文的代码。当用户登录我们的博客时，我们需要在 `read.php` 中为用户上次登录后发布的帖子显示一个“New”（新）图标。由于帖文是使用\
  \ `messagecard.php` 文件显示的，因此我们需要对该文件进行一些修改。为此，请将 `messagecard.php` 中的注释 `//add PHP\
  \ code here` 替换为以下 `if` 语句：\n\n```php\n<?php\nif ($is_member and $lastPost < $msgid)\n\
  {\n    echo '<span class = \"new-post\">NEW</span>'; \n    $update = true;\n}\n\
  ?>\n```\n\n在这里，我们使用 `if` 语句检查用户是否登录。此外，我们检查 `$lastPost` 是否小于 `$msgid`。`$lastPost`\
  \ 存储用户上次查看的帖文 ID。我们通过调用 `pread.php` 中第一个 `if-else` 语句中的 `getLastViewedPost()` 方法获取该值。`$msgid`\
  \ 存储 `foreach` 循环中当前帖子的 ID。如果 `$lastPost` 小于当前帖子的 ID，我们就知道这是一篇新帖子。因此，我们使用 `echo`\
  \ 语句输出一个带有“NEW”字样的 `<span>` 标签。此外，我们将 `$update` 的值设置为 `true`。`$update` 用于指示我们是否需要调用\
  \ `updateLastViewedPost()` 方法（在 `pread.php` 的最后一个 `if` 语句中）。如果 `$update` 为真，我们就会调用该方法将“members”表中“last_viewed”列的值更新为“posts”表中的最新帖文\
  \ ID。明白了吗？如果你不确定 `updateLastViewedPost()` 方法是如何工作的，请参考 `BlogMember` 类（`BlogMember.php`）。在插入\
  \ `if` 语句后，我们需要将 `messagecard.php` 中的某些文本替换为 PHP 代码。具体而言，我们需要用 PHP 代码替换“post_title”、“user_name”、“post_date”和“post_text”：\n\
  \n```php\n<?php\necho $post_title;\necho $user_name;\necho $post_date;\necho $post_text;\n\
  ?>\n```\n\n## 13.7 Includes Folder\n\n我们现在准备好讨论剩余的文件。这些是 `header.html`、`debugging.php`\
  \ 和 `loadclasses.php`。\n\n\n\n\n将 `$_SERVER[\"DOCUMENT_ROOT\"] . \"/phpproject/includes/\"\
  ` 接到它。`$_SERVER['DOCUMENT_ROOT']` 是一个预定义变量，用于存储当前脚本执行的文档根目录。如果你正在使用 XAMPP，此根目录指向\
  \ `htdocs` 文件夹。当我们拼接 `$_SERVER['DOCUMENT_ROOT']` 和 `\"/phpproject/includes/\"` 时，我们就得到了一个指向\
  \ includes 文件夹的直接路径。\n\n如果你重命名了 `phpproject` 文件夹，你必须相应地修改分配给 `INC_DIR` 的路径。例如，如果你将文件夹重命名为\
  \ `myproject`，则你必须将 `$_SERVER[\"DOCUMENT_ROOT\"] . \"/myproject/includes/\"` 赋值给\
  \ `INC_DIR`。接下来，我们有两个 `include` 语句用于包含 `loadclasses.php` 和 `debugging.php`。如之前提到的，我们使用\
  \ `loadclasses.php` 来自动加载类，并使用 `debugging.php` 处理所有的错误和异常。稍后，我们必须在大多数用户界面文件中包含这两个文件。此时，`UI_include.php`\
  \ 文件已编写完成，我们准备好处理用户界面文件。\n\n### 13.8.2 用户界面文件\n\n第一个是 `error.html` 文件。该文件包含 HTML\
  \ 代码，用于在网站发生错误或异常时向用户显示自定义消息。它已经为你准备好了。接下来，我们有五个非常相似的文件：`admin.php`、`write.php`、`index.php`、`signup.php`\
  \ 和 `read.php`。\n\n每个文件中，我们需要添加 PHP 代码来实现以下操作：启动新会话（session）并包含 `UI_include.php`\
  \ 和 `header.html` 文件。此外，每个文件都包含一个由文件本身处理的 HTML 表单。为了处理表单，我们需要使用 `include` 语句将相关的处理文件添加到用户界面文件中。例如，为了处理\
  \ `admin.php` 中的表单，我们需要包含 `p-admin.php` 文件。上述操作已在 `admin.php` 中为你完成。参考 `admin.php`\
  \ 中的代码，尝试对 `write.php`、`index.php`、`signup.php` 和 `read.php` 执行相同的操作。在每种情况下，请注意必须在包含另外两个文件之前包含\
  \ `UI_include.php` 文件（因为我们需要在使用之前定义 `INC_DIR`）。此外，你需要相应地更改处理文件。明白吗？太好了！完成上述操作后，我们需要进行一些修改。对于\
  \ `signup.php`，不需要启动新会话，因为 `psignup.php` 没有使用任何会变量。因此，我们应该从 `signup.php` 中移除 `session_start()`语句。接下来，对于\
  \ `read.php`，由于 `p-read.php` 包含了显示输出的代码，我们不应该在文件开头包含它。相反，我们应该将其放在 `<body>...</body>`\
  \ 标签之间。最后，对于 `signup.php`、`admin.php`、`index.php` 和 `write.php`，我们需要将 HTML 代码中的文本“Error\
  \ Message Here”（不带引号）替换为存储在变量 `$msg` 中的实际错误消息。为了做到，我们使用下面的 PHP 代码：\n\n```php\n<?php\
  \ echo $msg; ?>\n```\n\n尝试自己完成上述所有修改。现在，我们还需要对 `index.php` 进行最后一次修改。如果你参考 `p-signup.php`，你会注意到在注册成功后引导用户进入\
  \ `index.php` 时我们添加了查询字符串 `new=1`，我们希望在 `index.php` 中利用这个查询字符串。为了实现这一点，在 `index.php`\
  \ 的 `<div class=\"form\">` 行之后添加以下代码：\n\n```html\n<div class = \"new\">\n<?php if\
  \ (isset($_GET['new'])) \necho 'CREATED SUCCESSFULLY'; ?>\n</div>\n```\n\n在这里，我们使用查询字符串在\
  \ `index.php` 中显示 `CREATED SUCCESSFULLY`。明白了吗？太好了！完成上述操作后，我们需要进行一些修改。对于最后一个用户界面文件\
  \ `logout.php`，由于 `logout.php` 的处理非常简单，我们需要在 `logout.php` 之前将 `index.php` 的逻辑完成。为了做到这一点，我们需要在\
  \ `logout.php` 中做几件事。首先，我们需要在会中恢复会话（使用 `session_start()`）并销毁所有会话（使用 `session_destroy()`）。接下来，我们需要包含\
  \ `UI_include.php` 和 `header.html` 文件。尝试自己完成上述操作。完成后，加载 `http://localhost/phpproject/logout.php`。在浏览器中，你会看到“Click\
  \ here to log in”。这不是错误。参考 `write.php` 并仔细研究代码，你会注意到我们在页面末尾添加了查询字符串 `admin=1`。这个查询字符串告诉我们退出的用户是管理员。如果是这样，我们希望在\
  \ `logout.php` 中显示第一个链接。相反，如果用户不是管理员（即没有查询字符串），我们希望显示第二个链接。尝试在 `logout.php` 中使用\
  \ `if-else` 语句来实现上述。你可以参考 `index.php` 获取有关使用查询字符串的帮助。完成后，`logout.php` 文件已完成。此时项目已几乎完成。事实上，如果你都完成得正确，可以加载\
  \ `http://localhost/phpproject/signup.php` 一切都会正常工作。尝试在第一个输入框中输入你的用户名并点击“提交”。你注意到什么？你会收到一条错误消息说“All\
  \ fields required”。注意到你在第一个输入框中输入的用户名消失了吗？我们项目的最后部分是在你的用户界面文件中添加 PHP 代码，以确保在处理表单出错时保持输入表单的值。还记得我们在\
  \ `Helper` 类中为此编写了一个名为 `keepValues()` 的方法吗？假设我们有一个名为 `$h` 的 `Helper` 对象，这里是使用该方法的方法：如果我们有一个名为\
  \ `tb` 的表单框，并将提交的 `tb` 值存储为 `$tb`，我们写入：\n\n```html\n<input type=\"text\" name=\"\
  tb\" <?php $h->keepValues($tb, 'textbox');?>\n```\n\n如果我们有一个名为 `ta` 的文本区域，并将提交的\
  \ `ta` 值存储为 `$ta`，我们写入：\n\n```html\n<textarea name = \"ta\"><?php $h->keepValues($ta,\
  \ 'textarea'); ?></textarea>\n```\n\n最后，如果我们有一个名为 `sl` 的下拉列表，其两个值属性为“1”和“2”，并将提交的\
  \ `sl` 值存储为 `$sl`，我们写入：\n\n```html\n<select name = \"sl\">\n<option value = '1'\
  \ <?php $h->keepValues($sl, 'select', '1'); ?>>1</option>\n<option value = '2' <?php\
  \ $h->keepValues($sl, 'select', '2'); ?>>2</option>\n</select>\n```\n\n\n\n\n\n\
  在我们的项目中，用于存储每个输入的变量名与输入字段的名称对应。例如，`$username` 存储名为“username”文本框的输入。根据上述描述，修改 `index.php`、`signup.php`、`admin.php`\
  \ 和 `write.php`，使得处理表单出错时，除密码外，所有输入的值都能被保留。明白了吗？\n\n完成上述操作后，我们需要对 `write.php` 进行一些额外更改。对于大多数页面，如果处理表单没有出错，网站将根据我们传递给\
  \ `header()` 函数的 URL 自动加载另一个页面。但 `write.php` 如此。对于此页面，管理员点击“提交”按钮后，无论数据是否成功提交到数据库，他都会留在当前页面。\n\
  \n我们希望修改 `write.php`，使得如果数据成功插入数据库，我们就清空表单，以便管理员编写新帖子。换句话说，如果数据插入成功，我们不希望调用 `keepValues()`\
  \ 方法。为了做到，我们需要使用在 `p-write.php` 中声明的变量 `$msg`。记得在将数据插入数据库后，我们将字符串 `'Message saved\
  \ successfully'` 赋值给 `$msg` 吗？我们可以使用这个字符串来决定是否需要调用 `keepValues()` 方法。\n\n下面的示例显示了如何对第一个输入字段（“标题”）进行操作。下划线代码显示了要使用的\
  \ `if` 条件。\n\n```php\n<input id = \"txttitle\" type=\"text\" name=\"title\" placeholder=\"\
  Enter Title\" autofocus <?php if ($msg != 'Message saved successfully') $h keepValues($title,\
  \ 'textbox'); ?>>\n```\n\n尝试对其他输入字段执行此操作。一旦完成，我们就完成了项目。恭喜你！你现在可以测试你的代码，看看一切是否按预期工作了。\n\
  \n## 13.9 运行代码\n\n在运行代码之前，我们需要对 `php.ini` 进行一些更改。按照第 2.1 节的说明找到 `php.ini` 并在 Brackets\
  \ 中打开它。滚动到页面底部并添加以下行（如果你在之前的章节中尚未执行）：\n\n```ini\nerror_reporting=E_ALL\ndisplay_errors=On\n\
  date.timezone=America/New_York\n```\n\n接下来，我们想在 `php.ini` 中再添加一行。具体来说，我们想添加一行来预置\
  \ `debugging.php`。预置文件意味着指定让 PHP 在处理任何其他 PHP 脚本之前处理此文件。之前，我们在 `UI_include.php` 中使用\
  \ `include` 语句将 `debugging.php` 添加到 PHP 脚本中。这对于大多数错误都有效。但如果包含 `debugging.php` 的文件存在语法错误，它将不起。如果你希望即使存在语法错误\
  \ `debugging.php` 也能工作，你就需要预置该文件。这样做，在 `php.ini` 中添加行 `auto_prepend_file=\"DOCUMENT_ROOT>/phpproject/includes/debugging.php\"\
  `，其中 `<DOCUMENT_ROOT>` 指你 htdocs 文件夹的实际路径。要找到此路径，在浏览器中加载 `http://localhost/dashboard/phpinfo.php`\
  \ 并搜索“DOCUMENT_ROOT”（不带引号）。你会看到旁边列出的路径。你需要将 `<DOCUMENT_ROOT>` 替换为列出的路径。例如，如果路径是\
  \ `/opt/lampp/htdocs`，该行应该是 `auto_prepend_file=\"/opt/lampp/htdocs/phpproject/includes/debugging.php\"\
  `。由于书籍宽度限制，上面的代码在书中可能显示为两行。不要将其分成两行，它应该在 `php.ini` 中写为单行。\n\n在预置 `debugging.php`\
  \ 后，如果你使用的是 PHP 7.2 及以上版本，还应该关闭 `track_errors`。`track_errors` 是 PHP 的内置功能，自 PHP\
  \ 7.2 起已弃用。然而，该功能默认设置为“开启”。在某些服务器上，开启可能会导致“Directive ‘track_errors’ is deprecated\
  \ found on line 0 in file Unknown”的警告。要关闭它，只需在 `php.ini` 底部添加 `track_errors=Off`\
  \ 即可。你现在可以保存文件并重启 Apache。\n\n接下来，进入 `UI_include.php` 并注释掉 `debugging.php` 的 `include`\
  \ 语句。由于我们已经预置了该文件，不应再次包含它。然后，在浏览器中启动 `http://localhost/phpproject/signup.php` 并注册两个新账户。\n\
  \n一切运行正常吗？如果是，恭喜你！给自己鼓个掌。如果没有，没关系。弄清楚哪里错了是编程的很大一部分。对我来说，这正是学习最多的地方。如果某些功能无法运行，你可能会收到错误消息。尝试使用错误消息中提供的行号和文件名来找出问题所在。或者，你可以使用\
  \ `echo` 语句来确定代码的哪些部分有效。例如，如果你在代码的第 10 行添加了 `echo` 语句但没有看到输出，你就知道在第 10 行之前可能出了问题。同样，如果你在\
  \ `if` 块中添加了 `echo` 语句但没有看到输出，你就知道 `if` 块没有执行。\n\n尝试自己寻找错误。如果你真的无法解决问题，可以检查 `phpproject-complete`\
  \ 文件夹中的解决方案，并将代码与你的代码进行比较。将解决方案中你怀疑可能导致错误的函数复制并粘贴到你的解决方案中，然后重新运行代码看看是否正常工作。仔细研究解决方案以真正理解它是如何运行的。\n\
  \n明白了吗？一旦你成功找到 bug 并能够成功注册两个账户，就可以将其中一个转换为管理员账户。要这样做，访问 `http://localhost/phpmyadmin/`\
  \ 并点击“project”数据库。点击 SQL 标签并运行以下 SQL 语句，将 `YOUR_ADMIN_USERNAME` 替换为你想转换为管理员用户的用户名：\n\
  \n```sql\nUPDATE members SET is_admin = 1 WHERE username = 'YOUR_ADMIN_USERNAME';\n\
  ```\n\n完成后，你就可以使用管理员账户发布博客了。要这样做，访问 `http://localhost/phpproject/admin.php` 并以管理员身份登录。尝试为博客添加一些帖子。一切运行正常吗？发布后，你可以访问\
  \ `http://localhost/phpproject/index.php` 以成员身份登录（使用任一账户）来阅读帖子。或者，你可以直接访问 `http://localhost/phpproject/read.php`\
  \ 在无需登录的情况下阅读“公共”帖子。玩玩这个网站，看看一切是否按预期工作。如果某些地方不起作用，尝试进行调试。只要有坚持，你一定能找到错误并在过程中学到很多。玩得开心！\n\
  \n结束\n\n"
