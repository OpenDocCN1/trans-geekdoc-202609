  \ `queryDB()` 方法，将结果赋值给变量 `$result`。如果 `posts` 表中没有数据，该语句将返回 `NULL`。因此，我们首先检查 `$result['max']`\
  \ 是否被设置。如果是，返回其值。否则，返回 `0`。\n\n### updateLastViewedPost()\n\n`updateLastViewedPost()`\
