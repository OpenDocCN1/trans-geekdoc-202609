  \n这将输出 `7`。\n\n## 5 PHP 中的运算符\n\nPHP 带有许多可以与变量使用的运算符。让我们先讨论赋值运算符。\n\n1. 赋值运算符\n\n\
  4.5.2 算术运算符\n\n接下来，让我们讨论算术运算符。这些运算符用于执行基础算术运算。它们包括加法（`+`）、减法（`-`）、乘法（`*`）、除法（`/`）、取模（`%`）和幂（`**`）运算符。假设你有\n\
  \n```php\n$x = 5;\n$y = 2;\n```\n\n`$x + $y` 得到 `7`，`$x - $y` 得到 `3`，`$x*$y` 得到\
  \ `10`，`$x/$y` 得到 `2.5`，`$x%$y` 得到 `1`，因为取模运算符给出 `5` 除以 `2` 的余数，而 `$x**$y` 得到 `25`。\n\
  \n\n\n\n我们得到 25，因为幂运算符给了我们 5 的 2 次方的值。\n\n### 4.5.3 复合赋值运算符\n除了上述的算术运算符外，我们还有一组将算术运算与赋值结合的运算符。假设你有一个变量\
  \ `$x = 5;`，并且你想给 `$x` 加 3，你可以这样操作：\n\n```php\n$x = $x + 3;\n```\n\n赋值总是从右向左进行的。因此，右侧的表达式（`$x\
  \ + 3`）首先被求值，得到 `5+3`。然后这个值被赋值回左侧的变量 `$x`。换句话说，`$x` 的值变成了 8。\n\n除了 `$x = $x + 3;`\
  \ 之外，我们还可以使用 `+=` 运算符。该运算符是赋值运算符与加法运算符的简写。如果你写：\n\n```php\n$x = 5;\n$x += 3;\necho\
  \ $x;\n```\n你将得到输出 8。`$x += 3` 仅仅意味着 `$x = $x + 3`。\n\n除了 `+=` 运算符，我们还有 `-=` 运算符，它将\
  \ `-` 运算符与赋值运算符结合。同样适用于上一节中提到的所有算术运算符。因此，`$x -= 4` 等同于 `$x = $x - 4`，`$x *= 2` 等同于\
  \ `$x = $x*2`，依此类推。\n\n### 4.5.4 增减运算符\n最后但同样重要的是，让我们来谈谈增（`++`）和减（--`）运算符。这些运算符将变量的值加减\
  \ 1 并返回新值。让我们尝试一些代码（添加行号以便参考）。\n\n```php\n1 $q = 3;\n2 echo \"<BR>$q<BR>\";\n3 echo\
  \ ++$q;\n```\n\n如果你运行上面的代码，将得到以下输出：\n```\n3\n4\n```\n\n第 2 行使用 `echo` 语句输出 `$q`\
  \ 的原始值。第 3 行执行了以下操作：\n1. 将 `$q` 的值加 1\n2. 输出 `$q` 的新值\n\n因此，我们得到了输出 4。`++` 运算符被称为递增运算符。它可以放置在变量名的之前（称为前递增）或之后（后递增）。尝试将上面的第\
  \ 3 行改为 `echo $q++;` 并重新运行代码，你将得到\n\n```\n3\n3\n```\n这次的输出是这个。感到惊讶吗？这是因为第 3 行现在执行的是以下操作：\n\
  1. 输出 `$q` 的原始值。\n2. 将 `$q` 的值加 1\n\n换句话说，这两个任务（递增和输出）的执行顺序反过来了。递增是在 `echo` 语句执行后完成的（因此后递增）。为了证明\
  \ `$q` 确实增加了，你可以在第 3 行之后再次 `echo` 它的值。这次你会得到输出 4。明白了吗？\n\n除了递增运算符，我们还有递减运算符（`--`）。该运算符由两个减号组成，并将变量的值减\
  \ 1。它也可以作为前递减或后递减运算符使用。\n\n# 第 5 章：PHP 更多数据类型\n在上一章中，我们查看了 PHP 的一些基本数据类型。在本章中，我们将讨论另外两种数据类型——字符串和数组。你可以创建一个名为\
  \ `chap5.php` 的文件来测试本章中的示例。\n\n## 5.1 字符串\n字符串指的是一段文本。在 PHP 中，字符串必须包含在单引号或双引号中。例如，如果我们写：\n\
  \n```php\n$msg = 'Hello';\n$greeting = \"Good Morning\";\n$emptyStr = \"\";\n```\n\
  \n`$msg` 和 `$greeting` 分别存储字符串 'Hello' 和 \"Good Morning\"。而 `$emptyStr` 存储一个双引号内的空字符串。\n\
  \n在 PHP 中，你可以使用连接运算符（`.`）组合多个字符串。让我们看这个例子：\n\n```php\n$areacode = \"(28)\";\n$contact\
  \ = '+1' . $areacode . '23456';\necho $contact;\n```\n在这里，我们两次使用连接运算符将字符串 '+1'、变量\
  \ `$areacode` 和字符串 '23456' 组合在一起。我在连接运算符前后添加了空格，以便你可以清楚地看到这三个部分；不需要添加这些空格。连接后，我们将新字符串赋值给变量\
  \ `$contact` 并使用 `echo` 语句输出它的值。如果你运行上面的代码，将得到\n\n```\n+1(28)23456\n```\n输出。\n\n\
  ### 5.1.1 常用的字符串函数\n接下来，让我们讨论 PHP 中常用的字符串函数。PHP 带有许多用于处理字符串的内置函数。大多数函数在执行任务后返回结果。我们可以将结果赋值给变量，或使用\
  \ `echo` 语句直接显示。某些函数允许我们提供参数来修改函数的行为。下面的示例讨论了最常用的函数。\n\n#### `strlen()`\n`strlen()`\
  \ 函数返回字符串的长度。示例：\n```php\n$str1 = 'Good Day!';\necho strlen($str1);\n```\n输出：`9`\n\
  在这里，我们定义变量 `$str1`并将字符串 'Good Day!' 赋值给它。接下来，我们将 `$str1` 传递给 `strlen()` 并使用 `echo`\
  \ 语句显示结果。我们得到输出 9，因为 4 ('Good') + 1 (' ') + 3 ('Day') + 1 ('!') = 9。\n\n#### `strtolower()`,\
  \ `strtoupper()`\n`strtolower()` 和 `strtoupper()` 函数分别将字符串转换为小写和大写，并返回新字符串。原始字符串没有改变。示例：\n\
  ```php\n$str2 = 'Hello World';\n$str3 = strtolower($str2);\n$str4 = strtoupper($str2);\n\
  echo '<BR>'.$str2;\necho '<BR>'.$str3;\necho '<BR>'.$str4;\n```\n在这里，我们定义变量 `$str2`并将字符串\
  \ 'Hello World' 赋值给它。接下来，我们将 `$str2` 传递给 `strtolower()` 和 `strtoupper()`，并将结果赋值给\
  \ `$str3` 和 `$str4`。最后，我们使用三个 `echo` 语句输出 `$str2`、 `$str3` 和 `$str4` 的值。在每种情况下，我们都与变量连接了\
  \ `<BR>`，以便输出从新行开始。如果你运行上面的代码，将得到\n\n```\nHello World\nhello world\nHELLO WORLD\n\
  ```\n\n#### `trim()`\n`trim()` 函数默认从字符串的开头端移除空格。你可以通过传递第二个参数指定要移除的字符。示例 1：\n```php\n\
  $str5 = ' is ';\necho 'PHP'.$str5.'Fun';\necho 'PHP'.trim($str5).'Fun';\n```\n输出：\n\
  ```\nPHP is Fun\nPHPFun\n```\n在这里，我们首先将 `$str5` 与字符串 'PHP' 和 'Fun' 连接，并使用 `echo`\
  \ 语句输出生成的字符串。我们得到输出 \"PHP is Fun\"。接下来，我们使用 `trim()` 函数移除 `$str5` 中的空格，并再次与 'PHP'\
  \ 和 'Fun' 组合。我们得到输出 \"PHPFun\"。\n\n示例 2：\n```php\n$str6 = '\\*\\*Hello\\*\\*World\\\
  *\\*';\necho trim($str6, '\\*');\n```\n输出：`Hello**World`\n在这里，我们将 `'\\'` 作为第二个参数传递给\
  \ `trim()` 函数。结果是从 `$str6` 的开头和结尾移除了星号（而不是空格），我们得到输出 \"Hello**World\"。\n\n#### `substr()`\n\
  `substr()` 函数返回一个子串。要使用此函数，我们需要向它传递两个参数——提取子串的字符串以及开始提取的位置。我们还可以传递第三个参数来指定要提取的子串长度。如果不提供此参数，函数将从指定的起始位置提取到字符串末尾的子串。字符串中的位置从\
  \ 0 开始，而不是 1。例如，如果我们有一个字符串 'ABCDEF'，'A' 在位置 0，'B' 在位置 1，依此类推。位置也可以是负数。如果是负数，则从字符串末尾计数。在\
  \ 'ABCDEF' 中，'F' 在位置 -1，'E' 在位置 -2 等。示例：\n```php\n$str7 = 'ABCDEF';\necho substr($str7,\
  \ 2);\necho substr($str7, -3);\necho substr($str7, 2, 1);\n```\n输出：\n```\nCDEF\n\
  DEF\nC\n```\n\n\n\n\n# PHP 中的字符串函数\n\n在这里，我们声明了一个名为 `$str7` 的变量，并将其字符串 `'ABCDEF'`\
  \ 赋值给它。接下来，我们三次将 `$str7` 传递给 `substr()` 以提取不同的子字符串。在前两个示例中，`substr()` 函数分别从位置 2\
  \ 和 -3 开始（并包含该位置）提取子字符串。因此，我们得到了“CDEF”和“DEF”作为输出。\n\n在第三个示例中，我们通过向 `substr()` 传递第三个可选参数来指定子字符串的长度。由于我们指定的长度为\
  \ 1，因此我们得到了“C”作为输出。明白了吗？我们已经涵盖了 PHP 中的几个字符串函数。要查看所有可用字符串函数的完整列表，你可以访问页面 https://www.php.net/manual/en/ref.strings.php\
  \ 。\n\n## 2. 使用字符串表示日期\n\n接下来，让我们学习使用字符串来表示日期。为了实现这一点，我们使用名为 `strtotime()` 的内置函数。\n\
  \n### 2.1 `strtotime()` 函数\n\n如名所示，`strtotime()` 函数将字符串转换为时间。它接受一个描述特定日期（和时间）的字符串，并尝试将其转换为时间戳。如果你传递给函数一个无法转换的字符串，它将返回\
  \ `false`。另一方面，如果你传递一个它能够转换的字符串，它将解析该字符串并返回 UNIX 时间戳。UNIX 时间戳是一个整数，表示自 1970 年 1\
  \ 月 1 日 00:00:00 UTC 以来的秒数。\n\n例如，如果你运行语句：\n\n```\necho strtotime(\"next Monday\"\
  );\n```\n\n你将得到类似 `1587340800` 的结果。这提供了下周一（撰本文时）的 UNIX 时间戳。`strtotime()` 函数非常智能，能够将各种英语文本日期描述转换为\
  \ UNIX 时间戳。例如，它转换如 `\"now\"`、`\"tomorrow\"`、`\"next Monday\"`、`\"15 Nov 2019\"`\
  \ 或 `\"+1 week\"` 等字符串没有问题。虽然该函数很容易，但你可能会同意，它返回的时间戳在大多数情况下并不实用。如果你想为日期或时间获取更有意义的格式，可以使用另一个名为\
  \ `date()` 的内置函数。\n\n### 2.2 `date()` 函数\n\n`date()` 函数接受一个可选的时间戳，并将时间戳格式化为更易读的字符串。如果没有提供时间戳，它将格式化当前时间戳。假设我们想格式化当前时间之后\
  \ 10 小时的时间戳，可以使用下面的语句：\n\n```\necho date('d-M-Y', strtotime(\"+ 10 hours\"));\n\
  ```\n\n在这里，我们向函数传递了两个参数。第一个参数指定了我们希望如何格式化时间戳。为了这一点，我们使用一个由标点符号和预定义字符组成的字符串（定义见 https://www.php.net/manual/en/function.date.php）。在我们的示例中，我们使用了字符串\
  \ `'d-M-Y'`。字符 `‘d’` 表示我们希望日期以两位数字的形式表示，必要时使用前导零（例如，3 会输出为 03）。字符 `‘M’` 和 `‘Y’`\
  \ 表示我们希望月份和年份分别用三个字母文本（例如 Jan）和四位数字表示。最后，标点符号 `‘-’` 表示我们希望用连字符分隔日、月、年。在指定了所需的格式后，我们向\
  \ `date()` 函数传递了第二个参数 `strtotime(\"+ 10 hours\")`。该参数是可选的，指定了我们希望函数格式化的日期。如果你运行上面的\
  \ `echo` 语句，你将得到类似 `03-Apr-2020` 的输出。\n\n这提供了现在（撰本文时）之后 10 小时的日期。明白了吗？\n\n### 2.3\
  \ 设置时区\n\n上面的小节讨论了 PHP 中许多内置日期/时间函数中的两个。虽然大多数这些函数都很容易使用，但请注意，它们的结果受到我们 PHP 服务器中设置的时区的影响。例如，虽然\n\
  \n```\necho date('d-M-Y', strtotime(\"+ 10 hours\"));\n```\n\n在一个时区中带给我们给出 `03-Apr-2020`，但在另一个时区，它可能会给出\
  \ `04-Apr-2020`。为了避免结果出现任何差异，强烈建议你在你的 PHP 服务器中手动设置时区。\n\n\n\n\n\n\"second array\"\
  \ => array(3, 5, 1, 8, 9), \"third array\" => array(1, 0, 9, 4, 7)\n\n`$assocMDArr[\"\
  first array\"]` 存储了 `array(1, 2, 6, 1, 3)`。如果我们写：\n\n```php\necho $assocMDArr[\"\
  first array\"][2];\n```\n\n我们将得到 `$assocMDArr[\"first array\"]` 中的第 3 个元素。换句话说，我们将得到输出\
  \ 6。\n\n### 示例 7\n最后但同样重要是，我们可以使用关联数组来存储关联数组。`$anotherAssocMDArr = array(\n\"first\
  \ player\" => array(\"name\" => 'John', \"age\" => 25),\n\"second player\" => array(\"\
  name\" => 'Tim', \"age\" => 35)\n); 在上面的示例中，`$anotherAssocMDArr[\"first player\"\
  ]` 存储了 `array(\"name\" => 'John', \"age\" => 25)`。如果我们写：\n\n```php\necho $anotherAssocMDArr[\"\
  first player\"][\"age\"];\n```\n\n我们将得到输出 25。\n\n### 5.3.2 显示数组的内容\n接下来，让我们学习两种显示数组内容的方便方法。一种方法是使用上一节介绍的\
  \ `var_dump()` 函数。该函数显示变量的类型类型和值。如果我们写：\n\n```php\n$myArray = array(2, 5.1, 'PHP',\
  \ 105);\nvar_dump($myArray);\n```\n\n我们将得到：\n\n```\narray(4) { [0]=> int(2) [1]=>\
  \ float(5.1) [2]=> string(3) \"PHP\" [3]=> int(105) }\n```\n作为输出。\n\n`array(4)`\
  \ 表示 `$myArray` 是一个包含 4 个元素的数组。紧随的大括号内的文本指示每个元素的数据类型和值。例如，`[0] => int(2)` 告诉我们索引为\
  \ 0 的元素是一个值为 2 的整数，`[1] => float(5.1)` 告诉我们索引为 1 的元素是一个值为 5.1 的浮点数，依此类推。接下来，我们有\
  \ `print_r()` 函数。该函数与 `var_dump()` 函数类似。然而，它的输出更简洁，因为它没有给出每个元素的数据类型。例如，`print_r($myArray);`\n\
  \n给了我们以下输出：\n\n```\nArray ( [0] => 2 [1] => 5.1 [2] => PHP [3] => 105 )\n```\n\n\
  ### 5.3.3 向数组添加元素\n创建数组后，我们可以向其中添加新元素。有几种方法可以实现。最简单的是使用方括号符号。这种符号允许我们一次向数组添加一个元素。\n\
  \n#### 示例 1\n```php\n$addDemo = array(1, 5, 3, 9);\n$addDemo[] = 7;\n```\n\n在上面的示例中，我们向\
  \ `$addDemo` 添加了 7。数组变成了 `(1, 5, 3, 9, 7)`。\n\n#### 示例 2\n```php\n$addDemoAssoc\
  \ = array('Peter'=>20, 'Jane'=>15);\n$addDemoAssoc['James'] = 17;\n```\n\n在这里，我们向\
  \ `$addDemoAssoc` 添加了 `'James'=>17`。数组变成了 `('Peter'=>20, 'Jane'=>15, 'James'=>17)`。\n\
  \n### 5.3.4 从数组删除元素\n除了向数组添加元素外，我们还可以从中删除元素。一种方法是使用 `array_splice()` 函数。要使用此函数，我们需要向它传递两个参数\
  \ - 要从中删除元素的数组以及开始删除元素的位置。我们还可以传递第三个参数来指定要删除的元素数量。如果不提供此参数，函数将删除从指定起始位置到数组结束的所有元素。让我们来看一些示例。\n\
  \n#### 示例 1\n```php\n$colors = array(\"red\", \"black\", \"pink\", \"white\");\n\
  array_splice($colors, 2);\n```\n在这里，我们指示让 `array_splice()` 从 `$colors` 中删除所有元素，从位置\
  \ 2 的元素（包括该元素）开始。`$colors` 变成了 `(\"red\", \"black\")`。\n\n#### 示例 2\n```php\n$awardwinners\
  \ = array(\"Gold\"=>\"Max\", \"Silver\"=>\"Boots\", \"Bronze\"=>\"Dora\");\narray_splice($awardwinners,\
  \ 1);\n```\n在这里，我们想要 `array_splice()` 从 `$awardwinners` 中删除所有元素，从位置 1（包括该元素）开始。`$awardwinners`\
  \ 变成了 `(\"Gold\"=>\"Max\")`。\n\n#### 示例 3\n```php\n$pets = array(\"corgi\", \"poodle\"\
  , \"golden retriever\", \"jack russell\");\narray_splice($pets, 1, 2);\n```\n在这里，我们想要从\
  \ `$pets` 中删除 2 个元素，从位置 1（包括该元素）开始。`$pets` 变成了 `(\"corgi\", \"jack russell\")`。\n\
  \n### 5.3.5 PHP 中常用的数组函数\n我们在前面的节中涵盖了几个数组概念。在结束本节之前，让我们来看一些 PHP 中常用的数组函数。\n\n####\
  \ count()\n第一个是 `count()` 函数。该函数接受一个数组并返回数组中的个数。\n\n#### 示例：\n```php\n$countDemo\
  \ = array(1, 4, 5, 1, 2);\necho count($countDemo);\n```\n输出：\n`5`\n\n#### array_search()\n\
  接下来是 `array_search()` 函数。该函数在数组中搜索特定值。如果找到了该值，函数返回其索引或键；否则，它返回 `false`。如果找到了多个实例，则返回第一个匹配值的索引或键。\n\
  \n#### 示例：\n```php\n$indexArrDemo = array(11, 4, 5, 1, 2, 5, 6);\n$assocArrDemo\
  \ = array('A'=>12, 'B'=>5, 'C'=>20);\necho array_search(5, $indexArrDemo);\necho\
  \ array_search(20, $assocArrDemo);\nvar_dump(array_search('B', $assocArrDemo));\n\
  ```\n输出：\n`2`\n`C`\n`bool(false)`\n在第一个 echo 语句中，我们使用 `array_search()` 函数在 `$indexArrDemo`\
  \ 中搜索 5。虽然有两个 5 的实例，但只返回第一个匹配值的索引。在第二个 echo 语句中，我们使用 `array_search()` 在 `$assocArrDemo`\
  \ 中搜索 20。我们得到了 `C`。\n\n#### print_r()\n`print_r()` 函数与 `var_dump()` 函数类似。然而，它的输出更简洁，因为它没有给出每个元素的数据类型。例如，`print_r($myArray);`\n\
  \n给了我们以下输出：\n\n```\nArray ( [0] => 2 [1] => 5.1 [2] => PHP [3] => 105 )\n```\n\n\
  #### array_merge()\n最后，我们有 `array_merge()` 函数。该函数合并两个多个数组并返回合并后的数组。\n\n#### 示例 1：\n\
  ```php\n$countDemo = array(1, 4, 5, 1, 2);\necho count($countDemo);\n```\n输出：\n\
  `5`\n\n#### 示例 2：\n```php\n$addDemo = array(1, 5, 3, 9);\n$addDemo[] = 7;\n```\n\
  在上面的示例中，我们向 `$addDemo` 添加了 7。数组变成了 `(1, 5, 3, 9, 7)`。\n\n#### 示例 3：\n```php\n$addDemoAssoc\
  \ = array('Peter'=>20, 'Jane'=>15);\n$addDemoAssoc['James'] = 17;\n```\n在这里，我们向\
  \ `$addDemoAssoc` 添加了 `'James'=>17`。数组变成了 `('Peter'=>20, 'Jane'=>15, 'James'=>17)`。\n\
  \n#### 示例 4：\n```php\n$colors = array(\"red\", \"black\", \"pink\", \"white\");\n\
  array_splice($colors, 2);\n```\n在这里，我们指示让 `array_splice()` 从 `$colors` 中删除所有元素，从位置\
  \ 2 的元素（包括该元素）开始。`$colors` 变成了 `(\"red\", \"black\")`。\n\n#### 示例 5：\n```php\n$awardwinners\
  \ = array(\"Gold\"=>\"Max\", \"Silver\"=>\"Boots\", \"Bronze\"=>\"Dora\");\narray_splice($awardwinners,\
  \ 1);\n```\n在这里，我们想要 `array_splice()` 从 `$awardwinners` 中删除所有元素，从位置 1（包括该元素）开始。`$awardwinners`\
  \ 变成了 `(\"Gold\"=>\"Max\")`。\n\n#### 示例 6：\n```php\n$pets = array(\"corgi\", \"\
  poodle\", \"golden retriever\", \"jack russell\");\narray_splice($pets, 1, 2);\n\
  ```\n在这里，我们想要从 `$pets` 中删除 2 个元素，从位置 1（包括该元素）开始。`$pets` 变成了 `(\"corgi\", \"jack\
  \ russell\")`。\n\n#### 示例 7：\n```php\n$anotherAssocMDArr = array(\n\"first player\"\
  \ => array(\"name\" => 'John', \"age\" => 25),\n\"second player\" => array(\"name\"\
  \ => 'Tim', \"age\" => 35)\n);\n```\n在上面的示例中，`$anotherAssocMDArr[\"first player\"\
  ]` 存储了 `array(\"name\" => 'John', \"age\" => 25)`。如果我们写：\n\n```php\necho $anotherAssocMDArr[\"\
  first player\"][\"age\"];\n```\n\n我们将得到输出 25。\n\n#### 示例 8：\n```php\n$myArray =\
  \ array(2, 5.1, 'PHP', 105);\nvar_dump($myArray);\n```\n输出：\n```\narray(4) { [0]=>\
  \ int(2) [1]=> float(5.1) [2]=> string(3) \"PHP\" [3]=> int(105) }\n```\n\n####\
  \ 示例 9：\n```php\nprint_r($myArray);\n```\n输出：\n```\nArray ( [0] => 2 [1] => 5.1\
  \ [2] => PHP [3] => 105 )\n```\n\n#### 示例 10：\n```php\n$indexArrDemo = array(11,\
  \ 4, 5, 1, 2, 5, 6);\n$assocArrDemo = array('A'=>12, 'B'=>5, 'C'=>20);\necho array_search(5,\
  \ $indexArrDemo);\necho array_search(20, $assocArrDemo);\nvar_dump(array_search('B',\
  \ $assocArrDemo));\n```\n输出：\n`2`\n`C`\n`bool(false)`\n\n#### 示例 11：\n```php\n$countDemo\
  \ = array(1, 4, 5, 1, 2);\necho count($countDemo);\n```\n输出：\n`5`\n\n#### 示例 12：\n\
  ```php\n$num1 = array(100, 111, 120);\n$num2 = array(1, 3, 5);\n$result = array_merge($num1,\
  \ $num2);\n```\n\n#### 示例 13：\n```php\n$num1 = array(0 => \"apple\", 1 => \"banana\"\
  );\n$num2 = array(0 => \"cherry\", 1 => \"date\");\n$result = array_merge($num1,\
  \ $num2);\n```\n当使用字符串键时，后面的值将覆盖具有相同字符串键的先值。\n\n\n\n\n如果两边的值相等且日期类型相同，则返回 true（例如，`5\
  \ === 5` 返回 true，而 `5 === 5.0` 返回 false）。\n\n不等于 (`!=` 或 `<>`)：如果两边的值不相等，则返回 true（例如\
  \ `5 != 7` 和 `5 <> 7` 均返回 true）。\n\n不相同 (`!==`)：如果两边的值不相等或数据类型不相同，则返回 true（例如 `5\
  \ !== 5.0` 返回 true，因为 `5` 和 `5.0` 属于不同的数据类型）。\n\n### 大于 (`>`)\n如果左侧的值大于右侧的值，则返回\
  \ true（例如 `7 > 2` 返回 true）。\n\n### 大于等于 (`>=`)\n如果左侧的值大于或等于右侧的值，则返回 true（例如 `8 >=\
  \ 5` 和 `6 >= 6` 均返回 true）。\n\n### 小于 (`<`)\n如果左侧的值小于右侧的值，则返回 true（例如 `9 < 12` 返回\
  \ true）。\n\n### 小于等于 (`<=`)\n如果左侧的值小于或等于右侧的值，则返回 true（例如 `10 <= 14` 和 `13 <= 13`\
  \ 均返回 true）。\n\n### 船位运算符 (`<=>`)\nPHP 7 中引入。\n如果两边的值相等（不一定完全相同），则返回 0。\n如果左侧的值大，返回\
  \ 1。\n如果左侧的值小，返回 -1（例如 `5 <=> 7` 返回 -1，而 `5 <=> 5.0` 返回 0）。\n\n## 6.2 逻辑运算符\n接下来，我们有一组逻辑运算符。常用的运算符包括：\n\
  \n#### NOT\nNOT (`!`) 运算符当它跟在一个为假的表达式之前时返回 true。例如，`!(5 > 10)` 返回 true，因为 `5 > 10`\
  \ 是假的（即 `5` 不大于 `10`）。\n\n#### AND\nAND 运算符允许我们组合两个比较，并在两个比较都为 true 时时返回 true。我们可以使用\
  \ `and` 关键字（不区分大小写）或 `&&` 符号。两者相似，但优先级不同。让我们来看一些示例：\n\n示例 1：\n```php\n$a = 5 > 3\
  \ and 4 < 10;\n$b = 5 > 3 && 4 < 10;\n$c = 5 > 1 && 13 < 5;\nvar_dump($a);\nvar_dump($b);\n\
  var_dump($c);\n```\n输出：\n`bool(true) bool(true) bool(false)`\n在上面的示例中，`$a` 和 `$b`\
  \ 为 true，因为两个比较（`5 > 3` 和 `4 < 10`）都是 true。相比之下，`$c` 为 false，因为第二个比较（`13 < 5`）为\
  \ false。\n\n示例 2：\n```php\n$d = 3 > 2 && 3 < 1;\n$e = 3 > 2 and 3 < 1;\nvar_dump($d);\n\
  var_dump($e);\n```\n输出：\n`bool(false) bool(true)`\n此示例说明了 `and` 关键字与 `&&` 符号之间的优先级差异。`&&`\
  \ 的优先级高于赋值运算符 (`=`)。因此，语句 `$d = 3 > 2 && 3 < 1;` 的评估方式为：\n`$d = (3 > 2 && 3 < 1);`\n\
  `$d` 为 false，因为 `3 < 1` 为假。相比之下，`and` 关键字的优先级低于赋值运算符。因此，语句 `$e = 3 > 2 and 3 < 1;`\
  \ 的评估方式为：\n`($e = 3 > 2) and 3 < 1;`\n`$e` 为 true，因为只有第一个比较（`3 > 2`）的结果被赋值给了它。在大多数情况下，由于优先级更高，优于使用\
  \ `&&`。\n\n#### OR\n接下来是 OR 运算符。当至少有一个比较为 true 时，该运算符返回 true。我们可以使用 `or` 关键字或 `||`\
  \ 符号。不过，我鼓励你使用 `||`，因为它优先级更高。\n\n示例：\n```php\n$f = 4 < 7 || 10 > 3;\n$g = 3 < 2\
  \ || 3 > 1;\n$h = 10 > 15 || 12 < 1;\nvar_dump($f);\nvar_dump($g);\nvar_dump($h);\n\
  ```\n输出：\n`bool(true) bool(true) bool(false)`\n`$f` 为 true，因为两个比较都是 true。`$g` 为\
  \ true，即使第一个比较（`3 < 2`）为假。这是因为 `||` 只需要至少有一个比较为真。`$h` 为 false，因为没有任何比较为真。\n\n##\
  \ 3. 控制结构\n现在我们已经熟悉了比较，准备好讨论 PHP 中的各种控制结构了。\n\n### 1. If 语句\n第一个是 `if` 语句。该语句允许程序评估是否满足特定条件，并根据评估结果执行适当的操作。`if`\
  \ 语句的语法如下：\n\n```php\nif (条件 1) {\n    // 执行任务 A\n} elseif (条件 2) {\n    // 执行任务\
  \ B\n} elseif (条件 3) {\n    // 执行任务 C\n} else {\n    // 执行任务 D\n}\n```\n\n让我们来看一个真实的示例：\n\
  ```php\n$a = 7;\nif ($a < 0) {\n    echo '第一块';\n} elseif ($a < 5) {\n    echo '第二块';\n\
  } elseif ($a < 10) {\n    echo '第三块';\n} else {\n    echo 'else 块';\n}\n```\n如果\
  \ `$a` 是 7，输出将是 '第三块'。\n\n### 3.2 三元运算符\n接下来，让我们讨论三元运算符。在之前的示例中，我们有一个相对复杂的 `if`\
  \ 语句。如果你只想进行简单的 if-else 测试（没有 `elseif` 块），可以使用三元运算符 (`?`）。语法为：`条件 ? 任务 A : 任务 B`。\n\
  \n三元运算符首先检查左侧的条件。如果为真，执行任务 A。否则，执行任务 B。\n\n示例：\n```php\n$a = (7 == 7 ? 'Yes' : 'No');\n\
  echo $a;\n```\n这里的测试条件是 `7 == 7`。由于该条件成立，三元运算符执行第一个任务并返回字符串 'Yes'。我们将该字符串赋值给 `$a`，并使用\
  \ `echo` 语句在下一行显示其值。\n\n### 3.3 Switch 语句\n接下来，我们有 `switch` 语句。该语句与 `if` 语句类似，如果有许多条件需要测试，它的速度更快。它通常用于条件涉及将变量与单个值比较（而不是值范围）。语法如下：\n\
  \n```php\nswitch (用于切换的变量) {\n    case 情况情况:\n        任务 A;\n        break;\n  \
  \  case 第二种情况:\n        任务 B;\n        break;\n    default:\n        默认任务;\n}\n\
  ```\n\n示例：\n```php\n$b = 20;\nswitch ($b) {\n    case 10:\n        echo '巧克力';\n\
  \        break;\n    case 20:\n        echo '柠檬';\n        break;\n    case 25:\n\
  \        echo '草莓';\n        break;\n    default:\n        echo '默认任务';\n}\n```\n\
  如果 `$b` 是 20，输出将是 '柠檬'。\n\n\n\n\n```\n14echo 'None of the above<BR>'; 15 }\n```\n\
  在上面的示例中，我们首先声明了一个名为 `$b` 的变量并赋值为 20。\n\n接下来，我们有一个从第 3 行到第 15 行的`switch`语句。在第 3 行，`switch`语句使用\
  \ `$b` 的值来决定执行哪个 `case`。当满足某个 case 时，将执行从下一行开始的所有内容，直到遇到 `break`语句。如果 `$b 为 10`，则满足\
  \ `case10`。程序将执行第 5 行之后的所有内容，直到遇到第 7 行的 `break` 语句。换句话说，它执行了第 6 行并输出“Chocolate”作为输出。另一方面，如果\
  \ `$b 为 20`，则满足 `case20`。然而，这个 case 没有 `break` 语句。因此，程序将执行从第 9 行开始的所有内容，直到遇到第 12\
  \ 行的 `break` 语句。换句话说，它执行了 `cases20` 和 `25`，并依次输出“Lemon”和“Strawberry”。接下来，如果 `$b\
  \ 为 25`，则满足 `case25`。程序执行第 11 行并输出“Strawberry”作为输出。最后，如果 `$b 不是 10`、`20` 或 `25`，则执行\
  \ `default` case，我们将得到“None of the above”作为输出。\n\n`default` case 是可选的。此外，我们可以在`switch`语句中包含任意数量的`cases`。在示例中，我们有三个\
  \ cases。如果你运行上面的`switch`语句，你将得到：\n\nLemon\nStrawberry\n\n作为输出。尝试将第 1 行的 `$b` 修改为其他值并重新运行代码，以充分理解`switch`语句的工作原理。\n\
  \n### 6.3.4 For 循环\n\n接下来，让我们来看下 `for` 循环。这种控制结构会重复执行一个代码块，直到测试条件不再有效。其语法如下：\n\n\
  ```\nfor (初始值; 测试条件; 值的修改) \n{ //执行某些任务\n}\n```\n\n 让我们看一个示例：\n```\nfor ($c = 1;\
  \ $c < 5; ++$c){ \n  echo 'The value of $c is '.$c.'<BR>'; \n}\n```\n`for` 循环的重点是第一行。该行包含三个部分，每个部分由分号隔开。在我们的示例中，有这一行：`for\
  \ ($c = 1; $c < 5; ++$c)`。\n\n第一部分声明了一个变量 `$c` 并将其初始化为 1。第二部分测试 `$c` 是否小于 5。如果是，将执行随其后的大括号内部的语句。在我们的示例中，由于只有一个语句要执行，因此大括号是可选的。在执行完大括号中的语句后，程序返回到第三部分（`++$c`）。这部分修改用于测试的变量的值。在我们的示例中，我们使用自增运算符将\
  \ `$c` 的值加 1。结果是`$c` 变成了 2。自增后，程序测试 `$c` 的新值是否仍然小于 5。如果是，它会再次执行大括号中的代码。这种测试和更新 `$c`\
  \ 值的将不断重复，直到条件 `$c < 5` 不再为真。此时，程序退出。\n\n### 6.3.5 Foreach 循环\n\n接下来，让我们来看 `foreach`\
  \ 循环。这种循环与 `for` 循环类似，但用于遍历数组。它有两种语法：\n\n```\nforeach ($array as $value) {\n  //代码\n\
  }\n\nforeach ($array as $key => $value) {\n  //代码\n}\n```\n假设我们有一个关联数组：\n```\n$arr2\
  \ = array('Aaron'=>12, 'Ben'=>23, 'Carol'=>35);\n```\n使用第一个 `foreach` 循环：\n```\n\
  foreach ($arr2 as $name) { \n  echo $name.' is.' years old.'; \n}\n```\n这将输出 Aaron\
  \ is 12 years old, Ben is 23 years old, Carol is 35 years old。\n\n### 6.3.6 While\
  \ 循环\n\n`while` 循环在特定条件保持真的同时重复执行代码块。其语法如下：\n\n```\nwhile (条件为真) \n{ \n  //代码\n\
  }\n```\n\n让我们看一个示例：\n```\n$d = 1;\nwhile ($d < 5) { \n  echo 'The value of $d is\
  \ '.$d.'<BR>'; \n  $d++; \n}\n```\n在示例中，我们声明了一个变量 `$d` 并赋值为 1。`while` 循环检查 `$d <\
  \ 5` 是否为真。如果是，它执行大括号内部的语句。换句话说，它执行了第 5 行的 `echo` 语句并在第 6 行将 `$d` 加 1。结果是 `$d` 变成了\
  \ 2。接下来，循环返回第 3 行检查 `$d` 是否仍然小于 5。如果是，它再次执行大括号中的代码。这种检查和更新 `$d` 值的过程持续直到 `$d < 5`\
  \ 不再为真。\n\n### 6.3.7 Do-while 循环\n\n`do-while` 循环与 `while` 循环非常相似，但测试条件位于循环的最后。这意味着循环大括号内的代码始终至少执行一次。语法为：\n\
  \n```\ndo {\n  //某些任务\n} while (条件为真);\n```\n注意，测试条件后面需要一个分号（`;`）。\n\n\n\n\n6 }\
  \ while ($e<0); 在第 1 行，我们首先声明并初始化了一个变量 `$e`，赋值为 `100`。接下来，我们有从 3 到 6 行的 `do-while`\
  \ 循环。在循环内部，程序执行第 4 行的 `echo` 语句并在第 5 行将 `$e` 的值增加到 `101`。最后，它到达第 6 行的测试条件。由于 `$e`\
  \ 的值小于 `0`，测试失败。程序退出 `do-while` 循环且不再重复循环中的任务。如果你运行上述代码，你将得到输出 `The value is 100`。虽然\
  \ `$e` 的原始值不满足测试条件 ($e < 0)，但由于测试条件位于闭合大括号之后，大括号内的代码会被执行一次。\n\n## 4. 流程控制中的其他主题\n\
  \n太棒了！我们涵盖了 PHP 中所有主要的控制结构。在结束本章之前，我想介绍几个更多与 PHP 流程控制相关的杂题。\n\n### 1. 布尔值\n\n首先，让我们来谈谈\
  \ `bool` 数据类型。我们在第 4.3 章遇到过这种数据类型，并了解到它只能存储两个值之一——`true` 或 `false`。在 PHP 中，大多数值都可以转换为\
  \ `true` 或 `false`（即转换为 `bool` 数据类型）。转换为 `false` 的值包括：\n\n- 代表零的数字（例如 `0` 和 `0.0`）\n\
  - 空字符串（例如 `''`，它由两个单引号组成，中间没有包含文本）\n- 字符串 `\"0\"`\n- 零元素的数组，以及\n- 一个名为 `NULL` 的特殊值。\n\
  \n相反，大多数其他值（如 `1`、`3.4` 和 `\"Hello\"`）都会转换为 `true`。我们已经看到控制结构如何根据条件求值是 `true` 还是\
  \ `false` 来决定是否执行某块代码。假设我们有以下 `if` 语句：\n\n```php\nif (\"hello\") {\n    echo 'if\
  \ block';\n} else {\n    echo 'else block';\n}\n```\n\n如果我们运行上述语句，我们将得到输出 `if block`。这是因为字符串\
  \ `\"hello\"` 被转换成了 `true`。对于任何控制结构，只要条件求值为 `true`，无论它是比较的结果（例如 `$a < 5`）还是转换为 `true`\
  \ 的值，对应的代码块都将被执行。在上面的 `if` 语句中，由于 `if` 条件（`\"hello\"`）求值为 `true`，因此执行了 `if` 块。懂了吗？很好！\n\
  \n### 6.4.2 Break, Continue\n\n接下来，让我们讨论 `break` 和 `continue` 语句。这些语句可以修改我们控制结构的行为。我们之前讨论\
  \ `switch` 语句时已经遇到过 `break` 语句。当满足特定的 `switch case` 时，`switch` 语句会执行后续的所有内容，直到遇到\
  \ `break` 语句。除了在 `switch` 语句中使用它外，我们可以在循环中使用 `break` 语句。`break` 语句会结束其所在循环的执行。让我们来看一个例子：\n\
  \n```php\nfor ($i = 0; $i < 50; ++$i) {\n    echo \"$i<BR>\";\n    if ($i == 4)\
  \ {\n        break;\n    }\n}\n```\n\n在这里，我们在 `for` 循环内部有一个 `if` 语句。`break` 语句会结束其所在循环的执行。（此处省略原文中大量重复的句子，按要求不重复输出）。\n\
  \n### 6.4.3 替代语法\n\n接下来，让我们讨论替代（alternative）。PHP 为它的某些控制结构提供了替代语法，特别是 `if`、`while`、`foreach`\
  \ 和 `switch`。这种语法涉及将左大括号替换为冒号，并将最后一个右大括号分别替换为 `endif;`、`endwhile;`、`endforeach;`\
  \ 或 `endswitch;`。让我们用 `if` 语句来说说明。假设我们要根据 `$a` 的值显示不同的输出，可以使用以下代码：\n\n```php\n$a\
  \ = 5;\nif ($a == 5){\n    echo '<BR>The value of a is ';\n}else{\n    echo 'Not\
  \ five';\n}\n```\n\n或者，我们可以这样做：\n\n```php\n$a = 5;\nif ($a == 5):\n    echo '<BR>The\
  \ value of a is ';\nelse:\n    echo 'Not five';\nendif;\n```\n\n比较这两个 `if` 语句。注意在上面的第二个\
  \ `if` 语句中，我们将左大括号替换为了冒号？此外，我们将最后一个右大括号替换为了 `endif;` 语句。如果你运行上述代码，两种语法都将输出 `The\
  \ value of a is 5`。\n\n### 6.4.4 显示 HTML 代码\n\n最后，让我们讨论输出 HTML 代码的技巧。到为止，我们一直在使用\
  \ `echo` 语句在控制结构中输出 HTML 代码（例如 `<BR>` 标签）。这种技术易用，对于简单的 HTML 代码效果良好。但如果我们需要输出更复杂的\
  \ HTML 代码，它可能会变得繁琐，特别是当代码使用了大量的单双引号时。例如，如果我们想用 `echo` 语句输出以下 HTML 代码 `<a href=\"\
  names.php\" target=\"_blank\">The names are 'Aaron', 'Peter', 'James', 'Max', 'Jenny'\
  \ and 'Don'.</a><img src=\"names.jpg\" alt=\"Names\" height=\"42\" width=\"42\"\
  >`，我们需要转义大量的引号。在这种情况下，可以使用一种技巧在 PHP 和 HTML 代码之间切换。为了演示，假设我们想使用 `for` 循环输出三次 HTML\
  \ 代码 `<h1>Hello</h1>`，下面的代码展示了我们可以如何操作（使用上一节提到的替代语法）：\n\n```php\n<?php\nfor ($i\
  \ = 0; $i < 3; ++$i):\n    echo '<h1>Hello</h1>';\nendfor;\n?>\n```\n\n这个循环使用 `echo`\
  \ 语句输出 HTML 代码。或者，如果我们不想使用 `echo` 语句，可以如下所示：\n\n```php\n<?php\nfor ($i = 0; $i <\
  \ 3; ++$i): ?>\n    <h1>Hello</h1>\n<?php endfor; ?>\n```\n\n\n\n\n\n# 5 ?> 仔细研究这两个循环，你注意到了什么区别？首先，注意我们在第二个循环的第\
  \ 2 行结尾添加了 `?>`？这个 `?>` 标签关闭了第 1 行的 `<?php` 标签。当发生这种情况时，第二个循环中第 2 行之后的任何代码将不再被解释为\
  \ PHP 代码，而是被解释为 HTML 代码。这解释了为什么我们不需要使用 `echo` 语句在第 3 行输出 `<h1>Hello</h1>`。接下来，在第\
  \ 4 行，我们再次打开了 PHP 标签。当 PHP 看到这个开启标签时，它知道后面跟着的是 PHP 代码。当它遇到 `endfor;` 语句时，它意识到这是一个\
  \ `for` 循环并寻找要评估的条件。当它在第 2 行找到条件时，它会将 `$i` 加 1 并再次运行第 3 行。这会一直重复，直到条件 `$i < 3` 不再有效。学会了吗？如果你运行上面的循环，你会发现两种情况下都会以\
  \ `<h1>` 标题的形式显示三次“Hello”。仔细研究这两个循环以理解这项技术是如何工作的。刚开始可能会有点困惑。核心思想是在切换到 HTML 代码之前关闭\
  \ PHP 标签，并在 HTML 代码之后再次打开它。这使得在不需要使用 `echo` 语句的情况下插入 HTML 代码方便得多。\n\n# 第 7 章：函数\n\
  \n在本章中，让我们开始讨论函数。我们在之前的章节中已经遇到过函数。例如，在第 5 章中，我们学习了使用各种 PHP 函数来处理字符串和数组。在本章中，我们将学习定义自己的函数。\n\
  \n## 7.1 定义自己的函数\n\n要定义自己的函数，我们使用以下语法：\n\n```php\nfunction functionName(list of\
  \ parameters) { //要执行的代码； //返回语句，如果有的话 }\n```\n\n所有函数声明都必须以 `function` 关键字开头。接下来是函数名。PHP\
  \ 中的函数名对大小写不敏感，并且可以包含字母、数字或下划线。然而，它们必须以字母或下划线开头。与变量名类似，我们在命名函数时通常使用 `camelCase`（驼峰命名法）或下划线。在书中，我们将使用\
  \ `camelCase`。在函数名之后，我们用一对括号将函数所需的参数列表（如果有）括起来。参数是用于存储传递给函数的值的变量；我们传递的值称为参数（arguments）。声明函数后，我们使用大括号括起我们想要函数执行的代码。如果函数返回结果，我们使用\
  \ `return` 关键字。学会了吗？让我们来看一些例子。\n\n### 示例 1\n\n```php\nfunction displayGreetings(){\n\
  \    echo 'Hello';\n}\n```\n\n在这里，我们声明了一个名为 `displayGreetings()` 的函数，它没有参数（如函数名后的一对空括号所示）。该函数简单地输出单词“Hello”。若要调用该函数，我们使用它的名称后跟一对括号：`displayGreetings();`。\n\
  \n这将产生：\nHello\n作为输出。\n\n### 示例 2\n\n```php\nfunction displayGreetings2($name, $message){\n\
  \    echo \"Hello $name, $message\";\n}\n```\n\n在这里，我们声明了一个名为 `displayGreetings2()`\
  \ 的函数，它有两个参数 `$name` 和 `$message`。如果我们使用以下语句调用函数：\n`displayGreetings2('Jamie', 'good\
  \ morning');`\n参数 `'Jamie'` 和 `'good morning'` 将分别赋值给参数 `$name` 和 `$message`。当我们运行上面的代码时，我们将得到：\n\
  Hello Jamie, good morning\n作为输出。\n\n### 示例 3\n\n在声明函数时，我们可以为参数提供默认值。\n\n```php\n\
  function displayGreetings3($name, $message = 'have a good day'){\n    echo \"Hello\
  \ $name, $message\";\n}\n```\n\n在上面的示例中，我们将 `'have a good day'` 声明为参数 `$message`\
  \ 的默认值（参考下划线代码）。要调用该函数，可以使用以下语句：\n`displayGreetings3('Jamie');`\n`echo '<BR>';`\n\
  `displayGreetings3('Jamie', 'how are you?');`\n\n在第一次函数调用中，我们省略了第二个参数。当我们这样做时，函数将使用默认值\
  \ `'have a good day'` 作为 `$message` 的值。如果我们运行上面的代码，我们将得到：\nHello Jamie, have a good\
  \ day\nHello Jamie, how are you?\n作为输出。\n\n当我们在声明带有默认值的参数函数时，请注意，带有默认值的参数必须放在不带默认值的参数之后。如果我们声明函数为\
  \ `function redundantDefault($a = 1, $b){ //某些代码 }`，则 `$a` 的默认值将不起作用，因为它在 `$b`（不带默认值）之前；调用函数时我们仍然需要提供两个参数。\n\
  \n### 示例 4\n\n最后但同样重要的是，函数可以在完成任务后返回一个结果。\n\n```php\nfunction addNumbers($num1,\
  \ $num2, $num3){\n    return $num1 + $num2 + $num3;\n    echo 'Hello';\n}\n```\n\
  \n上面的函数使用 `return` 语句返回 `$num1`、 `$num2` 和 `$num3` 的和。一旦执行了 `return` 语句，函数就会退出，返回语句后的任何语句都不会执行。我们可以将函数返回的结果赋值给变量，或使用\
  \ `echo` 语句直接显示结果。\n\n如果我们使用以下语句调用上面的函数：`echo addNumbers(9, 6, 1);` 将得到：\n16\n作为输出。`echo\
  \ 'Hello';` 语句不会被执行。\n\n## 7.2 类型声明\n\n之前的示例说明了我们在定义函数时需要了解的关键点。在进入下一章之前，我想在本节中讨论类型声明（也称为类型提示）。类型声明是为新版本\
  \ PHP 添加的特性。该特性是可选的，但很好。首先，什么是类型声明？如之前所述，PHP 是一种弱类型语言。在上面的示例中，当我们声明函数时，没有指定数据类型。如果我们传递给函数的参数类型无效，PHP\
  \ 会尽力尝试执行函数。例如，参考上一节的示例 4，如果我们尝试运行以下语句 `echo addNumbers('9', '6', '1');` 我们不会得到任何错误。尽管我们向\
  \ `addNumbers()` 函数传递了三个字符串，PHP 会自动将它们转换为整数并执行函数。因此，我们将得到 16 作为输出。这种灵活性使得 PHP 一成为非常易编程的语言。然而，根据你构建网站的需求，你可能希望在数据类型不时不运行函数。在这种情况下，可以使用类型声明。类型声明允许我们在声明函数时指定参数的数据类型。该特性从\
  \ PHP 5 开始可用。然而，在 PHP 5 中类型声明对标量类型无效。标量类型是指存储单个值的数据类型，例如 `int`、`float`、`bool` 和\
  \ `string`。类型声明仅适用于数组等类型。要在标量类型上使用类型声明，我们需要 PHP 7 及更高版本。此外，我们需要在脚本中添加 `strict_types`\
  \ 声明并将 `strict_types` 设置为 1。为了说明它是如何工作的，让我们来看一个示例。这个示例在 PHP 7 中运行。\n\n在 Brackets\
  \ 中创建一个新文件并命名为 `typedec.php`。向其添加以下代码。\n\n```php\n<?php\ndeclare(strict_types=1);\n\
  \nfunction addNumbersStrict(int $num1, int $num2, int $num3){\n    return $num1\
  \ + $num2 + $num3;\n    echo 'Hello';\n}\n\necho addNumbersStrict('9', '6', '1');\n\
  ```\n\n\n\n\n\n在这里，我们使用内置函数 `declare()` 将 `strict_types` 设置为 `1`。该语句必须是脚本中的第一条语句。接下来，我们声明一个名为\
  \ `addNumbersStrict()` 的函数，带有三个参数 `$num1`、`$num2` 和 `$num3`。我们通过在名称名前添加 `int` 来指示这些参数必须是\
  \ `int` 类型。最后，我们通过向其传递 `'9'`、`'6'` 和 `'1'` 来调用该函数。如果你运行上面的代码，你将得到与下面所示类似的输出：`Fatal\
  \ error : Uncaught TypeError: Argument 1 passed to addNumbersStrict() must be of\
  \ the type int, string given...` 接下来，将 `echo` 语句改为\n\n```php\necho addNumbersStrict(9\
  \ , 6 ,1);\n```\n\n并重新运行代码。由于 `9`、`6` 和 `1` 都是 `int` 类型，我们现在不会遇到任何错误。相反，我们将得到 `16`\
  \ 作为输出。明白了吗？除了对参数进行类型声明外，如果我们使用的是 PHP 7 及以上版本，还可以对返回类型进行声明。要做到这一点，我们可以在函数声明的括号后使用冒号来指示返回类型。向\
  \ `typedec.php` 中添加以下代码：\n\n```php\nfunction addTwoNums($a, $b): int {  \n    return\
  \ $a + $b;  \n}\necho '<BR>'.addTwoNums(3, 1);\n```\n\n在这里，我们指示 `addTwoNums()` 的返回值应该应该是\
  \ `int` 类型。接下来，我们使用 `3` 和 `1` 作为参数调用该函数。如果你运行上面的代码，你将得到 `4` 作为输出。接下来，将最后一行改为\n\n\
  ```php\necho '<BR>'.addTwoNums(3.9, 1);\n```\n\n再次运行页面。你将得到以下输出：`Fatal error : Uncaught\
  \ TypeError: Return value of addTwoNums() must be of the type int, float returned...`\
  \ 这是因为 `3.9 + 1` 为我们得到了 `4.9`，它不是 `int` 类型。\n\n# 第 8 章：PHP 超局变量\n\n在前面的章节中，我们涵盖了许多内容。目前为止涵盖的大多数主题都是其他编程语言通用的基础概念。在本章中，我们将学习\
  \ PHP 特有的内容——PHP 超局变量（superglobals）。我们将学习如何使用这些超局变量与 HTML 表单进行交互，并将信息从一个 PHP 脚本传递到另一个脚本。\n\
  \n## 8.1 PHP 表单处理\n\n首先，这个主题要求你对 HTML 表单元素有基本的了解。如果你不熟悉，`https://www.w3schools.com/html/html_form_elements.asp`\
  \ 提供了一个你可以参考的快速指南。如果你熟悉，让我们从创建一个简单的 HTML 表单开始，供稍后使用。\n\n打开 Brackets 并在你的 `htdocs`\
  \ 文件夹中创建一个名为 `form.php` 的新文件。向其中添加以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head><title>PHP\
  \ Form Handling</title></head> <body>\n<form action = \"\" method = \"get\"> Enter\
  \ Name <BR>  \n<input type = \"text\" name = \"studentname\" value = \"Your Name\"\
  >  \n<BR><BR>  \nFavorite Subject(s)<BR>  \n<input type = \"checkbox\" name = \"\
  subj[]\" value = \"EL\">English  \n<input type = \"checkbox\" name = \"subj[]\"\
  \ value = \"MA\">Math  \n<input type = \"checkbox\" name = \"subj[]\" value = \"\
  PG\">Programming  \n<BR><BR>  \nGender <BR>\n<input type = \"radio\" name = \"gender\"\
  \ value = \"M\">Male  \n<input type = \"radio\" name = \"gender\" value = \"F\"\
  >Female  \n<BR><BR>\n<input type = \"submit\" name=\"sm\" value = \"Submit\">\n\
  </form>\n</body>\n</html>\n```\n\n仔细研究上面的代码。注意我们使用了以下 `<form>` 标签 `<form action=\"\
  \" method=\"get\">`。这个标签有两个属性 `action` 和 `method`。`action` 属性指定了我们想要处理 HTML 表单的文件。在我们的示例中，我们给它分配了一个空字符串。这意味着我们想要使用当前文件（`form.php`）。如果我们想使用另一个文件来处理表单，我们需要将该文件的路径分配给\
  \ `action` 属性。例如，假设我们想使用 `process.php` 且 `process.php` 与 `form.php` 在同一个文件夹中，我们需要编写\
  \ `<form action=\"process.php\" method=\"get\">`。\n\n接下来，我们有 `method` 属性。该属性指定了我们想要使用的发送表单数据的方法。有两种方法可用：`get`\
  \ 和 `post`。如果我们不指定任何方法，默认是 `get`。在我们的示例中，我们指定了想要使用 `get` 方法。我们稍后会讨论这两种方法。\n\n接下来，让我们看看表单中的\
  \ `<input>` 标签；这些标签用于创建各种元素。注意，所有的 `<input>` 标签都有一个 `name` 属性。该属性用于为相应的表单元素命名。例如，第一个表单元素（文本框）被命名为\
  \ `studentname`，如下方的代码所示。\n\n如果我们想用 PHP 处理这些元素，那么为表单元素命名是强制性的。就像 PHP 中的变量有名称一样，所有表单元素必须有一个\
  \ `name`，以便我们以后在代码中引用它们。\n\n接下来，注意我们表单中所有的复选框（`type=\"checkbox\"`）都命名为 `subj`，两个单选按钮（`type=\"\
  radio\"`）都命名为 `gender`。两个单选按钮具有相同的名称，因为它们属于同一个组（即：它们都是“性别”的选项）。同样，复选框具有相同的名称 `subj`，因为它们都是“喜欢的科目”的选项。由于用户可以为复选框选择多个选项，我们需要添加一对方括号\
  \ `[]` 来指示所选的选项将被存储为数组。\n\n最后但同样重要的是，注意所有的 `<input>` 标签都有一个 `value` 属性。该属性的行为根据表单元素而不同。对于文本框，它指定了显示在框中的初始值。对于\
  \ `submit` 按钮，它指定了按钮上的文本。对于复选框、单选按钮和下拉列表，它指定了每个所选选项将提交的值。例如，如果选择了以下复选框 `<input type=\"\
  checkbox\" name=\"subj[]\" value=\"EL\">`，字符串 `\"EL\"` 将被提交。\n\n明白了吗？太棒了！让我们继续，，来讨论\
  \ `isset()` 函数。\n\n### 1. `isset()` 函数\n\n`isset()` 函数是一个在 PHP 表单处理中常用的函数。它检查变量是否已声明且不为\
  \ `NULL`。`NULL` 是一个特殊值，讽刺地表示变量没有值。\n\n假设我们有两个变量 `$a` 和 `$b`，如下：\n\n```php\n$a =\
  \ 5;\n$b = NULL;\n```\n\n以下语句：\n\n```php\nvar_dump(isset($a));\nvar_dump(isset($b));\n\
  var_dump(isset($c));\n```\n\n给出了：\n```\nbool(true)\nbool(false)\nbool(false)\n```\n\
  `a` 被认为是 set（即 `isset($a)` 返回 true），因为它已声明并有一个非 NULL 值。相反， `$b` 和 `$c` 都被认为是 unset（即\
  \ `isset($b)` 和 `isset($c)` 返回 false），因为 `$b` 值为 `NULL` 而 `$c` 未声明。`isset()` 函数通常用于判断按钮是否被点击。我们稍后会学习这一点。\n\
  \n### 2. `get` 和 `$_GET`\n\n`get` 和 `post` 方法都可以将表单数据发送到 PHP 服务器进行处理。主要区别在使用 `get`\
  \ 方法时，表单数据附加到 URL。此外，使用 `get` 方法传输的数据量有一个限制。`form.php` 中的表单目前使用 `get` 方法。假设我们用以下数据填充表单：\n\
  \n![](img/image_rsrc1J2.jpg)\n\n点击“提交表单”按钮时，URL 变为 `http://localhost/form.php?studentname=Alex&subj%5B%5D=EL&subj%5B%5D=MA&gender=`\
  \ 注意 URL 中的问号（`?`）？这个问号用分隔符；URL 中问号之后的内容被称为查询字符串。查询字符串包含了我们提交的表单数据，每个数据以 `name=value`\
  \ 对的形式呈现，并用符号（`&`）分隔。例如，当我们在名为“studentname”的文本框中输入字符串“Alex”时，键对 `studentname=Alex`\
  \ 被附加到 URL 中。\n\n\n\n\n\n`subj%5B%5D=EL&subj%5B%5D=MA` 被附加到 URL 之后。这些组合使用 URL 编码来编码\
  \ URL 中无法显示的特殊字符。`%5B` 编码字符“[”，而 `%5D` 编码“]”。如果你解码\n\n`subj%5B%5D=EL&subj%5B%5D=MA`\n\
  \n你将得到\n\n`subj[]=EL&subj[]=MA` 这表示我们为 `subj` 表单元素提交了值“EL”和“MA”。\n\n现在，假设我们想在 PHP\
  \ 脚本中使用存储在查询字符串中的信息，我们该如何做呢？\n\n很简单。我们使用 `$_GET` 超全局变量。`$_GET` 是一个将查询字符串存储为关联数组的超全局变量。要查看\
  \ `$_GET` 中的所有数据，我们可以使用 `print_r()` 函数。要查看它是如何工作的，请将以下代码添加到 `form.php` 的 `</form>`\
  \ 和 `</body>` 标签之间：\n\n```php\n<?php\nif (isset($_GET['sm']))\n    print_r($_GET);\n\
  ?>\n```\n\n在这里，我们使用 `isset()` 函数来检查 `$_GET['sm']` 是否设置。在点击“提交表单”按钮（命名为“sm”）之前，`$_GET['sm']`\
  \ 被认为未设置。当我们点击按钮时，PHP 将字符串 'Submit Form' 分配给 `$_GET['sm']`，该变量变为已设置。\n\n当这种情况发生时，`isset($_GET['sm'])`\
  \ 返回 `true`，并执行 `if` 块。刷新 `form.php`（不带查询字符串）并输入之前输入的数据。接下来，点击“提交表单”按钮；你会在页面底部看到附加的行：`Array\
  \ [studentname] => Alex [subj] => Array ([0] => EL [1] => MA) [gender] => M [sm]\
  \ => Submit Form )` 这给了我们 `$_GET` 数组的内容。也就是说，`$_GET['studentname'] = 'Alex'`，`$_GET['subj']\
  \ = array('EL', 'MA')`，`$_GET['gender'] = 'M'` 且 `$_GET['sm'] = 'Submit Form'`。明白了吗？太棒了！我们现在来看\
  \ post 方法。\n\n### 8.1.3 post 和 `$_POST`\n\n`post` 方法与 `get` 方法类似，但表单数据不会附加到 URL。这使得\
  \ `post` 方法适用于向服务器发送敏感信息，因为信息不会在 URL 中可见。让我们来看一个例子。将 `form.php` 中的\n\n`<form action=\"\
  \" method=\"get\">`\n\n更改为\n\n`<form action=\"\" method=\"post\">`\n\n接下来，将 PHP\
  \ 代码更改为\n\n```php\nif (isset($_POST['sm']))\n    print_r($_POST);\n```\n\n最后，再次不带查询字符串加载\
  \ `form.php` 并输入之前输入的数据。点击“提交表单”按钮。你应该发现 URL 保持不变。除此之外，其他一切都是相同的。也就是说，你会在表单底部得到相同的输出。使用\
  \ `get` 与 `post` 方法处理表单非常相似。主要的区别是一个会将查询字符串附加到 URL，而另一个不会。此外，使用 `get` 方法时我们使用 `$_GET`\
  \ 超全局变量；使用 `post` 方法时我们使用 `$_POST` 超全局变量。清楚吗？\n\n### 8.1.4 在表单中保留值\n\n在之前的章节中，我们学习了使用\
  \ `get` 和 `post` 方法处理 HTML 表单。无论使用哪种方法，注意每当点击“提交表单”按钮时，表单都会刷新且输入的数据不再显示在表单上？如果表单处理成功，这是正确的。但是，如果表单没有处理成功我们需要用户重新提交，这将非常麻烦，因为用户需要再次填写所有字段。如果我们不想这种情况发生，可以使用\
  \ `echo` 语句。对于文本框，我们使用 `echo` 语句来修改 `value` 属性。该属性允许我们为文本框填充文本。在 `form.php` 中，我们在文本框中填充了文本“Your\
  \ Name”。或者，我们可以使用 PHP 用输入的数据填充文本框。为了做到，将\n\n`<input type=\"text\" name=\"studentname\"\
  \ value=\"Your Name\">`\n\n更改为\n\n`<input type=\"text\" name=\"studentname\" value=\"\
  <?php\nif (isset($_POST['studentname']))\n    echo $_POST['studentname'];\n?>\"\
  >`\n\n如果你仔细分析上面的代码，你会注意到我们将文本“Your Name”替换为了以下 PHP 代码块：\n\n```php\n<?php\nif (isset($_POST['studentname']))\n\
  \    echo $_POST['studentname']; ?>?>\n```\n\n这段代码首先检查 `$_POST['studentname']` 是否设置。如果是（即用户之前提交了该文本字段的数据），我们使用\
  \ `echo` 语句用提交的信息填充文本框。明白了吗？用输入的数据填充文本框是相对直接的。\n\n当我们想要填充如复选框、单选按钮和下拉列表等元素时，情况会变得复杂一点。要填充这些元素，我们需要知道选择了哪个选项，并使用\
  \ PHP 动态地选择这些选项。让我们来看一个使用复选框的例子。在标签中添加单词“checked”（不带引号）时，复选框就会被选中。例如，\n\n`<input\
  \ name=\"subj[]\" type=\"checkbox\" value=\"EL\" checked>`\n\nEnglish 导致名为“English”的复选框被选中。如果我们想让\
  \ PHP 动态选择这个复选框，我们需要将上面的代码替换为：\n\n`<input type=\"checkbox\" name=\"subj[]\" value=\"\
  EL\" <?php if (isset($_POST['subj']) && in_array('EL', $_POST['subj'])) { echo 'checked';\
  \ } ?>>`\n\nEnglish 这里。在这里，我们使用 PHP 检查 `$_POST['subj']` 是否设置以及当前选项是否被选中。如果是，字符串\
  \ 'EL' 应该在 `$_POST['subj']` 数组中找到。也就是说，`in_array('EL', $_POST['subj'])` 应该返回 `true`。如果是那样，我们就\
  \ `echo` 'checked' 来选择这个复选框。这动态选择了名为“English”的复选框。明白了吗？太棒了！稍后将在项目中编写一个填充表单的函数。\n\
  \n### 8.1.5 过滤用户输入\n\n接下来，让我们讨论如何在表单中过滤用户输入。过滤指的是对用户输入进行清洗（sanitization）和验证（validation）。清洗是从输入中移除无效字符的过程。例如，对一个整数进行清洗涉及移除输入中除数字、加号和减号以外的所有字符。另一方面，验证是检查输入是否符合某些标准的过程。例如，如果输入应该是电子邮件地址，我们可以使用验证过程检查它是否确实是电子邮件地址（例如是否包含“@”字符）。要过滤用户输入，我们使用一个名为\
  \ `filter_var()` 的内置函数。使用此函数时，我们需要指定如何过滤我们的输入。我们通过在 https://www.php.net/manual/en/filters.php\
  \ 找到预定义过滤器来实现。根据所使用的过滤器，此函数将返回过滤后的数据或返回 `false`。例如，如果我们想从一个整数中移除无效字符，可以使用 `FILTER_SANITIZE_INT`\
  \ 过滤器，如下：\n\n```php\n$num = '12.5abc';\necho filter_var($num, FILTER_SANITIZE_INT);\n\
  ```\n\n如果你运行上面的代码，将得到输出 `125`。如果我们想验证电子邮件地址是否有效，可以使用 `FILTER_VALIDATE_EMAIL` 过滤器。向函数传递有效的电子邮件地址，它将返回该电子邮件地址。否则，它返回\
  \ `false`。例如，\n\n```php\n$email = 'abc@gmail';\nvar_dump(filter_var($email, FILTER_VALIDATE_EMAIL));\n\
  ```\n\n我们得到 `bool(false)`，因为“abc@gmail”不是有效的电子邮件地址（缺少“.com”）。\n\n### 8.1.6 跨站脚本\
  \ 太棒了！我们涵盖了 PHP 中大部分的表单处理概念。最后但同样重要的是，让我们转向跨站脚本。对于这一点，我需要进行演示。将 `form.php` 中的 PHP\
  \ 代码（在 `</form>` 和 `</body>` 标签之间）更改为以下：\n\n```php\nif (isset($_POST['studentname']))\n\
  \    echo 'You entered'.$_POST['studentname'].'into the text field';\n```\n\n并刷新页面。在文本字段中输入\
  \ `<script>alert('Hacked');</script>` 并点击“提交表单”按钮。你得到了什么？\n\n你得到了一个显示“Hacked”的警告框，对吧？\n\
  \n\n\n\n\n![](img/image_rsrc1J3.jpg)感到惊讶吗？\n\n此示例演示了 PHP 中的一个关键安全概念——跨站脚本（也称为 XSS）。当用户在我们的\
  \ PHP 表单中输入不希望脚本代码并提交代码时，就会发生跨站脚本攻击。如果我们的网站随后存储了这些代码（例如存储在数据库中）并显示给另一个用户，恶意代码将在另一个用户的浏览器中执行。在我们的示例中，我们使用\
  \ Javascript 创建了一个无害的警报框。然而，具有恶意意的用户完全可以使用相同的技术在受害者的浏览器上运行有害的脚本代码。\n\n为了防止这种情况的发生，每当我们显示用户输入的信息时都必须小心。有几种方法可以实现。最简单的方法是使用名为\
  \ `htmlspecialchars()` 的内置函数。该函数将特殊字符转换为 HTML 实体。特殊字符是指在 HTML 中具有特殊意义的字符，例如 `<`\
  \ 和 `>` 。如果你不希望 `<` 和 `>` 代表 HTML 标签的开始和结束，你就需要使用 `htmlspecialchars()` 函数对它们进行编码。该函数将\
  \ `<` 和 `>` 分别转换为 `&lt;` 和 `&gt;`。因此，`<script>` 将被转换为 `&lt;script&gt;`，不再被解释为 HTML\
  \ 标签。\n\n要查看这是如何工作的，请将上面的 PHP 代码更改为：\n\n```php\nif (isset($_POST['studentname']))\
  \ {\n    echo 'You entered ' .htmlspecialchars($_POST['studentname']) .' into the\
  \ text field';\n}\n```\n\n为了演示目的，我们只对文本字段进行了编码。在实际编码中，你必须对每个允许用户输入信息的表单元素进行编码。如果你现在加载页面并在文本字段中输入\
  \ `<script>alert('Hacked');</script>`，你会发现提交表单时，警报框不再弹出。相反，你会在表单下方得到以下输出：\n\nYou\
  \ entered <script>alert('Hacked');</script> into the text field.\n\n`<script>` 和\
  \ `</script>` 被视为普通文本，没有 HTML 意义。\n\n如果你在网页上右键点击并选择“查看网页源代码”，你会在 `</form>` 标签下方看到这一行\
  \ `You entered &lt;script&gt;alert('Hacked');&lt;/script&gt; into the text field.`。这显示了\
  \ `<` 和 `>` 字符的编码。\n\n## 8.2 `$_SESSION`\n\n到目前为止，本章涵盖了很多内容。在之前关于 PHP 表单处理的节中，你学习了\
  \ `$_GET` 和 `$_POST` 超全局变量。在本节中，我们将讨论另一个全局变量 `$_SESSION`。在 PHP 中，会话（session）是一种可以在多个页面间访问的信息存储方式；这些信息存储在\
  \ `$_SESSION` 超全局中。与 `$_GET` 和 `$_POST` 超全局变量一样，`$_SESSION` 超全局是一个关联数组。该数组存储在服务器上，并在会话持续期间对网站上的所有页面可用。为了演示会话的使用，我们需要创建两个页面：`session.php`\
  \ 和 `session2.php`。我们现在就开始。\n\n首先，在 `htdocs` 中创建一个名为 `session.php` 的新文件，并向其中添加以下代码（添加行号是为了参考）：\n\
  \n```php\n1 <?php\n2 session_start();\n3\n4 $_SESSION['myFavFood'] = 'Pizza';\n\
  5 $_SESSION['myFavDrink'] = 'Cola';\n6 $_SESSION['myFavColor'] = 'Orange';\n7\n\
  8 #updating a session variable\n9 $_SESSION['myFavDrink'] = 'Beer';\n10\n11 #deleting\
  \ a session variable\n12 unset($_SESSION['myFavColor']);\n```\n\n在这里，我们在第 2 行使用名为\
  \ `session_start()` 的内置函数来启动一个新会话。如果尚未创建会话，该函数将创建一个新会话；如果已存在，则恢复当前会话。每个创建会话都与自动生成的唯一会话\
  \ ID 相关。创建会话后，我们分别使用 `'myFavFood'`、`'myFavDrink'` 和 `'myFavColor'` 作为键将字符串 `'Pizza'`、`'Cola'`\
  \ 和 `'Orange'` 存储到 `$_SESSION` 超全局中。接下来，我们在第 9 行通过为其分配一个新字符串来更新 `$_SESSION['myFavDrink']`\
  \ 的值。最后，在第 12 行，我们使用另一个名为 `unset()` 的内置函数来删除 `$_SESSION` 超全局中的一个元素。要使用此函数，我们将想要销毁的元素名称传递给函数。元素被销毁后，我们将无法再次访问它。\n\
  \n接下来，让我们在 `htdocs` 中创建另一个名为 `session2.php` 的文件，并向其中添加以下代码：\n\n```php\n<?php\nsession_start();\n\
  echo '<BR>Food: '.$SESSION['myFavFood']; \necho '<BR>Drink: '.$SESSION['myFavDrink'];\
  \ \necho 'Color: '.$SESSION['myFavColor']; \n```\n\n在这里，我们通过调用 `session_start()`\
  \ 函数开始恢复当前会话。每当我们想要访问 `$_SESSION` 超全局时，都需要调用此函数。接下来，我们使用三个 `echo` 语句输出存储在 `$_SESSION`\
  \ 中的值。\n\n现在，我们准备好演示会话是如何工作的。要做到这一点，首先在浏览器中加载 `session.php`。这样做时，`session.php` 会启动一个新的会话并将数据存储到\
  \ `$_SESSION` 超全局中。接下来，在浏览器中加载 `session2.php`。你得到了什么？取决于你的 PHP 服务器设置，你将得到类似所示的输出：\n\
  \nFood: Pizza\nDrink: Beer Notice : Undefined index: myFavColor in …session2.php\
  \ on line 6\nColor:\n\n注意我们为 “myFavColor” 收到了未定义索引提示？这是因为我们在 `session.php` 中使用 `unset()`\
  \ 函数删除了 `$_SESSION['myFavColor']`。除此之外，我们成功地获取了 `$_SESSION['myFavFood']` 和 `$_SESSION['myFavDrink']`\
  \ 的值。这两个值分别在 `session.php` 的 `$_SESSION` 中存储并在 `session2.php` 中获取。这演示了我们如何使用 `$_SESSION`\
  \ 超全局在不同的页面之间存储数据。理解了吗？\n\n除了创建和存储会话数据外，我们还可以销毁会话。我们通常在用户退出网站时这样做。销毁会话，我们使用另一个名为\
  \ `session_destroy()` 的内置函数。要查看此函数如何工作，请在 `htdocs` 中创建一个名为 `session3.php` 的新文件并向其中添加以下代码：\n\
  \n```php\n<?php\nsession_start();\nsession_destroy();\n```\n\n如上述代码所示，我们需要销毁会话之前调用\
  \ `session_start()` 函数来恢复现有会话。接下来，在浏览器中加载 `session3.php`；这会销毁当前会话。最后，再次在浏览器中加载 `session2.php`。你会得到所有索引\
  \ “myFavFood”、“myFavDrink” 和 “myFavColor”均为未定义的输出。这表明会话已不存在。\n\n## 8.3 `$_COOKIE`\n\
  \n\n\n\n太棒了！我们来到了本章的最后一个主题 - Cookie。Cookie 是另一种存储信息的方式，信息可以在网站的多个页面之间进行访问。它本质上是一个存储在用户计算机上的小型文本文件（这与数据存储在服务器上的\
  \ session/会话相反）。\n\n由于 Cookie 存储在用户的计算机上，因此你不应该使用 Cookie 来存储敏感数据，因为恶意用户可能会对其进行操纵。此外，用户的浏览器也可能会禁用\
  \ Cookie。因此，如果要存储的信息至关重要或敏感，你应该使用 session 代替 Cookie。\n\n要创建一个 Cookie，我们使用 `set_cookie()`\
  \ 函数。与在第 3.3 节中介绍的 `header()` 函数类似，`set_cookie()` 函数必须在脚本生成任何输出之前调用。如果你没有这样做，将会得到“Cannot\
  \ modify header information headers already sent”（无法修改已发送头部信息）的警告，且 Cookie 将无法设置。你的代码在本地计算机上运行时可能可能正常工作，但当你将其上传到托管公司的服务器时，它将失效。\n\
  \n`set_cookie()` 函数最多接受七个参数；只有第一个是强制性的。我们通常为函数提供前三个参数，即 Cookie 的名称、Cookie 的值以及 UNIX\
  \ 时间戳格式的过期日期。让我们来看一个示例。在 `htdocs` 中创建一个名为 `cookie.php` 的文件并添加以下代码：\n\n```php\n<?php\
  \  \n\nsetcookie('userName', 'Joy', time() + 120); #modifying a cookie  \n\nsetcookie('userAge',\
  \ 25, time() + 3600); setcookie('userAge', 26, time() + 3600); #deleting a cookie\
  \  \n\nsetcookie('userLevel', 3, time() + 3600); setcookie('userLevel', 3, time()\
  \ - 3600); \n```\n\n在这里，我们设置了三个 Cookie：`userName`、`userAge` 和 `userLevel`。对于第一个\
  \ Cookie (`userName`)，它的值和过期日期分别为 'Joy' 和 `time() + 120`。`time()` 是一个内置函数，用于提供当前的\
  \ Unix 时间戳；`time() + 120` 意味着 Cookie 将在设置 120 秒（即 2 分钟）后过期。\n\n接下来，我们有 `userAge`\
  \ Cookie。这个 Cookie 被设置了两次。当一个 Cookie 被设置多次时，新的 Cookie 会覆盖之前的。因此，`userAge` 的值从 25\
  \ 更新为 26。\n\n最后，我们有 `userLevel` Cookie。这个 Cookie 的初始过期时间为 `time() + 3600`。然而，它随后被更新为过期时间\
  \ `time() - 3600`。当 Cookie 的过期时间在过去时，它会被删除。\n\n现在让我们来看如何访问这些每一个 Cookie。我们使用 `$_COOKIE`\
  \ 超全局变量来实现。在 `htdocs` 中创建另一个名为 `cookie2.php` 的文件并添加以下代码：\n\n```php\n<?php  \n\n\
  echo 'User Name is.'$_COOKIE['userName']; echo '<BR>User Age is.'$_COOKIE['userAge'];\
  \ echo 'User Level is.'$_COOKIE['userLevel']; \n```\n\n我们现在准备好测试我们的脚本了。首先，在浏览器中运行\
  \ `cookie.php`。当你这样做时，你将看到结果。\n\n\n\n在构造函数内部，我们分别用 `$pId`、`$pTitle` 和 `$pRentalPrice`\
  \ 的值初始化 `$id`、`$title` 和 `$rentalPrice`。注意上面代码中的新关键字 `$this` 吗？我们将在下一节学习创建对象时再解释这个关键字。现在，只需要知道，每当我们想在类内部访问类的属性和方法时，我们需要使用\
  \ `$this` 关键字，后跟 `->` 运算符。接下来，让我们为我们的 `Movie` 类添加一个普通方法（即非魔术方法）。在 `construct()`\
  \ 方法之后（但在 `Movie` 类的结束大括号之前）添加以下方法：\n\n```php\npublic function conversion($country){\n\
  \  $rate = 1;\n  switch($country){\n    case 'UK':\n      $rate = 0.76;\n      break;\n\
  \    case 'Japan':\n      $rate = 110;\n      break;\n  }\n  return round($rate*$this->rentalPrice,\
  \ 2); }\n```\n在这里，我们定义了一个名为 `conversion()` 的方法。该方法有一个参数 `$country` —— 并根据 `$country`\
  \ 的值将美元转换为镑或日元。在方法内部，我们声明并初始化了一个名为 `$rate` 的变量，并使用 `switch` 语句根据 `$country` 的值更新其值。接下来，我们将\
  \ `$rate` 与 `$rentalPrice` 属性相乘（`$rate*$this->rentalPrice`），并将结果作为参数传递给名为 `round()`\
  \ 的内置函数。该函数接受两个参数，并将第一个参数舍入到第二个参数指定的精度。在我们的方法中，我们将乘积保留到 2 位小数。最后，我们使用 `return` 关键字返回\
  \ `round()` 函数的结果。\n\n在方法内部，注意我们没有使用 `$this` 关键字来访问 `$country` 和 `$rate` 吗？这是因为\
  \ `$country` 是一个参数，而 `$rate` 是一个局部变量（即在方法内部定义的变量）。换句话说，它们不是类的属性。我们只在访问类属性和方法时才使用\
  \ `$this` 关键字。例如，我们使用 `$this` 关键字来访问 `$rentalPrice` 属性。明白了吗？一旦你将 `conversion()`\
  \ 方法添加到 `Movie` 类中，我们的类就完整了。我们现在准备好使用这个类了。为了做到这一点，我们需要从它创建一个对象。\n\n### 9.3 创建对象\n\
  要创建一个对象，我们使用 `new` 关键字。对象也被称为类的实例，创建对象的过程被称为类的实例化。在 Bracket 中创建一个新文件并将其保存为 `chap9.php`，到你的\
  \ htdocs 文件夹中。在 `chap9.php` 中添加以下代码：\n\n```php\n<?php\ninclude 'Movie.php';\n$mov1\
  \ = new Movie('N0001', 'Lusso', 4.99);\n```\n在这里，我们首先使用 `include` 语句包含 `Movie.php`（包含\
  \ `Movie` 类的代码）。接下来，我们使用 `new` 关键字创建一个名为 `$mov1` 的 `Movie` 对象，并将 `'N0001'`、`'Lusso'`\
  \ 和 `4.99` 作为参数传递给 `construct()` 方法。\n\n由于 `construct()`一个魔术方法，我们不通过它的名称调用它。相反，当我们创建一个新的\
  \ `Movie` 对象时，PHP 会自动寻找 `construct()` 方法并为我们执行。还记得我们 `Movie` 类构造函数中的 `$this` 关键字吗？`$this`\
  \ 指向当前对象。当我们使用语句 `$mov1 = new Movie('N0001', 'Lusso', 4.99)` 创建 `$mov1` 时，`$this`\
  \ 指向 `$mov1`。换句话说，当 PHP 执行构造函数时，构造函数中的语句：\n\n```php\n$this->id = $pId;\n```\n变为\n\
  \n```php\n$mov1->id = 'N0001';\n```\n结果是值 `'N0001'` 被赋值给 `$mov1` 的 `$id` 属性。构造函数中的另外两个赋值语句也是如此。因此，值\
  \ `'Lusso'` 和 `4.99` 分别赋值给 `$mov1` 的 `$title` 和 `$rentalPrice` 属性。接下来，让我们使用下面的语句创建名为\
  \ `$mov2` 的第二个 `Movie` 对象：\n\n```php\n$mov2 = new Movie('P0002', 'Junior', 5.99);\n\
  ```\n当 PHP 创建 `$mov2` 并调用构造函数时，`$this` 指向 `$mov2`。因此，构造函数中的语句：\n\n```php\n$this->id\
  \ = $pId;\n```\n变为\n\n```php\n$mov2->id = 'P0002';\n```\n构造函数中的另外两个赋值语句也是如此。结果是值\
  \ `'P0002'`、`'Junior'` 和 `5.99` 分别赋值给 `$mov2` 的 `$id`、`$title` 和 `$rentalPrice`\
  \ 属性。明白了吗？很好！继续。\n\n### 9.4 访问类成员\n创建对象后，我们可以使用对象名和 `->` 运算符来访问它的属性和方法。例如，要在 `chap9.php`\
  \ 中访问 `$mov1` 的属性和方法，我们使用下面的代码：\n\n```php\necho $mov1->title.'<BR>';\necho $mov1->conversion('Japan').'<BR>';\n\
  ```\n在这里，我们首先使用 `->` 运算符访问 `$mov1` 的 `$title` 属性。接下来，我们使用 `->` 运算符调用 `conversion()`\
  \ 方法，并将 `'Japan'` 作为参数。将上述代码添加到 `chap9.php`（在实例化语句之后）并加载页面，你将得到：\n\n```\nLusso\n\
  548.9\n```\n非常直观吧？\n\n现在，假设我们要访问 `Movie` 类中的 `DISCOUNT` 常量，该怎么做？访问类常量不使用 `->` 运算符。相反，我们使用\
  \ `::` 运算符。这是因为类常量与类属性不同；它们每个类分配一次，而不是每个对象一次。这意味着同一类的所有对象（在我们示例中的 `$mov1` 和 `$mov2`）共享相同的常量。换句话说，即使有\
  \ 100 个 `Movie` 对象，也只有一个内存用于存储 `DISCOUNT` 常量。要访问 `Movie` 类中的 `DISCOUNT` 常量，在 `chap9.php`\
  \ 中添加以下代码：\n\n```php\necho Movie::DISCOUNT.'<BR>';\necho $mov1::DISCOUNT.'<BR>';\n\
  echo $mov2::DISCOUNT.'<BR>';\n```\n如果你运行上述代码，你会得到：\n\n```\n10\n```\n三次。这表明可以使用类名（Movie）或对象名（$mov1\
  \ 或 $mov2）来访问类常量。这三者都都提供了相同的值，因为它们访问的是同一个内存位置。\n\n### 9.5 访问修饰符\n现在我们知道如何创建对象并使用这些对象访问类成员，让我们讨论一下之前跳过的概念：`public`\
  \ 和 `private` 关键字。这两个关键字被称为访问修饰符；它们是守门员，控制我们可以在哪里访问特定的类成员。`public` 类成员可以在任何地方访问，而\
  \ `private` 类成员只能在定义的类内部访问。在我们的 `Movie` 类中，有两个 `public` 属性（$title` 和 `$rentalPrice`）和一个\
  \ `private` 属性（$id`）。之前，我们学习了在 `chap9.php` 中访问 `$mov1` 的 `$title` 属性。由于 `$title`\
  \ 是公有类属性，我们在 `chap9.php` 中访问它没有遇到问题。现在，让我们尝试访问 `$id` 属性。添加这一行：\n\n```php\necho $mov1->id.'<BR>';\n\
  ```\n\n\n\n回到 `chap9.php` 并重新加载页面。你得到了什么？输出中多了一句 `Fatal error: Uncaught Error: Cannot\
  \ access private property Movie::$id...`，对吧？这是因为 `$id` 是一个私有（private）属性。私有类成员只能在声明它们的类内部进行访问，我们不允许在\
  \ `chap9.php` 中访问 `$id` 属性，因为它在 `Movie` 类的外部。这就是访问修饰符的工作原理；它们本质上控制了我们是否可以在声明该成员的类外部访问特定的类成员。理解了吗？\n\
  \n在 PHP 中，访问修饰符对于属性是强制性的，但对于方法来说是可选的。如果我们没有为属性声明修饰符，将会得到错误消息。如果我们不为方法声明修饰符，默认修饰符为\
  \ `public`。从 PHP `7.1.0` 开始，我们还可以为类常量添加访问修饰符。如果我们不为常量声明修饰符，默认是 `public`。除了 `public`\
  \ 和 `private` 成员外，PHP 还有 `protected`（保护）成员。这些成员可以在声明它们的类内部以及继承该类的任何子类中访问。我们将在下一章讨论\
  \ `protected` 成员和继承。\n\n此时，你们中的一些人可能疑惑为什么我们想让类成员变为 `private`。例如，如果我们无法访问 `$id` 属性，为什么要费劲声明它呢？原因是，虽然私有成员不能在声明它的类外部访问，但在类内部是可以访问的。例如，我们可以在\
  \ `Movie` 类内部写一个函数，根据 `$id` 属性显示页面标题。要查看它是如何工作的，请将以下代码添加到 `Movie.php` 中（在 `conversion()`\
  \ 方法之后，`Movie` 类的结束大括号之前）：\n\n```php\npublic function displayHeading($tag){ if (substr($this->id,\
  \ 0, 1) == 'N') return \"<$tag>Movies</$tag>\"; else return \"<$tag>Award Winning\
  \ Movies</$tag>\"; }\n``` 此方法使用内置的 `substr()` 函数检查 `$id` 是否以 'N' 开头。如果是，它将返回一个包含“Movies”一词的\
  \ HTML 元素（由参数 `$tag` 定义为 `<tag>Movies</tag>`）；如果不是，它将返回一个包含“Award Winning Movies”一词的元素。接下来，将\
  \ `chap9.php` 中的行 `echo $mov1->id.'<BR>';` 替换为 `echo $mov1->displayHeading('H1');`。由于\
  \ `displayHeading()` 是一个 `public` 方法，我们在类外部访问它没有问题。如果你现在运行代码，将看到“Movies”作为一个 `<h1>`\
  \ 元素显示出来。理解了吗？\n\n## 9.6 Getter 和 Setter\n\n在上一节节中，我们讨论了 `public` 和 `private` 类成员之间的区别。只要可能，如果类外部的代码不需要访问这些成员，我们就应该将类成员声明为\
  \ `private`。这种防止外部代码不必要访问类成员的行为被称为封装（encapsulation）。封装使我们能够轻松更改类成员，而不影响类外部的代码。例如，如果我们想将\
  \ `Movie` 类中的 `$id` 属性名称改为 `$movieID`，我们只需要在 `Movie` 类内部进行更改，类外的任何代码都不会受到影响。这是将类属性声明为\
  \ `private` 的优点之一。\n\n将类属性声明为 `private` 的另一个优点是它可以防止对对象属性进行未经授权的修改。为了了解为什么，请将以下代码添加到\
  \ `chap9.php` 中：\n\n```php\n$mov1->rentalPrice = -20;\necho $mov1->rentalPrice.'<BR>';\n\
  ``` 这里，我们首先将 `-20` 分配给 `$mov1` 的 `$rentalPrice` 属性。接下来，我们使用 `echo` 输出它的值。如果你运行上面的代码，将得到输出\
  \ -20。如你所示，我们成功地将 `$mov1` 的 `$rentalPrice` 属性更改为 -20。这是因为 `$rentalPrice` 是一个 `public`\
  \ 属性。因此，我们可以在 `Movie` 类之外访问它并将其更改为任何值。这不是想要的，因为租金不应该是负数。\n\n为了防止此类修改发生，我们不应该将 `$rentalPrice`\
  \ 属性声明为 `public`。相反，我们应该将其声明为 `private`。尝试在 `Movie.php` 中将 `$rentalPrice` 属性改为 `private`\
  \ 并再次运行 `chap9.php`，你得到了什么？你得到了类似下面的输出，对吧？\n\n`Fatal error: Uncaught Error: Cannot\
  \ access private property Movie::$rentalPrice in…`\n\n由于它现在是 `private` 属性，我们不再允许访问和修改\
  \ `$mov1` 的 `$rentalPrice` 属性。\n\n只要可能，我们应该始终将类属性声明为 `private`；这有助于防止对它们的任何未经授权的访问或修改。然而，如果我们将所有类属性声明为\
  \ `private`，如果类外部的代码需要访问或修改这些属性会怎样？在这种情况下，我们可以使用 getters 和 setters。这些魔方法允许我们对 `private`\
  \ 和 `protected` 属性提供限制且受控的访问。要查看其原理，请将以下方法添加到 `Movie.php`（在 `displayHeading()` 方法之后，`Movie`\
  \ 类的结束大括号之前）：\n\n```php\npublic function get($propertyRequested){ if ($propertyRequested\
  \ == 'id') return 'You do not have permission to access id.<BR>'; else return $this->$propertyRequested;\
  \ }\npublic function set($propertyToModify, $value){ if ($propertyToModify == 'rentalPrice'\
  \ && $value > $this->rentalPrice) $this->rentalPrice = $value; else echo 'Failed\
  \ to modify '.$propertyToModify.'<BR>'; }\n```\n\n `get()` 方法被称为 getter；它控制哪些属性可以被访问，并且有一个参数\
  \ `$propertyRequested`，该参数存储我们想要访问的属性名称。在 `get()` 方法内部，我们使用 `if-else` 语句检查 `$propertyRequested`\
  \ 是否等于 'id'。如果是，返回“You do not have permission to access id.”；否则返回 `$this->$propertyRequested`。\n\
  \n接下来 `set()` 方法被称为 setter；它控制哪些属性可以被修改。它有两个参数；第一个存储要修改的属性名称（`propertyToModify`），第二个存储要赋值给该属性的新值（`value`）。在我们的\
  \ `set()` 方法内部，我们使用 `if-else` 语句检查 `$propertyToModify` 是否等于 'rentalPrice' 且 `$value`\
  \ 是否大于 `$this->rentalPrice`。如果两个条件都满足，允许我们修改 `$rentalPrice`；否则，输出“Failed to modify\
  \ [属性名]”。理解了吗？很好！现在，让我们看看如何使用 getters 和 setters。要做到这一点，我们只需使用 `->` 运算符，后跟属性名。在后台，只要我们定义了\
  \ `get()` 和 `set()` 方法，PHP 就会自动调用这些魔方法。\n\n首先，让我们将 `Movie` 类中所有属性的访问修饰符改为 `private`。接下来，再次加载\
  \ `chap9.php`。记得之前尝试将 `$mov1` 的 `$rentalPrice` 属性更改为 -20 并得到了致命错误吗？如果你现在加载 `chap9.php`，将不再得到错误。相反，你将得到以下输出：\n\
  \n`Failed to modify rentalPrice`\n`4.99`\n\n这是因为我们定义了 `get()` 和 `set()` 方法。当我们尝试修改\
  \ `$rentalPrice` 属性的值时，PHP 会自动调用 `set()` 方法。由于 -20 小于当前的 `$rentalPrice` 值（即 4.99），我们的\
  \ `set()` 方法阻止了我们更改 `$rentalPrice` 值。当我们使用 `echo` 语句输出 `$rentalPrice` 值时，`get()`\
  \ 方法为提供了 4.99 作为输出。\n\n接下来，将以下代码添加到 `chap9.php` 并再次运行页面：\n\n```php\n$mov1->id =\
  \ 'A12387';\necho $mov1->id;\n```\n你将得到\n\n`Failed to modify id`\n\n\n\n\n你没有权限访问已添加到输出中的\
  \ id。在这里，`set()` 方法阻止了我们修改 `$id` 属性。同样，`get()` 方法阻止了我们访问 `$id` 属性。最后但同样重要的一是，将以下代码添加到\
  \ `chap9.php` 并运行该页面：\n\n```php\n$mov1->rentalPrice = 5.99;\necho $mov1->rentalPrice;\n\
  ```\n\n你会在输出中看到增加了 5.99。在这里，我们尝试将 `$rentalPrice` 的值改为 `5.99`。由于 `5.99` 大于当前的 `$rentalPrice`\
  \ 值，`set()` 方法允许我们进行此更改。当我们再次使用 `echo` 语句输出 `$rentalPrice` 的值时，`get()` 方法返回了 5.99\
  \ 作为输出。\n\n明白了吗？太棒了！\n\n## 9.7 输出对象的字符串表示\n\n除了 `set()` 和 `get()` 方法之外，PHP 中另一个常用的魔术方法是\
  \ `toString()` 方法。让我们在 `Movie` 类中添加一个。\n\n将以下代码添加到 `Movie.php` 中（位于 `set()` 方法之后，`Movie`\
  \ 类的结束括号之前）：\n\n```php\npublic function toString(){\n    return\n    'Discount =\
  \ '.self::DISCOUNT.'%'.\n    '<BR>Id = '.$this->id.\n    '<BR>Title = '.$this->title.\n\
  \    '<BR>Rental Price (USD) = '.$this->rentalPrice; }\n```\n\n此方法简单地返回一个包含 `Movie`\
  \ 类相关信息的字符串。注意到上面方法中的新关键字 `self` 吗？这个关键字用于访问早先在类中定义的 `DISCOUNT` 常量。之前我们学过，为了访问定义该常量的类之外的常量，可以使用类名或对象名。例如，在\
  \ `chap9.php` 中，我们使用 `$mov1::DISCOUNT`、`$mov2::DISCOUNT` 和 `Movie::DISCOUNT` 来访问\
  \ `DISCOUNT` 常量。如果我们想在 `Movie` 内部内部（即在定义它的类内部）访问这个常量呢？要做到这一点，我们可以使用类名或 `self` 关键字。在上面的\
  \ `toString()` 方法中，我们使用了 `self` 关键字。或者，我们也可以使用类名 `Movie::DISCOUNT`。在声明 `toString()`\
  \ 方法后，我们就可以用它来打印 `Movie` 类对象的字符串表示。要实现这一点，我们只需使用 `echo` 语句即可。为了查看它是如何工作的，将以下几行添加到\
  \ `chap9.php` 并再次运行页面：\n\n```php\necho '<BR>';\necho $mov1;\n```\n\n你会在输出中看到 Discount\
  \ = 10%\nId = N0001\nTitle = Lusso\nRental Price (USD) = 5.99\n\n# 第 10 章：继承\n\n\
  在上一章节中，我们涵盖了面向对象编程（OOP）的基础知识。OOP 中的一些概念对初学者来说可能有些难以理解。如果这是你第一次接触 OOP，你可能需要多读几遍之前的章节以完全掌握这些概念。一旦你熟悉了第\
  \ 9 章涵盖的主题，我们就可以开始学习 OOP 中一个更高级但同样重要的概念——继承。正如其名所示，继承涉及到两个或多个类之间的关系。通过继承，可以声明类，使得其中一个类是另一个类的子类（也称为子类），而另一个被称为父类或基类。这使我们能够将相关的类组合在一起。解释继承最简单的方法就是看例子。\n\
  \n## 10.1 编写子类\n\n我们将使用第 9 章中的 `Movie` 类作为父类来进行说明。打开编辑器并创建一个名为 `AwardWinningMovie.php`\
  \ 的新文件。在 htdocs 文件夹中将以下代码添加到 `AwardWinningMovie.php`：\n\n```php\n<?php\ninclude\
  \ \"Movie.php\";\n\nclass AwardWinningMovie extends Movie{ private $award;\n\n \
  \   public function construct($id, $title, $rentalPrice, $award){\n        parent::construct($id,\
  \ $title, $rentalPrice);\n        this->award = $award;\n    }\n\n    public function\
  \ recommend($country){\n        switch ($this->award){\n            case 'Best Picture':\n\
  \                $others = 'The Rail';\n                break;\n            case\
  \ 'Best Actor':\n                $others = '1729';\n                break;\n   \
  \         default:\n                $others = 'And so begins';\n        } return\n\
  \        'You might like:<BR>'.\n        '<BR>Title = '.$others;\n    }\n}\n```\n\
  \n在这里，我们使用了 `Movie` 类作为父类。现在，我们在 `chap9.php` 中添加以下代码并运行：\n\n```php\n$mov1 = new\
  \ AwardWinningMovie('N0001', 'Lusso', 5.99, 'Best Picture');\n\necho $mov1;\n```\n\
  \n你会在输出中看到 Discount = 10%\nId = N0001\nTitle = The Rail\nRental Price (USD) = 5.99\n\
  \n\n\n\n作为输出。简单直接吧？\n\n## 10.3 重新回顾访问修饰符\n\n很好！现在让我们重新回顾访问修饰符的概念。之前我们提到，当一个类扩展另一个类时，它会继承所扩展类的所有公共（public）和受保护（protected）类成员。这意味着它可以直接访问这些成员而不受任何限制。然而，这并不适用于私有（private）类成员。子类不允许直接访问父类的私有成员。\n\
  \n为了理解这意味着，尝试将 `Movie` 类中的 `conversion()` 方法更改为私有方法。换句话说，将 `Movie.php` 中的行：\n\n\
  ```php\npublic function conversion($country)\n```\n\n改为：\n\n```php\nprivate function\
  \ conversion($country)\n```\n\n接下来，再次加载 `chap10.php`。你得到了什么？你会收到类似下面输出的错误信息，对吧？\n\
  \n`Fatal error: Uncaught Error: Call to private method Movie::conversion() from\
  \ context 'AwardWinningMovie'...`\n\n这是因为当 `conversion()` 是私有方法时，我们不允许在定义它的类之外（即\
  \ `Movie` 类之外）直接访问它。因此，`AwardWinningMovie` 类中的 `recommend()` 方法不允许访问它。\n\n接下来，将\
  \ `conversion()` 更改为受保护方法并再次加载 `chap10.php`。现在一切都正常了，对吧？这是因为子类允许直接访问父类中的受保护成员。因此，`AwardWinningMovie`\
  \ 类中的 `recommend()` 方法现在允许访问 `Movie` 类中的 `conversion()` 方法。\n\n明白了吗？太棒了！将 `conversion()`\
  \ 更改为受保护方法后，注意我们只允许在声明它的类以及继承该类的任何子类内部直接访问它。换句话说，我们只能在 `Movie` 和 `AwardWinningMovie`\
  \ 类内部直接访问它。\n\n回想起我们之前在 `chap9.php` 中访问该方法了吗？当 `conversion()` 是公共方法时，这是没问题的。现在它是一个受保护方法，如果你再次加载\
  \ `chap9.php`，将会得到错误。如果你想直接访问 `chap9.php` 中的 `conversion()` 方法，你必须将其改回公共方法。\n\n\
  ## 10.4 重写\n\n现在你已经熟悉了子类和继承，让我们来讨论重写（overriding）的概念。当子类修改它从父类继承的方法时，就会发生重写。为了说明这意味着，请在\
  \ `chap10.php` 中添加以下行并加载页面：\n\n```php\necho $awm->displayHeading('H1');\n```\n\n\
  你将看到“Award Winning Movies”作为 `<H1>` 标题显示。在这里，我们调用了在父类中定义的 `displayHeading()` 方法。该方法是子类继承的公共方法。因此，我们可以使用\
  \ `AwardWinningMovie` 对象访问它。\n\n接下来，让我们看看如果在子类内部编写一个 `displayHeading()` 方法的新版本会发生什么。为了实现这一点，在\
  \ `AwardWinningMovie` 类中、`recommend()` 方法之后、类结束大括号之前添加以下方法：\n\n```php\npublic function\
  \ displayHeading($tag){\n    $baseMsg = parent::displayHeading($tag); \n    return\
  \ $baseMsg.$this->award; \n}\n```\n\n在这里，我们声明了一个与父类方法相同名称（`displayHeading`）和参数列表（`$tag`）的方法。当这种情况发生时，我们说子类方法重写了父类方法。在子类内部，我们使用\
  \ `parent::displayHeading($tag)` 来调用父类方法。\n\n最后，我们将 `$baseMsg` 与 `$this->award`\
  \ 拼接。如果你再次加载 `chap10.php`，你只会看到“Award Winning Movies”作为 `<H1>` 标题显示。\n\n\n\n\n`(dbname=pawszone\
  \ )`。第二个参数是用户名 (`\"pz_admin\"`)，第三个是密码 (`\"ABCD\"`）。创建此对象后，我们将其赋值给名为 `$pdo` 的变量，并在下一行使用\
  \ `$pdo` 来调用 `setAttribute()` 方法。`setAttribute()` 方法允许我们设置 `PDO` 对象的属性。在这里，我们正尝试设置错误模式。默认情况下，在成功连接后，`PDO`\
  \ 不会通知我们随后发生的任何错误。例如，如果我们尝试从一个不存在的表中查询数据，`PDO` 不会我们我们这样的表。相反，我们将得到一个没有结果的页面。如果我们正试图找出错误出在哪里，这会非常令人沮丧。为了让\
  \ `PDO` 通知我们任何问题，我们需要使用 `setAttribute()` 方法来配置错误模式。为了做到这一点，我们向该方法传递两个预定义的常量。第一个常量告诉\
  \ `PDO` 我们想要设置的属性，第二个常量告诉 `PDO` 我们想要设置的值。您可以在此处找到所有预定义的 `PDO` 常量的列表：\n\nhttps://www.php.net/manual/en/pdo.constants.php\n\
  \n在我们的示例中，我们想将错误模式属性 `(PDO::ATTR_ERRMODE)` 设置为 `PDO::ERRMODE_EXCEPTION`。在这种模式下，当发生错误时，`PDO`\
  \ 会抛出一个异常。我们将在下一章学习更多关于异常的知识。现在，只需可以使用此异常中的信息找出出了什么问题即可。就是！这就是连接数据库所需的所有操作。连接到数据库后，我们就可以准备好向它发送查询了。\n\
  \n## 11.3 SQL 注入\n\nMySQL 主要有两种查询类型——从数据库返回数据的（例如 `SELECT`）和不返回数据的（例如 `CREATE`、`INSERT`、`UPDATE`\
  \ 和 `DELETE`）。发送不返回数据查询最简单的方法是使用 `exec()` 方法，而发送返回数据查询简单的方法是使用 `query()` 方法。然而，这两种方法都让我们面临一种被称为\
  \ SQL 注入的攻击风险。还记得我们在第 8.1.6 节中讨论过跨站脚本吗？SQL 注入与其相似，黑客可以向我们的网站输入数据并利用它来黑入我们的数据库。假设我们有一个名为“ownerName”的文本字段，并且想从数据库中名为“pets”的表中选择行，可以使用下面的代码：\n\
  \n```php\n$owner = $_POST['ownerName'];\n$sql = \"SELECT * FROM pets WHERE owner\
  \ = '$owner'\";\n$stmt = $pdo->query($sql);\n```\n\n如果上面的代码目前还没有意义，请担心。我们稍后会讨论查询数据库的更好方法。现在，只需知道在上面的代码中，我们将用户输入\
  \ `$_POST['ownerName']` 用于我们的 SQL `SELECT` 语句，并使用 `query()` 方法执行该语句。如果我们的用户在“ownerName”文本字段中输入\
  \ `Jamie`，`SELECT` 语句变为 `SELECT * FROM pets WHERE owner = 'Jamie'`，一切都按预期运行。\n\n\
  然而，假设用户在文本字段中输入 `Jamie' OR owner != 'Jamie`，则 `SELECT` 语句变为 `SELECT * FROM pets\
  \ WHERE owner = 'Jamie' OR owner != 'Jamie'`。当我们使用 `query()` 方法执行此语句时，PHP 将用户输入中的单词“OR”解释为\
  \ SQL 运算符 `OR`。因此，它返回了“pets”表中的所有行，因为 `owner = 'Jamie' OR owner != 'Jamie'` 涵盖了“owner”列的所有可能值。这绝对不是我们想要的。\n\
  \n与其使用 `query()` 或 `exec()` 方法执行 SQL 语句，更好的方法是使用准备语句。\n\n## 11.4 准备语句\n\n使用准备语句涉及几个步骤：\n\
  1. 使用占位符创建 SQL 语句\n2. 准备语句\n3. 将变量或值绑定到占位符\n4. 执行语句\n5. 如果需要获取返回的任何数据\n\n### 步骤\
  \ 1：使用占位符创建 SQL 语句\n\n在使用准备语句时，我们需要使用占位符来替换 SQL 语句中包含用户输入的任何变量。这些占位符可以是命名的也可以是非命名的。未命占位符用问号\
  \ `?` 表示。例如，如果我们想使用用户输入的名为“owner”和“petname”的两个列从“pets”表中查询信息，可以使用下面的 SQL 语句：\n\n\
  ```php\n$sqlUnnamed = \"SELECT * FROM pets WHERE owner = ? AND petname = ?\";\n\
  ```\n\n在这里，我们使用问号 (`?`) 替换 SQL 语句中的用户输入，并将该语句赋值给名为 `$sqlUnnamed` 的变量。或者，我们可以像下面所示使用命名的占位符：\n\
  \n```php\n$sqlNamed = \"SELECT * FROM pets WHERE owner = :owner AND petname = :pname\"\
  ;\n```\n\n在这里，我们使用 `:owner` 和 `:pname` 替换用户输入，并将语句赋值给名为 `$sqlNamed` 的变量。\n\n###\
  \ 步骤 2：准备语句\n\n创建语句后，我们需要对其进行准备。准备语句意味着提前将语句发送到数据库服务器，让服务器有机会分析、编译并优化其执行计划。实际执行并未发生在这一步。为了准备语句，我们使用\
  \ `prepare()` 方法。这是 `PDO` 类中的内置方法，返回一个 `PDOStatement` 对象。假设我们有一个名为 `$pdo` 的 `PDO`\
  \ 对象，为了准备 `$sqlUnnamed` 语句，我们写：\n\n```php\n$sqlUnnamed = $pdo->prepare($sqlUnnamed);\n\
  ```\n\n在这里，我们使用 `$pdo` 调用 `prepare()` 方法并将返回的对象赋值给变量 `$sqlUnnamed`。为了准备 `$sqlNamed`\
  \ 语句，我们写：\n\n```php\n$sqlNamed = $pdo->prepare($sqlNamed);\n```\n\n在这里，我们将返回的对象赋值给变量\
  \ `$sqlNamed`。准备好语句后，我们将不再使用 `$pdo` 对象。相反，我们将在后续步骤中使用 `PDOStatement` 对象（即 `$sqlUnnamed`\
  \ 和 `$sqlNamed`）。\n\n### 步骤 3：将值绑定到占位符\n\n在步骤 3 中，我们需要将值绑定到 SQL 语句中的占位符上。这告诉数据库服务器在执行语句时用哪些值替换占位符。我们可以使用\
  \ `bindValue()` 或 `bindParam()` 方法将值绑定到占位符。两种方法都很相似，但 `bindValue()` 往往更通用。在随后的示例中使用我们将\
  \ `bindValue()` 方法。\n\n要将值绑定到未命名占位符，我们通常向 `bindValue()` 方法提供两个信息——占位符的位置和要绑定的值。占位符的位置从\
  \ 1 开始。记得我们有一个定义并准备好的名为 `$sqlUnnamed` 的 `SELECT` 语句：\n\n```php\n$sqlUnnamed = \"\
  SELECT * FROM pets WHERE owner = ? AND petname = ?\";\n$sqlUnnamed = $pdo->prepare($sqlUnnamed);\n\
  ```\n\n假设我们要将名为 `$myPet` 的用户输入绑定到 `$sqlUnnamed` 中的第二个问号，我们可以这样做：\n\n```php\n$sqlUnnamed->bindValue(2,\
  \ $myPet);\n```\n\n在这里，我们使用 `$sqlUnnamed` 调用 `bindValue()` 方法。第一个参数 (`2`) 表示我们正将值绑定到第二个占位符（即“petname”列的占位符），而第二个参数\
  \ (`$myPet`) 表示要绑定的值。要将值绑定到命名的占位符，我们用占位符的名字替换第一个参数。例如，如果我们想将 `$myPet` 绑定到 `$sqlNamed`\
  \ 中的 `:pname` 占位符，操作如下：\n\n```php\n$sqlNamed->bindValue(':pname', $myPet);\n```\n\
  \n第一个参数 (`':pname'`) 表示我们正将值绑定到 `:pname` 占位符，而第二个参数 (`$myPet`) 表示要绑定的值。\n\n此时，你们中的一些可能会怀疑\
  \ `$myPet`（存储用户输入）是否让我们面临 SQL 注入攻击的风险。答案是否。这是因为 `PDO` 知道我们正在发送占位符的值；因此，它不会将存储在 `$myPet`\
  \ 中的字符串的任何部分解释为 SQL 代码。例如，即使 `$myPet` 存储了字符串\n\n\n\n'Max' OR petname != 'Max the\
  \ word' 这里的 “OR” 单词、引号以及 `!=` 运算符不会被解析为 SQL 代码。相反，`PDO` 会将整个字符串视为“petname”列的值，并简单地搜索具有该奇怪名字的宠物。明白了吗？\n\
  \n### 第 4 步：执行语句\n在将值绑定到占位符之后，我们需要使用 `PDOStatement` 对象来调用 `execute()` 方法。要执行 `$preparedUnnamed`，我们这样写：\n\
  \n```php\n$preparedUnnamed->execute();\n```\n\n要执行 `$preparedNamed`，我们这样写：\n\n```php\n\
  $preparedNamed->execute();\n```\n\n### 第 5 步：获取返回的数据（如果有）\n执行语句后，我们可以使用 `fetch()`\
  \ 或 `fetchAll()` 方法来获取任何返回数据（如果该语句是 `SELECT` 语句）。`fetch()` 方法逐行获取行，而 `fetchAll()`\
  \ 方法则一次性获取所有行。两种方法在失败时都会返回 `false`。\n\n在使用其中一种方法时，我们可以指定在获取行时希望方法使用的样式。常用的样式包括 `FETCH_ASSOC`\
  \ 和 `FETCH_NUM` 样式。`FETCH_ASSOC` 样式将行作为关联数组（使用表中的列名作为键），而 `FETCH_NUM` 样式将行作为索引数组获取（基于\
  \ `SELECT` 语句返回的列顺序）。\n\n例如，为了获取 `$sqlUnnamed` 的行，我们可以使用以下 `while` 循环：\n\n```php\n\
  while($row = $preparedUnnamed->fetch(PDO::FETCH_NUM)){  \n    echo 'Pet = '.$row[1].'<BR>';\
  \  \n    echo '<BR>Owner = '.$row[0].'<BR>';  \n} \n```\n\n该循环使用赋值语句 `$row = $preparedUnnamed->fetch(PDO::FETCH_NUM)`\
  \ 作为循环条件。这在处理 `PDO fetch()` 方法时是允许的，也是一种常用方法。赋值语句使用 `$preparedUnnamed`（即 `$sqlUnnamed`\
  \ 的预处理语句）调用 `fetch()` 方法，并指定获取样式为 `PDO::FETCH_NUM`。接下来，它将返回的结果赋值给名为 `$row` 的变量。该变量控制\
  \ `while` 循环的何时结束。只要 `$row` 不是 `false`，循环就会继续。\n\n在 `while` 循环内部，我们使用两个 `echo` 语句来显示\
  \ `fetch()` 方法返回的数组值。`row[0]` 为我们提供了 `$sqlUnnamed` 中的第一列（即“owner”列），而 `row[1]` 提供了第二列（即“petname”列）。当我们到达结果集的末尾且\
  \ `fetch()` 方法无法再获取更多行时，它会返回 `false`。此时 `$row` 变为 `false`，`while` 循环随之停止。\n\n除了使用\
  \ `FETCH_NUM` 样式外，我们还可以使用 `FETCH_ASSOC` 样式来获取数据。方法如下：\n\n```php\nwhile($row = $preparedUnnamed->fetch(PDO::FETCH_ASSOC))\
  \ { \n    echo 'Pet = '.$row['petname'].'<BR>';  \n    echo '<BR>Owner = '.$row['owner'].'<BR>';\
  \ \n} \n```\n\n这两个循环给出的输出是相同的；我们稍后会有机会运行它们并查看结果。除了使用 `fetch()` 方法外，我们还可以使用 `fetchAll()`\
  \ 方法一次性从数据库中获取所有行。我们将在书末的项目中这样做。\n\n就是这样。我们已经涵盖了预处理语句的精要。\n\n### 1.5 整合\n要做到这一点，我们首先一个数据库和用户。首先，确保你已经启动了\
  \ XAMP 和 MySQL 服务器。如果你在启动 MySQL 服务器时遇到问题，可能是由于端口冲突。我们现在准备好连接到你刚刚创建的数据库了。\n\n\n\n\
  \n在上面的代码中，我们首先在 A 部分中连接到“pawszone”数据库。接下来，在 B 部分中，我们使用 SQL `CREATE` 语句在数据库中创建一个名为“pets”的表。由于此\
  \ SQL 语句不包含任何占位符，因此我们不需要调用 `bindValue()` 方法。相反，我们只需要简单准备语句并执行它即可。在 C 部分中，我们有一个用于向“pets”表插入数据的\
  \ `INSERT` 语句。我们首先使用 `prepare()` 方法来准备该语句。虽然我们稍后将使用 `for` 循环执行四次 `INSERT` 语句，但请注意，我们只需要准备一次语句。这是使用预处理语句的另一个优势，因为它可以带来更快的执行，特别是当查询复杂或需要运行多次时。准备好语句后，我们声明了三个数组\
  \ `$owner`、`$pname` 和 `$breed`，并将要插入的数据赋值给这些数组。接下来，我们使用 `for` 循环遍历这些数组。循环每次运行时，我们都会将每个数组中的一个值绑定到相关的占位符上。绑定数据后，我们调用\
  \ `execute()` 方法执行 `INSERT` 语句。在 C 部分插入数据后，我们在 D 部分更新了一行数据（owner = “Jamie” 且 petname\
  \ = “Max”），并在 E 部分删除了另一个（owner = “Ted” 且 petname = “Angel”）。这两个部分应该是显而易见的。在继续之前，请仔细阅读并完全理解上面的代码。一旦你清楚了预处理语句的工作原理，就在浏览器中加载页面\
  \ `sql_select.php` 来运行该代码。接下来，访问 `http://localhost/phpmyadmin/` 并选择左侧的“pawszone”数据库。你应该能在右侧看到“pets”表。点击“浏览”，你会得到下面的表格：![](img/image_rsrc1J7.jpg)如你所见，“pets”表已成功创建并已添加数据。明白了吗？接下来，让我们学习如何使用\
  \ PHP 从此表中选取数据并显示在我们的网页上。为此，请创建一个名为 `sql_select.php` 的新文件并添加以下代码。\n\n```php\n<?php\
  \  \n\n//Section A - 连接到数据库\n$pdo = new PDO(\"mysql:host=localhost;dbname=pawszone\"\
  , \"pz_admin\", \"ABCD\");  \n\n$pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\
  \ //Section B - 从 pets 中选择所有行  \n\n$sql = \"SELECT petname, owner FROM pets\"; \
  \ \n\n$stmt = $pdo->prepare($sql);  \n\n$stmt->execute();  \n\nwhile ($row = $stmt->fetch(PDO::FETCH_ASSOC)){\
  \  \n\necho '<BR>Owner = '.$row['owner'].'<BR>';  \n\necho 'Pet Name = '.$row['petname'].'<BR>';\
  \  \n\n}  \n\n$stmt->execute(); while ($row = $stmt->fetch(PDO::FETCH_NUM)){  \n\
  \necho '<BR>Owner = '.$row[1].'<BR>';  \n\necho 'Pet Name = '.$row[0].'<BR>'; }\
  \ \n```\n\n在这里，与之前一样，我们首先在 A 部分中连接到“pawszone”数据库。接下来，在 B 部分中，我们使用 `SELECT` 语句从“pets”表中选取“petname”和“owner”列。执行该语句后，我们使用\
  \ `while` 循环通过 `FETCH_ASSOC` 样式逐行获取行。最后，我们在 `while` 循环内部使用 `echo` 语句显示获取的数据。接下来，我们再次执行\
  \ `SELECT` 语句，并使用另一个 `while` 循环通过 `FETCH_NUM` 样式获取行。如果你在浏览器中加载 `sql_select.php`，你将看到以下输出显示两次：\n\
  \nOwner = En\nPet Name = Boots \n\nOwner = En\nPet Name = Dora \n\nOwner = Jamie\
  \ Pet Name = Max\n\n# 第 12 章：管理错误和异常\n\n我们已经到了项目前的最后一章。在这一章中，我们将学习如何在我们的 PHP 脚本中管理错误和异常。坦率地说，这是\
  \ PHP 中最混乱的领域之一，因为 PHP 区分了异常（exception）和错误（error）。当出现问题时，我们会得到异常或错误。PHP 内部函数在出现问题时主要向我们提供错误信息。另一方面，现代的面向对象扩展（例如我们在上一章中学到的\
  \ `PDO` 扩展）更倾向于使用异常。在本章中，我们将分别讨论异常和错误，然后再对它们进行整合。\n\n## 处理异常\n\n### 什么是异常？\n\n异常是\
  \ PHP 中的一个预定义对象，允许我们在发生不理想的情况时改变执行流。例如，如果我们尝试连接数据库但连接失败了。\n\n要查看异常，请在 `htdocs` 中创建一个名为\
  \ `connect.php` 的文件并添加以下代码：\n\n```php\n<?php\n$pdo = new PDO(\"mysql:host=localhost;dbname=pawszone\"\
  , \"pz_admin\", \"ABCD\");  \n$pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  ```\n\n在这里，我们尝试使用无效用户名连接“pawszone”。接下来，在 `htdocs` 中创建 `exceptionHandling.php` 并添加以下代码：\n\
  \n```php\n<?php \ninclude \"connect.php\"; \necho '<BR>Welcome to szone';\n```\n\
  \n在创建两个文件后，尝试在浏览器中加载 `exceptionHandling.php`（确保 Apache 和 MySQL 正在运行），你得到了什么？你得到了类似下面的消息，对吧？我对消息进行了格式化并下划了部分内容以便于阅读。\n\
  \nFatal error: Uncaught PDOException: SQLSTATE[HY000]: [1045] Access denied for\
  \ user 'wrongadmin'@'localhost' (using password: YES) in /opt/lampp/htdocs/connect.php:3\
  \ Stack trace: #0 /opt/lampp/htdocs/connect.php(3): PDO->__construct('mysql:host=loca...',\
  \ 'wrongadmin', 'ABCD') #1 /opt/lampp/htdocs/exceptionHandling.php(2): include('/opt....')\
  \ #2 {main} thrown in /opt/lampp/htdocs/connect.php on line 3\n\n此消息告诉我们发生了 PDOException\
  \ 且未被捕获（即未被处理）。该异常是因为我们在连接数据库时使用了无效用户名。当异常发生且未被捕获时，PHP 会显示类似上面的消息。此输出包含了与异常相关的堆栈跟踪。上面的跟踪告诉我们当前异常与\
  \ connect.php 的第 3 行以及 exceptionHandling.php 的第 2 行有关。此外，数据库密码“ABCD”在堆栈中暴露了。注意 `exceptionHandling.php`\
  \ 中的第二个语句（`echo '<BR>Welcome to szone';`）没有执行。这是因为任何未被捕获的异常都会导致致命错误；脚本在执行 echo 语句之前就会终止。\n\
  \n### try-catch-finally\n\n为了捕获异常，我们使用 `try`、`catch` 和 `finally` 块。语法如下：\n\n```php\n\
  try {\n    //执行某些操作\n} \ncatch (异常类型) {\n    //当发生异常时执行其他操作\n} \nfinally {\n   \
  \ // 无论 try 还是 catch 块是否执行，都会执行此操作\n}\n```\n\n`try` 块首先尝试执行任务。如果任务失败，将抛出一个异常。抛出异常简单意味着\
  \ PHP 将使用一个处理异常的预定义类创建一个对象。\n\n\n\n\n\n这些类包含了 `Exception`、`PDOException`、`DOMException`\
  \ 和 `OutOfBoundsException` 类。当发生异常时，PHP 会创建相关异常类的对象。该对象包含有关该异常的信息，并可用于调用类中定义的各种方法。这些方法包括\
  \ `getMessage()`、`getFile()`、`getLine()` 和 `getTraceAsString()` 方法，它们分别为我们提供异常的消息、文件名、行号和堆栈跟踪。\n\
  \n在异常被抛出后（即在 PHP 创建异常对象之后），我们需要使用 `catch` 块来捕获它。我们可以定义多个 `catch` 块来处理不同类型的异常。在 `catch`\
  \ 块之后，是 `finally` 块。该块是可选的，无论 `try` 块成功还是失败，它总是会被执行。为了说明 `try`、`catch` 和 `finally`\
  \ 块的工作原理，请将 `exceptionHandling.php` 中的原始代码替换为以下代码：\n\n```php\n<?php\ntry{\ninclude\
  \ \"connect.php\";\n}catch(PDOException $e){\necho '<BR>Unable to connect '.$e->getMessage();\n\
  }catch(Exception $e){\necho '<BR>Something else happened'.$e->getMessage();\n}finally{\n\
  echo '<BR><BR>The finally block is always executed';\n}\necho '<BR>After connecting';\n\
  ```\n\n在这里，我们首先在 `try` 块中尝试连接到“pawszone”数据库。\n\n如果我们无法连接，PHP 会抛出一个异常，并执行 `catch`\
  \ 块之一。在我们的示例中，我们有两个 `catch` 块。第一个 `catch` 块捕获 PDO 异常（`PDOException`），而第二个 `catch`\
  \ 块捕获通用异常（`Exception`）。`PDOException` 是一个预定义类，用于处理 PDO 无法执行其任务时的异常。另一方面，`Exception`\
  \ 是所有异常类的父类，用于处理通用异常。`$e` 代表相应异常类的对象。在 `catch` 块内部，我们使用 `$e` 调用内置的 `getMessage()`\
  \ 方法，并使用 `echo` 语句输出错误消息。\n\n如果我们运行上面的代码，将得到以下输出：\n`Unable to connect SQLSTATE[HY000]\
  \ [1045] Access denied for user 'wrongadmin'@'localhost' (using password: YES) The\
  \ finally block is always executed After connecting`\n\n第一行输出来自 `catch(PDOException\
  \ $e)` 块。由于 PHP 无法连接到 `connect.php` 中的数据库，它抛出了一个 PDO 异常。第二行来自 `finally` 块。无论 `try`\
  \ 块中的代码成功还是失败，该块都会执行。最后，最后一行来自 `try-catch-finally` 块之后的 `echo` 语句。这一行说明了当异常发生并被成功捕获时，脚本将继续执行。很直接吧？很好！\n\
  \n### 12.1.3 抛出异常\n\n接下来，让我们学习如何抛出自己的异常。在上面的部分中，我们学习了如何捕获 PHP 抛出的异常。除了依赖 PHP 为我们抛出异常外，我们也可以抛出自己的异常。我们使用\
  \ `throw` 关键字来实现。让我们来看一个示例。将下面的函数添加到 `exceptionHandling.php` 的末尾（即在 `echo '<BR>After\
  \ connecting';` 语句之后）：\n\n```php\nfunction displayUserInput($userInput){\n    if\
  \ ($userInput > 100){\n        throw new OutOfRangeException('<BR>User input is\
  \ too big');\n    }else{\n        echo '<BR>'.$userInput;\n    }\n}\n```\n\n在这里，我们定义了一个名为\
  \ `displayUserInput()` 的函数，它有一个参数 `$userInput`。如果 `$userInput` 大于 100，我们使用 `throw`\
  \ 关键字抛出一个 `OutOfRangeException` 异常。`OutOfRangeException` 是 PHP 中一个继承自 `Exception`\
  \ 的预定义类。在我们的 `catch` 块内部，我们使用 `$e` 调用内置的 `getMessage()` 方法，并使用 `echo` 语句输出错误消息。\n\
  \n如果我们运行上面的代码，将得到以下输出：\n`Unable to connect SQLSTATE[HY000] [1045] Access denied\
  \ for user 'wrongadmin'@'localhost' (using password: YES) The finally block is always\
  \ executed After connecting`\n\n第一行输出来自 `catch(PDOException $e)` 块。由于 PHP 无法连接到\
  \ `connect.php` 中的数据库，它抛出了一个 PDO 异常。第二行来自 `finally` 块。无论 `try` 块中的代码成功还是失败，该块都会执行。最后，最后一行来自\
  \ `try-catch-finally` 块之后的 `echo` 语句。这一行说明了当异常发生并被成功捕获时，脚本将继续执行。很直接吧？很好！\n\n在这里，我们定义了一个名为\
  \ `displayUserInput()` 的函数，它有一个参数 `$userInput`。如果 `$userInput` 大于 100，我们使用 `throw`\
  \ 关键字抛出一个 `OutOfRangeException` 异常。`OutOfRangeException` 是 PHP 中一个继承自 `Exception`\
  \ 的预定义类。抛出 `OutOfRangeException` 异常涉及创建一个新对象。为了创建 `OutOfRangeException` 异常，我们可以传递字符串\
  \ `'<BR>User input is too big'`。\n\n如果我们使用下面的 `try-catch` 块调用 `displayUserInput()`：\n\
  \n```php\ntry {\n    displayUserInput(105);\n}catch (OutOfRangeException $e) {\n\
  \    echo $e->getMessage();\n}\n```\n\n`OutOfRangeException` 异常将在 `try` 块中抛出，因为\
  \ `$userInput` 大于 100。它被 `catch` 块捕获。在 `catch` 块内部，我们使用 `getMessage()` 方法获取错误消息。如果我们运行上面的代码，将得到：\n\
  `User input is too big`\n\n如果我们将其改为 `displayUserInput(16);` 则不会抛出异常，我们将得到 `16`。明白了吗？太棒了！\n\
  \n### 12.1.4 异常处理器\n\n在之前的章节中，我们学习了抛出和捕获异常。某些异常（如 PDO 异常）很容易处理，而其他的可能很难。在大多数情况下，尽管我们尽了努力，仍然会有无法预料的异常。在这种情况下，PHP\
  \ 允许我们指定一个自定义异常处理器，当发生无法捕获的异常时调用。我们可以使用此自定义处理器向用户显示自定义消息。然而，异常处理器被调用后，PHP 脚本将终止。为了查看异常处理器的工作原理，将以下代码添加到\
  \ `exceptionHandling.php` 的末尾：\n\n```php\nfunction myExceptionHandler($e) {\n  \
  \  echo '<BR>Oppsss... An uncaught exception occurred.<BR>'.$e->getMessage();\n\
  }\nset_exception_handler('myExceptionHandler');\n```\n\n在这里，我们定义了一个名为 `myExceptionHandler()`\
  \ 的函数作为异常处理器。为了符合，该函数需要一个参数来存储未捕获的异常对象。在我们的示例中，该参数是 `$e`。在函数内部，我们使用 `$e` 调用 `getMessage()`\
  \ 方法，并使用 `echo` 语句输出消息。在编写完函数后，我们需要使用一个内置函数 `set_exception_handler()` 将 `myExceptionHandler()`\
  \ 设置为异常处理器。为此，我们编写了 `set_exception_handler('myExceptionHandler');`。为了测试我们的异常处理器，将以下行添加到\
  \ `exceptionHandling.php` 的末尾：\n\n```php\n$pdo = new PDO(\"some invalid database\"\
  );\necho 'This will not be executed';\n```\n\n在这里，我们尝试使用无效的参数创建一个 PDO 对象。这导致了一个\
  \ PDO 异常，该异常没有被任何 `catch` 块捕获。如果你运行上面的代码，将得到：\n`Oppsss... An uncaught exception\
  \ occurred.invalid data source name added to the output.`\n异常处理器（`myExceptionHandler`）成功处理了该异常。然而，注意到\
  \ PDO 实例化语句之后的 `echo` 语句没有执行？这是因为在异常处理器被调用后，PHP 脚本终止了。明白了吗？2. 处理错误\n\n\n\n\n\n#\
  \ 1. 什么是错误？\n\n太棒了！现在你已经熟悉了异常（exceptions），让我们来讨论错误（errors）。正如之前提到的，当 `PHP` 中出现问题时，你将获得一个异常或错误。错误和异常之间的一个主要区别是，异常可以被捕获，而默认情况下错误无法被捕获。这在\
  \ `PHP 7` 之前尤其如此。从 `PHP 7` 开始，发生某些错误时，`PHP` 会抛出一个 `Error` 异常；此异常可以被捕获。\n\nPHP 定义了四种主要的错误类型：通知（notices）、警告（warnings）、语法错误（syntax\
  \ errors）和致命错误（fatal errors）。每个错误类型进一步分为子类型，每个子类型由一个常量和一个错误代码表示。警告和通知是不导致脚本终止的轻微错误。常见原因包括尝试除以零（产生警告）和尝试访问未定义的变量（产生通知）。相反，语法错误会导致脚本终止。它们是由程序员在代码语法中犯错引起的。例如，忘记关闭括号或缺少分号。最后，我们还有致命错误，它也会导致脚本终止。常见原因包括尝试调用不存在的函数。\n\
  \n不要担心不同错误类型之间的区别。当错误发生时，`PHP` 有一个非常优秀的报告系统。例如，如果你尝试使用语句 `echo $some_undefined_variable;`\
  \ 访问不存在的变量，你将得到类似下方的输出：\n\n```\nNotice: Undefined variable: some_undefined_variable\
  \ in ...mycode.php on line 6\n```\n\n此输出告诉我们该错误是一个通知，并给了我们错误的原因。它还给了我们错误的文件名和发生的行号。如你所见，错误消息包含了大量信息。此类消息使我们非常容易地调试代码。然而，它们可能会向终端用户泄露过多信息。因此，我们的通常做法是只在网站的开发阶段显示这些消息。当我们的网站上线时，强烈建议不要向终端用户显示此类消息。要调整是否显示错误消息，我们需要更新\
  \ `PHP` 服务器中的错误设置。\n\n## 12.2.2 PHP 中的错误报告设置\n\n这里有两个相关的设置：`error_reporting` 和 `display_errors`。`error_reporting`\
  \ 设置影响 `PHP` 报告的错误类型。我们有几个预定义的常量可以分配给此设置。如果我们希望 `PHP` 只报告致命错误（而不报告警告和通知等），我们就为此设置分配\
  \ `E_ERROR` 常量。另一方面，如果我们希望 `PHP` 报告所有错误，我们就为它分配 `E_ALL`。除了 `除 _E_ERROR` 和 `E_ALL`\
  \ 之外，我们还可以将其他常量分配给 `error_reporting` 设置。你可以在 `https://www.php.net/manual/en/errorfunc.constants.php`\
  \ 查看所有错误常量和代码列表。\n\n接下来，我们有 `display_errors` 设置。它影响由 `PHP` 报告的错误是否显示在浏览器上。在开发阶段，我们希望显示错误。为了做到，我们将\
  \ `display_errors` 设置为 `On`。在在线网站上，我们不希望显示任何错误。为了这样做，我们将 `display_errors` 设置为 `Off`。当\
  \ `display_errors` 关闭时，我们通常会将 `PHP` 报告的错误记录到日志文件中。我们稍后会学习这样做。\n\n要配置上述错误设置，最直接的方法是修改\
  \ `php.ini` 文件。我们已经在第 2 章中做过那样的，在那里我们将 `error_reporting` 设置为 `E_ALL` 并将 `display_errors`\
  \ 设置为 `On`。如果你没有编辑 `php.ini` 的权限，可以使用两个内置函数 `error_reporting` 和 `display_errors`（注：原文此处可能有误，应为\
  \ `ini_set`）来修改设置。为了这样做，在你的脚本中添加以下语句：\n\n```php\nerror_reporting(E_ALL);\nini_set('display_errors',\
  \ '1');\n```\n\n在上面的语句中，我们使用 `error_reporting()` 函数将 `error_reporting` 设置为 `E_ALL`。接下来，我们使用\
  \ `ini_set()` 函数将 `display_errors` 设置为 `'1'`。网站上线后，你应该将 `display_errors` 设置为 `'0'`：\n\
  \n```php\necho\n```\n（缺少引号）。\n\n使用 `ini_set()` 更改 `display_errors` 有其局限性。如果你的脚本中有任何语法错误，`ini_set()`\
  \ 函数将不起作用。例如，如果你的脚本中有以下行：\n\n```php\necho;\n\n### 12.2.3 错误处理器和停机函数\n\n在上一节中，我们学习了调整\
  \ `display_errors`。在在线网站上，鼓励你关闭 `display_errors`。然而，有时不显示任何错误消息并不是最好的方法。与其在出现问题时让用户完全困惑，我们可以为他们提供一个“用户友好”的错误消息。为了这样做，我们需要创建一个错误处理器。自定义错误处理器允许我们自己处理错误，而不是依赖默认处理器。为了查看它是如何工作的，在编辑器中创建一个新文件并保存为\
  \ `errorHandling.php`。向其添加以下代码：\n\n```php\n<?php\nfunction myErrorHandler($errno,\
  \ $errstr, $errfile, $errline) {\n    echo '<BR>Oppsss... An error occurred.\n \
  \   echo '<BR'.$errstr;\n}\nset_error_handler('myErrorHandler');\n```\n\n在上面的代码中，我们首先创建一个名为\
  \ `myErrorHandler()` 的函数，它有四个参数 `$errno`、 `$errstr`、 `$errfile` 和 `$errline`。前两个参数是强制性的，后两个是可选的。这四个参数分别用于存储错误代码、错误消息、发生错误的文件和行号。当错误发生时，PHP\
  \ 会提供所有四个信息。在函数内部，我们使用 `echo` 语句向用户输出自定义的错误消息。在编写函数后，我们使用一个内置函数 `set_error_handler()`\
  \ 将 `myErrorHandler()` 设置为自定义错误处理器。\n\n此时此时，你可能会注意到这个自定义错误处理器与我们在第 12.1.4 章编写的自定义异常处理器非常相似。事实上，它们确实相似。然而，自定义异常处理器处理未捕获的异常，而自定义错误处理器处理错误。此外，自定义错误处理器不会导致脚本终止。为了测试上面的错误处理器，在\
  \ `errorHandling.php` 的末尾添加以下代码：\n\n```php\necho $a;\necho '<BR>Script is not terminated';\n\
  ```\n\n现在运行 `errorHandling.php`，你将得到如下输出：\n\n```\nOppsss... An error occurred.\n\
  Undefined variable: a\nScript is not terminated\n```\n\n\n\n\n\n# 脚本未终止\n\n当我们尝试访问未定义的变量时，首先会执行自定义错误处理器为我们提供自定义的错误消息。之后，脚本将继续运行并执行第二个\
  \ `echo` 语句。自定义错误处理器替换了默认的 PHP 错误处理器，为我们提供了一种修改显示给用户的错误信息的方便方法。然而，它无法处理所有的错误。例如，它无法处理致命错误（fatal\
  \ errors）。这些错误会导致脚本终止。为了处理这些错误，我们需要另一个名为 `register_shutdown_function()` 的内置函数。该函数告诉\
  \ PHP 在脚本即将终止时运行哪个函数。\n\n要查看它是如何运作的，请将以下代码添加到 `errorHandling.php` 的末尾：\n\n```php\n\
  function myShutDownHandler(){  \n  $lastError = error_get_last(); \n  if (isset($lastError))\
  \ {  \n    echo '<BR>Oppsss... Script terminated.<BR>';  \n  }  \n} \nregister_shutdown_function('myShutDownHandler');\n\
  ```\n\n在这里，我们声明了一个名为 `myShutDownHandler()` 的函数。在函数内部，我们需要判断脚本终止是否是由错误引起的。为了做到这一点，我们使用\
  \ `error_get_last()` 函数。如果没有发生错误，该函数将返回 `NULL`（例如，如果脚本终止是因为用户导航到另一个页面）。相反，如果发生了错误，它会将最后一个错误以关联数组的形式返回。该数组包含四个键：`type`（提供错误类型）、`message`（提供错误消息）、`file`（提供错误发生的文件）和\
  \ `line`（提供错误发生的行）。在调用 `error_get_last()` 函数后，我们使用 `if` 语句来检查是否发生了错误。如果发生了，我们就向用户\
  \ `echo` 一个自定义的错误消息。\n\n在编写完 `myShutDownHandler()` 函数后，我们使用另一个名为 `register_shutdown_function()`\
  \ 的内置函数将其注册为关闭函数。为了测试我们的关闭函数，请将以下代码添加到 `errorHandling.php` 的末尾：\n\n```php\nhello();\n\
  ```\n\n在这里，我们尝试调用一个不存在的函数。如果你现在加载 `errorHandling.php`，你将看到下面的错误消息：\n\n`Fatal error\
  \ : Uncaught Error: Call to undefined function hello() in ...errorHandling.php:27\
  \ Stack trace: #0 {main} thrown in ...errorHandling.php on line 27 Oppsss... Script\
  \ terminated.`\n\n“Fatal error”消息仅在 `display_errors` 设置为 `On`（或 `'1'`）时才会显示。如果你将\
  \ `display_errors` 改为 `Off`（或 `'0'`），则只显示最后一行。这一行是由我们的关闭函数生成的。懂了吗？\n\n## 12.3 汇总\n\
  \n在之前的章节中，我们讨论了异常和错误以及如何分别处理它们。在这一节中，让我们把所有内容整合到一个文件中。为此，请在你的 htdocs 文件夹中创建一个名为\
  \ `debugging.php` 的文件。在该文件中，我们需要首先创建一个名为 `myDebugger()` 的函数；该函数将以后处理任何未捕获异常或错误的主函数。要创建该函数，请将以下代码添加到\
  \ `debugging.php`：\n\n```php\nfunction myDebugger($msg, $file, $line, $trace = '')\
  \ { \n  $message = $trace.'<BR><BR> <strong>'.$msg.'</strong> found on <u>line '.$line.'</u>\
  \ in file <u>'.$file.'</u>'; \n  if (ini_get('display_errors')) {  \n    echo $message;\
  \  \n  } else {  \n    error_log($message);  \n    header('Location: error.html');\
  \  \n  } \n}\n```\n\n在这里，我们定义了一个名为 `myDebugger()` 的函数，带有四个参数 `$msg`、$file`、 `$line`\
  \ 和 `$trace`。前三个参数分别用于存储错误或异常的消息、文件名和行号。最后一个参数用于存储异常的堆栈跟踪。当发生错误或异常时，PHP 会提供这四个信息。在函数内部，我们拼接这四个参数并使用\
  \ HTML 格式化生成的字符串，然后将其赋值给变量 `$message`。接下来，我们使用 `if` 语句来决定在浏览器中显示什么内容。为了实现这一点，我们使用内置函数\
  \ `ini_get()` 获取 `'display_errors'` 的设置。当 `'display_errors'` 设置为 `On`（或 `'1'`）时，`if`\
  \ 条件为真，我们使用 `echo` 语句在浏览器中显示错误消息。否则，我们使用另一个内置函数 `error_log()` 将 `$message` 记录到我们的错误日志文件中。\n\
  \n\n\n\n恭喜你读到了书的最后！在之前的章节中，我们涵盖了大量内容。学习编程最好的方法是进行实际项目。在本章中，我们将共同完成一个项目。这个项目涵盖了你在之前章节中学到的许多概念，并让你看到所有内容是如何协同工作的。我们还将在项目中涉及一些新的杂杂项概念。期待吗？让我们开始吧！\n\
  \n## 1. 关于项目\n该项目涉及创建一个类似于小型博客的网站，拥有管理员账户的用户可以登录并发布文章。在博客上发布文章时，管理员用户可以选择让文章对非成员可见或对成员可见。管理员和成员需要登录，而非成员不需要。管理员可以读取和写入文章，成员在登录后可以阅读“仅会员”文章，而非成员只能阅读“公共”文章。当成员或管理员登录网站时，网站将检索他/她最后阅读的文章，并通知他/她哪些是新文章。要查看网站运行方式的演示，请访问\
  \ https://learncodingfast.com/php 。\n\n## 2. 致谢与要求\n该项目使用了 HTML、CSS、Javascript、PHP\
  \ 和 MySQL。理解 HTML（尤其是 HTML 表单）和 SQL 对该项目至关重要。本章仅涵盖 PHP，并将引导你完成所有使用的 PHP 代码。所有的 HTML、CSS、Javascript\
  \ 和 SQL 代码都将为你提供。你可以在 https://learncodingfast.com/php 下载它们。然而，由于项目使用了 Bootstrap\
  \ ( https://getbootstrap.com/ ) 作为用户界面，使用 CKEditor (https://ckeditor.com/ckeditor-4/\
  \ ) 作为文本编辑器，我们将不提供代码。相反，将在 `<head>` 元素中提供链接以从各自的内容交付网络（CDN）引入这些文件。这意味着在运行项目代码时需要连接互联网。这里提供的某些说明（如创建数据库和用户账户）专门针对\
  \ XAMPP。如果你没有使用 XAMPP，将需要参考软件的文档来获取特定说明。最后，该项目使用 PHP 5.5 及以上版本。如果你刚刚下载了 XAMPP，内置的\
  \ PHP 解释器至少是 PHP 7。\n\n## 3. 项目结构\n项目的主文件夹是 `phpproject`。在主文件夹内部，我们有八个文件：`admin.php`、`error.html`、`index.php`、`logout.php`、`read.php`、`signup.php`、`UI_include.php`\
  \ 和 `write.php`。这些文件负责博客的用户界面。除了这八个文件，我们还有一个名为 `includes` 的子文件夹。在 `includes` 内部，我们有三个文件：`loadclasses.php`、`header.html`\
  \ 和 `debugging.php`。我们还有三个子文件夹：`process`（包含用于处理 HTML 表单的文件）、`classes`（包含我们定义类的文件）和\
  \ `css`（包含 CSS 代码的文件）。\n\n## 4. 创建数据库、用户账户和表\n在我们开始编写 PHP 代码之前，我们需要创建数据库、表和用户账户。\n\
  \n首先，确保你已经启动了 XAMPP 以及 Apache 和 MySQL 服务器。接下来，访问 http://localhost/phpmyadmin/index.php\
  \ 并按照第 11.5 节的说明创建一个名为“project”的数据库。\n\n接下来，为“project”数据库创建一个以下信息的用户：\n- 用户名：`project_admin`\n\
  - 主机名：`localhost`\n\n为该用户选择一个你想要的密码并点击“执行”（Go）来创建用户。完成后，点击页面顶部的 SQL 选项卡，并将以下 SQL\
  \ 代码复制到编辑器中。此代码可以在 https://learncodingfast.com/php 下载。\n\n```sql\nUSE project;\n\
  CREATE TABLE IF NOT EXISTS members (\n  username VARCHAR(100) PRIMARY KEY,\n  password\
  \ VARCHAR(255) NOT NULL,\n  is_admin BOOLEAN DEFAULT false,\n  last_viewed int DEFAULT\
  \ 0\n);\nCREATE TABLE IF NOT EXISTS posts(\n  id INT AUTO_INCREMENT PRIMARY KEY,\n\
  \  post_date TIMESTAMP DEFAULT NOW() NOT NULL, username VARCHAR(100) NOT NULL,\n\
  \  title VARCHAR(255) NOT NULL,\n  post TEXT NOT NULL,\n  audience INT NOT NULL,\n\
  \  CONSTRAINT FOREIGN KEY (username) REFERENCES members(username) ON DELETE CASCADE\n\
  );\n```\n\n上述代码为“project”数据库创建了两个表：“members”和“posts”。点击“执行”。完成后，我们就可以编写 PHP 代码了。\n\
  \n## 13.5 编辑 classes 文件夹\n首先，导航到你的 htdocs 文件夹并将解后的 `phpproject` 文件夹粘贴进去。接下来，在浏览器中启动\
  \ http://localhost/phpproject/index.php。如果你看到下面的页面，说明一切正常![](img/image_rsrc1J8.jpg)\n\
  \n关闭浏览器并导航到电脑上的 `htdocs\\phpproject\\includes\\classes` 文件夹。你应该能看到五个 PHP 文件。\n\n\
  ### 13.5.1 Helper.php\n我们从 `Helper.php` 开始。在 Brackets 中打开此文件，你会看到我们创建名为 `Helper`\
  \ 的类。该类没有属性和构造函数。在类内部，我们的任务是实现五个公共方法 `passwordsMatch()`、`isValidLength()`、`isEmpty()`、`isSecure()`\
  \ 和\n\n\n\n\n`keepValues()`。让我们从 `passwordsMatch()` 方法开始。该方法有两个参数，`$pw1` 和 `$pw2`。在这个项目中，为了保持我们的代码与旧版本的\
  \ PHP 兼容，我们不会对函数和方法使用类型声明。考虑到这一点，请尝试自己动手声明 `passwordsMatch()` 方法。接下来，在方法内部，我们需要检查两个参数的值是否相等。如果是，我们返回\
  \ `true`；否则，我们返回 `false`。请尝试自己实现。提示：你需要使用一个 `if-else` 语句。一旦你完成了 `if-else` 语句，`passwordsMatch()`\
  \ 方法就完成了。\n\n接下来，让我们来看 `isValidLength()` 方法。该方法有三个参数 `$str`、`$min` 和 `$max`。`$min`\
  \ 的默认值为 `8`，而 `$max` 的默认值为 `20`。如果你不熟悉函数（和方法）的默认值，可以参考第 7.1 节。在方法内部，我们需要检查 `$str`\
  \ 的长度是否小于 `$min` 或大于 `$max`。如果是，我们返回 `false`。否则，我们返回 `true`。请尝试自己编写该方法。提示：你可以使用内置函数\
  \ `strlen()` 来获取 `$str` 的长度。\n\n在 `isValidLength()` 方法之后，我们有了 `isEmpty()` 方法。该方法有一个参数\
  \ `$postValues`，它存储一个数组。该方法检查数组中是否任何一个元素为空字符串。在方法内部，我们需要使用 `foreach` 循环来遍历 `$postValues`\
  \ 中的每个元素，并使用 `if` 语句检查该元素是否等于空字符串。如果是，我们返回 `true`。在遍历完所有元素后，如果没有发现空字符串，我们返回 `false`。换句话说，我们在\
  \ `foreach` 循环之外返回 `false`。请尝试自己编写这个方法。关于使用 `foreach` 循环的帮助，你可以参考第 6.3.5 节。\n\n\
  接下来，我们有 `isSecure()` 方法。该方法有一个参数 `$pw` —— 用于检查它是否包含至少一个小写字母、一个大写字母和一个数字。为了实现这一点，我们需要使用正则表达式。正则表达式允许我们将上述需求（用英文编写）转换为\
  \ PHP 可以理解的表达式。所有的正则表达式必须以分隔符开始和结束。该分隔符可以是任何非字母数字、非反斜杠且非空白的字符。常用的分隔符包括正斜杠 (`/`)、井号\
  \ (`#`) 和波浪号 (`~`)。我们将在代码中使用波浪号。\n\n“至少一个小写字母”的正则表达式是 `~[a-z]+~`，其中 `~` 是分隔符，`[a-z]`\
  \ 代表小写字母集，`+` 代表“至少一个”。“至少一个大写字母”的正则表达式是 `~[A-Z]+~`，“至少一个数字”的正则表达式对应是 `~[0-9]+~`。要检查\
