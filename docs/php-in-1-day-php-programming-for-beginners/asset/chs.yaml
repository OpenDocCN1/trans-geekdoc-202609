  \ 返回的结果赋值给变量 `$result`。\n\n接下来，使用 `if` 语句检查 `$result['num']` 是否等于零。如果是，返回 `false`。否则，返回\
  \ `true`。\n\n尝试自己编写这个方法。\n\n### insertIntoMemberDB()\n\n一旦完成了 `isDuplicateID()`\
  \ 方法，我们可以继续 `insertIntoMemberDB()` 方法。这个方法是公共的并有一个参数 `$pPassword`。它用于在新用户注册时向 `members`\
  \ 表插入新行。`$pPassword` 存储用户在提交注册表单时输入的密码。在方法内部，我们需要使用 `Database::EXECUTE` 模式的 `queryDB()`\
  \ 方法（因为我们没有从数据库获取任何数据）来执行以下 SQL 语句：\n\n```sql\nINSERT INTO members (username, password)\
  \ VALUES (:username, :password)\n```\n\n为了执行此语句，我们需要将 `$username`（类属性）绑定到 `:username`，并将\
  \ `$pPassword`（参数）绑定到 `:password`。但是，由于 `$pPassword` 存储的是用户选择的密码，我们不应该以原始形式将其存储在数据库中。相反，我们应该先进行哈希处理。哈希类似于加密，可以使用\
  \ PHP 内置函数 `password_hash()` 完成。该函数适用于 PHP 5.5 及更高版本，接受两个参数——要哈希的字符串和要使用的算法。使用的算法可以是位于\
  \ `https://www.php.net/manual/en/password.constants.php` 找到的任何预定义常量之一。在我们的项目中，我们将使用\
  \ `PASSWORD_DEFAULT` 作为常量。该常量表示我们将使用 PHP 的默认算法。对 `$pPassword` 进行哈希，我们使用下面的代码：\n\n\
  ```php\npassword_hash($pPassword, PASSWORD_DEFAULT)\n```\n\n因此，为了将值绑定到 SQL 语句中的\
  \ `:username` 和 `:password` 占位符，我们使用下面的 `$values` 数组：\n\n```php\n$values = array(\n\
  \  array(':username', $this->username),\n  array(':password', password_hash($pPassword,\
  \ PASSWORD_DEFAULT))\n);\n```\n\n尝试使用此数组、`Database::EXECUTE` 常量和上述 SQL `INSERT`\
  \ 语句调用 `queryDB()` 方法。完成后，`insertIntoMemberDB()` 方法就完成了。此方法不需要返回任何结果，因为当模式为 `Database::EXECUTE`\
  \ 时，`queryDB()` 方法不会返回任何结果。\n\n### isValidLogin()\n\n完成了吗？太极了！让我们进入 `isValidLogin()`\
