  \n首先，我们声明一个变量 `$h` 并给它分配一个新的 `Helper` 对象。接下来，我们声明两个变量 `$msg` 和 `$username`，并给它们各分配空字符串。在声明并初始化变量后，我们就准备好处理\
  \ `index.php` 中的表单了。我们使用以下 `if` 语句检查是否点击了“submit”按钮：\n\n```\nif (isset($_POST['submit']))\
  \ {\n}\n```\n\n在 `if` 块内部，我们首先将 `$_POST['username']` 赋值给 `$username`。我们需要这样做是因为我们稍会在\
  \ `index.php` 中使用 `$username`。接下来，我们使用 `if-else` 语句检查用户是否在“username”和“password”输入框中都输入数据。为了实现这一点，我们使用\
  \ `$h` 调用 `Helper` 类中的 `isEmpty()` 方法。该方法接受一个包含我们想要检查的所有变量的数组。我们向方法传递以下数组：`array($username,\
  \ $_POST['password'])`。如果数组中的任何元素为空字符串，`isEmpty()` 方法将返回 `true`。发生这种情况时，将执行 `if`\
  \ 块并将字符串 'All fields are required' 赋值给 `$msg`。\n\n另一方面，如果没有任何元素为空，则执行 `else` 块。在\
  \ `else` 块内部，我们创建一个名为 `$member` 的 `BlogMember` 对象。接下来，我们有另一个 `if-else` 语句。这个内部的\
  \ `if-else` 使用 `$member` 对象调用 `BlogMember` 类中的 `isValidLogin()` 方法。如果方法返回 `false`，条件\
  \ `!$member->isValidLogin($_POST['password'])` 为 `true`（因为 `!false` 等于 `true`），并执行\
  \ `if` 块。然后会将字符串 'Invalid Username or Password' 赋值给 `$msg`。\n\n另一方面，如果方法返回 `true`，则执行\
  \ `else` 块。在 `else` 块内部，我们将 `$username` 赋值给会话变量 `$_SESSION['username']` 并使用 `header()`\
  \ 函数将用户重定向到 `read.php`。完成后，`p-index.php` 页面就完成了。仔细检查 `p-index.php` 并在继续之前确保你已经理解了它。明白了吗？太棒了！\n\
  \n#### 13.6.2 p-admin.php\n\n现在让我们来看 `p-admin.php` 文件。这个文件用于处理 `admin.php`，其中包含一个供登录的表单。`admin.php`\
