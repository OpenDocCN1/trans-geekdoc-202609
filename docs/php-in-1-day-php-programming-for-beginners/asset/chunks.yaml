    ## 11.3 SQL 注入


    MySQL 主要有两种查询类型——从数据库返回数据的（例如 `SELECT`）和不返回数据的（例如 `CREATE`、`INSERT`、`UPDATE` 和
    `DELETE`）。发送不返回数据查询最简单的方法是使用 `exec()` 方法，而发送返回数据查询简单的方法是使用 `query()` 方法。然而，这两种方法都让我们面临一种被称为
    SQL 注入的攻击风险。还记得我们在第 8.1.6 节中讨论过跨站脚本吗？SQL 注入与其相似，黑客可以向我们的网站输入数据并利用它来黑入我们的数据库。假设我们有一个名为“ownerName”的文本字段，并且想从数据库中名为“pets”的表中选择行，可以使用下面的代码：


    ```php

    $owner = $_POST[''ownerName''];

    $sql = "SELECT * FROM pets WHERE owner = ''$owner''";

    $stmt = $pdo->query($sql);

    ```


    如果上面的代码目前还没有意义，请担心。我们稍后会讨论查询数据库的更好方法。现在，只需知道在上面的代码中，我们将用户输入 `$_POST[''ownerName'']`
    用于我们的 SQL `SELECT` 语句，并使用 `query()` 方法执行该语句。如果我们的用户在“ownerName”文本字段中输入 `Jamie`，`SELECT`
    语句变为 `SELECT * FROM pets WHERE owner = ''Jamie''`，一切都按预期运行。


    然而，假设用户在文本字段中输入 `Jamie'' OR owner != ''Jamie`，则 `SELECT` 语句变为 `SELECT * FROM pets
    WHERE owner = ''Jamie'' OR owner != ''Jamie''`。当我们使用 `query()` 方法执行此语句时，PHP 将用户输入中的单词“OR”解释为
    SQL 运算符 `OR`。因此，它返回了“pets”表中的所有行，因为 `owner = ''Jamie'' OR owner != ''Jamie''`
    涵盖了“owner”列的所有可能值。这绝对不是我们想要的。


    与其使用 `query()` 或 `exec()` 方法执行 SQL 语句，更好的方法是使用准备语句。


    ## 11.4 准备语句


    使用准备语句涉及几个步骤：

    1. 使用占位符创建 SQL 语句

    2. 准备语句

    3. 将变量或值绑定到占位符

    4. 执行语句

    5. 如果需要获取返回的任何数据


    ### 步骤 1：使用占位符创建 SQL 语句


    在使用准备语句时，我们需要使用占位符来替换 SQL 语句中包含用户输入的任何变量。这些占位符可以是命名的也可以是非命名的。未命占位符用问号 `?` 表示。例如，如果我们想使用用户输入的名为“owner”和“petname”的两个列从“pets”表中查询信息，可以使用下面的
    SQL 语句：


    ```php

    $sqlUnnamed = "SELECT * FROM pets WHERE owner = ? AND petname = ?";

    ```


    在这里，我们使用问号 (`?`) 替换 SQL 语句中的用户输入，并将该语句赋值给名为 `$sqlUnnamed` 的变量。或者，我们可以像下面所示使用命名的占位符：


    ```php

    $sqlNamed = "SELECT * FROM pets WHERE owner = :owner AND petname = :pname";

    ```


    在这里，我们使用 `:owner` 和 `:pname` 替换用户输入，并将语句赋值给名为 `$sqlNamed` 的变量。


    ### 步骤 2：准备语句


    创建语句后，我们需要对其进行准备。准备语句意味着提前将语句发送到数据库服务器，让服务器有机会分析、编译并优化其执行计划。实际执行并未发生在这一步。为了准备语句，我们使用
    `prepare()` 方法。这是 `PDO` 类中的内置方法，返回一个 `PDOStatement` 对象。假设我们有一个名为 `$pdo` 的 `PDO`
    对象，为了准备 `$sqlUnnamed` 语句，我们写：


    ```php

    $sqlUnnamed = $pdo->prepare($sqlUnnamed);

    ```


    在这里，我们使用 `$pdo` 调用 `prepare()` 方法并将返回的对象赋值给变量 `$sqlUnnamed`。为了准备 `$sqlNamed` 语句，我们写：


    ```php

    $sqlNamed = $pdo->prepare($sqlNamed);

    ```


    在这里，我们将返回的对象赋值给变量 `$sqlNamed`。准备好语句后，我们将不再使用 `$pdo` 对象。相反，我们将在后续步骤中使用 `PDOStatement`
    对象（即 `$sqlUnnamed` 和 `$sqlNamed`）。


    ### 步骤 3：将值绑定到占位符


    在步骤 3 中，我们需要将值绑定到 SQL 语句中的占位符上。这告诉数据库服务器在执行语句时用哪些值替换占位符。我们可以使用 `bindValue()` 或
    `bindParam()` 方法将值绑定到占位符。两种方法都很相似，但 `bindValue()` 往往更通用。在随后的示例中使用我们将 `bindValue()`
    方法。


    要将值绑定到未命名占位符，我们通常向 `bindValue()` 方法提供两个信息——占位符的位置和要绑定的值。占位符的位置从 1 开始。记得我们有一个定义并准备好的名为
    `$sqlUnnamed` 的 `SELECT` 语句：


    ```php

    $sqlUnnamed = "SELECT * FROM pets WHERE owner = ? AND petname = ?";

    $sqlUnnamed = $pdo->prepare($sqlUnnamed);

    ```


    假设我们要将名为 `$myPet` 的用户输入绑定到 `$sqlUnnamed` 中的第二个问号，我们可以这样做：


    ```php

    $sqlUnnamed->bindValue(2, $myPet);

    ```


    在这里，我们使用 `$sqlUnnamed` 调用 `bindValue()` 方法。第一个参数 (`2`) 表示我们正将值绑定到第二个占位符（即“petname”列的占位符），而第二个参数
    (`$myPet`) 表示要绑定的值。要将值绑定到命名的占位符，我们用占位符的名字替换第一个参数。例如，如果我们想将 `$myPet` 绑定到 `$sqlNamed`
    中的 `:pname` 占位符，操作如下：


    ```php

    $sqlNamed->bindValue('':pname'', $myPet);

    ```


    第一个参数 (`'':pname''`) 表示我们正将值绑定到 `:pname` 占位符，而第二个参数 (`$myPet`) 表示要绑定的值。


    此时，你们中的一些可能会怀疑 `$myPet`（存储用户输入）是否让我们面临 SQL 注入攻击的风险。答案是否。这是因为 `PDO` 知道我们正在发送占位符的值；因此，它不会将存储在
    `$myPet` 中的字符串的任何部分解释为 SQL 代码。例如，即使 `$myPet` 存储了字符串'
