    \ [属性名]”。理解了吗？很好！现在，让我们看看如何使用 getters 和 setters。要做到这一点，我们只需使用 `->` 运算符，后跟属性名。在后台，只要我们定义了\
    \ `get()` 和 `set()` 方法，PHP 就会自动调用这些魔方法。\n\n首先，让我们将 `Movie` 类中所有属性的访问修饰符改为 `private`。接下来，再次加载\
