- raw: "subj%5B%5D=EL&subj%5B%5D=MA get appended to the URL. These pairs use URL encoding\
    \ to encode special characters that cannot be displayed in an URL.%5B encodes\
    \ the character“\\[” while%5D encodes“\\]”. If you decode  \n\nsubj%5B%5D=EL&subj%5B%5D=MA\
    \  \n\nyou’ll get  \n\nsubj\\[\\]=EL&subj\\[\\]=MA This indicates that we submitted\
    \ the values “EL” and “MA” for the “subj” form element.  \n\nNow, suppose we want\
    \ to use the information stored in the query string in our PHP scripts, how do\
    \ we do that?  \n\nSimple. We use the$\\_GET superglobal.$\\_GET is a superglobal\
    \ that stores the query string as an associative array. To view all data in $\\\
    _GET , we can use the print\\_r() function. To see how that works, add the following\
    \ lines of code to form.php , between the </form> and</body> tags: <?php  \n\n\
    if (isset($\\_GET\\['sm'\\]))  \n\nprint\\_r($\\_GET);  \n\n?> Here, we use the\
    \ isset() function to check if$\\_GET\\['sm'\\] is set. Before we click on the\
    \ “Submit Form” button (named “sm”), $\\_GET\\['sm'\\] is considered to be unset.\
    \ When we click on the button, PHP assigns the string 'Submit Form' to$\\_GET\\\
    ['sm'\\] and the variable becomes set.  \n\nWhen that happens,isset($\\_GET\\\
    ['sm'\\]) returnstrue and theif block is executed. Reload form.php (without the\
    \ query string) and enter the same data we entered previously into the form. Next,\
    \ click on the“Submit Form” button;you’ll see the following line appended to the\
    \ bottom of the page: Array ( \\[studentname\\] => Alex \\[subj\\] => Array (\
    \ \\[0\\] => EL \\[1\\] => MA ) \\[gender\\] => M \\[sm\\] => Submit Form ) This\
    \ gives us the content of the $\\_GET\\[\\] array. In other words, $\\_GET\\['studentname'\\\
    ] = 'Alex' ,  \n\n$\\_GET\\['subj'\\] = array('EL', 'MA') , $\\_GET\\['gender'\\\
    ] = 'M' and $\\_GET\\['sm'\\] = 'Submit Form' . Got it? Great! Let’s move on to\
    \ the post method now.  \n\n8.1.3 post and $\\_POST The post method is similar\
    \ to theget method, except that form data is not appended to the URL. This makes\
    \ the post method suitable for sending sensitive information to the server, as\
    \ information will not be visible in the URL. Let’s look at an example. Change\
    \ the line  \n\n<form action = \"\" method = \"get\">  \n\nin form.php to  \n\n\
    <form action = \"\" method = \"post\">  \n\nNext, change the PHP code to  \n\n\
    if (isset($\\_POST\\['sm'\\]))  \n\nprint\\_r($\\_POST); Finally, load form.php\
    \ again without any query string and enter the same data we entered previously\
    \ into the form. Click on the‘Submit Form’button. You should see the URL in your\
    \ address bar remains unchanged. Other than that, everything else is the same.\
    \ In other words, you’ll get the same output appended to the bottom of the form.\
    \ Processing a form using the get vspost method is very similar. The main difference\
    \ is one appends a query string to the URL while the other doesn’t. In addition,\
    \ with the get method, we use the $\\_GET superglobal. With thepost method, we\
    \ use the $\\_POST superglobal. Clear? 8.1.4 Keeping The Values in The Form  \n\
    \nIn the previous sections, we learned to process HTML forms using the get andpost\
    \ methods. Regardless of which method we use, notice that whenever we click on\
    \ the“Submit Form” button, the form refreshes itself and data entered is not shown\
    \ on the form anymore? This is all right if the form is processed successfully.\
    \ However, if the form is not processed successfully and we need users to resubmit\
    \ the form, this can be very troublesome as users need to fill out all the fields\
    \ again. If we do not want that to happen, we can use echo statements. For text\
    \ boxes, we use echo statements to modify the value attribute. This attribute\
    \ allows us to prefill a text box with text. In form.php , we prefilled the text\
    \ box with the text “Your Name”. Alternatively, we can use PHP to prefill the\
    \ text box with user-entered data. To do that, Change  \n\n<input type = \"text\"\
    \ name = \"studentname\" value = \"Your Name\">  \n\nto  \n\n<input type = \"\
    text\" name = \"studentname\" value = \" <?php  \n\nif (isset($\\_POST\\['studentname'\\\
    ]))  \n\necho $\\_POST\\['studentname'\\];  \n\n?>\">  \n\nIf you analyze the\
    \ code above carefully, you’ll notice that we replaced the text “Your Name” with\
    \ the following block of PHP code:  \n\n<?php  \n\nif (isset($\\_POST\\['studentname'\\\
    ]))  \n\necho $\\_POST\\['studentname'\\]; ?>  \n\nThis code first checks if$\\\
    _POST\\['studentname'\\] is set. If it is (i.e., the user has submitted data for\
    \ this text field previously), we use anecho statement to prefill the text box\
    \ with the information submitted. Got it? It is relatively straightforward to\
    \ prefill a text box with user-entered data. Things get a bit more complicated\
    \ when we want to prefill elements like checkboxes, radio buttons and drop down\
    \ lists. To prefill these elements, we need to know which option has been selected\
    \ and use PHP to select these options dynamically. Let’s look at an example using\
    \ checkboxes. A checkbox is selected when you add the word “checked” (without\
    \ quotes) to its tag. For instance,  \n\n<input name = \"subj\\[\\]\" type = \"\
    checkbox\" value = \"EL\" checked>English results in the checkbox labelled “English”\
    \ being selected. If we want PHP to dynamically select this checkbox, we need\
    \ to replace the code above with: <input type = \"checkbox\" name = \"subj\\[\\\
    ]\" value = \"EL\"  \n\n<?php if (isset($\\_POST\\['subj'\\]) && in\\_array('EL',\
    \ $\\_POST\\['subj'\\]))  \n\necho 'checked';  \n\n?>  \n\n\\>English Here, we\
    \ use PHP to check if $\\_POST\\['subj'\\] is set and if the current option is\
    \ selected. If it is, the string 'EL' should be found in the $\\_POST\\['subj'\\\
    ] array. In other words,in\\_array('EL', $\\_POST\\['subj'\\]) should return true\
    \ . If that’s the case, we echo 'checked' to select this checkbox. This dynamically\
    \ selects the checkbox labelled “English”. Got it? Great! We’ll be writing a function\
    \ to prefill forms in our project later.  \n\n8.1.5 Filtering User Input  \n\n\
    Next, let’s move on to discuss how we can filter user inputs in our forms. Filtering\
    \ refers to the sanitization and validation of user inputs. Sanitization is the\
    \ process of removing invalid characters from the input. For instance, sanitizing\
    \ an integer involves removing all characters except digits, plus and minus signs\
    \ from the input. Validation, on the other hand, is the process of checking if\
    \ the input satisfies certain criteria. For instance, if the input is supposed\
    \ to be an email address, we can use the validation process to check if it is\
    \ indeed an email address (such as whether it contains the “@” character). To\
    \ filter user inputs, we use a built-in function called filter\\_var() . When\
    \ using this function, we need to specify how we want to filter our inputs. We\
    \ do that using one of the predefined filters found at https://www.php.net/manual/en/filter.filters.php\
    \ . Depending on the filter used, this function will either return the filtered\
    \ data or returnfalse . For instance, if we want to remove invalid characters\
    \ from an integer, we can use the FILTER\\_SANITIZE\\_NUMBER\\_INT filter as shown\
    \ below: $num = '12.5abc';  \n\necho filter\\_var($num, FILTER\\_SANITIZE\\_NUMBER\\\
    _INT); If you run the code above, you’ll get  \n\n125  \n\nas the output. If we\
    \ want to validate whether an email address is valid, we can use the FILTER\\\
    _VALIDATE\\_EMAIL filter. If we pass a valid email address to the function, it\
    \ returns the email address. Else, it returnsfalse . For instance, $email = 'abc@gmail';\
    \  \n\nvar\\_dump(filter\\_var($email, FILTER\\_VALIDATE\\_EMAIL)); gives us \
    \ \n\nbool(false)  \n\nas “abc@gmail” is not a valid email address (“.com” is\
    \ missing).  \n\n8.1.6 Cross-Site Scripting Great! We’ve covered most of the form\
    \ handling concepts in PHP. Last but not least, let’s move on to cross-site scripting.\
    \ For this, I need to do a little demonstration. Change the PHP code in form.php\
    \ (between the </form> and </body> tags) to the following: if (isset($\\_POST\\\
    ['studentname'\\]))  \n\necho 'You entered '.$\\_POST\\['studentname'\\].' into\
    \  \n\nthe text field'; and reload the page. Type  \n\n<script>alert('Hacked');</script>\
    \ into the text field and click on the “Submit Form” button. What do you get?\
    \  \n\nYou get an alert box that says “Hacked” right?  "
  fmt: "\n`subj%5B%5D=EL&subj%5B%5D=MA` get appended to the URL. These pairs use URL\
    \ encoding to encode special characters that cannot be displayed in an URL. `%5B`\
    \ encodes the character“\\[” while `%5D` encodes“\\]”. If you decode\n\n`subj%5B%5D=EL&subj%5B%5D=MA`\n\
    \nyou’ll get\n\n`subj[]=EL&subj[]=MA` This indicates that we submitted the values\
    \ “EL” and “MA” for the `subj` form element.\n\nNow, suppose we want to use the\
    \ information stored in the query string in our PHP scripts, how do we do that?\n\
    \nSimple. We use the `$_GET` superglobal. `$_GET` is a superglobal that stores\
    \ the query string as an associative array. To view all data in `$_GET`, we can\
    \ use the `print_r()` function. To see how that works, add the following lines\
    \ of code to `form.php`, between the `</form>` and `</body>` tags:\n\n```php\n\
    <?php\nif (isset($_GET['sm']))\n    print_r($_GET);\n?>\n```\n\nHere, we use the\
    \ `isset()` function to check if `$_GET['sm']` is set. Before we click on the\
    \ “Submit Form” button (named “sm”), `$_GET['sm']` is considered to be unset.\
    \ When we click on the button, PHP assigns the string 'Submit Form' to `$_GET['sm']`\
    \ and the variable becomes set.\n\nWhen that happens, `isset($_GET['sm'])` returns\
    \ `true` and the `if` block is executed. Reload `form.php` (without the query\
    \ string) and enter the same data we entered previously into the form. Next, click\
    \ on the “Submit Form” button; you’ll see the following line appended to the bottom\
    \ of the page: `Array ( [studentname] => Alex [subj] => Array ([0] => EL [1] =>\
    \ MA ) [gender] => M [sm] => Submit Form )` This gives us the content of the `$_GET[]`\
    \ array. In other words, `$_GET['studentname'] = 'Alex'`, `$_GET['subj'] = array('EL',\
    \ 'MA')`, `$_GET['gender'] = 'M'` and `$_GET['sm'] = 'Submit Form'`. Got it? Great!\
    \ Let’s move on to the post method now.\n\n### 8.1.3 post and `$_POST`\n\nThe\
    \ `post` method is similar to the `get` method, except that form data is not appended\
    \ to the URL. This makes the `post` method suitable for sending sensitive information\
    \ to the server, as information will not be visible in the URL. Let’s look at\
    \ an example. Change the line\n\n`<form action = \"\" method = \"get\">`\n\nin\
    \ `form.php` to\n\n`<form action = \"\" method = \"post\">`\n\nNext, change the\
    \ PHP code to\n\n```php\nif (isset($_POST['sm']))\n    print_r($_POST);\n```\n\
    \nFinally, load `form.php` again without any query string and enter the same data\
    \ we entered previously into the form. Click on the ‘Submit Form’ button. You\
    \ should see the URL in your address bar remains unchanged. Other than that, everything\
    \ else is the same. In other words, you’ll get the same output appended to the\
    \ bottom of the form. Processing a form using the `get` vs `post` method is very\
    \ similar. The main difference is one appends a query string to the URL while\
    \ the other doesn’t. In addition, with the `get` method, we use the `$_GET` superglobal.\
    \ With the `post` method, we use the `$_POST` superglobal. Clear?\n\n### 8.1.4\
    \ Keeping The Values in The Form\n\nIn the previous sections, we learned to process\
    \ HTML forms using the `get` and `post` methods. Regardless of which method we\
    \ use, notice that whenever we click on the “Submit Form” button, the form refreshes\
    \ itself and data entered is not shown on the form anymore? This is all right\
    \ if the form is processed successfully. However, if the form is not processed\
    \ successfully and we need users to resubmit the form, this can be very troublesome\
    \ as users need to fill out all the fields again. If we do not want that to happen,\
    \ we can use `echo` statements. For text boxes, we use `echo` statements to modify\
    \ the `value` attribute. This attribute allows us to prefill a text box with text.\
    \ In `form.php`, we prefilled the text box with the text “Your Name”. Alternatively,\
    \ we can use PHP to prefill the text box with user-entered data. To do that, Change\n\
    \n`<input type = \"text\" name = \"studentname\" value = \"Your Name\">`\n\nto\n\
    \n`<input type = \"text\" name = \"studentname\" value = \"<?php\nif (isset($_POST['studentname']))\n\
    \    echo $_POST['studentname'];\n?>\">`\n\nIf you analyze the code above carefully,\
    \ you’ll notice that we replaced the text “Your Name” with the following block\
    \ of PHP code:\n\n```php\n<?php\nif (isset($_POST['studentname']))\n    echo $_POST['studentname'];\
    \ ?>?>\n```\n\nThis code first checks if `$_POST['studentname']` is set. If it\
    \ is (i.e., the user has submitted data for this text field previously), we use\
    \ an `echo` statement to prefill the text box with the information submitted.\
    \ Got it? It is relatively straightforward to prefill a text box with user-entered\
    \ data.\n\nThings get a bit more complicated when we want to prefill elements\
    \ like checkboxes, radio buttons and drop down lists. To prefill these elements,\
    \ we need to know which option has been selected and use PHP to select these options\
    \ dynamically. Let’s look at an example using checkboxes. A checkbox is selected\
    \ when you add the word “checked” (without quotes) to its tag. For instance,\n\
    \n`<input name = \"subj[]\" type = \"checkbox\" value = \"EL\" checked>`\n\nEnglish\
    \ results in the checkbox labelled “English” being selected. If we want PHP to\
    \ dynamically select this checkbox, we need to replace the code above with:\n\n\
    `<input type = \"checkbox\" name = \"subj[]\" value = \"EL\" <?php if (isset($_POST['subj'])\
    \ && in_array('EL', $_POST['subj'])) { echo 'checked'; } ?>>`\n\nEnglish Here.\
    \ Here, we use PHP to check if `$_POST['subj']` is set and if the current option\
    \ is selected. If it is, the string 'EL' should be found in the `$_POST['subj']`\
    \ array. In other words, `in_array('EL', $_POST['subj'])` should return `true`.\
    \ If that’s the case, we `echo` 'checked' to select this checkbox. This dynamically\
    \ selects the checkbox labelled “English”. Got it? Great! We’ll be writing a function\
    \ to prefill forms in our project later.\n\n### 8.1.5 Filtering User Input\n\n\
    Next, let’s move on to discuss how we can filter user inputs in our forms. Filtering\
    \ refers to the sanitization and validation of user inputs. Sanitization is the\
    \ process of removing invalid characters from the input. For instance, sanitizing\
    \ an integer involves removing all characters except digits, plus and minus signs\
    \ from the input. Validation, on the other hand, is the process of checking if\
    \ the input satisfies certain criteria. For instance, if the input is supposed\
    \ to be an email address, we can use the validation process to check if it is\
    \ indeed an email address (such as whether it contains the “@” character).\n\n\
    To filter user inputs, we use a built-in function called `filter_var()`. When\
    \ using this function, we need to specify how we want to filter our inputs. We\
    \ do that using one of the predefined filters found at https://www.php.net/manual/en/filter.filters.php.\
    \ Depending on the filter used, this function will either return the filtered\
    \ data or return `false`. For instance, if we want to remove invalid characters\
    \ from an integer, we can use the `FILTER_SANITIZE_INT` filter as shown below:\n\
    \n```php\n$num = '12.5abc';\necho filter_var($num, FILTER_SANITIZE_INT);\n```\n\
    \nIf you run the code above, you’ll get `125` as the output. If we want to validate\
    \ whether an email address is valid, we can use the `FILTER_VALIDATE_EMAIL` filter.\
    \ If we pass a valid email address to the function, it returns the email address.\
    \ Else, it returns `false`. For instance,\n\n```php\n$email = 'abc@gmail';\nvar_dump(filter_var($email,\
    \ FILTER_VALIDATE_EMAIL));\n```\n\ngives us `bool(false)` as “abc@gmail” is not\
    \ a valid email address (\".com” is missing).\n\n### 8.1.6 Cross-Site Scripting\
    \ Great! We’ve covered most of the form handling concepts in PHP. Last but not\
    \ least, let’s move on to cross-site scripting. For this, I need to do a little\
    \ demonstration. Change the PHP code in `form.php` (between the `</form>` and\
    \ `</body>` tags) to the following:\n\n```php\nif (isset($_POST['studentname']))\n\
    \    echo 'You entered'.$_POST['studentname'].' into the text field';\n```\n\n\
    and reload the page. Type `<script>alert('Hacked');</script>` into the text field\
    \ and click on the “Submit Form” button. What do you get?\n\nYou get an alert\
    \ box that says “Hacked” right?\n"
  trans: "\n\n`subj%5B%5D=EL&subj%5B%5D=MA` 被附加到 URL 之后。这些组合使用 URL 编码来编码 URL 中无法显示的特殊字符。`%5B`\
    \ 编码字符“[”，而 `%5D` 编码“]”。如果你解码\n\n`subj%5B%5D=EL&subj%5B%5D=MA`\n\n你将得到\n\n`subj[]=EL&subj[]=MA`\
    \ 这表示我们为 `subj` 表单元素提交了值“EL”和“MA”。\n\n现在，假设我们想在 PHP 脚本中使用存储在查询字符串中的信息，我们该如何做呢？\n\
    \n很简单。我们使用 `$_GET` 超全局变量。`$_GET` 是一个将查询字符串存储为关联数组的超全局变量。要查看 `$_GET` 中的所有数据，我们可以使用\
    \ `print_r()` 函数。要查看它是如何工作的，请将以下代码添加到 `form.php` 的 `</form>` 和 `</body>` 标签之间：\n\
    \n```php\n<?php\nif (isset($_GET['sm']))\n    print_r($_GET);\n?>\n```\n\n在这里，我们使用\
    \ `isset()` 函数来检查 `$_GET['sm']` 是否设置。在点击“提交表单”按钮（命名为“sm”）之前，`$_GET['sm']` 被认为未设置。当我们点击按钮时，PHP\
    \ 将字符串 'Submit Form' 分配给 `$_GET['sm']`，该变量变为已设置。\n\n当这种情况发生时，`isset($_GET['sm'])`\
    \ 返回 `true`，并执行 `if` 块。刷新 `form.php`（不带查询字符串）并输入之前输入的数据。接下来，点击“提交表单”按钮；你会在页面底部看到附加的行：`Array\
    \ [studentname] => Alex [subj] => Array ([0] => EL [1] => MA) [gender] => M [sm]\
    \ => Submit Form )` 这给了我们 `$_GET` 数组的内容。也就是说，`$_GET['studentname'] = 'Alex'`，`$_GET['subj']\
    \ = array('EL', 'MA')`，`$_GET['gender'] = 'M'` 且 `$_GET['sm'] = 'Submit Form'`。明白了吗？太棒了！我们现在来看\
    \ post 方法。\n\n### 8.1.3 post 和 `$_POST`\n\n`post` 方法与 `get` 方法类似，但表单数据不会附加到 URL。这使得\
    \ `post` 方法适用于向服务器发送敏感信息，因为信息不会在 URL 中可见。让我们来看一个例子。将 `form.php` 中的\n\n`<form action=\"\
    \" method=\"get\">`\n\n更改为\n\n`<form action=\"\" method=\"post\">`\n\n接下来，将 PHP\
    \ 代码更改为\n\n```php\nif (isset($_POST['sm']))\n    print_r($_POST);\n```\n\n最后，再次不带查询字符串加载\
    \ `form.php` 并输入之前输入的数据。点击“提交表单”按钮。你应该发现 URL 保持不变。除此之外，其他一切都是相同的。也就是说，你会在表单底部得到相同的输出。使用\
    \ `get` 与 `post` 方法处理表单非常相似。主要的区别是一个会将查询字符串附加到 URL，而另一个不会。此外，使用 `get` 方法时我们使用\
    \ `$_GET` 超全局变量；使用 `post` 方法时我们使用 `$_POST` 超全局变量。清楚吗？\n\n### 8.1.4 在表单中保留值\n\n\
    在之前的章节中，我们学习了使用 `get` 和 `post` 方法处理 HTML 表单。无论使用哪种方法，注意每当点击“提交表单”按钮时，表单都会刷新且输入的数据不再显示在表单上？如果表单处理成功，这是正确的。但是，如果表单没有处理成功我们需要用户重新提交，这将非常麻烦，因为用户需要再次填写所有字段。如果我们不想这种情况发生，可以使用\
    \ `echo` 语句。对于文本框，我们使用 `echo` 语句来修改 `value` 属性。该属性允许我们为文本框填充文本。在 `form.php` 中，我们在文本框中填充了文本“Your\
    \ Name”。或者，我们可以使用 PHP 用输入的数据填充文本框。为了做到，将\n\n`<input type=\"text\" name=\"studentname\"\
    \ value=\"Your Name\">`\n\n更改为\n\n`<input type=\"text\" name=\"studentname\" value=\"\
    <?php\nif (isset($_POST['studentname']))\n    echo $_POST['studentname'];\n?>\"\
    >`\n\n如果你仔细分析上面的代码，你会注意到我们将文本“Your Name”替换为了以下 PHP 代码块：\n\n```php\n<?php\nif (isset($_POST['studentname']))\n\
    \    echo $_POST['studentname']; ?>?>\n```\n\n这段代码首先检查 `$_POST['studentname']`\
    \ 是否设置。如果是（即用户之前提交了该文本字段的数据），我们使用 `echo` 语句用提交的信息填充文本框。明白了吗？用输入的数据填充文本框是相对直接的。\n\
    \n当我们想要填充如复选框、单选按钮和下拉列表等元素时，情况会变得复杂一点。要填充这些元素，我们需要知道选择了哪个选项，并使用 PHP 动态地选择这些选项。让我们来看一个使用复选框的例子。在标签中添加单词“checked”（不带引号）时，复选框就会被选中。例如，\n\
    \n`<input name=\"subj[]\" type=\"checkbox\" value=\"EL\" checked>`\n\nEnglish\
    \ 导致名为“English”的复选框被选中。如果我们想让 PHP 动态选择这个复选框，我们需要将上面的代码替换为：\n\n`<input type=\"\
    checkbox\" name=\"subj[]\" value=\"EL\" <?php if (isset($_POST['subj']) && in_array('EL',\
    \ $_POST['subj'])) { echo 'checked'; } ?>>`\n\nEnglish 这里。在这里，我们使用 PHP 检查 `$_POST['subj']`\
    \ 是否设置以及当前选项是否被选中。如果是，字符串 'EL' 应该在 `$_POST['subj']` 数组中找到。也就是说，`in_array('EL',\
    \ $_POST['subj'])` 应该返回 `true`。如果是那样，我们就 `echo` 'checked' 来选择这个复选框。这动态选择了名为“English”的复选框。明白了吗？太棒了！稍后将在项目中编写一个填充表单的函数。\n\
    \n### 8.1.5 过滤用户输入\n\n接下来，让我们讨论如何在表单中过滤用户输入。过滤指的是对用户输入进行清洗（sanitization）和验证（validation）。清洗是从输入中移除无效字符的过程。例如，对一个整数进行清洗涉及移除输入中除数字、加号和减号以外的所有字符。另一方面，验证是检查输入是否符合某些标准的过程。例如，如果输入应该是电子邮件地址，我们可以使用验证过程检查它是否确实是电子邮件地址（例如是否包含“@”字符）。要过滤用户输入，我们使用一个名为\
    \ `filter_var()` 的内置函数。使用此函数时，我们需要指定如何过滤我们的输入。我们通过在 https://www.php.net/manual/en/filters.php\
    \ 找到预定义过滤器来实现。根据所使用的过滤器，此函数将返回过滤后的数据或返回 `false`。例如，如果我们想从一个整数中移除无效字符，可以使用 `FILTER_SANITIZE_INT`\
    \ 过滤器，如下：\n\n```php\n$num = '12.5abc';\necho filter_var($num, FILTER_SANITIZE_INT);\n\
    ```\n\n如果你运行上面的代码，将得到输出 `125`。如果我们想验证电子邮件地址是否有效，可以使用 `FILTER_VALIDATE_EMAIL` 过滤器。向函数传递有效的电子邮件地址，它将返回该电子邮件地址。否则，它返回\
    \ `false`。例如，\n\n```php\n$email = 'abc@gmail';\nvar_dump(filter_var($email, FILTER_VALIDATE_EMAIL));\n\
    ```\n\n我们得到 `bool(false)`，因为“abc@gmail”不是有效的电子邮件地址（缺少“.com”）。\n\n### 8.1.6 跨站脚本\
    \ 太棒了！我们涵盖了 PHP 中大部分的表单处理概念。最后但同样重要的是，让我们转向跨站脚本。对于这一点，我需要进行演示。将 `form.php` 中的\
    \ PHP 代码（在 `</form>` 和 `</body>` 标签之间）更改为以下：\n\n```php\nif (isset($_POST['studentname']))\n\
    \    echo 'You entered'.$_POST['studentname'].'into the text field';\n```\n\n\
    并刷新页面。在文本字段中输入 `<script>alert('Hacked');</script>` 并点击“提交表单”按钮。你得到了什么？\n\n你得到了一个显示“Hacked”的警告框，对吧？\n\
    \n"
