    \ PHP script. Hence, p-admin.php is unaware of the class defined in Helper.php\
    \ . To prevent that error, we need to include Helper.php before we create a Helper\
    \ object. However, instead of including this file ourselves, PHP provides us with\
    \ a convenient alternative known as an autoloader. If we define an autoloader\
    \ in our PHP script, whenever we create an object in that script, the autoloader\
    \ includes the file for us automatically. To use an autoloader, we need to ensure\
    \ that the file name matches the class name. For instance, if the file name is\
    \ MyClass.php , the class defined inside has to be calledMyClass . Besides that,\
    \ using an autoloader is straightforward. If you open loadclasses.php , you’ll\
