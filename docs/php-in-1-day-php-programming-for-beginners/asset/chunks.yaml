    \ `Apache` in `XAMPP`. Note: If you have any problems starting `Apache`, it is\
    \ likely due to a port conflict. Follow the instructions at https://learncodingfast.com/how-to-install-xampp-and-brackets\
    \ to resolve the conflict. Next, create a new file in `Brackets` and add the following\
    \ code to it:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>My first PHP\
    \ page</title>\n</head>\n<body>\n  <h1>My first PHP page</h1>\n  <?php #Simple\
    \ hello world page\n  echo \"Hello World!\"; ?>\n</body>\n</html>\n```\n\nIf you\
    \ are using an ebook reader, some lines above may wrap to the next line due to\
    \ the limited width of the reader. If that occurs, try changing your device to\
    \ the landscape mode or using a smaller font size. The same applies to all the\
    \ other examples in this book. Save the file above as `hello.php` to your `htdocs`\
    \ folder. Any file that contains PHP code must be saved with a `.php` extension.\
    \ A file that ends with a `.php` extension is also known as a `PHP script`. You\
    \ can find the `htdocs` folder inside the `XAMPP` (Windows) or `LAMPP` (Mac) folder.\
    \ `htdocs` is the root directory of your local web server. \n\nOn Windows, to\
    \ load the files stored in `htdocs`, you simply type `http://localhost/<filename>`\
    \ into your browser’s address bar. For instance, to load `hello.php`, type `http://localhost/hello.php`.\
    \ On Mac, the easiest way to load files stored in `htdocs` is to enable port forwarding.\
    \ This can be done under the `Network` tab in `XAMPP`. Suppose you have enabled\
    \ `localhost:8080->80(Over SSH)` in `XAMPP`, to load `hello.php`, type `http://localhost:8080/hello.php`\
    \ into your browser’s address bar. Got it? You can refer to https://learncodingfast.com/how-to-installxampp-and-brackets\
    \ for more detailed instructions. For ease of reference, from this point forward,\
    \ I will use `http://localhost` to refer to your localhost. If you are using Mac,\
    \ remember to add the port number to the URL (i.e., `http://localhost:8080`).\
    \ Let’s analyze the code in `hello.php` now. Most of the code should look familiar\
    \ to you except the following:\n\n```php\n<?php\n#Simple hello world page\necho\
    \ \"Hello World!\";\n?>\n```\n\nThe `<?php ... ?>` tags above are known as `PHP\
    \ tags`; they tell the server that code enclosed within should be treated as `PHP\
    \ code`. In our example, we have two simple lines of PHP code. The first line\
    \ `#Simple hello world page` is known as a `comment`. Comments are written by\
    \ programmers to explain their code to other programmers; these comments are ignored\
    \ by the `PHP interpreter`. To add a single line comment to our code, we precede\
    \ the comment with `#` or `//`.\n\nFor instance:\n\n```php\n# This is a comment\n\
    // This is also a comment\n```\n\nTo add multiple lines comment, we enclose the\
    \ comment in `/* ... */`. For instance:\n\n```php\n/*\nThis is an example of a\n\
    multi-line comment\n*/\n```\n\nAfter the comment, we use the statement\n"
  trans: "\n\n# 第 2 章：安装 XAMPP\n\n正如上一章提到的，我们将在章中学习设置 Web 服务器并安装 PHP 解释器。此外，由于我们在本书的后续部分将使用\
    \ PHP 与数据库交互，我们还需要设置数据库服务器。为了设置我们的 Web 和数据库服务器，我们需要安装三个软件：Apache Web 服务器、PHP 解释器和\
    \ MarieDB 数据库服务器。如果逐个安装这三个软件可能会非常麻烦。幸运的是，Apache Friends 的热心人士创建了一个包含了我们所需软件的免费软件包。这个软件包被称为\
    \ `XAMPP`，代表跨平台（X）、Apache Web 服务器（A）、MarieDB 数据库服务器（M）、PHP（P）和 Perl（P）。\n\nMarieDB\
    \ 数据库服务器是 MySQL 服务器的社区开发分支。虽然 `XAMPP` 中的 `M` 正式代表 `MarieDB`，但你会发现 `XAMPP` 中将数据库服务器标记为\
    \ `MySQL`。我们将遵循这一标签，并在书中将数据库服务器称为 `MySQL`。关于安装 `XAMPP` 以及使用它设置服务器的详细说明，请查看 https://learncodingfast.com/how-to-install-xamppand-brackets。本书的配套网站提供了相关说明，每当\
    \ `XAMPP` 发生变化时，你都可以在网站上找到更新后的说明。这将确保你始终获得最新的安装说明。\n\n除了安装 `XAMPP` 之外，强烈建议你安装一个高级文本编辑器来编写代码。虽然你完全可以使用基础文本编辑器（如\
    \ `Notepad`）进行编码，但高级文本编辑器提供了语法高亮等功能，使你的代码更易读和调试。推荐的免费编辑器是 `Brackets`。关于安装 `Brackets`\
    \ 的说明，请前往 https://learncodingfast.com/how-to-installxampp-and-brackets。\n\n##\
    \ 2.1 配置 php.ini\n\n在电脑上安装好 `XAMPP` 和 `Brackets` 后，你就可以开始创建你的动态网站了。然而，在我们开始之前，我们需要对\
    \ PHP 服务器上的错误设置进行一些更改。这确保了当我们的代码中出现任何错误时，浏览器都会显示错误信息。配置这些设置最直接的方法是修改名为 `php.ini`\
    \ 的文件。以下说明在编写时有效。如果说明有任何更改，你可以在 https://learncodingfast.com/php 找到更新后的说明。\n\n\
    要修改 `php.ini`，我们需要先找到该文件。在 Windows 上，启动 `XAMPP` 并点击 `Apache` 的 `Config` 按钮。接下来，选择\
    \ `php.ini`。文件将在 `Notepad` 中打开![](img/image_rsrc1HZ.jpg)\n\n在 Mac 上，启动 `XAMPP`\
    \ 并点击 `General` 标签页中的 `Start` 按钮。等待状态变为绿色。接下来，选择 `Volumes` 标签页并点击 `Mount` 按钮。最后，点击\
    \ `Explore` 并寻找 `etc` 文件夹。你会在该文件夹内找到 `php.ini`。使用 `Brackets` 打开它![](img/image_rsrc1J0.jpg)\n\
    \n打开 `php.ini` 后，滚动到页面底部并向其中添加以下行：\n\n```\nerror_reporting=E_ALL\ndisplay_errors=On\n\
    ```\n\n这些行被添加到页面底部，是为了如果之前设置过这些设置（在 `php.ini` 文件的早期部分），新行将覆盖之前的设置。我们将在将在第 12 章详细讨论这两个设置。接下来，保存文件并重启\
    \ `Apache`。在 Windows 上，只需停止 `Apache` 服务器（如果它正在运行）并重新启动。在 Mac 上，选择 `Services` 标签页并点击\
    \ `Apache`。如果 `Apache` 正在运行，点击 `Restart` 按钮。否则，点击 `Start` 按钮。等待 `Apache` 重启，你的设置就会更新。现在，每当代码出现错误时你都会获得错误信息。根据你使用的\
    \ PHP 版本，你在测试书中代码时遇到的一些错误可能与描述的有所不同。不要担心，我们将在第 12 章深入讨论错误。\n\n## 2. 重要链接\n\n在开始编写第一个网页之前，我想请你两个两个链接。第一个是\
    \ https://learncodingfast.com/php 。本书使用了大量的示例来说明不同的概念。虽然我们鼓励你自己在 `Brackets` 中手动输入这些示例，但如果你不愿意这样做，可以在上述链接下载源代码。项目文件以及本书的任何额外注释或更新也可以在那里找到。接下来，我们还有一个错表页面。虽然我们已尽力确保书中没有错误，且所有源代码已在多台机器上经过广泛测试，但如果我们遗漏了任何错误，你可以在\
    \ https://learncodingfast.com/errata 找到错表。\n\n## 3. 编写我们的第一个网页\n\n太棒了！我们现在准备好编码了。首先，确保你已经在\
    \ `XAMPP` 中启动了 `Apache`。注意：如果在启动 `Apache` 时遇到任何问题，可能是由于端口冲突。请遵循 https://learncodingfast.com/how-to-install-xampp-and-brackets\
    \ 的说明解决冲突。接下来，创建一个新文件并在 `Brackets` 中添加以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>My first page</title>\n</head>\n<body>\n  <h1>My first page</h1>\n\
    \  <?php echo \"Hello World!\"; ?>\n</body>\n</html>\n```\n\n保存文件为 `index.php`\
    \ 并将其放在 `htdocs` 文件夹中。现在在浏览器中访问 `http://localhost/index.php`。你应该能看到“Hello World!”。现在，让我们尝试添加一些动态。将\
    \ `index.php` 中的 `<?php echo \"Hello World!\"; ?>` 替换为以下代码，然后再次访问 `http://localhost/index.php`\
    \ 来看到当前的日期：\n\n```php\n<?php\n$date = date(\"Y-m-d\");\necho \"Today's date is:\
    \ \" . $date;\n?>\n```\n\n恭喜！你已经创建了第一个动态网页。在接下来的章节中，我们将学习如何使用 PHP 的更多功能。\n\n"
