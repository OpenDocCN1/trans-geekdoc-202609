- raw: "Script is not terminated The custom error handler is first executed to give\
    \ us a custom error message when we try to access an undefined variable. After\
    \ that, the script continues and the second echo statement is executed. The custom\
    \ error handler replaces the default PHP error handler and gives us a convenient\
    \ way to modify error messages displayed to users. However, it is unable to handle\
    \ all errors. For instance, it is unable to handle fatal errors. These errors\
    \ lead to script termination. To handle these errors, we need another built-in\
    \ function called register\\_shutdown\\_function() . This function tells PHP which\
    \ function to run when a script is about to be terminated. To see how this works,\
    \ add the following code to the end of errorHandling.php : function myShutDownHandler(){\
    \  \n\n$lastError = error\\_get\\_last(); if (isset($lastError)) {  \n\necho '<BR>Oppsss...\
    \ Script terminated.<BR>';  \n\n}  \n\n} register\\_shutdown\\_function('myShutDownHandler');\
    \ Here, we declare a function called myShutDownHandler() . Within the function,\
    \ we need to determine whether the script termination is due to an error. To do\
    \ that, we use the error\\_get\\_last() function. This function returnsNULL if\
    \ no error has occurred (for instance, if script termination is due to the user\
    \ navigating to another page). On the other hand, if an error has occurred, it\
    \ returns the last error as an associative array. The array contains four keys:type\
    \ (which gives the error type),message (which gives the error message),file (which\
    \ gives the file where the error occurred) and line (which gives the line where\
    \ the error occurred). After calling the error\\_get\\_last() function, we use\
    \ an if statement to check if an error has occurred. If it has, we echo a custom\
    \ error message to users.  \n\nAfter coding the myShutDownHandler() function,\
    \ we use another built-in function called register\\_shutdown\\_function() to\
    \ register it as the shutdown function. To test our shutdown function, add the\
    \ following code to the end of errorHandling.php :  \n\nhello();  \n\nHere, we\
    \ try to call a non-existent function. If you load  \n\nerrorHandling.php now,\
    \ you’ll get the error message below: Fatal error : Uncaught Error: Call to undefined\
    \ function hello() in ...errorHandling.php:27 Stack trace: #0 {main} thrown in\
    \ ...errorHandling.php on line 27 Oppsss... Script terminated. The “Fatal error”\
    \ message is displayed only when display\\_errors is set to On (or'1' ). If you\
    \ turndisplay\\_errors to Off (or'0' ), only the last line is displayed. This\
    \ line is generated by our shutdown function. Got it? 12.3 Putting it All Together\
    \ In the previous sections, we talked about exceptions and errors and how to handle\
    \ them separately. In this section, let’s consolidate everything into a single\
    \ file. To do that, create a file called debugging.php in your htdocs folder.\
    \ Inside this file, we need to first create a function called  \n\nmyDebugger()\
    \ ; this function serves as the main function for handling any uncaught exception\
    \ or error later. To create the function, add the following code to debugging.php\
    \ : function myDebugger($msg, $file, $line, $trace = '') { $message = $trace.'<BR><BR>\
    \  \n\n<strong>'.$msg.'</strong> found on <u>line '.$line.'</u> in file <u>'.$file.'</u>';\
    \ if (ini\\_get('display\\_errors')) {  \n\necho $message;  \n\n} else {  \n\n\
    error\\_log($message);  \n\nheader('Location: error.html');  \n\n} } Here, we\
    \ define a function called myDebugger() with four parameters $msg , $file , $line\
    \ and $trace . The first three parameters are for storing the message, file name\
    \ and line number of an error or exception respectively. The last parameter is\
    \ for storing the stack trace of an exception. All four pieces of information\
    \ will be provided by PHP when an error or exception occurs. Within the function,\
    \ we concatenate the four parameters and format the resulting string using HTML,\
    \ before assigning it to a variable called $message . Next, we use an if statement\
    \ to determine what gets displayed on our browser. To do that, we use a built-in\
    \ function called ini\\_get() to get the setting for'display\\_errors' . When\
    \ 'display\\_errors' is set to On (or '1' ), the if condition evaluates to true\
    \ and we use an echo statement to display the error message on our browser. Else,\
    \ we use another built-in function called error\\_log() to log $message to our\
    \ error log file. The error log file is a text file that contains all the messages\
    \ we write to it using the error\\_log() function. You can find where the error\
    \ log file is located on your system by searching for “error\\_log” (without quotes)\
    \ in the PHP information page, which can be found at http://localhost/dashboard/phpinfo.php\
    \ . If you are using Windows, the log file should be stored in the C:\\\\xampp\\\
    \\php\\\\logs folder. However, weirdly, this folder may not exist and you may\
    \ have to create it yourself. To do that, simply navigate to C:\\\\xampp\\\\php\
    \ and create a logs folder. When an error occurs, PHP will automatically create\
    \ the log file when the error\\_log() function is called. After logging our error\
    \ message, we use the header() function to redirect users to another page called\
    \ error.html (which we need to create separately). With that, the myDebugger()\
    \ function is complete. Next, we need to create an exception handler, an error\
    \ handler and a shutdown function. Inside all three functions, we need to call\
    \ the myDebugger() function. To do that, add the following code to debugging.php\
    \ :  \n\nfunction myExceptionHandler ($e) {  \n\nmyDebugger($e->getMessage(),\
    \ $e->getFile(), $e  \n\n\\>getLine(), $e->getTraceAsString());  \n\n} function\
    \ myErrorHandler($errno, $errstr, $errfile, $errline)  \n\n{ myDebugger($errstr,\
    \ $errfile, $errline); } function myShutDownHandler(){  \n\n$lastError = error\\\
    _get\\_last(); if (isset($lastError)) {  \n\nmyDebugger($lastError\\['message'\\\
    ], $lastError\\['file'\\], $lastError\\['line'\\]); }  \n\n} The first function\
    \ myExceptionHandler() - has a parameter called $e that is used to store an uncaught\
    \ exception object. Inside the function, we use $e to call the built-in getMessage()\
    \ , getFile() ,getLine() andgetTraceAsString() methods and pass the results as\
    \ arguments to the myDebugger() function. Next, we have the myErrorHandler() function.\
    \ This function has four parameters $errno , $errstr , $errfile and $errline .\
    \ Inside the function, we pass$errstr ,$errfile and $errline as arguments to the\
    \ myDebugger() function. Last but not least, we have the myShutDownHandler() function.\
    \ Inside this function, we check if the shutdown is due to an error. If it is,\
    \ we pass the elements in the associative array returned by error\\_get\\_last()\
    \ as arguments to themyDebugger() function. After coding these three functions,\
    \ we need to set them as our custom handlers and shutdown function. To do that,\
    \ add the following lines to debugging.php : set\\_exception\\_handler('myExceptionHandler');\
    \ set\\_error\\_handler('myErrorHandler');  \n\nregister\\_shutdown\\_function('myShutDownHandler');\
    \ With that, the debugging.php file is complete; we’ll be using it in our project\
    \ later. In PHP, there are many different approaches to dealing with exceptions\
    \ and errors, debugging.php demonstrates one of the many techniques available.\
    \ Regardless of whether an error or an uncaught exception occurs on our site,\
    \ this file uses one of the custom handlers or the shutdown function to call the\
    \ myDebugger() function. This function displays an error message on the browser\
    \ whendisplay\\_errors is set to On or '1' . Else, it logs the error message and\
    \ redirects users to a custom error page called error.html . Got it? Chapter 13:\
    \ Project  "
  fmt: "\n# Script is not terminated\n\nThe custom error handler is first executed\
    \ to give us a custom error message when we try to access an undefined variable.\
    \ After that, the script continues and the second `echo` statement is executed.\
    \ The custom error handler replaces the default PHP error handler and gives us\
    \ a convenient way to modify error messages displayed to users. However, it is\
    \ unable to handle all errors. For instance, it is unable to handle fatal errors.\
    \ These errors lead to script termination. To handle these errors, we need another\
    \ built-in function called `register_shutdown_function()`. This function tells\
    \ PHP which function to run when a script is about to be terminated.\n\nTo see\
    \ how this works, add the following code to the end of `errorHandling.php`:\n\n\
    ```php\nfunction myShutDownHandler(){  \n  $lastError = error_get_last(); \n \
    \ if (isset($lastError)) {  \n    echo '<BR>Oppsss... Script terminated.<BR>';\
    \  \n  }  \n} \nregister_shutdown_function('myShutDownHandler');\n```\n\nHere,\
    \ we declare a function called `myShutDownHandler()`. Within the function, we\
    \ need to determine whether the script termination is due to an error. To do that,\
    \ we use the `error_get_last()` function. This function returns `NULL` if no error\
    \ has occurred (for instance, if script termination is due to the user navigating\
    \ to another page). On the other hand, if an error has occurred, it returns the\
    \ last error as an associative array. The array contains four keys: `type` (which\
    \ gives the error type), `message` (which gives the error message), `file` (which\
    \ gives the file where the error occurred) and `line` (which gives the line where\
    \ the error occurred). After calling the `error_get_last()` function, we use an\
    \ `if` statement to check if an error has occurred. If it has, we `echo` a custom\
    \ error message to users.\n\nAfter coding the `myShutDownHandler()` function,\
    \ we use another built-in function called `register_shutdown_function()` to register\
    \ it as the shutdown function. To test our shutdown function, add the following\
    \ code to the end of `errorHandling.php`:\n\n```php\nhello();\n```\n\nHere, we\
    \ try to call a non-existent function. If you load `errorHandling.php` now, you’ll\
    \ get the error message below:\n\n`Fatal error : Uncaught Error: Call to undefined\
    \ function hello() in ...errorHandling.php:27 Stack trace: #0 {main} thrown in\
    \ ...errorHandling.php on line 27 Oppsss... Script terminated.`\n\nThe “Fatal\
    \ error” message is displayed only when `display_errors` is set to `On` (or `'1'`).\
    \ If you turn `display_errors` to `Off` (or `'0'`), only the last line is displayed.\
    \ This line is generated by our shutdown function. Got it?\n\n## 12.3 Putting\
    \ it All Together\n\nIn the previous sections, we talked about exceptions and\
    \ errors and how to handle them separately. In this section, let’s consolidate\
    \ everything into a single file. To do that, create a file called `debugging.php`\
    \ in your htdocs folder. Inside this file, we need to first create a function\
    \ called `myDebugger()`; this function serves as the main function for handling\
    \ any uncaught exception or error later. To create the function, add the following\
    \ code to `debugging.php`:\n\n```php\nfunction myDebugger($msg, $file, $line,\
    \ $trace = '') { \n  $message = $trace.'<BR><BR> <strong>'.$msg.'</strong> found\
    \ on <u>line '.$line.'</u> in file <u>'.$file.'</u>'; \n  if (ini_get('display_errors'))\
    \ {  \n    echo $message;  \n  } else {  \n    error_log($message);  \n    header('Location:\
    \ error.html');  \n  } \n}\n```\n\nHere, we define a function called `myDebugger()`\
    \ with four parameters `$msg`, `$file`, `$line` and `$trace`. The first three\
    \ parameters are for storing the message, file name and line number of an error\
    \ or exception respectively. The last parameter is for storing the stack trace\
    \ of an exception. All four pieces of information will be provided by PHP when\
    \ an error or exception occurs. Within the function, we concatenate the four parameters\
    \ and format the resulting string using HTML, before assigning it to a variable\
    \ called `$message`. Next, we use an `if` statement to determine what gets displayed\
    \ on our browser. To do that, we use a built-in function called `ini_get()` to\
    \ get the setting for `'display_errors'`. When `'display_errors'` is set to `On`\
    \ (or `'1'`), the `if` condition evaluates to true and we use an `echo` statement\
    \ to display the error message on our browser. Else, we use another built-in function\
    \ called `error_log()` to log `$message` to our error log file.\n"
  trans: "\n\n# 脚本未终止\n\n当我们尝试访问未定义的变量时，首先会执行自定义错误处理器为我们提供自定义的错误消息。之后，脚本将继续运行并执行第二个\
    \ `echo` 语句。自定义错误处理器替换了默认的 PHP 错误处理器，为我们提供了一种修改显示给用户的错误信息的方便方法。然而，它无法处理所有的错误。例如，它无法处理致命错误（fatal\
    \ errors）。这些错误会导致脚本终止。为了处理这些错误，我们需要另一个名为 `register_shutdown_function()` 的内置函数。该函数告诉\
    \ PHP 在脚本即将终止时运行哪个函数。\n\n要查看它是如何运作的，请将以下代码添加到 `errorHandling.php` 的末尾：\n\n```php\n\
    function myShutDownHandler(){  \n  $lastError = error_get_last(); \n  if (isset($lastError))\
    \ {  \n    echo '<BR>Oppsss... Script terminated.<BR>';  \n  }  \n} \nregister_shutdown_function('myShutDownHandler');\n\
    ```\n\n在这里，我们声明了一个名为 `myShutDownHandler()` 的函数。在函数内部，我们需要判断脚本终止是否是由错误引起的。为了做到这一点，我们使用\
    \ `error_get_last()` 函数。如果没有发生错误，该函数将返回 `NULL`（例如，如果脚本终止是因为用户导航到另一个页面）。相反，如果发生了错误，它会将最后一个错误以关联数组的形式返回。该数组包含四个键：`type`（提供错误类型）、`message`（提供错误消息）、`file`（提供错误发生的文件）和\
    \ `line`（提供错误发生的行）。在调用 `error_get_last()` 函数后，我们使用 `if` 语句来检查是否发生了错误。如果发生了，我们就向用户\
    \ `echo` 一个自定义的错误消息。\n\n在编写完 `myShutDownHandler()` 函数后，我们使用另一个名为 `register_shutdown_function()`\
    \ 的内置函数将其注册为关闭函数。为了测试我们的关闭函数，请将以下代码添加到 `errorHandling.php` 的末尾：\n\n```php\nhello();\n\
    ```\n\n在这里，我们尝试调用一个不存在的函数。如果你现在加载 `errorHandling.php`，你将看到下面的错误消息：\n\n`Fatal error\
    \ : Uncaught Error: Call to undefined function hello() in ...errorHandling.php:27\
    \ Stack trace: #0 {main} thrown in ...errorHandling.php on line 27 Oppsss... Script\
    \ terminated.`\n\n“Fatal error”消息仅在 `display_errors` 设置为 `On`（或 `'1'`）时才会显示。如果你将\
    \ `display_errors` 改为 `Off`（或 `'0'`），则只显示最后一行。这一行是由我们的关闭函数生成的。懂了吗？\n\n## 12.3\
    \ 汇总\n\n在之前的章节中，我们讨论了异常和错误以及如何分别处理它们。在这一节中，让我们把所有内容整合到一个文件中。为此，请在你的 htdocs 文件夹中创建一个名为\
    \ `debugging.php` 的文件。在该文件中，我们需要首先创建一个名为 `myDebugger()` 的函数；该函数将以后处理任何未捕获异常或错误的主函数。要创建该函数，请将以下代码添加到\
    \ `debugging.php`：\n\n```php\nfunction myDebugger($msg, $file, $line, $trace =\
    \ '') { \n  $message = $trace.'<BR><BR> <strong>'.$msg.'</strong> found on <u>line\
    \ '.$line.'</u> in file <u>'.$file.'</u>'; \n  if (ini_get('display_errors'))\
    \ {  \n    echo $message;  \n  } else {  \n    error_log($message);  \n    header('Location:\
    \ error.html');  \n  } \n}\n```\n\n在这里，我们定义了一个名为 `myDebugger()` 的函数，带有四个参数 `$msg`、$file`、\
    \ `$line` 和 `$trace`。前三个参数分别用于存储错误或异常的消息、文件名和行号。最后一个参数用于存储异常的堆栈跟踪。当发生错误或异常时，PHP\
    \ 会提供这四个信息。在函数内部，我们拼接这四个参数并使用 HTML 格式化生成的字符串，然后将其赋值给变量 `$message`。接下来，我们使用 `if`\
    \ 语句来决定在浏览器中显示什么内容。为了实现这一点，我们使用内置函数 `ini_get()` 获取 `'display_errors'` 的设置。当 `'display_errors'`\
    \ 设置为 `On`（或 `'1'`）时，`if` 条件为真，我们使用 `echo` 语句在浏览器中显示错误消息。否则，我们使用另一个内置函数 `error_log()`\
    \ 将 `$message` 记录到我们的错误日志文件中。\n\n"
