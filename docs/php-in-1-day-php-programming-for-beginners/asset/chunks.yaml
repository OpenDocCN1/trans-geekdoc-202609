    \ value on the right (e.g., `7 > 2` returns true).\n\n### Greater than or equal\
    \ to (`>=`)\nReturn true if the value on the left is greater than or equal to\
    \ the value on the right (e.g., `8 >= 5` and `6 >= 6` both return true).\n\n###\
    \ Less than (`<`)\nReturn true if the value on the left is less than the value\
    \ on the right (e.g., `9 < 12` returns true).\n\n### Less than or equal to (`<=`)\n\
    Return true if the value on the left is less than or equal to the value on the\
    \ right (e.g., `10 <= 14` and `13 <= 13` both return true).\n\n### Spaceship (`<=>`)\n\
    Introduced in PHP 7.\nReturns 0 if the values on both sides are equal (not necessarily\
    \ identical).\nReturns 1 if the value on the left is greater.\nReturns -1 if the\
    \ value on the left is smaller (e.g., `5 <=> 7` returns -1 while `5 <=> 5.0` returns\
    \ 0).\n\n## 6.2 Logical Operators\nNext, we have the set of logical operators.\
    \ The commonly used ones include:\n\n#### NOT\nThe NOT (`!`) operator returns\
    \ true when it precedes an expression that is false. For instance, `!(5 > 10)`\
    \ returns true as `5 > 10` is false (i.e., `5` is not greater than `10`).\n\n\
    #### AND\nThe AND operator allows us to combine two comparisons and returns true\
    \ when both comparisons return true. We can use either the `and` keyword (case-insensitive)\
    \ or the `&&` symbol. The two are similar but have different precedence. Let’s\
    \ look at some examples:\n\nExample 1:\n```php\n$a = 5 > 3 and 4 < 10;\n$b = 5\
    \ > 3 && 4 < 10;\n$c = 5 > 1 && 13 < 5;\nvar_dump($a);\nvar_dump($b);\nvar_dump($c);\n\
    ```\nOutput:\n`bool(true) bool(true) bool(false)`\nIn the example above, `$a`\
    \ and `$b` are true as both comparisons (`5 > 3` and `4 < 10`) are true. In contrast,\
    \ `$c` is false as the second comparison (`13 < 5`) is false.\n\nExample 2:\n\
    ```php\n$d = 3 > 2 && 3 < 1;\n$e = 3 > 2 and 3 < 1;\nvar_dump($d);\nvar_dump($e);\n\
    ```\nOutput:\n`bool(false) bool(true)`\nThis example illustrates the difference\
    \ in precedence between the `and` keyword and the `&&` symbol. `&&` has higher\
    \ precedence than the assignment (`=`) operator. Hence, the statement `$d = 3\
    \ > 2 && 3 < 1;` is evaluated as:\n`$d = (3 > 2 && 3 < 1);`\n`$d` is false as\
    \ `3 < 1` is false. In contrast, the `and` keyword has lower precedence than the\
    \ assignment operator. Hence, the statement `$e = 3 > 2 and 3 < 1;` is evaluated\
    \ as:\n`($e = 3 > 2) and 3 < 1;`\n`$e` is true as only the result of the first\
    \ comparison (`3 > 2`) is assigned to it. In most cases, using `&&` is preferred\
    \ due to its higher precedence.\n\n#### OR\nNext, we have the OR operator. This\
    \ operator returns true when at least one comparison returns true. We can use\
    \ either the `or` keyword or the `||` symbol. However, I encourage you to use\
    \ `||` as it has higher precedence.\n\nExample:\n```php\n$f = 4 < 7 || 10 > 3;\n\
    $g = 3 < 2 || 3 > 1;\n$h = 10 > 15 || 12 < 1;\nvar_dump($f);\nvar_dump($g);\n\
    var_dump($h);\n```\nOutput:\n`bool(true) bool(true) bool(false)`\n`$f` is true\
    \ as both comparisons are true. `$g` is true even though the first comparison\
    \ (`3 < 2`) is false. This is because `||` only requires at least one comparison\
    \ to be true. `$h` is false as none of the comparisons are true.\n\n## 3. Control\
    \ Structures\nNow that we are familiar with comparisons, we are ready to discuss\
    \ the various control structures in PHP.\n\n### 1. If Statement\nThe first is\
    \ the `if` statement. This statement allows the program to evaluate if a certain\
    \ condition is met and perform an appropriate action based on the result of the\
    \ evaluation. The syntax of an `if` statement is as follows:\n\n```php\nif (condition\
    \ 1 is met) {\n    //Do task A\n} elseif (condition 2 is met) {\n    //Do task\
    \ B\n} elseif (condition 3 is met) {\n    //Do task C\n} else {\n    //Do task\
    \ D\n}\n```\n\nLet’s look at an actual example:\n```php\n$a = 7;\nif ($a < 0)\
    \ {\n    echo 'first block';\n} elseif ($a < 5) {\n    echo 'second block';\n\
    } elseif ($a < 10) {\n    echo 'third block';\n} else {\n    echo 'else block';\n\
    }\n```\nIf `$a` is 7, the output will be 'third block'.\n\n### 6.3.2 Ternary Operator\n\
    Next, let’s move on to talk about the ternary operator. In the previous example,\
    \ we have a relatively complex `if` statement. If you only want to do a simple\
    \ if-else test (without any `elseif` blocks), you can use the ternary operator\
    \ (`?`). The syntax is: `Condition ? Task A : Task B`.\n\nThe ternary operator\
    \ first checks the condition on its left. If it is true, it performs Task A. Else,\
    \ it performs Task B.\n\nExample:\n```php\n$a = (7 == 7 ? 'Yes' : 'No');\necho\
    \ $a;\n```\nHere, the condition to test is `7 == 7`. As this condition is true,\
    \ the ternary operator performs the first task and returns the string 'Yes'. We\
    \ then assign this string to `$a` and use the `echo` statement to display its\
    \ value on the next line.\n\n### 6.3.3 Switch Statement\nNext, we have the `switch`\
    \ statement. This statement is similar to an `if` statement and can be faster\
    \ if you have many conditions to test. It is typically used when the condition\
    \ involves comparing a variable against a single value (instead of a range of\
    \ values). The syntax is:\n\n```php\nswitch (variable used for switching) {\n\
    \    case firstCase:\n        Task A;\n        break;\n    case secondCase:\n\
    \        Task B;\n        break;\n    default:\n        Default task;\n}\n```\n\
    \nExample:\n```php\n$b = 20;\nswitch ($b) {\n    case 10:\n        echo 'Chocolate';\n\
    \        break;\n    case 20:\n        echo 'Lemon';\n        break;\n    case\
    \ 25:\n        echo 'Strawberry';\n        break;\n    default:\n        echo\
    \ 'Default task';\n}\n```\nIf `$b` is 20, the output will be 'Lemon'.\n"
  trans: "\n如果两边的值相等且日期类型相同，则返回 true（例如，`5 === 5` 返回 true，而 `5 === 5.0` 返回 false）。\n\
    \n不等于 (`!=` 或 `<>`)：如果两边的值不相等，则返回 true（例如 `5 != 7` 和 `5 <> 7` 均返回 true）。\n\n不相同\
    \ (`!==`)：如果两边的值不相等或数据类型不相同，则返回 true（例如 `5 !== 5.0` 返回 true，因为 `5` 和 `5.0` 属于不同的数据类型）。\n\
    \n### 大于 (`>`)\n如果左侧的值大于右侧的值，则返回 true（例如 `7 > 2` 返回 true）。\n\n### 大于等于 (`>=`)\n\
    如果左侧的值大于或等于右侧的值，则返回 true（例如 `8 >= 5` 和 `6 >= 6` 均返回 true）。\n\n### 小于 (`<`)\n如果左侧的值小于右侧的值，则返回\
    \ true（例如 `9 < 12` 返回 true）。\n\n### 小于等于 (`<=`)\n如果左侧的值小于或等于右侧的值，则返回 true（例如 `10\
    \ <= 14` 和 `13 <= 13` 均返回 true）。\n\n### 船位运算符 (`<=>`)\nPHP 7 中引入。\n如果两边的值相等（不一定完全相同），则返回\
    \ 0。\n如果左侧的值大，返回 1。\n如果左侧的值小，返回 -1（例如 `5 <=> 7` 返回 -1，而 `5 <=> 5.0` 返回 0）。\n\n\
    ## 6.2 逻辑运算符\n接下来，我们有一组逻辑运算符。常用的运算符包括：\n\n#### NOT\nNOT (`!`) 运算符当它跟在一个为假的表达式之前时返回\
    \ true。例如，`!(5 > 10)` 返回 true，因为 `5 > 10` 是假的（即 `5` 不大于 `10`）。\n\n#### AND\nAND\
    \ 运算符允许我们组合两个比较，并在两个比较都为 true 时时返回 true。我们可以使用 `and` 关键字（不区分大小写）或 `&&` 符号。两者相似，但优先级不同。让我们来看一些示例：\n\
    \n示例 1：\n```php\n$a = 5 > 3 and 4 < 10;\n$b = 5 > 3 && 4 < 10;\n$c = 5 > 1 &&\
    \ 13 < 5;\nvar_dump($a);\nvar_dump($b);\nvar_dump($c);\n```\n输出：\n`bool(true)\
    \ bool(true) bool(false)`\n在上面的示例中，`$a` 和 `$b` 为 true，因为两个比较（`5 > 3` 和 `4 < 10`）都是\
    \ true。相比之下，`$c` 为 false，因为第二个比较（`13 < 5`）为 false。\n\n示例 2：\n```php\n$d = 3 >\
    \ 2 && 3 < 1;\n$e = 3 > 2 and 3 < 1;\nvar_dump($d);\nvar_dump($e);\n```\n输出：\n\
    `bool(false) bool(true)`\n此示例说明了 `and` 关键字与 `&&` 符号之间的优先级差异。`&&` 的优先级高于赋值运算符 (`=`)。因此，语句\
    \ `$d = 3 > 2 && 3 < 1;` 的评估方式为：\n`$d = (3 > 2 && 3 < 1);`\n`$d` 为 false，因为 `3\
    \ < 1` 为假。相比之下，`and` 关键字的优先级低于赋值运算符。因此，语句 `$e = 3 > 2 and 3 < 1;` 的评估方式为：\n`($e\
    \ = 3 > 2) and 3 < 1;`\n`$e` 为 true，因为只有第一个比较（`3 > 2`）的结果被赋值给了它。在大多数情况下，由于优先级更高，优于使用\
    \ `&&`。\n\n#### OR\n接下来是 OR 运算符。当至少有一个比较为 true 时，该运算符返回 true。我们可以使用 `or` 关键字或\
    \ `||` 符号。不过，我鼓励你使用 `||`，因为它优先级更高。\n\n示例：\n```php\n$f = 4 < 7 || 10 > 3;\n$g =\
    \ 3 < 2 || 3 > 1;\n$h = 10 > 15 || 12 < 1;\nvar_dump($f);\nvar_dump($g);\nvar_dump($h);\n\
    ```\n输出：\n`bool(true) bool(true) bool(false)`\n`$f` 为 true，因为两个比较都是 true。`$g`\
    \ 为 true，即使第一个比较（`3 < 2`）为假。这是因为 `||` 只需要至少有一个比较为真。`$h` 为 false，因为没有任何比较为真。\n\n\
    ## 3. 控制结构\n现在我们已经熟悉了比较，准备好讨论 PHP 中的各种控制结构了。\n\n### 1. If 语句\n第一个是 `if` 语句。该语句允许程序评估是否满足特定条件，并根据评估结果执行适当的操作。`if`\
    \ 语句的语法如下：\n\n```php\nif (条件 1) {\n    // 执行任务 A\n} elseif (条件 2) {\n    // 执行任务\
    \ B\n} elseif (条件 3) {\n    // 执行任务 C\n} else {\n    // 执行任务 D\n}\n```\n\n让我们来看一个真实的示例：\n\
    ```php\n$a = 7;\nif ($a < 0) {\n    echo '第一块';\n} elseif ($a < 5) {\n    echo\
    \ '第二块';\n} elseif ($a < 10) {\n    echo '第三块';\n} else {\n    echo 'else 块';\n\
    }\n```\n如果 `$a` 是 7，输出将是 '第三块'。\n\n### 3.2 三元运算符\n接下来，让我们讨论三元运算符。在之前的示例中，我们有一个相对复杂的\
    \ `if` 语句。如果你只想进行简单的 if-else 测试（没有 `elseif` 块），可以使用三元运算符 (`?`）。语法为：`条件 ? 任务 A\
    \ : 任务 B`。\n\n三元运算符首先检查左侧的条件。如果为真，执行任务 A。否则，执行任务 B。\n\n示例：\n```php\n$a = (7 ==\
    \ 7 ? 'Yes' : 'No');\necho $a;\n```\n这里的测试条件是 `7 == 7`。由于该条件成立，三元运算符执行第一个任务并返回字符串\
    \ 'Yes'。我们将该字符串赋值给 `$a`，并使用 `echo` 语句在下一行显示其值。\n\n### 3.3 Switch 语句\n接下来，我们有 `switch`\
    \ 语句。该语句与 `if` 语句类似，如果有许多条件需要测试，它的速度更快。它通常用于条件涉及将变量与单个值比较（而不是值范围）。语法如下：\n\n```php\n\
    switch (用于切换的变量) {\n    case 情况情况:\n        任务 A;\n        break;\n    case 第二种情况:\n\
    \        任务 B;\n        break;\n    default:\n        默认任务;\n}\n```\n\n示例：\n```php\n\
    $b = 20;\nswitch ($b) {\n    case 10:\n        echo '巧克力';\n        break;\n \
    \   case 20:\n        echo '柠檬';\n        break;\n    case 25:\n        echo '草莓';\n\
    \        break;\n    default:\n        echo '默认任务';\n}\n```\n如果 `$b` 是 20，输出将是\
    \ '柠檬'。\n"
