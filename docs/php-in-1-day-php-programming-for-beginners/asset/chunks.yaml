    \nprivate function conversion($country) Next, load chap10.php again. What do you\
    \ get? You get an error message similar to the output below, right? Fatal error:\
    \ Uncaught Error: Call to private method Movie::conversion() from context  \n\n\
    'AwardWinningMovie'... This is because when conversion() is aprivate method, we\
    \ are not allowed to access it directly outside the class in which it is defined\
    \ (i.e., outside theMovie class). Hence, therecommend() method in the AwardWinningMovie\
    \ class is not allowed to access it. Next, change conversion() to aprotected method\
    \ and load chap10.php again. Everything works now, right? This is because child\
    \ classes are allowed to accessprotected members in their parent class directly.\
    \ Hence, the recommend() method in the  \n\nAwardWinningMovie class is now allowed\
    \ to access the conversion() method in the Movie class. Got it? Great! After changing\
    \ conversion() to aprotected method, note that we are only allowed to access it\
    \ directly inside the class in which it is declared and any subclass that inherits\
    \ from that class. In other words, we can only access it directly inside the Movie\
    \ and AwardWinningMovie classes. Recall that previously, we accessed the method\
    \ in chap9.php ? This was all right whenconversion() was apublic method. Now that\
    \ it is a protected method, you’ll get an error if you load chap9.php again. If\
    \ you want to access the conversion() method in chap9.php directly, you have to\
    \ change it back to a public method. 10.4 Overriding Now that you are familiar\
    \ with child classes and inheritance, let’s move on to discuss the concept of\
    \ overriding. Overriding occurs when a child class modifies the methods it inherits\
    \ from its parent class. To illustrate what this means, add the following line\
    \ to chap10.php and load the page.  \n\necho $awm->displayHeading('H1');  \n\n\
    You’ll get the text “Award Winning Movies” displayed as a<H1> heading. Here, we\
    \ are calling the displayHeading() method declared in the parent class. This method\
    \ is a public method inherited by the child class. Hence, we can access it using\
    \ an AwardWinningMovie object. Next, let’s see what happens if we code a new version\
    \ of the displayHeading() method inside the child class itself. To do that, add\
    \ the following method to the AwardWinningMovie class, after the recommend() method\
    \ but before the closing brace of the class: public function displayHeading($tag){\
    \  \n\n$baseMsg = parent::displayHeading($tag); return $baseMsg.$this->award;\
    \ } Here, we declare a method with the same name ( displayHeading ) and parameter\
    \ list ($tag ) as the method in the parent class. When that happens, we say that\
    \ the child class method overrides the parent class method. Within the child class\
    \ method, we use the parent keyword to call the parent classdisplayHeading() method.\
    \ Whenever a child class overrides a parent class method, we need to use the parent\
    \ keyword (instead of the $this keyword) if we want to access the parent class\
    \ method inside the child class. Next, we assign the result returned by the parent\
    \ class method to a variable called$baseMsg . Finally, we concatenate$baseMsg\
    \ with the$award property in the child class and return the result. If you load\
    \ chap10.php again, you’ll see the text “Award Winning Movies” displayed as a\
    \ <H1> heading, followed by a line that says “Best Picture”. This additional line\
    \ illustrates that we are now accessing the displayHeading() method in the child\
    \ class. As displayHeading() has been overridden in the child class, the child\
    \ class method is called when we access it using a child class object ($awm ).\
    \ If we want to access the displayHeading() method in the parent class, we have\
    \ to use a parent class object. For instance, we can do it as follows: $mv = new\
    \ Movie('A3244', 'Golden Rose', 3.99); echo $mv->displayHeading('H1'); If you\
    \ add the code above to chap10.php and load the page, you’ll only get “Award Winning\
    \ Movies” (without “Best Picture”) added to the output. This illustrates that$mv\
    \ is accessing the displayHeading() method in the parent class. Chapter 11: Interacting\
    \ with a Database In this chapter, let’s move on to talk about databases. Whenever\
    \ we work with websites, it is highly likely that we need to store information\
    \ (such as data entered by users) in a database. This chapter assumes that you\
    \ are familiar with MySQL. If you are not, I strongly recommend that you check\
    \ out my other book, “Learn SQL (using MySQL) in One Day and Learn it Well” before\
    \ proceeding. If you are familiar with MySQL, let’s proceed.  \n\n1\\. The PDO\
    \ library  \n\nTo use a database in our PHP programs, we can use one of two builtin\
    \ libraries. A library is a collection of code that other developers have written\
    \ and made available for us to use in our own programs. The two libraries available\
    \ for connecting to a database in PHP are the MySQLi and PDO libraries. Both essentially\
    \ do the same job, connecting to the database and sending queries to it. However,\
    \ there are some key differences between the two. The main difference is that\
    \ we can use the PDO library to connect to 12 different types of database servers\
    \ - such as a MySQL server, an Oracle server, or a Microsoft SQL Server. In contrast,\
    \ the MySQLi library only works with MySQL database servers. For this reason,\
    \ we’ll use the PDO library in this book.  \n\n2\\. Connecting to the Database\
    \  \n\nTo send queries to our database using PDO , we need to connect to it first.\
    \  \n\nTo do that, we need four pieces of information - the hostname of the server,\
    \ the name of the database, the username of the account authorized to access that\
    \ database and the password. In most cases, the hostname is simply “localhost”.\
    \ To get the other three pieces of information, you need to contact your database\
    \ administrator. For the examples in this book, we’ll be our own database administrator\
    \ and create a database and user account using phpMyAdmin in XAMPP later. For\
    \ now, let’s suppose you have a database called “pawszone” and a user account\
    \ with username “pz\\_admin” and password “ABCD”. In the following sections, we’ll\
    \ first cover various concepts you need to know to work with PDO . After covering\
    \ the concepts, we’ll get some hands-on practice with a PHP script that shows\
    \ how the concepts can be applied. Ready? Let’s learn to connect to our database\
    \ first. PDO uses an object-oriented approach. To connect to our database, we\
    \ create aPDO object. For instance, to connect to the“pawszone” database, we use\
    \ the code below: $pdo = new  \n\nPDO(\"mysql:host=localhost;dbname=pawszone\"\
    , \"pz\\_admin\", \"ABCD\"); $pdo->setAttribute(PDO::ATTR\\_ERRMODE,  \n\nPDO::ERRMODE\\\
    _EXCEPTION);  \n\nOn the first line, we create a PDO object by passing three arguments\
    \ to the PDO constructor. The first argument is a string indicating the type of\
    \ database we are using (mysql: in our case), the hostname of the server  \n\n\
    (host=localhost ), and the name of the database  "
