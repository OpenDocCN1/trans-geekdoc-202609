- raw: "Inside the constructor, we initialize $id , $title and $rentalPrice with the\
    \ values of$pId ,$pTitle and $pRentalPrice respectively. Notice a new keyword\
    \ $this in the code above? We’ll explain this keyword later when we learn to create\
    \ objects in the next section. For now, just know that whenever we want to access\
    \ the properties and methods of a class inside the class, we need to use the $this\
    \ keyword, followed by the \\-> operator. Next, let’s add a regular (i.e., non-magic)\
    \ method to our Movie class. Add the following method after the construct() method\
    \ (but before the closing brace of the Movie class): public function conversion($country){\
    \  \n\n$rate = 1;  \n\nswitch($country){  \n\ncase 'UK':  \n\n$rate = 0.76;  \n\
    \nbreak;  \n\ncase 'Japan':  \n\n$rate = 110;  \n\nbreak;  \n\n}  \n\nreturn round($rate\\\
    *$this->rentalPrice, 2); } Here, we define a method called conversion() . This\
    \ method has one parameter $country - and converts USD to pounds or yen depending\
    \ on the value of$country . Within the method, we declare and initialize a variable\
    \ called $rate and use a switch statement to update its value based on the value\
    \ of $country . Next, we multiply $rate with the $rentalPrice property ($rate\\\
    *$this->rentalPrice ) and pass the product as an argument to a built-in function\
    \ called round() . This function accepts two arguments and rounds the first argument\
    \ off to the precision indicated by the second. In our method, we round the product\
    \ off to 2 decimal places. Finally, we use the return keyword to return the result\
    \ of the round() function.  \n\nWithin the method, notice that we did not use\
    \ the $this keyword to access$country and $rate ? This is because $country is\
    \ a parameter while $rate is a local variable (i.e., a variable declared inside\
    \ the method). In other words, they are not class properties. We use the $this\
    \ keyword only when accessing class properties and methods. For instance, we use\
    \ the $this keyword to access the$rentalPrice property. Got it? Once you have\
    \ added the conversion() method to the Movie class, our class is complete. We\
    \ are now ready to make use of this class. To do that, we need to create an object\
    \ from it.  \n\n9.3 Creating an Object To create an object, we use the new keyword.\
    \ An object is also known as an instance of the class, and the process of creating\
    \ an object is known as instantiating the class. Create a new file in Bracket\
    \ and save it as chap9.php to your htdocs folder. Add the following code to chap9.php\
    \ : <?php  \n\ninclude 'Movie.php';  \n\n$mov1 = new Movie('N0001', 'Lusso', 4.99);\
    \ Here, we first use the include statement to include Movie.php (which contains\
    \ the code for the Movie class).  \n\nNext, we use the new keyword to create aMovie\
    \ object called $mov1 , passing 'N0001' , 'Lusso' and 4.99 as arguments to the\
    \ construct() method.  \n\nAs construct() is a magic method, we do not call it\
    \ using its name.  \n\nInstead, when we create a newMovie object, PHP looks for\
    \ the construct() method and executes it for us automatically. Remember the $this\
    \ keyword in our Movie class constructor? $this refers to the current object.\
    \ When we use the statement $mov1 = new Movie('N0001', 'Lusso', 4.99); to create$mov1\
    \ , $this refers to $mov1 . In other words, when PHP executes the constructor,\
    \ the statement  \n\n$this->id = $pId;  \n\nin the constructor becomes  \n\n$mov1->id\
    \ = 'N0001'; As a result, the value 'N0001' gets assigned to the $id property\
    \ of $mov1 . The same applies to the other two assignment statements in the constructor.\
    \ Hence, the values'Lusso' and4.99 get assigned to the$title and$rentalPrice properties\
    \ of$mov1 respectively. Next,let’s create a second Movie object called$mov2 using\
    \ the statement below:  \n\n$mov2 = new Movie('P0002', 'Junior', 5.99); When PHP\
    \ creates$mov2 and calls the constructor,$this refers to $mov2 . Hence, the statement\
    \  \n\n$this->id = $pId;  \n\nin the constructor becomes  \n\n$mov2->id = 'P0002';\
    \ The same applies to the other two assignment statements in the constructor.\
    \ As a result, the values'P0002' , 'Junior' and 5.99 get assigned to the$id ,$title\
    \ and $rentalPrice properties of $mov2 respectively. Got it? Good! Let’s move\
    \ on.  \n\n9.4 Accessing Class Members  \n\nAfter creating an object, we can use\
    \ the object name and the\\-> operator to access its properties and methods. \
    \ \n\nFor instance, to access the properties and methods of$mov1 in chap9.php\
    \ , we use the code below:  \n\necho $mov1->title.'<BR>';  \n\necho $mov1->conversion('Japan').'<BR>';\
    \ Here, we first use the \\-> operator to access the $title property of $mov1\
    \ . Next, we use the \\-> operator to call the conversion() method, passing'Japan'\
    \ as an argument to the method. Add the code above to chap9.php (after the instantiation\
    \ statements) and load the page, you’ll get  \n\nLusso  \n\n548.9  \n\nas the\
    \ output. Pretty straightforward, right?  \n\nNow, suppose we want to access the\
    \ DISCOUNT constant defined in the Movie class, how do we do that?  \n\nTo access\
    \ a class constant, we do not use the \\-> operator. Instead, we use the :: operator.\
    \ This is because class constants are different from class properties; they are\
    \ allocated once per class, not once for each object. This means that all objects\
    \ of the same class ($mov1 and $mov2 in our example) share the same constants.\
    \ In other words, even if there are 100 Movie objects, there is only one memory\
    \ location allocated to store the DISCOUNT constant. To access the DISCOUNT constant\
    \ in the Movie class, add the following code to chap9.php : echo Movie::DISCOUNT.'<BR>';\
    \  \n\necho $mov1::DISCOUNT.'<BR>';  \n\necho $mov2::DISCOUNT.'<BR>'; If you run\
    \ the code above, you’ll get  \n\n10 displayed three times. This shows that we\
    \ can use either the class name (Movie ) or the object name ($mov1 or $mov2 )\
    \ to access a class constant. All three give us the same value as they are accessing\
    \ the same memory location. 9.5 Access Modifiers Now that we know how to create\
    \ objects and access class members using these objects, let’s discuss a concept\
    \ we skipped previously thepublic and private keywords. These two keywords are\
    \ known as access modifiers; they serve as gatekeepers controlling where we can\
    \ access a particular class member. public class members can be assessed everywhere\
    \ while private class members can only be accessed within the class in which they\
    \ are declared. In our Movie class, we have twopublic properties ($title and $rentalPrice\
    \ ) and oneprivate property ($id ). Previously, we learned to access the $title\
    \ property of$mov1 in chap9.php . As$title is a public class property, we had\
    \ no problems accessing it in chap9.php . Now, let’s try accessing the $id property.\
    \ Add the line echo $mov1->id.'<BR>';  "
  fmt: "\nInside the constructor, we initialize `$id`, `$title` and `$rentalPrice`\
    \ with the values of `$pId`, `$pTitle` and `$pRentalPrice` respectively. Notice\
    \ a new keyword `$this` in the code above? We’ll explain this keyword later when\
    \ we learn to create objects in the next section. For now, just know that whenever\
    \ we want to access the properties and methods of a class inside the class, we\
    \ need to use the `$this` keyword, followed by the `->` operator. Next, let’s\
    \ add a regular (i.e., non-magic) method to our `Movie` class. Add the following\
    \ method after the `construct()` method (but before the closing brace of the `Movie`\
    \ class):\n\n```php\npublic function conversion($country){\n  $rate = 1;\n  switch($country){\n\
    \    case 'UK':\n      $rate = 0.76;\n      break;\n    case 'Japan':\n      $rate\
    \ = 110;\n      break;\n  }\n  return round($rate*$this->rentalPrice, 2); }\n\
    ```\nHere, we define a method called `conversion()`. This method has one parameter\
    \ `$country` - and converts USD to pounds or yen depending on the value of `$country`.\
    \ Within the method, we declare and initialize a variable called `$rate` and use\
    \ a `switch` statement to update its value based on the value of `$country`. Next,\
    \ we multiply `$rate` with the `$rentalPrice` property (`$rate*$this->rentalPrice`)\
    \ and pass the product as an argument to a built-in function called `round()`.\
    \ This function accepts two arguments and rounds the first argument off to the\
    \ precision indicated by the second. In our method, we round the product off to\
    \ 2 decimal places. Finally, we use the `return` keyword to return the result\
    \ of the `round()` function.\n\nWithin the method, notice that we did not use\
    \ the `$this` keyword to access `$country` and `$rate`? This is because `$country`\
    \ is a parameter while `$rate` is a local variable (i.e., a variable declared\
    \ inside the method). In other words, they are not class properties. We use the\
    \ `$this` keyword only when accessing class properties and methods. For instance,\
    \ we use the `$this` keyword to access the `$rentalPrice` property. Got it? Once\
    \ you have added the `conversion()` method to the `Movie` class, our class is\
    \ complete. We are now ready to make use of this class. To do that, we need to\
    \ create an object from it.\n\n### 9.3 Creating an Object\nTo create an object,\
    \ we use the `new` keyword. An object is also known as an instance of the class,\
    \ and the process of creating an object is known as instantiating the class. Create\
    \ a new file in Bracket and save it as `chap9.php` to your htdocs folder. Add\
    \ the following code to `chap9.php`:\n\n```php\n<?php\ninclude 'Movie.php';\n\
    $mov1 = new Movie('N0001', 'Lusso', 4.99);\n```\nHere, we first use the `include`\
    \ statement to include `Movie.php` (which contains the code for the `Movie` class).\
    \ Next, we use the `new` keyword to create a `Movie` object called `$mov1`, passing\
    \ `'N0001'`, `'Lusso'` and `4.99` as arguments to the `construct()` method.\n\n\
    As `construct()` is a magic method, we do not call it using its name. Instead,\
    \ when we create a new `Movie` object, PHP looks for the `construct()` method\
    \ and executes it for us automatically. Remember the `$this` keyword in our `Movie`\
    \ class constructor? `$this` refers to the current object. When we use the statement\
    \ `$mov1 = new Movie('N0001', 'Lusso', 4.99)` to create `$mov1`, `$this` refers\
    \ to `$mov1`. In other words, when PHP executes the constructor, the statement:\n\
    \n```php\n$this->id = $pId;\n```\nin the constructor becomes\n\n```php\n$mov1->id\
    \ = 'N0001';\n```\nAs a result, the value `'N0001'` gets assigned to the `$id`\
    \ property of `$mov1`. The same applies to the other two assignment statements\
    \ in the constructor. Hence, the values `'Lusso'` and `4.99` get assigned to the\
    \ `$title` and `$rentalPrice` properties of `$mov1` respectively. Next, let’s\
    \ create a second `Movie` object called `$mov2` using the statement below:\n\n\
    ```php\n$mov2 = new Movie('P0002', 'Junior', 5.99);\n```\nWhen PHP creates `$mov2`\
    \ and calls the constructor, `$this` refers to `$mov2`. Hence, the statement:\n\
    \n```php\n$this->id = $pId;\n```\nin the constructor becomes\n\n```php\n$mov2->id\
    \ = 'P0002';\n```\nThe same applies to the other two assignment statements in\
    \ the constructor. As a result, the values `'P0002'`, `'Junior'` and `5.99` get\
    \ assigned to the `$id`, `$title` and `$rentalPrice` properties of `$mov2` respectively.\
    \ Got it? Good! Let’s move on.\n\n### 9.4 Accessing Class Members\nAfter creating\
    \ an object, we can use the object name and the `->` operator to access its properties\
    \ and methods. For instance, to access the properties and methods of `$mov1` in\
    \ `chap9.php`, we use the code below:\n\n```php\necho $mov1->title.'<BR>';\necho\
    \ $mov1->conversion('Japan').'<BR>';\n```\nHere, we first use the `->` operator\
    \ to access the `$title` property of `$mov1`. Next, we use the `->` operator to\
    \ call the `conversion()` method, passing `'Japan'` as an argument to the method.\
    \ Add the code above to `chap9.php` (after the instantiation statements) and load\
    \ the page, you’ll get:\n\n```\nLusso\n548.9\n```\nas the output. Pretty straightforward,\
    \ right?\n\nNow, suppose we want to access the `DISCOUNT` constant in the `Movie`\
    \ class, how do we do that? To access a class constant, we do not use the `->`\
    \ operator. Instead, we use the `::` operator. This is because class constants\
    \ are different from class properties; they are allocated once per class, not\
    \ once for each object. This means that all objects of the same class (`$mov1`\
    \ and `$mov2` in our example) share the same constants. In other words, even if\
    \ there are 100 `Movie` objects, there is only one memory allocated to store the\
    \ `DISCOUNT` constant. To access the `DISCOUNT` constant in the `Movie` class,\
    \ add the following code to `chap9.php`:\n\n```php\necho Movie::DISCOUNT.'<BR>';\n\
    echo $mov1::DISCOUNT.'<BR>';\necho $mov2::DISCOUNT.'<BR>';\n```\nIf you run the\
    \ code above, you’ll get:\n\n```\n10\n```\nthree times. This shows that we can\
    \ use either the class name (`Movie`) or the object name (`$mov1` or `$mov2`)\
    \ to access a class constant. All three give us the same value as they are accessing\
    \ the same memory location.\n\n### 9.5 Access Modifiers\nNow that we know how\
    \ to create objects and access class members using these objects, let’s discuss\
    \ a concept we skipped previously the `public` and `private` keywords. These two\
    \ keywords are known as access modifiers; they serve as gatekeepers controlling\
    \ where we can access a particular class member. `public` class members can be\
    \ accessed everywhere while `private` class members can only be accessed within\
    \ the class in which they are declared. In our `Movie` class, we have two `public`\
    \ properties (`$title` and `$rentalPrice`) and one `private` property (`$id`).\
    \ Previously, we learned to access the `$title` property of `$mov1` in `chap9.php`.\
    \ As `$title` is a `public` class property, we had no problems accessing it in\
    \ `chap9.php`. Now, let’s try accessing the `$id` property. Add the line:\n\n\
    ```php\necho $mov1->id.'<BR>';\n```\n"
  trans: "\n在构造函数内部，我们分别用 `$pId`、`$pTitle` 和 `$pRentalPrice` 的值初始化 `$id`、`$title`\
    \ 和 `$rentalPrice`。注意上面代码中的新关键字 `$this` 吗？我们将在下一节学习创建对象时再解释这个关键字。现在，只需要知道，每当我们想在类内部访问类的属性和方法时，我们需要使用\
    \ `$this` 关键字，后跟 `->` 运算符。接下来，让我们为我们的 `Movie` 类添加一个普通方法（即非魔术方法）。在 `construct()`\
    \ 方法之后（但在 `Movie` 类的结束大括号之前）添加以下方法：\n\n```php\npublic function conversion($country){\n\
    \  $rate = 1;\n  switch($country){\n    case 'UK':\n      $rate = 0.76;\n    \
    \  break;\n    case 'Japan':\n      $rate = 110;\n      break;\n  }\n  return\
    \ round($rate*$this->rentalPrice, 2); }\n```\n在这里，我们定义了一个名为 `conversion()` 的方法。该方法有一个参数\
    \ `$country` —— 并根据 `$country` 的值将美元转换为镑或日元。在方法内部，我们声明并初始化了一个名为 `$rate` 的变量，并使用\
    \ `switch` 语句根据 `$country` 的值更新其值。接下来，我们将 `$rate` 与 `$rentalPrice` 属性相乘（`$rate*$this->rentalPrice`），并将结果作为参数传递给名为\
    \ `round()` 的内置函数。该函数接受两个参数，并将第一个参数舍入到第二个参数指定的精度。在我们的方法中，我们将乘积保留到 2 位小数。最后，我们使用\
    \ `return` 关键字返回 `round()` 函数的结果。\n\n在方法内部，注意我们没有使用 `$this` 关键字来访问 `$country`\
    \ 和 `$rate` 吗？这是因为 `$country` 是一个参数，而 `$rate` 是一个局部变量（即在方法内部定义的变量）。换句话说，它们不是类的属性。我们只在访问类属性和方法时才使用\
    \ `$this` 关键字。例如，我们使用 `$this` 关键字来访问 `$rentalPrice` 属性。明白了吗？一旦你将 `conversion()`\
    \ 方法添加到 `Movie` 类中，我们的类就完整了。我们现在准备好使用这个类了。为了做到这一点，我们需要从它创建一个对象。\n\n### 9.3 创建对象\n\
    要创建一个对象，我们使用 `new` 关键字。对象也被称为类的实例，创建对象的过程被称为类的实例化。在 Bracket 中创建一个新文件并将其保存为 `chap9.php`，到你的\
    \ htdocs 文件夹中。在 `chap9.php` 中添加以下代码：\n\n```php\n<?php\ninclude 'Movie.php';\n\
    $mov1 = new Movie('N0001', 'Lusso', 4.99);\n```\n在这里，我们首先使用 `include` 语句包含 `Movie.php`（包含\
    \ `Movie` 类的代码）。接下来，我们使用 `new` 关键字创建一个名为 `$mov1` 的 `Movie` 对象，并将 `'N0001'`、`'Lusso'`\
    \ 和 `4.99` 作为参数传递给 `construct()` 方法。\n\n由于 `construct()`一个魔术方法，我们不通过它的名称调用它。相反，当我们创建一个新的\
    \ `Movie` 对象时，PHP 会自动寻找 `construct()` 方法并为我们执行。还记得我们 `Movie` 类构造函数中的 `$this` 关键字吗？`$this`\
    \ 指向当前对象。当我们使用语句 `$mov1 = new Movie('N0001', 'Lusso', 4.99)` 创建 `$mov1` 时，`$this`\
    \ 指向 `$mov1`。换句话说，当 PHP 执行构造函数时，构造函数中的语句：\n\n```php\n$this->id = $pId;\n```\n\
    变为\n\n```php\n$mov1->id = 'N0001';\n```\n结果是值 `'N0001'` 被赋值给 `$mov1` 的 `$id` 属性。构造函数中的另外两个赋值语句也是如此。因此，值\
    \ `'Lusso'` 和 `4.99` 分别赋值给 `$mov1` 的 `$title` 和 `$rentalPrice` 属性。接下来，让我们使用下面的语句创建名为\
    \ `$mov2` 的第二个 `Movie` 对象：\n\n```php\n$mov2 = new Movie('P0002', 'Junior', 5.99);\n\
    ```\n当 PHP 创建 `$mov2` 并调用构造函数时，`$this` 指向 `$mov2`。因此，构造函数中的语句：\n\n```php\n$this->id\
    \ = $pId;\n```\n变为\n\n```php\n$mov2->id = 'P0002';\n```\n构造函数中的另外两个赋值语句也是如此。结果是值\
    \ `'P0002'`、`'Junior'` 和 `5.99` 分别赋值给 `$mov2` 的 `$id`、`$title` 和 `$rentalPrice`\
    \ 属性。明白了吗？很好！继续。\n\n### 9.4 访问类成员\n创建对象后，我们可以使用对象名和 `->` 运算符来访问它的属性和方法。例如，要在 `chap9.php`\
    \ 中访问 `$mov1` 的属性和方法，我们使用下面的代码：\n\n```php\necho $mov1->title.'<BR>';\necho $mov1->conversion('Japan').'<BR>';\n\
    ```\n在这里，我们首先使用 `->` 运算符访问 `$mov1` 的 `$title` 属性。接下来，我们使用 `->` 运算符调用 `conversion()`\
    \ 方法，并将 `'Japan'` 作为参数。将上述代码添加到 `chap9.php`（在实例化语句之后）并加载页面，你将得到：\n\n```\nLusso\n\
    548.9\n```\n非常直观吧？\n\n现在，假设我们要访问 `Movie` 类中的 `DISCOUNT` 常量，该怎么做？访问类常量不使用 `->`\
    \ 运算符。相反，我们使用 `::` 运算符。这是因为类常量与类属性不同；它们每个类分配一次，而不是每个对象一次。这意味着同一类的所有对象（在我们示例中的\
    \ `$mov1` 和 `$mov2`）共享相同的常量。换句话说，即使有 100 个 `Movie` 对象，也只有一个内存用于存储 `DISCOUNT` 常量。要访问\
