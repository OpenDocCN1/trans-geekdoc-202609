    create a new file named `chap5.php` to test the examples in this chapter.


    ## 5.1 Strings

    A string refers to a piece of text. In PHP, strings must be enclosed in single
    or double quotation marks. For instance, if we write:


    ```php

    $msg = ''Hello'';

    $greeting = "Good Morning";

    $emptyStr = "";

    ```


    `$msg` and `$greeting` store the strings ''Hello'' and "Good Morning" respectively.
    `$emptyStr`, on the other hand, stores a special string known as an empty string.
    This is because there is no text enclosed within the pair of double quotation
    marks we assign to it.


    In PHP, you can combine multiple strings using the concatenate operator (`.`).
    Let’s look at an example:


    ```php

    $areacode = "(208)";

    $contact = ''+1'' . $areacode . ''1234567'';

    echo $contact;

    ```


    Here, we use the concatenate operator twice to concatenate the string ''+1'',
    the variable `$areacode` and the string ''1234567'' to form a new string. I’ve
    added spaces before and after the concatenate operators so that you can see the
    three components more clearly; you do not need to add these spaces. After concatenating,
    we assign the new string to a variable called `$contact` and use the `echo` statement
    to echo its value. If you run the code above, you’ll get


    ```

    +1(208)1234567

    ```

    as the output.


    ### 5.1.1 Commonly used String Functions in PHP

    Next, let’s discuss some of the commonly used string functions in PHP. PHP comes
    with a large number of built-in functions for working with strings. Most functions
    return a result after performing their tasks. We can assign the result to a variable
    or use the `echo` statement to display the result directly. A function may have
    different variations as some functions allow us to provide optional arguments
    to modify the function’s behavior. The examples below discuss the most common
    and useful approach to using each function.


    #### `strlen()`

    The `strlen()` function gives us the length of a string.

    Example:

    ```php

    $str1 = ''Good Day!'';

    echo strlen($str1);

    ```

    Output: `9`

    Here, we declare a variable called `$str1` and assign the string ''Good Day!''
    to it. Next, we pass `$str1` to `strlen()` and use the `echo` statement to display
    the function''s result directly. We get 9 as the output because 4 (''Good'') +
    1 ('' '') + 3 (''Day'') + 1 (''!'') = 9.


    #### `strtolower()`, `strtoupper()`

    The `strtolower()` and `strtoupper()` functions convert a string to lowercase
    and uppercase respectively and return the new string. The original string is not
    changed.

    Example:

    ```php

    $str2 = ''Hello World'';

    $str3 = strtolower($str2);

    $str4 = strtoupper($str2);

    echo ''<BR>''.$str2;

    echo ''<BR>''.$str3;

    echo ''<BR>''.$str4;

    ```

    Here, we declare a variable called `$str2` and assign the string ''Hello World''
    to it. Next, we pass `$str2` to `strtolower()` and `strtoupper()` and assign the
    results to `$str3` and `$str4` respectively. Finally, we use three `echo` statements
    to echo the values of `$str2`, `$str3` and `$str4`. In each case, we concatenate
    `<BR>` with the variable so that the output will start on a new line. If you run
    the code above, you’ll get

    ```

    Hello World

    hello world

    HELLO WORLD

    ```

    as the output.


    #### `trim()`

    The `trim()` function removes whitespaces from the front and end of a string by
    default and returns the new string. You can specify other characters for it to
    remove by passing a second argument.

    Example 1:

    ```php

    $str5 = '' is '';

    echo ''PHP''.$str5.''Fun<BR>'';

    echo ''PHP''.trim($str5).''Fun<BR>'';

    ```

    Output:

    ```

    PHP is Fun

    PHPisFun

    ```

    Here, we first concatenate `$str5` with the strings ''PHP'' and ''Fun<BR>'' and
    use an `echo` statement to echo the resulting string. We get “PHP is Fun” as the
    output. Next, we use the `trim()` function to remove whitespaces from `$str5`
    and concatenate it with ''PHP'' and ''Fun<BR>'' again. We get “PHPisFun” as the
    output.


    Example 2:

    ```php

    $str6 = ''\*\*Hello\*\*World\*\*'';

    echo trim($str6, ''\*'');

    ```

    Output: `Hello\*\*World`

    Here, we pass `''\*''` to the `trim()` function as the second argument. As a result,
    asterisks (instead of whitespaces) are removed from the front and back of `$str6`
    and we get “Hello\*\*World” as the output.


    #### `substr()`

    The `substr()` function returns a substring. To use this function, we need to
    pass two arguments to it - the string to extract the substring from and the position
    to start extracting it. We can also pass a third argument to specify the length
    of the substring to extract. If we do not provide this argument, the function
    extracts the substring starting from the specified starting position to the end
    of the string. Positions in strings start from 0, not 1. For instance, if we have
    a string ''ABCDEF'', ''A'' is at position 0, ''B'' is at position 1 and so on.
    Positions can also be negative. If it is negative, it is counted from the back
    of the string. In ''ABCDEF'', ''F'' is at position -1, ''E'' is at position -2
    etc.

    Example:

    ```php

    $str7 = ''ABCDEF'';

    echo substr($str7, 2).<BR>'';

    echo substr($str7, -3).<BR>'';

    echo substr($str7, 2, 1);

    ```

    Output:

    ```

    CDEF

    DEF

    C

    ```

    '
  trans: '

    我们得到 25，因为幂运算符给了我们 5 的 2 次方的值。


    ### 4.5.3 复合赋值运算符

    除了上述的算术运算符外，我们还有一组将算术运算与赋值结合的运算符。假设你有一个变量 `$x = 5;`，并且你想给 `$x` 加 3，你可以这样操作：


    ```php

    $x = $x + 3;

    ```


    赋值总是从右向左进行的。因此，右侧的表达式（`$x + 3`）首先被求值，得到 `5+3`。然后这个值被赋值回左侧的变量 `$x`。换句话说，`$x` 的值变成了
    8。


    除了 `$x = $x + 3;` 之外，我们还可以使用 `+=` 运算符。该运算符是赋值运算符与加法运算符的简写。如果你写：


    ```php

    $x = 5;

    $x += 3;

    echo $x;

    ```

    你将得到输出 8。`$x += 3` 仅仅意味着 `$x = $x + 3`。


    除了 `+=` 运算符，我们还有 `-=` 运算符，它将 `-` 运算符与赋值运算符结合。同样适用于上一节中提到的所有算术运算符。因此，`$x -= 4`
    等同于 `$x = $x - 4`，`$x *= 2` 等同于 `$x = $x*2`，依此类推。


    ### 4.5.4 增减运算符

    最后但同样重要的是，让我们来谈谈增（`++`）和减（--`）运算符。这些运算符将变量的值加减 1 并返回新值。让我们尝试一些代码（添加行号以便参考）。


    ```php

    1 $q = 3;

    2 echo "<BR>$q<BR>";

    3 echo ++$q;

    ```


    如果你运行上面的代码，将得到以下输出：

    ```

    3

    4

    ```


    第 2 行使用 `echo` 语句输出 `$q` 的原始值。第 3 行执行了以下操作：

    1. 将 `$q` 的值加 1

    2. 输出 `$q` 的新值


    因此，我们得到了输出 4。`++` 运算符被称为递增运算符。它可以放置在变量名的之前（称为前递增）或之后（后递增）。尝试将上面的第 3 行改为 `echo
    $q++;` 并重新运行代码，你将得到


    ```

    3

    3

    ```

    这次的输出是这个。感到惊讶吗？这是因为第 3 行现在执行的是以下操作：

    1. 输出 `$q` 的原始值。

    2. 将 `$q` 的值加 1


    换句话说，这两个任务（递增和输出）的执行顺序反过来了。递增是在 `echo` 语句执行后完成的（因此后递增）。为了证明 `$q` 确实增加了，你可以在第 3
    行之后再次 `echo` 它的值。这次你会得到输出 4。明白了吗？


    除了递增运算符，我们还有递减运算符（`--`）。该运算符由两个减号组成，并将变量的值减 1。它也可以作为前递减或后递减运算符使用。


    # 第 5 章：PHP 更多数据类型

    在上一章中，我们查看了 PHP 的一些基本数据类型。在本章中，我们将讨论另外两种数据类型——字符串和数组。你可以创建一个名为 `chap5.php` 的文件来测试本章中的示例。


    ## 5.1 字符串

    字符串指的是一段文本。在 PHP 中，字符串必须包含在单引号或双引号中。例如，如果我们写：


    ```php

    $msg = ''Hello'';

    $greeting = "Good Morning";

    $emptyStr = "";

    ```


    `$msg` 和 `$greeting` 分别存储字符串 ''Hello'' 和 "Good Morning"。而 `$emptyStr` 存储一个双引号内的空字符串。


    在 PHP 中，你可以使用连接运算符（`.`）组合多个字符串。让我们看这个例子：


    ```php

    $areacode = "(28)";

    $contact = ''+1'' . $areacode . ''23456'';

    echo $contact;

    ```

    在这里，我们两次使用连接运算符将字符串 ''+1''、变量 `$areacode` 和字符串 ''23456'' 组合在一起。我在连接运算符前后添加了空格，以便你可以清楚地看到这三个部分；不需要添加这些空格。连接后，我们将新字符串赋值给变量
    `$contact` 并使用 `echo` 语句输出它的值。如果你运行上面的代码，将得到


    ```

    +1(28)23456

    ```

    输出。


    ### 5.1.1 常用的字符串函数

    接下来，让我们讨论 PHP 中常用的字符串函数。PHP 带有许多用于处理字符串的内置函数。大多数函数在执行任务后返回结果。我们可以将结果赋值给变量，或使用
    `echo` 语句直接显示。某些函数允许我们提供参数来修改函数的行为。下面的示例讨论了最常用的函数。


    #### `strlen()`

    `strlen()` 函数返回字符串的长度。示例：

    ```php

    $str1 = ''Good Day!'';

    echo strlen($str1);

    ```

    输出：`9`

    在这里，我们定义变量 `$str1`并将字符串 ''Good Day!'' 赋值给它。接下来，我们将 `$str1` 传递给 `strlen()` 并使用
    `echo` 语句显示结果。我们得到输出 9，因为 4 (''Good'') + 1 ('' '') + 3 (''Day'') + 1 (''!'') =
    9。


    #### `strtolower()`, `strtoupper()`

    `strtolower()` 和 `strtoupper()` 函数分别将字符串转换为小写和大写，并返回新字符串。原始字符串没有改变。示例：

    ```php

    $str2 = ''Hello World'';

    $str3 = strtolower($str2);

    $str4 = strtoupper($str2);

    echo ''<BR>''.$str2;

    echo ''<BR>''.$str3;

    echo ''<BR>''.$str4;

    ```

    在这里，我们定义变量 `$str2`并将字符串 ''Hello World'' 赋值给它。接下来，我们将 `$str2` 传递给 `strtolower()`
    和 `strtoupper()`，并将结果赋值给 `$str3` 和 `$str4`。最后，我们使用三个 `echo` 语句输出 `$str2`、 `$str3`
    和 `$str4` 的值。在每种情况下，我们都与变量连接了 `<BR>`，以便输出从新行开始。如果你运行上面的代码，将得到


    ```

    Hello World

    hello world

    HELLO WORLD

    ```


    #### `trim()`

    `trim()` 函数默认从字符串的开头端移除空格。你可以通过传递第二个参数指定要移除的字符。示例 1：

    ```php

    $str5 = '' is '';

    echo ''PHP''.$str5.''Fun'';

    echo ''PHP''.trim($str5).''Fun'';

    ```

    输出：

    ```

    PHP is Fun

    PHPFun

    ```

    在这里，我们首先将 `$str5` 与字符串 ''PHP'' 和 ''Fun'' 连接，并使用 `echo` 语句输出生成的字符串。我们得到输出 "PHP
    is Fun"。接下来，我们使用 `trim()` 函数移除 `$str5` 中的空格，并再次与 ''PHP'' 和 ''Fun'' 组合。我们得到输出 "PHPFun"。


    示例 2：

    ```php

    $str6 = ''\*\*Hello\*\*World\*\*'';

    echo trim($str6, ''\*'');

    ```

    输出：`Hello**World`

    在这里，我们将 `''\''` 作为第二个参数传递给 `trim()` 函数。结果是从 `$str6` 的开头和结尾移除了星号（而不是空格），我们得到输出
    "Hello**World"。


    #### `substr()`

    `substr()` 函数返回一个子串。要使用此函数，我们需要向它传递两个参数——提取子串的字符串以及开始提取的位置。我们还可以传递第三个参数来指定要提取的子串长度。如果不提供此参数，函数将从指定的起始位置提取到字符串末尾的子串。字符串中的位置从
    0 开始，而不是 1。例如，如果我们有一个字符串 ''ABCDEF''，''A'' 在位置 0，''B'' 在位置 1，依此类推。位置也可以是负数。如果是负数，则从字符串末尾计数。在
    ''ABCDEF'' 中，''F'' 在位置 -1，''E'' 在位置 -2 等。示例：

    ```php

    $str7 = ''ABCDEF'';

    echo substr($str7, 2);

    echo substr($str7, -3);

    echo substr($str7, 2, 1);

    ```

    输出：

    ```

    CDEF

    DEF

    C

    ```

