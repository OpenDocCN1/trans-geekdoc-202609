    \ the user is trying to access write.php without logging in with an admin account.\
    \  \n\nIf that’s the case, we use the header() function to redirect them to admin.php\
    \ . Else, we do the following: First, declare and initialize a Helper object called\
    \ $h . Next, declare four variables$title ,$post , $audience and$msg and assign\
    \ an empty string to each of them. After that, check if the “submit” button has\
    \ been clicked. If it has, assign $\\_POST\\['title'\\] , $\\_POST\\['post'\\\
    ] and $\\_POST\\['audience'\\] to$title ,$post and$audience respectively. Next,\
    \ check that all fields in write.php have been filled out. If there is an empty\
    \ field, assign an appropriate error message to$msg . Else, create an Admin object\
    \ using $\\_SESSION\\['username'\\] as the argument. Use this object to call the\
    \ insertIntoPostDB() method. (Refer to the Admin class to decide what arguments\
    \ to pass to the method.) Once that is done, assign the string 'Message saved\
    \ successfully' to $msg . Clear? Try coding p-write.php yourself. Once you are\
    \ done, we are ready to move on to the most complex processing file p-read.php\
    \ .  \n\n13.6.5 p-read.php This file is for processing read.php , which is used\
    \ for displaying posts to readers. We need to implement two essential features\
    \ in pread.php : First, depending on whether the user is logged in, we need to\
    \ display different posts. If the user is logged in, we display all posts. Else,\
    \ we only display “Public” posts. Next, if the user is logged in, we need to display\
    \ a “New” icon for posts posted to the database after the user’s last login. To\
    \ achieve the above, open p-read.php and do the following: First, declare a variable\
    \ called $h and assign aHelper object to it. Next, declare a variable called $update\
    \ and assignfalse to it. Last but not least, declare a variable called $is\\_member\
    \ and assign isset($\\_SESSION\\['username'\\]) to it. Here, we use the isset()\
    \ function to check if the session variable $\\_SESSION\\['username'\\] is set.\
    \ If it is (i.e.,isset() returns true ), we know that the reader accessing read.php\
    \ is logged in. Try doing the above yourself.  \n\nNext, we need to use a couple\
    \ ofif-else statements in p-read.php . The structure is shown below: if ($is\\\
    _member){  \n\n//Create a BlogMember object and use it to call  \n\nthe getLastViewedPost()\
    \ method  \n\n}else{  \n\n//Create a BlogReader object  \n\n} // Call getPostsFromDB()\
    \ method if ($posts == false){  \n\n//include the blankcard.html file  \n\n}else{\
    \  \n\n//use a foreach loop to process the elements in  \n\n$posts  \n\n//include\
    \ the messagecard.php file  \n\n} if ($is\\_member)  \n\n{  \n\n//include the\
    \ logout.html file if ($update)  \n\n//use the BlogMember object to call the updateLastViewedPost()\
    \ method  \n\n} In the first if-else statement, we check if the user is logged\
    \ in. If the user is logged in (i.e.,$is\\_member istrue ), we initialize a BlogMember\
    \ object and assign it to a variable called $reader . We then use$reader to call\
    \ thegetLastViewedPost() method in the BlogMember class and assign the result\
    \ to a variable called $lastPost . On the other hand, if the user is not logged\
    \ in, we initialize a BlogReader object and assign it to$reader . Try coding this\
    \ if-else statement yourself. Refer to the respective classes to find out what\
    \ needs to be passed to the various methods when calling them. Once the if-else\
    \ statement is complete, we need to use the $reader object to call thegetPostsFromDB()\
    \ method; this method is defined in theBlogReader class. Recall that BlogMember\
    \ is a subclass ofBlogReader ? Hence, regardless of whether $reader is a BlogMember\
    \ or BlogReader object, it can access the getPostsFromDB() method. Try calling\
    \ this method yourself and assign the result to a variable called$posts . Next,\
    \ we need to use a second if-else statement to check if getPostsFromDB() returned\
    \ any results. If there are no results (i.e., $post isfalse ), we want to display\
    \ the HTML code in blankcard.html (located in the output\\_code folder). To include\
    \ this file, we use the following statement: include \"output\\_code/blankcard.html\"\
    ;  \n\nNext, inside the else block (if there are results), we use a foreach loop\
    \ to loop through$posts . $posts is a two-dimensional array fetched using the\
    \  \n\ngetPostsFromDB() method in theBlogReader class. This method uses the queryDB()\
    \ method in the Database class, which in turn uses the built-in fetchAll() method\
    \ in the PDO class. The fetchAll() method fetches data from a table as a two-dimensional\
    \ array, where each element in the array is an array representing a row from the\
    \ table. In our p-read.php file, we assign the data fetched from the“posts” table\
    \ to $posts . To process$posts , we can loop through it using the following foreach\
    \ loop. foreach($posts as $result)  \n\n{  \n\n$msgid = $result\\['id'\\];  \n\
    \n$title = htmlspecialchars($result\\['title'\\]); $post = strip\\_tags($result\\\
    ['post'\\], \"<strong><em>  \n\n<p><ol><ul><li><a>\");  \n\n$username =  \n\n\
    htmlspecialchars($result\\['username'\\]);  \n\n$postdate =  \n\nhtmlspecialchars($result\\\
    ['post\\_date'\\]); include \"output\\_code/messagecard.php\";  \n\n} For each\
    \ iteration, we assign the array in $posts to $result . Next, inside the loop,\
    \ we assign the elements in $result to various variables. For instance, we assign\
    \ $result\\['title'\\] to $title . However, before we do that, we apply the htmlspecialchars()\
    \ function to $result\\['title'\\] first. The same applies to  \n\n$result\\['username'\\\
    ] and $result\\['post\\_date'\\] . The reason for this is we’ll be displaying\
    \ the values of these elements in read.php later. Hence, we have to convert any\
    \ special characters in these elements to HTML entities to prevent cross-site\
    \ scripting. Refer to Chapter 8.1.6 if you have forgotten what cross-site scripting\
    \ is. However, notice that we did not apply thehtmlspecialchars() function to$result\\\
    ['post'\\] ? This is because we want to allow certain HTML tags in  \n\n$result\\\
    ['post'\\] . Specifically, we want to allow the<strong> , <em> ,<p> , <ol> , <ul>\
    \ , <li> and <a> tags. To do that, we need to use another built-in function called\
    \ strip\\_tags() . This function strips a string of all HTML tags except those\
    \ passed as a second argument to the function. Hence, strip\\_tags($result\\['post'\\\
    ], \"<strong><em><p><ol><ul> <li><a>\");  "
