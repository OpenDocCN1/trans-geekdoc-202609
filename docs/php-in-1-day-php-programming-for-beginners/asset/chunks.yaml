  fmt: "\n`getLastViewedPost()` method is complete and so is the `BlogMember` class.\n\
    \n### 13.5.5 Admin.php\n\nWe are left with one more class to code - the `Admin`\
    \ class. The `Admin` class has two private properties `$db` and `$username`. Inside\
    \ the class, we have a constructor with one parameter `$pUsername`. This constructor\
    \ initializes `$username` with `$pUsername` and `$db` with a new `Database` object.\
    \ Try declaring the class and properties and implement the constructor yourself.\n\
    \nNext, we have a public method called `isValidLogin()` that has one parameter\
    \ `$pPassword`. This method is very similar to the `isValidLogin()` method in\
    \ the `BlogMember` class except that it executes the following SQL statement:\
    \ `SELECT password FROM members WHERE username = :username AND is_admin = true`\n\
    \nTry coding this method yourself.\n\nOnce that is done, we can move on to the\
    \ final method `insertIntoPostDB()`.\n\nThis method is public and has three parameters\
    \ `$title`, `$post` and `$audience`.\n\nInside the method, we use the `queryDB()`\
    \ method to execute the following SQL statement: `INSERT INTO posts (username,\
    \ title, post, audience) VALUES (:username, :title, :post, :audience)` You need\
    \ to bind the `$username` property to `:username` and the parameters `$title`,\
    \ `$post` and `$audience` to `:title`, `:post` and `:audience` respectively. In\
    \ addition, you need to choose the correct mode for `queryDB()`. Try coding this\
    \ method yourself.\n\nDone? Great! All our classes are now complete. We are ready\
    \ to move on to the process folder.\n\n## 6. Editing The process Folder\n\nThe\
    \ files in the process folder are for processing HTML forms.\n\n#### 1. p-index.php\n\
    \nWe’ll start with `p-index.php`. This file is for processing `index.php`, which\
    \ contains a form for members to log in to read “Members Only” posts. `index.php`\
    \ has two input boxes named “username” and “password” and one button named “submit”.\
    \ If an error occurs when processing `index.php`, the page echoes an error message\
    \ stored in a variable called `$msg`. If you open `p-index.php` (inside the process\
    \ folder), you’ll see that the code has already been completed for you. This is\
    \ done so that you can refer to this file when working on other processing files\
    \ later. Let’s run through the code together.\n\nFirst, we declare a variable\
    \ called `$h` and assign a new `Helper` object to it. Next, we declare two variables\
    \ `$msg` and `$username` and assign an empty string to each of them. After declaring\
    \ and initializing the variables, we are ready to process the form in `index.php`.\
    \ We use the following `if` statement to check if the “submit” button has been\
    \ clicked:\n\n```\nif (isset($_POST['submit'])) {\n}\n```\n\nInside the `if` block,\
    \ we first assign `$_POST['username']` to `$username`. We need to do this as we’ll\
    \ be using `$username` in `index.php` later. Next, we use an `if-else` statement\
    \ to check if users have entered data into both the “username” and “password”\
    \ input boxes. To do that, we use `$h` to call the `isEmpty()` method in the `Helper`\
    \ class. This method accepts an array that contains all the variables we want\
    \ to check. We pass the following array to the method: `array($username, $_POST['password'])`.\
    \ If any of the elements in the array is an empty string, the `isEmpty()` method\
    \ returns `true`. When that happens, the `if` block is executed and the string\
    \ 'All fields are required' is assigned to `$msg`.\n\nOn the other hand, if none\
    \ of the elements are empty, the `else` block is executed. Inside the `else` block,\
    \ we create a `BlogMember` object called `$member`. Next, we have another `if-else`\
    \ statement. This inner `if-else` uses the `$member` object to call the `isValidLogin()`\
    \ method in the `BlogMember` class. If the method returns `false`, the condition\
    \ `!$member->isValidLogin($_POST['password'])` evaluates to `true` (as `!false`\
    \ equals `true`) and the `if` block is executed. The string 'Invalid Username\
    \ or Password' will then be assigned to `$msg`.\n\nOn the other hand, if the method\
    \ returns `true`, the `else` block is executed. Within this `else` block, we assign\
    \ `$username` to a session variable called `$_SESSION['username']` and use the\
    \ `header()` function to redirect users to `read.php`. Once that is done, the\
    \ `p-index.php` page is complete. Go through `p-index.php` carefully and make\
    \ sure you understand it before proceeding. Got it? Great!\n\n#### 13.6.2 p-admin.php\n\
    \nLet’s move on to the `p-admin.php` file now. This file is for processing `admin.php`,\
    \ which contains a form for admin to log in. `admin.php` has two input boxes named\
    \ “username” and “password” and one button named “submit”. If an error occurs\
    \ when processing `admin.php`, the page echoes an error message stored in a variable\
    \ called `$msg`. As you may have guessed, `p-admin.php` is very similar to `p-index.php`.\
    \ Here’s what we need to do in `p-admin.php`:\n\n1. First, declare and initialize\
    \ `$h`, `$msg` and `$username` (similar to what was done in `p-index.php`).\n\
    2. Next, check if the “submit” button has been clicked. If it has, assign `$_POST['username']`\
    \ to `$username`.\n3. Next, ensure that all input boxes are not empty. If any\
    \ of the boxes are empty, assign an appropriate error message to `$msg`.\n4. Else,\
    \ create an `Admin` object and use it to call the `isValidLogin()` method. (Refer\
    \ to the `Admin` class to find out what needs to be passed to the constructor\
    \ and the `isValidLogin()` method when calling them.)\n5. If `isValidLogin()`\
    \ returns `false`, assign an appropriate error message to `$msg` to inform users\
    \ that the login credentials are invalid.\n6. Else, assign `$username` to `$_SESSION['username']`.\
    \ In addition, declare a session variable called `$_SESSION['is_admin']` and assign\
    \ `true` to it.\n7. Finally, redirect users to `write.php` using the `header()`\
    \ function.\n\nGot it? Try coding `p-admin.php` yourself. You can refer to `p-index.php`\
    \ for reference.\n\nOnce you are done, we are ready to move on to `p-signup.php`.\n\
    \n#### 13.6.3 p-signup.php\n\n`p-signup.php` is for processing `signup.php`, which\
    \ contains a form for members to sign up. To keep this project short, we’ll only\
    \ create a sign-up form for blog members, not for admin. We’ll learn to convert\
    \ a blog member to an admin later using phpMyAdmin. The sign-up form for blog\
    \ members (`signup.php`) has three input boxes named “username”, “password” and\
    \ “confirm_password” and one button named “submit”. If an error occurs when processing\
    \ `signup.php`, the page echoes an error message stored in a variable called `$msg`.\
    \ Here’s what we need to do in `p-signup.php`:\n\n1. First, declare and initialize\
    \ variables `$h`, `$msg` and `$username` (similar to what was done in `p-index.php`).\n\
    2. Next, check if the “submit” button has been clicked. If it has, we first assign\
    \ `$_POST['username']` to `$username`.\n3. Next, we need to ensure the following:\n\
    \   - 1. All input boxes in `signup.php` have been filled out\n   - 2. `$username`\
    \ has a length between 6 and 100 characters (inclusive)\n   - 3. `$_POST['password']`\
    \ has a length between 8 and 20 characters (inclusive)\n   - 4. `$_POST['password']`\
    \ contains at least one lowercase character, one uppercase character and one digit.\n\
    \   - 5. `$_POST['password']` and `$_POST['confirm_password']` match\n4. If any\
    \ of the cases above are not met, we assign an appropriate error message to `$msg`.\n\
    5. Else, we do the following:\n   - Create a `BlogMember` object and use it to\
    \ call the `isDuplicateID()` method. If the method returns `true`, assign an appropriate\
    \ error message to `$msg`, informing users that the username is already in use.\n\
    \   - Else, use the `BlogMember` object to call the `insertIntoMemberDB()` method\
    \ and use the `header()` function to redirect users to `index.php`. Append the\
    \ query string `new=1` to `index.php`.\n\nGot it? Try coding `p-signup.php` yourself.\n"
  trans: "\n\n`getLastViewedPost()` 方法已经完成，`BlogMember` 类也已经完成。\n\n### 13.5.5 Admin.php\n\
    \n我们还剩下一个类需要编写 - 即 `Admin` 类。`Admin` 类有两个私有属性 `$db` 和 `$username`。在类内部，我们有一个带参数\
    \ `$pUsername` 的构造函数。该构造函数用 `$pUsername` 初始化 `$username`，并用一个新的 `Database` 对象初始化\
    \ `$db`。尝试自己声明该类和属性，并实现构造函数。\n\n接下来，我们有一个名为 `isValidLogin()` 的公有方法，它包含一个参数 `$pPassword`。这个方法与\
    \ `BlogMember` 类中的 `isValidLogin()` 方法非常相似，唯一的区别在于它执行了以下 SQL 语句：`SELECT password\
    \ FROM members WHERE username = :username AND is_admin = true`\n\n尝试自己编写这个方法。\n\
    \n完成后，我们就可以进入最后一个方法 `insertIntoPostDB()` 了。\n\n该方法是公共的，并有三个参数 `$title`、`$post`\
    \ 和 `$audience`。\n\n在方法内部，我们使用 `queryDB()` 方法执行以下 SQL 语句：`INSERT INTO posts (username,\
    \ title, post, audience) VALUES (:username, :title, :post, :audience)` 你需要将 `$username`\
    \ 属性绑定到 `:username`，并将参数 `$title`、`$post` 和 `$audience` 分别绑定到 `:title`、`:post`\
    \ 和 `:audience`。此外，你需要为 `queryDB()` 选择正确的模式。尝试自己编写这个方法。\n\n完成了？太棒了！所有的类现在都完成了。我们准备好进入\
    \ process 文件夹了。\n\n## 6. 编辑 process 文件夹\n\nprocess 文件夹中的文件用于处理 HTML 表单。\n\n####\
    \ 1. p-index.php\n\n我们将从 `p-index.php` 开始。这个文件用于处理 `index.php`，后者包含一个供成员登录以阅读“会员专属”文章的表单。`index.php`\
    \ 有两个名为“username”和“password”的输入框，以及一个名为“submit”的按钮。如果在处理 `index.php` 时发生错误，页面将输出存储在变量\
    \ `$msg` 中的错误提示信息。如果你打开 `p-index.php`（在 process 文件夹内），你会发现代码已经为你写好了。这样做是为了让你以后在处理其他处理文件时可以参考此文件。让我们一起过一遍代码。\n\
    \n首先，我们声明一个变量 `$h` 并给它分配一个新的 `Helper` 对象。接下来，我们声明两个变量 `$msg` 和 `$username`，并给它们各分配空字符串。在声明并初始化变量后，我们就准备好处理\
    \ `index.php` 中的表单了。我们使用以下 `if` 语句检查是否点击了“submit”按钮：\n\n```\nif (isset($_POST['submit']))\
    \ {\n}\n```\n\n在 `if` 块内部，我们首先将 `$_POST['username']` 赋值给 `$username`。我们需要这样做是因为我们稍会在\
    \ `index.php` 中使用 `$username`。接下来，我们使用 `if-else` 语句检查用户是否在“username”和“password”输入框中都输入数据。为了实现这一点，我们使用\
    \ `$h` 调用 `Helper` 类中的 `isEmpty()` 方法。该方法接受一个包含我们想要检查的所有变量的数组。我们向方法传递以下数组：`array($username,\
    \ $_POST['password'])`。如果数组中的任何元素为空字符串，`isEmpty()` 方法将返回 `true`。发生这种情况时，将执行 `if`\
    \ 块并将字符串 'All fields are required' 赋值给 `$msg`。\n\n另一方面，如果没有任何元素为空，则执行 `else` 块。在\
    \ `else` 块内部，我们创建一个名为 `$member` 的 `BlogMember` 对象。接下来，我们有另一个 `if-else` 语句。这个内部的\
    \ `if-else` 使用 `$member` 对象调用 `BlogMember` 类中的 `isValidLogin()` 方法。如果方法返回 `false`，条件\
    \ `!$member->isValidLogin($_POST['password'])` 为 `true`（因为 `!false` 等于 `true`），并执行\
    \ `if` 块。然后会将字符串 'Invalid Username or Password' 赋值给 `$msg`。\n\n另一方面，如果方法返回 `true`，则执行\
    \ `else` 块。在 `else` 块内部，我们将 `$username` 赋值给会话变量 `$_SESSION['username']` 并使用 `header()`\
    \ 函数将用户重定向到 `read.php`。完成后，`p-index.php` 页面就完成了。仔细检查 `p-index.php` 并在继续之前确保你已经理解了它。明白了吗？太棒了！\n\
    \n#### 13.6.2 p-admin.php\n\n现在让我们来看 `p-admin.php` 文件。这个文件用于处理 `admin.php`，其中包含一个供登录的表单。`admin.php`\
    \ 有两个名为“username”和“password”的输入框，以及一个名为“submit”的按钮。如果在处理 `admin.php` 时发生错误，页面将输出存储在变量\
    \ `$msg` 中的错误提示信息。正如你猜的那样，`p-admin.php` 与 `p-index.php` 非常相似。我们在 `p-admin.php`\
    \ 中需要做：\n\n1. 首先，声明并初始化 `$h`、 `$msg` 和 `$username`（类似于 `p-index.php` 中的操作）。\n\
    2. 接下来，检查是否点击了“submit”按钮。如果是，将 `$_POST['username']` 赋值给 `$username`。\n3. 接下来，确保所有输入框都不空。如果任何框为空，将相应的错误信息赋值给\
    \ `$msg`。\n4. 否则，创建一个 `Admin` 对象并使用它调用 `isValidLogin()` 方法。（参考 `Admin` 类以查找调用构造函数和\
    \ `isValidLogin()` 方法时需要传递什么参数。）\n5. 如果 `isValidLogin()` 返回 `false`，将相应的错误信息赋值给\
    \ `$msg` 以通知用户登录凭据无效。\n6. 否则，将 `$username` 赋值给 `$_SESSION['username']`。此外，声明一个会话变量\
    \ `$_SESSION['is_admin']` 并给它赋值 `true`。\n7. 最后，使用 `header()` 函数将用户重定向到 `write.php`。\n\
    \n明白了吗？尝试自己编写 `p-admin.php`。你可以参考 `p-index.php`。\n\n一旦完成，我们就准备好移动到 `p-signup.php`\
    \ 了。\n\n#### 13.6.3 p-signup.php\n\n`p-signup.php` 用于处理 `signup.php`，后者包含一个供成员注册的表单。为了保持项目简洁，我们只为成员创建注册表单，而不为管理员创建。我们稍后会学习使用\
    \ phpMyAdmin 将成员转换为管理员。成员注册表单（`signup.php`）有三个名为“username”、“password”和“confirm_password”的输入框，以及一个名为“submit”的按钮。如果在处理\
    \ `signup.php` 时发生错误，页面将输出存储在变量 `$msg` 中的错误提示信息。我们在 `p-signup.php` 中需要做：\n\n1.\
    \ 首先，声明并初始化变量 `$h` `$msg` 和 `$username`（类似于 `p-index.php` 中的操作）。\n2. 接下来，检查是否点击了“submit”按钮。如果是，我们首先将\
    \ `$_POST['username']` 赋值给 `$username`。\n3. 接下来，我们需要确保以下条件：\n   - 1. `signup.php`\
    \ 中的所有输入框都已填写\n   - 2. `$username` 长度在 6 到 100 个字符之间（包含）\n   - 3. `$_POST['password']`\
    \ 长度在 8 到 20 个字符之间（包含）\n   - 4. `$_POST['password']` 至少包含一个小写字母、一个大写字母和一个数字。\n\
    \   - 5. `$_POST['password']` 和 `$_POST['confirm_password']` 匹配\n4. 如果上述任何情况不满足，我们将相应的错误信息赋值给\
    \ `$msg`。\n5. 否则，执行以下操作：\n   - 创建一个 `BlogMember` 对象并使用它调用 `isDuplicateID()` 方法。如果方法返回\
    \ `true`，将相应的错误信息赋值给 `$msg`，通知用户用户名已被占用。\n   - 否则，使用 `BlogMember` 对象调用 `insertIntoMemberDB()`\
    \ 方法并使用 `header()` 函数将用户重定向到 `index.php`。为 `index.php` 附加查询字符串 `new=1`。\n\n明白了吗？尝试自己编写\
    \ `p-signup.php`。\n\n"
