- raw: "1\\. What are errors? Great! Now that you are familiar with exceptions, let’s\
    \ move on to discuss errors. As mentioned previously, when something goes wrong\
    \ in PHP, you will get either an exception or an error. One major difference between\
    \ errors and exceptions is that exceptions can be caught while errors, by default,\
    \ cannot. This is especially true prior to PHP 7. From PHP 7 onwards, PHP throws\
    \ an Error exception when some errors occur; this exception can then be caught.\
    \ There are four main types of errors defined in PHP - notices, warnings, syntax\
    \ errors and fatal errors. Each error type is further divided into subtypes and\
    \ each subtype is represented by a constant and an error code. Warnings and notices\
    \ are minor errors that do not lead to script termination. Common causes include\
    \ trying to divide by zero (which generates a warning) and trying to access an\
    \ undefined variable (which generates a notice). Syntax errors, on the other hand,\
    \ lead to script termination. They are caused by programmers making a mistake\
    \ in the syntax of their code. Examples include forgetting to close a parenthesis\
    \ or missing a semicolon. Last but not least, we have fatal errors, which also\
    \ lead to script termination. Common causes include trying to call a non-existent\
    \ function. Do not worry about the distinction between the different types of\
    \ errors. When an error occurs, PHP has an excellent reporting system. For instance,\
    \ if you try to access a non-existent variable using the statement echo $some\\\
    _undefined\\_variable;  \n\nyou’ll get an output similar to what is shown below:\
    \  \n\nNotice: Undefined variable: some\\_undefined\\_variable in ...mycode.php\
    \ on line 6 This output informs us that the error is a notice and gives us the\
    \ reason for the error. It also gives us the file name of the error and the line\
    \ number where it occurred. As you can see, an error message is very informative.\
    \ Such messages make it very easy for us to debug our code. However, they can\
    \ reveal too much information to end users. Therefore, it is a common practice\
    \ for us to display these messages only during the development stage of our site.\
    \ When our site goes live, it is strongly recommended that we do not display such\
    \ messages to end users. To adjust whether error messages are displayed, we need\
    \ to update the error settings in our PHP server.  \n\n12.2.2 Error Reporting\
    \ Settings in PHP  \n\nThere are two relevant settings here error\\_reporting\
    \ and display\\_errors . The error\\_reporting setting affects the type of errors\
    \ that PHP will report. There are several predefined constants that we can assign\
    \ to this setting. If we want PHP to only report fatal errors (and not report\
    \ warnings and notices etc.), we assign the E\\_ERROR constant to this setting.\
    \ On the other hand, if we want PHP to report all errors, we assign E\\_ALL to\
    \ it. Besides E\\_ERROR and E\\_ALL , we can assign other constants to the error\\\
    _reporting setting. You can find the list of all error constants and codes at\
    \ https://www.php.net/manual/en/errorfunc.constants.php . Next, we have the display\\\
    _errors setting. This affects whether errors reported by PHP will be displayed\
    \ on the browser. During the development stage, we want errors to be displayed.\
    \ To do that, we set display\\_errors to On . On a live site, we do not want any\
    \ errors to be displayed. To do that, we setdisplay\\_errors to Off . When display\\\
    _errors is off, we typically log the errors reported by PHP to a log file. We’ll\
    \ learn to do that later. To configure the error settings mentioned above, the\
    \ most direct way is to modify the php.ini file. We’ve already done that in Chapter\
    \ 2, where we seterror\\_reporting toE\\_ALL anddisplay\\_errors toOn . If you\
    \ do not have permission to edit php.ini , you can use two built-in functions\
    \ error\\_reporting() and ini\\_set() - to modify the settings. To do that, add\
    \ the following statements to all your PHP scripts. error\\_reporting(E\\_ALL);\
    \  \n\nini\\_set('display\\_errors', '1'); In the first statement above, we use\
    \ the error\\_reporting() function to seterror\\_reporting to E\\_ALL . Next,\
    \ we use the ini\\_set() function to setdisplay\\_errors to'1' when the site is\
    \ in the development stage. After the site goes live, you should change thedisplay\\\
    _errors setting to '0' using the following statement:  \n\nini\\_set('display\\\
    _errors', '0'); Changing the display\\_errors setting using ini\\_set() has its\
    \ limitations. If there is any syntax error in your script, the ini\\_set() function\
    \ will not work. For instance, if you have the following line in your script \
    \ \n\necho 'Hello; The display\\_errors setting will not be set as the statement\
    \ above has a syntax error (the closing quotation mark is missing). The page will\
    \ simply fail to load without any indication of what’s causing it. Hence, whenever\
    \ possible, it is strongly recommended that you update the php.ini file instead.\
    \ If you do not have access to php.ini , you can try modifying the error settings\
    \ using httpd.conf or .htaccess . These files allow you to modify the Apache web\
    \ server settings, which in turn can be used to modify the PHP settings. Depending\
    \ on your hosting company, you may also be allowed to add a custom php.ini file\
    \ to your directory and use it to configure the PHP settings. Check with your\
    \ hosting company if you have permission to do any of the above and if yes, how\
    \ to go about doing it. Instruction on using these techniques is beyond the scope\
    \ of this book. 12.2.3 Error Handler and Shutdown Function In the previous section,\
    \ we learned to adjust the display\\_errors setting. On a live site, you are encouraged\
    \ to turn display\\_errors off. However, sometimes, not displaying any error message\
    \ may not be the best approach. For instance, if a fatal error occurs on our site,\
    \ the site will just fail to load without any information. This can be frustrating\
    \ for the user. Instead of leaving users entirely in the dark when something goes\
    \ wrong, we can provide them with a “user-friendly” error message. To do that,\
    \ we need to create a custom error handler. A custom error handler allows us to\
    \ handle the PHP errors ourselves, instead of relying on the default error handler\
    \ in PHP. We can use this custom handler to display a custom message to users\
    \ when something goes wrong. To see how this works, create a new file in Brackets\
    \ and save it as errorHandling.php to the htdocs folder. Add the following code\
    \ to it: <?php function myErrorHandler($errno, $errstr, $errfile, $errline)  \n\
    \n{ echo '<BR>Oppsss... An error occurred.  \n\n<BR>'.$errstr;  \n\n} set\\_error\\\
    _handler('myErrorHandler'); In the code above, we first create a function called\
    \  \n\nmyErrorHandler() that has four parameters $errno , $errstr , $errfile and$errline\
    \ . The first two parameters are mandatory for a function to“qualify” as a custom\
    \ error handler, the last two are optional. These four parameters are used to\
    \ store the error code, error message, file name in which the error occurred and\
    \ the line number respectively. All four pieces of information are provided by\
    \ PHP when an error occurs. Within the function, we use an echo statement to echo\
    \ a custom error message to users. After coding the function, we use a built-in\
    \ function called set\\_error\\_handler() to setmyErrorHandler() as the custom\
    \ error handler. Got it? At this point, you’ll probably notice that this custom\
    \ error handler is very similar to the custom exception handler we coded in Chapter\
    \ 12.1.4. Indeed, the two are similar. However, while a custom exception handler\
    \ handles uncaught exceptions, a custom error handler handles errors. In addition,\
    \ a custom error handler does not result in script termination. To test the error\
    \ handler above, add the following code to the end of errorHandling.php :  \n\n\
    echo $a;  \n\necho '<BR>Script is not terminated';  \n\nIf you run errorHandling.php\
    \ now, you’ll get the following output: Oppsss... An error occurred.  \n\nUndefined\
    \ variable: a  "
  fmt: "\n# 1. What are errors?\n\nGreat! Now that you are familiar with exceptions,\
    \ let’s move on to discuss errors. As mentioned previously, when something goes\
    \ wrong in `PHP`, you will get either an exception or an error. One major difference\
    \ between errors and exceptions is that exceptions can be caught while errors,\
    \ by default, cannot. This is especially true prior to `PHP 7`. From `PHP 7` onwards,\
    \ `PHP` throws an `Error` exception when some errors occur; this exception can\
    \ then be caught.\n\nThere are four main types of errors defined in PHP - notices,\
    \ warnings, syntax errors and fatal errors. Each error type is further divided\
    \ into subtypes and each subtype is represented by a constant and an error code.\
    \ Warnings and notices are minor errors that do not lead to script termination.\
    \ Common causes include trying to divide by zero (which generates a warning) and\
    \ trying to access an undefined variable (which generates a notice). Syntax errors,\
    \ on the other hand, lead to script termination. They are caused by programmers\
    \ making a mistake in the syntax of their code. Examples include forgetting to\
    \ close a parenthesis or missing a semicolon. Last but not least, we have fatal\
    \ errors, which also lead to script termination. Common causes include trying\
    \ to call a non-existent function.\n\nDo not worry about the distinction between\
    \ the different types of errors. When an error occurs, `PHP` has an excellent\
    \ reporting system. For instance, if you try to access a non-existent variable\
    \ using the statement `echo $some_undefined_variable;`, you’ll get an output similar\
    \ to what is shown below:\n\n```\nNotice: Undefined variable: some_undefined_variable\
    \ in ...mycode.php on line 6\n```\n\nThis output informs us that the error is\
    \ a notice and gives us the reason for the error. It also gives us the file name\
    \ of the error and the line number where it occurred. As you can see, an error\
    \ message is very informative. Such messages make it very easy for us to debug\
    \ our code. However, they can reveal too much information to end users. Therefore,\
    \ it is a common practice for us to display these messages only during the development\
    \ stage of our site. When our site goes live, it is strongly recommended that\
    \ we do not display such messages to end users. To adjust whether error messages\
    \ are displayed, we need to update the error settings in our `PHP` server.\n\n\
    ## 12.2.2 Error Reporting Settings in PHP\n\nThere are two relevant settings here:\
    \ `error_reporting` and `display_errors`. The `error_reporting` setting affects\
    \ the type of errors that `PHP` will report. There are several predefined constants\
    \ that we can assign to this setting. If we want `PHP` to only report fatal errors\
    \ (and not report warnings and notices etc.), we assign the `E_ERROR` constant\
    \ to this setting. On the other hand, if we want `PHP` to report all errors, we\
    \ assign `E_ALL` to it. Besides `E_ERROR` and `E_ALL`, we can assign other constants\
    \ to the `error_reporting` setting. You can find the list of all error constants\
    \ and codes at `https://www.php.net/manual/en/errorfunc.constants.php`.\n\nNext,\
    \ we have the `display_errors` setting. This affects whether errors reported by\
    \ `PHP` will be displayed on the browser. During the development stage, we want\
    \ errors to be displayed. To do that, we set `display_errors` to `On`. On a live\
    \ site, we do not want any errors to be displayed. To do that, we set `display_errors`\
    \ to `Off`. When `display_errors` is off, we typically log the errors reported\
    \ by `PHP` to a log file. We’ll learn to do that later.\n\nTo configure the error\
    \ settings mentioned above, the most direct way is to modify the `php.ini` file.\
    \ We’ve already done that in Chapter 2, where we set `error_reporting` to `E_ALL`\
    \ and `display_errors` to `On`. If you do not have permission to edit `php.ini`,\
    \ you can use two built-in functions `error_reporting()` and `ini_set()` - to\
    \ modify the settings. To do that, add the following statements to all your PHP\
    \ scripts:\n\n```php\nerror_reporting(E_ALL);\nini_set('display_errors', '1');\n\
    ```\n\nIn the first statement above, we use the `error_reporting()` function to\
    \ set `error_reporting` to `E_ALL`. Next, we use the `ini_set()` function to set\
    \ `display_errors` to `'1'` when the site is in the development stage. After the\
    \ site goes live, you should change the `display_errors` setting to `'0'` using\
    \ the following statement:\n\n```php\nini_set('display_errors', '0');\n```\n\n\
    Changing the `display_errors` setting using `ini_set()` has its limitations. If\
    \ there is any syntax error in your script, the `ini_set()` function will not\
    \ work. For instance, if you have the following line in your script:\n\n```php\n\
    echo 'Hello;\n```\n(the quotation mark is missing).\n\n## 12.2.3 Error Handler\
    \ and Shutdown Function\n\nIn the previous section, we learned to adjust `display_errors`.\
    \ On a live site, you are encouraged to turn `display_errors` off. However, sometimes,\
    \ not displaying any error message may not be the best approach. Instead of leaving\
    \ users entirely in the dark when something goes, we can provide them with a “user-friendly”\
    \ error message. To do that, we need to create a error handler. A custom error\
    \ handler allows us to handle errors ourselves instead of relying on the default\
    \ handler. To see how this works, create a new file in Brackets and save it as\
    \ `errorHandling.php`. Add the following code to it:\n\n```php\n<?php\nfunction\
    \ myErrorHandler($errno, $errstr, $errfile, $errline) {\n    echo '<BR>Oppsss...\
    \ An error occurred.\n    echo '<BR'.$errstr;\n}\nset_error_handler('myErrorHandler');\n\
    ```\n\nIn the code above, we first create a function called `myErrorHandler()`\
    \ that has four parameters `$errno`, `$errstr`, `$errfile` and `$errline`. The\
    \ first two parameters are mandatory for a function to qualify as a custom error\
    \ handler, the last two are optional. These four parameters are used to store\
    \ the error code, error message, file name in which the error occurred and the\
    \ line number respectively. All four pieces of information are provided by PHP\
    \ when an error occurs. Within the function, we use an `echo` statement to echo\
    \ a custom error message to users. After coding the function, we use a built-in\
    \ function called `set_error_handler()` to set `myErrorHandler()` as the custom\
    \ error handler.\n\nAt this point, you’ll probably notice that this custom error\
    \ handler is very similar to the custom exception handler we coded in Chapter\
    \ 12.1.4. Indeed, the two are similar. However, while a custom exception handler\
    \ handles uncaught exceptions, a custom error handler handles errors. In addition,\
    \ a custom error handler does not result in script termination. To test the error\
    \ handler above, add the following code to the end of `errorHandling.php`:\n\n\
    ```php\necho $a;\necho '<BR>Script is not terminated';\n```\n\nIf you run `errorHandling.php`\
    \ now, you’ll get the following output:\n\n```\nOppsss... An error occurred.\n\
    Undefined variable: a\nScript is not terminated\n```\n"
  trans: "\n\n# 1. 什么是错误？\n\n太棒了！现在你已经熟悉了异常（exceptions），让我们来讨论错误（errors）。正如之前提到的，当\
    \ `PHP` 中出现问题时，你将获得一个异常或错误。错误和异常之间的一个主要区别是，异常可以被捕获，而默认情况下错误无法被捕获。这在 `PHP 7` 之前尤其如此。从\
    \ `PHP 7` 开始，发生某些错误时，`PHP` 会抛出一个 `Error` 异常；此异常可以被捕获。\n\nPHP 定义了四种主要的错误类型：通知（notices）、警告（warnings）、语法错误（syntax\
    \ errors）和致命错误（fatal errors）。每个错误类型进一步分为子类型，每个子类型由一个常量和一个错误代码表示。警告和通知是不导致脚本终止的轻微错误。常见原因包括尝试除以零（产生警告）和尝试访问未定义的变量（产生通知）。相反，语法错误会导致脚本终止。它们是由程序员在代码语法中犯错引起的。例如，忘记关闭括号或缺少分号。最后，我们还有致命错误，它也会导致脚本终止。常见原因包括尝试调用不存在的函数。\n\
    \n不要担心不同错误类型之间的区别。当错误发生时，`PHP` 有一个非常优秀的报告系统。例如，如果你尝试使用语句 `echo $some_undefined_variable;`\
    \ 访问不存在的变量，你将得到类似下方的输出：\n\n```\nNotice: Undefined variable: some_undefined_variable\
    \ in ...mycode.php on line 6\n```\n\n此输出告诉我们该错误是一个通知，并给了我们错误的原因。它还给了我们错误的文件名和发生的行号。如你所见，错误消息包含了大量信息。此类消息使我们非常容易地调试代码。然而，它们可能会向终端用户泄露过多信息。因此，我们的通常做法是只在网站的开发阶段显示这些消息。当我们的网站上线时，强烈建议不要向终端用户显示此类消息。要调整是否显示错误消息，我们需要更新\
    \ `PHP` 服务器中的错误设置。\n\n## 12.2.2 PHP 中的错误报告设置\n\n这里有两个相关的设置：`error_reporting` 和\
    \ `display_errors`。`error_reporting` 设置影响 `PHP` 报告的错误类型。我们有几个预定义的常量可以分配给此设置。如果我们希望\
    \ `PHP` 只报告致命错误（而不报告警告和通知等），我们就为此设置分配 `E_ERROR` 常量。另一方面，如果我们希望 `PHP` 报告所有错误，我们就为它分配\
    \ `E_ALL`。除了 `除 _E_ERROR` 和 `E_ALL` 之外，我们还可以将其他常量分配给 `error_reporting` 设置。你可以在\
    \ `https://www.php.net/manual/en/errorfunc.constants.php` 查看所有错误常量和代码列表。\n\n接下来，我们有\
    \ `display_errors` 设置。它影响由 `PHP` 报告的错误是否显示在浏览器上。在开发阶段，我们希望显示错误。为了做到，我们将 `display_errors`\
    \ 设置为 `On`。在在线网站上，我们不希望显示任何错误。为了这样做，我们将 `display_errors` 设置为 `Off`。当 `display_errors`\
    \ 关闭时，我们通常会将 `PHP` 报告的错误记录到日志文件中。我们稍后会学习这样做。\n\n要配置上述错误设置，最直接的方法是修改 `php.ini`\
    \ 文件。我们已经在第 2 章中做过那样的，在那里我们将 `error_reporting` 设置为 `E_ALL` 并将 `display_errors`\
    \ 设置为 `On`。如果你没有编辑 `php.ini` 的权限，可以使用两个内置函数 `error_reporting` 和 `display_errors`（注：原文此处可能有误，应为\
    \ `ini_set`）来修改设置。为了这样做，在你的脚本中添加以下语句：\n\n```php\nerror_reporting(E_ALL);\nini_set('display_errors',\
    \ '1');\n```\n\n在上面的语句中，我们使用 `error_reporting()` 函数将 `error_reporting` 设置为 `E_ALL`。接下来，我们使用\
    \ `ini_set()` 函数将 `display_errors` 设置为 `'1'`。网站上线后，你应该将 `display_errors` 设置为 `'0'`：\n\
    \n```php\necho\n```\n（缺少引号）。\n\n使用 `ini_set()` 更改 `display_errors` 有其局限性。如果你的脚本中有任何语法错误，`ini_set()`\
    \ 函数将不起作用。例如，如果你的脚本中有以下行：\n\n```php\necho;\n\n## 12.2.3 错误处理器和停机函数\n\n在上一节中，我们学习了调整\
    \ `display_errors`。在在线网站上，鼓励你关闭 `display_errors`。然而，有时不显示任何错误消息并不是最好的方法。与其在出现问题时让用户完全困惑，我们可以为他们提供一个“用户友好”的错误消息。为了这样做，我们需要创建一个错误处理器。自定义错误处理器允许我们自己处理错误，而不是依赖默认处理器。为了查看它是如何工作的，在编辑器中创建一个新文件并保存为\
    \ `errorHandling.php`。向其添加以下代码：\n\n```php\n<?php\nfunction myErrorHandler($errno,\
    \ $errstr, $errfile, $errline) {\n    echo '<BR>Oppsss... An error occurred.\n\
    \    echo '<BR'.$errstr;\n}\nset_error_handler('myErrorHandler');\n```\n\n在上面的代码中，我们首先创建一个名为\
    \ `myErrorHandler()` 的函数，它有四个参数 `$errno`、 `$errstr`、 `$errfile` 和 `$errline`。前两个参数是强制性的，后两个是可选的。这四个参数分别用于存储错误代码、错误消息、发生错误的文件和行号。当错误发生时，PHP\
    \ 会提供所有四个信息。在函数内部，我们使用 `echo` 语句向用户输出自定义的错误消息。在编写函数后，我们使用一个内置函数 `set_error_handler()`\
    \ 将 `myErrorHandler()` 设置为自定义错误处理器。\n\n此时此时，你可能会注意到这个自定义错误处理器与我们在第 12.1.4 章编写的自定义异常处理器非常相似。事实上，它们确实相似。然而，自定义异常处理器处理未捕获的异常，而自定义错误处理器处理错误。此外，自定义错误处理器不会导致脚本终止。为了测试上面的错误处理器，在\
    \ `errorHandling.php` 的末尾添加以下代码：\n\n```php\necho $a;\necho '<BR>Script is not\
    \ terminated';\n```\n\n现在运行 `errorHandling.php`，你将得到如下输出：\n\n```\nOppsss... An\
    \ error occurred.\nUndefined variable: a\nScript is not terminated\n```\n\n"
