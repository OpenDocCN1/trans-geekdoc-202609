    \ a variable `$_SESSION['username']` and check if it is set. If it is true, we\
    \ know the user is logged in.\n\nThe structure is shown below:\n\n```php\nforeach\
    \ ($posts as $result) {\n    $msgid = $result['id'];\n    $title = htmlspecialchars($result['title']);\n\
    \    $post = strip_tags($result['post'], \"<strong><em><p><ol><<ul><<li>><a>\"\
    );\n    $username = htmlspecialchars($result['username']);\n    $postdate = htmlspecialchars($result['post_date']);\n\
    \    include \"output_code/messagecard.php\";\n}\n```\n"
  trans: "\n\n提示：请参考 `p-index.php` 获取有关表单处理的帮助。如果不熟悉查询字符串，可以参考第 8.1.2 章。要检查上述出的五种情况，可以使用\
    \ `Helper` 类中的 `isEmpty()`、`isValidLength()`、`isSecure()` 和 `passwordsMatch()`\
    \ 方法。参考 `Helper.php` 和 `BlogMember.php` 来确定在调用 `Helper` 和 `BlogMember`类的各种方法时需要传递哪些参数。完成\
    \ `p-signup.php` 后，我们就可以处理 `p-write.php` 了。\n\n## 13.6.4 p-write.php\n\n`pwrite.php`\
    \ 用于处理 `write.php`，后者包含一个管理员编写文章的表单。\n\n`write.php` 有一个名为“title”的输入框、一个名为“post”的文本区域、一个名为“audience”的下拉列表以及一个名为“submit”的按钮。如果在处理\
    \ `write.php` 时发生错误，页面将输出存储在变量 `$msg` 中的错误信息。如果你分析 `write.php` 中的代码，你会发现我们在文本区域之后添加了一个\
    \ `<script>`元素。这是为了将文本区域替换为更高级的文本编辑器 `CKEDITOR`（可以在 https://ckeditor.com/ckeditor-4/\
    \ 免费获取）。我们不会详细介绍如何使用 `CKEDITOR`，因为它只影响用户界面。使用 `CKEDITOR` 不会以任何方式影响我们的 PHP 代码。\n\
    \n我们在 `p-write.php` 中需要完成：\n\n首先，我们需要获取两个会话变量 `$_SESSION['username']` 和 `$_SESSION['is_admin']`\
    \ 并检查它们是否已设置。如果其中一个会话变量未设置，说明用户正尝试在未登录管理员的情况下的情况下 `write.php`。\n\n如果是如此，我们使用 `header()`\
    \ 函数将他们重定向到 `admin.php`。否则，执行以下操作：\n\n1. 首先，声明并初始化一个名为 `$h` 的 `Helper` 对象。\n2.\
    \ 接下来，声明四个变量 `$title`、`$post`、`$audience` 和 `$msg` 并为它们每个赋值为空字符串。\n3. 然后，检查是否点击了“submit”按钮。如果点击了，将\
    \ `$_POST['title']`、`$_POST['post']` 和 `$_POST['audience']` 分别赋值给 `$title`、`$post`\
    \ 和 `$audience`。\n4. 接下来，检查 `write.php` 中的所有字段是否已填写。如果有空字段，则给 `$msg` 赋值适当的错误信息。\n\
    5. 否则，使用 `$_SESSION['username']` 作为参数创建一个 `Admin` 对象。使用该对象调用 `insertIntoPostDB()`\
    \ 方法。（参考 `Admin` 类来决定传递给该方法的哪些参数。）\n6. 完成后，将字符串 'Message saved successfully' 赋值给\
    \ `$msg`。\n\n清楚了吗？尝试自己编写代码 `p-write.php`。一旦完成，我们就可以开始处理最复杂的处理文件 `p-read.php` 了。\n\
    \n## 13.6.5 p-read.php\n\n该文件用于处理 `read.php`，用于向读者显示文章。我们需要在 `p-read.php` 中实现两个核心功能：\n\
    \n首先，根据用户是否登录，我们需要显示不同的文章。如果用户已登录，我们显示所有文章。否则，我们只显示“Public”（公开）文章。\n\n接下来，如果用户已登录，我们需要显示“New”（新）文章。为了实现上述目标，打开\
    \ `p-read.php` 并执行以下操作：\n\n- 首先，声明一个名为 `$h` 的 `Helper` 对象。\n- 接下来，声明一个变量 `$update`\
    \ 并将其赋值为 `false`。\n- 最后但重要的是，声明一个变量 `$_SESSION['username']` 并检查它是否已设置。如果为，说明用户已登录。\n\
    \n结构所示：\n\n```php\nforeach ($posts as $result) {\n    $msgid = $result['id'];\n\
    \    $title = htmlspecialchars($result['title']);\n    $post = strip_tags($result['post'],\
    \ \"<strong><em><p><ol><<ul><<li>><a>\");\n    $username = htmlspecialchars($result['username']);\n\
    \    $postdate = htmlspecialchars($result['post_date']);\n    include \"output_code/messagecard.php\"\
    ;\n}\n```\n\n"
