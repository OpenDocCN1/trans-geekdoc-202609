    \ 类中的 `recommend()` 方法现在允许访问 `Movie` 类中的 `conversion()` 方法。\n\n明白了吗？太棒了！将 `conversion()`\
    \ 更改为受保护方法后，注意我们只允许在声明它的类以及继承该类的任何子类内部直接访问它。换句话说，我们只能在 `Movie` 和 `AwardWinningMovie`\
    \ 类内部直接访问它。\n\n回想起我们之前在 `chap9.php` 中访问该方法了吗？当 `conversion()` 是公共方法时，这是没问题的。现在它是一个受保护方法，如果你再次加载\
