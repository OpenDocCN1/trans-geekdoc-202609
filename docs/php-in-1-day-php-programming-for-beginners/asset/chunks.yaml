    \    return $num1 + $num2 + $num3;\n    echo 'Hello';\n}\n```\n\nThe function\
    \ above returns the sum of `$num1`, `$num2` and `$num3` using a `return` statement.\
    \ Once a `return` statement is executed, the function exits, and any statement\
    \ after the return statement is not executed. We can assign the result returned\
    \ by the function to a variable or use the `echo` statement to display the result\
    \ directly.\n\nIf we call the function above using the following statement: `echo\
    \ addNumbers(9, 6, 1);` we’ll get:\n16\nas the output. The statement `echo 'Hello';`\
    \ is not executed as it comes after the return statement.\n\n## 7.2 Type Declaration\n\
    \nThe examples in the previous section illustrate the main points we need to know\
    \ when defining our functions. Before we move on to the next chapter, I would\
    \ like to discuss type declaration (also known as type hinting) in this section.\
    \ Type declaration is a feature added to newer versions of PHP. This feature is\
    \ optional but good to implement. First, what is type declaration? As mentioned\
    \ previously, PHP is a loosely typed language. In the examples above, when we\
    \ declared the parameters of our functions, we did not indicate their data types.\
    \ If the arguments that we pass the function are of invalid data types, PHP will\
    \ try its best to execute the function. For instance, with reference to Example\
    \ 4 in the previous section, if we try to run the following statement `echo addNumbers('9',\
    \ '6', '1');` we won’t get any errors. Although we pass three strings to the `addNumbers()`\
    \ function, PHP converts them to integers for us automatically and executes the\
    \ function. Hence, we’ll get 16 as the output. Such flexibility makes PHP a very\
    \ easy language to program in. However, depending on the requirements of the site\
    \ you are building, you may not want the function to run when the data type is\
    \ incorrect. In cases like that, you can use type declaration. Type declaration\
    \ allows us to state the data types of a function’s parameters when we declare\
    \ it. This feature is available from PHP 5 onwards. However, in PHP 5, type declaration\
    \ does not work for scalar data types. Scalar data types refer to data types that\
    \ store a single value, such as `int`, `float`, `bool` and `string`. Type declaration\
    \ only works for data types like arrays. To use type declaration with scalar data\
    \ types, we need PHP 7 and above. In addition, we need to add `strict_types` declaration\
    \ to our script and set `strict_types` to 1. To illustrate how this works, let’s\
    \ look at an example. This example works in PHP 7.\n\nCreate a new file in Brackets\
    \ and name it `typedec.php`. Add the following code to it.\n\n```php\n<?php\n\
    declare(strict_types=1);\n\nfunction addNumbersStrict(int $num1, int $num2, int\
    \ $num3){\n    return $num1 + $num2 + $num3;\n    echo 'Hello';\n}\n\necho addNumbersStrict('9',\
    \ '6', '1');\n```\n"
  trans: "\n\n# 5 ?> 仔细研究这两个循环，你注意到了什么区别？首先，注意我们在第二个循环的第 2 行结尾添加了 `?>`？这个 `?>` 标签关闭了第\
    \ 1 行的 `<?php` 标签。当发生这种情况时，第二个循环中第 2 行之后的任何代码将不再被解释为 PHP 代码，而是被解释为 HTML 代码。这解释了为什么我们不需要使用\
    \ `echo` 语句在第 3 行输出 `<h1>Hello</h1>`。接下来，在第 4 行，我们再次打开了 PHP 标签。当 PHP 看到这个开启标签时，它知道后面跟着的是\
    \ PHP 代码。当它遇到 `endfor;` 语句时，它意识到这是一个 `for` 循环并寻找要评估的条件。当它在第 2 行找到条件时，它会将 `$i`\
    \ 加 1 并再次运行第 3 行。这会一直重复，直到条件 `$i < 3` 不再有效。学会了吗？如果你运行上面的循环，你会发现两种情况下都会以 `<h1>`\
    \ 标题的形式显示三次“Hello”。仔细研究这两个循环以理解这项技术是如何工作的。刚开始可能会有点困惑。核心思想是在切换到 HTML 代码之前关闭 PHP\
    \ 标签，并在 HTML 代码之后再次打开它。这使得在不需要使用 `echo` 语句的情况下插入 HTML 代码方便得多。\n\n# 第 7 章：函数\n\n\
    在本章中，让我们开始讨论函数。我们在之前的章节中已经遇到过函数。例如，在第 5 章中，我们学习了使用各种 PHP 函数来处理字符串和数组。在本章中，我们将学习定义自己的函数。\n\
    \n## 7.1 定义自己的函数\n\n要定义自己的函数，我们使用以下语法：\n\n```php\nfunction functionName(list of\
    \ parameters) { //要执行的代码； //返回语句，如果有的话 }\n```\n\n所有函数声明都必须以 `function` 关键字开头。接下来是函数名。PHP\
    \ 中的函数名对大小写不敏感，并且可以包含字母、数字或下划线。然而，它们必须以字母或下划线开头。与变量名类似，我们在命名函数时通常使用 `camelCase`（驼峰命名法）或下划线。在书中，我们将使用\
    \ `camelCase`。在函数名之后，我们用一对括号将函数所需的参数列表（如果有）括起来。参数是用于存储传递给函数的值的变量；我们传递的值称为参数（arguments）。声明函数后，我们使用大括号括起我们想要函数执行的代码。如果函数返回结果，我们使用\
    \ `return` 关键字。学会了吗？让我们来看一些例子。\n\n### 示例 1\n\n```php\nfunction displayGreetings(){\n\
    \    echo 'Hello';\n}\n```\n\n在这里，我们声明了一个名为 `displayGreetings()` 的函数，它没有参数（如函数名后的一对空括号所示）。该函数简单地输出单词“Hello”。若要调用该函数，我们使用它的名称后跟一对括号：`displayGreetings();`。\n\
    \n这将产生：\nHello\n作为输出。\n\n### 示例 2\n\n```php\nfunction displayGreetings2($name,\
    \ $message){\n    echo \"Hello $name, $message\";\n}\n```\n\n在这里，我们声明了一个名为 `displayGreetings2()`\
    \ 的函数，它有两个参数 `$name` 和 `$message`。如果我们使用以下语句调用函数：\n`displayGreetings2('Jamie',\
    \ 'good morning');`\n参数 `'Jamie'` 和 `'good morning'` 将分别赋值给参数 `$name` 和 `$message`。当我们运行上面的代码时，我们将得到：\n\
    Hello Jamie, good morning\n作为输出。\n\n### 示例 3\n\n在声明函数时，我们可以为参数提供默认值。\n\n```php\n\
    function displayGreetings3($name, $message = 'have a good day'){\n    echo \"\
    Hello $name, $message\";\n}\n```\n\n在上面的示例中，我们将 `'have a good day'` 声明为参数 `$message`\
    \ 的默认值（参考下划线代码）。要调用该函数，可以使用以下语句：\n`displayGreetings3('Jamie');`\n`echo '<BR>';`\n\
    `displayGreetings3('Jamie', 'how are you?');`\n\n在第一次函数调用中，我们省略了第二个参数。当我们这样做时，函数将使用默认值\
    \ `'have a good day'` 作为 `$message` 的值。如果我们运行上面的代码，我们将得到：\nHello Jamie, have a\
    \ good day\nHello Jamie, how are you?\n作为输出。\n\n当我们在声明带有默认值的参数函数时，请注意，带有默认值的参数必须放在不带默认值的参数之后。如果我们声明函数为\
    \ `function redundantDefault($a = 1, $b){ //某些代码 }`，则 `$a` 的默认值将不起作用，因为它在 `$b`（不带默认值）之前；调用函数时我们仍然需要提供两个参数。\n\
    \n### 示例 4\n\n最后但同样重要的是，函数可以在完成任务后返回一个结果。\n\n```php\nfunction addNumbers($num1,\
    \ $num2, $num3){\n    return $num1 + $num2 + $num3;\n    echo 'Hello';\n}\n```\n\
    \n上面的函数使用 `return` 语句返回 `$num1`、 `$num2` 和 `$num3` 的和。一旦执行了 `return` 语句，函数就会退出，返回语句后的任何语句都不会执行。我们可以将函数返回的结果赋值给变量，或使用\
    \ `echo` 语句直接显示结果。\n\n如果我们使用以下语句调用上面的函数：`echo addNumbers(9, 6, 1);` 将得到：\n16\n\
    作为输出。`echo 'Hello';` 语句不会被执行。\n\n## 7.2 类型声明\n\n之前的示例说明了我们在定义函数时需要了解的关键点。在进入下一章之前，我想在本节中讨论类型声明（也称为类型提示）。类型声明是为新版本\
    \ PHP 添加的特性。该特性是可选的，但很好。首先，什么是类型声明？如之前所述，PHP 是一种弱类型语言。在上面的示例中，当我们声明函数时，没有指定数据类型。如果我们传递给函数的参数类型无效，PHP\
    \ 会尽力尝试执行函数。例如，参考上一节的示例 4，如果我们尝试运行以下语句 `echo addNumbers('9', '6', '1');` 我们不会得到任何错误。尽管我们向\
    \ `addNumbers()` 函数传递了三个字符串，PHP 会自动将它们转换为整数并执行函数。因此，我们将得到 16 作为输出。这种灵活性使得 PHP\
    \ 一成为非常易编程的语言。然而，根据你构建网站的需求，你可能希望在数据类型不时不运行函数。在这种情况下，可以使用类型声明。类型声明允许我们在声明函数时指定参数的数据类型。该特性从\
    \ PHP 5 开始可用。然而，在 PHP 5 中类型声明对标量类型无效。标量类型是指存储单个值的数据类型，例如 `int`、`float`、`bool`\
    \ 和 `string`。类型声明仅适用于数组等类型。要在标量类型上使用类型声明，我们需要 PHP 7 及更高版本。此外，我们需要在脚本中添加 `strict_types`\
    \ 声明并将 `strict_types` 设置为 1。为了说明它是如何工作的，让我们来看一个示例。这个示例在 PHP 7 中运行。\n\n在 Brackets\
    \ 中创建一个新文件并命名为 `typedec.php`。向其添加以下代码。\n\n```php\n<?php\ndeclare(strict_types=1);\n\
    \nfunction addNumbersStrict(int $num1, int $num2, int $num3){\n    return $num1\
    \ + $num2 + $num3;\n    echo 'Hello';\n}\n\necho addNumbersStrict('9', '6', '1');\n\
    ```\n\n"
