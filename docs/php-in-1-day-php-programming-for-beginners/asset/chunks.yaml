    Next, let’s move on to talk about alternative. PHP offers an alternative syntax\
    \ for some of its control structures, specifically `if`, `while`, `foreach`, and\
    \ `switch`. This syntax involves changing opening braces to colons and the last\
    \ closing brace to `endif;`, `endwhile;`, `endforeach;`, or `endswitch;` respectively.\
    \ Let’s use an `if` statement to illustrate this. Suppose we want to display different\
    \ outputs based on the value of `$a`, we can use the following:\n\n```php\n$a\
    \ = 5;\nif ($a == 5){\n    echo '<BR>The value of a is ';\n}else{\n    echo 'Not\
    \ five';\n}\n```\n\nAlternatively, we can do it as follows:\n\n```php\n$a = 5;\n\
    if ($a == 5):\n    echo '<BR>The value of a is ';\nelse:\n    echo 'Not five';\n\
    endif;\n```\n\nCompare the two `if` statements. Notice that in the second `if`\
    \ statement above, we replaced opening braces with a colon? In addition, we replaced\
    \ the last closing brace with `endif;` statement. If you run the code above, you’ll\
    \ get `The value of a is 5` for both syntaxes.\n\n### 6.4.4 Displaying HTML code\n\
    \nLast but not least, let’s discuss a neat trick for outputting HTML code. So\
    \ far, we have been using `echo` statements to output HTML code (such as the `<BR>`\
    \ tag) in our control structures. This technique is easy to use and works well\
    \ with simple HTML code. However, it can get cumbersome if we have more complicated\
    \ HTML code to output, especially if the code uses lots of single and double quotation\
    \ marks. For instance, if we want to output the following HTML code `<a href=\"\
    names.php\" target=\"_blank\">The names are 'Aaron', 'Peter', 'James', 'Max',\
    \ 'Jenny' and 'Don'.</a><img src=\"names.jpg\" alt=\"Names\" height=\"42\" width=\"\
    42\">` using `echo` statement, we need to escape a lot of quotation marks. In\
    \ cases like that, we can use a neat trick to switch between PHP and HTML code.\
    \ For demonstration purposes, let’s suppose we want to use a `for` loop to output\
    \ the HTML code `<h1>Hello</h1>` three times, the code below shows how we can\
    \ do it (using the alternative syntax mentioned in the previous section):\n\n\
    ```php\n<?php\nfor ($i = 0; $i < 3; ++$i):\n    echo '<h1>Hello</h1>';\nendfor;\n\
    ?>\n```\n\nThis loop uses an `echo` statement to output the HTML code. Alternatively,\
    \ if we do not want to use `echo` statements, we can do it as follows:\n\n```php\n\
    <?php\nfor ($i = 0; $i < 3; ++$i): ?>\n    <h1>Hello</h1>\n<?php endfor; ?>\n\
    ```\n"
