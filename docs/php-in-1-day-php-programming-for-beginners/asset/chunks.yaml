    \ 关键字。在上面的 `toString()` 方法中，我们使用了 `self` 关键字。或者，我们也可以使用类名 `Movie::DISCOUNT`。在声明\
    \ `toString()` 方法后，我们就可以用它来打印 `Movie` 类对象的字符串表示。要实现这一点，我们只需使用 `echo` 语句即可。为了查看它是如何工作的，将以下几行添加到\
