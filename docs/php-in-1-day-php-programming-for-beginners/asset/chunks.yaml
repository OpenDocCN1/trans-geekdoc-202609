- raw: "</select> In our project, the names of the variables used to store each input\
    \ correspond to the names of the input fields. For instance,$username stores the\
    \ input for the textbox named“username”. Based on the description above, modify\
    \ index.php , signup.php , admin.php and write.php so that all values entered,\
    \ except passwords, are maintained if there’s an error processing the form. Got\
    \ it? Once the above is done, we need to make some additional changes to write.php\
    \ . For most pages, if there’s no error processing the form, the website automatically\
    \ loads another page based on the URL we passed to the header() function. However,\
    \ this does not happen for write.php . For this page, after the admin clicks on\
    \ the “submit” button, he/she will stay on the same page regardless of whether\
    \ data is submitted to the database successfully or not. We want to modify write.php\
    \ so that if data is inserted into the database successfully, we’ll clear the\
    \ form so that the admin can write a new post. In other words, if data is inserted\
    \ successfully, we do not want to call the keepValues() method. To do that, we\
    \ need to use the variable $msg declared in p-write.php . Recall that after data\
    \ is inserted into the database, we assign the string 'Message saved successfully'\
    \ to $msg ? We can use this string to decide whether we need to call the keepValues()\
    \ method. The example below shows how it can be done for the first input field\
    \ (“title”). The underlined code shows the if condition to use. <input id = \"\
    txttitle\" type=\"text\" name=\"title\" placeholder=\"Enter Title\" autofocus\
    \ <?php if ($msg != 'Message saved successfully') $h  \n\n\\>keepValues($title,\
    \ 'textbox'); ?>> Try doing this for the other input fields. Once that is done,\
    \ we’ve completed the project. Congratulations! You are now ready to test your\
    \ code to see if everything works as expected. 13.9 Running the Code Before running\
    \ the code, we need to make some changes to php.ini . Follow the instructions\
    \ in Chapter 2.1 to locate php.ini and open it in Brackets. Scroll to the bottom\
    \ of the page and add the following lines to it (if you have yet to do so in previous\
    \ chapters): error\\_reporting=E\\_ALL  \n\ndisplay\\_errors=On  \n\ndate.timezone=America/New\\\
    _York Next, we want to add one more line to php.ini . Specifically, we want to\
    \ add a line to prepend debugging.php . Prepending a file means specifying that\
    \ we want PHP to process this file before it processes any other PHP script. Previously,\
    \ we used the include statement in UI\\_include.php to add debugging.php to our\
    \ PHP scripts. This works for most errors. However, it will not work if the file\
    \ that debugging.php is included in has syntax errors. If you want debugging.php\
    \ to work even when there are syntax errors, you need to prepend the file. To\
    \ do that, add the line auto\\_prepend\\_file=\"  \n\n<DOCUMENT\\_ROOT>/phpproject/includes/debugging.php\"\
    \ to php.ini , where <DOCUMENT\\_ROOT> refers to the actual path of your htdocs\
    \ folder. To find this path, load http://localhost/dashboard/phpinfo.php in your\
    \ browser and search for “DOCUMENT\\_ROOT” (without quotes). You’ll see the path\
    \ listed beside. You need to replace <DOCUMENT\\_ROOT> with the path listed. For\
    \ instance, if the path is/opt/lampp/htdocs , the line should be auto\\_prepend\\\
    _file=\"/opt/lampp/htdocs/phpproject/incl The code above may appear as two lines\
    \ in this book due to the limited width of the book. Do not break it into two\
    \ lines, it should be written as a single line in php.ini . After prepending debugging.php\
    \ , if you are using PHP 7.2 and above, you should also turn  \n\ntrack\\_errors\
    \ off. track\\_errors is a built-in feature in PHP that has been deprecated since\
    \ PHP 7.2. However, this feature is set to “On” by default. Leaving it on may\
    \ lead to a warning that says “Directive ‘track\\_errors’ is deprecated found\
    \ on line 0 in file Unknown” on some servers. To turn it off, simply add track\\\
    _errors=Off to the bottom of php.ini . That’s it. You can now save the file and\
    \ restart Apache.  \n\nNext, go to UI\\_include.php and comment out the include\
    \ statement for debugging.php . As we have already prepended the file, we should\
    \ not include it again. Next, launch http://localhost/phpproject/signup.php in\
    \ your browser and sign up for two new accounts.  \n\nEverything works? If yes,\
    \ congratulations! Give yourself a pat on the back. If no, it’s all right. Figuring\
    \ out what went wrong is a large part of programming. This, to me, is where the\
    \ most learning takes place. If something fails to work, you will likely get an\
    \ error message. Try to use the line number and file name given in the error message\
    \ to figure out what is wrong. Alternatively, you can use echo statements to determine\
    \ which part of your code works. For instance, if you add an echo statement to\
    \ line 10 of your code and you don’t see the output, you know that something has\
    \ likely gone wrong before line 10. Similarly, if you add anecho statement to\
    \ an if block and don’t see the output, you know that the if block is not executed.\
    \ Try finding the error yourself. If you really can’t figure out the issue, you\
    \ can check the suggested solution in the phpproject-complete folder and compare\
    \ the code with your code. Copy and paste the functions that you suspect may be\
    \ causing the error from the suggested solution to your solution and rerun your\
    \ code to see if it works. Study the suggested solution carefully to really understand\
    \ how it works. Got it? Once you manage to find the bug and are able to sign up\
    \ for two accounts successfully, you can proceed to convert one of them to an\
    \ admin account. To do that, go to http://localhost/phpmyadmin/ and click on the\
    \ “project” database. Click on the SQL tab and run the following SQL statement,\
    \ replacing YOUR\\_ADMIN\\_USERNAME with the username you want to convert to an\
    \ admin user: UPDATE members SET is\\_admin = 1 WHERE username = 'YOUR\\_ADMIN\\\
    _USERNAME'; Once that is done, you can use the admin account to post to the blog.\
    \ To do that, go to http://localhost/phpproject/admin.php to log in as an admin.\
    \ Try adding some posts to the blog. Does everything work? After posting, you\
    \ can go to http://localhost/phpproject/index.php to log in as a member (using\
    \ either account) to read the posts.  \n\nAlternatively, you can go to http://localhost/phpproject/read.php\
    \ directly to read “Public” posts without logging in. Play around with the site\
    \ to see if everything works as expected. If something does not work, try debugging\
    \ it. With perseverance, you can definitely find the error and learn a lot in\
    \ the process. Have fun! THE END"
