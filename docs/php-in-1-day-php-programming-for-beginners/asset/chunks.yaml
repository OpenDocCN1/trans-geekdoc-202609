    \ you can see, the “pets” table has been successfully created and data has been\
    \ added to it. Got it? Next, let’s learn to select data from this table and display\
    \ it on our web page using PHP. To do that, create a new file called `sql_select.php`\
    \ and add the following code to it.\n\n```php\n<?php  \n\n//Section A - Connecting\
    \ to the database\n$pdo = new PDO(\"mysql:host=localhost;dbname=pawszone\", \"\
    pz_admin\", \"ABCD\");  \n\n$pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\
    \ //Section B - SELECT all rows from pets  \n\n$sql = \"SELECT petname, owner\
    \ FROM pets\";  \n\n$stmt = $pdo->prepare($sql);  \n\n$stmt->execute();  \n\n\
    while ($row = $stmt->fetch(PDO::FETCH_ASSOC)){  \n\necho '<BR>Owner = '.$row['owner'].'<BR>';\
    \  \n\necho 'Pet Name = '.$row['petname'].'<BR>';  \n\n}  \n\n$stmt->execute();\
    \ while ($row = $stmt->fetch(PDO::FETCH_NUM)){  \n\necho '<BR>Owner = '.$row[1].'<BR>';\
    \  \n\necho 'Pet Name = '.$row[0].'<BR>'; } \n```\n\nHere, as before, we first\
    \ connect to the “pawszone” database in Section A. Next, in Section B, we use\
    \ a `SELECT` statement to select the “petname” and “owner” columns from the “pets”\
    \ table. After executing the statement, we use a `while` loop to fetch the rows\
    \ one by one, using the `FETCH_ASSOC` style. Finally, we use `echo` statements\
    \ inside the `while` loop to display the data fetched. Next, we execute the `SELECT`\
    \ statement again and use another `while` loop to fetch the rows using the `FETCH_NUM`\
    \ style. If you load `sql_select.php` in your browser, you’ll get the following\
    \ output displayed twice:\n\nOwner = En\nPet Name = Boots \n\nOwner = En\nPet\
    \ Name = Dora \n\nOwner = Jamie Pet Name = Max\n\n# Chapter 12: Managing Errors\
    \ and Exceptions\n\nWe’ve come to the last chapter before our project. In this\
    \ chapter, we are going to learn to manage errors and exceptions in our PHP scripts.\
    \ Frankly speaking, this is one of the messiest areas in PHP as PHP differentiates\
    \ between an exception and an error. When something goes wrong,we’ll get either\
    \ an exception or an error. Internal PHP functions mainly give us errors when\
    \ something goes wrong. Modern object-oriented extensions (such as the `PDO` extension\
    \ we learned in the previous chapter), on the other hand, are more likely to use\
    \ exceptions. In this chapter,we’ll first discuss exceptions and errors separately\
    \ before consolidating everything.\n\n## Handling Exceptions\n\n### What is an\
    \ exception?\n\nAn exception is a predefined object in PHP that allows us to alter\
    \ the flow when something undesirable happens. For instance, if we try to connect\
    \ to a database and the connection fails.\n\nTo see what an exception is, create\
    \ a file called `connect.php` in `htdocs` and add the following code:\n\n```php\n\
    <?php\n$pdo = new PDO(\"mysql:host=localhost;dbname=pawszone\", \"pz_admin\",\
    \ \"ABCD\");  \n$pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
    ```\n\nHere, we try to connect“pawszone” using an invalid username. Next, create\
    \ `exceptionHandling.php` in `htdocs` and add the following code:\n\n```php\n\
    <?php \ninclude \"connect.php\"; \necho '<BR>Welcome to szone';\n```\n\nAfter\
    \ creating the two files, try loading `exceptionHandling.php` in your browser\
    \ (with Apache and MySQL running), what do you get? You get a message similar\
    \ to what is below, right? I’ve formatted and underlined parts of the message\
    \ to make it more readable.\n\nFatal error: Uncaught PDOException: SQLSTATE[HY000]:\
    \ [1045] Access denied for user 'wrongadmin'@'localhost' (using password: YES)\
    \ in /opt/lampp/htdocs/connect.php:3 Stack trace: #0 /opt/lampp/htdocs/connect.php(3):\
    \ PDO->__construct('mysql:host=loca...', 'wrongadmin', 'ABCD') #1 /opt/lampp/htdocs/exceptionHandling.php(2):\
    \ include('/opt....') #2 {main} thrown in /opt/lampp/htdocs/connect.php on line\
    \ 3\n\nThis message informs us that a `PDOException` has occurred and is not caught\
    \ (i.e., not handled). This exception occurs because of the invalid username we\
    \ used when connecting to the “pawszone” database. When an exception occurs and\
    \ is not caught, PHP displays a message similar to the above. This output includes\
    \ a stack trace listing all the files linked to the exception. The trace above\
    \ tells us that the current exception is linked to line 3 in `connect.php` and\
    \ line 2 in `exceptionHandling.php`. In addition, the database password, “ABCD”,\
    \ is revealed in the trace. Notice that the second statement (`echo '<BR>Welcome\
    \ to szone';`) in `exceptionHandling.php` is not executed? This is because any\
    \ exception that is not caught results in a fatal error; the script is terminated\
    \ before the echo statement can be executed.\n\n### try-catch-finally\n\nTo catch\
    \ exceptions, we use the `try`, `catch` and `finally` blocks. The syntax is as\
    \ follows:\n\n```php\ntry {\n    //do something\n} \ncatch (type of exception)\
    \ {\n    //do something else when an exception occurs\n} \nfinally {\n    //do\
    \ this regardless of whether the try or catch\nblock is executed\n}\n```\n\nThe\
    \ `try` block first tries to perform a task. If the task fails, an exception will\
    \ be thrown. Throwing an exception simply means PHP will create an object using\
    \ one of the predefined classes for dealing with exceptions.\n"
  trans: "\n在上面的代码中，我们首先在 A 部分中连接到“pawszone”数据库。接下来，在 B 部分中，我们使用 SQL `CREATE` 语句在数据库中创建一个名为“pets”的表。由于此\
    \ SQL 语句不包含任何占位符，因此我们不需要调用 `bindValue()` 方法。相反，我们只需要简单准备语句并执行它即可。在 C 部分中，我们有一个用于向“pets”表插入数据的\
    \ `INSERT` 语句。我们首先使用 `prepare()` 方法来准备该语句。虽然我们稍后将使用 `for` 循环执行四次 `INSERT` 语句，但请注意，我们只需要准备一次语句。这是使用预处理语句的另一个优势，因为它可以带来更快的执行，特别是当查询复杂或需要运行多次时。准备好语句后，我们声明了三个数组\
    \ `$owner`、`$pname` 和 `$breed`，并将要插入的数据赋值给这些数组。接下来，我们使用 `for` 循环遍历这些数组。循环每次运行时，我们都会将每个数组中的一个值绑定到相关的占位符上。绑定数据后，我们调用\
    \ `execute()` 方法执行 `INSERT` 语句。在 C 部分插入数据后，我们在 D 部分更新了一行数据（owner = “Jamie” 且 petname\
    \ = “Max”），并在 E 部分删除了另一个（owner = “Ted” 且 petname = “Angel”）。这两个部分应该是显而易见的。在继续之前，请仔细阅读并完全理解上面的代码。一旦你清楚了预处理语句的工作原理，就在浏览器中加载页面\
    \ `sql_select.php` 来运行该代码。接下来，访问 `http://localhost/phpmyadmin/` 并选择左侧的“pawszone”数据库。你应该能在右侧看到“pets”表。点击“浏览”，你会得到下面的表格：![](img/image_rsrc1J7.jpg)如你所见，“pets”表已成功创建并已添加数据。明白了吗？接下来，让我们学习如何使用\
    \ PHP 从此表中选取数据并显示在我们的网页上。为此，请创建一个名为 `sql_select.php` 的新文件并添加以下代码。\n\n```php\n\
    <?php  \n\n//Section A - 连接到数据库\n$pdo = new PDO(\"mysql:host=localhost;dbname=pawszone\"\
    , \"pz_admin\", \"ABCD\");  \n\n$pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\
    \ //Section B - 从 pets 中选择所有行  \n\n$sql = \"SELECT petname, owner FROM pets\"\
    ;  \n\n$stmt = $pdo->prepare($sql);  \n\n$stmt->execute();  \n\nwhile ($row =\
    \ $stmt->fetch(PDO::FETCH_ASSOC)){  \n\necho '<BR>Owner = '.$row['owner'].'<BR>';\
    \  \n\necho 'Pet Name = '.$row['petname'].'<BR>';  \n\n}  \n\n$stmt->execute();\
    \ while ($row = $stmt->fetch(PDO::FETCH_NUM)){  \n\necho '<BR>Owner = '.$row[1].'<BR>';\
    \  \n\necho 'Pet Name = '.$row[0].'<BR>'; } \n```\n\n在这里，与之前一样，我们首先在 A 部分中连接到“pawszone”数据库。接下来，在\
    \ B 部分中，我们使用 `SELECT` 语句从“pets”表中选取“petname”和“owner”列。执行该语句后，我们使用 `while` 循环通过\
    \ `FETCH_ASSOC` 样式逐行获取行。最后，我们在 `while` 循环内部使用 `echo` 语句显示获取的数据。接下来，我们再次执行 `SELECT`\
    \ 语句，并使用另一个 `while` 循环通过 `FETCH_NUM` 样式获取行。如果你在浏览器中加载 `sql_select.php`，你将看到以下输出显示两次：\n\
    \nOwner = En\nPet Name = Boots \n\nOwner = En\nPet Name = Dora \n\nOwner = Jamie\
    \ Pet Name = Max\n\n# 第 12 章：管理错误和异常\n\n我们已经到了项目前的最后一章。在这一章中，我们将学习如何在我们的 PHP 脚本中管理错误和异常。坦率地说，这是\
    \ PHP 中最混乱的领域之一，因为 PHP 区分了异常（exception）和错误（error）。当出现问题时，我们会得到异常或错误。PHP 内部函数在出现问题时主要向我们提供错误信息。另一方面，现代的面向对象扩展（例如我们在上一章中学到的\
    \ `PDO` 扩展）更倾向于使用异常。在本章中，我们将分别讨论异常和错误，然后再对它们进行整合。\n\n## 处理异常\n\n### 什么是异常？\n\n\
    异常是 PHP 中的一个预定义对象，允许我们在发生不理想的情况时改变执行流。例如，如果我们尝试连接数据库但连接失败了。\n\n要查看异常，请在 `htdocs`\
    \ 中创建一个名为 `connect.php` 的文件并添加以下代码：\n\n```php\n<?php\n$pdo = new PDO(\"mysql:host=localhost;dbname=pawszone\"\
    , \"pz_admin\", \"ABCD\");  \n$pdo->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
    ```\n\n在这里，我们尝试使用无效用户名连接“pawszone”。接下来，在 `htdocs` 中创建 `exceptionHandling.php`\
    \ 并添加以下代码：\n\n```php\n<?php \ninclude \"connect.php\"; \necho '<BR>Welcome to\
    \ szone';\n```\n\n在创建两个文件后，尝试在浏览器中加载 `exceptionHandling.php`（确保 Apache 和 MySQL\
    \ 正在运行），你得到了什么？你得到了类似下面的消息，对吧？我对消息进行了格式化并下划了部分内容以便于阅读。\n\nFatal error: Uncaught\
    \ PDOException: SQLSTATE[HY000]: [1045] Access denied for user 'wrongadmin'@'localhost'\
    \ (using password: YES) in /opt/lampp/htdocs/connect.php:3 Stack trace: #0 /opt/lampp/htdocs/connect.php(3):\
    \ PDO->__construct('mysql:host=loca...', 'wrongadmin', 'ABCD') #1 /opt/lampp/htdocs/exceptionHandling.php(2):\
    \ include('/opt....') #2 {main} thrown in /opt/lampp/htdocs/connect.php on line\
    \ 3\n\n此消息告诉我们发生了 PDOException 且未被捕获（即未被处理）。该异常是因为我们在连接数据库时使用了无效用户名。当异常发生且未被捕获时，PHP\
    \ 会显示类似上面的消息。此输出包含了与异常相关的堆栈跟踪。上面的跟踪告诉我们当前异常与 connect.php 的第 3 行以及 exceptionHandling.php\
    \ 的第 2 行有关。此外，数据库密码“ABCD”在堆栈中暴露了。注意 `exceptionHandling.php` 中的第二个语句（`echo '<BR>Welcome\
    \ to szone';`）没有执行。这是因为任何未被捕获的异常都会导致致命错误；脚本在执行 echo 语句之前就会终止。\n\n### try-catch-finally\n\
    \n为了捕获异常，我们使用 `try`、`catch` 和 `finally` 块。语法如下：\n\n```php\ntry {\n    //执行某些操作\n\
    } \ncatch (异常类型) {\n    //当发生异常时执行其他操作\n} \nfinally {\n    // 无论 try 还是 catch\
    \ 块是否执行，都会执行此操作\n}\n```\n\n`try` 块首先尝试执行任务。如果任务失败，将抛出一个异常。抛出异常简单意味着 PHP 将使用一个处理异常的预定义类创建一个对象。\n\
    \n"
