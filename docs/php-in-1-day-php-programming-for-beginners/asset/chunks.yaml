    \ `set()` 方法阻止了我们更改 `$rentalPrice` 值。当我们使用 `echo` 语句输出 `$rentalPrice` 值时，`get()`\
    \ 方法为提供了 4.99 作为输出。\n\n接下来，将以下代码添加到 `chap9.php` 并再次运行页面：\n\n```php\n$mov1->id\
    \ = 'A12387';\necho $mov1->id;\n```\n你将得到\n\n`Failed to modify id`\n"
