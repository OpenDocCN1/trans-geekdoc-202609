    \ `sl` 值存储为 `$sl`，我们写入：\n\n```html\n<select name = \"sl\">\n<option value = '1'\
    \ <?php $h->keepValues($sl, 'select', '1'); ?>>1</option>\n<option value = '2'\
    \ <?php $h->keepValues($sl, 'select', '2'); ?>>2</option>\n</select>\n```\n\n"
