- raw: "Congratulations on making it to the end of the book! We’ve covered a lot in\
    \ the preceding chapters. The best way to learn programming is to work on an actual\
    \ project. In this chapter, we’re going to work through a project together. This\
    \ project covers numerous concepts you’ve learned in the previous chapters and\
    \ allows you to see how everything works together. We’ll also be covering some\
    \ new miscellaneous concepts in this project. Excited? Let’s do it! 1\\. About\
    \ the Project This project involves creating a website that works like a mini\
    \ blog, where users with an admin account can log in to post. When posting to\
    \ the blog, the admin user can choose whether to make the post available to non-members\
    \ or members. Admin and members need to be logged in while non-members do not.\
    \ Admin can read and write posts, members can read “Members only” posts after\
    \ they log in, and nonmembers can only read “Public” posts. When a member or admin\
    \ logs in to the site, the website retrieves the last post he/she has read and\
    \ notifies him/her which posts are new. To see a demonstration of how the site\
    \ works, go to  \n\nhttps://learncodingfast.com/php .  \n\n2\\. Acknowledgements\
    \ and Requirements This project uses HTML, CSS, Javascript, PHP and MySQL. An\
    \ understanding of HTML (especially HTML forms) and SQL is essential for the project.\
    \ This chapter only covers PHP and will guide you through all the PHP code used.\
    \ All HTML, CSS, Javascript and SQL code will be provided for you. You can download\
    \ them at https://learncodingfast.com/php . However, as the project uses Bootstrap\
    \ ( https://getbootstrap.com/ ) for the user interface and CKEditor (https://ckeditor.com/ckeditor-4/\
    \ ) for the text editor, their code will not be provided. Instead, links will\
    \ be provided in the <head> element to include these files from their respective\
    \ content delivery networks (CDN). This means that you need an internet connection\
    \ when running the code in the project. Certain instructions (such as creating\
    \ a database and user account) provided here are specifically for XAMPP. If you\
    \ are not using XAMPP, you’ll have to refer to the software’s documentation for\
    \ specific instructions. Last but not least, this project uses PHP 5.5 and above.\
    \ If you have just downloaded XAMPP, the PHP interpreter bundled with it is at\
    \ least PHP 7. 3\\. Structure of the Project  \n\nThe main folder of the project\
    \ is phpproject . Inside this main folder, we have eight files: admin.php , error.html\
    \ , index.php , logout.php , read.php , signup.php , UI\\_include.php and write.php\
    \ . These files are responsible for the user interface of the blog. Besides the\
    \ eight files, we have a sub-folder called includes . Inside includes , we have\
    \ three files: loadclasses.php , header.html and debugging.php . We also have\
    \ three sub-folders: process (contains files used for processing HTML forms),\
    \ classes (contains files where we define our classes) and css (contains files\
    \ with CSS code). 4.Creating Database, User Account and Tables  \n\nBefore we\
    \ begin working on the PHP code, we need to create the database, tables and user\
    \ account.  \n\nFirst, ensure that you have started XAMPP and the Apache and MySQL\
    \ servers. Next, proceed to  \n\nhttp://localhost/phpmyadmin/index.php and follow\
    \ the instructions in Chapter 11.5 to create a database called“project”.  \n\n\
    Next, create a user with the following information for the “project” database:\
    \  \n\nUser Name: project\\_admin  \n\nHost Name: localhost  \n\nChoose your own\
    \ desired password for the user and click “Go” to create the user. Once that is\
    \ done, click on the SQL tab at the top of the page and copy the following SQL\
    \ code into the editor. This code can be downloaded at https://learncodingfast.com/php\
    \ . USE project; CREATE TABLE IF NOT EXISTS members (  \n\nusername VARCHAR(100)\
    \ PRIMARY KEY,  \n\npassword VARCHAR(255) NOT NULL,  \n\nis\\_admin BOOLEAN DEFAULT\
    \ false,  \n\nlast\\_viewed int DEFAULT 0 ); CREATE TABLE IF NOT EXISTS posts(\
    \  \n\nid INT AUTO\\_INCREMENT PRIMARY KEY,  \n\npost\\_date TIMESTAMP DEFAULT\
    \ NOW() NOT NULL, username VARCHAR(100) NOT NULL,  \n\ntitle VARCHAR(255) NOT\
    \ NULL,  \n\npost TEXT NOT NULL,  \n\naudience INT NOT NULL,  \n\nCONSTRAINT FOREIGN\
    \ KEY (username) REFERENCES members(username) ON DELETE CASCADE  \n\n); The code\
    \ above creates two tables, “members” and“posts”, for the “project” database.\
    \ Click on“Go” to execute the code. Once that is done, we are ready to work on\
    \ the PHP code. 13.5 Editing The classes Folder First, navigate to your htdocs\
    \ folder and paste the unzipped phpproject folder into it. Next, launch  \n\n\
    http://localhost/phpproject/index.php in your browser. If you see the page below,\
    \ all is good. ![](image_rsrc1J8.jpg)Close your browser and navigate to the  \n\
    \nhtdocs\\\\phpproject\\\\includes\\\\classes folder on your computer. You should\
    \ see five PHP files inside. 13.5.1 Helper.php  \n\nWe’ll start with Helper.php\
    \ . Open this file in Brackets; you’ll see that we’ve created a class calledHelper\
    \ . This class has no properties and constructor. Inside the class, our job is\
    \ to implement fivepublic methods passwordsMatch() , isValidLength() , isEmpty()\
    \ , isSecure() and  "
