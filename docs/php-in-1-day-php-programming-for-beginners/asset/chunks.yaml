    ```

    在这里，我们想要从 `$pets` 中删除 2 个元素，从位置 1（包括该元素）开始。`$pets` 变成了 `("corgi", "jack russell")`。


    ### 5.3.5 PHP 中常用的数组函数

    我们在前面的节中涵盖了几个数组概念。在结束本节之前，让我们来看一些 PHP 中常用的数组函数。


    #### count()

    第一个是 `count()` 函数。该函数接受一个数组并返回数组中的个数。


    #### 示例：

    ```php

