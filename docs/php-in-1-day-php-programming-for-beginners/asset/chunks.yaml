    and we want to select rows from a table called “pets” in our database, we can
    use the code below:


    ```php

    $owner = $_POST[''ownerName''];

    $sql = "SELECT * FROM pets WHERE owner = ''$owner''";

    $stmt = $pdo->query($sql);

    ```


    Don’t worry if the code above does not make much sense yet. We’ll discuss a better
