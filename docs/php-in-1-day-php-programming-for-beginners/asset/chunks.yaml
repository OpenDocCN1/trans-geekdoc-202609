- raw: "![](image_rsrc1J3.jpg)Surprised?  \n\nThis example demonstrates a critical\
    \ security concept in PHP - crosssite scripting (also known as XSS). Cross-site\
    \ scripting occurs when a user enters undesirable scripting code into our PHP\
    \ form and submits the code. If our site then stores this code (for instance,\
    \ in a database) and displays it to another user, the malicious code will be executed\
    \ in the other user’s browser. In our example, we created a harmless alert box\
    \ using Javascript. However, users with malicious intent can definitely use this\
    \ same technique to run harmful scripting code on the victim’s browser. To prevent\
    \ this from happening, we need to be careful whenever we display information entered\
    \ by users. There are a few ways to do it. The easiest is to use a built-in function\
    \ called  \n\nhtmlspecialchars() . This function converts special characters into\
    \ HTML entities. Special characters refer to characters that have special significance\
    \ in HTML, such as the < and \\> characters. If you do not want< and \\> to represent\
    \ the start and end of an HTML tag, you need to encode them using the htmlspecialchars()\
    \ function. This function converts< and\\> to &lt; and &gt; respectively. <script>\
    \ will thus be converted to&lt;script&gt; and no longer interpreted as an HTML\
    \ tag. To see how this works, change the PHP code above to if (isset($\\_POST\\\
    ['studentname'\\]))  \n\necho 'You entered  \n\n'.htmlspecialchars($\\_POST\\\
    ['studentname'\\]).' into the  \n\ntext field'; For demonstration purposes, we\
    \ only encode the text field. In actual coding, you have to encode every form\
    \ element where users are allowed to enter information themselves. If you load\
    \ the page and enter  \n\n<script>alert('Hacked');</script>  \n\ninto the text\
    \ field now, you’ll see that the alert box no longer pops out when you submit\
    \ the form. Instead, you get the following output below the form:  \n\nYou entered\
    \ <script>alert('Hacked');</script> into the text field.  \n\n<script> and</script>\
    \ are treated as normal text with no HTML significance.  \n\nIf you rightclick\
    \ on your webpage and select “View Page Source”, you’ll see the line You entered\
    \  \n\n&lt;script&gt;alert('Hacked');&lt;/script&gt; into the text field. below\
    \ the </form> tag. This shows the encoding of the< and \\> characters.  \n\n8.2\
    \ $\\_SESSION We’ve covered quite a bit in this chapter so far. In the previous\
    \ section on PHP form handling, you learned about the $\\_GET and $\\_POST superglobals.\
    \ In this section, we are going to discuss another superglobal $\\_SESSION . In\
    \ PHP, a session is a way of storing information that can be accessed across multiple\
    \ pages; this information is stored in the $\\_SESSION superglobal. Like the $\\\
    _GET and $\\_POST superglobals, the $\\_SESSION superglobal is an associative\
    \ array. This array is stored on the server and is available to all pages on the\
    \ site during the duration of the session. To demonstrate the use of sessions,\
    \ we need to create two pages, session.php and session2.php . Let’s do that now.\
    \  \n\nFirst, create a new file called session.php in htdocs and add the following\
    \ code to it (line numbers are added for reference). 1 <?php  \n\n2 session\\\
    _start();  \n\n3  \n\n4 $\\_SESSION\\['myFavFood'\\] = 'Pizza';  \n\n5 $\\_SESSION\\\
    ['myFavDrink'\\] = 'Cola';  \n\n6 $\\_SESSION\\['myFavColor'\\] = 'Orange';  \n\
    \n7  \n\n8 #updating a session variable  \n\n9 $\\_SESSION\\['myFavDrink'\\] =\
    \ 'Beer';  \n\n10  \n\n11 #deleting a session variable  \n\n12 unset($\\_SESSION\\\
    ['myFavColor'\\]); Here, we use a built-in function called session\\_start() to\
    \ start a new session on line 2. This function creates a new session if one has\
    \ not already been created or resumes the current one if it exists. Each session\
    \ created is associated with an automatically generated unique session ID. After\
    \ creating the session, we store the strings 'Pizza' , 'Cola' and 'Orange' into\
    \ the $\\_SESSION superglobal, using 'myFavFood' , 'myFavDrink' and 'myFavColor'\
    \ as the keys respectively. Next, we update the value of$\\_SESSION\\['myFavDrink'\\\
    ] by assigning a new string to it on line 9. Finally, on line 12, we use another\
    \ built-in function called unset() to destroy an element in the $\\_SESSION superglobal.\
    \ To use this function, we pass the name of the element that we want to destroy\
    \ to the function. After the element is destroyed, we will no longer be able to\
    \ access it. Next, let’s create another file called session2.php (in htdocs) and\
    \ add the following code to it: <?php  \n\nsession\\_start();  \n\necho '<BR>Food:\
    \ '.$\\_SESSION\\['myFavFood'\\]; echo '<BR>Drink: '.$\\_SESSION\\['myFavDrink'\\\
    ]; echo 'Color: '.$\\_SESSION\\['myFavColor'\\]; Here, we start by calling the\
    \ session\\_start() function to resume the current session. We need to call this\
    \ function whenever we want to access the $\\_SESSION superglobal. Next, we use\
    \ three echo statements to output the values stored in $\\_SESSION .  \n\nNow,\
    \ we are ready to demonstrate how sessions work. To do that, load session.php\
    \ in your browser first. When you do that, session.php starts a new session and\
    \ stores data into the $\\_SESSION superglobal. Next, load session2.php in your\
    \ browser. What do you get? Depending on the error setting on your PHP server,\
    \ you will get an output similar to what is shown below: Food: Pizza  \n\nDrink:\
    \ Beer Notice : Undefined index: myFavColor in …session2.php on line 6   \n\n\
    Color: Notice that we get an undefined index notice for “myFavColor”? This is\
    \ because $\\_SESSION\\['myFavColor'\\] was destroyed using the unset() function\
    \ in session.php . Other than that, we have successfully retrieved the values\
    \ of $\\_SESSION\\['myFavFood'\\] and $\\_SESSION\\['myFavDrink'\\] . These two\
    \ values were stored in the $\\_SESSION superglobal in session.php and retrieved\
    \ in session2.php . This demonstrates how we can use the $\\_SESSION superglobal\
    \ to store and retrieve data across different PHP pages. Got it? Besides creating\
    \ and storing data in a session, we can destroy a session. We commonly do that\
    \ when users log out of our site. To destroy a session, we use another built-in\
    \ function called  \n\nsession\\_destroy() . To see how this function works, create\
    \ a new file called session3.php in htdocs and add the following code to it: <?php\
    \  \n\nsession\\_start();  \n\nsession\\_destroy(); As shown in the code above,\
    \ we need to call thesession\\_start() function to resume an existing session\
    \ before destroying it. Next, load session3.php in your browser; this destroys\
    \ the current session. Finally, load session2.php in your browser again. You’ll\
    \ get an output that says indexes “myFavFood”, “myFavDrink” and “myFavColor” are\
    \ all undefined. This indicates that the session no longer exists. 8.3 $\\_COOKIE\
    \  "
  fmt: "\n![](image_rsrc1J3.jpg)Surprised?\n\nThis example demonstrates a critical\
    \ security concept in PHP - crosssite scripting (also known as XSS). Cross-site\
    \ scripting occurs when a user enters undesirable scripting code into our PHP\
    \ form and submits the code. If our site then stores this code (for instance,\
    \ in a database) and displays it to another user, the malicious code will be executed\
    \ in the other user’s browser. In our example, we created a harmless alert box\
    \ using Javascript. However, users with malicious intent can definitely use this\
    \ same technique to run harmful scripting code on the victim’s browser.\n\nTo\
    \ prevent this from happening, we need to be careful whenever we display information\
    \ entered by users. There are a few ways to do it. The easiest is to use a built-in\
    \ function called `htmlspecialchars()`. This function converts special characters\
    \ into HTML entities. Special characters refer to characters that have special\
    \ significance in HTML, such as the `<` and `>` characters. If you do not want\
    \ `<` and `>` to represent the start and end of an HTML tag, you need to encode\
    \ them using the `htmlspecialchars()` function. This function converts `<` and\
    \ `>` to `&lt;` and `&gt;` respectively. `<script>` will thus be converted to\
    \ `&lt;script&gt;` and no longer interpreted as an HTML tag.\n\nTo see how this\
    \ works, change the PHP code above to:\n\n```php\nif (isset($_POST['studentname']))\
    \ {\n    echo 'You entered ' .htmlspecialchars($_POST['studentname']) .' into\
    \ the text field';\n}\n```\n\nFor demonstration purposes, we only encode the text\
    \ field. In actual coding, you have to encode every form element where users are\
    \ allowed to enter information themselves. If you load the page and enter `<script>alert('Hacked');</script>`\
    \ into the text field now, you’ll see that the alert box no longer pops out when\
    \ you submit the form. Instead, you get the following output below the form:\n\
    \nYou entered <script>alert('Hacked');</script> into the text field.\n\n`<script>`\
    \ and `</script>` are treated as normal text with no HTML significance.\n\nIf\
    \ you rightclick on your webpage and select “View Page Source”, you’ll see the\
    \ line `You entered &lt;script&gt;alert('Hacked');&lt;/script&gt; into the text\
    \ field.` below the `</form>` tag. This shows the encoding of the `<` and `>`\
    \ characters.\n\n## 8.2 `$_SESSION`\n\nWe’ve covered quite a bit in this chapter\
    \ so far. In the previous section on PHP form handling, you learned about the\
    \ `$_GET` and `$_POST` superglobals. In this section, we are going to discuss\
    \ another superglobal `$_SESSION`. In PHP, a session is a way of storing information\
    \ that can be accessed across multiple pages; this information is stored in the\
    \ `$_SESSION` superglobal. Like the `$_GET` and `$_POST` superglobals, the `$_SESSION`\
    \ superglobal is an associative array. This array is stored on the server and\
    \ is available to all pages on the site during the duration of the session. To\
    \ demonstrate the use of sessions, we need to create two pages, `session.php`\
    \ and `session2.php`. Let’s do that now.\n\nFirst, create a new file called `session.php`\
    \ in `htdocs` and add the following code to it (line numbers are added for reference):\n\
    \n```php\n1 <?php\n2 session_start();\n3\n4 $_SESSION['myFavFood'] = 'Pizza';\n\
    5 $_SESSION['myFavDrink'] = 'Cola';\n6 $_SESSION['myFavColor'] = 'Orange';\n7\n\
    8 #updating a session variable\n9 $_SESSION['myFavDrink'] = 'Beer';\n10\n11 #deleting\
    \ a session variable\n12 unset($_SESSION['myFavColor']);\n```\n\nHere, we use\
    \ a built-in function called `session_start()` to start a new session on line\
    \ 2. This function creates a new session if one has not already been created or\
    \ resumes the current one if it exists. Each session created is associated with\
    \ an automatically generated unique session ID. After creating the session, we\
    \ store the strings `'Pizza'`, `'Cola'` and `'Orange'` into the `$_SESSION` superglobal,\
    \ using `'myFavFood'`, `'myFavDrink'` and `'myFavColor'` as the keys respectively.\
    \ Next, we update the value of `$_SESSION['myFavDrink']` by assigning a new string\
    \ to it on line 9. Finally, on line 12, we use another built-in function called\
    \ `unset()` to destroy an element in the `$_SESSION` superglobal. To use this\
    \ function, we pass the name of the element that we want to destroy to the function.\
    \ After the element is destroyed, we will no longer be able to access it.\n\n\
    Next, let’s create another file called `session2.php` (in `htdocs`) and add the\
    \ following code to it:\n\n```php\n<?php\nsession_start();\necho '<BR>Food: '.$SESSION['myFavFood'];\
    \ \necho '<BR>Drink: '.$SESSION['myFavDrink']; \necho 'Color: '.$SESSION['myFavColor'];\
    \ \n```\n\nHere, we start by calling the `session_start()` function to resume\
    \ the current session. We need to call this function whenever we want to access\
    \ the `$_SESSION` superglobal. Next, we use three `echo` statements to output\
    \ the values stored in `$_SESSION`.\n\nNow, we are ready to demonstrate how sessions\
    \ work. To do that, load `session.php` in your browser first. When you do that,\
    \ `session.php` starts a new session and stores data into the `$_SESSION` superglobal.\
    \ Next, load `session2.php` in your browser. What do you get? Depending on the\
    \ error setting on your PHP server, you will get an output similar to what is\
    \ shown below:\n\nFood: Pizza\nDrink: Beer Notice : Undefined index: myFavColor\
    \ in …session2.php on line 6\nColor:\n\nNotice that we get an undefined index\
    \ notice for “myFavColor”? This is because `$_SESSION['myFavColor']` was destroyed\
    \ using the `unset()` function in `session.php`. Other than that, we have successfully\
    \ retrieved the values of `$_SESSION['myFavFood']` and `$_SESSION['myFavDrink']`.\
    \ These two values were stored in the `$_SESSION` superglobal in `session.php`\
    \ and retrieved in `session2.php`. This demonstrates how we can use the `$_SESSION`\
    \ superglobal to store and retrieve data across different PHP pages. Got it?\n\
    \nBesides creating and storing data in a session, we can destroy a session. We\
    \ commonly do that when users log out of our site. To destroy a session, we use\
    \ another built-in function called `session_destroy()`. To see how this function\
    \ works, create a new file called `session3.php` in `htdocs` and add the following\
    \ code to it:\n\n```php\n<?php\nsession_start();\nsession_destroy();\n```\n\n\
    As shown in the code above, we need to call the `session_start()` function to\
    \ resume an existing session before destroying it. Next, load `session3.php` in\
    \ your browser; this destroys the current session. Finally, load `session2.php`\
    \ in your browser again. You’ll get an output that says indexes “myFavFood”, “myFavDrink”\
    \ and “myFavColor” are all undefined. This indicates that the session no longer\
    \ exists.\n\n## 8.3 `$_COOKIE`\n"
  trans: "\n\n![](img/image_rsrc1J3.jpg)感到惊讶吗？\n\n此示例演示了 PHP 中的一个关键安全概念——跨站脚本（也称为\
    \ XSS）。当用户在我们的 PHP 表单中输入不希望脚本代码并提交代码时，就会发生跨站脚本攻击。如果我们的网站随后存储了这些代码（例如存储在数据库中）并显示给另一个用户，恶意代码将在另一个用户的浏览器中执行。在我们的示例中，我们使用\
    \ Javascript 创建了一个无害的警报框。然而，具有恶意意的用户完全可以使用相同的技术在受害者的浏览器上运行有害的脚本代码。\n\n为了防止这种情况的发生，每当我们显示用户输入的信息时都必须小心。有几种方法可以实现。最简单的方法是使用名为\
    \ `htmlspecialchars()` 的内置函数。该函数将特殊字符转换为 HTML 实体。特殊字符是指在 HTML 中具有特殊意义的字符，例如 `<`\
    \ 和 `>` 。如果你不希望 `<` 和 `>` 代表 HTML 标签的开始和结束，你就需要使用 `htmlspecialchars()` 函数对它们进行编码。该函数将\
    \ `<` 和 `>` 分别转换为 `&lt;` 和 `&gt;`。因此，`<script>` 将被转换为 `&lt;script&gt;`，不再被解释为\
    \ HTML 标签。\n\n要查看这是如何工作的，请将上面的 PHP 代码更改为：\n\n```php\nif (isset($_POST['studentname']))\
    \ {\n    echo 'You entered ' .htmlspecialchars($_POST['studentname']) .' into\
    \ the text field';\n}\n```\n\n为了演示目的，我们只对文本字段进行了编码。在实际编码中，你必须对每个允许用户输入信息的表单元素进行编码。如果你现在加载页面并在文本字段中输入\
    \ `<script>alert('Hacked');</script>`，你会发现提交表单时，警报框不再弹出。相反，你会在表单下方得到以下输出：\n\n\
    You entered <script>alert('Hacked');</script> into the text field.\n\n`<script>`\
    \ 和 `</script>` 被视为普通文本，没有 HTML 意义。\n\n如果你在网页上右键点击并选择“查看网页源代码”，你会在 `</form>` 标签下方看到这一行\
    \ `You entered &lt;script&gt;alert('Hacked');&lt;/script&gt; into the text field.`。这显示了\
    \ `<` 和 `>` 字符的编码。\n\n## 8.2 `$_SESSION`\n\n到目前为止，本章涵盖了很多内容。在之前关于 PHP 表单处理的节中，你学习了\
    \ `$_GET` 和 `$_POST` 超全局变量。在本节中，我们将讨论另一个全局变量 `$_SESSION`。在 PHP 中，会话（session）是一种可以在多个页面间访问的信息存储方式；这些信息存储在\
    \ `$_SESSION` 超全局中。与 `$_GET` 和 `$_POST` 超全局变量一样，`$_SESSION` 超全局是一个关联数组。该数组存储在服务器上，并在会话持续期间对网站上的所有页面可用。为了演示会话的使用，我们需要创建两个页面：`session.php`\
    \ 和 `session2.php`。我们现在就开始。\n\n首先，在 `htdocs` 中创建一个名为 `session.php` 的新文件，并向其中添加以下代码（添加行号是为了参考）：\n\
    \n```php\n1 <?php\n2 session_start();\n3\n4 $_SESSION['myFavFood'] = 'Pizza';\n\
    5 $_SESSION['myFavDrink'] = 'Cola';\n6 $_SESSION['myFavColor'] = 'Orange';\n7\n\
    8 #updating a session variable\n9 $_SESSION['myFavDrink'] = 'Beer';\n10\n11 #deleting\
    \ a session variable\n12 unset($_SESSION['myFavColor']);\n```\n\n在这里，我们在第 2 行使用名为\
    \ `session_start()` 的内置函数来启动一个新会话。如果尚未创建会话，该函数将创建一个新会话；如果已存在，则恢复当前会话。每个创建会话都与自动生成的唯一会话\
    \ ID 相关。创建会话后，我们分别使用 `'myFavFood'`、`'myFavDrink'` 和 `'myFavColor'` 作为键将字符串 `'Pizza'`、`'Cola'`\
    \ 和 `'Orange'` 存储到 `$_SESSION` 超全局中。接下来，我们在第 9 行通过为其分配一个新字符串来更新 `$_SESSION['myFavDrink']`\
    \ 的值。最后，在第 12 行，我们使用另一个名为 `unset()` 的内置函数来删除 `$_SESSION` 超全局中的一个元素。要使用此函数，我们将想要销毁的元素名称传递给函数。元素被销毁后，我们将无法再次访问它。\n\
    \n接下来，让我们在 `htdocs` 中创建另一个名为 `session2.php` 的文件，并向其中添加以下代码：\n\n```php\n<?php\n\
    session_start();\necho '<BR>Food: '.$SESSION['myFavFood']; \necho '<BR>Drink:\
    \ '.$SESSION['myFavDrink']; \necho 'Color: '.$SESSION['myFavColor']; \n```\n\n\
    在这里，我们通过调用 `session_start()` 函数开始恢复当前会话。每当我们想要访问 `$_SESSION` 超全局时，都需要调用此函数。接下来，我们使用三个\
    \ `echo` 语句输出存储在 `$_SESSION` 中的值。\n\n现在，我们准备好演示会话是如何工作的。要做到这一点，首先在浏览器中加载 `session.php`。这样做时，`session.php`\
    \ 会启动一个新的会话并将数据存储到 `$_SESSION` 超全局中。接下来，在浏览器中加载 `session2.php`。你得到了什么？取决于你的 PHP\
    \ 服务器设置，你将得到类似所示的输出：\n\nFood: Pizza\nDrink: Beer Notice : Undefined index: myFavColor\
    \ in …session2.php on line 6\nColor:\n\n注意我们为 “myFavColor” 收到了未定义索引提示？这是因为我们在\
    \ `session.php` 中使用 `unset()` 函数删除了 `$_SESSION['myFavColor']`。除此之外，我们成功地获取了 `$_SESSION['myFavFood']`\
    \ 和 `$_SESSION['myFavDrink']` 的值。这两个值分别在 `session.php` 的 `$_SESSION` 中存储并在 `session2.php`\
    \ 中获取。这演示了我们如何使用 `$_SESSION` 超全局在不同的页面之间存储数据。理解了吗？\n\n除了创建和存储会话数据外，我们还可以销毁会话。我们通常在用户退出网站时这样做。销毁会话，我们使用另一个名为\
    \ `session_destroy()` 的内置函数。要查看此函数如何工作，请在 `htdocs` 中创建一个名为 `session3.php` 的新文件并向其中添加以下代码：\n\
    \n```php\n<?php\nsession_start();\nsession_destroy();\n```\n\n如上述代码所示，我们需要销毁会话之前调用\
    \ `session_start()` 函数来恢复现有会话。接下来，在浏览器中加载 `session3.php`；这会销毁当前会话。最后，再次在浏览器中加载\
    \ `session2.php`。你会得到所有索引 “myFavFood”、“myFavDrink” 和 “myFavColor”均为未定义的输出。这表明会话已不存在。\n\
    \n## 8.3 `$_COOKIE`\n\n"
