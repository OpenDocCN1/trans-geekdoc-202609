    For `includedemo.php`, we simply give it the filename. If `heading.html` is stored
    in another folder (say in a folder called “includes” inside `htdocs` ), we need
    to use the statement below: `include ''includes/heading.html'';`


    ### 3.2.2 require


    Besides the `include` statement, PHP also has the `require` statement. The difference
    between the two is that `require` produces a fatal error and stops the script
    if PHP fails to find the file required. `include`, on the other hand, will only
    produce a warning without stopping the script. If the content you want PHP to
    “copy and paste” into your file is crucial to the correct execution of the page,
    you should use the `require` statement. Otherwise, you can use the `include` statement.


    ### 3.2.3 include_once, require_once


    Both the `include` and `require` statements come with a `_once` version. As the
    names suggest, the `include_once` and `require_once` statements only “copy and
    paste” the code into the file once. These statements are useful in cases where
    the same file may be included more than once accidentally (for instance, when
    the script is so long you have lost track of whether you have included the file
    previously). If you add another


    ```php

    include ''heading.html'';

    ```


    statement to `includedemo.php` (before the `?>` tag) and load the page, you’ll
    get “Welcome to PHP” displayed as a `<h1>` heading twice . On the other hand,
    if you change the include statements to


    ```php

    include_once ''heading.html'';

    include_once ''heading.html'';

    ```


    you’ll only get the `<h1>` heading displayed once.


    ### 3.3 Redirecting Users


    Great! We’ve come to the last section of this chapter. In this section, we’ll
    learn to redirect users using PHP.


    In HTML, we know that we can use a `<meta>` tag to redirect users to another page.
    In PHP, we use a built-in function called `header()`. First off, what is a function?


    A function is a block of code that performs a certain task. For an analogy, think
    of the functions in MS Excel. If we want to add the values of some cells in a
    spreadsheet, we can use a built-in function called `sum()`. This function is pre-written
    by other programmers and comes included with Excel. Similar to the pre-written
    functions in Excel, PHP comes with many built-in functions. Most functions require
    us to provide certain information for them to perform their tasks. In PHP, we
    provide this information by enclosing them inside a pair of parentheses (in a
    predefined order) after the function name. The information that we pass to the
    function is known as arguments. To use the `header()` function, we need to pass
    the word “Location”, followed by a colon and the redirect URL to the function.
    Using a function is also known as calling the function. To call the `header()`
    function, add the following code to the start of `includedemo.php` (before the
    `<!DOCTYPE html>` tag):


    ```php

    <?php

    header(''Location: http://example.com'');

    ?>

    ```


    If you load `includedemo.php` now, you’ll be redirected to `http://example.com`.
    Got it? When you use the `header()` function, note that it must be called before
    your script generates any output to the browser, either by normal HTML tags, blank
    lines, or from PHP. If there’s any output before the function is called, the function
    will not work. For instance, it will not work:


    ```php

    <?php

    header(''Location: http://example.com'');

    echo "This will not work";

    ?>

    ```

