    \ This is known as an echo statement; we’ll learn more about it in the next chapter.\
    \ Notice that we end the echo statement with a semicolon (`;`)? All statements\
    \ in PHP must end with a semicolon. This is similar to how we end sentences with\
    \ a period (`.`) in English. If you load `hello.php` now, you’ll get ![](image_rsrc1J1.jpg)as\
    \ the output. That’s it. We have just coded our first PHP web page. Simple? Great!\
    \ Let’s move on. \n\n# Chapter 3: Basic PHP Tasks\n\nIn the previous chapter,\
    \ we installed XAMPP and Brackets and coded our first PHP script. In this chapter,\
    \ we’re going to learn to perform three very fundamental tasks in PHP - displaying\
    \ outputs to users, duplicating code across multiple pages and redirecting users.\n\
    \n## 1. Displaying Outputs\n\nBefore we learn to display outputs, let’s create\
    \ a PHP file to serve as a template for us to test the PHP statements in this\
    \ section. Create a file in Brackets and save it as `output.php` to your `htdocs`\
    \ folder. Add the following code to `output.php` :\n\n```php\n<?php \n\n//Add\
    \ code here Whenever you want to test any PHP statement in this section, you can\
    \ add the statement to output.php (after the <?php opening tag) and load it in\
    \ your browser to check the output. Notice that we did not add a closing tag (?>\
    \ ) to `output.php` ? This is because `output.php` only contains PHP code. According\
    \ to the standard recommended by the PHP Framework Interop Group, any PHP script\
    \ that only contains PHP code should not end with a closing tag. This is to prevent\
    \ unwanted whitespaces at the end of the file, which can cause issues such as\
    \ an “Headers already sent” warning when modifying response headers. Do not worry\
    \ if the statement above does not make any sense; we’ll learn about the “Headers\
    \ already sent” warning later. For now, let’s move on to learn how to display\
    \ outputs in PHP. \n```\n\n### 1.1 echo\n\nThe easiest way to display outputs\
    \ in PHP is to use an `echo` statement. To do that, we enclose the text that we\
    \ want to display in a pair of matching quotation marks after the `echo` keyword.\
    \ The `echo` keyword is not case sensitive. Hence, `echo`, `Echo` or `ECHO` will\
    \ all work. Using an `echo` statement is straightforward. We did that in Chapter\
    \ 2 when we used it to display the words “Hello World!”. In addition to using\
    \ `echo` statements to display simple text messages, we can use them to display\
    \ text with HTML markup. For instance, we can write `echo 'PHP is fun<BR>and easy!';`\n\
    \nThis gives us:\n\nPHP is fun\n\nand easy!\n\nas the output; the text “and easy!”\
    \ is displayed on the second line due to the `<BR>` tag.\n\nWe can also combine\
    \ multiple messages in a single `echo` statement. To do that, we separate the\
    \ messages with commas. For instance, `echo \"ABCD\", \"EFGH\";`\n\ngives us:\n\
    \nABCDEFGH\n\nas the output. Combining messages is useful when our message is\
    \ more complex, such as when the message includes variables and functions. We’ll\
    \ learn about variables and functions in later parts of the book. Last but not\
    \ least, we can use an `echo` statement with or without parentheses. You may have\
    \ seen some code that does the following: `echo (\"ABCD\");`\n\nThis is fine in\
    \ most cases. However, if you use parentheses, you are not allowed to combine\
    \ multiple messages in a single `echo` statement. For instance, `echo (\"ABCD\"\
    , \"EFGH\");`\n\nwill give us an error. In most cases, you are better off using\
    \ `echo` statements without parentheses.\n\n### 1.2 print\n\nBesides using `echo`\
    \ statements to display outputs, we can use `print` statements.\n\n`print` statements\
    \ are VERY similar to `echo` statements. Let’s look at an example: `print \"My\
    \ name is Brody.\";`\n\ngives us:\n\nMy name is Brody.\n\nas the output. As you\
    \ can see, the `print` statement works just like an `echo` statement. While there\
    \ are some differences between them, in most cases, there is no need to use the\
    \ `print` statement. In PHP, it is fairly common that there is more than one way\
    \ to perform a certain task. This is one of the main complaints developers have\
    \ about PHP, as it complicates things unnecessarily. In most cases, the different\
    \ ways are very similar to each other. In order not to overwhelm you with too\
    \ many options, I'll stick with one option in this book and briefly mention other\
    \ options if necessary. In this book, I’ll be using `echo` statements to display\
    \ outputs.\n\n### 1.3 Escaping Characters\n\nNext, let’s learn to escape characters\
    \ in PHP. In the previous sections, we learned to enclose text in quotation marks\
    \ when we use an `echo` (or `print`) statement. What happens if we want to display\
    \ an apostrophe? For instance, suppose we have the following statement:\n\n`echo\
    \ '<BR>Today is Friday, we're going to the zoo.';` We’ll get an error when we\
    \ try to run the statement above as PHP does not differentiate between an apostrophe\
    \ and a quotation mark by default. Hence, it treats the apostrophe in the word\
    \ “we’re” as a closing quotation mark. In other words, it sees the statement as\
    \ `echo '<BR>Today is Friday, we'` and expects a semicolon or comma after the\
    \ apostrophe. When that does not happen, PHP gets confused and gives us an error.\
    \ There are two ways to deal with the error above. The first is to use double\
    \ quotation marks to enclose the text and rewrite the statement as `echo \"<BR>Today\
    \ is Friday, we're going to the zoo.\";` As PHP uses a double quotation mark to\
    \ close another double quotation mark, the apostrophe in “we’re” is not mistakenly\
    \ interpreted as a closing quotation mark. Alternatively, we can escape the apostrophe\
    \ in the original statement by preceding it with a backslash character (`\\`).\
    \ Escaping a character alters the meaning of the character. Without the backslash,\
    \ the apostrophe is interpreted as a closing quote. With it, it is treated as\
    \ an apostrophe meant to be displayed on the browser. For instance, to display\
    \ the apostrophe in the previous example, we can use the statement below: `echo\
    \ '<BR>Today is Friday, we\\'re going to the zoo.';` This gives us the following\
    \ output:\n\nToday is Friday, we're going to the zoo.\n\nOther common uses of\
    \ the backslash character include: Using it to display a double quotation mark\
    \ `echo \"\"` gives us an error, while `echo \"\\\"\"` gives us `\"` Using it\
    \ to display the backslash itself `echo \"\\\"` gives us an error, while `echo\
    \ \"\\\\\\\\\"` gives us `\\`\n\n## 2. Duplicating Code\n\nNext, let’s move on\
    \ to learn how to duplicate code in our PHP scripts. In PHP, generally speaking,\
    \ scripts are independent of one another. Hence, code written in one script (say,\
    \ `index.php`) is not available once users navigate to another page. If we want\
    \ multiple pages on our website to have the same HTML or PHP code, we need to\
