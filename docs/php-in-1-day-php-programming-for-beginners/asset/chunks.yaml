- raw: "$\\_SERVER\\[\"DOCUMENT\\_ROOT\"\\]. \"/phpproject/includes/\" to it. $\\\
    _SERVER\\['DOCUMENT\\_ROOT'\\] is a predefined variable that stores the document\
    \ root directory under which the current script is executing. If you are using\
    \ XAMPP, this root directory refers to the htdocs folder. When we concatenate\
    \ $\\_SERVER\\['DOCUMENT\\_ROOT'\\] and \"/phpproject/includes/\" , we get a direct\
    \ path to the includes folder.  \n\nIf you rename the phpproject folder, you have\
    \ to edit the path assigned to INC\\_DIR accordingly. For instance, if you rename\
    \ the folder to myproject , you have to assign $\\_SERVER\\[\"DOCUMENT\\_ROOT\"\
    \\]. \"/myproject/includes/\" to INC\\_DIR instead. Next, we have two include\
    \ statements for including  \n\nloadclasses.php and debugging.php . As mentioned\
    \ previously, we use loadclasses.php to autoload our classes and debugging.php\
    \ to handle all errors and exceptions. These two files have to be included in\
    \ most of our user interface files later. With that, the UI\\_include.php file\
    \ is complete and we are ready to move on to the user interface files.  \n\n13.8.2\
    \ User Interface Files The first is the error.html file. This file contains HTML\
    \ code for displaying a custom message to users when an error or exception occurs\
    \ on our site. It has already been completed for you. Next, we have five very\
    \ similar files admin.php , write.php , index.php , signup.php and read.php .\
    \  \n\nInside each file, we need to add PHP code to do the following: start a\
    \ new session and include the UI\\_include.php and header.html files. In addition,\
    \ each of the files contains a HTML form that is processed by the file itself.\
    \ To process the form, we need to use an include statement to add the relevant\
    \ processing file to the user interface file. For instance, to process the form\
    \ in admin.php , we need to include the p-admin.php file. The above has already\
    \ been done for you in admin.php . With reference to the code in admin.php , try\
    \ doing the same for write.php , index.php , signup.php and read.php . In each\
    \ case, note that the UI\\_include.php file must be included before the other\
    \ two files (as we need INC\\_DIR to be defined before using it). In addition,\
    \ you need to change the processing file accordingly. Got it? Great! Once you\
    \ are done with the above, we need to make some modifications. For signup.php\
    \ , there is no need to start a new session as psignup.php does not use any session\
    \ variable. Hence, we should remove the session\\_start(); statement from signup.php\
    \ . Next, for read.php , as p-read.php includes code for displaying output, we\
    \ should not include it at the start of the file. Instead, we should include it\
    \ between the <body>...</body> tags. Last but not least, for signup.php , admin.php\
    \ , index.php and write.php , we need to replace the text “Error Message Here”\
    \ (without quotes) in the HTML code with the actual error message stored in a\
    \ variable called $msg . To do that, we use the PHP code below: <?php echo $msg;\
    \ ?>  \n\nTry doing all the modifications above yourself. Now, we need to make\
    \ one more modification to index.php . If you refer to p-signup.php , you’ll notice\
    \ that we added the query string new=1 when directing users to index.php after\
    \ a successful sign-up, we want to make use of this query string inside index.php\
    \ . To do that, add the following code to index.php after the line <div class=\"\
    form\"> :  \n\n<div class = \"new\">  \n\n<?php  \n\nif (isset($\\_GET\\['new'\\\
    ]))  \n\necho 'ACCOUNT CREATED SUCCESSFULLY'; ?>  \n\n</div> Here, we use the\
    \ query string to check if users are directed to index.php after a successful\
    \ sign-up. If yes, we echo the string 'ACCOUNT CREATED SUCCESSFULLY' . Got it?\
    \ Great. Let’s move on to the last user interface file - logout.php . As the code\
    \ for logging out is very straightforward, we did not create a separate file for\
    \ processing logout.php . Instead,we’ll add the processing code to logout.php\
    \ directly. To do that, we need to do a few things in logout.php . First, we need\
    \ to resume the existing session (using session\\_start() ) and destroy all variables\
    \ in that session (usingsession\\_destroy() ). Next, we need to include the UI\\\
    _include.php and header.html files. Try doing the above yourself. Once that is\
    \ done, load the page http://localhost/phpproject/logout.php in your browser;\
    \ you’ll notice two identical links that say, “Click here to log in again”. This\
    \ is not a mistake. The first link points to admin.php while the second points\
    \ to index.php . If you refer back to write.php and study the code carefully,\
    \ you’ll notice that we added a query string (admin=1 ) to the logout URL near\
    \ the end of the page. This query string tells us that the person logging out\
    \ is an admin user. When that happens, we want to display the first logout link\
    \ in logout.php . On the other hand, if the person is not an admin user (i.e.,\
    \ there is no query string), we want to display the second logout link. Try using\
    \ an if-else statement in logout.php to achieve the above. You can refer to index.php\
    \ for help on using query strings. Once that is done, the logout.php file is complete.\
    \ The project is almost complete at this point. In fact, if you have done everything\
    \ correctly, you can load  \n\nhttp://localhost/phpproject/signup.php and everything\
    \ will work. Try entering your desired username into the first input box and click\
    \ “Submit”. What do you notice? You should get an error message that says “All\
    \ fields are required”. Notice that the username you entered into the first input\
    \ box is gone? The last part of our project involves adding PHP code to your user\
    \ interface files to ensure that values entered into forms are maintained if there’s\
    \ an error processing the form. Recall that we wrote a method called keepValues()\
    \ inside the Helper class for this purpose? Suppose we have aHelper object called\
    \ $h , here’s how we use the method: If we have a form with a textbox named “tb”\
    \ and we store the value submitted for “tb” as$tb , we write  \n\n<input type=\"\
    text\" name=\"tb\" <?php $h  \n\n\\>keepValues($tb, 'textbox');?> >  \n\nIf we\
    \ have a textarea named “ta” and we store the value submitted for “ta” as$ta ,\
    \ we write  \n\n<textarea name = \"ta\"><?php $h->keepValues($ta, 'textarea');\
    \ ?></textarea>  \n\nFinally, if we have a dropdrop list named “sl” with two value\
    \ attributes “1” and “2”, and we store the value submitted for “sl” as$sl , we\
    \ write <select name = \"sl\">  \n\n<option value = '1' <?php $h->keepValues($sl,\
    \  \n\n'select', '1'); ?>>1</option>  \n\n<option value = '2' <?php $h->keepValues($sl,\
    \  \n\n'select', '2'); ?>>2</option>  "
  fmt: "\n`$_SERVER[\"DOCUMENT_ROOT\"] . \"/phpproject/includes/\"` to it. `$_SERVER['DOCUMENT_ROOT']`\
    \ is a predefined variable that stores the document root directory under which\
    \ the current script is executing. If you are using XAMPP, this root directory\
    \ refers to the `htdocs` folder. When we concatenate `$_SERVER['DOCUMENT_ROOT']`\
    \ and `\"/phpproject/includes/\"`, we get a direct path to the includes folder.\
    \ \n\nIf you rename the `phpproject` folder, you have to edit the path assigned\
    \ to `INC_DIR` accordingly. For instance, if you rename the folder to `myproject`,\
    \ you have to assign `$_SERVER[\"DOCUMENT_ROOT\"] . \"/myproject/includes/\"`\
    \ to `INC_DIR` instead. Next, we have two include statements for including `loadclasses.php`\
    \ and `debugging.php`. As mentioned previously, we use `loadclasses.php` to autoload\
    \ our classes and `debugging.php` to handle all errors and exceptions. These two\
    \ files have to be included in most of our user interface files later. With that,\
    \ the `UI_include.php` file is complete and we are ready to move on to the user\
    \ interface files.\n\n### 13.8.2 User Interface Files\n\nThe first is the `error.html`\
    \ file. This file contains HTML code for displaying a custom message to users\
    \ when an error or exception occurs on our site. It has already been completed\
    \ for you. Next, we have five very similar files `admin.php`, `write.php`, `index.php`,\
    \ `signup.php` and `read.php`.\n\nInside each file, we need to add PHP code to\
    \ do the following: start a new session and include the `UI_include.php` and `header.html`\
    \ files. In addition, each of the files contains a HTML form that is processed\
    \ by the file itself. To process the form, we need to use an include statement\
    \ to add the relevant processing file to the user interface file. For instance,\
    \ to process the form in `admin.php`, we need to include the `p-admin.php` file.\
    \ The above has already been done for you in `admin.php`. With reference to the\
    \ code in `admin.php`, try doing the same for `write.php`, `index.php`, `signup.php`\
    \ and `read.php`. In each case, note that the `UI_include.php` file must be included\
    \ before the other two files (as we need `INC_DIR` to be defined before using\
    \ it). In addition, you need to change the processing file accordingly. Got it?\
    \ Great! Once you are done with the above, we need to make some modifications.\
    \ For `signup.php`, there is no need to start a new session as `psignup.php` does\
    \ not use any session variable. Hence, we should remove the `session_start()`\
    \ statement from `signup.php`. Next, for `read.php`, as `p-read.php` includes\
    \ code for displaying output, we should not include it at the start of the file.\
    \ Instead, we should include it between the `<body>...</body>` tags. Last but\
    \ not least, for `signup.php`, `admin.php`, `index.php` and `write.php`, we need\
    \ to replace the text “Error Message Here” (without quotes) in the HTML code with\
    \ the actual error message stored in a variable called `$msg`. To do that, we\
    \ use the PHP code below:\n\n```php\n<?php echo $msg; ?>\n```\n\nTry doing all\
    \ the modifications above yourself. Now, we need to make one more modification\
    \ to `index.php`. If you refer to `p-signup.php`, you’ll notice that we added\
    \ the query string `new=1` when directing users to `index.php` after a successful\
    \ sign-up, we want to make use of this query string inside `index.php`. To do\
    \ that, add the following code to `index.php` after the line `<div class=\"form\"\
    >`:\n\n```html\n<div class = \"new\">\n<?php \nif (isset($_GET['new'])) \necho\
    \ 'ACCOUNT CREATED SUCCESSFULLY'; ?>\n</div>\n```\n\nHere, we use the query string\
    \ to check if users are directed to `index.php` after a successful sign-up. If\
    \ yes, we echo the string 'ACCOUNT CREATED SUCCESSFULLY'. Got it? Great. Let’s\
    \ move on to the last user interface file - `logout.php`. As the code for logging\
    \ out is very straightforward, we did not create a separate file for processing\
    \ `logout.php`. Instead, we’ll add the processing code to `logout.php` directly.\
    \ To do that, we need to do a few things in `logout.php`. First, we need to resume\
    \ the existing session (using `session_start()`) and destroy all variables in\
    \ that session (using `session_destroy()`). Next, we need to include the `UI_include.php`\
    \ and `header.html` files. Try doing the above yourself. Once that is done, load\
    \ the page `http://localhost/phpproject/logout.php` in your browser; you’ll notice\
    \ two identical links that say, “Click here to log in again”. This is not a mistake.\
    \ The first link points to `admin.php` while the second points to `index.php`.\
    \ If you refer back to `write.php` and study the code carefully, you’ll notice\
    \ that we added a query string `admin=1` to the logout URL near the end of the\
    \ page. This query string tells us that the person logging out is an admin user.\
    \ When that happens, we want to display the first logout link in `logout.php`.\
    \ On the other hand, if the person is not an admin user (i.e., there is no query\
    \ string), we want to display the second logout link. Try using an `if-else` statement\
    \ in `logout.php` to achieve the above. You can refer to `index.php` for help\
    \ on using query strings. Once that is done, the `logout.php` file is complete.\
    \ The project is almost complete at this point. In fact, if you have done everything\
    \ correctly, you can load `http://localhost/phpproject/signup.php` and everything\
    \ will work. Try entering your desired username into the first input box and click\
    \ “Submit”. What do you notice? You should get an error message that says “All\
    \ fields are required”. Notice that the username you entered into the first input\
    \ box is gone? The last part of our project involves adding PHP code to your user\
    \ interface files to ensure that values entered into forms are maintained if there’s\
    \ an error processing the form. Recall that we wrote a method called `keepValues()`\
    \ inside the `Helper` class for this purpose? Suppose we have a `Helper` object\
    \ called `$h`, here’s how we use the method: If we have a form with a textbox\
    \ named “tb” and we store the value submitted for “tb” as `$tb`, we write\n\n\
    ```html\n<input type=\"text\" name=\"tb\" <?php $h->keepValues($tb, 'textbox');?>\
    \ >\n```\n\nIf we have a textarea named “ta” and we store the value submitted\
    \ for “ta” as `$ta`, we write\n\n```html\n<textarea name = \"ta\"><?php $h->keepValues($ta,\
    \ 'textarea'); ?></textarea>\n```\n\nFinally, if we have a dropdown list named\
    \ “sl” with two value attributes “1” and “2”, and we store the value submitted\
    \ for “sl” as `$sl`, we write\n\n```html\n<select name = \"sl\">\n<option value\
    \ = '1' <?php $h->keepValues($sl, 'select', '1'); ?>>1</option>\n<option value\
    \ = '2' <?php $h->keepValues($sl, 'select', '2'); ?>>2</option>\n</select>\n```\n"
  trans: "\n\n将 `$_SERVER[\"DOCUMENT_ROOT\"] . \"/phpproject/includes/\"` 接到它。`$_SERVER['DOCUMENT_ROOT']`\
    \ 是一个预定义变量，用于存储当前脚本执行的文档根目录。如果你正在使用 XAMPP，此根目录指向 `htdocs` 文件夹。当我们拼接 `$_SERVER['DOCUMENT_ROOT']`\
