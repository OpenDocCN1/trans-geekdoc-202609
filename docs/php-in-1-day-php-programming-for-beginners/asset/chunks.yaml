    \ 行的 `do-while` 循环。在循环内部，程序执行第 4 行的 `echo` 语句并在第 5 行将 `$e` 的值增加到 `101`。最后，它到达第\
    \ 6 行的测试条件。由于 `$e` 的值小于 `0`，测试失败。程序退出 `do-while` 循环且不再重复循环中的任务。如果你运行上述代码，你将得到输出\
    \ `The value is 100`。虽然 `$e` 的原始值不满足测试条件 ($e < 0)，但由于测试条件位于闭合大括号之后，大括号内的代码会被执行一次。\n\
    \n## 4. 流程控制中的其他主题\n\n太棒了！我们涵盖了 PHP 中所有主要的控制结构。在结束本章之前，我想介绍几个更多与 PHP 流程控制相关的杂题。\n\
    \n### 1. 布尔值\n\n首先，让我们来谈谈 `bool` 数据类型。我们在第 4.3 章遇到过这种数据类型，并了解到它只能存储两个值之一——`true`\
    \ 或 `false`。在 PHP 中，大多数值都可以转换为 `true` 或 `false`（即转换为 `bool` 数据类型）。转换为 `false`\
    \ 的值包括：\n\n- 代表零的数字（例如 `0` 和 `0.0`）\n- 空字符串（例如 `''`，它由两个单引号组成，中间没有包含文本）\n- 字符串\
    \ `\"0\"`\n- 零元素的数组，以及\n- 一个名为 `NULL` 的特殊值。\n\n相反，大多数其他值（如 `1`、`3.4` 和 `\"Hello\"\
    `）都会转换为 `true`。我们已经看到控制结构如何根据条件求值是 `true` 还是 `false` 来决定是否执行某块代码。假设我们有以下 `if`\
    \ 语句：\n\n```php\nif (\"hello\") {\n    echo 'if block';\n} else {\n    echo 'else\
    \ block';\n}\n```\n\n如果我们运行上述语句，我们将得到输出 `if block`。这是因为字符串 `\"hello\"` 被转换成了 `true`。对于任何控制结构，只要条件求值为\
    \ `true`，无论它是比较的结果（例如 `$a < 5`）还是转换为 `true` 的值，对应的代码块都将被执行。在上面的 `if` 语句中，由于 `if`\
    \ 条件（`\"hello\"`）求值为 `true`，因此执行了 `if` 块。懂了吗？很好！\n\n### 6.4.2 Break, Continue\n\
    \n接下来，让我们讨论 `break` 和 `continue` 语句。这些语句可以修改我们控制结构的行为。我们之前讨论 `switch` 语句时已经遇到过\
    \ `break` 语句。当满足特定的 `switch case` 时，`switch` 语句会执行后续的所有内容，直到遇到 `break` 语句。除了在\
    \ `switch` 语句中使用它外，我们可以在循环中使用 `break` 语句。`break` 语句会结束其所在循环的执行。让我们来看一个例子：\n\n\
    ```php\nfor ($i = 0; $i < 50; ++$i) {\n    echo \"$i<BR>\";\n    if ($i == 4)\
    \ {\n        break;\n    }\n}\n```\n\n在这里，我们在 `for` 循环内部有一个 `if` 语句。`break` 语句会结束其所在循环的执行。（此处省略原文中大量重复的句子，按要求不重复输出）。\n\
    \n### 6.4.3 替代语法\n\n接下来，让我们讨论替代（alternative）。PHP 为它的某些控制结构提供了替代语法，特别是 `if`、`while`、`foreach`\
    \ 和 `switch`。这种语法涉及将左大括号替换为冒号，并将最后一个右大括号分别替换为 `endif;`、`endwhile;`、`endforeach;`\
    \ 或 `endswitch;`。让我们用 `if` 语句来说说明。假设我们要根据 `$a` 的值显示不同的输出，可以使用以下代码：\n\n```php\n\
    $a = 5;\nif ($a == 5){\n    echo '<BR>The value of a is ';\n}else{\n    echo 'Not\
    \ five';\n}\n```\n\n或者，我们可以这样做：\n\n```php\n$a = 5;\nif ($a == 5):\n    echo '<BR>The\
    \ value of a is ';\nelse:\n    echo 'Not five';\nendif;\n```\n\n比较这两个 `if` 语句。注意在上面的第二个\
    \ `if` 语句中，我们将左大括号替换为了冒号？此外，我们将最后一个右大括号替换为了 `endif;` 语句。如果你运行上述代码，两种语法都将输出 `The\
    \ value of a is 5`。\n\n### 6.4.4 显示 HTML 代码\n\n最后，让我们讨论输出 HTML 代码的技巧。到为止，我们一直在使用\
    \ `echo` 语句在控制结构中输出 HTML 代码（例如 `<BR>` 标签）。这种技术易用，对于简单的 HTML 代码效果良好。但如果我们需要输出更复杂的\
    \ HTML 代码，它可能会变得繁琐，特别是当代码使用了大量的单双引号时。例如，如果我们想用 `echo` 语句输出以下 HTML 代码 `<a href=\"\
    names.php\" target=\"_blank\">The names are 'Aaron', 'Peter', 'James', 'Max',\
    \ 'Jenny' and 'Don'.</a><img src=\"names.jpg\" alt=\"Names\" height=\"42\" width=\"\
    42\">`，我们需要转义大量的引号。在这种情况下，可以使用一种技巧在 PHP 和 HTML 代码之间切换。为了演示，假设我们想使用 `for` 循环输出三次\
    \ HTML 代码 `<h1>Hello</h1>`，下面的代码展示了我们可以如何操作（使用上一节提到的替代语法）：\n\n```php\n<?php\n\
    for ($i = 0; $i < 3; ++$i):\n    echo '<h1>Hello</h1>';\nendfor;\n?>\n```\n\n\
    这个循环使用 `echo` 语句输出 HTML 代码。或者，如果我们不想使用 `echo` 语句，可以如下所示：\n\n```php\n<?php\nfor\
    \ ($i = 0; $i < 3; ++$i): ?>\n    <h1>Hello</h1>\n<?php endfor; ?>\n```\n\n"
