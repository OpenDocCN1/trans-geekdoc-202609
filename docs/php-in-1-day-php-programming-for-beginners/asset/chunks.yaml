    \n### 6.3.4 For 循环\n\n接下来，让我们来看下 `for` 循环。这种控制结构会重复执行一个代码块，直到测试条件不再有效。其语法如下：\n\
    \n```\nfor (初始值; 测试条件; 值的修改) \n{ //执行某些任务\n}\n```\n\n 让我们看一个示例：\n```\nfor ($c\
    \ = 1; $c < 5; ++$c){ \n  echo 'The value of $c is '.$c.'<BR>'; \n}\n```\n`for`\
    \ 循环的重点是第一行。该行包含三个部分，每个部分由分号隔开。在我们的示例中，有这一行：`for ($c = 1; $c < 5; ++$c)`。\n\n\
    第一部分声明了一个变量 `$c` 并将其初始化为 1。第二部分测试 `$c` 是否小于 5。如果是，将执行随其后的大括号内部的语句。在我们的示例中，由于只有一个语句要执行，因此大括号是可选的。在执行完大括号中的语句后，程序返回到第三部分（`++$c`）。这部分修改用于测试的变量的值。在我们的示例中，我们使用自增运算符将\
    \ `$c` 的值加 1。结果是`$c` 变成了 2。自增后，程序测试 `$c` 的新值是否仍然小于 5。如果是，它会再次执行大括号中的代码。这种测试和更新\
    \ `$c` 值的将不断重复，直到条件 `$c < 5` 不再为真。此时，程序退出。\n\n### 6.3.5 Foreach 循环\n\n接下来，让我们来看\
    \ `foreach` 循环。这种循环与 `for` 循环类似，但用于遍历数组。它有两种语法：\n\n```\nforeach ($array as $value)\
    \ {\n  //代码\n}\n\nforeach ($array as $key => $value) {\n  //代码\n}\n```\n假设我们有一个关联数组：\n\
    ```\n$arr2 = array('Aaron'=>12, 'Ben'=>23, 'Carol'=>35);\n```\n使用第一个 `foreach`\
    \ 循环：\n```\nforeach ($arr2 as $name) { \n  echo $name.' is.' years old.'; \n}\n\
    ```\n这将输出 Aaron is 12 years old, Ben is 23 years old, Carol is 35 years old。\n\
    \n### 6.3.6 While 循环\n\n`while` 循环在特定条件保持真的同时重复执行代码块。其语法如下：\n\n```\nwhile (条件为真)\
    \ \n{ \n  //代码\n}\n```\n\n让我们看一个示例：\n```\n$d = 1;\nwhile ($d < 5) { \n  echo 'The\
    \ value of $d is '.$d.'<BR>'; \n  $d++; \n}\n```\n在示例中，我们声明了一个变量 `$d` 并赋值为 1。`while`\
    \ 循环检查 `$d < 5` 是否为真。如果是，它执行大括号内部的语句。换句话说，它执行了第 5 行的 `echo` 语句并在第 6 行将 `$d` 加\
    \ 1。结果是 `$d` 变成了 2。接下来，循环返回第 3 行检查 `$d` 是否仍然小于 5。如果是，它再次执行大括号中的代码。这种检查和更新 `$d`\
    \ 值的过程持续直到 `$d < 5` 不再为真。\n\n### 6.3.7 Do-while 循环\n\n`do-while` 循环与 `while` 循环非常相似，但测试条件位于循环的最后。这意味着循环大括号内的代码始终至少执行一次。语法为：\n\
    \n```\ndo {\n  //某些任务\n} while (条件为真);\n```\n注意，测试条件后面需要一个分号（`;`）。\n\n"
