    # PHP 中的字符串函数


    在这里，我们声明了一个名为 `$str7` 的变量，并将其字符串 `''ABCDEF''` 赋值给它。接下来，我们三次将 `$str7` 传递给 `substr()`
    以提取不同的子字符串。在前两个示例中，`substr()` 函数分别从位置 2 和 -3 开始（并包含该位置）提取子字符串。因此，我们得到了“CDEF”和“DEF”作为输出。


    在第三个示例中，我们通过向 `substr()` 传递第三个可选参数来指定子字符串的长度。由于我们指定的长度为 1，因此我们得到了“C”作为输出。明白了吗？我们已经涵盖了
    PHP 中的几个字符串函数。要查看所有可用字符串函数的完整列表，你可以访问页面 https://www.php.net/manual/en/ref.strings.php
    。


    ## 2. 使用字符串表示日期


    接下来，让我们学习使用字符串来表示日期。为了实现这一点，我们使用名为 `strtotime()` 的内置函数。


    ### 2.1 `strtotime()` 函数


    如名所示，`strtotime()` 函数将字符串转换为时间。它接受一个描述特定日期（和时间）的字符串，并尝试将其转换为时间戳。如果你传递给函数一个无法转换的字符串，它将返回
    `false`。另一方面，如果你传递一个它能够转换的字符串，它将解析该字符串并返回 UNIX 时间戳。UNIX 时间戳是一个整数，表示自 1970 年 1
    月 1 日 00:00:00 UTC 以来的秒数。


    例如，如果你运行语句：


    ```

    echo strtotime("next Monday");

    ```


    你将得到类似 `1587340800` 的结果。这提供了下周一（撰本文时）的 UNIX 时间戳。`strtotime()` 函数非常智能，能够将各种英语文本日期描述转换为
    UNIX 时间戳。例如，它转换如 `"now"`、`"tomorrow"`、`"next Monday"`、`"15 Nov 2019"` 或 `"+1 week"`
    等字符串没有问题。虽然该函数很容易，但你可能会同意，它返回的时间戳在大多数情况下并不实用。如果你想为日期或时间获取更有意义的格式，可以使用另一个名为 `date()`
    的内置函数。


    ### 2.2 `date()` 函数


    `date()` 函数接受一个可选的时间戳，并将时间戳格式化为更易读的字符串。如果没有提供时间戳，它将格式化当前时间戳。假设我们想格式化当前时间之后 10
    小时的时间戳，可以使用下面的语句：


    ```

    echo date(''d-M-Y'', strtotime("+ 10 hours"));

    ```


    在这里，我们向函数传递了两个参数。第一个参数指定了我们希望如何格式化时间戳。为了这一点，我们使用一个由标点符号和预定义字符组成的字符串（定义见 https://www.php.net/manual/en/function.date.php）。在我们的示例中，我们使用了字符串
    `''d-M-Y''`。字符 `‘d’` 表示我们希望日期以两位数字的形式表示，必要时使用前导零（例如，3 会输出为 03）。字符 `‘M’` 和 `‘Y’`
    表示我们希望月份和年份分别用三个字母文本（例如 Jan）和四位数字表示。最后，标点符号 `‘-’` 表示我们希望用连字符分隔日、月、年。在指定了所需的格式后，我们向
    `date()` 函数传递了第二个参数 `strtotime("+ 10 hours")`。该参数是可选的，指定了我们希望函数格式化的日期。如果你运行上面的
    `echo` 语句，你将得到类似 `03-Apr-2020` 的输出。


    这提供了现在（撰本文时）之后 10 小时的日期。明白了吗？


    ### 2.3 设置时区


    上面的小节讨论了 PHP 中许多内置日期/时间函数中的两个。虽然大多数这些函数都很容易使用，但请注意，它们的结果受到我们 PHP 服务器中设置的时区的影响。例如，虽然


    ```

    echo date(''d-M-Y'', strtotime("+ 10 hours"));

    ```


    在一个时区中带给我们给出 `03-Apr-2020`，但在另一个时区，它可能会给出 `04-Apr-2020`。为了避免结果出现任何差异，强烈建议你在你的
    PHP 服务器中手动设置时区。


