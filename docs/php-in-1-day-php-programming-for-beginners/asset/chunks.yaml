- raw: "These classes include the Exception , PDOException , DOMException andOutOfBoundsException\
    \ class. When an exception occurs, PHP creates an object of the relevant exception\
    \ class. This object contains information about the exception and can be used\
    \ to call various methods defined in the class. These methods include the getMessage()\
    \ , getFile() , getLine() andgetTraceAsString() methods, which give us the message,\
    \ file name, line number and stack trace of the exception respectively. After\
    \ an exception is thrown (i.e., after PHP creates the exception object), we need\
    \ to catch it using a catch block. We can define multiplecatch blocks to deal\
    \ with different types of exceptions. After the catch block(s), we have the finally\
    \ block. This block is optional and always executed regardless of whether the\
    \ try block succeeds or fails. To illustrate how the try , catch and finally blocks\
    \ work, replace the original code in exceptionHandling.php with the following\
    \ code: <?php  \n\ntry{  \n\ninclude \"connect.php\";  \n\n}catch(PDOException\
    \ $e){  \n\necho '<BR>Unable to connect '.$e->getMessage(); }catch(Exception $e){\
    \  \n\necho '<BR>Something else happened'.$e  \n\n\\>getMessage();  \n\n}finally{\
    \  \n\necho '<BR><BR>The finally block is always  \n\nexecuted';  \n\n} echo '<BR>After\
    \ connecting';  \n\nHere, we first try to connect to the “pawszone” database inside\
    \ the try block.  \n\nIf we are unable to connect, PHP throws an exception and\
    \ one of the catch blocks will be executed. In our example, we have two catch\
    \ blocks. The firstcatch block catches a PDO exception (PDOException ) while the\
    \ second catches a general exception (Exception ). PDOException is a predefined\
    \ class that deals with exceptions when PDO is unable to perform its task.Exception\
    \ , on the other hand, is the parent class of all exception classes and deals\
    \ with general exceptions. $e represents an object of the respective exception\
    \ class. Inside our catch blocks, we use$e to call the built-ingetMessage() method\
    \ and use anecho statement to echo the error message. If we run the code above,we’ll\
    \ get the following output: Unable to connect SQLSTATE\\[HY000\\] \\[1045\\] Access\
    \ denied for user 'wrongadmin'@'localhost' (using password: YES) The finally block\
    \ is always executed  \n\nAfter connecting The first line of output is from the\
    \ catch(PDOException $e) block. As PHP is unable to connect to the database in\
    \ connect.php , it throws a PDO exception. The second line is from the finally\
    \ block. This block is executed regardless of whether the code in the try block\
    \ succeeds or fails. Finally, the last line is from the echo statement after the\
    \ try-catchfinally blocks. This line illustrates that when an exception occurs\
    \ and is caught successfully, the script continues executing. Straightforward?\
    \ Good! 12.1.3 Throwing Exceptions  \n\nNext, let’s learn to throw our own exceptions.\
    \ In the section above, we learn to catch exceptions thrown by PHP. Besides relying\
    \ on PHP to throw exceptions for us, we can throw our own exceptions. We do that\
    \ using the throw keyword. Let’s look at an example. Add the function below to\
    \ the end of exceptionHandling.php (i.e., after the echo '<BR>After connecting';\
    \ statement): function displayUserInput($userInput){  \n\nif ($userInput > 100)\
    \  \n\n{ throw new OutOfRangeException('<BR>User input is too big');  \n\n}else\
    \  \n\n{ echo '<BR>'.$userInput;  \n\n}  \n\n}  \n\nHere, we define a function\
    \ calleddisplayUserInput() that has one parameter $userInput . If $userInput is\
    \ greater than100 , we throw an  \n\nOutOfRangeException exception using the throw\
    \ keyword. OutOfRangeException is a predefined class in PHP extended from the\
    \ Exception class. Throwing an OutOfRangeException exception involves creating\
    \ a new object of the class. When creating a new OutOfRangeException object, we\
    \ can pass a few optional arguments to the constructor. We commonly pass an error\
    \ message. In our example, we pass the string'<BR>User input is too big' to the\
    \ constructor. If we call the displayUserInput() function using the try-catch\
    \ blocks below:  \n\ntry {  \n\ndisplayUserInput(105);  \n\n}catch (OutOfRangeException\
    \ $e) { echo $e->getMessage();  \n\n} an OutOfRangeException exception will be\
    \ thrown in the try block as$userInput is greater than 100 . This gets caught\
    \ by the catch block. Inside the catch block, we use the getMessage() method to\
    \ get the error message. If we run the code above, we’ll get  \n\nUser input is\
    \ too big  \n\nas the output. If we change the function call to  \n\ndisplayUserInput(16);\
    \ no exception will be thrown and we’ll get 16 as the output. Got it? Great! \
    \ \n\n12.1.4 Exception Handler In the previous sections, we learned to throw and\
    \ catch exceptions. Some exceptions, such as a PDO exception, are easy to pre-empt.\
    \ Others may be harder. In most cases, despite our best efforts, there are bound\
    \ to be exceptions we fail to anticipate. In cases like these, PHP allows us to\
    \ specify a custom exception handler that gets called whenever there are exceptions\
    \ we fail to catch. We can use this custom handler to display a custom message\
    \ to users. However, after the exception handler is called, the PHP script will\
    \ be terminated. To see how an exception handler works, add the following code\
    \ to the end of exceptionHandling.php :  \n\nfunction myExceptionHandler($e) {\
    \  \n\necho '<BR>Oppsss... An uncaught exception  \n\noccurred.<BR>'.$e->getMessage();\
    \  \n\n} set\\_exception\\_handler('myExceptionHandler'); Here, we define a function\
    \ called myExceptionHandler() to serve as the exception handler. For a function\
    \ to qualify as an exception handler, it needs to have one parameter for storing\
    \ the uncaught exception object. This parameter is$e in our example. Within the\
    \ function, we use$e to call the getMessage() method and use an echo statement\
    \ to echo the message. After coding the function, we need to use a built-in function\
    \ called set\\_exception\\_handler() to setmyExceptionHandler() as the exception\
    \ handler. To do that, we write set\\_exception\\_handler('myExceptionHandler');\
    \ To test our exception handler, add the following lines to the end of exceptionHandling.php\
    \ :  \n\n$pdo = new PDO(\"some invalid database\");  \n\necho 'This will not be\
    \ executed';  \n\nHere, we try to create a PDO object using an invalid argument.\
    \ This results in aPDO exception, which is not caught by anycatch block. If you\
    \ run the code above, you’ll get  \n\nOppsss... An uncaught exception occurred.\
    \  \n\ninvalid data source name added to the output. The exception handler ( myExceptionHandler\
    \ ) has successfully handled the exception. However, notice that the echo statement\
    \ after thePDO instantiation statement is not executed? This is because the PHP\
    \ script got terminated after the exception handler is called. Got it? 2\\. Handling\
    \ Errors  "
  fmt: "\nThese classes include the `Exception`, `PDOException`, `DOMException` and\
    \ `OutOfBoundsException` class. When an exception occurs, PHP creates an object\
    \ of the relevant exception class. This object contains information about the\
    \ exception and can be used to call various methods defined in the class. These\
    \ methods include the `getMessage()`, `getFile()`, `getLine()` and `getTraceAsString()`\
    \ methods, which give us the message, file name, line number and stack trace of\
    \ the exception respectively.\n\nAfter an exception is thrown (i.e., after PHP\
    \ creates the exception object), we need to catch it using a `catch` block. We\
    \ can define multiple `catch` blocks to deal with different types of exceptions.\
    \ After the `catch` block(s), we have the `finally` block. This block is optional\
    \ and always executed regardless of whether the `try` block succeeds or fails.\
    \ To illustrate how the `try`, `catch` and `finally` blocks work, replace the\
    \ original code in `exceptionHandling.php` with the following code:\n\n```php\n\
    <?php\ntry{\ninclude \"connect.php\";\n}catch(PDOException $e){\necho '<BR>Unable\
    \ to connect '.$e->getMessage();\n}catch(Exception $e){\necho '<BR>Something else\
    \ happened'.$e->getMessage();\n}finally{\necho '<BR><BR>The finally block is always\
    \ executed';\n}\necho '<BR>After connecting';\n```\n\nHere, we first try to connect\
    \ to the “pawszone” database inside the `try` block.\n\nIf we are unable to connect,\
    \ PHP throws an exception and one of the `catch` blocks will be executed. In our\
    \ example, we have two `catch` blocks. The first `catch` block catches a PDO exception\
    \ (`PDOException`) while the second catches a general exception (`Exception`).\
    \ `PDOException` is a predefined class that deals with exceptions when PDO is\
    \ unable to perform its task. `Exception`, on the other hand, is the parent class\
    \ of all exception classes and deals with general exceptions. `$e` represents\
    \ an object of the respective exception class. Inside our `catch` blocks, we use\
    \ `$e` to call the built-in `getMessage()` method and use an `echo` statement\
    \ to echo the error message.\n\nIf we run the code above, we’ll get the following\
    \ output:\n`Unable to connect SQLSTATE[HY000] [1045] Access denied for user 'wrongadmin'@'localhost'\
    \ (using password: YES) The finally block is always executed After connecting`\n\
    \nThe first line of output is from the `catch(PDOException $e)` block. As PHP\
    \ is unable to connect to the database in `connect.php`, it throws a PDO exception.\
    \ The second line is from the `finally` block. This block is executed regardless\
    \ of whether the code in the `try` block succeeds or fails. Finally, the last\
    \ line is from the `echo` statement after the `try-catch-finally` blocks. This\
    \ line illustrates that when an exception occurs and is caught successfully, the\
    \ script continues executing. Straightforward? Good!\n\n### 12.1.3 Throwing Exceptions\n\
    \nNext, let’s learn to throw our own exceptions. In the section above, we learn\
    \ to catch exceptions thrown by PHP. Besides relying on PHP to throw exceptions\
    \ for us, we can throw our own exceptions. We do that using the `throw` keyword.\
    \ Let’s look at an example. Add the function below to the end of `exceptionHandling.php`\
    \ (i.e., after the `echo '<BR>After connecting';` statement):\n\n```php\nfunction\
    \ displayUserInput($userInput){\n    if ($userInput > 100){\n        throw new\
    \ OutOfRangeException('<BR>User input is too big');\n    }else{\n        echo\
    \ '<BR>'.$userInput;\n    }\n}\n```\n\nHere, we define a function called `displayUserInput()`\
    \ that has one parameter `$userInput`. If `$userInput` is greater than 100, we\
    \ throw an `OutOfRangeException` exception using the `throw` keyword. `OutOfRangeException`\
    \ is a predefined class in PHP extended from the `Exception` class. Throwing an\
    \ `OutOfRangeException` exception involves creating a new object of the class.\
    \ When creating a new `OutOfRangeException` object, we can pass a few optional\
    \ arguments to the constructor. We commonly pass an error message. In our example,\
    \ we pass the string `'<BR>User input is too big'` to the constructor.\n\nIf we\
    \ call the `displayUserInput()` function using the `try-catch` blocks below:\n\
    \n```php\ntry {\n    displayUserInput(105);\n}catch (OutOfRangeException $e) {\n\
    \    echo $e->getMessage();\n}\n```\n\nan `OutOfRangeException` exception will\
    \ be thrown in the `try` block as `$userInput` is greater than 100. This gets\
    \ caught by the `catch` block. Inside the `catch` block, we use the `getMessage()`\
    \ method to get the error message. If we run the code above, we’ll get:\n`User\
    \ input is too big`\nas the output. If we change the function call to `displayUserInput(16);`\
    \ no exception will be thrown and we’ll get `16` as the output. Got it? Great!\n\
    \n### 12.1.4 Exception Handler\n\nIn the previous sections, we learned to throw\
    \ and catch exceptions. Some exceptions, such as a PDO exception, are easy to\
    \ pre-empt. Others may be harder. In most cases, despite our best efforts, there\
    \ are bound to be exceptions we fail to anticipate. In cases like these, PHP allows\
    \ us to specify a custom exception handler that gets called whenever there are\
    \ exceptions we fail to catch. We can use this custom handler to display a custom\
    \ message to users. However, after the exception handler is called, the PHP script\
    \ will be terminated. To see how an exception handler works, add the following\
    \ code to the end of `exceptionHandling.php`:\n\n```php\nfunction myExceptionHandler($e)\
    \ {\n    echo '<BR>Oppsss... An uncaught exception occurred.<BR>'.$e->getMessage();\n\
    }\nset_exception_handler('myExceptionHandler');\n```\n\nHere, we define a function\
    \ called `myExceptionHandler()` to serve as the exception handler. For a function\
    \ to qualify as an exception handler, it needs to have one parameter for storing\
    \ the uncaught exception object. This parameter is `$e` in our example. Within\
    \ the function, we use `$e` to call the `getMessage()` method and use an `echo`\
    \ statement to echo the message. After coding the function, we need to use a built-in\
    \ function called `set_exception_handler()` to set `myExceptionHandler()` as the\
    \ exception handler. To do that, we write `set_exception_handler('myExceptionHandler');`.\
    \ To test our exception handler, add the following lines to the end of `exceptionHandling.php`:\n\
    \n```php\n$pdo = new PDO(\"some invalid database\");\necho 'This will not be executed';\n\
    ```\n\nHere, we try to create a PDO object using an invalid argument. This results\
    \ in a PDO exception, which is not caught by any `catch` block. If you run the\
    \ code above, you’ll get:\n`Oppsss... An uncaught exception occurred.invalid data\
    \ source name added to the output.`\nThe exception handler (`myExceptionHandler`)\
    \ has successfully handled the exception. However, notice that the `echo` statement\
    \ after the PDO instantiation statement is not executed? This is because the PHP\
    \ script got terminated after the exception handler is called. Got it? 2. Handling\
    \ Errors\n"
  trans: "\n\n这些类包含了 `Exception`、`PDOException`、`DOMException` 和 `OutOfBoundsException`\
    \ 类。当发生异常时，PHP 会创建相关异常类的对象。该对象包含有关该异常的信息，并可用于调用类中定义的各种方法。这些方法包括 `getMessage()`、`getFile()`、`getLine()`\
    \ 和 `getTraceAsString()` 方法，它们分别为我们提供异常的消息、文件名、行号和堆栈跟踪。\n\n在异常被抛出后（即在 PHP 创建异常对象之后），我们需要使用\
    \ `catch` 块来捕获它。我们可以定义多个 `catch` 块来处理不同类型的异常。在 `catch` 块之后，是 `finally` 块。该块是可选的，无论\
    \ `try` 块成功还是失败，它总是会被执行。为了说明 `try`、`catch` 和 `finally` 块的工作原理，请将 `exceptionHandling.php`\
    \ 中的原始代码替换为以下代码：\n\n```php\n<?php\ntry{\ninclude \"connect.php\";\n}catch(PDOException\
    \ $e){\necho '<BR>Unable to connect '.$e->getMessage();\n}catch(Exception $e){\n\
    echo '<BR>Something else happened'.$e->getMessage();\n}finally{\necho '<BR><BR>The\
    \ finally block is always executed';\n}\necho '<BR>After connecting';\n```\n\n\
    在这里，我们首先在 `try` 块中尝试连接到“pawszone”数据库。\n\n如果我们无法连接，PHP 会抛出一个异常，并执行 `catch` 块之一。在我们的示例中，我们有两个\
    \ `catch` 块。第一个 `catch` 块捕获 PDO 异常（`PDOException`），而第二个 `catch` 块捕获通用异常（`Exception`）。`PDOException`\
    \ 是一个预定义类，用于处理 PDO 无法执行其任务时的异常。另一方面，`Exception` 是所有异常类的父类，用于处理通用异常。`$e` 代表相应异常类的对象。在\
    \ `catch` 块内部，我们使用 `$e` 调用内置的 `getMessage()` 方法，并使用 `echo` 语句输出错误消息。\n\n如果我们运行上面的代码，将得到以下输出：\n\
    `Unable to connect SQLSTATE[HY000] [1045] Access denied for user 'wrongadmin'@'localhost'\
    \ (using password: YES) The finally block is always executed After connecting`\n\
    \n第一行输出来自 `catch(PDOException $e)` 块。由于 PHP 无法连接到 `connect.php` 中的数据库，它抛出了一个 PDO\
    \ 异常。第二行来自 `finally` 块。无论 `try` 块中的代码成功还是失败，该块都会执行。最后，最后一行来自 `try-catch-finally`\
    \ 块之后的 `echo` 语句。这一行说明了当异常发生并被成功捕获时，脚本将继续执行。很直接吧？很好！\n\n### 12.1.3 抛出异常\n\n接下来，让我们学习如何抛出自己的异常。在上面的部分中，我们学习了如何捕获\
    \ PHP 抛出的异常。除了依赖 PHP 为我们抛出异常外，我们也可以抛出自己的异常。我们使用 `throw` 关键字来实现。让我们来看一个示例。将下面的函数添加到\
    \ `exceptionHandling.php` 的末尾（即在 `echo '<BR>After connecting';` 语句之后）：\n\n```php\n\
    function displayUserInput($userInput){\n    if ($userInput > 100){\n        throw\
    \ new OutOfRangeException('<BR>User input is too big');\n    }else{\n        echo\
    \ '<BR>'.$userInput;\n    }\n}\n```\n\n在这里，我们定义了一个名为 `displayUserInput()` 的函数，它有一个参数\
    \ `$userInput`。如果 `$userInput` 大于 100，我们使用 `throw` 关键字抛出一个 `OutOfRangeException`\
    \ 异常。`OutOfRangeException` 是 PHP 中一个继承自 `Exception` 的预定义类。在我们的 `catch` 块内部，我们使用\
    \ `$e` 调用内置的 `getMessage()` 方法，并使用 `echo` 语句输出错误消息。\n\n如果我们运行上面的代码，将得到以下输出：\n\
    `Unable to connect SQLSTATE[HY000] [1045] Access denied for user 'wrongadmin'@'localhost'\
    \ (using password: YES) The finally block is always executed After connecting`\n\
    \n第一行输出来自 `catch(PDOException $e)` 块。由于 PHP 无法连接到 `connect.php` 中的数据库，它抛出了一个 PDO\
    \ 异常。第二行来自 `finally` 块。无论 `try` 块中的代码成功还是失败，该块都会执行。最后，最后一行来自 `try-catch-finally`\
    \ 块之后的 `echo` 语句。这一行说明了当异常发生并被成功捕获时，脚本将继续执行。很直接吧？很好！\n\n在这里，我们定义了一个名为 `displayUserInput()`\
    \ 的函数，它有一个参数 `$userInput`。如果 `$userInput` 大于 100，我们使用 `throw` 关键字抛出一个 `OutOfRangeException`\
    \ 异常。`OutOfRangeException` 是 PHP 中一个继承自 `Exception` 的预定义类。抛出 `OutOfRangeException`\
    \ 异常涉及创建一个新对象。为了创建 `OutOfRangeException` 异常，我们可以传递字符串 `'<BR>User input is too\
    \ big'`。\n\n如果我们使用下面的 `try-catch` 块调用 `displayUserInput()`：\n\n```php\ntry {\n\
    \    displayUserInput(105);\n}catch (OutOfRangeException $e) {\n    echo $e->getMessage();\n\
    }\n```\n\n`OutOfRangeException` 异常将在 `try` 块中抛出，因为 `$userInput` 大于 100。它被 `catch`\
    \ 块捕获。在 `catch` 块内部，我们使用 `getMessage()` 方法获取错误消息。如果我们运行上面的代码，将得到：\n`User input\
    \ is too big`\n\n如果我们将其改为 `displayUserInput(16);` 则不会抛出异常，我们将得到 `16`。明白了吗？太棒了！\n\
    \n### 12.1.4 异常处理器\n\n在之前的章节中，我们学习了抛出和捕获异常。某些异常（如 PDO 异常）很容易处理，而其他的可能很难。在大多数情况下，尽管我们尽了努力，仍然会有无法预料的异常。在这种情况下，PHP\
    \ 允许我们指定一个自定义异常处理器，当发生无法捕获的异常时调用。我们可以使用此自定义处理器向用户显示自定义消息。然而，异常处理器被调用后，PHP 脚本将终止。为了查看异常处理器的工作原理，将以下代码添加到\
    \ `exceptionHandling.php` 的末尾：\n\n```php\nfunction myExceptionHandler($e) {\n\
    \    echo '<BR>Oppsss... An uncaught exception occurred.<BR>'.$e->getMessage();\n\
    }\nset_exception_handler('myExceptionHandler');\n```\n\n在这里，我们定义了一个名为 `myExceptionHandler()`\
    \ 的函数作为异常处理器。为了符合，该函数需要一个参数来存储未捕获的异常对象。在我们的示例中，该参数是 `$e`。在函数内部，我们使用 `$e` 调用 `getMessage()`\
    \ 方法，并使用 `echo` 语句输出消息。在编写完函数后，我们需要使用一个内置函数 `set_exception_handler()` 将 `myExceptionHandler()`\
    \ 设置为异常处理器。为此，我们编写了 `set_exception_handler('myExceptionHandler');`。为了测试我们的异常处理器，将以下行添加到\
    \ `exceptionHandling.php` 的末尾：\n\n```php\n$pdo = new PDO(\"some invalid database\"\
    );\necho 'This will not be executed';\n```\n\n在这里，我们尝试使用无效的参数创建一个 PDO 对象。这导致了一个\
    \ PDO 异常，该异常没有被任何 `catch` 块捕获。如果你运行上面的代码，将得到：\n`Oppsss... An uncaught exception\
    \ occurred.invalid data source name added to the output.`\n异常处理器（`myExceptionHandler`）成功处理了该异常。然而，注意到\
    \ PDO 实例化语句之后的 `echo` 语句没有执行？这是因为在异常处理器被调用后，PHP 脚本终止了。明白了吗？2. 处理错误\n\n"
