    to `chap9.php` and load the page again. What do you get? You get `Fatal error:
    Uncaught Error: Cannot access private property Movie::$id...` added to the output,
    right? This is because `$id` is a private property. A private class members can
    only be assessed within the class in which they are declared, we are not allowed
    to access the `$id` property in `chap9.php` , which is outside the `Movie` class.
    This is the gist of how access modifiers work; they basically control whether
    we can access a particular class member outside the class in which it is declared.
    Got it?


    In PHP, access modifiers are mandatory for properties but optional for methods.
    If we fail to declare the modifier for a property, we’ll get an error message.
    If we do not declare the modifier for methods, the default modifier is `public`.
    As of PHP `7.1.0`, we can also add access modifiers for class constants. If we
    do not declare the modifier for constants, the default is `public`. Besides `public`
    and `private` members, PHP also has `protected` members. These members can be
    accessed inside the class in which they are declared and any subclass that inherits
    from that class. We’ll discuss `protected` members and inheritance in the next
    chapter.


    At this point, some of you may be wondering why we want class members to be `private`.
    For instance, why bother declaring the `$id` property if we cannot access it?
    The reason is that while private members cannot be accessed outside the class
    in which they are declared, they can be accessed inside it. For instance, we can
    write a function inside the `Movie` class to display the page heading based on
    the `$id` property. To see how that works, add the code below to `Movie.php` (after
    the `conversion()` method but before the closing brace of the `Movie` class):


    ```php

    public function displayHeading($tag){ if (substr($this->id, 0, 1) == ''N'') return
    "<$tag>Movies</$tag>"; else return "<$tag>Award Winning Movies</$tag>"; }

    ``` This method checks if `$id` starts with ''N'' using the built-in `substr()`
    function. If it does, it returns an HTML element (as defined by the parameter
    `$tag` ) with the word “Movies” enclosed. Else, it returns an element with the
    words “Award Winning Movies” enclosed. Next, replace the line `echo $mov1->id.''<BR>'';`
    in `chap9.php` with `echo $mov1->displayHeading(''H1'');`. As `displayHeading()`
    is a `public` method, we have no problems accessing it outside the class. If you
    run the code now, you’ll get “Movies” displayed as an `<h1>` element. Got it?


    ## 9.6 Getter and Setter


    In the previous section, we talked about the difference between `public` and `private`
    class members. Whenever possible, we should declare class members as `private`
    if code outside the class does not need to access them. This act of preventing
    code outside from accessing class members unnecessarily is known as encapsulation.
    Encapsulation makes it easy for us to make changes to class members without affecting
    code outside the class. For instance, if we want to change the name of the `$id`
    property in our `Movie` class to `$movieID`, we only need to make changes within
    the `Movie` class, any code outside the class is not affected. This is one of
    the advantages of declaring a class property as `private`.


    Another advantage of declaring class properties as `private` is that it helps
    prevent unauthorized modifications to our object properties. To see why this is
    so, add the following code to `chap9.php`:


    ```php

    $mov1->rentalPrice = -20;

    echo $mov1->rentalPrice.''<BR>'';

    ``` Here, we first assign `-20` to the `$rentalPrice` property of `$mov1`. Next,
    we use an `echo` statement to echo its value. If you run the code above, you’ll
    get -20 as the output. As you can see, we manage to change the `$rentalPrice`
    property of `$mov1` to `-20`. This is because `$rentalPrice` is a `public` property.
    Hence, we can access it outside the `Movie` class and change it to any value we
    like. This is definitely not desirable as rental price should not be negative.


    To prevent such modifications from happening, we should not declare the `$rentalPrice`
    property as `public`. Instead, we should declare it as `private`. Try changing
    the `$rentalPrice` property to `private` in `Movie.php` and run `chap9.php` again,
    what do you get? You get something similar to the output below, right?


    `Fatal error: Uncaught Error: Cannot access private property Movie::$rentalPrice
    in…`


    We are no longer allowed to access and modify the `$rentalPrice` property of `$mov1`
    as it is now a `private` property.


    Whenever possible, we should always declare our class properties as `private`;
    this helps to prevent any unauthorized access or modifications to them. However,
    if we declare all our class properties as `private`, what happens if code outside
    the class needs to access or modify those properties? In cases like these, we
    can use getters and setters. These are magic methods that allow us to provide
    limited and controlled access to our `private` and `protected` properties. To
    see how this works, add the following methods to `Movie.php` (after the `displayHeading()`
    method but before the closing brace of the `Movie` class):


    ```php

    public function get($propertyRequested){ if ($propertyRequested == ''id'') return
    ''You do not have permission to access id.<BR>''; else return $this->$propertyRequested;
    }

    public function set($propertyToModify, $value){ if ($propertyToModify == ''rentalPrice''
    && $value > $this->rentalPrice) $this->rentalPrice = $value; else echo ''Failed
    to modify ''.$propertyToModify.''<BR>''; }

    ```


    The first method (`get()`) is known as a getter; it controls which property can
    be accessed outside the class and has one parameter called `$propertyRequested`.
    This parameter stores the name of the property we want to access. Within the `get()`
    method, we use an `if-else` statement to check if `$propertyRequested` equals
    `''id''`. If it equals, the `get()` method returns a string informing us we do
    not have permission to access `id`. Else, it returns the property requested. For
    instance, if `$propertyRequested` equals `''rentalPrice''`, it returns `$this->rentalPrice`.


    Next, we have the `set()` method, which is known as a setter. This method controls
    which property can be modified. It has two parameters; the first stores the name
    of the property we want to modify (`$propertyToModify`), and the second stores
    the new value (`$value`) to assign to this property. Within our `set()` method,
    we use an `if-else` statement to check if `$propertyToModify` equals `''rentalPrice''`
    and if `$value` is greater than the current `$rentalPrice`. If both conditions
    are met, it allows us to modify the `$rentalPrice` property. Else, it echoes a
    string informing us it is unable to modify the property. Got it? Good! Now, let’s
    look at how we can use the `get()` and `set()` methods. To do that, we simply
    use the `->` operator, followed by the property name. Behind the scene, as long
    as we have defined our `get()` and `set()` methods, PHP will call these magic
    methods automatically.


    First, let’s change the access modifiers of all the properties in our `Movie`
    class to `private`. Next, load `chap9.php` again. Recall that previously, we tried
    to change the `$rentalPrice` property of `$mov1` to `-20` and got a fatal error?
    If you load `chap9.php` now, you’ll no longer get an error. Instead, you’ll get
    the following output:


    `Failed to modify rentalPrice`

    `4.99`


    This is because we have defined our `get()` and `set()` methods. When we try to
    modify the value of the `$rentalPrice` property, PHP calls the `set()` method
    for us automatically. As `-20` is smaller than the current `$rentalPrice` value
    (which is `4.99`), our `set()` method prevented us from changing the `$rentalPrice`
    value. When we use an `echo` statement to echo the `$rentalPrice` value, the `get()`
    method gives us `4.99` as the output.


    Next, add the following code to `chap9.php` and run the page again:


    ```php

    $mov1->id = ''A12387'';

    echo $mov1->id;

    ```

    You’ll get


    `Failed to modify id`

