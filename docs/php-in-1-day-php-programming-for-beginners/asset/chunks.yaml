    \ 文件夹，你必须相应地修改分配给 `INC_DIR` 的路径。例如，如果你将文件夹重命名为 `myproject`，则你必须将 `$_SERVER[\"\
    DOCUMENT_ROOT\"] . \"/myproject/includes/\"` 赋值给 `INC_DIR`。接下来，我们有两个 `include`\
    \ 语句用于包含 `loadclasses.php` 和 `debugging.php`。如之前提到的，我们使用 `loadclasses.php` 来自动加载类，并使用\
    \ `debugging.php` 处理所有的错误和异常。稍后，我们必须在大多数用户界面文件中包含这两个文件。此时，`UI_include.php` 文件已编写完成，我们准备好处理用户界面文件。\n\
    \n### 13.8.2 用户界面文件\n\n第一个是 `error.html` 文件。该文件包含 HTML 代码，用于在网站发生错误或异常时向用户显示自定义消息。它已经为你准备好了。接下来，我们有五个非常相似的文件：`admin.php`、`write.php`、`index.php`、`signup.php`\
    \ 和 `read.php`。\n\n每个文件中，我们需要添加 PHP 代码来实现以下操作：启动新会话（session）并包含 `UI_include.php`\
    \ 和 `header.html` 文件。此外，每个文件都包含一个由文件本身处理的 HTML 表单。为了处理表单，我们需要使用 `include` 语句将相关的处理文件添加到用户界面文件中。例如，为了处理\
    \ `admin.php` 中的表单，我们需要包含 `p-admin.php` 文件。上述操作已在 `admin.php` 中为你完成。参考 `admin.php`\
    \ 中的代码，尝试对 `write.php`、`index.php`、`signup.php` 和 `read.php` 执行相同的操作。在每种情况下，请注意必须在包含另外两个文件之前包含\
    \ `UI_include.php` 文件（因为我们需要在使用之前定义 `INC_DIR`）。此外，你需要相应地更改处理文件。明白吗？太好了！完成上述操作后，我们需要进行一些修改。对于\
    \ `signup.php`，不需要启动新会话，因为 `psignup.php` 没有使用任何会变量。因此，我们应该从 `signup.php` 中移除 `session_start()`语句。接下来，对于\
    \ `read.php`，由于 `p-read.php` 包含了显示输出的代码，我们不应该在文件开头包含它。相反，我们应该将其放在 `<body>...</body>`\
    \ 标签之间。最后，对于 `signup.php`、`admin.php`、`index.php` 和 `write.php`，我们需要将 HTML 代码中的文本“Error\
    \ Message Here”（不带引号）替换为存储在变量 `$msg` 中的实际错误消息。为了做到，我们使用下面的 PHP 代码：\n\n```php\n\
    <?php echo $msg; ?>\n```\n\n尝试自己完成上述所有修改。现在，我们还需要对 `index.php` 进行最后一次修改。如果你参考\
    \ `p-signup.php`，你会注意到在注册成功后引导用户进入 `index.php` 时我们添加了查询字符串 `new=1`，我们希望在 `index.php`\
    \ 中利用这个查询字符串。为了实现这一点，在 `index.php` 的 `<div class=\"form\">` 行之后添加以下代码：\n\n```html\n\
    <div class = \"new\">\n<?php if (isset($_GET['new'])) \necho 'CREATED SUCCESSFULLY';\
    \ ?>\n</div>\n```\n\n在这里，我们使用查询字符串在 `index.php` 中显示 `CREATED SUCCESSFULLY`。明白了吗？太好了！完成上述操作后，我们需要进行一些修改。对于最后一个用户界面文件\
    \ `logout.php`，由于 `logout.php` 的处理非常简单，我们需要在 `logout.php` 之前将 `index.php` 的逻辑完成。为了做到这一点，我们需要在\
    \ `logout.php` 中做几件事。首先，我们需要在会中恢复会话（使用 `session_start()`）并销毁所有会话（使用 `session_destroy()`）。接下来，我们需要包含\
    \ `UI_include.php` 和 `header.html` 文件。尝试自己完成上述操作。完成后，加载 `http://localhost/phpproject/logout.php`。在浏览器中，你会看到“Click\
    \ here to log in”。这不是错误。参考 `write.php` 并仔细研究代码，你会注意到我们在页面末尾添加了查询字符串 `admin=1`。这个查询字符串告诉我们退出的用户是管理员。如果是这样，我们希望在\
    \ `logout.php` 中显示第一个链接。相反，如果用户不是管理员（即没有查询字符串），我们希望显示第二个链接。尝试在 `logout.php` 中使用\
    \ `if-else` 语句来实现上述。你可以参考 `index.php` 获取有关使用查询字符串的帮助。完成后，`logout.php` 文件已完成。此时项目已几乎完成。事实上，如果你都完成得正确，可以加载\
    \ `http://localhost/phpproject/signup.php` 一切都会正常工作。尝试在第一个输入框中输入你的用户名并点击“提交”。你注意到什么？你会收到一条错误消息说“All\
    \ fields required”。注意到你在第一个输入框中输入的用户名消失了吗？我们项目的最后部分是在你的用户界面文件中添加 PHP 代码，以确保在处理表单出错时保持输入表单的值。还记得我们在\
    \ `Helper` 类中为此编写了一个名为 `keepValues()` 的方法吗？假设我们有一个名为 `$h` 的 `Helper` 对象，这里是使用该方法的方法：如果我们有一个名为\
    \ `tb` 的表单框，并将提交的 `tb` 值存储为 `$tb`，我们写入：\n\n```html\n<input type=\"text\" name=\"\
    tb\" <?php $h->keepValues($tb, 'textbox');?>\n```\n\n如果我们有一个名为 `ta` 的文本区域，并将提交的\
    \ `ta` 值存储为 `$ta`，我们写入：\n\n```html\n<textarea name = \"ta\"><?php $h->keepValues($ta,\
