    \ the statement(s) in the curly braces, the program returns to the third part\
    \ (`++$c`). This part modifies the value of the variable used for testing. In\
    \ our example, we increase the value of `$c` by 1 using the increment operator.\
    \ As a result, `$c` becomes 2. After the increment, the program tests if the new\
    \ value of `$c` is still smaller than 5. If it is, it executes the code in the\
    \ curly braces again. This process of testing and updating the value of `$c` is\
    \ repeated until the condition `$c < 5` is no longer true. At this point, the\
    \ program exits.\n\n### 6.3.5 Foreach Loop\n\nNext, let’s move on to the `foreach`\
    \ loop. This loop is similar to the `for` loop but is used to iterate over arrays.\
    \ There are two syntaxes:\n\n```\nforeach ($array as $value) {\n  //code\n}\n\n\
    foreach ($array as $key => $value) {\n  //code\n}\n```\nSuppose we have an associative\
    \ array:\n```\n$arr2 = array('Aaron'=>12, 'Ben'=>23, 'Carol'=>35);\n```\nUsing\
    \ the first `foreach` loop:\n```\nforeach ($arr2 as $name) { \n  echo $name.'\
    \ is isage.' years old.'; \n}\n```\nThis gives us Aaron is 12 years old, Ben is\
    \ 23 years old, Carol is 35 years old.\n\n### 6.3.6 While Loop\n\nThe `while`\
    \ loop executes a block of code repeatedly while a specific condition remains\
    \ true. The syntax is as follows:\n\n```\nwhile (condition is true) \n{ \n  //code\n\
    }\n```\n\nLet’s look at an example:\n```\n$d = 1;\nwhile ($d < 5) { \n  echo 'The\
    \ value of $d is '.$d.'<BR>'; \n  $d++; \n}\n```\nIn this example, we declare\
    \ a variable `$d` and assign 1 to it. The `while` loop checks if `$d < 5` is true.\
    \ If it is, it executes the statements inside the curly braces. In other words,\
    \ it executes the `echo` statement on line 5 and increments `$d` by 1 on line\
    \ 6. As a result, `$d` becomes 2. Next, the loop returns to line 3 to check if\
    \ `$d` is still smaller than 5. If it is, it executes the code in the curly braces\
    \ again. This process of checking and updating the value of `$d` continues until\
    \ `$d < 5` is no longer true.\n\n### 6.3.7 Do-while Loop\n\nThe `do-while` loop\
    \ is very similar to the `while` loop except that the test condition is placed\
    \ at the end of the loop. This means that the code within the curly braces of\
    \ the loop will always be executed at least once. The syntax is:\n\n```\ndo {\n\
    \  //some tasks\n} while (condition is true);\n```\nNote that a semicolon ( `;`\
    \ ) is required after the test condition.\n"
