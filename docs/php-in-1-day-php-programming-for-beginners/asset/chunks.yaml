    \ to the output.  \n\nChapter 10: Inheritance In the previous chapter, we covered\
    \ the fundamentals of OOP. Some of the concepts in OOP can be confusing for beginners.\
    \ If this is the first time you are exposed to OOP, you may want to read through\
    \ the previous chapter more than once to fully grasp the concepts. Once you are\
    \ comfortable with the topics covered in Chapter 9, we are ready to proceed to\
    \ a more advanced, but equally important, concept in OOP - inheritance. As the\
    \ name suggests, inheritance has to do with the relationship between two or more\
    \ classes. With inheritance, classes can be declared such that one class is a\
    \ child class (also known as a subclass) of another (known as the parent class\
    \ or base class). This enables us to group related classes together. The easiest\
    \ way to explain inheritance is to look at an example.  \n\n10.1 Writing the Child\
    \ Classes We’ll use the Movie class in Chapter 9 as a parent class to illustrate.\
    \ Open Brackets and create a new file called  \n\nAwardWinningMovie.php . Save\
    \ this file to your htdocs folder. Add the following code to AwardWinningMovie.php\
    \ :  \n\n<?php  \n\ninclude \"Movie.php\";  \n\nclass AwardWinningMovie extends\
    \ Movie{ private $award;  \n\npublic function construct($pId, $pTitle, $pRentalPrice,\
    \ $pAward){  \n\nparent:: construct($pId, $pTitle,  \n\n$pRentalPrice);  \n\n\
    $this->award = $pAward;  \n\n} } In the code above, we first use the include statement\
    \ to include the code for the Movie class. Next, we create a class called AwardWinningMovie\
    \ . Notice a new keyword extends in theAwardWinningMovie class declaration? This\
    \ keyword indicates thatAwardWinningMovie is a child class ofMovie . When one\
    \ class is a child class of another, it inherits all the public andprotected members\
    \ of the parent class. In other words, it can access and use those members directly,\
    \ as if they are part of its own code.We’ll illustrate what this means later.\
    \ Within the AwardWinningMovie class, we declare a private property called $award\
    \ . Next, we declare a constructor with 4 parameters,$pId , $pTitle , $pRentalPrice\
    \ and $pAward . Within the constructor, notice a new keyword,parent ? As you may\
    \ have guessed, this keyword is used to call the parent class constructor. As\
    \ the child class has its own constructor, we need to use the parent keyword and\
    \ the :: operator when we want to access the parent class constructor. When we\
    \ call the parent class constructor, we do not create a new object. Instead, we\
    \ use the name of the constructor ( construct() ). In our example, we pass the\
    \ values of $pId , $pTitle and $pRentalPrice as arguments to the parent class\
    \ constructor. These values will be used to initialize the $id , $title and $rentalPrice\
    \ properties declared in the parent class respectively. As these properties were\
    \ declared as private in the parent class, we are not allowed to access them directly\
    \ in the child class. Instead, we can only initialize them using the parent class\
    \ constructor, which is a public method. Next, we have the statement  \n\n$this->award\
    \ = $pAward;  \n\nThis statement is used to initialize the $award property declared\
    \ in the child class.  \n\nWith that, the child class constructor is complete.\
    \ Now, let’s add another method to the child class. Add the code below to the\
    \ AwardWinningMovie class, after the construct() method but before the closing\
    \ brace of the class: public function recommend($country){ switch ($this->award){\
    \  \n\ncase 'Best Picture':  \n\n$others = 'The Rail';  \n\nbreak; case 'Best\
    \ Actor':  \n\n$others = '1729';  \n\nbreak; default:  \n\n$others = 'And so it\
    \ begins';  \n\n} return  \n\n'You might also like:<BR>'.  \n\n'<BR>Movie Title\
    \ = '.$others.  \n\n'<BR>Rental Price = '.$this  \n\n\\>conversion($country);\
    \  \n\n} Here, we declare a method called recommend() that has one parameter $country\
    \ . Within the method, we use a switch statement to assign different values to\
    \ the local variable$others , depending on the value of$this->award . Next, we\
    \ return a string recommending a new movie to users. This string should be quite\
    \ self-explanatory, except for the last part where we use the$this keyword to\
    \ call the conversion() method (refer to the underlined code above) .  \n\nRecall\
    \ that we do not have a conversion() method in the AwardWinningMovie class? Will\
    \ we get an error when we try to call this method? The answer is no. This is because\
    \ the AwardWinningMovie class is a subclass of the Movie class. Hence, it can\
    \ access all the public and protected members of the parent class directly, as\
    \ if they are part of its own code. As the parent class Movie - has a public method\
    \ called conversion() , the child class can access this method simply by using\
    \ the $this keyword. Got it? This is one of the main reasons for using inheritance;\
    \ it allows us to reuse existing code. In our example, the AwardWinningMovie class\
    \ can use the conversion() method directly without having to code it itself. 10.2\
    \ Creating a Child Class Object  \n\nWe are now ready to create a child class\
    \ object. To do that, create a new file in Brackets and save it as chap10.php\
    \ to the htdocs folder. Add the following code to it: <?php  \n\ninclude 'AwardWinningMovie.php';\
    \  \n\n$awm = new AwardWinningMovie('A12324', 'Max', 6.99, 'Best Picture');  \n\
    \necho $awm->recommend('Japan'); Here, we first use the include statement to include\
    \ the AwardWinningMovie class. Next, we use the new keyword to create an AwardWinningMovie\
    \ object, passing'A12324' ,'Max' ,6.99 and 'Best Picture' as arguments to the\
    \ constructor. Finally, after creating the $awm object, we use it to call the\
    \ recommend() method. If you run the code above, you’ll get  \n\nYou might also\
    \ like:  \n\nMovie Title = The Rail  \n\nRental Price = 768.9  "
