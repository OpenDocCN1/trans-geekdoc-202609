    \ to use the `queryDB()` method to execute the following SQL statement:\n\n```sql\n\
    SELECT password FROM members WHERE username = :username\n```\n\nTo do that, you\
    \ need to bind the `$username` property to `:username` and use the `Database::SELECTSINGLE`\
    \ mode (as we are only selecting one row from the database) to call the `queryDB()`\
    \ method. Once that is done, assign the result to a variable called `$result`.\
    \ Try doing this yourself.\n\nNext, we need to check if `$result['password']`\
    \ is set. `$result['password']` is set only if the `fetch()` method in `queryDB()`\
    \ manages to fetch the password. If there is no user with the username stated\
    \ in the SQL query, `$result['password']` will not be set. Besides checking if\
    \ `$result['password']` is set, we also need to check if the password entered\
    \ by the user matches the password fetched from the database. To determine if\
    \ the passwords match, we use the built-in function `password_verify()`, which\
    \ accepts two arguments.\n\n```php\nif (isset($result['password']) && password_verify($pPassword,\
    \ $result['password'])) {\n    return true;\n} else {\n    return false;\n}\n\
    ```\n\nAdd the statement above to the `isValidLogin()` method and the method is\
    \ complete.\n\n### getLatestPostID()\n\nGreat! Let’s proceed to the `getLatestPostID()`\
    \ method. This is a private method with no parameters and will be used in the\
    \ `updateLastViewedPost()` method later. Try it yourself. Inside the method, we\
    \ need to use the `queryDB()` method to execute the following SQL statement:\n\
    \n```sql\nSELECT max(id) AS max FROM posts\n```\n\nDecide on the appropriate mode\
    \ to use for this SQL statement. Note that the statement does not contain any\
    \ placeholder. Once you have executed the `queryDB()` method, assign the result\
    \ to a variable called `$result`. The SQL statement returns `NULL` if there is\
    \ no post in the `posts` table. Hence, we need to first check if `$result['max']`\
    \ is set. If it is, return its value. Else, return `0`.\n\n### updateLastViewedPost()\n\
    \nThe `updateLastViewedPost()` method is public and has no parameters. Try it\
    \ yourself. Inside the method, we need to update the `last_viewed` column of the\
    \ `members` table to reflect the latest post viewed by a member. Whenever a member\
    \ logs into our website, the `last_viewed` value of that member will be updated\
    \ to the id of the latest post in the `posts` table. This id is given by the `getLatestPostID()`\
    \ method. To use this method, add the following line to the `updateLastViewedPost()`\
    \ method:\n\n```php\n$max = $this->getLatestPostID();\n```\n\nHere, we use the\
    \ `$this` keyword to call the `getLatestPostID()` method and assign its result\
    \ to `$max`. Next, we need to use the `queryDB()` method to execute the following\
    \ SQL statement:\n\n```sql\nUPDATE members SET last_viewed = :max WHERE username\
    \ = :username\n```\n\nTo execute this statement, we need to bind the `$username`\
    \ property to `:username` and the variable `$max` to `:max`. In addition, we need\
    \ to decide on the appropriate mode to use when calling `queryDB()`. Try doing\
    \ this yourself.\n\n### getLastViewedPost()\n\nFinally, we move on to the `getLastViewedPost()`\
    \ method. This method is public and has no parameters. It uses the `queryDB()`\
    \ method to execute the following SQL statement:\n\n```sql\nSELECT last_viewed\
    \ FROM members WHERE username = :username\n```\n\nTo execute this statement, we\
    \ need to bind the `$username` property to `:username` and decide on the appropriate\
    \ mode to use when calling the `queryDB()` method. Try doing this yourself and\
    \ assign the result to a variable called `$result`. Next, we need to check if\
    \ `$result['last_viewed']` is set. If there is no user with the username stated\
    \ in the SQL query, `$result['last_viewed']` will not be set. If `$result['last_viewed']`\
    \ is set, we return its value. Else, we return `0`.\n"
  trans: "\n\n```php\nprivate function getLatestPostID()\n\npublic function updateLastViewedPost()\n\
    \npublic function getLastViewedPost()\n```\n\n### isDuplicateID()\n\n让我们从 `isDuplicateID()`\
    \ 方法开始。这个方法是公共的且没有参数。它每当新用户注册时都会被调用，如果新用户选择的用户名已存在于 `members` 表中，则返回 `true`。尝试自己声明这个方法。在方法内部，我们需要执行以下\
    \ SQL 语句：\n\n```sql\nSELECT count(username) AS num FROM members WHERE username\
    \ = :username\n```\n\n如果找不到绑定到 `:username` 的用户名，该语句将返回 `0`。尝试使用 `Database` 类中的\
    \ `queryDB()` 方法来执行此 SQL 语句。你需要将 `$username` 属性绑定到 `:username`，并使用 `Database::SELECTSINGLE`\
    \ 模式（因为我们只从数据库中选择一行）来调用 `queryDB()` 方法。尝试自己实现这一点。你可以参考 `BlogReader` 类中的 `getPostsFromDB()`\
    \ 方法来获取如何使用 `queryDB()` 方法的参考。明白了吗？完成后，将 `queryDB()` 返回的结果赋值给变量 `$result`。\n\n\
    接下来，使用 `if` 语句检查 `$result['num']` 是否等于零。如果是，返回 `false`。否则，返回 `true`。\n\n尝试自己编写这个方法。\n\
    \n### insertIntoMemberDB()\n\n一旦完成了 `isDuplicateID()` 方法，我们可以继续 `insertIntoMemberDB()`\
    \ 方法。这个方法是公共的并有一个参数 `$pPassword`。它用于在新用户注册时向 `members` 表插入新行。`$pPassword` 存储用户在提交注册表单时输入的密码。在方法内部，我们需要使用\
    \ `Database::EXECUTE` 模式的 `queryDB()` 方法（因为我们没有从数据库获取任何数据）来执行以下 SQL 语句：\n\n```sql\n\
    INSERT INTO members (username, password) VALUES (:username, :password)\n```\n\n\
    为了执行此语句，我们需要将 `$username`（类属性）绑定到 `:username`，并将 `$pPassword`（参数）绑定到 `:password`。但是，由于\
    \ `$pPassword` 存储的是用户选择的密码，我们不应该以原始形式将其存储在数据库中。相反，我们应该先进行哈希处理。哈希类似于加密，可以使用 PHP\
    \ 内置函数 `password_hash()` 完成。该函数适用于 PHP 5.5 及更高版本，接受两个参数——要哈希的字符串和要使用的算法。使用的算法可以是位于\
    \ `https://www.php.net/manual/en/password.constants.php` 找到的任何预定义常量之一。在我们的项目中，我们将使用\
    \ `PASSWORD_DEFAULT` 作为常量。该常量表示我们将使用 PHP 的默认算法。对 `$pPassword` 进行哈希，我们使用下面的代码：\n\
    \n```php\npassword_hash($pPassword, PASSWORD_DEFAULT)\n```\n\n因此，为了将值绑定到 SQL 语句中的\
    \ `:username` 和 `:password` 占位符，我们使用下面的 `$values` 数组：\n\n```php\n$values = array(\n\
    \  array(':username', $this->username),\n  array(':password', password_hash($pPassword,\
    \ PASSWORD_DEFAULT))\n);\n```\n\n尝试使用此数组、`Database::EXECUTE` 常量和上述 SQL `INSERT`\
    \ 语句调用 `queryDB()` 方法。完成后，`insertIntoMemberDB()` 方法就完成了。此方法不需要返回任何结果，因为当模式为 `Database::EXECUTE`\
    \ 时，`queryDB()` 方法不会返回任何结果。\n\n### isValidLogin()\n\n完成了吗？太极了！让我们进入 `isValidLogin()`\
    \ 方法。这个方法是公共的并有一个参数 `$pPassword`。它检查用户在尝试登录时输入的用户名和密码是否有效。在方法内部，我们需要使用 `queryDB()`\
    \ 方法执行以下 SQL 语句：\n\n```sql\nSELECT password FROM members WHERE username = :username\n\
    ```\n\n为了做到这一点，你需要将 `$username` 属性绑定到 `:username`，并使用 `Database::SELECTSINGLE`\
    \ 模式（因为我们只从数据库中选择一行）来调用 `queryDB()` 方法。完成后，将结果赋值给变量 `$result`。尝试自己实现这一点。\n\n接下来，我们需要检查\
    \ `$result['password']` 是否被设置。只有当 `queryDB()` 中的 `fetch()` 方法成功获取到密码时，`$result['password']`\
    \ 才会被设置。如果 SQL 查询中不存在所述用户名的用户，`$result['password']` 将不会被设置。除了检查 `$result['password']`\
    \ 是否被设置外，我们还需要检查用户输入的密码是否与从数据库获取的密码匹配。为了判断密码是否匹配，我们使用内置函数 `password_verify()`，它接受两个参数。\n\
    \n```php\nif (isset($result['password']) && password_verify($pPassword, $result['password']))\
    \ {\n    return true;\n} else {\n    return false;\n}\n```\n\n将上述语句添加到 `isValidLogin()`\
    \ 方法中，该方法就完成了。\n\n### getLatestPostID()\n\n太棒了！让我们继续 `getLatestPostID()` 方法。这是一个私有方法，没有参数，将在稍后的\
    \ `updateLastViewedPost()` 方法中使用。尝试自己实现。在方法内部，我们需要使用 `queryDB()` 方法执行以下 SQL 语句：\n\
    \n```sql\nSELECT max(id) AS max FROM posts\n```\n\n决定用于此 SQL 语句的模式。注意该语句不包含任何占位符。一旦执行了\
    \ `queryDB()` 方法，将结果赋值给变量 `$result`。如果 `posts` 表中没有数据，该语句将返回 `NULL`。因此，我们首先检查\
    \ `$result['max']` 是否被设置。如果是，返回其值。否则，返回 `0`。\n\n### updateLastViewedPost()\n\n\
    `updateLastViewedPost()` 方法是公共的且没有参数。尝试自己实现。在方法内部，我们需要更新 `members` 表的 `last_viewed`\
    \ 字段，以反映成员过的最新文章。每当成员登录网站时，该成员的 `last_viewed` 值将更新为 `posts` 表中最新文章的 ID。这个 ID 由\
    \ `getLatestPostID()` 方法提供。为了使用该方法，向 `updateLastViewedPost()` 方法添加此行：\n\n```php\n\
    $max = $this->getLatestPostID();\n```\n\n在这里，我们使用 `$this` 关键字调用 `getLatestPostID()`\
    \ 方法并将结果赋值给 `$max`。接下来，我们需要使用 `queryDB()` 方法执行以下 SQL 语句：\n\n```sql\nUPDATE members\
    \ SET last_viewed = :max WHERE username = :username\n```\n\n为了执行此语句，我们需要将 `$username`\
    \ 属性绑定到 `:username`并将变量 `$max` 绑定到 `:max`。此外，我们需要决定调用 `queryDB()` 时使用的模式。尝试自己实现这一点。\n\
    \n### getLastViewedPost()\n\n最后，我们进入 `getLastViewedPost()` 方法。这个方法是公共的且没有参数。它使用\
    \ `queryDB()` 方法执行以下 SQL 语句：\n\n```sql\nSELECT last_viewed FROM members WHERE\
    \ username = :username\n```\n\n为了执行此语句，我们需要将 `$username` 属性绑定到 `:username` 并决定调用\
    \ `queryDB()` 方法时使用的模式。尝试自己实现这一点并将结果赋值给变量 `$result`。接下来，我们需要检查 `$result['last_viewed']`\
    \ 是否被设置。如果 SQL 查询中不存在所述用户名的用户，`$result['last_viewed']` 将不会被设置。如果 `$result['last_viewed']`\
    \ 被设置，我们返回其值。否则，返回 `0`。\n\n"
