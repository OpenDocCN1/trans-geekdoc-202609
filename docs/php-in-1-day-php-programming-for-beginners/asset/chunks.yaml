    \ notice that we added ?> to the end of line 2 in the second loop? This?> tag\
    \ closes the <?php opening tag on line 1. When that happens, any code after line\
    \ 2 in the second loop is no longer interpreted as PHP code. Instead, it is interpreted\
    \ as HTML code. This explains why we do not need to use an echo statement to output<h1>Hello</h1>\
    \ on line 3. Next, on line 4, we open the PHP tag again. When PHP sees this opening\
    \ tag, it knows that what follows is PHP code. When it encounters the endfor;\
    \ statement, it realizes that this is a for loop and searches for the condition\
    \ to evaluate. When it finds it on line 2, it increments$i by1 and runs line 3\
    \ again. This keeps repeating until the condition $i < 3 is no longer valid. Got\
    \ it? If you run the loops above, you’ll get “Hello” displayed as a<h1> heading\
    \ three times in both cases. Study the two loops carefully to appreciate how this\
    \ technique works. It can be a bit confusing in the beginning. The main idea is\
    \ to close the PHP tag before switching to HTML code and open it again after the\
    \ HTML code. This makes it much more convenient to insert HTML code without having\
    \ to use echo statements. Chapter 7: Functions  \n\nIn this chapter, let’s move\
    \ on to talk about functions. We have already encountered functions in previous\
    \ chapters. For instance, in Chapter 5, we learned to use various PHP functions\
    \ to work with strings and arrays. In this chapter, we’ll learn to define our\
    \ own functions. 7.1 Defining our own Functions  \n\nTo define our own functions,\
    \ we use the syntax below: function functionName(list of parameters) { //code\
    \ to be executed;  \n\n//return statements, if any }  \n\nAll function declarations\
    \ must start with the function keyword. Next, we have the function name. Function\
    \ names in PHP are not case-sensitive and can contain letters, numbers, or underscores.\
    \ However, they must start with a letter or an underscore. Similar to variable\
    \ names, we commonly use camelCase or underscores when naming functions. In this\
    \ book, we’ll use camelCase. After the function name, we enclose the list of parameters\
    \ (if any) that the function needs in a pair of parentheses. Parameters are variables\
    \ used for storing values that we pass to the function; the values that we pass\
    \ are known as arguments. After declaring the function, we use curly braces to\
    \ enclose the code that we want the function to perform. If the function returns\
    \ a result, we use the return keyword. Got it? Let’s look at some examples.  \n\
    \nExample 1  \n\nfunction displayGreetings(){ echo 'Hello';  \n\n} Here, we declare\
    \ a function called displayGreetings() that has no parameters (as indicated by\
    \ the pair of empty parentheses after the function name). This function simply\
    \ echoes the word “Hello”. To call the function, we use its name followed by a\
    \ pair of parentheses: displayGreetings();  \n\nThis gives us  \n\nHello  \n\n\
    as the output.  \n\nExample 2 function displayGreetings2($name, $message){ echo\
    \ \"Hello $name, $message\";  \n\n} Here, we declare a function called displayGreetings2()\
    \ that has two parameters $name and $message . If we call the function using the\
    \ following statement  \n\ndisplayGreetings2('Jamie', 'good morning'); the arguments\
    \ 'Jamie' and 'good morning' will be assigned to the parameters$name and$message\
    \ respectively. When we run the code above, we’ll get Hello Jamie, good morning\
    \  \n\nas the output.  \n\nExample 3 We can provide default values for parameter(s)\
    \ when we declare our functions.  \n\nfunction displayGreetings3($name, $message\
    \ = 'have a good day'){  \n\necho \"Hello $name, $message\";  \n\n} In the example\
    \ above, we declare 'have a good day' as the default value for the parameter $message\
    \ (refer to the underlined code). To call the function, we can use the statements\
    \ below: displayGreetings3('Jamie');  \n\necho '<BR>';  \n\ndisplayGreetings3('Jamie',\
    \ 'how are you?'); In the first function call, we omitted the second argument.\
    \ When we do that, the function uses the default value'have a good day' as the\
    \ value for$message . If we run the code above, we’ll get  \n\nHello Jamie, have\
    \ a good day  \n\nHello Jamie, how are you?  \n\nas the output. When we declare\
    \ functions with default values for parameters, note that parameters with default\
    \ values must come after parameters without default values. If we declare a function\
    \ as function redundantDefault($a = 1, $b){  \n\n//some code  \n\n} the default\
    \ value for $a will not work as it comes before $b (which does not have a default\
    \ value); we’ll still need to provide two arguments when calling the function.\
    \ Example 4  \n\nLast but not least, functions can return a result after they\
    \ complete their tasks. function addNumbers($num1, $num2, $num3){  \n\nreturn\
    \ $num1 + $num2 + $num3;  \n\necho 'Hello'; } The function above returns the sum\
    \ of $num1 , $num2 and $num3 using areturn statement. Once areturn statement is\
    \ executed, the function exits, and any statement after the return statement is\
    \ not executed. We can assign the result returned by the function to a variable\
    \ or use the echo statement to display the result directly.  \n\nIf we call the\
    \ function above using the following statement: echo addNumbers(9, 6, 1); we’ll\
    \ get  \n\n16  \n\nas the output. The statement  \n\necho 'Hello';  \n\nis not\
    \ executed as it comes after the return statement. 7.2 Type Declaration The examples\
    \ in the previous section illustrate the main points we need to know when defining\
    \ our own functions. Before we move on to the next chapter, I would like to discuss\
    \ type declaration (also known as type hinting) in this section. Type declaration\
    \ is a feature added to newer versions of PHP. This feature is optional but good\
    \ to implement if you are certain your code will only run on PHP 5 (preferably\
    \ PHP 7) and above. First, what is type declaration? As mentioned previously,\
    \ PHP is a loosely typed language. In the examples above, when we declared the\
    \ parameters of our functions, we did not indicate their data types. If the arguments\
    \ that we pass to the function are of invalid data types, PHP will try its best\
    \ to execute the function. For instance, with reference to Example 4 in the previous\
    \ section, if we try to run the following statement echo addNumbers('9', '6',\
    \ '1');  \n\nwe won’t get any errors. Although we pass three strings to the addNumbers()\
    \ function, PHP converts them to integers for us automatically and executes the\
    \ function. Hence, we’ll get16 as the output. Such flexibility makes PHP a very\
    \ easy language to program in. However, depending on the requirements of the site\
    \ you are building, you may not want the function to run when the data type is\
    \ incorrect. In cases like that, you can use type declaration. Type declaration\
    \ allows us to state the data types of a function’s parameters when we declare\
    \ it. This feature is available from PHP 5 onwards. However, in PHP 5, type declaration\
    \ does not work for scalar data types. Scalar data types refer to data types that\
    \ store a single value, such asint , float , bool and string . Type declaration\
    \ only works for data types like arrays. To use type declaration with scalar data\
    \ types, we need PHP 7 and above. In addition, we need to add astrict\\_types\
    \ declaration to our script and setstrict\\_types to1 . To illustrate how this\
    \ works, let’s look at an example. This example works in PHP 7.  \n\nCreate a\
    \ new file in Brackets and name it typedec.php . Add the following code to it.\
    \  \n\n<?php  \n\ndeclare(strict\\_types=1);  \n\nfunction addNumbersStrict(int\
    \ $num1, int $num2, int $num3){  \n\nreturn $num1 + $num2 + $num3;  \n\n}  \n\n\
    echo addNumbersStrict('9', '6', '1');  "
