    However, suppose the user enters `Jamie'' OR owner != ''Jamie` into the text field
    instead, the `SELECT` statement becomes `SELECT * FROM pets WHERE owner = ''Jamie''
    OR owner != ''Jamie''`. When we use the `query()` method to execute this statement,
    PHP interprets the word “OR” in the user input as the SQL operator `OR`. Hence,
    it returns ALL rows from the “pets” table, since `owner = ''Jamie'' OR owner !=
    ''Jamie''` covers all possible values for the “owner” column. This is definitely
    not desirable.


    Instead of using the `query()` or `exec()` method to execute SQL statements, a
    better way is to use prepared statements.


    ## 11.4 Prepared Statements


    There are a few steps involved when using prepared statements:

    1. Create the SQL statement using placeholders

    2. Prepare the statement

    3. Bind variables or values to the placeholders

    4. Execute the statement

    5. Fetch any data returned if necessary


    ### Step 1: Creating the SQL statement using placeholders


    When using prepared statements, we need to use placeholders to replace any variables
    that contain user inputs in our SQL statements. These placeholders can either
    be named or unnamed. An unnamed placeholder is represented by a question mark
    `?`. For instance, if we want to select information from the “pets” table using
    user inputs for two columns named “owner” and “petname”, we can use the SQL statement
    below:


    ```php

    $sqlUnnamed = "SELECT * FROM pets WHERE owner = ? AND petname = ?";

    ```


    Here, we use question marks (`?`) to replace user inputs in our SQL statement
    and assign the statement to a variable called `$sqlUnnamed`. Alternatively, we
    can use named placeholders as shown below:


    ```php

    $sqlNamed = "SELECT * FROM pets WHERE owner = :owner AND petname = :pname";

    ```


    Here, we use `:owner` and `:pname` to replace user inputs and assign the statement
    to a variable called `$sqlNamed`.


    ### Step 2: Prepare the statement


    After creating the statement, we need to prepare it. Preparing a statement means
    sending the statement to the database server in advance, giving the server a chance
    to analyze, compile, and optimize its plan for execution. The actual execution
    does not happen at this step. To prepare the statements, we use the `prepare()`
    method. This is a built-in method in the `PDO` class that returns a `PDOStatement`
    object. Suppose we have a `PDO` object called `$pdo`, to prepare the `$sqlUnnamed`
    statement, we write:


    ```php

    $sqlUnnamed = $pdo->prepare($sqlUnnamed);

    ```


    Here, we use `$pdo` to call the `prepare()` method and assign the object returned
    to a variable `$sqlUnnamed`. To prepare the `$sqlNamed` statement, we write:


    ```php

    $sqlNamed = $pdo->prepare($sqlNamed);

    ```


    Here, we assign the object returned to a variable `$sqlNamed`. After preparing
    the statements, we won’t be using the `$pdo` object anymore. Instead, we’ll be
    using the `PDOStatement` objects (i.e., `$sqlUnnamed` and `$sqlNamed`) in subsequent
    steps.


    ### Step 3: Binding values to the placeholders


    In step 3, we need to bind values to the placeholders in our SQL statements. This
    tells the database server what values to replace the placeholders when executing
    the statements. We can use either `bindValue()` or `bindParam()` method to bind
    values to placeholders. Both methods are similar, but `bindValue()` tends to be
    more versatile. We’ll be using the `bindValue()` method in the examples that follow.


    To bind values to unnamed placeholders, we typically provide two pieces of information
    to the `bindValue()` method - the position of the placeholder and the value to
    bind. The positions of placeholders start from 1. Recall that we have a `SELECT`
    statement named `$sqlUnnamed` defined and prepared as follows:


    ```php

    $sqlUnnamed = "SELECT * FROM pets WHERE owner = ? AND petname = ?";

    $sqlUnnamed = $pdo->prepare($sqlUnnamed);

    ```


    Suppose we want to bind a user input called `$myPet` to the second question mark
    in `$sqlUnnamed`, this is how we can do it:


    ```php

    $sqlUnnamed->bindValue(2, $myPet);

    ```


    Here, we use `$sqlUnnamed` to call the `bindValue()` method. The first argument
    (`2`) indicates that we are binding a value to the second placeholder (i.e., the
    placeholder for the “petname” column) while the second argument (`$myPet`) indicates
    the value to bind. To bind values to named placeholders, we replace the first
    argument with the name of the placeholder, enclosed in quotation marks. For instance,
    if we want to bind `$myPet` to the `:pname` placeholder in `$sqlNamed`, we do
    it as follows:


    ```php

    $sqlNamed->bindValue('':pname'', $myPet);

    ```


    The first argument (`'':pname''`) indicates that we are binding a value to the
    `:pname` placeholder while the second argument (`$myPet`) indicates the value
    to bind.


    At this point, some of you may wonder if `$myPet` (which stores a user input)
    puts us at risk of an SQL injection attack. The answer is no. This is because
    `PDO` knows that we’re sending it the value for a placeholder; hence, it’ll not
    interpret any part of the string stored in `$myPet` as SQL code. For instance,
    even if `$myPet` stores the string

    '
