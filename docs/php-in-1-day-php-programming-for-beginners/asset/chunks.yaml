    \ we call the `execute()` method to execute the `INSERT` statement. After inserting\
    \ the data in Section C, we update a row (where owner = “Jamie” and petname =\
    \ “Max”) in Sections D and delete another (where owner = “Ted” and petname = “Angel”)\
    \ in Section E. These two sections should be quite self-explanatory. Read through\
