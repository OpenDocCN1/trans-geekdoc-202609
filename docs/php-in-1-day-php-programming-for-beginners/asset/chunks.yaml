    "second array" => array(3, 5, 1, 8, 9), "third array" => array(1, 0, 9, 4, 7)


    `$assocMDArr["first array"]` stores the `array(1, 2, 6, 1, 3)`. If we write


    ```php

    echo $assocMDArr["first array"][2];

    ```


    we’ll get the 3rd element in `$assocMDArr["first array"]`. In other words, we’ll
    get 6 as the output.


    ### Example 7

    Last but not least, we can use an associative array to store associative arrays.
    `$anotherAssocMDArr = array(

    "first player" => array("name" => ''John'', "age" => 25),

    "second player" => array("name" => ''Tim'', "age" => 35)

    ); In the example above, `$anotherAssocMDArr["first player"]` stores the `array("name"
    => ''John'', "age" => 25)`. If we write


    ```php

    echo $anotherAssocMDArr["first player"]["age"];

    ```


    we’ll get 25 as the output.


    ### 5.3.2 Displaying the Content of Arrays

    Next, let’s learn two convenient ways to display the content of arrays. One way
    is to use the `var_dump()` function covered in the previous chapter. This function
    displays the data type and value of a variable. If we write


    ```php

    $myArray = array(2, 5.1, ''PHP'', 105);

    var_dump($myArray);

    ```


    we’ll get


    ```

    array(4) { [0]=> int(2) [1]=> float(5.1) [2]=> string(3) "PHP" [3]=> int(105)
    }

    ```

    as the output.


    `array(4)` indicates that `$myArray` is an array with 4 elements. The text inside
    the pair of braces that follows indicates the data type and value of each element.
    For instance, `[0] => int(2)` tells us that the element at index 0 is an integer
    of value 2, `[1] => float(5.1)` tells us that the element at index 1 is a float
    of value 5.1 and so on. Next, we have the `print_r()` function. This function
    is similar to the `var_dump()` function. However, its output is more concise as
    it does not give us the data type of each element. For instance, `print_r($myArray);`


    gives us the following output:


    ```

    Array ( [0] => 2 [1] => 5.1 [2] => PHP [3] => 105 )

    ```


    ### 5.3.3 Adding Elements to Arrays

    After creating an array, we can add new elements to it. There are a few ways to
    do it. The easiest is to use the square bracket notation. This notation allows
    us to add one element at a time to an array.


    #### Example 1

    ```php

    $addDemo = array(1, 5, 3, 9);

    $addDemo[] = 7;

    ```


    In the example above, we add 7 to `$addDemo`. The array becomes `(1, 5, 3, 9,
    7)`.


    #### Example 2

    ```php

    $addDemoAssoc = array(''Peter''=>20, ''Jane''=>15);

    $addDemoAssoc[''James''] = 17;

    ```


    Here, we add `''James''=>17` to `$addDemoAssoc`. The array becomes `(''Peter''=>20,
    ''Jane''=>15, ''James''=>17)`.


    ### 5.3.4 Deleting Elements from Arrays

    Besides adding elements to arrays, we can delete elements from them. One way is
    to use the `array_splice()` function. To use this function, we need to pass two
    arguments to it - the array to remove elements from and the position to start
    removing them. We can also pass a third argument to specify the number of elements
    to remove. If we do not provide this argument, the function removes all elements
    from the specified starting position to the end of the array. Let’s look at some
    examples.


    #### Example 1

    ```php

    $colors = array("red", "black", "pink", "white");

    array_splice($colors, 2);

    ```

    Here, we indicate that we want `array_splice()` to remove all elements from `$colors`,
    starting from (and including) the element at position 2. `$colors` becomes `("red",
    "black")`.


    #### Example 2

    ```php

    $awardwinners = array("Gold"=>"Max", "Silver"=>"Boots", "Bronze"=>"Dora");

    array_splice($awardwinners, 1);

    ```

    Here, we want `array_splice()` to remove all elements from `$awardwinners`, starting
    from (and including) position 1. `$awardwinners` becomes `("Gold"=>"Max")`.


    #### Example 3

    ```php

    $pets = array("corgi", "poodle", "golden retriever", "jack russell");

    array_splice($pets, 1, 2);

    ```

    Here, we want to remove 2 elements from `$pets`, starting from (and including)
    position 1. `$pets` becomes `("corgi", "jack russell")`.


    ### 5.3.5 Commonly used Array Functions in PHP

    We’ve covered several array concepts in the previous sections. Before we end this
    chapter, let’s look at some commonly used array functions in PHP.


    #### count()

    The first is the `count()` function. This function accepts an array and returns
    the number of elements in the array.


    #### Example:

    ```php

    $countDemo = array(1, 4, 5, 1, 2);

    echo count($countDemo);

    ```

    Output:

    `5`


    #### array_search()

    Next, we have the `array_search()` function. This function searches for a particular
    value in an array. If the value is found, the function returns its corresponding
    index or key. Else, it returns `false`. If more than one instance of the value
    is found, the index or key of the first matching value is returned.


    #### Example:

    ```php

    $indexArrDemo = array(11, 4, 5, 1, 2, 5, 6);

    $assocArrDemo = array(''A''=>12, ''B''=>5, ''C''=>20);

    echo array_search(5, $indexArrDemo).''<BR>'';

    echo array_search(20, $assocArrDemo).''<BR>'';

    var_dump(array_search(''B'', $assocArrDemo));

    ```

    Output:

    `2`

    `C`

    `bool(false)`


    In the first echo statement above, we use the `array_search()` function to search
    for 5 in `$indexArrDemo`. Although there are two instances of 5, only the index
    of the first matching value is returned. In the second echo statement, we use
    `array_search()` to search for 20 in `$assocArrDemo`. We get `C`.


    #### print_r()

    The `print_r()` function is similar to the `var_dump()` function. However, its
    output is more concise as it does not give us the data type of each element. For
    instance, `print_r($myArray);`


    gives us the following output:


    ```

    Array ( [0] => 2 [1] => 5.1 [2] => PHP [3] => 105 )

    ```


    #### array_merge()

    Finally, we have the `array_merge()` function. This function merges two or more
    arrays and returns the merged array.


    #### Example 1:

    ```php

    $countDemo = array(1, 4, 5, 1, 2);

    echo count($countDemo);

    ```

    Output:

    `5`


    #### Example 2:

    ```php

    $addDemo = array(1, 5, 3, 9);

    $addDemo[] = 7;

    ```

    In the example above, we add 7 to `$addDemo`. The array becomes `(1, 5, 3, 9,
    7)`.


    #### Example 3:

    ```php

    $addDemoAssoc = array(''Peter''=>20, ''Jane''=>15);

    $addDemoAssoc[''James''] = 17;

    ```

    Here, we add `''James''=>17` to `$addDemoAssoc`. The array becomes `(''Peter''=>20,
    ''Jane''=>15, ''James''=>17)`.


    #### Example 4:

    ```php

    $colors = array("red", "black", "pink", "white");

    array_splice($colors, 2);

    ```

