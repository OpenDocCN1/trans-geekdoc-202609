    # 第 3 章：基础 PHP 任务\n\n在上一章中，我们安装了 XAMPP 和 Brackets，并编写了第一个 PHP 脚本。在本章中，我们将学习在 PHP\
    \ 中执行三个非常基础的任务——向用户显示输出、在多个页面之间复制代码以及重定向用户。\n\n## 1 显示输出\n\n在学习显示输出之前，让我们先创建一个\
