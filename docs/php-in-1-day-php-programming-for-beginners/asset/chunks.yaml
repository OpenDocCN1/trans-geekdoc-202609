    To do that, we need to use the variable `$msg` declared in `p-write.php`. Recall
    that after data is inserted into the database, we assign the string `''Message
    saved successfully''` to `$msg`? We can use this string to decide whether we need
    to call the `keepValues()` method.


    The example below shows how it can be done for the first input field (“title”).
    The underlined code shows the if condition to use.


    ```php

    <input id = "txttitle" type="text" name="title" placeholder="Enter Title" autofocus
    <?php if ($msg != ''Message saved successfully'') $h keepValues($title, ''textbox'');
    ?>>

    ```


    Try doing this for the other input fields. Once that is done, we’ve completed
    the project. Congratulations! You are now ready to test your code to see if everything
    works as expected.


    ### 13.9 Running the Code


    Before running the code, we need to make some changes to `php.ini`. Follow the
    instructions in Chapter 2.1 to locate `php.ini` and open it in Brackets. Scroll
    to the bottom of the page and add the following lines to it (if you have yet to
    do so in previous chapters):


    ```ini

    error_reporting=E_ALL

    display_errors=On

    date.timezone=America/New_York

    ```


    Next, we want to add one more line to `php.ini`. Specifically, we want to add
    a line to prepend `debugging.php`. Prepending a file means specifying that we
    want PHP to process this file before it processes any other PHP script. Previously,
    we used the `include` statement in `UI_include.php` to add `debugging.php` to
    our PHP scripts. This works for most errors. However, it will not work if the
    file that `debugging.php` is included in has syntax errors. If you want `debugging.php`
    to work even when there are syntax errors, you need to prepend the file. To do
    that, add the line `auto_prepend_file="DOCUMENT_ROOT>/phpproject/includes/debugging.php"`
    to `php.ini`, where `<DOCUMENT_ROOT>` refers to the actual path of your htdocs
    folder. To find this path, load `http://localhost/dashboard/phpinfo.php` in your
    browser and search for “DOCUMENT_ROOT” (without quotes). You’ll see the path listed
    beside. You need to replace `<DOCUMENT_ROOT>` with the path listed. For instance,
    if the path is `/opt/lampp/htdocs`, the line should be `auto_prepend_file="/opt/lampp/htdocs/phpproject/includes/debugging.php"`.
    The code above may appear as two lines in this book due to the limited width of
    the book. Do not break it into two lines, it should be written as a single line
    in `php.ini`.


    After prepending `debugging.php`, if you are using PHP 7.2 and above, you should
    also turn `track_errors` off. `track_errors` is a built-in feature in PHP that
    has been deprecated since PHP 7.2. However, this feature is set to “On” by default.
    Leaving it on may lead to a warning that says “Directive ‘track_errors’ is deprecated
    found on line 0 in file Unknown” on some servers. To turn it off, simply add `track_errors=Off`
    to the bottom of `php.ini`. That’s it. You can now save the file and restart Apache.


    Next, go to `UI_include.php` and comment out the `include` statement for `debugging.php`.
    As we have already prepended the file, we should not include it again. Next, launch
    `http://localhost/phpproject/signup.php` in your browser and sign up for two new
    accounts.


    Everything works? If yes, congratulations! Give yourself a pat on the back. If
    no, it’s all right. Figuring out what went wrong is a large part of programming.
    This, to me, is where the most learning takes place. If something fails to work,
    you will likely get an error message. Try to use the line number and file name
    given in the error message to figure out what is wrong. Alternatively, you can
    use `echo` statements to determine which part of your code works. For instance,
    if you add an `echo` statement to line 10 of your code and you don’t see the output,
    you know that something has likely gone wrong before line 10. Similarly, if you
    add an `echo` statement to an `if` block and don’t see the output, you know that
    the `if` block is not executed.


    Try finding the error yourself. If you really can’t figure out the issue, you
    can check the suggested solution in the `phpproject-complete` folder and compare
    the code with your code. Copy and paste the functions that you suspect may be
    causing the error from the suggested solution to your solution and rerun your
    code to see if it works. Study the suggested solution carefully to really understand
    how it works.


    Got it? Once you manage to find the bug and are able to sign up for two accounts
    successfully, you can proceed to convert one of them to an admin account. To do
    that, go to `http://localhost/phpmyadmin/` and click on the “project” database.
    Click on the SQL tab and run the following SQL statement, replacing `YOUR_ADMIN_USERNAME`
    with the username you want to convert to an admin user:


    ```sql

    UPDATE members SET is_admin = 1 WHERE username = ''YOUR_ADMIN_USERNAME'';

    ```


    Once that is done, you can use the admin account to post to the blog. To do that,
    go to `http://localhost/phpproject/admin.php` to log in as an admin. Try adding
    some posts to the blog. Does everything work? After posting, you can go to `http://localhost/phpproject/index.php`
    to log in as a member (using either account) to read the posts.


    Alternatively, you can go to `http://localhost/phpproject/read.php` directly to
    read “Public” posts without logging in. Play around with the site to see if everything
    works as expected. If something does not work, try debugging it. With perseverance,
    you can definitely find the error and learn a lot in the process. Have fun!


    THE END

