    # 第 1 章：引言


    你好：感谢你拿起这本书。我很高兴你选择这这本书，我诚地希望它能帮助你掌握 PHP，并带你进入动态编程的世界。在本书中，我们将涵盖 PHP 的大部分主要主题。这些主题经过精心挑选，旨在让你广泛接触相关知识，同时又不会被不必要的细节所淹没。在书的最后，我们还将构建一个动态网站。期待吗？


    在正式开始 PHP 之前，请注意，本书要求你对 HTML 和 `MySQL` 有基础了解。


    ## 1.1 什么是 PHP？


    PHP 是一种主要用于 Web 开发的通用编程语言。它由 Rasmus Lerdorf 于 1994 年创建，允许开发者轻松地创建动态网页。例如，开发者可以在
    HTML 中创建一个表单，并使用 PHP 对其进行处理。根据表单中输入的内容，开发者可以使用 PHP 显示不同的输出结果。大多数情况下，PHP 被用作服务器端语言。这意味着
    PHP 代码不会在用户的计算机（也称为客户端）上处理。换句话说，当你通过浏览器中访问一个 PHP 页面时，代码不会在你的电脑上运行。相反，你的浏览器会向 Web
    服务器发送请求，然后由服务器处理代码并将结果以网页的形式返回给浏览器。


    通常情况下，这个 Web 服务器是存储 PHP 文件的远程计算机。为了让 Web 服务器处理 PHP 代码，需要安装一种名为 PHP 解释器的特殊软件。在下一章中，我们将学习使用一个名为
    `XAMPP` 的免费软件来搭建 Web 服务器并安装 PHP 解释器。


    ## 1.2 为什么要学习 PHP？


    学习 PHP 有很多理由。首先，PHP 是最流行的 Web 编程语言之一，用于 WordPress、Drupal 和 Joomla 等许多内容管理系统。因此，对
    PHP 程序员的需求很大。如果你计划作为自由开发者工作，PHP 是一项必不可少的技能。其次，PHP 设计对初学者友好且易于学习。此外，由于这种语言的流行，如果你在
    PHP 代码中遇到任何问题，都可以轻松找到帮助。在互联网上简单搜索可能就能帮你解决面对大部分问题。最后但同样重要的是，PHP 的语法与 Java 或 C 等其他编程语言非常相似。一旦熟悉了
    PHP，你会发现掌握其他语言变得容易得多。准备好开始了吗？让我们开始吧！


    '
