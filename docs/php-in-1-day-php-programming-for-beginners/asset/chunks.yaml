    ### 5.3.2 显示数组的内容

    接下来，让我们学习两种显示数组内容的方便方法。一种方法是使用上一节介绍的 `var_dump()` 函数。该函数显示变量的类型类型和值。如果我们写：


    ```php

    $myArray = array(2, 5.1, ''PHP'', 105);

    var_dump($myArray);

    ```


    我们将得到：


    ```

    array(4) { [0]=> int(2) [1]=> float(5.1) [2]=> string(3) "PHP" [3]=> int(105)
    }

    ```

    作为输出。


    `array(4)` 表示 `$myArray` 是一个包含 4 个元素的数组。紧随的大括号内的文本指示每个元素的数据类型和值。例如，`[0] => int(2)`
    告诉我们索引为 0 的元素是一个值为 2 的整数，`[1] => float(5.1)` 告诉我们索引为 1 的元素是一个值为 5.1 的浮点数，依此类推。接下来，我们有
    `print_r()` 函数。该函数与 `var_dump()` 函数类似。然而，它的输出更简洁，因为它没有给出每个元素的数据类型。例如，`print_r($myArray);`


    给了我们以下输出：


    ```

    Array ( [0] => 2 [1] => 5.1 [2] => PHP [3] => 105 )

    ```


    ### 5.3.3 向数组添加元素

    创建数组后，我们可以向其中添加新元素。有几种方法可以实现。最简单的是使用方括号符号。这种符号允许我们一次向数组添加一个元素。


    #### 示例 1

    ```php

    $addDemo = array(1, 5, 3, 9);

    $addDemo[] = 7;

    ```


    在上面的示例中，我们向 `$addDemo` 添加了 7。数组变成了 `(1, 5, 3, 9, 7)`。


    #### 示例 2

    ```php

