  trans: '


    在我们的项目中，用于存储每个输入的变量名与输入字段的名称对应。例如，`$username` 存储名为“username”文本框的输入。根据上述描述，修改 `index.php`、`signup.php`、`admin.php`
    和 `write.php`，使得处理表单出错时，除密码外，所有输入的值都能被保留。明白了吗？


    完成上述操作后，我们需要对 `write.php` 进行一些额外更改。对于大多数页面，如果处理表单没有出错，网站将根据我们传递给 `header()` 函数的
    URL 自动加载另一个页面。但 `write.php` 如此。对于此页面，管理员点击“提交”按钮后，无论数据是否成功提交到数据库，他都会留在当前页面。


    我们希望修改 `write.php`，使得如果数据成功插入数据库，我们就清空表单，以便管理员编写新帖子。换句话说，如果数据插入成功，我们不希望调用 `keepValues()`
    方法。为了做到，我们需要使用在 `p-write.php` 中声明的变量 `$msg`。记得在将数据插入数据库后，我们将字符串 `''Message saved
    successfully''` 赋值给 `$msg` 吗？我们可以使用这个字符串来决定是否需要调用 `keepValues()` 方法。


    下面的示例显示了如何对第一个输入字段（“标题”）进行操作。下划线代码显示了要使用的 `if` 条件。


    ```php

    <input id = "txttitle" type="text" name="title" placeholder="Enter Title" autofocus
    <?php if ($msg != ''Message saved successfully'') $h keepValues($title, ''textbox'');
    ?>>

    ```


    尝试对其他输入字段执行此操作。一旦完成，我们就完成了项目。恭喜你！你现在可以测试你的代码，看看一切是否按预期工作了。


    ### 13.9 运行代码


    在运行代码之前，我们需要对 `php.ini` 进行一些更改。按照第 2.1 节的说明找到 `php.ini` 并在 Brackets 中打开它。滚动到页面底部并添加以下行（如果你在之前的章节中尚未执行）：


    ```ini

    error_reporting=E_ALL

    display_errors=On

    date.timezone=America/New_York

    ```


    接下来，我们想在 `php.ini` 中再添加一行。具体来说，我们想添加一行来预置 `debugging.php`。预置文件意味着指定让 PHP 在处理任何其他
    PHP 脚本之前处理此文件。之前，我们在 `UI_include.php` 中使用 `include` 语句将 `debugging.php` 添加到 PHP
    脚本中。这对于大多数错误都有效。但如果包含 `debugging.php` 的文件存在语法错误，它将不起。如果你希望即使存在语法错误 `debugging.php`
    也能工作，你就需要预置该文件。这样做，在 `php.ini` 中添加行 `auto_prepend_file="DOCUMENT_ROOT>/phpproject/includes/debugging.php"`，其中
    `<DOCUMENT_ROOT>` 指你 htdocs 文件夹的实际路径。要找到此路径，在浏览器中加载 `http://localhost/dashboard/phpinfo.php`
    并搜索“DOCUMENT_ROOT”（不带引号）。你会看到旁边列出的路径。你需要将 `<DOCUMENT_ROOT>` 替换为列出的路径。例如，如果路径是
    `/opt/lampp/htdocs`，该行应该是 `auto_prepend_file="/opt/lampp/htdocs/phpproject/includes/debugging.php"`。由于书籍宽度限制，上面的代码在书中可能显示为两行。不要将其分成两行，它应该在
    `php.ini` 中写为单行。


    在预置 `debugging.php` 后，如果你使用的是 PHP 7.2 及以上版本，还应该关闭 `track_errors`。`track_errors`
    是 PHP 的内置功能，自 PHP 7.2 起已弃用。然而，该功能默认设置为“开启”。在某些服务器上，开启可能会导致“Directive ‘track_errors’
    is deprecated found on line 0 in file Unknown”的警告。要关闭它，只需在 `php.ini` 底部添加 `track_errors=Off`
    即可。你现在可以保存文件并重启 Apache。


    接下来，进入 `UI_include.php` 并注释掉 `debugging.php` 的 `include` 语句。由于我们已经预置了该文件，不应再次包含它。然后，在浏览器中启动
    `http://localhost/phpproject/signup.php` 并注册两个新账户。


    一切运行正常吗？如果是，恭喜你！给自己鼓个掌。如果没有，没关系。弄清楚哪里错了是编程的很大一部分。对我来说，这正是学习最多的地方。如果某些功能无法运行，你可能会收到错误消息。尝试使用错误消息中提供的行号和文件名来找出问题所在。或者，你可以使用
    `echo` 语句来确定代码的哪些部分有效。例如，如果你在代码的第 10 行添加了 `echo` 语句但没有看到输出，你就知道在第 10 行之前可能出了问题。同样，如果你在
    `if` 块中添加了 `echo` 语句但没有看到输出，你就知道 `if` 块没有执行。


    尝试自己寻找错误。如果你真的无法解决问题，可以检查 `phpproject-complete` 文件夹中的解决方案，并将代码与你的代码进行比较。将解决方案中你怀疑可能导致错误的函数复制并粘贴到你的解决方案中，然后重新运行代码看看是否正常工作。仔细研究解决方案以真正理解它是如何运行的。


    明白了吗？一旦你成功找到 bug 并能够成功注册两个账户，就可以将其中一个转换为管理员账户。要这样做，访问 `http://localhost/phpmyadmin/`
    并点击“project”数据库。点击 SQL 标签并运行以下 SQL 语句，将 `YOUR_ADMIN_USERNAME` 替换为你想转换为管理员用户的用户名：


    ```sql

    UPDATE members SET is_admin = 1 WHERE username = ''YOUR_ADMIN_USERNAME'';

    ```


    完成后，你就可以使用管理员账户发布博客了。要这样做，访问 `http://localhost/phpproject/admin.php` 并以管理员身份登录。尝试为博客添加一些帖子。一切运行正常吗？发布后，你可以访问
    `http://localhost/phpproject/index.php` 以成员身份登录（使用任一账户）来阅读帖子。或者，你可以直接访问 `http://localhost/phpproject/read.php`
    在无需登录的情况下阅读“公共”帖子。玩玩这个网站，看看一切是否按预期工作。如果某些地方不起作用，尝试进行调试。只要有坚持，你一定能找到错误并在过程中学到很多。玩得开心！


    结束


