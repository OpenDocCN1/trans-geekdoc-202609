    \ the default is `get`. In our example, we specify that we want to use the `get`\
    \ method. We’ll discuss both methods later.\n\nNext, let’s look at the `<input>`\
    \ tags in our form; these tags are used to create various elements. Notice that\
    \ all `<input>` tags have a `name` attribute. This attribute is used to name the\
    \ respective form elements. For instance, the first form element (which is a text\
    \ box) is named `studentname`, as shown in the code below.\n\nIt is mandatory\
    \ for us to name form elements if we want to use PHP to process those elements.\
    \ Similar to how variables in PHP have names, all form elements must have a `name`\
    \ so that we can reference them in our code later.\n\nNext, notice that all checkboxes\
    \ (`type=\"checkbox\"`) in our form are named `subj` and both radio buttons (`type=\"\
    radio\"`) are named `gender`. Both radio buttons have the same name as they belong\
    \ to the same group (i.e., they are both options for \"Gender\"). Similarly, the\
    \ checkboxes have the same name `subj` as they are all options for \"Favorite\
    \ Subject(s)\". As users can choose more than one option for checkboxes, we need\
    \ to add a pair of square brackets `[]` to indicate that the options selected\
    \ will be stored as an array.\n\nLast but not least, notice that all `<input>`\
    \ tags have a `value` attribute. This attribute behaves differently depending\
    \ on the form element. For text boxes, it specifies the initial value displayed\
    \ in the box. For `submit` buttons, it specifies the text on the button. For checkboxes,\
    \ radio buttons and down lists, it specifies the value that will be submitted\
    \ for each selected option. For instance, if the following checkbox is selected\
    \ `<input type=\"checkbox\" name=\"subj[]\" value=\"EL\">`, the string `\"EL\"\
    ` will be submitted to the PHP server, as we assigned `\"EL\"` to its `value`\
    \ attribute.\n\nGot it? Great! Let’s move on to discuss the `isset()` function.\n\
    \n### 1. The `isset()` function\n\nThe `isset()` function is an important function\
    \ that is commonly used in PHP form handling. This function checks if a variable\
    \ has been declared and is not `NULL`. `NULL` is a special value that, ironically,\
    \ is used to indicate that a variable has no value.\n\nSuppose we have two variables\
    \ `$a` and `$b` as shown below:\n\n```php\n$a = 5;\n$b = NULL;\n```\n\nThe following\
    \ statements:\n\n```php\nvar_dump(isset($a));\nvar_dump(isset($b));\nvar_dump(isset($c));\n\
    ```\n\ngive us:\n```\nbool(true)\nbool(false)\nbool(false)\n```\n`a` is considered\
    \ set (i.e., `isset($a)` returns true) as it has been declared and has a non NULL\
    \ value. In contrast, `$b` and `$c` are both considered unset (i.e., `isset($b)`\
    \ and `isset($c)` return false) as `$b` has a `NULL` value and `$c` has not been\
    \ declared. The `isset()` function is commonly used to determine if a button has\
    \ been clicked. We’ll learn to do that later.\n\nNext, let’s talk about the `get`\
    \ and `post` methods.\n\n### 2. `get` and `$_GET`\n\nBoth the `get` and `post`\
    \ methods can be used to send form data to the PHP server for processing. The\
    \ main difference is that when the `get` method is used, form data is appended\
    \ to the URL. In addition, there is a limit to the amount of data that can be\
    \ transmitted using the `get` method. The form in `form.php` currently uses the\
    \ `get` method. Suppose we fill in the form with the following data:\n\n![](image_rsrc1J2.jpg)\n\
    \nWhen we click on the “Submit Form” button, the URL changes to `http://localhost/form.php?studentname=Alex&subj%5B%5D=EL&subj%5B%5D=MA&gender=`\
    \ Notice the question mark (`?`) in the URL? This question mark is used as a separator;\
    \ what follows the question mark in the URL is known as a query string. The query\
    \ string contains the form data that we submitted, with each data presented as\
    \ a `name=value` pair, separated by ampersands (`&`). For instance, as we entered\
    \ the string “Alex” into the text field named “studentname”, the pair `studentname=Alex`\
    \ gets appended to the URL. Next, we selected the options “English” and “Math”\
    \ for “Favorite Subject(s)”. Hence, the pairs...\n"
  trans: "\n\n在这里，我们使用内置函数 `declare()` 将 `strict_types` 设置为 `1`。该语句必须是脚本中的第一条语句。接下来，我们声明一个名为\
    \ `addNumbersStrict()` 的函数，带有三个参数 `$num1`、`$num2` 和 `$num3`。我们通过在名称名前添加 `int`\
    \ 来指示这些参数必须是 `int` 类型。最后，我们通过向其传递 `'9'`、`'6'` 和 `'1'` 来调用该函数。如果你运行上面的代码，你将得到与下面所示类似的输出：`Fatal\
    \ error : Uncaught TypeError: Argument 1 passed to addNumbersStrict() must be\
    \ of the type int, string given...` 接下来，将 `echo` 语句改为\n\n```php\necho addNumbersStrict(9\
    \ , 6 ,1);\n```\n\n并重新运行代码。由于 `9`、`6` 和 `1` 都是 `int` 类型，我们现在不会遇到任何错误。相反，我们将得到\
    \ `16` 作为输出。明白了吗？除了对参数进行类型声明外，如果我们使用的是 PHP 7 及以上版本，还可以对返回类型进行声明。要做到这一点，我们可以在函数声明的括号后使用冒号来指示返回类型。向\
    \ `typedec.php` 中添加以下代码：\n\n```php\nfunction addTwoNums($a, $b): int {  \n   \
    \ return $a + $b;  \n}\necho '<BR>'.addTwoNums(3, 1);\n```\n\n在这里，我们指示 `addTwoNums()`\
    \ 的返回值应该应该是 `int` 类型。接下来，我们使用 `3` 和 `1` 作为参数调用该函数。如果你运行上面的代码，你将得到 `4` 作为输出。接下来，将最后一行改为\n\
    \n```php\necho '<BR>'.addTwoNums(3.9, 1);\n```\n\n再次运行页面。你将得到以下输出：`Fatal error\
    \ : Uncaught TypeError: Return value of addTwoNums() must be of the type int,\
    \ float returned...` 这是因为 `3.9 + 1` 为我们得到了 `4.9`，它不是 `int` 类型。\n\n# 第 8 章：PHP\
    \ 超局变量\n\n在前面的章节中，我们涵盖了许多内容。目前为止涵盖的大多数主题都是其他编程语言通用的基础概念。在本章中，我们将学习 PHP 特有的内容——PHP\
    \ 超局变量（superglobals）。我们将学习如何使用这些超局变量与 HTML 表单进行交互，并将信息从一个 PHP 脚本传递到另一个脚本。\n\n\
    ## 8.1 PHP 表单处理\n\n首先，这个主题要求你对 HTML 表单元素有基本的了解。如果你不熟悉，`https://www.w3schools.com/html/html_form_elements.asp`\
    \ 提供了一个你可以参考的快速指南。如果你熟悉，让我们从创建一个简单的 HTML 表单开始，供稍后使用。\n\n打开 Brackets 并在你的 `htdocs`\
    \ 文件夹中创建一个名为 `form.php` 的新文件。向其中添加以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head><title>PHP Form Handling</title></head> <body>\n<form action = \"\" method\
    \ = \"get\"> Enter Name <BR>  \n<input type = \"text\" name = \"studentname\"\
    \ value = \"Your Name\">  \n<BR><BR>  \nFavorite Subject(s)<BR>  \n<input type\
    \ = \"checkbox\" name = \"subj[]\" value = \"EL\">English  \n<input type = \"\
    checkbox\" name = \"subj[]\" value = \"MA\">Math  \n<input type = \"checkbox\"\
    \ name = \"subj[]\" value = \"PG\">Programming  \n<BR><BR>  \nGender <BR>\n<input\
    \ type = \"radio\" name = \"gender\" value = \"M\">Male  \n<input type = \"radio\"\
    \ name = \"gender\" value = \"F\">Female  \n<BR><BR>\n<input type = \"submit\"\
    \ name=\"sm\" value = \"Submit\">\n</form>\n</body>\n</html>\n```\n\n仔细研究上面的代码。注意我们使用了以下\
    \ `<form>` 标签 `<form action=\"\" method=\"get\">`。这个标签有两个属性 `action` 和 `method`。`action`\
    \ 属性指定了我们想要处理 HTML 表单的文件。在我们的示例中，我们给它分配了一个空字符串。这意味着我们想要使用当前文件（`form.php`）。如果我们想使用另一个文件来处理表单，我们需要将该文件的路径分配给\
    \ `action` 属性。例如，假设我们想使用 `process.php` 且 `process.php` 与 `form.php` 在同一个文件夹中，我们需要编写\
    \ `<form action=\"process.php\" method=\"get\">`。\n\n接下来，我们有 `method` 属性。该属性指定了我们想要使用的发送表单数据的方法。有两种方法可用：`get`\
    \ 和 `post`。如果我们不指定任何方法，默认是 `get`。在我们的示例中，我们指定了想要使用 `get` 方法。我们稍后会讨论这两种方法。\n\n\
    接下来，让我们看看表单中的 `<input>` 标签；这些标签用于创建各种元素。注意，所有的 `<input>` 标签都有一个 `name` 属性。该属性用于为相应的表单元素命名。例如，第一个表单元素（文本框）被命名为\
    \ `studentname`，如下方的代码所示。\n\n如果我们想用 PHP 处理这些元素，那么为表单元素命名是强制性的。就像 PHP 中的变量有名称一样，所有表单元素必须有一个\
    \ `name`，以便我们以后在代码中引用它们。\n\n接下来，注意我们表单中所有的复选框（`type=\"checkbox\"`）都命名为 `subj`，两个单选按钮（`type=\"\
    radio\"`）都命名为 `gender`。两个单选按钮具有相同的名称，因为它们属于同一个组（即：它们都是“性别”的选项）。同样，复选框具有相同的名称 `subj`，因为它们都是“喜欢的科目”的选项。由于用户可以为复选框选择多个选项，我们需要添加一对方括号\
    \ `[]` 来指示所选的选项将被存储为数组。\n\n最后但同样重要的是，注意所有的 `<input>` 标签都有一个 `value` 属性。该属性的行为根据表单元素而不同。对于文本框，它指定了显示在框中的初始值。对于\
    \ `submit` 按钮，它指定了按钮上的文本。对于复选框、单选按钮和下拉列表，它指定了每个所选选项将提交的值。例如，如果选择了以下复选框 `<input\
    \ type=\"checkbox\" name=\"subj[]\" value=\"EL\">`，字符串 `\"EL\"` 将被提交。\n\n明白了吗？太棒了！让我们继续，，来讨论\
    \ `isset()` 函数。\n\n### 1. `isset()` 函数\n\n`isset()` 函数是一个在 PHP 表单处理中常用的函数。它检查变量是否已声明且不为\
    \ `NULL`。`NULL` 是一个特殊值，讽刺地表示变量没有值。\n\n假设我们有两个变量 `$a` 和 `$b`，如下：\n\n```php\n$a\
    \ = 5;\n$b = NULL;\n```\n\n以下语句：\n\n```php\nvar_dump(isset($a));\nvar_dump(isset($b));\n\
    var_dump(isset($c));\n```\n\n给出了：\n```\nbool(true)\nbool(false)\nbool(false)\n\
    ```\n`a` 被认为是 set（即 `isset($a)` 返回 true），因为它已声明并有一个非 NULL 值。相反， `$b` 和 `$c` 都被认为是\
    \ unset（即 `isset($b)` 和 `isset($c)` 返回 false），因为 `$b` 值为 `NULL` 而 `$c` 未声明。`isset()`\
    \ 函数通常用于判断按钮是否被点击。我们稍后会学习这一点。\n\n### 2. `get` 和 `$_GET`\n\n`get` 和 `post` 方法都可以将表单数据发送到\
    \ PHP 服务器进行处理。主要区别在使用 `get` 方法时，表单数据附加到 URL。此外，使用 `get` 方法传输的数据量有一个限制。`form.php`\
    \ 中的表单目前使用 `get` 方法。假设我们用以下数据填充表单：\n\n![](img/image_rsrc1J2.jpg)\n\n点击“提交表单”按钮时，URL\
    \ 变为 `http://localhost/form.php?studentname=Alex&subj%5B%5D=EL&subj%5B%5D=MA&gender=`\
    \ 注意 URL 中的问号（`?`）？这个问号用分隔符；URL 中问号之后的内容被称为查询字符串。查询字符串包含了我们提交的表单数据，每个数据以 `name=value`\
    \ 对的形式呈现，并用符号（`&`）分隔。例如，当我们在名为“studentname”的文本框中输入字符串“Alex”时，键对 `studentname=Alex`\
    \ 被附加到 URL 中。\n\n"
