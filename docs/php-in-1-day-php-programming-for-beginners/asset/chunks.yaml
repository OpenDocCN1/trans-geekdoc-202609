    11.3 SQL Injection There are two main types of queries in MySQL - ones that return\
    \ data from the database (e.g.,SELECT ) and ones that don’t (e.g.,CREATE , INSERT\
    \ , UPDATE and DELETE ). The easiest way to send queries that do not return data\
    \ is to use the exec() method, while the easiest way to send queries that do is\
    \ to use the query() method. However, both methods put us at risk of a form of\
    \ attack known as an SQL injection. Recall that we talked about cross-site scripting\
    \ in Chapter 8.1.6? SQL injection is similar to that in that hackers can input\
    \ data into our website and use it to hack our database. Suppose we have a text\
