    \ Don’t worry if the code above does not make much sense yet. We’ll discuss a\
    \ better method to query the database later. For now, just know that in the code\
    \ above, we use the user input  \n\n$\\_POST\\['ownerName'\\] in our SQLSELECT\
    \ statement and use the query() method to execute the statement. If our user enters\
    \  \n\nJamie  \n\ninto the “ownerName” text field, the SELECT statement becomes\
    \ SELECT \\* FROM pets WHERE owner = 'Jamie'  \n\nand everything works as expected.\
    \ However, suppose the user enters Jamie' OR owner != 'Jamie  \n\ninto the text\
    \ field instead, the SELECT statement becomes SELECT \\* FROM pets WHERE owner\
    \ = 'Jamie' OR owner != 'Jamie' When we use the query() method to execute this\
    \ statement, PHP interprets the word “OR” in the user input as the SQL operatorOR\
    \ . Hence, it returns ALL rows from the “pets” table, since owner = 'Jamie' OR\
    \ owner != 'Jamie' covers all possible values for the “owner” column. This is\
    \ definitely not desirable.  \n\nInstead of using the query() or exec() method\
    \ to execute SQL statements, a better way is to use prepared statements. 11.4\
    \ Prepared Statements  \n\nThere are a few steps involved when using prepared\
    \ statements: 1) Create the SQL statement using placeholders  \n\n2) Prepare the\
    \ statement  \n\n3) Bind variables or values to the placeholders  \n\n4) Execute\
    \ the statement  \n\n5) Fetch any data returned if necessary Step 1: Creating\
    \ the SQL statement using placeholders When using prepared statements, we need\
    \ to use placeholders to replace any variables that contain user inputs in our\
    \ SQL statements. These placeholders can either be named or unnamed. An unnamed\
    \ placeholder is represented by a question mark. For instance, if we want to select\
    \ information from the “pets” table using user inputs for two columns named “owner”\
    \ and “petname”, we can use the SQL statement below: $sqlUnnamed = \"SELECT \\\
    * FROM pets WHERE owner = ? AND petname = ?\"; Here, we use question marks ( ?\
    \ ) to replace user inputs in our SQL statement and assign the statement to a\
    \ variable called  \n\n$sqlUnnamed . Alternatively, we can use named placeholders\
