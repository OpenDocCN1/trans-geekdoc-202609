    a page with no results. This is very frustrating if we are trying to figure out
    what is wrong. To get `PDO` to inform us of any issues, we need to use the `setAttribute()`
    method to configure the error mode. To do that, we pass two predefined constants
    to the method. The first constant tells `PDO` the attribute we want to set, and
    the second tells `PDO` the value we want to set it to. You can find the list of
    all predefined `PDO` constants at:


    https://www.php.net/manual/en/pdo.constants.php


    In our example, we want to set the error mode attribute `(PDO::ATTR_ERRMODE)`
    to `PDO::ERRMODE_EXCEPTION`. In this mode, `PDO` throws an exception when something
    goes wrong. We’ll learn more about exceptions in the next chapter. For now, just
