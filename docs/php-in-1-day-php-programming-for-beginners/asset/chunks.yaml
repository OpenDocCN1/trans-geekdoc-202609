- raw: "Cool! We’ve come to the final topic in this chapter - cookies. A cookie is\
    \ another way of storing information that can be accessed across multiple pages\
    \ on the site. It is essentially a small text file that stores data on the user's\
    \ computer (as opposed to a session that stores data on the server). As cookies\
    \ are stored on the user’s computer, you should not use cookies to store sensitive\
    \ data, as a malicious user could potentially manipulate it. Also, cookies may\
    \ be disabled on the user’s browser. Hence, if the information to be stored is\
    \ crucial or sensitive, you should use sessions instead. To create a cookie, we\
    \ use the set\\_cookie() function. Similar to the header() function covered in\
    \ Chapter 3.3, the set\\_cookie() function must be called before your script generates\
    \ any output. If you fail to do that, you’ll get a “Cannot modify header information\
    \ headers already sent” warning and the cookie will not be set. Your code may\
    \ work when you are working on your local computer, but when you upload it to\
    \ your hosting company’s server, it will fail to work. The set\\_cookie() function\
    \ accepts up to seven arguments; only the first is mandatory. We commonly provide\
    \ the first three arguments to the function, namely the name of the cookie, the\
    \ value of the cookie and the expiry date in UNIX timestamp format. Let’s look\
    \ at an example. Create a file called cookie.php in htdocs and add the following\
    \ code to it:  \n\n<?php  \n\nsetcookie('userName', 'Joy', time() + 120); #modifying\
    \ a cookie  \n\nsetcookie('userAge', 25, time() + 3600); setcookie('userAge',\
    \ 26, time() + 3600); #deleting a cookie  \n\nsetcookie('userLevel', 3, time()\
    \ + 3600); setcookie('userLevel', 3, time() - 3600); Here, we set three cookies\
    \ userName , userAge and userLevel . For the first cookie (userName ), its value\
    \ and expiry date are'Joy' and time() + 120 respectively. time() is a built-in\
    \ function that gives us the current Unix timestamp; time() + 120 means the cookie\
    \ will expire 120 seconds (i.e. 2 minutes) after it is set. Next, we have the\
    \ userAge cookie. This cookie is set twice. When a cookie is set more than once,\
    \ the newest cookie overwrites the previous ones. Hence, the value ofuserAge is\
    \ updated from25 to 26 . Finally, we have the userLevel cookie. This cookie is\
    \ set with an initial expiry oftime() + 3600 . However, it is subsequently updated\
    \ to an expiry oftime() - 3600 . When a cookie has an expiry in the past, it gets\
    \ deleted. Let’s look at how we can access each of these cookies now. We do that\
    \ using the $\\_COOKIE superglobal. Create another file called cookie2.php in\
    \ htdocs and add the following code to it: <?php  \n\necho 'User Name is '.$\\\
    _COOKIE\\['userName'\\]; echo '<BR>User Age is '.$\\_COOKIE\\['userAge'\\]; echo\
    \ 'User Level is '.$\\_COOKIE\\['userLevel'\\]; We are now ready to test our scripts.\
    \ First, launch cookie.php in your browser. When you do that, the three cookies\
    \ (userName , userAge and userLevel ) get created. Next, launch cookie2.php .\
    \ Depending on the error setting on your PHP server, you’ll get an output similar\
    \ to what is shown below: User Name is Joy  \n\nUser Age is 26  \n\n Notice: Undefined\
    \ index: userLevel in ...cookie2.php on line 4  \n\nUser Level is The userLevel\
    \ cookie does not exist as it has been deleted. Wait 2 minutes and reload cookie2.php\
    \ . You’ll get an output similar to the following: Notice: Undefined index: userName\
    \ in ...cookie2.php on line 2  \n\nUser Name is  \n\nUser Age is 26  \n\n Notice:\
    \ Undefined index: userLevel in ...cookie2.php on line 4  \n\nUser Level is The\
    \ userName cookie is also non-existent now as it has expired.  \n\nChapter 9:\
    \ Object-Oriented Programming  \n\nIn the next two chapters, we are going to cover\
    \ another important concept in PHP - the concept of object-oriented programming\
    \ (OOP). OOP is a major topic. Hence, a full discussion of it is beyond the scope\
    \ of this book. In this chapter, we’ll cover the core concepts in OOP. In the\
    \ next, we’ll talk about inheritance. Ready? Let’s get started.  \n\n1\\. What\
    \ is OOP?  \n\nFirst off, what is OOP? OOP is an approach to programming where\
    \ we organize our code by grouping related variables, constants and functions\
    \ into a class. This class serves as a template from which we can create what\
    \ is known as objects. Objects can then be used to store data and access functions\
    \ defined inside the class. Confused? No worries. The best way to understand OOP\
    \ is to look at an example. Let’s write our own class now.  \n\n2\\. Writing our\
    \ own class  \n\nTo write our own class, we use the class keyword, followed by\
    \ the name of the class. The name of the class is not case-sensitive and can contain\
    \ letters, numbers, or underscores. However, it cannot be a PHP reserved word\
    \ (i.e., a word that has a predefined meaning in PHP, such asecho , switch , break\
    \ , etc.) and cannot start with a number. It is a convention to use pascal case\
    \ when naming our classes. Pascal case refers to the practice of capitalizing\
    \ the first letter of each word, including the first word (e.g., ClassName). To\
    \ create our class, let’s first create a file in Brackets and save it as Movie.php\
    \ to our htdocs folder. Next, add the following code to  \n\nMovie.php .  \n\n\
    <?php class Movie{  \n\n//Add class members here  \n\n} Here, we use the class\
    \ keyword to declare a class called Movie . Within the Movie class (inside the\
    \ pair of braces{} ), we are going to add variables, constants and functions.\
    \ Variables and functions declared inside a class are known as properties and\
    \ methods respectively. Collectively, these properties, constants and methods\
    \ are known as class members . We’ll add properties to our Movie class first.\
    \ To do that, add the following code to Movie.php (inside the pair of braces):\
    \ private $id;  \n\npublic $title;  \n\npublic $rentalPrice; Here, we declare\
    \ three properties: $id , $title and $rentalPrice . Notice that we did not initialize\
    \ them in the code above? This is because we’ll be initializing them in a special\
    \ method known as the constructor later. Also, note that we preceded the property\
    \ declarations with the wordspublic or private . Don't worry about these keywords\
    \ at the moment; we’ll come back to them later. Next, let’s add a constant to\
    \ ourMovie class. To do that, add the following code to Movie.php (inside the\
    \ pair of braces):  \n\nconst DISCOUNT = 10; Here, we define a constant called\
    \ DISCOUNT and assign the value10 to it. Notice that we define a constant differently\
    \ here (compared to what we learned in Chapter 4.1)? Indeed, to define a constant\
    \ inside a class, we do not use the define() function. Instead, we use the const\
    \ keyword as shown above. Finally, let’s add some methods to our class. As mentioned\
    \ previously, a method is a function that is defined inside a class. We’ll start\
    \ with the constructor. A constructor is a magic method in PHP. Magic methods\
    \ are methods that have special functionalities in PHP; their names are predefined\
    \ and always start with two underscores. The constructor is named construct()\
    \ and is the first method to be called whenever we create an object from the class.\
    \ We typically use this method to initialize the properties in the class. Add\
    \ the following code to the Movie class after the constant (but before the closing\
    \ brace of the Movie class): public function construct($pId, $pTitle, $pRentalPrice){\
    \  \n\n$this->id = $pId;  \n\n$this->title = $pTitle;  \n\n$this->rentalPrice\
    \ = $pRentalPrice;  \n\n} Here, we define a constructor with three parameters:$pId\
    \ ,$pTitle and$pRentalPrice .  "
