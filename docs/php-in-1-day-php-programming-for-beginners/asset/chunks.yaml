    \ , the concatenation gives us the string  \n\nINC\\_DIR.'classes/Helper.php';\
    \ which is a direct path to the Helper.php file. We then use the include\\_once\
    \ statement to help us include this file. Got it? After we code myAutoloader()\
    \ , we need to use a built-in function called spl\\_autoload\\_register() to register\
    \ it as the autoloader. Once this is done, we simply need to include loadclasses.php\
    \ in all our PHP scripts and PHP will autoload classes for us whenever we create\
    \ an object. That’s it! We are now ready to go back to the main phpproject folder.\
