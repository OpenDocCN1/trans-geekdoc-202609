    \ 代码。相反，`PDO` 会将整个字符串视为“petname”列的值，并简单地搜索具有该奇怪名字的宠物。明白了吗？\n\n### 第 4 步：执行语句\n\
    在将值绑定到占位符之后，我们需要使用 `PDOStatement` 对象来调用 `execute()` 方法。要执行 `$preparedUnnamed`，我们这样写：\n\
    \n```php\n$preparedUnnamed->execute();\n```\n\n要执行 `$preparedNamed`，我们这样写：\n\n\
    ```php\n$preparedNamed->execute();\n```\n\n### 第 5 步：获取返回的数据（如果有）\n执行语句后，我们可以使用\
    \ `fetch()` 或 `fetchAll()` 方法来获取任何返回数据（如果该语句是 `SELECT` 语句）。`fetch()` 方法逐行获取行，而\
    \ `fetchAll()` 方法则一次性获取所有行。两种方法在失败时都会返回 `false`。\n\n在使用其中一种方法时，我们可以指定在获取行时希望方法使用的样式。常用的样式包括\
    \ `FETCH_ASSOC` 和 `FETCH_NUM` 样式。`FETCH_ASSOC` 样式将行作为关联数组（使用表中的列名作为键），而 `FETCH_NUM`\
    \ 样式将行作为索引数组获取（基于 `SELECT` 语句返回的列顺序）。\n\n例如，为了获取 `$sqlUnnamed` 的行，我们可以使用以下 `while`\
    \ 循环：\n\n```php\nwhile($row = $preparedUnnamed->fetch(PDO::FETCH_NUM)){  \n  \
    \  echo 'Pet = '.$row[1].'<BR>';  \n    echo '<BR>Owner = '.$row[0].'<BR>';  \n\
    } \n```\n\n该循环使用赋值语句 `$row = $preparedUnnamed->fetch(PDO::FETCH_NUM)` 作为循环条件。这在处理\
    \ `PDO fetch()` 方法时是允许的，也是一种常用方法。赋值语句使用 `$preparedUnnamed`（即 `$sqlUnnamed` 的预处理语句）调用\
    \ `fetch()` 方法，并指定获取样式为 `PDO::FETCH_NUM`。接下来，它将返回的结果赋值给名为 `$row` 的变量。该变量控制 `while`\
    \ 循环的何时结束。只要 `$row` 不是 `false`，循环就会继续。\n\n在 `while` 循环内部，我们使用两个 `echo` 语句来显示 `fetch()`\
    \ 方法返回的数组值。`row[0]` 为我们提供了 `$sqlUnnamed` 中的第一列（即“owner”列），而 `row[1]` 提供了第二列（即“petname”列）。当我们到达结果集的末尾且\
    \ `fetch()` 方法无法再获取更多行时，它会返回 `false`。此时 `$row` 变为 `false`，`while` 循环随之停止。\n\n\
    除了使用 `FETCH_NUM` 样式外，我们还可以使用 `FETCH_ASSOC` 样式来获取数据。方法如下：\n\n```php\nwhile($row\
    \ = $preparedUnnamed->fetch(PDO::FETCH_ASSOC)) { \n    echo 'Pet = '.$row['petname'].'<BR>';\
    \  \n    echo '<BR>Owner = '.$row['owner'].'<BR>'; \n} \n```\n\n这两个循环给出的输出是相同的；我们稍后会有机会运行它们并查看结果。除了使用\
    \ `fetch()` 方法外，我们还可以使用 `fetchAll()` 方法一次性从数据库中获取所有行。我们将在书末的项目中这样做。\n\n就是这样。我们已经涵盖了预处理语句的精要。\n\
    \n### 1.5 整合\n要做到这一点，我们首先一个数据库和用户。首先，确保你已经启动了 XAMP 和 MySQL 服务器。如果你在启动 MySQL 服务器时遇到问题，可能是由于端口冲突。我们现在准备好连接到你刚刚创建的数据库了。\n\
    \n"
