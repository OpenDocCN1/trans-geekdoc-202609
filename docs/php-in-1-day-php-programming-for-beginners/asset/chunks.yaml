- raw: "In the code above, we first connect to the “pawszone” database in Section\
    \ A. Next, in Section B, we use a SQL CREATE statement to create a table called\
    \ “pets” in our database. As this SQL statement does not have any placeholder,\
    \ we do not need to call the bindValue() method. Instead, we simply prepare the\
    \ statement and execute it. In Section C, we have an INSERT statement for inserting\
    \ data into the “pets” table. We first use the prepare() method to prepare this\
    \ statement. Although we’ll be executing the INSERT statement four times using\
    \ a for loop later, note that we only need to prepare the statement once. This\
    \ is another advantage of using prepared statements as it can result in faster\
    \ execution, especially if the query is complex or needs to be run many times.\
    \ After preparing the statement, we declare three arrays $owner , $pname and $breed\
    \ - and assign the data to be inserted to these arrays. Next, we use a for loop\
    \ to loop through the arrays. Each time the loop runs, we bind one value in each\
    \ array to the relevant placeholder. After binding the data, we call the execute()\
    \ method to execute the INSERT statement. After inserting the data in Section\
    \ C, we update a row (where owner = “Jamie” and petname = “Max”) in Sections D\
    \ and delete another (where owner = “Ted” and petname = “Angel”) in Section E.\
    \ These two sections should be quite self-explanatory. Read through the code above\
    \ carefully and fully understand it before proceeding. Once you are clear on how\
    \ prepared statements work, load the page sql\\_cud.php in your browser to run\
    \ the code. Next, head over to http://localhost/phpmyadmin/ and select the “pawszone”\
    \ database on the left. You should see the “pets” table listed on the right. Click\
    \ on “Browse” and you’ll get the following table: ![](image_rsrc1J7.jpg)As you\
    \ can see, the “pets” table has been successfully created and data has been added\
    \ to it. Got it? Next, let’s learn to select data from this table and display\
    \ it on our web page using PHP. To do that, create a new file called sql\\_select.php\
    \ and add the following code to it. <?php  \n\n//Section A - Connecting to the\
    \ database $pdo = new PDO(\"mysql:host=localhost;dbname=pawszone\", \"pz\\_admin\"\
    , \"ABCD\");  \n\n$pdo->setAttribute(PDO::ATTR\\_ERRMODE, PDO::ERRMODE\\_EXCEPTION);\
    \ //Section B - SELECT all rows from pets  \n\n$sql = \"SELECT petname, owner\
    \ FROM pets\";  \n\n$stmt = $pdo->prepare($sql);  \n\n$stmt->execute();  \n\n\
    while ($row = $stmt->fetch(PDO::FETCH\\_ASSOC)){  \n\necho '<BR>Owner = '.$row\\\
    ['owner'\\].'<BR>';  \n\necho 'Pet Name = '.$row\\['petname'\\].'<BR>';  \n\n\
    }  \n\n$stmt->execute(); while ($row = $stmt->fetch(PDO::FETCH\\_NUM)){  \n\n\
    echo '<BR>Owner = '.$row\\[1\\].'<BR>';  \n\necho 'Pet Name = '.$row\\[0\\].'<BR>';\
    \ } Here, as before, we first connect to the “pawszone” database in Section A.\
    \ Next, in Section B, we use a SELECT statement to select the “petname” and “owner”\
    \ columns from the “pets” table. After executing the statement, we use a while\
    \ loop to fetch the rows one by one, using the FETCH\\_ASSOC style. Finally, we\
    \ use echo statements inside the while loop to display the data fetched. Next,\
    \ we execute the SELECT statement again and use another while loop to fetch the\
    \ rows using theFETCH\\_NUM style. If you load sql\\_select.php in your browser,\
    \ you’ll get the following output displayed twice:  \n\nOwner = En  \n\nPet Name\
    \ = Boots  \n\nOwner = En  \n\nPet Name = Dora  \n\nOwner = Jamie Pet Name = Max\
    \  \n\nChapter 12: Managing Errors and Exceptions We’ve come to the last chapter\
    \ before our project. In this chapter, we are going to learn to manage errors\
    \ and exceptions in our PHP scripts. Frankly speaking, this is one of the messiest\
    \ areas in PHP as PHP differentiates between an exception and an error. When something\
    \ goes wrong,we’ll get either an exception or an error. Internal PHP functions\
    \ mainly give us errors when something goes wrong. Modern object-oriented extensions\
    \ (such as the PDO extension we learned in the previous chapter), on the other\
    \ hand, are more likely to use exceptions. In this chapter,we’ll first discuss\
    \ exceptions and errors separately before consolidating everything into a single\
    \ file in the last section. Ready?Let’s look at exceptions first.  \n\n1\\. Handling\
    \ Exceptions  \n\n1\\. What is an exception?  \n\nAn exception is a predefined\
    \ object in PHP that allows us to alter the flow of our scripts when something\
    \ undesirable happens. For instance, if we try to connect to a database and the\
    \ connection fails, we can use an exception to help us handle the situation. To\
    \ see what an exception is, create a file called connect.php in htdocs and add\
    \ the following code to it: <?php $pdo = new  \n\nPDO(\"mysql:host=localhost;dbname=pawszone\"\
    , \"wrongadmin\", \"ABCD\");  \n\n$pdo->setAttribute(PDO::ATTR\\_ERRMODE,  \n\n\
    PDO::ERRMODE\\_EXCEPTION); Here, we try to connect to the “pawszone” database\
    \ using an invalid username(“wrongadmin”).  \n\nNext, create a new file called\
    \ exceptionHandling.php in htdocs and add the following code to it: <?php  \n\n\
    include \"connect.php\";  \n\necho '<BR>Welcome to Pawszone'; Here, we use an\
    \ include statement to include the connect.php file (which contains the invalid\
    \ code) and use anecho statement to echo the text“Welcome toPawszone” after theinclude\
    \ statement. After creating the two files, try loading exceptionHandling.php in\
    \ your browser (with Apache and MySQL running), what do you get? You get a message\
    \ similar to what is shown below, right? I’ve formatted and underlined parts of\
    \ the message to make it more readable. Fatal error: Uncaught PDOException: SQLSTATE\\\
    [HY000\\] \\[1045\\] Access denied for user  \n\n'wrongadmin'@'localhost' (using\
    \ password: YES) in /opt/lampp/htdocs/connect.php:3 Stack trace: #0 /opt/lampp/htdocs/connect.php(3):\
    \ PDO  \n\n\\> construct('mysql:host=loca...', 'wrongadmin', 'ABCD') #1 /opt/lampp/htdocs/exceptionHandling.php(2):\
    \ include('/opt/lampp/htdo...')  \n\n#2 {main} thrown in /opt/lampp/htdocs/connect.php\
    \ on line 3 This message informs us that a PDO exception (PDOException ) has occurred\
    \ and is not caught (i.e., not handled). This exception occurs because of the\
    \ invalid username we used when connecting to the “pawszone” database. When an\
    \ exception occurs and is not caught, PHP displays a message similar to the one\
    \ shown above. This output includes a stack trace listing all the files linked\
    \ to the exception. The trace above tells us that the current exception is linked\
    \ to line 3 in connect.php and line 2 in exceptionHandling.php . In addition,\
    \ the database password, “ABCD”, is revealed in the trace. Notice that the second\
    \ statement ( echo '<BR>Welcome to Pawszone'; ) in exceptionHandling.php is not\
    \ executed? This is because any exception that is not caught results in a fatal\
    \ error; the script is terminated immediately before the echo statement can be\
    \ executed. If we do not want script termination to happen (or the message above\
    \ to be displayed) when an exception occurs, we need to catch the exception. 12.1.2\
    \ try-catch-finally  \n\nTo catch exceptions, we use the try , catch and finally\
    \ blocks. The syntax is as follows: try {  \n\n//do something  \n\n}  \n\ncatch\
    \ (type of exception)  \n\n{  \n\n//do something else when an exception occurs\
    \  \n\n}  \n\nfinally {  \n\n//do this regardless of whether the try or catch\
    \  \n\nblock is executed  \n\n} The try block first tries to perform a task. \
    \ \n\nIf the task fails, an exception will be thrown. Throwing an exception simply\
    \ means PHP will create an object using one of the predefined classes for dealing\
    \ with exceptions.  "
