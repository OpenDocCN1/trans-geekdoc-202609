  trans: '

    比特币官方网站注册于 2008 年 8 月。2008 年 10 月，中本聪（Satoshi Nakamoto）发布了比特币白皮书，他在书中向比特币员工描述了其的操作及其背后的技术。第一个比特币区块，广为人知的“创世区块”（`Genesis
    Block`），于 2009 年 1 月 3 日挖出。`Bitcoin Block`创建的那天现在通常被认为是比特币生日。第一笔比特币交易发生在 2009
    年 1 月 12 日，双方是中本聪和软件开发者哈尔·芬尼（Hal Finney）。中本聪在大部分时间内挖矿了比特币区块链上大部分早期的区块。他为自己收集了超过
    100 万个比特币的资金。在当时，挖矿难度很低，可以很快地挖出新的比特币。


    ## 20 世纪 10 年代初


    中本聪在完美的时机创造了比特币。2008 年和 2009 年，世界遭遇了一场前所未有的金融危机。这场经济危机是各国银行鲁莽货币政策的结果。人们对传统银行的信任已经崩溃，而人们正在等待一种新的货币系统。


    在 2010 年代的前半叶，比特币的流行程度开始大幅增长，人们首次可以在现实世界中使用比特币进行购物。第一笔现实世界中的购买发生在 2010 年 5 月 22
    日，当时一位名叫莱斯洛·哈尼耶兹（Laszlo Hanyez）的人用 10,000 个比特币买购买了两个披萨。


    这一天现在被称为“比特币披萨日”。2010 年，许多围绕比特币的新服务开始发展。其中最知名的服务是名为“门客”（Mt. Gox）的比特币交易所。这个交易所的故事在
    2014 年遭受大规模黑客攻击后结束。门客的黑客事件仍然是今为止比特币历史上最具戏剧性的事件之一。比特币创始人中本聪的最后露面是在 2011 年，他在一封邮件中表示他将转向其他领域。


    中本聪将项目的责任交给了一个名叫加文·安德森（Gavin Andersen）的程序员，后者也成为了比特币基金会的首席开发人员。2011 年，世界看到了第一个比特币价格泡沫，比特币价格从不到
    1 美元飙升至 30 美元，然后回落到 2 美元。


    ## 比特币增长的岁月


    自早期以来，比特币的流行程度经历了巨大的增长。比特币的用例不断增加，全球越来越多的投资者意识到了比特币作为投资工具的潜力。比特币在历史上经历了了三次价格泡沫。其中一次发生在
    2013 年底，当时比特币价格在短短几个月内从 100 美元飙升至 1,000 美元以上。之后，比特币价格一直处于下降趋势，直到 2015 年 1 月，当时一个比特币的价格低于
    200 美元。然而，人们对比特币和区块链技术的兴趣增加了。2016 年，比特币确立了其作为银行无法忽视的现象的地位。对比特币的兴趣爆发式增长，这也反映在比特币的价格上。比特币价格从
    2015 年初到 2017 年稳步上升。2017 年底，比特币经历了历史上的第三次价格泡沫，比特币价格涨至近 20,000 美元。正如预期的那样，价格的急剧上涨也导致了媒体关注度的增加。在
    2017 年和 2018 年年初，人们对比特币的兴趣比以往任何时候都要大。比特币价值的剧烈增长也导致了比特币监管的收紧。


    比特币的监管已经收紧，例如在中国和韩国。


    比特币在整个历史中经历了不同的硬分并接收了 d. H. 升级。比特币最著名的硬分之一是 2017 年执行的比特币 SegWit（机性支出）更新。SegWit
    更新通过改变网络保护比特币交易的方式改进了比特币网络的容量。在 SegWit 更新之前的这段时间在比特币社区内也存在争议。比特币社区被分为两个不同的群体。另一组人希望通过增加区块链的区块大小来提高比特币网络的容量。相比之下，另一方则希望通过闪电网络（Lightning
    network）技术提高比特币的可扩展性。在实践中，闪电网络技术意味着较小的比特币交易是在完全独立的网络上传输的。最终，关于比特币可扩展性的争议升级到了程度：一个要求更大区块大小的群体在
    SegWit 更新生效之前退出了比特币社区，创建了属于自己的加密货币。这种加密货币今天被称为比特币现金（Bitcoin Cash）。2010 年代，对比特币日益增长的兴趣加速了新型加密货币的交换并引入了更多与比特币相关的投资产品，如期权和证书。


    与此同时，比特币已成为越来越多私人投资者和机构投资组合的一部分。比特币和其他加密货币的日益普及也导致了近年来对加密货币市场监管的加强。


    比特币是世界上第一种数字货币，在十多年前被引入。尽管比特币最终完成了开创性工作，在此之前也曾尝试引入数字货币。


    中本聪（即比特币背后的个人或团体，确切身份仍不清楚）挖出了名为“创世”的第一个比特币区块。下一个大事件发生在 2010 年，当时莱斯洛·哈尼泽用 BTC 支付了两个披萨。BTC
    首次被用于在现实世界购买实物。


    # IPO


    在同年，第一批加密货币交易所上线。2013 年，已经有十多种不同的加密货币可以交易。在过去的几年里，创建了数千种加密货币，市场从那时起稳定增长。


    随着加密货币世界的不断扩张和普及，越来越多的商店、品牌和网络开始接受作为支付方式。


    随着加密货币日益流行和使用，加密货币的价值以及交易利润金额也在增加。


    ## 交易软件


    用于交易数字资产（如比特币时代）的交易软件让没有交易经验的人更容易买卖数字货币并从这些交易中获利。


    ### 比特币时代


    比特币时代是一种可以手动或自动交易加密货币的交易系统。该软件提供的手动和自动模式让比特币和其他加密货币的盈利交易变得异常简单。


    ### 交易机器人


    如今，许多团队为比特币和其他加密货币提供付费和免费的交易机器人。了解更多关于交易机器人：交易机器人可以轻松执行最聪明的交易者复杂的且看似不可能的策略。

