    Therefore, miners with a small percentage of mining power have a limited chance
    of discovering their next block. To give such miners an advantage, mining pools
    are formed to make it easier for miners to pool their resources and share their
    processing power over one network. The miners then share the reward equally with
    everyone in the pool based on the amount of work they contribute to finding the
    block.


    ## How much does a bitcoin miner earn?


    When bitcoin was mined for the first time in 2009, the miner was paid 50 BTC for
    successfully mining bitcoin. In 2012, this reward was divided by two such that
    miners that year earned 25 BTC, and in 2016, the amount was divided by two again,
    making it 12.5 BTC. In May 2020, the reward was 6.25 BTC.


    In November 2020, Bitcoin surged in price to one Bitcoin worth $17,900, so that
    means you may have earned up to $111,875 if you mined in May 2020. As the value
    of Bitcoin increases, miners will continually earn more even if the rewards reduce
    because now Bitcoin has risen to $50,000, now think of how much you will make
    if you were a miner.


    ## How to become a bitcoin miner


    ### Step one: Get bitcoin mining hardware.


    It would help if you got a mining rig to get started, as this is the special hardware
    used for mining bitcoins or other cryptocurrencies. The rig is called `Application-Specific
    Integrated Circuit Chips` (`ASIC`), which mines bitcoin faster, uses less energy,
    is very powerful, and very expensive.


    Before buying the rig, please consider these factors:

    - The price (compare prices)

    - Its hash performance rates and attempts at solving a block

    - Its electric power consumption


    Reading different miners'' reviews will be helpful before choosing based on performance
    over price.


    Please note that it is difficult to get this rig because of the high demand.


    You can also check the `ASIC WEB PAGE` for detailed information about new miners
    before making a purchase.


    ### Step two: Get your Bitcoin wallet.


    Next, you need to set up a bitcoin wallet to receive your bitcoins and manage
    your addresses. As a beginner miner, you should use a software wallet because
    it is easy to operate, easily downloaded, and safe.


    You can also a full version wallet like `BITCOIN CORE` which helps you decide
    on the blockchain that contains legitimate transactions.


    ![](Images/image00169.jpeg)


    Figure: Bitcoin Core image derived from Master Data in Motion


    ### Step three: Join a mining pool


    Even if you have the best mining hardware, you will still need to join a pool
    because that single hardware cannot compete in isolation with other miners around
    the world. When you enter a pool, the probability of solving the numeric problem
    and mining faster is higher, and then you share the rewards with others in the
    pool.


    You can find different bitcoin mining pools for beginners, and if you are unsure
    of the one to join, please visit `BITCOIN WIKI` for credible pools. After selecting
    a pool, register on the website set your account, and wait for your “worker ID.”


    ### Step four: Get a mining program.


    After getting the hardware, bitcoin wallet, and joined a mining pool, you will
    have to obtain a mining client for your computer. The mining client (mining software)
    connects you to the blockchain and bitcoin network while also delivering works
    to miners and collects the complete result of their jobs. The full information
    is then added to the blockchain.


    There are many free mining programs for mining bitcoin, and some mining pools
    have their software. Before using any software, please read up on their advantages
    and disadvantages.


    ### Step five: You can mine now!


    Now you are ready to mine bitcoins. Connect your miner hardware to a power outlet,
    connect it with the computer and install the software. Fill in all information
    about your wallet and the mining pool you joined, then choose a device and start
    mining.


    To become a successful miner, you must stay updated on crypto news because things
    change in the market suddenly, and you need always to know what’s happening.


    There are several ways of getting additional bitcoins, and mining is one such
    process that serves to keep the bitcoin system active while rewarding miners.
    This chapter provided all the information you need to understand how mining works,
    the gains, and how to get started.


    Remember that as a practical guide, you are expected to follow through with the
    steps and approaches shared in this book. From the mining world, we will move
    on to the last chapter in this book that considers the future of Bitcoin.


    ## BROKER


    ### Summing up the concepts exposed .. the best current brokers are


    **eToro is a great broker for beginners & semi serious investors.** The process
    is as simple as depositing your USD into your account and then choose which cryptocurrency
    you want to buy. After your purchase you can view your assets in your portfolio
    tab, from there you can track value changes and sell when you want. This simple
    system makes it ideal for people who want to buy a small range of cryptos and
    hold them for a long term strategy. eToro, however is not ideal if you want to
    do serious day trading due to limited number of pairs and real time data. If you
    would like to dabble in some recreational trading then etoro is a good option,
    but when it comes time to scale your trades there are better options.


    **eToro does have a cool feature** that allows you to copy popular traders move-for-move
    which means you can automate your investment strategy. The community at eToro
    also adds a lot of value, your newsfeed will be full of interesting posts from
    different traders who are sharing their observations and predictions on market
    movements.


    Your funds will enjoy a high level of security with eToro, not only are they regulated
    in the US but they are multinational. eToro''s fees vary depending on the asset
    but they''re generally competitive. eToro offer a demo account where you can test
    your decisions with fake money, this is a nice feature.


    - **Easily deposit USD** and instantly buy cryptocurrencies. Designed to be easy.

    - **Use the copy trade filter** system to find investors'' portfolio to copy.
    You can match the portfolios that suit your ideal return on investment, risk tolerance
    and the number of copiers.

    - **Serves 14 cryptocurrencies** that you can buy with credit card, bank transfer
    or PayPal.

    - **Helpful demo account training feature**


    ![](Images/image00170.jpeg)


    [Visit eToro](https://med.etoro.com/aw.aspx?A=101127&Task=Click&TargetURL=https%3A%2F%2Fwww.etoro.com%2Fcrypto%2Ftrading-platform%2F&SubAffiliateID=)


    [Read our eoro review](https://marketplacefairness.org/brokers/etoro/)


    **Most Secure Broker: Gemini**


    Founded in 2014 by the Winklevoss twins, Gemini is the most secure crypto broker.
    It is regulated by the NYDFS and enjoys FDIC protection for their USD. They have
    always focused on security as their top priority which makes them a popular broker
    where people trust their funds to be safe. Gemini offers ease of purchase; you
    can buy crypto directly using USD which can be deposited by ACH, Wire transfer
    or Debit card.

