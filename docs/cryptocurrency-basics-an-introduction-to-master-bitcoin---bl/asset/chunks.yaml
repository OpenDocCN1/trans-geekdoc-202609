    # Overstock

    It is a company that directly accepts payments in `Bitcoins`. On this site, you
    will find furniture, televisions and even computers.


    # Newegg

    This online electronics merchant accepts `Bitcoin` payments on most of its stock.


    # Video games

    The video game industry, as seen by `Ubisoft`''s latest announcement developing
    a blockchain project, is a ripe industry to embrace cryptocurrency payments.


    - `Xbox`: Here you can buy premium games and subscriptions to the online network.

    - `PlayStation Network`: Available for `PlayStation` games and subscriptions.

    - `Zynga`: The creator of online and mobile games also accepts `Bitcoin`.


    # The tourism sector

    Competition is very strong in the field of travel booking sites. Accepting `Bitcoin`
    is a good way for sites to differentiate themselves. We thus find many actors
    for example:


    - `Expedia`: This is one of the biggest tourists booking sites in the world, you
    can spend your `Bitcoins` to buy plane tickets, book a hotel, an excursion, or
    even a rental car!

    - `Virgin Galactic`: If you want to buy your ticket for space in `Bitcoin`, it
    is possible! `Richard Branson`’s company accepts `Bitcoins` well.

    - `Air Baltic`: The first airline to offer flights payable in `Bitcoin`.


    # IS BITCOIN A REAL CURRENCY AND A REAL MEANS OF PAYMENT?

    It is a vast quasi-philosophical debate, but we will try to provide you with some
    avenues for reflection.


    To be a widely accepted means of payment and a store of value, the currency must
    be an object with the following properties: non-perishable, identifiable, difficult
    to counterfeit, easy to transport, easy to store, fungible, and divisible.


    Let''s see if `Bitcoin` has these properties:

    - **Non-perishable**: obviously yes.

    - **Identifiable**: like banknotes, each `Bitcoin` has its own number. So yes,
    we''ll identifiable.

    - **Difficult to Counterfeit**: Impossible to counterfeit, but a person with enough
    computing resources might try to use the same `Bitcoin` to make multiple payments.

    - **Easy to Carry and Store**: As long as you have a smartphone or a computer,
    it is easy to store and transport a large number of `Bitcoins`.

    - **Fungible**: In the same way that a gold bar is interchangeable with a gold
    bar, a `Bitcoin` is interchangeable with another `Bitcoin`. It is therefore quite
    fungible.

    - **Divisible**: A `Bitcoin` can be subdivided into 100 million units, called
    `Satoshi`.


    At first glance, `Bitcoin` has all the properties of a currency. But that does
    not guarantee its success. Indeed, to be successful, a currency must inspire confidence
    and, above all, be useful. The two are also intimately linked.


    To inspire confidence, `Bitcoin` must intimately convince its users that they
    will be able to exchange their `Bitcoins` for goods and services at any time.
    The users of a currency are part of a vast exchange network, and the value of
    this network increases due to the number of people who compose it. To be truly
    useful, `Bitcoin` must therefore be accepted by enough people.


    `Bitcoin`, like all currencies, has an abbreviation (`EUR` for Euro, `CHF` for
    Swiss Franc, etc.). It is often designated by the abbreviation `BTC` but we also
    find the abbreviation `XBT` to speak of the first of the cryptocurrencies.


    This financial name, even if it is not official, corresponds to the system in
    force on the financial markets. Thus, in `XBT`, `BT`, corresponds to the abbreviation
    of `Bitcoin` while the `X` located in front reminds us that this asset does not
    belong to any country as is the case of the `X` in `XAU` which designates gold.


    # WHAT CAN YOU BUY WITH BITCOIN?

    Several states have officially recognized `Bitcoin` as a method of payment, such
    as `Japan` in March 2017. In fact, cryptocurrency is very popular there and `Bitcoin`
    payments are relatively common. However, this is not the case everywhere in the
    world.


    In France, few traders accept to be paid in `Bitcoin`. Most of the businesses
    that accept it are on the Internet. `Overstock` or `Shopify` merchant sites, in
    particular, accept payment in `Bitcoins`. The `WordPress` blog platform also accepts
    `Bitcoins`. But there are also a few physical stores in which to spend your `Bitcoins`.
    Please note, in France, they are almost all located in `Paris`.


    It is, therefore, possible to buy computer hardware, software, and IT solutions,
    but also everyday consumer products such as furniture, decorative objects, clothing,
    etc.


    You can either buy `Bitcoins` by exchanging a currency (Euro, dollar, etc.) for
    `Bitcoins`, or you can offer a good or service for sale by setting its price in
    `Bitcoin`.


    In any case, you will need to create a cryptocurrency wallet to be able to hold
    your `Bitcoins`. The question of the famous wallet then arises. Which `Bitcoin`
    wallet to choose from? Which site to favor to hold `Bitcoins`? The question is
    far from trivial given the hacks or bankruptcies that have affected many players
    in the sector. To keep your `Bitcoins`, you must have a wallet, that is to say,
    an address in the form of a series of digits that can be accessed using a password.
    Address and password can be created for free and easily on a dedicated platform.


    However, to pay or receive a payment in cryptocurrency, you will need to either
    download software or use an exchange platform. Finally, to pay with a cryptocurrency
    (or receive a payment in cryptocurrency), an intermediary is necessary. You will
    have the choice between an exchange platform similar to a broker or software to
    download.


    # HOW TO PAY IN BITCOIN?

    There are three ways to pay in `Bitcoin`, whether the transaction is for the purchase
    of a good or service.


    1. First, you can use the `QR Code` provided by the seller. All you need to do
    is scan it with your smartphone which will automatically open your `Bitcoin` wallet
    application. You will then only have to validate the payment by first checking
    the sending address of the sum and the amount.

    2. But you can also pay an online merchant on your computer and click on "pay
    in Bitcoin". In this case, your wallet will open automatically. Again, you will
    need to verify the recipient''s address and the amount before validating your
    payment.

    3. Finally, you can also choose to send a payment manually. You will then have
    to open your online wallet and copy the merchant''s address into the `send to`
    or `recipient` field and specify the amount in `XBT` of the transaction before
    sending your payment.


    # WHY BUY BITCOIN?

    As we have seen, `Bitcoin` payments are relatively limited, and few merchants
    still accept to exchange the goods or services they offer for sale for `Bitcoin`.
    So, why invest in `Bitcoin`? What is the interest in `Bitcoin`? How is `Bitcoin`
    increasing in value? Why has `Bitcoin` exploded? Here we explain the reasons to
    buy `Bitcoin` and how to make money with `Bitcoin` while keeping in mind the risks.


    Admittedly, `Bitcoin` can be exchanged all over the world, via any computer or
    smartphone, without any bank intermediary since specialized brokers are responsible
    for converting `bitcoins` into classic currencies, including the euro and the
    dollar, and this makes it an international and independent means of payment. Cryptocurrencies
    represent an alternative means of payment based on the `blockchain` with all the
    advantages that this implies (traceability, security, etc.) and this constitutes
    an undeniable advantage. However, this is not the only reason for the surge in
    prices.


    Then, let us emphasize that `Bitcoin` can play the role of safe haven in the event
    of a crisis and in countries whose currency is frequently subject to devaluation.
    Thus, the Chinese government''s policy of controlling the outflow of capital from
    Chinese nationals and the continued decline of the `Yuan` largely contributed
    to the success of `Bitcoin` in the Middle Empire. Consequence: three Chinese platforms,
    `Okcoin`, `Huobi`, and `Botching`, have captured more than three-quarters of global-bitcoin
    volumes since 2016. Some even speak of `Bitcoin` as a Chinese currency.


    But if `Bitcoin` is so popular, it is above all thanks to the prospect of realizing
    a significant and rapid potential capital gain.

