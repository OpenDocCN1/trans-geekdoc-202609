    # 你应该投资加密货币还是交易它们？


    在决定是倾向于购买还是交易加密货币之前，考虑这两种方法之间的差异是非常重要的。详情请下表。


    ## 如果符合以下情况，你可能对购买加密货币感兴趣……


    * 你想拥有整个加密货币。

    * 你准备好预付资产的全部价值。

    * 你希望每个账户都能直接获得底层市场的收益。

    * 你愿意等到拥有货币账户后才能进行买卖。

    * 你对被施加介绍额度限制或最大存款限制没有异议。

    * 你不需要担心存款或取现的额外费用。


    ## 如果符合以下情况，你可能对加密货币交易感兴趣……


    * 你希望在不拥有数字资产的情况下对加密货币的价格进行投机。

    * 你希望通过仅支付初始成本的小部分来杠杆你的。

    * 你希望通过一个账户获得多个底层市场的间接收益。

    * 你希望立即开始交易。

    * 你不想受到最高资金存款限制。

    * 你不想支付存款或取现费用。


    # 加密货币市场


    加密货币诞生于新技术。它们诞生于被称为 `Blockchain`（区块链）或 `blocks`（区块）的技术。这是一种允许所做操作被所有人看到的编程类型。正是在这里，就在这里，为加密货币提供了安全性。


    谁生产加密货币？它们是由矿工生产的，矿工通常是拥有非常强大的计算机设备的程序员，他们需要满足生成这种 `blockchain` 技术所需的要求。当一种新的加密货币产生时，结果是整个社区都能看到它，因为计算机之间存在的连接防止了其中一台计算机抹掉在互联网上留下的该加密货币创建痕迹。


    那么，加密货币是什么？它们是我们将作为支付手段或接收资金的虚拟货币。这使得所进行的收银和支付可以在没有金融中介的情况下完成。


    因此，它是一种不受国家控制的货币。没有国家的中央银行或社区（如欧洲经济共同体）的中央银行可以对加密货币的本质发表支持或反对意见。因此，它们没有法律控制。


    这有其优点，但显然也有其缺点。不方便的地方在于人感到并不很安全，因为如果他不太了解 `blockchain` 技术是什么，他可能会很害怕把钱投入一家提供数字的私人公司，而这个数字将标识你的加密货币。


    它们是字母和数字的快速修正，让你成为该虚拟货币的所有者。那么，它们是什么？它们是既让我们用于收钱又用于支付的虚拟货币，而且由于在市场中报价，由于买卖效应，它们有时会涨得更高，有时会跌得更多，因为人们可以购买或卖出它们，这会在该加密货币与其汇率（无论是另一种加密货币还是法定货币）之间产生波动。


    让我们记住，美元或欧元等法定货币硬币也是与加密货币交叉的货币，而这正是他们意图盈利的地方。


    嗯，我想我们必须制造加密货币有一个非常简单的理由，因为它们将会留下来。随着越来越多的国家接受它们，并在很大程度上，特别是像亚马逊这样的大公司开始例如接受它们作为支付形式，对于加密货币来说不留在我们身边将变得非常困难。


    `blockchain` 技术在多大程度上改变了看待风险的方式。我之前提到的，它们目前没有控制，没有国家或中央银行在监管它们，但是是 `blockchain`
    系统所有成员的信任让加密货币被认为或或少安全。


    当然，已经出现过一些情况，人们人们开始初出现过问题，但每次都在不断改进，这是他们有利的一个积极点。如何制作它们？我们有两种可能。


    1. 如果你是一名计算机程序员，你可以把自己组织成矿工，并考虑自己生产它们的可能性。这显然获得服务报酬就足够了。

    2. 或者另一种可能就是购买它们。要购买加密货币，我们必须去一家卖给我们的机构。它必须是这些生产者或拥有大量加密货币的私人公司之一。


    ## 投资哪些加密货币？


    嗯，我们有好几种。尽管有一个非常脱颖而出，被称为 `Bitcoin`（比特币）。`Bitcoin` 是第一种加密货币。它们于 2008 年出现。起初，很多人认为这不会是什么会留下的东西，也不会真正产生利润，那是一种暂时的时尚。


    然而，情况随着硅谷的一些人而改变了，特别是像比尔·盖茨这样非常有名的人开始对它们产生很大兴趣。那是加密货币 `Bitcoin` 价格大约在 200 多美元的一年，正是硅谷大人物的进入让加密货币
    `Bitcoin` 重新出现并开始上涨。给你一个概念，自 2008 年以来，`Bitcoin` 已经达到了 `$6,000`，大约是它的市场天花板。想象一下，那些在开始就押注
    `Bitcoin` 的人赚了多巨大的财富。


    在它起源时，他们无法制造加密货币，也没有其他程序员也考虑再次制造不同的加密货币的可能性。所以 `Ethereum`（以太坊）也出现了，它目前的交易价格大约在三百美元左右。


    我们还有另一种加密货币，可能是 `Mitocoin` 或者 `Litecoin`（莱特币）也是加密货币，它是那些真正理解其质量的人认为价值最高之一。


    加密货币的质量很大程度上取决于用于生产它们的 `blockchain` 技术。因此，随着技术的进步，加密货币也变得更加强大。这里我们有 `Bitcoin`，它现在已经分叉了，产生了所谓的
    `fork`。


    一个 `fork` 是什么？抱歉，我的英语不是很好，但这个词是这样写的。嗯，这被称为 `fork`，`Bitcoin` 之分叉主要是由于 `Bitcoin`
    变得非常昂贵。对于那些想要获取像 `Bitcoin` 这样的单一加密货币并支付一万五千多元的人来说，这并不是每个人的能力，而这也是它们现在的价格。


