  trans: '

    在获取这些资产时，指南可以为你提供支持。你必须生成一个所谓的“钱包”，并将你的比特币存放在其中；但我建议你不要将它们留在网络中，而是将你的加密货币代码提取出来，即放在离线硬件上。


    在这些离线硬件上，我们要做的是将你的货币从服务器中取出。我知道我的一些朋友的情况，他们在早期购买了比特币，当时投资了像 500 欧元或 1000 欧元这样的资金，现在他们拥有一笔小财富。


    然而，他们遇到了一个问题，他们没有保存好密码，而你是唯一可以访问该代码的人。没有那个代码，你就无法重新进入、恢复你的比特币、将其转给他人或将其兑换为其他货币。


    如果你还没有 100% 地理解这一点，如果你从未投资过股市，如果你从未接触过图表，我求你，请不要接触加密货币。对于外行来说，加密货币可能非常危险。这是由于它们存在巨大的波动，具有极高的波动性。如果通过
    CFD（差价合约）进行操作，要求你是一个专家交易员，而且在任何情况下，都不要用你支付电费、孩子学费或生活必需支出所需的钱来购买它们。


    # 投资加密货币


    在考虑投资加密货币之前，拥有基础知识是非常重要的；因此在给出 3 种策略之前，我将与你分享一些必要的指南，这些将帮助你更好地理解加密货币生态系统。


    ## 进行个人调查


    令人惊讶的是你可以在互联网上获得大量关于加密货币的优质信息，在 `Crypto Trend` 这里你会获得很多。


    花时间彻底研究加密货币市场是极其重要的。


    在这个生态系统中欺诈横行；并不是很难避免，但如果没有基础知识，你很容易掉入陷阱。


    在上面亏钱完全是你的错，所以你得到什么取决于你自己。在学习了基础之后，你可以寻找有助于高级学习过程的课程和导师；在涉及金钱时，知识永远是不够的。


    不要投资加密货币超过你愿意承受的损失金额。


    加密货币市场波动巨大。获得 2000% 利润的诱惑导致人们承担超过债务的风险；但你必须理解，如果利润如此高，风险也会之高。


    然而，波动性也是加密市场的优势之一，因为你损失的永远不会超过你投资的金额；另一方面，你可能正处于正确的时机，让你组合中的加密货币增值 1000%。


    ## 多元化你的投资组合


    这个市场的风险非常高；因此，如果你已经决定投资，考虑这一建议很重要。


    不建议将所有资金都投资到一种货币中。当你进行多元化时，你就降低了风险。例如：如果你所有的资金都投资了 `Ripple`，如果其价格突然下跌，你会遭受很大。另一方面，如果你的投资组合分散在
    `Bitcoin`、`Ripple` 和 `Ethereum` 中，那么在下跌后的冲击将小得多。


    ## 杠杆


    杠杆是一把双刃剑。它赋予用户以超过其存款资金的开仓的能力。在使用它时，你应该极其小心，因为它可以增加利润，也可以增加损失。


    ## 过度交易极其危险


    新投资者往往容易被情绪左右，导致他们过度交易。这并不意味着你会赚钱；相反，它会让你暴露在风险之中。


    ## 投资策略


    ### 1. 持有加密货币


    在加密货币生态系统中，`HOLD` 指的是长期持有，希望资产具有更高的价值。这是风险最低的投资方式之一。


    货币价值可能会下降，但你的代币数量将保持不变；如果货币指数级增长，你的投资资本也会如此。例如，如果你投资了 1 美元，交易价格为 100 美元，你每个代币赚了
    99 美元。如果货币价值下降到 0.20 美元，你每个代币将损失 0.80 美元。


    ### 2. 交易


    由于风险风险，交易是金融市场中风险最大的投资形式之一。它分为三类：


    *   **头线交易 (Scalping)**：包括在短时间内进出市场，通常不超过 2 小时。

    *   **日内交易 (Day Trading)**：包括在建立仓位的当天进出市场。

    *   **波段交易 (Swing trading)**：在超过一天的期间进出的操作。这是三者中风险最低的。


    ### 3. 量化分析


    量化分析包括实施数学和统计技术来做出投资。这种分析试图通过预测或解释不同的经济变量来增加优势。那些使用量化分析评估投资机会的专家被称为 `Quants`。

