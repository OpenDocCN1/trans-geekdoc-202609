    \ complex control procedure which must be carried out each time a certain number\
    \ (\"block\") of changes is requested. This procedure is carried out not by a\
    \ single controller, but by all the voluntary “members”. Once validated, the “block”\
    \ of changes is dated and added to the others in the registry. Finally, let everyone\
    \ read the registry, and you have a blockchain database”. Thus, it is up to the\
    \ network (all the peers) to validate and confirm each transaction.\n\nThis technology\
    \ and this system are the basis of the vast majority of cryptocurrencies, but\
    \ Blockchain applications do not stop there. Indeed, it could disrupt the entire\
    \ financial sector but also certain sectors such as the legal or administrative\
    \ sector by eliminating the need for trusted third parties. No need for a notarial\
    \ act or civil status register or even cadaster with this distributed register\
    \ technology which helps to make data more secure and transparent. Blockchain\
    \ technology is after all a technology whose database cannot be changed without\
    \ meeting certain conditions.\n\n***HOW IS CRYPTOCURRENCY MADE?***\n\nPeople who\
    \ make cryptocurrency are called miners. It is also said that they mine a cryptocurrency.\
    \ Minors are an integral part of the process. Without them, the Blockchain would\
    \ be frozen. A miner in fact confirms the transactions that take place on the\
    \ Blockchain.\n\nFor example, imagine that Peter gives 3 Bitcoins to Paul. The\
    \ transaction will be immediately broadcast on the network, peer-to-peer, made\
    \ up of computers called nodes.\n\nHowever, it is only after a certain period\
    \ of time that the transaction will be confirmed by the computers belonging to\
    \ the networks using the algorithms specific too said Blockchain. Once committed,\
    \ the transaction now forms a new data block for the ledger. It is added to others\
    \ in the existing Blockchain, permanently and immutable.\n\nBehind these computers\
    \ on the network, miners validate transactions. To confirm a transaction, a miner\
    \ must find the product of a cryptographic function that connects the new block\
    \ to its predecessor.\n\nThis is called proof of work. In exchange for their services\
    \ (and the computing power mobilized for this purpose), they obtain a reward that\
    \ takes the form of tokens or tokens.\n\n***HOW TO MINE A CRYPTOCURRENCY?***\n\
    \nTo undermine a cryptocurrency, it is usually sufficient to install software\
    \ on your computer using the processor or the graphics card, or even both, in\
    \ order to be able to solve the cryptographic problem requiring a relatively large\
    \ calculation power, which will allow you to touch new units of the cryptocurrency\
    \ in question. Be careful however, the main cryptocurrencies have become too difficult\
    \ for individuals to mine. The mining of many of them has become largely professionalized\
    \ and takes place in part on Chinese farms, buildings of several thousand m2 where\
    \ tens of thousands of servers run day and night to mine cryptocurrencies (Bitcoin,\
    \ Litecoin, etc.). Faced with this competition, cloud mining solutions have been\
    \ developed. No investment in specific hardware is required. All you have to do\
    \ is get in touch with a company that has invested in the necessary equipment\
    \ and “hire” your computing power. But beware, there are many scams!\n\n***WHICH\
    \ CRYPTOCURRENCY TO MINE?***\n\nObviously, individuals are keen to mine the most\
    \ profitable virtual currencies like Bitcoin, but also Dash, Ethereal, Monero,\
    \ Litecoin, etc.\n\nHowever, it is very difficult today to make money by mining\
    \ a cryptocurrency. It is often much more interesting to invest in virtual currency\
    \ in order to hope to make profits.\n\n***MINER / DEVELOPER: WHO MAKES THE CRYPTOCURRENCY?***\n\
    \nThe role of the cryptocurrency miner is therefore to validate the transactions\
    \ carried out. He is thus paid in tokens of the cryptocurrency for which he has\
    \ confirmed a new block. The role of the developer is very different.\n\nA cryptocurrency\
    \ developer will develop the computer protocol at the base of the cryptocurrency\
    \ which defines, in particular, the number of tokens in circulation, their speed\
    \ of circulation, their storage power, etc. He is somewhat the architect of the\
    \ network.\n\n***BITCOIN, ETHEREAL, RIPPLE: THE MAIN CRYPTOCURRENCIES***\n\nHow\
    \ many cryptocurrencies are there? This often-asked question sounds simple but\
    \ in reality, it is very difficult to know the exact number of virtual currencies.\
    \ No site lists them all.\n\nThe Ministry of the Economy and Finance counted more\
    \ than 2,871 in 2019, without having carried out an update since. There could\
    \ be nearly 3,000 today, but that's not the most interesting thing. It should\
    \ be noted that there are very many cryptocurrencies but that only a few dozen\
    \ can be qualified as popular cryptocurrencies.\n\nWe often tend to rank promising\
    \ cryptocurrencies based on their market capitalization, and rightly so."
