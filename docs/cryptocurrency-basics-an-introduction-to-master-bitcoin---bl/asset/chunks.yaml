  trans: '


    要将欧元兑换为比特币，您必须在该平台注册，提供身份证明文件的电子副本以及近期的发票（燃气、电力、互联网）以证明您的地址。


    # 选择您的加密货币交易所


    ## 平台或虚拟货币经纪商


    为了避免诈骗并更清晰地识别加密货币中间商的服务，《Pacta 法》设立了一项新的特定制度来监管这些数字资产服务供应商（`PSAN`）。根据法国金融市场管理局（AMF）的说法，这些
    `PSAN` 汇集了所有“提供加密资产投资相关服务的金融中介机构”。自 2020 年 12 月起，为了提供加密资产托管服务或访问加密资产或以法定货币买卖加密资产，这些
    `PSAN` 必须在金融市场监管机构进行注册，由后者确保服务提供者的可靠性。任何未注册的参与者都可能被列入 AMF 黑名单。此外，`PSAN` 还可以申请可选的许可，获得许可后将拥有招揽新客户的权利。


    在进行任何投资和交易之前，请检查您计划交易的实体是否在 AMF 黑名单上，其是否已在“金融市场管理局”（`Attire des Marchés Financiers`）注册，并且如果您被招揽，该实体是否拥有赋予此类权利的许可。请注意，通过在线经纪商提供的衍生品进行加密货币交易也是可能的。


    创建一个加密货币钱包。


    无论您采用何种获取方式，都必须创建一个“钱包”来存放您的余额。


    加密货币钱包是以系列数字形式存在的地址，可以通过密码访问。


    您可以免费且简单地在如 `BitAddress.org` 之类的专用平台上为自己创建一个 `Bitcoin` 地址和密码。对于其他加密货币，还存在其他特定平台。例如，`Cryptoryptanor`
    就支持多种货币。


    最后，要使用加密货币支付（或接收加密货币支付），需要一个中间商。您可以在以下之间选择：


    - 类似于经纪商的交易平台；

    - 可下载的软件。


    请注意，这些中间商通常会收取佣金。我们再如何强调仔细选择中间商都不为，其中许多已经破产了。


    此外，还要警惕网络上盛行的各种诈骗，以及拒绝退还您账户内资金的“经纪商”。


    # 如何交易加密货币？


    在全球范围内，涌现出许多投资加密货币市场的新举措。因此，正如我们所看到的，纽约证券交易所（`NYSE`）的母公司洲交易所（`ICE`）于 2018 年 8
    月宣布创建“Bakkt”平台，该平台允许您购买、出售和存储 `Bitcoins`。


    美国也出现了一些专门从事加密货币的信托公司，如 `LLC` 和 `TITbit`。这两家公司除了满足纽约州政府在资本、储备、合规、消费者保护和网络安全方面的要求外，还为著名的
    `GABI` 基金的 `Bitcoin` 持仓提供了计算机存储系统和冷存储库系统的保障。


    想在加密货币市场立足的个人可以转向专门的在线经纪商，他们通过 `CFDs` 提供虚拟货币交易。


    例如，`eToro` 允许您交易 `Bitcoin`、`Ethereal`、`Ripple`、`Bitcoin Cash` 和 `Cardano`。


    `IG` 允许您交易 `Bitcoin`、`Ethereal`、`Ripple` 和 `Litecoin`。您的杠杆比例也将受到限制。事实上，加密资产的 `CFD`
    杠杆不能超过二倍。


    回想一下根据金融市场管理局（`Attire des Marchés Financiers`）基于 2009 年至 2013 年间近 15,000 名法国零售交易者的结果进行的
    `CFDs` 和 `Forex` 交易结果研究，89.4%的零售交易者亏损了资金。


    AMF 还指出，销售此类 `CFD` 的金融中介必须经过批准。


    # 2021 年加密货币税务：如何计算资本利得并申报


    ## 虚拟货币收益


    由于买卖加密货币活动产生的资本利得，自 2019 年 1 月 1 日起已作为“数字资产”征税。这是适用于加密货币交易活动收益的 30%固定税率。尽管如此，纳税人每年拥有
    305 欧元的转让免税额。


    注意：仅在将虚拟货币转换为传统货币（如 `euro`、`dollar` 或瑞士法郎）时才需要纳税，包括资金留在交易所平台未移动的情况。


    资本利得的数量必须在所得税申报表中的“数字资产利得或亏损”栏中注明，并必须附上提供应税交易详情的 `2086` 表。


    ## 投资加密货币的 6 个建议


    1. **理解区块链技术**：在投资此类货币之前，请确保您理解这项创新，特别是其背后的技术。这归根结底涉及充分研究加密货币起源的 `Blockchain`
    技术。此外，特别要关注不同货币之间差异的细节：编程语言、`blockchain` 验证系统、治理，例如货币适应需求数量级变化的能力。


    2. **考虑代币通胀限制**：加密货币的单位称为 `token`。创建的 `token` 数量可以是限制的，正如 `Bitcoin` 一样，总量限制为 2100
    万 `Bitcoins`，这使得产品相对稀缺，从而有助于提高其价值。但加密货币也可能遵循通缩模式。在这种情况下，流通量是无限的，随着时间的推移可能会导致价格停滞甚至下降。


    3. **检查加密货币的透明度**：优先选择拥有明确投资者和开发者的网站、项目介绍以及可能的路线图的加密货币。如果所有这些信息都无法获取，请小心，您可能正在投资庞氏骗局。


    4. **关注加密货币网站**：为了在这一小众且极客的领域保持信息更新，并确保在最佳条件下进行投资，最好在信息所在处进行查找，即扩展到 `Reddit` 或
    `Slack` 等社区网站，这些网站允许您发布、浏览板块、讨论并分享问题和观点。`Bitcoin talk`论坛的功能类似，但它专门用于加密货币（不仅是 `Bitcoin`，因为它有专门的
    `altcoin` 板块）。


    5. **了解开发者的质量及其资金来源**：加密货币成功的关键在于开发这项创新的开发者质量。因此，请检查他们的经验、教育、工作背景等。他们是否形成了一个关系良好的紧密团队？您可以验证他们在
    `Slack` 或 `Reddit` 社区中的互动是否友好且具有建设性。


    最后，您必须知道谁在支付开发费用：是公司还是加密货币以外的私募股权？开发者是否用他们的加密货币？重要的是能够评估开发者的动机和潜在的利益冲突。


    6. **限制对这些波动高风险资产的投资**。


