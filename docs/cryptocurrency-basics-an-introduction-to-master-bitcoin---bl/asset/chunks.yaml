- fmt: '

    Bitcoin, by introducing a cryptographic transaction verification system, eliminates
    the need for a trusted third party. Transactions are carried out directly from
    user A to user B, almost instantaneously and without generating transaction fees.


    In addition, Bitcoin was created so that you no longer have to place your trust
    in banks to carry out transactions.


    Transactions are validated cryptographically. In other words, sellers will no
    longer have to worry about buyers defaulting on payment.


    Finally, the creation of Bitcoin is also a response to a technical problem encountered
    by the first attempt at digital currency called “B-money”. This problem is that
    of a double value. It is okay to send a copy of an attachment by email; however,
    it becomes a huge problem when you want to send money! Impossible to send 1 euro
    while keeping 1 euro! Bitcoin responds technically to this problem by introducing
    blockchain technology which keeps a precise record of all the transactions carried
    out on the network. Thus, all users know the owners of Bitcoins at all times!


    # CHARACTERISTICS OF CRYPTOCURRENCY


    Among the characteristics of cryptocurrencies, we find:


    ### The volatility of cryptocurrencies

    Although the cryptocurrency market is relatively new, it has experienced significant
    volatility due to its huge short-term speculative interests. For example, between
    October 2017 and October 2018, the price of bitcoin climbed to $19,378 before
    falling back to $5,851. On the other cryptocurrencies were relatively stable,
    but new technologies often tend to generate speculative interest. The volatility
    of cryptocurrencies is one of the things that makes this market so exciting. The
    rapid movements of its intraday prices make it possible to take a buy or sell
    position, but they also increase the risk of loss.


    So, if you decide to explore the cryptocurrency market, make sure you have done
    your research beforehand and have developed a risk management strategy.


    ***Cryptocurrency trading hours***


    Devoid of centralized governance, the cryptocurrency market is generally available
    24 hours a day, seven days a week. Transactions are carried out directly between
    individuals, on exchange platforms present all over the world. However, there
    may be periods of downtime when the market adapts to infrastructure updates, also
    known as "forks".


    With IG, you can trade cryptocurrencies against fiat currencies like the US dollar,
    from 5 a.m. on Saturday to 11 p.m. on Friday (Paris time).


    ### Better liquidity

    Liquidity is a measure of how quickly and easily a cryptocurrency can be converted
    into cash, without impacting market prices. Liquidity is an important factor that
    enables better prices, shorter transaction times, and increased precision in terms
    of technical analysis.


    In general, the cryptocurrency market is considered illiquid (or illiquid) because
    transactions are scattered across multiple exchanges, which means that relatively
    small transactions can have a huge impact on market prices. This is part of the
    reason the cryptocurrency markets are so volatile.


    However, with IG you can get better liquidity when trading cryptocurrencies, as
    we get the best prices using data from multiple exchanges. In other words, your
    transactions will generally be executed faster and at a lower cost.


    ### Possibility of positioning for the purchase or the sale

    Buying a cryptocurrency means buying the asset in advance in the hope that it
    will rise in value. But when you trade the price of a cryptocurrency, you can
    profit from markets that are going down and up. We will speak respectively of
    a "short" or "short" position or of a "long" position.


    ### Long position

    For example, suppose you decide to open a short CFD position in Ether because
    you believe its price will go down. If the value of ether falls against the US
    dollar, you would gain. However, if the value of the ether were to rise against
    the US dollar, you would suffer a loss.


    ### Leveraged exposure

    CFD trading is a leveraged product, which allows you to open a position only with
    a small portion of the trade value. In other words, you could gain significant
    exposure to the cryptocurrency market while locking up only a relatively small
    portion of your capital.


    Profits or losses from your cryptocurrency transactions will reflect the full
    value of the position at the time it is closed, so trading with leverage gives
    you the opportunity to make big gains from a relatively small investment. However,
    losses can also be magnified and could even exceed your initial deposit for each
    individual trade. This is why it is crucial to carefully consider the total value
    of a leveraged position, before placing your CFD order. It is also important to
    establish an adequate risk management strategy, which should include the appropriate
    stops and limits.


    ### Open an account quickly

    Buying or selling cryptocurrency involves going through an exchange, which requires
    creating a currency account and storing the cryptocurrency in your own digital
    wallet. This process can be restrictive and time-consuming. In contrast, trading
    cryptocurrencies with IG does not require direct access to an exchange, as we
    expose ourselves to the underlying market on your behalf. You won''t need to open
    or manage a currency account, so you can be ready to trade much faster. Indeed,
    the application to open an account is made online and does not take more than
    5 minutes to complete.


    # CHARACTERISTICS OF BITCOIN


    When you go tomorrow to buy Bitcoin at your tobacconist through BYKEP, it is interesting
    for you to understand its characteristics. Bitcoin has, in particular, all the
    characteristics of a currency:


    - **Uniformity**: All Bitcoins are uniform, they are all equal. No one can tell
    one bitcoin from another. Every Bitcoin has the same value.

    - **Divisibility**: The set of bitcoins is divisible. Their divisibility is more
    important than a traditional currency. The smallest unit of Bitcoin is called
    the `Satoshi`.

    - **Portability**: Bitcoins are easily transportable through digital (online)
    or physical (offline) Bitcoin wallets. They are also easily exchangeable.

    - **Longevity**: Once Bitcoin is issued through mining activity, it will no longer
    disappear in the system. Holders can change, but Bitcoin itself remains unique
    and unchanged over time.

    - **Recognition**: It is easy to identify a Bitcoin from another cryptocurrency.
    The cryptographic code of a Bitcoin is unique.

    - **Security**: Bitcoin is inherently protected from tampering and theft by the
    tamper-proof Bitcoin blockchain protocol. Security breaches never come from the
    blockchain, but often from exchange platforms.


    By observing these characteristics, we see that Bitcoin has everything to become
    the global currency of today and tomorrow. The main difference with a traditional
    currency is that Bitcoin is not tied to a state or a central bank, so its price
    fluctuates freely depending on supply and demand. User confidence is based on
    mathematical and cryptographic processes which form the basis of the transaction
    validation protocol.


    ### 1. It''s decentralized

    The bitcoin network is not controlled by a central authority. Every machine that
    mines bitcoin and processes transactions is part of the network, and the machines
    work together. This means that in theory, a central authority cannot tinker with
    monetary policy and cause a debacle - or simply decide to take their streaks off
    them, as the European Central Bank decided to do in Cyprus in early 2013. And
    if any part of the network goes offline for some reason, the money keeps flowing.


    ### 2. It''s easy to set up

    Conventional banks make you jump through the hoops just to open a bank account.
    Setting up merchant accounts for payment is another Kafkaesque task, besetby bureaucracy.
    However, you can set up a bitcoin address in seconds, with no questions asked
    and at no cost.

    '
