- fmt: '

    To convert your euros into Bitcoins, you must register on this platform by providing
    an electronic copy of an identity document and a recent invoice (gas, electricity,
    internet) to prove your address.


    # CHOOSE YOUR CRYPTOCURRENCY EXCHANGE


    ## Platform Or Virtual Currency Broker


    To avoid scams and see more clearly in the offer of cryptocurrency intermediaries,
    the Pacta law has set up a new specific regime governing these service providers
    on digital assets (`PSAN`). According to the AMF, these `PSAN` bring together
    all the “financial intermediaries who offer various services relating to an investment
    in crypto-assets”. Since December 2020, these `PSAN` must, in order to be able
    to offer crypto-asset custody services or access to crypto-assets or the purchase/sale
    of crypto-assets against currencies having legal tender, must be registered with
    the financial market policeman who will ensure the reliability of the service
    provider. Any player who has not registered may find himself on the AMF''s blacklists.
    In addition, an optional authorization can also be requested by the `PSAN` which,
    after having obtained it, will have the right to be able to canvass new customers.


    Before any investment and any transaction, check that the actor with whom you
    plan to deal is not on the AMF blacklists, that he is registered with the `Attire
    des Marchés Financiers` and, if you are canvassed, that this actor has the authorization
    which gives him the right to do so. Note that it is also possible to trade cryptocurrencies
    through derivatives offered by online brokers.


    Create a cryptocurrency wallet.


    Whatever your method of obtaining, you will have to create a "wallet" in order
    to keep your change.


    A crypto wallet is an address in the form of a series of numbers that can be accessed
    by means of a password.


    You can create a `Bitcoin` address and password for yourself for free and quite
    simply on a dedicated platform like `BitAddress.org` for example. For other crypto-currencies,
    other specific platforms exist. `Cryptoryptanor` thus supports several currencies.


    Finally, to pay with a cryptocurrency (or receive a payment in cryptocurrency),
    an intermediary is necessary. You will have the choice between:


    - an exchange platform similar to a broker;

    - software to download.


    Please note, these intermediaries usually charge commissions. We also cannot recommend
    enough that you choose your intermediary carefully, many of them have already
    gone bankrupt.


    Also, watch out for scams of all kinds that flourish on the web and "brokers"
    who refuse to return the sums held in your account.


    # HOW TO TRADE CRYPTOCURRENCY?


    All over the world, new initiatives are developing to invest in the cryptocurrency
    market. Thus, as we have seen, the New York Stock Exchange announced in August
    2018 the creation of the "Bakkt" platform by the Intercontinental Exchange (`ICE`),
    the parent company of the New York Stock Exchange (`NYSE`), which allows you to
    buy, sell and store `Bitcoins`.


    But the United States is also seeing the creation of trust companies specializing
    in cryptocurrencies such as `LLC` and `TITbit`, two companies which, in addition
    to meeting the requirements of the New York State Department in terms of capitalization,
    reserves, compliance, protection of consumers, and cybersecurity, also provide
    guarantees of computer storage systems and cold storage vault systems for `Bitcoin`
    holdings of the famous `GABI` fund.


    The individual who wants to position himself on the cryptocurrency market can
    turn to a specialized online broker who offers virtual currency trading via `CFDs`.


    For example, `eToro` allows you to trade `Bitcoin`, `Ethereal`, `Ripple`, `Bitcoin
    Cash`, and `Cardano`.


    `IG` allows you to trade `Bitcoin`, `Ethereal`, `Ripple`, and `Litecoin`. You
    will also be limited in terms of leverage. Indeed, a `CFD` on crypto-actives cannot
    have leverage greater than two.


    Recall that 89.4% of retail traders lose money according to the Study of results
    of retail investors on `CFDs` and `Forex` trading in France carried out by the
    `Attire des Marchés Financiers` on the basis of the results obtained by nearly
    15,000 French retail traders from 2009 to 2013.


    The AMF also points out that the financial intermediary who markets this type
    of `CFD` must be approved.


    # CRYPTOCURRENCY TAXATION 2021: HOW TO CALCULATE THE CAPITAL GAIN AND DECLARE


    ## THE GAINS IN VIRTUAL CURRENCY


    Capital gains generated by the activity of buying and reselling cryptocurrencies
    are taxable as "digital assets" since 1 at January 2019. This is the flat tax
    of 30% which applies to gains from cryptocurrency trading activities. The taxpayer
    nevertheless has a transfer allowance of 305 euros per year.


    Note: transactions are only taxable when converting virtual currencies into traditional
    currencies such as the `euro`, the `dollar`, or the Swiss franc, including if
    the money remains on the exchange platform without moving.


    The number of its capital gains must be indicated in the income tax return, in
    the box “Capital gains or losses on digital assets”, to which must be attached
    the form `2086` providing details of taxable transactions.


    ## 6 TIPS FOR INVESTING IN CRYPTOCURRENCY


    1. **Understanding Blockchain Technology**: Before investing in this type of currency,
    make sure that you understand this innovation and especially the technology behind
    it. This ultimately comes down to fully studying the `Blockchain` technology from
    which cryptocurrencies originate. Also, and especially, pay attention to the details
    that differentiate currencies from one another: the programming language, the
    `blockchain` validation system, governance, the currency''s ability to adapt to
    an order of magnitude change of demand for example.


    2. **Take into consideration the token expansion limit**: The unit of cryptocurrency
    is called a `token`. The number of tokens created can be limited, as is the case
    with `Bitcoin` which will be limited to 21 million `Bitcoins` in circulation,
    making the product relatively rare, which of course contributes to its value.
    But a cryptocurrency can also follow a deflationary pattern. In this case, the
    quantity of money in circulation is unlimited, which could over time encourage
    the stagnation (or even the decrease) of its price.


    3. **Check the transparency of virtual currency**: Favora cryptocurrency with
    a website with clearly identified investors and developers, a presentation of
    the project, possibly a road map indicating the planned advances. If none of this
    is accessible, beware, you could invest in a Ponzi scheme.


    4. **Stay informed on cryptocurrency websites**: To be up to date in this ultra-niche
    and ultra-geek field, and therefore ensure an investment under the best conditions
    by having all the information on the targeted asset, it is better to look for
    the information where it is found, that is say on the web! Many cryptocurrencies
    offer their own websites but broaden your search to community websites like `Reddit`
    or `Slack` which will allow you to publish, consult sections, discuss, and share
    issues and opinions. The `Bitcoin talk` forum fulfills the same role but is exclusively
    devoted to cryptocurrencies (not just `Bitcoin` because it has a dedicated `altcoin`
    section).


    5. **Learn about the quality of virtual currency developers and their funding**:
    What makes the success of a cryptocurrency above all is the quality of the developers
    who are at the origin of this innovation. So, check their experience, education,
    work history, etc. Do they form a tight-knit team with good rapport? You can verify
    that their interactions on the `Slack` or `Reddit` community are both cordial
    and constructive.


    Finally, you must know who pays the developers: a company or a private equity
    fund outside of cryptocurrency? Are developers paid with their cryptocurrency?
    The important thing is to be able to assess the motivation of developers and any
    conflicts of interest.


    6. **Limit your investments in these volatile high-risk assets**.

