  trans: "\n\n加密货币比特币由中本聪（Satoshi Nakamoto）于 2008 年创立（我们不知道他是谁，是男性还是女性，甚至是一个人还是几个人），它是加密货币之首。它某种程度上是加密货币领域的数字黄金标准，是该领域的基准。这种主要的加密货币在\
    \ 2017 年 8 月经历了一次“分叉”。比特币社区对交易速度的分歧导致了新货币的诞生：`Bitcoin Cash`，它立即升至加密货币前十名中的第三位，并从那时起一直保持在前十名中。\n\
    \n事实上，与比特币并行的还有许多其他加密货币，例如 `Ethereal`（以坊），它在 2016 年夏天也经历了一次“分叉”。`Ethereal` 比比特币更完善，基于所有的区块链应用程序，因为它不仅可以处理交易，还能处理复杂的合约和程序。我们还可以提到\
    \ `Ripple`，它不仅是一种加密货币（`XRP`），还是一个独立于 `XRP` 代币运行的传输系统。\n\n它本质上是一种旨在促进银行间支付的数字支付协议。`Litecoin`、`Cardano`、`NEM`、`Monero`、`Stellar`\
    \ 或 `Iota` 也是经常进入十大重要加密货币列表的货币。自从中本聪创立比特币以来，已经出现了约 3000 种加密货币。需要注意的是，加密货币数量众多，新货币会不断出现并挑战该领域的巨头，但社区内部的分歧也可能导致“分叉”（法语为\
    \ fork），即社区内部的分裂以及基于旧技术但经过修改而创建的新货币。\n\n# 加密货币今日价格\n\n尽管新冠病毒危机也影响了加密货币的价格（这些货币在封锁人口以遏制\
    \ Covid-19 疫情期间经历了大幅下跌），但它们在年底很大程度上追回了损失。比特币及随后的其他虚拟货币在圣诞期间的涨势至少可以说是令人印象深刻的。\n\
    \n在这种动荡的背景下，加密货币终于成功立了其作为避风港的地位。正如 NEOMA 商学院经济学家、教师兼研究员娜塔莉·詹森（Nathalie Janson）在\
    \ 2020 年 12 月初强调的：“激进的经济不确定性、负利率、美元疲软”都是导致加密货币价格上涨的因素。\n\n比特币在 2021 年初创下了超过 40,000\
    \ 美元的新纪录，在市值方面领先于加密货币。\n\n请记住，比特币的价格与全球经济状况部分相关，更多是遵循动量效应，而且大多数其他虚拟货币在首个加密货币期间是相关的。但这种情况越来越不再成立，挑战者们成功地取得了显著的突破，例如\
    \ `Tether` 或 `Litecoin`。除了宏观经济背景外，还可能存在与加密货币演变相关的上升因素，例如比特币减半，它大约每 4 年发生一次，上一次发生在\
    \ 2020 年 5 月 11 日。\n\n这种现象表现为每隔 210,000 个交易区块，矿工奖励减半，并几乎系统律性地导致价格上涨。\n\n# 虚拟货币排名\n\
    \n## 根据 2021 年市值排名\n\n你可能在想知道买哪种加密货币，或者正在寻找关于投资哪种加密货币或交易哪种加密货币的信息。投资者通常青睐市值庞大且价格较高的加密货币，这反映了对该货币的某种信心以及代币的相对强度。\n\
    \n根据市值发现这 10 大最重要虚拟货币排名，市值即所有流通代币的总价值（代币 `X` 的价格乘以流通量）。\n\n1. `Bitcoin (BTC)`\n\
    \   - 创建日期：2009 年\n   - 截至 2021 年 1 月 7 日的市值：6,380.6 亿美元\n   - 一年价格波动（美元）：约 +336%\n\
    \n2. `Ethereum (ETH)`\n   - 创建日期：2015 年\n   - 截至 2021 年 1 月 7 日的市值：1,296.35 亿美元\n\
    \   - 一年价格波动（美元）：约 725%\n\n3. `Tether (USDT)`\n   - 创建日期：2015 年\n   - 截至 2021\
    \ 年 1 月 7 日的市值：221.81 亿美元\n   - 一年价格波动（美元）：约 -0.03%\n\n4. `Ripple (XRP)`\n   -\
    \ 创建日期：2015 年\n   - 截至 2021 年 1 月 7 日的市值：113.99 亿美元\n   - 一年价格波动（美元）：约 18%\n\n\
    5. `Litecoin (LTC)`\n   - 创建日期：2013 年\n   - 截至 2021 年 1 月 7 日的市值：102.18 亿美元\n\
    \   - 一年价格波动（美元）：约 267%\n\n6. `Cardano (ADA)`\n   - 创建日期：2017 年\n   - 截至 2021\
    \ 年 1 月 7 日的市值：91.02 亿美元\n   - 一年价格波动（美元）：约 705%\n\n7. `Polkadot (DOT)`\n   -\
    \ 创建日期：2020 年\n   - 2021 年 1 月 7 日市值：886.8 亿美元\n   - 一年价格波动（美元）：约 242%\n\n8. `Bitcoin\
    \ Cash (BCH)`\n   - 创建日期：2017 年\n   - 2021 年 1 月 7 日市值：801.2 亿美元\n   - 一年价格波动（美元）：约\
    \ 85%\n\n9. `Stellar (XLM)`\n   - 创建日期：2014 年\n   - 2021 年 1 月 7 日市值：665.8 亿美元\n\
    \   - 一年价格波动（美元）：约 539%\n\n10. `Chainlink (LINK)`\n    - 创建日期：2017 年\n    - 2021\
    \ 年 1 月 7 日市值：638.6 亿美元\n    - 一年价格波动（美元）：约 684%\n\n# 加密货币的用途\n\n虚拟货币是用于购买商品和服务的支付手段。使用加密货币的原因是什么？像任何货币一样，加密货币可用于购买商品和服务。由于不受中央机构的影响并逃避监管，它们长期以来一直是非法交易（勒索软件、毒品交易等）的领地，但通过民主化和吸引更广泛的观众正逐渐消除声声。现在，加密货币越来越多地用于合法交易。\n\
    \n虚拟货币（如 `Bitcoin`）可以购买许多普通消费品。例如，可以使用 `Bitcoin` 购买电脑设备，也可以购买食物、珠宝、装饰品、文化产品等。\n\
    \n`Overstock` 是一个综合性网站接受 `Bitcoin` 支付。\n\n使用其他加密货币支付日常用品较为困难，但并非不可能。例如，`Ether`\
    \ 可以购买 2017 年春季在 `La Chomping (Paris X)` 出出的年轻艺术家作品。\n\n"
