    Stellar XLM 也是一种蓬勃发展的加密货币，旨在用户创建和交易从法币到加密货币的所有数字资产。Stellar 的目标是让全球所有的金融系统在一个网络上协同工作。


    ## 4. Tether (USDT)


    Tether 被称为稳定币，它声称为用户提供了两重世界的优势：开放的区块链技术和传统货币。Tether 还以用户熟悉的货币提供各种商品和服务，从而鼓励他们留存在该平台上。


    ![](img/image00153.jpeg)


    ## 5. Cardano (ADA)


    Cardano 及其加密货币 ADA 在加密市场中日益受欢迎。该交易所是一个去中心化的、基于权益证明且技术驱动的平台。由于该平台使用智能合约，你可以像监控比特币一样监控交易，并像以太坊一样处理支付。


    ![](img/image00154.jpeg)


    ## 6. Celsius (CEL)


    这是一个具有成为银行潜力的加密货币。在 2018 年完成了筹集 2000 万美元的成功众筹活动后，该币在 2020 年飙升增长，获得了令人印象深刻的收益。


    ![](img/image00155.jpeg)


    ## 7. Dogecoin (DOGE)


    狗狗币的市值达 70 亿美元，它经历了重重挑战，成为市场上最流行的币之一。用户对其区块链完成交易的速度赞赞有加，而且该币注将达到更高的高度。


    ![](img/image00156.jpeg)


    ## 8. Monero (XMR)


    Monero 以其隐私性闻名：其他区块链是公共账本，而它拥有一个更不透明的处理系统。如果你注重加密货币的隐私，发送者和接收者的身份是匿名的，那么你会喜欢使用
    Monero。


    ![](img/image00157.jpeg)


    ## 9. Tron (TRX)


    波是一个去中心化系统，其货币 TRX 在市场上表现良好。凭借超过 1700 万个账户和 14 亿次完成的交易，波被描述为增长最快的加密货币和公链之一。


    ![](img/image00158.jpeg)


    ## 10. Zcash (ZEC)


    Zcash 也以其机密性和基于隐私的系统闻名，它为用户提供两个地址。第一个地址是公开可见的透明地址，第二个地址是私密的屏蔽地址。该币的市值超过 10 亿美元。


    ![](img/image00159.jpeg)


    请注意，这些币并没有按照特定顺序排列。加密货币市场也高度波动，这意味着根据其涨跌情况，某种币今天可能位列前十，明天就消失了。


    比特币目前处于市场顶端，并将保持这种状态很长时间，但上述货币在市场多元化方面也表现出色。虽然建议购买比特币，但也再次与这些货币进行交易：通过与它们交易，你可以降低投资风险并享受其他货币提供的价值。


    想象一下将所有的加密货币投资都只放在一种币上？当这种币在市场中崩盘时会发生什么？只交易一种币绝不是明智之举！现在，让我们通过分析一些市场顶级交易所来讨论加密货币交易所是如何工作的。


    17


    # 不同交易所是如何运作的


    我们刚刚讨论了加密货币交易所是如何工作的。现在我们将分析一些市场顶级交易所。


    ## 1. Coinbase


    Coinbase 是一个非常流行的交易所，成立于 2012 年。它非常安全且具有许多功能。


    ### 优点

    - 它是一个安全的平台。

    - 它有一个良好的用户界面。

    - 它提供高级功能。


    ### 缺点

    - 它们收取的费用高。

    - 它不支持所有的加密货币。

    - 美国 Coinbase 的交易对比其他平台少。


    ## 2. Cash App


    Cash App 是一种允许用户交易比特币的银行。它非常棒，因为它提供了许多支付方式。


    ### 优点

    - 它提供点对点转账。

    - 用户可以提取比特币。

    - 它有一个简单的界面。


    ### 缺点

    - 该平台仅支持某些加密货币。

    - 它对交易收取费用。

    - 比特有提现限制。


    ## 3. Binance


    币安成立于 2017 年，专注于山寨币交易。当你使用币安的原生加密货币 `BNB` 时，费用会降低。


    ### 优点

    - 有多种加密货币和交易对。

    - 它的费用比其他交易所低。

    - 它提供高级图表功能。


    ### 缺点

    - 美国的大约 22 个州（包括纽约州）不支持币安的支持。

    - 该平台对用户更友好。

    - 它的交易对比国际交易所少。


    ## 4. Bisq


    Bisq 是一个无论用户的国籍或位置都可以访问的交易所，无需身份识别。在该平台的交易费用可用 `BTC` 或 `BSQ` 支付。


    ### 优点

    - 它是一个去中心化平台。

    - 它有许多支付选项（包括 Zelle）。

    - 它有适用于 Android 和 iOS 的移动应用程序。


    ### 缺点

    - 该平台并非为活跃交易设计。

    - 交易量有时较低。

    - 交易速度取决于支付方式，可能会缓慢。


    ## 5. EToro


    EToro 是最流行加密货币的首选。它是一个多资产平台，你可以在这里交易股票。


    ### 优点

    - 它是一个多资产平台，你可以交易股票。

    - 你可以和专家一起投资并复制顶级交易员。

    - 股票 0 佣金且交易费具有竞争力。


    ### 缺点

    - 客户服务可以改进。

    - 非交易费用较高。

    - 身份验证过程缓慢。


    '
