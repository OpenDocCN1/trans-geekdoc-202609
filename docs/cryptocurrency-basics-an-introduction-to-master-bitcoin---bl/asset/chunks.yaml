    With these first questions we can get an idea of whether it is really an innovation
    and improvement or if on the other hand, they wanted to put the Blockchain by
    force in a system that did not need it. From here, it is necessary to assess a
    series of parameters that allow us to obtain a fundamental overview of the project.


    The main parameters would be:


    - **Quality of the whitepaper**: This document is the DNA of the project, to distinguish
    the quality ones from the others it is necessary to read the white papers of projects
    that have already demonstrated their solidity and compare them with the new ones
    that we are inspecting. It is important to understand at a basic level the operation
    of the project and to be able to visualize its technical feasibility. It can be
    useful to rely on forums such as `bitcoin` to better understand the project.

    - **Team**: It is a very important element, as in any startup, the human team
    behind it and their ability to overcome complex situations are what can make the
    difference between the failure or the success of the project. It is interesting
    to see their "faces" on the web as this shows that they trust their work by putting
    their reputation at stake. It is also important that they have recognized "advisors"
    within the blockchain ecosystem who collaborate on the project.

    - **Capitalization / users ^ 2**: This metric is very interesting to take into
    account since most projects related to cryptocurrencies have the community effect,
    that is, their value should increase in proportion to the square of the number
    of users. Values lower than unity are ideal, although in many cases values that
    exceed one hundred or even one thousand are seen, which would be an indicator
    to stay away from said critical currency, by showing a symptom of being overvalued.

    - **Limited units**: It is essential that the founders do not have the ability
    to create new units when they wish.

    - **Roadmap**: All projects must have a well-structured and justified planning
    of the steps they will follow in the short, medium, and long term.

    - **Github**: This tool is a collaborative development platform. Most major projects
    have a thread on this platform and the developer community validates the quality
    of the code and makes new contributions to improve the project. We must look at
    the size of this community.


    We advise weighing these parameters according to their relative importance and
    obtaining an overall score.


    ***Find a good time to buy.***


    Although I believe that a cryptocurrency must pass the fundamental filter to be
    considered a purchase option, it is not a sufficient reason.


    The price has to confirm the decision to buy. It is useless to invest in a good
    project if its price cannot get out of a downtrend, this fact could mean that
