  trans: "\n\n再次感谢选择本书，如果您喜欢，请务必在亚马逊上留下简短的评论。\n\n我非常想听听您的想法。\n\n# 1 \n\n# 加密货币\n\n\
    自从欧元引入以来，我们欧洲人已经习惯了出国度假，而不必考虑汇率和其他当地货币的特殊性。然而，并非所有人都是如此：在欧洲以外的任何地方，稍微跨越边界就会产生不必要的费用，旅行结束时，我们经常发现口袋里多了一堆无法使用的票据。通用货币的迷人想法比欧元早得多，但直到最近，我们才见证了一个真正原型的诞生：`Bitcoin`。然而，许多问题随之而来。比特币能成为全球货币吗？其他加密资产呢？根据什么标准判断加密货币？它们的未来将如何？\n\
    \n为了回答这些问题，我们必须观察 `Bitcoin` 的诞生及其前身，还要观察整个加密资产生态系统的发展。\n\n然后，我们将研究加密货币的本质和哲学，以反思\
    \ 2018 年遇到的问题。\n\n加密货币既指加密货币，也指点对点支付系统。因此，这些数字货币在意义上是虚拟货币，因为它们的特征是缺乏物理支撑：既没有硬币或钞票，也不可能支票或银行卡进行支付。\n\
    \n这些是替代货币，在世界上任何国家都不是法币货币。它们的价值不挂钩于金价或传统货币，也不受中央机构或金融机构的监管。它们的背后没有中央银行。然而，安全和透明是它们的主要资产！因为事实上，加密技术保护了交易，所有交易均在公共领域内进行验证并记录，得益于\
    \ `Blockchain` 技术确保了机性和真实性。\n\n# 区块链：基础的基础技术\n\n## 加密货币\n\n所有加密货币都基于同一个原理：`Blockchain`。加密货币是以区块链的形式存储在计算机上一系列数字。\n\
    \n这个原理实际上非常简单，在《回声》（Les Echos）发表的《比特币与加密货币：新数字币》章节中解释得非常清楚：“取一个数据库。允许任何人对该数据库进行更改，唯一的条件是声明自己为‘成员’。设置一套非常长且复杂的控制程序，每当请求一定数量（‘区块’）的更改时就必须执行。该程序不是由单一控制者执行，而是由所有自愿的‘成员’执行。一旦通过验证，更改‘区块’就会被标记并添加到注册表的其他区块中。最后，让所有人读取注册表，你就拥有了一个`blockchain`数据库”。因此，由网络（所有节点）来验证和确认每笔交易。\n\
    \n这项技术和系统是大多数加密货币的基础，但 `Blockchain`的应用并不止于此。事实上，它可以通过消除对信任第三方的需求，颠覆整个金融部门，还可以影响法律或行政部门等某些部门。有了这种分布式注册技术，不再需要公证行为、户籍登记甚至地籍登记，这种技术有助于使数据更安全、更透明。毕竟，`Blockchain`\
    \ 技术是一种在不满足某些条件的情况下无法更改其数据库的技术。\n\n### 加密货币是如何制造的？\n\n制造加密货币的人被称为矿工。人们也说他们在挖掘加密货币。矿工是这一过程中不可或缺的一部分。没有他们，`Blockchain`\
    \ 就会冻结。例如，想象 Peter 给了 Paul 一些 `Bitcoins`。\n\n然而，只有在一段时间之后，交易才会由所谓的 `nodes` 组成的\
    \ `network` 确认。在 `Blockchain` 的背后，矿工负责验证交易。为了确认交易，矿工必须找到一个将新区块与其前一个区块连接起来的加密函数。\n\
    \n这被称为 `proof of work`（工作量）。作为他们服务（以及计算力）的回报，他们获得形式为加密货币 `tokens` 的奖励。\n\n###\
    \ 如何挖掘加密货币？\n\n要挖掘加密货币，通常只需要在计算机上使用 `processor` 或 `graphics card`（甚至两者都有）安装软件，以便解决需要较大计算能力的加密问题，这将让你接触到相关加密货币的新单位。但请注意，主要的加密货币对于个人来说已经变得太难挖掘了。许多货币的挖掘在很大程度上已专业化，并发生在中国矿场——即数万服务器日夜运行以挖掘加密货币（`Bitcoin`、`Litecoin`\
    \ 等）的数千平方米建筑中。面对这种竞争，云矿解决方案运而生。不需要投资特定的硬件。你只需要联系一家投资了必要设备的公司，“租赁”你的计算力即可。\n\n\
    ### 挖掘哪种加密货币？\n\n显然，个人渴望挖掘利润最高的虚拟货币，如 `Bitcoin`，以及 `Dash`、`Ethereal`、`Monero`、`Litecoin`\
    \ 等。\n\n然而，今天通过挖掘加密货币来赚钱非常困难。投资虚拟货币以期获利通常更有趣。\n\n### 矿工/开发者：谁制造了加密货币？\n\n因此，加密货币矿工的角色是验证执行的交易。\n\
    \n开发者的角色则完全不同。\n\n加密货币开发者将开发加密货币基础计算机协议，该协议特别定义了流通中的代币数量、流通速度、存储能力等。他某种意义上是网络的架构师。\n\
    \n### BITCOIN, ETHEREAL, RIPPLE：主要的加密货币\n\n有多少种加密货币？这个经常被问的问题听起来很简单，但实际上，很难知道虚拟货币的确切数量。没有网站列出所有它们。\n\
    \n经济和财政部在 2019 年统计了 2,871 种，此后没有进行过更新。今天可能有近 3,000 种，但这并不是最有趣的地方。应该注意的是，加密货币非常多，但只有几十种可以被认为是流行的加密货币。\n\
    \n"
