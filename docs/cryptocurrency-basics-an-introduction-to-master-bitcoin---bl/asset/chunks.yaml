    Last but not least, there is hardly anyone left from the original group of companies
    that supported the initiative, Mastercard, Visa, PayPal, Stripe, eBay and several
    others have withdrawn, and it should come as no surprise. They all have very different
    interests to coincide in the same boat.


    Based on the above, what we may see from Libra is one more payment processor from
