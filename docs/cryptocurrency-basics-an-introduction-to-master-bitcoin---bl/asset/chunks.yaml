    任何股票或房地产投资者都不会在心血来潮时才进行投资。他们知道这是一个冒险的步骤，不应该听天由命。在投资某项业务之前，有必要理解并确定投资目标以及如何实现这些目标。必须对将实现的
    `profits`（利润）以及投资持续的时间有一个大致的概念。


    这也是加密货币投资者也应该具备的心态。让我们看看加密世界中两种主要的投资策略是什么。


    ## 加密货币的长期投资


    这是当我们预期其价格随时间推移而增长时进行的加密货币投资。这听起来非常直观。在这种情况下，我们讨论的是一种应该维持 6 个月到 1 年的投资。但这取决于个人，因为有人会维持
    5 到 10 年的投资。投资可以分阶段进行，也可以一次性完成。


    ### 长期投资策略


    在投入任何资金之前，我们必须明确投资目标：


    ● 你会在加密货币达到某个价格或在某个时间后卖出吗？

    ● 你会在不同时间分批卖出还是一次性卖出？

    ● 你是否愿意为了短期投资而放弃你的长期愿景？例如，如果赌博策略改变或实施了可能影响你投资经济状况和长期价格的新法律，那么你可能应该在卖出之前重新考虑。


    你应该做一些研究，以决定哪些加密货币最方便或最适合长期投资。检查以下项目是有好的：


    ● 你是否有一支强大的开发者和创始人团队？

    ● 加密技术是否比它的竞争对手更好？

    ● 你的路线图或计划有多好？

    ● 他们是否在解决现实世界的问题？


    如果你对你投资的加密货币真的有信心，即使在价格趋势向下时也应该保持冷静并坚持你的投资。这很重要，因为许多投资者由于“恐慌”而亏了钱。那时只剩下遗憾了。


    ### 进行长期投资的理由


    ● 无需关注市场的每日波动，你会变得更冷静。压力更小更健康。

    ● 你坚信加密货币长期来看将带来更好的回报。

    ● 你是那些押注加密货币是经济未来的人之一。


    这听起来可能像是一种“希望”，但事实是，这些是每个人长期看好加密货币的合理理由。


    ## 投资短期加密货币


    短期加密货币投资到底有多短？我们必须记住，这些是在短时间内进行的投资，希望获得快速回报。这些时期可能短至几秒、几分钟、几天、周甚至几个月。


    ### 短期加密货币投资是如何运作的？


    与长期加密投资一样，你必须对你的投资有明确的目标。你必须问问自己：


    ● 你愿意接受多大的损失？如果在加密货币价格突然下跌时帮助你控制损失。

    ● 你希望从这项投资中获得什么收益？这将让你对应该买入/卖出加密货币的价格有一个概念。

    ● 你是否有足够的耐心和时间来跟踪和研究加密货币市场的起伏以及相关新闻？

    ● 你是否有能力对加密货币市场进行技术分析？这非常重要，所以你在投资之前最好先学习。

    ● 你的短期策略是否更好，也就是说，它是否会比你长期投资给你提供更好的红利？


    研究哪种是适合短期投资的最佳加密货币是非常重要的——


    一个可以给你提供思路的非常简单的指南是检查你的加密货币是否符合以下短期投资的条件：


    ● 它有高交易量，也就是说，每分钟都有很多人买卖它。

    ● 市值较低。

    ● 它们在社交媒体和新闻中处于趋势中。

    ● 你拥有 `ICO` 或刚完成你的 `ICO`。最好在低价买入。


    我们很清楚 `Ethereum` 和 `Bitcoin` 可以在短期内交易，但在较新的加密货币中承担一些“不心疼”的风险是好的。


    在 `Stellar`、`NEM`、`IOTA` 和 `NEO` 等近期加密货币中承担风险的投资者已经在短期内获得了巨额利润。


    通过短期投资，你拥有短时间内获得大量资金的优势。然而，这是一把双刃剑。其缺点包括：


    ### 缺点


    ● 它们需要大量的精力和时间，因为必须不断监控价格和市场波动。

    ● 这是一项高风险投资，可能会损失更大，因为价格可能在短期内下跌。

    ● 它可能会你的健康，因为可能非常情绪化且压力巨大。


    ### 哪种是最佳策略？


    这不是一个准确的答案，因为它完全取决于你在加密货币世界的经验和目标。


    如果你完全相信一个项目，那么我们可以建议长期投资。但如果你看到某种加密货币获得了大量关注，那么进行短期投资可能是一个好主意，会给你带来丰厚的利润。


    加密货币具有巨大的潜力，但不应该忘记一个重要的细节：你可能会亏钱。在加密世界中，没有什么是肯定的，没有人能预见到会发生什么。


    有一句加密货币专家反复的格言：你只需要投入你不害怕失去的钱。我们认为，时刻记住这一点是好的。


    # 11


    ## 第十三章：投资规则


