- fmt: '

    Bitcoin Investment Trust is the first of its kind, and that contributes greatly
    to its over-priced valuation. There has been speculation about other funds of
    similar structure entering the market, but `BIT` remains the only big player in
    the game. But as the cryptocurrency market evolves, similar funds will undoubtedly
    enter the market, which will not only reduce the pressure on `BIT` but will solidify
    Bitcoin''s status as a globally recognized currency.


    ## Difficulties buying Bitcoin


    ### Credit card or PayPal

    It may come as a surprise, but no matter what exact trading method you are using,
    it is still not easy to buy Bitcoins with your credit card or with `PayPal`, it
    depends on where you are. Exchanges avoid those payment methods and instead require
    users to connect their bank accounts. Most private sellers tend to be wary of
    such transactions, preferring cash. This is due to so-called ''refunds''. Most
    credit card or `PayPal` transactions can be easily reversed simply by calling
    the card-issuing company. Bitcoin transactions are irreversible, and it can be
    extremely difficult to prove that any product changed hands in a Bitcoins transfer,
    this payment method is generally avoided.


    ## Warnings about buying Bitcoin


    ### Legality problems in your country

    Bitcoin certainly attracts the interest of law enforcement agencies, tax authorities,
    and legal regulators. What they are trying to understand is how the cryptocurrency
    fits into existing frameworks.


    The legality of your Bitcoin activities depends on who you are, where you live,
    and what you do with it. Basically, the answer for most countries is simple: If
    you are not spending your Bitcoins on anything illegal, you are not breaking any
    laws.


    Bitcoin has been around for a while, so most governments have had enough time
    to decide on its legality. As of September 2017, `BTC` is only illegal in `Vietnam`,
    `Iceland`, `Bolivia`, `Ecuador`, `Kyrgyzstan`, and `Bangladesh`. Some other countries
    have not taken an official position on the issue, while `Thailand` and `Russia`
    initially banned all digital currencies, but backed out shortly after. Recently,
    the Russian authorities have even considered officially recognizing Bitcoin and
    all other digital currencies to combat illegal transactions.


    ### Protection risks

    It is worth remembering that despite the proof of identity requirements that most
    exchanges and wallets impose on their users, those services do not provide the
    same level of protection as banks. For example, in case the exchange goes bankrupt
    or is stolen by hackers, their insurance for user funds is often very limited
    or completely non-existent. This was the case with the infamous failed Chinese
    exchange `Mt Gox`, which officially filed a bankruptcy protection application
    and admitted the irrecoverable loss of 750,000 Bitcoins from its clients. Since
    Bitcoins do not have legal currency status in most of the world, authorities are
    generally unsure how to tackle thefts.


    Also, if a cryptocurrency theft occurs due to a security or password breach on
    the user side, there is no guaranteed way to get the funds back. Some banks even
    refuse to work with funds obtained through digital currency transactions due to
    regulatory uncertainty.


    ## Tips for buying Bitcoins

    When trading Bitcoins, it is essential to treat your private key (comparable to
    an `ATM PIN`) as a protected secret, and only use it to authorize `BTC` transactions.


    The private key is kept in your wallet, so protecting it would be a good idea.


    For example, you can encrypt the wallet with a strong password, backup your wallet,
    or choose the cold storage options, which basically means keeping it offline.
    Some exchanges even offer a ''multiple vault'' option for storing your keys.


    Multiple signature addresses allow multiple people to partially control the address
    with a public key. So, when someone wants to spend some of the Bitcoins stored
    at that address, they would need some of these people to sign their transactions
    in addition to themselves.


    The number of signatures required is generally agreed upon when the people involved
    creating the address.


    Finally, although most exchanges offer wallet capabilities to their users, it
    is very important to remember that it is not their main activity. Furthermore,
    the history of cryptocurrencies is littered with exchanges shutting down and running
    away with their users'' funds.


    For those reasons, if you decide to buy your Bitcoins on an exchange, it is recommended
    that you transfer your money to your own wallet and make sure it is safe and secure.


    # FUTURE OF BITCOIN

    As it becomes easier to carry out commercial transactions in bitcoin, its use
    as a means of payment will tend to spread among the population, especially in
    international payments, in which cryptocurrencies provide clear advantages: they
    eliminate the costs and risks related to transactions in currencies and provide
    speed in making and receiving payments.


    However, it must also be taken into account that fluctuations in the price of
    bitcoin, sometimes dramatic, make it difficult to use it as a means of payment.
    Perhaps the key to this is the stabilization of its price. On the other hand,
    investors have found bitcoin an attractive source of profit.


    The fact that its creation has a limit of 21 million (one of which is in the hands
    of `Nakamoto` and out of circulation), makes it a scarce asset with great potential
    for revaluation.


    Ultimately, bitcoin, or any other cryptocurrency, lacking intrinsic value like
    gold and not being backed by a state, such as sovereign currencies, causes its
    price to be determined exclusively by supply and demand.


    For fans who invest in gold, its appeal is obvious. The use of precious metal
    in the real world is visible all around us in the form of coins, jewelry, and
    other decorative items, and has a long history behind it. Skeptics of bitcoin
    have repeatedly pointed to the cryptocurrency''s inherent lack of value as one
    of its biggest weaknesses.


    Gold is a versatile and invariable asset that many investors consider less risky
    than, for example, stocks. The price of bitcoin would have to be multiplied by
    five, at 119,000 euros per coin, to match the global valuation of $469 billion
    of the private gold wealth in gold bars, coins, or exchange-traded funds, `JPMorgan`
    said.


    Experts believe 2021 will be a good year for gold. `Joseph Edwards`, Research
    Director at `Enigma Securities`, believes that "millennials and Gen Z see bitcoin,
    they see that a decade has passed, that it has been technically maintained, it
    has recovered from the shocks in the market and they are also very in love (with
    cryptocurrency) ".


    A December survey by international financial consultancy `deVere Group` showed
    that more than two-thirds of the company''s millennial clients preferred bitcoin
    over gold as a safe asset.


    "Bitcoin could be dethroned in a generation, as millennials and younger investors,
    the so-called ''digital natives,'' believe that it competes better against gold
    as a safe asset," wrote `Nigel Green`, CEO of `deVere Group`.


    ## "Will not disappear"

    While bitcoin always had some of the properties of money, such as being portable
    and divisible, it has taken time, `Edwards` says, to prove its worth in other
    areas such as durability "in terms of the network being invulnerable to attack
    and, in in a broader sense, bitcoin just won''t go away, " he said.


    Think Markets online financial analyst `Fawad Razaqzada` agrees with the characterization
    of bitcoin as "the gold of the millennials." "Bitcoin is benefiting from a steady
    wave of institutional interest," he added, "which is accelerating widespread acceptance."


    In 2021, the ability to buy fractions of an entire unit of bitcoin opened the
    cryptocurrency to a wider audience, and payment services company `PayPal` made
    it possible for account holders to complete online transactions with the cryptocurrency.

