  trans: '

    事实上，围绕这种珍贵代币的狂热根本上是基于投机的，并没有真正考虑到其内在价值。必须说，`Bitcoin` 的波动性以及其长期的显著增长足以让交易者们梦寐以求。


    # 如何投资比特币？


    尽管它的形象非常极客，但在 2015 年 9 月，美国大商品市场监管机构——商品期货交易委员会（`Commodity Futures Trading Commission`）正式宣布
    `Bitcoin` 属于大商品类别。


    因此，这是虚拟货币监管的第一步，也是金融机构对加密货币的某种认可。


    现在，`Bitcoin` 的金融交易和专门平台上的交易必须按照管理原材料交换的规则进行。


    有许多网络平台提供比特币和加密货币投资，本书的后续章节将解释在下方提到的任何加密交易网站上可以执行步骤：


    * ● `Coinbase` (`https://www.coinbase.com/`)

    * ● `Gemini` (`https://www.gemini.com/`)

    * ● `BlockFi` (`https://blockfi.com/`)

    * ● `Kraken` (`https://www.kraken.com/`)

    * ● `Robinhood` (`https://robinhood.com/`)

    * ● `eToro` (`https://www.etoro.com/`)

    * ● `Bitcoin IRA` (`https://bitcoinira.com/`)

    * ● `Binance` (`https://www.binance.com/en`)


    但我们也正看到美国出现了专门从事加密货币的信托公司，如 `LLC` 和 `IT bit`。


    这两家公司除了满足纽约州对资本、储备、合规、消费者保护和网络安全的要求外，还为计算机存储系统和安全系统提供担保。为著名的 `GABI` 基金的 `Bitcoin`
    持仓提供冷存储库。`GABI` 基金的经理提供了将这些特定的可转证券交换为 `Crypto Delta One` (`CRYDO`) 的可能。


    因此，`CRYDO` 可以在电子交易平台上交易其证券，该平台提供对 `Bitcoin` 价格的间接或合成敞口，而无需传输 `Bitcoin` 的明确所有权。


    ## 比特币正在成为独立的金融产品！


    现在是投资的时机。人们确实会想知道何时投资 `Bitcoin`。如果你想投资 `BTC`，那就去吧。也许你认为考虑到加密货币已经如此高的价格太晚了，或者认为由于其在实体经济中的渗透率仍然较低，还早早。避免从市场时机的角度来看待你的投资。


    预测这种超波动性资产的价格，以及 `BTC` 的价格在一个月、一年、甚至两个月后将处于什么水平是不可能的。如果你被这种冒险所吸引并想投资 `XBT`，就去做吧。但要多元化你的投资并使用你不需要的资金。


    你是否在考虑如何在法国投资 `Bitcoin`？在哪里投资 `Bitcoin`，通过哪些平台和哪些经纪商？投资虚拟货币，你有两种方案可用：通过 `Polonium`、`Circle`
    或 `Coinbase` 等专门平台将欧元兑换为 `Bitcoins` 直接投资。你也可以通过自最知名虚拟货币的金融产品对 `Bitcoin` 进行投机。几家在线经纪商提供
    `Bitcoin` 的 `CFDs`。事实上，在线经纪商 `eToro`、`IG` 甚至 `XTB` 允许你通过电子货币的 `CFD` 投资 `Bitcoin`。请注意，在将储蓄投入加密货币之前，问问自己要投资多少
    `Bitcoin`。在涉及到投资和个人多元化时，衡量是必要的。

