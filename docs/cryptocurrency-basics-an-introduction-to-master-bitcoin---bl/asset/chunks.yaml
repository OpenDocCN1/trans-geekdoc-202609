  trans: '


    除了移动平均线和斐波纳数值外，其他技术指标也可以应用于加密货币图表，以进行各自的技术分析。


    ### 技术指标


    **RSI**: `相对强弱指数`（Relative Strength Index）是一种衡量资产是超买还是超卖的指标。它被用于帮助交易者衡量市场强度。


    该指标通常运行在图表下方，范围从 `1` 到 `100`。数值低于 `30` 表示超卖状态，而高于 `70` 则表示资产超买。


    **MACD**: `移动平均线收敛发散`。`背离`（Divergence）是交易者喜欢的另一种指标，它通过结合多个移动平均线的差值来获得更准确的趋势识别。还有一个直方图代表了快速移动平均线和慢速移动平均线之间的差异。


    **随机指标**: 这种简单的动量震荡器衡量收盘价之间的变化程度，以预测当前方向趋势的持续性。它也可以用于发现加密货币资产是否超卖或超买。


    **抛物线 SAR**: `停损与反转`（Stop and Reversal）在图表上的蜡烛上方或下方标记点，指示价格运动可能反转以及趋势的结束。


    **布林带**: 该工具衡量市场波动性，因此当价格处于侧边时，带带会收紧；当价格飙升或回调时，带带会张宽。


    上带和下带也作为阻力位和支撑位。还有无数指标，如`一目均衡表`（`IKH`）、`平均方向指数`（`ADX`）和`蔡林震荡器`，但它们超出了本指南的范围。


    某些指标专门针对比特币，例如交易量和流动性、`Hash Ribbons`、`Puell Multiple`、`动态范围 NVT 信号`、`梅菲定律`、`UTXO
    指标`以及 `BTC 能量值震荡器`。然而，它们也超出了看图的基础范围，属于分析和链上指标领域。


    ### 蜡烛


    了解构成加密货币图表的日本蜡烛也是一种优势。每根蜡烛都用于描述特定时期内的价格波动。它们通过所选时间的开盘价、最高价、最低价和收盘价（`OHLC`）形成。蜡烛的实心部分称为“实体”，延伸的部分称为“芯”。这些蜡烛构成了许多不同的模式和信号，与上述描述的一些技术指标结合使用，也可以帮助确定价格方向。下方的信息图显示了一些最常见的模式。


    ![](img/image00141.jpeg)


    ### 时间框架


    这是阅读加密货币图表的一个非常重要的方面。图表可以显示不同时间框架下的市场快照，这会改变技术指标的信号。


    这就是为什么使用多个时间框架交易加密货币非常重要。最流行的图表软件通常会显示从`1 秒`到一个月不等的时间框架图表。


    你使用的术语取决于操作者的类型。寻求快速小利润的零售商会在较短的时间框架内交易——一分钟或更短——而日内交易者可以使用`15 分钟`、`一小时`和`四小时`图表。长期交易者和卖家只会对`日`、`周`和`月`图表感兴趣。在不同周期阅读图表可以更好地观察全局和整体趋势。记住说：“趋势是你的朋友”！


    ### 加密货币图表模式


    加密货币图表上经常出现模式，这些模式可以导致最可预测的未来价格波动。图表中的这些形成可以识别趋势的反转和持续，以及看涨或看跌动能。比特币和加密货币一些最广认的图表模式如下：


    1. **反转模式**: `头肩顶`、`头肩底`、`杯柄`、`双顶/双底`、`上升下降楔形`。

    2. **持续模式**: `三角旗`、`矩形`、`旗形`、`上升下降楔形`。

    3. **双线模式**: `对称三角形`、`上升或下降三角形`。


    双边图表模式可能导致向任何方向的价格突破。许多用于货币交易的图表模式也适用于加密货币。


    还有其他方法可以识别趋势将继续维持还是即将反转。


    * **更高高、更高低**: 一种看涨模式，表示价格继续上涨且上升趋势完整。价格继续超过之前的高点，且回调深度没有之前那么深。

    * **更低、更低**: 一种看跌模式，表示价格正在下跌且下降趋势完整。价格无法超过之前的高点，每次回调都会形成新的低点。在交易比特币和其他加密货币时，关注这些非常重要。


    当指标和价格之间出现分歧时，可以观察到背离。在上升趋势中，当价格上涨但指标没有时，就会发生这种情况；在下降趋势中，当价格达到较低点但指标没有时，就会发生背离。


    '
- fmt: '

    `ICOs` are accessible to everyone, except a few countries like the United States
    or China, which prohibit their citizens from taking part (with fairly moderate
    success). We generally buy tokens by paying with other crypto assets such as `Ethereal`
    or `Neo`.


    This way of organizing a fundraiser is very little if at all regulated. Many fraudulent
    `ICOs` have already taken place, with the sole objective of stealing the money
    that naive people had decided to invest in the project.


    ## Tokens and Actions


    In the world of crypto-currencies, there are several different types of tokens
    (or "tokens”) On the one hand, there are utility tokens, which offer users access
    to a specific service. On the other hand, we find what we call "security tokens"
    and "equity tokens":


    - The "equity tokens", which we could translate by token-title, is in fact a part
    of the company in question, transposed on the blockchain.


    The token is, to put it another way, a cryptographic representation of a financial
    security relating to the company that issued it. It therefore confers the right
    to vote at general meetings of the said company, like a part of a company acquired
    through the Stock Exchange.


    - For "security tokens", it''s a bit more complicated. This is a separate category,
    which appeared with crypto-currencies. These are tokens that give the illusion
    of some power, but which, in reality, do not confer any rights on their holders
    over the decisions of the person (company or not) who manages the crypto-asset
    in question. They are simply tokening whose value is derived from the success
    of the relevant crypto-asset.


    They are therefore in no way comparable to securities tokens since they have been
    deprived of the associated voting rights. In the end, if a French translation
    should be done, we could speak of an investor token, a general term that does
    not imply any concrete rights.


    For more information on tokens, see our complete guide on the topic: Security
    token vs Utility token – Comparison on the stock market, a share always offers
    the the same guarantees:


    - A part of society.

    - Voting rights according to the following criterion: 1 share = 1 vote.

    - Dividends on the profits generated by the company.

    - The right to participate once a year in the general assembly.


    The various tokens do not offer these guarantees, except securities tokens which
    are still very rare today. These voting rights and dividends therefore generally
    only apply to the shares you buy on the stock exchange.


    A utility type crypto-asset offers type crypto-asset offers different services
    depending on the project:


    - Trading signals.

    - Discounts on transaction fees.

    - The possibility of accessing a decentralized application.

    - Etc.


    An investor token-type crypto-asset usually offers nothing, except the hope of
    a future increase in its value.


    ## The Dividends


    As we saw in the previous point, dividends are specific to the stock exchange
    system. Each company will distribute dividends to its shareholders if it has made
    a profit and if it does not decide to reinvest everything to increase its growth.


    However, some cryptocurrencies can offer disguised dividends in various forms:


    - By distributing royalties on the performance of a decentralized investment fund.
    This is for example the case of `NapoleonX` (`NPX`).

    - Through a central node system (master node), the user can immobilize their tokens
    and make a constantly running server available to the public, in order to receive
    passive income. This is the case with crypto-assets like `TOMO` or `DASH`.

    - Holders of certain cryptocurrencies can receive a few copies of `ICOs` tokens
    for free that use their blockchain to complete this process. It is a mechanism
    called "airdrop", that is to say, airdrop. We can quote for example `Wanchain`
    and its `CryptoCurve` project:


    the holders of `Wanchain` coins received free `CryptoCurve` tokens, in proportion
    to the quantity of `Wanchain` coins held.


    - Certain exchange tokens (i.e. tokens created by cryptocurrency exchange companies),
    such as `COSS`, the `KuCoin Shares` or the `Cryptopia Shares`, allow its holders
    to obtain at regular intervals a fraction of the fees paid by the users to the
    exchange company. This income, which therefore depends on the company''s profits,
    does not exactly correspond to dividends from a legal point of view, but it is
    certainly the income that comes closest to dividends in the entire cryptocurrency
    universe. It should however be noted that the tokens which make it possible to
    obtain these "quasi-dividends" in no way confer the right to vote at the general
    meetings of the companies concerned: the holders are not members of the company
    and do not have a vote. if they don''t like something about the site. In addition,
    the value of dividends acquired from a lexical point of view, you can''t talk
    about a dividend, but in practice it comes down to about the same thing.


    ## The Difference in Volatility


    A young market is an inherently immature market. As a result, price volatility
    can be considerable. It is not uncommon to see a cryptocurrency lose 30% of its
    value in a day or see its capitalization multiplied by 2.


    On the stock market, if an asset moves by several points over a single day, we
    speak of a cataclysm.


    However, we note that volatility in the crypto-currency market tends to decrease
    sharply. For example, in 2016 `bitcoin` was less volatile than a barrel of oil.
    The extreme volatility of the early years will gradually disappear, to make way
    for a world where cryptocurrencies are no less stable than the traditional stock
    market.


    ## The Level of Professionalism


    The stock market is essentially a business for professionals. All the big banks,
    all the biggest institutions, pension funds, insurance companies are on the stock
    market.


    Extremely formidable professional traders operate in the market. Many robots help
    with decision making or make the decisions themselves. Powerful algorithms indicate
    the best decisions to make based on specific criteria. In short, the stock market
    is essentially the business of people with experience in the field. The life expectancy
    of an individual in the stock market is very short because he cannot fight against
    these people, institutions, or programs.


    In cryptocurrency, things are different. The market is currently made up of amateurs.
    The latter usually have few technical skills and react strongly to emotions. Some
    say ironically enough that the crypto asset market is a monkey market.


    Many projects that would probably not have succeeded in raising a single penny
    on the traditional stock market have, for example, managed to raise several million
    (even several billion) without any difficulty thanks to cryptocurrencies.


    ## Price Manipulation


    Due to the almost total lack of regulation in cryptocurrencies, anything that
    is prohibited on the stock exchange is allowed on this market.


    It is not explicitly allowed, but since it is not clearly prohibited, then one
    must be aware that not all financial sharks will deny themselves to use these
    advantages for their benefit.


    The insider trading are natural things for active crypto. We can be sure that
    information that could cause prices to move up or down will be known and transmitted
    before the information is revealed to the general public. This is course illegal
    on the stock market and is punishable by law.


    Many "fake news" is also spread by the bigger whales, and/or by the news organizations
    with which they are affiliated. Due to the immaturity of the market, small investors
    react strongly to this type of news, and prices are directly affected, which allows
    these whales to derive huge benefits.


    Even though some anti-system people think that cryptocurrencies are a "nicer"
    alternative to traditional finance, there are two very important things to be
    aware of:


    - Faced with the sharks of finance, with immense networks, powerful equipment,
    and century-old expertise, they are no match.

    '
