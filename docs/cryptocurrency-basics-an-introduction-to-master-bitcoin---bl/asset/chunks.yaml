    另一方面，还有一些带有金字塔系统的程序，它们以加密货币为借口，试图让人们投入资金，并让其他人参与以赚取佣金。


    务必，加警惕这些骗局，只有少数先进入金字塔系统的人会获利。


    过段时间，这种自动套利系统会更改名称，系统本身会随资金消失，并创建另一个类似的程序继续欺骗人们。你遇到过的例子包括 `Arbistar`、`Nimbus`、`Bitcoin
    Vault` 的加密挖掘以及 `Mine City` 等……


    甚至我认识的一些所谓的专家当时也向我推销过这是一个绝佳的机会。


    我也关注过像 `Kuailian` 这样的项目。质押服务、主节点、套利、交易，特别是当业务的核心不在于产品而在于通过邀请他人赚钱时，请务必小心。


    如果有人自动提供超过 10% 的高回报，且几乎不需要做任何事情或投入资金。如果你在 Google 上搜索 `"观点 + 品牌"` 或 `"骗局 + 品牌"`，并看到许多使用如
    `品牌是骗局吗？` 等标题的章节和视频，但它们最终还是会推荐该项目，那么它们是在利用 SEO 技术引导你加入骗局。


    因此，如果你打算购买或投资 `Bitcoins` 或其他加密货币，我建议你只在实际购买加密货币的官方页面进行，永远不要使用那些保证固定月利润或带有奇怪名称的自动系统，你永远无法确保加密货币的购买是否正确。


    # 投资加密货币可以赚多少钱？


    很多钱。数千欧元。但你也可能失去一切。


    我建议投入你永远需要的钱。这意味着即使你失去一切也不会对你的生活产生任何影响。


    我不是投资或加密货币专家，但我只想和你们分享我的经验。


    ## 购买加密货币时的佣金


    就像银行对你执行转账、在股市购买股票或取款等各种操作收取佣金一样，加密货币也是如此。管理加密货币的公司将根据每次操作收取一定金额的费用。


    好处是，与买卖股票相比，佣金要低得多。


    我建议你比较不同的购买 `Bitcoins` 的公司并查看它们的佣金，因为在某些情况下，有些公司不收取管理费，仅根据金额收费。平均费用通常是购买金额的 0.5%。


    例如，要查看 `Coinbase` 的佣金可以在这里看到，总结来说，欧洲地区的情况如下：


    * 买卖加密货币：1.49%

    * 使用借记卡直接购买：3.99%

    * 银行转账 (SEPA)：向 `Coinbase` 发送资金购买加密货币免费，入账收取 0.15 欧元。


    顺便说，如果你想通过 `ValueInvesting` 投资股市，我推荐 `Investment Academy` 和 `Value Investing FM`
    播客。你也可以使用 `Degiro`、`Interactive Brokers` 或 `Revolut` 应用，它们的佣金较低。


    # 如何向税务局申报加密货币收入


    目前，加密货币处于法律之外，因为只要你不将加密货币转到银行账户，并且不将其转换为美元或欧元等（传统货币被称为 `FIAT`，属于一种类型）。


    # 比特币提示


    首先，在购买 `Bitcoin` 之前，你需要一个存储它的。在加密货币世界，那个地方被称为钱包。


    ## 钱包类型


    五种主要的 BTC 钱包类型是`desktop`（桌面钱包）、`mobile`（手机钱包）、`online`（在线钱包）、`hardware`（硬件钱包）和
    `paper`（纸钱包）。


    ### Desktop

    桌面钱包安装在用户的计算机上，提供对资金的完全控制和相对安全性。有健壮的桌面钱包，允许用户下载区块并提供独立管理。另一方面，轻量级钱包不需要下载区块。


    ### Mobile

    手机钱包的主要优势是用户的资金随时随地可用。这是一种通过扫描二维码支付产品非常方便的方式。在某些情况下，用户可以利用手机的近场通信（NFC），让他们只需将手机贴近读卡器而无需输入任何信息。


    所有手机钱包的共同特点是它们不是完整的比特币客户端。这是因为完整的比特币客户端必须下载整个 `Blockchain`，而它在不断增长，需要几个 GB 的存储空间。


    ### Online

    如果你使用基于网络的钱包，用户的私钥存储在由他人控制的服务器上，并连接到互联网。虽然它们让人们可以从世界上任何地方的任何设备轻松访问资金，但始终存在服务器被黑，甚至提供服务的组织控制你比特币的风险。


    ### Hardware

    硬件钱包是专用的便携设备，可以存放私钥并协助支付。有不同类型的硬件钱包，但它们都允许用户在口袋里随身携带任何金额的钱。


    ### Paper

    纸钱包可能是存储 `Bitcoin` 最安全的选项之一，它基本上是由指定服务生成的两个二维码。其中一个是公钥，即一个可以接收 `BTC` 的地址；另一个是私钥，你可以用它花费存储在该地址的比特币。


    # 在哪里购买比特币？


    购买 `Bitcoins` 并不像人们希望的那样简单。然而，选项正在不断增加。每个人都可以选择适合自己需要的加密货币购买方案，某些甚至不需要访问互联网或 BTC
    钱包。


    ## ATMs


    '
- fmt: '

    Despite being a very new concept, Bitcoin ATMs appear in cities around the world
    and their number is constantly growing. The machines charge a commission of three
    percent to eight percent on the normal exchange price but provide users with the
    most private Bitcoin shopping experience.


    All you need to do is insert cash into the ATM and scan the QR code on your mobile
    wallet or receive a paper receipt with the codes and instructions on how to transfer
    the funds to your wallet. As Bitcoins gain popularity, such ATMs have the potential
    to become one of the most common ways to buy cryptocurrency.


    It goes without saying that Bitcoin ATMs are unlikely to appear in countries where
    Bitcoin is prohibited or outside the law. You can find a Bitcoin ATM closest to
    you using a mapping service, such as `CoinATMRadar`.


    ### Gift cards


    Bitcoins are often used to buy gift cards as they are anonymous and can sometimes
    be cheaper than using cash. But the gift cards themselves can be traded for `BTC`.
    All you need to do is buy any gift card from a retailer, log into one of the Bitcoin
    exchanges where some sellers accept gift cards (eg `Paxful`, `LocalBitcoins`,
    etc.), and complete the purchase.


    Depending on the particular seller, they may want to see an actual image of the
    gift code on the back of the card and a receipt from the store where they purchased
    it, while others will be fine with just an online or electronic code. Once you
    initiate a trade, the amount of `BTC` you wish to purchase will be automatically
    held on the website, so that it is safe to provide the seller with your gift card
    information.


    There are a lot of online retailers that sell gift cards for up to 60 percent
    of their value, so buying Bitcoins that way can really save you a lot of money.
    Gift cards are also a great way to store `BTC`, considering how its value fluctuates.
    However, as with any other way to buy Bitcoin, you should always beware of scammers
    trying to steal money from you, so make sure you only trade with trusted sellers.


    ### Exchanges


    Every new potential buyer of Bitcoin will find a wide variety of exchanges competing
    for their business. Choosing the right one depends on many different factors,
    with location perhaps the most important. The exchange has to be regulated by
    the government and meet the ''know your customer'' and anti-money laundering requirements.
    Therefore, to create an account and start trading on any existing exchange, you
    have to go through lengthy bureaucratic procedures.


    For example, most exchanges require you to add an existing bank account before
    you can start trading, which generally requires providing detailed personally
    identifiable information, thereby avoiding the anonymity of Bitcoin buyers.


    However, exchanges offer an unrivaled choice of trading options. Whether you are
    looking for a complete platform for institutional traders or a simpler solution
    for a one-time trade, you will find an exchange to suit your needs.


    Additionally, most platforms can be accessed via desktop and mobile devices, allowing
    users to trade from anywhere. Exchanges vary in the payment options they accept,
    security levels, purchase limits, fees, verification requirements, etc.


    #### Bitcoin exchanges


    The list of exchanges based on cryptocurrency market capitalization.


    | Name | Payment method | Security | Verification levels | Commission |

    | :--- | :--- | :--- | :--- | :--- |

    | Bitfinex | Bank transfer, Ethereum, Dash, Monero, Zcash | 2-Step Verification,
    Universal Second Factor, Withdrawal Protection, Advanced Key Permissions | not
    required to make a crypto currency deposit, deposits in USD | 0%-0.1% |

    | BitFlye | Bank Real Account | | transfer, credit card | 0.01% |


    *(Note: The original text contained fragmented table data; it has been organized
    into a standard Markdown table for clarity while preserving all terms.)*


    - `Bitfinex`: `Bank transfer, Ethereum, Dash, Monero, Zcash`, `2-Step Verification,
    Universal Second Factor, Withdrawal Protection, Advanced Key Permissions`, `not
    required to make a crypto currency deposit, deposits in USD`, `0%-0.1%`

    - `BitFlye`: `Bank Real Account`, `transfer, credit card`, `0.01%`


    *(Note: Some remaining fragments in the source text like "Verification levels",
    "Second", "Factor", etc., were treated as headers or table cell artifacts and
    integrated into the table structure above.)*

