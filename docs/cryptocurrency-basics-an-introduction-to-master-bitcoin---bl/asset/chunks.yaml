    There is a digital wave worldwide with nations and people waking up to the enormous
    potentials of `Bitcoin` and cryptocurrencies in general. You can ride this wave
    with the information you glean from the chapters and sections below. Make up your
    mind even now to learn with an open mind, to take the first steps, and get into
    the investment world of cryptocurrencies where all the magic happens.


    Are you ready to get started? We will kick-start this process with a foundational
    chapter detailing steps on how to buy `Bitcoin`.


    # PRACTICAL STEPS IN BUYING BITCOIN


    Anyone who wishes to become a serious, successful, and consistent crypto investment
    must first buy the coin, which is `bitcoin`. Even if you’ve learned a lot about
    the cryptocurrency market, the knowledge gained will only be beneficial when you
    buy your first coin.


    This chapter presents a step-by-step guide on how you can buy your first `bitcoin`
    on `Coinbase`. There are numerous cryptocurrency exchanges out there, but we will
    be working with `Coinbase` because it is a popular and beginner-friendly platform.


    ### Step one: Download a wallet


    First, you will need a wallet app for the cryptocurrencies you buy, especially
    if you want to hold some before selling. `Coinbase` also has its wallet, so you
    can use theirs by downloading from the app store or using other kinds of wallets
    such as `Bitcoin` or `Ethereum` wallet.


    ### Step two: Create an account on Coinbase.com with the app


    ![](Images/image00142.jpeg)


    First, you’ve got to create an account with the exchange by entering your name,
    email and creating a password to sign up.


    ![](Images/image00143.jpeg)


    ### Step three: Add your payment account to the exchange


    Next, you need to add an account by clicking on `trade` on the `Coinbase` platform.
    This step allows you to choose what you want to buy and how you intend to pay
    for your purchase.


    You can link your bank account and debit card. A bank account offers you a higher
    buying limit ($25,000), but your transactions will be on hold for a few days.
    With a debit card, you get instant access to your crypto purchases but with a
    $3,000 buying limit.


    ### Step four: Click “trade” at the top-right of the app or website


    ![](Images/image00144.jpeg)


    Next, click on `trade` and choose the amount of `bitcoin` you want to buy. The
    fiat amount you input will show you how much `bitcoin` you will get. Then you
    can select how you want to pay: either through the bank account or debit card
    you set up. Then click `Preview Purchase` to confirm everything.


    ![](Images/image00145.jpeg)


    ### Step five: Confirm your details before buying


    Lastly, you will have to confirm your details before buying. The confirmation
    process also entails seeing the fee the exchange charges you for the transaction.
    The prices depend on how much cryptocurrency you purchase and the payment pathway
    you use.


    Then `Buy now` to complete the transaction. At this stage, you need to move quickly
    and close the deal before the exchange’s range changes.


    ![](Images/image00146.jpeg)


    It may take a while before your wallet reflects your purchase so do not worry
    if you still see 0.


    ![](Images/image00147.jpeg)


    Then you will get an email confirmation of your purchase After the confirmation,
    you should enable `SEND AND RECEIVE` so you can always send and receive `BTC`.


    ![](Images/image00148.jpeg)


    You will need to verify your ID Now that is all you have to do to buy some `bitcoins`.
    Yes, the process is simple and straightforward. Tap the `trade` icon if you want
    to sell your `bitcoin` for fiat to put in your bank account. We used `Coinbase`
    to illustrate how to buy a `bitcoin`. Therefore, it is not an endorsement as there
    are several other exchanges you can use. Please always carry out your research
    on these exchanges, and combined with all you’ve learned from this material, you
    will make a good decision.


    To round off this foundational chapter, we will consider the top ten cryptocurrencies
    available in the market aside from `Bitcoin`; let’s go!


    ![](Images/image00149.jpeg)


    # CRYPTOCURRENCY


    ### 1. Ethereum (ETH)


    Ether (`ETH`) is the currency of the `Ethereum` blockchain and is often regarded
    as the second most valuable cryptocurrency after `Bitcoin`. `Ethereum` is also
    a technologically advanced version of `bitcoin`, which has the potential to grow
    exponentially.


    ![](Images/image00150.jpeg)


    ### 2. Ripple (XRP)


    `Ripple` was created to enable cross-border payment through its platform, and
    it has its `XRP` coin. The `XRP` coin is regarded as the third largest crypto
    after `Bitcoin` and `Ethereum` (based on market capitalization). `XRP` like other
    coins have had its ups and downs but has retained its spot as one of the world’s
    leading cryptocurrencies.


    ![](Images/image00151.jpeg)


