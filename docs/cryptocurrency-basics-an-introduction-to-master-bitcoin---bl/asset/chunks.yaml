    to buy, sell and hold bitcoin and other digital assets, using the company''s online
    wallet accounts”. This announcement allows considering certain and rapid democratization
    of virtual currencies that will be offered by this giant of online payment. Despite
    everything, it is more difficult today to carry out a transaction of everyday
    life in cryptocurrency than with the currency that is currently in the country
    where you live. Ditto for digital payments.


    However, cryptocurrencies could eventually lower the cost of a digital transaction.
    And the financial and banking sector is watching these advances very closely.
    In the future, electronic payment based on cryptographic evidence may be the norm.
    Enough to embarrass the banks by forcing them to completely review the transaction
    model!'
