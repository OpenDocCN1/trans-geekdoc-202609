  trans: '


    对于 `bitcoin` 的未来，质疑依然非常明确。`Oanda` 交易集团高级市场分析师 Edward Moya 认为，“黄金可能会经历暂时的挫折，但在该年的剩余时间里将有清晰的上涨路径。”另一方面，Razazada
    预计这种原材料将创历史新高，这指向了“央行廉价资金供应的持续增长”。


    许多人预测 `bitcoin` 的价格在未来几个月内将回调，投资者将在价格维持高位时抛售。此外，Moya 和其他分析师认为黄金将是强劲的一年：“此外，随着世界经济逐渐从大流行中复苏，黄金珠宝的需求可能会反弹。”关键在于流动性。


    显而易见，黄金已经存在了这么久，不会突然消失。Edwards 说：“尽管过去的一年充满了恐怖，但在实践中，趋势是地理和时间界限正变得越来越缩小。我们不再生活在一个对缺乏流动性感到不安的世界里了；`bitcoin`
    现在是地球上流动性最强的资产。”


    因此，其他加密货币（如 `Ethereum`）也可能增加其流行程度和价值。一些中央银行在开发自己的数字货币方面也取得了进展。


    ***比特币的经济理论***

    从经济理论的角度来看，`Bitcoin` 不是未来，而是过去。Paul De Grauwe 教授分析了 `Bitcoin` 的兴起，以及为什么它的泡沫似乎没有界限，足以与历史上的大泡沫相媲美。所有泡沫的逻辑总是一样的：对商品价值的过度乐观，以及对其价格将继续上涨的预期。当泡沫破灭时，价格就会崩塌。对
    `Bitcoin` 等的预期基于什么？这种观点认为它们是未来的货币，但“这与事实相差甚”。事实上，De Grauwe 指出，`Bitcoin` 是一种古老的货币，像黄金一样使用稀缺资源。因此，`bitcoin`
    与其说是未来的加密货币，不如说是过去的货币；相反，生产成本日益低廉的电子货币才是未来的货币。尽管 `Bitcoins` 可以降低其生产成本，但它们与现有的技术相比得非常糟糕。


    ***为什么它不能成为硬币？***

    还有其他相关原因导致加密货币作为支付手段和记账单位（即货币的主要功能）没有未来。


    首先，`Bitcoins` 的供应是渐近固定的，并不响应对这种货币供应日益增长的需求和需求。那么，基于 `Bitcoin` 的经济将面临永久性的通缩，并对投资者、企业家和未来增长产生深远的经济影响。沿着此思路，《华盛顿邮报的
    Matt O''Brien 也否认 `Bitcoin` 作为货币的角色，并强调了这一方面：这种货币的神秘创造者决定只有 2100 万个 `Bitcoins`。


    这解释了为什么当需求增加时，价格也会增加。但他疑惑，“一种货币的价值像 `Bitcoin` 那样从去年的 `$775` 增加到今天的超过 `$17,000`
    mean 什么？”好吧，用同样的货币，你可以买到比以前多 22 倍的东西。这意味着“以 `Bitcoin` 衡量，一切的价格都暴跌了。”也就是说，再次是通缩：准确地说，是
    95.4%。


    而这非多也不少，就是一种货币的死亡。那么，我们真的在看未来的加密货币吗？你会申请一笔原始金额为 `$200,000` 但一年后可以变成 `$3.4 million`
    的 `Bitcoin` 贷款吗？


    De Grauwe 还指出了第二个方面，这对于 `Bitcoin` 的未来更为相关，它使得 `Bitcoin` 成为一种危险的货币，因为它面临着所谓的理想化世界（一个
    `Bitcoin` 将处于核心的世界）与现实世界之间的冲突。


    `Bitcoin` 不由最后贷款人（中央银行）支持，当危机来临时（而危机总会来临），所有人都会追求流动性，但这种流动性是不复存在的。如果没有中央银行提供流动性，它就会陷入通缩和破产。


    `Bitcoin` 经济并不灵活。但这种中央银行的缺失对于“市场基本主义者”来说是最引人注目的。。对某些人来说，`Bitcoin` 已经成为“自由市场世界的象征”，在那里，摆脱了政府控制的财富将为许多人创造，自发调节的市场将避免危机。在那里，`Bitcoin`
    将发挥核心作用。但 De Grauwe 结论说，在现实世界中并非如此。但是，如果它不是硬币，它是什么？O''Brien 同样持有批评态度：它不仅是一个失败的货币，还是一个失败的支付系统，由于其缓慢和高成本（例如执行交易所需的带宽），使其变成了一个新的而非改进的
    `PayPal`。


    ***为什么会有加密货币狂热？***

    正如 Scott Rosenberg 在 `Wired` 中指出的，所有新技术在初期都会经历一个扩张期，因此这种技术被认为能够解决所有可能和想象的问题，直到某时刻看到更清晰的优缺点。这种情况特别发生在电子货币
    `Bitcoin` 身上，也发生在一般的加密货币以及 `blockchain` 上。


    基本上，`blockchain` 技术是由加密系统保护的分布式账本。任何可以列清单的东西都可以通过 `blockchains` 管理。由于这个原因，许多企业家正试图将其用于用途，从财务到土地管理再到医学。正如作者所说，“这些想法中有些是天才的，有些是荒谬的。”但由于创新系统和风险投资的逻辑，事实正是如此。通过它，技术决定了服务于什么。


    所有新技术体验在初期都会经历一个扩张期，因此这种技术被认为能够解决所有可能和想象的问题，直到某时刻看到更清晰的优缺点。这种情况特别发生在电子货币 `Bitcoin`
    身上，也发生在一般的加密货币以及 `blockchain` 上。


    基本上，`blockchain` 技术是由加密系统保护的分布式账本。任何可以列清单的东西都可以通过 `blockchains` 管理。由于这个原因，许多企业家正试图将其用于无数用途，从财务到土地管理再到医学。正如作者所说，“这些想法中有些是天才的，有些是荒谬的。”但由于创新系统和风险投资的逻辑，事实正是如此。通过它，技术决定了服务于什么。


    2018 年将是“加密货币无处不在”的一年。事实上，过去一年中已经募集了超过 `4 billion` 的资金——用于引入加密货币。我们每个人拥有自己的货币的未来是不可能的。但大型科技公司发行自己的代币可能并不遥远。但在那，必须解决三个问题：


    1. 加密货币主要是投资还是工具？目前，有的模型将这些硬币作为投资——模仿其他产品的特征，而其他创新模型将这些代币投入平台以继续开发。在不久的将来，这两种模型将有一个胜出。

    2. 我们能放弃加密货币是新物种的观点吗？虽然最初这些类型的货币被设定为“数字货币”，但事实并非如此。有必要远离这种想法：“这种新技术看起来像硬币，但其实不是。”

    3. 开发者能否解决围绕 `Bitcoin` 和其他加密货币的众多问题？以及出售和存储 `Bitcoins` 的困难，这使得大多数人支付给第三方来操作。这些中间服务是系统最大的故障点和脆弱点，2018
    年这些提供者将努力赢得用户的信任。


    '
- fmt: '

    # 1. Bitcoin adoption will suddenly accelerate in early 2021


    According to figures recently released by `BitPay`, one of the leading Bitcoin
    payment processors, they showed that over $1 billion in cryptocurrency transactions
    were handled in 2021, with `Bitcoin` leading in terms of volume and value.


    `Coinbase Commerce` for its part notes that it processed over $220 million in
