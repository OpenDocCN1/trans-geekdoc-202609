  trans: '

    波动是加密货币的主要特征之一。因此，加密货币的价值（即其价格）可能会以一种不可预测的方式快速增加或减少。问题在于：它年轻的经济、其非常的本质，尤其是其流动性不足的市场。


    平台的数量进一步加剧了代币的流动性缺乏。因此，到 2019 年底，“Les Echos”网站报告道，“143 个比特币的交易量足以让 Bitstamp 平台的价格波动
    1%。Coinbase 和 Kraken 的流动性要高得多，要让加密货币领军者的价格波动 1%，分别需要交换 456 个和 672 个比特币”。


    因此，不建议具有强烈风险厌恶倾向的谨慎型人群投资加密货币。对于其他人，同样也请务必考虑不要将你的大部分储蓄放在比特币或其他仍属于高风险资产的货币中。


    以这种方式投资存在着损失大量资金的真实风险。


    如果加密货币的冒险吸引了你，请用你准备好损失的钱去尝试。它必须是一项代表你财务资产中极小部分的投资。与其说加密货币是为了多元化配置而进行的理性投资，不如说它更像是一种在你感兴趣时尝试的实验。想要真正快速赚钱绝不是投资加密货币的良好理由。


    ## 加密货币的原理


    顾如名，加密货币（也称为比特币、莱币等）是加密货币和虚拟货币。但是，既然你可以通过互联网访问自己的银行账户，为什么还要使用虚拟货币呢？事实上，你可以进行转账、在线支付……匿名性是这种货币出现的首要原因。你确实可以在完全匿名的情况下支付购买费用，并避免当前银行账户被黑客攻击。此外（这也是某些人认为加密货币有趣的地方），它逃避了任何现有的银行系统。这意味着没有东西在控制它，也没有人有足够的权力对其进行监管。


    ### 这种货币何处使用？成本如何？


    每天，允许购买比特币的网站和商户列表都在增加。因此，你可以轻松地购买皮具、美容产品、电脑设备、视频游戏甚至服务。比特币正在入侵在线支付。它的优势是什么？它不依赖于任何监管机构或任何银行实体。因此，你可以支付、收款、向第三方（即使是国际性的）付款，而无需支付任何费用。对于许多商户来说，这种现实正变得非常有吸引力，因为他们现在每使用银行卡进行交易交易都必须向银行支付营业额的一定比例。


    ### 一个撼动银行世界的真实替代系统


    显然，这种系统引起了银行系统专业人士的怀疑或好奇。这并不是一个复杂且盈利的系统被加密货币扫除。


    整个金融世界将受到震动。这就是为什么许多人正在研究这种货币，因为它在纸面上只有优势。但现在，谁说“匿名性”和“去监管化”时，也意味着“洗钱”、“组织犯罪”和“平行市场”。


    这令人担忧的是，如果交易是不可追踪的，你如何确保自己没有在洗钱，没有购买非法产品？这是问题的所在。


    ## 加密货币的优势


    **它们是全球性货币**

    这些虚拟货币不受任何类型的政府组织（如国家、银行、金融机构或公司）的监管。这使得可以在世界任何地方使用它们的可能性。例如，`Bitcoin` 声称“就像没有人控制电子邮件背后的技术一样，比特币也没有所有者”。因此，这种加密货币由所有用户控制。因此，尽管程序员在改进他们的软件，但如果没有所有客户的同意，他们无法做出更改。


    **它们是安全的。**

    根据专家的说法，由于于经过证明的加密技术的复杂组合，加密货币的伪造或复制是不可能的。在这种意义上，每个人都拥有执行任何类型数字操作所需的加密密钥。


    **某些加密货币是通缩的。**

    `Bitcoin` 或 `Litecoin` 等加密货币限制了其虚拟货币的发行。比特币为 2100 万，莱币为 8400 万。这使得它们成为通缩货币，因为发行量随时间的推移而减少。


    **交易具有不可逆性。**

    它们的另一个优势是交易不可逆。也就是说，如果使用了加密货币，没有第三方可以取消或修改已完成的交易。这是因为没有可以访问它们的中心机构。


    **它们的特点是即时性。**

    它们在电子商务领域的优势之一是即时性。如果我们有国际客户，这种支付方法可以大大加快交换过程，特别是对于没有协议且必须通过中央银行的银行，会导致支付流程延迟几天。


    **它们是透明的。**

    通过`Blockchain` 进行的所有交易都是公开的。`blockchain` 文件存储在网络多个计算机上，而不是在一个地方。因此，这种存储方式允许所有用户读取，使其具有透明性且难以篡改。


    ## 加密货币的劣势


    同时，我们发现了加密货币的一系列劣势，这些可能是导致它们在社会中无法建立以及潜在和未来用户不信任的原因。


    **可能损失资金。**

    它的主要危险之一也是风险最大的特征是，如果你丢失了访问钱包的私钥，你就会丢失其中所有的钱，因为它是虚拟货币。因此，建议对钱包进行备份以避免这种致命局面。


    **变化和缺乏监管。**

    目前，正在对其进行监管工作，有几项欧盟指令等待批准。


    **对潜在用户的不信任**

    尽管加密货币的趋势近年来日益增长，但许多公司尚未胆于使用这种虚拟货币。

    '
- fmt: '

    Bitcoin''s official website was registered in August 2008. In October 2008, Satoshi
    Nakamoto published Bitcoin''s whitepaper, in which he described the operations
    and the technology behind them to Bitcoin employees. The first Bitcoin block,
    better known as the `Genesis Block`, was mined on January 3, 2009. The day the
    `Bitcoin Block` was created is now commonly viewed as the Bitcoin Birthday. The
    first Bitcoin transaction was made on January 12th, 2009 between Satoshi Nakamoto
    and software developer Hal Finney. Satoshi Nakamoto has mined for most of the
    earliest blocks on the Bitcoin blockchain. He collected a pot with more than a
    million bitcoins for himself. At that time, the level of difficulty in mining
    was low and it was possible to mine new bitcoins very quickly.


    ## The early 2010s


    Satoshi Nakamoto created Bitcoin at the best possible time. In 2008 and 2009 the
    world was hit by an unprecedented financial crisis. This economic crisis was the
    result of the reckless monetary policy of the central banks. Confidence in traditional
    banks had collapsed and people were waiting for a new type of monetary system.


    In the first half of the 2010s, Bitcoin''s popularity began to grow tremendously,
    and it was also possible to use Bitcoin to shop in the real world for the first
    time. The first real-world purchase was made with bitcoins on May 22, 2010, when
    a person named Laszlo Hanyez bought two pizzas with 10,000 bitcoins.


    This day is now known as Bitcoin Pizza Day. In 2010, numerous new services around
    Bitcoin began to develop. The best known of these services was the Bitcoin exchange
    called Mt. Gox. The story of the mountain. Gox ended in 2014 after massive hacker
    attacks. Mt. Gox''s hacking remains one of the most dramatic events in Bitcoin
    history to date. The last sign of Bitcoin founder Satoshi Nakamoto was in 2011
    when he said in an email that he would move on to other things.


    Satoshi transferred responsibility for the project to a programmer named Gavin
    Andersen, who also became the lead developer of the Bitcoin Foundation. In 2011,
    the the world saw the first bitcoin price bubble when the price of bitcoin rose
    from less than a dollar to $30 and then returned to $2.


    ## Years of Bitcoin Growth


    Bitcoin''s popularity has grown tremendously since its early years. Bitcoin''s
    use cases have increased, and more and more investors around the world have recognized
    the potential of Bitcoin as an investment. Bitcoin has seen three price bubbles
    in the course of its history. One of these occurred in late 2013 when the price
    of Bitcoin rose from a hundred dollars to over $1,000 in just a few months. After
    that, the price of bitcoin was on a downward trend until January 2015, when the
    price of one bitcoin was less than $200. However, interest in bitcoin and blockchain
    technology increased. In 2016, Bitcoin established itself as a phenomenon that
    could not go unnoticed by banks. Interest in Bitcoin exploded and this was also
    reflected in the price of Bitcoin. The price of Bitcoin rose steadily from the
    beginning of 2015 to 2017. In late 2017, Bitcoin experienced the third price bubble
    in its history, when the price of Bitcoin rose to nearly $20,000. As expected,
    the sharp rise in prices also led to an increase in media interest. At the turn
    of the year 2017 and 2018, the interest in Bitcoin was greater than ever before.
    The sharp rise in the value of Bitcoin also led to a tightening of Bitcoin regulation.


    The regulation of Bitcoin has been tightened, e.g. B. in China and South Korea.


    Bitcoin has had different forks throughout its history received, d. H. Upgrades.
    One of Bitcoin''s most famous forks was in 2017 when Bitcoin''s SegWit update
    was carried out. The SegWit update improved the capacity of the Bitcoin network
    by changing the way the network secures Bitcoin transactions. The time before
    the SegWit update was also controversial in the Bitcoin community. The bitcoin
    community has been divided into two different groups. Another group wanted to
    improve the capacity of the Bitcoin network by increasing the block size of the
    blockchain. In contrast, the other party wanted to improve Bitcoin''s scalability
    through Lightning network technology. In practice, lightning network technology
    means that smaller Bitcoin transactions are transmitted on a completely separate
    network. Eventually, the controversy about Bitcoin''s scalability escalated to
    the point that a group demanding larger block sizes pulled out of the Bitcoin
    community as its own cryptocurrency before the SegWit update went into effect.
    This cryptocurrency is known today as Bitcoin Cash. The increasing interest in
    Bitcoin led to an accelerated exchange of new cryptocurrencies and the introduction
    of more Bitcoin-related investment products like options and certificates in the
    2010s.


    At the same time, Bitcoin has become part of a portfolio of more and more private
    investors and institutions. The growing popularity of Bitcoin and other cryptocurrencies
    has also led to an increase in market regulation for cryptocurrencies in recent
    years.


    Bitcoin was the world''s first digital currency and was introduced over a decade
    ago. Even though Bitcoin eventually did the pioneering work, there were also attempts
    to introduce digital currencies before that.


    Satoshi Nakamoto, the person, or group behind Bitcoin (the exact identity is still
    unknown), mined the first Bitcoin block called "Genesis". The next big event happened
    in 2010 when Laszlo Hanyecz paid for two pizzas with BTC. For the first time,
    BTC was used to purchase physical goods in the real world.


    # IPO


    In the same year, the first exchanges for cryptocurrencies were launched. In 2013,
    over ten different cryptocurrencies could already be traded. Thousands of cryptocurrencies
    have been created in the past few years and the market has grown steadily since
    then.


    As the world of cryptocurrencies continues to expand and grow in popularity, they
    are being accepted as a means of payment buy more and more shops, brands, and
    networks around the world.


    With the growing popularity and use of these digital currencies, the value of
    Cryptocurrencies and with it the amount of trading profits has increased.


    ## Trading Software


    Trading software for trading digital assets such as Bitcoin Era makes it easier
    for people with no trading experience to buy and sell digital currencies and benefit
    from these trades.


    ### Bitcoin Era


    Bitcoin Era is a trading system that can be used to trade cryptocurrencies manually
    or automatically. The manual and automated modes that the software offers make
    profitable trading in Bitcoin and other cryptocurrencies a breeze for everyone.


    ### Trade Bots


    Today, many teams offer paid and free crypto trading bots for Bitcoin and other
    cryptocurrencies. Learn More About Trading Bot: Trading Bots could be used to
    effortlessly automate the complicated and seemingly impossible strategies of the
    cleverest traders.


    ## Why Was Bitcoin Created?


    Bitcoin was created in 2009 following the writing of a white paper entitled “A
    Peer-to-Peer Electronic Payment System” written by one or more people appearing
    under the pseudonym Satoshi Nakamoto.


    ## So why did you create Bitcoin?


    There are 3 main reasons for the creation of Bitcoin: the development of e-commerce,
    the loss of confidence in financial institutions, and the resolution of the problem
    of double value.


    The development of e-commerce is generating exponential growth in international
    financial exchanges. Carried out by banks, these processes are often long and
    expensive in transaction costs. These transaction costs remunerate the bank which
    will insure any disputes between the buyer and the seller. These fees could also
    compensate for the phenomena of fraud which are considered inevitable by the banks.
    All these reasons have led banks to offer a system of reversibility of payments
    in the event of error, fraud or even default by the seller or the buyer.

