    to €100,000 or more.


    What is always said in these cases is that you never invest more than 10% of your
    savings in this type of high-risk investment and that the money you aim for is
    money that you do not need now or ever. In this way, you will not be worried and
    if you lose it will not affect your day-to-day.


    On the other hand, seeing the evolution of `Bitcoin` and other cryptocurrencies
    over the years and taking into account the technology they use and where the world
    is going, these types of investments from official web pages such as those discussed
    in this post are from the most profitable that have ever been seen in the medium
    / long-term multiplying by 100, 1000 or more.


    ### How to transfer Bitcoins to my bank account.


    If you want to transfer `Bitcoins` to euros or dollars or to any bank account,
    you just have to choose the option to transfer (withdraw in English) or withdraw
    funds from the web or app (I recommend performing these operations from the web
    always).


    You have previously had to add your bank details in the settings of the web or
    application you use.


    In some crypto websites and apps, you must first transfer your money from lesser-known
    cryptocurrencies to a more known cryptocurrency such as `Bitcoin` or `Ether` and
    from there move it to a page that does allow that transaction.


    ### The process takes a few days.


    Apps like `Coinbase`, `Blockchain`, `eToro`, `Bitstamp` allow you to transfer
    your money in cryptocurrencies to euros or dollars from your bank account or `Paypal`
    directly, even with some you can use your debit card to withdraw your money from
    an `ATM` directly in your local currency.


    ### Where to buy using Bitcoins?


    Today there are many physical stores and online stores that offer the possibility
    of paying with `Bitcoins` but it is not yet too widespread.


    Some companies like `Namecheap` allow the payment of web domains with `Bitcoins`.


    There are people who have even bought or sold their house using `Bitcoins`.


    Anyway, at the moment I see cryptocurrencies as a high-risk investment and therefore
    I would not use this payment method.


    If you transfer cryptocurrencies between virtual wallets there is no way to know
    those transactions and therefore the Treasury cannot intervene until you pass
    your money to the bank.


    ### Is it safe to buy Bitcoins and cryptocurrencies?


    `Bitcoins` are the same or more secure than any current currency. What you should
    be careful about is how you use them and where you buy them.


    Keep in mind that the money in euros or dollars that you have in your traditional
    bank does not really exist. Only 1% of the money that a bank has should have it
    physically. Listen to this episode of the `Strange Days` podcast called `Strange
    Economy: Where Does the Money Come From?`


    Therefore, once you know this, cryptocurrencies are just one more currency with
    well-known security systems.


    The entire capitalist system is based on trust in the system itself. A €500 bill
    is just paper.


    However, just like if you buy in any online store, you must be careful and check
    that it is a safe and official website.


    If you buy through `Amazon`, you are able to open a `Gmail` account or carry out
    online operations from your bank, you will not have any problems.


    If, on the other hand, you are afraid to buy online, you have never created an
    email account and you do not have an account in your bank to access the Internet,
    you are cannon fodder to be deceived and suffer some scam on the Internet, both
    in the purchase of cryptocurrencies as in anything else.


    The solution is education in the online world. I recommend that you inform yourself
    and take a course and I already warn you that you should not try to invest online
    without the help of someone who really knows about this.

