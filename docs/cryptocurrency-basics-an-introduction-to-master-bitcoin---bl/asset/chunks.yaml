  trans: '


    `ICOs` 是所有人都可以的，除了美国或中国等少数国家，这些国家禁止其公民参与（尽管取得了相当的成功）。我们通常通过支付 `Ethereal` 或 `Neo`
    等其他加密资产来购买代币。


    这种组织募资的方式几乎没有受到监管，或者说完全没有监管。已经发生了许多欺诈性的 `ICOs`，其唯一目标是偷取天真的人决定投资到该项目的资金。


    ## 代币与操作


    在加密货币世界，有几种不同的代币（或“令牌”）。一方面是实用型代币（utility tokens），它们为用户提供访问特定服务。另一方面，我们发现了所谓的“证券代币”（security
    tokens）和“股权代币”（equity tokens）：


    - “股权代币”（我们可以翻译为标题代币）实际上是相关公司的一部分，转到了区块链上。


    换句话说，该代币是与发行公司相关的金融证券的加密表示。因此，它赋予了在上述公司股东大会上投票的权利，就像通过交易所收购的公司股份一样。


    - 对于“证券代币”，情况要复杂得多。这是一个随着加密货币出现的独立类别。这些代币给人们以某种权力幻觉，但实际上并没有赋予持有者对管理相关加密资产的人（无论是否为公司）决策的任何权利。它们仅仅是代币化，其价值源于相关加密资产的成功。


    因此，它们与证券代币完全没有可比性，因为它们被剥夺了相关的投票权。最后，如果翻译成法语，我们可以称之为投资者代币，这是一个不包含任何具体权利的通术。


    关于代币的更多信息，请参见我们关于该主题的完整指南：证券代币与实用型代币——股票市场对比。股票始终提供相同的保障：


    - 社会的一部分。

    - 根据以下标准享有的投票权：1 股 = 1 票。

    - 公司产生利润的股红。

    - 每年参加一次股东大会的权利。


    各种代币都不提供这些保障，证券代币目前在今天仍然非常稀少。因此，这些投票权和分红通常适用于你在交易所购买的股票。


    实用型加密资产根据项目的不同提供不同的服务：


    - 交易信号。

    - 交易费折扣。

    - 访问去中心化应用的可能。

    - 等等。


    投资者代币型加密资产通常什么都不提供，除了对未来价值增长的希望。


    ## 分红


    正如我们在上一点中看到的，分红是股市系统特有的。如果一家公司盈利并且没有决定重新投资所有利润以增加增长，它将向股东发放分红。


    然而，某些加密货币可以提供各种形式的伪装分红：


    - 通过发放去中心化投资基金表现的版税。例如 `NapoleonX` (`NPX`) 就是这种情况。

    - 通过中心节点系统（主节点），用户可以锁定他们的代币并向公众提供持续运行的服务器以获得被动收入。`TOMO` 或 `DASH` 等加密资产就是这种情况。

    - 某些加密货币持有者可以免费获得一些 `ICOs` 代币，这些代币使用他们的区块链来完成这一过程。这种机制被称为“空投”（airdrop）。以 `Wanchain`
    及其 `CryptoCurve` 项目为例：


    `Wanchain` 币持有者根据持有的 `Wanchain` 币数量比例收到了免费的 `CryptoCurve` 代币。


    - 某些交易所代币（即由加密货币交易所公司创建的代币），如 `COSS`、`KuCoin Shares` 或 `Cryptopia Shares`，允许其持有者定期获得用户向交易所公司支付费用的部分。这种收入取决于公司的利润，从法律角度来看并不等同于分红，但它无疑是整个加密货币宇宙中最接近分红的收入。然而，应该注意的是，能够获得这些“准分红”的代币完全没有赋予在相关公司股东大会上投票的权利：持有者不是公司成员，他们没有投票权，即使他们不喜欢该网站的某些地方。此外，从词汇角度来看，所获得的分红价值不能称为分红，但在实践中，它基本上是一回事的。


    ## 波动性的差异


    一个年轻的市场本质上是一个极不成熟的市场。因此，价格波动可能是巨大的。看到一种加密货币在一天内损失 30% 的价值，或看到其市值翻倍，并不罕见。


    在股市中，如果一种资产在单日内波动几个点点，我们会称之为灾难。


    然而，我们注意到加密货币市场的波动往往会急剧下降。例如，2016 年 `bitcoin` 的波动性小于一桶油。早年的极端波动将逐渐消失，让位于一个加密货币稳定性不亚于传统股票市场的世界。


    ## 专业水平


    股市本质上是一项专业人士的业务。所有大银行、所有最大的机构、养老基金、保险公司都在股市中。


    极其强大的专业交易员在市场中运作。许多机器人帮助决策或自己做出决策。强大的算法根据特定标准指示最佳决策。简而言之，股市本质上是有经验领域的人的业务。个人在股市中的寿命非常短，因为他无法与这些人、机构或程序竞争。


    在加密货币领域，情况不同。市场目前由业余人士组成。这些者通常缺乏技术技能，并对情绪反应强烈。讽刺的是，有些人说加密资产市场是一个猴子市场。


    许多在传统股市中可能无法募集到一分钱的项目，例如，通过加密货币已经成功地募集了数百万美元（甚至数十亿美元）。


    '
- fmt: '

    The financial sharks are not yet very present for the sole reason that it is a
    small market.


    So, as soon as the cryptocurrency grows and becomes better known, the market will
    become proportionately more dangerous. Complete regulation will therefore be much
    more profitable for these people than a total absence of regulation.


    ## The Scale of Speculation


    Many criticisms are perpetually being issued, claiming that cryptocurrencies are
    based on nothing and that no wealth creation to support this growth is taking
    place.


    In the current state of the market (November 2018), we can''t prove these people
    wrong. Almost all crypto assets are still only at the planning stage. Very few
    already have a viable product that can be used by the targeted customers.


    Currently, the value of crypto-currencies is therefore almost exclusively speculative.


    Until concrete progress has been made, this will remain the case.


    On the stock market, all companies have an economic activity that generates profits.
    Even though sometimes bankruptcies do occur, the entire stock market creates wealth.


    The value of companies operating on the stock market, although including a share
    of speculative value, is mainly based on the capacity of these companies to generate
    profits through their economic activities. This ability to generate profits is
    traditionally analyzed as a function of a large number of parameters, as explained
    below in the section "Fundamental analysis".


    Contrary to all this, the value of a cryptocurrency is generally only the result
    of crowd movements without any logic, or of manipulations that would be illegal
    on the stock market. Only the bigger ones got rid of this problem; and even among
    the cryptocurrencies at the top of the rankings, many still see their price at
    least partially influenced by completely irrational movements.


    That being said, that doesn''t mean that cryptocurrencies have no intrinsic value.
    Their objectives and users may change over time, bringing different valuation
    criteria. And the best example of this is Bitcoin since it was designed to be
    the people''s currency and today only serves as a standard of value, like gold.


    ## The Level of Regulation


    The stock market is strictly regulated. Although anyone can use any market, different
    laws apply to different markets. France will not have the same regulations as
    the USA or Japan for example.


    The world of cryptocurrencies, aside from a few small regulations or bans, is
    essentially an unregulated market. No set rule allows or prohibits certain activities.
    So, it can leave the field for many unscrupulous people to do whatever they want
    in this market.


    However, things are slowly starting to change. More and more states are starting
    to want to tidy it up a bit, and the subject was even put on the agenda during
    the G20 summit in Argentina in 2018.


    ## The Duration of The Opening of The Markets


    Due to the regulation of the stock exchange, it is necessary to define an opening
    time and a closing time to be able to verify that everything took place by the
    rules in force. The largest exchanges are open Monday through Friday during office
    hours.


    Considering the time difference between Asia, Europe, and America, one can find
    a stock exchange open at any time of the day. But we will not be able to carry
    out transactions on those that are closed because of office hours.


    The crypto-asset market is open 24/7. It never closes and one can access all the
    exchange sites at any time without any restrictions. The exchange sites will only
    be unavailable when the site is updated, or when they encounter technical problems
    (maintenance).


    ## Identification of Holders of Tokens and Shares


    On the stock market, there are mainly two types of shares:


    - Registered shares, which make it possible to identify the individual who owns
    these shares.

    - The bearer shares, which do not allow to put a name to the holders of such shares.


    Even if bearer shares tend to disappear due to the increasingly stringent measures
    taken to combat money laundering, tax evasion and terrorism, this type of action
    still exists and guarantees certain anonymity. For crypto assets, it is in practice
    relatively difficult to know the exact identity of a holder of crypto-assets.
    We can know which `wallet address` has a particular crypto asset when the cryptocurrency
    is not anonymous, but it will take further investigation to be able to link a
    name with the address of the wallet.


    However, the identity of individuals is requested during the following processes:


    - When participating in an ICO. Mainly to verify that you are not American or
    Chinese.

    - If you want to increase your withdrawal limits on certain exchange sites.


    Apart from these two measures which can link your name to certain operations,
    we can therefore say that most of the tokens can be considered as bearer.


    ## Technical Analysis


    Technical analysis is a method of studying the evolution of courses through the
    graph of the price of a crypto asset or action. This tool makes it possible to
    detect various trends based on a panel of indicators.


    Once these trends have been detected, you will be able to put in place a strategy
    that will generate profits.


    Technical analysis works wonderfully on stocks because the market is populated
    almost entirely by users of this process, which makes all of their movements predictable.


    When it comes to cryptocurrencies, opinions are rather mixed. Some consider technical
    analysis to be useful, while others think it is absolutely unnecessary as the
    crypto-asset market is very heavily manipulated by a few whales, and the movements
    of panicked crowds can have unpredictable effects. In addition, one must also
    consider the liquidity of the markets studied. Some crypto-assets have extremely
    low capitalization and volume, which means that a person with only a few hundred
    or thousand dollars can significantly move prices up or down.


    Technical analysis requires a cap and a minimum volume so that indicators may
    reflect a certain reality. Without it, the slightest buy or sell order will completely
    distort the analysis of the chart and the indicators will be of no use.


    ## Fundamental Analysis


    Fundamental analysis is a process of studying the project as a whole. Whether
    for companies listed on the stock exchange or companies operating in the world
    of crypto-currencies, the reasoning to have is essentially the same. Only the
    way of documenting presents some significant differences.


    Unlike technical analysis, fundamental analysis is based on the essence of the
    project. It is an analysis that helps to understand how the company intends to
    meet its objectives. We study the different strategies it offers, the people who
    are responsible for carrying out a particular task, the date of implementation
    of certain new features, the value of the company''s assets, etc.


    Some people believe that only fundamental analysis means anything in assessing
    the potential of a crypto asset.


    Others believe that fundamental analysis should be coupled with technical analysis.
    But all agree that fundamental analysis is important for a cryptocurrency project.


    In the stock market, fundamental analysis is more used by people who want to invest
    as a "good father". Only the most solid projects will be chosen. Technical analysis
    will be used more by traders for whom immediate profit is the main interest. Obviously,
    each of these two types of investors will use indications from these two methods
    in order to invest optimally and maximize potential profits.


    ## Main Difference Between A Listed Company and A Cryptocurrency


    As we have seen, companies operating on the stock market and those operating in
    crypto-currencies have the same objective: to create value by offering a product
    or services that will be useful for people.


    But we haven''t talked about the fundamental difference between publicly traded
    companies and those funded by crypto-assets: blockchain!

    '
  raw: '●The financial sharks are not yet very present for the sole reason that it
    is a small market.


    So, as soon as the cryptocurrency grows and becomes better known, the market will
    become proportionately more dangerous. Complete regulation will therefore be much
    more profitable for these people than a total absence of regulation.


    ***The Scale of Speculation***


    Many criticisms are perpetually being issued, claiming that cryptocurrencies are
    based on nothing and that no wealth creation to support this growth is taking
    place.


    In the current state of the market (November 2018), we can''t prove these people
    wrong. Almost all crypto assets are still only at the planning stage. Very few
    already have a viable product that can be used by the targeted customers.


    Currently, the value of crypto-currencies is therefore almost exclusively speculative.


    Until concrete progress has been made, this will remain the case.


    On the stock market, all companies have an economic activity that generates profits.
    Even though sometimes bankruptcies do occur, the entire stock market creates wealth.


    The value of companies operating on the stock market, although including a share
    of speculative value, is mainly based on the capacity of these companies to generate
    profits through their economic activities. This ability to generate profits is
    traditionally analyzed as a function of a large number of parameters, as explained
    below in the section "Fundamental analysis".


    Contrary to all this, the value of a cryptocurrency is generally only the result
    of crowd movements without any logic, or of manipulations that would be illegal
    on the stock market. Only the bigger ones got rid of this problem; and even among
    the cryptocurrencies at the top of the rankings, many still see their price at
    least partially influenced by completely irrational movements.


    That being said, that doesn''t mean that cryptocurrencies have no intrinsic value.
    Their objectives and users may change over time, bringing different valuation
    criteria. And the best example of this is Bitcoin since it was designed to be
    the people''s currency and today only serves as a standard of value, like gold.


    ***The Level of Regulation***


    The stock market is strictly regulated. Although anyone can use any market, different
    laws apply


    to different markets. France will not have the same regulations as the USA or
    Japan for example.


    The world of cryptocurrencies, aside from a few small regulations or bans, is
    essentially an unregulated market. No set rule allows or prohibits certain activities.
    So, it can leave the field for many unscrupulous people to do whatever they want
    in this market.


    However, things are slowly starting to change. More and more states are starting
    to want to tidy it up a bit, and the subject was even put on the agenda during
    the G20 summit in Argentina in 2018.


    ***The Duration of The Opening of The Markets***


    Due to the regulation of the stock exchange, it is necessary to define an opening
    time and a closing time to be able to verify that everything took place by the
    rules in force. The largest exchanges are open Monday through Friday during office
    hours.


    Considering the time difference between Asia, Europe, and America, one can find
    a stock exchange open at any time of the day. But we will not be able to carry
    out transactions on those that are closed because of office hours.


    The crypto-asset market is open 24/7. It never closes and one can access all the
    exchange sites at any time without any restrictions. The exchange sites will only
    be unavailable when the site is updated, or when they encounter technical problems
    (maintenance).


    Identification of Holders of Tokens and Shares.


    On the stock market, there are mainly two types of shares:


    ●Registered shares, which make it possible to identify the individual who owns
    these shares.


    ●The bearer shares, which do not allow to put a name to the holders of such shares.


    Even if bearer shares tend to disappear due to the increasingly stringent measures
    taken to combat money laundering, tax evasion and terrorism, this type of action
    still exists and guarantees certain anonymity. For crypto assets, it is in practice
    relatively difficult to know the exact identity of a holder of crypto-assets.
    We can know which wallet address has a particular crypto asset when the cryptocurrency
    is not anonymous, but it will take further investigation to be able to link a
    name with the address of the wallet.


    However, the identity of individuals is requested during the following processes:


    ●When participating in an ICO. Mainly to verify that you are not American or Chinese.


    ●If you want to increase your withdrawal limits on certain exchange sites.


    Apart from these two measures which can link your name to certain operations,
    we can therefore say that most of the tokens can be considered as bearer.


    ***Technical Analysis***


    Technical analysis is a method of studying the evolution of courses through the
    graph of the price of a crypto asset or action. This tool makes it possible to
    detect various trends based on a panel of indicators.


    Once these trends have been detected, you will be able to put in place a strategy
    that will generate profits.


    Technical analysis works wonderfully on stocks because the market is populated
    almost entirely by users of this process, which makes all of their movements predictable.


    When it comes to cryptocurrencies, opinions are rather mixed. Some consider technical
    analysis to be useful, while others think it is absolutely unnecessary as the
    crypto-asset market is very heavily manipulated by a few whales, and the movements
    of panicked crowds can have unpredictable effects. In addition, one must also
    consider the liquidity of the markets studied. Some crypto-assets have extremely
    low capitalization and volume, which means that a person with only a few hundred
    or thousand dollars can significantly move prices up or down.


    Technical analysis requires a cap and a minimum volume so that indicators may
    reflect a certain reality. Without it, the slightest buy or sell order will completely
    distort the analysis of the chart and the indicators will be of no use.


    ***Fundamental Analysis***


    Fundamental analysis is a process of studying the project as a whole. Whether
    for companies listed on the stock exchange or companies operating in the world
    of crypto-currencies, the reasoning to have is essentially the same. Only the
    way of documenting presents some significant differences.


    Unlike technical analysis, fundamental analysis is based on the essence of the
    project. It is an analysis that helps to understand how the company intends to
    meet its objectives. We study the different strategies it offers, the people who
    are responsible for carrying out a particular task, the date of implementation
    of certain new features, the value of the company''s assets, etc.


    Some people believe that only fundamental analysis means anything in assessing
    the potential of a crypto asset.


    Others believe that fundamental analysis should be coupled with technical analysis.
    But all agree that fundamental analysis is important for a cryptocurrency project.


    In the stock market, fundamental analysis is more used by people who want to invest
    as a "good father". Only the most solid projects will be chosen. Technical analysis
    will be used more by traders for whom immediate profit is the main interest. Obviously,
    each of these two types of investors will use indications from these two methods
    in order to invest optimally and maximize potential profits.


    ***Main Difference Between A Listed Company and A Cryptocurrency***


    As we have seen, companies operating on the stock market and those operating in
    crypto-currencies have the same objective: to create value by offering a product
    or services that will be useful for people.


    But we haven''t talked about the fundamental difference between publicly traded
    companies and those funded by crypto-assets: blockchain!'
