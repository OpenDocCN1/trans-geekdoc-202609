  trans: '

    作为投资资产的加密货币。加密货币必须在支付手段和金融资产之间找到平衡。因为在近年来，这确实是投资者们大量布局的优质领域。对于许多涌入这类新型金融资产的人来说，加密货币首先也是最后是一项可能获利的投资。


    然而，虚拟货币是否也和其他其他投资形式一样呢？可以确定的是，数字替代货币可以构成一种新的投资形式，同时参与新的数字经济。将加密货币归类为各种商品和其他非典型投资是常见的做法。这种分类法之所以意义在于，它要求人们保持谨慎，并且仅将资本的一部分投入此类资产中。


    `Bitcoin` 在 2017 年 12 月的价格约为 `$20,000`，在那段记录性的一年之后，这种著名的加密货币其美元价格翻了 15 倍。`Bitcoin`
    最近再次登上新闻，因为它在 2020 年底经历了爆发性的增长，并持续到 2021 年初，在 1 月 7 日触及超过 `$40,000` 的高点。


    即使这些令人目的的价格增长伴随着随之而来的波动，我们仍然理解虚拟货币所能引发的兴趣，它们展现出了令人印象深刻的性能，这种性能与其波动性相当。交易量的增加和虚拟货币市值的巨大增长清楚地表明了投资者对这些新型金融资产的兴趣。


    然而，请记住，购买加密货币某种程度上等同于对创新技术的下注。如果你投资的数字货币变得占据主地位（它们都在尝试以不同程度的成功来取代 `Bitcoin` 的地位），你将获得一笔丰收益。`Ethereal`
    仍然是 `Bitcoin` 的主要挑战者，其市值接近最著名的加密货币。


    还要注意，在线经纪商已开始提供如 `Bitcoin` 等加密货币的交易，特别是通过 `CFDs`。


    洲际交易所 (`ICE`)，即纽约证券交易所 (`NYSE`) 的母公司，是 `Bakkt` 平台的起源。该平台专门从事 `Bitcoin` 和加密货币业务，允许“购买、出售、花费甚至存储比特币”。其
    `Bitcoin` 期货在受联邦监管的市场上市。这一倡议清楚地反映了主要金融参与者对加密货币的兴趣。


    有些人甚至不犹豫地将加密货币与黄金相比，考虑到在这两种情况下，它们都是避险港湾。我们甚至可以认为，`Bitcoin` 和其他加密货币是年轻一代的数字黄金，他们与前代人对待贵金属的关系并不相同。


    ### 加密股权众筹：加密货币的另一种用途


    最后，加密货币还有另一种功能，虽然小众但同样重要：通过向人们（个人、机构投资者或商业天使人）筹集资金为项目提供融资。


    你可能会奇怪：什么是加密货币 `ICO`？它无非是以加密货币进行募资。


    加密货币确实也可以通过加密股权众筹（虚拟货币众筹）为公司提供融资。这一过程自 2014 年以来发展显著，主要包括通过虚拟货币进行股权众筹融资。这种做法被称为
    `ICO` 或“初始代币发行”（Initial Coin Offering）。


    多个平台提供这种解决方案，例如 `Swarm`。


    # 是什么决定了加密货币的价值？


    为什么加密货币会下跌？为什么加密货币在下跌？加密货币是如何升值的？找出影响加密货币价格的因素。


    *** 对虚拟货币的信心 ***


    首先，与任何货币一样，其基础元素是信任。人们需要信任加密货币，但这是可能的。这取决于网络。决定虚拟货币价值的是其网络。加密货币的用户越多，其价值就越高。两个基本因素将推动人们购买虚拟货币：在实体经济中的渗透率以及购买的便利性。投机仍然是加密货币发展的主要驱动力，由于实体经济保持疲软，其价格波动很大。虚拟货币日益民主化正在推高加密货币的价格。虚拟货币的民主化反映了大众日益增长的信心。个人现在可以通过他们的
    `PayPal` 账户或未来的 Facebook 代币 `Diem` 通过虚拟货币支付商品和服务。


    政府和央银行也表现出更多采用虚拟货币的倾向，这对加密货币的监管以及央行数字货币的出现。最后，金融市场似乎也在为加密货币留出空间。许多经纪商现在提供投资虚拟货币。几家大型投资银行设有加密资产部门，越来越多的传统基金和对冲基金正在布局加密资产。上一个值得注意的事件：美国加密货币交易所平台
    `Coinbase` 即将上市。


    *** 如何投资加密货币？ ***


    根据 Pipit 协会 2018 年 2 月的一项研究，四个人中就有一人买过加密货币。根据该研究，94% 的 60 以上的人不打算购买；而 `Odoxa-Linxea`
    在 2018 年 1 月对 `Les Echos` 进行的调查显示，四分之一的 18-24 岁年轻人正在考虑购买，36% 的人甚至认为他们有一天将取代官方货币。


    根据加密交易所 `BitFlyer` 在 2019 年 4 月进行的一项研究，在调查的 10,000 名欧洲人中，三分之二认为加密货币在十年后仍然存在。然而，受访者中只有少数十分之一押注未来将加密货币作为货币使用。

