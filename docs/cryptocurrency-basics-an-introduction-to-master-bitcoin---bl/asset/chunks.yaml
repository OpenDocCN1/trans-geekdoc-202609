  trans: '


    # Overstock

    这是一家直接接受 `Bitcoins` 支付的公司。在该网站上，你可以找到家具、电视，甚至是电脑。


    # Newegg

    这家在线电子产品商在其大部分库存上接受 `Bitcoin` 支付。


    # 视频游戏

    视频游戏行业，正如 `Ubisoft`（育碧）最新宣布正在开发一个区块链项目所示，是一个非常拥抱加密货币支付的成熟行业。


    - `Xbox`：在这里你可以购买优质游戏和在线网络订阅服务。

    - `PlayStation Network`：适用于 `PlayStation` 游戏和订阅。

    - `Zynga`：这家在线和移动游戏开创者也接受 `Bitcoin`。


    # 旅游业

    旅游预订网站竞争非常激烈。接受 `Bitcoin` 是网站脱颖而出的良好方法。因此，我们发现了许多参与者，例如：


    - `Expedia`：这是全球最大的旅游预订网站之一，你可以花费 `Bitcoins` 购买机票、预订酒店、参加游览，甚至租车！

    - `Virgin Galactic`：如果你想用 `Bitcoin` 购买太空之旅，这是可能的！`Richard Branson`（理查德·布兰森）的公司很好地接受
    `Bitcoins`。

    - `Air Baltic`：首家提供可用 `Bitcoin` 支付航班的航空公司。


    # 比特币是真正的货币和真正的支付手段吗？

    这是一个宏大的准哲学辩论，但我们将尝试为你提供一些反思的角度。


    为了成为一种广泛接受的支付手段和价值存储手段，货币必须具有以下属性的对象：不易腐烂、可识别、难以伪造、易于运输、易于存储、同质且可分割。


    让我们看看 `Bitcoin` 是否具有这些属性：

    - **不易腐烂**：显然是可以的。

    - **可识别**：像银行币一样，每个 `Bitcoin` 都有它自己的编号。所以是的，它是可识别的。

    - **难以伪造**：无法伪造，但拥有足够计算资源的人可能会尝试使用同一种 `Bitcoin` 进行多次支付。

    - **易于携带和存储**：只要你有智能手机或电脑，就易于存储和运输大量的 `Bitcoins`。

    - **同质性**：就像金条可以与金条相互交换，一个 `Bitcoin` 也可以与另一个 `Bitcoin` 交换。因此，它是非常同质的。

    - **可分割性**：一个 `Bitcoin` 可以被细分为 1 亿个单位，称为 `Satoshi`（聪）。


    乍一看，`Bitcoin` 具有货币的所有属性。但这不能保证它的成功。事实上，要获得成功，货币必须激发信任，最重要的是要有用。这两者也是紧密相连的。


    为了激发信任，`Bitcoin` 必须深刻说服其用户，他们能够随时将自己的 `Bitcoins` 换成商品和服务。货币的用户是一个巨大交换网络的一部分，该网络的价值由于构成该网络的人数而增加。为了变得真正有用，`Bitcoin`
    必须被足够的人接受。


    `Bitcoin` 与所有货币一样，都有一个缩写（欧元为 `EUR`，瑞士法郎为 `CHF` 等）。它通常被指定为缩写 `BTC`，但我们也发现缩写 `XBT`
    来指代加密货币之首。


    这个金融名称即使不是正式的，也对应于金融市场实行的系统。因此，在 `XBT` 中，`BT` 对应 `Bitcoin` 的缩写，而前面的 `X` 提醒我们，该资产不属于任何国家，正如
    `XAU` 中的 `X` 指代黄金一样。


    # 你用比特币买到什么？

    一些国家已正式承认 `Bitcoin` 为一种支付手段，例如 `日本` 在 2017 年 3 月的做法。事实上，加密货币在那里非常流行，`Bitcoin`
    支付相对常见。然而，在世界其他地方并非如此。


    在法国，很少有交易者接受 `Bitcoin` 付款。大多数接受它的业务都在互联网上。特别是 `Overstock` 或 `Shopify` 商家网站，接受
    `Bitcoins` 支付。`WordPress` 博客平台也接受 `Bitcoins`。但也有几家实体店可以花费你的 `Bitcoins`。请注意，在法国，它们几乎都位于巴黎。


    因此，购买电脑硬件、软件和 IT 解决方案是可能的，还可以购买家具、装饰品、服装等日常消费品。


    你可以通过将货币（欧元、美元等）兑换为 `Bitcoins` 来购买 `Bitcoins`，也可以通过以 `Bitcoin` 设置价格来出售商品或服务。


    在任何情况下，你都需要创建一个加密货币钱包来持有你的 `Bitcoins`。随后就会著名的钱包问题出现了。选择哪种 `Bitcoin` 钱包？倾向于哪个网站来持有
    `Bitcoins`？考虑到影响该行业许多玩家的黑客攻击或破产，这个问题远非易事。为了保留你的 `Bitcoins`，你必须有一个钱包，也就是说一个系列数字形式的地址，可以使用密码访问。地址和密码可以在专用平台上免费且方便地创建。


    然而，要用加密货币支付或接收支付，你需要下载软件或使用交易所平台。最后，要用加密货币支付（或接收加密货币支付），需要一个中间环节。你可以在类似于经纪人的交易所平台或可下载软件之间进行选择。


    # 如何用比特币支付？

    用 `Bitcoin` 支付有三种方法，无论是购买商品还是服务。


    1. 首先，你可以使用卖家提供的 `QR Code`。你只需用智能手机扫描它，就会打开你的钱包。然后你只需验证发送地址和金额即可完成支付。

    2. 但你也可以在电脑上在线商家点击“用比特币支付”。在这种情况下，你的钱包会自动打开。同样，你需要在验证接收地址和金额后进行支付。

    3. 最后，你也可以选择手动发送。你随后必须打开在线钱包，并将商家的地址复制到“发送至”字段中，并指定金额，然后进行你的支付。


    # 为什么要购买比特币？

    正如我们所见，`Bitcoin` 支付仍然有限，很少商家接受用 `Bitcoin` 交换他们提供的商品和服务。那么，为什么要投资 `Bitcoin`？`Bitcoin`
    的意义在哪里？`Bitcoin` 是如何增长的？为什么 `Bitcoin` 爆发了？在这里我们解释购买 `Bitcoin` 的原因，以及如何通过它赚钱，同时注意风险。


    '
- fmt: '

    Indeed, the craze that exists around the precious token is above all based on
    speculation without the intrinsic value really entering into account. It must
    be said that the volatility of `Bitcoin` and its significant rise in the long
    term is enough to make traders dream.


    # HOW TO INVEST IN BITCOIN?


    Despite its very geeky image, in September 2015, the regulator of the commodities
    market in the United States, the `Commodity Futures Trading Commission`, officially
    declared that `Bitcoin` fell under the commodity category.


    It is therefore the first step towards the regulation of virtual currencies and
    a certain recognition of cryptocurrency by financial institutions.


    Financial transactions in `Bitcoin` and trading on specialized platforms must
    now be carried out in accordance with the rules governing the exchange of raw
    materials.


    There are plenty of web platforms that offer bitcoin & cryptocurrency investment,
    the further sections of the book explain the steps which can be performed on any
    of the crypto trading website mentioned below:


    * ● `Coinbase` (`https://www.coinbase.com/`)

    * ● `Gemini` (`https://www.gemini.com/`)

    * ● `BlockFi` (`https://blockfi.com/`)

    * ● `Kraken` (`https://www.kraken.com/`)

    * ● `Robinhood` (`https://robinhood.com/`)

    * ● `eToro` (`https://www.etoro.com/`)

    * ● `Bitcoin IRA` (`https://bitcoinira.com/`)

    * ● `Binance` (`https://www.binance.com/en`)


    But we are also witnessing the emergence in the United States of trust companies
    specializing in cryptocurrencies such as `LLC` and `IT bit`.


    These two companies, in addition to meeting New York State Department requirements
    for capitalization, reserve, compliance, consumer protection, and cybersecurity,
    also provide warranties for computer storage systems and security systems. Cold
    storage vault for `Bitcoin` holdings from the famous `GABI` fund. The manager
    of the `GABI` fund offers the possibility of exchanging these particular transferable
    securities into `Crypto Delta One` (`CRYDO`).


    `CRYDO`, therefore, makes it possible to trade its securities on an electronic
    trading platform that offers indirect or synthetic exposure to the underlying
    price of `Bitcoin` without transmitting the explicit ownership of `Bitcoin`.


    ## Bitcoin is becoming a separate financial product!


    Now is the time to invest. One can indeed wonder when to invest in `Bitcoin`.
    If you want to invest in `BTC`, go for it. Perhaps you think it is too late given
    the already high price of crypto, or that it is still a bit early because it has
    a relatively low penetration rate in the real economy. Avoid looking at your investment
    from a market timing perspective.


    It is impossible to predict the price of this hyper volatile asset and at what
    level the prices of `BTC` will be in a month, in a year, and even less in 2. If
    you are tempted by the adventure and want to invest in `XBT`, do them. But by
    diversifying your investments and using the money you don''t need.


    Are you wondering how to invest in `Bitcoin` in France? And where to invest in
    `Bitcoin`, via which platforms and which brokers? To invest in virtual currency,
    two solutions are available to you: invest directly by exchanging euros for `Bitcoins`
    via specialized platforms such as `Polonium`, `Circle`, or `Coinbase`. You can
    also speculate on `Bitcoin` via financial products derived from the most famous
    virtual currencies. Several online brokers offer `CFDs` on `Bitcoin`. Indeed,
    online brokers `eToro`, `IG`, or even `XTB` allow you to invest in `Bitcoin` through
    a `CFD` on electronic money. Be careful, before putting your savings in cryptocurrency,
    ask yourself how much to invest in `Bitcoin`. Measurement is necessary when it
    comes to investment and the diversification of one.

