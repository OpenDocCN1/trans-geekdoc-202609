    The official specification and proof of the concept were published by Satoshi
    Nakamoto in 2009, although Wei Dai first described the concept of cryptocurrency
    in 1998 on a cypherpunks mailing list.


    ## Who controls the Bitcoin Network?


    There is no single entity that controls the Bitcoin Network. Is Bitcoin legal?
    In most jurisdictions, there are no legislations that prohibit Bitcoin, but there
    are some jurisdictions that restrict foreign currencies severely, or they are
    banned within these jurisdictions.


    ## Can Bitcoin be regulated?


    Bitcoin in itself cannot be regulated due to its decentralized nature.


    However, numerous brokers who offer a trade-in cryptocurrency have regulation
    and authorization along with some exchanges who may be regulated or at the very
    least licensed or registered with entities.


    ## Can I make money with Bitcoin?


    Bitcoin is not a way to make a substantial amount of money in a short amount of
    time. It does allow for some profits but there are still risks involved which
    may lead to substantial losses.


    ## Is Bitcoin safe to use and trade?


    Yes, but it is imperative to consider that the extent to which it is safe will
    depend on various factors, and despite the security features employed, there is
    a constant risk associated with cybersecurity threats where online activities
    are concerned.


    ## What happens if I lose my Bitcoins?


    When Bitcoins are lost, they remain on the blockchain, but they remain dormant
    forever as there is no way for the private key or keys to be found to allow for
    the coins to be spent again.


