- fmt: '

    Volatility is one of the major characteristics of cryptocurrencies. Thus, the
    value of a cryptocurrency, i.e. its price, can increase or decrease, very quickly,
    in an unpredictable way. In the question: its young economy, its unusual nature,
    and especially its times-illiquid markets.


    And the number of platforms further adds to the lack of liquidity of the tokens.
    Thus, at the end of 2019, “a volume of 143 bitcoins is enough to vary its price
    by 1% on the Bit stamp platform. Coinbase and Kraken are much more liquid, and
    it is respectively 456 and 672 bitcoins that must be exchanged to move the price
    of the leader in cryptos by 1%” reports the site Les Echos.


    Investing in cryptocurrency is therefore not recommended for cautious profiles
    with a strong aversion to risk. For others, think all the same not to keep a large
    part of your savings in Bitcoin or others which remain high-risk assets.


    There is a real risk of losing a large part of the money invested in this way.


    If the cryptocurrency adventure tempts you, go for it with money that you are
    ready to lose. It must be an investment representing a very small part of your
    financial assets. Cryptocurrency is more of an experiment to try if you feel like
    it than a reasoned investment made with a view to diversification. Wanting to
    make money really fast is never a good reason to invest in cryptocurrency.


    ## The Principles of Cryptocurrency


    As the name suggests, cryptocurrency, also known as Bitcoins and Litecoin among
    others, is crypto and virtual currency. But then, why use a virtual currency when
    you have access to your bank account via the Internet? Indeed, you can make transfers,
    online payments ... Anonymity is the first reason for the emergence of such a
    currency. It is indeed possible to pay for purchases in complete anonymity. Avoid
    of hacking on your current bank account. In addition, and this is where some will
    find cryptocurrency interesting, it escapes any banking system already in place.
    This means that nothing controls it and no one controls it enough to regulate
    it.


    ### Where to Use Such A Currency? At What Cost?


    Every day, the list of websites and merchants allowing Bitcoin purchases is growing.
    Thus, you can easily buy leather goods, beauty products, computer equipment, video
    games, and even services. Bitcoins are invading online payment. Its asset? It
    does not depend on any regulatory authority or any banking entity. You can therefore
    pay, be paid, make payments to a third party, even international, without paying
    any fees. A reality that is becoming more than attractive in the eyes of many
    merchants who today have to pay a percentage of their turnover to banks for each
    transaction made with a bank card.


    ### A Real Alternative System Shaking Up the Banking World


    Obviously, such a system arouses the suspicions or curiosity of professionals
    in the banking system. It would not be about seeing a complex and profitable system
    swept away by a cryptocurrency.


    The whole world of finance would be shaken. This is why many are studying this
    currency which, on paper, has only advantages. But now, who says "anonymity" and
    "deregulation" also says "money laundering", "organized crime", "parallel markets".


    That''s the concern if no transaction is traceable, how can you be sure that you
    are not laundering money, that you are not buying illegal products? This is the
    crux of the matter.


    ## Advantages of Cryptocurrencies


    **They are global currencies**

    These virtual currencies are not regulated by any type of governmental organization,
    such as the State, banks, financial institutions, or companies. This gives the
    possibility of being able to use them anywhere in the world. For example, `Bitcoin`
    claims that "in the same way that no one controls the technology behind email,
    Bitcoin also has no owners." Thus, this type of cryptocurrency is controlled by
    all its users. Therefore, although programmers improve their software, they cannot
    make a change without the consent of all customers.


    **They are safe.**

    According to experts, counterfeiting or duplication of cryptocurrencies is impossible
    thanks to a sophisticated combination of proven cryptographic techniques. In this
    sense, each person has cryptographic keys that are necessary to carry out any
    type of digital operation.


    **Some cryptocurrencies are deflationary.**

    Cryptocurrencies such as `Bitcoin` or `Litecoin` have limited the issuance of
    their virtual currencies. In the case of `Bitcoin`, at 21 million and `Litecoin`
    at 84 million. This turns them into deflationary cryptocurrencies, as the issuance
    of these digital currencies reduces over time.


    **They have irreversible transactions.**

    Another of its advantages are irreversible transactions. That is, if cryptocurrencies
    are used, no third party can cancel or modify a transaction already carried out.
    This is so because they are not regulated by a central body that can access them.


    **They are characterized by their immediacy.**

    One of their advantages in e-commerce, for example, is its immediacy. If we have
    international clients, this payment method could greatly speed up the exchange
    process, especially between banks in countries that do not have agreements with
    each other and have to go through a central bank, causing payment processes to
    be delayed several days.


    **They are transparent.**

    All transactions made through the `Blockchain` are public. The `blockchain` file
    is stored on multiple computers on a network, and not in one place. Thus, this
    type of storage allows it to be readable for all users, making it transparent
    and difficult to alter.


    ## Disadvantages of Cryptocurrencies


    At the same time, we find a series of disadvantages in cryptocurrencies that may
    be the cause of their no establishment in society and their mistrust in potential
    and future users.


    **Possible loss of money.**

    One of its main dangers, and its most risky characteristic, is that if you lose
    the private key to access your wallet, you lose all the money you had in it since
    it is virtual money. Therefore, it is advisable to have a backup of your wallet
    to avoid this fatal situation.


    **Changes and lack of regulation.**

    Currently, work is being done on its regulation and there are several directives
    of the European Union pending approval.


    **Mistrust in potential users.**

    Although the trend of cryptocurrencies has been growing in recent years, many
    companies have not yet dared to use this virtual currency. One, due to the risk
    of price fluctuations, and two, due to the ignorance of the benefits that cryptocurrencies
    can bring.

