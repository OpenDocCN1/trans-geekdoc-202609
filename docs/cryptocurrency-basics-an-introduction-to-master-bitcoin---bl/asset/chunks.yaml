- fmt: "\nThank again for choosing this book make sure to leave a short review on\
    \ amazon if you enjoy.\n\nI’d really love to hear your thoughts.\n\n# 1 \n\n#\
    \ CRYPTOCURRENCY\n\nSince the introduction of the euro, we Europeans have got\
    \ into the habit of going on vacation abroad without taking into account exchange\
    \ rates and other local monetary specificities. And yet, this is not the case\
    \ for everyone: everywhere outside Europe, the slightest border crossing entails\
    \ unwanted costs, and we often end up with unusable tickets in the back of our\
    \ pockets when the trip is over. The alluring idea of a universal currency has\
    \ certainly been around much longer than the euro, but it is only recently that\
    \ we have witnessed the birth of a real prototype: `Bitcoin`. However, many questions\
    \ arise. Can Bitcoin Be a Global Currency? What about other crypto assets? On\
    \ what criteria to judge crypto-currencies? Or, what will their future be?\n\n\
    To answer it, we will have to observe the birth of `Bitcoin` as well as its precursors,\
    \ but also the development of the entire current crypto-asset ecosystem.\n\nThen,\
    \ we will study the nature and philosophy of cryptocurrencies in general in order\
    \ to reflect on the issues encountered in 2018.\n\nBy cryptocurrency is meant\
    \ both a cryptographic currency and a peer-to-peer payment system. These digital\
    \ currencies are therefore virtual currencies in the sense that they are characterized\
    \ by an absence of physical support: neither coins nor banknotes and payments\
    \ by check or bank card are not possible either.\n\nThese are alternative currencies\
    \ that are not legal tender in any country in the world. Their value is not indexed\
    \ to the price of gold or to that of traditional currencies, nor are they regulated\
    \ by a central body or financial institutions. There are no central banks at their\
    \ head. And yet, security and transparency are their main assets! Because in fact\
    \ cryptography secures transactions that are all verified and recorded in a public\
    \ domain, ensuring both confidentiality and authenticity thanks to `Blockchain`\
    \ technology.\n\n# BLOCKCHAIN: THE BASIC TECHNOLOGY OF ZOOM\n\n## Cryptocurrency\n\
    \nCryptocurrencies are all based on the same principle: the `Blockchain`. Cryptocurrencies\
    \ are a series of numbers stored on a computer in the form of chains of blocks.\n\
    \nThe principle is actually quite simple and particularly well explained in the\
    \ section published in Les Echos `Bitcoin` and cryptocurrencies, new digital coins:\
    \ “Take a database.\n\nAllow anyone to make changes to this database, on the sole\
    \ condition of declaring themselves a \"member\". Set up a very long and very\
    \ complex control procedure which must be carried out each time a certain number\
    \ (\"block\") of changes is requested. This procedure is carried out not by a\
    \ single controller, but by all the voluntary “members”. Once validated, the “block”\
    \ of changes is dated and added to the others in the registry. Finally, let everyone\
    \ read the registry, and you have a `blockchain` database”. Thus, it is up to\
    \ the network (all the peers) to validate and confirm each transaction.\n\nThis\
    \ technology and this system are the basis of the vast majority of cryptocurrencies,\
    \ but `Blockchain` applications do not stop there. Indeed, it could disrupt the\
    \ entire financial sector but also certain sectors such as the legal or administrative\
    \ sector by eliminating the need for trusted third parties. No need for a notarial\
    \ act or civil status register or even cadaster with this distributed register\
    \ technology which helps to make data more secure and transparent. `Blockchain`\
    \ technology is after all a technology whose database cannot be changed without\
    \ meeting certain conditions.\n\n### HOW IS CRYPTOCURRENCY MADE?\n\nPeople who\
    \ make cryptocurrency are called miners. It is also said that they mine a cryptocurrency.\
    \ Minors are an integral part of the process. Without them, the `Blockchain` would\
    \ be frozen. For example, imagine that Peter gives `Bitcoins` to Paul.\n\nHowever,\
    \ it is only after a certain period of time that the transaction will be confirmed\
    \ by the `network`, made up called `nodes`. Behind the `Blockchain`, miners validate\
    \ the transactions. To confirm a transaction, a miner must find the cryptographic\
    \ function that connects the new block to its predecessor.\n\nThis is called `proof\
    \ of work`. In exchange for their services (and the computing power), they obtain\
    \ a reward that takes the form of `tokens` of the cryptocurrency.\n\n### HOW TO\
    \ MINE A CRYPTOCURRENCY?\n\nTo undermine a cryptocurrency, it is usually sufficient\
    \ to install software on your computer using the `processor` or `graphics card`,\
    \ or even both, in order to be able to solve the cryptographic problem requiring\
    \ a relatively large calculation power, which will allow you to touch new units\
    \ of the cryptocurrency in question. Be careful however, the main cryptocurrencies\
    \ have become too difficult for individuals to mine. The mining of many of them\
    \ has become largely professionalized and takes place on Chinese farms, buildings\
    \ of several thousand m2 where tens of thousands of servers run day and night\
    \ to mine cryptocurrencies (`Bitcoin`, `Litecoin`, etc.). Faced with this competition,\
    \ cloud mining solutions have been developed. No investment in specific hardware\
    \ is required. All you have to do is get in touch with a company that has invested\
    \ in the necessary equipment and “hire” your computing power.\n\n### WHICH CRYPTOCURRENCY\
    \ TO MINE?\n\nObviously, individuals are keen to mine the most profitable virtual\
    \ currencies like `Bitcoin`, but also `Dash`, `Ethereal`, `Monero`, `Litecoin`,\
    \ etc.\n\nHowever, it is very difficult today to make money by mining a cryptocurrency.\
    \ It is often much more interesting to invest in virtual currency in order to\
    \ hope to make profits.\n\n### MINER / DEVELOPER: WHO MAKES THE CRYPTOCURRENCY?\n\
    \nThe role of the cryptocurrency miner is therefore to validate the transactions\
    \ carried out.\n\nThe role of the developer is very different.\n\nA cryptocurrency\
    \ developer will develop the computer protocol at the base of the cryptocurrency\
    \ which defines, in particular, the number of tokens in circulation, their speed\
    \ of circulation, their storage power, etc. He is somewhat the architect of the\
    \ network.\n\n### BITCOIN, ETHEREAL, RIPPLE: THE MAIN CRYPTOCURCIES\n\nHow many\
    \ cryptocurrencies are there? This often-asked question sounds simple but in reality,\
    \ it is very difficult to know the exact number of virtual currencies. No site\
    \ lists them all.\n\nThe Ministry of the Economy and Finance counted more than\
    \ 2,871 in 2019, without having carried out an update since. There could be nearly\
    \ 3,000 today, but that's not the most interesting thing. It should be noted that\
    \ there are very many cryptocurrencies but that only a few dozen can be qualified\
    \ as popular cryptocurrencies.\n"
