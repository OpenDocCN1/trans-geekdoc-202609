    上述列出的许多因素已被认为是 `Bitcoin` 价格达到历史新高所需的充分基础。此外，还有计划在 2021 年 5 月进行的下一次减半。随着目前每日流入生态系统的
    `1800 BTC` 减少一半，这种供应短缺状况将加剧，并对 `Bitcoin` 的价格产生上行影响。


    数学模型和完善的经济理论为支持未来价格大幅上涨提供了强有力的论据。


    加密货币行业正在快速增长和变化。资金、资源和专业知识正以自互联网发展早期以来未见的方式进入这一领域。当然，这并不意味着你一定会成功，仍然有许多问题需要解决。然而，我们可以确定的一点是，接下来的几年将极其有趣。


    # 实战交易指南


    欢迎来到我们在这个数字经济时代追求加密货币利润最大化旅程的实操部分。是的，这是一段旅程，因为这本书是第一本书《比特币财富指南》（Bitcoin Wealth
    Guide）的延续和补充。在第一书中，我们考虑了加密货币的理论方面，涉及 `bitcoin` 的历史、其特性以及描述数字货币现象的其他理念。


    但仅仅有理念的理论层面是不够的，因为你还需要知道如何利用获得的信息为你的财务经验增值。


    所以，是的，`Bitcoin` 现在是一件大事，每个人都在争夺拥有一席之地，但你知道如何购买 `bitcoin` 吗？通过加密货币有哪些投资选择？加密货币还有其他你可能不知道的方面吗？


    这些材料将提供这些问题的答案以及更多内容。这是一本实战指南，意味着只要你采取行动，你所读到的一切都可以实施。如果你以前登录过加密交易所，但因为不懂而无法取得进展，别担心！在阅读完这些材料后，你回到交易所，并将由于附在章节中的图文指南而享受这一过程。


    关于加密货币投资，许多人只读过它、听过新闻，但没有参与。是的，加密货币具有波动性，但听着，如果你想从中发财，你必须通过交易和投资积极地参与市场。


    那些从加密货币中获得最佳收益的人，是那些在两个方面都非常积极的人：**学习**和**执行**！


    这本书提醒我们，仅仅了解世界上正在发生什么是不够的；在你参与之前，你将仅仅是一个旁观者。尽管加密货币已经存在很长时间，但它们最近经历了飞速增长，在本书撰写时，一个
    `Bitcoin` 的价格曾定在 59,592.40 美。


    全球范围内有一股数字浪潮，各国和人民正意识到 `Bitcoin` 以及整个加密货币的巨大潜力。你可以从下方的章节和内容中汲取信息并顺这波浪潮。现在就下定决心以开放的心态去学习，迈出第一步，进入所有魔迹发生地的加密货币投资世界。


    你准备好开始了吗？我们将从一个基础章节开启这一过程，详细介绍如何购买 `Bitcoin` 的步骤。


    # 购买比特币的实操步骤


    任何想要成为严肃、成功且持续的加密货币投资者，必须首先购买币，即 `bitcoin`。即使你已经学习了许多关于加密货币市场的知识，只有在你购买第一枚币时，所获得的知识才会产生益处。


    本章介绍了如何在 `Coinbase` 上购买你的第一枚 `bitcoin` 的分步指南。市场上有很多加密货币交易所，但我们将使用 `Coinbase`，因为它受欢迎且对初学者友好。


    ### 第一步：下载钱包


    首先，你需要一个用于购买的加密货币的钱包 App，特别是如果你想在出售之前持有一些的话。首先，你需要一个为你所购买的加密货币准备的钱包 App，特别是如果你想在出售之前持有一些的话。`Coinbase`
    也可以提供钱包。你可以下载钱包。首先，你需要一个为你所购买的加密货币准备的钱包 App，特别是如果你想在出售之前持有一些的话。`Coinbase` 也可以提供钱包。的。你可以从应用商店下载或使用其他钱包。(Images/image0141.jpeg)


    ### 第二步：在 `Coinbase` 上创建账户


    首先，在 `Coinbase` 上创建一个账户。输入你的名字、邮箱并设置密码。(Images/image0142.jpeg)


    ### 第三步：添加你的支付方式


    接下来，通过银行账户或借卡添加你的支付方式。你可以关联 0000 0000 0000 0000 到 00000000000000 的账户。(Images/image0143.jpeg)


    ### 第四步：点击交易以购买比特币


    在 `Coinbase` 上点击交易，选择你想要购买的 `bitcoin` 数量。(Images/image0144.jpeg)


    ### 第五步：购买前确认你的详情


    最后，确认你的详情以购买。交易所将向你收取费用。(Images/image0145.jpeg)


    可能需要一段时间，钱包才会显示你的购买记录，如果你仍然看到 0，不要担心。(Images/image0146.jpeg)


    然后你会收到一封购买确认邮件。在确认后，你可以启用“发送和接收”以接收 `Bitcoin`。(Images/image0147.jpeg)


    如果你想将 `bitcoin` 兑换为法币存入银行账户，请点击交易图标。(Images/image0148.jpeg)


    我们使用 `Coinbase` 来演示如何购买 `bitcoin`。因此，这并不是背书，因为你可以使用其他交易所。请始终对这些交易所进行研究，结合你从材料中学中学到的知识，做出正确的决定。


    为了结束这个基础章节，我们将考虑除 `Bitcoin` 之外市场上的十大加密货币；让我们开始吧！(Images/image0149.jpeg)


    # 加密货币


    ### 1. 以太坊 (ETH)


    以太坊 (`ETH`) 是 `Ethereum` 区块链的货币，通常被认为仅次 `Bitcoin` 的加密货币。`Ethereum` 也是 `bitcoin`
    的技术先进版本，具有指数增长的潜力。(Images/image0150.jpeg)


    ### 2. 瑞波 (XRP)


    `Ripple` 的创建是为了通过其平台实现跨境支付，它拥有 `XRP` 币。`XRP` 币被认为是仅次于 `Bitcoin` 和 `Ethereum` 的第三大加密货币（根据市值）。`XRP`
    与其他货币一样也有起伏，但保持了作为全球领先加密货币之一的地位。(Images/image0151.jpeg)


