    通过这些初步问题，我们可以了解这究竟是一次真正的创新和改进，还是相反，他们只是想强制将区块链推入一个并不需要它的系统。从这里开始，我们需要评估一系列参数，以便我们获得该项目的一个基本概览。


    主要参数包括：


    - **白皮书质量**：这份文档是项目的 DNA。为了区分高质量项目与其他项目，有必要阅读已经证明了其稳健性的项目白皮书，并将它们与我们正在检查的新项目进行比较。在基础层面理解项目的运作方式并能够可视化其技术可行性至关重要。参考如
    `bitcoin` 等论坛可能有助于更好地理解项目。

    - **团队**：这是一个非常重要的元素，就像任何初创公司一样，背后的人类团队以及他们克服复杂情况的能力决定了项目的成功或失败。在网络上看到他们的“脸”是有意义的，因为这表明他们通过置个人声誉对自己的工作表示信任。此外，他们在区块链生态系统中拥有参与项目合作的、受认可的“顾问”也是重要的。

    - **市值 / 用户数 ^ 2**：这个指标非常值得考虑，因为大多数与加密货币相关的项目都有社区效应，也就是说它们的价值应该与用户数量的平方成比例增加。小于
    1 的值是理想的，尽管在许多情况下看到超过一百甚至一千的数值，这将是远离该关键货币的指标，显示出被值过高的症状。

    - **有限单位**：创始人不能具备在他们想要时创建新单位的能力，这是至关重要的。

    - **路线图**：所有项目必须对中中长期将遵循的步骤有良好结构且合理的规划。

    - **Github**：这是一个协作开发平台。大多数主要项目在该平台上都有一个主题，开发者社区会验证代码质量并做出新的贡献以改进项目。我们必须查看该社区的规模。


    我们建议根据这些参数的相对重要性进行权衡，并获得总分。


    ***寻找良好的买入时机。***


    尽管我认为加密货币必须通过基本面筛选才能被视为购买选项，但这并不是充分的理由。


