    一家在加密货币领域运营的公司利用区块链来执行其项目。


    如果它希望能够募集资金，这甚至是一项义务。公司产品或服务的开发只能通过区块链技术完成。


    在某些情况下，当公司发现通过 `ICO` 融资比通过 `IPO` 更容易时，事实证明区块链对于完成项目并非必不可少。这只是为了更容易获得资金而设置的手段。因此，在投资之前你必须小心，仔细检查区块链对该项目是否真的有用。如果不是，它很可能是一个骗局。


    ## 骗局的数量


    股票市场受到严格监管，你不能在上面随心所欲。许多法律的设计旨在通过法律惩罚那些不遵守规则的人。


    但这种监管并非一 overnight 之间形成的。证券交易所首次制度化发生在 1409 年的布鲁日（比利时）。第一个有组织的法国交易所可以追溯到 1540
    年，发生在里昂。这意味着股市已经存在了 600 多年。


    在这一超过六世纪的漫长时期里，规则逐渐出现，以建立一个严格的框架来规范这些行为。但事情是一点点发生的，最大的进展往往发生在丑闻或重大危机之后，以确保未来不再发生此类。


    `bitcoin` 白皮书的发布于 2008 年 10 月。


    因此，加密货币只有十年的历史。监管措施几乎不存在，结果是许多骗局已经发生并持续不断发生。


    这甚至是一种损害个人对加密资产可能拥有的信心的灾祸。


    如果你想查看最常见骗局的列表，请尽管咨询我们在关于该主题的章节：`Bitcoin` 与骗局 - 自我教育！


    ## 沟通方法


    围绕加密货币的交流几乎完全通过互联网进行。存在不同的媒介：


    ● `Twitter`。

    ● 专业论坛。

    ● `Telegram`、`Discord` 或 `Skype` 上的讨论组。

    ● 加密货币网站。

    ● 加密资产会议期间。

    ● 等。


    即使从长远来看，股市信息也应该趋向于一个类似的系统，但也有专门的报刊杂志、向交易员传输信息的呼叫中心、与投资者的会议等。这些通信手段对于加密资产来说并不存在（或者微不足道）。


    这里我们到了本章节的结尾，该章节解释了股市和加密货币之间的共同点和差异。


    正如我们所看到的，我们可以说，在这两种情况下，它们都是试图创建产品或服务以产生收入的公司，特殊之处在于加密货币需要区块链来执行其项目。


    这两个市场之间的相似性远大于差异。然而，应该注意到，如果你想成为这些每个市场中胜任的投资者，就不应该忽视其中的一些主要差异。


    加密货币市场仍然年轻，该领域的发展非常快。因此，有必要密切关注新闻，以便尽可能定期跟上变化。


    同样重要的是理解，加密货币所需的技能与购买股票所需的技能相似。


    加密资产市场并不比传统证券交易所更容易处理。诚然，目前的公众中业余者的比例比传统证券交易所高。


    ## 区块链技术


    加密资产市场并不比传统证券交易所更容易处理。诚然，目前的公众中业余者的比例比传统证券交易所高。


    ### 区块技术


    区块链是一种分布式账本，它在许多计算机上记录交易，因此在不更改所有后续区块且不经过网络共识的情况下，记录无法被追溯修改。这使得区块链变得透明且安全。


    '
- fmt: 'CFDs are derivative products that allow you to trade on the price movements
    of cryptocurrencies without having to hold the underlying virtual currency. If
    you think that the value of a cryptocurrency will increase, you will go buy (it
    is "to belong"). If you think it is going to go down, you will position yourself
    to sell (that is, "be short"). Since CFDs are leveraged products, you only need
    to tie up a small portion of your capital (the `hedge`) to gain full market exposure.
    However, your wins and losses are calculated based on your total position. The
    leverage effect, therefore, amplifies the gains, but also the losses.


    ## Buying and selling cryptocurrencies via an exchange platform.


    When you acquire cryptocurrency through an exchange, you are purchasing the currency
    itself. To trade digital currencies in this way, you will first need to open an
    account, then lock in the entire position, and finally, keep your tokens in your
    cryptocurrency wallet until you decide to resell them.


    Exchange platforms do not all work the same, which is why you will need to familiarize
    yourself with the technology they use and learn how to extract the information
    that interests you. Many of them have deposit limits, and the costs of running
    the account can sometimes be staggering.


    ## How does the cryptocurrency market work?


    Cryptocurrency markets are decentralized, which means that these currencies are
    not issued by a central authority (a state for example). Instead, they travel
    through a network of computers. Cryptocurrencies can be bought and sold on exchange
    platforms (a kind of virtual stock exchange) and held in dedicated portfolios
    (or wallets).


    Unlike traditional currencies, cryptocurrencies are only digital proof of ownership
    stored on a `blockchain` (or blockchain in French). When a user wishes to sell
    cryptocurrency units to another user, he must send them to the virtual wallet
    of the latter.


    The transaction is considered completed only when it has been verified and added
    to the `blockchain` through a mining process. This is also how new tokens are
    usually created.


    A `blockchain` is a digital ledger used for the transmission and storage of data.
    In the context of cryptocurrency, it stores the history of transactions made for
    each unit of cryptocurrency, and thus keeps track of the change in ownership over
    time. The `blockchain` records transactions in blocks and the most recent ones
    are placed at the front of the chain.


    `blockchain` technology uses security devices that are much more powerful than
    those of simple computer files.


    ### A decentralized network


    `blockchain` files are open to anyone, and rather than being stored in one place,
    they are hosted by millions of computers at once. This makes the `blockchain`
    both transparent and resistant to change, leaving no weak points exposed to human
    or IT errors.


    ### Cryptography


    The blocks are cryptographically linked together using complex mathematical and
    computer formulas. Any attempt to tamper with data results in an interruption
    of the connection between the blocks and is very easily identifiable by computers
    on the network.


    ### What is cryptocurrency mining?


    Mining is the process by which recent cryptocurrency transactions are verified,
    following which new units are put into circulation.


    ### Verification of transactions


    Miners (computers responsible for mining) process pending transactions ensuring
    that the sender has sufficient funds to complete the transaction.


    The transaction details are compared with the transaction history stored on the
    `blockchain`. When the sender uses his `private key`, he gives his authorization
    to make the transfer of funds.


    ### Creation of a new block


    Miners collect valid transactions in a new block and attempt to generate a cryptographic
    link connecting it with the previous block by solving a complex algorithm.


    When one of them manages to generate this link, it sends it to the rest of the
    network for validation.


    ### What elements influence the cryptocurrency markets?


    Cryptocurrency markets evolve based on supply and demand. However, being decentralized
    markets, they are often better protected from the economic and political changes
    that generally impact traditional currencies.


    In addition to the uncertainty surrounding them, the following factors can have
    a significant impact on the price of digital currencies:


    - **Supply**: the total number of parts and their rate of issue, destruction,
    or loss

    - **Market capitalization**: the value of all existing coins and the probability
    that this number will increase, decrease, or stagnate

    - **Press**: media coverage (positive, negative, strong, or weak) of cryptocurrency

    - **Integration**: the ability of cryptocurrency to blend into existing infrastructure,
    such as online payment systems

    - **Key events**:major events such as regulatory changes, security breaches, and
    economic hardship


    ## How does cryptocurrency trading work?


    With IG, you can trade cryptocurrencies through `CFDs`, derivative products that
    allow you to trade on the rise or fall of the price of the cryptocurrency that
    interests you. These currencies quote in traditional currencies like the US dollar,
    and you never own the cryptocurrency itself.


    `CFDs` are leveraged products, which means that you can open a position by locking
    in only a small portion of the total value.


    ### What is the spread in cryptocurrency trading?


    The spread is the difference between the buy price and selling price. As with
    many financial markets, you are presented with two prices when you open a position
    in cryptocurrency.


    If you want to go long, you trade on the buy price, which is slightly above the
    market price. Conversely, if you want to open a short position, you trade at the
    asking price, which is slightly below the market price.


    ### What is a lot in cryptocurrency trading?


    Cryptocurrencies are traded in lots, sets of tokens used to standardize orders.
    Since digital currencies are very volatile the lots are usually small. A lot generally
    corresponds to one unit of the reference cryptocurrency. However, some cryptocurrencies
    are traded in larger lots.


    ### What is cryptocurrency trading with leverage?


    The leverage effect allows you to benefit from exposure to large amounts of cryptocurrency
    without having to pay the full value of the position in advance. Instead, you
    need to tie up a relatively small deposit called a `margin`. When you close a
    leveraged position, your gains and losses are calculated based on the total value
    of your position.


    Leverage amplifies your gains, but also your losses. It is therefore crucial to
    understand how it works before you start trading.


    ### What is hedging in cryptocurrency trading?


    `Margin`, or `hedge`, is a key part of leveraged trading. This is the amount you
    pay when you want to open and keep an open position. When trading cryptocurrencies
    through `CFDs`, be aware that the coverage required may vary depending on your
    broker and the size of your order.


    Coverage is generally expressed as a percentage of the total position. For example,
    to open a position in `bitcoin`, you will only need to deposit 50% of its total
    value. Instead of depositing €5000, you will pay €2500.


    ### What is a pip in cryptocurrency trading?


    Pips are units of measurement used to define the price movements of cryptocurrencies.
    They represent a movement of one digit in the price of digital currency.


    Typically, popular cryptocurrencies trade on a dollar basis. For example, if a
    cryptocurrency from $190.00 to $191.00, that means it has increased one pip. Some
    less popular cryptocurrencies use a different scale, where a pip can be a penny
    or even a tenth of a penny.


    To avoid any unpleasant surprises, be sure to read the instructions on the trading
    platform regarding the measurement of price movements before placing your orders.

    '
