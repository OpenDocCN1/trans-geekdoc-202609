    Cryptocurrency as a financial asset for investing Cryptocurrencies must find their
    balance between means of payment and financial assets. Because it is indeed good
    on which investors have positioned themselves in masse in recent years. For many
    people who have flocked to these new kinds of financial assets, cryptocurrencies
    are first and foremost a potentially profitable investment.


    However, are virtual currencies an investment like any other? What is certain
    is digital alternative currencies can constitute a new kind of investment, while
    participating in the new digital economy. It is common to include cryptocurrencies
    in the category of various goods and other atypical investments. This typology
    is relevant in the sense that it calls for prudence and to invest only a whole
    part of its capital in such assets.


    `Bitcoin` was around `$20,000` in December 2017 after a record year when the famous
    cryptocurrency saw its price multiplied by 15 in dollars. And `Bitcoin` has been
    in the news again recently with a spectacular rise in late 2020 that continues
    into early 2021 with a high of over `$40,000` reached on January 7.


    Even if these dazzling price increases are accompanied by consequent volatility,
    we understand the interest that can arouse the virtual currencies, able to display
    impressive performances which are matched only by their volatility. The increase
    in the volume of trade and the massive rise in the market capitalization of virtual
    currencies clearly indicates the interest of investors in these new financial
    assets.


    Keep in mind, however, that buying cryptocurrencies more or less amounts to betting
    on innovative technology. If the digital currency you have invested in becomes
    dominant (they all try with varying degrees of success to dethrone `Bitcoin`),
    you will have made a good deal. `Ethereal` remains the great challenger of `Bitcoin`
    with a market capitalization close to the most famous of the cryptocurrencies.


    Note also that online brokers are starting to offer trading in crypto-currencies
    like `Bitcoin`, notably via `CFDs`.


    The Intercontinental Exchange (`ICE`), the parent company of the New York Stock
    Exchange (`NYSE`), the New York Stock Exchange, is at the origin of the `Bakkt`
    platform, specializing in `Bitcoin` and crypto-currencies, which allows `buy,
    sell, spend and even store Bitcoins`. Its `Bitcoin` futures are listed on a federally
    regulated market. An initiative that clearly reflects the interest of major financial
    players in cryptocurrencies.


    Some do not even hesitate to compare crypto-currencies to gold, considering that
    in both cases, it is a safe haven. We can even go so far as to think that `Bitcoin`
    and other cryptocurrencies are the digital gold of young generations who do not
    maintain the same relationship as the previous ones with the precious yellow metal.


    ### Crypto-equity crowdfunding: another use of cryptocurrency


    Finally, crypto-currencies have another function, more niche but just as important:
    the financing of projects by raising funds from people (individuals and institutional
    investors or business angels).


    You may be wondering: what is a cryptocurrency `ICO`? It is neither more nor less
    than fundraising in cryptocurrency.


    Crypto-currencies can indeed also be used to finance companies via crypto-equity
    crowdfunding, crowdfunding in virtual currencies. The process, which has developed
    significantly since 2014, consists of financing equity crowdfunding through virtual
    currency. This type of practice is referred to by the term `ICO` or `Initial Coin
    Offering`.


    Several platforms offer this solution, such as `Swarm` for example.


    # WHAT MAKES THE VALUE OF A CRYPTOCURRENCY?


    Why is a cryptocurrency going down? Why is a cryptocurrency falling? How does
    a cryptocurrency increase in value? Find out what are the factors that influence
    crypto prices.


    *** CONFIDENCE IN VIRTUAL CURRENCY ***


    First, as with any currency, the founding element is trust. People need to trust
    cryptocurrencies in general, but it''s impossible. The to of the of of the network.
    What makes the value of a virtual currency is its network. The more users a cryptocurrency
    has, the more its value increases. Two essential factors will push people to buy
    virtual currency: the penetration rate in the real economy and the ease with which
    one can buy. Speculation is still the main driver of development of cryptocurrencies
    and their prices vary considerably as the real economy remains weak. The growing
    democratization of virtual currencies is boosting the price of cryptos. The democratization
    of virtual currencies reflects the growing confidence of the general public. Individuals
    will now be able to pay for goods and services via virtual currencies with their
    `PayPal` account or the future Facebook token, `Diem`.


    ments and central banks are also showing more inclination to adopt virtual currencies
    with an effort made on the regulation of cryptocurrencies and the emergence of
    digital currencies from central banks. Finally, the financial markets also seem
    to be making room for cryptos. Many brokers now offer to invest in virtual currencies.
    Several large investment banks have a unit dedicated to crypto assets, and more
    and more traditional funds and hedge funds are positioning themselves in crypto
    assets. Last notable event: `Coinbase`, the American cryptocurrency exchange platform,
    should soon go public.


    *** HOW TO INVEST IN CRYPTOCURRENCY? ***


    One in four people has already bought cryptocurrency. One in three people intends
    to buy them according to the February 2018 study carried out by the Pipit Association.
    If 94% of people over 60 do not intend to buy, according to the same study, a
    poll for `Les Echos` by `Odoxa-Linxea` in January 2018 indicated that a quarter
    of 18-24-year-olds are considering buying, and 36% of them even think that they
    will one day replace the official currencies.


    According to a study carried out in April 2019 by the crypto exchange `BitFlyer`,
    two-thirds of 10,000 Europeans surveyed believe that cryptocurrencies will still
    be there in ten years. However, barely a tenth of that surveyed bet on the use
    of cryptos as a currency in the future.

