    year. The Christmas rally of Bitcoin and other virtual currencies in its wake
    has been impressive, to say the least.


    In this troubled context, cryptocurrencies have finally succeeded in establishing
    themselves as a safe haven. As Nathalie Janson, Economist, and teacher-researcher
    at NEOMA Business School underlined at the beginning of December 2020: "radical
