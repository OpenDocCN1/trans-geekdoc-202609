    比特币投资信托是同此类首个，这在很大程度上导致了其估值过高。虽然市场上有关于其他类似结构基金进入的传言，但 `BIT` 仍然是游戏中唯一的大玩家。然而，随着加密货币市场的演变，类似的基金无疑会进入市场，这不仅会减轻
    `BIT` 的压力，还将巩固比特币作为全球认可货币的地位。


    ## 购买比特币的困难


    ### 信用卡或 PayPal

    这可能让你感到惊讶，但无论你正在使用哪种具体的交易方法，要用信用卡或 `PayPal` 购买比特币并不容易，这取决于你所在的地区。交易所避开了这些支付方式，而是要求用户连接他们的银行账户。大多数私人卖家对此类交易持警惕态度，更倾向于使用现金。这是由于所谓的“退款”。大多数信用卡或
    `PayPal` 交易都可以通过拨打发卡公司轻松撤销。比特币交易是不可逆的，而且要证明比特币转账中确实有产品易手极其困难，因此这种支付方式通常被避开。


    ## 关于购买比特币的警告


    ### 你所在国家的法律问题

    比特币确实吸引了执法机构、税务机关和法律监管机构的兴趣。他们试图理解的是加密货币如何融入现有的框架中。


    你的比特币活动的合法性取决于你是谁、住在哪里以及你对它做了什么。基本上，对大多数国家的答案是简单的：如果你没有将你的比特币花在任何非法活动上，你就没有违反任何法律。


    比特币已经存在了一段时间，因此大多数政府都有足够的时间决定其合法性。截至 2017 年 9 月，`BTC` 仅在`越南`、`冰岛`、`玻利维亚`、`厄瓜多尔`、`吉尔吉斯斯坦`和`孟加拉`非法。其他一些国家尚未立场，而`泰国`和`俄罗斯`最初禁止了所有数字货币，但不久后又取消了。最近，俄罗斯当局甚至考虑正式承认比特币及所有数字货币以打击非法交易。


    ### 保护风险

    值得注意的是，尽管大多数交易所和钱包对用户实施了身份验证要求，但这些服务并不提供与银行同水平的保护。例如，如果交易所破产或被黑客盗，他们对用户资金的保险通常非常有限或完全不存在。臭名昭著的中国交易所
    `Mt Gox` 就是这种情况，它正式提交了破产保护申请，并承认了客户的 75 万比特币不可挽回的损失。由于比特币在世界大部分地区不具备法律货币地位，当局通常不确定如何处理盗窃。


    此外，如果由于用户端的安全漏洞或密码泄露导致加密货币被盗，则没有保证的方法可以回资金。由于监管的不确定性，一些银行甚至拒绝处理通过数字货币交易获得的资金。


    ## 购买比特币的技巧

    在交易比特币时，将你的私钥（类似于 `ATM 密码`）视为受保护的秘密至关重要，并仅使用它来授权 `BTC` 交易。


    私钥保存在你的钱包中，因此保护它是一个好主意。


    例如，你可以用强密码加密钱包、备份你的钱包或选择冷存储选项，这基本上意味着将其保持离线状态。一些交易所甚至提供“多重保险箱”选项来存储你的密钥。


    多签名地址允许这些人通过公钥部分控制该地址。因此，当有人想要花费存储在该地址的某些比特币时，他们除了自己之外，还需要这些人对他们的交易进行签名。


    所需的签名数量通常由创建该地址的人员达成共识。


    最后，尽管大多数交易所为用户提供钱包功能，但非常重要的是记住这不是他们的主要活动。此外，加密货币的历史上充满了交易所关闭并卷走用户资金的案例。


    由于这些原因，如果你决定在交易所购买比特币，请记住这并不是他们的首要任务。


    # 比特币的未来

    随着加密货币变得更容易交易，比特币作为支付手段的普及将在人群中扩散，加密货币在国际支付中提供了明显的优势。


    然而，比特币价格剧烈波动使其作为支付手段变得困难，或许关键在于其价格的稳定。加密货币正受益于此。另一方面，投资者发现比特币是极具吸引力的利润来源。


    比特币的产生上限为 2100 万（在 `中本` 的手中流通），这使其成为一种稀缺资产。


    最终，比特币或任何其他加密货币缺乏像黄金那样的内在价值且没有国家背书，导致其价格完全由供需决定。


    对于黄金的粉丝来说，黄金的吸引力是显而易见的。贵金属在现实世界中使用以金币、珠宝和其他装饰品的形式可见，并且拥有悠久的历史。比特币的怀疑者反复指出加密货币内在价值的缺失是其最大的弱点。


    专家认为 2021 年将是黄金的好的一年。`Enigma Securities` 研究总监 `Joseph Edwards` 认为，“千禧一代和 Z 世代看到比特币已经存在了十年，它在技术上得到了维护，从市场冲击中恢复了过来，而且他们非常喜爱（加密货币）”。

    '
- fmt: '

    Skepticism about the future of `bitcoin` remains very clear. Edward Moya, senior
    market analyst at the `Oanda` trading group believes that "gold could experience
    a temporary setback, but would have a clear path to the upside for the rest of
    the year." Razaqzada, for his part, expects all-time highs for the raw material,
    which points to "continued growth in the supply of cheap money from the Central
    Bank."


    Many predict that the price of `bitcoin` will correct in the coming months, with
    investors selling while prices remain high. In addition, Moya and other analysts
    believe it will be a strong year for gold: "Furthermore, the demand for gold jewelry
    could rebound as the world economy recovers, over time, from the pandemic." The
    key is liquidity.


    It is clear that gold has been around for too long to suddenly disappear. "Despite
    the horrors of the past year, the trend is toward smaller and smaller geographic
    and temporal boundaries in practice," Edwards said. "We no longer live in a world
    where we feel comfortable being illiquid; `bitcoin` is now the most liquid asset
    on the planet."


    For this reason, other cryptocurrencies, such as `Ethereum`, are likely to increase
    in popularity and value as well. Several central banks are also making progress
    in developing their own digital currencies.


    ***Economic Theory of Bitcoin***

    `Bitcoin` is not the future, it is the past from the point of view of economic
    theory, Professor Paul De Grauwe analyzes the rise of `Bitcoin` and how it seems
    that there is no limit to its bubble, at the level of the great bubbles in history.
    The logic of all bubbles is always the same: excessive optimism about the value
    of a good and the expectation that its price will continue to rise. When the bubble
    bursts, the price collapses. What are expectations based on `Bitcoin` and the
    like? The idea is that they are the currency of the future but "nothing is further
    from the truth." In fact, De Grauwe indicates, `Bitcoin` is an archaic currency
    that uses, like gold, scarce resources. Therefore, more than a cryptocurrency
    of the future, `bitcoin` is a currency of the past, instead, the electronic currency,
    increasingly cheaper in terms of production, is the currency of the future. And
    although `Bitcoins` can lower their production costs, they compare very poorly
    with existing technology.


    ***Why can''t it be a coin?***

    There are also other relevant reasons why cryptocurrencies have no future as means
    of payment and units of account, that is, the main functions of money.


    First, the supply of `Bitcoins` is fixed asymptotically, not responding to the
    growing demand and need for the supply of this currency. The `Bitcoin`-based economy,
    then, would face permanent deflation with profound economic consequences for investors,
    entrepreneurs, and future growth. Along these lines, Matt O''Brien in `The Washington
    Post` also denies the role of `Bitcoin` as a currency and highlights this same
    aspect: the mysterious creator of the currency decided that there would only be
    21 million `Bitcoins`.


    That explains why when demand increases, the price also increases. But, he wonders,
    "what does it mean for a currency to increase in value, as `Bitcoin` has done,
    from `$775` last year to more than `$17,000` today?" Well, with the same currency,
    you can buy 22 times more things than before. This means that "the prices of everything
    have plummeted in terms of `Bitcoin`." That is, again, deflation: 95.4 percent,
    to be exact.


    And this is, neither more nor less, the death of a currency. So, are we really
    looking at the cryptocurrency of the future? Would you take out a `Bitcoin` mortgage
    that was originally `$200,000` but can turn into `$3.4 million` a year later?


    De Grauwe also points out a second aspect, even more, relevant regarding the future
    of `Bitcoin`, which makes `Bitcoin` a dangerous currency since it faces a supposed
    idealized world - where `Bitcoin` would be central - with the real world.


    `Bitcoin` would not be backed by a lender of last resort, central banks, and when
    crises came, and they always do, everyone would go towards liquidity, but this
    would be nonexistent. If there are no central banks to provide liquidity, it goes
    into deflation and insolvency.


    A `Bitcoin` economy is not flexible enough. But this absence of central banks
    is the most remarkable thing for the “market fundamentalists”. For some, `Bitcoin`
    has become the “symbol of a free market world” where, freed from government controls,
    wealth will be created for many, with self-regulating markets that will avoid
    crises. There, `Bitcoin` will play a central role there. But not in the real world,
    De Grauwe concludes. But then, if it is not a coin, what is it? O''Brien is equally
    critical: it is not only a failed currency, it is also a failed payment system
    due to its slowness and costs (such as the bandwidth required to carry out transactions),
    which make it a new and not improved `PayPal`.


    ***So why the cryptocurrency mania?***

    As Scott Rosenberg indicates in `Wired`, all new technology experiences, in its
    beginnings, a period of expansion, so this technology is supposed to be able to
    solve all possible and imaginable problems until a time comes when they are seen
    in more clear advantages and disadvantages. This is happening with the electronic
    currency `Bitcoin` in particular and with cryptocurrencies in general as well
    as with the `blockchain`.


    Basically, `blockchain` technology is a distributed ledger protected by a cryptographic
    system. Anything that can be made a list can be managed with `blockchains`. For
    this reason, many entrepreneurs are trying to use it for countless things, from
    finances to managing the land to medicine. As the author says, " some of these
    ideas are brilliant while others are ridiculous." But this is so by the very logic
    of the innovation system and venture capital. Through it, the technology industry
    determines what each platform really serves.


    2018 will be the year of “cryptocurrencies for everything”. In fact, more than
    `$4 billion` has been raised the majority in the last year - in the introduction
    of new cryptocurrencies. “The future in which each of us has our own currency
    remains unlikely. But one in which big tech company issues a token as its own
    currency is probably not that far off. But first, three issues must be resolved
    in the industry:


    1. Are these cryptocurrencies primarily investments or tools? At the moment, there
    are models where these coins are used as an investment - imitating the characteristics
    of other conventional products while other innovative models put those tokens
    to work within the platform to continue developing. In the near future, one of
    the two models will prevail.

    2. Can we abandon the idea that cryptocurrencies are a new species of traditional
    currency? Although at the beginning these types of currencies were framed as "digital
    money" it is not exactly that. It is necessary to get away from that idea: "this
    new technology looks like the coin, but it really is not."

    3. Can developers put an end to the numerous problems surrounding the electronic
    currency `Bitcoin` and other cryptocurrencies? And the difficulty of selling and
    storing `Bitcoins`, which makes most pay third parties to do so. These intermediate
    services are the biggest point of failure and fragility of the system and in 2018
    these providers will fight to win the trust of users.


    For these coins to truly advance, these problems must be solved. Although, basically,
    all the problems that these currencies face can be summed up in "trust", which
    is still paradoxical since these systems were based precisely on a "techno-libertarian"
    idea of a world without "need for trust.” Due to the irrefutable guarantee of
    the `blockchain`.


    Meanwhile, there is an investment appetite and technology available to continue
    investing in this technology. We are still in the expansion phase, but we will
    have to begin to see its real profits and ability to solve specific problems.
    Or, if not, they will be useless.


    ***Future Predictions***

    '
