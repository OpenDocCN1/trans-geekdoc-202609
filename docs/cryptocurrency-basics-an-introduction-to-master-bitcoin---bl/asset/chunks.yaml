- fmt: '

    Bitcoin miners are therefore above all professionals. They are even gigantic structures
    with substantial computer systems. In fact, Bitcoin mining has become more professional
    in recent years and Bitcoin is now mined in "farms", that is to say, warehouses
    of several thousand or even tens of thousands of square meters, housing server
    computers running at full speed, located in relatively cold regions so that the
    servers do not overheat.


    Bitcoin is experiencing unprecedented success in China, where there are no longer
    any mining farms for the famous cryptocurrency. Most Bitcoin miners are Chinese.
    Thus, China''s share in Bitcoin mining is estimated to be between 70% and 80%
    globally.


    Bitcoins are used as a direct online payment method. However, they can be converted
    into dollars or euros on markets provided for this purpose. Physical coins have
    even been launched, which can be purchased online using either virtual Bitcoins
    or traditional means of payment, on eBay, `BitMit`, `Memory Dealers`, or even
    `Hard BTC`.


    ## BitMit HOW TO GET BITCOINS?


    To obtain Bitcoins in a way that is both simple and fast, you have to resort to
    online platforms where you can buy them against euros or another currency (`coin
    base`, `binance….).


    In most of these platforms, buying Bitcoins is done in three steps.


    It is first necessary to open an account on the `Bitcoin Central` site by creating
    a username and a password. It then becomes possible to fund this account in euros,
    or another currency, by bank transfer.


    The user must then consult the site''s order book. This order book lists the prices
    at which Bitcoin sellers are willing to exchange virtual currency for euros, or
    another currency. Finally, you have to place an order by proposing a purchase
    limit price, which is the maximum price at which you are ready to buy Bitcoins.
    The order is only executed when a Bitcoin seller offers a price less than or equal
    to the buy limit price. Once the order is executed, the user''s account is funded
    with Bitcoins and their holdings in euros, or other currencies, are transferred
    to the Bitcoin seller.


    It is also possible to sell Bitcoins for euros, or other currencies, by placing
    a sell order. The euros in the `Bitcoin Central` site account can then be transferred,
    by transfer, to a bank account.


    Therefore, this means that a purchase of Bitcoins is not irreversible. However,
    beware of variations in the Bitcoin price, which may or may not be favorable to
    the user depending on the case.


    ## HOW TO SPEND YOUR BITCOINS?


    To pay a seller of goods or services in Bitcoins, it is necessary to receive from
    him an "address". An address is a succession of letters and numbers, to which
    the buyer sends the number of Bitcoins owed.


    To receive this type of address, it is necessary to have a software wallet.


    You can install a software wallet on a computer (with the `Bitcoin-QT` software
    for example) or a Smartphone (`Bitcoin Wallet`).


    The software wallet not only allows you to receive these addresses when you are
    a buyer but also, to generate them when you are a seller. Thus, each user must
    have his own software wallet.


    Smartphone wallets can sometimes be used to pay in physical stores by simply scanning
    a code displayed on a screen. A very small number of stores, restaurants, or hotels
    accept bitcoin payments, but their number is steadily increasing.


    There are also web wallets: instead of being installed on a specific computer,
    the web wallet is available online from any computer, subject to having the username
    and password. However, these wallets are much less secure than software wallets.


    Bitcoin transfers, therefore, take place through this address exchange game: exchanging
    Bitcoins is comparable to exchanging emails. But, even more than for emails, it
    is crucial to secure your Bitcoin wallet, in particular through regular backups
    of your wallet.


    ## A NEW USE OF BITCOIN: ICOS


    The introduction of a company on the stock market is called, in English, an `IPO`
    (initial public offering). An `ICO` (initial coin offering) is a somewhat similar
    process, except that fundraising is carried out in virtual currencies, of which
    bitcoin is the best known, and that one does not acquire the ownership of a company.
    In most cases, this involves financing a new blockchain or an application based
    on an existing blockchain. This type of funding can be compared to crowdfunding
    in that the public can directly fund a bitcoin start-up. These ICOs operate in
    unregulated markets, resulting in increased risk for investors.


    ## HOW ARE BITCOINS CREATED?


    Buying on platforms provided for this purpose is not the only way to get Bitcoins,
    although it is simple and fast. Indeed, Internet users can also participate in
    the process of creating new Bitcoins and the authenticity of the payer and the
    availability of funds must be obtaining them as well. This is called “Bitcoin’s
    mining”.


    A new user who wants to be content with just buying Bitcoins through the planned
    platforms does not need to know how Bitcoins are created.


    To ensure the credibility of the system, it is necessary that the authenticity
    of the payer and the availability of funds are verified when paying in Bitcoins.


    This is why a monitoring process is put in place: in concrete terms, Internet
    users who are members of the network - the “Bitcoin’s miners” - invest in computer
    equipment that they make available to the system for its proper functioning and
    security. The computers of these Internet users are then put in competition to
    develop complex mathematical functions which make it possible to verify the validity
    of the transaction. The one who wins the validation is rewarded by receiving newly
    created Bitcoins.


    ## HOW TO SPEND BITCOINS AROUND THE WORLD?


    Once your Bitcoins have been purchased through `BYKEP` and your tobacconist, you
    are probably wondering how to spend your Bitcoins to buy goods and services like
    with a regular currency. With the gradual adoption of Bitcoin around the world,
    it now seems easier and easier to use your Bitcoins to buy goods. Remember that
    Bitcoin is not intended to be an object of speculation, but a global currency.


    At the time of the first Bitcoin transaction, almost 10 years ago, it was still
    very difficult to buy goods with Bitcoins, the situation has changed a lot since
    then. While not all points of sale accept Bitcoin payments; the adoption is underway.


    The best example is the possibility of paying in Bitcoin on `Amazon` and soon
    on `Domino’s` pizza. `Starbucks` is also considering whether to accept bitcoins.
    Even Italian supercar maker `Lamborghini` has taken to Bitcoins.


    There are also solutions to use your bitcoins indirectly, through conversion into
    a national currency. This is made possible by the many exchanges like `Coin base`
    or `Binance`. Recently, we have also seen initiatives appear to allow you to use
    a bank card directly linked to your Bitcoin wallet. `Coin base` has just launched
    its card in Europe, the companies `Wirex` and `Monaco` have developed similar
    projects. Finally, many sites allow you to buy Bitcoin gift cards, the vouchers
    purchased then giving access to a wide range of products and services. These sites
    are for example `regifter`; `Gyft` and `purse io.Gyft`.


    Let''s take a look at the sectors that stand out in the adoption of Bitcoin as
    a payment method in its own right.


    ### E-commerce


    In the white paper behind Bitcoin, founder `Satoshi Nakamoto` already spoke of
    the development of e-commerce as one of the factors explaining the creation of
    a completely digital currency. It is therefore understandable that some major
    players in the sector are positioning themselves favorably and accept Bitcoin.
    Here are some examples.


    **Amazon**: The most famous e-commerce platform, which offers almost everything
    for sale, accepts payments in Bitcoin! This is excellent news that will undoubtedly
    push traders to adopt cryptocurrency.

