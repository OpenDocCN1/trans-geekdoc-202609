    \ and does not take more than 5 minutes to complete.\n\n4 \n\n# CHARACTERISTICS\
    \ OF BITCOIN\n\nWhen you go tomorrow to buy Bitcoin at your tobacconist through\
    \ BYKEP, it is interesting for you to understand its characteristics. Bitcoin\
    \ has, in particular, all the characteristics of a currency:\n\n●Uniformity: All\
    \ Bitcoins are uniform, they are all equal. No one can tell one bitcoin from another.\
    \ Every Bitcoin has the same value.\n\n●Divisibility: The set of bitcoins is divisible.\
    \ Their divisibility is more important than a traditional currency. The smallest\
    \ unit of Bitcoin is called the Satoshi.\n\n●Portability: Bitcoins are easily\
    \ transportable through digital (online) or physical (offline) Bitcoin wallets.\
    \ They are also easily exchangeable.\n\n●Longevity: Once Bitcoin is issued through\
    \ mining activity, it will no longer disappear in the system. Holders can change,\
    \ but Bitcoin itself remains unique and unchanged over time.\n\n●Recognition:\
    \ It is easy to identify a Bitcoin from another cryptocurrency. The cryptographic\
    \ code of a Bitcoin is unique.\n\n●Security: Bitcoin is inherently protected from\
    \ tampering and theft by the tamper-proof Bitcoin blockchain protocol. Security\
    \ breaches never come from the blockchain, but often from exchange platforms.\n\
    \nBy observing these characteristics, we see that Bitcoin has everything to become\
    \ the global currency of today and tomorrow. The main difference with a traditional\
    \ currency is that Bitcoin is not tied to a state or a central bank, so its price\
    \ fluctuates freely depending on supply and demand. User confidence is based on\
    \ mathematical and cryptographic processes which form the basis of the transaction\
    \ validation protocol.\n\nBitcoin has several important characteristics that distinguish\
    \ it from government-guaranteed currencies.\n\n1.It's decentralized\n\nThe bitcoin\
    \ network is not controlled by a central authority.\n\nEvery machine that mines\
    \ bitcoin and processes transactions is part of the network, and the machines\
    \ work together.\n\nThis means that in theory, a central authority cannot tinker\
    \ with monetary policy and cause a debacle - or simply decide to take their streaks\
    \ off them, as the European Central Bank decided to do in Cyprus in early 2013.\
    \ And if any part of the network goes offline for some reason, the money keeps\
    \ flowing.\n\n2.It's easy to set up\n\nConventional banks make you jump through\
    \ the hoops just to open a bank account. Setting up merchant accounts for payment\
    \ is another Kafkaesque task, besetby bureaucracy. However, you can set up a bitcoin\
    \ address in seconds, with no questions asked and at no cost."
