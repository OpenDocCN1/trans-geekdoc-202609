    Stellar XLM is also a thriving cryptocurrency created to enable users to create
    and trade all digital representations from fiat to crypto. The aim for stellar
    is to get all the world''s financial systems to work together on one network.


    ## 4. Tether (USDT)


    Tether is referred to as a stable coin that boasts of offering users the benefit
    of both worlds: open blockchain technology and traditional currency. Tether also
    offers varying goods and services in the currencies the users are used to such
    that it encourages them to stay committed to the place.


    ![](Images/image00153.jpeg)


    ## 5. Cardano (ADA)


    Cardano and its cryptocurrency ADA have gained increased popularity within crypto
    markets. This exchange is a decentralized, proof-of-stake ad technologically driven
    platform. Since the platform uses smart contracts, you can monitor your transactions
    like bitcoin and process payments like Ethereum.


    ![](Images/image00154.jpeg)


    ## 6. Celsius (CEL)


    This is the cryptocurrency with the potential of becoming a bank. After a successful
    crowdfunding venture in 2018 that raised $20 million the coin has soared with
    impressive returns in 2020.


    ![](Images/image00155.jpeg)


    ## 7. Dogecoin (DOGE)


    With a market cap of $7 billion, Dogecoin has risen through numerous challenges
    to become one of the most popular coins in the market. Users applaud the coin
    for the swiftness with which its blockchain completes transactions and the coin
    is set to reach greater heights.


    ![](Images/image00156.jpeg)


    ## 8. Monero (XMR)


    Monero is known for its privacy: while other blockchains are public ledgers, it
    has an opaquer processing system. You will enjoy using Monero if you are keen
    on privacy with cryptocurrencies such that senders and recipients’ identities
    are anonymous.


    ![](Images/image00157.jpeg)


    ## 9. Tron (TRX)


    Tron is a decentralized system whose coin TRX is doing well in the market. With
    over 17 million accounts and 1.4 billion completed transactions, Tron has been
    described as one of the world’s fastest-growing cryptocurrency and public chains.


    ![](Images/image00158.jpeg)


    ## 10. Zcash (ZEC)


    Zcash is also known for its confidentiality and privacy based system that gives
    users two addresses. The first address is the transparent one visible to the public,
    and the second one a shielded address which is private. This coin has a market
    cap of over $1 billion.


    ![](Images/image00159.jpeg)


    Please note that these coins are not arranged in any particular order. The cryptocurrency
    market is also highly volatile which means a coin may be at the top ten list today
    and gone tomorrow depending on how it rises and falls.


    Bitcoin is currently at the top of the market today and will remain so for a long
    time, but the coins mentioned above also do an excellent job at diversifying the
    market. While it is advisable to get bitcoin, trade with these other coins again:
    by trading with them, you lower your investment risks and enjoy what other coins
    have to offer.


    Imagine putting all your crypto investments in only ONE coin? What happens when
    the coin crashes in the market? It is never wise to only trade with one coin!
    Now let’s talk about how cryptocurrency exchanges work by analyzing some of the
    market''s top exchanges.


    17


    # HOW DIFFERENT EXCHANGES WORK


    We just talked about how cryptocurrency exchanges work. We will now analyze some
    of the market''s top exchanges.


    ## 1. Coinbase


    Coinbase is a very popular exchange, founded in 2012. It is also secure and has
    many features.


    ### Advantages

    - It is a secure platform.

    - It has a user-interface.

    - It offers advanced features.


    ### Disadvantages

    - They charge high fees.

    - It does not support all types of cryptocurrencies.

    - Coinbase in the US has fewer trading pairs than other platforms.


    ## 2. Cash App


    Cash App is a kind of bank that allows users to trade bitcoin. It is great because
    it offers many payment methods.


    ### Advantages

    - It offers peer-to-peer transfer.

    - Users can withdraw bitcoin.

    - It has a simple interface.


    ### Disadvantages

    - The platform only supports certain cryptocurrencies.

    - It charges a fee for transactions.

    - There are withdrawal limits on bitcoin.


    ## 3. Binance


    Binance was founded in 2017 with a focus on altcoin trading. When you use Binance’s
    native cryptocurrency `BNB`, the fees are lowered.


    ### Advantages

    - There is a large variety of cryptocurrencies and trading pairs.

    - It has lower fees than other exchanges.

    - It offers advanced charting.


    ### Disadvantages

    - About 22 states, including New York, are not supported by Binance in the US.

    - The platform is more user friendly.

    - It has fewer trading pairs than international exchanges.


    ## 4. Bisq


    Bisq is an exchange that can be accessed irrespective of the user’s nationality
    or location without identification. Trading fees with this platform are payable
    in `BTC` or `BSQ`.


    ### Advantages

    - It is a decentralized platform.

    - It has many different payment options (including Zelle).

    - It has mobile apps available for Android and iOS.


    ### Disadvantages

    - The platform is not designed for active trading.

    - Trading volume is sometimes low.

    - Transaction speed can be slow depending on the payment method.


    ## 5. EToro


    EToro is a top choice for the most popular crypto coins. It is a multi-asset platform
    where you can also trade stocks.


    ### Advantages

    - It is a multi-asset platform where you can trade in stocks.

    - You can invest with experts and copy top traders.

    - 0% commission on stocks and competitive trading fees.


    ### Disadvantages

    - Customer support can be improved.

    - High non-trading fees.

    - Slow verification process.

