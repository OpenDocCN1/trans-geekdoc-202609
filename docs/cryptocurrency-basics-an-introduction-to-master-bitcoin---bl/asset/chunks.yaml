- fmt: '

    Ripple is another of the largest currencies in terms of capitalization after Bitcoin,
    Ethereal, or Bitcoin Cash. It is a currency that has grown less than the rest
    in the last quarter of last year and that has great potential.


    Ripple is not a rookie since it has 5 years of life. It is based on technology
    and allows up to 1,000 transactions per second, much faster than Bitcoin. In addition,
    its technology can be used as a protocol.


    # IOTA


    IOTA is one of the most ambitious projects in the cryptocurrency arena. Its objective
    is to incorporate virtual currencies into the internet of things and it does so
    by neglecting the blockchain the technology used by most currencies of this type.


    IOTA is based on `Tangle` technology, which in theory is much more scalable, faster,
    and lighter than blockchain.


    # NEO


    Known as China''s Ethereal, its future will be linked to what the Asian giant
    decides about the future of cryptocurrencies. The Chinese government has already
    announced greater control over the sector.


    # Litecoin


    Litecoin is one of the veterans in the sector. Created in 2011, it sought to reduce
    transaction time compared to bitcoin. Like Bitcoin, Litecoin''s limit is 84 million
    coins of which there are already about 55 million in circulation.


    # Reddcoin


    Reddcoin or `RDD` is one of the low-cost cryptocurrencies. It defines itself as
    a trending currency and its use is limited to social networks.


    Reddcoin has its own social tipping platform that can now be used on Twitter and
    Reddit.


    # Monero


    Monero is an anonymous cryptocurrency. With it, the details of the coin transaction
    cannot be traced. That is its main strength compared to other options and what
    gives it value.


    # How to Read Bitcoin Price Charts


    Whether you are in the business of trading stocks, currencies, or commodities,
    then you will be used to looking at charts. The world of cryptocurrency is no
    different from any other type of trading.


    How the charts look for any given currency or asset is highly dependent on the
    behavior of other traders. When the price drops, people start selling. When people
    start selling, the price drops even more.


    The opposite is also true; Rising prices attract more buyers, which in turn pushes
    the price up.


    In essence, technical analysis (`TA`) is the process of looking at current market
    conditions to predict future movements. It focuses on using a price chart to identify
    trends, support, and resistance, as well as momentum to help traders (traders,
    in Spanish) enter and exit higher probability trades. It works on the premise
    that prices move in trends, and these movements generally follow established patterns
    that can be attributed in part to market psychology. This behavioral assumption
    is based on the belief that operators react similarly when faced with similar
    situations. Technical analysis does not attempt to measure the underlying value
    of a crypto asset. It uses mathematical indicators and recognized chart patterns
    to predict the probability of a future move.


    # CRYPTO MARKET SENTIMENT: BULLS VS BEARS


    The markets for both Bitcoin and crypto in general move in three directions: up,
    down, and sideways. A market that is moving up is considered bullish, while one
    that is moving down is bearish. A side market is considered limited or consolidated.
    The most pertinent saying when it comes to cryptocurrency charts is: The price
    direction is much more likely to follow the current trend before it reverses.
    Market sentiment tracks this too as long-term trends don''t change very often.
    Bitcoin bull and bear markets can last for a couple of years before they finally
    reverse. Within a trend there can be several rallies, corrections, or reversals
    where it appears to reverse, only to resume the original trend after a while.
    After all, prices don''t move in a straight line. Using cryptocurrency price analysis
    and chart patterns can reveal these possible changes in a trend in different time
    frames.


    ## Moving Averages


    Moving averages are one of the most widely used technical indicators in crypto
    price charts. They work by filtering out the “noise” from short-term random price
    fluctuations and providing a trend-following lag indicator. There are two types
    of moving averages used in cryptocurrency charts: simple and exponential.


    - `SMA`: Simple Moving Average uses the arithmetic mean of the price over a specific
    time.

    - `EMA`: The Exponential Moving Average uses a weighted average that gives more
    importance to the most recent days, which makes it more receptive to new information.


    Moving averages are often used together to provide a better indication of when
    a trend will reverse. The number of days used to calculate the moving average
    also differs.


    Two of the most commonly used moving averages for cryptocurrency charts are the
    50 days and 200 days, which allow identifying longer-term trend patterns, support,
    and resistance areas. Adding these two indicators to a Bitcoin price chart can
    help identify when prices are at the upper or lower limits of their potential
    movements and when a major trend reversal is in process. When these two moving
    average lines cross it is an important signal for future price movements and trend
    reversals, and they have been appropriately named as follows:


    - `Golden Cross` occurs when the fastest movement of 50 days crosses above the
    slowest of 200 days. Uptrend reversal pattern.


    ![](Images/image00139.jpeg)


    - `Death Cross` occurs when the fastest 50-day movement crosses below the slowest
    200-day movement. Downtrend reversal pattern.


    The Bitcoin price chart above shows two instances recorded during the past year.
    When these patterns have been observed, therefore, prices have increased or decreased
    accordingly in subsequent months.


    Notice how they are lagging behind the actual top and bottom of the trend, as
    this confirmation pattern usually comes after the actual reversal.


    Moving averages also typically provide support and resistance zones, indicating
    more momentum in that direction when price breaks through them.


    ## Support and resistance


    Support and resistance levels are key concepts for understanding cryptocurrency
    price charts, and they are one of the most widely used indicators. Markets oscillate
    over time, so the areas where prices retrace are called resistance, while rebounds
    from a downside move are at support levels. When prices repeatedly return to the
    same level, without breaking above, resistance they’s strengthens. Similarly,
    conversely, when prices repeatedly fall to the same level but not below, support
    strengthens.


    When prices go through these zones, it is known as a breakout, which will then
    find the next level of support or resistance, either below or above. Knowing how
    to identify these support and resistance areas will help you make a better-informed
    trading decision based on market trends.


    ## Fibonacci


    Fibonacci retracement levels are also an important tool in the cryptocurrency
    trader''s arsenal.


    In short, Leonardo Fibonacci was an Italian mathematician who discovered a simple
    series of numbers that created relationships that described the natural proportions
    of things in the universe. The series of numbers gave rise to relationships (`0.236`,
    `0.382`, `0.500`, `0.618`, `0.764`) that can be applied to cryptocurrency charts
    in order to identify retracement levels. These levels are used to predict areas
    of support and resistance. Fibonacci retracement levels work on the theory that
    after a large price movement in one direction, the price will retrace part of
    the way to a preceding price level, before returning to the original direction.


    ![](Images/image00140.jpeg)


    The chart above shows Fibonacci levels in action during the Bitcoin rally recorded.


    ## Other technical indicators

