    ***WHAT IS CRYPTOCURRENCY USED FOR?***


    Virtual currency is a means of payment for the purchase of goods and services.
    What are the reasons for using cryptocurrency? Like any currency, cryptocurrencies
    allow the purchase of goods and services. Not being under the influence of a central
    authority and escaping any regulation, they have long been the preserve of illegal
