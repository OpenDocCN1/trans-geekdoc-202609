  trans: '


    # 1. 比特币采用将在 2021 年早期突然加速


    根据领先的比特币支付处理商之一 `BitPay` 最近发布的数据，2021 年处理的加密货币交易额超过了 10 亿美元，其中`Bitcoin`在量和价值方面均处于领先。


    `Coinbase Commerce` 则指出，他们同时为成千上万商户处理了超过 2.2 亿美元的交易，比上一年增长了 600%。


    虽然与信用卡公司处理的数十亿美元相比，这些数字还很小，但值得注意的是，采用仍处于非常早的阶段，而且对于更通用的支付处理解决方案的问题正在从各个角度、由几家不同的公司迅速且激进地进行解决。


    虽然许多如`Subway`（赛百味）、`Burger King）、`KFC`等知名的零售连锁已经在有限范围内尝试过直接接受`Bitcoin`，但 2021
    年可能会看到一个由`Starbucks` 与您在该项目中的合作伙伴`Bakkt` 合作驱动的、非常重大且资金充足的加密货币采用计划。


    目标是到 2021 年 7 月，所有 30,000 家`Starbucks`商店都能够通过`Bakkt`的新消费者 App 直接接受`Bitcoin`。`Starbucks`经典的客户统计特征与典型的`Bitcoin`用户群体高度契合，这一点并未被市场分析师忽视。`Bakkt`还得到了`Microsoft`和`ICE`的支持，如果这次实验成功，迅速激进地推广到其他主要零售商的影响是不可避免的。


    # 2. 比特币将其主导地位恢复到 ICO（代币发行）之前的水平


    对于许多专家来说，该领域存在数千种加密货币是没有必要的，其根本原因是`Bitcoin`已经作为加密货币世界的全球储备货币根深蒂固。它是衡量访问一切的价值标准。


    `Bitcoin`区块链的每日确认交易量最多可达 5 个月。在这种情况发生之前（而且目前行业内还没有任何实际行动可以做到这一点），这一地位不会受到威胁。因此，逻辑结论是，主导地位将随着时间的推移而增加，`Bitcoin`的重要性将会增长而非减少。


    # 3. 闪电网络将改变一切


    尽管这是一个在 2018 年启动并持续持续开发和改进的项目，但最近成功获得足够资金以加速其采用的事实，可能意味着其实用性将发生突然变化。


    尽管目前对许多人来说存在技术上的复杂性，但它仍有可能成功。如果这一方面和安全性得到提高，下一代钱包和支付机制将必然通过`lightning`网络。在这种情况下，`Bitcoin`将迅速从价值存储手段转变为交换媒介，或者更准确地说，成为两者的更好版本。


    这可能的效应是如上所述，消除对许多山寨币的需求，并消除承受冲击的最大的障碍之一。这将推动使用量的指数级增长。


    然而，这不太可能立即发生。可能需要一到三年的时间成为现实。


    # 4. Facebook 的 Libra 不会发生


    自从`Facebook`在 2019 年中宣布其提议的加密货币以及对`Bitcoin`的“切入”以来，人们对此进行了大量讨论。但一切迹象表明，`Bitcoin`将胜出，而`Libra`不会发生，至少不会按照最初提议的方式发生。


    首先，政府无法将其货币政策的任何部分让给私营部门。其次，`Libra`需要拥有许可证。第三，`Facebook`存在极端问题。最后但不是最重要的，可以认为他们可能更青睐黄金。


    等待，后续要点的提供的文本：

    - SEC 将批准`Bitcoin`

    - `Bitcoin`将越来越多地视为价值存储手段和避风港

    - `Bitcoin`将越来越多地作为支持慈善机构的手段

    - `Libra`以及`Mastercard`、`Visa`、`PayPal`、`Stripe`、`eBay`


    # 5. SEC 将批准 Bitcoin


    到目前为止，美国`SEC`在采用`Bitcoin`方面是著名的缓慢。获得批准的`ETF`为想要投资的机构提供了额外的安全保障。一次批准可能会导致其他批准，这种法律将为机构投资打开大门，尽管是在
    2020 年。


    # 6. 比特币将越来越多地视为价值存储手段和避风港


    尽管许多人声称负面市场与将`Bitcoin`作为避风港之间已经存在相关性，但除了`委内瑞拉`等案例，证据仍然不确定。很明显，这个南美国家的一些人由于该国正在经历的经济状况，将其部分法货币转换为`Bitcoin`。因此，比特币是一个显而易见的选择。


    # 7. 比特币将越来越多地作为支持慈善机构的手段


    这看起来可能是一个伟大的预测，因为一些慈善机构已经在过去一年左右开始接受`Bitcoin`。英国的皇家国家救生艇协会(RNLI)`、`UNICEF`、`The
    Water Project`和`Teach Africa`都是已经在做的机构。这种观点仅仅是，这在未来将会增加并变得更加“正常”。


    # 8. 比特币的价格将升至新的历史新高


