    # 引言


    比特币是一种无形货币，或称加密货币，它允许持有者在互联网或现实生活中购买商品和服务。与传统货币不同，比特币与所有虚拟货币一样，没有中央银行或任何中央机构或金融机构来监管。相反，比特币依赖于互联网上的大型场外交易网络。在某种意义上，比特币是
    P2P 网络（场外交易）、加密技术和货币概念结合的结晶。结果是：比特币以及随之而来的其他加密货币，可能会引发一种全新的金融系统——一种完全去中心化、完全自由的替代货币体系。


    比特币的底层技术是区块链或区块链系统。它由以安全、透明且不可侵犯的方式存储和传输数据组成。每个交易都是一个区块，被添加到不断增长的区块链中，用于记录所有的交易。


    这种区块链之所以存在，得益于计算机节点网络，这使得比特币作为一种去中心化的点对点数字货币成为可能。任何连接到比特币接口的计算机或设备都可以被视为节点。


    它通过传输交易和区块信息与其他节点进行通信。


    比特币是一个自称中本聪聪（Satoshi Nakamoto）的天才的作品。这就是我们知道的全部。它可能是一个男性，也可能是一个女性，甚至是几个人，没人知道。


    你可能在想世界上有多少比特币。到 2019 年底，全球约有 1800 万比特币流通（相比之下，2016 年为 1600 万比特币，2013 年为 1000
    万比特币），货币供应量约为 6600 亿，而 229 亿中的 229 亿（对比）。


    此外，后续页面中的信息仅供参考，因此应被视为通用的。根据其性质，这些信息的呈现不不对其长期有效性或中期质量提供保证。文中提及的商标是在未经书面许可的情况下使用的，绝不视为商标持有者的背书。


    # 引言


    比特币是一种无形货币，或称加密货币，它允许持有者在互联网或现实生活中购买商品和服务。与传统货币不同，比特币与所有虚拟货币一样，没有中央银行或任何中央机构或金融机构来监管。相反，比特币依赖于互联网上的大型场外交易网络。在某种意义上，比特币是
    P2P 网络（场外交易）、加密技术和货币概念结合的结晶。结果是：比特币以及随之而来的其他加密货币，可能会引发一种全新的金融系统——一种完全去中心化、完全自由的替代货币体系。


    比特币的底层技术是区块链或区块链系统。它由以安全、透明且不可侵犯的方式存储和传输数据组成。每个交易都是一个区块，被添加到不断增长的区块链中，用于记录所有的交易。


    这种区块链之所以存在，得益于计算机节点网络，这使得比特币作为一种去中心化的点对点数字货币成为可能。任何连接到比特币接口的计算机或设备都可以被视为节点。


    它通过传输交易和区块信息与其他节点进行通信。


    比特币是一个自称中本聪（Satoshi Nakamoto）的天才的作品。这就是我们知道的全部。它可能是一个男性，也可能是一个女性，甚至是几个人，没人知道。


    你可能在想世界上有多少比特币。到 2019 年底，全球约有 1800 万比特币流通（相比之下，2016 年为 1600 万比特币，2013 年为 1000
    万比特币），货币供应量约为 6600 亿，而 229 亿中的 229 亿。


    # 比特币是如何产生的？


    这里变得有点技术性了。比特币是按照预定义的算法被“挖掘”的。制造比特币的人被称为矿工。


    算法的作用是确保比特币的增长速度变慢，每四年奖励减半。因此，在 2017 年初，奖励下降到 12.5 单位，然后在 2020 年下降到 6.25 单位。同时，解决数学问题的难度水平随之增加，这使得网络达到饱和。


    算法的设计使得比特币的行为恰恰像一种稀有商品。就像黄金或石油（起初寻找很容易，然后变得困难且昂贵）。


    结果是：尽管是虚拟的，比特币的供应是受限的。算法使比特币免受通货膨胀的影响。在此，比特币与虚拟世界中的林币（Linden dollar）货币完全相反，后者由中央机构生产，实际上是垄断的，没有任何限制。


    # 什么是比特币减半？


    比特币减半是指奖励每四年大约减半的现象，或者说是每 210,000 个区块减半。上一次发生在 2020 年 5 月 11 日，之前发生过两次：2016 年
    7 月 9 日，以及 2012 年 11 月 28 日。2020 年 5 月 11 日的减半将奖励从 12.5 增加到 6.25 比。


    # 如何挖掘比特币？


    你可能被挖矿的活动所吸引，并好奇如何挖掘比特币，以及你可以挖掘多少比特币以及需要多久？


    如果在加密货币发布的后几年里，挖矿可能相对容易，但现在挖掘比特币所需的计算能力已经足以让一个人成为矿工。


    首先，你需要为你的计算机配备用于挖掘比特币的软件。然后，你需要足够的计算机设备，以便在继续使用计算机的同时运行软件，这并不容易。

