    因此，算力占比较小的矿工发现下一个区块的机会非常有限。为了给这些矿工提供优势，矿池应运生，使得矿工能够更容易汇总资源并在单一网络上共享处理能力。然后，矿工根据他们为寻找区块所贡献的工作量，与池内的所有人平均分配奖励。


    ## 比特币矿工能赚多少钱？


    2009 年比特币首次被挖出时，矿工因成功挖出比特币获得了 50 BTC。2012 年，该奖励减半，使得当年的矿工赚了 25 BTC；2016 年，该金额再次减半，变为
    12.5 BTC。2020 年 5 月，奖励调整为 6.25 BTC。


    2020 年 11 月，比特币价格飙升至每枚 17,900 美元的位值，这意味着如果你在 2020 年 5 月进行挖矿，你可能赚了高达 111,875 美元。随着比特币价值的增加，即使奖励减少，矿工也将不断赚得更多，因为现在比特币已经上涨到
    50,000 美元，现在想想如果你是一个矿工，你会赚多少钱。


    ## 如何成为比特币矿工


    ### 第一步：获取比特币挖矿硬件。


    如果你能获得一台矿机来开始，将会很有帮助，因为这是用于挖掘比特币或其他加密货币的特殊硬件。这种设备被称为`Application-Specific Integrated
    Circuit Chips`（`ASIC`），它挖掘比特币的速度更快、能耗更低、非常强大且价格昂贵。


    在购买矿机之前，请考虑以下因素：

    - 价格（比较价格）

    - 哈希性能率和尝试破解区块的能力

    - 耗电量


    在根据性能而非价格进行选择之前，阅读不同矿工的评论将会有帮助。


    请注意，由于需求巨大，获取这种矿机非常困难。


    在购买之前，你也可以查看 `ASIC WEB PAGE` 获取有关新矿机的详细信息。


    ### 第二步：获取你的比特币钱包。


    接下来，你需要设置一个比特币钱包来接收你的比特币并管理你的地址。作为一名新手矿工，你应该使用软件钱包，因为它易于操作、下载方便且安全。


    你也可以使用诸如 `BITCOIN CORE` 这样的完整版钱包，它可以帮助你确定包含合法交易的区块链。


    ![](img/image00169.jpeg)


    图：源自 Master Data in Motion 的 Bitcoin Core 图像


    ### 第三步：加入矿池


    即使你拥有最好的挖矿硬件，你仍然需要加入矿池，因为单台硬件无法与全球其他矿工孤立竞争。当你进入矿池时，解决数学问题和更快挖矿的概率更高，然后你将与池中的其他人共享奖励。


    你可以找到适合初学者的不同比特币矿池，如果你不确定加入哪一个，请访问 `BITCOIN WIKI` 查看可靠的矿池。选择好矿池后，在网站上注册并设置账户，然后等待你的“工人
    ID”。


    ### 第四步：获取挖矿程序。


    获取硬件、比特币钱包并加入矿池后，你必须为电脑获取一个挖矿客户端。挖矿客户端（挖矿软件）将你连接到区块链和比特币网络，同时向矿工派发任务并收集他们工作的完整结果。然后完整信息会被添加到区块链中。


    有很多免费的比特币挖矿程序，有些矿池也有自己的软件。在使用任何软件之前，请查阅它们的优缺点。


    ### 第五：你现在可以挖矿了！


    现在你准备好挖掘比特币了。将你的矿机硬件连接到电源，将其与电脑连接并安装软件。填写所有关于你的钱包和你加入的矿池的信息，然后选择一个设备并开始挖矿。


    要成为一名成功的矿工，你必须关注加密货币新闻，因为市场瞬息万变，你始终需要知道发生了什么。


    获取额外的比特币有多种方法，挖矿就是其中一种过程，在保持比特币系统活跃的同时奖励矿工。本章提供了你理解挖矿工作原理、收益以及如何开始所需的所有信息。


    请记住，作为一份实用指南，你应当遵循书中分享的步骤和方法。从挖矿世界，我们将进入本书的最后一章，将将考虑比特币的未来。


    ## 经纪商


    ### 总结所介绍的理念……目前最好的经纪商是


    **eToro 是非常适合新手和半专业投资者的经纪商。** 过程非常简单，只需向你的账户存入美元，然后选择你想要购买的加密货币。购买后，你可以在投资组合标签页中查看你的资产，从那里你可以跟踪价值变化并在需要时卖出。这个简单的系统对于想要购买少量范围加密货币并采取长期策略的人来说是理想的。然而，由于交易对数量和实时数据的限制，如果你想进行严肃的日内交易，它就并不是理想的。如果你想尝试一些娱乐性交易，那么
    etoro 是一个不错的选择，但当需要扩大交易规模时会有更好的选择。


    **eToro 确实有一个酷炫的功能，允许你完全复制热门交易者的操作，这意味着你可以自动化你的投资策略。eToro 的社区也增加了许多价值，你的新闻动态将充满来自不同交易者的有趣帖子，他们分享了对市场运动的观察和预测。


    你的资金在 eToro 将享有高水平的安全，它们不仅在美国受监管，而且是跨国公司。eToro 的费用取决于资产，但通常具有竞争力。eToro 提供演示账户，你可以在其中用虚拟资金测试决定，这是一个很棒的功能。


