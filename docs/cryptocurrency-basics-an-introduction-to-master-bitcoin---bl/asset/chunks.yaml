  trans: '


    金融大鳄之所以尚未非常活跃，唯一的原因是这个市场很小。


    因此，一旦加密货币不断增长并变得广为人知，市场将按比例变得更加危险。因此，对于这些人来说，完全的监管将比完全没有监管要获利得多。


    ## 投机规模


    批评声层出不穷，声称加密货币建立在空之上，而且没有财富创造来支持这种增长。


    在目前的市场状态下（2018 年 11 月），我们无法证明这些人人是错误的。几乎所有的加密资产仍处于计划阶段。极少数资产已经拥有可以供目标客户使用的可行产品。


    因此，目前加密货币的价值几乎完全是投机性的。


    在取得具体进展之前，情况将保持如此。


    在股市中，所有公司都有产生利润的经济活动。尽管有时会发生破产，但整个股市创造了财富。


    在股市上运营的公司价值，虽然包含部分投机价值，但主要基于这些公司通过其经济活动产生利润的能力。这种利润的能力在传统上被分析为大量参数函数，正如下文“基本面分析”章节中所解释的那样。


    与此相反，加密货币的价值通常只是没有任何逻辑的群群运动的结果，或者是在股市上属于违法的操纵。只有大头者解决了这个问题；即使在排名靠前的加密货币中，许多货币仍然认为其价格至少部分受到完全不理性波动的影响。


    尽管如此，这并不意味着加密货币没有内在价值。它们的目标和用户可能会时间的推移而改变，带来不同的估值标准。这最好的例子是比特币，因为它被设计为人民的货币，而今天它只作为价值标准，就像黄金一样。


    ## 监管水平


    股市受到严格监管。尽管任何人可以使用任何市场，但不同的市场适用不同的法律。例如，法国的规定与美国或日本不同。


    加密货币世界除了少数小小的监管或禁令外，本质上是一个不受监管的市场。没有设定的规则允许或禁止某些活动。因此，它让许多丧心良的人在这个市场中随心所欲。


    然而，情况正开始缓慢变化。越来越多的国家开始想要清理一下，该主题甚至在 2018 年阿根廷举行的 G20 峰会期间被列入议程。


    ## 市场开放时长


    由于股市的监管，有必要定义开放时间和关闭时间，以便验证一切操作都是根据现行规则进行的。最大的交易所在周一至周五的办公时间内开放。


    考虑到亚洲、欧洲和美国之间的时差，可以在任何时候找到开放的股市。但我们无法在那些因为办公时间而关闭的交易所进行交易。


    加密资产市场 24/7 开放。它从不关闭，人们可以任何时间访问所有交易所网站而不受任何限制。交易所网站仅在网站更新或遇到技术问题（维护）时才会无法使用。


    ## 代币和股份持有者的身份识别


    在股市中，主要有两种类型的股票：


    -   记名股票，这使得能够识别出拥有这些股票的个人。

    -   无记股票，不允许为此类股票的持有者命名。


    尽管由于打击洗钱、逃税和恐怖主义而采取的措施日益严格，无记股票倾向于消失，但这种形式仍然存在并保证了某些匿名性。对于加密资产，在实践中要了解加密资产持有者的确切身份相对困难。当加密货币不是匿名时，我们可以知道哪个
    `wallet address` 拥有特定的加密资产，但需要进一步调查才能将姓名与钱包地址联系起来。


    然而，在以下过程中需要提供个人身份：


    -   参与 ICO 时。主要为了验证你不是美国或中国人。

    -   如果你想在某些交易所网站上增加提现限额。


    除了这两个可以将你的名字与某些操作联系起来的措施外，我们因此认为大多数代币可以被视为无记。


    ## 技术分析


    技术分析是一种通过加密资产或股票的价格走势图来研究价格演变的方法。该工具使得根据一组指标检测各种趋势成为。


    一旦检测到这些趋势，你将能够实施一种产生利润的策略。


    技术分析在股票上效果非常好，因为市场几乎完全由这一过程的用户占据，这使得他们所有的动作都变得可预测。


    涉及到加密货币，观点相当分化。有些人认为技术分析有用，而另一些人认为它完全没有必要，因为加密资产市场被少数巨头高度操纵，而且恐慌人群的运动可能会产生不可预测的影响。此外，还必须考虑所研究市场的流动性。某些加密资产的市值和交易量极低，这意味着只有几百或几千美元的人就能显著推高或推低价格。


    技术分析需要上限和最小量，以便指标反映某些现实。如果没有它，微小的买卖订单将完全扭曲对图表的分析，指标将毫无用处。


    ## 基本面分析


    基本面分析是研究整个项目的过程。无论是在股市上市的公司还是在加密货币世界运营的公司，其推理逻辑本质上是相同的。只是记录方式存在一些显著差异。


    与技术分析不同，基本面分析基于项目的本质。这是一种有助于理解公司如何实现其目标的分析。我们研究它提供的不同策略、负责特定任务的人员、新功能的实施日期、公司资产价值等。


    有些人认为只有基本面分析在评估加密资产潜力方面有意义。


    另一些人认为基本面分析应该与技术分析结合。但所有人都同意基本面分析对于加密货币项目是重要的。


    ## 与加密货币的主要区别


    正如我们所见，在股市运营的公司和通过加密货币融资的公司具有相同的目标：通过提供对人们有用的产品和服务来创造价值。


    但我们还没有谈论上市公司与加密货币之间的根本区别：区块链！


    '
- fmt: '

    A company operating in the world of crypto-currencies uses the blockchain to carry
    out its project.


    It is even an obligation if she wants to hope to collect money. The development
    of the company''s products or services can only be done through blockchain technology.


    In some cases, when companies found that fundraising was easier through an `ICO`
    than an `IPO`, it turned out that the blockchain was not at all essential to complete
    the project. It was just a setup in order to have easier access to capital. You
    must therefore be careful before investing and carefully check whether the blockchain
    is really useful for the project or not. If it isn''t, it probably is a scam.


    ## The Number of Scams


    The stock market is very regulated and you can''t do what you want on it. Many
    laws have been designed to punish by law those who do not play by the rules.


    But this regulation did not come overnight. The first institutionalization of
    the stock exchange took place in Bruges (Belgium) in 1409. The first organized
    French stock exchange dates from 1540 and took place in Lyon. That makes over
    600 years that the stock market exists.


    During this long period of more than six centuries, rules gradually appeared in
    order to put in place a strict framework to regulate these practices. But things
    happened little by little and the biggest advancements were made after a scandal
    or a major crisis so that it would not happen again in the future.


    The publication of the `bitcoin` white paper dates from October 2008.


    Crypto-currencies, therefore, have only ten years of existence. Regulations are
    almost non-existent and as a result, many scams have already occurred and continue
    to occur.


    It is even a scourge that undermines the confidence that individuals can have
    in crypto-assets.


    If you want to have a list of the most common scams, do not hesitate to consult
    our section on the subject: `Bitcoin` and scams - Educate yourself!


    ## Communication Methods


    Communication around crypto-currencies is done almost exclusively via the internet.
    Different supports exist:


    ● `Twitter`.

    ● Specialized forums.

    ● Discussion groups on `Telegram`, `Discord`, or `Skype`.

    ● On crypto-currency sites.

    ● During conferences on crypto-assets.

    ● Etc.


    Even if in the long-term stock market information should also converge towards
    an equivalent system, there is a specialized paper press, call centers that transmit
    information to traders, meetings with investors, etc. These means of communication
    do not exist (or so insignificantly) for crypto-assets.


    Here we are at the end of our section which explained the commonalities and differences
    between the stock market and cryptocurrencies.


    As we have been able to see, we can say that in both cases, they are companies
    that try to create products or services in order to generate income, the particularity
    being that cryptocurrencies need blockchain to carry out their project.


    The similarities between these two markets are much greater than the differences.
    However, it should be noted that there are some major differences that should
    not be overlooked if you want to be a competent investor in each of these markets.


    The cryptocurrency market is still young and things are moving very quickly in
    this sector. It will therefore be necessary to follow the news carefully in order
    to keep abreast of changes as regularly as possible.


    It is also important to understand that cryptocurrencies require skills similar
    to those needed buy the stock market.


    The crypto-asset market is no easier to handle than that of the traditional stock
    exchange. Admittedly, the current public has a higher ratio of amateurs than the
    traditional stock exchange.


    ## Blockchain Technology


    The crypto-asset market is no easier to handle than that of the traditional stock
    exchange. Admittedly, the current public has a higher ratio of amateurs than the
    traditional stock exchange.


    ### BLOCKCHAIN TECHNOLOGY


    A blockchain is a distributed ledger that records transactions across many computers
    so that the record cannot be altered retroactively without the alteration of all
    subsequent blocks and the consensus of the network. This makes the blockchain
    transparent and secure.

