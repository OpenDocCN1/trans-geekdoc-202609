    比特币通过引入加密交易验证系统，消除了对信任第三方的需求。交易直接从用户 A 执行到用户 B，几乎是瞬间完成，且不会产生交易费用。


    此外，比特币的创建初衷是让你不再需要依赖银行来完成交易。


    交易通过加密技术进行验证。换句话说，卖家不再需要担心买家违约不付款。


    最后，比特币的诞生也是对名为“B-money”的首次数字货币尝试所遇到的技术问题的响应。这个问题就是“双花费”问题。通过电子邮件发送附件副本没有关系；但当你想要发送钱时，就会变成一个巨大的问题！在保留
    1 欧元的同时发送 1 欧元是不可能的！比特币通过引入区块链技术从技术上解决了这个问题，该技术对网络上进行的所有交易进行精确记录。因此，所有用户随时都知道比特币的所有者！


    # 加密货币的特性


    在加密货币的特性中，我们发现：


    ### 加密货币的波动性

    尽管加密货币市场相对较新，由于巨大的短期投机利益，它经历了剧烈的波动。例如，在 2017 年 10 月到 2018 年 10 月之间，比特币的价格攀升至 19,378
    美元，然后跌回 5,851 美元。其他加密货币相对稳定，但新技术往往倾向于产生投机兴趣。加密货币的波动性是让这个市场如此兴奋的原因之一。其日内价格的快速波动使得买入或卖出成为可能，但也增加了亏损风险。


    所以，如果你决定探索加密货币市场，请确保你已经提前做好研究并制定了风险管理策略。


    ***加密货币交易时间***


    由于缺乏中心化治理，加密货币市场通常每周 7 天每天 24 小时开放。交易在遍布全球的交易平台上个人之间直接进行。然而，当市场适应基础设施更新（称为“分叉”）时，可能会出现停机时间。


    通过 IG，你可以与美元等法币进行加密货币交易，交易时间为从周六早上 5 点到周五晚上 11 点（巴黎时间）。


    ### 更好的流动性

    流动性是衡量加密货币转换为现金的速度快慢和易易程度，且不影响市场价格。流动性是实现更好价格、更短交易时间以及提高技术分析精确性的重要因素。


    通常，加密货币市场被认为流动性较差，因为交易分散在多个交易所中，这意味着相对较小的交易可能会对市场价格产生巨大影响。这是加密货币市场如此波动的原因之一。


    然而，通过 IG，你在交易加密货币时可以获得更好的流动性，因为我们使用来自多个交易所的数据获得获得优价格。换句话说，你的交易通常执行得更快，成本更低。


    ### 建立购买或卖出头寸的可能性

    购买加密货币意味着提前购买资产，并希望其价值上涨。但当你交易加密货币的价格时，你可以从市场的下跌和上涨中获利。我们将分别称之为“空头”或空头头寸，或“多头”头寸。


    ### 多头寸

    例如，假设你决定对以太（Ether）开一个空头 CFD 头寸，因为你认为它的价格会下跌。如果以太对美元价值下跌，你将获利。然而，如果以太对美元价值上涨，你将遭受损失。


    ### 杠杆敞口

    CFD 交易是一种杠杆产品，允许你仅用交易价值的一小部分就开仓。换句话说，你可以在锁定相对较小部分资本的同时，获得加密货币市场的巨大敞口。


    你加密货币交易的利润或亏损将反映平仓时头寸的全额，因此使用杠杆交易让你有机会从较小投资中获得巨大收益。然而，亏损也可以被放大，甚至超过你每笔单独交易的初始存款。这就是为什么在下
    CFD 订单之前，仔细考虑杠杆头寸的总价值至关重要。建立适当的风险管理策略同样重要，这应该包括适当的止损和限制。


    ### 快速开户

    买卖加密货币涉及通过交易所，这需要创建货币账户并将加密货币存储在你自己的数字钱包中。这个过程可能受到限制且耗时。相比之下，通过 IG 交易加密货币不需要直接访问交易所，因为我们代表你接触底层市场。你不需要开设或管理货币账户，因此可以更快地准备好交易。事实上，开户申请在线完成，完成耗时不超过
    5 分钟。


    # 比特币的特性


    当你明天通过 BYKEP 在烟草店购买比特币时，了解它的特性对你很有意义。比特币特别具有货币的所有特性：


    - **统一性**：所有的比特币都是统一的，它们是平等的。没有人能区分一个比特币和另一个。每个比特币具有相同的价值。

    - **可分性**：比特币是可分的。它们的可分性比传统货币更重要。比特币的最小单位被称为 `Satoshi`。

    - **便携性**：比特币可以通过数字（在线）或物理（离线）钱包轻松携带。它们也容易交换。

    - **长期性**：一旦比特币通过挖掘活动发行，它就不会在系统中消失。持有者可以改变，但比特币本身保持独特且不变。

    - **识别性**：很容易将比特币与其他加密货币区分。比特币的加密代码是唯一的。

    - **安全性**：比特币通过不可篡改的比特币区块链协议从上防止篡改和盗窃。安全漏洞从未源自区块链，而是来自交易平台。


    通过观察这些特性，我们看到比特币具备成为今天和明天全球货币的一切。与传统货币的主要区别在于，比特币不绑定国家或中央银行，因此其价格随供需自由波动。用户信任基于交易验证协议的数学和加密过程。


    ### 1. 去中心化

    比特币网络不受中心中心机构控制。每个挖掘比特币和处理交易的机器都是网络的一部分，这些机器共同工作。这意味着在理论上，中心当局无法干预货币政策并引发灾难——或者像欧洲中央银行在
    2013 年初塞浦路斯所的那样扣除他们的存款。而且如果网络某部分由于原因离线，资金也会继续流动。


    ### 2. 易于设置

    传统银行让你为了开一个银行账户而重重关关。设置商户支付账户是另一项卡夫式的任务，充满了官僚主义。然而，你可以在几秒钟内设置比特币地址，无需询问且免费。

