    CFD 是一种衍生产品，允许您对加密货币的价格波动进行交易，而无需持有其底层的虚拟货币。如果您认为某种加密货币的价值将会增加，您将进行买入（即“持有”）。如果您认为它将下跌，您将建立卖出头寸（即“做空”）。由于
    CFD 是杠杆产品，您只需要占用一小部分资金（即 `hedge` 保证金）即可获得全部的市场风险敞口。然而，您的盈亏是根据您的总头位计算的。因此，杠杆效应会放大收益，也会放大亏损。


    ## 如何通过交易所平台买卖加密货币


    当您通过交易所获取加密货币时，您购买的是货币本身。要通过这种方式交易数字货币，您首先需要开设账户，然后锁定整个头位，最后将您的代币保存在加密货币钱包中，直到您决定转售它们。


    并不是所有交易所的操作方式都相同，因此您需要熟悉它们所使用的技术，并学习如何提取您感兴趣的信息。许多平台都有存款限制，而且运营账户的成本有时可能是惊人的。


    ## 加密货币市场是如何运作的？


    加密货币市场是去中心化的，这意味着这些货币不是由中央机构（例如国家）发行的。相反，它们通过计算机网络传输。加密货币可以在交易所平台（一种虚拟股票交易所）上买卖，并存储在专门的组合（或钱包）中。


    与传统货币不同，加密货币只是存储在 `blockchain`（区块链）上的数字所有权证明。当一个用户想要将加密货币单位卖给另一个用户时，他必须将其发送到后者的虚拟钱包。


    只有当交易通过矿过程验证并添加到 `blockchain` 中时，交易才被认为完成。这通常也是新代币创建的方式。


    `blockchain` 是一种用于数据传输和存储的数字账本。在加密货币的境下，它存储了每个加密货币单位的交易历史，从而跟踪随时间变化的所有权变化。`blockchain`
    以区块的形式记录交易，最新的区块被放置在链的前端。


    `blockchain` 技术使用的安全设备比简单的计算机文件强大得多。


    ### 去中心化网络


    `blockchain` 文件对任何人开放，它们并不是存储在一个地方，而是同时由数以百万计的计算机进行托管。这使得 `blockchain` 既具有透明性又具有抗改性，不会留下任何易受人为或
    IT 错误影响的弱点。


    ### 密码学


    区块使用复杂的数学和计算机公式通过密码学链接在一起。任何篡改数据的尝试都会导致区块之间连接的中，网络上的计算机可以很容易识别。


    ### 什么是加密货币挖矿？


    挖矿是验证近期加密货币交易的过程，随后新单位将进入流通。


    ### 交易验证


    矿工（负责挖矿的计算机）处理待处理交易，确保发送者有足够的资金完成交易。


    交易详情与存储在 `blockchain` 中的交易历史进行比较。当发送者使用其 `private key`（私钥）时，他即授权进行资金转移。


    ### 创建新区块


    矿工在新区块中收集有效交易，并尝试通过解决复杂的算法生成一个与上一个区块连接的密码学链接。


    当其中一个矿工成功生成该链接时，它将其发送到网络的其余部分进行验证。


    ### 哪些因素影响加密货币市场？


    加密货币市场根据供需演变。然而，作为去中心化的市场，它们通常能更好地受到通常影响传统货币的经济和政治变化的保护。


    除了自身的不确定性外，以下因素可能对数字货币的价格产生重大影响：


    - **供应**：部分的总数及其发行、销毁或丢失的速率

    - **市值**：所有现有货币的价值以及该数字增加、减少或停滞的概率

    - **压力**：媒体对加密货币的报道（正面、负面、强力或弱力）

    - **整合**：加密货币融入现有基础设施（如在线支付系统）的能力

    - **关键事件**：重大事件，如监管变化、安全漏洞和经济困境


    ## 加密货币交易是如何运作的？


    通过 IG，您可以通过 `CFDs` 交易加密货币，这种衍生产品允许您对感兴趣的加密货币价格涨跌进行交易。这些货币以美元等传统货币报价，您永远不会拥有加密货币本身。


    `CFDs` 是杠杆产品，这意味着您只需锁定总价值的一小部分即可建立头寸。


    ### 加密货币交易中的价差是什么？


    价差是买入价格和卖出价格之间的差。正如许多金融市场一样，当您建立加密货币头寸时，会看到两个价格。


    如果您想做多，则以买入价交易，该价格略高于市场价格。相反，如果您想建立做空头寸，则以要要价交易，该价格略低于市场价格。


    ### 加密货币交易中的“手”是指什么？


    加密货币以“手”（lots）进行交易，即用于订单的代币集合。由于数字货币波动性大，订单通常很小。一手通常对应一个参考加密货币。然而，某些加密货币以较大的手进行交易。


    ### 什么是杠杆加密货币交易？


    杠杆效应允许您在无需预先支付全部价值的情况下，从大量加密货币的敞口中获利。相反，您只需要占用部分较小资金作为保证金。当您关闭杠杆头寸时，您的盈亏是根据头总价值计算的。


    杠杆会放大您的收益，也会放大亏损。因此，在开始交易之前了解其运作方式至关重要。


    ### 加密货币交易中的对冲是什么？


    保证金（`hedge`）是杠杆交易的关键部分。这是您在开启并保持开放头寸时支付的金额。通过 `CFDs` 交易加密货币时，请注意所需的覆盖率可能会根据经纪商和订单的大小而异。


    覆盖率通常以总价值的百分比表示。例如，为了开启 `bitcoin` 头寸，您只需要支付其总价值的 50%。与其说支付 5000 欧元，您只需支付 2500
    欧元。


    ### 加密货币交易中的 pip 是什么？


    Pip 是用于定义加密货币价格波动的单位。它们代表数字货币价格的一个数字的波动。


    通常，流行的加密货币以美元为基交易。例如，如果加密货币从 $190.00 涨到 $191.00，这意味着它增加了一个 pip。一些不流行的加密货币使用不同的刻度，其中一个
    pip 可能是一个分，甚至是十分分之一分。


    为了避免任何意外的惊喜，在下单之前，请务必阅读交易平台上关于价格波动衡量的说明。


