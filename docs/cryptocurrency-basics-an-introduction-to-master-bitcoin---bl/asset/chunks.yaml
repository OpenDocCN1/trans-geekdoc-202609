    ●You are one of those who bet that crypto is the future of the economy.


    This may sound a bit like "hope" but the truth is that they are valid reasons
    for everyone to bet on cryptocurrencies in the long term.


    ***Investing in short-term cryptocurrencies***


    How short is a short-term crypto investment? We must remember that these are investments
    that are made in short periods of time in the hope of quick returns. These periods
    can be as short as seconds, minutes, days, weeks, or even a few months.


    How do short-term cryptocurrency investments work?


    As with long-term crypto investments, you must have clear objectives for making
    your investment. You must ask yourself:


    ●How much loss are you willing to accept? This will help you control losses if
    the price of the cryptocurrency falls suddenly.


    ●What are the benefits you hope to obtain from this investment? This will give
    you an idea of the price at which you should buy/sell the crypto.


    ●Do you have the patience and time available to follow and study the ups and downs
    of the cryptocurrency market and related news?


    ●Do you have the ability to perform technical analysis of the cryptocurrency market?
    This is very important so you better learn before making investments.


    ●Is your short-term strategy better, that is, will it give you better dividends,
    than if you invest long-term?


    It is important to research which is the best cryptocurrency to invest in the
    short term-


    A very simple guide that can give you an idea is to check if your crypto meets
    these conditions to invest in the short term:


    ●It has a high volume of operations, that is, many people buy and sell it every
    minute.


    ●Low market capitalization.


    ●They are trending on social media and in the news.


    ●You have an ICO or have just finished your ICO. It is best to get them at a low
    price.


    We are clear that Ethereum and Bitcoin can be traded in the short term but it
    is good to risk some amount that "does not hurt" in some newer cryptos.


    Investors who have taken risks in recent cryptocurrencies like Stellar, NEM, IOTA,
    and NEO have managed to make huge profits in the short term.


    With short-term investments, you have the advantage of obtaining a lot of money
    in a short time. However, this can be a double-edged knife. Among its disadvantages
    we can name:


    ***Disadvantages***


    ●They require a lot of effort and time because it is necessary to constantly monitor
    prices and market fluctuations.


    ●It is an investment with higher risk and there may be greater losses because
    the price can drop in a short time.


    ●It can affect your health as it can be very emotional and stressful.


    Which is the best strategy?


    This is not an exact answer as it all depends on your experience and goals in
    the world of cryptocurrencies.


    If you are fully convinced of a project then we can recommend a long-term investment.
    But if you see that new crypto is getting a lot of attention on the internet then
    making a risky investment in the short term could be a great idea that will leave
    you good profits.


    Cryptocurrencies have enormous potential but you should not forget one great detail:
    you can lose money. In this world of crypto, nothing is certain and no one can
    foresee with certainty what will happen.


    There is a maxim that most cryptocurrency experts repeat: you only have to invest
    money that you are not afraid of losing. We believe that it is good that you always
    keep it in mind.


    # 11


    CHAPTER THIRTEEN: INVESTMENT RULES


    In this section, we will not explain how to get rich in a couple of months, and
    not why we do not want it, but why it would be really unwise to invest in the
    cryptocurrency market with that premise. You have to understand that those who
    made fortunes were people who invested money at a time when the perceived risk
    was really high, few people knew about bitcoin, it was associated with terrorism
    and arms trafficking, the future of these coins ...


    A posteriori it is very easy to think that it should have been invested. But those
    who made the decision at that time were not so clear about it and in many cases,
    the motivations were more sociocultural than not economic. Not to mention the
    falls of up to almost 90% that they had to endure without selling to achieve the
    returns that now amaze us so much. As in any investment, there is a very direct
    relationship between risk and return, now the risk is lower than in 2013, therefore
    the expected return is also lower.


    In any case, the current risk is still much higher than that of equities for example,
    and that is why it can be very interesting to invest with a solid strategy and
    with good risk management within the crypto market so that you can choose to get
    returns that we are not used to.


    The idea is very simple, find the best value propositions, backed with the right
    resources, identify good entry times, and invest the right amount so as not to
    put a large part of the portfolio at risk.


    Find the best value propositions.


    We must always keep in mind that projects related to cryptocurrencies use blockchain
    technology to cover a need in a different way. The first thing we have to ask
    ourselves is, does the project in which we plan to invest really need the blockchain
    and the token to work? Could the same solution be offered without Blockchain?
    Does the need you intend to cover really exist?'
