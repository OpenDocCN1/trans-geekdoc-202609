  trans: '


    ### 3. 它是匿名的


    在某种程度上是。用户可以拥有多个 `bitcoin` 地址，这些地址与姓名、地址或其他个人身份标识信息无关。


    ### 4. 它是完全透明的


    `Bitcoin` 将网络中发生过的每一笔交易详情都存储在一个巨大的通用账本中，被称为 `blockchain`（区块链）。`blockchain` 记录了一切。如果你有一个公开的
    `bitcoin` 地址，任何人都可以查问到该地址中存储了多少个 `bitcoins`。他们并不知道那是你的。


    然而，人们可以采取一些措施来使他们在 `bitcoin` 网络上的活动变得不透明，例如不持续地使用相同的 `bitcoin` 地址，或者不向单个地址转账大量
    `bitcoin`。


    ### 5. 交易手续费不取决于交易金额


    你的银行可能会对国际转账收取费用。但 bitcoin 并非如此。


    ### 6. 它是快速的。你可以向任何地方发送资金，只要 `bitcoin` 网络处理了付款，资金就会在几分钟后到达。


    ### 7. 它没有信誉机制


    当你发送 `bitcoins` 时，除非接收者将其寄回给你，否则将无返回。它们会永远消失。


    总结一下，这里是你关于 `Bitcoin` 需要了解的知识：


    * **第一**，`bitcoin` 是无法伪造的。

    * **第二**，你可以向世界上任何人发送或接收资金，且费用极低。`Bitcoin` 付款无法被拦截或禁止，`bitcoin` 钱包无法被冻结。

    * **第三**，通过 `Bitcoin`，你对自己的资金拥有完全控制权，无需通过银行或 `PayPal` 等第三方。

    * **第四**，`Bitcoin` 交易无法撤销或退款。你应该只与你信任的人进行交易。

    * **第五**，为了确保有效，`Bitcoin` 交易必须至少被网络确认一次（最好是至少至少 `6` 次确认）。

    * **第六**，`Bitcoin` 并不是匿名的。所有交易都存储在 `blockchain` 中，任何人都可以随地进行查看。可以随时查询任何地址的余额。

    * **第七**，你可以通过各种方式获得 `bitcoins`，例如将其作为服务或商品的付款方式，或者从你爱的人那里购买。你也可以在专业网站上使用银行卡或通过转账购买。

    * **第八**，接受 `Bitcoin` 的服务和企业每天都在增加。你可以使用你的 `bitcoins` 来支持这些通过加密货币维护诚实和透明形象的企业。

    * **第九**，`Bitcoin` 行业在不断演变，新的 `Bitcoin` 相关服务定期出现，请保持关注。

    * **第十**，注意其他与 `Bitcoin` 相似的加密货币，它们可能会引起混乱：`Bcash`、`BCH`、`Bitcoin Cash` 等……


    # 比特币投资流程


    在 `bitcoin` 的热潮中，涌现许多提供虚拟货币购买服务的经纪商和交易所。以下是一些最耗时的平台，可以被归类为获取 `bitcoins` 和其他加密货币的安全页面：


    * **Coinbase**：它是最大的网站之一，也是知名度最高的网站之一。它的优点是易于使用且非常直观。缺点是进行任何交易时收取的佣金（`3.5%`）。允许通过卡片和转账支付。

    * **Kraken**：它比 `Coinbase` 便宜，也是最大的平台之一。购买 `bitcoins` 的佣金低于 `0.3%`，并且允许在欧洲进行免费转账。

    * **Bit stamp**：另一家大型平台，其佣金与交易量挂钩。

    * **Cex.io**：他们接受欧元和英镑。


