- fmt: '

    Besides moving averages and Fibonacci levels, other technical indicators can be
    applied to cryptocurrency charts to perform their respective technical analysis.


    ### Technical Indicators


    **RSI**: The `Relative Strength Index` is a measure that reflects whether an asset
    is overbought or oversold. It is used to help traders measure the strength of
    the market.


    This indicator generally runs below the chart and scales from `1` to `100`. A
    reading below `30` indicates oversold conditions while above `70` indicates that
    the asset is overbought.


    **MACD**: `Convergence of the moving average`. `Divergence` is another favorite
    trader indicator that combines multiple moving averages to get the difference
    for more accurate trend identification. There is also a histogram that represents
    the difference between the fast- and slow-moving average.


    **Stochastic**: This simple momentum oscillator measures the degree of change
    between the prices of a closing period to predict the continuation of the current
    directional trend. It can also be used to find out if a crypto asset has been
    oversold or overbought.


    **Parabolic SAR**: The `Stop and Reversal` (in English) place points on a chart
    above or below the candle that indicates possible reversals in price movement
    and the end of a trend.


    **Bollinger Bands**: This tool measures market volatility, so when prices are
    on the side the bands are close together and when they are pumping or discharging
    the bands are spread apart.


    The upper and lower bands also serve as resistance and support levels. There are
    countless indicators such as `Ichimoku Kinko Hyo` (`IKH`), `Average Directional
    Index` (`ADX`), and the `Chaikin Oscillator`, but they are beyond the scope of
    this guide.


    Some indicators are specific to Bitcoin, such as trading volumes and liquidity,
    `Hash Ribbons`, `Puell Multiple`, `Dynamic Range NVT Signal`, `Metcalfe''s Law`,
    `UTXO metrics`, and `BTC Energy Value Oscillator`. However, they too are beyond
    the basics of chart reading and fall into the realm of analytics and chain metrics.


    ### Chandeliers


    A basic understanding of the Japanese candles that make up cryptocurrency charts
    is also a bonus. Each candle is used to describe price action over a specified
    period. They are formed using the open, high, low, and close prices of the chosen
    time (`OHLC`). The solid portion of the candle is called the body and the extended
    stem the wick. There are many different patterns and signals that these candles
    make that can also help determine the direction of the price when combined with
    some of the technical indicators described above. The infographic below shows
    some of the most common patterns.


    ![](Images/image00141.jpeg)


    ### Time frames


    This is a very important aspect of reading a cryptocurrency chart. A chart can
    show a snapshot of the market in a variety of different time frames, which will
    change the signaling of technical indicators.


    That is why it is very important to trade cryptocurrencies using multiple time
    frames. The most popular charting software will generally display charts in time
    frames from `1 second` to one month.


    The terms you use will depend on the type of operator. Resellers looking for quick
    small profits will trade in shorter time frames - one minute or less - while daily
    traders can use the `15 minute`, `one-hour`, and `four-hour` charts. Long-term
    traders and sellers will only be interested in the `daily`, `weekly`, and `monthly`
    charts. Reading charts at different periods will give a much better view of the
    bigger picture and the overall trend. Remember to say "the trend is your friend"!


    ### Cryptocurrency chart patterns


    Patterns often emerge on cryptocurrency charts that lead to the most predictable
    future price movements. These formations within the chart can be used to identify
    the reversal and continuation of the trend as well as bullish or bearish momentum.
    Some of the most generally recognized chart patterns for Bitcoin and cryptocurrencies
    are as follows:


    1. **Inversion patterns**: `Head and Shoulders`, `Inverse H&S`, `Cup and Handle`,
    `Double Top / Bottom`, `Rising and Falling Wedge`.

    2. **Continuation patterns**: `Pennants`, `rectangles`, `flags`, `rising and falling
    wedge`.

    3. **Bilateral patterns**: `Symmetrical triangles`, `ascending or descending triangles`.


    A two-sided chart pattern can result in a price breakout in either direction.
    Many of the chart patterns used for currency trading are also applicable to crypto.


    There are other ways to identify whether a trend will continue or is about to
    reverse.


    * **Higher high, higher low**: A bullish pattern that indicates that prices continue
    to rise and the uptrend is intact. Prices continue to exceed their previous highs
    and pullbacks are not as low as before.

    * **Lower high, lower low**: A bearish pattern that indicates that prices are
    falling and the downtrend is intact. Prices cannot go above their previous highs,
    and new lows are formed on each pullback. These are very important to watch when
    trading Bitcoin and the other cryptocurrencies.


    Divergences can be observed when there is a disagreement between the indicators
    and the prices. In an uptrend, this occurs when the price rises but the indicator
    does not, and in a downtrend, the divergence occurs when the price reaches a lower
    point, but the indicator does not.

