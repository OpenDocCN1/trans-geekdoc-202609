    \ crypto coins are volatile but listen, if you are going to make a fortune from\
    \ it, you must actively engage in the market through trading and investing.\n\n\
    The people who get the best out of cryptocurrencies are those who are proactive\
    \ with both aspects: LEARNING and EXECUTION!\n\nThis book is a reminder that it\
    \ is never enough to know what's going on in the world; until you participate,\
    \ you will only be a spectator. Although cryptocurrencies have been around for\
    \ a long time, they have experienced a meteoric rise lately, with one Bitcoin\
    \ pegged at $59,592.40 when this book was written.\n\nThere is a digital wave\
    \ worldwide with nations and people waking up to the enormous potentials of Bitcoin\
    \ and\n\ncryptocurrencies in general. You can ride this wave with the information\
    \ you glean from the chapters and sections below. Make up your mind even now to\
    \ learn with an open mind, to take the first steps, and get into the investment\
    \ world of cryptocurrencies where all the magic happens.\n\nAre you ready to get\
    \ started? We will kick-start this process with a foundational chapter detailing\
    \ steps on how to buy Bitcoin.\n\n16 \n\n# PRACTICAL STEPS IN BUYING BITCOIN\n\
    \nAnyone who wishes to become a serious, successful, and consistent crypto investment\
    \ must first buy the coin, which is bitcoin. Even if you’ve learned a lot about\
    \ the cryptocurrency market, the knowledge gained will only be beneficial when\
    \ you buy your first coin.\n\nThis chapter presents a step-by-step guide on how\
    \ you can buy your first bitcoin on Coinbase. There are numerous cryptocurrency\
    \ exchanges out there, but we will be working with Coinbase because it is a popular\
    \ and beginner-friendly platform.\n\n***Step one***\n\nDownload a wallet\n\nFirst,\
    \ you will need a wallet app for the cryptocurrencies you buy, especially if you\
    \ want to hold some before selling. Coinbase also has its wallet, so you can use\
    \ theirs by downloading from the app store or using other kinds of wallets such\
    \ as Bitcoin or Ethereum wallet.\n\n***Step two***\n\n![](Images/image00142.jpeg)\n\
    \nCreate an account on Coinbase.com with the appFirst, you’ve got to create an\
    \ account with the exchange by entering your name, email and creating a password\
    \ to sign up.\n\n![](Images/image00143.jpeg)\n\n***Step three***\n\nAdd your payment\
    \ account to the exchange.\n\nNext, you need to add an account by clicking on\
    \ “trade” on the Coinbase platform. This step allows you to choose what you want\
    \ to buy and how you intend to pay for your purchase.\n\nYou can link your bank\
    \ account and debit card. A bank account offers you a higher buying limit ($25,000),\
    \ but your transactions will be on hold for a few days. With a debit card, you\
    \ get instant access to your crypto purchases but with a $3,000 buying limit.\n\
    \n# CONTINUE\n\n***Step four***\n\nClick “trade” at the top-right of the app or\
    \ website.\n\n![](Images/image00144.jpeg)\n\nNext, click on “trade” and choose\
    \ the amount of bitcoin you want to buy. The fiat amount you input will show you\
    \ how much bitcoin you will get. Then you can select how you want to pay: either\
    \ through the bank account or debit card you set up. Then click ‘Preview Purchase”\
    \ to confirm everything.\n\n![](Images/image00145.jpeg)\n\n***Step five***\n\n\
    Confirm your details before buying\n\nLastly, you will have to confirm your details\
    \ before buying. The confirmation process also entails seeing the fee the exchange\
    \ charges you for the transaction. The prices depend on how much cryptocurrency\
    \ you purchase and the payment pathway you use (bank account or debit card).\n\
    \nThen click on “Buy now” to complete the entire transaction. At this stage, you\
    \ need to move quickly and close the deal before the exchange’s range for that\
    \ particular transaction changes. If the price range changes, the purchase will\
    \ fail.\n\n![](Images/image00146.jpeg)\n\nIt may take a while before your wallet\
    \ reflects your bitcoin purchase so do not worry if you still see ‘0” BTC.\n\n\
    ![](Images/image00147.jpeg)\n\nThen you will get an email confirmation of your\
    \ purchase:\n\nAfter the confirmation, you should enable “SEND AND RECEIVE” so\
    \ you can always send and receive BTC:\n\n![](Images/image00148.jpeg)\n\nYou will\
    \ need to verify your ID:\n\nNow that is all you have to do to buy some bitcoins.\
    \ Yes, the process is simple and straightforward. Tap the “trade” icon if you\
    \ want to sell your bitcoin for fiat to put in your bank account. You can also\
    \ convert the bitcoin to other cryptocurrencies that are supported by the exchange\
    \ you use. We used Coinbase to illustrate how to buy a bitcoin. Therefore, it\
    \ is not an endorsement as there are several other exchanges you can use. Please\
    \ always carry out your research on these exchanges, and combined with all you’ve\
    \ learned from this material, you will make a good decision.\n\nTo round off this\
    \ foundational chapter, we will consider the top ten cryptocurrencies available\
    \ in the market aside from Bitcoin; let’s go!\n\n![](Images/image00149.jpeg)\n\
    \n# CRYPTOCURRENCY\n\n1.Ethereum (ETH)\n\nEther (ETH) is the currency of the Ethereum\
    \ blockchain and is often regarded as the second most valuable cryptocurrency\
    \ after Bitcoin. Ethereum is also a technologically advanced version of bitcoin,\
    \ which has the potential to grow exponentially.\n\n![](Images/image00150.jpeg)\n\
    \n2.Ripple (XRP)\n\nRipple was created to enable cross-border payment through\
    \ its platform, and it has its XRP coin. The XRP coin is regarded as the third\
    \ largest crypto after Bitcoin and Ethereum (based on market capitalization).\
    \ XRP like other coins have had its ups and downs but has retained its spot as\
