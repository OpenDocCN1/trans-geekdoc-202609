    \ is possible;\n\n●The money transfer is done very quickly, in just a few minutes\
    \ unlike traditional bank transfers which can take several days;\n\n●Transfer\
    \ fees are almost non-existent;\n\n●It is possible to transfer money all over\
    \ the world;\n\n●No cap is put in place;\n\n●No transfer limit is in place;\n\n\
    ●No cancellation possible for the recipient of the virtual currency, the transaction\
    \ is completely irreversible;\n\n●No intermediary in the transaction, that is\
    \ to say, that there is no intervention of any bank.\n\n8 \n\n# CRYPTOCURRENCY\
    \ TRADING\n\nCryptocurrency trading involves trading on the price movements of\
    \ a cryptocurrency using a CFD trading account or buying and selling the underlying\
    \ currency through an exchange.\n\n***Cryptocurrency trading on CFDs***"
