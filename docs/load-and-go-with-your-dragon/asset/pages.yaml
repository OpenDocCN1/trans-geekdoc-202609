  md: "# Debugging Programs\n\n```\nPRINT Y      'you type this\n17           'dragon\
    \ replies\nOK\nPRINT XR     'you type this\nØ            'dragon replies\nOK\n\
    \nPRINT Y*31+XR  'you type this\n527          'dragon replies\nOK\n```\n\nThis\
    \ looks odd for a start; there are 32 lines on a screen aren't\nhere? No, there\
    \ aren't. So our loop should only run up to 16.\n XR should be a random number\
    \ in the range 1-31, this is\nwhat we asked for in line 10. \"Ø\" can't be right.\
    \ We set the\nvariable as X not XR; we have used the wrong name. Clearly also,\n\
