  img_proc: true
- pgno: 45
  md: '# Nim


    This is a balanced situation, from which you always win. If he takes any number
    the appropriate reply is shown below:


    He takes from pile n You take from pile n


    +   3 from pile 1 giving 1,1,0 again

    2 from pile 2 giving 1,1,0

    1 from pile 1 giving 2,2,0

    2 from pile 2 giving 1,1,0

    1 from pile 2 giving 1,1,0

    3 from pile 1 giving 2,2,0

    1 from pile 3 giving 2,2,0


    So you always win!


    When you play against the computer, if you make the first move you will usually
    win. ''There can be up to 29 matches in one pile, which makes the calculations
    a bit more tricky and one slip and you''re done for.


    Many years ago, about 1950, I built a machine for playing this game out of War
    Surplus bits and pieces. It was a monstrous creation with meters, bits of old
    packing cases and decimal binary decoders made of strips of tin, with sellotape
    wrapped over them at intervals. It made the simplistic assumption, that the opening
    move would always be a pre-emptive strike on one whole pile, to simplify the calculations.
    By comparison with the Dragon, this creation was beyond the pale, but I have retained
    a strong affection for the game, which should be better known.


    ```

    10 REM NIM PROGRAM

    20 CLS:PRINT TAB(12);"NIM" ''rules

    30 PRINT"THE OBJECT OF THE GAME IS TO"

    40 PRINT"TAKE THE IAST MATCH. YOU MAY "

    50 PRINT"TAKE ANY NUMBER, BUT FROM ONLY"

    60 PRINT"ONE PILE AT A TIME."

    70 PRINT:INPUT"PRESS ENTER TO CONTINUE";$A

    80 FOR N=1 TO 3:N(N)=RND(29):NEXT ''set pile values

    ```'
  merge: -1
  img_proc: true
