  md: '# Pontoon


    Since this is a complicated program, it may be difficult to get going. Some diagnostic
    hints might help. The pack is contained in array P. To print out the pack, type
    in direct mode:


    ```

    FOR Z=1 TO 52:PRINT P(Z);:NEXT

    ```


    All the numbers should be different, and in the range 1-52. Variable P should
    be between 1 and 52 and point to the next card to come out of the pack.


    To look at players'' hands, type:


    ```

    FOR Z=1 TO 15:PRINT HD(Z);:NEXT

    ```


    Player one''s cards are elements 1-5, player two''s 6-10, and the Bank''s 11-15.


    Also, look at array PG which contains for each player the number of cards in his
    hand:


    ```

    FOR Z=1 TO 3:PRINT PG(Z);:NEXT

    ```


    If you think that the settling up of bets is wrong, then press Break and type:


    ```

    PL=1 (or PL=2):GOSUB 1190;PRINT BU;C5;PI;HT;MT;AT;

    ```


    The first three are the truth variables, followed by the lowest score, the best
    score, and the number of aces. Variable WR should be set to the result of the
    hand.'
