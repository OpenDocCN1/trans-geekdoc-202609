  md: '# Debugging Programs


    without the clutter on the screen, so let''s put in a clear screen statement as
    line 05:


    05 CIS


    It is still going too fast for us to see what is going on so let''s put a PRINT
    and STOP statement in as line 32:


    ```

    32 PRINT @360,X;Y*31+X;STOP

