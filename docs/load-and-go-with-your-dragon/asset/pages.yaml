- pgno: 66
  md: '# ENIGMA VARIATIONS


    Probably the Enigma coding machine used by the German Army during the Second World
    War was responsible for the development of the electronic computer. The story
    of the work done at Bletchley Park has been told many times (see for instance
    "Most Secret War" by R.V. Jones - Hodder and Stoughton-Coronet Books). Much is
    still shrouded in mystery but without doubt Alan Turing was pre-eminently responsible
    for the design of the "Bombe" which the first computer was called.


    ![](img/7a80be36866e3d2c055800fc953633cd_66_0.png)


    For those who have never seen them it is difficult to imagine the sheer bulk of
    the early computers. I once attended a sherry party held inside the ACE computer
    at the National Physical Laboratory. Also, so the story goes, a group of important
    overseas visitors were being shown round the DEUCE computer. The salesman confidently
    strode to the echo chamber which was used as the dynamic RAM for the machine and
    threw open the door. Inside, the astonished visitors found an engineer eating
    sandwiches in peace and quiet, or so he thought, sitting on the loudspeaker enclosures
    inside the chamber.


    All of which is a sneaky introduction to the following encoding program, which
    imitates the action of an Enigma machine and produces a secret code that is extremely
    difficult to crack unless you have an IBM 3031 machine with a few days spare time.


    The program relies upon the tip we have described earlier for setting the seed
    of the random number generator. Random numbers produced from a given seed are
    not truly random but repeat a predetermined sequence every time. So, there are
    three parts to the'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Enigma Variations


    The first is the secret number used to unlock the key today. This can be anything
    up to 9 digits in length. The second is the order of the letters in the coding
    string. We have chosen to put the letters as "ABC...." followed by the numbers
    and special characters, but you could have them in any order that you have agreed
    with your control. This allows you to have 42!(factorial) permutations for your
    code (a monstrous number). Finally the decipherment is carried out by adding a
    random number to obtain the substitute letter to be used. This means that "AAA"
    for example would not be encoded as the same letter every time - counting the
    letter frequency will not help in cracking the code.


    ```

    20 INPUT "KEY";A:IF A<0 THEN 20

    30 A=A:X=RND(A)

    40 INPUT "ENCODE/DECODE";A$

    50 IF A="" THEN END ''null means quit

    60 A$=LEFTS(A,1)

    70 IF A="D" THEN S=1:PRINT"DECODING" S=0:PRINT"CODING"

    80 CHANGE STRING W TO SUIT YOUR OWN CODE

    90 W="ABCDEFGHIJKLMNOPQRSTUVWXYZ 0123456789#$,,?":W=LEN(W)

    100 INPUT "ENTER TEXT";A$:IF A="" THEN END

    110 A$=LEN(A)

    120 FOR N=1 TO A

    130 X=$MID($A$,N,1)

    140 GOSUB 230 200 ''find the letter position within w$

    150 IF S=1 THEN Y=Y+W ''decoding

    160 Y=RND(W)+X

    170 IF Y>W THEN Y=Y-W:GOTO 170

    180 PRINT MID($W$,Y,1);

    190 NEXT N:PRINT:GOTO 100

    200 Y=X-RND(W)''decoding

    210 IF Y<1 THEN Y=Y+W:GOTO 210

    220 GOTO 180

    230 X=INSTR(W,$X)

    240 IF X=0 THEN X=\=

    250 RETURN

    ```'
  merge: -1
  img_proc: true
