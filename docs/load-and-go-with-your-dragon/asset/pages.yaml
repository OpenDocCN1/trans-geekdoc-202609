  md: '# TARGET PRACTICE


    As you run past a stationary target, you must fire your arrow to try and hit it.
    The Dragon goes so fast it is not that easy to do. To make it easier we allow
    a speed handicap - enter a number up to about 100 to slow it down to human speed,
    but see how small a number you can use and still hit it. The number of times you
    run past is counted as well as the number of shots you need to take.


    ![](img/7a80be36866e3d2c055800fc953633cd_37_0.png)


    ```

    10 REM TARGET PRACTICE

    20 INPUT"HANDICAP (0-100)";D2 ''D2 slows down the dragon

    30 CLS

    40 N=0:M=1 ''M=number of shots N=no of turns

    50 T=RND(12):X=RND(31) ''T,X define the target position

    60 PRINT @*(32+X,"O" ''O is the target

    70 N=N+1

    80 FOR Y=0 TO 13 ''run past

    90 IF Y=0 THEN PRINT@(Y-1)*32,"" '' ''Y=0 blank out the

    old position

    100 PRINT@*(32,")";"

    110 IF INKEY($)<>""" THEN 160 ''test to see if key has

    been pressed

    120 FOR D=1 ''TO D2:NEXT D

    ''delay to slow down

    130 NEXT Y

    140 PRINT@13*32," " ''blank out the one at

    ''the bottom

    150 GOTO 70

    ```'
