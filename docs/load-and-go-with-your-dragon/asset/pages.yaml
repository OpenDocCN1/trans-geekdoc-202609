  md: '# Lucky Dip


    # VAT Calculator


    Value Added Tax involves some very fiddly calculations in either adding it to
    goods values or taking it out to work out the input tax. This program does both
    at the same time. It produces:


    +   - the goods value (assuming the input value is tax inclusive)

    - the tax value (assuming the input value is tax inclusive)

    - the tax that would be payable if the input value were exclusive of tax


    ```

    10 REM VAT CALCULATION PROGRAM

    20 V=15 ''CURRENT RATE OF VAT

    30 CLS:PRINT TAB(4);"GOODS";TAB(14);"VAT INC";TAB(24);"VAT EXC"

    40 INPUT "AMOUNT":A$\n50 IF A="" THEN END

    60 A=VAL(A$)

    70 B=A/(1+V):C=A-B:D=A*V

    80 PRINT USING"###,***,## ";B;C;D

    90 GOTO 40

    ```


