- pgno: 5
  md: '# INTRODUCTION


    This book is intended to be fun but also educational. It contains programs for
    the Dragon 32 home micro-computer, which is equipped with Microsoft 16K Colour
    BASIC. The majority of the programs are short (about 50 lines) so that it is easy
    to type them in and "RUN". Some are serious and some are silly but we hope most
    of all that you will find them. There are also longer ones towards the back of
    the book, which might be more difficult to get going back but should prove more
    rewarding. The complexity of a program increases with the square of its length
    and most commercial programs are over 2000 lines long!


    The book is educational in several ways. Firstly, we provide home-work tools like
    "Sums Tester" and "Vocabulary Tester", which might make hundred tasks more exciting.
    Secondly, a major section of the book is devoted to explaining in a comprehensive
    way the Graphics features on the Dragon. This could prove a useful supplementary
    source to your BASIC manual for understanding these very powerful features. Lastly,
    comprehensive chapters are included on "Debugging Programs" and "Hints and Tips"
    both of which should help to get your programs running as well as the programs
    in this book.


    It would be wrong to allow anyone to think that typing in programs and running
    them is "programming". It is not. However, the study of worked examples is an
    essential learning aid for anyone beginning to program. So often, a manual will
    teach the words and the grammar without giving any real understanding of how to
    connect them together to make a story or a poem. All the examples in this book
    are comprehensively annotated with comments and explanations and every encouragement
    is given for the reader to modify them to see how minor changes would affect their
    running. A good understanding of the principles of program'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# Introduction


    construction will help immeasurably when you start to construct your own programs,
    which we hope that you will do.


    The title "Load and Go" is a term of art referring to compilers or assemblers
    which not only process the program but also start to execute it immediately after
    assembly is finished. In terms of the Dragon, perhaps it should be ''Type and
    Run'', but "Load and Go" has a certain ring to it.


    Not all the material in this book is completely new. We have gathered together
    the old favourites (golden oldies) from our other works (see back page). In the
    process, most have had to be totally re-written to take advantage of the powerful
    features of the Microsoft BASIC language nearly always the resulting program is
    much shorter than the original, which is a striking testimony to the power of
    the Dragon. About half of the material is totally new and written specially for
    the Dragon.


    Where possible, we have tried to introduce games that can be played by two people
    as well as the computer and we start and end the book with such a program. When
    you want to show friends how the computer works, it is more fun if they can also
    take part, instead of having to watch in awed amazement as you expertly play the
    keyboard.


    We also deliberately used only features to be found on the standard Dragon. To
    ensure this, we purchased the Dragon used in the preparation of the book over
    the counter in a chain store. Although the programs do use colour and having a
    colour television will add an extra dimension for you, we have not assumed its
    use. The presentation of all of the programs will be quite intelligible in black
    and white. We have not assumed the use of joysticks, which at the time of writing
    were in short supply, nor'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Introduction


    of printers, nor of extra memory beyond the standard, nor disk units.


    We suggest, however, that at an early stage you start using a cassette recorder
    to retain the programs on tape as you enter them. A special section on how to
    get this working is included in "Hints and Tips". A cassette recorder is far from
    being an optional extra as some publicity implies - it is quite essential.


    How this book was produced


    How this book was produced


    First we produce a working version of each program and test it thoroughly with
    junior volunteers who attempt to test it to destruction. To ensure that code is
    transferred exactly to print a parallel to serial converter which is attached
    to the printer port of the Dragon and used to transfer the program listings into
    our word processor.


    Now suppose, as sometimes happens, that you put in the program and type "RUN"
    and it doesn''t work. Firstly, "Don''t Panic". Secondly, list it on your printer
    or on the screen and check against the book very carefully; also ask someone else
    to check it with you. If this doesn''t solve the problem, then read the chapter
    on debugging, which might help to pin down the area in which the problem is occurring.
    If all else fails, please write to us and describe the problem. Sending a cassette
    of your version of the program is helpful as sending a printer listing of the
    program. Those who send a self-addressed stamped envelope also get higher priority
    than those who don''t!'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Introduction


    # Program presentation


    The programs have been annotated in two stages. The first stage was when they
    were originally prepared on the Dragon. A first stage annotation would look like
    this:


    ```

    L10 REM NIM PROGRAM

    ```


    This type of remark, which has a line number attached, you should always put into
    your version. Beware of leaving it out because that line number may be used as
    the destination of a GOTO or a GOSUB statement.


    The second stage annotation was added in the word processor and might look like
    this:


    ```

    L10 FOR Z=1 TO L10:A(Z)=0:NEXT      ''reset the array

    ```


    The part following the '' character is an explanatory remark added later. This
    type of remark can be omitted when putting in the program. Include it if you wish,
    but we have been very liberal with this type of remark so as to make the programs
    as clear as possible.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# PAIRS


    A game for two players, where the object is to collect as many pairs of cards
    as possible. The whole pack is spread out and each player may turn over two cards
    at a time. If they match, then that player keeps the pair, removes it from the
    field of play and is allowed another go. If the cards do not match, then they
    are turned face down again and it is the other player''s turn. If you have a good
    memory, then you can benefit from your opponent''s mistakes.


    ![](img/7a80be36866e3d2c055800fc953633cd_9_0.png)


    To turn over a card you enter the reference code shown against the card on the
    screen e.g. "BZ" and that card will be displayed. It shows the card suit (C,D,H,S)
    followed by the denomination (A,K,Q,J,T,9 ...). A pair clearly is made up of two
    of the same, eg. A problem peculiar to computers arises if the player attempts
    to turn over a card that is no longer there or attempts to match a pair by turning
    over the same card twice. In such cases, the computer responds by printing ''HO
    HO'' in the space!


    A card is represented by the chequer pattern CHR$(134) in which the colour is
    orange and the background black. It should look like this:


    ![](img/7a80be36866e3d2c055800fc953633cd_9_1.png)'
  merge: -1
  img_proc: true
