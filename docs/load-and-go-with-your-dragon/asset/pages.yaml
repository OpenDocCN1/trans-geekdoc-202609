    \ \"SPLAT\"\n```\n\n```\n?FC ERROR IN 30 again!\nPRINT Y,X,Y*31+X  'you type\n\
    16               20\n516              'dragon replies\nOK\n```\n\nYes there are\
    \ sixteen lines. Why are we still off the screen? Ah\nInspiration - Ø to 16 is\
    \ actually 17 isn't it? Line 20 becomes:\n\n```\n20 FOR Y=Ø TO 15\n```\n\nAt last\
    \ we get OK, no syntax errors. But, the \"O\" still runs\ndiagonally across the\
