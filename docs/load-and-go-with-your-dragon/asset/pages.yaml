- pgno: 39
  md: '# DIGITAL CLOCK


    A digital clock that plays Westminster Chimes - now there''s a novelty! It uses
    the timer inside the Dragon to get the ticks and displays the hours, minutes and
    seconds, using the 24 hour clock notation. If you have set the chiming mechanism,
    except between the hours of 10 pm and 7 am it will chime the hours for you. Naturally
    it only chimes on the twelve hour clock because 23 bongs would be rather tiresome.


    ![](img/7a80be36866e3d2c055800fc953633cd_39_0.png)


    The main problem with this program is in tuning or regulating it. The timer could
    vary slightly from machine to machine and in any case doesn''t give precise one
    second ticks. One is added into the timer count about every 22.43 milliseconds,
    which makes for a difficult conversion into seconds. A basic tick is set at 44
    strokes of the timer, but further regulation is required by adjusting the variable
    TL - this has been set for our machine at 1.013 which keeps good time to within
    1 or 2 seconds per hour. Bear in mind that your machine could be slightly different
    and might require further regulation.


    The display of the time should look like this:


    ***********


    HH : MM : SS


    ***********'
  merge: -1
  img_proc: true
