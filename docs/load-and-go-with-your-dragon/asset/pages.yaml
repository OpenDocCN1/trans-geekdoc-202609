- pgno: 13
  md: "# PIN THE TAIL ON THE DONKEY\n\nHere's a piece of fun to test your timing -\
    \ try to pin the tail on the donkey. You press a key, and the length of time that\
    \ the key is held down determines the length of the tail. The trick is to hold\
    \ it down for exactly the right length of time, or to do it with the fewest number\
    \ of attempts. When the tail reaches the donkey the score is given. If you wait\
    \ too long, you can cause the donkey some damage.\n\n![](img/7a80be36866e3d2c055800fc953633cd_13_0.png)\n\
    \n```\n10 L=65280               'peek location\n20 CLS:PRINT \"PIN THE TAIL ON\
    \ THE DONKEY\"\n30 PN=RND(10)+180         'random position for donkey\n40 PRINT@448,\"\
    PRESS A KEY\"\n50 PRINT@PN+30,CHR$(128)+CHR$(128)+\"O\" 'body,head\n60 PRINT@PN+62,CHR$(129);CHR$(131);CHR$(128)\
    \ 'body,legs\n70 PRINT@PN+94,CHR$(135);CHR$(130) \n80 PRINT@@PN+135:CHR$(143)+CHR$(139)\
    \ 'legs\n90 P=192                'START OF TAIL\n100 G=0\n110 GOSUB 170      \
    \     'get the time interval\n120 T=INT(T/2)\n130 PRINT@P,STRING$(T,131)  'tail\
    \ of length T\n140 P=P+T;G=G+1;IF P>PN+30 THEN PRINT@448,\n    \"OUCH HURT!!!!\"\
    :GOTO 220\n150 IF P=PN+30 THEN PRINT@448,\n    \"WELL DONE - YOU TOOK \"G\";GOTO\
    \ 220\n160 GOTO 110\n```"
  merge: -1
  img_proc: true
