- pgno: 92
  md: 'This time a slightly more colourful picture. An old fashioned train puffs along
    the line and disappears into the tunnel. We use mode 1, which gives a wider range
    of colours and allows the maximum number of pages to be used for graphics. We
    also do the animation by a more sophisticated method, which is more suitable for
    cartoon type programs. This allows characters to appear in front of or behind
    objects as they move across the screen.


    ![](img/7a80be36866e3d2c055800fc953633cd_92_0.png)


    First the new commands:


    PCOPY nl TO n2 This command makes a straight copy of a single page of graphics
    memory. It does only copy a single page. So for mode 1 graphics which take 2 pages
    per screen it is necessary to execute two separate commands. Copying does not
    affect the screen being displayed (unless of course that is the screen being copied
    to).


    PAINT (x,y),c2,c2 In operation this command can be tricky. In concept it is simple
    - it is as though you spilled a pot of paint of colour cl at a given spot and
    it spreads until it hits a barrier, which is the defined colour spots of colour
    c2. It follows from this that the x,y coordinates must be within the area which
    you are trying to paint. Spill your paint outside the barrier and it fills the
    whole screen, which can be disconcerting, to say the least. Suppose you have drawn
    a circle in red (colour 4), on a blue background (colour 3) and you are trying
    to paint it red. Clearly the barrier colour cannot be blue or the painting process
    will stop immediately when it hits the blue left inside the'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Train Picture


    circle. So it must be red. Now if the coordinate references fall actually on the
    spots forming the circle you have just drawn, then it will stop immediately having
    found the red barrier. You must be careful that the coordinate references fall
    inside the blue interior of the circle. This is best achieved by specifying the
    same references for the middle of the circle.


    ```

    GET (x,y)-(x2,y2),an,G To save a particular part of a picture, use this command.
    It "gets" the part of the picture specified by x,y (top left corner) and x2,y2
    (bottom right corner) from the current display screen, and stores it in the array
    an. Array must have been dimensioned previously at the right size to hold this
    amount of data, one array element per spot on the screen. The array dimensions
    will be x2-x and y2-y respectively. If parameter G is specified then the action
    code (see below) must be specified for PUT.

    ```


    ```

    PUT (x,y)-(x2,y2),an,PSET To do the reverse of GET and put back the parts of the
    picture, use PUT. Because it needn''t be put back in the same place as it was
    in originally, this is a way of producing motion in the picture and is the basis
    for the train program. There are other action codes besides PSET, but they are
    rather complicated. If a picture is PUT in a position where part will fall off
    the screen, strange things happen!

    ```


    We shall be using mode 1, which has a resolution of 128 X 96 spots on the screen.
