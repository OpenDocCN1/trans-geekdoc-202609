- pgno: 18
  md: '# Ski Run


    # Characters


    1-2 Starting position of left hand post. The right hand post position is calculated
    from the degree of skill entered. The width of course is G which can take a maximum
    value of 9 for the amateur. So, course start position should not be greater than
    21.


    3-4 Starting position of skier - this would normally be the post starting position
    plus two. To be very annoying you could start the skier outside the posts altogether.
    Maximum value is width of screen (31).


    5-6 The rest of the string is a series of two digit numeric values which represent
    the values to be added to the current post position. Do not use values greater
    than 02 or -2 as the player cannot move the skier more than two positions in each
    turn.


    A small valid course description would be:


    ```

    C$="15 17 00 00 01 01 -1 -2 -2 00 00"

    ```


    The spaces are just put in to make it easier to read. It says the starting position
    of the left post is 15, the skier position is 17. For the first two turns the
    course runs straight, then it bends to the right for two turns and to the left
    for two turns, then more sharply to the left. The last two turns are straight.


    The program will automatically show a finish line and the number of hits made.
    Since the speed of the game is approximately three turns per second, an ideal
    course should take about 30 seconds to run fully. The maximum length that you
    can construct is dictated by the maximum string length of 255. This means that
    the maximum number of turns is 254/2 (because the number must be even) less 2
    i.e. 125 turns.


    Some people have difficulty entering the very long strings for the course correctly.
    If you miss out one number in say the'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Ski Run


    string "\00 02 01 01" so that it becomes "\00 20 10 1" it is taken as +20 then
    +10 with an odd one left at the end. The odd one causes an error report, but meanwhile
    the course goes out of control. To check that you have typed it correctly, add
    the following lines:


    ```

    700 GOSUB 300

    710 FOR Z=5 TO LEN(C$)-1 STEP 2

    720 PRINT VAL(C$,Z,2))

    730 NEXT Z

    ```


    Then execute 700 in direct mode and you will see the course values printed out
    for you in pairs. If any of the values greater than plus or minus 2, then you
    have missed something out. Remember however that there are two courses. Run this
    two or three times until you are sure that both are correct.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# SUMS GALORE


    It may not be current educational theory, but I doubt whether any parent would
    disagree that regular practice, table learning, and table tests are the foundations
    of good arithmetic. It can be very difficult for the teacher to make up enough
    sums to keep the children active and busy, so here is an automatic sums tester.
    An example program of this type is given in the Dragon manual, but this has this
    significant advantages. It is shorter to type in, it does not assume knowledge
    of directed (negative) numbers, which may not have been covered at primary school
    level, and it dodges the question of remainders after division, by making sure
    that the division sums always give a whole number quotient with no remainder.


    A maximum number can be specified at the beginning. So, for example, to test number
    bonds up to a sum of 10 only, specify 5 as the maximum number. This will generate
    sums up to 5+5 maximum. To test number bonds involving carry, specify 9, this
    gives a maximum sum of 9-49. To test all tables up to 12 times 12, specify 12
    as the maximum and so on.


    There are always ten questions, and the answers wrong or right stay on the screen
    at the end, so the teacher can look at them to see what mistakes are being made.
    Appropriate reinforcement is also given according to the score. We suggest that
    the teacher should set up the problem specifying the maximum and the rule to be
    used, and then come back when the test is complete.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Sums Galore


    ```

    10 REM SUMS TESTER

    20 CLS:PRINT TAB(8);"SUM TESTER:";PRINT

    30 INPUT WHAT IS THE LARGEST NUMBER?";MX      ''see text

    40 INPUT "WHICH DO YOU WISH (+/-)";AS$        ''see text

    50 R=RINT("**/",AS); IF R<>0 THEN 40  ''invalid reply

    60 T=0:C=1:CLS:W=N:N=M

    70 M=10:IF INT(M/N)<10 THEN N=N+1:OTO 70  ''how many digits?

    80 N$=STRINGS(N,"A")"-          ''edit mask for printing commands

    90 T=T+1:IF T>10 THEN 310           ''always 10 questions only

    100 N1=RND(M):N2=RND(M)            ''pick the numbers to be used

    110 IF R=1 OR R=3 THEN 170         ''plus or multiply

    120 IF N2>N1 THEN 100             ''ensure result positive

    130 IF R=2 THEN 170

    140 N2=INT(N1/N2):IF N2=0 THEN 100  ''fix division so that is integer

    150 N1=INT(N1/N2):N2:IF N1=0 THEN 100  ''avoid asking about 0

    160 IF N1=N2 THEN 100             ''not n/n which is too easy

    170 ON R GO=180,190,200,210      ''plus,sub,divide

    180 Q$="PLUS":DS=N1+N2:OTO 220     ''is the correct answer

    190 Q$="MINUS":DS=N1-N2:OTO 220

    200 Q$="TIMES":DS=N1*N2:OTO 220

    210 Q$="DIVIDED BY":DS=INT(N1/N2)

    220 PRINT "WHAT IS ";

    230 PRINTUSING N$;

    240 PRINT Q$:;PRINT USING N$;N2;   ''ask the question

    250 INPUT AN                     ''get the answer

    260 P=P(T-1w)*32+30:IF P>480 THEN P=480  ''which line are we on?

    270 PRINT "? ""

    280 IF AN=DS THEN PRINT "OK";ELSE PRINT "NO THE ANSWER WAS";DS

    290 IF AN=DS THEN C=C+1 ELSE W=W+1

    300 GOTO 90

    310 PRINT:PRINT"YOU SCORED";C;"OUT OP";T-1

    320 IF C=T-1 THEN PRINT"GO TO THE TOP OF THE CLASS"

    330 IF C>T-3 THEN PRINT"WELL DONE"

    340 IF C<INT(T/5)THEN PRINTOH DEAR - WE NEED MORE PRACTICE"

    ```'
  merge: -1
  img_proc: true
- pgno: 22
  md: "# HANGMAN\n\nThis ever popular game is played with two people (or one with\
    \ an extremely short memory) - one to enter the selection of words and another\
    \ to computer control. The words are entered as a DATA statement in line 120,\
    \ and there can be as many as you wish. Guessing takes place by entering either\
    \ a letter or a whole word. A table at the top of the screen is updated as letters\
    \ are used and any correct are displayed in the word at the bottom of the screen.\
    \ If you guess at the whole word, then the letter table is not updated - your\
    \ guess is either right, in which case, you win, or wrong, in which case you lose\
    \ a life. You have 10 lives. As these are lost a picture of a hanging man is gradually\
    \ built up on the screen.\n\n![](img/7a80be36866e3d2c055800fc953633cd_22_0.png)\n\
    \n```\nDIM A$(26)\n110 REM CHANGE WORDS BELOW FOR NEW GAME\n    'first data element\
    \ is the number of words\n120 DATA 5, \"WORD\", \"HORSE\", \"DOG\", \"CAT\",\"\
    GUESS\"\n130 READ W$:CONTROL VARIABLE\n140 CLS0:READ W$:W=W-1:E=0\n    'W is the\
    \ word count\n    E=lives lost\n150 FOR Z=1 TO 26:A$(Z)=CHR(64+Z):NEXT Z 'set\
    \ up letter table\n160 PRINT @045,STRING(LEN(W),\"*\\*\");'word mask at bottom\n\
    170 FOR Z=1 TO 26:PRINT @1+Z,A$(Z):NEXT Z 'letter table\n180 PRINT @440,\"GUESS\
