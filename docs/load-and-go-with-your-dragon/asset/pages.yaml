  md: '# Debugging Programs


    they have the correct values.


    Now we realise that we have made a mistake in the design. As each new position
    of the stone is printed we should wipe out the old one, to give the impression
    of a stone falling. So we need to add a line to wipe out the old stone by printing
    space at the line before. Now, there is no line before Ø so we must watch out
    for that.


    ```

    05 CLS

    10 X=RND(31)

    20 FOR Y=0 TO 15

    22 IF Y>0 THEN PRINT @(Y-1)*32+X,"

    30 PRINT @Y*32+X,"O"

    40 NEXT Y

    50 PRINT "SPLAT"

    ```


    Fine. Now it might be nice if the stone fell a little more slowly so we could
    see it fall and really the splat should appear where the stone fell and not at
    the right hand side, so we add:


    ```

    32 FOR DL=1 TO 50:NEXT DL

    50 PRINT TAB(X);"SPLAT"

    ```


    and


    If you run the program now, it should do exactly what we required. You should
    have seen how we tracked down the errors, using three important techniques:


    +   1. Knowing roughly what the program is to do, otherwise you are fighting "blind".

    2. Using direct PRINT commands (i.e. without a line number) to check the value
    of variables when an error occurs.

    3. Using STOP commands to allow portions of the program to be checked in more
    detail. These can be removed once you are'
