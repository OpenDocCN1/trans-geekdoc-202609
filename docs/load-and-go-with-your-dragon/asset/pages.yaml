- pgno: 87
  md: '# THE FLY Ø AND THE TREACLE


    We now move on to the higher level graphics, starting with the highest resolution
    (the most points). For this we use mode 4, which has two simple colour sets which
    is conveniently available, Black and Green (Set Ø) and Black and Buff (Set 1).
    Of these we are using Black and Green, so colour Ø is Black and colour Ø is Green.
    In this mode, only one bit of colour information is stored for each point (Ø or
    1). Four pages of memory are required for this mode.


    The program is very simple; a fly is flitting about in the forest above a pool
    of treacle handy. The fly moves about at random, going "buzz, buzz" in the plaintive
    and annoying way that flies have. Eventually he lands on the treacle and gets
    stuck. At this point he can''t move any more and starts getting annoyed with a
    helpless "beep, beep." Just what he deserved! A silly program, but it illustrates
    some of the points about graphics.


    First of all we must understand the effect of some of the special high resolution
    mode commands.


    PCLEAR n pages of graphics memory for use in storing data to be displayed. This
    does not clear the graphics area; it does not display the area; it can cause string
    variables to be erased, since graphics space would appear to be allocated above
    string space (for this reason, always put the PCLEAR command first in the program).


    PMODE n,p Set the mode or resolution, which determine how information put into
    the graphics area will be recorded. N sets the mode and p sets the next page to
    be written into. In this mode there are four pages involved but p is the number
    of the first and by implication PMODE 4,1 defines'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# The Fly and the Treacle


    pages 1 to 4 inclusive. This command does not clear the area or cause it to be
    displayed.


    PCLS c This command does initialise the area to the colour specified. By implication,
    it works for all the pages specified by the PMODE command. That is, if PMODE 4,1
    has been set, then pages 1 to 4 inclusive will be reset by the command.


    COLOR c1,c2 Foreground colour set as cl. Background colour set as c2. These terms
    have nothing to do with the border round the graphics square - they refer to the
    colour of INK and PAPER (to borrow terminology from elsewhere). LINE commands
    refer to the foreground colour as do PSET commands; PRESET commands back to background
    colour. The range of colours available to you is always less than those in the
    range - with a little thought you can see why; green writing on green paper is
    good for invisible writing but not much for anything else. If you have more than
    two colours available, then foreground nor background need be the same as the
    initial value set by PCIS.


    SCREEN 1,n This is the valid command that causes a switch from the text mode (0)
    to the high level graphics mode (1). The current colour set is defined by n. In
    level 4 this can only be 0 or 1 and we are using 0. The page to be displayed is
    taken from the current setting of PMODE at the time that the command is obeyed.
    If, subsequently, PMODE page is changed, this does not cause the picture on the
    screen to alter. Any subsequent screen command will cause the new setting to be
    displayed. This means that you can work on another page displaying a totally different
    one. Executing an END statement causes an automatic switch back to mode 0 (text),
    so whilst working on program development it is best to include a statement e.g.,
    . This causes an endless loop whilst you examine the picture. To get back again,
    use Break key. If the colour set is changed, by a SCREEN command from that in
    which it was initially written, the colours will change auto-'
  merge: -1
  img_proc: true
