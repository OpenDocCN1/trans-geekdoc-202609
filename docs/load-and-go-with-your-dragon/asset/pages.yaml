  md: '# PONTOON


    You may have seen some programs which play Blackjack on the American model. Pontoon
    is very similar, but the European version has some important differences. So,
    perhaps a description of the game is in order first.


    The object of the game is to draw a number of cards, which approach as closely
    as possible 21 in value, hence the name Vingt et Un in the European version. For
    this purpose, court cards, Jack, Queen, King count as ten and an Ace may count
    as 1 or as 11, as the holder wishes. Two cards, consisting of an Ace and a King,
    constitute a Pontoon, when these are the only two cards held, and possession of
    a Pontoon gets special rewards.


    A banker (or dealer) is appointed and a card is dealt to each player, and bets
    are placed on that first card. At this point the dealer may "double" (I.e. require
    that all bets are doubled). A second card is dealt to each player. If the Bank
    now holds a Pontoon, it must declare it and all players pay the banker. Supposing
    that the Bank does not hold a pontoon, each player in turn is then asked whether
    he wishes to "Twist" (receive a card face down for an increased stake), or "Stick"
    (receive a card up and no more cards). It is usually obligatory to take another
    card with a hand of a value of 15 or less. If a player holds two of a kind in
    his hand, he may "split" the hand and play it as two separate hands. Anyone holding
    five cards in total representing a score of 21 or less wins automatically as if
    he held a pontoon.


    To simplify the game a little, I have invented special house rules. First, the
    computer is the banker and remains so, come what may. This is because the dealing
    is done by computer. Because the Bank will not change hands in the normal way,
    the'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Pontoon


    pack reshuffled whenever the Bank would changed hands.


    Second, "Buying" of cards is not allowed, this is because it is impossible to
    deal a card face down on the screen! Thirdly, "Splitting" is not allowed. This
    is quite straightforward to keep the program size within bounds. I felt it was
    more important to allow one or two players, than to allow splitting, which is
    a rarefied feature of the game. Lastly, "Sticking" on any number is permitted.
    This is because otherwise the game becomes very dull with the computer making
    all the decisions about dealing another card or not. You can if you wish your
    own rules on this point.


    The Bank''s playing strategy is very simple. It will double, if you deal an Ace
    as its first card. This is because it then has a good chance of getting a pontoon,
    with a court or a ten as the next card. When deciding whether to add to its hand,
    the Bank first looks at the state of play: if all the players bust, then it sticks
    on whatever it then holds. After this it will "Stick" if holding a best score
    of 16 or greater. It is possible to break the Bank by winning all the Bank''s
    money, and it has been done, but is surprising how often this simple strategy
    succeeds against more adventurous opponents. The Bank''s resources are not infinite
    to make it fair. The Bank is given the same amount of money as the wealthiest
    of the players.


    The best strategy for winning is in fact to copy the Bank''s example and stick
    on 16. It also pays to watch the pack sequence very carefully, because all returned
    cards are put onto the bottom of the pack. If you have memorised the sequence
    then you can predict the next card to come out. To encourage this practice, the
    deal subroutine prints a message "GOING THROUGH THE PACK AGAIN", when it restarts
    at the top.'
