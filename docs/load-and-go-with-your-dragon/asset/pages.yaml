- pgno: 33
  md: '# Debugging Programs


    happy that the section is working properly.


    There are a couple of final points I would like to make here write your programs
    down on paper you enter them. In this way, it is easier to spot typing mistakes
    when you run the program, since you can check incorrect lines (ones that give
    error reports) against your own copy. Secondly, if you have a printer - USE IT
    Take a fresh listing of your program. You wouldn''t believe how many errors are
    caused by programmers looking at an out-of-date listing.


    Just before we finish, I''ll give a list of the program as it should look after
    all the changes above have been included:-


    ```

    05 CLS

    10 X=RND(31)

    20 FOR Y=0 TO 15

    22 IF Y>0 THEN 40 ELSE PRINT @(Y-1)*32+X," *"""

    30 PRINT @*Y*32+X,"O"

    32 FOR DI=1 TO 50:NEXT DI

    40 NEXT Y

    50 PRINT TAB(X); SPLAT

    ```


    ''The line numbers are a bit untidy, so this is a good point to renumber the program
    before saving it onto tape. Here''s a good Mnemonic for the RENUM command - RENUMber
    NOW.


    +   -N new number that you want the line to become

    -O old number where you want to start

    W width of the interval between numbers


    So the RENUM command becomes:


    > RENUM 10,5,10

    (call the new first line 10

    (start with the old line 05

    (leave a gap of 10 between numbers

    (so that they become 10,20,30 ....'
