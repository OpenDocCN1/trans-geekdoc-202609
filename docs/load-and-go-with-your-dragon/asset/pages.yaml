  md: '# SKI RUN


    If you always wanted to try the slalom runs in the Winter Olympics, here''s your
    big chance. You must guide yourself down the slope avoiding the way. Use the ->
    key for right and the @ key for left. Hold your finger on the key for rapid continuous
    movement. The program contains two courses, which are chosen at random. After
    the program listing you will find instructions on how you can alter the courses
    or enter some new ones of your own.


    ![](img/7a80be36866e3d2c055800fc953633cd_15_0.png)


    ```

    10 REM SKI RUN

    20 GOTO 90

    ```


    ```

    30 REM CHECK FOR MOVEMENT

    40 D=PEEK(65280):IF D=255 THEN RETURN ''no key being pressed

    50 IF D=1&HF THEN S=S+1 ''->KEY

    60 IF D=1&FB THEN S=S-1 ''@KEY

    70 S=ABS(S):IF S>31 THEN S=S-1 ''ensure skier stays on the screen

    80 RETURN

    ```


