- pgno: 51
  md: '# HINTS AND TIPS


    # Cassette Tapes


    The very first problem you will hit is to do with the cassette tape interface.  Despite
    the fact that we have deliberately kept the programs in this book short, once
    you keyed them in you will want to keep them and not re-key them every time. So,
    the first thing to get working is the cassette recorder. Don''t wait to do this
    until you have got a long program to SAVE; then it will be too late. Key in a
    tiny program such as:


    ```

    10 REM THIS IS A VERY LONG REMARK

    20 REM THIS IS ANOTHER LONG REMARK

    30 REM THIS IS THE LAST LONG REMARK

    ```


    Now try saving this by setting the recorder to Record and typing in direct mode:


    ```

    CSAVE "TEST"

    ```


    "TEST" is the file name which will be given to the file. The tape recorder will
    whir away and you should get the message:


    OK


    Now, try reloading the program - rewind the recorder and type:


    ```

    LOAD

    ```


    Notice that the file name need not be specified, and this command will load the
    first program encountered on tape. Whilst the Dragon is searching for the program
    you will see the letter "S" in the top left corner. When it has found some data
    you will see'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Hints and Tips


    "F" in the top left corner and the file name "TEST". This changes from "F" to
    an inverse "F" at roughly one second intervals as the data is read and assuming
    that it loads correctly you get the message: OK


    The message "?IO ERROR" is bad news. It means something has gone wrong. The program
    you had in memory before will have been lost because it is removed when the file
    name is found (when the "S" changes to "F"). The one on tape cannot be loaded
    and you have lost all your work!


    Some reviewers have been driven to despair by this problem, but it can be simply
    overcome. You now see why we suggest a small program for testing purposes, that
    is not too great a labour to rekey and rekey again until you have got it right.


    The first tip is to use a DIN to DIN connector instead of the multiple jack plugs
    supplied. This is because the signal level from the Dragon on Record is about
    1.5 volts - this level is too high for some Automatic Volume Input circuits to
    absorb. When the signal is applied to the Auxiliary Input circuits, which are
    expecting a signal from, say, another tape recorder, it is better to cope.


    The second tip is to play back the tape recording on the speaker before sound
    clean and crisp and at an absolutely deafening volume. If you cannot get the volume
    high enough, you might need a more powerful cassette recorder. Try different volume
    settings, all on the high side. The correct setting is quite critical, a very
    small shift of the controls could make all the difference.


    There can be a problem with the automatic control of the Cassette Motor via the
    Remote cable. We suggest that you disable this control altogether by not putting
    in the jack plug at all. This means that you will have to do all the work in pressing
    the controls for Record or Play or Rewind, but since there is no automatic rewind,
    this is is in fact easier. Most cassette tapes'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Hints and Tips


    have a blank bit at the beginning called the "leader" tape. You cannot record
    on this because it is not magnetic. So, be careful that this bit has gone past
    before attempting to record You can wind it on by hand or you can type:


    ```

    MOTOR ON

    ```


    which will set the motor going and let you pass over the leader tape. If you count
    up ten very slowly this is usually long enough to be sure that the leader tape
    has gone through. Recording will start immediately when the (Enter) key is pressed
    for a CSAVE command to keep to this sequence:


    +   Key the command CSAVE "XXXX" (but dont press (Enter))

    Start the Recorder

    Count slowly to ten (one and two and three and four ...)

    Press (Enter)


    As a final tip, always save programs twice. When you get the OK message quickly
    type CSAVE"XXXX" again, whilst the recorder is still running. This doesn''t take
    long to do and sometimes save your bacon, because if the first copy won''t load,
    the second one nearly always does. Never go for more than half an hour of typing
    without saving the programs out. It also helps to use two tapes alternately, then
    gives you four copies of the program that you could go back to in case of dire
    necessity. Always label tapes as you take them out of the machine


    Randomise


    There is no Randomise function given in the reference card, or in the manual,
    for setting the seed of the random number generator. In fact, if you specify:


    ```

    X=RND(-n)

    ```


    N is a negative number and is then taken as the seed for the random number generator.
    Try this program with and without the'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Hints and Tips


    first line to see the difference.


    ```

    10 X=RND(-2)

    20 FOR Z=1 TO 9: PRINT RND(20);:NEXT

    ```


    Without the first line, the result will be different every time that the program
    is run. When the first line is put in, the results will be the same time that
    you run it.


    This technique is a good idea for testing games. Put in line at the beginning
    to ensure that your random numbers are always the same and you can test it much
    easier - it is also a good way of "stacking the deck" to win by knowing in advance
    what''s going to happen, but you wouldn''t do that, would?


    # Mug-trapping


    This is not the very elegant name usually given for data validation and error
    detection - it''s shorter but not so polite. You will notice that all our programs
    contain after input statements extra commands to make sure that the data is what
    we were expecting e.g:


    ```

    10 INPUT "GO ON - (Y/N)";AS

    ```


    the player must answer YES, NO or N so we check for this follows:


    ```

    20 IF INSTR("YN",LEFT$(A,1))=0 THEN 10

    ```


    The LEFT$ function makes sure that even if YES has been entered, we look only
    at the left hand character so "YES ALRIGHT","YERSS","Y", and "YES" will all be
    reduced to a single "Y". The use of the INSTR function to check for all the possible
    values is also very powerful. It could be used to check for multiple letters e.g:


    ```

    10 IF INSTR("ABC/CDE/FGH/CAR/",A$)=0

    ```'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Hints and Tips


    The use of the oblique strokes in the statement is so that combinations like "CCD"
    don''t give a match when they should not.


    IFTHEN...ELSE


    Beginners are often confused by the use of IF THEN . ELSE. The rule is that all
    commands following an IF statement are only obeyed if the condition is true. For
    example:


    ```

    10 FOR Z=1 TO 10:IF A$(Z) = "THING" THEN 100:NEXT

    ```


    This loop will only be obeyed once if the condition is not true the first time
    and therefore the NEXT command on the same line will be ignored. If the condition
    is false execution always (except for ELSE, resumes at the next line found. So,
    we should recode this as follows:


    ```

    10 FOR Z=1 TO 10:IF A$(Z)="THING" THEN 100

    20 NEXT

    100 REM PROGRAM CONTINUES

    ```


    This will then operate ten times as we imagined.


    Suppose we code as e.g.:


    ```

    10 IF A$=B$ THEN GOSUB 100:GOSUB 200:GOTO 50 ELSE GOSUB 300

    40 REM NEXT COMMAND

    ```


    Notice first that the last command dependent on the IF is GOTO 50 and this is
    not separated by a ":" from the ELSE following. An equivalent piece of code would
    go as follows:


    ```

    10 IF A<>B$ THEN 30

    12 GOSUB 100          ''obeyed if condition is true

    14 GOSUB 200

    16 GOTO 50

    30 GOSUB 300          ''obeyed if condition not true

    40 REM NEXT COMMAND

    ```


    55'
  merge: -1
  img_proc: true
- pgno: 56
  md: "# Hints and Tips\n\nIn other languages, like CORAL, for instance, the control\
    \ of IF\nsequences uses a construct of BEGIN ..... END so that all the\ncommands\
    \ between the two are part and parcel of the same thing.\nIt looks like e.g.:\n\
    \n```\nIF A=B THEN\n    TEST-END (you can also use names instead\n    DISPLAY\
    \ (of subroutine numbers!)\n    GOTO 50\nEND\nELSE BEGIN\n    P300\nEND\n```\n\
    \nThis is much easier to understand, and perhaps one day BASIC will\ninclude such\
    \ a construct.\n\n# Control Keys\n\nStudy carefully the control keys given on\
    \ the reference card:\n\n+   - (shift)/<- means clear the current line (very useful)\n\
    - (shift)/Ø means set reverse case (usually very annoying)\n- (shift)/@ means\
    \ freeze all output to the screen\n\nThe (Shift)/Ø button, so commands can be\
    \ obtained accidentally, when\nreaching for the \":\" button, so be careful commands\
    \ typed\nin reverse case are not recognised and give syntax errors.\n\nThe Pause\
    \ command, (Shift)/Ø, is also very useful, but remember\nrepeating it will not\
    \ cause output to resume. To resume,\nyou need any other character but that.\n\
    \n# PRINT Commands\n\nWhen a print command is obeyed so as to cause a line feed\
    \ to the\nnext line, the whole of the remainder of that line is destroyed\nin\
    \ the process. Try these two programs:"
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Hints and Tips


    ```

    10 PRINT @20,"HELLO";

    20 PRINT @0,"A";   ";" character

    30 PRINT @432,"""

    ```


    ```

    10 PRINT @20,"HELLO";   ''no ";" character

    20 PRINT @0,"A"

    30 PRINT @432,"""

    ```


    With the first one, you see the word A followed by HELLO on the top line. With
    the second one, you see A alone on the top line. This is because the omission
    of the ";" character in line 20 has caused the remainder of the line to be deleted,
    as it spaces forward to the next line position. This can be a very useful trick
    for clearing the first line, but it can also be very puzzling when you didn''t
    want this to happen!


    Try these as well:


    ```

    10 X=5;Y=6;Z=9

    20 PRINT X;Y;Z

    30 PRINT X,Y,Z

    ```


    You get:


    ```

    5 6 9

    5

    9

    ```


    A space is always printed in front of a number as well as behind. If the separator
    of "," is used then you get an automatic tab of sixteen character positions, which
    takes you to the next line for the third number. In practice the ",;" format is
    nearly always what you want.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# VOCABULARY TESTER


    We wanted to include in this book a program which used data files held on cassette
    tape. There are clearly a lot of business applications which require this sort
    of treatment, but we thought that a vocabulary tester would be more generally
    useful to everyone. Some suggestions are given at the end for modifying the general
    structure for other applications.


    The first difficulty is that other languages have characters which are not present
    on the Dragon keyboard. We have designed this example for French but it could
    be adapted for other languages equally well by using different conventions for
    the missing characters. We use the conventions as follows:


    Notice the special character follow the character on which it is supposed to be
    written. This looks a bit strange at first but you can get used to it. Just beware
    of getting too used to it and writing words like in examination papers! The accents
    in the right direction if you look only at the top half of the character. We could
    have used "/" for acute and "\" for grave (this is CHR$(92) which can be displayed
    on the screen but not without input from the keyboard), but this seemed best.


    The idea of the program is that you build up your vocabulary lists on tape. Each
    time you are given a new set of words to learn you put them into the machine.
    When you think you know the new words then you merge in the current tape so that
    the old words are added onto the back. You then have a cumulative tape'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Vocabulary Tester


    that you can use for revision later.


    We have a maximum of 100 words for each tape. This is not a limitation of the
    machine, which could hold up to say 800 words at a time, but perhaps a practical
    limit on the number you would want to revise at one time. You can change this
    limit if you think it is too low. All the statements referring to 100 or 99 should
