    ```


    X has stayed the same, Y has increased by one, as we would expect, and the position
    has increased by 31. We obviously have the wrong multiplier for Y. We have made
    the same mistake again, but the other way this time. Yes, the last column on the
    screen is numbered 31 but there are 32 in all, so line 30 should read:


    ```

    30 PRINT ØY*32+X,"O"

    ```


    Great! It draught this time. Now take out line 32 again and re-test; the stone
    should now drop all the way down the screen without BREAKS. This trick of using
    STOP and CONT is a very powerful way of helping you debug a program. First of
    all, it slows the program down and gives you time to inspect the screen, secondly,
    you can print any of the variables to check if'
