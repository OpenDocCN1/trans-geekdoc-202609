    # 引言


    本书旨在提供趣味且具有教育意义。它包含了适用于 Dragon 32 家用微型的程序，该电脑配备了 Microsoft 16K 彩色 BASIC。大部分程序都很短（约
    50 行），方便输入并运行（RUN）。有些程序很严肃，有些则很滑稽，但我们最希望你能发现它们。书的末尾还有一些较长的程序，运行起来可能更困难，但应该会更有收获。程序的复杂性随长度的平方而增加，而大多数商业程序都超过
    2000 行！


    本书在几个方面都具有教育意义。首先，我们提供了如“算术测试器”和“词汇测试器”等作业工具，这可能会让数百个任务变得更有趣。其次，书的大部分内容致力于全面地解释
    Dragon 的图形功能。对于理解这些非常强大的功能，这可以是你 BASIC 手册的实用补充来源。最后，书中包含了“程序调试”和“提示与技巧”综合章节，这两者都将帮助运行你的程序以及书中的程序。


    如果让任何人认为输入程序并运行它们就是“编程”，那是错误的。事实并非如此。然而，研究示例对于任何开始编程的人来说都是重要的学习工具。很多时候，手册会教单词和语法，而没有就如何将它们连接成故事或诗歌提供任何真正的理解。书中的所有示例都带有详尽的注释和解释，并尽可能鼓励读者修改它们，以观察微小变化如何影响运行。对程序构建原理的良好理解将会在你开始构建自己的程序时提供不可估量的帮助，我们希望你能够这样做。


    “载入即玩”（Load and Go）是一个专业术语，指的是编译器或汇编器，它们不仅处理程序，而且在汇编完成后立即开始执行。标题“载入即玩”是一个专业术语，指的是编译器或汇编器，它们不仅处理程序，而且在汇编完成后立即开始执行。标题“载入即玩”是一个专业术语，指的是编译器或汇编器，它们不仅处理程序，而且在汇编完成后立即开始执行。


