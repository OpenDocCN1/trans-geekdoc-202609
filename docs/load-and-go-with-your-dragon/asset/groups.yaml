    \n# 猎捕姆普斯\n\n姆普斯只有在听到箭发射的声音时才会移动，它会随机移动到与其相连的其中一个洞穴。当你射出一支箭时，它可以进入多五个洞穴。系统会询问你想让它进入几个洞穴，以及你想进入的洞穴编号。如果洞穴之间没有隧道连接，箭可能会随机飞行，并很可能击中你，导致你输。\n\
