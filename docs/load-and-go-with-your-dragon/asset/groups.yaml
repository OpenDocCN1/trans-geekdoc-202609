    # SNAKES AND LADDERS


    A traditional game for two players. The non-traditional twist is that the snakes
    can bite and land you in hospital for three turns and you can also fall off the
    ladder and have to go back to square one for two turns!


    The program draws the board at the top of the screen, using blue and yellow checkered
    squares. Square one is top left and square 100 is bottom left. Numbering goes
    in the traditional sequence, i.e. you go backwards on alternate rows. To follow
    the play properly you do need a colour television set, since the ladders are marked
    in red and the snakes in orange. You have to throw a six to start and you must
    end exactly on 100. If you go over 100 then it will count backwards for the excess.


    It is a difficult program to test since a game takes so long to play - like the
    board game, the play seems to go on for ever. It can be made easier if the INPUT
    statement in line 80 is replaced by a PRINT statement and it will then play without
    human intervention.


    A different board is generated for every game. See lines 100-200 below.


    ```

    10 REM SNAKES AND LADDERS

    20 DIM BD(100)

    30 CLS;PRINT TAB(6);"SNAKES AND LADDERS"

    40 PRINT"YOU MUST START ON A SIX"

    50 PRINT"YOU GET AN EXTRA GO FOR A SIX"

    60 PRINT"YOU MUST END EXACTLY ON 100"

    70 PRINT

    80 INPUT"FIRST PLAYER";PL$(0) ''get player names

    90 INPUT"SECOND PLAYER";PL$(1)

    ```'
