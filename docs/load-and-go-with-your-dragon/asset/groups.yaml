    \ Lady”，\n\n# 趣味问答\n\n[content]\n`INSTR` 函数的工作原理是搜索字符串 A 以查看其长度内包含字符串 B。因此，语句：\n\
    \n| A$ | B$ | W |\n|---|---|--|\n| \"DRAGON\" | \"RAG\" | 2 |\n| \"DRAGON\" |\
    \ \"DRAG\" | 1 |\n| \"DRAGON\" | \"CAT\" | 0 |\n| \"DOWNING\" | \"OWN\" | 2 |\n\
    | \"DOWNING\" | \"IN\" | 5 |\n| \"DOWNING\" | \"DOG\" | 0 |\n\n如果返回 Ø，这意味着 A$\
    \ 不包含 B$。返回的数字是 B$ 在 A 中的起始位置数字。\n\n由于答案的数量是不变的，我们采用了一种约定来告诉电脑已经耗尽了可能的答案。最后一个答案后面跟着一个\
    \ \";\" 字符——这告诉我们下一个数据语句是一个新问题。 \"FINIS\" 告诉我们所有问题都已耗尽。\n\n"
