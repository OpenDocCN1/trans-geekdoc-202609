  md: "\n# Lucky Dip\n\nThe program works by using scaling factors. Suppose we have\
    \ input 25.4 cms; this is first split into \"25.4\" and \"CMS\". This is not square\
    \ measure (see line 230), so we search the array AA$ and stop on element 2 which\
    \ contains \"CM\". Variable M becomes 22 (line 300) and we calculate:\n\n25.4\
    \ * 10/304.8 (element 22) = 0.83 FEET (element AA$(22))\n25.4 * 10/914.4 (element\
    \ 23) = 0.28 Y (element AA$(23))\n\nIf the units contain the letters \"SQ\" then\
    \ the search is confined to the square measure part of the table. The zeros in\
    \ the table are included so that if there is no relevant higher unit, it will\
    \ not be printed, (see line 320).\n\n# Lucky Dip\n\n## Label Printing\n\nIf you\
    \ are lucky enough to have a printer then you can use it to produce labels to\
    \ stick on your notepad. If you don't have one can still work the program and\
    \ look at the output on the screen, but the practical use of this is doubtful!\n\
    \n```\n10 REM TO PRINT LABELS\n20 PR=2      'set this as PR=0 to have screen output\n\
    30 IF PR=2 THEN OPEN\"O\",-PR,\"OP\" 'open the printer file\n40 CLS\n50 LINEINPUT\
    \ \"NAME\"      ;A$(1)\n60 FOR Z=1 TO 4         'get lines of address\n70 PRINT\"\
    LINE \";Z;\n80 LINEINPUT A$(Z+1)\n90 NEXT\n100 INPUT \"HOW MANY LABELS\";N 'number\
    \ of labels\n110 FOR Z=1 TO N        'number off loop\n120 FOR A=1 TO 5      \
    \  'number of lines\n130 PRINT #-PR,AS$(A)    'print a line\n140 NEXT A\n150 FOR\
    \ B=1 TO 3       'space between labels\n                        'alter to suit\n\
    160 PRINT #-PR,\"\"\"\n170 NEXT B\n180 NEXT Z\n190 IF PR=2 THEN CLOSE\n\n```\n\
    \nThe interesting thing about this program is that it can be fooled to divert\
    \ output to the screen or to the printer as you require. See line 130 which if\
    \ PR=2 would read:\n\n130 PRINT #-2,AS$(A)\n\nwhereas if you have reset PR=0 then\
    \ it reads:\n\n130 PRINT #-0,AS$(A)\n\n# Lucky Dip\n\nThis could be a useful trick\
    \ where you have a program which might require screen output and might require\
    \ printer output according to user choice.\n\n## Date Validation\n\nA very common\
    \ problem in programming concerns checking dates for validity against all the\
    \ known calendar rules. We assume, being English, that the sequence will be Day,\
    \ Month, Year but there can still be considerable variation within that e.g.:\n\
    \n```\n28.11.82\n2.11.82\n2.2.82\n2/2/82\n2 2 82\n\n10 REM DATE VALIDATION\n20\
