    # 火车图片


    圆。所以它必须是红色的。现在，如果坐标引用正好落在你刚刚画出的圆所在的点上，那么它在找到红色障碍后就会立即停止。你必须小心坐标引用落在圆的蓝色内部。实现这一点的最好方法是为圆心指定相同的引用。


    ```

    GET (x,y)-(x2,y2),an,G 要保存图片的某特定部分，请使用此命令。它从当前显示屏幕上“获取”由 x,y（左上角）和 x2,y2（右下角）指定的图片部分，并将其存储在数组
    an 中。数组必须预先按照正确的大小定义，以容纳这些数据，屏幕上的每个点对应一个数组元素。数组的维度分别为 x2-x 和 y2-y。如果指定了参数 G，则在
    PUT 中必须指定操作代码（见下文）。

    ```


    ```

    PUT (x,y)-(x2,y2),an,PSET 要执行 GET 的反操作并放回图片部分，请使用 PUT。因为不需要将其放回原来的位置，这是在图片中产生运动的方法，也是火车程序的基础。除了
    PSET 之外还有其他操作代码，但它们相当复杂。如果将图片 PUT 在某个部分会超出屏幕的位置，就会发生奇怪的事情！

    ```


