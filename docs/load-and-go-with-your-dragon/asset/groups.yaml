    at the same place. Go too fast, and you will zoom past, never to be seen again.
    Go too slow, and you will exceed the time limit. Use too much fuel, and you will
    run out and drift for ever.


    First select the time for which you wish your rockets to fire. Enter a negative
    time, e.g. -2, to indicate two seconds of negative thrust, which will decrease
    your speed. If as a result your speed goes negative you will also go backwards
    not forwards!


    You can, if you want, idle for a specified period. To do this, enter the bum as
    zero and then the program will ask for the idle time. If your speed is faster
    than the mothership, then you will continue catching it up. If your speed is slower
    than the mothership, then idling will increase the distance between you.


