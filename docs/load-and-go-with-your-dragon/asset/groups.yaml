    # DEBUGGING PROGRAMS


    So you''ve just finished writing your new masterpiece and you''re holding your
    breath while you type RUN...


    Then...nothing. The program just sits with a blank screen, or an error report
    is given at the foot of the screen. What now? Where do you start to unravel the
    reason why the Dragon has decided not to play ball?


    First and foremost, write down the error message on a scrap of paper. The reason
    for this is that it is too easy to forget the line number that has been printed
    as part of the message.


    If the program just "hangs up", press BREAK to determine whereabouts the program
    has gone wrong. You will get a message "BREAK IN 60", for example, meaning that
    it was on line 60 at the time.


    Also, do not type CLEAR – this removes all the variables in the program, and these
    can be extremely important in helping you to discover errors. Be very careful
    not to use the Editor to change any of the lines you have discovered what you
    need to know. Using the Editor automatically resets all the variables and any
    further investigation after that will be fruitless. Using LIST is alright and
    causes no damage.


    If you''re a newcomer to programming it can sometimes be difficult to understand
    how a program can go wrong. What I am going to do is to give you a small program
    which has some errors in it. You will enter the program, run it, then along with
    this text, we shall (hopefully) find out where the mistakes occur, correct them,
    then try again. In this way, you should pick up the main points in trying to debug
    your own programs.'
  - '[PAGE 29]


    # Debugging Programs


    We want to write a program that drops a stone from the top of the screen to the
    bottom. When it hits the bottom, the Dragon is to print "SPLAT". We want the stone
    to drop in different places each time, so we need a random starting point along
    the top line.


    For the stone we use the letter "O". So here is the first attempt at the program:


    ```

    10 RND(31)

    20 FOR Y=0 TO 32

    30 PRINT @Y*31+XR,"O"

    40 NEXT Y

    50 PRINT "SPLAT"

    ```


    First of all we get ?SN ERROR 10. This means Syntax error, so we have broken the
    rules of grammar. Looking at the card, we can see that RND is a function not a
    command - this means that it can only appear after an "=" command. So the first
    line should be:


    ```

    10 X=RND(31)

    ```


    RUN again.


    Now we get ?SN ERROR 30


    Referring to the reference card again, you can see that the PRINT @ statement
    uses a "," character not a , So use Edit to correct this mistake, and line 30
    becomes:


    ```

    30 PRINT @Y*31+XR,"O"

    ```


    Run again and we get a stream of "O"s running down the screen, diagonally, and
    the result ?FC ERROR IN 30


    FC means an illegal function call, so we have done something wrong. Use PRINT
    to find out the values of Y and XR in direct mode, that is without a line number
    e.g.:'
