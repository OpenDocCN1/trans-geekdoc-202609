    \ 1170\n1150 PRINT \"00\"+HEX$(Z),\n1160 F=F+1\n1170 NEXT X\n1180 PRINT:GOTO 1090\n\
    ```\n\n# Lucky Dip\n\n## GRAPHICS SECTION\n\n### ROLLER DICE\n\nOur family have\
