    \ next card. When deciding whether to add to its hand, the Bank first looks at\
    \ the state of play: if all the players bust, then it sticks on whatever it then\
    \ holds. After this it will \"Stick\" if holding a best score of 16 or greater.\
    \ It is possible to break the Bank by winning all the Bank's money, and it has\
    \ been done, but is surprising how often this simple strategy succeeds against\
    \ more adventurous opponents. The Bank's resources are not infinite to make it\
    \ fair. The Bank is given the same amount of money as the wealthiest of the players.\n\
    \nThe best strategy for winning is in fact to copy the Bank's example and stick\
    \ on 16. It also pays to watch the pack sequence very carefully, because all returned\
    \ cards are put onto the bottom of the pack. If you have memorised the sequence\
    \ then you can predict the next card to come out. To encourage this practice,\
    \ the deal subroutine prints a message \"GOING THROUGH THE PACK AGAIN\", when\
    \ it restarts at the top.\n\n## Pontoon\n\nThe settlement of the bets is quite\
    \ complex. This part of the program is given in the rule processing section (lines\
    \ 700-760). In words rather than program, they can be summarised as follows:\n\
    \n- 1. If the bank holds a natural pontoon, and the player does not, then the\
    \ player pays twice his original stake.\n- 2. If the bank holds a natural pontoon,\
    \ and the player does also, then the player forfeits his original stake.\n- 3.\
    \ If the player has \"bust\" (holds a minimum score of > 21) then his stake is\
    \ forfeit to the bank.\n- 4. If the player holds five cards, and the bank does\
    \ not, then the player receives twice his original stake.\n- 5. If the player\
    \ holds a pontoon, and the bank does as well, then the player receives an amount\
    \ equal to his stake.\n- 6. If the player holds a pontoon, then he receives twice\
    \ his original stake.\n- 7. If the player's best score is greater than the bank's\
    \ best score then he receives an amount equal to his original stake. It will be\
    \ greater automatically, if the Bank has bust.\n- 8. If the player's best score\
    \ is equal to or less than the bank's best score then this stake is forfeit to\
    \ the bank.\n\nThese conditions are evaluated by the use of \"Truth\" variables\
    \ set to -1 if true and to 0 not true. These are so called because the statement\
    \ e.g.:\n\n```\nIF TV THEN PRINT \"TRUE\" ELSE PRINT \"FALSE\"\n```\n\nwill be\
    \ obeyed as it reads if the variable TV has been set as described.\n\n## Pontoon\n\
    \nThe key variables which are evaluated and set by subroutine 1190 are:\n\n| |\
    \ For Player | For Bank |\n|---|---|---|\n| Busted (min score > 21) | BU | BU\
    \ |\n| Holding five cards | C5 | B5 |\n| Holding Pontoon | PT | BP |\n\n## Ordinary\
    \ variables\n\n| | | |\n|---|---|---|\n| Best score | MT | BT |\n| Minimum score\
    \ | HT | HT |\n\nThe variable WR is set to a positive value if the player is paying\
    \ the bank and to a negative value if the bank is paying the player. For example\
    \ WR=-2 means that the bank pays the player twice his original state.\n\nTo add\
    \ a bit of fun, I have included a random remarks generator, to give the computer\
    \ a little more personality. At certain key events, starting a new hand, the bets,\
    \ player going bust, losing a player and end of game, the remarks subroutine is\
    \ entered. 80% of the time it says nothing, but the other 20% it selects a remarks\
    \ from those set up five different ones are provided for each event. You can substitute\
    \ your own remarks, if you wish, and yours needn't be quite polite. Our testers\
    \ developed the theory that whenever the bank says \"I feel lucky today\", it\
    \ loses. Inspection of the program should reveal that this is an unlikely hypothesis,\
    \ but it has yet to be disproved experimentally.\n\n## Pontoon\n\nSince this is\
    \ a complicated program, it may be difficult to get going. Some diagnostic hints\
    \ might help. The pack is contained in array P. To print out the pack, type in\
    \ direct mode:\n\n```\nFOR Z=1 TO 52:PRINT P(Z);:NEXT\n```\n\nAll the numbers\
    \ should be different, and in the range 1-52. Variable P should be between 1 and\
    \ 52 and point to the next card to come out of the pack.\n\nTo look at players'\
    \ hands, type:\n\n```\nFOR Z=1 TO 15:PRINT HD(Z);:NEXT\n```\n\nPlayer one's cards\
    \ are elements 1-5, player two's 6-10, and the Bank's 11-15.\n\nAlso, look at\
    \ array PG which contains for each player the number of cards in his hand:\n\n\
    ```\nFOR Z=1 TO 3:PRINT PG(Z);:NEXT\n```\n\nIf you think that the settling of\
    \ bets is wrong, then press Break and type:\n\n```\nPL=1 OR PL=2:GOSUB 190;PRINT\
    \ BU;C5;HT;MT;\n```\n\nThe first three are truth variables, followed by the lowest\
    \ score, the best score, and the number of aces. Variable WR should be set to\
    \ the result of the hand.\n\n## Pontoon\n\n10 REM PONTOON UNIT\n20 CLEAR 1000;DIM\
    \ A$(25);GOSUB 640 'set up\n'P() is pack;HS() is alpha equivalent of suit\n'HD()\
    \ is alpha equivalent of hand\n'HS() is values of cards held\n'HD() is number\
    \ of cards in hand\n'PG() is number of cards each\n30 DIM P(52),HS(15),HD(15),PG(3)\n\
    40 CLS;PRINT TAB(5);\"PONTOON\";PRINT 'house rules\n50 PRINT \"HOUSE RULES\";\n\
    60 PRINT \"(1) I AM THE BANKER\"\n70 PRINT \"(2) NO SPLITS ALLOWED\"\n80 PRINT\
    \ \"(3) NO BUYING OF CARDS\"\n90 PRINT \"(4) YOU MAY STICK ON ANY NUMBER\"\n100\
    \ INPUT \"WHAT ARE THE STAKES?\";M 'get maximum bets\n110 INPUT \"FOR MANY PLAYERS(BESIDES\
    \ ME)?\";H 'no of players\n120 IF H<1 OR H>2 THEN GOTO 10\n130 FOR Z=1 TO H\n\
    140 PRINT \"PLAYER\",Z;INPUT \"NAME\";PL(Z)\n150 INPUT \"HOW MUCH MONEY DO YOU\
    \ HAVE?\";M(Z)\n160 IF M(Z)<1 OR M(Z)>999 THEN PRINT \"I DON'T BELIEVE YOU\";GOSUB\
    \ 150\n170 NEXT Z \n180 IF M(1)>M(2) THEN M(3)=M(1) ELSE M(3)=M(2)\n190 PRINT\
    \ \"I HAVE\";M(3)\n200 GOSUB 900 'SHUFFLE PACK\n210 REM MAIN ENTRY 'look at state\
    \ of money for each player\n220 GOSUB 1330 'WHO IS STILL IN 'reshuffle the pack\
    \ if\n230 IF ABS(WR)=2 THEN GOSUB 900 'pontoon or five card hand\nreset the variable\
    \ arrays\n240 CLS;FOR Z=1 TO 15:HS(Z)=\n290 PRINT PL$(1);TAB(16);PL$(2) 'print\
    \ names at top\n300 PRINT\n310 R=1:GOSUB 1580 'remarks for starting a hand\n320\
    \ FOR Y=1 TO H 'deal a card to each player and gets from each\n330 PL=Y:TB=15*(Y-1):GOSUB\
    \ 1020:GOSUB 1160:GOSUB 1100\n340 PRINT TAB(TB);:INPUT\"YOUR BEST\":B(Y)\n350\
    \ IF B(Y)>M(Y) THEN PRINT TAB(TB);\"NO! YOU!\n600 NEXT Z\n'look to see if anyone\
    \ still in\n610 FOR Y=1 TO 10 H:PL=Y:GOSUB 190:IF NOT BU THEN 630\n620 NEXT Y:PRINT\"\
    STICK\":GOTO 680\n'evaluate bank hand and decide to stick/twist\n630 GOSUB 1540:IF\
    \ BU THEN BEN=5:BT=0:PRINT\"I BUSTED\":GOTO 680\n640 IF MT+5 THEN PRINT\"STICK\"\
    :GOTO 680\n650 PRINT \"TWIST \"\n660 GOSUB 1020:GOSUB 1100:1160\n670 GOTO 630\n\
    \n680 REM SETTLE UP BETS\n690 FOR Y=1 TO H:PL=Y:GOSUB 190 'rules processor see\
    \ text\n700 IF NOT PT AND BP THEN WR=2:GOTO 770\n710 IF PT AND BP THEN WR=1:GOTO\
    \ 770\n720 IF BU THEN PRINT 770\n730 IF C5 AND NOT B5 THEN WR=2:GOTO 770\n740\
    \ IF C5 THEN NOT B THEN WR=1:GOTO 770\n750 IF PT THEN WR=2:GOTO 770\n760 IF MT>BT\
    \ THEN WR=1-ELSE WR=1\n\n770 REM THE PAYOUT\n780 PRINT;PL$(Y);':';HT;MT; 'name,lowest\
    \ score, best score\n790 IF BU THEN PRINT \" BUSTED \"\n800 IF C5 PRINT \" 5 CARDS\
    \ \"\n810 IF PT PRINT \" PONTOON\"\n'WR positive means players pays bank\n'WR\
    \ negative means bank pays players\n\n820 IF WR=0 THEN PRINT PL$(Y);\\ PAYS ME;\n\
    ELSE PRINT \" I PAY\":PL$(Y);\n830 IF ABS(WR)>1 THEN PRINT\" TWICE\"; ELSE PRINT\
    \ \" ONCE\"\n840 PRINT ABS(WR)*B(Y)\n850 M(3)=H+WR*B(Y) 'adjust bank money\n860\
    \ M(Y)=M(Y)+WR*B(Y)-1 'adjust player money\n870 NEXT Y:BP=0\n880 INPUT\"PRESS\
    \ ENTER TO GO ON\";A$\n890 GOTO 210\n"
  mdcn: "\n\n## 21点王 (Pontoon)\n\n每当银行（Bank）易手时，牌组都会重新洗牌。\n\n其次，不允许“买”牌，这是因为在屏幕上无法分发面朝下的牌牌！第三，不允许“分牌”（Splitting）。这对于将程序尺寸控制在范围内非常直接。我觉得允许一或两名玩家比允许分牌更重要，因为分牌是该游戏一项罕见的功能。最后，允许在任何数字上“停牌”（Sticking）。这是因为否则，由电脑决定是否再发另一张牌，游戏将变得非常无味。如果你愿意，可以在这一点上制定自己的规则。\n\
    \n银行的玩法策略非常简单。如果它的第一张牌是 Ace，它会倍注。因为这样它有很大机会在下一张牌是花牌或十点时获得皇家（pontoon）。在决定是否向手牌中加牌时，银行首先查看游戏状态：如果所有玩家都爆牌（bust），则它根据持有的任何数字停牌。之后，如果最高分为\
    \ 16 分或以上，它将“停牌”。赢得银行所有的钱可以导致银行破产（break the Bank），这种情况确实发生过，但这种简单的策略面对更具冒险精神的对手时如此成功令人惊讶。为了公平，银行的资源并非无限。银行获得的资金与最富有玩家相同。\n\
    \n获胜的最佳策略实际上是模仿银行，在 16 分时停牌。仔细观察牌组序列也有好处处，因为所有返回的牌都会放在牌组的底部。如果你记住了序列，就可以预测下一张发出的牌。为了鼓励这种做法，发牌子程序在从顶部重新开始时会打印消息“再次遍历完整个牌组”。\n\
    \n## 21点王 (Pontoon)\n\n赌注的结算相当复杂。程序的这部分位于规则处理章节（第 700-760 行）。用文字而非程序，可以总结如下：\n\
    \n- 1. 如果银行持有天然皇家（natural pontoon），而玩家没有，则玩家支付其原始赌注的两倍。\n- 2. 如果银行持有天然皇家，而玩家也有，则玩家没收原始赌注。\n\
    - 3. 如果玩家“爆牌”（持有最低分数 > 21），则其赌注没收归银行。\n- 4. 如果玩家持有五张牌，而银行没有，则玩家获得其原始赌注的两倍。\n-\
    \ 5. 如果玩家持有皇家，而银行也有，则玩家获得等同于赌注的金额。\n- 6. 如果玩家持有皇家，他获得其原始赌注的两倍。\n- 7. 如果玩家的最高分大于银行的最高分，则他获得等同于原始赌注的金额。如果银行爆牌，金额会自动更高。\n\
    - 8. 如果玩家的最高分等于或小于银行的最高分，则该赌注没收归银行。\n\n这些条件通过使用“真”（Truth）变量进行评估，为真则设为 -1，为假则设为\
    \ 0。之所以这样命名是因为语句例如：\n\n```\nIF TV THEN PRINT \"TRUE\" ELSE PRINT \"FALSE\"\n```\n\
    \n如果变量 TV 已如所述设置，将按照其逻辑执行。\n\n## 21点王 (Pontoon)\n\n由子程序 1190 评估并设置的关键变量是：\n\n\
    | | 针对玩家 | 针对银行 |\n|---|---|---|\n| 爆牌 (最低分数 > 21) | BU | BU |\n| 持有五张牌 | C5 |\
    \ B5 |\n| 持有皇家 | PT | BP |\n\n## 普通变量\n\n| | | |\n|---|---|---|\n| 最高分 | MT |\
    \ BT |\n| 最低分 | HT | HT |\n\n如果玩家向银行支付，变量 WR 设为正值；如果银行支付玩家，则设为负值。例如，WR=-2 表示银行支付玩家其原始赌注的两倍。\n\
    \n为了增加趣味性，我包含了一个随机备注生成器，给电脑增加一点个性。在某些关键事件中（开始新回合、下注、玩家爆牌、玩家输掉和游戏结束），会进入备注子程序。80%\
    \ 的时间它什么都不说，但在另外 20% 的时间内，它会从每个事件提供的五种不同备注中选择一条。如果你愿意，可以替换自己的备注，而且不必完全礼貌。我们的测试人员得出的理论是：每当银行说“我今天运气不错”时，它就会输。检查程序应该发现这是一个不太可能的假设，但尚未在实验中被证伪。\n\
    \n## 21点王 (Pontoon)\n\n由于这是一个复杂的程序，可能很难上手。一些诊断提示可能会帮助。牌组包含在数组 P 中。要打印牌组，在直接模式下输入：\n\
    \n```\nFOR Z=1 TO 52:PRINT P(Z);:NEXT\n```\n\n所有数字应该是不同的，并且在 1-52 范围内。变量 P 应该在\
    \ 1 到 52 之间，并指向牌组中下一张出的牌。\n\n要查看玩家的手牌，输入：\n\n```\nFOR Z=1 TO 15:PRINT HD(Z);:NEXT\n\
    ```\n\n玩家一的牌是元素 1-5，玩家二是 6-10，银行是 11-15。\n\n此外，查看数组 PG，它包含每个玩家手中的牌数：\n\n```\n\
    FOR Z=1 TO 3:PRINT PG(Z);:NEXT\n```\n\n如果你认为结算错误，按 Break 并输入：\n\n```\nPL=1 OR\
    \ PL=2:GOSUB BU;HT;MT\n```\n\n前三个是真变量，后面是最低分、最高分和 Ace 的数量。变量 WR 应该是回合的结果。\n\n\
    ## 21点王 (Pontoon)\n\n10 REM 21点王单位\n20 CLEAR 1000;DIM$(25);GOSUB 640 '设置\nP()\
    \ 是牌组;HS() 是花色等效值\n'HD() 是手牌等效值\n'HS() 是持有的牌值\n'HD() 是手牌牌数\n'PG() 是每个人的牌数\n30\
    \ DIM P(52),HS(15),HD(15),PG(3)\n40 CLS;PRINT TAB(5);\"ONTOON\";'规则\n50 PRINT\
    \ \"RULES\";\n60 PRINT \"(1) 我是银行\"\n70 PRINT \"(2) 不分牌\"\n80 PRINT \"(3) 不买牌\"\
    \n90 PRINT \"(4) 你可以在任何数字上停牌\"\n100 INPUT \"赌注是多少?\";M '获取赌注\n110 INPUT \"除我之外有多少玩家?\"\
    ;H '人数\n120 IF H<1 OR H>2 THEN GOTO 10\n130 FOR Z=1 TO H\n140 PRINT \"PLAYER\"\
    ,Z;INPUT \"NAME\";PL(Z)\n150 INPUT \"你有多少钱?\";M(Z)\n160 IF M(Z)<1 OR M(Z)>999\
    \ THEN PRINT \"我不信\";GOSUB 150\n170 NEXT Z \n180 IF M(1)>M(2) THEN M(3)=M(1) ELSE\
    \ M(3)=M(2)\n190 PRINT \"我有\";M(3)\n200 GOSUB 900 '洗牌\n210 REM 主入口'查看每个玩家的资金状况\n\
    220 GOSUB 1330 '谁还在玩'如果洗牌牌\n230 IF ABS(WR)=2 THEN GOSUB 900 '皇家或五张牌\n重置数组\n240\
    \ CLS;FOR Z=1 TO 15:HS(Z)=\n290 PRINT PL$(1);TAB(16);PL$(2) '顶部打印名字\n300 PRINT\n\
    310 R=1:GOSUB 580 '开始回合的备注\n320 FOR Y=1 TO H '给每个玩家发牌并从每个人处取\n330 PL=Y:TB=15*(Y-1):GOSUB\
    \ 1020:GOSUB 160:GOSUB 1100\n340 PRINT TAB(TB);:INPUT\"最高分\":B(Y)\n350 IF B(Y)>M(Y)\
    \ THEN PRINT TAB(TB);\"不！你!\"\n600 NEXT Z\n'查看是否还在\n610 FOR Y=1 TO 10 H:PL=Y:GOSUB\
    \ 190:IF NOT BU THEN 630\n620 NEXT Y:PRINT\"停牌\":GOTO 680\n'评估银行牌并决定停牌/加牌\n630\
    \ GOSUB 1540:IF BU THEN BEN=5:BT=0:PRINT\"我爆牌了\":GOTO 680\n640 IF MT+5 THEN PRINT\"\
    停牌\":GOTO 680\n650 PRINT \"加牌 \"\n660 GOSUB 1020:GOSUB 1100:1160\n670 GOTO 630\n\
    \n680 REM 结算赌注\n690 FOR Y=1 TO H:PL=Y:GOSUB 190 '规则处理器文本\n700 IF NOT PT AND BP\
    \ THEN WR=2:GOTO 770\n710 IF PT AND BP THEN WR=1:GOTO 770\n720 IF BU THEN PRINT\
    \ 770\n730 IF C5 AND NOT B5 THEN WR=2:GOTO 770\n740 IF C5 THEN NOT B THEN WR=1:GOTO\
    \ 770\n750 IF PT THEN WR=2:GOTO 770\n760 IF MT>BT THEN WR=1-ELSE WR=1\n\n770 REM\
    \ 赔付\n780 PRINT;PL$(Y);':';HT;MT; '名字，最低分，最高分\n790 IF BU THEN PRINT \"爆牌了 \"\n\
    800 IF C5 PRINT \"五张牌 \"\n810 IF PT PRINT \"皇家\"\n'WR 正表示玩家付给银行\n'WR 负表示银行付给玩家\n\
    \n820 IF WR=0 THEN PRINT PL$(Y);\\ 付给我;\nELSE PRINT \" 我付给你\":PL$(Y);\n830 IF\
    \ ABS(WR)>1 THEN PRINT\"两次\"; ELSE PRINT \"一次\"\n840 PRINT ABS(WR)*B(Y)\n850 M(3)=H+WR*B(Y)\
    \ '调整银行资金\n860 M(Y)=M(Y)+WR*B(Y)-1 '调整玩家资金\n870 NEXT Y:BP=0\n880 INPUT \"按回车继续\"\
    ;A$\n890 GOTO 210\n\n"
