    # 苍蝇与糖蜜


    我们现在进入高级图形模式，从最高分辨率（点数最多）开始。为此，我们使用模式 4，它有两种方便于利用的简单颜色组合：黑色和绿色（Set 0）以及黑色和米色（Set
    1）。在这些颜色中，我们使用的是黑色和绿色，因此颜色 0 是黑色，颜色 1 是绿色。在这种模式下，每个点只存储一个位位的颜色信息（0 或 1）。这种模式需要四页内存。


    程序非常简单：一只苍蝇在糖蜜池上方的森林里飞来飞去。苍蝇随机移动，以苍蝇特有的那种哀哀又烦人的方式发出“嗡，嗡”的声。最终，它降落在了糖蜜上并被粘住了。此时，它无法再移动，并开始发出无助的“哔，哔”声感到懊恼。这是它自找的！这是一个愚蠢的程序，但它说明了关于图形的一些要点。


    首先，我们必须理解一些特殊高分辨率模式命令的作用。


    - PCLEAR n 清除 n 页图形内存，用于存储要显示的数据。这不会清除图形区域；也不会显示该区域；它会导致字符串变量被擦除，因为图形空间看起来被分配在字符串空间之上（出于这个原因，请始终将
    PCLEAR 命令放在程序的开头）。


    - PMODE n,p 设置模式或分辨率，这决定了放入图形区域的信息将如何被记录。N 设置模式，p 设置要写入的下一页。在这种模式下涉及四页，但 p 是第一页的编号，由此推
    PMODE 4,1 定义了包含 1 到 4 在的所有页面。此命令不会清除区域或使其显示。


    - PCLS c 此命令将区域初始化为指定的颜色。依此类推，它对 PMODE 命令指定的所有页面有效。也就是说，如果设置了 PMODE 4,1，那么该命令将重置包含
    1 到 4 在的所有页面。


    - COLOR c1,c2 前景颜色设置为 c1。背景颜色设置为 c2。这些术语与图形方框周围的边框无关——它们指的是墨水（INK）和纸张（PAPER）（借用他处的术语）。LINE
    命令将前景颜色视为前景色，PSET 命令也是如此；PRESET 命令恢复到背景色。你可用的颜色范围始终小于该范围内的颜色——稍加思考你就知道为什么；在绿纸上写绿字对于隐形写作很好，但对其他任何事情都没用。如果你有超过两种颜色可用，那么前景或背景就不需要与
    RESET 设置的初始值相同。


    - SCREEN 1,n 这是导致从文本模式（0）切换到高级图形模式（1）的有效命令。当前颜色集由 n 定义。在这一层级，这只能是 0 或 1，我们正在使用
    0。要显示的页面取自命令执行时 PMODE 的当前设置。如果随后更改了 PMODE 页面，不会导致屏幕上的图像发生变化。任何随后的屏幕命令将导致新设置显示。这意味着你可以在另一个页面上工作，同时显示另一个完全不同的页面。执行
    END 语句会导致自动回到模式 0（文本），因此在进行程序开发时，最好包含一个语句，例如 `LOOP`。这会在你检查图片时产生一个无限循环。要返回，请使用
    Break 键。如果通过 SCREEN 命令将颜色集更改为初始写入时的不同设置，颜色将自动变化，在新含义下被重新解释。我们稍后将使用这个效果来制作一个闪烁的标志牌，颜色交替显示。


    剩余的命令我们将在程序通过示例介绍。屏幕宽 256 个元素，高 192 个元素。左上角为 0,0，右下角为 255,191。屏幕上有绿色背景，底部有一个黑色矩形代表糖蜜。这里标记为
    ''TREACLE'' 以防有人疑问。这是一只苍蝇的放大图。


    翅膀向上 ![](img/7a80be3686e3d2c055800fc95363cd_.png)


    翅膀向下


    ```

    10 REM 苍蝇程序

    20 PCLEAR 4 为模式 4 留 4 页内存

    30 PMODE 4,1 设置定义并设置 1-4 页用于写入

    40 PCLS 1 将 1-4 页初始化为绿色

    50 COLOR 0,1 将墨水设置为黑色，纸张设置为绿色

    60 LINE (0,160)-(255,160) 在屏幕底部画一个黑色矩形（左上角为 0,160；右下角为 255,191）意味着画一个矩形而不是线条并用前景颜色（黑色）填充

    70 AS=BM100,172;C1;R4;L2;D8;B4;U8;U4;D4;B2;R4;14;U8;B4;D4;B10;I4;B4;R2;D2;R4;B6;14;B4
    在底部糖蜜区域用绿色绘制单词 TREACLE

    80 DRAW AS

    90 COLOR 0,1 因为 DRAW 命令重置墨水和前景颜色

    100 X=10+RND(35):Y=7+RND(140) 起始位置确保在屏幕上

    110 D=0:GOSUB 220 “绘制”

    120 GOSUB 320 扇动翅膀

    130 SOUND 255,1:SOUND 255,1 发出“嗡，嗡”

    140 D=1:GOSUB 220 “取消绘制”

    150 DX=9-RND(18):DY=7-RND(18) DX 和 DY 是苍蝇移动到新位置的间隔，注意 DY 有正偏置确保它到达地面

    160 X=X+DX:IF X<10 THEN X=120 确保它还在

    170 IF X>245 THEN X=245

    180 Y=Y+DY:IF Y>154 THEN Y=420 如果 Y>154 则苍蝇被粘住了，它可以伸脚趾但不能了！

    190 IF Y<7 THEN Y=7

    200 SCREEN 1,0 关键显示

    210 GOTO 110

    220 REM 绘制/取消苍蝇在 x,y 处的画头部

    230 CIRCLE(X,Y),3,D 半径 3，颜色 D。如果 D=0（黑色）在绿色背景上绘制；如果 D=1（绿色）在绿色背景上取消绘制设置单个点作为头部

    绘制/取消如上

    ```

    240 PSET (X,Y-3,D)

    250 COLOR D,1-D

    260 LINE (X-2,Y+3)-(X-2,Y+6),PSET

    270 LINE (X+2,Y+3)-(X+2,Y+6),PSET

    280 RETURN

    320 REM 翅膀上/下

    330 LINE (X-4,Y-1)-(X+10,Y-6),PSET

    340 LINE (X+4,Y-1)-(X+10,Y-6),PSET

    350 LINE (X-4,Y-1)-(X+10,Y+6),PSET

    360 LINE (X+4,Y-1)-(X+10,Y+6),PSET

    370 LINE (X-4,Y-1)-(X+10,Y-6),PSET

    380 LINE (X+4,Y-1)-(X+10,Y-6),PSET

    390 LINE (X-4,Y-1)-(X+10,Y+6),PSET

    400 LINE (X+4,Y-1)-(X+10,Y-6),PSET

    410 RETURN

    420 A$="BM100,172;C1;D0:B4:R8:U8:D4:I4:B4:R10;L4;

    U8;R4;B4;D4;B4;R10;L4;U8;R6;B08;R4;L4;

    430 DRAW A$

    440 COLOR 0,1

    450 SOUND 255,4:SOUND 200,4

    460 D$=GOSUB 220:GOSUB 320

    470 GOTO 450```


    首先是新命令：


    - PCOPY nl TO n2 此命令对单页图形内存进行直接复制。它只复制单页。因此对于每个屏幕两页的模式 1 图形，需要执行两个独立的命令。复制不会影响正在显示的屏幕（除非目标正是被复制的屏幕）。


    - PAINT (x,y),c2,c2 在操作中此命令可能很棘手。在概念上它是简单的——就像在给定点洒了一桶颜色 cl 的漆，它会扩散直到遇到障碍，即障碍是定义的颜色
    c2 的色点。由此推导出 x,y 坐标必须位于你尝试绘制的区域内。如果你在障碍之外洒漆，它会填充整个屏幕，这至少可以说是令人困扰的。假设你在蓝色背景（颜色
    3）上画了一个红色（颜色 4）的圆，并且你正试图将其涂成红色。显然，障碍颜色不能是蓝色，否则绘制过程会在遇到蓝色内部时立即停止。


