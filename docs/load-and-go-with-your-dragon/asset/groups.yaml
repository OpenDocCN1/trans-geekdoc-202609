    SEARCH KEY\";A$\n1010 FOR Z=1 TO N 'N=no of stored records\n1020 IF INSTR(A,A)<0\
    \ THEN PRINT A(N)\n1030 NEXT Z\n```\n\n# ENIGMA VARIATIONS\n\nProbably the Enigma\
    \ coding machine used by the German Army during the Second War was responsible\
    \ for the development of the electronic computer. The story of the work done at\
    \ Bletchley Park has been told many times (see for instance \"Most Secret War\"\
    \ by R.V. Jones - Hodder and Stoughton-Coronet Books). Much is still shrouded\
    \ in mystery but without doubt Alan Turing was pre-eminently responsible for the\
    \ design of the \"Bombe\" which the first computer was called.\n\n![](img/7a80be3686e3d2c055800fc95363cd_66_0.png)\n\
    \nFor those who have never seen them it is difficult to imagine the sheer bulk\
    \ of the early computers. I once attended a sherry party held inside the ACE computer\
    \ at the National Physical Laboratory. Also, so the story goes, a group of important\
    \ overseas visitors were being shown round the DEUCE computer. The salesman confidently\
    \ strode to the chamber which was used as the dynamic RAM for the machine and\
    \ threw open the door. Inside, the astonished visitors found an engineer eating\
    \ sandwiches in peace and quiet, or so he thought, sitting on the loudspeaker\
    \ enclosures inside the chamber. All of which is a sneaky introduction to the\
    \ following encoding program, which imitates the action of an Enigma machine and\
    \ produces a secret code that is extremely difficult to crack unless you have\
    \ an IBM 3031 machine with a few days spare time. The program relies upon the\
    \ tip we have described earlier for setting the seed of the random number generator.\
    \ Random numbers produced from a given seed are not truly random but repeat a\
    \ predetermined sequence every time. So, there are three parts to\n\n# Enigma\
    \ Variations\n\nThe first is the secret number used to unlock the key today. This\
    \ can be anything up to 9 digits in length. The second is the order of the letters\
    \ in the coding string. We have chosen to put the letters as \"ABC....\" followed\
    \ by the numbers and special characters, but you could have them in any order\
    \ that you have agreed with your control. This allows you to have 4! permutations\
    \ for your code (a monstrous number). Finally the decipherment is carried out\
    \ by adding a random number to obtain the substitute letter to be used. This means\
    \ that \"AAA\" for example would not be encoded as the same letter every time\
    \ - counting the letter frequency will not help in cracking the code.\n\n```\n\
    20 INPUT \"KEY\";A:IF A<0 THEN 20\n30 A=A:X=RND(A)\n40 INPUT \"ENCODE/DECODE\"\
    ;A$\n50 IF A=\"\" THEN END 'null means quit\n60 A$=LEF(A,1)\n70 IF A=\"D\" THEN\
