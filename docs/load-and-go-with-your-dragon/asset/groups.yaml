  - '[PAGE 18]


    # Ski Run


    # Characters


    1-2 Starting position of left hand post. The right hand post position is calculated
    from the degree of skill entered. The width of course is G which can take a maximum
    value of 9 for the amateur. So, course start position should not be greater than
    21.


    3-4 Starting position of skier - this would normally be the post starting position
    plus two. To be very annoying you could start the skier outside the posts altogether.
    Maximum value is width of screen (31).


    5-6 The rest of the string is a series of two digit numeric values which represent
    the values to be added to the current post position. Do not use values greater
    than 02 or -2 as the player cannot move the skier more than two positions in each
    turn.


    A small valid course description would be:


    ```

    C$="15 17 00 00 01 01 -1 -2 -2 00 00"

    ```


    The spaces are just put in to make it easier to read. It says the starting position
    of the left post is 15, the skier position is 17. For the first two turns the
    course runs straight, then it bends to the right for two turns and to the left
    for two turns, then more sharply to the left. The last two turns are straight.


    The program will automatically show a finish line and the number of hits made.
    Since the speed of the game is approximately three turns per second, an ideal
    course should take about 30 seconds to run fully. The maximum length that you
    can construct is dictated by the maximum string length of 255. This means that
    the maximum number of turns is 254/2 (because the number must be even) less 2
    i.e. 125 turns.


    Some people have difficulty entering the very long strings for the course correctly.
    If you miss out one number in say the'
