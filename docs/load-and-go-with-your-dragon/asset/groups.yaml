    \ so that you can answer either \"YES\" or \"Y\" and it will have the same effect.\
    \ The command \"RUN\" executed within a program doesn't cause it to try to eat\
    \ its tail - it simply causes all variables to be reset as if you had typed \"\
    RUN\" at the keyboard. Try adding a handicapping facility so that the final score\
    \ depends on both the speed, the number of turns and the number of shots (such\
    \ as 5 times the speed + number of turns + number of shots) to encourage people\
    \ to try the higher speeds.\n\n# DIGITAL CLOCK\n\nA digital clock that plays Westminster\
    \ Chimes - now there's a novelty! It uses the timer inside the Dragon to get the\
    \ ticks and displays the hours, minutes and seconds, using the 24 hour clock notation.\
    \ If you have set the chiming mechanism, except between the hours of 10 pm and\
    \ 7 am it will chime the hours for you. Naturally it only chimes on the twelve\
    \ hour clock because 23 bongs would be rather tiresome.\n\n![](img/7a80be36866e3d2c055800fc953633cd_39_0.png)\n\
    \nThe main problem with this program is in tuning or regulating it. The timer\
    \ could vary slightly from machine to machine and in any case doesn't give precise\
    \ second ticks. One is added into the timer count about every 22.43 milliseconds,\
    \ which makes for a difficult conversion into seconds. A basic tick is set at\
    \ 44 strokes of the timer, but further regulation is required by adjusting the\
    \ variable TL - this has been set for our machine at 1.013 which keeps good time\
    \ to within 1 or 2 seconds per hour. Bear in mind that your machine could be slightly\
    \ different and might require further regulation.\n\nThe display of the time should\
    \ look like this:\n\n***********\nHH : MM : SS\n***********\n\n# Digital Clock\n\
