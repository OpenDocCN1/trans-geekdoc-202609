    # NIM


    The origins of the game Nim are obscure, but it is believed to have come from
    the Orient some time in the way distant past. It is played with matchsticks or
    stones, which are divided into three piles. Each player in turn takes any number
    but from only one pile at a time. The object of the game is to ensure that you
    take the last match and not your opponent.


    The theory of the game is based on binary numbers. Consider the case of one left
    in each of two piles - clearly if your opponent takes one then you can take the
    other and win. So 1,1,0 is a winning situation. Arguing from this you can see
    that 5,5,0 is also a winning situation, because however many he takes, you take
    the same number; and this follows for any number i.e. n,n,0.


    When a third pile is introduced you have a problem, but if you strive for a balanced
    situation by making sure that all the binary bits of the sum add up to 2 or to
    Ø you will always win. Take for example a situation of 3,2,1. In binary this is
    expressed as:


    | Pile | Number | Binary |

    |---|---|---|

    | 1 | 3 | 1 1 |

    | 2 | 2 | 1 Ø |

    | 3 | 1 | Ø 1 |

    | | Sum | 2 2 |


    44'
