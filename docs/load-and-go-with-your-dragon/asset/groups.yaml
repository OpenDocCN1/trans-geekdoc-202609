    # Pontoon


    pack reshuffled whenever the Bank would changed hands.


    Second, "Buying" of cards is not allowed, this is because it is impossible to
    deal a card face down on the screen! Thirdly, "Splitting" is not allowed. This
    is quite straightforward to keep the program size within bounds. I felt it was
    more important to allow one or two players, than to allow splitting, which is
    a rarefied feature of the game. Lastly, "Sticking" on any number is permitted.
    This is because otherwise the game becomes very dull with the computer making
    all the decisions about dealing another card or not. You can if you wish your
    own rules on this point.


    The Bank''s playing strategy is very simple. It will double, if you deal an Ace
    as its first card. This is because it then has a good chance of getting a pontoon,
    with a court or a ten as the next card. When deciding whether to add to its hand,
    the Bank first looks at the state of play: if all the players bust, then it sticks
    on whatever it then holds. After this it will "Stick" if holding a best score
    of 16 or greater. It is possible to break the Bank by winning all the Bank''s
    money, and it has been done, but is surprising how often this simple strategy
    succeeds against more adventurous opponents. The Bank''s resources are not infinite
    to make it fair. The Bank is given the same amount of money as the wealthiest
    of the players.


    The best strategy for winning is in fact to copy the Bank''s example and stick
    on 16. It also pays to watch the pack sequence very carefully, because all returned
    cards are put onto the bottom of the pack. If you have memorised the sequence
    then you can predict the next card to come out. To encourage this practice, the
    deal subroutine prints a message "GOING THROUGH THE PACK AGAIN", when it restarts
    at the top.'
  - '[PAGE 118]


    # Pontoon


    The settlement of the bets is quite complex. This part of the program is given
    in the rule processing section (lines 700-760). In words rather than program,
    they can be summarised as follows:


    +   1. If the bank holds a natural pontoon, and the player does not, then the
    player pays twice his original stake.

    2. If the bank holds a natural pontoon, and the player does also, then the player
    forfeits his original stake.

    3. If the player has "bust" (holds a minimum score of > 21) then his stake is
    forfeit to the bank.

    4. If the player holds five cards, and the bank does not, then the player receives
    twice his original stake.

    5. If the player holds a pontoon, and the bank does as well, then the player receives
    an amount equal to his stake.

    6. If the player holds a pontoon, then he receives twice his original stake.

    7. If the player''s best score is greater than the bank''s best score then he
    receives an amount equal to his original stake. It will be greater automatically,
    if the Bank has bust.

    8. If the player''s best score is equal to or less than the bank''s best score
    then this stake is forfeit to the bank.


    These conditions are evaluated by the use of "Truth" variables set to -1 if true
    and to Ø not true. These are so called because the statement e.g.:


    ```

    IF TV THEN PRINT "TRUE" ELSE PRINT "FALSE"

    ```


    will be obeyed as it reads if the variable TV has been set as described.'
  - '[PAGE 119]


    # Pontoon


    The key variables which are evaluated and set by subroutine 1190 are:


    | | For Player | For Bank |

    |---|---|---||

    | Busted (min score >21 ) | BU | BU |

    | Holding five cards | C5 | B5 |

    | Holding Pontoon | PT | BP |


    # Ordinary variables


    | | | |

    |---|---|-|

    | Best score | MT | BT |

    | Minimum score | HT | HT |


    The variable WR is set to a positive value if the player is paying the bank and
    to a negative value if the bank is paying the player. For example WR=-2 means
    that the bank pays the player twice his original state.


    To add a bit of fun, I have included a random remarks generator, to give the computer
    a little more personality. At certain key events, starting a new hand, the bets,
    player going bust, losing a player and end of game, the remarks subroutine is
    entered. 80% of the time it says nothing, but the other 20% it selects a remarks
    from those set up five different ones are provided for each event. You can substitute
    your own remarks, if you wish, and yours needn''t be quite polite. Our testers
    developed the theory that whenever the bank says "I feel lucky today", it loses.
    Inspection of the program should reveal that this is an unlikely hypothesis, but
    it has yet to be disproved experimentally.'
  - '[PAGE 120]


    # Pontoon


    Since this is a complicated program, it may be difficult to get going. Some diagnostic
    hints might help. The pack is contained in array P. To print out the pack, type
    in direct mode:


    ```

    FOR Z=1 TO 52:PRINT P(Z);:NEXT

    ```


    All the numbers should be different, and in the range 1-52. Variable P should
    be between 1 and 52 and point to the next card to come out of the pack.


    To look at players'' hands, type:


    ```

    FOR Z=1 TO 15:PRINT HD(Z);:NEXT

    ```


    Player one''s cards are elements 1-5, player two''s 6-10, and the Bank''s 11-15.


    Also, look at array PG which contains for each player the number of cards in his
    hand:


    ```

    FOR Z=1 TO 3:PRINT PG(Z);:NEXT

    ```


    If you think that the settling up of bets is wrong, then press Break and type:


    ```

    PL=1 (or PL=2):GOSUB 1190;PRINT BU;C5;PI;HT;MT;AT;

    ```


    The first three are the truth variables, followed by the lowest score, the best
    score, and the number of aces. Variable WR should be set to the result of the
    hand.'
