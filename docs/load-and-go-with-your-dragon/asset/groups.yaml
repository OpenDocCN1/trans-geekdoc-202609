    \ puzzling when you didn't want this to happen!\n\nTry these as well:\n\n```\n\
    10 X=5;Y=6;Z=9\n20 PRINT X;Y;Z\n30 PRINT X,Y,Z\n```\n\nYou get:\n\n```\n5 6 9\n\
    5\n9\n```\n\nA space is always printed in front of a number as well as behind.\
    \ If the separator of \",\" is used then you get an automatic tab of sixteen character\
    \ positions, which takes you to the next line for the third number. In practice\
    \ the \",;\" format is nearly always what you want.\n\n# VOCABULARY TESTER\n\n\
    We wanted to include in this book a program which used data files held on cassette\
    \ tape. There are clearly a lot of business applications which require this sort\
    \ of treatment, but we thought that a vocabulary tester would be more generally\
    \ useful to everyone. Some suggestions are given at the end for modifying the\
    \ general structure for other applications.\n\nThe first difficulty is that other\
    \ languages have characters which are not present on the Dragon keyboard. We have\
    \ designed this example for French but it could be adapted for other languages\
    \ equally well by using different conventions for the missing characters. We use\
    \ the conventions as follows:\n\nNotice the special character follow the character\
    \ on which it is supposed to be written. This looks a bit strange at first but\
    \ you can get used to it. Just beware of getting too used to it and writing words\
    \ like in examination papers! The accents in the right direction if you look only\
    \ at the top half of the character. We could have used \"/\" for acute and \"\\\
    \" for grave (this is CHR$(92) which can be displayed on the screen but not without\
    \ input from the keyboard), but this seemed best.\n\nThe idea of the program is\
    \ that you build up the words. When you test yourself you can either have the\
    \ machine ask for the English or for the French. Take either option four or five,\
    \ as the appropriate. Here is a sample dialogue:\n\n```\nENGLISH BREAK\nFRENCH\
    \ CASSER\nENGLISH WHAT A SURPRISE\nFRENCH QUEL SURPRISE (got one wrong)\nThe ANSWER\
    \ IS QUELLE SURPRISE\nENGLISH TERRACE\nFRENCH LA TERASSE\nENGLISH SOMETIMES\n\
    FRENCH (Enter) (had enough, so quit)\nSCORE 2 OUT OF 3\nOK ? (Enter)\n```\n\n\
    and it returns to the Menu screen.\n\nYour answers above are underlined. The testing\
    \ part works by generating a random number within the range of items stored in\
    \ memory and giving you one half of the stored string according to which way you\
    \ are running the test. If you have a small number of items stored, then it might\
    \ ask the same thing twice running, because the same random number comes up again\
    \ - if this becomes annoying, then add some more words to the list.\n\nNow we\
    \ can merge on the rest of the data tape stored from previous occasions. To do\
    \ this option one. If there are any words in store, this will ask:\n\n```\nADD\
    \ TO EXISTING DATA ? Y\nDATA TAPE READY ? (Enter)\n```\n\nReading will start when\
    \ (Enter) is pressed after \"Data Tape Ready\". If you have said \"N\" for No\
    \ then the existing words are\n"
  mdcn: "\n# 提示与技巧\n\n在语句中使用斜杠（oblique strokes）是为了防止像 \"CCD\" 这样的组合在不应该匹配时产生匹配。\n\n\
    ## IFTHEN...ELSE\n\n初学者经常对 IF THEN ELSE 的用法感到困惑。规则是：IF 之后的所有命令只有在条件为真时才会执行。例如：\n\
    \n```\n10 FOR Z=1 TO 10:IF A$(Z) = \"THING\" THEN 100:NEXT\n```\n\n如果条件第一次不为真，则该循环只执行一次，因此同一行的\
    \ NEXT 命令将被忽略。如果条件为假，执行将始终（除 ELSE 外外）从找到的下一行继续。因此，我们应该如下将代码重写为：\n\n```\n10 FOR\
    \ Z=1 TO 10:IF A$(Z)=\"THING\" THEN 100\n20 NEXT\n100 REM PROGRAM CONTINUES\n\
    ```\n\n这样它就会像我们想象的那样运行十次。\n\n假设我们这样编写代码：\n\n```\n10 IF A$=B$ THEN GOSUB 100:GOSUB\
    \ 200:GOTO 50 ELSE GOSUB 300\n40 REM NEXT COMMAND\n```\n\n首先注意，最后一个依赖于 IF 的命令是\
    \ GOTO 50，它没有与后面的 ELSE 用冒号 隔开。等效的代码如下：\n\n```\n10 IF A<>B$ THEN 30\n12 GOSUB 100\
    \          '条件为真时执行\n14 GOSUB 200\n16 GOTO 50\n30 GOSUB 300          '条件不为真时执行\n\
    40 REM NEXT COMMAND\n```\n\n# 提示与技巧\n\n在其他语言中（例如 CORAL），IF 序列的控制使用 BEGIN .....\
    \ END 结构，使得这两个结构之间的所有命令都是同一个整体的一部分。它看起来像这样：\n\n```\nIF A=B THEN\n    TEST-END\
    \ (你也可以使用名称代替\n    DISPLAY (显示子程序编号!)\n    GOTO 50\nEND\nELSE BEGIN\n    P300\n\
    END\n```\n\n这更容易理解得多，也许某一天 BASIC 也会包含这样的结构。\n\n# 控制键\n\n请仔细研究参考卡上提供的控制键：\n\n-\
    \ + (shift)/<- 表示清除当前行（非常有用）\n- (shift)/Ø 表示设置大小写反（通常非常烦人）\n- (shift)/@ 表示冻结屏幕上的所有输出\n\
    \n由于 (Shift)/Ø 按钮可能会在触碰 \":\" 按钮时意外按到，所以要小心，大小写反转的命令不会被识别并会产生语法错误。\n\n暂停命令 (Shift)/Ø\
    \ 也非常有用，但请记住重复它不会导致输出恢复。要恢复输出，你需要输入任何该键以外的字符。\n\n# PRINT 命令\n\n当执行打印命令（PRINT）并导致换行到下一行时，该行的剩余部分在过程中会被销毁。尝试以下两个程序：\n\
    \n# 提示与技巧\n\n```\n10 PRINT @20,\"HELLO\";\n20 PRINT @0,\"A\";   \";\"字符\n30 PRINT\
    \ @432,\"\"\"\n```\n\n```\n10 PRINT @20,\"HELLO\";   '没有 \";\" 字符\n20 PRINT @0,\"\
    A\"\n30 PRINT @432,\"\"\"\n```\n\n在第一个程序中，你会在第一行看到 A 后面跟着 HELLO。在第二个程序中，你会在第一行只看到\
    \ A。这是因为第 20 行省略了 \";\" 字符，导致该行的剩余部分被删除，因为它向前移动到了下一行位置。这可能是清除第一行的非常实用的技巧，但当你不希望这种情况发生时，它也会让你非常困惑！\n\
    \n也尝试这些：\n\n```\n10 X=5;Y=6;Z=9\n20 PRINT X;Y;Z\n30 PRINT X,Y,Z\n```\n\n你得到：\n\
    \n```\n5 6 9\n5\n9\n```\n\n数字的前后始终会打印一个空格。如果使用分隔符 \",\"，你将获得十六个个位置的自动制表（tab），这将带你进入第三个数字所在的行。在实践中，\"\
    ,;\" 格式几乎总是你需要的。\n\n# 词汇测试器\n\n我们想在书中包含一个使用磁带上存储的数据文件的程序。显然，有很多业务应用需要这种处理，但我们认为词汇测试器对每个人来说更具通用性。结尾提供了一些修改通用结构以适应其他应用程序的建议。\n\
    \n第一个困难是，其他语言具有 Dragon 键盘上不存在的字符。我们为法语设计了这个示例，但通过对缺失字符使用不同的约定，也可以很好地适用于其他语言。我们使用以下约定：\n\
    \n注意特殊字符跟在它应该被写的字符后面。这初看起来看起来有点奇怪，但你可以习惯的。只要注意不要太习惯而像在考卷上那样写单词！如果你只看字符的上半部分，重音的方向是正确的。我们本可以使用\
    \ \"/\" 表示锐音符号（acute），用 \"\\\" 表示重抑音符号（grave）（这是 CHR$(92)，它可以在屏幕上显示，但在没有键盘输入的情况下无法显示），但这似乎是最好的。\n\
    \n该程序的意图是构建单词。当你进行自我测试时，可以让机器询问英语或法语。根据情况选择选项四或选项五。这里有一个示例对话：\n\n```\nENGLISH\
    \ BREAK\nFRENCH CASSER\nENGLISH WHAT A SURPRISE\nFRENCH QUEL SURPRISE (错了一个)\n\
    The ANSWER IS QUELLE SURPRISE\nENGLISH TERRACE\nFRENCH LA TERASSE\nENGLISH SOMETIMES\n\
    FRENCH (Enter) (够了，所以退出)\nSCORE 2 OUT OF 3\nOK ? (Enter)\n```\n\n然后它返回菜单屏幕。\n\n\
    你上面的答案带有下划线。测试部分的工作原理是在内存中存储的项范围内生成一个随机数，并根据你运行测试的方式提供存储字符串的一半。如果你存储的项很少，那么它在运行时可能会询问同一个问题，因为相同的随机数再次出现——如果这让你很烦恼，请向列表中添加更多单词。\n\
    \n现在我们可以合并之前存储在数据带上的剩余数据。执行此操作选择选项一。如果存储中有任何单词，它将询问：\n\n```\nADD TO EXISTING DATA\
    \ ? Y\nDATA TAPE READY ? (Enter)\n```\n\n在按下 \"Data Tape Ready\" 后按下 (Enter) 即可开始读取。如果你回答\
    \ \"N\"（为否），那么现有的单词是\n"
