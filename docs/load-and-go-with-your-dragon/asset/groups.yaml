    \ like e.g.:\n\n```\nIF A=B THEN\n    TEST-END (you can also use names instead\n\
    \    DISPLAY (of subroutine numbers!)\n    GOTO 50\nEND\nELSE BEGIN\n    P300\n\
    END\n```\n\nThis is much easier to understand, and perhaps one day BASIC will\n\
    include such a construct.\n\n# Control Keys\n\nStudy carefully the control keys\
    \ given on the reference card:\n\n+   - (shift)/<- means clear the current line\
    \ (very useful)\n- (shift)/Ø means set reverse case (usually very annoying)\n\
    - (shift)/@ means freeze all output to the screen\n\nThe (Shift)/Ø button, so\
    \ commands can be obtained accidentally, when\nreaching for the \":\" button,\
    \ so be careful commands typed\nin reverse case are not recognised and give syntax\
    \ errors.\n\nThe Pause command, (Shift)/Ø, is also very useful, but remember\n\
    repeating it will not cause output to resume. To resume,\nyou need any other character\
