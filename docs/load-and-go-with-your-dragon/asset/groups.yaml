    \ of the screen. If you guess at the whole word, then the letter table is not\
    \ updated - your guess is either right, in which case, you win, or wrong, in which\
    \ case you lose a life. You have 10 lives. As these are lost a picture of a hanging\
    \ man is gradually built up on the screen.\n\n![](img/7a80be36866e3d2c055800fc953633cd_22_0.png)\n\
    \n```\nDIM A$(26)\n110 REM CHANGE WORDS BELOW FOR NEW GAME\n    'first data element\
