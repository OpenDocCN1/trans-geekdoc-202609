    \ so on. It makes the computer look pretty stupid if the correct answer is, say\
    \ \"Surrey\" and if it marks \"County of Surrey\", which is of course equally,\
    \ as wrong.\n\nWe resolve the problem by searching for the answer for the key\
    \ word, or words that tell you the answer is correct. For the question above,\
    \ the key word that must be there is \"Thatcher\". Depending on your politics,\
    \ you might also allow \"Margaret\" or \"Iron Lady\",\n\n# Silly Quiz\n\nThe INSTR\
    \ function works by searching string A to see if it contains within its length\
    \ string B. So, the statement:\n\nW=INSTR(A$,B$)\n\nwould return results as follows,\
    \ depending on the state of A$ and B$.\n\n| A$ | B$ | W |\n|---|---|--|\n| \"\
    DRAGON\" | \"RAG\" | 2 |\n| \"DRAGON\" | \"DRAG\" | 1 |\n| \"DRAGON\" | \"CAT\"\
    \ | 0 |\n| \"DOWNING\" | \"OWN\" | 2 |\n| \"DOWNING\" | \"IN\" | 5 |\n| \"DOWNING\"\
    \ | \"DOG\" | 0 |\n\nIf Ø is returned, this means that A$ does not contain B$.\
    \ A number returned is the number of the starting position of B$ within A.\n\n\
    Because the number of answers is variable, we adopt a convention to tell the computer\
    \ when we have exhausted all the possible answers. The last answer is followed\
    \ by a \";\" character - this tells us that the next data statement is a new question.\
    \ The word \"FINIS\" tells us that all the questions have been exhausted.\n"
