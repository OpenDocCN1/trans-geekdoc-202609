    # VOCABULARY TESTER


    We wanted to include in this book a program which used data files held on cassette
    tape. There are clearly a lot of business applications which require this sort
    of treatment, but we thought that a vocabulary tester would be more generally
    useful to everyone. Some suggestions are given at the end for modifying the general
    structure for other applications.


    The first difficulty is that other languages have characters which are not present
    on the Dragon keyboard. We have designed this example for French but it could
    be adapted for other languages equally well by using different conventions for
    the missing characters. We use the conventions as follows:


    Notice the special character follow the character on which it is supposed to be
    written. This looks a bit strange at first but you can get used to it. Just beware
    of getting too used to it and writing words like in examination papers! The accents
    in the right direction if you look only at the top half of the character. We could
    have used "/" for acute and "\" for grave (this is CHR$(92) which can be displayed
    on the screen but not without input from the keyboard), but this seemed best.


    The idea of the program is that you build up your vocabulary lists on tape. Each
    time you are given a new set of words to learn you put them into the machine.
    When you think you know the new words then you merge in the current tape so that
    the old words are added onto the back. You then have a cumulative tape'
  - '[PAGE 59]


    # Vocabulary Tester


    that you can use for revision later.


    We have a maximum of 100 words for each tape. This is not a limitation of the
    machine, which could hold up to say 800 words at a time, but perhaps a practical
    limit on the number you would want to revise at one time. You can change this
    limit if you think it is too low. All the statements referring to 100 or 99 should
    be changed e.g. lines 40, 140 and so on.


    When the program is run, the Menu screen appears, which looks like this:


    # VOCABULARY


    ```

    1=READ DATA TAPE

    2=WRITE DATA TAPE

    3=ADD TO CURRENT LIST

    4=TEST ENGLISH/FRENCH

    5=TEST FRENCH/ENGLISH

    6=REVIEW/CHANGE DATA

    ```


    # CHOICE?


    To begin with, you won''t have any data tapes to read in so we need option three
    to "Add to current list". Key "3" and press (Enter).


    ADD NEW WORDS                SPACE FOR 100


    ```

    CEDILIA IS ,

    GRAVE >

    ACUTE IS <nCIRCUMFLEX ^

    ENGLISH WORD ? PIG

    NOW FRENCH EQUIVALENT

    ENDER FIRST THEN WORD

    E.G.1E CARC,ON

    ```


    LE COCHON'
  - '[PAGE 60]


    # Vocabulary Tester


    The parts underlined in the example above are what you enter in response to the
    questions. When you have entered all the words, press (Enter) with no data, when
    asked for the English word, and you will return to the Menu screen. As you enter
    new words, the "SPACE FOR" field will be updated to show the remaining space,
    i.e. it becomes 99, then 98 and so on.


    Next, you will want to learn the words and check that they are entered correctly
    so take option 6 to review or change the data. You see:


    ```

    PIG/LE COCHON

    Q=QUIT;Y=CHANGE ?

    ```


    Press (Enter) to go on to the next word. When you have been through them all,
    you will return to the Menu screen again. If you type "Q" or "QUIT" then you will
    return to the Menu screen. If you type "Y" or "YES" you will be asked:


    ```

    NEW VALUE ? you enter the new English and French in the format displayed above
    e.g. PIG/LE COCHON

    ```


    This facility for amending the data is relatively crude, since you have to go
    right through all the words to get to the one you wish to change. If, however,
    make a practice of checking and learning all the new words as you put them in
    and before you add them to the stored data, then this will be quite adequate.


    Next we write out the data tape. For this option 2. If you have the remote stop/start
    tape enabled (see hints and tips), then make sure that your tape is positioned
    after the leader tape and that play and record keys are down. The program will
    ask:


    DATA TAPE READY ?


    As soon as you press (Enter) the writing of the data tape will start. You will
    hear the relay inside clicking as different blocks of data are written onto the
    tape. When it returns to the'
  - '[PAGE 61]


    # Vocabulary Tester


    Menu screen, the operation is finished and you can rewind and remove the data
    tape. Don''t forget to label it, and also to put on the number of words that it
    now contains.


    To test yourself you can either have the machine ask for the English or for the
    French. Take either option four or five, as the appropriate. Here is a sample
    dialogue:


    ```

    ENGLISH BREAK

    FRENCH CASSER

    ENGLISH WHAT A SURPRISE

    FRENCH QUEL SURPRISE (got one wrong)

    The ANSWER IS QUELLE SURPRISE

    ENGLISH TERRACE

    FRENCH LA TERRASSE

    ENGLISH SOMETIMES

    FRENCH (Enter) (had enough, so quit)

    SCORE 2 OUT OF 3

    OK ? (Enter)

    ```


    and it returns to the Menu screen.


    Your answers above are underlined. The testing part works by generating a random
    number within the range of items stored in memory and giving you one half of the
    stored string according to which way you are running the test. If you have a small
    number of items stored, then it might ask the same thing twice running, because
    the same random number comes up again - if this becomes annoying, then add some
    more words to the list.


    Now we can merge on the rest of the data tape stored from previous occasions.
    To do this option one. If there are any words in store, this will ask:


    ```

    ADD TO EXISTING DATA ? Y

    DATA TAPE READY ? (Enter)

    ```


    Reading will start when (Enter) is pressed after "Data Tape Ready". If you have
    said "N" for No then the existing words are'
