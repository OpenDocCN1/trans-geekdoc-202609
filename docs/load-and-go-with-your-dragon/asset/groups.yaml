    # SIGN WRITING


    From time to time, there is a need to print text on high resolution screens. The
    fly program had two examples of this, where we wanted to print a word on the picture.
    To save re-inventing every time, here is a standard subroutine for writing anything
    like. It produces an alphabetical string for each letter, so the result should
    always be preceded by commands to move to the desired position, set the colour
    and set the scale. The basic characters are designed as 16 points down and 8 points
    across, with a separation between letters of four points. So, if scale was 8,
    this would double the basic units (4 is the reference level - you can draw to
    a smaller scale or a larger scale) and these would become 32 units down, 16 units
    across, and 8 units separation. Each character is assumed to start at its bottom
    left, and the string finishes at the bottom right, ready for the next letter to
    be added. Here is an example of plotting for letter A: ![](img/7a80be36866e3d2c055800fc953633cd_96_0.png)


    The example program, shown below, uses this subroutine to draw an illuminated
    sign of a person''s name. Ideally the name should be about 6 characters long,
    and can have a space after it to make the thing look prettier. The name is then
    plotted down in different scales. The actual scales used in DATA statement, so
    you can change it if you want all big letters, or small letters, for example.
    colours are each plotted in turn. So sequence goes yellow, blue against green
    background and then repeats. At the end, the whole screen is displayed in alternative
    set, which are Green, Purple, Cyan against Buff background; these colours alternate
    at about second intervals.


    all drawn:

    240 SCREEN 1, 0 ''first colour set

    250 FOR DI=1 TO 100:NEXT DL ''wait''

    260 SCREEN 1,1 ''second colour set

    270 FOR DL=1 TO 100:NEXT DL ''wait''

    280 GOTO 240 ''repeat the initial string arrays

    290 REM UP Z$(2)

    300 DIM Z$(26)

    310 Z$(0)="B2;R20;" ''space

