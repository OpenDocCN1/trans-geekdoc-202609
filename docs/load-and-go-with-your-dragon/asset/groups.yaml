    # CASTLE WALLS


    The Normans have arrived!

    Standing on top of the parapet,

    You can look down and see the ladders starting to rise up the walls - but what
    can you do?


    BOILING OIL you think, and immediately start to pour the oil down onto the invaders.

    Sometimes you miss, sometimes you hear the sounds as the victims writhe in agony.


    It is inevitable that they''ll get in sooner or later, it''s just a question of
    how long you can keep them out. Oil is in plentiful supply, but once your cask
    empties (watch the dipstick at the right of the screen) that''s all they need
    to rush in, whilst you pour helplessly to and fro. You pour the oil by using the
    "v" key, wait until the man on the parapets is over the top of the ladder before
    pressing it.


    Initially you can select the level of difficulty - the more difficult, the more
    ladders start coming but the better the score for each victim. Once the ladders
    reach the top your score is shown.


