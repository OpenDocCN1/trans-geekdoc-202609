    \ the statement is so that combinations like \"CCD\" don't give a match when they\
    \ should not.\n\n## IFTHEN...ELSE\n\nBeginners are often confused by the use of\
    \ IF THEN . ELSE. The rule is that all commands following an IF statement are\
    \ only obeyed if the condition is true. For example:\n\n```\n10 FOR Z=1 TO 10:IF\
    \ A$(Z) = \"THING\" THEN 100:NEXT\n```\n\nThis loop will only be obeyed once if\
    \ the condition is not true the first time and therefore the NEXT command on the\
    \ same line will be ignored. If the condition is false execution always (except\
    \ for ELSE, resumes at the next line found. So, we should recode this as follows:\n\
    \n```\n10 FOR Z=1 TO 10:IF A$(Z)=\"THING\" THEN 100\n20 NEXT\n100 REM PROGRAM\
    \ CONTINUES\n```\n\nThis will then operate ten times as we imagined.\n\nSuppose\
    \ we code as e.g.:\n\n```\n10 IF A$=B$ THEN GOSUB 100:GOSUB 200:GOTO 50 ELSE GOSUB\
    \ 300\n40 REM NEXT COMMAND\n```\n\nNotice first that the last command dependent\
    \ on the IF is GOTO 50 and this is not separated by a \":\" from the ELSE following.\
    \ An equivalent piece of code would go as follows:\n\n```\n10 IF A<>B$ THEN 30\n\
    12 GOSUB 100          'obeyed if condition is true\n14 GOSUB 200\n16 GOTO 50\n\
