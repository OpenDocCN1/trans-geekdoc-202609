    # SILLY QUIZ


    Ever fancied yourself as a budding Nicholas Parsons? This quiz program looks after
    all the chores, like keeping score and deciding whether the answer is on the card.
    This has always been a popular favourite, because you can invent your own questions
    and make up your own version.


    We include it because it is a striking example of the power of the INSTR function
    in Microsoft BASIC. In other languages this function always has to be simulated;
    here it is part of the BASIC command set. Suppose that the question was "Who is
    the British Prime Minister?". Now, the possible answers could be:


    +   - Margaret Thatcher

    - Maggie Thatcher

    - Mrs. M. Thatcher

    - Mrs. Margaret Thatcher

    - Mrs. Thatcher

    - ''Thatcher

    - Thatcher, I think??

    - The Iron lady

    - Wedgewood Benn (of all these - this is the only wrong one!)


    You can see from this that people not used to computers can put in all sorts of
    extraneous data like commas, full stops, "I think", and so on. It makes the computer
    look pretty stupid if the correct answer is, say "Surrey" and if it marks "County
    of Surrey", which is of course equally correct, as wrong.


    We resolve the problem by searching for the answer for the key word, or words
    that tell you the answer is correct. For the question above, the key word that
    must be there is "Thatcher". Depending on your politics, you might also allow
    "Margaret" or "Iron Lady",'
  - '[PAGE 26]


    # Silly Quiz


    so these are alternative answers.


    The INSTR function works by searching string A to see if it contains within its
    length string B. So, the statement:


    W=INSTR(A$,B$)


    would return results as follows, depending on the state of A$ and B$.


    | A$ | B$ | W |

    |---|---|--|

    | "DRAGON" | "RAG" | 2 |

    | "DRAGON" | "DRAG" | 1 |

    | "DRAGON" | "CAT" | 0 |

    | "DOWNING" | "OWN" | 2 |

    | "DOWNING" | "IN" | 5 |

    | "DOWNING" | "DOG" | 0 |


    If Ø is returned, this means that A$ does not contain B$. A number returned is
    the number of the starting position of B$ within A$.


    Because the number of answers is variable, we adopt a convention to tell the computer
    when we have exhausted all the possible answers. The last answer is followed by
    a ";" character - this tells us that the next data statement is a new question.
    The word "FINIS" tells us that all the questions have been exhausted.'
