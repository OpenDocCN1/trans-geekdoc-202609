  mdcn: "\n\n# 幸运抽奖\n\n该程序通过使用缩放因子工作。假设我们的输入是 25.4 cms；它首先被分为 \"25.4\" 和 \"CMS\"。这并不是面积单位（见第\
    \ 230 行），因此我们搜索数组 AA$ 并在包含 \"CM\" 的元素 2 处停止。变量 M 变为 22（第 300 行），然后我们进行如下计算：\n\n\
    25.4 * 10/304.8 (元素 22) = 0.83 FEET (元素 AA$(22))\n25.4 * 10/914.4 (元素 23) = 0.28\
    \ Y (元素 AA$(23))\n\n如果单位包含字母 \"SQ\"，则搜索将限制在表格的面积部分。表格中的零被包含在内，是为了如果没有相关的更高级单位，它将不会被打印（见第\
    \ 320 行）。\n\n# 幸运抽奖\n\n## 标签打印\n\n如果你足够幸运有一台打印机，就可以用它来制作标签，贴在你的笔记本上。如果没有打印机，仍然可以运行该程序并查看屏幕上的输出，但这种做法的用途存疑！\n\
    \n```\n10 REM TO PRINT LABELS\n20 PR=2      '将此设为 PR=0 以获得屏幕输出\n30 IF PR=2 THEN\
    \ OPEN\"O\",-PR,\"OP\" '打开打印机文件\n40 CLS\n50 LINEINPUT \"NAME\"      ;A$(1)\n60\
    \ FOR Z=1 TO 4         '获取地址行\n70 PRINT\"LINE \";Z;\n80 LINEINPUT A$(Z+1)\n90\
    \ NEXT\n100 INPUT \"HOW MANY LABELS\";N '标签数量\n110 FOR Z=1 TO N        '循环次数\n\
    120 FOR A=1 TO 5        '行数\n130 PRINT #-PR,AS$(A)    '打印一行\n140 NEXT A\n150 FOR\
    \ B=1 TO 3       '标签之间的间隔\n                        '根据需要修改\n160 PRINT #-PR,\"\"\
    \"\n170 NEXT B\n180 NEXT Z\n190 IF PR=2 THEN CLOSE\n\n```\n\n这个程序有趣的地方在于，它可以根据你的要求被欺骗并将输出重定向屏幕或打印机。查看第\
    \ 130 行，如果 PR=2，它将读取：\n\n130 PRINT #-2,AS$(A)\n\n而如果你将 PR 重置为 0，则读取为：\n\n130 PRINT\
    \ #-0,AS$(A)\n\n# 幸运抽奖\n\n当你有一个程序可能根据用户选择需要屏幕输出或打印机输出时，这是一个实用的技巧。\n\n## 日期验证\n\
    \n编程中一个非常常见的问题是根据所有已知的日历规则检查日期的有效性。我们假设（基于英语）顺序为“日、月、年”，但在内部仍会有很大的变化，例如：\n\n```\n\
    28.11.82\n2.11.82\n2.2.82\n2/2/82\n2 2 82\n\n10 REM DATE VALIDATION\n20 INPUT\
    \ \"DATE\":A '获取可能包含逗号的日期\n30 N=W-1 TO LEN(A) '\n40 FOR Z=1 TO LEN(A) '检查找到的每个字符\n\
    50 T=ASC(MID$(A,Z,1)) 等待找到非数字字符\n60 IF T<48 OR T>57 THEN D(N)=VAL(MID$(A,W,Z)):N=N+1:W=Z+1\n\
    70 NEXT Z:D(2)=VAL(MID$(A,W)) '最后一个是年份\n30 days September, April, June, and November\n\
    80 DATA 31, 28, 31, 30, 31, 30, 31, 30, 31\n90 IF D(2)<1 OR D(2)>12 THEN PRINT\
    \ \"MONTH ERROR\":GOTO 20\n100 RESTORE\n110 FOR Z=1 TO D(2):READ L:NEXT'检查闰年\n\
    120 IF D(2)=2 AND INT(D(3)/4=D(3) THEN L=29\n130 IF D(1)<1 OR D(1)>L THEN PRINT\
    \ \"DAY ERROR\":GOTO 20\n140 IF D(3)<1 THEN PRINT \"YEAR ERROR\":GOTO 20\n'正确打印\n\
    150 FOR Z=1 TO L:PRINT \";D(Z);\n160 GOTO 20\n```\n\n# 幸运抽奖\n\n## 内存显示\n\n这是一个实用的例程，用于查看解释器中的内容。有效命令列表从地址\
    \ 8033（十六进制）或 32819（十进制）开始。首先列出命令——唯一意外的是 DLOAD 命令指的是磁盘加载。\n\n```\n1000 CLS\n\
    1010 PRINT \"LIST MEMORY\"\n1020 PRINT \"USE SHIFT TO PAUSE\"\n1030 PRINT \"USE\
    \ SPACE TO RESUME\"\n1040 PRINT \"BREAK TO STOP\"\n1050 INPUT \"ENTER MEMORY START\
    \ (DEC)\";F\n1060 IF PEEK(F)=0 THEN GOTO 1070\n1080 PRINT \"00\"+HEX$(F);\"\n\
    1090 FOR X=1 TO 8\n1100 IF PEEK(F+Z) THEN\n1120 IF Z>=32 AND Z<127 THEN PRINT\
    \ CHR$(Z);ELSE PRINT \".\"\n1140 GOTO 1070\n1150 PRINT \"00\"+HEX$(Z),\n1160 F=F+1\n\
    1170 NEXT X\n1180 PRINT:GOTO 1090\n```\n\n# 幸运抽奖\n\n## 图形区域\n\n### 骰子\n\n我们已知在某些情况下会作弊以避免“公园路”。由于某种偶然，骰子在滚动！使用计算机模拟骰子并解决问题![](img/7a80be368e3d2c0558fc953cd83)\n\
    \n虽然这个例子很容易理解，但它为 Dragon 图形的详细说明提供了起点。后续章节也处理相同的主题并形成了 Dragon 提供的功能的详细指南。手册对整个主题的处理方式相当困惑，希望几个示例可以消除疑虑。\n\
    \n首先要意识到，低级图形和高级图形是完全不同的东西。它们处理不同的内存区域并有不同的命令。与低级图形相关的命令只有：\n\n- CLS 设置指定的颜色 (c)。\n\
    - SET (x,y,c) 根据坐标（横跨屏幕）和 y（垂直屏幕）将字符点设置为颜色 c。屏幕左上角是 0,0，右下角是 63,31。这与 PRINT @\
    \ 使用的编号系统不同，与高分辨率图形不同——非常困惑。\n- RESET (x,y) 将字符点设置为背景颜色。x 和 y 的定义相同。\n- POINT\
    \ (x,y) 如果点关闭返回 0，如果点包含文本返回 -1，如果已设置则返回颜色。\n- SCREEN (0,n) 用于从图形重置低分辨率屏幕的命令。理论上，它应该为上述命令设置背景颜色，但在实践中效果有限。\n\
    \n这些命令产生的一些效果并不是你预期的。例如，考虑以下小程序：\n\n```\n10 CIS '清除屏幕为绿色\n20 SET(20,20,5) '将点设置为颜色\n\
    30 RESET(10,10) '将点重置为背景色\n40 CL=32: PRINT @383,CHR(134+CL) '打印棋格图案\n'蓝色字符\n```\n\
    \n按现状运行，会有一些意想不到的效果。首先，SET 命令将整个方格设置为颜色，而不仅仅是一个点。其次，RESET 将点重置为黑色，而不是可能预期的绿色。第三，字符的背景被设置为黑色，而原本可能预期是绿色。\n\
    \n尝试将第 10 行改为 CIS。这次，SET 命令按照要求只设置了单个方格，但将方格的其余部分变成了黑色！这次 RESET 命令将整个方格重置为黑色，而不仅仅是点。CHR$\
    \ 函数产生了相同的效果。\n\n也尝试添加：\n\n15 SCREEN 0,0\n\n或者：\n\n15 SCREEN 0,1\n\n你会认为这些会产生某种影响，但并没有。如果你将屏幕清除为黑色，这些限制都可以避免。所以，最后我们来看这个示例：\n\
    \n```\n10 REM DICE\n20 CLS:CL=5\n30 FOR P=11 TO 38\n40 TT=RND(6)\n50 GOSUB 110\
    \ '绘制方框\n60 GOSUB 210 '绘制点数\n70 NEXT P\n80 PRINT @480,\"\"\"\"\n90 INPUT AS\n\
    100 GOTO 20\n```\n\n# 幸运抽奖\n\n第一个子程序绘制正方形\n\n```\n110 REM DRAW BOX\n120 Y=12:FOR\
    \ X=P TO 15+P\n130 SET(X,Y,CL):NEXT\n140 Y=24:FOR X=P TO 15+P\n150 SET(X,Y,CL):NEXT\n\
    160 X=P:FOR Y=12 TO 24\n170 SET(X,Y,CL):NEXT\n180 X=P+15:FOR Y=12 TO 24\n190 SET(X,Y,CL):NEXT\n\
    200 RETURN\n```\n\n第二个子程序填充点数\n\n```\n210 REM DRAW SPOTS\n220 IF TT=1 OR TT=3\
    \ THEN TT=5 THEN SET(P+8,18,CL) '中心点\n230 IF TT=1 THEN RETURN\n240 IF TT=2 OR\
    \ TT=3 THEN SET(P+12,15,CL):SET(P+4,21,CL):RETURN\n250 SET(P+13,14,CL) '四个角点——左上\n\
    260 SET(P+2,14,CL) '右上\n270 SET(P+2,22,CL) '左下\n280 SET(P+13,22,CL) '右下\n290 IF\
    \ TT>6 THEN RETURN\n300 SET(P+2,18,CL) '六点的左侧点\n310 SET(P+13,18,CL) '六点的右侧点\n\
    320 RETURN\n```\n\n"
