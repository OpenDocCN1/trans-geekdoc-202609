    # Digital Clock


    The variable S, the seconds counter, never gets reset to 0 at the end of a minute.
    It merely has 0 deducted from it. This is so that the regulator can work. If it
    were reset to zero, then the fractional part of the tick regulator would always
    be lopped off.


    Notice the use of a PRINT USING mask set at line 30 as "## : ". This is a common
    trick to shorten the PRINT USING statements. It is tedious if you have to say
    every time:


    PRINTUSING "## ;H"


    PRINTUSING M$;H is much quicker to type. Print masks can contain ordinary symbols
    like ":" and "", which are carried straight through into the edited line. You
    can use this trick to put spaces between numbers, where they are closely packed.


    If the result being printed is not quite a whole number, then PRINT USING will
    round it off for you. For example, 58.6 seconds would print as 59, when edited
    in this manner. For this reason, you may occasionally see "-00" printed in the
    seconds column and this indicates that the rounding is taking place.


    It is also worth noting the use of the PLAY command. It catches most people out
    to find that L2 actually means a half length note and not a double length one
    as you might expect. This is very clearly set out in the manual but you would
    not be the only one to be fooled, if you get it wrong.


    # FRUIT MACHINE


    If an ordinary fruit machine is called a "one armed bandit", then this has to
    be the "no-armed bandit". There are no traditional wheels inside the machine.
    A combination of characters is generated and displayed at the bottom of the screen.
    You have a set period of time to press a key and "hold" the machine. Two of a
    kind pays 5. Three of a kind pays 50. Two stars at the beginning pays 10 and one
    star at the beginning pays 2. Anything else loses 10. See if you can stay ahead
    of the game. To help a bit, you can set the speed at the beginning. High numbers
    go slower; a number of about 20 gives a reasonable speed. The whole game lasts
    for 30 seconds.


    ```

    10 FRUIT MACHINE ''reset the time counter

    20 CLSTIMER=0

    30 PRINT"HIGH NUMBERS GO SLOWER"

    40 S=0:INPUT"SPEED";F ''get the input speed

    50 Z=$=""" ''Z is the output line

    60 FOR X=1 TO 3 ''choose 3 at random from the string

    70 Z=$MID("$*+=-..",RND(7),1)

    80 NEXT X

    ```


