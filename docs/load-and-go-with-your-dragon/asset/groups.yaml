    # PONTOON


    You may have seen some programs which play Blackjack on the American model. Pontoon
    is very similar, but the European version has some important differences. So,
    perhaps a description of the game is in order first.


    The object of the game is to draw a number of cards, which approach as closely
    as possible 21 in value, hence the name Vingt et Un in the European version. For
    this purpose, court cards, Jack, Queen, King count as ten and an Ace may count
    as 1 or as 11, as the holder wishes. Two cards, consisting of an Ace and a King,
    constitute a Pontoon, when these are the only two cards held, and possession of
    a Pontoon gets special rewards.


    A banker (or dealer) is appointed and a card is dealt to each player, and bets
    are placed on that first card. At this point the dealer may "double" (I.e. require
    that all bets are doubled). A second card is dealt to each player. If the Bank
    now holds a Pontoon, it must declare it and all players pay the banker. Supposing
    that the Bank does not hold a pontoon, each player in turn is then asked whether
    he wishes to "Twist" (receive a card face down for an increased stake), or "Stick"
    (receive a card up and no more cards). It is usually obligatory to take another
    card with a hand of a value of 15 or less. If a player holds two of a kind in
    his hand, he may "split" the hand and play it as two separate hands. Anyone holding
    five cards in total representing a score of 21 or less wins automatically as if
    he held a pontoon.


    To simplify the game a little, I have invented special house rules. First, the
    computer is the banker and remains so, come what may. This is because the dealing
    is done by computer. Because the Bank will not change hands in the normal way,
