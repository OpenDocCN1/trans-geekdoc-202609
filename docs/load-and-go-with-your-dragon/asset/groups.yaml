    # PUTTING


    You have managed to reach the green, now it''s time to put the ball. The hole
    is represented by the letter"O" and the ball position is shown by "X". Naturally
    the playing surface is coloured green. You are asked to enter the direction of
    the shot as a number 1-12 as on the hands of a clock and the strength to be applied.
    The new position of the ball is then calculated by trigonometry and the ball wobbles
    its way to the new spot. If the new position of the ball and hole coincide, then
    it goes "PLOP". If you hit the ball into the rough at the edge of the screen,
    then you lose a penalty stroke and the ball is dropped for you at the edge of
    the green.


