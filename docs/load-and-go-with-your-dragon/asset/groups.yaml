  - '[PAGE 96]


    # SIGN WRITING


    From time to time, there is a need to print text on the high resolution graphics
    screens. The fly and the treacle program had two examples of this, where we wanted
    to print a word on the picture. To save re-inventing this every time, here is
    a standard subroutine for writing anything you like. It produces an alphabetical
    string for each letter, so the result should always be prefaced by commands to
    move to the desired position, set the colour and set the scale. The basic characters
    are designed as 16 points down and 8 points across, with a separation between
    letters of four points. So, if you said, for example, scale was 8, this would
    double the basic units (4 is the reference level - you can draw to a smaller scale
    or to a larger scale) and these would become 32 units down, 16 units across, and
    8 units separation.


    Each character is assumed to start at its bottom left corner, and the string finishes
    at the bottom right corner, ready for the next letter to be added. Here is an
    example of the plotting for the letter A:


    ![](img/7a80be36866e3d2c055800fc953633cd_96_0.png)


    The example program, shown below, uses this subroutine to draw an illuminated
    sign of a person''s name. Ideally the name should be about 6 characters long,
    and can have a space after it to make the whole thing look prettier. The name
    is then plotted down the screen in different scales. The actual scales to be used
    are'
  - '[PAGE 97]


    # Sign Writing


    given in the DATA statement, so you can change it if you want all big letters,
    or all small letters, for example. The colours are each plotted in turn. So the
    sequence goes yellow, blue, red against a green background and then repeats. If
    the whole of the name wont fit onto a line then it gets on as many letters as
    it can.


    At the end, the whole screen is displayed in the alternative character set, which
    are Green, Purple, Magenta, Cyan against a Buff background; these colours alternate
    at about 3 second intervals.


    ```

    10 REM EYEBALL CHARACTERS ''set mode 1 and page 1 to write into

    20 MODE 1

    ```'
