    160 X=P:FOR Y=12 TO 24

    170 SET(X,Y,CL):NEXT

    180 X=P+15:FOR Y=12 TO 24

    190 SET(X,Y,CL):NEXT

    200 RETURN

    ```


    ''line across at the top


