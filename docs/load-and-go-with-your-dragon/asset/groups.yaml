    # LUCKY DIP


    Morse Code Tester


    The main problem in learning Morse code is not learning to send the code, but
    learning to receive it. To practice receiving you need an expert assistant to
    help. The Dragon can be this assistant and give you practice at different speeds
    with completely consistent sending, with the same "fist" every time.


    You still need a helper to key in the message but the helper need know nothing
    of Morse code.


    ```

    10 REM MORSE CODE SENDER

    20 CLS:PRINT TAB(8);"MORSE CODE SENDER"

    30 INPUT"SPEED";SP ''higher numbers go slower

    40 DS=INT(SP):DD=3*DS

    50 GOSUB 230 ''set up the code array

    60 INPUT A$ ''text to be sent

    70 FOR L=1 TO LEN(A$) ''get next letter

    80 W=ASC(MID(A$,L,1)) ''numbers

    90 IF W>=48 AND W<=57 THEN W=W-48:GOSUB 150:GOTO 120 ''letters

    100 IF W>=65 AND W<=90 THEN W=W-55:GOSUB 150:GOTO 120

    110 FOR DL=1 TO SP*100:NEXT DL ''inter word gap

    120 FOR DL=1 TO SP*60:NEXT DL ''inter letter gap

    130 NEXT L

    140 GOTO 60

    ```'
