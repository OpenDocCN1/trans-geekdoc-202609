    # 写字


    每隔一段时间在高分辨率屏幕上打印文本。之前的程序有两个例子，我们想在图片上打印一个单词。每次重新创建时，这里有一个标准的子程序用于写入任何内容。它为每个字母产生字母字符串，所以结果总是由命令移动到所需位置，设置颜色并设置比例。如果比例为
    8，这些将变为 32 个单位高，16 个单位宽，并且有 8 个单位的间距。每个字母假设从左下角开始，字符串在右下角结束，准备好下一个字母。这里是字母 A 的绘制示例：[](img/7a80be368e6d2c0580fc95363cd_96.png)
    下方的示例程序使用此子程序画一个人的名字。理想情况下，名字应该大约 6 个字符，并在后面加一个空格让它看起来更好。名字然后以不同的比例绘制。实际使用的 DATA
    语句允许你如果想要大字母或小字母，例如。颜色逐个绘制。序列是绿色背景黄色，然后重复。最后，整个屏幕以另一种设置显示，即绿色、紫色、青色背景；这些颜色以大约两秒为间隔交替。


