  - '[PAGE 109]


    # HUNT THE WUMPUS


    The Wumpus is a mythical creature with Bat-like wings and sucker feet. This is
    a picture of what the artist thinks it looks like, but nobody who has seen one,
    has lived to tell the tale! He lives in a maze of inter-connected caves, through
    which you must travel to find him. Some of the caves contain bottomless pits;
    fall into one of these and you are never seen again. There are also two super
    bats, who have a playful habit of picking people up and dumping them in another
    cave.


    ![](img/7a80be36866e3d2c055800fc953633cd_109_0.png)


    The network of caves is generated each time in a different way - so making maps
    of the cave structure won''t help you. You are provided with five arrows, with
    which to shoot the Wumpus. Beware, the arrow might come back and hit you on the
    rebound. If you run out of arrows, you also lose, so use them carefully.


    When you are one cave away from a hazard, you will get a warning, for example:


    +   - I SMELL A WUMPUS: The wumpus is in one of the caves next to yours.

    - I FEEL A DRAUGHT: You are next to a bottomless pit.

    - BATS NEARBY: A cave next to yours contains a Super-Bat.


    The Wumpus is normally a lazy creature, but should he land in your cave, well
    let''s not dwell on the unimaginable, suffice it to say, that you lose.'
