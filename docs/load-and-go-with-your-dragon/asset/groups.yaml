    # NIM


    The origins of the game Nim are obscure, but it is believed to have come from
    the Orient some time in the way distant past. It is played with matchsticks or
    stones, which are divided into three piles. Each player in turn takes any number
    but from only one pile at a time. The object of the game is to ensure that you
    take the last match and not your opponent.


    The theory of the game is based on binary numbers. Consider the case of one left
    in each of two piles - clearly if your opponent takes one then you can take the
    other and win. So 1,1,0 is a winning situation. Arguing from this you can see
    that 5,5,0 is also a winning situation, because however many he takes, you take
    the same number; and this follows for any number i.e. n,n,0.


    When a third pile is introduced you have a problem, but if you strive for a balanced
    situation by making sure that all the binary bits of the sum add up to 2 or to
    0 you will always win. Take for example a situation of 3,2,1. In binary this is
    expressed as:


    | Pile | Number | Binary |

    |---|---|---|

    | 1 | 3 | 1 1 |

    | 2 | 2 | 1 0 |

    | 3 | 1 | 0 1 |

    | | | Sum: 2 |


    # Nim


    This is a balanced situation, from which you always win. If he takes any number
    the appropriate reply is shown below:


    He takes from n You take from n

    3 from pile 1 giving 1,1

    2 from pile 2 giving 1,0

    1 from pile 1 giving 2,2

    2 from pile 2 giving 1,0

    1 from pile 3 giving 2,2


    So always win!


    When you play against the computer, if you make the first move you usually win.
    There can be up to 29 matches in one pile, which makes the calculations a bit
    tricky and one slip you''re done for.


    Many years ago, about 1950, I built a machine for playing this game out of bits.
    It was a monstrous creation with meters of old binary decoders made of strips
    of tin, wrapped them at intervals. It made the simplistic assumption that the
    opening move would always be pre-emptive strike on one pile, to simplify the calculations.
    By comparison with Nim, this creation was beyond the pale, but I have retained
    a strong affection for the game, which should be better.


    ```

    10 REM NIM

    20 CLS:PRINT TAB(12);"NIM"

    30 PRINT"THE OBJECT OF THE GAME IS TO"

    40 PRINT"TAKE THE MATCH. YOU MAY"

    50 PRINT"TAKE ANY NUMBER, BUT ONLY"

    60 PRINT"ONE PILE AT TIME."

    70 PRINT:INPUT"PRESS TO CONTINUE";A

    80 FOR N=1 TO 3:N(N)=RND(29):NEXT ''set pile values

    ```


