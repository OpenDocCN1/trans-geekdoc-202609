    ```\n\n这是完整图形应该的样式：\n\n![](img/7a80be368e3d2c055800fc95363cd_24_0.png)\n\n# 趣味问答\n\
    \n你是否幻想过自己是一个初级的尼古拉斯·帕森（Nicholas Parsons）？这个问答程序负责所有的杂务，比如计分和判断答案是否在卡上。这一直非常受欢迎，因为你可以发明自己的问题并制作你自己的版本。\n\
    \n我们包含它是因为它是 Microsoft BASIC 中 `INSTR` 函数强大性的引人例子。在其他语言中，这个函数总是必须模拟；在这里，它是 BASIC\
    \ 命令集的一部分。假设问题是“谁是英国首相？”。现在，可能的答案有：\n\n- Margaret Thatcher\n- Maggie Thatcher\n\
