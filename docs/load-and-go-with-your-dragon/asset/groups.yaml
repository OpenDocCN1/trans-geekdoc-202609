    \ between labels\n                        'alter to suit\n160 PRINT #-PR,\"\"\n\
    170 NEXT B\n180 NEXT Z\n190 IF PR=2 'IMEN CLOSE\n```\n\nThe interesting thing\
    \ about this program is that it can be fooled to divert output to the screen or\
    \ to the printer as you require. See line 130 which if PR=2 would read:\n\n130\
    \ PRINT #-2,AS$(A)\n\nwhereas if you have reset PR=0 then it reads:\n\n130 PRINT\
    \ #-0,AS$(A)"
  - '[PAGE 80]


    # Lucky Dip


    This could be a useful trick where you have a program which might require screen
    output and might require printer output according to user choice.


    # Date Validation


    A very common problem in programming concerns checking dates for validity against
    all the known calendar rules. We assume, being English, that the sequence will
    be Day, Month, Year but there can still be considerable variation within that
    e.g.:


    ```

    28.11.82

    2.11.82

    2.2.82

    2/2/82

    2 2 82


    10 REM DATE VALIDATION

    20 INPUT "DATE":A ''get the date which might include ,

    30 N=W-1 TO LEN(A) ''

    40 FOR Z=1 TO LEN(A) ''check each character found

    50 T=ASC(MID$(A,Z,1)) wait until non-numeric character found

    60 IF T<48 OR T>57 THEN D(N)=VAL(MID$(A,W,Z)):N=N+1:W=Z+1

    70 NEXT Z:D(2)=VAL(MID$(A,W)) ''last one is year

    30 days September, April, June, and November

    80 DATA 31, 28, 31, 30, 31, 30, 31, 31, 30, 31

    90 IF D(2)<1 OR D(2)>12 THEN PRINT "MONTH ERROR":GOTO 20

    100 RESTORE

    110 FOR Z=1 TO D(2):READ L:NEXT

    ''check for leap year in February

    120 IF D(2)=2 AND INT(D(3)/4)*4=D(3) THEN L=29

    130 IF D(1)<1 OR D(1)>L THEN PRINT "DAY ERROR":GOTO 20

    140 IF D(3)<1 THEN PRINT "YEAR ERROR":GOTO 20

    ''print it out properly formatted

    150 FOR Z=1 TO 3:PRINTING## ";D(Z);NEXT

    160 PRINT"\GOTO 20

    ```'
  - '[PAGE 81]


    # Lucky Dip


    # Memory Hex Display


    A useful routine for peeking into the BASIC interpreter ROM to

    see what''s going on. The list of valid commands starts at

    address 8033 (hex) or 32819 (decimal). List it first in alpha-

    form to see the command words - the only surprise is the

    command DLOAD, which presumably refers to disk file loading.


    ```

    1000 CLS

    1010 PRINT "LIST MEMORY"

    1020 PRINT "USE @/SHIFT TO PAUSE"

    1030 PRINT "USE SPACE TO RESUME"

    1040 PRINT "BREAK TO STOP"

    1050 INPUT "ENTER MEMORY START ADDRESS (DEC)";F

    1060 IF HEX(H)/ALPHA(A)=A$

    1070 IF H=(AS=H)=0 THEN 1060

    1080 PRINT RIGHTS("0000"+HEX$(F),4);" "

    1090 FOR X=1 TO 8

    1100 IF H THEN 1150

    1110 IF Z=PEEK(F)

    1120 IF Z>=32 AND Z<127 THEN PRINT CHR$(Z);ELSE PRINT "."

    1140 GOTO 1170

    1150 Z$=RIGHTS("00"+HEX$(Z),2)

    1160 PRINT Z$"; ""

    1170 F=F+1

    1180 NEXT X

    1190 PRINT:GOTO 1090

    ```'
  - '[PAGE 82]


    # GRAPHICS SECTION'
  - '[PAGE 83]


    # ROLLER DICE


    Our family have been known to

    cheat, when in sticky

    situations, needing say a four

    desperately to avoid hotels on

    "Park Lane". Somehow, by

    accident the dice roll under the

    side-board and whoever retrieves

    them can say whatever they like!

    Nobody believes the convenient

    answer and violent arguments

    ensure. Use the computer to

    sulate the dice and you solve

    the problem. Anybody rolling

    the computer under the table is

    disqualified in a big way.


    ![](img/7a80be36866e3d2c055800fc953633cd_83_0.png)


    Whilst this example is a fairly easy one to follow, it provides

    t starting point for a detailed exposition of the graphics

    features of the Dragon. The four chapters following also deal

    with the same subject and form a detailed guide to all the exc-

    ell features which the Dragon provides. The whole subject is

    rather confusingly treated in the Basic instruction manual and

    hopefully a few worked examples of the facilities will clear the

    air.


    The first thing to appreciate is that low level graphics and high

    level graphics are quite different things. They deal with

    different areas of memory and have different commands. the only

    commands of any relevance to low-level graphics are:


    CLS c      Set wheel to colour specified (c).


    SET (x,y,c) Set a quarter character point, specified by

    coordinates x(across the screen) and y (down the screen) to

    colour c. The top left corner of the screen is 0,0 and

    bottom right of the screen is 63,31. This is a different

    numbering system to that used for PRINT @ and quite diff-'
  - '[PAGE 84]


    erent from that used for high resolution graphics - very confusing.


    RESET (x,y) Set a quarter character point to the background colour. Points x and
    y defined as before.


    POINT (x,y) Function returns Ø if the point is off, -1 if the point contain text
    and the colour if it is set.


    SCREEN (Ø,n) Command used to reset the low resolution screen from high level graphics.
    In theory, should also be able to set the background colour for the above commands,
    but in practice has little effect.


    Some of the effects produced by these commands are not quite what you might expect.
    Consider, for example, the following little program:


    ```

    10 CIS ''clear screen to green

    20 SET(20,20,5) ''set a point to colour Buff

    30 RESET(10,10) ''reset a point to background colour

    40 CL=32: PRINT @383,CHRS(134+CL) '' print a chequer pattern

    ''character in colour blue

    ```


    Run as it stands, it has some surprising effects. Firstly the SET command has
    set the whole square to the colour and not the point only. Secondly, the RESET
    has reset the point to Black and not Green as might have been expected. Thirdly,
    the background of the diamond character has been set to black, whereas green might
    have been expected.


    Try changing line 10 to CIS. This time, the SET command has set only the single
    square, as requested, but has turned the remainder of the square to black! The
    RESET command this time has reset the whole square to black and not just the point.
    The CHR$ function produces the same effect.'
  - '[PAGE 85]


    # Roller Dice


    Try also adding:


    15 SCREEN 0,0


    or:


    15 SCREEN 0,1


    You would expect these to have some effect, but they do not.


    These limitations and problems can all be avoided if you clear the screen to black
    at the beginning by CLS0. With a black background all these problems can be avoided
    and everything has the effect you might expect. The only problem is that every
    time the computer prints on the screen the character background reverts to green.


    So, at last, we come to the example program:


    ```

    10 REM DICE PROGRAM

    20 CLS:CL=5

    30 FOR P=11 TO 38 STEP 27

    40 TT=RND(6)

    50 GOSUB 110 ''DRAW BOX

    60 GOSUB 210 ''PAINT SPOTS

    70 NEXT P

    80 PRINT @480,""""

    90 INPUT AS

    100 GOTO 20

    ```


    > ''note screen cleared to black

    to try different colours

    change CL= statement

    P values of 11 and 38 are

    ''top left corners of the dice

    get the value of the dice


    > ''pause - note the ";" to prevent

    the whole line going green

    press (Enter) to roll again'
