    # Lucky Dip


    The program works by using scaling factors. Suppose we have input 25.4 cms; this
    is first split into into "25.4" and "CMS". This is not square measure (see line
    230), so we search the array AA$ and stop on element 2 which contains "CM". Variable
    M becomes 22 (line 300) and we calculate:


    25.4* 10/304.8 (element 22) = 0.83 FEET (element AA$(22))

    25.4* 10/914.4 (element 23) = 0.28 Y (element AA$(23))


    If the units contain the letters "SQ" then the search is confined to the square
    measure part of the table. The zeros in the table are included so that if there
    is no relevant higher unit, it will not be printed, (see line 320).'
