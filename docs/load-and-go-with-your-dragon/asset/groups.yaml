    \ D(3)<1 THEN PRINT \"YEAR ERROR\":GOTO 20\n'print it out properly\n150 FOR Z=1\
    \ TO L:PRINT \";D(Z);\n160 GOTO 20\n```\n\n# Lucky Dip\n\n## Memory Hex Display\n\
