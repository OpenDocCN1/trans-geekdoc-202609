    # IV. EXAMPLE ANALYSIS


    # A. Example Description


    +   1) Data Description: includes the 28-day data of total solar radiation, temperature,
    and humidity in the Tangshan area of Northern Beijing, the 350KV centralized installed
    and active power of Henan District of Tangshan, and the photovoltaic of three
    districts situated in Luquan, Tangshan. We use the test and training set to 0.75:0.25,
    i.e., 21 days are used as the


    training data, and seven days are used as the test set to compare the results.


    +   2) Scenario Description: According to the methods in Section 2.1 and 2.2,
    this article sets three scenarios for analysis. The regional DPV power generation
    mentioned in the scenario refers to the sum of the three distributed sites PV
    power in the data.


    Scenario one: Use a centralized PV generation efficiency curve and DPV installed
    capacity to estimate regional DPV power generation.


    Scenario two: The historical PV power generation efficiency curve and meteorological
    data as input. The regional DPV power generation is used as input to train the
    neural network. The real-time centralized PV generation efficiency and output
    the estimated DPV power value during the test.


    Scenario three: The historical single DPV generation efficiency curve and meteorological
    data as input. The regional DPV power generation is used as input to train the
    neural network. Real-time single DPV power generation efficiency curve and output
    the estimated DPV power value during the test.


    # B. Evaluation Criteria


    The evaluation indicators are selected as the mean square error (RMSE), mean absolute
    error (MAE), and equation. The calculation formulas are [6] and [7], The former
    can measure the degree of errors, while the latter is the deviation from the average
    forecast of results. The closer the RMSE and MAE values are to zero, the smaller
    the estimation error and better the model effect.


    ```

    $RMSE = \frac{1}{n} \sum_{i=1}^{n} (\frac{y_i - \hat{y}_i}{Cap})^2 \(6)$

    ```


    ```

    $MAE = \frac{1}{n} \sum_{i=1}^{n} |\frac{y_i - \hat{y}_i}{Cap}| \(7)$

    ```


    where $y_i$ is the real value. The accuracy is defined as $1 - RMSE$.


