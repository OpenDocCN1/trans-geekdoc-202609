    # II. LONG SHORT MEMORY NEURAL NETWORK MODEL


    Long term short memory neural network (LSTM) is a kind of recurrent neural network
    (RNN). It is also believed that LSTM is an improved RNN. While maintaining the
    characteristics of RNN can handle variable-length sequences, LSTM solves the problem
    of gradient vanishing or explosion. More, although LSTM has a structure, its repeating
    methods are different. The repeating method of RNN has only one neural layer,
    while LSTM has four neural layers, which interact in a particular form.


    The core of LSTM is to use a new state and output information from the hidden
    state while loop cyclic operation. As shown in Figure 1, the horizontal line represents
    the entire state. In the figure, $\sigma$ and tanh represent the sigmoid and tanh
    activation functions, respectively. $x_t$ is the input, and $h_{t-1}$ are the
    states of the current and previous times respectively.


    LSTM selects to retain or forget through information through three control units
    (input gate, output gate, gate). Equation[1] forms the state at the current moment.
    Input gate equation[3] controls how hidden information is retained. Gate equation[4]
    controls how much information is discarded in the previous moment. The output
    gate[5] controls how much information needs to be output to the hidden state $h_t$
    at the current moment.'
