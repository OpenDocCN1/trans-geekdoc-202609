    In the formula: $W$ is the weight matrix, $b$ is the bias, the constants $c, i,
    f,$ and $o$ represent the state, input, gate and output gate, respectively. LSTM
    can decode or add information in the neural state. This mechanism is carefully
    managed by a structure called the gate. The gate is a feedback neural network
    with sigmoid function as the activation function, which is essentially a way to
    allow information to pass through selectively and is signed by sigmoid neural
    layers and point-by-point multipliers. The reason for using sigmoid is its output
    in [0,1], which is equivalent to a set of weights. When the output value is 0,
    the gate will forget information; when the output value is 1, the gate will retain
    all information. The power of LSTM to solve the vanishing or exploding gradient
    problems faced by standard recurrent neural networks when the sequence information
    is too long, is beneficial to sequence modeling.


