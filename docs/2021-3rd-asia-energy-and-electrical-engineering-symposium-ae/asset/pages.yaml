    # III. REAL-TIME ESTIMATION MODEL OF PHOTOVOLTAICS


    This section will first propose the method of the installed capacity ratio and
    estimation model using LSTM. By considering typical weather scenarios, generalized
    model for varying conditions is proposed to estimate regional DPV power generation
    efficiency, a DPV generation algorithm for the local level is proposed.


    # A. Calculation of the Installed Capacity Ratio


    In discussing photovoltaics, the most common and easiest method is to calculate
    based on the installed capacity (generation efficiency). This method will first
    calculate the power generation efficiency, which can be obtained by driving ''DPV
    power generation at time T ''installed capacity at time T''. In other words, the
    result equals to the real-time output of PV station by ''installed capacity''.


    Next, considering the performance of difference modules and the difference in
    weather and geographic location in the neighboring area, the power generation
    efficiency is approximately equivalent to the efficiency curve of all DPV generation
    in the region.


    Finally, might the installed capacity of DPV power generation in the region be
    the DPV generation efficiency curve to adapt the DPV power generation efficiency
    curve in the region.


    # B. Short Term Memory Neural Network Estimation Model


    The calculation of installed capacity ratio in the previous section extends a
    single PV power generation to regional power generation efficiency. This rough
    estimation might cause a specific error. To obtain PV power generation, the source
    of the error must be analyzed first. The means include local weather conditions
    and geographical differences. Meteorological conditions may relate to the relative
    ground temperature, ground humidity, and solar radiation. The relative weather
    will affect the photovoltaic efficiency of PV panels.


    Combining meteorological data and historical power generation efficiency, a multi-source
    data-driven estimation method, as shown in Figure 2. This method uses historical
    weather data and LSTM models to learn the changing trend of DPV power generation
    series.


