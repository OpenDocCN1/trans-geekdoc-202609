    **Abstract**—The massive access of distributed photovoltaics (DPV) puts higher
    requirements for the current grid''s safe and stable operation. In view that the
    automatic dispatch control system does not directly collect operating data, the
    most PV generation estimation compared with meteorological and historical PV data,
    based on short-term memory neural networks (LSTM) is predicted. Taking the DPV
    in the area of China as an object, the estimation accuracy of the LSTM model based
    on DPV can reach up to 92.6%, with the accuracy of the model. The proposed method
    is of great significance for the dispatching department to monitor and manage
    the operation of DPV and to dispatch electricity resources, and storage.


    **Keywords**-distributed photovoltaics; power estimation; LSTM


    In recent years, the new power of the DPV grid capacity of power generation has
    developed rapidly. By the end of 2019, the total capacity has reached 2 billion
    kW, of which 200 million kW is the PV generation and 60 million kW is the DPV
    power generation. The contradictions of renewable energy consumption have become
    increasingly prominent. The impacts of DPV generation on regional power balance,
    load forecasting, start-up and shutdown arrangements, are increasing [1]. To meet
    the development needs of DPV power generation, it is urgent to propose a practical
    and feasible estimation method for the DPV power that is directly collected to
    improve the capacity of DPV generation and ensure the safety and stability of
    grid operation.


    Generally, the market acquisition and usage systems only have time-sharing power
    data; however, the real reliability, stability of these data often cannot meet
    regulation and operation scales. Also, the automatic dispatch control system fails
    to achieve leverage of DPV data access, which only collects part of the distributed
    data. To the National Electric Power Dispatching Center requires all DPV can be
    connected to the automatic dispatch control system. For data that is not collected,
    a specific algorithm is required to estimate the DPV power.


    ## I. INTRODUCTION


    Domestic researchers have conducted studies on this issue. A station method was
    raised by researchers [2]. By fitting the power generation of the market with
    the installed capacity ratio of the station area, the DPV power of the station
    area could be obtained. However, this method can only get the DPV power of the
    previous day, and instance accuracy still need to be improved. In addition, some
    researchers select models through autocorrelation analysis and weight matrix testing.
    They also calculated the global DPV power based on installed capacity and coefficients
    [3].


    The relation method of DPV has some similarities with the prediction method. There
    are two main types of PV forecasting methods [4]: One is the physical method,
    which analyzes the solar radiation transfer and the conversion efficiency of PV
    models, then analyze, predict and estimate the PV power by considering the local
    cloud image information and geographic locations. The other method, which is big
    data on the basis of a large amount of historical data combined with statistical
    analysis and machine learning techniques. The physical method is used in actual
    scenarios as it involves various disciplines such as meteorology and optoelectronics,
    and its modeling process is complex.


    There were many studies on statistical methods, considering physical properties.
    In 2015, some considered that the changes of brightness and cloud based on cloud
    image using radial basis function (RBF) neural network forecasting [5]. In 2017,
    research showed that a two-layer neural network could be obtained by combining
    the physical power of PV generation to control the influencing factors [6]. When
    it comes to 2019, machine learning was used to make modeling for PV stations in
    the weighting area. What is more, data extracted through temporal features, and
    the principle of graph convolution was used to extract spatial features. As result,
    the prediction network showed effects [7]. Recently, a new idea stated that the
    short-term PV prediction method combining variational mode decomposition (VMD),
    deep state network (DNN), and mixture of Gaussian process experiments could improve
    the accuracy of short-term PV power series [8]. Considering existing DPV estimation
    technology, this paper combines historical weather data and DPV data to provide
    a real-time distributed long-term memory network (LSTM). For actual engineering
    data, feasible solutions are provided according to different types.


    ## II. LONG SHORT MEMORY NEURAL NETWORK


    Long short memory neural network (LSTM) is a kind of recurrent neural network
    (RNN). It is also believed that LSTM is an improved RNN. While maintaining characteristics
    of RNN can handle variable-length sequences, LSTM solves the problem of gradient
    vanishing or explosion. More, although LSTM has structure, its repeating methods
    are different. The repeating method of RNN has only one neural layer, while LSTM
    has four neural layers, which interact in a particular form.


    The core of LSTM is to use a new state and output information from the hidden
    state while cyclic operation. As shown in Figure 1, the horizontal line represents
    the entire state. In the figure, $\sigma$ and tanh represent the sigmoid and tanh
    activation functions, respectively. $x_t$ is the input, and $h_{t-1}$ are the
    states of the current and previous times respectively. LSTM selects to retain
    or forget information through three control units (input gate, output gate, gate).
    Equation [1] forms the state at the current moment. Input gate controls how hidden
    information is retained. Forget gate [3] controls how much information is discarded
    in the previous moment. Output gate controls how much information needs to be
    output to the hidden state $h_t$ at the current moment.


    State update formulas for every step of LSTM are:


    $C_t = f_t \odot C_{t-1} + i_t \odot \tanh(W_C \cdot [h_{t-1}, x_t] + b_C)$


    $h_t = o_t \odot \tanh(C_t)$


    $i_t = \sigma(W_i \cdot [h_{t-1}, x_t] + b_i)$


    $f_t = \sigma(W_f \cdot [h_{t-1}, x_t] + b_f)$


    $o_t = \sigma(W_o \cdot [h_{t-1}, x_t] + b_o)$


    In the formula: $W$ is the weight matrix, $b$ is the bias, $c, i, f,$ and $o$
    represent the state, input, gate and output gate, respectively. LSTM can decode
    or add information in the neural state. This mechanism is carefully managed by
    a structure called the gate. The gate is a feedback neural network with sigmoid
    function as the activation function, which is essentially a way to allow information
    to pass through selectively and is signed by sigmoid layers and point-by-point
    multipliers. The reason for using sigmoid is its output in $[0,1], which is equivalent
    to a set of weights. When the output value is 0, the gate will forget information;
    when the output value is 1, the gate will retain all information. The power of
    LSTM to solve the vanishing or exploding gradient problems faced by standard recurrent
    neural networks when the sequence information is too long, is beneficial to sequence
    modeling.


    ![0074bd0888a307be37e4bd01e0a4ef8_2.png] Figure 2. A multi-source data-driven
    photovoltaic estimation method


    ## III. REAL-TIME ESTIMATION MODEL OF PHOTOVOLTAICS


    This section will first propose the method of the installed capacity ratio and
    estimation model using LSTM. By considering typical weather scenarios, generalized
    model for varying conditions is proposed to estimate regional DPV power generation
    efficiency, a DPV generation algorithm for the local level is proposed.


    ### A. Calculation of the Installed Capacity Ratio


    In discussing photovoltaics, the most common and easiest method is to calculate
    based on the installed capacity (generation efficiency). This method will first
    calculate the power generation efficiency, which can be obtained by dividing ''DPV
    power generation at time T'' by ''installed capacity at time T''. In other words,
    the result equals the real-time output of PV station by installed capacity.


    Next, considering the performance of different modules and the difference in weather
    and geographic location in the neighboring area, the power generation efficiency
    is approximately equivalent to the efficiency curve of all DPV generation in the
    region.


    Finally, the installed capacity of DPV power generation in the region is the DPV
    generation efficiency curve to adapt the DPV power generation efficiency curve
    in the region.


    ### B. Short Term Memory Neural Network Estimation Model


    The calculation of installed capacity ratio in the previous section extends a
    single PV power generation to regional power generation efficiency. This rough
    estimation might cause a specific error. To obtain PV power generation, the source
    of the error must be analyzed first. The means include local weather conditions
    and geographical differences. Meteorological conditions may relate to the relative
    ground temperature, ground humidity, and solar radiation. The relative weather
    will affect the photovoltaic efficiency of PV panels.


    Combining meteorological data and historical power generation efficiency, a multi-source
    data-driven estimation method, as shown in Figure 2. This method uses historical
    weather data and LSTM models to learn the changing trend of DPV power generation
    series.


    The measurement point of PV power generation efficiency can be selected as a DPV
    power generation panel.

