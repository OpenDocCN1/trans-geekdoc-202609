    DPV 功率值。


    LSTM 估计采用迭代方法。图 [3] 显示了时间序列数据如何引入监督学习。深度需要通过迭代来确定，通常为 2-5 层。以长度为 4 的输入时间序列为例，LSTM
    模型的输入是四个时间点的光伏发电量和历史数据。历史气象数据包括总太阳辐射、温度和湿度。输出是下一个点的 DPV 功率。在模型的泛化能力方面，模型的输入和输出需要归一化到
    0-1 之间。在训练阶段，输入和输出都需要提供给模型。在测试阶段，在实时估计状态下，模型将通过输入实时时间点的历史数据，来估计下一个时间点的光伏功率。


    # IV. 示例分析


    ## A. 示例描述


    - 1) 数据描述：包括北方北京唐山地区 28 天的总太阳辐射、温度和湿度数据，唐山河南县 350KV 集中装机和运行功率，以及位于唐山鹿泉三个区域的光伏电。我们将测试集和训练集的比例设为
    0.75:0.25，即使用 21 天作为训练数据，7 天作为测试集比较结果。


    - 2) 场景描述：根据第 2.1 节和 2.2 节的方法，本文设置了三个分析场景。场景中提到的区域 DPV 发电是指数据中三个分布式站点光伏功率之和。


    场景一：使用集中式光伏发电效率曲线和 DPV 装机容量估计区域 DPV 发电。


    场景二：以历史光伏发电效率曲线和气象数据为输入。将区域 DPV 发电作为输入训练神经网络。测试期间使用实时集中式光伏发电效率，并输出估计的 DPV 功率值。


    场景三：以历史单 DPV 发电效率曲线和气象数据为输入。将区域 DPV 发电作为输入训练神经网络。测试期间使用实时单 DPV 发电效率曲线，并输出估计的 DPV
    功率值。


    ## B. 评价标准


    评价指标选取为均方根误差 (RMSE)、平均绝对误差 (MAE) 和方程。计算公式见 [6] 和 [7]，前者可以衡量误差程度，后者是结果与平均预测值之间的偏离。RMSE
    和 MAE 值越接近 0，说明估计误差越小，模型效果越好。


    ```

    $RMSE = \frac{1}{n} \sum_{i=1}^{n} (\frac{y_i - \hat{y}_i}{Cap})^2 (6)$

    ```


    ```

    $MAE = \frac{1}{n} \sum_{i=1}^{n} |\frac{y_i - \hat{y}_i}{Cap}| (7)$

    ```


    其中 $y_i$ 为真实值。准确率定义为 $1 - RMSE$。


