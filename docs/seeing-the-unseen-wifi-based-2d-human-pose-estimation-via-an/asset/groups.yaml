    将连续的 CSI 信号视为图像，并使用小感受野（\(3 \times 3\)）的内核来提取特征，这在捕捉长期模式方面表现不佳。此外，WiSPPN 和 PIW
    仅通过卷积层的通道维度聚合子载波和连续样本，从而丢失了序列关系。因此，如果没有长期连续信息，之前的工作表现不如 EASFN。图 2 提供了所有方法的 PCK
