    ## 3. 演进注意力空间-频率网络


    ### 3.1. 概述


    CSI 信号 [36] 记录发射天线和接收天线之间的信号变化。当用户位于发射天线和接收天线之间时，接收到的信号高度受人体姿态影响。此外，CSI 信号中的频率变化揭示了人体活动和人体移动速度
    [19]。尽管如此，由于信息有限，从 Wifi 信号估计 2D 人体姿态仍然很困难。为解决这个问题，我们引入了一种演进注意力空间-频率网络，它能有效聚合场景的动态频率信息和空间语义信息，以及与运动相关的频率信息。此外，为了更好地估计移动人体的姿态，我们设计了一个演进注意力模块，以跨时间关注空间和频率特征的特定通道。在以下部分，我们将介绍这些模块的详细内容。


    ### 3.2. Wifi 信号和 CSI


    根据普遍的 IEEE 802.11 n/g/ac 协议，通过 Wifi 传输的信息由 30 个子载波承载，这被称为正交频分复用（OFDM）。子载波的频率位于中心为
    2.4/5GHz、带宽为 20/40/80/160MHz 的频段中，并且在 IEEE 802.11 n/g/ac 协议下也支持多输入多输出（MIMO），这允许在多个天线对之间传输数据包。在传输过程中，Wifi
    信号可能会因多种原因而发生变化，例如环境中移动物体引起的多径衰落效应或多普勒效应。


    由于 CSI 信号是信道中信号变化的物理层指标，我们使用开源 CSI 工具 [36] 来收集 CSI 信号，并记录包含 30 个子载波、带宽为 20 MHz
    且中心频率为标准 5GHz Wifi 的 CSI 样本。因此，我们使用一台配备 3 天线 Intel 5300 无线网络适配器的笔记本电脑作为接收器，以及配置相同的个人计算机作为发射器，从而使我们能够操作
    3 x 3 MIMO 模式。结果，我们得到 CSI 样本 S ∈ R^{NxNtxNrx}。其中 Ntx 和 Nrx 分别表示发射和接收天线的数量，Nc 表示子载波的数量。


    令 Ns 表示 CSI 样本采样率与 RGB 帧率之间的比率。换句话说，每采集 Ns 个 CSI 样本，我们就与一个 RGB 帧同步作为一个帧级 CSI 数据。帧级
    CSI 数据的形式在以往工作中常被使用，例如 PIW [12] 和 WiSPPN [11]。为了更好地捕获跨帧的动态信息，我们进一步将带有扩展率 d 的前
    T-1 个帧级 CSI 数据和当前帧级 CSI 数据作为输入来预测一个 RGB 帧（如图 1 左侧所示）。通过使用扩展率 d，时间上的感受野更大。令 Cseq
    ∈ R^{TxNc x Ns x Ntx x Nrx} 表示扩展的 CSI 序列，它是空间-频率编码器的输入。


    ### 3.3. 空间-频率编码器


    所提空间-频率编码器的目标是同时提取场景的空间语义信息和人体运动信息。由于 CSI 数据抽象且包含的信息有限，有必要设计一个有效的特征提取流程来从 CSI
    信号中挖掘信息。一方面，每个收发对包含环境信道状态的不同方面，因此可以通过整合每对的 1D 幅度来重建 2D 空间背景信息。另一方面，现有的信号处理研究 [19]
    表明，CSI 幅度波动的频率随人体运动速度变化，这意味着可以通过分析连续的 CSI 样本来捕捉人体运动。因此，我们设计了一个同时考虑对内和对间 CSI 信息的模型。


    具体来说，为了从 Cseq 中提取空间特征，空间编码器块由一个核大小为 1 x 3 x 3 的 3D 卷积层组成，随后是 BatchNorm、ReLU 激活函数以及沿样本维度的平均池化。卷积层首先用于提取
    3 x 3 Wifi 收发对的对间信息，由于空间特征在短时间内不应发生变化，随后应用平均池化层来整合所有样本的特征，从而减少噪声的影响并提供更鲁棒的空间特征。此外，在提取频率特征时，我们不使用信号处理中的带通滤波器，而是首先在并行分支中应用五个
    3D 卷积层来提取频率特征。为了获得多尺度特征，这五个卷积层的核大小各不相同，以从不同尺度提取特征，即核大小设置为 k × 1 × 1，其中 k ∈ {5,
    10, 15, 20, 25}。此后，对每个分支应用一个无填充的核大小为 Ns × 1 × 1 的 3D 卷积层，以从连续样本中获取全面信息。最后，我们将五个分支中提取的频率特征与空间特征拼接作为空间-频率特征。²


    ### 3.4. 演进注意力模块


    在推导空间-频率特征后，我们需要解决第二个挑战，即需要一个模块能够动态地从特定通道中识别相关特征并消除不相关特征，因为重要通道可能随时间而变化。基于 WiFi
    的 2D 人体姿态估计现有方法 [11,12,16] 忽略了时间信息，导致对移动用户的性能平平。此外，对于每个通道，不同序列提供的信息量并不相等。基于这些观察，我们设计了一种新的演进注意力模块来捕捉两个重要方面：（1）同一时间不同通道之间的影响，以及（2）同一通道在时间序列中的交互。


    具体来说，我们提出一个演进注意力模块，该模块沿序列推导动态注意力掩码。空间-频率特征序列 \(f_{seq} = [f_{t-\Delta t \times
    d} f_{t-(\Delta t-1) \times d} \cdots f_t] \in \mathbb{R}^{T \times H \times W
    \times C}\)，其中 \(d\) 表示扩展率。我们使用通道级全局平均池化（GAP）从 \(f_{seq}\) 中提取全局信息。GAP 后，特征序列中
    \(f_t\) 的维度为 \(1 \times 1 \times C\)。随后使用核大小为 \(k\) 的 1D 卷积来生成通道注意力掩码：


    \(A_t = Conv_k(f_t)\)


    其中 \(A_t \in \mathbb{R}^{1 \times 1 \times C}\) 表示 t-时刻生成的通道注意力掩码。该 1D 卷积的参数在
    \(f_{seq}\) 不同时刻的特征之间共享。此后，我们应用一个 GRU [37] 层，通过捕捉不同时间（t）的上下文信息来演进注意力掩码。令 \(h_t\)
    表示 t-时刻生成的演进注意力掩码，\(G\) 表示 GRU 的函数。演进注意力随后计算如下：


    \(h_t = G(A_{t-1}, h_{t-1})\)


    ### 3.5. 特征解码器和损失


    通过所提演进注意力模块推导增强特征后，我们使用特征解码器将提取的特征映射到两个输出特征图：关节热图（JHMs）和部件亲和力场（PAFs）。生成的 JHMs
    和 PAFs 均用于通过关节关联生成人体姿态。因此，我们通过最小化模型预测姿态与 OpenPose [20] 之间的 PAF 和 JHM 差异来优化损失函数。最终损失，记为
    \(L_{final}\)，总结如下。


    \(L_{final} = \lambda_1 L_{JHM} + \lambda_2 L_{PAF}\)


    ² 网络的详细信息，包括特征图维度、SPE 数据集和 GPE 数据集，将在我们的项目页面上介绍。


    \(L_{JHM} = \sum_m \|\hat{m} - m\|_2^2, \quad m \in M\)


    \(L_{PAF} = \sum_n \|\hat{n} - n\|_2^2, \quad n \in N\)


    其中 \(M\) 和 \(N\) 分别表示 JHM 像素集和 PAF 像素集，\(\hat{m}\) 和 \(\hat{n}\) 是预测值。标量权重 \(\lambda_1\)
    和 \(\lambda_2\) 用于平衡两个子损失。


    ## 4. 数据集


    由于缺乏基准，我们收集了两个数据集，即通用姿态估计（GPE）和特定姿态估计（SPE）数据集，以评估所提方法的性能。我们通过将包含 25 个以 50Hz 记录的
    CSI 样本的帧级 CSI 数据与一个分辨率为 800 x 600、帧率为 20 fps 的 RGB 帧进行匹配来配对 CSI 数据和 RGB 帧。我们根据时间戳将每个
    RGB 帧与帧级 CSI 数据同步，并将每个 RGB 帧输入 OpenPose [20] 以获取人体关节热图（JHMs）和部件亲和力场（PAFs），这些作为预测的实地真值。


    ### 4.1. GPE 数据集


    在此数据集中，我们遵循主流工作的实验设置，例如 PIW [12] 和 Wi-Pose [16]。我们招募了九名志愿者，要求他们进行步行、使用智能手机和挥手等日常活动。GPE
    数据集包含 106,695 个数据对，在 2 个空间中收集，即一个教室和一个大厅，深度分别为 9m 和 11m。场景中的人数范围从 1 到 5 人。此外，GPE
    还包括在暗场景和透墙场景下收集的数据，用于在特定条件下测试姿态估计。我们手动标注暗场景中的人体姿态作为实地真值，并通过将发射器放置在教室混凝土墙外、将接收器和摄像头放置在教室内部来设置透墙场景。


    ### 4.2. SPE 数据集


    由于现有数据集不提供详细的动作信息，难以评估不同动作的性能差异。因此，我们收集 SPE 数据集以更好地评估不同条件下基于 WiFi 的姿态估计性能。具体来说，SPE
    数据集是一个单人数据集，每位受试者被要求执行四项特定动作：1) 步行，2) 挥手，3) 跑步和 4) 开合跳。我们选择这四项动作是因为它们包含大量不同的移动速度和位移。事实上，日常活动的大部分属性都涉及这四项测试动作，这可以展示不同类型常见动作的性能。我们招募了
    30 名志愿者（19 名男性和 11 名女性），身高范围从 1.56m 到 1.92m，以评估不同受试者的鲁棒性。所有数据均从 6 个不同大小的教室或大厅中收集。该数据集的总大小为
    238,191 个数据对。


