    EASFN 和通过 Openpose 获取的 RGB 图像，并利用人工标注的人体姿态评估性能。表 4 显示，当灯光关闭时 Openpose 表现不佳，而 EASFN
    完全不受影响。图 4 更好地说明了关灯的影响。在光线不足的情况下，Openpose 可能会丢失一些关键点，例如手腕、脚踝等。然而，EASFN 可以正确预测所有关键点。因此，EASFN
    可以有效应用于一些次优场景，例如光线不足的环境甚至黑暗中。


    ## 6. 结论


    我们提出了一种用于基于 WiFi 的 2D 人体姿态估计的进化注意空间-频率网络。为了从抽象的 CSI 信号中学习有效的表征，我们通过空间-频率编码器同时提取静态空间信息和动态频率信息。我们还利用进化注意力模块来学习通道权重以及连续扩帧之间的时间依赖性。此外，还引入并公开发布了两个数据集以供后续研究。大量实验表明，我们的模型在很大程度上优于最先进的方法。尽管我们取得了相当大的进展，但仍有一些未解决的挑战，这对于将基于
    WiFi 的人体姿态估计应用于实际应用至关重要。在本工作中，我们在受控良好的环境下进行实验。然而，在实际场景中，其他移动物体（例如摆动风扇或家养宠物）可能会导致更复杂的
    WiFi 响应。如何将基于 WiFi 的人体姿态估计适应这种挑战性场景留作我们今后的工作。


