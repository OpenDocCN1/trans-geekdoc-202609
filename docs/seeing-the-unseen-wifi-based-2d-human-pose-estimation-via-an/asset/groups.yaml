    [26]），然后估计单人关键点或部件。虽然自顶向下方法通常优于自底向上方法，但它们受限于人体检测器的性能。与基于摄像头的方法相比，所提基于 Wifi 的方法可用于不同场景，例如低光照条件、隐私敏感应用和穿墙姿态估计。


