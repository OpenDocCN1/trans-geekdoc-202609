    # Seeing the unseen: Wifi-based 2D human pose estimation via an evolving attentive
    spatial-frequency network


    ![](img/efd360d946b871d0c04d9f4466e6ac53_0_0.png)


    Yi-Chung Chen$^{a,1}$, Zhi-Kai Huang$^{a,1}$, Lu Pang$^a$, Jian-Yu Jiang-Lin$^a$,
    Chia-Han Kuo$^a$, Hong-Han Shuai$^{a,*}$, Wen-Huang Cheng$^b$


    $^a$ National Yang Ming Chiao Tung University, No.1001, University Road, Hsinchu
    300093, Taiwan (R.O.C)

    $^b$ National Taiwan University, No. 1, Sec. 4, Roosevelt Rd., Taipei 106216,
    Taiwan (R.O.C.)


    ## ARTICLE INFO


    Article history:

    Received 20 May 2022

    Revised 21 January 2023

    Accepted 29 April 2023

    Available online 1 May 2023


    Edited by: Prof. S. Sarkar


    Keywords:

    CSI

    Wifi

    2D pose estimation

    Deep learning

    Spatial-Frequency network


    ## ABSTRACT


    Camera-based human pose estimation has become popular due to its wide applications
    and easy implementation. However, it is not applicable under several circumstances
    such as poor illumination, occlusion, and private protection. In this work, we
    utilize Wifi signals to estimate 2D human poses, which is challenging because
    Wifi signals are abstract and contain limited information. To address these challenges,
    we develop an evolving attentive spatial-frequency network to discover the relationship
    between signal variation and body movement for WiFi-based 2D human pose estimation.
    By first taking dilated CSI sequences as inputs, a spatial-frequency encoder is
    then introduced to effectively integrate static spatial information and dynamic
    frequency information from CSI signals. Finally, we design an evolving attention
    module to enable our model to attend to certain channels of features. Due to a
    lack of benchmarks, we propose two Wifi-based human pose estimation datasets,
    the General Pose Estimation dataset (GPE) and Specific Pose Estimation dataset
    (SPE), which have been released as a public download at project page. Extensive
    experiments on the proposed datasets show that our model outperforms the state-of-the-art
    method by at least 16% in terms of PCK@20 (percentage of correct keypoints).


    © 2023 Elsevier B.V. All rights reserved.


    ## 1. Introduction


    Multi-person 2D pose estimation [1–3] targets and locates anatomical keypoints
    or “parts” of all people in RGB images. It is a fundamental problem of widespread
    applications such as crowd estimation [4,5], visual tracking [6], pose tracking
    [7], hand tracking [8] and virtual try-on [9,10]. However, camera-based 2D human
    pose estimation methods are not applicable in some application scenarios, such
    as with poor illumination, and most importantly, camera-based approaches are prohibited
    in high-privacy environments, such as toilets and changing rooms.


    In this paper, we focus on estimating 2D human pose by using Wifi signals. Compared
    to camera-based approaches, Wifi-based pose estimation approaches are advantageous
    in poorly-lit and privacy-protected environments. In addition, these approaches
    are low-cost and convenient for collecting data due to the ubiquity of Wifi devices.
    Although a few works and surveys have been proposed to estimate poses from Wifi
    [11–13], they simply apply an off-the-shelf deep neural network backbone, such
    as ResNet [14] and Unet [15], which are originally designed for computer vision
    tasks. Without considering the characteristics of Wifi, these backbone models
    may lead to an inferior performance on Wifi feature extraction.


    In fact, the accuracy of the 2D human pose estimation from Wifi signals is limited
    due to the following two challenges. The first involves implicit relationships.
    Wifi signals are abstract and contain limited information, so how to transform
    Wifi signals into poses is currently unknown. One possible approach is to use
    end-to-end training with well-designed deep learning architectures. However, the
    backbone architectures adopted by previous works [11,12,16] are devised for computer
    vision tasks, and may not be suitable for this type of transformation. For instance,
    the rescaling mechanism used in Unet is not suitable for this transformation since
    Wifi signals do not contain complex spatial relations as video frames do. As pose-related
    information lies in complicated patterns between subcarriers and transceiver pairs,
    it is challenging to capture the patterns for reconstructing the 2D pose image
    using previous methods. The second challenge involves environment-sensitive. According
    to the prevalent standard of IEEE 802.11n Wifi signals, received signals are composed
    of 30 subcarriers with orthogonal frequency, and the amount of information hidden
    in each subcarrier varies with the movements of objects in the environments. Hence,
    an effective selecting mechanism is required to adaptively leverage the information
    from each subcarrier. However, this issue has not been well-addressed in previous
    works. For instance, [17] only selects the top 20 subcarriers with the highest
    scores, which are more noise resilient and are derived from the covariance between
    each subcarrier pair [18], uses the K-means algorithm to divide 30 subcarriers
    into 3 clusters according to the sensitivity to human activities, and then selects
    the most obvious subcarriers reflected by the activities. These methods are handcrafted
    and not robust for all scenarios. Other works like [11] and [12] simply neglect
    this issue, which may lead to inferior performance.


    To address the above challenges, we propose an Evolving Attentive Spatial-Frequency
    Network (EASFN) for WiFi-based 2D human pose estimation. Specifically, our model
    takes Channel State Information (CSI) as the input because CSI is sensitive to
    the movements of humans [19]. To collect RGB-CSI data pairs, we construct a hardware
    system with a camera and a set of receiver antennas and transmitter antennas (three
    for each). Each data pair contains an RGB frame recorded at 20 fps along with
    frame-level CSI data including 25 CSI samples sampled at 500Hz. The RGB frames
    are used for generating ground truth heatmaps through OpenPose [20], and the CSI
    signals are used as training inputs.


    To deal with the first challenge, a spatial-frequency encoder is proposed to simultaneously
    reconstruct 2D scene information and extract frequency features. Specifically,
    as the signal fluctuation is caused by the movements of objects and the frequency
    is related to the speed of object movements [19], the proposed encoder treats
    spatial and frequency separately by employing two sets of 3D convolution kernels.
    One set of 3D convolution kernels learns spatial features from CSI signals, which
    are based on the environment. Another set of 3D convolution kernels are leveraged
    to learn multi-scale temporal features of different frequencies. It is worth noting
    that the proposed spatial-frequency encoder can leverage CSI information more
    effectively than off-the-shelf backbone networks, such as ResNet [14], used in
    previous works [11,12].


    To address the second challenge, we introduce an evolving attention module to
    enhance specific spatial and frequency channels across the time. Finally, the
    enhanced features are fed into a feature decoder to predict human poses. In order
    to adapt to multi-person pose estimation scenarios, we generate both joint heatmaps
    (JHMs) and part affinity fields (PAFs) to leverage the joint association for estimating
    human poses. The experimental results reveal that EASFN outperforms the state-of-the-art
    method by at least 16% in terms of PCK@20.


    Our contributions are summarized as follows:


    - We propose a novel Wifi feature encoder for pose estimation—spatial-frequency
    encoder—instead of using conventional CNN backbones. The proposed spatial-frequency
    encoder is general and can be applied to multiple WiFi-based applications.

    - An evolving attentive spatial-frequency network is developed to solve the environment-sensitive
    issue of WiFi-based 2D human pose estimation, including two crucial components:
    the spatial-frequency encoder and evolving attention module.

    - We contribute the General Pose Estimation dataset (GPE) and Specific Pose Estimation
    dataset (SPE) for WiFi-based 2D multi-person pose estimation, which contains 344,886
    data pairs in total (1 image frame and 1 frame-level CSI data).


    ## 2. Related works


    ### 2.1. RGB-Based 2D person pose estimation.


    Camera-based 2D person pose estimation aims at detecting keypoints or body segmentation
    of all persons from an RGB image/video. Most approaches can be categorized into
