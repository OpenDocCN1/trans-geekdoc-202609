    # 看见不可见：通过演进注意空间-频率网络进行基于 Wifi 的 2D 人体姿态估计


    ![](img/efd360d946b871d0c04d9f4466e6ac53_0_0.png)


    Yi-Chung Chen$^{a,1}$, Zhi-Kai Huang$^{a,1}$, Lu Pang$^a$, Jian-Yu Jiang-Lin$^a$,
    Chia-Han Kuo$^a$, Hong-Han Shuai$^{a,*}$, Wen-Huang Cheng$^b$


    $^a$ National Yang Ming Chiao Tung University, No.1001, University Road, Hsinchu
    300093, Taiwan (R.O.C)

    $^b$ National Taiwan University, No. 1, Sec. 4, Roosevelt Rd., Taipei 106216,
    Taiwan (R.O.C.)


    ## 文章信息


    文章历程：

    收稿：2022 年 5 月 20 日

    修回：2023 年 1 月 21 日

    接受：2023 年 4 月 29 日

    在线发布：2023 年 5 月 1 日


    编辑：S. Sarkar 教授


    关键词：

    CSI

    Wifi

    2D 姿态估计

    深度学习

    空间-频率网络


    ## 摘要


    基于摄像头的人体姿态估计因其广泛的应用和易于实现而变得流行。然而，在光线不足、遮挡和隐私保护等多种情况下，它并不适用。在这项工作中，我们利用 Wifi 信号来估计
    2D 人体姿态，这具有挑战性，因为 Wifi 信号是抽象的且包含的信息有限。为应对这些挑战，我们开发了一种演进注意空间-频率网络，以发现信号变化与身体运动之间的关系，用于基于
    WiFi 的 2D 人体姿态估计。首先将扩展的 CSI 序列作为输入，然后引入空间-频率编码器，以有效整合来自 CSI 信号的静态空间信息和动态频率信息。最后，我们设计了一个演进注意力模块，使我们的模型能够关注特定通道的特征。由于缺乏基准，我们提出了两个基于
    Wifi 的人体姿态估计数据集，即通用姿态估计数据集（GPE）和特定姿态估计数据集（SPE），它们已在项目页面发布为公开下载。在所提数据集上的大量实验表明，与最新方法相比，我们的模型在
    PCK@20（正确关键点百分比）方面至少高出 16%。


    © 2023 Elsevier B.V. 保留所有权利。


    ## 1. 引言


    多人 2D 姿态估计 [1–3] 旨在定位 RGB 图像中所有人的解剖关键点或“部件”。它是人群估计 [4,5]、视觉跟踪 [6]、姿态跟踪 [7]、手部跟踪
    [8] 和虚拟试穿 [9,10] 等广泛应用的基本问题。然而，基于摄像头的 2D 人体姿态估计方法在某些应用场景下不适用，例如光线不足的环境，更重要的是，基于摄像头的方法在高隐私环境（如厕所和更衣室）中被禁止。


    本文专注于使用 Wifi 信号来估计 2D 人体姿态。与基于摄像头的方法相比，基于 Wifi 的姿态估计方法在光线不足和受隐私保护的环境中具有优势。此外，由于
    Wifi 设备的普遍性，这些方法成本低且便于收集数据。尽管已有一些工作和调查提出从 Wifi 估计姿态 [11–13]，但它们只是直接应用现成的深度神经网络骨干网络，例如为计算机视觉任务设计的
    ResNet [14] 和 Unet [15]。如果不考虑 Wifi 的特性，这些骨干模型在 Wifi 特征提取方面可能导致性能低下。


    事实上，由于以下两个挑战，从 Wifi 信号进行 2D 人体姿态估计的准确性受到限制。第一个涉及隐式关系。Wifi 信号是抽象的且包含的信息有限，因此如何将
