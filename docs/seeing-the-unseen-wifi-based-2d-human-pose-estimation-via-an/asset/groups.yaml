    网络。第二个是 PIW [12]，它利用成熟的 CNN 将 WiFi 信号映射到三个监督组件：SM、JHMs 和 PAFs。第三个是 Wi-Mose [32]，它将
    CSI 信号的幅度和相位融合为 CSI 图像，并使用神经网络从中提取特征。


