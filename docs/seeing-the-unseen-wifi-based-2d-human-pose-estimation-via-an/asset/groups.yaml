    2D pose image using previous methods. The second challenge involves environment-sensitive.
    According to the prevalent standard of IEEE 802.11n Wifi signals, received signals
    are composed of 30 subcarriers with orthogonal frequency, and the amount of information
    hidden in each subcarrier varies with the movements of objects in the environments.
    Hence, an effective selecting mechanism is required to adaptively leverage the
    information from each subcarrier. However, this issue has not been well-addressed
    in previous works. For instance, [17] only selects the top 20 subcarriers with
    the highest scores, which are more noise resilient and are derived from the covariance
    between each subcarrier pair[18], uses the K-means algorithm to divide 30 subcarriers
    into 3 clusters according to the sensitivity to human activities, and then selects
    the most obvious subcarriers reflected by the activities. These methods are handcrafted
    and not robust for all scenarios. Other works like [11] and [12] simply neglect
    this issue, which may lead to inferior performance.


    To address the above challenges, we propose an Evolving Attentive Spatial-Frequency
    Network (EASFN) for WiFi-based 2D human pose estimation. Specifically, our model
    takes Channel State Information (CSI) as the input because CSI is sensitive to
    the movements of humans [19]. To collect RGB-CSI data pairs, we construct a hardware
    system with a camera and a set of receiver antennas and transmitter antennas (three
    for each). Each data pair contains an RGB frame recorded at 20 fps along with
    frame-level CSI data including 25 CSI samples sampled at 500Hz. The RGB frames
    are used for generating ground truth heatmaps through OpenPose [20], and the CSI
    signals are used as training inputs.


    To deal with the first challenge, a spatial-frequency encoder is proposed to simultaneously
    reconstruct 2D scene information and extract frequency features. Specifically,
    as the signal fluctuation is caused by the movements of objects and the frequency
    is related to the speed of object movements [19], the proposed encoder treats
    spatial and frequency separately by employing two sets of 3D convolution kernels.
    One set of 3D convolution kernels learns spatial features from CSI signals, which
    are based on the environment. Another set of 3D convolution kernels are leveraged
    to learn multi-scale temporal features of different frequencies. It is worth noting
    that the proposed spatial-frequency encoder can leverage CSI information more
    effectively than off-the-shelf backbone networks, such as ResNet [14], used in
    previous works [11,12].


    To address the second challenge, we introduce an evolving attention module to
    enhance specific spatial and frequency channels across the time. Finally, the
    enhanced features are fed into a feature decoder to predict human poses. In order
    to adapt to multi-person pose estimation scenarios, we generate both joint heatmaps
    (JHMs) and part affinity fields (PAFs) to leverage the joint association for estimating
    human poses. The experimental results reveal that EASFN outperforms the state-of-the-art
    method by at least 16% in terms of PCK@20.


    Our contributions are summarized as follows:


    +   - We propose a novel Wifi feature encoder for pose estimation—spatial-frequency
    encoder—instead of using conventional CNN backbones. The proposed spatial-frequency
    encoder is general and can be applied to multiple WiFi-based applications.

    +   - An evolving attentive spatial-frequency network is developed to solve the
    environment-sensitive issue of WiFi-based 2D human pose estimation, including
    two crucial components: the spatial-frequency encoder and evolving attention module.

    +   - We contribute the General Pose Estimation dataset (GPE) and Specific Pose
    Estimation dataset (SPE) for WiFi-based 2D multi-person pose estimation, which
    contains 344,886 data pairs in total (1 image frame and 1 frame-level CSI data).


    # 2. Related works


    # 2.1. RGB-Based 2D person pose estimation.


    Camera-based 2D person pose estimation aims at detecting keypoints or body segmentation
    of all persons from an RGB image/video. Most approaches can be categorized into
    two classes: bottom-up and top-down approaches. The bottom-up approaches [21,22]
    first detect human keypoints of all persons, and then associate them with each
    person. On the other hand, the top-down approaches [23,24] use detection algorithms
    [25] to detect persons first, e.g., using Mask R-CNN [26], and then estimate single-person
    keypoints or parts. Although top-down approaches usually perform better than bottom-up
    approaches, they are restricted to the performance of human detectors. Compared
    to camera-based approaches, the proposed Wifi-based approach can be used for different
    scenarios, e.g., low-light conditions, privacy-sensitive applications, and through-wall
    pose estimation.


    # 2.2. Non-RGB based pose estimation.


    Research works using Wifi signals as probes have received a great amount of attention
    these years due to the low-cost settings and high availability of Wifi. As a result,
    many Wifi-based activity interpretation tasks have been explored such as indoor
    positioning [27,28], action recognition [29], person identification [30] and human
    pose estimation [11,12,16,31]. Research shows that Wifi signals can be used as
    a robust data source to reconstruct 2D human poses. Person-in-WiFi (PiW) [12],
    for example, adopts end-to-end learning by using CNN to map CSI signals to a Segmentation
    Mask (SM), Joint Heatmaps (JHMs) and Part Affinity Fields (PAFs), which are further
    used to predict multi-person poses via joint association. Instead of keypoints,
    Wi-Pose [16] utilizes a skeleton mask as supervision for better robustness. Differing
    from previous work, our work focuses on finding a better architecture for cross-modal
    transformation. It is worth noting that a recent work 1) studies 3D human pose
    estimation from Wifi signals [31], which uses a system composed of 21 infrared
    cameras to obtain ground truth as supervision, and 2) addresses the cross-domain
    issue by taking the 3D velocity profile as the input. However, to obtain a 3D
    velocity profile, subjects are required to perform activities within a small space
    surrounded by 3 groups of antennas of different heights. Such a complicated device
    setting limits the applicability of the method. [32] fuses the amplitude and phase
    of CSI into images, and designs a network to extract features associated with
    poses from CSI images. Though it appears to achieve satisfying results, its experimental
    setup, which contains only data from 5 subjects walking in a single environment,
    is not sufficient to comprehensively evaluate the model performance. Moreover,
    [31,32] can only achieve single-person pose estimation while our proposed method
    can be implemented in a multi-person scenario.


    In addition to Wifi, other non-RGB based pose estimations have also drawn a lot
    of attention[33], is the first work using RF signals to capture through-wall human
    figures. It utilizes a Frequency Modulated Carrier Wave(FMCW) system that transmits
