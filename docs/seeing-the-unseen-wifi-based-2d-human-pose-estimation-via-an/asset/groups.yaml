    kernel size of Ns × 1 × 1 without padding is then applied to each branch as a
    role to obtain comprehensive information from consecutive samples. Finally, we
    concatenate frequency features extracted from the five branches with spatial features
    as the spatial-frequency features.²


    # 3.4. Evolving attention module


    After deriving the spatial-frequency features, we need to address the second challenge
    that requires a module able to dynamically identify the associated features from
    specific channels and eliminate unrelated features since the important channels
    may be different through time. Existing methods of WiFi-based 2D human pose estimation
    [11,12,16] ignore temporal information, which leads to a mediocre performance
    for moving users. In addition, for each channel, the amount of information provided
    by different sequences is not equal. Based on these observations, we design a
    new evolving attention module to capture two important aspects: (1) the influence
    between different channels at the same time, and (2) the interactions among the
    same channel across a time series.


    Specifically, we propose an evolving attention module, which derives the dynamic
    attention masks along the sequence. The spatial-frequency feature sequence \(f_{seq}
    = [f_{t-\Delta t \times d} f_{t-(\Delta t-1) \times d} \cdots f_t] \in \mathbb{R}^{T
    \times H \times W \times C}\), where \(d\) represents the dilated rate. We use
    a channel-wise Global Average Pooling (GAP) to extract the global information
    from \(f_{seq}\). The dimension of \(f_t\) in the feature sequence is \(1 \times
    1 \times C\) after GAP. A 1D convolution with kernel size \(k\) is then used to
    generate channel attention mask:


    \(A_t = Conv_k(f_t)\)


    where \(A_t \in \mathbb{R}^{1 \times 1 \times C}\) represents the generated channel
    attention mask at the t-th timestamp. The parameters of this 1D convolution are
    shared between features of \(f_{seq}\) at different timestamps. Thereafter, we
    apply a GRU [37] layer to evolve the attention masks by capturing context information
    through different times (\(t\)). Let \(h_t\) denote the evolving attention mask
    generated at the t-th timestamp and \(G\) denotes the function of GRU. The evolving
    attention is then computed as follows:


    \(h_t = G(A_{t-1}, h_{t-1})\)


