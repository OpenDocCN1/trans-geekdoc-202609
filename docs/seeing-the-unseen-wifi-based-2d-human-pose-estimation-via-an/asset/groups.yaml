    specific channels and eliminate unrelated features since the important channels
    may be different through time. Existing methods of WiFi-based 2D human pose estimation
    [11,12,16] ignore temporal information, which leads to a mediocre performance
    for moving users. In addition, for each channel, the amount of information provided
    by different sequences is not equal. Based on these observations, we design a
    new evolving attention module to capture two important aspects: (1) the influence
    between different channels at the same time, and (2) the interactions among the
    same channel across a time series.


    Specifically, we propose an evolving attention module, which derives the dynamic
    attention masks along the sequence. The spatial-frequency feature sequence \(f_{seq}
    = [f_{t-\Delta t \times d} f_{t-(\Delta t-1) \times d} \cdots f_t] \in \mathbb{R}^{T
    \times H \times W \times C}\), where \(d\) represents the dilated rate. We use
    a channel-wise Global Average Pooling (GAP) to extract the global information
    from \(f_{seq}\). The dimension of \(f_t\) in the feature sequence is \(1 \times
    1 \times C\) after GAP. A 1D convolution with kernel size \(k\) is then used to
    generate channel attention mask:


    \(A_t = Conv_k(f_t)\)


    where \(A_t \in \mathbb{R}^{1 \times 1 \times C}\) represents the generated channel
    attention mask at the t-th timestamp. The parameters of this 1D convolution are
    shared between features of \(f_{seq}\) at different timestamps. Thereafter, we
    apply a GRU [37] layer to evolve the attention masks by capturing context information
    through different times (\(t\)). Let \(h_t\) denote the evolving attention mask
    generated at the t-th timestamp and \(G\) denotes the function of GRU. The evolving
    attention is then computed as follows:


    \(h_t = G(A_{t-1}, h_{t-1})\)


    ### 3.5. Feature decoder and loss


    After deriving the enhanced features by the proposed evolving attention module,
    we use a feature decoder to map the extracted features into two output feature
    maps: joint heatmaps (JHMs) and part affinity fields (PAFs). The generated JHMs
    and PAFs are both used for generating human poses via joint association. Therefore,
    we optimize the loss functions by minimizing the difference of PAFs and JHMs between
    the poses predicted by our model and OpenPose [20]. The final loss, denoted by
    \(L_{final}\) is summarized as follows.


    \(L_{final} = \lambda_1 L_{JHM} + \lambda_2 L_{PAF}\)


    ² The details of the network including dimensions of feature maps, SPE dataset
    and GPE dataset are presented on our project page.


    \(L_{JHM} = \sum_m \|\hat{m} - m\|_2^2, \quad m \in M\)


    \(L_{PAF} = \sum_n \|\hat{n} - n\|_2^2, \quad n \in N\)


    where \(M\) and \(N\) represent the sets of JHM pixels and PAF pixels, while \(\hat{m}\)
    and \(\hat{n}\) are the predicted values. The scalar weights \(\lambda_1\) and
    \(\lambda_2\) are used for balancing the two sub-losses.


    ## 4. Dataset


    Due to the lack of benchmarks, we have collected two datasets, General Pose Estimation
    (GPE) and Specific Pose Estimation (SPE) datasets, to evaluate the performance
    of the proposed method. We pair the CSI data and RGB frames by matching the frame-level
    CSI data consisting of 25 CSI samples recorded at 50Hz with one RGB frame sampled
    at 800 x 600 resolution and 20 fps. We synchronize each RGB frame with frame-level
    CSI data according to timestamps, and each RGB frame is fed into OpenPose [20]
    to obtain human joint heatmaps (JHMs) and part affinity fields (PAFs), which serves
    as the ground truth for prediction.


    ### 4.1. GPE Dataset


    In this dataset, we follow the experimental settings of the mainstream works,
    such as PIW [12] and Wi-Pose [16]. Nine volunteers are recruited and asked to
    perform daily activities such as walking, using smartphones, and waving hands.
    The GPE dataset contains 106,695 data pairs and is collected at 2 spaces, one
    classroom and one hall, with depths of 9m and 11m respectively. The number of
    people in the scene ranges from 1 to 5. Moreover, GPE includes data collected
    under a dark scenario and a through-wall scenario for testing pose estimation
    under specific conditions. We manually label the human pose as the ground truth
    for the dark scenario and set up the through-wall scenario by placing the transmitter
    right outside the concrete wall of the classroom with the receiver and the camera
    inside the classroom.


    ### 4.2. SPE Dataset


    As the existing datasets do not provide detailed action information, it is difficult
    to evaluate the performance variance of different actions. Therefore, we collect
    the SPE dataset to better evaluate the performance of WiFi-based pose estimation
    under different conditions. Specifically, the SPE dataset is a single person dataset
    where each subject is asked to perform four specific actions: 1) walking, 2) waving
    hands, 3) running and 4) jumping jacks. We choose these four actions because they
    contain a large variety of moving speeds and displacements. In fact, most properties
    of daily activities involve these four testing actions, which can demonstrate
    the performance of different kinds of common actions. We recruit 30 volunteers
    (19 males and 11 females) with heights ranging from 1.56m to 1.92m to evaluate
    the robustness of different subjects. All data is collected from 6 classrooms
    or halls of different sizes. The total size of the dataset is 238,191 data pairs.


