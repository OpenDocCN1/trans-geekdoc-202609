    # 5.5. Qualitative results


    Fig. 3 illustrates the examples of human poses generated from CSI signals by EASFN
    and the other methods. We choose samples from three subjects with different actions
    (walking, waving, and complex stretching actions). The results show that EASFN
    generates more accurate poses for different actions since it effectively learns
    the static spatial features and dynamic frequency features across continuous frames.
    The other contenders can approximately detect the human torso but perform poorly
    at estimating joints in human arms and legs. These joints are difficult to predict
    because arms and legs usually have complicated actions across the time. However,
    with the evolving attention module, EASFN can pay more attention to the specific
    channels of moving arms and legs. By learning the dependency between channels
    across the time, EASFN estimates the joints in arms or legs accurately.


