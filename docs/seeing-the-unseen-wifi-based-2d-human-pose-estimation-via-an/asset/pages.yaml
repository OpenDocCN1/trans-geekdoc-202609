    different dilated rates.


    Table 3 shows the results of different models in terms of PCK@20, which verifies
    our assumptions. First of all, the baseline has better performance than PIW, demonstrating
    that Unet is not suitable for Wifi signal and thus leads to worse performance.
    In contrast, C1 outperforms the baseline by a large margin since the spatial-frequency
    encoder is designed for Wifi and can extract both the spatial semantic information
    of the environment and human movement information. Moreover, the attention mechanism
    (C2) is beneficial for pose estimation by focusing on certain channels. However,
    if the attention masks are derived simply from single frame-level features, the
    performance only slightly increases by around 1% in terms of PCK@20. On the other
    hand, the proposed evolving attention module (C3-C5) can increase the performance
    at least by 2%. The different outcomes between C3 and C4 imply that increasing
    the receptive field across time can improve performance by around 2%. Nevertheless,
    a comparison of the results of C4 and C5 shows that if the receptive field is
    too large across time, it can deteriorate the performance. This is why we take
    EASFN with d=3 as the proposed method.


