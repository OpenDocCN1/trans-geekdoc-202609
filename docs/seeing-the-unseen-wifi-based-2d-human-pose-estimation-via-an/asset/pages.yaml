    # 6. Conclusion


    We propose an evolving attentive spatial-frequency network for WiFi-based 2D human
    pose estimation. To learn effective representations from abstract CSI signals,
    we extract static spatial and dynamic frequency information simultaneously via
    a spatial-frequency encoder. We also leverage an evolving attention module to
    learn channel weights and temporal dependency between consecutively dilated frames.
    In addition, two datasets are introduced and publicly released for further research.
    Extensive experiments show that our model outperforms state-of-the-art approaches
    by a large margin. Though we have achieved considerable progress, there are still
    challenges left unsolved, which are crucial for applying WiFi-based human pose
    estimation in a real-world application. In this work, we conduct experiments under
    well-controlled environments. However, in a real-world scenario, other moving
    objects, i.e. oscillating fans, or house pets, may lead to a more complicated
    Wifi response. How to adapt WiFi-based human pose estimation to such a challenging
    scenario is left as our future work.


