    | Action | WiSPPN | PIW | Wi-Mose | EASFN |

    |---|---|---|---|---|

    | Walking | 23.58% | 39.87% | 42.97% | **61.14%** |

    | Waving | 25.92% | 33.06% | 33.49% | **45.81%** |

    | Running | 22.12% | 37.91% | 35.71% | **58.11%** |

    | Jumping | 15.82% | 20.99% | 21.97% | **35.15%** |


    PIW simply aggregate both subcarriers and consecutive samples by channel dimension
    of convolutional layers, which loses the sequential relationship. Therefore, without
    long-term consecutive information, previous works perform inferior to EASFN. The
    PCK curves of all approaches are provided in Fig. 2, which illustrates that EASFN
    outperforms other methods by a large margin with respect to all PCK thresholds.


    # 5.3. Detailed analysis on each action


    We further investigate the performance of our model with other methods with different
    human actions on the SPE dataset. Table 2 presents the comparative results, revealing
    the advantage of EASFN for predicting moving subjects. Specifically, for the actions
    of Walking and Running, EASFN significantly improves the baselines, i.e., by about
    21% over PIW and 37% over WiSPPN, because the frequency features are sensitive
    to moving subjects, while the evolving attention module adaptively adjusts the
    weights of each channel to focus on specific frequency features. The lowest improvement
    is in the cases of waving, i.e., only 12% over PIW and 20% over WiSPPN. This is
    because volunteers only wave their hands or arms while keeping their torso static,
    and the performance on static keypoints is similar for the different methods.


    From Table 2, we can also observe that EASFN achieves the worst result when handling
    the pose of jumping. Accurately estimating the human pose of jumping is an arduous
    task. It requires fine time granularity to capture the thin and fast-moving limbs.
    Specifically, jumping can be regarded as high-speed waving, and therefore using
    CSI sampled at the same time granularity to estimate the movement of higher speed
    would lead to a performance drop. In that case, one possible solution to improve
    EASFN''s ability to handle jumping is to increase the sampling rate of CSI samples,
    which can refine the time granularity of data. To investigate the relation between
    the sampling rate of CSI and pose estimation result, we need to collect a larger
    dataset including multiple sampling rates, which is left as our future work.'
