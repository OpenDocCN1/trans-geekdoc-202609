    +   Spatial-Frequency network\n\n## ABSTRACT\n\nCamera-based human pose estimation\
    \ has become popular due to its wide applications and easy implementation. However,\
    \ it is not applicable under several circumstances such as poor illumination,\
    \ occlusion, and private protection. In this work, we utilize Wifi signals to\
    \ estimate 2D human poses, which is challenging because Wifi signals are abstract\
    \ and contain limited information. To address these challenges, we develop an\
    \ evolving attentive spatial-frequency network to discover the relationship between\
    \ signal variation and body movement for WiFi-based 2D human pose estimation.\
    \ By first taking dilated CSI sequences as inputs, a spatial-frequency encoder\
    \ is then introduced to effectively integrate static spatial information and dynamic\
    \ frequency information from CSI signals. Finally, we design an evolving attention\
    \ module to enable our model to attend to certain channels of features. Due to\
    \ a lack of benchmarks, we propose two Wifi-based human pose estimation datasets,\
    \ the General Pose Estimation dataset (GPE) and Specific Pose Estimation dataset\
    \ (SPE), which have been released as a public download at project page. Extensive\
    \ experiments on the proposed datasets show that our model outperforms the state-of-the-art\
    \ method by at least 16% in terms of PCK@20 (percentage of correct keypoints).\n\
    \n© 2023 Elsevier B.V. All rights reserved.\n\n# ## 1. Introduction\n\nMulti-person\
    \ 2D pose estimation [1–3] targets and locates anatomical keypoints or “parts”\
    \ of all people in RGB images. It is a fundamental problem of widespread applications\
    \ such as crowd estimation [4,5], visual tracking [6], pose tracking [7], hand\
    \ tracking [8] and virtual try-on [9,10]. However, camera-based 2D human pose\
    \ estimation methods are not applicable in some application scenarios, such as\
    \ with poor illumination, and most importantly, camera-based approaches are prohibited\
    \ in high-privacy environments, such as toilets and changing rooms.\n\nIn this\
    \ paper, we focus on estimating 2D human pose by using Wifi signals. Compared\
    \ to camera-based approaches, Wifi-based pose estimation approaches are advantageous\
    \ in poorly-lit and privacy-protected environments. In addition, these approaches\n\
    \nare low-cost and convenient for collecting data due to the ubiquity of Wifi\
    \ devices. Although a few works and surveys have been proposed to estimate poses\
    \ from Wifi [11–13], they simply apply an off-the-shelf deep neural network backbone,\
    \ such as ResNet [14] and Unet [15], which are originally designed for computer\
    \ vision tasks. Without considering the characteristics of Wifi, these backbone\
    \ models may lead to an inferior performance on Wifi feature extraction.\n\nIn\
    \ fact, the accuracy of the 2D human pose estimation from Wifi signals is limited\
    \ due to the following two challenges. The first involves implicit relationships.\
    \ Wifi signals are abstract and contain limited information, so how to transform\
    \ Wifi signals into poses is currently unknown. One possible approach is to use\
    \ end-to-end training with well-designed deep learning architectures. However,\
