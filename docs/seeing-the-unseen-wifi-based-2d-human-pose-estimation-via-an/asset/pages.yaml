    # ## 3. Evolving attentive spatial-Frequency network


    # ### 3.1. Overview


    CSI signals [36] record the signal variation between the transmitter and receiver
    antennas. When users are located between the transmitters and receivers, the received
    signals are highly affected by human poses. Moreover, the frequency variation
    in CSI signals reveals human activities and human movement speed [19]. Nevertheless,
    it is difficult to estimate 2D human poses from Wifi signals due to the limited
    information. To address this issue, we introduce a evolving attentive spatial-frequency
    network, which effectively aggregates dynamic frequency information and spatial
    semantic information of the scene as well as freqeuncy information related to
    the movement. Moreover, to better estimate the poses of moving humans, we design
    an evolving attention module to attend to specific channels of spatial and frequency
    features across time. In the following, we present the details of these modules.


    # ### 3.2. Wifi signals and CSI


    According to the prevalent IEEE 802.11 n/g/ac protocols, the information transmitted
    through Wifi is carried by 30 subcarriers, which is known as orthogonal frequency
    division multiplexing (OFDM). The frequency of the subcarriers is located in the
    band centering at 2.4/5GHz with bandwidth 20/40/80/160MHz, and a multiple-input-multiple-output
    (MIMO) is also supported under the IEEE 802.11 n/g/ac protocols, which allows
    packages to be transmitted between multiple antenna pairs. During the transmission,
    Wifi signals might be changed due to several reasons, such as the multi-path fading
    effect or Doppler Effect caused by moving objects in the environment.


    As CSI signals are a physical layer indicator of the signal variation through
    channels, we use an open source CSI tool [36] to collect CSI signals and record
    a CSI sample containing 30 subcarriers


    with a bandwidth of 20 MHz centering at the standard 5GHz Wifi. As such, we use
    a laptop equipped with an Intel 5300 wireless network adapter with 3 antennas
    as the receiver and a personal computer with the same setting as the transmitter,
    which allows us to manipulate 3 x 3 MIMO mode. As a result, we obtain CSI samples
    S ∈ R^{NxNtxxNrx}. Where Ntx and Nrx respectively denote the number of transmitting
    and receiving antennas, and Nc represents the number of subcarriers.


    Let Ns denote the ratio between the sampling rate of CSI samples and RGB frames.
    In other words, for every Ns CSI sample, we synchronize with an RGB frame as one
    frame-level CSI data. The form of frame-level CSI data is commonly-used in previous
    works such as PIW [12] and WiSPPN [11]. To better capture the dynamic information
    across frames, we further take the previous T - 1 frame-level CSI data with a
    dilated rate d and current frame-level CSI data as the input to predict one RGB
    frame (as shown on the left-hand side in Fig. 1). By using the dilated rate d,
    the receptive field is greater across time. Let Cseq ∈ R^{TxNc x Ns x Ntx x Nrx}
    denote the dilated CSI sequence, which is the input of the spatial-frequency encoder.


    # ### 3.3. Spatial-Frequency encoder


    The goal of the proposed spatial-frequency encoder is to extract both the spatial
    semantic information of the scene and human movement information. Since CSI data
    are abstract and contain limited information, it is necessary to design an effective
    feature-extracting pipeline for mining the information from CSI signals. On the
    one hand, each transceiver pair contains different aspects of the environment
    channel states, so it is possible to reconstruct 2D spatial background information
    by integrating the 1D amplitude of each pair. On the other hand, existing works
    on signal processing [19] show that frequency of CSI amplitude fluctuation changes
    in accordance with the speed of human movement, which implies human motion can
    be captured by analyzing consecutive CSI samples. Therefore, we design a model
    that considers both intra-pair and inter-pair CSI information.


    Specifically, for extracting spatial features from Cseq, the spatial encoder block
    is composed of one 3D convolution layer with the kernel size of 1 x 3 x 3, followed
    by BatchNorm, the ReLU activation function and average pooling along the sample
    dimension. The convolution layer is first used to extract inter-pair information
    of 3 x 3 Wifi transceiver pairs, and since spatial features should not'
