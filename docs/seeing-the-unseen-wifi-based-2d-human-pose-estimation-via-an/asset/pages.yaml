    For the evaluation metric, Percentage of Correct Keypoints (PCK) is a widely-used
    metric for evaluating the performance of pose estimation, which measures the probability
    that a model correctly predicts the location of human joints within a tolerated
    error. Since the human body size varies in video frames due to displacement, the
    tolerated error should change with different human body sizes. Therefore, we take
    the distance from the right shoulder to the left hip as torso length and also
    correlate tolerated error with torso length using \(\alpha\) as follows.


    \(PCK@\alpha = \frac{1}{N} \sum_{n}^{N} \Phi(\frac{\|\hat{P}_{(i,n)} - P_{(i,n)}\|_2}{\|P_{(5,n)}
    - P_{(8,n)}\|_2})\) (6)


    \(\Phi(x) = \begin{cases} 1, & \text{if } x < \alpha \% \\ 0, & \text{otherwise,}
    \end{cases}\) (7)


    where \(i\) denotes the index of human joints, i.e., \(i \in \{1,2,\dots,18\}\)
    for the COCO\_18 model in OpenPose [20] and \(N\) represents the number of people
    in the test frames; \(P_{(i,n)}\) and \(\hat{P}_{(i,n)}\) refer to the coordinates
    of \(i\)-th joints of \(n\)-th person obtained from ground truth and prediction,
    respectively; \(\|P_{(5,n)} - P_{(8,n)}\|_2\) is torso length since the index
    of right shoulder and left hip are 5 and 8. We compare our method with other methods
    with different \(\alpha\), i.e., \(\alpha\) is set from 10 to 50. Note that PIW
    normalizes the error by a fraction of the bounding box size instead of torso length,
    and thus the PCK value reported in our work is greater.


    Our train-test split strategy follows PIW, by taking the first 80% of samples
    for training, and the last 20% for testing.


    # 5.2. Quantitative results


    We compare our approach with two state-of-the-art methods for WiFi-based 2D human
    pose estimation. The first is WiSPPN [11], which is an end-to-end CNN network
    supervised by a joint coordinate adjacency matrix. The second is PIW [12], which
    leverages a well-developed CNN to map Wifi signals into three supervision components:
    SM, JHMs, and PAFs. The third is Wi-Mose [32], which fuses the amplitude and phase
    of CSI signals into CSI images and uses a neural network to extract features from
    them.


    Table 1 compares EASFN with WiSPPN and PIW in terms of PCK@20. Please note that
    WiSPPN can only estimate poses in single-person scenes due to the limitation of
    the fixed dimension (\(18 \times 18 \times 3\)) of the supervision matrix. Therefore,
    we only train and test WiSPPN on the SPE dataset. The results show that our model
    outperforms other two approaches in both scenarios. In terms of PCK@20, our model
    outperforms WiSPPN and PIW on the SPE dataset by 28% and 17%, respectively. On
    the GPE dataset, the proposed EASFN outperforms PIW by 16% in terms of PCK@20.
    This improvement is attributed to our spatial-frequency encoder, which captures
    the temporal relationship between consecutive CSI signals by multiple frequency
    encoders of different kernel sizes while previous works ignore such temporal information.
    For instance, Wi-Mose treats consecutive CSI signals as images and uses kernels
    of the small receptive field (\(3 \times 3\)) to extract features, which performs
    poorly at capturing long-term patterns. Also, WiSPPN and


    ![](img/efd360d946b871d0c04d9f4466e6ac53_4_0.png)


