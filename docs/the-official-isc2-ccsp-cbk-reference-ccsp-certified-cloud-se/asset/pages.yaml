- pgno: 255
  md: 'any investigation? Can a law enforcement agency compel you to provide data
    housed in another country? All of these questions make cloud eDiscovery a distinct
    challenge.


    # eDiscovery Considerations


    When you’re considering a cloud vendor, eDiscovery should be considered during
    any contract negotiation phase. If you think about your cloud providers today,
    can you recall how many conversations you might have had with their support teams?
    Would you know who to contact if an investigation was needed?


    To pose another question, do you actually know where the data is physically housed?
    Many companies make use of the incredible replication and fail-over technologies
    of the modern cloud, but that means data may be in different time zones, countries,
    or continents when an investigation is launched. As we have outlined, laws in
    one country or state may in fact clash or break with laws of another. It is the
    duty of the cloud security profession to exercise due care and due diligence in
    documenting and understanding to the best of their ability the relevant laws and
    statutes pertaining to an investigation prior to it commencing.


    In some cases, proactive architectural decisions can simplify issues down the
    road. For example, if a company chooses to house customer data within their legally
    defined jurisdiction (for example, EU citizen data is always housed on cloud servers
    within the EU), it can simplify any potential investigations or jurisdictional
    arguments that might arise.


    # Conducting eDiscovery Investigations


    Where there is a problem in technology, there is usually a solution, and the marketplace
    for eDiscovery tools has grown commensurately with the explosion in the use of
    cloud service providers. There are a healthy number of vendors that specialize
    in this area. For a CCSP, it is important to learn about eDiscovery actors when
    evaluating contracts and service level agreements (SLAs) to determine what forms
    of eDiscovery are permissible. These are the main types of investigatory methods:


    +   - **SaaS-based eDiscovery:** Why not use the cloud to perform eDiscovery on
    the cloud? These tools from a variety of vendors are used by investigators and
    law firms to collect, preserve, and review data.

    +   - **Hosted eDiscovery:** In this method, your hosting provider includes eDiscovery
    services in the contractual obligations that can be exercised when and if necessary.
    This may limit a customer to a preselected list of forensic solutions, as CSPs
    are often wary of customer-provided tools due to the potential for affecting other
    cloud customers during the process.

    +   - **Third-party eDiscovery:** When there are no obligations in a contract,
    a third party may be contracted to perform eDiscovery operations. In this model,
    the CCSP must work especially closely with the third party to provide appropriate
    access to necessary resources in the cloud.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Cloud Forensics and Standards


    As you can see, the forensic and eDiscovery requirements for many legal controls
    are greatly complicated by the cloud environment. Unlike on-premises systems,
    it can be difficult or impossible to perform physical search and seizure of cloud
    resources such as storage or hard drives. Standards from bodies such as the International
    Organization for Standardization (ISO)/International Electrotechnical Commission
    (IEC) and the Cloud Security Alliance (CSA) provide guidance to cloud security
    practitioners on best practices for collecting digital evidence and conducting
    forensics investigations in cloud environments. CCSPs should be familiar with
    the following standards:


    +   - **Cloud Security Alliance:** The CSA Security Guidance Domain 3: Legal Issues:
    Contracts and Electronic Discovery highlights some of the legal aspects raised
    by cloud computing. Of particular importance to CCSPs are the guidance provided
    on negotiating contracts with cloud service providers in regard to eDiscovery,
    searchability, and preservation of data.

    +   - **ISO/IEC 27037:2012:** This provides guidelines for the handling of digital
    evidence, which include the identification, collection, acquisition, and preservation
    of data related to a specific case.

    +   - **ISO/IEC 27041:2014-01:** This provides guidance on mechanisms for ensuring
    that methods and processes used in the investigation of information security incidents
    are “fit for purpose.” CCSPs should pay close attention to sections on how vendor
    and third-party testing can be used to assist with assurance processes.

    +   - **ISO-IEC 27042:2014-01:** This standard is a guideline for the analysis
    and interpretation of digital evidence. A CCSP can use these methods to demonstrate
    proficiency and competence with an investigative team.

    +   - **ISO/IEC 27043:** The security techniques document covers incident investigation
    principles and processes. This can help a CCSP as a “playbook” for many types
    of incidents, including unauthorized access, data corruption, system crashes,
    information security breaches, and other digital investigations.

    +   - **ISO/IEC 27050-1:** This standard covers electronic discovery, the process
    of discovering pertinent electronically stored information involved in an investigation.


    # UNDERSTANDING PRIVACY ISSUES


    The Internet age has brought with it an unprecedented amount of information flow.
    Knowledge (and cat videos) is shared by billions of Internet-connected humans
    at the speed of light around the world every day. The flow of information is two-way,
    however,'
