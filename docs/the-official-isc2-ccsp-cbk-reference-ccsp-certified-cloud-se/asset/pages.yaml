- pgno: 112
  md: '# Storage


    Cloud storage has a number of potential security issues. These responsibilities
    are shared by the customer and the CSP. At a basic level, the CSP is responsible
    for physical protection of data centers, and the customer is responsible for the
    security and privacy of data and customer information. The CSP is responsible
    for the security patches and maintenance of data storage technologies and other
    data services they provide, such as an AWS S3 bucket. The customer is responsible
    for using these storage tools securely.


    These tools provided by the CSP will provide a set of controls for secure storage.
    The customer is responsible for assessing the adequacy of these controls and properly
    configuring and using the controls available. These controls can include how the
    data is accessed (through the public Internet or via a VPN, for example) and how
    the data is protected at rest and in motion. For example, the CSP may provide
    the ability to encrypt data at rest and methods to transfer data securely. It
    is the customer’s responsibility to use these controls to protect their data.
    Failure to properly configure secure storage using available controls is the fault
    of the customer.


    In a cloud environment, you lose control of the physical medium where your data
    is stored while retaining responsibility for the security and privacy of that
    data. These challenges include the inability to securely wipe physical storage
    and the possibility of a tenant being allocated storage space you once had allocated
    to you. This creates the possibility of fragments of your data files existing
    on another tenant’s allocated storage space. You retain responsibility for this
    data and cannot rely on the CSP to securely wipe the physical storage areas.


    Compensating controls for the lack of physical control of the storage medium include
    only storing data in an encrypted fashion and employing crypto shredding when
    the data is no longer needed. These controls will provide protection against data
    fragments being retrieved.


    # Management Plane


    The management plane provides the tools (web interface and APIs) necessary to
    configure, monitor, and control your cloud environment. It is separate from and
    works with the control plane and the data plane. If you have control of the management
    plane, you have control of the cloud environment.


    Control of the management plane is essential and starts with limiting and controlling
    access to the management plane. If you lose control of the management plane, you
    are no longer in control of your cloud environment.


    The most important account to protect is root, or any named account that has administrative/superuser
    functionality. The start of this protection is enforcement of a strong password
    policy. The definition of a strong password is an evolving question'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'that has recently been addressed by NIST in SP 800-63, Digital Identity Guidelines.
    In the final analysis, longer is better, and passphrases are easy to remember
    and difficult to guess.


    A strong password policy needs to be coupled with other measures for the critical
    root and administrative accounts. They have the keys to the kingdom, so to speak.
    Multifactor authentication (MFA) should also be implemented. The best method is
    a hardware token that is stored securely. But other methods also improve on basic
    password protections, to include hardware tokens kept by individuals, or even
    SMS texts. In general, software solutions add some protection, but not as much
    as the hardware solutions. Over time, some methods will be or have been shown
    to be less secure than others. Where possible, less secure methods should be supplemented
    by or replaced by more secure methods.


    Role-based access control (RBAC) or access groups are other methods to limit access
    to these sensitive accounts. Using RBAC or access groups makes management of these
    groups and permissions important. If rights are not deleted when an employee changes
    positions or employment, access can become too broad very quickly. Another step
    is to limit access to users on-premise or through a VPN, if remote work is required.


    Another method for limiting access is to use attribute-based access control (ABAC),
    also called policy-based access control. Using this method, a variety of attributes
    can be used with complex Boolean expressions to determine access. Typical attributes
    such as username can be used as well as atypical attributes such as geographic
    and time restrictions. For example, you must be on a corporate endpoint attached
    to the corporate network locally if accessing the accounts after-hours.


    Each of these methods can make accessing critical root or administrative accounts
    more difficult for both legitimate users and malicious users alike. How tightly
    you lock down these accounts is in direct proportion to how valuable the information
    and processes in your cloud are to your business. There is a balance in this,
    to create as much security as possible while maintaining reasonable business access.


    Root and administrative accounts are typically the only accounts with access to
    the management plane. The end user will generally have some limited access to
    the service offering tools for provisioning, configuring, and managing resources.
    The degree of control will be determined by each business. The end user will normally
    be restricted from accessing the management plane. The separation of management
    and other workforce uses makes the creation of separate accounts for development,
    testing, and production an important method of control.


    In instances where the management functions are shared between the customer and
    the CSP, careful separation of those functions is necessary to provide proper
    authorization and control. In a Cisco cloud environment, the management plane
    protection (MPP) tool is available. AWS provides the AWS Management Console.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'These are some of the methods that can be used to protect the cloud management
    plane. A layered defense is important, and the amount of work used to protect
    the management plane is, in the end, a business decision. The cloud security professional
    must be aware of the methods available for protection in order to be a trusted
    advisor to the business in this matter.


    # DESIGN A SECURE DATA CENTER


    Designing a secure data center can be challenging with the physical siting, environmental,
    logical and physical controls, and communication needs. In a cloud environment,
    many of these traditional concerns are the responsibility of the CSP or cloud
    vendor as they have physical control and ownership of the data center and the
    physical infrastructure. The customer may be able to review the physical, environmental,
    and logical controls of the underlying infrastructure of the vendor in limited
    cases.


    If the vendor uses a CSP such as Google, Amazon, or IBM to provide their infrastructure
    needs, this becomes logistically impossible as each has more than 60 data centers,
    located in the four regions of North America; Asia-Pacific (APAC); Europe, Middle
    East, and Africa (EMEA); and Latin America.


    Cloud customers have the ability to create a logical data center. A logical data
    center is a construct, much like a container, where the customer designs the services,
    data storage, and connectivity within their instance of the cloud service. However,
    the physical mapping of this design to the underlying architecture is not controlled
    by the customer as it would be in an on-premise data center.


    # Logical Design


    The logical design of a data center is an abstraction. In designing a logical
    data center, the customer utilizes software and services provided by the CSP.
    If used securely, the logical design can provide a secure data center. The needs
    of a data center include access management, monitoring for compliance and regulatory
    requirements, patch management, log capture and analysis, and configuration of
    all services.


    In a logical data center design, a perimeter needs to be established with IAM
    and monitoring of all attempts to access the data. Access control can be accomplished
    through various IAM methods, including authentication and authorization, security
    groups, VPCs, management and other consoles, and so on. The CSP equivalent to
    software firewalls, traffic monitoring, and similar services can be implemented
    to monitor data center activities and alert on potentially malicious behavior.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'All services used should have a standard configuration. This configuration
    is determined by the business and specifies how each approved cloud service is
    to be configured and can be used. Using a standard pattern/configuration makes
    administering and maintaining cloud services simpler and often more secure. Variations
    from patterns approved by each business should be approved through an exception
    process that includes the risk of any variance. Secure baseline configurations
    can provide a more secure environment for the data center. The configuration of
    these cloud services can be monitored and changes can be either prevented or alerted
    and logged.


    Connections to and from the logical data center must be secured using VPNs, Transport
    Layer Security (TLS), or other secure transmission methods. With an increasingly
    remote and mobile workforce, the need to access the data center becomes more important.
    A careful logical design can help to ensure that a secure data center in the cloud
    is possible.


    # Tenant Partitioning


    Multitenant models make cloud computing more affordable but create some security
    and privacy concerns. If the walls between tenants are breached, your data is
    at risk. Multitenancy is not a new concept. Many business centers physically house
    multiple tenants. These business centers may provide some access control to the
    building and other general security services. But, if another tenant, a custodian,
    or other service vendor accesses your offices, then your data could be at risk.
    If the data is on whiteboards or scattered on various desks and in unsecured computing
    systems, it is at risk.


    In a similar fashion, multiple customers share computing resources in a cloud
    environment. The vendor provides some basic security services, as well as maintenance
    and other services. However, if you leave your data “lying around,” then your
    data could still be at risk and exfiltrated. However, if you monitor access, provide
    robust IAM services, and encrypt data in transit and at rest, the risk is greatly
    minimized.


    In our physical business center example, if you lock up your servers and all of
    your data but leave the keys in a desk drawer or with the business center owner,
    security is lessened. In the same way, the security provided by encryption is
    improved if the customer securely maintains their own encryption keys external
    to the cloud vendor.


    # Access Control


    When creating a logical data center, a primary concern is access. A single point
    of access makes access control simpler and monitoring better. If you have a physical
    data center with multiple doors and windows, securing the data center is more
    difficult. This is no different in a logical data center.'
  merge: -1
  img_proc: true
- pgno: 116
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 117
  md: 'Sometimes a customer has data that must be kept on-premise when there are legal
    reasons that prevent data from crossing borders, unless the CSP contract can satisfy
    this requirement. Other customers may have data that is sufficiently sensitive
    that a breach could place individuals in harms’ way. If a business does not have
    data that should stay on-premise, all of the data could be migrated to the cloud
    if a business case can be made for this migration.


    For many business processes, cloud computing provides significant advantages with
    respect to cost, availability, and scalability. But cloud computing is not always
    the best approach for all business processes and data.


    # Environmental Design


    The environmental design like the physical location of a data center is also the
    responsibility of the CSP or cloud vendor, except for a private cloud. Environmental
    design can impact the availability of cloud resources. For the cloud customer,
    review of the basic design of a vendor or CSP’s environmental design can be part
    of the risk analysis of the vendor.


    # Heating, Ventilation, and Air Conditioning


    Electrical service is clearly a concern with any computing installation and has
    been discussed in other sections. Equally important is the ability to provide
    appropriate heating, ventilation, and air conditioning (HVAC) support for the
    facility. This can be partly mitigated by the physical siting of the facility
    and the construction of the facility. A facility in Canada will need to consider
    heating and ventilation more carefully than air conditioning (AC). Similarly,
    a data center near the equator will have greater concerns for AC than heat.


    Regardless, HVAC concerns should be considered carefully when choosing the site
    for an on-premise data center or when reviewing potential cloud vendors. An HVAC
    failure will affect computing resources just as surely as an electrical or communication
    disruption. Because of the importance of HVAC in a CSP data center, part of the
    review of a CSP must include capacity and redundancy of HVAC systems as well as
    the process for movement between data centers when necessary. This includes the
    geographic location of the CSP data center. A data center in Hawaii may be more
    concerned with ventilation and humidity. A data center in Austin, Texas, would
    need to focus on air conditioning, and a data center in Edmonton, Canada, would
    focus on heating.


    A number of documents can help assess HVAC concerns. A CSP SOC-2 report should
    have a section on availability and the controls that provide it. This should include'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'environmental systems. SOC-2 reports can be difficult to obtain and may require
    a nondisclosure agreement (NDA). Other documents that may assist in determining
    a CSP’s environmental design sufficiency would be business continuity and disaster
    recovery plans.


    # Multivendor Pathway Connectivity


    Connectivity is critical in a cloud computing environment. The ability for a customer
    to remain connected to all cloud resources requires planning. The issue is rarely
    with the Internet, but instead is with the connectivity to the Internet of the
    customer or of the CSP. The solution often requires the use of multiple ISPs or
    multiple vendors providing connectivity.


    These two issues are connectivity from the customer to the Internet and the connection
    of the CSP to the Internet. The concerns are similar but independent. A communication
    failure at the customer’s end would impact that single tenant while leaving the
    vendor and all other tenants unaffected.


    The cloud customer should consider multiple paths for communicating with their
    cloud vendor. In an era of increasingly dispersed workforce, often working from
    locations separate from the business network, strategies to keep the workforce
    connected to the Internet and the cloud vendors must be developed and tested.
    The solution often requires multiple vendors.


    The vendor must also develop multiple connectivity strategies. If the vendor cannot
    access the Internet, it does not matter whether all the tenants can because they
    will be unable to access their cloud resources. The customer also needs a strategy
    for times that the vendor is unavailable. How will the customer continue to execute
    critical business functions? One way is to have multiple vendors for critical
    functions.


    For example, if enabling the dispersed workforce to communicate and collaborate
    is a critical business function, multiple methods can be developed and tested.
    A simple example is with online meetings.


    # ANALYZE RISKS ASSOCIATED WITH CLOUD INFRASTRUCTURE


    Any data center or cloud infrastructure has risks, whether it’s on-premise or
    hosted by a third party. Many organizations are moving from an on-premise to a
    cloud-based infrastructure and must properly consider the risks associated with
    this move. A cloud-based infrastructure is not less risky; it is differently risky.
    A move to the cloud must consider'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'these risks and do a cost-benefit analysis to ensure the cloud is the right
    move. In the end, after analyzing the risks, many organizations will end up with
    a hybrid environment with some local infrastructure for some processes/solutions
    and one or more cloud environments for other processes/solutions.


    # Risk Assessment and Analysis


    The risk analysis of any CSP or cloud solution involves many departments. These
    include business units, vendor management, privacy, and information security.
    The new risks with a cloud solution are mostly associated with privacy and information
    security. There are some key issues when conducting a risk assessment for a CSP
    or cloud solution. Some major issues will be discussed.


    Authentication is a key question. Will the cloud solution provide authentication
    services, or will the cloud solution be authenticated by the customer. If using
    the cloud solution’s authentication, it is unknown if the cloud provider’s authentication
    is secure. As users have the tendency to reuse passwords, a breach of the cloud
    service’s authentication server may also provide the information necessary to
    breach your on-premise systems.


    If the customer provides their own IAM system, it may be accomplished through
    a SaaS IAM solution, or through federation with the customer’s on-premise IAM
    manager. Each solution has pros and cons. For example, if using a SaaS IAM system,
    users are likely to use the same username and password for both the cloud and
    on-premise IAM systems. However, the SaaS IAM has been designed for the cloud
    and cloud security needs. If federating the cloud service to the on-premise system,
    cross-connection between the two environments may create a security concern as
    well. In either case, user education is an important component to the cloud IAM
    strategy.


    Data security is a concern. How a vendor encrypts data at rest is important. In
    addition, the method used to transfer data to and from the vendor and between
    the vendor and any third-party services used by the vendor must be investigated.
    The data remains the responsibility of the customer even when stored on the vendor’s
    system.


    It is important to assess any risk posed by the vendor’s policies and processes.
    These include the vendor’s privacy policy, incident response process, cookie policies,
    information security policy, etc. You are no longer assessing only your organizational
    policies but also the policies of the organizations with whom you are doing business.


    For some key systems, it is important to assess the support provided for incident
    response. This includes an assessment of logging support, vulnerability scans
    of the vendor, application vulnerability scans, and external assessments of the
    vendor being considered or currently used.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Many vendors providing services will have a SOC-2 or SOC-3 report. The preferred
    report is a SOC-2 Type-2 report. Accessing this report, if possible, will usually
    require an NDA. However, the assurance this type of report can provide is worth
    an NDA. Other useful attestations are ISO 27017 (Cloud Security) and ISO 27018
    (Privacy) in particular and ISO 2700X certifications in general, FISMA, and FEDRAMP.
    Carefully read the cover letter provided by the third-party assessor for an understanding
    of any special circumstances governing the findings in the report.


    # Cloud Vulnerabilities, Threats, and Attacks


    The primary vulnerability in the cloud is that it is an Internet-based model.
    Anyone with access to the Internet has the potential to attack your CSP, your
    cloud provider, or you. For example, if you are an international business or are
    involved in a business that is not well regarded throughout the world (even if
    your business is legal in the country where you conduct it), you may be the subject
    of an attack that creates a potential data breach and/or a denial of service (DoS).


    The attack on your CSP or cloud vendor may be unrelated to you, so the typical
    threats you are prepared for may not cover the full spectrum of potential threats.
    The threat may be targeting the vendor, may be targeting another tenant of the
    cloud provider, or be related to threats in the geographic location of the cloud
    data center. These attacks may come from anywhere in the world. You may simply
    be collateral damage. Regardless, the end result may be a DoS—even if you are
    not the intended target.


    Other risks come from the other tenants. If protections keeping customer data
    separate fail, your data may be exposed to another tenant. This tenant could be
    a competitor or other bad actor. Encryption may be the best protection, with the
    customer managing their own encryption keys. The customer may also consider not
    storing their most sensitive data in the cloud.


    There can be an additional risk from the cloud vendor. Employees of cloud vendors
    have been known to exfiltrate customer data for their own purposes. Contractual
    language may provide the only remedy once detected. Prevention becomes the best
    defense. As with other tenants, encryption with the customer managing their own
    keys (separate from the cloud) prevents data exposure.


    # Virtualization Risks


    Virtualization is a powerful tool and, as such, has specific risks. The hypervisor
    is under the control of the CSP in the shared security model. If the hypervisor
    is compromised, all VMs on the hypervisor may be compromised. So, the task of
    the CSP protecting the hypervisor is critical.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'VM sprawl is also a risk. Members of the workforce may create VMs for projects
    and forget to close them down when done. VM sprawl increases the attack surface
    as these unused VMs may not be actively monitored, so malicious use may go unnoticed.
    The increase in the overall number of VMs can also balloon costs to the organization
    unexpectedly.


    Another risk with VMs is with the data stored in each VM. Sensitive data and data
    at different trust levels can exist in each VM unless care is taken to manage
    and monitor what data may be used and where it is stored. The risk associated
    with VM sprawl and sensitive data storage is a management issue. If not carefully
    monitored and managed, organizations can easily lose control of the VMs they own,
    putting data and budgets at risk.


    # Countermeasure Strategies


    There are a number of ways to mitigate risks in the cloud environment. The start
    of security is with the selection of the CSP. This is the exercise of due diligence
    in selection. A careful risk assessment and analysis of CSPs will eliminate some
    of the riskier players in the cloud space.


    Using a trusted CSP is a good start. The next step is the design of systems. Security
    should be designed in at every step. When using cloud services, the configuration
    of each service can be an important design step to ensure the most secure configuration.


    The next countermeasure is encryption. Encryption should be enabled for all data
    at rest and data in motion. CSPs provide encryption services. Sometimes the only
    thing missing is the customer enabling encryption. Data in transit must be protected
    using TLS, IP security (IPSec), VPNs, or another encrypted transmission method.
    In addition, limiting the ingress/egress points in each cloud service can enhance
    monitoring.


    Each major CSP provides the ability to manage your secure configuration, monitor
    changes to cloud services, and track usage. For example, AWS provides Inspector,
    CloudWatch, CloudTrail, and other tools to assist your management of your cloud
    environment. However, the best monitoring is worthless without regular and consistent
    review of logs.


    # DESIGN AND PLAN SECURITY CONTROLS


    The risks associated with cloud computing can be mitigated with the proper selection
    of controls. This is the same approach used in traditional risk management tailored
    to the risks associated with cloud computing.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Physical and Environmental Protection


    The location housing the physical servers in a cloud environment must consider
    physical and environmental controls. This may be a CSP for a public or other third-party
    cloud. For a private cloud, it may be the company employing the cloud.


    Site location has an impact on both physical and environmental protections. A
    data center along the waterfront in an area subject to regular hurricanes or in
    a location with frequent tornados, flooding, or possibly earthquake activity may
    be ill advised or may lead to a strategy with multiple data centers in different
    locations to provide redundancy. If each data center has a different risk profile,
    they provide greater assurance of availability.


    Other physical and environmental requirements are typical in all data centers,
    including physical cloud data centers. These include the ability to restrict physical
    access, reliable power and other utilities, and the availability of an adequate
    workforce.


    A cloud data center also has significant network capability requirements. All
    data centers require network capabilities. But, as a CSP may provide services
    to a large number of customers over a geographical area that can be worldwide,
    these requirements may be more substantial for the cloud data center than a single
    tenant data center on-premise. More than one ISP may improve connectivity redundancy
    in many scenarios.


    The customer has no control over the physical siting of a cloud data center except
    for a private cloud located on-premise. That does not relieve the customer of
    responsibility in this regard; it simply changes the customer responsibility.
    To the extent possible, the customer should review the location of cloud data
    centers and be aware of the cloud vendor’s business continuity and disaster recovery
    plans. The ability of the cloud vendor or CSP to respond to disasters directly
    affects the ability of the cloud customer to serve their customers.


    # System and Communication Protection


    There are a number of controls available for system and communications protection.
    One source for controls is NIST Special Publication 800-53: Security and Privacy
    Controls or Information Systems and Organizations; specifically, Section 3.18
    System and Communications Protection (SC). Similar controls can be found with
    ISO and other control sets. The SC Controls Set includes 51 specific controls.
    A few of the major controls include the following:


    +   - **Policy and Procedures:** This is a primary control. Policies and procedures
    (P&P) are a primary foundation to all areas of security. P&P provide the foundation
    for all security actions by setting the purpose, scope, roles, and responsibilities.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '+   - **Separation of System and User Functionality**: This is a core control.
    Separation of duties is a fundamental security principle and prevents users from
    altering and misconfiguring systems and communication processes.

    +   - **Security Function Isolation**: Just as we want to separate the user and
    system functions, separating security and nonsecurity functions allows for cleaner
    interfaces and the ability to maintain the security function.

    +   - **Denial-of-Service Protection**: A DOS attack is a primary concern of all
    communication systems. Preventing a DOS attack involves dealing with bandwidth
    and capacity issues, detecting attacks, and decreasing pivot risk to prevent one
    system from attacking another.

    +   - **Boundary Protection**: This includes preventing malicious traffic from
    entering the network, but preventing malicious traffic from leaving your network,
    data loss (exfiltration) protection, and other boundary needs of the organization.


    These are just a few of the controls in the SC Controls Set. As mentioned, there
    are 51 potential controls in the NIST publication for System and Communication
    Protection. It is not expected that an organization will implement all 51 controls.
    This is more of a collection of potential controls to review and consider.


    Cloud computing has a shared security model, and which controls are the responsibility
    of the CSP and which are the responsibility of the customer should be carefully
    reviewed and understood. For example, the CSP should have a strategy to keep your
    business functioning in the event of data center disasters and communication disruptions
    including DOS attacks.


    In addition to these controls mentioned, the customer should assure the potential
    to communicate in the event of an ISP failure by ensuring alternate methods of
    communicating with the CSP. This can be through dual ISPs or similar strategies
    to make communication with the vendor possible when a communication interruption
    occurs.


    Protection of business data remains a critical issue. Controls to protect data
    in transit must be available and utilized. The primary control for data in motion
    (transit) is encryption using protocols/tools such as TLS, IPSec, or VPNs. This
    control is supported by a robust identification and authentication system and
    the creation of authorization mechanisms that enforce access controls to the system,
    process, and data.


    # Virtualization Systems Protection


    The controls for VMs and virtualization systems start with secure IAM. On its
    own, IAM is not sufficient for full protection of your VMs. However, controlling
    access to VMs is your single most important control. If you get IAM wrong, other
    controls will be less effective. Privileged access must be strictly limited and
    should enforce least privilege and separation of duty controls.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Creating standard configurations for VM use in your organization will also
    help protect them. Variability adds complexity and makes monitoring for unauthorized
    use more difficult. If the organization uses standard patterns, it is much simpler
    to identify malicious behavior and to enforce configuration policies.


    Configuration guides can provide guidance on the use of cloud services. This will
    assist workforce members new to the cloud in creating secure solutions. For example,
    an S3 bucket has many configuration options. Which options are recommended or
    required and how they should be set can be explained. Cloud tools can then enforce
    the configuration, prevention, or alerts on changes outside of business guidance.


    Other controls exist in the cloud environment to assist with monitoring performance,
    identifying malicious behavior, and enforcing or identifying variance with policy.
    Many tools are available to provide these controls—including tools integrated
    with major CSPs and tools that can be added to a customer''s cloud environment.


    For example, Amazon provides CloudWatch. This tool can monitor EC2 instances and
    other data storage systems. CloudWatch can also set alarms, store logs, view graphs,
    as well as respond to changes in AWS resources. The early alerting provided by
    this tool can prevent small changes from becoming large problems and may alert
    you to attacks, misuse of resources, and variations of approved customer configurations.


    Azure provides a similar tool in Microsoft Cloud Monitoring (MCM). This tool will
    monitor Azure applications, analyze log files, and alert customers to potential
    threats. Like CloudWatch, MCM will monitor utilization, performance, and workloads.
    In both cases, the software is built into the services each CSP provides. Other
    CSPs provide similar tools.


    Finally, the ability to run multiple VMs from multiple locations must find a balance
    between security and availability. VM usage can get out of control if not carefully
    managed. If VM usage is not carefully managed, the attack surface for the organization
    can actually grow over time.


    # Identification, Authentication, and Authorization in Cloud Infrastructure


    Many organizations will want to extend their current IAM system into the cloud.
    They may also choose a SaaS IAM and use it for both their cloud environment and
    their on-premise environment. They may also maintain their legacy IAM on-premise
    and use a separate SaaS IAM for cloud services. This is really a business decision.
    An SSO environment for the workforce is generally desirable but may not be possible
    to achieve.


    Another option is to use the vendor''s IAM system for each cloud resource. Using
    a vendor''s IAM system introduces a number of risks. First, the security of the
    vendor''s IAM system is unknown. If you are relying on the vendor to provide access
    to your business data, you should have confidence in their IAM system. For some
    cloud services, this'
  merge: -1
  img_proc: true
