- pgno: 251
  md: '**NOTE** Keep in mind that privacy does not equal data security, and sometimes
    the two ideals are at odds.


    The GDPR is a massive set of regulations that covers almost 90 pages of details
    and is a daunting challenge to many organizations. A CCSP should be familiar with
    the broad areas of the law, but ultimately organizations should consult an attorney
    to ensure that operations are compliant. GDPR encompasses the following main areas:


    +   - **Data protection principles:** If a company processes data, it must do
    so according to seven protection and accountability principles.

    +     - **Lawfulness, fairness, and transparency:** Processing must be lawful,
    fair, and transparent to the data subject.

    +     - **Purpose limitation:** The organization must process data for the legitimate
    purposes specified explicitly to the data subject when it was collected.

    +     - **Data minimization:** The organization should collect and process only
    as much data as absolutely necessary for the purposes specified.

    +     - **Accuracy:** The organization must keep personal data accurate and up-to-date.

    +     - **Storage limitation:** The organization may store personally identifying
    data for only as long as necessary for the specified purpose.

    +     - **Integrity and confidentiality:** Processing must be done in such a way
    as to ensure appropriate security, integrity, and confidentiality (for example,
    by using encryption).

    +     - **Accountability:** The data controller is responsible for being able
    to demonstrate GDPR compliance with all of these principles.

    +   - **Data security:** Companies are required to handle data securely by implementing
    appropriate technical measures and to consider data protection as part of any
    new product or activity.

    +   - **Data processing:** GDPR limits when it is legal to actually process user
    data. There are very specific instances when this is allowed under the law.

    +   - **Consent:** Strict rules are in place for how a user is to be notified
    that data is being collected.

    +   - **Personal privacy:** The GDPR implements a litany of privacy rights for
    data subjects, which gives individuals far greater rights over their data that
    companies collect. This includes rights to be informed, access, rectify, restrict,
    obtain, and the much touted “right to be forgotten,” which allows the end user
    to request deletion of all personal data.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Additional Legal Controls


    The cloud service provider has also significantly complicated the legal landscape
    when it comes to legal controls. The provider of the infrastructure, platform,
    or software as a service must be evaluated as an additional party when considering
    compliance. If a cloud provider is responsible for a violation of a legal control,
    the company can still be responsible for the legal ramifications. This applies
    to legal and contractual controls such as the following:


    +   - **Heath Insurance Portability and Accountability Act (HIPAA)**: This 1996
    U.S. law regulates the privacy and control of health information data.

    +   - **Payment Card Industry Data Security Standard (PCI DSS)**: The current
    standard version 3.2 affects companies that accept, process, or receive electronic
    payments.

    +   - **Privacy Shield**: This provides a voluntary privacy compliance framework
    through which companies can comply with portions of the GPDR in order to facilitate
    the movement of EU citizens’ data into the United States by companies based in
    the United States. Note that this agreement is facing legal challenges in the
    EU.

    +   - **Sarbanes–Oxley Act (SOX)**: This law was enacted in 2002 and sets requirements
    for U.S. public companies to protect financial data when stored and used. It is
    intended to protect shareholders of the company as well as the general public
    from accounting errors or fraud within enterprises. This act specifically applies
    to publicly traded companies and is enforced by the Securities and Exchange Commission
    (SEC). It is applicable to cloud practitioners in particular because it specifies
    what records must be stored and for how long, internal control reports, and formal
    data security policies.

    +   - **Gramm–Leach–Bliley Act (GBLA)**: U.S. federal law that requires financial
    institutions to explain how they share and protect their customers’ private information.


    # Laws and Regulations


    The cloud represents a dynamic and changing environment, and monitoring/reviewing
    legal requirements is essential to staying compliant. All contractual obligations
    and acceptance of requirements by contractors, partners, legal teams, and third
    parties should be subject to periodic review. When it comes to compliance, words
    have real meaning. You (and Microsoft Word’s thesaurus) might think that the terms
    law and regulation are interchangeable, but when it comes to data privacy issues,
    they can have starkly different outcomes if they are not satisfied. Understanding
    the type of compliance that your company is subject to is vital to a CCSP. The
    outcome of noncompliance can vary greatly, including imprisonment, fines, litigation,
    loss of a contract, or a combination of'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'these. To understand this landscape, a CCSP must first recognize the difference
    between data protected by legal regulations and data protected by contract.


    +   - **Statutory requirements** are required by law.

    +     - U.S. federal laws, such as HIPAA, GLBA, and SOX outlined in the previous
    section

    +     - Additional federal laws such as the Family Education Rights and Privacy
    Act (FERPA), which deals with privacy rights for students, and the Federal Information
    Security Management Act (FISMA), which protects federal data privacy

    +     - State data privacy laws, which now exist in all 50 states as well as U.S.
    territories

    +     - International laws, which we will discuss in a later section covering
    country-specific laws


    +   - **Regulatory requirements** may also be required by law, but refer to rules
    issued by a regulatory body that is appointed by a government entity.

    +     - In the United States, many regulatory examples exist, mostly dealing with
    contractor compliance to do business with the government. An example would be
    security requirements outlined by NIST that are necessary to handle government
    data (such as NIST 800-171).

    +     - At the state level, several states use regulatory bodies to implement
    their cybersecurity requirements. One example is the New York State Department
    of Financial Services (NY DFS) cybersecurity framework for the financial industry
    (23 NYCRR 500).

    +     - There are numerous international requirements dealing with cloud legal
    requirements (including APEC and GDPR).


    **Contractual requirements** are required by a legal contract between private
    parties. These are not laws, and breaching these requirements cannot result in
    imprisonment (but can result in financial penalties, litigation, and terminations
    of contracts). Common contractual compliance requirements include the following:


    +   - Payment Card Industry Data Security Standard (PCI DSS)

    +   - Financial Industry Regulatory Authority (FINRA)

    +   - Service Organization Controls (SOC)

    +   - Generally Accepted Privacy Principles (GAPP)

    +   - Center for Internet Security (CIS) Critical Security Controls (CSC)

    +   - Cloud Security Alliance (CSA) Cloud Controls Matrix (CCM)'
  merge: -1
  img_proc: true
