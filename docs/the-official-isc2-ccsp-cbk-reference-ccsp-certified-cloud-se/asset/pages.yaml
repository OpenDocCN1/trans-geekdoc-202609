- pgno: 81
  md: 'original data set, the processed data can be decrypted and reintegrated, however,
    homomorphic encryption is largely experimental and therefore not widely used.


    Obfuscating and de-identifying data often incorporates rules to ensure the output
    data remains realistic. For example, credit card numbers conform to known patterns—usually
    16 digits broken into groups of four—so replacing real credit card information
    must use only numerals. Some other information may also need to be verifiable
    against external sources. For example, postal codes and telephone area codes indicate
    geographic locations, so modifying a data set with address, post code, and telephone
    numbers may need to conform to the rules of these numbering systems or the relationships
    that data implies. If your business does not serve customers outside the continental
    United States, then postal codes for Canada, Alaska, and Hawaii should not be
    allowed when performing substitutions.


    A process known as pseudo-anonymization or pseudonymization (often pseudonymisation
    due to its presence in the EU GDPR and use of British English spellings by European
    translators) is a process of obfuscating data with the specific goal of reversing
    the obfuscation later. This is often done to minimize risk of a data breach and
    is performed by the data owner or controller prior to sending data to a processor.
    For example, if an organization wants to store large volumes of customer purchase
    orders in a cloud service, where storage is cheaper and more durable, they could
    remove PII and replace it with an index value prior to upload. When the data is
    retrieved, the index value can be looked up against an internal database, and
    the proper PII inserted into the records. The cost of storing that PII index would
    be small due to the lower volume of data, and the risk of a cloud data breach
    is also minimized by avoiding storage of PII in the cloud.


    # Data De-identification


    De-identifying data is primarily used when the data contains PII, known as direct
    identifiers, or contains information that could be combined with other data to
    uniquely identify an individual, known as indirect identifiers. Direct identifiers
    consist of information such as name and financial account numbers, while indirect
    identifiers are often demographic information such as age or personal behavior
    details such as shopping history. Removing these identifiers makes data anonymous
    rather than identifiable; hence, this process is often known as anonymization.
    This differs from pseudonymization, where the goal is to allow the re-identification
    of data, unlike anonymization, which is designed to be permanent.


    Most privacy regulations require data anonymization or de-identification for any
    PII use outside of live production environments. For example, U.S. healthcare
    entities regulated by the Health Insurance Portability and Accountability Act
    (HIPAA) are required to de-identify medical records information when it is to
    be used for anything other than patient treatment, such as research studies. Details
    that could be used to specifically identify a patient must be removed or substituted,
    such as full name, geographic location'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'information, payment information, dates more specific than the year, email
    address, health plan information, etc.


    Removing indirect identifiers can be more of a challenge, starting with identifying
    what information could be uniquely identifiable. Trend information such as frequently
    browsed product categories at an online shopping site can be cross-referenced
    to a user’s social media posts to identify them with relative certainty. If an
    online retailer removed all direct identifiers and published their sales trend
    data, it might still be possible to uniquely identify users. Combining multiple
    obfuscation and anonymization techniques can be useful to combat this threat,
    such as deleting names, substituting postal codes, and shuffling rows so that
    purchase history and location are no longer linked.


    # IMPLEMENT DATA DISCOVERY


    Data discovery has two primary meanings in the context of information security.
    Discovery of data stored in your environment is the purview of DLP solutions,
    which helps build an inventory of critical data assets your organization needs
    to protect. This is not the same as eDiscovery, which deals with collecting evidence
    in legal situations, but utilizes many of the same principles.


    Discovering trends and valuable intelligence within data is the second meaning,
    and one that is less a dedicated concern of the security department. Analyzing
    data to uncover trends or make predictions, such as what products are likely to
    be in-demand or what a given customer might be interested in shopping for, can
    drive meaningful business improvements like ensuring adequate inventory of goods.
    In these cases, security is not a primary concern of data discovery, but the business
    intelligence (BI) is itself a valuable intellectual property (IP) data asset,
    which requires security commensurate with its value. Supporting elements such
    as algorithms or proprietary data models used for analysis may also be valuable
    IP and should be included in the organization’s security risk management program.


    Many security tools, especially those monitoring large-scale deployments of user
    workstations, servers, and cloud applications, make use of data discovery. Analysis
    tools can be used to drive security operations by identifying suspicious events
    that require investigation, such as system vulnerabilities, misconfigurations,
    intrusion attempts, or suspicious network behavior. This data, comprising details
    of an organization’s vulnerabilities, is obviously an asset worth protecting as
    it would be useful to an attacker. It is important for a security practitioner
    to understand both the value of these tools in supporting security operations
    as well as how to adequately protect them.


    There are a number of important terms associated with data discovery and BI, including
    the following:


    +   - **Data lake and data warehouse**: These terms are similar but not the same.
    Both are designed to consolidate large amounts of data, often from disparate sources'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'inside or outside a company, with the goal of supporting BI and analysis efforts.
    A lake is an unstructured data storage mechanism with data often stored in files
    or blobs, while a warehouse is structured storage in which data has been normalized
    to fit a defined data model.


    +   - *Normalization* is the process of taking data with different formats—for
    example one system that stores MM-DD-YYYY and another that uses YYYY-MM-DD—and
    converting it to a common format. This is often known as *extract, transform,
    load* (ETL), as the data is extracted from sources like databases or apps, transformed
    to meet the warehouse’s data model, and loaded into warehouse storage. Normalizing
    data improves searchability.


    +   - **Data mart:** A data mart contains data that has been warehoused, analyzed,
    and made available for specific use such as by a particular business unit. Data
    marts typically support a specific business function by proactively gathering
    data needed and performing analysis and are often used to drive reporting and
    decision-making.


    +   - **Data mining:** Mining data involves discovering, analyzing, and extracting
    patterns in data. These patterns are valuable in some way, much like minerals
    mined from the ground; they may support business decision-making or enhance human
    abilities to identify important trends, patterns, and knowledge from large sets
    of data. Even small organizations with only a few users and systems generate enormous
    volumes of security log data, and data mining tools can be useful for isolating
    suspicious events from normal traffic.


    +   - **Online analytic processing (OLAP):** As the name implies, OLAP provides
    users with analytic processing capabilities for a data source. OLAP consists of
    consolidation, drill-down, and slice-and-dice functions. Consolidation gathers
    multi-dimensional data sets into cubes, such as sales by region, time, and salesperson.
    Drill-down and slice-and-dice allow users to analyze subsets of the data cube,
    such as all sales by quarter across all regions or sales of a particular product
    across all salespeople. Security incidents that require forensic analysis often
    make use of OLAP to extract relevant information from log files.


    +   - **ML/AI training data:** Machine learning (ML) and artificial intelligence
    (AI) are emerging areas of data science. ML is concerned with improving computer
    algorithms by experience, such as asking a computer to identify photos of dogs
    and then having a human verify which photos actually contain dogs and which contain
    other animals instead. The computer algorithm learns and refines future searches;
    these algorithms can be used across a wide variety of applications such as filtering
    out unwanted emails by observing which messages users mark as spam, and they are
    widely implemented in security tools designed to learn and adapt'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'to an organization’s unique environment. AI is a field of computer science
    with the goal of designing computer systems capable of displaying intelligent
    thought or problem solving, though the term is often used to describe systems
    that simply mimic human tasks like playing strategy-based board games or operating
    autonomous vehicles. Both AI and ML require large sets of data to learn, and there
    are myriad security as well as privacy concerns, especially when the data sets
    include personal information like photos used for training ML facial recognition.


    As a consumer of cloud services, a CCSP should be aware that their organization
    retains accountability for protecting data, including data discovery processes
    to identify and inventory sensitive data. CSPs may be subject to contractual obligations
    for implementing specific data protections, but they are not the data owners and
    are therefore not legally liable under most privacy and security laws for data
    breaches. An adequate inventory of sensitive data is a vital input to security
    risk assessment and mitigation, so it is essential that a CCSP recognize the capabilities
    of data discovery and utilize them to support their organization’s security risk
    management process.


    # Structured Data


    Structured data refers to data that has been formatted in a consistent way. This
    often takes the form of a database where all records conform to a known structure:
    data is separated into columns, and each row contains the same type of information
    in the same place. Standalone data may also be structured using a markup language
    such as XML or JSON, which utilizes tags to provide context around data like <AcctNumber>123456</AcctNumber>.


    Data discovery is simplified with structured data, as the process only needs to
    understand the data’s context and attributes to identify where sensitive data
    exists, such as PII, healthcare data, transaction information, etc. Columns and
    data attributes are typically named in a self-explanatory way, simplifying the
    identification of sensitive or useful data. Many security information and event
    management (SIEM) tools also provide functionality to ingest data from multiple
    sources and apply structure to the data, which facilitates the process of analysis
    across disparate sources. As an example, the SIEM tool might normalize log data
    from multiple operating systems to include human-readable usernames in log files,
    rather than a numeric global user ID value.


    Structured data is often accompanied by a description of its format known as a
    data model or schema, which is an abstract view of the data’s format in a system.
    Data structured as elements, rows, or tuples (particularly in relational databases)
    is given context by the model or schema. For example, defining a particular string
    as a user ID can be achieved using tags defined in a schema. Understanding the
    relationship of a user belonging to a particular business unit can be achieved
    with data in a particular column; for example, the user’s business unit designation
    appears in the “Bus. Unit” column.'
