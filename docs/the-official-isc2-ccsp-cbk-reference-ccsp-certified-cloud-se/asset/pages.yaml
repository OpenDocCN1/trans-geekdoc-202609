- pgno: 157
  md: '# Application Programming Interface Gateway


    An API gateway allows traffic to your application backend services. The services
    provided by an API gateway include rate limiting, access logging, and authorization
    enforcement. For secure computing, there should be limited doors into your application
    service. For example, some SaaS providers provide an API to access your account
    from your PC, Apple device, or Android device. These gateways control the way
    a user accesses and interacts with the SaaS solution and allow securing and monitoring
    this traffic. API gateways provide authentication and key validation services
    that control who may access the service, ensuring confidentiality of data.


    Amazon Web Services (AWS) provides this service through Amazon API Gateway. AWS
    provides both RESTful for serverless computing and WebSocket APIs for real-time
    communication. Google Cloud provides an API gateway for REST APIs to provide serverless
    computing and a consistent and scalable interface. Azure API management provides
    a REST-based API for legacy systems. Essentially, all CSPs provide an API to allow
    the customer to monitor and control access to data and services to their workforce,
    partners, and customers in a way that provides a layer of protection and access
    control.


    # Cryptography


    Cryptography is a key technology for encrypting and protecting sensitive data
    in the cloud. Encryption is the first line of defense for data confidentiality.
    Encryption requires the use of keys. Management of the keys is a critical security
    vulnerability. There are three primary parts of encryption: data at rest, data
    in motion, and key management.


    Encryption for data at rest is a standard practice for all sensitive information.
    Many CSP services have encryption as a standard option. Some CSPs provide standard
    APIs to allow encryption to be added to any CSP service or customer application.
    CSPs generally also provide encryption options for their storage and database
    services. Naturally, encryption tools are standard in all large CSPs.


    Data-in-motion encryption is accomplished in standard ways to include TLS, HTTPS,
    and VPNs. The ability to work with standard secure data transmission methods is
    provided by all mature CSP. In addition, larger CSPs can accommodate data sharing
    between software solutions, even in multiple regions, without ever transiting
    the public Internet. However, this promise of not transiting the Internet does
    not necessarily mean that data is transiting a trusted network. Even when staying
    off the Internet, encrypted data transmission should be expected.


    With all of this encryption, there are encryption keys to manage. The major CSPs
    all provide key management services (KMS) as do some third-party vendors. The
    first decision is who will manage the keys. Solutions exist to allow the vendor
    to manage the keys. However, for sensitive data, it is preferable that the customer
    use a commercial KMS rather than the vendor in order to improve key security.
    This provides a separation of duties between the service managing the encrypted
    data and the service managing encryption keys.'
  merge: -1
  img_proc: true
