- pgno: 18
  md: '# Domain 1: Cloud Concepts, Architecture, and Design


    Understanding cloud computing begins with the building blocks of cloud services,
    and the Cloud Concepts, Architecture, and Design domain introduces these foundational
    concepts. This includes two vital participants: cloud service providers and cloud
    consumers, as well as reference architectures used to deliver cloud services like
    infrastructure as a service (IaaS), platform as a service (PaaS), and software
    as a service (SaaS). These relatively new methods of accessing IT resources offer
    interesting business benefits like shifting spending from capital expenditure
    (CapEx) to operating expenditure (OpEx). This changes the way organizations budget
    and pay for the IT resources needed to run their business, so it is not uncommon
    to see financial leaders driving adoption of cloud services. New IT service models
    bring with them new forms of information security risks, however, which must be
    assessed and weighed so the organization achieves an optimal balance of cost (in
    the form of risk) with benefits (in the form of reduced IT spending). This will
    drive decisions on which cloud deployment model to adopt, like public or private
    cloud, as well as key internal governance initiatives when migrating to and managing
    cloud computing.


    # Domain 2: Cloud Data Security


    Information security is fundamentally concerned with preserving the confidentiality,
    integrity, and availability of data. Although cloud computing upends many legacy
    IT models and practices, security risks to information systems remain. The Cloud
    Data Security domain does introduce new concepts like the cloud data lifecycle,
    as well as cloud-specific considerations like data dispersion and loss of physical
    control over storage media that requires unique approaches to data disposal. Cloud
    security practitioners must understand how to implement controls for audit and
    accountability of data stored or processed in the cloud, as well as crucial oversight
    tasks like data discovery to create an inventory. This domain introduces proactive
    safeguards intended to manage sensitive data stored in the cloud, like masking,
    tokenization, data loss prevention (DLP), and classification of data. Cloud-specific
    considerations and adaptations of traditional controls are a primary concern,
    since cloud services remove traditional capabilities like physical destruction
    of disk drives, while adding new capabilities like instantaneous global data replication.


    # Domain 3: Cloud Platform and Infrastructure Security


    There are two perspectives treated in the Cloud Platform and Infrastructure Security
    domain. Cloud providers require skilled security practitioners to design, deploy,
    and maintain both physically and logically secure environments. This includes
    buildings, facilities, and utilities needed to provide the cloud service offering,
    as well as'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'configuration and management of software systems like hypervisors, storage
    area networks (SANs), and software-defined networking (SDN) infrastructure. A
    key concern is the security of data stored by the cloud consumers, particularly
    properly isolating tenant data to avoid leakage between cloud tenants. From the
    perspective of the cloud consumer, traditional security controls will require
    adaptation for cloud environments, such as the use of virtualized hardware security
    modules (HSM) to generate and manage cryptographic keys, and additional layers
    of encryption required to reduce the risk associated with giving up physical control
    of storage media. Audit mechanisms like log collection are traditionally present
    in cloud environments, but abilities like packet capture and analysis may not
    be available due to multitenant data concerns. Disaster recovery and business
    continuity are also presented in this domain; while the inherent high availability
    nature of many cloud services is beneficial for organizations, proper configuration
    to take advantage of these features is required.


    # Domain 4: Cloud Application Security


    Security practitioners working in cloud computing environments face the challenge
    of more rapid deployment, coupled with the relative ease with which more users
    can develop sophisticated cloud applications. Again, these are advantages to the
    business at the possible expense of security, so the Cloud Application Security
    domain presents key requirements for recognizing the benefits offered by cloud
    applications without introducing unacceptable risks. These begin with a focus
    on the importance of fostering awareness throughout the organization of common
    cloud security basics, as well as specific training for cloud app developers on
    vulnerabilities, pitfalls, and strategies to avoid them. Modifications to the
    software development lifecycle (SDLC) are presented to help accommodate changes
    introduced by cloud-specific risks, such as architectures designed to avoid vendor
    lock-in and threat modeling specific to the broadly accessible nature of cloud
    platforms. Since many cloud computing services are delivered by third parties,
    this domain introduces assurance, validation, and testing methods tailored to
    address the lack of direct control over acquired IT services and applications.
    It also introduces common application security controls and specifics of their
    implementation for cloud environments, like web application firewalls (WAF), sandboxing,
    and Extensible Markup Language (XML) gateways. Many cloud services rely heavily
    on functionality offered via application programming interfaces (APIs), so it
    is crucial that security practitioners understand how data is exchanged, processed,
    and protected by APIs.


    # Domain 5: Cloud Security Operations


    The Cloud Security Operations domain is a companion to many of the concepts introduced
    in the Cloud Platform and Infrastructure Security domain. It deals with issues
    of'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'implementing, building, operating, and managing the physical and logical infrastructure
    needed for a cloud environment. There is a heavy focus on the cloud service provider''s
    perspective, so concepts in this domain may be unfamiliar to some security practitioners
    who have only worked to secure cloud services as a consumer. The concepts are
    largely similar to legacy or on-premises security, such as the secure configuration
    of BIOS and use of Trusted Platform Module (TPM) for hardware security, deployment
    of virtualization management tools, and configuring remote maintenance capabilities
    to allow remote administrative tasks. Considerations unique to cloud environments
    include the additional rigor required in the configuration of isolation features,
    which prevent data access across tenants, as well as the much larger demands of
    managing capacity, availability, and monitoring of vast, multicountry data centers.
    Traditional security operations (SecOps) are also of critical concern for security
    practitioners in a cloud environment, such as the management of vulnerability
    and patch management programs, network access and security controls, as well as
    configuration and change management programs. Additional SecOps activities covered
    in this domain include supporting incident response and digital forensics when
    security incidents occur, as well as traditional security operations center (SOC)
    oversight and monitoring functions for network security, log capture and analysis,
    and service incident management. These tasks are also covered from the cloud consumer''s
    perspective, as many cloud services and security tools provide log data that must
    be analyzed to support policy enforcement and incident detection.


    # Domain 6: Legal, Risk, and Compliance


    Legal and regulatory requirements are a significant driver of the work many information
    security professionals perform, and cloud computing makes this increasingly more
    complex due to its inherently global nature. The Legal, Risk, and Compliance domain
    details the conflicting international laws and regulations that organizations
    will encounter when using cloud services. These present financial risks, additional
    compliance obligations and risk, as well as technical challenges like verifying
    that cloud applications and services are configured in accordance with compliance
    requirements. One particularly important area of focus is privacy legislation;
    with many countries and localities introducing strict requirements to safeguard
    privacy data, organizations using the cloud must weigh any financial benefits
    of a cloud migration against potential fines if they violate these laws. New challenges
    are also emerging around jurisdiction over multinational cloud services: how do
    you determine jurisdiction for a U.S. based company operating a cloud data center
    in Singapore processing data belonging to a Swiss citizen? Three different laws
    potentially overlap in this scenario. Processes for audits, assurance, and reporting
    are also covered, as security practitioners must understand and be able to implement
    both internal oversight mechanisms like gap analysis and audit planning, while
    also selecting and supporting external auditors for standards like Service Organization
    Control'
  merge: -1
  img_proc: true
- pgno: 21
  md: '(SOC) audit reports. Some organizations may even find themselves in such heavily
    regulated industries, like healthcare or national defense, that the potential
    risks of cloud computing outweigh any cost savings. These types of decisions must
    be driven by solid risk management principles, which require adequate assessment
    and mitigation techniques. Since cloud service providers are third parties not
    directly under the control of the organization, vendor risk management practices
    like contract design and service level agreements (SLAs) must be utilized to execute
    the chosen risk management strategy.


    # HOW TO CONTACT THE PUBLISHER


    If you believe you’ve found a mistake in this book, please bring it to our attention.
    At John Wiley & Sons, we understand how important it is to provide our customers
    with accurate content, but even with our best efforts, an error may occur.


    To submit your possible errata, please email it to our Customer Service Team at
    wileysupport@wiley.com with the subject line “Possible Book Errata Submission.”'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# # Cloud Concepts, Architecture, and Design


    **FOUNDATIONAL TO THE UNDERSTANDING** and use of the cloud and cloud computing
    is the information found in Domain 1. This information is fundamental for all
    other topics in cloud computing. A set of common definitions, architectural standards,
    and design patterns will put everyone on the same level when discussing these
    ideas and using the cloud effectively and efficiently.


    # ## UNDERSTAND CLOUD COMPUTING CONCEPTS


    The first task is to define common concepts. In the following sections, we will
    provide common definitions for cloud computing terms and will discuss the various
    participants in the cloud computing ecosystem. We will also discuss the characteristics
    of cloud computing, answering the question “What is cloud computing?” We will
    also examine the technologies that make cloud computing possible.


    # ### Cloud Computing Definitions


    The basic concepts of cloud computing, service models, and deployment models form
    the foundation of cloud computing practice. It is essential to understand each
    of them.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Cloud Computing


    In NIST SP 800-145, cloud computing is defined as “a model for enabling ubiquitous,
    convenient, on-demand network access to a shared pool of configurable computing
    resources. . . . that can be rapidly provisioned and released with minimal management
    effort or service provider interaction.”


    Cloud computing is more than distributed computing or parallel computing even
    when done over a network (local area network or Internet). It is a philosophy
    that creates access to computing resources in a simple, self-driven way. If an
    individual has to call up the vendor and negotiate a contract for a fixed service,
    it is probably not cloud computing. Similarly, a company may negotiate rates and
    services in a cloud environment. But, the provisioning of services must not require
    ongoing involvement by the vendor.


    Cloud computing requires a network in order to provide broad access to infrastructure,
    development tools, and software solutions. It requires some form of self-service
    to allow users to reserve and access these resources at times and in ways that
    are convenient to the user.


    The provisioning of resources needs to be automated so that human involvement
    is limited. Any user should be able to access their account and procure additional
    resources or reduce current resource levels by themselves.


    An example is Dropbox, a cloud-based file storage system. An individual creates
    an account, chooses the level of service they want or need, and provides payment
    information, and then the service and storage are immediately available. A company
    might negotiate contract rates more favorable than are available to the average
    consumer. But, once the contract is in place, the employees access this resource
    in much the same way as an individual user of this service.


    # Service Models


    There are three service models: software as a service (SaaS), platform as a service
    (PaaS), and infrastructure as a service (IaaS). These models determine the type
    of user the cloud service is designed for: end users, developers, or system administrators.


    The different service models also dictate the level of control over software applications,
    operating systems, networking, and other components. The least control for the
    end user exists in the SaaS model, with only basic configuration controls available,
    if any. The most control for the end user is the IaaS model where operating system
    selection and configuration, patching, and software tools and applications are
    under the control of the end user.


    When the service is provided to a company, the distinction can be less clear.
    While a PaaS may be intended for use by developers, there may be some administration
    of the'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'service by the company as well. In fact, the lines often blur when a corporation
    enters into a business relationship with a cloud provider but does much of the
    provisioning and administrative work in house.


    For example, Office 365 can be considered a SaaS solution, and to the individual
    consumer there is little or no administrative overhead. But, if a company contracts
    for Office 365, they may in fact administer the system, overseeing account provisioning,
    system monitoring, and other tasks that would be the domain of developers and
    administrators.


    # Deployment Models


    There are four deployment models: public, private, community, and hybrid clouds.
    These define who owns and controls the underlying infrastructure of a cloud service
    and who can access a specific cloud service.


    A public cloud deployment makes resources available for anyone who chooses to
    create an account and purchase access to the service. A service like Dropbox is
    available to the public SaaS deployment. Accounts on various cloud service providers
    such as Amazon Web Services (AWS), Google, and IBM Cloud are also public deployments
    of services.


    A private cloud deployment consists of a set of cloud resources for a single organization
    (business, non-profit, etc.). The cloud may be located on-premise in the organization’s
    data center or may be in a single tenant cloud environment provided by a CSP.
    The services (SaaS, PaaS, or IaaS) are available solely to that organization.
    You get many of the advantages of a cloud such as the on-demand resources and
    minimal management effort. However, the company still owns the infrastructure.
    This can provide the benefits of cloud computing for files and data that are too
    sensitive to put on a public cloud.


    A community cloud is most similar to a public cloud. It is a cloud deployment
    for a related group of companies or individuals such as a consortium of universities
    or a group of local or state governments. The cloud may be implemented in one
    of the organizations, with services provided to all members. Or, it can be implemented
    in an infrastructure like AWS or Google. However, access to the cloud resources
    is available only to the members of the group.


    A hybrid cloud is any combination of these. A company may have a private cloud
    that accesses public cloud resources for some of its functions. The hybrid cloud
    allows the organization of cloud resources in whatever way makes the most sense
    to the organization. Private individuals are not usually involved in a hybrid
    cloud. This is because few individuals have their own private cloud or belong
    to a community cloud as individuals.


    These concepts will be discussed further in the “Cloud Deployment Models” section
    later in this chapter.'
  merge: -1
  img_proc: true
