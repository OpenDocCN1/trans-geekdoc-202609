  md: "triggered. Some organizations run a network operations center (NOC) to monitor\
    \ network health, and NOC engineers would be best suited to manage telecommunications\
    \ equipment and ISP vendors. However, an operational incident in either of these\
    \ two systems, such as a break-in or loss of ISP connectivity, could be an input\
    \ to the SOC’s incident management function. Several controls that might be particularly\
    \ important for SOC monitoring include the following:\n\n+   - **Network security\
    \ controls:** This includes traditional devices (or their virtual equivalents)\
    \ such as network firewalls, web app firewalls (WAF), and IDS/IPS. The SOC should\
    \ be able to see if devices are functioning, alerts such as suspicious activity\
    \ or problems, and trends such as volume of dropped packets on a firewall or activity\
    \ on a honeypot system. These could be indicators of a potential attack and are\
    \ best dealt with proactively. Services may be included in the SOC monitoring\
    \ as well, especially if used to achieve critical risk mitigation objectives like\
    \ identity management (ID as a service, or IDaaS) or cloud application orchestration\
    \ via platforms like Kubernetes.\n+   \n+   - **Performance and capacity:** All\
    \ IT services have performance requirements and capacity limitations. While the\
    \ cloud can theoretically offer benefits with both, the process may not be entirely\
    \ automated. Some cloud service offerings are simply cloud-based, virtualized\
    \ versions of legacy services. In these cases, there can be capacity constraints\
    \ if the organization’s usage grows; for example, a PaaS database may run out\
    \ of storage as usage grows. Core services like storage, network bandwidth, and\
    \ compute capacity should be monitored. Many of these will also be SLA metrics\
    \ that the organization should monitor, so this function can achieve two objectives.\n\
    +   \n+   - **Vulnerability assessments:** Vulnerability scanners can be configured\
    \ to run on a defined frequency, either time- or trigger-based. Unlike audit frameworks\
    \ in the past, which included a vulnerability scan once a year during audit, organizations\
    \ implementing continuous monitoring should seek to define more frequent scan\
    \ schedules. Time-based schedules should be made to balance any operational overhead,\
    \ such as system performance slowdown, with user needs—often achieved by running\
    \ scans outside of normal business hours. Trigger-based scans can be set up to\
    \ conduct scans when certain activities occur, such as a new version of an application\
    \ being deployed to the production environment. These can often be useful in achieving\
    \ real-time risk visibility, as the scan is conducted at the same time a new attack\
    \ surface is created. Vulnerability assessments may be conducted from an internal\
    \ or external perspective to simulate what vulnerabilities a trusted insider or\
    \ malicious outsider might be able to find and exploit."
