- pgno: 269
  md: '# Internal and External Audit Controls


    Internal audit and compliance have a key role in helping to manage and assess
    risk for both a cloud customer and provider. An organization may choose to keep
    internal audit functions within the company or outsource this function to a consultant
    or outside party.


    Internal audit is an important line of defense for an organization. Many times,
    audits uncover issues with security or governance practices that can be corrected
    before more serious issues arise.


    An internal auditor acts as a “trusted advisor” as an organization takes on new
    risks. In general, this role works with IT to offer a proactive approach with
    a balance of consultative and assurance services. An internal auditor can engage
    with relevant stakeholders to educate the customer to cloud computing risks (such
    as security, privacy, contractual clarity, Business Continuity Planning (BCP)
    and Disaster Recovery Planning (DRP) compliance with legal and jurisdictional
    issues). An internal audit also helps mitigate risk by examining cloud architectures
    to provide insights into an organization’s cloud governance, data classifications,
    identity and access management effectiveness, regulatory compliance, privacy compliance,
    and cyber threats to a cloud environment.


    It is desirable for an internal auditor to maintain independence from both the
    cloud customer and the cloud provider. The auditor is not “part of the team” but
    rather an independent entity who can provide facts without fear of reprisals or
    political blowback. An addition to the advisory role, an internal auditor will
    generally perform audits in the traditional sense, making sure the cloud systems
    meet contractual and regulatory requirements and that security and privacy efforts
    are effective.


    Security controls may also be evaluated by external auditors. An external auditor
    definition does not work for the firm being audited. An external audit can be
    required by various pieces of financial legislation as well as information security
    standards such as ISO 27001. An external auditor is focused on ensuring compliance
    and therefore does not take on the role of a “trusted advisor” but rather more
    of regulator with punitive capability.


    # Impact of Audit Requirements


    The requirement to conduct audits can have a large procedural and financial impact
    on a company. In a cloud computing context, the types of audit required are impacted
    largely by a company’s business sector, the types of data being collected and
    processed, and the variety of laws and regulations that these business activities
    subject a company to. Some entities operate in heavily regulated industries subject
    to numerous auditing requirements (such as banks or chemical companies). Others
    may be brokers of data from international data subjects (such as big tech companies
    like Facebook, Google, and Microsoft).'
  merge: -1
  img_proc: true
