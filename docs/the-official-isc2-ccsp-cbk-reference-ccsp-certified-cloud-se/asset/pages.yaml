- pgno: 79
  md: 'in-motion monitoring as data leaves the particular machine, such as scanning
    the contents and attachment of an email before it is sent to identify a policy
    violation. This type of DLP must be placed in appropriate locations to be able
    to monitor unencrypted data; otherwise, users could create an encrypted tunnel,
    and the DLP will not be able to scan the data being sent. Workstation agent- or
    proxy-based tools can prevent this issue by scanning data before it is sent over
    an encrypted connection.


    +   - **At-rest monitoring** is performed on data in storage and is usually performed
    by an agent deployed on the storage device, though some network-based DLP can
    perform scans of storage locations with proper credentials. These can spot policy
    violations such as sensitive information stored outside of prescribed columns,
    for example, users entering credit card or PII in unencrypted notes/comments fields
    rather than fields where encryption, tokenization, or other controls have been
    applied. Compatibility is a particular concern for agent-based DLP solutions,
    as the organization’s storage solutions must be supported for the DLP to be effective.

    +   - **In-use monitoring** is often referred to as endpoint or agent-based DLP,
    and it relies on software agents deployed on specific network endpoints. These
    are particularly useful for monitoring users interacting with data on their workstations
    or other devices and enforcing policy requirements on the use of those endpoints.
    Compatibility is a major concern for these agents as the DLP must support the
    devices and OSs in use. Most DLP solutions offer support for popular business
    operating systems, but support for some platforms such as the macOS and mobile
    operating systems like iOS and Android may be limited.

    +   - **Enforcement:** DLP applies rules based on the results of monitoring to
    enforce security policies. For example, a DLP agent running on user’s workstation
    can generate an alert or block the user from saving sensitive information to a
    removable USB drive, or from attaching the information to an email. A network-based
    DLP can look for information by analyzing traffic entering or leaving a network
    (like a virtual private cloud), or monitor information sent to and from a specific
    host. If the DLP detects sensitive data that is not being handled appropriately,
    such as unencrypted credit card information, it can either block the traffic or
    generate an alert. Alerts and enforcement actions taken by the DLP should be monitored
    and investigated as appropriate, and are a valuable source of security incident
    detection.


    Deploying DLP in a cloud environment can be a particular challenge, especially
    in SaaS or PaaS service models where the organization lacks the ability to install
    software or that do not permit scanning such as DLP discovery. There are many
    cloud-native DLP tools, and the CCSP must ensure the organization’s system requirements
    are elicited clearly, particularly which operating systems and cloud environments
    must be supported. DLP can create operational overhead due to the time and resources
    needed to scan network traffic'
  merge: -1
  img_proc: true
