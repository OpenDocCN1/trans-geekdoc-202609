- pgno: 244
  md: '+   - **ISO 27035:** As with all ISO standards. there are several documents
    in this standard, including *Part 1: Principles of Incident Management*, *Part
    2: Guidelines to Plan and Prepare for Incident Response*, and *Part 3: Guidelines
    for ICT Incident Response Operations*. The standard is similar to other frameworks
    including a phased approach broken down into pre-, during-, and post-incident
    steps. Unlike other frameworks, these documents are not freely available. The
    steps are most closely aligned with the security controls framework and implementation
    approach outlined in the rest of the ISO 27000 standard.


    # SUMMARY


    Cloud security operations, like all other security practices, must be anchored
    by two key principles: operations must be driven by the organization’s business
    objectives or mission and must preserve the confidentiality, integrity, and availability
    of data and systems in the cloud. Operations is a far-reaching topic covering
    the selection, implementation, and monitoring of physical and logical infrastructure,
    as well as security controls designed to address the risks posed in cloud computing.


    There are a variety of standards that can assist the CCSP in implementing or managing
    security controls for cloud environments. These cover major objectives such as
    access control, securing network activity, designing operational control programs,
    and handling communications. Choosing the correct standard will be driven by each
    organization’s location, industry, and possibly costs associated with the various
    standards. All programs implemented should have feedback mechanisms designed to
    continuously improve security as risks evolve.


    Also key is an understanding of the shared responsibility model. CSPs will perform
    the majority of work related to physical infrastructure, though cloud consumers
    may need physical security for infrastructure that connects them to cloud computing.
    Logical infrastructure is a more equally shared responsibility: in non-SaaS models,
    the CSP runs the underlying infrastructure, but consumers have key responsibilities
    in securing the logical infrastructure in their virtual slice of the cloud.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Legal, Risk, and Compliance


    THE CLOUD OFFERS COMPANIES and individuals access to vast amounts of computing
    power at economies of scale only made possible by distributed architectures. However,
    those same distributed architectures can bring a unique set of risks and legal
    challenges to companies due to the geographic distribution of services the cloud
    provides. The cloud, powered by the Internet, flows freely across the borders
    of countries as information is stored in data centers worldwide and travels the
    globe. Determining what laws apply to cloud computing environments is an ongoing
    challenge, as in many situations, the company may be based in one country, host
    services in another, and be serving customers across the globe. In addition, the
    convenience and scalability offered by the cloud necessitates the acceptance of
    additional risks introduced by the reliance on a third-party provider.


    # ARTICULATING LEGAL REQUIREMENTS AND UNIQUE RISKS WITHIN THE CLOUD ENVIRONMENT


    One indisputable fact that has arisen with cloud computing is that the legal and
    compliance efforts of computing have become more complex and time-consuming. With
    data and compute power spread across countries and continents, international disputes
    have dramatically increased. Hardly a day goes by without a news story about a
    conflict relating'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'to violations of intellectual property, copyright infringements, and data breaches.
    These types of disputes existed well before the ascendance of cloud computing,
    but they have definitely become more commonplace and costly. It is in many ways
    the simplicity of cloud computing to have services span jurisdictions that has
    led to the marked increase in complexity of compliance. To prepare for these challenges,
    a cloud security professional must be aware of the legal requirements and unique
    risks presented by cloud computing architectures.


    # Conflicting International Legislation


    With cloud technologies comes the inherent power to distribute computing across
    countries and continents. Though it is certainly possible to use the cloud on
    a local or regional scale through configuration or policy, many cloud customers
    use cloud services across regions and jurisdictions to provide redundancy and
    closer service delivery across the crowded Internet. So how do companies address
    the fact that their servers, customers, and physical locations may in fact be
    governed by completely separate sets of laws? It is a constant challenge that
    requires cloud security practitioners to be familiar with multiple sets of laws
    and when they might apply. Take, for instance, the law of the land in the European
    Union (the EU, a group of 27 European countries that share a common set of laws
    and economic policies). The EU is governed by data privacy laws known as the General
    Data Protection Regulations (GDPR) that we will cover later in the chapter. Do
    these laws apply to U.S.-based companies doing business in the EU or with EU citizens?
    What about in situations where EU laws conflict with state and federal laws in
    the United States? Because of the international nature of cloud offerings and
    customers, cloud practitioners must be aware of multiple sets of laws and regulations
    and the risks introduced by conflicting legislation across jurisdictions. These
    conflicts may include the following:


    +   - Copyright and intellectual property law, particularly the jurisdictions
    that companies need to deal with (local versus international) to protect and enforce
    their IP protections

    +   - Safeguards and security controls required for privacy compliance, particularly
    details of data residency or the ability to move data between countries, as well
    as varying requirements of due care in different jurisdictions

    +   - Data breaches and their aftermath, particularly breach notification

    +   - International import/export laws, particularly technologies that may be
    sensitive or illegal under various international agreements'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Craig Mundie, the former chief of Microsoft''s research and strategy divisions,
    explained it in these terms:


    > > *People still talk about the geopolitics of oil. But now we have to talk about
    the geopolitics of technology. Technology is creating a new type of interaction
    of a geopolitical scale and importance. . . . We are trying to retrofit a governance
    structure which was derived from geographic borders. But we live in a borderless
    world.*


    In simple terms, a cloud security practitioner must be familiar with a number
    of legal arenas when evaluating risks associated with a cloud computing environment.
    The simplicity and inexpensive effort of configuring computing and storage capabilities
    across multiple countries and legal domains has led to a vast increase in the
    complexity of legal and compliance issues.


    # Evaluation of Legal Risks Specific to Cloud Computing


    The cloud offers delivery and disaster recovery possibilities unheard of a few
    decades ago. Cloud service providers can offer content delivery options to host
    data within a few hundred miles of almost any human being on Earth. Customers
    are not limited by political borders when accessing services from cloud providers.
    However, the ability to scale across the Internet to hundreds of locations brings
    a new set of risks to companies taking advantage of these services. Storing data
    in multiple foreign countries introduces legal and regulatory challenges. Cloud
    computing customers may be impacted by one or more of the following legislative
    items:


    +   - Differing legal requirements; for example, state laws in the United States
    requiring data breach notifications, which have varying timeframes and state-level
    reporting entities versus international with country-level reporting entities.

    +   - Different legal systems and frameworks in different countries, such as legislation
    versus case law/precedent. A Certified Cloud Security Professional (CCSP) shouldn''t
    be a master of all but should acquire advice from competent legal counsel.

    +   - Challenges of conflicting law, such as EU GDPR and the U.S. CLOUD Act, one
    of which requires privacy and the other that mandates disclosure. A CCSP needs
    to be aware that these competing interests exist and may need to be used to drive
    business decisions (for example, corporate structure to avoid the conflict.)


    # Legal Frameworks and Guidelines That Affect Cloud Computing


    Cloud security practitioners should be keenly aware of a number of legal frameworks
    that may affect the cloud computing environments they maintain. The following
    frameworks are the products of multinational organizations working together to
    identify key priorities in the security of information systems and data privacy.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# The Organization for Economic Cooperation and Development


    The Organization for Economic Cooperation and Development (OECD) guidelines lay
    out privacy and security guidelines. (See www.oecd.org/sti/economy/privacy-guidelines.htm.)
    The OECD guidelines are echoed in European privacy law in many instances. The
    basic principles of privacy in the OECD include the following:


    +   - **Collection limitation principle**: There should be limits on the collection
    of personal data as well as consent from the data subject.

    +   - **Data quality principle**: Personal data should be accurate, complete,
    and kept up-to-date.

    +   - **Purpose specification principle**: The purpose of data collection should
    be specified, and data use should be limited to these stated purposes.

    +   - **Use limitation principle**: Data should not be used or disclosed without
    the consent of the data subject or by the authority of law.

    +   - **Security safeguards principle**: Personal data must be protected by reasonable
    security safeguards against unauthorized access, destruction, use, or disclosure.

    +   - **Openness principle**: Policies and practices about personal data should
    be freely disclosed, including the identity of data controllers.

    +   - **Individual participation principle**: Individuals have the right to know
    if data is collected on them, access any personal data that might be collected,
    and obtain or destroy personal data if desired.

    +   - **Accountability principle**: A data controller should be accountable for
    compliance with all measures and principles.


    In addition to the basic principles of privacy, there are two overarching themes
    reflected in the OECD: first, a focus on using risk management to approach privacy
    protection, and second, the concept that privacy has a global dimension that must
    be addressed by international cooperation and interoperability. The OECD council
    adopted guidelines in September 2015, which provide guidance in the following:


    +   - **National privacy strategies**: Privacy requires a national strategy coordinated
    at the highest levels of government. CCSPs should be aware of the common elements
    of national privacy strategies based on the OECD suggestions and work to help
    their organizations design privacy programs that can be used across multiple jurisdictions.
    Additionally, a CCSP should be prepared to help their organization design a privacy
    strategy using business requirements that deliver a good cost-benefit outcome.

    +   - **Data security breach notification**: Both the relevant authorities and
    the affected individual(s) must be notified of a data breach. CCSPs should be
    aware that'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'multiple authorities may be involved in notifications and that the obligation
    to notify authorities and individuals rests with the data controller.


    +   - **Privacy management programs:** These are operational mechanisms to implement
    privacy protection. A CCSP should be familiar with the programs defined in the
    OECD guidelines.


    # Asia Pacific Economic Cooperation Privacy Framework


    The Asia Pacific Economic Cooperation Privacy Framework (APEC) is an intergovernmental
    forum consisting of 21 member economies in the Pacific Rim. (See www.aicpa.org/content/dam/aicpa/interestareas/informationtechnology/resources/privacy/downloadabledocuments/10252-346-records-management-pro.pdf.)
    The goal of this framework is to promote a consistency of approach to information
    privacy protection. This framework is based on nine principles.


    +   - **Preventing harm:** An individual has a legitimate expectation of privacy,
    and information protection should be designed to prevent the misuse of personal
    information.

    +   - **Collection limitation:** Collection of personal data should be limited
    to the intended purposes of collection and should be obtained by lawful and fair
    means with notice and consent of the individual. As an example, an organization
    running a marketing operation should not collect Social Security or national identity
    numbers, as they are not required for sending marketing materials.

    +   - **Notice:** Information controllers should provide clear and obvious statements
    about the personal data that they are collecting and the policies around use of
    the data. This notice should be provided at the time of collection. You are undoubtedly
    familiar with the banners and pop-ups in use at many websites to notify users
    of what data is being collected.

    +   - **Use of personal information:** Personal information collected should be
    used only to fulfill the purposes of collection and other compatible or related
    purposes except: a) with the consent of the individual whose personal information
    is collected; b) when necessary to provide a service or product requested by the
    individual; or, c) by the authority of law and other legal instruments, proclamations,
    and pronouncements of legal effect.

    +   - **Integrity of personal information:** Personal information should be accurate,
    complete, and kept up-to-date to the extent necessary for the purposes of use.

    +   - **Choice and consent:** Where appropriate, individuals should be provided
    with clear, prominent, easily understandable, accessible, and affordable mechanisms
    to exercise choice in relation to the collection, use, and disclosure of their
    personal information.'
