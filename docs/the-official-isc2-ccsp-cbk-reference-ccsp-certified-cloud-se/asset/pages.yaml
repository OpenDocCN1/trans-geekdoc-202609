  md: 'specifications for physical and environmental redundancy, expressed as tiers,
    that organizations can implement to achieve HA.


    +   - Tier 1 involves no redundancy and the most amount of downtime in the event
    of unplanned maintenance or an interruption.

    +   - Tier 2 provides partial redundancy, meaning an unplanned interruption will
    not necessarily cause an outage.

    +   - Tiers 3 and 4 provide N+1 and 2N+1 levels of redundancy, which results in
    increased availability. Tier 3 allows for planned maintenance activities without
    disruption, but an unplanned failure can still cause an outage. Tier 4 is known
    as fault-tolerant, meaning it can withstand either planned or unplanned activity
    without affecting availability. This is achieved by eliminating all single points
    of failure and requires fully redundant infrastructure such as dual commercial
    power feeds and dual backup generators. This redundancy provides very high availability
    but also comes at a higher cost.


    # Distributed Resource Scheduling


    Distributed Resource Scheduling (DRS) is the coordination element in a cluster
    of VMware ESXi hosts, which mediates access to the physical resources and provides
    additional features supporting high availability and management. It is a software
    component that handles the resources available to a particular cluster, the reservations
    and limits for the VMs running on the cluster, and maintenance features.


    DRS maintenance features include the ability to dynamically move running VMs from
    one physical hardware component to another without disruption for the end users;
    this is obviously useful if hardware maintenance needs to be performed or additional
    capacity is added to the cluster and the workload needs to be rebalanced. This
    supports the element of rapid elasticity and self-service provisioning in the
    cloud by automating dynamic creation and release of resources as client demands
    change.


    DRS can also handle energy management in physical hardware to reduce energy consumption
    when processing demands are low and then power resources back up when required.
    This enables cost savings for both the CSP and consumer, as hardware that is not
    actively being used does not consume energy.


    # Microsoft Virtual Machine Manager and Dynamic Optimization


    Similar to VMware’s DRS, Microsoft’s Virtual Machine Manager (VMM) software handles
    power management, live VM migration, and optimization of both storage and compute
    resources. Hosts (servers) and storage capacity can be grouped into a cluster;
    options available to configure in the VMM console include the movement of VMs
    and virtual hard disks between hosts to balance workloads across available resources.'
