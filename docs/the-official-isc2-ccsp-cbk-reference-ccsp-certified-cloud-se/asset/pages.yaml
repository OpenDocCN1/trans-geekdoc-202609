- pgno: 155
  md: 'A cloud native architecture can deploy in a DevOps, and a CI/CD process and
    can use microservices and containers.


    Serverless environments use an event-driven architecture. Events trigger and communicate
    between decoupled services. Because they are serverless, these architectures scale
    well using a REpresentational State Transfer (REST) API or event triggers.


    Cloud-based architectures are well suited to building and deploying web applications.
    Using an API Gateway, a secure API is a front door to web applications providing
    access to data and business logic.


    Considering these cloud architectures, there are a number of tools and services
    that can support the security needs of both new software solutions as well as
    legacy devices. These services provide enhanced security and deal directly with
    common security issues. These services may be supplemental services that protect
    certain parts of the application architecture, encryption services that protect
    data at rest or in motion to ensure confidentiality of the data, methods to test
    securely, and services that tie all these services, web services, and application
    services together.


    # ## Supplemental Security Components


    Supplemental security components provide service to your cloud environment to
    solve specific security concerns. For example, database monitoring works to ensure
    the integrity of our databases, while XML firewalls support application services
    through XML messages. Each supplemental security service will describe the problem
    solved by this service.


    # ## Web Application Firewall


    A web application firewall (WAF) protects HTTP/HTTPS applications from common
    attacks. Usually, a WAF protects an Internet-facing application, but it can also
    be used internally on an intranet. The WAF can be a hardware device, a software
    device, or both. The WAF monitors GET and POST requests. The requests are then
    compared to configured rules. A WAF may look for specific signatures or apply
    heuristics.


    By filtering HTTP/HTTPS traffic, a WAF helps protect against SQL injection, cross-site
    scripting (XSS) and cross-site forgery, and other attacks. The WAF specifically
    addresses attacks on application services and external sources.


    The WAF differs from an Intrusion Detection System (IDS), which monitors specific
    traffic patterns on a network. A WAF works at the application level and focuses
    on specific web application traffic and is often employed as a proxy, with one
    or more websites or web applications protected behind the WAF. The CSPs and third-party
    vendors provide many WAF options.


    # ## Database Activity Monitoring


    Database activity monitoring (DAM) refers to a set of tools that supports the
    identification and reporting of fraudulent or suspicious behavior in the databases
    used by your application services. This real-time monitoring may use but is independent
    of native DBMS'
  merge: -1
  img_proc: true
