- pgno: 142
  md: 'important part of the overall solution. Following these steps leads to a consistent
    and repeatable process. These phases are supported in older development methodologies
    such as the waterfall and spiral models as well as more modern methodologies such
    as agile and DevSecOps.


    # ## APPLY THE SECURE SOFTWARE DEVELOPMENT LIFECYCLE


    SSDLC is a collection of best practices focused on adding security to the standard
    SDLC. Applying an SSDLC process requires dedicated effort at each phase of the
    SDLC, from requirements gathering to deployment and maintenance. An SSDLC requires
    a change of mindset by the development teams, focusing on security at each phase
    of the project instead of just focusing on functionality.


    Identifying security issues early helps reduce the risk of identifying security
    vulnerabilities late in the development process and minimizes the impact when
    these are found.


    Having an SSDLC is beneficial only if it is implemented and used consistently
    and does not eliminate traditional security tests, such as penetration tests.
    Instead, it empowers developers to build secure applications from the very beginning
    of a project. Additionally, some standards and regulations, such as the General
    Data Protection Regulation (GDPR), Payment Card Industry (PCI), ISO27001, and
    others require security (data safeguards) to be incorporated in the development
    process.


    # ## Avoid Common Vulnerabilities During Development


    Common vulnerabilities and risks are listed in many places. Perhaps the most common
    list of risks in web-based development are the OWASP Top 10. These are updated
    regularly to ensure the most common risks are known to developers. By learning
    this list, developers can actively design and develop systems that have reduced
    vulnerabilities. The latest OWASP Top 10 2017 list is discussed in the “Common
    Cloud Vulnerabilities” section. The first five vulnerabilities are the following:


    +   - **Injection:** SQL, NoSQL, LDAP, and OS injection errors allow the attacker
    to run unintended commands and access data without authorization.

    +   - **Broken authentication:** When authentication and session management are
    incorrectly implemented, it leads to compromise of passwords, keys, and tokens.

    +   - **Sensitive data exposure:** Web applications and APIs may poorly protect
    sensitive data, both at rest and in transit when encryption is not used.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '+   - **XML external entities:** Evaluation of external entities in XML documents
    may disclose internal files, allow remote code execution, and lead to DoS attacks.

    +   - **Broken access control:** Poor access control may allow authenticated users
    to view unauthorized and sensitive data, execute unauthorized functions, change
    access rights, and so on.


    This OWASP Top 10 list does not change significantly at every release and has
    a few common themes. This includes misconfiguration, improper use of tools, and
    poor input validation. Each of these can then lead to data breaches, account takeover,
    and disclosure of sensitive data. Keeping this list in mind can lead to the identification
    of security vulnerabilities and the development of code that has fewer vulnerabilities.
    This in turn will lead to the development of secure software and systems.


    # Cloud-Specific Risks


    There are a number of additional risks that apply specifically to cloud computing.
    Some specific information on cloud-specific risks or security issues is provided
    in the Egregious 11 from the CSA (cloudsecurityalliance.org). The Egregious 11
    includes the following:


    +   1. Data breaches

    +   2. Misconfiguration and inadequate change control

    +   3. Lack of cloud security architecture and strategy

    +   4. Insufficient identity, credential, access and key management

    +   5. Account hijacking

    +   6. Insider threat

    +   7. Insecure interfaces and APIs

    +   8. Weak control plane

    +   9. Metastructure and applistructure failures

    +   10. Limited cloud usage visibility

    +   11. Abuse and nefarious use of cloud services


    Cloud-specific vulnerabilities identified by the CSA’s Egregious 11 can lead to
    violations of one of more of the CIA triad requirements of confidentiality, integrity,
    and availability. The risk of data breach, compromise, and exposure of sensitive
    data can lead to violations of regulations such as HIPAA and may lead to fines
    and other penalties. At the least, a well-publicized data breach can lead to a
    loss of reputation and potentially a loss of business and market share. Loss of
    data integrity and availability have similar consequences.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'Risks beyond those discussed by the CSA will exist for specific companies at
    different levels of security maturity, in various industries, and in different
    geographic locations. Each organization must know their specific additional requirements.


    The first few CSA Egregious 11 security issues will provide the framework for
    our discussion. Each organization should review all the CSA security issues and
    geographic, industry, and regulatory requirements as relevant.


    # CSA Security Issue 1: Data Breaches


    Confidential and restricted data is a key target of hackers. It can lead to loss
    of trade secrets and other intellectual property (IP), strategic processes, and
    customer data. This can harm the organization’s reputation, lead to regulatory
    fines, and expose the company to legal and contractual liability.


    In the requirements gathering phase, the data to be protected and the users that
    need access are considered. Involvement of a security architect can be beneficial
    at this stage.


    In the design and development phases, specific strategies to protect the data
    can be developed, such as data encryption and methods of authentication and authorization.
    Using existing infrastructure to provide these services leverages existing company
    assets.


    During testing, each requirement, including security requirements, must be exercised.
    Traditional testing can be extended with penetration testing and vulnerability
    scanning in our effort to develop secure software and systems.


    During deployment, the default setting in your system must be set for maximum
    security. The default state for any deployment must be a secure state. During
    O&M, organizations may modify the default settings and introduce vulnerabilities.
    This potential must be monitored and reported to ensure the system remains in
    a secure state and any changes are made with full knowledge of potential risks.
    In addition, monitoring for new vulnerabilities, threats, and the resulting risks
    is part of the O&M process. It is also during O&M that incident response and regular
    IAM reviews become part of the process.


    # CSA Security Issue 2: Misconfiguration and Inadequate Change Control


    At deployment and during O&M, securely developed software can become insecure.
    The areas to watch are data storage and transmission, excessive permissions, default
    credentials and settings, and standard security controls being disabled.


    Storage will be considered at the requirements, design, development, and test
    stages. But at deployment and O&M, the actual storage, software, and systems must
    be configured and monitored. The default configuration must be secure. Any changes
    to the default configuration must be monitored and the user provided with warnings
    when changed. A cloud environment should be configured to enforce these configurations.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'This issue is made even more serious by the reduced visibility of a cloud environment.
    When all components are on-premise, the infrastructure is known and is easily
    reconfigured, monitored, and maintained. In the cloud, some of this visibility
    and control transfers to the cloud service provider (CSP). Extra steps must be
    taken to use the cloud services to maintain as much visibility and control as
    possible.


    Many developers are new to the cloud environment, and even experienced developers
    can make errors in configuration that expose systems and data to unauthorized
    users. This exposure, when occurring in a cloud environment, can lead to worldwide
    exposure of sensitive data. Continuous automated scanning of cloud resources can
    prevent or mitigate changes in real time.


    Change control is a key part of preventing configuration changes that make a system
    less secure. Security expertise on the change control committee is an important
    step in the secure software process. In addition to introducing new vulnerabilities,
    change control prevents the reintroduction of previously corrected vulnerabilities.


    # CSA Security Issue 3: Lack of Cloud Security Architecture and Strategy


    Companies are moving to the cloud with increasing speed. Often the migration outpaces
    an organization’s ability and preparation for cloud deployment. It is advisable
    to pause and ensure that the organization has a security-focused architecture
    in place and has developed a cloud strategy before cloud development and migration
    begins. If the strategy and architecture are determined after cloud development
    or migration, similar to adding security to an application that is already deployed,
    the ability to secure software and systems and bring them into compliance will
    be more expensive and less effective.


    The size of the organization does not affect this issue. Organizations of all
    sizes need a cloud security architecture and strategy to migrate, develop, and
    operate in the cloud securely and safely. Not doing so can have severe operational
    and financial repercussions. This control exists prior to phases of the SSDLC
    and will impact each phase by requiring all phases conform to the organization’s
    security architecture and strategy policies.


    # CSA Security Issue 4: Insufficient Identity, Credential, Access, and Key Management


    This issue includes several concerns such as a scalable IAM system, the use of
    multifactor authentication, protection and rotation of cryptographic keys, protection
    of credentials, and enforcement of password policies.


    Addressing this issue begins at the requirements phase. Here, the data and IAM
    considerations are first addressed. A requirement for strong passwords, cryptographic
    protections, multifactor authentication, and so on should be part of the requirements.
    The design phase continues this process by ensuring that all requirements are
    part of the'
