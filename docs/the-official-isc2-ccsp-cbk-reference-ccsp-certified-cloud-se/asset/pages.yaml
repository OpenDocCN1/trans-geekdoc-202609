- pgno: 161
  md: 'SSO is extended through the use of federation. Federation allows SSO for resources
    across multiple IAM systems, such as multiple cloud and on-premise environments.
    This increases the risk caused by a compromised identity as the number of systems
    that may be compromised is greater. This increases substantially the importance
    of monitoring for and responding to malicious activity.


    # Multifactor Authentication


    Multifactor authentication (MFA) adds a level of security to standard user IDs
    and passwords when used appropriately. Two-factor authentication (2FA) and MFA
    are often used interchangeably. There is a subtle difference. 2FA refers to using
    two factors. MFA may use two or more factors. 2FA is a subset of MFA.


    Authentication factors are as follows:


    +   - **Something you know:** This includes answers to security questions and
    identification of previously selected photos/pictures, PINs, and passwords.

    +   - **Something you have:** Examples include a hardware token, smartphone, or
    a card, such as a debit card or smart card.

    +   - **Something you are:** This category generally refers to biometrics. This
    is generally fingerprint, facial recognition, or iris scans. Of the three, these
    are the most challenging to do reliably and at a reasonable cost.


    Often what is described as MFA is simply multiple instances of the same factor.
    An example is when a system requires a user ID, a password, and the answer to
    a security question—these are all things you know. This is single-factor authentication
    masquerading as MFA.


    One use of MFA is to limit the potential damage caused by a compromised account
    in an SSO or federated system. If, when moving from one federated system to another
    or one federated resource to another, a token is required from something you have,
    then the ease of SSO or federation is decreased slightly while increasing security.
    The method chosen will be a balanced decision based on available options, the
    cost of available options, the value of the asset being protected, and the organization’s
    risk tolerance.


    Another approach would be to simply require a token from a device periodically
    throughout the day; for example, every two hours. This limits the time a compromised
    identity can be used. The additional burden of authenticating two to three times
    a day may be an acceptable price to pay to limit the damage of a compromised identity
    in a federated or SSO environment.


    # Cloud Access Security Broker


    A CASB is an important addition to cloud security. A CASB sits between the cloud
    application or server and the customer. This service, which may be software or
    hardware-based,'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'monitors activity, enforces corporate security policies, and mitigates security
    events through identification, notification, and prevention. A part of a layered
    security strategy, a CASB is not meant to replace firewalls, IDS/IPS systems,
    or similar security systems. Instead, a CASB is meant to enhance the security
    provided by these other devices.


    A CASB that provides security must be in the path of user activity with the application.
    These CASBs may be agent-based or agentless. In either case, they are inline.
    There are also out-of-band CASBs that receive all cloud traffic for security analysis.
    These are somewhat analogous to an IPS and an IDS. The inline CASB enforces policy.
    The API-based CASB monitors for violation and analyzes cloud traffic broadly.
    In this section, we discuss inline CASBs.


    Agent-based CASBs face friction from users when a bring your own device (BYOD)
    policy is in place. When the customer owns the device, it may not be possible
    to install an agent on the devices. Even with customer permission, the wide variety
    of mobile devices may be more extensive than available agents. So, there may not
    be a compatible agent. In addition, an agent-based CASB may severely impact the
    performance of a customer''s mobile device. When the organization owns the devices,
    an agent-based approach can be more effective.


    An agentless CASB uses an API on the cloud resources to inspect all traffic to
    and from that resource to perform its responsibilities. This allows access to
    all cloud resources to be monitored regardless of endpoint ownership. It always
    can limit inspection to organizational data, eliminating some privacy concerns.
    The other advantage is that agentless CASBs can be quickly deployed and more easily
    maintained.


    # SUMMARY


    Cloud application security requires many things working together. The first step
    is to choose to develop secure applications by policy. All other decisions flow
    from this one decision. Once this decision is made, an SSDLC must be adopted with
    training on secure software development and the tools and processes used in this
    approach to application development. An SSDLC must be implemented, with development
    leading to assurance and validation activities to ensure that developed solutions
    are secure. The next step is to develop mechanisms to ensure verified software
    is distributed securely and that modified software can be detected to prevent
    the insertion of malicious code in your securely developed software solutions.
    Finally, the software solutions must be deployed using the architected secure
    solution. This approach implements secure API gateways, XML firewalls, web application
    firewalls, DAM, IAM, CASB, and other tools as necessary. These tools monitor the
    applications in use, with the ability to respond to potentially malicious behavior
    and potentially prevent malicious use.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Cloud Security Operations


    CLOUD SECURITY OPERATIONS COMPRISE a mix of old and new practices for understanding,
    mitigating, and monitoring security risks in an organization''s cloud environments.
    Old practices include standard activities that apply to legacy or on-premises
    IT, such as legal and regulatory compliance management, as well as novel activities
    like orchestrating cloud infrastructure by writing virtual machine (VM) definitions
    instead of physically installing new hardware and software.


    Key to cloud security operations are the two main roles in cloud computing: the
    cloud service provider (CSP) and the cloud consumer. The CSP and consumer share
    responsibilities for securely operating and using the cloud, respectively, and
    require clearly defined, agreed-upon objectives documented in contracts and service
    level agreements (SLAs).


    # IMPLEMENT AND BUILD PHYSICAL AND LOGICAL INFRASTRUCTURE FOR CLOUD ENVIRONMENT


    It is important to bear in mind that many aspects of secure cloud operations will
    be handled by the CSP and therefore may be largely invisible to the cloud consumers.
    As security professionals, it is critical to understand the importance of both
    the provider and consumer roles; particularly important is including adequate
    oversight of the CSP'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'in third-party security risk management activities. From the CSP''s perspective,
    proper isolation controls are essential due to the multitenant nature of the cloud,
    as well as appropriate capacity, redundancy, and resiliency to ensure the cloud
    service meets the availability requirements that customers demand.


    # Hardware-Specific Security Configuration Requirements


    In public cloud deployments, hardware configuration will be handled by the CSP
    rather than the cloud consumer. Obviously, private and community clouds will require
    the security practitioner to properly configure and secure hardware, and in some
    cases, public clouds may offer a virtual private cloud (VPC) option, where some
    of these elements are configurable by the consumer. The rules for *hardening*,
    or securely configuring, systems in cloud environments are the same as they are
    for on-prem systems, though the methods may be different.


    There are several targets for hardening hardware, including the following:


    +   - **Basic Input Output System (BIOS)**: The BIOS is a form of firmware, that
    is to say, software that controls and provides interaction capabilities for low-level
    hardware components like processors. It is typically stored in read-only memory,
    though upgradeable or “flashable” BIOS does exist. BIOS is responsible for critical
    tasks such as verifying the correct configuration and presence of expected hardware,
    performing self-testing for functionality, and handing control of the system over
    to the hypervisor or OS once initialized.

    +   - BIOS is crucial to secure booting operations, where the hardware and firmware
    configuration of a system is verified before the OS or apps are allowed to run.
    To achieve this, checks are performed to compare the installed hardware and firmware
    against a known good configuration, often using fingerprint techniques like hashing
    or digitally signed software.

    +   - Without proper security, the BIOS could be tricked into accepting unwanted
    hardware that is added to a system or modifications of the BIOS software, allowing
    an attacker to gain highly privileged access to systems and data in use.

    +   - Major areas of concern for BIOS security include the following: authentication
    of updates utilizing digital signatures from the BIOS Original Equipment Manufacturer
    (OEM), integrity protections for the BIOS software to ensure no unwanted changes
    are made, and non-bypass features such as hardware or software that block unapproved
    access.

    +   - NIST SP 800-147B, *BIOS Protection Guidelines for Servers*, provides guidance
    and details on implementing secure BIOS configurations for servers. It details
    four security features for BIOS, including authenticated update, secure local
    updates, firmware integrity, and non-bypassability requirements.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '+   - **TPM:** The Trusted Platform Module (TPM) is a dedicated module included
    in a computing system with specialized capabilities for cryptographic functions,
    sometimes referred to as a *cryptographic coprocessor*. It has dedicated components
    including a processor, persistent storage memory, and volatile memory for performing
    cryptographic processing, and it is used to support cryptographic functions and
    enable trust in a computing system.

    +   - The TPM typically provides a number of services related to cryptography,
    including random or pseudorandom number generators, asymmetric key generation,
    and hash generators. TPMs are often used for highly secure storage of limited
    data as well, such as the cryptographic keys used in full disk encryption solutions
    like Microsoft BitLocker.

    +   - TPMs are often used to form roots of trust, since they are highly specialized
    and secured. For example, a hash of hardware component versions installed in a
    system can be relied upon if it is digitally signed by the TPM. This hash can
    be compared with a hash of the current system state to determine if any changes
    have been made, allowing for the verification of a system''s hardware integrity.

    +   - TPMs are implemented in a variety of form factors. Dedicated hardware may
    be used to provide tamper resistance or tamper evidence. Integrated and firmware
    TPMs may be included as part of another chipset or run in a dedicated trusted
    execution environment of a specific chip but are generally less resistant to tampering.

    +   - Virtual TPMs are part of the hypervisor and provided to VMs running on a
    virtualization platform. Since this is a software solution, it cannot implement
    the same level of tamper resistance as a hardware-based TPM. The hypervisor is
    responsible for providing an isolated or sandboxed environment where the TPM executes,
    which is separate from the software running inside a particular VM. This isolated
    environment must implement robust access controls to block inappropriate access
    to the TPM.

    +   - A definition of TPM is provided in ISO/IEC 11889, which specifies how various
    cryptographic techniques and architectural elements are to be implemented. It
    consists of four parts including an overview and architecture of the TPM, design
    principles, commands, and supporting routines (code). An industry consortium known
    as the Trusted Computing Group publishes a specification for TPMs, which currently
    stands at version 2.0.


    # Storage Controllers


    Storage controllers are hardware implemented to, as their name implies, control
    storage devices. This may involve a number of functions including access control,
    assembly of data to fulfill a request (for example, reconstructing a file that
    has been broken into'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'multiple blocks and stored across disks), and providing users or applications
    with an interface to the storage services. Several standards exist including iSCSI
    and Fibre Channel/Fibre Channel over Ethernet (FCoE). These are storage area network
    (SAN) technologies that create dedicated networks for data storage and retrieval.
    Security concerns for SANs are much the same as for regular network services,
    including proper access control, encryption of data in transit or at rest, and
    adequate isolation/segmentation to address both availability and confidentiality.


    # Network Configuration


    For public cloud consumers, the majority of network configuration is likely to
    happen in a software-defined network (SDN) management console rather than via
    hardware-based network device configuration. It is the responsibility of the CSP
    to manage the underlying physical hardware including network controller devices
    such as switches and network interface cards (NICs). Concerns for this physical
    hardware include the following:


    +   - Providing adequate physical and environmental security for ingress and egress
    points to the facility such as point of presence (POP) rooms where ISP connectivity
    is established. This includes physical access control devices such as locks, adequate
    and redundant electrical power, and appropriate environmental controls like cooling
    to deal with the heat generated by these devices.

    +   - Designing for resiliency and redundancy of network infrastructure is essential,
    due to the heavy reliance on virtualization in cloud environments. A single network
    cable being unplugged or severed can lead to thousands of hosts losing connectivity.
    The obvious advantage to virtualization is that a redundant network connection
    is also shared, so dual NICs and ISP connections can be easily shared by hundreds
    or even thousands of hosts. Performing single point of failure (SPOF) analysis
    is crucial for the CSP to ensure they meet requirements for availability.

    +   - Establishing flexible and scalable network architecture is key. In physical
    terms, creating a LAN requires physically interconnecting users to a single switch.
    In SDNs, this same functionality needs to be available without physically changing
    any device connections. The CSP’s network must provide sufficient physical connectivity
    and support software-defined virtual local area networks (VLANs) through the use
    of 802.1Q VLAN tags.

    +   - CSPs must provide appropriate security capabilities for the virtualized
    and distributed environment. Many traditional security tools rely on techniques
    like monitoring traffic via a switched port analyzer (SPAN) or mirror port, which
    sends a copy of all traffic to the monitoring device. Inter-VM network communication
    on a virtualized host generally does not leave the physical hardware and traverse
    network connections and could therefore bypass monitoring tools that'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'rely on mirroring. VM-specific tools exist to overcome this limitation, and
    secure configuration of hypervisors must be enforced to ensure they provide appropriate
    monitoring capabilities.


    +   - CSPs may have business drivers to allow for customer-managed network security
    controls. Many public clouds offer a virtual private cloud (VPC), which is essentially
    a sandboxed area within the larger public cloud dedicated to use by a specific
    customer. These take the form of a dedicated VLAN for a specific user organization,
    which means other cloud tenants are blocked from accessing resources in the VPC
    since they are not members of the same VLAN.


    # Installation and Configuration of Virtualization Management Tools


    Virtualization management tools require particular security and oversight measures
    as they are essential to cloud computing. Without these in place, compromising
    a single management tool could lead to further compromise of hundreds or thousands
    of VMs and data. Tools that fall into this category include VMware vSphere, for
    example, as well as many of the CSP’s administrative consoles that provide configuration
    and management of cloud environments by consumers.


    Best practices for these tools will obviously be driven in large part by the virtualization
    platform in use and will track closely to practices in place for other high-criticality
    server-based assets. Vendor-recommended installation and hardening instructions
    should always be followed and possibly augmented by external hardening standards
    such as Center for Internet Security (CIS) Benchmarks or Defense Information Systems
    Agency (DISA) Security Technical Implementation Guides (STIGs). Other best practices
    include the following:


    +   - **Redundancy:** Any critically important tool can be a single point of failure
    (SPOF), so adequate planning for redundancy should be performed. High availability
    and duplicate architecture will likely be appropriate due to the nature of these
    tools.

    +   - **Scheduled downtime and maintenance:** Patching is crucially important
    for virtualization management tools, as is routine maintenance. Downtime may not
    be acceptable, so these tools may be patched or taken offline for maintenance
    on a rotating schedule with migration of live VMs to prevent loss of service.

    +   - **Isolated network and robust access controls:** Access to virtualization
    management tools should be tightly controlled, with adequate enforcement of need-to-know
    restrictions and least privilege to ensure authorization is not excessive to a
    user’s job function. Where possible, isolated networks, communication channels,
    or encryption should be utilized, such as a VPN or dedicated administrative network.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '+   - **Configuration management and change management:** These tools and the
    infrastructure that supports them should be placed under configuration management
    to ensure they stay in a known, hardened state. When changes are necessary, formal
    change management should be utilized to ensure the impact of any changes are understood
    and new risks adequately mitigated.

    +   - **Logging and monitoring:** Logging activities can create additional overhead,
    which may not be appropriate for all systems. Highly critical assets like virtualization
    management tools are likely to warrant the extra operational overhead and should
    be configured to log all activity.


    # Virtual Hardware–Specific Security Configuration Requirements


    The cloud’s heavy reliance on virtualization and multitenancy creates a new risk
    of data breaches when multiple users share a single piece of hardware. In a nonvirtual
    environment, it is comparatively difficult to leak data between systems, but a
    VM shares physical hardware with potentially hundreds of other machines.


    The biggest issue related to virtual hardware security is the enforcement, by
    the hypervisor, of strict segregation between the guest operating systems running
    on a single host. The hypervisor acts as a form of reference monitor by mediating
    access by the various guest machines to the physical resources of the hardware
    they are running on and, in some cases, inter-VM network communication. Since
    most hypervisors are proprietary and produced by software vendors, there are two
    main forms of control a CCSP should be aware of:


    +   - **Configuration:** Ensure the hypervisor has been configured correctly to
    provide the minimum necessary functionality, such as disallowing inter-VM network
    communications if not required or ensuring that virtualization tools like guest
    snapshots are encrypted.

    +   - **Patching:** This control applies for any software. Monitor vulnerabilities
    disclosed that impact the virtualization tools in use by your organization, and
    ensure all patches are applied in a timely manner.


    Virtual hardware is highly configurable and, especially in general-purpose environments
    like platform as a service (PaaS) or infrastructure as a service (IaaS) public
    cloud offerings, may not be configured for security by default. It is the responsibility
    of the cloud consumer to properly configure the cloud environment to meet their
    specific needs, such as segmenting networks and configuring network access controls
    to permit'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'only appropriate host-to-host communications. Particular concerns for virtual
    network security controls include the following:


    +   - **Virtual private cloud (VPC):** This is essentially a carved-out section
    of a public cloud dedicated to use by a particular customer. Similar to the way
    a VPN creates a virtual connection over the public Internet, a VPC gives the customer
    a greater level of control, including managing private nonroutable IP addresses
    and control over inter-VM communication, such as allowing only specific hosts
    in a middle-ware VPC to communicate on specific ports to databases in a database
    VPC. VPCs are essentially a hybrid of the public and private cloud models designed
    to balance cost savings of the public cloud with greater security in a private
    cloud.

    +   - **Security groups:** In clouds, a security group is similar to an access
    control list (ACL) for network access. Security groups can be configured to control
    access to various elements of the cloud environment, and then new VMs instantiated
    have the security group applied to manage their network access.


    A partial security concern related to virtual hardware configuration is the amount
    of virtual hardware provisioned. Many tools will allow the user to specify quantities,
    such as amount of memory, speed, and number of processing cores, as well as other
    attributes such as type of storage for a VM. Availability is obviously one concern—sufficient
    quantities of these virtual resources must be provisioned to support the intended
    workload. From a business perspective, these virtual resources should not be overprovisioned,
    however, because they do have associated costs.


    An emerging trend in cloud environments is the provisioning of hardware using
    definition files, referred to as *infrastructure as code*. These definition files
    are read by the CSP and used to specify virtual hardware parameters and configurations,
    simplifying the process of setting up and configuring the environment. In many
    organizations, this changes the old paradigm of developers writing code and operations
    personnel configuring the hosts, because developers can package infrastructure
    definitions with their application code. This requires adequate training for developers
    to ensure they understand the business needs, security requirements, and configuration
    options available to them.


    The ability to deploy infrastructure using a definition file enables a feature
    of cloud computing known as *auto-scaling*. Resources deployed in the cloud environment
    can be monitored for utilization and, as resources reach their limit, additional
    resources are automatically added. For example, a web server hosting an online
    ordering app may come under increased traffic when a celebrity endorses a product;
    in an auto-scaling cloud environment, new instances of the web server are spun
    up automatically to deal with the increased traffic. *Serverless computing* is
    another feature of cloud computing'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'that can support availability. Serverless environments like Azure Functions
    and AWS Lambda allow developers to deploy their application code without specifying
    server resources required. When the application is run—for example, a customer
    wants to place an order—the CSP provides sufficient resources to handle that demand,
    supporting availability. The cloud consumer pays for the resources only when they
    are running the particular application, saving costs.


    # Installation of Guest Operating System Virtualization Toolsets


    Toolsets exist that can provide extended functionality for various guest operating
    systems including Unix, Linux, and Microsoft Windows. These toolsets provide specific
    or enhanced capabilities for a particular operating system (OS), such as support
    for additional devices, driver software, or enhanced interactivity. In a public
    cloud, these toolsets will typically be provided by the CSP; if a customer requires
    functionality that depends on a particular OS toolset, it is up to the customer
    to verify if the CSP can support it before using that provider’s cloud.


    When managing your own virtualization environment, installing these toolsets should
    follow the concept of minimum necessary functionality. If a virtualization cluster
    will not be running virtual Windows servers, then the Windows OS toolset does
    not need to be installed. The personnel responsible for the virtualization cluster
    need to understand the business requirements and build the solution appropriately.


    # OPERATE PHYSICAL AND LOGICAL INFRASTRUCTURE FOR CLOUD ENVIRONMENT


    Cloud computing has shifted many responsibilities for managing physical and logical
    infrastructure away from the users of the corresponding services. When organizations
    hosted their own infrastructure, it was essential to have adequate processes to
    assess risks and provision adequate security controls to mitigate them, but in
    the cloud, many of these tasks are the responsibility of the cloud provider instead.
    However, the consumers must still be aware of the risks inherent in using the
    cloud. It is essential for a CCSP to understand these matters to adequately assess
    cloud services, and doubly important if the organization is providing a cloud
    service. In the case of a private cloud host or a security practitioner working
    for a CSP, these controls will be directly under the purview of the organization.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Configure Access Control for Local and Remote Access


    In most instances, access to cloud resources will be done remotely, so adequate
    security controls must be implemented in the remote administrative tools implemented
    to support these functions. Protocols for supporting remote administration a CCSP
    should be familiar with are as follows:


    +   - **Secure Shell (SSH):** As the name implies, this standard provides a secure
    way for an administrator to access and manipulate a remote system. This is often
    achieved by interacting with a local command-line interface (CLI), which sends
    commands to the remote host for execution. SSH can be configured to implement
    encryption using either symmetric (shared) or asymmetric (public/private key pair)
    cryptography. In both cases, cryptography is used for both protection of data
    via encryption as well as authentication of users based on the assumption that
    a user has maintained control of their key. Only users with the appropriate key(s)
    will be granted access.


    +   - **Remote Desktop Protocol (RDP):** RDP was initially a technology specific
    to Microsoft Windows but is now widely available across Windows, macOS, Linux,
    and mobile operating systems including iOS and Android. A typical session requires
    both an RDP server, which provides remote access and control to the machine it
    is running on, and an RDP client through which the user interacts with the remote
    machine. Security features available in RDP include encryption of data in transit,
    user authentication, and bandwidth management to ensure remote desktop sharing
    and interaction are adequate to support user interactions. As a key element of
    the Windows OS as well as remote access, RDP functionality is often a target of
    hackers, so it is critical to maintain up-to-date versions as part of patch management.


    Access to RDP can be controlled in a variety of ways. As a Microsoft standard,
    Active Directory is often utilized for identification and authentication, and
    the RDP standard also supports smart card authentication.


    +   - **Virtual Network Computing (VNC):** This may be considered analogous to
    RDP and is often implemented for remote access and control of Unix- or Linux-based
    systems where RDP is not native.


    In situations where local administration is being performed, a Secure Keyboard
    Video Mouse switch (KVM) may be utilized. This is a device that allows access
    to multiple hosts using a single set of human interface peripherals such as a
    keyboard, mouse, and monitor—a user does not need to have multiple keyboards on
    their desk physically attached to different computers.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'A basic KVM allows the user to switch their peripherals to interact with various
    computers; a secure KVM adds additional protections for highly secured environments
    that primarily address the potential for data to leak between the various connected
    systems. Attributes of secure KVMs include the following:


    +   - **Isolated data ports:** The physical construction ensures that each connected
    system is physically isolated from others.

    +   - **Tamper-evident or tamper-resistant designs:** Secure KVMs may be manufactured
    to make physical tampering extremely difficult or impossible without destroying
    vital hardware, such as permanently soldered circuit boards or components. They
    may also implement tamper-evident stickers/labels that make it obvious if the
    KVM has been opened because the sticker is torn.

    +   - **Secure storage:** KVMs may implement a buffer to store data, but switching
    between connected systems causes any data in the buffer to be erased. The buffer
    may additionally have only limited capacity, which reduces the usefulness but
    also reduces the amount of data that could potentially be leaked.

    +   - **Secured firmware:** The software required by the KVM to run may often
    be fixed—it can''t be changed without rendering the unit inoperable—or require
    signed firmware updates from the original manufacturer. Both are designed to prevent
    tampering.

    +   - **Physical disconnects:** A KVM typically contains buttons on the front
    that allow the user to switch between the various connected systems. A physical
    disconnect physically breaks the connection between each system when a new system
    button is pressed, preventing data leaks from the currently connected system to
    the next system being connected.

    +   - **USB port and device restrictions:** KVMs typically offer USB ports that
    are used to connect the peripherals being shared. Highly secured KVMs may implement
    restrictions on the type of USB devices that can be connected, such as allowing
    keyboards and mice but blocking mass storage devices, as a way to restrict what
    a malicious user can do if they gain physical access.


    All CSPs provide remote administrative access to cloud users via an administrative
    console. In AWS this is known as the Management Console, in Azure as the Portal,
    and in Google Cloud as the Cloud Console. All three offer a visual user interface
    (UI) for interaction that allows for creation and administration of resources
    including user accounts, VMs, cloud services such as compute or storage, and network
    configurations. These functions are also available via CLI tools, most of which
    call APIs to perform these same administrative functions manually and which enable
    automation such as creating resources based on infrastructure as code definition
    files.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'The CSP is responsible for ensuring access to these consoles is limited to
    properly authenticated users, and in many cases, the CSPs restrict access to consumer
    resources entirely. For example, it is possible for a user in Azure to create
    a VM and remove all network access from it, effectively locking themselves out
    as well. Even Microsoft cannot reconfigure that VM, because allowing that level
    of access to consumer resources is incredibly risky. By contrast, the cloud consumer
    is responsible for implementing appropriate authorization and access control for
    their own members in accordance with access management policies, roles, and rules.
    Due to the highly sensitive nature and abilities granted by these consoles, they
    should be heavily isolated and protected, ideally with multifactor authentication.
    All use of the admin console should be logged and should be routinely reviewed
    as a critical element of a continuous monitoring capability. Access to the UI
    or CLI functions is a key area for personnel security and access control policies,
    similar to any system or database admin position in an on-prem environment.


    # Secure Network Configuration


    One aspect of cloud services is their broad network accessibility, so it is virtually
    impossible to find a cloud security concern that does not in some way relate back
    to secure network connectivity. Several protocols and concepts are important to
    understand as they relate to securing networks and the data transmitted.


    # Virtual Local Area Networks


    VLANs were originally designed to support the goal of availability by reducing
    contention on a shared communications line. They do so by isolating traffic to
    just a subset of network hosts, so all hosts connected to the VLAN broadcast their
    communications to each other but not to the broader network. Communication with
    other VLANs or subnets must go through a control device of some sort, often a
    firewall, which offers confidentiality and integrity protections by enforcing
    network-level access control. For example, in a multi-tiered application architecture,
    the web servers will traditionally be isolated from database servers in separate
    VLANs and the database layer will implement much more restrictive access controls.


    VLAN network traffic is identified by the sending device using a VLAN tag, specified
    in the IEEE802.1Q standard. The tag identifies the VLAN that the particular data
    frame belongs to and is used by network equipment to determine where the frame
    will be distributed. For example, a switch will not broadcast frames tagged VLAN1
    to devices connected to VLAN2, alleviating congestion. Firewalls that exist between
    the two VLANs can make decisions to allow or drop traffic based on rules specifying
    allowed or denied ports, protocols, or sender/recipient addresses.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'An extension of VLAN technology specific to cloud computing environments is
    the virtual extensible LAN (VXLAN) framework. It is intended to provide methods
    for designing VLANs utilizing layer 2 protocols onto layer 3; effectively, it
    allows for the creation of virtual LANs that may exist across different data centers
    or cloud environments. VXLAN is more suitable than VLANs for complex, distributed,
    and virtualized environments due to limitations on the number of devices that
    can be part of a VLAN, as well as limitations of protocols designed to support
    availability of layer 2 devices such as Spanning Tree Protocol (STP). It is specified
    in RFC 7348.


    From the standpoint of the cloud consumer, network security groups (NSGs) are
    also a key tool in providing secure network services and provide a hybrid function
    of network traffic isolation and filtering similar to a firewall. The NSG allows
    or denies network traffic access based on a list of rules such as source IP, destination
    IP, protocol, and port number. Virtual resources can be segmented (isolated) from
    each other based on the NSGs applied to them. For example, a development environment
    may allow inbound traffic only from your organization’s IP addresses on a broad
    range of ports, while a production environment may allow access from any IP address
    but only on ports 80/443 for web traffic. Resources in the development environment
    could also be prevented from communicating with any resources in production to
    prevent an attacker from pivoting.


    # Transport Layer Security


    Transport Layer Security (TLS) is a set of cryptographic protocols that provide
    encryption for data in transit, and it replaced a previous protocol known as Secure
    Sockets Layer (SSL). The current version of TLS is 1.3; versions below this either
    are considered less secure or have demonstrated compromises. TLS provides a framework
    of supported cryptographic ciphers and keylengths that may be used to secure communications,
    and this flexibility ensures broad compatibility with a range of devices and systems.
    It also means the security practitioner must carefully configure their TLS-protected
    systems to support only ciphers that are known to be secure and disable older
    options if they have been compromised.


    TLS specifies a handshake protocol when two parties establish an encrypted communications
    channel. This comprises three steps:


    +   1. The client initiates a request with a ClientHello message. This provides
    a list of cipher suites and TLS version it supports.

    +   2. The server (if configured properly) chooses the highest-supported TLS version
    and cipher suite and communicates that choice to the client, along with the server’s
    certificate containing a public key.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '+   3. Depending on the cipher suite chosen, the client and server may then
    exchange other data, including a pre-master secret key used to negotiate a session
    key. The session key is utilized to encrypt all data that is to be shared.


    TLS can be used to provide both encryption of data as well as authentication/proof
    of origin, as it relies on digital certificates and public key cryptography. In
    many cases, such as publicly available web apps, one-way authentication is used
    for the client’s browser to authenticate the server it is connecting to, such
    as an online banking application. In *mutual authentication*, both client and
    server (or server and server) are required to exchange certificates. If both parties
    trust the issuer of the certificates, they can mutually authenticate their identities.
    Some high-security or high-integrity environments require mutual authentication
    before data is transmitted, but the overhead makes it largely infeasible for all
    TLS encryption (imagine the PKI required to authenticate every Internet user,
    web app, and IoT device on the planet).


    # Dynamic Host Configuration Protocol


    Dynamic Host Configuration Protocol (DHCP) enables computer network communications
    by providing IP addresses to hosts that dynamically join and leave the network.
    The process of dynamically assigning IP addresses is as follows:


    +   1. A DHCP server running on the network listens for clients.

    +   2. When a new client machine joins a network, it sends out a DHCPDISCOVER
    request on UDP port 67, to which the DHCP server responds with a DHCPOFFER on
    port 68.

    +   3. The client responds with a DHCPREQUEST indicating it will use the address
    assigned, and the server acknowledges with a DHCPACK.


    An easy mnemonic to remember this DHCP process is DORA for Discover, Offer, Request,
    Acknowledge. As with many network protocols, security was not originally part
    of the DHCP design. The current DHCP version 6 specifies how IPSec can be utilized
    for authentication and encryption of DHCP requests. An improperly configured DHCP
    server can lead to denial of service if incorrect IP addresses are assigned or,
    worse, can be used in a man-in-the-middle attack to misdirect traffic.


    # Domain Name System and DNS Security Extensions


    Imagine how difficult it would be if you were required to remember every company’s
    and person’s IP address in order to send them data. Human-readable addresses like'
  merge: -1
  img_proc: true
- pgno: 176
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 177
  md: 'hosted on that network and benefiting from the security controls in place.
    This security is achieved by setting up a secure tunnel, or encrypted communication
    channel, between the connecting host and the network they want to join. On the
    target network, there is often a VPN device or server that authenticates the user
    connecting and mediates their access to the network.


    Commonly used to provide remote workers access to in-office network resources,
    VPNs can also be useful in cloud architectures to safely share data between offices,
    cloud environments, or other networks. These are often implemented at the edge
    of networks to allow secure communication between any host on connected networks
    and are called *site-to-site or gateway-to-gateway VPNs*.


    There are a variety of VPN protocols and implementations that a CCSP should be
    familiar with, such as the following:


