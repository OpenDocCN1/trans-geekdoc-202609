- pgno: 219
  md: "# # Collect, Acquire, and Preserve Digital Evidence\n\nThere are four general\
    \ phases of digital evidence handling: collection, examination, analysis, and\
    \ reporting. There are a number of concerns in the first phase, collection, which\
    \ are essential for a CCSP. Evidence may be acquired as part of standard incident\
    \ response processes before the need for forensic investigation and criminal prosecution\
    \ have been identified, so the incident response team needs to handle evidence\
    \ appropriately in case a chain of custody needs to be demonstrated. Proper evidence\
    \ handling and decision-making should be a part of the incident response procedures\
    \ and training for team members performing response activities.\n\nThere are a\
    \ number of challenges associated with evidence collection in a cloud environment,\
    \ including the following:\n\n+   - **Control:** Using a cloud service involves\
    \ loss of some control, and different service models offer varying levels of access.\
    \ SaaS models typically offer little to no visibility outside a consumer’s data\
    \ or app instance, so investigating network security failures may be impossible\
    \ as the CSP does not disclose them. On the other hand, IaaS gives an organization\
    \ complete control over their virtualized network security, but may stop short\
    \ of any physical network data that might be pertinent to an investigation. Evidence\
    \ that is inaccessible is obviously a challenge to an investigation; proper contract\
    \ terms should be in place with any CSP to support an organization’s likely investigation\
    \ needs.\n+   \n+   - **Multitenancy and shared resources:** Evidence collected\
    \ while investigating a security incident may inadvertently become another data\
    \ breach in a multitenant environment, if the evidence collected includes information\
    \ that does not belong to the investigating organization. This can also cause\
    \ problems of attribution—was a particular incident caused by a malicious attacker\
    \ or by the accidental action of another tenant?\n+   \n+   - **Data volatility\
    \ and dispersion:** Cloud environments support high availability of data, which\
    \ often requires novel data storage techniques like *sharding*, which is breaking\
    \ data into smaller pieces and storing multiple copies of each piece across different\
    \ data centers. Reconstructing that data could be an error-prone process, lowering\
    \ the believability when evidence is presented, and may involve multiple legal\
    \ frameworks and jurisdiction issues when data is stored across multiple countries.\
    \ Other positive features of cloud computing such as live VM migration can complicate\
    \ evidence gathering as well. When a VM can move to anywhere in the world virtually\
    \ instantaneously, it may be hard to prove that a specific set of actions carried\
    \ out by a specific person occurred in a specific place, leading to evidence that\
    \ is worthless for prosecution."
  merge: -1
  img_proc: true
- pgno: 220
  md: '# # Preparing for Evidence Collection


    There are a number of important steps the organization should take prior to an
    incident that can support investigations and forensics. These can be built into
    several processes the organization is likely to perform for other security objectives,
    including the following:


    +   - **Logging and monitoring:** All apps, systems, and infrastructure should
    generate audit trails, which should be forwarded to a secure, centralized logging
    tool such as a syslog server or a SIEM platform. These tools should have unique
    access controls so that insiders cannot easily cover their tracks by deleting
    or altering logs, which also increases the work factor for an attacker by requiring
    multiple sets of compromised credentials to pull off an attack and cover the evidence.
    Regular reviews of logs for suspicious activity or automated correlation and alerting
    should be performed to identify potentially suspicious activity.

    +   - **Backup and storage:** Evidence often needs to be compared against a baseline
    to show how malicious activity caused changes. Adequate backups are useful to
    show how a system was configured before an incident to prove that a particular
    activity was the cause of an incident.

    +   - **Baselines and file integrity monitoring:** The known good state of a system
    is useful for comparison to an existing system when an investigator is trying
    to determine if malicious activity has occurred. Deviations from the baseline
    or files that have been changed can be indicators of an attack, or they could
    be the sign of poorly implemented change management and configuration management
    practices. If all intentional changes made by the organization are properly documented,
    it makes spotting unintended or malicious changes much easier.

    +   - **Data and records retention:** Most organizations have some requirement
    to retain records for a specific period of time dictated by business needs or
    legal/regulatory requirements. These records may be a useful source of information
    in an investigation. At the end of that retention period, data is generally destroyed,
    but the retention policy should also have clear requirements and procedures for
    placing a legal hold on records that may be pertinent, thereby preventing their
    destruction until the investigation is complete.


    # # Evidence Collection Best Practices


    Although forensics experts may perform significant amounts of evidence collection,
    security practitioners must be aware of some best practices, including the following:


    +   - When collecting evidence, it is best to utilize original physical media
    whenever possible, as copies may have unintended loss of integrity. Note that
    this applies only to collection; the best practice for analysis is to always use
    verified copies to preserve the original evidence. As mentioned, collecting physical
    evidence'
  merge: -1
  img_proc: true
- pgno: 221
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 222
  md: '+   - **Blocking interference:** Computing systems have access to a wide variety
    of wireless communications media including Bluetooth and WiFi and may also try
    to communicate with the outside world via wired connections. Forensic analysts
    and evidence handlers need to adequately shield evidence-containing devices from
    this interference. To block wireless communications during analysis, the use of
    a Faraday cage, which blocks electromagnetic signals, is a best practice. For
    transporting mobile devices, a Faraday bag is recommended; in both cases, this
    can prevent these devices from being remotely wiped or reset. Workstations and
    other devices should be analyzed using a physically air-gapped network to prevent
    similar activities.

    +   - **Working from copies:** Unlike evidence collection where use of originals
    is preferred, examination and analysis activities should be performed on copies
    of data and devices wherever possible, with frequent integrity comparisons to
    ensure the copy being analyzed matches the original. Tools such as virtualization
    are useful here, as they can create an exact copy (image) of a system for analysis.
    Where copies are not available, tools such as write blockers should be used; these
    devices allow for read-only access to devices and prevent writing to them. Even
    the simple act of connecting a drive to a modern OS causes files such as a search
    index to be written, which could destroy or damage data that the investigator
    needs.

    +   - **Document everything:** Remember the chain of custody does not mean data
    or a system has not been changed at all, but defensibly documents the who, what,
    how, why, and when of changes. Checking evidence out for analysis, calculating
    hashes for comparison, and making copies for analysis are examples of actions
    that should be documented.


    # MANAGE COMMUNICATION WITH RELEVANT PARTIES


    Adequate coordination with a variety of stakeholders is critical in any IT operation,
    and the move to utilize cloud computing resources coupled with an increasingly
    regulated and dispersed supply chain elevates the priority of managing these relationships.
    Communication is a cornerstone of this management; providing adequate and timely
    information is critical. While this may be a skillset fundamental to project managers
    rather than security practitioners, it is worth understanding the importance of
    effective communication and supporting it whenever possible.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Effective communication should possess a number of qualities. The contents,
    nature, and delivery of communications will drive many decisions, which can be
    elicited using a series of questions about the information to be conveyed.


    +   - **Who?** The intended audience will determine the contents of a communication,
    such as the level of technical detail included or amount of information. In security
    incidents, communications to the general public may be reviewed by the organization’s
    legal department to avoid any admission of culpability or exposing sensitive information.


    +   - **What?** The goal of the communication must be met by the contents. For
    example, reports to investors and business partners would contain different sets
    of details, as partners are likely to be under an NDA but the general public is
    not. If the message does not clearly answer the question, “So what?”, it is likely
    the audience will not find it terribly useful.


    +   - **Why?** The purpose of the communication should be clear, and the intended
    audience should be able to make immediate use of it. We are all familiar with
    technical error messages that provide less-than-helpful details of an internal
    memory error at a specific register address, but that does not help the average
    user to carry on with their work.


    +   - **When?** Is the communication timely? If a data breach happened two years
    ago and the organization knew but did not report it, the information is likely
    to be useless as users will already have been targeted for identity theft scams.
    Furthermore, the communication is likely to cause reputational harm, as the organization
    could be accused of covering up the incident rather than reporting it in a timely
    fashion.


    There are a number of stakeholders or constituents with whom an organization is
    likely to communicate regarding IT services, organizational news and happenings,
    and emergency information. Establishing clear methods, channels, and formats for
    this communication is critical.


    # Vendors


    Few organizations exist in a vacuum; the modern supply chain spans the globe,
    and regulatory oversight has begun to enforce more stringent oversight of this
    supply chain. It is therefore essential that an organization and its security
    practitioners understand the supply chain and establish adequate communications.


    The first step in establishing communications with vendors is an inventory of
    critical third parties on which the organization depends. This inventory will
    drive third-party or vendor risk management activities in two key ways. First,
    some vendors may be critical'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'to the organization’s ongoing functioning, such as a CSP whose architecture
    has been adopted by the organization. Second, some vendors of goods and services
    may provide critical inputs to an organization like a payment card processor whose
    service supports the organization’s ability to collect money for its goods or
    services.


    Communication with critical vendors should be similar to internal communications
    due to the critical role these vendors play in the business. If a vendor incident
    is likely to impact an organization’s operations, the organization ought to have
    well-established communications protocols to receive as much advance notice as
    possible. If a consumer notices an incident such as loss of availability of a
    vendor’s service, there should be adequate reporting mechanisms to raise the issue
    and resolve it as quickly as possible.


    Many vendor communications will be governed by contract and SLA terms. When a
    CSP is a critical vendor, there should be adequate means for bidirectional communication
    of any issues related to the service, such as customer notices of any planned
    outages or downtime, emergency notifications of unplanned downtime, and customer
    reporting for service downtime or enhancements. In many cases, this will be done
    through a customer support channel with dedicated personnel as well as through
    ticketing systems, which creates a trackable notice of the issue, allowing all
    parties to monitor its progress.


    # Customers


    As cloud consumers, most organizations will be the recipients of communications
    from their chosen CSPs. While this might seem to imply there are no responsibilities
    other than passively receiving information from and reporting issues to the CSP,
    consumers do have a critical accountability: defining SLA terms. Levels of communication
    service from the CSP should all be defined and agreed-upon by both parties, such
    as speed of acknowledging and triaging incidents, required schedule for notification
    of planned downtime or maintenance, days/times support resources are available,
    and even the timeframe and benchmarks for reporting on the service performance.
    SLAs may be generic and standardized for all customers of a CSP or may be highly
    specific and negotiated per customer, which offers more flexibility but usually
    at greater cost.


    # Shared Responsibility Model


    A key source of information to be communicated between CSPs and their customers
    is the responsibility for various security elements of the service. The CSP is
    solely responsible for operational concerns like environmental controls within
    the data center, as well as security concerns like physical access controls. Customers
    using the cloud service are responsible for implementing data security controls,
    like encryption, that are appropriate to the type of data they are storing and
    processing in the cloud. Some areas require action by both the provider and customer,
    so it is crucial for a CCSP to understand which cloud service models are in use
    by the organization and which areas of security must be addressed by each party.
    This is commonly referred to as the shared'
  merge: -1
  img_proc: true
- pgno: 225
  md: <!-- no content -->
  merge: -1
