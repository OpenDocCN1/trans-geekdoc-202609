- pgno: 241
  md: 'notification to authorities within a certain timeframe after an incident is
    detected. Appropriate communication resources like legal counsel or public relations
    personnel may be required on the IRT to handle these incidents.


    **Respond:** Once the organization has been alerted to an incident, its IR capability
    is activated, and an appropriate remediation must be developed. In most incidents,
    the overriding concern during the response phase should be containing the incident;
    that is to say, preventing it from causing further damage. In some cases, gathering
    information about the attack may be required, during which time the incident continues
    to occur; in this case, the extra information gained must be more valuable than
    the damage caused by the ongoing attack.


    Once sufficient information is gathered, a containment strategy must be formulated
    and implemented. This should follow the documented scenario-based responses in
    the IRP whenever possible; for example, responding to a ransomware attack by isolating
    any affected machines and working to establish how the malware was installed.
    Once this is ascertained, deploying techniques for preventing other machines from
    being affected may be more important than recovering data on machines that have
    already been compromised. These types of decisions should be made by qualified
    personnel with as much information as possible at their disposal.


    Notification is typically handled as part of incident detection, and formal reporting
    is an ongoing task that starts after the initial notification. In simple cases,
    the report may comprise a single document at the resolution of an incident with
    the particulars, while in other cases, ongoing reporting of a dynamic situation
    will be required. As you may have seen during high-profile data breaches at public
    organizations, initial reporting is made on the incident with information available
    at that moment, even if it is estimated. As the investigation proceeds, updated
    reports are delivered to convey new information. The IR coordinator, along with
    appropriate communication resources on the IRT, is responsible for creating and
    disseminating all required reporting to appropriate stakeholders.


    During the response phase, additional information should be gathered and documented
    regarding the incident. This may include details of any external attacker or malicious
    insider who might be responsible and should be conducted in accordance with the
    digital evidence handling previously discussed.


    **Recover:** This phase may actually be started as soon as the detection phase
    and continue until the cause of the incident is completely eradicated and normal
    operations have resumed. Actions like changing a password for a user who responded
    to a phishing email or following documented procedures like restarting a server
    for unexpected app behavior can be recovery actions.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Eradication of the underlying cause is also a critical element of the recovery.
    This may include actions such as replacing faulty hardware, blocking a specific
    IP address or user from accessing a resource, or rebuilding compromised systems
    from known good images. Containment prevents the incident from spreading further,
    while eradication removes the immediate cause of the incident. It may be the case
    that neither prevents the problem from reoccurring in the future, which is a part
    of post-incident activities.


    Recovery and eradication end when the organization returns to normal operations.
    This is defined as the pre-incident service level delivered using standard procedures.


    +   - **Post-incident:** Once normal operations have resumed, the IRT should ensure
    all documentation from the incident is properly created and stored. Lessons learned
    from conducting the response should be gathered and used to improve the incident
    response process itself. Finally, the organization should conduct a root-cause
    analysis to identify any underlying causes and appropriate steps to prevent the
    incident from recurring in the future.


    Incident response is designed to help the organization restore normal operations
    quickly, but there are situations when this will be impossible. In these cases,
    the incident may need to be upgraded to an interruption, which is an event whose
    impact is significant enough to disrupt the organization’s ability to achieve
    its goals or mission. A few users with malware infections on their workstations
    is an incident that can likely be handled by normal IT resources, but an outbreak
    affecting all critical systems and a large percentage of users is likely to require
    more resources.


    In such cases, the IR coordinator may be empowered to declare an interruption
    or disaster, which invokes processes like BCDR. Similar to IR, there should be
    clear plans in place to guide the organization’s response, such as emergency authorization
    to buy new equipment outside of normal purchasing processes or invocation of alternate
    procedures like using a third party to process information. The IR coordinator
    should be aware of their role and responsibilities in these plans, including the
    process for declaring and notifying appropriate members of the BCDR team to take
    over.


    # Cloud-Specific Incident Management


    As discussed, the migration to a third-party CSP can introduce additional complexity
    to an organization. When planning for incident management, the CSP must be considered
    as a critical stakeholder. Appropriate points of contact should be documented
    and reachable in the event of an incident, such as a service delivery or account
    manager who can'
