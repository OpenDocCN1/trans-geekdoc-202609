- pgno: 204
  md: 'management oversight of processes via these metrics. The organization’s IT
    services, including the ISMS and all related processes, should be monitored for
    effectiveness and placed into a cycle of continuous improvements. The goals of
    this continuous improvement program should be twofold: first to ensure the IT
    services (including security services) are meeting the organization’s business
    objectives, and second to ensure that the organization’s security risks remain
    adequately mitigated.


    One critical element of continual service improvement includes elements of monitoring
    and measurement, which often take the form of security metrics. Metrics can be
    tricky to gather, particularly if they need to be presented to a variety of audiences.
    It may be the case that business leaders will be less interested in deeply technical
    topics, which means the metrics should be used to aggregate information and present
    it in an easily understood, actionable way.


    For instance, rather than reporting a long list of patches and Common Vulnerabilities
    and Exposures (CVEs) addressed (undoubtedly an important aspect of security risk
    management), a more appropriate metric might be the percentage of machines patched
    within the defined timeframe for the criticality of the patch; for example, 90
    percent of machines were patched within seven days of release. Acceptable values
    should also be defined, which allows for key performance indicators (KPIs) to
    be reported.


    In this example, the KPI might be red (bad), if the organization’s target is 99
    percent patch deployment within seven days of release—a clear indicator to management
    that something needs their attention.


    There are other sources of improvement opportunity information as well, including
    audits and actual incidents. Audits may be conducted internally or externally,
    and findings from those audits can be viewed as improvement opportunities. Actual
    incidents, such as a business interruption or widespread malware outbreak, should
    be concluded with a lessons learned or postmortem analysis, which provides another
    source of improvement opportunities. The root cause of the incident and any observations
    made during the recovery can be used to improve the organization’s IT security
    services.


    # Incident Management


    It is important to understand the formal distinction between events and incidents
    as the foundation for incident management.


    +   - **Events** are any observable item, including routine actions such as a
    user successfully logging into a system, a file being accessed, or a system being
    unavailable during a scheduled maintenance window. Many routine events will be
    logged but do not require any additional actions.

    +   - **Incidents**, by contrast, are events that are both unplanned and have
    an adverse impact on the organization. Incidents typically require investigation
    and remedial action by some combination of IT, operations, and security personnel.
    Examples'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'of incidents include unexpected restart of a system, ransomware preventing
    users from accessing a system, or a loss of network connectivity to a cloud service.


    All incidents should be investigated and remediated as appropriate to restore
    the organization’s normal operations as quickly as possible and to minimize adverse
    impact to the organization such as lost productivity or revenue. This resumption
    of normal service is the primary goal of incident management.


    Not all incidents will require participation by the security team. For example,
    a spike in new user traffic to an application after a marketing campaign goes
    live, which leads to a partial loss of availability, is an operational issue and
    not a security one. A coordinated denial-of-service attack by a foreign nation-state,
    however, is an incident that requires participation by both IT and security personnel
    to successfully remediate.


    All organizations require some level of incident management capability; that is,
    the tools and resources needed to identify, categorize, and remediate the impacts
    of incidents. This capability will revolve around an incident management plan,
    which should document the following:


    +   - Definitions of incident types, such as internal operational incidents, security
    incidents, and cloud provider incidents.

    +   - The incident response team (IRT) personnel. Note the composition of this
    team will be dependent upon the type of incident, but an incident response coordinator
    should always be appointed to assess the situation and identify the requisite
    team members on a per-incident basis.

    +   - Roles and responsibilities for the IRT personnel in each incident type.
    This should include roles internal to the organization, as well as responsibilities
    of external stakeholders such as law enforcement, business partners or customers,
    and the cloud provider if the incident may affect them.

    +   - Resources required such as operations or security management tools to facilitate
    detection and response, such as a security information and event management (SIEM)
    or IDS, and required personnel.

    +   - Incident management processes following a logical lifecycle from detection
    of the incident to response to restoration of normal service. The response coordinator
    should determine relevant response requirements, including the following:

    +     - Communications appropriate to the specific incident, both internal and
    external, with stakeholders including customers, employees, executive management,
    law enforcement, regulatory bodies, and possibly the media

    +     - Any required breach or privacy law notifications, if the incident involved
    PII or other regulated data'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'A variety of standards exist to support organizations developing an incident
    response capability, including the ITIL framework, NIST Special Publication 800-61
    *Computer Security Incident Handling Guide*, and ISO 27035, *Security incident
    management*. All standards implement a lifecycle approach to managing incidents,
    starting with planning before an incident occurs, activating the response, and
    following the documented steps, and ending with reporting on the results and any
    lessons learned to help the organization better mitigate or respond to such incidents
    in the future. Figure 5.1 shows an example of the NIST SP 800-61 lifecycle and
    a description of the activities.


    ![](img/31b2d0f6902e5b79691e4de3b480b89a_206_0.png)


    # FIGURE 5.1 NIST incident response lifecycle phases


    The CCSP’s role in developing the capability is, obviously, the responses required
    for security incidents, while other stakeholders from IT or operations will provide
    input relevant to their responsibilities. All incident response frameworks emphasize
    the importance of planning ahead for incidents by identifying likely scenarios
    and developing response strategies before an incident occurs, as incidents can
    be a high-stress situation and ad hoc responses are less preferable than pre-planned,
    rehearsed responses.


    As with all aspects of cloud service use, there are shared responsibilities between
    the CSP and the consumer when responding to incidents. For many incidents, the
    CSP will not be involved; for example, an internal user at a consumer organization
    breaches policies to misuse company data. This does not impact the CSP; however,
    some incidents will require coordination, such as a denial-of-service attack against
    one consumer, which could impact other consumers by exhausting resources. The
    CSP could also suffer an incident, like an outage of a facility or theft of hardware
    resources, which must be reported to consumer organizations and may trigger their
    incident management procedures. The major CSPs have dedicated incident management
    teams to coordinate incident responses, including resources designed to provide
    notice to consumers such as a status page or dedicated account managers. Your
    incident planning must include'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'coordination with your CSPs, and you should be aware of what capabilities are
    and are not available to you. Many CSPs forbid physical access to their resources
    during an incident response unless valid law enforcement procedures, such as obtaining
    a warrant, have been followed.


    Another important aspect of the organization’s incident management capability
    is the proper categorization and prioritization of incidents based on their impact
    and criticality. Incident management seeks to restore normal operations as quickly
    as possible, so prioritizing incidents and recovery steps is critical. This is
    similar to the risk assessment process where risks are analyzed according to their
    impact and likelihood; however, since incidents have already occurred, they are
    measured by the following:


    +   - **Criticality/impact:** The effect the incident will have on the organization,
    often measured as low/moderate/high/critical.

    +   - **Urgency:** The timeframe in which the incident must be resolved to avoid
    unwanted impact. For example, unavailable systems that do not impact life, health,
    or safety will always be less urgent than systems that do impact these factors;
    therefore, they should be prioritized lower for resolution.


    Many organizations utilize a P score (P0–P5) to categorize incidents. Members
    of the incident response team use this score to prioritize the work required to
    resolve an incident. For example, a P5 or low-priority item may be addressed as
    time permits, while a P0, which equates to a complete disruption of operations,
    requires that all other work be suspended. In many organizations, a certain priority
    rating may also be a trigger for other organizational capabilities, such as the
    invocation of a business continuity or disaster recovery plan if the incident
    is sufficiently disruptive to normal operations.


    # Problem Management


    In the ITIL framework, problems are the causes of incidents or adverse events,
    and the practice of problem management seeks to improve the organization’s handling
    of these incidents. Problems are, in essence, the root cause of incidents, so
    problem management utilizes root-cause analysis to identify the underlying problem
    or problems that lead to an incident and seeks to minimize the likelihood or impact
    of incidents in the future; it is therefore a form of risk management.


    Identified problems are tracked as a form of common knowledge, often in a known
    issues or known errors database. These document an identified root cause that
    the organization is aware of, as well as any shared knowledge regarding how to
    fix or avoid them. Examples might include a set of procedural steps to follow
    when troubleshooting a particular system, or a *workaround*, which is a temporary
    fix for an incident. Workarounds do not mitigate the likelihood of a problem occurring
    but do provide a quick fix, which'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'supports the incident management goal of restoring normal service as quickly
    as possible. Problems are risks to the organization, and if the workarounds do
    not provide sufficient risk mitigation, then the organization should investigate
    a more permanent solution to resolve the underlying cause.


    # Release Management


    The last few years have seen an enormous shift from traditional release management
    practices due to widespread adoption of Agile development methodologies. The primary
    change is the frequency of releases due to the increased speed of development
    activities in continuous integration/continuous delivery, often referred to as
    a CI/CD pipeline. Under this model, developers work on small units of code and
    merge them back into the main branch of the application’s code as soon as they
    are finished.


    Inherent in a CI/CD pipeline is the concept of automated testing, which is designed
    to more quickly identify problems in an easier-to-solve way. By running tests
    on only small units of code being integrated, it’s easier for the developers to
    identify where the problem is and how to fix it. From the user’s perspective,
    they get access to new features more quickly than waiting for a monolithic release
    and, ideally, get fewer bugs due to the faster feedback to developers that automated
    testing offers.


    Release management activities typically comprise the logistics needed to release
    the changed software or service and may include identifying the relevant components
    of the service, scheduling the release, and post-implementation reviewing to ensure
    the change was implemented as intended, i.e., that the new software or service
    is functioning as intended. The process has obvious overlap with change management
    processes.


    In the Agile methodology, the process of release management may not involve manual
    scheduling, instead relying on the organization’s standard weekly, monthly, or
    quarterly release schedule. For organizations using other development methodologies,
    the process for scheduling the deployment might require coordination between the
    service provider and consumers to mitigate risks associated with downtime, or
    the deployment may be scheduled for a previously reserved maintenance window during
    which customer access will be unavailable.


    Once scheduled, the release manager must perform a variety of tasks, including
    identifying whether all changes to be released have successfully passed required
    automated tests as well as any manual testing requirements. Other manual processes
    such as updating documentation and writing release notes may also be part of the
    organization’s release management activities. Once all steps have been completed,
    the release can be deployed and tested and is ready for users.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Deployment Management


    In more mature organizations, the CD in CI/CD stands for continuous deployment,
    which automates the process of release management to deliver a truly automatic
    CI/CD pipeline. Once a developer has written their code and checked it in, an
    automated process is triggered to test the code, and if all tests pass, it is
    integrated and deployed automatically to users. This has the advantage of getting
    updated software and services deployed to users quickly and offers security benefits
    as well. For example, automated testing is typically less expensive than manual
    testing, making it feasible to conduct more tests and increase the frequency in
    complement to the organization’s manual testing plans.


    Even organizations with continuous deployment may require some deployment management
    processes to deal with deployments that cannot be automated, such as new hardware
    or software. In this case, the release management process should develop a set
    of deployment steps including all required assets, dependencies, and deployment
    order to ensure the deployment process is successful.


    One recent technology development supporting this trend of more frequent deployment
    is containerization, which packages application code and non-OS software the application
    requires into a container. Containers can be run on any computing platform regardless
    of underlying hardware or operating system, so long as container software such
    as the Docker Engine is available. The container software makes the resources
    of the computing environment available in response to the requirements of the
    containerized applications when they run, similar to the way virtualization makes
    hardware resources available to a virtualized guest OS.


    Containers offer advantages of portability. In other words, they can be run on
    any OS and hardware platform with container software, as well as availability
    advantages over traditional infrastructure due to requiring fewer pieces of software
    to run. Continuous deployment pipelines often make use of containers, as they
    provide more flexibility and can speed development.


    Deployment scheduling for noncontinuous environments may follow a set schedule
    such as a routine maintenance window or be deployed in a phased approach where
    a small subset of users receive the new deployment. This phased approach can offer
    advantages for riskier deployments such as large operating system updates, where
    unexpected bugs or issues may be encountered. By rolling out to a subset of the
    user pool, the impact of these bugs is reduced, and the organization has more
    opportunity to find and correct them. Organizations may also choose not to push
    deployments but instead allow users to pull the updated software/service on their
    own schedule. This is the model many consumer OSs follow, where an update is made
    available and users are free to accept or'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'delay the update at their discretion. This is advantageous for uptime as a
    user may not want to restart their machine in the middle of an important task,
    though it does lead to the problem of software never being updated, which means
    vulnerabilities fixed by that update are also not addressed.


    # ✓ Immutable Infrastructure


    Cloud services have significantly shifted the way many organizations build their
    information system environments. In traditional models, a physical location with
    utilities had to be built, appropriate equipment like servers and routers installed,
    and then operating systems and application software installed on top of that hardware.
    Once installed, software was placed into an operations and maintenance cycle where
    new patches or features were installed, but often the basic infrastructure was
    untouched for years, due to the time and cost involved. You wouldn’t go out and
    build a whole new data center just to apply a minor patch! This led to sometimes
    “stale” assets such as hardware or software that hadn’t been updated or that had
    drifted away from a secure configuration, which can introduce major vulnerabilities.


    In cloud environments where all resources exist as virtual pools, there are fewer
    limitations on building virtual infrastructure, tearing it down, and rebuilding
    it. This gives rise to the idea of immutable architecture, which is built as needed,
    remains in a consistent state in line with a validated image during its (rather
    short) useful life, and then is destroyed and replaced by a new version when the
    system is next deployed. This helps overcome the problem of assets becoming stale
    by ensuring systems with up-to-date patches are always deployed and by blocking
    the infrastructure from being changed, which is why it’s called *immutable*, which
    means unchangeable.


    # Configuration Management


    Configuration management (CM, not to be confused with change management, which
    is also abbreviated CM) comprises practices, activities, and processes designed
    to maintain a known good configuration of something. *Configuration items* (CIs)
    are the things that are placed under configuration control and may be assets such
    as source code, operating systems, documentation, or even entire information systems.


    Changes to CIs are usually required to go through a formal change process designed
    to ensure the change does not create an unacceptable risk situation, such as introducing'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'a vulnerable application or architecture. Part of the change management process
    must include updating the CMDB to reflect the new state of the services or components
    after the change is executed. For example, if a particular host is running Service
    Pack 1 (SP1) of an OS and a major upgrade to SP2 is performed, the CMDB must be
    updated once the change is completed successfully.


    IT service CM may include hardware, software, or the cloud services and configurations
    in use by a consumer organization, while the CSP would also need to include configurations
    of the service infrastructure as well as the supply chain used to provide the
    services.


    In many organizations, a formal CMDB will be used to track all CIs, acting as
    a system of record against which current configurations may be compared in order
    to detect systems that have gone out of line with expected configurations. The
    CMDB can also be useful for identifying vulnerabilities. As a source of truth
    for systems and software versions running in the organization, it is possible
    to query the CMDB to identify software running in the organization that contains
    a newly disclosed vulnerability. Furthermore, the CMDB can be useful to support
    audits by acting as a source of population data to allow auditors to choose a
    subset of systems to review. If the CMDB is not updated after changes are made,
    the organization is likely to face audit findings stemming from failure to properly
    follow processes.


    Due to the type of information contained in a CMDB, such as version numbers, vendor
    information, hardware components, etc., it can also be used as the organization’s
    asset inventory. Many tools that provide CMDB functionality can also be used to
    automatically detect and inventory systems, such as by monitoring network records
    to identify when a new system joins or by integrating with cloud administrative
    tools and adding any new cloud services that are invoked to the CMDB.


    Checklists or baseline are often mentioned in discussions of CM, primarily as
    starting points or guidance on the desired secure configuration of particular
    system types. Configuration checklists are often published by industry or regional
    groups with specific guidance for hardening of operating systems like Windows,
    macOS, and various Linux distributions, as well as the hardening of popular applications
    such as Microsoft Office and collaboration tools. In many cases, the vendors themselves
    publish security checklists indicating how their products’ various security settings
    can be configured. In all cases, these checklists are usually an input to an organization’s
    CM process and should be tailored to meet the organization’s unique needs.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Infrastructure as Code


    Similar to immutable architecture, which supports configuration management security
    goals for cloud consumers by preventing unwanted changes, infrastructure as code
    can help organizations ensure known good versions of infrastructure are deployed.
    This might include specially hardened OS or applications, network configurations,
    or other elements of infrastructure.


    Infrastructure as code is a form of virtualization whereby system configuration
    information is written as a definition file that can be used by the cloud service
    to create machines with particular settings, rather than manual hardware and software
    configuration. In this way, developers can specify their application’s needed
    infrastructure, and all instances will be configured according to that definition,
    ensuring that properly patched and configured systems are deployed automatically
    without the need for human intervention. While it’s possible human error might
    occur in writing a definition file, it’s less likely than an error in a mundane
    repetitive task like building and deploying servers.


    # Service Level Management


    In the ITSM view of IT as a set of services, including information security, there
    is a function for defining, measuring, and correcting issues related to delivery
    of the services. In other words, performance management is a critical part of
    ITSM. This is closely related to the process of continual service improvement,
    and in fact, the same metrics are likely to be used by the organization to determine
    if services are meeting their defined goals.


    Service level management rests on the organization’s defined requirements for
    a service. The most common service level many cloud organizations encounter is
    availability, often expressed as a percentage of time that a system can be reached
    and utilized, such as 99.9 percent. A service with a 99.9 percent availability
    level must be reachable approximately 364.64 days per year; put another way, the
    system can only be down for less than 24 hours each year. Examples of other service
    levels that may be managed include number of concurrent users supported by a system,
    durability of data, response times to customer support requests, recovery time
    in the event of an interruption, and timeframes for deployment of patches based
    on criticality.


    A key tool in managing service levels is the service level agreement (SLA), which
    is a formal agreement similar to a contract, but focused on measurable outcomes
    of the service being provided. This measurement aspect is what makes SLAs critical
    elements of security risk mitigation programs for cloud consumers, as it allows
    them to define, measure, and hold the cloud provider accountable for the services
    being consumed.'
  merge: -1
  img_proc: true
- pgno: 213
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 214
  md: 'offerings that can offer features like automatic data replication to multiple
    data centers around the world, or concurrent hosting of applications in multiple
    data centers so that an outage at one does not render the service unreachable.


    Cloud consumers have a role to play in availability management as well. Consumers
    of IaaS will, obviously, have the most responsibility with regard to availability
    of their cloud environment, since they are responsible for virtually everything
    except the physical facility. PaaS and SaaS users will need to properly architect
    their cloud solutions to take advantage of their provider’s availability options.
    For example, some cloud providers offer automatic data replication for cloud-hosted
    databases, but there may be configuration changes required to enable this functionality.
    There may be other concerns as well, such as data residency or the use of encryption,
    which can complicate availability; it is up to the cloud consumer to gather and
    understand these requirements and to configure their cloud services appropriately.


    # Capacity Management


    In ITSM, one of the core concerns of availability is the amount of service capacity
    available compared with the amount being subscribed to. In a simple example, if
    a service has 100 active users but only 50 licenses available, that means the
    service is over capacity and 50 users will face a denial-of-service condition.
    In this simple example the service is oversubscribed, meaning there are more users
    than capacity. The service provider must be able to predict, measure, and plan
    for adequate capacity to meet its obligations; failure to do so could result in
    financial penalties in the form of an SLA enforcement.


    As users, we are aware of the negative impacts resulting from a lack of system
    resources—irritating situations such as a spinning hourglass or beach ball when
    our desktop computer’s RAM capacity is exceeded. While a minor irritant for individual
    users, this situation could prove quite costly for a business relying on a cloud
    service provider’s infrastructure. Any service that is being consumed should be
    measurable, whether it is network bandwidth, storage space, processing capability,
    or availability of an application. Measured service is one of the core elements
    of cloud computing, so metrics that illustrate demand for the service are relatively
    easy to identify.


    Cloud service providers must take appropriate measures to identify the service
    capacity they need to provision. These measures might include analysis of past
    growth trends to predict future capacity, identifying capacity agreed to in SLAs,
    or even analysis of external factors such as knowing that a holiday season will
    cause a spike in demand at certain customers like online retailers. Monitoring
    of current services, including utilization and demand, should also be part of
    the analysis and forecasting model.


    In some cases, cloud service providers and their customers may be willing to accept
    a certain amount of oversubscription, especially as it could offer cost savings.
    To extend the'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'previous example, assume the service provider offers 50 licenses and the business
    has 100 users split between the United States and India. Given the time zone difference
    between the two countries, it is unlikely that all 100 users will try to access
    the system simultaneously, so oversubscription does not present an issue.


    If the consumer does require concurrent accessibility for all 100 users, then
    they must specify that as an SLA requirement. The provider should then utilize
    their capacity management processes to ensure adequate capacity is provisioned
    to meet the anticipated demand.


    # SUPPORT DIGITAL FORENSICS


    Digital forensics, broadly, is the application of scientific techniques to the
    collection, examination, and interpretation of digital data. The primary concern
    in forensics is the integrity of data, as demonstrated by the chain of custody.
    Digital forensics is a field that requires very particular skills and is often
    outsourced to highly trained professionals, but a CCSP must be aware of digital
    forensic needs when architecting systems to support forensics and how to acquire
    appropriate skills as needed to respond to a security incident.


    Digital forensics in cloud environments is complicated by a number of factors;
    some of the very advantages of cloud services are also major disadvantages when
    it comes to forensics. For example, high availability and data replication mean
    that data is stored in multiple locations around the world simultaneously, which
    complicates the identification of a single crime scene. Multitenant models of
    most cloud services also present a challenge, as there are simply more people
    in the environment who must be ruled out as suspects. The shared responsibility
    model also impacts digital forensics in the cloud. As mentioned previously, most
    CSPs do not allow consumers physical access to hardware or facilities, and even
    with court orders like a warrant, the CSPs may have procedures in place that make
    investigation, collection, and preservation of information more difficult. This
    is not to frustrate law enforcement, but is a predicament caused by the multitenant
    model; allowing investigation of one consumer’s data might inadvertently expose
    data belonging to other consumers. Investigation of one security incident should,
    as a rule, not be the cause of other security breaches!


    # Forensic Data Collection Methodologies


    In legal terminology, discovery means the examination of information pertinent
    to a legal action. E-discovery is a digital equivalent comprising steps including
    identification, collection, preservation, analysis, and review of electronic information.
    There are two important standards a CCSP should be familiar with related to e-discovery.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '+   - **ISO 27050:** ISO 27050 is a four-part standard within the broader ISO
    27000 family of information security standards.


    +   - Part 1, *Overview and concepts*, defines terms and requirements for organizations
    to consider when planning for and implementing digital forensics to support e-discovery.


    +   - Part 2, *Guidance for governance and management of electronic discovery*,
    offers a framework for directing and maintaining e-discovery programs, with correlation
    to other elements of the 27000 framework for managing information security.


    +   - Part 3, *Code of practice for electronic discovery*, provides detailed requirements
    for achieving e-discovery objectives in alignment with the standard, including
    evidence management and analysis.


    +   - Part 4, *Technical readiness*, is under development as of 2020 and is designed
    to provide more discrete guidance on enabling various systems and architectures
    to support digital forensics.


    +   - **Cloud Security Alliance (CSA) Security Guidance Domain 3: Legal Issues:
    Contracts and Electronic Discovery:** This standard is part of the CSA’s freely
    available guidance related to cloud security and covers legal issues, contract
    requirements, and special issues raised by e-discovery.


    +   - Legal Issues details concerns related to privacy and data protection and
    how moving data to the cloud can complicate an organization’s legal obligations.
    Examples include data residency, where laws may restrict the geographic locations
    that data may be stored in, as well as liability issues when a CSP is acting as
    a data processor.


    +   - Contract Considerations lists concerns and recommendations for dealing with
    common contract issues related to security and privacy. These include performing
    adequate due diligence on any CSP vendors and their practices, ensuring contractual
    obligations are properly documented, and performing ongoing monitoring of the
    CSP and services to ensure they do not exceed the organization’s changing risk
    tolerance.


    +   - Special Issues Raised by E-Discovery details a number of critical concerns
    both CSPs and consumers must consider when choosing and architecting cloud solutions.
    These include possession, custody, and control of data; in short, outsourcing
    processing of data to a CSP does not absolve the cloud consumer of legal responsibility
    for the security of that data. Other issues'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'include challenges related to discovery itself, as data may exist in multiple
    locations or multiple pieces (data dispersion), as well as issues related to privacy
    in a multitenant environment if one tenant is subject to legal action. In addition,
    there may be tools like bit-by-bit analysis or data replication that may be impossible
    in cloud environments, as these tools make use of hardware features that are not
    present in a virtualized cloud environment.


    +   - The full document may be accessed here: cloudsecurityalliance.org/artifacts/csa-security-guidance-domain-3-legal-issues-contracts-and-electronic-discovery.


    When legal action is undertaken, it is often necessary to suspend some normal
    operations such as routine destruction of data or records according to a defined
    schedule. In this case, a process known as *legal hold* will be utilized, whereby
    data is preserved until the legal action is completed. Provisions for legal hold,
    such as extra storage availability and proper handling procedures, must be part
    of contracts and SLAs, and during legal proceedings, the cloud consumer should
    have easy access to appropriate points of contact at the CSP to facilitate e-discovery
    or other law enforcement requirements.


    The process of collecting evidence is generally a specialized activity performed
    by experts, but security practitioners should be aware of some steps, especially
    those performed at the beginning before a forensics expert is brought in.


    +   - Logs are essential. All activities should be logged including time, person
    performing the activity, tool(s) used, system or data inspected, and results.

    +   - Document everything, including physical or logical system states, apps running,
    and any physical configurations of hardware as appropriate.

    +   - Some data is volatile and requires special handling. In a traditional computer
    system, RAM is often a particular concern for forensics, because it requires constant
    power to retain data. In cloud architectures where VMs may be spun up on demand
    or microservices run only as long as needed to perform a particular task, identifying
    any ephemeral data or services and preserving them may be critical.

    +   - Whenever possible, work on copies of data or images of systems, as simple
    actions like opening a folder or file can overwrite or change critical elements
    of the evidence, leading to a loss of integrity and possible destruction of evidence.

    +   - Verify integrity often and follow standard procedures. Incident response
    plans will often be the first set of steps leading into an investigation where
    evidence is required, and they should incorporate checks for integrity of evidence
    and handling such as hashing and verifying physical custody records.'
  merge: -1
  img_proc: true
