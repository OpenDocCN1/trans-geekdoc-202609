- pgno: 236
  md: '*Correlation* refers to discovering relationships between two or more events;
    in this example, if the user has suddenly logged in from a new location, accessed
    email, and started downloading files, it could indicate compromised credentials
    being used to steal data. It could also indicate that the user is attending a
    conference and is getting some work done in between sessions, but the organization
    should still perform checks to verify. If travel is a common situation, the organization
    might also integrate data from an HR or travel reservation system to correlate
    travel records for a certain user with their activity accessing data from a particular
    country. If the user is not known to be traveling in that country, the activity
    is highly suspicious.


    Other sources of information could include external information like threat intelligence
    or CSP status feeds, which can be relevant in investigating anomalies and categorizing
    them as incidents. Major CSPs offer monitoring capabilities in their platforms
    as well, and this data may be critical for investigating anomalies.


    +   - **Alerting:** Once suspicious activity is detected, the SIEM should generate
    an alert, and a SOC analyst should follow a documented procedure to review and
    take action on the alert. Many SOCs will utilize a system for handling this process,
    such as an IT ticketing system that generates work tickets in a queue for analysts
    to take action on. The activities related to each ticket are captured along with
    details such as who is working on it, steps taken, and artifacts from the process
    like investigation logs.


    PaaS and SaaS in particular can pose issues for logging and monitoring, as the
    logs themselves may not be visible to the consumer. CSPs typically don’t share
    internal logs with consumers due to the risk of inadvertently exposing customer
    details, so these services may be a black hole in the organization’s monitoring
    strategy. Solutions have been designed that can address this, such as the cloud
    access security broker (CASB), which is designed to log and monitor user access
    to cloud services. These can be deployed inline to a user’s connection to cloud
    services or collect information via API with cloud services. The CASB can monitor
    access and interaction with applications; for example, user Alice Doe logged into
    Dropbox at 12:30, and uploaded file `Super Secret Marketing Data.xlsx` at 12:32.
    Dropbox as a CSP may not share this data with consumers, but the CASB can help
    overcome that blind spot.


    # ## Log Management


    NIST SP 800-92 details critical requirements for securely managing log data, such
    as defining standard processes and managing the systems used to store and analyze
    logs.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'Because of their critical nature in supporting incident investigations, logs
    are often a highly critical data asset and worthy of robust security mechanisms.
    These may include the following:


    +   - High-integrity storage media such as write once, read many (WORM), which
    allows a definitive copy of the data to be written just once. This prevents tampering
    with log files after they are written to disk, but allows for analysis.

    +   - Restricted access to only SOC personnel, as logs may contain highly sensitive
    information. This could include details of internal system configuration, as well
    as sensitive information being processed if an application or database error contains
    pieces of the sensitive data.

    +   - Capacity monitoring and rotation to ensure adequate storage space. Logs
    grow quite quickly, and allocating sufficient space for logs is essential. Maintaining
    all data readily available may be cost-prohibitive, so some log files may be stored
    offline if appropriate or rotated (written over) after a set period of time.

    +   - Retention and secure deletion when logs are no longer needed. Log files
    should be part of the organization’s retention schedule and should be in compliance
    with applicable legal and regulatory obligations and are also critical to reconstruction
    of historical events as needed for incident investigations. Because of the possibility
    of highly sensitive data, secure destruction methods should be defined for log
    data.

    +   - Proper configuration of logging functions on all systems. Many systems and
    apps provide configuration options for what data is written to log files based
    on the value of the information. Informational alerts, such as a server synchronizing
    its clock with a timeserver, may not be of much value. Events like a user successfully
    logging in, entering the wrong credentials, or changing their password would be
    of more value, as they provide evidence of the organization’s access controls
    at work. The clipping level defines which categories of events are and are not
    written to logs, such as user authentication events, informational system notices,
    or system restarts.

    +   - Testing and validation of log data to ensure integrity is not compromised.
    Log data collected, especially on a centralized tool like a SIEM, should be periodically
    validated against the originals to ensure it is being transmitted without alternation.
    It should not be possible to alter data being forwarded to the centralized platform,
    and any attempts to tamper with or disable the forwarding functionality should
    result in an alert so corrective action can be taken.'
  merge: -1
  img_proc: true
