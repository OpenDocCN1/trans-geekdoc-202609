- pgno: 239
  md: 'should also have dedicated communication protocols in place, such as a phone
    tree or instant messaging group, allowing them to receive information on incidents
    in a timely manner.


    +   - **Root-cause analysis:** Once an incident has been resolved, the IRT should
    perform a root-cause analysis, document these findings, and offer suggestions
    for preventing the incident in the future. Some incidents, such as natural disasters,
    may be unavoidable, but the organization may be able to implement proactive measures
    to reduce their impact, such as relocating staff ahead of a forecastable natural
    disaster. Incident response plans and procedures should also be updated as appropriate
    to help the organization better respond in the future to incidents of a similar
    nature.


    # Incident Classification


    To ensure an incident is dealt with correctly, it is important to determine how
    critical it is and prioritize the response appropriately. Each organization may
    classify incidents differently, but a generic scheme plots Urgency against Impact.
    These are assigned values from Low, Medium, or High, and incidents that are High
    priority are handled first. The following are descriptions and examples of these
    criteria:


    +   - **Impact:** How much or how significantly does the incident degrade IT services?
    An issue with identity management that forces users to try logging in multiple
    times before successfully accessing a system is irritating but has a minor effect
    on operations. A data center being completely unreachable due to cut network cables
    means a complete loss of the business function and should be dealt with before
    other issues.

    +   - **Urgency:** How soon does the organization need resolution? An outage on
    a system for internal staff social information like team sporting events is unlikely
    to be critical and can wait for restoration if a mission-critical system is also
    suffering an outage.


    Incident classification criteria and examples should be documented for easy reference.
    The IRP should contain this information, and it is also advisable to include it
    in any supporting systems like incident trackers or ticketing systems. These ratings
    are subjective and may change as the incident is investigated, so the IR coordinator
    should ensure that critical information like prioritization is communicated to
    the team.


    # Incident Response Phases


    The organization’s IRP should include detailed steps broken down by phases. At
    a high level, there are activities to be conducted prior to an incident and after
    an incident occurs; namely, planning the IR capability and the actual execution
    of a response when'
