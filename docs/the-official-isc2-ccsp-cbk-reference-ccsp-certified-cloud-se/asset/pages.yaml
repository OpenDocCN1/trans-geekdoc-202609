- pgno: 231
  md: '+   - The other threat explicitly called out is one that has grown in recent
    years: ransomware. Attackers are exploiting encryption to lock users out of information
    systems until a ransom is paid, so preparing for or preventing one of these attacks
    is critical. Preventative steps can include file integrity monitoring, designed
    to detect unwanted changes such as ransomware encrypting files or even the malware
    being installed. Planning for recovery is also crucial beforehand, with adequate
    business continuity, disaster recovery, and backup plans being the primary implementations
    for ransomware recovery.


    +   - As discussed in the incident management section of this chapter, coordination
    between the CSP and consumer will be essential for incident response and handling
    and is a key difference from on-prem environments.


    A SOC is typically made up of security analysts, whose job involves taking incoming
    data and extracting useful information, and security engineers who can keep operations
    running smoothly. There may be overlap with operations personnel, and in some
    organizations, the SOC may be combined with other operational functions. Common
    functions that may be performed in the SOC are the following:


    +   - **Continuous monitoring and reporting:** All the security tools implemented
    by an organization require at least some level of ongoing oversight by a human
    being. The SOC will typically centralize relevant data into a dashboard, which
    may be projected on large screens in the SOC physical office or available as a
    web page so all members can see vital information. In addition to SOC members,
    certain information may be reported to other members of the organization in the
    form of metrics or incident reports.


    +   - **Data security:** The SOC should have the ability to perform monitoring
    across any environments where sensitive data is being stored, processed, or transmitted.
    This can be used to ensure data is being adequately protected in various states
    across all stages of its lifecycle. Threat hunting and vulnerability management
    functions in the SOC should look for risks to data, such as improperly configured
    cloud storage environments or insecure data transmission when users are connecting
    with SaaS applications.


    +   - **Alert prioritization:** Not all alerts are critical, require immediate
    attention, or represent imminent harm to the organization. SOC functions related
    to log management should include definitions to assist in prioritizing alerts
    received from various sources such as monitoring tools, as well as defined procedures
    for taking action on alerts.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'Loss of commercial power at a facility is an alert worth monitoring, but may
    not be a major incident if backup power is available and the power is likely to
    be restored quickly. If the organization is experiencing exceptional operations,
    such as retail during a major holiday, then the organization may choose to preemptively
    declare a business interruption and shift processing to an alternate facility.
    Detecting and triaging incidents, up to and including declaration of an interruption
    or disaster, is a logical function for the SOC to perform due to the type of data
    they work with.


    +   - **Incident response:** SOC personnel are uniquely situated to detect and
    respond to anomalous activity such as an interruption or incident and as such
    are often the core constituent of an incident response team. Skills and expertise
    such as digital forensics, whether internal to the team or via third-party services,
    may be a logical fit on this team as well. At the conclusion of an incident response,
    this team is also well suited to perform root-cause analysis and recommend remedial
    actions.


    +   - **Compliance management:** The SOC is likely to have information that is
    quite crucial to managing the organization’s compliance posture. Although compliance
    functions may be implemented elsewhere in the organization to avoid conflict of
    interest, critical information monitored by the SOC can be useful, such as server
    configurations, results of routine vulnerability scans, and crucial risk management
    activities like business continuity.


    As always, there are two key perspectives for the SOC. CSPs will likely need a
    robust SOC function with 24×7×365 monitoring of the environment. While such a
    capability will be expensive, the cost is likely justified by requirements of
    the cloud consumers and can be shared among this large group. Cloud consumers
    may operate a SOC for their own operations, which will include any on-prem IT
    services as well as their cloud services and environments. This may require the
    use of some legacy tools deployed to more traditional cloud services such as IaaS
    or PaaS, newer tools designed to monitor services such as SaaS (for example, access
    management or encryption tools), or even the use of CSP-provided monitoring capabilities.


    As an example, the major CSPs offer security incident reporting services that
    customers can log in to if an incident affects them. They also offer the following
    public status pages that list operational information for public-facing services:


    +   - **AWS Service Health Dashboard:** `status.aws.amazon.com`

    +   - **Microsoft Azure status:** `status.azure.com/en-us/status`

    +   - **Google Cloud Status Dashboard:** `status.cloud.google.com`


