  md: 'and availability. Each classification level should have an associated set of
    control expectations, such as data classified as “Public” does not require encryption
    in transit, while data classified as “Internal Use Only” must be encrypted both
    at rest and in transit. These requirements are mitigations for the risk presented
    to the organization by the data or system, as described by the operational impact
    of a loss of confidentiality, integrity, and/or availability.


    Data classification is a way for organizations to provide a uniform set of controls
    and expectations, as well as a method for speeding up security decision-making.
    Creating a classification scheme, such as Low, Moderate, and High, allows the
    organization to bundle security control expectations and simplify the process
    of determining required actions. When a new system is brought online, security
    practitioners do not need to perform exhaustive research to determine the security
    requirements they need to meet. The classification scheme provides a clear set
    of risk-based security controls and expectations designed to speed up the process.


    Data classification levels and schemes are driven by multiple aspects of data.
    They may be prescribed by an outside entity such as a regulator or government
    agency or may be driven by purely internal risk management requirements. Here
    are some examples:


    +   - **Data type:** Different types of data are regulated by different rules,
    such as healthcare, sensitive PII, financial, educational, or legal. Data classification
    schemes based on data type often point to a set of external requirements that
    must be met if a system or data set includes the given data type.

    +   - **Legal constraints:** If data on EU citizens is collected by a company
    based in another country, that company may have to either implement privacy protection
    similar to the EU’s GDPR or be based in a country with privacy laws recognized
    by the EU as equivalent to GDPR. Understanding the legal constraints attribute
    allows the organization to make decisions such as geolocation of application architecture.

    +   - **Ownership:** Many organizations utilize data that is shared by business
    partners, customers, or shared sources, all of which may impose requirements such
    as not sharing the data with third parties or securely destroying data after a
    specified retention period.

    +   - **Value/criticality:** Some data’s value is incredibly context-specific.
    A database of contact details for restaurant suppliers is of little value to an
    IT services company, but that same database would be mission-critical to a company
    operating a chain of restaurants. The data classification scheme must take into
    account how valuable and critical data is to the organization, often by measuring
    the impact that a loss of the data would have on operations.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Because of the information provided in a data classification policy, it is
    often a foundational document for an organization’s security program. Rather than
    specifying a long list of system-specific security requirements for each system
    individually, such as approved encryption or data retention schedules, a classification
    label provides a common vocabulary for communicating security needs in a consistent
    manner. Other information security policies should specify the appropriate controls
    for data or systems at various classification levels, like approved cryptographic
    modules, access control procedures, and data retention periods and destruction
    requirements.


    # Mapping


    Data mapping comprises a number of activities in the overall practice of data
    science — the application of scientific methods and algorithms to identify knowledge
    or useful information from data sets. One particular practice related to data
    mapping is relevant to the role of a security practitioner: identifying the locations
    of data.


    Identifying and mapping the location of data within the organization is a critical
    inventory task, which is in turn a critical input to risk assessments. Identifying
    what needs protecting — system and data assets belonging to the organization —
    and where they exist are crucial to ensure a security program is designed appropriately.
    Many DLP tools provide this functionality by scanning a network, domain, or other
    set of organization-controlled resources to identify data storage locations. This
    mapping may be further extended by identifying metadata such as asset ownership
    like a person, role, or organizational unit, which provides the organization with
    key information on responsibility and accountability for security processes.


    # Labeling


    Once a data set or system has been classified, the classification level must be
    communicated in some way so that users, administrators, and other stakeholders
    know how to protect it. Again, the use of labels provides simplification. Rather
    than forcing users to memorize which systems they can print data from and which
    systems ban printing, users are instead instructed that systems labeled “Internal”
    allow printing, while systems labeled “Top Secret” do not allow printing.


    Labeling data can be tricky, as we typically think of labels in physical terms
    but obviously are not able to stick a label on a collection of digital 0s and
    1s. There are a variety of labeling methods for different types of assets, such
    as the following:


    +   - **Hard-copy materials**, primarily printed information on paper, which can
    be labeled with a printed watermark, stamps, or a physical container such as a
    folder or box. Hard-copy materials are the easiest to affix labels to because
    they are physical objects and do not change often.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '+   - **Physical assets**, including servers, workstations, disc drives, optical
    disks, and removable media, which can be physically labeled with a sticker or
    badge. These are somewhat tricky to label as the information on these devices
    can change quite easily. It can also be more challenging to identify and label
    found physical assets, as the user needs to have appropriate equipment to read
    the data on the asset; there may also be security issues around plugging in found
    media due to the possibility of introducing malware.

    +   - **Digital files**, which may come from common collaboration tools, databases,
    or other programs, and can often be labeled with metadata. This may include content
    inside the document such as a digital watermark or signature, or even text like
    a document footer with the classification level printed. File metadata such as
    the filename or document attributes stored in a database can also be used to apply
    a classification label.

    +   - **Some complex or shared systems and data sets** will have subcomponents
    that can be labeled, but the overall system cannot. In these cases, labeling of
    components along with supporting procedures, such as training and reference materials
    for users or a master organization-wide list of systems, can be useful to ensure
    users are aware of the protection requirements they must meet.


    When it comes to labeling data sets, there are a number of best practices that
    facilitate the use of the classification level to ensure adequate protection is
    applied. The first is to ensure labels are appropriate to all types of media in
    use within a system; for example, if both digital files and hard-copy documents
    are to be used, a digital watermark that also appears when the document is printed
    helps ensure the data label is visible across all media states. Labels should
    be informative without disclosing too much — stamping a folder “Top Secret” makes
    it easy to recognize for both legitimate users and bad actors! Labels may include
    only an owner or asset number that can be used to determine the sensitivity of
    the data in the event it is lost. Finally, when media is found, it should be classified
    at the highest level supported by the organization until an examination proves
    otherwise, ensuring sensitive data is not disclosed.


    The organization’s DLP tool may be a crucial consumer of data labels, as many
    DLP tools allow organization-defined labels to be used when performing data identification
    and classification. If DLP is being used, labels should be applied in a consistent
    and accessible manner, such as text in the file identifying the classification
    or common filename conventions to facilitate the discovery process.


    # Sensitive Data


    The organization’s data classification policy should cover a number of requirements
    for handling data, many of which will be driven by external laws and regulations.
    These'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'external obligations will typically provide guidance for handling sensitive
    classes of information such as the following:


    +   - **Personally identifiable information (PII):** Governed globally by privacy
    laws and often by laws or regulations specific to certain industries covering
    the collection, use, and handling of PII. Examples include the EU GDPR and Canadian
    Personal Information Protection and Electronic Documents Act (PIPEDA) laws, which
    broadly cover PII, and the U.S. Graham-Leach-Bliley Act (GLBA), which covers banking
    uses of PII.


    +   - **Protected health information (PHI):** Defined and governed primarily by
    the U.S. HIPAA, though personal health records are considered PII by most global
    privacy laws such as GDPR.


    +   - **Cardholder data (often referred to as a *cardholder data environment*,
    or CDE):** Defined and regulated by PCI DSS, it provides guidance on the handling,
    processing, and limited allowable storage of information related to credit and
    debit cards and transactions.


    Data protection should be specified for all sensitive data discovered, and may
    be a mix of requirements defined in the various laws mentioned earlier as well
    as an organization’s own risk-management goals. Some elements appropriate to specify
    in a data classification policy include the following:


    +   - **Compliance requirements inherent at various classification levels:** While
    this may be too complex for an average user, it ensures vital security requirements
    are not overlooked. As a best practice, points of contact who are skilled at managing
    sensitive data should be identified in the policy so users can seek assistance
    as needed.


    +   - **Data retention and disposal requirements:** Many data protection laws
    specify retention periods, such as customer records must be held indefinitely
    while the customer is still active and then for five years thereafter. Classification
    and retention policies and procedures should be tightly aligned and provide guidance
    on approved disposal or destruction methods for data that has reached the end
    of its retention period.


    +   - **What is considered sensitive or regulated data:** Some regulations include
    exceptions for a variety of circumstances, and an untrained individual may not
    fully understand the subtle nuances of when healthcare data is considered PHI
    or not, for example. The classification policy should provide clear guidance on
    what data is considered sensitive or regulated and explicitly state any exceptions
    that may apply.'
  merge: -1
  img_proc: true
