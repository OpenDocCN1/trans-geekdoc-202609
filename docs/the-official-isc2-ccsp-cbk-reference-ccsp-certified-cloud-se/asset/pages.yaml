    # UNDERSTANDING OUTSOURCING AND CLOUD CONTRACT DESIGN


    Outsourcing is defined as “the business practice of hiring a party outside a company
    to perform services and create goods that traditionally were performed in-house
    by the company’s own employees and staff.” (See www.investopedia.com/terms/o/outsourcing.asp.)
    Outsourcing was traditionally a practice undertaken by companies as a cost-cutting
    measure or to make use of outside expertise or specialization. As the practice
    gained favor, it affected a wide range of jobs, ranging from customer support
    to manufacturing to the back office.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'So, what is cloud computing but outsourcing? Companies are taking advantage
    of specialized skills and lower costs to improve their business models. And they
    are doing it in a multibillion-dollar way that is growing year over year. Cloud
    security professionals are well served by understanding key contractual provisions
    that can make sure their companies can do business with cloud providers with their
    data and wallets intact.


    # Business Requirements


    Before entering into a contract with a cloud service provider, it is important
    for any business to fully understand their own business needs and how they will
    be met. The evolution of the cloud means that more and more IT functions can use
    cloud technologies every year. Once a business has made the decision that a function
    is cloud ready and can codify the needs required of the system, a negotiation
    can take place with a cloud service provider. In legal terms, a cloud customer
    and a cloud service provider enter into a master service agreement (MSA), defined
    as any contract that two or more parties enter into as a service agreement.


    But what exactly should be in a contract with a cloud service provider? The Cloud
    Standards Customer Council (CSCC) provides a good starting point for any contract
    in its “Practical Guide to Cloud Service Agreements.” (See www.omg.org/cloud/deliverables/CSCC-Practical-Guide-to-Cloud-Service-Agreements.pdf.)
    This document provides a reference to help enterprise information technology and
    business decision-makers analyze cloud service agreements from different cloud
    service providers. They break cloud contracts down into three major areas:


    +   - The “Customer Agreement” section of the agreement describes the overall
    relationship between the customer and cloud provider. Definitions of the roles,
    responsibilities, and execution of processes need to be explicitly identified
    and formally agreed upon. This section may outline communication processes and
    personnel.

    +   - An acceptable use policy (AUP) is almost always included within a cloud
    contract. The AUP defines and prohibits activities that providers consider to
    be an improper or outright illegal use of their service. There is considerable
    consistency across cloud providers when it comes to AUP. Although specific details
    of acceptable use may vary somewhat among cloud providers, the scope and effect
    of these policies is typically similar, and these provisions typically generate
    the least concerns or resistance.

    +   - The service level agreement (SLA) within the cloud contract describes levels
    of service using various attributes and metrics such as availability, serviceability,
    or performance. The SLA specifies thresholds, financial penalties, and who is
    responsible for monitoring violations of these thresholds. Well-designed SLAs
    can significantly contribute to avoiding future conflict and facilitating the
    resolution of issues before they escalate into a dispute.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Key SLA Requirements


    Service level agreements can be a key factor in avoiding potential issues once
    a contract is in place. Service metrics, such as uptime or quality of service,
    can be included in this section of a contract. An uptime of 99 percent may seem
    adequate, but that level of allowed downtime would be equal to 87.6 hours a year!
    Service level agreements often include sections on the following:


    +   - Uptime guarantees

    +   - SLA violation penalties

    +   - SLA violation penalty exclusions and limitations

    +   - Suspension of service clauses

    +   - Provider liability

    +   - Data protection and management

    +   - Disaster recovery and recovery point objectives

    +   - Security and privacy notifications and timeframes


    # Vendor Management


    The migration to the cloud relieves an IT department and IT executives of the
    duties of maintaining internal technology stacks in many ways. This has shifted
    the role that IT professionals play in vendor management, from primarily a point-in-time
    acquisition process (purchasing hardware or software) to an ongoing management
    relationship with a cloud vendor. This redefined relationship requires a great
    deal of trust and communication with vendors. Cloud professionals need strong
    project and people management skills. Managing cloud vendor relationships should
    focus on a number of areas.


    +   - **Initial contract negotiations:** There are many issues to address before
    contracts are signed, including SLAs, personnel (point persons on the company
    and vendor side), division of labor, entry and exit strategies, and potentially
    proof of concept environments.

    +   - **Service level agreement monitoring and project coordination:** Who is
    responsible for monitoring and alerting on SLA metrics? How often will these metrics
    be adjusted as project requirements evolve?

    +   - **User community communications:** Company IT and the cloud vendor should
    not be communicating different things to the user community. Careful coordination
    of who sends information to the users is a key part of the relationship.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '+   - **Security and business processes:** The coordination of both security
    requirements and business process integrations is a tightly shared duty of IT
    and the cloud service provider. Both parties should work together to ensure that
    requirements are considered from each perspective in an ongoing manner.

    +   - **Upgrades:** The cloud is not a static environment. Cloud offerings change
    often and offer new capabilities. Managing these changes and ensuring that they
    are applied in an efficient and consistent manner requires working closely together
    on enhancements.


    # ## Contract Management


    The management of cloud contracts is a core business activity that is central
    to any ongoing relationship with a cloud service provider. A company must employ
    adequate governance structures to monitor contract terms and performance and be
    aware of outages and any violations of stated agreements. The CSCC provides a
    prescriptive series of steps that should be taken by cloud customers to evaluate
    their cloud contracts to compare multiple cloud providers or to monitor and evaluate
    a contract with a selected provider. The following steps are important to discuss
    in detail (www.omg.org/cloud/deliverables/CSCC-Practical-Guide-to-Cloud-Service-Agreements.pdf):


    +   - **Understanding of roles and responsibilities:** Clearly identifying who
    is responsible for which activities ensures that there are no gaps that could
    lead to problems when using cloud services.

    +   - **Evaluation of business level policies:** Companies must consider policy
    requirements and how a cloud provider can meet them. The data policies of the
    cloud provider are perhaps the most critical business-level policies.

    +   - **Understanding of service and deployment model differences:** To increase
    effectiveness, specific components of the contract should be stated in measurable
    terms and should include the services to be performed and outcome expectations,
    Key Performance Indicators (KPIs), how services are measured, and the reporting
    requirements.

    +   - **Identification of critical performance objectives:** Cloud customers must
    decide which measures are most critical to their specific cloud environments and
    ensure these measures are included in their SLA.

    +   - **Evaluation of security and privacy requirements:** This includes information
    on security controls, data classifications, auditing, and breach notification.

    +   - **Identification of service management requirements:** This may consist
    of the internal controls, management, automation, and self-healing that comprise
    application performance management.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '+   - **Preparing for service failure management:** Service failure management
    outlines what happens when the expected delivery of a cloud service does not occur.
    What happens when a service fails?


    +   - **Understanding the disaster recovery plan:** “There is no cloud, there
    is just someone else’s computer” is a popular slogan for IT professionals often
    found on T-shirts and stickers in an IT department. Just because businesses are
    outsourcing platforms to cloud service providers does not absolve them of the
    need for serious disaster planning.


    +   - **Develop an effective governance process:** The control and oversight of
    the outside provider (the cloud service provider) and regular ongoing review of
    the contracted and actual use of each cloud service should be included in the
    governance process.


    +   - **Understanding the exit process:** An exit clause should be part of every
    cloud agreement and describes the details of the exit process including the responsibilities
    of the cloud provider and consumer in case the relationship terminates prematurely
    or otherwise. Data ownership, transferability, and destruction should be clearly
    and prominently identified.


    # ## Cyber Risk Insurance


    Cyber risk insurance is designed to help an organization modify risk by sharing
    the risk of a cyber incident with others via a policy that might offset costs
    involved with recovery after a cyber-related security incident such as a breach.
    This is a growing field, and many more companies are choosing to indemnify against
    the threats of harm from incidents. Cyber risk insurance usually covers costs
    associated with the following:


    +   - **Investigation:** Costs associated with the forensic investigation to determine
    the extent of an incident. This often includes costs for third-party investigators.


    +   - **Direct business losses:** Direct monetary losses associated with downtime
    or data recovery, overtime for employees, and oftentimes, reputational damages
    to the company.


    +   - **Legal notifications:** Costs associated with required privacy and breach
    notifications required by relevant laws.


    +   - **Lawsuits:** Policies can be written to cover losses and payouts due to
    class action or other lawsuits against a company after a cyber incident.


    +   - **Extortion:** The insurance to pay out ransomware demands is growing in
    popularity. This may include direct payments to ensure data privacy or accessibility
    by the company.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Supply Chain Management


    Imagine if you would that you are a highly successful CEO of a major American
    corporation overseeing your sixth year of growth. Your compensation package is
    in the tens of millions of dollars. Now imagine being forced out of your role
    because of lacking security controls at your company’s HVAC vendor, which led
    to one of the largest breaches of private data in history (at the time). This
    is the story of Target CEO Gregg Steinhafel in 2014, after the holiday 2013 POS
    attacks at the department store.


    This is just one high-profile example of how the weakest link in a security chain
    can lead to disastrous consequences. The cloud can either increase or reduce the
    risks posed to a company depending on how a company implements a cloud strategy.
    In any cloud strategy, it is important to understand the extent of the organization’s
    reliance to a cloud service provider as well as the third parties that power and
    enable the CSP itself.


    The supply chain should always be considered in any business continuity or disaster
    recovery planning. The same concepts of understanding dependencies, identifying
    single points of failure, and prioritizing services for restoration are important
    to apply to the entire supply chain. This includes the cloud services a company
    may employ to deliver their services and the associated third parties that enable
    that cloud provider. With a complete view of the potential risks posed by a CSP
    supply chain, a company can choose to avoid, modify, share, or retain the risks
    in a similar evaluation to other risks as discussed earlier.


    # ISO 27036: Information Security for Supplier Relationships


    As we have seen with previous standards, the ISO provides a framework to allow
    for the evaluation and treatment of information risks involved in the acquisition
    of goods and services from suppliers. (See www.iso.org/obp/ui/#iso:std:iso-iec:27036:-4:ed-1:v1:en.)
    This is a four-part standard, part four (2016) of which “Guidelines for security
    of cloud services” provided excellent guidance for understanding and mitigating
    the risk of the cloud supply chain. According to ISO, the application of this
    standard should result in the following:


    +   - Increased understanding and definition of information security in cloud
    services

    +   - Increased understanding by the customers of the risks associated with cloud
    services to enhance the specification of information security requirements

    +   - Increased ability of cloud service providers to provide assurance to customers
    that they have identified risks in their service(s) and associated supply chains
    and have taken measures to manage those risks


    ISO 27036 is not yet available for free but provides a strong reference for understanding
    supply chain risk in the cloud context. Additional resources worth review include
    the draft NISTIR 8276 (Key Practices in Cyber Supply Chain Risk Management:'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'Observations from Industry), NIST SP800-161 (Supply Chain Risk Management Practices
    for Federal Information Systems and Organizations), and the 2015 ENISA publication
    on supply chain integrity.


    # SUMMARY


    A cloud security professional must be constantly aware of the legal and compliance
    issues in migrating and maintaining systems in the cloud. Understanding the legal
    requirements, privacy issues, audit challenges, and how these relate to risk and
    contracts with cloud providers is a must for any company taking advantage of cloud
    services. A cloud security professional must also be well versed in the frameworks
    provided by professional organizations such as ENISA, NIST, ISO, and the CSA.
    All information security is essentially a business risk, and understanding and
    mitigating the risks faced by a company is critical to any business strategy.
    Any cloud security professional should understand the role that IT plays in this
    larger picture and have the communication and people skills to involve the appropriate
    business, legal, and risk decision-makers within a company.'
  merge: -1
  img_proc: true
