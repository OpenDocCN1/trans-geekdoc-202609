- pgno: 134
  md: 'There are some basic scenarios that apply to most if not all businesses. It
    is not necessary to test all of them each year. But a robust plan should test
    all likely scenarios over time. A well tested plan will function even for an unexpected
    disaster. Common disaster scenarios include the following:


    +   - Data breach

    +   - Data loss

    +   - Power outage or loss of other utilities

    +   - Network failure

    +   - Environmental (e.g. fire, flooding, tornado, hurricane, or earthquake)

    +   - Civil unrest or terrorism

    +   - Pandemics


    The plan should test likely scenarios and can be tested in a number of ways. The
    maturity of the plan and the people implementing the plan will determine the type
    of testing that takes place. There are a variety of standard test methods.


    Tests should be both scheduled and a surprise. Particularly for new plans and
    organization immature in the BCP/DCP space, a scheduled test ensures that key
    personnel are available and will begin the maturation process. Tests that have
    the potential of being very disruptive should also be scheduled to minimize disruption.


    Eventually, some tests should be unexpected. Surprise tests do not mean unscheduled.
    Instead, only high-level approval and a few key individuals are aware of an upcoming
    test so that the organization can be tested in more realistic ways. The high-level
    approval is essential in case some amount of unexpected business disruption occurs.
    Executive approval includes a review of potential disruption and benefits so that
    a business decision can be made by those responsible for the business. Key personnel
    who are part of the test planning can be positioned in advance of the test in
    order to monitor performance metrics.


    The simplest test method is the tabletop. A tabletop is usually performed in a
    conference room or other location around the “table.” Key personnel are presented
    with a scenario and then work through the plan verbally. This is usually the first
    step for a new plan. It identifies missing pieces in the plan or steps that need
    greater detail. The next step may be a walk-through where key personnel move to
    the appropriate locations and verbally verify the steps, sometimes even performing
    some parts of the plan. While developing a plan, regular tabletops and walk-throughs
    can help flesh out a more robust plan. A tabletop or walk-through can also be
    useful for new members of the team to assist them in identifying their responsibilities
    in the plan.


    A more substantial test is a simulation. Like a fire drill or a shelter-in-place
    activity, a disaster is simulated. The plan is exercised while normal operations
    continue. More'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'robust and detailed than a walk-through, those performing certain steps are
    involved in simulating their response to a disaster.


    The next level of testing is a parallel test. Care must be taken not to disrupt
    normal business operations if possible. In a parallel test, key personnel and
    workforce members perform the steps needed in case of a disaster. More than simulating
    the steps, they actually perform the steps to ensure that they can accomplish
    the critical business processes if the existing systems were disrupted by a disaster.
    It is parallel because the critical systems continue to run, and some or all of
    the data is also run at the alternate site. It is then possible to compare the
    results of the alternate methods to the critical systems to determine any gaps
    in capabilities.


    The most robust level of testing is a full cutover test. In this test, the disaster
    is simulated in full. The primary system is disconnected, and the business attempts
    to run critical functions. This is a high-risk test, as the critical functions
    may fail. Only the most mature organizations and plans should attempt a full cutover
    test.


    # SUMMARY


    Moving to the cloud is a business decision. Moving to the cloud changes capital
    expense to operational expense and can add high availability and resiliency at
    a price that is attractive to businesses of all types. It also provides capabilities
    not available to all businesses. To achieve these benefits, a customer must have
    an understanding of the key infrastructure pieces of a cloud environment. The
    customer must also understand the shared security responsibility between the CSP
    and the customer. Finally, a customer must understand how to properly configure
    and use the cloud resources they purchase to ensure appropriate controls are in
    place to secure the process and data.'
  merge: -1
  img_proc: true
