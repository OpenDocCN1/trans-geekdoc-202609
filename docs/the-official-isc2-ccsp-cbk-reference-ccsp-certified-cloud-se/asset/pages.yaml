- pgno: 159
  md: 'The orchestration software must also be patched and configured following secure
    computing policy and standards set by the organization.


    Cloud orchestration allows a customer to manage their cloud resources centrally
    in an efficient and cost-effective manner. This is especially important in a multicloud
    environment. Management of the complexity of corporate cloud needs will only increase
    as the move to the cloud accelerates. Orchestration allows the automation of workflows
    and management of accounts, and the deployment of cloud applications, containerized
    applications, and services in a way that manages cost and enforces corporate policy
    in the cloud.


    # DESIGN APPROPRIATE IDENTITY AND ACCESS MANAGEMENT SOLUTIONS


    Identity and access management solutions encompass a range of activities. The
    IAM solution properly begins with the provisioning of users. Provisioning includes
    the creation of credentials as well as authorization for the systems to which
    a user needs access. IAM solutions also include the ongoing maintenance of access,
    such as adding and deleting access to systems as user roles change within the
    organization. Finally, an IAM solution includes the deprovisioning of a user when
    an account is no longer needed.


    IAM solutions also perform the identification and validation of users and provide
    access to systems. Once an IAM solution identifies and authenticates a user, it
    can perform authorization. Authorization determines which resources an authenticated
    user can access. Authentication can use role-based, attribute-based, or any other
    form of authentication. In addition, many IAM providers also support password
    management, while other solutions can be integrated with a customer’s current
    on-premise authentication systems.


    There are a variety of options for cloud-based IAM. This section will discuss
    the methods of authentication available and the security issues that exist with
    each of these.


    A variety of protocols are available to IAM solutions, to include OAuth2, SAML,
    LDAP, etc. Each protocol provides different capabilities. For example, OAuth2
    was developed to provide authorization with web applications and mobile devices.
    SAML is an XML-based authentication service well-suited for authentication between
    the identity provider and a service provider. LDAP is designed to work well with
    directory services, like Active Directory (AD). Which protocol is used varies
    by authentication provider and use and is a choice determined by each business.


    # Federated Identity


    Federated identity is related to single sign-on (SSO). In a federated identity,
    a particular digital ID allows access across multiple systems. With federated
    identity, a digital ID can access applications across CSPs (a multicloud) and
    on-premise resources.'
  merge: -1
  img_proc: true
- pgno: 160
  md: <!-- no content -->
