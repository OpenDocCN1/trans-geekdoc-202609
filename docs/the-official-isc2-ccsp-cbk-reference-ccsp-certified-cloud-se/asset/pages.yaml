- pgno: 137
  md: '# # Cloud Development Basics


    According to the Cloud Security Alliance (CSA) and SAFECode, the development of
    collective responsibility is essential and challenging when building a safety
    conscious application development program. This effort can be broken down into
    these three parts:


    +   - **Security by design:** This implies that security is part of every step
    in the process. Security is not a bolt-on after application release or in response
    to a security flaw, but part of the process from application feasibility to retirement.

    +   - **Shared security responsibility:** The idea is that security is the responsibility
    of everyone from the most junior member of the team to senior management. No one
    says that security is not their responsibility. In fact, security is the result
    of individual responsibility and trust.

    +   - **Security as a business objective:** Security is not something in addition
    to what we do. Instead, secure computing is what we do. Security is part of all
    business objectives.


    Each of these basic concepts requires a clear understanding of organizational
    culture, security vulnerabilities, and organizational vision and goals.


    # ## Common Pitfalls


    The first pitfall is not getting senior management’s initial and ongoing support.
    Efforts to instill a security culture are unlikely to be successful unless senior
    leadership supports these efforts—through their approval and adherence to security
    policy as well as funding and staffing security initiatives that are part of organizational
    goals.


    The next pitfall is failing to understand organizational culture. Even companies
    in the same industry have very different cultures. Building and sustaining a security
    culture requires careful planning that recognizes an organization’s culture and
    then designs program-level efforts that work within that culture. In addition,
    program-level efforts must be reviewed regularly to ensure that they remain aligned
    with business objectives and cultural realities.


    Another pitfall is staffing. The size of an organization may limit the number
    of security experts. These experts may then serve as resources to multiple development
    processes rather than as a member on one team. If the organization is large, development
    teams may use security experts as resources or may include security experts as
    team members. In either situation, it can be challenging to ensure the development
    of security-aware applications will be consistent across the organization.


    Not having a framework for secure software development will also cause difficulties.
    A mature organization will have a well-defined process that integrates security
    as part of each step. The lack of a framework or process leads to ad hoc security
    and does not support a security-aware organization.'
  merge: -1
  img_proc: true
