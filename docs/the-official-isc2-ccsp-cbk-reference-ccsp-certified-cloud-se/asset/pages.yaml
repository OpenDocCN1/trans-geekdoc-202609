- pgno: 271
  md: 'cloud relationship, oftentimes the ownership of security controls designed
    to reduce risk resides with a cloud service provider. An audit of the cloud service
    provider can identify if there are any gaps between what is contractually specified
    and what controls the provider has in place.


    # Service Organization Controls


    The American Institute of CPAs (AICPA) provides a suite of offerings that may
    be used to report on services provided by a service organization that customers
    can use to address risks associated with an outsourced service. See Table 6.2.


    # TABLE 6.2 AICPA Service Organization Control Reports


    | REPORT | USERS | CONCERNS | DETAILS REQUIRED |

    |---|---|---|---|

    | SOC 1 | User entities and the CPAs that audit their financial statements | Effect
    of the controls at the service organization on the user entities’ financial statements
    | Systems, controls, and tests performed by the service auditor and results of
    tests. |

    | SOC 2 | Broad range of users that need detailed information and assurance about
    controls | Security, availability, and processing integrity of the systems the
    service organization uses to process users’ data and the confidentiality and privacy
    of the information processed by these systems | Systems, controls, and tests performed
    by the service auditor and results of tests. |

    | SOC 3 | Broad range of users that need detailed information and assurance about
    controls but do not have the need for or knowledge to make effective use of SOC
    2 reports | Security, availability, and processing integrity of the systems the
    service organization uses to process users’ data and the confidentiality and privacy
    of the information processed by these systems | Referred to as a “Trust Services
    Report,” SOC 3 reports are general used and can be freely distributed. |


    Table source: www.aicpa.org


    The differences between the SOC reports are as follows:


    +   - **Service Organizations Controls 1 (SOC 1)**: These reports deal mainly
    with financial controls and are intended to be used primarily by CPAs that audit
    an entity’s financial statements.'
  merge: -1
