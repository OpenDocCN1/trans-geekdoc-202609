- pgno: 26
  md: 'for security becomes ever more complex. As the customer owns their data and
    processes, they have a responsibility to review the security policies and procedures
    of the CSP, and the federated responsibilities that may exist between multiple
    CSPs and data centers.


    # Cloud Service Partner


    A cloud service partner is a third party offering a variety of cloud-based services
    (infrastructure, storage and application services, and platform services) using
    the associated CSP. An AWS cloud service partner uses AWS to provide their services.
    The cloud service partner can provide customized interfaces, load balancing, and
    a variety of services. It may be an easier entrance to cloud computing, as an
    existing customer vendor may already be a cloud service partner. The partner has
    experience with the underlying CSP and can introduce a customer to the cloud more
    easily.


    The cloud partner network is also a way to extend the reach of a CSP. The cloud
    service partner will brand its association with the CSP. Some partners align with
    multiple CSPs, giving the customer a great deal of flexibility.


    Some partners provide their own or most of their own infrastructure and extend
    the service areas they can reach through the use of partnerships. For example,
    Dropbox extends its reach to service areas where it does not have infrastructure
    through a continued partnership with AWS. This also allows Dropbox to expand beyond
    what its own infrastructure will currently handle.


    # Cloud Service Broker


    A cloud service broker is similar to a broker in any industry. Companies use a
    broker to find solutions to their cloud computing needs. The broker will package
    services in a manner that benefits the customer. This may involve the services
    of multiple CSPs. A broker is a value-add service and can be an easy way for a
    company to begin a move into the cloud. A broker adds value through aggregation
    of services from multiple parties, integration of services with a company''s existing
    infrastructure, and customization of services that a CSP cannot or will not make.


    In both cases, or with one of the dozens of other CSBs, it is important to thoroughly
    vet the CSB as you would any new vendor. Each serves a specific market, utilizing
    different cloud technologies. It is important that the CSBs selected are a good
    fit for the customer organization and its cloud strategy.


    # Key Cloud Computing Characteristics


    The NIST definition of cloud computing describes certain characteristics that
    clouds share. Not every third-party solution is a cloud solution. Understanding
    the key'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'characteristics of cloud computing will allow you to distinguish between cloud
    solutions and noncloud solutions. This is important as these characteristics result
    in certain security challenges that may not be shared by noncloud solutions.


    # On-Demand Self-Service


    The NIST definition of cloud computing identifies an on-demand service as one
    “that can be rapidly provisioned and released with minimal management effort or
    service provider interaction.” This means the user must be able to provision these
    services simply and easily when they are needed. If you need a Dropbox account,
    you simply set up an account and pay for the amount of storage you want, and you
    have that storage capacity nearly immediately. If you already have an account,
    you can expand the space you need by simply paying for more space. The access
    to storage space is on demand. Neither creating an account nor expanding the amount
    of storage available requires the involvement of people other than the customer.
    This access is automated and provided via a dashboard or other simple interface.


    This can facilitate the poor practice often labeled as shadow IT. The ease with
    which a service can be provisioned makes it easy for an individual, team, or department
    to bypass company policies and procedures that handle the provisioning and control
    of IT services. A team that wants to collaborate may choose OneDrive, Dropbox,
    SharePoint, or another service to facilitate collaboration. This can lead to sensitive
    data being stored in locations that do not adhere to required corporate controls
    and places the data in locations the larger business is unaware of and cannot
    adequately protect.


    The pricing of these services may fall below corporate spending limits that would
    otherwise trigger involvement of the vendor management office (VMO) and information
    security and may simply be placed on a purchase card rather than through an invoice
    and vendor contract. Without VMO involvement, the corporate master services agreement
    will not be in effect.


    If this behavior is allowed to proliferate, the organization can lose control
    of its sensitive data and processes. For example, the actuary department at an
    insurance company may decide to create a file-sharing account on one of several
    available services. As information security was not involved, company policies,
    procedures, risk management, and controls programs are not followed. As this is
    not monitored by the security operations center (SOC), a data breach may go unnoticed,
    and the data that gives the company a competitive advantage could be stolen, altered,
    or deleted.


    # Broad Network Access


    Cloud services assume the presence of a network. For public and community clouds,
    this is the Internet. For a private cloud, it could be the corporate network—generally
    an IP-based network. In either case, cloud services are not local solutions stored
    on'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'your individual computer. They are solutions that exist on a network—in the
    cloud. Without broad and ubiquitous network access, the cloud becomes inaccessible
    and is no longer useful.


    Not all protocols and services on IP-based networks are secure. Part of the strategy
    to implementing a secure cloud solution is to choose secure protocols and services.
    For example, Hypertext Transfer Protocol (HTTP) and File Transfer Protocol (FTP)
    should not be used to move data to and from cloud services as they pass the data
    in the clear. HTTP Secure (HTTPS), Secure FTP (SFTP), and other encryption-based
    transmission should be used so that data in motion may be intercepted but not
    read.


    If you are able to access the cloud service and obtain access to your data anywhere
    in the world, so can others. The requirement for identification and authentication
    becomes more important in this public-facing environment. The security of accessing
    your cloud services over the Internet can be improved in a number of ways including
    improved passwords, multifactor authentication (MFA), virtual private networks
    (VPNs), etc. The increased security needs of a system available over the network
    where security is shared between the CSP and customer makes these additional steps
    more important.


    # Multitenancy


    One way to get the improved efficiencies of cloud computing is through the sharing
    of infrastructure. A server may have more than one company purchasing access to
    its resources. These resources are shared by the tenants. Like an apartment building,
    these tenants share resources and services but have their own dedicated space.
    Virtualization allows the appearance of single tenancy in a multitenancy situation.
    Each tenant’s data remains private and secure in the same way that your belongings
    (data) in an apartment building remain secure and isolated from the belongings
    (data) of your neighbor.


    However, as the building is shared, it is still the responsibility of each tenant
    to exercise care to maintain the integrity and confidentiality of their own data.
    If the door is left unsecured, a neighbor could easily enter and take your things.
    It is also necessary to consider the availability of the data as the actions of
    another tenant could make your data inaccessible for a time due to no fault of
    your own. In our example, if another tenant is involved in illegal activity, the
    entire building could be shut down. Or, if another tenant damaged the building,
    your access might be reduced or eliminated. A multitenancy environment increases
    the importance of disaster recovery (DR) and business continuity (BC) planning.


    # Rapid Elasticity and Scalability


    In a traditional computing model, a company would need to buy the infrastructure
    needed for any future, potential, or anticipated growth. If they estimate poorly,
    they either will have a lot of excess capacity or will run out of room. Neither
    situation is optimal. In a'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'cloud solution, the space needed grows and shrinks as necessary to support
    the customer. If there is a peak in usage or resource needs, the service grows
    with the needs. When the needs are gone, the resources used decrease. This supports
    a pay-as-you-go model, where a customer pays only for the resources needed and
    used.


    For the CSP, this presents a challenge. The CSP must have the excess capacity
    to serve all their customers without having to incur the cost of the total possible
    resource usage. They must, in effect, estimate how much excess capacity they must
    have to serve all of their customers. If they estimate poorly, the customer will
    suffer and the CSP’s customer base could decrease.


    However, there is a cost to maintaining this excess capacity. The cost must be
    built into the cost model. In this way, all customers share in the cost of the
    CSP, maintaining some level of excess capacity. In the banking world, a bank must
    keep cash reserves of a certain percentage so that they can meet the withdrawal
    needs of their customers. But if every customer wanted all of their money at the
    same time, the bank would run out of cash on hand. In the same way, if every customer’s
    potential peak usage occurred at the same time, the CSP would run out of resources,
    and the customers would be constrained (and unhappy).


    The customer must also take care in setting internal limits on resource use. The
    ease of expanding resource use can make it easy to consume more resources than
    are truly necessary. Rather than cleaning up and returning resources no longer
    needed, it is easy to just spin up more resources. If care is not taken to set
    limits, a customer can find themselves with a large and unnecessary bill for resources
    “used.”


    # Resource Pooling


    In many ways, this is the core of cloud computing. Multiple customers share a
    set of resources including servers, storage, application services, etc. They do
    not each have to buy the infrastructure necessary to provide their IT needs. Instead,
    they share these resources with each other through the orchestration of the CSP.
    Everyone pays for what they need and use. The goal is that resources are used
    efficiently by the group of customers.


    This resource pooling presents some challenges for the cybersecurity professional.
    When resources are pooled, it can lead to multitenancy. A competitor or a rival
    can be sharing the same physical hardware. If the system, especially the hypervisor,
    is compromised, sensitive data could be exposed.


    Resource pooling also implies that resources are allocated and deallocated as
    needed. The inability to ensure data erasure can mean that remnants of sensitive
    files could exist on storage allocated to another user. This increases the importance
    of data encryption and key management.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Measured Service


    Metering service usage allows a CSP to charge for the resources used. In a private
    cloud, this can allow an organization to charge each department based on their
    usage of the cloud. For a public cloud, it allows each customer to pay for the
    resources used or consumed. With a measured service, everyone pays their share
    of the costs.


    The cloud is especially advantageous for organizations with peaks in their resource
    needs or cycles of usage. For example, a tax preparer uses more resources in the
    United States in the beginning of the year, peaking on April 15. Many industries
    have sales dates: Memorial Day, President''s Day, Black Friday, Cyber Monday,
    Arbor Day, etc. Okay, maybe not Arbor Day. Resource needs peak at these times.
    A company can pay for the metered service for these peak times rather than maintaining
    the maximum resource level throughout the year. Maintaining the maximum resources
    in-house would be expensive and a waste of resources.


    # Building Block Technologies


    These technologies are the elements that make cloud computing possible. Without
    virtualization, there would be no resource pooling. Advances in networking allow
    for ubiquitous access. Improvements in storage and databases allow remote virtual
    storage in a shared resource pool. Orchestration puts all the pieces together.
    The combination of these technologies allows better resource utilization and improves
    the cost structure of technology. Providing the same resources on-premise can
    also be accomplished by these technologies, but with lower resource utilization
    and at a higher cost in many situations. Where costs are not decreased by cloud
    computing, a case for on-premise resources can be made.


    # Virtualization


    Virtualization allows the sharing of servers. Virtualization is not unique to
    cloud computing and can be used to share corporate resources among multiple process
    and services. For example, a service can have VMware installed and run a mail
    server on one virtual machine (VM) and a web server on another VM, both using
    the same physical hardware. This is resource sharing.


    Cloud computing takes this idea and expands it beyond what most companies are
    capable of doing. The CSP shares resources among a large number of services and
    customers (also called tenants). Each tenant has full use of their environment
    without knowledge of the other tenants. This increases the efficient use of the
    resources significantly.


    In addition, a CSP may have multiple locations. This allows services and data
    to move seamlessly between locations, improving resource use by the CSP. Services
    and'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'data can easily be in multiple locations, improving business continuity and
    fault tolerance. The CSP can use the ease with which virtualization allows the
    movement of data and services to take advantage of available space and excess
    capacity, wherever it may be located.


    This can create some security and compliance concerns, when data cannot move freely
    across borders or jurisdictional issues exist. These issues are best handled during
    contract negotiation. Another concern is if the hypervisor is compromised, as
    it controls all VMs on a machine. If the hypervisor is compromised, all data can
    be compromised. The security of the hypervisor is the responsibility of the CSP.


    # Storage


    A variety of storage solutions allow cloud computing to work. Two of these are
    storage area networks (SANs) and network-attached storage (NAS). These and other
    advances in storage allow a CSP to offer flexible and scalable storage capabilities.


    A SAN provides secure storage among multiple computers within a specific customer’s
    domain. A SAN appears like a single disk to the customer, while the storage is
    spread across multiple locations. This is one type of shared storage that works
    across a network.


    Another type of networked storage is the NAS. This network storage solution uses
    TCP/IP and allows file-level access. A NAS appears to the customer as a single
    file system. This is a solution that works well in a cloud computing environment.


    The responsibility for choosing the storage technology lies with the CSP and will
    change over time as new technologies are introduced. These changes should be transparent
    to the customer. The CSP is responsible for the security of the shared storage
    resource.


    Shared storage can create security challenges if file fragments remain on a disk
    after it has been deallocated from one customer and allocated to another. A customer
    has no way to securely wipe the drives in use, as the customer does not control
    the physical hardware. However, the use of crypto-shredding can make these fragments
    unusable if recovered.


    # Networking


    As all resources in a cloud environment are accessed through the network, a robust,
    available network is an essential element. The Internet is the network used by
    public and community clouds, as well as many private clouds. This network has
    proven to be widely available with broad capabilities. The Internet has become
    ubiquitous in society, allowing for the expansion of cloud-based services.


    An IP-based network is only part of what is needed for cloud computing. Low latency,
    high bandwidth, and relatively error-free transmissions make cloud computing possible.
    The use of public networks also creates some security concerns. If access to cloud'
