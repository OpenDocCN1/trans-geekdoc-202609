- pgno: 69
  md: '+   - **Volume:** Volume storage behaves like a traditional drive attached
    to a computer, but in cloud data storage, both the computer and drive are virtualized.
    Volume storage may store data in blocks of a predetermined size, which can be
    used for implementing data dispersion. Because the disk is virtualized, the data
    may actually be stored across multiple physical disks in the form of blocks along
    with the erasure coding needed to reconstruct the data if some blocks are missing.

    +   - **Object:** Object storage is similar to accessing a Unix sharepoint or
    Windows file server on a network. Data is stored and retrieved as objects, often
    in the form of files, and users are able to interact with the data objects using
    file browsers.


    # PaaS


    Some PaaS offerings provide the ability to connect to IaaS storage types, such
    as connecting a volume to a PaaS VM to provide a virtual disk for storing and
    accessing data. There are storage types unique to PaaS, however, including the
    following:


    +   - **Disk:** This is a virtual disk that can be attached to a PaaS instance
    and may take the form of a volume or object store, depending on the CSP offering
    and consumer needs. Many PaaS offerings simply offer parameters for storage connected
    to the PaaS instance, such as speed and volume of I/O operations or data durability,
    and the CSP provisions appropriate storage space based on the configurations specified
    by the consumer.

    +   - **Databases:** This is both a storage type and PaaS offering. Platforms
    that can be delivered as a service include popular database software such as Microsoft
    SQL Server and Oracle databases, as well as CSP-specific offerings such as AWS
    Relational Database (RDS) or Microsoft Azure Databases. In most cases, these databases
    will be offered in a multitenant model with logical separation between clients,
    and data is accessed via API calls to the database.

    +   - **Binary Large Object (blob):** Blobs are unstructured data; that is to
    say, data that does not adhere to a particular data model like the columns in
    a database. These are often text files, images, or other binary files generated
    by applications that allow users to generate free-form content; it is possible
    to apply some loose organization. This is similar to manually organizing files
    into folders such as word processing files by date of writing or photos by vacation
    destination. Blob storage services such as AWS Simple Storage Service (S3) and
    Azure Blob Storage apply these concepts to large volumes of blob data and typically
    make it available to applications or users via a URL.


    Some types of storage platforms or storage types may be specific to a particular
    CSP’s offerings. Examples include blob storage for unstructured data in Microsoft
    Azure, and a variety of queue services available in AWS that support the short-term
    storage, queueing, and delivery of messages to users or services.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# SaaS


    SaaS offerings are the most abstracted service model, with CSPs retaining virtually
    all control including data storage architecture. In some cases, the data storage
    type is designed to support a web-based application that permits users to store
    and retrieve data, while other storage types are actual SaaS offerings themselves,
    such as the following:


    +   - **Information storage and management**: This storage type allows users to
    enter data and manipulate it via a web GUI. The data is stored in a database managed
    by the CSP and often exists in a multitenant environment, with all details abstracted
    from the users.

    +   - **Content and file storage**: Data is stored in the SaaS app in the form
    of files that users can create and manipulate. Examples include filesharing and
    collaboration apps, as well as custom apps that allow users to upload or attach
    documents such as ticketing systems.

    +   - **Content delivery network (CDN)**: CDNs provide geographically dispersed
    object storage, which allows an organization to store content as close as possible
    to users. This offers advantages of reducing bandwidth usage and usually delivers
    lower latency for end users as they can pull from a server physically closer to
    their location.


    One feature of most cloud data storage types is their accessibility via application
    program interfaces (APIs). The virtualization technologies in use for cloud services
    create virtual connections to the pooled storage resources, replacing physical
    cable connections. These APIs mean the storage types may be accessible across
    from more than one service model; for example, object storage may be accessed
    from a PaaS or SaaS environment if an appropriate API call is made. Many CSPs
    have specifically architected their storage APIs for broad use in this manner,
    like Amazon’s Simple Storage Service (S3), which is an object storage type accessible
    via a REST API. This enables IaaS, PaaS, SaaS, on-premises systems, and even users
    with a web browser to access it.


    # Threats to Storage Types


    There are universal threats to data at rest (in storage) regardless of the location,
    including on-premises or legacy environments, local workstation storage, and cloud
    services. These affect all three elements of the confidentiality, integrity, availability
    (CIA) triad: unauthorized access is a threat against confidentiality, improper
    modification represents a threat to integrity, and loss of a storage device or
    loss of connectivity is a threat against availability. Tools that are appropriate
    for on-premises environments may not work in a distributed cloud environment,
    so the CCSP should be aware of how these threats impact cloud storage and appropriate
    countermeasures.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '+   - **Unauthorized access:** Any user accessing data storage without proper
    authorization presents obvious security concerns. Appropriate access controls
    are required by the consumer to ensure only properly identified and authorized
    internal users are able to access data stored in cloud services. Because of the
    multitenant nature of cloud storage, the CSP must provide adequate logical separation
    to ensure cloud consumers are not able to access or tamper with data that does
    not belong to them.


    +   - **Unauthorized provisioning:** This is primarily a cost and operational
    concern. The ease of provisioning cloud services is one of the selling points
    versus traditional, on-premises infrastructure. This ease of use can lead to unofficial
    or shadow IT, which drives unrestricted growth in the cloud services and associated
    costs. Unauthorized storage can also act as a blind spot when it comes to security;
    if the security team is not aware of where the organization is storing data, the
    team cannot take appropriate steps to secure that data.


    +   - **Regulatory noncompliance:** Certain cloud service offerings may not meet
    all the organization’s compliance requirements, which leads to two security concerns.
    First are the consequences of noncompliance like fines or suspension of business
    operations. Second is the foundation of the compliance requirements in the first
    place—to protect data. Requirements like the use of a specific encryption algorithm
    are usually driven by a need to protect data; cloud services, which do not meet
    the compliance objectives, are also unlikely to offer adequate security for the
    regulated data being stored.


    +   - **Jurisdictional issues:** The major CSPs are global entities and offer
    highly available services, many of which rely on global redundancy and failover
    capabilities. Unfortunately, the ability to transfer data between countries can
    run afoul of legal requirements, particularly privacy legislation that bars the
    transfer of data to countries without adequate privacy protections. The features
    in a particular cloud storage service may support global replication by default,
    so it is incumbent on the CCSP to understand both their organization’s legal requirements
    and the configuration options available in the CSP environment.


    +   - **Denial of service:** Cloud services are broadly network accessible, which
    means they require active network connectivity to be reachable. In the event a
    network connection is severed anywhere between the user and the CSP, the data
    in storage is rendered unavailable. Targeted attacks like a distributed denial
    of service (DDoS) can also pose an issue, though the top CSPs have robust mitigations
    in place and are usually able to maintain some level of service even during an
    attack.


    +   - **Data corruption or destruction:** This is not a concern unique to cloud
    data storage. Issues such as human error in data entry, malicious insiders tampering'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'with data, hardware and software failures, or natural disasters can render
    data or storage media unusable.


    +   - **Theft or media loss:** This threat applies more to devices that can be
    easily accessed and stolen, such as laptops and universal serial bus (USB) drives;
    however, the risk of theft for cloud data storage assets like hard drives does
    exist. CSPs retain responsibility for preventing the loss of physical media through
    appropriate physical security controls. Consumers can mitigate this risk by ensuring
    adequate encryption is used for all data stored in the cloud, which renders the
    stolen data useless unless the attacker also has the key.

    +   - **Malware and ransomware:** Any location with data storage and processing
    abilities is at risk from malware, particularly ransomware. Attackers have become
    more sophisticated when writing ransomware, so it not only encrypts data stored
    on locally attached drives but also seeks common cloud storage locations like
    well-known collaboration SaaS apps. Proper access controls and anti-malware tools
    can prevent or detect malware activities.

    +   - **Improper disposal:** Like physical drive loss, the CSP has the majority
    of responsibility when it comes to disposal of hardware. Ensuring hardware that
    has reached the end of its life is properly disposed of in such a way that data
    cannot be recovered must be part of the CSP''s services. Consumers can protect
    data by ensuring it is encrypted before being stored in the cloud service and
    that the encryption keys are securely stored away from the data.


    # DESIGN AND APPLY DATA SECURITY TECHNOLOGIES AND STRATEGIES


    Data security in the cloud comprises a variety of tools and techniques. According
    to the shared responsibility model published by the major CSPs, consumers are
    responsible for securing their own data. Under most privacy legislation, the data
    owner, who is usually the cloud consumer, is ultimately accountable and legally
    liable for data breaches. However, adequately securing data requires actions by
    both the cloud consumer and the CSP to properly secure elements such as the hardware
    infrastructure and physical facilities.


    # Encryption and Key Management


    Encryption is the process of applying mathematical transformations to data to
    render it unreadable. It typically requires the use of a key or cryptovariable,
    which is a string of data used by the cryptographic system to transform the data.
    The steps taken to achieve the transformation are known as an *algorithm*.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Modern cryptographic algorithms like Rijndael, which is part of the Advanced
    Encryption Standard (AES), offer protection for data that could take thousands
    or millions of years to break. Trying every possible combination of keys and permutation
    steps in the algorithm would take more time and resources than most attackers
    have available, but the process of encrypting and decrypting is relatively short
    if you know the key. Encryption is a foundational element of modern data security,
    particularly in cloud environments when data is stored outside of the organization’s
    direct control.


    Due to the criticality of encryption, organizations should focus attention on
    properly implementing and managing cryptographic systems. One particular area
    of focus is managing encryption keys. Auguste Kerckhoffs, a Dutch cryptographer,
    defined a simple doctrine that underpins key management: a cryptosystem should
    be secure even if everything about the system, except the key, is public knowledge.
    Known as Kerckhoffs’s principle, this simple maxim guides security in cryptographic
    systems by placing the emphasis on protecting keys.


    Keys should be classified at the highest data classification level available in
    the organization and protected as other high value assets would be. It is appropriate
    to implement controls across all categories including policies for creating and
    managing keys, operational procedures for securing and using keys, and tools and
    systems for handling keys. As a data asset, the keys should be protected at each
    stage of their lifecycle, including the following:


    +   - Creating strong, random keys using cryptographically sound inputs like random
    numbers

    +   - Storing keys in a secure manner, whether encrypted inside a key vault or
    stored on a physical device, and handling the process of storing copies for retrieval
    if a key is ever lost (known as key escrow)

    +   - Using keys securely, primarily focused on access controls and accountability

    +   - Sharing keys is not as common due to their highly sensitive nature, but
    facilities should exist for sharing public keys, securely transferring symmetric
    keys to a communications partner, and distributing keys to the key escrow agent

    +   - Archiving keys that are no longer needed for routine use but might be needed
    for previously encrypted data

    +   - Secure destruction of keys that are no longer needed or that have been compromised


    FIPS 140-3 provides a scheme for U.S. government agencies to rely on validated
    cryptographic modules and systems, though it has become a globally recognized
    framework as many tools offer Federal Information Processing Standards (FIPS)
    validated modes for encryption. As of 2020, this standard is being phased in to
    replace its predecessor, FIPS'
  merge: -1
  img_proc: true
- pgno: 74
  md: '140-2. FIPS 140-3 establishes a framework and testing scheme for validating
    the strength of protection provided by a cryptographic module and defines levels
    of protection for such modules including physical tamper-evident hardware security
    modules (HSMs). Details on the standard can be found here: csrc.nist.gov/publications/detail/fips/140/3/final.


    Cloud security practitioners will need to understand where encryption can be deployed
    to protect their organization’s data and systems. Many CSPs offer virtualized
    HSMs that are validated against the FIPS 140-2 standard and can be used to securely
    generate, store, and control access to cryptographic keys. These virtual HSMs
    are designed to be accessible only by the consumer and never by the CSP and are
    usually easy to integrate into other cloud offerings from the same CSP.


    If your organization uses multiple cloud providers or needs to retain physical
    control over key generation, your apps should be architected to allow for a bring-your-own-key
    strategy. This is more technically challenging for the organization, as hosting
    any on-prem systems requires more skills and resources, but it offers more control
    over the configuration and use of encryption, as well as physical control over
    the HSMs.


    Encryption in cloud services may be implemented at a variety of layers, from the
    user-facing application all the way down to the physical storage devices. The
    goals of safeguarding data, such as counteracting threats of physical theft or
    access to data by other tenants of the cloud service, will drive decisions about
    which types of encryption are appropriate to an organization. Some examples include
    the following:


    +   - **Storage-level encryption** provides encryption of data as it is written
    to storage, utilizing keys that are controlled by the CSP. It is useful in cases
    of physical theft as the data should be unreadable to an attacker, but CSP personnel
    may still be able to view data as they control the keys.

    +   - **Volume-level encryption** provides encryption of data written to volumes
    connected to specific VM instances, utilizing keys controlled by the consumer.
    It can provide protection in the case of theft and prevents CSP personnel or other
    tenants from reading data, but it is still vulnerable if an attacker gains access
    to the instance.

    +   - **Object-level encryption** can be done on all objects as they are written
    into storage, in which case the CSP likely controls the key and could potentially
    access the data. For high-value data, it is recommended that all objects be encrypted
    by the consumer with keys they control before being stored.

    +   - **File-level encryption** is often implemented in client applications such
    as word processing or collaboration apps like Microsoft Word and Adobe Acrobat.
    These apps allow for encryption and decryption of files when they are accessed
    using keys controlled by the user, which prevents the data from being read by
    CSP personnel or other cloud tenants. The keys required may be manually managed,
    such as a password the user must enter, or automated through IRM, which can verify'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'a user''s authorization to access a particular file and decrypt it based on
    the user''s provided credentials.


    +   - **Application-level encryption** is implemented in an application typically
    using object storage. Data that is entered or created by a user is encrypted by
    the app prior to being stored. Many SaaS platforms offer a bring-your-own-key
    ability, which allows the organization to prevent CSP personnel or other cloud
    tenants from being able to access data stored in the cloud.

    +   - **Database-level encryption** may be performed at a file level by encrypting
    database files or may utilize transparent encryption, which is a feature provided
    by the database management system (DBMS) to encrypt specific columns, whole tables,
    or the entire database. The keys utilized are usually under the control of the
    consumer even in a PaaS environment, preventing CSP personnel or other tenants
    from accessing data, and the encrypted data is also secure against physical theft
    unless the attacker also gains access to the database instance to retrieve the
    keys.


    # Hashing


    Hashing, sometimes known as *one-way encryption*, is a tool primarily associated
    with the integrity principle of the CIA triad. Integrity deals with preventing,
    detecting, and correcting unintended or unauthorized changes to data, both malicious
    and accidental. Cryptographic algorithms called *hash functions* take data of
    any input length and perform mathematical operations to create a unique hash value.
    This process can be performed again in the future and the two hash values compared;
    if the input data has changed, the mismatched hash values are proof that the data
    has been altered.


    Hashes form an integral part of digital signatures, which provide users the ability
    to verify both the integrity and the source of a message, file, or other data
    such as an app. The signing party calculates a hash and encrypts the hash value
    with their private key. A receiving party, who may be a user receiving a message,
    downloading an app, or pulling software from a repository, calculates a hash of
    the received data and then decrypts the sender''s digital signature using the
    sender''s public key. If the two hashes match, it can be assumed the data is original,
    as no other user would be able to change the data, calculate a hash, and use the
    original sender''s private key to create the digital signature. A CCSP should
    be aware of digital signatures as a method for verifying messages and apps used
    in cloud environments, especially when third-party software is being integrated.


    Hashes can provide multiple security services in cloud environments. They can
    verify copies of data like backups are accurate and can be used to verify the
    integrity of messages like email. They are also widely implemented in many security
    tools as a way to detect changes, which can indicate system compromise. File integrity
    monitoring is used by some anti-malware and intrusion detection systems to identify
    changes to key system files, and highly secure systems may create hashes of data
    about system hardware'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'such as manufacturer, devices connected, or model numbers. In both cases, there
    is an expectation that these items should not change; comparing a current hash
    with a previously calculated hash can identify unwanted changes.


    When implementing hash functions, it is important to choose a strong function
    that is collision-resistant. A collision occurs when two different inputs produce
    the same hash value as an output. In this case, it is impossible to rely on the
    hash function to prove integrity. As with many aspects of information security,
    there is a U.S. federal government standard related to hashes. FIPS 180-4, Secure
    Hash Standard (SHS), provides guidance on the Secure Hash Algorithm (SHA-3). As
    with FIPS 140-2 and 140-3 encryption, many popular tools and platforms provide
    FIPS-compliant modes for hash algorithms. More details on SHS can be found here:
    csrc.nist.gov/publications/detail/fips/180/4/final.


    # Masking


    Masking is similar to obfuscation, which is discussed later in the chapter, and
    both are used to prevent disclosure of sensitive data. Data masking involves hiding
    specific elements of data for certain use cases, primarily when there is a need
    for data to be retrievable for some but not all users or processes. As an example,
    a corporate human resources (HR) system may need to store a user’s Social Security
    number (SSN) for payment and tax purposes. Daily users accessing the HR system
    do not have a need to see the full SSN, so the system instead displays XXX-XX-1234,
    as the last four digits are needed to verify a user’s identity.


    Data masking can be useful in preventing unintended disclosures by limiting the
    amount of data displayed. It is very granular implementation of minimum necessary
    access. Although a user may be authorized to view full SSN information, in the
    daily use case of managing employee records, they do not have a need to see the
    full information.


    Unstructured data can present problems for masking, as well as tokenization, obfuscation,
    and de-identification. When data is structured in a database, it is easy to identify
    and apply these techniques. Unstructured data can be stored in files, free-form
    text or comment fields in databases, or in applications that store data objects
    without structure. As an example, it would be quite simple to identify and apply
    masking to a database column labeled Social Security Number, but if some records
    have that data in a comments field along with other data, those records will obviously
    not be masked. Data handling and system use policies should dictate the proper
    use of information, including where to store sensitive data elements. If the organization
    utilizes unstructured storage or formats, data security tools must also be chosen
    to deal with unstructured data types.


    # Tokenization


    Tokenization is a process whereby a nonsensitive representation of sensitive data,
    otherwise known as a token, is created and used. The token is a substitute to
    be used in place of more sensitive data like a credit card number, often called
    a primary account number'
  merge: -1
  img_proc: true
- pgno: 77
  md: '(PAN). Rather than storing and using PANs, which is risky due to the value
    of a PAN, tokens can be used instead.


    Tokens can be traced back to the original information by making a proper request
    to the tokenization service, which usually implements access controls to verify
    user identities and authorization to view sensitive data. Tokens are implemented
    for many online payment systems where credit card numbers are stored; they are
    not really stored in the app but are instead tokenized. When the user makes a
    purchase, the app supplies the token along with user identity information to the
    tokenization server, which if it accepts the information provided, accesses the
    relevant credit card data and supplies it to complete the transaction.


    Using tokens instead of the actual data reduces risk by removing sensitive data
    needed by the application. A database of live credit card PANs would be incredibly
    valuable to a thief, who could use those cards to make purchases. The same database
    full of tokens is virtually worthless. Tokenization systems are obviously high-value
    targets, but due to their specialized function, it is possible to more robustly
    secure them versus a general-purpose application.


    Although tokenization is widely used in credit card processing transactions and
    is a recommended control for payment card industry data security standard (PCI
    DSS) compliance, any sensitive data can be tokenized to reduce risk. Implementations
    vary, but the process of tokenizing data generally follows the same basic steps:


    +   1. An application collects sensitive information when a user enters it.

    +   2. The app secures, often using encryption, and sends the sensitive data to
    a tokenization service.

    +   3. Sensitive data is stored in the token database, and a token representing
    the data is generated and stored in the token database along with the sensitive
    data.

    +   4. The token is returned to the original application, which stores it instead
    of the original sensitive data.

    +   5. Any time the sensitive data is required, the token and appropriate credentials
    can be used to access it. Otherwise, the sensitive data is never revealed, as
    the tokenization service should be tightly access controlled.


    # Data Loss Prevention


    DLP, sometimes also known as data leakage prevention, refers to a technology system
    designed to identify, inventory, and control the use of data that an organization
    deems sensitive. It spans several categories of controls including detective (identifying
    where sensitive data is stored and being used), preventative (enforcing policy
    requirements on the storage and sharing of sensitive data), and corrective (displaying
    an alert to the user informing them of the policy violation and preventing inappropriate
    action such as sending sensitive data via email).


    Due to the multiuse nature of DLP, many organizations will implement only some
    of the functions at one time. An organization is unlikely to be successful attempting
    to'
