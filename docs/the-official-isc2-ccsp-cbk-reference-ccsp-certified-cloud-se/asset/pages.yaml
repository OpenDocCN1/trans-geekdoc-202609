- pgno: 147
  md: '+   2. **Create application overview.** In this step, we look at the application
    architecture, application characteristics, and the users of the system to more
    easily identify threats.

    +   3. **Identify threats.** When we understand the characteristics of our application
    and our security requirements, identification of threats is more easily accomplished.

    +   4. **Mitigate threats.** Once we identify threats, we can start identifying
    controls that will aid in threat mitigation.

    +   5. **Validate threat mitigation.** It is important to monitor and review controls
    to ensure they adequately address identified threats and decrease threat below
    the organization’s risk appetite.


    Throughout the five phases of the SSDLC, these five steps are refined. One way
    to identify security requirements is through the use of a threat model, such as
    the STRIDE model. STRIDE is an acronym for Spoofing, Tampering, Repudiation, Information
    disclosure, DoS, and Elevation of privilege. These are common threat categories
    to consider in this process. See Table 4.1.


    **TABLE 4.1 The STRIDE Model**


    | LETTER | THREAT | PROPERTY VIOLATED | DEFINITION |

    |---|---|---|---|

    | S | Spoofing identity | Authentication | Pretending to be someone or something
    else |

    | T | Tampering with data | Integrity | Modifying data or memory |

    | R | Repudiation | Nonrepudiation | Claiming to not have done something |

    | I | Information disclosure | Confidentiality | Providing information to unauthorized
    parties |

    | D | Denial of service | Availability | Exhausting resources needed for a service
    |

    | E | Elevation of privilege | Authorization | Allowing someone to perform unauthorized
    tasks |


    # Software Configuration Management and Versioning


    The purpose of software configuration management (SCM) and versioning is to manage
    software assets. This can be challenging as software is almost always developed
    in a team setting. These teams may be geographically dispersed and may be working
    in multiple time zones. Multiple people may be making changes to both the config
    and source code files. Managing all of this is essential to ensure that changes
    are current and accurate.'
  merge: -1
