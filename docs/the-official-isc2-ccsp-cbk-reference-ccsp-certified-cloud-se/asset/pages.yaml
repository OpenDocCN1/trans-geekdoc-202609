- pgno: 126
  md: '# Packet Capture


    To resolve many security issues and truly know what is going on within your network,
    packet capture is necessary. However, packet capture on a cloud vendor or CSP
    using traditional tools like Wireshark is not generally possible. Such packet
    capture would require access to a vendor’s internal network beyond what would
    be permissible. A vendor must protect the data of all tenants, and allowing one
    or more tenants to perform packet capture can put other tenants at risk. A vendor
    may perform packet capture and could make it available for incident response or
    audit purposes in some circumstances. But this should not be expected and would
    need to be explicitly agreed to in vendor contracts.


    To address this security concern (the lack of packet capture in general), some
    CSPs provide tools that allow packet capture functionality to some degree. Two
    examples will be discussed with AWS and Azure. If the customer is using a hybrid
    cloud, where some portions are on the customer’s network or in the customer’s
    data center, packet capture of those segments is possible with traditional tools.


    Amazon provides AWS VPC Traffic Monitoring. This tool allows a customer to mirror
    the traffic of any AWS network interface in a VPC they have created and to capture
    that traffic for analysis by the customer’s security team. This can be done directly
    in AWS using CloudShark to perform network analysis on the packet capture. This
    tool creates what is essentially a virtual tap. In this way, the customer can
    monitor all network traffic through their VPCs.


    Microsoft provides a similar capability with Azure Network Watcher. This tool
    allows packet capture of traffic to and from a customer’s VMs. Packet capture
    can be started in a number of ways. One nice feature for security purposes is
    the ability to trigger packet capture when certain conditions exist.


    The specific tools available and the use of these tools will change over time.
    For security purposes, the ability to capture packets in the cloud services used
    by the customer is important. This is an area that should be fully investigated
    when moving to the cloud.


    # PLAN DISASTER RECOVERY AND BUSINESS CONTINUITY


    The cloud has transformed both disaster recovery (DR) and business continuity
    (BC) by providing the ability ability to operate in geographically distant locations
    and by providing greater hardware and data redundancy. All of this leads to lower
    recovery time objectives (RTOs) and recovery point objectives (RPOs) at price
    points businesses could not achieve on their own. DR and BC can be planned into
    the system rather than trying to bolt it on after the fact in largely unsatisfactory
    ways.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Risks Related to the Cloud Environment


    There are risks to cloud computing. The first one that generally comes to mind
    is that the business no longer owns or has full control over system hardware assets.
    Computing becomes an operational expense (OPEX) rather than a capital expense
    (CAPEX). This change in ownership and control makes many people uncomfortable.
    However, with careful selection of CSPs and the development of SLAs and other
    contractual agreements, these concerns can be addressed. In addition, the service
    model used affects the amount of control that is retained. For example, in an
    IaaS environment, the business retains a large amount of control. It may be determined
    that the control a business wants is not necessary to ensure business continuity
    and to address potential disasters. The decrease in cost for DR and BC may also
    mean greater ability to respond to disasters.


    The geographic dispersion of the CSP data centers may also mean that the disaster
    risk profile may be unknown to the customer and may be very different from their
    own. For example, the CSP data center may be in an area subject to hurricanes,
    while the customer is located in an area far from the coast. This risk requires
    the cloud customer to review the ability of a CSP to address disasters relevant
    to their locations. One reason it is important to use a large CSP having multiple
    regions is that the risk profile will be different in each region, providing greater
    continuity benefits. One CSP data center may be in an area subject to ice storms,
    and another is in a more temperate location. This allows the CSP to move a customer
    from one area to another when natural disasters are more likely in one area than
    another area if the contract permits this.


    Downtime is a concern for companies, and Internet-based CSPs are not immune. It
    is also an issue that can affect a company not using the cloud. If the Internet
    is down, many companies will be unable to do business. Fault tolerance can be
    built in with a CSP using availability zones and automatic failover. If ISP connectivity
    is the concern, the major CSPs provide direct access, such as AWS Direct Connect
    or Azure ExpressRoute. If fault tolerance is designed into the services a company
    delivers, localized connectivity failures will only impact those in the region
    impacted and not customers in other regions.


    Compliance can be another risk in the cloud environment. Some regulations have
    strict rules on where PII, PHI, and other sensitive information can be stored.
    If a company is not careful, they may violate these restrictions. This is an area
    that contracts must address. Fortunately, the CSP has many customers, and legal
    requirements will be common among them. The CSP will need to address compliance
    concerns for many or all of their customers. Cross-border transfers of data are
    of particular concern in many areas, such as European Union (EU) countries covered
    by the General Data Protection Regulation (GDPR).


    Another compliance concern may be availability of data. In a disaster scenario,
    a company may still need access to critical business processes and data even if
    the systems'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'are down. Procedures for accessing this data in alternate ways (other than
    through the CSP) must be planned for and tested regularly. Regardless of the disaster,
    responsibility for the data remains with the customer, so careful selection of
    CSPs and alternative access methods will need to be addressed.


    There is also some concern that multitenancy boundaries can be breached, APIs
    can be exploited, and the hypervisor may become compromised in a disaster scenario
    if safeguards fail. Disasters can affect more than availability. They can impact
    integrity and confidentiality as well. These issues can affect the ability of
    a business to function. Each of these must be addressed. A BC and DR plan cannot
    simply point to the cloud for every potential disruption. Instead, comprehensive
    plans are still necessary and must be developed and tested.


    One risk-reducing feature that makes the cloud particularly beneficial for BC
    and DR is that the Internet and geographic dispersion means that the customer
    processes are available, widely leading to a highly available architecture. Both
    highly available because the network is global and highly available because all
    of a major CSP’s availability zones will not be directly affected by the same
    disaster. Disasters such as storms, terrorist attacks, and other infrastructure
    failures are usually geographically localized.


    # Business Requirements


    Business-critical systems require more recoverability than is often possible with
    local resources and corporate data centers without expending enormous resources.
    The cloud environment provides options to support high availability, scalable
    computing, and reliable data retention and data storage. Three ways we measure
    the business capabilities are RTO or how long are you down, RPO or how much data
    may you lose, and recovery service level (RSL), which measures how much computing
    power (0 to 100 percent) is needed for production systems during a disaster. This
    does not usually include compute needs for development, test, or other environments.
    These are usually nonessential environments during a disaster.


    # Recovery Time Objective


    RTO is the amount of time in which a business process must be restored to a specific
    service level. Missing the RTO can lead to contractual violations and business
    consequences. The RTO is usually measured in minutes or hours. However, for some
    business processes, the RTO can be days. One of the authors of the book once worked
    for a company that had a 72-hour RTO for the network to be backed up and the data
    backup to be restored. Clearly, this customer did not have the transactional load
    of an Amazon or eBay type of business and could catch up in a reasonable period
    of time. The company had a manual process during that 72 hours, and then manually
    entered the transactions after the backup was restored.'
  merge: -1
  img_proc: true
