- pgno: 4
  md: '# # About the Authors


    **Leslie D. Fife**, CISSP-ISSMP, CCSP, C|CISO, CISA, CISM, CRISC, GDAT, GCED,
    CBCP, CIPM (and more than 20 other certifications), has more than 40 years of
    experience in information technology, cybersecurity, and risk management. He is
    currently an information security risk manager for the Church of Jesus Christ
    of Latter-day Saints, an assistant professor of practice at Southern Illinois
    University Carbondale, and an adjunct at the University of Utah. He is also a
    commissioner for the Computing Accreditation Commission of ABET. His career includes
    the U.S. Navy submarine service, software development in the defense industry
    and the oil and gas field service industry, incident response and business continuity
    in the financial services sector, as well as 22 years as a professor of computer
    science. He has a PhD in computer science from the University of Oklahoma.


    **Aaron Kraus**, CCSP, CISSP, is an information security professional with more
    than 15 years of experience in security risk management, auditing, and teaching
    information security topics. He has worked in security and compliance roles across
    industries including U.S. federal government civilian agencies, financial services,
    and technology startups, and he is currently the security engagement manager at
    Coalition, Inc., a cyber risk insurtech company. His experience includes creating
    alignment between security teams and the organizations they support, by evaluating
    the unique threat landscape facing each organization and the unique objectives
    each organization is pursuing to deliver a balanced, risk-based security control
    program. As a consultant to a financial services firm he designed, executed, and
    matured the third-party vendor audit programs to provide oversight of key compliance
    initiatives, and he led the global audit teams to perform reviews covering physical
    security, logical security, and regulatory compliance. Aaron is a course author,
    instructor, and cybersecurity curriculum dean with more than 13 years of experience
    at Learning Tree International, and he most recently taught the Official (ISC)²
    CISSP CBK Review Seminar. He has served as a technical editor for numerous Wiley
    publications including *(ISC)² CCSP Certified Cloud Security Professional Official
    Study Guide, 2nd Edition*; *CCSP Official (ISC)² Practice Tests, 1st Edition*;
    *The Official (ISC)² Guide to the CISSP CBK Reference, 5th Edition*; and *(ISC)²
    CISSP Certified Information Systems Security Professional Official Practice Tests,
    2nd Edition*.'
  merge: -1
  img_proc: true
