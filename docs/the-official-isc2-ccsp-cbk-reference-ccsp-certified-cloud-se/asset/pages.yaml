    # Availability of Stand-Alone Hosts


    Stand-alone hosts are isolated, dedicated hosts for the use of a single tenant.
    These are often required for contractual or regulatory reasons, such as processing
    highly sensitive data like healthcare information. The use of nonshared resources
    carries obvious consequences related to costs. A CSP may be able to offer secure
    dedicated hosting similar to colocation, which still offers costs savings to the
    consumer due to shared resources including physical facilities and shared resources
    like power and utilities. A CCSP will need to gather and analyze the organization’s
    requirements to identify if the costs of stand-alone hosting are justified. In
    some CSPs, the use of virtual private resources may be an acceptable alternative
    with lower costs, due to the use of shared physical infrastructure with strong
    logical separation from other tenants.


    # Availability of Clustered Hosts


    Clusters are a grouping of resources with some coordinating element, often a software
    agent that facilitates communication, resource sharing, and routing of tasks among
    the cluster. Clustered hosts can offer a number of advantages, including high
    availability via redundancy, optimized performance via distributed workloads,
    and the ability to scale resources without disrupting processing via addition
    or removal of hosts to the cluster. Clusters are a critical part of the resource
    pooling that are foundational to cloud computing and are implemented in some fashion
    for most resources needed in modern computing systems including processing, storage,
    network traffic handling, and application hosting.


    The cluster management agent, often part of hypervisor or load balancer software,
    is responsible for mediating access to shared resources in a cluster. Reservations
    are guarantees for a certain minimum level of resources available to a specified
    virtual machine. The virtualization toolset or CSP console is often where this
    can be configured, such as a certain number of compute cores or RAM allocated
    to a VM. A limit is a maximum allocation, while a share is a weighting given to
    a particular VM that is used to calculate percentage-based access to pooled resources
    when there is contention.


    Maintenance mode refers to the practices surrounding the routine maintenance activities
    for clustered hosts. Although taking a system offline primarily impacts availability,'
