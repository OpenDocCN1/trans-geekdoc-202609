- pgno: 259
  md: 'Regulations are put into place by governments and government-empowered agencies
    to protect entities and individuals from risks. In addition, they force providers
    and processors to take appropriate measures to ensure protections are in place
    while identifying penalties for lapses in procedures and processes.


    One of the major differentiators between contracted and regulated privacy data
    is in breach reporting. A data breach of regulated data (or unintentional loss
    of confidentiality of data through theft or negligence) is covered by myriad state
    and federal laws in the United States. There are now data privacy laws covering
    PII in all 50 states, with legislative changes happening every year. Some states
    have financial penalties of as little as $500 for data privacy violations, while
    others have fines in the hundreds of thousands of dollars as well as prison time
    for company officers. The largest state fine for a data privacy breach was handed
    to Uber for a 2016 breach and totaled over $148 million dollars in fines to the
    state of California.


    # Components of a Contract


    As we have detailed, the outsourcing of services to a cloud service provider in
    no way outsources the risk to the company as the data owner. A CCSP must be familiar
    with key concepts when contracting with cloud service providers to ensure that
    both parties understand the scope and provisions when private data is concerned.
    Key contract areas include the following:


    +   - **Scope of data processing:** The provider must have a clear definition
    of the permitted forms of data processing. For example, data collected on user
    interactions for a cloud customer should not be used by the CSP to inform new
    interface designs.

    +   - **Subcontractors:** It is important to know exactly where all processing,
    transmission, storage, and use of data will take place and whether any part of
    the process might be undertaken by a subcontractor to the cloud service provider.
    If a subcontractor will be used in any phase of data handling, it is vital that
    the customer is contractually informed of this development.

    +   - **Deletion of data:** How data is to be removed or deleted from a cloud
    service provider is important and helps protect against unintentional data disclosure.
    In the old days, data was often physically destroyed (with a screwdriver through
    a hard drive). In the cloud environment, that is next to impossible, so contracts
    must spell out the methods that data is to be securely removed from any environment
    (and subcontractor environment). One example is cryptoshredding, or rendering
    data inaccessible by cryptographic methods.

    +   - **Data security controls:** If data requires a level of security controls
    when it is processed, stored, or transmitted, that same level of security control
    must be ensured'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'in a contract with a cloud service provider. Ideally, the level of data security
    controls would exceed what is required (as is often the case for cloud service
    providers). Typical security controls include encryption of data while in transit
    and while at rest, access control and auditing, layered security approaches, and
    defense-in-depth measures.


    +   - **Physical location of data:** Knowledge of the physical location of where
    data is stored and processed (and, in some cases, transferred) is vital to ensure
    compliance with legal and regulatory requirements. Contractually indicating what
    geographic locations are acceptable for data storage and processing (and failover/backup)
    can protect a company from falling victim to unintended legal consequences. In
    addition to the location of the data, it is important to consider the location
    of the cloud service provider’s offices and the offices of any subcontractors
    in use.

    +   - **Return or surrender of data:** How does one break up with a cloud service
    provider? They know a lot about you, and they have your data. It is important
    to include in any contract the termination agreements, which should specify how
    and how quickly data is to be returned to the data owner. In addition, the contract
    should outline how returned data is ensured to be removed from the cloud service
    provider’s infrastructure. Cloud data destruction standards should be identified
    when entering into a contract to ensure that methods are standardized and documented
    when data is returned or destroyed.

    +   - **Audits:** Right to audit clauses should be included to allow a data owner
    or an independent consultant to audit compliance to any of the areas identified
    earlier. In practice, most CSPs will agree to be bound by standardized audit reports
    such as SOC 2 or ISO 27001, and most contracts specify the frequency that these
    reports must be produced.


    # Country-Specific Legislation Related to Private Data


    If by now you’re sensing a theme that data privacy is a complicated problem, it’s
    about to get reinforced. An individual’s right to privacy (and therefore their
    right to have their data handled in a secure and confidential way) varies widely
    by country and culture. As a result, the statutory and regulatory obligations
    around data privacy are vastly different depending on the citizenship of a data
    subject, the location of data being stored, the jurisdiction of the data processor,
    and even multinational agreements in place that may require data disclosure to
    government entities upon request.


    There are many different attitudes and expectations of privacy in countries around
    the world. In some more authoritarian regimes, the data privacy rights of the
    individual are almost nonexistent. In other societies, data privacy is considered
    a fundamental right. Let’s take a look around the world to examine some of the
    differences in data privacy around the globe.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# The European Union (GDPR)


    The 27-member EU serves as the bellwether for personal privacy in the developed
    world. The right to personal and data privacy is relatively heavily regulated
    and actively enforced in Europe, and it is enshrined into European law in many
    ways. In Article 8 of the European Convention on Human Rights (ECHR), a person
    has a right to a “private and family life, his home and his correspondence,” with
    some exceptions. Some additional types of private data under the GDPR include
    information such as race or ethnic origin, political affiliations or opinions,
    religious or philosophical beliefs, and information regarding a person’s sex life
    or sexual orientation.


    In the European Union, PII covers both facts and opinions about an individual.
    Individuals are guaranteed certain privacy rights as data subjects. Significant
    areas of Chapter 3 of the GDPR (see `gdpr.eu/tag/chapter-3`) include the following
    on data subject privacy rights:


    +   - The right to be informed

    +   - The right of access

    +   - The right to rectification

    +   - The right to erasure (the so-called “right to be forgotten”)

    +   - The right to restrict processing

    +   - The right to data portability

    +   - The right to object

    +   - Rights in relation to automated decision-making and profiling


    # Australia


    Australian privacy law was revamped in 2014, with an increased focus on the international
    transfer of PII. (See `www.oaic.gov.au/privacy/australian-privacy-principles.`)


    Current law in Australia, under the Australian Privacy Act, allows for the offshoring
    of data but requires the transferring entity (the data processor) to ensure that
    the receiver of the data holds and processes it in accordance with the principles
    of Australian privacy law. As discussed in the previous section, this is commonly
    achieved through contracts that require recipients to maintain or exceed privacy
    standards. An important consequence under Australian privacy law is that the entity
    transferring the data out of Australia remains responsible for any data breaches
    by or on behalf of the recipient entities, meaning significant potential liability
    for any company doing business in Australia under current rules.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# The United States


    Data privacy laws in the United States generally date back to fair information
    practice guidelines that were developed by the precursor to the Department of
    Health & Human Services (HHS). (See Ware, Willis H. (1973, August). “Records,
    Computers and the Rights of Citizens,” Rand. Retrieved from www.rand.org/content/dam/rand/pubs/papers/2008/P5077.pdf.)
    These principles include the following concepts:


    +   - For all data collected, there should be a stated purpose.

    +   - Information collected from an individual cannot be disclosed to other organizations
    or individuals unless specifically authorized by law or by consent of the individual.

    +   - Records kept on an individual should be accurate and up-to-date.

    +   - There should be mechanisms for individuals to review data about them, to
    ensure accuracy. This may include periodic reporting.

    +   - Data should be deleted when it is no longer needed for the stated purpose.

    +   - Transmission of personal information to locations where “equivalent” personal
    data protection cannot be assured is prohibited.

    +   - Some data is too sensitive to be collected unless there are extreme circumstances
    (such as sexual orientation or religion).


    Perhaps the defining feature of U.S. data privacy law is its fragmentation. There
    is no overarching law regulating data protection in the United States. In fact,
    the word privacy is not included in the U.S. Constitution. However, there are
    now data privacy laws in each of the 50 states as well as U.S. territories.


    There are few restrictions on the transfer of PII or PHI out of the United States,
    a fact that makes it relatively easy for companies to engage cloud providers and
    store data in other countries. The Federal Trade Commission (FTC) and other regulatory
    bodies do hold companies accountable to U.S. laws and regulations for data after
    it leaves the physical jurisdiction of the United States. U.S.-regulated companies
    are liable for the following:


    +   - Personal data exported out of the United States

    +   - Processing of personal data by subcontractors based overseas

    +   - Projections of data by subcontractors when it leaves the United States


    Several important international agreements and U.S. federal statutes deal with
    PII. The Privacy Shield agreement is a framework that regulates the transatlantic
    movement of PII for commercial purposes between the United States and the European
    Union. Federal laws worth review include HIPAA, GLBA, SOX, and the Stored Communications
    Act, all of which impact how the United States regulates privacy and data. At
    the state level, it is worth reviewing the California Consumer Protection Act
    (CCPA), the strongest state privacy law in the nation.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Privacy Shield


    Unlike the GDPR, which is a set of regulations that affect companies doing business
    in the EU or with citizens of the EU, Privacy Shield is an international agreement
    between the United States and the European Union that allows the transfer of personal
    data from the European Economic Area (EEA) to the United States by US-based companies.
    (See www.impact-advisors.com/security/eu-us-privacy-shield-framework/ and iapp.org/media/pdf/resource_center/Comparison-of-Privacy-Shield-and-the-Controller-Processor-Model.pdf.)
    This agreement replaced the previous safe harbor agreements, which were invalidated
    by the European court of justice in October 2015. The Privacy Shield agreement
    is currently facing legal challenge in European Union courts as of July 2020.
    Adherence to Privacy Shield does not make U.S. companies GDPR-compliant. Rather,
    it allows the company to transfer personal data out of the EEA into infrastructure
    hosted in the United States.


    To transfer data from the EEA, U.S. organizations can self-certify to the Department
    of Commerce and publicly commit to comply with the seven principles of the agreement.
    Those seven principles are as follows:


    +   - **Notice:** Organizations must publish privacy notices containing specific
    information about their participation in the Privacy Shield Framework; their privacy
    practices; and EU residents’ data use, collection, and sharing with third parties.

    +   - **Choice:** Organizations must provide a mechanism for individuals to opt
    out of having personal information disclosed to a third party or used for a different
    purpose than that for which it was provided. Opt-in consent is required for sharing
    sensitive information with a third party or its use for a new purpose.

    +   - **Accountability for onward transfer:** Organizations must enter into contracts
    with third parties or agents who will process personal data for and on behalf
    of the organization, which require them to process or transfer personal data in
    a manner consistent with the Privacy Shield principles.

    +   - **Security:** Organizations must take reasonable and appropriate measures
    to protect personal data from loss, misuse, unauthorized access, disclosure, alteration,
    and destruction, while accounting for risks involved and nature of the personal
    data.

    +   - **Data integrity and purpose limitation:** Organizations must take reasonable
    steps to limit processing to the purposes for which it was collected and ensure
    that personal data is accurate, complete, and current.

    +   - **Access:** Organizations must provide a method by which the data subjects
    can request access to and correct, amend, or delete information the organization
    holds about them.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '+   - **Recourse, enforcement, and liability:** This principle addresses the
    recourse for individuals affected by noncompliance, consequences to organizations
    for non-compliance, and compliance verification.


    # The Health Insurance Portability and Accountability Act of 1996


    The HIPAA legislation of 1996 defined what comprises personal health information,
    mandated national standards for electronic health record keeping, and established
    national identifiers for providers, insurers, and employers. Under HIPAA, PHI
    may be stored by cloud service providers provided that the data is protected in
    adequate ways.


    # The Gramm–Leach–Bliley Act (GLBA) of 1999


    This U.S. federal law requires financial institutions to explain how they share
    and protect their customers’ private information. GLBA is widely considered one
    of the most robust federal information privacy and security laws. This act consists
    of three main sections:


    +   - The Financial Privacy Rule, which regulates the collection and disclosure
    of private financial information

    +   - The Safeguards Rule, which stipulates that financial institutions must implement
    security programs to protect such information

    +   - The Pretexting provisions, which prohibit the practice of pretexting (accessing
    private information using false pretenses)


    The act also requires financial institutions to give customers written privacy
    notices that explain their information-sharing practices. GLBA explicitly identifies
    security measures such as access controls, encryption, segmentation of duties,
    monitoring, training, and testing of security controls.


    # The Stored Communication Act of 1986


    The Stored Communication Act (SCA), as enacted as Title II of the Electronic Communication
    Privacy Act, created privacy protection for electronic communications (such as
    email or other digital communications) stored on the Internet. In many ways, this
    act extends the Fourth Amendment of the U.S. Constitution—the people’s right,
    to be “secure in their persons, houses, papers, and effects, against unreasonable
    searches and seizures”—to the electronic landscape. It outlines that private data
    is protected from unauthorized access or interception (by private parties or the
    government).


    # The California Consumer Privacy Act of 2018


    It may seem odd to talk about a state privacy law in the context of international
    privacy protection, but the California Consumer Privacy Act (CCPA) is at present
    the strongest'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'data privacy law in the United States. The act is intended to protect within
    state law the rights of a California citizen to the following:


    +   - Know what personal data is being collected about them

    +   - Know whether their personal data is sold or disclosed and to whom

    +   - Opt out of the sale of personal data

    +   - Access their personal data

    +   - Request a business to delete any personal information about a consumer collected
    (the right to be forgotten)

    +   - Be protected from discrimination (by service or price) for exercising their
    privacy rights


    The CCPA outlines what entities need to comply with the law, the responsibility
    and accountability of the law’s provisions, and the sanctions and fines that may
    be levied for violations of the law. Those fines can vary between $100 to $750
    per consumer per data incident (or actual damages, whichever is greater), which
    makes the CCPA the most stringent privacy law in the United States.


    # Jurisdictional Differences in Data Privacy


    As you have seen, this small review of different locations, jurisdictions, and
    legal requirements for the protection of private data demonstrates the challenge
    of maintaining compliance while using global cloud computing resources. Different
    laws and regulations may apply depending on the location of the data subject,
    the data collector, the cloud service provider, subcontractors processing data,
    and the company headquarters of any of the entities involved. A CCSP should always
    be aware of the issues in these areas and consult with legal professionals during
    the construction of any cloud-based services contract.


    Legal concerns can prevent the utilization of a cloud services provider, add to
    costs and time to market, and significantly complicate the technical architectures
    required to deliver services. Nevertheless, it is vital to never replace compliance
    with convenience when evaluating services. In 2020, the video conferencing service
    Zoom was found to be engaged in the practice of routing video calls through servers
    in China in instances when no call participants were based there. This revelation
    caused an uproar throughout the user community and led to the abandonment of the
    platform by many customers out of privacy concerns. (See www.theguardian.com/uk-news/2020/apr/24/uk-government-told-not-to-use-zoom-because-of-china-fears.)
    In this example, customers abandoned the platform in large numbers because their
    data would certainly not enjoy the same privacy protections within China as would
    be expected in most liberal democracies.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Standard Privacy Requirements


    With so many concerns and potential harm from privacy violations, entrusting data
    to any cloud provider can be daunting for many companies. Fortunately, there are
    industry standards in place that address the privacy aspects of cloud computing
    for customers. International organizations such as ISO/IEC have codified privacy
    controls for the cloud. ISO 27018 was published in July 2014, as a component of
    the ISO 27001 standard and was most recently updated in 2019. A CCSP can use the
    certification of ISO 27000 compliance as assurance of adherence to key privacy
    principles. Major cloud service providers such as Microsoft, Google, and Amazon
    maintain ISO 27000 compliance, which include the following key principles:


    +   - **Consent:** Personal data obtained by a CSP may not be used for marketing
    purposes unless expressly permitted by the data subject. A customer should be
    permitted to use a service without requiring this consent.

    +   - **Control:** Customers shall have explicit control of their own data and
    how that data is used by the CSP.

    +   - **Transparency:** CSPs must inform customers of where their data resides
    and any subcontractors that might process personal data.

    +   - **Communication:** Auditing should be in place, and any incidents should
    be communicated to customers.

    +   - **Audit:** Companies must subject themselves to an independent audit on
    an annual basis.


    Privacy requirements outlined by ISO 27018 enable cloud customers to trust their
    providers. A CCSP should look for ISO 27018 compliance in any potential provider
    of cloud services.


    # Generally Accepted Privacy Principles


    Generally Accepted Privacy Principles (GAPP) consists of 10 principles for privacy
    from the American Institute of Certified Public Accountants (AICPA). (See www.aicpa.org/content/dam/aicpa/interestareas/informationtechnology/resources/privacy/downloadabledocuments/10252-346-records-management-pro.pdf.)
    The GAPP is a strong set of standards for the appropriate protection and management
    of personal data. The 10 main privacy principle groups consist of the following:


    +   - **Management:** The organization defines, documents, communicates, and assigns
    accountability for its privacy policies and procedures.

    +   - **Notice:** The organization provides notice of its privacy policies and
    procedures. The organization identifies the purposes for which personal information
    is collected, used, and retained.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '+   - **Choice and consent:** The organization describes the choices available
    to the individual. The organization secures implicit or explicit consent regarding
    the collection, use, and disclosure of the personal data.

    +   - **Collection:** Personal information is collected only for the purposes
    identified in the notice (see “Notice,” earlier in the list).

    +   - **Use, retention, and disposal:** The personal information is limited to
    the purposes identified in the notice the individual consented to. The organization
    retains the personal information only for as long as needed to fulfill the purposes
    or as required by law. After this period, the information is disposed of appropriately
    and permanently.

    +   - **Access:** The organization provides individuals with access to their personal
    information for review or update.

    +   - **Disclosure to third parties:** Personal information is disclosed to third
    parties only for the identified purposes and with implicit or explicit consent
    of the individual.

    +   - **Security for privacy:** Personal information is protected against both
    physical and logical unauthorized access.

    +   - **Quality:** The organization maintains accurate, complete, and relevant
    personal information that is necessary for the purposes identified.

    +   - **Monitoring and enforcement:** The organization monitors compliance with
    its privacy policies and procedures. It also has procedures in place to address
    privacy-related complaints and disputes.


    # Standard Privacy Rights Under GDPR


    In the EU, the GDPR codifies specific rights of the data subject that must be
    adhered to by any collector or processor of data. These rights are outlined in
    Chapter 3 of the GDPR (Rights of the Data Subject) and consist of 12 articles
    detailing those rights:


    +   - Transparent information, communication, and modalities for the exercise
    of the rights of the data subject

    +   - Information to be provided where personal data are collected from the data
    subject

    +   - Information to be provided where personal data have not been obtained from
    the data subject

    +   - Right of access by the data subject

    +   - Right to rectification

    +   - Right to erasure (“right to be forgotten”)'
  merge: -1
  img_proc: true
