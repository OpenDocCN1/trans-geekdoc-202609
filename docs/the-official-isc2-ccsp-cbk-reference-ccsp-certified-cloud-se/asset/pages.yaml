- pgno: 15
  md: '# Foreword to the Third Edition


    ![](img/31b2d0f6902e5b79691e4de3b480b89a_15_0.png)


    EARNING THE GLOBALLY RECOGNIZED CCSP® cloud security certification is a proven
    way to build your career and better secure critical assets in the cloud. Whether
    you are picking up this book to supplement your preparation to sit for the exam
    or you are an existing CCSP using this as a desk reference, you''ll find the Official
    (ISC)² Guide to the CCSP CBK to be the perfect primer on the cloud security topics
    covered in the CCSP CBK.


    Cloud computing security is one of the most in-demand skillsets in IT today. The
    designation of CCSP instantly communicates to everyone within our industry that
    you have the advanced technical skills and knowledge to design, manage, and secure
    data, applications, and infrastructure in the cloud using best practices, policies,
    and procedures established by the cybersecurity experts at (ISC)².


    The recognized leader in the field of information security education and certification,
    (ISC)² promotes the development of information security professionals throughout
    the world. As a CCSP with all the benefits of (ISC)² membership, you are part
    of a global network of more than 157,000 certified professionals who are working
    to inspire a safe and secure cyber world.


    Drawing from a comprehensive, up-to-date global body of knowledge, the CCSP CBK
    provides you with valuable insights on how to implement cloud security across
    different digital platforms that your organization may be using.


    If you are an experienced CCSP, you will find this edition of the CCSP CBK to
    be an indispensable reference on best practices. If you are still gaining the
    experience and knowledge you need to join the ranks of CCSPs, the CCSP CBK is
    a deep dive that can be used to supplement your studies.


    As the largest nonprofit membership body of certified information security professionals
    worldwide, (ISC)² recognizes the need to identify and validate not only information
    security competency, but also the ability to connect knowledge of several cloud
    security domains when managing or migrating data to and from the cloud. The CCSP
    represents advanced knowledge and competency in cloud security architecture, design,
    operations, and service orchestration.


    The opportunity has never been greater for dedicated professionals to carve out
    a meaningful career and make a difference in their organizations. The CCSP CBK
    will be your'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'constant companion in protecting and securing the critical data assets of your
    organiza- tion that will serve you for years to come.


    Sincerely,


