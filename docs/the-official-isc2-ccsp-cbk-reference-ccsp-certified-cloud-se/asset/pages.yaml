- pgno: 286
  md: '# Risk Profile


    A company’s risk profile generally comprises two factors. The first is a quantitative
    measure of the types of threats that an organization faces. This can vary widely
    by company and business sector, as a financial company can face very different
    risks than a landscaping provider. The second factor is the company’s willingness
    to accept risk (risk tolerance). In mature companies, this can be represented
    as a numerical value to help quantify the calculations. Combining these with potential
    costs associated with the occurrence of each risk can provide a nonsubjective
    profile of risk.


    A risk profile can help a company identify the level of risks that it is willing
    to accept. This profile is developed collaboratively with numerous stakeholders
    throughout the organization, such as business leaders, data owners, enterprise
    risk management, internal and external audit, legal, and compliance officers.


    # Risk Appetite


    Risk appetite is just what it sounds like: the appetite a company has to accept
    risk. Every company is different in this arena, and it is directly affected by
    regulations and statutory requirements in a particular industry. The risk appetite
    of a company may be significantly larger if their success depends largely on time-to-market.
    They may be willing to accept larger risks in the cloud computing arena to achieve
    scalability or utilize cloud technologies to reach consumers in more geographic
    areas.


    # Differences Between Data Owner/Controller vs. Data Custodian/Processor


    An important distinction in data is the difference between the data owner (data
    controller) and the data custodian (data processor). Let’s start with some definitions:


    +   - The data subject is the individual or entity that is the subject of the
    personal data.

    +   - The data controller is the person (or company) that determines the purposes
    for which, and the way in which, personal data is processed.

    +   - The data processor is anyone who processes personal data on behalf of the
    data controller.


    For example, let’s say a company that sells avocados takes personal data online
    to fulfill orders. They use cloud service provider AWS to host their website,
    and online payment vendor PayPal to process their transactions. In this case,
    any customer is the data subject, the avocado company is the data controller,
    and both AWS and PayPal are data processors (as they both process personal data
    on behalf of the avocado company).


    The distinctions are important for regulatory and legal reasons. Data processors
    are responsible for the safe and private custody, transport, and storage of data
    according to'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'business agreements. Data owners are legally responsible (and liable) for the
    safety and privacy of the data under most international laws.


    # Regulatory Transparency Requirements


    A cloud security professional should be aware of the transparency requirements
    imposed on data controllers by various regulations in the United States and internationally.
    The following is a short (and inexhaustive) description of some of the transparency
    requirements companies should consider as data owners.


    # Breach Notifications


    As detailed earlier in this section, notification of data breaches is required
    by all 50 states, several federal statutes, and numerous international laws. In
    practice, nearly every human on the planet is familiar with these laws because
    they have been notified by numerous companies about the loss of their private
    data. In all cases (including cloud computing environments), the data controller
    is responsible under the law for notifying the appropriate authorities as well
    as the data subject of the loss of their personal data. Many states and international
    laws have timely notification requirements that companies must fulfill when personal
    data is lost.


    # Sarbanes–Oxley Act


    If a company is publicly traded in the United States, they are subject to transparency
    requirements under the Sarbanes-Oxley Act (SOX) of 2002. Specifically, as data
    owners, these companies should consider the following:


    +   - **Section 802:** It is a crime to destroy, change, or hide documents to
    prevent their use in official legal processes.

    +   - **Section 804:** Companies must keep audit-related records for a minimum
    of five years.


    SOX compliance is often an issue with both data breaches and ransomware incidents
    at publicly traded companies. The loss of data related to compliance due to external
    actors does not protect a company from legal obligations.


    # GDPR and Transparency


    For companies doing business in the European Union or with citizens of the EU,
    transparency requirements under the GDPR are laid out in Article 12 (see gdpr-info.eu/art-12-gdpr).
    The exact language states that a data controller (data owner) “must be able to
    demonstrate that personal data are processed in a manner transparent to the data
    subject.” The obligations for transparency begin at the data collection stage
    and apply “throughout the life cycle of processing.”'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'The GDPR stipulates that communication to data subjects must be “concise, transparent,
    intelligible and easily accessible, and use clear and plain language.” The methods
    of communication are also clearly defined. Information must be provided to the
    data subjects “in writing, or by electronic means” or orally upon request. All
    of this information must be provided free of charge and not be conditional upon
    the purchase of a service or the surrender of information.


    In practical terms, this means that plain language must be used to explain why
    data is being collected and what it is being used for. Similar language is included
    in some current (CCPA) and forthcoming state regulations.


    # Risk Treatment


    According to its definition, risk treatment is “the process of selecting and implementing
    of measures to modify risk.” Risk treatment measures can include avoiding, modifying,
    sharing, or retaining risk. The risk treatment measures can be selected out of
    security controls that are used within a company’s information security management
    system (ISMS).


    Mitigation of risks will reduce either the potential exposure to a risk or the
    impact of a risk. If a risk is avoided, an organisation outside the EU may choose
    to stop, postpone, or cancel activities that present that risk. For example, a
    company can avoid the risk of a GDPR prosecution by not processing personal data
    of subjects who are in the EU. If a risk is modified, a company may work to reduce
    the effect that risk would have on a company (for example, defense-in-depth strategies
    to protect against data loss) or the likelihood of it occurring. Sharing a risk
    is the classic use case of insurance. By purchasing cyber-breach insurance, a
    company is sharing the risk with all of the customers facing the same risk. Retaining
    a risk is accepting the risk as part of the process of doing business.


    Many of the strategies detailed in this chapter (such as controls, audits, compliance,
    etc.) are at their core about risk treatment. Cloud security, like all information
    security, is essentially about managing risk. In no scenario will risk treatment
    reduce a company’s risks to zero. There is inherent risk in any business activity,
    and the risks retained by a company are referred to as residual risk.


    # Risk Frameworks


    There are a number of risk frameworks that a company may use to help manage risk
    in their organization. Risk management is a business process that can affect all
    aspects of an enterprise. In the cloud computing arena, a cloud security professional
    should be familiar with the ISO 31000:2018 guidance standard, the European Network
    and Information Security Agency (ENISA)’s cloud computing risk assessment tool,
    and NIST standards such as 800-146 (cloud computing synopsis and recommendation)
    and 800-37 (risk management framework for information systems).'
  merge: -1
  img_proc: true
