- pgno: 233
  md: 'CSPs can likely justify the cost of robust SOC resources due to cost sharing
    among customers and the requirements those customers will impose. A small organization
    with only cloud-based architecture may decide to outsource their security operations
    and monitoring, as many services provide dedicated support for specific cloud
    platforms at a lower cost than building the same function internally. These are
    known as managed security services providers (MSSPs). Like most business decisions,
    this will be a trade-off between control and cost and should be made by business
    leaders with input from security practitioners. A CCSP should understand the cloud
    architecture and communicate any risks the organization might assume by utilizing
    a third-party SOC.


    # Monitoring of Security Controls


    Monitoring of security controls used to be an activity closely related to formal
    audits that occur relatively infrequently, sometimes once a year or even once
    every three years. A newer concept is known as *continuous monitoring*, which
    is described in the NIST SP 800-37 Risk Management Framework (RMF) as “Maintaining
    ongoing awareness to support organizational risk decisions.” Information that
    comes from an audit conducted more than a year ago is not ongoing awareness. Instead,
    the RMF specifies the creation of a continuous monitoring strategy for getting
    near real-time risk information.


    Real-time or near real-time information regarding security controls comprises
    two key elements: the status of the controls and any alerts or actionable information
    they have created. Network resources are at risk of attacks, so network security
    controls like IDS are deployed. Continuous monitoring of the IDS’s uptime is critical
    to ensure that risk is being adequately mitigated. A facility to view any alerts
    generated by the device, as well as personnel and processes to respond to them,
    is also crucial to the organization’s goal of mitigating security risks; if the
    IDS identifies malicious network activity but no action is taken to stop it, the
    control is not effective.


    A longer-term concern for monitoring security controls and risk management is
    the suitability of the current set of tools. As organizations evolve, their infrastructure
    will likely change, which can render existing tools ineffective. The SOC should
    be charged with ensuring it can monitor the organization’s current technology
    stack, and a representative should be part of change management or change control
    processes. Migrating a business system from on-prem hosting to a SaaS model will
    likely have a security impact with regard to the tools needed to monitor it, and
    the change board should ensure this risk is planned for as part of the change.


    In general, the SOC should have some monitoring capabilities across all physical
    and logical infrastructure, though detailed monitoring of some systems may be
    performed by another group. For example, a physical access control system dashboard
    may be best monitored by security guards who can perform appropriate investigation
    if an alarm is'
