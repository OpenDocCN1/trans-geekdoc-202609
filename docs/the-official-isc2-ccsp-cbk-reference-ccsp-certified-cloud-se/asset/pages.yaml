- pgno: 282
  md: 'The benefits of the cloud can quickly and easily move beyond just the financial
    for many companies. The prevalence of distributed workforces, reliability and
    scalability, worldwide delivery of services, and backup and recovery possibilities
    are just a few benefits that have driven cloud adoption across countless industries.
    For those reasons, the emphasis and appetite to move to cloud computing may come
    from many different areas within a company. It is important to coordinate communication
    across the many departments that may be affected by cloud projects.


    # Specialized Compliance Requirements for Highly Regulated Industries


    As we have detailed numerous times in this reference book, the responsibility
    for compliance to any relevant regulations ultimately rests with the company (not
    the cloud service provider). This is true for companies that fall under additional
    regulation (such as HIPAA for healthcare providers, PCI for credit card processors,
    GLBA for public financial companies, and North American Electric Reliability Corporation
    Critical Infrastructure Protection [NERC/CIP] for critical infrastructure providers
    such as power or water utilities). In some cases, these specialized requirements
    will make leveraging the cloud more difficult. Companies should always identify
    any geographic or jurisdiction-specific regulations (such as HIPAA, which might
    require PHI to be physically kept within the United States) and factor them into
    any cloud computing evaluation. Additionally, special scrutiny should be applied
    to cloud service providers when regulations demand levels of reliability above
    and beyond typical industry standards.


    # Impact of Distributed Information Technology Models


    Distributed information technology (IT) models are become increasingly common
    as interconnected services are more easily provided from global suppliers. One
    example of a distributed model is the outsourcing of services such as network
    operation centers to third parties across the globe. In many ways, cloud computing
    makes distributed IT much simpler, as the cloud can provide services to IT across
    countries and continents without costly on-premises data center connections and
    associated hardware and personnel.


    A cloud security professional should be aware of common issues caused by distributed
    IT models and how to mitigate them.


    # Communications


    In a traditional IT model, teams are generally familiar with what roles and functions
    are filled by different personnel. Depending on the company, they may be on a
    first-name basis (and might play on the company softball team together). Distributed
    IT means that these roles and functions may be separated geographically and all
    correspondence takes place via technology.'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'In some cases, less formal processes (for example, “I call Jim in networks
    when I need to have a Client Access License [CAL] added to the system”) move to
    more structured interactions using standardized processes (for example, “I submitted
    a ticket in service now for a new CAL to be provisioned”).


    From a security perspective, this is considered an improvement, despite the potential
    business impacts caused by increased effort to get IT functions accomplished quickly.
    Using formalized ticketing systems and processes means that changes are far more
    likely to be recorded, adding to the overall adherence to change management controls.


    # Coordination of Activities


    Technology project management is a key component to the success of any IT department.
    Successful PMs oversee the implementation of hardware and software projects using
    project management methods and expertise that is a key skillset within any company,
    especially in an IT organization.


    The specialized nature of distributed IT models (and cloud services offerings)
    makes it less likely that an organization will have personnel in house with the
    specialized knowledge required to successfully implement projects. For this reason,
    it is important to consider bringing in outside experts for implementation projects.
    This common practice gives the distinct advantage of having subject-matter experts
    involved in the rollout or deployment of a new service or offering. In addition,
    this relieves some of the burden on an organization’s IT team in learning, coordinating,
    and provisioning new systems that they may be completely unfamiliar with. Consultant
    agreements generally allow a provider to deliver service to a customer’s requirements
    with sufficient accountability and oversight from company representatives.


    # Governance of Activities


    Effective governance can require additional steps in a distributed IT environment.
    When IT functions are dispersed across providers, countries, or continents, additional
    efforts may be needed to pull together information for program management, risk
    management, audit, compliance, and legal functions. Additionally, the distribution
    of these IT functions across jurisdictions where different statutory and regulatory
    issues may apply may increase the overall efforts needed to ensure effective governance.


    Selecting IT service providers that are effective and responsive in communication
    is key to establishing repeatable governance models. Many vendors specialize in
    the automation of information collection for governance purposes, which can help
    streamline the collection of information from distributed providers.


    Distributed IT models mean that effective governance will require the collection
    of information from multiple sources. Coordinating those efforts should include
    the up-front identification of how these processes will be managed to achieve
    the common goals of the organization.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# UNDERSTAND IMPLICATIONS OF CLOUD TO ENTERPRISE RISK MANAGEMENT


    If you compare how IT services were provisioned two decades ago to how they are
    done today, you would see a completely different landscape. In the dot-com era,
    provisioning systems took experts days or weeks to build out hardware, operating
    systems, and applications. Companies spent millions of dollars on physical hardware
    to support their computing efforts, wide area networks, and data centers. Today,
    anyone with a credit card (or even without one on free services) can provision
    a multitier web application in a few minutes. Services are spun up in seconds
    in some cases.


    This shift in how IT services is provisioned is not insignificant to organizational
    risk. In the past, the thought of “accidentally” provisioning a server in another
    country or legal jurisdiction was unthinkable (and most likely impossible). Today,
    it takes a few errant clicks from a cloud administrator to expose an organization
    to risks unthinkable two decades ago.


    It is vital that both the cloud customer and the cloud service provider understand
    risk and what strategies can be employed for risk mitigation. Risk must be accounted
    for in any migration to a cloud-based environment, and in some cases, the methods
    that a company has traditionally used to manage risk may need to evolve to reflect
    the realities of the cloud. In any case, it is vital for the cloud customer and
    the cloud provider to be aligned in policies and procedures as closely as possible
    in order to share the burden of risk management between them.


    # Assess Providers Risk Management Programs


    Prior to establishing a relationship with a cloud provider, a cloud customer needs
    to analyze the risks associated with the adoption of a cloud-based solution for
    a particular system and plan a strategy to mitigate and control those risks. There
    are several steps that a cloud customer should perform to assess the risk management
    capabilities (controls, methodologies, and practices) of any cloud service provider
    (see Figure 6.2). Those steps are outlined in NIST special publication 800-37
    Revision 2 (csrc.nist.gov/publications/detail/sp/800-37/rev-2/final) and include
    the following:


    +   - Performing a risk assessment

    +   - Identifying the best-fitting cloud architecture

    +   - Selecting the most suitable cloud service

    +   - Gaining necessary visibility into the cloud offering

    +   - Defining and negotiating necessary risk and risk control mitigations before
    finalizing the SLA and proceeding with the cloud migration'
  merge: -1
  img_proc: true
