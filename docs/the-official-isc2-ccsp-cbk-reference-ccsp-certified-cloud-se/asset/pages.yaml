    # Performance and Capacity Monitoring


    Monitoring is a critical concern for all parties in cloud computing. The CSP should
    implement monitoring to ensure they are able to meet customer demands and promised
    capacity, and consumers need to perform monitoring to ensure service providers
    are meeting their obligations and that the organization’s systems remain available
    for users.


    The majority of monitoring tasks will be in support of the availability objective,
    though indicators of an attack or misuse may be revealed as well, such as spikes
    in processor utilization that could be caused by cryptocurrency mining malware.
    Alerts should be generated based on established thresholds, and appropriate action
    plans initiated in the event of an event or disruption. Monitoring is not necessarily
    designed to detect incidents, however. It is also critical for CSPs to measure
    the amount of services being used by customers so they can be billed accurately.


    Infrastructure elements that should be monitored include the following:


    +   - **Network:** Cloud computing is, by design, accessible via networks, so
    it is essential to monitor their performance and availability. Bandwidth utilization,
    link state (up or down), and number of dropped packets are examples of metrics
    that might be captured.

    +   - **Compute:** Though traditionally defined as CPU utilization, often measured
    in cores or number of operations, compute can also include other forms of processing
    such as GPUs, field-programmable gate arrays (FPGA), or even service calls to
    an API or microservices architecture, where the service is billed based on the
    number of requests made.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '+   - **Storage and memory:** Data storage and memory are often measured in
    terms of total amount used, but other measures also exist such as number of reads
    and writes (input output operations, or IOPS), as well as speed of data access.
    Speed is a critical measure for many cloud services that are priced based on data
    retrieval, allowing cloud consumers to realize cost savings by storing infrequently
    needed data in a slower environment, while keeping essential data more quickly
    accessible in a more expensive environment.


    Regardless of what is being monitored and who performs it, adequate staffing is
    critical to make monitoring effective. Just as reviews make log files impactful,
    appropriate users of performance data are also essential. If a metric is captured
    but the cloud consumer never reviews it, they run the risk of a service being
    unavailable with no forewarning or paying for services that were not actually
    usable. CSPs also face risks of customers complaining, customers refusing to pay,
    and loss of reputation if their services are not routinely available.


    # Hardware Monitoring


    Although cloud computing relies heavily on virtualization, at some point physical
    hardware is necessary to provide all the services. Monitoring this physical hardware
    is essential, especially for availability as hardware failures can have an outsized
    impact in virtualization due to multiple VMs relying on a single set of hardware.


    Various tools exist to perform physical monitoring, and the choice will depend
    on the hardware being used as well as organizational business needs. Similar to
    capacity monitoring, all hardware under monitoring should have alert thresholds
    and response actions if a metric goes outside expected values, such as automated
    migration of VMs from faulty hardware or an alert to investigate and replace a
    faulty component. Hardware targets for monitoring may include the following:


    +   - **Compute hardware and supporting infrastructure:** The CPU, RAM, fans,
    disk drives, network gear, and other physical components of the infrastructure
    have operating tolerances related to heat and electricity. Monitoring these devices
    to ensure they are within tolerance is a critical aspect of ensuring availability;
    a CPU that overheats or a power supply that sends too much wattage can shorten
    the lifespan of a component or cause it to fail altogether. Fan speed can also
    be used as an indicator of workload; the harder a system is working, the more
    heat it produces, which causes fans to spin faster.


    Some devices also include built-in monitoring, such as hard drives that support
    self-monitoring, analysis, and reporting technology (SMART). SMART drives monitor
    a number of factors related to drive health and can identify when a failure is
    imminent. Many SSDs also provide reporting when a set number of sectors have failed,
    which means the drive is reaching the end of its useful life.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'Especially in large environments, storage tools like storage area networks
    (SAN) will include their own health and diagnostic tools; the information from
    these should be integrated into the organization’s continuous monitoring strategy.


    +   - **Environmental:** All computing components generate heat and are generally
    not designed for use in very wet environments or in direct contact with water.
    Monitoring environmental conditions including heat, humidity, and the presence
    of water can be critical to detecting issues early.


    The types of monitoring tools in use will depend on a number of factors. Many
    vendors of cloud-grade hardware such as SAN controllers or virtualization clusters
    include diagnostic and monitoring tools. The usefulness of these built-in tools
    may be limited if your organization’s measurement needs require data that is not
    captured, in which case a third-party tool may be required.


    In general, hardware monitoring will be the purview of the CSP and not the consumer,
    as the CSP is likely to retain physical control of hardware. Data center design
    and infrastructure management are entire fields of endeavor largely outside the
    scope of the CCSP, but it is obviously important for a CSP to have appropriately
    skilled team members. The Uptime Institute (uptimeinstitute.com/tiers) is one
    resource that provides guidance and education on designing and managing infrastructure;
    another is the International Data Center Authority (www.idc-a.org).


    # Configuration of Host and Guest Operating System Backup and Restore Functions


    There is a clear delineation of responsibility between the CSP and consumer when
    it comes to configuring, testing, and managing backup and restoration functions
    in cloud environments. In SaaS cloud models, the CSP retains full control over
    backup and restore and will often be governed by SLA commitments for restoration
    in the event of an incident or outage.


    In the PaaS model, there will be backup and restoration responsibilities for both
    the consumer and the CSP, especially for VMs. The CSP is responsible for maintaining
    backup and restoration of the host OS and any hypervisor software and for ensuring
    the availability of the system in line with agreed-upon service levels.


    Backup and recovery of individual VMs in IaaS are the responsibility of the consumers
    and may be done in a variety of ways. This might include full backups, snapshots,
    or definition files used for infrastructure as code deployments. Regardless of
    which backup method is utilized, a number of security considerations should be
    taken into account.


    +   - Sensitive data may be stored in backups, particularly in snapshot functions
    that do not support the same access controls or encryption as the OS they are
    created from. In this case, access to snapshots and need-to-know principles must
    be considered when designing the backup plan.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '+   - Snapshots and backups may be created on the same physical hardware as
    the running VMs, which violates a core principle of data backups: physical separation.
    As a best practice, these should be stored on different hardware (if possible)
    or in a different availability zone to ensure an incident affecting the main environment
    does not also impact the backup data.

    +   - Integrity of all backups should be verified routinely to ensure they are
    usable. Snapshots or backups should also be updated as system changes occur, especially
    patches or major configuration changes.


    Configuration of resiliency functions, such the use of automatic data replication,
    failover between availability zones offered by the CSP, or the use of network
    load balancing, will always be the responsibility of the consumer. The CSP is
    responsible to maintain the capabilities that enable these options, but the consumer
    must architect their cloud environment, infrastructure, and applications appropriately
    to meet their own resiliency objectives.


    # Network Security Controls


    Cloud environments are inherently network accessible, so the security of data
    in transit between the consumer and the CSP is a critical concern, with both parties
    sharing responsibility for architecting secure networks. CSPs must ensure that
    they adequately support the networks they are providing in the cloud service environment,
    and consumers are responsible, in some cloud service models, for architecting
    their own secure networks using a combination of their own tools and those provided
    by the CSP.


    One major concern related to network security is the ability of some tools to
    function in a cloud paradigm. The early days of virtualization brought challenges
    for many security tools that relied on capturing network traffic as it flowed
    across a switch; the devices were attached to a SPAN or mirror port on the switch
    and received a copy of all traffic for analysis. VMs running on the same physical
    host did not need to send traffic outside the host to communicate, rendering tools
    listening for traffic on a switch useless. Complex software-defined networks (SDNs)
    that can span multiple data centers around the world likely require more advanced
    solutions, and security practitioners must be aware of these challenges.


    # Firewalls


    Firewalls are most broadly defined as a security tool designed to isolate and
    control access between segments of a network, whether it is an internal network
    and the public Internet or even between environments such as an application with
    highly sensitive data and other internal apps. Firewalls operate by inspecting
    traffic and making a decision whether to forward the traffic (allow) or drop it
    (deny) and are often used to isolate or segment'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'networks by controlling what network traffic is allowed to flow between segments.
    There are a variety of firewall types.


    +   - **Static packet or stateless:** These are the original type of firewall,
    designed to inspect network packets and compare them against a ruleset. For example,
    the firewall might see TCP destination port 23 (Telnet) in a packet’s headers
    and decide to drop the packet since Telnet is an insecure protocol. Static firewalls
    operate quickly but can struggle with complex situations like voice over IP (VoIP)
    and videoconferencing where a call is initiated on one port, but the actual call
    traffic is exchanged on a different port negotiated for that communication session.

    +   - **Stateful:** These are an evolution of static firewalls and offer the ability
    for the firewall to understand some context regarding communication (known as
    a *state*). For example, the firewall might allow traffic on a random high-number
    port from a particular host if it had also seen previous traffic on port 20/21
    (FTP). Since FTP clients often negotiate a custom port to be used for a specific
    file transfer, this traffic makes sense in the context of previous traffic; without
    the previous traffic on port 20, the firewall would block the traffic on the high-number
    port. In this case, the firewall has more intelligence and flexibility to make
    decisions, but with a higher processing overhead and cost.

    +   - **Web application firewall (WAF) and API gateway:** These are a highly specialized
    form of network access control devices that are designed to handle specific types
    of traffic, unlike a generic firewall that can handle any network traffic. WAFs
    and API gateways allow for the analysis of traffic destined specifically for a
    web application or an application’s API and can be useful in detecting more complex
    attacks such as SQL injection, which could not be identified by looking at raw
    network traffic. These devices apply a set of rules to HTTP conversations and
    look for anomalous interactions with the application.

    +   - **Security groups:** In SDNs, it can be difficult or impossible to locate
    specific infrastructure elements of the network. For example, a globally load-balanced
    application may exist in several data centers all over the world, and it would
    be a headache to place firewalls at the edge of each data center’s network. Security
    groups (also called *network security groups*, or NSGs) are an abstraction layer
    that allows a consumer to define protections required, and the CSP’s infrastructure
    deploys appropriate virtualized resources as needed. In the previous example,
    a cloud consumer defines a set of allowed traffic for the application, and the
    CSP’s hardware and software will be configured uniquely for each data center to
    implement those rules. This is a similar concept to infrastructure as code, where
    hardware variations between data centers are abstracted and presented to the consumer
    in a virtual, self-serve manner.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '+   - **Next-generation firewalls (NGFW)**: Although more of a marketing term
    than a unique type of firewall, NGFWs combine multiple firewall functions into
    a single device, such as a stateful firewall and API gateway. Many NGFWs also
    include other network security protections such as intrusion detection or VPN
    services.


    Firewalls may be hardware appliances that would traditionally be deployed by the
    CSP, or virtual appliances that can be deployed by a cloud consumer as a VM. Host-based
    firewalls, which are software-based, are also often considered a best practice
    in a layered defense model. In the event a main network firewall fails, each host
    still has some protection from malicious traffic, though all devices obviously
    need to be properly configured.


    There are a number of cloud-specific considerations related to firewall deployment
    and configuration, such as the use of security groups for managing network-level
    traffic coupled with host-based firewalls to filter traffic to specific hosts.
    This approach is an example of *microsegmentation*, which amounts to controlling
    traffic on a granular basis—often at the level of a single host. In a cloud environment,
    an NSG might block traffic on specific ports from entering a DMZ, and then the
    host firewalls would further restrict traffic reaching a host based on ports or
    protocols. Traditional firewall rules may also be ineffective in a cloud environment,
    which necessitates these new approaches. In an auto-scaling environment, new hosts
    are brought online and dynamically assigned IP addresses. A traditional firewall
    would need its ruleset updated to allow traffic to these new hosts; otherwise,
    they will not be able to handle traffic at all. The newly created resources can
    be automatically placed into the proper security group with no additional configuration
    required.


    # Intrusion Detection/Intrusion Prevention Systems (IDS/IPS)


    As the name implies, an intrusion detection system (IDS) is designed to detect
    a system intrusion when it occurs. An intrusion prevention system (IPS) is a bit
    of a misnomer, however—it acts to limit damage once an intrusion has been detected.
    The goal in both cases is to limit the impact of an intrusion, either by alerting
    personnel to an intrusion so they can take remedial action or by automatically
    shutting down an attempted attack.


    An IDS is a passive device that analyzes traffic and generates an alert when traffic
    matching a pattern is detected, such as a large volume of unfinished TCP handshakes.
    IPS goes further by taking action to stop the attack, such as blocking traffic
    from the malicious host with a firewall rule, disabling a user account generating
    unwanted traffic, or even shutting down an application or server that has come
    under attack.


    Both IDS and IPS can be deployed in two ways, and the choice of deployment as
    well as location are critical to ensure the devices can see all traffic they require
    to be effective.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'A network-based intrusion detection system/ intrusion prevention system (NIDS/NIPS)
    sits on a network where it can observe all traffic and may often be deployed at
    a network''s perimeter for optimum visibility. Similar to firewalls, however,
    NIDS/NIPSs may be challenged in a virtualized environment where network traffic
    between VMs never crosses a switch. A host-based intrusion detection system/ intrusion
    prevention system (HIDS/HIPS) is deployed on a specific host to monitor traffic.
    While this helps overcome problems associated with invisible network traffic,
    the agents required introduce processing overhead, may require licensing costs,
    and may not be available for all platforms an organization is using.


    # Honeypots and Honeynets


    Honeypots and honeynets can be useful monitoring tools if used appropriately.
    They should be designed to detect or gather information about unauthorized attempts
    to gain access to data and information systems, often by appearing to be a valuable
    resource. In reality, they contain no sensitive data, but attackers attempting
    to access them may be distracted or deflected from high-value targets or give
    up information about themselves such as IP addresses.


    In most jurisdictions, there are significant legal issues concerning the use of
    honeypots or honeynets, centered around the concept of entrapment. This legal
    concept describes an agent inducing a person to commit a crime, which may be used
    as a defense by the perpetrator and render any attempt to prosecute them ineffective.
    It is therefore imperative that these devices never be set up with an explicit
    purpose of being attractive targets or designed to “catch the bad guys.”


    # Vulnerability Assessments


    Vulnerability assessments should be part of a broader vulnerability management
    program, with the goal of detecting vulnerabilities before an attacker finds them.
    Many organizations will have a regulatory or compliance obligation to conduct
    vulnerability assessments, which will dictate not only the schedule but also the
    form of the assessment.


    An organization with an annual PCI assessment requirement should be checking for
    required configurations and vulnerabilities related to credit cardholder data,
    while a medical organization should be checking for required protected health
    information controls and vulnerabilities.


    Vulnerability scanners are an often-used tool in conducting vulnerability assessments
    and can be configured to scan on a relatively frequent basis as a detective control.
    Human vulnerability assessments can also be utilized, such as an internal audit
    function or standard reviews like access and configuration management checks.
    Even a physical walkthrough of a facility to identify users who are not following
    clean desk or workstation'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'locking policies can uncover vulnerabilities, which should be treated as risks
    and remediated.


    A more advanced form of assessments an organization might conduct is penetration
    or pen testing, which typically involves a human tester attempting to exploit
    any vulnerabilities identified. Vulnerability scanners typically identify and
    report on software or configuration vulnerabilities, but it can be difficult to
    determine if a particular software vulnerability could actually be exploited in
    a complex environment. The use of vulnerability scanners and pen testers may be
    limited by your CSP’s terms of service, so a key concern for a CCSP is understanding
    the type and frequency of testing that is allowed.


    # Management Plane


    The management plane is mostly used by the CSP and provides virtual management
    options analogous to the physical administration options a legacy data center
    would provide, such as powering VMs on and off or provisioning virtual infrastructure
    for VMs such as RAM and storage. The management plane will also be the tool used
    by administrators for tasks such as migrating running VMs to different physical
    hardware before performing hardware maintenance.


    Because of the functionality it provides, the management plane requires appropriate
    logging, monitoring, and access controls, similar to the raised floor space in
    a data center or access to domain admin functions. Depending upon the virtualization
    toolset, the management plane may be used to perform patching and maintenance
    on the virtualization software itself. Functionality of the management plane is
    usually exposed through an API, which may be controlled by an administrator from
    a command line or via a graphical interface.


    A key concept related to the management plane is orchestration, or the automated
    configuration and management of resources. Rather than requiring an administrator
    to individually migrate VMs off a cluster before applying patches, the management
    plane can automate this process. The admin schedules a patch for deployment, and
    the software comprising the management plane coordinates moving all VMs off the
    cluster, preventing new VMs from being started, and then enters maintenance mode
    to apply the patches.


    The cloud management console is often confused with the cloud management plane,
    and in reality, they perform similar functions and may be closely related. The
    management console is usually a web-based console for use by the cloud consumer
    to provision and manage their cloud services, though it may also be exposed as
    an API that customers can utilize from other programs or a command line. It may
    utilize the management plane’s API for starting/stopping VMs or configuring VM
    resources such as RAM and network access, but it should not give a cloud consumer
    total control over'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'the entire CSP infrastructure. The management plane’s access controls must
    enforce minimum necessary authorization to ensure each consumer is able to manage
    their own infrastructure and not that of another customer.


    # IMPLEMENT OPERATIONAL CONTROLS AND STANDARDS


    IT service management (ITSM) frameworks consist of operational controls designed
    to help organizations design, implement, and improve IT operations in a consistent
    manner. They can be useful in speeding up IT delivery tasks, providing more consistent
    oversight, and are also critical to processes where elements of security risk
    management are implemented. Change management is one example; it helps the organization
    to maintain a consistent IT environment that meets user needs and also implements
    security controls such as a change control board where the security impact of
    changes can be adequately researched and addressed.


    The two standards that a CCSP should be familiar with include ISO 20000-1 (not
    to be confused with ISO 27001) and ITIL (formerly an acronym meaning Information
    Technology Infrastructure Library). Both frameworks focus on the process-driven
    aspects of delivering IT services to an organization, such as remote collaboration
    services, rather than focusing on just delivering IT systems like an Exchange
    server. In ITIL, the set of services available is called a *service catalog*,
    which includes all the services available to the organization.


    Both frameworks start with the need for policies to govern the ITSM processes,
    which should be documented, well understood by relevant members of the organization,
    and kept up-to-date to reflect changing needs and requirements. ISO 20000-1 and
    ITIL emphasize the need to deeply understand user needs and also focus on gathering
    feedback to deliver continuous service improvement. Stated another way, those
    in charge of IT services should have a close connection to the users of the IT
    system and strive to make continual improvements; in this regard, it is similar
    to the Agile development methodology.


    # Change Management


    Change management is concerned with keeping the organization operating effectively,
    even when changes are needed such as the modification of existing services, addition
    of new services, or retirement of old services. To do this, the organization must
    implement a proactive set of formal activities and processes to request, review,
    implement, and document all changes.'
  merge: -1
  img_proc: true
- pgno: 199
  md: "Many organizations utilize a ticketing system to document all steps required\
    \ for a change. The first step is initiation in the form of a change request,\
    \ which should capture details such as the purpose of the proposed change, the\
    \ owner, resources required, and any impacts that have been identified, such as\
    \ downtime required to implement the change or impacts to the organization’s risk\
    \ posture.\n\nThe change then goes for a review, often by a change control or\
    \ change advisory board (CCB or CAB). This review is designed to verify if the\
    \ proposed change offers business benefits/value appropriate to its associated\
    \ costs, understand the impact of the change and ensure it does not introduce\
    \ unacceptable levels of risk, and, ideally, confirm that the change has been\
    \ properly planned and can be reversed or rolled back in the event it is unsuccessful.\
    \ This step may involve testing and additional processes such as decision analysis,\
    \ and it may be iterated if the change board needs additional information from\
    \ the requestor.\n\nOnce a change has been approved, it is ready for the owner\
    \ to execute the appropriate plan to implement it. Since many changes will result\
    \ in the acquisition of new hardware, software, or IT services, there will be\
    \ a number of security concerns that operate concurrently with the change, including\
    \ acquisition security management, security testing, and the use of the organization’s\
    \ certification and accreditation process if the change is large enough. In the\
    \ event a change is not successful, fallback, rollback, or other restoration actions\
    \ need to be planned to prevent a loss of availability.\n\nNot all changes will\
    \ be treated the same, and many organizations will implement different procedures\
    \ based on categories of changes.\n\n+   - **Low-risk:** These are changes that\
    \ are considered unlikely to have a negative impact and are therefore pre-authorized\
    \ to reduce operational overhead. Examples include application of standard patches,\
    \ addition of standard assets to address capacity (for example, deploying a standard\
    \ server build to provide additional processing capability), or installation of\
    \ approved software that is not part of a standard baseline but is required for\
    \ a particular job function.\n+   - **Normal changes:** These changes require\
    \ the full change management request-review-implement process. They will typically\
    \ follow a routine schedule based on the meeting schedule of the change board.\n\
    \n> ### Automating Change Management\n> \n> In the case of a continuous integration/continuous\
    \ deployment (CI/CD) software development environment, change reviews may be automated\
    \ when new code is ready for deployment, particularly security testing such as\
    \ code analysis. The goal of this automation is to reduce operational overhead\
    \ while still adequately managing the risk associated with the change (in this\
    \ case, new software)."
  merge: -1
  img_proc: true
- pgno: 200
  md: '+   - **Emergency changes:** Things happen unexpectedly, and the process of
    requesting, testing, and receiving approval for a change may require too much
    time. For changes required to resolve an incident or critical security concern,
    formal procedures should be utilized to implement the change as needed to address
    the incident and document all details related to the change. Depending on the
    organization, a faster or less cumbersome change control decision process may
    be utilized; for example, only one CCB member approval is required, or the change
    may be reviewed and approved retroactively.


    # Continuity Management


    Continuity is concerned with the availability aspect of the CIA triad and is a
    critical consideration for both cloud customers and providers. Continuity management
    addresses the reality that, despite best efforts and mitigating activities, sometimes
    adverse events happen. How the organization responds should be planned and adequate
    resources identified prior to an incident, and the business continuity policy,
    plan(s), and other documentation should be readily available to support the organization’s
    members during an interruption.


    It is essential for both cloud customers and providers to do the following:


    +   - **Identify critical business functions and resources.** This is usually
    accomplished by conducting a business impact assessment (BIA), which assists the
    organization to understand its essential assets and processes. For a customer,
    this may be business-critical applications, while for the provider, it will be
    the infrastructure and other resources required to deliver the cloud services.
    The BIA is a structured method of identifying what impact a disruption of critical
    business functions poses to the organization, as well as the resources necessary
    to recover a minimum level of functionality.


    +   - **Prioritize recovery.** Not all systems or assets can be recovered all
    at once, so it is essential that the organization develop a prioritization of
    critical processes that are essential to the continued functioning of its operations
    and identify which assets are essential to those processes. The set of ordered
    steps should also be documented to ensure dependencies are documented and restored
    in the correct order; for example, that power to a facility is restored before
    any information systems can be operated in it.


    +   - **Plan continuity.** This will entail identifying continuity capabilities
    such as automated failovers, as well as understanding relevant cloud offerings
    and how they are to be used. In some cases, the cloud will function as a backup
    for an organization’s on-prem infrastructure, while in other cases, the cloud’s
    availability features will be utilized, such as different availability regions
    around the world,'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'automatic duplication of data to multiple sites, etc. The cloud customer is
    responsible for understanding the availability features of their chosen cloud
    provider and properly architecting their cloud applications to meet continuity
    requirements.


    +   - **Document plans and procedures.** Issues that cause a loss of availability
    are often high-stress situations, such as a natural disaster. In these instances,
    it is preferable to have employees working from a previously prepared set of instructions
    rather than trying to think and respond on-the-fly. Decision-makers and standard
    processes/tools may be unavailable, so appropriate alternatives should be documented.


    **NOTE** Training is also critical in high-stress continuity situations. Members
    with key responsibilities should receive training to ensure they are aware of
    what they need to do in an emergency, rather than trying to make crucial decisions
    under duress.


    There are a variety of standards related to continuity management; these may be
    useful to the organization in planning, testing, and preparing for contingency
    circumstances. Many legal and regulatory frameworks mandate the use of a particular
    standard depending on an organization’s industry or location. The CCSP should
    be aware of the relevant framework for their industry; the following are some
    key frameworks:


    +   - **NIST Risk Management Framework and ISO 27000:** Since both frameworks
    focus on information security concerns, both deal with business continuity and
    disaster recovery (BCDR), terms that fall under the larger category of *continuity
    management*. In the NIST framework, a family of controls called contingency planning
    are specified depending on the system’s risk profile, while the ISO 27002 framework
    specifies information security aspects of business continuity management.

    +   - **Health Insurance Portability and Accountability Act (HIPAA):** Healthcare
    data in the United States is governed by this standard, which mandates adequate
    data backups, disaster recovery planning, and emergency access to healthcare data
    in the event of a system interruption.

    +   - **ISO 22301:2019 Security and resilience — Business continuity management
    systems:** This specifies the requirements needed for an organization to plan,
    implement and operate, and continually improve the continuity capability. This
    includes adequate support from leadership within the organization, planning resources
    for managing continuity, and steps to implement/operate the program such as conducting
    a BIA, exercising contingency plans, and monitoring the capability’s effectiveness.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Information Security Management


    The goal of an information security management system (ISMS) is to ensure a coherent
    organizational approach to managing information security risks; stated another
    way, it is the overarching approach an organization takes to preserving the confidentiality,
    integrity, and availability (the CIA triad) of systems and data in use. The operational
    aspects of an ISMS include standard security risk management activities in the
    form of security controls such as encryption, as well as supporting business functions
    required for the organization to achieve risk management goals like formal support
    and buy-in from management, skills and training, and adequate oversight and performance
    evaluation.


    Various standards and frameworks exist to help organizations implement, manage,
    and, in some cases, audit or certify their ISMS. Most contain requirements to
    be met in order to support goals of the CIA triad, as well as best practices for
    implementation and guidance on proper use and operation of the framework. While
    many security control frameworks exist, not all are focused on the larger operational
    task of implementing an ISMS. Payment Card Industry Data Security Standard (PCI
    DSS), for example, focuses specifically on securing cardholder data that an organization
    is processing. Frameworks that focus on both security controls as well as the
    overall ISMS functions include the following:


    +   - **ISO 27000 series:** The ISO 27001 standard provides a set of requirements
    for an organization’s ISMS. It is often confused with ISO 27002, which is the
    code of practice for information security controls, due to the inclusion of the
    27002 set of controls as an appendix to 27001. The two are interrelated, because
    27001 sets out the high-level requirements an organization must meet to provide
    leadership for, plan, implement, and operate an ISMS.

    +   - ISO 27002 provides a set of controls and implementation guidance, broken
    down by domains such as Asset Management and Cryptography. 27001 and 27002 provide
    a road map for an organization to understand its security risk posture and implement
    appropriate security controls to mitigate and manage those risks.

    +   - There are additional ISO standards that provide guidance on implementing
    and managing security controls in cloud-specific environments. ISO 27017 is a
    “Code of practice for information security controls based on ISO/IEC 27002 for
    cloud services,” and ISO 27018 is a “Code of practice for protection of personally
    identifiable information (PII) in public clouds acting as PII processors.” Both
    documents enhance/extend the guidance offered in ISO 27002 controls to deal with
    particular security risk challenges in cloud implementation.'
  merge: -1
  img_proc: true
- pgno: 203
  md: "+   - ISO 27701 is also relevant to cloud security environments where personally\
    \ identifiable information (PII) is being handled. 27701 extends the ISMS guidance\
    \ in 27001 to manage risks related to privacy, by implementing and managing a\
    \ privacy information management system (PIMS). As many privacy regulations require\
    \ security controls and risk management, this standard will be relevant to a CCSP\
    \ whose organization acts as a data owner or processor.\n+   - **NIST RMF, SP\
    \ 800-53, and CSF:** Although it uses different terminology, the NIST Risk Management\
    \ Framework (RMF) specified in Special Publication (SP) 800-37, *Risk Management\
    \ Framework for Information Systems and Organizations: A System Life Cycle Approach\
    \ for Security and Privacy*, has the same objective as the ISO-defined ISMS: identifying\
    \ information security risks and applying adequate risk mitigations in the form\
    \ of security controls. SP 800-37 provides the guidance for creating the organization’s\
    \ risk management framework and points to NIST SP 800-53, *Security and Privacy\
    \ Controls for Federal Information Systems and Organizations*, for the control\
    \ requirements and implementation guidance.\n+   \n+   While the NIST RMF and\
    \ SP 800-53 standards are mandated for use in many parts of the U.S. federal government,\
    \ they are free to use for any organization. The NIST Cybersecurity Framework\
    \ (CSF) was originally designed to help private-sector critical infrastructure\
    \ providers design and implement information security programs; however, its free-to-use\
    \ and relatively lightweight approach have made it a popular ISMS tool for many\
    \ nongovernment organizations.\n+   - **AICPA SOC 2:** The Service Organization\
    \ Controls (SOC 2) framework has seen wide adoption among cloud service providers\
    \ for a variety of reasons, primarily the relatively lightweight approach it provides\
    \ as well as the use of a third party to perform audits, which provides increased\
    \ assurance for business partners and customers. While not as robust as the ISO\
    \ and NIST frameworks, SOC 2 contains Trust Services Criteria (TSC), which cover\
    \ organizational aspects including Security, Availability, Processing Integrity,\
    \ Confidentiality, and Privacy. The Common Criteria apply to all organizations\
    \ and contain similar requirements to other frameworks: executive support and\
    \ buy-in, assessment and treatment of risks, monitoring of controls, and implementation\
    \ guidance. The other TSCs such as Availability, may be implemented at the discretion\
    \ of the organization; typically, an organization’s service offering will drive\
    \ which TSCs are chosen.\n\n# Continual Service Improvement Management\n\nMost\
    \ ITSM models include some form of monitoring capability utilizing functions such\
    \ as internal audit, external audit and reporting, or the generation of security\
    \ metrics and"
