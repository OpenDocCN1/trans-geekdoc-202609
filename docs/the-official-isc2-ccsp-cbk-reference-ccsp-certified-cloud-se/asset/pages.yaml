- pgno: 149
  md: 'and operates within the architecture security strategy of the organization.
    The goal of this testing is to determine if the software is secure. Again, this
    is a confidence level as to the security of the software system developed prior
    to deployment.


    # Functional Testing


    Functional testing is used to test that the functional specifications of the system,
    linked to system requirements, are met. The execution of a robust set of test
    cases, linked to functional requirements, will create a level of confidence that
    the software operates as intended.


    There are many ways to test software. However, there are some common tests that
    are consistently used leading up to functional testing. The primary categories
    of testing that lead up to functional testing are unit testing, integration testing,
    and usability testing.


    +   - **Unit testing:** This is testing by a developer on modules being developed
    as part of a larger system. All paths through the module need to be tested.


    +   - **Integration testing:** As modules are combined, integration testing ensures
    that the modules work together. As additional modules are added, we get ever closer
    to functional testing.


    +   - **Usability testing:** This testing uses customers in a production-like
    environment to get feedback on the interaction between the user and the system.


    As the modules are tested and then are integrated (and tested) and the user’s
    feedback is obtained and incorporated into the system, we get to the point where
    we are ready to perform functional testing on the entire system. When conducting
    functional testing, there are important considerations that include the following:


    +   - **Testing must be realistic:** Many development shops have Dev, Test, Stage,
    and Prod environments. These environments are called *lanes* in some organizations.
    The Dev or development environment can be set up to suit the developers’ needs.
    However, for the greatest assurance, the Test and Stage environments should be
    set up as closely as possible to the Prod environment. In many cases, the Test
    and Stage environments will have live data or older copies of live data to ensure
    functional requirements are met. Once development is complete, the application
    moves to the Test environment for testing. Upon successful testing, the application
    will move to the Stage environment for configuration management and potentially
    additional testing. Once the next release cycle occurs, the software in the Stage
    environment moves into production. Any environment with live data (current or
    older) must be protected as well as the Prod environment to prevent data loss.


    +   - **Acceptance:** Testing must be sufficient to guarantee that the application
    service meets the requirements of the customer and the organization (sometimes
    they are the same). This means that testing must be designed to exercise all requirements.'
  merge: -1
  img_proc: true
