    Secure remote access is a top-level priority in many security frameworks due to
    the highly sensitive nature of operations it entails and its inherent exposure
    to attacks. Remote access often relies on untrusted network segments for transmitting
    data, and in a cloud environment, this will entail users connecting via the Internet.
    Physical controls that could prevent unwanted access in a data center will be
    largely missing in a cloud as well; not that the CSP is ignoring physical security
    controls, but the inherently network-accessible nature of the cloud means most
    administrative functions must be exposed and are therefore susceptible to network-based
    threats.


    There are a number of concerns that should be addressed to reduce the risk associated
    with remote access, including the following:


    +   - **Session encryption:** Remote access always requires additional security
    because it happens outside an organization’s perimeter, and cloud-based applications
    often do away with secure perimeters altogether. Data transmitted in remote access
    sessions must be encrypted using strong protocols such as TLS 1.3 and should implement
    cryptographic best practices such as session-specific cryptographic keys, which
    reduce the possibility of replay attacks.

    +   - **Strong authentication:** Users performing remote administration present
    higher risk to the organization, so more robust authentication is appropriate
    for these users. This may be combined with cryptographic controls such as a shared
    secret key for SSH, assuming the user retains control over their key, as well
    as the use of two or more authentication factors for multifactor authentication
    (MFA), such as a one-time code or hardware key.

    +   - **Separate privileged and nonprivileged accounts:** A general best practice
    for administrative users is the use of a dedicated admin account for sensitive
    functions, and a standard user account for normal functions such as daily web
    browsing or email. This approach offers two benefits: first, it reduces threats
    related to phishing by reducing the likelihood a user’s admin account credentials
    will be stolen, and second, it allows the organization to implement more stringent
    controls on the admin account without creating undue overhead for the user’s daily
    business account. In many cloud environments, this is implemented by default,
    as a user’s credentials to log in to the cloud admin console are separate from
    their main email or computer login.

