- pgno: 139
  md: '# OWASP Top 10


    The OWASP Top 10 (owasp.org) is a periodically updated list and features the top
    threats in web application security. The last version is from 2017, with the previous
    version in 2013. The top 10 security risks lead to a variety of issues that include
    data breach, data integrity, and DoS. Essentially, each item of the CIA triad
    can be affected by one or more of these risks. The following were the top four
    in 2017:


    +   - Injection flaws, including SQL, NoSQL, OS, and LDAP injection

    +   - Broken authentication

    +   - Sensitive data exposure

    +   - XML external entities


    The most disturbing thing about this list is that the items on the list rarely
    change. Sometimes all that changes is the order. For example, numbers 1 and 2
    in 2013 and numbers 1 and 2 in 2017 are the same. In four years, the top risks
    were unchanged. Number 3 in 2013 moved to number 7 in 2017, while number 6 became
    number 3.


    We know what the risks are. Organizations like the CSA and OWASP publish what
    the risks are. As expected, the overlap between the lists is high. Now, it is
    the responsibility of security professionals to address these risks.


    # DESCRIBE THE SECURE SOFTWARE

    DEVELOPMENT LIFECYCLE PROCESS


    The software development lifecycle (SDLC) has been understood for several years.
    The SSDLC enhances the SDLC process. The SDLC has several phases. These steps
    are Requirements, Design, Development, Testing, Deployment, and Operations and
    Maintenance (O&M). In the SSDLC, these phases are enhanced to include specific
    security-focused steps to allow security by design. There are many resources for
    implementing an SSDLC. These include the Microsoft SDL and the NIST SP 800-160,
    Systems Security Engineering. Two resources that this section will discuss are
    the NIST Secure Software Development Framework and the OWASP Software Assurance
    Maturity Model (SAMM). This section will also explore business requirements, phases,
    and methodologies related to the SSDLC.


    # NIST Secure Software Development Framework


    Similar to the popular NIST Cybersecurity Framework (CSF), the NIST Secure Software
    Development Framework (SSDF) defines and describes secure software development
    practices (`nvlpubs.nist.gov/nistpubs/CSWP/NIST.CSWP.04232020.pdf`).'
  merge: -1
  img_proc: true
- pgno: 140
  md: <!-- no content -->
