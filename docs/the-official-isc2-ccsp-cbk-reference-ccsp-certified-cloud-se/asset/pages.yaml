- pgno: 101
  md: '# DESIGN AND IMPLEMENT AUDITABILITY, TRACEABILITY, AND ACCOUNTABILITY OF DATA
    EVENTS


    All the topics discussed thus far fall into broad categories of data governance
    and data management. Just like any other valuable asset, an organization must
    identify strategic goals and requirements for managing, using, and protecting
    data. Despite best efforts to safeguard these assets, there will be times when
    it is necessary to collect evidence and investigate activity that could support
    assertions of wrongdoing. Gathering this digital evidence requires the existence
    of relevant data in logs or other sources, as well as capabilities to identify,
    collect, preserve, and analyze the data. An organization with no preparation for
    these activities will find it difficult or impossible, and security practitioners
    should ensure their organizations are not put in situations where they are unable
    to investigate and hold bad actors accountable.


    # Definition of Event Sources and Requirement of Identity Attribution


    There are formal definitions of events used in IT service management as well as
    security incident response. In general, an event is any observable action that
    occurs, such as a user logging in to a system or a new virtual server being deployed.
    Most IT systems support some ability to capture these events as running logs of
    past activity, though cloud-based systems can present a number of challenges that
    a CCSP should be aware of.


    The primary concern regarding information event sources in cloud services is the
    accessibility of the data, which will vary by the cloud service model in use.
    IaaS will obviously offer the most data events as the consumer has access to detailed
    logs from network, OS, and application data sources, while in SaaS, the consumer
    may be limited to only data events related to their application front end with
    no access to infrastructure, OS, or network logs. This loss of control is one
    cost factor organizations should weigh against benefits of migrating to the cloud
    and may be partially offset with contract requirements for expanded data access
    in exceptional circumstances like a data breach.


    The Open Web Application Security Project® (OWASP) publishes a series of guides
    called cheat sheets, including one on logging. The guide covers a variety of scenarios
    and best practices and also highlights challenges that a CCSP is likely to face
    when using cloud services, particularly the inability to control, monitor, or
    extract data from resources outside the organization’s direct control. Some of
    these scenarios include the following:


    +   - **Synchronize time across all servers and devices:** The timestamp of events
    in a log is crucial to establish a chain of activity performed by a particular
    user. If a cloud service is hosted and generates logs in a time zone different
    from the user’s workstation, it will require significant mental overhead to trace
    events.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '+   - **Differing classification schemes:** Different apps and platforms will
    categorize events with different metadata. For example, one OS may identify user
    logins as “Informational” events, while apps running on that OS log the same activity
    as “User Events.” Constructing queries on such varied data will be difficult.


    +   - **Identity attribution:** Ultimately logs should be able to answer the basic
    question “Who did what and when?” Sufficient user ID attribution needs to be easily
    identifiable; otherwise, it may prove impossible to definitely state that a particular
    user took a given action. The organization’s identity and access management system
    may offer the ability to utilize a single identity across multiple services, but
    many cloud services enforce their own user management, complicating the attribution
    of events to a specific user.


    +   - **Application-specific logs:** Apps may offer the ability to generate logs,
    but unlike widely standardized tools like operating systems or web server software,
    they may log information in a unique format. SaaS platforms may offer even fewer
    configuration options as internal functionality such as event logging configuration
    is not exposed to the end users. Making sense of this data in relation to other
    sources, such as an app that uses a numeric ID value for users while others use
    an email address, can be challenging.


    +   - **Integrity of log files:** App and OS log files typically reside on the
    same hosts as the software generating the logs and so are susceptible to tampering
    by anyone with privileged access to the host. If a user has administrative permissions,
    they may be able to not only perform unauthorized actions but then cover up evidence
    by modifying or deleting log files.


    The full Logging Cheat Sheet is available here: cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html.


    # Logging, Storage, and Analysis of Data Events


    Logs are made valuable only by review; in other words, they are valuable only
    if the organization makes use of them to identify activity that is unauthorized
    or compromising. Due to the sheer volume of log data generated, it is unlikely
    a human being would be capable of performing log reviews for any computing environment
    more complex than a single application.


    SIEM tools, which are covered in detail in Domain 5: Cloud Security Operations,
    can help to solve some of these problems by offering these key features:


    +   - **Log centralization and aggregation:** Rather than leaving log data scattered
    around the environment on various hosts, the SIEM platform can gather log data
    from operating systems, applications, network appliances, user workstations, etc.,
    providing a single location to support investigations. This is often referred
    to as'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'forwarding logs when looked at from the perspective of individual hosts sending
    log files to the SIEM.


    +   - **Data integrity:** The SIEM platform should be on a separate host with
    access permissions unique from the rest of the environment, preventing any single
    user from tampering with data. System administrators may be able to tamper with
    logs on the systems they are authorized to access but should be denied write access
    to log data stored on the SIEM platform.

    +   - **Normalization:** The same piece of data can often be formatted in a variety
    of ways, such as dates written YYYY/MM/DD, DD/MM/YYYY, or even the Unix format,
    which is a count of the number of seconds measured from a start time of January
    1, 1970. SIEMs can normalize incoming data to ensure the same data is presented
    consistently; for example, all timestamps are converted to utilize UTC rather
    than the time zone of the originating system.

    +   - **Automated or continuous monitoring:** Sometimes referred to as correlation,
    SIEMs use algorithms to evaluate data and identify potential attacks or compromises.
    These can often be integrated with other security tools such as intrusion detection
    systems (IDS) and firewalls to correlate information, such as a large number of
    failed logins by users after the user visited a particular website. This is indicative
    that users may have fallen for a phish, and the attackers are now trying to use
    those credentials. Crucially, this monitoring can be automated and is performed
    continuously, cutting down the time to detect a compromise.

    +   - **Alerting:** SIEMs can automatically generate alerts such as emails or
    tickets when action is required based on analysis of incoming log data. Some also
    offer more advanced capabilities like IPS, which can take automated actions like
    suspending user accounts or blocking traffic to/from specific hosts if an attack
    is detected. Of course, this automated functionality will suffer from false positives,
    but it performs at much greater speed compared to a human being alerted to and
    investigating an incident.

    +   - **Investigative monitoring:** When manual investigation is required, the
    SIEM should provide support capabilities such as querying log files, generating
    reports of historical activity, or even providing concise evidence of particular
    events that support an assertion of attack or wrongdoing; for example, a particular
    user’s activity can be definitively tracked from logging on to accessing sensitive
    data to performing unauthorized actions like copying the data and sending it outside
    the organization.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Chain of Custody and Nonrepudiation


    Data that is collected in support of an investigation has unique requirements
    for integrity, particularly one in which civil or criminal prosecution is called
    for. It is vital to establish a chain of custody, or a defensible record of how
    evidence was handled and by whom, from its collection to its presentation as evidence.
    If data has been altered after it was collected, the defendant might make a case
    that they are innocent because the evidence has been altered to make them look
    guilty.


    Chain of custody and evidence integrity do not imply that data has not changed
    since collection, but instead they provide convincing proof that it was not tampered
    with in a way that damages its reliability. For example, data on a user’s workstation
    will physically change location when the workstation is collected from the user,
    and the data may be copied for forensic analysis. These actions, when performed
    by properly trained professionals, do not change the underlying facts being presented
    or the believability of evidence. However, if the workstation is left unattended
    on a desk after it is taken from the user, then the user can claim the data was
    altered in a way that incriminates them, and thus the evidence is no longer reliable.


    Nonrepudiation can be a challenging term because it is proving a negative. Repudiating
    an action means denying responsibility for the given action, so nonrepudiation
    is a characteristic whereby you can definitely hold a particular user accountable
    for a particular action. In nontechnical terms, it can be difficult to hold anyone
    accountable for drinking the last of the office coffee from a shared coffee maker;
    everyone can repudiate the assertion that they finished the coffee without brewing
    more. If users are required to enter a PIN to unlock the coffee maker, then it
    is possible to defensibly prove, when the coffeepot is found to be empty, that
    the last person whose code was used is the culprit.


    Information systems enforce nonrepudiation partially through the inclusion of
    sufficient evidence in log files, including unique user identification and timestamps.
    System architecture and limitations can pose challenges such as shared user accounts
    that are tied to a group of users but no single user, as well as processes that
    act on behalf of users, thereby obscuring their identity. Nonrepudiation is a
    concern not just for data event logging but also access control and system architecture.
    Security practitioners must ensure their access control, logging, and monitoring
    functions support nonrepudiation.


    One final note on chain of custody and nonrepudiation: the process of investigating
    digital crimes can be quite complex and may best be left to trained professionals
    with appropriate skills and experience. Simple acts like plugging in a drive can
    cause irreversible data loss or corruption, and destroying evidence may limit
    the organization’s ability to seek legal redress if a crime has occurred. While
    CCSPs should be familiar with these practices, it is also advisable to know when
    expert professionals are required.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# SUMMARY


    Cloud services offer many benefits for accessing, managing, and handling the data
    that are crucial to modern business operations, but they are not free from risk.
    The cloud data lifecycle provides a convenient framework for identifying the types
    of activities, risks, and appropriate security controls required to ensure data
    remains secure. This, coupled with an understanding of the storage architectures
    available in different cloud service models, allows a CCSP to design and apply
    appropriate safeguards such as data discovery, encryption, and tokenization, as
    well as countermeasures like DLP. Proper cloud data security requires organizations
    to know what kind of data they handle and where it is stored, and deploy adequate
    policies, procedures, and technical controls to ensure the business benefits of
    cloud environments are not offset by increased information-security risks.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Cloud Platform

    and Infrastructure Security


    THE CLOUD SECURITY PROFESSIONAL must understand the cloud infrastructure for each
    of the cloud delivery models. The infrastructure includes the physical components
    of the cloud, the services they provide, and the communication infrastructure
    that allows us to connect with the cloud. Each part of the infrastructure has
    specific security needs and shared security responsibilities.


    In the shared security model of cloud computing, it is easy, but incorrect, to
    assume that security is the sole responsibility of the Cloud Service Provider
    (CSP). The cloud security professional needs to understand the unique security
    needs of the cloud environment and the technologies, such as virtualization, that
    make the cloud possible. The security professional must understand the nuances
    affecting cloud security, including which part of security is the responsibility
    of the CSP and which part is the responsibility of the customer. The security
    professional must be clear on how the security provided by the CSP and the customer
    work together to protect the customer''s processes and data.


    Finally, the cloud security professional must understand how the cloud can support
    the business. The cloud supports more than day-to-day operations.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'The cloud also provides important tools to support business continuity and
    disaster recovery. In this role, the cloud becomes more of a business continuity
    and resiliency tool.


    # COMPREHEND CLOUD INFRASTRUCTURE COMPONENTS


    There are common components to all cloud infrastructure. These components are
    all physically located with the CSP, but many are accessible via the network.
    In the shared responsibility security model, both the customer and the CSP share
    security responsibilities for the cloud environment. Those responsibilities are
    discussed with each component.


    # Physical Environment


    The physical environment is composed of the server rooms, data centers, and other
    physical locations of the CSP. The identity of the CSP may vary by the different
    cloud security models, as follows:


    +   - A private cloud is often built by a company on-premise. If this occurs,
    the company/customer is the CSP. If the private cloud is built using a commercial
    vendor, such as AWS or Azure, the CSP is the commercial vendor.

    +   - In a community cloud, a member of the community often hosts the space and
    equipment needed. The community member hosting the cloud is the CSP. If the community
    cloud is built using a commercial cloud service, such as AWS or Azure, the CSP
    is the commercial vendor.

    +   - In public clouds, the CSP is the company providing the service, such as
    AWS, Microsoft, Google, IBM, and so on. This commercial vendor is the CSP.


    The physical environment is under the sole control of the CSP. CSPs provide all
    physical security. They are also responsible for monitoring, auditing, and maintaining
    a secure environment. The security risks are those common to all data centers,
    regardless of whether they are on-premise or provided by a third party. These
    include physical security of the equipment, identity and access management, data
    integrity and confidentiality, and so on.


    The CSP uses the typical methods for these risks. For physical security these
    measures include locks, security personal, lights, fences, etc. Identity and access
    management (IAM) will use tools such as SAM or OAuth2 or may use a cloud vendor
    such as Okta to'
  merge: -1
  img_proc: true
- pgno: 108
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 109
  md: '+   - In an IaaS service model, the customer is responsible for configuring
    the environment as well as enforcing company policies in the use of systems, as
    if the systems were on-premise as well as the connection to the CSP. The CSP is
    responsible for the technology provided but not how it is used.

    +   - In a PaaS module, the CSP is responsible for the physical components, the
    internal network, and the tools provided. The customer is responsible for the
    proper use of those tools and the connection to the CSP.

    +   - In a SaaS model, the customer remains responsible for access to the cloud
    service in a secure manner—using appropriate technologies to connect with and
    transmit data to and from the service securely.


    # Compute


    The compute resources are the infrastructure components that deliver virtual machines
    (VMs), disk, processor, memory, and network resources. These resources are owned
    by and under the direct control of the CSP. The security issues are the same for
    these resources in a cloud environment as they are on-premise with the additional
    challenge of multitenancy.


    The CSP in every delivery and service model remains responsible for the maintenance
    and security of the physical components. These are owned and supported by the
    CSP. The customer in every delivery and service model remains responsible for
    their data and their users. Between the physical components, there is a vast array
    of software and other components. Who is responsible for each of these remaining
    parts varies by service and delivery model and sometimes by the CSP. The contract
    between the customer and the CSP should spell out the responsibilities for each
    part of the cloud environment. Typical responsibilities will be described for
    each service model (IaaS, PaaS, and SaaS).


    In an IaaS environment, the CSP provides the hardware components and may provide
    networking, virtualization, and operating systems. The security of physical components
    provided by the CSP are the responsibility of the Internet Service Provider (ISP).
    When the CSP provides software components, such as virtualization and Operating
    System (OS) software, they are responsible for the versioning and security of
    those components.


    When the CSP provides the virtualization and OS software, some of the software
    configuration may be left to the customer. When this is the case, the customer
    is responsible for the security implications of the configuration they choose.
    In the IaaS service model, the customer has the most responsibility for security.
    Other than the hardware components and system software provided, the customer
    remains responsible for all other security for the tools they install, software
    they develop, and, of course, all identity and access management, customer records,
    and other data. These responsibilities include the patching and versioning of
    the software installed or developed by the user and the security of data at rest
    and in motion.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'In a PaaS environment, the CSP is responsible for the security and maintenance
    of all the components and systems they were responsible for in the IaaS service
    model. In addition, the CSP is responsible for all additional services they provide.
    These services can be storage, transform and analysis, and numerous other services.
    While the customer may have some ability to configure these services, all services
    provided by the CSP will usually be maintained by the CSP, to include patching
    and versioning. The customer is responsible for the configuration and use of all
    CSP systems and services provided as well as the patching and versioning of all
    software the customer installs or develops. The customer is always responsible
    for the security of their data and users. The contract with the CSP should address
    these issues.


    In a SaaS environment, the customer is generally responsible for the customization
    of the SaaS service, as well as the security of their users and the data used
    or produced by the service. The CSP is responsible for the security of all other
    compute resources.


    # ## Virtualization


    There are two types of two types of hypervisors that provide virtualization. These
    are Type-1 hypervisors (also known as *bare-metal hypervisors*) and Type-2 hypervisors
    (also known as *hosted hypervisors*). Among the major CSPs, a Type-1 hypervisor
    is more common. These include the version of the Xen hypervisor provided by AWS
    and the Hyper-V hypervisor provided in Azure.


    In a Type-1 hypervisor, the hypervisor sits on the physical server and its associated
    hardware components. The Type-1 hypervisor does not sit on an OS. Rather, the
    hypervisor provides the OS functionality. VMs sit atop the hypervisor. You manage
    the virtual environment using a management console separate from the hypervisor.
    In the Type-1 environment, VMs can move between physical machines. When done properly,
    it is invisible to the end user. In addition to Hyper-V and the Xen Server (now
    called Citrix) hypervisors, other common Type-1 hypervisors include VMware vSphere
    with ESX/ESXi and Oracle VM.


    In a Type-2 hypervisor, there are typically three layers in the virtualization
    portion. At the bottom is the host OS, such as Windows macOS or Linux. The next
    layer is the hypervisor itself. Examples include Oracle VM VirtualBox, VMware
    Workstation Pro/VMware Fusion, and Windows Virtual PC. These are not usually used
    for enterprise solutions but are used for individual needs and testing environments.
    The top layer consists of the individual VMs. Management of the VMs is built into
    the Type-2 hypervisor.


    The security of the hypervisor is always the responsibility of the CSP. The virtual
    network and virtual machine may be the responsibility of either the CSP or the
    customer, depending on the cloud service model as described in the earlier “Compute”
    section.


    Hypervisor security is critical. If unauthorized access to the hypervisor is achieved,
    the attacker can access every VM on the system and potentially obtain the data
    stored on'
  merge: -1
  img_proc: true
- pgno: 111
