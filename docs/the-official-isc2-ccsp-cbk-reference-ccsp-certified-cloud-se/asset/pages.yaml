    architecture is unchangeable but short lived. In cloud environments, it is possible
    to tear down all virtual infrastructure elements used by an old version of software
    and deploy new virtual infrastructure quite simply; in traditional architecture,
    this process would be much more difficult and time-consuming. Immutable architecture
    can address baseline monitoring and compliance by limiting the amount of time
    a host can exist in a noncompliant state; the next time the application is deployed,
    the old host is torn down, and a new VM is built from the standard baseline image.


    # Patch Management


    Maintaining a known good state is not a static activity, unfortunately. Today’s
    hardened system is tomorrow’s highly vulnerable target for attack, as new vulnerabilities
    are discovered, reported, and weaponized by attackers. Patch management involves
    identifying vulnerabilities in your environment, applying appropriate patches
    or software updates, and validating the patch has remediated the vulnerability
    without breaking any functionality or creating additional vulnerabilities.


    Information needed to perform patch management can come from a variety of sources,
    but primary sources include vendor-published patch notifications, such as Microsoft’s
    Patch Tuesday, as well as vulnerability scanning of your environment. Patch management
    processes will vary depending on the cloud service model you are using.


