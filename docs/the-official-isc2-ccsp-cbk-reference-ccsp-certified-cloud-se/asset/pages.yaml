    # ✓ Equifax Data Breach


    In 2017, credit monitoring company Equifax suffered a massive data breach that
    affected more than 140 million people, primarily in the United States but in other
    countries as well. The company maintains highly sensitive personal information
    used in financial decision-making, and this information was exposed due to an
    unpatched software flaw in a web application server. The vulnerability had been
    published and a patch provided by the software vendor, but it was not properly
    applied throughout the Equifax environment. This unpatched software vulnerability
    allowed attackers to break in and steal data; estimates of the costs associated
    with this breach top $1 billion, including fines, lawsuits, and an overhaul of
    the company’s information security program!


