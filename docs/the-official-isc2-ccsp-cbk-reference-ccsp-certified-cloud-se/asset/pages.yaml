- pgno: 130
  md: '# Recovery Service Level


    RSL measures the compute resources needed to keep production environments running
    during a disaster. This measure (0 to 100 percent) gives an indication of the
    amount of computing used by production environments when compared to development,
    test, and other environments that can be shut down during a disaster. During a
    disaster, the focus is on keeping key production systems and business processes
    running until the disaster is largely resolved and other activities can restart
    to pre-disaster levels.


    # Business Continuity/Disaster Recovery Strategy


    The difference between a business continuity plan (BCP) and disaster recovery
    plan (DRP) will drive the strategy. A BCP may be executed following an event that
    falls short of being a disaster. A BCP will always be initiated following a disaster.
    The BCP’s purpose is to keep business running after an event, especially a disaster.
    The BCP may use different locations or use different systems or processes.


    For example, a BCP may be initiated following an unscheduled disruption of utility
    services. If the power utility must shut down a facility for an unscheduled upgrade,
    the BCP can guide how the business will proceed. One company the author worked
    for had a failing electrical system at the point utilities were provided to the
    business. The company scheduled a repair with the utility provider at a convenient
    time. However, the system suffered a complete failure prior to the scheduled maintenance,
    leading to the invocation of the BCP. The BCP’s purpose is to keep business running
    in another location or using different systems or processes until such time that
    the power returns. In this chapter, the BCP will be part of the response to a
    disaster.


    While a BCP keeps business operations going after a disaster, the DRP works on
    returning business operations to normal. For example, a tornado may make a facility
    unusable. The BCP will move operations to alternate sites. In a cloud environment,
    this may mean bringing additional availability zones online to ensure high availability.
    It may also involve relocated key personnel and the use of cold/warm/hot sites
    for the workforce.


    The purpose of the DRP will be to restore operation in the destroyed building
    or new permanent facilities. Once systems are restored to their original facilities
    or new facilities, the disaster recovery effort is over. Restoration of systems
    includes normal operations, new development, regular maintenance, and other support
    functions.


    Another way of looking at this is the BCP is concerned with critical business
    processes and keeping them running. The DRP is focused on returning operations
    to normal, which includes infrastructure and facilities. In a cloud environment,
    normal operations will be defined as returning to pre-disaster levels of function
    and not simply continuation of critical business functions.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'The cloud supports the BCP/DRP strategy. The high availability of cloud services
    provides strong business continuity and can serve as a core part of the BCP strategy.
    In effect, the cloud allows the business to continue regardless of disasters affecting
    the customer’s business facilities. The high availability of cloud services also
    impacts DRP strategy. As the cloud can provide resilient services at attractive
    price points, a company may focus more on resilient services that survive a disaster
    rather than processes to recover from disasters.


    # Creation, Implementation, and Testing of Plan


    There are three parts to any successful BCP/DRP. Each is vital to the success
    of the organization. These include the creation, implementation, and ongoing maintenance
    and testing of the plans.


    Because of their inherent differences, BCPs have different responsibilities within
    the business. Sometimes the BCP is seen as part of the DRP. However, it is really
    an independent plan that supports the DRP. If the business does not continue to
    function, the responsibility of the BCP, there is no reason to have a DRP as there
    will be nothing to return to normal. The BCP supports the DRP.


    The plans should be developed with knowledge of the other as they must work together.
    These plans will include many of the same members of the workforce. But they are
    separate plans.


    # Plan Creation


    The first step in any comprehensive BCP is to do a business impact analysis (BIA).
    The BIA identifies the impact of process/system disruption and helps determine
    time-sensitive activities and process dependencies. The BIA identifies critical
    business processes and their supporting systems, data, and infrastructure. The
    BIA is essential to determining requirements and resources for achieving the RTO
    and RPO necessary for business continuity.


    The systems can be grouped in a number of ways. One way is to identify critical
    processes, important processes and support processes, and the systems and data
    that support these processes. Critical business processes are those that impact
    the continued existence of the company. Email, for example, is rarely a critical
    business process. For a company like Amazon, inventory, purchasing, and payment
    may be critical processes. The selection of a critical process is a business decision.


    Along with the selection of critical processes is a prioritization of systems.
    If you can bring up only one system at a time, which is first? Some processes
    will not work until other processes are back online. In that case, they are prioritized
    after the processes'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'they depend on. There is no point in bringing a process online if it cannot
    function until other processes are available. Because of this, identification
    and authentication services are often among the first processes to restore. All
    critical processes must be prioritized over other processes.


    After critical processes are other important processes. These are processes that
    are a value-add and can have an impact on the business profitability. Once again,
    these must have a prioritization or ordering.


    After the important processes are online, other useful and beneficial processes
    are brought back online. It is possible that a business decision may be made that
    chooses to not restore some processes until restoration of normal operations,
    if they are not critical to the business.


    Processes based on legacy systems can be difficult to return to pre-disaster configurations.
    The technical debt of continuing to run legacy systems unless essential to the
    business may make them expendable. If there are systems that may be in this category,
    it may be worthwhile to consider replacing and retiring them prior to an emergency.
    Legacy systems often have legacy hardware and software requirements that are not
    easily restored after a disaster. Legacy systems may also have information security
    risks that are best avoided. If the legacy system supports a critical business
    process, the need to replace the legacy system may be urgent.


    One advantage to a cloud-based BCP/DRP is the expectation of a modern and up-to-date
    infrastructure. While a legacy system could potentially be hosted in the cloud,
    the move to a cloud position may provide the opportunity to modernize.


    The creation of the DRP often follows the BCP. Knowing the critical business processes
    and the supporting infrastructure provides a roadmap to returning the system to
    pre-disaster operations.


    Both the BCP and DRP should be created considering a range of potential disasters.
    History is a good starting point for environmental disasters. Government agencies
    such as FEMA and private/public partnerships like InfraGard can also provide guidance
    on the likely disasters that need to be considered in any geographic location.


    The CSP is also a source for BCP/DRP planning. Recommendations and solutions for
    surviving specific business disruptions and returning to normal operations will
    be available from the larger CSPs, such as Amazon, Google, IBM, etc.


    The creation and implementation of a DRP or BCP is a lengthy process. It is simplified
    by having the system criticality and prioritization determined prior to beginning
    plan development. The identification, criticality, and prioritization of business
    processes, systems, and data are a necessary first step to creating a complete
    and functional plan. If this prerequisite step is omitted, the creation of the
    plan can be disruptive. Often, every'
