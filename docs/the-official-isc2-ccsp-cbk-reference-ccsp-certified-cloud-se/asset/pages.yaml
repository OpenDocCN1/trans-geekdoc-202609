  md: '# Storage Clusters


    Storage clusters create a pool of storage, with the goal of providing reliability,
    increased performance, or possibly additional capacity. They can also support
    dynamic system availability by making data available to services running anywhere—if
    a data center in one part of the country fails and web hosts are migrated to another
    data center, they can connect to the same storage cluster without needing to be
    reconfigured. There are two primary architectures for storage clusters:


    +   - Components in a tightly coupled cluster are often all provided by the same
    manufacturer, and updates or expansion must come from that same manufacturer.
    The advantage of a tightly coupled cluster is generally better performance due
    to the division of data into deterministic blocks. When a file is written to such
    a storage cluster, it is broken down into blocks that are faster to read and write
    to disks than the entire file. This is especially relevant if the data is to be
    mirrored, as writing multiple copies of a long file will take longer than duplicating
    blocks, and blocks can be written across multiple nodes or disks simultaneously.

    +   - Loosely coupled storage offers more flexibility and lower cost at the expense
    of performance. Components can usually be added using any off-the-shelf parts,
    but the use of file-level storage means operations will be slower.


