- pgno: 226
  md: 'frameworks such as ISO 27001, SOC 2, and PCI DSS. The same general rules apply,
    however: customer data security is always the customer''s responsibility, physical
    security is always Google''s responsibility, and some items are shared depending
    on what service offerings are utilized.


    More information can be found here: cloud.google.com/security.


    # Partners


    Partners will often have a level of access to an organization’s systems similar
    to the organization’s own employees but are not directly under the organization’s
    control. Communication with partners will be similar to communication with employees,
    with initial steps required when a new relationship is established, ongoing maintenance
    activities throughout the partnership, and termination activities when the partnership
    is wound down. Each of these phases should deliver clear expectations regarding
    security requirements.


    +   - **Onboarding:** During onboarding, a partner is introduced to the organization,
    and two important processes must be executed: third-party or vendor due diligence
    activities to assess the partner prior to sharing data or granting access, and
    communication of security requirements through contracts, SLAs, or other documentation.
    Elements of the organization’s security program may be shared with the partner
    such as security policies and training.

    +   - **Management:** Once a partner has been onboarded, the organization’s ongoing
    security efforts must include any partner activities. This should include managing
    access and permissions, auditing and oversight activities, and processes such
    as incident response and disaster recovery testing.

    +   - **Offboarding:** When a partnership ends, the organization must follow procedures
    to terminate access and communicate any security requirements relevant to the
    termination, such as reminders of nondisclosure requirements and the return of
    any assets the partner might have.


    # Regulators


    There are a vast array of regulatory bodies governing information security, and
    most of them have developed cloud-specific guidance for compliant use of cloud
    services. In the early days of cloud computing, security practitioners often faced
    significant unknowns when moving to the cloud, but as the cloud became ubiquitous,
    regulators delivered clear guidance, and CSPs moved quickly to deliver cloud solutions
    tailored to those compliance requirements. A CCSP is still responsible for ensuring
    their cloud environment is in compliance with all regulatory obligations applicable
    to their organization.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'The main component of regulatory communication regarding the cloud is monitoring
    incoming information regarding regulatory requirements in the cloud. For example,
    the recent implementation of GDPR in the European Union (EU) has caused many organizations
    to make architectural decisions regarding their cloud applications. GDPR’s restrictions
    on data leaving the geographic boundaries of the EU mean many organizations need
    to implement additional privacy controls to allow for that data transfer or host
    applications in EU-based data center. The CCSP should subscribe to feeds and be
    aware of regulatory changes that impact their organization’s use of the cloud.


    Similar to monitoring incoming cloud requirements, a CCSP may also be required
    to report information to regulatory bodies regarding their organization’s state
    of compliance. For example, U.S.-based companies with GDPR privacy requirements
    may be required to communicate to the U.S. Department of Commerce on the status
    of privacy compliance under the U.S. Privacy Shield framework. CCSPs should be
    aware of regulatory reporting requirements specific to their organization, and
    ensure required documentation, artifacts, audits, etc., are communicated in a
    timely fashion.


    # Other Stakeholders


    Communications may not be a primary job responsibility of a CCSP, but important
    details of security risk management work may need to be shared. Working with appropriate
    personnel in the organization will be crucial to ensure information is communicated
    in a timely manner and with relevant details for each audience, such as the following:


    +   - **Public:** Details of security incidents are the most obvious category,
    especially if the breach could affect security or privacy. In this case, adequately
    trained public relations (PR) professionals as well as legal personnel should
    be consulted and may handle communications with input from the security team.

    +   - **Security researchers:** Increasingly, security experts are performing
    research on specific organization’s apps and services, with the goal of responsibly
    disclosing their findings before an attacker can exploit them. Organizations should
    have a method for receiving and responding to this type of communication, often
    via a publicly documented security email address. Getting details from a researcher,
    following up if more information is required, and in some cases paying a bounty
    for the discovered bug may all be ongoing communications that need to be handled.

    +   - **Investors:** In many countries, formal communication with investors is
    required on a regular basis, such as quarterly business filings, annual financial
    statements, or unusual business activities such as a merger. Security posture,
    incidents, and'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'compliance may all be relevant to some investors, and due to legal requirements,
    certain security details may be required.


    +   - **Crisis communication:** An incident that causes significant disruption
    or disturbance such as a natural disaster may require communications to multiple
    stakeholder groups at once. Internal employees, business partners, investors,
    and the general public may all be impacted by a business disruption; in this case,
    the organization’s communications personnel should have documented procedures,
    and security practitioners should look to these personnel for guidance on what
    information may be required.


    # MANAGE SECURITY OPERATIONS


    Security operations represent all activities undertaken by an organization in
    monitoring, maintaining, and generally running their security program. This may
    include continuous oversight of security systems to identify anomalies or incidents,
    as well as an organizational unit to house concerns related to security processes
    like incident response and business continuity. A large percentage of security
    process and procedure documentation will be attached to this function, and these
    processes should also be the target of continuous improvement efforts.


    As in many security topics, an ISO standard exists that may be useful for security
    practitioners conducting security operations: ISO 18788, *Management system for
    private security operations — Requirements with guidance for use*. A word of caution:
    this document contains a great deal of material not applicable to cybersecurity
    or infosec concerns, as the numbering might imply (it is not part of the 27000
    series). One extraneous topic is implementing and managing a private security
    force with authorization to use force; however, it also provides a business management
    framework for understanding the organization’s needs, guidance on designing strategic
    and tactical plans for operating security programs, and applying a risk management
    approach. It also suggests a standard plan, do, check, act framework for implementing
    and improving security operations.


    # Security Operations Center


    The security operations center (SOC) is an organizational unit designed to centralize
    a variety of security tasks and personnel at the tactical (mid-term) and operational
    (day-to-day) levels of the organization. While security strategy may rely on input
    from top leaders such as a board of directors, department secretary or minister,
    or the C-suite executives, SOC personnel are responsible for implementing steps
    required to achieve that strategy and maintain daily operations. Building and
    running a SOC in a traditional,'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'all on-prem environment is basically building a monitoring and response function
    for IT infrastructure. Extending these concepts to the cloud may require some
    trade-offs, as the CSP will not offer the same level of access for monitoring
    that an on-prem environment does.


    It is also important to note that there will be at least two SOCs involved in
    cloud environments. The CSP should run and manage their own SOC focused on the
    elements they control under the shared responsibility model such as infrastructure
    and physical security, while consumers should run their own SOC for their responsibility
    areas, chiefly data security when using the cloud.


    The CISO Mind Map published by security author Rafeeq Rehman, found at rafeeqrehman.com/?s=mindmap,
    provides a more information-security-centric view of security operations than
    ISO 18788. Updated each year, the Mind Map details the items that a CISO''s role
    should cover; the largest element of the job responsibilities is security operations,
    which is broken down into three main categories. This provides a strong framework
    for responsibilities the SOC should undertake, including the following:


    +   - **Threat prevention**: This subcategory includes preventative controls and
    risk mitigations designed to reduce the likelihood of incidents occurring. These
    include adequate network security, vulnerability and patch management programs,
    application security (appsec), information system hardening, and maintenance activities
    for common security tools such as PKI.

    +   - Threat prevention in the cloud will involve similar activities such as keeping
    an adequate asset inventory and utilizing it to detect vulnerabilities and fix
    them via patching, particularly when using IaaS. In some PaaS and virtually all
    SaaS, vulnerability and patch management will be the responsibility of the CSP.
    Implementing network security in the cloud requires adequate selection and deployment
    of cloud-appropriate tools like firewalls and intrusion detection tools; many
    traditional tools do not work in virtualized networks or rely on capabilities
    like mirroring network traffic from a SPAN port on a switch to inspect traffic,
    which is not available in a virtual cloud network. SOC operations need to be able
    to access that data and integrate it with monitoring tools, often through the
    use of API.

    +   - **Threat detection**: Detecting threats requires tools, processes, and procedures,
    such as log capture/analysis/correlation, which is often achieved with a SIEM
    tool. Other capabilities include real-time monitoring tools such as data loss/
    leak prevention (DLP) tools and network security solutions like IDS/IPS, anti-malware,
    and firewalls. Some security testing processes also fall in this category such
    as red (offensive) and blue (defensive) team exercises.'
  merge: -1
  img_proc: true
