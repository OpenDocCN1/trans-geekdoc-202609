- pgno: 94
  md: '# PLAN AND IMPLEMENT DATA RETENTION, DELETION, AND ARCHIVING POLICIES


    Data follows a lifecycle starting with its creation and ending when it is no longer
    needed by the organization. There are many terms used to describe this end-of-life
    phase including disposal, retention, archiving, and deletion. Although sometimes
    used interchangeably, they are unique practices, and a CCSP must be aware of requirements
    that mandate the use of one specific option.


    Data disposal is most often associated with the destruction or deletion of data,
    though the term may be used to mean disposition, which implies a change of location
    for data such as moving it from active production to a backup environment. While
    data is still required for use by the organization or must be held for a set period
    of time to meet a regulatory or compliance objective, the practice of *data retention*
    will be used. Once data is no longer needed by the organization and is not subject
    to any compliance requirements for retention, it must be deleted using tools and
    processes commensurate with its value.


    *Data archiving* is a subset of retention typically focused on long-term storage
    of data not required for active processing or that has historical value and may
    therefore have high integrity requirements. Data retention, archive, and destruction
    policies are highly interconnected, and the required practices may even be documented
    in a single policy or set of procedures governing the use, long-term storage,
    and secure destruction of data.


    # Data Retention Policies


    Data retention is driven by two primary objectives: operational needs (the data
    must be available to support the organization’s operations) and compliance requirements,
    which are particularly applicable to sensitive regulated data such as PII, healthcare,
    and financial information. Many regulatory documents refer to data as records;
    hence, the term *records retention* is often used interchangeably. Data retention
    policies should define a number of key practices for the organization and need
    to balance organizational needs for availability, compliance, and operational
    objectives such as cost.


    A CCSP should recognize several use cases for cloud services related to backups,
    which are often a key subset of data retention practices related to availability.
    Cloud backup can replace legacy backup solutions such as tape drives, which are
    sent to offsite storage. This offers the benefit of more frequent backup with
    lower overhead, as sending data over a network is typically cheaper than having
    a courier pick up physical drives, but the organization’s network connection becomes
    a single point of failure.


    Cloud backup can be architected as a mere data storage location, or a full set
    of cloud services can act as a hot site to take over processing in the event the
    on-premises environment fails. This scenario may be cost effective for organizations
    that are unable to use'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'the cloud as a primary processing site but do not want to incur the costs of
    a full hot site. Temporary use of the cloud as a contingency helps to balance
    cost and security.


    Cloud services, particularly SaaS and PaaS deployments, may offer intrinsic data
    retention features. Most cloud storage services provide high availability or high
    durability for data written into the environment, which allows the organization
    to retain vital data to meet operational needs. Some services also offer compliance-focused
    retention features designed to identify data or records stored and ensure compliance
    obligations are met. In all cases, the CCSP needs to be aware of the features
    available and ensure their organization properly architects or configures the
    services to meet internal and compliance obligations.


    # Storage Costs and Access Requirements


    Data retention has associated storage costs, which must be balanced against the
    requirements of speed to access it. In many cases, older data, such as old emails
    or archived documents, is accessed less frequently. This data may not be accessed
    at all for routine business matters, but is only needed for exceptional reasons
    like archival research or a legal action where it is acceptable to wait a few
    hours for a file to be retrieved. Organizations may also have compliance or regulatory
    obligations to retain data long after it is no longer useful for daily operations.
    The costs associated with this storage can be significant, so CSPs offer a variety
    of storage services that balance cost and retrieval speeds; typically the solutions
    offer a combination of either low price/retrieval speed or higher price and quick
    retrieval. As an example, Amazon Simple Storage Service (S3) offers higher-priced
    S3 Standard, where retrieval is in real time, or lower-priced S3 Glacier, where
    retrieval time ranges from 1 minute to 12 hours. Similarly, Microsoft’s Azure
    Blob Storage offers Hot, Cool, and Archive tiers, in order of higher cost/retrieval
    speed to lower cost/speed.


    To model this cost-benefit analysis, consider Alice’s Blob Cloud (ABC), which
    offers the following storage service levels (currency is USD per gigabyte):


    +   - **Rabbit Storage:** $0.5, real-time access (>50 milliseconds)

    +     - Storing 5TB of data (5000GB) would cost $2,500/month or $30,000/year.

    +   - **Turtle Storage:** $0.005, access times from 1 to 12 hours

    +     - Storing 5TB of data (5000GB) would cost $25/month or $300/year.


    The costs savings of using Turtle are significant: $29,700 per year in this limited
    example. Most organizations will generate significantly more than 5TB of data.
    If the data is used infrequently, such as once a quarter, the data retention policy
    should specify appropriate storage options to balance costs with the access speed
    requirements. This may be part of the records retention schedule (for example,
    all data that is older than 12 months is moved to Turtle) or as part of the data
    classification policy (for example, live production data is encrypted at rest
    and stored in Rabbit, while archive production is encrypted and stored in Turtle).'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Specified Legal and Regulatory Retention Periods


    All organizations should retain data for as long as it is functionally useful;
    otherwise, the organization faces a loss of availability. This may be marked by
    obvious milestones such as the end of a customer relationship or project, after
    which the data is no longer valuable to the organization and can be deleted. Any
    organization dealing with regulated data like PII is also likely to have external
    obligations for data retention, which are often legally enforceable. Some examples
    of external regulations include the following:


    +   - **HIPAA:** Affects all U.S. residents and specifies a six-year retention
    period for documents, such as policies and procedures, relevant to the HIPAA compliance
    program. Retention of patient medical data is not directly mentioned in HIPAA
    but is specified by many state-level laws that require medical records be retained
    for as long as a patient is active and then for a set period of time thereafter.

    +   - **EU GDPR:** Affects data of EU citizens; it does not set a specific retention
    period but rather provides for indefinite retention so long as a data subject
    has given consent and the organization has a legitimate need for the data. If
    consent is revoked or the organization must act on the revocation by deleting,
    destroying, or anonymizing the data.


    # Data Retention Practices


    The organization’s data retention policy should specify what data is to be retained
    and why. Procedures should also be documented to specify how those retention goals
    will be met, including details regarding the following:


    +   - **Schedules:** Data and records retention often refers to a schedule of
    retention, which is the period of time the data must be held for. These are often
    included in data labels to enable the discovery of data that is no longer required
    and can be destroyed.

    +   - **Integrity checking:** Whenever data is copied, there is a chance something
    could go wrong, and data stored may fall victim to environmental issues like heat
    or humidity, which damage the storage media. Integrity checking procedures should
    be established to verify data when it is written and periodically thereafter to
    ensure it is readable and complete.

    +   - **Retrieval procedures:** Data may have different access requirements across
    different environments. Typically, there will be more users authorized to access
    data in a live production environment as it is needed to support operations, while
    data in an archive may only be needed by a more limited set of users, like the
    legal department when responding to a lawsuit or auditors reviewing regulatory
    compliance. Retrieval procedures should include proper authorization artifacts
    like approved access requests and enforce accountability for data usage.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '+   - **Data formats:** The format of data, including programs, apps, and hardware
    needed to read and write it, requires consideration. Over time, file formats and
    hardware change, so procedures such as virtualizing legacy environments, purchasing
    reserves of obsolete equipment, or converting data to new formats may be appropriate.


    # Data Security and Discovery


    Retained data will face unique security challenges, particularly driven by the
    fact that it is long lived and may be difficult to access or manipulate as threat
    conditions change over time. For example, data encryption standards evolve quite
    frequently, so today’s state-of-the art cryptography may be trivially easy to
    crack in a few years. It may not be technically or financially feasible to decrypt
    data retained in archives and re-encrypt using more robust cryptography. Security
    practitioners should consider defense-in-depth strategies such as highly secure
    key storage and tightly limited access control over archival data as a compensating
    control for weaker legacy encryption standards. Similarly, keys that are no longer
    actively used for encrypting data in production environments may need to be securely
    stored to grant access to archival data.


    Data retention is often a requirement to support after-the-fact investigations,
    such as legal action and review by regulators. Data retention methods should support
    the ability to discover and extract data as needed to support these compliance
    obligations. For legal actions the requirements of eDiscovery must be considered.
    eDiscovery is covered in detail in Domain 6: Legal, Risk, and Compliance, but
    in short, it is the ability for data to be queried for evidence related to a specific
    legal action, such as all records during a certain time period when fraudulent
    activity is suspected.


    # Data Deletion Procedures and Mechanisms


    When data is no longer needed for operational needs and has been retained for
    the mandated compliance period, it can be disposed of. It may, however, still
    be sensitive, such as a medical records of a patient who is no longer being treated
    at a particular facility, but is still living and is legally entitled to privacy
    protections for their medical data. In this case, simply disposing of the data
    by selling old hard drives or dumping paper files into the trash would open the
    organization and the patient to risk, so proper controls must be enforced to ensure
    the confidentiality of information remains intact during destruction.


    NIST SP 800-88, *Guidelines for Media Sanitization*, is a widely available standard
    for how to securely remove data from information systems when no longer required.
    It defines three categories of deletion actions for various types of media to
    achieve *defensible destruction*—the steps required to prove that adequate care
    was given to prevent a breach'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'of data confidentiality. These categories, in hierarchical order based on protection
    they provide, are as follows:


    +   - **Clear:** The use of tools to remove or sanitize data from user-addressable
    storage. Clearing may include standard operating system functions like deleting
    data from a trash can/recycle bin, which merely renders the data invisible but
    recoverable using commonly available tools. These options are typically the fastest
    and lowest cost but are inappropriate for very sensitive data.


    +   - **Purge:** The use of specialized tools like overwriting drives with dummy
    data, physical state changes such as magnetic degaussing, or built-in, hardware-based
    data sanitization functions designed to provide secure destruction of data. Purged
    media can typically be reused, which may be a cost factor to consider, but the
    time required to perform purge actions like writing 35 passes of dummy data over
    a modern high-capacity hard drive might make it infeasible. Purging may also shorten
    the lifespan of media to such an extent that its remaining useful life is negligible.
    Data may be recovered from purged media using highly specialized tools and laboratory
    techniques and may be appropriate for moderate risk data where no determined attacker
    with adequate means exists.


    +   - *Cryptographic erasure* or *Cryptoshredding* is a form of purging that utilizes
    encryption and the secure destruction of the cryptographic key to render data
    unreadable. This is effectively a positive denial-of-service attack and is often
    the only option available for cloud-based environments due to loss of physical
    control over storage media, the use of SSDs for storage that cannot be reliably
    overwritten, and the dispersion of data in cloud environments. Organizations utilizing
    the cloud can encrypt all data using organization-controlled keys, which can be
    securely destroyed, rendering data stored in the cloud economically infeasible
    to recover. Modern smartphone, tablet, and workstation operating systems also
    implement this feature using technologies such as Apple FileVault or Microsoft
    BitLocker, which save costs of purging and extends the useful life of storage
    media.


    +   - **Destroy:** The most drastic option that renders storage media physically
    unusable and data recovery infeasible using any known methods. Destruction techniques
    include physical acts like disintegrating, pulverizing, melting, incinerating,
    and shredding. It is unlikely a CSP will provide the capability for cloud consumers
    to physically destroy media, but this may be an appropriate control for the CSP
    to implement for information system components that contain sensitive customer
    data but that are no longer needed.


    The choice of data deletion procedures should be driven by a cost-benefit analysis.
    Cost including replacement of the media, fines, or legal settlements if a data
    breach'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'occurs, and the actual implementation of destruction must all be taken into
    account. As an example, hard drives containing high-sensitivity information may
    simply be cleared if they are to be reused in the same environment where the risk
    of a data breach is low, but may be physically destroyed if they are leaving the
    organization’s control. The full NIST SP 800-88 document covering data destruction
    and associated risk factors can be found here: csrc.nist.gov/publications/detail/sp/800-88/rev-1/final.


    # Data Archiving Procedures and Mechanisms


    Data archiving refers to placing data in long-term storage for a variety of purposes:
    optimizing storage resources in live production environments and meeting the organization’s
    retention requirements are both examples. The procedures and mechanisms in place
    need to ensure adequate security controls are in place for data as it moves from
    live systems to the archive, which may implement significantly different controls
    for access control and cryptography.


    Access controls for production environments are typically more complex than for
    archive environments, but that does not mean the archive deserves less rigor.
    Archivists or retention specialists may be the only users authorized to routinely
    access data in the archive, and procedures should be in place to request, approve,
    and monitor access to the data. Procedures governing the handoff between production
    and the archive should be documented as well, to ensure the change of responsibility
    is well understood by the personnel assigned.


    Cryptography serves multiple important roles for archival data just as it does
    in other environments. Data in transit to an archive will need to be protected
    for both confidentiality and integrity; for cloud-based systems or backup tools,
    this will entail encrypting data in transit to preserve confidentiality as the
    data moves between on-premises and cloud environments, and verifying the integrity
    of data copied to the cloud environment.


    Hashing may be appropriate for data with high integrity requirements. Data can
    be hashed at a later date when accessed from the archive, and the values compared
    to an initial hash from when the data was first stored. This will identify if
    changes have occurred. In some cases, integrity can also be verified by loading
    backup data into a production-like environment to verify it is readable and conforms
    to expectation. This would be particularly appropriate for a cloud hot site where
    failover needs to happen quickly.


    In addition to mandated retention periods, security practitioners must understand
    requirements for data formats mandated by their legal and regulatory obligations.
    For high-sensitivity data, particularly in the financial services industry, there
    may be a requirement for data to be stored immutably; that is, in a format where
    it cannot be changed. The integrity of the data is required to support investigations
    of regulated activity such as financial transaction, which will drive decisions
    on where and how to store the data. Once data is written, it will require adequate
    physical and environmental protections as well, to prevent theft, tampering, or
    degradation.'
  merge: -1
  img_proc: true
