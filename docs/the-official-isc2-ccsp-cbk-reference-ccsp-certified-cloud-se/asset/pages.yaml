- pgno: 92
  md: 'IRM is often implemented to control access to data that is designed to be shared
    but not freely distributed. This can include sensitive business information shared
    with trusted partners but not the world at large, copyrighted material to which
    a user has bought access but is not authorized to share, and any information that
    has been shared under a license that stipulates limitations on the use or dissemination
    of that information.


    # Objectives


    Most IRM solutions are designed to function using an access control list (ACL)
    for digital files, which specifies users and authorized actions such as reading,
    modifying, printing, or even onward sharing. Many popular file sharing SaaS platforms
    implement these concepts as sharing options, which allow the document owner to
    specify which users can view, edit, download, share, etc.


    IRM systems should ideally possess a number of attributes, including the following:


    +   - **Persistence:** The ACL and ability to enforce restrictions must follow
    the data. Some tools allow users to set a password required to open a document,
    but the tools also allow other users to disable this password-based access control,
    which defeats the purpose.

    +   - **Dynamic policy control:** The IRM solution must provide a way to update
    the restrictions, even after a document has been shared. If users no longer require
    access, the IRM solution must provide a way for the document owner to revoke the
    permission and enforce it the next time the document is opened regardless of its
    location. This leads to a key usability challenge, as IRM tools often require
    users to have an active network connection so the policy can be validated before
    access is granted.

    +   - **Expiration:** IRM tools are often used to enforce time-limited access
    to data as a form of access control, which reduces the amount of time a bad actor
    has to exploit a document to which they have gained unauthorized access. While
    this can be an element of dynamic policy control, which requires the ability to
    query an IRM server, it may also be done by calculating and monitoring a local
    time associated with the file. One example is the timer that begins when a user
    first starts playback of a rented digital movie and restricts the user''s ability
    to play the movie to 24 hours after that initial start time.

    +   - **Continuous audit trail:** Access control requires the ability to hold
    users accountable for access to and use of data. The IRM solution must ensure
    that protected documents generate an audit trail when users interact with protected
    documents to support the access control goal of accountability.

    +   - **Interoperability:** Different organizations and users will have a variety
    of tools, such as email clients and servers, databases, and operating systems.
    IRM solutions must offer support for users across these different system types.
    Document-based'
