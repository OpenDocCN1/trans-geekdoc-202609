- pgno: 273
  md: '(SSAE 18) was made effective in May 2017, and added additional sections and
    controls to further enhance the content and quality of SOC reports.


    The international counterpart of the AICPA, the International Auditing and Assurance
    Standards Board, issues the International Standard on Assurance Engagements (ISAE).
    There are a number of differences between the two standards, and a security professional
    should always consult the relevant business departments to determine which audit
    report(s) will be used when assessing cloud systems.


    # Cloud Security Alliance


    The Cloud Security Alliance (CSA) offers a Security Trust Assurance and Risk (STAR)
    certification that can be used by cloud service providers, cloud customers, or
    auditors and consultants to ensure compliance to a desired level of assurance.
    (See downloads .cloudsecurityalliance.org/assets/research/security-guidance/security-guidance-v4-FINAL.pdf.)
    STAR consists of three levels of certification:


    +   - **Level 1:** Self-Assessment is a complimentary offering that documents
    the security controls provided by various cloud computing offerings, helping users
    assess the security of cloud providers they currently use or are considering using.

    +   - **Level 2:** Attestation is a collaboration between CSA and the AICPA to
    provide guidelines for CPAs to conduct SOC 2 engagements using criteria from the
    AICPA (Trust Service Principles, AT 101) and the CSA Cloud Controls Matrix. STAR
    Attestation provides for rigorous third-party independent assessments of cloud
    providers.

    +   - **Level 3:** Continuous monitoring through automated processes that ensure
    security controls are monitored and validated at all times.


    # Restrictions of Audit Scope Statements


    Audits are a fact of life to ensure compliance and prevent sometimes catastrophic
    effects of security failures. Though no employee relishes the thought of undergoing
    an audit, they are somewhat of a necessary evil to ensure that risks are adequately
    controlled and compliance is met. Any audit must be appropriately scoped to ensure
    that both the client and the auditor understand what is in the audit space and
    what is not. This is almost always driven by the type of report being prepared.
    An audit scope statement would generally include the following:


    +   - Statement of purpose and objectives

    +   - Scope of audit and explicit exclusions

    +   - Type of audit

    +   - Security assessment requirements'
  merge: -1
  img_proc: true
- pgno: 274
  md: '+   - Assessment criteria and rating scales

    +   - Criteria for acceptance

    +   - Expected deliverables

    +   - Classification (for example, secret, top secret, public, etc.)


    Any audit must have parameters set to ensure the efforts are focused on relevant
    areas that can be effectively audited. Setting these parameters for an audit is
    commonly known as the *audit scope restrictions*. Why limit the scope of an audit?
    Audits are expensive endeavors that can engage highly trained (and highly paid)
    content experts. In addition, the auditing of systems can affect system performance
    and, in some cases, require the downtime of production systems.


    Scope restrictions can be of particular importance to security professionals.
    They can spell out the operational components of an audit, such as the acceptable
    times and time periods (for example, days and hours of the week) as well as the
    types of testing that can be conducted against which systems. Carefully crafting
    scope restrictions can ensure that production systems are not impacted adversely
    by an auditor''s activity. Additionally, audit scope statements can be used to
    clearly define what systems are subject to audit. For example, an audit on HIPAA
    compliance would only include systems that process and store PHI.


    # Gap Analysis


    As a precursor to a formal audit process, a company may engage in a gap analysis
    to help identify potential trouble areas to focus on. A gap analysis is the comparison
    of a company''s practices against a specified framework and identifies any “gaps”
    between the two. These types of analysis are almost always done by external parties
    or third parties to ensure that they are performed objectively without potential
    bias. Some industry compliance standards (such as HIPAA or PCI) may require an
    outside entity to perform such an analysis. The reasoning is that an outside consultant
    can often catch gaps that would not be obvious to personnel working in the area
    every day.


    If a gap analysis is being performed against a business function, the first step
    is to identify a relevant industry-standard framework to compare business activities
    against. In information security, this usually means comparison against a standard
    such as ISO/IEC 27002 (best-practice recommendations for information security
    management). Another common comparison framework used as a cybersecurity benchmark
    is the NIST cybersecurity framework.


    A gap analysis can be conducted against almost any business function, from strategy
    and staffing to information security. The common steps generally consist of the
    following:


    +   - Establishing the need for the analysis and gaining management support for
    the efforts.

    +   - Defining scope, objectives, and relevant frameworks.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '+   - Identifying the current state of the department or area (which involves
    the evaluation of the department to understand current state, generally involving
    research and interviews of employees).

    +   - Reviewing evidence and supporting documentation, including the verification
    of statements and data.

    +   - Identifying the “gaps” between the framework and reality. This highlights
    the risks to the organization.

    +   - Preparing a report detailing the findings and getting sign-off from the
    appropriate company leaders.


    Since a gap analysis provides measurable deficiencies and, in some cases, needs
    to be signed off by senior leadership, it can be a powerful tool for an organization
    to identify weaknesses in their efforts for compliance.


    # Audit Planning


    Any audit, whether related to financial reporting, compliance, or cloud computing,
    must be carefully planned and organized to ensure that the results of the audit
    are relevant to the objectives. Audits genevrallly consist of four phases, outlined
    in Figure 6.1.


    # Audit Process


    ![](img/31b2d0f6902e5b79691e4de3b480b89a_275_0.png)


    FIGURE 6.1 Four phases of an audit


    The four phases of an audit consist of the following:


    +   - **Audit planning**

    +     - Documentation and definition of audit objectives. This process is a collaborative
    effort to define what standards are being measured.'
  merge: -1
  img_proc: true
