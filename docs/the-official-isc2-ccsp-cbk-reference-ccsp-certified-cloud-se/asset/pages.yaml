    # Operating System Hardening through the Application of Baselines


    Hardening is the configuration of a machine into a secure state. Common hardening
    practices include changing default credentials, locking/disabling default accounts
    that are not needed, installing security tools such as anti-malware software,
    configuring security settings available in the OS, and removing or disabling unneeded
    applications, services, and functions.


    Prior to virtualization, the process of hardening an OS was often a manual task;
    once a system''s hardware was installed, an administrator had to manually install
    and configure the OS and any application software. The advent of virtualization
    introduced machine images, which are essentially templates for building a VM.
    All VMs created from the same image will have the same settings applied, which
    offers dual benefits of efficiency and security. Of course, the image cannot remain
    static—patches and other security updates must be applied to the image to ensure
    new VMs remain secure. Existing VMs must also be updated independently of the
    image, which is a concern of patching and configuration management disciplines.


    A modern OS has thousands of configuration options, so to speed this up, an organization
    may choose to create or use a baseline configuration. Baselines are simply a documented,
    standard state of an information system, such as access control requiring'
