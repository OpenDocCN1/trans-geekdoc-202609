    # Operating System Baseline Compliance Monitoring and Remediation


    A hardened OS implements many of the security controls required by an organization’s
    risk tolerance and may also implement security configurations designed to meet
    the organization’s compliance obligations. Once built, however, these systems
    do need to be monitored to ensure they stay hardened. This ongoing monitoring
    and remediation of any noncompliant systems must be part of the organization’s
    configuration management processes, designed to ensure no unauthorized changes
    are made, any unauthorized changes are identified and rolled back, and changes
    are properly approved and applied through a change control process.


    Monitoring and managing OS configuration against baselines can be achieved in
    a number of ways. Some are similar to legacy, on-prem techniques, while newer
    methods are also emerging, including the following:


    +   - **Use of a configuration management database (CMDB) and CM audits:** The
    organization’s CMDB should capture all configuration items (CIs) that have been
    placed under configuration management. This database can be used for manual audits
    as well as automated scanning to identify systems that have drifted out of their
    known secure state. For example, an auditor performing a manual audit could pull
    the registry file from a sample of Windows servers and compare the entries against
    the configuration baseline values. Any systems that deviate from the baseline
    should be reconfigured, unless a documented exception exists.'
