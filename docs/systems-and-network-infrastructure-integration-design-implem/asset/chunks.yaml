    和 `server4` 服务。通过使用 `NameVirtualHost`，我们将告知 Apache 第一个方向即 IP/端口。一旦执行了该方向，Apache
    将分析 `Host` 请求头中的名称并将其引导至 `<VirtualHost>` 块，该块通过 `ServerName` 指令指定名称。


