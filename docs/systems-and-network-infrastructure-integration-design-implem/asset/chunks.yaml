  fmt: '

    The command `router(config)#class-map match-all classname` stipulates that the
    packet must satisfy ALL criteria to belong to the class.


    The command `router(config)#class-map match-any classname` indicates that the
    packet must satisfy at least one of the criteria set in order for it to belong
    to a class.


    Once the service class has been created, we move on to specifying the criteria
    themselves. [Table 8.4](#c08.xhtml#table4) gives a few examples of this.


    **[Table 8.4.](#c08.xhtml#tableanchor4)** *Examples of classification criteria*


    | **Criterion** | **Explanation** |

    | --- | --- |

    | `router(config-cmap)#match input-interface interface name` | The packet must
    come from the input interface set in order to belong to the corresponding class
    |

    | `router(config-cmap)#match access-group ACL number` | The corresponding ACL
    determines whether the packet belongs to the class |

    | `router(config-cmap)#match protocol protocol name` | The protocol determines
    whether the packet belongs to the class |


    2) Definition of a QoS policy or `policy-map` in which each flow class is assigned
    a priority level. The definition of a policy can be used for tagging as well as
    bandwidth sharing. This stage represents the effective implementation of the QoS
    set according to the company''s needs. In concrete terms, the `class-map` will
    be used to apply QoS functions such as tagging, queuing, suppression, regulation
    and shaping.


    3) Application of the policy developed at the corresponding interface, either
    incoming or outgoing according to the need.


    The infrastructure schema adopted for this example is given in [Figure 8.8](#c08.xhtml#figure8).


    ![Figure 8.8. Topology of our example](images/fig8_8.jpg)


    **[Figure 8.8.](#c08.xhtml#figureanchor8)** *Topology of our example*


    ### Stage 1: creation of class-map or flow classes


    The first class-map to be defined concerns VoIP traffic:


    ```

    Router1(config)#class-map VOICE

    Router1(config-cmap)#match protocol rtp audio

    Router1(config) #exit

    ```


    The second class-map defined is dedicated to web traffic:


    ```

    Router1(config)#class-map match-any WEB

    Router1(config-cmap)#match protocol http

    Router1(config-cmap)#match protocol https

    Router1(config) #exit

    ```


    The third class-map to be defined pertains to FTP traffic:


    ```

    Router1(config)#class-map match-any TRANSFER

    Router1(config-cmap)#match protocol ftp

    Router1(config-cmap)#match protocol tftp

    Router1(config) #exit

    ```


    The final result is recapitulated below:


    ```

    Router1#show class-map

    Class Map match-any class-default (id 0)

    Match any

    Class Map match-any TRANSFER (id 1)

    Match protocol ftp

    Match protocol tftp

    Class Map match-all VOICE (id 2)

    Match protocol rtp

    Class Map match-any WEB (id 3)

    Match protocol http

    Match protocol https

    ```


    ### Stage 2: creation of policy-map


    A `policy-map` called `QOSPOLICY` is created using the following commands:


    ```

    Router1(config)#policy-map QOSPOLICY

    Router1(config-pmap)#class TRANSFER

    Router1(config-pmap-c)#bandwidth percent 10

    Router1(config-pmap-c)#random-detect dscp-based

    ```


    A `policy-map` called `QOSPOLICY` has now been created. Next, we begin with the
    `TRANSFER` `class-map`. With the `bandwidth` command, we assign at least 10% of
    the available bandwidth to it. The command `random-detect dscp-based`, an active
    WRED (Weighted Random Early Detection) technique specific to queue management
    in a router, sets the parameters for the decision to suppress packets according
    to their DSCP values.


    Next, we enter `policy-map-class` configuration mode to address the `VOICE` traffic
    class and assign its priority:


    ```

    Router1(config-pmap)#class VOICE

    Router1(config-pmap-c)#priority 256

    ```


    This traffic class will now have a maximum bandwidth of 256 kbps but no more,
    and its packets will be sent before other packets.


    Finally, we configure the `WEB` traffic class:


    ```

    Router1(config-pmap)#class WEB

    Router1(config-pmap-c)#bandwidth percent 60

    Router1(config-pmap-c)#random-detect dscp-based

    ```


    In this way, web traffic benefits from 60% of the bandwidth, and DSCP-based detection
    is used.


    ### Stage 3: application of policy-map


    We apply the `policy-map` at the `gi0/0` interface:


    ```

    Router1(config)#interface gi0/0

    Router1(config-if)#service-policy output QPOLICY

    ```


    ### Definition of a QoS policy or policy-map


    The definition of a policy can be used for tagging as well as bandwidth sharing.
    This stage represents the effective implementation of the QoS set according to
    the company''s needs. In concrete terms, the `class-map` will be used to apply
    QoS functions such as tagging, queuing, suppression, regulation and shaping.

    '
  trans: '


    命令 `router(config)#class-map match-all classname` 要求数据包必须满足所有标准才能属于该类。


    命令 `router(config)#class-map match-any classname` 表示数据包只需满足设定的标准中的至少一个即可属于该类。


    一旦创建了服务类，我们就开始指定具体的准则。表 8.4 提供了了一些示例。


    **表 8.4.** *分类准则示例*


    | **准则** | **解释** |

    | --- | --- |

    | `router(config-cmap)#match input-interface interface name` | 数据包必须来自设置的输入接口才能属于相应的类
    |

    | `router(config-cmap)#match access-group ACL number` | 相应的 ACL 决定了数据包是否属于该类 |

    | `router(config-cmap)#match protocol protocol name` | 协议决定了数据包是否属于该类 |


    2) 定义 QoS 策略或 `policy-map`，为每个流类分配优先级级别。策略的定义可以用于标记，也可用于带宽共享。这一阶段代表了根据公司需求对 QoS
    设置的有效实施。具体而言，`class-map` 将用于应用标记、队列、抑制、调节和整形等 QoS 功能。


    3) 根据需要，将开发的策略应用于相应的接口（入站或出站）。


    本示例采用的架构方案见图 8.8。


    ![图 8.8. 我们的示例拓扑](img/fig8_8.jpg)


    **图 8.8.** *我们的示例拓扑*


    ### 阶段 1：创建 class-map 或流类


    定义的第一个 class-map 涉及 VoIP 流量：


    ```

    Router1(config)#class-map VOICE

    Router1(config-cmap)#match protocol rtp audio

    Router1(config) #exit

    ```


    定义的第二个 class-map 用于 Web 流量：


    ```

    Router1(config)#class-map match-any WEB

    Router1(config-cmap)#match protocol http

    Router1(config-cmap)#match protocol https

    Router1(config) #exit

    ```


    定义的第三个 class-map 涉及 FTP 流量：


    ```

    Router1(config)#class-map match-any TRANSFER

    Router1(config-cmap)#match protocol ftp

    Router1(config-cmap)#match protocol tftp

    Router1(config) #exit

    ```


    最终结果汇总如下：


    ```

    Router1#show class-map

    Class Map match-any class-default (id 0)

    Match any

    Class Map match-any TRANSFER (id 1)

    Match protocol ftp

    Match protocol tftp

    Class Map match-all VOICE (id 2)

    Match protocol rtp

    Class Map match-any WEB (id 3)

    Match protocol http

    Match protocol https

    ```


    ### 阶段 2：创建 policy-map


    使用以下命令创建一个名为 `QOSPOLICY` 的 `policy-map`：


    ```

    Router1(config)#policy-map QOSPOLICY

    Router1(config-pmap)#class TRANSFER

    Router1(config-pmap-c)#bandwidth percent 10

    Router1(config-pmap-c)#random-detect dscp-based

    ```


    现在已经创建了一个名为 `QOSPOLICY` 的 `policy-map`。接下来，我们开始处理 `TRANSFER` `class-map`。通过 `bandwidth`
    命令，我们为其分配至少 10% 的可用带宽。命令 `random-detect dscp-based` 是一种路由器队列管理特定的主动 WRED（加权随机早期检测）技术，用于设置根据
    DSCP 值抑制数据包的决策参数。


    接下来，进入 `policy-map-class` 配置模式处理 `VOICE` 流量类并分配优先级：


    ```

    Router1(config-pmap)#class VOICE

    Router1(config-pmap-c)#priority 256

    ```


    该流量类现在将具有 256 kbps 的最大带宽且不会更多，其数据包将在其他数据包之前发送。


    最后，我们配置 `WEB` 流量类：


    ```

    Router1(config-pmap)#class WEB

    Router1(config-pmap-c)#bandwidth percent 60

    Router1(config-pmap-c)#random-detect dscp-based

    ```


    通过这种方式，Web 流量从 60% 的带宽，并使用了基于 DSCP 的检测。


    ### 阶段 3：应用 policy-map


    我们在 `gi0/0` 接口上应用 `policy-map`：


    ```

    Router1(config)#interface gi0/0

    Router1(config-if)#service-policy output QPOLICY

    ```


    ### QoS 策略或 policy-map 的定义


    策略的定义可以用于标记，也可用于带宽共享。这一阶段代表了根据公司需求对 QoS 设置的有效实施。具体而言，`class-map` 将用于应用标记、队列、抑制、调节和整形等
    QoS 功能。


    '
