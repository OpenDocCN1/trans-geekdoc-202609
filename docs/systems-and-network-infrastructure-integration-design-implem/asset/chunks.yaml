- raw: "### 6.3.3. *Saturation attacks*\n\nThe intent of this type of attack is to\
    \ overwhelm a company's server and paralyze its website for several hours, thus\
    \ blocking access to it without necessarily altering its content. These attacks\
    \ target the availability of information. TCP SYN flood attacks, smurfing, ping\
    \ flood attacks and UDP flood attacks are some examples of this type of attack.\n\
    \n### 6.3.4. *Repudiation attacks*\n\nThese attacks target responsibility. In\
    \ other words, repudiation consists of denying that an event or transaction has\
    \ actually taken place. Frauds such as MAC spoofing, IP spoofing and man-in-the-middle\
    \ are examples of repudiation attacks.\n\n## 6.4. Security mechanisms\n\nSecurity\
    \ mechanisms are means deployed to detect, prevent and fight against a security\
    \ attack on the assets of an IT system.\n\nAn IT system with its professional\
    \ and system assets needs security mechanisms to ensure basic levels of security,\
    \ that is, availability, integrity and confidentiality, and, if possible, the\
    \ remaining levels of security, authenticity and nonrepudiation, as well.\n\n\
    There are various defensive resources available. We generally do not limit ourselves\
    \ to a single means of securitization, but rather tend to favor a deep defense\
    \ approach which consists of installing multiple security technologies in order\
    \ to reduce the risk that any one security component will be compromised or break\
    \ down.\n\nThe concept of deep defense is based on the superimposition of multiple\
    \ levels of defense in order to have layers of security ready to act if the business's\
    \ primary security mechanism has been attacked.\n\n### 6.4.1. *Encryption tools*\n\
    \nThese days, the goal of encryption is to address issues of communications security\
    \ in general and to provide a number of security services such as confidentiality,\
    \ authentication, integrity, etc.\n\nEncryption algorithms, hash functions, electronic\
    \ signatures and digital certificates are some of the best-known examples of these\
    \ tools.\n\n### 6.4.2. *Antivirus programs*\n\nThese programs detect and eliminate\
    \ viruses, worms and Trojan horses, as well as other malware that can infect computers.\n\
    \n### 6.4.3. *Firewalls/IDS and IPS*\n\n#### 6.4.3.1. *Firewalls*\n\nHardware\
    \ or software firewalls are used to isolate areas of a network and to authorize\
    \ only certain flows in by filtering packets exchanged, in order to prevent intrusions.\n\
    \nThis filtering of packets takes place in the TCP/IP layer. Incoming and outgoing\
    \ packets are examined in terms of their source and destination IP addresses and\
    \ their port numbers in order to be authorized to pass or not. Packet filtering\
    \ functions with positive filtering rules, that is, what should be authorized\
    \ must be defined, and anything not explicitly authorized is automatically forbidden.\n\
    \nThis static packet filtering is enriched by additional rules to create what\
    \ is called *Stateful Packet Inspection* (SPI). SPI verifies that incoming data\
    \ packets are related to data packets previously sent, that is, that they belong\
    \ to a session initiated by the secured local network.\n\n ![Figure 6.2. The role\
    \ of a firewall](images/fig6_2.jpg)\n\n**Figure 6.2.** *The role of a firewall*\n\
    \nMost businesses have web and e-mail servers they wish to make accessible to\
    \ external visitors. These servers are thus placed between the private network\
    \ and the Internet on a separate segment of the network. This segment is governed\
    \ by less rigid security rules and is thus accessible from the outside, but relatively\
    \ isolated from the local network. Its objective is to prevent exterior access\
    \ to private machines in the business's internal network. This isolated network\
    \ segment is called a demilitarized zone (DMZ).\n\n![Figure 6.3. Demilitarized\
    \ zone (DMZ)](images/fig6_3.jpg)\n\n**Figure 6.3.** *Demilitarized zone (DMZ)*\n\
    \nProxies are a specific type of firewall consisting of an intermediary or proxy\
    \ server that relays requests from the internal network to an external network,\
    \ generally the Internet. These proxies also offer other functionalities such\
    \ as caching, authentication, anonymization and more refined filtering using advanced\
    \ filters.\n\n![Figure 6.4. Proxy operating principle](images/fig6_4.jpg)\n\n\
    **Figure 6.4.** *Proxy operating principle*\n\n#### 6.4.3.2. *Intrusion detection\
    \ systems (IDS) and intrusion prevention systems (IPS)*\n\nIDSs/IPSs detect and\
    \ warn of malicious behaviors by monitoring processes, for example, or observing\
    \ certain aspects of user and program behavior to detect suspicious activity based\
    \ on pre-established rules or statistics. Honeypots are practical tools to detect\
    \ intrusions.\n\n### 6.4.4. *VPNs*\n\nThese are virtual private networks constructed\
    \ over a public network (the Internet). They provide secure, cost-efficient WAN\
    \ links using encryption and tunneling techniques and are being used with increasing\
    \ frequency by businesses. A tunnel is a logical connection between arbitrary\
    \ end points which are VPN clients, servers or gateways.\n\nThere are two methods\
    \ of creating tunnels. In the first one, the tunnel is established in layer 3\
    \ of the OSI layer model. Another method directly involves layer 2 of the OSI\
    \ layer model, with the data packet from layer 3 being encrypted and then addressed\
    \ with the physical address.\n\n There are also site-to-site VPNs and remote access\
    \ VPNs. The main protocols are PPTP, L2TP, IPSEC and MPLS. The choice depends\
    \ on the performance and security requirements of the business in question:\n\n\
    – PPTP (Point-to-point Tunneling Protocol): a data link layer protocol responsible\
    \ for data encryption and compression. It is included in Windows operating systems\
    \ since it was developed by Microsoft. Its use is especially recommended for remote\
    \ access.\n\n– L2TP (Layer 2 Tunneling Protocol): a more advanced version of PPTP\
    \ and L2F. The structure and advantages of these two non-standardized methods\
    \ have been adopted and standardized into L2TP. While PPTP supports only the IP,\
    \ IPX and NetBEUI protocols, the L2TP protocol has the advantage of being able\
    \ to transport any network protocol into the PPP frame structure. This means that\
    \ it also has a significant overload and thus a low net data output. The L2TP\
    \ protocol works well with point-to-point virtual private networks as well as\
    \ remote access connections to service providers.\n\n– IPSEC: a protocol that\
    \ secures data exchange in the network layer. It is an extension of the Internet\
    \ protocol (IP) that includes encryption and authentication mechanisms. This makes\
    \ it possible to transport secured IP packets cryptographically over public, unsecured\
    \ networks. It is based on two mechanisms. The first mechanism, AH (Authentication\
    \ Header), is designed to ensure the integrity and authenticity of IP datagrams.\
    \ The data transmitted is not encrypted, so this mode does not guarantee confidentiality\
    \ of exchanges. The second mechanism, ESP (Encapsulating Security Payload), ensures\
    \ authentication as well as confidentiality via data encryption. Both mechanisms\
    \ are based on the IKE (Internet Key Exchange) protocol, which manages the keys\
    \ used.\n\nIPSec has two operating modes: transport and tunnel.\n\nTransport mode\
    \ is relatively easy to set up but has the disadvantage of not masking the IP\
    \ address since the external header is produced by the IP layer. This mode is\
    \ usually used between two hosts. In tunnel mode, data passes through the battery\
    \ of protocols until it reaches the IP layer, and then the IPSec layer adds a\
    \ new header to it, thus ensuring address masking. Tunnel mode is recommended\
    \ for use between two security gateways (router, firewall, etc.) in order to link\
    \ two remote sites, for example.\n\n88 Systems and Network Infrastructure Integration\
    \ ![Figure 6.5. IPsec operating modes with AH mechanism. For a color version of\
    \ the figure, see www.iste.co.uk/helali/systems.zip](images/fig6_5.jpg)\n\n**Figure\
    \ 6.5.** *IPsec operating modes with AH mechanism. For a color version of the\
    \ figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*"
