    \nThe hierarchical network model is based on a modular design that makes it possible\
    \ to upgrade the network in a simple, robust and redundant way.\n\nThis hierarchical\
    \ model has numerous advantages: scalability, redundancy, performance, security,\
    \ and ease of administration and maintenance.\n\n#### 4.3.1.2. *Design in Cisco\
    \ modules*\n\nCisco recommends a modular network design in different “blocks ”,\
    \ or modules in order to ensure the availability of the architecture, its ability\
    \ to be  easily upgraded and the management of increasingly complex network infrastructures\
    \ requiring connections to dedicated data centers often located outside the main\
    \ site of the business. Moreover, subsidiary sites require connectivity to the\
    \ core network on the company premises and employees wishing to be able to work\
    \ from home or remotely.\n\nThese modules which will be interconnected via the\
    \ core network are:\n\n– the distribution module, consisting of a group of access\
    \ switches and their distribution switches. This is the most common element and\
    \ the basic component of enterprise network design;\n\n– the service module is\
    \ responsible for services such as centralized LWAPP (Lightweight Access Point\
    \ Protocol) controllers, unified communications services, etc.;\n\n– the datacenter\
    \ module, or server battery, is responsible for the management and updating of\
    \ numerous data servers that are vital for business operations. All potential\
    \ actors – employees, partners and clients of the business – rely on the datacenter's\
    \ data and resources to create, collaborate and interact effectively;\n\n– the\
    \ enterprise edge module is composed of the Internet edge and the WAN edge. They\
    \ are responsible for providing connectivity for vocal, video and data services\
    \ internal and external to the company.\n\nIn further pursuit of the modularity\
    \ of more and more sophisticated and complex network infrastructures, Cisco has\
    \ also developed the Cisco Enterprise Architecture model, which breaks down the\
    \ enterprise network into functional areas (also called modules) while preserving\
    \ the access, distribution and network core layers.\n\nThe main components of\
    \ the Cisco Enterprise Architecture model are as follows:\n\n– Enterprise campus:\
    \ this is a group of structures interconnected in the form of a scalable network,\
    \ often composed of sub-modules: structural access, structural distribution, campus\
    \ network core and data center. These sub-modules ensure high availability thanks\
    \ to the hierarchical modular design, hardware and software redundancy, and the\
    \ reconfiguration of network pathways in the event of breakdown. It also enables\
    \ the optimization of network traffic and offers high-quality service and greater\
    \ security.\n\n–  Enterprise edge: this provides connectivity to voice, video\
    \ and data services external to the enterprise. It is at this level that security\
    \ and QoS strategies can be deployed, as all the packets exchanged between the\
    \ campus network and the exterior pass through this point. Intrusion detection\
    \ systems (IDS) and intrusion prevention systems (IPS) can also be configured\
    \ at this level.\n\n– Service provider edge: this provides Internet services,\
    \ switched telephone network services and WAN.\n\n## 4.4. Assessment of needs\
    \ and choice of equipment\n\nNetwork infrastructure equipment must be chosen with\
    \ great care. To do this, we must understand the volume and type of data transferred,\
    \ all of the users involved – and their needs, to group them into VLANs, for example\
    \ – as well as the servers required, and, above all, their use. Traffic-related\
    \ requirements such as required output, latency and packet loss must also be taken\
    \ into account.\n\nClient and server connections must be optimized on switches\
    \ to balance bandwidth. Thus, the choice of switches is an important one. There\
    \ are different types of switches:\n\n– switches with a fixed number of ports\
    \ (fixed-port switches);\n\n– modular chassis switches, to which can be added\
    \ multiport cards;\n\n– stackable switches, which are linked together by a special\
    \ cable and constitute a middle ground in terms of cost between fixed-port switches\
    \ and modular chassis switches.\n\nThere are other criteria that can be used in\
    \ the choice of switches, such as port density (the number of ports in a switch),\
    \ port output and link aggregation, which can be a solution to increase output.\
    \ Another function may also be of interest, PoE, which enables IP telephones and\
    \ wireless terminals to be electrically powered via Ethernet cable.\n\nTo sum\
    \ up, a network must be designed hierarchically. A study of users' roles and usages\
    \ should be conducted, server placement optimized and a decision made about which\
    \ types of switches are to be installed: fixed, modular or stackable. Port density\
    \ must also be determined, as well as output per port, link aggregation and PoE\
    \ functionality for the handling of IP telephones and wireless terminals if needed.\n\
    \n##### *Some design rules*\n\n– In principle, a network should be designed hierarchically.\
    \ The hierarchical model is a reference point, but the network should be adapted\
    \ to suit the needs of each enterprise.\n\n– Each layer of the hierarchical model\
    \ involves different configurations, particularly the access layer, which requires\
    \ certain actions on the part of the administrator (status setting of each switch\
    \ port, trunk installation, security, etc.).\n\n– A study of user roles and usages\
    \ should be conducted for optimized clustering.\n\n– An optimal architecture for\
    \ the network should be chosen, in particular topology design, IP ranges for different\
    \ LANs/VLANs, and number of LANs/VLANs required.\n\n– The types of switches should\
    \ be carefully chosen: fixed, modular or stackable, as well as their density,\
    \ output per port, link aggregation and PoE functionality.\n\n– Each layer should\
    \ contain a pair of switches.\n\n– Each switch should be connected to the upper\
    \ layer with two links for redundancy.\n\n– Each pair of switches should be connected\
    \ to the distribution layer with a link but access layer switches should not be\
    \ connected to one another.\n\n– VLANs should not be extended beyond the distribution\
    \ layer.\n\n## 4.5. Chapter summary\n\n![](images/fig4_u1.jpg)"
