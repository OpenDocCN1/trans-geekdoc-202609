    # 4 Design of Network Infrastructures


    > “Well begun is half done.”

    > Aristotle


    – Recalling the theoretical concepts related to IT networks.

    – Describing the approaches, methods and models of network design.

    – Understanding the hierarchical model and its three layers, as well as the way
    in which they are used in network design.

    – Understanding the methodologies and models of Cisco network architecture design.


    ## 4.1 Introduction


    The design of IT networks constitutes a vital stage in the implementation of an
    IT infrastructure. Meticulous design ensures proper functioning of the network
    environment as well as its possible growth.


    In addition, design has become an arduous task as network environments become
    more and more complex, with diversified equipment and media, as well as interconnections
    with other external networks.


    Therefore, it is imperative to take all of these aspects into account in order
    to design a stable, high-performance and upgradeable network infrastructure.


    A successful design should be:


    – functional: the network infrastructure must satisfy the requirements of the
    enterprise defined in the specifications and must enable users to carry out their
    work under the best possible conditions;

    – upgradeable: the network to be designed must demonstrate the capacity for expansion.
    Consequently, designers must provide for the growth of the network infrastructure
    without being forced to make major changes to the initial design;

    – adaptive: the design must be capable of integrating new technologies;

    – easy to manage: from the design phase onward, mechanisms must be provided for
    to facilitate the management and monitoring of the network, in order to ensure
    its stable functioning.


    The infrastructure designer must pay attention to performance indicators such
    as response time, speed of communication, cost and availability to set up efficient,
    optimized networks. To carry out these tasks properly, the designer must base
    his or her actions on the breakdown approach, since the more a task is divided,
    the easier the management becomes.


    ## 4.2 The founding principles of networks


    ### 4.2.1 Definition and preliminaries


    A communications network is all of the hardware and software resources interconnected
    by a wired or wireless transmission system, thus ensuring the transmission and
    exchange of information between different entities. Networks are bound by certain
    norms and specifications depending on their architecture, geographical coverage,
    transmission speed and the nature of the information transmitted.


    Depending on the type of information exchanged and the nature of the equipment
    involved, we differentiate the following types of networks:


    – telephone networks: these networks are used to carry the voice between telephone
    sets. These are the oldest type of network (switched telephone network – `STN`,
    `GSM`);

    – broadcasting networks: these networks broadcast television channels from television
    studios to private individuals (`Eutelsat`);

    – digital data networks: these networks are designed to exchange digital data
    between IT equipment and to share IT resources (such as `Frame Relay`).


    The current tendency is to combine these three types of networks into a single
    converged network that can be used to transmit any type of information. These
    new networks, also called next-generation networks (`NGN`), are becoming extremely
    popular.


    In the following sections, we will focus particularly on digital data networks,
    which enable reductions in cost thanks to the sharing of hardware and software
    resources as well as the ease of communication.


    ### 4.2.2 Classification of digital data networks


    Several criteria can be used to classify networks, such as operating mode, that
    is, client/server networks or peer-to-peer, nature of transmission support (wired
    or wireless), output, and size or distance of the network. This last criterion
    is most widely used. There are `PAN` (Personal Area Networks), `LAN` (Local Area
    Networks), `MAN` (Metropolitan Area Networks) and `WAN` (Wide Area Networks).


    ![Figure 4.1. Standard network classifications](images/fig4_1.jpg)


    **Figure 4.1.** Standard network classifications


    A digital data network is composed of a physical or hardware part and a logic
    or software part.


    ### 4.2.3 Components of a network


    #### 4.2.3.1 Hardware part


    A network is composed of a set of equipment that can be classified as follows:


    – Terminal equipment: this represents the hosts at the end of a communication
    and can be computers, workstations, servers, printers, etc.

    – transmission supports: they are coaxial cables, twisted pair cables, optical
    fibers, Hertzian beams, radio waves, etc.

    – interconnection equipment: they are `hubs`, `switches`, `bridges`, `routers`,
    `gateways`, etc.


    – Routers: they are network layer hardware constituting one of the most powerful
    items of equipment in this layer. This equipment is used to interconnect different
    IP networks and to segment the local network into multiple single physical and
    logical networks. It is also used to interconnect remote networks such as the
    Internet and to transfer IP traffic using its routing table to dynamically determined
    correct destinations.

