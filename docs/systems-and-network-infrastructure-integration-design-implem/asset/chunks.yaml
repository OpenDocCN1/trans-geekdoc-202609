- raw: "The ITSEC (Information Technology Security Evaluation Criteria) European standard\
    \ defines a security policy as being “the laws, rules, and practices that govern\
    \ the way in which sensitive information and other resources are managed, protected,\
    \ and distributed within a specific system”.\n\nIt is concretized by a set of\
    \ reference documents which include the security rules to be applied and complied\
    \ with. It also defines the security objectives set by the business and the mechanisms\
    \ and procedures deployed to ensure them.\n\nThe securitization of an organization\
    \ or enterprise's network and system infrastructures must be based on the security\
    \ policy in effect. The choice and implementation of different security mechanisms\
    \ and solutions depends on the corresponding security policy.\n\n## 6.6. Chapter\
    \ summary\n\n![](images/fig6_u1.jpg)\n\n## Note\n\n1.  This chart is also available\
    \ at [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)\n\
    \n# **7**  \n\nVirtualization and Cloud Computing\n\n> “You don't need to be physically\
    \ out in the world anymore to participate in it. I'm 90% virtual.”\n\n> \n\n>\
    \ Karl Lagerfeld\n\n– Understanding the concept of virtualization\n\n– Learning\
    \ the virtualization domains\n\n– Determining the advantages and disadvantages\
    \ of virtualization\n\n– Understanding the different types of virtualization\n\
    \n– Understanding the concept of cloud computing\n\n– Learning the different service\
    \ models pertaining to cloud computing and their typologies\n\n## 7.1. Introduction\n\
    \nThe setting up or upgrading of IT infrastructures requires significant financial\
    \ investment for every business. In an increasingly difficult economic climate,\
    \ any solution that enables a reduction in costs is more than relevant. This category\
    \ includes virtualization, which helps businesses to create an IT infrastructure\
    \ that is easy to manage and low cost, thus eliminating dependence on a single\
    \ hardware provider and ensuring more resilient, flexible and agile IT functions.\n\
    \nAdditionally, cloud computing, based on the concept of virtualization, is of\
    \ great interest to businesses insofar as it enables a new way of organizing information\
    \ systems as well as another approach to managing different IT resources. The\
    \ goal remains higher profitability for the business, as well as scalability and\
    \ the capacity for expansion.\n\n## 7.2. Virtualization\n\n### 7.2.1. *Definition*\n\
    \nVirtualization includes a range of technologies offering IT resources that can\
    \ be used flexibly and on demand, independently of the underlying hardware infrastructure.\
    \ It can be seen as a layer that separates the operating system from the hardware\
    \ so that the various resources can operate more efficiently. This layer helps\
    \ to create an environment suited to specifications instead of adapting specifications\
    \ to fit within the limitations of the hardware environment.\n\nA piece of IT\
    \ hardware is initially designed to make a single operating system and several\
    \ applications function. Virtualization makes it possible to bypass this limitation\
    \ and run multiple operating systems on the same hardware support, thus optimizing\
    \ the use of hardware resources.\n\nVirtualization can affect the entirety of\
    \ the hardware environment, that is, the processor, memory, hard disk, peripheral\
    \ devices and network components, so that each virtual machine has its own virtual\
    \ resources. Consequently, every virtual machine is completely independent and\
    \ will not be disturbed or disrupted by the functioning of other virtual machines\
    \ (shutdown, startup, installation of programs, etc.) that may coexist on the\
    \ same physical machine.\n\n### 7.2.2. *Benefits of virtualization*\n\nVirtualization\
    \ technology offers a number of benefits:\n\n– pooling of resources: the setting\
    \ up of multiple logically separated systems on a single physical machine optimizes\
    \ the use of these systems;\n\n– ease of configuration, deployment, upgrading\
    \ and migration of virtual machines;\n\n– ability to test a new system without\
    \ disrupting the base operating system;\n\n– reduction of operating energy consumption:\
    \ using less hardware results in lower electricity consumption and fewer upkeep\
    \ and maintenance operations;\n\n– improved security: network security is increased\
    \ because guest operating systems are not visible to attackers;\n\n– improved\
    \ availability: a cluster can be formed of two physical servers with virtual machines,\
    \ which can be automatically copied from one server to another in the event of\
    \ problems. Moreover, the snapshot or instant capture function of a virtual server\
    \ makes it possible easily to reinstall a server configuration;\n\n– improved\
    \ prevention and management of malfunctions as well as system activity resumption\
    \ thanks to automatic recovery. Virtual servers can be simply restored in the\
    \ event of problems due to their portability, since the physical server sees them\
    \ as a series of files;\n\n– scalability via the rapid deployment of new application\
    \ servers;\n\n– the supervision function is greatly simplified and centralized;\
    \ a single monitoring software program supervises all virtual servers.\n\n###\
    \ 7.2.3. *Areas of application*\n\n#### 7.2.3.1. *Virtualization of applications*\n\
    \nThe virtualization of applications consists of adding an additional software\
    \ layer between an application and the operating system through which all file\
    \ reading, modification or system registry files must pass in order to redirect\
    \ them transparently toward a virtual location. The end goal is to improve portability\
    \ and compatibility of applications by isolating them from the host operating\
    \ system. In this way, multiple applications can function on a single operating\
    \ system without encountering compatibility problems, in the registry, for example.\
    \ It is also possible for multiple versions of one application to run on a single\
    \ operating system. Wine, PlayOnLinux and CrossOver are some examples of this.\n\
    \n#### 7.2.3.2. *Virtualization of servers*\n\nThe principle here is to make multiple\
    \ virtual servers function on a single physical server in order to optimize the\
    \ use of its capacity. Studies have shown that servers use an average of 15% of\
    \ their capacity. This technique enables a business to save in terms of physical\
    \ infrastructures, specifically with regard to space occupied, electricity consumption,\
    \ climate control and staff needed for administration.\n\n![Figure 7.1. Virtualization\
    \ of servers. For a color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig7_1.jpg)\n\
    \n**Figure 7.1.** *Virtualization of servers. For a color version of the figure,\
    \ see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*\n\
    \n#### 7.2.3.3. *Virtualization of storage*\n\nThe objective of this is to provide\
    \ advanced functionality in terms of storage. The principle is that various storage\
    \ resources are brought together into a single logical storage device. This procedure,\
    \ also called storage abstraction, enables the user (server, application or workstation)\
    \ to access only one logical storage resource through an intermediary layer composed\
    \ of servers, software and network switches, which intercepts outgoing server\
    \ traffic and transfers it to physical storage devices according to specific protocols.\n\
    \nThis virtualization ensures independence between the management of the physical\
    \ storage system (disks, storage bays) and its attached servers, and enables applications\
    \ to separate the physical management of disks (and storage bays) from the servers\
    \ that use them, which also reduces the high cost of storage management.\n\n Storage\
    \ virtualization enables:\n\n– the addition of a new storage device without interruption\
    \ of service;\n\n– the conglomeration of multiple heterogeneous storage devices\
    \ into a single logical storage entity;\n\n– dynamic reallocation of storage space\
    \ according to application server needs.\n\nThis virtualization is used in NAS\
    \ and SAN networks.\n\n#### 7.2.3.4. *Virtualization of networks*"
