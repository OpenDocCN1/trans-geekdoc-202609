    \ and devices should be chosen according to need, strictly implemented and regularly\
    \ verified.\n\n#### 6.4.5.9 Training and awareness\nInformation system security\
    \ involves a human and social component that is as important as the technological\
    \ component. Even the best protection methods will fail if they are in the hands\
    \ of inexperienced, untrained, ill-informed users. Therefore, the managers of\
    \ technical infrastructures and networks must work to inform, train and increase\
    \ awareness among users with regard to security issues. They must also stay informed\
    \ about new attacks and threats, subscribe to alert bulletins from `CERT` and\
    \ other organizations that broadcast information on security and to specialized\
    \ journals, consult specialized forums regularly, attend conferences on the subject\
    \ and, above all, apply the lessons learned.\n\n**Table 6.1. Security means and\
    \ services**\n\n| Security service | Means of security |\n| --- | --- |\n| Confidentiality\
    \ | Encryption techniques |\n| Integrity | Hash functions |\n| Availability |\
    \ Redundancy, backup |\n| Authenticity | Certificate, biometry |\n| Nonrepudiation\
    \ | Signature, electronic notary |\n\n## 6.5. Security management systems: norms\
    \ and security policies\n\n### 6.5.1. Norms\nSecurity is multidisciplinary. It\
    \ has multiple aspects, in this context ethical, legislative, technological, methodological\
    \ and normative.\n\nThe securitization of an information system is a relatively\
    \ arduous task requiring an IT security management system to guide it.\n\nA management\
    \ system is defined by the `ISO` as “a system enabling the establishment of a\
    \ policy and objectives and the attainment of these objectives”. It can be considered\
    \ as a set of organizational measures and techniques targeting specific objectives.\
    \ These systems are based on reference sources that formalize policies and procedures\
    \ so that they can be audited.\n\nThe implementation of these information security\
    \ management systems, or `ISMS`, requires material, human and financial resources,\
    \ an investment that is justifiable insofar as these security management systems\
    \ increase reliability. Moreover, the fact of being audited or even certified\
    \ by a standardization organization increases trust and confidence in a business\
    \ on the part of its partners.\n\nThe `2700X` family of `ISO` norms sets the standards\
    \ for information security management systems (`ISMS`). We are referring more\
    \ specifically here to norm `ISO27001`, which sets requirements for the setup\
    \ of an `ISMS`, and norm `ISO27002`, which provides a catalogue of best practices\
    \ for information security management.\n\nNorm `ISO27001` relies on a process-based\
    \ approach, and more precisely on the Deming wheel process, or `PDCA` model (for\
    \ `Plan`, `Do`, `Check`, `Act`):\n\n- the `Plan` phase consists of defining the\
    \ perimeter to be secured, gauging the risks and selecting security measures;\n\
    - the `Do` phase consists of planning how risks will be addressed, designing significant\
    \ indicators, training personnel and managing incidents;\n- the `Check` phase\
    \ uses controls, audits and review to regularly assess the current state of the\
    \ information system's security;\n- the `Act` phase involves the implementation\
    \ of corrective, preventive and improvement-related actions in the event that\
    \ the predetermined objectives have not been met.\n\n### 6.5.2. The idea of security\
    \ policy\n"
