    then the port defines the COS values of all frames (tagged or not) at 3. Previously
    configured trust values are thus disregarded.


    *Fourth case*: a port in access mode to to which a PC and an IP telephone are
    connected.


    The following command is used to tell the Cisco IP telephone to tag data traffic
    coming from a PC connected to the same port with a predetermined class of service
    (`COS`) value. The objective of this is to prevent the PC from tagging its frames
    with the VLAN voice tag and thus not assigning the same priority to voice and
    data traffic:


    ```

    Switch(config-if)#switchport priority extend cos [0..7]

    ```


    It is now possible for a user to tag the PC data with a `dot1q` frame with a higher
    `COS` value. To avoid this situation and keep giving higher priority to voice
    traffic, the following command can be used:


    ```

    Switch(config-if)>mlsqos trust device cisco-phone

    ```


    After classification comes tagging. Mapping tables between `COS` and `DSCP` and
    vice versa are created with default values and then activated. For example, the
    following command gives the correspondence between `COS` values and (default)
    `DSCP` values:


    ```

    Switch# shmlsqos maps cos-dscp

    ```


    `Cos-dscp map`:


    `cos`: 0 1 2 3 4 5 6 7

    __________

    `dscp`: 0 8 16 24 32 40 48 56


    The `COS-DSCP` correspondence table is shown in [Table 8.5](#c08.xhtml#table5).


    **[Table 8.5.](#c08.xhtml#tableanchor5)** *COS-DSCP correspondence table*


    | **COS** | **DSCP (decimal)** | **DSCP** |

    | --- | --- | --- |

    | 0 | 0 | default |

    | 1 | 8 | CS1 |

    | 2 | 16 | CS2 |

    | 3 | 24 | CS3 |

    | 4 | 32 | CS4 |

    | 5 | 40 | CS5 |

    | 6 | 48 | CS6 |

    | 7 | 56 | CS7 |


    To manage VoIP traffic, the required `DSCP` value is `EF` (Express Forwarding),
    as shown in [Figure 8.9](#c08.xhtml#figure9) in the first line.


    In our case, the port is configured to trust the `COS` value (`mlsqos trust cos`).
    Here, the switch calculates the `DCSP` value `CS5` (40) to obtain `COS` value
    5 from the `COS-DSCP` table. Voice traffic is thus identified by the `DSCP` value
    `CS5`. This is not the desired value. To obtain the `DSCP` value `EF`, we use
    the following command:


    ```

    Switch(config)# mlsqos map cos-dscp0 8 16 24 32 46 48 56

    ```


    ![Figure 8.9. Examples of the application and corresponding DSCP values. For a
    color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig8_9.jpg)


    **[Figure 8.9.](#c08.xhtml#figureanchor9)** *Examples of the application and corresponding
    DSCP values. For a color version of the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    The result is therefore


    **Table 8.6.** *Modified COS-DSCP correspondence table*


    | **COS** | **DSCP (decimal)** | **DSCP** |

    | --- | --- | --- |

    | 0 | 0 | default |

    | 1 | 8 | CS1 |

    | 2 | 16 | CS2 |

    | 3 | 24 | CS3 |

    | 4 | 32 | CS4 |

    | 5 | 46 | EF |

    | 6 | 48 | CS6 |

    | 7 | 56 | CS7 |


    [Table 8.7](#c08.xhtml#table7) recapitulates the correspondences between `COS`
    and `DSCP` values.


    **[Table 8.7.](#c08.xhtml#tableanchor7)** *Complete COS-DSCP table*


    | **COS** | **DSCP (decimal)** | **DSCP** |

    | --- | --- | --- |

    | 0 | 0 | default |

    | 1 | 8 | CS1 |

    | 2 | 16 | CS2 |

    | 3 | 24 | CS3 |

    | 4 | 32 | CS4 |

    | 5 | 46 | EF |

    | 6 | 48 | CS6 |

    | 7 | 56 | CS7 |


    ### COS-DSCP Mapping Details


    The `COS-DSCP` correspondence table is used to map traffic priority levels between
    layer 2 and layer 3.


    ### Configuration for VoIP Traffic


    To manage VoIP traffic, the required `DSCP` value is `EF` (Express Forwarding).
    In our case, the port is configured to trust the `COS` value (`mlsqos trust cos`).
    Here, the switch calculates the `DCSP` value `CS5` (40) to obtain `COS` value
    5 from the `COS-DSCP` table. Voice traffic is thus identified by the `DSCP` value
    `CS5`. This is not the desired value. To obtain the `DSCP` value `EF`, we use
    the following command:


    ```

    Switch(config)# mlsqos map cos-dscp0 8 16 24 32 46 48 56

    ```


    ### Verification of Configuration


    The result is the modified `COS-DSCP` correspondence table as shown in Table 8.6.
    To verify the configuration on an interface, use the following command:


    ```

    Switch# show interfaces fa/1 switchport

    ```

