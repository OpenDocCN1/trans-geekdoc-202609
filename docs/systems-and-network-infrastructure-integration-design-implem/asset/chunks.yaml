    # RSVP (Resource Reservation Protocol)


    RSVP is used to reserve resources. It is used by hosts requiring well-defined
    `QoS` for specific flows as well as the routers located along the path of these
    flows. Memory resources on the crossed routers are reserved by the source via
    signaling messages messages. `QoS` modification is possible following a request
    by the receiver. `QoS` is not integrated into each packet, but is negotiated with
    network equipment; this is what we refer to as end-to-end `QoS`. `RSVP` is a signaling
    or control protocol and does not transport user data.


    ![Figure 8.2. Basic principles of RSVP. For a color version of the figure, see
    www.iste.co.uk/helali/systems.zip](images/fig8_2.jpg)


    **Figure 8.2.** *Basic principles of `RSVP`. For a color version of the figure,
    see [`www.iste.co.uk/helali/systems.zip`](http://www.iste.co.uk/helali/systems.zip)*


    This `IntServ` model ensures fine granularity and isolates each flow from the
    others. However, it is relatively complex and costly. It also comes with problems
    of scalability (resizing to a large scale). It can be deployed on intranets (`LANs`)
    but would be difficult to use on the scale of a service provider, for example.


    ## DiffServ


    `DiffServ` is based on differentiating between packets according to their class.
    `QoS` is managed by class and represents an aggregation of multiple flows. Thus,
    multiple classes with different qualities of service are defined by means of packet
    tagging from the source. Once a packet has been classified and tagged by the switch
    or router, a type of processing called per-hop behavior (`PHB`) is applied to
    it. `PHB` identifies the processing of a packet at each hop all along the path
    from the source to the destination. Three types of `PHB` are currently used:


    - `PHB` by default, which corresponds to the best effort model;

    - `EF` (Expedited Forwarding), which ensures that each node configured with `DiffServ`
    guarantees minimum values for latency, jitter and packet loss. This guarantee
    is necessary for real-time applications such as voice and video;

    - `AF` (Assured Forwarding) provides lower quality levels than `EF` and is suitable
    for non-real-time applications.


    Tagging consists of modifying the headers of `IPv4` packets entering the `TOS`
    (Type of Service) field, replaced later by the `DSCP` (Differentiated Service
    Code Point) field as shown in [Figure 8.3](#c08.xhtml#figure3), as well as the
    headers of `IPv6` packets and, more specifically, the traffic class field (see
    [Figure 8.4](#c08.xhtml#figure4)).


    ![Figure 8.3. IPv4 header and TOS/DSCP fields. For a color version of the figure,
    see www.iste.co.uk/helali/systems.zip](images/fig8_3.jpg)


    **[Figure 8.3.](#c08.xhtml#figureanchor3)** `IPv4` header and `TOS`/`DSCP` fields.
    For a color version of the figure, see [`www.iste.co.uk/helali/systems.zip`](http://www.iste.co.uk/helali/systems.zip)*


    ![Figure 8.4. IPv6 header and traffic class field. For a color version of the
    figure, see www.iste.co.uk/helali/systems.zip](images/fig8_4.jpg)


    **[Figure 8.4.](#c08.xhtml#figureanchor4)** `IPv6` header and traffic class field.
    For a color version of the figure, see [`www.iste.co.uk/helali/systems.zip`](http://www.iste.co.uk/helali/systems.zip)*


    The `TOS` field (IP precedence) displays as follows.


    ![Figure 8.5. Structure of TOS (Type Of Service) field](images/fig8_5.jpg)


    **Figure 8.5.** *Structure of `TOS` (Type Of Service) field*


    The `DSCP` field is coded on 6 bits and makes it possible to increase the number
    of priority levels compared to the `TOS` field, which is coded on only 3 bits.


    ![Figure 8.6. DSCP (Differentiated Service Code Point) field structure](images/fig8_6.jpg)


    **Figure 8.6.** `DSCP` (Differentiated Service Code Point) field structure


    The `DiffServ` model, by basing itself on the `DSCP` field, offers higher granularity,
    refining it by adding the 3 bits `DS2`, `DS1` and `DS0`. The first three bits
    `DS2`, `DS1` and `DS0` define the probability. The first three bits `DS2`, `DS1`
    and `DS0` are reserved for network control. The first three bits `DS2`, `DS1`
    and `DS0` are used for voice. The first three bits `DS2`, `DS1` and `DS0` are
    used for interactive video. The first three bits `DS2`, `DS1` and `DS0` are used
    for streaming. The first three bits `DS2`, `DS1` and `DS0` are used for excellent
    effort. The first three bits `DS2`, `DS1` and `DS0` are used for background effort.
    This bits the best effort.


    ![Figure 8.4. IPv6 header and traffic class field. For a color version of the
    figure, see www.iste.co.uk/helali/systems.zip](images/fig8_4.jpg)


    **[Figure 8.4.](#c08.xhtml#figureanchor4)** `IPv6` header and traffic class field.
    For a color version of the figure, see [`www.iste.co.uk/helali/systems.zip`](http://www.iste.co.uk/helali/systems.zip)*


    ## 8.2.6.3 In the data layer


    The `802.1p` standard uses three bits in the Ethernet frame to assign priority.
    This `802.1p` mechanism can classify traffic. In the event of network congestion,
    higher priority frames are transmitted before lower ones.


    ![Figure 8.5. Structure of TOS (Type Of Service) field](images/fig8_5.jpg)


    **Figure 8.5.** *Structure of `TOS` (Type Of Service) field*


    ## 8.2.6.4 Applications


    ### Application 1: QoS configuration for routers


    By default, routers with no QoS mechanisms process all packets in the same way,
    according to the first-come-first-served (FIFO) principle, but this can corrupt
    the operation of certain types of critical traffic.


    Here, we will use the `MQC` (*Modular Quality Command Interface*) approach, which
    has a number of advantages:


    - standardization of the implementation of QoS on all Cisco platforms while masking
    the underlying hardware architecture. In this way, clients can upgrade to the
    new generation of Cisco hardware and copy existing MQC configurations;

    - distinguishing between classification modifications and strategy modifications,
    and deactivating a QoS strategy with a single command, thanks to modular configuration.
    One QoS strategy can also be applied to multiple interfaces.


    This approach is concretized via a three-stage process:


    1. Definition of a flow class or class-map. This stage defines a set of network
    traffic, or a class-map in MQC terminology, using several classification criteria:
    protocols, access control lists (`ACL`). IP addresses, IP precedence, `DSCP`,
    `IEEE 802.1p`, etc. The class name must be specified as well as a series of match
    commands used to set classification criteria.

    '
