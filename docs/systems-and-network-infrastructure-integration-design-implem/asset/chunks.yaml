    \ of service;\n– the conglomeration of multiple heterogeneous storage devices\
    \ into a single logical storage entity;\n– dynamic reallocation of storage space\
    \ according to application server needs.\n\nThis virtualization is used in `NAS`\
    \ and `SAN` networks.\n\n#### 7.2.3.4. Virtualization of networks\n"
  trans: "\n\nITSEC（信息技术安全评估标准）欧洲标准将安全策略定义为“治理特定系统内敏感信息和其他资源的管理、保护和分发方式的法律、规则和实践”。\n\
    \n它通过一组参考文件具体化，这些文件包含了需要应用和遵守的安全规则。它还定义了业务 set 的安全目标以及为了实现这些目标而部署的机制和程序。\n\n组织或企业网络及系统基础设施的安全化必须基于现行的安全策略。不同安全机制和解决方案的选择与实施取决于相应的安全策略。\n\
    \n## 6.6. 章节总结\n\n![](img/fig6_u1.jpg)\n\n## Note\n\n1. 此图表也可在 www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)\
    \ 获得。\n\n# 7 虚拟化与云计算\n\n> “你不再需要亲身处世界中才能参与其中。我 90% 都是虚拟的。”\n\n> 考尔·拉格斐德 (Karl\
    \ Lagerfeld)\n\n– 理解虚拟化概念\n– 学习虚拟化领域\n– 确定虚拟化的优缺点\n– 理解不同类型的虚拟化\n– 理解云计算概念\n–\
    \ 学习与云计算相关的不同服务模型及其类型\n\n## 7.1. 引言\n\nIT 基础设施的建立或升级对每家企业来说都需要大量的资金投入。在日益严峻的经济气候下，任何能够降低成本的解决方案都显得重要。这一类别包括虚拟化，它帮助企业创建易于管理且低成本的\
    \ IT 基础设施，从而消除对单一硬件供应商的依赖，并确保 IT 功能更具弹性、灵活且敏捷。\n\n此外，基于虚拟化概念的云计算对企业具有巨大的吸引，因为它提供了组织信息系统的新方法，以及管理不同\
    \ IT 资源的新方法。目标仍然是实现更高的利润、可扩展性和扩张能力。\n\n## 7.2. 虚拟化\n\n### 7.2.1. 定义\n\n虚拟化包括一系列不受底层硬件基础设施限制、按需提供\
    \ IT 资源的技术。它可以被视为一个将操作系统与硬件分离的层，使得各种资源能够更高效地运行。这一层有助于创建符合规格的环境，而不是为了适应硬件环境的限制而调整规格。\n\
    \n一个 IT 硬件最初的设计是为了运行单一操作系统和多个应用程序。虚拟化使得绕过这一限制，在相同的硬件支持上运行多个操作系统成为可能，从而优化硬件资源的使用。\n\
    \n虚拟化可以影响整个硬件环境，即处理器、内存、硬盘、外围设备和网络组件，使得每个虚拟机都有自己的虚拟资源。因此，每个虚拟机都是完全独立的，不会受到可能在同一台物理机上共存的其他虚拟机运行（关机、启动、安装程序等）的干扰或中断。\n\
    \n### 7.2.2. 虚拟化的优势\n\n虚拟化技术提供了多项优势：\n\n– 资源池：在单台物理机上建立多个逻辑隔离的系统，优化了这些系统的使用；\n\
    – 虚拟机易于配置、部署、升级和迁移；\n– 有在不干扰基础操作系统的情况下测试新系统的能力；\n– 减少运行能耗：使用更少的硬件意味着更低的电耗和更少的维护保养操作；\n\
    – 提高安全性：网络安全性提高，因为客体操作系统对攻击者不可见；\n– 提高可用性：由两个带有虚拟机的物理服务器形成集群，在出现问题时从一台服务器自动复制到另一台。此外，虚拟服务器的快照或即时捕获功能使其能够轻松重新安装服务器配置；\n\
    – 得益于自动恢复，改进了故障的预防和管理以及系统活动的恢复。由于虚拟服务器具有迁移性，物理服务器将其视为一系列文件，因此在出现问题时可以轻松恢复；\n–\
    \ 通过快速部署新的应用服务器实现可扩展性；\n– 监控功能大大简化并集中化；单一监控程序负责所有虚拟服务器。\n\n### 7.2.3. 应用领域\n\n\
    #### 7.2.3.1. 应用程序虚拟化\n\n应用程序虚拟化是指在应用程序和操作系统之间增加额外的软件层，所有文件读取、修改或系统注册表文件都必须通过该层，以便透明地将其重定向到虚拟位置。最终目标是将应用程序与主机操作系统隔离，提高应用程序的移植性和兼容性。通过这种方式，多个应用程序可以在单个操作系统上运行而不会遇到兼容性问题（例如注册表中）。一个应用程序的多个版本在单个操作系统上运行也是可能的。`Wine`、`PlayOnLinux`\
    \ 和 `CrossOver` 就是其中的例子。\n\n#### 7.2.3.2. 服务器虚拟化\n\n这里的原理是让多个虚拟机在单台物理服务器上运行，以优化其容量利用率。研究表明，服务器平均仅使用其容量的\
    \ 15%。这种技术使企业在物理基础设施方面节省成本，特别是在空间占用、电耗、气候控制和管理所需人员方面。\n\n![图 7.1. 服务器虚拟化。彩色版本的图片请参见\
    \ www.iste.co.uk/helali/systems.zip](img/fig7_1.jpg)\n\n**图 7.1.** 服务器虚拟化。彩色版本的图片请参见\
    \ [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)\
    \ \n\n#### 7.2.3.3. 存储虚拟化\n\n此目标是提供存储方面的高级功能。原理是将各种存储资源汇到一个单一逻辑存储设备。这种过程也称为存储抽象，允许用户（服务器、应用程序或工作站）通过由服务器、软件和网络交换机组成的中间层访问单一逻辑存储资源，该层拦截传出的服务器流量并根据特定协议将其到物理存储设备。\n\
    \n这种虚拟化确保了物理存储系统（磁盘、存储槽）的管理与其连接服务器之间的独立性，并允许应用程序将磁盘（及存储槽）的物理管理与使用它们的服务器分离，从而降低了存储管理的高成本。\n\
    \n存储虚拟化实现了：\n\n– 在不中断服务的情况下添加新的存储设备；\n– 将多个异构存储设备合并为单一逻辑存储实体；\n– 根据应用服务器的需求动态分配存储空间。\n\
    \n这种虚拟化用于 `NAS` 和 `SAN` 网络。\n\n#### 7.2.3.4. 网络虚拟化\n\n"
