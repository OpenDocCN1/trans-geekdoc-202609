    – 待管理或监控的网络元素，可以是交换机、路由器、访问点、服务器、工作站、打印机等。每个元素都有一个所谓的代理模块（agent module），它通过检索监控站请求的管理信息（例如，端口状态）来响应监控站的请求。管理信息数据存储在一个名为
    `MIB`（管理信息库）的虚拟数据库中。该数据库由代理维护，并由其用于检索任何所需的管理信息。


    该协议由请求、响应和告警组成。请求由管理器（manager）发送给代理（agent），随后由代理回回响应。如果被监控的网络元素发生异常事件，相应的代理会向管理器发送告警（trap）。`SNMP`
    基于 `UDP` 协议。`161` 端口用于代理接收来自监控站的请求，而 `162` 端口用于监控站收集由代理传输的可能请求。


    **表 9.1. SNMP 消息分类**


    | SNMP 消息类型 | 描述 |

    | --- | --- |

    | Requests | `GetRequest` 请求用于在代理查找变量。`GetNextRequest` 请求用于获取下一个变量的值。`GetBulk`
    请求用于搜索一组组合变量。`SetRequest` 请求用于更改代理上变量的值。 |

    | Responses | 代理始终用 `GetResponse` 响应。如果请求的变量不可用，`GetResponse` 将带有错误消息 `NoSuchObject`。
    |

    | Alerts | 当代理发生异常事件时，该代理通过 trap 通知监控站。可能的告警包括 `ColdStart`、`WarmStart`、`LinkDown`、`LinkUp`
    和 `Authentication Failure`。 |


    下图展示了 `SNMP` 管理器与代理之间交换的 `SNMP` 消息。


    ![图 9.4. SNMP 请求、响应和告警](img/fig9_4.jpg)


    **图 9.4. SNMP 请求、响应和告警**


    数据层级组织在代理维护并监控站查询的 `MIB`（管理信息库）中。


    `MIB` 树结构。每个节点由一个名为 `OID`（对象标识符）的数字标识。该数字由三部分组成：通常所有 `SNMP` 代理通用的部分；对于特定类型硬件（例如路由器）的所有
    `SNMP` 代理通用的部分；以及每个特定制造商（例如 `Cisco`）特定的部分。每个被监控的硬件都有自己的 `MIB`。


    `MIB` 的组织根据 `ASN1` 标准（抽象语法规范 1）进行标准化，该标准规定了用于描述数据结构的表示法。


    要访问所需的变量，我们使用 `OID`（对象标识），它指定了要查询变量在 `MIB` 中的位置。`OID` 是一个由字符 `.`（点或分隔符）分隔的数字序列。


    示例.– 在 Cisco 路由器上，`OID` `1.3.6.1.4.1.9.2.1.58` 指定了过去五分钟内的处理器利用率（对象 `avgBusy5`）。


    活跃在该领域的公司由互联网分配数字机构 (`IANA`) 分配 `OIDs`。


    示例.– `Cisco` 的 `1.3.6.1.4.1.9`、`HP` 的 `1.3.6.1.4.1.11`、`Novell` 的 `1.3.6.1.4.1.23`。


    ![图 9.5. MIB 结构](img/fig9_5.jpg)


    **图 9.5. MIB 结构**


    `SNMP` 协议有三个主要版本：


    – `SNMPvl`: 作为网络管理协议的第一版本，该协议提供了管理器-代理模型的基础概念，以及管理站与每个代理之间通信的基础。唯一的内置安全机制是交换所谓的“团体字符串”（community
    string），它随相应的请求发送；

    – `SNMPv2c`: 它提供了改进的安全性能。但其主要优势在于最近实现的消息类型：`GETBULK`（在单个请求中查询多个数据项）和 `INFORM`（用于确认代理的响应）；

    – `SNMPv3`: `IETF` 在 `SNMPv3` 中完全专注于安全性，并将团体字符串替换为用户名和密码。此外，与之前的版本不同，协议的第三版本包含了用于加密
    `SNMP` 包传输的功能。如今，只有版本 3 被认为符合操作标准。


    ### 9.3.2. WMI (Windows 管理规范)


    `WMI` 用于监控和管理 Windows 系统资源。它可以从本地或远程机器获取大量信息。除了检索监控信息外，现在可以在机器上进行安装或卸载程序等操作。事件驱动的基础架构根据监控策略传输告警。该协议的主要缺点是它仅适用于
    Windows 平台。


    ### 9.3.3. WS-Management (Web 服务管理)


    `WS-Management` 是一种基于 Web 服务 (`SOAP`) 的服务器、设备和应用程序管理通信协议。`WS-Management` 是一个较新的协议，因此特别适用于如今常见的分布式基础架构。


    ### 9.3.4. IPMI (智能平台管理接口)


    `IPMI` 提供了一个标准的硬件管理接口。它最由服务器（`Dell`、`IBM`、`HP`、`Intel`、`NEC` 等提供，用于本地或远程管理机器，无论它是开启还是关闭状态。


    它基于大多数制造商通用的规范，由一组接口组成，能够监控服务器，更具体地检查某些硬件组件（温度传感器、风扇转速等），而独立于其操作系统。


    ### 9.3.5. NetFlow/IPFIX


    这是一个由 `Cisco` 最初开发、后由 `IETF` 以 `IPFIX` 名称标准化的网络流监控程序。


    通过路由器、交换机或专门的网络传感器收集与数据包相关的信息（源地址、目的地址、协议、端口）。这些传感器聚合这些信息并定期将聚合数据发送到收集器。这是一种网络性能管理解决方案，比参考监控协议
    `SNMP` 提供了更多的信息和更复杂的方法。


    ### 9.3.6. Netconf


    `Netconf` 由 `IETF` 开发，作为 `SNMP` 协议（`v1`, `v2c`, `v3`）的继任者。它的目的是实现基于 `XML`（可扩展标记语言）语言的新一代网络管理。


    该协议基于客户端-服务器模型，允许管理器通过发送 `XML` 请求来操作网络设备配置。


    ## 9.4. 监控工具


    有许多工具可监控服务器和网络。这些工具的设计目的是为管理员提供外围设备和系统的信息，以确保网络基础设施和系统的顺利运行。然而，它们在特定功能、界面、部署架构等方面存在差异。


    选择特定工具主要取决于需求、预算、公司具备的安装、运行和维护技能，以及公司希望监控的领域，即网络、系统、应用程序或三者兼顾。


    ### 9.4.1. 商业监控解决方案（HP OpenView、Tivoli）和软件供应商解决方案


