    models. For a color version of the figure, seeww.iste.co.uk/helali/systems.zip](images/fig7_7.jpg)


    **Figure 7.7.** Distribution of responsibility for cloud computing service delivery
    models. For a color version of the figure, see[www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)


    To further explain cloud service models, an analogy called “Pizza as a Service”
