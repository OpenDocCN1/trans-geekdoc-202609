    The virtualization of networks is based on the abstraction of hardware network
    resources in software form. It separates network services from the hardware on
    which they operate. Physical network resources, specifically `switches` and `routers`,
    are thus accessible via the intermediary of a centralized management system. This
    procedure increases the network''s productivity and efficiency.


    More specifically, it involves transforming certain network functionalities (`firewall`,
    `NAT`, etc.) into software programs. In this way, the deployment or updating of
    new network functionalities is greatly simplified and less costly as well.


    The management of these virtualized network functions is carried out by a network
    controller called an `SDN` (Software-Defined Network) controller, which controls
    the network, improves its performance and automates its services.


    ### 7.2.3.5. Virtualization of workstations


    Workstation functionality is supplied based on a virtual infrastructure. This
    approach is beneficial because it ensures centralized, simplified administration
    of IT facilities as well as the substitution for traditional workstations with
    clients that are both more cost-effective and more eco-friendly.


    In addition, it fulfills the need for continuous access from anywhere, a mobility
    requirement that is increasingly omnipresent for businesses today. Thus, traditional
    desktops, which are cumbersome and become obsolete within 2-3 years, are replaced
    by virtual desktops, or `VDI` (Virtual Desktop Integration).


    This form of virtualization also relieves businesses of the need to manage their
    own IT facilities and the associated maintenance burden. Each user can access
    his or her own work environment hosted on virtual servers in datacenters.


    ### 7.2.4. Categories of virtualization


    Virtualization, a way to supply a number of IT resources independent of the hardware
    platform, can be broken down into four categories according to [Figure 7.2](#c07.xhtml#figure2).


    ![Figure 7.2. Categories of virtualization](images/fig7_2.jpg)


    **[Figure 7.2.](#c07.xhtml#figureanchor2)** Categories of virtualization


    #### 7.2.4.1. Virtualization by isolation


    This category can pertain to applications or processes and is based on confining
    the execution of applications to well-defined contexts using a specific software
    program, making it possible to run several instances of the same application.
    `Open VZ` provides an example of process virtualization.


    ![Figure 7.3. Virtualization by isolation. For a color version of the figure,
    see www.iste.co.uk/helali/systems.zip](images/fig7_3.jpg)


    **Figure 7.3.** Virtualization by isolation. For a color version of the figure,
    see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)


    #### 7.2.4.2. Paravirtualization or type 1 hypervisor


    A hypervisor functions directly on hardware, thus avoiding using a complete host
    operating system and limiting itself to the basic kernel services of common operating
    systems, in this case the management of virtual machine memory and scheduling.
    In this situation, the guest operating system is modified and acknowledges that
    it has been virtualized and then relies on the hypervisor to access the hardware
    resources of the physical server. This category of virtualization shows high performance
    but is costly. Examples include `VMphere(ESXi)`, `KVM` and `Microsoft Hyper V`.


    ![Figure 7.4. Paravirtualization. For a color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig7_4.jpg)


    **Figure 7.4.** Paravirtualization. For a color version of the figure, see `www.iste.co.uk/helali/systems.zip`


    #### 7.2.4.3. Complete virtualization


    This type of virtualization is also called `type 2 hypervisor`. It is based on
    a classic operating system. The goal is to share IT resources while cohabitating
    on the hardware. The `Guest` operating systems are not aware that they are virtualized.
    Examples of this approach include `VirtualBox`, `Oracle VM` and `HyperV`.


    ![Figure 7.5. Complete virtualization. For a color version of the figure, see
    www.iste.co.uk/helali/systems.zip](images/fig7_5.jpg)


    **Figure 7.5.** Complete virtualization. For a color version of the figure, see
    `www.iste.co.uk/helali/systems.zip`


    #### 7.2.4.4. Hardware-assisted virtualization


    This represents an improvement on complete virtualization using `AMD-V` and `Intel
    VT`. Examples of this category include `VMWare`, `VirtualBox` and `Virtual PC`.


    ### 7.2.5. Limits of virtualization


    Despite the significant benefits of virtualization, there are some disadvantages.


    The physical machine or server hosting various virtual machines must be extremely
    powerful and equipped with state-of-the-art technologies. These characteristics
    are, of course, very costly.


    The major issue with virtualization is the possibility of the physical server
    encountering problems or breaking down. If this happens, the virtual machines
    become unavailable.


    Performance may be reduced by the use of virtualization, which itself takes up
    around 30% of the machine load. However, this drop in performance will have more
    or less of an effect depending on the type of virtualization.


    A security breach in the hypervisor exposes all virtual machines to security risks.
    Virtual systems become preferred targets for attackers, especially if they are
    not regularly updated and patched.


    ## 7.3. Cloud computing


    ### 7.3.1. Definitions


    `Wikipedia` defines cloud computing as a concept that consists of siting IT processes
    on remote servers that are traditionally executed on local servers or at a user
    workstation.


    `NIST` (National Institute for Standards and Technology) defines cloud computing
    as access via a telecommunications network, on demand and by self-service, to
    shared, virtualized IT resources. It is a relocation of a business''s IT infrastructure.


    ### 7.3.2. Leverage factors and generic principles


    Several factors have contributed greatly to the emergence and success of cloud
    computing.


    Successive developments in IT systems, such as the increasing of computational
    power with new processors, the meteorically swift development of Web technologies,
    the opening up of companies to the Internet and the current trend toward decentralization
    have led logically to cloud computing.


    Cloud computing represents a method of organizing and relocating the components
    that make up an IT system. It is based mainly on the concept of virtualization.

