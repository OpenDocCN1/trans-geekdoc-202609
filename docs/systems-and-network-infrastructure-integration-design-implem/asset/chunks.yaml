    - 源 `0.0.0.0`；

    - 目的 `255.255.255.255`；

    - 客户端 MAC 地址。


    ![图 5.2. DHCP 过程的第 1 阶段](img/fig5_2.jpg)


    **图 5.2.** DHCP 过程的第 1 阶段


    该 DHCP 客户端等待接收报价（offer），这由 DHCP 服务器在秒秒后发出。如果没有发生这种情况，它将重新广播其请求四次：第一次在 9 秒后，第二次在
    13 秒后，第三次在 16 秒后，最后一次在 0 到 1 秒之间的随机时间后。如果四次尝试均失败，它将在 5 分钟后重复请求。


