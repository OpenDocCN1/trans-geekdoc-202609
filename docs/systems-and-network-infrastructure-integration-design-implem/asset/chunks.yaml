- raw: "The virtualization of networks is based on the abstraction of hardware network\
    \ resources in software form. It separates network services from the hardware\
    \ on which they operate. Physical network resources, specifically switches and\
    \ routers, are thus accessible via the intermediary of a centralized management\
    \ system. This procedure increases the network's productivity and efficiency.\n\
    \nMore specifically, it involves transforming certain network functionalities\
    \ (firewall, NAT, etc.) into software programs. In this way, the deployment or\
    \ updating of new network functionalities is greatly simplified and less costly\
    \ as well.\n\nThe management of these virtualized network functions is carried\
    \ out by a network controller called an SDN (Software-Defined Network) controller,\
    \ which controls the network, improves its performance and automates its services.\n\
    \n#### 7.2.3.5. *Virtualization of workstations*\n\nWorkstation functionality\
    \ is supplied based on a virtual infrastructure. This approach is beneficial because\
    \ it ensures centralized, simplified administration of IT facilities as well as\
    \ the substitution for traditional workstations with clients that are both more\
    \ cost-effective and more eco-friendly.\n\nIn addition, it fulfills the need for\
    \ continuous access from anywhere, a mobility requirement that is increasingly\
    \ omnipresent for businesses today. Thus, traditional desktops, which are cumbersome\
    \ and become obsolete within 2-3 years, are replaced by virtual desktops, or VDI\
    \ (Virtual Desktop Integration).\n\nThis form of virtualization also relieves\
    \ businesses of the need to manage their own IT facilities and the associated\
    \ maintenance burden. Each user can access his or her own work environment hosted\
    \ on virtual servers in datacenters.\n\n### 7.2.4. *Categories of virtualization*\n\
    \nVirtualization, a way to supply a number of IT resources independent of the\
    \ hardware platform, can be broken down into four categories according to [Figure\
    \ 7.2](#c07.xhtml#figure2).\n\n![Figure 7.2. Categories of virtualization](images/fig7_2.jpg)\n\
    \n**[Figure 7.2.](#c07.xhtml#figureanchor2)** *Categories of virtualization*\n\
    \n#### 7.2.4.1, *Virtualization by isolation*\n\nThis category can pertain to\
    \ applications or processes and is based on confining the execution of applications\
    \ to well-defined contexts using a specific software program, making it possible\
    \ to run several instances of the same application. Open VZ provides an example\
    \ of process virtualization.\n\n ![Figure 7.3. Virtualization by isolation. For\
    \ a color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig7_3.jpg)\n\
    \n**Figure 7.3.** *Virtualization by isolation. For a color version of the figure,\
    \ see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*\n\
    \n#### 7.2.4.2. *Paravirtualization or type 1 hypervisor*\n\nA hypervisor functions\
    \ directly on hardware, thus avoiding using a complete host operating system and\
    \ limiting itself to the basic kernel services of common operating systems, in\
    \ this case the management of virtual machine memory and scheduling. In this situation,\
    \ the guest operating system is modified and acknowledges that it has been virtualized\
    \ and then relies on the hypervisor to access the hardware resources of the physical\
    \ server. This category of virtualization shows high performance but is costly.\
    \ Examples include VMsphere(ESXi), KVM and Microsoft Hyper V.\n\n![Figure 7.4.\
    \ Paravirtualization. For a color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig7_4.jpg)\n\
    \n**Figure 7.4.** *Paravirtualization. For a color version of the figure, see\
    \ [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*\n\
    \n#### 7.2.4.3. *Complete virtualization*\n\nThis type of virtualization is also\
    \ called a type 2 hypervisor. It is based on an emulator running on a classic\
    \ operating system used to manage the memory and scheduling of virtual machines.\
    \ The hardware is completely simulated. Other operating systems can be installed;\
    \ these will think they are communicating directly with the hardware. This type\
    \ of virtualization enables multiple systems to cohabitate on a single physical\
    \ machine while remaining partitioned from one another. However, it is not very\
    \ high-performing. Guest operating systems are not aware that they are virtualized.\
    \ Examples of this approach include VirtualBox, Oracle VM and HyperV.\n\n![Figure\
    \ 7.5. Complete virtualization. For a color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig7_5.jpg)\n\
    \n**Figure 7.5.** *Complete virtualization. For a color version of the figure,\
    \ see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*\n\
    \n#### 7.2.4.4. *Hardware-assisted virtualization*\n\nThis represents an improvement\
    \ on complete virtualization using the processor extensions AMD-V and Intel VT.\
    \ The simplicity of function of applications and the available of high-performance\
    \ administrative tools have contributed greatly to the success of this type of\
    \ virtualization. Examples of this category include VMWare, VirtualBox and Virtual\
    \ PC.\n\n### 7.2.5. *Limits of virtualization*\n\nDespite the significant benefits\
    \ of virtualization technology, there are some disadvantages.\n\nThe physical\
    \ machine or server hosting various virtual machines must be extremely powerful\
    \ and equipped with state-of-the-art technologies. It must possess several processors,\
    \ consistent memory and high storage capacity. These characteristics are, of course,\
    \ very costly.\n\nThe major issue with virtualization is the possibility of the\
    \ physical server encountering problems or breaking down. If this happens, the\
    \ virtual machines become unavailable.\n\nPerformance may be reduced by the use\
    \ of virtualization, which can hinder applications from running, as virtualization\
    \ itself takes up around 30% of the machine load. However, this drop in performance\
    \ will have more or less of an effect depending on the type of virtualization\
    \ adopted.\n\nA security breach in the hypervisor exposes all virtual machines\
    \ to security risks. Virtual systems become preferred targets for attackers, especially\
    \ if they are not regularly updated and patched.\n\n## 7.3. Cloud computing\n\n\
    ### 7.3.1. *Definitions*\n\nWikipedia defines cloud computing as a concept that\
    \ consists of siting IT processes on remote servers that are traditionally executed\
    \ on local servers or at a user workstation.\n\nNIST (National Institute for Standards\
    \ and Technology) defines cloud computing as access via a telecommunications network,\
    \ on demand and by self-service, to shared, virtualized IT resources. It is a\
    \ relocation of a business's IT infrastructure.\n\nCloud computing represents\
    \ an economic IT model that enables the use of software and hardware resources\
    \ involving servers that are not owned by a company via the Internet, generally\
    \ by payment-on-demand and according  to the company's needs. The goal is to share\
    \ IT resources including computational power, storage space and network functionalities.\n\
    \n### 7.3.2. *Leverage factors and generic principles*\n\nSeveral factors have\
    \ contributed greatly to the emergence and success of the cloud computing paradigm.\n\
    \nSuccessive developments in IT systems, such as the increasing of computational\
    \ power with new processors, the meteorically swift development of Web technologies,\
    \ the opening up of companies to the Internet and the current trend toward decentralization\
    \ have led logically to cloud computing. The current environment, which is highly\
    \ competitive and based on cost reduction, the appearance of new, increasingly\
    \ sophisticated terminals, etc., provides an ideal context for cloud computing.\n\
    \nCloud computing represents a method of organizing and relocating the components\
    \ that make up an IT system. It is based mainly on the concept of virtualization.\
    \ The end user is able to execute applications according to his or her own needs\
    \ without knowing where the servers or the data used are located.\n\nCloud computing\
    \ is characterized by the following features:"
