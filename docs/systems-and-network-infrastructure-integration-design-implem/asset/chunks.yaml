    第 5 章 这些基础设施的设计是其实施过程中的至关重要的阶段，本文将在第 5 章中进行讨论。


    第 6 章 致力于安全主题。任何基础设施集成项目都必须确保根据客户公司的需求实施某些安全机制。


    第 7 章 重点关注虚拟化和云计算，这是两种相互依赖的范式，在当今的网络基础设施中无处不在。


    第 8 章 讨论了现代 IT 基础设施日益要求的服务质量（QoS）和高可用性概念，在这些基础设施中，应用类型极其多样，性能变得日益成为优先事项。


    最后一章致力于对网络基础设施的监督及其各种工具，其目标是对已安装的设施进行监控，以减轻并可能防止技术故障。


    每一章都以思维图的形式结束，该思维图是所讨论的主要信息要点的视觉化总结，以便更好地对其进行结构化处理并便于记忆。


    Saida HELALI


    2020 年 6 月


    # 项目管理导论


    > “一点急躁就能毁掉一个伟大的项目。”

    > 孔子


    – 理解项目管理的基本原理。

    – 学习项目管理的主要方法和工具。

    – 理解规格说明的用途以及如何解读它们。


    ## 1.1. 引言


    管理 IT 项目与管理任何类型的普通项目相似。根据 Wysocki 的观点，项目是一系列独特的、非重复的、复杂的且关联的活动，旨在实现某个目标。这必须在特定的时间范围内和预算内完成，并符合一系列规范。


    IT 项目（ITP）需要技术技能（编程、安全、网络、架构等），以及组织和沟通技能。其目标是为客户设计一个可靠、可行且满意的 IT 解决方案，特别是在截止日期、成本和质量方面达成共识。项目有多个方面：


    – 功能上：响应需求；

    – 技术上：符合明确定义的规范和限制；

    – 组织上：遵循预定的运行模式（角色、文化、功能、对变革的阻力等）；

    – 时间上：遵守截止日期；

    – 经济上：遵守预算。


    ![图 1.1. 项目的维度](img/fig1_1.jpg)


    **图 1.1.** 项目的维度


    ## 1.2. 项目管理


    项目管理是一种基于将知识、技能、工具和技术应用于项目活动的方法，旨在满足项目相关方的预期。


    每个项目都可以被拆分为几个阶段。每个阶段可以进一步拆分为步骤，而这些步骤又划分为任务。项目的主要阶段如图图 1.2 所示。


    ![图 1.2. 项目的阶段](img/fig1_1.jpg)


    **图 1.2** 项目的阶段


    启动阶段包括定义项目工作，其目标是回答“为什么”和“什么”。预计完成日期可以在此阶段进行估算。此外 设计阶段涉及对项目进行实际定义，以确保符合规范。


    – 启动阶段：对项目进行实际定义，其目标是准备工作。

    – 设计阶段：对项目进行实际定义，其目标是进行结构化并规划。

    – 执行阶段：对项目进行实际实现。

    – 收尾阶段：通过评审报告进行持续改进。


    ## 1.3. 项目管理方法与工具


    项目管理方法通过应用知识、技能、工具和技术，使项目活动能够满足相关方的预期。项目管理方法有助于项目遵守截止日期、预算和资源。


    主要方法包括：


    a. 经典方法：这些方法常用于项目管理。它们被称为“瀑布式”，因为每个阶段必须结束后才能进入下一个。这种方法的主要缺点是缺乏灵活性。


    b. 敏捷方法：这些方法日益流行。它们提供了更好的灵活性和控制，以满足客户预期。敏捷方法的核心是迭代过程。Scrum 引入了“冲刺”的概念，代表项目的不同阶段。在整个项目中，功能将不断改进。Scrum
    基于三个角色：


    – 产品负责人，设定产品需求；

    – 开发团队；

    – Scrum 主管，负责监督项目的实现。


    c. 自适应方法：这些方法适应项目的变化，特别是对于复杂难以管理的项目。


    d. 关键路径法：该方法对应于必须在预定日期完成的任务。这些关键任务不能有任何延迟，否则项目将滞后。


    e. PERT 方法：该方法用于管理项目的排序。它将项目表示为图表，即任务网络，通过该网络实现预设目标。执行项目所需的所有任务都将列出来，并建立了它们之间的依赖关系。在该方法中，项目的阶段在
    PERT 图中表示出来，该图确定了项目的最短持续时间。


    f. PRINCE2（受控环境项目管理第二版）方法：这是一种结构化、实用且适应良好的项目管理方法，适用于任何类型的项目。它确保项目按时、预算内交付，并确保风险、优势和质量管理。


    g. 精益管理方法：该方法用于用最少的资金、资源和时间提供高质量的工作。


    项目管理有多种工具可用。这些工具用于提高生产效率。因此，有必要根据我们的需求选择合适的工具。


    表 1.1 总结了项目每个阶段的主要工具。


    **表 1.1** 项目管理主要工具


    |  || 启动（项目前） || 设计 || 执行 || 收尾 |

    | --- | --- | --- | --- | --- |

    | **工具示例** || 目标树、RACI 矩阵、规范说明 | 帕累托图、WBS、甘特图、沟通计划、风险管理 | 协作工作工具、脑风暴、解决问题工具、控制面板
    | 项目评审 |


