- raw: '– MPLS (Multi-Protocol Label Switching) combines the advantages of switching
    with routing. It operates between layers 2 and 3 of the OSI layer model and is
    based on label switching. VPN creation is one of its multiple functions. Practically
    speaking, to create client VPNS, each client flow must be isolated. To do this,
    the MPLS label is now composed not of one label but of two; the first (exterior)
    label identifies the path toward the destination LSR (Label Switch Router) and
    changes with each hop, while the second (interior) label specifies the VPN-ID
    assigned to the VPN and is not modified between the source LSR and the destination
    LSR.


    The components of MPLS VPNs are as follows:


    – the CE router (Customer Edge router) represents the client router connected
    to the IP backbone via an access service (LS, Frame Relay, ATM, etc.);


    – the PE router (Provider Edge router) is the backbone router to which CEs are
    connected. It enables a CE to belong to a given VPN. The role of the PE consists
    of managing VPNs by cooperating with other PEs and switching frames with P routers;


    – the P router (Provider router) is responsible for MPLS frame switching.


    The operator manages the VPNs in the backbone via PEs. Each PE assigns a VRF (Virtual
    Routing and Forwarding Table) to each of its user interfaces. The VRF is a routing
    table assigned to a VPN which gives the paths toward the IP networks corresponding
    to this VPN.


    ### 6.4.5. *Other means of security*


    #### 6.4.5.1. *VLANs*


    These make it possible to structure networks into zones sealed by activity, thus
    improving the security of the overall network infrastructure. VLANs represent
    an example of logical segmentation technology used to divide up the broadcast
    domain and to ensure that each VLAN can communicate with another VLAN only after
    routing configuration and installation of ACLs corresponding to the company''s
    security policy.


    #### 6.4.5.2. *Means of authentication*


    This can be done via login and password or by a chip card or biometry. In the
    first case, a strict policy of the choice and management of passwords must be
    implemented. Authentication can also be carried out via electronic certificates.
    In this case, the IEEE802.1X protocol can be jointly deployed with a Radius-type
    server.


    #### 6.4.5.3. *Logical access control*


    This specifies the actions a previously authenticated user is authorized to take
    with the IT system''s various resources. It depends, naturally, on the physical
    access control. There are several models of logical access control available,
    including MAC (Mandatory Access Control), DAC (Discretionary Access Control) and
    RBAC (Role-Based Access Control).


    #### 6.4.5.4. *Physical security of equipment and premises*


    This consists of providing for the deployment of barriers, alarm systems, surveillance
    cameras, locks and other physical mechanisms to manage physical access to a business''s
    premises, servers, computers and network equipment.


    #### 6.4.5.5. *NAT (Network Address Translation)*


    This is a mechanism that makes it possible to replace the private IP addresses
    of machines in the local network with public addresses during traversal of an
    NAT router. The main objective of this technology is to compensate for the shortage
    of IPv4 addresses. Moreover, it enables internal local network IP addresses to
    be masked, thus improving security.


    #### 6.4.5.6. *NAC (Network Access Control)*


    NACis a protective concept that provides:


    – clear recognition of attempts to access and identify devices and users;


    – verification that security policies adopted are in place;


    – isolation and, as far as possible, automatic correction of violations of established
    policy;


    – creation and management of policies and assessment of incidents and data collected.


    #### 6.4.5.7. *Logging and audit*


    Logging allows traces of various activities to be retained; more precisely, who
    did what, when and for how long for each incoming and outgoing connection. Logging
    makes security more dynamic as it is regularly reviewed in order to monitor developments
    in systems, networks and risks.


    #### 6.4.5.8. *Backups*


    Backups keep an intact, functional copy of an information system''s data and documentation,
    allowing activity to be resumed in the event of an incident. Data storage technologies
    such as Storage Area Networks (SANs) or Network Attached Storage (NAS) are more
    suitable for a modern information system. Backup and restoration procedures and
    devices should be chosen according to need, strictly implemented and regularly
    verified.


    #### 6.4.5.9. *Training and awareness*


    Information system security involves a human and social component that is as important
    as the technological component. Even the best protection methods will fail if
    they are in the hands of inexperienced, untrained, ill-informed users. Therefore,
    the managers of technical infrastructures and networks must work to inform, train
    and increase awareness among users  with regard to security issues. They must
    also stay informed about new attacks and threats, subscribe to alert bulletins
    from CERT and other organizations that broadcast information on security and to
    specialized journals, consult specialized forums regularly, attend conferences
    on the subject and, above all, apply the lessons learned.


    **Table 6.1.** *Security means and services*


    | Security service || Means of security |


    | --- | --- |


    | Confidentiality || Encryption techniques |


    | Integrity || Hash functions |


    | Availability || Redundancy, backup |


    | Authenticity || Certificate, biometry |


    | Nonrepudiation || Signature, electronic notary |


    ## 6.5. Security management systems: norms and security policies


    ### 6.5.1. *Norms*


    Security is multidisciplinary. It has multiple aspects, in this context ethical,
    legislative, technological, methodological and normative.


    The securitization of an information system is a relatively arduous task requiring
    an IT security management system to guide it.


    A management system is defined by the ISO as “a system enabling the establishment
    of a policy and objectives and the attainment of these objectives”. It can be
    considered as a set of organizational measures and techniques targeting specific
    objectives. These systems are based on reference sources that formalize policies
    and procedures so that they can be subsequently audited.


    The implementation of these information security management systems, or ISMS,
    requires material, human and financial resources, an investment that is justifiable
    insofar as these security management systems increase reliability. Moreover, the
    fact of being audited or even certified by a standardization organization increases
    trust and confidence in a business on the part of its partners.


    The 2700X family of ISO norms sets the standards for information security management
    systems (ISMS). We are referring more specifically here to norm ISO27001, which
    sets requirements for the setup of an ISMS, and norm ISO27002, which provides
    a catalogue of best practices for information security management.


    Norm ISO27001 relies on a process-based approach, and more precisely on the Deming
    wheel process, or PDCA model (for Plan, Do, Check, Act):


    – the Plan phase consists of defining the perimeter to be secured, gauging the
    risks and selecting security measures;


    – the Do phase consists of planning how risks will be addressed, designing significant
    indicators, training personnel and managing incidents;


    – the Check phase uses controls, audits and review to regularly assess the current
    state of the information system''s security;


    – the Act phase involves the implementation of corrective, preventive and improvement-related
    actions in the event that the predetermined objectives have not been met.


    ### 6.5.2. *The idea of security policy*'
