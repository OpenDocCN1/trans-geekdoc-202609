- raw: "## Note\n\n1.  This chart is also available at [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)\n\
    \n# **5**  \n\nNetwork Services\n\n> “Think like a client.”\n\n> \n\n> Paul Gillin\n\
    \n– Defining the concept of network services.\n\n– Understanding the different\
    \ types of network services.\n\n– Understanding the operating principle of DHCP\
    \ service.\n\n– Understanding the principle of name resolution with a DNS system.\n\
    \n– Understanding how the SMTP protocol functions to operate an e-mail server.\n\
    \n– Understanding how a web server functions.\n\n– Understanding how a file transfer\
    \ server functions.\n\n## 5.1. Introduction\n\nIT networks, which have become\
    \ omnipresent in every part of human life, were designed to provide services.\
    \ These services are based on the client/server approach, in which a client requests\
    \ a specific service from the corresponding server.\n\nA server is an entity that\
    \ provides a service to a group of computers called clients via a network.\n\n\
    The services provided vary widely, ranging from file sharing, data and IT resources\
    \ (printer, fax, etc.), storage, logic address attribution, e-mail, name resolution,\
    \ etc.\n\nThese services depend on the needs to be met and thus differ from one\
    \ enterprise to another. However, certain services are always requested, and we\
    \ refer to these services as common or base services, which will be discussed\
    \ throughout this chapter.\n\n## 5.2. DHCP service\n\n### 5.2.1. *Introduction*\n\
    \nDHCP (Dynamic Host Configuration Protocol) is a standardized TCP/IP protocol\
    \ designed to simply manage and automate the IP address configuration. In a TCP/IP\
    \ network, each computer must have a computer name and a unique IP address. The\
    \ IP address (with its associated subnet mask) identifies the host computer and\
    \ the sub-network to which it belongs. When a computer is moved to another sub-network,\
    \ the IP address must be changed. DHCP allows an IP address to be dynamically\
    \ assigned to a client, based on the database of IP addresses and managed by the\
    \ local network's DHCP server.\n\nFor TCP/IP networks, DHCP reduces the complexity\
    \ and amount of administrative work involved in the reconfiguration of computers.\
    \ In fact, this dynamic addressing has several advantages. Only functioning stations\
    \ use an address from the address space.\n\nModification of address parameters,\
    \ that is, the default gateway address, DNS server addresses, etc., is managed\
    \ by the DHCP server and provided to the computing stations.\n\n### 5.2.2. *Operating\
    \ principle*\n\nThe operation of the DHCP protocol is summarized in [Figure 5.1](#c05.xhtml#figure1).\n\
    \n![Figure 5.1. Overall functioning of DHCP](images/fig5_1.jpg)\n\n**[Figure 5.1.](#c05.xhtml#figureanchor1)**\
    \ *Overall functioning of DHCP*\n\nA device configured to use the DHCP protocol,\
    \ also called the DHCP client, broadcasts upon startup an IP address request (DHCPDISCOVER)\
    \ on UDP port 67 with:\n\n– source 0.0.0.0;\n\n– destination 255.255.255.255;\n\
    \n– client MAC address.\n\n![Figure 5.2. Stage 1 of the DHCP process](images/fig5_2.jpg)\n\
    \n**Figure 5.2.** *Stage 1 of the DHCP process*\n\nThis DHCP client waits to receive\
    \ an offer, which is of course issued by a DHCP server after one second. If this\
    \ does not happen, it rebroadcasts its request four times, the first after 9 seconds,\
    \ the second after 13 seconds, the third after 16 seconds, and the last following\
    \ a random period of time between 0 and 1 second. If all four attempts fail, it\
    \ repeats its request after 5 minutes.\n\nAll DHCP servers receive the request.\
    \ Those configured to respond broadcast offers (DHCPOFFER) with the following\
    \ information:\n\n– client MAC address;\n\n– an IP address;\n\n– a subnet mask;\n\
    \n– a lease time (the time during which the IP address will not be used by another\
    \ network device);\n\n– its IP address.\n\n![Figure 5.3. Stage 2 of the DHCP process](images/fig5_3.jpg)\n\
    \n**Figure 5.3.** *Stage 2 of the DHCP process*\n\nThe client chooses an offer\
    \ (generally the first one) and announces via broadcast that it has done so via\
    \ (DHCPREQUEST). The message DHCPREQUEST includes the identification of the server\
    \ selected, which now knows that its offer has been chosen, and that other DHCP\
    \ servers, if they exist, must now withdraw their offers.\n\n![Figure 5.4. Stage\
    \ 3 of the DHCP process](images/fig5_4.jpg)\n\n**Figure 5.4.** *Stage 3 of the\
    \ DHCP process*\n\nThe server chosen sends an acknowledgment to the client via\
    \ the message DHCPACK, which may contain other information (DNS server, gateway,\
    \ etc.).\n\n![Figure 5.5. Stage 4 of the DHCP process](images/fig5_5.jpg)\n\n\
    **Figure 5.5.** *Stage 4 of the DHCP process*\n\nThe DHCP service can be installed\
    \ and configured in one of three ways:\n\n– by installing, in Debian, for example,\
    \ the isc-dhcp-server packet and modifying dhcpd.conf according to need;\n\n–\
    \ by adding the DHCP role to a Windows server;\n\n– by configuring the DHCP service\
    \ on a router.\n\n### 5.2.3. *Renewal of lease*\n\nThe assignment of an IP address\
    \ is temporary, as the client can use it only for a specified amount of time called\
    \ the lease. Once the client obtains the lease, this lease must be renewed before\
