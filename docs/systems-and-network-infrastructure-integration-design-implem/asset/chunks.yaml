    # 6. System and Network Security


    > “A computer is only secure when it''s turned off, and not really even then!”

    > Bill Gates


    - Recalling the basic concepts and challenges of IT security.

    - Defining the threats and attacks to which a business''s IT system can be exposed.

    - Describing various security mechanisms.

    - Understanding security management systems and corresponding norms as well as
    the concept of a security policy.


    ## 6.1. Introduction


    These days, business IT systems are more and more widely distributed and rely
    on computer networks to connect the headquarters with its various subsidiaries,
    as well as teleworkers, retail establishments, etc. This remote access has encouraged
    the decentralization of businesses and their opening up to the entire world, and
    has become increasingly sophisticated with new wireless access technologies (`GSM`,
    `4/5G`, `Wimax`) and the complete opening up of the Internet network.


    Of course, IT networks are necessary for businesses as they enable trade and increase
    these businesses'' competitiveness. Nevertheless, they also carry enormous risks
    such as the interception of messages, data theft, loss of system and network access,
    hacking, etc. A wide range of security and safeguarding mechanisms have been introduced
    in order to reduce the risks faced by businesses as much as possible.


    ## 6.2. Definitions, challenges and basic concepts


    IT security is made up of all of the technical, organizational, legal and human
    procedures deployed to maintain and ensure the security of the hardware and software
    resources of an enterprise''s IT system.


    Security represents a major challenge for any business and its partners. There
    are in fact multiple challenges to a company''s competitiveness and even survival
    in an atmosphere of increasingly sophisticated attacks and threats:


    - short-term challenges: giving all authorized users access to the information
    they need;

    - intermediate-term challenges: these have to do with the consistency of the enterprise''s
    information system;

    - long-term challenges: keeping users'' and clients'' trust for a good business
    brand image.


    ![Figure 6.1. Various impacts of security](images/fig6_1.jpg)


    **Figure 6.1.** Various impacts of security


    Information is as important an asset as those related to the classic production
    system (physical assets, human assets, financial assets, etc.). It is even a strategic
    asset that must be protected. Information security can be defined as a system
    implemented to ensure the protection of this information and its related assets
    with the goal of mainly ensuring the following services or objectives:


    - availability: ensuring that authorized users have access to information and
    related resources when desired;

    - integrity: ensuring precision and accuracy of information during storage, processing
    and transmission;

    - confidentiality: ensuring that only authorized persons can access information.


    In addition to the concept of `CIA` (`Confidentiality, Integrity and Availability`),
    other principles or services may be necessary for the protection of information,
    such as:


    - authenticity: the fact of an entity actually being what it claims to be;

    - nonrepudiation: the fact of not being able to deny a transaction that has been
    made. It consists of obtaining proof of the transmission of information, or of
    its receipt;

    - traceability: this is the characteristic that preserves traces of the condition
    and movements of information. It involves retracing histories and the use or localization
    of information by means of a documenting mechanism.


    Security can be broken down to encompass multiple levels:


    - prevention: protects a business''s assets from being attacked;

    - detection: determining when, how and by whom an asset has been damaged;

    - reaction: being able, after a security-related incident, to restore assets or
    reduce the impact of the incident.


    IT system security encompasses physical security against theft and incidents of
    force majeure (fire, earthquake, floods), software security (operating systems
    and applications), human security (employee awareness) and organizational security.


    IT system security generally involves measures against threats, vulnerabilities
    and attacks:


    - threats: events likely to occur that would be harmful to the business''s resources;

    - vulnerabilities: characteristics inherent to an asset that may constitute a
    weakness or flaw related to IT security. These vulnerabilities can be organizational
    (no security policy), human (staff not trained), software-related (design and
    programming errors) or hardware-related (use of unreliable products);

    - attacks: malicious actions that harm the security of an asset. An attack represents
    the concretization of a threat and/or requires the exploitation of a vulnerability.


    ## 6.3. Threats/attacks


    Attacks include any action that may compromise the security and functioning of
    an IT system. There are multiple motivations for attacks including the theft of
    sensitive information, disruption of system operation, use of system resources
    for other purposes, etc.


    The process of an attack begins with the collection of information pertaining
    to the system targeted, and then the determination of corresponding vulnerabilities,
    followed by the execution of the attack proper and finally removal of the traces
    of this attack.


    Attacks can be grouped into four categories.


    ### 6.3.1. Access attacks


    Any attempt to access information by an unauthorized person. This type of attack
    affects confidentiality of information. Sniffing, social engineering and password
    hacking are examples of this type of attack.


    ### 6.3.2. Modification attacks


    Any attempt to modify information. This type of attack targets information integrity.
    Viruses, worms and Trojan horses are examples of this type of attack.

