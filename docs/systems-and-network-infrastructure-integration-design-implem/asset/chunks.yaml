  trans: '


    网络虚拟化是基于将硬件网络资源以软件形式抽象化。它将网络服务与其运行的硬件分离。因此，物理网络资源（特别是 `switches` 交换机和 `routers`
    路由器）可以通过集中管理系统的中间介进行访问。这一过程提高了网络的生产力和效率。


    具体而言，它涉及将某些网络功能（`firewall` 防墙、`NAT` 等）转换为程序。通过这种方式，新网络功能的部署或更新被极大简化，成本也随降低。


    这些虚拟化网络功能的管理由名为 `SDN`（软件定义网络）控制器的网络控制器执行，该控制器控制网络、提高其性能并实现服务的自动化。


    ### 7.2.3.5. 工作站虚拟化


    工作站功能是基于虚拟基础设施提供的。这种方法是有益的，因为它确保了 IT 设施的集中化、简化化管理，并用既更具成本效益且更环保的客户端取代了传统的工作站。


    此外，它满足了从任何地方持续访问的需求，这种移动性需求对于当今企业来说已变得无处不在。因此，笨重且在 2-3 年内就会过时的传统桌面被虚拟桌面或 `VDI`（虚拟桌面集成）所取代。


    这种形式的虚拟化还减轻了企业需要管理自身 IT 设施以及相关维护负担的压力。每个用户都可以访问托管在数据中心虚拟服务器上的其自己的工作环境。


    ### 7.2.4. 虚拟化的分类


    虚拟化是一种提供独立于硬件平台的若干项 IT 资源的方法，根据 图 7.2 所示，它可以被分为四类。


    ![图 7.2. 虚拟化的分类](img/fig7_2.jpg)


    **图 7.2.** 虚拟化的分类


    #### 7.2.4.1. 基于隔离的虚拟化


    此类可以涉及应用程序或进程，其基础是使用特定的软件程序将应用程序的执行限制在定义良好的环境中，使得运行多个相同程序的实例成为可能。`Open VZ` 提供了进程虚拟化的示例。


    ![图 7.3. 基于隔离的虚拟化。彩色版本的图片请参阅 www.iste.co.uk/helali/systems.zip](img/fig7_3.jpg)


    **图 7.3.** 基于隔离的虚拟化。彩色版本的图片请参阅 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)


    #### 7.2.4.2. 半虚拟化或 1 型虚拟机程序


    虚拟机程序直接运行在硬件上，因此避免了使用完整的宿主机操作系统，并将限制在通用操作系统的基本内核服务（在本例中为虚拟机内存的管理和调度）。在这种情况下，客户操作系统经过了修改并承认自己已被虚拟化，然后依赖虚拟机程序来访问物理服务器的硬件资源。这类虚拟化显示出高性能，但成本高昂。示例包括
    `VMphere(ESXi)`、`KVM` 和 `Microsoft Hyper V`。


    ![图 7.4. 半虚拟化。彩色版本的图片请参阅 www.iste.co.uk/helali/systems.zip](img/fig7_4.jpg)


    **图 7.4.** 半虚拟化。彩色版本的图片请参阅 `www.iste.co.uk/helali/systems.zip`


    #### 7.2.4.3. 完全虚拟化


    这种类型的虚拟化也称为 `type 2 hypervisor`。它基于经典的操作系统。目标是在硬件共存的同时共享 IT 资源。`Guest`（客户）操作系统感知不到自己被虚拟化。这种方法的示例包括
    `VirtualBox`、`Oracle VM` 和 `HyperV`。


    ![图 7.5. 完全虚拟化。彩色版本的图片请参阅 www.iste.co.uk/helali/systems.zip](img/fig7_5.jpg)


    **图 7.5.** 完全虚拟化。彩色版本的图片请参阅 `www.iste.co.uk/helali/systems.zip`


    #### 7.2.4.4. 硬件辅助虚拟化


    这代表了使用 `AMD-V` 和 `Intel VT` 对完全虚拟化的改进。此类包括 `VMWare`、`VirtualBox` 和 `Virtual PC`。


    ### 7.2.5. 虚拟化的局限性


    尽管虚拟化具有巨大的优势，但也存在一些缺点。


    托管各种虚拟机的物理机器或服务器必须非常强大，并配备最先进的技术。这些特性的成本自然非常高昂。


    虚拟化的主要问题是物理服务器可能会遇到问题或发生故障。如果发生这种情况，虚拟机将无法使用。


    使用虚拟化可能会降低性能，因为虚拟化本身占据了机器约 30% 的负载。然而，这种性能下降的影响程度取决于虚拟化的类型。


    虚拟机程序中的安全漏洞会使所有虚拟机暴露在安全风险之中。如果不定期进行更新和打补丁，虚拟系统将成为攻击者的首选目标。


    ## 7.3. 云计算


    ### 7.3.1. 定义


    `Wikipedia` 将云计算定义为一种概念，由将传统的在本地服务器或用户工作站执行的 IT 过程置于远程服务器组成。


    `NIST`（美国标准与技术研究院）将云计算定义为通过电信网络按需自服务地访问共享的虚拟化 IT 资源。它是企业 IT 基础设施的迁移。


    ### 7.3.2. 放杆因素和通用原则


    许多因素对云计算的出现和成功做出了巨大贡献。


    IT 系统的持续发展，例如新处理器计算能力的提升、Web 技术的飞速发展、公司面向互联网开放以及目前的去中心化趋势，逻辑上地导致了云计算的产生。


