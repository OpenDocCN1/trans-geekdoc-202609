    并不是所有的 IP 地址域名对应关系都能由单台服务器掌握。如果 DNS 服务器没有找到对应的名称，它会向另一个服务器请求信息，然后是另一个，以此此类推，直到找到知晓该对应关系的服务器为止。某些服务器负责某个区域或对该区域拥有权威权限（例如
    .org），还有解析器服务器，它们请求域名解析并将结果保存在自己的缓存中，持续一段时间。


    域名以树形形式组织，并从右到左读取。


    ![图 5.7. 域名的树形结构。需要该图彩色版本，请访问 www.iste.co.uk/helali/systems.zip](img/fig5_7.jpg)


    **图 5.7.** *域名的树形结构。需要该图彩色版本，请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    用于 DNS 解析的命令有：


    - 用于 Linux 系统的 `#dig` [www.cisco.com](http://www.cisco.com)；

    - 用于 Windows 的 `nslookup` [www.cisco.com](http://www.cisco.com)。


    DNS 服务的运行可以总结如下：


    - 通过这些资源的注册对域资源进行清单和指定；

    - 通过命名系统进行分级组织；

    - 通过递归查询机制按区域分配信息；

    - 由解析器服务器解析 IP 地址中的名称。


    ![图 5.8. DNS 工作原理。需要该图彩色版本，请访问 www.iste.co.uk/helali/systems.zip](img/fig5_8.jpg)


    **图 5.8.** *DNS 工作原理。需要该图彩色版本，请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    拥有权威性的服务器专门负责其所属区域以及 DNS 服务的运行。因此，应该安装在主服务器故障时接管的备份 DNS 服务器。这些备份服务器可以提供更好的容错能力。


    要建立 DNS 服务器，可以使用 `BIND` 服务器，或者在 Windows 服务器上安装 DNS 角色。在 Cisco 路由器上配置 DNS 服务器也是可行的，但这种方法在大规模网络中并不推荐，因为
    DNS 服务需要消耗大量资源。


    ## 5.4. LDAP 服务


    ### 5.4.1. 引言


    一个集中存储用户信息、硬件及软件资源信息的目录或引用，可以方便并提高数据访问的安全性，从而提升业务性能。使用目录可以确保企业内部使用的各种应用程序运行所需数据的一致性。这项服务对任何
    IT 基础设施无疑都是有益的，因为它能够更好地利用相应的 IT 系统，而这些系统现在已成为其神经中心。该目录主要为数据管理、身份验证和访问控制问题提供了解决方案，考虑到这些问题具有多变和分散的特性，其重要是不容忽视的。出于互操作性，应该选择符合
    `LDAP`（轻量级目录访问协议）标准的目录，以便与现有的 IT 应用建立接口。目录的结构应该反映企业的内部组织结构。目录是一种系统架构组件，因此确保了对用户和资源的优化管理。


    `LDAP` 服务器是一种可以通过 `LDAP` 协议进行查询的目录服务，其内部结构对应 `LDAP` 规范。


    已知的 `LDAP` 服务器实现有 `Open LDAP` 和 `Microsoft Active Directory`。


    目录服务的主要优势是：


    - 大多数时候，目录主要用于可读而非可写；

    - 目录将其数据组织成分级树形；

    - 目录树的子树可以分布在多个主机上；

    - 目录树区域可以通过委托易于管理；

    - 目录树使得从开始就可以将搜索限制在指定的子树中；

    - 许多目录服务基于 `X500` 模型，因此从一开始就负责处理面向对象的数据模型。


    ### 5.4.2. LDAP 协议


    这是一种客户端-服务器协议，定义了客户端必须使用的访问服务器数据的方法。该协议是 `X500` 协议的轻量版本，或更准确地说是 `DAP`（目录访问协议），现在已由
    `IETF`（互联网工程任务组）标准化，并在 `TCP` 上以连接模式运行，端口 `389` 对应 `LDAP`，端口 `636` 对应 `LDAPS`（基于
    SSL 的 LDAP）。


    ![图 5.9. LDAP 工作模式](img/fig5_9.jpg)


    **图 5.9.** *LDAP 工作模式*


    一个 `LDAP` 会话通常包括三个阶段：


    - 第一阶段，`LDAP` 客户端连接到 `LDAP` 服务器。除了初始化外，还会交换关于客户端承担的（扩展）`LDAP` 功能的信息，必要时还会进行加密选项的身份验证和协商；

    - 一旦成功建立连接，客户端和服务器之间交换消息；

    - 在最后一个阶段，客户端结束会话。


    `LDAP` 协议提供以下功能：


    - 连接的开启和关闭；

    - 信息搜索；

    - 信息的添加、修改和删除。


    这些功能是通过表 5.1 所示所示的过程实现的。


    **表 5.1。** *LDAP 操作列表*


    | 消息 | 功能 |

    | --- | --- |

    | `bind` | 会话，客户端指定协议版本和身份验证信息 |

    | `unbind` | 结束会话 |

    | `search` | 在目录中搜索 |

    | `modify` | 修改条目的属性（添加、删除、替换） |

    | `add` | 添加新条目。客户端指定名称和属性列表 |

    | `delete` | 删除条目 |

    | `modify RDN` | 修改条目或整个子树的 RDN |

    | `compare` | 测试条目是否符合特定的属性值对 |

    | `abandon` | 告诉服务器不再需要特定搜索的结果 |


    此外，它允许通过 `TLS` 或 `SSL` 协议使存储中的中的信息更安全。


    ### 5.4.3. LDAP 目录


    目录允许以分类组织并以树的形式呈现数据，类似于电话簿或黄页，按字母顺序列出姓名、电话和地址。同样，还有包含公司不同部门的用户或用户组目录、电子证书目录、计算机设备目录等。


    目录与关系型数据库不同。它的设计是使得读取请求多于写入请求。它具有树形结构，而不是数据库的关系型结构。此外，目录确保了互操作性，并且更容易复制。目录修改并不频繁，会被记录并同步到备份目录。


    `LDAP` 服务器以树的形式存储数据，称为 `DIT`（目录信息树）。`DIT` 的结构由标准的、可扩展的 `LDAP` 决定。


    该树的根节点是托管 `LDAP` 服务器的域名名称。条目成为树的分支或叶子。每个 `DIT` 条目都属于一个或多个对象类别，这些类别规定了对象的哪些属性是必的，哪些是可选的。


    ![图 5.10. 数据树（DIT）的示例](img/fig5_10.jpg)


    **图 5.10.** *数据树（DIT）的示例*


