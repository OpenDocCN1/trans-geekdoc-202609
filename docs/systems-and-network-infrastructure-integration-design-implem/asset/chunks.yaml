    ### COS-DSCP 映射详情


    `COS-DSCP` 对应表用于映射二层和三层之间的流量优先级级别。


    ### VoIP 流量配置


    为了管理 VoIP 流量，所需的 `DSCP` 值是 `EF`（快速转发）。在我们案例中，端口配置为信任 `COS` 值（`mlsqos trust cos`）。在这里，交换机通过
    `COS-DSCP` 表计算 `DCSP` 值 `CS5` (40) 以获得 `COS` 值 5。因此，语音流量通过 `DSCP` 值 `CS5` 识别。这不是我们需要的值。为了获得
    `DSCP` 值 `EF`，我们使用以下命令：


    ```

    Switch(config)# mlsqos map cos-dscp0 8 16 24 32 46 48 56

    ```


    ### 配置验证


    结果是修改后的 `COS-DSCP` 对应表，如表 8.6 所示。要验证接口上的配置，请使用以下命令：


    ```

    Switch# show interfaces fa/1 switchport

    ```


