    GNS3 计算了 `IDLE PC` 的可能值并提供了一系列选择，如图 2.6.所示。


    ![图 2.6. IDLE PC 值的建议范围。彩色版图片请访问 www.iste.co.uk/helali/systems.zip](img/fig2_6.jpg)


    图 2.6. *IDLE PC 值的建议范围。彩色版图片请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    使用`Task Manager`（任务管理器），我们可以测试在何种建议的 `IDLE PC` 值对处理器负载的影响程度。


    ### 2.3.4.2. 构建简单的网络拓扑结构


    我们首先选择一个路由器。只有我们已经提供了 `IOS` 镜像的路由器类型是可用的；其他所有类型均显示为灰色。在图 2.7 中，我们有两个可用的路由器模型（之前添加的
    `C1700` 和现有的 `C3600`）。


    ![图 2.7. 可用的路由器镜像。彩色版图片请访问 www.iste.co.uk/helali/systems.zip](img/fig2_7.jpg)


    图 2.7. *可用的路由器镜像。彩色版图片请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    使用`Drag & Drop`（拖放功能），我们将所需的路由器拖入主窗口。


    ![图 2.8. 向拓扑结构中添加路由器。彩色版图片请访问 www.iste.co.uk/helali/systems.zip](img/fig2_8.jpg)


    **图 2.8.** *向拓扑结构中添加路由器。彩色版图片请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    要配置路由器，右键点击并选择`CONFIGURE`。


    ![图 2.9. 路由器的配置。彩色版图片请访问 www.iste.co.uk/helali/systems.zip](img/fig2_9.jpg)


    **图 2.9.** *路由器的配置。彩色版图片请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    在此处可以调整内存值，并且根据类型还可以添加不同的模块化位置。


    GNS3 提供了一系列可以虚拟安装在路由器中的模块。


    要连接这两个路由器，只需使用左侧按钮选择相应的连接类型，然后拖动到相应的路由器。


    从 `R1` 拖动到 `R2`。


    ![图 10. 路由器之间的连接。彩色版图片请访问 www.iste.co.uk/helali/systems.zip](img/fig2_10.jpg)


    **图 10.** *路由器之间的连接。彩色版图片请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    虽然无法模拟交换机，但仍然可以对其进行仿真。通过左侧的连接按钮选择所需的交换机。


    ![图 11. 添加交换机。彩色版图片请访问 www.iste.co.uk/helali/systems.zip](img/fig2_11.jpg)


    **图 11.** *添加交换机。彩色版图片请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    外围设备通过使用左侧连接到交换机（如上所示）。这通常是一个 `Ethernet` 交换机。


    ![图 12. 连接到交换机。彩色版图片请访问 www.iste.co.uk/helali/systems.zip](img/fig2_12.jpg)


    **图 12.** *连接到交换机。彩色版图片请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    交换机可以按照通常的方式进行配置。为此，我们右键点击交换机并选择 `Ethernet` 端口。


    ![图 13. 交换机的配置。彩色版图片请访问 www.iste.co.uk/helali/systems.zip](img/fig2_13.jpg)


    **图 13.** *交换机的配置。彩色版图片请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    #### 2.3.4.3. 配置路由器


    在连接路由器之前，我们必须右键点击路由器并选择`CONFIGURE`，然后选择 `VMnet1` 接口。


    ![图 14. 路由器的配置。彩色版图片请访问 www.iste.co.uk/helali/systems.zip](img/fig2_14.jpg)


    **图 14.** *路由器的配置。彩色版图片请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    #### 2.3.4.4. 添加交换机


    通过此 `VMnet1` 接口连接，每个通过 `VMnet1` 连接的虚拟机 (VM) 都被集成到 GNS 中。利用相同的原理，我们可以使用主机计算机的物理接口作为云来集成物理环境。


    ##### 方法 1


    有一个现成的虚拟机，我们将修改其网络参数。例如，我们选择 `adapter2` 卡，并将其设置为 `Host-only Adapter`。


    一旦虚拟机配置完成，我们将准备 GNS3 以集成该机器。


    为此，我们启动软件程序并进入 `Edit`，然后选择 `Preferences`，最后进入 `VirtualBox` 菜单。


