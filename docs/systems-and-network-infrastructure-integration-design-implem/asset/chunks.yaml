    ### 路由器 1 的配置


    `GigabitEthernet 0/0` 接口配置在 `HSRP` 组 1 中。它被分配了虚拟 IP 地址 `192.168.1.254`。优先级设置为
    250（使用最高优先级来选出活动路由器），并激活了抢占权（preemption），即如果路由器 1 停止工作，路由器 2 将接管。如果路由器 1 重新运行，它将恢复角色。在非抢占的情况下，路由器
    2 将保留活动或网关路由器的角色。`gi0/0` 接口的真实 IP 地址为 `192.168.1.1`：


    ```

    Router1(config)#interface gi0/0

    Router1(config-if)#standby 1 ip 192.168.1.254

    Router1(config-if)#standby priority 250

    Router1(config-if)#standby 1 preempt

    ```


    ### 路由器 2 的配置


    R2 的优先级较低，因此不需要激活抢占。接口 `gi0/0` 分配了真实 IP 地址 `192.168.1.2`：


    ```

    Router2(config)#interface gi0/0

    Router2(config-if)# standby 1 ip 192.168.1.254

    ```


    我们在路由器 3 上配置了一个回环接口 `1.1.1.1/32`，用以模拟 Internet 连接，以便测试 PC0 与回环接口之间的连通性。


    要验证三层冗余协议的实现，使用了 `show standby` 命令：


    ```

    Router1#show standby

    GigabitEthernet0/0 - Group 1

    State is Active

    5 state changes, last state change 00:00:32

    Virtual IP address is 192.168.1.254

    Active virtual MAC address is 0000.0C07.AC01

    Local virtual MAC address is 0000.0C07.AC01 (v1 default)

    Hello time 3 sec, hold time 10 sec

    Next hello sent in 0 secs

    Preemption enabled

    Active router is local

    Standby router is 192.168.1.2, priority 100 (expires in 7 sec)

    Priority 250 (configured 250)

    ```


    Router2#show standby

    GigabitEthernet0/0 - Group 1

    State is Standby

    5 state changes, last state change 00:00:32

    Virtual IP address is 192.168.1.254

    Active virtual MAC address is 0000.0C07.AC02

    Local virtual MAC address is 0000.0C07.AC02 (v1 default)

    Hello time 3 sec, hold time 10 sec

    Next hello sent in 0 secs

    Preemption disabled

    Active router is local

    Standby router is 192.168.1.1, priority 250 (expires in 7 sec)

    Priority 100 (configured 100)

    ```


    `tracert` 命令有效地告诉我们活动路由器确实是路由器 1。


    ![](img/fig8_u.jpg)


    我们现在通过禁用 `gi0/0` 来模拟路由器 1 的故障


    ![图 8.19. 路由器 1 的故障模拟。彩色版本请参见 www.iste.co.uk/helali/systems.zip](img/fig8_19.jpg)


    ### 8.3.4. 应用层的冗余


    尽管在网络基础设施的硬件组件使用了冗余，但某些因素可能由于软件或应用程序的故障导致服务不可用。因此，为了提高 IT 系统的可用性，必须对 Web 服务器、DNS
    服务器或数据库使用应用冗余。


    为此，开发了诸如负载均衡、服务器切换和会话切换等方法，这些方法旨在通过在多台计算机之间分发连接以及通过访问权限验证来减轻服务器负担。负载均衡可以用于多个提供相同网页的服务器，并将它们组成一个集群。一种典型的配置是终端使用一个公共虚拟
    IP 地址访问集群，负载均衡器将其转换为所用服务器的真实地址。负载均衡有助于提高 QoS，因为它允许调节流量，从而减少负载峰值并避免拥塞问题。


    负载均衡现在由硬件和软件解决方案共同管理。微软的 `NLB`、`HAProxy`、`Safekit` 以及 Linux 的虚拟服务器都是一些软件工具的示例。


