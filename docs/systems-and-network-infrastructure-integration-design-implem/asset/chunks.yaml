    # 5 Network Services


    > “Think like a client.”

    > Paul Gillin


    - Defining the concept of network services.

    - Understanding the different types of network services.

    - Understanding the operating principle of DHCP service.

    - Understanding the principle of name resolution with a DNS system.

    - Understanding how the SMTP protocol functions to operate an e-mail server.

    - Understanding how a web server functions.

    - Understanding how a file transfer server functions.


    ## 5.1. Introduction


    IT networks, which have become omnipresent in every part of human life, were designed
    to provide services. These services are based on the client/server approach, in
    which a client requests a specific service from the corresponding server.


    A server is an entity that provides a service to a group of computers called clients
    via a network.


    The services provided vary widely, ranging from file sharing, data and IT resources
    (printer, fax, etc.), storage, logic address attribution, e-mail, name resolution,
    etc.


    These services depend on the needs to be met and thus differ from one enterprise
    to another. However, certain services are always requested, and we refer to these
    services as common or base services, which will be discussed throughout this chapter.


    ## 5.2. DHCP service


    ### 5.2.1. Introduction


    DHCP (Dynamic Host Configuration Protocol) is a standardized TCP/IP protocol designed
    to simply manage and automate the IP address configuration. In a TCP/IP network,
    each computer must have a computer name and a unique IP address. The IP address
    (with its associated subnet mask) identifies the host computer and the sub-network
    to which it belongs. When a computer is moved to another sub-network, the IP address
    must be changed. DHCP allows an IP address to be dynamically assigned to a client,
    based on the database of IP addresses and managed by the local network''s DHCP
    server.


    For TCP/IP networks, DHCP reduces the complexity and amount of administrative
    work involved in the reconfiguration of computers. In fact, this dynamic addressing
    has several advantages. Only functioning stations use an address from the address
    space.


    Modification of address parameters, that is, the default gateway address, DNS
    server addresses, etc., is managed by the DHCP server and provided to the computing
    stations.


    ### 5.2.2. Operating principle


    The operation of the DHCP protocol is summarized in [Figure 5.1](#c05.xhtml#figure1).


    ![Figure 5.1. Overall functioning of DHCP](images/fig5_1.jpg)


    **[Figure 5.1.](#c05.xhtml#figureanchor1)** Overall functioning of DHCP


    A device configured to use the DHCP protocol, also called the DHCP client, broadcasts
    upon startup an IP address request (`DHCPDISCOVER`) on UDP port `67` with:


    - source `0.0.0.0`;

    - destination `255.255.255.255`;

    - client MAC address.


    ![Figure 5.2. Stage 1 of the DHCP process](images/fig5_2.jpg)


    **Figure 5.2.** Stage 1 of the DHCP process


    This DHCP client waits to receive an offer, which is of course issued by a DHCP
    server after one second. If this does not happen, it rebroadcasts its request
    four times, the first after 9 seconds, the second after 13 seconds, the third
    after 16 seconds, and the last following a random period of time between 0 and
    1 second. If all four attempts fail, it repeats its request after 5 minutes.


    All DHCP servers receive the request. Those configured to respond broadcast offers
    (`DHCPOFFER`) with the following information:


    - client MAC address;

    - an IP address;

    - a subnet mask;

    - a lease time (the time during which the IP address will not be used by another
    network device);

    - its IP address.


    ![Figure 5.3. Stage 2 of the DHCP process](images/fig5_3.jpg)


    **Figure 5.3.** Stage 2 of the DHCP process


    The client chooses an offer (generally the first one) and announces via broadcast
    that it has done so via (`DHCPREQUEST`). The message `DHCPREQUEST` includes the
    identification of the server selected, which now knows that its offer has been
    chosen, and that other DHCP servers, if they exist, must now withdraw their offers.


    ![Figure 5.4. Stage 3 of the DHCP process](images/fig5_4.jpg)


    **Figure 5.4.** Stage 3 of the DHCP process


    The server chosen sends an acknowledgment to the client via the message `DHCPACK`,
    which may contain other information (DNS server, gateway, etc.).


    ![Figure 5.5. Stage 4 of the DHCP process](images/fig5_5.jpg)


    **Figure 5.5.** Stage 4 of the DHCP process


    The DHCP service can be installed and configured in one of three ways:


    - by installing, in Debian, for example, the `isc-dhcp-server` packet and modifying
    `dhcpd.conf` according to need;

    - by adding the DHCP role to a Windows server;

    - by configuring the DHCP service on a router.


    ### 5.2.3. Renewal of lease


    The assignment of an IP address is temporary, as the client can use it only for
    a specified amount of time called the lease. Once the client obtains the lease,
    this lease must be renewed before its expiration via another `DHCP REQUEST` message.
    There are two ways to renew a lease:


    - automatic (time triggered): if 50% of the lease period has elapsed, the client
    sends a `DHCPREQUEST` message to renew the lease. If the request is accepted,
    the client continues with a new lease and possibly new parameters (`DHCPACK`).
    If the server, in this case, a Windows server, does not reply, the lease remains
    available for the remaining 50% of the initial lease time;

    - manual: the user manually forces the renewal of the lease via the following
    commands:


    ```bash

    ipconfig/renew //this command generates a DHCPREQUEST

    ipconfig/release //this command terminates the lease.

    ```


    In addition, if a DHCP server realizes that a client lease is reaching its termination
    date, it can send a `DHCPNAK` message to ask if the client wants to extend its
    lease. If the server does not receive a valid reply, it releases the assigned
    address. In this way, the assignment of IP addresses based on leases can be optimized.


    ### 5.2.4. The concept of a DHCP relay


    The DHCP relay agent is configured so as to relay DHCP discoveries coming from
    UDP port `67` toward the DHCP server. Like a DHCP server, it must have a static
    IP address and must recognize the IP address of the main DHCP server.


    ![Figure 5.6. A DHCP relay](images/fig5_6.jpg)


    **Figure 5.6.** A DHCP relay


    ## 5.3. DNS service


    ### 5.3.1. Introduction


    Modern networks are made up of sub-networks which are in turn composed of multiple
    machines accessible via their IP addresses. With the proliferation of teleinformatics
    networks, it has become practically impossible for users to know all the IP addresses
    of the machines to which they wish to connect. Consequently, these difficult-to-retain
    digital addresses are converted into simpler, more intuitive domain names via
    the DNS (Domain Name Server) service. For example, it is easier to memorize `www.cisco.com`
    than the IP address of the corresponding server, `23.50.178.229`. In addition,
    domain names are stable, while IP addresses can change. This stability guarantees
    continuous access to the site in question.


    ### 5.3.2. Operating principle


    DNS is composed of a group of servers distributed according to a hierarchized
    model which cooperate to automatically assign domain names to the corresponding
    digital IP address. This operation is referred to as *resolution*.


    The name space is subdivided into zones administrated by specific servers.

