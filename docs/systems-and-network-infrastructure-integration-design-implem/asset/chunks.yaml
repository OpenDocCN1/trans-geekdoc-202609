    [Figure 8.13.](#c08.xhtml#figureanchor13) Failure of prioritized frame transmission.
    For a color version of the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)


    To rectify this situation, a configuration based on the MQC approach, which consists
    of defining a traffic class, creating a corresponding traffic policy, and attaching
    it to an interface, can be applied.


    ### Configuring flow classes


    We will first define two access control lists:


    ```

    Switch(config)# ip access-list extended voice

    Switch(config-std-nacl)#permit ip 192.168.10.0 0.0.0.255 any

    Switch(config-std-nacl)#ip access-list extended others

    Switch(config-ext-nacl)#permit tcp any any eq 1521

    Switch(config-ext-nacl)#permit tcp any any eq 1810

    Switch(config-ext-nacl)#permit tcp any any eq 2481

    Switch(config-ext-nacl)#permit tcp any any eq 7778

    ```


    Next, two classes of service will be configured:


    ```

    Switch(config)#class-map classvoice

    Switch(config-cmap)#match access-group name voice

    Switch(config-cmap)#exit

    Switch(config)#class-map pcs

    Switch(config-cmap)#match access-group name others

    ```


    ### Creating the policy to be adopted


    ```

    Switch(config)#policy-map test

    Switch(config-pmap)#class classvoice

    Switch(config-pmap-c)#set precedence 7

    Switch(config-pmap-c)#exit

    Switch(config-pmap)#class pcs

    Switch(config-pmap-c)#set dscp af21

    ```


    ### Attaching the policy created to the interface


    The policy must be applied at the interface entry, in our case `fa0/1` and `fa0/4`:


    ```

    Switch(config)#int fa0/1

    Switch(config-if)#service-policy input test

    Switch(config)#int fa0/4

    Switch(config-if)#service-policy input test

    ```


    Now, the IP telephones are transmitted prioritized frames as shown by the content
    of the frames exchanged between the IP telephone (IP Phone 3) and the switch in
    packet tracer simulation mode in [Figure 8.14](#c08.xhtml#figure14).


    ![Figure 8.14. Successful transmission of prioritized frames](images/fig8_14.jpg)


    [Figure 8.14.](#c08.xhtml#figureanchor14) Successful transmission of prioritized
    frames


    The DSCP value is equal to `0x38`, which gives in decimal points the value `56`.
    This corresponds to the class `CS7` that we have defined.


    ## 8.3. High availability


    High availability can be defined as a system''s capacity to ensure the provision
    of a service during a given period.


    It represents all of the methods and means that contribute to ensuring that an
    IT infrastructure always provides the planned functionalities and services. Redundancy,
    backup, data replication and load distribution help to ensure high availability
    of the IT system. This high availability helps to ensure greater reliability and
    increased security, allowing the company to provide a higher SLA and thus higher
    QoS.


    **Table 8.8.** Rates of availability in nines


    | Rate of availability | Duration of non-availability (per year) |

    | --- | --- |

    | 99% | 3 days and 15 hours |

    | 99.9% | 8 hours and 48 minutes |

    | 99.99% | 53 minutes |

    | 99.999% | 5 minutes |

    | 99.9999% | 32 seconds |


    The high availability approach with its different facets should be managed and
    studied from the design phase onward. The implementation of highly available infrastructures
    requires synergy among the design, procedures and technologies deployed. In this
    context, certain key questions must be asked about each network infrastructure,
    including the parts of the network in which high availability is required, and
    the parts in which it is not.


    As a general rule, the datacenter, server area and backbone network are particularly
    vital in terms of availability. New methods such as link aggregation, router redundancy
    protocols and load balancing enable improved availability thanks to automatic
    malfunction tolerance (redundancy) and the quick switching time that comes with
    load balancing.


    Redundancy is a procedure based on the multiplication of various components of
    an IT infrastructure (electrical energy sources, climate-control systems, network
    equipment, storage solutions, etc.). The goal is to ensure that it will function
    in the event that one or more of these components break down, thus guaranteeing
    its high availability. It can be deployed in all layers of the OSI model, from
    the physical layer to the application layer.


    ### 8.3.1. Redundancy in the physical layer


    This is a matter of multiplying hardware and cabling. The fact of having multiple
    interfaces available on a piece of equipment, such as teaming for network cards,
    multiple sources of electrical power, and RAID hard disks, are some examples of
    this.


    ### 8.3.2. Redundancy in the data link layer


    #### 8.3.2.1. STP protocol


    Designed for switches and standardized with the norm IEEE802.1D, this protocol
    is used to determine a loop-free path in a switched and redundant physical topology,
    that is, with loops that cause broadcast storms. It detects and deactivates real
    topology loops, thus providing a logical topology in the form of a tree. If a
    link fails, a new path is recalculated and the network is functional again.


    ![Figure 8.15. Principle of the STP protocol](images/fig8_15.jpg)


    Figure 8.15. Principle of the STP protocol


    #### 8.3.2.2. EtherChannel


    EtherChannel is a technology used to aggregate links or ports provided mainly
    by Cisco switches. It groups several physical links into a single logical link
    in order to improve bandwidth and to provide a level 2 redundancy mechanism. During
    normal operation, the load is balanced across all interfaces and, in the event
    of malfunction, data transport is confined to the remaining lines.


    An EtherChannel link is composed of between two and eight active links which can
    be 100 Mbit/s, 1 Gbit/s or 10 Gbit/s, and possibly between one and eight inactive
    links in reserve for the event that the active links become unavailable. Indeed,
    theoretically, an aggregation of 4 100 Mb/s ports supplies a logical port with
    an output of 400 Mb/s.


    The implementation of EtherChannel technology must fulfill the following conditions:


    - equipment interfaces must support EtherChannel;

    - the same duplex mode (full duplex/half duplex) on both sides;

    - the same speed on both sides;

    - the same VLAN range authorized on both sides.


    ![Figure 8.16. EtherChannel](images/fig8_16.jpg)


    Figure 8.16. EtherChannel operation


    EtherChannel technology is configured in two ways


    The first method is purely manual; the appropriate commands must be entered on
    each port to be aggregated, on both sides of the link.


    The second method is automatic and based on one of the two Cisco protocols: specifically,
    the Port Aggregation Protocol (PAgP) and the LACP protocol (Link Aggregation Protocol).
    At this stage, the existence of other protocols from other manufacturers should
    be indicated; in this case, Nortel MLT (Multi Link Trunking).


    ##### Example of manual configuration


    The objective is to create an EtherChannel of two `comm1` and `comm2` switches
    by aggregating the two ports `fa0/1` and `fa0/2`.


    We will begin with the `comm1` switch:


    ```

    comm1(config)#interface fastethernet 0/1

    comm1(config-if)#port group 1 distribution destination

    comm1(config-if)#interface fastethernet 0/2

    comm1(config-if)#port group 1 distribution destination

    comm1(config-if)#exit

    ```


    The `comm2` switch is configured as follows:


    ```

    comm2(config)#interface fastethernet 0/1

    comm2(config-if)#port group 1 distribution destination

    comm2(config-if)#interface fastethernet 0/2

    comm2(config-if)#port group 1 distribution destination

    comm2(config-if)#exit

    ```


    ##### Example of configuration with the PAgP and LCAP protocols


    The network topology is shown in [Figure 8.17](#c08.xhtml#figure17).


    ![Figure 8.17. Mock LACP and PAgP protocol configurations](images/fig8_17.jpg)


    [Figure 8.17.](#c08.xhtml#figureanchor17) Mock LACP and PAgP protocol configurations


    The PAgP protocol is a proprietary Cisco protocol referenced with IEEE802.3ad
    which offers three modes: on, desirable and auto.

