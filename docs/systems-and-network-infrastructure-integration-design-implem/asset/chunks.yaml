    Take a server listening to `192.168.0.1:80` and `192.168.0.2:80`. It must serve
    the names `server1`, `server2`, `server3` and `server4`. Playing with `NameVirtualHost`,
    we will tell Apache the first direction, that of the IP/port. Once this direction
    has been carried out, Apache will analyze the name in the `Host` header and direct
    it into the `<VirtualHost>` block, which specifies it with the directive `ServerName`.


    ![Figure 5.15. Virtual host by IP and name](images/fig5_15.jpg)


    **Figure 5.15.** Virtual host by IP and name


    ## 5.7. FTP file transfer service


    ### 5.7.1. Definition


    FTP (File Transfer Protocol) is a file transfer protocol. This transfer is executed
    via a connection between an FTP server and a client located on a computer. Online
    posting, increase in the number of documents online and website maintenance are
    frequently carried out via this protocol. The secure variant is `FTPS`.


    ### 5.7.2. Operating principle


    The FTP protocol is based on the TCP protocol. To access an FTP server, an FTP
    client is required. This client can function via command line (`ftp`, `Curl`)
    or in graphic mode (`Filezilla`).


    It provides two types of connection:


    - control connection: for the transmission of commands from the client to the
    server. These commands have to do with file transfer, renaming, deletion, etc.;

    - data connection: for pure data transmission. It can be launched from the client
    or the server.


    There are several FTP servers, including but not limited to:


    - `ProFTPd`;

    - `PureFTPd`;

    - `VsFTPd`.


    ### 5.7.3. Types


    There are two types of FTP servers:


    - protected FTP: a password must be supplied to access it (business, university
    course, UVT, etc.);

    - anonymous FTP, for which access is direct and transparent, or can be gained
    by filling out a form with “anonymous ” or sometimes “FTP ” as the login name
    and “your e-mail address ” (or other terms) as the password.


    ![Figure 5.16. FTP architecture](images/fig5_16.jpg)


    **Figure 5.16.** FTP architecture


