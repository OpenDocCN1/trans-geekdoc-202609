    ### 5.6.1. Introduction


    Web servers are used to record information and ensure that users can access it.
    All that is needed is a web address to retrieve an item of web content sent by
    a web server. `HTTP` or `HTTPS` communication protocols manage transmission between
    the web server and the client. They are based on `IP` and `TCP` protocols. A web
    server must always be connected to the Internet and hosts sites accessible by
