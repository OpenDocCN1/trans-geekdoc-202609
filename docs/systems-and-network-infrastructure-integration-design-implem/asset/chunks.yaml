    - Switches: they are layer 2 equipment that controls flow, as well as detects
    and corrects errors and reduces overload. Switches also determine the size of
    the areas of collision and diffusion. They use microsegmentation to reduce the
    size of the collision area, consequently improving network performance. They also
    enable the creation of virtual local area networks (`VLANs`) and broadcasting
    domains separated according to users'' work groups.


    They transfer traffic according to CAM destination addresses found in frames and
    the switching table (`CAM table`).


    A multilayer switch is a switch capable of executing routing tasks and advanced
    services. It is also called an `L3` switch.


    - Bridges, hubs, repeaters: a bridge filters traffic between two physical segments
    according to MAC addresses. A hub concentrates connections and expands the physical
    segment. Unlike switches, traffic exits all of its ports; it does not make any
    decisions about the destination of this traffic and thus presents only a single
    collision domain. A repeater is a piece of equipment that simply regenerates a
    signal.


    - Wi-Fi access points: they supply wireless service within a radio coverage area.


    ### 4.2.3.2. Software part


    The data transmitted by terminal equipment via networks is transported in the
    form of a binary signal via a set of specific rules called communication protocols.


    Protocols constitute a common language used by communicating parties to find one
    another, connect to each other and exchange information. They define a set of
    parameters related to a communication such as physical characteristics (modulation,
    physical support types, connector types) and types and formats of the messages
    exchanged.


    By the early 1970s, each manufacturer had developed its own network solution around
    private architectures and protocols (`SNA` for IBM, `DECnet` for DEC, `DSA` for
    Bull, `TCP/IP` for the DoD, etc.).


    Consequently, it was impossible to interconnect these different “proprietary ”
    networks, and the installation of open – and thus interoperable – systems became
    necessary. Thus, an approach to standardize and define standard communications
    models was implemented by standardization organizations such as `ISO`, `IUT`,
    `IEEE` and `IETF`.


    A communications model simplifies the process of communication between nodes,
    which can be highly heterogeneous in organizing communications in the form of
    a multilayer hull hierarchy. Each layer carries out a function specific to the
    communication and displays determined characteristics.


    In addition, a communications model has multiple advantages: it enables a better
    understanding of the functioning of communications, encourages interoperability,
    simplifies the diagnostic and repair process, and allows the change or addition
    of functionalities to one layer without impacting the others.


    #### The OSI model


    The `OSI` (Open System Interconnection) model was developed by the `ISO` and is
    made up of seven layers, each illustratinga specific network function. It provides
    a reference architecture for exchanges between computers.


    ![Figure 4.2. OSI model. For a color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig4_2.jpg)


    **Figure 4.2.** OSI model. For a color version of the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)


    #### Functions of hardware layers


    The physical, data link, network and transport layers are responsible for the
    transfer of data between the nodes of a network.


    **Table 4.1.** Functions of hardware layers


    | Layer | Role | Example of protocol |

    | --- | --- | --- |

    | Transport | End-to-end data transfer; Delivery in connected and non-connected
    mode; Correction of errors before retransmission | `TCPUDP` |

    | Network | Routing packets from the source toward the destination; Ensuring local
    addressing to determine pathway | `IP` |

    | Data link | Transfer of information between two pieces of equipment connected
    by a physical supportMedia accessPhysical addressing addressingError detection`
    | `HDLC`, `Ethernet`, `Token Ring`, `Wi-Fi` |

    | Physical | Routing bits between pieces of equipmentSpecifying voltage, support
    and the type of connector |  |


    #### Functions of software layers


    The session, presentation and application layers are responsible for managing
    applications.


    **Table 4.2.** Functions of software layers


    | Layer | Role | Example of protocol |

    | --- | --- | --- |

    | Application | User interface | `HTTP`, `FTP` |

    | Presentation | Data representation; Specific processing (compression, encryption)
    | `ASCIIIEBCDIC`, `JPEG` |

    | Session | Management of dialogue between users; Separation of data from different
    applications | Operating system |


    #### The TCP/IP model


    `TCP/IP` was invented by the US Department of Defense (`DoD`), which was seeking
    a routable, robust and high-functioning protocol that could be used to create
    wide area networks able to function even in the event of nuclear war.


    `TCP/IP` has become the standard model for interoperability between heterogeneous
    computers. This interoperability is one of the main assets of `TCP/IP`. The success
    of the `TCP/IP` model is due largely to its openness. Source codes developed independently
    of a specific architecture or a particular operating system are available at no
    cost.


    Consequently, `TCP/IP` protocols do not rely on physical supports and can function
    on any type of platform. Indeed, `TCP/IP` can be transmitted by various types
    of supports, including a serial line, a coaxial `Ethernet` cable, a leased line,
    a token-ring network, a radio link, a laser ray link, infrared, `ATM`, fiber optic,
    etc.


    The `TCP/IP` model is made up of four layers: application, transport, Internet
    and network access.


    ![Figure 4.3. TCP/IP model](images/fig4_3.jpg)


    **Figure 4.3.** TCP/IP model


    The role of each of the four layers is specified in [Table 4.3](#c04.xhtml#table3).


    **[Table 4.3.](#c04.xhtml#tableanchor3)** Layers of the TCP/IP model


    | Layer | Role |

    | --- | --- |

    | Application | File transfer, navigation |

    | Transport | Control of data flowAcknowledgment |

    | Internet | Logic addressingRouting |

    | Network access | Physical interface with the network<br>Error checking |


    The `OSI` and `TCP/IP` models are compared in [Figure 4.4](#c04.xhtml#figure4).


    ![Figure 4.4. OSI model versus TCP/IP model. For a color version of the figure,
    see www.iste.co.uk/helali/systems.zip](images/fig4_4.jpg)


    **[Figure 4.4.](#c04.xhtml#figureanchor4)** OSI model versus TCP/IP model. For
    a color version of the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)


    ### 4.2.4. Measuring network performance


    There are three main indicators by which we judge the performance of a network:
    output, latency and packet loss. These yardsticks can be useful during the problem
    diagnostic process for an IT network, or to assess this network''s performance,
    or during the design process:


    - Output: the amount of data sent and received per unit of time.

    - Latency: the time required to transport a packet via a network from a source
    to a destination. It is dependent on every part of the chain used to transport
    date: communicating stations and, more specifically, their network cards; LAN
    links with switches; WAN links with routers. It can be made up of the following:


    - *Propagation time*: the time it takes for a bit to move from the transmitter
    to the receiver (or the time required for a packet to move from point A to point
    B). It is measured by the distance ratio separating A and B over the propagation
    speed of the signal.

    - *Transmission time*: the time needed to release a message into the network (time
    required by a node [network equipment] to send the entire packet on the media).

    - *Processing time*: the time required for intermediary and terminal equipment
    to process data during transmission.


    ![Figure 4.5. Network delivery time](images/fig4_5.jpg)

