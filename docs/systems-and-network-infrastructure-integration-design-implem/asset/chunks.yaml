    `HSRP` 和 `VRRP` 协议通过特定的配置，利用多个具有不同活动（active/master）路由器的 `HSRP/VRRP` 组，实现了均衡的负载均衡。对于
    `GLBP`，这种负载均衡基于权重设置，允许实现差异化的负载均衡。为了实现这一点，它使用一个与多个虚拟 MAC 地址（最多四个）关联的虚拟 IP 地址，但它们属于同一个
    `GLBP` 组。


    这些 MAC 地址的格式为 `00:07:B4:0X:XX:YY`（其中 `Xs` 表示从 1 到 1023 的组号，`Ys` 代表虚拟路由器标识符）。该协议中的分组由两个元素组成：活动虚拟网关
    (`AVG`) 路由器和活动虚拟转发器 (`AVF`) 路由器。


    选出的 `AVG` 路由器具有该组中最高的优先级或最高的 IP 地址。它响应用户生成的 ARP 请求，以便根据负载均衡算法（轮询、加权或基于主机型）在 `AVF`
    路由器之间分配负载。它为 `AVF` 路由器分配虚拟 MAC 地址，并从它们中选择备用 `AVC` 路由器，以便在故障时替换 `AVG`。


    `AVF` 路由器仅负责转发数据包。`AVG` 路由器也转发流量。每 3 秒发送一次 Hello 消息，如果在 10 秒后未收到 Hello 消息，则会发生
    `AVG` 路由器的切换。


    **表 8.11. HSRP、VRRP 和 GLBP 的对比**


    | | `HSRP` | `VRRP` | `GLBP` |

    | --- | --- | --- | --- |

    | **所有权** | Cisco 专有 | 标准化 | Cisco 专有 |

    | **角色** | 活动/被动 | 主/备用 | `AVG/AVF` |

    | **虚拟 MAC 地址** | `00:00:0C:07:AC:XX` | `00:00:5E:00:01:XX` | `00:07:B4:0X:XX:YY`
    |

    | **Hello 时间** | 3 s | 1 s | 3 s |

    | **保持时间** | 10 s | 3 s | 10 s |

    | **负载均衡** | 手动（创建 HSRP 组） | 手动（创建 VRRP 组） | 动态且简单（负载均衡算法） |


    ### 应用：HSRP 协议配置


    网络拓扑结构如图图 8.18 所示。


    ![图 8.18. HSRP 协议的模拟配置。彩色版本请参见 www.iste.co.uk/helali/systems.zip](img/fig8_18.jpg)


