    \ summary\n\n![](images/fig7_u1.jpg)\n\n## Note\n\n1.  This chart is also available\
    \ at [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)\n\
    \n# **8**  \n\nQuality of Service and High Availability\n\n> “Quality is never\
    \ accidental; it is always the result of intelligent effort.”\n\n> \n\n> John\
    \ Ruskin\n\n– Understanding the concept of QoS and its objectives, as well as\
    \ its usefulness for current IT infrastructures.\n\n– Understanding the basic\
    \ principles of QoS in networks (needs, structure, configuration options).\n\n\
    – Learning how to use data flow classification, improved enqueuing, and advanced\
    \ load management techniques.\n\n– Differentiating between QoS protocols or standards\
    \ in the link and network layers.\n\n– Understanding high availability mechanisms,\
    \ in this case redundancy and backup.\n\n– Describing the objectives and main\
    \ protocols of level 2 and 3 redundancies.\n\n– Understanding the general functioning\
    \ of load balancing and data replication.\n\n## 8.1. Introduction\n\nThese days,\
    \ IT infrastructures offer more and more diverse services and serve as a framework\
    \ for a wide range of applications. This varied offer must be accompanied by a\
    \ service quality of assurance in order to ensure end-user satisfaction.\n\nIn\
    \ reality, and in a context of convergence, services with different characteristics\
    \ and different requirements must be provided by a single infrastructure that\
    \ must ensure their proper functioning consistent with the levels of service required,\
    \ or SLA (Service Level Agreement). Therefore, any plan to set up a network infrastructure\
    \ must include and address the service quality aspect.\n\nIn the same vein, an\
    \ effort to achieve high availability of the various components of the network\
