    - `on mode`（开启模式）在不使用协商协议的情况下激活聚合；

    - `desirable mode`（期望模式）由交换机对发起聚合请求；

    - `auto mode`（自动模式）等待协商且不发送请求，但通过协商来形成聚合。


    **表 8.9.** *PAgP 协议模式*


    | **PAgP 模式** | **ON** | **DESIRABLE** | **AUTO** |

    | --- | --- | --- | --- |

    | **ON** | ✔ | x | x |

    | --- | --- | --- | --- |

    | **DESIRABLE** | x | ✔ | ✔ |

    | **AUTO** | x | ✔ | x |


    PAgP 协议是一种 2 层冗余协议，用于在交换机 1 和交换机 3 之间建立 EtherChannel 技术。交换机 1 和交换机 3 之间的 PAgP
    配置使用以下命令创建：


    ```

    Switch1(config) #interface range fa0/1-2

    Switch1(config-if-range)# channel-group 1 mode desirable

    Switch1(config-if-range)#no shutdown

    Switch3(config)#interface range fa0/1-2

    Switch3(config-if-range)# channel-group 1 mode desirable

    Switch3(config-if)#no shutdown

    Switch1(config-if)#interface port-channel 1

    Switch1(config-if)#switchport mode trunk

    Switch1(config-if)#switchport trunk native vlan 99

    Switch3(config)#int port-channel 1

    Switch3(config-if)#switchport mode trunk

    Switch3(config-if)#switchport mode native vlan 99

    ```


    LACP 是由 IEEE 开发的一种标准协议。它的功能类似于 PAgP，但支持各种制造商。它有三种配置模式：


    - `ON mode`（开启模式）与 PAgP 类似，用于在不使用协商协议的情况下激活聚合；

    - `active mode`（活动模式）向相应的交换机发送请求以创建聚合；

    - `passive mode`（被动模式）的特点是在切换到聚合之前等待协商。这些不同模式之间的兼容性见表 8.10。


    **表 8.10.** *LACP 协议模式*


    | **LACP 模式** | **ON** | **ACTIVE** | **PASSIVE** |

    | --- | --- | --- | --- |

    | **ON** | ✔ | x | x |

    | --- | --- | --- | --- |

    | **ACTIVE** | x | ✔ | ✔ |

    | **PASSIVE** | x | ✔ | x |


    LACP 协议在交换机 1 和交换机 2 之间配置，然后在交换机 2 和交换机 3 之间配置。


    我们首先在交换机 1 和交换机 2 之间配置 LACP：


    ```

    Switch1(config)#interface range fa0/3-4

    Switch1(config-if-range)#switchport mode trunk

    Switch1(config-if-range)#switchport trunk native vlan 99

    Switch1(config-if-range)#channel-group 3 mode active

    Switch2(config)#interface range fa0/1-2

    Switch2(config-if-range)#switchport mode trunk

    Switch2(config-if-range)#switchport trunk native vlan 99

    Switch2(config-if-range)#channel-group 3 mode passive

    ```


    接下来，我们现在交换机 2 和交换机 3 之间配置 LACP：


    ```

    Switch2(config)#interface range fa0/3-4

    Switch2(config-if-range)#switchport mode trunk

    Switch2(config-if-range)#switchport trunk native vlan 99

    Switch2(config-if-range)#channel-group 3 mode active

    Switch3(config)#interface range fa0/3-4

    Switch3(config-if-range)#switchport mode trunk

    Switch3(config-if-range)#switchport trunk native vlan 99

    Switch3(config-if-range)#channel-group 3 mode passive

    ```


    以下显示 EtherChannel 正常运行的：


    ```

    Switch1#show etherchannel summary

    Flags: D - down P - in port-channel

    I - stand-alone s - suspended

    H - Hot-standby (LACP only)

    R - Layer3 S - Layer2

    U - in use f - failed to allocate aggregator

    u - unsuitable for bundling

    w - waiting to be aggregated d - default port

    Number of channel-groups in use: 2

    Number of aggregators: 2

    Group Port-channel Protocol Ports

    1 Po1(SU) PAgP Fa0/1(P) Fa0/2(P)

    2 Po2(SU) LACP Fa0/3(P) Fa0/4(P)


    Switch3#show etherchannel summary

    Flags: D - down P - in port-channel

    I - stand-alone s - suspended H - Hot-standby (LACP only)

    R - Layer3 S - Layer2

    U - in use f - failed to allocate aggregator

    u - unsuitable for bundling

    w - waiting to be aggregated d - default port

    Number of channel-groups in use: 2

    Number of aggregators: 2

    Group Port-channel Protocol Ports

    1 Po1(SU) PAgP Fa0/1(P) Fa0/2(P)

    2 Po2(SU) LACP Fa0/3(P) Fa0/4(P)

    ```


    ### 8.3.3. 网络层冗余

    为了确保高可用性，必须消除单点故障。


    #### 8.3.3.1. *HSRP（热备路由器协议）*

    这是一个思科专用协议，提高了网关的可用性。由至少两台路由器组成的组是该协议的基础，标识范围为 0 到 255。


    然而，一个虚拟 IP 地址被分配给所有路由器，但每个路由器都有自己的优先级。选举过程选择优先级最高的路由器作为活动路由器。其余路由器处于被动或备份模式，监听活动路由器以确保其正常。


    这是通过心跳机制实现的，活动路由器每秒发送一次心跳包。关联 MAC 地址为 `00:00:0C:07:AC:XX`，其中字节 XX 指定 HSRP 组号。该协议可以在路由器或层交换机上配置。


    #### 8.3.3.2. *VRRP（虚拟路由器冗余协议）*

    该协议与 HSRP 协议非常相似，实际上是它的标准版本。因此它是非专有的，并与其他制造商兼容。它通过虚拟化过程提高本地局网网关的可用性。


    VRRP 路由器组由至少两台路由器组成，主路由器和备份路由器共享一个 IP 地址作为成员的默认网关。关联 MAC 地址为 `00:00:5E:00:01:XX`，其中
    XX 指定 VRID，范围从 `0x01` 到 `0xFF`。该 VRID 表征了一组 VRRP 路由器，是该组的唯一标识。默认开启抢占。如果 3 秒后备份路由器没有收到任何内容，它们将选举新的主路由器。


    #### 8.3.3.3. *GLBP（网关负载均衡协议）*

    还有一种基于上述 HSRP 和 VRRP 协议相同基本原理的思科专用 3 层冗余协议。它还提供了负载均衡功能，配置相当简单。


