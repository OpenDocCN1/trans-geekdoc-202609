    ### 7.3.3. Architecture models


    Cloud computing is generally broken down into three main service models that differ
    according to the degree of outsourcing adopted by the company''s IT system. These
    three models illustrate three levels of virtualization and can also be considered
    delivery models.


    The objective of the cloud concept is to set up a service between a client and
    a service provider while ensuring the continuity and quality of this service.
    To achieve this goal, methods in all levels involved have been developed, including:


    - the application, used by the client;

    - the platform, or the environment that executes the application;

    - the infrastructure, which constitutes the platform support.


    #### 7.3.3.1. IaaS (Infrastructure as a Service)


    Hosting concerns a virtual infrastructure made up of servers, network resources,
    storage solutions, etc. It is the equivalent of a real infrastructure and is made
    available by the cloud provider. The client purchases its resources according
    to need. Thus, the whole infrastructure part of the client company is outsourced.
    This model is the base for the following two models, `Amazon EC2` and `Google
    Cloud Storage`, which are examples of this model.


    #### 7.3.3.2. PaaS (Platform as a Service)


    The cloud provider offers the whole development platform, hosting company applications
    as well as management and testing environments accessible through a browser with
    no need to use other software programs. The degree of outsourcing is higher than
    that of the IaaS model. This model is more relevant to applications developers,
    as it provides them with a customized development framework. It also serves as
    a base for the SaaS model. An example of a PaaS is `Google App Engine`.


    #### 7.3.3.3. SaaS (Software as a Service)


    Business applications are transferred to the cloud provider, meaning that all
    necessary software programs are functional without any prior installation or updating,
    and require no maintenance on the part of the client. This model supplies the
    highest degree of outsourcing and is based mainly on the principle of standardization
    of hosted applications. SaaS platforms are based on `SOA` (Service Oriented Architecture);
    examples include `Gmail` and `Office 365`.


