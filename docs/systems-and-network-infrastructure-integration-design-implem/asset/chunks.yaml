    # 前言


    本书是一部主要面向网络和系统领域学生的实战型学习工具，它旨在通过学习基础概念并掌握实施此类项目所需的技能，引导读者理解网络和系统集成项目的各个方面。本书的目标是帮助学生获得技术技能，这些技能源于需求分析、基础设施特性规范、最终网络设备和组件定义，以及将其整合到构建完整的高性能基础设施中，以满足客户的需求。此外，在成本和截止日期等各种考量方面，监督此类项目所需的方法论和组织技能也是必不可少的，本书将提供这些内容。本书还讨论了
    `Green IT`（绿色 IT）的概念，以便在学生开始开始职业生涯之前提高他们对环境问题的意识，使他们在部署 IT 基础设施时考虑到这些问题。


    本书的终极目标是让学生学习如何为中大型企业设计和开发网络基础设施，具体而言，学习如何分析需求并将其转化为符合用途的网络拓扑设计。我们如何从互连设备的角度来定义需求？我们如何实施优化的寻址方案？我们如何确定最适合创建高质量、高性能、高安全且易访问，同时又环保且先进的技术、工具和制造商？


    本书由九章组成，分为两个互补的部分，专为 IT 网络技术人员身定制；具体如下：


    - 方法论和组织部分：将使学生从第一章开始理解规范的概念，学习如何解读规范，并获取管理 IT 项目所需的知识，即相应的方法、程序和工具。事实上，规划 IT
    解决方案实施的每个阶段至关重要，熟悉其主要参与者，并知道如何就请求的交付物、里程碑日期等制定高效的沟通计划。该部分将在`第 2 章`中提供仿真基本概念的概述，并更具体介绍
    `GNS3` 工具，用于在 IT 基础设施现场部署之前对其进行原型设计和测试。使用此类软件可以保护 IT 基础设施项目团队免受破坏生产网络运行。此外，`GNS3`
    在教学方面备受推崇，特别是在缺乏网络硬件的情况下。该部分还将介绍 IT 基础设施对环境的影响，或 `Green IT`，旨在向学生介绍并增强他们在所有网络基础设施实施项目中对这种低能耗方法的意识。


    - 技术部分：将根据设置和实施的实际过程，以有组织的顺序介绍网络基础设施的纯技术方面。开启本节的`第 4 章`对 IT 基础设施通常提供的主要网络服务进行了简要介绍。


