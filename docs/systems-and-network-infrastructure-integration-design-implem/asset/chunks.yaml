    # 3. Green IT


    > “It''s the duty of mankind to be nature''s guardian, not its owner.”


    > Philippe Saint-Marc


    – Understanding the concept of Green IT and its challenges.

    – Understanding the mechanisms and technical solutions for the implementation
    of a Green IT infrastructure.

    – Describing and analyzing current mechanisms to reduce the energy consumption
    of IT products, particularly in data centers.


    ## 3.1. Introduction


    When speaking of Green IT, it is vital to discuss the overall concept, that is,
    sustainable development.


    This concept, introduced in the 1950s, took shape on June 16, 1972, in Stockholm,
    as part of the adoption of the Declaration of the United Nations Conference on
    the Human Environment, and then in 1987 as part of the Brundtland report published
    by the UN:


    > A development that meets the needs of the present without compromising the ability
    of future generations to meet their own needs. It contains within it two key concepts:
    the concept of “needs”, in particular the essential needs of the world''s poor,
    to which overriding priority should be given; and the idea of limitations imposed
    by the state of technology and social organization on the environment''s ability
    to meet present and future needs.


    > (Brundtland report)


    Sustainable development relies on three cornerstones: economy, social issues and
    ecology.


    In 2012, the `Agence Française de Normalisation` (AFNOR), or French Standardization
    Organization, defined a state as “sustainable” “if the components of the ecosystem
    and their functions are preserved for present and future generations. The components
    of the ecosystem include, besides human beings and their physical environment,
    plants and animals. For human beings, the concept implies a state of equilibrium
    in the satisfaction of basic needs: the economic, environmental, social, and cultural
    conditions of existence within a society”.


    Sustainable development is therefore becoming a key part of businesses'' strategy.
    Their enthusiasm for Green IT is dictated, on the one hand, by a public that is
    paying much closer attention to businesses'' commitment to environmental and social
    issues (brand image), and, on the other hand, by shareholders demanding accountability
    on the part of the company with regard to matters of social responsibility.


    ICTs (information and communications technologies) represent both a risk and an
    opportunity for sustainable development. They are problematic because they undeniably
    have negative environmental impacts, but paradoxically offer opportunities to
    reduce the ecological impacts of other human activities.


    ## 3.2. Introduction of concept


    Green IT, or Eco-ICT, or `informatique verte` in French, is a concept defined
    as all information and communications technologies designed so that their economic,
    ecological and social footprints are optimized. Their objective is to help humanity
    to achieve its sustainable development goals.


    “Information and communications ecotechnologies” are information and communications
    technologies whose design or use help to reduce the negative effects of human
    activity on the environment. They are aimed at reducing energy consumption and
    greenhouse gas emissions (French official journal, July 12, 2009).


    The Rio+20 conference held in 2012 recognized “the essential role played by ICT
    and broadband networks as enablers of sustainable development”.


    ## 3.3. Green IT trigger factors


    Information technology generates a significant quantity of toxic electrical and
    electronic equipment waste (EEEW), or e-waste, such as computers, printers, digital
    cameras and mobile telephones. This waste is harmful to both the health of human
    beings and the environment.


    In 2014, the United States and China produced one-third of the world''s electronic
    waste, which according to the UN totaled 41.8 million tons, compared to 39.8 million
    tons in 2013. In 2016, the quantity of e-waste reached 44.7 million tons, with
    50 million tons projected by the UN in 2018.


    ICTs produce as much CO2 as civil aviation (Gartner, 2007).


    ICTs, whether hardware or software, consume large amounts of energy, water and
    metal, thus constituting a drain on natural resources, and they generate a significant
    quantity of dangerous waste that pollutes the air, ground, etc., causing ecosystemic
    changes.


    ## 3.4. Benefits of Green IT


    Eco-ICT, or Green IT, contributes to the reduction of environmental impacts of
    the corresponding equipment, including their own impacts, throughout their lifecycle
    (design, manufacture, use, recycling). Moreover, they also help to reduce indirect
    impacts from other human activities.


    There are two types of Eco-ICT: Green for IT (Green IT 1.0) and IT for Green (Green
    IT 2.0). Both of these categories seem to have the same objectives: optimizing
    energy efficiency and reducing the carbon footprint of businesses and services,
    as well as researching ways to boost economic and social performance.


    – Green IT 1.0 (Green for IT) targets the ICT industry''s eco-responsibility to
    reduce the ecological footprint of infrastructures, IT hardware and software.
    This translates concretely into the eco-design of products, the setting up of
    green data centers and the management of e-waste.


    – Green IT 2.0 (IT for Green) targets IT usages for other sectors. This includes
    the use of ICTs in other sectors in order to achieve the same goal of reducing
    the carbon footprint, as well as its associated costs. Examples of this IT usage
    vary greatly, ranging from telework, the intelligent organization of transport,
    and the construction of intelligent buildings and transportation.


    The benefits of sustainable development can be summarized as:


    – reduction of electrical energy consumption and greenhouse gases that are harmful
    to the environment;


    – eco-design enabling the environmental dimension to be taken into account in
    every stage of the lifecycle of ICT technologies. Environmental assessment is
    based on lifecycle analysis (LCA) and includes a method that is internationally
    recognized as a powerful tool capable of calculating the impact generated by products
    throughout their lifecycle.


    ## 3.5. The lifecycle of ICTs


    Each phase of the lifecycle requires energy and raw materials. Therefore, it is
    essential to refer to this lifecycle in order to analyze the environmental impacts
    of ICTs:


    ![Figure 3.1 Lifecycle of ICT equipment. For a color version of the figure, see
    www.iste.co.uk/helali/systems.zip](images/fig3_1.jpg)


    **Figure 3.1** *Lifecycle of ICT equipment. For a color version of the figure,
    see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*

