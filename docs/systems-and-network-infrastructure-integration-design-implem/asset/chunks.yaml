- raw: 'Aware of the importance of monitoring for companies needing high availability
    of their IT system and thus their IT infrastructure, major software publishers
    have involved themselves in the field of monitoring software. These solutions
    represent veritable monitoring frameworks; however, they are costly and often
    closed. We will now introduce two of the leading paid monitoring software programs:
    HP OpenView and IBM Tivoli.


    #### 9.4.1.1. *IBM Tivoli Monitoring*


    This program is used to monitor IT systems (system, network, applications, hardware,
    etc.) and to send alerts to a monitoring console (specifically to the Tivoli Enterprise
    Console).


    It is among the leading products in the field as it enables proactive monitoring
    of vital infrastructure components by rapidly detecting problems in performance
    and viewing performance histories and real-time performance, as well as the consolidation
    of monitoring and management of distributed systems and host systems by means
    of a single simple, customizable work console.


    #### 9.4.1.2. *HP-OpenView*


    This software is used to manage and monitor network infrastructures and services.
    Its main benefit lies in the centralization of management information on a single
    station. It is meant for medium-sized and large businesses and is based on an
    agent deployed on hosts to collect information on operating states and services.
    The agent retrieves and stores monitoring information in a database called Coda,
    and then sends this information to the server hosting the monitoring tool and
    stores it in a SQL server database.


    ### 9.4.2. *Free monitoring solutions*


    Alongside the paid monitoring solutions that many companies are unable to acquire,
    there are free monitoring tools. The functionalities they offer are undeniably
    less wide-ranging, but they satisfy the needs of most small and medium-sized businesses.


    #### 9.4.2.1. *Nagios*


    Nagios is considered to be the benchmark for open-source monitoring solutions.
    This software is used to monitor systems and networks, and its reputation in the
    open-source world and its star status as a monitoring program are due to its modularity.


    It is based on three main components: a sequencer, which is the core of the application
    and executes monitoring probes on the components of the IT system being monitored,
    the web interface used to view information concerning monitored components and
    plugins or probes that represent simple autonomous programs or scripts initiated
    by the sequencer and simply providing the result obtained to this sequencer. These
    plugins are not installed automatically; they must be downloaded and installed.


    **Table 9.2.** *Plugin return codes*


    | Plugin return code || Service state || Host state |


    | --- | --- | --- |


    | 0 || OK || UP |


    | --- | --- | --- |


    | 1 || WARNING || UP orDOWN/UNREACHABLE |


    | 2 || CRITICAL || DOWN/UNREACHABLE |


    | 3 || UNKNOWN || DOWN/UNREACHABLE |


    Since October 2009, Nagios has been available in two versions:


    – NagiosCore, which is free and is no longer being upgraded or improved. Community
    support is the only thing keeping this version in existence;


    \- Nagios XI, which is paid and offers all the latest upgrades (monitoring engine,
    redesign of graphic interface, etc.).


    Numerous products have been introduced that are based on Nagios sources and compatible
    with its internal architecture model (the term “NagiosCore-compatible” is used).
    These include Centreon, Incinga, Shinken and others.


    #### 9.4.2.2. *Centreon*


    Centreon is based on Nagios concepts. It offers a web application layer that greatly
    simplifies configuration and administration by allowing users to modify the Nagios
    configuration comprehensively from their web browser rather than manually modifying
    numerous files. The interface offered is also sleeker, scalable and multi-user.


    Centreon uses its own MySQL databases to retrieve all Nagios service-state and
    performance data to process and display them in its own graphic interface. The
    graphics generated are constructed using RDDTools, which are databases particularly
    well suited to graphic construction.


    Centreon has become a complete monitoring platform that has separated from Nagios
    and now relies on three components:


    – Centreon Web, the viewing interface, which provides a methodical and precise
    monitoring display;


    – CentreonEngine, a high-performance data collection engine based on Nagios 3
    and covering a wide range of existing operating systems, servers and infrastructures;


    – Centreon Broker, the event manager replacing NDOUtils, a Nagios addon used to
    store monitoring data in a MySQL database or a flat file.


    #### 9.4.2.3. *Shinken*


    Shinken is a modified version of Nagios. It consists more precisely of a complete
    redesign of the Nagios core in Python based on the decoupling of the various roles
    of Nagios.


    Its distributed architecture, unlike the monolithic architecture of Nagios (a
    single daemon), is composed of daemons, which work together to provide all of
    the functionalities offered by Nagios, specifically arbitration, reaction, scheduling,
    polling and receiving. This more flexible approach resolves the performance problems
    encountered by Nagios in monitoring large infrastructures (environments consisting
    of several thousand hosts and services) and also facilitates the setup of distributed,
    highly available monitoring architectures.


    Shinken is also characterized by its abandonment of the language C in favor of
    the language Python \[104\], which is multi-platform (Windows, Linux, etc.) and
    independent of the operating system.


    #### 9.4.2.4. *Zabbix*


    Zabbix is a free IT infrastructure and system monitoring application. It can be
    used to monitor network equipment, servers, systems, applications and software,
    providing both technical and application monitoring.


    Its architecture is made up of three components. The first is a server representing
    the Zabbix application core, which centralizes data and all configuration information
    and alerts administrators in the event of a problem. The second component is a
    Web interface for viewing of the information stored in the database as well as
    configuring the objects being monitored. The third component consists of Zabbix
    agents, which should optionally be installed on each piece of equipment and which
    operate in the background and communicate regularly with the Zabbix server.


    #### 9.4.2.5. *FAN (FullyAutomatedNagios)*


    This is a Linux distribution that enables the quick and easy installation of all
    tools in the Nagios community. It also encompasses Nagios and its plugins, Centreon
    and Nagvis.


    FAN also makes it possible to set up a complete monitoring server very quickly
    without having to worry about its configuration. All that is needed for this is
    to download and install the ISO image.


    This monitoring solution is appealing to beginners, but it has some disadvantages;
    the version of Nagios is in fact patched, which makes it impossible to update
    Nagios without a new version of FAN.


    #### 9.4.2.6. *EyesOfNetwork (E.O.N.)*


    EyesOfNetwork is an open-source solution that includes an operating system as
    well as a group of monitoring applications. It is based on Nagios and provides
    a complete monitoring solution on a GNU/Linux CentOS distribution. This open-source
    system and network monitoring solution draws on ITIL processes and enables their
    application technologically.


    Some applications used for monitoring are listed in the table below.


    **Table 9.3.** *Examples of free monitoring applications*


    | Application || Role |


    | --- | --- |


    | Nagios || Used to monitor IT systems and to manage incidents and problems |


    | --- | --- |


    | Thruk || Multi-backend monitoring interface |


    | GED (Generic Event Dispatcher) || Enables secure multi-site event management
    |


    | Nagiosbp || Used to manage application criticality |


    | Nagvis || Used to create customized availability maps |


    | Cacti and Pnp4Nagios || Used to manage host performance |'
