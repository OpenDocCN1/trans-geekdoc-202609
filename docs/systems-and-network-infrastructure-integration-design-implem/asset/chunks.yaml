- raw: "### 1.3.1. *Gantt diagram*\n\nThis is an effective and practical tool for\
    \ project management created by Henry Gantt in 1917, which remains the most widely\
    \ used representation tool. It consists of a graphic diagram useful for project\
    \ planning and gives information and time frames for a project's phases, activities,\
    \ tasks and resources.\n\nTasks are put in rows and durations (days, weeks or\
    \ months) in columns. They are represented by bars whose length is proportional\
    \ to the estimated duration. These can take place sequentially or partially or\
    \ entirely simultaneously.\n\n### 1.3.2. *RACI (Responsible, Accountable, Consulted,\
    \ Informed) matrix*\n\nThe success of a project relies on the clear and precise\
    \ definition of the roles and responsibilities of each actor involved. To do this,\
    \ a RACI matrix is used. In this matrix, activities are laid out in rows and roles\
    \ in columns. In each cell of the table, the role's responsibility for the activity\
    \ is indicated, using the letters R, A, C or I.\n\n**Table 1.2.** *Example of\
    \ a RACI matrix*\n\n|  || **Role 1** || **Role 2** || ... || **Role m** |\n\n\
    | --- | --- | --- | --- | --- |\n\n| **Activity 1** || R || A || I || C |\n\n\
    | --- | --- | --- | --- | --- |\n\n| **Activity 2** || I || R || I || A |\n\n\
    | ... || A || R || C || I |\n\n| **Activity n** || C || R || C || I |\n\nIt can\
    \ be used to set out responsibilities in a project or within a company or business.\n\
    \n### 1.3.3. *The concept of specifications*\n\nThis is a contractual document\
    \ describing what is expected from the project manager by the contracting authority.\
    \ It is generally developed by the client and contains the following main sections:\
    \ context, objectives, vocabulary or terminology, scope, schedule, etc.\n\nThe\
    \ contracting authority is the party responsible for the expression of needs;\
    \ they are the entity that places the order. The project manager is responsible\
    \ for making these needs a reality.\n\nThe specifications must set out needs in\
    \ a functional manner, independent of any technical solution with the exception\
    \ of specifying the technical environment into which the solution requested must\
    \ be inserted.\n\nAccording to norm NF X 50-150 developed by the AFNOR, a functional\
    \ specification document (FSD) is the document by means of which the requesting\
    \ party expresses its needs in terms of service features and limitations. For\
    \ each function and limitation, assessment criteria and their levels are defined.\n\
    \nNOTE.– The FSD is concerned with the service features of a product and their\
    \ corresponding limitations, and does not contain any technical ideas or impose\
    \ any solutions. Its objective is to propose the product best suited to provide\
    \ the service(s) requested under the conditions specified and at minimal cost.\n\
    \nKnowing how to read and correctly interpret a set of specifications is very\
    \ important for the success of the associated project. The project team must analyze\
    \ needs, including understanding the expectations of the final users (the WHAT),\
    \ and know how to put them into practice (the HOW). The team must gain a perfect\
    \ understanding of the associated issue by asking itself the following questions:\n\
    \n– Who is requesting this solution?\n\n– Who will use the proposed solution?\
    \ With what benefits?\n\n– What will be the solution's environment?\n\n– What\
    \ are the limitations and problems that may be encountered?\n\nThe ultimate goal\
    \ always remains the satisfaction of the end-users' and clients' needs. These\
    \ needs can be explicit or clearly stated, implicit or unstated but necessary.\
    \ In this context, we can speak about functional specifications, pertaining to\
    \ the functionalities expected of the project, and non-functional specifications,\
    \ which represent the secondary characteristics to be offered.\n\nInterpreting\
    \ a set of specifications consists of:\n\n– describing the project, including\
    \ the context of work, motivations and objectives that will be evaluated at the\
    \ end of the project, the challenges or difficulties to be overcome, and the criteria\
    \ for success, or how to evaluate the project in relation to objectives;\n\n–\
    \ subsequently defining the phases of implementation of the project and the links\
    \ between these phases using a Gantt diagram, for example. In addition, milestone\
    \ targets and deliverables corresponding to each phase must be set, and a clear\
    \ idea of the procedures has to be followed for the management and follow-up of\
    \ the project.\n\n## 1.4. Chapter summary\n\n![](images/fig1_u1.jpg)\n\n## Note\n\
    \n1.  This chart is also available at [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)\n\
    \n# 2  \n\nSimulating Network Architectures with GNS3\n\n> “Problems in school\
    \ are like problems in life, but without their consequences.”\n\n> \n\n> Olivier\
    \ Reboul\n\n– Understanding the concept of simulation and its main theoretical\
    \ aspects, as well as its capabilities and limitations.\n\n– Understanding the\
    \ main network simulation tools.\n\n– Understanding how to use the GNS3 supervision\
    \ tool and its features to model a network infrastructure based on specific needs.\n\
    \n## 2.1. Introduction\n\nAs with the development of applications, system and\
    \ network infrastructures, even simple ones, must be tested before they are put\
    \ into production. This good practice is vital to avoid numerous errors during\
