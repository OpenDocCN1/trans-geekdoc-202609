    a single server. If a DNS server does not find a corresponding name, it requests
    information from another server, and then another, and so on until it reaches
    the server that knows the correspondence. There are servers responsible for a
    zone or with authority over this zone, for example .org, and there are resolver
    servers, which request the resolution of names and save the results in their cache
    for a certain amount of time.


    Domain names are organized in tree form and read from right to left.


    ![Figure 5.7. Tree organization of domain names. For a color version of the figure,
    see www.iste.co.uk/helali/systems.zip](images/fig5_7.jpg)


    **Figure 5.7.** *Tree organization of domain names. For a color version of the
    figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    The commands used for DNS resolution are:


    \- #dig [www.cisco.com](http://www.cisco.com) for Linux systems;


    \- >nslookup [www.cisco.com](http://www.cisco.com) for Windows.


    The functioning of the DNS service can be summed up as follows:


    – inventory and designation of domain resources via the registration of these
    resources;


    – hierarchized organization via a naming system;


    – distribution of information by zone via the recursive query mechanism;


    – resolution of names in an IP address by the resolver server.


    ![Figure 5.8. DNS operating principle. For a color version of the figure, see
    www.iste.co.uk/helali/systems.zip](images/fig5_8.jpg)


    **Figure 5.8.** *DNS operating principle. For a color version of the figure, see
    [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    Servers with authority are solely responsible for their zone and for the functioning
    of the DNS service. For this reason, secondary DNS servers that take over in the
    event of the main server breakdown should be installed. These secondary servers
    enable better tolerance of breakdowns.


    To set up a DNS server, the BIND server can be used, or the DNS role is installed
    on a Windows server. It is also possible to configure a DNS server on Cisco routers,
    but this method is discouraged for large networks, since the DNS service requires
    a large amount of resources.


    ## 5.4. LDAP service


    ### 5.4.1. *Introduction*


    A directory or reference that centralizes information pertaining to users and
    hardware and software resources facilitates and can improve the security of access
    to data, thus improving business performance. Use of a directory ensures consistency
    in the data necessary for the functioning of various applications used within
    the enterprise. This service is undoubtedly beneficial to any IT infrastructure
    as it enables better exploitation of the corresponding IT system, for which it
    is now the nerve center. This directory offers a solution mainly for the issues
    of data management, authentication and access control, which are not insignificant
    given their changeable and scattered nature. For reasons of interoperability,
    a directory should be chosen that complies with the LDAP (Lightweight Directory
    Access Protocol) standard in order to be able to interface with existing IT applications.
    The structure of the directory should reflect the internal organization of the
    enterprise. A directory is a system architecture component and thus ensures optimal
    management of users and resources.


    An LDAP server is a directory service that can be queried via the LDAP protocol
    and whose internal structure corresponds to LDAP specifications.


    The known implementations of LDAP servers are Open LDAP and Microsoft Active Directory.


    The main advantages of a directory service are:


    – most of the time, directories are mainly accessible for reading rather than
    writing;


    – a directory organizes its data into a hierarchical tree form;


    – sub-trees of the directory tree can be distributed over multiple hosts;


    – directory tree zones can be easily administered by delegation;


    – directory trees make it possible to limit a search to specified sub-trees from
    the start;


    – numerous directory services are based on the X500 model and thus take charge
    of an object-oriented data model from the start.


    ### 5.4.2. *LDAP protocol*


    This is a client–server protocol which defines the method the client must use
    to access data on the server. This protocol, which constitutes a light version
    of the X500 protocol or, more precisely, the DAP (Directory Access Protocol) protocol,
    has now been standardized by the IETF (Internet Engineering Task Force) and functions
    in connected mode over TCP on port 389 for LDAP and on port 636 for LDAPS (LDAP
    over SSL).


    ![Figure 5.9. LDAP mode of operation](images/fig5_9.jpg)


    **Figure 5.9.** *LDAP mode of operation*


    An LDAP session generally includes three stages:


    – in the first stage, the LDAP client connects to the LDAP server. Other than
    initialization, information is also exchanged about the (extended) LDAP functionalities
    taken on by the client and, if necessary, authentication and negotiation concerning
    encryption options also take place;


    – once the link has been successfully established, the client and server exchange
    messages with one another;


    – in the final stage, the client ends the session.


    The LDAP protocol provides the following functions:


    – opening and closing of connection;


    – search for information;


    – addition, modification and deletion of information.


    These functions are implemented using the procedures shown in [Table 5.1](#c05.xhtml#table1).


    **[Table 5.1](#c05.xhtml#tableanchor1).** *List of main LDAP operations*


    | Message || Function |


    | --- | --- |


    | bind || Start a session in which the client specifies the version of the protocol
    and identification information for authentication |


    | --- | --- |


    | unbind || Ends a session |


    | search || Searches in the directory |


    | modify || Modifies (adds, deletes, replaces) attributes of an entry |


    | add || Adds a new entry. The client specifies the name and a list of attributes
    |


    | delete || Deletes an entry |


    | modify RDN || Modifies the RDN of an entry or of whole sub-trees |


    | compare || Tests whether an entry corresponds to a given attribute–value pair
    |


    | abandon || Tells the server that the client no longer needs the result of a
    specific search |


    In addition, it enables authentication and encryption mechanisms to make information
    stored in the directory more secure via TLS or SSL protocols.


    ### 5.4.3. *LDAP directory*


    A directory makes it possible to store data organized into categories and presented
    in the form of a tree, similar to a telephone directory or Yellow Pages, which
    contains the names of individuals, their telephone numbers and their addresses,
    in alphabetical order. Likewise, there are directories containing users or groups
    of users pertaining to different divisions of a company, directories of electronic
    certificates, directories of computer equipment, etc.


    A directory is different from a relational database. It is designed to receive
    more requests in reading than in writing. It also has a tree structure and not
    a relational one like databases do. Additionally, a directory ensures interoperability
    and is also easier to replicate. Directory modifications, which are infrequent,
    are logged and transcribed to secondary directories.


    An LDAP server stores data in tree form, called a DIT (Directory Information Tree).
    The structure of the DIT is determined via a standardized, expandable LDAP schema.


    The root of this tree is the name of the domain that hosts the LDAP server. Entries
    become the branches or leaves of the tree. Each DIT entry is an LDAP object belonging
    to one or more categories of objects, which in their turn specify which attributes
    of the object are required and which are optional.


    ![Figure 5.10. Example of a data tree (DIT)](images/fig5_10.jpg)


    **Figure 5.10.** *Example of a data tree (DIT)*'
