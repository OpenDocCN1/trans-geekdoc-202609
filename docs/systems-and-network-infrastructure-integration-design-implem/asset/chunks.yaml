- raw: 'The HSRP and VRRP protocols enable equitable load distribution via a specific
    configuration based on the use of several HSRP/VRRP groups with different active/master
    routers. For GLBP, this load distribution is based on weighting allowing for differentiated
    load balancing. To do this, it uses a virtual IP address associated with several
    virtual MAC addresses (four maximum) but belonging to the same GLBP group.


    These MAC addresses have the form 00:07:B4:0X:XX:YY (in which the Xs designate
    the group number ranging from 1 to 1023 and the Ys represent the virtual router
    identifier). Grouping in this protocol is composed of two elements: the Active
    Virtual Gateway (AVG) router and the Active Virtual Forwarder (AVF) routers.


    The elected AVG router has the highest priority or the highest IP address of the
    group. It replies to ARP requests generated by users, so as to distribute the
    load between the AVF routers based on load distribution algorithms (round robin,
    weighted or host dependent). It assigns virtual MAC addresses to the AVF routers
    and chooses from among them the standby AVC router, which replaces the AVG in
    the event of breakdown.


    The AVF router simply forwards packets. The AVG router also forwards traffic.
    Hello messages are sent every 3 seconds, and the change of AVG router will take
    place if no hello message has been received after 10 seconds.


    **Table 8.11.** *Comparison between HSRP, VRRP and GLBP*


    |  || **HSRP** || **VRRP** || **GLBP** |


    | --- | --- | --- | --- |


    | **Ownership** || Cisco proprietary || Standardized || Cisco proprietary |


    | --- | --- | --- | --- |


    | **\>Roles** || Active/passive || Master/backup || AVG/AVF |


    | **Virtual MAC address** || **00:00:0C:07:AC:XX** || **00:00:5E:00:01:XX** ||
    **00:07:B4:0X:XX:YY** |


    | **Hello time** || 3 s || 1 s || 3 s |


    | **Holding time** || 10 s || 3 s || 10 s |


    | **Load distribution** || Manual (creation of HSRP groups) || Manual (creation
    of VRRP groups) || Dynamic and simple (load distribution algorithms) |


