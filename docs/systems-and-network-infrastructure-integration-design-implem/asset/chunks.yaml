    MPLS（多协议标签交换）结合了交换与路由的优势。它运行在 OSI 模型的第 2 层和第 3 层之间，并基于标签交换。VPN 创建是其众多功能之一。从实践上讲，为了创建客户端
    VPN，必须对每个客户端流进行隔离。为了实现这一点，现在的 MPLS 标签不再由单个标签组成，而是由两个组成：第一个（外部）标签标识通往目的 LSR（标签交换路由器）的路径，并随着每一跳发生改变；而第二个（内部）标签则指定分配给
    VPN 的 `VPN-ID`，且在源 LSR 和目的 LSR 之间不会被修改。


    MPLS VPN 的组件如下：


    - `CE` 路由器（客户边缘路由器）代表通过接入服务（`LS`、`Frame Relay`、`ATM` 等）连接到 IP 骨干网络的客户端路由器；

    - `PE` 路由器（提供者边缘路由器）是连接 `CE` 的骨干路由器。它允许 `CE` 属于一个给定的 VPN。`PE` 的作用包括通过与其他 `PE`
    协作以及与 `P` 路由器交换帧来管理 VPN；

    - `P` 路由器（提供者路由器）负责 MPLS 帧交换。


    运营商通过 `PE` 在骨干网中管理 VPN。每个 `PE` 为其每个用户接口分配一个 `VRF`（虚拟路由和转发表）。`VRF` 是分配给某个 VPN 的路由表，它提供了通往该
    VPN 对应 IP 网络的路径。


    ### 6.4.5. 其他安全手段


    #### 6.4.5.1 VLAN

    这些技术使得网络结构化为由活动隔离的区域，从而提高了整个网络基础设施的安全性。`VLANs` 是逻辑分段技术的一个示例，用于划分广播域，并确保每个 `VLAN`
    只有在经过路由配置并安装了对应公司安全策略的 `ACLs` 后才能与另一个 `VLAN` 通信。


    #### 6.4.5.2 身份验证手段

    可以通过登录和密码、或者芯片卡或生物识别来实现。在第一种，必须实施严格的密码选择和管理策略。身份验证也可以通过电子证书进行。在这种情况下，`IEEE802.1X`
    协议可以与 `Radius` 服务器联合部署。


    #### 6.4.5.3 逻辑访问控制

    这规定了经过身份验证的用户被授权对 IT 系统的各种资源采取的行动。这自然取决于物理访问控制。目前有多种逻辑访问控制模型可用，包括 `MAC`（强制访问控制）、`DAC`（自主性访问控制）和
    `RBAC`（基于角色的访问控制）。


    #### 6.4.5.4 设备和场域的物理安全

    这包括提供屏障、报警系统、监控摄像头、锁具和其他物理机制，以管理对业务场所、服务器、计算机和网络设备的物理访问。


    #### 6.4.5.5 NAT（网络地址转换）

    这种机制允许在穿越 `NAT` 路由器时，将本地网络机器的私有 IP 地址替换为公共地址。该技术的主要目标是补偿 `IPv4` 地址短缺。此外，它能够隐藏内部局域网
    IP 地址，提高安全性。


    #### 6.4.5.6 NAC（网络访问控制）

    `NAC` 是一种保护性概念，提供：

    - 对访问尝试以及设备和用户的身份清晰识别；

    - 验证所采用的安全策略已到位；

    - 对违反既定策略的行为进行隔离，并尽可能自动纠正；

    - 策略的创建与管理，以及对收集的事件和数据的评估。


    #### 6.4.5.7 日志与审计

    日志允许保留各种活动的轨迹；更具体地说，记录每个入站和出站连接谁在何时做了什么以及持续了多久。日志使得安全更具动态性，因为会定期进行审查，以监控系统、网络和风险的发展。


    #### 6.4.5.8 备份

    备份保留信息系统数据和文档的完整、可用副本，以便在发生事件时恢复活动。数据存储技术如存储区域网络（`SANs`）或网络附属存储（`NAS`）更适用于现代信息系统。备份和恢复程序及设备应根据需要选择、严格执行并定期验证。


    #### 6.4.5.9 培训与意识

    信息系统安全涉及人类和社会因素，这些因素与技术因素同样重要。即使是最好的保护方法，如果落入缺乏经验、未经培训或信息不足的用户手中，也会失败。因此，技术基础设施和网络的管理者必须致力于向用户提供信息、培训并提高他们对安全问题的意识。他们还必须了解新的攻击和威胁，订阅来自
    `CERT` 等其他发布安全信息的组织的警报公告以及专业期刊，定期咨询专业论坛，参加相关主题的会议，最重要的是，应用学到的教训。


    **表 6.1. 安全手段与服务**


    | 安全服务 | 安全手段 |

    | --- | --- |

    | 机密性 | 加密技术 |

    | 完整性 | 哈希函数 |

    | 可用性 | 冗余、备份 |

    | 真实性 | 证书、生物识别 |

    | 不否认性 | 签名、电子公证 |


    ## 6.5. 安全管理系统：规范与安全策略


    ### 6.5.1. 规范

    安全是多学科的。它有多个方面，在本文语境下包括伦理、法律、技术、方法论和规范。


    信息系统的安全化是一项艰巨的任务，需要一个管理系统来指导。


    管理系统由 `ISO` 定义为“一种能够建立策略并实现这些目标的系统”。它可以被视为一组针对特定目标的措施和技术。这些系统基于参考源，使策略和程序形式化以便于审计。


    通过 `PE` 在骨干网中管理 VPN。实施信息安全管理系统（`ISMS`）需要物质、人力财务资源，由于安全管理系统增加了可靠性，这种投资是合理的。此外，被标准化组织审计甚至认证会增加合作伙伴对业务的信任和信心。


    `2700X` 系列 `ISO` 规范设定了信息安全管理系统（ISMS）的标准。这里具体指的是 `ISO27001` 规范，它规定了建立 `ISMS` 的要求；`ISO27002`
    规范，它提供了信息安全管理的最佳实践目录。


    `ISO27001` 规范依赖于基于过程的方法，具体来说基于戴德环过程或 `PDCA` 模型（即“计划-执行-检查-处理”）：


    - 计划（Plan）阶段包括定义要受保护的边界、评估风险并选择安全措施；

    - 执行（Do）阶段包括计划如何处理风险、设计关键指标、培训人员以及管理事件；

    - 检查（Check）阶段使用控制、审计和审查来定期评估信息系统安全的当前状态；

    - 处理（Act）阶段涉及在未达到预定目标时实施纠正、预防和改进相关的行动。


    ### 6.5.2. 安全策略的想法


