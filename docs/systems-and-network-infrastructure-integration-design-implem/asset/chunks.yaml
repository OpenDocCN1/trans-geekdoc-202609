    # 8. Quality of Service and High Availability


    > “Quality is never accidental; it is always the result of intelligent effort.”

    > John Ruskin


    - Understanding the concept of QoS and its objectives, as well as its usefulness
    for current IT infrastructures.

    - Understanding the basic principles of QoS in networks (needs, structure, configuration
    options).

    - Learning how to use data flow classification, improved enqueuing, and advanced
    load management techniques.

    - Differentiating between QoS protocols or standards in the link and network layers.

    - Understanding high availability mechanisms, in this case, redundancy and backup.

    - Describing the objectives and main protocols of level 2 and 3 redundancies.

    - Understanding the general functioning of load balancing and data replication.


    ## 8.1. Introduction


    These days, IT infrastructures offer more and more diverse services and serve
    as a framework for a wide range of applications. This varied offer must be accompanied
    by a service quality of assurance in order to ensure end-user satisfaction.


    In reality, and in a context of convergence, services with different characteristics
    and different requirements must be provided by a single infrastructure that must
    ensure their proper functioning consistent with the levels of service required,
    or `SLA` (Service Level Agreement). Therefore, any plan to set up a network infrastructure
    must include and address the service quality aspect.


    In the same vein, an effort to achieve high availability of the various components
    of the network infrastructure, mainly through redundancy, is certainly in order.
    This high availability helps to avoid crashes and to balance loads in order to
    optimize the functioning of the network infrastructure.


    ## 8.2. Quality of service


    ### 8.2.1. Motivation


    Quality of Service (`QoS) played a secondary role in the original design of the
    `TCP/IP` protocols, designed to transport data from asynchronous applications,
    that is, services such as file transfers, e-mail and terminal access.


    However, some applications, such as `VoIP` and `Video IP`, require an adequate
    network `QoS`: controlled latencies, low jitter and low packet loss, as well as
    guaranteed bandwidth. This is the only way quality is guaranteed for the end-user.
    `QoS` relies on defined control mechanisms that are linked to traffic management
    in order to influence transport network metrics in relation to flows of information
    transmitted.


    `QoS` is not a supplementary functionality like an extension for a network infrastructure,
    then, but the result of a large number of coordinated measures that must be anchored
    in the basic design of a network infrastructure. It is important to note here
    the interaction of the various layers of the `OSI` model and their requirements;
    indeed, it is useful to determine whether it is possible to have mechanisms in
    a layer that enable tolerance against malfunctions in the underlying layers.


    The methods required will be discussed in this chapter. The functional elements
    of a network that are necessary for good `QoS`, and how they can be implemented
    with current technologies, will also be presented.


    Prioritization or configuration of data traffic related to `QoS`, reservation
    of data output, limitation of data output and packet optimization are carried
    out by multiple mechanisms such as virtual local area networks (`VLANs`), `DiffServ`
    and `IntServ` architectures, traffic shaping, etc.


    ### 8.2.2. Definition(s)


    There are various definitions of the term “Quality of Service”. These include
    the following:


    - **Generic definition**

    “Quality in general has to do with consistency between a subject''s expectations
    regarding the properties of an object.”^([1](#c08.xhtml#c8-note-0001))


    Quality of service (`QoS`) refers to the well-defined, manageable behavior of
    a system according to measurable parameters.


    - **According to Cisco**

    `QoS` refers to the capacity of a network to provide improved service for network
    traffic based on various underlying technologies, including `Frame Relay`, `ATM`,
    `Ethernet`, and `802.1` and `SONET` networks, etc.


    - **According to IUT-T**

    All of the characteristics of a telecommunications service having to do with its
    capacity to satisfy the stated and implicit needs of the user of the service.


    - **According to Wikipedia**

    `QoS` is the overall performance of a telephone or IT network, particularly as
    perceived by network users. To measure `QoS` quantitatively, various aspects of
    network service are often taken into account, such as error rate, bandwidth, output,
    transmission time, availability, jitter, etc.


    `QoS` can thus be considered part of the characteristics of a service offered
    by a network. The network itself may offer various service models. It is within
    this context that the `SLA` falls. The `SLA` is contractually defined between
    the service provider and the client for a specific application based on the service
    models offered.


    Thus, `QoS` is an important means of assessing and judging the usefulness and
    above all the performance of teleinformatic networks and their services.


    ### 8.2.3. Objectives of QoS


    `QoS` is principally aimed at remedying problems of network congestion or saturation,
    which cause latencies and data loss. It also enables the optimal support of multimedia
    applications, which are based on the principle of real time. Transactional applications
    require reasonable response time and can therefore benefit from `QoS`. In fact,
    `QoS` abandons the principle of flow neutrality, according to which all frames
    (layer 2) and packets (layer 3) are processed according to the “first come, first
    served” principle, or `FIFO` in switches and routers.


    `QoS` functionality also makes it possible to achieve the following objectives:

    - ensuring a certain level of quality for one or more services (the `VoIP` service,
    for example);

    - isolating/protecting a specific flow from other flows;

    - controlling the distribution of network resources.


    The two main approaches used to achieve these objectives are:

    - oversizing the network by providing a greater bandwidth in order to deal with
    peak traffic times. However, this solution is not economically viable, and involves
    poor management of resources. This is in addition to the fact that a network''s
    capacity cannot be infinite;

    - developing methods to distinguish between different traffic flows in order to
    classify them according to their requirements and prioritize them according to
    their criticality. In sum, the goal is to manage network resources intelligently.


    ### 8.2.4. Metrics of QoS


    In order to evaluate or measure `QoS` as well as the impact of the various underlying
    mechanisms, we use quantifiable parameters that characterize any data flow, specifically
    bandwidth, latency, jitter and packet loss, as recapitulated in [Table 8.1](#c08.xhtml#table1).


    **[Table 8.1.](#c08.xhtml#table1)** *QoS parameters*


    | **Parameter** | **Definition** | **Example** |

    | --- | --- | --- |

    | Bandwidth | End-to-end output available on the network, which is the total number
    of IP packets successfully transferred in a given period of time. | `2 Mbps` |

    | --- | --- | --- |

    | Latency | The time necessary for a packet to traverse the network from end to
    end, from the transmitter to the receiver, on a given support. | `100 ms` |

