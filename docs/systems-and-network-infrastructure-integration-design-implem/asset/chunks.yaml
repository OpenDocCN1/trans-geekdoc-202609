    | Jitter | Variation in end-to-end transit time between two consecutive packets.
    | If the transit time varies between 80 and 120 ms, jitter is 40 ms. |

    | :--- | :--- | :--- |

    | Packet loss | The ratio of the number of packets lost to the number of packets
    transmitted during transmission. | 1% |


    Each type of traffic requires a specific cluster of parameters.


    **Table 8.2. QoS parameters for voice and video**


    | Traffic type | Required parameter cluster |

    | :--- | :--- |

    | VoIP | Output = 64 kbpsLatency <= 150 ms (to be verified)Jitter <= 30 msLoss
    rate = 1% |

    | Video, video conferencing, streaming | Output = From 384 kbps to more than 20MBPLency
    = 200 to 400 msJitter = 30-50 msLoss rate = 0.1-1% |


    In addition to the parameters cited above, which present measurable and quantifiable
    parameters, an assessment of QoS as perceived by the user can be useful. Thus,
    the QoS of a voice communication can be assessed through an `MOS` (Mean Opinion
    Score). MOS value ranges from 1 (unacceptable) to 5 (excellent) and is obtained
    from subjective test results.


    ### 8.2.5. General principles of QoS


    QoS parameters are dependent on connection capacity and dynamic queuing management
    within switch nodes (or routers). If the network shows an overload, taking into
    consideration the fact that each type of traffic has different requirements in
    terms of QoS parameters, a queue for each class of traffic is required. The routers
    involved in a network implementing QoS must provide packet classification functions
    in sufficient queues, management of packets placed in the same queue and scheduling
    to control sharing of the finite capacity of the link among multiple traffics
    of different types.


    ![Figure 8.1. General principles of QoS establishment. For a color version of
    the figure, see www.iste.co.uk/helali/systems.zip](images/fig8_1.jpg)


    **Figure 8.1. General principles of QoS establishment. For a color version of
    the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)**


    #### 8.2.5.1. Classification


    Classification is the first stage of QoS implementation. The principle consists
    of analyzing a packet to determine the corresponding flow, thus determining the
    appropriate level of service. The classification function is carried out by a
    flow or packet classifier based on specific classification rules. These rules
    may refer to headers or tagging, ports, source and destination addresses, etc.
    This stage is of vital importance, as it enables packet differentiation.


    The packet tagging mechanism enables routers to distinguish between the different
    classes of data flows so that the equipment crossed is not forced to reclassify
    the packets received each time.


    #### 8.2.5.2. Queuing management


    Queues serve mainly to manage congestion in a network infrastructure. A corresponding
    queue is created for each tag or class.


    Managing these queues involves mechanisms to manage buffers, a resource limited
    at the switch or router level. The objective is to control the number of packets
    in a queue by deciding which packets to reject in the event of congestion. This
    means it is a packet loss control function. There are multiple techniques corresponding
    to this, including last-packet rejection and random early detection (`RED`), in
    which packets are randomly rejected before the queue reaches a predefined threshold.
    An improved variant of `RED`, weighted random early detection (`WRED`), has been
    developed by Cisco, which defines multiple thresholds according to traffic class.


    #### 8.2.5.3. Scheduling


    Scheduling involves determining packet processing order at the router output level.
    This decision, based initially on the principle of equity, can favor certain flows
    to the detriment of others (real-time applications, certain protocols, specific
    machine source, etc.). This functionality has a significant effect on delay and
    output parameters for each flow. In this way, the scheduler controls the access
    of service classes to a limited network resource, namely bandwidth. Several scheduling
    techniques or algorithms can be applied, including but not limited to:


    - strict priority: a priority `n` queue is fully processed before moving to priority
    `n-1` queue;

    - round robin priority: the router processes a packet from each queue beginning
    with the highest-priority queue;

    - weighted priority or weight fair queuing (`WFQ`), in which each output queue
    receives a certain weighting. The available bandwidth is then shared among the
    different flows according to the weighting assigned.


    #### 8.2.5.4. Traffic policing/shaping


    These are mechanisms to shape and regulate traffic, thus making it possible to
    control the output or bandwidth of each traffic segment in order to reduce traffic
    burstiness.


    Traffic shaping, an operation carried out at input or within a network, ensures
    that traffic remains within a limit value. It helps to avoid peaks and provides
    a quasi-constant flow. Excessive traffic is placed in a buffer and released when
    possible.


    Traffic policing at network input processes traffic that exceeds limits in a different
    way; it generally eliminates or (re)tags these packets without introducing latency
    into the network.


    Implementing QoS in an IT infrastructure requires a preparatory phase that consists
    of:


    - identifying types of traffic in the infrastructure and their requirements;

    - determining the importance of each type of traffic for optimal company activity;

    - classifying traffic;

    - defining the policy to be applied to each class (minimal guaranteed bandwidth,
    maximum bandwidth, fixed priority level);

    - defining the QoS mechanisms to be adopted to manage congestion (policing, shaping).


    ### 8.2.6. QoS mechanisms


    QoS is a key factor for managing multimedia applications and for the success of
    the IP protocol as a basic unifying protocol for next-generation convergent networks.
    To that end, various solutions or mechanisms have been proposed to differentiate
    among network flows and process them adequately.


    These mechanisms are based on two main approaches:


    - either adapting application flows to network capacity;

    - or adapting the network to application flows by managing groups of flows by
    class.


    #### 8.2.6.1. In the transport layer


    At this level, `RTP` and `RTCP` protocols are implemented to manage real-time
    applications such as VoIP and streaming. They represent a concretization of the
    first approach. In other words, they make it possible to adapt the flow of an
    application to the bandwidth available from the network:


    - data transmission in `RTP` (Real-Time Protocol) packets. `RTP` makes it possible
    to number packets, thus enabling the detection of lost packets, media synchronization
    and identification of a message''s content for possible recovery in case of loss.
    `RTP` transports user data;

    - quality control of the session (output, packet loss, jitter, latency) is managed
    by `RTCP` (Real-Time Control Protocol) packets. This protocol is used by receivers
    to send a report containing the main service quality parameters to transmitters.
    This information enables the source to adapt to the situation. In this way, the
    `RTCP` transports supervision packets, enabling network nodes to better control
    real-time applications.


    #### 8.2.6.2. In the network layer


    This involves adapting the network to the characteristics of application flows
    by managing individual flows or groups of classified flows. The IETF has released
    both a best effort model for this and two network layer QoS management models.


    ##### IntServ


    IntServ processes each flow separately from the others. To do this, it uses a
    specific signaling protocol called `RSVP` (Resource ReSerVation Protocol).

