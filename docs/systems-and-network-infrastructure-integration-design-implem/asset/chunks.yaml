- raw: 'GNS3 calculates the possible values for IDLE PC and offers a range of choices,
    as shown in [Figure 2.6.](#c02.xhtml#figure6)


    ![Figure 2.6. Suggested range of IDLE PC values. For a color version of the figure,
    see www.iste.co.uk/helali/systems.zip](images/fig2_6.jpg)


    **[Figure 2.6.](#c02.xhtml#figureanchor6)** *Suggested range of IDLE PC values.
    For a color version of the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    Using the Task Manager, we can test the extent to which applying the suggested
    IDLE PC value will affect the processor load.


    #### 2.3.4.2. *Constructing a simple network topology*


    We begin by selecting a router. Only the types of routers for which we have already
    provided an IOS image are available; all others are grayed out. In [Figure 2.7](#c02.xhtml#figure7),
    we have two router models available (the previously added C1700 and the existing
    C3600).


    ![Figure 2.7. Available router images. For a color version of the figure, see
    www.iste.co.uk/helali/systems.zip](images/fig2_7.jpg)


    **[Figure 2.7.](#c02.xhtml#figureanchor7)** *Available router images. For a color
    version of the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    Using Drag & Drop, we drag the desired routers into the main window.


    ![Figure 2.8. Adding routers to a topology. For a color version of the figure,
    see www.iste.co.uk/helali/systems.zip](images/fig2_8.jpg)


    **Figure 2.8.** *Adding routers to a topology. For a color version of the figure,
    see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    To configure a router, right-click and select CONFIGURE.


    ![Figure 2.9. Configuration of a router. For a color version of the figure, see
    www.iste.co.uk/helali/systems.zip](images/fig2_9.jpg)


    **Figure 2.9.** *Configuration of a router. For a color version of the figure,
    see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    Memory values can be adjusted here and, depending on the type, different modular
    locations can also be added.


    GNS3 offers a selection of modules that can be virtually installed in routers.


    To connect the two routers, simply select the type of corresponding connection
    using the left-hand button (a serial connection in this case) and click on the
    respective routers on the left to select the desired interface.


    A corresponding connection line appears at R1, which is then dragged toward the
    partner router R2.


    ![Figure 2.10. Connection of two routers. For a color version of the figure, see
    www.iste.co.uk/helali/systems.zip](images/fig2_10.jpg)


    **Figure 2.10.** *Connection of two routers. For a color version of the figure,
    see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    Although switches cannot be emulated, it is still possible to simulate them. A
    corresponding button to the left allows you to select the desired switch. This
    is usually an Ethernet switch.


    ![Figure 2.11. Adding a switch. For a color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig2_11.jpg)


    **Figure 2.11.** *Adding a switch. For a color version of the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    Peripheral devices are connected to the switch by selecting the Ethernet connection
    using the connection button on the left (as previously shown for the serial connection).


    ![Figure 2.12. Connection to a switch. For a color version of the figure, see
    www.iste.co.uk/helali/systems.zip](images/fig2_12.jpg)


    **Figure 2.12.** *Connection to a switch. For a color version of the figure, see
    [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    Switches can be configured in a very generic way. To do this, we click on the
    switch to the right and select CONFIGURE. Now we can specify the VLAN and the
    mode assigned to each port.


    ![Figure 2.13. Switch configuration. For a color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig2_13.jpg)


    **Figure 2.13.** *Switch configuration. For a color version of the figure, see
    [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    This allows us to control at least the basic aspects of a switch''s configuration.


    #### 2.3.4.3. *Configuring a router*


    Once a network infrastructure has been constructed, we move on to its configuration.


    To access the router, simply double-click on it or right-click and select console.
    The standard console access program will open. Now we can configure the router
    exactly how we do with physical systems.


    #### 2.3.4.4. *Adding virtual systems*


    It is possible to import virtual machines into GNS3, like an IOS image, or to
    use the cloud.


    ##### Method 1 (cloud)


    Based on VirtualBox, VMware or any other virtualization software program installed
    on the host system executing GNS3, we can create GNS3 interfaces on our virtual
    machines and integrate them into GNS3.


    To do this, we have to choose the host-only network interface in the virtualization
    software, illustrated by VMware Workstation shown in [Figure 2.14](#c02.xhtml#figure14),
    for example.


    ![Figure 2.14. Network configuration of a virtual machine. For a color version
    of the figure, see www.iste.co.uk/helali/systems.zip](images/fig2_14.jpg)


    **[Figure 2.14.](#c02.xhtml#figureanchor14)** *Network configuration of a virtual
    machine. For a color version of the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    Next, we create a cloud connection in GNS3 via the End Devices button.


    ![Figure 2.15. Creation of a cloud connection. For a color version of the figure,
    see www.iste.co.uk/helali/systems.zip](images/fig2_15.jpg)


    **Figure 2.15.** *Creation of a cloud connection. For a color version of the figure,
    see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    Before we can connect to the cloud, we must right-click on the cloud and select
    Configure, then choose the interface to connect to GNS3 (in this case VMnet1).


    ![Figure 2.16. Configuring the cloud. For a color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig2_16.jpg)


    **Figure 2.16.** *Configuring the cloud. For a color version of the figure, see
    [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    After selecting it, we click on Add to add this interface.


    Now, we can connect the cloud to other objects, such as the switch, in the usual
    way.


    Through this VMnet1 interface connection, each virtual machine (VM) connected
    via VMnet1 is integrated into GNS3.


    Using the same principle, we can integrate the physical environment using the
    physical interface of our host computer as a cloud interface.


    ![Figure 2.17. Adding the interface. For a color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig2_17.jpg)


    **Figure 2.17.** *Adding the interface. For a color version of the figure, see
    [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    ![Figure 2.18. Connecting the cloud with the switch. For a color version of the
    figure, see www.iste.co.uk/helali/systems.zip](images/fig2_18.jpg)


    **Figure 2.18.** *Connecting the cloud with the switch. For a color version of
    the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    ##### Method 2


    A ready-to-use virtual machine is available, for which we will modify the network
    parameters. We choose the adapter2 card, for example, and put it into “Host-only
    Adapter”.


    Once the virtual machine is configured, we will prepare GNS3 to integrate this
    machine. To do this, we start the software program and go to “Edit”, then to “Preferences”,
    and finally to the “VirtualBox” menu.'
