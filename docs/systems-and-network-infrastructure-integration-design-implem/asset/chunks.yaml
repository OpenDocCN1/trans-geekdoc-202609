    \n## 8.4. Chapter summary\n\n![](images/fig8_u3.jpg)\n\n## Notes\n\n1.  This chart\
    \ is also available at [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)\n\
    \n2.  [1](#c08.xhtml#R_c8-note-0001) Quality measurement in IT networks, Razvan\
    \ Beuran, 2004.\n\n# **9**  \n\nMonitoring Systems and Networks\n\n> “A house\
    \ runs more smoothly when the master looks after his own affairs.”\n\n> \n\n>\
    \ French Proverb\n\n– Understanding the concept of monitoring and its challenges.\n\
    \n– Learning the main monitoring protocols.\n\n– Discovering proprietary and free\
    \ monitoring tools.\n\n– Taking on Nagios, the flagship free monitoring tool.\n\
    \n## 9.1. Introduction\n\nBusinesses set up fairly complex IT infrastructures\
    \ in order to ensure reliable service and permanent access to data for its employees\
    \ and partners.\n\nNetwork infrastructures are vital to the operation of a business\
    \ and its IT system, as any problem or breakdown on these networks can have harmful\
    \ consequences for the company both financially and organizationally and can tarnish\
    \ its brand name. In view of these facts, several parameters should be monitored,\
    \ such as output, link function, cabling problems and the state of the different\
    \ services in place.\n\nTo do this, rigorous follow-up and monitoring of the different\
    \ components of these infrastructures is necessary to ensure that they are functioning\
    \ properly and in order to intervene in the event of problems, and even to be\
    \ proactive and anticipate malfunctions. This is the end goal of monitoring.\n\
    \nNetwork and service monitoring involves methods and tools that make it possible\
    \ to observe everything that happens in the network and to manage its components\
    \ in the event of problems, locally or remotely, in order to restore functionality.\
    \ These methods include detecting breakdowns, modifying equipment parameters,\
    \ measuring resource consumption, improving performance and identifying malicious\
    \ activity.\n\n## 9.2. Main concepts of network and service supervision\n\n###\
    \ 9.2.1. *Definition*\n\nMonitoring a network infrastructure is a matter of better\
    \ understanding its condition and degree of performance, verifying its proper\
    \ dimensioning and the absence of overloaded links or equipment and detecting\
    \ possible breakdowns. We generally monitor:\n\n– active equipment such as routers,\
    \ switches and wireless access points;\n\n– authentication and storage servers,\
    \ directories, web servers, VoIP solutions and corresponding services;\n\n– client\
    \ workstations and IT equipment in general such as laptop computers, smartphones,\
    \ telephone stations and printers;\n\n– operating systems, by measuring the use\
    \ of random access memory, for example;\n\n– applications, by monitoring the availability\
    \ of application ports and processes.\n\n### 9.2.2. *Challenges of monitoring*\n\
    \nMonitoring ensures the highest possible availability rate via the monitoring\
    \ of infrastructure components, and more specifically its hotspots, in order to\
    \ react quickly and appropriately to a possible breakdown. Unavailability of an\
    \ IT system can cause enormous losses for the business and tarnish its image.\
    \ Monitoring also enables us to prevent possible breakdowns through the rapid\
    \ analysis and reporting of information in a proactive approach.\n\nMonitoring\
    \ consists of overseeing, viewing, analyzing, acting and alerting. The goal is\
    \ to reduce IT-related incidents and problems to a minimum. Data collected can\
    \ be aggregated into a dashboard that can aid in decision-making.\n\n![Figure\
    \ 9.1. Functionalities of a monitoring system](images/fig9_1.jpg)\n\n**Figure\
    \ 9.1.** *Functionalities of a monitoring system*\n\n### 9.2.3. *Typology*\n\n\
    Monitoring is a process that affects various levels of an IT infrastructure: interconnections\
    \ (network), machines (system) and services offered (applications):\n\n– network\
    \ monitoring: the hardware concerned generally consists of switches, routers,\
    \ servers (availability, probe querying, alerts), inverters, printers;\n\n– system\
    \ monitoring: involves three main system resources: processor, memory and storage;\n\
    \n– application monitoring: this type of monitoring tests applications hosted\
    \ by servers to determine their availability, or the state of the services offered.\n\
    \nMethods of monitoring include:\n\n– *ad hoc* methods such as ping, traceroute,\
    \ netstat and telnet;\n\n– methods based on network management protocols such\
    \ as the Common Information Management Protocol (CMIP), which is an OSI protocol\
    \ but is rarely used, and the Simple Network Management Protocol (SNMP), which\
