    - 交换机（Switches）：它们是控制流量、检测并纠正错误以及减少过载的二层设备。交换机还决定冲突域和广播域的大小。它们使用微分段来减小冲突区域的大小，从而提高网络性能。它们还允许根据用户的工作组创建虚拟局域网（`VLANs`）和广播域。


    它们根据帧中找到的 CAM 目的地址和交换表（`CAM table`）来传输流量。


    多层交换机是能够执行路由任务和高级服务的交换机。它也被称为 `L3` 交换机。


    - 桥（Bridges）、集线器（hubs）、中继器（repeaters）：桥根据 MAC 地址过滤两个物理段之间的流量。集线器集中连接并扩展物理段。与交换机不同，流量会从其所有端口输出；它对流量的目的地不做任何决策，因此仅呈现单一冲突域。中继器是一种简单再生信号的设备。


    - Wi-Fi 接入点（access points）：它们在无线电覆盖范围内提供无线服务。


    ### 4.2.3.2. 软件部分


    终端设备通过网络传输的数据以二进制信号的形式，通过一组称为通信协议的特定规则进行传输。


    协议构成了通信双方寻找彼此、相互连接和交换信息的通用语言。协议定义了与通信相关的参数，例如物理特性（调制、物理支持类型、连接类型）以及交换的消息类型和格式。


    在 20 世纪初，每个制造商都围绕私有架构开发了自己的网络解决方案（如 IBM 的 `SNA`、DEC 的 `DECnet`、Bull 的 `DSA`、国防部的
    `TCP/IP` 等）。


    因此，互连这些不同的网络是不可能的，建立开放的——即具有互操作性的——系统变得必要。因此，标准化和定义标准通信模型的方法由 `ISO`、`IEEE` 和 `IETF`
    等标准化组织实施。


    通信模型简化了节点之间的通信过程，以分层结构的形式组织通信。每一层都执行与通信相关的特定功能。


    此外，通信模型具有多种优点：它能够更好地理解通信功能，促进互操作性，简化诊断和修复过程，并允许在不影响其他层的情况下更改或添加一层的功能。


    #### OSI 模型


    `OSI`（开放系统互连）模型由 `ISO` 开发，由七层组成，每层都说明了计算机交换的参考架构。


    ![图 4.2. OSI 模型。查看彩色版本请访问 www.iste.co.uk/helali/systems.zip](img/fig4_2.jpg)


    **图 4.2.** OSI 模型。查看彩色版本请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)


    #### 硬件层功能


    物理层、链路层、网络层和传输层负责网络节点之间的数据传输。


    **表 4.1. 硬件层功能**


    | 层 | 功能 | 协议示例 |

    | --- | --- | --- |

    | 传输层 | 端到端数据传输；连接和非连接模式；错误修正 | `TCPUDP` |

    | 网络层 | 从源到目的的数据路由；本地寻址 | `IP` |

    | 链路层 | 物理支持连接的设备之间的信息传输；介质访问错误检测 | `HDLC`、`Ethernet`、`Token Ring`、`Wi-Fi` |

    | 物理层 | 设备间的比特路由；指定电压、支持和连接类型 | |


    #### 软件层功能


    会话层、表示层和应用层负责应用程序。


    **表 4.2. 软件层功能**


    | 层 | 功能 | 协议示例 |

    | --- | --- | --- |

    | 应用层 | 用户接口 | `HTTP`、`FTP` |

    | 表示层 | 数据表示；特定处理（压缩、加密） | `ASCIIIEBCDIC`、`JPEG` |

    | 会话层 | 用户对话管理；不同应用程序的数据分离 | 操作系统 |


    #### TCP/IP 模型


    `TCP/IP` 由美国国防部（`DoD`）发明，寻求一种可路由、稳健且高性能的协议，用于创建即使在核战争也能运行的广域网。


    `TCP/IP` 已成为异构计算机之间互操作的标准模型。这种互操作性是 `TCP/IP` 的主要资产之一。`TCP/IP` 模型的成功很大程度上归于它的开放性。独立于特定架构或特定操作系统的源代码可用。


    因此，`TCP/IP` 协议不依赖物理支持，可以在任何类型的平台上运行。事实上，`TCP/IP` 可以通过各种类型的支持质传输，包括串口、同轴 `Ethernet`
    电缆、专用线路、环形网络、无线链路、激光链路、红外、`ATM`、光纤等。


    `TCP/IP` 模型由四层组成：应用层、传输层、Internet 层和网络访问层。


    ![图 4.3. TCP/IP 模型](img/fig4_3.jpg)


    **图 4.3.** TCP/IP 模型


    四层每一层的作用在表 4.3 中指定。


    **[表 4.3.] TCP/IP 模型**


    | 层 | 角色 |

    | --- | --- |

    | 应用层 | 文件传输、导航 |

    | 传输层 | 数据流控制确认机制 |

    | Internet 层 | 逻辑寻址路由 |

    | 网络访问层 | 与网络的物理接口<br>错误检查 |


    `OSI` 和 `TCP/IP` 模型在图 4.4 中进行了比较。


    ![图 4.4. OSI 模型与 TCP/IP 模型。查看彩色版本请访问 www.iste.co.uk/helali/systems.zip](img/fig4_4.jpg)


    **[图 4.4.] OSI 模型与 TCP/IP 模型。查看彩色版本请访问 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)


    ### 4.2.4. 测量网络性能


    我们判断网络性能有三个主要指标：输出、延迟和丢包。这些标准在 IT 网络的故障诊断过程中、在评估此网络性能时、或在设计过程中非常有用：


    - 输出：单位时间内发送和接收的数据量。

    - 延迟：数据包通过网络从源传输到目的地所需的时间。它取决于传输数据链中的每个部分：通信站以及更具体的网卡；局域网链路及交换机；广域链路及路由器。它可以由以下部分组成：


    - *传播时间*：比特从发送端到接收端所需的时间（或数据包从 A 点移动到 B 点所需的时间）。通过 A 和 B 之间的距离除以信号传播速度来测量。

    - *传输时间*：将消息发布到网络所需的时间（节点[网络设备]发送整个数据包到介质所需的时间）。

    - *处理时间*：中间和终端设备在传输过程中处理数据的时间。


    ![图 4.5. 网络交付时间](img/fig4_5.jpg)


