    each manufacturer, such as `Cisco`, for example. Each piece of hardware being
    monitored has its own `MIB`.


    `MIB` organization is standardized according to the `ASN1` standard (Abstract
    Syntax Number 1), which specifies a notation intended to describe data structures.


    To access the desired variables, we use `OID` (Object Identification), which designates
    the placement of the variable to be consulted in the `MIB`. The `OID` is a sequence
    of numbers separated by the character `.` (a dot or period).


    EXAMPLE.– On a Cisco router, the `OID` `1.3.6.1.4.1.9.2.1.58` designates the utilization
    of the processor during the last five minutes (Object `avgBusy5`).


    Companies active in the field are allocated `OIDs` by the Internet Assigned Numbers
    Authority (`IANA`).


    EXAMPLE.– `Cisco` `1.3.6.1.4.1.9`, `HP` `1.3.6.1.4.1.11`, `Novell` `1.3.6.1.4.1.23`.


    ![Figure 9.5. MIB structure](images/fig9_5.jpg)


    **Figure 9.5. MIB structure**


    There are three major versions of the `SNMP` protocol:


    – `SNMPvl`: as the first version of the network management protocol, this protocol
    supplies the underlying concept for the manager-agent model and the basis for
    communication between the management station and each agent. The only built-in
    security mechanism is the exchange of a so-called community string, which is sent
    with the respective requests;

    – `SNMPv2c`: this offers improved security performance. Its main advantage lies,
    however, in recently implemented types of messages: `GETBULK` (to query several
    data items in a single request) and `INFORM` (for confirmations of agent responses);

    – `SNMPv3`: the `IETF` has focused entirely on security in `SNMPv3` and replaced
    the community string with a username and password. Additionally, unlike its predecessors,
    the third version of the protocol contains functions that can be used to encrypt
    the transmission of `SNMP` packets. Today, only version 3 is considered to meet
    an operable standard.


    ### 9.3.2. WMI (Windows Management Instrumentation)


    `WMI` is used to monitor and manage Windows system resources. It can retrieve
    enormous amounts of information from a local or remote machine. Besides retrieving
    monitoring information, it is now possible to work on machines to install or uninstall
    programs, for example. An event-driven infrastructure transmits alerts according
    to the monitoring policy. The major disadvantage of this protocol is that it is
    only for Windows platforms.


    ### 9.3.3. WS-Management (Web Services for Management)


    `WS-Management` is a communication protocol for the administration of servers,
    equipment and applications based on web services (`SOAP`). `WS-Management` is
    a recent protocol and thus particularly well suited for the distributed infrastructures
    frequently encountered these days.


    ### 9.3.4. IPMI (Intelligent Platform Management Interface)


    `IPMI` provides a standardized hardware management interface. It is most frequently
    offered by servers (`Dell`, `IBM`, `HP`, `Intel`, `NEC`, etc.) and serves to manage
    a machine, locally or remotely, whether it is turned on or off.


    It is based on a specification common to most manufacturers, consisting of a group
    of interfaces that make it possible to monitor a server, and more specifically,
    the checking of certain hardware components (temperature sensors, ventilator rotation
    speeds, etc.), independently of its operating system.


    ### 9.3.5. NetFlow/IPFIX


    This is a network flow monitoring program first developed by `Cisco` and then
    standardized by `IETF` under the name `IPFIX`.


    The collection of information pertaining to packets (source address, destination
    address, protocol, port) is carried out by using routers, switches or specialized
    network sensors. These sensors aggregate this information and send the aggregated
    data to a collector at regular intervals. This is a network performance management
    solution, offering more information and more sophisticated methods than the reference
    monitoring protocol, `SNMP`.


    ### 9.3.6. Netconf


    `Netconf` was developed by `IETF` as the successor to the `SNMP` protocol (`v1`,
    `v2c`, `v3`). It was developed to implement new-generation network management
    based on the language `XML` (Extensible Markup Language).


    This protocol is based on a client-server model and allows a manager to manipulate
    network equipment configurations by sending them `XML` requests.


    ## 9.4. Monitoring tools


    There are a number of tools available to monitor servers and the network. These
    are designed to enable the smooth operation of network infrastructures and systems
    by providing administrators with information on peripheral devices and systems.
    However, they differ from one another in terms of specific features having to
    do with interface, deployment architecture, etc.


    The choice of a specific tool depends mainly on needs, budget, skills needed to
    install, operation and maintenance available to the company, and on the areas
    the company wishes to monitor, that is, the network, system, applications or all
    three at once.


    Monitoring needs can in fact vary widely. Some companies wish simply to be able
    to view in real time the functioning of their IT infrastructure, while others
    also desire to be notified in the event of problems or to measure performance
    or statistics to aid in decision-making.


    ### 9.4.1. Commercial monitoring solutions (HP OpenView, Tivoli) and software
    publisher solutions

