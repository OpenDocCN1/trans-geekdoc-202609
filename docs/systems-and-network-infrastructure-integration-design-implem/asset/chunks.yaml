    – 2011 年，Facebook 的一个数据中心被填满了。当时的问题是，在考虑到生态足迹的情况下，是否有必要建立一个新的数据中心。所选择的解决方案是将语言
    `PHP` 替换为 `C`，从而释放了现有数据中心 50%的可用空间。这一选择让 Facebook 节省了超过 1 亿美元，并同时减少了其生态足迹。


    – Fairphone：这款手机不包含在武装地区开采的稀有金属。它在符合社会标准的工厂制造。它是完全可修复的，并且是特定回收计划的一部分。


    – 里尔大学的生态责任型数据中心：采用了“冷走道”方案，将 IT 资源中心所有的 IT 服务器汇在一起。这是一个分离热空气和冷空气流的系统。服务器房被组织成热走道和冷走道。只有冷走道安装了空调，即面向阵列前方的走道。这种简单的安排本身就减少了对散热的需求。此外，完全可以在热走道上方安装排气扇来通风，并可能将其重新引导，例如用于办公室的加热。


    – 绿色代码实验室（Green Code Lab）的目标是通过一套方法论和良好实践开发，在全球范围内推广软件的生态设计。它的工作基于软件生态设计原则，使企业能够从设计阶段开始将环境影响标准整合到应用程序或数字服务中，以减少整个生命周期中的影响。这些项目包括用于标记生态设计网站的“绿色代码标签”，以及用于为网站添加环境评分的“Web
    能量存档”。


