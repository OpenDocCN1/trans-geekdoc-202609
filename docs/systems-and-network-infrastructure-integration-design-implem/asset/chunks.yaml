    \n# **6**  \n\nSystem and Network Security\n\n> “A computer is only secure when\
    \ it's turned off, and not really even then!”\n\n> \n\n> Bill Gates\n\n– Recalling\
    \ the basic concepts and challenges of IT security.\n\n– Defining the threats\
    \ and attacks to which a business's IT system can be exposed.\n\n– Describing\
    \ various security mechanisms.\n\n– Understanding security management systems\
    \ and corresponding norms as well as the concept of a security policy.\n\n## 6.1.\
    \ Introduction\n\nThese days, business IT systems are more and more widely distributed\
    \ and rely on computer networks to connect the headquarters with its various subsidiaries,\
    \ as well as teleworkers, retail establishments, etc. This remote access has encouraged\
    \ the decentralization of businesses and their opening up to the entire world,\
    \ and has become increasingly sophisticated with new wireless access technologies\
    \ (GSM, 4/5G, Wimax) and the complete opening up of the Internet network.\n\n\
    Of course, IT networks are necessary for businesses as they enable trade and increase\
    \ these businesses' competitiveness. Nevertheless, they also carry enormous risks\
    \ such as the interception of messages, data theft, loss of system and network\
    \ access, hacking, etc. A wide range of security and safeguarding mechanisms have\
    \ been introduced in order to reduce the risks faced by businesses as much as\
    \ possible.\n\n## 6.2. Definitions, challenges and basic concepts\n\nIT security\
    \ is made up of all of the technical, organizational, legal and human procedures\
    \ deployed to maintain and ensure the security of the hardware and software resources\
    \ of an enterprise's IT system.\n\nSecurity represents a major challenge for any\
    \ business and its partners. There are in fact multiple challenges to a company's\
    \ competitiveness and even survival in an atmosphere of increasingly sophisticated\
    \ attacks and threats:\n\n– short-term challenges: giving all authorized users\
    \ access to the information they need;\n\n– intermediate-term challenges: these\
    \ have to do with the consistency of the enterprise's information system;\n\n\
    – long-term challenges: keeping users' and clients' trust for a good business\
    \ brand image.\n\n![Figure 6.1. Various impacts of security](images/fig6_1.jpg)\n\
    \n**Figure 6.1.** *Various impacts of security*\n\n Information is as important\
    \ an asset as those related to the classic production system (physical assets,\
    \ human assets, financial assets, etc.). It is even a strategic asset that must\
    \ be protected. Information security can be defined as a system implemented to\
    \ ensure the protection of this information and its related assets with the goal\
    \ of mainly ensuring the following services or objectives:\n\n– availability:\
    \ ensuring that authorized users have access to information and related resources\
    \ when desired;\n\n– integrity: ensuring precision and accuracy of information\
