- raw: '**Figure 4.5.** *Network delivery time*


    Latency can be measured using the **ping** command:


    Jitter: variation in latency. Packets arrive irregularly depending on the network
    load. It has an enormous influence on VoIP quality. If the jitter becomes important,
    the quality of the voice conversation (VoIP) will be severely affected.


    – Packet loss: this is the number of packets lost per 100 packets transmitted
    by a host on the network. It has a significant effect on the quality of the link
    by requiring the retransmission of data.


    ### 4.2.5. *Concepts of collision domain/broadcast domain and VLANs*


    The collision domain is the logic area of the network that generates frames that
    then collide. All shared-support environments dependent on concentrators are collision
    domains.


    In a switched environment, each host connected to a switch port constitutes a
    dedicated connection and a separate collision domain.


    A broadcast domain is a logic area that includes all peripheral devices receiving
    any broadcast packet sent by a network host.


    Broadcast traffic is usually significant, which is generated, for example, by
    ARP and DHCP protocols. This traffic generally involves only a limited number
    of machines and is thus a source of binary output waste, increased latency and
    pointless consumption of calculation power.


    To this is added the fact that today''s users are more and more mobile, and their
    geographical location is not necessarily dependent on their logic membership.
    Now, employees relatively distant from one another can belong to the same broadcast
    domain.


    In addition a broadcast domain''s traffic is visible, thus creating problems with
    confidentiality.


    Two approaches can be used to resolve the issues mentioned above.


    The first approach, physical segmentation, is characterized by the creation of
    IP sub-networks interconnected via routers. The disadvantages of this option include
    a lack of upgradeability, increased cost and difficulty of maintenance.


    The second approach involves logical segmentation, or virtual local area networks
    (VLANs). A VLAN is used to group users logically and to increase output, improve
    security, reduce costs, and facilitate mobility and management.


    VLANs are configured via switches. One switch must be able to manage multiple
    VLANs, and a single VLAN must be able to be distributed across multiple switches.


    With regard to layer 2, a VLAN is logical Ethernet broadcast domain managed by
    one or more switches based on the use of an aggregation protocol, IEEE 802.1q.


    ## 4.3. Methods and models of IT network design


    The principles and models of network design can help network engineers to design
    and construct a flexible, robust and manageable network.


    The OSI and TCP/IP communications models should not be confused with a design
    model. Design models are used to build networks while complying with certain architectural
    rules. Their objective is to satisfy the current and future needs of businesses
    and their users as far as possible.


    Design models facilitate the configuration, deployment, maintenance and updating
    of network infrastructures. They can also aid in hardware purchasing and the provision
    of services.


    ### 4.3.1. *Principles of structured engineering*


    The adoption of a systematic design approach is highly beneficial for the implementation
    of a network infrastructure. It is important to remember that local area networks
    can be categorized according to their size:


    – small network: this provides services for fewer than 200 nodes;


    – medium-sized network: this serves a fleet of 200 to 1,000 nodes;


    – large network: this provides services to more than 1,000 peripheral devices.


    Network design varies depending on the size and needs of a company. The design
    of a network infrastructure for a small business with a reduced number of nodes
    is certainly less complex than that for a large business with a more complex infrastructure.


    In general, a good design is based on the following principles of structured engineering:


    – Hierarchy: the hierarchical network model is a useful tool in the design of
    a reliable network infrastructure. The initial complex problem is broken down
    into simpler elements in order to better address them. The hierarchical design
    model thus offers multiple distinct functional levels.


    – Modularity: this stems from hierarchization. Cisco has identified several modules,
    including enterprise campus, service package, data center and Internet edge. Consequently,
    growth and change are both supported. The network is upgraded by adding new modules
    instead of completely rethinking the architecture of the existing network.


    – Resilience: this ensures that the network infrastructure is available and operational
    under both normal and abnormal conditions. Normal conditions are marked by normal
    network flows and include planned events such as maintenance periods. Abnormal
    conditions are caused by software and hardware breakdowns and unplanned network
    flows, which occur during hardware or software breakdowns, the appearance of unanticipated
    traffic, intentional or unintentional DoS events or any other unanticipated event.


    – Flexibility: the ability to easily modify parts of the network, add services,
    or improve performance without complex updates or upgrades.


    – Security: this is taken into account at each level of the design model.


    #### 4.3.1.1. *Hierarchical network model*


    In order to achieve these fundamental design objectives, a network infrastructure
    must be based on a hierarchical infrastructure. This approach enables the designer
    to adapt the choice of hardware and software according to the level or layer.
    This model is called the hierarchical model and was first introduced by Cisco.


    The network will be divided into three layers. Each of these layers has a well-defined
    role and offers specific functions that define its role in the overall network:


    – Access layer: this layer enables users to access the network. Only switches
    are used at this level, and sometimes hubs. Its sole purpose is to connect final
    users, whether by Wi-Fi, Ethernet or other means, in a secure manner if possible.
    Consequently, its processes are simple and its performance is not specialized.
    Moreover, this layer provides teleworkers and remote sites access to the company
    network via WAN connections.


    This layer supplies several functions such as switching, port security, spanning
    tree protocols and power over Ethernet (PoE).


    – Distribution layer: this layer links access layers and the core, enabling the
    routing and filtering of packets according to the strategies adopted. The network
    is divided into segments at this level. Routers or high-performance switches can
    be used at this level depending on the size of the company. For large companies,
    these distribution routers will ensure the aggregation of LAN or WAN links, route
    packets, security by applying ACLs (Access Control Lists), fault tolerance, delineate
    broadcast domains, etc. For small businesses using only switches, the functions
    mentioned above will be delegated to the core layer.


    – Core layer of the network: this is also called the “backbone ” of the network.
    This layer links the different segments of the network, specifically the floors
    of a business, its remote offices, etc. Routers are also found at this level;
    these must have extremely high performance as they are responsible for an enormous
    quantity of network traffic. This layer is actually made up of high-speed network
    devices such as the Cisco Catalyst 6500 or 6800.


    Without this core layer, the switches in the distribution layer would have to
    be completely meshed with one another. This type of design is difficult to upgrade
    without taking into account the need to wire the distribution switches to one
    another.


    ![Figure 4.6. Hierarchical model. For a color version of the figure, see www.iste.co.uk/helali/systems.zip
    ](images/fig4_6.jpg)'
