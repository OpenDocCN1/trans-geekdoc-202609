- raw: 'GNS3 (Graphical Network Simulator-3) is a graphical network emulator that
    is free to use, open source and reliable. It can also be used to test all types
    of equipment, not only that of one manufacturer in particular. Thus, it can be
    used to test CISCO, Juniper, SOPHOS, Citrix and many others. It is also multiplatform
    and can be installed on Windows, Linux and Mac operating systems. It uses a framework
    of open-source programs, each of which can emulate specific platforms to execute
    software programs corresponding to a provider. It is used to test configurations
    that will be deployed in the future on real equipment.


    GNS3 is a network emulation tool similar to the Cisco tool PacketTracer, which
    is used to simulate a network infrastructure based on Cisco equipment and to configure
    equipment in order to reproduce the real infrastructure as closely as possible.
    GNS3 makes it possible to emulate networks more realistically, through both its
    ability to import real Cisco (or other) IOS into the routers emulated, and its
    ability to include in our virtual network real virtual hosts created with VirtualBox
    or other virtualization software. Thus, with GNS3, we can link the real to the
    virtual.


    It includes the following components:


    – Dynamips: emulates Cisco (or other) routers and switches and provides the corresponding
    environments or IOS;


    – Dynagen: represents the Dynamips control and management software layer;


    – Qemu: an emulator that enables GNS3 to execute Cisco ASA, PIX;


    – VirtualBox or VMware: used to create and run virtual machines linked to Windows
    and Linux operating systems.


    GNS3 is based on three concepts: simulation, emulation and virtualization. Since
    we have already discussed the concept of simulation, we will now introduce the
    other two concepts.


    Emulation does not allow modeling, but actually identically reproduces the behavior
    of a software program and its hardware architecture. Virtualization uses the architecture
    of the host system, while emulation reproduces its software, which makes the virtualization
    perform more efficiently.


    ### 2.3.1. *Functionalities of GNS3*


    – Simulates the behavior of two network interfaces connected via an Ethernet cable.


    – Emulates routers, switches and other computers or servers. The respective components
    are operated with real software. Consequently, each virtual router requires a
    real IOS image. The thousands of lines of code of the highest-performance routers
    will be executed exactly as they would be in the real world, thus yielding the
    same behaviors as in production.


    – GNS3 can be used to capture traffic between two virtual routers via Wireshark.


    – It is possible to integrate virtualized Windows and Linux operating systems
    via VirtualBox or other virtualization solutions.


    – GNS3 provides a link between the simulated network and the real physical network
    so that the virtual and physical components function together.


    ### 2.3.2. *Limitations*


    GNS3 only works with specific types of routers. The IOS must be compatible with
    these types of routers. An IOS image cannot be used for a 2,800 router on a platform
    emulated for a 3,725. Moreover, GNS3 does not currently work with switch platforms.
    Generic switches can be integrated to simulate basic switching functions.


    ### 2.3.3. *GNS3 installation*


    GNS3 exists for Windows, Linux and Mac, and can be downloaded from [https://www.gns3.com/](https://www.gns3.com/).
    You must create an account in order to download GNS3 for free.


    You should follow the recommendations pertaining to the hardware configuration
    of your system. The minimal configuration is made up of a two-core processor,
    4 GB of RAM and 1 GB of hard disk space for installation.


    Only a few tests can be carried out with this configuration, due to lack of resources.
    The more powerful the system configuration, the more new routers, switches and
    other virtual servers can be added, and the larger the scale of the tests that
    can be conducted.


    GNS3 uses well-known software programs from the systems and network sphere as
    components, some of which are required, including WinPcap, Wireshark, Dynamips,
    VPCS, and other optional programs such as SolarwindsResponse and Virtviewer.


    ### 2.3.4. *Getting started with GNS3*


    Once installation is complete, we must first create a new project.


    ![Figure 2.1. Creation of a new project. For a color version of the figure, see
    www.iste.co.uk/helali/systems.zip](images/fig2_1.jpg)


    **Figure 2.1.** *Creation of a new project. For a color version of the figure,
    see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    When the project is created, the main window with various toolbars appears.


    ![Figure 2.2. Description of GNS3 interface. For a color version of the figure,
    see www.iste.co.uk/helali/systems.zip](images/fig2_2.jpg)


    **[Figure 2.2.](#c02.xhtml#figureanchor2)** *Description of GNS3 interface. For
    a color version of the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    The outlined parts of [Figure 2.2](#c02.xhtml#figure2) are defined below.


    ![](images/fig2_u1.jpg)


    Create/open a project


    ![](images/fig2_u2.jpg)


    The first button allows you to connect with one click to the consoles of each
    device in the model. The second displays the configuration terminal of a router
    or a switch.


    ![](images/fig2_u3.jpg)


    – The first button is the Start button, which launches the model''s hardware.


    – The second button pauses it.


    – The third button turns it off.


    – The fourth button restarts the whole thing.


    – The fifth button displays the client''s virtual machine.


    ![](images/fig2_u4.jpg)


    The first two buttons are used to zoom (this can be useful when working with a
    large model).


    The third button takes a snapshot of the model (to send to the client, for example).


    #### 2.3.4.1. *Integration of IOS image*


    Using peripheral device selection, we can select a router and drag it toward the
    main window; however, this only works for previously configured equipment.


    To do this, we first go to the menu bar in EDIT | IOS IMAGE AND HYPERVISORS to
    add the IOS image we have obtained (paid or free).


    ![Figure 2.3. Adding IOS Image. For a color version of the figure, see www.iste.co.uk/helali/systems.zip](images/fig2_3.jpg)


    **Figure 2.3.** *Adding IOS Image. For a color version of the figure, see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    We select the image file as well as the corresponding platform and model before
    saving.


    A base configuration is saved as a text file (baseconfig.txt) that is automatically
    created in the specified path. This text file is later used to customize the base
    configuration of all routers according to the need.


    The Cisco 1700 router is added and the following message appears: “Warning: IDLE
    PC will have to be configured!”


    ![Figure 2.4. Example of a router image. For a color version of the figure, see
    www.iste.co.uk/helali/systems.zip](images/fig2_4.jpg)


    **Figure 2.4.** *Example of a router image. For a color version of the figure,
    see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*


    ##### IDLE PC


    The field “**IDLE PC**” is a value that enables the optimization of CPU resource
    allocation.


    GNS3 consumes a very large amount of resources. Without additional configuration,
    a single router in GNS3 can use 100% of the processor. However, it is possible
    to reduce this drain on resources by defining an IDLE PC value. To do this, right-click
    on the router and then click the Start button. Next, right-click again and select
    IDLE PC.


    ![Figure 2.5. Using the IDLE PC function. For a color version of the figure, see
    www.iste.co.uk/helali/systems.zip](images/fig2_5.jpg)


    **Figure 2.5.** *Using the IDLE PC function. For a color version of the figure,
    see [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)*'
