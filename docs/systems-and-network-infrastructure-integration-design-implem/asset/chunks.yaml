    ### 8.3.4. *Redundancy in the application layer*


    Despite the use of redundancy in the hardware components of the network infrastructure,
    several factors may cause any service to become unavailable due to malfunctions
    in software, operating systems and applications. Thus, and in an effort to improve
    the overall availability of an IT system, applicative redundancy must be used
    for web servers, DNS servers or databases, for example.


    To this end, methods have been developed such as load balancing, server switching
    and session switching. These are intended to relieve the burden on the server
    through a transparent distribution of communications over multiple computers,
    by subcontracting connection configuration actions and through verification of
    access authorization in the upstream load balancer. For example, load balancing
    can be used with multiple web servers which all serve the same web pages and are
    grouped together into a cluster. A typical configuration is the formation of a
    pool or cluster of servers which is addressed by the terminals using a common
    virtual IP address. The load balancer converts this into the real address of the
    real server used. Load balancing helps to improve QoS, in that it enables the
    regulation of traffic, thus minimizing load peaks and avoiding problems of congestion.


    Load balancing is now managed by hardware solutions as well as software solutions.
    Microsoft''s NLB, HAProxy, Safekit and Linux''s virtual server are some examples
    of software tools.


    Another possibility for the implementation of redundancy is provided by virtualization.
    This makes multiple virtual servers available on a single physical machine, with
    the result that more cost-effective and eco-friendly redundancy has become possible.


    Redundancy of different services must be used according to how vital they are
    to the IT system.


    The benefits for network operators having to do with link aggregation, router
    redundancy protocols and load balancing in a network structure combined with layer
    2 or 3 switching can justify added costs related to additional equipment and its
    setup. These benefits can be broken down as follows:


    – tolerance of breakdowns with simultaneous load distribution;


    – transparent redundancy for terminals and servers (VRRP and HSRP);


    – good scalability of capacity within a sub-network;


    – rapid switching in case of error;


    – creation of appropriately sized broadcast domains;


    – flexible configuration of sub-networks in buildings;


    – compatibility with the use of standardized protocols, particularly between servers
    and switches;'
