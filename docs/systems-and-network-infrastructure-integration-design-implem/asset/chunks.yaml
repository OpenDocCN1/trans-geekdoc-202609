    ### 5.6.2. Operating principle


    In order to display a webpage, the client uses a browser (e.g. Firefox) to send
    an `HTTP` request to the server, which decodes it and sends HTTP response back
    to the browser. The most common HTTP servers are:


    - Apache server: the most used web server; compatible with all operating systems;

    - Microsoft Information Services (`IIS`): for Windows systems only. Regardless
