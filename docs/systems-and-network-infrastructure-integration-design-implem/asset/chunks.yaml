    # 9. Monitoring Systems and Networks


    > “A house runs more smoothly when the master looks after his own affairs.”


    > French Proverb


    – Understanding the concept of monitoring and its challenges.

    – Learning the main monitoring protocols.

    – Discovering proprietary and free monitoring tools.

    – Taking on Nagios, the flagship free monitoring tool.


    ## 9.1. Introduction


    Businesses set up fairly complex IT infrastructures in order to ensure reliable
    service and permanent access to data for its employees and partners.


    Network infrastructures are vital to the operation of a business and its IT system,
    as any problem or breakdown on these networks can have harmful consequences for
    the company both financially and organizationally and can tarnish its brand name.
    In view of these facts, several parameters should be monitored, such as output,
    link function, cabling problems and the state of the different services in place.


    To do this, rigorous follow-up and monitoring of the different components of these
    infrastructures is necessary to ensure that they are functioning properly and
    in order to intervene in the event of problems, and even to be proactive and anticipate
    malfunctions. This is the end goal of monitoring.


    Network and service monitoring involves methods and tools that make it possible
    to observe everything that happens in the network and to manage its components
    in the event of problems, locally or remotely, in order to restore functionality.
    These methods include detecting breakdowns, modifying equipment parameters, measuring
    resource consumption, improving performance and identifying malicious activity.


    ## 9.2. Main concepts of network and service supervision


    ### 9.2.1. Definition


    Monitoring a network infrastructure is a matter of better understanding its condition
    and degree of performance, verifying its proper dimensioning and the absence of
    overloaded links or equipment and detecting possible breakdowns. We generally
    monitor:


    – active equipment such as routers, switches and wireless access points;

    – authentication and storage servers, directories, web servers, VoIP solutions
    and corresponding services;

    – client workstations and IT equipment in general such as laptop computers, smartphones,
    telephone stations and printers;

    – operating systems, by measuring the use of random access memory, for example;

    – applications, by monitoring the availability of application ports and processes.


    ### 9.2.2. Challenges of monitoring


    Monitoring ensures the highest possible availability rate via the monitoring of
    infrastructure components, and more specifically its hotspots, in order to react
    quickly and appropriately to a possible breakdown. Unavailability of an IT system
    can cause enormous losses for the business and tarnish its image. Monitoring also
    enables us to prevent possible breakdowns through the rapid analysis and reporting
    of information in a proactive approach.


    Monitoring consists of overseeing, viewing, analyzing, acting and alerting. The
    goal is to reduce IT-related incidents and problems to a minimum. Data collected
    can be aggregated into a dashboard that can aid in decision-making.


    ![Figure 9.1. Functionalities of a monitoring system](images/fig9_1.jpg)


    **Figure 9.1.** Functionalities of a monitoring system


    ### 9.2.3. Typology


    Monitoring is a process that affects various levels of an IT infrastructure: interconnections
    (network), machines (system) and services offered (applications):


    – network monitoring: the hardware concerned generally consists of switches, routers,
    servers (availability, probe querying, alerts), inverters, printers;

    – system monitoring: involves three main system resources: processor, memory and
    storage;

    – application monitoring: this type of monitoring tests applications hosted by
    servers to determine their availability, or the state of the services offered.


    Methods of monitoring include:


    – *ad hoc* methods such as `ping`, `traceroute`, `netstat` and `telnet`;

    – methods based on network management protocols such as the Common Information
    Management Protocol (`CMIP`), which is an OSI protocol but is rarely used, and
    the Simple Network Management Protocol (`SNMP`), which is easy to implement and
    widely used;

    – methods based on log file analysis;

    – methods using local or remote commands and scripts.


    Monitoring methods may also be classified according to whether they are active
    or passive:


    – active methods are based on the sending of query and measurement requests by
    the monitoring platform. These are the methods most often used and are known for
    their reliability and the regularity of checks;


    ![Figure 9.2. Active monitoring](images/fig9_2.jpg)


    **Figure 9.2.** Active monitoring


    – passive methods are characterized by a one-way exchange, that is, the sending
    of alerts by monitored resources. These methods consume fewer of the monitoring
    server''s resources. They are also useful when monitored resources are difficult
    to access (proprietary hardware). However, they are not very reliable, as there
    is nothing to guarantee that information about the state of the resources is up
    to date. These methods are therefore generally used in conjunction with active
    methods.


    ![Figure 9.3. Passive monitoring](images/fig9_3.jpg)


    **Figure 9.3.** Passive monitoring


    ## 9.3. Monitoring protocols


    ### 9.3.1. SNMP protocol (Simple Network Management Protocol)


    This protocol is currently the most widely used network management protocol. It
    is used by most of the monitoring applications currently on the market.


    This protocol functions using client/server mode, which allows an administrator
    to retrieve information collected by network equipment only by making a request
    for it, or when an alert has been issued.


    The SNMP system is made up of several elements:


    – the monitoring or manager station, which carries out checking operations on
    the various components of IT equipment being monitored. This central station allows
    the administrator to monitor in real time the whole infrastructure, diagnose problems
    and react to resolve them.

