    \ is difficult to control and non-scalable;\n\n– AutoQoS: this is a simple mechanism\
    \ that ensures consistent policy application to all equipment;\n\n– QoS Policy\
    \ Manager (QPM): this mechanism implements QoS on the scale of an Internet access\
    \ provider, for example;\n\n– MQC Modular QoS CLI (Command Line Interface): this\
    \ is based on modularity, and indeed QoS is constructed in blocks or modules.\n\
    \n#### 8.2.6.4. *Applications*\n\n##### Application 1:QoS configuration for routers\n\
    \nBy default, routers with no QoS mechanisms process all packets in the same way,\
