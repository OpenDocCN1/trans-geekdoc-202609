    每个属性都有定义的名称，并可以包含一个或多个值。属性名称包括 `DC`（域组件）、`CN`（通用名称）、`OU`（组织单元）和 `SN`（姓）。


    每个对象都有一个与其层级结构唯一的 RDN（相对区分名称）。一个对象从其 LDAP 父对象的 RDN 直到 DIT（目录信息树）根节点的 RDN 组成的 RDN
    称为 `DN`（区分名称）。每个 `DN` 在 DIT 中都是唯一的，用于在对象树中查找指定对象。


    示例.– DN：`cn = Salah BACHA, or = Tunis, or: employees, dc = enterpriseX, dc:com`
    由 5 个 RDN 组成。


    LDAP 目录中的对象可以使用 `LDIF`（LDAP 数据交换格式）以 ASCII 文本的形式查询和显示。`LDIF` 还定义了与目录修改相关的语法。


    LDAP 目录必须防止各种威胁。需要部署的安全机制涉及：


    - 身份验证：LDAP 提供多个级别的身份验证：匿名认证（仅允许读取数据），以及基于密钥或基于证书的 SSL 认证；

    - 通过设置访问规则或 `ACLs`（访问控制列表）管理访问权限，定义了用户对目录对象的访问权限；

    - 网络安全：这是定义并实现安全机制，以确保 LDAP 服务的访问以及交换信息的安全性。使用 `SSL` 和 `TLS` 协议加密事务。


    ## 5.5. 电子邮件服务


    ### 5.5.1. 引言


    该服务允许用户通过 IT 网络访问的电子邮件服务器交换消息。要理解电子邮件服务如何工作，我们必须首先了解几个关键词：


    - `MUA`（邮件用户代理）是作为网络服务接口的电子邮件客户端；它是一个邮件撰写程序，例如 Mozilla Thunderbird。一旦编写好邮件，将使用一种协议将其路由到邮局，最初通过
    `MSA`（邮件提交代理），它作为电子邮件客户端和电子邮件服务器之间的中间件。实现的协议称为 `SMTP`；

    - `MTA`（邮件传输代理）是邮件传输代理。它根据收件人电子邮件地址中包含的域名决定由哪个服务器负责邮件。它通常是你的互联网提供商的电子邮件服务器；

    - `MDA`（邮件投递代理）被视为邮箱，电子邮件存储在此等待收件人提取；

    - `MAA`（邮件访问代理）是允许 `MUA` 访问邮箱的代理。


    ### 5.5.2. 架构与工作原理


    该过程涉及八个阶段（见图 5.11）。


    阶段 1：用户使用其电子邮件客户端（`MUA`）发布消息。

    阶段 2：消息传输到发送者的 `MTA`。

    阶段 3：使用 `SMTP` 协议（简单邮件传输协议）将消息传输到收件人的服务器。

    阶段 4：服务器将消息传输给 `MDA`。

    阶段 5：`MDA` 将电子邮件存储在收件人的邮箱中。

    阶段 6：`MAA` 使用 `POP`（邮局协议）或 `IMAP`（交互式消息访问协议）检索协议从邮箱提取消息。

    阶段 7：消息通过 `POP` 或 `IMAP` 协议传输到电子邮件客户端。它们存储在收件人的邮箱中。

    阶段 8：收件人使用其电子邮件客户端（`MUA`）检查消息。


    ![图 5.11. 电子邮件架构](img/fig5_11.jpg)


    **图 5.11.** 电子邮件架构


    ### 5.5.3. 涉及的协议


    - `SMTP`（简单邮件传输协议）负责 `MUA` 和最终 `MTA` 之间的传输。`MDA` 和最终 `MUA` 之间使用接收协议 `POP` 或 `IMAP`。

    - `POP`（邮局协议）：其主要功能是处理接收到的电子邮件并分发给相应的收件人，但它不能发送邮件。`POP` 是一种仅用于从电子邮件服务器上提取电子邮件的协议。客户端随后将其邮箱中的所有新消息复制到计算机的硬盘上并可以离线读取。

    - `IMAP`（互联网消息访问协议）是一种邮件读取协议。与 `POP` 不同，它设计并非用于接收和复制消息，而是直接从 Web 服务器上读取它们。`IMAP`
    可以通过登录和密码进行身份验证，直接在远程服务器上管理消息。


    总结来说，电子邮件服务器使用 `SMTP` 协议进行传输和接收。电子邮件客户端使用 `SMTP` 传输并使用另一种协议（`POP` 或 `IMAP`）进行接收。


    ## 5.6. Web 服务器


    ### 5.6.1. 引言


    Web 服务器用于记录信息并确保用户可以访问。只需要一个 Web 地址即可检索由 Web 服务器发送的 Web 内容。`HTTP` 或 `HTTPS` 通信协议管理
    Web 服务器与客户端之间的传输。它们基于 `IP` 和 `TCP` 协议。Web 服务器必须始终连接到 Internet 并托管许多不同客户端浏览器可以的站点。


    ### 5.6.2. 工作原理


    为了显示网页，客户端使用浏览器（例如 Firefox）向服务器发送 `HTTP` 请求，服务器对其进行解码并将 HTTP 响应发回浏览器。最常见的 HTTP
    服务器有：


    - Apache 服务器：最常用的 Web 服务器；兼容所有操作系统；

    - Microsoft Information Services（`IIS`）：仅用于 Windows 系统。尽管如此，其安装过程相对复杂；

    - `Nginx`（由 Igor Sysoev 创建）：提供比普通 Web 服务器更多的功能。其流行程度正在增加；

    - `Litespeed`：数据传输速度。


    ### 5.6.3. 虚拟主机原理


    虚拟主机（或多主机托管）是在单台服务器上托管多个网站的行为。一台机器（虚拟上）拥有一服务器托管无限数量的站点，这些站点无需感知彼此。通常来说，多主机托管有两种主要方法：


    - 基于地址的虚拟主机：服务器机器拥有多个 `IP 地址`，每个地址都指向一个独立的站点。它可以拥有一个或多个 `IP 地址`，或者在这种情况下使用单个 `IP
    地址`，并通过 TCP 端口来区分站点；

    - 基于名称的虚拟主机：服务器机器只有一个 `IP 地址`，通过站点名称引导请求；

    - 两种方法的结合使用（同时通过 IP 地址和名称）也是可能的。


    ![图 5.12. 虚拟 Web 服务器](img/fig5_12.jpg)


    图 5.12. 虚拟 Web 服务器


    #### 5.6.3.1. 基于网络地址（IP/TCP 端口）的虚拟主机


    网络托管包括在服务器机器上可用 TCP 端口和/或多个 `IP 地址`（物理或虚拟）。


    Linux 命令 `ifconfig` 用于配置网络接口。对于多个地址，必须为 Apache 指定（例如）应该在哪些地址以及哪些 TCP 端口上监听，使用
    `Listen` 指令。


    ![图 5.13. 基于 IP 地址和端口的虚拟主机（Apache）](img/fig5_13.jpg)


    图 5.13. 基于 IP 地址和端口的虚拟主机（Apache）


    #### 5.6.3.2. 基于名称的虚拟主机


    我们有一个 `IP 地址` 和一个端口：`192.168.0.1:80`。DNS 服务器已配置将此 IP 地址链接到两个不同的域名，`server1` 和
    `server2`。


    ![图 5.14. 基于名称的虚拟主机](img/fig5_14.jpg)


    图 5.14. 基于名称的虚拟主机


    #### 5.6.3.3. 基于名称和 IP 的虚拟主机


