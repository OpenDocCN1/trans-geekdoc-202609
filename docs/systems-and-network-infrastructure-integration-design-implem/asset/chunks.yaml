  trans: '

    GNS3 (图形化网络模拟器-3) 是一种免费使用、开源且可靠的图形化网络仿真器。它还可以用于测试所有类型的设备，而不仅仅是特定厂商的。因此，它可以用于测试
    CISCO、Juniper、SOPHOS、Citrix 等许多设备。它还支持多平台，可以安装在 Windows、Linux 和 Mac 操作系统上。它使用一个开源程序框架，每个程序都可以模拟特定的平台以运行对应供应商的软件程序。它被用于测试未来将部署在真实设备上的配置。


    GNS3 是一种网络仿真工具，类似于 Cisco 的工具 PacketTracer，后者用于模拟基于 Cisco 设备的网络设施，并配置设备以尽可能地还原真实的设施。GNS3
    通过其向模拟的路由器中导入真实的 Cisco（或其他）IOS 的能力，以及在我们的虚拟网络中包含用 VirtualBox 或虚拟化软件创建的真实虚拟主机的能力，能够更真实地模拟网络。因此，通过
    GNS3，我们可以将真实与虚拟连接起来。


    它包含以下组件：


    - Dynamips：模拟 Cisco（或其他）路由器和交换机，并提供相应的环境或 IOS；

    - Dynagen：代表 Dynamips 控制和管理软件层；

    - Qemu：一种允许 GNS3 执行 Cisco ASA、PIX 的仿真器；

    - VirtualBox 或 VMware：用于创建和运行与 Windows 和 Linux 操作系统链接的虚拟机。


    GNS3 基于三个概念：模拟（simulation）、仿真（emulation）和虚拟化（virtualization）。由于我们已经讨论了模拟的概念，现在我们将介绍另外两个概念。


    仿真不允许建模，而是实际上相同地复制软件程序及其硬件架构的行为。虚拟化使用主系统的架构，而仿真则复制其软件，这使得虚拟化运行更高效。


    ### GNS3 的功能


    - 模拟通过以太网线连接的两个接口的行为。

    - 仿真路由器、交换机或其他计算机或服务器。相应的组件使用真实软件运行。因此，每个虚拟路由器都需要一个真实的 IOS 镜像。高性能路由器的数千行代码将按照它们在真实世界中的方式完全执行，从而产生与生产环境中相同的行为。

    - GNS3 可以通过 Wireshark 捕获两个虚拟路由器之间的流量。

    - 可以通过 VirtualBox 或虚拟化解决方案集成虚拟化的 Windows 和 Linux 操作系统。

    - GNS3 在模拟网络与真实物理网络之间建立链接，使得虚拟和物理组件共同工作。


    ### 局限性


    GNS3 仅适用于特定类型的路由器。IOS 必须与这些类型的路由器兼容。IOS 镜像不能用于为模拟的 3,725 平台上的 2,800 路由器。此外，GNS3
    目前不支持交换机平台。可以集成通用交换机来模拟基本的交换功能。


