    see `www.iste.co.uk/systems.zip`


    ### 7.3.4. Types of cloud


    Two criteria are used to categorize types of cloud:


    - Criterion one: who manages the cloud, the company?

    - if the company manages the cloud, it is private cloud;

    - if the cloud provider manages the cloud, it is public cloud.


    - Criterion two: who benefits from the service?

    - if the cloud is dedicated to the company, it is private cloud;

    - if the cloud is open to public, it is public cloud.


    Four typologies have been established:


    - internal cloud: the company sets up its own infrastructure;

    - external cloud: cloud provider offers services;

    - community cloud: a particular type of cloud shared among companies;

    - hybrid cloud: combination of private cloud and public cloud.


    ### 7.3.5. Areas of application


    Cloud computing is used today by both companies and private individuals. It is
