    - **Design phase**: the idea is to design a product while taking into account
    its environmental impacts throughout its lifecycle. Stresses linked to environmental
    impacts must be included in the design from the beginning. However, understanding
    of the product (structure, properties and performance) is limited, especially
    in the early part of the design phase; therefore, modeling of its lifecycle is
    carried out using a simplified LCA that consists of predicting the impact of a
    product in development based on its similarity to previous generations. Environmental
    stresses should be taken into account in the preliminary stages of the design
    phase.


    - **Production phase**: ICT production generally requires a significant quantity
    of toxic materials, such as lead and mercury, as well as rare, non-renewable,
    expensive materials, such as copper, gold and silver. For example, 22% of the
    mercury produced worldwide each year is used in the manufacture of electrical
    and electronic products. This phase is the one during which small ICTs (PCs, telephones,
    etc.) consume the largest portion of the energy consumed during their lifecycle.


    - **Utilization phase**: the utilization of a digital infrastructure consumes
    energy. `4G` and `5G` networks consume the largest portion of energy during this
    phase. For example, computers consume energy only during their use; web servers
    require non-stop energy consumption. Thus, for servers, efforts must be concentrated
    on the utilization phase, which is not the responsibility of the manufacturers
    of digital networks, but rather of the service providers and their clients.


    - **End-of-life phase**: recycling constitutes a key point, as it is beneficial
    for the environment insofar as it enables the recovery of mineral resources. ICTs
    contain toxic materials that continue to generate a major social and environmental
    debate.


    ## 3.6. Mechanisms and technical solutions for the implementation of a Green IT
    infrastructure


    More and more projects using a Green IT approach are being implemented, that is,
    projects whose objective or effect is to reduce the footprint of a product or
    service in economic, ecological and social terms. This reduction is achieved thanks
    to digital technologies. There are several themes at play: intelligent electrical
    networks (`smart-grids`), intelligent transportation and transport, environmental
    and urban monitoring, virtualization, telework and teleconferencing, intelligent
    buildings, and eco-friendly software design.


    Examples of improvement areas and solutions to make an IT system more eco-friendly
    that have been put forward include:


    - the use of specific software programs that automate the functions of monitoring
    and shutdown of machines when they are not in use. This approach avoids waste
    linked to user activity;


    - the virtualization of servers, which enables a better utilization rate of hardware
    platforms, and consequently a reduction in the number of servers. It also enables
    a reduction in the fleet of workstations by deploying light client-oriented architectures
    that consume 10 times less energy than a workstation;


    - the optimization of climate control of operating centers and the implementation
    of high-performance cooling solutions;


    - the use of heat emanations: some centers collect heat from central units and
    use it to heat their premises;


    - the increased externalization of work and telework;


    - the adoption of a data center design that is efficient in terms of energy consumption,
    cooling, server configuration, consolidation, cabling/wiring, redundancy, etc.;


    - the measurement of the efficiency of existing data centers using current measurements
    such as power usage effectiveness (`PUE`), which measures energy efficiency. The
    monitoring of progress made with business intelligence tools is possible;


    - datacenters and cloud computing enable the purchase of fewer new servers and
    the optimization of existing infrastructures. However, they consume large amounts
    of energy, especially for businesses with large infrastructures. One solution
    consists of optimizing energy efficiency or `PUE`. The latter is determined by
    dividing the data center''s total electrical energy consumption by the quantity
    of energy actually used by the servers. For example, `Google` has achieved an
    average `PUE` of `1.2` by using high-performance cooling technologies;


    - increasing users'' awareness so that they will turn off their computers, print
    only when necessary and choose video conferencing over physical travel;


    - the definition of a responsible purchasing policy for the acquisition of equipment
    adapted to needs, preferably reconditioned or, if this is not possible, new but
    designed to be eco-friendly and `EPEAT`, `RoHS` and/or `ENERGY STAR` certified.
    It is preferable to opt for equipment that can be repaired to maximize its lifecycle.
    In the case of a software purchase, this should be eco-developed and should have
    an operative lifespan designed to fit a given technological configuration;


    - the controlling of data transport and storage by targeting e-mail recipients,
    cleanup of bulk e-mail lists, avoiding attachments or compressing them to limit
    their size, cleanup of archives, etc.


    In addition, numerous and wide-ranging assessment indicators should be defined
    for the environmental footprint of business IT. As we can see, the possibilities
    that exist with regard to IT ecology are numerous and sometimes conflict with
    one another. On the one hand, maximizing the lifecycle of computers avoids the
    consequences of disposing them, and, on the other hand, a new PC consumes less
    energy. The quest to attain a relatively fragile state of ecological equilibrium
    is an ongoing one.


    ## 3.7. Green IT labels and standards


    - **BLUE ANGEL**: created in Germany in 1978, this independent eco-label is based
    on the criteria of recyclability and the reduction of pollution and energy consumption
    of computers, printers (especially those that consume toner) and mobile telephones.


    - **EPEAT** (Electronic Product Environmental Assessment Tool): created in the
    United States in 1992, this independent eco-label takes into account the environmental
    effect throughout their lifecycles of computers, tablets, mobile telephones, printers
    and servers. It is based on 23 mandatory criteria and 28 discretionary criteria
    covering the entirety of a lifecycle. It is awarded in three forms: `EPEAT bronze`
    for compliance with the 23 mandatory criteria alone, `EPEAT silver` for compliance
    with all the mandatory criteria and at least 50% of the discretionary criteria,
    and `EPEAT gold` for meeting all the mandatory criteria and at least 75% of the
    discretionary criteria.


    - **RoHS** (Restriction of Hazardous Substances in Electrical and Electronic Equipment):
    this is a European directive aimed at limiting the use of certain dangerous substances
    in electrical and electronic equipment, such as lead, mercury, cadmium and hexavalent
    chromium.


    - **TCO**: created in Sweden in 1990, this independent eco-label uses the following
    criteria for computers, screens, printers and mobile telephones: ergonomics, electromagnetic
    emissions, energy consumption, manufacturer `ISO 14001` certification, low noise,
    compliance with `RoHS` norms and recyclability of materials.


    - **IEEE 1680**: this refers to an `IEEE` norm for environmental performance criteria
    for office computers, laptop computers and monitors.


    - **ISO 14000-1**: this concerns environmental management intended to improve
    environmental performance while maintaining productivity.


    - **ENERGY STAR**: an American label applicable to PCs, printers, photocopiers,
    fax machines, scanners, modems, etc., which possesses an automatic sleep or standby
    function characterized by reduced operating power.


    ## 3.8. Some examples of Eco-ICTs

