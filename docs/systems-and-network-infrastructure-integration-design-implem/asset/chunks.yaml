    -   根据负载动态分配容量，以便更好地管理流量高峰并共享资源。


    ### 7.3.3. 架构模型


    云计算通常分为三种主要的服务模型，它们根据公司 IT 系统所采用的外包程度而不同。这三个模型展示了三个层级的虚拟化，也可以被视为交付模型。


    云概念的目标是在客户端和服务提供商之间建立一种服务，同时确保该服务的连续性和质量。为了实现这一目标，已经开发了涉及所有级别的方法，包括：


    -   客户端使用的应用程序；

    -   平台，或执行应用程序的环境；

    -   基础设施，构成了平台支持的基础设施。


    #### 7.3.3.1. IaaS（基础设施即服务）


    托管涉及由服务器、网络资源、存储解决方案等组成的虚拟基础设施。它等于真实的基础设施，并由云供应商提供。客户端根据需求购买资源。因此，客户公司的整个基础设施部分都被外包了。该模型是后续两个模型的基础，`Amazon
    EC2` 和 `Google Cloud Storage` 就是该模型的示例。


    #### 7.3.3.2. PaaS（平台即服务）


    云供应商提供整个开发平台，用于托管公司的应用程序，以及可以通过浏览器访问的管理和测试环境，无需使用其他软件程序。其外包程度高于 IaaS 模型。该模型与应用程序开发人员更为相关，因为它为他们提供了定制的开发框架。它也作为
    SaaS 的基础的基础。PaaS 的示例是 `Google App Engine`。


    #### 7.3.3.3. SaaS（软件即服务）


    业务应用程序被转移到云提供商，这意味着所有必要的软件程序在任何预先安装或更新的情况下即可运行，且不需要客户端进行维护。该模型提供了最高程度的外包，主要基于托管应用程序的标准化原则。SaaS
    平台基于 `SOA`（面向服务的架构）；示例包括 `Gmail` 和 `Office 365`。


    ![图 7.6. 云服务模型](img/fig7_6.jpg)


    **图 7.6.** 云服务模型


    云是一种为服务器或网络基础设施、开发或执行平台、应用程序等提供虚拟放置空间的解决方案。云支持服务模型的不同层，从基础设施到终端客户端。


    ![图 7.7. 云计算服务交付模型的责任分配。如需彩色版本，请查看 seww.iste.co.uk/helali/systems.zip](img/fig7_7.jpg)


    **图 7.7.** 云计算服务交付模型的责任分配。如需彩色版本，查看[www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)


    为了进一步解释云服务模型，通常使用一种名为“Pizza 即服务”的类比作为直观的视觉说明。


    ![图 7.8. Pizza 即服务类比。如需彩色版本，请查看 www.iste.co.uk/systems.zip](img/fig7_8.jpg)


    **图 7.8.** Pizza 即服务类比。如需彩色版本，查看 `www.iste.co.uk/systems.zip`


    ### 7.3.4. 云的类型


    使用两个标准来分类云类型：


    -   标准一：谁来管理云，公司？

    -   如果由公司管理云，则是私有云；

    -   如果由云供应商管理云，则是公有云。


    -   标准二：谁从服务中受益？

    -   如果云专供公司使用，则是私有云；

    -   如果云向公众开放，则是公有云。


    已经建立了四种类型：


    -   内部云：公司建立自己的基础设施；

    -   外部云：云供应商提供服务；

    -   社区云：在公司之间共享的特定类型的云；

    -   混合云：私有云和公有云的结合。


    ### 7.3.5. 应用领域


    云计算已成为公司和个人共同使用。这是一项已迅速普及的技术。目前有多种用途正在蓬勃发展：


    -   WEB2.0 应用：电子邮件、网络会议、协作工作、`CRM`（客户关系管理）、开发和测试环境；

    -   智能应用；

    -   仿真；

    -   网格计算；

    -   家庭自动化；

    -   视听媒体；

    -   汽车工业；

    -   机器和过程的工业控制。


    许多许多制造商和出版商已参与云计算领域并成为云供应商，例如 `Sun`、`HP`、`IBM`、`Oracle`、`SAP`、`Google`、`Yahoo`
    和 `Amazon`。


