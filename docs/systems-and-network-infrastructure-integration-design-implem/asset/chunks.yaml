- raw: "[Chapter 5](#c05.xhtml) The design of these infrastructures is a vital stage\
    \ in the process of their implementation, which is discussed in [Chapter 5](#c05.xhtml).\n\
    \n[Chapter 6](#c06.xhtml) is dedicated to the theme of security. Any infrastructure\
    \ integration project must be sure to implement certain security mechanisms depending\
    \ on the needs of the client company.\n\n[Chapter 7](#c07.xhtml) focuses on virtualization\
    \ and cloud computing, two interdependent paradigms that are omnipresent in every\
    \ network infrastructure today.\n\nConcepts dealing with the quality of service\
