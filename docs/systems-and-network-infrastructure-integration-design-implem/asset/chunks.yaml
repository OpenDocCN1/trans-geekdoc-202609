    \ in use: 2\n\nNumber of aggregators: 2\n\nGroup Port-channel Protocol Ports\n\
    \n\\_ \\_ \\_ \\_ \\_+\\_ \\_ \\_ \\_ \\_ \\_ \\_ \\_+\\_ \\_ \\_ \\_ \\_ \\_\
    \ \\_ \\_ \\_ +\\_ \\_ \\_ \\_ \\_ \\_ \\_ \\_ \\_ \\_ \\_ \\_ \\_ \\_ \n\n1 Po1(SU)\
    \ PAgP Fa0/1(P) Fa0/2(P)\n\n3 Po3(SD) LACP Fa0/3(I) Fa0/4(I)\n\nSwitch2#show etherchannel\
    \ summary\n\nFlags: D - down P - in port-channel\n\nI - stand-alone s - suspended\n\
    \nH - Hot-standby (LACP only)\n\nR - Layer3 S - Layer2\n\nU - in use f - failed\
    \ to allocate aggregator\n\nu - unsuitable for bundling\n\nw - waiting to be aggregated\n\
    \nd - default port\n\nNumber of channel-groups in use: 2\n\nNumber of aggregators:\
    \ 2\n\nGroup Port-channel Protocol Ports\n\n\\_ \\_ \\_ \\_ \\_+\\_ \\_ \\_ \\\
    _ \\_ \\_ \\_ \\_+\\_ \\_ \\_ \\_ \\_ \\_ \\_ \\_ \\_ +\\_ \\_ \\_ \\_ \\_ \\\
    _ \\_ \\_ \\_ \\_ \\_ \\_ \\_ \\_ \n\n2 Po2(SU) LACP Fa0/1(P) Fa0/2(P)\n\n3 Po3(SD)\
    \ LACP Fa0/3(I) Fa0/4(I)\n\n### 8.3.3. *Redundancy in the network layer*\n\nTo\
    \ ensure high availability, individual failure points must be eliminated. Thus,\
    \ a network gateway must be split at least once to prevent a gateway malfunction\
    \ from making it impossible to communicate with the whole network.\n\n#### 8.3.3.1.\
    \ *HSRP (Hot Standby Router Protocol)*\n\nThis is a proprietary Cisco protocol\
    \ that offers higher availability of the network gateway. A group of routers composed\
    \ of at least two routers is the foundation stone of this protocol and is identified\
    \ by a number ranging from 0 to 255.\n\nHowever, a single virtual IP address is\
    \ assigned to all routers belonging to the group, but each one has its own priority.\
    \ The election process chooses the router with the highest priority or the highest\
    \ IP address as the active router. The remaining routers are now in passive or\
    \ standby mode, in which they do not transmit traffic but are listening to the\
    \ active router to make sure it is still operational.\n\nThis is done by means\
    \ of the heartbeat mechanism, in which the active router sends hello messages\
    \ every three seconds. If the other routers do not receive a hello message for\
    \ 10 seconds, they initiate the process to reelect a new active router with the\
    \ highest priority. This reelection process is transparent for users, who always\
    \ have to communicate with a virtual router with the same IP address and the same\
    \ associated MAC address, specifically 00:00:0C:07:AC:XX, in which the octet XX\
    \ designates the HSRP group number.\n\nThis protocol can be configured at a router\
    \ or a level 3 switch.\n\n#### 8.3.3.2. *VRRP (Virtual Router Redundancy Protocol)*\n\
    \nThis protocol is very similar to the HSRP protocol and is in fact the standardized\
    \ version of it. It is thus non-proprietary and compatible with other manufacturers.\
    \ It uses a virtualization process to improve the default gateway availability\
    \ of a local network.\n\nA group of VRRP routers is composed of at least two routers,\
    \ a master router and a backup router that share an IP address as a default gateway\
    \ for members of the network. The associated MAC address is 00:00:5E:00:01:XX,\
    \ where XX designates the VRID and varies from 0x01 to 0xFF. This VRID characterizes\
    \ a group of VRRP routers and is the unique identifier of this group. The preemption\
    \ parameter (preemp) enables the original master to take back the service of its\
    \ replacement; in the event that it becomes functional again, it is activated\
    \ by default. Hello messages are sent every 1 second. If, after 3 seconds, the\
    \ backup routers have not received anything, they proceed with the election of\
    \ a new master router.\n\n#### 8.3.3.3. *GLBP (Gateway Load Balancing Protocol)*\n\
    \nThere is also a proprietary Cisco level 3 redundancy protocol based on the same\
    \ basic principles as the HSRP and VRRP protocols described above. It also offers\
    \ load balancing, which is fairly simple to configure."
