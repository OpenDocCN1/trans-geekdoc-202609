- raw: 'Each attribute has a defined name and can contain one or more values. Attribute
    names include “DC ” (Domain Component), “CN ” (common name), “OU ” (organization
    unit) and “SN ” (surname).


    Each object has an RDN (Relative Distinguished Name) unique to its level of hierarchy.
    The RDN composition of an object with the RDNs of its LDAP parent objects down
    to the root of the DIT is called the DN (Distinguished Name). Each DN is unique
    in the DIT and can be used to find a specified object in the object tree.


    EXAMPLE.– DN: cn = Salah BACHA, or = Tunis, or: employees, dc = enterpriseX, dc:com
    is composed of 5 RDNs.


    The objects in an LDAP directory can be queried and displayed in the form of an
    ASCII text using LDIF (LDAP Data Interchange Format). LDIF also defines a syntax
    pertaining to modifications in the directory.


    The LDAP directory must be protected against various threats. The security mechanisms
    to be deployed have to do with:


    – authentication: LDAP provides multiple levels of authentication: anonymous authentication,
    which allows accessible data only to be read, and key-based or certificate-based
    authentication with SSL;


    – management of access rights by setting access rules or ACLs (Access Control
    Lists), which define user access rights to directory objects;


    – network security: this is the definition and implementation of security mechanisms
    in order to make secure both access to the LDAP service and the information exchanged.
    SSL and TLS protocols are used to encrypt transactions.


    ## 5.5. E-mail service


    ### 5.5.1. *Introduction*


    This service enables users to exchange messages via an e-mail server accessible
    via an IT network. To understand how an e-mail service works, we must first know
    a few keywords:


    – MUA (Mail User Agent) is the e-mail client which acts as an interface with network
    services; it is an e-mail writing application such as Mozilla Thunderbird. Once
    the message is composed, a protocol is used to route it to the post office, initially
    via the MSA (Mail Submission Agent) which acts as an intermediary between the
    e-mail client and the e-mail server. The protocol implemented is called SMTP;


    – MTA (Mail Transfer Agent) is the e-mail transmission agent. It determines which
    server will take charge of the e-mail, according to the domain name contained
    in the e-mail address of the recipient. It is generally the e-mail server of your
    Internet access provider;


    – MDA (Mail Delivery Agent) is considered like a mailbox where e-mails are stored
    while waiting for their recipient to retrieve them;


    – MAA (Mail Access Agent) is the agent that enables the MUA to access an e-mail
    inbox.


    ### 5.5.2. *Architecture and operating principle*


    The process involves eight stages (see [Figure 5.11](#c05.xhtml#figure11)).


    Stage 1: user publishes a message using his/her e-mail client (MUA).


    Stage 2: message is transmitted to the sender''s MTA.


    Stage 3: message is transmitted to the recipient''s e-mail server using the SMTP
    protocol (Simple Mail Transfer Protocol).


    Stage 4: the server transmits the message to the MDA.


    Stage 5: the MDA stores the e-mail in the recipient''s e-mail inbox.


    Stage 6: messages are retrieved from the e-mail inbox by the MAA with the POP
    (Post Office Protocol) or IMAP (Interactive Message Access Protocol) retrieval
    protocols.


    Stage 7: messages are transmitted to the e-mail client via the POP or IMAP protocols.
    They are stored in the recipient''s e-mail box.


    Stage 8: the recipient checks his/her messages using his/her e-mail client (MUA).


    ![Figure 5.11. E-mail architecture](images/fig5_11.jpg)


    **[Figure 5.11.](#c05.xhtml#figureanchor11)** *E-mail architecture*


    ### 5.5.3. *Protocols involved*


    – SMTP (Simple Mail Transfer Protocol) is responsible for transmission between
    an MUA and the final MTA. A receipt protocol, POP or IMAP, is used between the
    MDA and the final MUA.


    – POP **(**Post Office Protocol): its main function is to process e-mails received
    and distribute them to their respective recipients, but it cannot send them. POP
    is a protocol used solely to withdraw an e-mail stored on an e-mail server. The
    client then copies all new messages present in its mailbox to the hard disk of
    its computer and can read them offline.


    – IMAP (Internet Message Access Protocol) is an e-mail reading protocol. Unlike
    POP, it is not designed to receive and copy messages, but to read them directly
    from a web-based server. IMAP can manage its message directly on a remote server
    via authentication using a login and password.


    To sum up, e-mail servers use the SMTP protocol for transmission and receipt.
    E-mail clients use SMTP to transmit and another protocol (POP or IMAP) for receipt.


    ## 5.6. Web server


    ### 5.6.1. *Introduction*


    Web servers are used to record information and ensure that users can access it.
    All that is needed is a web address to retrieve an item of web content sent by
    a web server. HTTP or HTTPS communication protocols manage transmission between
    the web server and the client. They are based on IP and TCP protocols. A web server
    must always be connected to the Internet and hosts sites accessible by numerous
    different client browsers.


    ### 5.6.2. *Operating principle*


    In order to display a webpage, the client uses a browser (e.g. Firefox) to send
    an HTTP request to the server, which decodes it and sends an HTTP response back
    to the browser. This is a request for specific information, such as a webpage,
    for example. The server searches for this information, interprets any results
    and sends the reply.


    The most common HTTP servers are:


    – Apache server: the most used web server; compatible with all operating systems;


    – Microsoft Internet Information Services (IIS): for Windows systems only. Regardless
    of this, it is relatively complex to install;


    – Nginx (created by Igor Sysoev): offers more functions than ordinary web servers.
    It is also higher-performing and its popularity is increasing;


    – Litespeed: data transmission speed.


    ### 5.6.3. *The principle of virtual hosting*


    Virtual hosting, or multi-homing, is the act of hosting multiple websites on a
    single server. A machine possesses a single server (virtually) hosting an infinite
    number of sites that have no need to be aware of one another. Generally speaking,
    there are two major methods of multi-homing:


    –virtual hosting by address: the server machine possesses multiple IP addresses,
    each of which leads to a separate site. It can have one or more IP addresses or,
    as in this case, a single IP address, and can differentiate sites by TCP port;


    – virtual hosting by name: the server machine has only a single IP address and
    site names direct the request;


    – a combination of the two methods (by both IP address and name) is also possible.


    ![Figure 5.12. Virtual web servers](images/fig5_12.jpg)


    **Figure 5.12.** *Virtual web servers*


    #### 5.6.3.1. *Virtual hosting by network address (IP/TCP port)*


    Network hosting consists of having available multiple TCP ports and/or multiple
    IP addresses (physical or virtual) on the server machine.


    The Linux command *ifconfig* is used to configure network interfaces. For multiple
    addresses, it must be specified to Apache, for example, which ones should be listened
    on, and on which TCP ports, using the directive *Listen*.


    ![Figure 5.13. Virtual hosting by IP address and ports (Apache)](images/fig5_13.jpg)


    **Figure 5.13.** *Virtual hosting by IP address and ports (Apache)*


    #### 5.6.3.2. *Virtual hosting by names*


    We have a single IP address and a single port: 192.168.0.1:80. The DNS server
    has been configured to link this IP address to two different domain names, server1
    and server2.


    ![Figure 5.14. Virtual hosting by names](images/fig5_14.jpg)


    **Figure 5.14.** *Virtual hosting by names*


    #### 5.6.3.3. *Virtual hosting by name and by IP*'
