- raw: "– on mode activates the aggregation without using a negotiation protocol;\n\
    \n– desirable mode makes the aggregation request from the switch pair;\n\n– auto\
    \ mode waits for the negotiation and does not send requests, but uses the negotiation\
    \ to form the aggregation.\n\n**Table 8.9.** *PAgP protocol modes*\n\n| **PAgP\
    \ mode** || **ON** || **DESIRABLE** || **AUTO** |\n\n| --- | --- | --- | --- |\n\
    \n| **ON** || ✔ || x || x |\n\n| --- | --- | --- | --- |\n\n| **DESIRABLE** ||\
    \ x || ✔ || ✔ |\n\n| **AUTO** || x || ✔ || x |\n\nThe PAgP protocol, a level 2\
    \ redundancy protocol, is used to set up the EtherChannel technology between switch\
    \ 1 and switch 3. The PAgP configuration between switch 1 and switch 3 is created\
    \ using the following commands:\n\nSwitch1(config) #interface range fa0/1-2\n\n\
    Switch1(config-if-range)# channel-group 1 mode desirable\n\nSwitch1(config-if-range)#no\
    \ shutdown\n\nSwitch3(config)#interface range fa0/1-2\n\nSwitch3(config-if-range)#\
    \ channel-group 1 mode desirable\n\nSwitch3(config-if)#no shutdown\n\nSwitch1(config-if)#interface\
    \ port-channel 1\n\nSwitch1(config-if)#switchport mode trunk\n\nSwitch1(config-if)#switchport\
    \ trunk native vlan 99\n\nSwitch3(config)#int port-channel 1\n\nSwitch3(config-if)#switchport\
    \ mode trunk\n\nSwitch3(config-if)#switchport mode native vlan 99\n\nLACP is a\
    \ standardized protocol developed by the IEEE. It functions like PAgP but supports\
    \ various manufacturers. It has three configuration modes:\n\n– ON mode serves,\
    \ as in the case of PAgP, to activate the aggregation without using a negotiation\
    \ protocol;\n\n– active mode sends a request to the corresponding switch in order\
    \ to create the aggregation;\n\n – passive mode is characterized by a wait for\
    \ the negotiation before switching toward aggregation. The compatibility between\
    \ these different modes is shown in [Table 8.10](#c08.xhtml#table10).\n\n**[Table\
    \ 8.10.](#c08.xhtml#tableanchor10)** *LACP protocol modes*\n\n| **LACP mode**\
    \ || **ON** || **ACTIVE** || **PASSIVE** |\n\n| --- | --- | --- | --- |\n\n| **ON**\
    \ || ✔ || x || x |\n\n| --- | --- | --- | --- |\n\n| **ACTIVE** || x || ✔ || ✔\
    \ |\n\n| **PASSIVE** || x || ✔ || x |\n\nThe LACP protocol is configured between\
    \ switch 1 and switch 2 and then between switch 2 and switch 3.\n\nWe begin by\
    \ configuring LACP between switch 1 and switch 2:\n\nSwitch1(config)#interface\
    \ range fa0/3-4\n\nSwitch1(config-if-range)#switchport mode trunk\n\nSwitch1(config-if-range)#switchport\
    \ trunk native vlan 99\n\nSwitch1(config-if-range)#channel-group 3 mode active\n\
    \nSwitch2(config)#interface range fa0/1-2\n\nSwitch2(config-if-range)#switchport\
    \ mode trunk\n\nSwitch2(config-if-range)#switchport trunk native vlan 99\n\nSwitch2(config-if-range)#channel-group\
    \ 3 mode passive\n\nNext, we configure LACP between switch 2 and switch 3:\n\n\
    Switch2(config)#interface range fa0/3-4\n\nSwitch2(config-if-range)#switchport\
    \ mode trunk\n\nSwitch2(config-if-range)#switchport trunk native vlan 99\n\nSwitch2(config-if-range)#channel-group\
    \ 3 mode active\n\nSwitch3(config)#interface range fa0/3-4\n\nSwitch3(config-if-range)#switchport\
