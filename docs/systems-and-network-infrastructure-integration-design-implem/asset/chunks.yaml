    \ Streaming, multimedia |\n\n| 5 || Interactive video |\n\n| 6 || Voice |\n\n\
    | 7 || Network control reserved |\n\nQoS configuration for routers and switches\
    \ is possible via several mechanisms provided by Cisco, for example:\n\n– through\
