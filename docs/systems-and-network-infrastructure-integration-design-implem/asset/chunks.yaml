  trans: '


    对于需要 IT 系统及其 IT 基础设施高可用性的公司来说，监控的重要性使得主要的软件发行商已进入监控软件领域。这些解决方案代表了真正的监控框架；然而，它们价格昂贵且通常是闭源的。现在我们将介绍两种领先的付费监控软件：`HP
    OpenView` 和 `IBM Tivoli`。


    ### 9.4.1.1 IBM Tivoli Monitoring

    该程序用于监控 IT 系统（系统、网络、应用程序、硬件等）并向监控控制台发送告警（具体为发送到 `Tivoli Enterprise Console`）。


    它是领域的领先产品之一，因为它能够通过快速检测性能问题并查看性能历史和实时性能，实现对关键基础设施组件的主动监控；同时通过单一简单、可定制的工作控制台实现对分布式系统和主机系统的监控与管理合一。


    ### 9.4.1.2 HP-OpenView

    该软件用于管理和监控网络基础设施及服务。其主要优势在于将管理信息集中在单一工作站上。它面向中大型企业，基于部署在主机上的代理程序，用于收集运行状态和服务相关的信息。代理程序检索并将监控信息存储在名为
    `Coda` 的数据库中，然后将这些信息发送到托管监控工具的服务器，并存储在 `SQL server database` 中。


    ### 9.4.2 免费监控解决方案

    除了许多公司无法负担的付费监控解决方案外，还有免费的监控工具。它们提供的功能范围无疑较小，但可以满足大多数中小型企业的需求。


    #### 9.4.2.1 Nagios

    Nagios 被认为是开源监控解决方案的基准。该软件用于监控系统和网络，它在开源世界的声誉以及作为监控程序的明星地位归功于它的模块化设计。


    它基于三个主要组件：`sequencer`（调度器），它是应用程序的核心，负责在被监控的 IT 系统组件上执行监控探测；用于查看被监控组件信息的 Web 界面；以及
    `plugins`（插件）或 `probes`（探测），它们代表由 `sequencer` 启动的简单自主程序或脚本，仅将获取的结果提供给该 `sequencer`。这些
    `plugins` 不会自动安装；必须手动下载并安装。


    **表 9.2.** 插件返回代码


    | 插件返回代码 | 服务状态 | 主机状态 |

    | --- | --- | --- |

    | 0 | OK | UP |

    | --- | --- | --- |

    | 1 | WARNING | UP 或 DOWN/UNREACHABLE |

    | 2 | CRITICAL | DOWN/UNREACHABLE |

    | 3 | UNKNOWN | DOWN/UNREACHABLE |


    自 2009 年 10 月以来，Nagios 提供两个版本：


    - `NagiosCore`：免费且不再进行升级或改进。社区支持是维持该版本存在的唯一因素；

    - `Nagios XI`：付费版本，提供所有最新的升级（监控引擎、图形界面重新设计等）。


    已经推出了许多基于 `Nagios` 源码并与其内部架构模型兼容的产品（使用 `NagiosCore-compatible` 术语）。这些包括 `Centreon`、`Incinga`、`Shinken`
    等。


    #### 9.4.2.2 Centreon

    Centreon 基于 `Nagios` 概念。它提供了一个 Web 应用程序层，通过允许用户从 Web 浏览器全面修改 `Nagios` 配置，而不是手动修改大量文件，极大地简化了配置和管理。提供的界面也更加简洁、可扩展且支持多用户。


    Centreon 使用自己的 `MySQL` 数据库来检索所有 `Nagios` 服务状态和性能数据，以便在其自己的图形界面中进行处理和显示。生成的图形使用
    `RDDTools` 构建，该数据库特别适合图形构建。


    Centreon 已经成为一个从 `Nagios` 剥离出来的完整监控平台，现在依赖于三个组件：


    - `Centreon Web`：查看界面，提供一种有方法论且精确的监控显示；

    - `CentreonEngine`：基于 `Nagios 3` 的高性能数据采集引擎，涵盖了大量的现有操作系统、服务器和基础设施；

    - `Centreon Broker`：取代 `NDOUtils` 的事件管理器（`NDOUtils` 是一个将监控数据存储在 `MySQL` 数据库或平文件的
    `Nagios` 插件）。


    #### 9.4.2.3 Shinken

    Shinken 是 `Nagios` 的修改版本。更准确地说，它是基于 `Python` 对各种角色的解耦对 `Nagios` 核心进行了完全重新设计。


    它的分布式架构与 `Nagios` 的单体架构（单个守护进程）不同，由多个守护进程组成，这些进程协同工作以提供 `Nagios` 特有的仲裁、响应、调度、轮询和接收功能。


    Shinken 的另一个特点是放弃了 C 语言而采用 `Python`，后者是跨平台的（Windows, Linux）。


    #### 9.4.2.4 Zabbix

    Zabbix 是一个免费的 IT 基础设施和系统监控应用程序。它可以用于监控网络设备、服务器、系统、应用程序和软件，提供技术和应用层监控。


    其架构由三个组件组成。第一个是代表 Zabbix 应用程序核心的服务器，它集中数据和所有配置信息，并在发生问题时提醒管理员。第二个组件是 Web ，用于查看存储在数据库中的信息以及配置被监控的对象。第三个组件是
    `Zabbix agents`，它们应可选地安装在每台设备上，并在后台运行并定期与 `Zabbix server` 通信。


    #### 9.4.2.5 FAN (FullyAutomatedNagios)

    这是一个 Linux 发行版，能够快速方便地安装 `Nagios` 社区中的所有工具。它还包含了 `Nagios` 及其插件、`Centreon` 和 `Nagvis`。


    `FAN` 还使得能够快速建立一个完整的监控服务器而无需担心其配置。这只需要下载并安装 ISO 镜像。这种监控解决方案对初学者很有吸引力，但它也有缺点；`Nagios`
    版本实际上是经过补丁过的，这导致在没有新版本 `FAN` 的情况下无法更新 `Nagios`。


    #### 9.4.2.6 EyesOfNetwork (E.O.N.)

    EyesOfNetwork 是一个操作系统以及一组监控应用程序的开源解决方案。它基于 `Nagios` 并在 GNU/Linux `CentOS` 发行版提供了完整的监控解决方案。该开源系统和网络监控解决方案借鉴了
    ITIL 并在技术上实现了其应用。


    下表列了一些用于监控的应用程序。


    **表 9.3.** 免费监控应用程序示例


    | 应用程序 |set |

    | --- | --- |

    | `Nagios` | 用于监控 IT 系统并管理事件问题 |

    | `Thruk` | 多后端监控界面 |

    | `GED` (通用事件调度器) | 实现安全的多站点事件管理 |

    | `Nagiosbp` | 用于管理应用程序关键性 |

    | `Nagvis` | 用于创建自定义的可用性地图 |

    | `Cacti` 和 `Pnp4Nagios` | 用于管理主机性能 |


