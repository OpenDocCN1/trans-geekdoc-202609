    然后该端口将所有帧（无论是否标记）的 `COS` 值定义为 3。因此，之前配置的信任值将被忽略。


    *第四种情况*：一个连接了 PC 和 IP 电话的访问模式（access mode）端口。


    使用以下命令告诉 Cisco IP 电话将来自连接同一端口的 PC 的数据流量标记为预定义的服务类别（`COS`）值。此目的是防止 PC 在其帧上打上 VLAN
    语音标记，从而避免为语音和数据流量分配相同的优先级：


    ```

    Switch(config-if)#switchport priority extend cos [0..7]

    ```


    现在用户可以使用带有具有较高 `COS` 值的 `dot1q` 帧对 PC 数据进行标记。为了避免这种情况并继续为语音流量提供更高的优先级，可以使用以下命令：


    ```

    Switch(config-if)>mlsqos trust device cisco-phone

    ```


    分类之后是标记。在 `COS` 与 `DSCP` 之间以及反向的映射表使用默认值创建并然后激活。例如，以下命令给出了 `COS` 值与（默认）`DSCP`
