    图 4.6. 分层模型。图的彩色版本请参阅 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)


    表 4.4 列出了分层模型中每一层的功能。


    ### 表 4.4. 分层模型各层的功能


    | 接入层 | 分布层 | 网络核心层 |

    | --- | --- | --- |

    | 端口安全 | 高带宽 | 极高带宽 |

    | VLAN 责任 | 千兆/10 千兆 | 千兆/10 千兆 |

    | 以太网供电 (PoE) | 冗余 | 冗余 |

    | 快速以太网/千兆以太网 | 安全策略/访问 | 链路聚合 |

    | 链路聚合 | 访问列表 | 服务质量 (QoS) |

    | 服务质量 (QoS) | 链路聚合 | |

    | | 服务质量 (QoS) | |


    每一层都有其自身的特性和需求，这影响了所安装硬件的选择以及实施的配置和/或解决方案。


    Cisco 分层模型无疑是最复杂的实现，但与根据需要构建且缺乏长期规划的架构相比，从长远来看提供了更高的效率、盈利能力、可扩展性、可用性和成本效益。


    对于小型企业，网络基础设施被分为两个层级：在这种情况下，即接入层和一个由分布层和核心层组成的单层，称为集群网络核心。


    ![图 4.7. 分布层和核心层的聚类。图的彩色版本请参阅 www.iste.co.uk/helali/systems.zip](img/fig4_7.jpg)


    图 4.7. 分布层和核心层的聚类。图的彩色版本请参阅 [www.iste.co.uk/helali/systems.zip](http://www.iste.co.uk/helali/systems.zip)


    分层网络模型基于模块化设计，使得能够以简单、稳健且冗余的方式升级网络。


    这种分层模型具有许多优势：可扩展性、冗余性、性能、安全性以及易于管理和维护。


    #### 4.3.1.2. Cisco 模块设计


    Cisco 建议在不同的“区块”或模块中采用模块化网络设计，以确保架构的可用性、易于升级的能力，以及管理日益复杂的网络基础设施（这些基础设施通常需要连接到位于业务主站之外的专用数据中心）。此外，分机构站点需要与公司内部核心网络的连接，以及希望能够在居家或远程工作的员工的连接需求。


    这些通过核心网络互连的模块包括：


    – 分布模块，由一组接入交换机及其分布交换机组成。这是企业网络设计中最常见的元素和基础组件；


    – 服务模块负责诸如服务，如集中式 LWAPP（轻量接入点协议）控制器、统一通信服务等；


    – 数据中心模块（或服务器池），负责管理对业务运营至关重要的许多数据服务器进行管理和更新。所有潜在参与者——企业的员工、合作伙伴和客户——都依赖于数据中心的数据和资源来建立高效的创建、协作和交互；


    – 企业边缘模块由互联网边缘和广域网 (WAN) 边缘组成。它们负责为公司内部和外部的语音、视频和数据服务提供连接。


    为了进一步追求日益先进和复杂的网络基础设施的模块化，Cisco 还开发了 Cisco 企业架构模型，该模型将企业网络划分为功能区域（也称为模块），同时保留了接入、分布和网络核心层。


    Cisco 企业架构模型的主要组件如下：


    – 企业园区：这是一组以可扩展网络形式互连的结构，通常由子模块组成：结构化接入、结构分布、园区网络核心和数据中心。这些子模块通过分层模块化设计、硬件和软件冗余以及发生故障时网络路径的重新配置，确保了高可用性。它还能优化网络流量并提供高质量的服务和更高的安全性。


    – 企业边缘：提供到企业外部的语音、视频和数据服务的连接。在这一层可以部署安全和 QoS 策略，因为园区网络与外部之间交换的所有数据包通过此处。在此层还可以配置入侵检测系统
    (IDS) 和入侵预防系统 (IPS)。


    – 服务提供商边缘：提供互联网服务、交换电话网络服务和广域网。


    ## 4.4. 需求评估与设备选择


    必须仔细选择网络基础设施设备。为了做到这一点，我们必须理解传输的数据量和类型、涉及的所有用户以及他们的需求（例如将他们分到 VLAN 中），以及所需的服务器，最重要的是它们的用途。与流量相关的需求，如所需的输出、延迟和丢包也必须考虑在内。


    客户端和服务器的连接必须在交换机上进行优化以平衡带宽。因此，交换机的选择至关重要。有不同类型的交换机：


    – 固定端口数量的交换机（固定端口交换机）；


    – 模块化机箱交换机，可以向其添加多端口卡；


    – 可堆叠式交换机，它们通过特殊电缆连接，在成本上处于固定端口交换机和模块化机箱交换机之间的水平。


    选择交换机时还可以使用其他标准，例如端口密度（交换机中的端口数量）、端口输出和链路聚合，这些可以作为增加输出的解决方案。另一个功能可能感兴趣，即 PoE，它通过以太网为
    IP 电话和无线终端供电。


    总之，网络必须进行分层设计。要对用户的角色和用途进行研究，优化服务器位置，并决定安装哪种交换机：固定、模块化或可堆叠。还需要确定端口密度，以及端口输出、链路聚合和用于
    IP 电话和无线终端的 PoE 功能。


    ##### 一些设计规则


    – 原则上，网络应采用分层设计。分层模型是一个参考，但网络应适应每个企业的需求。


    – 分层模型的每一层都涉及不同的配置，特别是接入层，需要管理员执行某些操作（交换机端口状态设置、干道安装等）。


    – 对用户角色和用途进行研究以优化聚类。


    – 选择最优的网络架构，特别是拓扑设计、不同 LAN/VLAN 的 IP 范围以及所需的 LAN/VLAN 数量。


    – 应仔细选择交换机类型：固定、模块化或可堆叠，以及它们的密度、端口输出、链路聚合和 PoE 功能。


    – 每一层应包含一对交换机。


    – 每台交换机应通过链路连接到上层以实现冗余。


    – 每对交换机应通过链路到分布层，但接入层交换机之间不应相互连接。


    – VLAN 不应扩展到分布层之外。


    ## 4.5. 章节总结


