    \ 获取它。\n\n### 修改代码\n\n为确保我们上一章的应用程序能在 Heroku 上运行，我们需要做一些更改。Heroku 为我们提供一个 `PORT`\
    \ 环境变量，并期望我们的 Web 应用程序绑定到它。让我们先导入 \"os\" 包，以便我们可以获取该 `PORT` 环境变量：\n\n```go\nimport\
