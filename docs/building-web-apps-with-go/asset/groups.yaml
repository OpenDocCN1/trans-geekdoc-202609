    \ we are trying to solve. Say we are using the `render` library that we talked\
    \ about in previous chapters:\n\n```\nvar Render = render.New(render.Options{})\n\
    ```\n\nIf we want our `http.Handler`s to be able access our `render.Render` instance,\
    \ we have a couple options.\n\n- 1. Use a global variable: This isn't too bad\
    \ for small programs, but when the program gets larger it quickly becomes a maintenance\
    \ nightmare.\n\n- 2. Pass the variable through a closure to the `http.Handler`:\
    \ This is a great idea, and we should be using it most of the time. The implementation\
    \ ends up looking like this:\n\n```\nfunc MyHandler(r *render.Render) http.Handler\
    \ {\n\treturn http.HandlerFunc(func(rw http.ResponseWriter, r *http.Request) {\n\
    \t\t// now we can access r\n\t})\n}\n```\n\n### Case for Controllers\n\nWhen your\
    \ program grows in size, you will start to notice that many of your `http.Handler`s\
    \ will share the same dependencies and you will have a lot of these closurized\
    \ `http.Handler`s with the same arguments. The way I like to clean this up is\
    \ to write a little base controller implementation that affords me a few wins:\n\
    \n- 1. Allows me to share the dependencies across `http.Handler`s that have similar\
    \ goals or concepts.\n\n- 2. Avoids global variables and functions for easy testing/mocking.\n\
    \n- 3. Gives me a more centralized and Go-like mechanism for handling errors.\n\
    \nThe great part about controllers is that it gives us all these things without\
    \ importing an external package! Most of this functionality comes from clever\
    \ use of the Go feature set, namely Go structs and embedding. Let's take a look\
    \ at the implementation.\n\n```\npackage main\n\nimport \"net/http\"\n\n// Action\
    \ defines a standard function signature for us to use when creating\n// controller\
    \ actions. A controller action is basically just a method attached to\n// a controller.\n\
    type Action func(rw http.ResponseWriter, r *http.Request) error\n\n// This is\
    \ our Base Controller\ntype AppController struct{}\n\n// The action function helps\
    \ with error handling in a controller\nfunc (c *AppController) Action(a Action)\
    \ http.Handler {\n\treturn http.HandlerFunc(func(rw http.ResponseWriter, r *http.Request)\
    \ {\n\t\tif err := a(rw, r); err != nil {\n\t\t\thttp.Error(rw, err.Error(), 500)\n\
    \t\t}\n\t})\n}\n```\n\nThats it! That is all the implementation that we need to\
