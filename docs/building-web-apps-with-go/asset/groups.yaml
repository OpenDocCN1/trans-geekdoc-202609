    - Moving Forward 12\n\n## Introduction\n\nWelcome to **Building Web Apps with\
    \ Go**! If you are reading this then you have just started your journey from noob\
    \ to pro. No seriously, web programming in Go is so fun and easy that you won't\
    \ even notice how much information you are learning along the way!\n\nKeep in\
    \ mind that there are still portions of this book that are incomplete and need\
