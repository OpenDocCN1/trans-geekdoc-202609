    \ err.Error(), 500)\n\t\t}\n\t})\n}\n```\n\n就这样！这就是我们拥有控制器强大功能所需的全部实现。我们剩下要做的就是实现一个示例控制器：\n\
    \n```\npackage main\n\nimport (\n    \"net/http\"\n\n    \"gopkg.in/unrolled/render.v1\"\
