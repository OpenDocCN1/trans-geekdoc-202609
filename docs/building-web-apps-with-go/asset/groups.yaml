    \ r *http.Request) error {\n    c.JSON(rw, 200, map[string]string{\"Hello\": \"\
    JSON\"})\n    return nil\n}\n\nfunc main() {\n    c := &MyController{Render: render.New(render.Options{})}\n\
    \    http.ListenAndServe(\":8080\", c.Action(c.Index))\n}\n```\n\n### Exercises\n\
    \n- 1. Extend MyController to have multiple actions for different routes in your\
    \ application.\n- 2. Play with more controller implementations, get creative.\n\
    - 3. Override the Action method on MyController to render a error HTML page.\n\
    \n## Databases\n\nOne of the most asked questions I get about web development\
    \ in Go is how to connect to a SQL database. Thankfully, Go has a fantastic SQL\
    \ package in the standard library that allows us to use a whole slew of drivers\
    \ for different SQL databases. In this example we will connect to a SQLite database,\
