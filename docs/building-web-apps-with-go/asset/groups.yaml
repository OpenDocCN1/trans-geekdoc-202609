    \ 1. 扩展 MyController，为应用程序中的不同路由添加多个操作。\n- 2. 尝试更多控制器实现，发挥创造力。\n- 3. 重写 MyController\
    \ 上的 Action 方法以呈现错误 HTML 页面。\n\n## 数据库\n\n关于 Go Web 开发，我被问得最多的问题之一是如何连接到 SQL 数据库。幸运的是，Go\
    \ 的标准库中有一个出色的 SQL 包，允许我们使用大量针对不同 SQL 数据库的驱动程序。在此示例中，我们将连接到 SQLite 数据库，但语法（除去一些微小的\
