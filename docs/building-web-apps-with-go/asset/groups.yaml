    \t}\n\n\treturn db\n}\n```\n\n### 练习\n\n- 1. 利用我们 `sql.DB` 实例上的 `query` 函数提取一组行并将其映射到结构体。\n\
    - 2. 通过使用 HTML 表单，添加向数据库插入新记录的功能。\n- 3. 执行 `go get github.com/jmoiron/sqlx` 并观察相对于标准库中现有\
