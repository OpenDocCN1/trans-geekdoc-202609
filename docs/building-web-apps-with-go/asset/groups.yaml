    \ are using the `render` library that we talked about in previous chapters:\n\n\
    ```\nvar Render = render.New(render.Options{})\n```\n\nIf we want our `http.Handler`s\
    \ to be able access our `render.Render` instance, we have a couple options.\n\n\
    +   1. Use a global variable: This isn't too bad for small programs, but when\
    \ the program gets larger it quickly becomes a maintenance nightmare.\n\n+   2.\
    \ Pass the variable through a closure to the `http.Handler`: This is a great idea,\
    \ and we should be using it most of the time. The implementation ends up looking\
    \ like this:\n\n```\nfunc MyHandler(r *render.Render) http.Handler {\n\treturn\
    \ http.HandlerFunc(func(rw http.ResponseWriter, r *http.Request) {\n\t\t// now\
    \ we can access r\n\t})\n}\n```\n\n# Case for Controllers\n\nWhen your program\
    \ grows in size, you will start to notice that many of your `http.Handler`s will\
    \ share the same dependencies and you will have a lot of these closurized `http.Handler`s\
    \ with the same arguments. The way I like to clean this up is to write a little\
    \ base controller implementation that affords me a few wins:\n\n+   1. Allows\
    \ me to share the dependencies across `http.Handler`s that have similar goals\
    \ or"
