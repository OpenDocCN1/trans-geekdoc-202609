    \ | a markdown processor |\n| Render | gopkg.in/unrolled/render.v1 | Easy rendering\
    \ for JSON, XML, and HTML |\n| SQLite3 | github.com/mattn/go-sqlite3 | sqlite3\
    \ driver for go |\n\nYou can install (or update) these packages by running the\
    \ following command in your console\n\n```\ngo get -u <import_path>\n```\n\nFor\
    \ instance, if you wish to install Negroni, the following command would be:\n\n\
    ```\ngo get -u github.com/codegangsta/negroni\n```\n\n## Go Makes Things Simple\n\
    \nIf you have built a web application before, you surely know that there are quite\
    \ a lot of concepts to keep in your head. HTTP, HTML, CSS, JSON, databases, sessions,\
    \ cookies, forms, middleware, routing and controllers are just a few among the\
    \ many things your web app *may* need to interact with.\n\nWhile each one of these\
    \ things *can be important* in the building of your web applications, not every\
    \ one of them *is important* for any given app. For instance, a web API may just\
    \ use JSON as its serialization format, thus making concepts like HTML not relevant\
    \ for that particular web app.\n\n### The Go Way\n\nThe Go community understands\
    \ this dilemma. Rather than rely on large, heavyweight frameworks that try to\
    \ cover all the bases, Go programmers pull in the bare necessities to get the\
    \ job done. This minimalist approach to web programming may be off-putting at\
    \ first, but the result of this effort is a much simpler program in the end.\n\
    \n**Go makes things simple**, it's as easy as that. If we train ourselves to align\
    \ with the “Go way” of programming for the web, we will end up with more **simple**,\
    \ **flexible**, and **maintainable** web applications.\n\n### Power in Simplicity\n\
    \nAs we go through the exercises in this book, I think you will be surprised by\
    \ how simple some of these programs can be whilst still affording a bunch of functionality.\n\
    \nWhen sitting down to craft your own web applications in Go, think hard about\
    \ the components and concepts that your app will be focused on, and use just those\
    \ pieces. This book will be covering a wide array of web topics, but do not feel\
    \ obligated to use them all. In the words of our friend Lonestar, “Take only what\
    \ you need to survive”.\n\n![](img/b13e88ce67ae8c7bdcd6ffa38905ffce_5_0.png)\n\
    \n### The net/http Package\n\nYou have probably heard that Go is fantastic for\
    \ building web applications of all shapes and sizes. This is partly due to the\
    \ fantastic work that has been put into making the standard library clean, consistent,\
    \ and easy to use.\n\nPerhaps one of the most important packages for any budding\
    \ Go web developer is the net/http package. This package allows you to build HTTP\
    \ servers in Go with its powerful compositional constructs. Before we start coding,\
    \ let's do an extremely quick overview of HTTP.\n\n### HTTP Basics\n\nWhen we\
    \ talk about building web applications, we usually mean that we are building HTTP\
    \ servers. HTTP is a protocol that was originally designed to transport HTML documents\
    \ from a server to a client web browser. Today, HTTP is used to transport a whole\
    \ lot more than HTML.\n\n![](img/b13e88ce67ae8c7bdcd6ffa38905ffce_6_0.png)\n\n\
    The important thing to notice in this diagram is the two points of interaction\
    \ between the Server and the Browser. The Browser makes an HTTP request with some\
    \ information, the Server then processes that request and returns a Response.\n\
    \nThis pattern of request-response is one of the key focal points in building\
    \ web applications in Go. In fact, the net/http package's most important piece\
    \ is the http.Handler Interface.\n\n### The http.Handler Interface\n\nAs you become\
    \ more familiar with Go, you will notice how much of an impact interfaces make\
    \ in the design of your programs. The net/http interface encapsulates the request-response\
    \ pattern in one method:\n\n```\ntype Handler interface {\n\tServeHTTP(ResponseWriter,\
    \ *Request)\n}\n```\n\nImplementors of this interface are expected to inspect\
    \ and process data coming from the http.Request object and write out a response\
    \ to the http.ResponseWriter object.\n\nThe http.ResponseWriter interface looks\
    \ like this:\n\n```\ntype ResponseWriter interface {\n\tHeader() Header\n\tWrite([]byte)\
    \ (int, error)\n\tWriteHeader(int)\n}\n```\n\n### Composing Web Services\n\nBecause\
    \ much of the net/http package is built off of well defined interface types, we\
    \ can (and are expected to) build our web applications with composition in mind.\
    \ Each http.Handler implementation can be thought of as its own web server.\n\n\
    Many patterns can be found in that simple but powerful assumption. Throughout\
    \ this book we will cover some of these patterns and how we can use them to solve\
    \ real world problems.\n\n### Exercise: 1 Line File Server\n\nLet's solve a real\
    \ world problem in 1 line of code.\n\nMost of the time people just need to serve\
    \ static files. Maybe you have a static HTML landing page and just want to serve\
    \ up some HTML, images, and CSS and call it a day. Sure, you could pull in Apache\
    \ or Python's SimpleHTTPServer, but Apache is too much for this little site and\
    \ SimpleHTTPServer is, well, too slow.\n\nWe will begin by creating a new project\
    \ in our GOPATH.\n\n```\ncd GOPATH/src\nmkdir fileserver && cd fileserver\n```\n\
    \nCreate a **main.go** with our typical go boilerplate.\n\n```\npackage main\n\
    \nimport \"net/http\"\n\nfunc main() {\n}\n```\n\nAll we need to import is the\
    \ **net/http** package for this to work. Remember that this is all part of the\
    \ standard library in Go.\n\nLet's write our fileserver code:\n\n```\nhttp.ListenAndServe(\"\
    :8080\", http.FileServer(http.Dir(\".\")))\n```\n\nThe **http.ListenAndServe**\
    \ function is used to start the server, it will bind to the address we gave it\
    \ ( `:8080` ) and when it receives an HTTP request, it will hand it off to the\
    \ **http.Handler** that we supply as the second argument. In our case it is the\
    \ built-in **http.FileServer**.\n\nThe **http.FileServer** function builds an\
    \ **http.Handler** that will serve an entire directory of files and figure out\
    \ which file to serve based on the request path. We told the FileServer to serve\
    \ the current working directory with **http.Dir(\".\")**.\n\nThe entire program\
    \ looks like this:\n\n```\npackage main\n\nimport \"net/http\"\n\nfunc main()\
    \ {\n\thttp.ListenAndServe(\":8080\", http.FileServer(http.Dir(\".\")))\n}\n```\n"
  mdcn: "\n\n## 用 Go 构建 Web 应用\n\n![](img/b13e88ce67ae8c7bdcd6ffa38905ffce_0_0.png)\n\
    \n## Jeremy Saenz\n\n## 目录\n\n- 简介 0\n- Go 让事物变简单 1\n- net/http 包 2\n- 创建一个基本的\
    \ Web 应用 3\n- 部署 4\n- URL 路由 5\n- 中间件 6\n- 渲染 7\n- JSON 7.1\n- HTML 模板 7.2\n-\
    \ 使用 render 包 7.3\n- 测试 8\n- 单元测试 8.1\n- 端到端测试 8.2\n- 控制器 9\n- 数据库 10\n- 技巧与窍门\
    \ 11\n- 向前迈进 12\n\n## 简介\n\n欢迎阅读 **用 Go 构建 Web 应用**！如果你正在阅读本文，那么你已经刚刚开始从新手到专家的旅程了。说真的，用\
    \ Go 进行 Web 编程非常有趣且简单，以至于你甚至不会意识到在过程中学到了多少信息！\n\n请记住，本书仍有部分需要完善和完善。开源出版的美妙之处在于，我可以给你一本不完整的书，但它对你仍然有价值。\n\
    \n在进入所有细节之前，让我们先从一些基本规则开始：\n\n## 前置条件\n\n为了使本教程简洁且专注，我假设你已按以下方式做好准备：\n\n- 1. 你已安装\
    \ Go 编程语言。\n- 2. 你已通过遵循 [如何编写 Go 代码](https://golang.org/doc/code.html) 教程设置了 `GOPATH`。\n\
    - 3. 你对 Go 的基础知识 somewhat 熟悉。（[Go 之旅](https://tour.golang.org/) 是一个不错的起点）\n- 4.\
    \ 你已安装所有 [所需包](#所需包)\n- 5. 你已安装 [Heroku 工具带](https://toolbelt.heroku.com/)\n-\
    \ 6. 你拥有一个 [Heroku 账户](https://www.heroku.com/)\n\n## 所需包\n\n大部分情况下，我们将使用标准库中的内置包来构建\
    \ Web 应用。某些课程，例如数据库、中间件和 URL 路由，将需要第三方包。以下是开始前需要安装的所有 Go 包列表：\n\n| 名称 | 导入路径 |\
    \ 描述 |\n|---|---|---|\n| httprouter | github.com/julienschmidt/httprouter | 一款高性能的\
    \ HTTP 请求路由器，扩展性良好 |\n| Negroni | github.com/codegangsta/negroni | 符合习惯的 HTTP\
    \ 中间件 |\n| Black Friday | github.com/russross/blackfriday | 一个 Markdown 处理器 |\n\
    | Render | gopkg.in/unrolled/render.v1 | 用于 JSON、XML 和 HTML 的轻松渲染 |\n| SQLite3\
    \ | github.com/mattn/go-sqlite3 | 用于 Go 的 sqlite3 驱动程序 |\n\n你可以通过在控制台中运行以下命令来安装（或更新）这些包\n\
    \n```\ngo get -u <import_path>\n```\n\n例如，如果你希望安装 Negroni，则运行以下命令：\n\n```\ngo\
    \ get -u github.com/codegangsta/negroni\n```\n\n## Go 让事物变简单\n\n如果你以前构建过 Web 应用程序，你肯定知道需要记住相当多的概念。HTTP、HTML、CSS、JSON、数据库、会话、Cookie、表单、中间件、路由和控制器只是你的\
    \ Web 应用 *可能* 需要交互的众多事物中的几个。\n\n虽然每一件事 *在构建 Web 应用程序时都可能很重要*，但并非每一件事 *对任何给定应用都重要*。例如，Web\
    \ API 可能仅使用 JSON 作为其序列化格式，因此 HTML 等概念对于该特定 Web 应用不相关。\n\n### Go 的方式\n\nGo 社区理解这一困境。Go\
    \ 程序员不依赖试图全面覆盖的大型沉重框架，而是只引入完成工作所需的最基本要素。这种对 Web 编程的极简主义方法起初可能令人却步，但最终结果是一个更简单的程序。\n\
    \n**Go 让事物变简单**，就这么简单。如果我们训练自己与用于 Web 编程的“Go 方式”保持一致，我们最终将获得更多 **简单**、**灵活**，和\
    \ **可维护** 的 Web 应用程序。\n\n### 简洁中的力量\n\n在阅读本书的练习过程中，我认为你会惊讶于这些程序可以多么简单，同时仍然提供大量功能。\n\
    \n在着手使用 Go 构建自己的 Web 应用程序时，要仔细考虑你的应用程序将关注的组件和概念，并且只使用这些部分。本书将涵盖广泛的 Web 主题，但你不必感到有义务全部使用。正如我们的朋友\
    \ Lonestar 所说，“只拿生存所需”。\n\n![](img/b13e88ce67ae8c7bdcd6ffa38905ffce_5_0.png)\n\
    \n### net/http 包\n\n你可能已经听说过 Go 构建各种形状和大小的 Web 应用程序非常出色。这部分归功于为使标准库保持简洁、一致且易于使用所做的出色工作。\n\
    \n也许，对任何有志成为 Go Web 开发者的人来说，最重要的包之一就是 net/http 包。该包允许你使用其强大的组合构造在 Go 中构建 HTTP\
    \ 服务器。在开始编码之前，让我们快速概述一下 HTTP。\n\n### HTTP 基础\n\n当我们谈论构建 Web 应用程序时，通常是指构建 HTTP\
    \ 服务器。HTTP 是一种最初设计用于将 HTML 文档从服务器传输到客户端 Web 浏览器的协议。今天，HTTP 用于传输远比 HTML 多得多的内容。\n\
    \n![](img/b13e88ce67ae8c7bdcd6ffa38905ffce_6_0.png)\n\n需要注意这个图表中的重要一点是 Server\
    \ 和 浏览器之间的两个交互点。浏览器带着一些信息发出 HTTP 请求，然后服务器处理该请求并返回一个响应。\n\n这种请求-响应模式是在 Go 中构建 Web\
    \ 应用程序的关键焦点之一。事实上，net/http 包最重要的部分是 http.Handler 接口。\n\n### http.Handler 接口\n\n\
    随着你对 Go 越来越熟悉，你会注意到接口对程序设计的影响有多大。net/http 接口在一个方法中封装了请求-响应模式：\n\n```\ntype Handler\
    \ interface {\n\tServeHTTP(ResponseWriter, *Request)\n}\n```\n\n实现此接口的对象被期望检查和处理来自\
    \ http.Request 对象的数据，并将响应写入 http.ResponseWriter 对象。\n\nhttp.ResponseWriter 接口如下所示：\n\
    \n```\ntype ResponseWriter interface {\n\tHeader() Header\n\tWrite([]byte) (int,\
    \ error)\n\tWriteHeader(int)\n}\n```\n\n### 组合 Web 服务\n\n因为 net/http 包的大部分是基于定义良好的接口类型构建的，我们可以（并且应该）以组合为中心构建我们的\
    \ Web 应用程序。每个 http.Handler 实现都可以被视为其自己的 Web 服务器。\n\n在这个简单但强大的假设中可以找到许多模式。在整本书中，我们将介绍其中的一些模式以及如何使用它们来解决现实世界的问题。\n\
    \n### 练习：一行文件服务器\n\n让我们用 1 行代码解决一个现实世界的问题。\n\n大多数时候，人们只需要提供静态文件。也许你有一个静态 HTML\
    \ 登录页面，只想提供一些 HTML、图片和 CSS 然后就完事了。当然，你可以引入 Apache 或 Python 的 SimpleHTTPServer，但\
    \ Apache 对这个小站来说太重了，而 SimpleHTTPServer well, 太慢了。\n\n我们将首先在 GOPATH 中创建一个新项目。\n\
    \n```\ncd GOPATH/src\nmkdir fileserver && cd fileserver\n```\n\n使用典型的 Go 样板代码创建一个\
    \ **main.go**。\n\n```\npackage main\n\nimport \"net/http\"\n\nfunc main() {\n\
    }\n```\n\n我们只需要导入 **net/http** 包即可使其工作。请记住，这都是 Go 标准库的一部分。\n\n让我们编写我们的文件服务器代码：\n\
    \n```\nhttp.ListenAndServe(\":8080\", http.FileServer(http.Dir(\".\")))\n```\n\
    \n**http.ListenAndServe** 函数用于启动服务器，它将绑定到我们给它的地址（`:8080`），当它接收到 HTTP 请求时，会将其交给作为第二个参数提供的\
    \ **http.Handler**。在我们的例子中，它是内置的 **http.FileServer**。\n\n**http.FileServer** 函数构建一个\
    \ **http.Handler**，它将提供整个目录的文件，并根据请求路径确定提供哪个文件。我们使用 **http.Dir(\".\")** 告诉 FileServer\
    \ 提供当前工作目录。\n\n完整的程序如下所示：\n\n```\npackage main\n\nimport \"net/http\"\n\nfunc\
    \ main() {\n\thttp.ListenAndServe(\":8080\", http.FileServer(http.Dir(\".\")))\n\
    }\n```\n\n"
