    # # The net/http Package


    You have probably heard that Go is fantastic for building web applications of
    all shapes and sizes. This is partly due to the fantastic work that has been put
    into making the standard library clean, consistent, and easy to use.


    Perhaps one of the most important packages for any budding Go web developer is
    the net/http package. This package allows you to build HTTP servers in Go with
    its powerful compositional constructs. Before we start coding, let''s do an extremely
    quick overview of HTTP.


    # # HTTP Basics


    When we talk about building web applications, we usually mean that we are building
    HTTP servers. HTTP is a protocol that was originally designed to transport HTML
    documents from a server to a client web browser. Today, HTTP is used to transport
    a whole lot more than HTML.


    ![](img/b13e88ce67ae8c7bdcd6ffa38905ffce_6_0.png)


    The important thing to notice in this diagram is the two points of interaction
    between the Server and the Browser. The Browser makes an HTTP request with some
    information, the Server then processes that request and returns a Response.'
  - "[PAGE 7]\n\nThis pattern of request-response is one of the key focal points in\
    \ building web applications in Go. In fact, the net/http package's most important\
    \ piece is the http.Handler Interface.\n\n# # The http.Handler Interface\n\nAs\
    \ you become more familiar with Go, you will notice how much of an impact interfaces\
    \ make in the design of your programs. The net/http interface encapsulates the\
    \ request-response pattern in one method:\n\n```\ntype Handler interface {\n\t\
    ServeHTTP(ResponseWriter, *Request)\n}\n```\n\nImplementors of this interface\
    \ are expected to inspect and process data coming from the http.Request object\
    \ and write out a response to the http.ResponseWriter object.\n\nThe http.ResponseWriter\
    \ interface looks like this:\n\n```\ntype ResponseWriter interface {\n\tHeader()\
    \ Header\n\tWrite([]byte) (int, error)\n\tWriteHeader(int)\n}\n```\n\n# # Composing\
    \ Web Services\n\nBecause much of the net/http package is built off of well defined\
    \ interface types, we can (and are expected to) build our web applications with\
    \ composition in mind. Each http.Handler implementation can be thought of as its\
    \ own web server.\n\nMany patterns can be found in that simple but powerful assumption.\
    \ Throughout this book we will cover some of these patterns and how we can use\
    \ them to solve real world problems.\n\n# # Exercise: 1 Line File Server\n\nLet's\
    \ solve a real world problem in 1 line of code."
  - "[PAGE 8]\n\nMost of the time people just need to serve static files. Maybe you\
    \ have a static HTML landing page and just want to serve up some HTML, images,\
    \ and CSS and call it a day. Sure, you could pull in Apache or Python's SimpleHTTPServer\
    \ , but Apache is too much for this little site and SimpleHTTPServer is, well,\
    \ too slow.\n\nWe will begin by creating a new project in our GOPATH .\n\n```\n\
    cd GOPATH/src\nmkdir fileserver && cd fileserver\n```\n\nCreate a **main.go**\
    \ with our typical go boilerplate.\n\n```\npackage main\n\nimport \"net/http\"\
    \n\nfunc main() {\n}\n```\n\nAll we need to import is the **net/http** package\
    \ for this to work. Remember that this is all part of the standard library in\
    \ Go.\n\nLet's write our fileserver code:\n\n```\nhttp.ListenAndServe(\":8080\"\
    , http.FileServer(http.Dir(\".\")))\n```\n\nThe **http.ListenAndServe** function\
    \ is used to start the server, it will bind to the address we gave it ( `:8080`\
    \ ) and when it receives an HTTP request, it will hand it off to the **http.Handler**\
    \ that we supply as the second argument. In our case it is the built-in **http.FileServer**\
    \ .\n\nThe **http.FileServer** function builds an **http.Handler** that will serve\
    \ an entire directory of files and figure out which file to serve based on the\
    \ request path. We told the FileServer to serve the current working directory\
    \ with **http.Dir(\".\")** .\n\nThe entire program looks like this:\n\n```\npackage\
    \ main\n\nimport \"net/http\"\n\nfunc main() {\n\thttp.ListenAndServe(\":8080\"\
    , http.FileServer(http.Dir(\".\")))\n}\n```"
