    \ 1. 创建另一个可更改请求状态的中间件。\n- 2. 创建一个 POST 请求并测试请求是否被正确处理。\n\n## 控制器\n\n控制器在其他 Web\
    \ 开发社区中是一个相当熟悉的话题。由于大多数 Web 开发人员都围绕强大的 net/http 接口聚集，因此并非许多控制器实现都广受欢迎。然而，使用控制器模式有很大好处。它允许在\
    \ net/http 处理器接口所能单独提供的基础上，构建清晰、定义良好的抽象。\n\n### 处理器依赖\n\n在此示例中，我们将尝试使用 Go 中的一些标准特性来构建自己的控制器实现。但首先，让我们先从我们试图解决的问题开始。假设我们正在使用之前章节中讨论过的\
    \ `render` 库：\n\n```\nvar Render = render.New(render.Options{})\n```\n\n如果我们希望我们的\
    \ `http.Handler` 可以访问我们的 `render.Render` 实例，我们有几种选择。\n\n- 1. 使用全局变量：这对小型程序来说还不错，但当程序变大时，它会迅速成为维护噩梦。\n\
    - 2. 通过闭包将变量传递给 `http.Handler`：这是一个好主意，我们大多数时候都应该使用它。实现最终看起来像这样：\n\n```\nfunc\
    \ MyHandler(r *render.Render) http.Handler {\n\treturn http.HandlerFunc(func(rw\
    \ http.ResponseWriter, r *http.Request) {\n\t\t// now we can access r\n\t})\n\
    }\n```\n\n### 控制器的理由\n\n当您的程序变大时，您会开始注意到许多 `http.Handler` 将共享相同的依赖项，并且会有许多具有相同参数的这些经过闭包处理的\
    \ `http.Handler`。我喜欢通过编写一个小型基础控制器实现来清理这一点，这给我带来了几个好处：\n\n- 1. 允许我在具有相似目标或概念的 `http.Handler`\
    \ 之间共享依赖项。\n- 2. 避免使用全局变量和函数，以便于测试/模拟。\n- 3. 为我提供一种更集中、更符合 Go 风格的错误处理机制。\n\n控制器的好处在于，它们无需导入外部包就能为我们提供所有这些功能！其中大部分功能来自于对\
    \ Go 特性集的巧妙利用，即 Go 结构体和嵌入。让我们来看看实现。\n\n```\npackage main\n\nimport \"net/http\"\
