    public\")))\n```\n\n我们正在使用 `http.HandleFunc` 和 `http.Handle` 方法为我们的应用程序定义一些简单的路由。重要的是要注意，在\
    \ \"/\" 模式上调用 `http.Handle` 会充当捕获所有路由，因此我们最后定义该路由。`http.FileServer` 返回一个 `http.Handler`，因此我们使用\
    \ `http.Handle` 将模式字符串映射到处理程序。替代方法 `http.HandleFunc` 使用 `http.HandlerFunc` 而不是\
