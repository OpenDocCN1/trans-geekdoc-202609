    \ `Procfile`，它允许我们定义为应用程序运行哪些进程。默认情况下，Go 会将可执行文件命名为主包所在目录的名称。例如，如果我的 Web 应用程序位于\
    \ `GOPATH/github.com/codegangsta/bwag/deployment`，我的 `Procfile` 将如下所示：\n\n```\n\
    web: deployment\n```\n\n专门针对运行 Go 应用程序，我们还需要指定一个 .godir 文件来告诉 Heroku 哪个目录实际上是我们的包目录。\n\
    \n```\ndeployment\n```\n\n### 部署\n\n一旦所有这些准备就绪，Heroku 使部署变得容易。\n\n将项目初始化为 Git\
