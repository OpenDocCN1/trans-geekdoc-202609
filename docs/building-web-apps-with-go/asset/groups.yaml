    \tn := negroni.New(\n\t\tnegroni.NewRecovery(),\n\t\tnegroni.HandlerFunc(MyMiddleware),\n\
    \t\tnegroni.NewLogger(),\n\t\tnegroni.NewStatic(http.Dir(\"public\")),\n\t)\n\n\
    \tn.Run(\":8080\")\n}\n\nfunc MyMiddleware(rw http.ResponseWriter, r *http.Request,\
