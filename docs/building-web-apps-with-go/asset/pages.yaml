  md: "# Using the render package\n\nIf you want rendering JSON and HTML to be even\
    \ simpler, there is the github.com/unrolled/render package. This package was inspired\
    \ by the martini-contrib/render package and is my goto when it comes to rendering\
    \ data for presentation in my web applications.\n\n```\npackage main\n\nimport\
    \ (\n\t\"net/http\"\n\n\t\"gopkg.in/unrolled/render.v1\"\n)\n\nfunc main() {\n\
    \tr := render.New(render.Options{})\n\tmux := http.NewServeMux()\n\n\tmux.HandleFunc(\"\
    /\", func(w http.ResponseWriter, req *http.Request) {\n\t\tw.Write([]byte(\"Welcome,\
    \ visit sub pages now.\"))\n\t})\n\n\tmux.HandleFunc(\"/data\", func(w http.ResponseWriter,\
    \ req *http.Request) {\n\t\tr.Data(w, http.StatusOK, []byte(\"Some binary data\
    \ here.\"))\n\t})\n\n\tmux.HandleFunc(\"/json\", func(w http.ResponseWriter, req\
    \ *http.Request) {\n\t\tr.JSON(w, http.StatusOK, map[string]string{\"hello\":\
    \ \"json\"})\n\t})\n\n\tmux.HandleFunc(\"/html\", func(w http.ResponseWriter,\
    \ req *http.Request) {\n\t\t// Assumes you have a template in .templates called\
    \ \"example.tmpl\"\n\t\t// $ mkdir -p templates & echo \"<h1>Hello {{.}}</h1>\"\
    \ > templates/example.tmpl\n\t\tr.HTML(w, http.StatusOK, \"example\", nil)\n\t\
    })\n\n\thttp.ListenAndServer(\":8080\", mux)\n}\n```\n\n# Exercises\n\n+   1.\
    \ Have fun playing with all of the options available when calling `render.New()`\n\
    +   2. Try using the `.yield` helper function (with the curly braces) and a layout\
    \ with HTML"
