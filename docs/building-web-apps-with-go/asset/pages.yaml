  md: '# # Databases


    One of the most asked questions I get about web development in Go is how to connect
    to a SQL database. Thankfully, Go has a fantastic SQL package in the standard
    library that allows us to use a whole slew of drivers for different SQL databases.
    In this example we will connect to a SQLite database, but the syntax (minus some
    small SQL semantics) is the same for a MySQL or PostgreSQL database.'
  merge: -1
  img_proc: true
- pgno: 35
  md: "```\npackage main\n\nimport (\n\t\"database/sql\"\n\t\"fmt\"\n\t\"log\"\n\t\
    \"net/http\"\n\n\t_ \"github.com/mattn/go-sqlite3\"\n)\n\nfunc main() {\n\tdb\
    \ := NewDB()\n\tlog.Println(\"Listening on :8080\")\n\thttp.ListenAndServe(\"\
    :8080\", ShowBooks(db))\n}\n\nfunc ShowBooks(db *sql.DB) http.Handler {\n\treturn\
    \ http.HandlerFunc(func(rw http.ResponseWriter, r *http.Request) {\n\t\tvar title,\
    \ author string\n\t\terr := db.QueryRow(\"select title, author from books\").Scan(&title,\
    \ &author)\n\t\tif err != nil {\n\t\t\tpanic(err)\n\t\t}\n\n\t\tfmt.Fprintf(rw,\
    \ \"The first book is '%s' by '%s'\", title, author)\n\t})\n}\n\nfunc NewDB()\
    \ *sql.DB {\n\tdb, err := sql.Open(\"sqlite3\", \"example.sqlite\")\n\tif err\
    \ != nil {\n\t\tpanic(err)\n\t}\n\n\t_, err = db.Exec(\"create table if not exists\
    \ books(title text, author text)\")\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\n\
    \treturn db\n}\n```\n\n# # Exercises\n\n+   1. Make use of the `query` function\
