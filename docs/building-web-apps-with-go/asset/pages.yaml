  md: "# Tips and Tricks\n\n# Wrap a http.HandlerFunc closure\n\nSometimes you want\
    \ to pass data to a http.HandlerFunc on initialization. This can easily be done\
    \ by creating a closure of the `http.HandlerFunc` :\n\n```\n```go\nfunc MyHandler(database\
    \ *sql.DB) http.Handler {\n\treturn http.HandlerFunc(func(rw http.ResponseWriter,\
    \ r *http.Request) {\n\t\t// you now have access to the *sql.DB here\n\t})\n}\n\
    ```\n```\n\n# Using gorilla/context for request-specific data\n\nIt is pretty\
    \ often that we need to store and retrieve data that is specific to the current\
    \ HTTP request. Use `gorilla/context` to map values and retrieve them later. It\
    \ contains a global mutex on a map of request objects.\n\n```\n```go\nfunc MyHandler(w\
    \ http.ResponseWriter, r *http.Request) {\n\tval := context.Get(r, \"myKey\")\n\
    \n\t// returns (\"bar\", true)\n\tval, ok := context.GetOk(r, \"myKey\")\n\n\t\
    // ...\n}\n```\n```"
