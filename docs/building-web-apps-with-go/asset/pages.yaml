- pgno: 29
  md: "# # End To End Testing\n\nEnd to end allows us to test applications through\
    \ the whole request cycle. Where unit testing is meant to just test a particular\
    \ function, end to end tests will run the middleware, router, and other that a\
    \ request my pass through.\n\n```\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\
    \t\"net/http\"\n\n\t\"github.com/codegangsta/negroni\"\n\t\"github.com/julienschmidt/httprouter\"\
    \n)\n\nfunc HelloWorld(res http.ResponseWriter, req *http.Request, p httprouter.Params)\
    \ {\n\tfmt.Fprint(res, \"Hello World\")\n}\n\nfunc App() http.Handler {\n\tn :=\
    \ negroni.Classic()\n\n\tm := func(res http.ResponseWriter, req *http.Request,\
    \ next http.HandlerFunc) {\n\t\tfmt.Fprint(res, \"Before...\")\n\t\tnext(res,\
    \ req)\n\t\tfmt.Fprint(res, \"...After\")\n\t}\n\n\tn.Use(negroni.HandlerFunc(m))\n\
    \n\tr := httprouter.New()\n\tr.GET(\"/\", HelloWorld)\n\tn.UseHandler(r)\n\treturn\
    \ n\n}\n\nfunc main() {\n\thttp.ListenAndServ(\":3000\", App())\n}\n```\n```\n\
    \nThis is the test file. It should be placed in the same directory as your application\
    \ and name main_test.go ."
  merge: -1
  img_proc: true
