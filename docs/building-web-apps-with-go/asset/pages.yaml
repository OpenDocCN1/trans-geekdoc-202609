- pgno: 21
  md: "# # JSON\n\nJSON is quickly becoming the ubiquitous serialization format for\
    \ web APIs, so it may be the most relevant when learning how to build web apps\
    \ using Go. Fortunately, Go makes it simple to work with JSON -- it is extremely\
    \ easy to turn existing Go structs into JSON using the `encoding/json` package\
    \ from the standard library.\n\n```\n```go\npackage main\n\nimport (\n\t\"encoding/json\"\
    \n\t\"net/http\"\n)\n\ntype Book struct {\n\tTitle string `json:\"title\"`\n\t\
    Author string `json:\"author\"`\n}\n\nfunc main() {\n\thttp.HandleFunc(\"/\",\
    \ ShowBooks)\n\thttp.ListenAndServe(\":8080\", nil)\n}\n\nfunc ShowBooks(w http.ResponseWriter,\
    \ r *http.Request) {\n\tbook := Book{\"Building Web Apps with Go\", \"Jeremy Saenz\"\
    }\n\n\tjs, err := json.Marshal(book)\n\tif err != nil {\n\t\thttp.Error(w, err.Error(),\
    \ http.StatusInternalServerError)\n\t\treturn\n\t}\n\n\tw.Header().Set(\"Content-Type\"\
    , \"application/json\")\n\tw.Write(js)\n}\n```\n```\n\n# ## Exercises\n\n+   1.\
    \ Read through the JSON API docs and find out how to rename and ignore fields\
    \ for JSON serialization.\n+   2. Instead of using the `json.Marshal` method,\
    \ try using the `json.Encoder` API.\n+   3. Figure our how to pretty print JSON\
    \ with the `encoding/json` package."
  merge: -1
  img_proc: true
- pgno: 22
  md: "# # HTML Templates\n\nServing HTML is an important job for some web applications.\
    \ Go has one of my favorite templating languages to date. Not for its features,\
    \ but for its simplicity and out of the box security. Rendering HTML templates\
    \ is almost as easy as rendering JSON using the 'html/template' package from the\
    \ standard library. Here is what the source code for rendering HTML templates\
    \ looks like:\n\n```\npackage main\n\nimport (\n\t\"html/template\"\n\t\"net/http\"\
    \n\t\"path\"\n)\n\ntype Book struct {\n\tTitle string\n\tAuthor string\n}\n\n\
    func main() {\n\thttp.HandleFunc(\"/\", ShowBooks)\n\thttp.ListenAndServe(\":8080\"\
    , nil)\n}\n\nfunc ShowBooks(w http.ResponseWriter, r *http.Request) {\n\tbook\
    \ := Book{\"Building Web Apps with Go\", \"Jeremy Saenz\"}\n\n\tfp := path.Join(\"\
    templates\", \"index.html\")\n\ttmpl, err := template.ParseFiles(fp)\n\tif err\
    \ != nil {\n\t\thttp.Error(w, err.Error(), http.StatusInternalServerError)\n\t\
    \treturn\n\t}\n\n\tif err := tmpl.Execute(w, book); err != nil {\n\t\thttp.Error(w,\
    \ err.Error(), http.StatusInternalServerError)\n\t}\n}\n```\n\nThis is the following\
    \ template we will be using. It should be placed in a `templates/index.html` file\
    \ in the directory your program is run from:"
  merge: -1
  img_proc: true
