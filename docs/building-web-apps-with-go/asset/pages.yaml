- pgno: 10
  md: '# Creating a Basic Web App


    Now that we are done going over the basics of HTTP, let''s create a simple but
    useful web application in Go.


    Pulling from our fileserver program that we implemented last chapter, we will
    implement a Markdown generator using the github.com/russross/blackfriday package.


    # HTML Form


    For starters, we will need a basic HTML form for the markdown input:


    ```

    <html>

    <head>

    <link href="//css/bootstrap.min.css" rel="stylesheet">

    </head>

    <body>

    <div class="container">

    <div class="page-title">

    <h1>Markdown Generator</h1>

    <p class="lead">Generate your markdown with Go</p>

    <hr />

    </div>


    <form action="/markdown" method="POST">

    <div class="form-group">

    <textarea class="form-control" name="body" cols="30" rows="10"></textarea>

    </div>


    <div class="form-group">

    <input type="submit" class="btn btn-primary pull-right" />

    </div>

    </form>

    </div>

    <script src="//js/bootstrap.min.js"></script>

    </body>

    </html>

    ```


    Put this HTML into a file named index.html in the "public" folder of our application
    and the bootstrap.min.css from http://getbootstrap.com/ in the "public/css" folder.
    Notice that the form makes an HTTP POST to the "/markdown" endpoint of our application.
    We don''t actually handle that route right now, so let''s add it.'
  merge: -1
  img_proc: true
- pgno: 11
  md: "# # The \"/markdown\" route\n\nThe program to handle the '/markdown' route\
    \ and serve the public `index.html` file looks like this:\n\n```\n```go\npackage\
    \ main\n\nimport (\n\t\"net/http\"\n\n\t\"github.com/russross/blackfriday\"\n\
    )\n\nfunc main() {\n\thttp.HandleFunc(\"/markdown\", GenerateMarkdown)\n\thttp.Handle(\"\
    /\", http.FileServer(http.Dir(\"public\")))\n\thttp.ListenAndServe(\":8080\",\
    \ nil)\n}\n\nfunc GenerateMarkdown(rw http.ResponseWriter, r *http.Request) {\n\
    \tmarkdown := blackfriday.MarkdownCommon([]byte(r.FormValue(\"body\")))\n\trw.Write(markdown)\n\
    }\n```\n```\n\nLet's break it down into smaller pieces to get a better idea of\
    \ what is going on.\n\n```\n```go\nhttp.HandleFunc(\"/markdown\", GenerateMarkdown)\n\
    http.Handle(\"/\", http.FileServer(http.Dir(\"public\")))\n```\n```\n\nWe are\
    \ using the `http.HandleFunc` and `http.Handle` methods to define some simple\
    \ routing for our application. It is important to note that calling `http.Handle`\
    \ on the \"/\" pattern will act as a catch-all route, so we define that route\
    \ last. `http.FileServer` returns an `http.Handler` so we use `http.Handle` to\
    \ map a pattern string to a handler. The alternative method, `http.HandleFunc`,\
    \ uses an `http.HandlerFunc` instead of an `http.Handler`. This may be more convenient,\
    \ to think of handling routes via a function instead of an object.\n\n```\n```go\n\
    func GenerateMarkdown(rw http.ResponseWriter, r *http.Request) {\n\tmarkdown :=\
    \ blackfriday.MarkdownCommon([]byte(r.FormValue(\"body\")))\n\trw.Write(markdown)\n\
    }\n```\n```\n\nOur GenerateMarkdown function implements the standard `http.HandlerFunc`\
    \ interface and renders HTML from a form field containing markdown-formatted text.\
    \ In this case, the content is retrieved with `r.FormValue(\"body\")`. It is very\
    \ common to get input from the"
  merge: -1
  img_proc: true
- pgno: 12
  md: '`http.Request` object that the `http.HandlerFunc` receives as an argument.
    Some other examples of input are the `r.Header`, `r.Body`, and `r.URL` members.


    We finalize the request by writing it out to our `http.ResponseWriter`. Notice
    that we didn''t explicitly send a response code. If we write out to the response
    without a code, the `net/http` package will assume that the response is a `200
    OK`. This means that if something did happen to go wrong, we should set the response
    code via the `rw.WriteHeader()` method.


    ```

    http.ListenAndSet(":8080", nil)

    ```


    The last bit of this program starts the server, we pass `nil` as our handler,
    which assumes that the HTTP requests will be handled by the `net/http` packages
    default `http.ServeMux`, which is configured using `http.Handle` and `http.HandleFunc`,
    respectively.


    And that is all you need to be able to generate markdown as a service in Go. It
    is a surprisingly small amount of code for the amount of heavy lifting it does.
    In the next chapter we will learn how to deploy this application to the web using
    Heroku.'
  merge: -1
  img_proc: true
- pgno: 13
  md: "# # Deployment\n\nHeroku makes deploying applications easy. It is a perfect\
    \ platform for small to medium size web applications that are willing to sacrifice\
    \ a little bit of flexibility in infrastructure to gain a fairly pain-free environment\
    \ for deploying and maintaining web applications.\n\nI am choosing to deploy our\
    \ web application to Heroku for the sake of this tutorial because in my experience\
    \ it has been the fastest way to get a web application up and running in no time.\
    \ Remember that the focus of this tutorial is how to build web applications in\
    \ Go and not getting caught up in all of the distraction of provisioning, configuring,\
    \ deploying, and maintaining the machines that our Go code will be run on.\n\n\
    # # Getting setup\n\nIf you don't already have a Heroku account, sign up at id.heroku.com/signup.\
    \ It's quick, easy and free.\n\nApplication management and configuration is done\
    \ through the Heroku toolbelt, which is a free command line tool maintained by\
    \ Heroku. We will be using it to create our application on Heroku. You can get\
    \ it from toolbelt.heroku.com.\n\n# # Changing the Code\n\nTo make sure the application\
    \ from our last chapter will work on Heroku, we will need to make a few changes.\
    \ Heroku gives us a `PORT` environment variable and expects our web application\
    \ to bind to it. Let's start by importing the \"os\" package so we can grab that\
    \ `PORT` environment variable:\n\n```\nimport (\n\t\"net/http\"\n\t\"os\"\n\n\t\
    \"github.com/russross/blackfriday\"\n)\n```\n\nNext, we need to grab the `PORT`\
    \ environment variable, check if it is set, and if it is we should bind to that\
    \ instead of our hardcoded port (8080)."
  merge: -1
  img_proc: true
