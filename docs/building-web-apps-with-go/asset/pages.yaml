  md: "# # URL Routing\n\nFor some simple applications, the default http.ServeMux\
    \ can take you pretty far. If you need more power in how you parse URL endpoints\
    \ and route them to the proper handler, you may need to pull in a third party\
    \ routing framework. For this tutorial, we will use the popular github.com/julienschmidt/httprouter\
    \ library as our router.\n\ngithub.com/julienschmidt/httprouter is a great choice\
    \ for a router as it is a very simple implementation with one of the best performance\
    \ benchmarks out of all the third party Go routers.\n\nIn this example, we will\
    \ create some routing for a RESTful resource called \"posts\". Below we define\
    \ mechanisms to view index, show, create, update, destroy, and edit posts.\n\n\
    ```\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"net/http\"\n\n\t\"github.com/julienschmidt/httprouter\"\
    \n)\n\nfunc main() {\n\tr := httprouter.New()\n\tr.GET(\"/\", HomeHandler)\n\n\
    \t// Posts collection\n\tr.GET(\"/posts\", PostsIndexHandler)\n\tr.POST(\"/posts\"\
    , PostsCreateHandler)\n\n\t// Posts singular\n\tr.GET(\"/posts/:id\", PostShowHandler)\n\
    \tr.PUT(\"/posts/:id\", PostUpdateHandler)\n\tr.GET(\"/posts/:id/edit\", PostEditHandler)\n\
    \n\tfmt.Println(\"Starting server on :8080\")\n\thttp.ListenAndServe(\":8080\"\
    , r)\n}\n\nfunc HomeHandler(rw http.ResponseWriter, r *http.Request, p httprouter.Params)\
    \ {\n\tfmt.Fprintln(rw, \"Home\")\n}\n\nfunc PostsIndexHandler(rw http.ResponseWriter,\
    \ r *http.Request, p httprouter.Params) {\n\tfmt.Fprintln(rw, \"posts index\"\
    )\n}\n```\n```"
  merge: -1
  img_proc: true
