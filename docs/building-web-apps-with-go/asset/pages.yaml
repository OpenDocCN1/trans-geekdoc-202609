  md: '# # Middleware


    If you have some code that needs to be run for every request, regardless of the
    route that it will eventually end up invoking, you need some way to stack `http.Handlers`
    on top of each other and run them in sequence. This problem is solved elegantly
    through middleware packages. Negroni is a popular middleware package that makes
    building and stacking middleware very easy while keeping the composable nature
    of the Go web ecosystem intact.


    Negroni comes with some default middleware such as Logging, Error Recovery, and
    Static file serving. So out of the box Negroni will provide you with a lot of
    value without a lot of overhead.


    The example below shows how to use a Negroni stack with the built in middleware
    and how to create your own custom middleware.'
  merge: -1
  img_proc: true
- pgno: 19
  md: "```\n```go\npackage main\n\nimport (\n\t\"log\"\n\t\"net/http\"\n\n\t\"github.com/codegangsta/negroni\"\
    \n)\n\nfunc main() {\n\t// Middleware stack\n\tn := negroni.New(\n\t\tnegroni.NewRecovery(),\n\
    \t\tnegroni.HandlerFunc(MyMiddleware),\n\t\tnegroni.NewLogger(),\n\t\tnegroni.NewStatic(http.Dir(\"\
    public\")),\n\t)\n\n\tn.Run(\":8080\")\n}\n\nfunc MyMiddleware(rw http.ResponseWriter,\
    \ r *http.Request, next http.HandlerFunc) {\n\tlog.Println(\"Logging on the way\
    \ there...\")\n\n\tif r.URL.Query().Get(\"password\") == \"secret123\" {\n\t\t\
    next(rw, r)\n\t} else {\n\t\thttp.Error(rw, \"Not Authorized\", 401)\n\t}\n\n\t\
    log.Println(\"Logging on the way back...\")\n}\n```\n```\n\n# Exercises\n\n+ \
    \  1. Think of some cool middleware ideas and try to implement them using Negroni.\n\
    +   2. Explore how Negroni can be composed with github.com/gorilla/mux using the\
    \ http.Handler interface.\n+   3. Play with creating Negroni stacks for certain\
    \ groups of routes instead of the entire application."
  merge: -1
  img_proc: true
