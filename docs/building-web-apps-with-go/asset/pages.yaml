  md: "# Unit Testing\n\nUnit testing allows us to test a `http.HandlerFunc` directly\
    \ without running any middleware, routers, or any other type of code that might\
    \ otherwise wrap the function.\n\n```\npackage main\n\nimport (\n\t\"fmt\"\n\t\
    \"net/http\"\n)\n\nfunc HelloWorld(res http.ResponseWriter, req *http.Request)\
    \ {\n\tfmt.Fprint(res, \"Hello World\")\n}\n\nfunc main() {\n\thttp.HandleFunc(\"\
    /\", HelloWorld)\n\thttp.ListenAndServe(\":3000\", nil)\n}\n\n```\n\nThis is the\
    \ test file. It should be placed in the same directory as your application and\
    \ name `main_test.go` ."
  merge: -1
  img_proc: true
