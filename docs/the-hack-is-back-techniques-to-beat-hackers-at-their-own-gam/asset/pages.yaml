    choose an effective domain for us to register and utilize.


    DNS is an effective tool for us to identify hosts and use within the reconnaissance
    stage, but we must also understand that the same information can be used against
    our attack infrastructure as well. Understanding how passive DNS attribution and
    historical records can be used to identify our systems is important. Choosing
    existing domains that have expired also gives us flexibility in how our attack
    can be launched and potentially bypass detection tools.


