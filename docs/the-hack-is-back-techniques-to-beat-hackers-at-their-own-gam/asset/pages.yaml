  md: '# 5 Vulnerability Identification


    # INTRODUCTION


    Vulnerabilities are lying dormant in every program, website, domain, and access
    control policy. The rub is in finding where they are, how they can be exploited,
    and how that exploit can be leveraged to prove an impact. We shouldn’t limit ourselves
    to only one vulnerability as well, we can combine several different vulnerabilities
    to create our exploit workflow to build the most impactful story to describe why
    it’s important.


    To effectively find and exploit vulnerabilities, we must understand foundational
    technical aspects. If we find a vulnerability but can’t explain why it’s a problem,
    or how the flaw is caused by the code, we do not stand a chance to help others
    fix the weakness. Knowing how a protocol or network is supposed to operate will
    help us quickly find unusual items. Unusual or strange items on a network and
    application generally indicate that something could be used to leverage a weakness
    – it’s our job to find out what these are and how to fix them.


    This chapter covers a crash course in computer networking before we cover identifying
    vulnerabilities. Attempting to enumerate vulnerabilities in systems without a
    foundational understanding of computer networking and concepts will significantly
    complicate detection, exploitation, and remediation efforts.


    Troubleshooting is the most effective skill any hacker or pentester will ever
    learn. Without a proper framework, identification of goals and standards, or a
    clear view of objectives, it is easy to waste hours doing nothing during a testing
    engagement. Instead, relying on troubleshooting skills with the knowledge of how
    computers and networks are designed will make us not only effective but lethal
    at what we do.


    There is only one way to guarantee a machine cannot be hacked – break it into
    millions of pieces and toss it in the middle of the ocean. While you can rest
    easy knowing that the machine won’t be compromised, you also realize that you
    can no longer conduct business with a machine broken into pieces on the ocean
    floor. All businesses, corporations, and organizations must operate with a certain
    level of risk to conduct operations, it’s our responsibility as security professionals
    to ensure that the level of risk is reduced to its lowest possible levels.


    In areas where we identify the risk is too great for the organization, we must
    clearly and concisely describe the impact and risk. This is why knowing how to
    weaponize vulnerabilities is important, so we can show an unmistakable impact
    from the vulnerability. C-Levels executives cannot ignore the fact that a directory
    traversal vulnerability on a corporate device can be used to gather intellectual
    property – the sensitive files can be presented directly to them and shown how
    they were gathered.


    To find vulnerabilities, we need to think like an attacker. Fortunately, there
    are many ways to practice using this mindset where we can learn how to find things
    that may cause issues.


    # BRILLIANT ON THE BASICS


    For United States Navy Sailors, the Brilliant on the Basics program was designed
    to help Sailors understand the fundamental resources available to them and their
    families.^1 These programs represent some of the foundational aspects of a Naval
    career and help new Sailors integrate into a command to become successful. Without
    access to and proper understanding of these programs, Sailors tend to struggle
    to be effective as a team player within their specialties. While this is not directly'
  merge: -1
