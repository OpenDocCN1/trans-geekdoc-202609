- pgno: 135
  md: 'This data is also accessible through the **Domain Hunter**<sup>10</sup> python
    tool, which identifies the reputation of expired domains as well. This can quickly
    help us identify domains with a previously clean reputation, allowing us to stay
    below the radar with detection tools. Additional benefits of this tool include
    searching for keywords and filtering based on Alexa’s top domains.


    The **domainhunter.py** script does require an active **expireddomains.net** account,
