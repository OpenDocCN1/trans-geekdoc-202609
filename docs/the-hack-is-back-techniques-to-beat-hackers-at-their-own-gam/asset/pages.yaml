- pgno: 178
  md: '# # 6 Exploitation and Reverse Shells


    # ## INTRODUCTION


    Exploitation and Reverse shells are important to understand to create an effective
    impact on the target. Identifying vulnerabilities is only half of the game, we
    need to be able to prove that these vulnerabilities can be exploited to cause
    an impact to the organization. The best way to prove an impact is to craft an
    exploit that will either give us additional access within the system or allow
    us to gather sensitive information we can use to attack further.


    Shells are interactive terminals and ways we can execute commands on an exploited
    host. Gaining a shell is commonly referred to as a “foothold” as well within the
    hacking community, as the initial access is leveraged further to user or root
    level access. This chapter covers identifying the ways we can get shells and how
    to detect them. We will explore finding exploits, using Metasploit, leveraging
    Meterpreter, and generating the exploit with **msfvenom**.


    # ## WHY EXPLOITATION IS IMPORTANT


    Exploitation is much more than simply using a vulnerability against a target,
    as we need to make sure that the exploit we launch will have an impact. After
    identifying the vulnerability and how it works on the target system, we should
    have a very good idea of what types of attacks and how the system will be vulnerable
    to an exploit. With exploitation, our job is to place a payload within the exploit
    to gain further access within the system or network.


    From a defensive perspective, we must have a clear understanding of the capabilities
    an attacker can use against us. Red-teaming and Purple-teaming are excellent ways
    to test the defenses in place to ensure they operate as expected. When high-profile
    and high-impact vulnerabilities are released, such as the Log4J vulnerability,
    organizations need to ensure that they have the expertise on hand to not only
    remediate the vulnerability but also test the implementation of the remediation
    for holes. Knowing how an attacker can gather information to use against the environment
    with detailed exploitation is critical.


    # ## EXPLOIT-DB


    Exploit-DB is the Exploit Database run by Offensive Security and is available
    at [https://www.exploit-db.com/](https://www.exploit-db.com/). This website is
    a CVE-compliant archive of exploits for known vulnerabilities and public exploits
    that can be used to attack these vulnerabilities.¹ Hosting the known exploits
    for vulnerable systems provides resources for hackers and defenders to determine
    if a vulnerable system can be exploited with public exploit code or not. As a
    note, Exploit-DB is the same place that hosts the GHDB (Google Hacking Database)
    which was covered in the Web Application hacking chapter.


    Browsing Exploit-DB is as simple as reaching the page from your web browser. There
    is a chance that workplaces and university networks may not allow traffic to this
    website, and for good reason. If a user can identify a vulnerability in a system,
    there may be a public exploit available on Exploit-DB to further attack a system.
    When opening the web page, there are several different properties for each exploit.
    The Date represents when the exploit was uploaded to the Exploit-DB, Download
    (D) is to download the exploit, Application (A) is to get a copy of the vulnerable
    application itself (to test the exploit) and Verified (V) states that the Exploit-DB
    team has verified that this exploit is effective and consistent.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_179_0.png)


    **FIGURE 6.1** Screenshot of Exploit-DB showing available exploits for various
    systems, note the different properties for each exploit.


    The exploits provided can be in many different programming languages and cover
    a wide array of affected software and hardware assets. For the most part, the
    exploits are written in Python, however, many of the exploits are written in other
    scripting languages or source code for compiled executables. Other exploits are
    simply writeups of how to achieve an exploit in the system and do not provide
    a set of code on execution. These writeups can be as simple as the HTTP request
    that was used to exploit the system, but most are not a “one-click-autopwn” to
    run the exploit instantly.


    Most of these exploits will require some type of manual change or input from the
    command line to be used to target the system we want to exploit; this is why creating
    a local copy of the exploit to modify is crucial. This is also why being able
    to review the code and understand what activity is occurring is imperative as
    well, that way we can use the exploit effectively and debug as necessary.


    There are additional tools provided by Exploit-DB such as the **searchsploit**
    command, which is a command line tool that can be used to query the Exploit-DB
    from the command line. Beyond this, we can inspect the exploit code ourselves,
    and even request a mirrored copy of the exploit directly from our terminal for
    use. For example, to search for potential vulnerabilities in an identified wpDiscuz
    WordPress plugin, we can use the command below in **Figure 6.2**.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_179_1.png)


    **FIGURE 6.2** Using searchsploit to find known exploits for wpDiscuz.


    This shows that there are three known exploits for an unauthenticated vulnerability
    that affects version 7.0.4 of wpDiscuz. Remote code execution is devastating to
    the overall confidentiality, integrity, and availability of systems, and when
    combined with an unauthenticated attack can spell major trouble. Let’s try to
    peek inside the exploit by using another searchsploit command, this time by referencing
    the “Path” given in a result. We will focus on the Python version of this exploit,
    which is labeled as **php/webapps/49967.py**. Running the command below will examine
    the exploit (think of the **-x** for examine) so we can take a peek at the exploit.


    ```

    ```bash

    searchsploit -x php/webapps/49967.py

    ```

    ```'
