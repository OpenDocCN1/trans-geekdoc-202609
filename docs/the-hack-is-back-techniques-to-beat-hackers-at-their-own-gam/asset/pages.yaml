- pgno: 281
  md: 'When I am exploring the processes, I cannot help but notice the extremely long
    string that is present as well as a hidden flag that is likely there to help this
    malicious process evade detection. Finally, I also noticed that there is a curiously
    named process prLNUjAgGaE.exe. You are not going to see typical executables with
    a naming convention of lowercase and uppercase letters, so this is also a red
    flag.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_281_0.png)


    FIGURE 9.12 Process Explorer.


    The other nice thing about Process Explorer is it will give you information about
    TCP/IP connection, including the IP Address and port (socket). In this case, we
    have a PowerShell connection to North Korea over port 4444, the default port for
    Metasploit. Outbound connections using port 4444 or PowerShell connections to
    North Korea are both something that should be avoided on any of your systems.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_281_1.png)


    FIGURE 9.13 PowerShell connection to North Korea.


    The final thing we can do is examine this subprocess of PowerShell and we will
    notice a path to an executable. Notice that this executable was placed in the
    same directory that Metasploit indicated was created when the attacker ran the
    run persistence command within meterpreter.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_282_0.png)


    **FIGURE 9.14** Path to the malicious file.


    I was able to upload the malicious file to VirusTotal and find the IP Address
    that the malware was beaconing to. VirusTotal is excellent for analyzing suspicious
    files. It is great for use if an individual user wants to look at the behavior
    of a file and even if you are partaking in a cyber competition. I would not use
    it if you are working in the DoD as an analyst and you think you are dealing with
    a state-sponsored actor as there are mechanisms (like the hash) for the bad actors
    to determine if their virus has been detected. More or less, you would be tipping
    off the hackers that you are aware of their presence and your workplace might
    also not consider the file’s information something they want in the public domain
    (It could be related to a classified matter).


    ![](img/181571ad74cba0e6a2f38fcd2658651e_282_1.png)


    **FIGURE 9.15** VirusTotal analysis of the Dropper file.


    Another great way to locate malicious activity on your system is to use the autoruns,
    another essential tool that is part of the sysinternals suite. This tool will
    help you to pinpoint what programs are set to launch at logon, and it will also
    allow you to view any services and scheduled tasks. But looking through most of
    the tabs within autoruns, you can really start to find if there are any indicators
    of malicious activity. And, if you are participating in a cyber competition or
    doing dynamic malware analysis, you can run the malicious program on a Virtual
    Machine (Windows XP, 7, and 10 work well). It is a best practice to run malware
    in a virtual machine that is running in host-only mode. Some super-cautious individuals
    take it a step further and disable VMware tools in an attempt to avoid any possible
    contamination on their host system. There is also malware that is VMware-aware,
    so uninstalling tools can be helpful if the malware is sophisticated enough to
    detect if it is running in a Virtual Environment, as it may not run under those
    conditions.'
  merge: -1
  img_proc: true
