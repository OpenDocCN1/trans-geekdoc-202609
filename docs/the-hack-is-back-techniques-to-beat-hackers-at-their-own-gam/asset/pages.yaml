    that we have control over and want to identify how to gain further access. In
    the scenario of Game Of Active Directory, the account samwell.tarly is a low-privilege
    user whose password is within the description of LDAP. To identify paths, click
    on the PATHFINDING button and then enter the starting and ending nodes. Bloodhound
    will search for ways this can be leveraged to gain access to the target.


