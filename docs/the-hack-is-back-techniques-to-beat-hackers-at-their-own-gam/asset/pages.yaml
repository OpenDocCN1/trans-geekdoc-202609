- pgno: 134
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_134_0.png)


    **FIGURE 4.23** VirusTotal analysis of [m4lwhere.org](https://m4lwhere.org) showing
    known IPs and domains currently and historically used.


    When establishing the DNS records for our services we must pay attention to where
    we are publishing the records and where they are pointing. If we are hosting several
    various phishing services on one IP address, one compromised phishing site is
    likely to reveal the others as compromised as well.


    Additionally, there are tools and techniques we can use to register recently expired
    domains. This is done with the intent to ride on the previous reputation of the
    domain before it expires, allowing attackers to exploit the trust before they
    are discovered.


    An integral part of this process is the data provided by [www.expireddomains.net](https://www.expireddomains.net),
    where recently expired and domains to expire soon are publicly available.⁹ When
    visiting this page, we can also see which pending domain expirations have the
    most backlinks as well, which are the amount of incoming links from alternate
    websites. Choosing a domain with a high number of backlinks results in a high
    likelihood of a successful watering hole attack.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_134_1.png)


    **FIGURE 4.24** [ExpiredDomains.net](https://Expireddomains.net) screenshot showing
    various domains pending expiration, sorted by backlinks. Higher backlinks result
    in a better success rate for a watering hole attack.'
  merge: -1
