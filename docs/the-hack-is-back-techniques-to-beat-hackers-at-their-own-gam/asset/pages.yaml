- pgno: 115
  md: 'Taken plainly, it is trivial to change the hash value of a file to bypass a
    hash-based threat detection. This can be done simply by adding one extra byte
    within the file — the result is a completely different file hash. The level of
    effort on the adversary’s side is minimal.


    Jumping up a few levels on the pyramid to the Tools section, we find that it is
    listed as “challenging”. This is because custom-developed or finely-tuned tools
    take a significant amount of development effort and planning. Beyond this, they
    also take time to learn how to use the tools and how they could be applied to
    an environment. Because of this reason, it is listed higher on the pyramid. It
    is much more effort to develop and learn new tools instead of changing hash values
    on a file!


    We can leverage the **Pyramid of Pain** as a part of our adversarial emulation
    techniques to explain to defenders why and how certain assets are chosen by attackers.
    Consequently, during our testing, we can determine which indicators should be
    changed and how often.


    # “DISPOSABLE” IP ADDRESSES


    Using the wide array of cloud services available on the Internet today gives us
    ample opportunity as threat emulators to establish “disposable” IPs. In this concept,
    we gather a new VPS or other online server and intend on completing a large set
    of scanning or otherwise loud attacks. If these endpoints are discovered and blocked,
    we can simply either change their assigned IP or spin up a new instance.


    # VPS PROVIDERS


    Virtual Private Servers (VPS) are used similarly to large cloud providers, where
    we can rent out a server with a public IP for a certain amount of time. This can
    give us a “disposable” place to host a server, install some packages, and use
    them for our intent.


    Each VPS provider has their own unique pros and cons, with some providers that
    block or prevent certain activity by default. For example, AWS’s EC2 service automatically
    blocks TCP 25 (SMTP) outbound which prevents us from sending phishing emails.
    By default, Hostwinds does not have such a restriction, allowing spammers to naturally
    flock there.


    If you are interested in receiving some free credits for using these services,
    consider using the following referral link and referral code when signing up for
    these services:


    +   - Digital Ocean: https://bit.ly/m4lWhereDigitalOcean


    Interestingly, TOR has a wiki page dedicated to ISPs and hosting providers who
    are Good or Bad ISPs based on how they have historically responded to takedown
    and abuse requests.^2 These lists can be used to help determine new providers
    to host TOR nodes and may allow various levels of “grey” activity.


    # Bulgaria


    | Company/ISP | ASN | Bridges | Relay | Exit | Comments | Last Updated |

    |---|---|---|---|---|---|---|

    | VPS.BG | AS34224 | Yes | Yes | Yes | They don''t collect any personal info and
    you can pay in bitcoin. | 01/11/2016 |

    | G-Core Labs | AS199524 | Yes | Yes | No | They don''t allow exits and will suspend
    your active services and restrict your access to the account if they receive abuse
    messages. KVM VPS. IPv4+IPv6 native support. * Gnu/Linux, FreeBSD and Windows
    server supported. Unmetered traffic. | 06/2022 |


    **FIGURE 4.2**  Sample of “Good ISPs” from the TOR project’s Wiki.'
