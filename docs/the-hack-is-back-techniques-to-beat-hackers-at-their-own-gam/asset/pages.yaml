- pgno: 29
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_29_0.png)


    # FIGURE 1.26 Email access after Breaking into Windows with the correct password.


    The Google password manager will likely have other logins and credentials in it
    as well. In order to reveal the credentials in the Google Password Manager, you
    must type the Windows login credentials for the account. After that, you can click
    the hidden icon to reveal the actual password used for the site. Now, roughly
    five years ago (from the time of writing), having credentials to the websites
    would have been all that was needed to get into just about any website a user
    access. Nowadays, it is very common to have to provide additional authentication
    like an SMS code to get to a website. PayPal is a great example of this and the
    password to a PayPal account is probably only going to allow a login with the
    password as well as an SMS code. Some of the accounts let you in when you designate
    the device as trusted with no SMS or password reset questions. Sites like Coinbase
    may require an app like Google Authenticator but in the past, I have been able
    to trust my device with Coinbase for 30 days. Even if you got into a Coinbase
    account, nowadays you usually need the Authenticator app to transfer large (or
    even small) amounts of Crypto. In five years, this might not have much value for
    the attacker if every site is using 2FA. I did want to mention an important finding
    I made since originally writing this chapter. If the machine is locked when you
    begin your attack, and you shut it down, and break into the machine with the steps
    described in this chapter, you actually may be able to “restore” your Chrome and
    Edge sessions without logging in to any sites (and even potentially bypass some
    2FA). I was able to do this on my systems with some success, I was able to perform
    this attack when the computer was in sleep mode (default green mode of modern
    Windows) as opposed to me completely shutting it down.


    # Password Manager


    ![](img/181571ad74cba0e6a2f38fcd2658651e_29_1.png)


    # FIGURE 1.27 Browser Password Manager.


    In the case of the Microsoft Edge browser, an attacker would also be able to recover
    the stored passwords and credentials when I provide the password for the login
    to Windows (P@ssw0rd). One site of interest listed here is creditonebank which
    has a second authentication mechanism. Either an SMS code or an email code must
    also be used to gain access to the site. But since I have access to the user’s
    Gmail account, I can get the code through email and then access the credit card
    site. Other sites tested also had this feature which is easier to bypass than
    using SMS or an app like Google Authenticator.'
