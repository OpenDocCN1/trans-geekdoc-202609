    # cURL


    Client for Uniform Resource Locators (cURL) is a command line program that allows
    users to send HTTP and HTTPS requests directly from the command line. **cURL**’s
    true magic is that it can be used to access various parts of a website effectively
    in a programmatic fashion. We can perform actions, such as sending POST requests
    with data to interact with the application as well.


    To use cURL, open up the command prompt and type **curl -h** to determine if it
    is installed or not. If it is installed, it will bring up the help information
    for the tool. Read through the help information to learn more about how to use
    **cURL**.'
  merge: -1
  img_proc: true
