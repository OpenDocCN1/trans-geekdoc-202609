  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_224_0.png)


    **FIGURE 7.18**  Right clicking and selecting “Run as Administrator” for PowerShell.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_224_1.png)


    **FIGURE 7.19**  Now we have the SeBackup privilege assigned to our session!


    Windows 10 stores the hashes for users in the registry under **HKLM\SAM** and
    **HKLM\SYSTEM**. These two registry entries are used to store an encrypted version
    of the hashes and the decryption key. With our access as a Backup Operator, legitimate
    backup operations can be used to access these files for us to gain a copy. The
    following two commands leverage the **reg** command to create a local copy of
    these entries for us to exfiltrate.


    ```

    ```powershell

    reg save hklm\sam C:\Users\backupper\Desktop\sam.bak

    reg save hklm\system C:\Users\backupper\Desktop\system.bak

    ```

    ```


    Once saved, the files can be exfiltrated from the system to our local host. Once
    we have a copy of these files, we can utilize the **Impacket secretsdump.py**
    python script to decrypt access to the hashes. We run the script in the **local**
    mode where the **system** and **sam** registry hives are parsed and decrypted
    for access. Keep in mind, we are not decrypting the NTLM hashes, but rather the
    file that stores the NTLM hashes.


    ```

    ```text

    impacket-secretsdump -system system.bak -sam sam.bak local

