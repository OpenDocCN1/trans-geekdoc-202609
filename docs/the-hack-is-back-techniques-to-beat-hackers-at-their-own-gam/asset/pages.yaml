- pgno: 32
  md: '9. Click Continue to Windows, then Windows will boot normally. Then when the
    Windows Logon screen, you will click the Ease of Access button (Utilman.exe) to
    get a command prompt.


    **It should now operate as it does normally and allow users to use the accessibility
    options.**


    ![](img/181571ad74cba0e6a2f38fcd2658651e_32_0.png)


    FIGURE 1.32 Launching the Utility Manage (Really Cmd.exe).


    # HOW TO PREVENT THIS PHYSICAL ATTACK AND SECURE YOUR SYSTEM


    Install Windows 11. Seriously, this is the first operating system that has seemed
    to address this vulnerability that could be used on every version of Windows except
    Windows NT 4, which lacked Accessibility options (and USB or FAT32 support). In
    the past, you could use BitLocker or some other type of hardware or software disk
    encryption with your Windows operating system, but Windows 11 has finally seemed
    to have closed this loop. So, to be more secure, upgrade your Windows operating
    system (Even though I personally hate Windows 11 and its wonky user interface).
    Windows 11 does have require elaborate hardware and some computers might not meet
    these minimum hardware requirements. For example, the operating system does require
    a Trusted Platform Module (TPM) chip in your PC. However, there are hacks that
    allow people to bypass those requirements. Just keep in mind that just like jailbreaking
    an iPhone or rooting an Android, unauthorized modifications such as these are
    not supported by the vendor and will most likely put your operating system at
    risk of being exploited. As someone who has used every version of Windows ever
    released, I realize learning a new version of Windows requires a significant time
    commitment to become extremely comfortable with it.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_33_0.png)


    FIGURE 1.33 The dreaded, but very secure, Windows 11 operating system.


    But before we close out this chapter, I want to alert you to the fact that not
    all versions of Windows 11 are secure from this attack. In some cases, Windows
    11 is upgraded from Windows 10 and the user is told that not “all of the features”
    of Windows 11 will work. I also noticed, and this is very important, that the
    Encryption feature does seem to protect systems when a local account is created
    “not tied to a Microsoft account”. The Microsoft Account seems to be a requirement
    of having the BitLocker encryption feature functioning properly without additional
    configuration. So, you need to go all in, which includes meeting the hardware
    requirements and signing in with a Microsoft account to have a fully secure Windows
    11. If you don’t play by Microsoft’s rules, even Windows 11 still be vulnerable
    to this method of physical attack. See below for the proof.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_34_0.png)


    **FIGURE 1.34** You did not Follow MS Guidelines and got hacked ☹.


    # SUMMARY


    In this chapter, we examined the vulnerabilities of a Windows system when an attacker
    has physical access to a machine running Windows. While getting into Windows without
    a password can be easy with the techniques described in this chapter, getting
    in and then gaining access to the user’s stored credentials in their browser require
    an attacker to take extra steps, including cracking the user’s password. Some
    of these vulnerabilities have been present in the Windows Operating system for
    more than 20 years, but Microsoft seems to be trying to faze them out with their
    newer operating systems like Windows 11. Although BitLocker has been around for
    a while now, the implementation was optional with past versions of the operating
    system. The big take away from these chapter is to use encryption, use a very
    strong password, and fully shut down your computer as opposed to using sleep mode
    when you are not using it.'
  merge: -1
  img_proc: true
- pgno: 35
  md: "# 2 Update and Change Defaults,  \nor Else!\n\n# INTRODUCTION\n\nDefault configurations\
    \ come shipped with most devices, software, and embedded devices. Manufacturers\
    \ and developers create these default configurations as a way to initially log\
    \ into and set up the device when purchased; however, in most scenarios, users\
    \ never bother to remove or replace these materials. This leaves the known credential\
    \ material available for most attackers, usually only a Google search away, to\
    \ attempt to log into an Internet-connected machine.\n\nThe problem of default\
    \ passwords is so pervasive that CISA has established the “Secure by Design” program,\
    \ used to educate the public and developers about these dangers. Internet-exposed\
    \ devices with easily guessed credentials can easily be leveraged for further\
    \ access into affected networks, this is described in detail later in this book.\n\
    \nBeyond default passwords is the issue with known exploited vulnerabilities.\
    \ As weaknesses are found and disclosed in a product, they are labeled with a\
    \ CVE (Common Vulnerabilities and Exposures) number. For the year 2023, 52,286\
    \ CVEs were created – this means that over 50,000 previously unknown vulnerabilities\
    \ were discovered and reported! While thousands have been published, only a small\
    \ fraction of these CVEs are leveraged by Threat Actors in the wild for impact.\
    \ CISA keeps track of these with the Known Exploited Vulnerabilities (KEV) catalog,\
    \ letting organizations understand which vulnerabilities are being actively exploited\
    \ in the wild. To learn more about CVEs and even how to find your own and report\
    \ them to MITRE, see [Chapter 5](#) on Vulnerability Identification!\n\nNow before\
    \ we can try to use these types of attacks, we need to find devices to test first.\n\
    \n# SHODAN\n\nThe organization Shodan constantly scans and indexes Internet-accessible\
    \ devices to post publicly on their website. This makes it an incredibly powerful\
    \ and innovative tool that can help us understand and find assets for our organization.\
    \ Shodan is a search engine specifically designed to locate and analyze connected\
    \ devices on the Internet, offering an extensive database of information about\
    \ them. While it may seem controversial to some, its capabilities can truly benefit\
    \ organizations in numerous ways."
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_36_0.png)


    FIGURE 2.1 Shodan homepage at www.shodan.io.


    One of the most valuable features of Shodan is its ability to find outdated services.
    This is crucial for any organization to maintain the security and efficiency of
    their system infrastructure. Outdated services, such as old versions of software
    or firmware, can be a major vulnerability that hackers can exploit. By simply
    inputting specific search criteria, such as software versions or specific protocols,
    Shodan can quickly generate a comprehensive report highlighting any potential
    vulnerabilities. This saves significant time and effort that would have otherwise
    been spent manually scanning each device.


    # SEARCHING


    To begin, we can start by searching for a specific organization name or website.
    In this scenario, we’ll start by searching for assets available for the Tesla
    organization using the filter org:tesla. This searches the Shodan database for
    any organizations tied to Tesla, which can include some false positives for organizations
    with Tesla in their name that are not affiliated with the Tesla corporation. From
    our search in Figure 2.2, we’ll notice we have 948 results returned.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_37_0.png)


    # FIGURE 2.2 Searching for the Tesla organization using the Shodan search filters.


    We can narrow down this information further as well by selecting specific ports
    to analyze. Transmission Control Protocol (TCP) port 3389, known for Remote Desktop
    Protocol (RDP), is heavily targeted by threat actors due to its exploitability
    and access granted. Because of how commonly it is leveraged in attacks, RDP is
    lovingly referred to as “Ransomware Deployment Protocol” by many security researchers.
    To narrow down our results, we can add another entry to our search, updating it
    to now `org:tesla port:3389`. This reduces our results down to two from 948!'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_38_0.png)


    FIGURE 2.3 Searching for only port 3389 for RDP and identifying an open RDP port
    with a screenshot!


    However, paying close attention to Figure 2.3 shows the domain is for teslacorp.co.uk.
    Some Google research shows that this domain does NOT belong to the Elon-famous
    Tesla Corporation, but instead an unrelated Security business in the UK.


    Additionally, Shodan provides detailed information about each discovered device,
    including open ports, banners, and even screenshots in some cases. This information
    can aid organizations in thoroughly assessing the security posture of their network
    and identifying any weak points that need immediate attention.


    # Industrial Control Systems


    Shodan additionally supports searching for exposed ICS interfaces and systems.
    This can be accessed by clicking on the Explore button, and then the Industrial
    Control Systems button after.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_39_0.png)


