- pgno: 147
  md: 'related to computer hacking, we can apply the concept of foundational knowledge
    to expand and enforce our work within the cyber field. we can apply the concept
    of foundational knowledge to expand and enforce our work within the cyber field.


    In the cybersecurity world, we can apply this same principle to learning the ins
    and outs of foundational theory about how computer networks and computer systems
    operate. Without a rock-solid understanding, how can one hope to have a chance
    to effectively break something? Let’s start by learning how computers communicate
    with each other and how these protocols operate.


    # ## Computer Networks


    Networks are designed to allow computers to speak to each other and across the
    Internet, allowing the transfer of information to effectively conduct business.
    The use of computers and technology within business has exploded over the last
    few decades, allowing operations to be completed in a much more effective manner.
    It makes perfect sense to have organizations continue to purchase and implement
    new devices and programs as they allow more business to be conducted faster, during
    off hours, and more accurately.


    The proliferation of networked devices also leads to an increased footprint and
    attack surface for most organizations. Since these devices need to be connected
    to the network, they can be accessed remotely. An estimated 30.1 billion<sup>2</sup>,
    leading to many new areas of attack for businesses.


    For a device to communicate with another device, they need to speak the same language.
    If I don’t understand French, it doesn’t matter how much French you speak to me
    – it would be hopeless since I don’t have a clue. However, if you were to speak
    English to me, I would be able to accurately understand and participate in the
    conversation. I may have a small chance with Spanish as well, but English would
    certainly be the best hope!


    The same idea applies to computer systems – they must be speaking the same language
    to understand each other. But who gets to decide what the language is? What is
    the language? Is it possible to change the language as well? Well good news, there
    are established standards, procedures, and protocols that computers must follow!


    # ## OSI Model


    The 7-layer Open Systems Interconnection (OSI) model is used to describe how data
    is packaged and encapsulated before it is sent across a network to find its proper
    destination. A strong understanding of these layers is critical in not only hacking
    but also troubleshooting systems and services. This model was developed by the
    International Organization for Standardization (ISO) to standardize how data is
    encapsulated and transmitted across a network.


    The OSI model is constructed in a set of seven layers, where each layer communicates
    directly with the layer above or below it. Each layer is independent of each other
    as well, which means that the type of data in layer seven does not affect how
    the data is transmitted on layer three. Each layer encapsulates, or adds headers,
    around the previous layer to effectively keep track of and manage the current
    layer’s information. This allows our data to be transmitted across an ethernet,
    Wi-Fi, coaxial, or fiber physical network without any effect on how the data is
    presented to the destination application.'
  merge: -1
  img_proc: true
- pgno: 148
  md: "# **TABLE 5.1**  \n**Layer Number, Name, Unit, and Description for the OSI\
    \ Model**\n\n| # | Layer Name | Unit | Description |\n|---:|---|---|---|\n| 7\
    \ | Application | Datagrams | Provides network services directly to end-users,\
    \ facilitating communication between applications and enabling user interactions\
    \ with the network. |\n| 6 | Presentation | Datagrams | Handles data representation\
    \ and encryption, ensuring that information sent by one application can be understood\
    \ by another. Encryption occurs at this level. |\n| 5 | Session | Datagrams |\
    \ Establishes, manages, and terminates sessions between applications, allowing\
    \ synchronization and checkpointing of data exchanges. |\n| 4 | Transport | Segments\
    \ | Provides end-to-end communication between hosts, ensuring reliable and efficient\
    \ data transfer, flow control, and error recovery. |\n| 3 | Network | Packets\
    \ | Manages logical addressing and routing of data packets between different networks,\
    \ enabling internetwork communication. |\n| 2 | Data Link | Frames | Handles the\
    \ reliable transmission of data frames over a specific physical medium, providing\
    \ error detection and correction. |\n| 1 | Physical | Bits | Deals with the physical\
    \ transmission of data, including electrical, mechanical, and physical aspects\
    \ of network communication. |\n\nAs the data is passed down from layer seven to\
    \ layer one, the unit referred to the data can change as well. Since we deal with\
    \ application data to send across the network, we refer to layers seven, six,\
    \ five, and four as data or datagrams. Layer four, the transport layer, the data\
    \ unit is now a segment. Once the data reaches layer three, the unit changes into\
    \ packets, which is used to describe the information as it travels across an IP\
    \ network. Layer three passes the packet to layer two, where the packet is transformed\
    \ into a frame. The frame is used to switch packets around the network at layer\
    \ two. To physically transmit the frame, the frame is passed to layer one which\
    \ transforms the frame into a set of bits. The bits are physically sent across\
    \ the wire (or for Wi-Fi, across the radio spectrum), where they are received\
    \ by the remote networking device.\n\nOnce received by the destination, the bits\
    \ are translated back into a frame to be interpreted by layer two. Then, the frame\
    \ is translated into a packet for an IP network. After, the packet is converted\
    \ to a datagram where it is passed to the transport layer and continues up the\
    \ stack until it reaches the intended application. This is the same process as\
    \ how the information is sent, just converted backward to remove the encapsulation\
    \ as it was applied to the information.\n\n![](img/181571ad74cba0e6a2f38fcd2658651e_148_0.png)\n\
    \n**FIGURE 5.1** Passing down the OSI model stack, onto the physical medium to\
    \ be transmitted as bits, then interpreted by the destination on each layer.\n\
    \nAs hackers, we must understand how this information is passed around a network.\
    \ As we peek into networks to search for vulnerabilities, understanding how a\
    \ normal network should operate gives us insight into unusual activity. These\
    \ strange and unusual items should be investigated further to help determine if\
    \ they are weaknesses which could be exploited by an attacker."
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Layer 1: Physical


    The lowest layer is the physical layer of the OSI model. These are the physical
    cables and wireless radio signals which are used to transmit information across
    the network. To check if we have layer one connectivity, the various media methods
    generally have a light or status symbol to show that a cable is connected with
    some type of data being transmitted.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_149_0.png)


    **FIGURE 5.2** Ethernet lights show that the cable is connected and receiving
    data.


    The lights shown in [Figure 5.2](#figure-52), lovingly referred to as “blinkies,”
    help us get a physical indication that the cable is plugged in on both ends, with
    some type of bits being transmitted. However, the presence of the blinking lights
    does not indicate that proper network flow and connectivity are established. Instead,
    this means that layer 1 is operating properly.


    Keep in mind, each layer is independent of each other. But when we’re troubleshooting
    issues, we must always narrow down the problem as much as possible. The presence
    of the blinkies lets us know that the issue is at a higher layer and for us to
    continue troubleshooting. We should continue to investigate higher layers to help
    determine where the problem exists.


    # Layer 2: Data link


    Layer two is an interesting layer that directly interfaces with the physical aspects
    of layer one and determines what activity the frames should take on the local
    network. This layer deals with MAC addresses, which are used to find the destination
    port intended for the frame to arrive at. The purpose of the Data Link layer is
    to provide node-to-node transfer between two directly connected hosts.


    Technically, this layer is split into two sub-layers: the Medium Access Control
    (MAC) and the Logical Link Control (LLC). The MAC is used to interface and direct
    with the hardware media and physical layer, while the LLC is used to help with
    multiplexing, error checking, and communications with higher layers in the OSI
    model.³ Both of these sub-layers are used in conjunction to help the data link
    layer operate effectively to convert bits into frames, packets, and ultimately
    data.


    Layer 2 uses the Media Access Control (MAC) address on a computer’s Network Interface
    Card (NIC) to help determine which system should be receiving a set of frames.
    Each MAC address is a 48-bit globally unique address. The first 24 bits of the
    address are known as the Organizational Unique Identifier (OUI), which is assigned
    to an organization that produces NICs. The OUI can be used to determine what type
    of device likely exists on the other end of the network—for example, the OUI **00-00-AA**
    indicates that the device was likely manufactured by Xerox and has the potential
    to be a printer on the network. MAC addresses are not designed to be changed but
    can be easily modified with administrative privileges.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_149_1.png)


    **FIGURE 5.3** OUI lookup using the Wireshark Foundation’s OUI lookup tool.'
