    SMB 192.168.56.23 445 BRAAVOS [*] Windows Server 2016 Standard Evaluation 14393
    x64 (name:BRAAVOS) (domain...

    SMB 192.168.56.22 445 CASTELBLACK [*] Windows 10.0 Build 17763 x64 (name:CASTELBLACK)
    (domain:north.sevenkingt

    SMB 192.168.56.1 445 server_name [*] WORKGROUP\robb.stark:sexywolfy STATUS_ACCESS_DENIED

    SMB 192.168.56.1 445 server_name [*] Error enumerating shares: STATUS_ACCESS_DENIED

