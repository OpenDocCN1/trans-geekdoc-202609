    # *Certificate Transparency Logs*


    The Certificate Transparency Logs are a set of hostnames and certificates that
    are required to be published by a Certificate Authority (CA) upon issuance of
    a certificate. This is to ensure that the digital certificate ecosystem is open,
    accessible, and trustworthy for the Internet at large – a byproduct of this allows
    us to enumerate additional subdomains. The **amass** and **subfinder** tools use
    these logs to help find more hostnames, however, manual analysis can reveal new
    and interesting subdomains.


    Several websites can be used, one of this author’s favorites is the **crt.sh**
    website ([https://crt.sh](https://crt.sh)). The Censys website ([https://censys.io](https://censys.io))
    is another wonderful resource as well.


    It’s not unusual to add additional **Matching Identities** that have an internal
    domain scheme, such as **.local** for the certificate. Many organizations leverage
    DMZ hosts which share both an internal and external hostname – reviewing the certificate
    transparency logs can help us uncover this intelligence. For the certificate,
    many organizations leverage DMZ hosts which share both an internal and external
    hostname – reviewing the certificate transparency logs can help us uncover this
    intelligence.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_69_0.png)


    **FIGURE 3.4**  Reviewing the certificate transparency logs at crt.sh to help
    enumerate new subdomains.


    DNS is a key tool in modern networks today. Large organizations will have a very
    large DNS footprint, especially within developer-heavy organizations. These types
    of companies will likely allow certain subdomains to be automatically registered
    and updated within DNS, such as **qa.m4lwhere.org**, where developers can register
    their test machines underneath. QA and Testing machines almost always are less
    secure and can likely leak credentials for plunder.'
