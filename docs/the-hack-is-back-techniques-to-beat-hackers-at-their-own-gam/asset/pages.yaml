  md: 'To further enhance our exploit, we can use Metasploit encoders to try and obfuscate
    the payload further. Since Metasploit is an open-source and widely used application,
    Windows Defender and other endpoint protection systems have been able to quickly
    identify exploits based on known signatures. Using encoders changes the payload
    and how it is stored and accessed during the exploit, which can help try to obfuscate
    the payload from detection.


    To use an encoder, we need to list the available ones first to know what we’re
    looking at. Just like the payloads and formats, we can list the encoders with
    msfvenom -l encoders. There are many different types of encoding we can use, and
    we need to ensure we use some that match the type of payload we’re trying to deliver.


