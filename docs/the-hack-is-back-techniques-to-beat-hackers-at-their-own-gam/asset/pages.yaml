- pgno: 47
  md: '# Glitchomatic Printware


    > "Printing made... interesting!"


    # Settings!


    Welcome to the enchanting world of LDAP configuration for the Glitchomatic printer,
    where the boundaries of sanity and technicality blur in delightful harmony. Brace
    yourself for an exhilarating journey as we delve into the realm of directory services
    and embark on the whimsical quest to tame the wild LDAP beast.


    Logged in as: admin

    Logout

    Print

    Print Logs

    Network Settings

    Find Users

    Documentation

    Credentials for the ldapprinter account are stored here


    Protocol: ldap

    Server: 192.168.40.198

    Port: 389

    Username: ldapprinter@goblins.local

    Password: ********

    Save  Reset to Last Known Good


    FIGURE 2.15  After logging in as the Admin on the printer, we can see there is
    a set of configured credentials on the device.


    Now within this page, we can see that there is a configured set of credentials
    for LDAP. While it shows there''s a password field, it''s important to note that
    inspecting this field reveals that the password is not stored here. It is likely
    that the password remains on the printer and is intentionally not returned to
    the webpage to protect the credentials.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_47_0.png)


    ```

    <!-- We can''t place the password in the DOM, that would be crazy!! -->

    <tr>

    <td></td>

    <td>

    <input type="password" name="password" value="********" < td> -- $0

    </td>

    </tr>

    </tbody>

    ```


    FIGURE 2.16  Identifying that the password is not in the DOM and is likely a placeholder.


    However, since we have administrative access to this device, instead of trying
    to get the password onto the website, we can redirect where the printer will send
    the password. Instead of having it bind to the IP at 192.168.40.198, we can configure
    it to connect to us – where it will use its stored password!


    To accomplish this, we will change the Server on the Network Settings page. Be
    careful not to change the username or the password, as it can easily overwrite
    the credentials we''re trying to access. If we overwrite these, then we lose the
    chance we had at gaining further access (including a chance to take down operations
    for a paying customer – not good!).


    After starting up a simple netcat listener with nc -nvlp 389 on the host we control,
    we can try to test the connection. Looks like we''re very successful!'
  merge: -1
  img_proc: true
- pgno: 48
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_48_0.png)


    FIGURE 2.17 Successfully stealing a set of credentials in plaintext by redirecting
    where the printer sends them.


    Since LDAP sends the password in plaintext, we’re able to use this to connect
    to the domain with our new credentials. This type of attack is known as a Pass-back,
    where we can change where the credentials are being sent. Generally, this is effective
    in gaining the initial foothold in an environment.


    # UNPATCHED SERVICES


    Unpatched services continue to be an important infection vector in most environments.
    This is because patching cycles for many companies tend to lag behind the ability
    of threat actors to exploit them. This delta between patching availability and
    upgrades can create an attack window that allows initial access into environments
    – there are many well-known global cyber attacks where this has occurred.


    For us as white-hat hackers, we need to be able to scan and enumerate known missing
    patches to remediate the risks. We can leverage a few different tools to help
    find these threats, many paid tools do excellent work finding these as well.


    # WannaCry


    The WannaCry attacks which occurred in May 2017 resulted in a global cyber attack
    exploiting known weaknesses in the SMB protocol. These vulnerabilities were addressed
    by Microsoft in security patch MS17-010 on March 14, 2017, where they stated that
    successful exploitation could result in remote code execution if an attacker sends
    specially crafted messages to a Microsoft Server Message Block 1.0 (SMBv1) server.


    On May 12, 2017, two months after Microsoft released their patch, the WannaCry
    attacks began to replicate on the Internet. As a worm, WannaCry infected a device
    which was then used to launch additional attacks against other machines. This
    resulted in over 230,000 infected machines within the first day of the attack.²'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_49_0.png)


    FIGURE 2.18 Screenshot of the WannaCry ransom. This occurred by exploiting a vulnerability
    that had a patch available for two months.


    What is important to understand from WannaCry is that the patches were available;
    however, many organizations did not bother to install these fixes. This delta
    gave threat actors the time to weaponize the exploit to create the worm. Organizations
    should additionally prioritize patching based on severity and applicability to
    their network. A critical level of severity for services they operate should have
    a rapid patching cycle instead of waiting for regular patching windows. Beyond
    this, organizations should understand what ports and services are available to
    the Internet – if SMB wasn’t available to the Internet, attackers wouldn’t be
    able to exploit WannaCry.


    # MOVEit


    The MOVEit attacks of 2023 continue to be a compelling narrative for patching.
    While the exploit exposed a previously unknown vulnerability, Progress Software
    created and released a patch within two weeks of the initial exploitation. However,
    threat actors were able to continue to exploit this vulnerability for months after
    the patch was released.


    The Cl0p ransomware group found and exploited a zero-day SQL injection vulnerability
    (CVE-2023-34362) that allowed them to inject malicious SQL commands and access
    sensitive data. These attacks initially began on May 27, 2023 – Progress Software
    did not release a patch until June 6. This delta between attacks and patching
    availability created a dangerous vulnerability window for many organizations;
    at this point, many administrators decided to remove their MOVEit services from
    the Internet.'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'This vulnerability affected a significant number of organizations across the
    globe, as many enterprises and government agencies relied on the MOVEit software
    to store and transfer data. Awareness of the attacks to remove services from the
    Internet before patches were available was an important factor in these attacks.
    Additionally, the ability to quickly install new patches once they were ready
    was important.


    # FINDING KNOWN VULNERABILITIES


    There are many different tools we can leverage to try and locate the existence
    of well-known vulnerabilities. These will give us the information we need to apply
    patches and reduce risk to acceptable levels. In environments where there’s a
    significant exposure window, such as being available on the Internet, we need
    to ensure these vulnerabilities are patched rapidly.


    # Nuclei


    The Nuclei toolset, described in detail in later chapters, is a template-based
    vulnerability scanner built by Project Discovery. Based on known vulnerabilities
    within their applicable templates, they will scan for these misconfigurations
    or known vulnerable versions of software. These findings are reported to the operator
    in a simple interface, allowing them to understand and take applicable action.


    For the case of the MOVEit vulnerability, CVE-2023-36934, we can use one of the
    community templates available for Nuclei. This will search for the exploitable
    condition within a detected MOVEit instance and report back if vulnerable. Based
    on the blog post by Project Discovery (Jaiswal and Maini), this template will
    report vulnerable instances quickly to the operator for information.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_50_0.png)


    FIGURE 2.19 Using Nuclei''s MOVEit template to locate and report on a vulnerable
    MOVEit instance.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Nuclei’s capabilities go far beyond finding vulnerabilities in MOVEit. Currently,
    there are over 7,400 templates available to the community to find various vulnerabilities.
    Each of these templates searches for a specific condition and reports based on
    their findings.


    It’s important to keep in mind that Nuclei is a fully open-sourced scanner and
    vulnerability template toolset. This allows the entire community to benefit from
    the available templates and new detections as they are added to the toolset. As
    with most other open-source tools, they are strengthened when other contributors
    add new capabilities and templates to find more pieces of risk. Contributing a
    template is straightforward, and this author has contributed several to Project
    Discovery and recommends others to do the same.


    # GREENBONE SECURITY ASSISTANT


    The Greenbone Security Assistant, also known as OpenVAS, is an open-source vulnerability
    management tool that can scan for misconfigurations and missing patches. This
    platform can be installed and uses a web interface to manage and track vulnerabilities
    as they are found on a system. This tool can be installed in a few different ways
    and is written in their documentation at https://greenbone.github.io/docs/latest/.


    Once installed, we can log into the web interface and see the toolset available.
    There are a few dashboards initially present, as well as the ability to create
