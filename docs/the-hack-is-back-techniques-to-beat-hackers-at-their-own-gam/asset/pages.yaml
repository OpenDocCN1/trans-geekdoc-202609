    One question people often ask me is what advice do you have for someone taking
    the fill in the blank certification exam? I say the best thing that you can do
    is ask someone who has already taken and passed the exam what resources they used
    and recommend. You can always look on Amazon and Udemy for certification exam
    preparation materials. Be careful to read the reviews as some of the study material
    is more helpful than others. Avoid any type of brain dump sites that illegally
    acquire the questions and answers to these exams. Using these sites is not only
    unethical; it is a violation of the terms that you agree to when you take your
    exam. The good news is there is definitely an overlap of topics from exam to exam.
    Practice lots of multiple-choice and simulation questions. Many are free online.


    If you are in the military, often you can get the costs of certification exams
    covered. Some of the exams cost much more than when I took many of them 20+ years
    ago. Most colleges, universities, and training providers have relationships with
    Cisco, Microsoft, CompTIA, and EC-Council and they have discount voucher programs
    which can save you a significant amount of money on each certification exam. And
    it is very important after you pass the exam that you complete Continuing Education
    Credits (CEUs) which in most cases are required for you to renew your certification
    (this is typically done every three years).


    It helps to know other cybersecurity-minded people who you can discuss and bounce
    ideas off. There are local meetup groups, hackerspaces, and local ISC2 chapters.
    Find people in your local area who work and are interested in cybersecurity so
    you can network with them. Although Reddit and Facebook do offer ways to collaborate
    with others, it is also important to have face-to-face meetings with people.


    One thing I definitely recommend is to participate in IT and Cybersecurity conferences,
    especially ones that are low-cost or free. If you are a student or in the military,
    many of these events can be at no cost. BSides is a very low-cost conference that
    is held at various locations throughout the United States, Canada, Europe, Australia,
    India, Latin America, the Caribbean, and other venues throughout the world. BSide
    conferences often include training, capture-the-flag competitions,'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'lock-picking villages, and lots of cool presentations. The one in Baltimore
    (BSides Charm) has a retro video game arcade night. It is a good idea to meet
    others, collaborate and talk about cybersecurity, and build up your social network.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_315_0.png)


    **FIGURE 10.31**  BSides Conferences link: http://www.securitybsides.com/w/page/12194156/FrontPage.


    And, of course, we must mention the annual Defcon conference that takes place
    in Las Vegas Nevada each year. This conference typically follows the very corporate
    (and much more expensive) BlackHat. Although DefCon used to be much cheaper, it
    still came in at under 500 dollars for 2023 (it used to be way cheaper as it appears
    I paid 280 dollars cash in 2018). At one time, they only accepted cash although
    I was able to pay with PayPal in 2022, when the conference re-emerged as an in-person
    event after the COVID-19 pandemic.


    Defcon will definitely provide you with some great learning experiences outside
    of the classroom and workplace. There are different villages like Wi-Fi hacking,
    Car Hacking, IoT, Lock picking, Social Engineering, and others (there is even
    one for HAM radio). There are also lots of competitions, presentations, and other
    social; events that you can get involved with like a 5k, BBQ, parties, and other
    events. It is a must-go event at least once in your career. Many corporations
    and agencies will pay for their employees to go to Defcon (and even BlackHat)
    so their workforce can be trained and aware of some of the latest trends in cyber.
    DoD Employees also often attend but have strict limitations about discussing their
    job role and function, backgrounds, and what they might be able to present in
    front of an audience. One final thing to mention is the cool Defcon badge you
    receive'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'when you attend the conference. It is also something that you can utilize your
    hacking skills to show off to others in attendance at the event. You can get more
    information about the Defcon conference and all it has to offer at the following
    link. https://defcon.org/html/links/dc-faq/dc-faq.html. It is held in August,
    and BSides Vegas follows Defcon.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_316_0.png)


    FIGURE 10.32 Defcon 2018 badge.


    Finally, when it comes to the job interview, make sure that you are well prepared
    with lots of hands-on knowledge and have lots of exposure to Linux, Windows, commands,
    and tools commonly used in the industry (Wireshark, Metasploit, Kali, VMware,
    etc.). Employers and people in the field tell me that they do not want people
    who know the theory behind cyber, but rather the hands-on skills needed to do
    the job. In the interview describe your personal network and all Virtual Machines
    you have set up and the projects you are currently working on. Talk about the
    CTFs that you have participated in and the writeups you went through and what
    you learned from reviewing them. Talk about the conferences you have attended.
    Be excited about all cybersecurity has to offer. Never try to come across as arrogant
    as there are always new things for all of us to learn and there is always someone
    out there who knows more than you (possibly in the interview). Tell them (and
    hopefully it is true) that you are very passionate about IT and learning new things
    (for example, hacking your Wii) is your idea of fun on a Friday night. A true
    passion will help with a fulfilling Cyber career.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_316_1.png)


    FIGURE 10.33 Hacking on New Years Eve.


    # SUMMARY


    Cybersecurity is a relatively new job field and academic discipline compared to
    History, English, Art, or even Computer Science. The amount of job openings in
    cybersecurity is staggering, and if you find this type of work to be fun, you
    are in a wonderful position. Cybersecurity is a somewhat unconventional job sector
    because people who may not be strong in math or some of the more'
  merge: -1
  img_proc: true
- pgno: 317
  md: traditional academic subjects (like English literature) can be some of the top
    individuals in the entire field. Employers are often more interested in your certifications
    and to know if you were part of the cyber team and what competitions you participated
    are and how you set up your home network as opposed to what research papers you
    contributed to much like in the more traditional fields of academia. There are
    so many resources for anyone to get started, today, on their cybersecurity journey.
    And, finally, and most importantly, you do not need to attend an Ivy League school
    or spend an inordinate amount of money to get top notch cybersecurity training.
    Please check your local community college for a program and then continue your
    education at a transfer-friendly university for community college students, like
    the UMGC or others, to finish your degree and further increase your cybersecurity
    salary.
