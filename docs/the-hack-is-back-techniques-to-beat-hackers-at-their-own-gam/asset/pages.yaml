- pgno: 260
  md: 'When accessing a Windows system, the attacker will often examine the root of
    the drive and then be presented with serval paths that they can navigate to within
    the file system. Sometimes time is of the essence, so this is not training time
    to learn how to navigate and find what they are looking for. Where would you go
    first if you were presented with the folders displayed in the meterpreter listing
    in Figure 8.11? When presented with these choices, some people suggest going into
    the Windows directory but that is where the Operating System files are stored.
    You will see a Windows directory on pretty much every version of Windows made
    in the last 25 years, so it is not typically a place where an attacker would look
    for anything worthwhile (although it might be a good place for the attacker to
    hide their malware). Program Files also would not be a worthwhile place for the
    attacker to look through as that will only provide a list of some of the installed
    applications like Microsoft Office, VMware Workstation, Wireshark, and other software
    tools. The Users folder is one that could be of interest depending on what the
    operating system is. If it is a client-based Operating System like Windows 11
    or Windows 10, it will have items like Documents, Pictures, Browser History, and
    likely other common things a typical user stores on their desktop. If it is a
    Server Operating System like Windows 2022 or Windows 2019 server, typically end
    users do not keep a lot of personal files stored on a Server because they are
    likely maintained by multiple people with administrative access to the machine.
    For security purposes, it is best not to use your Server for browsing the Internet
    and the Server even comes with some Enhanced built-in protection settings for
    the Browser. Another directory that might seem worth inspecting is inetpub. The
    inetpub directory (by default) stores the files for a Microsoft Internet Information
    (IIS) server. Typically you will see a wwwroot directory in that folder which
    holds the webpages which will be sent to the end users when they access the website.
    There is also a ftp root directory (even on Server 2022) that will be present
    if someone has installed a File Transfer Protocol (FTP) server. Since these may
    contain files that are accessible to anyone over the network, it is not usually
    where the proprietary or important information is located. However, these directories
    can be fantastic to use for data exfiltration (shown later).


    The most likely place to find some good nuggets with documents and other files
    with information relevant to the company or organization is in the network shares.
    In this case, the shared folder is used on the network as a place where users
    throughout the enterprise can work collaboratively to share and store their files.
    A hacker wants unique information that companies do not want in the public domain.
    From my perspective, having your Intellectual Property (IP), source code, blueprints,
    secret recipes, prescription formulas, or other types of trade secrets stolen
    is about as bad as it can get. Data loss and the compromise will need to be publicly
    disclosed to shareholders, employees, and the public, and state, national, and
    international disclosure laws are becoming more prominenet. It is very embarrassing
    to have to disclose this type of breach but, unfortunately, it has also been relatively
    common.


    For stealing the data, hackers often leverage some of the tools within the Metasploit
    framework. I have been using Metasploit since the earliest versions and even had
    a chance to chat a few times with H.D. Moore who created Metasploit. Metasploit
    is free and included with the Kali distribution of Linux.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_260_0.png)


    FIGURE 8.12 Metasploit framework.'
  merge: -1
  img_proc: true
