- pgno: 199
  md: 'Beyond this, we can also supply custom template executables that Msfvenom can
    infect. This is effective if we know the target uses a custom executable or some
    type of other critical program that we can get our hands on. To use a different
    template file, we can use the **-x** flag and provide the executable which will
    be used. Metasploit also states that when using a custom 64-bit template with
    a 64-bit payload to use the **exe-only** format instead of the **exe** format.
    One example of this is below:


    ```

    ```bash

    ./msfvenom -p windows/x64/meterpreter/bind_tcp -x /tmp/templates/64_calc.exe -f
    exe-only > /tmp/fake_64_calc.exe

    ```

    ```


    # DEFENSIVE PERSPECTIVES


    From the defender’s perspective, it is important to understand the various ways
    that adversaries can use exploitation and construct payloads to gain access. By
    knowing how to do this activity, defenders can test their systems to ensure that
    they can adequately protect against these attacks. As new tools are released by
    attackers and new bypass techniques are discovered, defenders are armed with the
    toolset to test how their environments may respond.


    As discussed in Chapter 7, there is a project named Atomic Red Team which leverages
    testing individual MITRE ATT&CK IDs. The concept behind the Atomic Red Team is
    to simplify identifying if established security controls operate as intended when
    an attack occurs. Similarly, if we consistently test our systems the way attackers
    would, we have a better understanding of how to detect them and prevent them.


    # SUMMARY


    There are many benefits with learning how to use and detect exploitation tools
    for penetration testing and purple teaming. Aspiring cyber professionals should
    take the time to learn how to use these tools effectively and defend their systems.


    # NOTES


    +   1. https://www.exploit-db.com/

