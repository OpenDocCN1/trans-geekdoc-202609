- pgno: 267
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_267_0.png)


    **FIGURE 8.23** Reverse shells send out the information in plain text.


    Before we cover some of the techniques that can be utilized to exfiltrate data
    with a command prompt, we will examine how the firewall may impact this scenario
    for the hacker. If the firewall is not allowing any inbound traffic that will
    be redirected to ports and services on the internal network, the hacker has a
    much more challenging task on their hands to get the data out of the network.
    If, for example, the Windows 2022 Server is a web server, then we can leverage
    that web server to exfiltrate the data.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_267_1.png)


    **FIGURE 8.24** An internal network protected by a firewall.'
