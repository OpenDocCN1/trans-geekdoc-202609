- pgno: 133
  md: 'This script is simply the beginning of the possibilities that we can use the
    TOR network for. At a surface level, this script retrieves a TOR identity, submits
    a request to [icanhazip.com](https://icanhazip.com) to validate the IP, requests
    a new TOR identity, and then gathers another IP response from the [icanhazip.com](https://icanhazip.com)
    website. Knowing that we can dynamically and programmatically route our requests
    across TOR gives us nearly endless possibilities for what we can achieve.


    Identifying and preventing access to TOR on enterprise networks is difficult but
    can be easily simplified by applying Cyber Threat Intelligence. The ephemeral
    nature of TOR nodes results in many new nodes appearing every day, it is simply
    impossible to manually keep up with the rate of changes. Therefore, applying dynamically
    updating CTI is critical to the overall security of the enterprise network from
    the threats that TOR gives.


    # PASSIVE DNS AND DOMAIN REGISTRATION


    As hosts and systems are connected with DNS records on the Internet, they leave
    a permanent record of what IP addresses were associated with DNS records. This
    can indirectly expose our infrastructure and systems to additional scrutiny or
    disclose where we host services. Passive DNS includes the historical data linking
    IPs back to domains, where current DNS is used to determine where present services
    can be found.


    There are several providers which can show us this data. **VirusTotal** and **PassiveTotal**
    are two of the most effective providers to gather some of the DNS data. These
    results show that there are several known subdomains for a website, and even which
    IP addresses have been known to associate with their domains.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_133_0.png)


    **FIGURE 4.22** PassiveTotal analysis of [m41where.org](https://m41where.org)
    which shows various subdomains used historically.'
