- pgno: 213
  md: '# Backups for Everyone


    It is common for sysadmins to create a tarball or some other type of archive in
    a world-readable directory such as /tmp or /var, download the backup, and leave
    the archive on the local system. This is because sysadmins are concerned about
    operational uptime and resiliency, and do not pay much attention to what a local
    attacker on the system might be able to access. Can we blame them? Not too much,
    considering sysadmins are focusing on operational capabilities – this is where
    our expertise comes in.


    Along this same train of thought, sysadmins are generally very good at checking
    and disabling risky services that they know are not supposed to be public-facing.
    For example, many are excellent at ensuring that database ports such as 3306 (MySQL)
    or 1433 (MSSQL) are not accessible across the Internet. However, in this author’s
    personal experience, sysadmins do not pay nearly as much credence to the readable
    permission for files on the local system. For many sysadmins, they do not understand
    or give proper respect to the possibility of local compromise, which results in
    the availability of unintended files.


    Keeping this in mind, we will likely find some type of backup or even git directory
    for sensitive applications running on the host. Always make sure to download a
    local copy of these to analyze on our host, as they will likely contain a certain
    level of hard-coded credentials. Additional programs, such as LinPEAS, automatically
    search for potential passwords and authentication activity within the local machine.
    LinPEAS and WinPEAS will be discussed further at length later in this chapter.


    # Access to Databases


    Once we have a foothold on a Linux machine, we need to check for any services
    that run on localhost and that were not available on the initial network. This
    is common for databases for web applications to bind to the localhost only, preventing
    access to the database login panel for anyone who is not on the local machine.


    When we do have access to the system, if there is a web application used we can
    determine how it is connecting to its database. Generally, this will be listed
    as a configuration file within the root directory of the web application which
    cannot be accessed by a user browsing the website. However, with access to the
    local system, we can read the file and determine what the credentials to authenticate
    to the database will be.


    When connecting to that database, we can search for authentication material to
    determine if any additional password hashes are stored. If we’re lucky, we’ll
    see that additional hashes are available for administrator or additional local
    user accounts on the machine. Grab these as they’re found and start cracking them.


    This is covered in-depth within Chapter 3 for Web Application Hacking and Defense
    but is always worth noting in this area as well.


    # AUTHENTICATION MATERIAL


    There are a few different ways that users can authenticate to a Linux machine,
    these are through user passwords and SSH keys. SSH keys are a public/private pair
    and can be generated at the command line using the ssh-keygen command. Using an
    SSH key-pair to authenticate is more secure than passwords and relies on using
    a file to authenticate to the server. Generating a new key is simple, run the
    command and follow the on-screen instructions.


    By default, an RSA key pair will be generated, but additional types of keys can
    be specified with the -t switch. A passphrase can be applied to the key as well
    to give it an additional layer of security, however, this is not required.


    ```

    $ ssh-keygen

    Generating public/private rsa key pair.

    ```'
  merge: -1
  img_proc: true
- pgno: 214
  md: '```

    Enter file in which to save the key (/home/chris/.ssh/id_rsa):

    Enter passphrase (empty for no passphrase):

    Enter same passphrase again:

    Your identification has been saved in /home/chris/.ssh/id_rsa

    Your public key has been saved in /home/chris/.ssh/id_rsa.pub

    The key fingerprint is:

    SHA256:D8Jhqcyna7CTf3J+QPTpWH8UJz8t9+YfGxOOsVIGrKI chris@kali

    The key''s randomart image is:

