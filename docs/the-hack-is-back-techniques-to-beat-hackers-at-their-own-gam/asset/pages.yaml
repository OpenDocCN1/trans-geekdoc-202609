- pgno: 309
  md: 'A topology or advanced network setup with Virtual Machines allows you to practice
    and better understand many important components of cybersecurity. I tell people
    interested in a Cyber career to:


    +   1. Install the Linux, Windows, BSD, and other operating systems in VMware
    Workstation.

    +   2. Configure Networking so Virtual Machines on the same network segments can
    communicate.

    +   3. Configure routing so all of the different segments of the network can communicate.

    +   4. Enable a firewall to protect the LAN and configure port redirection to
    your internal systems.

    +   5. Run Wireshark on an interface connected to the internal network for analysis
    later.

    +   6. Scan the External Firewall address from your WAN machines and exploit the
    vulnerable services.

    +   7. Pivot to other internal network machines. Create additional backdoors and
    exfiltrate data.

    +   8. Perform incident response, log analysis, and forensics on the compromised
    hosts.


    If you can set and configure all of the machines in a LAN/WAN setup, hack and
    analyze them, you will have a far better understanding of operating systems, networks,
    exploitation, and incident response.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_309_0.png)


    FIGURE 10.22 An example of port redirection configured on a firewall.


    Beyond setting everything up on your own machine, there are lots of other resources
    that can be utilized. I prefer to start with VMware because although many of the
    lab vendors out there have many good labs that teach many great concepts, there
    is still the issue that much of the setup is done for you. It is important to
    know how to install, configure, and network various operating systems. And while
    I used to do this all with physical equipment, VMware allows you to do just about
    everything you could do with a large pile of physical equipment except using the
    physical connectors for networks and drives.'
  merge: -1
  img_proc: true
