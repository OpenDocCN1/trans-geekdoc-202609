    permissions together to gain access to the Domain Administrators group. This relies
    on some permissions to a GPO which can be used on the domain. Actual abuse of
    this link will be left to the reader as an exercise. Our skills from the start
    of this chapter will start to pay off and help us explain the risk of this type
    of attack to a customer.


    It is highly recommended to play with the various built-in queries to try and
    understand what activity can be uncovered in the domain. Many additional custom
    queries can be supplied for further analysis within BloodHound, there are several
    excellent community ones available at https://github.com/CompassSecurity/BloodHoundQueries.
    This author has additionally written a comprehensive setup and configuration guide
