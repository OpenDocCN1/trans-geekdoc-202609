- pgno: 63
  md: '# 3 Web Application Hacking and Defense


    # INTRODUCTION


    Website applications are ubiquitous across the Internet and have exploded in popularity
    and functionality within the last decade. As any astute security observer knows,
    functionality is always the enemy of security – as hackers we can exploit these
    weaknesses found within an application. Our main objective is to find and explain
    the risks associated with these vulnerabilities.


    Many websites unintentionally leak damaging or sensitive documents, allowing us
    to gather information we can use to generate intelligence against the target.
    This can encompass anything from emails for users to AWS access keys encoded within
    client-side JavaScript. Do not discard the importance of reconnaissance, as enumeration
    at every step separates the good hackers from the great hackers. Reconnaissance
    is the single most important step which must be constantly re-visited and fed
    into to provide the most value.


    Many organizations host their web applications within either a De-Militarized
    Zone (DMZ) or a Virtual Private Cloud (VPC). This means that the successful compromise
    of an Internet-facing host may allow for further access within a trusted environment.
    Access to these additional systems generally results in a breach of the confidentiality
    of the VPC, as well as the potential for even deeper access within the organization.


    Defending web applications is a difficult task as web applications are usually
    required to be accessible from the Internet. This gives a wide attack surface
    that needs to be monitored and hardened against exploit attempts. Failure to properly
    protect these assets puts the organization at risk and may compromise Confidentiality,
    Integrity, or Availability.


    # METHODOLOGY


    Implementing a methodology to use during security testing allows us to ensure
    that we accurately identify vulnerabilities within an application. It is easy
    to lose track of what areas of an application have been accessed or not during
    an engagement – methodologies help keep track of areas of concern and how to maintain
    a repeatable, consistent testing approach.


    There are several different types of methodologies used for websites, however,
    the gold standard is the Online Web Application Security Project (OWASP) Web Security
    Testing Guide (WSTG). The WSTG pulls in experience from hundreds of researchers
    across the globe, leaning into their expertise on the most common and most devastating
    attacks to compromise the confidentiality, integrity, and availability of systems.
    The WSTG provides exemplary testing instructions and reporting, along with clear,
    concise testing instructions for analysts and remediation for developers. The
    WSTG is available at https://owasp.org/www-project-web-security-testing-guide/.


    Additionally, the book Web Application Hacker''s Handbook: Finding and Exploiting
    Security Flaws (2nd Edition), written by Dafydd Stuttard and Marcus Pinto, outlines
    the groundwork for modern web applications and how they are developed. This book
    will cover some of the most common misconfigurations and how to exploit them –
    for a detailed explanation of almost every type of web attack, please reference
    that book. While the Web Application Hacker''s Handbook was most recently revised
    in 2011, there are many foundational concepts covered that hold its weight today.
    Understanding these key concepts is critical to learning and applying the same
    steps to the newest libraries and interactive applications.'
  merge: -1
  img_proc: true
