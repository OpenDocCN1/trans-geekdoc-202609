- pgno: 61
  md: 'This creates a PDF that outlines the findings from the scan and how they can
    be remediated.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_61_0.png)


    FIGURE 2.41 Sample finding from the PDF export for Nessus.


    Nessus is an excellent tool for us to use and keep track of vulnerabilities within
    the organization. Managing the findings and patching the known weaknesses will
    significantly enhance the overall security posture of the network.


    # DEFENSIVE PERSPECTIVE


    Simply put, an inventory of devices, regular patching, and changing default credentials
    on installation are the most effective controls to protect against this threat.
    As discussed in this chapter, these exploits and attacks commonly are used to
    gain the initial foothold into the environment. Stopping this attack chain by
    removing initial entry points is an effective defense in depth position.


    Vulnerability scanners are crucial to help us manage and keep track of known weaknesses
    in the environment. By constantly searching for these weaknesses, we can reduce
    our exposure window from known attacks. Staying ahead of these vulnerabilities
    through patching and remediation protects the organization from easily exploitable
    conditions.


    # Honeypots


    To take these common attacks to our advantage, we can leverage a Honeypot on the
    network. One of the key advantages of honeypots lies in their ability to divert
    and contain attacks, alerting defenders before the attackers reach critical systems
    or cause real harm.


    Properly configured honeypots create a lucrative target for an attacker to spend
    time attacking. The thought of such a desirable target is intended to draw the
    attacker''s time and resources toward the honeypot, giving the defenders an alert
    of an active attack. Beyond this, honeypots can also offer defenders ample time
    to study attacker techniques and develop appropriate countermeasures. This'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'approach allows defenders to focus their resources on observation rather than
    immediate defense, offering a unique perspective into what attacks were launched
    in the environment.


    # OpenCanary


    Installing a honeypot on a local network can be as simple as running the OpenCanary
    project, sponsored by Thinkst, which allows defenders to quickly stand up a honeypot
    for usage. The canary can be deployed on a Raspberry Pi or small VM, sitting quietly
    and waiting for interaction. The project can be downloaded and deployed from GitHub
    at https://github.com/thinkst/opencanary.


    Once up and running, OpenCanary allows many types of alerts to notify defenders
    when the canary has been interacted with. By default, the following alerting mechanisms
    are present:


    +   - SMTP

    +   - Syslog

    +   - Slack

    +   - Teams

    +   - Generic Webhook


    Proper configuration of an alerting mechanism will give us as defenders the heads
    up to quickly respond to threats.


    # CONCLUSION


    In conclusion, default configurations and easily guessed credentials are a significant
    threat on the Internet today. As long as devices and systems are shipped with
    default credentials, this will always be a risk for threat actors on the Internet
    to exploit. Beyond devices connected to the Internet, internal devices on a LAN
    commonly are generally more accessible based on default configurations.


    Vulnerability scanners help us search for known vulnerabilities and find weaknesses
    before a threat actor can find them. Searching for these known weaknesses can
    enumerate these vectors before they are used by an attacker to harm the organization.
    Tools such as Nuclei, Greenbone, and Nessus allow us to achieve this objective.


    Honeypots allow defenders to tip the scales in their favor, securing their networks
    and systems against a threat actor. Strategic placement of honeypots on the internal
    network can create a significant difference when a threat actor gains initial
    access, and before they can take critical action on the network.


    # NOTES


    +   1 https://wiki.ipfire.org/configuration/firewall/blockshodan

    +   2 https://www.bbc.com/news/world-europe-39907965


    # WORK CITED


    Jaiswal, Harsh, and Rahul Maini. “CVE-2023-36934 Analysis: MOVEit Transfer SQL
    Injection.” ProjectDiscovery Blog, 9 July 2023, https://blog.projectdiscovery.io/moveit-transfer-sql-injection/.
    Accessed 29 January 2024.'
  merge: -1
