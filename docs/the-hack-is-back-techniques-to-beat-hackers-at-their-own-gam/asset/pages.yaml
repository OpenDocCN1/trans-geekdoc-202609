    +   - Enumeration & Exploitation


    The season starts with a GYM that has CTF problems and solutions, and it is also
    okay for you to work with other individuals. The GYM opens around the start of
    the fall or spring semester and stays open until the end of the season. The Practice
    Game lasts for one week. Unlike the Gym, the Practice Game does not provide solutions
    but does allow you to work with others. For the individual game, it runs over
    the weekend and you cannot seek outside help. Finally, a team round gives you
    a chance to compete with other NCL participants, typically from the same institution.
    The NCL does not require you to be in college. High school students are also eligible
    to participate. Often Cyber teams will pay the 35.00 fee.


