- pgno: 220
  md: 'that were disclosed for years. Paired with the potential for operational downtime
    or harming production applications, it is understandable why some admins do not
    regularly apply these patches.


    Identifying these exploits can be done in several ways, generally, this is accomplished
    by checking for versions of programs to determine if they suffer from a known
    vulnerability. This can be a long and time-consuming process, so there are additional
    tools that help speed this activity up and locate vulnerabilities.


    The first tool is the Metasploit module for post/multi/recon/local_exploit_suggester.
    This module needs to be run from an active Meterpreter session within the system
    and search for known vulnerabilities on the target’s architecture and see if any
    may exist. This relies on an active session, as the module will be running within
    the session.


    ```

    msf6 post(multi/recon/local_exploit_suggester) > set session 3

    session => 3

    msf6 post(multi/recon/local_exploit_suggester) > run


