- pgno: 248
  md: 'What we’ve accomplished is creating a new user account on the machine named
    **newguy** which uses the password **newpass**. Once the account was created,
    we added them to the localgroup for the machine, then validated that the new user
    account was in this group. This now ensures we can use that account for follow-on
    activity as needed!


    Utilizing this technique is also a quick way to be detected on modern networks.
    This technique should only be used in areas where others may not be as effective
    or as reliable. Many EDR tools and detection systems will flag new administrators
    as suspicious activity for review by a manual process.


    # Boot or Logon Initialization Scripts


    Boot or Logon Initialization scripts are automatically run during a system’s or
    user’s initial login. This can be an effective way to ensure that as the user
    leverages their device, our access remains. There are a handful of different ways
    to achieve this, such as placing the scripts within specific registry keys. For
    Linux machines, adding a reverse shell into the RC scripts will run every time
    that a shell is launched.


    # External Remote Services


    Adding additional remote services to continue to access the environment is an
    effective way to continue to maintain access. As discussed in **Chapter 4**, we
    can leverage WireGuard to establish a reverse tunnel and maintain access across
    a NAT environment. This specific technique allows us to traverse NAT boundaries
    and ensure that we can blend into existing traffic.


    Another effective methodology is to create firewall rules that give access to
    sensitive services such as RDP. Attackers who think ahead will create one specific
    IP or CIDR who have access to this service as well, limiting who else will have
    access to the machine. The more individuals with access to services increases
    the chances of being detected due to the volume of attacks and types of attacks
    against them.


    # Defender’s Perspective


    While there are a seemingly limitless number of ways that an attacker can move
    and escalate within a system, defenders have their own advantages to detect and
    eradicate adversaries. For example, there are many well-documented tools and techniques
    discussed so far in this chapter which can be leveraged to search for these misconfigurations.
    Smaller things such as unquoted service paths and passwords in account descriptions
    are common to find and simple to fix.


    Along with the tools already discussed in this chapter, several community projects
    map attack paths and classify how they are executed along with mitigation. These
    projects provide clear guidance on how to test for these weaknesses and will even
    show how threat actors use them to move throughout an environment. Following these
    projects gives a clear and effective value to test the network in defined ways
    that threat actors have been known to complete.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# WELCOME TO THE MATRIX


    The MITRE ATT&CK framework can be used to help classify and determine adversary
    actions as they occur in our systems. This project was started in 2018 and tries
    to standardize vocabulary on attacks for an organization. By providing a clear
    ATT&CK ID, anyone else can search for that ID to get additional clarifying information.


    The ATT&CK Matrix is a document provided by MITRE to show all of the IDs and sub-IDs
    within the ATT&CK project. The enterprise matrix shows a LOT of data, but again
    make sure that you do not get overwhelmed. This information is broken up into
    several sections based on how an attack is developed.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_249_0.png)


    FIGURE 7.48 Very high-level screenshot of the MTIRE ATT&CK Enterprise matrix.
    This is used to classify attacker patterns to help defend against them.


    Clicking on a specific ID will bring up detailed information about the attack
    vector, how it is exploited, associated tools, and even references to well-known
    threat actors who have been identified as leveraging that attack vector. The information
    in this section proves to be invaluable when writing a report for a client about
    how the attack vector was leveraged in a real-world scenario.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# # Exploit Public-Facing Application


    Adversaries may attempt to take advantage of a weakness in an Internet-facing
    computer or program using software, data, or commands in order to cause unintended
    or unanticipated behavior. The weakness in the system can be a bug, a glitch,
    or a design vulnerability. These applications are often websites, but can include
    databases (like SQL), standard services (like SMB or SSH), network device administration
    and management protocols (like SNMP and Smart Install), and any other applications
    with Internet accessible open sockets, such as web servers and related services.[1][2][3][4][5]
    Depending on the flaw being exploited this may include Exploitation for Defense
    Evasion.


    If an application is hosted on cloud-based infrastructure and/or is containerized,
    then exploiting it may lead to compromise of the underlying instance or container.
    This can allow an adversary a path to access the cloud or container APIs, exploit
    container host access via Escape to Host, or take advantage of weak identity and
    access management policies.


    | Field | Value |

    |---|---|

    | ID | T1190 |

    | Sub-techniques | No sub-techniques |

    | Tactic | Initial Access |

    | Platforms | Containers, IaaS, Linux, Network, Windows, macOS |

    | Contributors | Praetorian; Yossi Weizman, Azure Defender Research Team |

    | Version | 2.3 |

    | Created | 18 April 2018 |

    | Last Modified | 19 April 2022 |


    **FIGURE 7.49** Viewing the specifics from a technique. This shows the ID, applicable
    platforms, and how this can be exploited.


    Leveraging the well-documented information in the MITRE ATT&CK creates an effective
    environment for defenders to fix issues before they can be exploited against them.
    The ATT&CK matrix is consistently updated as well, showing the newest threats
    and information as it is discovered.


    # ## Atomic Red Team


    The Atomic Red Team is a set of specific actions and commands to run that test
    technique IDs within the MITRE ATT&CK framework. This project directly arms defenders
    with ways to run scripts or tools that are directly aligned with an ATT&CK ID.
    Do not be fooled by the “Red Team” in the name of this project, because it arms
    defenders with a purple-team like capability. After isolating the ATT&CK IDs known
    to be threats, we can select the appropriate atomics with the Atomic Red Team
    and test how they execute and how they can be identified. The website is available
    at https://atomicredteam.io.


    For example, viewing the T1056.002 ID shows the page for Input Capture: GUI Input
    Capture. This ID specifies using common OS GUI components to prompt users for
    passwords and credentials mimicking legitimate components. Not only do we have
    an excellent explanation of the ID, but we also have a set of PowerShell code
    to run. This gives us a way to start to understand how to run these types according
    to their ID.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_251_0.png)


    **FIGURE 7.50** Atomic for T1056.002 which provides specific PowerShell code to
    test the ATT&CK ID.


    There are many different Atomics available for review and usage. These are designed
    to help defenders test their environment to understand not only how they work
    but also how to detect and defend against them.


    # CHEAT SHEETS


    To help manage the information in this chapter, the following cheat sheets contained
    below can be used to gather information based on their tactical needs.


    # IDENTIFY LINUX MACHINE INFO AFTER FOOTHOLD


    ```

    whoami                         # Who are we?

    hostname                       # What machine is this?

    ip a                           # What interfaces are here?

    netstat -tuna                  # What ports are open? Localhost?

    ps awfux                       # What processes are running?

    ```'
