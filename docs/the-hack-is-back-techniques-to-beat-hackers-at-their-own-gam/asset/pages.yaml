    the work is on you to do things like configure the operating systems and networking
    to make sure your machines communicate.


    I was actually doing some research for a conference and trying to do a live presentation
    on hacking Internet of Things (IoT) and Supervisory Control and Data Acquisition
    (SCADA) devices. I found some good virtual machines on the vulnhub site and I
    was able to get them up and running and configured after doing some hoop jumping
    and then I was able to exploit them. The site allows you to download virtual machines
    at no cost. Sometimes you can find walkthroughs to guide you on how to get the
    machines exploited. Experience over time will help improve your hacking skills.'
