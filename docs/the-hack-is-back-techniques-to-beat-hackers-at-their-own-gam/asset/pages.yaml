    Access to these hashes now allows us two distinct opportunities: utilize Pass-the-Hash
    attacks or attempt to crack them for their plaintext counterparts. Utilizing these
    hashes is an exercise left to the reader.


    # ACTIVE DIRECTORY PRIVESC


    There are many ways for an attacker to gain an initial foothold to escalate across
    an Active Directory (AD) configuration. Generally, to start an attack against
    AD, an attacker will need a foothold from a low-privilege account to gain access
    to the AD server. Once gained, there are many new escalation paths which are active
    for attack. Again, modern attackers generally attempt to escalate to administrative
    privileges to gain access to the most sensitive information used by the organization.
    Once this access is gained, the attacker will attempt to launch various types
    of attacks to try and gain monetary value from their exploits.


    # UNAUTHENTICATED ACCESS


    In certain testing environments, it is common to start with access to a network
    without having credentials to access the services on the network. These can be
    devastating attacks and are generally artifacts from a configuration change made
    out of operational necessity. Many times these configurations are changed to solve
    a very specific problem with the intent of a temporary fix, but end up staying
    active much longer than intended.


    # Anonymous Bind


    A common misconfiguration in environments is that anonymous LDAP bind permissions
    are allowed on the AD Domain Controllers. This allows individuals who do not have
    an account to query and enumerate sensitive information from AD. To query an AD
    DC without credentials, utilize the command below:


    ```

    ```bash

    ldapsearch -LLL -x -H ldap://test.local -b'''' -s base ''(objectclass=*)''

    ```

    ```


    This command uses the **ldapsearch** program on a Linux machine to attempt to
    communicate to an Active Directory LDAP server and query information. The program
    attempts to bind to the LDAP server and gather information which would attempt
    to gather the information from all objects inside of the directory. If anonymous
    bind access is allowed, all objects will be displayed for us to view.


    With the information gathered from anonymous LDAP access, we can gather all usernames
    and computer names within the environment. This will also allow us to query the
    AD environment with BloodHound, a tool that will be discussed further in this
    chapter. Usernames can be used to perform additional attacks within the environment,
    such as ASREPRoasting and password sprays.


    # Describing My Password


    Passwords in Account Descriptions is a surprisingly common misconfiguration in
    most AD environments. Well over a quarter of the internal pentests that this author
    has completed had at least'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'one account with a password in the description – this is why earlier in this
    chapter it was covered in detail. Again, remember that an effective way to gather
    this information is to use the PowerShell ActiveDirectory module. A useful command
    is below:


    ```

    Get-ADUser -Filter {Description -like "*"} -Properties * | Select-Object

    samAccountName, Enabled, Description | Select-String -Pattern p.ss, pw,

    pwd

    ```


    Identifying passwords within account descriptions creates a very high likelihood
    of successful password spray attacks within the environment. Generally, the passwords
    within these descriptions are a “template” password that may be assigned to users
    for their initial login. This creates an environment conducive for password sprays,
    where we attempt a very small amount of passwords across a large amount of usernames.


    # Kerberos User Enumeration


    One well-known vulnerability with Kerberos is how it can be used to enumerate
    valid usernames on a domain by analyzing the Kerberos response codes. When an
    invalid username is presented to Kerberos, it will respond with the KRB5KDC_ERR_C_PRINCIPAL_UNKNOWN
    error, stating that there is no principal with that name available. Contrasted
    with a request sent with a valid username, the code KRB5KDC_ERR_PREAUTH_REQUIRED
    will be given.8, 9 Utilizing these response codes, we can craft enumeration activity
    to determine valid usernames on the domain.


    The kerbrute tool, written by ropnop and available at https://github.com/ropnop/kerbrute,
    operationalizes these concepts in a Go native binary. When paired with a large
    list of potential usernames, we can attempt to enumerate valid users on the domain.
    To use this tool, we need to supply the IP of the domain controller as well as
    the domain that will be enumerated.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_226_0.png)


    FIGURE 7.20 Running kerbrute to enumerate valid usernames on the network.


    As stated in ropnop’s repository, this specific attack is stealthier since it
    does not generate an “An account failed to log on” event in the Windows event
    log. Further, there does not appear to be any logs generated during an enumeration
    attack, outside of the packets themselves being thrown across the network. Microsoft
    also states that logging these requests for Kerberos is possible, but it requires
    a specific registry key setting to be enabled.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'The setting is located at **HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\Kerberos\\Parameters**
    and requires the **LogLevel** setting^10 of **0x1**. Once enabled, this shows
    the Kerberos activity logs and is clear when a large amount of attacks come through.
    However, Microsoft also states that this may create a performance degradation
    on the machine. Keep this in mind as we balance usability and security.


    # Password Sprays


    As discussed earlier, password sprays are attempting a small amount of specific
    and targeted passwords against many accounts on the system. The idea behind password
    sprays is that it is likely that a user on the network will use a predictable
    password. When paired with known passwords used in the environment, our chance
    of success increase dramatically.


    After spending some time with intelligence gathering and reading information within
    the environment, it is very common to identify a “default” network password used
    by the organization. This can be something as simple as **Password123456** or
    could involve something such as the mascot or favorite local sports team. Generally,
    this information is shared via email or stored on file shares – once this password
    is uncovered we can attempt to spray it across many accounts to see how many are
    effective.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_227_0.png)


    **FIGURE 7.21** Diagram of a password spray attack, where a likely password is
    attempted against multiple accounts.


    There are a handful of different protocols that are used to effectively attack
    a system with a password spray. LDAP, Kerberos, and NTLM are the three most commonly
    used protocols within an AD environment and can be used for various password spray
    attacks. There are several tools at our disposal to use here, however, there are
    many risks as well.


    Spraying accounts with too many passwords can completely lock out individuals
    from their accounts. Depending on the configuration of the domain, the accounts
    could be locked out until they reach a specific time period or they are manually
    unlocked by an administrator. It is highly recommended that the password policy
    is identified and understood before beginning a password spray attack. Additionally,
    inform the point of contact of your intentions and ask if their actual password
    policy differs from the one identified.


    Many spray tools are not lockout window and lockout attempt aware which leads
    to the risk of accounts being locked. This author has attempted several tools
    but was unable to find one that fits'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'the bill for the specific spray attack with the confidence that it will operate
    as intended. To solve this problem, the program for pySpray was created. This
    is a python-based program that is lockout time and window aware. The pySpray program
    is available at [https://github.com/m4lwhere/pySpray](https://github.com/m4lwhere/pySpray)
    for download.


    Running this program is simple, we must provide a list of usernames, passwords,
    the domain, the lockout number, and lockout window. This also informs the user
    how many total attacks will be attempted against the environment, notably the
    amount of passwords multiplied by the amount of users. This is done as an intended
    way to ensure the user understands the amount of authentication attempts across
    the domain. These should not be taken lightly, as locking out attacks causes a
    lack of availability. This can create an exceptionally impactful instance which
    can create a very unhappy paying customer!


    ![](img/181571ad74cba0e6a2f38fcd2658651e_228_0.png)


    **FIGURE 7.22** Running the pySpray tool with LDAPspray to attempt a password
    spray against a list of users. This attack waits to send three authentication
    attempts every 11 minutes, as seen in the switches.


    In the example of the screenshot above, we see that a user was identified with
    an easily guessed password. This was found after creating a list of likely passwords,
    identifying the domain’s password policy, and then trimming down the potential
    passwords based on the information gathered. At this point, we can attempt to
    log into that user’s account to identify if there’s a way to pivot further within
    the environment.


    # MULTICAST DNS POISONING


    Windows machines have a few mechanisms to resolve hostnames with DNS, including
    fallback mechanisms to ask machines on the local network for help. What does this
    mean? If we can poison a request sent to the broadcast domain on our local subnet,
    we can convince a machine to connect to us. From there, we can capture password
    hashes for authentication, or even relay these connections to other machines (where
    we get access as the poisoned machine!).


    # DNS Resolution Order


    Windows DNS operates in a hierarchy, where the system needs to resolve a hostname
    to its applicable IP address to communicate to it on the Internet. Windows will
    operate¹¹ to resolve this address: to resolve this address:


    +   1. The client checks to see if the name is its own

    +   2. HOSTS file (C:\Windows\System32\drivers\etc\hosts)

    +   3. DNS Resolver Cache

    +   4. Configured DNS

    +   5. NetBIOS and Link Local Multicast Name Resolution (LLMNR)'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# LLMNR


    LLMNR is one of the primary focuses in multicast DNS poisoning, as Windows machines
    will request the broadcast address of the local subnet asking for help resolving
    a domain. Back in the day when this was established, internal networks were trusted
    to not have malicious actors. However, in today’s world, internal networks can
    no longer be implicitly trusted and must always be considered as though an adversary
    may have access.


    To exploit LLMNR, all we need to do is wait for an LLMNR request and then reply
    with the address of our system. Sounds easy enough right? But how do we actually
    achieve this?


    # Responder


    To exploit LLMNR on a local domain, the Responder tool can be leveraged to automatically
    identify and respond to LLMNR requests on the local subnet. These responses are
    sent with poisoned information in an attempt to convince the machine to connect
    to our machine. If properly poisoned, the victim will attempt to connect to our
    attack system and reveal credentials.


    Poisoning LLMNR with responder is exceptionally effective in most networks, however,
    it is loud enough to cause alarms to be set off during detection. Each LLMNR,
    MDNS, and NBT-NS request that it sees will have a response sent which will be
    visible in the network traffic.


    To run responder and reduce our chances of being detected, we can use the **-A**
    switch to analyze the traffic on the local subnet. When in Analyze mode, responder
    will not attempt to poison any requests and allows us to profile the network.
    It is highly recommended to run within analyze mode FIRST before running in active
    poisoning, as poisoning can reveal our location to others.


    Beyond this, responder is also useful in catching or gathering credentials from
    systems based on various network services it impersonates. For example, we can
    run a fake LDAP server which can be used to catch credentials from a compromised
    printer. This is explored closely in [Chapter 2](#) about default credentials
    and can be applied in scenarios such as internal networks with responder.


    # IPv6 MitM


    While Responder is excellent at inviting NTLM connections from multicast DNS,
    we can leverage additional built-in and default preferences within Windows to
    attempt takeovers. One of these is the IPv6 preference that Windows has, where
    on a local network the IPv6 protocol will take precedence over IPv4. We can use
    this to our advantage by advertising malicious IPv6 information on the local subnet,
    convincing local machines to use our routes instead of the legitimate IPv4 ones.
    A tool to complete this action is **mitm6** from Dirk-jan Mollema, available at
    https://github.com/dirkjanm/mitm6.


    This differs significantly from Responder, as Responder attempts to poison multicast
    DNS. With **mitm6**, we offer new DNS and route information to convince local
    hosts to use our host instead. This places us in the middle, which is why the
    tool is aptly called man-in-the-middle 6. We can run this tool by specifying the
    domains we want to respond to, narrowing them down to only specific internal domains.
    By selectively choosing domains, we can reduce the impact internally on the network
    if a user cannot reach certain resources.


    To exploit this, we can use the commands below. This snippet is taken from the
    Game of Active Directory lab, (GOAD), which is a fully-fledged set of domains
    within a forest configured to be vulnerable. GOAD was created by Orange Cyberdefense
    and is available on GitHub at https://github.com/Orange-Cyberdefense/GOAD. The
    following mitm6 command attempts to takeover activity for the sevenkingdoms.local
    and essos.local domains:


    ```

    mitm6 -i vboxnet0 -d sevenkingdoms.local -d essos.local

    ```


    Remember, anytime we poison responses or attempt to perform man-in-the-middle
    techniques, there’s always a risk that we can remove availability. To this end,
    mitm6 intelligently chooses to'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'have DNS records with very low time-to-live values. If we mistakenly take down
    the availability of resources, users should only need to wait five minutes or
    reboot their machines to have access restored. However, we need to make sure that
    we reduce this chance as much as possible.


    # Preventing Multicast DNS Attacks


    To prevent and reduce the risk of multicast DNS attacks, we can enforce a GPO
    at the domain level to prevent the use of LLMNR. This is an effective control,
    as modern enterprise networks do not need fallback DNS resolution mechanisms outside
    of configured DNS servers.


    # NTLM RELAYS


    Named after the NT LAN Manager authentication protocol, NTLM relays exploit the
    very foundation of Windows authentication to attempt to gain unauthorized access
    to areas of the domain. By sitting in between two victims, an attacker can dictate
    and control the activity occurring.


    To exploit this, we can use the NetExec tool to identify which machines on the
    domain do not enforce SMB signing. Locating these machines allows us to keep track
    of which machines can attempt to be exploited when relaying inbound connections.
    To complete this, we can run the command below:


    ```

    nxc smb 192.168.56.0/24 --gen-relay-list relayable.txt

    ```


    ![](img/181571ad74cba0e6a2f38fcd2658651e_230_0.png)


    **FIGURE 7.23**  Running NetExec to get a list of machines that do not enforce
    SMB signing.


    Now with the list of vulnerable machines saved as **relayable.txt**, we can use
    Impacket’s **ntlmrelayx.py** script to target the detected machines. What this
    script does is take incoming NTLM connections and attempt to relay them to other
    machines to establish a connection. When using the **-tf** switch, we can provide
    a target file to the program to attempt to create connections with. The **-socks**
    switch will establish a SOCKS proxy with any successful connections, allowing
    us to continue to leverage the connection as we see fit.


    ```

    ntlmrelayx.py -tf relayable.txt -smb2 -socks

    ```


    To practice this and get even more in-depth, there are several excellent workshops
    and resources available. One of the best to learn is from Jean-François Maes and
    is titled NTLM Relaying 101, this is available as a GitBook at https://jfmaes-1.gitbook.io/ntlm-relaying-like-a-boss-get-da-before-lunch/.


    To fix this, enforcing SMB signing is crucial. This prevents the unauthorized
    manipulation of resources to protect the integrity of the domain.


    # AUTHENTICATED ACCESS


    Gaining authenticated access to AD can reveal a significant amount of information
    on how to attack the target. Not only do we have access to some potential SMB
    shares, but we can also gather information within LDAP for potential privilege
    escalation.


    # SMB Shares


    Access to an authenticated account may give more access to file shares using SMB
    across the computers in the domain. Users tend to save items within file shares
    such as passwords which can make'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'escalation easier. Even worse, some administrators will store PowerShell and
    batch scripts that have credentials within them on the shares. Gaining access
    to SMB shares to search for sensitive files is not only effective, but it has
    ATT&CK ID assigned as T11335.12


    There are several tools to help us achieve this objective, such as the NetExec
    tool,13 the most recent replacement for the CrackMapExec tool. This tool can be
    used for several different functions, such as password spraying, but in this author’s
    experience, the tool shines in how it can systematically access SMB shares across
    a network. Instead of attempting SMB logins and enumeration at an individual and
    manual pace, NetExec allows us to supply a list of IPs or a CIDR to enumerate
    the shares. This increases our effectiveness in the testing we complete.


