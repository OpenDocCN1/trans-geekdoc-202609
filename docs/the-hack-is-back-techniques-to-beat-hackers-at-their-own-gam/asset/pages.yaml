    With the Chromium browser open, any activity we make through the proxy will show
    up and be gathered within Burp for us to analyze further. Note that when initially
    opening Burp, by default the **Intercept is on**. This means that *any network
    activity we conduct will be caught by the Burp proxy and wait to be sent further*.
    With the intercept enabled, we must manually approve all requests as they leave
    the browser. This can slow down testing and get in the way of performing proper
