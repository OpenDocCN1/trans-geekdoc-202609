    # PERSISTENCE


    There are many different ways we can continue to persist within an environment
    to ensure that we maintain access. After exploitation occurs, attackers need to
    maintain the foothold that was initially established. These techniques are used
    to ensure that our access can remain after a system is restarted, accounts are
    changed, or processes are restarted. Keep in mind that the more we understand
    these attacks the better we can become at emulating a real threat actor. Beyond
    this, we know where and what to look for during an incident response scenario.


    The MITRE ATT&CK framework, discussed further later in this chapter, has a tactic
    specifically for persistence (TA0003).¹⁷ Viewing this tactic, we can see a wide
    range of techniques used to maintain access within an environment. For this section,
    we will select a handful of the techniques and cover how they are applied.


    # ADDING ACCOUNTS


    The most basic way to ensure persistence across the environment is to make an
    additional account within the affected component. This helps us to ensure that
    we can continue to access the system if the exploited account is detected. This
    technique is achieved through legitimate administrative tools, such as the Active
    Directory Users and Computers module used on Windows Server.


    For Windows machines, by opening the Microsoft Management Center (MMC) tool, we
    can use the Local Users and Computers snap-in to access the tools needed. Open
    the MMC program by typing in **mmc** in the run console and then click **File
    > Add/Remove Snap-in…**'
