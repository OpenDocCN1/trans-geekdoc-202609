    target appears to be vulnerable.

    [+] 192.168.40.29 - exploit/linux/local/glibc_origin_expansion_priv_esc: The target
    appears to be vulnerable.

    [+] 192.168.40.29 - exploit/linux/local/netfilter_priv_esc_ipv4: The target appears
    to be vulnerable.

    [*] Running check method for exploit 35 / 58

    ```


    FIGURE 7.12 Running the Local Exploit Suggester module on the active session.


    Once the module is completed, a list of potential escalation vectors will be presented,
    along with the modules to use. This can be useful to ensure we escalate into root
    level access but also can provide evidence within a report to the customer at
    the end of the engagement. Remember, we want to provide as much information and
    value as possible!


