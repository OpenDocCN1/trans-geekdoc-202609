- pgno: 176
  md: 'organizations that do not have an established bounty program, or even full-time
    security analysts, rely on the notifications and information posted in OpenBugBounty.


    To report a vulnerability to OpenBugBounty, click the **Report a Vulnerability**
    button on the front page of the website. This allows you to submit a report for
    a website that has a vulnerability in the OpenBugBounty website.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_176_0.png)


    **FIGURE 5.34** Screenshot of the [OpenBugBounty.org](https://OpenBugBounty.org)
    webpage.


    Another interesting perspective about OpenBugBounty is that it can be used to
    gain intelligence about a website. All reports, regardless if they are resolved
    or not, are listed for public consumption within 90 days from the original submission.
    This means that a website that has XSS reported on it that was never fixed can
    be quickly located through the OpenBugBounty previous reports. There are chances
    that the vulnerability may still exist or be present in other areas of the website
    as well.


    # DEFENDER’S PERSPECTIVE


    Defenders can apply these techniques to help try to identify additional vulnerabilities
    within their organization. A clear understanding of the ways a vulnerability manifests
    itself and where it can appear is critical to reducing risk for an organization.


    The troubleshooting steps play a key role in identifying if an issue on a computer
    or a server should be escalated or not. Detailed troubleshooting efforts will
    help show if an asset may be affected by some type of exploit or attack instead
    of a misconfiguration. Always make sure to have evidence that supports your theories
    and how they are approached. Bug bounty programs are effective from the organization’s
    side too, establishing a bounty program can incentivize hackers to find bugs and
    report them for cash. This increases the security of the tested products from
    being used to'
  merge: -1
