  md: 'Open-source Content Management System (CMS) projects tend to have misconfigurations
    since they are developed for free by others, we can search for some lesser-known
    CMS software that may not have seen much security testing. Since we are starting
    to go down our path to learn from experience, open-source projects are fantastic
    resources for us to evaluate. Our findings can be used to send code updates directly
    to the developers so that we can help improve the security of the project as a
    whole.


    # Identifying a Project


    To find a project, we can start by searching for open-source CMS’s for a specific
    type of activity or group. By narrowing down the projects, we’re more likely to
    find a CMS that is very specific and has been less likely to be reviewed by a
    separate security professional. Some ideas to search for specific software CMS’s
    are below:


    +   - Billing

    +   - Accounting

    +   - Church Management

    +   - Bowling Management

    +   - Movies

    +   - Restaurant Menu

    +   - Ticketing System

    +   - Calendar Reservation System


    These are only scratching the surface of the projects available online. There
    are hundreds of thousands of different public software projects available on Github
    which are only one **git clone** request away from analysis. Use your imagination
    to search for a specific project that we can download and attempt to view.


    One way to find projects is to search within Github. In this instance, I’ve searched
    within Github’s topics to find projects that involve some type of ticketing system.
    This was found by searching for **ticketing-system** and resulted in 320 separate
    projects with that tag.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_167_0.png)


    **FIGURE 5.22** Finding projects within Github that have the tag of “ticketing-system”.
    Notice the high amount of stars on the top project; this indicates that it may
    be more difficult to find vulnerabilities.


    The top results in Figure 5.22 show projects that have well over 1,000 stars,
    which indicates that they are popular and have a much higher chance of already
    being analyzed for security vulnerabilities. While it is still very possible that
    they have vulnerabilities, we want to focus on trying to find easier to locate
    vulnerabilities which gives us a good possibility of getting a CVE. To increase
    our chances, we need to scroll down to find projects with fewer stars.


    However, keep in mind that the MITRE corporation will only accept CVEs for projects
    that are used actively in the field. It would be downright silly to create a CVE
    for a personal project that is not used for an operational capability. As such,
    we need to find a project that we can prove is used on the Internet and is part
    of a real threat to users who have the application.


    In this case, I’ve scrolled down through the projects and identified a project
    which is called **movie_ticket_booking_system_php** which has 10 stars indicating
    that it may be used more frequently on the Internet.'
