    \ and analyze. To quickly find a payload to match the target we’re investigating,\
    \ we can use the grep command to narrow down the output. For example, to search\
    \ for payloads that are built for Windows machines, we can use the command msfvenom\
    \ -l payloads | grep -i windows.\n\n```\n(kali@kali)~ \n$ msfvenom -l payloads\
    \ | grep -i windows\ncmd/windows/adduser\ncmd/windows/bind_lua\ncmd/windows/bind_perl\n\
    cmd/windows/bind_perl_ipv6\ncmd/windows/bind_ruby\ncmd/windows/download_eval_vbs\n\
    cmd/windows/download_exec_vbs\ncmd/windows/generic\ncmd/windows/jjs_reverse_tcp\n\
    cmd/windows/powershell/adduser\ncmd/windows/powershell/custom/bind_hidden_ipknock_tcp\n\
    ```\n\nFIGURE 6.29 Narrowing down payloads from msfvenom to Windows only.\n\n\
    To further refine this search, we can continue to use additional grep commands\
    \ to find things such as a Meterpreter payload. This then makes our command something\
    \ similar to msfvenom -l payloads | grep -i windows | grep -i meterpreter. This\
    \ narrows down the results to show Windows payloads that involve Meterpreter."
