- pgno: 268
  md: 'Let’s start with the easier scenario, when a web server on the internal network
    is configured to be accessible to the public from the Internet (via port-redirection).
    If this is the case, which it can be, the attacker can copy the proprietary data
    into the directory of the web server and then (after changing the permissions
    if needed) can take the data out of the network through web requests. They may
    choose to put it in a hidden directory (which I have seen) or put it in a directory
    in plain sight (I have seen this also). Although the IP Addresses could provide
    a dead end if the are connected through a Proxy or TOR, etc (see earlier chapters).


    After connecting to the system remotely, either through a exploit using a reverse
    shell or a ncat shell sent out of network, the attacker can then find the information
    that they want to exfiltrate from the network and then copy it to the webroot.
    For Windows (and Linux), this can often require hackers to reconfigure the file
    permissions after they are copied or they might get an access denied message when
    they download the files. They can use icals (Windows) or chmod (Linux) to do this
    if needed.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_268_0.png)


    **FIGURE 8.25**  Data exfiltration via a web server.


    Someone reviewing these logs should be aware that these files are not below on
    the web server and users should not be making web requests to obtain them. Of
    course, the issue with weblogs is that there can be an inordinate amount of them
    to monitor and sift through. And there are also retention policy issues where
    the logs during the time of the intrusion are no longer available. Sometimes,
    I have seen that because of the incident, systems have been wiped and reinstalled,
    which is why the logs are gone. And finally, even if there was no hacking involved
    here, the fact that a North Korean IP Address is connecting to your web server
    is certainly also something an analyst will want to watch/monitor/block.


    ```

    ```text

    175.45.176.200 - - [23/Jan/2024:17:18:20 -0500] "GET /blueprint1.jpg HTTP/1.1"

    175.45.176.200 - - [23/Jan/2024:17:18:20 -0500] "GET /favicon.ico HTTP/1.1"

    175.45.176.200 - - [23/Jan/2024:17:18:21 -0500] "GET /blueprint2.jpg HTTP/1.1"

    175.45.176.200 - - [23/Jan/2024:17:18:21 -0500] "GET /favicon.ico HTTP/1.1"

    175.45.176.200 - - [23/Jan/2024:17:23:41 -0500] "GET /blueprint3.jpg HTTP/1.1"

    175.45.176.200 - - [23/Jan/2024:17:23:41 -0500] "GET /blueprint4.jpg HTTP/1.1"

    ```

    ```


    **FIGURE 8.26**  Web Logs with evidence of exfiltration.


    And the hacker does not have to be so obvious about what they are trying to do
    like I was in my example. If they are part of a nation-state group, it is unlikely
    they will be. They can rename the'
  merge: -1
