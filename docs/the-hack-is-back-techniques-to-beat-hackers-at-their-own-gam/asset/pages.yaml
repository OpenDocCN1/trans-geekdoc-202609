    \  -t, --threads int         Number of concurrent threads (default 10)\n  -v,\
    \ --verbose             Verbose output (errors)\n  -w, --wordlist string     Path\
    \ to the wordlist\n\nUse \"gobuster [command] --help\" for more information about\
    \ a command.\n```\n```\n\n**FIGURE 3.39**  Help information for the GoBuster tool.\n\
    \n**GoBuster** is special in the fact that it can do much more than only forced\
    \ browsing techniques. This tool is also capable of brute forcing DNS, enumerating\
    \ S3 buckets, enumerating vhosts, and even working with TFTP. This section will\
    \ focus on the **dir** subcommand, as we are searching for old or vulnerable files.\n\
    \nTo use **GoBuster** to enumerate items on a website, we need to provide it with\
