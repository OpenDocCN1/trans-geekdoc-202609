    At this point, we now have access to NTLM hashes for additional accounts within
    the system. These NTLM hashes can be used to be cracked for their plaintext password,
    or even used within a Pass-the-Hash attack, where the NTLM hash itself is used
    for access without cracking the plaintext password.


    # Staged vs Stageless Payloads


    When the Meterpreter exploit is selected, the user can choose between staged and
    stageless payloads. This difference is between how the entire Meterpreter payload
    is delivered. Staged payloads result in a very small initial payload which is
    used to connect back to the attacker and deliver additional stages of the Meterpreter
    payload until the full Meterpreter is running.⁴ Stageless means that the entire
    Meterpreter payload is delivered as one payload stage and connects directly back
    to the attacker as a full Meterpreter connection.


    Choosing between the staged and stageless payloads depends on the type of activity
    you are attempting to complete during the attack. It’s worth noting also that
    stageless results in fewer variables across the network and can help with troubleshooting.
    However, the larger payload from a stageless attack can also reveal to the target
    everything that we intend to complete. A staged payload on the other hand shows
    that the target will reach out to our server for additional payloads to execute.'
