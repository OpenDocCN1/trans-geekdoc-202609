- pgno: 83
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_83_0.png)


    **FIGURE 3.21** Access to the interactive JavaScript console on the page.


    With the developer console open, we can see that we can interactively access the
    DOM through the console. Hovering over the various parts of the page shows the
    various names of the divs in use. We can directly access the content in these
    fields by parsing the information in them with JS. Once we’ve proven we can access
    the data, we have confidence that we can exfiltrate the information from a login
    attempt.


    Let’s place some data into these fields without submitting them, and then determine
    how to retrieve them with JavaScript. To access the information stored in the
    field, we can gather it through the properties of the field with JavaScript. For
    example, for the **username** field, we can request the **username.value** property
    which will display the text stored in the username field. Additionally, we can
    gather the plaintext password as well by requesting the value of the **password**
    object with **password.value**! Even though the password is represented with hidden
    characters on the webpage, we can still access the plaintext password through
    JS. This is shown in Figure 3.22, where we can see the password stored in the
    field.'
