- pgno: 11
  md: '# Foreword


    “Oh no, not another hacking book!” This is the refrain I often hear when a new
    cyber-themed book hits the press. With the recent popularity surge around cybersecurity
    and vague media notions of shadowy hackers, it seems we face a glut of multimedia
    and print materials on hacking and breaking into systems. As a former practitioner-turned-professor
    focusing on cybersecurity for nearly two decades, I feel the current hype around
    “hacking all the things” sometimes gets in the way of the actual tradecraft.


    However, increased attention has also meant growth opportunities for the cybersecurity
    community. We see shortcomings around skills, standards, and practical knowledge
    effectively put into practice so we can address them. The co-authors Chris Haller,
    Jesse Varsalone, and I share a common background as practitioners – we have spent
    countless hours on real systems at real organizations, uncovering vulnerabilities
    affecting real people. Chris and I have collaborated as coaches for the US Cyber
    Team, pushing young talent to their creative and competitive limits. Jesse has
    been an invaluable mentor and friend to me over the years – I still reference
    resources he created years ago to continue to sharpen my own skills. Their diverse
    experiences, translated into this text, balance practical advice with the necessity
    to root skills in theory. There is no doubt that you’ll find this very textbook
    on my own bookshelf, dog-eared and ridden with footnotes and post-it notes from
    my own reading and learning.


    The book in your hands is no shallow overview of hacking, but a masterclass honed
    over decades of working in the field. Their step-by-step methodology, catalog
    of tools, and techniques build an intuitive foundation whether your background
    lies in development, system administration, or traditional infosec. Whether you
    are just breaking into the field or a seasoned professional, the coverage stands
    apart for being concise yet comprehensive – an invaluable resource benefiting
    the next generation of white hats.


    From reconnaissance to post-exploitation, these chapters capture the flexible
    mindset required when testing systems. As a young boy growing up in the coalfields
    of Appalachia, tinkering on my very first Commodore C64, that scrappy determination
    to pull things apart and reassemble still drives me to this day. Both Jesse, Chris,
    and I help foster that same tenacity for puzzles in students competing late into
    the night on CTFs and other attack and defense competitions. Quiet competence
    propels us more than flashy hacker stereotypes.


    I am thrilled Chris and Jesse have created this guide to the hacking basics, forged
    through countless hours of experience. Their work embodies the grit and perseverance
    that makes someone a master rather than a script-kiddie. This book empowers emerging
    and seasoned professionals to meet complex digital threats head-on.


    The hype may be loud in popular media, but it takes patience, creativity, and
    skill to find the soft underbelly of systems. I welcome you to roll up your sleeves
    and learn alongside the cybersecurity community’s best and brightest. Together,
    we can transform the digital wilderness into a more trustworthy ecosystem.


    Dr. Josh Brunty

    Head Coach, US Cyber Team

    Professor of Cybersecurity & Cyber Forensics - Marshall University'
  merge: -1
  img_proc: true
