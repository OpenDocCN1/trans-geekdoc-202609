- pgno: 200
  md: '# # 7 Privilege Escalation

    ## and Persistence


    # INTRODUCTION


    Gaining initial access to a system is only the beginning. Once this occurs, malicious
    actors continue to perform reconnaissance to gather information about the system,
    local activity, user information, and where critical information may be stored.
    Gaining administrative or root level access is generally the highest goal for
    attackers, but certainly not the only way escalation can be achieved. Remember
    that **access to the most critical data** is what organizations prioritize the
    most – compromising the confidentiality or integrity of this data will cause the
    most impact. What does this mean? Simply depending on our objectives, there may
    not need to be a direct escalation to administrative credentials, but rather a
    lateral move to an account with access to the critical data.


    To effectively pivot and escalate within a system, we must have a strong foundational
    understanding of how the system is designed to operate. Many of the escalation
    paths used involve leveraging one or many separate types of legitimate operating
    system functions. Without a strong understanding of how or why these core functions
    operate, we severely limit our capability and capacity to gain further access.


    With an established foothold on a system, we must begin by learning about the
    local environment of the host. What type of system is this? What are the established
    patch levels? Are there any other local users? Are any logged in? All of these
    questions and more help us understand how the system was designed and how it is
    implemented.


    Beyond the system and network we’ve entered, how does the organization operate?
    What are the organization’s strategic goals, and what types of protections do
    they have in place to defend them? Is critical data stored onsite somewhere, or
    is it funneled to the cloud somehow? These questions and many more are critical
    to how we approach moving within the system and laterally throughout the network.


    Lastly, escalation is DIFFICULT to do properly, effectively, and efficiently.
    However, just like everything else, the more we do it and practice, the more effective
    we will become. Leveraging training platforms such as HackTheBox, TryHackMe, and
    VulnHub we can practice our techniques safely and securely.


    # GOALS


    Our immediate goal is to gain access to the root or administrator account on a
    system, and then Domain Admin within an Active Directory (AD) environment. There
    are several ways that we may be able to achieve this, and they mostly revolve
    around finding a vulnerable escalation vector to exploit. Reconnaissance is a
    critical part of escalation as well since uncovering potential escalation paths
    is not an easy task. However, if we know the type of system, the types of accounts,
    and the potential risks associated with our findings we may be able to quickly
    escalate into these high-value accounts.


    For Linux-based systems, the highest level of privilege is the **root account**.
    This root account has complete control over the system and can be used to access
    all files on the host. Because of the level of control root has, most Linux-based
    operating systems recommend having a user account instead of using the root account
    for daily tasks. To execute tasks as root, the **sudo** command is used from the
    user’s account. Users must be marked within the **sudoers** file to execute commands
    as root.


    For Windows-based systems, there are two separate levels of administrative access.
    The first is the well-known **Administrator**, where the user account has complete
    control over the configuration and operation of the device. However, there is
    an additional **SYSTEM** level access within Windows'
  merge: -1
  img_proc: true
