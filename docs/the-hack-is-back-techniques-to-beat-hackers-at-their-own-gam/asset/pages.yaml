    ```


    **FIGURE 7.11** How to use the exploit PoC from GTFOBins to escalate privileges.


    This exploit in particular creates an nmap script which is interpreted and executed
    as the root user. The script is a simple shell running within the interactive
    process and allows us to have access to the shell as the root user when run with
    sudo. After establishing the shell, we can either change additional permissions
    within the sudoers file (make sure to use visudo!), grab a copy of the shadow
    file, or place a new SSH key into the **authorized_keys** file for root.


    Many other binaries within GTFO-bins clearly show how to escalate and leverage
    these binaries for access. The project is available at [https://gtfobins.github.io/](https://gtfobins.github.io/).


    # Exploits


    Finally, we always have known exploits that can be used to attack the system to
    try and gain further access. These privilege escalation exploits are released
    regularly as CVEs and commonly come with PoC code as well.


    Many sysadmins do not give local privilege escalation vulnerabilities the same
    thought or severity as remote exploits. This results in many times identifying
    hosts missing patches for very old vulnerabilities.'
