    # Providing Value


    BloodHound is an excellent tool that can be leveraged in many ways from identifying
    and exploiting attack paths to helping visualize risk to customers. Becoming familiar
    with this tool will make you an excellent tester to reduce risk across an enterprise.
    To stay up to date and understand the tool, it is recommended to visit and read
    the documentation for BloodHound at https://bloodhound.readthedocs.io/en/latest/.
    Remember, your tools are only as good as you know how to use them!'
