- pgno: 222
  md: 'To hide the malicious payload, we can use a simple payload such as the **net
    user** command to add a new administrative user to the machine. These can be packaged
    along with the original executable using **msfvenom**, see *Chapter 6* for more
    details on this type of attack.


    # Spaces Ruin Everything


    Search order resolution is where Windows systems attempt to resolve file paths
    in a structured order. There are certain fallback methods Windows uses to determine
    where it should try to find the file based on the file path and can be exploited
    if it is not properly prevented. This is tracked as MITRE ATT&CK ID T1574.008
    for Hijack Execution Flow: Path interception by Search Order Hijacking. Additionally,
    the Path Interception by Unquoted Path (MITRE ATT&CK T1574.009) follows a similar
    exploit where a path with spaces in the name can be hijacked.


    For example, our service above uses a folder where a user has write access not
    only to the binary itself but also to the folder containing the binary. Another
    exploit based on the unquoted service path allows us to place exploits along the
    search order path as Windows attempts to find the applicable executable.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_222_0.png)


    **FIGURE 7.15** Finding missing quotations for vulnerable services. If we can
    write to these locations, we can hijack the service!


    To identify this, a few useful commands to identify vulnerable services are below.
    The first command utilizes the **wmic** command to determine all services, then
    passes the results to search for services that are not in the **C:\Windows\**
    directory and which do not have a **quotation mark (")** in the information.


    ```

    ```text

    wmic service get name,displayname,pathname,startmode | findstr /i "Auto"

    | findstr /i /v "C:\Windows\\" | findstr /i /v "\""

    ```

    ```'
