    # FFUF


    **Ffuf** is an exceptionally speedy tool that stands for “Fuzz Faster u Fool”.
    This tool is remarkably fast when it comes to forced browsing and it offers a
    large amount of flexibility in how data is gathered. Using ffuf allows us to place
    a fuzzing payload anywhere within a GET, POST, or even a fake request method we
    make up. Additionally, we can keep track of responses based on length and response
    code.⁴


    To use **ffuf -h** to bring up the help window for the program. This brings up
    a LOT of information, but don’t be overwhelmed. Read through this slowly to make
    sure that you understand the available systems and configurations we can use to
    our advantage.'
  merge: -1
  img_proc: true
