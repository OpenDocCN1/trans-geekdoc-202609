- pgno: 209
  md: "To analyze the results from the sudo -l command, we can see that the user account\
    \ chris can run all commands with sudo without the requirement for a password.\
    \ To further refine the information presented from listing the sudo configuration,\
    \ we can specify the -ll switch (the same LOWERCASE “L”, just twice). This helps\
    \ list out further what the information outputted by sudo means.\n\n```\n$ sudo\
    \ -ll\nMatching Defaults entries for chris on MSI:\n    env_reset, mail_badpass,\n\
    secure_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:\n/bin:/snap/bin\n\
    \nUser chris may run the following commands on MSI:\n\nSudoers entry:\n    RunAsUsers:\
    \ ALL\n    RunAsGroups: ALL\n    Options: !authenticate\n    Commands:\n     \
    \   ALL\n```\n\nNote that there are no additional permissions revealed, but simply\
    \ that they are better formatted for us to read as humans. Notice that we can\
    \ see specifically that we can run ALL as users and groups, and that there is\
    \ no need to authenticate. This is a custom configuration created to allow users\
    \ to run sudo commands without a need to put their password in every time they\
    \ run a specific command.\n\nObviously, this is a horrendously insecure sudo policy\
    \ file. This is because anyone with access to this user, even without the user’s\
    \ password has access to run commands as the root user. Once they have access\
    \ as root, they can gain password hashes, SSH keys, and other sensitive information\
    \ that may be stored for other user accounts. Keep in mind however that the sudo\
    \ -l command will only list the sudo permissions for the current user and not\
    \ everyone else on the system.\n\nTo find out which other users on the host have\
    \ access to run sudo commands, we need to query the /etc/group file to see who\
    \ is in the sudo group. This indicates that the specified user will have access\
    \ to the sudo command on the machine. To identify this, we can grep the /etc/group\
    \ file to search for the sudo group and see which members are present. This is\
    \ accomplished by searching for the sudo group and printing it to the screen:\n\
    \n```\n$ grep '^sudo:.*$' /etc/group\nsudo:x:27:chris\n```\n\nTo make changes\
    \ to the sudoers file, we want to ensure it is done with the visudo command instead\
    \ of editing the file directly. We will need legitimate access to sudo before\
    \ we can make these changes! When using the visudo command, the sudoers file is\
    \ edited and checked for discrepancies that may otherwise break the sudo configuration.\
    \ Editing the sudoers file directly does not help protect the system from misconfigurations\
    \ within the policy and has the potential to lockout users from the system. Furthermore,\
    \ the misconfigured sudoers policy would prevent sudoing back into the file to\
    \ make the change and would likely require booting into the “single-user” mode\
    \ for recovery. Long story short? Just use the visudo command instead of directly\
    \ editing /etc/sudoers.\n\n# Who Can Change Our Windows Here?\n\nWindows utilizes\
    \ groups to help track and manage who should be allowed to have administrative\
    \ control over the machine. Similar to enumerating the local users, we can use\
    \ the net localgroup command to determine which users are in the Administrators\
    \ group. This is used to find out which user accounts have administrative access\
    \ on the machine to help take complete control."
