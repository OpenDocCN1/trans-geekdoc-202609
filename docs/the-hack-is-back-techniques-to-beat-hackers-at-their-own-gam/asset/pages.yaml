    ![](img/181571ad74cba0e6a2f38fcd2658651e_312_0.png)


    FIGURE 10.27 List of upcoming competitions.


    Another nice feature of the CTFtime, similar to tryhackme, is the write-ups. Write-ups
    are only allowed to be posted after the CTF has ended. Different members of the
    community post write-ups which include how they arrived at the solution to the
    question. Again, there are often multiple write-ups which allow you to get a diverse
    perspective on how to solve CTF problems. The write-ups are essential because
    they help you to solve problems that you might not know how to approach. Reviewing
    the write-ups for each of the CTFs that you participate in will help you to do
    better in future competitions.


