- pgno: 257
  md: 'The main thing that a company does not want to lose is their Intellectual Property
    (IP). Think of the formula for Coke or recipe for Kentucky Fried Chicken. Think
    of what value some of the formulas for prescription drugs or the schematics for
    Apple devices might be. And in the case of a company like Northrop Grumman, Boeing,
    or Lockheed Martin, the loss of the plans to make fighter jets might not only
    be impactful to the value of their stock but also to National Security. Things
    like blueprints of a fighter jet, battle plans, and the physical locations of
    soldiers could be information that can risk people’s lives.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_257_0.png)


    FIGURE 8.5 The Blueprints for Death Star.


    One of the things we have discussed in this chapter and other chapters is nation-states
    or state-sponsored hacking. Why might a country want to hack into a contractor’s
    systems and steal their intellectual property? If you think about some of these
    DoD contractors, they generally have a large highly paid staff with years of experience.
    Their employees have health and dental benefits, vacation, paid sick leave, and
    other perks like tuition reimbursement. Instead of hiring the best and the brightest
    (at a premium cost) to develop a fighter jet on a very expensive contract, why
    not just train some hackers to hack into one of the premium contractors of the
    United States and steal that IP from them. Although this is certainly an unethical
    approach, it is most definitely a cheaper one overall.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_257_1.png)


    FIGURE 8.6 Article Link: https://www.nydailynews.com/2015/01/20/chinese-hackers-stole-f-35-fighter-jet-blueprints-in-pentagon-hack-edward-snowden-documents-claim/


    # CAUSES OF A BREACH


    Sometimes the compromise can be due to commonly used software and the vulnerability
    becomes public and then it creates a race condition that necessitates that companies
    secure their systems immediately. Hackers will often keep a “waiting in the wings
    database” that will give them an edge when the vulnerability becomes publicly
    disclosed. Here is an example of how this might work. Say a hacker scans a website
    and finds out that it uses a specific version of Apache but there is no known'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'exploit for that version. The hacker can keep a list of targets that use that
    version and then when a vulnerability is disclosed, they can go to their list
    and find who is using that software and exploit them.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_258_0.png)


    **FIGURE 8.7** Version information of an Apache server.


    If the company is using software that is vulnerable like log4j or a specific version
    of Apache Struts, they are at risk of getting breached. At one time, the log4j
    vulnerability was a serious security risk for an inordinate amount of Internet-connected
    systems. Many of my friends and colleagues work for companies like CrowdStrike
    and Booze Allen and they were very busy doing Incident response, computer forensics,
    and remediation for several months after the log4j vulnerability was discovered.
    The Apache Struts led to the breach of Equifax which resulted in the disclosure
    of the Social Security numbers of most Americans. Specifically, it was the CVE-2017-5638
    vulnerability that led to the breach.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_258_1.png)


    **FIGURE 8.8** Synopsys blog post about the Apache Struts CVE-2017-5638 vulnerability.


    Sometimes companies and organizations take Cybersecurity very seriously and work
    diligently to keep their systems monitored, updated, secure, and safe. Even with
    all of those safeguards, sometimes a third-party or a Supply Chain attack can
    still lead to a compromise. In the case of one major national retailer, attackers
    entered the network through the HVAC system that was maintained by a small contractor.
    This is where the industry phrase Zero-Trust comes into play. When companies use
    third parties, merge, or make acquisitions of other companies, their security
    policies and safeguards may be at risk. When acquisitions or mergers take place,
    companies can be vulnerable when their new systems are protected properly.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_258_2.png)


    **FIGURE 8.9** Article Link: [https://krebsonsecurity.com/2014/02/target-hackers-broke-in-via-hvac-company/](https://krebsonsecurity.com/2014/02/target-hackers-broke-in-via-hvac-company/).'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'We discussed the threat of vulnerable software, mergers and acquisitions, and
    third-party vendors that all can leave companies and organizations with security
    holes they were not anticipating. There is also the threat of supply-chain attacks,
    in which a company uses software from a trusted vendor that becomes compromised.
    This was the case with SolarWinds, which has a wide customer base using its network
    management and monitoring software. The nation-state attackers, attributed to
    Russia, compromised SolarWinds and then were able to add a backdoor program into
    the software updates and when their customers deployed these updates with malicious
    code, they also became compromised.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_259_0.png)


    **FIGURE 8.10**  Article Link: [https://www.businessinsider.com/solarwinds-hack-explained-government-agencies-cyber-security-2020-12](https://www.businessinsider.com/solarwinds-hack-explained-government-agencies-cyber-security-2020-12).


    So why not just update all of your software all of the time? Well, in general,
    you should. And sometimes, you are even forced to, like with an iPhone or an XBOX.
    The XBOX brings up an interesting conundrum. Why does Microsoft force updates
    on their video game system for you to use it but not impose those same requirements
    on end users utilizing Microsoft Windows? Well, Microsoft Windows runs on countless
    computer vendor hardware platforms and pretty much is in the position of supporting
    an unlimited amount of different hardware configurations. This is what makes a
    MacBook Pro, iPhone, and XBOX so much easier to support as it is that the vendor
    is controlling the hardware and the Operating System (OS). Many times, updates
    might secure your systems but they can also break your applications as well. It
    is a constant game of cat and mouse for the IT staff to continually update systems
    that need to have their applications tested functionally almost every time these
    updates occur. This constant and unending battle is a great reason that a career
    in cyber seems fairly secure at the time of this writing.


    # DATA EXFIL 101


    Now we will move on to how data is stolen by the hacker and what techniques are
    used to perform these actions. First, let’s discuss what a hacker should go after
    and where the “best stuff” might be. If an attacker has the skills to break into
    a system, they also need to know where the “loot” might be located.


