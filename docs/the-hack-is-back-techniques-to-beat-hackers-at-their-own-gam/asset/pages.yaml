- pgno: 41
  md: 'Many other devices such as printers and firewalls can be found on Shodan as
    well, they likely will not have images associated with them, however.


    # MEMBERSHIP AND CREDITS


    Many of Shodan’s features require a membership to use them. By default, non-members
    have a handful of searches they’re allowed to complete daily. To complete more
    advanced searches and filters, one will need a paid account. At the time of writing,
    the membership is a one-time purchase of $49; however, Shodan has historically
    sold lifetime memberships for $1 on Black Friday sales. The membership can be
    purchased at https://account.shodan.io/billing/member.


    Each account has the concept of “credits”, which are used to track the number
    of searches and usage by each account. A member has up to 100 credits per month
    to use. Not all searches use credits, as a search query without any filters does
    not consume any.


    # API INTEGRATIONS


    Shodan supports a well-documented and easily integrated API to access their data.
    If developing software isn’t directly your forte, Shodan has a pip package that
    can be used to query the data from the command line easily. The package can be
    installed with the command below:


    ```

    $ pip install -U --user shodan

    ```


    Once installed, we can place our API key into the program to leverage Shodan’s
    data from the command line. Your API key is within your membership dashboard.


    ```

    shodan init YOUR_API_KEY

    ```


    After initialization, we can call the Shodan tool with shodan and provide a search
    query. This returns a similar amount of information from the website but in the
    terminal. Just as with other tools, anytime we can perform a process on the command
    line we give ourselves the ability to script out additional capabilities.


    By utilizing Shodan, organizations can prioritize their efforts, focusing on updating
    and patching outdated services that pose the greatest risk. This proactive approach
    greatly enhances the overall security of the organization and minimizes the chances
    of a successful cyberattack. Moreover, it allows IT teams to allocate their resources
    effectively, as they can now spend less time searching for vulnerabilities and
    more time implementing robust security measures.


    While there is a significant benefit to knowing our posture on Shodan, it is still
    prudent for organizations to block the Shodan scanners from indexing their assets.
    This is because the information on Shodan is available to anyone on the Internet,
    including threat actors who wish to harm legitimate organizations. IPFire has
    some excellent documentation¹ on how to block Shodan from indexing devices.


    In conclusion, Shodan offers a revolutionary solution for network administrators
    to locate and analyze outdated services in their network. By harnessing its powerful
    search engine capabilities, organizations can strengthen the security of their
    infrastructure, improve the efficiency of their operations, and ultimately safeguard
    their organization from potential cyber threats. Embracing Shodan as a valuable
    tool is a significant step toward a more secure and future-ready IT environment.


    # DEFAULT CONFIGURATION FILES


    When identifying services and devices, it is common to find many different types
    of systems and services we’ve never heard of before. This is where the power of
    Google comes from! Leveraging search engines to look for information, we can attempt
    to locate default login information on devices we’ve identified.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'For example, finding a Xerox printer password can be accomplished with a simple
    Google search, giving the tester information they need to attempt to sign into
    the asset:


    ![](img/181571ad74cba0e6a2f38fcd2658651e_42_0.png)


    FIGURE 2.8 Identifying the default login credentials for a Xerox printer based
    on a Google search.


    Beyond a simple Google search, we can also look at the source code if published
    online. Places such as GitHub, GitLab, and SourceForge are commonly used to host
    open-source projects and allow anyone to download and review the information.


    For example, the ChurchInfo program is an open-source project for churches to
    maintain a database of users, parishes, and events. This project is hosted on
    SourceForge, where reviewing information within the code shows that the default
    password is churchinfoadmin. This is shown in Figure 2.9.


    ```

    4) You should be able to access ChurchInfo at "http://[server name]/churchinfo".
    The database script will have set up an initial user called "Admin" with a password
    of "churchinfoadmin" (passwords are case insensitive). You will be prompted to
    change this password upon login. Once you have created other user accounts, you
    may delete or rename this default account. Just make sure that you always have
    a user with administrative privileges.

    ```


    FIGURE 2.9 Screenshot from the ChurchInfo readme stating the default password.


    It will be prudent to search for default passwords or configurations on systems
    when identified, as they could represent a way to gain initial access to an environment.
    Along these same lines, it is crucial to change the default credentials on systems
    as their applicable documentation is usually simple to locate.


    # DEFAULTS ON A LAN


    Devices on an internal network tend to have default credentials much more commonly
    than the Internet, simply due to the exposure factor for Internet-connected devices.
    As a result, a threat actor with access to an internal network will likely be
    able to identify and compromise connected devices for further exploitation.'
  merge: -1
  img_proc: true
- pgno: 43
  md: "For us to attempt to use default credentials, we must first find potential\
    \ devices. This is covered in detail in Chapter 3, Web Application Hacking, where\
    \ we are searching for many types of subdomains and open ports. In the context\
    \ of this chapter, we will be exploring a simple IP range on a sample local subnet.\n\
    \nTo find devices on the network, we must start with a port scan. Based on the\
    \ intelligence from our initial starting point, we can determine what our local\
    \ subnet is and where we are located logically. This can be found with our IP\
    \ address on our system, using commands such as ip a for Linux and ipconfig /all\
    \ for a Windows machine.\n\nIn the example below, we can see that the IP address\
    \ in interface eth0 has been assigned the IP address of 192.168.40.191 with a\
    \ CIDR of 24. This indicates that the local subnet is within the range of 192.168.40.0/24.\n\
    \n```\n(chris@kali) - [~/config]\n└$ ip a\n1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536\
    \ qdisc noqueue state UNKNOWN group default qlen 1000\n    link/loopback 00:00:00:00:00:00\
    \ brd 00:00:00:00:00:00\n    inet 127.0.0.1/8 scope host lo\n       valid_lft\
    \ forever preferred_lft forever\n    inet6 ::1/128 scope host proto kernel_lo\n\
    \       valid_lft forever preferred_lft forever\n2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP>\
    \ mtu 1500 qdisc fq_codel state UP group default qlen 1000\n    link/ether 00:0c:29:02:29:0b\
    \ brd ff:ff:ff:ff:ff:ff\n    inet 192.168.40.191/24 brd 192.168.40.255 scope global\
    \ dynamic noprefixroute eth0\n       valid_lft 23754sec preferred_lft 23754sec\n\
    \    inet6 fe80::20c:29ff:fe02:290b/64 scope link noprefixroute\n       valid_lft\
    \ forever preferred_lft forever\n```\n\nUsing that information, we can scan the\
    \ 192.168.40.0/24 subnet for active devices. The tool nmap is well suited for\
    \ this and has been available for decades. From an operational perspective, we're\
    \ looking for devices that are available on the network and have open ports. We\
    \ can accomplish this with a command similar to below:\n\n```\n$ sudo nmap -sV\
    \ -sC 192.168.40.0/24 -oA nmap_output\n```\n\nThis command scans the local network\
    \ we're on and searches for the top 1,000 most common TCP ports. It will additionally\
    \ try to fingerprint what services are available with the -sV switch, and some\
    \ common enumeration scripts with the -sC switch, and then save the output in\
    \ multiple formats with the -oA switch. One of the most important formats we'll\
    \ use in later tools is the XML type, in our example the output will be saved\
    \ as nmap_output.xml.\n\nNow that we have a sense of the assets available on the\
    \ network, we need to determine which ones have available services to log into.\
    \ There are many ways to help determine this, but one of the easiest ways to identify\
    \ web services is with the EyeWitness program. This will take the XML formatted\
    \ file we created and automate taking screenshots of applicable web services for\
    \ us to review. Using a report of compiled screenshots allows us to quickly review\
    \ and determine if a website is potentially vulnerable or may be worth investigating\
    \ further.\n\nEyeWitness can be run using the following command:\n\n```\n$ eyewitness\
    \ -x nmap_output.xml --delay 15\n```\n\nWhat this does is read from the XML file\
    \ we created with nmap, then wait 15 seconds to take a screenshot for each web\
    \ service. The delay is important, as many IoT devices have lower power and can\
    \ take longer than expected to load a webpage."
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_44_0.png)


    # FIGURE 2.10 Finding a potentially interesting printer page through EyeWitness.


    In the case of our example, we’ve identified what appears to be a printer on the
    subnet which has a web server available for us to review. In the case of an operational
    network, we would attempt to identify as many of these systems as possible to
    keep track of and use at a later time.


    An even cooler piece about EyeWitness? If it detects a known type of device, it
    can provide the default credentials! These are stored in the signatures.txt file
    for EyeWitness and are placed into the report automatically when detected.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_44_1.png)


    ```

    1 Integrated Dell Remote Access Controller|(Dell iDRAC) ...

    2 ACE 4710 Device Manager|Cisco|(ACE 4710 Device Manager) ...

    3 ATutor;form_login_action;/gad_search.php|(ATutor Web CMS) ...

    4 Apache Lenya;lenya.action=introspect|(Apache Lenya) ...

    5 Polycom RSS 2000|(Polycom RSS 2000) ...

    6 Polycom;HDX 8000 HD|(Polycom HDX 8000) admin/<SerialNumberOfDevice>

    7 Drupal.settings|(Drupal) admin/<assigned at install>

    8 var daisy;daisy.site;daisy.site.name|(Daisy CMS) ...

    ```


    # FIGURE 2.11 Sample of default credentials within the EyeWitness source code
    used when detected.


    # ASSESSING DEFAULT CONFIGURATIONS


    Most of these issues rely on identifying assets that may otherwise be unknown
    or forgotten. Printers and IP Cameras are some of the most commonly attacked devices
    with default configurations, as their passwords are generally exceptionally weak.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Now you may be asking yourself, why should I care if someone can log into a
    printer? Is that a concern? Surprisingly, yes! With the level of interactivity
    that printers and multi-function devices have today, it is common for these devices
    to have credentials stored in plaintext for an attacker to gather. Consider a
    scanner that is used to send emails: there is a high chance that the device will
    need to authenticate to an email server to send the scan as an attachment. If
    we can log into the printer with default credentials and then gather the email
    credentials, we can sign into the email account and likely the rest of the domain.


    IP Cameras are generally forgotten to have their passwords changed as well, however,
    they are much less likely to contain configured credential information. On the
    other hand, these cameras provide a direct path to the physical world – we’re
    able to see and track individuals inside and outside of a building. The amount
    of additional intelligence gathered through access to the physical mediums can
    give attackers significant advantages.


    Attempting to exploit these systems can usually be done by attempting to log into
    the device using the default credentials. In the case of a successful authentication
    attempt, we would want to pay close attention to whether any stored credentials
    are on the system or not.


    With regards to our identified potential printer, the Glitchomatic website identified
    on our local subnet, we need to pay close attention to how it may be configured.
    We can see that there’s a page for Network Settings which catches our interest,
    as this may contain credentials we can steal. However, clicking on the Network
    Settings page shows that we need to be authenticated first.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_45_0.png)


    FIGURE 2.12 We cannot view the settings without being authenticated first.


    We can attempt logging in with very common credentials first, but this does not
    give us any headway. This includes using common or easily guessed credentials,
    such as admin:admin or admin:1111. A review of the webpage shows that the website
    has a Documentation page which we should investigate closely.'
  merge: -1
  img_proc: true
