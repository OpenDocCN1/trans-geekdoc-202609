- pgno: 31
  md: 'need to disable the administrator account. When the user is at the login screen,
    they will notice two accounts, theirs and the administrator. This might appear
    odd to the machine owner so we can run the commands below to deactivate the administrator.
    And, after that, we will go ahead and clear the security log so none of our actions
    can be tracked. Although there will be a single log entry indicating the log was
    cleared, there will be hundreds of additional entries in the log after that event
    so that one log entry will not likely be of great concern for the attacker.


    ```

    C:\Windows\System32>net user Administrator | find "active"

    C:\Windows\System32> net user Administrator /active:no

    C:\Windows\System32> wevtutil cl Security

    ```


    ![](img/181571ad74cba0e6a2f38fcd2658651e_31_0.png)


    FIGURE 1.30 Deactivate the Administrator Account.


    Now that administrator account has been re-disabled and their profile has been
    deleted, we can move on to the final steps which will involve replacing the altered
    Utilman.exe with the legitimate file.


    *Steps to undo the method used to break into the Windows Operating System without
    a password:*


    +   1. Get a copy of the installation media for Windows on a USB drive or legacy
    media like DVD.

    +      Note with a DVD, you select that choice in step 2 and press the space bar
    immediately.

    +   2. Enter the boot menu of the computer to ensure you can boot to installation
    media (if needed).

    +      Note that if you have secure boot enabled, that will need to be disabled
    in the BIOS.

    +   3. You should get to a Windows installation screen where you can select the
    Language. Click Next.

    +   4. At this point, DO NOT CLICK the Install button. Instead, click Repair your
    Computer.

    +      Note: Going through the installation process can wipe out all of your data.

    +   5. Select Troubleshoot from the list of Options.

    +   6. Select Command Prompt from the list of Advanced options.

    +   7. Type X:\Sources> copy C:\Windows\System32\Utilman.1 C:\Windows\System32\Utilman.exe

    +   8. Click Y. Close the Command Prompt Windows by clicking the red X in the
    top right corner.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_31_1.png)


