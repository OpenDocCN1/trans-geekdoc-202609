    not be validated.

    5 exploit/linux/local/su_login Yes The target appears to be vulnerable.

    6 exploit/unix/local/setuid_nmap Yes The target is vulnerable. /usr/bin/nmap is
    setuid

    7 exploit/linux/local/abrt_race... No The target is not exploitable.

    8 exploit/linux/local/abrt_osreport_priv_esc No The target is not exploitable.

    ```


    FIGURE 7.13 After completing the enumeration, the list of potentially vulnerable
    escalation paths and their modules is presented.


    Another tool that can be used is the Linux Exploit Suggestor, also known as LES.
    This is a tool that helps enumerate and identify potential exploits which the
    machine may be vulnerable to. Generally, this is limited to the kernel-based exploits
    which are checked and matched against the distro release identified. This tool
    can be identified and downloaded at https://mzet.github.io/2019/05/10/les-paper.html.


    Finally, there is always LinPEAS. See later in this chapter for the PEASS scripts,
    they’re worth it!


    # WINDOWS PRIVESC


    Similar to Linux, there are many additional privilege escalation vectors on Windows
    machines. Many of these rely on built-in or otherwise sensitive permissions that
    are not direct members of the Administrators group. Separately, Windows operates
    things such as services in a much different manner which can cause unintended
    results. As a result, many escalation paths within Windows rely on misconfigurations
    instead of typical, raw exploits.


    There are many different types of escalation paths within Windows and Active Directory
    machines, with new ones being released as they are discovered. This part of the
    book covers some of the most commonly found and vulnerable configurations within
    a local Windows machine.'
