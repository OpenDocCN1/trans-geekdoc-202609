- pgno: 154
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_154_0.png)


    **FIGURE 5.7**  Basic troubleshooting process.


    # Learn the Requirements, Define the Problem


    Initial troubleshooting skills are generally reduced to helpdesk and introductory
    system administrator work. But keep in mind that if we’re troubleshooting something,
    it’s to solve an issue and reach a specific objective. Before we can begin to
    solve the issue, we must define what the requirement to solve the problem is,
    as well as define the problem that is preventing that.


    For example, let’s say we’re working on the IT Helpdesk running trouble tickets
    (a common place where many hackers cut their teeth, including me!). A call comes
    in which a user states they cannot reach their email.


    There are countless different reasons why a user may not be able to reach their
    email, but before we go down that road, we need to understand what our objective
    is. Based on this call, we need to ensure that we give this user access to their
    email so they can read it. To define the problem, we are going to stay high-level
    before getting into technical guesses and thoughts. Our problem based on the phone
    call is that the user cannot reach email.


    To effectively resolve this ticket, our goal will be to have the user regain access
    to their email and the current problem is that they cannot reach their email.
    All of our actions will need to keep these two items in mind as we work through
    our troubleshooting process.


    # Narrowing Down the Problem


    Once we have understood what our goal is, we need to reduce the possible reasons
    why the issue exists. Reducing the areas to investigate will significantly simplify
    the amount of effort and time wasted while we respond to the event. This is achieved
    by starting at the largest and widest things we can quickly prove. With our current
    example of no-email access for a user, we can start by determining some different
    items to try and reduce the set of technical areas to investigate further.


    First and foremost, is the entire Internet down across the world? This is pretty
    unlikely, but not impossible. Using your analyst workstation, you can attempt
    to visit a website such as Google or Office 365 to determine that the Internet
    is (hopefully) still up and running across the globe. Simultaneously, this proves
    that the site we’re at has connectivity to the Internet.


    Once this has been proven, we can try to find out if we can access our email as
    well, assuming that we use the same email server as the customer who placed the
    trouble ticket. This helps narrow down if there is an issue with the overall email
    server used by the organization, or if there is an issue with the customer’s account
    itself. Opening our Outlook shows that we are connected to the email server and
    are actively receiving emails from users. This now proves that the email server
    is likely functioning as intended, and we should continue to narrow down possibilities.


    For other types of problems, we can always use tools such as Wireshark to gather
    packets for us to review. Packets never lie! By gathering packet captures (PCAP)
    of the activity, we can review how the activity unfolds and where the issue may
    lie. In the case of plaintext HTTP attacks, we can review the specific HTTP requests
    to see where a specific exploit may fail.


    For HTTPS, we can always utilize Burp Suite to intercept and review activity as
    it occurs across the wire. Please see [Chapter 3](#): Web Application Hacking
    and Defense for a clear description of how to use Burp Suite and intercept HTTPS
    requests.


    # Research


    Once we have found the problem, we need to research how to solve it. Since we
    have a solid understanding of where the issue lies, we need to look up how the
    problem may be solved. Providing specific software and hardware versions will
    help narrow down the issue and can help find additional information.'
  merge: -1
  img_proc: true
