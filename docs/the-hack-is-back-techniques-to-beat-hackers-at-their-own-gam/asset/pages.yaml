- pgno: 254
  md: '# 8 Data Exfiltration

    Leakage (Pwned)


    # INTRODUCTION


    In this chapter, we’ll explore how data is taken from a network. You can approach
    this chapter in three ways:


    +   1. I am an attacker and I want to know some good techniques for exfiltrating
    data.

    +   2. I am an analyst and I want to know more about where to look for evidence
    of exfiltration.

    +   3. I am interested in cybersecurity and want to know how and why hackers steal
    data.


    It is important to note that there is a purpose to hackers. Hacking is often motivated
    by the following:


    +   - Financial gain

    +   - A political motivation

    +   - Revenge


    There are also those who are curious or demonstrating skills, but typically hacking
    involves trying to get money. Countries, including the United States, which are
    referred to as “nation-states” also are actively engage in hacking campaigns.
    So, certain individuals who are working for their country are allowed to hack,
    as it is justified as being tied into a mission of the country’s national security.
    Just about all countries will often engage in espionage in order to protect their
    citizens.


    In the case of the United States, the National Security Agency, or NSA (flippantly
    called No-Such Agency) engages in Offensive Cyber Operations to protect the country.
    The headquarters of the NSA is located at Fort Meade in Anne Arundel County, Maryland.
    I live 14 miles from the main entrance and it is a huge facility that has its
    own exit off of the Baltimore Washington International Parkway (please don’t take
    that exit or you can be detained and searched). To me, NSA is a great place to
    work and is one of the biggest local employers in the area and a reason why the
    state of Maryland is such a hub for Cybersecurity. At NSA, the jobs are very stable,
    and most of the people who go to work for the government spend an entire career
    there. NSA also plays a vital role in Cybersecurity curriculum for Universities
    with their NSA Center of Academic Excellence designations. University of Maryland
    Global Campus (UMGC) is one of these centers, and that has afforded the university
    many benefits, like being able to compete in Hack the Building competitions.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_255_0.png)


    **FIGURE 8.1**  The NSA engages in Offensive Cyber Operations.


    With regard to the United States, the NSA influences Cyber academic programs at
    Universities and Colleges by providing accreditation to their programs when they
    meet certain curriculum criteria. There are three National Centers of Academic
    Excellence in Cybersecurity (NCAE-C) programs:


    +   - Cyber Defense (CAE-CD)

    +   - Cyber Research (CAE-R)

    +   - Cyber Operations (CAE-CO)


    ![](img/181571ad74cba0e6a2f38fcd2658651e_255_1.png)


    **FIGURE 8.2**  The NSA engages in Offensive Cyber Operations.


    Cyber Operations is offensive in nature and would focus more on pentesting, red
    teaming, and exploitation. For Cyber Defense, there is a focus on blue team-related
    tasks which will help secure and protect systems. For Cyber Research, think more
    PhD level research involving Cyber curriculum. The US encourages the participation
    of students from middle school through PhD programs in Cyber-related fields through
    National Science Foundation (NSF) funding. Individuals who enter the military
    can often wind up in Cyber Job roles, and Cyber is becoming a large component
    of military operations for all branches.


    If you want to hack organizations or other countries outside of the United States,
    you better be part of the US Military or NSA and have authorization from your
    supervisor. The United States government does not permit individuals to do rogue
    hacking even if they are doing hacking against a hostile foreign nation. If you
    engage in this type of nefarious activity in the US (not that I have), you might
    need to expect some visitors at your house from law enforcement or a 3-letter
    agency. Some people believe that other countries outside of the United States
    actually allow and possibly even encourage their citizens to engage in this type
    of illegal activity. As far as the US goes, there is not much their law enforcement
    can do to prosecute these individuals who fall outside of US jurisdiction. Unless
    the government where the offending hacker is a citizen agrees to extradition,
    the US has little to no recourse against the attackers. If the US can attribute
    and determine that the attack is “state-sponsored” and coming from a hostile nation,
    then they can try to put political pressure on the nation, but they are often
    likely to deny any type of culpability.'
