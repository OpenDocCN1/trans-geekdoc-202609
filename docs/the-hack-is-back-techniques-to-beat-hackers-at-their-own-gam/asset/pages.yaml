    m41where.org.            900     IN      SOA     ns1.hover.com.

    dnsmaster.hover.com. 1577806130 10800 3600 604800 900

    m41where.org.            900     IN      NS      ns2.hover.com.


    ;; Query time: 720 msec

    ;; SERVER: 8.8.8.8#53(8.8.8.8) (TCP)

