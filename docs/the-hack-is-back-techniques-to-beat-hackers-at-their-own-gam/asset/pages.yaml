- pgno: 112
  md: '# ATTACKING YOUR STUFF


    Using the techniques from this chapter and your own personal experience, you should
    attack your web applications to determine if they suffer from these types of vulnerabilities.
    Manual attacks and analysis of an organization’s web applications prove fruitful
    in identifying vulnerabilities before they can be used to harm the organization.


    As always, ensure that you have written permission from the owners and operators
    of the application before beginning any testing. In this author’s experience,
    in-house application developers and IT POCs are open to internal security testing
    if the availability of the resource is kept in mind. The organization still needs
    to conduct business, so any attacks that may limit the proper functions for legitimate
    operations must be reduced.


    # STORIES FROM THE FIELD


    There are many stories from this author’s perspective found while testing web
    applications on the Internet and internally. The paragraphs below cover not only
    a subset of the vulnerabilities found but also include how they were weaponized
    to prove an impact.


    During an engagement, we were able to identify an arbitrary upload exploit that
    allowed us to upload any type of file as an “Icon” for a profile picture. This
    file was stored on the file system of a different server and directly served with
    Apache. Unfortunately, this web application did not perform any type of checking
    to prevent non-image files from being uploaded – this allowed us to upload an
    arbitrary PHP file which was executed by Apache for remote code execution. This
    was further explored to create a meterpreter session for additional escalation
    on the machine and DMZ. During our report recommendations, we stated how this
    upload field presented a threat in its current configuration. The OWASP WSTG was
    leveraged along with other cheat sheets to present recommendations on protecting
    the application from this type of attack.


    Another interesting story involved uncovering a **config.php.bak** file while
    running GoBuster on a client website. When accessed, this file was served without
    being interpreted by PHP and gave us clear insight into how various configurations
    were applied for the web application. One key piece of information was an email
    configuration for the web application which was the plaintext password for the
    organizational IT helpdesk account. This set of credentials was leveraged to sign
    into the IT helpdesk account on their Outlook Web Access, providing access to
    internal email systems. At this point, we could send users emails as the legitimate
    helpdesk account and would be able to craft an exceptional phishing attack. Imagine
    receiving an email from your organization’s legitimate helpdesk email asking for
    everyone to test their password strength. It would be simply *devastatingly effective*
    and would likely jeopardize end-users faith in organizational IT resources – which
    is exactly why we did not launch it. Remember, we are all on the same team when
    it comes to pen-testing, our goal is to find and accurately represent a risk in
    the operating environment. During the report, we outlined how we found the plaintext
    password and gained access to the email account – then also explained why we decided
    not to exploit it further. The POCs for this organization were thrilled with our
    judgment to not phish users further with the helpdesk account.


    A third story is the one that was referenced earlier for the reflected XSS on
    a login error parameter. This vulnerability was weaponized to leverage the JQuery
    library already imported into the DOM and create an AJAX POST request which steals
    credentials when clicking the “Login” button. By reading the fields within the
    DOM which contained the Username and Password for the user, we were able to hook
    the login button to exfiltrate this information when it was clicked. The result?
    A completely seamless login experience from the user’s perspective – they would
    click the login button and still get logged into the application as expected.
    However, an additional request was sent to our controlled infrastructure which
    stole the plaintext credentials harvested from the DOM. This story, in particular,
    is one of the best to help understand the legitimate risks with XSS and how it
    can be weaponized.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# SUMMARY


    Web applications have and will continue to be an effective attack surface against
    a target, as the web continues to ingrain itself deeper into everyday life. To
    effectively evaluate applications, we need to make sure that we have a strict
    methodology to not only gather potential hosts but also identify the services
    they provide. Each piece of information that is gathered can be applied to an
    overall intelligence picture.


    Understanding the tools and procedures to leverage during this testing helps us
    find these vulnerabilities before they can be attacked by a threat actor. Knowing
    how to use these tools properly makes sure that we are effective at how we find
    and address these concerns.


    Just like everything else in cybersecurity, staying ahead and learning more about
    each piece of technology is critical to being successful.


    # NOTES


    +   1. https://owasp.org/www-project-amass/

    +   2. https://www.kali.org/tools/wordlists/

    +   3. https://github.com/OJ/gobuster/blob/c49ddbf3a767aa496ccc6cbf90f6aa002c30f3fca/gobusterdir/gobusterdir.go#L20

    +   4. https://developer.mozilla.org/en-US/docs/Learn/Common_questions/What_is_a_URL#anchor

    +   5. https://geminiadvisory.io/gemini-annual-report-2021-magecart-thrives-in-the-payment-card-fraud-landscape/

    +   6. https://www.cisa.gov/usc ert/apache-log4j-vulnerability-guidance

    +   7. https://w3techs.com/technologies/details/pl-java'
  merge: -1
