    # Nessus


    Nessus is a paid security scanner from Tenable. This is another excellent vulnerability
    scanning tool that can be used to keep track of and identify things such as missing
    patches, insecure settings, and improvements over time. Because of its simplicity
    and effectiveness, Nessus is a popular tool in many organizations and for security
    professionals.


    Nessus has a free-tier labeled Nessus Essentials, targeted at educators, students,
    and hobbyists. This version of the tool has a limitation of 16 IP addresses per
    scan but can be useful to get started and try to get organizational leadership
    onboard for purchase. The Essentials license can be configured easily at the setup
