    FIGURE 7.24 Running NetExec to enumerate shares across a CIDR with a known set
    of credentials.


    In the case of the Uber breach in September of 2022, the attacker leveraged open
    SMB shares that contained plaintext administrator credentials in PowerShell scripts.
    This shows a clear and present impact of this threat and how difficult it can
    be to find it properly without regular penetration testing and threat emulation.
    Uber, a 318 billion dollar company struggled with this – how can we learn from
    their mistake to protect other environments? how can we learn from their mistake
    to protect other environments?


    # SYSVOL Share


    The SYSVOL is a specific share within the Domain Controllers which is used to
    support domain functions. This folder exists to support AD functions within a
    domain and must be domain public for users and computers to access. Generally,
    there are a lot of Group Policy Objects and references in this folder. It is less
    common to find local admin passwords via Group Policy stored in these folders,
    but it is still very possible.


    This GPO stores an encrypted local admin password within the public folder, however,
    Microsoft has published the encryption password online.14 This means that anyone
    who can find a local admin password within the SYSVOL folder can decrypt it to
    try and gain access to the local machines.


    Along with this, many administrators will store domain scripts within the scripts
    folder on the SYSVOL. This is a common technique for admins to ensure that users
    and machines run a specific script on boot or logon. Some of these scripts will
    attempt to perform actions such as mapping drives or running additional programs,
    pay attention to these as they can reveal sensitive information.


    In this author’s professional experience, one internal test revealed that a domain
    script on the SYSVOL\scripts folder leveraged an encrypted password for an administrator
    account. This password was used to run functions and processes as the elevated
    account when a domain'
  merge: -1
