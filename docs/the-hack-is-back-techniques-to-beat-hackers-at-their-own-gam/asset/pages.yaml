  md: 'Great! Based on **Figure 3.19**, it looks like the XSS is executing properly.
    But now let’s consider where we are and what can be accessed on this page. Inspecting
    the Document Object Model (DOM) shows that we have access to the forms used to
    submit the username and password, as shown in **Figure 3.20**. What happens if
    we also hijack this form, and force it to submit to us as well? Is that even possible?


    ![](img/181571ad74cba0e6a2f38fcd2658651e_82_0.png)


    **FIGURE 3.20** Identifying the input fields for this page, we have the ways to
    access the values stored in these fields.


    For us to find out, we need to start by identifying what valid JavaScript is needed
    to achieve this. Let’s start by opening the developer console (usually F12 or
    right-clicking and saying “open in console”). From here, we have access to an
    interactive JavaScript instance with the DOM, as shown in **Figure 3.21**. Let’s
    try to access the form and see if we can gather information from it. Pay close
    attention to the **id** for the fields, this is how we can programmatically access
    information stored within them. For example, the box which we type our username
    into has the ID of **username**.'
