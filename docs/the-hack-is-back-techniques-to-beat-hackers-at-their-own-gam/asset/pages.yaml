- pgno: 232
  md: 'user logged on. Simple reverse engineering of the binary and encrypted password
    revealed the plaintext password used by the account, which was one of several
    avenues used to compromise the domain.


    # LOCAL ADMIN ACCESS


    In many instances, we will gain administrative access to a local machine on the
    domain with the intent to escalate through to Domain Admin. There are several
    ways where this can be achieved, such as gathering the password or the NTLM hash
    for the local administrator account. It is important for sysadmins to have the
    ability to log into a machine as a local administrator to fix issues if the machine
    can’t reach the network. However, if machines all use the same local administrator
    password, it’s possible to use this authentication material to pivot around to
    other machines on the domain.


    In order to remediate this, use the Microsoft Local Administrator Password Solution
    (LAPS). This uses Active Directory to manage the local administrator authentication
    material for unique passwords per machine. Implementing LAPS is simple and easy
    to ensure that it can be used inside as many environments as possible.


    # BLOODHOUND


    BloodHound is a tool developed by SpecterOps and is used to enumerate and uncover
    attack paths within AD permissions. BloodHound can uncover many difficult to identify
    or understand escalation paths and provides a convenient graph-based visualization.
    The tool can help effectively show who and how an escalation path can be leveraged
    within the environment.


    BloodHound operates by using a collection agent to gather all of the information
    available within AD, then import it into a neo4j database for storage. The BloodHound
    GUI connects to this database to perform analysis in a visual format. This visual
    analysis not only helps us as attackers to see escalation paths but helps sysadmins
    and business decision-makers understand and visually comprehend the level of risk.
    This author has consistently utilized screenshots from BloodHound in reports to
    customers to help display information in a digestible manner.


    BloodHound is also a tool listed on the MITRE ATT&CK framework as tool ID S0521.¹⁵
    There are at least four known and named threat actors who leverage BloodHound
    to exploit an AD domain for personal gain. Becoming familiar with this software
    will help us understand and display risk to customers to ultimately reduce operating
    risk.


    Note that as of August 2023, the Bloodhound Community Edition was released. This
    offers several benefits over the Bloodhound Legacy version, such as an entirely
    containerized architecture. Beyond this, the cypher queries are faster and the
    CE supports an API. For this section, we’ll explore Bloodhound CE as Bloodhound
    Legacy is no longer supported.


    # Sniffing out the Data


    To analyze an AD environment for potential escalation paths, the network must
    be enumerated with a collection tool to gain the list of all objects and their
    relationships. This is done with a BloodHound collection agent, which can be run
    via a C# executable, PowerShell script, or even Python from a Linux-based machine.
    Generally, this will require user-level permissions to bind to the Domain Controller.


    This author prefers the python version of the ingestor, also known as **bloodhound.py**.
    This tool is a part of the Kali repository and can be installed with **sudo apt
    install bloodhound.py**. Once installed via **apt**, it can be run with the **bloodhound-python**
    command. To collect data from AD to import into the BloodHound GUI, we must provide
    credentials to gather information. There are various collection methods, but generally
    we should choose **all** to ensure we have the most amount of data to search through
    the domain.'
