    With access to these administrative credentials, we must remember to gather reconnaissance
    about the new levels of access we’ve gained and integrate them into our existing
    intelligence profile for the target. The new information will create additional
    access that we may not otherwise have previously. One piece is the **File Read
    Utility** which appears to allow us to read a file on the system, as apparent
