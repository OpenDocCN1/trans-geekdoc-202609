    |     O +. +. . + . |

    |     +. +=So . = O |

    |     . O+.OO . + O + |

    |    +.E . . OO O. |

    |   + O.O .   .  B |

    |   +O=..       ++ |

    +----[SHA256]-----+

    ```


    To keep track of which public/private key pairs are authorized to authenticate
    for an account, the ssh program checks in the user''s home folder for the ~/.ssh/authorized_keys
    file. This file contains a list of public keys that permit the applicable private
    key to sign into that account. This is a plain text file that takes the principals,
    options, key-type, and the base64 encoded (public) key. When placed into the authorized_keys
    file, any future SSH authentication attempts to that account can be authenticated
    with the applicable private key.


    To read the public key format to place into the authorized_keys file, we can print
    the applicable public-key file to the screen using cat. In the example from above,
    we saw that our key pairs were saved as the ~/.ssh/id_rsa and ~/.ssh/id_rsa.pub
    files. To view the public key, run cat ~/.ssh/id_rsa.pub.


    ```

    $ cat ~/.ssh/id_rsa.pub

    ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC3UHZ2W2Nr7n5+frSG6LW4jgtH/AQ1+l8pe5xxnk3diMuRqW4bLHKeaiffuvctVroew6e7cn+6skYag3O1+R7AgN6Q2HZNBC/GBXwTJlnmStW6D1Ut5cghFV2ADRsSvjJ2EWpObQKWSQOqIADTMfmxJB6J/7KQM0uUK6K1RR0toTUj
    fApNiJ8XwLQm/abNXtunt6Awj+cIW/rDwC3jleekcYtXrOcJB32B/x8woJWTFowfeOG41mAMx zEq6gyp7vnxkD6IF7MTeYWDsGx9dXGT0IsDzaCp/tPNITvDJfV0kSLW6F83wQMwtb1Y57PuCkTnOnSNNvTV3404UzFxC3kMKRSSfmPkLr3mhwf11NOxMIhTw0hIsINvLBQvJhQmj1NyS2Wykx1VEhjQV9IdCivG03mtM4EMWkc+T2Q8McTJEEfWhj7hUOA2ueDY8nr8LWV2cHgAVriENlSOXCvumJuNud9XyXvVVfZHxIITznYagXtRShcWM=
    chris@kali

    ```


    With this public key format, we can simply copy/paste this into the ~/.ssh/authorized_keys
    file on the server and have key-based authentication for SSH. Always make sure
    to APPEND to this file if possible, because overwriting it will prevent any existing
    key pairs from being used by that user. Alternatively, we can use the ssh-copy-id
    command to place a key pair into a remote machine – however, the ssh-copy-id requires
    password-based authentication during the copying process. In many exploit scenarios,
    it is likely that we will not have a password available to complete this. Once
    the public key has been placed in the server''s authorized_keys file, we can authenticate
    to the system by specifying the -i flag for the ssh command to provide an identity
    file. This would look similar to the command below to log into a system where
    we have the matching private key for the public key on the system.


    ```

    $ ssh -i ~/.ssh/id_rsa chris@192.168.0.1

    ```'
