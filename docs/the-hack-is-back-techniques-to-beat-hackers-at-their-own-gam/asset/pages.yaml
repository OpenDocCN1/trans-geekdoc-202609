- pgno: 150
  md: 'The Wireshark Foundation has an excellent OUI lookup tool available at https://www.wireshark.org/tools/oui-lookup.html.
    There are several other similar websites online that can be used to determine
    OUIs found on a network as well.


    # Layer 3: Network


    The third layer is the network layer which is used to send packets across networks.
    This is the layer that uses Internet Protocol (IP) and where IP addresses are
    given and routed. Layer 3 sends packets across different networks, whether they
    are within internal networks or across the Internet.


    Contrary to layer two, layer three’s IP addresses can be easily changed and are
    designed to be modified. This is because of protocols such as DHCP which hand
    out IP addresses on the network, as well as other network configuration information
    to operate effectively on the network.


    Routing is the action where packets are transferred between two separate networks.
    These different networks must have a router in between them to help determine
    where to send the packets within the connected networks. As the switch determines
    where the frame is destined, it will identify that it needs to be sent to the
    router to be routed to a different network. Layer 2 cannot route packets between
    networks, but many modern switches these days can operate at layer 3 to route
    packets as needed.


    # Layer 4: Transport


    The fourth layer is used to help manage the transport of the data and how it is
    delivered to the applicable applications. This layer is where TCP and UDP operate,
    which are the two most common transport layer protocols. These two protocols are
    used to help the delivery of information across the network before they are passed
    to the applications.


    TCP is used to help ensure the reliability of data transfer. This ensures that
    we receive the exact data and bytes so they can be reassembled together in order.
    If data is missing or malformed, TCP will automatically help ensure that the correct
    data is resent and received.


    TCP operates with a handshaking process used to establish a two-way connection.
    This handshake is an SYN, SYN-ACK, ACK between the two nodes to ensure that the
    two-way connection is properly established before sending data. This process helps
    not only ensure the reliability of data transfer but also results in a slower
    connection process due to the setup and management.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_150_0.png)


    **FIGURE 5.4** Establishing the TCP handshake before the data is sent. Retrieved
    from https://commons.wikimedia.org/wiki/File:Tcp-handshake.png


    UDP is used for speed and does not ensure the reliable transmission of data. If
    a UDP packet is lost, there is no recovery mechanism to retrieve the lost data
    (at the transport level, some higher-layer applications will track this and request
    missing data. This is not a function of UDP).


    There is no handshake operation established at the UDP level before data is sent.
    Some protocols that use UDP for transfer may use a handshake, however, this is
    achieved at the application level and is independent of the UDP protocol. For
    example, WireGuard uses handshakes to ensure proper'
