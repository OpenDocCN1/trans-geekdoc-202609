    \ the code briefly and determining that we would like to investigate further,\
    \ we can quit the text window using the “q” key. To view the code and add our\
    \ changes to it, if needed, we can mirror (with the **-m** switch) to create a\
    \ local copy of the exploit. Similar to the previous command, the command below\
    \ relies on the path given to the specific exploit.\n\n```\n```bash\nsearchsploit\
    \ -m php/webapps/49967.py\n```\n```\n\n```\n```text\nExploit: WordPress Plugin\
    \ wpDiscuz 7.0.4 - Remote Code Execution\n(Unauthenticated)\n    URL: https://www.exploit-db.com/exploits/49967\n\
    \    Path: /usr/share/exploitdb/exploits/php/webapps/49967.py\nFile Type: Python\
    \ script, Unicode text, UTF-8 text executable, with very\nlong lines (864)\n\n\
    Copied to: /home/chris/49967.py\n```\n```\n\nNote that this exploit was copied\
    \ to the current working directory, which was the home directory in this example.\
    \ Once copied into our directory, we can open it with a tool such as vim or nano\
