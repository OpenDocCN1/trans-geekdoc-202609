- pgno: 13
  md: '# About the Authors


    **Jesse Varsalone** is Associate Professor of Cybersecurity Technology and the
    coach for the Cyber Team at the University of Maryland University Global Campus.
    Jesse has been teaching Cyber Security-related courses for 24 years, and has been
    teaching for a total of 30 years. Jesse has taught at undergraduate and graduate
    levels at a number of colleges and universities including the University of Maryland
    Global Campus, the Community College of Baltimore County, the Computer Career
    Institute at Johns Hopkins, UMBC Training Center, Champlain College, and Stevenson
    University. He also taught as a DoD contractor for five years at the Defense Cyber
    Investigations Training Academy (DCITA) where he taught courses such as Forensics
    and Intrusions in a Windows Environment, Network Exploitation Techniques, and
    Live Network Investigations.


    Jesse holds several certifications in the IT field, including A+, CISSP, CEH,
    Cloud+, CYSA+, Linux+, Net+, Pentest+, Security+, and Server+. Jesse has spoken
    at several conferences including many of the DoD Cyber Crime Conferences. He was
    a member of the Red Team for several years in the Mid-Atlantic College Cyber Defense
    Competition. He has a master’s degree from the University of South Florida (Tampa,
    FL), and a bachelor’s from George Mason University (Fairfax VA). Jesse has written
    and contributed to several publications, including *Defense against the Black
    Arts: How Hackers Do What They Do and How to Protect against It.*


    Jesse also wrote the entire series of labs for Security+, Ethical Hacking, Forensics,
    and Network Security for NDG’s netlab. Jesse lives with his sons Mason and Levi,
    and daughter Kayla in Ellicott City, Maryland in Howard County, Maryland.


    **Christopher Haller** has over twelve years of hands-on experience in the field,
    and is a force to be reckoned with in cyber security. As the Offensive Security
    Practice Lead at Strong Crypto, Chris brings a wealth of knowledge and industry-leading
    certifications in Penetration Testing, Incident Response, Risk Evaluation, Threat
    Intelligence, and System Administration. His work has led to over a dozen CVEs,
    showcasing his talent for identifying intricate vulnerabilities often overlooked
    by conventional scanning tools.


    Chris holds a Master’s in Cybersecurity Management and Policy from the University
    of Maryland Global Campus and a Graduate Certificate in Penetration Testing and
    Ethical Hacking from the SANS Technology Institute. During his tenure with the
    Navy Cyber Defense Operations Command, he led a team of Sailors and civilians
    in managing sophisticated computer incidents on classified and unclassified Naval
    networks worldwide. He played a crucial role in monitoring DoD networks, responding
    to threats, and implementing vulnerability mitigation strategies, significantly
    reducing the attack surface of Naval networks.


    In his current role, Chris leverages PTES, OWASP, NIST, and MITRE ATT&CK frameworks
    to evaluate networks accurately, effectively, and within the organization’s context.
    His expertise spans internal, external, web application, and ICS/OT testing on
    enterprise networks. Utilizing tools like Burp, Nessus, Nuclei, and custom Python
    toolsets, Chris achieves tangible results that significantly reduce clients’ risk.


    Beyond his professional titles, Chris actively contributes to the cyber security
    community. He runs honeypots to gather cyber threat intelligence and develops
    open-source projects. An avid Capture The Flag (CTF) competitor, Chris clinched
    the top individual and team spots in the 2022 National Cyber League. He also coaches
    for the US Cyber Team as the Red vs Blue coach, guiding the next generation of
    cyber security talent.'
  merge: -1
