- pgno: 269
  md: 'destination files to something like favicon.ico to obfuscate their actions
    in the weblogs and then they can clean up their mess after the data is exfiltrated.
    Files deleted from the command line don’t go into the Recycle Bin.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_269_0.png)


    **FIGURE 8.27**  Creative exfiltration and deleting evidence.


    If that attacker lacks a web server or some other type of server to leverage for
    exfiltration, they can resort to some other methods to get the data. One of the
    newer ways to upload and download files is through PowerShell. I was actually
    surprised that when on a remote system outside of the Firewall, it was extremely
    easy for me to jump into a PowerShell session so I could leverage its robust features.
    The attacker might need to download malware to escalate their privileges or to
    move laterally. On the latest versions of Windows (and most versions of Linux),
    the curl command can also be used for downloading. Before downloading your malware,
    make sure you disable the real-time protection of the built-in Windows Defender
    antivirus program by typing the following PowerShell command:


    ```

    PS C:\Windows\System32> Set-MpPreference -DisableRealtimeMonitoring $true

    ```


    ![](img/181571ad74cba0e6a2f38fcd2658651e_269_1.png)


    **FIGURE 8.28**  Executing PowerShell from the Reverse Command Shell.


    For downloading malware or exfiltrating data from the network, use these PowerShell
    commands:


    +   - Invoke-WebRequest can be used to download files from the Internet

    +   - Invoke-RestMethod can be used to upload files and exfiltrate them'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'In some cases, the hacker might be on a Workstation and need to get the important
    proprietary data from the file server. Fortunately for the hackers (and end users),
    there are some cases where the drives to important shares are pre-mapped and the
    command net use will display a list of the Workstation’s mapped shared. Network
    Shares are important resources where end users can access, store, and backup files
    and collaborate with other users within their organization. In the case if these
    shares have data worth stealing, the attackers can exfiltrate the data right out
    of the network using Invoke-RestMethod.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_270_0.png)


    # FIGURE 8.29 Net use.


    If the attacker is not lucky enough to have any shared drives on their compromised
    workstation, then they can use the ipconfig command to find the Domain Controller
    or Domain Name System (DNS) Servers (sometimes one in the same) on the network
    which may have one or more file shares. These servers can often be found by viewing
    the Workstation’s DNS address. And, if the hacker gains local administrator access,
    they can connect to any other system they can reach on the network with the same
    username and password. Unfortunately, I have seen too many networks where the
    local administrator username and password are the same and the hacker can have
    a field day moving from box to box in the network. If the network is configured
    this way, the following native Windows commands will allow the attacker to connect
    to the IPC$ share of the server and then copy any files from any of the drives
    present on the system to the workstation In order for this to work, an administrative
    account with the same password (and username) needs to be on another machine on
    the network.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_270_1.png)


    # FIGURE 8.30 The IPC$ share.'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'From a security standpoint, the local administrator password should not be
    the same on one or more systems. When the local administrator username and password
    are the same, the hacker can have free reign moving from box to box in the network.
    The free Microsoft tool LAPS (Local Administrator Password Solution) can be used
    to prevent this lateral movement. It basically makes the local administrator password
    different on every machine. The good news is that you do not have to remember
    all these different passwords, as they will be stored in Active Directory. LAPS
    can be downloaded here: https://www.microsoft.com/en-us/download/details.aspx?id=46899.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_271_0.png)


    FIGURE 8.31 Local Administrator Password Solution.


    Since Command Shells can be so dangerous because they don’t set off Antivirus,
    you can enable the monitoring of PowerShell activity in your system, aggregate
    those logs, and send them to a centralized logging server like Splunk. To enable
    PowerShell logging on your Windows system,


    Type gpedt.msc on a local computer (enable this at the domain level if you have
    Active Directory).


    Go to Computer Configuration, Administrative Templates, Windows Components.


    In the list, find the Windows PowerShell folder.


    +   - Click on the PowerShell Transcription Setting and Enable it.

    +   - Click on PowerShell Script Block Logging Setting and Enable it.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_271_1.png)


    FIGURE 8.32 Enable PowerShell Logging.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'After Enabling the PowerShell logging, you will be able to determine what commands
    were run in PowerShell by administrators, end users, as well as hackers. There
    are many tools that hackers can leverage to exploit systems, but the built-in
    PowerShell is among the most powerful. The main concern about PowerShell is it
    is a legitimate Microsoft tool that will not set off antivirus and may not be
    picked up by Intrusion Detection Systems (IDS) or Intrusion Prevention Systems
    (IPS). Hacking and defending systems is a constant game of cat and mouse that
    will continue to evolve over time. The data that companies and organizations are
    working diligently to protect is the same data that hackers lust after.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_272_0.png)


    **FIGURE 8.33**  Enable PowerShell Logging.


    # SUMMARY


    Hacking is done for a purpose, and usually involves making money for the attackers.
    There can be other reasons, such as political reasons that can sternly motivate
    hackers, hacking groups, or nation states. Companies and organizations used to
    be more hesitant to disclose a breach immediately, but newer and stronger legislation
    is forcing their hands. Companies and organizations often face breaches because
    of a lack of worthy cybersecurity budget and security posture, but even when cybersecurity
    is paramount for everyone in an organization, one small mistake can lead to a
    breach. Hackers have impressive tools and are highly motivated to reach their
    goal, while defenders often have a daunting number of systems to protect and update,
    logs to sift through, and people to supervise who can intentionally and unintentionally
    exploit their systems.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# 9 Am I Hacked? How Do I Tell?


    # INTRODUCTION


    This chapter will be appropriate for:


    +   1. Trying to determine if your system is compromised.

    +   2. Removing attackers from your system during a cyber competition.

    +   3. Performing some dynamic malware analysis.


    The first question you might want to ask is how does the hacker get into a system
    in the first place? There are lots of ways an attacker can get into a system including
    spear-phishing, web-application attacks, exploitation of a vulnerability, harvested
    or default credentials, or through some type of social engineering attack. As
    the number of connected devices and systems continues to proliferate every day,
    cyber security attacks will continue to be a problem and can be a real threat
    to individuals, companies, and organizations. These attacks are covered in the
    earlier chapters of the book by Chris Haller, who is an excellent red-teamer.
    Chris will walk you through the process of how a vulnerability is discovered and
    exploited. Chris and I both have experience on the red (attack) and blue (defense)
    sides of the house. Learning how to attack systems helps you defend systems better
    and learning how to perform analysis of an intrusion (hack) will help you become
    a better attacker. This is the reason that “ethical hacking” is taught at universities
    and training centers to help the defenders understand how the hacker gets in and
    what artifacts they should be looking for from an attacker after an intrusion.


    You might ask “What if I just keep my systems up to date with the latest versions
    of the operating system, install all of the latest patches, and turn up the security
    settings all the way, then I should be safe, right?” While that will certainly
    help and is good practice, Information Technology (IT) is a bit more complicated
    than that. A large company might have hundreds of systems that all need to update
    applications like Chrome, Windows, Adobe, Office, Java (you get the idea) weekly,
    which can be a daunting task. This is a good reason to select Cyber as a career
    field, as all of that can be a lot to manage and requires a certain amount of
    personpower. And, if you have many years of experience in Cyber, you will understand
    that while patching and updating is important, it can break applications causing
    critical software that people rely on every day to fail. In one case, I know of
    a company that spent 100,000 dollars on a printer. The next version of the operating
    system did not have the driver for the printer, so the company had to decide whether
    to scrap the printer or keep the printer running with the older operating system
    on the network. Attackers will target older systems as the low-hanging fruit on
    the network. With Windows 11, there are hardware requirements like a certain minimum
    CPU version and a Trusted Platform Module (TPM) 2.0 that will prevent companies
    and individuals from running a newer, more secure version of Windows than Windows
    10. This also makes it difficult to keep your devices secure.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_273_0.png)


    FIGURE 9.1 You can''t install Windows 11.


    We cannot realistically expect the Microsoft operating system to have the same
    hardware and system requirements that they have for the past 20 years. The amount
    of RAM and resources that'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'applications require these days make it a necessity to upgrade systems so they
    can be “usable”. And just so you know that I am not picking on Microsoft, Mac
    users also will suffer a similar fate if they are using one of the older Macbooks,
    iPhones, or iPads. There comes a point where Apple, like Microsoft, will no longer
    support older devices and operating systems and they will stop offering patches
    or updates. And Chrome, Firefox, and other applications will also stop updating
    their software for certain versions of operating systems that Apple and Microsoft
    no longer support. Not only does it become a security problem, but eventually
    an older device with an outdated operating system becomes almost completely unusable
    due to new browser and encryption settings that might not be available on the
    legacy system. And please be aware that while there are hacks to make old stuff
    work (like installing Windows 11 on my 2010 Macbook Pro) but this is not a good
    security practice as a hacked device (like Jailbroken iPhone, Rooted Droid, etc.)
    has certain security vulnerabilities that a device “following the rules” will
    not have. There is also some discussion of Microsoft not providing updates to
    unsupported or unlicensed Windows software.


    # EVIDENCE OF COMPROMISE


    If your personal system is connected to the Internet and you believe that it is
    compromised, I would unplug the router. We used to say unplug the Ethernet cable
    but these days most people are using Wireless network cards in their home. If
    you are working on an intrusion case for an organization, you will want to collect
    volatile data and then RAM before disconnecting so you can provide some to collect
    information about processes and connections that that will likely disappear when
    you “pull the plug”. There are some free tools that you can utilize on a computer
    that has been hacked, and some of them are built into the operating system (both
    Windows and Linux). The netstat command, which is available in Windows, Linux,
    and Mac operating systems, will show you what IP Addresses your system is connected
    to. With the correct switches, you can find the process that the established connection.
    Most people who are familiar with exploitation will immediately notice the destination
    port 4444 which is the default port of Metasploit. Even though the hacker can
    easily change this by setting their LPORT value to 443, port 4444 should never
    be allowed outbound from any network under any circumstance for this reason. That
    small firewall change can make a huge difference.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_274_0.png)


    FIGURE 9.2 Netstat Data from a Windows machine.


    The lists of IP Addresses a single system is connected to can be quite extensive
    because of the large number of applications and programs, like Office 365, Teams,
    Discord, Chrome, and others that are beaconing to various sockets (IP Addresses
    and ports) somewhere on the Internet or your Local Area Network (LAN).


    If you take a class that teaches penetration testing, then it is very likely that
    you will learn how to hack on a flat network. For example, 192.168.1.50 attacks
    192.168.1.100. The exploitation of another machine on the same network is much
    easier because there are typically many more ports open on a Local Area Network
    which leads to more attack vectors. Being on the same LAN with the machine you'
