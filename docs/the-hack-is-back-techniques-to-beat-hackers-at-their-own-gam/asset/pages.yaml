  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_170_0.png)


    **FIGURE 5.27** Running SQLMap on a live version of the software which shows a
    SQL injection vulnerability.


    After running various tools, we can prove that the exploit is effective on the
    software and that it is vulnerable to this type of attack. In most cases, it may
    take longer to find the vulnerabilities and prove their impact, but spending more
    time working on these items will help them appear faster during your analysis.


    # Submitting the CVE


    To submit one of the findings we’ve located, we need to visit the CVE website
    at [cve.org](https://cve.org). Within this page, there is a button to report a
    CVE. After reviewing the information, if the vulnerability we’re reporting is
    not covered by a CVE Numbering Authority (CNA), we will click on the MITRE CNA-LR
    as a CNA of Last Resort to request a CVE. This indicates that the weakness we’re
    reporting does not fall under an existing CNA and must go through the MITRE system.


    A CVE Numbering Authority is a partner organization that helps track and maintain
    CVEs on behalf of MITRE for the products they are in charge of. For example, Adobe
    and Microsoft are two large software manufacturers who are registered as a CNA
    for their products. To identify if a product is covered by a CNA, we can use the
    search function on the MITRE website. If we find that the product vendor is not
    listed, we will select the CNA of Last Resort.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_170_1.png)


    **FIGURE 5.28** Requesting a CVE through MITRE as a CNA of Last Resort.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_171_0.png)


    **FIGURE 5.29**  CVE submission form on the MITRE website.


    Filling out the CVE request form requires very specific information that lists
    out the vulnerability and the impact that it contains. We must specify the version
    of the software that is affected, along with any resolved versions if available.
    The affected component must be clearly labeled to describe where the vulnerability
    lies within the system as well as to allow others to understand where the risk
    exists.


    When defining the suggested description of the CVE, there are certain key details
    for phrasing that we must use. Failure to use these descriptions will reduce the
    likelihood that our CVE will be accepted. Thankfully, the CVE team links resources
    on using proper phrasing within the CVE submission form itself.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_171_1.png)


    **FIGURE 5.30**  Suggested CVE description on MITRE’s website.


    Visiting this link at [http://cveproject.github.io/docs/content/key-details-phrasing.pdf](http://cveproject.github.io/docs/content/key-details-phrasing.pdf)
    brings up a PowerPoint presentation from 2016. This presentation covers why the
    description is used to separate various CVE entries and provide reporting details
    within the submission process. Specifically, the description should be formatted
    in a way that matches something similar to the formats below:


    +   - [VULN TYPE] in [COMPONENT] in [VENDOR] [PRODUCT] [VERSION] allows [ATTACKER]
    to [IMPACT] via [VECTOR].

    +   - [COMPONENT] in [VENDOR] [PRODUCT] [VERSION] [ROOT CAUSE], which allows [ATTACKER]
    to [IMPACT] via [VECTOR].'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Writing the correct description can be difficult and we need to make sure that
    we provide enough information for MITRE to make an informed decision about issuing
    a CVE or not. Make sure that this description reflects the time and effort that
    we’ve spent finding the CVE and analyzing it. Keep in mind also that MITRE can
    make adjustments to the submission form once they have been submitted as needed
    to help with wording.


    If we’re lucky enough to have a CVE accepted, we will be notified via email. However,
    initially, the CVE will be listed in a “reserved” state, indicating that the CVE
    number has been issued but remains controlled information. The reserved state
    is to help protect others who use the software/product until a patch is released
    or a public analysis is published. Keep in mind that since we identified the bug,
    it is our responsibility to ensure that we responsibly disclose and assist with
    remediation.


    For open-source projects, we can always open a security issue in GitHub, Sourceforge,
    or wherever the repository is hosted. At the same time, we can make the changes
    to the code in a git branch and submit a pull request, indicating that we have
    already worked on a fix to resolve the vulnerability. Most open-source maintainers
    are volunteers who do their development for free, so pushing some of your code
    to help remediate the risk you identified will be well received. Steps on creating
    a branch, committing changes, and submitting a pull request are outside the scope
    of this book but are readily available online.


    Once the issue has been resolved through either a patch or some other type of
    mitigation and has a publicly available disclosure, such as an accepted pull request,
    we can notify MITRE to request full disclosure of the CVE. This will be accomplished
    on the same CVE form we submitted the CVE, only that we will select “Notify CVE
    about a publication”. This will ask for the link to the resource and the affected
    CVE numbers, as well as any additional description updates if needed.


    Once received and processed by the MITRE CVE team, we’ll have our first CVE published
    and out in the world! Don’t forget to celebrate and continue to pass the knowledge
    along to help develop a more secure Internet and connected online world.


    # Bug Bounties


    Finding bugs and vulnerabilities can pay well too! Over the last decade, bug bounty
    systems have become incredibly popular and have created a conducive environment
    for hackers to find vulnerabilities for companies willing to pay for these to
    be found. This also ensures that the hackers don’t use the bugs for personal gain,
    but rather send them into bounty resources as a legitimate form of reporting and
    income.


    However, bug bounties are *hard*. There is a lot of competition from other hackers
    since cash money is on the table. As assets are published in programs, hundreds
    or even thousands of like-minded hackers swarm onto the assets to try and find
    vulnerabilities. Many of these hackers have well-established tools and methodologies
    to quickly identify locations that have a higher likelihood of being vulnerable
    to attacks. The first to report the bug is usually the one who gets the cash,
    resulting in a mad dash to find bugs when new targets are posted.


    Do not be discouraged when starting to hunt for bounties, it is an exceptionally
    rewarding experience when one is found. Just like everything else, it becomes
    easier the more you do it as well.


    Bounties can be gathered at authorized locations that a company either publishes
    publicly or within a strictly controlled group of select hackers to target for
    attacks. These hackers are given permission, within a specific scope, that allows
    them to attack and try to find weaknesses within an organization. As vulnerabilities
    are identified, the hackers must prove their impact on the organization and how
    it can be used to harm them – the higher the impact, the more the bounty pays.


    For most programs and platforms, identifying a high-impact vulnerability such
    as SQL injection or remote code execution can pay up to $10,000 for each finding.
    Other vulnerabilities in key products for Google and Apple can pay up to a million
    dollars each – but keep in mind the vulnerability must prove a significant impact
    to those products.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'However, do not forget that you are not the only hacker looking for these vulnerabilities
    – the potential for direct cash from findings makes bug bounties a cutthroat business.
    Usually, the first to find and report the bug is the only one that gets the cash,
    which almost always results in a race to be first.


    # Scope


    Maintaining proper scope when hunting for bugs is exceptionally important. We
    are still white-hat hackers at the end of the day, and everything we do is ethical.
    Part of our ethical obligations is to ensure we stay within the program’s requirements
    for testing. Each program will have a very specific set of domains, URLs, or even
    applications if testing a mobile app.


    For example, the screenshot below contains the scope allowed for testing the Shopify
    organization. We can clearly see that several subdomains offer a bounty for findings
    as well as how high the findings can be. Notice as well there is a wildcard subdomain,
    which indicates that anything can be matched as a subdomain and reported as an
    issue.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_173_0.png)


    **FIGURE 5.31**  Shopify bug bounty program on HackerOne, showing the scope of
    assets to be assessed.


    Paying attention to the scoping information is critical before we begin our hunt
    for bounties. If we inadvertently start testing on items out of scope, any findings
    we determine will not be eligible for cash. Beyond that, we may cause operational
    downtime or some other form of interruption that prevents legitimate business
    from being conducted.


    Certain programs will limit the types of attacks that can be used or even publish
    known vulnerabilities that will not be awarded bounties. Take note of these locations
    and their information, so'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'that we don’t waste time by accident when starting our analysis. Pay close
    attention to how the scope is defined and read the program details closely!


    # Known issues


    The following vulnerability types have already been reported and triaged, and
    won''t be fixed. These issues will be closed as **Not Applicable**:


    +   - **XSS - Storefront** - Any issue where a store staff member is able to insert
    javascript in the storefront area of their own store (this includes `*.shopifypreview.com`).

    +   - **XSS - iFrames** - Any issue related to the storefront area being displayed
    in a `<iframe>` element in the admin area, for example in the Theme Editor.

    +   - **XSS - Rich Text Editor** - Issues relating to execution of JavaScript
    in the legacy Rich Text Editor in the Blogs and Pages section of the Shopify admin.

    +   - **XSS - Shopify CDN** - The Shopify content distribution network (static.shopify.com
    and cdn.shopify.com) is available for merchants to use, and we encourage our merchants
    to host anything they want. We will reject any submission where the issue being
    reported is that a user or store staff member is able to upload arbitrary files
    to our CDN or execute javascript in the context of a CDN domain.

    +   - **Arbitrary file upload - Shopify CDN** - The Shopify content distribution
    network (static.shopify.com and cdn.shopify.com) is available for merchants to
    use, and we encourage our merchants to host anything they want. We will reject
    any submission where the issue being reported is that a user or store staff member
    is able to upload arbitrary files to our CDN.

    +   - **CSRF access to modify cart**

    +   - **CSRF for Login or Logout** - Any login / logout CSRF will be ineligible
    unless it is chained together with another vulnerability to demonstrate impact

    +   - **Insecure cookie handling for account identifying cookies**


    **FIGURE 5.32**  Known issues published by Shopify for their bug bounty program,
    reporting these will not result in any payment.


    Most programs will also have a configuration file available for download which
    has all of the information for scoping placed into a Burp Suite compatible file.
    These files can be directly loaded into Burp Suite and have all of the target
    information properly selected for us to use. This saves time and reduces human
    error while we prepare our systems to analyze websites for a bounty.


    # Platforms


    There are many different platforms online to hunt and report bug bounties on.
    The ones listed in this section are only a sample of the many others that are
    around. Additionally, one can always report a vulnerability directly to the affected
    organization – however, leveraging an existing bounty program provides protections
    for the hacker and helps negotiate bounties.


    # HackerOne


    HackerOne operates an extensive platform that is open to anyone on the Internet
    to create an account and submit bugs. There are no previous requirements or certifications
    to meet to qualify for an account. HackerOne operates a large amount of “managed”
    programs, which indicates that the HackerOne team helps coordinate the disclosure
    process.


    HackerOne also runs an introductory CTF to help newer hackers learn how to find
    and exploit basic web vulnerabilities. This CTF is known as the Hacker101 CTF
    and is available at [https://ctf.hacker101.com/](https://ctf.hacker101.com/) and
    has accompanying training as Hacker101 available at [https://www.hacker101.com/](https://www.hacker101.com/).
    There are several well-written videos available for Hacker101 that describe how
    to approach and report bug bounties on their platform and beyond.


    HackerOne is open to any hackers on the Internet and anyone can create an account.
    It’s highly recommended to establish an account on the platform and start to learn
    about the bug bounty scene.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# BugCrowd


    BugCrowd is similar to HackerOne in many ways. They operate a public bug bounty
    system that can be used by anyone on the Internet. BugCrowd also operates a similar
    training platform to help newer hackers learn bug-hunting techniques called the
    BugCrowd university and is available at [https://www.bugcrowd.com/resources/levelup/introduction-to-bugcrowd-university/](https://www.bugcrowd.com/resources/levelup/introduction-to-bugcrowd-university/).


    To gain access to BugCrowd, simply visit the website at [https://www.bugcrowd.com/](https://www.bugcrowd.com/)
    and register for an account. BugCrowd operates public bug bounty programs and
    can be accessed by anyone on the Internet to report vulnerabilities.


    # Synack


    Synack separates itself from HackerOne and BugCrowd as an invitation-only bug
    bounty platform. The Synack Red Team (SRT) is a group of tested and proven hackers
    who are given access to targets that have much fewer eyes on them—this gives a
    higher chance to find a bug before someone else.


    To join the SRT, a hacker can request to be considered to join using their online
    application. This requires an individual to fill out a form with their security
    background, certifications, years of experience, and any other bug bounty experience.
    Once received, the Synack team will contact the person to have them complete a
    hands-on hacking experience test. This hands-on assessment is used to determine
    that the applicant has the technical skills required to be invited to the program.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_175_0.png)


    **FIGURE 5.33**  Synack Red Team application page online.


    Synack also operates differently about how payouts are handled. For HackerOne
    and BugCrowd, payments are not given until the vulnerability report is considered
    closed. This process can take anywhere from a few days to months—Synack immediately
    pays out the vulnerability once it has been triaged by their team.


    Synack’s platform can be a great way for hackers to find bugs with less competition
    from others. However, this requires a certain baseline of knowledge to be invited
    to the platform—completing CTFs like HackTheBox will *significantly* help a new
    hacker pass the exam.


    # OpenBugBounty


    OpenBugBounty is a website that operates responsible disclosure for companies
    that do not have a bug bounty program set up. This opens up an opportunity for
    responsible disclosure of vulnerabilities while also giving hackers a place to
    report them. Many websites for smaller companies or'
