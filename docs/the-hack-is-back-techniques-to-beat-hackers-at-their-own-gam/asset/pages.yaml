- pgno: 117
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_117_0.png)


    **FIGURE 4.4** Creating a virtual server using Amazon’s Lightsail. This interface
    is much easier to use than the EC2 interface and clearly shows the cost per month.


    Leveraging the Lightsail interface can reduce the amount of guessing at the end
    of a month billing period and helps hobbyists develop projects. For our purposes,
    it helps us predict the cost of our services and how we can leverage them.


    # Azure


    Leveraging the Azure platform is excellent to hide among Microsoft domains and
    services, but has issues with deploying low-cost machines. In this author’s experience,
    we have not been able to establish a free-tier VM on Azure due to the level of
    activity across all supported Microsoft regions.


    However, Azure’s App Services allows us to deploy a website only instead of a
    full system. This can be achieved and even given a specific subdomain through
    their deployment infrastructure.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_117_1.png)


    **FIGURE 4.5** Deploying a new website on Azure with the hostname of [notmalicious.azurewebsites.net](https://notmalicious.azurewebsites.net).
    This subdomain would be hidden among the well-known and trusted [azurewebsites.net](https://azurewebsites.net)
    domain.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'Leveraging these services allows us to be within the trusted Microsoft domains
    while having the ability to deploy the code of our choice. This is lucrative to
    attackers who flock to hide among legitimate services.


    # HEROKU


    Heroku is another similar cloud-based deployment interface, however, it also offers
    the interesting concept of Add-ons. These Add-ons are additional managed 3rd party
    services run through Heroku and help by expanding additional functionality.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_118_0.png)


    **FIGURE 4.6** Example of a set of Heroku Add-ons for Email and SMS functionality.
    Integrating these add-ons allows us to quickly leverage new capabilities.


    The use of quickly integrating something such as the Blower.io SMS capability
    into our Heroku app accelerates our ability to conduct new operations. Integrating
    these add-ons is simple, and the documentation is well-supported.


    # HOSTWINDS


    The Hostwinds platform tends to be more associated with spam and malware attacks
    within threat intelligence, as SMTP is allowed outbound by default. Remember,
    AWS has a restriction on outbound SMTP which needs to be manually removed by AWS’s
    team through a request – Hostwinds does not operate with one of these restrictions.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_118_1.png)


    **FIGURE 4.7** VPS pricing tier for Hostwinds.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'The VPSs offered by Hostwinds are relatively cheap and offer us the ability
    to instantly start sending emails, making it a lucrative option for phishing hosting.
    This provider is another great option for us to select when we’re choosing where
    to host our services on the Internet.


    # LIVING OFF TRUSTED SITES


    The Living Off Trusted Sites (LOTS) project is a collection of public websites
    that can be abused to host malicious data. This concept allows us to better emulate
    attackers by leveraging eTLDs with major providers, making it more difficult to
    detect malicious activity. The project is available at [https://lots-project.com/](https://lots-project.com/).
    For example, the domain `*.web.core.windows.net` can be used to host a phishing
    website under the legitimate `windows.net` eTLD. Similar to the sites we have
    explored in this chapter, these are websites that can be leveraged to gain an
    advantage and abuse their implicit trust.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_119_0.png)


    **FIGURE 4.8**  Leveraging the LOTS project to identify the [web.core.windows.net](https://web.core.windows.net)
    subdomains.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'The LOTS project has several different websites and helps users understand
    not only how to create websites from these trusted sites, but also how to detect
    them. We can use this project to help us choose where and how we want to host
    our services to try and blend into trusted websites. This can be exceptionally
    effective when we’re planning out how to protect our infrastructure while it’s
    being created.


    # API GATEWAYS


    Within recent years, many cloud providers have started to allow different ways
    for us to redirect traffic through their API gateways. This can be a convenient
    way for us to leverage these LOTS websites while redirecting our target traffic
    into our C2. The API gateway is designed as a service to be an intermediary between
    an application and a backend service—we can abuse this functionality to choose
    where we want the cloud service to direct a specific payload to route the traffic.


    # Azure API Gateways


    We can establish an API gateway within Azure relatively easily. This is achieved
    within the Azure API Management page from the Azure Portal. Clicking on this page
    will open up the API Management location where we can create a gateway.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_120_0.png)


    **FIGURE 4.9**  Within the Azure Portal, navigating to the API Management Services.


    On the next page, select **Create** to make a new API. Then we can fill out the
    information to create our API Gateway, including creating the specific subdomain
    that will be used. In the example below, we’ve used the name **really-important-dont-delete**
    which is intended to give a perception'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'of importance. Junior analysts or SOC responders may see this “important” subdomain
    and ignore all alerts since it’s for a Microsoft eTLD anyway right?


    ![](img/181571ad74cba0e6a2f38fcd2658651e_121_0.png)


    **FIGURE 4.10** Filling out the API Management page to create a new gateway. This
    is where we can specify our subdomain.


    When creating the gateway, we can select the **Consumption** tier, as this offers
    up to 1 million free requests across this gateway a month.'
