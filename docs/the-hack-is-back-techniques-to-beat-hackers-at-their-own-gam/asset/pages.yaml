  md: '# What you have:


    +   Username · Password · No Creds · Hash · TGT · PFX · Shell


    # Services:


    +   TGS · SMB · WMI · DCOM · Kerberos · RPC · LDAP · NTLM · DNS


    # Attack Type:


    +   Enumeration · Exploitation · Persistence · Privilege Escalation


    # OS:


    +   Linux · Windows


    +No Creds


    # Command


    ```

    ```bash

    python3 smbmap.py --host-file smb-hosts.txt -d test.local -L

    ```

    ```


    +   Enumeration · No Creds · SMB · Linux · Windows


    ```

    ```bash

    smbclient -L \\test.local -I 10.10.10.1 -N

    ```

    ```


    +   Enumeration · No Creds · SMB · Linux


    **FIGURE 7.41** Utilizing the No Creds selection for WADComs to see a list of
    offensive commands available.


    The WADComs project can be used to quickly reference how to enumerate and exploit
    information gained within a Windows environment. As additional information is
    gathered throughout the engagement, paying attention to WADComs can help create
    additional ideas about what to achieve with access.


    # PEASS PLEASE!


    The Privilege Escalation Awesome Script Suite (PEASS) is a project by Carlos Polop
    that is used to check many well-known escalation vectors on a local machine. These
    scripts are an excellent resource for helping determine the escalation path to
    take from a foothold to additional accounts and administrative access.


    The script needs to be downloaded and passed to the target machine, however, this
    can be accomplished so that it resides in memory instead of leaving artifacts
    on the disk. Similar to how we executed the import for the PowerShell ActiveDirectory
    module, we can pass the script within a pipeline object to be executed.


    This script comes in three distinct flavors, one for Linux, one for MacOS, and
    the final for Windows. The scripts are appropriately named LinPEAS, MacPEAS, and
    WinPEAS for their respective system. The scripts are consistently updated with
    the latest, greatest, and newest escalation vectors as they are discovered.


    There is a significant amount of escalation vectors identified with the PEASS
    tools and a large amount of output is passed to the screen. Just like other programs,
    take a deep breath and take your time to read the output. While there is a LOT
    that is occurring, it is not overwhelming if you take it one line at a time. Thankfully
    the PEASS tools pass information back in color as well which makes analysis much
    easier.'
  merge: -1
  img_proc: true
