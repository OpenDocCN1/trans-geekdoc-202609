    # ## BACKDOOR CHANNELS


    Backdoors are ways for us as attackers to continue our communications with our
    target after exploitation and to ensure we can return if we lose our connection.
    Generally, these backdoors will follow after a successful exploitation at our
    target. Since the purpose of this chapter is not exploitation, but rather obfuscation
    and deception, we will not cover how the target was exploited and instead focus
    on how to maintain a connection.


    There are several interesting ways that we can achieve this through effective
    and new technologies. The classic way of establishing persistence is through additional
    user accounts and persistent reverse shells in startup scripts, but we will focus
    on the connection itself returning to us instead of the underlying exploitation/persistence
    mechanism.


    # ## WireGuard


    WireGuard is an extremely simple, fast, and modern VPN technology that uses UDP
    to route packets with a set of pre-shared keys.¹³ It’s designed to be simple,
    flexible, fast, and secure. Since it operates with the UDP transport layer protocol,
    it is much faster and reduces the overhead from a TCP connection establishing
    over a channel. This speed is apparent when we connect to a WireGuard peer compared
    to the speed from a traditional TCP-based VPN. With the UDP transport layer protocol,
    it is much faster and reduces the overhead from a TCP connection establishing
    over a channel. This speed is apparent when we connect to a WireGuard peer compared
    to the speed from a traditional TCP-based VPN.


    By design, WireGuard will not respond to any traffic on the open WireGuard port
    unless the cryptographic configuration is properly set up. While this does make
