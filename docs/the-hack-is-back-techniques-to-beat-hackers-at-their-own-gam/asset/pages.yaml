    in an earlier version of python, I just phoned a friend (old TV show reference)
    and asked ChatGPT ([https://chat.openai.com/](https://chat.openai.com/)) to convert
    the exploit that I found so it would work in python3. I can''t remember if it
    was perfect, but with a little bit of editing, I was able to get it to work. I
    know how to read (and edit) code but I have not really done much programming since
    I was writing Beginner''s All-purpose Symbolic Instruction Code (BASIC) programs
    for the Atari or Texas Instruments (TI)-82 Graphing Calculator. It is certainly
    ok to use artificial intelligence (AI) and utilize ChatGPT to help you to the
