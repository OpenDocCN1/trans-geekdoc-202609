- pgno: 215
  md: 'So what can we do with this information? Similar to reading the `~/.bash_history`
    file for a compromised user, we can search through their home folder for any potential
    SSH keys. Access to these keys can likely be leveraged to gain additional access
    throughout the environment.


    Beyond this, if we identify that we can write files to the system, we can always
    write a public key pair to the applicable user’s `~/.ssh/authorized_keys` file.
    Remember, any public key listed in this file will be accepted for authentication
    – so if we generate our OWN key pair with `ssh-keygen`, we can drop this directly
    into the `authorized_keys` file and authenticate. This doesn’t require us to know
    the user’s password either! All we have to do at this point is authenticate with
    our key and we’ll be good to go.


    # SUID AND GUID


    Set-User-ID (SUID) and Set-Group-ID (GUID) files allow a program to be executed
    as the owner or group assigned to that file. Generally, this is for files that
    are used within the system for root-level activities, however, it is reasonably
    common to have other users set and create their own SUID/GUID binaries. This is
    effective for programs such as **passwd**, where regular user accounts need to
    be able to change their password on the system. SUID and GUID files are set to
    give lower-privilege users the ability to execute programs as other users to achieve
    a task.


    Remember back to earlier in this chapter that the `/etc/shadow` file is used to
    store password hashes and that it’s only accessible to the root user? Well, we
    need to figure out a way for legitimate users to reset their password and have
    the root user update the password hash appropriately in the shadow file. Without
    the capability to do this, users will be unable to change their password and will
    require help from a different user with sudo access.


    To effectively allow users to change their password, the SUID bit is placed on
    the file permissions for the passwd program. This allows the program to be run
    as the owner’s user ID. When invoking the passwd program, we are effectively running
    the program as the root user. This allows us to update the password for our account
    while preventing us from modifying the `/etc/shadow` file, thereby protecting
    the rest of the system.


    Identifying a file that has the SUID/GUID bit set can be seen from the file within
    the directory view with **ls**. To view all of the file permissions, we must specify
    the **ls -l** flag to get the long listing of the directory. This prints the files
    within the current directory along with their assigned permissions, owner, group
    owner, size, and modified times. Specifically, we are interested in the permissions
    for the files to identify one that contains an “s” within the permissions. To
    see an example, viewing the permissions on the **passwd** program shows that the
    SUID bit has been set.


    ```

    ```bash

    $ ls -l /usr/bin/passwd

    -rwsr-xr-x 1 root root 51552 Jan 25 03:29 /usr/bin/passwd

    ```

    ```


    To test creating a SUID bit binary, we can use the following commands below to
    copy the legitimate bash executable into the `/tmp` directory, then add the SUID
    bit. Note that this action sets the SUID bit for the user who ran the action –
    **we would need to run this as root to create a SUID binary as root.**


    ```

    ```bash

    # cp /bin/bash /tmp/bash; chmod +s /tmp/bash

    # ls -lA /tmp

    total 3748

    -rwsr-sr-x 1 root root 1265648 Mar 20 06:14 bash

    ```

    ```


    Now that we’ve created a copy of the bash executable and assigned the SUID bit,
    to run it and preserve the SUID activity we must invoke it with the **-p** flag.
    Bash is intelligent enough to determine if the shell is started without a matching
    effective UID and real UID and will fall back to the real UID. To prevent this,
    passing the **-p** flag when starting the program will not reset the effective
    UID.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '```

    ```bash

    $ /tmp/bash

    bash-5.2$ whoami

    chris


    $ /tmp/bash -p

    bash-5.2# whoami

    root

    ```

    ```


    To find files that contain a SUID or GUID bit, we can leverage the built-in find
    command. Since we are looking for a SUID or GUID file, we are looking for permissions
    that contain the **u=s** or **g=s** bit set. This indicates that the user or group
    which owns the file has the bit set. To properly search for this, we can leverage
    the **-perm** flag within **find** to locate files that meet this specification.


    ```

    ```bash

    $ find / -perm -u=s -exec ls -la {} + 2>/dev/null

    ```

    ```


    This command looks complicated but is not as bad as you think it might be. Take
    it slow and read through the manual as well for find to help determine what the
    specific flags will likely be if they seem unfamiliar. What this command does
    is leverage the **find** command to start at the root of the file system (/),
    then search for any file that has the permission for SUID set (**-perm -u=s**).
    For any files that are found, execute the command **ls -la** which tells us more
    information about the file (the {} + is required to execute). Finally, the stderr
    (standard error) is redirected to **/dev/null** which keeps our terminal clean.
    Searching through the filesystem as a standard user will result in many “Permission
    Denied” errors since we should not be able to find or read sensitive folders or
    files.


    This command will take a while to run since it is literally looking through the
    entire file system on the device. Be patient!


    Similar to the above, we can locate GUID files by slightly changing what permissions
    we’re searching for. The resulting command would be something similar to below:


    ```

    ```bash

    find / -perm -g=s -exec ls -la {} + 2>/dev/null

    ```

    ```


    Finding the binaries that operate with a SUID or GUID bit does not automatically
    mean that the binary is vulnerable to privilege escalation. What it does mean
    is that if the file does not properly defend against binary attacks such as buffer-overflows
    or search-order hijacking, it can be used to leverage access to applications as
    the user. Any non-root files found indicate that someone on the system added the
    SUID/GUID bit to that program – it should always be investigated closely!


    # Cronjobs


    Cronjobs are used to ensure specific programs and activities occur at their prescribed
    intervals on a machine. This is a daemon which is used to execute scheduled commands.
    Cronjobs are exceptionally useful to ensure proper automation flow for programs
    and systems that perform a regular and scheduled task to accomplish the mission.


    For example, imagine a programmer decides to build a python program that automates
    pulling down client information, parsing it, creating friendly and colorful charts,
    and then placing it into a Word document to be emailed to the client. This is
    an excellent way to ensure a customer receives information regularly in a format
    that is presented in a digestible format. Customers love seeing it so much, that
    they request to have it completed and delivered each week for them. Cron jobs
    are useful to ensure these programs are run at regular intervals as necessary.


    The crontab is written in a specific way to determine exactly when and how often
    a command will run on the machine. This is achieved by the first five entries
    on the crontab line in each line on the crontab, where each entry represents a
    specific marker to be interpreted by the'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'cron daemon. When a field is given an asterisk (*), it means that the command
    should be used for all of its matching values for that field. Cron values can
    be confusing, but there are several resources online that can help us understand
    and better parse the information we identify. For example, the image below can
    be used to help determine what each character is interpreted as by cron.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_217_0.png)


    **FIGURE 7.7** Crontab execution fields definition, retrieved from [https://commons.wikimedia.org/wiki/File:Crontabks4.th.png](https://commons.wikimedia.org/wiki/File:Crontabks4.th.png).


    Take the crontab below for example. This command will execute the command **/bin/sh
    /tmp/backdoor.sh** every five minutes and based on the filename is likely a persistence
    mechanism. Investigating the file located at **/tmp/backdoor.sh** should reveal
    an interesting analysis for a potential backdoor on the asset.


    ```

    5 * * * * /bin/sh /tmp/backdoor.sh

    ```


    Additional online resources include the **crontab.guru** website, which will take
    a crontab configuration and help explain it in plain language. Taking our example
    from above, we place it into the website and can better understand how it will
    be interpreted.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_217_1.png)


    **FIGURE 7.8** Utilizing crontab.guru to help understand crontab configurations
    in plain language.


    The Cron daemon (crond) searches through the crontab to try and identify cronjobs
    that are ready to be executed. As the specific intervals for the cronjobs are
    reached, they will be executed as required. By default, crontabs are stored in
    the **/var/spool/cron** folder for each user account and are only readable by
    the specific user. Because of this, we cannot simply peek at all of the cronjobs
    in these folders to see what jobs will occur.'
  merge: -1
  img_proc: true
