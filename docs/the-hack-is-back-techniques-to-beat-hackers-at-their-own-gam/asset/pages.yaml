- pgno: 195
  md: "To select a staged or stageless payload, pay attention to the naming scheme\
    \ of the payload. The Metasploit documentation has some excellent material that\
    \ covers the difference between these. Note that the stageless payloads, the ones\
    \ that send the entire Meterpreter within the exploit, have the naming scheme\
    \ of **meterpreter_{{name}}**, whereas the staged payloads use **meterpreter/{{name}}**.\
    \ This is a subtle but important difference between the two.\n\n**TABLE 6.1**\
    \  \n**Types of Meterpreter Payloads for Staged vs Stageless**\n\n| Payload |\
    \ Staged | Stageless |\n|---|---|---|\n| Reverse TCP | `windows/meterpreter/reverse_tcp`\
    \ | `windows/meterpreter_reverse_tcp` |\n| Reverse HTTPS | `windows/meterpreter/reverse_https`\
    \ | `windows/meterpreter_reverse_https` |\n| Bind TCP | `windows/meterpreter/bind_tcp`\
    \ | `windows/meterpreter_bind_tcp` |\n| Reverse TCP IPv6 | `windows/meterpreter/reverse_ipv6_tcp`\
    \ | `windows/meterpreter_reverse_ipv6_tcp` |\n\nNote that **reverse_tcp** and\
    \ **reverse_http** stagers download **metsrv** without any encryption, so the\
    \ content of the DLL is visible to anything watching on the wire.^5^\n\nPayload\
    \ UUIDs are used to help track a payload’s origin and if they are to be used in\
    \ the current campaign. The UUIDs are created at the time of payload generation\
    \ with **msfvenom**—this payload generation will be covered more in detail below.\
    \ This also ensures that our Meterpreter listener on the Internet we have open\
    \ to catch the reverse shell will ignore connections that do not have the correct\
    \ UUID set.\n\n# ## Msfvenom\n\nMetasploit also comes with additional tools which\
    \ can be leveraged to gain access. One of the most effective tools in the arsenal\
    \ is **msfvenom** which can be used to generate payloads in a prepacked exploit.^6^\
    \ We can supply a choice of payload, such as the staged or stageless Meterpreter\
    \ to run on the machine. Within Msfvenom, we can select the type of exploit that\
    \ the payload will be packaged in, such as a PowerShell script, Bash script, Windows\
    \ executable file, or ELF format.\n\nJust like any other program, to use msfvenom\
    \ all we need to do is ask for help. This can be achieved with the **msfvenom\
    \ -h** command to list all of the help available to the command. Additionally,\
    \ the Metasploit documentation is well written and available to show many different\
    \ ways to use the Msfvenom tool at [https://docs.metasploit.com/docs/using-metasploit/basics/how-to-use-msfvenom.html](https://docs.metasploit.com/docs/using-metasploit/basics/how-to-use-msfvenom.html).\n\
    \nTo specify a payload, we will use the **-p** switch to provide the payload within\
    \ our exploit. If you can’t remember every payload that you like to use, which\
    \ is very common in my case, you can list the payloads directly from the Msfvenom\
    \ tool. We can list the payload with **msfvenom -l payloads** where a list of\
    \ available payloads is given to us."
  merge: -1
  img_proc: true
