- pgno: 308
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_308_0.png)


    # FIGURE 10.20 Adding more host-only networks.


    This will allow you to even further enhance your skills because while practicing
    on a flat network will really help you improve your skills, at some point you
    will have to expand your skill set and get familiar with how a real network operates
    with LAN and WAN addresses, a firewall, and how Network Address Translation (NAT)
    works. If you configure port-redirection on the firewall, the hacker (you) can
    attempt to attack the internal systems they are re-directed to. If the attacker
    gains access to one of the internal systems, they can move laterally within the
    LAN. Advanced classes need to train from this perspective so participants can
    better understand attacks from the WAN. It also changes the perspective of the
    analyst as they will be examining logs and network connections from external IPs
    like they will encounter working in the field.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_308_1.png)


    # FIGURE 10.21 A realistic network attack created using VMware workstation (Visio
    Diagram).'
  merge: -1
