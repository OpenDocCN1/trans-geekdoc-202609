- pgno: 177
  md: 'exploit the environment instead. However, some organizations are hesitant to
    introduce a program where hackers are permitted to attack their websites – keep
    in mind that black hat hackers will do this anyway.


    # SUMMARY


    Finding vulnerabilities comes down to a fundamental understanding of computer
    basics, intuition, and practice. Without the foundations of basic computer functions
    and networks, finding and evaluating vulnerabilities is exceptionally difficult.
    Generally, these concepts are difficult to learn through reading books alone and
    require hands-on learning experience.


    There are many ways to get started with vulnerability hunting, each with its advantages
    and disadvantages. CTFs are a fantastic way to learn in a guided fashion along
    with write-ups to give direction when one is lost. Once enough familiarity is
    built with CTFs, pivoting to live targets with Bug Bounty programs will further
    build on established skills.


    Beyond this, we must understand how these vulnerabilities can be leveraged together
    in an attack chain to cause an impact. For the most part, vulnerabilities by themselves
    can only access so much information, but when many are placed together, a smaller
    issue can turn into a complete compromise.


