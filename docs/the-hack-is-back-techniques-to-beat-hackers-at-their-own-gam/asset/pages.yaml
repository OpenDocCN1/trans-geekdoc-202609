  md: 'With this knowledge, we can attempt to log into the server, send emails as
    the configured user, or even attempt to perform some type of credential-stuffing
    attack. Paying attention to page metadata and comments can prove critical in finding
    vulnerabilities.


    # *Spiderfoot*


    There’s been a significant amount of activity within this chapter so far which
    can easily be overwhelming. Most of the value from the testing we complete comes
    from being able to find and analyze data to identify key pieces of information.
    The earlier sections of this chapter cover how to complete this through many different
    sources, however, the Spiderfoot tool helps us complete this automatically and
    bring interesting items to the forefront.


    Spiderfoot is an automated OSINT platform that queries over 200 different modules
    for pieces of information, then takes each piece of information found and feeds
    it back into the tool. These actions create a “spiderweb” effect of how each piece
    of information is related and feeds into new intelligence. Many new and otherwise
    difficult to identify pieces of information can be discovered through these techniques.


    Downloading and installing Spiderfoot can be achieved through the GitHub repository
    at [https://github.com/smicallef/spiderfoot](https://github.com/smicallef/spiderfoot).
    Installation can be done using either the latest stable release or the development
    branch directly from the repository. To use the Docker containerized version,
    we can build the container and expose the ports with the commands below:


    ```

    ```text

    docker build -t spiderfoot:latest.

    docker run -it -p 5001:5001 spiderfoot:latest

    ```

    ```


    At this point, the Spiderfoot container should be up and running. The web application
    will be available on port 5001 for the localhost and can be accessed for analysis.
    In this case, it will be hosted at http://localhost:5001 for access.


    # Scans


    ![](img/181571ad74cba0e6a2f38fcd2658651e_76_0.png)


    **FIGURE 3.13**  Accessing Spiderfoot through the localhost.


    Once installed and started, we can run a scan. There are a few different collection
    profiles we can select from, these change how and where the data is gathered from.
    To reduce the amount of activity sent to the target, we can choose a different
    use case for our particular scenario. To access this, we can click on the **New
    Scan** button to open this interface.'
