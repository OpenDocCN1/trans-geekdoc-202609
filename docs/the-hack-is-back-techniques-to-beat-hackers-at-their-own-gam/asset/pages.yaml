- pgno: 123
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_123_0.png)


    **FIGURE 4.13** Creating the HTTP API to redirect activity to our C2 server.


    This now needs an Operation added, where we tell the API what to do and how to
    handle requests. In this scenario, we want to have any GET request forwarded to
    our C2 server, which is labeled as [https://m4lwhere.org/](https://m4lwhere.org/).
    To complete this, select the API we created under the APIs tab and then click
    **Add operation**.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_123_1.png)


    **FIGURE 4.14** Adding an operation to our newly defined API.'
