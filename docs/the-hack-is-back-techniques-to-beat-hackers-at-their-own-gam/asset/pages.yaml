- pgno: 20
  md: 'Once you have a command prompt, you can:


    +   - Create a user and add the user to the administrators group.

    +   - Reset a password for a user.

    +   - Enable the administrator account and set a password for the account.

    +   - Open the User Manager on certain versions of Windows.


    Note: This “back door” can be implanted on a targeted system to provide quick
    and continued access.


    In this case, I am using Windows 10 Professional, and I can just reset the password
    by opening the User Manager program from the command prompt by typing `lusrmgr.msc`
    (as seen below). From there, you have your choice of what you can do. One option
    is to reset the password for the default account on the system. If you are using
    a version of Windows like Home that does not support the local user manager, then
    you can just type: `net user jesse P@ssw0rd`, replacing Jesse with your username
    and P@ssw0rd with the password you want to use for the system. It is important
    to note that if your name has a space in it, you need quotes: `net user "Jesse
    Varsalone" P@ssw0rd`.


    It is important to note that this will not allow you to log in as that user and
    access all of their websites and logins, which could include various sites many
    people use frequently, including Gmail, Office 365, banking sites, Coinbase, etc.
    Resetting a user’s password will result in limiting the hacker’s ability to further
    exploit the web logins and passwords (or 100t) that go along with the user’s accounts.
    If you want to hack well and get the “Golden Nugget” (great place to stay for
    Defcon btw), you will have to work a little harder. We will examine the more devious
    methods for post-exploitation capabilities in the next section of this chapter.


    If you are resetting your own password, then just go into the Users folder, and
    then right click on your name and then select set password (as seen below). If
    you are completing the task, you can change your password here, so you are able
    to log into the system if you forgot it. If you are an attacker, and you reset
    the password for the account, the person who uses the computer will almost certainly
    know that something has changed on their system if they cannot log in with the
    password they have been using.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_20_0.png)


    FIGURE 1.10 The Local User Manager of Windows Pro versions.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'This attack should work on every version of Windows back to Windows 2000, as
    Windows NT did not have any accessibility options. For the older operating systems,
    you can use Kali or BackTrax to perform similar steps. This is described in Defense
    Against the Black Arts, which is now a freely accessible eBook. Unbelievably,
    for Windows 95,98, and ME (and Windows 3.11), you can click cancel at login and
    get into the system.


    # POST-EXPLOITATION


    After resetting the main user account for the Windows system, I was able to log
    in to that account. After that, I have unfettered administrative access to the
    machine. This is a great way to reset a password for a machine when a user who
    has given you permission to help them get into their system when they forgot the
    password. It also would be a viable option for an attacker who is trying to break
    into a system that they do not have the password to. Here is the good news and
    bad news, depending on what the purpose for getting into the machine is. If a
    hacker changes that password, based on my testing, they will not be able to access
    the websites and logins stored in Chrome or Microsoft Edge once they change the
    password. Now, you can still access all of their documents, pictures, and other
    critical files. However, the “keys to the kingdom” may actually lie in getting
    those website logins, especially if they are tied to bank/crypto accounts, personal
    email, or work email accounts. We will explore this next.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_21_0.png)


    FIGURE 1.11 Typical PDFs that can be found on a computer system.


    Most people store a treasure trove of critical and personal information in documents,
    PDFs, Excel Spreadsheets, text files (with passwords), and other files. On systems
    I had permission to access, I have even seen things like tax return documents
    as well as credit card numbers with expiration dates and CVV numbers stored into
    text files on systems (likely so the user can copy and paste them when they order
    things online). I store some of my credit cards in Chrome as well as on some of
    the websites where I make frequent purchases. People who are more paranoid about
    storing their bank or credit card information on various websites they make purchases
    from might tend to put them in local files on their computers so they can copy
    and paste the information when needed. They could be less willing to store this
    type of information remotely because they are trying to avoid their credit card
    being used to make unauthorized purchases if that company or their account gets
    breached. However, storing credentials or credit card information on a local machine
    is not a more secure strategy because files like this are at risk if someone gets
    physical access to the machine or if an attacker compromises the workstation remotely
    using an exploit, and can download files. Like in a Capture the Flag event, your
    ability to search through the noise can be critical to finding the “100t” within
    a system. The Windows search feature and the quick access to recently opened documents
    will be helpful, but keep in mind that an average Windows system might have well
    500,000 to over a million files. Using a common phrase like PASS may lead you
    somewhere. Having some forensic know-how would be helpful as you can sort items
    by date modified.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_22_0.png)


    **FIGURE 1.12**  Password files with some reset questions.


    # COUNTERINTELLIGENCE/ADVANCED HACKING


    Next, we will explore an even more nefarious approach to what was covered in the
    introduction section. I am not trying to repeat information in the first chapter
    of a book you paid for, but we need to take additional measures to seriously exploit
    the user. And, of course, we will add in the precautions you can take to prevent
    being the victim of this type of physical attack on your device later in the chapter.
    Basically, if you are using Windows 11 and a Microsoft account, you will be protected
    from this type of physical attack because BitLocker should be enabled. We will
    discuss the defense later in this chapter.


    The physical exploit will start out basically the same but you will need to take
    some important additional steps to crack the default user’s password. And, if
    you want to cover your tracks to avoid being detected, you will need to do even
    more work (sigh). The loot, however, could be both rewarding and life changing.
    Because the machine is a likely a trusted device, the device will likely not need
    Two-factor authentication for you to access critical websites or their email account.
    I personally know that this is the case for all my trusted devices. There are,
    however, some limitations to what can be done without having unfettered access
    to someone’s computer without access to their phone that might be required for
    two-factor authentication (2FA). We will examine those in this exploit as well.


    After completing steps 1–10, “Breaking into the Windows Operating System”, and
    opening a command prompt by invoking the accessibility options button, you can
    take this different path to break into the system and recover valuable web logins
    by leveraging the typically disabled Administrator account. Then type the following
    commands to enable the administrator account, set a password for the account,
    and reboot the machine. The reboot is needed so the Administrator account shows
    up in the user list for Windows workstation. **Note: On a Server which does not
    display usernames, the Administrator account will be active. Typically, because
    a server is used by multiple users, individuals will not store their personal
    account information in the browser. Using the second command below, you can still
    get into the Server operating system (you won’t need to reboot). Just type Administrator
    for the username and P@ssw0rd for the password.**


    +   1. `C:\Windows\System32>net user Administrator/active:yes`

    +   2. `C:\Windows\System32>net user Administrator P@ssw0rd`

    +   3. `C:\Windows\System32>shutdown /r /t t:30`'
