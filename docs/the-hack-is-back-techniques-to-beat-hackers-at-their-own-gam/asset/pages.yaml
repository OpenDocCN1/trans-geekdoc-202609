  md: 'When using the **dynamic_chain**, if there is a specific error or timeout,
    the proxychains tool will attempt to recover from it automatically. In the code
    block below, we can see that there was a timeout in one of the servers requested.
    To dynamically recover, proxychains used a different set of servers to complete
    the request.


    ```

    ```text

    $ proxychains curl ichanizip.com

    [proxychains] config file found: /home/chris/proxychains.conf

    [proxychains] preloading /usr/lib/x86_64-linux-gnu/libproxychains.so.4

    [proxychains] DLL init: proxychains-ng 4.16

    [proxychains] Dynamic chain  ...  72.195.34.59:4145  ...  72.221.196.157:35904  ...  72.210.252.134:46164  <--socket
    error or timeout!

    [proxychains] Dynamic chain  ...  72.195.34.59:4145  ...  72.221.196.157:35904  ...  ichanizip.com:80  ...  OK

    72.221.196.157

    ```

    ```


    Now you may be thinking – how do we find proxies we can use for our proxychains
    configuration? Many places online post free and open proxies for use, and as one
    can imagine they are commonly used for nefarious purposes. This quickly leads
    them to be marked as malicious by threat intelligence providers, and one should
    not be surprised if a school or place of work blocks access to them.


    Regardless, we can still try. There are several resources available on the Internet
    that post these open proxies for anyone to view and use. Some of the most common
    are:


    +   - https://hidemy.name/en/proxy-list/

    +   - https://free-proxy-list.net/

    +   - https://www.proxynova.com/proxy-server-list/


    Beyond this, one can always use Google to find more proxies beyond this list.
    It’s important to keep in mind that these proxies are publicly posted as well,
    with varying levels of success in their use. On top of that, when we route our
    activity through these free proxies we cannot guarantee the security of our activity.
    However, for exploitation attempts, scanning, and attacks this is acceptable,
    using free Internet proxies for banking applications is a different choice.


    # TOR


    The Onion Router (TOR) is a privacy-based browser and network designed to protect
    users’ identities and origination. The network gets its name from encapsulating
    the traffic using onion routing, where requests are sent through many TOR relay
    nodes across the globe and cannot be directly traced back to the originator. These
    capabilities allow TOR to bypass restrictions that would otherwise prevent free
    speech and access to data in places where countries restrict human freedoms.


    Installing TOR is easy and designed to allow as many people as possible to reach
    it. This aligns with the TOR Foundation’s mission to advance human rights and
    freedoms. The TOR project has how-to guides dedicated to gaining access to the
    Internet in heavy censorship areas, such as how to “Circumvent the Great Firewall
    and connect to Tor from China.”^5


    Discussions about TOR would be incomplete without discussing the dark web, which
    consists of websites and applications hosted on TOR and contains illicit marketplaces,
    stolen software, and other various unsavory items. These websites generally operate
    with what’s known as a “.onion” address, where the top-level domain (TLD) is not
    a “.com” or a “.org”, but literally “.onion”. Keep in mind that TOR can be used
    to browse “normal” Internet websites as well, this activity will be routed across
    the TOR network before they reach their destination.


    While TOR has various levels of benefits to humans and the Internet, there is
    generally little reason for any legitimate enterprise user to require TOR to accomplish
    their duties. Obviously,'
