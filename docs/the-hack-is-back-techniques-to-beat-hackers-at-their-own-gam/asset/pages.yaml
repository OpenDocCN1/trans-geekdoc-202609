- pgno: 298
  md: 'Just like a two-year school, you should find a four-year school that aligns
    to industry certifications. In the Cybersecurity Technology program that I currently
    teach at the University of Maryland Global Campus, all of the courses align to
    certifications like CCNA, CCNP, A+, CEH, CISSP, Cloud+, Security+, Linux+, Net+,
    Pentest+, Security+, as well as Microsoft and AWS related certifications. There
    are actually so many certification-related classes that only certain ones are
    required and some you can choose to take as electives. It would be best to focus
    on a few certifications during your learning journey and not try to get all of
    them. I think Security+ and CISSP have the best return on investment, but the
    CISSP has a requirement of five years of experience. You can take the exam without
    the experience but will need the experience to be officially endorsed as a CISSP.
    Please note that the CISSP is much more of a theoretical exam that does not have
    any hands-on simulations or require you to demonstrate technical expertise.


    One of the best hands-on certification exams you can take is the Offensive Security
    Certified Professional (OSCP). This is not a multiple-choice exam like the Certified
    Ethical Hacker exam which I passed way back in 2005 (although it is still valid).
    The OSCP exam is a 24-hour pentest exercise which requires you to write a report
    at the end. The OSCP requires a significant amount of knowledge and experience
    in cybersecurity and should not be the first certification someone targets. Now
    the CEH does have a new Master level certification that includes some hands-on
    scanning and exploitation, but it is not to the level that the OSCP exam is, as
    that requires exploitation with and without Metasploit.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_298_0.png)


    **FIGURE 10.4** Certified Ethical Hacker Certification.


    When I passed the CEH multiple choice exam in 2005, I specifically remember some
    questions about hacking Windows 98, NT, and 2000 and those systems would have
    been quite prevalent in those days. There is some negative opinion about the CEH
    exam, because it is more tied to multiple-choice questions than hands-on hacking,
    and I get that sentiment. However, any certification you have on your resume will
    be an enhancement, not a drawback. The big thing with CEH is it is now an American
    National Standards Institute (ANSI) accredited certification that is relevant'
  merge: -1
  img_proc: true
- pgno: 299
  md: 'for several DoD-8570 Cyber Security Service Provider (CSSP) Analyst roles.
    Certifications that are on the DoD 8570 list include most of the CompTIA, Cisco,
    GCIA, and ISC2 certifications. See below.


    | CSSP Analyst¹,² | CSSP Infrastructure Support¹ | CSSP Incident Responder¹,²
    |

    |---|---|---|

    | CEH | CEH | CEH |

    | CPR | CySA+ ** | CFR |

    | CCNA Cyber Ops | GICSP | CCNA Cyber Ops |

    | CCNA Security | SSCP | CCNA Security |

    | CySA+ ** | CHFI | CHFI |

    | GCIA | CFR | CySA+ ** |

    | GCIH | Cloud+ | GCFA |

    | GICSP | CND | GCIH |

    | Cloud+ |  | SCYBER |

    | SCYBER |  | PenTest+ |

    | PenTest+ |  |  |

    | CSSP Auditor¹ | CSSP Manager¹ |  |

    | CEH | CISM |  |

    | CySA+ ** | CISSP-ISSMP |  |

    | CISA | CCISO |  |

    | GSLA |  |  |

    | CPR |  |  |

    | PenTest |  |  |


    FIGURE 10.5 https://public.cyber.mil/wid/cwmp/dod-approved-8570-baseline-certifications/


    So even though the OSCP is a far stronger indication of hands-on hacking skills,
    it is currently not on the DoD 8570 list, but CEH is. Employers looking for commercial
    pen-testers may prefer OSCP but positions within the DoD might require a CEH for
    compliance reasons. Both are good certifications to pursue and have in your certifications
    inventory, but they are far different exams in the way they test your knowledge
    of hacking. The CEH multiple-choice exam will cover the related concepts and various
    phases of hacking, while the OSCP certification will be a hands-on pentest of
    live boxes and a written report.


    One of the best ways to train for an exam like the OSCP is to use a platform like
    Hackthebox. Hackthebox has paid and free tiers. The main difference is that with
    the free tiers, you will be on an isolated network with your own victim virtual
    machines. With the paid tier, you are one of many people attacking a machine.
    There are a variety of Linux and Windows machines that you can choose from to
    attack. The goal is to get privileged access. You get points for obtaining user-level
    access (non-privileged) and then additional points if you are able to escalate
    your privileges to administrator or root. There are “active” victim boxes in which
    the solutions for exploitation are not permitted to be published on the Internet.
    Once I get the root or administrator password, I am often able to use that to
    reveal hidden posts on websites to see what approach another person took to break
    into the system. For archived boxes, you are allowed to post a solution as you
    will not receive points for getting into them and it will not increase your rank
    on the site. Their rankings include Noob, Script Kiddie, Hacker, Pro Hacker, Elite
    Hacker, Guru and Omniscient. They also have University rankings which include
    teams in the United States and from across the globe. At the time of this writing,
    the top three US Universities are Bradley, Western Governors, and the University
    of Maryland Global Campus. The top overall University at the time of this writing
    is École nationale supérieure d’ingénieurs de Bretagne Sud (ENSIBS) a French engineering
    college.'
