- pgno: 303
  md: 'I recommend using VMware Workstation for Windows or Linux and VMware Fusion
    for Macs, software which is now free as of 2024. You can download it for Windows,
    Linux, or Mac, at the following link: https://www.vmware.com/products/desktop-hypervisor.html.html.html.
    Please note that It is only free for non-commercial use. The main reason I advise
    people to use it over Oracle Box is that a familiarization with VMware can be
    extremely beneficial if the IT Organization you work for has vSphere and Elastic
    Sky X Integrated (ESXi) servers. Being familiar with VMware Workstation (Player)
    networking and configuration can make it an easier transition to working with
    VMware vSphere in corporate environments.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_303_0.png)


    FIGURE 10.11 VMware vSphere.


    I have been using VMware for over 20 years and I have been quoted as saying that
    “it is the most transformative software that I have ever used”. My understanding
    of cyber and familiarization with operating systems and networking concepts would
    never be what it is today without VMware workstation. With VMware, you can learn
    to install, configure, network, hack, perform incident response, and conduct forensic
    analysis. The snapshot feature is extremely useful for saving a point where the
    operating system is configured exactly how you want before you go and make changes.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_303_1.png)


    FIGURE 10.12 –VMware Snapshots.


    It is true that Oracle Box and Microsoft Virtual PC do have similar features to
    VMware Workstation. I do find that the Linux operating systems work better on
    VMware Workstation'
