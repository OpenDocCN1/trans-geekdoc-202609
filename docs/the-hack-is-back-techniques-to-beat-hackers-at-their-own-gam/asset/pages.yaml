  md: 'After signing up for an account and installing the ngrok tool, the system will
    be configured with your authentication token given to your ngrok profile. Starting
    a new tunnel can be as simple as the code below:


    ```

    ngrok http 80

    ```


    This command creates a **ngrok tunnel** which forwards port 80 on the localhost
    to an Internet-routable destination with a hostname. In my example below, we are
    given a random hostname in the box which is used to be accessible for activity.
    Note that the random hostname can be derived from the WAN IP for the system, which
    may disclose unwanted information. In the example below, the full domain is redacted
    as the WAN IP is provided within the string.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_142_0.png)


    **FIGURE 4.30**  Screenshot of running ngrok to forward HTTP on the localhost
    to an Internet routable address.


    Ngrok can support much more than simply HTTP and can support TCP-based tunnels
    as well. For example, to forward SSH access, the command **ngrok tcp 22** will
    provide Internet access to localhost SSH across a TCP tunnel. There are several
    additional examples provided within the ngrok documentation on how to utilize
    this tool.¹⁵


    ```

    ngrok http 80                         # secure public URL for port 80 web

    server

    ngrok http --subdomain=foo 8080         # port 8080 available at foo.ngrok.io

    ngrok http foo.dev:80                   # tunnel to host:port instead of

    localhost

    ngrok http https://localhost:5001        # expose a local https server running

    on port 5001

    ngrok tcp 22                            # tunnel arbitrary TCP traffic to port

    22

    ngrok tls --hostname=m4lwhere.org 443   # TLS traffic for foo.com to port

    443

    ```


    Ngrok gives us the flexibility to also provide a more “direct” route if we are
    targeting systems behind several other networks that we have pivoted through.
    This can make catching new shells and interacting with them easier to troubleshoot
    as well. Keep this in mind as we pivot through systems to gain further access.'
