  img_proc: true
- pgno: 204
  md: '# I Can’t See My Shadow


    The **/etc/shadow** file is used to store password hashes and is only readable
    by the **root** user, contrary to the **/etc/passwd** file. This is used to help
    control access to the hashes to protect the confidentiality and integrity of the
    system. There are many ways to access this file, most notably through sudo permissions
    to execute commands as a root user.


    Passwords are stored as hashes within the computer. A hash is a one-way and deterministic
    mathematical algorithm that is used to prove access to a piece of sensitive information.
    For example, the string “**whyhello**” will always result in **f908a3b772d51e6473902f3e8937979**
    when passed to the MD5 hashing algorithm. Hashing is not encryption, as encryption
    is designed to be reversible. Hashing is intended to be only one way, which is
    why it is used to store passwords.


    The shadow file is similar to the passwd file and has a familiar format. It is
    colon-delimited and contains various pieces of information that control access
    to the password hash. We see the username, the password hash, the last password
    change, and when the password will expire.


    ```

    ```text

    kali:$y$j9T$zXfNEjP6ZPDCzabfgSLmj/$d.7S35JLORNCfMOvWCr7EjSrbA8atOfRB1N5Pbf51EA:19034:0:99999:7:::

    ```

    ```


    To read this file, assuming that we have access to read it, we can use the **cat
    /etc/shadow** command to print it to the screen. Again, do not get overwhelmed
    with the amount of information printed on the screen! Instead, take it line by
    line, and keep in mind that many of these service accounts do not have any password
    assigned. Entries in **/etc/shadow** that do not have a password hash will have
    a **!** or **\*** in the entry instead, that they cannot log into the system with
    a password.


    ```

    ```text

    # cat /etc/shadow

    root:!:19034:0:99999:7:::

    daemon:*:19034:0:99999:7:::

    bin:*:19034:0:99999:7:::

    sys:*:19034:0:99999:7:::

    sync:*:19034:0:99999:7:::

    games:*:19034:0:99999:7:::

    *** REDUCED FOR BREVITY ***

    lightdm:*:19034:0:99999:7:::

    colord:*:19034:0:99999:7:::

    geoclue:*:19034:0:99999:7:::

    king-phisher:*:19034:0:99999:7:::

    kali:$y$j9T$zXfNEjP6ZPDCzabfgSLmj/$d.7S35JLORNCfMOvWCr7EjSrbA8atOfRB1N5Pbf51EA:19034:0:99999:7:::

    redis:!:19238::::::

    _gvm:!:19238::::::

    mosquitto:!:19304::::::

    polkitd:!*:19304::::::

    chris:$6$j8eqkQAs9cmYjF8J$wgptfmGdyjZw0vBS/YuiYS9qrJdxfJg5iDO.goFw8fYT.20Re0g4ABU3WV3Gz3ekNfT2o5/2CbiYfPItoNebl.:19717:0:99999:7:::

    ```

    ```


    Again, pay attention to the only two accounts which have password hashes stored—based
    on our analysis from the **/etc/passwd** file we know these are both interactive
    user accounts. After gaining access to the password hashes, we can load them into
    a password-cracking program like **hashcat** to try and crack the password.


    The trick to gaining access to this file is that it requires root permissions
    to read it. However, there are various other misconfigurations, sudo misuse, and
    even system backups where we can access this file. The important thing to keep
    in mind is that this file is exceptionally useful to keep track of and gain access
    to if available.'
  merge: -1
  img_proc: true
