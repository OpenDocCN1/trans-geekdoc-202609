- pgno: 162
  md: 'HTB is a wonderful resource for the infosec community as it provides a playground
    for hackers to hone their skill sets. Most of the machines on HTB are from community
    authors who design and build the machines from their professional experience to
    help others learn how they attacked and performed activity against a similar type
    of machine.


    This author has created a machine for HTB named **Previse** which exploits an
    Execute After Redirect (XAR) vulnerability in a website identified during professional
    experience. Then this machine is vulnerable to a Remote Code Execution (RCE) attack
    based on how a parameter is interpreted by a **PHP exec()** function. A password
    is stolen from the website’s database, which can be cracked and used to SSH directly
    into the machine. HTB forces users to use their hands-on techniques to complete
    these actions instead of simply reading about them – this is a critical component
    that separates good hackers from great hackers.


    HTB machines always have writeups available, which are written documents about
    how the machine was cracked into and owned. The writeups are not supposed to be
    available for systems that are still listed as “active” on the HTB lab and are
    published for machines once they have been moved to the retired boxes. Taking
    the time to read the writeups that the community has written provides valuable
    insight into how machines are viewed differently by others in the field. This
    author has learned countless new techniques and tools from reading writeups from
    others. If you are stuck with a machine, it’s highly recommended to read a writeup
    if it’s available!


    ![](img/181571ad74cba0e6a2f38fcd2658651e_162_0.png)


    **FIGURE 5.18** Machine card for Previse, an HTB machine created by the author.


    # PICO CTF


    The PICO CTF is hosted year-round and provides entry-level to advanced-level challenges
    across many different areas. This CTF has been around for years and provides challenges
    within their picoGym which are available at any time. The game is accessible at
    [https://play.picoctf.org](https://play.picoctf.org).


    Many writeups are available for users to understand how to view certain challenges
    and learn how to solve them. Writeups are a key component to learning how to attack
    systems and uncover vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_163_0.png)


    **FIGURE 5.19** Screenshot of the PicoCTF scoreboard and various challenges available.


    There is an annual PicoCTF competition which occurs around March each year as
    well. This is a classic competition where there is a time limit to complete challenges
    versus the always-open nature of the PicoGym. Competing against others is another
    fun way to challenge yourself into becoming better at what you do, if you’ve never
    done it before it is highly recommended!


    # National Cyber League (NCL)


    The NCL is a twice-a-year competition for collegiate cyber athletes to represent
    their school in a set of CTFs. This competition is specifically limited to college
    students who are taking courses at their school. The NCL is focused on introducing
    new students to the cyber field, providing hands-on experience, and giving employers
    a level of familiarity and experience when hiring a candidate. If you are a college
    student who is eligible to compete in the NCL, it is highly recommended to get
    started and learn. The community and learning within the NCL are unmatched and
    drive us as cyber analysts to be better.


    # US Cyber Games (USCG)


    The USCG is an organization that runs the US Cyber Team which competes in international
    cyber competitions. The team is comprised of 30 athletes who train, travel, and
    compete in cyber competitions throughout the season. The competitions are a mix
    of Jeopardy-style questions and Attack/Defense scenarios.'
