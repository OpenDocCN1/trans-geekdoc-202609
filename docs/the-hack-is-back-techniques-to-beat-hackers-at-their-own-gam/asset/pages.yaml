- pgno: 15
  md: '# 1 Hacking and Securing Your Operating System


    # INTRODUCTION


    If we are going to talk about “hacking” an operating system, we should start with
    Windows. I have been using similar methods to break into the Windows operating
    system for over 20 years now. I started using Windows in 1994, and I have not
    stopped using it since then. I have spent significant person-hours using all of
    the main versions of Windows. One time for “fun”, I decided to install all of
    the mainstream versions of Windows on my MacBook Pro (running Windows, lol) for
    “fun”. The memories of installing, configuring, and networking all of these operating
    systems hundreds of time as a teacher/instructor/trainer/professor for 23+ years
    were the best and the worst of times. There were many successful and failed installations
    (blue screens) along the way in my teaching journey. I installed (as well as configured
    and networked) these current and legacy operating systems in VMware Workstation,
    now free tool (as of 2024) that I consider to be instrumental to learning Cybersecurity.
    Server 2019, Server 2022, and Windows 11 are not pictured here, as they were not
    released at the time I worked on this project.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_15_0.png)


    FIGURE 1.1 Windows in a “Box”.


    Using some type of Virtualization software like VMware Workstation or Oracle Virtual
    Box (free) is a great way to test, learn, and experiment with the various features,
    vulnerabilities, and available software. I prefer VMware and VMware Workstation
    Player is also a free offering that runs on Linux and Windows. The Windows version
    is available on this link: https://tinyurl.com/GetVMNOW. There is also VMware
    Fusion which is now also free and runs on Mac. The older Intel-based Macs can
    run almost any version of Windows. The newer Silicon-based Macs have VMware Fusion
    but can only run Advanced RISC Machine (ARM)-based operating systems (at the time
    of this writing). You can use a free product called Universal Turing Machine (UTM)
    to run Intel-based operating systems with emulation (which is slower than virtualization).
    The snapshot feature, which is more robust with VMware Workstation and VMware
    Fusion, allows you to save hours of work. Keep in mind that as of 2024, anyone
    can get VMware workstation for free. Learning about exploiting and hacking as
    well as securing and hardening can both be accomplished using virtual machines
    without ever touching a real network. Practicing these techniques on a virtual
    machine is highly advisable.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# BREAKING IN – THE BACKGROUND


    In most cases, logging on to a Windows machine requires a username and password.
    The last username is often already displayed, especially in a home environment,
    but it can also be the case for a Domain environment, depending on what the security
    settings are. Regardless, we will walk you through the process of getting into
    the system without the password and follow up with the directions on how to prevent
    yourself from being vulnerable to this type of attack. More or less, you will
    want to use the disk encryption, which involves using BitLocker or a third party
    tool. We will examine that later in the chapter.


    If you got a copy of the old book, titled “Defense against the Black Arts: How
    Hackers Do What They Do and How to Protect against It”, (now free) there were
    like a half-dozen ways to break into Windows. However, now we can just use the
    Windows installation USB or DVD media to get past the password instead of utilizing
    bootable USB (or DVD)’s running Linux. Most computers have a function key that
    allows you to select which device you will boot from. For example, on a Dell computer,
    you can just hit F12 to bring up a boot menu. A simple Google Search should provide
    you with the key needed to get the boot menu when you start the computer. Many
    of the computers I use automatically boot to USB or DVD devices when you insert
    the media, but you may need to press a key (like the space key) to complete the
    process of booting to the installation media. Note that for Windows Server versions
    like 2016, 2019, and 2022, you can also boot the installation media and select
    repair your computer, as opposed to install, and follow the steps below and wind
    up in the same place. At the install screen for Windows 10, you will click next
    and then you will need to choose the option to “repair your computer”. Note that
    doing this without putting the installation media will not work as you will be
    forced to enter the Administrator password to get into most of the recovery options.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_16_0.png)


    FIGURE 1.2 Repair your computer.


    From here, you will get to the Choose an option screen. You will need to select
    the Troubleshoot from the list of options, which will take you to an advanced
    options screen. From there, select command prompt. In the Windows command prompt,
    we will change around a single file to complete our hack. Keep in mind that we
    will also explain how to prevent someone from leveraging this type of attack later
    in this chapter. Again, it is important to note that in the recent versions of
    Windows, you will need to follow these steps from the installation media because
    if you go the route of trying to use the built-in Windows recovery feature at
    boot to get to the command prompt, that approach will fail. Command prompt access
    through the recovery console still requires a password but we are bypassing it
    by using the installation media, either on a USB stick or legacy DVD media.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '**Note: Continue to read the full first chapter before attempting this because
    you might want to ....**


    When you boot to the installation media, you are able to access the command prompt
    without any type of authentication. You will know that you are in the right place,
    when you see an X:\Sources> prompt. At that prompt, you will type the following
    command to keep a copy of the legitimate file so you can replace it later if needed.
    `copy C:\Windows\System32\cmd.exe C:\Windows\System32\Utilman.1` Then, type `copy
    C:\Windows\System32\cmd.exe C:\Windows\System32\Utilman.exe`. Click Y to replace
    the file. After that, close your command prompt by clicking the red X in the top
    right corner and then click Continue to Windows. At the Windows logon screen,
    click the Ease of Access button (Utilman. exe) to get a command prompt. I will
    now review how I got to this point. (I am a teacher, so I like to review ☺).


    ![](img/181571ad74cba0e6a2f38fcd2658651e_17_0.png)


    FIGURE 1.3 Renaming Utilman.exe cmd.exe.


    # BREAKING INTO THE WINDOWS OPERATING SYSTEM – STEP-BY-STEP WITH SCREENSHOTS


    *All of the Steps to break into the Windows Operating System without a password:*


    +   1. Get a copy of the installation media for Windows on a USB drive or legacy
    media like DVD.

    +      Note with a DVD, you select that choice in step 2 and press the space bar
    immediately.

    +   2. Enter the boot menu of the computer to ensure you can boot to installation
    media (if needed).

    +      Note that if you have secure boot enabled, that will need to be disabled
    in the BIOS (Figure 1.4).


    ![](img/181571ad74cba0e6a2f38fcd2658651e_17_1.png)


    FIGURE 1.4 BIOS Boot Menu options.'
  merge: -1
  img_proc: true
