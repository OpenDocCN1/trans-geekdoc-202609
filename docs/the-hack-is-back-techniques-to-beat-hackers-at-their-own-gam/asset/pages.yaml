    \ an arbitrary POST request to a server we control, and then continue the normal\
    \ login process for users. From the user’s perspective, there is no difference\
    \ from regularly logging into the machine. However, from our side, we receive\
    \ a POST request on our server containing the credentials for the users as they\
    \ are submitted. Pretty cool!\n\nLet’s continue to build our weaponized exploit\
    \ in stages. Since we know we can gather the data from the username and password\
    \ fields, we need to ensure that this data can be sent via POST request to us.\
    \ The easiest way to do this is with AJAX (Asynchronous JavaScript and XML). AJAX\
    \ sounds complicated but is much easier than it seems – it is simply asynchronous\
    \ activity that helps our pages seem more fluid and load/send requests without\
    \ having to reload the entire page. Imagine scrolling through Facebook or Reddit,\
    \ each time a new set of posts is loaded, the entire page doesn’t reload – this\
