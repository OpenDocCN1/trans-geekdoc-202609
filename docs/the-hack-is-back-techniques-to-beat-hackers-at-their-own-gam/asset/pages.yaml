- pgno: 284
  md: 'able to provide the name of the executable that is created, prLNUjAgGAE.exe
    when the script runs. It also lets me know that the file is malicious when it
    runs through a large number of detection engines. There are more advanced techniques
    that hacker can use to improve their ability to evade detection.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_284_0.png)


    **FIGURE 9.18**  VirusTotal analysis of the malicious VBS file.


    It is important to clarify that the original entry point for the attacker, PowerShell.exe
    would not be detected in autoruns but could be detected with Process Explorer.
    Only when I ran the persistence command did the VBS script and dropper prLNUjAgGAE.exe
    get created. The persistence command in meterpreter reported that it created the
    startup entry for the persistence in the HKLM\Software\Microsoft\Windows\CurrentVersion\Run\
    registry key. However, that is an extremely common key that people doing forensic
    analysis will usually examine for startup entries and it appears that HKLM\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Run
    is the actual location of the registry key. I was able to detect this location
    by using the autoruns tool. It detects programs that are going to start automatically
    in Windows and is extremely useful for dynamic malware analysis.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_284_1.png)


    **FIGURE 9.19**  Registry entry of the Malicious VBS file.


    # CHECK THE ACCOUNTS


    So, many of the Network Intrusion Analysts, or Threat Hunters, will tell you to
    look for active connections to the system as well as to carefully examine the
    processes as we did in the first section of the chapter. It is extremely common
    that a hacker will get into and stay in your system or network as long as possible.
    But, depending on the ports that are open and the services that are running, the
    possibility always exists that an attack might create credentials so they can
    leave and come back. For that reason, it is never a bad idea to check the accounts
    on the system. This step should also be part of your incident response plan and
    if you get an image of RAM, you can also view your Windows accounts as you might
    have seen in Chapter 1 when I used the volatility framework to extract password
    hashes (during a physical attack on the machine).


    After typing the shell command in meterpreter or accessing the command prompt
    on Windows, here is a list of commands that can be utilized to create a “SYSTEM”
    account, even though an account for SYSTEM that cannot be utilized by any user
    already exists. SYSTEM is the highest'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'level of privilege possible on Windows, even above the administrator account.
    What we are doing here is actually just creating a standard account and adding
    a space to the name of an actual account that exists and cannot be used and then
    adding it to the administrators group. The idea here is to use an account that
    flies under the radar and since the SYSTEM account really exists (but is not shown),
    it might not be caught by someone who does not have a lot of experience analyzing
    Windows accounts. I have done this trick as a red teamer before at the Collegiate
    Cyber Defense Competition (CCDC), and it stayed on the systems during the entire
    two-day competition, and allowed me to log in at will and wreak havoc on the students’
    boxes within the guidelines of the competition rules. And some of the students
    attend the best cybersecurity schools in the country, but they did not notice
    that “SYSTEM “did not actually belong. Here are the commands that I ran on the
    system to create the account “SYSTEM” and add it to the administrators’ group:


    ```

    net user SYSTEM P@ssw0rd /add                 -> will not work because it says
    the account exists.

    net user                                      -> shows a list of users but no
    system account.

    net user "SYSTEM " P@ssw0rd /add             -> adds a standard account names
    SYSTEM with a space

    net localgroup administrators "SYSTEM " /add  -> adds the "SYSTEM " account to
    administrators

    net user                                      -> shows a list of users including
    a "SYSTEM " account

    ```


    ![](img/181571ad74cba0e6a2f38fcd2658651e_285_0.png)


    FIGURE 9.20 Account Manipulation to add “SYSTEM”.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'What is interesting here is that I was not positive if that DefaultAccount
    was something I created or was actually supposed to be there. A simple Google
    search did tell me that The DefaultAccount or Default System Managed Account (DSMA),
    is a built-in account introduced in Windows 10 version 1607 and Windows Server
    2016. So that account is supposed to be on this version of the Windows OS but
    not all of the different versions on Windows. It can vary so it can be quite tricky,
    as you will see in the next example, and even experienced administrators might
    have to research to find the list of accounts.


    On this older version of Windows, there were a bunch of default accounts that
    were supposed to be on there. You might see some similar accounts on the modern
    versions of Windows depending on what is installed and configured. The HelpAssistant
    and Support accounts are legitimate accounts included with this version of Windows.
    The IWAM and IUSR accounts are created when the user installs Internet Information
    Services, so those are also supposed to be there. On newer versions of Windows,
    I have also seen a WDAUtilityAccount which is related to Windows Defender. The
    fake account I created is HelperAssistant. Notice that I tried to keep the capitalization
    similar to the HelpAssistant account.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_286_0.png)


    **FIGURE 9.21** Which accounts are legitimate?


    The administrator and guest accounts can also be enabled and used by the attacker
    if it is not in use. Starting with Windows Vista, the client OS Versions (Windows
    NT client list includes NT Workstation, 2000 Pro, XP, Vista, 8.1, 10, and 11)
    the Administrator and Guest accounts would be disabled by default. In the Windows
    Server versions (NT Server, 2000 Server, 2003, 2008, 2012, 2016, 2019, and 2022),
    the Administrator Account is enabled, and the guest account is disabled. And,
    speaking of Windows Server, on a Domain Controller, which can have dozens, hundreds,
    or thousands of accounts, making tracking user accounts a much more complex situation,
    as it is even more difficult to find unauthorized accounts. One suggestion to
    help find unauthorized accounts is to view the accounts with Administrative privileges
    on the system. When I do this on the Windows server, I only find two accounts.
    Standard accounts and accounts that are members of group like backup operators
    can still do damage to the system, but most of the time the attacker is going
    to need administrative rights for their tasks.


    The command I used to view the administrator accounts was: **net localgroup administrators**


    ![](img/181571ad74cba0e6a2f38fcd2658651e_286_1.png)


    **FIGURE 9.22** May I speak with an Administrator?'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'We looked at connections and processes to determine if an attacker might be
    connected to your system. Then, we examined the user accounts on the system to
    look for any authorized users. Next, we will just make sure that the front door
    is not open either. There is no need to have open services on your system that
    can be leveraged by an attacker. Even if you are behind a firewall, keep in mind
    that other systems on your network or a wireless network that you connect with
    your laptop may be able to bypass those filters. The proliferation of connected
    devices everywhere in our homes and workplaces makes this a much more serious
    threat. For example, a researcher from Check Point was able to demonstrate how
    a compromised Peloton could be leveraged by an attacker to move laterally on a
    network.


    Next, we will examine what is open and close the ports if we don’t feel the services
    are needed. We can use nmap on Windows which you can download from here: https://nmap.org/download,
    or we can just use built-in netstat.


    Run the following commands to see what ports are open on your Windows system:


    ```

    nmap 127.0.0.1 -p 0-65535   -> checks to see what Transmission Control (TCP) Ports
    are open

    netstat -tan | find "LISTENING" -> shows a list of open ports with the built-in
    netstat command

    ```


    ![](img/181571ad74cba0e6a2f38fcd2658651e_287_0.png)


    FIGURE 9.23 Open ports on a Windows system.


    +   1. Use Server Manager to uninstall IIS which will remove the FTP and HTTP
    servers if not in use.

    +   2. Remove File and Print Sharing if you are not using it on your network.
    You can do this here: In the Control Panel\Network and Internet\Network and Sharing
    Center\Advanced sharing settings.


    Your main concerns should be removing the Secure Shell (SSH) Server and Remote
    Desktop Protocol (RDP) Server for remote connections. SSH uses port 22 for remote
    command line administration and RDP uses port 3389 for GUI-based remote administration.
    Yes, Microsoft has started including an Open SSH Server with their server builds
    and has thankfully discontinued including a telnet server. You can uninstall OpenSSH
    server through Setting App. Apps, Optional Features. To disable RDP, if it is
    unneeded, you should right click on the Start Button, go to System, and select
    Remote Desktop. Turn it off and then confirm your choice. Perform another scan
    of the localhost with nmap to verify it is closed.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_288_0.png)


    **FIGURE 9.24**  Closing RDP.


    One final thing to mention about the security on your Window’s devices regarding
    the Administrator account that might not be obvious. The built-in Administrator
    account cannot be locked out for obvious reasons, like losing your ability to
    access the system permanently. On the Windows client systems, like Windows 10
    and 11, this account is disabled by default. However, in the server operating
    systems like Server 2019 and Server 2022, this account is active and can be exploited
    because it will accept hundreds and thousands of incorrect logins and still let
    you keep trying, In the example below, I tried 182,899 different passwords and
    then finally successfully got the administrator password of P@ssw0rd. Renaming
    the built-in administrator account will certainly help with this vulnerability
    with that account.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_288_1.png)


    **FIGURE 9.25**  The disadvantages of the Administrator Account.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'With accounts, we also need to examine Linux. In my opinion, both Operating
    systems (Windows and Linux) have advantages and disadvantages, and both have advantages
    and disadvantages from a security perspective. Please don’t go around professing
    that Linux is more secure (or stable) than Windows because it depends on many
    factors like what version of the operating system you are using, what applications
    you are using, and what security settings are configured. A Linux system with
    a vulnerability is no more sure than a Windows system. Hackers target Windows
    systems more often because Windows is more widely used by the consumer market.
    Windows was extremely lax (and fairly unstable) with their security back in the
    90s before using the Internet became more mainstream. Earlier versions of Windows
    included insecure file systems, unnecessary applications installed and running
    by default, and no Firewall. But even when Windows started to button things up,
    applications like Java and Adobe (and Office) provided hackers with easy entry
    points into systems. Windows is much more secure and stable in 2024 than it was
    when it was released more than 30 years ago. Some of the common Linux privilege
    escalation attacks that many are aware of like shellshock and other attacks prove
    that Linux is also not immune to security issues.


    With Linux, we can look at accounts with Linux by viewing the /etc/shadow file.
    In particular, we want to look for accounts that might have a UID of 0. There
    can be a large number of accounts in Linux without logins or passwords, so we
    can filter for accounts with passwords by using grep to look for a $. The dollar
    sign ($) is present in Linux password hashes because they are ($)alted. Salting
    is an extra step in the hashing process which will prevent attackers from using
    a Rainbow Table. A Rainbow Table is a large collection of hashes and their corresponding
    passwords. Rainbow Tables work against Windows NTLM and LAN Manager hashes, but
    do not work against password hashes on Linux or Cisco (or Mac) devices. The easiest
    way to explain this in layperson’s terms is that **if two different users have
    the same exact password, they will have different password hashes in Linux but
    the same password hash in Windows.** In Linux, we can look for accounts with a
    UID of 0 (root level permissions) by using grep to look for x:0.


    Run the following commands to look for accounts with passwords and accounts with
    a UID of 0:


    ```

    cat /etc/shadow | grep -F "$"          -> finds accounts with Passwords

    cat /etc/passwd| grep x:0              -> finds accounts with a UID of 0

    ```


    ![](img/181571ad74cba0e6a2f38fcd2658651e_289_0.png)


    # FIGURE 9.26 User Accounts with passwords and Root Level Access (UID=0).


    You also can and should examine the sudo group by typing the command cat /etc/group
    and looking for accounts in the sudo group. On most newer versions of Linux, the
    root account might even be disabled and the first user account will have root-level
    permissions when they run the sudo command. This is more or less the same as what
    Microsoft did with their client versions of the operating systems by disabling
    the built-in administrator can give the first account created administrative rights
    when they click the allow button to user account control (this started with Windows
    Vista). Windows is trying to avoid having the end user use the Administrator account
    (on clients) and Linux is trying to avoid having the end user use the root account.
    Why? Because those administrative powers could potentially allow you to damage
    your own system by installing malware.'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'During the XP days before this practice was implemented in Windows Vista, most
    users were using administrative accounts and this was a nightmare from a computer
    security perspective and a wonderful and prosperous time for hackers and attackers
    everywhere. I have been using Windows since 1994 and Linux since 2000, and I do
    prefer to use administrator and root.


    Run the following commands to look for accounts in the sudo group:


    ```

    cat /etc/group | grep sudo   -> lists the accounts in the sudo group

    ```


    ![](img/181571ad74cba0e6a2f38fcd2658651e_290_0.png)


    FIGURE 9.27 Looking at the sudo group on Linux.


    It is not difficult for an attacker to create another root-level account if they
    break into a Linux system and have administrative access via the root account
    or if they have sudo permissions. In this example, I add another user levi with
    a UID of zero and add the -o because that UID is not unique (since root also has
    the UID of zero. The prompt of a pound sign # instead of dollar sign & for the
    user tells you that you have root-level privileges. This is also true for the
    Cisco iOS and Mac. Instructors, like me, often tell students to remember that
    the pound is worth more than the dollar and that is an easy way to remember which
    symbol designates a high privilege level. And fortunately (or unfortunately for
    my bank account), the currency discrepancy has remained for over 20 years of teaching
    this concept.


    Run the following commands to create an account with a UID of 0:


    ```

    useradd levi -u 0 -o   -> adds a user with a UID of 0 (non-unique)

    id levi               -> displays the UID and group of the user

    ```


    ![](img/181571ad74cba0e6a2f38fcd2658651e_290_1.png)


    FIGURE 9.28 User Accounts with passwords and Root Level Access (UID=0).


    So, with Linux we have to take it a step further than just examining accounts
    and looking at UIDs. While working with some other red teamers at the Mid-Atlantic
    Collegiate Cyber Defense Competition (MACCDC), they showed me a technique to store
    their SSH keys on the victim machines in the authorized_keys file. This allows
    them to keep connecting to the system as the root account with even if the root
    password account is changed. The students had the daunting task of trying to keep
    the red team out of their systems. They kept changing their root passwords, but
    we were still right back in their systems because our id_rsa.pub file was copied
    to their/root/.ssh/ authorized_keys file. We referred to this technique as a Dirty
    Red Team Tricks. At the end of the competition, we reveal this and other tricks.


    Run the following commands to copy your key to the victim machine:


    ```

    scp /root/.ssh/id_rsa_pub root@IP:/root/.ssh/authorized_keys  -> allows continued
    SSH access

    ```'
  merge: -1
  img_proc: true
- pgno: 291
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_291_0.png)


    **FIGURE 9.29** Dirty red team tricks.


    This is also very convenient for the hackers because they do not even have to
    try a password when they SSH. From a forensic standpoint, we should probably check
    the information in the authorized_key file on the Linux server for the root (and
    possibly other accounts with sudo permissions). To do this, just go to the Linux
    machine and navigate to the hidden .ssh directory. You can then utilize cat, head,
    tail, more, or less to view the contents of your authorized_keys file. Look at
    the information stored in the file.


    Run the following commands to view the authorized ssh keys on the system:


    ```

    cat  ~/.ssh/authorized_key  -> allows continued SSH access

    ```


    ![](img/181571ad74cba0e6a2f38fcd2658651e_291_1.png)


    **FIGURE 9.30** The authorized ssh keys file authorized_keys.


    Finally, we will take a look at the open ports on our Linux system and then close
    any ports that have unnecessary services that don’t need to be running. The tool
    nmap works on Windows but it was built and compiled for Linux, so it works best
    on Linux systems. It can be easily installed using apt-get or yum depending on
    the fork of Linux you are utilizing. Like with Windows, you can also use netstat
    to view the listening ports. Just use grep instead of the find command to parse
    the output of the command.


    Run the following commands to see what ports are open on your Linux system:


    ```

    nmap 127.0.0.1 -p 0-65535       -> checks to see what Transmission Control (TCP)
    Ports are open

    netstat -tan | grep LISTENING  -> shows a list of open ports with the built-in
    netstat command

    ```'
  merge: -1
  img_proc: true
- pgno: 292
  md: '![](img/181571ad74cba0e6a2f38fcd2658651e_292_0.png)


    FIGURE 9.31 The authorized ssh keys file authorized_keys.


    Finally, we will examine how to stop these services and prevent them from running
    automatically at startup. You can use the service command followed by the service
    name and stop, start, restart, or view the status of a service. You can use the
    update-rc.d command to enable or disable services at startup.


    Run the following commands to stop services and stop them at system startup


    ```

    service vsftpd stop              -> stops the service

    update-rc.d vsftpd disable       -> disables the service at startup

    ```


    ![](img/181571ad74cba0e6a2f38fcd2658651e_292_1.png)


    FIGURE 9.32 Stopping unnecessary services.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# SUMMARY


    Hackers get into systems and then take steps to stay in those systems. You do
    not have to just be a sitting duck and let the hacker manage, control, and abuse
    your system. There are built-in and third-party tools that you can leverage in
    Windows and Linux to investigate any type of suspicious activity on your system.
    Whether you are on a cyber team in a competition or you think you have been hacked,
    there are ways to tell if someone is in your system by examining the connected
    IP Addresses and running processes. Just like you should actively check your bank
    accounts and credit reports for suspicious activity, you should examine your own
    computer’s operating system accounts for unusual and unauthorized activity. Understanding
    what the signs of a compromise might be and being diligent in checking for any
    type of suspicious activity can empower you as an end-user or analyst. As you
    start to become more familiar with the indicators of compromise, you can know
    how to detect if there are malicious actors on your system or within your network
    and take steps to remove them.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# 10 A Career in Cyber


    # INTRODUCTION


    In this chapter, we will explore some of the ways to break into the field of cybersecurity.
    There are about three-quarter of a million job openings for Cybersecurity roles
    in the United States at the time of this writing. There are more openings in some
    areas than others, and the website statista.com provides a state-by-state breakdown.
    There are many advantages to being in the field of cybersecurity including a large
    amount of job openings, the ability to do remote work, and the ability to earn
    high salaries. It is very important to note that the field of cybersecurity is
    not Computer Science which can be a math (and calculus) heavy curriculum. In general,
    there is not a lot of math in Cyber other than some subnetting, hex, binary, and
    some simple calculations, so don’t get scared away if you are not a fan of math.


    Who would be a good candidate for a job in cybersecurity? Individuals who are
    comfortable with technology, setting up their home routers, good at working with
    iPhones, Androids, Chromebooks, and iPads, and the use of other technology would
    all make good candidates for a career in cybersecurity. And one final note, before
    you read any further. The people who have the most successful careers in cybersecurity
    are the ones who find it generally fun and exciting, who have a passion for technology
    and find it interesting. People who are just in cyber for the money and have less
    passion about cyber might not enjoy going to their job every day. This is pretty
    much a universal truth that if you enjoy what you do that will make your job satisfying
    and work can be an enjoyable part of your life. We will also examine how having
    a passion for cybersecurity can help you in a job interview (or at a least perceived
    passion).


    Why is Cybersecurity such a good choice for a career?


    +   1. The large number of job openings, about 3/4 of a million jobs (2023) according
    to statista.com.

    +   2. High salaries and the ability to move into different areas of the field
    (red vs. blue roles, etc.)

    +   3. The ability to work remotely, save money on commuting, and keep your house
    cleaner.

    +   4. If you are unmarried and have no offspring, the ability to find an IT job
    with travel involved.

    +   5. Continual life-long learning that will keep you and your mind challenged
    for decades.

    +   6. A four-year degree is not always required for entry-level positions. (A
    two-year degree can work).

    +   7. Passing certification exams can advance your career. A certification might
    be a job requirement.

    +   8. This career field continues to get more diverse over time, and that is
    a positive factor.


    Ok, that was fun, because I often advise people to consider a career choice in
    IT or Cyber. But what are some reasons to avoid the IT career field? We should
    disclose some of those drawbacks as well:


    +   1. Jobs within the DoD often require clearance. Make good life choices to
    be able to have/get one.

    +   2. It can be extremely difficult to unplug from work. Working in a SCIF can
    help alleviate this.

    +   3. Remote work that could pay less based on the cost of living in your location.

    +   4. Not all locations have lots of IT job openings and very high salaries.
    Check indeed.com for your area.

    +   5. Continual learning requires you to be constantly retrained.

    +   6. Some of the experience levels required by employers are unrealistic.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '+   7. Passing certification exams can be a barrier. A certification might
    be a job requirement.

    +   8. This career field has lacked some diversity in the past, so many are working
    to change this.


    There are likely many other advantages and disadvantages of working in the field
    of cybersecurity. Some of these items were at the front of my mind and I wanted
    to level set expectations for those of you on the fence about a career in cyber,
    or for those who are pondering if you want to stay in cyber long term.


    Some of the higher paying jobs require a lot of experience, IT certifications,
    and sometimes will even require you to have a security clearance. So how do you
    get there? Many of the entry level jobs will require a single certification, less
    experience, and a degree may or may not be a requirement. Clearances are really
    only needed for jobs where you are working for the Department of Defense (DoD).
    Many jobs will also help to pay for school, training courses, and certification
    exams. As you gain experience, get additional certifications, and finish your
    degree, you can move to another job making more money. With many of these larger
    companies, it is also possible to stay within the company, moving from one position
    to another. It is not uncommon for people in IT to work 5–10 different jobs in
    a five-year people. Way back in the day, people used to stay at one company for
    an entire career. In that era, it was frowned upon when people moved from job
    to job as it seemed as if they were less reliable and more “unstable”. Nowadays,
    almost the opposite is true. If you don’t have a lot of different experience at
    a number of different employers in various job roles, some hiring managers may
    question why you only stayed in one place. Moving from job-to-job in Cyber is
    a great way for people to get 20,000 dollars or more raises. Different companies
    and job roles help diversify your employment and cybersecurity-related experience.


    ![](img/181571ad74cba0e6a2f38fcd2658651e_295_0.png)


    FIGURE 10.1 High paying jobs as an NSA contractor at Parsons.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Next, we will discuss some of the various degree programs within cybersecurity.
    Newsflash that you do not have to go to Harvard or Stanford to get a great education
    in cybersecurity. A great place to start is your local community college. Community
    Colleges have some of the best and most knowledgeable full-time cybersecurity
    faculty in the country. The reason for this is that they are focused on teaching
    10–12 (or more) classes a year, not on research. While doing research is great
    and essential, it can keep faculty out of touch with the daily grind involved
    in using Linux, Windows, and Cisco operating systems.


    Teaching a class of 25–30 students concepts like Ethical Hacking is not for the
    faint of heart as there can be lots of troubleshooting when students are unfamiliar
    with the terminal and Command Prompt. I learned so much about troubleshooting
    and operating systems from interacting with my students. This brings up another
    point that teaching cybersecurity classes is another good way to give back and
    enhance your own understanding of concepts and topics. The requirements for teaching
    and the pay vary greatly at community colleges, colleges, universities, non-credit
    programs, and training centers. All of the people I know who teach full time at
    a Community College will not leave their jobs, which might not seem important,
    but if people stay somewhere for a long term, they likely love where they work.


    With community colleges, four-year colleges and Universities, find a degree program
    where the classes align with certification exams. Some people are skeptical regarding
    certification exams and their value, but certifications are often a requirement
    by an employer for compliance reasons. As a matter of fact, I know of people who
    have been hired because they have a certification and I know of someone who was
    let go for not passing their certification exam within the six-month time frame
    specified by their employment contract. Below is my CompTIA transcript, which
    includes many of the exams taken prior to 2010 which are valid for life and some
    of the Continuing Education (CE) exams that were not in existence when I took
    most of the certification exams in the early 2000s (Cloud+, Pentest+, CYSA+, and
    CASP+).


    ![](img/181571ad74cba0e6a2f38fcd2658651e_296_0.png)


    FIGURE 10.2 CompTIA Certs, I love them (Especially prior to 2010).


    Most of the community colleges I am aware of have a cybersecurity program that
    aligns to industry certifications from Cisco, Microsoft, CompTIA, EC-Council,
    and ISC2. I taught at the Community College of Baltimore County (CCBC) for a number
    of years and their program had many cybersecurity classes that aligned to industry
    certifications. This was also true for other Community Colleges'
