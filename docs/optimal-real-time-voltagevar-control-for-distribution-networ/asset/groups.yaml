    # 电力与能源系统 153 (2023) 109370


    ScienceDirect 可用目录列表


    # 国际电力与能源系统国际期刊


    期刊主页：www.elsevier.com/locate/jepes


    # 配电网的最优实时电压/无功控制：基于下垂控制的多智能体深度强化学习


    Peishui Li$^{a}$, Jia Shen$^{b}$, Zijun Wu$^{b}$, Minghui Yin$^{a}$, Yanhao Dong$^{b}$,
    Jing Han$^{a}$


    +   $a$ 中国南京理工大学，中国南京市小巷街200号，邮编 210094。

    $b$ 中国东南大学，中国南京市四五牌街2号，邮编 210060。


    # 文章信息


    关键词：


    - 分布式电压/无功控制

    - Q-var 无功下垂控制

    - 多智能体深度强化学习


    # 摘要


    光伏（PVs）作为清洁电源已在配电网中高度渗透，这促使网络向高度复杂的运行状态发展。本文提出了一种最优实时电压/无功控制（ORT-VVC），通过调节光伏逆变器的无功功率来减少功率损耗并缓解波动。建立了一种基于下垂控制的多智能体强化学习（DC-MARL）的
    ORT-VVC。该结构在配电网中通过网络划分和多智能体进行构建。然后，将控制模型建模为带有参数的 Q-var 下垂函数，通过优化控制参数而非直接最小化无功输出，旨在提高配电网的实时
    VVC 性能。建立了 DC-MARL 模型，并在 IEEE 123 节点测试系统上进行了数值仿真，以证明了所提方法的有效性。


    # 1. 引言


    随着可再生能源（RES）渗透率的提高，配电网正向主动模式发展[1]，这种模式是环保的。根据国际能源署的数据，电网容量将在2022年至2027年间增长近倍。风能和水力（WT）等可再生能源的渗透越来越具有歇性和不确定性，导致配电网频繁发生电压波动[2]。电压/无功控制（VVC）通过控制无功功率输出来实现缓解电压波动并降低功率损耗的目的[3],
    4]。对于分布式资源的控制，例如光伏逆变器为 VVC 的实现提供了新手段[5], 6]。


    对于分布式资源的 VVC，已经提出了多种方法。从控制方法的角度来看，它们分为三类：集中控制、局部控制和分布式控制[7], 8)。集中控制需要中心协调器和系统来进行信息存储、通信和交互[9],
    10]。然而，配电网设施相对落后，网络运营商不具备全局通信优势。所需的计算量巨大，特别是在可再生能源高渗透的情况下，难以实现配电网的最优实时控制[11]。局部控制根据本地信息做出决策，对配电网通信没有高要求。同时，局部控制面临通信延迟和数据延迟[12],
    13)。虽然局部控制可以将电压调节在合理范围内，但由于局部智能体之间缺乏协调，设备的电压调节能力无法充分利用。与集中方法相比，分布式控制在减少、鲁棒性和扩展性增强方面并没有获得更好的结果。控制控制可以通过算法实现，利用本地信息和通信来提高网络性能。


    集中控制和分布式控制具有全局最优搜索的能力，但根据计算和通信缓冲，它们放弃了实时响应速度[16–18]。基于模型的控制方法通常需要精确且全面的配电网参数，这对于低电压配电网可能难以实现[19,20]，基于无功功率和节点电压的动态特性。换句话说，它遵循电力系统运行的物理定律。对于配电网的
    VVC，基于模型的方法可以通过可再生 VVC 下垂控制来实现。


    本文提出的方法与已用于配电网 VVC 的基于模型的方法不同，后者引起了大量关注[27–21]。强化学习（DRL）是一种数据驱动的方法，基于马尔可夫游戏。DRL
    生成器通过在线训练实现，并与训练良好的神经网络（DNNs）相结合。决策可以在毫秒内确定。换句话说，DRL 可以以高最优搜索进行实时操作。因此，DRL 方法可以在不变化的情况下优化配电网的运行。事实上，了一种多智能体强化学习（MADRL）方法来优化静态变动
    $Q$ 无功功率以管理节点负载，该方法可以去中心化并独立执行。参考文献[24]。


    在本文中，多智能体强化学习（MADRL）方法被实现为模型和控制。下垂参数通过 MADRL 进行优化，实现了配电网的最优实时 VVC。主要贡献如下：


    - 提出了一种 ORT-VVC 方法来缓解电压波动并减少功率损耗。ORT-VVC 通过模型和控制实现。PAC-DRL 方法与 Q-V 下垂控制结合实现，结合了电压与无功之间的关系以及
    MADRL 对高可再生能源配电网的最优搜索和在线能力。

    - 提出了一种新型惩罚函数以提高训练期间的收敛速度。特定的定义函数被线性惩罚函数取代，该函数在一个回合（episode）训练结束时等于 0。通过这种方法，回合发生更频繁，收敛速度将降低。


    论文的其余部分结构如下：第2节是在分布式划分中实现的 ORT-VVC 方案。第3节描述了 Q-V 下垂模型和 ORT-VVC 模型。第4节将 ORT-VVC
    模型表述为基于部分可观测马尔可夫过程（POMG）的 DC-DRL 问题，并给出基于 MADPG 算法的求解过程。第5节给出了文中所示的案例研究。


