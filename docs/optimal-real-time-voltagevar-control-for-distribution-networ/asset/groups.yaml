    # ARTICLE INFO


    Keywords:


    - Distributed voltage/var control

    - Q-var drop control

    - Multi-agent deep reinforcement learning


    # ABSTRACT


    The photovoltaics (PVs) as clean power generation has been highly penetrated in
    distribution networks, which motivates the network towards highly complex operation
    status. In this paper, an optimal real-time Voltage/Var control (ORT-VVC) is proposed
    to reduce power losses and mitigate fluctuations by regulating the reactive power
    of the PV inverters. The ORT-VVC proposed using drop-based multi-agent reinforcement
    learning (DC-MARL) is established. The structure is constructed in distribution
    network with network partition and the multi-agents. Then, the control model is
    formulated as a Q-var drop function with parameters, to optimize the control parameters
    instead of minimizing reactive power output directly, which aims to improve the
    real-time VVC performance for distribution network. The DC-MARL model is established
    and numerical simulations are performed on the IEEE 123-bus test system to demonstrate
    the effectiveness of the proposed method.


    # 1. Introduction


    The distribution network develops towards a active pattern with increasing penetration
    of renewable energy sources (RES) [1], which is environment friendly. According
    to the international energy agency, the grid capacity will increase nearly twice
    from 2022 to 2027. The penetration of renewable energy like wind and turbine (WT)
    is increasingly intermittent and uncertain, which leads to frequent voltage fluctuations
    in distribution network [2]. The Voltage/Var control (VVC) is realized by controlling
    reactive power output to mitigate voltage fluctuations and reduce power losses
    of level [3], 4]. As for the control of distributed resources, e.g., PV inverters
    provide new means for VVC implementation [5], 6].


    For the VVC of distributed resources, various methods have been proposed. From
    the point of view of control method, they fall into three categories: centralized
    control, local control, and distributed control [7], 8). The centralized control
    requires a central coordinator and system for information storage, communication,
    and interaction [9], 10]. However, the distribution network facilities are relatively
    backward, and the network operator doesn''t have the benefit of global communication.
    The required calculation amount is large, it is difficult to realize the optimal
    real-time control for distribution network especially with the high-penetration
    of RES [11]. The local control can make decisions based on local information and
    does not have high requirements for communication in the distribution network.
    Meanwhile, the local control faces communication delays and data delays [12],
    13). It is true that the local control can regulate the voltage within a reasonable
    range, but without coordination between local agents, the voltage regulation capability
    of the devices cannot be fully utilized. The distributed control doesn''t achieve
    a better result in terms of reduction, robustness and scalability enhancement,
    compared with the centralized methods. The distributed control can be realized
    by the distributed algorithm, which utilizes the local information and communication
    to improve the performance of the network.


    centralized and distributed control has the ability in global optimum searching,
    but they deny the real-time response speed according to the computation and communication
    buffers [16–18]. Model-based control methods often require precise and comprehensive
    distribution network parameters, which may be difficult to for low voltage distribution
    network [19,20] is based on the dynamic characteristic of reactive power and node
    voltage. In other words, it follows the physical law of power system operation.
    As for the VVC of the distribution network, the model-based method can be realized
    with renewable VVC droop control.


    The method proposed in this paper is different from the model-based method which
    has been used in VVC of distribution network and attracts lots of attention [27–21].
    The reinforcement learning (DRL) is a data-driven method, that is based on the
    Markov Game. The DRL generator is realized through online training and combines
    with well-trained neural networks (DNNs). The decisions can be determined in milliseconds.
    In other words, the DRL can act in real-time with high optimum searching. Thus,
    the DRL method can optimize the operation of distribution network without variation.
    In fact, a multi-agent reinforcement learning (MADRL) method is proposed to optimize
    the static variance $Q$ reactive power for managing the bus loads, which can be
    decentralized and executed independently. Ref [24]


    In this paper, the multi-agent reinforcement learning (MADRL) method is implemented
    as a model and control. The droop parameters are optimized by the MADRL, realizing
    the optimal real-time VVC for distribution network. The main contributions are
    as follows:


    - An ORT-VVC method is proposed to mitigate voltage fluctuation and reduce power
    losses. The ORT-VVC is implemented via a model and control. The PAC-DRL method
    is implemented together with the Q-V droop control, the relationship between voltage
    and reactive power with the optimum searching and online ability of MADRL for
    distribution network with high penetration of RES.

    - A novelty penalty function is proposed to improve convergence rate during training.
    The particular define function is replaced by a linear penalty function which
    equals 0 when the training time of one episode is finished. With this method,
    the episode occurs more frequently and the convergence rate will be reduced.


    The reminder of the paper is organized as follows. Section 2 it the ORT-VVC scheme
    which is implemented in a distributed partition. In section 3, the Q-V droop model
    and the ORT-VVC model are described. In section 4, the ORT-VVC model is formulated
    to a DC-DRL problem based on a partially observable Markov process (POMG) and
    the solution process based on MADPG algorithm. Section 5 gives the case study
    drawn in section.


