    # Optimal real-time Voltage/Var control for distribution network: Drop-based multi-agent
    deep reinforcement learning


    Peishui Li$^{a}$, Jia Shen$^{b}$, Zijun Wu$^{b}$, Minghui Yin$^{a}$, Yanhao Dong$^{b}$,
    Jing Han$^{a}$


    +   $a$ Nanjing University of Science & Technology, No. 200, Xiaoliangwei Street,
    Nanjing 210094, China

    $b$ Southeast University, No. 2, Siupiao Street, Nanjing 210060, China


    # ARTICLE INFO


    Keywords:


    +   Distributed voltage/var control

    Q-var drop control

    Multi-agent deep reinforcement learning


    # ABSTRACT


    The photovoltaics (PVs) as clean power generation has been highly penetrated in
    distribution networks, which motivates the network towards highly complex operation
    status. In this paper, an optimal real-time Voltage/Var control (ORT-VVC) is proposed
    to reduce power losses and mitigate fluctuations by regulating the reactive power
    of the PV inverters. The ORT-VVC proposed using drop-based multi-agent reinforcement
    learning (DC-MARL) is established. The structure is constructed in distribution
    network with network partition and the multi-agents. Then, the control model is
    formulated as a Q-var drop function with parameters, to optimize the control parameters
    instead of minimizing reactive power output directly, which aims to improve the
    real-time VVC performance for distribution network. The DC-MARL model is established
    and numerical simulations are performed on the IEEE 123-bus test system to demonstrate
    the effectiveness of the proposed method.


    # 1. Introduction


    The distribution network develops towards a active pattern with increasing penetration
    of renewable energy sources (RES) [1], which is environment friendly. According
    to the international energy agency, the grid capacity will increase nearly twice
    from 2022 to 2027. The penetration of renewable energy like wind and turbine (WT)
    is increasingly intermittent and uncertain, which leads to frequent voltage fluctuations
    in distribution network [2]. The Voltage/Var control (VVC) is realized by controlling
    reactive power output to mitigate voltage fluctuations and reduce power losses
    of level [3], 4]. As for the control of distributed resources, e.g., PV inverters
    provide new means for VVC implementation [5], 6].


    For the VVC of distributed resources, various methods have been proposed. From
    the point of view of control method, they fall into three categories: centralized
    control, local control, and distributed control [7], 8). The centralized control
    requires a central coordinator and system for information storage, communication,
    and interaction [9], 10]. However, the distribution network facilities are relatively
    backward, and the network operator


    doesn''t have the benefit of global communication. The required calculation amount
    is large, it is difficult to realize the optimal real-time control for distribution
    network especially with the high-penetration of RES [11]. The local control can
    make decisions based on local information and does not have high requirements
    for communication in the distribution network. Meanwhile, the local control faces
    communication delays and data delays [12], 13). It is true that the local control
    can regulate the voltage within a reasonable range, but without coordination between
    local agents, the voltage regulation capability of the devices cannot be fully
    utilized. The distributed control doesn''t achieve a better result in terms of
    reduction, robustness and scalability enhancement, compared with the centralized
    methods. The distributed control can be realized by the distributed algorithm,
    which utilizes the local information and communication to improve the performance
    of the network.


