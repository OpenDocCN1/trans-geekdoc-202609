    ## 5.3. DC-MADRL 在线测试性能


    通过利用 MADRL，智能体在训练过程中共享评价网络（critic network）并通过其执行网络（actor network）选择动作；在执行期间，每个智能体根据局部观测和经过训练的执行网络确定最佳动作。训练完成后，通过测试数据验证
    DC-MADRL 的性能。测试集通过 120/480 个场景的随机样本构建，然后剩余的 360 个场景用于训练。所提 DC-MADRL 的在线决策速度为 19.63ms，这意味着它满足了实时
    VCC 的要求。


    为了验证所提方法与传统 Q-V 下降控制（QVDTC）（28）相比的有效性，构建了下降控制单代理深度强化学习（DC-SAD）。TVQDC 具有固定的下降曲线和参数，无法自适应变化的环境。所提方法是完全数据驱动的，因此更容易与数据驱动方法进行比较。使用
    DC-SAD 来验证所提分布式 VCC 方案的准确性，因为 DC-SAD 与 DC 之间的唯一区别是分布式方法。然后，这四种方法的在线测试性能的比较结果如表
    2 所示。


    如图 8 所示，所提强化算法比采用不同的惩罚函数具有更好的收敛性能。在所提线性惩罚函数的训练过程中，与二次函数相比，收敛速度提高了 42%。在使用线性惩罚函数时，DC-MADRL
    的训练过程如图 9 所示。如图 9 所示，分布式网络的值被调节在允许范围 (0.95, 1.03) 内。然而，在经过 2360 次迭代训练后，功率损也收敛到了
    0.008。因此，如图 8 和图 9 所示，所提方法已通过所提线性惩罚函数收敛。


    从表 2 可以看出，基于模型的 TVQDC 与数据驱动方法相比，其功率损的减少程度比数据驱动方法更多，这是由于 TVQDC 的 DC-MADRAL 与 TDVC
    相比平均水平为 1.0pu，这也能比后者产生得多的损耗，因为它包含了数据驱动模型的结合，并在减少损耗方面具有更好的能力。对于 DC-SAD 和 DC-MADRAL，两种方法的平均值和功率损几乎相同，这具有分布式优化的高准确性，表明所提方法可以及时调节电压并有效降低配电网的功率损。


