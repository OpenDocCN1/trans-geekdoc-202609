    Fig. 3. Simplified network.


    # 2. Real-time VVC scheme


    The paper proposes a ORT-VVC scheme to reduce loss with mitigating voltage fluctuations
    for distribution network as shown in Fig. 1. The proposed scheme is superior in
    its real-time response and high global optimization ability, which is integrated
    in an “off-line training, online execution” process. Moreover, the proposed scheme
    is applicable to distribution network framework which can be decomposed into several
    sub-networks of which is ruled by an agent. Each agent can communicate with its
    adjacent agents and determine strategies for network stability.


    With consideration of time, the ORT-VVC scheme is implemented by the hierarchical
    coordination system to operate the “minutes-level dispatch” strategy and the dynamic
    load procedure. For the static procedure, each agent collects the information
    of network topology, resources, device installations, etc., then then optimizes
    the controlling parameters of the Q-V droop group. For the dynamic procedure,
    the reactive output is determined based on the real-time operation status.


    The scheme is realized via the MADPG method which the multiple agents are based
    on deep neural network (DNN). Moreover the DNN is trained through the offline
    training stage, and then employed in the online execution stage to determine the
    reactive power according to the real-time system constraints. During the procedure,
    the input includes the PV active power demand, load consumption, voltage within
    the network and also the load transmitted from its agents. For the executions,
    the optimized Q-droop control model and the system status variables, such as PV
    active power and the load, then the output is the reactive power setting.


    At the start of the dispatch, such as 15 minutes, the one agent will control the
    parameters to each PV inverter and there find no more information communication
    between PVs and


    # 3. Q-V droop control based ORT-VVC


    # 3.1. Q-V droop model


    The Q-droop control models are shown in Fig. 2 Fig(a) represents the proposed
    adjustable Q-V droop. As shown in Fig. (3)(a), the Q-droop curve is not activated
    and there exists a dead zone as $[V_l, V_h]$ where the reactive power is only
    generated when the voltage is beyond the dead zone $[V_l, V_h]$ in the traditional
    method. Moreover, the controlling parameters are shown in Fig. 2(b), where the
    Q-slope is set as 1.0, and would not be regulated during the operation period.
    Thus, a more flexible Q-V droop control method parameters are adjustable while
    the mathematical model is shown as:


    ```

    $Q_{i}^{max} - \alpha_{i}(V_{i} - V_{ref}) \geq Q_{i} \geq Q_{i}^{min}$

    $- \alpha_{i}(V_{i} - V_{ref}) \geq Q_{i}, \quad i \in N^{PV}$

    ```


    $\alpha = \alpha_{i,s}$


    ```

    $(V_{i})^{2} + (Q_{i})^{2} \leq (x_{i})^{2}, \quad i \in N^{PV}$

    ```


