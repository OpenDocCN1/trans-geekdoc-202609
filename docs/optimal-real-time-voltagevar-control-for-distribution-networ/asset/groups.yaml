    ## 4.2. 暴力惩罚奖励函数


    在过程中，在一个回合（episode）中可能会某些情况，提出了一种暴力惩罚奖励函数以改进收敛并减少解决方案的失败。具体而言，由于未满足操作约束，训练回合可能会终止，导致收敛过程未完成。为了解决这一问题，所示并提出的暴力惩罚奖励函数如下：


    ```

    $r_t = -f_t + \lambda R_t$

    ```


    ```

    $$\begin{cases} t_t \in [0, t_{max}] \ R_t \in [0, R_{max}] \ f_t = \sum_{i=0}^{t_{max}}
    \gamma^i (f_{t+i} + \eta_{t+i}) \end{cases}$$

    ```


    $r_t$ 显示智能体 $m$ 的奖励函数，$f_t$ 是一个正数，其值远大于 (12) 中获得的奖励。$t_t$ 显示发生终止前的显示时间和训练持续时间，$t_{max}$
    表示一个回合的槽位。通过这种暴力设计，默认惩罚常数由线性函数定义。奖励被定义为回合持续时间的函数，在回合结束时为 0。需要注意的是，当未发生终止时，$t_{max}$
    等于 0，因此奖励值将不会固定。使用这种提出的惩罚函数，智能体 $m$ 的总奖励所示：


    ```

    $R_m = r_t$

    ```


    ## 4.3. MADDPG 算法


    在本文中通过图 4 所示的 MADDPG 结构求解 MADDPG 模型，因为每个智能体都由一个演员网络（actor network）和一个评论家网络（critic
    network）组成。同时，在演员和评论家网络中，都有两个结构和参数相同的深度神经网络（DNN），这两个 DNN 分别命名为评估网络和目标网络。通过状态值函数和策略算法的结合，演员网络通过调节
    DNN 的参数确定特定状态下的最优策略。评论家通过时序差的通信评估演员网络的的每个动作。


    对于 MADDPG 策略，有 M 个智能体，其策略表示为 $\pi = (\pi_1, \dots, \pi_M)$，而参数由 $\theta = (\theta_1,
    \dots, \theta_M)$ 定义。在 DNN 训练期间，梯度可以表示为：


    ```

    $\nabla_{\theta_i} J(\theta) = \mathbb{E} [\nabla_{\theta_i} \log \pi_i(a_i|s_i)
    Q_i(s, a_1, \dots, a_M)]$

    ```


    其中，$a = (a_1, \dots, a_M)$，$Q_i(s, a)$ 是输入为动作和环境信息 $s$ 的状态值函数。此外，优化确定性策略以加速收敛并提高效率，智能体
    $m$ 的梯度可以描述为：


    ```

    $L(\theta) = \mathbb{E} [(Q(s, a) - y)^2]$

    ```


    其中，$\mu$ 代表参数为 $\theta^-$ 的策略函数，经验回放缓冲区存储元组 $(s, a, r)$，$r = (R_1, \dots, R_M)$。智能体的样本将通过经验回放缓冲区进行训练。在智能体与环境交互过程中，评论家网络的损失函数为：


    ```

    $y = R + \gamma Q(s'', \mu_1(s''), \dots, \mu_M(s''))$

    ```


    其中，$\mu$ 定义为目标策略集，$\mu_{in}$ 显示参数为 $\theta_{in}$ 的目标策略，指示下一个目标状态动作值函数。通过训练过程，评论家网络的参数更新如下。对于目标网络，根据评估网络更新参数。


