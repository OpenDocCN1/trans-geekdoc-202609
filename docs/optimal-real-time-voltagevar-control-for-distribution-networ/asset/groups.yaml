    ### 3.2. ORC-VTC 模型


    带有光伏的简化配电网如图 3 所示，基于此建立了配电网模型。对于由 $m$ 控制的配电网模型，$B_m$ 和 $M_m$ 分别代表分支和节点。对于分支 $ij，$r_{ij}$
    和 $x_{ij}$ 代表电阻和电抗，$P_{ij}$ 和 $Q_{ij}$ 代表有功和无功功率。$P_i$ 和 $Q_i$ 分别代表节点的有功和无功功率，$P_i^m$
    和 $Q_i^m$ 表示子网络 $m$ 的有功和无功功率，$V_i$ 表示电压幅。配电网的功率模型构建如下：


    $p_i = -V_i\sum_{j\in\mathcal{N}_i} V_j(r_{ij}\cos\theta_{ij} + x_{ij}\sin\theta_{ij})
    + Q_i\sum_{j\in\mathcal{N}_i} V_j(x_{ij}\cos\theta_{ij} - r_{ij}\sin\theta_{ij})$

    $q_i = -V_i\sum_{j\in\mathcal{N}_i} V_j(x_{ij}\cos\theta_{ij} - r_{ij}\sin\theta_{ij})
    - P_i\sum_{j\in\mathcal{N}_i} V_j(r_{ij}\sin\theta_{ij} + x_{ij}\cos\theta_{ij})$

    $p_i^m = Re\left(\frac{(V_i - V_m)^*}{Z_{im}}\right)$

    $q_i^m = Im\left(\frac{(V_i - V_m)^*}{Z_{im}}\right)$


    其中 $N_j \in\mathcal{B}_m$ 是节点集，$\theta_{ij}$ 是节点 $i$ 与 $j$ 之间的相位差，$g_{ij}$ 和 $b_{ij}$
    代表分支的电导和电纳。


    本文中，ORC-VTC 模型通过控制逆变器的无功功率来减少损失，损失惩罚所示：


    $p_{loss}^m = \sum_{i\in\mathcal{N}_i} (V_i - V_m)^2,(5)$


    在配电网正常运行期间，电压水平应在允许范围内调整，电压越限惩罚设置为：


    $q_{loss}^m = \sum_{i\in\mathcal{N}_i} (V_i - V_m)^2,(6)$


    结合约束和下垂模型，子网络 $m$ 建立为：


    $\min \sum_{i\in\mathcal{N}_i} (p_{loss}^m + \lambda q_{loss}^m),(7)$


    约束条件为 (1)-(4)，


    $p_{ij}^{m,max} = \sqrt{(V_{ij}^m)^2 - (q_{ij}^m)^2}, i\in\mathcal{N}^m(8)$


    $q_{ij}^{m,max} = \sqrt{(V_{ij}^m)^2 - (p_{ij}^m)^2},(9)$


    ## 4. 深度强化学习表述


    ### 4.1. 部分可观测马尔可夫游戏表述


    本文将 ORC-VTC 模型重构为部分可观测马尔可夫游戏（POMG），解决了马尔可夫决策过程中固有的优先级问题 [29]。


    在该表述中，每个子网络的控制器被建模为与环境交互的代理体。由于 POMG 在在不完全层上运行，底层状态可以受到 POMG 的保护。观测空间 $\mathcal{O}_1,
    \dots, \mathcal{O}_m$ 和动作空间 $\mathcal{A}_1, \dots, \mathcal{A}_m$ 为


    每个代理体内部执行动作 $a_i$，获得对应于观测 $o_i$ 的奖励 $r_i$。'
