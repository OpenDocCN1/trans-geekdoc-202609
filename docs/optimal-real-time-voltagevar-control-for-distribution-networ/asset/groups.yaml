    ## 2. 实时 VVC 方案


    本文提出了一种 ORT-VVC 方案，通过缓解配电网电压波动来减少损失，如图1所示。该方案在实时响应和高全局优化能力方面具有优势，并集成在“离线训练，在线执行”过程中。此外，该方案适用于配电网框架，该框架可以分解为若干子网络，每个子网络由一个代理体控制。每个代理体可以与其相邻的代理体通信并确定网络稳定的策略。


    考虑到时间因素，ORT-VVC 方案通过分级协调系统实现，以运行“分钟级调度”策略和动态负载程序。对于静态程序，每个代理体收集网络拓扑、资源、设备安装等信息，然后优化
    Q-V 下垂组的控制参数。对于动态程序，无功输出根据实时运行状态确定。


    该方案通过 MADPG 方法实现，其中多个代理体基于深度神经网络（DNN）。此外，DNN 通过离线训练阶段进行训练，然后在在线执行阶段被用于根据实时系统约束确定无功功率。在过程中，输入包括光伏（PV）有功功率需求、负载消耗、网内电压以及代理体传输的负载。在执行时，输入优化后的
    Q-下垂控制模型和系统状态变量（如光伏有功功率和负载），输出为无功功率设置。


    在调度开始（例如 15 分钟），一个代理体将控制每个光伏逆变器的参数，且光伏之间不再有更多的信息通信。


    ## 3. 基于 Q-V 下垂控制的 ORT-VVC


    ### 3.1. Q-V 下垂模型


    Q-下垂控制模型如图 2 所示。图(a) 表示所提出的可调 Q-V 下垂。如图 (3)(a) 所示，Q-下垂曲线未激活，且存在一个死区 $[V_l, V_h]$，在传统方法中，只有当电压超出死区
    $[V_l, V_h]$ 时才会产生无功功率。此外，控制参数如图 2(b) 所示，其中 Q 斜率设置为 1.0，且在运行期间不进行调节。因此，更灵活的 Q-V
    下垂控制方法参数是可以调节的，其数学模型所示所示：


    ```

    $Q_{i}^{max} - \alpha_{i}(V_{i} - V_{ref}) \geq Q_{i} \geq Q_{i}^{min}$

    $- \alpha_{i}(V_{i} - V_{ref}) \geq Q_{i}, \quad i \in N^{PV}$

    ```


    $\alpha = \alpha_{i,s}$


    ```

    $(V_{i})^{2} + (Q_{i})^{2} \leq (x_{i})^{2}, \quad i \in N^{PV}$

    ```


    $N^{PV}$ 是子网络中配备光伏的母线集。$V_{i}^{t}$ 和 $Q_{i}^{t}$ 分别代表节点 $i$ 在时刻 $t$ 的光伏有功功率、无功功率和容量。R_{i}^{max}$
    和 $Q_{i}^{max}$ 分别是最大和最小无功功率限制。V_{i}^{t}$ 是时刻 $t$ 连接到节点 $i$ 的光伏电压，即 Q-V 曲线与 x
    轴的交点，$V^{opt}$ 是最优下垂点。$R_{i}$ 是电压对无功功率的敏感度。


    公式实现了无功功率方案的动作规则，公式(2) 中的 Q-V 敏感性由节点数量和系统的 Q-V 敏感性决定。因此，Q-V 下垂模型包含了网络运行所需的必要信息。在本文中，通过可调下垂参数来确定配电网运行状态下
    Q-V 曲线的位置。如图 2(b) 所示，多个下垂曲线由若干候选 $V_{i}^{opt}$ 共同确定，构成了可行基准。


