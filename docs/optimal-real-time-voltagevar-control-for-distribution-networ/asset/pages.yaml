    # 3.2. ORC-VTC model


    The simplified distribution network with PV is shown in Fig. 3, based on which
    the distribution network model is established. For sub-network ruled by $m$, $B_m$
    and $M_m$ are utilized to represent the branch and node respectively. For branch
    $ij$ where $r_{ij}$ and $x_{ij}$ represent the resistance and reactance, $P_{ij}$
    and $Q_{ij}$ are the active and reactive power flow respectively. $P_i$ and $Q_i$
    are the active power, reactive power and current respectively for node $i$ where
    $P_i^m$ and $Q_i^m$ denote the active and reactive power injection of sub-network
    $m$. $V_i$ indicates the voltage magnitude. The power flow model of the distribution
    network can be constructed as:


    $p_i = -V_i\sum_{j\in\mathcal{N}_i} V_j(r_{ij}\cos\theta_{ij} + x_{ij}\sin\theta_{ij})
    + Q_i\sum_{j\in\mathcal{N}_i} V_j(x_{ij}\cos\theta_{ij} - r_{ij}\sin\theta_{ij})$$\nq_i
    = -V_i\sum_{j\in\mathcal{N}_i} V_j(x_{ij}\cos\theta_{ij} - r_{ij}\sin\theta_{ij})
    - P_i\sum_{j\in\mathcal{N}_i} V_j(r_{ij}\cos\theta_{ij} + x_{ij}\sin\theta_{ij})$


    $p_i^m = Re\left(\frac{(V_i - V_m)^*}{Z_{im}^*}\right)\nq_i^m = Im\left(\frac{(V_i
    - V_m)^*}{Z_{im}^*}\right)$


    Where, $N_j \in\mathcal{B}_m$ is the set of nodes connected to node $i$, $\theta_{ij}$
    is the phase difference between node $i$ and node $j$, $g_{ij}$ and $b_{ij}$ stands
    for the conductance and susceptance of branch $ij$.


    In this paper, the ORC-VTC model is established to reduce power losses via controlling
    the reactive power of inverters, the penalty for losses is shown as:


    $p_{loss}^m = \sum_{i\in\mathcal{N}_m} (V_i - V_m)^2, 0,(5)$


    During the normal operation of distribution network, the voltage level should
    be adjusted within the allowable scope, then the penalty for voltage out of limits
    is established as:


    $q_{loss}^m = \sum_{i\in\mathcal{N}_m} (V_i - V_m)^2, 0,(6)$


    With the constraints and droop control model established, the sub-network $m$
    is shown as,\n$\min \sum_{i\in\mathcal{N}_m} (p_{loss}^m + \lambda q_{loss}^m)^2,(7)$


    s.t. (1)-(4),


    $p_{ij}^{m,max} = \sqrt{(V_{ij}^m)^2 - (q_{ij}^m)^2}, i\in\mathcal{N}^m\quad(8)$


    $q_{ij}^{m,max} = \sqrt{(V_{ij}^m)^2 - (p_{ij}^m)^2},\quad(9)$


    Eq. (7) illustrates the objective function which aims to minimize the power losses
    with a penalty factor for the voltage constraints, meanwhile the penalty factor
    $\lambda$ is large enough to reduce the possibility of constraint violations.
    Eq. (8) shows the possible constraints for sub-network $m$ and eq. (9) illustrates
    the calculation for the minimal and maximal reactive power output of inverter.


    # 4. Deep reinforcement learning formulation


    # 4.1. Partially observable Markov game formulation


    In this paper, the ORC-VTC model can be reformulated into a partially observable
    Markov Game (POMG), which addresses the priority issues inherent in the Markov
    decision process [29].


    In this formulation, the controller of each sub-network is modeled as an agent
    that interacts with the environment. Since POMG operates only on an incomplete
    layer, the underlying state can then be protected by the POMG. The observation
    space $\mathcal{O}_1, \dots, \mathcal{O}_m$ and action space $\mathcal{A}_1, \dots,
    \mathcal{A}_m$ are


