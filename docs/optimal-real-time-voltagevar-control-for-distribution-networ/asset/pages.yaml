    Then, it can be concluded that DC-SAD and DC-MADRAL has better voltage regulation
    ability than MADRL, and that based on data-driven model, when the PV active power
    fluctuates, the integration of data and model will enhance the stability of VVC.
    Moreover, as shown in Fig. 10, the methods also produce lower power losses than
    the others, which shows the advantage of proposed method in power loss reduction.
    Although the DC-SAD and DC-MADRAL have similar performance in voltage regulation
    and power losses, the latter is better for its advantages in providing better
    stability, lower requirement in data and calculation resources, and high efficiency
    in large scale problem solving.


    # 6 Conclusion


    This paper proposes a DC-MADRAL for real-time VVC control of distribution networks.
    The UVC uses certain rules to reduce power losses and voltage fluctuation, in
    which PV inverters are connected in a distributed framework. Along with a Q-driven
    control model with variable parameters, the partially observed Markov decision
    model is employed to collect optimal strategy. Through various methods, the proposed
    approach combines model and data driven together for enhancing stability in the
    power system network.


