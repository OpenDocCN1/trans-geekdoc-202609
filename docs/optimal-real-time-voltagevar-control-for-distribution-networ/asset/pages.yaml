    with reward $r_i$ corresponding to the observation $o_i$ after taking the action.
    After all, the agent receives the reward and observations while it aims to maximize
    the expected state transition reward.


    is determined by the transition function $P(s''|s, a_1, \dots, a_m)$ which gives
    the probability of the next state occurring based on the current state $s$ and
    the actions taken. Each agent then receives


