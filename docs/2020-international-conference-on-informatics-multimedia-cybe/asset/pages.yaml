    4) Start voting and ending: The voting period is between the time when start voting
    and ending transactions are stored in the blockchain sequential order. During
    this period, the voter can use their voting right by sending their vote to the
    blockchain. The smart contract includes a voting status indicator to allow a voter
    in giving her.


    The smart contract consists of two data structures that are used to store the
    voter''s name and a voter''s choice respectively. It also includes a enum structure
    to indicate voting status, created, voted and ended. Furthermore, the proposal
    is created (see II-A). Finally, it lists the functions implemented in it, including
    the rules that governs all transactions in the e-voting system, only allows voters
    to vote between the start and end of voting period. Due to space limitation, the
    detail of smart contract can be retrieved from the Router Ethereum address as
    shown in Fig. 2 or 3.


    # B. Voter


    In general a any anyone who has used an Ethereum account. However, a voter must
    be registered by the ballot manager to be able to vote using her right in the
    e-voting system, as explained previously. Registering a voter means that her address
    is registered to the proposal defined in the smart contract.


    During the voting period, a voter can give her vote means sending a transaction
    to the smart contract address as well as her choice or to the blockchain network.


    Both ballot and voter DApps are implemented as simple web applications in Javascript.
    A Javascript library is employed to simplify the interaction of both DApps with
    Ethereum. The between web3 powered DApp and smart contract is possible through
    API which is in JSON format. The execution of smart contract is done by Ethereum
    Virtual Machine (EVM).


    During the voting period, a voter can give her vote means sending a transaction
    to the smart contract address as well as her choice or to the blockchain network.


    Any voter who already voted is not able to vote once, to satisfy the man one vote
    proposal. Therefore specific identifier is required to indicate whether a registered
    address has voted or not. Furthermore, votes from all registered voters during
    this period are accumulated and to get the final result.


    # B. Ballot manager and Voter DApps


    # C. Metamask


    The proposed solution also includes a meta-transaction component as Metamask².
    As metamask meta-transaction implementation, provides convenience for both users
    and developers. However, it hides the complexity of interacting with Ethereum,
    such as creating an account, manage key and wallet. Likewise, the developer only
    needs to interact with the globally available Ethereum Application Programming
    Interface (API). On top of that, a DApp can start the connection to Ethereum network
    without synchronizing a full node, as through Ethereum node, such as Infura¹


    # III. PROTOTYPE IMPLEMENTATION


    # A. Smart contract


    The smart contract is written in Solidity language⁴ and then the code is compiled
    into bytecode and Application Binary Interface (ABI) using Remix Integrated Development
    Environment (IDE)⁵. The bytecode version is then deployed into the Ethereum blockchain
    network, while ABI is used by the DApp to interact with the smart contract. The
    Rosten Ethereum test network⁶ is used to deploy the smart contract as well as
    to execute all the transactions done by our e-voting prototype system.


    For testing purpose, a simple example of yes or no proposal is implemented in
    the smart contract of the e-voting prototype.


