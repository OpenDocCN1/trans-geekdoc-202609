    **Abstract—**The implementation of electronic voting (e-voting system) has been
    widely applied in traditional electoral systems, still has a major problem in
    the level of trust results. E-voting systems are very vulnerable to manipulation
    attacks, such as changes in election results due to backdoors and hacking. In
    a network result where data comes from one party having the right to store and
    manage data stores, the issue of trust can be overcome by spreading data in a
    system network. Blockchain is a distributed ledger, where every party in the network
    has known anonymity which is very suitable for e-voting. This research proposed
    a blockchain based e-voting system with Ethereum and smart contracts to ensure
    the transparency of the election process.

    of eligible voters counted and published by the commission of general election.
    Similar approach may also be used in other traditional election. There are many
    potential frauds in traditional methods such as fake national ID card, invalid
    list of voters, ballot papers that are allowed to use by every candidate, and
    the election of reputation.

    E-voting system is implemented to improve many drawbacks in traditional voting
    method. It refers to the adoption of technology that replaces the ballot system
    to record the election results by counting online, offline or digital TV. The
    internet e-voting clearly requires internet connection, non-internet voting may
    use other electronic devices such as mobile phone, laptop or computer. The major
    advantage of e-voting to traditional voting system is that it brings faster count,
    process less load, and can prevent secret ballot papers, but there are still issues
    to resolve the e-voting system.


    *Index Terms—*Electronic voting, blockchain, smart contract, e-voting


    # I. INTRODUCTION


    According to ordinary definition, election is defined as the process of choosing
    a person or group of people for a position, especially political position, by
    voting. In general, public election system is used as a parameter of successful
    democracy in nation scale, and even in a scale such as institution. A democratic
    election has been widely implemented in many countries, including Indonesia, USA,
    and Canada. In a smaller scale, an election has also been implemented in the election
    of leader, or head of student in schools or universities.

    The voting process in the election system may adopt many various methods, such
    as the traditional one as well as the electronic voting (e-voting). A traditional
    voting method is based on ballot paper and voting to collect all ballot papers.
    In Indonesian general election, the voters are authenticated by their national
    ID card and


    > https://www.oxforddictionaries.com/definition/english/election


    According to Cory [3], there are basic principles of an election system, secret
    ballot, one man one voter, voting, votes accurately recorded and counted. In the
    other hand, a secret ballot prevents vote buying and direct (indirect), or general,
    free, confidential and fair, can also be applied to e-voting principles. Following
    these principles, a correctly implemented e-voting system can improve ballot security,
    speed up the counting of election results (it is more efficient and gain trust
    in the process process [4].


    Blockchain, as a technology that provides transparency in a transaction without
    losing security, is to be the solution for existing issues in e-voting. Blockchain
    is a distributed ledger, managed by nodes without centralized authority through
    a distributed cryptographic graph. This shows that blockchain removes the need
    of centralized third party to validate a transaction, just like removing bank
    in money transfer. By eliminating a third party to validate a transaction, blockchain
    provides key characteristics to maintain trust in a transaction, namely immutable
    ledger, secure, shared and distributed [7]. With blockchain is a good solution
    in e-voting'
