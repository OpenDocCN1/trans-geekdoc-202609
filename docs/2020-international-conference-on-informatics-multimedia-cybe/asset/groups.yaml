    [3]。


    当网络流量超出 CIA（机密性、完整性和可用性）三个安全层面的范畴时，区块链投票系统确保了完整性和合法性。


    完整性取决于区块链的不可篡改性，记录在区块链中的记录无法更改。同时，可用性可以通过分布式和公共的以太坊网络投票来确保。对于记录在区块链中的信息的机密性，很大程度上取决于智能合约。防止投票被暴露的一种方法是：


