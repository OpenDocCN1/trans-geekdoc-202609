    # 基于 Ethereum 和 Metamask 的电子投票系统实现与评估


    Deni Pramulia

    计算机科学系

    印度尼西亚大学

    Depok，印度尼西亚

    Email deni.pramulia@ui.ac.id


    Bayu Anggorojati

    计算机科学系

    印度尼西亚大学

    Depok，印度尼西亚

    Email bayu.anggorojati@cs.ui.ac.id


    **摘要—**电子投票（e-voting系统）的实施已广泛应用于传统选举系统中，但在结果的可信度方面存在存在问题。电子投票系统非常容易受到操纵攻击，例如由于后门和黑客攻击导致的选举结果更改。在数据来自一方有权存储和管理数据存储的网络中，信任问题可以通过在系统网络中传播数据来克服。区块链是一种分布式账本，网络中的每个方都具有已知的匿名性，非常适合电子投票。本研究提出了一种基于以太坊和智能合约的电子投票系统，以确保选举过程的透明度。


    由选举委员会统计并公布的合格选民人数。类似的方法也可用于其他传统选举。传统方法存在许多潜在的欺诈行为，例如伪造身份证、无效选民名单、允许每位候选人使用的选票以及选举声誉。


    电子投票系统的实施是为了改进传统投票方法的许多缺点。它指的是采用技术来取代选票系统，通过在线、离线或数字电视计数来记录选举结果。互联网电子投票显然需要连接互联网，非互联网投票可以使用其他电子设备，如手机、笔记本电脑或电脑。电子投票相比于传统投票系统的主要优势是计票更快、处理负载更小，并且可以防止秘密投票纸，但电子投票系统仍有待解决的问题。


    *术语—*电子投票，区块链，智能合约，电子投票


    # I. 引言


    根据普通定义，选举是指通过投票为某个人或一组人选择某个职位（特别是政治职位）的过程。通常，公共选举系统被视为国家规模民主成功的标准，甚至适用于机构等规模。民主选举已在许多国家实施，包括印度尼西亚、美国和加拿大。在较小的规模上，选举也出现在学校或大学领袖或学生领选举中。


    选举系统中的投票过程可以采用许多不同的方法，例如传统方法以及电子投票（e-voting）。传统投票方法基于选票纸并通过投票收集所有选票。在印度尼西亚大选中，选民通过其身份证进行身份验证并


    > https://www.oxforddictionaries.com/definition/english/election


    根据 Cory [3] 的观点，选举系统具有基本原则：秘密投票、一人一票、投票、投票准确记录和计数。另一方面，秘密投票可以防止买票，而直接（间接）、或通用的、自由、保密和公平的原则也可以适用于电子投票原则。遵循这些原则，实施良好的电子投票系统可以提高选票安全性，加快选举结果的统计（它更高效并能赢得过程中的信任
    [4]）。


    区块链作为一种在不丢失安全性的情况下提供交易透明度的技术，是解决电子投票现有问题的解决方案。区块链是一种分布式账本，通过分布式加密图由没有中心化权威的节点管理。这表明区块链消除了对中心化第三方验证交易的需求，就像消除了货币转账中的银行一样。通过消除第三方验证交易，区块链提供了维护交易信任的关键特性，即不可篡改的账本、安全、共享和分布式
    [7]。由于以下若干优势，区块链是电子投票的良好解决方案，例如高可用性、完整性、正确性和可验证性 [8]。


    在本文中提出了一种基于以太坊区块链的电子投票系统。选择以太坊是因为它是用图灵完语言编写的（与比特币不同），并支持智能合约 [9]。此外，它受到许多社区的支持，包括供实验目的免费使用的以太坊测试网络。然而，对于以太坊区块链而言，以太坊的分布式应用程序（DApp）仍然具有挑战性，因为它要求用户能够管理自己的密钥，这对于只想投票的新手用户来说可能是一种负担。为此，需要元交易（meta-transaction）。元交易是用户和区块链之间中继交易的中间层。Metamask
    作为浏览器被用在所提的电子投票系统中。


    # II. 提出的解决方案


    根据 Cet [11] 的观点，电子投票系统涉及三个参与者，即选民、注册机构（roa）和计票机构（toa）。选民是有权投票的人。注册机构是确保注册选民只投一票的人或组织。计票机构是选举后收集选票的人或组织。在我们提的电子投票系统中，选民和注册机构都分别由选票管理器（Ballot
    Manager）和选民（Voter）代表，计票由智能合约自动执行。所提出的电子投票系统使用了智能合约和各种开发工具的可用性。我们的架构由两个系统组成，即选票管理器和选民。两者都通过浏览器形式的
    Metamask 以太坊元交易以太坊网络通信。图1说明了系统架构的高层及其主要数据流。


    ## A. 选票管理器 (Ballot manager)


    选票管理器在提出的电子投票系统中起着最重要的作用。它负责将智能合约部署到网络中、创建选民提议、添加选民并开始投票。选票管理器需要以以太坊账户的形式在区块链中执行所有任务。尽管名称如此，但它并不存储有关选票的信息，以满足秘密投票，且选民地址被存储在投票过程中
    [3]。只有名称通过智能合约运行，而进一步的信息作为私有修饰符实现。关于此问题的更多讨论将在 IV-C 节进行。选票管理器上所有功能的细节将在后续子节中解释。


    img/a05e37a4c89afcf770c87ff41b49ac58_1_0.png)


    - **部署智能合约：**

    在进行任何其他操作之前，必须将智能合约部署到区块链网络中。智能合约涉及所有必要的变量、数据结构、函数以及定义了电子投票机制如何工作的条件。智能合约的简要实现细节将在
    III 节进一步解释。


    - **创建选民提议：**

    通过早先部署的智能合约激活电子投票系统。需要注意的是，选民提议只能由选票管理器（即通过地址部署合约的人）创建。因此，身份与地址绑定。智能合约中包含一条特定规则：当创建选民提议时，它将与智能合约地址绑定。


    - **添加选民：**

    当选民提议创建后，选票管理器可以开始向系统添加或注册选民，这类似于每次选举中使用的方法，选民在行使投票权之前必须注册。此过程可以通过逐个添加选民或批量添加完成。第一种方案需要选票管理器承担额外工作，但更容易估计执行此交易的燃气费用（gas
    fee），对于选民来说则相反。添加选民对选票管理器更好，特别是当选民人数很多时，但很难估计涉及循环的交易燃气费用。

    '
