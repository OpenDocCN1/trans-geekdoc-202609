    In this paper, an Ethereum blockchain based e-voting system is proposed. Ethereum
    is chosen because it is written in a Turing-complete language, unlike Bitcoin,
    and supports smart contract [9]. Furthermore, it is supported by many communities,
    including Ethereum test network that are freely available for experimental purpose.
    However, with respect to the Ethereum blockchain, a Distributed Application (DApp)
    for Ethereum is still challenging because it requires users to be able to manage
    her own keys, which can be a burden for a novice user who only wants to vote.
    To this end, a meta-transaction is needed. Meta-transaction is a middle layer
    that relays a transaction between a user and the blockchain network. Metamask,
    as for web browser, is used in the proposed e-voting system.


    # II. PROPOSED SOLUTION


    According to Cetkin [11], e-voting system involves three actors, namely voter,
    registry authority (roa), and tallying authority (toa). Voter is someone who is
    eligible to vote in an election. Registry authority is someone or organization
    who is responsible to make sure that the registered voters give only one vote
    in an election. Tallying Authority is someone or organization who collects the
    ballots after the election. In our proposed e-voting system, both voter and registry
    authority are represented by Ballot Manager and Voter sub-systems, respectively
    tallying is performed automatically by the smart contract.


    The proposed e-voting system uses smart contract and the availability of various
    development tools. Our architecture consists of two systems, namely Ballot Manager
    and Voter. Both communicate to the Ethereum network through Metamask, an Ethereum
    meta-transaction implementation, in a form of browser add-on. Fig. 1 illustrates
    the high level of the system architecture and its main draw flow.


    # A. Ballot manager


    Ballot manager plays the most important role in the proposed e-voting system.
    It is responsible to deploy the smart contract into blockchain network, creating
    voter proposal, adding voters, and starting the vote. The ballot manager needs
    to perform all the tasks in the blockchain, as an Ethereum account in this case.
    Despite its name, it does not store information about ballot to satisfy secret
    ballot voter and voter address are stored in voting [3]. Only name works through
    smart contract, while further information is implemented as private modifiers.
    More discussion about this issue is carried out in section IV-C. Details of all
    functionalities on ballot manager will be explained in the next sub-sections.


    ![](img/a05e37a4c89afcf770c87ff41b49ac58_1_0.png)


    +   1) Deploy smart contract: Deploying smart contract into the blockchain network
    is necessary before any other actions. The smart contract involves all necessary
    variables, data structures and functions, conditions that define how the e-voting
    mechanism is to be. Brief implementation details of smart contract will be further
    explained in section III.


    +   2) Create voter proposal: Creating voter proposal activates the e-voting system
    by the smart contract that has been deployed earlier. It is important to note
    that the voter proposal can only be created by the ballot manager, the one who
    deployed it by address. Hence, the identity is tied to address. A specific rule
    is included in the smart contract: when the voter proposal is created, it will
    be bound with the smart contract''s address.


    +   3) Add voter: When the voter proposal is created, ballot manager can start
    adding or registering voters to the system, which blockchain is similar to the
    method used in every election voters are registered before they can give their
    voting right. This process can be done by by adding voter one by one or all in
    batch. The first option requires extra work for the ballot manager but it is easier
    to estimate the gas fee to execute this transaction, which opposite applies for
    voters. Adding voters is better for the ballot manager especially when there are
    many numbers of voters, but it is difficult to estimate gas fee to execute transaction
    involving loop.'
