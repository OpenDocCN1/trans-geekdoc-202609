    Both ballot and voter DApps are implemented as simple web applications in Javascript.
    A Javascript library is employed to simplify the interaction of both DApps with
    Ethereum. The between web3 powered DApp and smart contract is possible through
    API which is in JSON format. The execution of smart contract is done by Ethereum
    Virtual Machine (EVM).


    During the voting period, a voter can give her vote means sending a transaction
