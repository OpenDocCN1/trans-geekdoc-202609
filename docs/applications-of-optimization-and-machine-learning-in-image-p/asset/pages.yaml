  md: 'also the main concern related to electronic devices. With the help of an intrusion
    detection system, we can ensure security to some extent.


    +   • Ethics of Data: Informational privacy is a major issue for the design and
    implementation of H-IoT [25]. In both an ethical and a legal sense, health data
    is often seen as being highly sensitive. While confidentiality is essential to
    ensure that data cannot be linked to a specific person, the authors also contend
    that users should have complete control over their data and be able to track a
    third party every time.


    +   • Ethics of Practices: IOMT can restrict the evaluation of a patient’s state
    to a small number of easily quantifiable or measurable factors, which could lead
    to an excessively optimistic assessment of the technology’s impact. By utilizing
    technology, it is possible to restrict the exchanges that provide medical professionals
    access to such information. As a result, providers must take action to prevent
    this from happening and to guarantee that a trustworthy relationship is established
    between patient and caregiver. For instance, rather than completely replacing
    dialogue, monitoring may be used to start a conversation [26].


    +   • Ethics of Devices: Ethical considerations are challenging due to the variety
    of devices and application scenarios. Although technology can significantly improve
    healthcare, it also poses a threat to our expectation of personal and informational
    privacy because it makes it simple for outsiders to observe and assess the lives
    of users.


    +   • No Open Standards: Lack of open standards for users and device manufacturers
    also becomes a major issue for IoT in the healthcare domain.


    # 6.5.3 Economic Challenges


    +   • High Infrastructure and Resource Costs: For the implementation of IoT in
    smart healthcare, we need to maintain the balance between technical specifications
    and cost. Memory storage capacity, low power consumption and processing capacity
    are what we need to balance the cost and technical requirements [15].


    +   • Maintenance Cost: Since IoT-enabled devices use sensors to capture the data,
    sensors should be active persistently to fetch real-time data.'
