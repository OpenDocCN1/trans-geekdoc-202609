  md: 'Using PSO, a clustering technique can be developed that helps to reduce energy
    consumption in networks. These nodes have a much longer lifespan when selected
    by the PSO algorithm, which takes into account their remaining energy when selecting
    cluster heads (CHs) [11]. Particle swarm optimization has been applied to a routing
    protocol to reduce energy consumption. The authors explained how PSO can outperform
    the genetic algorithm when it comes to calculating cheaper energy paths [12].
    Furthermore, they have considered the deployment of nodes to maximize coverage.
    Using the PSO algorithm, they are able to increase coverage without increasing
    the number of nodes [13]. In [14], each node''s transmission power calculated
    using particle swarm optimization (PSO) to avoid establishing unconnected zones
    among sensor clusters. There is evidence that the proposed PSO algorithm is more
    energy efficient than the more usual use of nodes with only a single transmission
    power. Authors [15] proposed a game-theory-based adaptive power transmit control
    algorithm for IoT wireless sensor networks. Energy-Efficient Transmission Range
    Optimization Model for WSN-Based Internet of Things proposed in [16]. The Electrostatic
    Discharge Algorithm (ESDA) is a new algorithm that has been designed, implemented
    and utilized to reduce the amount of energy that a sensor node requires while
    simultaneously ensuring that each node is fully connected [17].


    From the literature survey, it is evident that seeking a better solution for this
    particular engineering optimization problem is still open for further research
    and that no such novel optimization algorithms were explored. This made us attempt
    to implement Smell Agent Optimization (SAO)-Based Butterfly Optimization (BO)
    algorithms to minimize energy consumptions by identifying the appropriate transmission
    power while simultaneously guaranteeing that the entire network is properly linked.
    To evaluate the savings in energy, a comparison will be made with other existing
    meta-heuristic optimization techniques from the literature.


    # 3.2 WIRELESS SENSOR NETWORKS


    # 3.2.1 Clustered WSNs


    Extending the life of a WSN network is made possible through the use of clustering.
    In clustered WSNs, most classic routing approaches are based on the premise that
    no obstacles exist [9]. Sensor networks (WSN) are becoming increasingly popular
    for a variety of purposes, including generating reports on factors such as temperature
    and humidity, as well as light and chemical activity. This trend is expected to
    continue in the future. Observers (such as base stations) collect the sensor data
    that is sent forth.'
