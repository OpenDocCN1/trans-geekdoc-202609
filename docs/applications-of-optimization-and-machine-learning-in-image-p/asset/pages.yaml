  md: "respectively. Here, the first row contains \\( t_p \\) and \\( f_n \\), while\
    \ the second row contains \\( f_p \\) and \\( t_n \\). The evaluation metrics\
    \ utilized in the performance analysis of the CNN model are often derived from\
    \ the confusion matrix. This chapter considers the following metrics based on\
    \ the requirement of the proposed work.\n\n+   1. **Accuracy (Acc)**: Acc provides\
    \ the proportion of correct predictions in the set of all predictions [47]. It\
    \ is defined as\n+   \n+   \\( CA = \\frac{t_p + t_n}{t_p + f_p + f_n + t_n} \\\
    )\n+   \n+   This metric generally fails to provide a good description of discrimination,\
    \ if one class has a very few samples while the other one has a very large number\
    \ of samples.\n\n+   2. **Recall (R)**: This gives the ratio of correctly classified\
    \ positive samples over the set of all positive samples [46]. It is also known\
    \ as sensitivity and is given as\n+   \n+   \\( R = \\frac{t_p}{t_p + f_n} \\\
    )\n+   \n+   It cannot be used to classify an overall proportion of true positives\
    \ in the set of all the correctly predicted samples.\n\n+   3. **Precision (P)**:\
    \ It calculates the proportion of correctly classified positives in the set of\
    \ all positively classified samples [46]. It is also called “positive predictive\
    \ value” (PPV). It is written as\n+   \n+   \\( P = \\frac{t_p}{t_p + f_p} \\\
    )\n+   \n+   It does not provide any information regarding the true positive proportion\
    \ in the class of positives.\n\n+   4. **F1-Score (F1)**: It is defined as the\
    \ harmonic mean of \\( R \\) and \\( P \\) [48]. The value of F1 can be small\
    \ or large according to whether \\( R \\) and \\( P \\) are both small or large.\
    \ It is denoted as\n+   \n+   \\( F1 = \\frac{t_p}{t_p + \\frac{1}{2}(f_n + f_p)}\
    \ \\)"
