    # 1.3 OPTIMIZATION PHASES


    The subdivided phases in the optimization model for model-based damage detection
    are elaborated in the following subsections, and the literature is studied.


    # 1.3.1 Phase 1: Data Collection and Damage Characterization


    Data collection taken for analysis is done by sensors optimally mounted on a steel
    bridge [4]. The collected data is wirelessly transmitted and archived into files,
    either onsite or offsite, using computer systems.


    # 1.3.2 Phase 2: Formulation of Problem


    An optimization problem is framed in terms of the objective function depicting
    the main objective of model, which is to be either maximized or minimized through
    the set of known or unknown variables controlling the outcomes of the objective
    function within a set of constraints, as shown in Figure 1.3.


    # 1.3.3 Phase 3: Development of Objective Features and Functions


    The objective features of a steel bridge are the extracted values from raw time
    domain data using methods such as mean values, maximum values, variances, frequency
    response functions, spectral densities, frequencies, mode shapes, etc. Based on
    the residual between measured responses from the steel bridge, numerical analysis
    is used to form an objective function to optimize the objective features. The
    inability to determine every instance of damage in different steel bridges in
    any particular domain is'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/9c1422d4c6a10143e1802787075307de_23_0.png)


    FIGURE 1.3 Working framework of the optimization problem.


    the major limitation of prevailing methods; hence more in-depth study in this
    domain is required to find suitable solutions for this problem.


    The time domain methods utilize the features of peak accelerations, temporal moments,
    root mean square (rms), mean, median, etc. to indicate the presence of damage
    in any constituent member of a structure. Askan et al. estimated the parameters
    by using the sensitivity-based approach with the direct input of time-history-based
    responses in model-based techniques [9]. Masri et al. proposed the use of time
    response data in the training and testing of neural networks for damage detection
    [10]. Lu and Liu used a model updating method based on sensitivity approach using
    time history responses of either bridge or vehicle acceleration [11].


    The frequency domain methods incorporate features based on observing the changes
    in amplitudes due to the shift in resonance or antiresonance of signal responses.
    The frequency response functions contain meaningful information related to natural
    frequencies of a structure [12, 13]. The structural responses gathered are the
    only measurements required for the transmissibility functions and preclude the
    need for measuring excitation input. Various studies have shown their remarkable
    damage sensitivity work. Zhou et al. and Kumar et al. studies show various damage
    indicators extracted from the frequency response functions of a structure such
    as transmissibility, frequency response function curvature, strain energy etc.
    [14, 15].


    The modal domain features provide direct and physically meaningful information
    about the structure that is easier to interpret than other domain features. The
    features showing damage sensitivity include natural eigenfrequencies, a modal
    assurance criterion based on mode shapes'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'and their derivatives [16], modal strain, modal strain energy [17], residual
    force vector, damping [18], dynamic flexibility matrix and combinations of these
    such as modal damping and strain energy computed distribution [19]. Modal curvatures
    are found to be useful when applied with response-based methods but fail to give
    meaningful results with a model-based approach.


    Time domain analysis gives suitable results with nonlinear responses of a structure
    and minimizes the data reduction that is the main reason for the loss of meaningful
    information from the data. Its limitation includes the time and effort required
    for computing time responses. Frequency domain analysis provides accurate damage
    information in a particular range of frequencies. Modal domain analysis requires
    only responses collected from the structure during its operational conditions
    without any need for excitation input measurement.


    # 1.3.4 Phase 4: Model Development, Validation and Performance Evaluation


    The model development phase in optimization procedure includes a mathematical
    description of the problem and objective function, the estimation of various input/output
    parameters, input variables and software development. This phase is iterative
    in nature, and unsatisfactory outcomes may result in returning to the optimization
    model definition and formulation phase. The model validation and performance evaluation
    are concerned with the checking of the optimization model as a whole. The selected
    parameters, opted assumptions for the functioning of the model, are validated
    in this phase. The fitting of measured data with respect to regression line is
    checked by R² value and root mean square error values. The optimized model performance
    is determined through mean square error values. The testing of parameters taken
    as inputs is done through sensitivity analysis. The iteration occurs in this phase
    too, and unsatisfactory results are sent back to the model definition and formulation
    phase.


    A sensitivity study is helpful in minimizing parameter space and in the selection
    of appropriate objective features from its property of determining the effect
    of input parameters on the output features of the considered structure. The sensitivity
    analysis can be performed locally or globally. A sensitivity analysis done locally
    deals with the introduction of model output to small input perturbations, whereas
    sensitivity analysis done globally deals with the study of variation of the global
    range of inputs. Global sensitivity analysis overcome the limitations of local
    sensitivity analysis'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'such as local variations, normality and linearity assumptions [20, 21]. A review
    of various global sensitivity analysis covering a wide range one at a time is
    based on sensitivity measures, differential sensitivity analysis and regression
    coefficients to the application of statistical tests. The effect of a change in
    the input variable on the model variance is determined using screening methods.
    The parameter spaces are used for designing experimental methods; if the parameter
    nonlinearity is increased, stochastic sampling strategies are preferred [22].
    Errors in the optimization model can be evaluated by any standard method such
    as R² value or root mean square error methods.


    # 1.3.5 Phase 5: Selection of Optimization Algorithms


    This is a machine learning technique that executes a study by comparing various
    solutions available in order to find the best alternative solution under the known
    constraints. The different optimization problems require different modeling approaches
    to obtain the desired optimum solutions, as shown in Figure 1.4. An optimization
    problem can be a single objective (e.g., finding an electrical car with minimum
    cost) or multi-objective (finding an electrical car with minimum cost and maximum
    comfort) oriented.


    # 1.3.5.1 Mathematical Programming Optimization Approaches


    Steel bridge optimization problems having a complex nature can be easily solved
    using mathematical programming, which involves going through its mathematical
    structure in order to determine appropriate optimization technique. The optimization
    with mathematical tools includes calculus, linear programming, calculus of variations,
    nonlinear programming, quadratic programming, geometric programming and dynamic
    integer programming. Masoumi and Akgul selected linear programming as the optimization
    method with probability and cost matrices as inputs to determine damaged steel
    bridges on the basis of priority in cost minimization [23]. Albayrak and Albayrak
    developed a mathematical model to justify the use of considered cross sections
    of steel members in a steel bridge with optimum minimum cost expenditure [24].
    Togan and Daloglu compared the genetic algorithm results with mathematical models
    such as sequential quadratic programming, sequential convex programming and evolution
    strategy to determine the minimum weight of a steel truss bridge under a moving
    load [25]. Assimi et al. studied a spatial steel truss structure using genetic
    programming to obtain optimal cross section and'
