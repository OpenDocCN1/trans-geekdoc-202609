    # 10.6 CONCLUSION AND FUTURE WORK


    This chapter proposed a novel CNN-based framework for fire prediction using the
    fractional order optical flow and the dynamic as well as static features of smoke.
    The dataset used for experiments contain a total of 16 fire-smoke and 19 non-smoke
    videos. The dynamic features are estimated as optical flow fields by making use
    of a variational model based on fraction derivative. The obtained optical flow
    fields are dense, robust and preserve the moving edges of smoke patterns. The
    static information is described in terms of smoke color content, which is used
    in forming a color-based binary mask. Utilizing these binary masks, the smoke
    active region is successfully segmented from color maps. The proposed CNN architecture
    has been trained and tested on color maps as well as image dataset. The estimated
    results are quite better than other existing models. The future scope involves
    the generalization of the proposed work in determining the fire-smoke fraction
    in a scene.


