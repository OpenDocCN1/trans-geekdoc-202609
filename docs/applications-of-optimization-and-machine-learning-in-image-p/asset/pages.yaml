    # 5.1 INTRODUCTION


    With the development and advancement of new technologies, contemporary electrical
    and electronic equipment, collectively known as e-products, is being discarded
    in massive amounts at regular intervals. On the one hand, this discarded equipment
    contains harmful and carcinogenic elements such as lead, nickel, cadmium and substances
    such as furans, halides etc. that present serious threats to human life and the
    environment. On the other hand, it hosts many precious metals such as gold, silver,
    platinum, palladium and valuable metals like copper, aluminum, iron etc., which
    are the main motivation factor to recycle the electronic waste. The recycling
    of e-waste gives the opportunity to recover theses valuable metals to put back
    them into their respective use and support the concept of a circular economy.


    The handling the electronic waste involving proper identification, segregation
    and disposal becomes significantly important in deciding the fate of electronic
    waste.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Before deep diving into understanding the scope and mechanism of the management
    of electronic waste using modern artificial intelligence techniques, let us understand
    the terms and concepts associated with them.


    “Electronic waste,” or “e-waste,” is a term that incorporates all kinds of electrical
    and electronic equipment and their parts that have been discarded after use. In
    other words, the electronic products that are nearing the end of their useful
    lives are collectively known as “e-waste.” Some examples of e-waste are discarded
    e-products, such as computer monitors, keyboards, printers, calculators, circuit
    boards, cathode ray tubes, memory chips, cords and cables, fans, etc. E-waste
    is one of the most rapidly growing waste streams in the world. According to e-waste
    collection reports, the total e-waste generated across the globe has reached over
    50 million tons. Just in 2019, the e-waste generated across the globe was approximately
    53.6 million tons [1]. It is predicted [2] that the global e-waste generation
    in 2030 will be 75 million tons and approximately 111million tons in the 2050.
    This ever growing waste stream cannot be ignored and calls for the utmost care
    in its handling and processing. E-waste is either sent for recycling or simply
    thrown into a landfill. The recycling rates are improving gradually but are still
    low in developing countries.


    A proper e-waste management system can contribute to minimize the landfill proportion.
    Various approaches are in practice to handle e-waste management.


    Processing e-waste involves three critical steps:


    +   1. Collection of E-Waste: This first step involves the collection of e-waste
    from households and industries. Further, the dumped waste is collected from bins
    by recycling units for processing.


    +   2. Preprocessing: The collected e-waste is segregated based on many factors
    such as remaining life, hazardousness and ability to be recycled. After segregation,
    the parts of the wastes are dismantled and shredded into pieces using hammer mills.
    This is the initial part of processing e-waste.


    +   3. End-Processing (Finishing): This stage involves further processing of metals
    and non-metals. Recyclable and materials that can be kept and used in other applications
    are kept and anything remaining is discarded.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'Due to poor collection rates, only 20% of e-waste is recycled, whereas 4% joins
    the residential waste stream. Seventy-six percent of e-waste is disposed of illegally,
    either in open air incineration or in land fill, which in either case is a hazardous
    practice for humankind and the environment. To maximize the disposal of e-waste
    in legal centers of processing, the collection rate is extremely important and
    depends on the tracking of the movement of e-waste.


    There are two approaches—producers’ responsibility and users’ responsibility—which
    are basically complementary to each other. In either case, the collection rate
    is dependent upon the active participation of both the producers and the users.
    The producers’ responsibility may be collective or individual. The producers’
    responsibility approach to take back the discarded electronic equipment started
    in Germany and the Scandinavian countries in the 1990s and became obligatory in
    most parts of the developed world. However, in developing countries, progress
    is slow. Hence a collective effort at all levels is crucial to bring back the
    discarded e-waste into the collection system. To make the efforts effective at
    the local level, e-waste collection facilities need to be established and monitored.


    The monitoring and tracking of the generation and management of such massive amounts
    of harmful waste become crucial and thus need the intervention of technologies
    such as the Internet of Things (IoT) to reduce the harmful impact of e-waste.


    # 5.2 INTERNET OF THINGS


    The “Internet of Things” is a term used for digitally connected smart devices
    that are linked with Internet connectivity, sensors and other hardware tools to
    exert control via the web. Billions of devices in everyday use, such as cars,
    smart watches and electrical appliances all comprised of computer chips and connected
    with high-bandwidth communication tools and sensors, collect data and respond
    intelligently to users [3].


    There are five major components of Internet of Things: (1) devices, (2) connectivity,
    (3) analytics and data management, (4) cloud and (5) user interface. These components
    together are responsible for the functioning of Internet of Things services.


    Devices that are comprised of sensors form the backbone of the Internet of Things
    system. Sensors detect all types of changes, including the most minute ones in
    the environment. The main purpose of sensors is to collect data from the surroundings.
    A wide range of sensors, such as temperature and humidity sensors, gyro sensors
    and wireless and Bluetooth sensors,'
  merge: -1
  img_proc: true
