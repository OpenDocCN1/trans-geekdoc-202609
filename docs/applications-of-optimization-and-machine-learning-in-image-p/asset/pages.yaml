    # 9.6 DATA AUGMENTATION


    A deep learning approach typically performs well when given a lot of data. In
    general, the algorithm will score higher the more data we feed it. As the volume
    of data increases, the deep learning model''s performance gets better. However,
    gathering a lot of data entails its own set of challenges. A deep learning network
    cannot ever be fed with an enormous amount of data. It is a approach for altering
    already existing photos to produce large data size for the ML model stage of training.
    In the other words, it is a method for extending the dataset that may be used
    to train deep learning models [50]. Different types of image augmentation method
    are as follow.


    +   1. Flipping: This method enables flipping the image either left to right or
    up to down to create the different images [51].


    +   2. Rotation: Rotation of particular images does not affect its properties.
    So, in image augmentation, images are rotated at different angles to create multiple
    sets of a single image [52].


    +   3. Image Shifting: By using image shifting, we can change the position of
    images and thus create a different set of the images from a single original image
    [53].


    +   4. Noise Addition: This method adds the unnecessary noise in the original
    images and thus creates new images sets having noises. New sets of images created
    by this approach enable the machine learning model to train for removal of noises
    from images efficiently [53].


    +   5. Blurring of Images: This technique blurs the original clear images to create
    totally new sets of blurred images. As we know, the image source in a model does
    not consists of the same source, and the quality of the input images cannot be
    fixed. It can be sometimes of good quality or sometimes of rough quality. The
    new subsets of images created by using the blurring approach make the model more
    robust while using the images of different quality. Figure 9.3 depicts the flowchart
    for the model of herbal image identification.'
