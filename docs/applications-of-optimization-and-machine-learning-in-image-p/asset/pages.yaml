  md: '# # 6.5 CHALLENGES FOR IOT IN SMART HEALTHCARE SYSTEMS


    In the healthcare system, IoT remotely provides support for patients as well as
    for healthcare providers. From the literature, we have found various challenges
    in the field of IoT. We have divided such challenges into three categories: technical,
    ethical and economical. Table 6.1 explains all the technical, ethical and economic
    challenges that have occurred in smart healthcare systems using IoT.


    # ## 6.5.1 Technical Challenges


    With the help of wearable sensors, patient health can be tracked very easily,
    but the main challenge is data, which is very big and which requires efficient
    algorithms and less complex infrastructure to process. Data generated with the
    help of sensors is unstructured and requires time for fast delivery. Moreover,
    IoT platforms should be user-friendly for both healthcare providers and patients.


    +   - **Critical Processing and Response Time**: IoT devices used for smart healthcare
    require sensors to capture data from the patient’s body. Data collected from IoT
    devices is unstructured and requires high-processing computing devices, which
    increases cost and time.


    +   - **Connectivity Issues**: for faster and quick communication using IoT devices
    and reliable Internet connection are required for the remote monitoring of patients.


    | Technical Challenges | Ethical Challenges | Economic Challenges |

    |---|---|---|

    | Critical processing and response time | Privacy and security of data | High
    infrastructure resources cost |

    | Heterogeneous devices | Ethics of devices | Devices maintenance cost |

    | Nonuniformity of communication protocols | Ethics of practices | Big data |

    | Stakeholder association and implementation | Ethics of data | |

    | Connectivity issues | No open standards | |

    | Device monitoring and sensing | | |

    | Programming models for IoT networks | | |

    | Data distribution and interoperability [24] | | |'
  merge: -1
  img_proc: true
- pgno: 104
  md: '+   - **Heterogeneous Devices:** IoT is nothing but the interconnection of
    devices. Devices can be any wearable devices that we are using in our homes, cars,
    office—anywhere. Interoperability is the main challenge due to the heterogeneous
    nature of the devices.


    +   - **Nonuniformity of Communication Protocols:** Every vendor has protocols
    for devices, and, due to this nonuniformity, communication problems occur among
    the devices.


    +   - **Stakeholder Association and Implementation:** Any person who is directly
    or indirectly related to IoT for the healthcare domain comes under the category
    of stakeholder. IoT systems should be improved by data collection from hospital
    staff, doctors, and patients through workshops and interviews. Collected data
    should be analyzed to improve the quality of IoT-based healthcare services. All
    doctors, patients and hospital staff should be trained for the proper use of IoT-based
    healthcare services [5].


    +   - **Device Monitoring and Sensing:** Sensors play an important role in real-time
    sensing and monitoring of data. Sensors should be active all the time for real-time
    capturing of data. The main challenge is the maintenance of the energy efficiency
    of IoT tags and sensors. There is a lot of research scope in this area because
    handling the heterogeneity of sensors is the main challenge for the real-time
    capturing of data.


    +   - **Programming Models for IoT Networks:** For effective implementation of
    IoT in the healthcare domain, dynamic programming models are required. These models
    not only maintain the workflow but also provide a user-friendly interface to end
    users [15].


    +   - **Data Distribution and Interoperability:** Handling multi-model data is
    the biggest challenge in the technical domain. Effective techniques should be
    explored to model IoT data.


    # ## 6.5.2 Ethical Challenges


    +   - **Privacy and Security of Data:** Security is a major concern in a smart
    healthcare system using IoT. The personal information of both doctors and patients
    can be misused by hackers to create fake IDs. Hackers can buy drugs and medical
    equipment with their names and later sell them, which is unethical. Data ownership
    is'
  merge: -1
  img_proc: true
