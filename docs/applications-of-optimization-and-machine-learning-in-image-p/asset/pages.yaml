    # 3.4.1 Computational Complexity


    The complexity of computation of HCCPSOBOA is O(t(N × D)) where t denotes the
    quantity of iterations, D demonstrates the quantity of variables, and N indicates
    the number of solutions. This computation’s complexity is comparable to that of
    CCPSO, BOA, GA, DE, EM and SCA. However, the computational complexity of SSA is
    O(t(N × log(N))) in the average case and O(t(N^2) in the worst case, and for BH
    is O(t(N^2 × D). This indicates that the complexity of the computational SCA and
    BH is worse than that of other algorithms due to the sorting of solutions in every
    iteration.


    # 3.5 CONCLUSIONS


    The SOA and BOA approaches are presented in this paper to determine the transmission
    power of various sensor nodes to conserve sensor'
