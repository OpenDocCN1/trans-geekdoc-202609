  md: '# 9.3 MACHINE LEARNING: EXPANDING HORIZONS


    The field of computer science with the fastest growth right now is machine learning,
    which has applications in fields as varied as marketing, healthcare, production,
    cybersecurity and mobility. Three elements are readily available and combined:
    (1) faster and more potent part of a computer, like multiple cores and broad sense
    GPU; (2) a computer program that utilizes these computational structures; and
    (3) essentially unlimited training data sets for a certain issue, like digital
    photos, digitalized files. Posts on social media or even other types of information
    are the primary cause of this literal “explosion” of the technique. ML is a type
    of AI that is capable of carrying out tasks without being particularly trained
    to do so. Instead, it employs a process known as “training to learn” from prior
    samples of the assigned task. Inference is the technique through which the task
    can be carried out on fresh data after training [22]. It is notably helpful for
    instances where the data is challenging to analyze, such as reviewing image and
    video recordings, and it especially helps in getting data from enormous amounts
    of continuously increasing data [23]. Computer vision is the science of analyzing
    and drawing conclusions from digital images and movies. It aims to automate tasks
    from an engineering standpoint that the human visual interface can do [24]. The
    two stages of a computer-vision-based machine learning process are feature extraction
    and classification.


    # 9.3.1 Various Steps in Machine Learning Models


    Data gathering using a cameras/mobile phones/smartphones is the first step in
    the framework for the creation of the ML-based picture identification model, as
    illustrated in Figure 9.2. To construct an online image database, collected appropriate
    photographs can be uploaded to a server. The image is further processed in order
    to make it suitable for applying a machine learning model. Various extraction
    techniques can be used to extract various characters in the context of color,
    shape and size. Following the use of features extraction techniques, the dimensionality
    reduction technique is further used to optimize the results. Additional machine
    learning models, including ANN, CNN, RNN and others, can be applied for system
    training and optimization. Each of these actions with specific response to herbal
    drugs is thoroughly explained in the next section.


    # 9.4 CREATION OF IMAGE DATABASE


    The easiest way to accomplish this is using a mobile phone equipped with a camera
    that has at least 10 pixels. Additionally, since cameras have superior'
