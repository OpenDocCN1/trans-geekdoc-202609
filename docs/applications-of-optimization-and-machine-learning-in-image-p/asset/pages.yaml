  md: '# # IoT and Its Advancement


    Anubhav Kumar Prasad,¹ Dharm Raj Singh² and Abhishek Kesharwani³


    ¹ United Institute of Technology, Naini, Prayagraj, U.P., India

    ² Jagatpur Post Graduate College, Varanasi, U.P., India

    ³ ABES Engineering College, Ghaziabad, U.P., India


    # ## 2.1 INTRODUCTION


    The growing need for devices to assist human comfort and to help humans in different
    ways ranging from household activities like handling a bulb to monitoring health
    and security led to a new field of technology known as IoT (Internet of Things)
    [1, 2]. The concept of IoT is pretty simple—to make communication possible among
    machines themselves and with humans. This communication occurs through the Internet
    and hence is known as the Internet of Things. Here, things are meant for physical
    objects and can be further categorized into two categories: smart objects [3–5]
    and non-smart objects [6–8], in other words, objects with intelligence and those
    without intelligence. We will now move to components or contributors of the IoT
    ecosystem.


    # ### 2.1.1 Components of IoT


    The components of IoT are devices/things, storage or cloud, data analytics part,
    and the user interface. Figure 2.1 shows the IoT components.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '![](img/9c1422d4c6a10143e1802787075307de_40_0.png)


    FIGURE 2.1 Components of IoT.


    # 2.1.1.1 Device/Thing


    This can be termed as a tracking device having sensors that can be used for tracking
    body temperature to proximity detection. Depending on the need, the sensor can
    be of different types, like pressure sensor, humidity sensor, light detection
    sensor, RFID tags, etc. These devices or objects can be broadly divided into two
    categories: smart and non-smart objects.


    2.1.1.1.1 Smart Objects The basic idea of smart objects is to provide processing
    and calculating powers apart from storing and networking capabilities. This is
    in the context of minimizing human interaction in any framework, and this can
    be done using smart objects. That is why they are termed the “building blocks”
    of IoT. For instance, a smartwatch capable of measuring heart rate can check heart
    rate readings from time to time and process the data on its own to make the wearer
    alert to any issue regarding heart rate. Here, human intervention is not required
    as the smartwatch is collecting and calculating the data on its own, producing
    the required output. The following are the features of the smart objects:


    +   1. Physical Shape: The object must have a physical shape to fit it into the
    appropriate place. For example, a smartwatch must have a physical shape compact
    enough to fit on a person’s wrist.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '+   2. **Unique Identifier:** The unique physical identity can be used by humans
    to distinguish it from other devices. For example, a TV remote and a keypad mobile
    can be differentiated based on their unique identification.


    +   3. **Communication:** The smart object must be able to send and receive data
    over the Internet as the communicating medium.


    +   4. **Unique Name and Address:** The identity of the smart object over the
    network infrastructure must be unique so that it is easily identifiable with other
    devices over the same medium. This is about the non-physical identifier of the
    same object.


    +   5. **Processing Power:** Being a smart object, it must be able to do the processing
    as per the environment.


    +   6. **Sensing Capabilities:** The reason for having sensing capabilities is
    to gather data from the environment in order to process it. For instance, the
    object responsible for handling room temperature must be able to sense the temperature
    of its surroundings.


    # 2.1.1.1.2 Non-Smart Objects


    There is a need for devices/objects that are meant to collect and transmit the
    data only. Sensors and actuators are examples of such objects.


    +   1. **Sensors:** It can be simply considered as a subpart of the smart object
    that is meant to gather the data or, in other words, sense the environment. Its
    role is to send the data to the specified object of the IoT system for processing.


    +   2. **Actuators:** The role of the actuator is to perform a physical action
    as instructed by the controller. The data required by the control system or controller
    is provided by the sensor. For instance, the sensor in a refrigerator sends the
    temperature data to the control system, and the control system, based on its algorithm,
    instructs the actuator to either increase or decrease the temperature. Thus, in
    simple terms, an actuator is a mover which does some physical activity based on
    the electronic signal that it receives from the control system.


    # 2.1.1.2 IoT Cloud


    The term “cloud” specifically relates to data storage on the server. The use of
    the cloud can be extended to data processing or other types of services.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Cloud computing [9] is discussed in detail in a later section. The IoT cloud
    is responsible for data collection from the object, as well as its processing,
    management, and archiving. In other words, the data gathered by the object is
    stored and converted to information in the IoT cloud using various algorithms
    of AI/ML like a support vector machine, k-Nearest Neighbor, etc.


    # 2.1.1.3 User Interface


    A user interface is software designed to monitor and manipulate processed data.
    The user interface must be designed to provide maximum interaction with the least
    complexity.


    2.1.1.3.1 Architecture of IoT The architecture of the IoT depends upon the implementational
    role and the sector where it is needed [10]. Based on these, the following four
    architectures are available:


    +   1. Sensing Layer: This layer contains the objects related to the collection
    of data. The sensors and actuators are part of this layer. This layer may or may
    not process the data depending on the smart or non-smart object configuration
    type. It is just like the end-point devices needed for interfacing between the
    physical and the digital worlds.


    +   2. Network Layer: This bridges the connection between the sensing layer with
    other servers, communicating devices and network devices. This layer is responsible
    for the movement of the data collected by the sensors and the actuators of the
    sensing layer. There are two main components of this system: DAS (data acquiring
    system) and the network/Internet gateway. The main responsibility of the DAS is
    to convert the analog signal to the digital signal, i.e., to the data aggregation
    and conversion part.


    +   3. Processing Layer: The digital signal received from the network layer is
    eventually sent to the data center, where the software application will access
    the data. So it is the responsibility of this layer (processing layer) to do the
    pre-processing. Here Edge IT or edge analytics [11] comes into the picture.


    +   4. Application Layer: The user interaction is done in this layer. It is simply
    an application that a user can operate to monitor the data and'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'to control the working of the IoT device. For instance, a user might change
    the color of a smart bulb just by selecting the desired color provided in the
    application interface.


    # 2.1.1.4 Advancement of IoT


    The advancement of the history of IoT can be described in terms of smart and non-smart
    objects. The control loop is a message that triggers certain actions based on
    the data it receives. This trigger of action may or may not be a decision-based
    action. For instance, reading a bar code and validating the data is a non-smart
    object task.


    On the other hand, switching on a bulb when someone enters the room may be a smart
    object task as it should switch on the bulb when it is dark. Decisions made in
    the control loop must meet application latency requirements, which are often referred
    to as the length of the control loop. If the data is sent to the server each time
    for the calculation, this may slow down the work for which the data was intended.
    For instance, a half-minute delay in opening a gate for a yard may reduce the
    number of vehicles that can enter the yard. This indicates that, as needs grow,
    IoT devices start becoming smart with the use of AI. The very first example of
    IoT comes from the 1980s when a group of university students modified a Coca-Cola
    vending machine for tracking its contents. However, the technology was bulky and
    was not up to the mark and had limited efficiency. This technology was not AI-enabled
    as it was intended for a non-decision task. The use of RFID (radio frequency identification)
    chips on Procter & Gamble products for tracking through the supply chain, introduced
    in 1999 by Kevin Ashton, is considered the first IoT device chain.


    Taking a keen interest in this, LG announced its first-ever smart refrigerator
    in the year 2000. In 2007, the first iPhone was launched, and by 2008, there were
    more connected devices than there were people on Earth.


    In 2009, Google started testing its first driver-less car, and by 2011, Google’s
    Nest Smart was launched. The use of IoT devices has extended to healthcare also
    where an AIoT (AI-enabled IoT) device can read human health-related data like
    heartbeat and can process the data to know whether the person is having heart
    issues and, based on this, can generate a warning message. The current study is
    working on the reading of IoT device data specific to human health monitoring
    in order to judge whether the person is having health issues. These IoT devices
    are fitted in rooms, not being worn by the person. With the introduction of 5G
    technology, IoT devices are now more advanced in terms of data handling and communicating
    with the server.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '2.1.1.4.1 Edge Device An edge device [12] that is part of the network layer
    is responsible for device-to-server connectivity. This is required to be able
    to have better connectivity as local devices use protocols like Bluetooth [13],
    Wi-Fi [14], Zigbee [15], and NFC [16], whereas the cloud uses the protocols like
    AMQP, MQTT, CoAP, and HTTP. Edge devices can be visualized as a smart gateway
    that is able to translate, sort, and move the data securely between the two sources.
    This is required in order to adapt to different protocols efficiently and effectively.


    2.1.1.4.1.1 Bluetooth In order to provide wireless connectivity for a shorter
    range (approximately 10 m) of devices, Bluetooth technology was introduced by
    Ericsson in 1994. It is a low-powered technology that is capable of transmitting
    and receiving signals in a noisy environment with low bandwidth (1–3 Mbps) connectivity.
    It is an industrial, unlicensed, scientific and medical (ISM) band ranging from
    2.4 to 2.485 GHz. It follows the parent–child model with a maximum of seven children
    for a parent. The parent in one piconet [17] can also be a child in another piconet
    and can switch roles too. In the IIoT [18] environment, short bursts of data keep
    on interacting, and the setup required for this to handle hundreds of sensors
    is the strength of Bluetooth as opposed to WiFi. With the increasing need for
    better connectivity and faster data transmission, Bluetooth 5 [19] has been introduced
    with four times the range, a broadcast messaging capacity boosted by 800% as compared
    to Bluetooth 4 [20], as well as twice the speed.


    2.1.1.4.1.2 WiFi WiFi has a better reach as compared to Bluetooth in terms of
    range and bandwidth. It has a range of approximately 50 m, with a transmission
    frequency between 2.4 and 5 GHz. However, it consumes more power as compared to
    Bluetooth. The longest-ever transmission range for data using WiFi is approximately
    418,429 m. Just like LAN, there are different versions of WiFi: 802.11a, 802.11b,
    802.11g, 802.11n, and 802.11ac. For each of these standards, the cost is a major
    factor as different hardware configurations are required for it. Considering the
    needs of IoT, two standards are developed: WiFi Halow (802.11ah) and HEW (802.11ax).


    2.1.1.4.1.3 Zigbee Bluetooth has two divisions: traditional and low energy (LE).
    The two divisions are mainly based on the power consumption'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'issue. Traditional operates on 1 W of energy, whereas LE can operate with 10–100
    mW of energy. However, to increase the transmission range, another protocol was
    needed, and this brought on Zigbee. It is a wireless technology developed as an
    open global market connectivity standard with low power consumption. The Zigbee
    connectivity standard operates on the IEEE 802.15.4 physical board radio specification
    and works within unlicensed radio bands, including 2.4 GHz, 868 MHz, and 900 MHz.
    Due to the mesh topology used, it has higher latency and is therefore not suitable
    for iIoT.


    2.1.1.4.2 Cloud Computing The term “cloud” in cloud computing [9] is used to indicate
    data access and storage on remote servers. The architecture of the cloud can be
    divided into three categories [21]: cloud as an infrastructure, cloud as a platform
    and cloud as a service. They are popularly known as IAAS, PAAS and SAAS. The idea
    is to serve different requirements based on the user’s needs. IAAS provides the
    raw cloud; i.e., the infrastructure is provided to the user such as server, processing,
    storage etc. In the case of PAAS, the user gets the complete platform to build
    and run the applications. It provides all requirements such as servers, operating
    systems, storage etc. The SAAS is a software distribution model in which the services
    are available to the end user over the Internet. Users can directly use such services
    as an online editor and co-compiler and need no installation in their system.
    The storage space [22] for users in the cloud is handled using two different approaches:
    NAS and SAN. The former, network access service, has a RAID configuration with
    a single storage device, while the latter, known as a storage area network, has
    multiple storage devices. The major difference between the two is that NAS has
    a single point of failure, which is not the case with SAN. Moreover, the data
    can be stored in either raw format or in files using the file system. The architecture
    of a cloud includes several key modules [23]: a resource provisioning module,
    a user interaction interface, and a system resource management module [24–25]
    with a services catalog.


    # 2.1.2 Network Security Attributes of Cloud Computing


    # 2.1.2.1 Authentication [26]


    In order to authorize an entity, it is required to authenticate the identity of
    that entity. This can be done either through a password system, PIN (personal
    identification number) or biometrics. In addition, message'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'authentication is also used for authentication. Here, entity can be machine
    to machine, person to person or mixed. Transport layer sockets (TLS) are one way
    for such authentication [27].


    # 2.1.2.2 Authorization [28]


    After successful authentication, the next step is to authorize the entity with
    the rightful service/resource. For instance, users can withdraw only the allowable
    limit once from an ATM for which they have been authorized [29].


    # 2.1.2.3 Auditing [30]


    Although an entity has been granted the requested service/resource after authentication,
    it is wise to audit the entity, so as to make sure there is no fraudulent activity.


    # 2.1.2.4 Confidentiality (Privacy) [31]


    This is related to avoiding/ensuring that there is no data breach. An unauthorized
    entity should not be able to disclose personal information including ID and password.


    # 2.1.2.5 Availability


    This is related to resource management and is the same as resource management
    in the operating system. The requested resource must be allocated to the authorized
    entity if available. At the same time, if an entity has left, the used resource
    must be deallocated. This is like a garbage collector in the Java programming
    language. Load-balancing hardware and software are dedicated to this task [32].


    # 2.1.2.6 Non-Repudiation [33]


    Non-repudiation is related to the validity and legitimacy of the message. Here,
    authentication is used for message validation. For security purposes, it is mandatory
    for the entity to commit itself by endorsing its signature [34–35]. For this purpose,
    User Identity Management Protocol (U-IDMP) [36].


    # 2.1.3 Security Protocols


    # 2.1.3.1 Predicate Encryption


    Predicate encryption is another paradigm of encryption where the sender-receiver
    generates a key based on predicate calculus [37]. To evaluate the'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'encrypted data, the secret token related to the predicate is evaluated using
    f(a) = 1, where f is the predicate function. If the equation/condition is satisfied,
    the encrypted data is decrypted and confirms that the data is coming from the
    rightful sender. Although this is an effective mechanism, it is at the same time
    a complex one. This is why it is not widely accepted in the industry. But this
    does provide a new direction to solve traditional problems like network audit
    logs [38], sharing of medical records [39], un-trusted remote storage [40] etc.


    # 2.1.3.2 Dynamic Auditing Protocol for Data Storage in Cloud Computing


    The ideal scenario in cloud computing is that the user and cloud owner can do
    the auditing to check for smooth and legal functioning. But this is not effective
    because the auditing needs to be guaranteed as unbiased. For this reason, this
    third party must be an expert auditor who can perform non-biased auditing. The
    auditing protocol should have the following properties—dynamic auditing and batch
    auditing—and, most importantly, confidentiality must be maintained at all levels
    of auditing.


    # 2.1.3.3 Fully Homomorphic Encryption


    There are two types of homomorphic encryption [41]: partial homomorphic encryption
    (PHE) and full homomorphic encryption (FHE). PHE is able to provide a single operation
    over the encrypted data, whereas FHE is able to perform multiple operations over
    the encrypted data, including the addition and multiplication of the data. The
    additive homomorphic encryption is done using Pailler [42] and Goldwasser–Micali
    cryptosystems, whereas the multiplicative homomorphic encryption is achieved using
    the RSA and El Gamal cryptosystems. The interesting fact is that both operations
    are performed only on the encrypted data, and these operations are unaware of
    the secret key used for the purpose of the decryption.


    # 2.1.4 Private Information Retrieval (PIR)


    In this case [43–45], the user has the freedom to retrieve the data from the database
    without actually knowing the database from which the data is being retrieved.
    This is the weaker version of the 1-out-of-n obvious transfer. The trivial solution
    is to send the entire database copy to the user, and in fact, this is a solution
    in terms of quantum settings. As far as a nontrivial solution is considered, we
    have two ways to achieve this: make the server computationally bounded or assume
    multiple non-cooperating servers, each having a copy of the database.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 2.2 PROTOCOLS OF CLOUD COMPUTING


    # 2.2.1 HTTP


    The Hyper Text Transfer Protocol (HTTP) is based on message passing in the form
    of request–response. It is a half-duplex TCP connection, making this a connection-less
    protocol. The HTTP follows the REST [46, 47] guideline, which is responsible for
    the web services guidelines. Cloud IoT Core supports HTTP 1.1. The request to
    the server can be made for the creating, updating, reading and deleting operations
    on the data. This can be achieved by methods like HTTP PUT, GET, POST and DELETE.
    The CRUD (create-read-update-delete) operations let users directly interact and
    modify the target resources [48]. HTTP also provides a mechanism for clients and
    servers known as content negotiation [49]. The data must be encoded using base64
    and requires more network and CPU resources for this task.


    # 2.2.2 MQTT


    The MQTT (Message Queue Telemetry Transport) [50–52] protocol is intended for
    use in sensor networks. Since it is mainly designed for sen-sors, it is best suited
    for the IoT and cloud. It was developed by IBM and is a lightweight and machine-to-machine
    communication method. The basic idea behind this protocol is that sensors are
    not intended for processing but rather for data transfer to the intended central
    location. It uses full-duplex communication and is a connection-oriented protocol.


    # 2.3 CONCLUSION


    The Internet of Things (IoT) has drastically improved and changed many parts of
    our life, presenting both previously unheard-of benefits and difficulties. Healthcare,
    agriculture, manufacturing, transportation, and smart cities are just a few of
    the sectors that have been transformed by IoT, which has increased efficiency,
    production, and convenience. For cor-porations, governments, and individuals alike,
    the capacity to connect to and communicate with objects and devices, to gather
    and analyze data in real time and to automate operations has opened up new opportunities.
    Smart homes, wearable technology, connected autos and intelligent supply chains
    are just a few of the applications that have been made possible by IoT breakthroughs.
    By delivering personalized experiences, maximizing resource use and enabling predictive
    maintenance, these advances have raised our quality of life. By facilitating smart
    energy management, waste'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'reduction, and precision agriculture, among other things, IoT has also contributed
    to environmental sustainability.


