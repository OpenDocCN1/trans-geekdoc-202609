    lamina. The authors also used the inertia axis method to spin leaves, which must
    be done in a specific orientation. This is done to mimic how people typically
    observe objects. The results demonstrated that characteristics of the same plant
    exhibit excellent consistency with negligible variation in laminae, while aspect
    ratio, vertical eccentricity and form complexity exhibit the greatest variation
    in the laminae of different plants [43]. Patil and Manza collected geometric information
    from photographs,


