  md: recent years, researchers have been looking for possible solutions, working
    on developing the most effective solutions in which nodes are known to send messages
    with minimal power and bringing them together to form a network that is completely
    connected [2, 3]. Energy-efficient antennas have been used in wireless local area
    networks (WLANs) to reduce power consumption, as documented in [4]. Another option
    is the wireless transfer of harvested power to the nodes for their power requirements
    [5]. IoT networks are becoming more and more diverse, creating new issues that
    necessitate the renewed study of prior solutions, as well as the development of
    entirely new ones, and also presenting a survey that focuses on WSN battery life
    extension through control approaches and cluster selection [6]. The lack of efficiency
    in centralized connection methods is due to the additional communication overhead
    and delay required to gather and synchronize the transfer of information among
    coordinated nodes. However, it’s critical to have a mathematical model for calculating
    how much power each node needs. A centralized control system for a wireless sensor
    network (WSN) is a viable alternative since it provides full-area coverage with
    little energy requirements, and, because of its powerful processing abilities,
    the central unit can decide after gathering all the necessary information. WSNs
    can also benefit from a centralized hub, which provides numerous networking advantages,
