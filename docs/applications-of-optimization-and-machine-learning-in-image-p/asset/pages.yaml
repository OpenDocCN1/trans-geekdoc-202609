  md: 'where $E_{\mathcal{X}}^{-k} = \left( \begin{array}{c} E_{\mathcal{X}}^{-k}
    \\ E_{\mathcal{Y}}^{-k} \end{array} \right)^T$ and $E_{\mathcal{X}}^{-k}, E_{\mathcal{Y}}^{-k}$
    are the operators representing a shift of $-k$ steps from $(i,j)$ in $\mathcal{X}$
    and $\mathcal{Y}$ directions, respectively. The term $\omega_k^{(\alpha)} = (-1)^k
    \binom{\alpha}{k}$ represents a binomial coefficient obtained from expanding $(1-z)^k$
    and is evaluated using the following recursion formula:


    \omega_0^{(\alpha)} = 1, \omega_k^{(\alpha)} = \left( 1 - \frac{\alpha+1}{k} \right)
    \omega_{k-1}^{(\alpha)} \tag{10.14}


    where $k=1,2,3,\dots$, employing the Grünwald–Letnikov derivative definition [29]
    in Eq. (10.13), this gives


    $D_-^\alpha D_+^\alpha w^T = -\sum_{k=-\infty}^0 \omega_{|k|}^{(\alpha)} E_{\mathcal{X}}^{-k}
    w^T - \sum_{k=0}^\infty \omega_k^{(\alpha)} E_{\mathcal{X}}^{-k} w^T \tag{10.15}$


    Since $\sum_{k=0}^\infty \omega_k^\alpha = 0$, Eq. (10.15) is rearranged as


    $D_-^\alpha D_+^\alpha w^T = -\sum_{k=-\infty}^0 \omega_{|k|}^{(\alpha)} \nabla
    \left( E_{\mathcal{X}}^{-k} w^T \right) - \sum_{k=0}^\infty \omega_k^{(\alpha)}
    \nabla \left( E_{\mathcal{X}}^{-k} w^T \right) \tag{10.16}$


    where $\nabla \left( E_{\mathcal{X}}^{-k} w^T \right) = E_{\mathcal{X}}^{-k} w^T
    - (Rw)^T$, and $R$ represents an operator that, when acted on $\boldsymbol{a}
    \in \mathbb{R}^n$, provides $\left[ \boldsymbol{a} \dots \boldsymbol{a} \right]
    \in \mathbb{R}^{m \times n}$. Further, taking pre-multiplication by $e^T$ on both
    sides of Eq. (10.16), we obtain


    $e^T D_-^\alpha D_+^\alpha w^T = -\sum_{k=-\infty}^0 \omega_{|k|}^{(\alpha)} e^T
    \nabla \left( E_{\mathcal{X}}^{-k} w^T \right) - \sum_{k=0}^\infty \omega_k^{(\alpha)}
    e^T \nabla \left( E_{\mathcal{X}}^{-k} w^T \right) \tag{10.17}$


    Since the presented algorithm is purposed to be employed in the field of image
    processing, Eq. (10.17) is approximated as


    $e^T D_-^\alpha D_+^\alpha w^T \approx -\sum_{k=-W}^0 \omega_{|k|}^{(\alpha)}
    e^T \nabla \left( E_{\mathcal{X}}^{-k} w^T \right) - \sum_{k=0}^W \omega_k^{(\alpha)}
    e^T \nabla \left( E_{\mathcal{X}}^{-k} w^T \right) \tag{10.18}$


