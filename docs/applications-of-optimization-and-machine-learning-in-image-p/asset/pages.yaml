    Commercial applications of IoT include oil well sensing, intelligent vehicle transportation
    systems, gaming and agriculture, as well as applications in smart homes, wearable
    technology, healthcare, the automobile industry, and smart grid technology. The
    principal area of concentration in IoT research is the security of the various
    IoT nodes to preserve the flawless operation of the IoT networks [18].


    Designing, putting into practice and guaranteeing security on an IoT network are
    among the most popular IoT study topics, which have drawn several researchers
    from standardization organizations as well as from academia and business. Many
    ideas have been made so far with the goal of addressing the security issues with
    IoT. This chapter is focused on security routing protocols in IoT. Moreover, we
    developed a framework for a verification scheme for malicious routing.


    The rest of this chapter is organized as follows: Section 7.2 defines the security
