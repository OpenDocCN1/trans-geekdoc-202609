- pgno: 19
  md: '# State-of-the-Art on Evolved Optimization Approaches for Damage Detection
    in Steel Bridges


    Anshul Sharma


    Department of Civil Engineering, National Institute of Technology, Hamirpur, Himachal
    Pradesh, India


    # 1.1 INTRODUCTION


    Steel bridge health monitoring deals with damage location identification and the
    extent determination inside the steel members utilizing collected vibration responses
    containing dynamic modal information of the steel bridge under analysis. The sensors
    used to collect the data present the challenge of data contamination due to unwanted
    noise from operational conditions and can be effectively eradicated by determining
    optimum sensor placing positions. The multi-objective optimization techniques
    utilize N Pareto optimum solutions to investigate and achieve more realistic results
    for real-world problems of damage determination in steel bridges. Steel-bridges-related
    problems such as damage identification, operational research, retrofitting decisions,
    service life forecasting etc., are solved using multi-objective optimization techniques
    available since the 1990s. The accurate and robust outcomes of optimization techniques
    enabled researchers to apply these techniques in various domains [1, 2].'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Optimization is applied to achieve the perfect, efficient solution (minimum
    or maximum) for the desired problem (system design, decision making) under the
    influence of the given circumstances [3]. The selected parameters are used to
    classify the optimization techniques with multiple objectives. The computer programs
    utilizing optimization techniques are employed to obtain optimum solutions for
    the complex geometry problems of steel truss bridges.


    This chapter is chronologically organized. The first section includes an introduction
    to the health monitoring of steel bridges using optimization techniques. The second
    section briefly describes the significance of the optimization model. The third
    section involves detail about different phases involved in optimization models.
    Lastly, The fourth section includes the conclusions drawn and future scope for
    the improved application of optimization approaches while solving steel bridge
    problems.


    # 1.2 OPTIMIZATION MODEL


    The optimization model includes four phases, which are applied independently to
    achieve optimum outcomes, as shown in Figure 1.1. Phase 1 comprises the collection
    of reliable data on which the computational accuracy of optimization model directly
    depends [4–6]. Phase 2 includes the development of a problem using the identification
    of decision variables, forming model objective function and model boundary conditions
    constraints formulation. Some steps are intended to be attentive to the consideration
    of important elements in problem, a number of known and unknown variables utilized
    to form mathematical equations used to describe the system, model complexity and
    the degree of accuracy to be achieved from the model. Phase 3 includes the estimation
    of selected parameters and the development of mathematical description of the
    model [7, 8]. Model validation and performance are evaluated using statistical
    tools such as R² and root mean square values. The inputs for the chosen model
    parameters are analyzed using sensitivity analysis. The data used for model formulation
    is different from that used for model validation. Phase 4 involves the assortment
    of a suitable optimization algorithm based on the specific nature of the problem.
    The iterations are performed in Phases 3 and 4 and may lead to a repeat Phase
    2 for achieving the required results.


    The optimization model must have validity (the degree to which the real system
    matches the model’s inferences) and tractability (the practical'
  merge: -1
  img_proc: true
