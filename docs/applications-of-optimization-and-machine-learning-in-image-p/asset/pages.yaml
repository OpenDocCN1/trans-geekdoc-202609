    of images categorized in a database. Color moments of an image can be calculated/measured
    with the help of probability distribution. CM is one of the most basic yet powerful
    qualities among them [40]. Table 9.2 represents the different advantages and disadvantages
    of various color methods.


    # 9.5.2 Shape Features


    Shape is a key clue for humans to identify and differentiate real-world things,
    with the objective of encoding simple geometrical patterns including straight
    lines in various orientations. Contour-based and region-based approaches are the
    two primary categories of shape feature extraction methods. The former approach
    pulls features from the entire region, while the latter method calculates shape
    characteristics solely from the shape’s boundary. Shape feature is a very important
    feature for feature extraction from an image. Various properties of shape feature
    are transition, scale invariance and rotation, identifiability (the image of a
    similar object consists of similar features), noise resistance (feature must be
    as robust as possible against the noise), affine invariance (the descriptor should
    not be changed by shape distortion that preserves shape features), reliability,
    occultation invariance, statistically independent. Shape descriptor is a collection
    of numbers used to represent a certain shape aspect. A description tries to quantify
    the shape in ways that are intuitive to humans. The descriptors are usually in
    the form of a vector. Simple geometric features can usually only distinguish shapes
    with considerable variances; as a result, they are frequently employed as filters
    to eliminate false positives or in combination with additional shape descriptors
    to distinguish shapes [41].'
