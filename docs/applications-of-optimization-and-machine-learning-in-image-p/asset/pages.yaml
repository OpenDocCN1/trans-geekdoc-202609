- pgno: 11
  md: '# Preface


    THE INTERPLAY BETWEEN MACHINE learning and optimization is one of the most significant
    developments in the emerging domain of research. Machine learning, however, is
    not simply a consumer of optimization technology but a rapidly evolving field
    that is itself generating new optimization ideas. Optimization formulations and
    techniques perform vital role in the developing algorithms to extract essential
    information from big data. In addition, rapid developments in the field, like
    hardware, software and communication technologies, have facilitated the emergence
    of Internet-connected sensory devices to provide observations and data measurements
    from the real world. The number of such Internet-connected and -based devices
    are increasing day by day. With these developments, the need for security, maintenance
    and research have also increased. The increased volume of data need to be maintained
    safely and securely in the cloud. Such requirements extend the connectivity and
    interactions between the physical and cyber worlds. In addition to this increased
    volume of data, the need for optimization has emerged. Furthermore, the images
    play an important role in any field, such as automation, security, medicine and
    other real-life applications. Various artificial-intelligence-based techniques
    work on images to achieve specific objectives. Among such tools, optimization
    is another standard method to facilitate researchers. The application of image
    processing occurs in all areas from automated systems and smart healthcare devices
    to agricultural tools and security.


    This book covers the state-of-the-art techniques from fundamentals of optimization
    and machine learning to advanced-level applications. The book enables researchers
    understand the different means of optimization. Many of these techniques draw
    inspiration from different subfields. Within this book’s chapters, various methods
    of optimization related to IoT and image processing provide a deep analysis. Intelligent
    processing'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'is the key to developing smart IoT optimized applications. This book provides
    detailed knowledge of various applications of IoT in different fields, such as
    making smart cities, verification schemes in networking, waste management, as
    well as optimized clustering. Also presented are machine learning methods to deal
    with the challenges presented by IoT data, as in considering smart cities. Machine
    learning in the field of image processing has taken on vital role in research.
    Such applications include the identification of herbal drugs, fire prediction,
    and cardiac prediction in medical imaging. The potential and challenges of machine
    learning for IoT data and cloud-based optimization is also discussed.


    This book, comprising 11 chapters, is organized as follows. Chapter 1 gives state-of-the-art
    of optimization approaches for damage detection in steel bridges. The next chapter
    details IoT structure and its advancements in various fields. Chapters 3 to 7
    provide applications of IoT in multiple areas like clusters, smart cities, smart
    healthcare, waste management, and networking for verification schemes. Chapter
    8 to Chapter 11 consist of artificial intelligence and computer vision applications
    in real-time problems, like in agriculture, fire prediction, identification using
    herbal images, and disease prediction using medical images.


    The book enriches the overall concept behind the applications of machine learning
    and optimization in IoT and image processing.'
  merge: -1
  img_proc: true
