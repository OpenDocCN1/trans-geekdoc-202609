    # 10.5.2 Experimental Discussion


    The experiments were performed using the Google Colab and MATLAB® software [51]
    on a Windows 11 platform with 16 GB RAM. They were carried out over a dataset
    consisting of 324 and 228 reference images and their corresponding color maps
    for smoke and normal videos, respectively. In order to analyze the performance
    of the proposed framework, various metrics have been utilized. Also, the proposed
    framework is comprehensively compared against different existing models, which
    are discussed in tabular form, learning and ROC curves.


    The first experiment discusses the estimated fractional order optical flow fields
    obtained by implementing the proposed variational model. The parameter values
    are set to $\sigma = 0.4, \beta = 0.1, \lambda = 200, \text{and } \alpha = 0.7$.
    The image frames (video) collected from [30, 31] are of different sizes; therefore,
    in optical flow estimation, these have been resized in $384 \times 384$ size.
    The few sample reference images for smoke and non-smoke videos, along with their
    corresponding optical flow fields, are demonstrated in Figure 10.5. The first
    and second rows in Figure 10.5 illustrate the reference images and corresponding
    optical flow fields for smoke videos, respectively, while the third and fourth
    rows represent the reference images and optical flow fields for non-smoke (normal)
    videos, respectively. Since smoke has a tendency to diffuse in the upward direction
    and a particular optical flow channel is more sensitive to upward motion, this
    characteristic of color map channels is clearly visible in the corresponding color
    maps of smoke. In the case of non-smoke, objects generally do not tend to move
    upward, which can be seen from their optical flows in Figure 10.5. Moreover, the
    estimated fractional order optical flow is highly insensitive toward the outliers
    such as illumination change present in the scenes. This shows the significance'
