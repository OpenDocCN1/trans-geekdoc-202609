    $v = r_1 \sqrt{3KT/m}$

    ```


    In Eq. (3.20), $v$ denotes the component of the velocity that is updated throughout
    time. The temperature and mass of smell particles, $T$ and $m$, respectively,
    affect the kinetic energy of agents. The smell constant represented by $k$ normalizes
    this effect. The algorithm''s stability is unaffected by temperature $T$ or mass
    $m$, which are both connected with the initialization of scent molecules. The
    ideas of $m$ and $T$ are derived from the ideal theory of gas. For the sake of
    saving time, experimental results show that $m$ and $T$ have values of 0.175 and
    0.825, respectively. The new sites of the scent molecule in Eq. (3.17) are evaluated
    for their suitability. This signifies the end of the sniffing mode and the ability
    to locate the agent $x_{best}^d$ agent.


    # 3.3.2.3 Trailing Mode


    When an agent is tasked with locating the source of an unpleasant odor, this mode
    mimics the actions of the agent. The molecule may detect a new location with a
    greater concentration of agents than its current location while seeking a smell
    source, and the agent advances to this new location using Eq. (3.21).


    ```

    $x_N^d(t+1) = x_N^d(t) + r_2 * olf * (x_{gbest}^d(t) - x_N^d(t)) \\ - r_3 * olf
    * (x_{worst}^d(t) - x_N^d(t))$

    ```


    where $r_2$ and $r_3$ are random numbers in the (0,1) range. Relatively speaking,
    both $r_2$ and $r_3$ penalize the impact of $olf$ on $x_{gbest}^d(t)$ and $x_{worst}^d(t)$.
    Sniffing mode provides a way for the agent to find its current position $x_{gbest}^d(t)$
    agent and the point with the worst fitness $x_{worst}^d(t)$. This allows the agent
    to track the scent''s route more effectively. Eq. (3.21) shows how this information
    can be used to improve the algorithm''s balance between exploration and exploitation.
    Olfaction ability is largely influenced by the size of one''s olfactory lobes,
    as well as one''s psychological and physical state; therefore, the value of $olf$
    should be carefully chosen. Local searches benefit from low values of $olf$, while
    global searches benefit from high values of $olf$, since the former shows more
    strength in SAO''s ability to detect scents on a global search.'
