    One of the most significant fields in the healthcare domain is the prediction
    of heart disease, which utilizes the patient''s available data to forecast the
    existence or absence of cardiac illness. For heart disease prediction, multiple
    tools and strategies are available. In this research, an ensemble of a few supervised
    algorithms (Naïve Bayes classifier, Support Vector Machine, Decision Tree and
    Random Forest) are used to classify heart disease. Preprocessing of the raw data,
    such as cleaning and detecting missing values, is done to enhance performance.
    The crucial aspect of this research is feature selection, which improves algorithm
