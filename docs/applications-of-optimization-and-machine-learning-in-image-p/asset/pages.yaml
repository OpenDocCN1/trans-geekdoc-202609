    # ## 4.1 INTRODUCTION


    The capacity of computers to function equally effectively while processing

    numbers or symbols has given rise to a class of computer systems. The most

    well-known of these systems are expert systems. Artificial intelligence (AI)

    refers to the body of knowledge from which these systems are developed [1].

    The goal of AI is to enable computers to reason similarly to humans. This

    change will enhance the digital revolution of each sector. The world may

    become autonomous by linking everything to digital platform. Machine

    learning and data analysis are two modules which are require to make the

    physical objects and environment autonomous. Data analysis would ana­lyze all
    the data that is created over time to figure out the previous patterns

    and to be more effective in the future, whereas machine learning would

    develop strategies to assist learning in various devices of the network to

    make them automated and self-standing [2]. The integration of machine

    learning and data analysis into sensors and embedded systems for smart

    systems is now a focus for the growth of industry. IoT’s anticipation of a

    world filled with implanted intelligent devices, sometimes referred to as

    “smart objects,” is one of the foremost concepts driving this movement,'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'and these components are interconnected through the Internet or other communication
    mediums like Bluetooth, infrared etc. [3]. The following subsections discuss AI,
    IoT and its applications.


    # 4.1.1 Artificial Intelligence


    AI is the study of giving robots intelligence so that they can do jobs that previously
    needed the human intellect. AI-based systems are advancing quickly in terms of
    capabilities, applicability, adaptability and processing speed. The ability of
    machines to perform less common activities is constantly improving. All of the
    data produced in each of these fields contributes to intelligence. To reveal the
    underlying principles of this data, analysis is crucial. AI is a method for effectively
    using data such that it is meaningful, intelligible to the people who offer it,
    and customizable. It is the study of developing tools and strategies for analyzing
    data and interpreting meaningful information out of it [2].


    # 4.1.2 Internet of Things (IoT)


    IoT is basically the combination of two words, “Internet” and “things,” in which
    the Internet is a worldwide network of interconnected computer networks that serves
    multiple people across the world and that works on TCP/IP protocol. Different
    personal, public, educational, corporate, ministerial, security agencies networks
    are connected by a vital range of electromagnetic, wireless and optical networking
    technologies [4]. IoT can predict and respond to the environmental changes as
    it is a broad open network of smart objects that can self-organize, share information
    and resources, respond to events, and modify their behavior in response to environmental
    changes. IoT can provide anytime/anywhere connection for everything [5, 6].


    # 4.1.3 Application of IoT


    Figure 4.1 shows the applications of IoT in various components of smart cities.
    It includes smart door access control system, smart lighting for home and office,
    automated gate and garage, smart thermostats and humidity controllers, traffic
    management, smart lighting on streets, pollution monitoring and reporting, smart
    parking solutions etc. in industrial, health sector, agriculture, home automation,
    transportation, logistic management etc. The IoT also provides access to a number
    of inventive and'
  merge: -1
  img_proc: true
- pgno: 74
  md: '![](img/9c1422d4c6a10143e1802787075307de_74_0.png)


    FIGURE 4.1 Applications of IoT.


    comprehensive applications for smart cities, which significantly contribute to
    lowering energy consumption and other environmental consequences. The ensuing
    sections of this chapter are structured as follows: In Section 4.2, a brief introduction
    about the smart cities is followed by common issues in smart cities, the role
    of IoT in smart cities and IoT optimization over the smart cities. Section 4.3,
    discusses smart mobility in smart cities, its global and regional prospective
    and smart mobility consequences over Himachal Pradesh, followed by the conclusion
    and future scope.


    # 4.2 SMART CITIES


    The smart city is a technologically advanced metropolitan area that deploys different
    electrical devices and sensors to get information, which is utilized to deal with
    the resources, services and assets and which is further utilized to improve multiple
    operations across the city.


    # 4.2.1 Common Problems of Smart Cities


    The idea of a “smart city” has become more important on the agendas of policy
    makers as a way to improve the quality of life offered to inhabitants'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'via the search for and identification of intelligent solutions. Cities must
    improve the quality and efficiency of their resources and services offered due
    to population increase and high rates of urbanization, while also fostering sustainable
    and long-term economic growth. Smart cities face certain common problems:


    +   1. Inadequate infrastructure to support smart cities

    +   2. Data privacy and openness

    +   3. Coordination between the private and public sectors

    +   4. Inability to carry out initiatives for smart cities

    +   5. Political incompatibility and a lack of legislative will

    +   6. Lack of technical skills

    +   7. Security and hackers

    +   8. Imbalance between quality of life and invasion of privacy

    +   9. Community education and their support in the development of the smart city


    # 4.2.2 Role of IoT in Smart Cities


    Modern advancements in AI and IoT play a significant role in the growth of smart
    cities. Both of these are based on applications such as smart healthcare, transportation,
    system infrastructure, environmental management, governance, sustainability and
    quality of life. An idealized form of urban development is represented by smart
    cities [7]. The concept of an intelligent city is typically based on a number
    of factors, including commercialization, logistics and transportation, healthcare,
    tourism etc. These sectors of the smart city can benefit from the IoT by raising
    the level of the city’s intelligence, improving interactions between objects and
    humans, optimizing the use of general resources and raising business opportunities
    with improved information access to the citizens. As a result of the technology’s
    potential to reduce harmful effects on ecology and men as well as to promote ecological
    sustainability by lowering carbon emissions, energy utilization, traffic management,
    and infrastructure deterioration, the integration of the IoT in a smart city can
    also give residents suitable holistic living conditions [8].'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# 4.2.3 Optimization of Smart Cities through IoT


    The stress on smart cities throughout the world has increased as a result of rising
    population and urbanization. To overcome these stressors, smart cities need optimization
    over the previous technologies and require smart health systems, smart home appliances,
    smart industries, smart infra-structural facilities, smart embedded system and
    smart transportation.


    Figure 4.2 shows the IoT optimization applications for smart cities: smart agriculture,
    smart grid, smart city services, smart health, smart transportation, smart industry
    etc.


    # 4.2.3.1 Energy Optimization with IoT


    A smart city is one that has several energy-consuming devices both within and
    outside it and is completely networked. Energy optimization is therefore necessary
    to make the best use of the available energy sources. To improve the energy efficiency
    in smart cities, a model based on IoT, 5G,


    ![](img/9c1422d4c6a10143e1802787075307de_76_0.png)


    FIGURE 4.2 Applications for optimization in IoT-based smart cities.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'and cloud computing is required. Energy-saving sensors with IoT capabilities
    can be used, and 5G enables quick communication with intelligent energy-consuming
    devices. The data produced by intelligent IoT devices can be kept in the cloud
    via a 5G communication channel. Through the application, smart device functionality
    is tracked. In the case of any problem, control management obtains information
    from the cloud via a communication channel and can fix the problem [9].


    # 4.2.3.2 Smart Transportation Optimization with IoT


    The majority of smart cities experience severe traffic problems every day. The
    traffic control system is a major issue for smart cities, even though certain
    areas are automated and cost-efficient. Every intersection with a traffic signal
    has an IoT sensor-integrated camera to keep an eye on the movements of passing
    vehicles. Additionally, the cloud processes the optimized vehicle flow data. An
    algorithm is performed using the information from the different signal corners
    to determine the direction of the flow of traffic and to manage the signal lights.
    IoT sensors are used to send the alarm notice to the closest traffic control facility
    when traffic is heavy [10].


    # 4.2.3.3 Smart Agriculture Using IoT


    IoT combines a number of current cutting-edge products and technologies, including
    wireless sensor networks (WSN), cognitive radio ad hoc networks, cloud computing,
    big data and user applications. The use of IoT technologies for smart agriculture
    is inevitable and will enhance productivity, provide hygienic and green food,
    endorse food traceability and decrease human efforts with increased production
    capacity. Various common sensors are used in the smart agricultural industry,
    depending on the necessary activity. Location sensors, mechanical sensors, electrochemical
    sensors, optical sensors and air flow sensors are just a few of the basic categories
    that may be used to classify sensors. These sensors are used to gather data on
    the atmospheric composition, air temperature/pressure/humidity, soil moisture/temperature,
    air humidity, plant moisture, precipitation, wind velocity/direction and sun radiation.
    These autonomous sensors supply data with a high degree of dependability, demonstrate
    great energy efficiency and provide independency [11].


    # 4.2.3.4 IoT-Based Smart Health Care


    The term “smart health” describes the use of technology to give people better
    medical treatment. This might take the form of creating instruments for improved
    illness diagnostics or using algorithms for better scheduling'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'and providing better healthcare. In order to provide better healthcare services,
    it is essential to dispatch emergency vehicles at the appropriate time to a person
    in need. The allotment and movement of emergency vehicles is greatly facilitated
    by the IoT. A real-time indicator of the position of the vehicle as well as the
    volume of traffic in a certain region is made possible by the connection offered
    by IoT through vehicle-to-vehicle and vehicle-to-infrastructure communication.
    The best path for rescue vehicles to take and how best to deploy them to help
    those in need may then be decided using this information.


    # 4.2.3.5 Smart Home Optimization


    Home energy management has been the main application of optimization. In order
    to optimize a smart home, there are many requirements to maintain comfort, restrictions
    on power flow, time of operation, the maximum power that may be present or consumed
    and the availability of switchable appliances. Smart meters and IoT technologies
    are used to manage and monitor individual appliances as well as to schedule them.
    The microgrid, which controls the sources that are turned on and off from the
    homes’ electrical supply and is used to collect data, is made possible by IoT
    devices. The data collected from these IoT devices may be analyzed to improve
    energy consumption patterns, which will save costs for the client and also enhance
    comfort.


    # 4.2.3.6 Smart Infrastructure for Smart Cities


    The management and improvement of public services, such as cultural activities,
    tourism and education, which are involved in enhancing the general quality of
    life of citizens, are also included in the smart living domain. This includes
    all elements related to developing smarter city infrastructures (e.g., smart homes,
    smart buildings etc.). IoT enables the rapidly expanding implementation of a variety
    of facilities for smart buildings, including tools for monitoring the structural
    integrity of buildings, tools for managing air conditioning and rainwater drainage,
    security systems for controlling verified access to buildings, video surveillance
    and human movement tracking.


    # 4.3 SMART MOBILITY FOR THE SMART CITY


    A smart city is a developed area that uses information and communication technology,
    business strategies and solutions to boost productivity, share knowledge with
    the public and enhance the welfare of its residents.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Utilizing information and communication technology, the smart city mission
    is to enhance both economic development and societal well-being [12]. One of the
    key tenets of the idea of a smart city is smart mobility. The potential for integrating
    technology into the transportation sector is growing as a result of the use of
    numerous technological solutions in every area of transportation and traffic science
    [13]. Information and communication technologies are developing at a rapid rate
    as determinants of a smart city. One of the greatest issues facing local authorities
    today is urban mobility [14]. Local councils are required to create ecologically
    friendly and sustainable solutions for urban transportation due to the rising
    number of private automobiles, traffic accidents, crowded roads in the traffic
    network, less public space and stagnant economies. The idea of “smart mobility”
    proposes that travel times may be optimized using a variety of recent and historical
    data, together with information and communication technology, which reduces the
    amount of space used, traffic jams, accidents and the emission of dangerous gases.
    Smart mobility indicators must be established as part of the planning process
    for sustainable urban mobility. During the design and implementation stages, the
    widely adopted notion of smart mobility (a holistic concept) is concentrated on
    the demands of city residents and their quality of life and health. The chosen
    metrics should be quantifiable by indicators in order to serve as guidance for
    accomplishing the sustainable goals [15]. The indicators track how quickly information
    and communication technologies are being adopted. In order to promote improved
    transportation options and their synchronization, apps and systems that draw on
    the gathering and analysis of big data are referred to as “smart mobility.” The
    transition to zero-emission vehicles, the introduction of new sharing (car/travel)
    models, the facilitation of connectivity between vehicles and with other pertinent
    traffic data (pedestrians, infrastructure etc.), also known as “V2X” or “vehicle
    to everything,” and automated vehicles are all part of the smart mobility revolution
    [16].


    There are a number of key requirements for creating a strong future smart city,
    which are also thought of as the foundation for innovative and sustainable technology.
    The idea of future smart cities is essential for raising the standard of living
    and well-being of its inhabitants. A smart city is a wide notion, and for conventional
    cities, taking little steps is more effective. However, creating a new city using
    technology-based planning to create a smart city from the start will be a superior
    alternative. An innovative Mobility as a Service program is required to smoothly
    and intelligently'
