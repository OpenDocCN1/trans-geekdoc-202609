  md: '# # About the Editor


    ![](img/9c1422d4c6a10143e1802787075307de_15_0.png)


    Dr. Nidhi Gupta is currently working as Assistant Professor in the department
    of Computer Applications at the National Institute of Technology Kurukshetra,
    Haryana. Prior to this, she served as Assistant Professor in the department of
    Mathematics and Scientific Computing at the National Institute of Technology Hamirpur,
    Himachal Pradesh. She received the President’s International Fellowship Initiative
    from the Chinese Government to pursue postdoc from the National Laboratory of
    Pattern Recognition, Institute of Automation, Chinese Academy of Sciences, Beijing,
    China, in 2018. She is currently working as Co-PI with Isnartech Pvt Ltd. for
    multiple projects based on artificial intelligence. She received her MTech and
    PhD degrees from PDPM Indian Institute of Information Technology, Design and Manufacturing,
    Jabalpur, India, in 2013 and 2018, respectively. She received a BSc degree in
    Computer Science from the Central University of Allahabad (AU), India, in 2008
    and a MSc degree in Computer Science from the JK Institute of Applied Physics
    and Technology, AU, in 2010. She has qualified with the national-level eligibility
    tests, UGC NET and GATE, in computer science and applications. She is an outstanding
    reviewer of various Scopus indexed national and international conferences and
    journals of repute. She has chaired technical sessions, delivered talks and conducted
    workshops in India. She has been a member of the technical society of IEEE since
    2022. She has published more than 15 papers in several journals of repute and
    national/international conferences along with two book chapters. She has explored
    various countries during her academic visits. Her research interests include computer
    vision, machine learning, artificial intelligence, image Processing, pattern recognition,
    medical imaging, document imaging and CAD systems.'
