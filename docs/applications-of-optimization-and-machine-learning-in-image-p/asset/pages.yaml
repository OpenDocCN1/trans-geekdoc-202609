    +   • Lack of Effective and Reliable Security Protocols: Inadequate IoT security
    standards, evaluation frameworks and protections might result in security breaches
    in smart environments that compromise personal data exfiltration [26].


    +   • Denial of Service (doS/DDoS): Hackers may attempt to perform a denial of
    service (doS/DDoS) on the sensors themselves or on existing hubs in IoT-based
    smart environment networks [7] due to technological advancements. Attackers can
    also get access to the network and use methods like Clear To Send (CTS) and Request
    To Send (RTS) to send mass messages to IoT devices, which can result in DoS attacks
    against genuine IoT devices [27–29].


    # 7.3 PROPOSED FRAMEWORK FOR MALICIOUS ROUTING


    The authors have suggested the Verifiable Key Scheme (VKS) model for participating
    IoT devices. Initially, from the existing network, a pool of authenticated IoT
    devices has been created, and separate keys have been allocated to them. A pool
    of authenticated nodes is chosen by sending false packets to the neighbor devices
    and requesting the shortest path, and the malicious device will drop the packet
    and come in under the suspected device. Suspected devices are further verified
    with the same scheme and by checking whether packets have been received at the
    destination. In this whole process, malicious devices are recognized. Then a list
    of verified devices is made, and new keys are allocated to them.


    +   • Cluster Head Creation: As now an authentication list of IoT devices has
    been created, a cluster head will be chosen with a factor x. This factor x depends
    on a number of parameters like proximity of the IoT device to other devices, battery
    power etc. The number of cluster'
