    # 8.2 COMPUTER VISION


    Today''s technological and innovative era is changing our lives rapidly. The potential
    of such technology is far beyond our wildest dreams. The introduction of modern
    technology like computer vision is making a significant contribution in all fields.
    Among various sectors, agriculture is the one that has started using computer
    vision in its style of operation. Every country stands out in the global market
    because of its agriculture industry, which is considered a boosting economy sector.
    Countries with abundant production dominate the export market. However, many countries
    have high labor costs, underdeveloped manufacturing processes, and a lack of automation,
    which increases the cost of goods produced.


    Humans interpret the real world by using brain-processed vision to understand
    their environment. Computer vision is a field of computer science that uses computer
    systems or machines to achieve comparable results. As the world becomes more human,
    the sub-branch of computer vision seeks to educate computers in order to comprehend
    and understand the visual environment. With computer vision, computers can evaluate
    a series of images or videos and derive accurate item identification from them.
    The science of computer vision is making inroads into agriculture. Computer vision
    has pervaded the entire functioning of the agricultural sector, from increasing
    production through automation to cheaper production costs. With its automation
    and detection capabilities, computer vision has started to develop a stronghold
    in agriculture. Artificial intelligence is one of the most recent agricultural
    breakthroughs. Agriculture is rapidly going digital thanks to drones, robots,
    sensors, algorithms and machine learning. Thanks to the digital tools we use,
    we can quickly collect vast amounts of data and truly optimize crop care procedures
    on a daily basis.


