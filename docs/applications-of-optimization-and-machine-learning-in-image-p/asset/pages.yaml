    # A Machine Learning Technique to Deal with Heart Disease Problems


    Rima Sen and A. Manimaran


    Department of Mathematics, School of Advanced Sciences, VIT-AP University, India


    # 11.1 INTRODUCTION


    Cardiovascular diseases have lately become the leading cause of death worldwide.
    Several advanced techniques and even different statistical prediction methods
    are increasingly being utilized for cardiovascular disease prediction. The results
    of such a diagnostic approach, while using the current algorithms, are insufficient
    in identifying heart disease patients. They also confront a huge hurdle in terms
    of service quality [1–3]. Accurately detecting sickness and efficiently treating
    patients are both critical aspects of service quality. Inadequate diagnosis can
    lead to unfavorable outcomes [4, 5]. Age, gender, smoking, obesity, physical inactivity,
    poor diet, family history, cholesterol, high blood pressure and alcohol use are
    all risk factors for a heart disorder, as are inherited risk'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'factors [6], including high blood pressure and diabetes. Some risk factors
    can be prevented. Aside from those aforementioned variables, lifestyle choices
    such as eating habits, obesity and physical inactivity are also substantial risk
    factors [7–9]. Coronary heart disease, angina pectoris, congestive heart failure,
    cardiomyopathy, congenital heart disease, arrhythmias and myocarditis are all
    examples of heart illnesses [10]. Manually calculating the chances of developing
    heart disease based on risk factors is too challenging. To deal with such medical
    emergencies in the healthcare industry, a prediction system based on ensemble
    learning techniques has been developed. Learning techniques prove to be effective
    in assisting decision making and predictions from the large quantity of data produced
    by the healthcare industry [11–13]. Hence, this paper uses a machine learning
    approach known as a classification to forecast heart disease risk from risk variables
    by examining patient data and classifying the presence of heart disease. It includes
    an ensemble technique of several supervised algorithms [14, 15] such as Naïve
    Bayes [16] and Decision Tree [17], Support Vector Machine [18], and Random Forest
    [19] model to enhance the accuracy of forecasting heart disease risk addressing
    the challenges in the healthcare sector.


    # 11.1.1 Problem Statement


    The major challenge in cardiac disease is its identification. Several tools can
    forecast heart disease, but they are either too expensive or ineffective in quantifying
    the risk of heart disease in humans. Early detection of cardiac diseases can decrease
    the mortality rate and overall consequences of heart disorders. However, it is
    not possible to precisely monitor patients every day in all circumstances, and
    a doctor’s 24-hour consultation is not available since it needs more intelligence,
    time and skill [20]. Due to the availability of a humongous amount of data, various
    machine learning algorithms can be used to analyze the data for hidden trends
    in data. Hidden patterns in medical data can be utilized for health diagnosis
    too [21, 22]. In this research, the ensemble learning technique based on majority
    voting (max voting) is performed on the medical dataset to enhance the performance
    as well as the accuracy measure. The Cleveland dataset [23] is considered to train
    the model as well as to obtain a favorable result after testing it.


    The problem statement framework is shown in Figure 11.1.'
