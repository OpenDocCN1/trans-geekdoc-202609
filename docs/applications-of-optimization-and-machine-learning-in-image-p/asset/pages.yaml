    # 11.3.3 Implemented Algorithms


    There are many open repository datasets [35, 36] on heart disease prediction;
    however, the Cleveland dataset is considered for this study. The proposed framework
    incorporates an ensemble machine-learning method.


    # 11.3.3.1 Ensemble Learning Techniques


    Ensemble learning is a broad meta-approach to machine learning that combines predictions
    from different models to improve predictive performance [14, 15]. There are several
    ensemble techniques in machine learning, such Max-Voting, Averaging, Weighted
    Average, Stacking, Bagging, Blending and Boosting [37]. An ensemble model can
    infer a better decision with higher accuracy as compared to individuals [38].


    In this chapter, the ensemble model for Naïve Bayes [16], Decision Tree [17],
    Support Vector Machine [18] and Random Forest [19] is considered using a Max-Voting
    classifier to improve the accuracy and performance of the proposed model.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 11.3.3.2 Naïve Bayes Classifier


    Bayes’ theorem (also known as Bayes’s rule after Thomas Bayes) links the conditional
    and marginal probabilities of two random occurrences in probability theory. It’s
    frequently used to calculate posterior probabilities based on data. The term “Naïve
    Bayes classifier” refers to a rudimentary probabilistic classification based on
    Bayes’s theorem [39, 40].


    # 11.3.3.2.1 Bayes’s Theorem:


    $P(A / B) = \frac{P(B|A) \times P(A)}{P(B)} , where A, B = events$

    $P(A|B) = $ probability of occurrence of $A$ given $B$ is true.

    $P(B|A) = $ probability of occurrence of $B$ given $A$ is true.

    $P(A), P(B) = $ the independent probabilities of $A$ and $B$.


    A Naïve Bayes classifier assumes that the presence (or absence) of a particular
    characteristic of a class has no effect on the presence (or absence) of any other
    feature. The Naïve Bayes classifier has the benefit of only having a small quantity
    of training data to estimate the parameters (variable means and variances) required
    for classification [41, 42].


    In this research, the addition of the probabilistic approach of Naïve Bayes in
    the model enhances the chances of getting predicted data more accurately.


    # 11.3.3.3 Decision Tree


    A Decision Tree is a graph that illustrates every feasible outcome of a decision
    using a branching strategy. To resolve those categorization issues, the Decision
    Tree technique is more powerful. This approach has two steps: creating a tree
    and applying the tree to the dataset [43, 44].


    Here, the Gini Index algorithm [45] among all Decision Tree methods is chosen
    for this chapter. The Gini Index is a crucial criterion for building decision
    trees. It is a function that measures how well a decision tree is split. Essentially,
    it assists us in determining which splitter is optimal so that we can construct
    a pure decision tree. This measure has a value between 0 and 0.5. The purpose
    of using Gini impurity is to optimize the split and to develop a better ensemble
    algorithm using a pure decision tree [46].


    # 11.3.3.4 Support Vector Machine


    Support Vector Machine is supervised learning used for regression [47] or classification
    [48]. The Support Vector Machine model is an appropriate'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'model to separate or classify the collected data points linearly through a
    hyperplane support vector. The mapping of the data points is the main purpose
    of that classifier [49]. Basically, the mapping technique is performed by support
    vector or kernel estimation. The mapping incorporates both linear and nonlinear
    data information [50, 51].


    In this chapter, the radial basis kernel function [52] is utilized. A radial basis
    kernel is a good classifier in case the data is not linearly separable.


    # 11.3.3.5 Random Forest


    Random Forest is an ensemble learning technique for classification that is powered
    by decision trees and the majority voting mechanism [53]. This method adds some
    additional randomness to the process of developing trees. Instead of looking for
    an essential feature when dividing a node, it looks for the best feature among
    a random group of features [54]. As a result, it lowers overfitting in decision
    trees and decreases variance, enhancing accuracy [55–57].


    In this proposed model, the number of estimators is 1000. Such a maximum number
    of estimators improves the performance of the model as well as reducing the overfitting
    in decision trees [58].


    # 11.3.3.6 Max-Voting Classifier


    The Max-Voting classifier is a meta-classifier that employs majority voting to
    merge any classifier [59]. The class label that a large percentage of the classifiers
    predicted would be the final class label. The following term defines the final
    class label $d_j$:


    ```

    $d_j = mode\{C_1, C_2, ..., C_n\}$

    ```


    where $\{C_1, C_2, ..., C_n\}$ indicates the individual classifiers that participate
    in the voting technique [60]. The Max-Voting algorithm is shown here:


    # 11.3.3.6.1 Max-Voting Algorithm


    Let $c_{i,j}$ be the predicted score on a class of $j$ labels of the $i$th classifier:


    ```

    $\sum_{i=1}^n c_{i,j} = \max_{j=1,...,m} = \sum_{i=1}^n c_{i,j}$

    ```'
