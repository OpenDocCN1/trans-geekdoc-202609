  md: '# CNN-Based Fire Prediction Using Fractional Order Optical Flow and Smoke Features


    Muzammil Khan, Pushpendra Kumar and Nitish Kumar Mahala


    Department of Mathematics, Bioinformatics and Computer Applications, Maulana Azad
    National Institute of Technology Bhopal, India


    # 10.1 INTRODUCTION


    Fires are frequently abrupt, impactful and widespread public and forest areas
    and are difficult to extinguish. Therefore, to protect buildings, offices, forests
    or workplaces from fire, early detection becomes very important [1, 2]. The early
    detection of fire can be done with the help of smoke because it is a starting
    stage of fire before the appearance of flames, and it is highly visible from long
    distances through digital cameras installed in many public locations [3]. However,
    smoke is small at the beginning and has different colors, shapes and textures
    compared to fire. Hence, the detection of smoke is a crucial step in the early
    prevention of fire [4].


    With recent rapid advancements in digital video camera technology, the video cameras
    have become highly affordable and economical [5].'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'These video cameras are either mounted at hilltops or on walls or ceilings
    of buildings, and they continuously record videos in the form of image sequences.
    Since manually processing this huge amount of video data is extremely tedious,
    an automatic approach to classify such events is an inevitable requirement of
    the time. Computer vision and deep learning algorithms together have constituted
    one sort of sophisticated technology that is becoming more prevalent in various
    areas of image processing, such as face recognition, image retrieval, surveillance,
    object detection and classification [6–10]. Detection of fire signatures in terms
    of smoke in videos is one of its fruitful applications [11].


    A considerable amount of work in the detection of smoke in videos is available
    in the literature. Generally, smoke detection framework can be categorized into
    two groups: (1) the traditional computer-vision-based approach and (2) the deep-learning-based
    approach [12]. Computer-vision-based approaches rely on mathematical formulation,
    while deep learning approaches are based on training [13]. In [14], Hanh et al.
    performed direct fire detection using aerial forest videos in which the fire regions
    are detected with the help of RGB, YCbCr and HSI color spaces. Xu et al. [15]
    proposed a framework based on the deep domain adaptation technique, which utilizes
    synthetic data in smoke characterization using a convolution neural network (CNN).
    Moreover, Muhammad et al. [16] discussed a fine-tuned GoogleNet architecture with
    low computing complexity. However, the detection of fire and smoke in natural
    videos faces a basic hurdle of recognition in dynamic texture. For this purpose,
    pretrained CNN models with SVM or random forest classifiers were employed in [17].
    Luo et al. [18] identified the suspicious region based on a dark channel obtained
    from the dynamic update of background. Pundir et al. [11] used the local extrema
    co-occurrence pattern to characterize the foreground regions, intensity and hue
    of smoke in an HSV color space. Ahn et al. [19] utilized CNNs to develop a computer-vision-based
    early fire detection model (EFDM) by using indoor CCTV videos. In their experiments,
    they derived a fire detection speed from EFDM, faster by 307 s compared to general
    fire detectors. All such deep learning techniques employ image (video) datasets.


    In vision-based techniques, object motion is generally extracted with the aid
    of optical flow [13]. The optical flow field is estimated by assuming that the
    same object in different image frames does not show any alteration in its intensity
    values [20–22]. Optical flow-based approaches are used'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'to find the value of motion velocities at the pixel position [23]. In [1],
    optical flow was determined for classifying moving blobs with an adaptive background
    subtraction algorithm. The dual deep learning framework presented in [3] employed
    optical flow calculation for characterizing the motion based on features. In [2],
    Mueller et al., developed two methods for optical flow estimation, which estimate
    the dynamic texture of fire and saturated flames. Their methods provide feature
    vectors for the neural network in the classification task. Wu et al. [24] performed
    a local binary pattern with a dense optical flow estimator in video smoke detection,
    where color maps were converted to HSV color space with specified values of HSV
    parameters. All these techniques rely on integer order derivative-based variational
    models for the extraction of dynamic features of fire and smoke through optical
    flow. However, integer order derivatives are known to work with local and smooth
    functions, whereas fire and smoke manifest large and discontinuous variations
    in the features such as texture, color, shapes, etc. [7, 25, 26]. Therefore, in
    carrying the early prediction of fire, we shall perform smoke detection by evaluating
    its dynamic features using the fractional order optical-flow-based on a nonlinear
    variational model, which generalizes the traditional integer order derivatives-based
    variational models. Fractional order derivatives deal with differentiation of
    arbitrary order and provide a long-term memory, which allows non-local variations
    in the functions to be calculated [23, 27]. Literature has several definitions
    of these derivatives, among which the quite renowned are Riemann–Liouville, Marchaud,
    Grünwald–Letnikov fractional derivatives [28, 29].


    This chapter proposed a novel CNN-based framework for fire prediction using fractional
    order optical flow and smoke features. The smoke is detected through its dynamic
    and static features. The static features are estimated in terms of smoke color
    content, while the dynamic features are determined as fractional order optical
    flow by using a generalized nonlinear fractional variational model. The optical
    flow is represented with the help of color maps and used to find the active region
    of the images (video). Now, using static features and smoke motion sensitive channel
    of color map, a binary mask is developed. This binary mask is employed in extracting
    the active smoke region from color map. The segmented color maps and the reference
    images are simultaneously utilized for the training and testing of a novel designed
    CNN architecture for fire prediction. This architecture is developed with the
    help of the VGG16 and DenseNet121 models. For a thorough assessment, the results
    are evaluated in terms of'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'different metrics such as classification accuracy (Acc), recall (R), precision
    (P), F1-score (F1), hamming loss (H-loss) and AUC (area under the curve). Moreover,
    a dataset of optical flow color maps is generated using 16 fire-smoke videos and
    19 normal (non-smoke) videos. The performance of the proposed framework is compared
    against various existing models through learning and ROC curves.


    # 10.2 METHODOLOGY


    The complete methodology of the proposed framework is depicted in Figure 10.1.
    The video dataset used in this chapter is collected from [30, 31]. This dataset
    is composed of 16 smoke videos (346 frames) and 19 normal videos (250 frames).
    These videos represent several indoor and outdoor scenes such as rooms, forests
    and roads under various conditions of cloud, illumination changes and fog etc.
    Now, from each of the videos, two temporally correlated image frames are taken
    and resized to 384×384. These resized frames are processed using a nonlinear fractional-order-based
    variational model. This process produces a fractional order optical flow field
    corresponding to each pair of image frames. This flow field is a vector field;
    therefore, it is converted into a color map using the color wheel as described
    by [32]. This color map is an RGB image having the same dimensions as compared
    to the reference images. Thus a total of 324 color maps for smoke and 228 color
    maps for normal videos are obtained here. Further, using these color maps along
    with the smoke color information obtained from the corresponding reference images,
    a binary mask is constructed for each pair of images. This binary mask segments
    the smoke active region from the rest of the part in the corresponding color maps.
    Finally, the dataset, which contains total 324 and 228 segmented color maps for
    smoke and normal videos, respectively, along with their corresponding reference
    images, is employed in the training and testing of the proposed CNN architecture.


    ![](img/9c1422d4c6a10143e1802787075307de_177_0.png)


    FIGURE 10.1 Proposed framework for fire-smoke motion detection.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# 10.3 ESTIMATION OF FRACTIONAL ORDER OPTICAL FLOW


    # 10.3.1 Formulation of Nonlinear Fractional Order Variational Optical Flow Model


    At any pixel position, let intensity values be J(X,Y,T) and J(X+δX,Y+δY,T+δT)
    at spatiotemporal coordinates (X,Y,T) and (X+δX,Y+δY,T+δT), respectively. By employing
    the data conservation assumption (BCA) [20], we obtain


    ```

    J(X+δX,Y+δY,T+δT) = J(X,Y,T)  (10.1)

    ```


    where, J:Ω ⊂ R^3 → R is a volume representing a rectangular image sequence. Therefore,
    using Taylor series expansion in Eq. (10.1), we have


    ```

    (∇J)^T w + J_T = 0  (10.2)

    ```


    where ∇J = (J_X, J_Y)^T stands for the intensity gradient in the spatial region,
    w = (μ,v)^T is the desired optical flow field with μ(X,Y) and v(X,Y) as its X
    and Y flow components. Here, J_T denotes the intensity temporal derivative. The
    problem of optical flow estimation using Eq. (10.2) is referred to as an ill-posed
    problem. To convert this problem into a well posed one, it needs to be regularized
    by introducing an additional constraint called the smoothness constraint [20].
    This constraint is laid down on the assumption that all the neighboring pixels
    of any pixel in an image plane move coherently. The general form of smoothness
    terms is as follows:


    ```

    F(μ,v,∇μ,∇v) = F_1(μ,v) + F_2(∇μ,∇v)  (10.3)

    ```


    where F_1 and F_2 are scalar valued functions that are convex in nature. Here,
    F_2(∇μ,∇v) is based on the pixel flow rate. Thus, in general, optical flow is
    estimated with the help of following variational functional [20, 33]


    ```

    E(w) = ∫_Ω [(∇J^T w + J_T)^2 + F_1(μ,v) + F_2(∇μ,∇v)] dX  (10.4)

    ```


    where X = (X,Y). The discontinuous information on images such as texture and edges
    are efficiently preserved by fractional order derivatives. Moreover, fractional
    order derivatives can be evaluated corresponding to an optimal choice of fractional
    order α for which the solutions are stable'
  merge: -1
  img_proc: true
- pgno: 179
