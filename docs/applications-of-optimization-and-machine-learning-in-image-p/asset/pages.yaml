- pgno: 56
  md: 'Recharge WSNs are challenging because of its dense deployment and independent
    nature. As a result, improving the project’s energy efficiency is a top priority.
    Data aggregation in these networks reduces communication network overhead, resulting
    in significant energy savings [10]. Sensors can be split into tiny groups termed
    “clusters” to assist data aggregation through an effective network organization.
    There is a headset and several member nodes in each cluster [18]. The flow of
    data in a networked cluster is shown in Figure 3.1A.


    # 3.2.2 Energy Saving in WSNs


    Due to the limited energy capacity of wireless sensors, they remain a research
    priority. A WSN energy efficiency study was first conducted by Heinzelman et al.
    over a decade ago using clustering, and beam forming to save needless transmissions
    has been recommended by them. There have been several advancements in sensor nodes
    since that time, including additional capabilities. As a result, despite the research
    field’s maturity, this movement toward IoT will necessitate further research [19,
    20].


    The development of sensors and energy models is the first stage in coming up with
    ideas for ways to save energy. The CPU, the sensing unit and the communication
    unit are the three subsystems that use battery power, according to [21]. In addition,
    the authors claim that many wireless node events can be tweaked to reduce power
    waste. Packet overhead, idle listening, overhearing, over-emitting, collisions
    and state transitions are some of the most common causes of network congestion.
    By determining the best transmission power for each node in the network, researchers
    hope to minimize state transitions and connect all sensor nodes in a single cluster.
    For the time being, we won’t be considering any of the other energy-wasting activities.


    It may be possible to save energy by changing sensor states, even though doing
    so requires some of the sensor’s energy. Energy savings can be achieved, for example,
    by putting the nodes into sleep mode, which disables the vast majority of their
    functions [22]. Because the focus of this research is on network connectivity,
    it will not take into account the various node states. Once the network link is
    established for stationary sensors, the next phase of the network goal can then
    be to change modes.


    # 3.2.3 Problem Emergence


    The primary goal of this research is to locate each sensor node in a WSN in such
    a way that it consumes the least amount of power possible. While transmitting
    minimum power, sensors on the network’s edge tends to link to inward nearby sensors.
    As a result, sensors that are located between the network’s edges and its core
    tend to provide complete connectivity'
