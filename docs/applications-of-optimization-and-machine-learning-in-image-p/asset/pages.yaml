    # 11.3.4.2 Data Preprocessing


    The method of transforming raw data into a comprehensible format is known as data
    preprocessing [64]. Importing datasets, dividing datasets, attribute scaling and
    other actions are all part of data preprocessing. Data preprocessing is essential
    to improve the model’s accuracy.


    # 11.3.4.3 Attributes Selection


    Attribute or feature selection includes the selection of appropriate attributes
    for the heart disease prediction system [65]. This is used to improve the efficiency
    of the proposed system. The patient record is uniquely identified by two dataset
    features—sex and age—from the given 14 features in the dataset. The rest of the
    attributes consist of medical information. Medical information is an important
    attribute for predicting heart disease. The model’s attribute selection is based
    on a correlation matrix (Figure 11.10) that is applied to all 13 attributes with
    the target value in order to choose the features with the highest and most positive
    correlation [66, 67].


    # 11.3.4.4 Prediction of Outcome (Disease)


    An ensemble of Naïve Bayes, Support Vector Machine, Decision Tree classifier and
    Random Forest is accomplished to perform the prediction of heart disease. A comparative
    study of the proposed method and other individual algorithms is carried out in
    order to find an effective method for disease prediction in the healthcare field.
    It is observed that the ensemble technique results in superior accuracy than other
    existing individual algorithms in the context of the Cleveland dataset [16–19,
    68].'
