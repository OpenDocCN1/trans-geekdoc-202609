    # 8.3 CONVOLUTIONAL NEURAL NETWORK ARCHITECTURE


    CNN is a type of multilayer network that is helpful for finding patterns in images.
    CNNs generally have three layers: a convolutional layer, a pooling layer and a
    fully connected layer, as shown in Figure 8.3. The convolutional layer is the
    first layer used to extract essential features from the input images. The purpose
    of the pooling layer is to reduce the size of the feature map extracted after
    convolution and thereby to reduce the computational cost and estimation time.
    The fully connected layer consists of weights and biases and is usually placed
    before the output layer. Neurons in this layer have full connectivity, which helps
    map the representation between the input and the output.


