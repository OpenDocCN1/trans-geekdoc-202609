  md: '# 9.7 CLASSIFICATION TECHNIQUES USING MACHINE LEARNING MODELS


    After reducing various unwanted features from the image using DR techniques, the
    resultant image set can be increased using image augmentation techniques. Finally
    the different classification techniques based on the ML model were employed on
    the images to retrieve the desired features from them and make them compatible
    to obtain a fruitful result. Classification techniques based on the ML model uses
    a range of algorithms for classification and recognizes, understands and groups
    concepts, patterns and objects into predetermined classes according to established
    criteria, such as using training datasets. Predictive computations are used to
    assign data to predetermined groups or subpopulations using classification algorithms.
    Classification is the mapping of incoming data to a given class. These techniques
    will sort unsorted data into particular classes according to the training. Many
    criteria, such as Euclidean distance, constructing hyperplanes, nonlinear relationships
    and activation functions, among others, govern how classification algorithms work
    between input and output [54, 55]. Some of the common machine-learning-technique-based
    classification models have been described in a later section.


    The model “sees about an image” when features are taken from photos, and the features
    selected are very problem and object specific. For past classification performance,
    manually extracting typical features was necessary, but it was also a time-consuming
    and expert task. Additionally, many features can’t currently be correctly retrieved
    manually. As a result, it was a long sought-after a method that enabled the automatic
    identification of relevant features for a challenge without a specified explanation
    [56].


    # 9.7.1 Artificial Neural Network (ANN)


    An artificial neural network (ANN) is based on the judgment and architecture of
    the 1000 billion neurons that make up the human brain''s biological neural network,
    which is renowned as an astounding parallel processor [57, 58]. As demonstrated
    in Figure 9.4, it works with nonlinear statistical information and then analyzes
    the nonlinear connection between dependent and independent in parallel. In order
    to identify a novel pattern, nonlinear statistical models, or ANNs, show a complex
    link between inputs and outputs. The major advantage of ANN is that it adapts
    from sample data sets. Random function approximation is the most frequent use
    of ANN. These kinds of technologies enable the development of solutions that efficiently'
