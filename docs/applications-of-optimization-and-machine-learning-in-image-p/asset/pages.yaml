    | **Spatial method** | Relevant, simple to interpret and can be retrieved without
    losing information from any shape | The frequency domain is prone to noise and
    distortions, and the feature is calculated from the altered image. |

    | **Spectral method** | Dependable, with fewer computations required | There is
