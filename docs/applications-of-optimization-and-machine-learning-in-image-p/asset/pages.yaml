    # ### 3.2.5 Checking of Network Full Connectivity


    For a system to be considered fully connected, it must have at least one active
    connection link and be capable of forming an uninterrupted path, as illustrated
    in Figure 3.1C(a). Fake fully connected networks are generated when every node
    has a single connecting link and cannot be connected individually, as depicted
    in Figure 3.1C(b). Full connectivity can be readily achieved and checked in small
    networks with a few nodes. However, the sheer number of nodes in a real IoT application
    makes figuring out how well each one is connected computationally is visually
    difficult.


    The first step in determining connectivity is to calculate the Laplacian matrix
    of the global neighbor matrix \(\Gamma\) . \(n\) is the total number of nodes,
    and \(deg\left(n_i\right)\) is the number of other nodes connected to the \(i^{th}\)
