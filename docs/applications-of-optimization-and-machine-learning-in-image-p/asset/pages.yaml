  md: 'animals, metals or minerals. India is a rich source of traditional medicines
    and medicinal herbs, making it an ideal place to look for new ones. Contemplate
    ayurveda is an Indian traditional medical system that is still utilized today
    due to its effectiveness in treating a variety of disorders holistically. It emphasizes
    total unification of consciousness, mind, body and soul [1, 2].


    Herbs differ from other plants in their color, texture, and odor. Herb identification
    is typically done using organoleptic techniques, which mainly rely on botanists.
    Based only on their unique characters, distinct herb species belonging to the
    same family are become harder to distinguish as a result of their identical physical
    characteristics. Contrary to humans, artificial-intelligence-assisted technology
    is supposed to be able to accurately distinguish various species [3].


    Bioactive substances such as phenolics, anthocyanins, carotenoids and tocoherols
    can be derived through aromatic and medicinal plants with multiple therapeutic
    benefits and pharmacological effects [4]. However, just like other plant recognition,
    the work of physically recognizing medicinal and aromatic plants is challenging
    and time-consuming due to the inaccessibility of expert opinions. Many automatic
    plant or leaf recognition systems have been developed as a result of these issues,
    with the majority of them using machine learning techniques [5–7].


    A branch of computer science called “artificial intelligence” aims to give machines
    additional intelligence. Learning is one of the fundamental prerequisites for
    any cognitive conduct. Most scientists today concur that intellect cannot exist
    without learning. Therefore, machine learning (ML) is one of the main subfields
    of artificial intelligence (AI) study and is really one of the fastest growing
    areas of the research [8]. Artificial intelligence was used by the system to start
    learning that anticipates new objects after learning based on previously trained/learned
    experience. It learns by extracting features, referring to particular quantifiable
    characteristics like more illuminating and exclusionary features [9]. Figure 9.1
    depicts the basic steps of identification through machine learning models.


