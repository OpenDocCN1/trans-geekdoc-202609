  md: 'the final result. Additionally, we analyze the discrepancies among the expected
    and actual results using the error function and then alter the neural network’s
    weights using back propagation [58–60].


    # 9.7.2 Convolutional Neural Network (CNN)


    A CNN is a form of deep neural network that employs filter to learn the many features
    of a picture as input. It can recognize the picture’s main elements and tell one
    thing from another as a result [7, 61]. For example, the CNN gains knowledge from
    the characteristics that differentiate cats from dogs so that it can readily distinguish
    between the two when given the input of cats and dogs. CNNs are distinguished
    from other machine learning methods by their ability to preprocess input on their
    own. Consequently, you might not have to spend a lot of money on data preprocessing.
    The filters may help retain engineering during cold start, but as training progresses,
    they are able to adapt to the acquired features and develop their own filters.
    As a result, CNN is always changing in response to new inputs [62–64].


    # 9.7.3 Recurrent Neural Networks (RNNs)


    The RNN is particularly adept at handling time series and other sequential data.
    We cover some of the most popular recurrent designs being used, such as long short-term
    memory (LSTM) and gated recurrent units, as well as recurrent neural networks,
    as either a feed-forward network extension that enables varying (or even infinite-length)
    sequences to be analyzed [65]. RNNs are feed-forward deep neural networks that
    specialize in temporal modeling. RNNs are distinguished by their capacity to send
    information in time increments. RNNs feature an extra feature matrix for connections
    across time steps in their structure, which improves learning in the temporal
    domain and utilization of the input’s sequential character. RNNs are trained to
    create, at each time step, output with predictions depending on existing input
    and knowledge from prior time steps. An RNN includes three stages of operation.
    It proceeds onward across the hidden layer in the first stage and generates a
    prediction. The loss function is used in the second step to compare the prediction
    to the true value. The loss function displays how well a model performs. The model
    is better if the loss function has a lower value. It then utilizes the error information
    in back-propagation to determine the gradient for every location in the final
    stage (node). The gradients are the amount by which the network’s weights are
    adjusted at each point [66]. The basic representation of RNNs is presented in
    Figure 9.5.'
