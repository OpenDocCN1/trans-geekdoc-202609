  md: '# # 5.4 REGULATORY ENVIRONMENT FOR IOT-BASED E-WASTE MANAGEMENT SYSTEM


    The world took the growing problem of electronic waste seriously in the 1980s
    [13]. The Basel Convention [14], held in 1989, was a major step taken to address
    and prevent the shipping of hazardous waste from developed countries to developing
    countries. Gradually, the bigger economies of the world followed to bring out
    their own legislation to control and regulate the movement of electronic waste
    within or across the boundaries of their land. The United States passed the Electronic
    Waste Recycling Act in 2004 and also regulates the e-waste movement through the
    federal Resource Conservation and Recovery Act. The European Union regulates its
    24 members by the directive 2012/19EU, which came out in year 2019. Similarly,
    Australia, New Zealand, Brazil, Japan, Taiwan, China, South Africa and many other
    countries control their e-waste through their own legislation, following the spirit
    of the Basel Convention of United Nations. India regulates its e-waste through
    the E-Waste Management and Handling Rules 2016.


    IoT devices are relatively new entrants but are in prime focus since the last
    decade in the technology world. It has provided access to real-time data and better
    control over systems operated through multiple connected devices. However, there
    is a clear security risk about privacy and the data for both consumers and enterprises.
    The Global Risks Report [15] (2020) of the World Economic Forum states that, due
    to communication between the linked devices and enormous data transfer, safety,
    security and privacy are the major concerns for the users of IoT devices. IoT
    technology has the inherent ability to generate and collect extensive personal
    data. Practically, IoT environment has two broad challenges: IoT cybersecurity
    and IoT privacy.


    In the United States, the Cybersecurity Improvement Act [13] 2019 guides product
    manufacturers to ensure a minimum security level for the IoT products manufactured.
    The National Institute of Standards and Technology (NIST) looks into issues of
    cybersecurity of the IoT equipment procured by the government. However, the private
    sector has not exerted pressure for compliance. The European Union and UK have
    their NIS (Network and Information System) directive, 2018 which provides cybersecurity
    to national IoT infrastructure through NIS regulations governing digital service
    providers.


    IoT privacy in the EU is protected through the General Data Protection Regulation
    [14] (GDPR), i.e., Directive 95/46/EC, which ensures the safety'
  merge: -1
  img_proc: true
- pgno: 95
  md: '[18] of personal data. The United States does not have any specific law like
    GDPR but has separate federal and state laws like Gramm–Leach–Bliley Act (GLBA),
    The California Consumer Privacy Act (SB-1121) [6].


    To address the challenges across the different corners of the world, the threat
    has been recognized and addressed through various initiatives to protect IoT devices
    and the inherent data within. Indian legislation tries to provide some security
    for the IoT environment through it E-Waste Management and Handling Rules 2016
    and Information Technology Act [16] 2000. Further, framing uniform international
    legislation may be a good approach instead of dealing with IoT security at just
    the regional or national levels.


    # 5.5 CONCLUSIONS


    The stock of electronic waste throughout the world is growing due to rapid changes
    in technology and consumer demand for fast replacement. Due to the hazardous nature
    of e-waste, legislation is becoming more stringent. Under such circumstances,
    the application of the Internet of Things in waste management in general and in
    e-waste management in particular is a hope for achieving the optimum use, refurbishing,
    reuse and recycling of e-waste to support the circular economy.


    It can be concluded that, since electronic waste is being generated at an ever
    increasing rate, its management and the utilization of the full potential of technology
    to extract “good from waste” is undeniably important. Hence the refinement and
    development of methodologies for the identification and recycling of electronic
    waste even more efficiently are what the developing and the developed countries
    should look to and work on in the near future.


