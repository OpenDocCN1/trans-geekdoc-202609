    # 9.7.4 Nearest Neighbor (k-NN)


    A non-parametric and slow learning method that records all accessible examples
    and distinguishes the new tested one using metrics like a distance function is
    generally considered a k-NN model (Figure 9.6). When there is little or no previous
    experience of the data, it is chosen as the best method. Speech, video recognition,
    healthcare, finance, handwriting identification, picture recognition and any sort
    of pattern classification, political science, and statistical estimations are
    all uses of k-NN. When the k-NN technique receives new data, it simply divides
    it into a category that is almost identical to the original data. The k-NN method
    merely retains the information during the training phase [67, 68].


    # 9.7.5 Multilayer Perceptron (MLP)


    An improvement to feed-forward neural networks is the multilayer perceptron (MLP).
    The three different sorts of layers are input, output and hidden layers. Every
    input data that must be handled is delivered to the input layer. A couple of examples
    of tasks that fall under the output layer’s jurisdiction include forecasting and
    categorization. The actual computational mechanism of the MLP is made up of an
    infinite number of hidden layers positioned between the output and input layers
    [69]. Various reviews related to different models are compiled into Table 9.4.'
