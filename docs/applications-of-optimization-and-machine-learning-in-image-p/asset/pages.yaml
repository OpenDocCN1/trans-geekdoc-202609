  md: 'and satisfy current and foreseeable network demand. The Internet plays a massive
    role in today’s day-to-day life. Be it home, school, bank or corporate office,
    we can find wireless networks everywhere [14–16]. Many network designs rely on
    heuristics and intuition, which are subsequently confirmed by simulations and
    tests. The same design cycle is repeated in the event that issues are discovered
    or performance is not adequate. We contend that design based on intuition and
    heuristics is not going to satisfy emerging requirements for network architecture
    and protocols because it is typically constrained in the range of system features
    that will be considered, can easily underestimate the significance of certain
    factors, and result in subpar performance or, even worse, not foresee potentially
    adversarial interactions, resulting in disastrous implementations.


    Instead, networks should be designed and controlled using methods that are methodical
