    # 10.3.2 Numerical Solution


    # 10.3.2.1 Derivative Discretization Scheme


    The estimated optical flow components and their corresponding reference image
    are of the same size \( m \times n \). Therefore, the discretization of \( \mu
    \) and \( \nu \) is described:


    $$\boldsymbol{w} \equiv \boldsymbol{w}(i, j) = \boldsymbol{w}(i\Delta h, j\Delta
    h)$$


    where a pixel position is specified by the index pair \( (i, j) \), and \( \Delta
    h \) represents the side length of a pixel in the image frame, which is generally
    equal to 1. Now, for numerical implementation purposes, the Marchand derivative
    discretization is performed with the help of the Grünwald–Letnikov derivative
    [29]:


    $$D_{+}^\alpha \boldsymbol{w}^T = \sum_{k=0}^{\infty} \omega_k^{(\alpha)} E_X^{-k}
    \boldsymbol{w}^T$$ (10.13)'
