    was developed using CNN classification techniques and was trained on 7176 photos
    of tomato leaves, was created. Ten distinct tomato plant diseases have been recognized
    by the model. Accuracy, the average loss curve and other performance matrices
    were used, and the results were reported to be satisfactory [12].


    A mobile-based application was developed for plant leaf identification by Akiyama
    and coworkers where they examined three CNN models, namely MobileNetV2, Mobile
    Net and VGG19. Images of 33 different categories were used to build the database
    for the model development. For comparing the three CNN models, various performance
    metrics including F1 score, drop-out rate and calculation time were used. In all
    performance metrics, authors found that the MobileNetV2 CNN model was the best
    of the three [13].


    Tang and his group proposed a CNN-based model for diagnosing grape diseases. A
    unique technique comprised of lightweight CNN and the channel-wise attention (CA)
    mechanism is proposed for tiny and low-latency models. The backbones are ShuffleNet
    V1 and V2, with squeeze-and-excitation (SE) blocks employed as a CA technique
    to improve the ShuffleNet design. The proposed model is supported by an available
    dataset of 4062 photographs of grape leaves divided into four classes—three healthy
    and one diseased class. The experiments’ findings demonstrated that the suggested
    technique has been successful and accurate to an acceptable degree [14].


    On the basis of a leaf analysis, Yang and Guo compared various ML models for the
    diagnosis of plant disease. The authors came to the conclusion that machine learning
    models are a crucial and effective technique for obtaining results that can be
    verified quickly after analyzing a significant quantity of data [15].


    Ferentinos presented a deep CNN model for disease identification of plants through
