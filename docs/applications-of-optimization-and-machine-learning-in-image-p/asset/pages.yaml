    measure various physical phenomena. Connectivity of the sensors or the devices
    can be established in a variety of ways including Bluetooth and satellites. Communication
    involves the transmission and reception of data that enables IoT devices to perform
    the functions they are designed for. After the establishment and connection of
    the IoT devices, the sensors function on collecting data from their surroundings,
    which is stored on the cloud. An IoT cloud is a web-based network that stores
    the data collected by the sensors of devices. The wide range of data collected
    on the cloud is then analyzed to leverage and automate processes. Now that the
    surrounding data has been collected and analyzed, it needs to be presented to
    the user for application. “User interface” is the term collectively used for the
    features that are used to interact with the computer systems. It includes screens,
    buttons, tabs etc.


    IoT has a diverse range of applications including smartphones, home appliances
    and automobiles. Here are some of the most common applications of IoT:[4]'
