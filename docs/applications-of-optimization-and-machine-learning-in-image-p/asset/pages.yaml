    specify the distribution. Instead of using the entire dataset, ANN can alternatively
    produce findings based on sample data and can be used to enhance current data
    analysis methods due to their powerful prediction capabilities [59, 60].


    There are different layers present in the ANNs, which are explained as follows:


    +   1. Input Layers: An ANN''s input layer, which is the first layer, accepts
    data in the format of text, numbers, audio snippets, image pixels and other formats.


    +   2. Hidden Layers: The ANN model''s center contains the hidden layers. A solitary
    hidden layer, as in a perceptron, or several hidden layers are possible. These
    hidden layers use the supplied data to execute multiple kinds of mathematical
    computations and recognize patterns.


    +   3. Output Layers: The result obtained through stringent computation conducted
    by the center of the frame is obtained in the output layer. Many factors and hyper-parameters
    can affect how well a neural network performs. These factors play a significant
    role in determining how well ANNs perform. They include factors like weights,
    biases, learning rate, batch size and others. Each node in the ANN is given a
    specified amount of weight. Every node in the network is given a weight. A transfer
    function is used to determine the bias and the input weighting factor. Based on
    the information that the nodes have fired, we receive'
