    # ## 6.1 INTRODUCTION


    IoT devices play a vital role in improving the quality of life of patients by
    monitoring their body parameters to recognize their diseases and to help in sharing
    the data by using the Internet with healthcare providers. IoT has numerous applications
    in the healthcare sector, which is also called the Internet of Medical Things
    (IoMT). IoMT is a network of interconnected devices that store patient data and
    connects patients to doctors remotely and suggest solutions according to parameters
    measured by IoT-enabled devices. The healthcare industry is automated by using
    artificial intelligence and IoT. Nowadays with the help of IoMT, cost and time
    are saved. For regular checkups, there is no need to stand in long queues in hospitals.
    Patients can easily monitor their body parameters with smart wearables, and doctors
    can remotely check the stats of patient data through Internet-connected devices.


    The Internet of Things has expanded human interaction options with the outside
    world while simultaneously enhancing freedom. IoT, with the aid of cutting-edge
    protocols and algorithms, has become a significant factor in advancing global
    communication. It links many gadgets, wearable technologies, household appliances
    and electronic gadgets to the Internet [1].'
