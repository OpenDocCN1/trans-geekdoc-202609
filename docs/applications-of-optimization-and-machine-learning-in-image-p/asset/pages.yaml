    # 10.4 EXTRACTION OF SMOKE MOTION ACTIVE REGION FROM COLOR MAP


    Figure 10.3 illustrates the algorithm for the extraction of a smoke motion active
    region from a color map. The reference and target images are processed using fractional
    order optical flow estimation algorithm. This algorithm produces their corresponding
    fractional order optical flow field as a vector plot. In vector plot representation,
    each vector represents the pixel flow (motion) with respect to the reference images.
    To utilize this flow field in the training and testing of a CNN architecture,
    the vector plots are converted into color maps as described in [32]. These color
    maps contain the same dimensions as compared to the reference images. In color
    maps, different colors delineate various flow directions, and color saturation
    shows flow magnitudes. However, the blue channel of the color maps reflects more
    sensitivity toward upward motion. In general, smoke shows a tendency to diffuse
    in an upward direction [44], therefore the blue channel is extracted from the
    color maps. Hence a dynamic binary mask is developed using the blue channel. Since
    smoke also demonstrates black, gray and nearly white colors due to the variety
    of fuel and air supply [45], a static binary mask is also constructed based on
    the color information. Finally, these dynamic and static binary masks are fused
    to generate the'
