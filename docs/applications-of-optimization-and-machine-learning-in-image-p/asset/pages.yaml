    $\left\{ (D_-^\alpha D_+^\alpha)^T e \right\} w \approx \sum_{(\overline{i}, \overline{j})
    \notin \wp(i,j)} \omega_{p_{\overline{i}\overline{j}}}^{(\alpha)} \{ w(i,j) -
