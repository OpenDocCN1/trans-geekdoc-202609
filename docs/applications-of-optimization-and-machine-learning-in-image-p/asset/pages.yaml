    # 11.3.5 Performance Evaluation Criteria


    The performance of the proposed method is determined by using four metrics: precision,
    accuracy, recall, and F1 score [69]. These four metrics are analyzed using the
    number of true positives, true negatives, false positives, and false negatives
    in binary classifier predictions.


    The percentage of true predictions is termed “accuracy.” The capacity of the classifier
    to discover all the positive samples is measured by recall. Precision refers to
    the classifier’s ability to avoid labeling a negative sample as positive. The
    F1 score evaluates values in the range [0,1], which is the harmonic mean of precision
    and recall [70].


    The metrics are computed using the following formulae:


    Precision: True positives / True positives + False positives'
