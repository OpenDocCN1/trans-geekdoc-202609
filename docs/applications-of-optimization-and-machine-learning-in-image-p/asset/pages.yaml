  md: '# 9.5 FEATURE EXTRACTION


    However, rather than starting with human prior knowledge, the essential step in
    conceptually understanding a software program is to extract useful and effective
    visual characteristics and build models from them. The majority of picture identification
    and retrieval systems are based on color, texture and shape because they are the
    most common visual features. But how well they function is heavily dependent on
    how they use picture attributes. The three different types of feature extraction
    methodologies are region-based, global and block-based features [39].


    # 9.5.1 Color Features


    Among the most significant aspects of captured image is color. Particular color
    properties are described in the context of a particular RGB space or model. Color
    spaces like RGB, HMMD, LUV and HSV have been used in literature. Color features
    can be retrieved from images or regions of interest once the color space has been
    defined. Color histogram, color coherence vector (CCV), color correlogram and
    color moments (CM) are just a few of the major color features present in color
    images [40].


    # 9.5.1.1 Color Histogram


    A color histogram is a graphical description of the color distribution of a picture.
    A histogram’s data is derived by recording the appearance of each conceivable
    color of the respective color model appearing in the image [40].


    # 9.5.1.2 Color Coherence Vector


    The color coherence vector (CCV) approach is more complicated than the color histogram
    method. It works by determining whether each pixel is coherent or incoherent.
    In contrast to an incoherent pixel, which is a member of a tiny connected component,
    a coherent pixel is a component of a big connected component (CC). Establishing
    the criteria by which we determine whether a connected component is large is a
    critical step in making this strategy function [40].


    # 9.5.1.3 Color Moments


    Color moments are measures that help separate photos based on their many color
    characteristics. The color moments provide a measurement for color similarity
    between photos once they’ve been calculated. For applications like image retrieval,
    these similarity values can be compared to the frequencies'
  merge: -1
  img_proc: true
- pgno: 151
  md: '| Color Method | Advantage | Disadvantage |

    | :--- | :--- | :--- |

    | Histogram | Simple and basic calculation | High dimensionality, no spatial information,
    noise sensitivity |

    | SCD | Scalability and compactness on demand | There is no spatial information,
    and if the data is compressed, it is less reliable. |

    | DCD | Compact, robust and perceptive | Post-processing required for spatial
