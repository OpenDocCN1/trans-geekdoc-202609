    | CM | Robust, compact | It is not well enough to represent all color |

    | Correlogram | Statistical information | The cost of calculation is extremely
    high, and it is susceptible to noise, rotation, and scale. |

    | CSD | Statistical information | Very susceptible to rotation, noise and scale
