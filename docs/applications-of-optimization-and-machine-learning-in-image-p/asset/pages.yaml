  md: 'combine multiple transport modes and provide effective mobility services to
    travelers depending on their demands, given the growing number of transport services
    available in cities and technology improvements [17].


    # 4.3.1 Connected and Autonomous Vehicles (CAVs) in Smart Cities


    Vehicles having different sensors to collect data from the surroundings are referred
    to as CAVs. A computer built into the vehicle then processes the data and enables
    the vehicle to operate automatically. More exceptional road safety is anticipated
    for drivers and vulnerable road users with more accessibility and less environmental
    effect with the deployment of CAVs. Promoting autonomous and environmentally friendly
    mobility depends on connectivity [18]. Mobility is viewed as a method of granting
    access to crucial services rather than as a goal in and of itself. Even in the
    most densely populated locations, the use of networked autonomous vehicles will
    expand road capacity and relieve congestion. However, as CAVs gain popularity,
    drivers lose control of their vehicles. This increases the security risk since
    it makes it easier for adversaries to launch effective attacks. The growing connectivity
    of cars, meanwhile, exposes more possible security holes and creates more entry
    points for cyber attacks. The development of CAV must necessarily contend with
    significant attack and security vulnerabilities. Potential vehicle vulnerabilities
    are becoming more visible due to the expansion of wireless vehicle connectivity,
    including Bluetooth, VANET and cellular networks. As a result, cyber attacks may
    be used to take advantage of these vulnerabilities and negatively affect the performance
    and functionality of CAVs [19, 20].


    # 4.3.2 Global Perspective


    Significant changes in the mobility industry have been made possible by the interaction
    of climate change, traffic congestion and the digital revolution. “Mobility as
    a Service” is the new business paradigm that is anticipated to rule in the twenty-first
    century. It combines shared, electric, connected and autonomous automobiles. It
    is now more important to consider how people move from one location to another
    rather than the actual vehicle. The International Transport Forum estimates that,
    if current efforts keep their current pace, global transportation activity would
    more than quadrupled by 2050 [21]. To address this, transportation policy makers
    must reconsider how public space is allocated and modify it to accommodate more
    people. Urban and legislative improvements, such as adding parking spaces, paving
    bicycle lanes, and advancing the development of public'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'transportation networks, will be necessary for future solutions [22]. By 2030,
    the market for smart mobility is expected to be valued around USD 250.3 billion,
    with a CAGR of 20.09% from 2022 to 2030 [23].


    Every year, traffic in Israel becomes worse. Data from WAZE shows that traffic
    rose by 27% in October 2021 compared to February 2020 (just before COVID 19 appeared
    in Israel for the first time). Israel is the OECD country with the worst traffic,
    according to statistics. Infrastructure for mass transportation is still being
    built at a far slower rate than the rate at which the number of private automobiles
    is rising. In Israel, the yearly cost of traffic congestion is estimated to be
    40 billion NIS (about 11.5 billion EUR), and in 2030 that cost is projected to
    rise to 50 billion NIS (14.25 billion EUR). The TomTom index estimates that the
    average Israeli motorist wastes 150–200 hours per year in traffic [24]. In order
    to accelerate the adoption of innovative business and technological concepts,
    the Finnish government is establishing regulatory requirements. The Act advances
    Finland’s goal of offering Mobility as a Service and building a digital mobility
    future that depends on data interoperability and open interfaces. It is a component
    of the larger Transport Code initiative [25]. Smart mobility is one of the cornerstones
    of the smart city, focusing on the utilization of transport systems to assist
    urban traffic and sustainable mobility [26].


    # 4.3.3 Regional Perspective


    By the end of this decade, the market for advanced transportation facilities is
    expected to grow by a staggering USD 320 billion, according to Market Research
    Future (MRFR) 2022 research. The government is leaning toward cutting-edge technological
    tools like the IoT, AI, 5G Internet access, cloud engineering and the like as
    work on smart city projects advances [27].


    According to Niti Aayog, by 2030, 40% of buses in India will be electric; additionally,
    businesses in India that provide and cater to the demand of EV (electrical vehicle)
    buses support this aim [28]. According to the prime minister of India, 100 smart
    cities will be built. The goal of the smart cities project is to build future-proof
    towns that can provide their own water and power needs by recycling waste. An
    increasing number of urban residents will undoubtedly be catered to by smart cities.
    Mumbai, Bengaluru and Delhi have routinely ranked among the top ten most congested
    cities in the world according to TomTom for the past four years. According to
    IQAir, a global pollutant survey conducted in 2019 revealed that 21 of the 30
    most polluted cities were in India, moving the nation up to the fifth spot'
