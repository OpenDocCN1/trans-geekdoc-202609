    # 1.3.5.5 Gradient-Based Optimization Approaches


    Gradient-based mathematical optimization approaches determine the best convergence
    behavior using gradient information. The gradient-based methods can be subdivided
    as the quasi-Newton method, steepest descent method, trust region methods, conjugate
    gradient method, Newton’s method, and non-linear conjugate gradient method. The
    Davidon–Fletcher–Powell method, symmetric rank 1 update method, and Broyden–Fletcher–Goldfarb–Shanno
    method are included in the quasi-Newton method. Similarly, the sequential quadratic/linear
    programming and modified method of feasible directions are the algorithms that
    encounter the non-linear constrained optimization problems. Due to the better
    convergence property and robust results for solving differentiable nonlinear programs,
    sequential quadratic programming algorithm is a commonly used approach. Lin and
    Gea discussed the gradient-based transformation method application in the design
    of complex problems such as steel beam anchor, steel frame or steel bridge [42].
    Raju et al. estimated the optimized self-weight of steel members using the reduced
    gradient method [43]. Hare et al. presented a literature survey on non-gradient
    optimization techniques applied in structural engineering [44]. Gradient-based
    optimization approaches require minimal information and are a simple iterative
    process. Large-scale problems can be evaluated but with less accuracy.


    # 1.3.5.6 Swarm and Evolutionary Optimization Approaches


    Optimization inspired by both natural processes and living creatures is applied
    to real-world complex problems by developing mathematical models by various researchers.
    Darwin evolution, social group behavior, foraging process, etc. are some of the
    natural processes behind the generation of nature-inspired optimization algorithms.
    Swarm intelligence and evolutionary computing methods are two distinguished optimization
    methods having their own separate features used to handle optimization and intractable
    search problems [45–47]. The hybrid algorithms formed of these two methods reinforce
    one another’s efficiency, accuracy and performance, which provide fruitful results
    when applied to complex problems. Swarm intelligence is defined by intelligent
    behavior shown by the collective response of decentralized, self-organized and
    natural'
  merge: -1
  img_proc: true
