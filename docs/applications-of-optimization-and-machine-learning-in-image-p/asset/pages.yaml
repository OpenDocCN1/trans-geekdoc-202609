    # 6.2 ARCHITECTURE OF SMART HEALTHCARE USING IOT


    One of the key sectors that have pioneered the use of the Internet of Things technologies
    is the healthcare sector. This is because IoT devices enable the combination of
    patient-centered care routines with substantial, long-term cost reductions. The
    Internet of Things concept is both robust and deep, and for all the pieces of
    the IoT puzzle to fit together flawlessly, they must all be a part of a carefully
    considered framework. IoT architecture enters the picture at this point, particularly
    in terms of IoT device management.


    Although each Internet of Things (IoT) system is unique, all of them share a similar
    architecture as well as a general procedure. The things are the first component
    of the IoT, which are linked items with embedded sensors and actuators that allow
    them to detect their surroundings and capture data that is subsequently sent to
    IoT gateways. The IoT data collection systems and gateways that collect the vast
    amount of raw data, transform it into digitized streams, analyze it and preprocess
    it before analysis make up the next step [2].


    Edge computing devices, which are in charge of further data processing and improved
    analysis, represent the third layer. Additionally, machine learning and visualization
    technologies may be used at this tier. The data is then moved to data centers,
    which may be installed locally or hosted on the cloud. This is where the data
    is kept, handled and thoroughly examined for meaningful ideas.


    Figure 6.1 represents the architecture of the IoT used in smart healthcare systems.
    In this figure, we have discussed phase-wise analysis of architecture. In the
    first phase, different smart devices like sensors, actuators, monitors, detectors,
    video systems etc. are collected to gather the information. In the second phase,
    the data collected from different devices is unstructured, and we need to preprocess
    the data. Analog data must be combined and transformed into digital form to extract
    meaningful data'
