    # 7.2 SECURITY ISSUES IN IOT


    Security encompasses all the methods designed to safeguard, fix and ensure that
    data in computer systems is protected from hostile assaults. The potential of
    identity theft, computer system infection, personal data'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'leakage and economic espionage are only a few examples of security issues mentioned
    in the daily headlines. The protection techniques used to safeguard network-based
    or Internet-connected devices are called “IoT security.” IoT is an extensive phrase,
    and, as technology has continued to advance, it has only grown even more so. Nearly
    all modern electronics, including watches, thermostats and gaming consoles, have
    some kind of connectivity to the Internet or other devices [19].


    To prevent these devices from being hacked, a range of methods, plans and resources
    known as “IoT security” is deployed. Ironically, the connection of IoT is what
    makes these gadgets more susceptible to hackers. Various security concerns are
    related to IoT security:


    +   - **Data and Information Leakage**: In any IoT smart environment, personal
    information might easily be spilled, leading to security breaches in the absence
    of adequate security systems that shield data and information from malware and
    other hostile intruders [20].

    +   - **Eavesdropping**: Malicious attackers may use unstable network connections
    to steal data as it is being transmitted between the connected IoT devices or
    as it moves within and across IoT-based smart environments, as well as across
    the Internet. This might lead to other, severe security breaches [21, 22].

    +   - **IoT Device Security**: Due to a lack of specialized, globally recognized
    IoT security standards or security assessment frameworks, some devices might be
    manufactured with weak security baselines, including outdated and unpatched embedded
    operating systems and software; weak, guessable, or hard-coded passwords; insecure
    data transfer and storage; among others. Because of this, these IoT devices are
    vulnerable to a range of security threats and attacks [23].

    +   - **Hacking**: The majority of the data and information that IoT devices in
    smart environments acquire may be kept on Internet-accessible platforms like the
    “cloud.” It is well-known that many cloud-based IoT systems and devices have security
    flaws and are readily vulnerable to hacking and assaults since data transfer,
    such as video footage from cameras, may not even be encrypted when delivered over
    the Internet.

    +   - **Ransomware and the Hijacking of IoT Devices**: Many IoT devices may soon
    be simple targets for ransomware attacks due to lax security, a lack of specific
    universally agreed on IoT security standards and evaluation frameworks, and the
    growing use of IoT devices [24].'
