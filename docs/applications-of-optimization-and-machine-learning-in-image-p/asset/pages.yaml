    # 8.5 CONCLUSION


    The Indian economy is an agro-economy that is heavily reliant on agriculture.
    The agricultural sector supports not only the Indian economy but also the industrial
    sector and international commerce in imports and exports. Despite the fact that
    the agricultural sector’s contribution to the Indian economy is decreasing, it
    is the sector with the most significant number of people employed across the nation.
    The impact of artificial intelligence across disciplines is growing all the time.
    Deep learning models are becoming more intelligent, and they can perform complicated
    jobs with ease. Agriculture is a sector that may benefit significantly from technological
    advancements. With some nations failing to satisfy demand and supply needs, it
    is critical to use technology to improve manufacturing'
