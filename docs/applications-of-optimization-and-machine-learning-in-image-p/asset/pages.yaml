    +   - **Connected Inhalers**: These devices avoid conditions that happen suddenly,
    like asthma attacks. This IoT-enabled device monitors the frequency of attacks
    by collecting and analyzing data from the environment sensed by sensors and provides
    relevant information to healthcare providers. The device also alerts patients
    to take inhalers when they forget to carry them [22].

