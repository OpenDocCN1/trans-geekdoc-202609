    # 1.4 CONCLUSIONS


    This study examined the literature of the past few decades keeping the focus of
    different optimization algorithms applied to steel bridge problems. A detailed
    overview of optimization model—types of optimization model; different phases involved
    in the optimization model; theoretical and application-related overview about
    mathematical programming; stochastically, statistically, gradient-, swarm-and-evolution-,
    multi-objective- based optimization approaches applied in steel bridges—is provided
    in the study. The underlying conclusions are discussed based on different optimization
    models applied to different problems in previous studies.


    +   - The optimum placement of sensors using optimization algorithms reduces data
    contamination due to unwanted noise and also reduces the total number of sensors
    required for damage determination.

    +   - The steel bridge designing can be optimally done, which is helpful in reducing
    the overall weight of structure and the minimization of cost expenses.

    +   - The multi-optimization algorithms are capable to deliver multiple optimization
    solutions for various input variables simultaneously.

    +   - The efficiency and optimum configuration of the truss with a large number
    of joints is improved by deploying an evolutionary algorithm with only two variables
    in design, i.e., number of panels and depth of truss.

    +   - Sensitivity analysis is useful in assessing the small variations in input
    variables; also, modern developed software is used to arrive at the optimum section.'
