    # 9.8 VALIDATION OF DEVELOPED MODEL


    After applying all the steps mentioned in Figure 9.4, a machine-learning-based
    model for the identification of images can be formed which could be later utilized
    for the identification of required herbal and spice images. But for making a model
    robust, the validation of the model is one of the important steps and should be
    performed at the end to test the working suitability of the model. Accuracy, precision,
    true positive (TP), false positive (FP), true positive ratio (TPR), false positive
    ratio (FPR), sensitivity, specificity, miss rate, recall, F1 score and CPU elapsed
    time are some of the parameters employed for the validation of a developed machine
    learning model [70, 71].


    +   • **Accuracy:** Accuracy is the proportion of trial data forecasts that were
    correct. It is simple to determine by dividing the total number of forecasts by
    the proportion of accurate estimations. It can be calculated as follows:


    ```

    Accuracy (%) = \frac{Correct prediction}{Total no. of prediction} \times 100

    ```


    Accuracy above 70% is generally considered good for a machine learning model [72].


    +   • **Precision:** The proportion of particular examples (true positives) among
    all the examples predicted belong to a certain class known as precision [73].
    It can be calculated as follows:


    ```

    Precision = \frac{True positive}{True positive + False positive}

    ```'
