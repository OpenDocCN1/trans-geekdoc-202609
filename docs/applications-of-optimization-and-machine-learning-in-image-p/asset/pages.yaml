    heads depends on the participating nodes of the network. However, the cluster
    head communicates and asks for the shortest path only to the authenticated list
    of nodes. Each head circulates the authenticated list to the authenticated nodes
    (IoT devices) of its cluster, as shown in Figure 7.2.


    +   • **Communication of Cluster Head:** Each cluster head communicates and shares
    its authenticated list with other cluster heads, so that, if an authenticated
    node enters another cluster head’s network range, its request can be approved
    by the cluster head.


    +   • **Middle Nodes:** These are nodes that are in the network range of two networks.
    These middle nodes are used for inter-cluster communication.


    +   • **New Key Generation:** New key = ID of the IoT device given by the cluster
    head (I) + verified function (f). A (adjustment) = the total number of participating
    nodes of the complete network% authenticated list of the individual cluster.'
