  md: '# ## 9.5.3 Texture Features


    A variety of images can make use of the varied characterization of texture. Human
    visual systems are hypothesized to use texture for interpretation and detection.
    Normally, color is a pixel attribute, while texture can only be determined from
    a group of pixels. Several methods have been investigated to extract texture features.
    According to the domain in which the feature extraction is taken, they can be
    categorized into two groups: methods for extracting spatial texture features and
    spectral texture features [42].


    # ## 9.5.3.1 Spatial Method


    By calculating pixel statistics or identifying local pixel patterns in the source
    image domain, texture characteristics are retrieved using this method.


    # ## 9.5.3.2 Spectral Method


    Texture features can be identified by converting an image into frequency domain,
    and then the features are calculated from the transformed image. Some advantages
    and disadvantages are included in Table 9.3.


