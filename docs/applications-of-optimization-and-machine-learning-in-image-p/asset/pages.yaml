    # ## 7.1 INTRODUCTION


    The Internet of Things (IoT) is a ubiquitous, worldwide network that supports
    and provides a system for the observation and management of the physical world
    through the gathering, processing and analysis of data produced by IoT sensor
    devices. The number of linked devices is expected to increase dramatically to
    60 billion by 2022 [1–3]. Our everyday objects, including vehicles, refrigerators,
    fans, lights, mobile phones and other operational technologies, such as manufacturing
    infrastructures that are now becoming globally networked systems, are the key
    drivers of this expansion. It is clear that security will be a crucial enabler
    for the implementation and usage of the majority of IoT applications, particularly
    secure routing among IoT sensor nodes [4]. Methods must thus be created to provide
    safe routing connections for devices made possible by IoT technology. IoT is one
    of the most important technologies of the twenty-first century. The capacity to
    connect everyday objects, such as home appliances, cars, thermostats and baby
    monitors, to the Internet via embedded devices has'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'made continuous communication among people, processes and things possible [5].
    Minimal human engagement is required for exchanging and gathering data by physical
    objects thanks to low-cost computers, the cloud, big data, analytics and mobile
    technologies. In today’s hyper-connected environment, digital technologies have
    the ability to record, monitor and change every interaction among linked things.
    Though they collide, the physical and digital worlds coexist [6].


    By 2025, Internet nodes may reside in ordinary items—including, according to NIC,
    “food containers, furniture, paper documents, and more.” Beginning with the notion
    that “public demand paired with technological improvements might promote widespread
    dispersion of an Internet of Things (IoT) that could, like the current Internet,
    contribute immensely to economic development,” it identifies potential future
    prospects [7]. It is also emphasizing that risks may be associated with the broad
    use of such a device. In fact, it is stressed that “the IoT might transmit such
    dangers considerably more widely than the Internet has to date” if common devices
    start to pose information security issues [8, 9].


    IoT and other networked computer systems have become indispensable components
    of daily life for people, as shown in Figure 7.1. The size of these networks,
    the heterogeneity at different tiers, the emergence of new network technologies
    and new business models are all still expanding [10–13]. The old network architecture
    and protocols are under pressure and sometimes even perform poorly in the face
    of new settings, which goes hand in hand with the increase in complexity. Therefore,
    new architectures are required to enable new applications, efficiently utilize
    network resources


    ![](img/9c1422d4c6a10143e1802787075307de_111_0.png)


    FIGURE 7.1 Internet of Things.'
