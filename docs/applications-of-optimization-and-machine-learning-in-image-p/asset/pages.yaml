    # 1.3.5.2 Scalarization-Based Optimization Approaches


    Multi-objective optimization works within constraints and helps in obtaining an
    optimum solution for one or more objectives conflicting simultaneously. While
    finding a single solution for real-life problems, variation in an objective may
    tend to degrade other objective(s); to encounter such problems, multi-objective
    optimization approaches are utilized to obtain optimum solutions. A large number
    of multi-objective optimization approaches existing nowadays includes the weighting-based
    approach, goal-progroming-based approach, ε-constraint-based approach, Pareto-
    and non-Pareto-based approach. The further subdivision of Pareto-based approach
    gives Pareto-based elitist and non-elitist approach. The elitist approach is formed
    of Pareto archived evolutionary strategy, strength Pareto evolutionary algorithm,
    elitist non-dominated sorting genetic algorithm and Pareto-envelope-based selection
    algorithm. The non-elitist approaches involve a multi-objective niched and non-dominated
    sorting genetic algorithm.


    The population-based non-Pareto approaches based on population consist of lexicographic
    ordering, vector-evaluated genetic algorithm, contact theorem, game theory, non-generational
    genetic algorithm. Kim and Weck discussed the use of the adaptive changing weighted
    sum method rather than selecting prior weights for determining Pareto optimal
    solutions for bi-objective optimization [27]. Ok et al. studied the application
    of stochastic of Pareto optimal solutions to successfully assess the damage locations
    in a two-span steel continuous laboratory bridge. The countering of sensor noise
    is done by collecting large data sets under appropriate loading cases [28]. Liang
    et al. evaluated and compared the performance of a non-dominated sorting genetic
    algorithm II, a multi-objective particle swarm optimizer and a group search optimizer,
    in determining the'
  merge: -1
