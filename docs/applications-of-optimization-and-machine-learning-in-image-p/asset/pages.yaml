    +   - Recall: Recall is the proportion of examples anticipated to belong to a
    class relative to all of the examples that actually do [76].


    # 9.9 TRANSFER LEARNING


    To achieve the desired accuracy, a new machine learning model must be developed
    using a great deal of data. For achieving high accuracy, it is necessary to train
    the model on large datasets; otherwise, the developed model will not work well.
    Developing a new model for identification of herbs requires a large dataset that
    is quite not possible. To overcome this problem, the concept of transfer learning
    came into play. Transfer learning is an approach in which a pretrained model can
    be applied in a developing model. The model has already been pretrained in large
    datasets such as ImageNet and can be used for extracting the feature from images
    of the new model. As discussed, a CNN model has been largely employed for the
    identification of herbal images, so in this chapter further we have discussed
    the various CNN-model-based transfer learning models that can be employed for
    the identification of herbal plants [98]. Various CNN pretrained models are discussed
    next.


    # 9.9.1 VGGNet


    VGG-16, presented at ILSVRC2014, was the Visual Geometry Group''s (VGG) first
    successful ImageNet architecture, which was followed by VGG-19 [98]. By substituting
    numerous small kernel-sized filters for a single big kernel-sized filter, these
    models improve upon AlexNet and for VGG-16 and VGG-19, creating 13 and 16 convolution
    layers, correspondingly.


    # 9.9.2 CaffeNet


    This CNN model resembles AlexNet a bit. In contrast to AlexNet, CaffeNet inserts
    the pooling layer well before the normalization procedure and does not employ
    data augmentation. CaffeNet therefore marginally enhances AlexNet''s computational
    performance by doing data dimension reduction prior to normalization.


    # 9.9.3 Inception


    The GoogLeNet model, also known as Inception-V1, made an effort to increase VGGNet''s
    effectiveness in terms of memory consumption and'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'runtime without compromising accuracy [99]. This was accomplished by removing
    the VGGNet activation functions that were duplicated or zero due to their correlations.
    In order to approximate the sparse interconnections among the activation functions,
    GoogleLeNet developed and incorporated the Inception module. Three additional
    versions were released after Inception-V1 that substantially improved the architecture.
    Batch normalization was utilized by Inception-V2 for training [100]. To increase
    the computation cost of convolution layers, Inception-V3 suggested a factorization
    technique [101]. A uniformly simplified Inception-V3 design with much more Inception
    modules was released in Inception V-4 [102].


    # 9.9.4 ResNet


    Accuracy saturation and disappearing gradients may result from CNN models having
    too many layers. This issue is addressed by residual learning, which serves as
    the foundation of ResNet CNN [98]. At the conclusion of each convolution layer,
    CNN models that came before ResNet learned features at various levels of abstraction.
    ResNet does not learn features; instead, it learns residuals, which are the learned
    features from the input for each convolution layer. Identity shortcut connections,
    which include linking a layer’s input to x other layers, are used to do this [103].
    ResNet variants like ResNet-34, ResNet-50 and ResNet-101 use a varied number of
    layers.


    # 9.9.5 Xception


    Extreme Inception, sometimes known as Xception, is a modified Inception-V3. This
    CNN model uses depth-wise separable convolution to separately train the picture’s
    spatial and channel dimensions. Xception performs a little better on ImageNet
    while having approximately the same number of variables as InceptionV3 [104].


    # 9.10 CONCLUSION AND FUTURE PROSPECTS


    Manual identification of medicinal plants/herbal medicines involves a substantial
    amount of labor and is subject to human error. Automatic plant identification
    might be a solution to these issues, but developing such a system involves great
    resources, including a sizable database, in-depth understanding of plant morphology
    and expertise in computer programming. The majority of current research on autonomous
    plant identification systems tests its effectiveness using pre-existing datasets
    that were created in a confined space. Therefore, more research on images under
    different lighting circumstances and with complicated backgrounds needs to be'
  merge: -1
  img_proc: true
