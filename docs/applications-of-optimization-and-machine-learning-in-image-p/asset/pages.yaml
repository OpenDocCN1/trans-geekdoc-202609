- pgno: 28
  md: 'optimal weight of a planar steel truss structure [29]. Li et al. determined
    the optimal position of sensors on a composite plate by analyzing the measured
    impact responses through principal components, wavelet decomposition, and a non-dominated
    sorting genetic algorithm [30].


    The multi-objective optimization approaches work in both complex as well as non-complex
    spaces and help in finding points on the Pareto optimal front. The weighted method
    is suitable for convex issues, but the ε-constrained method can work for both
    convex or non-convex issues. Goal programming requires selection of a definite
    set of aspirational goals and finding the minimum distance up to them. Its limitation
    includes that it requires selection of appropriate constraint values.


    # ### 1.3.5.3 Stochastic Process Optimization Approaches


    Stochastic optimization approaches are a valuable asset in analyzing, designing
    and operating today''s modern systems sorting along with the difficulties of percolating
    system noise, the high non-linear behavior of system or analysis concerned with
    high dimensions. Stochastic optimization approaches are used to analyze engineering
    problems defined using random variables having known probabilities [31]. Stochastic
    approaches include Markov processes, reliability theory, statistical decision
    theory, renewal theory, queuing theory and simulation methods. Huang et al. used
    stochastic modeling to observe the fatigue crack growth in steel members and optimized
    the cost-effective maintenance repairs required during the remaining life span
    of the bridge [32]. Frangopol et al. proposed the stochastic dynamic-programming-based
    optimization for planning steel bridge maintenance and also determined the most
    suitable combination available for a steel bridge network [33].


    Stochastic process optimization approaches combine both linear programs and simulation,
    which helps in minimizing uncertainties and in achieving accurate meaningful results.
    The best solution is obtained after repetitive refining and development of alternate
    solutions. These models create error in optimization function as they become corrupted
    due to unwanted noise.


    # ### 1.3.5.4 Statistical Optimization Approaches


