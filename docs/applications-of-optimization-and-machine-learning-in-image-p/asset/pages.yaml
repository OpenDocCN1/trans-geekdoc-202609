  md: '# Optimal Configuration of IOT Cluster with Full Connectivity with Minimum
    Transmission Power Using SA and BO Algorithms


    Sowjanya Kotte and Satish Kumar Injeti


    Kakatlya Institute of Technology and Science and National Institute of Technology,
    Warangal, Telangana, India


    # 3.1 INTRODUCTION


    The Internet of Things (IoT) has developed into an essential component of our
    contemporary way of life [1]. Things, things, and more things, including devices
    that serve us daily, are required to do so efficiently to communicate so as to
    bring comfort with relatively little human interaction and intervention. When
    it comes to communication between the nodes, efficiency in the use of energy is
    of the utmost significance. Therefore, it is necessary to come up with various
    strategies to ensure efficiency so that no energy is wasted between signal transmission
    and reception and so that time is not wasted among the various nodes. Nevertheless,
    a decreased amount of transmission energy causes problems with connectivity. As
    a result, in'
  merge: -1
  img_proc: true
