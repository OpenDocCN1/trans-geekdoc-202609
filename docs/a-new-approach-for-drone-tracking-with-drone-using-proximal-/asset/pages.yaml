    \ drone tracking drone model.\n\nwas introduced to standardize the development\
    \ of RL problems and algorithms in Python. We use PyBullet to model the forces\
    \ and torques acting on each quadcopter in our Gym and leverage the physics engine\
    \ to calculate and update the kinematics of all the vehicles. During the agent's\
    \ training, as in the standard operation in an MPD framework, an action is taken\
    \ from the environment, which updates the internal state. The result returns a\
    \ reward and state corresponding to the action taken. This repeats throughout\
    \ the set cycle. The reward value returned at each step is determined by the function\
    \ described in Section 2.2.3. The upward movement of the leader drone will teach\
    \ the follower drone, which is in the starting position, the path to follow.\n\
    \n# 2.2. Software functionalities\n\nIn this section, the functions of the software\
    \ used in the study carried out for drone tracking are explained\n\n# 2.2.1. Distributed\
    \ deep reinforcement learning\n\nIn RL theory, unlike other machine learning methods,\
    \ no prior knowledge is given. The aim is to maximize the rewards for future actions\
    \ by using the experiences gained after exploring the environment. There are two\
    \ basic elements in RL, the agent and the environment. Two distinctive features\
    \ of RL; trial and error search and delayed reward feature [25].\n\n**Agent:**\
    \ A learner and decision maker in an environment. Sometimes the agent can be a\
    \ drone performing a task or a robot learning to stand.\n\n**Environment:** The\
    \ world created for an agent to learn something. This can sometimes be the exact\
    \ environment observed by the agent, such as in arcade games. Sometimes it can\
    \ be a partially observed environment, such as a camera image.\n\nThe agent and\
    \ the environment interact at each t time period. At each step t, the agent receives\
    \ a representation of the environment st ∈ S, and chooses an action from the set\
    \ A(S). One step later, the agent receives a numerical reward (rt ∈ R) as a result\
    \ of the interaction and sets a new state (st+1) [26]. In Fig. 3, the operation\
    \ of the DRL is visualized.\n\nDeep Reinforcement Learning (DRL) is basically\
    \ the same as RL. However, the main difference is that it uses deep learning algorithms\
    \ instead of experience tables for action choices. The best example of this is\
    \ the Atari games developed by Google DeepMind. Especially in the fields of computer\
    \ vision, voice recognition, and robotics, where great strides have been made\
    \ in recent\n\nyears, large datasets need to be trained. Normally the estimation\
    \ of the value function can be represented in a tabular form.\n\nHowever, the\
    \ large continuous state spaces that occur in real-world problems slow down the\
    \ training considerably. In this case, the problem is solved using neural networks\
    \ [27]. The aim of the agent is to make the neural network closer to the optimal\
    \ action-value function by maximizing the cumulative reward, as shown in Eq. (1).\n\
    \n```\nQ' (s, a) = max_\\pi E { R_t + \\gamma R_{t+1} + \\gamma^2 R_{t+2} + \\\
    cdots | s_t = s, a_t = a, \\pi }\n```\n\nWith the developments in machine learning,\
    \ especially in the field of robotics, DRL had to improve itself. Distributed\
    \ RL has succeeded in increasing the pace of learning by distributing learning\
    \ among many workers. In addition, environmental knowledge learned per unit time\
    \ also increases. Gorilla is one of the pioneering architectures in this field.\
    \ After Gorilla, current distributed architectures such as A3C, IMPALA, APE-X,\
    \ D4PG have been used. In this architecture, the goal is to gain experience using\
    \ multiple actors to update the weights [8]. All used actors can access a trained\
    \ system at the same time. Distributed Deep Reinforcement learning architecture\
    \ is described in algorithm 1 and algorithm 2 [28].\n\n```\nAlgorithm 1 Worker\
    \ K: ComputeGradient\nstate: Replay dataset D_k, game state s, target model theta,\
    \ target model generation i\nFetch model theta and iteration number n from server.\n\
    if i >= c then\n    theta^- = theta\n    t = t(NC) + 1\n    q = max { (N_{max-t})\
    \ / (N_{max}), 0 }\n    epsilon = (1-q)*epsilon_{max} + q*epsilon_{min}\n    Select\
    \ action: a = { max_a Q(theta(s), a, w), p=1 - epsilon random action otherwise\n\
    Execute action a and observe reward r_t and frame x_{t+1}\nAppend (s_t, a_t, r_t,\
    \ x_{t+1}) and preprocess phi_{t+1} = O(x_{t+1})\nStore experience (phi_t, a_t,\
    \ r_t, phi_{t+1}) in D_k\nUniformly sample minibatch of transitions X from D_k,\
    \ where X_t=(phi_t, a_t, r_t, phi_{t+1})\nSet y_j = { r_j if phi_{j+1}_terminal\
    \ (r_j + gamma*max_{a'} Q(phi_{j+1}, a'; theta') otherwise\ndelta theta = nabla_theta\
    \ F(theta; X) = 1/|B| sum_{t=1}^B V_a ( 1/2 (Q(theta, a_t) - y_t)^2 )\nSend delta\
    \ theta to parameter server\n```"
