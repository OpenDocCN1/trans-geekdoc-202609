  md: "# A new approach for drone tracking with drone using Proximal Policy Optimization\
    \ based distributed deep reinforcement learning\n\nZiya Tan a,*, Mehmet Karaköse\
    \ b\n\na Tokat Gaziosmanpaşa University Tokat, Turkey\nb Fırat University Elazığ,\
    \ Turkey\n\n# ARTICLE INFO\n\n+   Article history:\n+   Received 15 March 2023\n\
    +   Received in revised form 29 July 2023\n+   Accepted 6 August 2023\n+   \n\
    +   Keywords:\n+   Distributed learning\n+   Drone tracking\n+   Reinforcement\
    \ learning\n+   Proximal Policy Optimization\n\n# ABSTRACT\n\nIn this paper, a\
    \ distributed deep reinforcement learning algorithm based on Proximal Policy Optimization\
    \ (PPO) is proposed for an unmanned aerial vehicle (UAV) to autonomously track\
    \ another UAV. Accordingly, this paper makes three important contributions to\
    \ the literature. The first one is the development of an efficient UAV tracking\
    \ algorithm, the second one is the presentation of a deep reinforcement learning\
    \ approach that can be adapted to the problem, and the third one is the introduction\
    \ of a generalized distributed deep reinforcement learning platform that can be\
    \ used in various problems such as tracking, control and mission coordination\
    \ of UAVs. In order to validate the developed approaches, the PPO algorithm is\
    \ simulated with the deep reinforcement learning algorithm in a distributed and\
    \ non-distributed manner, a follower UAV is trained in different scenarios and\
    \ the distributed and non-distributed performances of the training using CPU are\
    \ obtained, scenarios using general and adaptive learning algorithms are given,\
    \ and finally, the performances of the algorithms developed in the paper are presented\
    \ explicitly.\n\n© 2023 The Author(s). Published by Elsevier B.V. This is an open\
    \ access article under the CC BY license (http://creativecommons.org/licenses/by/4.0/).\n\
    \n# Code metadata\n\n| Current code version | V1.0 |\n| Permanent link to code/repository\
    \ used for this code version | https://github.com/ElsevierSoftwareX/SOFTX-D-23-00170\
    \ |\n| Permanent link to reproducible capsule | https://github.com/ziya44/take_off_drone.git\
    \ |\n| Legal code licence | MIT Licence |\n| Code versioning system used | None\
    \ |\n| Software coding languages, tools and services used | Python |\n| Compilation\
    \ requirements, operating environments and dependencies | Ubuntu 20.04 |\n| If\
    \ available, link to developer documentation/manual | |\n| Support email for questions\
    \ | ziya.tan@gop.edu.tr |\n\n# 1. Motivation and significance\n\nDeveloped in\
    \ the early 1980s, Reinforcement Learning (RL) [1] is one of the important areas\
    \ of machine learning. RL is a subfield of Machine Learning in which an agent\
    \ interacting with an environment learns the optimal action selection policy by\
    \ receiving feedback from the environment. RL algorithms learn iteratively: at\
    \ each iteration, the agent observes its state and chooses an action that leads\
    \ to the state of the subsequent environment. Then,\n\nthe agent receives a reward\
    \ or penalty and updates the value function representing the goal to maximize.\
    \ By exploring the environment and gathering this information, agents learn how\
    \ to maximize long-term reward. Fig. 1 shows the agent-environment interaction\
    \ for reinforcement learning approaches.\n\nThe benefits of distributed systems\
    \ in reinforcement learning are demonstrated through the RLlib [2] library. The\
    \ use of distributed systems in solving such complex problems will enable more\
    \ parameters to be trained in less time. Therefore, learning the environment will\
    \ be easier. Especially for UAVs, the importance of distributed systems comes\
    \ to the forefront when it is considered that more than one algorithm needs to\
    \ be trained at the same time. This approach decentralizes the learning event,\
    \ in\n\n* Corresponding author.\nE-mail addresses: ziya.tan@gop.edu.tr (Ziya Tan),\
