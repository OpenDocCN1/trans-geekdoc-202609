    # 2.2.2. Proximal policy optimization (PPO)\n\nPPO is a gradient-based reinforcement\
    \ learning method. This method aims to optimize the objective function using stochastic\
    \ gradient descent. During the training phase, the PPO agent estimates the probabilities\
    \ for each action that might take place and randomly selects the action based\
    \ on this value. Similar to the Trust Region Policy Optimization (TRPO) objective\
    \ function, Eq. (2) defines the odds ratio between the new policy and the old\
    \ policy.\n\n\\(r(\\theta) = \\frac{\\pi_\\theta(a|s)}{\\pi_{\\theta_{old}}(a|s)}\\\
    ) (2)\n\nThe objective function of TRPO can be updated as in Eq. (3).\n\n\\(j(\\\
    theta)^{TRPO} = E \\left[ r(\\theta) \\hat{A}_{old}(s, a) \\right]\\) (3)\n\n\
    Without some constraints, this objective function can cause instability or slow\
    \ convergence rate. The PPO uses the policy rate (\\(r(\\theta)\\)), which is\
    \ about 1 without complex restrictions. This range is set from 1-\\(\\varepsilon\\\
    ) to 1+\\(\\varepsilon\\) thanks to the \\(\\varepsilon\\) hyper parameter, which\
    \ is set to 0.2 by default. After these adjustments, the objective function of\
    \ PPO can be written as Eq. (4).\n\n\\(f^{CLIP}(\\theta)\\)\n\\(= \\mathbb{E}\
    \ \\left[ \\min \\left( r(\\theta) \\hat{A}_{old}(s, a), \\text{clip} \\left(\
    \ r(\\theta), 1 - \\varepsilon, 1 + \\varepsilon \\right) \\hat{A}_{old}(s, a)\
    \ \\right) \\right]\\) (4)\n\nIn Eq. (4), the clip function determines the policy\
    \ ratio with values between [1-\\(\\varepsilon\\), 1+\\(\\varepsilon\\)]. Since\
    \ the PPO objective function takes the minimum value between the original and\
    \ clipped values, it prevents bias toward a negative action.\n\n# 2.2.3. Reward\
    \ function\n\nDuring the tracking process, only the x y z position and yaw angle\
    \ of the drone approaching the target are adjusted. The flight controller automatically\
    \ adjusts the roll and pitch angle to follow the target, moving the fighter to\
    \ the next set point. Unless the drone moves forward, the roll and pitch remain\
    \ zero and the drone maintains its position. In the LeaderFollower environment,\
    \ the reward function consists of the rewards earned by the follower drone by\
    \ following the altitude of the tracked drone. The reward function is shown in\
    \ Eq. (5).\n\n\\(r_0 = -\\|[0, 0, 0.6] - x_0\\| \\frac{2}{2}, \\quad r_1 = -0.6\
    \ \\left( z_1 - z_0 \\right)^2\\) (5)\n\n# 2.2.4. Hyperparameters of the software\n\
    \nDuring the training, the architecture of the PPO algorithm in both experiments\
    \ was arranged as shown in Table 2. The training was conducted on a computer with\
    \ an Intel Core i7-5500 CPU 2.4GH*4 processor.\n\nThe first experiment is created\
    \ to measure the effect of reinforcement learning used in drone simulation. Thus,\
    \ an advanced experiment is presented on quadcopter UAVs using reinforcement learning\
    \ algorithms to achieve the goal and complete the mission. In this experiment,\
    \ the training was designed non-distributed and used only the CPU. The parameters\
    \ used for the DDRL algorithm trained as 300000 steps are shown in Table 3.\n\n\
    The second experiment distributed the PPO algorithm among more than one worker.\
    \ The only difference in the parameters used according to the first experiment\
    \ is the number of workers. In the second experiment, the number of workers was\
    \ determined as 4. Thus, we can compare the results of the two experiments.\n\n\
    In this experiment, the GPU was not used. The agent is trained by four different\
    \ workers with the help of distributed architecture using only CPU. The experiment\
    \ was trained for 300000 time steps and the rewards the agent received from the\
    \ environment were given compared with the first experiment data.\n\n# 3. Illustrative\
    \ examples\n\nThe software used in this study addresses motion control problems,\
    \ object tracking, and vertical ascent for a quadcopter. A gradient-based deep\
    \ RL approach is used to generate a control strategy. This paper presents two\
    \ different approaches to train the DRL algorithm. The first approach trains the\
    \ learning algorithm together with a distributed architecture. The second one\
    \ is trained in a non-distributed manner. The training is performed using CPU.\
    \ In order to increase the success of training and reduce the computational cost\
    \ in such complex problems, we have shown through experiments that the CPU alone\
    \ cannot be successful and can be more successful with CPU multiple workers when"
