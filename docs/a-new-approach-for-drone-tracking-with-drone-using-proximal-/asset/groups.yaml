    \ 6 秒钟的跟踪功能。在此期间，第二个实验大约比第一个实验成功十倍。\n\n追随者无人机在垂直平面上执行了 6 秒钟的跟踪功能。在图 4 中，模拟了无人机跟踪。\n\
    \n表 4 显示了文献中一些特殊研究的结果，这些研究与本文根据所使用的环境和 DRL 算法所进行的实验相似。分析表 4 时，可以看出，根据使用强化学习的环境不同，会获得平均奖励或任务成功率等不同的效果。分布式系统在无人机跟踪问题中尚未广泛使用，这使得结果难以比较。此外，由于本文提出的方法旨在证明分布式系统在无人机跟踪中优于非分布式系统，因此无法将其与类似问题进行比较。\n\
    \n该软件是一段代码，用户只需满足一些基本要求即可轻松使用和安装，无需其他东西。特别是，用户可以自定义人工神经网络并更改仿真环境。因此，它可以广泛用于学术和科学研究。该软件还使研究人员更容易将分布式架构与强化学习算法相结合。由于使用\
