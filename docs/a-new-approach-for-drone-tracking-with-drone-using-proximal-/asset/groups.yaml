    \n### 2.2.3. 奖励函数\n\n在跟踪过程中，仅调整接近目标的无人机的 x、y、z 位置和偏航角。飞行控制器自动调整滚转角和俯仰角以跟随目标，将战斗机移动到下一个设定点。除非无人机向前移动，否则滚转角和俯仰角保持为零，无人机维持其位置。在\
