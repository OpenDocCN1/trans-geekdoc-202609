    researchers to get more out of CPU-based deep reinforcement learning software.
    In this context, the problem of drone tracking with a drone is addressed and two
    different experiments are conducted; it is observed that the distributed deep
    reinforcement learning software is more successful than the non-distributed software.
    According to the data obtained from the experiments, the number of steps performed
    in each iteration is approximately 67% higher in distributed training. According
    to the reward graphs of the training results, the distributed algorithm was more
    successful. In the algorithms trained in 300000-time steps, the second successful
    experiment had an average of –54.78 rewards during training. This value is –559.49
    for the non-distributed algorithm.


    According to the test results in Section 4.1, it was observed that the success
    of the first experiment in the training phase did not change in the test results.
    Accordingly, it is concluded that the UAV trained with the distributed PPO algorithm
    is more successful in tracking the target drone. Our study will contribute to
    filling the gap in the literature on the synchronized use of reinforcement learning
    with distributed systems in unmanned aerial vehicles. It will also help in developing
    realistic DDRL applications for unmanned aerial vehicles.


    Our future plan is to develop a novel algorithm for drone detection and tracking
    so that the tracking drone can perform its mission successfully regardless of
    the environment.


