    ## 1. Motivation and significance


    Developed in the early 1980s, Reinforcement Learning (RL) [1] is one of the important
    areas of machine learning. RL is a subfield of Machine Learning in which an agent
    interacting with an environment learns the optimal action selection policy by
    receiving feedback from the environment. RL algorithms learn iteratively: at each
    iteration, the agent observes its state and chooses an action that leads to the
    state of the subsequent environment. Then, the agent receives a reward or penalty
    and updates the value function representing the goal to maximize. By exploring
    the environment and gathering this information, agents learn how to maximize long-term
    reward. Fig. 1 shows the agent-environment interaction for reinforcement learning
    approaches.


    The benefits of distributed systems in reinforcement learning are demonstrated
    through the RLlib [2] library. The use of distributed systems in solving such
    complex problems will enable more parameters to be trained in less time. Therefore,
    learning the environment will be easier. Especially for UAVs, the importance of
    distributed systems comes to the forefront when it is considered that more than
    one algorithm needs to be trained at the same time. This approach decentralizes
    the learning event, in


