    \ |\n| [23] | 开发交通信号控制以提高效率，解决特大城市的交通问题。 | 提出了一种使用 Ape-X 和深度 Q 学习网络在小数据集上的 RL\
    \ 模型。 | 在三个不同城市的数据集上进行的实验表明，该方法比现有基于 RL 的方法更成功。此外，这些城市的平均出行时间也达到了更好的水平。 |\n| [24]\
    \ | 比较文献中可用的无人机导航框架和仿真软件。 | 无人机导航与仿真器的比较以及 RL 算法的性能测量。 | 分析结果识别出一些挑战和优势。特别是，观察到由\
    \ RL 算法执行的复杂无人机任务由于仿真环境不足而导致性能下降。 |\n\n人工神经网络作为动作决定因素，根据确定的参数确定动作，并使无人机在环境中移动。该动作将获得的奖励将对其下一步行动起决定性作用。\n\
    \n本文采用 OpenAI 开发的 Gym 工具包。它主要用于 RL 问题以及使用 Python 开发现有解决方案。PyBullet 用于建模在 Gym 中创建的无人机所受的力和力矩。“OpenAI\
    \ 的”Gym 工具包\n\n![](img/8aad327ea3535dddb1bf08458dd09208_3_0.png)\n\n图 2. 无人机跟踪无人机模型架构。\n\
    \n该工具包被引入以标准化 Python 中 RL 问题和算法的开发。我们使用 PyBullet 来建模我们 Gym 中每个四旋翼机所受的力和力矩，并利用物理引擎计算和更新所有载具的运动学。在智能体训练期间，如同在\
    \ MDP 框架中的标准操作一样，从环境中采取一个动作，该动作会更新内部状态。结果返回与所采取动作相对应的奖励和状态。这在设定的循环中重复进行。每个步骤返回的奖励值由第\
    \ 2.2.3 节描述的函数确定。领头无人机的向上移动将教导处于起始位置的跟随无人机需要遵循的路径。\n\n## 2.2. 软件功能\n\n本节解释了用于无人机跟踪研究中所用软件的功能。\n\
    \n### 2.2.1. 分布式深度强化学习\n\n在 RL 理论中，与其他机器学习方法不同，不给出任何先验知识。目标是通过使用探索环境后获得的经验来最大化未来动作的奖励。RL\
    \ 中有两个基本元素：智能体和环境。RL 的两个显著特征是：试错搜索和延迟奖励特性 [25]。\n\n**智能体：**环境中的学习者和决策者。有时智能体可以是执行任务的无人机或学习站立的机器人。\n\
    \n**环境：**为智能体学习而创建的世界。这有时可以是智能体观察到的精确环境，例如街机游戏中。有时它可以是部分可观察环境，例如摄像头图像。\n\n智能体与环境在每个\
    \ t 时段进行交互。在每个步骤 t，智能体接收环境的表示 st ∈ S，并从集合 A(S) 中选择一个动作。一步之后，智能体作为交互结果接收一个数值奖励（rt\
    \ ∈ R），并设置一个新状态（st+1）[26]。在图 3 中，可视化了 DRL 的运行。\n\n深度强化学习（DRL）基本上与 RL 相同。不过，主要区别在于它使用深度学习算法而非经验表来进行动作选择。此最佳示例是由\
    \ Google DeepMind 开发的 Atari 游戏。尤其是在近年来取得重大进展的计算机视觉、语音识别和机器人领域，需要训练大量数据集。通常，值函数的估计可以用表格形式表示。\n\
    \n然而，现实问题中出现的大规模连续状态空间会显著减慢训练速度。在这种情况下，问题通过神经网络求解 [27]。智能体的目标是通过最大化累积奖励，使神经网络更接近最优动作-值函数，如\
    \ Eq. (1) 所示。\n\n```\nQ' (s, a) = max_\\pi E { R_t + \\gamma R_{t+1} + \\gamma^2\
    \ R_{t+2} + \\cdots | s_t = s, a_t = a, \\pi }\n```\n\n随着机器学习的发展，尤其是在机器人领域，DRL\
    \ 不得不自我完善。分布式 RL 通过将学习分布到许多工作者中，成功提高了学习速度。此外，单位时间内学习的环境知识也增加了。Gorilla 是该领域的开创性架构之一。在\
    \ Gorilla 之后，目前的分布式架构（如 A3C、IMPALA、APE-X、D4PG）已被使用。在这种架构中，目标是使用多个 actor 来获取经验以更新权重\
    \ [8]。所有使用的 actor 可以同时访问一个训练好的系统。分布式深度强化学习架构在算法 1 和算法 2 中描述 [28]。\n\n```\nAlgorithm\
    \ 1 Worker K: ComputeGradient\nstate: Replay dataset D_k, game state s, target\
    \ model theta, target model generation i\nFetch model theta and iteration number\
    \ n from server.\nif i >= c then\n    theta^- = theta\n    t = t(NC) + 1\n   \
    \ q = max { (N_{max-t}) / (N_{max}), 0 }\n    epsilon = (1-q)*epsilon_{max} +\
    \ q*epsilon_{min}\n    Select action: a = { max_a Q(theta(s), a, w), p=1 - epsilon\
    \ random action otherwise\nExecute action a and observe reward r_t and frame x_{t+1}\n\
    Append (s_t, a_t, r_t, x_{t+1}) and preprocess phi_{t+1} = O(x_{t+1})\nStore experience\
    \ (phi_t, a_t, r_t, phi_{t+1}) in D_k\nUniformly sample minibatch of transitions\
    \ X from D_k, where X_t=(phi_t, a_t, r_t, phi_{t+1})\nSet y_j = { r_j if phi_{j+1}_terminal\
    \ (r_j + gamma*max_{a'} Q(phi_{j+1}, a'; theta') otherwise\ndelta theta = nabla_theta\
    \ F(theta; X) = 1/|B| sum_{t=1}^B V_a ( 1/2 (Q(theta, a_t) - y_t)^2 )\nSend delta\
    \ theta to parameter server\n```\n\n"
