    ## 5. 结论


    本文开发了一款支持分布式架构的应用程序，使研究人员能够充分利用基于 CPU 的深度强化学习软件。在此背景下，解决了无人机追踪无人机的问题，并进行了两项不同的实验；观察到分布式深度强化学习软件比非分布式软件更成功。根据实验获得的数据，分布式训练中每次迭代执行的步骤数大约高出
    67%。根据训练结果的奖励图，分布式算法更成功。在训练 300000 步的算法中，第二成功的实验在训练期间平均奖励为 –54.78。对于非分布式算法，该值为
    –559.49。


    根据第 4.1 节的测试结果，观察到训练阶段第一个实验的成功率在测试结果中没有变化。因此，得出结论：使用分布式 PPO 算法训练的无人机在追踪目标无人机方面更成功。本研究将有助于填补文献中关于在无人驾驶航空器中同步使用分布式系统的强化学习方面的空白。它还将有助于为无人驾驶航空器开发现实的
    DDRL 应用程序。


    我们未来的计划是开发一种用于无人机检测和追踪的新算法，以便追踪无人机可以无论环境如何都成功执行任务。


