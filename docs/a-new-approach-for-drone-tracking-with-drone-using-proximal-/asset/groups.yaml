    \ other users can easily update and improve it. This software is shipped fully\
    \ open source using the MIT license and an explanatory user manual with links\
    \ to all the libraries used.\n\n## 4. Impact\n\nThis study addresses problems\
    \ such as motion control, object tracking, and vertical elevation for a quadcopter.\
    \ A gradient-based deep RL approach is used to establish a control strategy. This\
    \ article presents two different approaches to training the DRL algorithm. The\
    \ first approach trains the learning algorithm with a distributed architecture.\
    \ The second is trained as non-distributed. The training was carried out using\
    \ the CPU. To increase the success of the training and reduce the computational\
    \ cost in such complex problems, we have shown with experiments that the CPU cannot\
    \ be successful alone and can be more successful with more than one worker when\
    \ trained in a distributed manner. We can follow the experiments on three different\
    \ axes. Accordingly,\n\n### 4.1. Experimental results\n\nIn both experiments,\
    \ while 300000 time-step training was performed, the division-based average of\
    \ the rewards received by the agent from the environment is shown in Fig. 5. While\
    \ the agent was trained for a total of 700 episodes during the training phase\
    \ in the first experiment, this value was approximately 500 episodes in the second\
    \ experiment. The distributed-trained agent completes more Episodes in the same\
    \ time slot. When Fig. 5 is examined, it is concluded that the mean reward value\
    \ of the distributed PPO algorithm during the training is -54.78 and that the\
    \ non-distributed PPO algorithm is -559.49. Comparing the results in this experiment,\
    \ training time, rewards received in episodes, and solving the given task, It\
    \ was found that the second experiment gave more successful results than the first.\
    \ Training for the second experiment took approximately 1 h.\n"
