    ## 基于近端策略优化分布式深度强化学习的无人机追踪新方法


    Ziya Tan a,*, Mehmet Karaköse b


    a Tokat Gaziosmanpaşa 大学, 托卡特, 土耳其

    b Fırat 大学, 埃拉济格, 土耳其


    ## 文章信息


    - 文章历史：

    - 收到日期 2023 年 3 月 15 日

    - 修订稿收到日期 2023 年 7 月 29 日

    - 接受日期 2023 年 8 月 6 日


    - 关键词：

    - 分布式学习

    - 无人机追踪

    - 强化学习

    - 近端策略优化


    ## 摘要


    本文提出了一种基于近端策略优化（PPO）的分布式深度强化学习算法，用于无人机（UAV）自主追踪另一架无人机。因此，本文对文献做出了三个重要贡献。第一个是开发高效的无人机追踪算法，第二个是提出可适应该问题的深度强化学习方法，第三个是引入可用于无人机追踪、控制和任务协调等各类问题的通用分布式深度强化学习平台。为验证所提出的方法，以分布式和非分布式方式模拟了
    PPO 算法与深度强化学习算法，在不同场景下训练了追踪无人机，并获得了使用 CPU 进行训练的分布式和非分布式性能；给出了使用通用和自适应学习算法的场景，最后，明确展示了本文所开发算法的性能。


    © 2023 The Author(s)。由 Elsevier B.V. 出版。这是一篇根据 CC BY 许可（http://creativecommons.org/licenses/by/4.0/）发布的开放获取文章。


    ## 代码元数据


    | 当前代码版本 | V1.0 |

    |---|---|

    | 此代码版本所用代码/仓库的永久链接 | https://github.com/ElsevierSoftwareX/SOFTX-D-23-00170 |

    | 可复现胶囊的永久链接 | https://github.com/ziya44/take_off_drone.git |

    | 法律代码许可 | MIT 许可证 |

    | 使用的代码版本控制系统 | 无 |

    | 使用的软件编程语言、工具和服务 | Python |

    | 编译要求、运行环境和依赖项 | Ubuntu 20.04 |

    | 如有，开发者文档/手册链接 | |

    | 问题支持邮箱 | ziya.tan@gop.edu.tr |


    ## 1. 动机与重要性


    强化学习（RL）[1] 发展于 20 世纪 80 年代初，是机器学习的重要领域之一。RL 是机器学习的一个子领域，其中与环境交互的智能体通过接收环境反馈来学习最优动作选择策略。RL
    算法以迭代方式学习：在每次迭代中，智能体观察其状态并选择一个导致后续环境状态的动作。然后，智能体接收奖励或惩罚，并更新表示最大化目标的值函数。通过探索环境并收集这些信息，智能体学习如何最大化长期奖励。图
    1 展示了强化学习方法中的智能体-环境交互。


    通过 RLlib [2] 库，展示了分布式系统在强化学习中的优势。在解决此类复杂问题时使用分布式系统，将使更多参数在更短时间内得到训练。因此，学习环境会更加容易。特别是对于无人机，当需要同时训练多个算法时，分布式系统的重要性便凸显出来。这种方法使学习事件去中心化，在


    * 通讯作者。

    电子邮件地址：ziya.tan@gop.edu.tr (Ziya Tan)，mkarakose@firat.edu.tr (Mehmet Karaköse)。


    ![](img/8aad327ea3535dddb1bf08458dd09208_1_0.png)


    换句话说，它使用多个工作节点而非单个工作节点来解决相同问题。因此，学习事件得到优化，信息共享更加迅速。


    在 [3] 中，开展了一项深入的文献综述，以考察在繁忙道路上追踪多个物体所使用的技术、数据集和硬件。在论文 [4] 中，针对城市公共交通问题，使用了马尔可夫决策过程（MDP）来解决该问题。此外，采用了分布式强化学习方法来克服高计算成本。在
    [5] 中，使用分布式深度强化学习来优化无线网络传感器，学习无线介质访问控制层以最大化网络节点的吞吐量。Aklofi 等人 [6] 使用深度强化学习算法来优化追踪过程中另一架无人机的动作，作为第二种方法，他们开发了一种搜索空间建议以确定被追踪无人机的位置。在
    [7] 中，提出了一种使用毫米波雷达系统进行无人机追踪的方案，展示了使用安装在另一架无人机上的雷达追踪无人机的初步结果。在 [8] 中，提出了一种分布式强化学习方法来解决无人机的协作感知与传输问题。提出了一种分布式感知与传输协议来协调多架无人机。在
    [9] 中，提出了一种面向自主空中载具的分布式深度强化学习方法，该建模方法旨在优化空中出租车的起飞和乘客接载，以便从最佳位置接载其客户。在研究 [10] 中，针对群体机器人提出了一种基于参数共享和行为的方法，在不同环境中测试了
    PPO 算法并观察了结果。在研究 [11] 中，提出了一种用于无人机网络控制与优化的新型深度强化学习架构，并观察到使用分布式架构可使性能提升高达 3.7 倍。在
    Venturini 的硕士论文 [12] 中，使用了分布式深度强化学习方法来应对群体无人机。在该论文中，遇到了强化学习框架的所有典型挑战。[13] 中 Seejong
    Park 等人的工作针对反无人机系统进行了全面的综述。使用的模拟器环境包括许多障碍物，例如树木、电缆、停放的汽车和房屋。在 [14] 中，对近期 DRL 研究进行了分析，分析了所使用的策略。在该研究中，所使用的策略被分为三组，并利用牛顿运动定律讨论了将智能体移动到共同目标的问题。在研究
    [15] 中，使用策略梯度算法在有限区域内用 DRL 方法训练了三种不同的机器人，评估了机器人的性能并取得了成功结果。在文章 [16] 中，使用了分布式 PPO
    算法的优化版本，该文章旨在帮助智能体在具有不同障碍物的环境中学习复杂行为。经过在各种障碍物和地形上测试的分布式 PPO 算法训练，智能体凭借简单的奖励函数提高了移动技能。智能体已成功学会跳跃、奔跑和蹲伏等任务，无需任何指导。


    表 1 比较了一些相似研究的方法和结果。尽管在无人机追踪中使用了不同的方法，但可以看出，YOLO 深度学习算法通常用于实时无人机检测算法。


    在本研究中，我们比较了 DDRL 与非分布式深度强化学习算法的性能，以成功克服四旋翼无人机面临的最大问题之一，即起飞和追踪。在 CPU 实验中，观察到使用分布式架构可提高训练性能并缩短训练时间。本文的主要贡献可总结如下。


    - 展示 DRL 在无人机追踪和垂直起飞问题中的应用以及分布式系统的性能，

    - 比较基于 PPO 的分布式与非分布式方法

    - 作为未来类似问题研究的参考文献


    ## 2. 软件描述


    在本节中，解释了文章中使用的软件的算法和基本概念。首先，介绍了 RL 的相关信息。其次，给出了关于深度强化学习的详细信息。最后，考察了本研究中使用的 DDRL
    方法。本研究主要使用 Python 编程语言、torch 框架和 gym-pybullet 模拟环境。此外，使用 ray 框架对现有架构进行分布式部署。


    ## 2.1. 软件架构


    本研究基本上考察了 3D 环境中的无人机导航。该导航过程基本上采用两种不同的方法进行了比较。分布式深度强化学习和深度强化学习方法训练一个智能体，使一架无人机跟随另一架无人机。训练结束后，跟随无人机旨在根据被跟随无人机的定位在一定高度上成功跟踪。为此，强化学习与
    PPO 算法联合使用。RAY 框架被选作分布式架构。训练环境中的工作节点执行由深度神经网络评估的动作。作为动作结果从环境接收到的奖励和状态值由 PPO 架构进行评估。根据这些动作所获得的奖励和惩罚，智能体学习环境并据此行动。在本研究中，训练最多使用
    4 个工作节点，具体取决于处理器。当使用 GPU 时，此数量还可以进一步增加。这些工作节点彼此独立地学习环境，并将结果传输到一个共同的学习者。因此，在单位时间内实现了更快、更成功的训练。在非分布式模型中，单个智能体在环境中执行动作。


    图 2 展示了本研究中使用的无人机追踪的基本软件架构。在研究范围内，训练在虚拟环境中进行，跟随无人机根据被跟随无人机执行其动作。该


