  md: '# REFLECTIONS OF RENOWNED PERSONALITIES ON ALAN TURING & HIS LEGACY


    ~ Ian McDonald (River of Gods (India 2047, #1))


    "But the Turing test cuts both ways. You can''t tell if a machine has gotten smarter
    or if you''ve just lowered your own standards of intelligence to such a degree
    that the machine seems smart. If you can have a conversation with a simulated
    person presented by an AI program, you can tell how far you''ve let your sense
    of personhood degrade in order to make the illusion work for you?


    People degrade themselves in order to make machines seem smart all the time. Before
    the crash, bankers believed in supposedly intelligent algorithms that could calculate
    credit risks before making bad loans. We ask teachers to teach standardized tests
    so a student will look good to an algorithm. We have repeatedly demonstrated our
    species'' bottomless ability to lower our standards to make information technology
    look good. Every instance of intelligence in a machine is ambiguous. The same
    ambiguity that motivated dubious academic AI projects in the past has been repackaged
    as mass culture today. Did search engine really know what you want, or are you
    playing along, lowering your standards to make it seem clever? While it''s to
    be expected that the human perspective will be changed by encounters with profound
    new technologies, the exercise of treating machine intelligence as real requires
    people to reduce their mooring to reality." ~ Jaron Lanier (You Are Not a Gadget)


    23'
