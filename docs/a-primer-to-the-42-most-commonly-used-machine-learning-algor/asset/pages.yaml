    slightest. But if we really want to start fathoming, we need to get them speaking
    in sentences we can''t finish."


    ~ Brian Christian (The Most Human Human: What Talking with Computers Teaches Us
    About What It Means to Be Alive)


    *


    "Any AI smart enough to pass a Turing test is smart enough to know to fail it."'
