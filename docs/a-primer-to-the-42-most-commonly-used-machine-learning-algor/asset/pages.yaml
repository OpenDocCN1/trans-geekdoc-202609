  md: '# THE IMITATION GAME (TURING TEST)


    ![](img/046ba135cd994945038c4ec83cb4a06d_20_0.png)


    Suppose you enter a room whose only equipment consists of a chair and a table
    on which one of the most used devices of our time has taken a seat, a computer
    with a screen and keyboard. At that moment, an undernourished-looking man with
    a slightly shy and staring look appears and explains to you that the terminal
    on the table is connected to a similar terminal next door, in front of which sits
    a more or less average person of indeterminate sex, or to a computer programmed
    to answer any question you ask; provided that you formulate your questions in
    normal and understandable English. Of course, neither the computer nor the human
    is required to answer the questions truthfully. The questioning is limited to
    twenty questions or about thirty minutes to keep the experiment within reasonable
    limits. After the experiment is completed, the computer geek will come back, and
    you are then to tell him whether you think the'
  merge: -1
  img_proc: true
