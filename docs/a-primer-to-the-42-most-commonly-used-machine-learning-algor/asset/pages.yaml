  md: 'Imagine coming back again and again to play this game many times. Then, based
    on mere conjecture alone, you believe you are correct in assuming that, on average,
    you are in contact with the human and the computer, respectively, for half the
    time each. Imagine further that after a sufficiently large number of playthroughs,
    your success rate in distinguishing a human from a machine is not significantly
    better than the 50 percent based on mere conjecture. So now I ask you: can the
    machine think? Well, why not? After all, we can only decide whether or not other
    people are thinking beings by interacting with them in roughly the same way (except
    facial expressions, etc.) as we interacted with the terminal counterpart. So if,
    after a whole of such interactions, we cannot distinguish the computer from a
    human, then it seems perfectly reasonable to claim that either the machine is
    capable of thought or that humans are. But since ex hypothesis humans think, we
    must accept that any machine can fool us in the imitation game can also think.


    The imitation game was first introduced nearly seventy years ago by British computer
    pioneer Alan Turing in a seminal paper on the possibility of building intelligent
    machines. Turing, who was instrumental in getting the German Enigma code cracked
    during World War II, was by all accounts a man with some pretty offbeat interests.
    For instance, he invented the "roundrobin chess game" (in which the player, after
    making a move, gets up and walks around the house, and if he gets back before
    his opponent has moved, he gets to make one additional move) and the "lonely island
    game" (a sort of survival experiment in which you have to figure out how to make
    chemicals using homemade contraptions made from household materials). He also
    enjoyed passions such as cross-country skiing, bicycling, and playing the violin.
    It seems that Turing’s'
