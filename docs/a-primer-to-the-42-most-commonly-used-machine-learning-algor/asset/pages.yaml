    idea of as to more or less arbitrary stimuli. Suppose the Turing test is anything
    to go by. In that case, any "black box" that can reasonably mimic a human in ordinary
    conversation is granted genuine intelligence and can (should) be considered "thinking
    being," just like our friend in the above dialogue.


    Several arguments have been put forward that regard the Turing test as unsuitable
    for determining intelligence:


    The Turing test tests only for functionality, not for the presence of intentionality
    or consciousness. This argument was elaborated by John Searle, among others, in
    his thought experiment of the Chinese Room¹. When he formulated his test, Turing
    was already aware of this problem but believed it could also be evidence for consciousness.
    Searle, however, rejects this.


    > ¹ More Info about The Chinese Room: Wikipedia: https://en.wikipedia.org/wiki/The_Chinese_Room'
