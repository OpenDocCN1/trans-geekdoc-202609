    # # I KNOW THAT I KNOW NOTHING (BONUS ARTICLE)


    ![](img/046ba135cd994945038c4ec83cb4a06d_50_0.png)


    (c. 470–399 BC)


    When Plato''s teacher Socrates lived in Athens, his childhood friend Chairephon
    went to Delphi to ask the Oracle who might be the wisest man in Athens. The Oracle
    called Socrates, and when he heard of it, he was shocked, astonished because he
    did not think that he was the smartest. But the God of the Oracle was not allowed
    to lie, so Socrates wanted to find out what the Oracle might have meant by his
    saying.


    Socrates sought out in Athens those men who appeared as great teachers and were
    therefore considered as wise. He wanted to learn from them and show that he could
    not be the wisest because he knew less than the persons he addressed. But again
    and again, he had to find out that Athens'' wise teachers became insecure when
    questioned in detail and finally had to admit to seeing their knowledge disappear
    through Socrates'' thirst for knowledge. Understandably, this procedure brought
    him little'
  - '[PAGE 51]


    sympathy; he was sentenced to death by poison at over 70. He accepted the sentence
    and said goodbye to his friends with the words: "Now is the time to go, I do know
    and you to live. But which of us goes to know the better business is hidden from
    all except God."


    Back to the Oracle''s saying. Through the many discussions with supposedly wise
    people, Socrates had that neither he the others were truly wise. He could now
    interpret the Oracle saying: "So I seem to be wiser than him in this way because
    what I don''t know, I don''t know either."


    "I know that I know nothing!" In this abbreviated form, the saying of Socrates
    is handed down. The aim of Socratic questioning is wisdom, insight into the limits
    of knowledge. Knowledge itself does not seem essential. But anyone who wants to
    experience the boundaries of education cannot avoid the occupation of knowledge.
    In this indirect way, knowledge also comes into play, but as a by-product. Anyone
    who, like Socrates, wants to reach wisdom by accepting not being able to know
    will also increase his knowledge. He who strives directly for understanding will
    not attain wisdom with it.


    Note:


    In his drama, Goethe presented these two fundamental attitudes through Heinrich
    Faust and his Famulus Wagner. While Faust - entirely in the Socratic sense - calls
    out desperately: "And see that we can''t know anything, almost burns my heart,"
    Wagner soberly says: "I know a lot, but I want to know everything." .


    (Excerpt from the Book: "THE AI THOUGHT BOOK")'
