    “但图灵测试是一把双刃剑。你无法判断是一个机器变得更聪明了，还是你仅仅将自己的智能标准降低到了这种程度，以至于机器看起来很聪明。如果你能与 AI 程序呈现的虚拟人物对话，你就能看出为了让这种幻象为你服务，你让自己的人格感退化到了什么程度？


