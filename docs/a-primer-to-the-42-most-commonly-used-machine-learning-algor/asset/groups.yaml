    ![](img/046ba135cd994945038c4ec83cb4a06d_36_0.png)


    # Wartime picture of a Bletchley Park Bombe


    # 1941


    # Turing and His Fellow cryptanalysts Gordon Welchman, Hugh Alexander and Stuart
    Milner-Barry Were Frustrated


    By late 1941, Turing and his fellow cryptanalysts Gordon Welchman, Hugh Alexander
    and Stuart Milner-Barry were frustrated. Building on the work of the Poles, they
    had set up a good working system for decrypting Enigma signals, but their limited
    staff and bombs meant they could not translate all the signals. In the summer,
    they had considerable success, and shipping losses had had fallen to under 100,000
    tons a month; however, they badly needed more resources to keep abreast of German
    adjustments. They had tried to get more people and fund more bombs through the
    proper channels, but had failed.


    # Turing Proposed Marriage to Joan Clarke


    In 1941, Turing proposed marriage to Hut B colleague Joan Clarke, a fellow mathematician
    and cryptanalyst, but their engagement was short-lived. After admitting his homosexuality'
  - '[PAGE 37]


    to his fiancée, who was reportedly "unfazed" by the revelation, Turing decided
    he could not go through with the marriage.


    # ## Writing directly to Winston Churchill


    On 28 October they wrote directly to Winston Churchill explaining their difficulties,
    with Turing as the first named. They emphasized how small their need was compared
    with the vast expenditure of men and money by the forces and compared with the
    level of assistance they could offer to the forces.


    ![](img/046ba135cd994945038c4ec83cb4a06d_37_0.png)


    # ## Governement Response on Turing Message


    On 18 November, the chief of the secret service reported that every possible measure
    was being taken. The cryptographers at Bletchley Park did not know of the Prime
    Minister''s response, but as Milner-Barry recalled, "All that we did notice was
    that almost from that day the rough ways began miraculously to be made smooth."
    More than two hundred bombs were in operation by the end of the war.


    # 1942


    # ## Turing Devised a Technique Termed Turingery


    In July 1942, Turing devised a technique termed Turingery (or jokingly Turingismus)
    for use against the Lorenz cipher messages produced by the Germans'' new Geheimschreiber
    (secret writer) machine.'
  - '[PAGE 38]


    # Turing traveled to the United States


    Turing traveled to the United States in November 1942 and worked with US Navy
    cryptanalysts on the naval Enigma and bombe construction in Washington DC; he
    also visited their Computing Machine Laboratory in Dayton, Ohio.


    # 1943


    # Turing Returned to Bletchley Park


    Turing returned to Bletchley Park in March 1943. During his absence, Hugh Alexander
    had officially assumed the position of head of Hut 8, although Alexander had been
    de facto head for some time (Turing having little interest in the day-to-day running
