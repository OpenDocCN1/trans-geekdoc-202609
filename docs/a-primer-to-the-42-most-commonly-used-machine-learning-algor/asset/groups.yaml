    终端连接的是真实的、真人，或者是计算机。


    让我们玩玩这个游戏来感受一下。


    **你**：那么，我们聊点什么呢？


    我可以聊任何话题。你想问我什么？


    **你**：让我们从简单点开始吧，也许是一点点数学。如果我有一个两个边长为 3 和 4 的直角三角形，第三条边的长度是多少？


    啊，老掉的毕股哥定理。当然，斜边的长度是 5。


    **你**：有一件事我非常感兴趣。宇宙中还有其他智能生命体吗？


    我不知道。但我倾向于选出卡尔·萨根，因为他曾说过：“宇宙是一个非常大的地方。如果只有我们，那看起来就像是对空间的极极度浪费。”


    **你**：赞同。让我们试试别的。我们应该相信上帝吗？


    我不喜欢聊宗教。但如果你想要一个答案，我会说：你应该拥有相信任何你想要相信的事物的自由。


    > 模仿游戏（图灵测试）


    **你：**好吧，我们不聊宗教了。你认为罗杰尔·费德勒今年能赢得大满贯吗？


    罗杰尔·费德勒是谁？


    **你：**我看来你也不是网球球迷。你告诉过我可以聊任何事情。


    我可以像任何正常人一样交流，但我并不是全知。


    **你：**我只是在尝试为我们的对话寻找共同点。你对电动汽车怎么看？你认为现在买一辆好吗？


    在买之前我会再等一下：


    **你：**你为什么会有这个观点？


    电动汽车还没有完全发展，而且仍然太贵了。但总的来说，就空气污染而言，这是一件好事。


    **你：**好吧，你的观点并不孤单。你对艺术了解多少？你不能为我写一小段乐曲吗？


    对不起，我做不到。


    **你：**好吧，我必须得离开了。我可以问你最后一个问题吗？你是计算机还是人类？


    我是一个智能的、会思考的存在。再见，感谢你来这里和我聊天！


    想象一下一次又一次地回来玩很多次这个游戏。那么，仅凭推测，你就相信你的假设是正确的：平均而言，你与人类和计算机接触的时间各占一半。进一步想象，在经过足够多次的游戏后，你区分人类和机器的成功率并没有显著优于仅凭推测的
    50%。所以现在我问你：机器能思考吗？嗯吧，为什么不能呢？毕竟，我们只能通过与他们进行大致相同的交互（除了面部表情等，这与我们与终端对应的交互方式相同）来判断他人是否是思考生物。因此，如果在经历了一系列这样的交互后，我们仍然无法区分计算机和人类，那么声称机器具有思考能力或人类具有思考能力似乎完全合理的。但既然根据假设人类是思考的，我们必须接受，任何在模仿游戏中能欺骗我们的机器也能思考。


    模仿游戏最早是由英国计算机先驱艾兰·图灵在近七十年前的一篇关于构建智能机器可能性的开创性论文中首次提出的。图灵在二世界大战期间破解德国恩尼玛密码方面起了关键作用，从各方面来看，他是一个兴趣相当古怪的人。例如，他发明了“回合制象棋”（玩家在走完一步后，站起来在房子里走动，如果他在对手移动之前回来，他就可以再走一步）和“孤独岛屿游戏”（一种生存实验，你必须学会如何使用由家用材料自制的装置制造化学品）。他还喜欢越野滑雪、自行车和拉小提琴等爱好。似乎图灵的


    # 模仿游戏（图灵测试）


    关于或多是任意刺激的设想。假设图灵测试具有任何参考价值。那么，在这种情况下，任何在普通对话中能够合理模仿人类的“黑箱”都被认为拥有了真正的智能，并且可以（应该）被视为“思考的存在”，正如我们在上面对话中的那位朋友一样。


    目前已经提出了几种论点，认为图灵测试不适用于确定智能：


    - 图灵测试测试的是功能性，而不是意图性或意识的存在。这一论点由约翰·塞尔尔等人在他的“中文房间”¹的思想实验中进行了详细阐述。当图灵制定他的测试方案时，他已经意识到了这个问题，但他认为这也可以是意识的证据。然而，塞尔尔拒绝了这一点。


    > ¹ 关于“中文房间”的更多信息：维基百科：https://en.wikipedia.org/wiki/The_Chinese_Room


    图灵假设，到 2000 年，可以通过编程让平均用户在与其“交谈”五分钟后，识别人类和机器的概率最高只有 70%。这一预测尚未实现的假设，被许多人视为低估了智能的复杂性。


    # 名人对艾兰·图灵的感悟


    “对他而言，破解恩尼玛密码比处理人类要容易得多。”


    安德鲁·霍吉斯（艾兰·图灵：恩尼玛）


    “尽管我不准备预测图灵测试将在 2029 年到来，但 Watson 等系统取得的进展应该给任何人足够的信心。如果创建一个针对图灵测试的 Watson 版本，可能会非常接近。”


    雷·库兹维尔（创造心灵：人类思维的秘密）


    “我确定了一种简单的、用于判断主张（包括丹尼特的的主张）的测试方法。图灵发明他的测试是希望在功能性被解释之前实现它。遗憾的是，解决方案很少在不解释原理的情况下被发现。”


    大卫·德波奇（无限的起点）


    > “像洛芙莱尔一样，图灵是一个程序员，他向内审视。他将心理过程提炼为最小部分，即信息的原子。”


    詹姆斯·格莱克（信息：历史、理论与洪流）


    > “这种单一盒子执行任何你所想象的过程被称为通用性，这是图灵在 1936 年提出的概念。通用性意味着我们不需要为算术、机器翻译、象棋、语音理解或动画准备机器：一台机器即可。”


    斯图特·塞尔（人类兼容：人工智能与控制问题）


    “人工智能的悖论在于，任何简单到可以理解的系统都不复杂到能够智能。图灵建议，人工智能的路径是构建一个具有孩子好奇心的机器，并让智能进化。”


    乔治·迪森（图灵的教堂：数字的起源）


    “随机搜索可以比非随机搜索更有效——这是古德和图灵在布莱切利公园发现的。随机网络，无论是神经元、计算机、单词还是思想，包含了等待发现的解决方案，解决那些不需要明确定义。”


    乔治·迪森（图灵的教堂：数字的起源）


    “图灵以思想实验的形式提出了他的新观点，基于一种流行的客厅游戏。一个男人和一个女人躲起来，法官被要求根据往来的笔记文本来判断哪是哪个。”


    图灵把女人替换成了计算机。法官能分辨出哪个是男人吗？如果不能，计算机有意识吗？有智能吗？它应该权利吗？


    我们无法知道图灵在当时所遭受的折磨对他制定测试方案起了什么作用。但不可否认，击败法西斯主义的关键人物之一在战后被我们这一方摧毁了，因为他是同性恋。

