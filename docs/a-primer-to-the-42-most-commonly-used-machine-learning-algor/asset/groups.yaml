    In January 1952, Turing was 39 when he started a relationship with Arnold Murray,
    a 19-year-old unemployed. Just before Christmas, Turing was walking along Manchester''s
    Oxford Road when he met Murray just outside the Regal Cinema and invited him to
    lunch.


