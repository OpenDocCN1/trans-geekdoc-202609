  mdcn: '

    基于任何未经证实的猜想是完全错误的。只要弄清楚哪些是已证明的事实，哪些是猜想，就不会产生任何危害。猜想具有重要意义，因为它们提供了有用的研究方向。


    ## 10011

    如果一台计算机能够欺骗人类相信它就是人类，那么它就配得上被称为智能的。


    ## 10100

    让我们暂时回到洛夫莱斯夫人（Lady Lovelace）的反对意见，她认为机器只能执行我们让它做的事情。可以说，人向机器中“注入”一个思想，它会在一定程度上做出反应，然后陷入静止，就像被锤子击中的钢琴弦一样。另一个类比是规模较小的原子堆：一个注入的思想对应于一个从外部进入原子堆的中子。每个中子都会引起某种扰动，这种扰动最终会逐渐消失。然而，如果原子堆的尺寸足够大，这种迁入中子引起的扰动很可能会持续并不断扩大，直到整个堆被摧毁。心灵是否存在相应的现象？机器是否存在是否也有？人类心灵似乎是存在的。大多数心灵似乎是“亚临界”的，即在这一类比中对应于亚临界尺寸的原子堆。呈现给这种心灵的思想平均产生的回复思想少于一个。只有一小部分是超临界的。呈现给这种心灵的思想可能会产生一个完整的“理论”，由次级、三级以及更更遥远的思想组成。动物的心灵似乎非常明确是亚临界的。遵循这一类比，我们问道：“可以制造出是超临界的机器吗？（计算机器与智能）”


    ## 10110

    “机器能思考吗？”……这个问题的新形式可以用一种我们称之为“模仿游戏”（imitation game）的游戏来描述。游戏由三个人玩：一个男人（A）、一个女人（B）以及一个性别不限的询问者（C）。询问者待在一个与两人隔离开的房间里。询问者的游戏目标是确定另外两人中谁是男人谁是女人。他通过标签
    X 和 Y 来识别他们，并在游戏结束时说“X 是 A，Y 是 B”或“X 是 B，Y 是 A”。询问者被允许向 A 和 B 提问……我们现在问：“当机器在游戏中扮演
    A 的角色时会发生什么？它做出错误判断的频率，是否和男人与女人之间玩这种游戏时的频率一样？”这些问题取代了我们最初的问题：“机器能思考吗？（计算机器与智能）”


