    a seminal work on Intelligent Machinery that was not published in his lifetime.


    # 1948


    # Turing was appointed reader in the Mathematics Department


    In 1948, Turing was appointed reader in the Mathematics Department at the Victoria
    University of Manchester.


    # Writing a Chess Program


    In 1948 Turing, working with his former undergraduate colleague, D.G. Champernowne,
    began writing a chess program for a computer that did not yet exist.


