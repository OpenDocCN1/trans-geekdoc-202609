    # 1950


    # The Chess Program was Completed


    By 1950, the chess program was completed and dubbed the Turbochamp.


    # The Pilot ACE Executed Its First Program


    While he was at Cambridge, the Pilot ACE was being built in his absence. It executed
    its first program on 10 May 1950, and a number of later computers around the world
    owe much to it, including the English Electric DEUCE and the American Bendix G-15.
    The full version of Turing''s ACE was not built until after his death.


    ![](img/046ba135cd994945038c4ec83cb4a06d_40_0.png)


    Pilot ACE computer on display at Science Museum in London


    # Turing''s Paper "Computing Machinery and Intelligence"


    In "Computing Machinery and Intelligence" (Mind, October 1950), Turing addressed
    the problem of artificial intelligence, and proposed an experiment that became
    known as the Turing test, an attempt to define a standard for a machine to be
    called "intelligent". The idea was that a computer could be said to'
  - '[PAGE 41]


    > "think" if a human interrogator could not tell it apart, through conversation,
    from a human being.


    1952


    # Turing tried to Implement the Chess Program on a Ferranti Mark 1


    In 1952, he tried to implement it on a Ferranti Mark 1, but lacking enough power,
    the computer was unable to execute the program. Instead, Turing "ran" the program
    by flipping through the pages of the algorithm and carrying out its instructions
    on a chessboard, taking about half an hour per move.


    # Turing published His Masterpiece "The Chemical Basis of Morphogenesis"


    When Turing was 39 years old in 1951, he turned to mathematical biology, finally
    publishing his masterpiece "The Chemical Basis of Morphogenesis" in January 1952.


