    # 亚马逊畅销


    # 42种常用机器学习算法入门（带代码示例）


    ![](img/046ba135cd994945038c4ec83cb4a06d_4_0.png)


    无论你是数据科学家、软件工程师，还是仅仅对学习机器学习感兴趣，“42种常用机器学习算法入门（带代码示例）”都是全面理解这一令人兴奋领域的绝佳资源。


    本书以浅懂的方式向你介绍了 42 种最常用的机器学习算法。每种算法都通过一个简单的 Python 代码示例进行了演示。


    可在亚马逊购买：

    https://www.amazon.com/dp/B0BT911HDM

    (ISBN-13: 979-8375226071)


    # 认知偏差汇编


    探索 150 多种认知偏差（带示例），以做出更好的决策、进行批判性思考、有效解决问题并更准确地交流。


    ![](img/046ba135cd994945038c4ec83cb4a06d_5_0.png)


    通过更加意识到人类的偏差，我们可以努力在生活的各个方面做出更少偏见的结论。这项技能是宝贵的，因为它能让我们理解思维的复杂性，并做出更明智、公平的决策。让我们利用对认知偏差的理解作为个人发展的手段，对周围的世界获得的理解。


    可在亚马逊购买：

    https://www.amazon.com/dp/B0CBK1WFNN

    (ISBN-13: 978-8851721496)


