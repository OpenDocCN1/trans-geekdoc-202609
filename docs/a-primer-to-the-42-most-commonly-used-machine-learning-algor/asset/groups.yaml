    proper channels, but had failed.


    # Turing Proposed Marriage to Joan Clarke


    In 1941, Turing proposed marriage to Hut B colleague Joan Clarke, a fellow mathematician
    and cryptanalyst, but their engagement was short-lived. After admitting his homosexuality
    to his fiancée, who was reportedly "unfazed" by the revelation, Turing decided
    he could not go through with the marriage.


    ## Writing directly to Winston Churchill


    On 28 October they wrote directly to Winston Churchill explaining their difficulties,
    with Turing as the first named. They emphasized how small their need was compared
    with the vast expenditure of men and money by the forces and compared with the
    level of assistance they could offer to the forces.


