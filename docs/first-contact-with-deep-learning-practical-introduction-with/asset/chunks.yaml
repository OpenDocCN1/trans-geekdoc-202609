    In general, heuristics can be used taking into account the type of activation
    functions that our network has. It is outside the introductory level of this book
    to go into these details but, if the reader wants to go deeper, I suggest that
    you visit the CS231n course[130](#part0000_split_065.html#_ftn130) website of
    Andrej Karpathy in Stanford, where you will obtain very valuable knowledge in
    this area exposed in a very didactic way.


    ## Hyperparameters and optimizers in Keras


    How can we specify these hyperparameters? Recall that the optimizer is one of
    the arguments that are required in the `compile()` method of the model. So far
    we have called them by their name (with a simple strings that identifies them),
    but `Keras` also allows to pass an instance of the optimizer class as an argument
    with the specification of some hyperparameters.


    For example, the stochastic gradient descent optimizer allows the use of the momentum,
    learning rate decay and Nesterov momentum hyperparameters:


    ```

    keras.optimizers.SGD(lr=0.01, momentum=0.0, decay=0.0, nesterov=False)

    ```


    The values indicated in the arguments of the previous method are those taken by
    default and whose range can be:


    * `lr`: `float` >= 0. (learning rate)

    * `momentum`: `float` >= 0

    * `decay`: `float` >= 0 (learning rate decay).

    * `nesterov`: `boolean` (which indicates whether or not to use Nesterov momentum).


    As we have said, there are several optimizers in `Keras` that the reader can explore
    on their documentation page[131](#part0000_split_065.html#_ftn131).


    # 5 Get started with Deep Learning hyperparameters


    In this chapter, we propose to test what we learned in the previous one with an
    interactive tool called `TensorFlow Playground`[132](#part0000_split_065.html#_ftn132).
    This tool can help the reader to enter details of a neural network and put into
    practice some of the concepts presented here without having to enter the mathematics
    behind it.


    ## 5.1 TensorFlow Playground


    `TensorFlow Playground` is an interactive visualization web application written
    in `JavaScript` that allows us to simulate simple neural networks that run in
    our browser and see the results in real time:


    ![](images/00052.jpeg)


    With this tool we can experiment with different hyperparameters and see their
    behavior. In fact, the flexibility provided by the hyperparameters in neural networks
    is one of its virtues and at the same time one of its drawbacks for those who
    start on the subject: there are many of them to adjust!


    ## 5.2 A binary classification problem


    To begin to understand how the tool works we can use the first example of perceptron
    presented in this book in chapter 2, a simple classification problem.


    To start with this example, we chose the dataset indicated in the "DATA" section
    shown in the previous figure, and then click on the "Play" button. Now we can
    see how `TensorFlow Playground` solves this particular problem. The line between
    the blue and orange area begins to move slowly. You can press the "Reset" button
    and re-test it several times to see how the line moves with different initial
    values.


    In this case, the application tries to find the best values of the parameters
    that allow classifying these points correctly. If the cursor is put over the arcs,
    the reader will see that the value that has been assigned to each parameter appears
    (and it even allows us to edit it):


    ![](images/00053.jpeg)


    Remember that this weight dictates the importance of this relationship in the
    neuron when multiplying it by the input value.


    After this first contact, we will present a little the tool that will allow us
    to understand how a neural network behaves. In the upper part of the menu, we
    basically find hyperparameters, some of which we already commented in the previous
    chapter: Epoch, Learning rate, Activation, Regularization rate, and Problem type.
    All of them are drop-down menus in which we can choose the value of these hyperparameters.


    In the “Problem type” tab, the platform allows us to specify two types of problems:
    Regression (continuous problem) and Classification. In total, there are four types
    of data that we can choose for classification and two types for regression:


    ![](images/00054.jpeg)


    The blue and orange dots form the dataset. The orange points have the value -1
    and the blue points the value +1. On the left side, below the data type, there
    are different parameters that we can modify to tune our input data.


    Using the tab "Ratio of training to test data" we can control the percentage of
    data that is assigned to the training set (if we modify it we see how the points
    that appear in the "OUTPUT" on the right side of the screen are changed interactively).
    The noise level of the data can also be defined and controlled by the "Noise"
    field; the data pattern becomes more irregular as the noise increases. As we can
    experience, when the noise is zero, the problem data are clearly distinguished
    in their regions. However, when reaching more than 50, we can see that the blue
    dots and the orange dots are mixed, so it is very difficult to classify them.


    With "Batch size", as its name suggests, we can determine the amount of data that
    will be used for each training batch.


    Then, in the next column, we can make the selection of features. I propose that
    we use "X1" and "X2" among the many available to us: "X1" is a value on the horizontal
    axis, and "X2" is the value on the vertical axis.


    The topology of the neuronal network can be defined in the following column. We
    can have up to six hidden layers (by adding hidden layers, by clicking on the
    "+" sign) and we can have up to eight neurons per hidden layer (by clicking on
    the "+" sign of the corresponding layer):


    ![](images/00055.jpeg)


    Finally, remember that when training the neural network we want to minimize the
    "Training loss" and then compare that with the test data the "Test loss" is also
    minimized. The changes of both metrics in each epoch are shown interactively in
    the upper right part of the screen, in a small graph where, if the loss is reduced,
    the curve goes downwards. The loss test is painted in black, and the training
    loss is painted in gray.


    ## 5.3 Hyperparameter setting basics


    ### Classification with a single neuron


    Now that we know a bit more about this tool, let''s return to the first classification
    example that separates the data into two groups (clusters).


    I propose that we modify some parameters to practice with the tool before moving
    forward. For example, we can modify some parameters with a learning rate of 0.03
    and a `ReLU` activation function (the regularization is not going to be used since
    it is outside the scope of this book).


    We maintain the problem as classification, and I propose that we put the "ratio
    of training-to-test" to 50% of the data and that we also keep the "noise" parameter
    to zero to facilitate the visualization of the solution (although I suggest that
    later you practice with it on your own). We can leave the "batch size" at 10.


    And, as before, we will use "X1" and "X2" for the input. I suggest starting with
    a single hidden layer with a single neuron. We can achieve this by using the "-"
    or "+" buttons:


    ![](images/00056.jpeg)


    In the upper right, we see that the initial values of the "Test loss" and "Training
    loss" are high (the reader can get different values since the initial values are
    generated in a random way). But after pressing the "play" button, it can be seen
    that both the "Training loss" and the "Test loss" converge at very low ratios
    and remain the same. Moreover, in this case, both lines, black and gray, perfectly
    overlap.


    ![](images/00057.jpeg)


    ### Classification with more than one neuron


    Let''s choose another set of starting data like the one in the attached figure:


    ![](images/00058.jpeg)

