    0；为了简化起见，我们没有将其画在图上）。如果我们使用 2×2 的窗口应用最大池化操作（我们在中心矩阵中用其表示，它将空间划分为与窗口大小一致的马赛克式区域），我们将得到一个
    6×6 的矩阵，其中保持了 7 的等效表示（在右图中，0 被标记为白色，值为 1 的点被标记为黑色）：


    ![](img/00070.jpeg)


    如上所述，卷积层包含多个过滤器，因此，当我们分别对每个过滤器应用最大池化时，池化层所包含的池化过滤器数量与卷积过滤器的数量相同：


    ![](img/00071.jpeg)


    结果是，由于每个卷积过滤器中有 24×24 个神经元，在进行池化后，我们拥有 12×12 个神经元，这对应于在划分过滤器空间时出现的 12×12 个区域（每个区域的大小为
    2×2）。


    ## 6.3 在 Keras 中实现基础模型


    让我们看看如何使用 Keras 编写这个卷积示例。正如我们所说的，有几个值需要指定以对卷积和池化阶段进行参数化。在这里，我们将使用一个简化模型，其中每个维度的步长为
    1（窗口滑动的步长大小），填充为 0（在图像周围填充零）。这两个超参数将在下文中给出。池化将是如上描述的 2×2 窗口最大池化。


    ### 卷积网络的基本架构


    让我们开始实现第一个卷积网络，它将由卷积及其后的最大池化组成。在案例中，我们将使用 32 个过滤器，卷积层使用 5×5 窗口，池化层使用 2×2 窗口。我们将使用
    `ReLU` 激活函数。在这种情况下，我们正在配置卷积网络来处理大小为 `(28, 28, 1)` 的输入张量，这是 MNIST 图像的大小（第三参数是颜色通道，在我们案例中为
    1），我们通过第一层中的值 `input_shape = (28, 28, 1)` 来指定它：


    ```python

    from keras import layers

    from keras import models

    model = models.Sequential()

    model.add(layers.Conv2D(32,(5,5),activation=''relu'',input_shape=(28,28,1)))

    model.add(layers.MaxPooling2D((2, 2)))

    model.summary()

    ```


    ```

    Layer (type)             Output Shape  Param #

    ================================================

    conv2d_1 (Conv2D)       (None, 24, 24, 32)    832

    max_pooling2d_1 (MaxPooling2) (None, 12, 12, 32)    0

    ================================================

    Total params: 832

    Trainable params: 832

    Non-trainable params: 0

    ```


    `Conv2D` 层的参数数量对应于 5×5 的权重矩阵 `W` 和每个过滤器的偏置 `b`，共 832 个 (32 × (25 + 1))。最大池化不需要参数，因为它是一个寻找最大值的数学操作。


    ### 简单模型


    为了构建一个“深度”神经网络，我们可以堆叠类似于上一节中构建的层。为了向读者展示如何在示例中如何操作，我们将创建第二组层，该组卷积层具有 64 个使用 5×5
    窗口的过滤器，池化层具有 2×2 窗口。在这种情况下，输入通道的数量将取从上一层获取的 32 个特征的值，尽管正如我们之前看到的，没有必要指定它，因为 Keras
    会推断：


    ```python

    model = models.Sequential()

    model.add(layers.Conv2D(32,(5,5),activation=''relu'',input_shape=(28,28,1)))

    model.add(layers.MaxPooling2D((2, 2)))

    model.add(layers.Conv2D(64, (5, 5), activation=''relu''))

    model.add(layers.MaxPooling2D((2, 2)))

    ```


    如果使用 `summary()` 方法显示模型架构，我们可以看到：


    ```

    Layer (type)             Output Shape  Param #

    ================================================

    conv2d_1 (Conv2D)       (None, 24, 24, 32)    832

    max_pooling2d_1 (MaxPooling2) (None, 12, 12, 32)    0

    conv2d_2 (Conv2D)       (None, 8, 8, 64)      8160

    max_pooling2d_2 (MaxPooling2) (None, 4, 4, 64)    0

    ================================================

    ```


    `Conv2D` 层参数数量对应于 5×5 的权重矩阵 `W` 和每个过滤器的偏置 `b`，共 832 个 (32 × (25 + 1))。最大池化不需要参数，因为它是一个寻找最大值的数学操作。`Conv2D`
    和 `MaxPooling2D` 层的输出是三维形式 `(height, width, channels)`。随着进入隐藏层，宽度和高度维度往往缩小。内核的数量通过传递给
    `Conv2D` 的第一个参数控制（通常为 32 或 64）。


    现在我们有了 64 个 4×4 过滤器，下一步是添加一个全连接层，它将用于馈送最后的 softmax 层。在示例中，我们需要调整张量以适应全连接层的输入，该输入是一个一维张量，而前一个层的输出是三维张量。这就是为什么我们必须先将三维张量展平（flatten）为一维张量。在应用
    Softmax 之前，我们的输出 `(4,4,64)` 必须展平为 `(1024)` 向量。


    ```python

    model = models.Sequential()

    model.add(layers.Conv2D(32,(5,5),activation=''relu'',input_shape=(28,28,1)))

    model.add(layers.MaxPooling2D((2, 2)))

    model.add(layers.Conv2D(64, (5, 5), activation=''relu''))

    model.add(layers.MaxPooling2D((2, 2)))

    model.add(layers.Flatten())

    model.add(layers.Dense(10, activation=''softmax''))

    ```


    在这种情况下，softmax 层的参数数量为 `10 × 1024 + 10`，输出为如第二章示例中长度为 10 的向量。通过 `summary()` 方法，我们可以看到关于每层参数以及每层输出张量形状的信息。


