    ## 6.4 Hyperparameters of the convolutional layer


    The main hyperparameters of the convolutional neural networks not seen until now
    are: the size of the filter, the number of filters, the stride and padding.


    ### Size and number of filters


    The size of the window (`window_height` × `window_width`) that holds information
    from spatially close pixels is usually 3×3 or 5×5. The number of filters that
    tells us the number of characteristics we want to handle (`output_depth`) is usually
    32 or 64. In the `Conv2D` layers of Keras, these hyperparameters are what we pass
    as arguments in this order:


    `Conv2D(output_depth, (window_height, window_width))`


    ### Padding


    To explain the concept of padding let''s use an example. Let''s suppose an image
    with 5×5 pixels. If we choose a 3×3 window to perform the convolution, we see
    that the tensor resulting from the operation is size 3×3. That is, it shrinks
    a bit: exactly two pixels for each dimension, in this case. In the following figure
    it is visually displayed. Suppose that the figure on the left is the 5×5 image.
    In it, we have numbered the pixels to make it easier to see how the 3×3 drop moves
    to calculate the elements of the filter.


    ![](images/00073.jpeg)

