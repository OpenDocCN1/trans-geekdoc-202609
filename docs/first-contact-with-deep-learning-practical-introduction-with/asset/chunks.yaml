    最后，尽管它并不是深度学习的专属环境，但必须提到 `Scikit-learn`，它在深度学习社区中被频繁用于数据处理。`Scikit-learn` 拥有超过
    22500 次提交、1000 多名贡献者和近 30000 个星标。


    但正如我们已经过的，还有许多面向深度学习的框架。我们要重点介绍的包括 `Theano`（蒙特利尔学习算法研究所）、`Caffe`（伯克利大学）、`Caffe2`（Facebook
    研究）、`CNTK`（微软）、**MXNET**由亚马逊等支持）、`Deeplearning4j`、`Chainer`、`DIGITS`（英 vidia）、`Kaldi`、`Lasagne`、`Leaf`、`MatConvNet`、`OpenDeep`、`Minerva`
    和 `SoooA` 等。


    ### 开放出版伦理


    在过去的几年中，该研究领域与其他科学领域不同产生了一种开放出版文化许多许多人员立即将他们的结果（而不等待会议中常见的同行评审批准）发布在康奈尔大学的 arxiv.org
    (arXiv) 等数据库中。这意味着与这些文章相关的许多开源软件可用，使得该研究领域能够极其快速地发展，因为任何新发现都能立即供整个社区查看，并在可能的情况下在其基础上构建新的提议。


    对于这些技术的用户来说，这是一个极好的机会。研究小组公开发布其最新进展的原因可能是多样的。例如，在该领域被主要会议拒绝的文章可能会仅作为 `arxiv` 上的预印本进行传播。其中一篇推动深度学习进展的关键论文，它由
    G. Hinton、N. Srivastava、A. Krizhevsky、I. Sutskever 和 R. Salakhutdinov 编写，引入了 `Dropout`
    机制。这篇论文在 2012 年被 NIPS 拒绝。


    或者像 Google 在发布结果时，巩固了其作为行业领导者的声誉，吸引了下一波人才，而人才正是该主题进展的主要障碍之一。


    ### 算法进展


    得益于我们已经介绍的硬件改进，以及在该领域研究的科学家更强大的计算能力，新算法的设计已经取得了巨大的进展。例如，几年前，从算法角度来看训练多层网络是非常困难的。但在过去的十年里，激活函数、预训练网络的使用以及优化改进方面取得了令人印象深刻的进展。今天，从算法上来说，我们可以毫无问题地训练数百层的模型。


    ### 稠密连接网络


    就像你开始学习新语言编程时有一个 `Hello World` 的传统一样，在深度学习中，你从创建模型开始。通过这个例子，本章将介绍一些基本概念，尽可能地减少理论概念，旨在为读者提供特定案例的全局视图，以便阅读后续章节，在后续章节中将更详细地处理不同的主题。


