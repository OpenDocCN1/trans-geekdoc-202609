    60000/60000 [==================] - 1s 13us/step - loss: 1.3526 - acc: 0.7034


    10000/10000 [==================] - 0s 22us/step

    ```


    这是一个简单的示例，以便章节末尾的读者能够编写出自己的第一个神经网络，但正如我们将看到的，`fit()` 方法允许许多更多参数，这些参数对学习结果有非常重要的影响。此外，该方法返回一个
    `History` 对象，我们在示例中省略了它。它的 `History.history` 属性记录了连续训练（epochs）中训练数据的损失值和其他指标，如果指定了验证数据，还会记录验证数据的其他指标。


    ### 模型评估


    此时，神经网络已经完成训练，现在可以使用 `evaluation()` 方法评估其在新测试数据上的行为。该方法返回两个值：


    ```

    test_loss, test_acc = model.evaluate(x_test, y_test)

    ```


    这些值表示了我们的模型在从未见过的新数据上的表现好坏。这些数据在我们执行 `mnist.load_data()` 时已存储在 `x_test` 和 `y_test`
    中，我们将它们作为参数传递给该方法。在本书范围内，我们只关注其中一个：准确率：


    ```

    print(''Test accuracy:'', test_acc)

    ```


    测试准确率：0.9018


    准确率告诉我们，我们在在本章创建的模型在应用于模型从未见过的数据时，正确分类了其中 90% 的数据。


    读者应该注意，在这个示例中，为了评估模型，我们只关注了它的准确率，即模型做出的正确预测数与总预测数之间的比例（无论它属于哪一类别）。然而，尽管在这种情况下是足够的，但有时有必要深入探讨，并考虑模型在每个类别中做出的正确和错误预测的类型。


    在机器学习中，评估模型非常有用的工具是混淆矩阵，它是一个行有列的表格，用于统计预测值与真实值的对比。我们使用这张表来更好地理解模型的表现，并且在显式显示一个类别与另一个类别混淆时非常有用。对于像上一节解释的那种二分类器，其混淆矩阵结构如下：


    |  | 预测类别 |

    | --- | --- |

    | 正性 | 阴性 |

    | 实际类别 | 正性 | TP | FN |

    | 阴性 | FP | TN |

    | | | | | |


    真阳性 (TP)、真阴性 (TN)、假阳性 (FP) 和假阴性 (FN) 是类别为“1”（正性）和“0”（阴性）的二分类情况中，单次预测的四种可能结果。


    假阳性（False positive）是指结果被错误分类为正性，而实际上它是阴性的。假阴性（False negative）是指结果被错误分类为阴性，而实际上它是正性的。真阳性和阴性显然是正确的分类。


    通过这个混淆矩阵，可以通过将对角线的值相加并除以总数来计算准确率：


    `Accuracy = (TP + TN) / (TP + FP + FN + TN)`


    尽管如此，准确率在模型质量方面可能具有误导性，因为在衡量具体模型时，我们没有区分假阳性和假阴性类型的错误，就好像两者的重要性是一样的。例如，想一个预测蘑菇是否有毒的模型。在这种情况下，假阴性的代价（即提供有毒蘑菇供食用）可能是灾难性的。相反，假阳性的代价则完全不同。


    因此，我们有另一个指标称为灵敏度（Sensitivity 或召回率 recall），它告诉我们模型避免假阴性的能力如何：


    `Sensitivity = TP / (TP + FN)`


    换句话说，在所有正性观测值（有毒蘑菇）中，模型检测出了多少。


    从混淆矩阵中可以获得若干指标来关注其他情况，如此链接[[123]](#part0000_split_065.html#_ftn123) 所示，但详细讨论这一主题超出了本书的范围。使用某一个指标还是另一个指标的便利性将取决于具体情况，特别是与模型每个分类错误相关的“成本”。


    但读者会好奇，在我们有 10 个类而不是 2 个类的分类器中，混淆矩阵是怎样的。在这种情况下，我建议使用 Scikit-learn[[124]](#part0000_split_065.html#_ftn124)
    包，通过计算混淆矩阵来评估模型的质量，混淆矩阵如图所示[[125]](#part0000_split_065.html#_ftn125)：


    ![](img/00038.jpeg)


    在这种情况下，对角线上的元素代表模型预测标签与标签实际值相符的点数，而其他值则表示模型分类错误的情况。因此，对角线上的值越高，预测就越好。在这个示例中，如果读者计算对角线值之和除以矩阵总值，他们将发现这与准确率是一的。


    ### 生成预测


    最后，读者需要知道我们如何使用上一节中训练的模型来做出预测。为了实现这一点，Keras 提供了 `predict()` 方法。为了测试这一点，我们可以选择任意元素。例如，让我们取
    `x_test` 中的第 11 个。在看到预测之前，让我们看看图像，以便自己检查模型是否做出了正确的预测：


    ```

    plt.imshow(x_test[11], cmap=plt.cm.binary)

    ```


    ![](img/0039.jpeg)


    我想读者会同意，在这种情况下它对应数字 6。现在让我们看看模型的 `predict()` 方法执行以下代码后，正确地预测了我们刚刚估计的值：


    ```

    predictions = model.predict(x_test)

    ```


    `predict()` 方法返回一个包含整个数据集元素预测的向量。我们可以通过 Numpy 的 `argmax` 函数知道哪一类的概率最大。具体地对于第 11
    项：


    ```

    np.argmax(predictions[11])

    ```


    6


    我们可以通过打印方法返回的向量来检查：


    ```

    print(predictions[11])

