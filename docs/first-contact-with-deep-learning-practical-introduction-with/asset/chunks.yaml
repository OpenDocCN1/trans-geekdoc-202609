- raw: "A loss function is one of the parameters required to quantify how close a\
    \ particular neural network is to the ideal weight during the training process.\
    \ \n\nIn the Keras manual page[\\[128\\]](#part0000_split_065.html#_ftn128), we\
    \ can find all types of loss functions available. Some have their concrete hyperparameters\
    \ that must be indicated; in the example of the previous chapter, when we use\
    \ categorical\\_crossentropy as a function of loss, our output must be in a categorical\
    \ format. The choice of the best function of loss resides in understanding what\
    \ type of error is or is not acceptable for the problem in particular.\n\n###\
    \ Optimizers\n\nThe optimizer is another of the arguments required in the compile()\
    \ method. Keras currently has different optimizers that can be used: SGD, RMSprop,\
    \ Adagrad, Adadelta, Adam, Adamax, Nadam. You can find more detail about each\
    \ of them in the Keras documentation[\\[129\\]](#part0000_split_065.html#_ftn129).\n\
    \nIn general, we can see the learning process as a global optimization problem\
    \ where the parameters (weights and biases) must be adjusted in such a way that\
    \ the loss function presented above is minimized. In most cases, these parameters\
    \ cannot be solved analytically, but in general they can be approached well with\
    \ iterative or optimizing optimization algorithms, such as those mentioned above.\n\
    \n### Gradient descent \n\nWe will explain one of the concrete optimizers so that\
    \ you understand the overall operation of the optimizers. Specifically, the gradient\
    \ descent, the basis of many optimizers and one of the most common optimization\
    \ algorithms in Machine Learning and Deep Learning.\n\nGradient descent uses the\
    \ first derivative (gradient) of the loss function when updating the parameters.\
    \ Remember that the gradient gives us the slope of a function at that point. Without\
    \ being able to go into detail, the process consists in chaining the derivatives\
    \ of the loss of each hidden layer from the derivatives of the loss of its upper\
    \ layer, incorporating its activation function in the calculation (that's why\
    \ the activation functions must be derivable). In each of the iterations, once\
    \ all the neurons have the value of the gradient of the loss function that corresponds\
    \ to them, the values of the parameters are updated in the opposite direction\
    \ to that indicated by the gradient. The gradient, in fact, always points in the\
    \ direction in which the value of the loss function increases. Therefore, if the\
    \ negative of the gradient is used, we can get the direction in which we tend\
    \ to reduce the loss function.\n\nLet's see the process in a visual way assuming\
    \ only one dimension: suppose that this line represents the values that the loss\
    \ function takes for each possible parameter value and that the negative of the\
    \ gradient is depicted by the arrow in the initial point:\n\n![](images/00045.jpeg)\n\
    \nTo determine the next value for the parameter, the gradient descent algorithm\
    \ modifies the value of the initial weight to go in the opposite way to the gradient\
    \ (since it points in the direction in which the loss grows and we want to reduce\
    \ it), adding a proportional amount to this. The magnitude of this change is determined\
    \ by the value of the gradient and by a learning rate hyperparameter that we can\
    \ specify (which we will present shortly). Therefore, conceptually, it is as if\
    \ we follow the slope downhill until we reach a local minimum:\n\n![](images/00046.jpeg)\n\
    \nThe gradient descent algorithm repeats this process getting closer and closer\
    \ to the minimum until the value of the parameter reaches a point beyond which\
    \ the loss function cannot decrease:\n\n![](images/00047.jpeg)\n\n### Stochastic\
    \ Gradient Descent (SGD)\n\nIn the previous sections we have seen how the values\
    \ of the parameters are adjusted but not in what frequency:\n\n*   After each\
    \ entry example?\n\n*   After each round of the whole set of training examples\
    \ (epoch)? \n\n*   After a sample of examples of the training set?\n\nIn the first\
    \ case we speak of online learning, when the gradient is estimated from the observed\
    \ loss for each example of the training; it is also when we talk about Stochastic\
    \ Gradient Descent (SGD). The second is known as batch learning and is called\
    \ Batch Gradient Descent. The literature indicates that, usually, better results\
    \ can be obtained with online learning, but there are reasons that justify the\
    \ use of batch learning because many optimization techniques only work with it.\n\
    \nBut if the data is well distributed, a small subset of them should give us a\
    \ pretty good approximation of the gradient. We may not get the best estimate,\
    \ but it is faster and, given the fact that we are iterating, this approach is\
    \ very useful. For this reason, the third aforementioned option known as mini-batch\
    \ is often used. This option is usually as good as the online, but fewer calculations\
    \ are required to update the parameters of the neural network. In addition, the\
    \ simultaneous calculation of the gradient for many input examples can be done\
    \ using matrix operations that are implemented very efficiently with GPU, as we\
    \ have seen in chapter 1.\n\nThat's why, in reality, many applications use the\
    \ stochastic gradient descent (SGD) with a mini-bach of several examples. To use\
    \ all the data, what is done is to partition the data in several batches. Then\
    \ we take the first batch, go through the network, calculate the gradient of its\
    \ loss and update the parameters of the neural network; this would follow successively\
    \ until the last batch. Now, in a single pass through all the input data, only\
    \ a number of steps have been made equal to the number of batches.\n\nSGD is very\
    \ easy to implement in Keras. In the compile() method it is indicated that the\
    \ optimizer is SGD (value sgd in the argument), and then all that must be done\
    \ is to specify the batch size in the training process with the fit() method as\
    \ follows :\n\nmodel.fit(X\\_train, y\\_train, epochs=5, batch\\_size=100)\n\n\
    In this code example that uses the fit() method, we are dividing our data into\
    \ batches of 100 with the batch\\_size argument. With the number of epochs we\
    \ are indicating how many times we carry out this process on all the data. Later\
    \ in this chapter, when we have already presented the usual optimizer parameters,\
    \ we will return to these two arguments.\n\n## 4.4        Model parameterization\n\
    \nIf the reader at the end of the previous chapter has executed a model with the\
    \ hyperparameters that we use there, I assume that the model's accuracy will have\
    \ exceeded 90%. Are these results good? I think they are fantastic, because it\
    \ means that the reader has already programmed and executed his first neural network\
    \ with Keras. Congratulations!\n\nAnother thing is that there are other models\
    \ that improve accuracy. And this depends on having a great knowledge and a lot\
    \ of practice to handle well with the many hyperparameters that we can change.\
    \ For example, with a simple change of the activation function of the first layer,\
    \ passing from a sigmoid to a relu like the one shown below:\n\nmodel.add(Dense(10,\
    \ activation='relu', input\\_shape=(784,)))\n\nWe can get 2% more accuracy with\
    \ more or less the same calculation time.\n\nIt is also possible to increase the\
    \ number of epochs, add more neurons in a layer or add more layers. However, in\
    \ these cases, the gains in accuracy have the side effect of increasing the execution\
    \ time of the learning process. For example, if we add 512 nodes to the intermediate\
    \ layer instead of 10 nodes:\n\nmodel.add(Dense(512, activation='relu', input\\\
    _shape=(784,)))\n\nWe can check with the summary() method that the number of parameters\
    \ increases (it is a fully connected) and the execution time is significantly\
    \ higher, even reducing the number of epochs. With this model, the accuracy reaches\
    \ 94%. And if we increase to 20 epochs, a 96% accuracy is achieved."
