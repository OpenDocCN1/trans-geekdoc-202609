    本书中的代码以笔记本（notebook）的形式存储在本书的 GitHub 上，尽管如果读者愿意，也可以作为普通的 Python 程序运行。


    ## 环境搭建


    在书中，我们将使用 Google 提供的 Colaboratory 环境（`Colab`）。


    ![](img/00003.jpeg)


    这是一个 Google 研究项目，旨在帮助传播机器学习教育和研究。它是一个 Jupyter 笔记本环境，无需配置即可完全在云端运行，允许使用 `Keras`、`TensorFlow`
    和 `PyTorch`。Colab 与其他免费云服务相比最重要的区别是：Colab 提供 `GPU` 且完全免费。关于该服务的详细信息可以在 faq 页面找到。


    笔记本存储在 Google Drive 中，并可以像 Google Docs 一样进行共享。该环境是免费的，只需要一个 Google 账户。此外，该环境允许免费使用
    `NVIDIA K80` `GPU`。


    第一次进入时，你将看到一个如下所示的窗口。在此中，你应该选择 `GITHUB` 标签，并在 URL 字段中填写 `"JordiTorresBCN"`，在 `Repository`
    字段中填写 `"jorditorresBCN / DEEP-LEARNING-practical-introduction-with-Keras"`。


    ![](img/00004.jpeg)


    你将看到三个笔记本，它们是我们整本书将使用的笔记本。要加载笔记本，请点击它们右侧出现的按钮（在新标签页中打开笔记本）：


    ![](img/00005.jpeg)


    默认情况下，Colab 笔记本运行在 `CPU` 上。你可以将笔记本切换为使用 `GPU` 运行。为了获得一个 `GPU` 的访问，我们需要选择标签 `Runtime`（运行时），然后如图所示选择“Change
    runtime type”（更改运行时类型）：


    ![](img/00006.jpeg)


    当弹出窗口出现时，选择 `GPU`。确保“Hardware accelerator”（硬件加速器）设置为 `GPU`（默认是 `CPU`）。


    ![](img/00007.jpeg)


    可能会出现警告，指示代码并非由 Google 创建。我希望你信任我的代码并尽管管运行它！ ;-)


    ![](img/00008.jpeg)


    随后，确保你已连接到运行时（菜单栏中“connected”旁边有一个绿色对选标记）：


    ![](img/00009.jpeg)


    现在你可以在 Google Colab 中运行 GitHub 仓库了。享受其中吧！


    ## 超级计算，深度学习的核心


    可能在此时，某些读者已经提出了这个问题：为什么像我这样研究超级计算领域的研究员会开始研究深度学习？


    事实上，很多年前，我就开始对超级计算如何有助于改进机器学习方法感兴趣；然后在 2006 年，我开始与一位好朋友——加泰罗尼亚理工大学（UPC）计算机系教授、机器学习和数据挖掘专家
    Ricard Gavald 共同指导博士论文。


    但直到 2013 年 9 月，当我已经在机器学习方面有了相当实的知识基础时，我开始将兴趣放在深度学习上。得益于 UPC 计算机体系的研究员 Jordi Nin，我发现了
    Google 研究人员编写的文章《Building High-level Features Using Large Scale Unsupervised Learning》。在这篇发表于之前的国际机器学习会议（`ICML`）上的文章中，作者解释了他们如何在拥有
    1,000 台机器、16,000 个核心的集群中训练深度学习模型。看到超级计算如何让这类应用成为可能，我非常高兴，正如我几个月后在博客中写的那样，这证明了导致小组在我们的路线图中增加这一重点的理由。


    得益于摩尔定律，在 2012 年这些 Google 研究人员写这篇文章时，我们已经拥有了超级计算机，让我们能够解决几年前由于计算能力限制而无法解决的问题。例如，我在
    1982 年访问并使用打孔卡执行我的第一个程序的计算机是一台 `Fujitsu`（富士通），它每秒可以执行略高于百万次的操作。30 年后，在 2012 年，我们当时巴塞罗那超级计算中心-国家超级计算中心（`BSC`）拥有的
    `Marenostrum` 超级计算机比我开始使用的计算机快了 1,000,000 倍。


    ![](img/00010.jpeg)


    随着当年的升级，`MareNostrum` 超级计算机提供了 1.1 Petaflops 的理论峰性能（每秒 1,100,000,000 次浮点运算）。它通过
    3,056 台服务器、总计 48,896 个核心以及安置在 36 个机架中的 115,000 Gigabytes 总内存实现了这一目标。当时`Marenostrum`
    超级计算机被认为是世界上最快的计算机之一。它在每半年更新一次、排名全球 500 台最强超级计算机的 `TOP500` 列表中位列第 36 位。附图中你可以找到一张照片，其中你可以看到安置在巴塞罗那
    UPC 园区 Torres Girona 楼宇内的 `Marenostrum` 计算机机架。


    ## ImageNet 竞赛中的第一块 GPU


    正是在那个期间，我开始意识到超级计算在这一新研究领域的适用性。当我开始寻找有关该主题的研究论文时，我发现了 ImageNet 竞赛的存在，以及多伦多大学团队在
    2012 年竞赛中获得的结果。


    ImageNet 竞赛（大规模视觉识别挑战）自 2010 年以来一直举办，到那时它已成为计算机视觉社区大规模对象识别的基准。2012 年，Alex Krizhevsky、Ilya
    Sutskever 和 Geoffrey E. Hilton 首次使用了硬件加速器 `GPU`（图形处理器），这种硬件当时已被用于像我们位于巴塞罗那的超级计算中心，以提高需要大量计算性能应用的执行速度。


    例如，当时 `BSC` 已经有一台名为 `MinoTauro` 的超级计算机，拥有 128 个 `Bull505` 节点，每个节点配备了 2 个 `Intel`
    处理器和 2 个 `NVIDIA` 的 `Tesla M2090` `GPUs`。它的峰值性能为 186 Teraflops，于 2011 年 9 月发布（好奇的是，当时根据
    Green500 列表它是欧洲效率最高的超级计算机）。


    直到 2012 年，我们每年从计算机获得的计算能力增长是 `CPU` 改进的结果。然而从那时起，深度学习计算能力的增长不仅归功于它们，还归功于基于 `GPU`
    加速器的新大规模并行系统，这些系统的效率比传统的 `CPU` 高得多。


    '
