- raw: "Finally, and although it is not an exclusive environment of Deep Learning,\
    \ it is important to mention Scikit-learn[\\[91\\]](#part0000_split_065.html#_ftn91),\
    \ that is used very often in the Deep Learning community for the preprocessing\
    \ of data[\\[92\\]](#part0000_split_065.html#_ftn92). Scikit-learn has more than\
    \ 22500 commits, more than 1000 contributors and nearly 30,000 stars[\\[93\\]](#part0000_split_065.html#_ftn93).\n\
    \nBut as we have already advanced, there are many other frameworks oriented to\
    \ Deep Learning. Those that we would highlight are Theano[\\[94\\]](#part0000_split_065.html#_ftn94)\
    \ (Montreal Institute of Learning Algorithms), Caffe[\\[95\\]](#part0000_split_065.html#_ftn95)\
    \ (University de Berkeley), Caffe2[\\[96\\]](#part0000_split_065.html#_ftn96)\
    \ (Facebook Research) , CNTK[\\[97\\]](#part0000_split_065.html#_ftn97) (Microsoft),\
    \ MXNET[\\[98\\]](#part0000_split_065.html#_ftn98)  (supported by Amazon among\
    \ others), Deeplearning4j[\\[99\\]](#part0000_split_065.html#_ftn99), Chainer[\\\
    [100\\]](#part0000_split_065.html#_ftn100) , DIGITS[\\[101\\]](#part0000_split_065.html#_ftn101)\
    \ (Nvidia), Kaldi[\\[102\\]](#part0000_split_065.html#_ftn102), Lasagne[\\[103\\\
    ]](#part0000_split_065.html#_ftn103), Leaf[\\[104\\]](#part0000_split_065.html#_ftn104),\
    \ MatConvNet[\\[105\\]](#part0000_split_065.html#_ftn105), OpenDeep[\\[106\\]](#part0000_split_065.html#_ftn106),\
    \ Minerva[\\[107\\]](#part0000_split_065.html#_ftn107) and SoooA[\\[108\\]](#part0000_split_065.html#_ftn108)\
    \ , among many others.\n\n### An open-publication ethic\n\nIn the last few years,\
    \ in this area of research, in contrast to other scientific fields, a culture\
    \ of open publication has been generated, in which many researchers publish their\
    \ results immediately (without waiting for the approval of the peer review usual\
    \ in conferences) in databases such as arxiv.org of Cornell University (arXiv)[\\\
    [109\\]](#part0000_split_065.html#_ftn109). This implies that there are numerous\
    \ softwares available in open source associated with these articles, which allow\
    \ this field of research to move tremendously quickly, since any new discovery\
    \ is immediately available for the whole community to see it and, if it is the\
    \ case, build on top a new proposal.\n\nThis is a great opportunity for users\
    \ of these techniques. The reasons for research groups to openly publishing their\
    \ latest advances can be diverse. For example, articles rejected in main conferences\
    \ in the area can propagate solely as a preprint on arxiv. This is the case of\
    \ one key paper for the advancement of Deep Learning written by G. Hinton, N.\
    \ Srivastava, A. Krizhevsky, I. Sutskever and R. Salakhutdinov that introduced\
    \ Dropout mechanism[\\[110\\]](#part0000_split_065.html#_ftn110).  This paper\
    \ was rejected from NIPS in 2012[\\[111\\]](#part0000_split_065.html#_ftn111).\n\
    \nOr Google, when publishing the results, consolidates its reputation as a leader\
    \ in the sector, attracting the next wave of talent, which is one of the main\
    \ obstacles to the advancement of the topic.\n\n### Advances in algorithms\n\n\
    Thanks to the improvement of the hardware that we have already presented and to\
    \ having more computing capacity by the scientists who were researching in the\
    \ area, it has been possible to advance dramatically in the design of new algorithms\
    \ that have allowed to overcome important limitations detected in the previous\
    \ algorithms. For example, not until many years ago it was very difficult to train\
    \ multilayer networks from an algorithm point of view. But in this last decade\
    \ there have been impressive advances with improvements in activation functions,\
    \ use of pre-trained networks, improvements in training optimization algorithms,\
    \ etc. Today, algorithmically speaking, we can train models of hundreds of layers\
    \ without any problem.\n\n# 2       Densely Connected Networks\n\nIn the same\
    \ way that when you start programming in a new language there is a tradition of\
    \ doing it with a Hello World print, in Deep Learning you start by creating a\
    \ recognition model of handwritten numbers. Through this example, this chapter\
    \ will present some basic concepts of neural networks, reducing theoretical concepts\
    \ as much as possible, with the aim of offering the reader a global view of a\
    \ specific case to facilitate the reading of the subsequent chapters where different\
    \ topics in the area will be dealt with in more detail. \n\n## 2.1        Case\
    \ of study: digit recognition\n\nIn this section we introduce the data we will\
    \ use for our first example of neural networks: the MNIST dataset, which contains\
    \ images of handwritten digits.\n\nThe MNIST dataset, which can be downloaded\
    \ from The MNIST database page[\\[112\\]](#part0000_split_065.html#_ftn112), is\
    \ made up of images of hand-made digits. This dataset contains 60,000 elements\
    \ to train the model and 10,000 additional elements to test it, and it is ideal\
    \ for entering pattern recognition techniques for the first time without having\
    \ to spend much time preprocessing and formatting data, both very important and\
    \ expensive steps in the analysis of data and of special complexity when working\
    \ with images; this dataset only requires small changes that we will comment on\
    \ below.\n\nThis dataset of black and white images has been normalized to 20×20\
    \ pixels while retaining their aspect ratio. In this case, it is important to\
    \ note that the images contain gray levels as a result of the [anti-aliasing](https://es.wikipedia.org/wiki/Antialiasing)[\\\
