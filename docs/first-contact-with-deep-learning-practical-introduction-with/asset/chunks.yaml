    \n![](img/00059.jpeg)\n\n让我们看左侧的另一个数据集，数据被划分为四个不同的正方形区域。现在，这个问题无法用之前的网络解决，但我建议你尝试一下：\n\
    \n![](img/00060.jpeg)\n\n如所示，我们无法获得良好的分类（尽管在某些情况下，由于初始化是随机的，仅需 3 个神经元可能有效，但如果你进行多次测试，你会发现这通常是无法实现的）。然而，如果我们像下图所示使用\
    \ 5 个神经元，读者可以看到这个神经网络如何针对这种情况获得良好的分类： \n\n![](img/00061.jpeg)\n\n### 多层分类\n\n\
    现在我们将尝试对该工具中具有最复杂模式的数据集进行分类。橙色和蓝色数据点的涡旋结构是一个具有挑战性的问题。如果我们依赖之前的网络，我们发现即使没有达到工具允许的最大数量\
    \ 8 个神经元，我们也无法获得良好的分类结果：\n\n![](img/00062.jpeg)\n\n如果读者已经尝试过，我假设在这种情况下你会得到几个不错的测试损失值。现在是时候增加更多的层了；我向你保证，如果你使用工具允许的所有层，你就能实现目标：\n\
    \n![](img/00063.jpeg)\n\n但你会发现，显而易见，学习参数的过程需要很长的时间。\n\n实际上，使用较少的层数或神经元也可以获得良好的结果；我挑战你自己去玩玩，例如更改激活函数以获得更简单的模型。你也可以考虑测试任何其他参数。\n\
    \n![](img/00064.jpeg)\n\n该工具只考虑全连接神经网络；稍我们将看到卷积神经网络（以及我们在书中不会涉及的循环神经网络）呈现出更复杂的困境。但只有通过这些全连接网络，我们才能看到最难调整的超参数之一，就是决定模型有多少层，以及每层有多少个神经元。\
    \ \n\n在隐藏层中使用极少数的神经元会导致所谓的“欠拟合”（underfitting），即模型拟合不足，因为隐藏层中的神经元太少，无法正确检测复杂数据集中的信号。\n\
    \n另一方面，在隐藏层中使用过多的神经元会导致许多问题。首先，它可能会产生“过拟合”（overfitting），即当神经网络的处理能力过强，以至于训练集中有限的信息不足以训练隐藏层中所有的神经元。但另一方面，隐藏层中大量的神经元会增加训练网络所需的时间，导致无法在必要的时间内正确训练神经网络。\n\
    \n显然，我们必须在隐藏层中过多和过少的神经元之间取得折中，这就是为什么我已经提到过，我们面临的是一个需要艺术而非科学的挑战。\n\n# 6 卷积神经网络\n\
    \n此时，我们准备好处理另一种类型的神经网络，所谓的卷积神经网络，它们广泛应用于计算机视觉任务。这些网络由一个输入层、一个输出层和几个隐藏层组成，其中一些是卷积层，因此得名。\n\
    \n在本章中，我们将介绍一个特定的案例，并逐步进行，以理解这种类型网络的基本概念。具体来说，我们将与读者一起编写一个卷积神经网络来解决上面看到的 MNIST\
    \ 数字识别问题。\n\n## 6.1 卷积神经网络简介\n\n卷积神经网络（缩写为 `CNNs` 或 `ConvNets`）是深度学习神经网络的一种具体形式。它们在\
    \ 90 世纪末就已经被使用，但近年来由于其在图像识别方面取得了令人印象深刻的结果而变得极其流行，深远影响了计算机视觉领域。\n\n卷积神经网络与之前章节中的神经网络非常相似：它们由具有权重和偏置参数的神经元组成，这些参数是可以学习的。但\
    \ `CNN` 的区别特征是它们显式地假设输入是图像，这允许我们在架构中编码某些属性，以识别图像中的特定元素。\n\n为了直观地理解这些神经网络如何工作，让我们思考我们是如何识别事物的。例如，当我们看到一张脸时，我们识别它因为它有耳朵、眼睛、鼻子、头发等。然后，在判断某物是否是脸时，我们就像脑中存在了一些用于验证标记特征的验证框一样进行操作。有时一张脸可能没有耳朵，因为它被头发遮住了，但我们仍以一定的概率将其分类为脸，因为我们看到了眼睛、鼻子和嘴。实际上，我们可以将其视为等于第\
    \ 2 章提出的分类器，它预测输入图像是脸或不是脸的概率。\n\n但在现实中，我们必须先知道耳朵或鼻子的样貌，才能判断图像中是否存在它们；也就是说，我们必须先识别出线条、边缘、纹理或形状，这些特征类似于包含耳朵或鼻子的特征。这正是卷积神经网络层的任务。\n\
    \n但仅仅识别这些元素不足以判断某物是脸。我们还必须识别脸的部位是如何相互连接的、相对大小等；否则，这个脸看起来不像我们熟悉的样子。视觉上，关于层学习内容的直观想法通常通过\
    \ Andrew Ng 小组的这篇参考文章中的示例给出[[133]](#part0000_split_065.html#_ftn133)。\n\n![](img/00065.jpeg)\n\
    \n我们希望通过这个视觉示例传达的观点是，实际上，在卷积神经网络中每一层都在学习不同层次的抽象。读者可以想象，通过具有许多层的网络，可以识别输入数据中更复杂的结构。\
    \ \n\n## 6.2 卷积神经网络的基本组件\n\n现在我们已经直观理解了卷积神经网络如何分类图像，我们将展示一个 MNIST 数字识别的示例，并从这里引入定义卷积网络的两种层，这些层可以表示为两种操作的特殊神经元组：卷积和池化。\n\
    \n### 卷积操作\n\n全连接层与卷积操作中的特殊层（我们称之为卷积层）之间的根本区别在于：全连接层在全局输入空间中学习全局模式，而卷积层在二维小窗口中学习局部模式。\n"
