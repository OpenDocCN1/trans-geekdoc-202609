    \nIn the training phase of a model, ideal values are learned for the model parameters\
    \ (the wi weights and the b bias). In supervised learning, the way to achieve\
    \ this is to apply an automatic learning algorithm that obtains the value of these\
    \ parameters by examining many labeled examples and try to determine values for\
