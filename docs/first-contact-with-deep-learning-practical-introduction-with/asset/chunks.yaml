    另一方面，请记住我们拥有标签，在我们的案例中这些标签是 `0` 到 `9` 之间的数字，表示图像代表的数字，也就是说，它属于哪一类。在这个示例中，我们将用一个包含
    10 个位置的向量来表示每个标签，其中对应于表示图像数字的位置包含一个 `1`，其余位置包含 `0`。


    ## 独热编码 (One-hot encoding)

    这种将标签转换为长度与不同标签数量相等的零向量，并在对应标签的索引处放置一个 `1` 的过程被称为 `one-hot encoding`。


    ## 2.2 感知器 (Perceptron)

    在继续之前，对于读者来说，对单个神经元如何工作以实现其从 `training_dataset` 中学习的目的进行简短的直观解释将很有帮助。让我们来看一个非常简单的例子，来说人工神经元是如何学习的。


    ### 回归算法

    基于上一章解释的内容，让我们简要回顾一下经典的机器学习回归和分类算法，因为它们是我们的深度学习解释的起点。


    我们可以说，回归算法使用误差衡量标准（即 `loss`）来对不同输入变量（`features`）之间的关系进行建模，该误差将在迭代过程中被最小化，以便使预测“尽可能准确”。我们将讨论两种类型：`logistic
    regression` 和 `linear regression`。


    `logistic regression` 和 `linear regression` 之间的主要区别在于模型输出的类型；当我们的输出是离散的时，我们称之为
    `logistic regression`；当输出是连续的时，我们称之为 `linear regression`。


    遵循第一章引入的定义，`logistic regression` 是一种带有监督学习的算法，用于分类。我们接下来将使用的示例（通过分配类型为 `0` 或 `1`
    的离散值来识别输入示例属于哪一类）是一个二分类问题。


    ### 基础的人工神经元

    为了展示基础神经元是如何工作的，让我们假设一个简单的例子：在二维维平面上有一组点，每个点都已标记为“正方形”或“圆形”：


    ```

    images/00022.jpeg

    ```


    给定一个新点 `X`，我们想知道它对应的标签是什么：


    ```

    images/00023.jpeg

    ```


    一种常用方法是画一条线将这两组分开，并使用这条线作为分类器：


    ```

    images/00024.jpeg

    ```


    在这种情况下，输入数据将由形式为 `(x1, x2)` 的向量表示，指示它们在二维空间中的坐标，我们的函数将返回 `''0''` 或 `''1''`（在线的上方或下方），以确定它应该被分类为“正方形”还是“圆形”。正如我们所看到的，这是
    `linear regression` 的情况，按照第一章所示的符号，“这条线”（分类器）可以定义为：


    `y = w1x1 + w2x2 + b`


    更通地说，我们可以将线表示为：


    `y = W * X + b`


    为了分类输入元素 `X`（在我们的案例中是二维的），我们必须学习一个与输入向量维度相同的权重向量 `W`，即向量 `(w1, w2)` 以及一个偏置 `b`。


    有了这些计算出的值，我们现在可以构建人工神经元来分类新元素 `X`。基本上，神经元将此向量 `W` 应用于每个维度的值上，并在最后加上偏置 `b`。结果将通过一个非线性
    `activation` 函数处理，产生 `''0''` 或 `''1''` 的结果。


    ```

    images/00025.jpeg

    ```


    现在，我们需要一个对变量 `z` 应用变换的函数，使其变为 `''0''` 或 `''1''`。虽然有几种函数（我们在第四章中称之为“激活函数”），但在本示例中，我们将使用一种名为
    `sigmoid` 的函数，它返回 0 到 1 之间的实际值：


    ```

    images/00026.jpeg

    ```


    如果我们分析之前的公式，可以看到它总是倾向于给出接近 0 或 1 的值。如果输入 `z` 足够大且为正，`e` 的 `-z` 次方为 0，因此 `y` 取值为
    1。如果 `z` 是一个很大的负数，由于 `e` 的大正幂，公式的分母将是一个很大的数，因此 `y` 将接近 0。从图上看，`sigmoid` 函数呈现这种形式：


    ```

    images/00027.jpeg

    ```


    到目前为止，我们展示了如何定义人工神经元，这是神经网络可以具有的最简单架构。特别是这种架构在主题文献中被称为 `Perceptron`（也称为线性阈值单元
    LTU），由 Frank Rosenblatt 于 1957 年发明，并用以下方案直观地总结：


    ```

    images/00028.jpeg

    ```


    最后，让我帮助读者直观理解此神经元如何从已经标记为“正方形”或“圆形”的输入数据中学习权重 `W` 和偏置 `b`。这是一个针对已知输入示例的迭代过程，将模型估计的标签值与元素的预期标签值进行比较。在每次迭代后，参数值都会进行调整，使得随着我们不断迭代，获得的误差越来越小，目标是最小化上述损失函数。以下方案想要直观地概括一个感知器的学习过程：


    ```

    images/00029.jpeg

    ```


    ### 多层感知器

    但在继续示例之前，我们将简要介绍当由我们刚刚介绍的感知器构建神经网络时，神经网络通常采用的形式。


    '
