    \ followed by new approaches, success and financing. Moreover, during most of\
    \ its history, Artificial Intelligence research has been dynamically divided into\
    \ subfields based on technical considerations or concrete mathematical tools and\
    \ with research communities that sometimes did not communicate sufficiently with\
    \ each other.\n\n### Machine Learning \n\nAs we said in the previous section,\
