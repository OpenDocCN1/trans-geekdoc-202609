- raw: 'The Universitat Politècnica de Catalunya · BarcelonaTech (UPC) is a public
    institution dedicated to higher education and research, specialised in the fields
    of engineering, architecture and science.  The activity that goes on at UPC campuses
    and schools has made the University a benchmark institution. Currently has 23,369
    bachelor''s students, 2,157 doctoral degree students, 5,338 master''s degree students,
    2,775 lifelong learning students and 5,068 staff members. The University harnesses
    the potential of basic and applied research, and transfers technology and knowledge
    to society.  As a leading member of international networks of excellence, the
    UPC has a privileged relationship with global scientific and educational organisations.
    More information on page www.upc.edu


    About Facultat d’Informàtica de Barcelona (FIB)  


    The Facultat d''Informàtica de Barcelona (Barcelona School of Informatics) is
    the reference center for computer studies since its inception in 1976, and the
    beginning of the educational activities during 1977-1978. Throughout these 40
    years, the faculty has been in charge of the bachelor’s degree, diploma courses,
    technical engineering and master degrees and currently, the formal qualifications
    in the field of Computer Science and related subjects. The Facultat d''Informàtica
    de Barcelona, in addition to bet on a solid scientific basis that will be useful
    throughout the professional career, promotes the professional skills essential
    in the labor market. That is why the faculty provides the students with teaching
    laboratories with the most modern equipment and classrooms with the latest technologies
    to support the most modern teaching methodologies. The agreements with companies
    and top research centers help to ensure almost full employment of the graduates.
    Therefore, the Bachelor and Master degrees of the Facultat d''Informàtica de Barcelona
    are accredited by the most prestigious international committees and the faculty
    has been recognized with several awards for quality and innovation in teaching.
    More information on page www.fib.upc.edu


