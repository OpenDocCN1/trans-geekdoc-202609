- raw: "For this reason, the book will have an eminently practical orientation. Therefore\
    \ the theoretical-mathematical part will be reduced as much as possible, although\
    \ it is strictly necessary to present some theoretical details to offer a solid\
    \ knowledge to the reader. This means that the pages will be interspersed with\
    \ theoretical and practical knowledge, complementary to the learning process.\n\
    \nBefore finishing this preface, let me say thanks for reading this book! This\
    \ fact alone makes me happy and justifies my effort in writing it. Those who know\
    \ me well, know that teaching (and education in general) is one of my passions\
    \ and keeps me energized and motivated.\n\nAs my dear mother would sometimes reminds\
    \ me, when I was young I used to say that when I grew up I wanted to teach, to\
    \ be a teacher. Well, here I am, my dream came true! \n\nJordi Torres i Viñals.\
    \ July 15, 2018.\n\nIf the reader needs to contact the author in relation to the\
    \ content of this book or wants to send him their comments, they can do so via\
    \ email: Jordi.Torres@DeepLearning.Barcelona\n\nPreliminary considerations\n\n\
    In this book, the reader will find a guide to understanding the basics of Deep\
    \ Learning with the help of the Keras library, which they will learn to use with\
    \ the aim of developing and evaluating Deep Learning models. Although Deep Learning\
    \ is based on fascinating mathematics, it is not strictly necessary in order to\
    \ start, or even to create projects that generate value for the company, thanks\
    \ to Python libraries such as Keras.\n\nTherefore, this book will focus on practical\
    \ issues to show the reader the exciting world that can be opened up with the\
    \ use of Deep Learning. It is important to keep in mind that we can only examine\
    \ a small part because it is impossible to show its total scope in a single book.\
    \ Just keeping abreast of the latest research, technologies or tools that are\
    \ appearing is an almost impossible mission, like drinking from a fire hose\n\n\
    ### Audience for this book\n\nThis is an introductory work, initially designed\
    \ to support my teaching duties at the UPC to students of computer engineering\
    \ with little or no previous knowledge of Machine Learning. But in turn, this\
    \ book can also be useful to engineers who have left the classrooms and are working\
    \ but need, or simply want to, learn about this topic.\n\nTherefore the book is\
    \ written in the form of \"short distance\" with the reader, as if we were in\
    \ one of my classes at the UPC. To facilitate this, I will introduce the knowledge\
    \ and concepts sequentially, trying to involve the reader by requiring them to\
    \ always have the keyboard in front of them and testing what I am explaining.\n\
    \nHowever, this book is not for everyone, and it is important that the reader\
    \ has the right expectations; In this book you will not find explanations about\
    \ the fundamental theory of artificial neural networks, nor details of how the\
    \ algorithms related to the subject work internally. Therefore, it is not recommended\
    \ for those who are already programming neural networks in some other environment\
    \ that is not Keras. Also, if this library is their field of interest, perhaps\
    \ this book is way too long to start with the Keras library.\n\n.\n\n### How this\
    \ book is organized\n\nThe book is organized into chapters that must be read in\
    \ order, as they guide the reader and gradually introduce them to the essential\
    \ knowledge to follow the practical examples, whilst trying to be as concise as\
    \ possible. Being an introductory book, I consider that this approach is much\
    \ more useful than a more formal one. In spite of everything, I have tried to\
    \ make sure that the index of the book expresses a reasonably ordered map of the\
    \ main concepts of the area.\n\nThe book follows the same  formula as the book\
    \ I wrote about TensorFlow, Hello World en TensorFlow, in January 2016 which was\
    \ well received. Therefore, I have decided to partially follow its approach. But\
    \ before starting with the first chapter I have allowed myself to introduce how\
    \ I started to investigate this topic and why I consider that the main trigger\
    \ of this resurrection of Artificial Intelligence is due to Supercomputing.\n\n\
    The first chapter contains a motivation for the topic in order to contextualize\
    \ the reader as to where we are currently in this field.\n\nIn chapter two, using\
    \ a case study, the basic concepts of a neural network are explained and densely\
    \ connected neural networks are introduced.\n\nNext, in chapter three, we move\
    \ on to a more practical level with the well known MNIST digit recognition example,\
    \ showing its implementation with Keras.\n\nIn chapter four, we present how the\
    \ learning process of a neural network is carried out, going into some of its\
    \ most important components.\n\nIn chapter five the reader is invited to practice\
    \ some of the knowledge previously acquired with TensorFlow playground, a tool\
    \ offered by Google.\n\nIn chapter six, with the reader already prepared with\
    \ an important basis of how neural networks work, we present and implement Convolutional\
    \ Neural Networks, one of the most popular families of neural networks at this\
    \ time. \n\nThis book is accompanied by a repository code on the GitHub where\
    \ the reader can find the examples presented.\n\n### Assumptions of this book\n\
    \nAs mentioned earlier, this work is intended as an introduction; it is not necessary\
    \ for the reader to be an expert in Python. Obviously, it is necessary to have\
    \ programming knowledge and an interest in  learning autonomously the Python details\
    \ when the code shown in the examples is not understood. \n\nNor is it necessary\
    \ to be an expert in Machine Learning, but it is clear that it can be very useful\
    \ to know basic concepts in the field. Only the basic knowledge of mathematics\
    \ is assumed ( any student of any of the baccalaureate of the scientific-technical\
    \ branch). Throughout the chapters, the most important concepts of Machine Learning\
    \ that may be required will be presented very briefly.\n\n### Why Keras?\n\nKeras[\\\
    [2\\]](#part0000_split_065.html#_ftn2) is the recommended library for beginners,\
    \ since its learning curve is very smooth compared to others, and at the moment\
    \ it is one of the popular middleware to implement neural networks.\n\nKeras is\
    \ a Python library that provides, in a simple way, the creation of a wide range\
    \ of Deep Learning models using as backend other libraries such as TensorFlow,\
    \ Theano or CNTK. It was developed and maintained by François Chollet[\\[3\\]](#part0000_split_065.html#_ftn3),\
    \ an engineer from Google, and his code has been released under the permissive\
    \ license of MIT.\n\nPersonally, I value the austerity and simplicity that this\
    \ programming model presents, without adornments and maximizing readability; it\
    \ allows us to express neural networks in a very modular way, considering a model\
    \ as a sequence (or a graph if it is more advanced models that we will not deal\
    \ with in this book). Last but not least, I think it's a great success to have\
    \ opted to use the Python programming language. For all these reasons, I have\
    \ decided to use Keras in this book.\n\n### Jupyter notebook\n\nKeras is currently\
    \ included in Tensorflow package, but can also be used as a Python library. To\
    \ start in the subject I consider that this second option is the most appropriate\
    \ and for this reason my proposal will be to use Jupyter[\\[4\\]](#part0000_split_065.html#_ftn4)\
    \ since it is a very widespread and very easy to use development environment.\
    \ At the end of this chapter, we will present how to access and fine-tune our\
    \ work environment to execute the examples of code presented in the book.\n\n\
    Jupyter provides great versatility to share parts of codes with annotations through\
    \ the comfort and platform independence offered by a web browser. For this reason,\
    \ notebooks are often used to develop neural networks in the community of scientists\
    \ and data engineers. A notebook is a file generated by Jupyter Notebook or Jupyter\
    \ Lab that can be edited from a web browser, allowing you to mix Python code execution\
    \ with annotations."
