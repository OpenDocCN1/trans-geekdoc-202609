    It is interesting to note that with the transformation of pooling we maintain
    the spatial relationship. To see it visually, take the following example of a
    12×12 matrix where we have represented a "7" (Let''s imagine that the pixels where
    we pass over contain 1 and the rest 0; we have not added it to the drawing to
    simplify it). If we apply a max-pooling operation with a 2×2 window (we represent
    it in the central matrix that divides the space in a mosaic with regions of the
    size of the window), we obtain a 6×6 matrix where an equivalent representation
    of 7 is maintained (in the figure on the right where the zeros are marked in white
    and the points with value 1 in black):


    ![](images/00070.jpeg)


    As mentioned above, the convolutional layer hosts more than one filter and, therefore,
    as we apply the max-pooling to each of them separately, the pooling layer will
    contain as many pooling filters as there are convolutional filters:


    ![](images/00071.jpeg)


    The result is, since we had a space of 24×24 neurons in each convolutional filter,
    after doing the pooling we have 12×12 neurons which corresponds to the 12×12 regions
    (of size 2×2 each region) that appear when dividing the filter space.


    ## 6.3 Implementation of a basic model in Keras


    Let''s see how this example of convolutional neuronal network can be programmed
    using Keras. As we have said, there are several values to be specified in order
    to parameterize the convolution and pooling stages. In our case, we will use a
    simplified model with a stride of 1 in each dimension (size of the step with which
    the window slides) and a padding of 0 (filling with zeros around the image). Both
    hyperparameters will be presented below. The pooling will be a max-pooling as
    described above with a 2×2 window.


    ### Basic architecture of a convolutional network


    Let''s move on to implement our first convolutional network, which will consist
    of convolution followed by max-pooling. In our case, we will have 32 filters using
    a 5×5 window for the convolutional layer and 2×2 window for the pooling layer.
    We will use the `ReLU` activation function. In this case, we are configuring a
    convolutional network to process an input tensor of size `(28, 28, 1)`, which
    is the size of MNIST images (the third parameter is color channel which in our
    case is 1), and we specify it by means of value `input_shape = (28, 28, 1)` in
    our first layer:


    ```python

    from keras import layers

    from keras import models

    model = models.Sequential()

    model.add(layers.Conv2D(32,(5,5),activation=''relu'',input_shape=(28,28,1)))

    model.add(layers.MaxPooling2D((2, 2)))

    model.summary()

    ```


    ```

    Layer (type)             Output Shape  Param #

    ================================================

    conv2d_1 (Conv2D)       (None, 24, 24, 32)    832

    max_pooling2d_1 (MaxPooling2) (None, 12, 12, 32)    0

    ================================================

    Total params: 832

    Trainable params: 832

    Non-trainable params: 0

    ```


    The number of parameters of the `Conv2D` layer corresponds to weight matrix `W`
    of 5×5 and `b` bias for each of filters is 832 (32 × (25 + 1)). Max-pooling does
    not require parameters since it is a mathematical operation to find the maximum.


    ### A simple model


    In order to build a "deep" neural network, we can stack several layers like the
    one built in the previous section. To show the reader how to do it in our example,
    we will create a second group of layers that will have 64 filters with a 5×5 window
    in the convolutional layer and a 2×2 window in the pooling layer. In this case,
    the number of input channels will take the value of the 32 features that we have
    obtained from the previous layer, although, as we have seen previously, it is
    not necessary to specify it because Keras deduces it:


    ```python

    model = models.Sequential()

    model.add(layers.Conv2D(32,(5,5),activation=''relu'',input_shape=(28,28,1)))

    model.add(layers.MaxPooling2D((2, 2)))

    model.add(layers.Conv2D(64, (5, 5), activation=''relu''))

    model.add(layers.MaxPooling2D((2, 2)))

    ```


    If the architecture of the model is shown with the `summary()` method, we can
    see:


    ```

    Layer (type)             Output Shape  Param #

    ================================================

    conv2d_1 (Conv2D)       (None, 24, 24, 32)    832

    max_pooling2d_1 (MaxPooling2) (None, 12, 12, 32)    0

    conv2d_2 (Conv2D)       (None, 8, 8, 64)      8160

    max_pooling2d_2 (MaxPooling2) (None, 4, 4, 64)    0

    ================================================

    ```


    The number of parameters of the `Conv2D` layer corresponds to weight matrix `W`
    of 5×5 and `b` bias for each of filters is 832 (32 × (25 + 1)). Max-pooling does
    not require parameters since it is a mathematical operation to find the maximum.
    The output of `Conv2D` and `MaxPooling2D` layers is 3D form `(height, width, channels)`.
    The width and height dimensions tend to be reduced as we enter hidden layers.
    The number of kernels is controlled through the first argument passed to `Conv2D`
    (usually 32 or 64).


    The next step, now that we have 64 4x4 filters, is to add a densely connected
    layer, which will serve to feed a final layer of softmax. In this example, we
    have to adjust the tensors to the input of the dense layer, which is a 1D tensor,
    while the output of the previous one is a 3D tensor. That''s why we have to first
    flatten the 3D tensor to one of 1D. Our output `(4,4,64)` must be flattened to
    a vector of `(1024)` before applying the Softmax.


    ```python

    model = models.Sequential()

    model.add(layers.Conv2D(32,(5,5),activation=''relu'',input_shape=(28,28,1)))

    model.add(layers.MaxPooling2D((2, 2)))

    model.add(layers.Conv2D(64, (5, 5), activation=''relu''))

    model.add(layers.MaxPooling2D((2, 2)))

    model.add(layers.Flatten())

    model.add(layers.Dense(10, activation=''softmax''))

    ```


    In this case, the number of parameters of the softmax layer is `10 × 1024 + 10`,
    with an output of a vector of 10 as in the example in chapter 2. With the `summary()`
    method, we can see this information about the parameters of each layer and shape
    of the output tensors of each layer:

    '
