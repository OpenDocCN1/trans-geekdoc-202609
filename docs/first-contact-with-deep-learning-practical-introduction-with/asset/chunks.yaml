    \ that gives computers the ability to learn without being explicitly programmed,\
    \ that is, without requiring the programmer to indicate the rules that must be\
    \ followed to achieve their task; the computers do them automatically.\n\nGeneralizing,\
    \ we can say that Machine Learning consists in developing for each problem a prediction\
    \ “algorithm\" for a particular use case. These algorithms learn from the data\
    \ in order to find patterns or trends to understand what the data tell us and\
    \ in this way build a model to predict and classify the elements.\n\nGiven the\
