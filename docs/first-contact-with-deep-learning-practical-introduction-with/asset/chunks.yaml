    # 1       A new technology is coming

    Artificial intelligence is being considered as the new industrial revolution,
    heart of what some call industry 4.0. Deep Deep Learning is the engine of this
    process and in the following chapters we will present it.


    # 1.1       Artificial Intelligence is changing our life

    We are facing dizzying advances in the quality and device of of everyday technologies:
    in the case of speech recognition, voice-to-text transcription has experienced
    incredible and is now available in available devices. We are are interacting more
