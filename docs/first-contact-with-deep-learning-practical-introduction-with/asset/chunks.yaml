    损失函数是训练过程中用于量化特定神经网络与理想权重之间接近程度的所必含的参数之一。


    在 Keras 手册页[\[128\]](#part0000_split_065.html#_ftn128) 中，我们可以找到所有可用的损失函数。某些函数具有必须指明的具体超参数；在上章的示例中，当我们使用
    `categorical_crossentropy` 作为损失函数时，我们的输出必须是分类格式。选择最佳损失函数取决于理解对于特定问题哪种类型的错误是可以接受或不可接受的。


    ### 优化器 (Optimizers)


    优化器是 `compile()` 方法所需的另一个参数。Keras 目前有不同的优化器可以使用：`SGD`、`RMSprop`、`Adagrad`、`Adadelta`、`Adam`、`Adamax``Nadam`。你可以在
    Keras 文档[\[129\]](#part0000_split_065.html#_ftn129) 中找到关于每个优化器的更多信息。


    通常，我们可以将学习过程视为一个全局优化问题，其中参数（权重和偏置）必须经过调整，使得上述损失函数最小化。在大多数情况下，这些参数无法通过解析法求解，但通常可以通过迭代或优化算法（如上述算法）很好地逼近它们。


    ### 梯度下降 (Gradient descent)


    我们将解释其中一种具体的优化器，以便你理解优化器的整体运行机制。具体来说，梯度下降是许多优化器的基础，也是机器学习和深度学习中最常见的优化算法之一。


    梯度下降在更新参数时使用损失函数的一阶导数（梯度）。记住，梯度告诉我们函数在该一点的斜率。在不进行详细阐述的情况下，该过程包括将每个隐藏层损失的导数通过其上层损失的导数进行链式组合（chaining），并在计算中结合其激活函数（这就是为什么激活函数必须是可求的）。在每次迭代中，一旦所有神经元都获得了与其相对应的损失函数梯度值，参数的值就会在梯度所指方向的相反方向进行更新。事实上，梯度始终指向损失函数值增加的方向。因此，如果使用梯度的负值，我们就可以得到倾向于减少损失函数的方向。


    让我们在假设只有一个维度的情况下以视觉化的方式来看这个过程：假设这条线代表损失函数对于每个可能的参数值产生的值，而梯度的负值由初始点的箭头表示：


    ![](img/00045.jpeg)


    为了确定参数的下一个值，梯度下降算法会修改初始权重的值，向梯度相反的方向移动（因为梯度指向损失增长的方向，而我们想要减少它），并在此基础上增加一个比例量。这种变化的大小由梯度值以及一个我们可以指定的学习率超参数（我们稍后会介绍）决定。因此，从概念上说，这就像是我们顺着斜坡向下走，直到达到局部最小值：


    ![](img/00046.jpeg)


    梯度下降算法重复这一过程，越来越接近最小值，直到参数值达到一个点，超过该点后损失函数就无法下降：


    ![](img/00047.jpeg)


    ### 随机梯度下降 (SGD)


    在之前的节中，我们已经了参数值是如何调整的，但不知道频率是多少：


    *   在每个输入示例之后？

    *   在整个训练示例集的每一轮（epoch）之后？

    *   在训练集的一个样本示例之后？


    在第一种情况下，我们称为在线学习（online learning），即从训练中每个示例的观测损失来估计梯度；这也是我们所说的随机梯度下降（`SGD`）的情况。第二种被称为批量学习（batch
    learning），称为批量梯度下降。文献指出，通常情况下在线学习可以获得更好的结果，但也有理由证明使用批量学习，因为许多优化技术只对它有效。


    但如果数据分布良好，其一小部分数据就应该为我们提供相当好的梯度近似。我们可能无法获得最佳估计，但速度更快，而且考虑到我们正在进行迭代，这种方法非常有用。出于这个原因，通常使用上述名为“小批量”（mini-batch）的第三选项。该选项通常与在线学习一样好，但更新神经网络参数所需的计算量更少。此外，对许多输入示例同时计算梯度可以使用在
    GPU 上非常高效实现的矩阵操作来完成，正如我们在第一章中看到的那样。


    这就是为什么在现实中，许多应用使用带有若干个示例的小批量的随机梯度下降（`SGD`）。为了使用所有数据，做法是将数据划分为若干批。然后我们取第一批，通过网络，计算其损失的梯度并更新神经网络的参数；此后一直持续直到最后一批。现在，在一次次通过所有输入数据中，仅进行了步数等于批次的数。


    `SGD` 在 Keras 中非常容易实现。在 `compile()` 方法中，指定优化器为 `SGD`（参数值为 `sgd`），然后所要做的就是在训练过程中通过
    `fit()` 方法指定批次大小（batch size），如下所示：


    ```

    model.fit(X_train, y_train, epochs=5, batch_size=100)

    ```


    在这个使用 `fit()` 方法的代码示例中，我们通过 `batch_size` 参数将数据分为 100 个一组的批次。通过 `epochs` 的数量，我们指示了对所有数据执行此过程的次数。在本章的稍后部分，当我们已经介绍了常用的优化器参数后，我们将回到这两个参数。


    ## 4.4 模型参数化 (Model parameterization)


    如果读者在上一章末尾使用我们那里使用的超参数执行了模型，我假设模型的准确率将超过 90%。这些结果好吗？我认为它们是极好的，因为这意味着读者已经使用 Keras
    编写并执行了他的第一个神经网络。恭喜！


    另一件事是还有其他模型可以提高准确率。这取决于是否有大量的知识和实践，以便良好地处理我们可以更改的许多超参数。例如，只需简单更改第一层的激活函数，从 `sigmoid`
    切换到如下所示的 `relu`：


    ```

    model.add(Dense(10, activation=''relu'', input_shape=(784)))

    ```


    我们可以用几乎完全相同的计算时间获得额外 2% 的准确率。


    增加 `epochs` 的数量、在层中添加更多神经元或添加更多层也是可能的。然而，在这些情况下，准确率的提升具有增加学习过程执行时间的副作用。例如，如果我们向中间层添加
    512 个节点而不是 10 个节点：


    ```

    model.add(Dense(512, activation=''relu'', input_shape=(784)))

    ```


    我们可以通过 `summary()` 方法检查发现参数数量增加了（它是全连接的），并且执行时间显著增加，即使减少了 epoch 的数量也是如此。使用这个模型，准确率达到了
    94%。如果我们增加到 20 个 `epochs`，就能实现 96% 的准确率。


    '
