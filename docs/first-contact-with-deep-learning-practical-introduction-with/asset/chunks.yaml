  fmt: "\nBut sometimes we want to obtain an output image of the same dimensions as\
    \ the input and we can use the hyperparameter `padding` in the convolutional layers\
    \ for this. With `padding` we can add zeros around the input images before sliding\
    \ the window through it. In our case in the previous figure, for the output filter\
    \ to have the same size as the input image, we can add a column to the right,\
    \ a column to the left, a row above and a row below to the input image of zeros.\
    \ Visually it can be seen in the following figure:\n\n![](images/00074.jpeg)\n\
    \nIf we now slide the 3×3 window, we see that it can move 4 positions to the right\
    \ and 4 positions down, generating the 25 windows that generate the filter size\
    \ 5×5.\n\n![](images/00075.jpeg)\n\nIn Keras, the `padding` in the `Conv2D` layer\
    \ is configured with the `padding` argument, which can have two values: `\"same\"\
    `, which indicates that as many rows and columns of zeros are added as necessary\
    \ so that the output has the same dimension as the entry; and `\"valid\"`, which\
    \ indicates no padding (which is the default value of this argument in Keras).\n\
    \n### Stride\n\nAnother hyperparameter that we can specify in a convolutional\
    \ layer is the `stride`, which indicates the number of steps in which the filter\
    \ window moves (in the previous example, the `stride` was one).\n\nLarge `stride`\
    \ values decrease the size of the information that will be passed to the next\
    \ layer. In the following figure we can see the same previous example but now\
    \ with a `stride` value of 2:\n\n![](images/00076.jpeg)\n\nAs we can see, the\
    \ 5×5 image has become a smaller 2×2 filter. But in reality convolutional strides\
    \ to reduce sizes are rarely used in practice; for this, the pooling operations\
    \ that we have presented before are used. In Keras, the `stride` in the `Conv2D`\
    \ layer is configured with the `stride` argument, which defaults to the `strides=(1,1)`\
    \ value, which separately indicates the progress in the two dimensions.\n\n##\
