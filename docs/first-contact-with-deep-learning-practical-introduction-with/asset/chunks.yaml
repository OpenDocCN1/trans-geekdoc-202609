- raw: "Special thanks to a colleague of the UPC and a great friend, Xavier Giró-i-Nieto.\
    \ Xavier is an inexhaustible source of inspiration and knowledge, with whom I\
    \ am co-directing the doctoral theses of Míriam Bellver and Victor Campos, to\
    \ whom I also owe a great deal of thanks to for the knowledge that I have obtained\
    \ on these topics and contents of this book. And I do not want to forget about\
    \ other students like Xisco Sastre, whose final master's work also dealt with\
    \ these concepts, being a great stimulus for my learning. A couple of research\
    \ articles came from his results, of which I have used some graphs in this book.\n\
    \nThere have been many experts on this subject that I do not personally know who\
    \ have also helped me at the time of writing, allowing me to share their ideas;\
    \ therefore, I mention in detail the sources in the corresponding sections, more\
    \ as a token of gratitude than for the reader having to consult this. \n\nAmong\
    \ all the experts that inspired me, I must make special mention of François Chollet,\
    \ Google researcher and creator of Keras, whom I have the good fortune to meet\
    \ personally. This book is written after François published his book Deep Learning\
    \ with Python, which has been of great help and inspiration.\n\nMy most sincere\
    \ gratitude to all those who have read partially or totally the different drafts\
    \ of this book: Bernat Torres (SOMmobilitat), Fernando García Sedano (Grupsa),\
    \ Jordi Morera (UPCnet), Guifré Ballester (UPCnet), Sergi Sales (UPCnet) who have\
    \ reported interesting comments to me to include in the version you have in your\
    \ hands.\n\nMy greatest thanks to my university, the Universitat Politècnica de\
    \ Catalunya - UPC Barcelona Tech and, especially, to Agustín Fernández Jiménez,\
    \ vice-rector of Digital Transformation of the UPC for having written the foreword\
    \ of this work and having made a detailed reading of the final draft. The UPC\
    \ has been the working environment that has allowed me to carry out my research\
    \ on these topics and accumulate the knowledge that I want to share here. A university\
    \ that also offers me to give classes in the Facultat d'Informàtica de Barcelona\
    \ (FIB) to some brilliant students, who encourage me to write books like this\
    \ one.\n\nAs I mentioned at the beginning of the book, to researchers like Ricard\
    \ Gavaldà or Jordi Nin, I owe it to them for awakening in me the interest in these\
