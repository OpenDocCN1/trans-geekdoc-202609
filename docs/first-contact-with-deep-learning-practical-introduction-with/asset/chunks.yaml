    In this context, for now we can consider that the training phase of a model consists
    basically in adjusting the parameters (the weights `wi` and the `b` bias) in such
    a way that the result of the loss function returns the minimum possible value.


    Finally, we need to address the concept of overfitting in a model, which occurs
    when the model obtained is adjusted so much to the labeled examples of input that,
    later, the resulting model cannot make the correct predictions with new data examples
    that have never been seen before. Given the introductory nature of this book we
    will not go into this topic, but it is a central theme in Deep Learning.


    ### Artificial neural networks and Deep Learning


    A special case of Machine Learning algorithms are artificial neural networks,
    whose algorithmic structures allow models that are composed of multiple layers
    of processing to learn data representations with multiple levels of abstraction.
    This set of layers composed of "neurons" performs a series of linear and non-linear
    transformations to the input data to generate an output close to the expected
    (label). Supervised learning, in this case, consists in obtaining the parameters
    of these transformations (the `wi` weights and the `b` bias) and attempting that
    these transformations produce an output that differ as little as possible to the
    expected output.


    A simple graphical approach to a Deep Learning neural network can be


    ![](images/00018.jpeg)


    Specifically, in this image we represent an artificial neural network with 3 layers:
    an input layer that receives the input data and an output layer that returns the
    prediction made. The layers that we have in the middle are called hidden layers
    and we can have many, each one with a different number of neurons. We will see
    later that neurons, represented by the circles, will be interconnected with each
    other in different ways between the neurons of the different layers.


    In general, today we are handling artificial neural networks with many layers,
    which are literally stacked one on top of the other; hence the concept of deep
    (depth of the network). Each of them is composed of many neurons, each with its
    parameters (the weights `wi` and the bias `b`) which perform a simple transformation
    of the data that they receive from neurons of the previous layer to pass them
    to those of the posterior layer. The union of all these transformations carried
    out by the neurons of the network is what allows discovering complex patterns
    in the data.


    Before finishing this section, I would like to give the reader a magnitude of
    the problem that involves programming the Deep Learning algorithms these days:
    different layers serve different purposes, and each parameter and hyperparameter
    matter a lot in the final result; this makes it extremely complicated when trying
    to refine the programming of a neural network model, looking more like an art
    than a science for those who enter the area for the first time. But this does
    not imply that it is something mysterious, although it is true that much remains
    to be investigated, but it simply takes many hours of learning and practice.


    The next figure visually summarizes the intuitive idea that Deep Learning is just
    a part of Artificial Intelligence, although nowadays it is probably the most dynamic
    one and the one that is captivating the scientific community. And the same way
    I previously mentioned the work of Stuart Rusell and Peter Novig as the main book
    on Artificial Intelligence, when it comes to Deep Learning we can read an excellent
    book titled Deep Learning[[42]](#part0000_split_065.html#_ftn42), by Ian Goodfellow,
    Yoshua Bengio and Aaron Corville, wchich constitutes the grounds for learning
    about this topic more deeply.


    ![](images/00019.jpeg)


    ## 1.3 Why now?


    In just ten years[[43](#part0000_split_065.html#_ftn43), four of the five largest
    companies in the world by market capitalization have changed: Exxon Mobil, General
    Electric, Citigroup and Shell Oil are out and Apple, Alphabet (the parent company
    of Google), Amazon and Facebook have taken their place. Only Microsoft maintains
    its position. You have already realized that all of them dominate the new digital
    era in which we find ourselves immersed. We are talking about companies that base
    their power on Artificial Intelligence in general and Deep Learning in particular.


    John McCarthy coined the term Artificial Intelligence in the 1950s, being one
    of the founding fathers of Artificial Intelligence along with Marvin Minsky. Also
    in 1958 Frank Rosenblatt built a prototype neuronal network, which he called the
    `Perceptron`. In addition, the key ideas of the Deep Learning neural networks
    for computer vision were already known in 1989; also the fundamental algorithms
    of Deep Learning for time series such as `LSTM` were already developed in 1997,
    to give some examples. So, why now this Artificial Intelligence boom?


    Undoubtedly, the available computing has been the main trigger, as we have already
    presented previously. However, other factors have contributed to unleash the potential
    of Artificial Intelligence and related technologies. Next we are going to talk
    about the most important factors that have influenced it.


    ### The data, the fuel for Artificial Intelligence


    Artificial Intelligence requires large datasets for the training of its models
    but, fortunately, the creation and availability of data has grown exponentially
    thanks to the enormous decrease in cost and increased reliability of data generation:
    digital photos, cheaper and precise sensors, etc. Furthermore, the improvements
    in storage hardware of recent years, associated with the spectacular advances
    in technology for its management with `NoSQL`[[44](#part0000_split_065.html#_ftn44)
    databases, have allowed having enormous datasets to train Artificial Intelligence
    models.


    Beyond the increases in the availability of data that the advent of the Internet
    has led to recently, specialized data resources have catalyzed the progress of
    the area. Many open databases have supported the rapid development of Artificial
    Intelligence algorithms. An example is the `ImageNet`[[45](#part0000_split_065.html#_ftn45)
    database, of which we have already spoken, freely available with more than 10
    million images tagged by hand. But what makes ImageNet special is not precisely
    its size, but the competition that was carried out annually with it, being an
    excellent way to motivate researchers and engineers.


    While in the early years the proposals were based on traditional computer vision
    algorithms, in 2012 Alex Krizhevsky used a Deep Learning neural network, now known
    as `AlexNet`, which reduced the error rate to less than half of what the winner
    of the previous edition of the competition got. Already in 2015, the winning algorithm
    rivaled human capabilities, and today Deep Learning algorithms far exceed the
    error rates in this competition of those who have humans.

