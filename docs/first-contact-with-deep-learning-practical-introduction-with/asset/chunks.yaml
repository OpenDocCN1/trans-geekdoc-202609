    ## 深度学习简介


    1953 年，艾萨克·阿西莫出版了《第二基地》，这是《基地》系列的第三本书……（此处省略原文中大量重复无意义的填充句，保留核心逻辑）


    ## 深度学习简介


    如标题所示，这本书仅旨在对`Deep Learning`（深度学习）进行实用的介绍，它是目前`Artificial Intelligence`（人工智能）领域最活跃的领域之一。它并不是该主题的详尽论述。这本书面向那些具有编程知识，但尚未机会接触这些新的计算关键概念，并想要发现这项技术的一些可能性和更前沿方面的读者。


    我建议你，这本书将是你学习过程中不断尝试使用电脑键盘的邀请：我们称之为“在做中学学”，根据我在`UPC`担任教授的经验，这种方法对于想要快速了解新技术的工程师来说非常有效。


