    Afterwards, ensure that you are connected to the runtime (there is a green check\
    \ next to \"connected\" in the menu ribbon):\n\n![](images/00009.jpeg)\n\nNow\
    \ you are able to run GitHub repo in Google Colab. Enjoy!\n\nSupercomputing, the\
    \ heart of Deep Learning\n\nSurely, at this point, some readers have already posed\
    \ the question: why has a researcher in supercomputing such as me, started to\
    \ investigate Deep Learning?\n\nIn fact, many years ago I started to be interested\
    \ in how supercomputing could contribute to improving Machine Learning methods;\
    \ Then, in 2006, I started co-directing PhD theses with a great friend, and professor\
    \ at the Computer Science department of the UPC, Ricard Gavaldà[\\[8\\]](#part0000_split_065.html#_ftn8)\
    \ , an expert in Machine Learning and Data Mining.\n\nBut it was not until September\
    \ 2013, when I already had a relatively solid base of knowledge about Machine\
    \ Learning, that I started to focus my interest on Deep Learning. Thanks to the\
    \ researcher from our Computer Architecture Department at UPC Jordi Nin, I discovered\
