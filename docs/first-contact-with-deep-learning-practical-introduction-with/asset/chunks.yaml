- raw: "In an intuitive way, we could say that the main purpose of a convolutional\
    \ layer is to detect features or visual features in images such as edges, lines,\
    \ color drops, etc. This is a very interesting property because, once it has learned\
    \ a characteristic at a specific point in the image, it can recognize it later\
    \ in any part of it. Instead, in a densely connected neural network it has to\
    \ learn the pattern again if it appears in a new location of the image. \n\nAnother\
    \ important feature is that convolutional layers can learn spatial hierarchies\
    \ of patterns by preserving spatial relationships. For example, a first convolutional\
    \ layer can learn basic elements such as edges, and a second convolutional layer\
    \ can learn patterns composed of basic elements learned in the previous layer.\
    \ And so on until it learns very complex patterns. This allows convolutional neural\
    \ networks to efficiently learn increasingly complex and abstract visual concepts.\n\
    \nIn general, the convolutions layers operate on 3D tensors, called feature maps,\
    \ with two spatial axes of height and width, as well as a channel axis also called\
    \ depth. For an RGB color image, the dimension of the depth axis is 3, because\
    \ the image has three channels: red, green and blue. For a black and white image,\
    \ such as the MNIST digits, the depth axis dimension is 1 (gray level).\n\nIn\
    \ the case of MNIST, as input to our neural network we can think of a space of\
    \ two-dimensional neurons 28×28 (height = 28, width = 28, depth = 1). A first\
    \ layer of hidden neurons connected to the neurons of the input layer that we\
    \ have discussed will perform the convolutional operations that we have just described.\
    \ But as we have explained, not all input neurons are connected with all the neurons\
    \ of this first level of hidden neurons, as in the case of densely connected neural\
    \ networks; it is only done by small localized areas of the space of input neurons\
    \ that store the pixels of the image. \n\nThe explained, visually, could be represented\
    \ as: \n\n![](images/00066.jpeg)\n\nIn the case of our previous example, each\
    \ neuron of our hidden layer will be connected to a small region of 5×5 neurons\
    \ (i.e. 25 neurons) of the input layer (28×28). Intuitively, we can think of a\
    \ 5×5 size window that slides along the entire 28×28 neuron layer of input that\
    \ contains the image. For each position of the window there is a neuron in the\
    \ hidden layer that processes this information. \n\nVisually, we start with the\
    \ window in the top left corner of the image, and this gives the necessary information\
    \ to the first neuron of the hidden layer. Then, we slide the window one position\
    \ to the right to \"connect\" the 5×5 neurons of the input layer included in this\
    \ window with the second neuron of the hidden layer. And so, successively, we\
    \ go through the entire space of the input layer, from left to right and top to\
    \ bottom.\n\nAnalyzing a little bit the concrete case we have proposed, we note\
    \ that, if we have an input of 28×28 pixels and a window of 5×5, this defines\
    \ a space of 24×24 neurons in the first hidden layer because we can only move\
    \ the window 23 neurons to the right and 23 neurons to the bottom before hitting\
    \ the right (or bottom) border of the input image.\n\n![](images/00067.jpeg)\n\
    \nWe would like to point out to the reader that the assumption we have made is\
    \ that the window moves forward 1 pixel away, both horizontally and vertically\
    \ when a new row starts. Therefore, in each step, the new window overlaps the\
    \ previous one except in this line of pixels that we have advanced. But, as we\
    \ will see in the next section, in convolutional neural networks, different lengths\
    \ of advance steps can be used (the parameter called stride). In convolutional\
    \ neural networks you can also apply a technique of filling zeros around the margin\
    \ of the image to improve the sweep that is done with the sliding window. The\
    \ parameter to define this technique is called \"padding\", which we will also\
    \ present in more detail in the next section, with which you can specify the size\
    \ of this padding.\n\nIn our case of study, and following the formalism previously\
    \ presented, to \"connect\" each neuron of the hidden layer with the 25 corresponding\
    \ neurons of the input layer we will use a bias value b and a W\\-weights matrix\
    \ of size 5×5 that we will call filter (or kernel). The value of each point of\
    \ the hidden layer corresponds to the scalar product between the filter and the\
    \ handful of 25 neurons (5×5) of the input layer.\n\nHowever, the particular and\
    \ very important thing about convolutional networks is that we use the same filter\
    \ (the same W matrix of weights and the same b bias) for all the neurons in the\
    \ hidden layer: in our case for the 24×24 neurons (576 neurons in total) of the\
    \ first layer. The reader can see in this particular case that this sharing drastically\
    \ reduces the number of parameters that a neural network would have if we did\
    \ not do it: it goes from 14,400 parameters that would have to be adjusted (5×5\
    \ × 24×24) to 25 (5×5) parameters plus biases b.\n\nThis shared W matrix together\
    \ with the b bias, which we have already said we call a filter in this context\
    \ of convolutional networks, is similar to the filters we use to retouch images,\
    \ which in our case are used to look for local characteristics in small groups\
    \ of entries. I recommend looking at the examples found in the GIMP image editor\
    \ manual[\\[134\\]](#part0000_split_065.html#_ftn134) to get a visual and very\
    \ intuitive idea of how a convolution process works.\n\nBut a filter defined by\
    \ a matrix W and a bias b only allows detecting a specific characteristic in an\
    \ image; therefore, in order to perform image recognition, it is proposed to use\
    \ several filters at the same time, one for each characteristic that we want to\
    \ detect. That is why a complete convolutional layer in a convolutional neuronal\
    \ network includes several filters.\n\nA usual way to visually represent this\
    \ convolutional layer is shown in the following figure, where the level of hidden\
    \ layers is composed of several filters. In our example we propose 32 filters,\
    \ where each filter is defined with a W matrix of 5×5 and a bias b.\n\n![](images/00068.jpeg)\n\
    \nIn this example, the first convolutional layer receives a size input tensor\
    \ (28, 28, 1) and generates a size output (24, 24, 32), a 3D tensor containing\
    \ the 32 outputs of 24×24 pixel result of computing the 32 filters on the input.\n\
    \n### The pooling operation\n\nIn addition to the convolutional layers that we\
    \ have just described, convolutional neural networks accompany the convolution\
    \ layer with pooling layers, which are usually applied immediately after the convolutional\
    \ layers. A first approach to understand what these layers are for is to see that\
    \ the pooling layers simplify the information collected by the convolutional layer\
    \ and create a condensed version of the information contained in them.\n\nIn our\
    \ MNIST example, we are going to choose a 2×2 window of the convolutional layer\
    \ and we are going to synthesize the information in a point in the pooling layer.\
    \ Visually, it can be expressed as follows:\n\n![](images/00069.jpeg)\n\nThere\
    \ are several ways to condense the information, but a usual one, which we will\
    \ use in our example, is known as max-pooling, which as a value keeps the maximum\
    \ value of those that were in the 2×2 input window in our case. In this case we\
    \ divide by 4 the size of the output of the pooling layer, leaving an image of\
    \ 12×12.\n\nAverage-pooling can also be used instead of max-pooling, where each\
    \ group of entry points is transformed into the average value of the group of\
    \ points instead of its maximum value. But in general, max-pooling tends to work\
    \ better than alternative solutions. "
  fmt: '

    In an intuitive way, we could say that the main purpose of a convolutional layer
    is to detect features or visual features in images such as edges, lines, color
    drops, etc. This is a very interesting property because, once it has learned a
    characteristic at a specific point in the image, it can recognize it later in
    any part of it. Instead, in a densely connected neural network it has to learn
    the pattern again if it appears in a new location of the image.


    Another important feature is that convolutional layers can learn spatial hierarchies
    of patterns by preserving spatial relationships. For example, a first convolutional
    layer can learn basic elements such as edges, and a second convolutional layer
    can learn patterns composed of basic elements learned in the previous layer. And
    so on until it learns very complex patterns. This allows convolutional neural
    networks to efficiently learn increasingly complex and abstract visual concepts.


    In general, the convolutions layers operate on 3D tensors, called feature maps,
    with two spatial axes of height and width, as well as a channel axis also called
    depth. For an RGB color image, the dimension of the depth axis is 3, because the
    image has three channels: red, green and blue. For a black and white image, such
    as the MNIST digits, the depth axis dimension is 1 (gray level).


    In the case of MNIST, as input to our neural network we can think of a space of
    two-dimensional neurons `28×28` (height = 28, width = 28, depth = 1). A first
    layer of hidden neurons connected to the neurons of the input layer that we have
    discussed will perform the convolutional operations that we have just described.
    But as we have explained, not all input neurons are connected with all the neurons
    of this first level of hidden neurons, as in the case of densely connected neural
    networks; it is only done by small localized areas of the space of input neurons
    that store the pixels of the image.


    The explained, visually, could be represented as:


    ![](images/00066.jpeg)


    In the case of our previous example, each neuron of our hidden layer will be connected
    to a small region of `5×5` neurons (i.e. 25 neurons) of the input layer (`28×28`).
    Intuitively, we can think of a `5×5` size window that slides along the entire
    `28×28` neuron layer of input that contains the image. For each position of the
    window there is a neuron in the hidden layer that processes this information.


    Visually, we start with the window in the top left corner of the image, and this
    gives the necessary information to the first neuron of the hidden layer. Then,
    we slide the window one position to the right to "connect" the `5×5` neurons of
    the input layer included in this window with the second neuron of the hidden layer.
    And so, successively, we go through the entire space of the input layer, from
    left to right and top to bottom.


    Analyzing a little bit the concrete case we have proposed, we note that, if we
    have an input of `28×28` pixels and a window of `5×5`, this defines a space of
    `24×24` neurons in the first hidden layer because we can only move the window
    `23` neurons to the right and `23` neurons to the bottom before hitting the right
    (or bottom) border of the input image.


    ![](images/00067.jpeg)


    We would like to point out to the reader that the assumption we have made is that
    the window moves forward 1 pixel away, both horizontally and vertically when a
    new row starts. Therefore, in each step, the new window overlaps the previous
    one except in this line of pixels that we have advanced. But, as we will see in
    the next section, in convolutional neural networks, different lengths of advance
    steps can be used (the parameter called `stride`). In convolutional neural networks
    you can also apply a technique of filling zeros around the margin of the image
    to improve the sweep that is done with the sliding window. The parameter to define
    this technique is called `padding`, which we will also present in more detail
    in the next section, with which you can specify the size of this padding.


    In our case of study, and following the formalism previously presented, to "connect"
    each neuron of the hidden layer with the 25 corresponding neurons of the input
    layer we will use a bias value `b` and a `W`-weights matrix of size `5×5` that
    we will call `filter` (or `kernel`). The value of each point of the hidden layer
    corresponds to the scalar product between the filter and the handful of 25 neurons
    (`5×5`) of the input layer.


    However, the particular and very important thing about convolutional networks
    is that we use the same filter (the same `W` matrix of weights and the same `b`
    bias) for all the neurons in the hidden layer: in our case for the `24×24` neurons
    (576 neurons in total) of the first layer. The reader can see in this particular
    case that this sharing drastically reduces the number of parameters that a neural
    network would have if we did not do it: it goes from 14,400 parameters that would
    have to be adjusted (`5×5 × 24×24`) to 25 (`5×5`) parameters plus biases `b`.


    This shared `W` matrix together with the `b` bias, which we have already said
    we call a filter in this context of convolutional networks, is similar to the
    filters we use to retouch images, which in our case are used to look for local
    characteristics in small groups of entries. I recommend looking at the examples
    found in the GIMP image editor manual[\[134\]](#part0000_split_065.html#_ftn134)
    to get a visual and very intuitive idea of how a convolution process works.


    But a filter defined by a matrix `W` and a bias `b` only allows detecting a specific
    characteristic in an image; therefore, in order to perform image recognition,
    it is proposed to use several filters at the same time, one for each characteristic
    that we want to detect. That is why a complete convolutional layer in a convolutional
    neuronal network includes several filters.


    A usual way to visually represent this convolutional layer is shown in the following
    figure, where the level of hidden layers is composed of several filters. In our
    example we propose 32 filters, where each filter is defined with a `W` matrix
    of `5×5` and a bias `b`.


    ![](images/00068.jpeg)


    In this example, the first convolutional layer receives a size input tensor `(28,
    28, 1)` and generates a size output `(24, 24, 32)`, a 3D tensor containing the
    32 outputs of `24×24` pixel result of computing the 32 filters on the input.


    ### The pooling operation


    In addition to the convolutional layers that we have just described, convolutional
    neural networks accompany the convolution layer with pooling layers, which are
    usually applied immediately after the convolutional layers. A first approach to
    understand what these layers are for is to see that the pooling layers simplify
    the information collected by the convolutional layer and create a condensed version
    of the information contained in them.


    In our MNIST example, we are going to choose a `2×2` window of the convolutional
    layer and we are going to synthesize the information in a point in the pooling
    layer. Visually, it can be expressed as follows:


    ![](images/00069.jpeg)


    There are several ways to condense the information, but a usual one, which we
    will use in our example, is known as `max-pooling`, which as a value keeps the
    maximum value of those that were in the `2×2` input window in our case. In this
    case we divide by 4 the size of the output of the pooling layer, leaving an image
    of `12×12`.


    `average-pooling` can also be used instead of `max-pooling`, where each group
    of entry points is transformed into the average value of the group of points instead
    of its maximum value. But in general, `max-pooling` tends to work better than
    alternative solutions.

    '
  trans: '


    从直观上来说，我们可以说卷积层的主要目的是检测图像中的特征或视觉特征，例如边缘、线条、颜色色块等。这是一个非常优的特性，因为一旦它在图像的特定点学习了某种特征，它就可以在之后图像的任何部分识别出它。相比之下，在全连接神经网络中，如果该模式出现在图像的新位置，它就必须重新学习该模式。


    另一个重要特性是，卷积层可以通过保留空间关系来学习模式的空间分级结构。例如，第一层卷积层可以学习边缘等基本元素，而第二层卷积层可以学习由上一层学习的基本元素组成的模式。以此此类推，直到学习到非常复杂的模式。这使得卷积神经网络能够高效地学习日益复杂和抽象的视觉概念。


    通常情况下，卷积层作用在 3D 张量上，称为特征图（feature maps），它具有高度和宽度的两个空间轴，以及一个也称为深度的通道轴。对于 RGB 彩色图像，深度轴的维度为
    3，因为图像有三个通道：红、绿、蓝。对于黑白图像（如 MNIST 数字），深度轴维度为 1（灰度级）。


    在 MNIST 的案例中，我们可以将神经网络的输入看作是一个二维神经元空间 `28×28`（高度 = 28，宽度 = 28，深度 = 1）。我们讨论过的与输入层神经元连接的第一层隐藏神经元将执行我们刚刚描述的卷积操作。但正如我们所解释的，并不是所有输入神经元都连接到这一层隐藏神经元的所有神经元；它只通过输入神经元空间中存储图像像素的小局部区域来完成。


    上述内容在视觉上可以表示为：


    ![](img/00066.jpeg)


    在我们之前的示例中，隐藏层的每个神经元将连接到输入层（`28×28`）的一个 `5×5` 神经元小区域（即 25 个神经元）。直观地说，我们可以想象一个 `5×5`
    大小的窗口，它在包含图像的整个 `28×28` 神经神经元层上滑动。对于窗口的每个位置，隐藏层中都有一个神经元处理这些信息。


    从视觉上看，我们从图像左上角的窗口开始，这为隐藏层的第一个神经元提供了必要的信息。然后，我们将窗口向右移动一个位置，将该窗口包含的输入层 `5×5` 神经元与隐藏层的第二个神经元“连接”起来。这样，连续地从左到右、从上到下遍历整个输入层空间。


    稍微分析一下我们提出的具体情况，我们注意到，如果我们有一个 `28×28` 像素的输入和一个 `5×5` 的窗口，这定义了第一层隐藏层中 `24×24` 个神经元的空间，因为在碰到输入图像的右侧（或底部）边界之前，我们只能向右移动
    `23` 个神经元，向下移动 `23` 个神经元。


    ![](img/00067.jpeg)


    我们向读者指出，我们做的假设是当新行开始时，窗口在水平和垂直方向上向前移动 1 个像素。因此，在每一步中，新窗口与上一个窗口重叠，除了我们推进的那行像素外。但正如我们在下一节中看到的，在卷积神经网络中，可以使用不同长度的步长（称为参数
    `stride`）。在卷积神经网络中，您还可以应用图像边缘填充零的技术，以改进滑动窗口的操作。定义这种技术的参数称为 `padding`（填充），我们将在下一节中详细介绍，并在其中指定指定填充的大小。


    在我们的案例中，遵循之前介绍的形式，为了“连接”隐藏层的每个神经元与输入层的 25 个对应神经元，我们将使用一个偏置值 `b` 和一个大小为 `5×5` 的
    `W` 权重矩阵，我们称之为滤波器（filter 或 kernel）。隐藏层每个点的值对应于滤波器与输入层 25 个神经元（`5×5`）之间的点积。


    然而，卷积网络特殊且重要的一点是，我们对隐藏层中的所有神经元使用相同的滤波器（相同的 `W` 权重矩阵和相同的 `b` 偏置）：在我们案例中，对于第一层的
    `24×24` 个神经元（总共 576 个神经元）。读者在这种特殊情况下可以看到，这种共享极大减少了如果不这样做神经网络将拥有的参数数量：从需要调整的 14,400
    个参数（`5×5 × 24×24`）减少到 25 个（`5×5`）参数加上偏置 `b`。


    这种共享的 `W` 矩阵加上 `b` 偏置（我们在卷积网络的语境下称之为滤波器），类似于我们用于修饰图像的滤波器，在我们案例中，它们用于在小条目组中寻找局部特征。我建议查看
    GIMP 图像编辑器手册[\[134\]](#part0000_split_065.html#_ftn134) 中的示例，以对卷积过程如何运作有一个直观且非常直观的理解。


    但由矩阵 `W` 和偏置 `b` 定义的滤波器仅允许检测图像中的某种特定特征；因此，为了执行图像识别，建议同时使用多个滤波器，每个滤波器对应我们想要检测的一种种特征。这就是为什么卷积神经网络中的完整卷积层包含多个滤波器。


    视觉上表示这种卷积层的常用方法如图所示，其中隐藏层级由多个滤波器组成。在我们的示例中，我们建议使用 32 个滤波器，每个滤波器由一个 `5×5` 的 `W`
    矩阵和一个偏置 `b` 定义。


    ![](img/00068.jpeg)


    在这个示例中，第一层卷积层接收大小为 `(28, 28, 1)` 的输入张量，并生成大小为 `(24, 24, 32)` 的输出，这是一个 3D 张量，包含了在输入上计算
    32 个滤波器得到的 32 个 `24×24` 像素结果的输出。


    ### 池化操作


    除了我们刚刚描述的卷积层外，卷积神经网络还配有池化层，池化层通常紧接在卷积层之后。理解这些层作用的第一种方法是，池化层简化了卷积层收集的信息，并创建了其中信息的压缩版本。


    在我们的 MNIST 示例中，我们将选择卷积层的一个 `2×2` 窗口，并在池化层的一个点中合成信息。从视觉上看，可以表示如下：


    ![](img/00069.jpeg)


    有多种方法压缩信息，但一种常用方法（我们将在示例中使用）被称为 `max-pooling`（最大池化），它作为值保留了 `2×2` 输入窗口中的最大值。在这种情况下，我们将池化层输出的大小缩小了
    4 倍，留下 `12×12` 的图像。


    也可以使用 `average-pooling`（平均池化）来代替 `max-pooling`，其中每组输入点被转换为该组点的平均值，而不是最大值。但通常情况下，`max-pooling`
    的效果往往比替代方案更好。


    '
