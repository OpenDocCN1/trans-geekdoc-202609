    在这种背景下，目前我们可以认为模型的训练阶段基本上由调整参数组成（权重 `wi` 和偏置 `b`），使得损失函数的结果返回尽可能的最小值。


    最后，我们需要处理模型中的**过拟合**概念，过拟合发生当模型对输入的标记示例调整得过头时，以至于后来生成的模型无法对以前从未见过的新数据示例做出正确预测。鉴于本书的入门性质，我们不会深入这一主题，但它是深度学习（Deep
    Learning）中的一个核心主题。


    ### 人工神经网络与深度学习


    机器学习算法的一个特殊用例是人工神经网络，其算法结构允许由多层处理单元组成的模型学习具有多个抽象层级的数据表征。这组由“神经元”组成的层对输入数据进行一系列线性的非线性变换，以生成一个接近预期（标签）的输出。在这种情况下，**监督学习**包含在获取这些变换的参数（`wi`
    权重和 `b` 偏置），并尝试让这些变换产生与预期输出尽可能小的输出。


    深度学习神经网络的一种简单图表化方法可以是：


    ![](img/00018.jpeg)


    具体来说，在这张图片中我们表示了一个具有 3 层的人工神经网络：接收输入数据的输入层和一个返回所做预测的输出层。我们中间的层被称为隐藏层，我们可以有很多层隐藏层，每层都有不同数量的神经元。我们稍后会看到用圆表示的神经元将以不同的方式在不同层的神经元之间相互连接。


    通常，今天我们处理的是具有许多层的人工神经网络，这些层字面上一个一个地堆叠在一起；因此产生了深度（网络深度）的概念。每一层都由许多神经元组成，每个神经元都有其参数（权重
    `wi` 和偏置 `b`），它们对接收到的来自前一层神经元的数据进行简单变换，然后将其传递给后一层的神经元。网络中所有神经元执行的这些变换的结合，使得我们能够从数据中发现复杂的模式。


    在结束本节之前，我想让读者了解如今编写深度学习算法所涉及的问题规模：不同的层有不同的用途，而且每个参数和超参数对最终结果都有很大影响；这使得在尝试精炼神经网络模型的编程时变得极其复杂，对于初次该领域的人来说，这看起来更像是一门艺术而非科学。但这并不意味着它是某种神秘的东西，尽管确实有许多领域有待研究，但它仅仅需要许多小时的学习和实践。


    接下来的图直观地总结了这样一个直观想法：深度学习只是人工智能的一部分，尽管如今它可能是最有活力的一个部分，也是最令科学界着的一个部分。正如我之前提到的 Stuart
    Rusell 和 Peter Novig 的著作作为人工智能的主要书籍，当涉及到深度学习时，我们可以阅读一本名为《Deep Learning》[[42]](#part0000_split_065.html#_ftn42)的优秀书籍，它由
    Ian Goodfellow、Yoshua Bengio 和 Aaron Courville 编写，它构成了更深入学习这一主题的基础。


    ![](img/00019.jpeg)


    ## 1.3 为什么是现在？


    在短短十年内[43，世界上市值最大的五家公司中有四家发生了变化：埃克森美孚（Exxon Mobil）、通用电气（General Electric）、花旗银行（Citigroup）和壳牌石油（Shell
    Oil）已经退场，而苹果（Apple）、Alphabet（Google 的母公司）、亚马逊（Amazon）和脸（Facebook）取代了它们的地位。只有微软维持着其地位。你已经意识到，它们都主导了我们所浸其中的新数字时代。我们所说的是以广义人工智能特别是深度学习为力量基础的公司。


    约翰·麦卡锡（John McCarthy）在 50 年代创造了“人工智能”这一术语，与马文·明斯基（Marvin Minsky）一起成为人工智能之父。在 1958
    年，弗兰克·罗森布特（Frank Rosenblatt）建立了一个神经元原型，将其称为感知器（Perceptron）。此外，用于计算机视觉的深度学习神经网络的核心思想在
    1989 年就已经已知；用于时间序列的基础深度学习算法如 `LSTM` 在 1997 年就已经开发出来。那么，为什么现在是人工智能的热潮？


    无疑，计算能力的可用是主要的触发因素，正如我们之前介绍的那样。然而，其他因素也促进了人工智能及相关技术的释放。接下来我们将讨论影响它的最重要因素。


    ### 数据，人工智能的燃料


    人工智能需要大型数据集来训练模型，但幸运的是，由于数据生成成本的巨大下降和可靠性的增加，数据的创建和可用性呈指数级增长：数字照片、廉价且精确的传感器等。此外，近年来存储硬件的改进，结合其
    `NoSQL` [44 数据库技术，使得拥有海量数据集来训练人工智能模型。


    除了互联网出现带来的数据可用性增加外，专门的数据催化了该领域的发展。许多开放数据库支持人工智能算法的快速发展。一个例子是 `ImageNet` [45 数据库，我们已经提到过，它免费提供超过
    1000 万张手动标记的图像。


    虽然早期的方案基于传统的计算机视觉算法，但在 2012 年，Alex Krizhevsky 使用了被称为 `AlexNet` 的深度学习神经网络，它将错误率降低到上一届竞赛冠军结果的一半以下。早在
    2015 年，冠军算法就比肩人类能力，而今天深度学习算法的错误率远超过了这项竞赛中人类的水平。


    '
