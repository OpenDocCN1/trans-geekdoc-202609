    [9\\]](#part0000_split_065.html#_ftn9), written by Google researchers. In this\
    \ article presented at the previous International Conference in Machine Learning\
    \ (ICML'12), the authors explained how they trained a Deep Learning model in a\
    \ cluster of 1,000 machines with 16,000 cores. I was very happy to see how supercomputing\
    \ made it possible to accelerate this type of applications, as I wrote in my blog[\\\
    [10\\]](#part0000_split_065.html#_ftn10) a few months later, justifying the reasons\
    \ that led the group to add this research focus to our research roadmap.\n\nThanks\
    \ to Moore's Law[\\[11\\]](#part0000_split_065.html#_ftn11), in 2012, when these\
    \ Google researchers wrote this article, we had supercomputers that allowed us\
    \ to solve problems that would have been intractable a few years before due to\
    \ the computing capacity. For example, the computer that I had access to in 1982,\
    \ where I executed my first program with punch-cards, it was a Fujitsu that made\
    \ it possible to execute a little more than one million operations per second.\
    \ 30 years later, in 2012, the Marenostrum supercomputer that we had at the time\
    \ at the Barcelona Supercomputing Center-National Supercomputing Center (BSC),\
    \ was only 1,000,000,000 times faster than the computer on which I started.\n\n\
    ![](images/00010.jpeg)\n\n###  \n\nWith the upgrade of that year, the MareNostrum\
    \ supercomputer offered a theoretical maximum performance peak of 1.1 Petaflops\
    \ (1,100,000,000,000 floating point operations per second[\\[12\\]](#part0000_split_065.html#_ftn12)).\
    \ It achieved it with 3,056 servers with a total of 48,896 cores and 115,000 Gigabytes\
    \ of total main memory housed in 36 racks. At that time the Marenostrum supercomputer\
    \ was considered to be one of the fastest in the world. It was placed in the thirty-sixth\
    \ position, in the TOP500 list[\\[13\\]](#part0000_split_065.html#_ftn13), which\
    \ is updated every half year and ranks the 500 most powerful supercomputers in\
    \ the world. Attached you can find a photography where you can see the Marenostrum\
    \ computer racks that were housed in the Torres Girona chapel of the UPC campus\
    \ in Barcelona.[\\[14\\]](#part0000_split_065.html#_ftn14).\n\n### The first GPU\
    \ in the ImageNet competition\n\nDuring that period was when I began to become\
    \ aware of the applicability of supercomputing to this new area of research. When\
    \ I started looking for research articles on the subject, I discovered the existence\
    \ of the Imagenet competition and the results of the team of the University of\
    \ Toronto in the competition in 2012[\\[15\\]](#part0000_split_065.html#_ftn15).\
    \ The ImageNet competition (Large Scale Visual Recognition Challenge[\\[16\\]](#part0000_split_065.html#_ftn16))\
    \ had been held since 2010, and by that time it had become a benchmark in the\
    \ computer vision community for the recognition of objects on a large scale. In\
    \ 2012 Alex Krizhevsky, Ilya Sutskever and Geoffrey E. Hilton used for the first\
    \ time hardware accelerators GPU (graphical processing units) [\\[17\\]](#part0000_split_065.html#_ftn17),\
    \ which was already used at that time in supercomputing centers like ours in Barcelona\
    \ to increase the speed of execution of applications that require the  performance\
    \ of many calculations.\n\nFor example, at that time BSC already had a supercomputer\
    \ called MinoTauro, with 128 Bull505 nodes, equipped with 2 Intel processors and\
    \ 2 Tesla M2090 GPUs from NVIDIA each one. With a peak performance of 186 Teraflops,\
    \ launched in September 2011 (out of curiosity, at that time it was considered\
    \ the most energy efficient supercomputer in Europe according to the Green500\
    \ list[\\[18\\]](#part0000_split_065.html#_ftn18)).  \n\nUntil 2012, the increase\
    \ in computing capacity that we got each year from computers was as a result of\
    \ the improvement of the CPU. However, since then the increase in computing capacity\
    \ for Deep Learning has not only been credited to them, but also to the new massively\
    \ parallel systems based on GPU accelerators, which are many times more efficient\
    \ than traditional CPUs."
