    一旦计算出属于 10 个类别中每个类别的证据，就必须将这些证据转换为总和为 1 的概率。为此，`softmax` 使用计算出的证据指数值，然后对它们进行归一化，使总和等于
    1，形成一个概率分布。属于类别 `i` 的概率为：


    ![](img/00035.jpeg)


    直观地说，使用指数获得的效果是，证据增加一个单位具有乘法效应，而减少一个单位则产生相反效应。这个函数的有趣之处在于，良好的预测在向量中会有一个值接近 1 的项，而其余项接近
    0。在较弱的预测中，会有多个可能的标签，它们的概率大致相同。


