- raw: "In short, an immense world of possibilities will be seen in more detail in\
    \ the following chapters, but the reader can already realize that finding the\
    \ best architecture with the best parameters and hyperparameters of activation\
    \ functions requires some expertise and experience given the multiple possibilities\
    \ that we have.\n\n### Parameters and hyperparameters\n\nSo far, for simplicity,\
    \ we have not paid explicit attention to differentiating between parameters and\
    \ hyperparameters, but I think the time has come. In general, we consider a parameter\
    \ of the model as a configuration variable that is internal to the model and whose\
    \ value can be estimated from the data. In contrast, by hyperparameter we refer\
    \ to configuration variables that are external to the model itself and whose value\
    \ in general cannot be estimated from the data, and are specified by the programmer\
    \ to adjust the learning algorithms.\n\nWhen I say that Deep Learning is more\
    \ an art than a science, I mean that it takes a lot of experience and intuition\
    \ to find the optimal values of these hyperparameters, which must be specified\
    \ before starting the training process so that the models train better and more\
    \ quickly. Given the introductory nature of the book we will not go into detail\
    \ about all of them, but we have hyperparameters that are worth mentioning briefly,\
    \ both at the structure and topology level of the neural network (number of layers,\
    \ number of neurons, their activation functions, etc.) and at the learning algorithm\
    \ level (learning rate, momentum, epochs, batch size, etc.).\n\nNext, we will\
    \ introduce some of them and the rest will appear in chapter 6 as we go into convolutional\
    \ neural network. \n\n### Epochs \n\nAs we have already done, epochs tells us\
    \ the number of times all the training data have passed through the neural network\
    \ in the training process. A good clue is to increase the number of epochs until\
    \ the accuracy metric with the validation data starts to decrease, even when the\
    \ accuracy of the training data continues to increase (this is when we detect\
    \ a potential overfitting).\n\n### Batch size \n\nAs we have said before, we can\
    \ partition the training data in mini batches to pass them through the network.\
    \ In Keras, the batch\\_size is the argument that indicates the size of these\
    \ batches that will be used in the fit() method in an iteration of the training\
    \ to update the gradient. The optimal size will depend on many factors, including\
    \ the memory capacity of the computer that we use to do the calculations.\n\n\
    ### Learning rate \n\nThe gradient vector has a direction and a magnitude. Gradient\
    \ descent algorithms multiply the magnitude of the gradient by a scalar known\
    \ as learning rate (also sometimes called step size) to determine the next point.\n\
    \nIn a more formal way, the backpropagation algorithm computes how the error changes\
    \ with respect to each weight:\n\n![](images/00048.jpeg)\n\nIn order to update\
    \ each weight of the network using a simple update rule:\n\n![](images/00049.jpeg)\n\
    \nWhere α is the learning rate. \n\nFor example, if the magnitude of the gradient\
    \ is 1.5 and the learning rate is 0.01, then the gradient descent algorithm will\
    \ select the next point at 0.015 from the previous point.\n\nThe proper value\
    \ of this hyperparameter is very dependent on the problem in question, but in\
    \ general, if this is too big, huge steps are being made, which could be good\
    \ to go faster in the learning process. But in this case, we may skip the minimum\
    \ and make it difficult for the learning process to stop because, when searching\
    \ for the next point, it perpetually bounces randomly at the bottom of the \"\
    well\". Visually we can see in this figure the effect that can occur, where the\
    \ minimum value is never reached (indicated with a small arrow in the drawing):\n\
    \n![](images/00050.jpeg)\n\nContrarily, if the learning rate is small, small advances\
    \ will be made, having a better chance of reaching a local minimum, but this can\
    \ cause the learning process to be very slow. In general, a good rule is to decrease\
    \ the learning rate if our learning model does not work. If we know that the gradient\
    \ of the loss function is small, then it is safe to test that it compensates the\
    \ gradient with the learning rate. \n\n### Learning rate decay \n\nBut the best\
    \ learning rate in general is one that decreases as the model approaches a solution.\
    \ To achieve this effect, we have another hyperparameter, the learning rate decay,\
    \ which is used to decrease the learning rate as epochs go by to allow learning\
    \ to advance faster at the beginning with larger learning rates. As progress is\
    \ made, smaller and smaller adjustments are made to facilitate the convergence\
    \ of the training process to the minimum of the loss function.\n\n### Momentum\n\
    \nIn the visual example with which we have explained the descent gradient algorithm,\
    \ to minimize the loss function we have the guarantee of finding the global minimum\
    \ because there is no local minimum in which the optimization process can be stuck.\
    \ However, in reality, the real cases are more complex and, visually, it is as\
    \ if we could find several local minimums and the loss function had a form like\
    \ the one in the following figure:\n\n![](images/00051.jpeg)\n\nIn this case,\
    \ the optimizer can easily get stuck at a local minimum and the algorithm may\
    \ think that the global minimum has been reached, leading to suboptimal results.\
    \ The reason is that the moment we get stuck, the gradient is zero and we can\
    \ no longer get out of the local minimum strictly following the path of the gradient.\
    \ \n\nOne way to solve this situation could be to restart the process from different\
    \ random positions and, in this way, increase the probability of reaching the\
    \ global minimum.\n\nTo avoid this situation, another solution that is generally\
    \ used involves the momentum hyperparameter. In an intuitive way, we can see it\
    \ as if, to move forward, it will take the weighted average of the previous steps\
    \ to obtain a bit of impetus and overcome the \"bumps\" as a way of not getting\
    \ stuck in local minima. If we consider that the average of the previous ones\
    \ was better, perhaps it will allow us to make the jump. \n\nBut using the average\
    \ has proved to be a very drastic solution because, perhaps in gradients of previous\
    \ steps, it is much less relevant than just in the previous one. That is why we\
    \ have chosen to weight the previous gradients, and the momentum is a constant\
    \ between 0 and 1 that is used for this weighting. It has been shown that algorithms\
    \ that use momentum work better in practice.\n\nOne variant is the Nesterov momentum,\
    \ which is a slightly different version of the momentum update that has recently\
    \ gained popularity and which basically slows down the gradient when it is close\
    \ to the solution.\n\n### Initialization of parameter weights\n\nThe initialization\
    \ of the parameters’ weight is not exactly a hyperparameter, but it is as important\
    \ as any of them and that is why we make a brief paragraph in this section. It\
    \ is advisable to initialize the weights with small random values to break the\
    \ symmetry between different neurons, if two neurons have exactly the same weights\
    \ they will always have the same gradient; that supposes that both have the same\
    \ values in the subsequent iterations, so they will not be able to learn different\
    \ characteristics. \n\nInitializing the parameters randomly following a standard\
    \ normal distribution is correct, but it can lead to possible problems of vanishing\
    \ gradients (when the values of a gradient are too small and the model stops learning\
    \ or takes too long due to that) or exploding gradients (when the algorithm assigns\
    \ an exaggeratedly high importance to the weights)."
