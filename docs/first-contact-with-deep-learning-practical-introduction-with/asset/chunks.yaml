    # Artificial Intelligence


    What do we mean when we talk about Artificial Intelligence? An extensive and precise
    definition (and description of its areas) is found in the book *Artificial Intelligence,
    a modern approach* written by Stuart Rusell and Peter Norvig, the most popular
    book on Artificial Intelligence in the university world and, without a doubt for
    me, the best starting point to have a global vision of the subject. But trying
    to make a more general approach (purpose of this book), we could accept a simple
    definition in which by Artificial Intelligence we refer to that intelligence shown
    by machines, in contrast to the natural intelligence of humans. In this sense,
    a possible concise and general definition of Artificial Intelligence could be
    the effort to automate intellectual tasks normally performed by humans.


    As such, the area of artificial intelligence is a very broad scientific field
    that covers many areas of knowledge related to machine learning; even many more
    approaches not always cataloged as Machine Learning are included by my university
    colleagues who are experts in the subject. Besides, over time, as computers have
    been increasingly able to "do things", tasks or technologies considered as "smart"
    have been changing.


    Furthermore, since the 1950s, Artificial Intelligence has experienced several
    waves of optimism, followed by disappointment and loss of funding and interest
    (periods known as AI winter), followed by new approaches, success and financing.
    Moreover, during most of its history, Artificial Intelligence research has been
    dynamically divided into subfields based on technical considerations or concrete
    mathematical tools and with research communities that sometimes did not communicate
    sufficiently with each other.


    # Machine Learning


    As we said in the previous section, advances such as speech recognition, natural
    language processing or computer vision are crucial to trigger improvements in
    robotics, drones, driverless cars, among many other areas that are changing the
    near future. Many of these advances have been possible thanks to a family of techniques
    popularly known as Deep Learning, of which we will talk extensively. But first,
    for us to have a correct global image, I think it''s interesting to specify that
    Deep Learning is a subpart of one of the areas of Artificial Intelligence known
    as Machine Learning.


    Machine Learning, is in itself a large field of research and development. In particular,
    Machine Learning could be defined as the subfield of Artificial Intelligence that
    gives computers the ability to learn without being explicitly programmed, that
    is, without requiring the programmer to indicate the rules that must be followed
    to achieve their task; the computers do them automatically.


    Generalizing, we can say that Machine Learning consists in developing for each
    problem a prediction “algorithm" for a particular use case. These algorithms learn
    from the data in order to find patterns or trends to understand what the data
    tell us and in this way build a model to predict and classify the elements.


    Given the maturity of the research area in Machine Learning, there are many well-established
    approaches to Machine Learning. Each of them uses a different algorithmic structure
    to optimize the predictions based on the received data. Machine Learning is a
    broad field with a complex taxonomy of algorithms that are grouped, in general,
    into three main categories: Supervised Learning, Unsupervised Learning and Reinforcement
    Learning.


    We mean that learning is supervised when the data we use for training includes
    the desired solution, called "label". Some of the most popular machine learning
    algorithms in this category are linear regression, logistic regression, support
    vector machines, decision trees, random forest or neural networks.


    On the other hand, when the training data do not include the labels, we refer
    to an Unsupervised Learning and it will be the algorithm which will try to classify
    the information by itself. Some of the best-known algorithms in this category
    are clustering (`K-means`) or principal component analysis (`PCA`).


    We also talk about Reinforcement Learning when the model is implemented in the
    form of an agent that should explore an unknown space and determine the actions
    to be carried out through trial and error: the algorithm will learn by itself
    thanks to the rewards and penalties that it obtains from its “actions”. The agent
    must create the best possible strategy (policies) to obtain the greatest reward
    in time and form. This learning allows it to be combined with other types, and
    is now very fashionable since the real world presents many of these scenarios.


    # Basic Machine Learning terminology


    In this section we will advance basic Machine Learning terminology that will allow
    us to keep a presentation script of the concepts of Deep Learning in a more comfortable
    and gradual way throughout the book.


    In Machine Learning we refer to `label` to what we are trying to predict with
    a model. Instead, we call an input variable a `feature`.


    A model defines the relationship between features and labels and has two clearly
    differentiated phases for the subject that concerns us:


    *   Training phase (or learning plase), which is when the model is created or
    learned, showing the examples of input that have been tagged; In this way, the
    model is able to iteratively learn the relationships between the features and
    labels of the examples.

    *   Inference phase (or prediction or phase), which refers to the process of making
    predictions by applying the model already trained to non-labeled examples.


    Consider a simple example of a model that expresses a linear relationship between
    features and labels. The model could be expressed as follows:


    ```

    y=wx+b

    ```


    Where:


    *   `y` is the label of an input example.

    *   `x` is the feature of that input example.

    *   `w` is the slope of the line and that is what in general we call weight. It
    is one of the two parameters that the model has to learn during the training process
    to be able to use it later for inference.

    *   `b` is the intersection point of the line on the y-axis that we call bias.
    This is the other parameter that must be learned by the model.


    Although in this simple model that we have represented there is only input feature,
    in the case of Deep Learning we will see that we have many input variables, each
    with its `wi` weight. For example, a model based on three features (`x1`, `x2`,
    `x3`) can be expressed as follows:


    ```

    y= w1x1+ w2x2+w3x3+b

    ```


    Or, more generally, it can be expressed as:


    ```

    (images/00017.jpeg)

    ```


    which expresses the sum of the scalar product between the two vectors (`X` and
    `W`) and then adds the bias. The parameter bias `b`, in order to facilitate the
    formulation, it is sometimes expressed as the parameter `w0` (assuming a fixed
    additional entry of `x0=1`).


    In the training phase of a model, ideal values are learned for the model parameters
    (the `wi` weights and the `b` bias). In supervised learning, the way to achieve
    this is to apply an automatic learning algorithm that obtains the value of these
    parameters by examining many labeled examples and try to determine values for
    these model parameters that minimize what we call loss.


    As we will see throughout the book, the loss is a central concept in Deep Learning
    that represents the penalty of a bad prediction. That is, the loss is a number
    that indicates how bad a prediction has been in a particular example (if the prediction
    of the model is perfect, the loss is zero). To determine this value, as we will
    see later, in the training process the concept of the loss function will appear,
    and for the time being we can see how the mathematical function that aggregates
    the individual losses obtained from the input examples to the model.

