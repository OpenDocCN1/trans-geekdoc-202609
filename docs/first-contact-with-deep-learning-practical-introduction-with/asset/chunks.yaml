    通常，可以根据网络所使用的激活函数类型来使用启发式方法。介绍这些细节超出了本书的入门级水平，但如果读者想更深入研究，我建议你访问 Andrej Karpathy
    在斯坦福大学的 CS231n 课程 130 ，在那里你可以以非常直观的方式获得该领域非常有价值的知识。


    ## Keras 中的超参数和优化器


    我们如何指定这些超参数呢？回想起优化器是模型 `compile()` 方法中必需的参数之一。到目前为止，我们通过名称来调用它们（使用一个标识它们的简单字符串），但
    `Keras` 也允许将优化器类的实例作为参数传递，并指定某些超参数。


    例如，随机梯度下降优化器允许使用动量（momentum）、学习率衰减和 Nesterov 动量超参数：


    ```

    keras.optimizers.SGD(lr=0.01, momentum=0.0, decay=0.0, nesterov=False)

    ```


    上一个方法参数中指定的值是默认值，其范围可以是：


    * `lr`: `float` >= 0.（学习率）

    * `momentum`: `float` >= 0

    * `decay`: `float` >= 0（学习率衰减）。

    * `nesterov`: `boolean`（指示是否使用 Nesterov 动量）。


    正如我们所说，`Keras` 中有多个优化器，读者可以在它们的文档页面 131 上进行探索。


    # 5 开始学习深度学习超参数


    在本章中，我们建议使用一个名为 `TensorFlow Playground` 的交互工具来测试我们在上一章中所学的知识 132 。该工具可以帮助读者输入神经网络的细节，并实践这里介绍的一些概念，而无需输入其背后的数学原理。


    ## 5.1 TensorFlow Playground


    `TensorFlow Playground` 是一个用 `JavaScript` 编写的交互式可视化 Web 应用程序，它允许我们在浏览器中模拟简单的神经网络并实时查看结果：


    ![](img/00052.jpeg)


    通过这个工具，我们可以尝试不同的超参数并观察它们的行为。事实上，神经网络中超参数提供的灵活性是它的优点之一，同时对于初学该主题的人来说也是一个缺点：有许多参数需要调整！


    ## 5.2 一个二分类问题


    为了开始理解该工具如何工作，我们可以使用本书第 2 章介绍的感知机第一个示例，即一个简单的分类问题。


    为了开始这个示例，我们选择了前一个图中显示的“DATA”（数据）部分中指示的数据集，然后点击“Play”（播放）按钮。现在我们可以看到 `TensorFlow
    Playground` 如何解决这个特定问题。蓝色和橙色区域之间的线条开始缓慢移动。你可以按下“Reset”（重置）按钮并重新测试几次，观察线条如何随不同的初始值移动。


    在这种情况下，应用程序尝试寻找参数的最佳值，以便正确分类这些点。如果将光标悬停在弧上，读者将看到分配给每个参数的值（它甚至允许我们编辑它）：


    ![](img/00053.jpeg)


    记住，这个权重在与输入值相乘时，决定了该关系在神经元中的重要性。


    在第一次接触之后，我们将简单介绍这个工具，它将允许我们理解神经网络是如何工作的。在菜单的顶部，我们基本上找到了超参数，其中一些我们在上一章中提到过：Epoch（迭代次数）、Learning
    rate（学习率）、Activation（激活）、Regularization rate（正则率）和 Problem type（问题类型）。它们都是下拉菜单，我们可以在其中选择这些超参数的值。


    在“Problem type”（问题类型）标签页中，平台允许我们指定两种问题：Regression（回归，连续问题）和 Classification（分类）。总共有四种用于分类的数据类型和两种用于回归：


    ![](img/00054.jpeg)


    蓝色和橙色点形成了数据集。橙色点的值为 -1，蓝色点的值为 +1。在左侧，数据类型下方，有不同的参数可以修改以调整我们的输入数据。


    使用“Ratio of training to test data”（训练数据与测试数据的比例）标签页，我们可以控制分配给训练集的数据百分比（如果我们修改它，可以看到屏幕右侧“OUTPUT”（输出）中出现的点是如何交互式变化的）。数据的噪声水平也可以通过“Noise”（噪声）字段定义和控制；随着噪声的增加，数据模式变得越来越不规则。正如我们可以体验的那样，当噪声为零时，问题数据在各个区域内清晰区分。然而，当超过
    50 时，我们可以看到蓝色点和橙色点混合在一起，因此很难对它们进行分类。


    通过“Batch size”（批大小），顾如其名，我们可以确定每个训练批次使用的数据量。


    然后，在下一列中，我们可以对特征进行选择。我建议在许多可可用特征中使用“X1”和“X2”：“X1”是水平轴上的值，“X2”是垂直轴上的值。


    神经网络的拓扑结构可以在后续列中定义。我们可以拥有最多六个隐藏层（通过点击“+”），并且每个隐藏层可以有八个神经元（通过点击对应层的“+”）：


    ![](img/00055.jpeg)


    最后，记住训练神经网络时我们想要最小化“Training loss”（训练损失），然后对比“Test loss”（测试损失）。每个 epoch 的两个指标的变化交互地显示在屏幕右上部分，在一个小图中，当损失降低时，曲线会向下。测试损失显示为黑色，训练损失显示为灰色。


    ## 5.3 超参数设置基础


    ### 单神经元分类


    现在我们对这个工具有了更多了解，让我们回到将数据分为两组（类）的第一个分类示例。


    我建议在继续之前修改一些参数来练习工具。例如，我们可以修改学习率为 0.03 和 `ReLU` 激活函数的参数（正则化将超出本书的范围）。


    我们保持问题类型为分类，我建议将“ratio of training-to-test”（训练测试比例）设置为数据的 50%，并将“noise”（噪声）参数保持为零，以便可视化解决方案（尽管我建议之后你自己尝试）。我们可以将“batch
    size”保持为 10。


    和之前一样，我们将使用“X1”和“X2”作为输入。我建议从一个单神经元的隐藏层开始。我们可以通过使用“-或"+”按钮来实现：


    ![](img/00056.jpeg)


    在右上角，我们看到“Test loss”和“Training loss”的初始值很高（读者可能会获得不同的值，因为初始值是随机生成的）。但在点击“播放”按钮后，可以看到两者都收敛到较低水平并保持不变。此外，在这种情况下，两条线（黑色和灰色）完全重合。


    ![](img/00057.jpeg)


    ### 多个神经元的分类


    让我们选择另一组起始数据，如附图所示：


    ![](img/00058.jpeg)


