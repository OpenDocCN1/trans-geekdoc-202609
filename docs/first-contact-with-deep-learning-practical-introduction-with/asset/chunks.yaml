    如果模型没有完全适应输入数据（例如，如果出现了过拟合），在这种情况下，我们将修改某些超参数的值，并在使用训练数据重新训练后，再次使用验证数据对其进行评估。我们可以根据验证数据对这些超参数进行这些调整，直到我们获得我们认为正确的验证结果。如果我们遵循了这一程序，必须意识到，事实上验证数据已经影响了模型，使其也拟合了验证数据。出于这个原因，我们总是保留一组测试数据用于模型的最终评估，这组数据只会在整个过程的最后使用，此时我们认为模型已经经过微调，并且将不再修改它的任何超参数。


    鉴于本书的介绍性性质，且我们不会详细介绍超参数的调优，在示例中，我们将忽略验证数据，仅使用训练数据和测试数据。


    ## Keras 中的预加载数据


    在 `keras` 中，`MNIST` 数据以四个 `Numpy` 数组的形式预加载，可以通过以下代码获取：


    ```python

    import keras

    from keras.datasets import mnist

    (x_train, y_train), (x_test, y_test) = mnist.load_data()

    ```


    `x_train` 和 `y_train` 包含训练集，而 `x_test` 和 `y_test` 包含测试数据。图像被编码为 `Numpy` 数组，其对应的标签从
    0 到 9。遵循本书逐步引入主题概念的策略，正如我们所指出的，我们还不会看到如何分离部分训练数据作为验证数据。我们只考虑训练数据和测试数据。


    如果我们想检查加载了哪些值，可以选择 `MNIST` 集合中的任意图像，例如第 8 张图像，并使用以下 Python 代码：


    ```python

    import matplotlib.pyplot as plt

    plt.imshow(x_train[8], cmap=plt.cm.binary)

    ```


    我们得到了下面的图像：


    ![](img/00036.jpeg)


    如果我们想查看其对应的标签，可以通过以下方式：


    ```python

    print(y_train[8])

    ```


    正如我们看到的，它返回了值 "1"，符合预期。


    ## Keras 中的数据表示


    Keras 正如我们所看到的使用 `Numpy` 的多维数组作为基本数据结构，它将这种数据结构称为 `tensor`（张量）。简而言之，我们可以说一个 `tensor`
    有三个主要属性：


    - **轴的数量（秩）**：包含单个数字的张量被称为 `scalar`（标量，或 0 维张量、0D 张量）。数字数组我们称为 `vector`（向量），或
    1D 张量。向量数组将是矩阵，或 2D 张量。如果我们将此矩阵封装在一个新数组中，我们就得到 3D 张量，我们可以从视觉上将其解释为数字立方体。通过将 3D
    张量封装在数组中，我们可以创建一个 4D 张量，依此类推。在 Python `Numpy` 库中，这被称为张量的 `ndim`。

    - **形状（Shape）**：这是一个整数元组，描述张量沿每个轴有多少维度。在 `Numpy` 库中，此属性称为 `shape`。

    - **数据类型（Data type）**：此属性指示张量包含的数据类型，例如 `uint8`、`float32`、`float64` 等。在 `Numpy`
    库中，此属性称为 `dtype`。


    我建议我们从之前的示例中获取张量 `train_images` 的轴数和维度：


    ```python

    print(x_train.ndim)

    3

    print(x_train.shape)

    (60000, 28, 28)

    ```


    如果我们想知道它包含什么类型的数据：


    ```python

    print(x_train.dtype)

    uint8

    ```


    ## Keras 中的数据归一化


    这些 28×28 像素的 `MNIST` 图像表示为数字数组，值范围为 [0, 255]，类型为 `uint8`。但通常会将神经网络的输入值缩放到某些范围。在本章的示例中，输入值应该被缩放到
    [0, 1] 区间内的 `float32` 类型值。我们可以通过以下几行代码实现这种转换：


    ```python

    x_train = x_train.astype(''float32'')

    x_test = x_test.astype(''float32'')

    x_train /= 255

    x_test /= 255

    ```


    另一方面，为了方便数据进入我们的神经网络（我们将在卷积中看到这不是必要的），我们必须对张量（图像）进行从 2 维（2D）到 1 维向量（1D）的转换。也就是说，28×28
    数字矩阵可以用一个包含 784 个数字的向量（数组）（逐行拼接）表示，这是我们在本章将看到的全连接神经网络所接受的输入格式。在 Python 中，将 `MNIST`
    数据集的每张图像转换为具有 784 个组件的向量可以这样实现：


    ```python

    x_train = x_train.reshape(60000, 784)

    x_test = x_test.reshape(10000, 784)

    ```


    在执行这些 Python 指令后，我们可以验证 `x_train.shape` 采取的形式为 (60000, 784)，而 `x_test.shape` 采取的形式为
    (10000, 784)，其中第一个维度索引图像，第二个维度索引像素。


    为了看到转换的效果，我们将使用已经提到的独热编码（one-hot encoding），它由将标签转换为一个长度与类别数量相同的零向量组成，在对应于值的索引处包含
    1。Keras 提供了许多支持函数，包括从 `keras.utils` 导入的 `to_categorical` 来执行此操作。

