    \ 参数，以及对应于每个节点的 10 个 `bj` 偏置。\n\n`Dense` 层可以指示的参数细节可以在 Keras 手册中找到。在我们的示例中，出现了最相关的参数。第一个参数指示层中神经元的数量；后续是我们在其中使用的激活函数。在下一章中，我们将更详细地讨论这里提到的\
    \ `sigmoid` 和 `softmax` 之外的其他可能的激活函数。\n\n权重的初始化通常作为 `Dense` 层的参数指定。初始值必须能够让优化问题尽可能快速地收敛。各种初始化选项也可以在\
    \ Keras 手册中找到。\n\n## 3.3 在 Keras 中实现神经网络的基本步骤\n\n接下来，我们将简要描述实现基础神经网络必须执行的步骤：\n\
    \n### 学习过程的配置\n\n从 `Sequential` 模型开始，我们可以使用 `add()` 定义层。一旦定义了模型，我们就可以 `compile()`\
    \ 方法配置学习过程。第一个参数是 `loss` 函数，下一个指定 `optimizer`，最后我们必须指定 `metric`（指标）。例如，我们可以使用以下参数：\n\
    \n```python\nmodel.compile(loss=\"categorical_crossentropy\", optimizer=\"sgd\"\
    , metrics=['accuracy'])\n```\n\n在这个示例中，我们指定 `loss` 为 `categorical_crossentropy`，使用的\
    \ `optimizer` 是随机梯度下降（`sgd`），而 `metric` 是 `accuracy`。\n\n### 模型训练\n\n一旦定义了模型并配置了学习方法，就可以进行训练了。我们可以通过调用\
    \ `fit()` 方法来训练或“调整”模型：\n\n```python\nmodel.fit(x_train, y_train, batch_size=100,\
    \ epochs=5)\n```\n\n在前两个参数中，我们以 Numpy 数组的形式指定了用于训练模型的数据。`batch_size` 参数指定每次更新模型参数时使用的数据量，而\
    \ `epochs` 则指示我们使用所有数据的次数。该方法通过迭代训练算法寻找网络参数的值。粗来说，在算法的每次迭代中，它从 `x_train` 获取训练数据，将其通过神经网络（使用参数在此时刻的值），将得到的结果与预期结果（在\
    \ `y_train` 中指定）进行比较，并计算损失以引导模型参数的调整过程，直观来说，这在每次迭代中应用上述在 `compile()` 方法中指定的优化器来计算每个模型参数（权重和偏置）的新值，从而减少损失。\n\
    \n正如我们将会看到的，这种方法可能需要更长的时间，Keras 允许我们使用 `verbose` 参数（默认等于 1）查看其进度，此外还会指示每个 epoch\
    \ 所需时间的估计值：\n\n```\nEpoch 1/5\n60000/60000 [==================] - 1s 15us/step\
    \ - loss: 2.1822 - acc: 0.2916\nEpoch 2/5\n60000/60000 [==================] -\
    \ 1s 12us/step - loss: 1.9180 - acc: 0.5283\nEpoch 3/5\n60000/60000 [==================]\
