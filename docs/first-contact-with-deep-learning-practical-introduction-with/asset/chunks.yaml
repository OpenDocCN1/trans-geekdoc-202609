  trans: '


    由于这个原因，本书将具有极强的实用性导向。因此，理论数学部分将尽可能减少，尽管为了给读者提供坚实的知识，展示一些理论细节是绝对必要的。这意味着书中的页面将穿插着理论与实践知识，以辅助学习过程。


    在完成这篇序言之前，请允许我感谢大家阅读这本书！单是这一事实就让我感到高兴，并证明了我编写这本书的努力是有价值。了解我的人知道，教学（以及广义教育）是我的爱好之一，它让我保持活力和动力。


    正如我亲爱的母亲有时提醒我的那样，我年轻时常说，长大后我想当一名老师，想成为一名教师。现在，我在这里了，我的梦想成真了


    `Jordi Torres i Viñals`。2018 年 7 月 15 日。


    如果读者需要就本书的内容与作者联系，或想向他发送意见，可以通过电子邮件联系：`Jordi.Torres@DeepLearning.Barcelona`


    # 初步考虑


    在书中，读者将找到一份借助 `Keras` 库理解深度学习基础的指南，他们将学习使用该库，以开发和评估深度学习模型为目标。虽然深度学习基于迷人的数学，但得益于
    `Python` 库（如 `Keras`），开始学习甚至创建能够为公司产生价值的项目，并不严格需要数学知识。


    因此，本书将重点关注实际问题，向读者展示使用深度学习可以开启的精彩世界。重要的是记住，我们只能研究一小部分，因为在单本书中展示其全部范围是不可能的。跟上不断出现的最新研究、技术或工具是一项几乎不可能完成的任务，就像从消防软管中喝水一样


    ## 本书的读者


    这是一本入门级著作，最初设计用于支持我在 `UPC` 的教学工作，对象是对机器学习几乎或完全没有先验知识的计算机工程专业的学生。但反之，这本书对于那些已经离开教室开始工作但需要或仅仅是想学习这一主题的工程师来说也有用。


    因此，本书是以与读者保持“短距离”的形式编写的，仿佛我们正在 `UPC` 的某节课上一样。为了方便这一点，我将顺序介绍知识和概念，尝试通过要求读者始终将键盘放在面前并测试我所解释的内容来让他们参与。


    然而，这本书并不适合所有人，读者有正确的预期至关重要；在书中，你将找不到关于人工神经网络基础理论的解释，也不会有相关主题算法内部如何工作的细节。因此，不建议那些已经在非
    `Keras` 的其他环境中编写神经网络的人阅读。此外，如果这个库是他们的兴趣领域，也许这本书对于入门来说太长了，不适合从 `Keras` 库开始。


    ## 本书的结构


    本书由章节组成，必须顺序阅读，因为它们引导读者并逐渐向他们介绍遵循实践示例所需的本质知识，同时尽可能保持简洁。作为一本入门书，我认为这种方法比更正式的方法有用得多。尽管如此，我已努力确保本书的索引表达了关于主要概念的合理排序的地图。


    ### 第 1 章：引言


    作为一本入门书，我认为这种方法比更正式的方法有用得多。尽管如此，我已努力确保本书的索引表达了关于主要概念的合理排序的地图。


    在第一章中，我们将介绍可能需要的`机器学习` 最核心的概念。


    ### 第 2 章：深度学习基础


    在第二章中，我们将使用 `Keras` 介绍`深度学习`的基本概念。


    ### 第 3 章：神经网络基础


    在第三章中，我们将进入更实用的层面，展示`神经网络`的实现。


    ### 第 4 章：MNIST 分类


    在第四章中，我们将展示如何使用 `MNIST` 示例实现`神经网络`。


    ### 第 5 章：深度神经网络


    在第五章中，邀请读者实践一些深度学习`模型。


    ### 第 6 章：卷积神经网络


    在第六章中，我们将介绍`卷积神经网络`，这是最流行的`神经网络`家族之一。


    ## 本书假设


    如前所述，这项工作旨在作为介绍；并不要求读者是 `Python` 专家。显然，需要具备编程知识并对该领域感兴趣。也不需要是`机器学习`专家，但很显然这非常有帮助。假设读者具备基础数学知识（任何理工类学生）。在整个章节中，将简要介绍`机器学习`的重要概念。


    ## 为什么选择 Keras？


    `Keras` 是初学者的推荐库，因为与其他库相比，它的学习曲线非常平缓，目前它是实现`神经网络`的流行中间件之一。


    `Keras` 是一个 `Python` 库，它以简单的方式通过 `TensorFlow`、`Theano` 或 `CNTK` 等其他后端库提供了各种深度学习模型的创建。它由
    `Google` 的工程师 `François Chollet` 开发和维护。


    ## Jupyter notebook


    `Keras` 目前包含在 `Tensorflow` 包中，但也可以作为 `Python` 库使用。对于开始该主题，我认为第二种方案是最合适的，因此我的建议是使用
    `Jupyter`，因为它是一个非常广泛且易于使用的开发环境。


    '
