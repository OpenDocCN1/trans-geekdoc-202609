  trans: '


    在该领域的文献中，当我们发现神经网络具有一个 `input layer`（输入层）、一个或多个由感知器组成的层（称为 `hidden layers` 隐藏层）以及一个包含若干感知器的最终层（称为
    `output layer` 输出层）时，我们称 `Multi-Layer Perceptron`（MLP）。通常，当基于神经网络的模型由多个隐藏层组成时，我们统称为
    `Deep Learning`（深度学习）。在视觉上，可以用以下方案展示：


    ![](img/00030.jpeg)


    `MLPs` 通常用于分类，特别是当类别互斥时，例如数字图像分类（类别从 0 到 9）。在这种情况下，`output layer` 归于一个名为 `softmax`
    的函数，返回属于每个类别的概率。在视觉上，我们可以以以下方式表示：


    ![](img/00031.jpeg)


    正如我们将在第 4 章中介绍的，除了 `sigmoid` 之外还有几种激活函数，每种都有不同的属性。其中之一就是我们提到的 `softmax` 激活函数[116]，它对于展示一个用于多分类分类的简单神经网络示例非常有用。目前，我们可以将
    `softmax` 函数视为 `sigmoid` 函数的推广，它允许我们对两个以上的类别进行分类。


    ## 2.3 Softmax 激活函数


    我们将通过这种方式解决问题：给定一张图像，我们将获得它属于 10 个可能数字中每一个的概率。这样，我们就有了一个模型，例如，它可以预测图像中是数字 9，但只有
    80%的把握是 9。由于该图像中数字底部的笔画，它似乎有 5%的机会变成 8，甚至可能给任何其他数字赋予一定的概率。尽管在特定情况下，我们认为模型的预测结果是
    9，因为它是概率最高的，但这种使用概率分布的方法可以让我们更好地了解自己对预测的有多大把握。这在当前情况下是有用的，因为这些数字是手写的，而且可以肯定，在其中许多数字中，我们无法
    100%确定地识别出数字。


    因此，对于这个 MNIST 分类示例，我们将为每个输入示例获得一个带有对一组互斥标签的概率分布的输出向量。也就是说，一个包含 10 个概率的向量，每个概率对应一个数字，并且这
    10 个概率之和的结果为 1（概率表示在 0 和 1 之间）。


    正如我们已经提到的，这是通过在神经网络中使用带有 `softmax` 激活函数的 `output layer` 实现的，在该 `softmax layer`
    中的每个神经元都取决于该层中所有其他神经元的输出，因为所有神经元的输出之和必须为 1。


    但 `softmax` 激活函数是如何工作的呢？`softmax` 函数基于计算某图像属于特定类别的“证据”，然后将这些证据转换为其属于每个可能类别的概率。


    衡量某图像属于特定类别的证据的方法，是将其每个像素属于该类别的证据进行加权求和。为了解释这个想法，我将使用一个视觉示例。


    假设我们已经学习了识别数字 0 的模型（稍后我们将看到这些模型是如何学习的）。目前，我们可以将模型视为一个包含判断数字是否属于某类信息的“东西”。在这种情况下，对于数字
    0，假设我们有一个如下所示的模型：


    ![](img/00032.jpeg)


    在这种情况下，使用一个 `28×28` 像素的矩阵，其中红色像素（在书的黑白版中为浅灰色）代表负权重（即减少所属证据），而蓝色像素（在书的黑白版中为深灰色）代表正权重（证据越大则增加越多）。黑色代表中性值。


    想象我们在上面画一个零。通常情况下，我们零的笔迹会落在蓝色区域（记住我们讨论的是经过归一化为 `20×20` 像素并随后在 `28×28` 图像上中心的图像）。很明显，如果我们的笔画经过红色区域，那么我们可能不是在写零；因此，使用一种基于通过蓝色区域则加、通过红色区域则减的指标是合理的。


    为了确认这是一个良好的指标，现在让我们想象正在画一个数字 3；很明显，之前用于数字 0 的模型中心，红色区域将惩罚上述指标，因为正如该图左侧所示，在写 3
    时，我们经过了：


    ![](img/00033.jpeg)


    但另一方面，如果参考模型是对应数字 3（如上图右侧所示），我们可以看到，通常情况下代表 3 的各种可能笔迹大部分保留在蓝色区域。


    我希望读者看到这个视觉示例后，已经直觉到上述权重的近似使我们能够估计出数字是多少。


    ![](img/00034.jpeg)


