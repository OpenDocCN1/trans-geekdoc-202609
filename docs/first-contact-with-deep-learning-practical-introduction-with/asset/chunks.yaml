- raw: 'An example of what will be on the market in a short while, is a part of the
    current Supercomputer Marenostrum of the Barcelona Supercomputing Center (BSC).
    MareNostrum is the generic name used by the BSC to refer to the different updates
    of its most emblematic and the most powerful supercomputer in Spain, and until
    today four versions have been installed since 2004[\[30\]](#part0000_split_065.html#_ftn30).
    At present, the Marenustrum is the most heterogeneous supercomputer in the world,
    with all kinds of experimental hardware available on the market, since its purpose
    is to serve as an experimental platform to design future supercomputers.


    This is structured in that the calculation capacity of the current MareNostrum
    4 is divided into two parts of totally differentiated hardware: a block of general
    purpose and a block of emerging technologies. The emerging technologies block
    is made up of clusters of three different technologies that will be incorporated
    and updated as they become available. These are technologies that are currently
    being developed in the United States and Japan to accelerate the arrival of the
    new generation of pre-exascale supercomputers.


    One of these technologies is based on an IBM system designed especially for Deep
    Learning and Artificial Intelligence applications[\[31\]](#part0000_split_065.html#_ftn31);
    IBM has created all the software stack necessary for it. At the time of writing
    this book, the hardware is available and the PowerAI[\[32\]](#part0000_split_065.html#_ftn32)
    software package will soon be installed, which will convert this supercomputing
    hardware into a machine specially designed for Artificial Intelligence. Through
    this software, the main frameworks of Deep Learning such as TensorFlow (and Keras,
    included in the Tensorflow package), Caffe, Chainer, Torch and Theano will be
    available to researchers of Artificial Intelligence.


    In terms of hardware, this part of the Marenostrum consists of a 54 node cluster
    based on IBM POWER9 and NVIDIA V100 with Linux operating system and interconnected
    by an infiniband network at 100 Gigabits per second. Each node is equipped with
    2 IBM POWER9 processors that have 20 physical cores each and 512GB of memory.
    Each of these POWER9 processors are connected to two NVIDIA V100 (Volta) GPUs
    with 16GB of memory, a total of 4 GPUs per node. See the following picture:


    ![](images/00015.jpeg)


    The new NVIDIA V100 GPUs are the most advanced GPUs yet[\[33\]](#part0000_split_065.html#_ftn33)
    to accelerate Artificial Intelligence applications equivalent to 100 CPUs according
    to NVIDIA[\[34\]](#part0000_split_065.html#_ftn34). This is achieved by matching
    their CUDA cores with 640 core tensor, which did not have the previous family
    of GPU Pascal from NVIDIA. The core tensor is specifically designed to multiply
    two matrices of 4×4 elements in floating point format and also allows the accumulation
    of a third matrix, thus being able to execute very quickly the basic operations
    of neural networks both in the inference phase and training phase.


    In addition, this new version of GPU updates the bus with NVLINK 2.0[\[35\]](#part0000_split_065.html#_ftn35) 
    system that allows a high bandwidth with six links that can transfer 50 Gigabytes
    per second. Although traditionally the NVLINK bus was originally designed to connect
    the GPUs, this version also makes it possible to connect GPU and CPU. Another
    important element is access to memory, which has improved compared to previous
    versions and allows bandwidths of up to 900 GigaBytes per second. Something awesome!.


    I describe all this detail so that it does not surprise you that with only 3 racks
    of the current Marenostrum[\[36\]](#part0000_split_065.html#_ftn36) (the ones
    seen in the following picture) there is 1.5 Petaflops of theoretical maximum performance,
    much more than the 1.1 Petaflops that in 2012, the Marenostrum 3 had, in 36 racks
    (shown in the previous photo in page 30).


    ![](images/00016.jpeg)


    In summary, it is not my intention to give you a computer architecture class,
    but I would like to explain and make you aware, with real examples close to us,
    that the computing capacity is exponentially evolved. And it has allowed us ,
    as I said before, to try new ideas or to extend the old ones, since many of the
    advances in the Deep Learning area since 2012 have been guided by the experimental
    findings with hardware equivalent to the one that was being used in the world
    of supercomputing.


    However, without any doubt, other factors have contributed to trigger the resurgence
    of Artificial Intelligence, and I must be fair and say that it is not only due
    to Supercomputing. If I asked you one of the other key factors, the Big Data phenomenon
    comes to mind as another of the facilitators of the resurgence of this new stage
    of Artificial Intelligence. But there are others that perhaps the reader is not
    so familiar with . In the next chapter we will present them.


    # 1       A new disruptive technology is coming


    Artificial intelligence is being considered as the new industrial revolution,
    heart of what some call industry 4.0. Well, Deep Learning is the engine of this
    process and in the following chapters we will talk about it extensively. But in
    this chapter we will situate the issue first, to see why artificial intelligence
    is already here and why it has come to stay.


    ## 1.1        Artificial Intelligence is changing our life


    We are facing dizzying advances in the quality and device features of a wide range
    of everyday technologies: in the case of speech recognition, voice-to-text transcription
    has experienced incredible advances and is now available in different devices.
    We are interacting more and more with our computers (and all kinds of devices)
    by simply talking to them.


    There have also been spectacular advances in natural language processing. For
    example, just by clicking on the Google Translate[\[37\]](#part0000_split_065.html#_ftn37)
    micro icon (at the bottom left of the text box), the system transcribes into another
    language what is being dictated. Google Translate already allows you to convert
    sentences from one language to another in 32 language pairs, and offers text translation
    for more than 100.


    In turn, the advances in computer vision are also enormous: now our computers,
    for example, can recognize images and generate textual descriptions of their content
    in seconds.


    These three areas are crucial to unleash the improvements in robotics, drones
    or cars without driver, among many others areas. Artificial Intelligence is at
    the heart of all this technological innovation, which lately advances so quickly
    thanks to Deep Learning.


    And all this despite the fact that artificial intelligence has not yet been widely
    deployed and it is difficult to get an idea of the great impact it will have,
    just as in 1995 it was difficult to imagine the future impact of the internet.
    Back then, most people did not see how the internet would end up being as relevant
    to them and how it was going to change their lives.


    It is said that the first industrial revolution used steam energy to mechanize
    production in the second half of the 18th century; the second revolution used
    electricity to boost mass production in the mid-nineteenth century while, in the
    third one, electronics and software were used in the seventies of the last century.
    Today we are facing a new source of value creation in the area of information
    processing where everything will change. In different forums, people already talk
    about a fourth industrial revolution, marked by technological advances such as
    Artificial Intelligence (Machine Learning, Deep Learning, etc.) and in which computers
    will be "even wiser".


    ## 1.2        Artificial Intelligence, Machine Learning and Deep Learning


    Before continuing we will specify a bit what we understand by Artificial Intelligence,
    Machine Learning and Deep Learning, three terms that will appear very often throughout
    the book.  '
