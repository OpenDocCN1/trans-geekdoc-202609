- raw: "But ImageNet is only one of the available databases that have been used to\
    \ train Deep Learning networks lately; many others have been popular, such as:\
    \ MNIST[\\[46\\]](#part0000_split_065.html#_ftn46), STL[\\[47\\]](#part0000_split_065.html#_ftn47),\
    \ COCO[\\[48\\]](#part0000_split_065.html#_ftn48), Open Images[\\[49\\]](#part0000_split_065.html#_ftn49),\
    \ Visual Question Answering[\\[50\\]](#part0000_split_065.html#_ftn50), SVHN[\\\
    [51\\]](#part0000_split_065.html#_ftn51), CIFAR-10/100[\\[52\\]](#part0000_split_065.html#_ftn52),\
    \ Fashion-MNIST[\\[53\\]](#part0000_split_065.html#_ftn53), IMDB Reviews[\\[54\\\
    ]](#part0000_split_065.html#_ftn54), Twenty Newsgroups[\\[55\\]](#part0000_split_065.html#_ftn55),\
    \ Reuters-21578[\\[56\\]](#part0000_split_065.html#_ftn56), WordNet[\\[57\\]](#part0000_split_065.html#_ftn57),\
    \ Yelp Reviews[\\[58\\]](#part0000_split_065.html#_ftn58), Wikipedia Corpus[\\\
    [59\\]](#part0000_split_065.html#_ftn59), Blog Authorship Corpus[\\[60\\]](#part0000_split_065.html#_ftn60),\
    \ Machine Translation of European Languages[\\[61\\]](#part0000_split_065.html#_ftn61),\
    \ Free Spoken Digit Dataset[\\[62\\]](#part0000_split_065.html#_ftn62), Free Music\
    \ Archive[\\[63\\]](#part0000_split_065.html#_ftn63), Ballroom[\\[64\\]](#part0000_split_065.html#_ftn64),\
    \ The Million Song[\\[65\\]](#part0000_split_065.html#_ftn65), LibriSpeech[\\\
    [66\\]](#part0000_split_065.html#_ftn66), VoxCeleb[\\[67\\]](#part0000_split_065.html#_ftn67),\
    \ The Boston Housing[\\[68\\]](#part0000_split_065.html#_ftn68), Pascal[\\[69\\\
    ]](#part0000_split_065.html#_ftn69) , CVPPP Plant Leaf Segmentation[\\[70\\]](#part0000_split_065.html#_ftn70),\
    \ Cityscapes[\\[71\\]](#part0000_split_065.html#_ftn71). \n\nIt is also important\
    \ to mention here Kaggle[\\[72\\]](#part0000_split_065.html#_ftn72), a platform\
    \ that hosts competitions of data analysis where companies and researchers contribute\
    \ and share their data while data engineers from around the world compete to create\
    \ the best prediction or classification models.\n\n### Entering into an era of\
    \ computation democratization\n\nHowever, what happens if you do not have this\
    \ computing capacity in your company? Artificial Intelligence has until now been\
    \ mainly the toy of big technology companies like Amazon, Baidu, Google or Microsoft,\
    \ as well as some new companies that had these capabilities. For many other businesses\
    \ and parts of the economy, artificial intelligence systems have so far been too\
    \ expensive and too difficult to fully implement the hardware and software required.\
    \ \n\nBut now we are entering another era of democratization of computing, and\
    \ companies can have access to large data processing centers of more than 28,000\
    \ square meters (four times the field of Barcelona football club (Barça)), with\
    \ hundreds of thousands of servers inside. We are talking about Cloud Computing[\\\
    [73\\]](#part0000_split_065.html#_ftn73).\n\nCloud Computing has revolutionized\
    \ the industry through the democratization of computing and has completely changed\
    \ the way business operates. And now it is time to change the scenario of Artificial\
    \ Intelligence and Deep Learning, offering a great opportunity for small and medium\
    \ enterprises that cannot build this type of infrastructure, although Cloud Computing\
    \ can offer it to them; in fact, it offers access to a computing capacity that\
    \ previously was only available to large organizations or governments.\n\nBesides,\
    \ Cloud providers are now offering what is known as Artificial Intelligence algorithms\
    \ as a Service (AI-as-a-Service), Artificial Intelligence services through Cloud\
    \ that can be intertwined and work together with internal applications of companies\
    \ through simple protocols based on API REST[\\[74\\]](#part0000_split_065.html#_ftn74).\n\
    \nThis implies that it is available to almost everyone, since it is a service\
    \ that is only paid for the time used. This is disruptive, because right now it\
    \ allows software developers to use and put virtually any artificial intelligence\
    \ algorithm into production in a heartbeat.\n\nAmazon, Microsoft, Google and IBM\
    \ are leading this wave of AIaaS services, are put into production quickly from\
    \ the initial stages (training).  At the time of writing  this book, Amazon AIaaS\
    \ was available at two levels: predictive analytics with Amazon Machine Learning[\\\
    [75\\]](#part0000_split_065.html#_ftn75)  and the SageMaker[\\[76\\]](#part0000_split_065.html#_ftn76)\
    \ tool for rapid model building and deployment. Microsoft offers its services\
    \ through its Azure Machine Learning which can be divided into two main categories\
    \ as well: Azure Machine Learning Studio[\\[77\\]](#part0000_split_065.html#_ftn77)\
    \ and Azure Intelligence Gallery[\\[78\\]](#part0000_split_065.html#_ftn78). Google\
    \ offers Prediction API[\\[79\\]](#part0000_split_065.html#_ftn79)  and the Google\
    \ ML Engine[\\[80\\]](#part0000_split_065.html#_ftn80).  IBM offers AIaaS services\
    \ through its Watson Analytics[\\[81\\]](#part0000_split_065.html#_ftn81). And\
    \ let's not forget solutions that already come from startups, like PredicSis[\\\
    [82\\]](#part0000_split_065.html#_ftn82) or BigML[\\[83\\]](#part0000_split_065.html#_ftn83).\n\
    \nUndoubtedly, Artificial Intelligence will lead the next revolution. Its success\
    \ will depend to a large extent on the creativity of the companies and not so\
    \ much on the hardware technology, in part thanks to Cloud Computing.\n\n### An\
    \ open-source world for the Deep Learning community\n\nSome years ago, Deep Learning\
    \ required experience in languages such as C++ and CUDA; Nowadays, basic Python\
    \ skills are enough. This has been possible thanks to the large number of open\
    \ source software frameworks that have been appearing, such as Keras, central\
    \ to our book. These frameworks greatly facilitate the creation and training of\
    \ the models and allow abstracting the peculiarities of the hardware to the algorithm\
    \ designer to accelerate the training processes.\n\nThe most popular at the moment\
    \ are TensorFlow, Keras and PyTorch, because they are the most dynamic at this\
    \ time if we rely on the contributors and commits or stars of these projects on\
    \ GitHub[\\[84\\]](#part0000_split_065.html#_ftn84). \n\nIn particular, TensorFlow\
    \ has recently taken a lot of impulse and is undoubtedly the dominant one. It\
    \ was originally developed by researchers and engineers from the Google Brain\
    \ group at Google. The system was designed to facilitate Machine Learning research\
    \ and make the transition from a research prototype to a production system faster.\
    \ If we look at the Gihub page of the project[\\[85\\]](#part0000_split_065.html#_ftn85)\
    \ we will see that they have, at the time of writing this book, more than 35,000\
    \ commits, more than 1500 contributors and more than 100,000 stars. Not despicable\
    \ at all. \n\nTensorFlow is followed by Keras[\\[86\\]](#part0000_split_065.html#_ftn86),\
    \ a high level API for neural networks, which makes it the perfect environment\
    \ to get started on the subject. The code is specified in Python, and at the moment\
    \ it is able to run on top of three outstanding environments: TensorFlow, CNTK\
    \ or Theano. Keras has more than 4500 commits, more than 700 contributors and\
    \ more than 30,000 stars[\\[87\\]](#part0000_split_065.html#_ftn87).\n\nPyTorch\
    \ and Torch[\\[88\\]](#part0000_split_065.html#_ftn88) are two Machine Learning\
    \ environments implemented in C, using OpenMP[\\[89\\]](#part0000_split_065.html#_ftn89)\
    \ and CUDA to take advantage of highly parallel infrastructures. PyTorch is the\
    \ most focused version for Deep Learning and based on Python, developed by Facebook.\
    \ It is a popular environment in this field of research since it allows a lot\
    \ of flexibility in the construction of neural networks and has dynamic tensors,\
    \ among other things. At the time of writing this book, Pytorch has more than\
    \ 12,000 commits, around 650 contributors and more than 17,000 stars[\\[90\\]](#part0000_split_065.html#_ftn90)."
