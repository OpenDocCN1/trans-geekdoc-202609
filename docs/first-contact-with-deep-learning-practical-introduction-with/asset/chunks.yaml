  trans: '

    特别感谢 UPC 的一位同事也是我的好朋友 `Xavier Giró-i-Nieto`。Xavier 是灵感和知识的无尽源泉，我与他共同指导 `Míriam
    Bellver` 和 `Victor Campos` 的博士论文，对于我在这些课题以及本书的内容上获得的知识，我也向他们表示深表感谢。我也不想忘记其他像 `Xisco
    Sastre` 这样的学生，他的硕士毕业论文也涉及这些概念，这对我的学习是巨大的刺激。他的研究结果产出了几篇学术文章，我在书中使用了其中的一些图表。


    在该领域有许多我个人并不认识的专家，他们在撰写期间也曾为我提供过帮助，使我能够分享他们的观点；因此，我在相应的章节中详细列出了这些来源，这更多是为了表达谢意，而不是为了让读者去查阅。


    在所有激发我灵感的专家中，我必须特别提到 `François Chollet`，他是 Google 研究员和 `Keras` 的创建者，我有幸与他面面。这本书是在
    François 出版他的书籍《Deep Learning with Python》后编写的，这本书对我产生了极大的帮助和启发。


    我最诚挚地感谢所有部分或全部阅读过本书不同草稿的人：`Bernat Torres` (`SOMmobilitat`)、`Fernando García Sedano`
    (`Grupsa`)、`Jordi Morera` (`UPCnet`)、`Guifré Ballester` (`UPCnet`)、`Sergi Sales`
    (`UPCnet`)，他们向我提供了有趣的评论，并已包含在你手中的这个版本中。


    我非常感谢我的大学——`加泰罗尼亚理工大学 - UPC Barcelona Tech`，特别感谢 `Agustín Fernández Jiménez`，他是
    `UPC` 的数字化转型副校长，他为本作品撰写了序言并对终稿进行了详细审读。`UPC` 是我能够对这些课题进行研究并积累我想要在这里分享的知识的工作环境。这所大学还允许我在
    `Facultat d''Informàtica de Barcelona` (`FIB`) 给一些才华横溢的学生授课，他们鼓励我写这样的书。


    正如我在书开头提到的，我感谢像 `Ricard Gavaldà` 或 `Jordi Nin` 这样的研究人员，是多年前唤醒了我对这些主题的兴趣。还有其他人，例如
    `Rubèn Tous` 或 `Joan Capdevila`，他们在我进入这一领域的初阶段陪伴着我。


    非常感谢研究中心 `巴塞罗尼亚超级计算中心 - 国家计算中心` (`BSC`)，特别是它的主管 `Mateo Valero` 和 `Josep M. Martorell`，以及计算机科学系的主任
    `Jesús Labarta` 和 `Eduard Ayguadé`，他们一直允许并支持我这种对未来技术“侧耳”（parant l''orella）的痴迷。


    在本书的推广过程中，感谢 `FIB Alumni`、`加泰罗尼亚计算机工程师协会` (`COEINF`) 以及技术信息门户网站 `TECNONEWS` 的支持。还要感谢
    `Katy Wallace` 帮助我为编辑这本作品的丛书命名。


    我最感谢我们的研究小组 `Autonomic Systems and eBusiness Platforms`，他们在小组开展的项目中所付出的努力：`Adrià
    Correas`、`Carla Sauvanaud`、`Cesare Cugnasco`、`Eloy Gil`、`Enric Sosa`、`Fabrizio
    Pistagna`、`Joan Capdevila`、`Jordi Guitart`、`Juan Luís Dominguez`、`Maurici Yagues`、`Miriam
    Bellver`、`Paola Pardo`、`Pol Santamaria`、`Victor Campos` 和 `Yolanda Becerra`。


    感谢我 2018 学年和我分享了本书西班牙语版的学生，那些我称他们“cap problema”（或英语中的“no problem”）的人：`Martín Acosta`、`Alessio
    Addimando`、`John Jairo Ballestas`、`Andrés Bermudez`、`Gabriel Cantos`、`Robert Carausu`、`Víctor
    Chamizo`、`Juan de los Reyes`、`Francesc`、`de Puig`、`Pau Figueras`、`Rafa Genés`、`Beñat
    Jimenez`、`Miquel Lara`、`Gil Laroussi`、`Tito Leiva`、`Irene Lopez`、`Eduardo Rodríguez`、`Isabel
    Samaniego`、`Marc Tula`、`Javier Vasquez`、`Marc Vila` 和 `Jonathan Zarama`。感谢大家！


    最后，诚心感谢 `Nuria Rodríguez`、`Donnalee Shucan`、`Anna Llibre` 和 `Katy Wallace` 对本书进行的严谨英语校对。


    # 关于作者


    `加泰罗尼亚理工大学 Barcelona Tech` 教授，在高性能计算的教学和研究方面拥有 30 年经验，并在公司和机构拥有重要的科学出版物和研发项目。


    他的创业精神使他将这些系统应用于 `Big Data` 的高级分析，目前他的研究侧重于应用于通用的 `人工智能` 尤其是 `深度学习` 领域的超级计算，在该领域他正在共同指导三篇博士论文。他的研究已发表在该领域的主要论坛上，包括`国际学习表示会议`
    (`ICLR 2018`) 以及 `计算机视觉与模式识别` (`CVPR 2017`, `2018`) 和 `神经信息处理系统` (`NIPS 2016`,
    `2017`) 的工作坊。在这些出版物，他与来自 `UPC`、哥伦比亚大学、`Google` 和 `Facebook` 的研究人员合作过。


    自成立以来，他一直在`巴塞罗尼亚超级计算中心`领导一个研究小组。他对新技术充满好奇和热情。近年来，他参与了各项活动，为应对这些新技术所代表的新挑战战略做出贡献。目前他是
    `iThinkUPC` & `UPCnet` 的董事成员，并担任各类机构和公司的培训师、导师和专家；此外他还写了几本技术书籍，并与不同的媒体、广播和电视合作。他从
    2006 年开始维护博客。您可以通过 `https://www.JordiTorres.org` 找到更多信息。

    '
