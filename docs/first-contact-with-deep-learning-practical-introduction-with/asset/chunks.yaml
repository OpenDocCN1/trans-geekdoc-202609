    ## Introduction to Deep Learning


    As the title suggests, this book is only intended to be a practical introduction
    to `Deep Learning`, currently one of the most active areas in the field of `Artificial
    Intelligence`. It is not meant as an exhaustive treatise on the subject. This
    book is aimed at the reader who has knowledge in programming but has not yet had
    the opportunity to start these new key concepts in computing, and wants to discover
    some of the possibilities and more cutting-edge aspects of this technology.


    I advise you that the book will be an invitation to use your computer keyboard
    while you are learning: we call it "to learn by doing", and from my experience
    as a professor at the `UPC`, it is an approach that works very well with engineers
    that want to take a quick look at a new technology.

