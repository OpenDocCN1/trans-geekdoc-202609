  trans: '

    但 ImageNet 并不是最近用于训练深度学习网络的可用数据库之一；许多其他数据库流行，例如：MNIST、STL、COCO、Open Images、Visual
    Question Answering、SVHN、CIFAR-10/100、Fashion-MNIST、IMDB Reviews、Twenty Newsgroups、Reuters-21578、WordNet、Yelp
    Reviews、Wikipedia Corpus、Blog Authorship Corpus、欧洲语言机器翻译、Free Spoken Digit Dataset、Free
    Music Archive、Ballroom、The Million Song、LibriSpeech、VoxCeleb、The Boston Housing、Pascal、CVPPP
    Plant Leaf Segmentation、Cityscapes。


    在这里也有提到 Kaggle，这是一个托管数据分析竞赛的平台，公司和人员在此贡献并共享数据，而来自世界的数据工程师竞争创建最好的预测或分类模型。


    ## 进入计算民主化时代


    然而，如果你的公司没有这种计算能力会怎样？到目前为止，人工智能主要是亚马逊、百度、谷歌或微软等科技巨头以及一些拥有这些能力的新兴公司的玩具。对于许多其他企业和经济部门来说，目前人工智能系统仍然昂贵，且难以完全实施所需的硬件和软件。


    但现在我们正在进入另一个计算民主化时代，公司可以访问面积超过 28,000 平方米的大数据处理中心（巴塞罗那足球场的四倍），内部有数十万台服务器。我们谈论的是云计算。


    云计算通过计算民主化彻底改变了行业，并完全改变了业务运营的方式。现在是时候改变人工智能和深度学习的场景了，为无法构建此类基础设施的中小型企业提供了巨大机会，尽管云计算可以为他们提供这些；事实上，它提供了以前只有大型组织或政府才能拥有的计算能力。


    此外，云提供商现在提供所谓的“人工智能即服务”（AI-as-a-Service），即通过云提供的人工智能服务可以通过基于 `API REST` 的简单协议与公司的内部应用程序交织并协同工作。


    这意味着几乎对所有人都是可用的，因为这是一种按使用时间付费的服务。这是颠覆性的，因为现在它允许软件开发人员使用并将几乎任何人工智能算法投入生产。


    亚马逊、微软、谷歌和 IBM 正在引领这波浪潮。在写本书时，`SageMaker`、`Azure Studio`、`Azure Gallery`、`Google
    API`、`Google Engine`、`Watson Analytics` 和 `Gihub` 是关键。如果我们查看该项目的 Gihub 页面，我们会看到在写本书时，他们有许多提交、贡献者和星标。成功在很大程度上取决于公司的创造力。


    毫无疑问，人工智能将引领下一次革命。它的成功在很大程度上取决于公司的创造力，而不是仅仅取决于硬件，而且不要忘记那些已经来自初创公司的解决方案，如 `PredicSis`
    或 `BigML`。


    ## 深度学习的开源世界


    几年前，深度学习需要 `C++` 和 `CUDA` 等语言的经验；如今，基本的 Python 技能就足够了。这归功于大量出现的开源框架，例如本书的核心 `Keras`。


    目前最流行的是 `TensorFlow`、`Keras` 和 `PyTorch`，因为它们是目前是最活跃的。


    特别是 `TensorFlow` 最近获得了巨大的动力，毫无疑问是主导性的。它最初由 Google Brain 团队的研究人员和工程师开发。该系统的设计初目的是促进机器学习研究，并加快从研究原型到生产系统的过渡。如果我们查看该项目的
    Gihub 页面，我们会看到在写本书时，他们有超过 35,000 次提交、1500 名贡献者和 100,000 个星标。


    紧随其后的是 `Keras`，这是一个神经网络的高级 API，使其成为学习该主题的完美环境。代码使用 Python 规范，目前它能够运行在三个优秀环境之上：`TensorFlow`、`CNTK`
    或 `Theano`。`Keras` 有超过 4500 次提交、超过 700 名贡献者和超过 30,000 个星标。


    `PyTorch` 和 `Torch` 是两个用 C 实现的机器学习环境，使用 `OpenMP` 和 `CUDA` 来利用高度并行的基础设施。`PyTorch`
    是最专注于深度学习的版本，基于 Python，由 Facebook 开发。它是该研究领域中非常受欢迎的环境，因为它在构建神经网络方面提供了很大的灵活性，并且具有动态张量等特性。在写本书时，`Pytorch`
    有超过 12,000 次提交，大约 650 名贡献者和超过 17,000 个星标。

    '
