    Finally, and although it is not an exclusive environment of Deep Learning, it
    is important to mention `Scikit-learn`, that is used very often in the Deep Learning
    community for the preprocessing of data. `Scikit-learn` has more than 22500 commits,
    more than 1000 contributors and nearly 30,000 stars.


    But as we have already advanced, there are many other frameworks oriented to Deep
    Learning. Those that we would highlight are `Theano` (Montreal Institute of Learning
    Algorithms), `Caffe` (University de Berkeley), `Caffe2` (Facebook Research), `CNTK`
    (Microsoft), `MXNET` (supported by Amazon among others), `Deeplearning4j`, `Chainer`,
    `DIGITS` (Nvidia), `Kaldi`, `Lasagne`, `Leaf`, `MatConvNet`, `OpenDeep`, `Minerva`
    and `SoooA`, among many others.


    ### An open-publication ethic


    In the last few years, in this area of research, in contrast to other scientific
    fields, a culture of open publication has been generated, in which many researchers
    publish their results immediately (without waiting for the approval of the peer
    review usual in conferences) in databases such as arxiv.org of Cornell University
    (arXiv). This implies that there are numerous softwares available in open source
    associated with these articles, which allow this field of research to move tremendously
    quickly, since any new discovery is immediately available for the whole community
    to see it and, if it is the case, build on top a new proposal.


    This is a great opportunity for users of these techniques. The reasons for research
    groups to openly publishing their latest advances can be diverse. For example,
    articles rejected in main conferences in the area can propagate solely as a preprint
    on `arxiv`. This is the case of one key paper for the advancement of Deep Learning
    written by G. Hinton, N. Srivastava, A. Krizhevsky, I. Sutskever and R. Salakhutdinov
    that introduced `Dropout` mechanism. This paper was rejected from NIPS in 2012.


    Or Google, when publishing the results, consolidates its reputation as a leader
    in the sector, attracting the next wave of talent, which is one of the main obstacles
    to the advancement of the topic.


    ### Advances in algorithms


    Thanks to the improvement of the hardware that we have already presented and having
    more computing capacity by the scientists who were researching in the area, it
    has been possible to advance dramatically in the design of new algorithms. For
    example, not many years ago it was very difficult to train multilayer networks
    from algorithm point. But in this last decade there have been impressive advances
    with activation functions, use of pre-trained networks, improvements in optimization.
    Today, algorithmically speaking, we can train models of hundreds of layers without
    any problem.


    ### Densely Connected Networks


    In the same way that you start programming in a new language there is a tradition
    of doing `Hello World`, in Deep Learning you start by creating model. Through
    this example, this chapter will present some basic concepts, reducing theoretical
    concepts as much as possible, with the aim of offering the reader a global view
    of a specific case to facilitate the reading of subsequent chapters where different
    topics will be dealt with more detail.


