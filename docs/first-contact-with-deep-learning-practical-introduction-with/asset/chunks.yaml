  fmt: '

    Remember that a neural network is made up of neurons connected to each other;
    at the same time, each connection of our neural network is associated with a weight
    that dictates the importance of this relationship in the neuron when multiplied
    by the input value.


    Each neuron has an activation function that defines the output of the neuron.
    The activation function is used to introduce non-linearity in the modeling capabilities
    of the network. We have several options for activation functions that we will
    present in this chapter.


    Training our neural network, that is, learning the values of our parameters (weights
    `wij` and `bj` biases) is the most genuine part of Deep Learning and we can see
    this learning process in a neural network as an iterative process of "going and
    return" by the layers of neurons. The "going" is a forwardpropagation of the information
    and the "return" is a backpropagation of the information.


    The first phase forwardpropagation occurs when the network is exposed to the training
    data and these cross the entire neural network for their predictions (labels)
    to be calculated. That is, passing the input data through the network in such
    a way that all the neurons apply their transformation to the information they
    receive from the neurons of the previous layer and sending it to the neurons of
    the next layer. When the data has crossed all the layers, and all its neurons
    have made their calculations, the final layer will be reached with a result of
    label prediction for those input examples.


    Next, we will use a loss function to estimate the loss (or error) and to compare
    and measure how good/bad our prediction result was in relation to the correct
    result (remember that we are in a supervised learning environment and we have
    the label that tells us the expected value). Ideally, we want our cost to be zero,
    that is, without divergence between estimated and expected value. Therefore, as
    the model is being trained, the weights of the interconnections of the neurons
    will be gradually adjusted until good predictions are obtained.


    Once the loss has been calculated, this information is propagated backwards. Hence,
    its name: backpropagation. Starting from the output layer, that loss information
    propagates to all the neurons in the hidden layer that contribute directly to
    the output. However, the neurons of the hidden layer only receive a fraction of
    the total signal of the loss, based on the relative contribution that each neuron
    has contributed to the original output. This process is repeated, layer by layer,
    until all the neurons in the network have received a loss signal that describes
    their relative contribution to the total loss.


    Visually, we can summarize what we have explained with this visual scheme of the
    stages:


    ![](images/00040.jpeg)


    Now that we have spread this information back, we can adjust the weights of connections
    between neurons. What we are doing is making the loss as close as possible to
    zero the next time we go back to using the network for a prediction. For this,
    we will use a technique called gradient descent. This technique changes the weights
    in small increments with the help of the calculation of the derivative (or gradient)
    of the loss function, which allows us to see in which direction "to descend" towards
    the global minimum; this is done in general in batches of data in the successive
    iterations (epochs) of all the dataset that we pass to the network in each iteration.


    To recap, the learning algorithm consists of:


    1. Start with values (often random) for the network parameters (`wij` weights
    and `bj` biases)

    2. Take a set of examples of input data and pass them through the network to obtain
    their prediction.

    3. Compare these predictions obtained with the values of expected labels and calculate
    the loss with them.

    4. Perform the backpropagation in order to propagate this loss to each and every
    one of the parameters that make up the model of the neural network.

    5. Use this propagated information to update the parameters of the neural network
    with the gradient descent in a way that the total loss is reduced and a better
    model is obtained.

    6. Continue iterating in the previous steps until we consider we have a good model.


    Returning to the figure, which visually summarizes the stages would be reflected
    in this way:


    ![](images/0041.jpeg)


    ## 4.2 Activation functions


    Remember that we use activation functions to propagate the output of a neuron.
    This output is received by the next layer. As we have said, the activation function
    serves to introduce non-linearity in modeling capabilities. Below we will list
    the most used; we can find more information on them on the website.


    ### Linear

    The linear activation function is basically the identity function in which, in
    practical terms, it means the signal does not change.


    ![](images/00042.jpeg)


    ### Sigmoid

    The sigmoid function has already been introduced in chapter 2. Its interest lies
    in the fact that it converts independent variables of almost infinite range into
    simple probabilities between 0 and 1. Most of its output will be very close to
    0 or 1.


    ![](images/00027.jpeg)


    ### Tanh

    Without going into detail, we can summarize that the tanh represents the relationship
    between the hyperbolic sine and hyperbolic cosine: `tanh(x) = sinh(x)/cosh(x)`.
    Unlike the sigmoid function, the normalized range of tanh is between -1 and 1,
    which is the input that goes well with some neural networks. The advantage of
    tanh is that negative numbers can be dealt with more easily.


    ![](images/00043.jpeg)


    ### Softmax

    The softmax activation function was also presented in chapter 2 to generalize
    the logistic regression, insofar as instead of classifying in binary it can contain
    decision limits. As we have seen, the softmax activation function will often be
    found in the output layer of a neural network and return the probability distribution
    over mutually exclusive classes.


    ### ReLU

    The activation function rectified linear unit (`ReLU`) is a very interesting transformation
    that activates a single node if the input is above a certain threshold. The default
    and more usual behavior is that as long as the input has a value below zero, the
    output will be zero but, when the input rises above, the output is a linear relationship
    with the input of the form `f(x) = x`. The `ReLU` activation function has proven
    to work in many different situations and is currently widely used.


    ![](images/00044.jpeg)


    ## 4.3 Backpropagation components


    In summary, we can consider backpropagation as a method to alter the parameters
    (weights and biases) of the neural network in the right direction. It starts by
    calculating the loss term first, and then the parameters of the neural network
    are adjusted in reverse order with an optimization algorithm taking into account
    this calculated loss.


    Remember that in Keras the `compile()` method allows us to define how we want
    the components that are involved in the learning process to be:


    ```python

    model.compile(loss=''categorical_crossentropy'', optimizer=''sgd'', metrics=[''accuracy''])

    ```

