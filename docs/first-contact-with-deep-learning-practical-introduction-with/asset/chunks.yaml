    \ 0   0   0   0\\]\\]\n\nOn the other hand, remember that we have the labels,\
    \ which in our case are numbers between 0 and 9 that indicate which digit the\
    \ image represents, that is, to which class it is associated. In this example,\
    \ we will represent each label with a vector of 10 positions, where the position\
    \ corresponding to the digit that represents the image contains a 1 and the rest\
    \ contains 0s. This process of transforming the labels into a vector of as many\
    \ zeros as the number of different labels, and putting a 1 in the index corresponding\
    \ to the label, is known as one-hot encoding.\n\n## 2.2        Perceptron\n\n\
    Before moving forward, a brief intuitive explanation of how a single neuron works\
    \ to fulfill its purpose of learning from the training dataset can be helpful\
    \ for the reader. Let's look at a very simple example to illustrate how an artificial\
    \ neuron can learn.\n\n### Regression algorithms\n\nBased on what has been explained\
    \ in the previous chapter, let us make a brief reminder about classic Machine\
    \ Learning regression and classification algorithms since they are the starting\
    \ point of our Deep Learning explanations.\n\nWe could say that regression algorithms\
    \ model the relationship between different input variables (features) using a\
    \ measure of error, the loss, which will be minimized in an iterative process\
    \ in order to make predictions \"as accurate as possible\". We will talk about\
    \ two types: logistic regression and linear regression.\n\nThe main difference\
    \ between logistic and linear regression is in the type of output of the models;\
    \ when our output is discrete, we talk about logistic regression, and when the\
    \ output is continuous we talk about linear regression.\n\nFollowing the definitions\
    \ introduced in the first chapter, logistic regression is an algorithm with supervised\
    \ learning and is used to classify. The example that we will use next, which consists\
    \ of identifying which class each input example belongs to by assigning a discrete\
    \ value of type 0 or 1, is a binary classification.\n\n### A plain artificial\
    \ neuron\n\nIn order to show how a basic neuronal is, let's suppose a simple example\
    \ where we have a set of points in a two-dimensional plane and each point is already\
    \ labeled \"square\" or \"circle\": \n\n![](images/00022.jpeg)\n\nGiven a new\
    \ point \"X\", we want to know what label corresponds to it:\n\n![](images/00023.jpeg)\n\
    \nA common approach is to draw a line that separates the two groups and use this\
    \ line as a classifier:\n\n![](images/00024.jpeg)\n\nIn this case, the input data\
    \ will be represented by vectors of the form (x1, x2) that indicate their coordinates\
    \ in this two-dimensional space, and our function will return '0' or '1' (above\
    \ or below the line) to know if it should be classified as \"square\" or \"circle\"\
    . As we have seen, it is a case of linear regression, where \"the line\" (the\
    \ classifier) following the notation presented in chapter 1 can be defined by:\n\
    \ny= w1x1\\+ w2x2+b\n\nMore generally, we can express the line as:\n\ny = W \\\
    * X + b\n\nTo classify input elements X, which in our case are two-dimensional,\
    \ we must learn a vector of weight W of the same dimension as the input vectors,\
    \ that is, the vector (w1, w2) and a b bias. \n\nWith these calculated values,\
    \ we can now construct an artificial neuron to classify a new element X. Basically,\
    \ the neuron applies this vector W of calculated weights on the values in each\
    \ dimension of the input element X, and at the end adds the bias b. The result\
    \ of this will be passed through a non-linear \"activation\" function to produce\
    \ a result of '0' or '1'. The function of this artificial neuron that we have\
    \ just defined can be expressed in a more formal way such as:\n\n![](images/00025.jpeg)\n\
    \nNow, we will need a function that applies a transformation to variable z so\
    \ that it becomes '0' or '1'. Although there are several functions (which we will\
    \ call \"activation functions\" as we will see in chapter 4), for this example\
    \ we will use one known as a sigmoid[\\[114\\]](#part0000_split_065.html#_ftn114)\
    \ function that returns an actual output value between 0 and 1 for any input value:\n\
    \n![](images/00026.jpeg)\n\nIf we analyze the previous formula, we can see that\
    \ it always tends to give values close to 0 or 1. If the input z is reasonably\
    \ large and positive, \"e\" at minus z is zero and, therefore, the y takes the\
    \ value of 1. If z has a large and negative value, it turns out that for \"e\"\
    \ raised to a large positive number, the denominator of the formula will turn\
    \ out to be a large number and therefore the value of y will be close to 0. Graphically,\
    \ the sigmoid function presents this form:\n\n![](images/00027.jpeg)\n\nSo far\
    \ we have presented how to define an artificial neuron, the simplest architecture\
    \ that a neural network can have. In particular this architecture is named in\
    \ the literature of the subject as Perceptron[\\[115\\]](#part0000_split_065.html#_ftn115)\
    \ (also called linear threshold unit (LTU)), invented in 1957 by Frank Rosenblatt,\
    \ and visually summarized in a general way with the following scheme:\n\n![](images/00028.jpeg)\n\
    \nFinally, let me help the reader to intuit how this neuron can learn the weights\
    \ W and the biases b from the input data that we already have labeled as \"squares\"\
    \ or \"circles\" (in chapter 4 we will present how this process is done in a more\
    \ formal way). \n\nIt is an iterative process for all the known labeled input\
    \ examples, comparing the value of its label estimated through the model, with\
    \ the expected value of the label of each element. After each iteration, the parameter\
    \ values are adjusted in such a way that the error obtained is getting smaller\
    \ as we keep on iterating with the goal of minimizing the loss function mentioned\
    \ above. The following scheme wants to visually summarize the learning process\
    \ of one perceptron in a general way:\n\n![](images/00029.jpeg)\n\n### Multi-Layer\
    \ Perceptron\n\nBut before moving forward with the example, we will briefly introduce\
    \ the form that neural networks usually take when they are constructed from perceptrons\
    \ like the one we have just presented."
