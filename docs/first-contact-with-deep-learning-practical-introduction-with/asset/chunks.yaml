- raw: "We now want to separate the two datasets: the orange ones must be classified\
    \ in one group and the blue ones in another. But the problem is that in this case\
    \ they will have a circular shape where the orange points will be in the outer\
    \ circle and the blue points will be inside. Now, these points cannot be separated\
    \ with a single line as before. If we train with a hidden layer that has a single\
    \ neuron as the model of the previous classification, the classification will\
    \ fail in this case.\n\nI suggest that we test with multiple neurons in the hidden\
    \ layer. For example, try two neurons: you will see that you have not tuned enough\
    \ yet. I propose that you then try with three. You will see that, in the end,\
    \ you can get a much better training and test loss:\n\n![](images/00059.jpeg)\n\
    \nLet's go for another of the datasets on the left, that where the data is divided\
    \ into four different square zones. Now, this problem cannot be solved with the\
    \ previous network, but I propose that you try it:\n\n![](images/00060.jpeg)\n\
    \nAs can be seen, we are not able to get a good classification (although in some\
    \ cases it could happen that with only 3 neurons it works since the initialization\
    \ is random, but if you do several tests you will see that it is not achieved\
    \ in general). However, if we have 5 neurons as in the following figure, the reader\
    \ can see how this neural network gets a good classification for this case: \n\
    \n![](images/00061.jpeg)\n\n### Classification with several layers\n\nNow we will\
    \ try to classify the dataset with the most complex pattern that we have in this\
    \ tool. The swirling structure of the orange and blue data points is a challenging\
    \ problem. If we rely on the previous network, we see that not even having 8 neurons,\
    \ the maximum that the tool leaves us, we get a good classification result:\n\n\
    ![](images/00062.jpeg)\n\nIf the reader has tried it, in this case I suppose that\
    \ you will get a few good values for the test loss. The time has come to put more\
    \ layers; I assure you that, if you use all the layers the tool allows, you will\
    \ get it:\n\n![](images/00063.jpeg)\n\nBut you will see that, as it is obvious,\
    \ the process of learning the parameters takes a long time.\n\nActually, with\
    \ fewer layers or neurons you can get good results; I challenge you to play a\
    \ little on your own, also changing for example the activation functions to get\
    \ a simpler model. You can also consider testing any other parameter.\n\n![](images/00064.jpeg)\n\
    \nThis tool only considers dense neural networks; later we will see that the convolutional\
    \ neural networks (and the recurrent neural networks that we will not deal with\
    \ in this book) present more complex dilemmas. But only with these dense networks\
    \ can we see that one of the most difficult hyperparameters to adjust is to decide\
    \ how many layers the model has and how many neurons each of these layers has. \
    \ \n\nUsing very few neurons in the hidden layers will result in what is called\
    \ underfitting, a lack of fit of the model because there are very few neurons\
    \ in the hidden layers to properly detect the signals in a complicated dataset.\n\
    \nOn the other hand, using too many neurons in the hidden layers can cause several\
    \ problems. First, it can produce overfitting, which occurs when the neural network\
    \ has so much information processing capacity that the limited amount of information\
    \ contained in the training set is not enough to train all the neurons in the\
    \ hidden layers. But on the other hand, a large number of neurons in the hidden\
    \ layers can increase the time needed to train the network to the point that it\
    \ is impossible to properly train the neural network in the necessary time.\n\n\
    Obviously, we must reach a compromise between too many and very few neurons in\
    \ the hidden layers and that is why I have already commented that we are facing\
    \ a challenge that requires more art than science.\n\n# 6       Convolutional\
    \ Neural Networks\n\nAt this point, we are ready to deal with another type of\
    \ neural networks, the so-called convolutional neuronal networks, widely used\
    \ in computer vision tasks. These networks are composed of an input layer, an\
    \ output layer and several hidden layers, some of which are convolutional, hence\
    \ its name.\n\nIn this chapter we will present a specific case that we will follow\
    \ step by step to understand the basic concepts of this type of networks. Specifically,\
    \ together with the reader, we will program a convolutional neural network to\
    \ solve the same MNIST digit recognition problem seen above.\n\n## 6.1       \
    \ Introduction to convolutional neural networks\n\nA convolutional neuronal network\
    \ (with the acronyms CNNs or ConvNets) is a concrete case of Deep Learning neural\
    \ networks, which were already used at the end of the 90s but which in recent\
    \ years have become enormously popular when achieving very impressive results\
    \ in the recognition of image, deeply impacting the area of computer vision.\n\
    \nThe convolutional neural networks are very similar to the neural networks of\
    \ the previous chapters: they are formed by neurons that have parameters in the\
    \ form of weights and biases that can be learned. But a differential feature of\
    \ the CNN is that they make the explicit assumption that the entries are images,\
    \ which allows us to encode certain properties in the architecture to recognize\
    \ specific elements in the images.  \n\nTo get an intuitive idea of how these\
    \ neural networks work, let's think about how we recognize things. For example,\
    \ if we see a face, we recognize it because it has ears, eyes, a nose, hair, etc.\
    \ Then, to decide if something is a face, we do it as if we had some mental boxes\
    \ of verification of the characteristics that we are marking. Sometimes a face\
    \ may not have an ear because it is covered by hair, but we also classify it with\
    \ a certain probability as face because we see the eyes, nose and mouth. Actually,\
    \ we can see it as a classifier equivalent to the one presented in chapter 2,\
    \ which predicts a probability that the input image is a face or no face.\n\n\
    But in reality, we must first know what an ear or a nose is like to know if they\
    \ are in an image; that is, we must previously identify lines, edges, textures\
    \ or shapes that are similar to those containing the ears or noses we have seen\
    \ before. And this is what the layers of a convolutional neuronal network are\
    \ entrusted to do.\n\nBut identifying these elements is not enough to be able\
    \ to say that something is a face. We also must be able to identify how the parts\
    \ of a face meet each other, relative sizes, etc.; otherwise, the face would not\
    \ resemble what we are used to. Visually, an intuitive idea of what layers learn\
    \ is often presented with this example from this reference article by Andrew Ng's\
    \ group[\\[133\\]](#part0000_split_065.html#_ftn133). \n\n![](images/00065.jpeg)\n\
    \nThe idea that we want to give with this visual example is that, in reality,\
    \ in a convolutional neural network each layer is learning different levels of\
    \ abstraction. The reader can imagine that, with networks with many layers, it\
    \ is possible to identify more complex structures in the input data. \n\n## 6.2       \
    \ Basic components of a convolutional neural network neuronal\n\nNow that we have\
    \ an intuitive vision of how convolutional neural networks classify an image,\
    \ we will present an example of recognition of MNIST digits and from it we will\
    \ introduce the two layers that define convolutional networks that can be expressed\
    \ as groups of specialized neurons in two operations: convolution and pooling.\n\
    \n### The convolution operation\n\nThe fundamental difference between a densely\
    \ connected layer and a specialized layer in the convolution operation, which\
    \ we will call the convolutional layer, is that the dense layer learns global\
    \ patterns in its global input space, while the convolutional layers learn local\
    \ patterns in small windows of two dimensions.  "
