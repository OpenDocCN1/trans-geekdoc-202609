    Special thanks to a colleague of the UPC and a great friend, `Xavier Giró-i-Nieto`.
    Xavier is an inexhaustible source of inspiration and knowledge, with whom I am
    co-directing the doctoral theses of `Míriam Bellver` and `Victor Campos`, to whom
    I also owe a great deal of thanks to for the knowledge that I have obtained on
    these topics and contents of this book. And I do not want to forget about other
    students like `Xisco Sastre`, whose final-master''s work also dealt with these
    concepts, being a great stimulus for my learning. A couple of research articles
    came from his results, of which I have used some graphs in this book.


    There have been many experts on this subject that I do not personally know who
    have also helped me at the time of writing, allowing me to share their ideas;
    therefore, I mention in detail the sources in the corresponding sections, more
    as a token of gratitude than for the reader having to consult this.


    Among all the experts that inspired me, I must make special mention of `François
    Chollet`, Google researcher and creator of `Keras`, whom I have the good fortune
    to meet personally. This book is written after François published his book `Deep
    Learning with Python`, which has been of great help and inspiration.


    My most sincere gratitude to all those who have read partially or totally the
    different drafts of this book: `Bernat Torres` (`SOMmobilitat`), `Fernando García
    Sedano` (`Grupsa`), `Jordi Morera` (`UPCnet`), `Guifré Ballester` (`UPCnet`),
    `Sergi Sales` (`UPCnet`) who have reported interesting comments to me to include
    in the version you have in your hands.


    My greatest thanks to my university, the `Universitat Politècnica de Catalunya
    - UPC Barcelona Tech` and, especially, to `Agustín Fernández Jiménez`, vice-rector
    of Digital Transformation of the `UPC` for having written the foreword of this
    work and having made a detailed reading of the final draft. The `UPC` has been
    the working environment that has allowed me to carry out my research on these
    topics and accumulate the knowledge that I want to share here. A university that
    also offers me to give classes in the `Facultat d''Informàtica de Barcelona` (`FIB`)
    to some brilliant students, who encourage me to write books like this one.


    As I mentioned at the beginning of the book, to researchers like `Ricard Gavaldà`
    or `Jordi Nin`, I owe it to them for awakening in me the interest in these subjects,
    years ago. As well as others, such as `Rubèn Tous` or `Joan Capdevila`, who accompanied
    me during the first steps in this topic.


    I would like to thank very much the research center `Barcelona Supercomputing
    Center - National Computing Center` (`BSC`) and especially its directors `Mateo
    Valero` and `Josep M. Martorell`, and the directors of the Computer Science department
    `Jesús Labarta` and `Eduard Ayguadé`, who have always allowed and supported me
    with this obsession that I have of needing to be “parant l''orella” to the technologies
    that will come.


    In the promotion of this book, I thank the support of `FIB Alumni`, `Col·legi
    Oficial d''Enginyeria en Informàtica de Catalunya` (`COEINF`) and the technological
    information portal `TECNONEWS`. Also to `Katy Wallace`, for helping me naming
    this collection in which this work is edited.


    My greatest thanks to our research group `Autonomic Systems and eBusiness Platforms`
    for the hard work they are doing in the projects that we carry out in the group:
    `Adrià Correas`, `Carla Sauvanaud`, `Cesare Cugnasco`, `Eloy Gil`, `Enric Sosa`,
    `Fabrizio Pistagna`, `Joan Capdevila`, `Jordi Guitart`, `Juan Luís Dominguez`,
    `Maurici Yagues`, `Miriam Bellver`, `Paola Pardo`, `Pol Santamaria`, `Victor Campos`
    and `Yolanda Becerra`.


    My appreciation to my students of the 2018 academic year who have shared the first
    edition of this book in Spanish with me, the ones I call “cap problema” (or “no
    problem”, in English): `Martín Acosta`, `Alessio Addimando`, `John Jairo Ballestas`,
    `Andrés Bermudez`, `Gabriel Cantos`, `Robert Carausu`, `Víctor Chamizo`, `Juan
    de los Reyes`, `Francesc`, `de Puig`, `Pau Figueras`, `Rafa Genés`, `Beñat Jimenez`,
    `Miquel Lara`, `Gil Laroussi`, `Tito Leiva`, `Irene Lopez`, `Eduardo Rodríguez`,
    `Isabel Samaniego`, `Marc Tula`, `Javier Vasquez`, `Marc Vila` and `Jonathan Zarama`.
    Thank you all!


    Finally, a sincere thank you to `Nuria Rodríguez`, `Donnalee Shucan`, `Anna Llibre`
    and `Katy Wallace` for the diligent English proofreading of this book.


    # About the author


    Professor at the `Universitat Politècnica de Catalunya Barcelona Tech` with 30
    years of experience in teaching and research in high performance computing, with
    important scientific publications and R&D projects in companies and institutions.


    His entrepreneurial spirit has led him to apply these systems in advanced analytics
    on `Big Data`, and at the moment his research focuses on supercomputing applied
    to `Artificial Intelligence` in general and `Deep Learning` in particular, an
    area in which he is co-advising three doctoral theses. His research has been published
    in the main forums of this field, including the `International Conference on Learning
    Representation` (`ICLR 2018`) and workshops within `Computer Vision and Pattern
    Recognition` (`CVPR 2017`, `2018`) and `Neural Information Processing Systems`
    (`NIPS 2016`, `2017`). In these publications he has collaborated with researchers
    from the `UPC`, `Columbia University`, `Google` and `Facebook`.


    Since its inception he has led a research group at the `Barcelona Supercomputer
    Center`. He is intellectually eager and passionate about new technologies. During
    recent years he has carried out different activities contributing to the definition
    of what strategy to follow at a technological level ahead of the new challenges
    that these technologies represent. He is currently a Board Member of `iThinkUPC`
    & `UPCnet`, and acts as a trainer, mentor and expert for various organizations
    and companies; In turn, he has also written several technical books, gives lectures
    and has collaborated with different media, radio and television. He has maintained
    his blog since 2006. You can find more information at `https://www.JordiTorres.org`.


    # About Barcelona Supercomputing Center (BSC)


    The `Barcelona Supercomputing Center - Centro Nacional de Supercomputación` (`BSC-CNS`)
    is the leading supercomputing center in Spain. It houses `MareNostrum`, one of
    the most powerful supercomputers in Europe, and is a hosting member of the `PRACE`
    European distributed supercomputing infrastructure. The mission of BSC is to research,
    develop and manage information technologies in order to facilitate scientific
    progress. BSC combines `HPC` service provision and R&D into both computer and
    computational science (life, earth and engineering sciences) under one roof, and
    currently has over 500 staff from 44 countries. More information on page `www.bsc.es`.


    # About Universitat Politècnica de Catalunya Barcelona Tech (UPC)

