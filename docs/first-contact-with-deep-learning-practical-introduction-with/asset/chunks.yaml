    If the model does not completely adapt to the input data (for example, if it presented
    overfitting), in this case, we would modify the value of certain hyperparameters
    and after training it again with the training data we would evaluate it again
    with the validation ones. We can make these adjustments of the hyperparameters
    guided by the validation data until we obtain validation results that we consider
    correct. If we have followed this procedure, we must be aware that, in fact, the
    validation data have influenced the model so that it also fits the validation
    data. For this reason, we always reserve a set of test data for final evaluation
    of the model that will only be used at the end of the whole process, when we consider
    that the model is already fine-tuned and we will no longer modify any of its hyperparameters.


    Given the introductory nature of this book and that we will not go into detail
    of tuning the hyperparameters, in the examples we will ignore the validation data
    and only use the training and test data.


    ## Preloaded data in Keras


    In `keras` the `MNIST` dataset is preloaded in the form of four `Numpy` arrays
    and can be obtained with the following code:


    ```python

    import keras

    from keras.datasets import mnist

    (x_train, y_train), (x_test, y_test) = mnist.load_data()

    ```


    `x_train` and `y_train` contain the training set, while `x_test` and `y_test`
    contain the test data. The images are encoded as `Numpy` arrays and their corresponding
    labels ranging from 0 to 9. Following the strategy of the book to gradually introduce
    the concepts of the subject, as we have indicated, we will not see yet how to
    separate a part of the training data to use them as Validation data. We will only
    take into account the training and test data.


    If we want to check what values we have loaded, we can choose any of the images
    of the `MNIST` set, for example image 8, and using the following Python code:


    ```python

    import matplotlib.pyplot as plt

    plt.imshow(x_train[8], cmap=plt.cm.binary)

    ```


    We get the following image:


    ![](images/00036.jpeg)


    And if we want to see its corresponding label we can do it through:


    ```python

    print(y_train[8])

    ```


    That, as we see, it returns the value of "1", as expected.


    ## Data representation in Keras


    Keras, which as we have seen uses a multidimensional array of `Numpy` as a basic
    data structure, calls this data structure a `tensor`. In short, we could say that
    a `tensor` has three main attributes:


    - **Number of axes (Rank)**: a tensor containing a single number will be called
    `scalar` (or a 0-dimensional tensor, or tensor 0D). An array of numbers we call
    `vector`, or tensor 1D. An array of vectors will be a matrix, or 2D tensor. If
    we pack this matrix in a new array, we get a 3D tensor, which we can interpret
    visually as a cube of numbers. By packaging a 3D tensioner in an array, we can
    create a 4D tensioner, and so on. In the Python `Numpy` library this is called
    the tensor’s `ndim`.

    - **Shape**: it is a tuple of integers that describe how many dimensions the tensor
    has along each axis. In the `Numpy` library this attribute is called `shape`.

    - **Data type**: this attribute indicates the type of data that contains the tensor,
    which can be for example `uint8`, `float32`, `float64`, etc. In the `Numpy` library
    this attribute is called `dtype`.


    I propose that we obtain the number of axes and dimensions of the tensor `train_images`
    from our previous example:


    ```python

    print(x_train.ndim)

    3

    print(x_train.shape)

    (60000, 28, 28)

    ```


    And if we want to know what type of data it contains:


    ```python

    print(x_train.dtype)

    uint8

    ```


    ## Data normalization in Keras


    These `MNIST` images of 28×28 pixels are represented as an array of numbers whose
    values range from [0, 255] of type `uint8`. But it is usual to scale the input
    values of neural networks to certain ranges. In the example of this chapter the
    input values should be scaled to values of type `float32` within the interval
    [0, 1]. We can achieve this transformation with the following lines of code:


    ```python

    x_train = x_train.astype(''float32'')

    x_test = x_test.astype(''float32'')

    x_train /= 255

    x_test /= 255

    ```


    On the other hand, to facilitate the entry of data into our neural network (we
    will see that in convolutionals it is not necessary) we must make a transformation
    of the tensor (image) from 2 dimensions (2D) to a vector of 1 dimension (1D).
    That is, the matrix of 28×28 numbers can be represented by a vector (array) of
    784 numbers (concatenating row by row), which is the format that accepts as input
    a densely connected neural network like the one we will see in this chapter. In
    Python, converting every image of the `MNIST` dataset to avector with 784 components
    can be accomplished as follows:


    ```python

    x_train = x_train.reshape(60000, 784)

    x_test = x_test.reshape(10000, 784)

    ```


    After executing these Python instructions, we can verify that `x_train.shape`
    takes the form of (60000, 784) and `x_test.shape` takes the form of (10000, 784),
    where the first dimension indexes the image and the second indexes the pixel.


    To see the effect of the transformation, we will use what is known as one-hot
    encoding, which we have already mentioned, which consists of transforming the
    labels into a vector of as many zeros as the classes, containing 1 in the index
    that corresponds to the value. Keras offers many support functions, including
    `to_categorical` to perform precisely this, which we can import from `keras.utils`:


    ```python

    from keras.utils import to_categorical

    ```


