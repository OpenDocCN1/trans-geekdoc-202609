    ## 6.4 卷积层的超参数


    到目前为止未看到的卷积神经网络的主要超参数有：过滤器的大小、滤波器的数量、步长（stride）和填充（padding）。


    ### 过滤器的大小和数量


    包含空间上相邻像素信息的窗口（`window_height` × `window_width`）的大小通常为 3×3 或 5×5。告诉我们想要处理的特征数量的过滤器数量（`output_depth`）通常为
    32 或 64。在 Keras 的 `Conv2D` 层，这些超参数是我们按照此顺序作为参数传递的：


    `Conv2D(output_depth, (window_height, window_width))`


    ### 填充


    为了解释填充的概念，让我们来看一个例子。假设有一张 5×5 像素的图像。如果我们选择一个 3×3 的窗口来执行卷积，我们可以看到操作产生的张量大小为 3×3。也就是说，它缩小了一点：在这种情况下，每个维度正好缩小了两个像素。在图中直观地展示了这一点。假设左侧的图是
    5×5 的图像。我们在图中对像素进行了编号，以便观察 3×3 窗口是如何移动以计算过滤器的元素的。


    ![](img/00073.jpeg)


