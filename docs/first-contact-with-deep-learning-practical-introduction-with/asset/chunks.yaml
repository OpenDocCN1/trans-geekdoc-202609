    不久后将在市场上出现的一个例子是巴塞罗那超级计算中心（BSC）目前超级计算机 MareNostrum 的一部分。MareNostrum 是 BSC 用指代其西班牙最具标志性且最强大的超级计算机的不同版本的通用名称，自
    2004 年以来，为止已安装了四个版本[\[30\]](#part0000_split_065.html#_ftn30)。目前，MareNostrum 是世界上异构性最强的超级计算机，市场上提供了各种实验性硬件，因为它的目的是作为一个用于设计未来超级计算机的实验平台。


    它的结构是：当前 MareNostrum 4 的计算能力被分为两个部分，其硬件完全不同：一个通用计算块和一个新兴技术计算块。新兴技术块由三种不同技术的集群组成，这些技术将根据其可用性被纳入并更新。这些是目前正在美国和日本开发的各种，旨在加速新一代前百亿次级（pre-exascale）超级计算机的到来。


    这些技术之一是基于专为深度学习和人工智能应用设计的 IBM 系统[\[31\]](#part0000_split_065.html#_ftn31)；IBM
    已经创建了所有必要的软件栈。在写这本书时，硬件已经可用，`PowerAI`\[32\]](#part0000_split_065.html#_ftn32)
    软件包很快将安装，这将把这台超级计算硬件转换为一台专为人工智能设计的机器。通过该软件，深度学习的主要框架如 `TensorFlow`（以及包含在 `Tensorflow`
    包中的 `Keras`）、`Caffe`、`Chainer`、`Torch` 和 `Theano` 将供人工智能研究人员使用。


    在硬件方面，MareNostrum 的这部分基于 `IBM POWER9` 和 `NVIDIA V100` 的 54 节点集群，采用 `Linux` 操作系统，并通过
    100 Gbps 的 `infiniband` 网络互连。每个节点配备了 2 个 `IBM POWER9` 处理器，每个处理器具有 20 个物理核心和 512GB
    内存。这些 `POWER9` 处理器中的每一个连接到两个具有 16GB 内存的 `NVIDIA V100` (Volta) GPU，每个节点总共 4 个 GPU。见下图：


    ![](img/00015.jpeg)


    新的 `NVIDIA V100` GPU 是迄今为止最先进的 GPU[\[33\]](#part0000_split_065.html#_ftn33)，根据
    `NVIDIA`\[34\]](#part0000_split_065.html#_ftn34)，其加速人工智能应用的能力等同于 100 个 CPU。这是通过将它们的
    `CUDA` 核心与 640 核心张量（core tensor）匹配实现的，这在之前的 `NVIDIA` `Pascal` GPU 系列中是不具备的。张量专门设计用于乘以两个
    4×4 浮点格式元素的矩阵，并允许对第三个矩阵进行积累，从而能够非常快速地执行神经网络在推理阶段和训练阶段的基本操作。


    此外，此版本的 GPU 更新了带有 `NVLINK 2.0`\[35\]](#part0000_split_065.html#_ftn35) 系统的总线，该系统通过六条链路允许每秒
    50 GB 的高带宽。虽然传统的 `NVLINK` 总线最初设计用于连接 GPU，但此版本也使得连接 GPU 和 CPU 成为可能。另一个重要元素是内存访问，与之前的版本相比有所改进，允许高达
    900 GB/s 的带宽。太棒了！


    我描述所有这些细节是为了让你不要感到惊讶，仅用当前 MareNostrum\[\[36\]](#part0000_split_065.html#_ftn36)
    的三个机架（如下所示），就有 1.5 Petaflops 的理论最大性能，远高于 2012 年 MareNostrum 3 在 36 个机架（见第 30 页之前的照片）中拥有的
    1.1 Petaflops。


    ![](img/00016.jpeg)


    总之，我的意图并不是给你上一堂计算机架构课，但我想通过真实的示例解释并让你意识到，所有设备都在演进。


    # 1             一项新技术正在到来

    人工智能被视为新的工业革命，是某些人所谓的工业 4.0 的核心。深度学习是这一过程的引擎，在接下来的章节中，我们将介绍它。


    # 1.1          人工智能正在改变我们的生活

    我们正面临着日常技术在质量和设备上令人眩晕的进步：在语音识别方面，语音转文本转录经历了不可思议的进步，现在已在可用设备中。我们正与（所有设备）更多地交互……自然语言也变得非常精彩。例如，只需点击
    `Google Translate`\[37\]](#part0000_split_065.html#_ftn37) 微型图标，系统就会翻译成另一种语言。计算机视觉领域也取得了惊人的进展：现在我们的计算机，例如可以识别图像并生成内容的文本描述。


    这三个领域对于释放机器人或自动驾驶汽车等许多领域的改进至关重要。人工智能是所有创新的核心，得益于深度学习，它最近进展如此迅速。尽管人工智能尚未被广泛部署，人们很难想象它将产生的巨大影响，就像在
    1995 年很难想象互联网未来的影响一样。


    ## 1.2            人工智能、机器学习和深度学习

    在继续之前，我们将明确我们理解的人工智能、机器学习和深度学习，这三个术语将在全书中频繁出现。


    '
