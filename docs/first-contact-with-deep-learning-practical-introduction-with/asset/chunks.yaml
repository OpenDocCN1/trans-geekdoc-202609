- raw: "GPUs were originally developed to accelerate the 3D game that requires the\
    \ repeated use of mathematical processes that include different matrix calculations.\
    \ Initially, companies such as NVIDIA and AMD developed these fast and massively\
    \ parallel chips for graphics cards dedicated to video games. However, it soon\
    \ became clear that the use of GPUs for 3D games was also very suitable for accelerating\
    \ calculations on numerical matrices; therefore, this hardware actually benefited\
    \ the scientific community, and in 2007 NVIDIA launched the CUDA[\\[19\\]](#part0000_split_065.html#_ftn19)\
    \ programming language to program its GPUs. As a result, supercomputing research\
    \ centers such as the BSC began using GPU clusters to accelerate numerical applications.\n\
    \nBut as we will see later in this book, artificial neural networks basically\
    \ perform matrix operations that are also highly parallelizable. And this is what\
    \ Alex Krizhevsky's team did in 2012: he trained his Deep Learning algorithm \"\
    AlexNet\" with GPU. Since then, some research groups have  started using GPUs\
    \ for this competition, and nowadays all the groups that do research in Deep Learning\
    \ research field are using this hardware or equivalent alternatives that have\
    \ appeared recently.\n\n### An exponential growth of computing capacity\n\nI have\
    \ already said that Krizhevsky's team's milestone was an important turning point\
    \ in the field of Deep Learning, and since then there have been spectacular results,\
    \ one after another, with an exponential growth of increasingly surprising results.\n\
    \nBut I believe that research in this field has been guided largely by experimental\
    \ findings rather than by theory, in the sense that these spectacular advances\
    \ in the area since 2012 have only been possible thanks to the fact that the computation\
    \ that was required to be able to carry them out was available; In this way, researchers\
    \ in this field have been able to test and extend old ideas, while they have advanced\
    \ with new ones that required a lot of computing resources.\n\nOpenAI[\\[20\\\
    ]](#part0000_split_065.html#_ftn20) has recently published a study on its blog[\\\
    [21\\]](#part0000_split_065.html#_ftn21) that corroborates precisely this vision\
    \ that I am defending. Specifically, they present an analysis in which it is confirmed\
    \ that, since 2012, the amount of computation available to generate models of\
    \ artificial intelligence has increased exponentially while claiming that improvements\
    \ in computing capacity have been a key component of the progress of Artificial\
    \ Intelligence.\n\nIn this same article they present an impressive graph[\\[22\\\
    ]](#part0000_split_065.html#_ftn22) to synthesize the results of their analysis:\n\
    \n![](images/00011.jpeg)\n\nThe graph shows the total amount of calculations,\
    \ in Petaflop per day, that have been used to train neural networks that have\
    \ their own name and are referents in the Deep Learning community. Remember that\
    \ a \"petaflop / s-day\", the vertical axis of the graph that is in logarithmic\
    \ scale, is equivalent to perform 1,000,000,000,000,000 neural network operations\
    \ per second during a day (s-day), or a total of approximately 100,000,000,000,000,000\
    \ operations, regardless of numerical precision.\n\n### Accelerating Deep Learning\
    \ with parallel systems\n\nThe tasks of training Deep Learning networks requires\
    \ a large amount of computation and, often, they also need the same type of matrix\
    \ operations as the numerical calculation intensive applications, which makes\
    \ them similar to traditional supercomputing applications. Therefore, Deep Learning\
    \ applications work very well in computer systems that use accelerators such as\
    \ GPU or field-programmable gate arrays (FPGA), which have been used in the Supercomputing\
    \ field for more than a decade within the walls of the supercomputing research\
    \ centers. These hardware devices focus on computational performance by specializing\
    \ their architecture in using high data parallelism in supercomputing workloads.\
    \ And precisely these techniques can also be used to accelerate the learning algorithms\
    \ of Deep Learning.\n\nTherefore, from 2012 until 2014, Deep Learning researchers\
    \ started using systems with GPUs. The advantage, in addition, is that these learning\
    \ algorithms escalated perfectly when they could put more than one GPU in a node.\
    \ The following graph, extracted from one of our research articles, shows how\
    \ increasing the number of GPUs can accelerate the learning process[\\[23\\]](#part0000_split_065.html#_ftn23):\n\
    \n![](images/00012.jpeg)\n\n### Accelerating Deep Learning with distributed systems\
    \ \n\nThe large computational capacity available at that time allowed the Deep\
    \ Learning community to move forward and be able to design increasingly complex\
    \ neural networks, requiring more computing capacity than a server with multiple\
    \ GPUs could offer. Therefore starting in 2014 to accelerate even more the calculation\
    \ required, computing began to be distributed among multiple machines with several\
    \ GPUs connected by a network. This solution had been adopted again previously,\
    \ and very well known, in the community of researchers in supercomputing, specifically\
    \ in the interconnection of machines through optical networks with low latency,\
    \ which made it possible to do the distribution in a very efficient manner. The\
    \ following graph shows how the same algorithm can be accelerated with several\
    \ machines that each have 4 GPUs[\\[24\\]](#part0000_split_065.html#_ftn24):\n\
    \n![](images/00013.jpeg)\n\nAlso libraries of the standard of communication like\
    \ Message Passing Interface (MPI) [\\[25\\]](#part0000_split_065.html#_ftn25),\
    \ used in the scientific community of supercomputing for decades, are spreading\
    \ in distributed Deep Learning, requiring the knowledge of experts in supercomputing\
    \ to accelerate these algorithms.\n\n### Will specialized hardware for deep learning\
    \ be a game changer?\n\nAs of 2016, in addition to all the previous innovations\
    \ in supercomputing, processing chips began to appear that were specially designed\
    \ for Deep Learning algorithms. For example, in 2016 Google announced that it\
    \ had built a dedicated processor called the Tensor Processing Unit (TPU) [\\\
    [26\\]](#part0000_split_065.html#_ftn26). Since then Google has already developed\
    \ 3 versions of TPU, the last one presented in its IO[\\[27\\]](#part0000_split_065.html#_ftn27)\
    \ conference, where they claimed that it is 8 times more powerful than the previous\
    \ version. In addition, now not only the architecture is specific to train neural\
    \ networks, but also for the inference stage (use of the previously trained model).\n\
    \nIn the following graph obtained from the Google Cloud blog[\\[28\\]](#part0000_split_065.html#_ftn28),\
    \ we can see a comparison of predictions per second obtained (on a logarithmic\
    \ scale) for the three different types of architecture mentioned above.\n\n![](images/00014.jpeg)\n\
    \n###  \n\nThe acceleration of Deep Learning with specialized hardware has only\
    \ just begun, both for the training stage and the inference stage, if we take\
    \ into account that numerous companies are appearing that are designing and starting\
    \ to produce specific chips for Artificial Intelligence[\\[29\\]](#part0000_split_065.html#_ftn29).\n\
    \nSpecialized hardware is sure going to be a big factor in Deep Learning race.\
    \ We will see great progress soon, I am sure. However, even more interesting will\
    \ be to see what role Deep Learning plays in changing hardware in the  near future.\
    \ \n\n### Tapping the Next Generation of Supercomputers \n\nAnd now we are at\
    \ the point of convergence of Artificial Intelligence technologies and supercomputing\
    \ technologies. The result will soon be part of the portfolio that companies providing\
    \ computer systems (and Cloud services)  will offer to the industrial and business\
    \ world."
  fmt: '

    GPUs were originally developed to accelerate the 3D game that requires the repeated
    use of mathematical processes that include different matrix calculations. Initially,
    companies such as `NVIDIA` and `AMD` developed these fast and massively parallel
    chips for graphics cards dedicated to video games. However, it soon became clear
    that the use of `GPUs` for 3D games was also very suitable for accelerating calculations
    on numerical matrices; therefore, this hardware actually benefited the scientific
    community, and in 2007 `NVIDIA` launched the `CUDA`[[19]](#part0000_split_065.html#_ftn19)
    programming language to program its `GPUs`. As a result, supercomputing research
    centers such as the `BSC` began using `GPU` clusters to accelerate numerical applications.


    But as we will see later in this book, artificial neural networks basically perform
    matrix operations that are also highly parallelizable. And this is what Alex Krizhevsky''s
    team did in 2012: he trained his Deep Learning algorithm "AlexNet" with `GPU`.
    Since then, some research groups have started using `GPUs` for this competition,
    and nowadays all the groups that do research in Deep Learning research field are
    using this hardware or equivalent alternatives that have appeared recently.


    ### An exponential growth of computing capacity


    I have already said that Krizhevsky''s team''s milestone was an important turning
    point in the field of Deep Learning, and since then there have been spectacular
    results, one after another, with an exponential growth of increasingly surprising
    results.


    But I believe that research in this field has been guided largely by experimental
    findings rather than by theory, in the sense that these spectacular advances in
    the area since 2012 have only been possible thanks to the fact that the computation
    that was required to be able to carry them out was available; In this way, researchers
    in this field have been able to test and extend old ideas, while they have advanced
    with new ones that required a lot of computing resources.


    `OpenAI`[[20]](#part0000_split_065.html#_ftn20) has recently published a study
    on its blog[[21]](#part0000_split_065.html#_ftn21) that corroborates precisely
    this vision that I am defending. Specifically, they present an analysis in which
    it is confirmed that, since 2012, the amount of computation available to generate
    models of artificial intelligence has increased exponentially while claiming that
    improvements in computing capacity have been a key component of the progress of
    Artificial Intelligence.


    In this same article they present an impressive graph[[22]](#part0000_split_065.html#_ftn22)
    to synthesize the results of their analysis:


    ![](images/00011.jpeg)


    The graph shows the total amount of calculations, in Petaflop per day, that have
    been used to train neural networks that have their own name and are referents
    in the Deep Learning community. Remember that a "petaflop / s-day", the vertical
    axis of the graph that is in logarithmic scale, is equivalent to perform 1,000,000,000,000,000
    neural network operations per second during a day (s-day), or a total of approximately
    100,000,000,000,000,000 operations, regardless of numerical precision.


    ### Accelerating Deep Learning with parallel systems


    The tasks of training Deep Learning networks requires a large amount of computation
    and, often, they also need the same type of matrix operations as the numerical
    calculation intensive applications, which makes them similar to traditional supercomputing
    applications. Therefore, Deep Learning applications work very well in computer
    systems that use accelerators such as `GPU` or field-programmable gate arrays
    (`FPGA`), which have been used in the Supercomputing field for more than a decade
    within the walls of the supercomputing research centers. These hardware devices
    focus on computational performance by specializing their architecture in using
    high data parallelism in supercomputing workloads. And precisely these techniques
    can also be used to accelerate the learning algorithms of Deep Learning.


    Therefore, from 2012 until 2014, Deep Learning researchers started using systems
    with `GPUs`. The advantage, in addition, is that these learning algorithms escalated
    perfectly when they could put more than one `GPU` in a node. The following graph,
    extracted from one of our research articles, shows how increasing the number of
    `GPUs` can accelerate the learning process[[23]](#part0000_split_065.html#_ftn23):


    ![](images/00012.jpeg)


    ### Accelerating Deep Learning with distributed systems


    The large computational capacity available at that time allowed the Deep Learning
    community to move forward and be able to design increasingly complex neural networks,
    requiring more computing capacity than a server with multiple `GPUs` could offer.
    Therefore starting in 2014 to accelerate even more the calculation required, computing
    began to be distributed among multiple machines with several `GPUs` connected
    by a network. This solution had been adopted again previously, and very well known,
    in the community of researchers in supercomputing, specifically in the interconnection
    of machines through optical networks with low latency, which made it possible
    to do the distribution in a very efficient manner. The following graph shows how
    the same algorithm can be accelerated with several machines that each have 4 `GPUs`[[24]](#part0000_split_065.html#_ftn24):


    ![](images/00013.jpeg)


    Also libraries of the standard of communication like Message Passing Interface
    (`MPI`)[[25]](#part0000_split_065.html#_ftn25), used in the scientific community
    of supercomputing for decades, are spreading in distributed Deep Learning, requiring
    the knowledge of experts in supercomputing to accelerate these algorithms.


    ### Will specialized hardware for deep learning be a game changer?


    As of 2016, in addition to all the previous innovations in supercomputing, processing
    chips began to appear that were specially designed for Deep Learning algorithms.
    For example, in 2016 `Google` announced that it had built a dedicated processor
    called the Tensor Processing Unit (`TPU`)[[26]](#part0000_split_065.html#_ftn26).
    Since then `Google` has already developed 3 versions of `TPU`, the last one presented
    in its `IO`[[27]](#part0000_split_065.html#_ftn27) conference, where they claimed
    that it is 8 times more powerful than the previous version. In addition, now not
    only the architecture is specific to train neural networks, but also for the inference
    stage (use of the previously trained model).


    In the following graph obtained from the `Google Cloud` blog[[28]](#part0000_split_065.html#_ftn28),
    we can see a comparison of predictions per second obtained (on a logarithmic scale)
    for the three different types of architecture mentioned above.


    ![](images/00014.jpeg)


    ### Summary


    The acceleration of Deep Learning with specialized hardware has only just begun,
    both for the training stage and the inference stage, if we take into account that
    numerous companies are appearing that are designing and starting to produce specific
    chips for Artificial Intelligence[[29]](#part0000_split_065.html#_ftn29).


    Specialized hardware is sure going to be a big factor in Deep Learning race. We
    will see great progress soon, I am sure. However, even more interesting will be
    to see what role Deep Learning plays in changing hardware in the near future.


    ### Tapping the Next Generation of Supercomputers


    And now we are at the point of convergence of Artificial Intelligence technologies
    and supercomputing technologies. The result will soon be part of the portfolio
    that companies providing computer systems (and Cloud services) will offer to the
    industrial and business world.

    '
  trans: '

    GPU 最初是为了加速 3D 游戏而开发的，这些游戏需要反复使用包含不同矩阵计算的数学过程。最初，`NVIDIA` 和 `AMD` 等公司开发了这些快速且大规模并行的芯片，用于专门视频游戏的显卡。然而，人们很快发现，`GPUs`
    用于 3D 游戏也非常适用于加速数值矩阵的计算；因此，这种硬件实际上惠了科学界，2007 年 `NVIDIA` 发布了 `CUDA`[[19]](#part0000_split_065.html#_ftn19)
    语言来对其 `GPUs` 编程。结果，`BSC` 等超算研究中心开始使用 `GPU` 集群来加速数值应用。


    但正如我们在书中后文将看到的，人工神经网络基本上执行的是同样高度可并行化的矩阵操作。这就是 Alex Krizhevsky 团队在 2012 年所做的：他使用
    `GPU` 训练了他的深度学习算法“AlexNet”。从那时起，一些研究小组开始在比赛中使用 `GPUs`，如今，所有在深度学习领域进行研究的小组都在使用这种硬件或近期出现的等效替代方案。


    ### 计算能力的指数级增长


    我已经说过，Krizhevsky 团队的里程碑是深度学习领域的一个重要转折点，从那时起，惊人的结果层出不穷，令人惊讶的结果呈指数级增长。


    但我认为，该领域的研究很大程度上受实验发现而非理论的指导，从这个意义上说，自 2012 年以来这些领域的进展之所以能够实现，是因为执行这些进展所需的计算能力已经就绪；通过这种方式，该领域的研究人员能够测试并扩展旧的想法，同时随着需要大量计算资源的新想法不断取得进展。


    `OpenAI`[[20]](#part0000_split_065.html#_ftn20) 最近在在其博客[[21]](#part0000_split_065.html#_ftn21)
    上发布了一项研究，恰恰证实了我所捍卫的这一观点。具体而言，他们展示了一项分析，确认了自 2012 年以来，生成人工智能模型所需的可用计算量呈指数级增长，并声称计算能力的提升是人工智能进步的关键因素。


    在同一篇文章中，他们展示了一个令人深刻的图表[[22]](#part0000_split_065.html#_ftn22) 来综合其分析结果：


    ![](img/00011.jpeg)


    该图表显示了每天 Petaflop 为单位的总计算量，这些计算量用于训练具有自己名称且是深度学习社区参考的神经网络。请记住，“petaflop / s-day”（图表的对数刻度纵轴）等同于一天（s-day）内每秒执行
    1,000,000,000,000,000 次神经网络操作，或者总计约 100,000,000,000,000,000 次，无论数值精度如何。


    ### 使用并行系统加速深度学习


    训练深度学习网络的任务需要大量的计算，而且通常还需要与数值计算密集型应用相同的矩阵操作，这使得它们与传统的超算应用相似。因此，深度学习应用在使用了 `GPU`
    或现场可编程门阵列 (`FPGA`）等加速器的计算机系统中运行得非常好，这些硬件在超算研究中心内部已在超级计算领域使用了十多年。这些硬件设备通过在超算工作负载中专门使用高数据并行性来专门架构，专注于计算性能。而这些这些技术也可以用于加速学习算法。

    '
