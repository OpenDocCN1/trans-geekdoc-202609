    controlled within 1 meter and basically controlled within the designed grid, thus
    realizing the positioning requirements.


    # III. OUR MODEL


    Our positioning model introduces a system for finding indoor locations with high
    precision in real-time by making use of the Bluetooth RSSI values obtained from
    smartphones. We chose to make use of Bluetooth Beacons because they have several
    advantages against other indoor localization technologies. The main advantage
    of this approach is that the cost for the required infrastructure is low, since
    it only requires a number of Bluetooth Beacons (we experimented with a ratio of
    1 Beacon per about 6m² of internal space to achieve best coverage with no blind
    spots) scattered around the interior space in predefined and known positions (e.g.
    walls, ceiling etc.) [10], [11], [14], [15]. Additionally, smartphones are considered
    ubiquitous and can be the optimal device that can enable internal location tracking
    of humans (else any other embedded Bluetooth device for tracking “things” equipped
    with such sensors).


    The proposed Trilateration algorithm in [12] is an easily implemented solution
    due to its low complexity and operates independently of any predefined grid. On
    average this system has an error of about 1 meter. In [13] authors experimented
    with mathematical filtering functions to smooth RSSI and improve accuracy. They
    use functions like median, mode, single direction outlier removal, shifting and
    feedback filtering. For position calculation, they use a trilateration algorithm
    and achieve an accuracy of about 1-2 meters.


    We can divide our internal location estimation approach into three phases.


    +   • In the first phase, our system makes use of a set of machine learning models
    (one for each Beacon deployed in the interior space). These models are used to
    predict the distance from the smartphone and a specific Beacon based on the current
    RSSI level measurement and its comparison against past measurements collected
    and used during the training phase.


    In recent years, many efforts have been made to make use of machine learning algorithms
    for indoor location systems. In [14], a machine learning approach to indoor positioning
    for mobile targets based on BLE signals is proposed. The authors in [14] design
    a feature vector for the position prediction and perform machine learning with
    well-known decision-tree based algorithms, which is shown to achieve a predictive
    accuracy less than one meter. In [15] a BLE based machine learning location and
    tracking system for indoor positioning with experimental results is proposed showing
    that this method has an average estimation error of 50 cm.


    +   • In phase two our system takes as input the distances from the Beacons from
    the first phase and calculates the peripheries of circles that have as a center
    the Beacons’ location and as a radius the distances found in phase one. After
    that, we find the intersection points of all circles.


    Following the advances described above we have been investigating methods that
    can exploit the latest powerful machine learning technologies to solve the problem
    of indoor location with an accuracy much closer than 1m based on low cost solutions.
    Machine learning is becoming ubiquitous, with the cost of hardware reducing fast
    and new methods and tools providing efficient solutions to a large number of problems
    related to the processing of signals from sensor and IoT networks in order to
    enable smart applications and lead to actual Artificial Intelligence. Therefore,
    in [16] we presented a system where we use a smartphone to find the location by
    using the measured RSSI value from Bluetooth Beacons combined with measurements
    from other smartphone sensors and feeding a machine learning model. The approach
    of our past work in [16] was based on the selection of a grid layout of the interior
    space, against which the user positioning was attempted based on the signals received
    from the Beacons installed in fixed locations, i.e. similar to the approach followed
    in [10] and [11], however with improved accuracy i.e. accurate user positioning
    within less than a meter.


    +   • In the third and last phase, our system gets as input the intersection points
    from phase two and finds the geometric median from the intersection points. This
    geometric median point is defined as the estimated location.


    In this work we present an improved method, which can exploit powerful machine
    learning as in [14], [15] and [16] but can also achieve improved performance,
    while operating in real-time and independent of any interior grid layout. In this
    work, we develop a machine learning model to solve a regression problem. This
    way we overcome the need to select a predefined grid as was done in [15] and [16],
    which also simplifies the model training process and leads to improved accuracy.
    Additionally, we demonstrate an average accuracy of 69.58cm and we can predict
    position with an accuracy of less than a meter in 80% of all cases. It is important
    to stress that our method can operate in real-time, while the grid-based method
    presented in [15] can achieve comparable results at the cost of repeated RSSI
    measurements at each location, which can be applicable only for semi-static and
    not actual mobile users.


    # IV. DATA COLLECTION


    The first step in developing our system was to set up a data collection procedure
    to train and evaluate our neural network models for phase one of predicting the
    distance from Beacons.


    To create the data collection, we used five iBKs105 Bluetooth Beacons from Accent
    Systems that we placed in different locations around a 31m² apartment “Fig. 1”.
    The locations of the Beacons are fixed and we know the distances (x and y) from
    the lower left corner of the apartment for each Beacon.


    Then by using an application that we have developed on Android for a commercial
    smartphone we started to move around the space of the apartment and take measurements.
    For each measurement, we record the current position of the mobile (distance for
    upper and left walls x and y), the RSSI values for all five Beacons, the distance
    from each Beacon, and the timestamp of the moment we took the measurement. The
    mobile phone we used to collect the data is a Xiaomi Mi A1.'
