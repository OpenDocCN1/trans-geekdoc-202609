    # Accurate Gridless Indoor Localization Based on Multiple Bluetooth Beacons and
    Machine Learning


    Konstantinos Kotrosios

    School of Science and Technology

    Hellenic Open University

    Patras, Greece

    kkotrosios@gmail.com


    Theofanis Orphanoudakis

    School of Science and Technology

    Hellenic Open University

    Patras, Greece

    fanis@eap.gr


    *Abstract*—In this work we present an indoor location method using smartphones
    as a source of location information. The proposed method uses the Received Signal
    Strength Indicator (RSSI) value from Bluetooth Low Energy Beacons scattered around
    interior spaces. We present the results of our model using machine learning, which
    was developed based on measurements of RSSI values from Beacons inside a lab environment
    occupying a space of 31m². Measurements were fed to the open-source TensorFlow
    framework to develop an estimator of the distance between the mobile phone and
    the beacon. Next, based on the cross-sections of peripheral lines having as a
    center the location of the Beacons and radius the predicted distances we compute
    the intersection points from all circles and base our position estimation on the
    Geometric median of intersection points. Through experiments, we show that our
    system has an average accuracy of 69.58cm and can predict position with an accuracy
    of less than a meter in 80% of the cases.


    *Keywords-Indoor Localization, Bluetooth, Beacons, Machine Learning*


    # I. INTRODUCTION


    Indoor positioning systems are becoming a vital part of the so called Internet
    of Things (IoT) [1] and applications used to estimate the location of a subject
    in areas like malls, airports, libraries, hospitals, etc., which are enablers
    for services such as context-based advertising, indoor navigation, robotics applications,
    emergency response, assisted living, etc.


    There are many systems available for outdoor positioning GPS, A-GPS, Galileo,
    etc. However, they are available only outdoors and cannot provide the necessary
    accuracy for an indoor positioning application. For example, GPS can provide maximum
    accuracy of 5 meters. An accuracy not suitable for interior areas.


    Many techniques have been developed to estimate the location in interior environments
    based on deferent techniques, such as, UWB signals [2], ultrasounds [3], RFID
    [4], Channel State Information (CSI) in WiFi networks [5], [6], etc. But all these
    methods require specialized hardware and therefore cannot be used on smartphones
    in our case, where we want to develop a system with no use of any special hardware.


    Indoor localization approaches based on RSSI measurement of wireless signals such
    as WiFi and Bluetooth [7] are the most popular due to their low infrastructure
    cost, their use in all smartphones and potential high accuracy. The majority of
    approaches used today are based on Wi-Fi signals


    to estimate indoor locations. Additionally, most usually they are using algorithms
    to estimate the distance from a known position.


    The remainder of the paper is organized as follows. In section II we review the
    related recent work in the literature. In section III we summarize the basics
    of our positioning model approach. Section IV describes the data collection process
    for the development and training of our machine learning model. In section V we
    provide a detailed description of our model. Finally, the paper concludes with
    presenting the results in Section VI and a discussion and conclusions in Section
    VII.


    # II. RELATED WORK


    Indoor positioning and accurate location tracking are open research problems that
    have attracted the interest of many researchers in recent years [7], [8], which
    have used different approaches based on different technologies and exploiting
    different methods to address them. Methods of indoor localization are usually
    based on monitoring the radio signal strength, the so-called Received Signal Strength
    Indicator (RSSI) value from wireless signals such as WiFi and Bluetooth [9]. The
    RSSI from wireless signals and specifically from Bacons (low-cost transmitters
    based on Bluetooth low energy that broadcast their identifier to nearby mobile
    devices) is the most popular method with many researchers using this method as
    a solution in recent years.


    Authors in [10] proposed an Iterative Weighted K Nearest Neighbors (IW – KNN)
    method based on RSSI of the BLE. They propose three principal improvements. First,
    Euclidean distance and Cosine similarity are combined to measure the similarity
    of two RSSI vectors, which can take both length and direction of the vector into
    consideration. Second, unlike traditional k-NN which estimates a position by a
    majority vote of its neighbors, a weighting factor is applied to neighbors for
    localization. Third, IW-KNN selects different iBeacons to obtain RSSI at each
    iteration and calculates the mean position as the final result after several iterations.
    They can estimate positions effectively and reduce the mean error by 1.5 to 2.7
    meters in an experimental environment dividing the interior space in a dense grid
    with a size of 60cm. In [11] a k-NN algorithm is proposed based on the Bluetooth
    fingerprint library location method also dividing the interior space selecting
    a grid with a size of 1m. The k-NN algorithm processes the matching of measured
    RSSI value and the closest value in the fingerprint library. The positioning accuracy
    is'
