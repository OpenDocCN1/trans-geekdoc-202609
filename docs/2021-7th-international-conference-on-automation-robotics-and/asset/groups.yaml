    ![](img/b77bbad6649946f384d2ca57e2480824_3_0.png)


    Fig. 6. Distribution of the prediction error (\(\epsilon\))


    # B. Phase Two


    In phase two we get the predicted distances from each Beacon as estimated using
    the corresponding model from phase one. With these predicted distances we create
    circles having as a center the known position of the Beacon and a radius equal
    to the predicted distance from the model. After that, we find the intersection
    points of all circles “Fig. 7” With blue color in “Fig. 7” we show the circles
    having as a center the five Beacons and radius the predicted distance from phase
    one, while the red dots are the intersection points.


    ![](img/b77bbad6649946f384d2ca57e2480824_3_1.png)


    Fig. 7. Phase two and three point calculation


    # C. Phase Three


    In the last phase, we get as input the intersection points from phase two and
    finds the Geometric median from the intersection points. The geometric media point
    is defined as the predicted location.


    In “Fig. 7” we indicate with the green cross the calculated geometric median point,
    which represents our location estimation and the cyan cross the real location.


    # VI. RESULTS


    From the results we present in this section, we can conclude that our system has
    been able to achieve good accuracy in predicting the real position of the user.
    In “Fig. 8”, we present the histogram of the distribution of the distance error
    (denoted with \(\epsilon\), in “Fig. 7”) between the actual and predicted positions.
    In “Table I” that follows we show the values of the error distribution. The error
    calculation is based on the set of 2222 measurements that was used for testing
    of the model estimation against the actual user position.


    We observed that our system has an average accuracy of 69.58cm and can predict
    the location with less than a meter accuracy in 80,55% of all cases and with an
    accuracy of fewer than 1.5 meters in 93.92% of the cases.


    ![](img/b77bbad6649946f384d2ca57e2480824_3_2.png)


    Fig. 8. Distance error (\(\epsilon\)) distribution


