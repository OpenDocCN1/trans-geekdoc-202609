    | | 0-25 | 25-50 | 50-75 | 75-100 | 100-125 | 125-150 | >150 |

    |---|---|---|---|---|---|---|---|

    | Count | 324 | 570 | 488 | 408 | 200 | 97 | 135 |

    | Percentage | 14.58 | 25.65 | 21.96 | 18.36 | 9.01 | 4.37 | 6.08 |


    # VII. CONCLUSION


    It is essential to develop a localization system that can achieve high levels
    of accuracy in building-scale real-world environments using low cost and ubiquitous
    technologies like those available in smartphones and Bluetooth devices. In this
    paper, we considered the challenges of developing a system by using RSSI from
    Bluetooth Beacons following a machine learning approach. We create a dataset with
    values from Bluetooth RSSI and train the neural network model to predict the distance
    from a specific Beacon. After that we use the'
