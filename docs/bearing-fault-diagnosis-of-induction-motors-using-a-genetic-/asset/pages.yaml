  md: '# Bearing Fault Diagnosis of Induction Motors Using a Genetic Algorithm and
    Machine Learning Classifiers


    Rafia Nishat Toma, Alexander E. Prosvirin and Jong-Myon Kim *


    School of Electrical, Electronics and Computer Engineering, University of Ulsan,
    Ulsan 44610, Korea; rafiatoma.eceku@gmail.com (R.N.T.); a.prosvirin@hotmail.com
    (A.E.P.)

    * Correspondence: jmkim07@ulsan.ac.kr; Tel.: +82-52-259-2217


    Received: 1 March 2020; Accepted: 27 March 2020; Published: 28 March 2020


    Abstract: Efficient fault diagnosis of electrical and mechanical anomalies in
    induction motors (IMs) is challenging but necessary to ensure safety and economical
    operation in industries. Research has shown that bearing faults are the most frequently
    occurring faults in IMs. The vibration signals carry rich information about bearing
    health conditions and are commonly utilized for fault diagnosis in bearings. However,
    collecting these signals is expensive and sometimes impractical because it requires
    the use of external sensors. The external sensors demand enough space and are
    difficult to install in inaccessible sites. To overcome these disadvantages, motor
    current signal-based bearing fault diagnosis methods offer an attractive solution.
    As such, this paper proposes a hybrid motor-current data-driven approach that
    utilizes statistical features, genetic algorithm (GA) and machine learning models
    for bearing fault diagnosis. First, the statistical features are extracted from
    the motor current signals. Second, the GA is utilized to reduce the number of
    features and select the most important ones from the feature database. Finally,
    three different classification algorithms namely KNN, decision tree, and random
    forest, are trained and tested using these features in order to evaluate the bearing
    faults. This combination of techniques increases the accuracy and reduces the
    computational complexity. The experimental results show that the three classifiers
    achieve an accuracy of more than 97%. In addition, the evaluation parameters such
    as precision, F1-score, sensitivity, and specificity show better performance.
    Finally, to validate the efficiency of the proposed model, it is compared with
    some recently adopted techniques. The comparison results demonstrate that the
    suggested technique is promising for diagnosis of IM bearing faults.


    Keywords: bearing fault diagnosis; condition monitoring; decision tree; genetic
    algorithm; induction motors; KNN


    # 1. Introduction


    Induction motors, also known as asynchronous motors, are generally used as prime
    movers in the manufacturing, transportation, petrochemical, and power systems
    industries because of their rugged design, ease of control, low cost, high reliability,
    high overload capability, and efficiency. Due to their long operating times, the
    motors are subjected to many electrical and mechanical stresses, so the possibility
    of faults cannot be ignored. The cause of a failure can be inherent to the machine
    or caused by the operating conditions. The initial fault results in motor failure,
    which leads to downtime and increased production loss if it is not diagnosed in
    the initial stages. To avoid major losses, fault diagnosis in induction motors
    has recently received extensive attention among researchers [1,2]. To reduce significant
    damage, lengthen machine life, increase machinery accessibility, and reduce breakdown
    maintenance, effective fault diagnosis and condition monitoring is important.
    Fault detection helps to avoid unexpected interruptions as well as fatal damage
    of the whole drive system, whereas condition monitoring ensures decreased maintenance
    costs and increased reliability [3].'
