    A comparison of the proposed method with other works is presented in Table 8.
    In [52], information fusion (IF) and deep learning techniques were applied on
    the same current signal dataset used in this work and achieved an accuracy of
    98.3% with Multilayer Perceptron (MLP). C. Lessmeier et al. [47] employed wavelet
    packet decomposition (WPD) for feature extraction and then applied ensemble learning
    on the motor current signal and achieved an accuracy of 86.03%. A similar type
    of research conducted in [53] has proposed a fault detection method for induction
    motors utilizing empirical wavelet transform and CNN achieved 97.37% accuracy,
    which is also comparable with our result. In [54], authors used a vibration signal
    and CNN for fault detection and diagnosis, achieving accuracy between 88–99% for
    different ratios of data. Another method proposed in [55] attained 98% and 100%
    accuracy for detecting rotor fault and bearing fault respectively when using a
    CNN. In comparison with these recent studies, our proposed method produced a comparable
    result using only statistical features and GA for feature extraction and selection
    leading to less computational complexity than the other methods.


