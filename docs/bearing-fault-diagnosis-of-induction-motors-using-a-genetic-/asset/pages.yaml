  md: '# 2.5. K-nearest Neighbor (KNN)


    After feature selection using GA, three different classifier algorithms are applied
    to classify the fault signature. To begin with, K-nearest neighbor (KNN) was chosen.
    This is a widely-used parametric classifier because of its simple architecture
    and low computational complexity [50]. It can also handle data with various characteristics,
    including nonlinear, multimodal, and non-Gaussian data. In the KNN classification
    algorithm, the position of the training samples is kept fixed, then for a new
    data sample, the distance between the training samples and the query data is measured.
    Using these distances, K samples are chosen from the training samples having the
    minimum distances. A distance metric, d, and a positive integer, K, act as decision
    making variables. The test data are assigned to the class with more samples in
    that region [51]. During the training process, the data remains in memory and
    for data with a very high dimension, the computational complexity is high. To
    reduce this complexity, we select the most informative and optimal features with
    a GA-based approach.


    For example, consider two or three features in a classification process. To find
    a result, draw a circle centered on the input location and take the radius containing
    K sample values. Then, the class having more sample values within that circle
    is the result. Figure 6 shows KNN in detail. Here, for K = 3, inside the small
    circle, there exist one square and two triangles, so the new sample will belong
    to the triangle class. Similarly, for K = 5 and K = 9, the result will be square
    and triangle, respectively. The optimum value of K is crucial in defining the
    number of neighbors and the distance matric. In this work, a wide range of K values
    is examined to determine the optimal value for the training samples.


    ![](img/bbd542ce3211efd9f703cba6c9a09b9b_9_0.png)


    Figure 6. KNN algorithm for a situation with two classes and two features.


    The Euclidean distance matrix is used to compute the distance matric, which is
    a simple way to implement this method in a multidimensional input space and provides
    better comparative results than other erudite machine learning methods. The Euclidean
    distance between two points, p and q, can be calculated with the equation given
    below.


    ```

    $$d_E = \sqrt{\sum_{i=1}^{n} (p_i - q_i)^2}.$$ (17)

    ```


    # 2.6. Decision Tree


    Among the various supervised learning models, some of the best and most-used methods
    are the tree-based techniques. They work well on both linear and non-linear systems
    because of their good stability and ease of interpretation, and most importantly,
    they allow for predictive modeling with high accuracy. A DT can be described as
    a graph that represents choices and their results in the form of a tree. This
    model consists of splitting processes, which divide a node into two or more sub-'
