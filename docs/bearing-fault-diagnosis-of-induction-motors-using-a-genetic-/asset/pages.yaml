- pgno: 12
  md: 'Here, sensitivity indicates how appropriately the model is detecting events
    in the positive class, whereas specificity measures how precise is the assignment
    to the positive class. Most of the time, sensitivity and precision are reported
    pairwise because type I errors are calculated by sensitivity and type II errors
    by precision. Finally, the F-measure is the harmonic mean of sensitivity and precision.


    # 3. Results ar Discussion


    In this section, the impacts of various GA parameters are discussed, then the
    performance of the classifier models is presented. To select the optimum values
    for the parameters of GA such as population size, mutation, and crossover, we
    have run the GA procedure for 100 generations.


    Figure 9a indicates that if a population size of 200 is chosen, the loss will
    be at minimum level of just below 5.7. For other population sizes, the loss is
    slightly higher than the minimum. Figure 9b shows that the loss curves follow
    the same trend regardless of the variations in the crossover probability. However,
    following the general practice of assigning the crossover probability within the
    range of 0.65 to 0.85, the crossover probability has been chosen to be 0.7 in
    this study.


    ![](img/bbd542ce3211efd9f703cba6c9a09b9b_12_0.png)


    Figure 9. Effect of varying the population size (a) and crossover probability
    (b).


    A similar pattern can be observed for the mutation probability as shown in Figure
    10a. It can be observed that after a certain number of generations, the values
    of loss curves become identical for different values of mutation probability.
    In this work, 0.03 was selected as the mutation probability value. For the fitness
    value estimation, the mean values began to converge as the generations increased,
    whereas the best fitness value remained the same at 2.6 × 104 after 15 generations.
    The list of finalized GA parameters is tabulated in Table 5.


    ![](img/bbd542ce3211efd9f703cba6c9a09b9b_12_1.png)


    Figure 10. Effect of varying the mutation probability for estimating loss (a)
    and generations for fitness value (b).'
