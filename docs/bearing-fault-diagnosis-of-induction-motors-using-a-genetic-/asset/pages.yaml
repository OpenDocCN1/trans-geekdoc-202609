    close to or overlap with noise frequencies and become difficult to distinguish,
    which creates problems in the detection of bearing faults [46]. Hence, when the
    bearing parameters are unknown and the inverter frequency changes, it becomes
    difficult to diagnose the bearing defects in an IM.


    # 2.2. Experimental Testbed and Dataset Acquisition


    The dataset used in this work is obtained from the Mechanical Engineering Construction
    and Drive Technology (KAt) Research datacenter of Paderborn University, Germany.
    The current signal dataset is produced from a test bed as shown in Figure 2, which
    consists of a 425 W permanent magnet synchronous motor controlled by a standard
    frequency inverter of switching frequency 16 kHz. The detailed experimental procedure
    is provided in [47]. Here, the test rig was operated under various working conditions
    to confirm its robustness as well as to investigate the impact of the operating
    parameters. To make the data more reliable, both real and artificially damaged
    bearings were used. Among the 32 different bearings used, six were healthy, 14
    were naturally damaged, and in the remaining 12, the damage was created artificially.
    Regarding bearing damage categorization, the specific criteria were set by the
    researchers in [47] that allowed for grouping the bearings into four categories,
    among them the first three categories described the bearing properties, whereas
    the last category that was called “damage” was prepared according to ISO 15243.
    Furthermore, the appropriate directions of geometrical sizes of the cracks in
    bearings were assigned according to VD1 3832 (2013). Moreover, in the original
    study, the measured data was verified by means of envelope analysis and machine
    learning-based classification.


    ![](img/bbd542ce3211efd9f703cba6c9a09b9b_4_0.png)


    Figure 2. Schematic diagram of signal measurement.


    The sets of bearings used in this dataset can be split into three groups based
    on their health state: healthy bearings, bearings with inner race faults, and
    bearings with an outer race fault. Four different operating conditions were created
    by varying the rotational speed, load torque, and radial force, as shown in Table
    1.'
