    # 2.7. Random Forest


    Random decision forests are one type of collective learning for both regression
    and classification. This technique works by constructing a multitude of decision
    trees during the training period, then defining the class which is the mode of
    the classification classes and predicting the mean value for regression of the
    individual tree. The advantage of RF over a decision tree is that it can overcome
    the overfitting problem. The number of trees, maximum depth, number of features
    in every split, and number of sample leaves are the significant parameters in
    RF. In most cases, the high number of trees helps to provide stable results for
    accurate calculation. Generally, the number of features controls the diversity
    of a tree in a forest such that a small number of features results in uncorrelated
    trees and a large value represents correlated trees. Therefore, a large number
    of trees can improve performance, but also increases the size and computational
    cost. In this work, a range of values for the abovementioned parameters are tested.
    The resulting diagram of random forest algorithm is provided in Figure 7b.


    ![](img/bbd542ce3211efd9f703cba6c9a09b9b_10_0.png)


    Figure 7. (a) Decision tree; (b) random forest architecture.


    # 2.8. Proposed Method


    In this work, motor current signals from two different phases under different
    operating conditions with the bearing sets of three health states are taken to
    form a large dataset. Then, 10 statistical features are extracted for each phase
    to build a feature matrix of 13600 × 20.


    GA is applied to select the discriminative features from this matrix to reduce
    its dimensions, which results in less computational complexity. Deciding the optimal
    number of features is crucial, as too many features may result in too much noise
    and with too few features, important information may be lost [20]. In this study,
    from the 20 extracted features, the GA selected a series of features (5, 6, 10,
    11, 12, 14, 16, and 18) which were combined to make different input subsets. The
    classification loss of KNN algorithm (K = 3) is used for constructing the fitness
    function. This results in the most suitable input based on the predicted accuracy
    of the classification models. Finally, these discriminative features selected
    by the proposed GA framework are used as the inputs to three different machine
    learning classification algorithms to perform the fault classification task. In
    this study, the feature matrix obtained after feature selection process is randomly
    split into the training and testing subsets in 70:30 ratio for training and validating
    the fault diagnosis capabilities of the'
