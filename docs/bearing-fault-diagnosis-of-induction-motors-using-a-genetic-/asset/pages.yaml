    # 2.9. Model Evaluation


    The feature set selected using GA is used as the input for the three different
    classifier algorithms discussed in the previous section. Of the different evaluation
    parameters, the confusion matrix, overall accuracy, sensitivity, specificity,
    prediction, and the F1-score are considered as the performance metrics in this
    work. The evaluation parameters are calculated by the equations provided in Table
    4.


    # Table 4. Performance evaluation parameters.


    | Precision = \(\frac{TP}{TP + FP}\) | (18) | Sensitivity = \(\frac{TP}{TP + FN}\)
    | (19) |

    | :--- | :--- | :--- | :--- |

    | Specificity = \(\frac{TN}{FP + TN}\) | (20) | F1 = 2 x \(\frac{\text{Precision}
    \times \text{Sensitivity}}{\text{Precision} + \text{Sensitivity}}\) | (21) |

    | Accuracy = \(\frac{TP + TN}{TP + FP + TN + FN}\) | (22) | | |'
