- pgno: 1
  md: 'Any of the components in an induction motor can be damaged by overloading,
    abrasion, unbalanced loads, or electrical stress. Motor faults are categorized
    into four groups: bearing, stator, rotor faults, and other faults [4]. Of these,
    the possibility of incurring a bearing fault is the highest, which is more than
    40% as discovered in research by General Electric Co. and IEEE-IGA [5], which
    indicates that bearing faults are the main cause of motor failures. This supports
    the fact that bearing fault diagnosis is important in the condition monitoring
    of rotating machinery.


    Machine-learning-based condition monitoring systems work by utilizing the historical
    data collected from the machine through various sensors under different working
    conditions. Feature extraction techniques are then applied to the raw signals
    to create a feature matrix, and finally the models are trained by these features.
    The sensor output signals are essentially time series signals, and features are
    generally extracted using different frequency domain, time domain, or time-frequency
    domain analysis techniques. The frequency domain analysis techniques include envelope
    analysis [6] and high-order spectral analysis [7]. Time domain analysis techniques
    comprise root mean square, high-order statistics, and the short impulse method
    [8,9]. Time-frequency analysis techniques include wavelet transform, short-time
    Fourier transform, and Hilbert-Hung transform [10,11]. A basic understanding of
    motor health can be determined from time-domain analysis and is easy to implement,
    whereas frequency domain techniques are able to distinguish a characteristic frequency
    of the fault from noise because they lack sensitivity to noise. Another advantage
    of using frequency domain signals is that no previous information is required
    to determine the signature features [12,13]. However, frequency domain analysis
    is not suitable for non-stationary signals, which is the most common type of signal.
    Time-frequency analysis is gaining in popularity as it performs well for both
    stationary and nonstationary signals [14].


    Various techniques have been investigated for the detection and diagnosis of motor
    faults, such as vibration analysis [15–17], electromagnetic field monitoring [18],
    motor current signal analysis (MCSA), chemical analysis, infrared signal analysis,
    acoustic signal analysis [19], and partial discharge measurement [20]. Vibration
    signal analysis has been a consistently used approach, however, it requires the
    use of costly vibration sensors. In addition, the placement and installation of
    sensors in the precise positions to pick up the vibration signals is a challenge.
    Furthermore, the surroundings may induce noise which makes the sensor readings
    unreliable.


    Alternatively, MCSA has gained attention due to some advantages compared with
    vibration monitoring. MCSA uses the embedded current signal of the control unit
    of the motor, thus no additional sensors are needed, which results in low cost
    and a less complex system. By using the current signal, it is possible to remotely
    monitor a large number of motors from one place. Additionally, the faulty motor
    signals are quite unique and not easily affected by the surrounding working environment.
    Many studies have verified the trustworthiness of using MCSA to detect and diagnose
    motor faults. The stator current has recently been studied for use in fault diagnosis.
    In [21], a method is proposed using permanent magnet synchronous machines (PMSMs)
    based on the statistical analysis of the harmonics of the stator current. Bearing
    damage is evaluated using wavelet and short time Fourier transforms and the stator
    current. Single broken rotor bar (BRB) faults are effectively diagnosed using
    MCSA in [22–24]. Stator-current-based diagnosis is mostly used in machine learning
    methods for fault detection [25]. Both the stator current and voltage are used
    with machine learning approaches in [26].


    Another powerful computational algorithm for fault detection is independent component
    analysis (ICA). The main advantage of this method is that the multivariate signal
    is divided into additive subcomponents by evaluating the mutual statistical independence
    of signals acquired from non-Gaussian sources [27–29]. Because statistically independent
    components are extracted, ICA captures important data structures and includes
    signal separation and feature extraction. Many researchers have used ICA for fault
    diagnosis in induction motors [12]. Widodo et al. [30] used a support vector machine
    for fault diagnosis with 10 features extracted from a total of 78 vibration signals
    using the ICA method. Interest in the use of artificial intelligence (AI) techniques
    in the process of fault diagnosis is growing. In the motor condition monitoring
    sector, the most frequently used AI technique is the artificial neural network
    (ANN) because of its excellent pattern recognition'
