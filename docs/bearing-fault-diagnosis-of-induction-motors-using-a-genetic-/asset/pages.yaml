  img_proc: true
- pgno: 3
  md: '![](img/bbd542ce3211efd9f703cba6c9a09b9b_3_0.png)


    **Figure 1.** Bearing fault conditions. (a) bearing crack on the outer surface;
    (b) bearing crack on the inner surface.


    When a ball passes through a damaged point in a defective bearing, shock pulses
    having a characteristic frequency occur. The characteristic frequency can be calculated
    using the geometry of the rolling element and the rotational frequency, \(f_m\).
    The fault causes vibrations that introduce anomalies into the air-gap flux density,
    causing an aberrance in the harmonics of the current signal. This change in the
    current signal indicates that bearing faults have occurred. The different characteristic
    frequencies for each fault mentioned in [4] are listed below.


    Outer race defect:


    \(f_{outer}=\frac{N_{ball}}{2}\cdot f_m\cdot\left(1-\frac{D_{ball}}{D_{cage}}\cdot
    cos\beta\right)\) (1)


    Inner race defect:


    \(f_{outer}=\frac{N_{ball}}{2}\cdot f_m\cdot\left(1-\frac{D_{ball}}{D_{cage}}\cdot
    cos\beta\right)\) (2)


    Ball defect:


    \(f_{ball}=f_m\frac{D_{cage}}{D_{ball}}\left(1-\frac{D^2_{ball}}{D^2_{cage}}cos^2\beta\right)\)
    (3)


    Cage defect:


    \(f_{cage}=\frac{1}{2}\cdot f_m\cdot\left(1-\frac{D_{ball}}{D_{cage}}\cdot cos\beta\right)\)
    (4)


    where \(\beta\) is the contact angle of the balls, \(Nball\) is the number of
    balls or cylindrical rollers, \(Dball\) is the diameter of the ball, and \(Dcage\)
    is the cage diameter, which is also known as the roller or ball pitch diameter.
    The detail ball bearing geometry is described in [42].


    A radial motion occurs between the stator and rotor due to bearing damage, which
    produces oscillations and induces characteristic fault frequencies into the current
    signals. The reason behind this is that the bearing defects cause radial displacement
    of the rotor relative to stator. It results in the fluctuations of the rotating
    eccentricity and load torque. This leads to variation in machine inductances causing
    amplitude, frequency and phase modulation of the motor-current signals. The motor
    current equation for a faulty bearing is provided in [43,44] as:


    \(i(t)=\sum_{k=1}^{\infty} i_k\cdot cos(\omega_{c_k}\cdot t+\varphi)\) (5)


    where \(\varphi\) and \(\omega_{c_k}\) denote the phase angle and angular velocity,
    respectively, and \(\omega_{c_k}=\frac{2\pi f_{bearing}}{p}\).

    Here, \(f_{bearing}\) is the fault current harmonic frequency, and \(p\) denotes
    the pole pair number of the respective machine. Note that \(f_{bearing}\) can
    be written as:'
