  md: '# 2.3. Feature Extraction


    Feature extraction reduces the dimension of the initial raw data by converting
    it into smaller, more manageable groups for further processing. Most of the time,
    the raw dataset contains a high number of variables, thus requiring a large amount
    of computing resources to process. The main goal of this method is to select and
    convert the variables into features, effectively compacting the data which must
    be processed and precisely describing the original raw data set. Recently, on-line
    diagnosis for condition monitoring has gained attention because of its ability
    to detect incipient faults. However, a small amount of data is not enough for
    diagnosis, so directly measured signals are not adequate for on-line use. For
    effective fault diagnosis, a large data sample is required. Thus, to make the
    calculation easy, feature extraction becomes a crucial step that reserves critical
    information for final decision making.


    Ten classical statistical feature parameters for condition assessment were computed
    from the time domain data. The time domain features extracted from the signal
    are mean, median, standard deviation, variance, sum, skewness, kurtosis, energy,
    root mean square, and crest factor. The mean is the average of the available data
    points and median is the number located at the middle when the data points are
    arranged in ascending order. Mean and median both are measures of central tendency,
    but median is not sensitive to outliers. Standard deviation and variance are the
    measures of variability. Variance is the average squared differences of the values
    in a data set from the mean. It indicates how far the data points are spread from
    the mean. Standard deviation is obtained by taking the square root of the variance.
    It is a statistic of dispersion of observations within a data set. The degree
    of distortion of a normal distribution is measured by skewness, which differentiates
    extreme values in one versus the other tail, which also represents lack of symmetry
    of a data set. However, kurtosis measures the existing outliers in the distribution.
    Finally, the crest factor represents the ratio of peak value to the effective
    value of any dataset. The mathematical equations for the described statistical
    features are listed in Table 3. Here, x<sub>i</sub> i=1, 2, ..., N represents
    the motor current signal. N, μ and σ represent the number of data points, mean
    and standard deviation respectively. The time-domain features contain statistical
    details about the type of current signal, and because of their sensitivities,
    are good quality features [48].


    # Table 3. Extracted statistical features from time domains for the feature matrix
    (x is the current signal).


    | Statistical Feature | Equation | Statistical Feature | Equation |

    |---|---|---|---|

    | Mean: | μ = 1/N Σ<sub>i=1</sub><sup>N</sup> x<sub>i</sub> (7) | Skewness: |
    x<sub>skewness</sub> = 1/N [Σ<sub>i=1</sub><sup>N</sup>(x<sub>i</sub> - μ)<sup>3</sup>]
    / σ<sup>3</sup> (8) |

    | Median: | median = ((N+1)/2)<sup>th</sup> value (9) | Kurtosis: | x<sub>kurtosis</sub>
    = 1/N [Σ<sub>i=1</sub><sup>N</sup>(x<sub>i</sub> - μ)<sup>4</sup>] / σ<sup>4</sup>
    (10) |

    | Standard Deviation: | σ = √[Σ<sub>i=1</sub><sup>N</sup>(x<sub>i</sub> - μ)<sup>2</sup>
    / (N-1)] (11) | Energy: | E = Σ<sub>i=1</sub><sup>N</sup> x<sub>i</sub><sup>2</sup>
    (12) |

    | Variance: | σ<sup>2</sup> = Σ<sub>i=1</sub><sup>N</sup>(x<sub>i</sub> - μ)<sup>2</sup>
    / (N-1) (13) | RMS: | X<sub>rms</sub> = √[Σ<sub>i=1</sub><sup>N</sup> x<sub>i</sub><sup>2</sup>]
    / N (14) |

    | Sum: | Sum = Σ<sub>i=1</sub><sup>N</sup> x<sub>i</sub> (15) | Crest factor:
    | C<sub>f</sub> = X<sub>max</sub> / X<sub>min</sub> (16) |


    # 2.4. Feature Selection with Genetic Algorithm


    Feature selection is the process of detecting and eliminating irrelevant, less
    useful, and redundant features, and of discovering the most appropriate inputs
    for a classification model. A GA,'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'proposed by J. H. Holland, uses a heuristic search that provides a satisfactory
    balance between computational complexity and optimal selection [49] and is effective
    for feature selection. It is a stochastic method for optimizing functions that
    is dependent on the mechanics of natural genetics and biological evolution and
    is able to discover accumulating information about a primarily unknown search
    space. It can be applied to high-dimensional data without any specific knowledge
    of the problem under study and can easily be parallelized in computer clusters.


    The overall process of GA-based feature selection is provided in Figure 5. The
    initial population is created with the feature vector. Each member in the population
    is called a chromosome. The next crucial step is the selection of an appropriate
    evaluation function for successful application of GA to the problem domain. Each
    chromosome is assessed and categorized depending on how well it satisfies the
    objective function, and finally it is assigned to a probability of reproduction.
    In the selection process, the fittest individuals are selected to inherit the
    best characteristics. Several algorithms are applied in this process: c wheel
    selection, tournament selection, uniform selection, and remainder selection. Next,
    in the crossover stage, the next generation is formed by a simulated mating process
    and combines the best features of the parents. Once the children are generated
    in this crossover process, the mutation operation, which is a random modification
    of genes during reproduction, is applied to each child. This helps the children
    to inherit the best characteristics of their parents, and finally, a better solution
    to the problem will emerge. This process is then repeated with the new population
    until certain criteria are achieved. The algorithm ends when the population congregates
    at the optimal solution, or the highest number of generations is completed.


    ![](img/bbd542ce3211efd9f703cba6c9a09b9b_8_0.png)


    Figure 5. A flow chart of a genetic algorithm optimization.'
  merge: -1
  img_proc: true
