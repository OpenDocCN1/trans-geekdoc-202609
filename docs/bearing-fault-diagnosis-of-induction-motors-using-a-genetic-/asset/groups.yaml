    and speed up operations, genetic algorithm (GA) is an effective technique to select
    the most appropriate features for the fault diagnosis model.


    There are several feature selection approaches in practice, but GA is gaining
    popularity. It is a heuristic algorithm for finding the best subset of features
    and is particularly suitable for high-dimensional datasets for which an exhaustive
    search is not feasible. It selects the most relevant and discriminative features
    from the set of the originally extracted features. GAs have largely been used
    in image classification, as in [37] and [38], where a GA is applied to find the
    best features for an apple leaf classification and breast cancer diagnosis, respectively.
    They are also used for optimal feature selection from fNIR signals [39] and in
    text classification [40]. The application of GA to fault classification is relatively
    new. In [41], this approach is used for fault diagnosis in spur gears from vibration
    signals. In the induction motor fault classification, principle component analysis
    (PCA) is commonly studied for use in feature selection and there are plans to
    apply GA and observe the outcome.


    In this research, a motor current signal is used to classify bearing faults for
    three conditions: bearings with an inner race fault, with an outer race fault,
    and a healthy bearing. To reduce the data dimension, the set of statistical features
    was extracted from the raw time-series signals and GA was applied to determine
    the most significant features for the classification model. Finally, three widely
    used classification models were trained using the discriminative feature subsets
    selected by GA. The conclusive results and comparison indicate that the selected
    features converged quickly during the training state and therefore provided good
    performance in the classification models.


    This majorly focuses on the following aspects:


    - (i) Condition monitoring and fault classification of induction motors utilizing
    motor current signal analysis approach

    - (ii) Utilization of GA to select significant features from a collection of time-domain
    features and ensure acceptable results from the reduced feature set with the inclusive
    model.

    - (iii) This work investigates optimization parameters for GA as well as for the
    three different classifiers, k-nearest neighbor (KNN), decision trees (DT), and
    random forest (RF), to achieve good performance in comparison with other researches.


    The rest of this paper is organized as follows: Section 2 presents materials and
    methods, including information about the experimental testbed and dataset, feature
    extraction and selection methods, classification techniques, and finally, the
    proposed method used in this study. Section 3 presents our results validating
    the proposed method and comparisons with existing methods. Finally, conclusions
    are provided in Section 4.


    ## 2. Materials and Methods


    ### 2.1. Bearing Fault Signatures


    Bearing faults are the most commonly occurring faults in IMs as shown in the previous
    section. Generally, rolling bearings are made up of an inner and an outer race
    which are separated by cylindrical rollers and balls. Damage like flaking and
    pitting can occur because of material fatigue or wearing [4] in any of these parts.
    In our analysis, we consider two bearing fault conditions, inner race and outer
    race fault, are illustrated in Figure 1.


    ![](img/bbd542ce3211efd9f703cba6c9a09b9b_3_0.png)


    **Figure 1.** Bearing fault conditions. (a) bearing crack on the outer surface;
    (b) bearing crack on the inner surface.


    When a ball passes through a damaged point in a defective bearing, shock pulses
    having a characteristic frequency occur. The characteristic frequency can be calculated
    using the geometry of the rolling element and the rotational frequency, \(f_m\).
    The fault causes vibrations that introduce anomalies into the air-gap flux density,
    causing an aberrance in the harmonics of the current signal. This change in the
    current signal indicates that bearing faults have occurred. The different characteristic
    frequencies for each fault mentioned in [4] are listed below.


    Outer race defect:


    \(f_{outer}=\frac{N_{ball}}{2}\cdot f_m\cdot\left(1-\frac{D_{ball}}{D_{cage}}\cdot
    cos\beta\right)\) (1)


    Inner race defect:


    \(f_{outer}=\frac{N_{ball}}{2}\cdot f_m\cdot\left(1-\frac{D_{ball}}{D_{cage}}\cdot
    cos\beta\right)\) (2)


    Ball defect:


    \(f_{ball}=f_m\frac{D_{cage}}{D_{ball}}\left(1-\frac{D^2_{ball}}{D^2_{cage}}cos^2\beta\right)\)
    (3)


    Cage defect:


    \(f_{cage}=\frac{1}{2}\cdot f_m\cdot\left(1-\frac{D_{ball}}{D_{cage}}\cdot cos\beta\right)\)
    (4)


    where \(\beta\) is the contact angle of the balls, \(Nball\) is the number of
    balls or cylindrical rollers, \(Dball\) is the diameter of the ball, and \(Dcage\)
    is the cage diameter, which is also known as the roller or ball pitch diameter.
    The detail ball bearing geometry is described in [42].


    A radial motion occurs between the stator and rotor due to bearing damage, which
    produces oscillations and induces characteristic fault frequencies into the current
    signals. The reason behind this is that the bearing defects cause radial displacement
    of the rotor relative to stator. It results in the fluctuations of the rotating
    eccentricity and load torque. This leads to variation in machine inductances causing
    amplitude, frequency and phase modulation of the motor-current signals. The motor
    current equation for a faulty bearing is provided in [43,44] as:


    \(i(t)=\sum_{k=1}^{\infty} i_k\cdot cos(\omega_{c_k}\cdot t+\varphi)\) (5)


    where \(\varphi\) and \(\omega_{c_k}\) denote the phase angle and angular velocity,
    respectively, and \(\omega_{c_k}=\frac{2\pi f_{bearing}}{p}\).

    Here, \(f_{bearing}\) is the fault current harmonic frequency, and \(p\) denotes
    the pole pair number of the respective machine. Note that \(f_{bearing}\) can
