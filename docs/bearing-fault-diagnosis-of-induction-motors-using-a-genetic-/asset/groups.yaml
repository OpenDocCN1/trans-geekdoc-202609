    ## 感应电动机轴承故障诊断：基于遗传算法和机器学习分类器


    Rafia Nishat Toma, Alexander E. Prosvirin 和 Jong-Myon Kim *


    蔚山大学电气、电子和计算机工程学院，蔚山 44610, 韩国；rafiatoma.eceku@gmail.com (R.N.T.); a.prosvirin@hotmail.com
    (A.E.P.)

    * 通信作者：jmkim07@ulsan.ac.kr；电话：+82-52-259-2217


    收稿日期：2020 年 3 月 1 日；录用日期：2020 年 3 月 27 日；发表日期：2020 年 3 月 28 日


    摘要：确保工业安全和经济运行，对感应电动机（IM）中电气和机械异常进行高效故障诊断既具有挑战性又十分必要。研究表明，轴承故障是 IM 中最常见的故障。振动信号包含丰富的轴承健康状况信息，常用于轴承故障诊断。然而，收集这些信号成本高昂，有时不切实际，因为需要使用外部传感器。外部传感器需要足够的空间，且在难以到达的位置安装困难。为克服这些缺点，基于电机电流的轴承故障诊断方法提供了一种有吸引力的解决方案。为此，本文提出了一种混合电机电流数据驱动方法，利用统计特征、遗传算法（GA）和机器学习模型进行轴承故障诊断。首先，从电机电流信号中提取统计特征。其次，利用
    GA 从特征数据库中减少特征数量并选择最重要的特征。最后，利用这些特征训练和测试三种不同的分类算法，即 KNN、决策树和随机森林，以评估轴承故障。这种技术组合提高了准确性并降低了计算复杂度。实验结果表明，三个分类器的准确率均超过
    97%。此外，精确率、F1 分数、灵敏度和特异度等评估参数显示出更好的性能。最后，为验证所提模型的效率，将其与一些近期采用的技术进行了比较。比较结果表明，所提技术有望用于
    IM 轴承故障的诊断。


    关键词：轴承故障诊断；状态监测；决策树；遗传算法；感应电动机；KNN


    ## 1. 引言


    感应电动机，又称异步电动机，因其坚固的设计、易于控制、低成本、高可靠性、高过载能力和高效率，通常被用作制造、运输、石化和电力系统行业的原动机。由于长时间运行，电动机承受许多电气和机械应力，因此故障的可能性不可忽视。故障原因可能源自机器本身，或由运行条件引起。初始故障会导致电动机失效，若未在早期诊断，将导致停机和产量增加损失。为避免重大损失，感应电动机故障诊断近年来受到研究人员的广泛关注
    [1,2]。为减少重大损坏、延长机器寿命、提高机械可用性并减少故障维护，有效的故障诊断和状态监测非常重要。故障检测有助于避免意外中断以及整个传动系统的致命损坏，而状态监测则确保降低维护成本并提高可靠性
    [3]。


    感应电动机的任何部件都可能因过载、磨损、不平衡负载或电应力而损坏。电动机故障分为四类：轴承、定子、转子故障及其他故障 [4]。其中，轴承故障的可能性最高，通用电气公司和
    IEEE-IGA 的研究发现其超过 40% [5]，这表明轴承故障是电动机失效的主要原因。这支持了轴承故障诊断在旋转机械状态监测中的重要性。


    基于机器学习的状态监测系统通过利用机器在不同工作条件下通过各种传感器收集的历史数据来工作。然后对原始信号应用特征提取技术以创建特征矩阵，最后使用这些特征训练模型。传感器输出信号本质上是时间序列信号，特征通常使用不同频域、时域或时频域分析技术提取。频域分析技术包含包络分析
    [6] 和高阶谱分析 [7]。时域分析技术包含均方根、高阶统计和短脉冲法 [8,9]。时频分析技术包含小波变换、短时傅里叶变换和希尔伯特-黄变换 [10,11]。可通过时域分析确定电动机健康状况的基本了解，且易于实现；而频域技术能够将故障特征频率与噪声区分开，因为它们对噪声不敏感。使用频域信号的另一个优点是，确定签名特征无需任何先前信息
    [12,13]。然而，频域分析不适用于非平稳信号，而非平稳信号是最常见的信号类型。时频分析日益流行，因为它对平稳和非平稳信号都表现良好 [14]。


    已有多种技术用于电动机故障的检测和诊断，例如振动分析 [15–17]、电磁场监测 [18]、电机电流信号分析（MCSA）、化学分析、红外信号分析、声信号分析
    [19] 和局部放电测量 [20]。振动信号分析一直是一个持续使用的方法，但需要使用昂贵的振动传感器。此外，在精确位置放置和安装传感器以拾取振动信号是一项挑战。而且，环境可能引入噪声，使传感器读数不可靠。


    作为替代方案，MCSA 由于相较于振动监测具有一些优势而受到关注。MCSA 使用电动机控制单元中嵌入的电流信号，因此不需要额外传感器，从而成本低且系统复杂性较低。通过使用电流信号，可以从一个地点远程监控大量电动机。此外，故障电动机信号非常独特，不易受周围工作环境影响。许多研究已验证使用
    MCSA 检测和诊断电动机故障的可靠性。定子电流最近被研究用于故障诊断。在 [21] 中，提出了一种基于永磁同步电机（PMSM）定子电流谐波统计分析的方法。使用小波和短时傅里叶变换以及定子电流评估轴承损坏。在
    [22–24] 中，使用 MCSA 有效诊断单根转子条断裂（BRB）故障。基于定子电流的诊断主要用于故障检测的机器学习方法 [25]。在 [26] 中，定子电流和电压均与机器学习方法一起使用。


    故障检测的另一种强大计算算法是独立成分分析（ICA）。该方法的主要优点是，通过评估从非高斯源获取的信号之间的相互统计独立性，将多变量信号分解为加性子成分 [27–29]。由于提取了统计独立成分，ICA
    捕获重要的数据结构，并包含信号分离和特征提取。许多研究人员已使用 ICA 进行感应电动机故障诊断 [12]。Widodo 等人 [30] 使用支持向量机进行故障诊断，从总共
    78 个振动信号中使用 ICA 方法提取了 10 个特征。在故障诊断过程中使用人工智能（AI）技术的兴趣日益增长。在电动机状态监测领域，最常用的 AI 技术是人工神经网络（ANN），因为其具有出色的模式识别能力。


    '
