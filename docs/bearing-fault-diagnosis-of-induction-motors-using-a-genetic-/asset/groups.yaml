    ## 2.3. 特征提取


    特征提取通过将初始原始数据转换为更小、更易管理的组以供进一步处理，从而降低其维度。在大多数情况下，原始数据集包含大量变量，因此需要大量计算资源进行处理。该方法的主要目标是选择并将变量转换为特征，有效压缩必须处理的数据并精确描述原始数据集。近来，由于在线状态监测能够检测初期故障，因此受到关注。然而，少量数据不足以进行诊断，因此直接测量的信号不适合在线使用。为了进行有效的故障诊断，需要大量数据样本。因此，为了简化计算，特征提取成为保留最终决策所需关键信息的关键步骤。


    从时域数据计算了十种用于状态评估的经典统计特征参数。从信号中提取的时域特征包括均值、中位数、标准差、方差、和、偏度、峭度、能量、均方根和峰值因子。均值是可用数据点的平均值，中位数是将数据点按升序排列后位于中间的数值。均值和中位数都是集中趋势的度量，但中位数对异常值不敏感。标准差和方差是变异性的度量。方差是数据集中各值与均值之间的平均平方差。它指示数据点与均值的分散程度。标准差是通过对方差开平方根得到的。它是数据集内观测值离散程度的统计量。正态分布的歪度程度由偏度衡量，偏度区分一侧尾部与另一侧尾部的极端值，也表示数据集的对称性缺失。然而，峭度衡量分布中现有的异常值。最后，峰值因子表示任何数据集中峰值与有效值的比率。所描述统计特征的数学方程列于表
