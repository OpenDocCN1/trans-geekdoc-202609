    ## 2. 材料与方法


    ### 2.1. 轴承故障特征


    如前一节所示，轴承故障是感应电机 (IM) 中最常见的故障。通常，滚动轴承由内圈和外圈组成，两者由圆柱滚子和球体分离。由于材料疲劳或磨损 [4]，这些部件中的任何部位都可能发生剥落和点蚀等损伤。在我们的分析中，考虑了两种轴承故障情况，即内圈故障和外圈故障，如图
    1 所示。


    ![](img/bbd542ce3211efd9f703cba6c9a09b9b_3_0.png)


    **图 1。**轴承故障情况。(a) 外表面轴承裂纹；(b) 内表面轴承裂纹。


    当球体通过有缺陷轴承中的损伤点时，会产生具有特征频率的冲击脉冲。特征频率可以根据滚动体的几何结构和旋转频率 \(f_m\) 来计算。故障会引起振动，将异常引入气隙磁通密度，导致电流信号谐波出现失常。电流信号的这种变化表明已发生轴承故障。文献
    [4] 中提到的各种故障的不同特征频率如下列所示。


    外圈缺陷：


    \(f_{outer}=\frac{N_{ball}}{2}\cdot f_m\cdot\left(1-\frac{D_{ball}}{D_{cage}}\cdot
    cos\beta\right)\) (1)


    内圈缺陷：


    \(f_{outer}=\frac{N_{ball}}{2}\cdot f_m\cdot\left(1-\frac{D_{ball}}{D_{cage}}\cdot
    cos\beta\right)\) (2)


    球体缺陷：


    \(f_{ball}=f_m\frac{D_{cage}}{D_{ball}}\left(1-\frac{D^2_{ball}}{D^2_{cage}}cos^2\beta\right)\)
    (3)


    笼架缺陷：


    \(f_{cage}=\frac{1}{2}\cdot f_m\cdot\left(1-\frac{D_{ball}}{D_{cage}}\cdot cos\beta\right)\)
    (4)


    其中，\(\beta\) 为球体的接触角，\(Nball\) 为球体或圆柱滚子的数量，\(Dball\) 为球体直径，\(Dcage\) 为笼架直径（也称为滚子或球节圆直径）。详细的滚珠轴承几何结构在文献
    [42] 中有所描述。


    由于轴承损坏，定子和转子之间发生径向运动，产生振荡并将特征故障频率感应到电流信号中。其原因在于轴承缺陷导致转子相对于定子产生径向位移。这会引起旋转偏心率和负载扭矩的波动。这进而导致机器电感变化，引起电机电流信号的幅度、频率和相位调制。有缺陷轴承的电机电流方程在文献
    [43,44] 中给出如下：


    \(i(t)=\sum_{k=1}^{\infty} i_k\cdot cos(\omega_{c_k}\cdot t+\varphi)\) (5)


    其中，\(\varphi\) 和 \(\omega_{c_k}\) 分别表示相位角和角速度，且 \(\omega_{c_k}=\frac{2\pi f_{bearing}}{p}\)。

    这里，\(f_{bearing}\) 是故障电流谐波频率，\(p\) 表示相应机器的极对数。请注意，\(f_{bearing}\) 可表示为：


    其中，$f_s$ 为供电频率或基频，$m = 1, 2, 3, ...$ 表示谐波指数，而 $f_v$ 可以是内圈缺陷频率 $f_{inner}$ 或外圈缺陷频率
    $f_{outer}$。估计的故障特征频率可以使用文献 [45] 中提出的频率自动搜索算法计算。有时，轴承故障产生的谐波可能接近或与噪声频率重叠，难以区分，这给轴承故障检测带来了问题
    [46]。因此，当轴承参数未知且逆变器频率发生变化时，诊断感应电机 (IM) 中的轴承缺陷变得困难。


    ### 2.2. 实验测试平台与数据集获取


    本工作所使用的数据集源自德国帕德博恩大学机械工程结构与驱动技术 (KAt) 研究数据中心。电流信号数据集由如图 2 所示的测试平台产生，该平台由一台 425
    W 永磁同步电机组成，由开关频率为 16 kHz 的标准变频器控制。详细的实验程序在文献 [47] 中提供。在此，测试台在各种工作条件下运行，以验证其鲁棒性并研究操作参数的影响。为使数据更可靠，同时使用了真实轴承和人工损坏轴承。在所使用的
    32 个不同轴承中，6 个健康，14 个自然损坏，其余 12 个人工损坏。关于轴承损坏分类，文献 [47] 中的研究人员设定了具体标准，使轴承被分为四个类别，其中前三个类别描述了轴承特性，而最后一个名为“损坏”的类别则是根据
    ISO 15243 制备的。此外，根据 VDI 3832 (2013)，为轴承裂纹的几何尺寸分配了适当的方向。而且，在原始研究中，通过包络分析和基于机器学习的分类对测量数据进行了验证。


