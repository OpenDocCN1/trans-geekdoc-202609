    如表所示，当仅使用从一相电流信号中提取的 10 个统计特征参数来诊断轴承故障时，KNN、DT 和 RF 分类器达到的分类精度相较于所提方法有所下降，分别为
    89.7%、91.03% 和 91.1%。由此可得出结论，使用两相信号构建的所提特征模型在故障分类性能上优于仅利用一相信号进行特征提取的模型。


    所提方法与其他研究的对比显示于表 8 中。在文献 [52] 中，信息融合（IF）和深度学习技术应用于本工作所用的相同电流信号数据集，并利用多层感知机（MLP）达到了
    98.3% 的准确率。C. Lessmeier 等人 [47] 采用小波包分解（WPD）进行特征提取，随后在电机电流信号上应用集成学习，达到了 86.03%
    的准确率。文献 [53] 中开展的类似研究提出了一种采用经验小波变换和 CNN 的感应电机故障检测方法，达到了 97.37% 的准确率，这也与我们的结果可比。在文献
    [54] 中，作者使用振动信号和 CNN 进行故障检测和诊断，针对不同比例的数据达到了 88–99% 的准确率。文献 [55] 中提出的另一种方法在使用 CNN
    时，对转子故障和轴承故障分别达到了 98% 和 100% 的准确率。与这些近期研究相比，我们的所提方法仅使用统计特征和 GA 进行特征提取与选择，便产生了可比的结果，且计算复杂度低于其他方法。


    表 8. 不同方法的准确率对比。


    | 诊断方法 | 分类准确率 (%) |

    |---|---|

    | 基于 MLP 的 IF [52] | 98.3 |

    | 基于 SVM 的 IF [52] | 98.0 |

    | 基于 KNN 的 IF [52] | 97.7 |

    | 带 EWT 的 CNN [53] | 97.37 |

    | 带生成过采样的 CNN（振动信号） [54] | 88.0–99.0 |

    | CNN（振动信号） [55] | 98.0–100 |

    | WPD + 集成学习 [47] | 86.03 |

    | GA + KNN | 97.0 |

    | GA + DT | 98.0 |

    | GA + RF | 99.7 |


    ## 4. 结论


    本文提出了一种基于统计特征、遗传算法（GA）和机器学习技术相结合的电机电流数据驱动方法，用于感应电机（IM）轴承故障诊断。为探究有效特征，使用电机电流信号作为原始输入提取了
    20 个统计特征。利用 GA 选择了 8 个特征，用于训练三种不同的分类器进行故障诊断。在特征选择方面，为 GA 选取了最合适的遗传参数，并开展了一系列模拟以寻找分类模型的最佳准确率。主要目标是减少冗余数据和原始数据集的维度，从而降低模型的功耗和计算复杂度。所提系统使用三种不同电机状态的电流信号进行了测试。一种状态为健康状态，其他条件包括两种不同的轴承故障（内圈和外圈）。故障分类的总体准确率令人满意，表明所提方法对于实时应用具有前景。此外，为验证该模型的有效性，提出了与同一数据集及多个不同数据集上的部分近期研究进行对比，对比表明，所提方法仅采用简单统计特征，即可达到与其他方法相当的准确率，同时所需的计算复杂度更低。如果考虑振动信号，最先进的
    CNN 架构获得的准确率也与本文中使用电流信号所取得的结果相当。这表明，无传感器系统采集的电流信号与传统基于传感器的系统一样有效。在未来的研究工作中，我们将探讨频域分析在利用
    IM 电流信号诊断滚动轴承方面对所提方法的适用性。此外，我们将在其他数据集上验证所提方法的适用性，这些数据集中考虑使用电流信号诊断机械故障。


