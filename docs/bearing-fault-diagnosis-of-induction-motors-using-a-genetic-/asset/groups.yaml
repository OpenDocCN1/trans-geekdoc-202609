    ## 2.6. 决策树


    在各种监督学习模型中，一些最佳且最常用的方法是基于树的技术。


    它们由于具有良好的稳定性和易于解释，在线性和非线性系统上均能很好地工作，最重要的是，它们允许进行高精度的预测建模。


    决策树可描述为以树状形式表示选择及其结果的图。


