    ## 4. Conclusions


    In this paper, a motor-current data-driven approach based on a combination of
    statistical features, GA, and machine learning techniques is proposed for IM bearing
    fault diagnosis. To investigate the effective features, 20 statistical features
    are extracted using the motor current signal as the original input. Eight features
    are selected using GA, which are used to train three different classifiers for
    fault diagnosis. For feature selection, the most suitable genetic parameters for
    GA are selected, and a series of simulations is conducted to find the best accuracy
    using the classification models. The main goal is to reduce redundant data and
    the dimension of the original data set, resulting in less power and computational
    complexity for the models. The proposed system was tested using only the current
    signals from three different motor states. One condition is the healthy state,
    and the other conditions include two different bearing faults (inner race and
    outer race). The overall accuracy of fault classification is satisfactory, showing
    that the proposed method is promising for real time application. Additionally,
    to authenticate the efficacy of this model, a comparison with some recent work
    on the same dataset and several different datasets was presented, and the comparison
    indicates that the proposed method, employing only simple statistical features
    has comparable accuracy while requiring less computational complexity than other
    methods. If the vibration signal is considered, accuracy obtained by state-of-the-art
    CNN architecture is also comparable with the results obtained in this work where
    current signal is used. This indicates that current signal collected from a sensorless
    system is as effective as the conventional sensor-based system. In our future
    research work, we will investigate the applicability of frequency-domain analysis
    for benefiting the proposed approach for diagnosing rolling element bearings using
    the IM current signals. Furthermore, we will validate the applicability of the
    proposed methodology on other datasets where the diagnosis of mechanical faults
    using the current signals is considered.


