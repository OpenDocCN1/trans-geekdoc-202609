    # III. Overview and Design Challenges


    **Overview.** In this work, we present FlexDNN, an adaptive DNN-based framework
    for on-device video analytics. At the high level, FlexDNN leverages the intrinsic
    nature of video contents, and is capable of dynamically changing the complexity
    to adapt to the video frames. FlexDNN differs from others on the adaptation: instead
    of creating a model of variants with different capacities, FlexDNN leverages the
    architecture of DNNs, and constructs several exits inserted throughout the architecture.


    A typical DNN consists of various types of layers, including convolutional layers,
    activations, pooling layers, and fully-connected layers. Among them is the role
    of the "feature extracts", which generates sets of features organized in form
    of feature maps. These convolutional layers are sequentially connected so that
    the set of features generated from the early layer is the input of the next convolutional
    layer, which generates a new set of features at the next level.


    the complexity of a DNN depends on its depth. A more complex DNN contains more
    convolutional layers. However, as we have shown in Figure 2, not all the inputs
    branch through every convolutional layer. By inserting exits at different convolutional
    layers of a regular DNN model (we refer to it as the base model), FlexDNN provides
    a mechanism to let inputs exit as soon as the features become enough, allowing
    us to dynamically adapt its model complexity to the level of input frames of the
    game category.


    **Design Challenges.** There are two key challenges: first, how to design the
    base model with addition of early exits inserted throughout the base. For each
    exit, it contains two components—early exit logic and decision module—that determine
    whether to exit early at the current layer or to continue the inference predictions
    or pass the generated feature maps to the next layer.


    While early exit mechanism is promising, it also introduces key challenges:


    +   * First, the early exits themselves have overhead.

    Take Game as example: for this frame, the early head comes from the computation
    consumed at the current layer (the $i^{th}$ layer), however the exit comes from
    the computation consumed at $i^{th}$ layers. As such, it is necessary to minimize
    the computational overhead of exits. On devices with extremely lightweight architecture
    we could exit much less frames (i.e., low early exit rate), which makes the early
    exit mechanism less useful. Therefore,

    * Second, early exit at all the convolutional layers of the base model may not
    be the optimal choice. This is'
