    # V. RELATED WORK


    **Mobile Vision.** Our work is closely related to mobile vision [55]. Over the
    past few years, several methods have been proposed to realize continuous mobile
    vision [7], [10], [14], [21], [24–[26], [28]. One key theme of these works is
    to improve the computational efficiency for video analytics applications, which
    is also the focus of this work. In [25], the authors proposed a framework named
    DeepEye that improves resource efficiency of concurrent DNNs by interleaving the
    execution of computation-heavy-convolutional layers and loading


    memory-heavy fully-connected layers. In [14], [37], the authors propose to cache
    intermediate results between consecutive frames to improve compression efficiency.
    In [10], the authors proposed a framework named MCDNN, which uses compression
    techniques to generate a catalog of models for trading DNN classification for
    resource use. In [7] they also use compression techniques to reduce demand by
    trading off accuracy, but apply it to a single multi-capacity model instead of
    a catalog of variants. Our work offers a complementary approach by adapting model
    complexity dynamically to manage the difficulty levels of video. Our approach
    is to reduce computation cost without trading off accuracy.


    Our work is presented in [26], [28]. In this the authors proposed efficient continuous
    mobile vision by leveraging the highly skewed distributions in real-world video.
    In [32], the authors proposed mobile vision system that guarantees “glimpse” under
    undertimed mobile video streams. Our work is similar to them in that we sense
    all the characteristics in video and adapt computation cost of video segments.
    From them, FlexDNN explains the high-dynamics in real-world videos and reduces
    computation by dynamically adapting model complexity to match the difficulty of
    video frames.


    **Dynamic DNN.** Our work is also related to the concept of DNN in the deep learning.
    Dynamic DNN is a type of DNN that allows to adjust the inference behavior based
    on inputs. It has attracted a lot of attention in improving computational efficiency.
    See [19], [21], [33], [38]. In [23], the authors proposed a dynamic DNN D''NN
    that consists of multiple subnetworks and uses control modules to determine which
    subnetwork to execute. The overhead of multiple subnetworks makes D''NN extreme
    resource demand, which is not suitable for mobile devices that have resource constraints.
    Our work is similar to them but the authors proposed BranchyNet, a dynamic DNN
    that adapts to the workload. FlexDNN avoids the efficiency drawbacks with automatically
    early exit architecture and implementation that plan the early exit mechanism.


    # VI. CONCLUSION


    In this paper, we present the design, evaluation of FlexDNN, an adaptive-input
    deep learning for resource-efficient on-device video analytics. FlexDNN allows
    with dynamic deep learning to persist to resource-efficient DNN-based video analytics
    applications that can run smoothly on mobile vision'
