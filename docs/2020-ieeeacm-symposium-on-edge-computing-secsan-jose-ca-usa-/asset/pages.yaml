    # C. Proposed Approach


    In this paper, we present an input-adaptive DNN-based-on-device video applications
    framework FlexDNN that addresses the aforementioned drawbacks. Similar to BranchNet,
    instead of carrying a bag of many models, FlexDNN leverages the early exit mechanism
    to construct a single model on top of a regular DNN (i.e., base model). It replaces
    the fixed capacity of the regular DNN model with flexible capacities. Since only
    one model is involved, FlexDNN has a compact footprint and


    The generated FlexDNN has a compact footprint and is able to handle early exit
    rate without loss of accuracy. With-comparison, FlexDNN substantially preserves
    the accuracy and reduces the computation burden brought by the adaptation.


    +   * At runtime, FlexDNN outperforms both input-generic approach and BranchNet.
    Compared to BranchNet, FlexDNN reduces the computation by 7% with accuracy same
    as amount of resources, or achieves the same accuracy with up to 23.4% of the
    computation. Compared to BranchNet, FlexDNN reduces up to 48.9% computational
    cost, and up to 1.9× energy consumption.'
