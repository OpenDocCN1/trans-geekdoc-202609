    # B. Design of Early Branch


    The design of early branch needs to take the trade-off between computational overhead
    and early exit rate contention. To achieve this, FlexDNN leverages computation
    as the building block, and employs an architecture search scheme to find the optimal
    architecture that optimizes the early exit rate and computation for each early
    branch.


    Among various types of layers that an early branch can contain, convolutional
    layers are the most computation intensive. To reduce the overhead, we use deep
    separable convolutions as the standard building block for the early branch. Figure
    7 illustrates the structural differences between standard convolutional and deep
    separable convolutions.


    For the standard convolutional layer ($w_{i-1} \times h_{i-1} \times c_{i-1}$
    and $\Theta_i \in \mathbb{R}^{k_i \times k_i \times c_{i-1} \times c_i}$), we
    denote the input and output feature maps for both types of convolutions, respectively.
    We use a filter with size of 2D kernel to generate the output feature maps $\Theta_i$.
    This process consumes a cost of $k_i^2 w_{i-1} h_{i-1}$ floating point operations
    (FLOPs). In (7), it reduces the computational cost by decomposing the convolution
    into two cheap sequential operations: depthwise and pointwise. The deep separable
    convolution applies a $k \times k \timesbeta$ filter on each of the $m_{i-1}$
    input feature maps, then applies a $1 \times 1$ filter on the output of the depthwise
    convolution to generate $\Theta_i$. Therefore, via the decomposition, the computational
    cost of deep separable convolutional layer is reduced to $(k_i^2 m_{i-1} + \beta
    m_{i-1} m_i)$ FLOPs.


    With the deep separable convolutions as the computation-efficient building blocks,
    FlexDNN employs an architecture search scheme to find the optimal architecture


    ![](img/dbd3717613f6831d359ca8ca40e8950f_4_0.png)


    that balances the trade-off between early exit rate and computational overhead
    for each early branch. In general, architecture search schemes can be grouped
    into two categories: 1) the online approach that searches for an optimal cell
    structure based on reinforcement learning (RL) or evolutionary algorithms (EA)
    and collects cells to evolve; 2) the offline approach that prunes an over-parameterized
    network until the target network is found [39]. Although both approaches are effective
    for network architectures, FlexDNN employs the top-down approach for its more
    efficient architecture search process.


    Specifically, to identify the most efficient architecture of each early branch,
    FlexDNN uses three deep separable convolutional layers (each by one activation),
    two pooling layers, and one connected layer. The architecture search process,
    starts from a standard convolutional layer which has no early exit rate at that
    particular early branch. This process terminates when the redundant deep separable
    convolutional layers at all early branches are removed.


    # C. Training Scheme


    To train FlexDNN model which is built on top of the base model with inserted early
    exits, we combine the loss function of the base model with those


    In our design, we use cross entropy for both the base model and early branches,
    and a loss function that is the weighted sum of the loss of the base model and
    each individual early branch:


    ```

    L = L_B + \sum_{i=1}^{N} \alpha_i L_i

    ```


    where $L_B$ is the loss of the base model, $L_i$ is the loss of the inserted early
    branch,'
