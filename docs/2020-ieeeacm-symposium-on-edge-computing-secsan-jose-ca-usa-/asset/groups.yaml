    的帧率保持较低，而其他的则增加。其次，当实时性约束更紧（MT=40 ms）时，输入无关难以难以截止日期并丢失所有帧。对于 BranchyNet，帧率仍然很高并随着负载而增加。相比之下，当负载很大时，FlexDNN
    的帧率保持较低。


    # V. 相关工作


    **移动视觉**。我们的工作与移动视觉密切相关 [55]。在过去的几年里，已有许多方法被实现连续移动视觉 [7], [10], [14], [21–26]。这些工作的一个核心主题是提高视频分析的计算效率，这也是本文的重点。在
    [25]，作者提出了一种名为 DeepEye 的框架，通过交替执行计算密集卷积层和内存密集全连接层来提高并发 DNN 的效率。在 [37]，作者提出了一种名为
    MCDNN 的框架，使用压缩技术通过权衡精度来减少需求。我们的方法在 [26] 中提出，通过利用真实视频的高度倾偏分布来实现移动视觉。在 [32]，作者提出了一种移动视觉系统，确保实时视频流的“窥视”。我们的工作与它们相似，在于
    FlexDNN 通过动态调整模型复杂度来匹配视频帧的计算成本。


    **动态 DNN**。我们的工作也与深度学习中的 DNN 概念相关。动态 DNN 是一种根据输入调整推理行为的 DNN，它引起了广泛关注。见 [19], [38]。在
    [23]，作者提出了一种由多个子网络组成的动态 DNN，并使用控制模块决定执行哪个子网络，这对于移动设备是极高需求的。我们的工作与它们相似，但 BranchyNet
    是一种通过自动退出架构和实现来避免移动设备效率的的 DNN。


    # VI. 结论


    在本文中，我们介绍了 FlexDNN 的设计与评估，这是一种可以在移动设备上平滑运行的自适应输入深度学习。我们的结果显示 DNN 优于现状方法。我们认为我们的工作是向连续移动视觉迈出的重要一步。感谢审稿人的宝贵意见。这项工作得到了
    NSF 奖励 CNS-161726, CNS-181457 和 PI-BC62350 的支持。


