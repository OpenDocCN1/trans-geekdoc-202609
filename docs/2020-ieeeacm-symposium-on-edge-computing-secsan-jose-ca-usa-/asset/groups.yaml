    # II. BACKGROUND AND MOTIVATION


    We begin by illustrating the intrinsic dynamics of videos taken in real-world
    mobile settings and demonstrate that considerable resource can be benefited by
    leveraging this dynamic characteristic (§II-A). We then show that the bag-of-model
    approach incurs overhead that dwarfs the benefit by adaptation (§II-B), which
    motivates the use of FlexDNN.


    # A. Dynamics of Mobile Video Content & Leveraging Dynamics


    Due to mobility, videos taken in real-world mobile settings exhibit substantial
    content dynamics in terms of difficulty level across frames. To illustrate this,
    Figure 3 shows frames of a video clip captured by a biker in the human dataset
    UCU-101. However, since the entirety of the biker and bike is captured, frame
    (a) and (d) are relatively easier to recognize as biking activity. In contrast,
    frame (b) and (c) capture only partially, which makes them harder to recognize.
    In such case, a smaller model is sufficient for (a) and (d), but a more complex
    model is necessary for (b) and (c).


