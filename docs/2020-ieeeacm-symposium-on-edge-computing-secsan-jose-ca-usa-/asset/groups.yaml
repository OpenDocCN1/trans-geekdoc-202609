    ## III. 概述与设计挑战


    **概述。** 在这项工作中，我们提出了 FlexDNN，这是一种基于 DNN 的自适应设备端视频分析框架。在高级层次，FlexDNN 利用视频内容的内在属性，并能够动态改变复杂度以适应视频帧。FlexDNN
    与其他方法在自适应方面的不同在于：它不是创建不同容量的变体模型，而是利用 DNN 的架构，并在整个架构中构建了多个插入出口（exits）。


    一个典型的 DNN 由各种类型的层组成，包括卷积层、激活层、池化层和全连接层。其中，“特征提取器”起着重要作用，它们生成以特征图形式组织的特征集。这些卷积层是顺序连接的，使得从早期层生成的特征集是下一个卷积层的输入，从而在下一层生成一组新特征。


    DNN 的复杂度取决于其深度。更复杂的 DNN 包含更多的卷积层。然而，如我们在图 2 中所示，并不是所有输入都会通过每一层卷积层。通过在常规 DNN 模型（我们称之为基础模型）的不同卷积层处插入出口，FlexDNN
    提供了一种机制，让输入在特征变得足够时立即退出，允许我们根据游戏类别的输入帧水平动态地调整其模型复杂度。


    **设计挑战。** 存在两个关键挑战：首先，如何设计在基础模型中添加插入的早期出口的基础模型。每个出口包含两个组件——早期退出逻辑和决策模块——它们决定了是在当前层提前退出，还是继续推理预测，或将生成的特征图传递给下一层。


    虽然早期退出机制很有前景，但它也引入了关键挑战：


    - 第一，早期出口本身具有开销。以游戏为例：对于这一帧，早期头部（early head）源于当前层（第 $i^{th}$ 层）的计算消耗，然而出口源于第 $i^{th}$
    层计算消耗。因此，有必要最小化出口的计算开销。在架构极其轻量化的设备上，我们可以让更少的帧退出（即低早期退出率），这使得早期退出机制的用性降低。因此，

    - 第二，在基础模型的所有卷积层处进行早期退出可能不是最优选择。这是因为某些插入的早期出口，其开销实际上高于它们带来的收益。因此，确定插入的早期出口的数量和位置以验证早期退出的收益代表了另一个挑战。


    解决这些挑战并非易事。之前工作的早期退出架构和开销是基于启发式的。通过仔细的设计，早期出口的开销可能会掩盖收益，除非过早使用无损帧，而这将牺牲基础模型的原始准确性。


    在本文中，我们通过对输入-输出模型关键特征的总结，描述了有效解决这些挑战的技术。


    ## B. 早期分支的设计


    早期分支的设计需要在计算开销和早期退出率之间进行权衡。为了实现这一点，FlexDNN 利用计算作为构建块，并采用架构搜索方案找到优化每个早期分支退出率和计算的最优架构。


    在早期分支可能包含的各种层中，卷积层是计算密集型的。为了减少开销，我们使用深度可分离卷积作为早期分支的标准构建块。图 7 展示了标准卷积与深度可分离卷积的结构差异。


    对于标准卷积层（$w_{i-1} \times h_{i-1} \times c_{i-1}$ 和 $\Theta_i \in \mathbb{R}^{k_i
    \times k_i \times c_{i-1} \times c_i}$），我们分别表示了两种类型的输入和输出特征图。我们使用大小为 2D 核的滤波器来生成输出特征图
    $\Theta_i$。该过程消耗了 $k_i^2 w_{i-1} h_{i-1}$ 次浮点运算。在 (7) 中，通过将卷积分解为两个廉价的顺序操作（深度和逐点）来减少计算。深度可分离卷积对
    $m_{i-1}$ 个输入特征图每一个应用 $k \times k \times \beta$ 滤波器，然后在深度卷积的输出上应用 $1 \times 1$
    滤波器以生成 $\Theta_i$。因此，通过分解，深度可分离卷积层的计算成本降低到 $(k_i^2 m_{i-1} + \beta)$ 次浮点运算。


