    # 2020 IEEE/ACMP Symposium on Edge Computing (SEC)


    # FlexDNN: Input-Adaptive On-Device\Deep Learning for Efficient Mobile Vision


    Biyi Fang†, Xiao Zheng*, Faen Zhang*, Hui Xu*, Mi Zhang†

    Michigan State University, †Ahnovation


    Abstract—Mobile vision systems powered by the recent advent of Deep Neural Networks
    (DNNs) operate on a wide range of on-video analytics. Mobile systems are constrained
    by resources, making efficient deployment of DNNs critical. In this paper, we
    present FlexDNN, an input-adaptive DNN-based framework for on-device video analytics.
    Unlike previous methods that adapt video dynamics to computation, FlexDNN adapts
    the number of video frames to match computation efficiency. FlexDNN addresses
    the key drawbacks of existing systems and pushes the state-of-the-art mobile DNN
    further. We evaluate its performance on both mobile CPU and GPU platforms, measuring
    CPU/GPU processing time per frame, frame rate, and energy consumption.


    **Keywords**—Mobile Vision Systems, On-Device AI, Deep Neural Networks, Mobile
    Vision


    # I. INTRODUCTION


    # A. Motivation


    Mobile vision systems such as phones, drones, and augmented reality (AR) are ubiquitous
    today. By recent breakthrough in Deep Neural Networks (DNNs) [19] and the era
    of AI chips, shift-on-device processing enables high-quality video processing
    [10], [15, 36] and shift from cloud-constrained processing (e.g., MPEG) to on-device
    video analytics.


    On-device video analytics requires processing streaming video frames in real-time
    with low latency. Unfortunately, DNNs are constrained by limited computation-inefficiency
    [31], and high cost directly leads to high latency and energy consumption. On
    mobile devices with limited compute resources and battery capacities, the computation
    cost of DNN-based pipelines is crucial for any application built on on-device
    video analytics.


    To reduce cost, many research work pursues model compression techniques [8, 9].
    However, model compression yields only one-size-fits-all neural networks that
    have the same set of features to extract for all video frames regardless of content
    in each frame. Consequently, a small low-capacity DNN model is insufficient when
    a large high-capacity DNN model is overkill; on the other hand,


    ![](img/dbd3717613f6831d359ca8ca40e8950f_0_0.png)


    for video frames that contain hard, it is necessary to adapt the contents in the
    processing pipeline to be correctly recognized. This is very similar to human
    vision systems where a glance is sufficient to recognize simple scenes and objects
    of interest, whereas more attention is needed for complex scenes and objects that
    are partially or occluded [43].


    # B. State-of-the-Art for input-adaptive video analytics


    Based on this approach, systems such as Chameleon [15] have recently emerged.
    Leveraging the dynamics of video content, these methods adapt the complexity of
    the DNN-based pipelines by dynamically changing the DNN model to match the levels
    of the video frames. Unfortunately, as we demonstrate in §III-B, this model-of-model
    approach is resource-constrained because it requires all the models with various
    capacities to be loaded in the mobile system, which results in large memory footprint.
    More importantly, if a large model is loaded and executed, the overhead is substantial,
    the cost of searching the optimal model and switching models at runtime can be
    prohibitively expensive, which degrades the benefit brought by adaptation.


    The limitation of Chameleon is rooted in the constraint where it requires multiple
    independent model variants with various capacities to adapt to different levels
    of video frames. To address this issue, FlexAny [33] introduces the idea of using
    a single model with convolutional layers of light branches that exit at inserted
    points. For each frame, it exits at the early exit inserted at an earlier location


