    # 2020 IEEE/ACMP 边缘计算会议 (SEC)


    # FlexDNN：用于高效移动视觉的输入自适应设备端深度学习


    Biyi Fang†, Xiao Zheng*, Faen Zhang*, Hui Xu*, Mi Zhang†

    密歇根州立大学，†Ahnovation


    摘要—随着深度神经网络（DNN）的出现，移动视觉系统已应用于广泛的视频分析。移动系统受到资源限制，因此高效部署 DNN 至关重要。在本文中，我们提出了 FlexDNN，一种基于
    DNN 的输入自适应设备端视频分析框架。与以往调整视频动态以适应计算的方法不同，FlexDNN 通过调整视频帧数来匹配计算效率。FlexDNN 解决了现有系统的主要缺点，进一步提升了移动
    DNN 的水平。我们在移动 CPU 和 GPU 平台上评估了其性能，测量了每帧的 CPU/GPU 处理时间、帧率和能耗。


    **关键词**—移动视觉系统、设备端 AI、深度神经网络、移动视觉


    # I. 引言


    ### A. 动机


    手机、无人机和增强现实（AR）等移动视觉系统如今已无处不在。随着深度神经网络（DNN）[19] 的近期突破以及 AI 芯片时代的到来，设备端处理实现了高质量的视频处理
    [10], [15, 36]，并实现了从云端受限处理（如 MPEG）到设备端视频分析的转变。


    设备端视频分析需要低延迟实时处理流式视频帧。遗憾的是，DNN 受到计算效率低下 [31] 的限制，高成本直接导致了高延迟和高能耗。在计算资源和电池容量有限的移动设备上，基于
    DNN 的流水线的计算成本对于任何构建在设备端视频分析上的应用都至关重要。


    为了降低成本，许多研究工作追求模型压缩技术 [8, 9]。然而，模型压缩产生的是“一刀切””的神经网络，无论每帧视频的内容如何，它们对所有视频帧提取相同的特征集。因此，当大型高容量
    DNN 模型过剩时，较小的低容量 DNN 模型是不够的；另一方面，


    ![](img/dbd3717613f6831d359ca8ca40e8950f_0_0.png)


    对于包含困难内容的视频帧，有必要调整处理流水线中的内容以被正确识别。这与人类视觉系统非常相似，一眼即可识别出简单的场景和感兴趣的对象，而对于复杂场景和部分或遮挡的对象则需要更多的注意力
    [43]。


    ### B. 输入自适应视频分析的先进技术


    基于这种方法，诸如 Chameleon [15] 等系统最近涌现。这些方法利用视频内容的动态，通过动态更改 DNN 模型来匹配视频帧的水平，从而调整基于 DNN
    的流水线的复杂度。然而，正如我们在第 III-B 节所示，这种“模型模型”方法是受资源限制的，因为它需要将所有不同容量的模型都加载到移动系统中，这导致了巨大的内存占用。更重要的是，如果加载并执行大模型，开销将是巨大的，运行时搜索最优模型和切换模型的成本可能昂得惊人，从而削弱了自适应带来的益处。


    Chameleon 的局限性源于其限制：它需要多个具有不同容量的独立模型变体来适应不同水平的视频帧。为了解决这个问题，FlexAny [33] 引入了使用带有轻量级分支卷积层的单个模型的想法，这些分支在插入点退出。对于每一帧，如果提取的特征足以识别其内容，它就会在较早位置插入的早期退出处退出


    ![](img/dbd3717613f6831d359ca8ca40e8950f_1_0.png)


    图2。早期退出机制的概念示意图。


    对于困难情况，它会继续进行直到提取的特征足够好。通过这种早期退出机制，通过所有层及其计算的成本将显著降低。


    早期退出机制容易消耗计算。未能从早期退出退出的帧所消耗的计算是浪费的，并且存在早期退出机制带来的开销。遗憾的是，之前工作的早期退出架构是基于启发式的，而不依赖于数据。早期退出率会产生开销。如果不考虑这种权衡，开销可能会抵消早期退出带来的益处。


    - 第二，早期工作中插入退出口的数量和位置也是基于启发式的。虽然与许多没有退出的模型相比这种方法是有效的，但在不进行详尽试错的情况下，考虑到早期退出的数量和位置所带来的指数级收益，定义一个能够利用早期退出益处的早期退出计划将是极具挑战性的。此外，开销和插入退出的数量在决定可以节省的计算量方面起着关键作用，使得导出早期退出计划变得更具挑战性。


    FlexDNN 在运行时没有模型切换。在运行时，它动态调整模型容量，以实时粒度匹配输入视频帧的难度水平。


    为了解决 BranchNet 的缺点，FlexDNN 采用了基于架构搜索的方法寻找最优的早期退出计划。FlexDNN 能够推导出早期退出计划，识别插入哪个退出层以最大化早期退出带来的益处。因此，FlexDNN
    允许专业有限的开发者进行构建。


    表 I 提供了 FlexDNN 与现有自适应框架的对比。


    | 方法 | 早期退出架构 | 早期退出计划 |

    | :--- | :--- | :--- |

    | Chameleon [15] | 服务端 | 启发式 |

    | MCDNN (10) | 设备端 | 启发式 |

    | BranchNet (13) | 设备端 | 无 |

    | FlexDNN | 设备端 | 有 |


    ### C. 提出的方法


    在本文中，我们提出了 FlexDNN，一种基于 DNN 的输入自适应设备端视频分析框架。与以往调整视频动态以适应计算的方法不同，FlexDNN 通过调整视频帧数来匹配计算效率。FlexDNN
    解决了现有系统的主要缺点，进一步提升了移动 DNN 的水平。我们在移动 CPU 和 GPU 平台上评估了其性能，测量了每帧的 CPU/GPU 处理时间、帧率和能耗。


    FlexDNN 在运行时没有模型切换。在运行时，它动态调整模型容量，以实时粒度匹配输入视频帧的难度水平。


    为了解决 BranchNet 的缺点，FlexDNN 采用了基于架构搜索的方法寻找最优的早期退出计划。FlexDNN 能够推导出早期退出计划，识别插入哪个退出层以最大化早期退出带来的益处。因此，FlexDNN
    允许专业有限的开发者进行构建。


    # II. 背景与动机


    ### A. 视频内容的动态


    手机、无人机和增强现实（AR）等移动视觉系统如今已无处不在。随着深度神经网络（DNN）[19] 的近期突破以及 AI 芯片时代的到来，设备端处理实现了高质量的视频处理
    [10], [15, 36]，并实现了从云端受限处理（如 MPEG）到设备端视频分析的转变。


    设备端视频分析需要低延迟实时处理流式视频帧。遗憾的是，DNN 受到计算效率低下 [31] 的限制，高成本直接导致了高延迟和高能耗。在计算资源和电池容量有限的移动设备上，基于
    DNN 的流水线的计算成本对于任何构建在设备端视频分析上的应用都至关重要。


    视频的内在动态提供了通过匹配模型容量与每帧难度水平来减少计算的机会。为了量化可以节省多少计算，我们首先定义了识别内容所需的最小计算成本（浮点运算 GFLOPs），对于任何构建在设备端视频分析上的应用。


