    ## F. FlexDNN 模型特性


    通过精心设计，FlexDNN 生成的输入自适应模型表现出许多关键特性，我们总结如下：


    应用 #2：移动现实世界中的场景理解。场景理解是增强现实的能力之一。该应用旨在从手机摄像头的视频识别物体。由于缺乏经过 IRB 批准的公开数据集，在数据收集期间，我们使用
    ORDO 手持式手机摄像头 [3] 在不同地点录制了视频。从标记的视频片段中，我们选取了 8 个最难识别为室内或室外场景的地方。


    **具有灵活复杂度的单模型**。通过插入早期退出节点，FlexDNN 能够在单个模型中提供灵活的模型复杂度。此外，由于采用了单模型设计，FlexDNN 允许在运行时进行模型调整和选择。


    应用 #3：基于无人机的交通监控。由于缺乏交通监控，无人机能够以低成本对大区域流量进行追踪，这是传统的基于视频的交通监控系统无法提供的 [18]。该应用通过无人机采集。由于缺乏公开数据集，我们使用商用无人机
    DJI Mavic Pro [1] 收集了经过 IRB 批准的自有交通监控视频片段。为了确保多样性，我们在不同的海拔（25m 到 90m）、高度（25.5m
    到 52.1m）、速度（11.2m/s）、天气条件（多云、晴天）和道路类型（城市、高速公路）下收集了视频。在所有视频片段中，我们对数据集进行了标记：15%
    用于训练和测试。使用无人机收集数据的过程以及 Place-8 的示例视频帧如图 10 (b) 所示。


    **无计算开销早期退出**。由于没有使用昂贵的分离卷积，早期退出分支的计算成本显著降低。这有效地最小化了早期退出带来的开销。


    **高计算削减**。通过计算高效的早期退出和高退出率，FlexDNN 模型能够提供由自适应带来的高计算削减。


    ## IV. 评估


    基模型。我们选择 V-3 [32] 和 VGG-16 [19] 作为基模型来评估 FlexDNN 的有效性。我们选择 Inception-V3 是由于与 Mobile-Net
    [2] 等模型相比，它的架构计算效率更高；为了证明 FlexDNN 对资源密集型基模型的有效性，我们选择了 VGG-16 作为另一个基模型。


    设备端移动应用。为了证明 FlexDNN 应用的实用性，我们使用 FlexDNN 为三个不同的移动平台构建了三个代表性的设备端应用。


    应用 1：手机活动识别。标记人类活动视频正成为智能手机的一个非常有前景的功能。该应用旨在从手机摄像头捕捉的视频流中识别个人进行的活动。对于该应用，我们使用了
    UCF-101 人类活动数据集 [17]，它包含环境中固定或移动摄像头的视频片段。我们选取了视频活动（例如自行车和滑雪）。


    B. 性能。在本节中，我们关注对 FlexDNN 生成的模型进行分析，目标是量化 III-F 中总结的特性。


    **无精度损失的高早期退出**。由 FlexDNN 生成的模型能够在不提前损失精度的情况下实现高退出率。为了量化这一点，我们在测试集上对六个模型中的每一个进行了分析，并在保持与基模型相同精度时的累计退出率。


