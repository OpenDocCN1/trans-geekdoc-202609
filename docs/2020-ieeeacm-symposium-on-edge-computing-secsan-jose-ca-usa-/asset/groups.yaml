    cost by matching the capacity of the DNN model to the difficulty level of each
    video frame. To quantify how much computation can be saved, we first define the
    minimum computation cost in terms of the number of floating point operations (GFLOPs)
    that is needed to correctly recognize the content in each frame of the video clip.
    Specifically, we test different model variants with VGG-16 from 19 layers to filters.
    For each frame, we select the model with the lowest FLOPs (framewise optimal model).
    We then compare it to the model with the lowest FLOPs that is able to correctly
    recognize the contents in all frames.


    Figure 4 shows our result. As shown in the solid curve, the minimum consumption
