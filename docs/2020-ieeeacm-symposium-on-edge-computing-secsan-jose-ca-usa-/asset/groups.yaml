    ### B. “模型模型”方法是一种误用


    计算的益处要求动态更改模型容量以适应每帧的内容。诸如 Chameleon [15] 等现有方法使用多个模型变体来实现内容自适应。然而，FlexAny [33]
    引入了使用带有轻量级分支卷积层的单个模型的想法，这些分支在插入点退出。对于每一帧，如果提取的特征足以识别其内容，它就会在较早位置插入的早期退出处退出。对于困难情况，它会继续进行直到提取的特征足够好。通过这种早期退出机制，通过所有层及其计算的成本将显著降低。


    早期退出机制容易消耗计算。未能从早期退出退出的帧所消耗的计算是浪费的，并且存在早期退出机制带来的开销。遗憾的是，之前工作的早期退出架构是基于启发式的，而不依赖于数据。早期退出率会产生开销。如果不考虑这种权衡，开销可能会抵消早期退出带来的益处。


