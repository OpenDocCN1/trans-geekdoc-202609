    # 3.3. Confusion matrix analysis


    Fig. 9 presents the confusion matrix for classification algorithms applied across
    all subjects. This matrix illustrates the classification performance for left
    and right mirror imagery tasks, where the diagonal elements represent classified
    true (true positives), and the off-diagonal elements indicate misclassifications.
    Among all, the method with highest accuracy identified 71% of left trials and
    74% of right trials. In contrast, traditional approaches like CSP + SVM show 56%
    accuracy for left trials and 53% for right trials, greatly differing in feature
    extraction. CNN-LSTM achieved 63% accuracy for both movements, while ConvNet significantly
    improves this performance with 64% and 67% accuracy.

    KNN and CNN-LSTM exhibit moderate classification accuracy, with KNN classifying
    58% of left trials and 62% of right trials, while CNN-LSTM exhibits 69% and 68%
    accuracy, respectively.


