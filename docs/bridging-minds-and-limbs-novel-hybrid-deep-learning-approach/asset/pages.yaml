    # 2.5.4 Attention Feature Extraction


    In deep learning, the importance of various spatial locations or channels is dynamically
    enhanced by the Squeeze-and-Attention mechanism, allowing to concentrate on the
    most relevant to the task at hand [35]. In our model, we integrated the attention
    mechanism within the CNN network, adding attention layers. Instead of using all
    channels or frequencies, the attention mechanism learns their importance based
    on their contribution to our classification task. This data-driven approach enables
    the model to learn most important features without relying on prior assumptions.
    The detailed architecture of this is shown in Fig. 6.


    +   - The first 1D convolutional layer (Conv1d) applies 16 filters with 10 × 10
    kernel size to capture spatial patterns.

    - The 2nd convolutional layer (Conv2d) refines the extracted features with 15
    × 15 kernel.

    - These layers are followed by batch normalization (BN) and ReLU activation, ensuring
    stable gradient and improved feature representation.

    - A pooling layer is then applied to the feature maps, reducing computational
    complexity while preserving spatial information.


