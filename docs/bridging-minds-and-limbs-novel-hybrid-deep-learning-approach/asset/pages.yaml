    # 4. Discussion


    The results presented here demonstrate the potential of a hybrid deep learning
    model for detecting lower limb imagery, a task that is particularly relevant for
    stroke rehabilitation. The model achieved accuracy (72.14%) and demonstrated consistent
    performance across subjects, even with inherent variability. By integrating CNN
    and LSTM with adaptive feature weighting and PSO for parameter optimization, the
    proposed model feature enhancement demonstrates robustness and robustness. These
    components work synergistically to address the complexity of motor imagery tasks
    and provide improved classification performance.


    Specifically, CNN captures spatial characteristics by local and global patterns
    in EEG topologies, which are essential for distinguishing motor imagery classes.
    The attention mechanism further captures the temporal dependencies, allowing the
    network to focus on spatial features. Bi-LSTM effectively models the temporal
    effects of EEG signals in both forward and backward directions, enabling better
    understanding of the imagery. Optimization of kernel sizes and filter numbers
    leads to faster convergence and improved generalization across subjects.


    # 3.5. Event-related desynchronization (ERD) analysis


    Event-related desynchronization (ERD) was observed during both left and right
    motor imagery. Fig. 11 shows the ERD phenomenon in the mu-wave frequency band
    at electrodes C3 and C4. Left motor imagery resulted in a transient ERD in the
    motor region of the right cortex, right motor imagery resulted in a more pronounced
    response in the left motor cortex, with a decrease in EEG power, persisting throughout
    the four-second imagery period.


    Although data from all 15 electrodes were collected, we chose to present the data
    from electrodes C3 and C4 specifically because these channels are widely recognized
    for their role in detecting motor activity during lower limb movements. Movements,
    C3 and C4 are widely recognized for their role in detecting motor activity during
    motor imagery tasks. Notably, multiple studies have demonstrated that lower limb
    imagery can elicit ERD patterns at C3 and C4, reflecting contralateral


    The classification of EEG signals is challenging due to physiological differences,
    motor imagery differences, psychological state, and equipment limitations. To
    address these challenges, the proposed model utilized traditional classification
    approaches, enhancing its robustness across subjects. A 1 Hz high-pass filter
    and 40 Hz low-pass filter played a crucial role in removing baseline fluctuations,
    ensuring the preservation of neural activity and minimizing artifacts caused by
    eye movement and muscle artifacts, which are common in EEG records.


    This filtering strategy helps maintain motor-related oscillations, particularly
    in the mu (8-12 Hz) and beta (13-30 Hz) frequency bands, which are known to be
    crucial for motor imagery tasks [4]. By refining the signal quality, these processing
