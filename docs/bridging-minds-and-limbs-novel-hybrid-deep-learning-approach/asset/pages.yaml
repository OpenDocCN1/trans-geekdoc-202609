    refers to the classification accuracy, and $P_{\kappa}$ to the expected accuracy
    due to random chance.


    This comparative analysis is designed to demonstrate the superiority of our proposed
    model in terms of both classification accuracy and robustness over lower motor
    imagery tasks.


    # 3. Results


    # 3.1. Classification performance


    After 400 iterations of training, the proposed model achieved an average classification
    accuracy of 72.14% (SD - 3.60) for distinguishing between left and right motor
    imagery classes across subjects (Fig. 8). Despite inter-subject variability, participants''
    accuracies ranged from 70% to 75%, indicating relatively consistent performance.


    # 3.2. Comparative analysis


    Table 2 presents a comparison of our approach with widely used classification
    techniques, including EEGNet [36], CNN-SVM [38], energy-efficient CNN [39], and
    CNN-LSTM [40]. All methods were trained and tested on the same dataset, using
    the same proportion of participants and data preprocessing pipeline. Our model
    achieved high average accuracy (72.1%) and kappa coefficient (0.436), which is
    significantly higher than other methods. For instance, the average accuracy of
    63.7% is much higher than that of CNN-SVM (59.5%) and energy-efficient CNN (53.8%).
    Our kappa coefficient of 0.096 is also much higher than that of CNN-SVM (0.027)
    and CNN-LSTM (0.050), showing that our method performs better compared to others.


    To evaluate classification performance, the sensitivity of each method is analyzed,
    as shown in Table 3, which reflects the ability to correctly classify each class,
    which is a key metric for assessing the effectiveness of the classification system.
    The highest sensitivity (69.9%) was achieved by the proposed model, consistently
    outperforming all other approaches. It is followed by CNN-LSTM (67.5%) and CNN-Net
    (62.2%), while the lowest sensitivity (54.9%) was observed for CNN-SVM.


    # 2.6. Framework framework


    To evaluate the effectiveness of the proposed CNN-SEB-LSTM fusion network, we
    conducted a comparative analysis against several representative baseline models
    commonly used in motor imagery EEG-based tasks:


    +   * EEGNet [36], a compact CNN architecture designed specifically for EEG-based
    tasks;

    * CNNNet [37], a deeper convolutional model for EEG signal decoding;

    * CNN-SVM [38], a traditional feature-extraction and classification pipeline;

    * Eff-KNN [39], an energy-efficient variant of the k-nearest neighbors algorithm;

    * CNN-LSTM [40], a hybrid model integrating convolutional layers with short memory
    networks.


