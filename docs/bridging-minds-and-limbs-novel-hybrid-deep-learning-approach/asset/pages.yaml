  md: '# Biomedical Signal Processing and Control


    # Bridging minds and limbs: novel hybrid deep learning approach for low-cost EEG-based
    lower limb imagery classification


    Zhengdi Sun, Anle Mu\*, Ye Qian, Xudong Sun


    School of Medical and Precision Engineering, Xian University of Technology, China


    # ABSTRACT


    This study aims to develop a highly cost effective brain-computer interface (BCI)
    system specifically for detecting lower limb imagery during stroke rehabilitation.
    Existing BCI systems often suffer from high costs and are easily affected by environmental
    interference. To tackle these problems, our system is built on a modified OpenBCI
    platform with wireless communication, featuring signal processing algorithms and
    design. We collected electroencephalography (EEG) data from healthy subjects using
    16 channels. We developed a novel hybrid deep learning method to perform feature
    extraction and classification, which combines Convolutional Neural Networks (CNN),
    Bidirectional Long-Term Memory (LSTM), Particle Swarm Optimization (PSO), and
    attention mechanisms. The system achieved an accuracy of 72.4% (±3.6%) on the
    test dataset, with the CNN-LSTM model showing 4.1% improvement over baseline methods.
    These results were comparable to existing literature, demonstrating good potential
    despite the small sample size. Future work will focus on expanding the sample
    size and long-term clinical validation to address current limitations and further
    improve the system’s efficacy in real-world applications.


    Keywords:


    +   - Lower limb imagery classification

    - Stroke rehabilitation BCI

    - EEG signal processing

    - Deep learning with attention mechanisms

    - Low-cost openBCI platform


    # 1. Introduction


    Brain-computer interface (BCI) technology has revolutionized human-computer interaction
    by enabling direct control of external devices through activity. This is particularly
    useful in rehabilitation where BCI can modulate motor activity—specifically by
    inhibitory control of descending pathways—which helps in promoting motor recovery
    [2–4]. The integration of brain with motor systems to improve neuroplasticity
    is an important area of focus in both robotics and neurosciences. BCI systems
    can capture activity through non-invasive methods such as electroencephalography
    (EEG), offering high signal-to-noise ratios but with significant risks and errors.
    Non-invasive techniques like functional magnetic resonance imaging (fMRI), near
    infrared spectroscopy (NIRS), magnetoencephalography (MEG), and electroencephalography
    (EEG) provide safer alternatives but generally suffer from lower signal quality
    due to the distance between the electrodes and the brain activity source [6].
    Despite this


    EEG is widely preferred for BCI applications because of its portability, affordability,
    and high reliability. Motor imagery (MI) is a widely used paradigm in EEG-based
    BCI research, particularly detecting motor movements through evoked related potentials
    (ERP) in the 8–12 Hz band (mu rhythms) and event-related desynchronization and
    synchronization (ERS) further assist in decoding motor intentions. However, EEG
    signals are often affected by artifacts, such as electrocardiography (ECG) and
    electromyography (EMG), making activity analysis and feature extraction challenging
    for BCI performance [10–13]. Various methods, such as independent component analysis
    (ICA) and wavelet transform, are commonly employed to handle complex artifacts.
    Similarity feature extraction techniques, like power spectral density (PSD) and
    common spatial patterns, have performed well with different motor signals [14–16].
    Recent advances in deep learning have shown promise for improving EEG signal processing.
    Convolutional neural networks (CNN) and long short-term memory networks (LSTM)
    have demonstrated strong performance in feature extraction and classification


