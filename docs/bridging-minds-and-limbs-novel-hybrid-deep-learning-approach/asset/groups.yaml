    # 生物医学信号处理与控制


    # 桥接大脑与肢体：一种用于低成本 EEG 下肢想象分类的新型混合深度学习方法


    Zhengdi Sun, Anle Mu*, Ye Qian, Xudong Sun


    中国西安科技大学 医疗与精密工程学院


    # 摘要


    本研究旨在开发一种高成本效益的脑机接口（BCI）系统，专门用于检测中风康复期间的下肢想象信号。现有的 BCI 系统通常面临成本高且易受环境干扰的问题。为了解决这些问题，我们的系统构建在改进的带有无线通信的
    OpenBCI 平台上，具有信号处理算法和设计。我们使用 16 通道从健康受试者处收集了脑电图（EEG）数据。我们开发了一种新型混合深度学习方法进行特征提取和分类，该方法结合了卷积神经网络（CNN）、双向长记忆网络（LSTM）、粒子群优化（PSO）和注意力机制。该系统在测试数据集上达到了
    72.4% (±3.6%) 的准确率，其中 CNN-LSTM 模型比基准方法提升了 4.1%。这些结果与现有文献相当，尽管样本量较小，但展示了良好的潜力。未来的工作将重点于扩大样本量和长期临床验证，以解决目前的局限性并进一步提高系统在实际应用中的功效。


    关键词：


    - 下肢想象分类

    - 中风康复 BCI

    - EEG 信号处理

    - 带注意力机制的深度学习

    - 低成本 OpenBCI 平台


    # 1. 引言


    脑机接口（BCI）技术通过允许活动直接控制外部设备改变了人机交互。这在康复中特别有用，因为 BCI 可以调节运动活动——特别是通过对下降通道的抑制控制——有助于促进运动恢复
    [2–4]。大脑与运动系统的整合以提高神经塑性是机器人学和神经科学领域的一个重点。BCI 系统可以通过脑电图（EEG）等非侵入性方法捕捉活动，提供较高的信噪比，但存在显著的风险和误差。功能磁共振成像（fMRI）、近红外光谱（NIRS）、磁脑图（MEG）和脑电图（EEG）等非侵入性技术提供了更安全的替代方案，但由于电极与大脑活动源之间的距离，通常信号质量较低
    [6]。尽管如此，


    EEG 因其便携性、廉价和高可靠性被广泛应用于 BCI 。运动想象（MI）是基于 EEG 的 BCI 研究中广泛使用的范式，特别是通过 8–12 Hz 频段（mu
    节律）中的诱发相关电位（ERP）检测运动，以及事件相关的去同步和同步（ERS）进一步协助解码运动意图。然而，EEG 信号经常受到心电图（ECG）和肌电图（EMG）等伪迹的影响，使得活动分析和特征提取对
    BCI 性能面临挑战 [10–13]。各种方法，如独立成分分析（ICA）和小波变换，常用于处理复杂的伪迹。相似特征提取技术，如功率谱密度（PSD）和共同空间模式在不同的运动信号中表现良好
    [14–16]。深度学习的最新进展在改进 EEG 信号处理方面显示前景。卷积神经网络（CNN）和长短期记忆网络（LSTM）在特征提取和分类方面展现了强大的性能


