    # Data Augmentation


    ![](img/227c841f21f5a658d08dfdd42355ed3e_3_1.png)


    Fig. 4. The timeline-graph of data expansion.


    ## 2.4. Data expansion


    EEG acquisition is a time-consuming task, from initial preparation to data collection.
    Prolonged monitoring task may also lead to fatigue. In this study’s EEG data,
    experiment generates 150 sets of training data. Deep learning techniques typically
    require large datasets and are limited in scale due to the high cost and difficulty
    of recruiting a sufficient number of subjects for EEG-based studies. As a result,
    the available data in this study is relatively small.


    To address the restricted size inherent in EEG datasets, we applied an overlapping
    window segmentation approach that preserves temporal dependencies. Each trial
    lasts for 4 s, at a sampling rate of 125 Hz, yields 501 samples (the extra is
    obtained by including the starting point). To augment the dataset, a sliding window
    of 2 s with a sample size of 50 samples. Consequently, each 4-second trial is
    segmented into 6 overlapping segments, as calculated by: $N = \frac{501}{50} +
    1 = 6$. Despite this, each segment retains the same label as the original, and
    the timeline-graph of data expansion is shown in Fig. 4. The resulting fold resulted
    in increase in training samples (dataset-size amplification) without introducing
    artificial features or altering spectral characteristics, complying with the data
    integrity principles.


    ## 2.5. Mathematical method


    ### 2.5.1. Convolutional neural networks


    Convolutional Neural Networks (CNNs) have emerged as a powerful tool for EEG signal
    analysis due to their ability to capture and learn resemble patterns in artificial
    neural networks and are deep learning models that widely used for visual image
    analysis [32]. The multi-channel, continuous, and spatial nature of EEG makes
    CNNs particularly suitable for extracting relevant features from this data type.
    A typical CNN consists of five layers: (1) input, (2) convolutional, (3) activation,
    (4) pooling and (5) fully connected. A complete CNN structure contains multiple
    blocks of these layers, with a classifier at the end:


    $f(X) = \sigma(W_i \otimes X + b_i)$


    Here, $X$ represents the $i$-th convolution layer, $W_i$ denotes the convolution
    kernel (weights), and $b_i$ is the bias. The operator $\otimes$ denotes the convolution
    operation, computes the map by sliding the kernel over the input and performing
    element-wise multiplications and summations. For each convolutional layer:


    - The input $X$ is convolved with the kernel $W_i$.

    - The bias $b_i$ is added to the convolution.

    - The result is then passed through an activation function (e.g., ReLU) and a
    pooling layer to reduce dimensionality and maintain important features.


    Unlike LSTM models, which only consider the past, bidirectional structure of LSTM
    enables to model both past and future information. This is particularly beneficial
    for medical imaging (MI) tasks, such as EEG non-stationary signals that span multiple
    scales. The bidirectional structure improves the network''s ability to capture
    long-range temporal correlations and phase shifts, leading to more accurate feature
    representation.


    Fig. 5 illustrates the LSTM architecture and internal mechanism. Here, the LSTM
    is shown in "unrolled" format across multiple time steps (t-1, t, t+1), both forward
    and backward. Each block represents an LSTM unit, detailing the forget gate ($f_t$),
    output gate ($o_t$), cell gate ($c_t$), and hidden state ($h_t$). The multiplication
    and addition operations, as shown in equations (4)-(7), use learned parameters
    and weights to integrate the input to generate the new cell state and hidden state.
    The outputs of the activated blocks are aggregated to form the final representation
    $f(X)$, which is subsequently fed into fully connected layers and a classifier
    for final classification. The entire network is trained end-to-end using backpropagation
    to adjust the weights and biases.


    ### 2.5.2. Long-Term Memory


    Long-Term Memory (LSTM) networks are crucial for EEG processing due to their ability
    to capture long-term dependencies in time series. This is particularly important
    for temporal analysis of behavioral patterns during monitoring tasks. LSTMs use
    three gates: the forget gate, input gate, and output gate, to control the information
    flow, allowing the model''s ability to adapt to time-dependent changes [3]. The
    forget gate controls which information from the previous step is retained or discarded,
    preserving relevant temporal information:


    $f_t = \sigma(W_f \cdot [h_{t-1}, X_t] + b_f)$


    Where, $f_t$ is the forget gate activation at time $t$, $X_t$ is the input at
    $t$, $h_{t-1}$ is the hidden state from the previous step, $W_f$ is the weight
    matrix associated with the forget gate, $b_f$ is the bias, and $\sigma$ denotes
    the sigmoid activation function, which maps values to the range [0,1].


    The input gate controls what new information is updated in the long-term and short-term
    memory:


    $i_t = \sigma(W_i \cdot [h_{t-1}, X_t] + b_i)$, $\tilde{C}_t = \tanh(W_c \cdot
    [h_{t-1}, X_t] + b_c)$


    Where, $i_t$ is the input gate activation, $\tilde{C}_t$ is the candidate cell
    state, $W_i$ are the weights for the input gate and cell state respectively, $b_i$
    and $b_c$ are the corresponding bias, and $\tanh$ is the hyperbolic tangent function.


    The cell state $C_t$ is updated by combining the information from the previous
    cell state and the new cell state:


    $C_t = f_t \odot C_{t-1} + i_t \odot \tilde{C}_t$ (5)


    where $\odot$ denotes element-wise multiplication, and $C_{t-1}$ is the previous
    cell state.


    Finally, the output gate controls the current hidden state $h_t$ by passing the
    updated cell state through a non-linear transformation:


    $o_t = \sigma(W_o \cdot [h_{t-1}, X_t] + b_o), h_t = o_t \odot \tanh(C_t)$ (7)


    ### 2.5.3. Particle Algorithm


    CNN networks effectively extract spatial features from EEG, but the LSTM kernels
    affect their performance. The Particle Swarm Optimization (PSO) algorithm can
    optimize the number of parameters by competition and cooperation among particles
    [5]. In PSO, solution candidates are called "particles", which have position and
    velocity. The position and velocity of the $i$-th particle in a D-dimensional
    space are denoted as:


    $v_i^{d+1} = v_i^d + c_1 r_1 (p_i^d - x_i^d) + c_2 r_2 (g^d - x_i^d)$ (8)

    $x_i^{d+1} = x_i^d + v_i^{d+1}$


