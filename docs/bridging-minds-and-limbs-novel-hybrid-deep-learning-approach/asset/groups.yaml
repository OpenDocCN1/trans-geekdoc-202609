    \nCNN 网络可以有效地从 EEG 中提取空间特征，但 LSTM 卷积核影响其性能。粒子群优化（PSO）算法可以通过粒子间的竞争与合作来优化参数数量 [5]。在\
    \ PSO 中，解候选被称为“粒子”，它们具有位置和速度。$D$ 维空间中第 $i$ 个粒子的位置和速度表示为：\n\n$v_i^{d+1} = v_i^d\
    \ + c_1 r_1 (p_i^d - x_i^d) + c_2 r_2 (g^d - x_i^d)$ (8)\n$x_i^{d+1} = x_i^d +\
    \ v_i^{d+1}$\n\n"
