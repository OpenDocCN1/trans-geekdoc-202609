    are recruited for EEG acquisition, focusing on the motor imagery due to their
    experience in stroke rehabilitation.


    EEG signals into independent components using ICA, for the identification and
    removal of EEG data processing is conducted using the EEGLAB (v20.2) in MATLAB
    R2021b. To improve efficiency, raw EEG signals are downsampled to 25 Hz. A 1 Hz
    high-pass filter and a 40 Hz low-pass filter are applied to remove irrelevant
    frequency components, such as low-frequency and high-frequency noise outside the
    typical motor imagery band (8–30 Hz). For artifact removal, the Artifact Removal
