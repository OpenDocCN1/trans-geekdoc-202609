    \ LSTM 单元，详细说明遗忘门 ($f_t$)、输出门 ($o_t$)、细胞门 ($c_t$) 和隐藏状态 ($h_t$)。方程 (4)-(7) 所示的乘法和加法操作使用学习的参数和权重来整合输入以生成。\n\
