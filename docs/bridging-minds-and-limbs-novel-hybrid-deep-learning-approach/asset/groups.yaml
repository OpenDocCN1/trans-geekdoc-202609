    \ 使用三个门：遗忘门、输入门和输出门来控制信息流，遗忘门控制上一步的信息是保留还是丢弃：\n\n$f_t = \\sigma(W_f \\cdot [h_{t-1},\
    \ X_t] + b_f)$\n\n其中，$f_t$ 是 $t$ 刻的遗忘门激活，$X_t$ 是输入，$h_{t-1}$ 是上一步的隐藏状态，$W_f$ 是与遗忘门的权重，$b_f$\
    \ 是偏置，$\\sigma$ 表示将值映射到 [0,1]。\n\n输入门控制长期记忆中更新哪些新信息：\n\n$i_t = \\sigma(W_i \\\
    cdot [h_{t-1}, X_t] + b_i)$，$\\tilde{C}_t = \\tanh(W_c \\cdot [h_{t-1}, X_t] +\
    \ b_c)$\n\n其中，$i_t$ 是输入门激活，$\\tilde{C}_t$ 是候选细胞状态，$W_i$ 和 $W_c$ 分别是输入门和细胞的权重，$b_i$\
    \ 和 $b_c$ 是对应的偏置，$\\tanh$ 是双曲正函数。\n\n细胞状态 $C_t$ 通过结合上一步细胞状态和新细胞状态进行更新：\n\n$C_t\
    \ = f_t \\odot C_{t-1} + i_t \\odot \\tilde{C}_t$ (5)\n\n其中 $\\odot$ 表示逐元素相乘，$C_{t-1}$\
    \ 是细胞状态。\n\n最后，输出门通过将更新的细胞状态通过非线性变换控制当前隐藏状态 $h_t$：\n\n$o_t = \\sigma(W_o \\cdot\
