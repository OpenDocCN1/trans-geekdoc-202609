    outperformed traditional techniques like CSP. Traditional methods, such as CSP-SVM,
    struggled to capture the complex temporal and spatial dimensions in motor imagery,
    resulting in lower classification performance. In contrast, the hybrid model effectively
    leveraged CNN to extract spatial features, which Bi-LSTM captured the sequential
    features of imagery, leading to improved classification performance. The attention
    mechanism, in particular, reduced training time and overall performance. Further
    analysis of classification sensitivity indicates that the model effectively captures
    the neural representations of lower motor imagery, reduces misclassification,
    and enhances robustness.


    Topographical and spectral analyses revealed cortical control during motor imagery,
    with distinct patterns in the contralateral hemisphere. These patterns reflect
    the motor intentions to lead and that the higher resolution of EEG for lower limb
    movements be better compared to upper limb movements. Additionally, it highlights
    the ability to demonstrate motor imagery for different body parts, reinforcing
    the flexibility of EEG to movement detection methods.


    The selection of electrodes C3 and C4 is based on their role in monitoring cortical
    cortex activity during movement. Previous studies show that these electrodes effectively
    captured ERP patterns with lower motor imagery, making them suitable for assessing
    motor-related EEG signals [1, 2]. Compared to previous works, our proposed method
    improves the specificity of our approach in detecting motor imagery-related neural
    responses.


    The proposed hybrid deep learning model offers several key contributions to EEG-based
    motor imagery classification:


    +   1. Development of a cost-effective EEG system, integrating the OpenBCI platform
    to facilitate EEG data acquisition in controlled environments.


    +   2. Improved classification accuracy, with the multi-channel CNN Attention-Bi-LSTM
    achieved 72.1% accuracy, outperforming conventional machine learning approaches.


    +   3. Enhanced feature selection and weighting by the attention mechanism, which
    reduces feature importance and improves classification robustness.


    +   4. Physiological validation through PSD, ERSP, and E/ERS analysis, confirming
    the system''s effectiveness in detecting lower limb motor imagery.


    +   5. Demonstration of system robustness, highlighting its potential application
    in real-world rehabilitation settings despite limited imagery.


    The findings of this study contribute to the development of effective ECI systems
    for stroke rehabilitation, highlighting deep learning models to improve the detection
    and classification of complex motor imagery. By addressing the limitations of
    traditional methods and leveraging a fusion of deep learning techniques, providing
    a promising framework for motor-imagery based BCI applications.


    # 5. Limitations and Future work


    While the proposed deep learning model exhibits potential for lower limb motor
    imagery, first, the dataset used in this study consists only of healthy participants,
    which limits the generalizability of the findings to stroke patients with motor
    impairments. Future research should validate the model''s effectiveness in clinical
    populations to ensure its practical application.


    Second, the model learning techniques for feature extraction and classification,
    its computational complexity presents a challenge, for real-time BCI applications.
    Future works should explore optimization strategies such as model compression
    to enhance the decoding speed.


    Third, EEG-based motor imagery signals are inherently noisy and exhibit significant
    inter-subject variability. The proposed approach improves classification performance,
    further investigations are needed in real-world BCI applications.


    Finally, this study focuses on motor imagery classification, and additional research
    is required to integrate the proposed method into a robotic system. Future work
    will involve experimental validation with stroke patients to assess the system''s
    effectiveness in clinical rehabilitation scenarios.


