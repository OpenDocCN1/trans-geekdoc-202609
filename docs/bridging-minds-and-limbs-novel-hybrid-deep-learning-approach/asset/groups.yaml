    toolbox decomposes the EEG signals into independent components using ICA, for
    the identification and removal of EEG blink movements, artifacts and other sources
    [31]. The user manually or automatically identifies the artifact components, which
    are ensuring that the remaining signal reveals the underlying brain activity relevant
    to motor imagery.


    The study comprises EEG recordings from ten participants, performing 150 motor
    imagery tasks. Each trial consists of 501 time points across 15 channels (including
