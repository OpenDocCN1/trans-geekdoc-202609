  - '[PAGE 11]


    # 6 Conclusions


    This study presents a novel brain-computer interface (BCI) system for detecting
    lower motor imagery, with potential applications in rehabilitation. By using OpenBCI
    with a deep learning framework, the system ensures both hardware capability and
    EEG signal processing. The proposed approach catches key features in imagery classification
    by leveraging CNN for spatial extraction, Bi-LSTM for temporal recognition, and
    an attention mechanism for feature fusion.


    The study demonstrates the feasibility of using consumer-grade EEG devices for
    motor imagery, offering a promising balance between cost and performance. High
    accuracy was further validated the needed system in clinical applications, particularly
    for stroke patients, and to optimize it for real-life rehabilitation. Future research
    should focus on integrating the proposed approach with robotic systems and refining
    its adaptability for personalized rehabilitation.


