    +   - XGBOOST


    XGBoost is also an ensemble technique like other boosting algorithms. It merges
    several machine learning algorithms and using the output of each algorithm provides
    better performance by correcting the errors of each algorithm''s output [12].
    It is more innovative and clear approach approaching with other algorithms. The
    target of algorithm is to minimize the objective function which is defined as


    ```

    \Omega = L + \lambda R

    ```


    L is represented as the training loss factor and \Omega is the regularization
    term, which is defined as


    ```

    L = \sum_{i=1}^{n}(y_i - \hat{y}_i)^2 , \text{and} \Omega = \Gamma + \lambda \sum_{j=1}^{m}
    w_j^2

    ```


    Where $y_i$ and $\hat{y}_i$ are the target and output of the data set. $T$ is
    the number of features, $w_j$ is the weight vector, $\lambda$ is $L2$ regularization,
    and $\Gamma$ is a penalty parameter.


    +   - Voting Classifier


    It is an ensemble solution that does not act as a generic classifier but is for
    a wrapper of several classifiers that are prepared and evaluated in resemblance
    to employ the peculiarities of a specific algorithm. There are two different strategies
    for this, a. Hard voting and b. Soft voting. In hard voting, the model predicts
    votes for a class. In the end, the class with the majority voting is predicted
    as the final output. In soft voting, instead of direct voting, there is a probability
    of single data belonging to a certain class which is also used for each classifier
    representing how important they are to the system. In hard voting or majority
    voting


    ```

    \hat{y} = C_1(x), C_2(x), ... C_m(x)

    ```


    Where, $\hat{y}$ is predicted by majority voting of each classifier $C_i$


    +   - Ensemble-learning


    Random forest is used as a supervised learning algorithm that can be used for
    both classification and regression difficulties. It is also based on the concept
    of ensemble learning, which combines multiple individual classifiers to solve
    a complex problem and improve classifier''s accuracy [13]. RF is a tree-based
    learning algorithm that leverages the power of numerous decision trees for making
    decisions. In the case of classification, the random forest classifier is obtained
    by maximizing the individual trees, which is defined as


    An ensemble algorithm which makes predictions through supervised learning by using
    multiple individual models or weak learners. Basically, many ensembles are available
    bagging and boosting are the most widely known. Among bagging methods are Random
    Bagging, Random Forest and for boosting methods are gradient boosting. Adaboost,
    extreme gradient boosting used widely. Theoretically, ensembles are supposed to
    contain more effective results if the models used are weak, even though some dense
    decision tree algorithm can be better than the deliberate ones and it can be used
    to establish models like Random Forest, Support Vector Machine, Logistic Regression
    etc. For weak learners, two types of voting are used to make predictions, which
    are also soft and hard voting [16]


    ```

    m_j(x;\theta_1, ..., \theta_D) = \frac{1}{M} \sum_{t=1}^{M} m_t(x;\theta_1, ...,
    \theta_D) > 1/2

    ```


    Where, $M$ is the number of regression tree, $D_t(\theta)$ are the data points
    and $\theta$ are independent random variables.


    +   - AdaBoost


    AdaBoost stands for ''Adaptive Boosting'', which focuses on classification difficulties
    and intends to persade a set of weak classifiers into an influential one [14].
    It is the first practical boosting algorithm whose terminal equation can be displayed
    as


    ```

    F(x) = sign(\sum_{t=1}^{T} \alpha_t f_t(x))

    ```


    Where, $f_t$ denotes the m-th weak classifier and $O_m$ represents the corresponding
    weight.


