    Table II demonstrates a set of performance metrics. From the table, the average
    accuracy scores for PIDD are observed in the range of 81% and 87%. The best accuracy
    score was performance achieved by LightGBM, and the Random Forest obtained the
    worst one. LightForest obtained an accuracy of 87%, precision of 77%, recall and
    F1 score of 81% with ROC AUC 93%. The most variance was obtained by RF classifier
    with accuracy, 89%, recall 73.1%, and F1 score of 76% with ROC AUC 90%. XGBoost
    and AdaBoost performed in different accuracy, precision and recall scores. Soft
    voting classifier achieved accuracy 88%, precision 82%, recall 73.8%, and F1 score
    77%, with ROC AUC 94%.


    Table III represents a sequence of performance metrics and accuracy scores for
    the PIDD after preprocessing, which includes imputation and data cleaning. The
    dataset was helped with normalization and scaling. The results average accuracy
    scores ranged from 86% to 94% for multiple classifiers. LightGBM obtained 94%
    accuracy, precision 92%, recall 84%, and F1 score 84.2% with ROC 95%. XGBoost
    obtained an accuracy of 91% on 95% precision, 80.7%, and F1 score 83% with ROC
    92%. AdaBoost generated 88% accuracy score at precision, 89%, recall and F1 score
    of 82% with ROC AUC 92%. Random Forest obtained 86% accuracy at score precision,
    87%, recall 81%, and F1 score 81%. Soft voting classifier achieved 95% accuracy
    at precision, 92%, recall 82.3%, and F1 score 84% with ROC AUC 96%. Execution
    times were 36sec, 45 sec, 48 sec and 57 sec for LightGBM, XGBoost, AdaBoost, Random
    Forest and Soft voting classifier accordingly. We can observe a significant improvement
    in Table III due to data preprocessing.


