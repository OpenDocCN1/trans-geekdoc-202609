  md: '# A Comparative Analysis of Ensemble Based Machine Learning Techniques for
    Diabetes Identification


    Nahid Hossain Tazz, Akbar Islam and Ismail Mahmud

    Department of Electrical and Computer Engineering

    Islam, University of Technology

    Dhaka, Bangladesh


    Email: nahidhossain15@ut-daka.com, akbarislam@ut-daka.com, ismailmahmud@ut-daka.com


    **Abstract—** This manuscript details a framework to develop prediction methods
    using the ensemble-based Machine Learning techniques on Indian Diabetes Dataset
    (PIDD). We investigate the performance of machine classifiers separately by a
    soft voting classifier to enhance the performance of Metrics Identification. The
    classifications are estimated according to accuracy, precision, recall, and ROC
    of individual classifiers. Analyzed performance metrics confirm that LightGB produced
    the optimal result as soft voting improved the complete accuracy to score 95%
    and ROC 96%.


    In recent times, machine learning has been applied to the clinical and medical
    field for disease identification [5]. The most vital and significant purpose of
    classification analysis in the medical and clinical sectors is the accuracy of
    the decisions and predictions. Researchers have worked to develop effective Machine
    Learning methodology using available datasets or to obtain a proper diagnosis
    of various chronic diseases. In recent times, diverse classes of machine learning
    algorithms have been used to distinguish the diabetic as well as for early detection.
    In this paper, a wide range of ensemble machine learning methods have been applied
    to perform the performance metrics and classify the Indian Diabetes Dataset.


    **Keywords—Machine Learning, Diabetes Mellitus, Indian Diabetes Dataset, Ensemble,
    LightGBM, XGBoost, Adaboost, Random Forest, Soft Voting


    # I. INTRODUCTION


    Diabetes is a chronic disease in which the blood glucose of the body becomes too
    high following blood glucose or not metabolized in the body. Diabetes originates
    from various factors; including obesity, unhealthy food, ancestral heredity, etc.
    [1]. Patients of diabetes highly require ongoing monitoring; otherwise, it can
    lead directly to severe complications [2]. The United States Diabetes Association
    categorize two kinds of types of diabetes as Type 1 Diabetes for which the body
    requires the insulin hormone regular regulation of propulsion of insulin; Type
    2 diabetes for which the insulin it cannot be utilized properly [3]. A survey
    depicts in 2019, predicted that 9.3% of the global population has diabetes which
    increased to 9.9% [4]. Diabetes affects health as well as well-being and also
    strictly infringe the finances of the diabetes affected individuals by a very
    high price to get access to affordable insulin, an essential impediment to successful
    treatment which is making impact on the substantial economic loss through medical
    care, catastrophic medical expenditure and loss of job.


    In this paper, Section II discusses the related results performed on PIDD. Section
    III (A) presents the overviews of the relevant dataset with corresponding properties.
    Section III (B) includes the necessary classifier design methods. Section III
    (C) includes the performance metrics. Section IV analyzes and analyzes observations
    and discussions, finally concluded in Section V.


