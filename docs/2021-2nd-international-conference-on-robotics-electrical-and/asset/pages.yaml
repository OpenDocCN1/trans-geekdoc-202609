    # V. CONCLUSION


    In this manuscript, a parallel investigation was demonstrated with machine learning
    techniques to analyze the PIDD data with preprocessing and without preprocessing.
    Multiple machine learning techniques were used to carry out the prediction in
    a 10-fold cross validation procedure. The outcomes indicate that the performance
    provided by LightGB classifier after data preprocessing with an accuracy of 94%
    and maximum ROC AUC at 95%. Further, we investigated soft ensemble classifier,
    which provided us overall best-fitted classifier performance at accuracy 95% and
    ROC 95%. The objective of ensemble learning is that it practices multiple classifiers
