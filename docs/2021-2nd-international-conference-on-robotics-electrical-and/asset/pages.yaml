    # III. PROPOSED FRAMEWORK.


    # A. DATA SELECTION


    The Pima Indian diabetes dataset (PIDD) is a publicly available dataset obtained
    from UCI machine learning repository for experimental purposes. This dataset is
    a compilation of information from Piman Indians with 21 years of history and in
    the presence of Arabic and Phoenix Indians [10]. The dataset includes 768 instances
    (268 males and 500 females) of 9 attributes (all numeric) and 1 binary class;
    1 and 0 designate patient status. It is noticeable that enough missing data is
