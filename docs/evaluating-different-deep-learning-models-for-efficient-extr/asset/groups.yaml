  - "[PAGE 0]\n\nCite this: *Phys. Chem. Chem. Phys.*, 2023, **25**, 16340\n\n# #\
    \ Evaluating different deep learning models for efficient extraction of Raman\
    \ signals from CARS spectra\n\nRajendhar Junjuri,‡*ab Ali Saghi,‡†a Lasse Lensu†a\
    \ and Erik M. Vartiainen†a\n\nThe nonresonant background (NRB) contribution to\
    \ the coherent anti-Stokes Raman scattering (CARS) signal distorts the spectral\
    \ line shapes and thus degrades the chemical information. Hence, finding an effective\
    \ approach for removing NRB and extracting resonant vibrational signals is a challenging\
    \ task. In this work, a bidirectional LSTM (Bi-LSTM) neural network is explored\
    \ for the first time to remove the NRB in the CARS spectra automatically, and\
    \ the results are compared with those of three DL models reported in the literature,\
    \ namely, convolutional neural network (CNN), long short-term memory (LSTM) neural\
    \ network, and very deep convolutional autoencoders (VECTOR). The results of the\
    \ synthetic test data have shown that the Bi-LSTM model accurately extracts the\
    \ spectral lines throughout the range. In contrast, the other three models’ efficiency\
    \ deteriorated while predicting the peaks on either end of the spectra, which\
    \ resulted in a 60 times higher mean square error than that of the Bi-LSTM model.\
    \ The Pearson correlation analysis demonstrated that Bi-LSTM model performance\
    \ stands out from the rest, where 94% of the test spectra have correlation coefficients\
    \ of more than 0.99. Finally, these four models were evaluated on four complex\
    \ experimental CARS spectra, namely, protein, yeast, DMPC, and ADP, where the\
    \ Bi-LSTM model has shown superior performance, followed by CNN, VECTOR, and LSTM.\
    \ This comprehensive study provides a giant leap toward simplifying the analysis\
    \ of complex CARS spectroscopy and microscopy.\n\nReceived 9th April 2023,  \n\
    Accepted 26th May 2023  \n\nDOI: 10.1039/d3cp01618h  \n\nrsc.li/pccp\n\n# ## 1.\
    \ Introduction\n\nThe spontaneous Raman spectroscopic technique measures the vibrational\
    \ response of molecules and provides functional and compositional information\
    \ on the major chemical constituents. However, the acquired Raman signal strength\
    \ is weak and, combined with the fluorescence contributions, result in longer\
    \ acquisition times, limiting its applications. In contrast, coherent anti-Stokes\
    \ Raman scattering (CARS) is a nonlinear analytical method that offers similar\
    \ fingerprint information to the spontaneous Raman technique, albeit orders of\
    \ magnitude faster.¹,² This characteristic property enabled it as a prominent\
    \ spectroscopic tool for the label-free imaging of cells³ and tissues⁴ in biomedical\
    \ applications.⁵ Also, it has been significantly explored in other applications,\
    \ such as materials science\n\nand nanotechnology. The intensity of the CARS signal\
    \ is proportional to the susceptibility term and can be expressed as\n\n$I_{\\\
    mathrm{CARS}} \\propto \\left|\\chi_{\\mathrm{NR}}^{(3)} + \\chi_{\\mathrm{R}}^{(3)}(\\\
    omega)\\right|^2$  (1)\n\nHere, χₙᵣ⁽³⁾ and χᵣ⁽³⁾ correspond to the nonresonant\
    \ and resonant third-order susceptibilities, respectively. As CARS is a coherent\
    \ phenomenon, the χₙᵣ⁽³⁾ and χᵣ⁽³⁾ responses of the sample interfere via eqn (1)\
    \ and thus the nonresonant background (NRB) contribution cannot be removed by\
    \ simple subtraction. The NRB serves as a stable homodyne amplifier which is responsible\
    \ for the signal strength of CARS. Nevertheless, this coherent contribution simultaneously\
    \ perturbs the measured CARS signal that significantly distorts the spectral line\
    \ shapes. It is an inherent limitation in all CARS-based methods. In this milieu,\
    \ various optical-based techniques have been explored to tackle the NRB, such\
    \ as single-frequency CARS,⁶ frequency modulation CARS,⁷ polarization CARS,⁸ interferometric\
    \ CARS,⁹ and pulse shaping CARS.¹⁰ All these experimental methods have reduced\
    \ the NRB contribution but at the cost of increasing experimental complexity and\
    \ price. With the NRB being a coherent signal, all these alternatives also drastically\
    \ reduced the CARS spectral line intensities,¹¹ thus cancelling the benefit of\
    \ the CARS approach.¹² Furthermore, surrogate materials,\n\nᵃ LUT School of Engineering\
    \ Science, LUT University, 53851 Lappeenranta, Finland.  \nE-mail: rajendhar.j2008@gmail.com\
    \  \nᵇ Leibniz Institute of Photonic Technology, Albert-Einstein-Strasse 9, 07745\
    \ Jena, Germany  \n† Electronic supplementary information (ESI) available. See\
    \ DOI: https://doi.org/10.1039/d3cp01618h  \n‡ These authors contributed equally."
