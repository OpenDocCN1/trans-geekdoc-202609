    The LSTM architecture is usually applied to ordered data without time labels like
    text classification or to constant time-sampling rates such as stock price predictions.
    All these are usually observed in irregular time-sampling rates. Hence, a preprocessing
    method named functional principal component analysis (FPCA) was applied. Therefore,
    an additional dimension is needed to contain the phase information of the spectrum.
    Hence, the DL model should have an additional channel to contain it as the input
    data as well. LSTM does not have this channel, so as the solution, the Bi-LSTM
    model has been used and the phase information was integrated as the input as well.
    The proposed Bi-LSTM architecture was obtained from this work.44 It consists of
    three bidirectional layers, each of them having 30 units, and a time-distributed
    fully connected layer as output, therefore achieving an output for each time step.
    MSE and Nadam were used as the loss function and the optimizer, respectively.44


