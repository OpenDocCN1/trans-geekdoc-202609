    Rajendhar Junjuri (RJ) 进行了分析并准备了初稿。Ali Saghi (AS) 训练了 VECTOR 模型并对分析部分也做出了贡献。最后，稿件由
    LL、EMV 和 AS 修订。


    ## 利益冲突


    无利益冲突可声明。


    ## 致谢


    本工作是“材料与生命科学定量化学特异性成像基础设施（qCSI）”项目的一部分，由芬兰科学院资助（项目编号 FIRI/327734）。此外，我们感谢 Michiel
    Müller 和 Hilde Rinia 提供 DMPC 脂质样品和 AMP/ADP/ATP 混合物的实验测量，Masanari Okuno 和 Hideaki
    Kano 提供酵母样品的实验测量，以及 Yelena Kan 和 Sapun Parekh 提供蛋白质液滴的测量。


