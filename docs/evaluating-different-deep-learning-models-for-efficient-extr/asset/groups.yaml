    ## 5. 结论


    我们系统地评估了四种 DL 模型，即 CNN、LSTM、VECTOR 和 Bi-LSTM，以从 CARS 光谱中检索拉曼信号。这四种算法在根本上彼此不同，并在将它们应用于
    CARS 数据分析的背景下提供了全面的概述。所有模型均使用 NRB 为四阶多项式函数模拟的 CARS 进行训练。测试数据集（300 个光谱）是独立生成的，其中每
    100 个光谱考虑三种不同的 NRB（四阶多项式函数、两个 sigmoid 的乘积和单个 sigmoid）。测试光谱的预测显示 Bi-LSTM 性能优越，其中测量的均方误差比其他三个模型低
    60 倍。此外，它预测了光谱两端的光谱线，但其他三个模型无法提取相同结果。此外，相关性分析显示，97% 的测试数据对 Bi-LSTM 模型的关联系数高于其他三个模型。此外，~94%
    的总测试光谱的 PCC 值 >0.98 为 Bi-LSTM 模型，而 VECTOR 为 57%，LSTM 为 34%，CNN 为 44%。最后，对四个实验样品（蛋白质、DMPC、ADP
    和酵母）的预测也证实了这一点，其中 Bi-LSTM 模型的预测能力相比其他三个模型最佳。这项系统研究表明 Bi-LSTM 模型具有巨大潜力，并为分析 CARS
    数据提供了巨大飞跃。


    ## 作者贡献


    Rajendhar Junjuri (RJ)、Lasse Lensu (LL) 和 Erik M. Vartiainen (EMV) 构思了实验的想法。

