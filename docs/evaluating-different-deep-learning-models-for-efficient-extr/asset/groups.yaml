    ## 2.2 实验 CARS 数据的细节


    CARS 数据来自四个样品，即 ADP、DMPC 脂质、酵母以及 FUS-LC 蛋白滴（融合于肉瘤的低复杂度结构域）。前三个样品在一种实验配置下记录，其光学布局可在
    此处³⁷ 找到。ADP 是水中 AMP、ADP 和 ATP 的等摩尔混合物，总浓度为 500 mM。DMPC 是浓度为 75 mM 的小单层囊泡（SUV）悬浮液。第三个样品是活的出芽酵母细胞（*Saccharomyces
    cerevisiae* 的合子），测量自酵母细胞的线粒体。³⁸ Y. Kan *et al.* 使用自制的宽带 CARS 显微镜测量了覆盖 FUS-LC 液滴（蛋白质）指纹区和
    CH 振动区的超宽带 CARS 光谱。³⁹ 该蛋白质样品是 RNA 结合蛋白融合肉瘤的低复杂度结构域（FUS-LC）。³⁹ 此外，样品制备细节和 CARS
    测量已在其他地方解释。⁴⁰ CARS 线形（最上方的线形）通过小波棱镜程序进行去噪¹⁷，对应的拉曼线形通过 MEM 程序计算。⁴¹


