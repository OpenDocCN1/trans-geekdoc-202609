    # 5. Conclusions


    We have systematically evaluated four DL models, namely, CNN, LSTM, VECTOR, and
    Bi-LSTM, to retrieve the Raman signals from the CARS spectra. These four algorithms
    fundamentally differ from each other and provide a comprehensive overview in the
    context of applying them to CARS data analysis. All the models were trained with
    CARS simulated with the NRBs as a fourth-order polynomial function. The test dataset
    (300 spectra) is independently generated, where three different NRBs (a fourth-order
    polynomial function, a product of two sigmoid, and a single sigmoid) are considered
    for every 100 spectra. The predictions of the test spectra revealed that Bi-LSTM
    performance is superior, where the measured mean square error is 60 times less
    compared to the other three models. Also, it predicted the spectral lines on either
    end of the spectra, but the other three models could not extract the same. Furthermore,
    the correlation analysis revealed that 97% of test data have a higher correlation
    coefficient for the Bi-LSTM model than the other three models. Also, ~94% of total
    test spectra have PCC values >0.98 for the Bi-LSTM model, whereas the value is
    57% for the VECTOR, 34% for the LSTM, and 44% for the CNN model. Finally, the
    predictions on four experimental samples (protein, DMPC, ADP, and yeast) also
    confirmed the same, where the predictive capability is best for the Bi-LSTM model
    compared to the other three. This systematic study shows that the Bi-LSTM model
    has great potential and provides a giant leap toward analysing the CARS data.


