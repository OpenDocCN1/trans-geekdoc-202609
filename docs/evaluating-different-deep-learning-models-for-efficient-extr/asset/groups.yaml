    LSTM 架构通常应用于无时间标签的有序数据，如文本分类，或恒定时间采样率的数据，如股价预测。所有这些通常在不规则时间采样率中观察到。因此，应用了一种名为函数主成分分析（FPCA）的预处理方法。因此，需要一个额外的维度来包含光谱的相位信息。因此，DL
