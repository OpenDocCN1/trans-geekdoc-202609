  mdcn: "\n引用本文：*Phys. Chem. Chem. Phys.*, 2023, **25**, 16340\n\n## 评估不同深度学习模型从 CARS\
    \ 光谱中高效提取拉曼信号\n\nRajendhar Junjuri,‡*ab、Ali Saghi,‡†a、Lasse Lensu†a 和 Erik M.\
    \ Vartiainen†a\n\nᵃ LUT 大学工程科学学院，53851 拉彭兰塔，芬兰。  \n电子邮箱：rajendhar.j2008@gmail.com\
    \  \nᵇ 莱布尼茨光子技术研究所，Albert-Einstein-Strasse 9，07745 耶拿，德国  \n† 提供电子补充信息（ESI）。参见\
    \ DOI：https://doi.org/10.1039/d3cp01618h  \n‡ 这些作者贡献相同。\n\n非共振背景（NRB）对相干反斯托克斯拉曼散射（CARS）信号的贡献会扭曲谱线形状，从而削弱化学信息。因此，找到一种有效的方法来去除\
    \ NRB 并提取共振振动信号是一项具有挑战性的任务。在这项工作中，首次探索了双向长短期记忆（Bi-LSTM）神经网络来自动去除 CARS 光谱中的 NRB，并将结果与文献中报道的三种\
    \ DL 模型——即卷积神经网络（CNN）、长短期记忆（LSTM）神经网络和超深卷积自编码器（VECTOR）——的结果进行了比较。合成测试数据的结果表明，Bi-LSTM\
    \ 模型在整个范围内都能准确提取谱线。相比之下，其他三种模型在预测光谱两端的峰时效率下降，导致其均方误差是 Bi-LSTM 模型的 60 倍。皮尔逊相关分析表明，Bi-LSTM\
    \ 模型的性能脱颖而出，其中 94% 的测试光谱的相关系数超过 0.99。最后，这四个模型在四种复杂的实验 CARS 光谱（即蛋白质、酵母、DMPC 和 ADP）上进行了评估，其中\
    \ Bi-LSTM 模型表现出优越的性能，其次是 CNN、VECTOR 和 LSTM。这项综合研究为简化复杂 CARS 光谱和显微分析迈出了一大步。\n\n\
    收稿日期：2023年4月9日，  \n接受日期：2023年5月26日  \n\nDOI: 10.1039/d3cp01618h  \n\nrsc.li/pccp\n\
    \n### 1. 引言\n\n自发拉曼光谱技术测量分子的振动响应，并提供主要化学成分的功能和组成信息。然而，所获取的拉曼信号强度较弱，再加上荧光贡献，导致采集时间较长，从而限制了其应用。相比之下，相干反斯托克斯拉曼散射（CARS）是一种非线性分析方法，它提供与自发拉曼技术相似的指纹信息，但速度快了几个数量级¹,²。这一特性使其成为生物医学应用中细胞³和组织⁴无标记成像的重要光谱工具⁵。此外，它还在材料科学和纳米技术等其他应用中得到广泛探索。CARS\
    \ 信号强度与极化率项成正比，可表示为\n\n$I_{\\mathrm{CARS}} \\propto \\left|\\chi_{\\mathrm{NR}}^{(3)}\
    \ + \\chi_{\\mathrm{R}}^{(3)}(\\omega)\\right|^2$  (1)\n\n这里，χₙᵣ⁽³⁾ 和 χᵣ⁽³⁾ 分别对应于非共振和共振的三阶极化率。由于\
    \ CARS 是一种相干现象，样品的 χₙᵣ⁽³⁾ 和 χᵣ⁽³⁾ 响应通过公式 (1) 发生干涉，因此非共振背景（NRB）贡献不能通过简单的减法去除。NRB\
    \ 充当稳定的零差放大器，它决定了 CARS 的信号强度。然而，这种相干贡献同时也会扰动所测量的 CARS 信号，从而显著扭曲谱线形状。这是所有基于 CARS\
    \ 的方法固有的局限性。在此背景下，人们探索了各种基于光学的方法来应对 NRB，例如单频 CARS⁶、频率调制 CARS⁷、偏振 CARS⁸、干涉 CARS⁹\
    \ 和脉冲整形 CARS¹⁰。所有这些实验方法都降低了 NRB 贡献，但代价是增加了实验复杂性和成本。由于 NRB 是相干信号，所有这些替代方法也大幅降低了\
    \ CARS 谱线强度¹¹，从而抵消了 CARS 方法的优势¹²。此外，盖玻片–玻璃、盐和水等替代材料在传统上一直被用于降低 NRB 效应。这些材料在宽光谱窗口内几乎没有或没有振动峰，虽然缓解了一些不良影响，但引入了测量幅度上的误差。\n\
    \n因此，寻找无需物理去除 NRB 即可提取相位关系的其他方法至关重要。在这种情况下，最大熵法（MEM）¹³和克拉默斯–克勒尼希（KK）关系¹⁴等数值方法已被广泛用于相位恢复。此外，文献中还报道了其他算法方法，如“相位误差校正”¹⁵、“分解克拉默斯–克勒尼希与误差校正”¹⁶和“小波棱镜分解分析”¹⁷，以减轻\
    \ CARS 光谱中的实验伪影和谱线畸变。最近，Charles 等人提出了离散希尔伯特变换来去除 NRB¹⁸。然而，这些数值技术需要替代参考材料，并且/或者需要调整其他模拟参数以获得最佳结果。所有这些复杂性都可以通过利用机器学习算法来克服，模型从输入的\
    \ CARS 数据中学习并预测拉曼信号¹⁹。深度神经网络（DNN）已在多种应用中得到了探索，例如天气预报²⁰、自然语言处理²¹和计算机视觉²²。此外，它也被用于不同的光谱学领域，例如高光谱图像分析²³、振动光谱²⁴,²⁵、分子激发光谱²⁶和激光诱导击穿光谱²⁷–²⁹。\n\
    \n近年来，人们也通过 CARS 光谱探索了各种深度学习（DL）方法来处理 NRB 去除问题³⁰–³⁵。Valensise 等人利用卷积神经网络（CNN）模型从\
    \ CARS 光谱数据中恢复虚部³¹。这是利用 DL 方法去除 NRB 的首篇报道，被称为 SpecNet。Houhou 等人使用长短期记忆（LSTM）神经网络模型来恢复拉曼信号，并将他们的结果与\
    \ MEM 和 KK 的结果进行了比较³⁰。Wang 等人采用超深卷积自编码器（VECTOR）去除 NRB，并将其模型性能与 SpecNet 进行了比较³²。他们还表明，具有16层的\
    \ VECTOR 模型在更短的计算时间内给出了最优结果。\n\n我们最近的工作表明，使用半合成和合成数据组合重新训练 SpecNet 可以提高其性能³³。我们还应用了迁移学习方法，以提高\
    \ CNN 模型在恢复 CARS 光谱虚部方面的效能³⁴。此外，还在不同水平上改变噪声，以分析迁移学习后模型的灵敏度。最近，我们还探索了三种不同的 NRB\
    \ 类型来模拟 CARS 数据³⁵。研究结果表明，将 NRB 视为四阶多项式函数而不是两个 sigmoid 函数的乘积，可以提高 CNN 模型的效率。这三项工作都显示出优于\
    \ SpecNet 的性能，即使是强度极小的谱线也能被预测³³–³⁵。尽管使用多项式 NRB 训练的 CNN 模型预测了实验数据的全部谱线，但少数谱线的强度与真实值存在偏差。此外，LSTM³⁰\
    \ 和 VECTOR 模型³² 也获得了类似结果，在评估实验 CARS 数据时，其性能表现出敏感性。\n\n此外，在整个光谱范围内估计均方误差（MSE）可被视为评估模型效率的关键参数。然而，据我们所知，除我们的工作³³–³⁵外，没有其他报道介绍过这一点。值得注意的是，SpecNet\
    \ 在预测光谱两端的峰时给出了较高的 MSE。观察到的原因是，当模型遇到只有上升或下降部分而没有完整线形的谱线时，无法提取峰。即使使用半合成数据³³对 SpecNet\
    \ 进行再训练、应用迁移学习³⁴，以及使用通过多项式 NRB 模拟的 CARS 数据进行训练³⁵，也无法避免这一问题，并对模型的预测能力提出了挑战。这些研究表明，在\
    \ CNN、LSTM 和 VECTOR 模型之外探索其他 DL 方法，可以缓解上述局限性。\n\n因此，在本工作中，我们首次探索了 Bi-LSTM 模型来提取\
    \ CARS 光谱的虚部。此外，在生成 CARS 训练数据时，假定 NRB 为四阶多项式函数，这已经显示出最优结果³⁵。此外，我们通过比较四种 DL 模型（即\
    \ (1) VECTOR、(2) CNN、(3) LSTM 和 (4) Bi-LSTM）的性能，开展了一项综合研究。据我们所知，这项比较研究尚属首次，并批判性地评估了训练模型从\
    \ CARS 数据中恢复拉曼信号的效率。\n\n### 2. 实验细节\n\n#### 2.1 CARS 光谱模拟\n\n所有模型均在纯合成光谱数据上进行了训练，训练参数包括峰数、强度、频率和线宽，以使其能够推广到不同\
    \ NRB 的光谱形状。CARS 光谱模拟过程可参见我们之前的工作³⁵。模拟参数详情见表1。\n\n简言之，振动频率在归一化范围 [0, 1] 上采样。NRB\
    \ 被视为如公式 (2) 所示的四阶多项式函数\n\n$\\mathrm{NRB} = a\\omega^4 + b\\omega^3 + c\\omega^2\
    \ + d\\omega + e$  (2)\n\n**表1** 模拟参数详情\n\n| 序号 | 模拟参数 | 范围 |\n|---|---|---|\n\
    | 1 | 峰数 | (1, 15) |\n| 2 | 峰振幅（A_k） | (0.01, 1) |\n| 3 | 线宽（Γ_k） | (0.001, 0.008)\
    \ |\n| 4 | 噪声 η(ω) | (0.0005, 0.003) |\n\n"
