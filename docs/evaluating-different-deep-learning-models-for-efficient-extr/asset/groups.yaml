    such as coverslip–glass, salt, and water, have been traditionally utilized to
    reduce the NRB effect. These materials contain minimal or no vibrational peaks
    in a large spectroscopic window and have mitigated some of the ramifications but
    introduced errors in the measured amplitude.


    Consequently, exploring for other methods to extract the phase relationship without
    physically removing the NRB is of paramount importance. In this context, numerical
    approaches such as the maximum entropy method (MEM)¹³ and the Kramers–Kronig (KK)
    relation¹⁴ have been widely utilized for phase retrieval. Furthermore, other algorithmic
    methods such as “phase-error correction”,¹⁵ “factorized Kramers–Kronig and error
    correction”,¹⁶ and “wavelet prism decomposition analysis”,¹⁷ are also reported
    in the literature to mitigate the experimental artefacts and spectral line distortions
    in the CARS spectra. Recently, Charles et al. have proposed discrete Hilbert transform
    to remove the NRB.¹⁸ However, these numerical techniques require a surrogate reference
    material, and/or the other simulation parameters need to be tuned to get the best
    results. All these complications can be overcome by utilizing machine learning
    algorithms where the model learns from the input CARS data and predicts the Raman
    signal.¹⁹ Deep neural networks (DNNs) have been explored in several applications,
    such as weather forecasting,²⁰ natural language processing,²¹ and computer vision.²²
    Moreover, it is also utilized in different spectroscopies, such as hyperspectral
    image analysis,²³ vibrational spectroscopy,²⁴,²⁵ molecular excitation spectroscopy,²⁶
    and laser-induced breakdown spectroscopy.²⁷–²⁹


    Various deep learning (DL) approaches have also been recently explored via CARS
    spectroscopy to tackle the NRB removal problem.³⁰–³⁵ Valensise et al. have utilized
    a convolutional neural network (CNN) model to retrieve the imaginary part from
    the CARS spectral data.³¹ It is the first report on utilizing DL methods for removing
    the NRB and is referred to as SpecNet. Houhou et al. have used a long short-term
    memory (LSTM) neural network model to retrieve the Raman signal and their results
    are compared with the results of the MEM & KK.³⁰ Wang et al. deployed very deep
    convolutional autoencoders (VECTOR) for removing the NRB, and their model’s performance
    is compared with that of SpecNet.³² They have also shown that the VECTOR model
    with 16 layers has given optimum results in less computational time.


    Our recent works have demonstrated that retraining the SpecNet with a combination
    of semisynthetic and synthetic data improves its performance.³³ We have also applied
    a transfer learning approach to increase the CNN model efficacy in retrieving
    the imaginary part of the CARS spectra.³⁴ Furthermore, the noise is also varied
    at various levels to analyse the sensitivity of the model after transfer learning.
    Very recently, we have also explored three different NRB types to simulate the
    CARS data.³⁵ It has been revealed that considering the NRB as a fourth-order polynomial
    function instead of a product of two sigmoids improves the CNN model’s efficiency.
    These three works have shown superior performance compared to the SpecNet, where
    spectral lines with minimal intensities are also predicted.³³–³⁵ Even though the
    CNN model trained with


    polynomial NRB has predicted all the spectral lines of the experimental data,
    the intensity of a few lines deviated from the true one. Also, similar results
    were obtained with the LSTM³⁰ and VECTOR models,³² where the performance was found
    to be sensitive when evaluating the experimental CARS data.


    Furthermore, estimating the mean square error (MSE) throughout the spectral range
    can be considered as a critical parameter for evaluating the model’s efficiency.
    However, no other reports have presented it, excluding our works³³–³⁵ to the best
    of our knowledge. It should be noted that the SpecNet has given a high MSE while
    predicting the peaks at the ends of the spectrum. It is observed because the model
    could not extract peaks when it encountered the spectral line that only had a
    rising or falling part instead of a full line shape. Even retraining SpecNet with
    semisynthetic data,³³ applying transfer learning,³⁴ and training with the CARS
    data simulated via polynomial NRB³⁵ could not avoid it and challenged the predictive
    ability of the models. These studies hint that exploring other DL approaches in
    addition to the CNN, LSTM, and VECTOR models can mitigate the aforementioned limitations.


    Hence, in this work, we have explored the Bi-LSTM model for the first time for
    extracting the imaginary part of the CARS spectra. Also, the NRB is assumed to
    be a fourth-order polynomial function while producing the CARS training data,
    which has already shown optimum results.³⁵ Furthermore, a comprehensive study
    is performed by comparing the performance of four DL models, namely, (1) VECTOR,
    (2) CNN, (3) LSTM, and (4) Bi-LSTM. This comparative study has been done for the
    first time to the best of our knowledge, and critically evaluates the trained
    model’s efficiency in retrieving the Raman signal from the CARS data.


    # 2. Experimental details


    # 2.1 CARS spectra simulations


    All the models have been trained on pure synthetic spectral data with parameters
    of the number of peaks, intensity, frequency, and linewidths to enable them to
    be generalized to the different spectral shapes of NRBs. The CARS spectrum simulation
    procedure can be found in our previous work.³⁵ The simulation parameter details
    are presented in Table 1.


    In brief, the vibrational frequencies are sampled over a normalized scale [0,
    1]. The NRB is considered as a function of fourth-order polynomial as given in
    eqn (2)


    NRB = aω⁴ + bω⁴ + cω⁴ + d + e  (2)


    Table 1 Details of the simulation parameters


    | S. no | Simulation parameters | Range |

    |---|---|---|

    | 1 | No of peaks | (1, 15) |

    | 2 | Peak amplitude (A_k) | (0.01, 1) |

    | 3 | Line width (Γ_k) | (0.001, 0.008) |

    | 4 | Noise η(ω) | (0.0005, 0.003) |'
