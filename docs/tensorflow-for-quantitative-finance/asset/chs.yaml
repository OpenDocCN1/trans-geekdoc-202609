  \n### 示例：信用违约预测\n\n考虑一个数据集，其中每条记录代表客户的财务历史，目标是预测客户是否会发生贷款违约。\n\n```python\n# 生成合成分类数据\n\
  from sklearn.datasets import make_classification\nx, y = make_classification(n_samples=1000,\
