  param_grid = {'batch_size': [10, 20, 40], 'epochs': [10, 20, 30], 'optimizer': ['adam',\
  \ 'rmsprop']}\ngrid = GridSearchCV(estimator=model, param_grid=param_grid, n_jobs=-1,\
