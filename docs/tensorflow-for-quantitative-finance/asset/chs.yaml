  \n\n\n此示例演示了如何连接到 SQLite 数据库、执行查询检索数据并使用 `pandas` 将其加载到 DataFrame。\n\n## 处理不同的数据格式\n\
  \n金融数据以多种格式存在，每种都有其特殊之处。了解如何处理这些格式对于无缝导入数据关重要。\n\n### 示例：处理 JSON 数据\n\n许多 API 返回\
  \ JSON 格式的数据，可以将其解析并转换为 DataFrame。\n\n```python\nimport pandas as pd\nimport numpy\
