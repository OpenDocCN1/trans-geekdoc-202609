    a realistic detector model for both types of crimes; however, limitations in dispatches
    are not included.


    In [18], Hu et al. devised a multi-UAV collaborative approach which uses both
    communication and seeing limitations. This approach also focuses on agreement
    among the UAVs in order to maintain analogous charts about each robot with a limited
    number of compliances.


