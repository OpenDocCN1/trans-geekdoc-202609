  md: '# 9 An Efficient and Accurate Classification Algorithm for ECG Signals Using
    PNN and KNN


    R. Anandha Praba, L. Suganthi, and E.S. Selva Priya


    DOI: 10.1201/9781003465775-9


    # 9.1 INTRODUCTION


    Cardiovascular diseases are a major concern, causing a high mortality rate every
    year. According to a survey [1], hypertension, obesity, and diabetes are the major
    reasons for congestive heart failure, with 1.3–4.6 million incidents every year,
    according to statistics. The automated detection and classification of ECG have
    been broadly focused on analyzing cardiac diseases. ECG signals are used to diagnose
    various heart conditions, and as such, collecting and analyzing large amounts
    of ECG data can be valuable in identifying trends and patterns in cardiac health.
    Big data refers to large, complex datasets that are too big to handle using traditional
    data processing techniques. The analysis of ECG data poses significant technical
    challenges that require advanced computing tools and algorithms to process and
    analyze. Collecting the big data of ECG signals can involve the continuous monitoring
    of large numbers of patients using wearable ECG devices or other monitoring equipment.
    The collected data can then be stored in databases and analyzed using advanced
    machine learning and data analysis techniques to identify patterns and trends.
    One example of the use of big data in ECG signals is to analyze the data from
    patients with arrhythmias. By comparing the ECG signals of many patients with
    arrhythmias, researchers can identify commonalities in the data that can help
    identify specific types of arrhythmias or potential risk factors. Another example
    is using big data to identify the risk of cardiac events, such as heart attacks
    or'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'strokes. By analyzing large amounts of ECG data from patients with a history
    of cardiac events, researchers can identify patterns in the data that may be predictive
    of future events. Overall, collecting and analyzing the big data of ECG signals
    can provide valuable insights into cardiac health, potentially leading to earlier
    detection and better treatment of heart conditions.


    With the increasing use of wearable ECG devices and other monitoring equipment,
    there is a growing need for advanced tools and techniques to manage and analyze
    this vast amount of data. By leveraging big data technologies such as machine
    learning, data mining, and predictive analytics, researchers and health professionals
    can identify patterns and trends in ECG data that can provide more accurate diagnosis
    and tailored treatment plans, and improve patient outcomes.


    One approach to performing the test is to have a prolonged record of the cardiovascular
    activity during a person''s typical daily activity. The major issue with long-term
    recording from individuals is that the ECG signal can be significantly affected
    by external noises, potentially resulting in incorrect data classification. To
    improve the signal quality, noise cancellation must be implemented through the
    application of signal processing filtering algorithms. Power line interference
    (PLI) is a major culprit that affects the quality of the acquired signal, typically
    falling within the range of 50–60 Hz. In addition to PLI, the signal can also
    be affected by high- and low- frequency noises across various frequency ranges.
    As previously discussed, the recorded signal can be heavily impacted by noises
    such as high- and low-frequency noise caused by PLI, muscle tremor, and electrode
    movement.


    Adaptive filtering techniques work by estimating the noise present in the input
    ECG signal. This is achieved by conducting the filtering operation based on the
    provided input and estimating the noise within the input, which includes both
    the information source and the noise. As a result, the output produced by the
    adaptive filter will be free from noise and maintain the integrity of the data.
    The most widely accepted adaptive filtering technique is the normalized least
    mean square (NLMS) filter, which is a modified version of the LMS algorithm that
    overcomes the instability issues associated with the LMS filter. This stability
    is achieved by applying a normalization process to the input power [2, 3, 4, 5].'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'Once the signal is preprocessed without any noise, the next step is to

    extract the features from the denoised data. A variety of feature extraction

    techniques are discussed in the literature. The most prominent features of

    the input ECG waveform are peak-to-peak intervals, peak amplitudes, and

    the QRS complex. By applying CWT and a neural network, a study [6]

    developed a new technique to detect and classify the QRS complex in ECG

    signals. This technique results in QRS complex detection among various

    morphologies by applying four wavelet basis functions. Signal denoising

    and feature extraction are also achieved using thresholding, resulting in

    97.2% accuracy in terms of classification. In [7], a complex QRS

    identification with different decision rules for event vectors is implemented.

    Experts have proven a wavelet transformation method to extract these

    features accurately. To obtain the morphological features [8], DWT is

    applied to each heartbeat. RR interval data is used as the dynamic feature.

    Independent component analysis is applied for the reduction of the

    dimensions of DWT sub-bands, and 12 coefficients are chosen as

    morphological features. Principal component analysis (PCA) and dynamic

    time warping (DTW) are used to extract morphological features from P-

    QRS-T waves, and ECG features are acquired from the input ECG segment

    [9]; finally, support vector machine (SVM) is used over the extracted

    features, and the results of automated diagnosis are presented. In studies

    [10, 11], R-peaks are detected using a multi-resolution approach combined

    with adaptive thresholding. Denoising is done by removing the D1 and D2

    detailed coefficients. In addition, real-time electrocardiogram wave peak

    detection is also possible [12]. To improve the accuracy of the current

    classification algorithm, categorization of an input ECG is done by fusion

    feature under multi-classification conditions. Multilayer CNN and RNN are

    used in the algorithm [13]. The most traditional and simplest method for

    extracting the QRS complex is discussed in [14], where the authors describe

    an algorithm to observe the QRS complex by enabling the input ECG signal

    through a sequence of processes. Primarily, the input ECG signal is passed

    through low-pass and high-pass filters, designed with appropriate cutoff

    frequencies to locate the main energy of ECG. Following the filtering

    process, differentiation, squaring, and averaging of the signal are

    performed. To complete the averaging process, a sliding window has to be

    chosen.'
  merge: -1
  img_proc: true
