    # 3.3 EXPERIMENTAL SETUP


    # 3.3.1 DATASET


    In this section, we will be working on various datasets as each dataset serves
    a different purpose; while some are used for training, some are used for exploratory
    data analysis. The dataset, which provides total confirmed cases, deaths, and
    recoveries, is provided by JHU. Each of the mentioned datasets has columns with
    the country name, state/province, latitude, and longitude coordinates, and the
    total cases denoted from 27 January and the dataset gets updated every day. However,
    in the USA, the recovered were set to 0 after 12 December, as the source where
    the university obtained the values stopped providing the same.


    The next dataset used was obtained from crowd-sourced application programming
    interface (API), which provides data on various categories in India. The Indian
    Council of Medical Research (ICMR) provided testing details of the country as
    a whole from January as well as the testing details for each state from January,
    and it also shows the various kinds of tests performed by each state and state
    vaccination details. There is another dataset that has the details of various
    factors such as reproduction rate, vaccination rate, number of patients in ICUs,
    and so on for various countries, which is provided by a website called owid, available
    on GitHub. While most of the data are obtained from reliable sources, data on
    COVID-19 in general isn’t as reliable as there is a high chance of asymptomatic
    cases.


    # 3.3.2 TRAINING HYPER-PARAMETERS


    The hyper-parameters are important as the different models use these hyper-parameters
    to make their predictions. The parameters provided work on the calculation of
    various equations for that specific model. When the appropriate parameters have
    been specified, the model uses the parameters'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'and calculates the necessary output based on the input data. The hyper-parameters
    which we have used in our RNN models are as follows.


    Batch size: This provides the total number of samples from the particular data
    set that has to be trained on the model. We could say that the total number of
    samples used for training the model for predictions, which are then compared with
    the true values, and the parameters are updated based on the changes required.
    There are several types of batches: batch gradient descent, when the entire samples
    are used as the batch size; stochastic gradient descent, when the batch size =
    1, that is, one sample is trained on the model at a time; and mini-batch, when
    n number of samples are considered where n is greater than 1 and less than the
    dataset size. The type we used is stochastic gradient descent for training or
    model for all the LSTMs used.


    Epochs: The number of epochs determines the amount of time the entire dataset
    was able to modify the parameters to our dataset. One epoch indicates that each
    sample in the dataset has been used once to update parameters or has been used
    for training the model. The number of epochs used on our dataset is 1,000 for
    training in all three LSTMs in our network.


    Number of hidden layers and units: The number of hidden units in our LSTMs is
    64 units and the two hidden layers were used for all the networks.


    Number of steps per epoch: six steps per epoch were used to predict 4 days, which
    are four units of predictions in output layers.


    Learning Rate: The optimizer used was Adam''s optimizer, and the effective learning
    rate was 0.001.


