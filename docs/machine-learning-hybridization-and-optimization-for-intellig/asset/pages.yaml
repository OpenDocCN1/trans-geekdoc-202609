    The loss functions and the optimizers are used in designing LSTM layers to balance
    the generated law report. For the proposed model in the current work, the length
    of descriptions and the number of words in the document will act as the structured
    parameters. Therefore, the proposed approach is used for law-related text processing
    in the target domain.


