    # ## 16.2 DESIGN OF THE OBSTACLE ASSAULT GAME


    Games with obstacles have been widely enjoyed across a variety of platforms. As
    an early 2011 release, Temple Run was a pioneer among obstacle games. It gained
    notoriety and attracted addicts within its user base quite rapidly. Since its
    release in 2012, the popular smartphone game Subway Surfers has been a smashing
    success. When it was released in 2020, Fall Guys caused quite a stir because of
    its difficult course designs. A major drawback of these games is that they need
    a certain level of technical support that many budget devices just cannot provide.
    Poor optimization was a common problem with these games. Since the advent of the
    CryptoKitties fad, NFT games have evolved and included play-to-win methods. The
    so-called Game-Fi combines the financial and gaming industries to provide users
    with real-world moneymaking potential inside virtual environments. The days of
    gambling thousands of dollars on winning, locating, or breeding a rare collectible
    are over. In addition to collecting animals, players may also try out a variety
    of games based on a wide range of other subjects.


