    # ## 5.2 RELATED WORK


    There are many instances where AI is already very successful in helping judges
    to arrange bail and parole hearings. More complex architectures like RNN [1, 2,
    3, 4, 5, 6] and LSTM [7, 8, 9, 10, 11, 12] have been proposed by several researchers
    for processing words and sentences [13, 14, 15, 16, 17, 18] and for improving
    query and document representation [19, 20, 21]. Most law firms in India are leveraging
    the benefit of deep learning technologies to make their work as efficient as possible.
    The use of technology for e-filing and virtual hearings saw a dramatic rise during
    the period of the Covid-19 pandemic. But the current advancements in the judicial
    field are not exclusively the result of the pandemic. The progressions of digitizing
    applications for Indian courts started at the beginning of 2007. The announcement
    of the ‘eCourt Project’ was initiated and executed in 2007. The eCourt project
    is the initiative taken by the Indian government to develop the National eGovernance
    Plan. The eCourt Project is being developed in three phases. The eCourt Project’s
    Phase I primarily focuses on digitization, that is, details like how to set up
    hardware with an internet connectivity, along with the details covering how to
    digitize case records; how to operate the e-Courts platform is the focus of Phase
    I of the project. Phase II of the eCourt Project is aimed at granting service
    delivery to all concerned stakeholders like litigants and lawyers by developing
    projects like the National Judicial Data Grid (NJDG) platform and an eCourt service
    app for virtual courts. Phase III of this project is to simplify court procedures
    and create a digital infrastructure wherein'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'multiple diverse systems can communicate with each other, and this Phase III
    approach establishes a new governance framework.


    In 2019, the Indian Supreme Court formed an AI expert committee to discuss and
    launch its first AI portal called ‘SUPACE’. This provides assistance by leveraging
    powerful machine learning approaches to process vast amounts of case data, and
    it helps in increasing the courts’ efficiency. Likewise, ‘SUVAS’, an AI-based
    language translation software, was launched by the Indian Supreme Court and helps
    in translating the original judicial documents from English into all state languages.
    But unfortunately each of these software programs serves only its unique purpose
    and there is no one-for-all software in the law industry. Several initiatives
    were taken by researchers [26, 27, 28, 29, 30, 31] for supporting prediction and
    decision-making, which will be discussed here. Also, nowadays, numerous law firms
    are eagerly trying out new technologies to allow quick reference of similar cases
    with legal concerns at stake. ‘Riverus’, a Mumbai-based legal software development
    company, is developing an application based on ML that reads thoroughly troves
    of cases to understand them better and then pares those cases that are very similar
    in content. The results are delivered very quickly in minimum time and the outcomes
    are as accurate as a human expert would achieve. One similar application by Dipankar
    et al. is proposed which is based on a concept of AI that serves a double purpose.
    One part of this application serves tax law, and the other part is used to prepare
    contracts. This application, once it has been trained on a huge number of historical
    precedents, will highlight similar key ideas in contracts.


    Another intelligent software program called ‘Kira’, which is based on AI, can
    handle multiple tasks at a time. This application saves time and effort in analyzing
    and identifying legal critical papers and extracts provisions from multiple legal
    documents. In addition to this, another AI-driven proposed work called ‘Mitra’,
    which is a legal research platform, has been introduced purely for the purpose
    of research.


    Other intelligent software has been proposed for the purpose of predicting the
    ideological direction of cases handled in the Supreme Court. But decisions are
    made mainly based on the facts of the case arguments. Third-party stakeholders
    or those who are very much interested in an upcoming case could obviously use
    this tool as a guide to assess their'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'prospects for success by consulting a case that is very similar to their own
    and plan accordingly. In the proposed work, we aim to see if the combination of
    justice traits shows a strong preference for dealing with certain tax and civil
    rights issues. Topic modeling concept plays a major role in automating Supreme
    Court decisions. With the help of text mining, the Judge Opinion software will
    analyze judges’ opinions on a particular concern. Law-making software based on
    ML is another important development, which takes any text as input and returns
    the most similar congressional bills. This is implemented using the similarity
    model and the word embeddings model. Multilabel classification using Bert is used
    as an online prediction tool with a fine-grained sentiment analysis technique.
    To reduce the small case matters happening in court, an online dispute resolution
    (ODR) tool is recommended by Government as an alternative tool. These systems
    will directly impact the efficiency of the delivery of justice. However, such
    systems are not documented properly and not made public because these systems
    are masked due to secrecy. Therefore any framework that promotes and brings transparency
    in rules, internal policies, regulations, and functionalities is much warranted
    at the current time.


    # 5.2.1 SIMILAR GLOBAL INITIATIVES TAKEN BY FOREIGN NATIONS


    Technological advancements and tools are already very popular, becoming integral
    to justice delivery systems. Several countries like the United Kingdom, the United
    States, Canada, Singapore, and China have taken initiatives in the digitization
    process. For instance, an AI-based ‘Safety Assessment’ (PSA) tool in US courts
    helps judges decide the judgment based on the risk score. This risk score is calculated
    based on different predetermined parameters.


    The SOS (system of systems) tool is designed to facilitate smart courts; powered
    by advanced ML technologies, it is being used in China at various locations. This
    system will act as a centralized system. It connects the functioning of all systems
    in courts across the country. It will automatically scan, screen, and recommend
    relevant laws and regulations for reference. It can intelligently draft legal
    documents and can monitor and alert human'
