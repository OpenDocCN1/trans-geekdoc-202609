  img_proc: true
- pgno: 206
  md: 'terminals, and a virtual space of true mutual trust is created. A powerful
    measurement engine ensures the dynamic integrity of virtual machines, a reliable
    reporting engine implements trust between different virtual environments, and
    a cloud engine provides storage management and access control [22]. In order to
    increase the security and dependability of cloud computing services, it enhances
    the virtualization of strong security in cloud computing from the five points
    mentioned above. Figure 7.5 displays the whole virtualization security protection
    model.


    # 7.7.6 PHYSICAL RESOURCE OVERLOADING


    In a virtualized environment, physical resource overloading can be a major issue
    as it may result in the failure of virtual nodes or a decline in network performance
    below acceptable levels. When virtual machines are not provided with enough physical
    resources (such as CPU, memory, or storage) to meet their demands, this overloading
    can occur. Check the physical server and virtual machines’ resource utilization
    frequently to make sure they are being used effectively and to spot any potential
    bottlenecks [28]. Assign physical resources (such as CPU, memory, and storage)
    to virtual machines in a way that takes into account their individual requirements,
    and make sure there is enough overhead to manage peak loads. Utilize resource
    pools to dynamically manage and distribute resources depending on shifting workload
    demands [26].'
