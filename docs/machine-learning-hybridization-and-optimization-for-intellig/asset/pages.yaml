    The objective is to propose a system that can help to reduce the gap between farmers
    and researchers for the sake of development in the agricultural field. Here, a
    system that follows image processing and pattern recognition algorithms is proposed
    to identify the rice disease correctly to help the farmers. For the analysis purposes
    of the proposed system, image datasets of rice plant diseases are considered,
    which are publicly available in [14]. Finally, for the improvement of the accuracy
    of the results for rice disease analysis, a genetic algorithm (GA)-based optimized
    ensemble architecture is proposed. After the combined application of InceptionV3
    and ResNet152V2 model, GA is applied with the use of all GA components. It is
    observed that the optimized result shows a more accurate result for the prediction
    of rice disease data.


    The rest of the chapter is represented here by way of an introduction to rice
    plant diseases, and the proposed method overview is discussed in Section 18.1.
    A literature survey is introduced in Section 18.2. The proposed method’s step-by-step
    process is explained in detail in Section 18.3. The proposed system firstly used
    methods InceptionV3 and ResNet152V2 individually to analyze the classification
    results. Then a comparative study was made of the dataset where these two methods
    were applied, and the observation results were made. Finally, Section 18.4 draws
    a general conclusion of the work.


