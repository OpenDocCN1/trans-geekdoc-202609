  md: 'The ECG pulse is generated by the electrical movement of the heart. When electrical
    activity from the SA node to the Purkinje fibers is maintained in a coordinated
    way, the heart pumps normally and produces the ECG waveform. The typical ECG waveform
    is shown in Figure 9.1, labeled with the components of the ECG wave: 1) P wave,
    2) QRS complex, 3) T wave, and 4) U wave. Each component of the ECG wave has its
    own characteristics in time, which are documented based on various trials. The
    normal characteristics of ECG wave components, including amplitude and time period,
    are listed in Table 9.1.


    ![](img/8c9c25929b8bfe55c61ba059d5462e42_236_0.png)


