    when to control these diseases are difficult. The main problem is a lack of continuous
    monitoring of the plants. Sometimes, newbie farmers are not aware of the diseases
    and their occurrence period. Generally, diseases can occur on any plant at any
    time [5]. However, continuous monitoring may prevent disease infection. The detection
    of plant disease is one of the important research topics in the agriculture domain.
    Detection of various diseases from images is one of the exciting research areas
    in the agriculture sector. So nowadays, detecting diseases in different plant
    parts is significant and relevant in our society. Image processing and machine
    learning provide a variety of techniques for most of the steps in the workflow
    sequence to analyze images that can be effectively utilized for disease detection
    in plants [6].


    The Rig Vedic hymns mention rice and porridge in hymns such as 8.83, 8.70, 8.77,
