  md: '# # 3 A Brief Study on Understanding and Handling COVID-19

    Test Bed for Forecasting with Deep Learning and Machine Learning Algorithms


    M. Premalatha, G. Anusooya, G. Suganya, M. Braveen, and Venkatasubramanian Adhinarayanan


    DOI: 10.1201/9781003465775-3


    # ## 3.1 INTRODUCTION


    The COVID-19 pandemic originated in Wuhan, China, and its first case was registered
    at the end of December 2019. The disease, which was initially thought to be the
    common flu, has become a human-killing machine that has spread across the globe
    and has caused an economic crash to a level that had never before been witnessed
    in human history. COVID-19, also named SARS-COV-2 by the World Health Organization
    (WHO), is a communicable disease, which means that people must stay apart from
    each other to stop its spread. The disease has diverse effects on the human body,
    initially starting with the symptoms of the common cold and headaches to the adverse
    effects of pneumonia and acute respiratory diseases. One of the major issues is
    that there could be cases that might be asymptomatic, which means a person could
    have COVID-19 and yet still not know that he has been infected by it, which could
    lead to an even faster spread of the virus among others. Since the spread of the
    virus had been exponential, the leaders of the country could not find any other
    way apart from activating'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'lockdowns in specific regions to stop its spread as a measure of precaution.
    We look into various countries’ approaches to using lockdowns effectively and
    how they were able to control the spread of the disease. In some countries, the
    lockdown was not very effective, while others successfully bent the curve. Identifying
    which strategies from these successful countries could apply to nations with high
    daily case counts, like India, is crucial.


    ML algorithms will be used to help in better decision-making for handling such
    a pandemic situation. This chapter attempted to predict future cases of COVID
    using ML algorithms that have been used in the prediction of various problems
    such as stock price prediction, cardiovascular disease prediction, breast cancer
    prediction, and many others. This chapter focuses on comparing various algorithms
    based on their performance and accuracy in the prediction of future cases.


    The chapter’s main goal is to predict future cases so as to take necessary measures
    against the further spread of the virus and take necessary precautions. In this
    chapter, various machine learning algorithms, such as linear regression, lasso
    regression, and support vector machines; and various types of recurrent neural
    networks, such as LSTM, Bi-Directional LSTM, and Encoder-Decoder LSTM with the
    addition of univariate and multivariate forms of LSTM, were trialed for the analysis
    of COVID-19. This section compares the results obtained from the above models
    to evaluate their performance and accuracy obtained from them. A case study is
    performed on how various countries focus on bending the curve and considers the
    features that could be used to reduce the curve.


    All the above-mentioned details are elaborated on in the upcoming sections. First,
    let’s look into data abstraction as the problem of COVID-19 is relatively new,
    and the places to obtain data are not abundant, followed by which we dive into
    the exploratory data analysis to find out how each parameter present in the table
    affects the forecasting of the cases and also present various visualizations,
    after which we look into how each model works and why we choose these models over
    others. Finally, we examine the features that make it possible for other countries
    to reduce the number of cases and remove the implications of lockdowns as much
    as possible within one year or less. In short, we compared the algorithms for
    predicting the cases and identified the features for bending the curve.'
