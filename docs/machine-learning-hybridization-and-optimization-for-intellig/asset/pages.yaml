    # 5.3 MATERIALS AND METHODS


    As mentioned earlier in the proposed work, it’s essential to analyze the role
    of AI in other important domains, as it is more or less uniform across varied
    fields. Say, for instance, best practices from different domains, such as healthcare,
    can be adapted because accuracy is an uncompromised goal that is aimed to be achieved
    at a high level through AI in healthcare; the same means can be applied in the
    case of law. Say, for example, in the proposed work [22, 23, 24,41] in the medical
    domain, the transfer learning model is implemented. In the existing work [22,
    23, 24, 41] the trained source domain knowledge, learned from plentiful datasets,
    is finally transferred to the very limited target domain task. In the existing
    work, a multilevel framework is introduced for the classification of digital breast
    tomosynthesis (DBT) datasets. The basic MLTL architecture proposed [22, 23, 24,
    41] consists of three domains. The first source domain is trained on an easily
    available dataset. An intermediate domain is introduced to learn the source domain
    generalized features, and then the middle domain with its intrinsic specific features
    of medical images are accurately learned and in turn carried to the last target
    domain to give outstanding classification results with DBT datasets. Preprocessing
    of the dataset is done using an adaptive median filtering technique followed by
    a region-based segmentation method. An expectation maximization technique is used
    to estimate the model parameters.


    Inspired by the existing work [22, 23, 24, 41], the same framework is fine-tuned
    and modified to make it applicable for law. The proposed work framework is shown
    in Figure 5.1. First a basic law transfer learning (BLTL) framework is introduced
    in this work. The source model of BLTL is used to learn the knowledge from general
    datasets. The BLTL framework consists of two domains, namely the target and the
    source domains. The'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'source domain model with learned features is saved. Then, the final target
    model is designed from the initial source model and fine-tuned accordingly. The
    model with the restored weights is saved and then again fine-tuned according to
    the target domain law dataset. The knowledge gained from the initial source is
    in turn transferred to the target for learning the law dataset, which helps in
    categorizing the multiple law documents accurately.


    ![](img/8c9c25929b8bfe55c61ba059d5462e42_139_0.png)


    # FIGURE 5.1 BLTL framework


    Secondly, an LSTM framework is proposed as shown in Figure5.2. The proposed LSTM
    network will have the tendency to process both the word and the feature vectors.
    The embedding layer contains the word vector, and the feature vector is given
    as output from the BLTL framework. Therefore the LSTM model and its layers are
    trained on both the word and feature indices. The sentences of law cases cannot
    directly be used for training and cannot be fed directly into an LSTM layer. Hence,
    now, the sentences of law documents are converted into a list of tokenized words.
    After this, all the distinctive words of cases are converted to a unique integer
    value. In an LSTM model, the embedding layer input will be an integer. The integer
    of the word index is given as input to the embedding layer. This layer outputs
    vector arrays corresponding to each word. The Adam optimizer is currently used,
    which shows considerably good performance improvement in classifying texts. This
    LSTM model plays a major role in predicting the outcome of the next word in the
    law document in which the previously'
  merge: -1
  img_proc: true
