  md: 'In LBP, the histogram features are extracted. Finally, the mean and standard
    deviation statistical features are extracted from LBP. The workflow of the LBP
    method is shown in Figure 9.5. The steps involved in extracting histogram features
    before classification are as follows: divide the window into cells. Compare each
    pixel in a cell with each of its eight neighbors. Follow the pixels in either
    a clockwise or counterclockwise direction around a circle. Write "1" where the
    value of the neighboring pixel is higher than the value of the center pixel. Otherwise,
    write "0" in the box. This gives us a binary number with eight digits. Calculate
    the histogram of the frequency of each "number" occurring in each cell. Normalize
    the histogram if necessary. This gives us the window''s feature vector.


