  md: '# 12 A Systematic Analysis of Robot Path Planning and Optimization Techniques


    Pallapothala Tejaswini, Kaushlendra Sharma, and Rajesh Doriya


    DOI: 10.1201/9781003465775-12


    # 12.1 INTRODUCTION


    Robotics is frequently described as an inertial navigation system which comprises
    a set of computer devices working together to complete a task. At the beginning,
    robotics was restricted to a few engineering and heavy- industry applications.
    Eventually, when robotics gained widespread acceptance across a variety of industries,
    numerous robot forms were used to complete different tasks [1], which increased
    the need for route planning procedures. The procedure of detecting the best way
    from a particular location to another in a search space is called path planning.
    Path planning improves the way by figuring out the easiest route connecting sending
    and target endpoints. Another definition of path planning includes the technique
    of decomposing a significant path transition into a series of repeated steps to
    produce precise moves to optimize particular objects. Robots that are independent
    in nature and employ [2] route-finding algorithms to establish passage endpoints
    across space might be considered as objects. A mobile robot is one that fits this
    description and can be utilized to resolve the difficulties in this domain. Path
    planning issues are significantly influenced by environmental conditions [3].
    Path planning can be classified into dynamic and static classes depending on the
    description of the surrounding environment. In the first case, information about
    a search space with known geometry stationary barriers is provided, and an approach
    is then used to find the path. Then, the robot employs sensing devices or legitimate
    data'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'and gathering tools [4] to locate obstacles that are continually moving throughout
    the whole workplace. The strategies used for path planning have a significant
    history. Beginning with a heuristic method to address the path planning challenge
    and progressing to adaptive and composite techniques to identify the best route
    from cell A to cell B, the robot will typically move across the solution space.


    Most jobs that can be completed simply can be handled by one robot. When numerous
    goals must be achieved concurrently, a multi-robot approach is necessary, which
    complicates the situation. Numerous robots have been employed in the past for
    applications such as flexible route planning, cooperative construction, multiple
    job allocation, mapping environmental variables, and many others [5]. Multi-robot
    technology is employed to solve challenging tasks. To work on it, you need an
    altogether different architecture. Each robot is given a specific objective to
    achieve, and each robot must travel the best route possible to get from where
    they are to where they need to go. It becomes more dynamic and sophisticated when
    numerous computers are managed at once in a shared workspace – dynamic in the
    sense that, in addition to the static impediments that currently exist in the
    workspace, each robot acts as an obstruction to every other robot. Because the
    environment is always changing, any standard path planning technique should act
    differently to calculate the best route for every individual robot. The requirement
    to incorporate a coordination mechanism into the working design to control all
    the robots operating in that workspace adds another layer of complexity [6]. As
    a result, it is necessary to address two concerns at once while addressing the
    multi-robot system issue. The first concern is the path planning algorithm, which
    seeks to determine the best possible route for individual robots, as well as the
    best possible optimized path including all the robots occupying the same workspace.
    The subsequent problem to solve is how to effectively coordinate robot movement
    so that all of them follow their ideal paths and do so without colliding [7].


    There isn’t an extensive review that systematically incorporates path planning
    in mobile robots, despite the fact that numerous surveys are accessible that do
    so in various ways. The rest of this chapter is organized as follows: In Section
    12.2, we go through the previous research works that are relevant to this domain.
    Section 12.3 explores the development of path'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'planning methods over time, while Section 12.4 delves into the analysis of
    these algorithms, further addressing environmental inspection. Finally, Section
