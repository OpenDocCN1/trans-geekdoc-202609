    down socioeconomic aspects. The authors developed an elementary CNN model to recognize
    LULC, and characteristics are extracted that describe the range of human behaviors.
    The input feature frame encompasses 99 channels in total, 1 from DNB/VIIRS, 6
    from bands 2–7 of Landsat 8 OLI, and 1 from DEM. As training labels, the LULC
    type of the center pixel was retrieved from the GLC30. The identified built-up
    land area was 20.78% of the overall area, which was greater than the labeling
    map’s 13.63% but on par with the reference map’s 20.85%. The detected agricultural
    land area made up 26.10% of the entire region, which was less than the labeling
