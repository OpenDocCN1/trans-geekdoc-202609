  md: '# 13 Pneumonia Prediction Model

    Using Deep Learning on Docker


    Yash Seth, Philip Anand, Jinen Rathore, R Gayathri, and Shola Usharani


    DOI: 10.1201/9781003465775-13


    # 13.1 INTRODUCTION


    For the deep learning model, we are applying the VGG16 model. VGG16 is a CNN or
    convolutional neural network that is 16 layers deep. While these 16 layers are
    predefined, we may remove layers and add in our own layers to change how data
    is fed to the model and passed from one layer to another. For creating the model,
    we removed the original 16th layer and added our own layer to give output in two
    categories: normal and pneumonia. We also preprocessed the images by rotating,
    zooming, and making them black and white and then fed them into the model for
    training. This was a trial and error-based approach, so as to maximize the accuracy
    of the model. To distribute the model and make it highly available to those who
    require it, our model is accessible through Docker. Docker is a platform that
    is commonly used to create, package, and deliver applications that run over the
    cloud. It speeds up and simplifies the process of creating reproducible and shareable
    systems. It provides a system to manage your infrastructure in the same way you
    would do your apps and products.


    We have created a Docker image which contains the model file and the UI for easy
    access to the model. After putting up the Docker image online, anyone who wishes
    to use the model may pull the Docker image, create a container, and thereby use
    it for their requirement. We have also created an easy-to-use UI website on a
    FastAPI server, which allows the user to select an image from their system’s file
    system, and then the image would be fed to the model, and the output would be
    displayed on the same UI website.'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'Therefore, the complete flow of the proposed system is as follows. The user
    will first need to obtain images of the lungs that they want to check are normal
    or have pneumonia. Next, they will be required to pull the image of our system
    from the Docker repository, which they will run in a Docker container. The Docker
    container will install all the requirements of our system locally in an independent
    environment and then launch the UI, which is connected to the model in the backend.
    The UI prompts the user to upload the lung images, and it would then be fed to
    the backend, where the model takes in the input and classifies it as either normal
    or pneumonia. This output is passed to the frontend and displayed to the user,
    where they can relay their findings to wherever it is required.


    Thus, by putting together all the modules, we have come up with an easy-to-use
    yet reliable solution for pneumonia detection. The proposed model is highly available,
    reproducible, and fairly lightweight. Our vision for the system is that such a
    process can be implemented in regular health checkups for the early detection
    of pneumonia.


    # 13.2 LITERATURE REVIEW


    In this section, a brief summary of various significant contributions from the
    recent literature is given in order to make it possible to apply the findings
    to our problem statement. In order to diagnose pneumonia, a gradient-based visualization
    method has been suggested by Rajpurkar et al. [1]. They utilized 121 tightly connected
    layers to calculate the illness risk. Ge et al. [2] combined multilayer perceptron
    and recurrent neural network techniques with more conventional methods such as
    traditional machine learning algorithms. Sirazitdinov et al. [3] proposed a region-based
    CNN model to segment and enhance lung images to make a pneumonia diagnosis. A
    deep learning model was proposed by Bhandary et al. [4] for the purpose of analyzing
    pneumonia and lung cancer, applying AlexNet pre-trained models for X-ray image
    identification and classification into the classes of healthy and unhealthy (pneumonia).
    Chouhan et al. [5] applied transfer learning concepts in the context of deep learning,
    which we believe can be extended to our project. They built the model using ImageNet.'
  merge: -1
  img_proc: true
