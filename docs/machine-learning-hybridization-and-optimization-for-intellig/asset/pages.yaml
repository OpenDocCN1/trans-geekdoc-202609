    # 17.1.2 COMPARISON BETWEEN OPENGL, DIRECTX, AND UNITY3D


    (1) OpenGL: OpenGL is an open-source, cross-platform application programming interface
    (API) for rendering 2D and 3D vector graphics. It is designed to be hardware-independent
    and platform-agnostic, providing high-level access to graphics operations on a
    wide range of hardware. OpenGL provides a powerful set of features such as high-quality
    anti-aliasing and high-performance vertex and fragment shaders.


    Resolution: OpenGL is capable of rendering high-resolution images with a wide
    range of colour depths. Hardware utilisation: OpenGL is highly optimised to utilise
    modern graphics processing unit (GPU) hardware, allowing for smoother and faster
    graphics rendering.


    CPU performance: OpenGL does not require a dedicated graphics processor, making
    it ideal for low-end systems with low CPU power.


    (2) DirectX and Unity3D: DirectX and Unity3D are both Windows-based proprietary
    graphics APIs. DirectX is a collection of low-level APIs for rendering 2D and
    3D graphics, while Unity3D is a game engine used to create 3D applications.


    Resolution: DirectX and Unity3D are capable of rendering high-resolution graphics
    with a wide range of colour depths.


    Hardware utilisation: DirectX and Unity3D allow smoother and faster graphics rendering.


    CPU performance: DirectX does not have any inherent performance impact on the
    CPU, as it is a set of APIs that are used by developers to create applications
    that can access the capabilities of a computer’s GPU. Therefore, the performance
    of a system with DirectX will depend on the performance of the GPU and the specific
    application.


    Unity3D is optimised for multicore CPUs and can make use of up to 8 cores for
    improved performance. Unity3D is also optimised for multi-'
