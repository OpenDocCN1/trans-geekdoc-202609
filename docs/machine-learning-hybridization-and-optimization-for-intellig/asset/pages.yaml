    for examining scholarly works. The study’s data was searched from Scopus to conduct
    a thorough analysis. The terms included TITLE-ABS-KEY (“Privacy and Security”)
    (7,458 documents); TITLE-ABS-KEY (“Privacy and Security” AND “IoT”) (975 documents);
    TITLE-ABS-KEY (“Privacy and Security” AND “Start-ups”) (6 documents); and TITLE-ABS-KEY
    (“Privacy and Security” AND “IoT” AND “Start-ups”) (0 documents). The term searched
    includes quotation marks. For bibliometric'
