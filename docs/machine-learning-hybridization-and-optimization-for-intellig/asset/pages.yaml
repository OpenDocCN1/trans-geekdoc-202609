  md: '# 6.4 TRANSFER LEARNING FRAMEWORKS FOR HANDLING LIMITED TRAINING SAMPLES


    In recent years, many scholars have been focusing on alleviating the insufficient
    dataset problem using transfer learning. This is achieved by transferring the
    knowledge from the initial source to the final target, whereas the initial source
    model is trained on a huge dataset. For classifying tasks in various domains,
    transfer learning has been successfully applied as shown in Figure 6.1.


    ![](img/8c9c25929b8bfe55c61ba059d5462e42_155_0.png)


    FIGURE 6.1 Transfer learning from initial huge data domain to limited data domain'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# # 6.4.1 Using the Concept of Transfer Learning in Medical Imaging


    In the medical imaging field, transfer learning seems to be very successful in
    detecting breast lesions. Apart from this several other classifications that involve
    the lungs, the abdomen, the brain, Parkinson’s disease, and electroencephalogram
    (EEG) signals are also taking advantage of transfer learning. This transfer learning
    technique based on instance was proposed [109] for classifying chronic pulmonary
    disease. They identified this disease using CT scan images of the chest. The proposed
    method can be generalized across domains using different protocols or using scanners.
    Another innovative approach [83] to addressing the mass detection problem in mammogram
    images has been introduced. The solution for the above said problem has been achieved
    using CNN-based transfer learning techniques.


    Classifying breast cancer was proposed by the authors [80] in which the convolutional
    neural network plays a major role in feature extraction. The SVM and RBF classifiers
    are adapted for tuning kernel. This can be achieved because of the algorithm’s
    flexibility in fitting the dataset adequately to the required dimension. As a
    result of combining CNN and RBF-based SVM, due to the hybridization process, a
    substantial increase in the results has been achieved. An intermediate domain
    to decrease the domain dissimilarity has been introduced among the target and
    the source networks. Multistage learning was introduced in [95] for classifying
    the last target DBT dataset using the knowledge of the initial source network
    along with the mammography images in the intermediate domain.


    Using histopathologic images (HI) for detecting breast cancer has been proposed
    in [62]. To improve the support vector machine (SVM) classification accuracy to
    some extent, irrelevant patches from the images are removed before training the
    model. Different models [48] have been proposed to classify breast malignancy
    in histology images. The images have multiple cellular and nuclei configurations
    and are trained on AlexNet, ResNet, and GoogleNet models.


    Domain adaptation–based joint knowledge transfer learning approaches for classifying
    and recognizing EEG signals have been proposed [132], in which the model is tested
    on Bonn images in addition to CHBMIT datasets'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'to determine the accuracy. The proposed work achieves a higher accuracy with
    an iterative approach. Another novel positive approach [58] for detecting Parkinson''s
    disease has been introduced that consists of domain-specific data instead of patient
    data. The proposed work solved negative transfer, which is an important issue
    in transfer learning which avoids the problem of performance degradation. The
    model outperforms other techniques without using the transfer learning technique.


    A novel unsupervised approach was introduced [56] to characterize tumors based
    on a 3D CNN model which is trained on 171 MRI and 1,018 CT images. GIST descriptors
    have been incorporated into the model to find the differences between pancreas
    and lung cysts. To detect breast malignancy and for detecting tumors in whole-scale
    images, an effective adaptive sampling method using transfer learning models [24]
    has been proposed that notably increases the classification accuracy to a greater
    extent.


    A new transfer learning technique [3] with a novel image weighing method for segmenting
    images has been introduced that reduces maximum mean discrepancy (MMD) error to
    a greater extent between training, testing, and the validation data. The model
    performance is further optimized by joining both the image weighing and kernel
    learning method and it is trained on the heterogeneous data. The transfer learning
    technique in conjunction with feature selection and normalization techniques [94]
    has been proposed for classifying molecular cancer using deep neural networks.
    The proposed method uses sparse auto encoders and is tested on gene expression
    data. This unsupervised learning technique is used to make accurate decisions
    on different types of tumors and is also found to be very useful for diagnosis
    and treatment.


    An advanced deep learning end-to-end framework was introduced [57] for accurate
    and automatic detection of analyzing sleep staging. Two transfer learning models
    were derived to address two problems very effectively: data inefficiency and data
    variability. The proposed two transfer learning based sleep staging networks are
    tested on multiple objective fields, namely the Cassette database, the Telemetry
    Expanded database, and the EEGrid database, respectively.


    A tri-directional technique for the detection of gastric cancer has been introduced
    [90], where the proposed model is useful for predicting'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'morbidity in three target domain cases, such as gastric morbidity in the same
    region, gastric morbidity in a different region, and different gastric disease
    morbidity in a different region. The proposed work uses a univariate regression,
    multivariate Gaussian, and mapping-based deep transfer learning approach for launching
    the target and the source gastric morbidity together. The current model is further
    extended to predict gastric disease morbidity in all three different domains.
    A Euclidean space technique [50] was introduced for EEG data alignment that facilitates
    transfer learning to be used for brain–computer interfaces (BCIs). Feature extraction
    techniques along with machine learning algorithms are applied to achieve better
    learning performance even when no subject-specific data is provided.


    The decompose, transfer, and compose (DeTrac) approach was introduced [11] for
    classifying medical images using popular transfer learning approaches. The performance
    of such Imagenet pre-trained classifiers is further improved by using the class
    decomposition method. Transfer learning models struggle to offer a robust solution
    when there are more irregularities in the distribution of the dataset. Therefore,
    a new innovative CNN architecture was proposed using a class decomposition technique,
    which makes it easier to deal with complex data irregularities, and the current
    model is tested on different datasets like histological image datasets, chest
    X-ray datasets, and digital mammograms.


    It has been identified that the classification accuracy of breast malignancy is
    increased substantially by using a data augmentation technique, and the same was
    introduced [81] using a transfer learning technique. New training samples are
    obtained using several data augmentation techniques. Several operations like zooming,
    rotating, flipping, and so on of the breast X-ray images are obtained. This overcomes
    the problem of insufficient datasets, and thereby increases the model''s accuracy.
    Two networks, say Inception V3 and VGG19, have been introduced [71], which are
    pretrained on the public ImageNet image dataset. The power of transfer learning
    with different levels has been analyzed. A magnetic resonance imaging (MRI) dynamic
    contrast-enhanced method (DCE) for categorizing fibro adenoma along with ductal
    invasive carcinoma was introduced to detect breast tumors.


    A highly automatic model [54] called an online transfer learning (OTL) network
    for classifying thyroid nodules as benign or malignant has been'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'introduced, in which the model is trained using ultrasound (US) images. The
    proposed work adopts a combined approach by using online learning and is tested
    on two diverse datasets with 1,750 and 3852 thyroid nodules respectively, out
    of which 1,078 and 672 are categorized as benign images and the remaining are
    labeled as malignant images; in the second, 3,213 and 639 are categorized as benign
    images and the remaining are labeled as malignant nodules.


