    # 12.4.1 PARTICLE SWARM OPTIMIZATION


    Particle swarm optimization (PSO) is a direct approach to finding the optimal
    solution to a given problem. Unlike other optimization strategies, PSO only requires
    the fitness value and does not rely on the direction or any derivative of the
    objective. The solution space of the problem or function is populated with a multitude
    of small, simple entities called particles, each evaluating the fitness function
    at its current location [36]. Subsequently, each particle determines its movement
    through the solution space by combining a historical component of its current
    and best-fit coordinates with the coordinates of one or more members of the swarm,
    along with some random perturbations. After every particle has been updated, the
    process moves on to the next iteration. Ultimately, the swarm converges in the
    vicinity of the maximum of the fitness function, resembling a flock of birds searching
    for food together.


