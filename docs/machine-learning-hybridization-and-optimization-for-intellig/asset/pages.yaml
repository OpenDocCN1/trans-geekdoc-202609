- pgno: 152
  md: 'An effective approach [4] was introduced that uses computed tomography (CT)
    and X-ray images for initial diagnosing and screening of patients’ lung conditions
    after exposure to COVID-19 disease. Efficient machine learning methods like support
    vector classification (SVC), ensemble learning, K-Nearest Neighbors (KNN), and
    RF algorithm have been used for classifying COVID-19 disease effectively. An ML
    framework that utilizes the adversarial reverse mapping technique to explore task
    dependencies was introduced in [128]. This model was initially trained on 2,900
    MRI images and 2,360 CT cardiac images after fine-tuning to map the cardiac image
    indices.


    An innovative approach [97] for analyzing anomalies in breast images using a fuzzy
    expert system has been introduced. The proposed work uses an extreme learning
    machine algorithm along with the radial basis function method and the results
    are comparatively more substantial than a linear SVM model. One new novel application
    [37] has been introduced to automatically detect genetic diseases using a chromatic
    pupillometry device, especially in pediatric patients. This will especially support
    diagnosis and early detection of inherited retinal diseases particularly in pediatric
    subjects.


    As seen in the literature, the handling of data is continually increasing in biomedicine
    research. However, more essential information like the cause of the disease and
    its real-time data are very limited or unavailable for several rare diseases.
    This lack of rare -disease chronological data poses a large challenge to statistical
    ML-based approaches.


    # 6.3 ADVANCED DEEP LEARNING FOR PROCESSING MEDICAL IMAGES


    With several advancements in the domain of medicine, these algorithms are predominantly
    used for classifying medical text and images. The authors [2] have introduced
    an automatic liver segmentation and lesion detection technique that extracts essential
    features from specific areas to support the effective differentiation of benign
    and malignant lesions of the breast. Three subsequent learning schemes [23], including
    random forest and linear regression, have been introduced where the heterogeneous
    features are'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'derived in a controlled manner. The proposed efficient work is trained on 24,000
    computed tomography nodules of the lung and shows excellent results with outstanding
    diagnosis as well as decision support.


    The method proposed in [12] uses a disentanglement technique for lesion classification.
    This technique combines the specific representation of one image with the unspecified
    representation of another image. This combination produces a new sample for classification
    among different variants of specific classes. The authors in [26] have introduced
    two advanced deep CNN based networks to detect the risk of cardiovascular disease,
    and the model is trained on coronary calcium CT datasets. The proposed two models
    adapt the multitask CNN model with a median filtering technique. This efficiently
    classifies epicardial tissues and segments thoracic tissues. A novel CNN model
    [105] that uses a combination of distance regression has been proposed along with
    a fusion scheme method. This will learn specific features from 6,000 2DCT and
    MRI kidney datasets. The authors in [73] have introduced an efficient multistage
    CNN model for classifying instances of gland adenocarcinoma. The model proposed
    is a multitask algorithm and is validated on the MICCA1 dataset. This proposed
    work yields better F1 score values with an accurate measure of index dice.


    The effectiveness of deep neural networks has been established in numerous applications
    [13,69,131] connecting the lungs, liver, breast, kidney, and so on, for example,
    classifying liver cancer, segmenting liver tumors and so on. A new data augmentation
    approach has been introduced by the authors in [40] to reconstruct super-resolution
    slices of liver tumors in CT using multiframe technique. The method proposed [18]
    employs a supervised pattern classification technique for classifying liver, breast,
    and blood neoplasias to diagnose tumors based on machine learning methods.


    Recently, due to their effective and accurate prediction outcomes, image segmentation
    methods have become widespread in the field of medicine. But there exist several
    challenges in the domain of medicine that are very complicated for radiologists
    to detect and identify at a very early stage. Say, for example, one of the important
    challenges is accurate tumor segmentation because of its size, shape, and location.
    A graphical controlled generative model has been introduced by the authors in
    [86]. This efficient method is used for segmenting hepatic tumors particularly
    from'
