  md: '# 2 Decision Making in the Field of Unmanned Aerial Vehicles


    # State-of-the-Art


    Sohini Ghosh, Bishwayan Ghosh, Suneeta Mohanty, and Prasant Kumar Pattnaik


    DOI: 10.1201/9781003465775-2


    # 2.1 INTRODUCTION


    Autonomous mobile robots have gained huge importance and popularity in recent
    years. They are being used for various tasks, which otherwise could have been
    much more difficult or costly to accomplish. Unmanned aerial vehicles (UAVs) are
    robots that have the ability to move in any three-dimensional space. Tasks such
    as surveillance, intruder detection, delivery, and so on are being easily performed
    by UAVs, at a nominal cost. But there are some constraints associated with UAVs.
    The power available to any UAV is limited and needs to be used in an optimized
    way [1]. However, we can obtain better results if we use a network of UAVs instead
    of a single UAV [2]. The UAVs need to communicate with each other. By communicating,
    we mean that they should be able to share information among themselves, which
    will help the network of UAVs to cover a broader area much more effectively. The
    multi-robot system is also cheaper to implement than implementing a single powerful
    robot for the same task. It also provides better fault tolerance, robust information,
    increased coverage area, and better reliability.


    The information shared by these robots is generally of two types. Firstly, it
    is the information about the area under coverage, also known as the'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'environment. Secondly, it also shares information about itself, like, battery
    availability, the region it is covering at a given time, and so on.


    Joint decision-making capability in a network of UAVs allows them to manage their
    limited resources like battery, processing power, and so on and to improve the
    area of coverage. It also enables a user to control multiple robots at the same
    time. Joint decision-making assures the action of each UAV proves to be useful
    for the entire network of UAVs. Any uncoordinated behavior will result in a waste
    of resources and redundant coverage of the environment.


    In cooperative multi-UAV searching, UAVs are typically coordinated to reduce the
    time to search for the location(s) of one or more fixed points. Exchanging the
    regional charts among each other assists the robots in understanding their surroundings
    and planning their routes in a better and more effective manner. Data is generated
    in a continuous manner and big data technologies are required to process the huge
    amount of generated data [3].


    Cooperative searching is expressed by three parameters: (i) capturing the environment
    and making updates on the chart by each robot, (ii) communicating about regional
    data, and (iii) making collaborative judgments regarding search activities based
    on whatever information is available. Hence, the task of designing a network of
    UAVs requires intensive study and is still an open research problem.


