    # ## 18.1 INTRODUCTION


    Agriculture, the main backbone of India, is the development of plants for food,
    biofuel, medicinal plants, and other products used for sustaining and enhancing
    individual life [1]. The history of agriculture goes back thousands of years,
    and its growth has been motivated and defined by several atmospheres, cultures,
    and technologies. Industrial agriculture founded on large-scale monoculture farming
    has become the dominant agricultural methodology. In the past century, agriculture
    has been categorized by improved productivity, substituting synthetic fertilizers
    and pesticides for water pollution, and farm subsidies. In current years, traditional
    agriculture''s external environmental effects have been removed, resulting in
    organic and sustainable agriculture movements. Nowadays, plant diseases and land
    degradation are the most critical problems in agriculture [2]. Therefore, agricultural
    improvement is monitored by data mining techniques achieved through improved information
    and communication processes [3].


    Plant diseases are one of the causes of reducing the quality and quantity of crops
    [4]. The spread of various diseases in plants has increased in recent years. There
    are a variety of plant pathogens such as viral, bacterial, and fungal pathogens,
    and these can damage different plant parts above and'
  merge: -1
  img_proc: true
