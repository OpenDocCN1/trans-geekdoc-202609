- pgno: 12
  md: '# Preface


    In recent years, the fusion of machine learning methodologies with optimization
    techniques has significantly advanced the realm of intelligent applications across
    diverse domains. This book delves into the symbiotic relationship between machine
    learning hybridization and optimization, presenting a comprehensive exploration
    of their integration to empower intelligent systems. The amalgamation of machine
    learning and optimization has revolutionized the way we approach problem-solving,
    enabling us to create sophisticated applications that adapt, evolve, and enhance
    their performance over time. This synergy has paved the way for innovation in
    various fields, from healthcare and finance to manufacturing and beyond.


    Within these pages, readers will embark on a journey through the principles, methodologies,
    and practical implementations of hybridized machine learning and optimization
    techniques. We aim to equip both novices and experts in the field with a thorough
    understanding of these methodologies and their application in creating intelligent
    systems that can learn, predict, and optimize outcomes.


    This book is designed to be a guiding light for researchers, practitioners, and
    students seeking a deeper comprehension of the intersection between machine learning
    and optimization. It offers a road map through the intricacies of hybrid methodologies,
    practical case studies, and emerging trends, intending to spark innovation and
    further the development of intelligent applications in the rapidly evolving landscape
    of technology. The goal of the book is to provide a detailed insight into modern
    applications of advanced machine learning techniques. The theoretical and practical
    experiment-based evaluations of different machine learning methodologies and applications
    are described. It covers a wide range of research and provides comparisons between
    state-of-the-art approaches. We hope that'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'this book will provide an in-depth insight to readers in the machine learning
    domain, allowing them to further explore machine learning-related frontiers and
    encouraging them to develop novel applications.


    We hope that the insights shared within this volume will serve as a catalyst for
    exploration, experimentation, and ultimately development of transformative intelligent
    applications that will shape the future. Welcome to the exciting world of machine
    learning hybridization and optimization for intelligent applications.


    Dr. Tanvir H. Sardar

    Dr. Bishwajeet Kumar Pandey'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# About the Editors


    ![](img/8c9c25929b8bfe55c61ba059d5462e42_14_0.png)


    Tanvir Habib Sardar is an assistant professor at the Department of CSE at GITAM
    University, Bengaluru campus. He has more than 15.5+ years of experience in industry
    and academia. He received his Ph.D. degree from Visvesvaraya Technological University,
    Karnataka, India, and patented his Ph.D. work at the Indian patent office. He
    obtained his B.Tech. in Computer Science and Engineering from West Bengal University
    of Technology, Kolkata, India, and received his M.Tech. in Computer Science and
    Engineering from Visvesvaraya Technological University, Karnataka, India. His
    research domain encompasses big data, machine learning, fuzzy logic, and distributed
    computing using MapReduce. He has published more than 35 research articles and
    presented at more than 8 international conferences. He has been a reviewer of
    many reputed peer-reviewed journals. He has authored two books and edited three
    and has published more than ten patents.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '![](img/8c9c25929b8bfe55c61ba059d5462e42_15_0.png)


    Bishwajeet Kumar Pandey is a professor at the Department of Intelligent Systems
    and Cyber Security, Astana IT University, Kazakhstan. He is also a visiting professor
    at Eurasian National University, Astana, Kazakhstan (QS World Rank 355), and UCSI
    University, Kuala Lumpur, Malaysia (QS World Rank 300). He was the research head
    of the School of Computer Science and Engineering at Jain University (NIRF India
    Rank 68), Bengaluru, India. He holds a Ph.D. in Computer Science and Engineering
    from Gran Sasso Science Institute, Italy. He received his M. Tech. in Computer
    Science and Engineering from the Indian Institute of Information Technology (IIIT),
    Gwalior, India. With over 15 years of experience, he has worked as a research
    consultant and associate visiting professor. He has also held positions as an
    assistant professor at various universities, including Chitkara University, Chandigarh,
    India (QS World Rank 1200–1400). He has visited 47 countries and attended 98 conferences,
    receiving best paper awards in multiple countries. He has authored over 170 papers
    and has published 5 books. With interests in green computing, high-performance
    computing, cyber-physical systems, machine learning, and cyber security, he has
    several Indian patents and serves on the board of directors for student-founded
    start-ups. He has 2800+ citations and 26 H-index. He has generated a revenue of
    2+ crores in his start-up Gyancity Research Consultancy Pvt Ltd since 2018. He
    is a program committee chair of the 7th International Multi-Topic Conference on
    Engineering and Science (IMCES), April 25–26, 2024, Bath Spa University UAE Academic
    Center, Ras Al Khaimah, UAE, https://imces.tech/. He is the main organizer'
