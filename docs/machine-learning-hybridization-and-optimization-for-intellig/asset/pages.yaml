    # 12.4.4 GENETIC ALGORITHM


    The genetic algorithm (GA), a meta-heuristic search technique, performs in a way
    that is comparable to natural selection. It belongs to the larger category of
    evolutionary algorithms used to address optimization problems. The performance
    of the current implementation, which is not determined by utilizing the previous
    or original solution, completely determines the genetic algorithm''s final solution.
    Like this, a mobile robot chooses its course based on how the environment reacts
    while avoiding barriers and avoiding collisions to accomplish a task. High computational
    challenges and the local minima problem are avoided with the evolutionary algorithm
    [40].


    The extent of mobility and reverse kinematic problems, which arise whenever a
    particle moves without any force, are also solved using the evolutionary method.
    Consider the genetic algorithm''s approach first from source to destination [41];
    when the robot encounters an obstacle, it travels three steps away from its present
    position and advances in the direction of the goals. Robot positions change based
    on the obstacle''s fitness functions [42]. A set of solutions for an artificial
    neural network is used to determine the variables. An objective answer is the
    route that leads from the location of the current impediment to the desired outcome.
    The mobile robot is considered a candidate solution if it never encounters any
    impediments and'
