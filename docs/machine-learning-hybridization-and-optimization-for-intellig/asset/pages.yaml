    # 12.4.8 PATH PLANNING IN UNSTRUCTURED, NOISY, AND LARGE-SIZED Map DATA


    Path planning in unstructured, noisy, and large-sized data refers to real-time
    warehouse data, which can be inconsistent or inaccurate or contain unrelated information
    because it is not organized in a specific style or structure. In the context of
    robot path planning, unstructured data may include the data received from sensors
    such as cameras or lidar, which record the environment around the robot in a continuous
    and unstructured way, which also creates errors and inaccuracies [55]. An example
    of this would be sensor measurements that are impacted by the lighting of the
    surroundings. Robot path planning can be difficult when dealing with this kind
    of data because it can result in poor or inefficient choices being made.


    Big-sized data can refer to enormous amounts of sensor data that must be processed
    in real time for the robot to make decisions and navigate through its surroundings
    when used in the context of planning a robot’s route. Depending on the sort of
    data being collected and the technique being used for collection, warehouse data
    can be either structured or unstructured [56].


    A database or spreadsheet can be used to quickly organize inventory data, such
    as the quantity of things in stock, their location, and their movement within
    the warehouse. However, because they gather data continuously and haphazardly,
    frequently with missing or incorrect readings, sensors like cameras, barcodes,
    and RFID tags may produce unstructured and noisy data. The position and movement
    of the items within the warehouse, as well as information on environmental variables
    like temperature, humidity, and lighting conditions, can all be included in this
    data. Data can be both structured and unstructured when used for robot route planning
    in a warehouse.


    Structured data can contain details about the layout of the warehouse, the placement
    of objects and obstacles, the robot’s current position, and its intended destination.
    The robot’s route can be planned to use a database or map that can be created
    from this structured data.


    Unstructured data, however, can also be crucial for organizing robot paths in
    a warehouse. For instance, data from sensors like cameras, lidar, and'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'ultrasound can show where items are in the warehouse and how they move around,
    as well as the lighting and environment. This data is frequently unstructured,
    which means that it is not set up in a particular style or structure and may include
    errors, inconsistencies, or irrelevant information. Robot path planning using
    unstructured, noisy, and big-sized data can be a challenging problem. To overcome
    this issue, there are various methods that can be applied. Using machine learning
    methods like neural networks, decision trees, or support vector machines is one
    strategy. To identify trends and forecast upcoming movements, these algorithms
    can be trained on a dataset of previous robot movements [57]. Using probabilistic
    techniques, such as the Kalman filter or particle filters, is an additional strategy.
    With the use of these techniques, a robot’s position and orientation may be estimated
    from noisy sensor data, and a course can be planned appropriately. Using a mix
    of probabilistic and machine learning techniques is a third strategy. When the
    data is highly unstructured and noisy and it is challenging to model the underlying
    patterns using conventional techniques, this approach may be useful [58]. There
    are several tactics that can be employed in addition to these methods to lessen
    the complexity of the issue. For instance, a hierarchical path planning strategy
    can assist in breaking the problem down into more manageable, smaller subproblems.
    Overall, machine learning, probabilistic approaches, and thorough issue decomposition
    are required for robot path planning in unstructured, noisy, and big-sized data.
    Robots that can navigate complicated settings with high precision and efficiency
    can be created with the appropriate methodology. As a result, the robot may be
    able to traverse the warehouse environment safely and effectively and make decisions
    that are more accurate and efficient based on the information at hand.


    # **12.4.9 ENVIRONMENTAL ANALYSIS OF PATH PLANNING PROBLEM**


    The environment for the robotic path planning problem is primarily categorized
    into two types based on geographical conditions, that is, static and dynamic.
    Both stationary and moving environments can be employed to resolve the path planning
    issue. In a stationary environment, obstructions do not move over time, the initial
    and target positions are constant, and the environment is unchanging [59]. Though
    in a varying environment, the'
  merge: -1
  img_proc: true
- pgno: 325
  md: 'location of the target and barriers may change throughout the activity of seeing.
    Path planning in dynamic contexts typically is due to the environment''s unpredictability,
    which makes it more challenging than a static context. The methods must therefore
    adjust to any unprecedented event, such as the introduction of when the objective
    is consistently shifting or when there are additional impediments moving in the
    premeditated path. For the dynamic challenge, the path planning techniques used
    in static situations are inappropriate [60]. The shape of obstacles in robotic
    environments serves as a defining characteristic. There are two primary categories
    of environments. A structured environment is a map with barriers that are neatly
    positioned and have a structured shape. In this situation, the robot''s movement
    path around obstacles can be easily specified by the robotic map [61]. For instance,
    barriers are shown as dots (for position alone) or circles rather than having
    the real shape of an obstacle. Environments with only rectangular impediments
    are assigned with various additional research studies. In certain methods, robot
    environments are discretized using grids and quad trees, and obstructions are
    roughly indicated by adjusting the blocks. A real robotic environment is typically
    semi- or unstructured, with obstacles that can be positioned at an angle and come
    in a variety of shapes and sizes. This path planning issue is therefore quite
    challenging in this scenario [62]. The algorithm must determine a viable and ideal
    path. For unorganized road transportation, real-time path planning for robot vehicles
    has been presented.


