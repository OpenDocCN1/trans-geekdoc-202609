    could happen. Furthermore, companies need to be aware of any security threats
    related to their own local servers and IT infrastructure, which can potentially
    be attacked.


    # 7.3 TECHNOLOGY USED IN VIRTUALIZATION


    A computer is divided into several logical computers via virtualization [10],
    each of which is able to going for walks a separate running machine. Additionally,
    the apps can run independently of each other in exclusive spaces, significantly
    improving the computer’s potential to carry out its responsibilities. Virtual
    machine monitor (VMM), a center-layer software that runs between the physical
    server and the working device, is a crucial utility for virtualization. It has
    access to the server’s complete physical hardware, such as the processor, RAM,
    disk, and network card. Alongside coordinating access to these hardware assets,
    the VMM also gives protection for exceptional digital machines [11]. When the
    server first starts up and executes the VMM, it loads all of the virtual machine
    client operating systems (OSs) and allocates enough storage, CPU (Central Processing
    Unit). It runs the operating system and applications, constantly receiving input
    from the user or active software programs, network, and disk to each virtual machine.
    The virtualization model is shown in Figure 7.1.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '![](img/8c9c25929b8bfe55c61ba059d5462e42_191_0.png)


    # FIGURE 7.2 Technology for virtualization


    There are different types of virtualization, including complete virtualization,
    paravirtualization, and software and hardware virtualization [12]. Technology
    for virtualization includes the technique for software-level virtualization implementation.
    Overall, it can be split into two categories: open source and proprietary. Xen,
    KVM, VMware, Hyper-V, and Docker containers are typical examples.


    +   • Xen: Based on the x86 architecture, Xen is one of the open-source virtualization
    technologies with the fastest growth, most stability, and least resource-intensive
    characteristics [13]. Based on the x86 architecture, the open-source virtualization
    technology Xen has become well-known for its dependability, speed, and resource
    effectiveness. Xen is an open-source project that was first created by the University
    of Cambridge and is currently managed by the Linux Foundation. The ability to
    deliver near-native performance for virtualized workloads is one of Xen’s core
    advantages, making it a popular option for high-performance computing and mission-critical
    applications. Additional advanced security measures provided by Xen include support
    for hardware-based virtualization extensions like Intel VT and AMD-V as well as
    the capacity to isolate virtual machines from one another and the underlying host
    system. A well-liked option for a variety of use cases and sectors, Xen is a mature
    and reliable virtualization technology that has built a reputation for its performance,
    security, and resource efficiency [14].'
  merge: -1
  img_proc: true
- pgno: 192
  md: '+   **KVM:** Open-source full virtualization KVM, which is a part of the Hypervisor
    paradigm and supports a range of hardware platforms, uses QEMU (Quick Emulator)
    to offer device virtualization. KVM (kernel-based virtual machine) is a hypervisor-based
    open-source complete virtualization system that works with a variety of hardware
    platforms. Numerous Linux distributions contain KVM as a standard feature, which
    enables the operation of multiple virtual computers on a single physical host.
    The usage of QEMU to provide device virtualization is one of KVM’s core features.
    A variety of hardware devices, including CPUs, network cards, storage devices,
    and input/output devices can be simulated by the quick and effective emulator
    QEMU. Because of this, KVM can deliver almost native performance for virtualized
    workloads, making it suitable for usage in industrial settings. KVM is a potent
    and adaptable virtualization solution that works well across a variety of use
    cases and sectors. It is a well-liked option for enterprises looking for a dependable
    and effective virtualization solution due to its usage of QEMU for device virtualization
    and support for hardware-based virtualization extensions.


    +   **VMware:** A leader in virtualization infrastructure and cloud computing,
    VMware offers a variety of solutions to assist businesses increase their IT’s
    productivity, adaptability, and speed. The solutions from VMware are made to make
    IT operations simpler, management more efficient, and services more rapidly and
    securely. One of VMware’s flagship products is the vSphere virtualization platform,
    which offers a dependable and secure cloud computing foundation and enables businesses
    to operate their workloads and applications on a virtual infrastructure. High
    availability, data security, and automation are just a few of the features and
    functionalities that vSphere offers, all of which assist enterprises in enhancing
    their IT operations and agility. Along with vSphere, VMware also provides a number
    of other cloud computing services, such as VMware Cloud on AWS, which enables
    businesses to run their VMware workloads on the AWS cloud; and vCloud Suite, which
    offers a comprehensive cloud infrastructure platform. Overall, VMware’s solutions
    are made to assist businesses of all sizes and sectors in streamlining their IT
    processes and infrastructure while also lowering costs and increasing agility
    [15].


    +   **Hyper-V:** Microsoft has developed a hypervisor virtualization technique
    called Hyper-V that allows for desktop virtualization. Desktop virtualization
    is possible because of Microsoft’s Hyper-V hypervisor-based virtualization technology.
    Microsoft Windows Server and the Pro and Enterprise editions of Windows 10, all
    come with Hyper-V, a native hypervisor. With Hyper-V, many virtual machines can
    run on a single physical host, consolidating workloads and maximizing server efficiency.
    Other capabilities include support for hardware-based virtualization extensions
    like Intel VT-x and AMD-V as well as live migration, which enables the quick switching
    of virtual computers across physical hosts. By utilizing remote desktop services
    (RDS) and virtual desktop infrastructure (VDI), Hyper-V also offers desktop virtualization
    in addition to server virtualization. While VDI offers a method to build and administer
    virtual desktops in a centralized and scalable manner, RDS enables users to access
    virtualized desktops and apps from anywhere. It is a well-liked option for enterprises
    wishing to enhance desktop administration and boost user productivity because
    it supports desktop virtualization with RDS and VDI.'
  merge: -1
  img_proc: true
