    making, and translating using an AI-based single transfer learning technique that
    can be finetuned and modified for many different domains. Therefore, this framework
    provides accessibility of information for all stakeholders with full transparency,
    which is easily accessible and very cost effective. The proposed AI-based multitask
    transfer learning'
