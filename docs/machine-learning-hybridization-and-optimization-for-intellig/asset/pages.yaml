  md: 'character identification up to this point are discussed and compared in terms
    of their benefits, drawbacks, and performances. The three-layer ANN network was
    suggested in [8] where the input sample and feature vectors are both represented
    as bitmaps and back-propagation bounce-back accuracy, with the unseen test picture
    increased to over 95% after the introduction of artificial neural network training,
    testing, and a scaled conjugate gradient. Also, in the literature [9], the creation
    of a smartphone app that uses character recognition to decipher written material
    embedded in a picture is proposed. It took a picture of the document with the
    phone’s camera, and OCR took it from there. Input data supplied to the system
    determines the final product. At first, the photograph is taken and uploaded to
    the custom Android app. The OCR engine does the further processing. For your convenience,
    the on-screen text transformation is automatically recorded as text that may be
    modified and used again. The method is predicted to provide 90% accuracy, and
    it was found that printed text provided more accuracy than handwritten text.


    # 14.1.2 SIGNIFICANT CONTRIBUTIONS OF THE PRESENT STUDY


    In this chapter, convolutional neural networks (CNNs) are developed to process
    pixel data. The major function of this CNN in artificial neural networks is to
    detect the image and process it [10]. There are three major layers used in CNN,
    which include the convolutional, pooling, and fully connected layers. The CNN
    functions in the pattern detection of the input, such as lines, faces, and gradients
    [11]. These neural networks are extremely effective for computer vision due to
    their quality and ease of accessibility. By using CNN architecture, the accuracy
    of the digit recognition is received at 80% [12], and in literature [13], the
    loss was reduced approximately to 0.02%. To add on, the use of the Adam optimizer
    for the MNIST database yielded better recognition of classification accuracy [14].
    Further, a minimal fine-tuning of hyper-parameters proved essential in improving
    the performance of the CNN architecture. A hybrid deep learner, namely the CNN-SVM
    model [15], could recognize handwritten digits by automatic feature generation
    with higher accuracy. The CNN was used as a generative model, while the SVM was
    used as the classifier. The recognition of handwritten digits is well achieved
    by'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'combining the advantages of CNN and SVM classifiers. In addition to this, instance-based
    learning [16] leads to higher accuracy by virtue of the nature of the k-nearest
    neighbor (k-NN) model and the random forest (RF) model. It is proven that the
    hybrid deep learning CNN-ELM-DL4J model [17] is better than conventional CNN models
    in terms of recognition accuracy and computational time. It is concluded that
    adding more hidden layers led to an elevation in network complexity and computational
    time. RTL coding is also observed to accelerate CNN on the FPGA platform [18].


    Research was carried out to develop a successful methodology for handwritten character
    recognition. As a result, this deep learning model accepts or outputs data in
    sequences such as audio and video clips, text streams, and time-series data. In
    neural networks, particularly the CNNs and multilayer perceptron, apart from the
    model, the activation function plays a significant role in deciding and achieving
    the output. The SoftMax function is one of the most frequently used activation
    functions in neural network models that apply machine learning methods. A vector
    of numbers is transformed into a vector of probabilities via this function, where
    the probability of each value is inversely proportional to the comparative scale
    of each rate in the vector [19]. There is another observation in this method that
    the final value always equals to one when summed. ReLU is the next most popular
    activation function in deep learning models. This is a nonlinear or piecewise
    linear function that produces an output that is directly the input, if the input
    is positive, and gives a zero function if the input is negative. The Pygame library
    in Python was used to create a new window that acted as a virtual whiteboard for
    the user to write digits. Whenever a number was written, the mouse motion was
    captured, and a rectangular box is highlighted in the written digit. This captured
    the digit that was written, and the same was sent to the model developed for the
    prediction of the digit.


    The rest of the section is organized as follows: Section 14.2 concentrates on
    the proposed methodology. Results and discussion are provided in Section 14.3.
    Conclusions and future scope are provided in Sections 14.4 and 14.5, respectively.


