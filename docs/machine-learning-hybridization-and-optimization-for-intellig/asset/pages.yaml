    # 4.4 EXPERIMENTAL SETUP


    AgTech, or agricultural technology, is revolutionizing [45] farming practices
    around the world by leveraging the power of sensors and analytics. In this section,
    the implementation details for AgTech and how it is being used to transform agriculture
    is discussed. The first step in implementing AgTech is installing sensors on the
    farm. These sensors can measure a wide range of data points, including temperature,
    humidity, soil moisture, and nutrient levels. Some common types of sensors used
    in AgTech include:


    +   **Soil Moisture Sensors:** These sensors measure the amount of moisture in
    the soil and can help farmers determine when and how much to water their crops.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '**Weather Sensors:** These sensors measure temperature, humidity, and other
    weather-related data points that can impact crop growth.


    **Soil Nutrient Sensors:** These sensors measure the health of soil by detecting
    soil macronutrients such as nitrogen, phosphorus, and potassium along with its
    pH.


    **Crop Sensors:** These sensors measure the health and growth of crops, including
    plant height, leaf area, and chlorophyll levels.


    Once the sensors are installed, the data they collect is analyzed using advanced
    analytics techniques. This data can help farmers make more informed decisions
    about crop management, including when to plant, when to water, and when to harvest.
    By analyzing historical data, predictive analytics can help farmers to forecast
    crop yields and plan accordingly. Machine learning algorithms can be used to analyze
    sensor data in real time and make recommendations to farmers about optimal planting,
    watering, and harvesting schedules. With the help of connected sensors and analytics,
    farmers can remotely monitor their crops and receive alerts if any issues arise,
    such as low soil moisture or pest infestations. The PlantVillage dataset by Hughes
    et al. [59] consists of about 87,000 healthy and unhealthy leaf images divided
    into 38 categories by species and disease. Here we provide a subset of our experiments
    on working with this data. We also ended up using transfer learning from MobileNet
    and the weights from pre-training on ImageNet.


    The following are augmentations to the images:


    +   - width_shift and height_shift are ranges (as a fraction of total width or
    height) within which to randomly translate pictures vertically or horizontally.

    +   - rescale is a value by which we will multiply the data before any other processing.
    Our original images consist of RGB coefficients in the 0–255, but such values
    would be too high for our models to process (given a typical learning rate), so
    we target values between 0 and 1 instead by scaling with a 1/255 factor.

    +   - shear_range is for randomly applying shearing transformations.

    +   - zoom_range is for randomly zooming inside pictures.

    +   - fill_mode is the strategy used for filling in newly created pixels, which
    can appear after a rotation or a width/height shift.


    We used flow_from_directory() to generate batches of image data (and their labels)
    directly from our images in their respective folders.'
  merge: -1
  img_proc: true
