  md: '# 10.3 BIG DATA IN REMOTE SENSING


    The method of discovering an object’s or surface’s characteristics from a distance
    is called remote sensing (RS). RS data are measurements of the globe that are
    continuously collected via sensors in orbit, sensors in the air, and various other
    methods of data collection. Big data is an enormous collection of datasets whose
    volume and rate are at a level that is substantially above even the most potent
    technological breakthroughs, changing the way problems are addressed. Due to the
    likelihood that it may define what RS big data really is, remote sensing and earth
    sciences are also impacted. Some of the attributes and characteristics of RS big
    data that need to be managed include its enormous volume and rate, diversity,
    and complexity, especially its growing dimensionality [31].


    As a result of recent developments in sensors and earth observation methods, we
    are currently at the beginning of the high-resolution observation period (EOS-4),
    as illustrated in Figure 10.2. Multi-spatial, multi-temporal RS data are currently
    being collected from multiple instruments by more than 200 on-orbit satellite
    sensors. These constant worldwide measurements can span the earth’s atmosphere,
    surface, and oceans [24].'
  merge: -1
  img_proc: true
