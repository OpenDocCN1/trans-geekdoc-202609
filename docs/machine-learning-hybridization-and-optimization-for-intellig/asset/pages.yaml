    crucial applications of remote sensing is the mapping of LULC. Both spectral and
    spatial resolutions are necessary for LULC mapping in order to reduce the spectral
    ambiguity of various land cover types. Airborne hyperspectral images are one of
    the data types that are best for these kinds of applications due to their large
    number of spectral bands and ability to observe fine characteristics in the field.
    It is investigated as to how texture information is used to classify high-resolution
    hyperspectral pictures using machine learning techniques like support vector machine
    (SVM) and random forest (RF). The RF classification method was used to classify
    images that had been reduced using the DWT method to produce the soil class’s
    highest user accuracy of 92.86%, and the method was also used to classify images
    that had been reduced using the Factorial approach to produce the soil class’s
    greatest producer accuracy of 93.75%. For the vegetation class produced, the user
    accuracy was 86.13% and the producer accuracy was 92.19%.


    The work [6] demonstrated a novel learning technique for enabling convolutional
