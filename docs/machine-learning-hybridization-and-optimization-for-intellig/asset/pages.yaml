  md: '# 3.1.2.1 Reliability of Data


    The data provided is not reliable because not everyone who was symptomatic has
    been tested and only those who have been tested are taken into account while those
    who are actually COVID-19 positive but do not have access to health care are considered
    not positive as they haven’t been tested. In addition to this, a chunk of data
    is obtained from social media due to the lack of scale available for testing and,
    as we know, depending on data from social media is not the best.


    Even with the above issues we have to work on the model based on the data available
    with the assumption that the data is reliable as there aren’t alternate options
    for data abstraction for COVID-19.


    # 3.2 BACKGROUND AND LITERATURE SURVEY


    # 3.2.1 THE ORIGIN


    Coronavirus, as we know, has been widespread, but before we get into its prediction,
    let us talk about how this pandemic occurred and changed everyone’s lives. So,
    before we look into how it has spread, let’s discuss the various factors affected
    by COVID-19, the precautions taken against it, and so on. We have to take a deeper
    look into how the virus originated so that we get a better idea about how to proceed.
    The current pandemic is caused by a coronavirus known as SARS-COV-2. Coronavirus
    is a large group of viruses that causes various respiratory diseases, some of
    which are serious, like Severe Acute Respiratory Syndrome (SARS) or Middle East
    Respiratory Syndrome (MERS), which are known for high mortality rates and were
    discovered in 2003 and 2012. Coronavirus comes under four different viruses: alpha,
    beta, gamma, and delta. The coronavirus which is known to infect humans was in
    the category of alpha and beta. The coronavirus spreads among animals as well,
