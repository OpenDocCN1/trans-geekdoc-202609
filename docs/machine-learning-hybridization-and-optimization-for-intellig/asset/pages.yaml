    # FIGURE 7.3 Cloud computing security issues


    # 7.5 VIRTUALIZATION CONCERNS WITH CLOUD COMPUTING


    The interaction between the OS and hardware has changed as a result of virtualization.
    This in and of itself raises questions about conventional security viewpoints
    since it casts doubt on the security you may feel when installing an OS and an
    application on a server you can see. However, some of us already think that this
    level of comfort is inappropriate in the majority of circumstances. For the average
    user, it is quite difficult to realistically determine the actual security posture
    of even a PC with an Internet connection. Although visualization makes things
    more difficult, it does not necessarily improve or worsen security. Although virtualization
    offers many advantages, using it in the context of cloud computing also raises
    particular security issues. Some of the main virtualization issues with cloud
    computing are as follows.


    # 7.5.1 HYPERVISOR SECURITY'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'The software layer that makes virtualization possible is the hypervisor. An
    attacker may be able to access every virtual machine running on that physical
    server if the hypervisor is hacked. In light of this, hypervisor security is essential
    for safeguarding virtual computers and the data they house. Cloud providers must
    put in place stringent security controls, such as frequent security patches, access
    controls, and intrusion detection systems, to reduce the risks associated with
    hypervisor security. They should also employ isolation and segmentation strategies
    to stop virtual machines from communicating with one another, as well as monitor
    hypervisor activity for any odd behavior. Additionally, to find and fix any vulnerabilities
    in the security of the hypervisor, cloud providers should do routine security
    audits. Additionally, they must stay informed of the most recent risks and weaknesses
    to the security of hypervisors and take the necessary steps to resolve them.


    # 7.5.2 SHARED INFRASTRUCTURE VULNERABILITIES


    Security flaws that affect numerous people or systems that share the same underlying
    infrastructure or resources are referred to as *shared infrastructure vulnerabilities*.
    On shared infrastructure components like servers, databases, or network devices,
    these vulnerabilities may develop as a result of inadequate security controls,
    incorrect configuration, or out-of-date software [17]. A data breach brought on
    by an improperly configured cloud storage bucket is an illustration of a vulnerability
    in shared infrastructure. When several users store their data in the same bucket,
    there is a risk that a configuration error could make the bucket accessible to
    the public, making all the data visible to unwanted parties. Strong security measures
    should be put in place, and shared infrastructure components should be monitored
    and updated often in order to reduce vulnerabilities in shared infrastructure.
    To reduce the effect of any security events that do happen, they should also adhere
    to best practices for access control and privilege management.


    # 7.5.3 INADEQUATE ISOLATION


    Despite the fact that virtual machines are normally kept apart from one another,
    there is still a chance that a compromised virtual machine could'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'attack other virtual machines running on the same physical server. Furthermore,
    improperly segregated virtual computers may be able to access sensitive data from
    other virtual machines. Organizations should establish appropriate segmentation
    and isolation solutions to overcome inadequate separation in order to lessen the
    effect of any security incidents. This could involve logical separation utilizing
    access controls and role-based permissions, logical network segmentation using
    firewalls or virtual Local Areas Networks (LANs), and physical isolation of important
    systems. Regular security audits and vulnerability assessments can also be used
    to find problem areas where isolation measures may be inadequate.


    # 7.5.4 VM Sprawl


    Virtual machines (VMs) that are created and then left running, using resources
    even after they are no longer required, are referred to as VM sprawl [18]. This
    could result in a loss of resources, including CPU time, memory, storage space,
    and network bandwidth, which could affect how well other virtual machines perform
    when they share a host or infrastructure. As unused or forgotten VMs may not be
    adequately patched or secured, leaving them exposed to assaults, VM sprawl can
    potentially provide security problems. Additionally, abandoned VMs might hold
    private information that, if unattended, could be accessed or taken. Organizations
    should adopt VM management rules and procedures, such as tracking and monitoring
    VM consumption as well as routinely assessing and decommissioning unwanted VMs,
    to prevent VM sprawl. To find and report on VMs that have been inactive or underutilized
    for a predetermined amount of time, automated tools and scripts can be employed.
    Assigning ownership and duties to each VM as well as routinely evaluating and
    updating access control policies are further guidelines and best practices that
    businesses should create for VM deployment and usage.


    # 7.5.5 Compliance Concerns


    Concerns about compliance refer to the difficulties that organizations have in
    adhering to industry and regulatory standards for data protection and security.
    Industry- and region-specific compliance standards differ, but they frequently
    call for data privacy, access controls, audits and reporting, and'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'incident response. The consequences of not adhering to regulations can be severe
    financial fines, legal responsibilities, and reputational harm to a firm. Additionally,
    compliance infractions may result in data breaches, which may result in the loss
    of confidential information and intellectual property as well as additional legal
    and reputational repercussions. Organizations should create and maintain a complete
    security program that includes guidelines for data protection, risk management,
    and incident response in order to solve compliance issues.


    # ## 7.6 SECURITY RISKS ASSOCIATED WITH CLOUD COMPUTING VIRTUALIZATION


    # ### 7.6.1 MIGRATION OF VIRTUAL MACHINES


    The process of attaching a virtual machine to another real machine without first
    shutting it down is known as *virtual machine hot migration*. There are several
    reasons to migrate virtual machines, including load balancing and maintaining
    fault tolerance [19]. Due to the transmission, which makes the contents of the
    virtual machine visible to the network, data privacy and integrity may be compromised.
    To guard against hacker interception, data exchanged during the migration process
    should be encrypted. During the migration process, access controls should be put
    in place to limit access to virtual machines. The migration procedure and the
    virtual machines should only be accessible by authorized individuals. To stop
    intruders from eavesdropping on communications or launching assaults during the
    migration process, the network should be secured. Firewalls, intrusion detection
    and prevention systems, and other security measures can be used to achieve this.
    Before and after the migration process, the virtual machine’s integrity should
    be checked to make sure it hasn’t been tampered with. To keep track of every activity
    made during the migration process, including who started the migration, when it
    happened, and what changes were made, audit logs should be created.


    # ### 7.6.2 Virtual Machine Escape'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'On a virtual computer, users can accomplish mutual isolation and resource sharing.
    Software in a virtual computer should, in theory, not affect other virtual computers.
    The term virtual machine escape refers to situations when applications running
    inside a virtual machine can, in some cases, overcome isolation barriers and operate
    directly on the host machine because of technological limitations and vulnerabilities
    in virtualization technology. If the virtual machine escape attack is successful,
    the host and the hypervisor are both in grave danger [20]. Because it can let
    an attacker access private information or take over the host system, VM escape
    is a severe security risk. In rare circumstances, VM escape can be exploited as
    a springboard for launching additional attacks on other networked systems. An
    attacker may try to take advantage of a VM escape vulnerability in a number of
    ways, including using guest-to-host communication channels, using flaws in virtualization
    software or hardware, or exploiting errors in the guest operating system. Tight
    security measures must be put in place in order to prevent VM escape, including
    implementing tight access controls and permissions, limiting guest-to-host communication
    channels, and updating virtualization software and hardware.


    # 7.6.3 ROOTKIT ATTACK


    A specific sort of malware called a rootkit conceals itself on the installation
    target and targets certain files, processes, and network links [21]. What is more
    typical is that rootkits are frequently used in conjunction with other harmful
    software like Trojans and backdoors [22]. Rootkits conceal information by loading
    unique drivers and changing the kernel of the operating system. Update and patch
    all software frequently, including the virtualization program and the virtual
    machines’ operating systems. To ensure that only approved users and processes
    have access to the virtual environment, utilize tight access restrictions. Install
    intrusion detection and prevention systems to keep an eye out for indications
    of harmful or unauthorized behavior in the virtual environment. Scan virtual machines
    with anti-malware software to check for known rootkit signatures and other infections.
    Use privileged accounts only when necessary, and to protect them, use multi-factor
    authentication and strong passwords [23]. To keep track of activity in the virtual
    environment and spot warning indications of'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'a potential attack, implement logging and auditing. Conduct penetration tests
    and vulnerability analyses frequently to find and fix any potential security flaws.


    # 7.6.4 Denial of Service Attack


    A denial of service (DoS) attack is a form of cyberattack that tries to stop a
    system or network from functioning normally by flooding it with traffic or requests.
    Using resources like CPU, memory, or bandwidth, a DoS attack aims to block legitimate
    users from using the targeted system or network. These attacks try to overwhelm
    a target system with so much traffic that it uses up all of its bandwidth or resources.
    ICMP floods, DNS amplification assaults, and UDP floods are a few examples of
    volume-based attacks. These attacks drain system resources by taking advantage
    of flaws in network protocols like TCP/IP [24]. SYN floods, Ping of Death attacks,
    and Smurf attacks are a few examples of protocol-based attacks. Resources are
    shared by physical and virtual machines [24]. The assets of the other virtual
    machines will be impacted or even crashed because they do not have any assets,
    even if an attacker takes control of one virtual machine and has access to all
    host computer resources. Denial of service in a virtual environment would be what
    this is [25].


    # 7.6.5 Issue with the Virtual Machine Monitor


    The key component of virtualization is the virtual machine monitor (VMM), which
    generates or manages virtual resources and also manages and isolates virtual machines.
    If the virtual machine monitor is hacked, the attacker will have access to the
    virtual machine metadata maintained by the virtual machines and will be able to
    control all the virtual machine instances it maintains [26]. Attackers may use
    VMM flaws to compromise the host system, access information or resources on other
    virtual machines, or take over the virtual environment. Security flaws brought
    on by improperly configured VMM settings may include providing unauthorized access
    to virtual machines or disclosing sensitive information. Unauthorized users may
    be able to access or alter virtual machines or resources in the virtual environment
    due to lax or ineffective access controls. Without effective monitoring, it may
    be challenging to quickly identify and address security'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'incidents. The operation of the guest operating systems may be hampered or

    they may be exposed to security threats if the VMM is not appropriately

    segregated from them. Update and patch the VMM frequently to fix any

    vulnerabilities. Ensure the VMM is configured appropriately.


    # ## 7.6.6 DECOUPLING ATTACKS ON VIRTUALIZATION PLATFORMS


    Attacks on virtualization platforms that target the hypervisor, the layer of

    software that governs and controls the virtual machines, are known as

    _decoupling attacks_. In order to gain access to or control over data or

    resources in other virtual machines using the same hypervisor, a decoupling

    attack aims to undermine the isolation between virtual machines.

    Hypervisor escape attacks seek to exit the virtual machine and gain access

    to the hypervisor behind it, from which the attacker may be able to gain

    access to other virtual machines or private information. In order to gain

    access to or control over data or resources in other virtual machines

    operating on the same hypervisor, these attacks take advantage of flaws in

    the VMM. Only the physical machine with the system vulnerability is

    susceptible in a typical working environment, and the attacker’s potential

    targets are severely limited. By sharing information throughout the entire

    system via a cloud computing virtualization platform, multiple rent users

    can use a single virtual machine to exploit the current virtual vulnerability

    platform.'
