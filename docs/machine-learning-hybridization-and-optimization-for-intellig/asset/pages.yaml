    # ## 5.5 CONCLUSION


    The proposed work has put forward an innovative approach to effectively design
    a two-level BLTL and LSTM architecture for several purposes like the generation
    of judicial documents, legal research prediction assistance,'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'and so on. An innovative contribution of the present work is the use of the
    intelligent transfer learning technique, which clearly confirms that this multipurpose
    model can be implemented in several other different domains that suffer from a
    sparsity of data. Therefore, since most of the information in the judicial system
    is confidential and moreover the details about cases are highly imbalanced, the
    proposed two-level multipurpose frameworks are suitable for law processes that
    suffer from a sparsity of dataset problems. The future work mainly focuses on
    reporting the results of the BLTL target domain and the LSTM framework, and further
    discovering the likelihood of extending this architecture and fine-tuning it to
    other domains where data is not openly available in the judiciary court system.
    Undoubtedly, this dual framework will increase the competence of the justice delivery
    system and it will be useful for several purposes like the prediction of decisions,
    assessing the risk and consequences of decisions, solving disputes, managing files,
    document translation, legal assistance in research, automating processes, and,
    finally, recognizing different languages. This would help the judges and all stakeholders
    to conduct legal research and benefit from computer aided detection (CAD) systems.


