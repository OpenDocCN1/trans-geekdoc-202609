  md: '# 8.2.3 Perception Layer


    The perception layer, also known as the sensor layer, acts as a sense organ in
    the system, and there are different types of sensors attached to this layer that
    may sense or identify things and collect data from devices. The sensors are selected
    according to the application requirements. The information that is collected by
    the sensors, such as temperature identification, face scanning, and fingerprint
    scanning, is commonly used in devices. The main issue that arises in relation
    to the perception layer is when hackers replace the original sensor with a duplicate
    sensor of their own, through which they may hack the devices and collect data
    from them [11, 12]. Therefore, the main threat in the perception layer is to the
    sensors and can include the following:


    +   - A sniffing attack is a real-time attack that mainly targets personal communication,
    such as phone calls, text messages, and conferences, which are hacked by the attackers.
    Data can be stolen by attackers at the time of transmitting data into the network.
    There may be a chance of giving acknowledgment by the hackers to the sender and
    receiver with their own access [16].

    +   - A capture of node is one of the more dangerous attacks faced by the perception
    layer. The attacker may create a gateway in the form of a key node and thereby
    take control of the application or device. The key node created by attackers may
    cause insecurity in communication between sender and receiver.

    +   - In fake node implementation, hackers implement a fake node in the system
    or device, which may stop the transmission of real data to the receiver, and they
    replace the real data with their own data.


