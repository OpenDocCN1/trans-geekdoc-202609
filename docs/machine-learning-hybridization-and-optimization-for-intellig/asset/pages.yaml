  md: '# 6 Analysis of Deep Learning Methodologies for Handling Non-Medical Big Data
    and Very Limited Medical Data with Feature Extraction and Annotation Techniques


    R V Aswiga


    DOI: 10.1201/9781003465775-6


    # 6.1 INTRODUCTION


    One of the prevalent and major research areas in medical imaging is diagnosis
    using Computer Aided Detection (CAD) techniques. This has several breakthrough
    records in diagnostic radiology too. These techniques require extensive big data
    to build reliable and accurate models. However, it is extremely difficult to collect
    images in huge volumes from the latest modalities as they are not available to
    the public. Especially in the medical domain, collecting huge amounts of data
    is difficult. Thus, maximizing the utilization of medical images that are very
    limited for the purpose of interpretation and analysis appears to be a significant
    field for research. This work focuses on building frameworks for the classification
    and annotation of images with limited medical image datasets. For classifying
    a limited medical dataset, the proposed model should be first trained on abundantly
    available non-medical big datasets. The proposed work is organized as mentioned
    below. Section 6.2 explains recent advancements in CAD methods and advanced machine
    learning techniques that have made'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'breakthroughs in handling medical images. A thorough review of the masking,
    segmentation, and classification of rare as well as abundantly available medical
    images is presented in Section 6.3. The transfer learning concept techniques to
    overcome the problems that are associated with the medical domain classification
    as well as non-medical datasets that have insufficient training data are summarized
    in Section 6.4. With the advancements in feature extraction techniques and with
    several other advanced image processing techniques, the classification of both
    non-medical and medical images has been explored, and this is discussed in Section
    6.5. The significance of the decoder-encoder models for generating captions for
    medical and non-medical images is presented in Section 6.6. Finally, Section 6.7
    summarizes the issues and challenges based on the literature survey.


    # 6.2 CAD METHODS AND MACHINE LEARNING TECHNIQUES FOR PROCESSING MEDICAL IMAGES


    Recently the advancements in CADx and CADe technologies have made additional contributions
    to medical imaging. In very recent years, the usage of machine learning techniques
    in such CAD systems is continually growing. The described work [103] considers
    a valuable platform for the automated analysis of medical images. The proposed
    framework helps in the diagnosis of carotid artery problems using ultrasound images.
    The diagnosis includes segmenting the arterial wall automatically, selecting Regions
    of Interest (ROIs) plaque, estimating, and clustering of texture features and
    analysis of tissues in different image areas. A shape analysis strategy for solving
    various segmentation problems in a unified framework was introduced in [89], and
    has been tested on many clinical lung CT images.


    The classification of lesions in 3D images using a CAD system is introduced in
    [106]. The proposed work automatically segments lesions using a spiral scanning
    technique, for which a seed point in combination with dynamic programming and
    a spiral scanning technique is deployed. Detecting tuberculosis (TB) automatically
    in chest radiographs (CXRs) has'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'been proposed in [52] for detecting textural, shape, and focal abnormalities.

    A CAD system was developed to deal with diverse varieties of abnormalities, which
    combines and normalizes several detected abnormalities subscores into a single
    TB score using a supervised classifier.

    The calculated final overall TB score can be adapted to different operational
    settings or different operational requirements using automated CAD systems.


    An approach to annotating abnormal regions in CT scan images is introduced in
    [47]. The proposed approach is a novel perspective that includes CT images of
    the lungs. The abnormal regions are separated into nine diverse groups of lung
    diseases, which could be applied to diagnosis and research using CAD and will
    be useful in medical education too.


    An innovative approach [82] was put forward based on texture to find the important
    section in whole slide images (WSIs). The regions were selected with higher magnification
    to detect and diagnose breast cancer effectively by performing a more sophisticated
    analysis of the tissue formation. A Support Vector Machine (SVM) classification
    algorithm was trained to identify and differentiate clinically irrelevant patches.
    A novel automatic approach [44] was proposed which helps in identifying rare diseases
    like cardiac amyloidosis from electronic health records (EHRs), which consists
    of 73 positive and 97 negative instances and resulted in an F1 score of 0.98.


    The work reported in [74] revealed that evolutionary computing methods such as
    preprocessing, feature extraction, segmenting, classification, clustering, and
    feature selection along with dimensionality reduction techniques play a vital
    role in optimizing CAD techniques for diabetic retinopathy (DR) disease. Several
    algorithms like ant and bee-colony optimization along with particle-swarm optimization
    have been studied. The comparisons of efficiencies to find the best algorithm
    have been presented. A presented work in [5] is one such CAD approach that inserts
    a source domain lesion seamlessly into a final target image. The data augmentation
    technique is tested on a CT and mammography dataset that helps in training various
    classifiers. The proposed work [38] introduces a CAD framework for identifying
    shapes and boundaries in dermoscopic images. The framework uses a saliency optimization
    algorithm for delineating lesions effectively.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'One innovative approach [100] has been introduced for detecting rare diseases
    using facial images that are in 2D. The model is trained on 12 diverse classes
    with 1,772 facial images and the results are outperforming several other state-of-the-art
    methods. An automatic detection method [98] for identifying neo-vascularization
    syndrome (NVD) in the retinal image of the optic disc region was introduced. This
    machine learning–based approach involves feature extraction along with Gabor filtering
    and feature selection techniques for segmenting vessels and detecting NVD using
    an SVM classifier. Of the 424 retinal images, 42 features are extracted as essential
    ones from NVD images, 134 are classified as NVD, and 290 are classified as non-NVD
    images.


    An efficient clustering-based approach is developed in [122] for reconstructing
    images with 3D low-dose CT images. The image patches are retrieved from a pool
    of CT images. The proposed CT rebuilding step is completed by using a Lagrangian
    approach with a minimum number of forward and backward projections in images,
    and it substantially optimized the quality of the reconstructed CT image by using
    an edge-preserving regularizer that is non-adaptive in nature.


    The proposed machine learning technique [125] to detect lung lesions is an innovative
    approach using low-dose PET images. An image quality transfer (IQT) technique
    will enhance the information content or its resolution using a patch-regression
    method that will transform the map parameters from low-quality to high-quality
    images. Thus, IQT helps in improving image quality to detect lesions from low-dose
    images. The technique [111] for classifying Parkinson''s syndrome was introduced.
    Several machine learning algorithms like ensemble based machine learning algorithms,
    genetic algorithms, and extreme ML algorithms [79,87] have been used effectively
    for detecting malignancy in breast images.


    The authors of [41] have introduced a novel method for classifying gait especially
    for patients with Fabry''s disease (FD). The proposed method uses multiple regression
    models for classifying FD disease with an accuracy of 78.21%. (Sun et al. 2019)
    deployed four efficient techniques to identify this rare disease in people. The
    work records the summary of misclassification rates, and thereby when identifying
    rare diseases, a neural network will identify the least error rate.'
