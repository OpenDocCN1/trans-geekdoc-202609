  md: '# 15 A Deep Learning Strategy for Sign Language Classification and Recognition
    for Hearing-Impaired People


    Souvagya Ganguli, Sumit Anand, Supri ti Das, and G Rohith


    DOI: 10.1201/9781003465775-15


    # 15.1 INTRODUCTION


    Sign languages are forms of communication that convey meaning using manual gestures
    or visual cues. Sign language, often known as SL, is the principal mode of communication
    utilized by persons who are deaf or hearing impaired when attempting to convey
    their thoughts or emotions to hearing people in everyday life [1]. A collection
    of gestures, hand motions, facial expressions, or head movements can be used to
    represent letters or symbols in SL, and each letter of the alphabet has a corresponding
    sign. There are between 138 and 300 distinct forms of sign language used throughout
    the world now due to the fact that there are more varieties of sign language being
    used around the world and that these variations are being improved as a result
    of various groups of people connecting with each other [2]. The visual means of
    communication utilized by the hand-talk community and ordinary people to transmit
    the meaning include hand gestures, signals, body movements, facial expressions,
    and lip motions; we know this language as a sign language. The process of sign
    language recognition (SLR) is difficult and intricate, and the current state of
    the art in artificial intelligence makes possible a wide variety of study prospects.
    According to the figures compiled by the World Health Organization, around 5%
    of the global population is affected by hearing loss. The United'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'Nations has made the projection that there will be 900 million people who are
    hard of hearing in the world by the year 2050 [3]. As a result, SLR is garnering
    a lot of attention at the moment. SLR has the potential to eradicate the language
    barrier that exists within the hand-talk community (deaf-mute).


    The following are some more ways that SLR contributes to the improvement of communication:


    +   • It lessens the level of frustration felt by members of the hand-talk community.

    +   • The elimination of the communication barrier caused by SLR results in improved
    communication.


    ![](img/8c9c25929b8bfe55c61ba059d5462e42_366_0.png)


    # FIGURE 15.1 A snapshot of the commonly used sign languages [4]


    The two modalities of the SLR are as follows:


    +   • Sensor based: Sensors placed in close proximity to the signer can record
    the signer’s head and finger movements as well as their overall motion. Gloves
    equipped with sensors can follow the signer’s movements and interpret what they
    are trying to say. Sensor-based SLR, as opposed to vision-based SLR, yields effective
    results.'
  merge: -1
  img_proc: true
