    and they are becoming more prevalent daily as a result of rising IT usage. Software-as-a-service,
    security-as-a-service, storage-as-a-service, platform-as-a-service, and infrastructure-as-a-service
    are all forms of cloud computing services that are available. Additionally, the
    consumer receives all of these services via online platforms, making the correct
