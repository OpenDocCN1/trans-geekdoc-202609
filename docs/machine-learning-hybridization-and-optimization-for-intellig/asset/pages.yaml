    # 9.3.2 KNN


    Next, we used the KNN algorithm for classification, which is a simple, straightforward
    algorithm for resolving regression and classification issues. The KNN algorithm
    works by analyzing the distance (D) between a query and all the models in the
    given input data, selecting the K-nearest models to the query, and choosing persistent
    labels or averaging the labels that were established. Figure 9.7 depicts a flowchart
    that explains this clearly.'
