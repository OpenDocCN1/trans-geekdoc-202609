    # 5.4.3 EXPERIMENT RESULTS AND DISCUSSION


    # 5.4.3.1 BLTL framework


    The 25,000 imagenet dataset is used for feature learning at the source domain.
    The first source model of the BLTL framework consists of just five convolutional
    layers; then max pooling layers are used which in turn are followed by three dense
    layers. This proposed BLTL source CNN network, with adequate training and validation,
    results a in significant accuracy of 0.90, as demonstrated in Figure 5.3.


    ![](img/8c9c25929b8bfe55c61ba059d5462e42_141_0.png)


