    # FIGURE 9.2 Flow diagram of the entire work


    # 9.2.3 DENOISING


    The raw ECG signal downloaded from the PhysioNet database will have imposed noises
    within it. The preprocessing of the signal is a crucial step to remove the artifacts
    present in the raw signal. There are many works of literature available on filtering
    ECG signals. The filters have to be designed by considering the frequency component
    required for feature extraction [29]. Vibrations and sudden movements by the subjects
    may cause motion artifacts, resulting in peak amplitude and duration differentiation.
    This type of movement during real-time ECG signal recording will lead to a baseline
    shift of the signal. By denoising the input ECG pulse, the quality of the ECG
    pulse has been enhanced and quantified using certain parameters like the signal-to-noise
    ratio (SNR).


    For noise cancellation applications [30], adaptive filters are widely employed,
    which are usually designed using finite impulse response (FIR) filters. These
    filters make use of a minimization criterion to update the filter coefficients.
    Thus, the weighted sum of current and previous input samples will be the corresponding
    output of the filter. The NLMS adaptive filtering technique is aimed at artifact
    removal from ECG data.


    # 9.2.4 Adaptive Filtering Technique'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'The ECG signal has a definite pattern of five waves, where the Q, R, and S
    wave components together make up the QRS complex as shown in . Additionally, the
    ECG waveform has specific characteristics as seen in Table 9.1. Therefore, an
    ECG signal is a signal that has repetitive patterns of all wave components, but
    it varies with time. The signal that continuously varies in time must have some
    special filters designed to work on those variations. So, an adaptive filter is
    chosen; the filter parameters change according to the signal variations. This
    means that the filter adapts itself to the variations occurring in the ECG signal.
    The adaptive algorithm works by weight adjustments achieved through an adaptive
    control mechanism [31]. The major advantage of using adaptive denoising techniques
    is that high-level noise reduction can be achieved, which is difficult through
    direct filtering techniques. Also, the error signal used should be chosen as required
    by the application.


    Here, the normalized least mean square adaptive filtering is chosen based on the
    limitations of the LMS algorithm as discussed in [32]. An adaptive filtering technique
    is used to apply the self-correcting leaky NLMS algorithm to the ECG signal in
    order to remove the EMG artifact. This adaptive filter works by adjusting its
    step size and leakage coefficient. The efficiency of the filter output is tested
    by calculating the SNR, which was found to be between 16.53 and 28.56 dB, and
    low mean square error for the MIT-BIH database.


    The NLMS adaptive filter is used here to eliminate artifacts such as AC and DC
    noise present in ECG data. The overall noise cancellation is clearly shown in
    Figure 9.3. The filter parameters are adjusted to eliminate baseline wandering,
    motion artifacts, and power line interference. NLMS accomplishes this by normalizing
    the power of the input. The evaluation is performed with x(n) as the input signal,
    which is composed of s(n) with the noise signal n1(n). Here, d(n) represents the
    desired system output, and y(n) represents the adaptive noise cancellation output
    [33], where e(n) denotes an error signal and w(n) denotes the weight vector. These
    are presented in equations (1)–(5):'
  merge: -1
  img_proc: true
- pgno: 240
  md: '![](img/8c9c25929b8bfe55c61ba059d5462e42_240_0.png)


    # FIGURE 9.3 Adaptive noise cancellation method


    ```

    x(n) = s(n) + n1(n) (1)

    d(n) = x(n) (2)

    y(n) = wT (n) + x’(n) (3)

    e(n) = d(n) – y(n) (4)

    w(n + 1) = w(n) + 2μe(n)x’(n) (5)

    ```


    # 9.2.5 FEATURE EXTRACTION


    The resultant data of the NLMS filter is a noise-free ECG with all the required
    information. The noise-free ECG data is always recommended for extracting features,
    as it plays a major role in the classification of abnormalities. It is the most
    important stage prior to classification. The features should be properly extracted
    from the denoised signal to achieve more accurate classification results.


    Generally, there are various techniques designed for feature extraction from the
    ECG signal [34, 35, 36, 37], such as fast Fourier transform (FFT), adaptive autoregressive
    (AAR) parameter, multivariate AAR, bilinear AAR, PCA, ICA, genetic algorithm (GA),
    wavelet transform (WT), CWT, DWT,'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'and WPD. All these methods have their own significance in feature extraction
    with respect to signal characteristics. Among them, PCA, ICA, WT, AR, WPD, and
    FFT are mostly used, considering their advantages in feature extraction from biosignals.
    In the proposed work, DWT and LBP are utilized to extract the dominant characteristics
    from the ECG signal.


    # 9.2.6 DWT


    In this methodology, the features of the denoised signal are extracted by applying
    an LBP algorithm and DWT. The wavelets possess different scaling and shifting
    properties, and each wavelet has different sizes and shapes. The wavelet has to
    be chosen based on the input signal used, computational complexity, wavelet characteristics,
    and the required output of the application. Among the wide variety of wavelet
    families, the most commonly used wavelets are Haar, Daubechies, Symlet, and so
    on. When applying a discrete wavelet transform to the denoised signal, the Daubechies
    mother wavelet is chosen. As shown in Figure 9.4, the denoised signal is divided
    into lower and higher frequency components. At each level of decomposition, the
    data is down-sampled by 2 (↓2). Specifically, the significant features of the
    input signal are decomposed into DWT coefficients as an approximation and detailed
    coefficients, whose lengths are smaller than the original signal length.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '![](img/8c9c25929b8bfe55c61ba059d5462e42_242_0.png)


    # **FIGURE 9.4 DWT using filters**


    In the proposed work, the input ECG signal is passed through DWT and decomposed
    into eight levels of approximate and detailed coefficients. By validating the
    frequency of each decomposed level, the db8 sub-band of the signal reflects the
    original ECG signal. Based on the obtained detailed and approximate wavelet coefficients,
    the P and R peaks of the ECG signal are extracted to estimate the RR interval
    and PR interval. The extracted features mentioned above are further used to train
    and test the dataset for classification purposes.


    # **9.2.7 LBP METHOD**'
