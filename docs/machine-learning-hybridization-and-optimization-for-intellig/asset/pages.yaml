  md: 'In 1992, Jay Wilpon and a team of researchers at AT&T designed and developed
    automated speech recognition (ASR) using HMM. This was a significant development
    as it saved a tremendous amount of time and money.


    In the same year, AT&T researchers also solved the problem of large classification
    using support vector machines (SVM). And in 1996, Patrick Haffner, a researcher
    at AT&T, developed convolutional neural networks (CNNs) for large-scale application
    recognition


    .In 1997, another group of AT&T researchers developed the AdaBoost algorithm,
    which utilizes decision trees and unstructured data for decision classification.In
    that same year, Garry Kasparov lost a game of chess to the IBM supercomputer Deep
    Blue. This marked the first time a computer had defeated a skilled chess player,
    causing great alarm within the chess community. It was a historic event that showcased
    the superior performance of AI systems


    in challenging tasks. The world now understands that humanity has developed its
    own adversary—an artificial intelligence that can learn and evolve on its own.
    This signifies a miraculous turning point in machine learning.


    Natural language understanding was developed by combining learning techniques
    such as SVM, HMM, and AdaBoost, resulting in the creation of the first interactive
    voice response (IVR) in 2001.'
