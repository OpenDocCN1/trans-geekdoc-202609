  md: '• Docker container: The lightweight and highly portable Docker containers were
    created with this in mind. They are smaller and more effective than virtual machines
    due to the fact that each container has its own set of system files that are shared
    with the host operating system and other containers. Additionally autonomous of
    one another, processes between containers are distinguishable and manageable with
    the use of container orchestration tools. Docker containers are also intended
    to be platform-agnostic, which means they can function on a variety of hardware
    platforms and operating systems. In contexts where portability and scalability
    are crucial, such as cloud computing systems and other distributed computing environments,
    they are thus well suited for utilization. Compared to Docker containers, traditional
    virtual machines are less portable. Each container has its own system files, and
    processes between containers can discriminate between various computer resources
    and are independent of one another.


    # 7.4 CLOUD COMPUTING: SECURITY CONCERNS


    # 7.4.1 NETWORK AVAILABILITY


    The importance of network connectivity and bandwidth is directly related to cloud
    computing. Since cloud services are often accessed online, dependable and quick
    network connectivity is essential to guaranteeing that cloud applications and
    data are always accessible. Cloud services may become unavailable or operate poorly
    if network connectivity is sluggish, inconsistent, or unavailable, which can have
    serious repercussions for businesses. For instance, any interruption in network
    access could cause a firm that depends on cloud-based software to run its operations
    to lose productivity and income. Cloud-based data loss or corruption, which can
    have major repercussions for organizations, especially those in regulated industries,
    may occur if information is not accessible when it is needed. Before implementing
    cloud computing services, it is crucial for enterprises to confirm that their
    network connectivity and bandwidth fulfill their bare minimum requirements. This
    may necessitate installing redundancy measures, upgrading network infrastructure,
    and making sure that network availability and performance are covered in service
    level agreements (SLAs) with cloud providers.


    # 7.4.2 DISASTER RECOVERY AND BUSINESS CONTINUITY'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'The assurance that their operations and services will continue in the event
    of a catastrophe or disruption in the cloud provider''s production environment
    is essential for tenants and consumers of cloud services. In multi-tenant cloud
    settings where numerous customers share the same physical infrastructure and resources,
    this is especially crucial. In such settings, a single catastrophe or outage can
    affect numerous clients, causing extensive service interruptions and data loss.
    To combat this, cloud service providers commonly have business continuity and
    disaster recovery mechanisms in place to make sure that their services are available
    and functional in the case of a disaster. This could involve techniques like data
    backup and replication, failover to different data centers or cloud regions, and
    the use of redundant network connectivity and equipment. Service level agreements
    (SLAs), which guarantee a specific level of uptime and availability and give compensation
    in the event of service interruptions or outages, may be offered by cloud providers.
    Ensuring the continuity and availability of cloud services in the event of a disaster
    is a crucial component of cloud computing, and cloud service providers have a
    duty to implement effective disaster recovery and business continuity measures
    to safeguard their clients'' operations and services.


    # 7.4.3 TRANSPARENCY


    Cloud users and tenants frequently have to put their trust in the security assurances
    made by cloud providers, especially when those companies withhold information
    about their internal policy or technological implementation. Cloud providers must
    be open and honest about their security and privacy policies as well as how they
    respond to security issues in order to earn and keep customers’ trust. Transparency
    can take many different forms, such as making available to the general public
    the provider''s security and privacy policies, practices, and standards as well
    as specifics regarding their incident management protocols and methods. Tenants
    and users may find this information useful in understanding how the provider safeguards
    their data and applications as well as the measures taken to stop, identify, and
    address security incidents. Tenants or users must believe a cloud provider’s assurances
    of security when the company withholds information about how its internal policies
    or technological'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'implementation are put into practice. Tenants and consumers still need some
    transparency from providers about incident management, cloud security, and privacy.


    # 7.4.4 LEGAL AND REGULATORY COMPLIANCE


    If the data you need to handle is constrained by laws or regulations, using public
    clouds could be challenging or unrealistic. While building and certifying clouds
    to meet the demands of regulated markets is something we should expect from providers,
    obtaining certifications may be difficult due to a number of non-technical variables,
    including the existing level of general cloud understanding. Organizations that
    need to process data subject to legal constraints or regulatory compliance may
    find that public cloud computing is not a practical solution. For instance, there
    are special data protection and privacy requirements that must be observed in
    sectors like healthcare, financial services, or government, such as HIPAA, PCI
    DSS, or GDPR. These requirements frequently demand that data be handled and stored
    in particular physical places or with particular security measures. Achieving
    certification can be difficult due to the complicated and constantly changing
    nature of regulatory compliance, even while cloud providers may offer solutions
    built to comply with these regulatory standards [16]. Technical controls may be
    necessary for compliance certification, but so may organizational, legal, and
    operational controls.'
