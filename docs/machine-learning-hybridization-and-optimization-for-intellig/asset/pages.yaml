    # 12.2 RELATED WORK ANALYSIS


    Al-Jarrah et al. [8] presented the path planning of multi-robot and collision-free
    coordination using a probabilistic neuro fuzzy network. The work employs subducted
    clustering along with least square calculation, which helps in creating fuzzy
    rules to understand the correlation between input and output data. The authors
    incorporate a leader-follower approach. A neural network was implemented to train
    membership function attributes, and ANFIS was used to tune fuzzy rules. Mathew
    et al. [9] adopted a traveling salesman problem approach with two variations including
    enumeration and reduction in several static warehouses. The objective of this
    research is to overcome the limitations of the heterogeneous delivery problem
    and formulate it as an optimal path planning concern. With this method, we can
    observe a 50% reduction in distance traveled by the truck and fuel consumption.
    In their study, Yang et al. resolved the collaborative path planning [10] issue
    using ant colony optimization (ACO). They considered the stationary obstacles
    in an unknown environment for simulation purposes. To enhance the confluent speed
    of the proposed method and smoothness of the initial path, they incorporated a
    multifactor heuristic function. Nasrollahy et al. addressed the problem of route
    planning with variable barriers in a dynamic environment. This strategy is straightforward
    and effective in both dynamic and static contexts and reduces overall costs [11].
    This approach can be used to overcome any type of obstacle, independent of its
    size and shape, even if in this research, we consider the obstacles to have a
    circular form. In the study by Yu et al. [12], a polynomial-time algorithm called
    "split and group" is employed for path planning of multiple robots in well-connected
    environments. This approach addresses grid-based challenges and consistently produces
    a globally optimal schedule for all instances of the problem. In other words,
    SaG approximates results with a sublinear computation time and is an ideal case
    of the O(1)-approximation procedure. Kala et al. suggested a'
