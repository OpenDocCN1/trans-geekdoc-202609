    # 20.2.4 BIBLIOMETRICS


    Pritchard [20] created bibliometric analysis, which has grown in favor of a tool
    for thoroughly examining the scientific development of a studied subject through
    time [21]. Bibliometrics is a quantitative analysis technique that measures the
    interactions and impacts of publications in a certain field of study using mathematical
    and statistical methods [22]. This strategy effectively identifies influential
    research, authors, journals, organizations, and nations across time by providing
    a macroscopic picture of a large body of academic literature [23]. Bibliometrics,
    a powerful tool for big data processing, is frequently used to qualitatively assess
    the state of the discipline''s development and its influence on academia [24].
    As a result, the emphasis of our research is understanding the general privacy
    and security of IoT applications in start-ups.


    # 20.3 METHODOLOGY


    # 20.3.1 Study Design


    A bibliometric analysis was conducted to get an overview of the privacy and security
    of IoT applications in start-ups.


    # 20.3.2 Study Selection and Extraction


