    # 12.3 EVOLUTION OF THE PATH PLANNING PROBLEM


    For humans, getting from one location to the next is a simple undertaking. One
    makes a decision about how to proceed. Such a simple and straightforward operation
    is a significant difficulty for robots. Path planning is a crucial challenge in
    robotic applications [30]. Finding a sensible route for a robot to travel from
    starting location to a destination position, whether it be a cleaning robot, a
    mechanical arm, or a mysteriously drone, is indeed a standard challenge. Determining
    a way from an initial place to a desired location is the issue, taking into account
    the modeling framework, the sort of robots, the purpose, and so on. This problem
    was approached in many ways in this study. A path optimization method that is
    productive is necessary for safe and reliable mobile robot navigation because
    the integrity [31] of the successful approach has a significant impact on industrial
    applications. As it affects other parameters like computation time and resource
    usage, decreasing the distance traveled is usually the primary goal of the mapping
    process. In this survey, we have studied research articles from the past four
    decades to interpret the evolution of route planning'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'algorithms. Initially, researchers started to work with classical and hybrid
    approaches. Path planning issues are frequently addressed with approaches from
    the conventional category, including cell decomposition (CD), potential field
    (PF), road map, and subgoal network. These techniques are understood to be computationally
    costly and are shown to be less effective in managing unfamiliar, imperfectly
    known, or dynamic settings in their fundamental articulation [32]. With regard
    to building a viable route among the source and destination places, they are also
    frequently found to rely on thorough previous information about the environment.
    These problems can be resolved by meta-heuristic methods since they are adept
    at managing unknowable or imperfectly known settings. Each repetition of these
    procedures generates a series of interim paths that get them one algorithmic step
    closer to the final location. In contrast to conventional methods, which create
    an optimal path based on previous data and then implement it, meta-heuristic techniques
    produce a subpopulation of potential movements in each loop. Following that, the
    optimal path will be selected and carried out based on their fitness. Some researchers
    viewed meta-heuristic-based techniques for path planning as being based on techniques
    like genetic algorithms (GA), neural networks (NN), particle swarm optimization
    (PSO), and ant colony optimization (ACO) [33]. To improve mobile robots’ skills
    in dealing with stationary and moving obstacles, several experts combined neural
    network models and reinforcement learning. These problems can be resolved by meta-heuristic
    methods simply because they are adept at managing unknowable or imperfectly known
    settings. Each repetition of these procedures generates a series of provisional
    paths that get them one algorithmic step closer to the final position.


    Potential field (PF), Dijkstra’s algorithm (DA), rapidly exploring random tree
    (RRT), and probabilistic road map (PRM) are the traditional techniques for path
