    |---|---|---|---|

    | PR interval | 120–200 | P wave | 0.25 |

    | RR interval | 600–1200 | Q wave | 25% of R wave |

    | QRS complex | 80–100 | R wave | 1.6 |

    | ST segment | 80–120 | S wave | 1 |

    | QT interval | 420 | T wave | 0.1–0.5 |

    | T wave | 160 | U wave | 1/3 of T wave |


    When the electrical movement of the heart is disrupted due to certain factors,
    it results in abnormal ECG waves with altered waveform characteristics. One major
    abnormality of the heartbeat is arrhythmia. The average resting heart rate for
    a person is 60–100 beats per minute (BPM). Arrhythmia is a condition where a person''s
    heartbeat is too fast or too slow, exceeding normal levels; such conditions are
    categorized as tachycardia and bradycardia, respectively.


    The MIT-BIH arrhythmia database used in this study was downloaded from PhysioNet
    ATM. PhysioNet is an open-source website that provides a range of biosignals recorded
    under different conditions. The signals can be downloaded at specific time intervals,
    as the original signals are recorded over a longer duration. The advantages of
    using PhysioNet ATM include its availability of a vast number of signals, user-friendliness,
    and flexibility in signal format. The downloaded signal can be in the required
    format for the work, such as Excel, CSV, MAT-file, and so on. The data used in
    this study can be accessed at https://archive.physionet.org/cgi-bin/atm/ATM [38].
    The dataset includes 48 records of 2-channel ambulatory recorded ECG signals taken
    from 47 people between 1975 and 1979, and it has been inspected by the BIH Arrhythmia
    Lab. The signals were recorded with a sampling frequency of 360 Hz, covering a
    range of 10 millivolts with 11-bit resolution.


