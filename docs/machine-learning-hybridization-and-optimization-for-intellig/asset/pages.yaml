    swarm optimization technique along with bee colony and ant colony optimization
    technique, etc., are most widely used for effective analysis. |

    | CA based on data augmentation | Source image lesion is inserted into a target
    image | CT and mammography dataset | Reduce the limitations of limited datasets
    |


    However, in today’s busy world, collecting real-time medical datasets in reality
    is considered exigent as this is one of the major barriers in the medical imaging
    field. Also, recently only a few works [8, 9, 10] have been reported in terms
    of categorizing and identifying rare diseases, with data being scarce, demonstrating
    that automatically annotating such very low and very limited data is more demanding.
    Thus augmenting the mutlilevel transfer learning frameworks for classifying diseases
    and generating medical captions with limited datasets can be explored more in
    the future. The performance augmentation of these frameworks can be done with
    the help of feature extraction algorithms.


    # TABLE 6.2 Summary of Popular Traditional Machine Learning Approaches and Their
    Advantages in Handling Big Datasets


    | Technique | Task | Dataset | Advantages |

    |---|---|---|---|

    | Multilayer perceptron (MLP) technique and principal component analysis (PCA)
    using SVM classifier | Classification of breast cancer | Breast data | Reduce
    the data and extract only the essential characteristics |

    | Texture-based approach and SVM classifier | Find important regions in images
    | Whole slide images (WSIs) | More sophisticated analysis of the tissue structures
    have been done to detect and diagnose breast cancer effectively |

    | Ensemble of decision trees (EDT) and SVM classifier | Classification of breast
    micro-calcifications (MCs) | Breast data | Involves the use of feature extraction
    techniques to optimize the result |


    # TABLE 6.3 Summary of the Most Popular Feature Extraction Algorithms for Handling
    Big Datasets and Their Advantages


    | Technique | Task | Dataset | Advantages |

    |---|---|---|---|

    | Edge detection | Extracting features | Medical images | Extracting edge features
    to enhance processing of medical images |'
