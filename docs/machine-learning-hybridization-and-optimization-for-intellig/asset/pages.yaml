  md: 'Integrating security measures with consumer approval is the start-up industry’s
    biggest problem. Instead of feeling that the system controls them, the user should
    believe that they are in charge of any information that relates to them. To the
    best of our knowledge, this integration creates fresh requirements that have never
    been considered. Security in the IoT refers to the safeguarding of networks and
    linked devices. IoT security guards against “malicious attacks,” “illegal access
    to services,” “theft or alteration of data,” “denial-of-service assaults,” “Internet
    risks,” and “network security.” But the IoT’s capacity to link numerous networked
    autonomous devices and its support for remote communication and management make
    it more probable that malicious attacks will proliferate [26]. IoT devices gather,
    process, and send private information across the network. The user must know what
    private information is being handled, while this data needs to be well protected
    from attackers. New IoT big data trends are reshaping how data is gathered, processed,
    stored, and evaluated. Some of the key themes influencing the IoT big data landscape
    are “edge computing,” “blockchain,” “5G networks,” and “cloud computing.” Businesses
    can get a competitive edge in the IoT market and promote innovation and growth
    by wisely utilizing these trends.


    # 20.5.3 COUNTERMEASURES MITIGATING IOT VULNERABILITIES IN START-UPS


    Designers and developers must recognize that users can be knowledgeable about
    the components of a system to include them in the design process. We examine precautions
    that can be taken well in advance of a cyberattack and what can be done. In contrast,
    a hacking attempt emphasizes the role users can play in safeguarding their privacy
    and reducing their risk. Before using an IoT device, individuals’ characteristics
    should be taken into account to protect their privacy and security. Users’ perceptions
    of their security, their willingness to take proactive steps to secure their data,
    and their level of trust in smart devices should all be considered by designers
    and developers because these aspects will influence how users engage with their
    gadgets.


    The deployment of IoT technology depends on access and permission methods. As
    a result, while creating IoT systems, systems’ access to permitted requests must
    be considered. The effectiveness of authorization'
