    to compute and store the data source at the edge. It provides solutions to significant
    infrastructure issues and challenges such as network congestion, higher latency,
    and bandwidth limitations. EC handles these issues effectively by bringing the
    cloud closer to the users. EC enables the user to perform and execute a task at
    the edge and provides the results as fast as possible. As a result, transmission
    delays and other communication issues are resolved. The benefits of EC are cost-effective
    solutions, faster response time, and reliable operations with intermittent connectivity
