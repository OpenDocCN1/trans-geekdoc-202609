    # 19.5 AREAS OF ML


    In 2014, ML was introduced as a business model to Google and Facebook by ex-AT&T
    researchers. It was first used for customer care in 2015. AI-based social media
    emerged in 2017 and has become very popular. It enables brands to filter, respond,
    and interact with followers on social media platforms. Nowadays, ML is widely
    used in robotics, education, healthcare, and almost every field where it can be
    applied.


    # 19.6 CONCLUSION


    The development and application of artificial intelligence, specifically machine
    learning, have revolutionized various industries and continue to shape the future.
    Since its inception in the early 1950s, machine learning has developed quickly
    and remains one of the most fascinating areas of research. Despite being encouraging,
    the most recent developments in the subject are just the beginning of what will
    be accomplished. Ten years from now we can anticipate the automation in this machine
    learning applications. Since its early 1950s inception, machine learning has come
    a long way in history. Today, it can be utilized for many different things, from
    autonomous driving to face recognition. Machine learning is capable of practically
    anything with the appropriate dataset. In the future, we can anticipate seeing
    even more incredible uses of machine learning as the subject develops.


