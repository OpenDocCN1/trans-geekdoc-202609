- pgno: 3
  md: '# Machine Learning Hybridization and Optimization for Intelligent Applications


    This book discusses state-of-the-art reviews of the existing machine learning
    techniques and algorithms including hybridizations and optimizations. It covers
    applications of machine learning via artificial intelligence (AI) prediction tools,
    discovery of drugs, neuroscience, diagnosis in multiple imaging modalities, pattern
    recognition approaches to functional magnetic resonance imaging, image and speech
    recognition, automatic language translation, medical diagnostic, stock market
    prediction, traffic prediction, and product automation.


    # Features:


    +   - Focuses on hybridization and optimization of machine learning techniques.

    +   - Reviews supervised, unsupervised, and reinforcement learning using case
    study-based applications.

    +   - Covers the latest machine learning applications in as diverse domains as
    the Internet of Things, data science, cloud computing, and distributed and parallel
    computing.

    +   - Explains computing models using real-world examples and dataset-based experiments.

    +   - Includes case study-based explanations and usage for machine learning technologies
    and applications.


    This book is aimed at graduate students and researchers in machine learning, artificial
    intelligence, and electrical engineering.'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# Computational Intelligence Techniques


    Series Editor: Vishal Jain


    The objective of this series is to provide researchers a platform to present state-of-the-art
    innovations, research, and design and implement methodological and algorithmic
    solutions to data processing problems, designing and analyzing evolving trends
    in health informatics and computer-aided diagnosis. This series provides support
    and aid to researchers involved in designing decision support systems that will
    permit societal acceptance of ambient intelligence. The overall goal of this series
    is to present the latest snapshot of ongoing research as well as to shed further
    light on future directions in this space. The series presents novel technical
    studies as well as position and vision papers comprising hypothetical/speculative
    scenarios. The book series seeks to compile all aspects of computational intelligence
    techniques from fundamental principles to current advanced concepts. For this
    series, we invite researchers, academicians, and professionals to contribute,
    expressing their ideas and research in the application of intelligent techniques
    to the field of engineering in handbook, reference, or monograph volumes.


    **Computational Intelligence in Medical Decision-Making and Diagnosis Techniques
    and Applications**

    *Edited by Sitendra Tamrakar, Shruti Bhargava Choubey, and Abhishek Choubey*


