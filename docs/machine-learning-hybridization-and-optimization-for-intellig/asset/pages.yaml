    facing huge losses due to diseases affecting its paddy fields, resulting in poor
    cultivation annually. There are various rice diseases, but only three types of
    diseases, namely, bacterial leaf blight, brown spot, and leaf smut, are dealt
    with here. There are 1,900 images across these three disease classes. The automatic
