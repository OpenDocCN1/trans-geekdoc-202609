    # 14.4 CONCLUSION


    Innovations in technology and the rate at which they are developed never cease
    to astound. One such development is the ability for machines to read handwritten
    numbers on photographs, documents, and the like. This process is known as _handwritten
    digit recognition_. Optical character recognition is the gold standard for recognizing
    text on scanned documents by reading typed or handwritten text. In this investigation,
    a neural network model is used to identify digits written by hand on a digital
    whiteboard. The same could be implemented with audible output for the benefit
    of the deaf, hard of hearing, and physically impaired. We first used the MNIST
