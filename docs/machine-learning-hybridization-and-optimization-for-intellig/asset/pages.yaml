  md: '# 14 A Sequential Deep Learning Model Approach to OCR-Based Handwritten Digit
    Recognition for Physically Impaired People


    S Charan, Sheena Christabel Pravin, G Rohith, V Kiruthika, and T Yaswant


    DOI: 10.1201/9781003465775-14


    # 14.1 INTRODUCTION


    Precision in medical diagnostics and technology has evolved into the norm rather
    than the exception. Handwritten digit recognition, which is the ability of a machine
    to discern human handwritten digits with superlative precision and classify them
    into 10 digits, viz. 0–9, may be brought in on this statement [1]. Because it
    has the potential to affect and reduce the amount of time spent on mathematical
    computations in financial institutions and other private businesses, this problem
    is a significant field of research in deep learning (DL) and computer vision [2].
    Additionally, it finds widespread use in the fields of historical document preservation
    and library automation of archival materials. As numerical computations comprise
    the backbone of practically every practical application, the advantages grow even
    larger. As the incorporation of voice commands simplifies the study of mathematical
    applications in online classrooms, this benefit is extended to the deaf-mute.
    Optical character recognition (OCR) is the state-of-the-art method for deciphering
    printed or handwritten text from digital photographs of actual documents [3].
    The optical character recognition (OCR) system is a combination of computer hardware
    and software that takes a document and converts it into text that a computer can
    understand. Advanced'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'processing is often handled by software, while the hardware is utilized for
    tasks like making copies of the text and reading it using an optical scanner or
    specialized circuit board. Artificial intelligence (AI) may be programmed into
    software to improve intelligent character recognition (ICR) methods [4] like language
    or handwriting recognition. The elimination of paperwork and the use of digital
    techniques for authorizing and processing transactions are both made possible
    by the incorporation of this feature with real-time recognition.


    # 14.1.1 Related Works


    To develop a system for recognizing digits written by hand, deep learning networks
    are used. The CNN classifier’s superiority over neural networks was discussed
    at length in [5]. This was accomplished with much enhanced computational efficacy
    and unrelenting execution, trained on the MNIST dataset, which includes over 70,000
    handwritten picture examples. Furthermore, there are libraries like NumPy, Pandas,
    TensorFlow, and Keras. Importing photographs, adjusting their size and color,
    creating a visual representation of the data, and then translating the categories
    into numbers are all part of the preprocessing phase. In order to obtain the image’s
    input characteristics, a simple activation function was used in the convolution
    layer. Finally, the written digit was viewed and predicted by the CNN model. Machine
    learning for recognizing handwritten digits was demonstrated in [6]. It was decided
    to adopt a six-step process, the first of which was picture capture. The pictures
    in this case were derived using a training dataset that included the document’s
    scanned form. In the second phase, preprocessing techniques take center stage;
    here, we primarily focused on noise reduction and also performed skew correction,
    normalization, and binarization. The next phase is segmentation, which involves
    breaking the entity down into smaller, more manageable pieces. The requested work
    was resolved for segmentation using projection approaches, both vertically and
    horizontally. Then, the support vector machine (SVM) technique was used for classifying
    data, and the convex hull approach was used to extract features. Finally, post-processing
    comes into play when improved accuracy is achieved via the use of various methods.
    In the literature [7], the different approaches to handwritten'
  merge: -1
  img_proc: true
