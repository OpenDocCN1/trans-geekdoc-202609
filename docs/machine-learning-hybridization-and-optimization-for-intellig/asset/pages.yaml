    # 15.2 PROPOSED WORK


    Problem statement: The preceding studies [15, 16, 17, 18] have shown, among other
    things, that methods that depend their accuracy on the user’s behavior are worse
    when it comes to recognizing signs in a language other than English. This is due
    to the high cost and complexity of the necessary hardware installations [15].
    For this reason, most studies have focused on vision-based models. The creation
    of sign language recognition models is evidently still a challenging subject of
    research, despite the many studies that have been undertaken in this area.


    In order to solve continuous sign issues that are independent of the signer, an
    appropriate model has to be developed [16]. Since each signer’s duration, pace,
    and context will be unique, it is difficult to create a model that is both highly
    accurate and consistent among all models [17]. Several academics have made suggestions
    on where CNN-related model research could go next. The dependency of models with
    regard to the optimization of tuning parameters adds another layer of difficulty
    to the task of selecting the most appropriate model to adopt and enhance [18].
    The preceding analysis of the literature shows that most of the existing CNN models
    have been created for various sign languages, including those used in India, the
    Middle East, and China. However, advancements in British sign language detection
    using the CNN and LSTM models have received little attention. No research has
    compared the accuracy of LSTM and CNN models when used to recognize British sign
    language. As a result, there is a pressing need for research into improving future
    models’ accuracy by regulating the'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'relevant parameters and establishing a trustworthy assessment technique for
    selecting the best model. Therefore, the goal of this study is to create a system
    for recognizing British sign language that employs CNN and LSTM while simultaneously
    maximizing accuracy by fine-tuning the relevant parameters. However, an issue
    arises when two people who speak different languages cannot communicate with one
    another without the physical assistance of a translator, which may not always
    be convenient to arrange while using LSTM. A similar issue also arises when a
    normal person and a person who is deaf or speech impaired interact with one another.
    The proposed model makes use of deep learning to create a low-priced sign language
    recognition system. The system is implemented in Python using the OpenCV and Keras
    libraries. The project evolved via three distinct stages as follows.


    # 15.2.1 PREPARATION OF A DATASET WITH EXISTING STATE-OF-THE-ART DATA


    The dataset is produced using the video camera’s live feed. Every frame that recognizes
    a hand in the defined region of interest (ROI) will be saved in a directory called
    “gesture directory,” which has two folders called “train” and “test,” each of
    which has 10 folders for the numbers 1–10 containing pictures taken with the create_gesture_data.py.
    The live cam feed is taken using OpenCV, and an ROI is created.


    The background and foreground (ROI) are differentiated. The threshold values are
    calculated for every frame, and contours (for converting the image obtained to
    black and white such that the background is black and the objects detected in
    ROI are white) are determined by which we can know if there is any foreground
    object being detected in ROI (i.e., a hand).


    Inspired by [21] and [22], who have presented the novel histogram equalization
    techniques, we impart adaptive histogram equalization which tries to predict the
    actual range of bins and try to exhaustively utilize the range between 0 and 255.
    Histogram equalization is performed by converting the image into HSV color space,
    and the algorithm is applied to luminous without changing the hue and saturation
    values of the image. The new intensity values try to expand the number of regions
    and the dynamic range, which helps to highlight the sign language more clearly
    and looks'
