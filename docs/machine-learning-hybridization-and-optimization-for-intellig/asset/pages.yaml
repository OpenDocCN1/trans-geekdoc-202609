    # ## 9.6 CONCLUSION


    In this work, an efficient and accurate method for the automatic classification
    of arrhythmia is obtained by using PNN and KNN classifiers. The initial steps,
    such as preprocessing and feature extraction, are discussed in detail. The advantage
    of using PNN classification is proven by the performance metric graph. By achieving
    higher accuracy, sensitivity, and specificity values, the PNN classification method
    is the best among the other existing methods of classification. The combinational
    effect of the PNN network’s computational capability and flexible nature plays
    an important role in achieving better performance in classification. The arrhythmia
    prediction accuracy of PNN can be further improved by increasing the combination
    of classifiers.


