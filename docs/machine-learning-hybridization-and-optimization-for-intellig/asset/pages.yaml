    # 5.1 INTRODUCTION


    The lists of pending cases are huge in number in Indian courts, out of which some
    have remained pending for more than decades. These pending cases will affect the
    efficiency of courts and will ultimately slow down the process of giving justice.
    The study of National Judicial Data Grid (NJDG) results shows 3,89,41,148 district
    level cases, and 58,43,113 Taluk level cases are still pending. These pending
    cases reduce people''s access to justice and are not handled effectively. The
    delay in our justice delivery system may give enough time for the perpetrators
    to erase all evidences because of its slow process of analyzing cases.


    Fortunately, the foremost top courts have already started using e-filing, and
    most court proceedings are conducted through online video conferencing. Artificial
    intelligence (AI) and newer technologies like transfer learning can now help in
    reducing the number of pending cases significantly. Therefore proposing any innovative
    approach towards digitization of law processes will facilitate the speeding up
    of the justice delivery process. Therefore it is understood that AI will impact
    the coming two or three decades and will influence the Indian judiciary, which
    has a largely unstructured dataset. The usage of such technologies in various
    facets of its implementation will benefit the Indian judicial system. This'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'automation process will help higher grade officials to focus on only important
    responsibilities and the timely delivery of justice. Similarly, the accuracy of
    legal research can also be enhanced. Along with this, case hearings, several administrative
    obligations, official communications, organizing trials at top courts, and planning
    can be managed flexibly and fully automated with the help of Artificial General
    Intelligence (AGI). The foremost objective of AGI, ML, and deep learning technology
    is to reduce the workload of lawyers and high court judges in documenting, managing,
    and researching cases easily.


    Further, as generating legal documents is a time-intensive process and takes a
    lot of effort on the part of experts, AGI models combined with transfer learning
    are being used to automate document generation and processing. Leveraging such
    technologies in the Indian judiciary will reduce dependence on humans and will
    minimize the wrong information being given as input. Considering the current state
    of affairs, the Indian judiciary undoubtedly will benefit from smart contracts
    that are automatically created using technology. This can be viewed as a unique
    way to reduce the burden and administrative load in courts and to avoid disputes.


    In fact, lengthy adjournments happen in India due to conflicting hearings, which
    means that lawyers cannot be physically present in courtrooms due to a lack of
    time. Therefore enabling hybrid courtrooms offline as well as online could be
    a solution for conflict hearing matters. This will enable justice to be delivered
    earlier without any further delay due to the absence of lawyers. Referencing law
    is considered essential for winning a case. For lawyers, gaining a victory in
    a case requires considerable effort. Normally, lawyers research plenty of materials
    to confer and argue about their case. Competent case handling will eventually
    result in an increase in budget that is, income will benefit and along with this
    will come fame and reputation for lawyers. Therefore, there is an immediate and
    demanding need to adopt ML and AI with deep learning techniques like transfer
    learning to augment the competence of the delivery of justice in India.


    However, at present, no clear guidelines or instructions are available online,
    in the form of an application, that can be used to control or effectively manage
    justice. Usually, professionals will refer to another country’s experiences, analyze
    them, and then adapt the best practices for'
