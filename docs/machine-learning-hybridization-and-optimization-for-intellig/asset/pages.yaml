  md: '# # 8 Security Breaches in IoT Applications: An Extensive Study


    C Silpa, Niranjana Govindan, and K Ramani


    DOI: 10.1201/9781003465775-8


    # ## 8.1 INTRODUCTION


    IoT security is one of the best firewalls for the increase in devices that are
    connected to a network. Devices like laptops perform a wide variety of tasks,
    such as transmitting data to other devices. The purpose of IoT devices is to establish
    protocols to secure the devices while sharing information. As a result, IoT devices
    can develop recognizable and unique patterns for the behavior of those devices.
    These IoT devices utilize artificial intelligence and machine learning techniques
    to create distinctive and identifiable patterns for such devices. Once these patterns
    are established, IoT can establish a baseline between the devices and the network
    and monitor and detect attacks on the devices. After monitoring such attacks,
    devices can send alert notifications to the administrator through communication
    formats such as SMS or device notifications, and these steps are automated by
    the system [1]. Upon receiving the alert message from the system, the administrator
    can also receive a sequence of steps to secure the device from those breaches
    or attacks. Identifiable and unique patterns can be used to reallocate the devices
    to resume their tasks normally after securing the devices from the attacks. These
    patterns also serve a crucial function in establishing a firewall between the
    devices during information sharing or when attacks occur.


    Nowadays, most real-time devices use IoT-based devices, as shown in Figure 8.1
    which depicts the applications of IoT that we discuss in this chapter. In this
    chapter, we have selected some applications to illustrate IoT security and how
    they are used in defense systems, the finance sector, the'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'banking sector, and home networks. IoT security is implemented in defense systems
    like drones and other devices to maintain secure data sharing. The finance sector
    relies on IoT systems to prevent cyberattacks. In the banking sector, IoT systems
    are used to secure transactions between accounts and protect account information.
    Home appliances such as refrigerators, CCTV cameras, and televisions can also
    benefit from IoT systems for enhanced security.


    ![](img/8c9c25929b8bfe55c61ba059d5462e42_211_0.png)


