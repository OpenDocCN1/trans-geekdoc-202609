    # 3.2.2 THE SPREAD


    The reason for the spread of COVID-19 across the globe was at the time the virus
    was first discovered, around December; a lot of people from various parts of the
    globe came to China to welcome and celebrate the new year, which is why Wuhan
    became a hotspot for the disease. The disease spread among people and, when they
    flew back home, they became one of the initial cases, which in turn created new
    hotspots in those countries.


    # 3.2.2.1 China


    As we mentioned previously, the outbreak of the novel coronavirus was reported
    on 19 December 2019 at a seafood market in Wuhan, and the first death was reported
    on 11 January 2020; by this time, cases were being reported across China and one
    or two cases across the globe. China managed to control the virus the fastest
    and also most effectively because of the strict restrictions in lockdown, which
    other countries weren’t able to follow.


    # 3.2.2.2 USA


    The first case from the USA was registered on 21 January and was found to have
    travelled to China; this led to the further spread of COVID-19 across the country,
    making total number of cases in the USA one of the fastest growing and causing
    several deaths. By the end of July, the USA was at the top in the total number
    of confirmed cases, and various protests took place during the pandemic, causing
    an increase in the case count.


