    # 10.4 IMAGE CLASSIFICATION


    The classification process is used to identify different features of the earth’s
    surface, since they each have different remittance qualities and spectral reflectance.
    Each pixel in an image or the raw data from remotely sensed satellites is classified
    through the image classification process to be assigned to one of the LULC classes.
    The image classification procedure includes the following:


    +   1. Classification procedures for design images: These are typically informational
    categories like urban, agricultural, and'
  merge: -1
  img_proc: true
- pgno: 271
  md: '+   forest regions, among others. These gather ground data, ancillary data,
    and other information about the study area through field surveys.

    +   2. Image enhancement, original image clustering, and radiometric, atmospheric,
    geometric, and topographic adjustments are all included in the image’s preprocessing.

    +   3. Using representative regions of the image to develop training signatures
    or analyze the results of the initial clustering.

    +   4. Running the image categorization algorithms.

    +   5. Completing geometric rectification, filtering, and categorization decorating
    in post-processing.

    +   6. Comparison of classification findings with field studies for accuracy evaluation.


    # 10.5 IMAGE CLASSIFICATION TECHNIQUES


    It is common practice to create land cover maps using a variety of classification
    techniques that have been established. Hard and soft (fuzzy) classification; per-pixel,
    sub-pixel, and pre-field learning; as well as parametric, nonparametric, and nonmetric
    classification are all part of the categories’ underlying logic, as shown in Table
    10.2.


