    # ## 3.2.3 Literature Survey


    The section presents a literature survey of various literatures which researched
    COVID-19; most of them would be new, as the problem of COVID-19 itself was new,
    but the ideas or models used in the literature might be the ones that can frequently
    be used. We take a few models which have been used in these chapters to explore
    the possibility of forecasting COVID-19 cases in India and do an elaborate comparison
    of the models that have been used.


    Furquan et al. [6] analyzed how various ML models were used to predict the future
    number of cases that might occur due to COVID-19; in particular, they used models
    like linear regression, least absolute shrinkage and selection operator (LASSO),
    support vector machines (SVM), and exponential smoothing. The results were obtained
    by comparing the performance of the models in the prediction of upcoming infected
    cases, deaths, and patient recovery rates for the upcoming 10 days. Out of all
    the models, exponential smoothing performed the best in prediction followed by
    linear regression and LASSO regression, with SVM performing poorly in all the
    scenarios.'
