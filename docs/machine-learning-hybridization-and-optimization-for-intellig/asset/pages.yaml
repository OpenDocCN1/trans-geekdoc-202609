    Our findings were that for the task of classification of images into normal or
    pneumonia, a CNN-based deep learning model is ideal. This concept can be extended
    to other use cases in the healthcare industry such as for cataract detection in
    eye disorders. We found out that applying the following preprocessing techniques
    yielded good results: rescaling, width shift, height shift, shearing, zooming,
    horizontal flipping, and rotation.


    Future work includes experimenting with other deep learning models such as VGG19,
    ResNet50, and InceptionV3 and checking if they provide better performance for
    the task at hand. A continuous learning approach can be applied to constantly
    improve the model with every input. This will help increase the accuracy of the
    model over time and help correct wrongly learned features using reinforcement
    learning. An approach of ensemble learning can also be applied where multiple
    models are applied to the image, and the results are combined using an aggregation
    method, such as majority voting, to finally classify the image. This can help
    counter overfitting and missing corner cases but is a computationally expensive
    approach.


