  md: 'This module deals with the aggregation of chest X-ray images, from various
    patients. This stage requires both pneumonia and normal chest X-ray images. These
    images are obtained from “Guangzhou Women and Children’s Medical Center, Guangzhou”,
    collection of chest X-ray images, available on Kaggle for research and experimentation.


    # 13.4.2 PREPROCESSING THE IMAGES


    Preprocessing of images is an important stage in every image-based work. It encompasses
    various processes ranging from image resizing to changing of color dimensions
    to horizontal and vertical flipping. These processes are done to make the image
    a better fit for our model in terms of expected dimensions as well as for feature
    extraction processes. For our work, the images are rotated, color balanced, resized,
    shifted, and cropped based on a trial-and-error basis, until we find that the
    best possible results are obtained for the set of preprocessing operations done
    on the images.


    # 13.4.3 TRAINING OF THE VGG16 DEEP LEARNING MODEL


    Training the model in the case of a classification problem is the process wherein
    the inputs whose labels we are aware of are given as input to the model for it
    to learn the features and train its weights accordingly. Doing so will allow it
    to classify the input images whose labels we are trying to obtain. In this module,
    the preprocessed training images of the chest X-rays are fed to the VGG16 model,
    and the training process is carried out in this module. After obtaining the trained
    model, we test the model and obtain its accuracy.


    # 13.4.4 PREPARING USER INTERFACES FOR THE MODEL


    User interfaces (UIs) are implemented to allow for the abstraction of the functionality
    of a system, for ease of access and usability. For our system, a UI is built using
    HTML, and a FastAPI server is set up to allow the frontend UI to communicate with
    the model. The UI will allow for selecting images easily and clear representation
    of the output of the model.


    # 13.4.5 DEPLOYING ON DOCKER'
