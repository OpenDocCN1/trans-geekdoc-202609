  md: '# # 19 History of Machine Learning


    Deepak K. Sinha and Garima Sinha


    DOI: 10.1201/9781003465775-19


    # ## 19.1 INTRODUCTION


    Artificial intelligence and machine learning are the demand of this era, and they
    have left very few applications untouched; otherwise, most of the domains are
    applying ML for prediction of the results very precisely and accurately without
    the interference of human skills, experience or even interference [1, 2, 3, 4].


    Although ML is in huge demand nowadays, this field gradually seasoned since the
    early 1950s with the development of the Turing test somewhere in the 1950s by
    Alan Turing. ML is considered to be part of computer science, but if we look at
    the history of its development, we may find evidence that in its early days, mathematicians
    and learning algorithm developers had contributed a lot to its present stage [5,
    6, 7, 8, 9].


    # ## 19.2 ML IN EARLY YEARS


    We can find historical evidence of the development of ML in the early 1950s with
    the Turing test and Turing machine by Alan Turing. The first goal of the Turing
    machine was to develop a model that can compute anything that a human can compute.
    Before the invention of electronic computers, the term "computer" actually referred
    to a person whose line of work is to calculate numerical quantities! The second
    goal of the Turing machine was to develop a model that is so simple that it can
    actually prove interesting epistemological results, and finally, it was developed
    as the Turing machine in 1950. This can be considered as the first step towards
    the development of ML models [10, 11, 12, 13, 14].'
  merge: -1
  img_proc: true
- pgno: 430
  md: 'The second significant contribution to ML came from Arthur Samuel, who developed
    the first game of checkers and implemented machine learning for the first time
    while developing checkers [15, 16]. The learning algorithm of the game of checkers
    was used to find the moves responsible for the winning strategies, and subsequently,
    the computer improved the game by determining those strategies and incorporating
    them into the game, which was developed in 1952 [17, 18].


    Later, Frank Rosenblatt worked on simulating human neurons for the thought process
    of the human brain and designed neural networks for the first time in 1957. This
    was a breakthrough in the field of ML and made many things easier and possible,
    especially in deep learning, image processing, NLP, sequence learning, and other
    applications.


    In 1974, backpropagation was introduced to aid neural networks in learning to
    recognize patterns. It has also been used in various machine learning applications,
    such as performance optimization and generalizing from datasets to new instances.
    Backpropagation aims to increase a model''s accuracy by adjusting its weights
    to predict future outputs more accurately.The nearest neighbor algorithm was written
    in 1967 and was initially used for recognizing similar patterns and later used
    to find paths for the traveling salesman problem. Nowadays, it is widely used
    for classification problems using KNN.'
  merge: -1
  img_proc: true
