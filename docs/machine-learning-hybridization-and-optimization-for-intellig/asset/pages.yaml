    Undoubtedly AI/ML technology plays a major role in aiding lawyers and judges to
    make innovative decisions. But, in the near future, increased use of AI technologies
    will however pay the way for active lawyering. Though traditional algorithms are
    already good for case management and diligence, AI-based intelligent tools like
    Kiara and Luminous are considered far better. But these elementary tools are in
    turn requiring several years to mature as reliable technologies in operation.


    While the existing projects are just an initiative taken to increase the transparency
    and accountability of court systems, there is no assurance that this can represent
    a solution to the problem of holding cases in the justice delivery system. This
    needs to be supported by a consistent, solid approach by providing timely appointments
    for judgments and successfully aiding in setting up the ICT basic infrastructure
    in courts. Initiating the development of an innovative digital infrastructure
    for the Indian judicial system is a commendable step, owing to its pivotal role
    in. More and more advanced technologies should be brought in to reduce the burden
    on courts. Many new and efficient tools can be introduced to prioritize certain
    digital'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'platforms like digital registries for cases and repositories for storing law
    documents, and creating templates of judgments for judicial purposes would eventually
    save significant processing time and promote swift delivery.


    However, there is no guarantee that no challenges will arise in terms of the implementation
    of these technologies in the real world. The implementation of an all-in-one infrastructure
    for use in courts is a challenging task. The reason for this is that there would
    be a relatively limited level of understanding about the promising technologies,
    and obviously very poor ground-level training is given in such lower courts. Another
    critical concern that may emerge while establishing digital frameworks is that
    there is no robust protection law in India to safeguard data. This may cause several
    privacy concerns, especially when collecting and processing datasets. However,
    integrating AI into the Indian judiciary requires a wide-ranging framework that
    adopts legal, ethical, and regulatory issues. Therefore the proposed AI based
    all-in-one transfer learning framework helps in delivering justice, avoids decisions
    being biased in multiple cases, translates contracts, and analyzes different cases
    effectively.


    Features and attributes are often missing from law documents. This is due to the
    fact that there is no uniform format for processing the dataset. Due to the data
    imbalance problem and due to infrequent law usage, prediction of such laws is
    often considered tricky using traditional machine learning algorithms. Transfer
    learning can be used in situations where there is a scarcity of data and missing
    values. By transferring the learned knowledge from numerous frequent cases to
    rare ones, the proposed work undoubtedly saves a lot of time for legal advisors
    by automatically increasing the understanding level of law articles for cases
    that they seldom deal with. The proposed work is expected to outperform most of
    the existing state-of-the-art few-shot prediction techniques.


    In the legal domain, it is most significant to distinguish words that are used
    in general and then link these word occurrences with the same identical entities.
    This technique is called named-entity linking (NEL). Initially the proposed model
    can be trained on publicly available datasets. However, the main focus is especially
    on the facet of applying transfer learning techniques to the final target domain
    that suffers from an insufficient dataset. This framework is suitable enough for
    implementing'
