    # 2.2 LITERATURE REVIEW ON DECISION-MAKING FOR UAVS


    There are various algorithms for decision-making for UAVs, which help to increase
    the efficiency of the system. While choosing an algorithm, we need to keep in
    mind the environment and other parameters, as different algorithms perform differently
    in different scenarios.


    # 2.2.1 CENTRALIZED DECISION-MAKING (CD)


    The centralized decision-making approach uses various methods to centrally decide
    and plan the paths for the UAVs. No information related to the environment is
    used here. Authors in [4] have proposed a CD approach for optimizing the routes
    and depicting exposures in the case of two robots hunting for a moving point.
    The terrain is modeled through streamlining of the graphs where the vertices symbolize
    the waypoints of the UAVs while the edges represent the connection among the waypoints.
    Retreating-horizon optimization is used to decide the routes in such a way as
    to reduce the time needed to search for a target. Daniel et al. in [5] have examined
    the centralized mobility algorithms in the case of multiple robots covering a
    given region. They also avoided spare compliances of similar regions. However,
    their work does not discuss tasks related to information-gathering. Rather, it
    concentrates on channel-apprehensive mobility.


    # 2.2.2 DISTRIBUTED DECISION-MAKING


    The distributed decision-making (DD) approach uses various technologies to distribute
    the decision-making process to plan the routes of UAVs. Information related to
    the area of search of the targets is not used. In [6, 7, 8], the authors proposed
    a distributive collaboration of some decision-making algorithms for UAVs which
    do not require a hunt chart. The authors induced excellent results for temporal
    and spatial information about the hunt region. In [6, 8], the authors put forward
    several configurations for'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'UAVs which are connected by a network in order to completely explore an assigned
    region for previously unknown locales of targets. Their algorithm primarily focuses
    on adding or reducing the required number of robots for exploring the area. However,
    the authors do not concentrate on the process of modeling the detector crimes
    for participating in the information related to the search area. A force vector,
    which in turn helps in guiding the robots in the proper routes, is induced by
    the UAVs. This algorithm also ensures that the UAVs do not collide with each other
    and at the same time maximizes the area of terrain for the successful discovery
    of the target. However, since there is less global information, their algorithm
    sometimes suffers from information redundancy.


    # ## 2.2.3 CENTRALIZED INFORMATION MERGING AND CENTRALIZED DECISION-MAKING (CIMCD)


    In [9], the authors proposed an algorithm in which a central base station accounts
    for coupling the data and deciding the path for a group of homogeneous UAVs. In
    this case, each UAV collects some information during its flight. The UAVs are
    unfit for communicating the information with other UAVs or the ground station
    during their flight. After the robots reach the base station, the collected data
    is shared with the base station. The robots also receive information from the
    base station at this moment. Hence, the base station is responsible for merging
    the partial and delayed data from the various UAVs with the help of a consolidated
    hunt chart. The base station is also responsible for assigning new paths as per
    the K-shortest path algorithm [10]. This process is repeated again and again unless
    the query in the region to be explored has dropped below a certain level. In [11],
    Lum et al. use various robots with varied abilities to explore a particular terrain
    and search for the position of various fixed targets. It is assumed that there
    is perfect communication among the UAVs and the ground station during their flight.
    Hence, the complexity of information lagging is avoided. The base station combines
    the information from all the UAVs and stores it in a residency-grounded hunt chart.
    It generates immediate routes for all the robots which restrict them to different
    Voronoi partitions [12]. The system guarantees a total hunt of the terrain. In
    [12] Mirzaei et al. put forward an analogous approach that discusses a'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'centralized assignment of miscellaneous UAVs to different Voronoi partitions.
    This approach uses a restricted look-ahead dynamic programming method to decide
    the best path for robots in order to maximize the amount of information collected
    by a group of UAVs. In this approach, two types of UAVs are used. The first type
    of UAVs spread over the terrain in order to cover the terrain in an optimal manner.
    The second type of UAV modifies its configuration iteratively. This process ameliorates
    the delicacy of the collaborative hunt.


    # 2.2.4 CENTRALIZED INFORMATION MERGING AND DISTRIBUTED DECISION-MAKING (CIMDD)


    In a multi-UAV collaborative hunt, the majority of the research depends upon consolidated
    hunt maps for the incorporation of data and distributed DM for the robots [13,
    14]. The UAVs can piece together centrally stored information which comprises
    data related to the terrain and other UAVs. Depending on the availability of the
    centrally stored information, the UAVs are capable of planning the paths in a
    distributed manner. The algorithms in this domain incorporate artificial implicit
    fields [15], machine learning (ML) algorithms [16], group dissipation patterns
    [15], mixed integer direct programming [18], and evolutionary algorithms [19]
    as collaboration procedures in order to minimize the implicit imbrications in
    the routes of UAVs. In these methods, it is concluded that the reduction of imbrications
    in the path of UAVs can ameliorate the effectiveness of collaborative hunting.
    No sophisticated information is required in these approaches. They only need a
    system for modernizing the centrally stored information grounded on their detector
    compliances and previous information. Their approaches model either a perfect
    detector which does not have any discovery crimes [17] or a detector that only
    has mis-findings. In these approaches, it is assumed that there is no noise during
    the process of communication between the base station and the robots.


    # 2.2.5 DISTRIBUTED INFORMATION MERGING AND CENTRALIZED DECISION-MAKING (DIMCD)'
  merge: -1
  img_proc: true
