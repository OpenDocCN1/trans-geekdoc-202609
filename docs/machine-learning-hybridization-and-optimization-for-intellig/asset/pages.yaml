    # ## 5.4 EXPERIMENTS


    # ### 5.4.1 DATASET


    In the framework, the initial source domain model is validated on the basis of
    25,000 ImageNet dataset images [34]. The proposed BLTL framework’s first source
    domain network is useful for extracting substantial features, and it is given
    as one of the key inputs to the LSTM model. In this chapter, only source domain
    details are reported, whereas in the future the target domain along with LSTM
    model dataset details will be reported as implementation is going on for judicial
    and law-related image and text datasets.


