    the size. A computer at the edge of a network and the hardware and software at
    that location is called an edge. Cloud computing is when work is done in the cloud,
    while edge computing is done on devices close to the cloud. Edge computing can
    be used for anything that involves putting services, data, and intelligence closer
    to users and devices. As the edge-cloud scenario has grown, scheduling problems
    have received more attention. In the next section, we look at different issues
    with scheduling when edge clouds work together.


    # 1.2 SCHEDULING


    Scheduling is critical for assigning tasks in a virtual world, whether in cloud,
    edge, or fog computing or any mobile computing environment. The performance of
    the virtual machine server degrades if tasks are not correctly scheduled. According
    to [3, 4], the scheduler’s main aim is to allocate appropriate methods to optimize
    available resources to meet one or more objectives. An excellent job scheduler
    should be able to connect scheduling methods within a dynamically changing environment
    and different types of tasks. In the current scenario, optimizing resource problems
    is indeed a challenging task characterized by non-linear trends and dynamic, complex
    multi-objectives. There are three layers to cloud computing: 1) virtual resources
    for end users, 2) physical resource allocation to virtual machines by the scheduler,
    and 3) physical resource maintenance. The scheduling technique for each layer
    may differ depending on the type of computation complexity. As a result, scheduling
    in a cloud environment is always treated as extremely complex and is classified
    as a nondeterministic polynomial'
  merge: -1
