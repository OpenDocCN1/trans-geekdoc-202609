    federated learning, matching theory, and blockchain auction. As per [6, 7], the
    batch mode heuristics algorithm (BMHA), online mode heuristics algorithm (OMHA),
    and dependency mode heuristics algorithm (DMHA) are cloud and edge scheduling
    algorithms. When tasks appear in a system, the BMHA creates a queue and collects
    them into a set, and the program begins after a certain amount of time. Some examples
    are first-come-first-served (FCFC), round robin (RR), shortest job first scheduling
