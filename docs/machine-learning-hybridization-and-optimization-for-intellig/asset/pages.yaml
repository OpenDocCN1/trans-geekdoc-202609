    To determine the outcomes, the accuracy of any categorization process must be
    quantitatively assessed. The term accuracy in RS data analysis refers to the degree
    of classification correctness. The term error in classification refers to a difference
    that has been noticed between the scenarios depicted in a thematic map of the
    real world. A region on a map is compared to reference data (ground truth) for
    the same area as part of the accuracy assessment. The reference statistics are
    assumed to be accurate. Test data and verify data are other names for the reference
    data. Without evaluating the classified image’s accuracy to determine how well
    the algorithm worked, image classification cannot be considered complete.


    The overall classification accuracy (OCA) and the kappa statistics produced from
    the error matrix are the two most frequently used traditional accuracy metrics.
    The accuracy research also considers each class’s correctness, which is determined
    by combining the accuracy of the producer and the accuracy of the user. Additionally,
    statistical research is done for classes and layers. The mean and standard deviations
    are taken into consideration for statistical research. The information that is
    being classified is from the region around the Udupi district. Following classification,
    an error matrix is produced that provides information about the classification
    results.


    Since qualitative (visual) analysis is unable to pinpoint the picture with the
    highest degree of classification accuracy, an accuracy evaluation must be done.
    The image processing program ERDAS IMAGINE v9.1 RS was used to evaluate accuracy.
    The evaluation of classification accuracy produced the overall classification
    accuracy and kappa statistics for each set of data using a number of points (validation
    points) on the image of the classified data. Both the overall classification accuracy
    and the kappa value'
