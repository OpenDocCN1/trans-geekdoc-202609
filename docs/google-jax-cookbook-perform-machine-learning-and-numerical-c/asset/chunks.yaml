    ## 摘要

    总体而言，我们通过在 `JAX` 中研究和集成外部函数，成功增强了机器学习模型的灵活性和性能。首先，我们成功解决了从 `JAX` 调用外部 `C` 库的挑战。我们能够封装
    `C` 函数并将其作为自定义原语集成。这使我们能够在 `JAX` 的计算图中利用优化的 `C` 代码，扩展了模型的能力。接下来，我们通过编写自定义 `CUDA`
    内核来优化性能，从而能够更高效地在 GPU 上执行特定操作。我们定义了自定义原语，编译了 `CUDA` 代码，并确保与 `JAX` 的 `JIT` 编译和自动微分机制无缝集成。

    我们还将处理 `JAX` 与外部代码之间的数据转换作为重点。为此，我们实现了稳健的例程来管理数据类型、内存布局和数组维度方面的差异。这保证了兼容性，并在与外部函数交互期间保持数据完整性。我们还使用同步机制和最佳实践解决了线程安全和并发问题，消除了竞态条件并保证了多线程环境中计算的可靠性。最后，我们探索了在异构系统之间分发计算，利用
    `FFI` 将任务卸载到 `FPGAs` 和 `ASICs` 等专用硬件。这种集成不仅优化了性能，还展示了模型在多样化硬件平台上的可扩展性。总体而言，本章为我们提供了有效将外部代码与
    `JAX` 集成的必要策略和技术知识，显著增强了机器学习项目的功能性和效率。


    # 第 8 章：使用 `JAX` 训练神经网络


    ## 概述

    在本章中，我们将掌握训练神经网络的艺术，包括构建和有效优化模型的实用技术。我们首先学习如何使用 `TensorFlow Datasets` 高效地加载数据，这使得大规模机器学习任务的数据准备变得简单。这种简单而有效的配方确保数据顺利输入训练管道，实现更快、更高效的训练。

    接下来，我们将使用 `JAX` 从头构建神经网络。你将学习设计和实现针对特定任务定制的自定义架构。然后，我们将在训练期间使用 `Penzai` 进行实验跟踪。该工具通过跟踪指标、超参数和结果来管理实验。它使评估模型性能变得更容易。最后，我们将介绍评估和可视化模型性能的技术。你将深入了解模型准确性和训练动态。你还将学习如何改进和调试模型。

    '
