- raw: '  Measuring Execution Time of JAX Functions    In the previous chapters, various
    JAX codes were developed to train a neural network on the Fashion-MNIST dataset.
    While JAX offers significant performance improvements over NumPy through just-in-time
    compilation and automatic differentiation, certain parts of the code may still
    contain bottlenecks that hinder optimal performance. Identifying these bottlenecks
    is crucial for optimizing the code to achieve faster execution times and more
    efficient resource utilization. The challenge lies in systematically measuring
    the execution time of JAX functions and pinpointing the sections of the code that
    require optimization.    To identify and optimize performance bottlenecks in JAX
    code, it is essential to utilize profiling tools that measure execution time and
    analyze computational efficiency. JAX provides built-in functions for timing,
    and Python offers profiling libraries such as and line\_profiler that can be employed
    to gather detailed performance metrics. By applying these tools to the neural
    network code developed previously, insights can be obtained regarding which functions
    or operations are consuming the greatest time and resources. This information
    allows for the implementation of targeted optimization efforts, which can enhance
    overall performance.    Identifying Functions to Profile    It is recommended
    to begin by reviewing the neural network code from the previously discussed recipes,
    with a particular focus on the key functions involved in training:    forward\_pass(params,
    Computes the model''s predictions.  compute\_loss(params, x, Calculates the loss
    between predictions and true labels.  update(params, x, Updates model parameters
    using gradients.    These above functions are critical to the training loop and
    are prime candidates for profiling to assess their execution times.    Using JAX''s
    Built-in Timing Function    There is a simple way to measure the execution time
    of a function using However, a more straightforward approach is to use Python''s
    time module for initial timing measurements.      import time    \# Timing the
    forward\_pass function    start\_time \= time.time()    y\_pred \= forward\_pass(params,
    x\_batch)    end\_time \= time.time()    print(f"Execution time of forward\_pass:
    {end\_time \- start\_time} seconds")      This above method provides a basic understanding
    of how long the forward\_pass function takes to execute with a given batch of
    data.    Profiling with ‘timeit’ and ‘cProfile’    The timeit module offers more
