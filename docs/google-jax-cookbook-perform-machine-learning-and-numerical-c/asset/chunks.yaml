- raw: '  Managing Random Number Generation    In NumPy, randomness is managed through
    a global random state, which can lead to non-deterministic behavior if not handled
    carefully. Google JAX, however, adopts a different approach to random number generation,
    emphasizing functional purity and explicit state management. This difference can
    create uncertainty for those transitioning from NumPy, making it challenging to
    generate reproducible results. The task is to understand JAX''s method of handling
    randomness using PRNG (Pseudo-Random Number Generator) keys and to learn how to
    use these keys effectively to ensure consistent and reproducible outcomes in experiments
    involving the Fashion-MNIST dataset.    Understanding JAX''s PRNG Keys    In JAX,
    randomness is handled through the jax.random module, which provides functions
    for generating random numbers. These functions require a PRNG key as an input,
    and they return both the random numbers and new PRNG keys for subsequent use.
    The PRNG key is a jax.random.PRNGKey object that encapsulates the random state.
    By explicitly managing these keys, we are able to maintain control over the randomness
    inherent to our computations.    Initializing PRNG Key    The initial step is
    to import JAX''s random module and initialize a PRNG key using a seed value. The
    seed value guarantees the generation of the identical sequence of random numbers
    across multiple runs.      import jax    from jax import random    \# Initialize
    a PRNG key with a seed    seed \= 42    key \= random.PRNGKey(seed)      This
    key will be used to generate random numbers throughout the program. The seed value
    can be any integer and serves as the starting point for the random number generator.   
    Generating Random Numbers    The PRNG key should be employed for the generation
    of random numbers. For example, this may be employed to initialize model parameters
    or to create random permutations of data.      \# Generating random weights for
    model initialization    key, subkey \= random.split(key)    W \= random.normal(subkey,
    shape=(input\_size, hidden\_size)) \* 0.01    \# Generating random biases    key,
    subkey \= random.split(key)    b \= random.normal(subkey, shape=(hidden\_size,))
    \* 0.01      In this code, random.split is used to split the key into two new
    keys: one for generating random numbers and one to be used for future operations.   
    Shuffling Data without In-Place Operations    Now when shuffling data, it''s important
    to avoid in-place operations. So here, use JAX''s random.permutation function
    with the PRNG key.      \# Shuffling training data    key, subkey \= random.split(key)   
    perm \= random.permutation(subkey, train\_images.shape\[0\])    train\_images\_shuffled
    \= train\_images\[perm\]    train\_labels\_shuffled \= train\_labels\[perm\]   
      The generation of a random permutation of indices enables the rearrangement
    of data arrays without modifying them in place. This approach aligns with JAX''s
    functional programming methodology and ensures the reproducibility of results.   
    Ensuring Reproducibility in Model Training    It is recommended that the PRNG
    key be incorporated into functions that involve randomness in order to ensure
    reproducibility. So to illustrate, when defining the training step function, the
    key should be passed as an argument as shown below:      @jit    def train\_step(params,
    x, y, key, learning\_rate=0.01):       key, subkey \= random.split(key)       
    \# Use subkey for any randomness within the function        loss, grads \= compute\_loss\_and\_grads(params,
    x, y, subkey)        params \= \[param \- learning\_rate \* grad for param, grad
    in zip(params, grads)\]       return params, key      The key is passed into the
    function and the updated key is returned, thereby maintaining control of the random
    state. This methodology guarantees that each training phase is deterministic when
    the same inputs are employed.    Using PRNG Keys in Data Augmentation    The process
    of data augmentation frequently entails the implementation of random transformations.
    The PRNG key should be employed in order to ensure the consistent application
    of these transformations.      def augment\_data(x, key):       key, subkey \=
    random.split(key)       # Apply random rotation       angle \= random.uniform(subkey,
    minval=-0.1, maxval=0.1)       x\_rotated \= rotate\_image(x, angle)       return
    x\_rotated, key      Here, rotate\_image is a hypothetical function that rotates
    the image by a given angle. By passing the key and updating it, we ensure that
    the randomness is controlled and reproducible.    Managing PRNG Keys in Loops   
    When using loops, update the PRNG key at each iteration to prevent reuse and maintain
    randomness.      key \= random.PRNGKey(seed)    params \= initialize\_params(key)   
    for epoch in range(num\_epochs):       key, subkey \= random.split(key)       
    train\_images\_shuffled, train\_labels\_shuffled \= shuffle\_data(train\_images,
    train\_labels, subkey)        for batch in get\_batches(train\_images\_shuffled,
    train\_labels\_shuffled, batch\_size):           x\_batch, y\_batch \= batch   
           key, subkey \= random.split(key)           params, key \= train\_step(params,
    x\_batch, y\_batch, subkey)      By consistently updating the key, we prevent
    accidental reuse, which could compromise the randomness and reproducibility of
    the results.    Incorporating PRNG Keys with JIT Compilation    Now when functions
    are compiled with special care must be taken with PRNG keys because JIT-compiled
    functions cache their results based on input shapes and types.      @jit    def
    compute\_loss\_and\_grads(params, x, y, key):       y\_pred \= model\_forward(params,
    x)       loss \= cross\_entropy\_loss(y\_pred, y)       grads \= grad(loss\_fn)(params,
    x, y)       return loss, grads      Since key is an input, the function will recompile
    if the key''s value changes. To avoid excessive recompilation, structure your
    code to minimize changes in the key''s shape and type.    Storing and Restoring
    PRNG Keys    If you need to pause and resume experiments, store the PRNG key along
    with model parameters to maintain reproducibility.      \# Saving the state   
    state \= {''params'': params, ''key'': key}    save\_checkpoint(state, filename)   
    \# Restoring the state    state \= load\_checkpoint(filename)    params \= state\[''params''\]   
    key \= state\[''key''\]      By saving the key, you ensure that the random state
    is preserved across sessions.    Using ‘jax.random.fold\_in’ for Multi-Process
    Environments    In distributed or multi-process settings, use jax.random.fold\_in
    to create unique keys for each process.      process\_id \= get\_process\_id()   
    key \= random.PRNGKey(seed)    key \= random.fold\_in(key, process\_id)      This
    method incorporates the process ID into the key, generating distinct random number
    sequences for each process while maintaining reproducibility.    By developing
    an understanding of and implementing effective management strategies for PRNG
    keys in JAX, it is possible to guarantee the reproducibility and consistency of
    machine learning experiments. This tactic serves to enhance the reliability of
    the results obtained, while simultaneously facilitating the debugging and verification
    processes inherent to projects involving the Fashion-MNIST dataset.    '
