    # 第 6 章：类型提升语义与混合精度

    ## 概述

    在本章中，我们将探讨 Google `JAX` 中数据类型和精度的具体细节，以及它们如何影响内存使用和计算效率。我们首先研究算术运算中类型提升背后的过程。这可能导致数据类型精度无意中增加，进而增加内存消耗。


