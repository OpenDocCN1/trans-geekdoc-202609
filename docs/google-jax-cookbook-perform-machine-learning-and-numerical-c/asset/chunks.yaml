    to trace the graph       tf.summary.graph(tf\_forward\_pass.get\_concrete\_function(params,
    x\_sample))      Here, ensure that params and x\_sample are compatible with TensorFlow
    functions. Convert them to TensorFlow tensors if necessary:      \# Convert parameters
    and sample input to TensorFlow tensors    params\_tf \= \[tf.convert\_to\_tensor(p)
