    \    # Use subkey for any randomness within the function\n    loss, grads = compute_loss_and_grads(params,\
    \ x, y, subkey)\n    params = [param - learning_rate * grad for param, grad in\
    \ zip(params, grads)]\n    return params, key\n```\n\nThe `key` is passed into\
    \ the function and the updated `key` is returned, thereby maintaining control\
    \ of the random state. This methodology guarantees that each training phase is\
    \ deterministic when the same inputs are employed.\n\n### Using PRNG Keys in Data\
    \ Augmentation\n\nThe process of data augmentation frequently entails the implementation\
    \ of random transformations. The `PRNG` key should be employed in order to ensure\
    \ the consistent application of these transformations.\n\n```\ndef augment_data(x,\
    \ key):\n    key, subkey = random.split(key)\n    # Apply random rotation\n  \
    \  angle = random.uniform(subkey, minval=-0.1, maxval=0.1)\n    x_rotated = rotate_image(x,\
    \ angle)\n    return x_rotated, key\n```\n\nHere, `rotate_image()` is a hypothetical\
    \ function that rotates the image by a given angle. By passing the `key` and updating\
    \ it, we ensure that the randomness is controlled and reproducible.\n\n### Managing\
    \ PRNG Keys in Loops\n\nWhen using loops, update the `PRNG` key at each iteration\
    \ to prevent reuse and maintain randomness.\n\n```\nkey = random.PRNGKey(seed)\n\
    params = initialize_params(key)\nfor epoch in range(num_epochs):\n    key, subkey\
    \ = random.split(key)\n    train_images_shuffled, train_labels_shuffled = shuffle_data(train_images,\
    \ train_labels, subkey)\n    for batch in get_batches(train_images_shuffled, train_labels_shuffled,\
    \ batch_size):\n        x_batch, y_batch = batch\n        key, subkey = random.split(key)\n\
    \        params, key = train_step(params, x_batch, y_batch, subkey)\n```\n\nBy\
    \ consistently updating the `key`, we prevent accidental reuse, which could compromise\
    \ the randomness and reproducibility of the results.\n\n### Incorporating PRNG\
    \ Keys with JIT Compilation\n\nNow when functions are compiled with special care\
    \ must be taken with `PRNG` keys because `JIT`-compiled functions cache their\
    \ results based on input shapes and types.\n\n```\n@jit\ndef compute_loss_and_grads(params,\
    \ x, y, key):\n    y_pred = model_forward(params, x)\n    loss = cross_entropy_loss(y_pred,\
    \ y)\n    grads = grad(loss_fn)(params, x, y)\n    return loss, grads\n```\n\n\
    Since `key` is an input, the function will recompile if the `key`'s value changes.\
    \ To avoid excessive recompilation, structure your code to minimize changes in\
    \ the `key`'s shape and type.\n\n### Storing and Restoring PRNG Keys\n\nIf you\
    \ need to pause and resume experiments, store the `PRNG` key along with model\
    \ parameters to maintain reproducibility.\n\n```\n# Saving the state\nstate =\
    \ {'params': params, 'key': key}\nsave_checkpoint(state, filename)\n# Restoring\
    \ the state\nstate = load_checkpoint(filename)\nparams = state['params']\nkey\
    \ = state['key']\n```\n\nBy saving the `key`, you ensure that the random state\
    \ is preserved across sessions.\n\n### Using `jax.random.fold_in` for Multi-Process\
    \ Environments\n\nIn distributed or multi-process settings, use `jax.random.fold_in()`\
    \ to create unique keys for each process.\n\n```\nprocess_id = get_process_id()\n\
    key = random.PRNGKey(seed)\nkey = random.fold_in(key, process_id)\n```\n\nThis\
    \ method incorporates the process ID into the `key`, generating distinct random\
    \ number sequences for each process while maintaining reproducibility.\n\nBy developing\
    \ an understanding of and implementing effective management strategies for `PRNG`\
    \ keys in `JAX`, it is possible to guarantee the reproducibility and consistency\
    \ of machine learning experiments. This tactic serves to enhance the reliability\
    \ of the results obtained, while simultaneously facilitating the debugging and\
    \ verification processes inherent to projects involving the `Fashion-MNIST` dataset.\n"
  trans: "\n# 管理随机数生成\n\n在 `NumPy` 中，随机性通过全局随机状态进行管理，如果处理不当可能导致非确定性行为。Google `JAX`，然而，采用了不同的随机数生成方法，强调函数式纯度和显式状态管理。这种差异会给从\
    \ `NumPy` 转向的用户带来不确定性，使得生成可复现的结果变得困难。任务是理解 `JAX` 使用 `PRNG`（伪随机数生成器）键处理随机性的方法，并学习如何有效使用这些键以确保涉及\
    \ `Fashion-MNIST` 数据集的实验中结果一致且可复现。\n\n## 理解 JAX 的 PRNG 键\n\n在 `JAX` 中，随机性通过 `jax.random`\
    \ 模块处理，该模块提供了生成随机数的函数。这些函数需要一个 `PRNG` 键作为输入，并返回随机数和用于后续使用的新的 `PRNG` 键。`PRNG` 键是一个封装随机状态的\
    \ `jax.random.PRNGKey` 对象。通过显式管理这些键，我们能够控制计算中固有的随机性。\n\n### 初始化 PRNG 键\n\n第一步是导入\
    \ `JAX` 的随机模块并使用种子值初始化 `PRNG` 键。`seed` 值保证在多次运行中生成相同的随机数序列。\n\n```\nimport jax\n\
    from jax import random\n# Initialize a PRNG key with a seed\nseed = 42\nkey =\
    \ random.PRNGKey(seed)\n```\n\n此 `key` 将在整个程序中用于生成随机数。`seed` 值可以是任意整数，并作为随机数生成器的起点。\n\
    \n### 生成随机数\n\n应使用 `PRNG` 键来生成随机数。例如，这可用于初始化模型参数或创建数据的随机排列。\n\n```\n# Generating\
    \ random weights for model initialization\nkey, subkey = random.split(key)\nW\
    \ = random.normal(subkey, shape=(input_size, hidden_size)) * 0.01\n# Generating\
    \ random biases\nkey, subkey = random.split(key)\nb = random.normal(subkey, shape=(hidden_size,))\
    \ * 0.01\n```\n\n在此代码中，`random.split()` 用于将 `key` 分成两个新键：一个用于生成随机数，一个用于未来的操作。\n\
    \n### 无需原地操作地打乱数据\n\n现在打乱数据时，避免原地操作很重要。因此，这里使用 `JAX` 的 `random.permutation()`\
    \ 函数并传入 `PRNG` 键。\n\n```\n# Shuffling training data\nkey, subkey = random.split(key)\n\
    perm = random.permutation(subkey, train_images.shape[0])\ntrain_images_shuffled\
    \ = train_images[perm]\ntrain_labels_shuffled = train_labels[perm]\n```\n\n生成索引的随机排列可在不原地修改它们的情况下重新排列数据数组。这种方法符合\
    \ `JAX` 的函数式编程方法，并确保结果的可复现性。\n\n### 确保模型训练的可复现性\n\n建议将 `PRNG` 键纳入涉及随机性的函数中以确保可复现性。为说明，当定义训练步骤函数时，应将\
    \ `key` 作为参数传递，如下所示：\n\n```\n@jit\ndef train_step(params, x, y, key, learning_rate=0.01):\n\
    \    key, subkey = random.split(key)\n    # Use subkey for any randomness within\
    \ the function\n    loss, grads = compute_loss_and_grads(params, x, y, subkey)\n\
    \    params = [param - learning_rate * grad for param, grad in zip(params, grads)]\n\
    \    return params, key\n```\n\n`key` 被传入函数并返回更新后的 `key`，从而保持对随机状态的控制。这种方法保证在采用相同输入时每个训练阶段都是确定的。\n\
    \n### 在数据增强中使用 PRNG 键\n\n数据增强过程经常涉及随机变换的实现。应使用 `PRNG` 键以确保这些变换的一致应用。\n\n```\n\
    def augment_data(x, key):\n    key, subkey = random.split(key)\n    # Apply random\
    \ rotation\n    angle = random.uniform(subkey, minval=-0.1, maxval=0.1)\n    x_rotated\
    \ = rotate_image(x, angle)\n    return x_rotated, key\n```\n\n这里，`rotate_image()`\
    \ 是一个假设的函数，用于按给定角度旋转图像。通过传递 `key` 并更新它，我们确保随机性受控且可复现。\n\n### 在循环中管理 PRNG 键\n\n\
    使用循环时，在每次迭代中更新 `PRNG` 键以防止重复使用并保持随机性。\n\n```\nkey = random.PRNGKey(seed)\nparams\
    \ = initialize_params(key)\nfor epoch in range(num_epochs):\n    key, subkey =\
    \ random.split(key)\n    train_images_shuffled, train_labels_shuffled = shuffle_data(train_images,\
    \ train_labels, subkey)\n    for batch in get_batches(train_images_shuffled, train_labels_shuffled,\
    \ batch_size):\n        x_batch, y_batch = batch\n        key, subkey = random.split(key)\n\
    \        params, key = train_step(params, x_batch, y_batch, subkey)\n```\n\n通过持续更新\
    \ `key`，我们防止意外重复使用，这可能会损害结果的随机性和可复现性。\n\n### 将 PRNG 键与 JIT 编译结合\n\n现在当函数被编译时，必须特别注意\
    \ `PRNG` 键，因为 `JIT` 编译的函数会根据输入形状和类型缓存其结果。\n\n```\n@jit\ndef compute_loss_and_grads(params,\
    \ x, y, key):\n    y_pred = model_forward(params, x)\n    loss = cross_entropy_loss(y_pred,\
    \ y)\n    grads = grad(loss_fn)(params, x, y)\n    return loss, grads\n```\n\n\
    由于 `key` 是输入，如果 `key` 的值发生变化，函数将重新编译。为了避免过度重新编译，请构建代码以最小化 `key` 形状和类型的变化。\n\n\
    ### 存储和恢复 PRNG 键\n\n如果需要暂停和恢复实验，请将 `PRNG` 键与模型参数一起存储以保持可复现性。\n\n```\n# Saving\
    \ the state\nstate = {'params': params, 'key': key}\nsave_checkpoint(state, filename)\n\
    # Restoring the state\nstate = load_checkpoint(filename)\nparams = state['params']\n\
    key = state['key']\n```\n\n通过保存 `key`，您可确保随机状态在会话之间得以保留。\n\n### 在多进程环境中使用 `jax.random.fold_in`\n\
    \n在分布式或多进程设置中，使用 `jax.random.fold_in()` 为每个进程创建唯一键。\n\n```\nprocess_id = get_process_id()\n\
    key = random.PRNGKey(seed)\nkey = random.fold_in(key, process_id)\n```\n\n此方法将进程\
    \ ID 纳入 `key`，为每个进程生成不同的随机数序列，同时保持可复现性。\n\n通过理解并实施 `JAX` 中 `PRNG` 键的有效管理策略，可以保证机器学习实验的可复现性和一致性。这种策略有助于提高所获得结果的可靠性，同时促进涉及\
    \ `Fashion-MNIST` 数据集项目的调试和验证过程。\n"
