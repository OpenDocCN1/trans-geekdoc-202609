- raw: '  Monitoring GPU Memory Usage    While training the neural network on the
    Fashion-MNIST dataset using JAX, out-of-memory (OOM) errors may occur on the GPU.
    These errors interrupt the training process and are caused by the model consuming
    more memory than the GPU can provide. Managing GPU memory effectively is crucial
    for efficient model training, especially with large datasets or complex models.
    The challenge is to implement strategies to profile GPU memory usage and reduce
    consumption, ensuring that the model fits within the available memory constraints
    and training proceeds smoothly.    To address GPU OOM errors, it is essential
    to monitor and profile GPU memory usage during training. By understanding how
    memory is allocated and utilized, strategies can be implemented to reduce consumption.
    Techniques such as using smaller data types, optimizing data loading, adjusting
    batch sizes, and leveraging JAX''s memory management features can help mitigate
    OOM errors. Below is a practical approach to profile and reduce GPU memory usage
    during model training with JAX.    Profiling GPU Memory Usage    The initial step
    is to monitor the GPU memory usage in order to identify the instances and locations
    where memory spikes occur. To gain insight into the real-time GPU memory consumption,
    one may utilize tools such as NVIDIA''s nvidia-smi.      \# Run this command in
    a separate terminal    watch \-n 1 nvidia-smi      This command updates the GPU
    status every second, displaying memory usage and other statistics.    Preventing
    JAX from Preallocating GPU Memory    By default, JAX may preallocate the majority
    of the GPU memory, which can impede the ability to accurately monitor actual usage.
    To ensure precise profiling, it is necessary to disable preallocation.      import
    os    \# Disable JAX GPU memory preallocation    os.environ\[''XLA\_PYTHON\_CLIENT\_PREALLOCATE''\]
    \= ''false''      The setting of this environment variable guarantees that JAX
    will allocate memory as required, rather than reserving it in advance.    Reducing
    Data Precision    Utilising more compact data types can result in a reduction
    in memory consumption. It is recommended that data and model parameters be converted
    from float32 to float16.      import jax.numpy as jnp    from jax import random   
    \# Convert data to float16    train\_images \= train\_images.astype(jnp.float16)   
    test\_images \= test\_images.astype(jnp.float16)    \# Initialize parameters with
    float16    key \= random.PRNGKey(0)    W1 \= random.normal(key, (input\_size,
    hidden\_size), dtype=jnp.float16) \* 0.01    b1 \= jnp.zeros((hidden\_size,),
    dtype=jnp.float16)    W2 \= random.normal(key, (hidden\_size, output\_size), dtype=jnp.float16)
    \* 0.01    b2 \= jnp.zeros((output\_size,), dtype=jnp.float16)      The use of
    float16 halves the memory required for storing data and parameters.    Adjusting
    Batch Size    Reducing the batch size decreases the amount of data processed at
    once, thus lowering memory usage.      \# Reduce batch size    batch\_size \=
    32  \# Previously 64      A smaller batch size requires less memory but may affect
    training dynamics. Try to find a balance between memory constraints and training
    efficiency.    Optimizing Data Loading    Here, ensure that data loading is efficient
    and does not consume unnecessary memory.    ●       Load data in batches rather
    than all at once.    ●       Use data generators or iterators to stream data during
    training.    ●       Avoid duplicating data in memory.      def data\_generator(images,
    labels, batch\_size):       num\_samples \= images.shape\[0\]       indices \=
    jnp.arange(num\_samples)        for start\_idx in range(0, num\_samples, batch\_size):   
           excerpt \= indices\[start\_idx:start\_idx \+ batch\_size\]           yield
    images\[excerpt\], labels\[excerpt\]    \# Use the generator in the training loop   
    for epoch in range(num\_epochs):        for x\_batch, y\_batch in data\_generator(train\_images,
    train\_labels, batch\_size):           params \= update(params, x\_batch, y\_batch)   
      This whole approach loads only the necessary data into memory for each batch,
    conserving memory resources.    Utilizing JAX''s ‘jit’ Compilation    Ensure that
    the @jit decorator is used appropriately to prevent excessive memory usage due
    to recompilation.      from jax import jit    \# Use static\_argnums if function
    arguments change shape frequently    @jit    def update(params, x, y):       grads
    \= grad\_loss(params, x, y)        params \= \[param \- learning\_rate \* grad
    for param, grad in zip(params, grads)\]       return params      Where feasible,
    it is advisable to ensure that the input shapes remain consistent to circumvent
    the necessity for recompilation, which can otherwise result in the utilisation
    of additional memory.    Implementing Gradient Checkpointing    Gradient checkpointing
    trades computation for memory by re-computing parts of the forward pass during
    backpropagation instead of storing all intermediate activations.      from jax.experimental
    import checkpoint    \# Apply checkpointing to the forward pass    def forward\_pass(params,
    x):        W1, b1, W2, b2 \= params        z1 \= jnp.dot(x, W1) \+ b1       a1
    \= relu(z1)        z2 \= jnp.dot(a1, W2) \+ b2       return z2    \# Use checkpointed
    version of the forward pass    checkpointed\_forward \= checkpoint(forward\_pass)   
      By using memory usage during training is reduced at the cost of additional computation
    time.    Monitoring Memory Allocation with JAX Profiling Tools    Again you use
    JAX''s profiling tools to get detailed information about memory allocation.   
      from jax import profiler    \# Start profiling    profiler.start\_trace(''/tmp/jax\_trace'')   
    \# Run training code    \# Stop profiling    profiler.stop\_trace()      you can
    also use TensorBoard to visualize the profiling data.      tensorboard \--logdir=/tmp/jax\_trace   
      Here, navigate to the "Profiler" tab to analyze memory usage and identify potential
    optimizations.    Minimizing Data Transfers between Host and Device    Excessive
    data transfers between the CPU (host) and GPU (device) can consume memory and
    reduce performance. Keep data on the device when possible.      from jax import
    device\_put    \# Move data to the GPU before training    train\_images\_device
    \= device\_put(train\_images)    train\_labels\_device \= device\_put(train\_labels)   
      Ensure that computations are performed on the GPU to avoid unnecessary data
    movement.    Simplifying Model Architecture    Consider reducing the complexity
    of the model to lower memory requirements.    ●       Decrease the number of neurons
    in hidden layers.    ●       Use shallower architectures.    ●       Employ model
    pruning techniques to remove redundant parameters.      \# Reduce hidden layer
    size    hidden\_size \= 64  \# Previously 128      A simpler model consumes less
    memory and may still achieve acceptable performance.    Utilizing Mixed Precision
    Training    One may leverage mixed precision training to achieve a balanced utilization
    of memory and computational efficiency.      from jax.experimental import mixed\_precision   
    \# Set policy for mixed precision    policy \= mixed\_precision.Policy(compute\_dtype=jnp.float16,
    param\_dtype=jnp.float32, output\_dtype=jnp.float32)    mixed\_precision.set\_policy(policy)   
      Here, computations are performed in reducing memory usage, while parameters
    are stored in float32 for numerical stability.    Through the implementation of
    these strategies, it is possible to reduce the consumption of GPU memory effectively,
    which in turn serves to mitigate the occurrence of OOM (out of memory) errors
    that may occur during the process of model training. It is essential to profile
    and optimize memory usage when training models using JAX. This allows for the
    handling of larger datasets or more complex architectures, while still adhering
    to the constraints of available hardware resources.    '
  fmt: "\n# Monitoring GPU Memory Usage\n\nWhile training the neural network on the\
    \ Fashion-MNIST dataset using JAX, out-of-memory (OOM) errors may occur on the\
    \ GPU. These errors interrupt the training process and are caused by the model\
    \ consuming more memory than the GPU can provide. Managing GPU memory effectively\
    \ is crucial for efficient model training, especially with large datasets or complex\
    \ models. The challenge is to implement strategies to profile GPU memory usage\
    \ and reduce consumption, ensuring that the model fits within the available memory\
    \ constraints and training proceeds smoothly.\n\nTo address GPU OOM errors, it\
    \ is essential to monitor and profile GPU memory usage during training. By understanding\
    \ how memory is allocated and utilized, strategies can be implemented to reduce\
    \ consumption. Techniques such as using smaller data types, optimizing data loading,\
    \ adjusting batch sizes, and leveraging JAX's memory management features can help\
    \ mitigate OOM errors. Below is a practical approach to profile and reduce GPU\
    \ memory usage during model training with JAX.\n\n## Profiling GPU Memory Usage\n\
    \nThe initial step is to monitor the GPU memory usage in order to identify the\
    \ instances and locations where memory spikes occur. To gain insight into the\
    \ real-time GPU memory consumption, one may utilize tools such as NVIDIA's `nvidia-smi`.\n\
    \n```\n# Run this command in a separate terminal\nwatch -n 1 nvidia-smi\n```\n\
    \nThis command updates the GPU status every second, displaying memory usage and\
    \ other statistics.\n\n## Preventing JAX from Preallocating GPU Memory\n\nBy default,\
    \ JAX may preallocate the majority of the GPU memory, which can impede the ability\
    \ to accurately monitor actual usage. To ensure precise profiling, it is necessary\
    \ to disable preallocation.\n\n```\nimport os\n# Disable JAX GPU memory preallocation\n\
    os.environ['XLA_PYTHON_CLIENT_PREALLOCATE'] = 'false'\n```\n\nThe setting of this\
    \ environment variable guarantees that JAX will allocate memory as required, rather\
    \ than reserving it in advance.\n\n## Reducing Data Precision\n\nUtilising more\
    \ compact data types can result in a reduction in memory consumption. It is recommended\
    \ that data and model parameters be converted from `float32` to `float16`.\n\n\
    ```\nimport jax.numpy as jnp\nfrom jax import random\n# Convert data to float16\n\
    train_images = train_images.astype(jnp.float16)\ntest_images = test_images.astype(jnp.float16)\n\
    # Initialize parameters with float16\nkey = random.PRNGKey(0)\nW1 = random.normal(key,\
    \ (input_size, hidden_size), dtype=jnp.float16) * 0.01\nb1 = jnp.zeros((hidden_size,),\
    \ dtype=jnp.float16)\nW2 = random.normal(key, (hidden_size, output_size), dtype=jnp.float16)\
    \ * 0.01\nb2 = jnp.zeros((output_size,), dtype=jnp.float16)\n```\n\nThe use of\
    \ `float16` halves the memory required for storing data and parameters.\n\n##\
    \ Adjusting Batch Size\n\nReducing the batch size decreases the amount of data\
    \ processed at once, thus lowering memory usage.\n\n```\n# Reduce batch size\n\
    batch_size = 32  # Previously 64\n```\n\nA smaller `batch_size` requires less\
    \ memory but may affect training dynamics. Try to find a balance between memory\
    \ constraints and training efficiency.\n\n## Optimizing Data Loading\n\nHere,\
    \ ensure that data loading is efficient and does not consume unnecessary memory.\n\
    \n- Load data in batches rather than all at once.\n- Use data generators or iterators\
    \ to stream data during training.\n- Avoid duplicating data in memory.\n\n```\n\
    def data_generator(images, labels, batch_size):\n    num_samples = images.shape[0]\n\
    \    indices = jnp.arange(num_samples)\n    for start_idx in range(0, num_samples,\
    \ batch_size):\n        excerpt = indices[start_idx:start_idx + batch_size]\n\
    \        yield images[excerpt], labels[excerpt]\n# Use the generator in the training\
    \ loop\nfor epoch in range(num_epochs):\n    for x_batch, y_batch in data_generator(train_images,\
    \ train_labels, batch_size):\n        params = update(params, x_batch, y_batch)\n\
    ```\n\nThis whole approach loads only the necessary data into memory for each\
    \ batch, conserving memory resources.\n\n## Utilizing JAX's `jit` Compilation\n\
    \nEnsure that the `@jit` decorator is used appropriately to prevent excessive\
    \ memory usage due to recompilation.\n\n```\nfrom jax import jit\n# Use static_argnums\
    \ if function arguments change shape frequently\n@jit\ndef update(params, x, y):\n\
    \    grads = grad_loss(params, x, y)\n    params = [param - learning_rate * grad\
    \ for param, grad in zip(params, grads)]\n    return params\n```\n\nWhere feasible,\
    \ it is advisable to ensure that the input shapes remain consistent to circumvent\
    \ the necessity for recompilation, which can otherwise result in the utilisation\
    \ of additional memory.\n\n## Implementing Gradient Checkpointing\n\nGradient\
    \ checkpointing trades computation for memory by re-computing parts of the forward\
    \ pass during backpropagation instead of storing all intermediate activations.\n\
    \n```\nfrom jax.experimental import checkpoint\n# Apply checkpointing to the forward\
    \ pass\ndef forward_pass(params, x):\n    W1, b1, W2, b2 = params\n    z1 = jnp.dot(x,\
    \ W1) + b1\n    a1 = relu(z1)\n    z2 = jnp.dot(a1, W2) + b2\n    return z2\n\
    # Use checkpointed version of the forward pass\ncheckpointed_forward = checkpoint(forward_pass)\n\
    ```\n\nBy using memory usage during training is reduced at the cost of additional\
    \ computation time.\n\n## Monitoring Memory Allocation with JAX Profiling Tools\n\
    \nAgain you use JAX's profiling tools to get detailed information about memory\
    \ allocation.\n\n```\nfrom jax import profiler\n# Start profiling\nprofiler.start_trace('/tmp/jax_trace')\n\
    # Run training code\n# Stop profiling\nprofiler.stop_trace()\n```\n\nyou can also\
    \ use TensorBoard to visualize the profiling data.\n\n```\ntensorboard --logdir=/tmp/jax_trace\n\
    ```\n\nHere, navigate to the \"Profiler\" tab to analyze memory usage and identify\
    \ potential optimizations.\n\n## Minimizing Data Transfers between Host and Device\n\
    \nExcessive data transfers between the CPU (host) and GPU (device) can consume\
    \ memory and reduce performance. Keep data on the device when possible.\n\n```\n\
    from jax import device_put\n# Move data to the GPU before training\ntrain_images_device\
    \ = device_put(train_images)\ntrain_labels_device = device_put(train_labels)\n\
    ```\n\nEnsure that computations are performed on the GPU to avoid unnecessary\
    \ data movement.\n\n## Simplifying Model Architecture\n\nConsider reducing the\
    \ complexity of the model to lower memory requirements.\n\n- Decrease the number\
    \ of neurons in hidden layers.\n- Use shallower architectures.\n- Employ model\
    \ pruning techniques to remove redundant parameters.\n\n```\n# Reduce hidden layer\
    \ size\nhidden_size = 64  # Previously 128\n```\n\nA simpler model consumes less\
    \ memory and may still achieve acceptable performance.\n\n## Utilizing Mixed Precision\
    \ Training\n\nOne may leverage mixed precision training to achieve a balanced\
    \ utilization of memory and computational efficiency.\n\n```\nfrom jax.experimental\
    \ import mixed_precision\n# Set policy for mixed precision\npolicy = mixed_precision.Policy(compute_dtype=jnp.float16,\
    \ param_dtype=jnp.float32, output_dtype=jnp.float32)\nmixed_precision.set_policy(policy)\n\
    ```\n\nHere, computations are performed in reducing memory usage, while parameters\
    \ are stored in `float32` for numerical stability.\n\nThrough the implementation\
    \ of these strategies, it is possible to reduce the consumption of GPU memory\
    \ effectively, which in turn serves to mitigate the occurrence of OOM (out of\
    \ memory) errors that may occur during the process of model training. It is essential\
    \ to profile and optimize memory usage when training models using JAX. This allows\
    \ for the handling of larger datasets or more complex architectures, while still\
    \ adhering to the constraints of available hardware resources.\n"
  trans: "\n# 监控 GPU 内存使用情况\n\n在使用 JAX 在 Fashion-MNIST 数据集上训练神经网络时，GPU 上可能会出现内存不足（OOM）错误。这些错误会中断训练过程，其原因是模型消耗的内存超过\
    \ GPU 所能提供的内存。有效管理 GPU 内存对于高效的模型训练至关重要，尤其是在处理大型数据集或复杂模型时。挑战在于实施策略来分析 GPU 内存使用情况并减少消耗，确保模型在可用内存限制内运行且训练顺利进行。\n\
    \n为了解决 GPU OOM 错误，在训练期间监控和分析 GPU 内存使用情况至关重要。通过了解内存如何分配和使用，可以实施策略来减少消耗。使用更小的数据类型、优化数据加载、调整批大小以及利用\
    \ JAX 的内存管理功能等技术可以帮助缓解 OOM 错误。下面是使用 JAX 在模型训练期间分析并减少 GPU 内存使用的实用方法。\n\n## 分析 GPU\
    \ 内存使用情况\n\n初始步骤是监控 GPU 内存使用情况，以便识别内存峰值发生的时间和位置。为了深入了解实时 GPU 内存消耗，可以使用 NVIDIA\
    \ 的 `nvidia-smi` 等工具。\n\n```\n# Run this command in a separate terminal\nwatch\
    \ -n 1 nvidia-smi\n```\n\n该命令每秒更新一次 GPU 状态，显示内存使用情况和其他统计信息。\n\n## 防止 JAX 预分配 GPU\
    \ 内存\n\n默认情况下，JAX 可能会预分配大部分 GPU 内存，这会阻碍准确监控实际使用情况的能力。为了确保精确分析，有必要禁用预分配。\n\n```\n\
    import os\n# Disable JAX GPU memory preallocation\nos.environ['XLA_PYTHON_CLIENT_PREALLOCATE']\
    \ = 'false'\n```\n\n设置此环境变量可确保 JAX 按需分配内存，而不是提前保留。\n\n## 降低数据精度\n\n使用更紧凑的数据类型可以减少内存消耗。建议将数据和模型参数从\
    \ `float32` 转换为 `float16`。\n\n```\nimport jax.numpy as jnp\nfrom jax import random\n\
    # Convert data to float16\ntrain_images = train_images.astype(jnp.float16)\ntest_images\
    \ = test_images.astype(jnp.float16)\n# Initialize parameters with float16\nkey\
    \ = random.PRNGKey(0)\nW1 = random.normal(key, (input_size, hidden_size), dtype=jnp.float16)\
    \ * 0.01\nb1 = jnp.zeros((hidden_size,), dtype=jnp.float16)\nW2 = random.normal(key,\
    \ (hidden_size, output_size), dtype=jnp.float16) * 0.01\nb2 = jnp.zeros((output_size,),\
    \ dtype=jnp.float16)\n```\n\n使用 `float16` 可将存储数据和参数所需的内存减半。\n\n## 调整批大小\n\n减小批大小会减少一次处理的数据量，从而降低内存使用。\n\
    \n```\n# Reduce batch size\nbatch_size = 32  # Previously 64\n```\n\n更小的 `batch_size`\
    \ 需要更少的内存，但可能会影响训练动态。尝试在内存限制和训练效率之间找到平衡。\n\n## 优化数据加载\n\n在这里，确保数据加载高效且不会消耗不必要的内存。\n\
    \n- 分批加载数据，而不是一次性全部加载。\n- 使用数据生成器或迭代器在训练期间流式传输数据。\n- 避免在内存中重复数据。\n\n```\ndef data_generator(images,\
    \ labels, batch_size):\n    num_samples = images.shape[0]\n    indices = jnp.arange(num_samples)\n\
    \    for start_idx in range(0, num_samples, batch_size):\n        excerpt = indices[start_idx:start_idx\
    \ + batch_size]\n        yield images[excerpt], labels[excerpt]\n# Use the generator\
    \ in the training loop\nfor epoch in range(num_epochs):\n    for x_batch, y_batch\
    \ in data_generator(train_images, train_labels, batch_size):\n        params =\
    \ update(params, x_batch, y_batch)\n```\n\n这种整体方法仅为每个批次加载必要的内存数据，节省内存资源。\n\n##\
    \ 利用 JAX 的 `jit` 编译\n\n确保适当使用 `@jit` 装饰器，以防止因重新编译而导致内存使用过度。\n\n```\nfrom jax import\
    \ jit\n# Use static_argnums if function arguments change shape frequently\n@jit\n\
    def update(params, x, y):\n    grads = grad_loss(params, x, y)\n    params = [param\
    \ - learning_rate * grad for param, grad in zip(params, grads)]\n    return params\n\
    ```\n\n在可行时，建议确保输入形状保持一致，以避免重新编译的必要性，否则可能导致额外内存的利用。\n\n## 实现梯度检查点\n\n梯度检查点通过在反向传播期间重新计算前向传播的部分而不是存储所有中间激活，从而以计算换取内存。\n\
    \n```\nfrom jax.experimental import checkpoint\n# Apply checkpointing to the forward\
    \ pass\ndef forward_pass(params, x):\n    W1, b1, W2, b2 = params\n    z1 = jnp.dot(x,\
    \ W1) + b1\n    a1 = relu(z1)\n    z2 = jnp.dot(a1, W2) + b2\n    return z2\n\
    # Use checkpointed version of the forward pass\ncheckpointed_forward = checkpoint(forward_pass)\n\
    ```\n\n使用后，训练期间的内存使用量会减少，但会以额外的计算时间为代价。\n\n## 使用 JAX 分析工具监控内存分配\n\n再次使用 JAX 的分析工具来获取有关内存分配的详细信息。\n\
    \n```\nfrom jax import profiler\n# Start profiling\nprofiler.start_trace('/tmp/jax_trace')\n\
    # Run training code\n# Stop profiling\nprofiler.stop_trace()\n```\n\n你也可以使用 TensorBoard\
    \ 来可视化分析数据。\n\n```\ntensorboard --logdir=/tmp/jax_trace\n```\n\n在这里，导航到“Profiler”选项卡以分析内存使用情况并识别潜在的优化。\n\
    \n## 最小化主机与设备之间的数据传输\n\nCPU（主机）与 GPU（设备）之间过量的数据传输会消耗内存并降低性能。在可能的情况下将数据保留在设备上。\n\
    \n```\nfrom jax import device_put\n# Move data to the GPU before training\ntrain_images_device\
    \ = device_put(train_images)\ntrain_labels_device = device_put(train_labels)\n\
    ```\n\n确保计算在 GPU 上执行，以避免不必要的数据移动。\n\n## 简化模型架构\n\n考虑降低模型的复杂性以减少内存需求。\n\n- 减少隐藏层中的神经元数量。\n\
    - 使用更浅的架构。\n- 采用模型剪枝技术来删除冗余参数。\n\n```\n# Reduce hidden layer size\nhidden_size\
    \ = 64  # Previously 128\n```\n\n更简单的模型消耗更少的内存，并且仍可能达到可接受的性能。\n\n## 利用混合精度训练\n\
    \n可以利用混合精度训练来实现内存和计算效率的平衡利用。\n\n```\nfrom jax.experimental import mixed_precision\n\
    # Set policy for mixed precision\npolicy = mixed_precision.Policy(compute_dtype=jnp.float16,\
    \ param_dtype=jnp.float32, output_dtype=jnp.float32)\nmixed_precision.set_policy(policy)\n\
    ```\n\n在这里，计算以减少内存使用的方式执行，而参数以 `float32` 存储以确保数值稳定性。\n\n通过实施这些策略，可以有效减少 GPU 内存消耗，从而缓解模型训练过程中可能出现的内存不足（OOM）错误的发生。使用\
    \ JAX 训练模型时，分析和优化内存使用至关重要。这使得能够处理更大数据集或更复杂的架构，同时仍遵守可用硬件资源的限制。\n"
