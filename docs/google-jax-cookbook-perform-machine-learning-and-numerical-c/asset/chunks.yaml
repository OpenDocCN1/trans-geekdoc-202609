    # Google JAX 实用手册

    使用 `TensorFlow` 和 `NumPy` 的结合能力进行机器学习和数值计算

    Zephyr Quent


    ## 前言

    这是一本实用、面向解决方案的书籍，数据科学家、机器学习工程师和人工智能工程师需要它来充分发挥 Google `JAX` 在高效和高级机器学习方面的优势。它涵盖了基本任务、故障排除场景和优化技术，以解决在机器学习和数值计算项目中使用
    `JAX` 时遇到的常见挑战。

    本书从 `NumPy` 迁移到 `JAX` 开始。它介绍了加速计算、处理数据类型、生成随机数以及执行原地操作的最佳方法。随后展示如何使用分析技术监控计算时间和设备内存，帮助您优化训练和性能。调试部分提供了清晰有效的策略，用于解决常见的运行时问题，包括形状不匹配、`NaNs`
    和控制流错误。

    本书继续介绍如何掌握 `Pytrees` 进行数据操作，通过外部函数接口 (`FFI`) 集成外部函数，以及利用高级序列化和类型提升技术实现稳定计算。如果您想优化训练流程，本书涵盖了这一需求。它包括高效数据加载、构建自定义神经网络、实现混合精度以及使用
    `Penzai` 跟踪实验的配方。您将学习如何可视化模型性能并监控指标，以有效评估训练进度。本书中的配方处理真实场景，使用户能够快速修复问题并微调模型。


    ### 在本书中你将学习如何：

    - 通过从 `NumPy` 迁移到 `JAX` 的优化框架，使计算更快完成。

    - 通过分析耗时和内存使用情况，使训练管道更高效。

    - 使用调试技术修复诸如形状不匹配和数值不稳定等运行时问题。

    - 掌握 `Pytrees` 以在各种机器学习任务中管理复杂嵌套数据结构。

    - 使用 `JAX` 的外部函数接口 (`FFI`) 引入外部函数，提升计算能力。

    - 利用混合精度训练加速神经网络计算，而不牺牲模型准确性。

    - 使用 `Penzai` 保持实验有序。这可以让您重现结果并监控关键指标。

    - 使用高级可视化技术，如混淆矩阵和学习曲线，使模型评估更有效。

    - 直接在 `JAX` 中创建自己的神经网络和优化器，以便完全控制架构。

    - 使用序列化技术高效地保存、加载和传输模型和训练检查点。


    ## 序言

    作为一名机器学习工程师，我经常发现自己面临 `NumPy` 的局限性。它在数值计算方面很出色，但在扩展模型或训练复杂神经网络时就跟不上了。问题不仅仅是速度，尽管速度确实是一个因素。我在自动微分和
    GPU 加速方面也遇到困难，这促使我寻找能够满足现代机器学习工作流程需求的替代方案。

    就是在那时我发现了 Google `JAX`。`JAX` 通过即时 (`JIT`) 编译提供了更快的执行潜力，还有更多好处。它内置支持自动微分并与硬件加速无缝集成，使其成为有吸引力的选择。与任何工具一样，存在学习曲线和需要克服的障碍。从熟悉的
    `NumPy` 世界迁移意味着思维方式和代码结构的改变。很多人在这方面遇到困难，我也不例外。

    我受启发撰写《Google JAX Cookbook》，因为我想分享基于我自身经历的这些挑战的实用解决方案。我想创造的不仅仅是一本理论参考——我想汇编一本动手、可操作的书籍，充满实用配方。本书中的每个配方都针对特定问题，提供清晰的解决方案，并提供足够的内容使其有用而不至于让人不知所措。我以一种让您逐步了解可能遇到的不同情况的方式编排了本书，从加速基本数值运算到排查训练问题。

    在本书中，我涵盖了分析计算和内存、调试运行时错误以及为不同硬件设置优化神经网络的一些挑战。您还将获得有关如何使用 `Pytrees` 管理数据结构、使用 `JAX`
    的外部函数接口 (`FFI`) 集成外部库，甚至使用 `Penzai` 设置实验跟踪以保持项目井然有序的提示。每章都建立在前一章的基础上，复杂性逐渐增加，同时确保您不会迷路。我始终专注于解决现实世界的问题，因为归根结底，这才是最重要的。

    我重点关注的主要事情之一是向您展示如何利用 `JAX`。`JAX` 的优势在于其灵活性。一旦您开始理解其细微差别，您会发现它开启了无限可能。您会找到从将高精度切换到混合精度以加速训练，到更有效地管理内存以防止内存不足错误等各方面的提示。所有您需要立即开始的技术。

    我写这本书是面向数据科学家、机器学习工程师和人工智能从业者的。如果您正在寻找方法使您的工作流程更快、更高效、更不易出错，这本书是您手边的好资源。让我们一起弄清楚如何使用
    `JAX`、修复出现的问题，并看看高级机器学习有什么可能。


