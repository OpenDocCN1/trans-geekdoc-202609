- raw: '  Using Custom Data Types    In certain machine learning applications, standard
    data types like float32 or float64 may not suffice due to specific precision requirements
    or the need for specialized numerical behavior. For example, you might require
    fixed-point arithmetic, custom rounding behaviors, or representations optimized
    for specific hardware. JAX, by default, supports standard numerical types, but
    to meet the specialized needs of your project, you need to implement and utilize
    custom data types within JAX''s framework. Here, the challenge is to integrate
    these custom types into JAX so that they can participate in JAX''s transformations
    while ensuring correct and efficient computation.    So to use custom data types,
    you can define a new data type by creating a subclass of jax.lax\_dtype or by
    using the jax.custom\_dtype mechanism. Just to flag: JAX isn''t set up to work
    with custom data types. As an alternative, you can simulate custom data types
    by representing them with standard types and overloading the necessary operations.
    As another option, you can use JAX''s support for custom JVPs (Jacobian-vector
    products) and VJPs (vector-Jacobian products) to define custom behavior during
    automatic differentiation for certain use cases.    In this recipe, we''ll explore
    how to implement custom data types using Custom VJP and Custom JVP functions,
    in order to define custom forward and backward behaviors for functions involving
    your specialized numerical types.    Simulating Custom Data Types    To begin
    with, our approach will be to simulate custom data types using existing types.
    For example, you can represent a fixed-point number using an integer type and
    define operations accordingly.    Suppose you want to implement fixed-point arithmetic
    with a specific scaling factor.      import jax    import jax.numpy as jnp   
    \# Define a fixed-point class    class FixedPoint:       def \_\_init\_\_(self,
    value, scale=1000):           self.value \= jnp.asarray(value)           self.scale
    \= scale       def to\_float(self):           return self.value / self.scale   
       def \_\_add\_\_(self, other):           return FixedPoint(self.value \+ other.value,
    self.scale)       def \_\_mul\_\_(self, other):           return FixedPoint((self.value
    \* other.value) // self.scale, self.scale)       # Add other necessary methods...   
    \# Example usage    a \= FixedPoint(1000)  \# Represents 1.0    b \= FixedPoint(2000) 
    \# Represents 2.0    c \= a \+ b  \# Represents 3.0    d \= a \* b  \# Represents
    2.0      Using JAX Custom Transforms    Now, to integrate custom operations with
    JAX, you can use jax.custom\_jvp or jax.custom\_vjp decorators to define custom
    forward and backward passes.    Suppose you have a function that operates on your
    custom data type, and you want to define how it should behave during differentiation.   
    Consider the following example of a custom square function:      @jax.custom\_jvp   
    def custom\_square(x):       return x \*\* 2    \# Define the custom JVP rule   
    @custom\_square.defjvp    def custom\_square\_jvp(primals, tangents):       x,
    \= primals       x\_dot, \= tangents       primal\_out \= custom\_square(x)   
        tangent\_out \= 2 \* x \* x\_dot  \# Derivative of x^2 is 2x       return
    primal\_out, tangent\_out    x \= jnp.array(3.0)    y \= custom\_square(x)   
    dy\_dx \= jax.grad(custom\_square)(x)    print("y \=", y)          # y \= 9.0   
    print("dy/dx \=", dy\_dx)  \# dy/dx \= 6.0      We also need to ensure that our
    custom data types can be used with JAX transformations. For this, let''s define
    a custom data type for fixed-point numbers that can be differentiated.       
     # Define JVP rules       @add.defjvp       def add\_jvp(primals, tangents):   
