    随后，我们转向对长时间运行的作业进行检查点，以防止因意外中断而导致训练进度丢失。该策略可确保训练能够从最近的检查点恢复，而不会有显著损失，从而增强了长时间训练会话的可靠性。本章还演示了如何将
