  fmt: "\n# Building Neural Network from Scratch\n\nThink of a situation where we\
    \ have to build a custom neural network from scratch with `JAX`, without using\
    \ high-level libraries like `Flax` or `Haiku`. Building a neural network like\
    \ this helps us understand how it works, which gives us more control over the\
    \ architecture and the training process. This recipe will show you how to build\
    \ a fully connected neural network, set its `parameters`, do the `forward` pass,\
    \ compute the `loss`, and integrate it with our Fashion MNIST dataset.\n\nTo build\
    \ a neural network in `JAX`, we just need to follow these steps:\n\nFirst, define\
    \ the architecture, including layers and activation functions. Start by initializing\
    \ the network `parameters` (`weights` and `biases`). Run the `forward` pass to\
    \ make the predictions. Then define the `loss` function for training. Integrate\
    \ the network with the Fashion MNIST dataset for training purposes.\n\n## Define\
    \ Neural Network Architecture\n\nWe will construct a simple feedforward neural\
    \ network with two hidden layers, using the `ReLU` activation function for hidden\
    \ layers and `softmax` for the output layer.\n\n```\nimport jax\nimport jax.numpy\
    \ as jnp\nfrom jax import random\n# Define the neural network architecture\ndef\
    \ init_params(layer_sizes, key):\n    \"\"\"Initialize network parameters (weights\
    \ and biases) for each layer.\"\"\"\n    params = []\n    for n_in, n_out in zip(layer_sizes[:-1],\
    \ layer_sizes[1:]):\n        key, subkey = random.split(key)\n        # Initialize\
    \ weights with small random values\n        weights = random.normal(subkey, (n_in,\
    \ n_out)) * 0.01\n        # Initialize biases with zeros\n        biases = jnp.zeros(n_out)\n\
    \        params.append((weights, biases))\n    return params\n# Define the layer\
    \ sizes: input -> hidden1 -> hidden2 -> output\nlayer_sizes = [28 * 28, 128, 64,\
    \ 10]  # Input: 784, Hidden1: 128, Hidden2: 64, Output: 10\n# Random key for initialization\n\
    key = random.PRNGKey(0)\n# Initialize parameters\nparams = init_params(layer_sizes,\
    \ key)\n```\n\nIn this setup, `layer_sizes` specifies the number of neurons in\
    \ each layer, with 784 input features (28x28 flattened image), two hidden layers\
    \ (128 and 64 neurons), and an output layer for 10 classes. We initialize the\
    \ `weights` with small random values and `biases` as zeros.\n\n## Implement Forward\
    \ Pass\n\nThe forward pass will compute the output of the network, given the input\
    \ data. We will use `ReLU` activation for the hidden layers and a `softmax` function\
    \ for the output layer.\n\n```\ndef relu(x):\n    \"\"\"ReLU activation function.\"\
    \"\"\n    return jnp.maximum(0, x)\ndef softmax(x):\n    \"\"\"Softmax activation\
    \ function.\"\"\"\n    exp_x = jnp.exp(x - jnp.max(x))\n    return exp_x / exp_x.sum(axis=1,\
    \ keepdims=True)\ndef forward(params, x):\n    \"\"\"Perform a forward pass through\
    \ the network.\"\"\"\n    # Flatten the input image\n    x = x.reshape((x.shape[0],\
    \ -1))\n    # Loop over each layer\n    for i, (weights, biases) in enumerate(params[:-1]):\n\
    \        # Linear transformation\n        x = jnp.dot(x, weights) + biases\n \
    \       # Apply ReLU activation for hidden layers\n        x = relu(x)\n    #\
    \ Final layer (output)\n    final_weights, final_biases = params[-1]\n    logits\
    \ = jnp.dot(x, final_weights) + final_biases\n    # Apply softmax activation to\
    \ get probabilities\n    return softmax(logits)\n```\n\nThe `forward` function\
    \ calculates the output of the network by sequentially applying linear transformations\
    \ (matrix multiplication and bias addition) and activation functions to each layer.\n\
    \n## Define Loss Function\n\nWe will use the cross-entropy `loss` to measure the\
    \ difference between the predicted probabilities and the true labels.\n\n```\n\
    def cross_entropy_loss(params, x, y):\n    \"\"\"Compute the cross-entropy loss.\"\
    \"\"\n    preds = forward(params, x)\n    # Convert labels to one-hot encoding\n\
    \    y_one_hot = jax.nn.one_hot(y, num_classes=10)\n    # Compute the average\
    \ cross-entropy loss\n    loss = -jnp.mean(jnp.sum(y_one_hot * jnp.log(preds +\
    \ 1e-8), axis=1))\n    return loss\n```\n\nIn this function, we calculate the\
    \ `loss` by computing the negative log of the predicted probabilities corresponding\
    \ to the true labels and averaging it over the batch.\n\n## Implement Parameter\
    \ Update using Gradient Descent\n\nNext, we will update the `parameters` using\
    \ stochastic gradient descent (`SGD`). We calculate the gradients of the `loss`\
    \ function with respect to the `parameters` and update the `weights` and `biases`\
    \ accordingly.\n\n```\ndef sgd_update(params, grads, learning_rate):\n    \"\"\
    \"Update parameters using SGD.\"\"\"\n    new_params = []\n    for (w, b), (dw,\
    \ db) in zip(params, grads):\n        # Update weights and biases\n        new_w\
    \ = w - learning_rate * dw\n        new_b = b - learning_rate * db\n        new_params.append((new_w,\
    \ new_b))\n    return new_params\n```\n\n## Train Neural Network\n\nNow we can\
    \ set up the training loop to train the model using the Fashion MNIST dataset.\n\
    \n```\nlearning_rate = 0.01\nnum_epochs = 10\n# Function to compute gradients\n\
    grad_loss = jax.grad(cross_entropy_loss)\ndef train_network(train_ds, params,\
    \ num_epochs):\n    for epoch in range(num_epochs):\n        epoch_loss = 0\n\
    \        for batch in train_ds:\n            images, labels = batch\n        \
    \    # Compute gradients\n            grads = grad_loss(params, images, labels)\n\
    \            # Update parameters\n            params = sgd_update(params, grads,\
    \ learning_rate)\n            # Compute batch loss\n            batch_loss = cross_entropy_loss(params,\
    \ images, labels)\n            epoch_loss += batch_loss\n        print(f\"Epoch\
    \ {epoch + 1}, Loss: {epoch_loss}\")\n    return params\n# Train the network\n\
    trained_params = train_network(train_ds, params, num_epochs)\n```\n\nThis training\
    \ loop iterates over the dataset for a specified number of `epochs`, computes\
    \ the gradients of the `loss` function with respect to the network `parameters`,\
    \ updates the `parameters` using `SGD`, and prints the `loss` after each `epoch`.\n\
    \n## Evaluate Trained Model\n\nTo evaluate the model's performance, we will use\
    \ the test dataset to measure `accuracy`.\n\n```\ndef compute_accuracy(params,\
    \ test_ds):\n    correct = 0\n    total = 0\n    for batch in test_ds:\n     \
    \   images, labels = batch\n        # Perform the forward pass to get predictions\n\
    \        preds = forward(params, images)\n        # Get the predicted class by\
    \ taking the argmax\n        predicted_class = jnp.argmax(preds, axis=1)\n   \
    \     # Count correct predictions\n        correct += jnp.sum(predicted_class\
    \ == labels)\n        total += labels.shape[0]\n    accuracy = correct / total\n\
    \    return accuracy\n# Evaluate the trained model\naccuracy = compute_accuracy(trained_params,\
    \ test_ds)\nprint(f\"Test Accuracy: {accuracy * 100:.2f}%\")\n```\n\nThis evaluation\
    \ function computes the model's `accuracy` on the test dataset by comparing the\
    \ predicted class with the true labels.\n\nThis solution showed us how to set\
    \ up a training loop for the Fashion MNIST dataset and get a basic level of performance,\
    \ which we can improve by using more advanced techniques like better initialization,\
    \ regularization, and different optimization algorithms.\n"
  trans: "\n# 从零构建神经网络\n\n设想一种情况，我们需要使用 `JAX` 从零开始构建一个自定义神经网络，而不使用 `Flax` 或 `Haiku`\
    \ 等高级库。像这样构建神经网络有助于我们理解其工作原理，从而对架构和训练过程有更大的控制权。本教程将展示如何构建一个全连接神经网络，设置其 `parameters`，执行\
    \ `forward` 前向传播，计算 `loss`，并将其与 Fashion MNIST 数据集集成。\n\n在 `JAX` 中构建神经网络，我们只需遵循以下步骤：\n\
    \n首先，定义架构，包括层和激活函数。首先初始化网络 `parameters`（`weights` 和 `biases`）。运行 `forward` 前向传播以进行预测。然后为训练定义\
    \ `loss` 函数。将网络与 Fashion MNIST 数据集集成用于训练目的。\n\n## 定义神经网络架构\n\n我们将构建一个简单的 feedforward\
    \ 神经网络，具有两个隐藏层，使用 `ReLU` 激活函数处理隐藏层，并使用 `softmax` 处理输出层。\n\n```\nimport jax\nimport\
    \ jax.numpy as jnp\nfrom jax import random\n# Define the neural network architecture\n\
    def init_params(layer_sizes, key):\n    \"\"\"Initialize network parameters (weights\
    \ and biases) for each layer.\"\"\"\n    params = []\n    for n_in, n_out in zip(layer_sizes[:-1],\
    \ layer_sizes[1:]):\n        key, subkey = random.split(key)\n        # Initialize\
    \ weights with small random values\n        weights = random.normal(subkey, (n_in,\
    \ n_out)) * 0.01\n        # Initialize biases with zeros\n        biases = jnp.zeros(n_out)\n\
    \        params.append((weights, biases))\n    return params\n# Define the layer\
    \ sizes: input -> hidden1 -> hidden2 -> output\nlayer_sizes = [28 * 28, 128, 64,\
    \ 10]  # Input: 784, Hidden1: 128, Hidden2: 64, Output: 10\n# Random key for initialization\n\
    key = random.PRNGKey(0)\n# Initialize parameters\nparams = init_params(layer_sizes,\
    \ key)\n```\n\n在此设置中，`layer_sizes` 指定了每层的神经元数量，其中有 784 个输入特征（28x28 展平图像），两个隐藏层（128\
    \ 和 64 个神经元），以及用于 10 个类别的输出层。我们使用小的随机值初始化 `weights`，并将 `biases` 初始化为零。\n\n## 实现前向传播\n\
    \n前向传播将根据输入数据计算网络的输出。我们将对隐藏层使用 `ReLU` 激活函数，并对输出层使用 `softmax` 函数。\n\n```\ndef relu(x):\n\
    \    \"\"\"ReLU activation function.\"\"\"\n    return jnp.maximum(0, x)\ndef\
    \ softmax(x):\n    \"\"\"Softmax activation function.\"\"\"\n    exp_x = jnp.exp(x\
    \ - jnp.max(x))\n    return exp_x / exp_x.sum(axis=1, keepdims=True)\ndef forward(params,\
    \ x):\n    \"\"\"Perform a forward pass through the network.\"\"\"\n    # Flatten\
    \ the input image\n    x = x.reshape((x.shape[0], -1))\n    # Loop over each layer\n\
    \    for i, (weights, biases) in enumerate(params[:-1]):\n        # Linear transformation\n\
    \        x = jnp.dot(x, weights) + biases\n        # Apply ReLU activation for\
    \ hidden layers\n        x = relu(x)\n    # Final layer (output)\n    final_weights,\
    \ final_biases = params[-1]\n    logits = jnp.dot(x, final_weights) + final_biases\n\
    \    # Apply softmax activation to get probabilities\n    return softmax(logits)\n\
    ```\n\n`forward` 函数通过对每一层依次应用线性变换（矩阵乘法和偏置加法）以及激活函数来计算网络的输出。\n\n## 定义损失函数\n\n我们将使用交叉熵\
    \ `loss` 来衡量预测概率与真实标签之间的差异。\n\n```\ndef cross_entropy_loss(params, x, y):\n  \
    \  \"\"\"Compute the cross-entropy loss.\"\"\"\n    preds = forward(params, x)\n\
    \    # Convert labels to one-hot encoding\n    y_one_hot = jax.nn.one_hot(y, num_classes=10)\n\
    \    # Compute the average cross-entropy loss\n    loss = -jnp.mean(jnp.sum(y_one_hot\
    \ * jnp.log(preds + 1e-8), axis=1))\n    return loss\n```\n\n在此函数中，我们通过计算与真实标签对应的预测概率的负对数并在批次上取平均来计算\
    \ `loss`。\n\n## 使用梯度下降实现参数更新\n\n接下来，我们将使用随机梯度下降（`SGD`）更新 `parameters`。我们计算 `loss`\
    \ 函数相对于 `parameters` 的梯度，并相应地更新 `weights` 和 `biases`。\n\n```\ndef sgd_update(params,\
    \ grads, learning_rate):\n    \"\"\"Update parameters using SGD.\"\"\"\n    new_params\
    \ = []\n    for (w, b), (dw, db) in zip(params, grads):\n        # Update weights\
    \ and biases\n        new_w = w - learning_rate * dw\n        new_b = b - learning_rate\
    \ * db\n        new_params.append((new_w, new_b))\n    return new_params\n```\n\
    \n## 训练神经网络\n\n现在我们可以使用 Fashion MNIST 数据集设置训练循环来训练模型。\n\n```\nlearning_rate =\
    \ 0.01\nnum_epochs = 10\n# Function to compute gradients\ngrad_loss = jax.grad(cross_entropy_loss)\n\
    def train_network(train_ds, params, num_epochs):\n    for epoch in range(num_epochs):\n\
    \        epoch_loss = 0\n        for batch in train_ds:\n            images, labels\
    \ = batch\n            # Compute gradients\n            grads = grad_loss(params,\
    \ images, labels)\n            # Update parameters\n            params = sgd_update(params,\
    \ grads, learning_rate)\n            # Compute batch loss\n            batch_loss\
    \ = cross_entropy_loss(params, images, labels)\n            epoch_loss += batch_loss\n\
    \        print(f\"Epoch {epoch + 1}, Loss: {epoch_loss}\")\n    return params\n\
    # Train the network\ntrained_params = train_network(train_ds, params, num_epochs)\n\
    ```\n\n此训练循环在指定的 `epochs` 次数内遍历数据集，计算 `loss` 函数相对于网络 `parameters` 的梯度，使用 `SGD`\
    \ 更新 `parameters`，并在每个 `epoch` 之后打印 `loss`。\n\n## 评估训练好的模型\n\n为了评估模型的性能，我们将使用测试数据集来衡量\
    \ `accuracy`。\n\n```\ndef compute_accuracy(params, test_ds):\n    correct = 0\n\
    \    total = 0\n    for batch in test_ds:\n        images, labels = batch\n  \
    \      # Perform the forward pass to get predictions\n        preds = forward(params,\
    \ images)\n        # Get the predicted class by taking the argmax\n        predicted_class\
    \ = jnp.argmax(preds, axis=1)\n        # Count correct predictions\n        correct\
    \ += jnp.sum(predicted_class == labels)\n        total += labels.shape[0]\n  \
    \  accuracy = correct / total\n    return accuracy\n# Evaluate the trained model\n\
    accuracy = compute_accuracy(trained_params, test_ds)\nprint(f\"Test Accuracy:\
    \ {accuracy * 100:.2f}%\")\n```\n\n此评估函数通过将预测类别与真实标签进行比较来计算模型在测试数据集上的 `accuracy`。\n\
    \n此解决方案向我们展示了如何为 Fashion MNIST 数据集设置训练循环并获得基本水平的性能，我们可以通过使用更高级的技术（如更好的初始化、正则化和不同的优化算法）来改进性能。\n"
