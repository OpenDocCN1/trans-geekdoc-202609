  fmt: "\n# Ensuring Numerical Stability During Transition\n\nAfter migrating a machine\
    \ learning model from `NumPy` to `Google JAX` for the `Fashion-MNIST` dataset,\
    \ numerical instability issues have been observed. These issues manifest as unexpected\
    \ `NaN` (Not a Number) or infinite values during computations, which can halt\
    \ training or produce incorrect results. Such instability may arise due to differences\
    \ in how `JAX` handles data types and arithmetic operations compared to `NumPy`.\
    \ Specifically, `JAX`'s type promotion semantics can lead to unintended data type\
    \ conversions, affecting the precision and stability of calculations. The challenge\
    \ is to understand these differences and manage data types effectively to ensure\
    \ stable and reliable computations in `JAX`.\n\nIn order to address the issue\
    \ of numerical instability that has been observed subsequent to the transition\
    \ to `JAX`, it is essential to have a clear understanding of the type promotion\
    \ semantics employed by `JAX` and how these differ from the behaviour exhibited\
    \ by `NumPy`. The numerical stability of computations may be achieved by the management\
    \ of data types in an explicit manner, with the guarantee of consistent precision.\
    \ This procedure entails an examination of the data types associated with arrays\
    \ and variables, the designation of appropriate data types when required, and\
    \ a cautious approach to operations that may result in unintended type promotions.\n\
    \n## Understanding JAX's Type Promotion Semantics\n\n`JAX` follows specific rules\
    \ for type promotion during arithmetic operations, which can differ from `NumPy`'s\
    \ rules. In `JAX`, operations involving mixed precision can result in upcasting\
    \ to higher precision types, potentially leading to increased memory usage and\
    \ precision issues. For example, combining a `float32` array with a `float64`\
    \ scalar may promote the result to affecting computational efficiency and stability.\n\
    \n### Inspecting Data Types\n\nThe initial step is to ascertain the data types\
    \ of all input arrays and variables that are involved in computations. It is essential\
    \ to guarantee that these values are of the desired precision, which is typically\
    \ `float32` for neural networks.\n\n```\nimport jax.numpy as jnp\n# Inspect data\
    \ types\nprint(f\"Data type of training images: {train_images.dtype}\")\nprint(f\"\
    Data type of training labels: {train_labels.dtype}\")\n```\n\nIf the data types\
    \ are not as expected, convert them explicitly.\n\n### Converting Data Types Explicitly\n\
    \nNext, convert arrays to the desired data type using\n\n```\n# Convert data types\
    \ to float32\ntrain_images = train_images.astype(jnp.float32)\ntest_images = test_images.astype(jnp.float32)\n\
    # Convert labels to int32 if necessary\ntrain_labels = train_labels.astype(jnp.int32)\n\
    test_labels = test_labels.astype(jnp.int32)\n```\n\n### Initializing Model Parameters\
    \ with Consistent Types\n\nNow, when initializing model parameters such as weights\
    \ and biases, you need to specify the data type to ensure consistency.\n\n```\n\
    from jax import random\nkey = random.PRNGKey(seed)\n# Initialize weights and biases\
    \ with float32 data type\nW1 = random.normal(key, (input_size, hidden_size), dtype=jnp.float32)\
    \ * 0.01\nb1 = jnp.zeros((hidden_size,), dtype=jnp.float32)\nW2 = random.normal(key,\
    \ (hidden_size, output_size), dtype=jnp.float32) * 0.01\nb2 = jnp.zeros((output_size,),\
    \ dtype=jnp.float32)\n```\n\n### Ensuring Consistent Data Types in Computations\n\
    \nHere, in the model's forward pass and loss computations, ensure that operations\
    \ are performed with consistent data types.\n\n```\ndef forward_pass(params, x):\n\
    \    W1, b1, W2, b2 = params\n    x = x.astype(jnp.float32)\n    z1 = jnp.dot(x,\
    \ W1) + b1\n    a1 = relu(z1)\n    z2 = jnp.dot(a1, W2) + b2\n    y_pred = softmax(z2)\n\
    \    return y_pred\n```\n\n### Handling Division and Logarithmic Operations\n\n\
    It is important to exercise caution when performing operations such as division\
    \ and logarithms, as they can potentially introduce numerical instability if not\
    \ handled correctly. It is advisable to add minor constants (`ε`) to the denominators\
    \ or arguments of logarithms in order to preclude division by zero or the calculation\
    \ of the logarithm of zero.\n\n```\nepsilon = 1e-7\ndef compute_loss(params, x,\
    \ y):\n    y_pred = forward_pass(params, x)\n    m = y.shape[0]\n    y_pred =\
    \ jnp.clip(y_pred, epsilon, 1.0 - epsilon)\n    log_likelihood = -jnp.log(y_pred[jnp.arange(m),\
    \ y])\n    loss = jnp.mean(log_likelihood)\n    return loss\n```\n\nNow here,\
    \ be cautious with operations that involve literals or constants. For example,\
    \ dividing by an integer literal can cause unintended type promotion.\n\n```\n\
    # Potential unintended promotion to float64\nresult = array / 255\n# Corrected\
    \ to maintain float32\nresult = array / 255.0\n```\n\nEnsure that constants are\
    \ specified as floats when necessary.\n\n### Using JAX's Type Promotion Rules\
    \ and Monitoring NaNs\n\nUnderstand that `JAX` promotes types based on certain\
    \ rules. For instance, operations between `float16` and `float32` promote to Use\
    \ this knowledge to control the precision of computations.\n\n```\n# Ensuring\
    \ operations stay in float32\narray1 = array1.astype(jnp.float32)\narray2 = array2.astype(jnp.float32)\n\
    result = array1 + array2\n```\n\nAfter computations, check for the presence of\
    \ `NaN` or infinite values, which indicate numerical instability.\n\n```\n# Checking\
    \ for NaNs and infinities\nif jnp.isnan(loss) or jnp.isinf(loss):\n    print(\"\
    Numerical instability detected in loss computation.\")\n```\n\nIf detected, investigate\
    \ the preceding computations to identify the source.\n\n### Implementing Gradient\
    \ Clipping\n\nDuring training, large gradients can cause updates that lead to\
    \ numerical instability. Apply gradient clipping to limit the magnitude of gradients.\n\
    \n```\nfrom jax import tree_util\ndef clip_grads(grads, max_norm):\n    total_norm\
    \ = jnp.sqrt(sum([jnp.sum(jnp.square(g)) for g in tree_util.tree_leaves(grads)]))\n\
    \    clip_coef = jnp.minimum(1.0, max_norm / (total_norm + 1e-6))\n    grads =\
    \ tree_util.tree_map(lambda g: g * clip_coef, grads)\n    return grads\n# Applying\
    \ gradient clipping during the update\ngrads = grad_loss(params, x_batch, y_batch)\n\
    grads = clip_grads(grads, max_norm=1.0)\n```\n\nIf numerical instability persists,\
    \ consider using higher precision data types like `float64` for critical computations.\
    \ However, be aware that this increases memory usage and computation time.\n\n\
    ```\n# Using float64 for critical computations\nx = x.astype(jnp.float64)\n```\n\
    \nTo ensure consistency, it is imperative that all related variables be converted\
    \ to `float64`.\n"
  trans: "\n# 在迁移过程中确保数值稳定性\n\n在将机器学习模型从 `NumPy` 迁移到 `Google JAX` 用于 `Fashion-MNIST`\
    \ 数据集后，观察到数值不稳定问题。这些问题表现为计算过程中出现意外的 `NaN` (Not a Number) 或无穷值，这可能会中断训练或产生错误结果。这种不稳定性可能源于\
    \ `JAX` 处理数据类型和算术运算的方式与 `NumPy` 不同。具体来说，`JAX` 的类型提升语义可能导致意外的 数据类型转换，影响计算的精度和稳定性。挑战在于理解这些差异并有效管理数据类型，以确保在\
    \ `JAX` 中进行稳定可靠的计算。\n\n为了应对迁移到 `JAX` 后观察到的数值不稳定问题，清楚地理解 `JAX` 使用的类型提升语义以及其与 `NumPy`\
    \ 表现的行为有何不同至关重要。通过以显式方式管理数据类型并保证一致的精度，可以实现计算的数值稳定性。此过程涉及检查数组和变量相关的数据类型、在需要时指定适当的数据类型，以及谨慎对待可能导致意外类型提升的操作。\n\
    \n## 理解 JAX 的类型提升语义\n\n`JAX` 在算术运算期间遵循特定的类型提升规则，这可能与 `NumPy` 的规则不同。在 `JAX` 中，涉及混合精度的操作可能导致提升到更高精度类型，可能导致内存使用增加和精度问题。例如，将\
    \ `float32` 数组与 `float64` 标量结合可能将结果提升到影响计算效率和稳定性。\n\n### 检查数据类型\n\n第一步是确定参与计算的所有输入数组和变量的数据类型。必须保证这些值的精度为期望值，对于神经网络通常为\
    \ `float32`。\n\n```\nimport jax.numpy as jnp\n# Inspect data types\nprint(f\"\
    Data type of training images: {train_images.dtype}\")\nprint(f\"Data type of training\
    \ labels: {train_labels.dtype}\")\n```\n\n如果数据类型不符合预期，请显式转换它们。\n\n### 显式转换数据类型\n\
    \n接下来，使用以下方法将数组转换为所需的数据类型\n\n```\n# Convert data types to float32\ntrain_images\
    \ = train_images.astype(jnp.float32)\ntest_images = test_images.astype(jnp.float32)\n\
    # Convert labels to int32 if necessary\ntrain_labels = train_labels.astype(jnp.int32)\n\
    test_labels = test_labels.astype(jnp.int32)\n```\n\n### 使用一致的类型初始化模型参数\n\n现在，在初始化模型参数（如权重和偏置）时，需要指定数据类型以确保一致性。\n\
    \n```\nfrom jax import random\nkey = random.PRNGKey(seed)\n# Initialize weights\
    \ and biases with float32 data type\nW1 = random.normal(key, (input_size, hidden_size),\
    \ dtype=jnp.float32) * 0.01\nb1 = jnp.zeros((hidden_size,), dtype=jnp.float32)\n\
    W2 = random.normal(key, (hidden_size, output_size), dtype=jnp.float32) * 0.01\n\
    b2 = jnp.zeros((output_size,), dtype=jnp.float32)\n```\n\n### 确保计算中数据类型一致\n\n\
    在这里，在模型的正向传递和损失计算中，确保操作以一致的数据类型执行。\n\n```\ndef forward_pass(params, x):\n    W1,\
    \ b1, W2, b2 = params\n    x = x.astype(jnp.float32)\n    z1 = jnp.dot(x, W1)\
    \ + b1\n    a1 = relu(z1)\n    z2 = jnp.dot(a1, W2) + b2\n    y_pred = softmax(z2)\n\
    \    return y_pred\n```\n\n### 处理除法和对数运算\n\n执行除法和对数等操作时必须谨慎，因为如果处理不当，它们可能会引入数值不稳定。建议在分母或对数参数中添加微小常数（`ε`）以防止除零或计算零的对数。\n\
    \n```\nepsilon = 1e-7\ndef compute_loss(params, x, y):\n    y_pred = forward_pass(params,\
    \ x)\n    m = y.shape[0]\n    y_pred = jnp.clip(y_pred, epsilon, 1.0 - epsilon)\n\
    \    log_likelihood = -jnp.log(y_pred[jnp.arange(m), y])\n    loss = jnp.mean(log_likelihood)\n\
    \    return loss\n```\n\n现在，在这里，请注意涉及文字或常量的操作。例如，用整数文字除法可能会导致意外的类型提升。\n\n```\n\
    # Potential unintended promotion to float64\nresult = array / 255\n# Corrected\
    \ to maintain float32\nresult = array / 255.0\n```\n\n确保在必要时将常量指定为浮点数。\n\n###\
    \ 使用 JAX 的类型提升规则并监控 NaN\n\n了解 `JAX` 根据某些规则提升类型。例如，`float16` 和 `float32` 之间的操作提升到使用此知识来控制计算的精度。\n\
    \n```\n# Ensuring operations stay in float32\narray1 = array1.astype(jnp.float32)\n\
    array2 = array2.astype(jnp.float32)\nresult = array1 + array2\n```\n\n计算后，检查是否存在\
    \ `NaN` 或无穷值，这表明数值不稳定。\n\n```\n# Checking for NaNs and infinities\nif jnp.isnan(loss)\
    \ or jnp.isinf(loss):\n    print(\"Numerical instability detected in loss computation.\"\
    )\n```\n\n如果检测到，请调查之前的计算以确定来源。\n\n### 实现梯度裁剪\n\n在训练期间，大的梯度可能会导致更新，从而导致数值不稳定。应用梯度裁剪以限制梯度的大小。\n\
    \n```\nfrom jax import tree_util\ndef clip_grads(grads, max_norm):\n    total_norm\
    \ = jnp.sqrt(sum([jnp.sum(jnp.square(g)) for g in tree_util.tree_leaves(grads)]))\n\
    \    clip_coef = jnp.minimum(1.0, max_norm / (total_norm + 1e-6))\n    grads =\
    \ tree_util.tree_map(lambda g: g * clip_coef, grads)\n    return grads\n# Applying\
    \ gradient clipping during the update\ngrads = grad_loss(params, x_batch, y_batch)\n\
    grads = clip_grads(grads, max_norm=1.0)\n```\n\n如果数值不稳定性仍然存在，请考虑对关键计算使用更高精度的数据类型，如\
    \ `float64`。但是，请注意，这会增加内存使用和计算时间。\n\n```\n# Using float64 for critical computations\n\
    x = x.astype(jnp.float64)\n```\n\n为了确保一致性，相关变量必须全部转换为 `float64`。\n"
