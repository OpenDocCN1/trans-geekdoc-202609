- raw: "Overview    In this chapter, we are going to dive right in and look at how\
    \ to integrate foreign functions (FFI) within JAX to give you the best of the\
    \ both worlds: enhanced functionality and performance, all in one neat package,\
    \ in your machine learning models. We start by showing you how to call external\
    \ C libraries directly from JAX. This lets you use optimized existing code for\
    \ specific computations that aren't in JAX's standard library.    Next, we'll\
    \ show you how to optimize performance using custom CUDA kernels. Standard operations\
    \ simply don't cut it when it comes to GPU computations. That's why writing custom\
    \ CUDA kernels is essential. We will show you how to create and integrate these\
    \ kernels via FFI to get the best performance on your GPU hardware. We also tackle\
    \ the issue of data conversion between JAX and external code head-on. Furthermore,\
    \ we will show you how to manage thread safety and concurrency, which is crucial\
    \ when working with external libraries that may not be thread-safe by default.\
    \    Finally, we will show you how to distribute computations across heterogeneous\
    \ systems. You can optimize computations across different hardware resources effectively\
    \ by leveraging JAX's capabilities alongside external functions.    \n\n  Calling\
    \ External C Libraries    While you're building machine learning models with JAX,\
    \ you might find yourself needing to use existing C libraries for specific calculations\
    \ that aren't available or efficient in JAX. These libraries might have some pretty\
    \ specialized algorithms, legacy code, or highly optimized functions that can\
    \ really boost your model's performance. The tricky part is making sure that JAX\
    \ and C code work well together. We need to make sure that JAX's JIT compilation\
    \ and automatic differentiation work with C code, but we also need to make sure\
    \ that it's efficient.    JAX has ways to call external C functions using its\
    \ Foreign Function Interface (FFI). You can use ctypes or cffi in Python to wrap\
    \ C functions and make them accessible within JAX computations. You can also create\
    \ your own JAX primitives to connect with these C functions. This lets you add\
    \ them to JAX's computation graph, and it also allows JIT compilation and differentiation.\
    \    Prepare C Library    Let's assume you have a C function that computes the\
    \ element-wise exponential of an array.      // custom\\_math.c    #include  \
    \   void custom\\_exp(int n, const double\\* x, double\\* y) {        for (int\
    \ i \\= 0; i < n; ++i) {           y\\[i\\] \\= exp(x\\[i\\]);       }    }   \
    \   Next, compile the C code to create a shared library file on Linux).      gcc\
    \ \\-shared \\-fPIC \\-o libcustom\\_math.so custom\\_math.c      Next, load the\
    \ C library in Python using      import ctypes    import numpy as np    \\# Load\
    \ the shared library    lib \\= ctypes.CDLL('./libcustom\\_math.so')    \\# Define\
    \ the argument and return types of the function    lib.custom\\_exp.argtypes \\\
    = \\[       ctypes.c\\_int,       np.ctypeslib.ndpointer(dtype=np.float64, ndim=1,\
    \ flags='C\\_CONTIGUOUS'),       np.ctypeslib.ndpointer(dtype=np.float64, ndim=1,\
    \ flags='C\\_CONTIGUOUS')    \\]    lib.custom\\_exp.restype \\= None      Define\
    \ Wrapper Function in Python    We need to create a Python function that wraps\
    \ the C function.      def custom\\_exp\\_c(x):       x\\_np \\= np.ascontiguousarray(x,\
    \ dtype=np.float64)       y\\_np \\= np.empty\\_like(x\\_np)       n \\= x\\_np.size\
    \       lib.custom\\_exp(n, x\\_np, y\\_np)       return y\\_np      Integrate\
    \ with JAX using ‘jax.experimental.callback’    Since JAX does not natively support\
    \ calling arbitrary Python functions within JIT-compiled code, you can use jax.experimental.callback\
    \ (available in JAX versions \\>= 0.2.12).      import jax    from jax.experimental\
    \ import callback as jec    @jax.custom\\_vjp    def custom\\_exp(x):       def\
    \ forward(x):           y \\= jec.call(custom\\_exp\\_c, x, output\\_shape=x.shape)\
    \           return y       def backward(res, g):           return (g \\* custom\\\
    _exp(x),)       return forward(x), backward    \\# Define the forward and backward\
    \ passes    def custom\\_exp\\_fwd(x):       y \\= jec.call(custom\\_exp\\_c,\
    \ x, output\\_shape=x.shape)        return y, y  \\# Return y as residual for\
    \ backward    def custom\\_exp\\_bwd(res, g):       y \\= res        return (g\
    \ \\* y,)  \\# Derivative of exp(x) is exp(x)    custom\\_exp.defvjp(custom\\\
    _exp\\_fwd, custom\\_exp\\_bwd)      Next, test the custom function:      import\
    \ jax.numpy as jnp    \\# Sample input    x \\= jnp.array(\\[0.0, 1.0, 2.0\\],\
    \ dtype=jnp.float64)    \\# Call the custom\\_exp function    y \\= custom\\_exp(x)\
    \    print(\"y \\=\", y)    \\# Compute the gradient    grad\\_fn \\= jax.grad(lambda\
    \ x: jnp.sum(custom\\_exp(x)))    grad\\_value \\= grad\\_fn(x)    print(\"grad\\\
    _value \\=\", grad\\_value)      Next, use the function with JIT compilation:\
    \      @jax.jit    def compute\\_custom\\_exp(x):       return custom\\_exp(x)\
    \    y\\_jit \\= compute\\_custom\\_exp(x)    print(\"y\\_jit \\=\", y\\_jit)\
    \      Here, the use of jax.experimental.callback may introduce performance overhead\
    \ due to data transfer between the device and host. The external function is executed\
    \ on the CPU, which may not be optimal if the rest of your computation is on the\
    \ GPU.    Handling Data Types and Shapes    Just make sure that the data types\
    \ and shapes are compatible between JAX and the C function. Just use np.ascontiguousarray\
    \ to make sure the memory is contiguous. Make sure you match up the data types\
    \ (e.g., np.float64 in both JAX and C).    Next, You can now use      def model(x):\
    \       return custom\\_exp(x) \\+ x    \\# Compute gradient    grad\\_model \\\
    = jax.grad(lambda x: jnp.sum(model(x)))    grad\\_value \\= grad\\_model(x)   \
    \ print(\"Model grad\\_value \\=\", grad\\_value)      You can use JAX's FFI capabilities\
    \ and jax.experimental.callback to integrate external C libraries into your JAX\
    \ computations. This approach lets you use optimized C code in your models, which\
    \ can extend functionality and potentially improve performance. There are some\
    \ limits to how well this works on GPUs and there might be some overhead, but\
    \ it's a pretty good way of connecting C code with JAX.    "
  fmt: "\n# Overview\n\nIn this chapter, we are going to dive right in and look at\
    \ how to integrate foreign functions (FFI) within `JAX` to give you the best of\
    \ the both worlds: enhanced functionality and performance, all in one neat package,\
    \ in your machine learning models. We start by showing you how to call external\
    \ C libraries directly from `JAX`. This lets you use optimized existing code for\
    \ specific computations that aren't in `JAX`'s standard library.\n\nNext, we'll\
    \ show you how to optimize performance using custom CUDA kernels. Standard operations\
    \ simply don't cut it when it comes to GPU computations. That's why writing custom\
    \ CUDA kernels is essential. We will show you how to create and integrate these\
    \ kernels via FFI to get the best performance on your GPU hardware. We also tackle\
    \ the issue of data conversion between `JAX` and external code head-on. Furthermore,\
    \ we will show you how to manage thread safety and concurrency, which is crucial\
    \ when working with external libraries that may not be thread-safe by default.\n\
    \nFinally, we will show you how to distribute computations across heterogeneous\
    \ systems. You can optimize computations across different hardware resources effectively\
    \ by leveraging `JAX`'s capabilities alongside external functions.\n\n## Calling\
    \ External C Libraries\n\nWhile you're building machine learning models with `JAX`,\
    \ you might find yourself needing to use existing C libraries for specific calculations\
    \ that aren't available or efficient in `JAX`. These libraries might have some\
    \ pretty specialized algorithms, legacy code, or highly optimized functions that\
    \ can really boost your model's performance. The tricky part is making sure that\
    \ `JAX` and C code work well together. We need to make sure that `JAX`'s JIT compilation\
    \ and automatic differentiation work with C code, but we also need to make sure\
    \ that it's efficient.\n\n`JAX` has ways to call external C functions using its\
    \ Foreign Function Interface (FFI). You can use `ctypes` or `cffi` in Python to\
    \ wrap C functions and make them accessible within `JAX` computations. You can\
    \ also create your own `JAX` primitives to connect with these C functions. This\
    \ lets you add them to `JAX`'s computation graph, and it also allows JIT compilation\
    \ and differentiation.\n\n### Prepare C Library\n\nLet's assume you have a C function\
    \ that computes the element-wise exponential of an array.\n\n```c\n// custom_math.c\n\
    #include <math.h>\nvoid custom_exp(int n, const double* x, double* y) {\n    for\
    \ (int i = 0; i < n; ++i) {\n        y[i] = exp(x[i]);\n    }\n}\n```\n\nNext,\
    \ compile the C code to create a shared library file on Linux):\n\n```bash\ngcc\
    \ -shared -fPIC -o libcustom_math.so custom_math.c\n```\n\nNext, load the C library\
    \ in Python using\n\n```python\nimport ctypes\nimport numpy as np\n# Load the\
    \ shared library\nlib = ctypes.CDLL('./libcustom_math.so')\n# Define the argument\
    \ and return types of the function\nlib.custom_exp.argtypes = [\n    ctypes.c_int,\n\
    \    np.ctypeslib.ndpointer(dtype=np.float64, ndim=1, flags='C_CONTIGUOUS'),\n\
    \    np.ctypeslib.ndpointer(dtype=np.float64, ndim=1, flags='C_CONTIGUOUS')\n\
    ]\nlib.custom_exp.restype = None\n```\n\n### Define Wrapper Function in Python\n\
    \nWe need to create a Python function that wraps the C function.\n\n```python\n\
    def custom_exp_c(x):\n    x_np = np.ascontiguousarray(x, dtype=np.float64)\n \
    \   y_np = np.empty_like(x_np)\n    n = x_np.size\n    lib.custom_exp(n, x_np,\
    \ y_np)\n    return y_np\n```\n\n### Integrate with JAX using `jax.experimental.callback`\n\
    \nSince `JAX` does not natively support calling arbitrary Python functions within\
    \ JIT-compiled code, you can use `jax.experimental.callback` (available in `JAX`\
    \ versions `>= 0.2.12`).\n\n```python\nimport jax\nfrom jax.experimental import\
    \ callback as jec\n\n@jax.custom_vjp\ndef custom_exp(x):\n    def forward(x):\n\
    \        y = jec.call(custom_exp_c, x, output_shape=x.shape)\n        return y\n\
    \    def backward(res, g):\n        return (g * custom_exp(x),)\n    return forward(x),\
    \ backward\n```\n\nDefine the forward and backward passes\n\n```python\ndef custom_exp_fwd(x):\n\
    \    y = jec.call(custom_exp_c, x, output_shape=x.shape)\n    return y, y  # Return\
    \ y as residual for backward\n\ndef custom_exp_bwd(res, g):\n    y = res\n   \
    \ return (g * y,)  # Derivative of exp(x) is exp(x)\n\ncustom_exp.defvjp(custom_exp_fwd,\
    \ custom_exp_bwd)\n```\n\nNext, test the custom function:\n\n```python\nimport\
    \ jax.numpy as jnp\n# Sample input\nx = jnp.array([0.0, 1.0, 2.0], dtype=jnp.float64)\n\
    # Call the custom_exp function\ny = custom_exp(x)\nprint(\"y =\", y)\n# Compute\
    \ the gradient\ngrad_fn = jax.grad(lambda x: jnp.sum(custom_exp(x)))\ngrad_value\
    \ = grad_fn(x)\nprint(\"grad_value =\", grad_value)\n```\n\nNext, use the function\
    \ with JIT compilation:\n\n```python\n@jax.jit\ndef compute_custom_exp(x):\n \
    \   return custom_exp(x)\n\ny_jit = compute_custom_exp(x)\nprint(\"y_jit =\",\
    \ y_jit)\n```\n\nHere, the use of `jax.experimental.callback` may introduce performance\
    \ overhead due to data transfer between the device and host. The external function\
    \ is executed on the CPU, which may not be optimal if the rest of your computation\
    \ is on the GPU.\n\n### Handling Data Types and Shapes\n\nJust make sure that\
    \ the data types and shapes are compatible between `JAX` and the C function. Just\
    \ use `np.ascontiguousarray` to make sure the memory is contiguous. Make sure\
    \ you match up the data types (e.g., `np.float64` in both `JAX` and C).\n\nNext,\
    \ you can now use\n\n```python\ndef model(x):\n    return custom_exp(x) + x\n\n\
    # Compute gradient\ngrad_model = jax.grad(lambda x: jnp.sum(model(x)))\ngrad_value\
    \ = grad_model(x)\nprint(\"Model grad_value =\", grad_value)\n```\n\nYou can use\
    \ `JAX`'s FFI capabilities and `jax.experimental.callback` to integrate external\
    \ C libraries into your `JAX` computations. This approach lets you use optimized\
    \ C code in your models, which can extend functionality and potentially improve\
    \ performance. There are some limits to how well this works on GPUs and there\
    \ might be some overhead, but it's a pretty good way of connecting C code with\
    \ `JAX`.\n"
  trans: "\n# 概述\n\n在本章中，我们将直接深入探讨如何在 `JAX` 中集成外部函数（FFI），为您提供两全其美的体验：在机器学习模型中实现增强的功能和性能，全部打包在一个整洁的方案中。我们首先展示如何直接从\
    \ `JAX` 调用外部 C 库。这使您能够使用针对 `JAX` 标准库中没有的特定计算而优化的现有代码。\n\n接下来，我们将展示如何使用自定义 CUDA\
    \ 内核来优化性能。标准操作在 GPU 计算方面远远不够。这就是为什么编写自定义 CUDA 内核至关重要。我们将展示如何通过 FFI 创建和集成这些内核，以在\
    \ GPU 硬件上获得最佳性能。我们还将直接解决 `JAX` 与外部代码之间的数据转换问题。此外，我们还将展示如何管理线程安全和并发性，这在使用默认情况下可能不是线程安全的外部库时至关重要。\n\
    \n最后，我们将展示如何跨异构系统分发计算。您可以通过利用 `JAX` 的功能以及外部函数，有效地在不同硬件资源之间优化计算。\n\n## 调用外部 C 库\n\
    \n在您使用 `JAX` 构建机器学习模型时，您可能会发现需要使用现有的 C 库来执行 `JAX` 中不可用或效率不高的特定计算。这些库可能包含一些相当专业的算法、遗留代码或经过高度优化的函数，可以真正提升模型的性能。棘手的部分是确保\
    \ `JAX` 和 C 代码能很好地协同工作。我们需要确保 `JAX` 的 JIT 编译和自动微分能与 C 代码配合使用，但同时也需要确保其高效。\n\n\
    `JAX` 提供了通过其外部函数接口（FFI）调用外部 C 函数的方法。您可以在 Python 中使用 `ctypes` 或 `cffi` 来包装 C 函数，使其在\
    \ `JAX` 计算中可访问。您还可以创建自己的 `JAX` 原语来连接这些 C 函数。这使您可以将它们添加到 `JAX` 的计算图中，并且还允许 JIT\
    \ 编译和微分。\n\n### 准备 C 库\n\n假设您有一个计算数组逐元素指数的 C 函数。\n\n```c\n// custom_math.c\n#include\
    \ <math.h>\nvoid custom_exp(int n, const double* x, double* y) {\n    for (int\
    \ i = 0; i < n; ++i) {\n        y[i] = exp(x[i]);\n    }\n}\n```\n\n接下来，编译 C 代码以在\
    \ Linux 上创建共享库文件：\n\n```bash\ngcc -shared -fPIC -o libcustom_math.so custom_math.c\n\
    ```\n\n接下来，使用以下方式在 Python 中加载 C 库\n\n```python\nimport ctypes\nimport numpy as\
    \ np\n# Load the shared library\nlib = ctypes.CDLL('./libcustom_math.so')\n# Define\
    \ the argument and return types of the function\nlib.custom_exp.argtypes = [\n\
    \    ctypes.c_int,\n    np.ctypeslib.ndpointer(dtype=np.float64, ndim=1, flags='C_CONTIGUOUS'),\n\
    \    np.ctypeslib.ndpointer(dtype=np.float64, ndim=1, flags='C_CONTIGUOUS')\n\
    ]\nlib.custom_exp.restype = None\n```\n\n### 在 Python 中定义包装函数\n\n我们需要创建一个包装 C\
    \ 函数的 Python 函数。\n\n```python\ndef custom_exp_c(x):\n    x_np = np.ascontiguousarray(x,\
    \ dtype=np.float64)\n    y_np = np.empty_like(x_np)\n    n = x_np.size\n    lib.custom_exp(n,\
    \ x_np, y_np)\n    return y_np\n```\n\n### 使用 `jax.experimental.callback` 与 JAX\
    \ 集成\n\n由于 `JAX` 本身不支持在 JIT 编译的代码中调用任意 Python 函数，您可以使用 `jax.experimental.callback`（在\
    \ `JAX` 版本 `>= 0.2.12` 中可用）。\n\n```python\nimport jax\nfrom jax.experimental import\
    \ callback as jec\n\n@jax.custom_vjp\ndef custom_exp(x):\n    def forward(x):\n\
    \        y = jec.call(custom_exp_c, x, output_shape=x.shape)\n        return y\n\
    \    def backward(res, g):\n        return (g * custom_exp(x),)\n    return forward(x),\
    \ backward\n```\n\n定义前向和后向传递\n\n```python\ndef custom_exp_fwd(x):\n    y = jec.call(custom_exp_c,\
    \ x, output_shape=x.shape)\n    return y, y  # Return y as residual for backward\n\
    \ndef custom_exp_bwd(res, g):\n    y = res\n    return (g * y,)  # Derivative\
    \ of exp(x) is exp(x)\n\ncustom_exp.defvjp(custom_exp_fwd, custom_exp_bwd)\n```\n\
    \n接下来，测试自定义函数：\n\n```python\nimport jax.numpy as jnp\n# Sample input\nx = jnp.array([0.0,\
    \ 1.0, 2.0], dtype=jnp.float64)\n# Call the custom_exp function\ny = custom_exp(x)\n\
    print(\"y =\", y)\n# Compute the gradient\ngrad_fn = jax.grad(lambda x: jnp.sum(custom_exp(x)))\n\
    grad_value = grad_fn(x)\nprint(\"grad_value =\", grad_value)\n```\n\n接下来，使用 JIT\
    \ 编译使用该函数：\n\n```python\n@jax.jit\ndef compute_custom_exp(x):\n    return custom_exp(x)\n\
    \ny_jit = compute_custom_exp(x)\nprint(\"y_jit =\", y_jit)\n```\n\n这里，使用 `jax.experimental.callback`\
    \ 可能由于设备和主机之间的数据传输而引入性能开销。外部函数在 CPU 上执行，如果其余计算在 GPU 上，则可能不是最优的。\n\n### 处理数据类型和形状\n\
    \n只需确保 `JAX` 与 C 函数之间的数据类型和形状兼容。只需使用 `np.ascontiguousarray` 确保内存是连续的。确保您匹配数据类型（例如，`JAX`\
    \ 和 C 中均为 `np.float64`）。\n\n接下来，您现在可以使用\n\n```python\ndef model(x):\n    return\
    \ custom_exp(x) + x\n\n# Compute gradient\ngrad_model = jax.grad(lambda x: jnp.sum(model(x)))\n\
    grad_value = grad_model(x)\nprint(\"Model grad_value =\", grad_value)\n```\n\n\
    您可以使用 `JAX` 的 FFI 功能和 `jax.experimental.callback` 将外部 C 库集成到 `JAX` 计算中。这种方法让您可以在模型中使用优化的\
    \ C 代码，从而扩展功能并可能提高性能。在 GPU 上的效果存在一些限制，并且可能存在一些开销，但这是一种相当不错的方式来连接 C 代码与 `JAX`。\n"
