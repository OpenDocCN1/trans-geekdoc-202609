    result = jnp.log(small_values)\nprint(result)  # May result in -inf or NaN\n```\n\
    \nIn cases where `float16` causes instability, you might use mixed precision training,\
    \ where certain parts of the model use higher precision.\n\n```\ndef forward_pass(params,\
    \ x):\n    W1, b1, W2, b2 = params\n    x = x.astype(jnp.float16)\n    z1 = jnp.dot(x,\
    \ W1.astype(jnp.float16)) + b1.astype(jnp.float16)\n    a1 = jax.nn.relu(z1).astype(jnp.float32)\
    \  # Promote to float32\n    z2 = jnp.dot(a1, W2.astype(jnp.float32)) + b2.astype(jnp.float32)\n\
    \    y_pred = jax.nn.softmax(z2)\n    return y_pred.astype(jnp.float32)\n```\n\
    \nOn hardware that supports such as TPUs, consider using it as it provides a wider\
    \ dynamic range than\n\n```\nx = x.astype(jnp.bfloat16)\n```\n\nIf you follow\
    \ these steps, you can easily manage data types in your `JAX` computations to\
    \ avoid any unexpected type promotions. This control helps cut down on memory\
    \ usage and can make computations more efficient, especially when you're working\
    \ with big models or datasets. It's important to consider the pros and cons of\
    \ lower precision. On the one hand, it can save you memory, but on the other,\
    \ it might affect how stable your numbers are and how accurate your model is.\n"
  trans: "\n# 在算术运算中控制类型提升\n\n当使用 `JAX` 进行机器学习任务时，你可能会在算术运算期间遇到意外的类型提升。例如，使用 `float16`\
    \ 和 `float32` 等混合数据类型进行计算可能会导致自动提升为更高精度类型或甚至 这会增加内存使用和计算开销，抵消了使用低精度类型的优势。挑战在于显式管理计算中的数据类型以防止不想要的类型提升，确保内存使用保持优化而不牺牲数值精度。\n\
    \n## 控制类型提升的步骤\n\n现在，要控制类型提升，你需要：\n- 知道 `JAX` 如何处理不同数据类型之间的运算。\n- 使用强制转换函数以确保变量在运算前处于所需的数据类型。\n\
    - 采用 `JAX` 的精度控制设置来管理默认行为。\n- 在每个步骤检查并强制执行数据类型以防止意外的提升。\n\n## 理解 JAX 的类型提升规则\n\
    \n`JAX` 遵循 `NumPy` 的类型提升规则，该规则决定了对不同类型输入执行运算时的输出类型。\n\n当组合整数和浮点数时，结果会被提升为浮点类型。\n\
    \n- 当在 `float16` 之间执行运算时结果会被提升为\n- 在任何运算中包含 `float64` 将使结果提升为\n\n以下是意外的类型提升的快速示例：\n\
    \n```\nimport jax.numpy as jnp\na = jnp.array([1.0, 2.0], dtype=jnp.float16)\n\
    b = jnp.array([3.0, 4.0], dtype=jnp.float32)\nc = a + b\nprint(c.dtype)  # Output:\
    \ float32\n```\n\n这里，将 `float16` 数组加到 `float32` 数组上会得到 `float32` 输出。\n\n## 在运算前显式强制转换数据类型\n\
    \n为防止意外的提升，请确保所有操作数具有相同的所需数据类型，如下所示：\n\n```\na = jnp.array([1.0, 2.0], dtype=jnp.float16)\n\
    b = jnp.array([3.0, 4.0], dtype=jnp.float32)\n# Cast 'b' to float16 before the\
