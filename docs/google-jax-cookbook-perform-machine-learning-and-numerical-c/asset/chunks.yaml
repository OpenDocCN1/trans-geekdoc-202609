    \ ctypes\nimport jax.numpy as jnp\n# Load the external C library\nlib = ctypes.CDLL('./libcustom_math.so')\n\
    # Define the function signature\nlib.custom_exp.argtypes = [\n    ctypes.c_int,\n\
