- raw: '  Manipulating Nested Data with Pytrees    When working with machine learning
    models involving complex architectures or large parameter sets, you often encounter
    deeply nested data structures. These structures can be composed of lists, tuples,
    dictionaries, and other containers holding arrays or scalars. Managing and manipulating
    such nested data becomes challenging when you need to apply transformations or
    operations uniformly across all elements. The difficulty intensifies when integrating
    these operations with JAX transformations like or which expect data in a specific
    format.    JAX introduces the concept of which are flexible, nested data structures
    composed of containers like lists, tuples, and dictionaries, with arrays or scalars
    as leaves. Pytrees allow you to represent complex hierarchical data in a way that
    JAX can understand and manipulate efficiently. JAX provides utility functions
    such as and jax.tree\_unflatten to traverse and operate on Pytrees. By leveraging
    these tools, you can apply functions over nested structures without manually handling
    each level of nesting.    Understanding Pytrees    A PyTree is any nested structure
    of Python containers where the leaves are arrays or scalars. JAX treats these
    structures as trees, enabling operations over them.    Following is an example
    of a PyTree:      import jax    import jax.numpy as jnp    \# Define a PyTree
    of model parameters    params \= {       ''layer1'': {           ''weights'':
    jnp.array(\[\[0.1, 0.2\], \[0.3, 0.4\]\]),           ''biases'': jnp.array(\[0.1,
    0.2\])       },       ''layer2'': {           ''weights'': jnp.array(\[\[0.5,
    0.6\], \[0.7, 0.8\]\]),           ''biases'': jnp.array(\[0.3, 0.4\])       }   
    }      In this example, params is a nested dictionary containing JAX arrays as
    leaves.    Using ‘jax.tree\_map’ to apply Functions over Pytrees    The jax.tree\_map
    function applies a given function to each leaf in the PyTree, maintaining the
    overall structure.    See the below example of scaling all parameters:      \#
    Function to scale parameters    def scale\_fn(param):       return param \* 0.5   
    \# Apply the scaling function over the PyTree    scaled\_params \= jax.tree\_map(scale\_fn,
    params)      Here, scaled\_params has the same structure as but each numerical
    value is halved.    Working with Multiple Pytrees    jax.tree\_map can operate
    on multiple Pytrees simultaneously if they share the same structure. Given below
    is a demonstration of adding two Pytrees:      \# Define another PyTree with the
    same structure    params2 \= {       ''layer1'': {           ''weights'': jnp.array(\[\[0.01,
    0.02\], \[0.03, 0.04\]\]),           ''biases'': jnp.array(\[0.01, 0.02\])   
       },       ''layer2'': {           ''weights'': jnp.array(\[\[0.05, 0.06\], \[0.07,
    0.08\]\]),           ''biases'': jnp.array(\[0.03, 0.04\])       }    }    \#
    Function to add parameters from two Pytrees    def add\_fn(p1, p2):       return
    p1 \+ p2    \# Add corresponding leaves    sum\_params \= jax.tree\_map(add\_fn,
    params, params2)      Flattening and Unflattening Pytrees    We can use jax.tree\_flatten
    to convert a PyTree into a flat list of leaves and a structure (treedef). Given
    below is a quick example of flattening a PyTree:      \# Flatten the PyTree   
    leaves, treedef \= jax.tree\_flatten(params)    print("Leaves:", leaves)    print("TreeDef:",
    treedef)      We can unflattening the PyTree as below:      \# Reconstruct the
    PyTree from leaves and treedef    reconstructed\_params \= jax.tree\_unflatten(treedef,
    leaves)      Applying JAX Transformations with Pytrees    Now, the JAX transformations
    like grad and jit work seamlessly with functions that accept Pytrees.      \#
    Define a simple model function    def model(params, x):        \# Forward pass
    using parameters in PyTree        a \= x @ params\[''layer1''\]\[''weights''\]
    \+ params\[''layer1''\]\[''biases''\]       a \= jax.nn.relu(a)        y \= a
    @ params\[''layer2''\]\[''weights''\] \+ params\[''layer2''\]\[''biases''\]   
       return y    \# Define a loss function    def loss\_fn(params, x, y\_true):   
       y\_pred \= model(params, x)        loss \= jnp.mean((y\_pred \- y\_true) \*\*
    2)       return loss    \# Generate some dummy data    x\_data \= jnp.array(\[\[1.0,
    2.0\], \[3.0, 4.0\]\])    y\_data \= jnp.array(\[\[1.0, 2.0\], \[3.0, 4.0\]\])   
    \# Compute gradients with respect to parameters    grads \= jax.grad(loss\_fn)(params,
    x\_data, y\_data)      Updating Parameters using Gradients    We can use jax.tree\_map
    to update parameters based on gradients.      learning\_rate \= 0.01    \# Function
    to update parameters    def update\_fn(param, grad):        return param \- learning\_rate
    \* grad    \# Update parameters    updated\_params \= jax.tree\_map(update\_fn,
    params, grads)      These Pytrees can contain any combination of nested containers.
    Below you can see nested lists and tuples:      \# Define a more complex PyTree   
    complex\_params \= \[        {''weights'': jnp.array(\[1.0, 2.0\]), ''biases'':
    jnp.array(\[0.1, 0.2\])},       (           {''weights'': jnp.array(\[3.0, 4.0\]),
    ''biases'': jnp.array(\[0.3, 0.4\])},           {''weights'': jnp.array(\[5.0,
    6.0\]), ''biases'': jnp.array(\[0.5, 0.6\])}       )    \]    \# Apply a function
    over the complex PyTree    scaled\_complex\_params \= jax.tree\_map(lambda x:
    x \* 2, complex\_params)      Filtering Leaves based on Conditions    You can
    then filter and operate on specific leaves using custom functions as below:   
      def is\_weight(key, \_):       return key \== ''weights''    def conditional\_scale(tree):   
       def scale\_if\_weight(key, val):           if key \== ''weights'':         
         return val \* 0.5           else:               return val        return
    jax.tree\_map(scale\_if\_weight, tree, is\_leaf=lambda x: isinstance(x, dict))   
    scaled\_params \= conditional\_scale(params)      Define Custom PyTree Nodes   
    You can also define custom objects as PyTree nodes by registering them with JAX.
    For example, you can register a custom class.      from jax import tree\_util   
    class LayerParams:       def \_\_init\_\_(self, weights, biases):           self.weights
    \= weights           self.biases \= biases    \# Register LayerParams as a PyTree
    node    def layerparams\_flatten(obj):       children \= (obj.weights, obj.biases)   
       aux\_data \= None       return children, aux\_data    def layerparams\_unflatten(aux\_data,
    children):       return LayerParams(\*children)    tree\_util.register\_pytree\_node(LayerParams,
    layerparams\_flatten, layerparams\_unflatten)    \# Use LayerParams in a PyTree   
    params\_custom \= {       ''layer1'': LayerParams(weights=jnp.array(\[0.1\]),
    biases=jnp.array(\[0.2\]))    }    \# Apply a function over the PyTree    scaled\_params\_custom
    \= jax.tree\_map(lambda x: x \* 2, params\_custom)      Later, integrate the Pytrees
    into your training loop for managing parameters and updates.      \# Define the
    training loop    def train\_step(params, x, y):       grads \= jax.grad(loss\_fn)(params,
    x, y)        params \= jax.tree\_map(lambda p, g: p \- learning\_rate \* g, params,
    grads)       return params    \# JIT-compile the training step    train\_step\_jit
    \= jax.jit(train\_step)    \# Simulate training    for epoch in range(10):   
       params \= train\_step\_jit(params, x\_data, y\_data)       current\_loss \=
    loss\_fn(params, x\_data, y\_data)       print(f"Epoch {epoch}, Loss: {current\_loss}")   
      This whole approach enhances code maintainability and integrates seamlessly
    with JAX transformations, allowing for efficient computation and gradient calculations.
    Leveraging Pytrees empowers you to build and manage sophisticated machine learning
    models with ease.    '
  fmt: "\n# Manipulating Nested Data with Pytrees\n\nWhen working with machine learning\
    \ models involving complex architectures or large parameter sets, you often encounter\
    \ deeply nested data structures. These structures can be composed of lists, tuples,\
    \ dictionaries, and other containers holding arrays or scalars. Managing and manipulating\
    \ such nested data becomes challenging when you need to apply transformations\
    \ or operations uniformly across all elements. The difficulty intensifies when\
    \ integrating these operations with JAX transformations like or which expect data\
    \ in a specific format.\n\nJAX introduces the concept of which are flexible, nested\
    \ data structures composed of containers like lists, tuples, and dictionaries,\
    \ with arrays or scalars as leaves. Pytrees allow you to represent complex hierarchical\
    \ data in a way that JAX can understand and manipulate efficiently. JAX provides\
    \ utility functions such as and `jax.tree_unflatten` to traverse and operate on\
    \ Pytrees. By leveraging these tools, you can apply functions over nested structures\
    \ without manually handling each level of nesting.\n\n## Understanding Pytrees\n\
    \nA PyTree is any nested structure of Python containers where the leaves are arrays\
    \ or scalars. JAX treats these structures as trees, enabling operations over them.\n\
    \nFollowing is an example of a PyTree:\n\n```\nimport jax\nimport jax.numpy as\
    \ jnp\n# Define a PyTree of model parameters\nparams = {\n    'layer1': {\n  \
    \      'weights': jnp.array([[0.1, 0.2], [0.3, 0.4]]),\n        'biases': jnp.array([0.1,\
    \ 0.2])\n    },\n    'layer2': {\n        'weights': jnp.array([[0.5, 0.6], [0.7,\
    \ 0.8]]),\n        'biases': jnp.array([0.3, 0.4])\n    }\n}\n```\n\nIn this example,\
    \ `params` is a nested dictionary containing JAX arrays as leaves.\n\n## Using\
    \ `jax.tree_map` to apply Functions over Pytrees\n\nThe `jax.tree_map` function\
    \ applies a given function to each leaf in the PyTree, maintaining the overall\
    \ structure.\n\nSee the below example of scaling all parameters:\n\n```\n# Function\
    \ to scale parameters\ndef scale_fn(param):\n    return param * 0.5\n# Apply the\
    \ scaling function over the PyTree\nscaled_params = jax.tree_map(scale_fn, params)\n\
    ```\n\nHere, `scaled_params` has the same structure as but each numerical value\
    \ is halved.\n\n## Working with Multiple Pytrees\n\n`jax.tree_map` can operate\
    \ on multiple Pytrees simultaneously if they share the same structure. Given below\
    \ is a demonstration of adding two Pytrees:\n\n```\n# Define another PyTree with\
    \ the same structure\nparams2 = {\n    'layer1': {\n        'weights': jnp.array([[0.01,\
    \ 0.02], [0.03, 0.04]]),\n        'biases': jnp.array([0.01, 0.02])\n    },\n\
    \    'layer2': {\n        'weights': jnp.array([[0.05, 0.06], [0.07, 0.08]]),\n\
    \        'biases': jnp.array([0.03, 0.04])\n    }\n}\n# Function to add parameters\
    \ from two Pytrees\ndef add_fn(p1, p2):\n    return p1 + p2\n# Add corresponding\
    \ leaves\nsum_params = jax.tree_map(add_fn, params, params2)\n```\n\n## Flattening\
    \ and Unflattening Pytrees\n\nWe can use `jax.tree_flatten` to convert a PyTree\
    \ into a flat list of leaves and a structure (treedef). Given below is a quick\
    \ example of flattening a PyTree:\n\n```\n# Flatten the PyTree\nleaves, treedef\
    \ = jax.tree_flatten(params)\nprint(\"Leaves:\", leaves)\nprint(\"TreeDef:\",\
    \ treedef)\n```\n\nWe can unflattening the PyTree as below:\n\n```\n# Reconstruct\
    \ the PyTree from leaves and treedef\nreconstructed_params = jax.tree_unflatten(treedef,\
    \ leaves)\n```\n\n## Applying JAX Transformations with Pytrees\n\nNow, the JAX\
    \ transformations like grad and jit work seamlessly with functions that accept\
    \ Pytrees.\n\n```\n# Define a simple model function\ndef model(params, x):\n \
    \   # Forward pass using parameters in PyTree\n    a = x @ params['layer1']['weights']\
    \ + params['layer1']['biases']\n    a = jax.nn.relu(a)\n    y = a @ params['layer2']['weights']\
    \ + params['layer2']['biases']\n    return y\n# Define a loss function\ndef loss_fn(params,\
    \ x, y_true):\n    y_pred = model(params, x)\n    loss = jnp.mean((y_pred - y_true)\
    \ ** 2)\n    return loss\n# Generate some dummy data\nx_data = jnp.array([[1.0,\
    \ 2.0], [3.0, 4.0]])\ny_data = jnp.array([[1.0, 2.0], [3.0, 4.0]])\n# Compute\
    \ gradients with respect to parameters\ngrads = jax.grad(loss_fn)(params, x_data,\
    \ y_data)\n```\n\n## Updating Parameters using Gradients\n\nWe can use `jax.tree_map`\
    \ to update parameters based on gradients.\n\n```\nlearning_rate = 0.01\n# Function\
    \ to update parameters\ndef update_fn(param, grad):\n    return param - learning_rate\
    \ * grad\n# Update parameters\nupdated_params = jax.tree_map(update_fn, params,\
    \ grads)\n```\n\nThese Pytrees can contain any combination of nested containers.\
    \ Below you can see nested lists and tuples:\n\n```\n# Define a more complex PyTree\n\
    complex_params = [\n    {'weights': jnp.array([1.0, 2.0]), 'biases': jnp.array([0.1,\
    \ 0.2])},\n    (\n        {'weights': jnp.array([3.0, 4.0]), 'biases': jnp.array([0.3,\
    \ 0.4])},\n        {'weights': jnp.array([5.0, 6.0]), 'biases': jnp.array([0.5,\
    \ 0.6])}\n    )\n]\n# Apply a function over the complex PyTree\nscaled_complex_params\
    \ = jax.tree_map(lambda x: x * 2, complex_params)\n```\n\n## Filtering Leaves\
    \ based on Conditions\n\nYou can then filter and operate on specific leaves using\
    \ custom functions as below:\n\n```\ndef is_weight(key, _):\n    return key ==\
    \ 'weights'\ndef conditional_scale(tree):\n    def scale_if_weight(key, val):\n\
    \        if key == 'weights':\n            return val * 0.5\n        else:\n \
    \           return val\n    return jax.tree_map(scale_if_weight, tree, is_leaf=lambda\
    \ x: isinstance(x, dict))\nscaled_params = conditional_scale(params)\n```\n\n\
    ## Define Custom PyTree Nodes\n\nYou can also define custom objects as PyTree\
    \ nodes by registering them with JAX. For example, you can register a custom class.\n\
    \n```\nfrom jax import tree_util\nclass LayerParams:\n    def __init__(self, weights,\
    \ biases):\n        self.weights = weights\n        self.biases = biases\n# Register\
    \ LayerParams as a PyTree node\ndef layerparams_flatten(obj):\n    children =\
    \ (obj.weights, obj.biases)\n    aux_data = None\n    return children, aux_data\n\
    def layerparams_unflatten(aux_data, children):\n    return LayerParams(*children)\n\
    tree_util.register_pytree_node(LayerParams, layerparams_flatten, layerparams_unflatten)\n\
    # Use LayerParams in a PyTree\nparams_custom = {\n    'layer1': LayerParams(weights=jnp.array([0.1]),\
    \ biases=jnp.array([0.2]))\n}\n# Apply a function over the PyTree\nscaled_params_custom\
    \ = jax.tree_map(lambda x: x * 2, params_custom)\n```\n\n## Training Loop Integration\n\
    \nLater, integrate the Pytrees into your training loop for managing parameters\
    \ and updates.\n\n```\n# Define the training loop\ndef train_step(params, x, y):\n\
    \    grads = jax.grad(loss_fn)(params, x, y)\n    params = jax.tree_map(lambda\
    \ p, g: p - learning_rate * g, params, grads)\n    return params\n# JIT-compile\
    \ the training step\ntrain_step_jit = jax.jit(train_step)\n# Simulate training\n\
    for epoch in range(10):\n    params = train_step_jit(params, x_data, y_data)\n\
    \    current_loss = loss_fn(params, x_data, y_data)\n    print(f\"Epoch {epoch},\
    \ Loss: {current_loss}\")\n```\n\nThis whole approach enhances code maintainability\
    \ and integrates seamlessly with JAX transformations, allowing for efficient computation\
    \ and gradient calculations. Leveraging Pytrees empowers you to build and manage\
    \ sophisticated machine learning models with ease.\n"
  trans: "\n# 使用 Pytrees 操作嵌套数据\n\n在处理涉及复杂架构或大型参数集的机器学习模型时，你经常会遇到深度嵌套的数据结构。这些结构可以由列表、元组、字典以及其他包含数组或标量的容器组成。当你需要在所有元素上统一应用转换或操作时，管理和操作此类嵌套数据变得具有挑战性。当将这些操作与期望特定格式数据的\
    \ JAX 变换如 or 集成时，难度进一步加剧。\n\nJAX 引入了 的概念，它们是由列表、元组和字典等容器组成的灵活嵌套数据结构，叶子节点为数组或标量。Pytrees\
    \ 允许你以 JAX 能够理解并高效操作的方式表示复杂分层数据。JAX 提供了诸如 和 `jax.tree_unflatten` 的实用函数来遍历和操作 Pytrees。通过利用这些工具，你可以在不手动处理每个嵌套层级的情况下对嵌套结构应用函数。\n\
    \n## 理解 Pytrees\n\nPyTree 是任何嵌套的 Python 容器结构，其中叶子节点为数组或标量。JAX 将这些结构视为树，从而实现对其的操作。\n\
    \n以下是 PyTree 的示例：\n\n```\nimport jax\nimport jax.numpy as jnp\n# Define a PyTree\
    \ of model parameters\nparams = {\n    'layer1': {\n        'weights': jnp.array([[0.1,\
    \ 0.2], [0.3, 0.4]]),\n        'biases': jnp.array([0.1, 0.2])\n    },\n    'layer2':\
    \ {\n        'weights': jnp.array([[0.5, 0.6], [0.7, 0.8]]),\n        'biases':\
    \ jnp.array([0.3, 0.4])\n    }\n}\n```\n\n在此示例中，`params` 是一个嵌套字典，包含 JAX 数组作为叶子节点。\n\
    \n## 使用 `jax.tree_map` 对 Pytrees 应用函数\n\n`jax.tree_map` 函数将给定函数应用于 PyTree 中的每个叶子节点，同时保持整体结构。\n\
    \n以下是缩放所有参数的示例：\n\n```\n# Function to scale parameters\ndef scale_fn(param):\n\
    \    return param * 0.5\n# Apply the scaling function over the PyTree\nscaled_params\
    \ = jax.tree_map(scale_fn, params)\n```\n\n这里，`scaled_params` 与 的结构相同，但每个数值都被减半。\n\
    \n## 处理多个 Pytrees\n\n`jax.tree_map` 可以在多个 Pytrees 上同时操作，前提是它们具有相同的结构。以下是添加两个 Pytrees\
    \ 的演示：\n\n```\n# Define another PyTree with the same structure\nparams2 = {\n\
    \    'layer1': {\n        'weights': jnp.array([[0.01, 0.02], [0.03, 0.04]]),\n\
    \        'biases': jnp.array([0.01, 0.02])\n    },\n    'layer2': {\n        'weights':\
    \ jnp.array([[0.05, 0.06], [0.07, 0.08]]),\n        'biases': jnp.array([0.03,\
    \ 0.04])\n    }\n}\n# Function to add parameters from two Pytrees\ndef add_fn(p1,\
    \ p2):\n    return p1 + p2\n# Add corresponding leaves\nsum_params = jax.tree_map(add_fn,\
    \ params, params2)\n```\n\n## 展平和展开 Pytrees\n\n我们可以使用 `jax.tree_flatten` 将 PyTree\
    \ 转换为叶子节点的扁平列表和结构（treedef）。以下是展平 PyTree 的快速示例：\n\n```\n# Flatten the PyTree\n\
    leaves, treedef = jax.tree_flatten(params)\nprint(\"Leaves:\", leaves)\nprint(\"\
    TreeDef:\", treedef)\n```\n\n我们可以按如下方式展开 PyTree：\n\n```\n# Reconstruct the PyTree\
    \ from leaves and treedef\nreconstructed_params = jax.tree_unflatten(treedef,\
    \ leaves)\n```\n\n## 使用 Pytrees 应用 JAX 变换\n\n现在，像 grad 和 jit 这样的 JAX 变换可以与接受 Pytrees\
    \ 的函数无缝协作。\n\n```\n# Define a simple model function\ndef model(params, x):\n \
    \   # Forward pass using parameters in PyTree\n    a = x @ params['layer1']['weights']\
    \ + params['layer1']['biases']\n    a = jax.nn.relu(a)\n    y = a @ params['layer2']['weights']\
    \ + params['layer2']['biases']\n    return y\n# Define a loss function\ndef loss_fn(params,\
    \ x, y_true):\n    y_pred = model(params, x)\n    loss = jnp.mean((y_pred - y_true)\
    \ ** 2)\n    return loss\n# Generate some dummy data\nx_data = jnp.array([[1.0,\
    \ 2.0], [3.0, 4.0]])\ny_data = jnp.array([[1.0, 2.0], [3.0, 4.0]])\n# Compute\
    \ gradients with respect to parameters\ngrads = jax.grad(loss_fn)(params, x_data,\
    \ y_data)\n```\n\n## 使用梯度更新参数\n\n我们可以使用 `jax.tree_map` 根据梯度更新参数。\n\n```\nlearning_rate\
    \ = 0.01\n# Function to update parameters\ndef update_fn(param, grad):\n    return\
    \ param - learning_rate * grad\n# Update parameters\nupdated_params = jax.tree_map(update_fn,\
    \ params, grads)\n```\n\n这些 Pytrees 可以包含任何组合的嵌套容器。下面可以看到嵌套的列表和元组：\n\n```\n# Define\
    \ a more complex PyTree\ncomplex_params = [\n    {'weights': jnp.array([1.0, 2.0]),\
    \ 'biases': jnp.array([0.1, 0.2])},\n    (\n        {'weights': jnp.array([3.0,\
    \ 4.0]), 'biases': jnp.array([0.3, 0.4])},\n        {'weights': jnp.array([5.0,\
    \ 6.0]), 'biases': jnp.array([0.5, 0.6])}\n    )\n]\n# Apply a function over the\
    \ complex PyTree\nscaled_complex_params = jax.tree_map(lambda x: x * 2, complex_params)\n\
    ```\n\n## 基于条件过滤叶子节点\n\n然后你可以使用自定义函数按如下方式过滤和操作特定叶子节点：\n\n```\ndef is_weight(key,\
    \ _):\n    return key == 'weights'\ndef conditional_scale(tree):\n    def scale_if_weight(key,\
    \ val):\n        if key == 'weights':\n            return val * 0.5\n        else:\n\
    \            return val\n    return jax.tree_map(scale_if_weight, tree, is_leaf=lambda\
    \ x: isinstance(x, dict))\nscaled_params = conditional_scale(params)\n```\n\n\
    ## 定义自定义 PyTree 节点\n\n你也可以通过向 JAX 注册来将自定义对象定义为 PyTree 节点。例如，你可以注册一个自定义类。\n\n```\n\
    from jax import tree_util\nclass LayerParams:\n    def __init__(self, weights,\
    \ biases):\n        self.weights = weights\n        self.biases = biases\n# Register\
    \ LayerParams as a PyTree node\ndef layerparams_flatten(obj):\n    children =\
    \ (obj.weights, obj.biases)\n    aux_data = None\n    return children, aux_data\n\
    def layerparams_unflatten(aux_data, children):\n    return LayerParams(*children)\n\
    tree_util.register_pytree_node(LayerParams, layerparams_flatten, layerparams_unflatten)\n\
    # Use LayerParams in a PyTree\nparams_custom = {\n    'layer1': LayerParams(weights=jnp.array([0.1]),\
    \ biases=jnp.array([0.2]))\n}\n# Apply a function over the PyTree\nscaled_params_custom\
    \ = jax.tree_map(lambda x: x * 2, params_custom)\n```\n\n## 训练循环集成\n\n稍后，将 Pytrees\
    \ 集成到你的训练循环中以管理参数和更新。\n\n```\n# Define the training loop\ndef train_step(params,\
    \ x, y):\n    grads = jax.grad(loss_fn)(params, x, y)\n    params = jax.tree_map(lambda\
    \ p, g: p - learning_rate * g, params, grads)\n    return params\n# JIT-compile\
    \ the training step\ntrain_step_jit = jax.jit(train_step)\n# Simulate training\n\
    for epoch in range(10):\n    params = train_step_jit(params, x_data, y_data)\n\
    \    current_loss = loss_fn(params, x_data, y_data)\n    print(f\"Epoch {epoch},\
    \ Loss: {current_loss}\")\n```\n\n这种整体方法增强了代码的可维护性，并与 JAX 变换无缝集成，从而实现高效的计算和梯度计算。利用\
    \ Pytrees 使你能够轻松构建和管理复杂的机器学习模型。\n"
