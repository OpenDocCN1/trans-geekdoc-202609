- raw: '  Efficient Data Loading with TensorFlow Datasets    Data loading often becomes
    a bottleneck in training pipelines, especially when dealing with large datasets.
    Slow data loading can significantly hinder the training process, leading to inefficient
    GPU utilization and increased training times. To address this issue, we need a
    practical solution to efficiently load large datasets, pre-process them on-the-fly,
    and feed them to the training loop. In this recipe, we will use TensorFlow Datasets
    for seamless data loading and preprocessing, allowing us to integrate the data
    pipeline with JAX for training our neural network.    This recipe will guide you
    through the process of setting up TFDS to efficiently load and prepare data for
    training a neural network using JAX, leveraging TensorFlow''s optimized data handling
    capabilities. This approach will enable us to load large datasets, apply necessary
    transformations, and seamlessly integrate the processed data with JAX.    Following
    are the steps:    Setting up TensorFlow Datasets and selecting a suitable dataset.  Configuring
    the data pipeline for efficient loading, shuffling, and batching.  Converting
    the TensorFlow data format to a JAX-compatible format.  Integrating the data loader
    into the JAX training pipeline.    Loading Dataset using TFDS    First, ensure
    that TensorFlow is available in your environment. Since we have TensorFlow already
    installed, we can import TensorFlow Datasets. Next, load the dataset from TFDS
    and configure it for training and evaluation.    Here, we will split the data
    into training and testing sets.      \# Load the Fashion MNIST dataset    dataset\_name
    \= ''fashion\_mnist''    (train\_ds, test\_ds), ds\_info \= tfds.load(       dataset\_name,   
       split=\[''train'', ''test''\],       as\_supervised=True,  # This returns (image,
    label) pairs       with\_info=True    )    \# Print dataset information    print(ds\_info)   
      Preprocessing Data    Now, to train the model effectively, we need to preprocess
    the data. This includes normalizing the pixel values to the range \[0, shuffling,
    batching, and optionally applying data augmentation.      def preprocess(image,
    label):        \# Normalize the images to \[0, 1\]        image \= tf.cast(image,
    tf.float32) / 255.0       return image, label    \# Batch size for training   
    batch\_size \= 128    \# Configure the training dataset pipeline    train\_ds
    \= (train\_ds               .map(preprocess, num\_parallel\_calls=tf.data.AUTOTUNE)   
               .shuffle(buffer\_size=10000)               .batch(batch\_size)     
             .prefetch(buffer\_size=tf.data.AUTOTUNE))    \# Configure the testing
    dataset pipeline    test\_ds \= (test\_ds              .map(preprocess, num\_parallel\_calls=tf.data.AUTOTUNE)   
              .batch(batch\_size)              .prefetch(buffer\_size=tf.data.AUTOTUNE))   
      Here, we use tf.data.AUTOTUNE to automatically optimize the parallelism of data
    loading, which helps in speeding up the data pipeline. The .shuffle() method randomizes
    the order of examples, while .batch() groups the examples into batches for efficient
    training.    Converting TensorFlow Data to JAX-compatible Format    To use the
    data with JAX, we need to convert the TensorFlow dataset format to NumPy arrays
    that can be processed by JAX functions. We will use the tfds.as\_numpy() utility
    to convert the dataset into an iterable that provides JAX-compatible NumPy arrays.   
      \# Convert TensorFlow datasets to JAX-compatible format    train\_ds \= tfds.as\_numpy(train\_ds)   
    test\_ds \= tfds.as\_numpy(test\_ds)      Now, train\_ds and test\_ds are iterables
    that provide batches of data in the form of NumPy arrays, which are compatible
    with JAX.    Integrating Data Loader with JAX Training Loop    Next, to integrate
    the data loader with the JAX training pipeline, we will write a training loop
    that fetches batches of data from the preprocessed dataset and feeds them into
    a model for training.      \# Example function to simulate a training step   
    def train\_step(params, images, labels):        \# A placeholder function to demonstrate
    using the data        \# In actual implementation, this would involve computing
    loss and updating parameters        logits \= jax.nn.relu(jnp.dot(images, params\[''w''\])
    \+ params\[''b''\])        loss \= jnp.mean((logits \- labels) \*\* 2)       return
    loss    \# Simulating a training process    def train\_model(train\_ds, params,
    num\_epochs=5):       for epoch in range(num\_epochs):           epoch\_loss \=
    0           for batch in train\_ds:               images, labels \= batch     
             # Perform the training step               batch\_loss \= train\_step(params,
    images, labels)               epoch\_loss += batch\_loss           print(f"Epoch
    {epoch \+ 1}, Loss: {epoch\_loss}")      This example demonstrates a simple training
    loop that processes data in batches. The train\_step function performs operations
    on the data using JAX.    By using TensorFlow Datasets for data loading, preprocessing,
    and augmentation, we were able to fix the data loading bottleneck and integrate
    with JAX without a hitch. This way, we make sure large datasets are handled smoothly,
    use all our hardware resources like GPUs as much as we can, and get faster training.    '
  fmt: "\n# Efficient Data Loading with TensorFlow Datasets\n\nData loading often\
    \ becomes a bottleneck in training pipelines, especially when dealing with large\
    \ datasets. Slow data loading can significantly hinder the training process, leading\
    \ to inefficient GPU utilization and increased training times. To address this\
    \ issue, we need a practical solution to efficiently load large datasets, pre-process\
    \ them on-the-fly, and feed them to the training loop. In this recipe, we will\
    \ use `TensorFlow Datasets` for seamless data loading and preprocessing, allowing\
    \ us to integrate the data pipeline with `JAX` for training our neural network.\n\
    \n## Overview\n\nThis recipe will guide you through the process of setting up\
    \ `TFDS` to efficiently load and prepare data for training a neural network using\
    \ `JAX`, leveraging `TensorFlow`'s optimized data handling capabilities. This\
    \ approach will enable us to load large datasets, apply necessary transformations,\
    \ and seamlessly integrate the processed data with `JAX`.\n\n### Steps\n- Setting\
    \ up `TensorFlow Datasets` and selecting a suitable dataset.\n- Configuring the\
    \ data pipeline for efficient loading, shuffling, and batching.\n- Converting\
    \ the `TensorFlow` data format to a `JAX`-compatible format.\n- Integrating the\
    \ data loader into the `JAX` training pipeline.\n\n## Loading Dataset using TFDS\n\
    \nFirst, ensure that `TensorFlow` is available in your environment. Since we have\
    \ `TensorFlow` already installed, we can import `TensorFlow Datasets`. Next, load\
    \ the dataset from `TFDS` and configure it for training and evaluation.\n\nHere,\
    \ we will split the data into training and testing sets.\n\n```python\n# Load\
    \ the Fashion MNIST dataset\ndataset_name = 'fashion_mnist'\n(train_ds, test_ds),\
    \ ds_info = tfds.load(\n    dataset_name,\n    split=['train', 'test'],\n    as_supervised=True,\
    \  # This returns (image, label) pairs\n    with_info=True\n)\n# Print dataset\
    \ information\nprint(ds_info)\n```\n\n## Preprocessing Data\n\nNow, to train the\
    \ model effectively, we need to preprocess the data. This includes normalizing\
    \ the pixel values to the range `[0, 1]`, shuffling, batching, and optionally\
    \ applying data augmentation.\n\n```python\ndef preprocess(image, label):\n  \
    \  # Normalize the images to [0, 1]\n    image = tf.cast(image, tf.float32) /\
    \ 255.0\n    return image, label\n\n# Batch size for training\nbatch_size = 128\n\
    \n# Configure the training dataset pipeline\ntrain_ds = (\n    train_ds\n    .map(preprocess,\
    \ num_parallel_calls=tf.data.AUTOTUNE)\n    .shuffle(buffer_size=10000)\n    .batch(batch_size)\n\
    \    .prefetch(buffer_size=tf.data.AUTOTUNE)\n)\n\n# Configure the testing dataset\
    \ pipeline\ntest_ds = (\n    test_ds\n    .map(preprocess, num_parallel_calls=tf.data.AUTOTUNE)\n\
    \    .batch(batch_size)\n    .prefetch(buffer_size=tf.data.AUTOTUNE)\n)\n```\n\
    \nHere, we use `tf.data.AUTOTUNE` to automatically optimize the parallelism of\
    \ data loading, which helps in speeding up the data pipeline. The `.shuffle()`\
    \ method randomizes the order of examples, while `.batch()` groups the examples\
    \ into batches for efficient training.\n\n## Converting TensorFlow Data to JAX-compatible\
    \ Format\n\nTo use the data with `JAX`, we need to convert the `TensorFlow` dataset\
    \ format to NumPy arrays that can be processed by `JAX` functions. We will use\
    \ the `tfds.as_numpy()` utility to convert the dataset into an iterable that provides\
    \ `JAX`-compatible NumPy arrays.\n\n```python\n# Convert TensorFlow datasets to\
    \ JAX-compatible format\ntrain_ds = tfds.as_numpy(train_ds)\ntest_ds = tfds.as_numpy(test_ds)\n\
    ```\n\nNow, `train_ds` and `test_ds` are iterables that provide batches of data\
    \ in the form of NumPy arrays, which are compatible with `JAX`.\n\n## Integrating\
    \ Data Loader with JAX Training Loop\n\nNext, to integrate the data loader with\
    \ the `JAX` training pipeline, we will write a training loop that fetches batches\
    \ of data from the preprocessed dataset and feeds them into a model for training.\n\
    \n```python\n# Example function to simulate a training step\ndef train_step(params,\
    \ images, labels):\n    # A placeholder function to demonstrate using the data\n\
    \    # In actual implementation, this would involve computing loss and updating\
    \ parameters\n    logits = jax.nn.relu(jnp.dot(images, params['w']) + params['b'])\n\
    \    loss = jnp.mean((logits - labels) ** 2)\n    return loss\n\n# Simulating\
    \ a training process\ndef train_model(train_ds, params, num_epochs=5):\n    for\
    \ epoch in range(num_epochs):\n        epoch_loss = 0\n        for batch in train_ds:\n\
    \            images, labels = batch\n            # Perform the training step\n\
    \            batch_loss = train_step(params, images, labels)\n            epoch_loss\
    \ += batch_loss\n        print(f\"Epoch {epoch + 1}, Loss: {epoch_loss}\")\n```\n\
    \nThis example demonstrates a simple training loop that processes data in batches.\
    \ The `train_step` function performs operations on the data using `JAX`.\n\nBy\
    \ using `TensorFlow Datasets` for data loading, preprocessing, and augmentation,\
    \ we were able to fix the data loading bottleneck and integrate with `JAX` without\
    \ a hitch. This way, we make sure large datasets are handled smoothly, use all\
    \ our hardware resources like GPUs as much as we can, and get faster training.\n"
