- raw: "  Optimizing Memory with Lower Precision Types    Now, when working with large\
    \ models or datasets, high-precision data types like float64 can consume significant\
    \ amounts of memory, leading to resource constraints and reduced performance.\
    \ This is especially problematic when training deep neural networks where memory\
    \ bandwidth is a bottleneck. To address this, you want to strategically use lower\
    \ precision data types (like float16 or where acceptable, to reduce memory footprint\
    \ and potentially improve computational speed.    Analyzing Model and Data   \
    \ So first, examine your model to identify components that can operate in lower\
    \ precision:    ●         Weights and Activations: Often can be in lower precision.\
    \  ●         Gradients: May need higher precision to prevent underflow.  ●    \
    \     Loss Computation: Typically requires higher precision.    Loading Data in\
    \ Lower Precision    We need to tweak the data loading process to use lower precision\
    \ types. For example:      import jax.numpy as jnp    \\# Load data as float16\
    \    train\\_images \\= ...  \\# Load as NumPy array    train\\_images \\= train\\\
    _images.astype(jnp.float16) / 255.0  \\# Normalize    train\\_labels \\= ... \
    \ \\# Labels can remain as integers      Defining Model with Lower Precision Parameters\
    \    Just tweak the model definitions to use lower-precision data types using\
    \ Flax:      from flax import linen as nn    class LowPrecisionModel(nn.Module):\
    \       @nn.compact       def \\_\\_call\\_\\_(self, x):           x \\= x.astype(jnp.float16)\
    \           x \\= x.reshape((x.shape\\[0\\], \\-1))           x \\= nn.Dense(features=256,\
    \ dtype=jnp.float16)(x)           x \\= nn.relu(x)           x \\= nn.Dense(features=128,\
    \ dtype=jnp.float16)(x)           x \\= nn.relu(x)           x \\= nn.Dense(features=10,\
    \ dtype=jnp.float16)(x)           x \\= x.astype(jnp.float32)  # Convert to float32\
    \ for loss computation           return x      Adjusting Optimizer    Here, use\
    \ Optax so as to handle lower precision parameters.      import optax    def create\\\
    _optimizer(learning\\_rate):        \\# Use an optimizer that supports lower precision\
    \        optimizer \\= optax.adam(learning\\_rate=learning\\_rate, b1=0.9, b2=0.999,\
    \ eps=1e-8)       return optimizer      Modifying Training Step    Next, make\
    \ sure the gradients are calculated at a higher precision.      @jax.jit    def\
    \ train\\_step(state, batch):       images \\= batch\\['images'\\]       labels\
    \ \\= batch\\['labels'\\]       def loss\\_fn(params):           loss \\= scaled\\\
    _loss(params, images, labels)           return loss       grads \\= jax.grad(loss\\\
    _fn)(state.params)        grads \\= jax.tree\\_map(lambda g: g.astype(jnp.float32),\
    \ grads)  \\# Cast gradients to float32       state \\= state.apply\\_gradients(grads=grads)\
    \       return state      Just to make sure we're on the same page here, we need\
    \ to initialise the model parameters to the desired precision.      def create\\\
    _train\\_state(rng, learning\\_rate):       model \\= LowPrecisionModel()       \
    \ params \\= model.init(rng, jnp.ones(\\[1, 28, 28\\], dtype=jnp.float16))\\['params'\\\
    ]       optimizer \\= create\\_optimizer(learning\\_rate)       state \\= train\\\
    _state.TrainState.create(apply\\_fn=model.apply, params=params, tx=optimizer)\
    \       return state      Training Model    Then, proceed with the training loop\
    \ as usual, and followed by evaluation of model performance.      rng \\= jax.random.PRNGKey(0)\
    \    state \\= create\\_train\\_state(rng, learning\\_rate=0.001)    for epoch\
    \ in range(num\\_epochs):       for batch in train\\_ds:           state \\= train\\\
    _step(state, batch)       print(f\"Epoch {epoch \\+ 1} completed.\")    #model\
    \ performance evaluation    def evaluate\\_model(state, test\\_ds):       total\\\
    _loss \\= 0.0       total\\_accuracy \\= 0.0       for batch in test\\_ds:   \
    \        images \\= batch\\['images'\\].astype(jnp.float16)           labels \\\
    = batch\\['labels'\\]           logits \\= LowPrecisionModel().apply({'params':\
    \ state.params}, images)           loss \\= optax.softmax\\_cross\\_entropy\\\
    _with\\_integer\\_labels(logits, labels).mean()           accuracy \\= jnp.mean(jnp.argmax(logits,\
    \ \\-1) \\== labels)           total\\_loss += loss           total\\_accuracy\
    \ += accuracy        print(f\"Test Loss: {total\\_loss}, Test Accuracy: {total\\\
    _accuracy}\")    evaluate\\_model(state, test\\_ds)      Utilizing ‘bfloat16’\
    \ on TPUs    If you want to get the most out of TPUs, use bfloat16. You'll get\
    \ better numerical properties with lower precision that way.      class LowPrecisionModel(nn.Module):\
    \       @nn.compact       def \\_\\_call\\_\\_(self, x):           x \\= x.astype(jnp.bfloat16)\
    \           # ... rest of the model ...      If you use lower precision data types\
    \ in a smart way, you can cut down on memory use a lot and maybe even speed up\
    \ the processing. It's important to think through these changes carefully to make\
    \ sure the model stays accurate and stable. It's important to test and validate\
    \ regularly to make sure that the benefits of reduced memory usage don't come\
    \ at the cost of degraded performance.    \n\n  Summary    We successfully explored\
    \ data type management and precision in JAX, optimizing memory usage and computational\
    \ efficiency. We started by tackling the issue of unintended type promotions in\
    \ arithmetic operations. We knew that such promotions could lead to increased\
    \ memory consumption and slower computations, and we were determined to find a\
    \ solution. By explicitly managing data types and using consistent casting, we\
    \ learned to prevent automatic promotions and maintain control over our numerical\
    \ precision.    We found that implementing mixed-precision training is a highly\
    \ effective technique for accelerating computations. We achieved faster training\
    \ times without significant loss of accuracy by using lower precision types like\
    \ float16 for most operations and reserving float32 for critical calculations.\
    \ We also successfully addressed the challenge of debugging type errors in complex\
    \ functions. By systematically diagnosing, explicitly casting types, and leveraging\
    \ JAX's debugging tools, we were able to identify and resolve data type issues\
    \ that could cause functions to fail unexpectedly. This proved the necessity of\
    \ meticulous attention to data types throughout code development.    The chapter\
    \ then moved on to the implementation of custom data types within JAX's framework,\
    \ acknowledging scenarios where specialized numeric types are necessary. We integrated\
    \ custom data types into JAX's automatic differentiation system by leveraging\
    \ custom VJP and JVP functions. Finally, we optimized memory usage by employing\
    \ lower precision types where appropriate. We effectively reduced the memory footprint\
    \ of our models by adjusting data loading, model definitions, and computational\
    \ precision.  \n\n  Chapter 7: Integrating Foreign Functions (FFI)    "
  fmt: "\n# Optimizing Memory with Lower Precision Types\n\nNow, when working with\
    \ large models or datasets, high-precision data types like `float64` can consume\
    \ significant amounts of memory, leading to resource constraints and reduced performance.\
    \ This is especially problematic when training deep neural networks where memory\
    \ bandwidth is a bottleneck. To address this, you want to strategically use lower\
    \ precision data types (like `float16` or where acceptable, to reduce memory footprint\
    \ and potentially improve computational speed.\n\n## Analyzing Model and Data\n\
    \nSo first, examine your model to identify components that can operate in lower\
    \ precision:\n\n- Weights and Activations: Often can be in lower precision.\n\
    - Gradients: May need higher precision to prevent underflow.\n- Loss Computation:\
    \ Typically requires higher precision.\n\n## Loading Data in Lower Precision\n\
    \nWe need to tweak the data loading process to use lower precision types. For\
    \ example:\n\n```\nimport jax.numpy as jnp\n# Load data as float16\ntrain_images\
    \ = ...  # Load as NumPy array\ntrain_images = train_images.astype(jnp.float16)\
    \ / 255.0  # Normalize\ntrain_labels = ...  # Labels can remain as integers\n\
    ```\n\n## Defining Model with Lower Precision Parameters\n\nJust tweak the model\
    \ definitions to use lower-precision data types using `Flax`:\n\n```\nfrom flax\
    \ import linen as nn\nclass LowPrecisionModel(nn.Module):\n  @nn.compact\n  def\
    \ __call__(self, x):\n    x = x.astype(jnp.float16)\n    x = x.reshape((x.shape[0],\
    \ -1))\n    x = nn.Dense(features=256, dtype=jnp.float16)(x)\n    x = nn.relu(x)\n\
    \    x = nn.Dense(features=128, dtype=jnp.float16)(x)\n    x = nn.relu(x)\n  \
    \  x = nn.Dense(features=10, dtype=jnp.float16)(x)\n    x = x.astype(jnp.float32)\
    \  # Convert to float32 for loss computation\n    return x\n```\n\n## Adjusting\
    \ Optimizer\n\nHere, use `Optax` so as to handle lower precision parameters.\n\
    \n```\nimport optax\ndef create_optimizer(learning_rate):\n    # Use an optimizer\
    \ that supports lower precision\n    optimizer = optax.adam(learning_rate=learning_rate,\
    \ b1=0.9, b2=0.999, eps=1e-8)\n    return optimizer\n```\n\n## Modifying Training\
    \ Step\n\nNext, make sure the gradients are calculated at a higher precision.\n\
    \n```\n@jax.jit\ndef train_step(state, batch):\n  images = batch['images']\n \
    \ labels = batch['labels']\n  def loss_fn(params):\n    loss = scaled_loss(params,\
    \ images, labels)\n    return loss\n  grads = jax.grad(loss_fn)(state.params)\n\
    \  grads = jax.tree_map(lambda g: g.astype(jnp.float32), grads)  # Cast gradients\
    \ to float32\n  state = state.apply_gradients(grads=grads)\n  return state\n```\n\
    \nJust to make sure we're on the same page here, we need to initialise the model\
    \ parameters to the desired precision.\n\n```\ndef create_train_state(rng, learning_rate):\n\
    \  model = LowPrecisionModel()\n  params = model.init(rng, jnp.ones([1, 28, 28],\
    \ dtype=jnp.float16))['params']\n  optimizer = create_optimizer(learning_rate)\n\
    \  state = train_state.TrainState.create(apply_fn=model.apply, params=params,\
    \ tx=optimizer)\n  return state\n```\n\n## Training Model\n\nThen, proceed with\
    \ the training loop as usual, and followed by evaluation of model performance.\n\
    \n```\nrng = jax.random.PRNGKey(0)\nstate = create_train_state(rng, learning_rate=0.001)\n\
    for epoch in range(num_epochs):\n    for batch in train_ds:\n        state = train_step(state,\
    \ batch)\n    print(f\"Epoch {epoch + 1} completed.\")\n#model performance evaluation\n\
    def evaluate_model(state, test_ds):\n  total_loss = 0.0\n  total_accuracy = 0.0\n\
    \  for batch in test_ds:\n    images = batch['images'].astype(jnp.float16)\n \
    \   labels = batch['labels']\n    logits = LowPrecisionModel().apply({'params':\
    \ state.params}, images)\n    loss = optax.softmax_cross_entropy_with_integer_labels(logits,\
    \ labels).mean()\n    accuracy = jnp.mean(jnp.argmax(logits, -1) == labels)\n\
    \    total_loss += loss\n    total_accuracy += accuracy\n  print(f\"Test Loss:\
    \ {total_loss}, Test Accuracy: {total_accuracy}\")\nevaluate_model(state, test_ds)\n\
    ```\n\n## Utilizing `bfloat16` on TPUs\n\nIf you want to get the most out of TPUs,\
    \ use `bfloat16`. You'll get better numerical properties with lower precision\
    \ that way.\n\n```\nclass LowPrecisionModel(nn.Module):\n  @nn.compact\n  def\
    \ __call__(self, x):\n    x = x.astype(jnp.bfloat16)\n    # ... rest of the model\
    \ ...\n```\n\nIf you use lower precision data types in a smart way, you can cut\
    \ down on memory use a lot and maybe even speed up the processing. It's important\
    \ to think through these changes carefully to make sure the model stays accurate\
    \ and stable. It's important to test and validate regularly to make sure that\
    \ the benefits of reduced memory usage don't come at the cost of degraded performance.\n\
    \n## Summary\n\nWe successfully explored data type management and precision in\
    \ `JAX`, optimizing memory usage and computational efficiency. We started by tackling\
    \ the issue of unintended type promotions in arithmetic operations. We knew that\
    \ such promotions could lead to increased memory consumption and slower computations,\
    \ and we were determined to find a solution. By explicitly managing data types\
    \ and using consistent casting, we learned to prevent automatic promotions and\
    \ maintain control over our numerical precision.\n\nWe found that implementing\
    \ mixed-precision training is a highly effective technique for accelerating computations.\
    \ We achieved faster training times without significant loss of accuracy by using\
    \ lower precision types like `float16` for most operations and reserving `float32`\
    \ for critical calculations. We also successfully addressed the challenge of debugging\
    \ type errors in complex functions. By systematically diagnosing, explicitly casting\
    \ types, and leveraging `JAX`'s debugging tools, we were able to identify and\
    \ resolve data type issues that could cause functions to fail unexpectedly. This\
    \ proved the necessity of meticulous attention to data types throughout code development.\n\
    \nThe chapter then moved on to the implementation of custom data types within\
    \ `JAX`'s framework, acknowledging scenarios where specialized numeric types are\
    \ necessary. We integrated custom data types into `JAX`'s automatic differentiation\
    \ system by leveraging custom `VJP` and `JVP` functions. Finally, we optimized\
    \ memory usage by employing lower precision types where appropriate. We effectively\
    \ reduced the memory footprint of our models by adjusting data loading, model\
    \ definitions, and computational precision.\n\n# Chapter 7: Integrating Foreign\
    \ Functions (FFI)\n"
  trans: "\n# 使用低精度类型优化内存\n\n现在，在处理大型模型或数据集时，像 `float64` 这样高精度的数据类型会消耗大量内存，导致资源受限和性能下降。这在训练深度神经网络时尤其成问题，因为此时内存带宽是瓶颈。为了解决这个问题，你希望策略性地使用较低精度的数据类型（如\
    \ `float16` 或在可接受的情况下），以减少内存占用并可能提高计算速度。\n\n## 分析模型和数据\n\n所以首先，检查你的模型以识别可以在较低精度下运行的组件：\n\
    \n- Weights and Activations: Often can be in lower precision.\n- Gradients: May\
    \ need higher precision to prevent underflow.\n- Loss Computation: Typically requires\
    \ higher precision.\n\n## 以低精度加载数据\n\n我们需要调整数据加载过程以使用低精度类型。例如：\n\n```\nimport\
    \ jax.numpy as jnp\n# Load data as float16\ntrain_images = ...  # Load as NumPy\
    \ array\ntrain_images = train_images.astype(jnp.float16) / 255.0  # Normalize\n\
    train_labels = ...  # Labels can remain as integers\n```\n\n## 使用低精度参数定义模型\n\n\
    只需调整模型定义以使用 `Flax` 中的低精度数据类型：\n\n```\nfrom flax import linen as nn\nclass LowPrecisionModel(nn.Module):\n\
    \  @nn.compact\n  def __call__(self, x):\n    x = x.astype(jnp.float16)\n    x\
    \ = x.reshape((x.shape[0], -1))\n    x = nn.Dense(features=256, dtype=jnp.float16)(x)\n\
    \    x = nn.relu(x)\n    x = nn.Dense(features=128, dtype=jnp.float16)(x)\n  \
    \  x = nn.relu(x)\n    x = nn.Dense(features=10, dtype=jnp.float16)(x)\n    x\
    \ = x.astype(jnp.float32)  # Convert to float32 for loss computation\n    return\
    \ x\n```\n\n## 调整优化器\n\n这里，使用 `Optax` 来处理低精度参数。\n\n```\nimport optax\ndef create_optimizer(learning_rate):\n\
    \    # Use an optimizer that supports lower precision\n    optimizer = optax.adam(learning_rate=learning_rate,\
    \ b1=0.9, b2=0.999, eps=1e-8)\n    return optimizer\n```\n\n## 修改训练步骤\n\n接下来，确保梯度以更高精度计算。\n\
    \n```\n@jax.jit\ndef train_step(state, batch):\n  images = batch['images']\n \
    \ labels = batch['labels']\n  def loss_fn(params):\n    loss = scaled_loss(params,\
    \ images, labels)\n    return loss\n  grads = jax.grad(loss_fn)(state.params)\n\
    \  grads = jax.tree_map(lambda g: g.astype(jnp.float32), grads)  # Cast gradients\
    \ to float32\n  state = state.apply_gradients(grads=grads)\n  return state\n```\n\
    \n为了确保我们理解一致，这里需要将模型参数初始化为期望的精度。\n\n```\ndef create_train_state(rng, learning_rate):\n\
    \  model = LowPrecisionModel()\n  params = model.init(rng, jnp.ones([1, 28, 28],\
    \ dtype=jnp.float16))['params']\n  optimizer = create_optimizer(learning_rate)\n\
    \  state = train_state.TrainState.create(apply_fn=model.apply, params=params,\
    \ tx=optimizer)\n  return state\n```\n\n## 训练模型\n\n然后，按通常方式继续训练循环，并随后评估模型性能。\n\
    \n```\nrng = jax.random.PRNGKey(0)\nstate = create_train_state(rng, learning_rate=0.001)\n\
    for epoch in range(num_epochs):\n    for batch in train_ds:\n        state = train_step(state,\
    \ batch)\n    print(f\"Epoch {epoch + 1} completed.\")\n#model performance evaluation\n\
    def evaluate_model(state, test_ds):\n  total_loss = 0.0\n  total_accuracy = 0.0\n\
    \  for batch in test_ds:\n    images = batch['images'].astype(jnp.float16)\n \
    \   labels = batch['labels']\n    logits = LowPrecisionModel().apply({'params':\
    \ state.params}, images)\n    loss = optax.softmax_cross_entropy_with_integer_labels(logits,\
    \ labels).mean()\n    accuracy = jnp.mean(jnp.argmax(logits, -1) == labels)\n\
    \    total_loss += loss\n    total_accuracy += accuracy\n  print(f\"Test Loss:\
    \ {total_loss}, Test Accuracy: {total_accuracy}\")\nevaluate_model(state, test_ds)\n\
    ```\n\n## 在 TPU 上使用 `bfloat16`\n\n如果你想充分利用 TPU，请使用 `bfloat16`。这样可以在较低精度下获得更好的数值特性。\n\
    \n```\nclass LowPrecisionModel(nn.Module):\n  @nn.compact\n  def __call__(self,\
    \ x):\n    x = x.astype(jnp.bfloat16)\n    # ... rest of the model ...\n```\n\n\
    如果你以智能的方式使用低精度数据类型，可以大幅减少内存使用，甚至可能加快处理速度。重要的是仔细考虑这些更改，以确保模型保持准确和稳定。定期测试和验证很重要，以确保减少内存使用的好处不会以性能下降为代价。\n\
    \n## 总结\n\n我们成功探索了 `JAX` 中的数据类型管理和精度，优化了内存使用和计算效率。我们首先解决了算术运算中意外的类型提升问题。我们知道此类提升可能导致内存消耗增加和计算变慢，并且我们决心找到解决方案。通过显式管理数据类型并使用一致的类型转换，我们学会了防止自动提升并保持对数值精度的控制。\n\
    \n我们发现实现混合精度训练是加速计算的非常有效技术。我们通过对大多数操作使用 `float16` 等低精度类型，并为关键计算保留 `float32`，在没有显著损失精度的情况下实现了更快的训练时间。我们还成功解决了复杂函数中调试类型错误的挑战。通过系统诊断、显式转换类型并利用\
    \ `JAX` 的调试工具，我们能够识别和解决可能导致函数意外失败的数据类型问题。这证明了在整个代码开发过程中细致关注数据类型的必要性。\n\n本章随后转向在\
    \ `JAX` 框架内实现自定义数据类型，承认了需要专用数值类型的场景。我们通过利用自定义 `VJP` 和 `JVP` 函数，将自定义数据类型集成到 `JAX`\
    \ 的自动微分系统中。最后，我们通过在适当的地方采用低精度类型来优化内存使用。我们通过调整数据加载、模型定义和计算精度，有效减少了模型的内存占用。\n\n\
    # 第 7 章：集成外部函数（FFI）\n"
