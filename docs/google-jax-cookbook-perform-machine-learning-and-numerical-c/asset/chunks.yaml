- raw: '  Evaluating and Visualizing Model Performance    Assessing a machine learning
    model’s learning progress is essential for understanding its effectiveness and
    identifying areas for improvement. In JAX-based workflows, it can be challenging
    to implement evaluation metrics and visualize the model''s training and testing
    performance without high-level libraries. To address this, we will use evaluation
    metrics such as accuracy, precision, recall, and confusion matrices, along with
    visualization tools like Matplotlib, to track the model''s progress and gain insights
    into its behavior during training. This recipe demonstrates how to implement these
    techniques to monitor the performance of the JAX model we have developed so far.   
    Here, to evaluate and visualize the model''s performance effectively, we will:   
    Implement standard evaluation metrics such as accuracy, precision, recall, and
    confusion matrix.  Visualize the model’s learning curves by plotting metrics like
    loss and accuracy over time.  Use confusion matrices to identify where the model
    is making correct and incorrect predictions.  Integrate these evaluation techniques
    into the JAX training and testing workflow.    Implement Evaluation Metrics   
    To start, we will implement common evaluation metrics, focusing on accuracy, precision,
    recall, and confusion matrix calculation.      import jax.numpy as jnp    def
    compute\_accuracy(params, test\_ds):        """Calculate the accuracy of the model
    on the test dataset."""       correct \= 0       total \= 0       for batch in
    test\_ds:           images, labels \= batch           # Perform the forward pass
    to get predictions           preds \= forward(params, images)           # Get
    the predicted class by taking the argmax           predicted\_class \= jnp.argmax(preds,
    axis=1)           # Count correct predictions           correct += jnp.sum(predicted\_class
    \== labels)           total += labels.shape\[0\]       accuracy \= correct / total   
       return accuracy    def compute\_precision\_recall(params, test\_ds, num\_classes=10):   
        """Calculate precision and recall for each class."""       true\_positives
    \= jnp.zeros(num\_classes)       false\_positives \= jnp.zeros(num\_classes)   
       false\_negatives \= jnp.zeros(num\_classes)       for batch in test\_ds:   
           images, labels \= batch           preds \= forward(params, images)     
         predicted\_class \= jnp.argmax(preds, axis=1)           for i in range(num\_classes):   
               true\_positives \= true\_positives.at\[i\].add(jnp.sum((predicted\_class
    \== i) & (labels \== i)))               false\_positives \= false\_positives.at\[i\].add(jnp.sum((predicted\_class
    \== i) & (labels != i)))               false\_negatives \= false\_negatives.at\[i\].add(jnp.sum((predicted\_class
    != i) & (labels \== i)))       # Compute precision and recall        precision
    \= true\_positives / (true\_positives \+ false\_positives \+ 1e-8)        recall
    \= true\_positives / (true\_positives \+ false\_negatives \+ 1e-8)       return
    precision, recall      The compute\_accuracy function calculates the overall accuracy,
    while the compute\_precision\_recall function calculates precision and recall
    for each class, providing more detailed performance insights.    Compute Confusion
    Matrix    A confusion matrix can help visualize the model''s performance across
    different classes by showing where the model is making correct and incorrect predictions.   
      def compute\_confusion\_matrix(params, test\_ds, num\_classes=10):        """Compute
    the confusion matrix for the test dataset."""       confusion\_matrix \= jnp.zeros((num\_classes,
    num\_classes))       for batch in test\_ds:           images, labels \= batch   
           preds \= forward(params, images)           predicted\_class \= jnp.argmax(preds,
    axis=1)           for true\_label, pred\_label in zip(labels, predicted\_class):   
               confusion\_matrix \= confusion\_matrix.at\[true\_label, pred\_label\].add(1)   
       return confusion\_matrix      The confusion matrix will help identify patterns
    in the model’s errors, indicating which classes the model confuses with each other.   
    Visualize Training Progress    To understand how the model improves over time,
    plot the training and validation loss and accuracy for each epoch. We will use
    Matplotlib for visualization.      import matplotlib.pyplot as plt    def plot\_learning\_curves(training\_losses,
    validation\_accuracies):        """Plot the learning curves for loss and accuracy."""   
        epochs \= range(1, len(training\_losses) \+ 1)       # Plot training loss   
       plt.figure(figsize=(12, 5))       plt.subplot(1, 2, 1)       plt.plot(epochs,
    training\_losses, label=''Training Loss'')       plt.xlabel(''Epoch'')       plt.ylabel(''Loss'')   
       plt.title(''Training Loss Over Time'')       plt.legend()       # Plot validation
    accuracy       plt.subplot(1, 2, 2)       plt.plot(epochs, validation\_accuracies,
    label=''Validation Accuracy'')       plt.xlabel(''Epoch'')       plt.ylabel(''Accuracy'')   
       plt.title(''Validation Accuracy Over Time'')       plt.legend()       plt.show()   
    \# Example data for demonstration    training\_losses \= \[0.9, 0.7, 0.5, 0.3,
    0.2\]  \# Dummy loss values    validation\_accuracies \= \[0.70, 0.75, 0.80, 0.85,
    0.88\]  \# Dummy accuracy values    \# Plot the learning curves    plot\_learning\_curves(training\_losses,
    validation\_accuracies)      These plots help visualize the trends in loss reduction
    and accuracy improvement during training, providing insight into the model''s
    learning process.    Visualize Confusion Matrix    Visualizing the confusion matrix
    helps in understanding the types of mistakes the model makes.      import seaborn
    as sns    def plot\_confusion\_matrix(conf\_matrix, class\_names):        """Plot
    the confusion matrix using Seaborn."""       plt.figure(figsize=(10, 8))       
    sns.heatmap(conf\_matrix, annot=True, fmt="d", cmap="Blues", xticklabels=class\_names,
    yticklabels=class\_names)       plt.xlabel(''Predicted Label'')       plt.ylabel(''True
    Label'')       plt.title(''Confusion Matrix'')       plt.show()    \# Example
    class names for Fashion MNIST    class\_names \= \[       ''T-shirt/top'', ''Trouser'',
    ''Pullover'', ''Dress'', ''Coat'',        ''Sandal'', ''Shirt'', ''Sneaker'',
    ''Bag'', ''Ankle boot''    \]    \# Compute the confusion matrix    conf\_matrix
    \= compute\_confusion\_matrix(trained\_params, test\_ds, num\_classes=10)    \#
