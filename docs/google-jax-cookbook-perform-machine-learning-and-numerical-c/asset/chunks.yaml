- raw: '  Saving Trained Models for Deployment    After training a neural network
    model, you may need to deploy the model to a production environment for inference.
    However, unlike some other frameworks, JAX does not have a built-in, standardized
    method for exporting models, including both the architecture and the trained parameters.
    This can make it unclear how to save and load models for deployment. The situation
    here is to find an effective way to serialize both the model parameters and the
    architecture so that the trained model can be easily loaded and used in a production
    setting, and such that the model''s performance during inference matches that
    observed during training.    So here, to deploy a trained JAX model, primarily,
    you need to save two main components:    ●         Model Parameters (Weights and
    These are typically organized as Pytrees and can be serialized using flax.serialization.  Model
    Since JAX uses functional programming paradigms, the model architecture is defined
    by the functions you''ve written. To "save" the architecture, you can either save
    the source code or use serialization methods if you''ve used Flax or Haiku that
    support model serialization.    Here, in this recipe, we''ll explore methods to
    save and load both the model parameters and the architecture so as to deploy your
    JAX model for production use.    Define and Train Model    Let us first define
    the model:      class FashionMNISTModel(nn.Module):       @nn.compact       def
    \_\_call\_\_(self, x):           x \= x.reshape((x.shape\[0\], \-1))  # Flatten
    the images           x \= nn.Dense(features=128)(x)           x \= nn.relu(x)   
           x \= nn.Dense(features=10)(x)           x \= nn.log\_softmax(x)  # For
    classification           return x      Then, load and prepare the data:      \#
    Load the dataset    ds\_builder \= tfds.builder(''fashion\_mnist'')    ds\_builder.download\_and\_prepare()   
    train\_ds \= tfds.as\_numpy(ds\_builder.as\_dataset(split=''train'', batch\_size=-1))   
    test\_ds \= tfds.as\_numpy(ds\_builder.as\_dataset(split=''test'', batch\_size=-1))   
    \# Convert to JAX arrays    train\_images \= jnp.array(train\_ds\[''image''\])
    / 255.0    train\_labels \= jnp.array(train\_ds\[''label''\])    test\_images
    \= jnp.array(test\_ds\[''image''\]) / 255.0    test\_labels \= jnp.array(test\_ds\[''label''\])   
      Next, create a training function:      def create\_train\_state(rng, learning\_rate):   
       model \= FashionMNISTModel()        params \= model.init(rng, jnp.ones(\[1,
    28, 28\]))\[''params''\]       tx \= optax.sgd(learning\_rate)       return train\_state.TrainState.create(apply\_fn=model.apply,
    params=params, tx=tx)      After this, define the loss and accuracy functions:   
      def compute\_metrics(logits, labels):       loss \= jnp.mean(optax.softmax\_cross\_entropy(logits,
    one\_hot(labels, num\_classes=10)))        accuracy \= jnp.mean(jnp.argmax(logits,
    \-1) \== labels)       return {''loss'': loss, ''accuracy'': accuracy}    def
    one\_hot(labels, num\_classes):       return jnp.eye(num\_classes)\[labels\]   
      Then, start training the model:      @jit    def train\_step(state, batch):   
       def loss\_fn(params):           logits \= state.apply\_fn({''params'': params},
    batch\[''image''\])           loss \= jnp.mean(optax.softmax\_cross\_entropy(logits,
    one\_hot(batch\[''label''\], 10)))           return loss       grads \= grad(loss\_fn)(state.params)   
       state \= state.apply\_gradients(grads=grads)       return state    \# Prepare
    the training data    batch\_size \= 128    num\_epochs \= 5    steps\_per\_epoch
    \= train\_images.shape\[0\] // batch\_size    rng \= random.PRNGKey(0)    state
    \= create\_train\_state(rng, learning\_rate=0.1)    for epoch in range(num\_epochs):   
       perm \= random.permutation(rng, train\_images.shape\[0\])       for i in range(steps\_per\_epoch):   
           batch\_idx \= perm\[i \* batch\_size:(i \+ 1) \* batch\_size\]         
     batch \= {''image'': train\_images\[batch\_idx\], ''label'': train\_labels\[batch\_idx\]}   
           state \= train\_step(state, batch)       print(f''Epoch {epoch \+ 1} completed.'')   
      Save Model Parameters    After training, you need to save the model''s parameters
    using flax.serialization.      from flax.training import checkpoints    \# Save
    the checkpoint    ckpt\_dir \= ''./checkpoints''    checkpoints.save\_checkpoint(ckpt\_dir,
    target=state.params, step=0, overwrite=True)      This saves the model parameters
    in a format that can be easily restored later.    Save and Load Model for Inference   
    In our case, since the model does not have any additional state beyond the parameters,
    saving the class definition is the best way. Then, we can load the model parameters
    and use the model for inference in our production environment.    To do this,
    we first load the parameters:      \# Load the checkpoint    from flax.training
    import checkpoints    ckpt\_dir \= ''./checkpoints''    params \= checkpoints.restore\_checkpoint(ckpt\_dir,
    target=None)      Then, instantiate the model:      model \= FashionMNISTModel()   
      Followed by, we define an inference function:      def predict(images):     
     logits \= model.apply({''params'': params}, images)       predictions \= jnp.argmax(logits,
    axis=-1)       return predictions      Next, we test the model on new data:   
      \# Use test images for demonstration    sample\_images \= test\_images\[:10\]   
    sample\_labels \= test\_labels\[:10\]    predictions \= predict(sample\_images)   
    print("Predictions:", predictions)    print("Actual Labels:", sample\_labels)   
      Deploy Model    Depending on the deployment target which can be a web server,
    cloud function or an embedded device, we need to:    ●       Set up a server or
    endpoint to receive input data and return predictions.    ●       Ensure that
    the environment is properly configured with all dependencies.    ●       Implement
    security and scalability measures as needed.    The given below is a quick example
    of model deployment:      \# inference.py    from flask import Flask, request,
    jsonify    import jax    import jax.numpy as jnp    from flax import linen as
    nn    from flax.training import checkpoints    from model import FashionMNISTModel   
    app \= Flask(\_\_name\_\_)    \# Load the model parameters    ckpt\_dir \= ''./checkpoints''   
    params \= checkpoints.restore\_checkpoint(ckpt\_dir, target=None)    \# Instantiate
    the model    model \= FashionMNISTModel()    \# JIT-compiled prediction function   
    @jax.jit    def predict(images):       logits \= model.apply({''params'': params},
    images)       predictions \= jnp.argmax(logits, axis=-1)       return predictions   
    @app.route(''/predict'', methods=\[''POST''\])    def predict\_route():       data
    \= request.get\_json()        images \= jnp.array(data\[''images''\]) / 255.0 
    \# Normalize if necessary       preds \= predict(images).tolist()       return
    jsonify({''predictions'': preds})    if \_\_name\_\_ \== ''\_\_main\_\_'':   
       app.run(host=''0.0.0.0'', port=8080)      Testing Deployment    Finally, to
    test, just send a request to the endpoint:      import requests    import json   
    \# Sample data    sample\_images \= test\_images\[:2\]    sample\_images\_list
    \= sample\_images.tolist()    \# Send a POST request    response \= requests.post(''http://localhost:8080/predict'',
    json={''images'': sample\_images\_list})    \# Get the predictions    predictions
    \= response.json()\[''predictions''\]    print("Predictions:", predictions)   
      If you follow these steps, you''ll be able to save your trained JAX models and
    deploy them easily. Using Flax, we saw how it makes easier to persist models and
    share them, and to integrate them into applications.    '
  fmt: "\n# Saving Trained Models for Deployment\n\nAfter training a neural network\
    \ model, you may need to deploy the model to a production environment for inference.\
    \ However, unlike some other frameworks, `JAX` does not have a built-in, standardized\
    \ method for exporting models, including both the architecture and the trained\
    \ parameters. This can make it unclear how to save and load models for deployment.\
    \ The situation here is to find an effective way to serialize both the model parameters\
    \ and the architecture so that the trained model can be easily loaded and used\
    \ in a production setting, and such that the model's performance during inference\
    \ matches that observed during training.\n\nSo here, to deploy a trained `JAX`\
    \ model, primarily, you need to save two main components:\n\n* `Model Parameters`\
    \ (Weights and biases). These are typically organized as `Pytrees` and can be\
    \ serialized using `flax.serialization`.\n* `Model Architecture`. Since `JAX`\
    \ uses functional programming paradigms, the model architecture is defined by\
    \ the functions you've written. To \"save\" the architecture, you can either save\
    \ the source code or use serialization methods if you've used `Flax` or `Haiku`\
    \ that support model serialization.\n\nHere, in this recipe, we'll explore methods\
    \ to save and load both the model parameters and the architecture so as to deploy\
    \ your `JAX` model for production use.\n\n## Define and Train Model\n\nLet us\
    \ first define the model:\n\n```python\nclass FashionMNISTModel(nn.Module):\n\
    \    @nn.compact\n    def __call__(self, x):\n        x = x.reshape((x.shape[0],\
    \ -1))  # Flatten the images\n        x = nn.Dense(features=128)(x)\n        x\
    \ = nn.relu(x)\n        x = nn.Dense(features=10)(x)\n        x = nn.log_softmax(x)\
    \  # For classification\n        return x\n```\n\nThen, load and prepare the data:\n\
    \n```python\n# Load the dataset\nds_builder = tfds.builder('fashion_mnist')\n\
    ds_builder.download_and_prepare()\ntrain_ds = tfds.as_numpy(ds_builder.as_dataset(split='train',\
    \ batch_size=-1))\ntest_ds = tfds.as_numpy(ds_builder.as_dataset(split='test',\
    \ batch_size=-1))\n# Convert to JAX arrays\ntrain_images = jnp.array(train_ds['image'])\
    \ / 255.0\ntrain_labels = jnp.array(train_ds['label'])\ntest_images = jnp.array(test_ds['image'])\
    \ / 255.0\ntest_labels = jnp.array(test_ds['label'])\n```\n\nNext, create a training\
    \ function:\n\n```python\ndef create_train_state(rng, learning_rate):\n    model\
    \ = FashionMNISTModel()\n    params = model.init(rng, jnp.ones([1, 28, 28]))['params']\n\
    \    tx = optax.sgd(learning_rate)\n    return train_state.TrainState.create(apply_fn=model.apply,\
    \ params=params, tx=tx)\n```\n\nAfter this, define the loss and accuracy functions:\n\
    \n```python\ndef compute_metrics(logits, labels):\n    loss = jnp.mean(optax.softmax_cross_entropy(logits,\
    \ one_hot(labels, num_classes=10)))\n    accuracy = jnp.mean(jnp.argmax(logits,\
    \ -1) == labels)\n    return {'loss': loss, 'accuracy': accuracy}\n\ndef one_hot(labels,\
    \ num_classes):\n    return jnp.eye(num_classes)[labels]\n```\n\nThen, start training\
    \ the model:\n\n```python\n@jit\ndef train_step(state, batch):\n    def loss_fn(params):\n\
    \        logits = state.apply_fn({'params': params}, batch['image'])\n       \
    \ loss = jnp.mean(optax.softmax_cross_entropy(logits, one_hot(batch['label'],\
    \ 10)))\n        return loss\n    grads = grad(loss_fn)(state.params)\n    state\
    \ = state.apply_gradients(grads=grads)\n    return state\n\n# Prepare the training\
    \ data\nbatch_size = 128\nnum_epochs = 5\nsteps_per_epoch = train_images.shape[0]\
    \ // batch_size\nrng = random.PRNGKey(0)\nstate = create_train_state(rng, learning_rate=0.1)\n\
    for epoch in range(num_epochs):\n    perm = random.permutation(rng, train_images.shape[0])\n\
    \    for i in range(steps_per_epoch):\n        batch_idx = perm[i * batch_size:(i\
    \ + 1) * batch_size]\n        batch = {'image': train_images[batch_idx], 'label':\
    \ train_labels[batch_idx]}\n        state = train_step(state, batch)\n    print(f'Epoch\
    \ {epoch + 1} completed.')\n```\n\n## Save Model Parameters\n\nAfter training,\
    \ you need to save the model's parameters using `flax.serialization`.\n\n```python\n\
    from flax.training import checkpoints\n# Save the checkpoint\nckpt_dir = './checkpoints'\n\
    checkpoints.save_checkpoint(ckpt_dir, target=state.params, step=0, overwrite=True)\n\
    ```\n\nThis saves the model parameters in a format that can be easily restored\
    \ later.\n\n## Save and Load Model for Inference\n\nIn our case, since the model\
    \ does not have any additional state beyond the parameters, saving the class definition\
    \ is the best way. Then, we can load the model parameters and use the model for\
    \ inference in our production environment.\n\nTo do this, we first load the parameters:\n\
    \n```python\n# Load the checkpoint\nfrom flax.training import checkpoints\nckpt_dir\
    \ = './checkpoints'\nparams = checkpoints.restore_checkpoint(ckpt_dir, target=None)\n\
    ```\n\nThen, instantiate the model:\n\n```python\nmodel = FashionMNISTModel()\n\
    ```\n\nFollowed by, we define an inference function:\n\n```python\ndef predict(images):\n\
    \    logits = model.apply({'params': params}, images)\n    predictions = jnp.argmax(logits,\
    \ axis=-1)\n    return predictions\n```\n\nNext, we test the model on new data:\n\
    \n```python\n# Use test images for demonstration\nsample_images = test_images[:10]\n\
    sample_labels = test_labels[:10]\npredictions = predict(sample_images)\nprint(\"\
    Predictions:\", predictions)\nprint(\"Actual Labels:\", sample_labels)\n```\n\n\
    ## Deploy Model\n\nDepending on the deployment target which can be a web server,\
    \ cloud function or an embedded device, we need to:\n\n* Set up a server or endpoint\
    \ to receive input data and return predictions.\n* Ensure that the environment\
    \ is properly configured with all dependencies.\n* Implement security and scalability\
    \ measures as needed.\n\nThe given below is a quick example of model deployment:\n\
    \n```python\n# inference.py\nfrom flask import Flask, request, jsonify\nimport\
    \ jax\nimport jax.numpy as jnp\nfrom flax import linen as nn\nfrom flax.training\
    \ import checkpoints\nfrom model import FashionMNISTModel\napp = Flask(__name__)\n\
    # Load the model parameters\nckpt_dir = './checkpoints'\nparams = checkpoints.restore_checkpoint(ckpt_dir,\
    \ target=None)\n# Instantiate the model\nmodel = FashionMNISTModel()\n# JIT-compiled\
    \ prediction function\n@jax.jit\ndef predict(images):\n    logits = model.apply({'params':\
    \ params}, images)\n    predictions = jnp.argmax(logits, axis=-1)\n    return\
    \ predictions\n\n@app.route('/predict', methods=['POST'])\ndef predict_route():\n\
    \    data = request.get_json()\n    images = jnp.array(data['images']) / 255.0\
    \  # Normalize if necessary\n    preds = predict(images).tolist()\n    return\
    \ jsonify({'predictions': preds})\n\nif __name__ == '__main__':\n    app.run(host='0.0.0.0',\
    \ port=8080)\n```\n\n## Testing Deployment\n\nFinally, to test, just send a request\
    \ to the endpoint:\n\n```python\nimport requests\nimport json\n# Sample data\n\
    sample_images = test_images[:2]\nsample_images_list = sample_images.tolist()\n\
    # Send a POST request\nresponse = requests.post('http://localhost:8080/predict',\
    \ json={'images': sample_images_list})\n# Get the predictions\npredictions = response.json()['predictions']\n\
    print(\"Predictions:\", predictions)\n```\n\nIf you follow these steps, you'll\
    \ be able to save your trained `JAX` models and deploy them easily. Using `Flax`,\
    \ we saw how it makes easier to persist models and share them, and to integrate\
    \ them into applications.\n"
  trans: "\n# 为部署保存训练模型\n\n在训练神经网络模型后，您可能需要将模型部署到生产环境中进行推理。然而，与某些其他框架不同，`JAX` 没有内置的、标准化的模型导出方法，包括架构和训练参数。这可能会使如何保存和加载模型以进行部署变得不明确。这里的情况是找到一种有效的方法来序列化模型参数和架构，以便训练好的模型可以轻松加载并在生产环境中使用，并且推理期间的模型性能与训练期间观察到的性能相匹配。\n\
    \n因此，在这里，要部署训练好的 `JAX` 模型，主要需要保存两个主要组件：\n\n* `Model Parameters`（权重和偏置）。这些通常以 `Pytrees`\
    \ 组织，并可使用 `flax.serialization` 序列化。\n* `Model Architecture`。由于 `JAX` 使用函数式编程范式，模型架构由您编写的函数定义。要“保存”架构，您可以保存源代码，或如果您使用了支持模型序列化的\
    \ `Flax` 或 `Haiku`，则使用序列化方法。\n\n在本教程中，我们将探讨保存和加载模型参数和架构的方法，以便将您的 `JAX` 模型部署用于生产。\n\
    \n## 定义和训练模型\n\n让我们首先定义模型：\n\n```python\nclass FashionMNISTModel(nn.Module):\n\
    \    @nn.compact\n    def __call__(self, x):\n        x = x.reshape((x.shape[0],\
    \ -1))  # Flatten the images\n        x = nn.Dense(features=128)(x)\n        x\
    \ = nn.relu(x)\n        x = nn.Dense(features=10)(x)\n        x = nn.log_softmax(x)\
    \  # For classification\n        return x\n```\n\n然后，加载和准备数据：\n\n```python\n#\
    \ Load the dataset\nds_builder = tfds.builder('fashion_mnist')\nds_builder.download_and_prepare()\n\
    train_ds = tfds.as_numpy(ds_builder.as_dataset(split='train', batch_size=-1))\n\
    test_ds = tfds.as_numpy(ds_builder.as_dataset(split='test', batch_size=-1))\n\
    # Convert to JAX arrays\ntrain_images = jnp.array(train_ds['image']) / 255.0\n\
    train_labels = jnp.array(train_ds['label'])\ntest_images = jnp.array(test_ds['image'])\
    \ / 255.0\ntest_labels = jnp.array(test_ds['label'])\n```\n\n接下来，创建训练函数：\n\n```python\n\
    def create_train_state(rng, learning_rate):\n    model = FashionMNISTModel()\n\
    \    params = model.init(rng, jnp.ones([1, 28, 28]))['params']\n    tx = optax.sgd(learning_rate)\n\
    \    return train_state.TrainState.create(apply_fn=model.apply, params=params,\
    \ tx=tx)\n```\n\n之后，定义损失和准确率函数：\n\n```python\ndef compute_metrics(logits, labels):\n\
    \    loss = jnp.mean(optax.softmax_cross_entropy(logits, one_hot(labels, num_classes=10)))\n\
    \    accuracy = jnp.mean(jnp.argmax(logits, -1) == labels)\n    return {'loss':\
    \ loss, 'accuracy': accuracy}\n\ndef one_hot(labels, num_classes):\n    return\
    \ jnp.eye(num_classes)[labels]\n```\n\n然后，开始训练模型：\n\n```python\n@jit\ndef train_step(state,\
    \ batch):\n    def loss_fn(params):\n        logits = state.apply_fn({'params':\
    \ params}, batch['image'])\n        loss = jnp.mean(optax.softmax_cross_entropy(logits,\
    \ one_hot(batch['label'], 10)))\n        return loss\n    grads = grad(loss_fn)(state.params)\n\
    \    state = state.apply_gradients(grads=grads)\n    return state\n\n# Prepare\
    \ the training data\nbatch_size = 128\nnum_epochs = 5\nsteps_per_epoch = train_images.shape[0]\
    \ // batch_size\nrng = random.PRNGKey(0)\nstate = create_train_state(rng, learning_rate=0.1)\n\
    for epoch in range(num_epochs):\n    perm = random.permutation(rng, train_images.shape[0])\n\
    \    for i in range(steps_per_epoch):\n        batch_idx = perm[i * batch_size:(i\
    \ + 1) * batch_size]\n        batch = {'image': train_images[batch_idx], 'label':\
    \ train_labels[batch_idx]}\n        state = train_step(state, batch)\n    print(f'Epoch\
    \ {epoch + 1} completed.')\n```\n\n## 保存模型参数\n\n训练后，您需要使用 `flax.serialization`\
    \ 保存模型的参数。\n\n```python\nfrom flax.training import checkpoints\n# Save the checkpoint\n\
    ckpt_dir = './checkpoints'\ncheckpoints.save_checkpoint(ckpt_dir, target=state.params,\
    \ step=0, overwrite=True)\n```\n\n这会以可稍后轻松恢复的格式保存模型参数。\n\n## 保存和加载模型以进行推理\n\n\
    在我们的例子中，由于模型除了参数之外没有其他状态，保存类定义是最好的方法。然后，我们可以加载模型参数并在生产环境中使用模型进行推理。\n\n为此，我们首先加载参数：\n\
    \n```python\n# Load the checkpoint\nfrom flax.training import checkpoints\nckpt_dir\
    \ = './checkpoints'\nparams = checkpoints.restore_checkpoint(ckpt_dir, target=None)\n\
    ```\n\n然后，实例化模型：\n\n```python\nmodel = FashionMNISTModel()\n```\n\n随后，我们定义一个推理函数：\n\
    \n```python\ndef predict(images):\n    logits = model.apply({'params': params},\
    \ images)\n    predictions = jnp.argmax(logits, axis=-1)\n    return predictions\n\
    ```\n\n接下来，我们在新数据上测试模型：\n\n```python\n# Use test images for demonstration\nsample_images\
    \ = test_images[:10]\nsample_labels = test_labels[:10]\npredictions = predict(sample_images)\n\
    print(\"Predictions:\", predictions)\nprint(\"Actual Labels:\", sample_labels)\n\
    ```\n\n## 部署模型\n\n根据部署目标，可以是 Web 服务器、云函数或嵌入式设备，我们需要：\n\n* 设置服务器或端点以接收输入数据并返回预测结果。\n\
    * 确保环境已正确配置所有依赖项。\n* 根据需要实施安全和可扩展性措施。\n\n下面给出了模型部署的快速示例：\n\n```python\n# inference.py\n\
    from flask import Flask, request, jsonify\nimport jax\nimport jax.numpy as jnp\n\
    from flax import linen as nn\nfrom flax.training import checkpoints\nfrom model\
    \ import FashionMNISTModel\napp = Flask(__name__)\n# Load the model parameters\n\
    ckpt_dir = './checkpoints'\nparams = checkpoints.restore_checkpoint(ckpt_dir,\
    \ target=None)\n# Instantiate the model\nmodel = FashionMNISTModel()\n# JIT-compiled\
    \ prediction function\n@jax.jit\ndef predict(images):\n    logits = model.apply({'params':\
    \ params}, images)\n    predictions = jnp.argmax(logits, axis=-1)\n    return\
    \ predictions\n\n@app.route('/predict', methods=['POST'])\ndef predict_route():\n\
    \    data = request.get_json()\n    images = jnp.array(data['images']) / 255.0\
    \  # Normalize if necessary\n    preds = predict(images).tolist()\n    return\
    \ jsonify({'predictions': preds})\n\nif __name__ == '__main__':\n    app.run(host='0.0.0.0',\
    \ port=8080)\n```\n\n## 测试部署\n\n最后，要进行测试，只需向端点发送请求：\n\n```python\nimport requests\n\
    import json\n# Sample data\nsample_images = test_images[:2]\nsample_images_list\
    \ = sample_images.tolist()\n# Send a POST request\nresponse = requests.post('http://localhost:8080/predict',\
    \ json={'images': sample_images_list})\n# Get the predictions\npredictions = response.json()['predictions']\n\
    print(\"Predictions:\", predictions)\n```\n\n如果您遵循这些步骤，您将能够轻松保存训练好的 `JAX` 模型并部署它们。使用\
    \ `Flax`，我们看到了它如何使持久化模型和共享它们变得更容易，并将其集成到应用程序中。\n"
