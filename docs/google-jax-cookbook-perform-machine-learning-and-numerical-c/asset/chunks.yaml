    \# Register NeuralNetwork as a PyTree node    def nn\_flatten(nn):       leaves
    \= nn.layers       aux\_data \= {}       return leaves, aux\_data    def nn\_unflatten(aux\_data,
    leaves):       return NeuralNetwork(layers=leaves)    tree\_util.register\_pytree\_node(NeuralNetwork,
    nn\_flatten, nn\_unflatten)      Now you can continue to train the model using
    JAX transformations:      \# Define the loss function for the model    def model\_loss\_fn(model,
    x, y\_true):       y\_pred \= model(x)        loss \= jnp.mean((y\_pred \- y\_true)
    \*\* 2)       return loss    \# Compute gradients with respect to the model parameters   
    model\_grads \= jax.grad(model\_loss\_fn)(model, x\_data, y\_data)    \# Update
    the model parameters    updated\_model \= jax.tree\_map(update\_params, model,
    model\_grads)      Use ‘vmap’ and other Transformations    Because your custom
