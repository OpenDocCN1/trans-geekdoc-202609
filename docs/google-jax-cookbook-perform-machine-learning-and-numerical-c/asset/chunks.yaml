- raw: '  Checkpointing Long-Running Jobs    If you don''t save the model state regularly,
    unexpected things like power outages, system crashes, or preemptible cloud instances
    can cause you to lose your training progress. This can be a real waste of time
    and computing power. The goal is to set up a solid checkpointing plan that saves
    the model''s state at regular intervals during training.    To avoid losing your
    training progress, you can set up checkpointing to save the model''s parameters,
    optimizer state, and any other info needed to resume training at regular intervals.
    In JAX, you can use built-in utilities that serialize and deserialize the training
    state efficiently to make checkpointing easier.    Creating Training State   
    To begin with, first set up the training state for our defined neural network
    model, including the model parameters and optimizer.      def create\_train\_state(rng,
    learning\_rate):       model \= FashionMNISTModel()        params \= model.init(rng,
    jnp.ones(\[1, 28, 28\]))\[''params''\]       tx \= optax.adam(learning\_rate)   
       return train\_state.TrainState.create(apply\_fn=model.apply, params=params,
    tx=tx)      Next, define the loss and accuracy metrics:      def compute\_metrics(logits,
    labels):       loss \= optax.softmax\_cross\_entropy\_with\_integer\_labels(logits,
    labels).mean()        accuracy \= jnp.mean(jnp.argmax(logits, \-1) \== labels)   
       return {''loss'': loss, ''accuracy'': accuracy}      Implementing Training
    Step    Next, we use jax.jit to compile the training step for efficiency.     
    @jit    def train\_step(state, batch):       def loss\_fn(params):           logits
    \= FashionMNISTModel().apply({''params'': params}, batch\[''images''\])       
       loss \= optax.softmax\_cross\_entropy\_with\_integer\_labels(logits, batch\[''labels''\]).mean()   
           return loss       grads \= grad(loss\_fn)(state.params)       state \=
    state.apply\_gradients(grads=grads)       return state      Implementing Checkpointing   
    Then decide on a directory to store checkpoints and the frequency of saving.   
      ckpt\_dir \= ''./checkpoints''    checkpoint\_frequency \= 5  \# Save a checkpoint
    every 5 epochs      Just tweak the training loop so it saves checkpoints every
    so often.      import os    num\_epochs \= 50  \# Example for a long-running job   
    rng \= random.PRNGKey(0)    state \= create\_train\_state(rng, learning\_rate=0.001)   
    \# Restore from the latest checkpoint if available    state \= checkpoints.restore\_checkpoint(ckpt\_dir,
    target=state)    \# Determine the starting epoch    start\_epoch \= int(state.step
    / len(train\_ds))    for epoch in range(start\_epoch, num\_epochs):       for
    batch in train\_ds:           state \= train\_step(state, batch)        \# Update
    the training step (epoch)       state \= state.replace(step=state.step \+ len(train\_ds))   
        \# Save a checkpoint every ''checkpoint\_frequency'' epochs        if (epoch
    \+ 1) % checkpoint\_frequency \== 0:           checkpoints.save\_checkpoint(ckpt\_dir,
    target=state, step=state.step, overwrite=True)           print(f''Checkpoint saved
    at step {state.step}'')        \# Optionally, evaluate on the test set       #
    ... (evaluation code)       print(f''Epoch {epoch \+ 1} completed.'')      To
    quickly summarize the above script, the checkpoints.save\_checkpoint function
    saves the entire training state, including model parameters and optimizer state.
    And, we set the overwrite=True to ensure that only the latest checkpoint is kept,
    so as to save disk space.    Handling Unexpected Interruptions    In the event
    of an interruption, you can resume training from the last saved checkpoint.   
      \# Before starting the training loop    state \= checkpoints.restore\_checkpoint(ckpt\_dir,
    target=state)    \# The rest of the training loop remains the same      Customizing
    Checkpointing Strategies    You can customize the checkpointing strategy based
    on your needs. You can keep the last N checkpoints and save the model when it
    achieves the best validation accuracy.      \# In the evaluation section    if
    test\_metrics\[''accuracy''\] \> best\_accuracy:       best\_accuracy \= test\_metrics\[''accuracy''\]   
       checkpoints.save\_checkpoint(ckpt\_dir, target=state, step=state.step, prefix=''best\_'',
    overwrite=True)       print(''Best model checkpoint saved.'')      Once done,
    save the checkpoints asynchronously in order to avoid slowing down the whole training.   
    Testing Checkpoint Restoration    Now, before relying on checkpointing for long-running
    jobs, test that you can save and restore the training state correctly.      \#
    Simulate interruption    checkpoints.save\_checkpoint(ckpt\_dir, target=state,
    step=state.step, overwrite=True)    print(''Simulating interruption...'')    \#
    Reset state    state \= create\_train\_state(rng, learning\_rate=0.001)    \#
    Restore state    state \= checkpoints.restore\_checkpoint(ckpt\_dir, target=state)   
    print(''State restored. Resuming training...'')      If you use Flax''s utilities
    to set up checkpoints, you can make sure you don''t lose any progress if your
    training is interrupted. If you save the model''s state regularly, you can pick
    up where you left off with the last checkpoint, which helps you avoid wasting
    computational effort. This is a must for long-running training jobs, especially
    when you''re using preemptible cloud instances or working in environments where
    interruptions are common.    '
  fmt: "\n# Checkpointing Long-Running Jobs\n\nIf you don't save the model state regularly,\
    \ unexpected things like power outages, system crashes, or preemptible cloud instances\
    \ can cause you to lose your training progress. This can be a real waste of time\
    \ and computing power. The goal is to set up a solid checkpointing plan that saves\
    \ the model's state at regular intervals during training.\n\nTo avoid losing your\
    \ training progress, you can set up checkpointing to save the model's parameters,\
    \ optimizer state, and any other info needed to resume training at regular intervals.\
    \ In `JAX`, you can use built-in utilities that serialize and deserialize the\
    \ training state efficiently to make checkpointing easier.\n\n## Creating Training\
    \ State\n\nTo begin with, first set up the training state for our defined neural\
    \ network model, including the model parameters and optimizer.\n\n```python\n\
    def create_train_state(rng, learning_rate):\n    model = FashionMNISTModel()\n\
    \    params = model.init(rng, jnp.ones([1, 28, 28]))['params']\n    tx = optax.adam(learning_rate)\n\
    \    return train_state.TrainState.create(apply_fn=model.apply, params=params,\
    \ tx=tx)\n```\n\nNext, define the loss and accuracy metrics:\n\n```python\ndef\
    \ compute_metrics(logits, labels):\n    loss = optax.softmax_cross_entropy_with_integer_labels(logits,\
    \ labels).mean()\n    accuracy = jnp.mean(jnp.argmax(logits, -1) == labels)\n\
    \    return {'loss': loss, 'accuracy': accuracy}\n```\n\n## Implementing Training\
    \ Step\n\nNext, we use `jax.jit` to compile the training step for efficiency.\n\
    \n```python\n@jit\ndef train_step(state, batch):\n    def loss_fn(params):\n \
    \       logits = FashionMNISTModel().apply({'params': params}, batch['images'])\n\
    \        loss = optax.softmax_cross_entropy_with_integer_labels(logits, batch['labels']).mean()\n\
    \        return loss\n    grads = grad(loss_fn)(state.params)\n    state = state.apply_gradients(grads=grads)\n\
    \    return state\n```\n\n## Implementing Checkpointing\n\nThen decide on a directory\
    \ to store checkpoints and the frequency of saving.\n\n```python\nckpt_dir = './checkpoints'\n\
    checkpoint_frequency = 5  # Save a checkpoint every 5 epochs\n```\n\nJust tweak\
    \ the training loop so it saves checkpoints every so often.\n\n```python\nimport\
    \ os\nnum_epochs = 50  # Example for a long-running job\nrng = random.PRNGKey(0)\n\
    state = create_train_state(rng, learning_rate=0.001)\n# Restore from the latest\
    \ checkpoint if available\nstate = checkpoints.restore_checkpoint(ckpt_dir, target=state)\n\
    # Determine the starting epoch\nstart_epoch = int(state.step / len(train_ds))\n\
    for epoch in range(start_epoch, num_epochs):\n    for batch in train_ds:\n   \
    \     state = train_step(state, batch)\n    # Update the training step (epoch)\n\
    \    state = state.replace(step=state.step + len(train_ds))\n    # Save a checkpoint\
    \ every 'checkpoint_frequency' epochs\n    if (epoch + 1) % checkpoint_frequency\
    \ == 0:\n        checkpoints.save_checkpoint(ckpt_dir, target=state, step=state.step,\
    \ overwrite=True)\n        print(f'Checkpoint saved at step {state.step}')\n \
    \   # Optionally, evaluate on the test set\n    # ... (evaluation code)\n    print(f'Epoch\
    \ {epoch + 1} completed.')\n```\n\nTo quickly summarize the above script, the\
    \ `checkpoints.save_checkpoint` function saves the entire training state, including\
    \ model parameters and optimizer state. And, we set the `overwrite=True` to ensure\
    \ that only the latest checkpoint is kept, so as to save disk space.\n\n## Handling\
    \ Unexpected Interruptions\n\nIn the event of an interruption, you can resume\
    \ training from the last saved checkpoint.\n\n```python\n# Before starting the\
    \ training loop\nstate = checkpoints.restore_checkpoint(ckpt_dir, target=state)\n\
    # The rest of the training loop remains the same\n```\n\n## Customizing Checkpointing\
    \ Strategies\n\nYou can customize the checkpointing strategy based on your needs.\
    \ You can keep the last N checkpoints and save the model when it achieves the\
    \ best validation accuracy.\n\n```python\n# In the evaluation section\nif test_metrics['accuracy']\
    \ > best_accuracy:\n    best_accuracy = test_metrics['accuracy']\n    checkpoints.save_checkpoint(ckpt_dir,\
    \ target=state, step=state.step, prefix='best_', overwrite=True)\n    print('Best\
    \ model checkpoint saved.')\n```\n\nOnce done, save the checkpoints asynchronously\
    \ in order to avoid slowing down the whole training.\n\n## Testing Checkpoint\
    \ Restoration\n\nNow, before relying on checkpointing for long-running jobs, test\
    \ that you can save and restore the training state correctly.\n\n```python\n#\
    \ Simulate interruption\ncheckpoints.save_checkpoint(ckpt_dir, target=state, step=state.step,\
    \ overwrite=True)\nprint('Simulating interruption...')\n# Reset state\nstate =\
    \ create_train_state(rng, learning_rate=0.001)\n# Restore state\nstate = checkpoints.restore_checkpoint(ckpt_dir,\
    \ target=state)\nprint('State restored. Resuming training...')\n```\n\nIf you\
    \ use `Flax`'s utilities to set up checkpoints, you can make sure you don't lose\
    \ any progress if your training is interrupted. If you save the model's state\
    \ regularly, you can pick up where you left off with the last checkpoint, which\
    \ helps you avoid wasting computational effort. This is a must for long-running\
    \ training jobs, especially when you're using preemptible cloud instances or working\
    \ in environments where interruptions are common.\n"
  trans: "\n# 长时间运行任务的检查点\n\n如果你不定期保存模型状态，像停电、系统崩溃或可抢占云实例之类的意外情况可能会导致你丢失训练进度。这会造成时间和计算资源的真正浪费。目标是建立一个稳健的检查点计划，在训练期间以固定间隔保存模型的状态。\n\
    \n为了避免丢失训练进度，你可以设置检查点以定期保存模型的参数、优化器状态以及恢复训练所需的任何其他信息。在 `JAX` 中，你可以使用内置工具高效地序列化和反序列化训练状态，从而使检查点操作更简单。\n\
    \n## 创建训练状态\n\n首先，设置我们定义的神经网络模型的训练状态，包括模型参数和优化器。\n\n```python\ndef create_train_state(rng,\
    \ learning_rate):\n    model = FashionMNISTModel()\n    params = model.init(rng,\
    \ jnp.ones([1, 28, 28]))['params']\n    tx = optax.adam(learning_rate)\n    return\
    \ train_state.TrainState.create(apply_fn=model.apply, params=params, tx=tx)\n\
    ```\n\n接下来，定义损失和准确率指标：\n\n```python\ndef compute_metrics(logits, labels):\n  \
    \  loss = optax.softmax_cross_entropy_with_integer_labels(logits, labels).mean()\n\
    \    accuracy = jnp.mean(jnp.argmax(logits, -1) == labels)\n    return {'loss':\
    \ loss, 'accuracy': accuracy}\n```\n\n## 实现训练步骤\n\n接下来，我们使用 `jax.jit` 编译训练步骤以提高效率。\n\
    \n```python\n@jit\ndef train_step(state, batch):\n    def loss_fn(params):\n \
    \       logits = FashionMNISTModel().apply({'params': params}, batch['images'])\n\
    \        loss = optax.softmax_cross_entropy_with_integer_labels(logits, batch['labels']).mean()\n\
    \        return loss\n    grads = grad(loss_fn)(state.params)\n    state = state.apply_gradients(grads=grads)\n\
    \    return state\n```\n\n## 实现检查点\n\n然后确定用于存储检查点的目录和保存频率。\n\n```python\nckpt_dir\
    \ = './checkpoints'\ncheckpoint_frequency = 5  # Save a checkpoint every 5 epochs\n\
    ```\n\n只需调整训练循环，使其定期保存检查点。\n\n```python\nimport os\nnum_epochs = 50  # Example\
    \ for a long-running job\nrng = random.PRNGKey(0)\nstate = create_train_state(rng,\
    \ learning_rate=0.001)\n# Restore from the latest checkpoint if available\nstate\
    \ = checkpoints.restore_checkpoint(ckpt_dir, target=state)\n# Determine the starting\
    \ epoch\nstart_epoch = int(state.step / len(train_ds))\nfor epoch in range(start_epoch,\
    \ num_epochs):\n    for batch in train_ds:\n        state = train_step(state,\
    \ batch)\n    # Update the training step (epoch)\n    state = state.replace(step=state.step\
    \ + len(train_ds))\n    # Save a checkpoint every 'checkpoint_frequency' epochs\n\
    \    if (epoch + 1) % checkpoint_frequency == 0:\n        checkpoints.save_checkpoint(ckpt_dir,\
    \ target=state, step=state.step, overwrite=True)\n        print(f'Checkpoint saved\
    \ at step {state.step}')\n    # Optionally, evaluate on the test set\n    # ...\
    \ (evaluation code)\n    print(f'Epoch {epoch + 1} completed.')\n```\n\n为了快速总结上述脚本，`checkpoints.save_checkpoint`\
    \ 函数会保存整个训练状态，包括模型参数和优化器状态。而且，我们设置 `overwrite=True` 以确保只保留最新的检查点，从而节省磁盘空间。\n\n\
    ## 处理意外中断\n\n在发生中断的情况下，你可以从最近保存的检查点恢复训练。\n\n```python\n# Before starting the training\
    \ loop\nstate = checkpoints.restore_checkpoint(ckpt_dir, target=state)\n# The\
    \ rest of the training loop remains the same\n```\n\n## 自定义检查点策略\n\n你可以根据需要自定义检查点策略。你可以保留最近的\
    \ N 个检查点，并在模型达到最佳验证准确率时保存模型。\n\n```python\n# In the evaluation section\nif test_metrics['accuracy']\
    \ > best_accuracy:\n    best_accuracy = test_metrics['accuracy']\n    checkpoints.save_checkpoint(ckpt_dir,\
    \ target=state, step=state.step, prefix='best_', overwrite=True)\n    print('Best\
    \ model checkpoint saved.')\n```\n\n完成后，以异步方式保存检查点，以免减慢整个训练速度。\n\n## 测试检查点恢复\n\
    \n现在，在依赖检查点进行长时间运行任务之前，请测试你是否能正确保存和恢复训练状态。\n\n```python\n# Simulate interruption\n\
    checkpoints.save_checkpoint(ckpt_dir, target=state, step=state.step, overwrite=True)\n\
    print('Simulating interruption...')\n# Reset state\nstate = create_train_state(rng,\
    \ learning_rate=0.001)\n# Restore state\nstate = checkpoints.restore_checkpoint(ckpt_dir,\
    \ target=state)\nprint('State restored. Resuming training...')\n```\n\n如果你使用 `Flax`\
    \ 的工具来设置检查点，就可以在训练中断时确保不会丢失任何进度。如果定期保存模型状态，你可以使用最近的检查点继续上次中断的地方，这有助于避免浪费计算资源。对于长时间运行的训练任务来说这是必不可少的，尤其是在使用可抢占云实例或在中断较为常见的环境中工作时。\n"
