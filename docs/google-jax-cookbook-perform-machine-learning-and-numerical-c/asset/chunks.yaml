    \ pred_label in zip(labels, predicted_class):\n            confusion_matrix =\
    \ confusion_matrix.at[true_label, pred_label].add(1)\n    return confusion_matrix\n\
    ```\n\n混淆矩阵将有助于识别模型错误中的模式，表明模型将哪些类别混淆在一起。\n\n## 可视化训练进度\n\n为了了解模型随时间的改进情况，请绘制每个\
    \ epoch 的训练和验证损失及准确率。我们将使用 `Matplotlib` 进行可视化。\n\n```python\nimport matplotlib.pyplot\
    \ as plt\n\ndef plot_learning_curves(training_losses, validation_accuracies):\n\
    \    \"\"\"Plot the learning curves for loss and accuracy.\"\"\"\n    epochs =\
    \ range(1, len(training_losses) + 1)\n    # Plot training loss\n    plt.figure(figsize=(12,\
