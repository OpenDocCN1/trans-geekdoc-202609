    the line\_profiler module can be employed. First, decorate the function to be
    profiled with      \# Add this decorator to the function you want to profile   
    @profile    def forward\_pass(params, x):       # Function code       pass   
      Run the above script using the kernprof command as shown below:      kernprof
    \-l \-v your\_script.py      This above command generates a line-by-line profile
    report, indicating how much time is spent on each line within the function.   
    Profiling JIT-compiled Functions    Profiling JIT-compiled functions requires
    special consideration because JIT compilation itself takes time, and the first
