  fmt: "\n# Filtering Pytrees for Specific Parameters\n\nSometimes, you may need to\
    \ apply updates or transformations only to specific parameters within a `Pytree`,\
    \ such as applying different learning rates to different layers, freezing certain\
    \ layers during training, or modifying only `weights` and not `biases`. The challenge\
    \ is to implement techniques that can traverse the `Pytree` and selectively modify\
    \ or extract elements based on certain criteria, without affecting the rest of\
    \ the structure.\n\n## Selective Modification\n\nTo selectively modify elements\
    \ within a `Pytree`, you can use JAX's tree traversal utilities, such as `jax.tree_map`\
    \ and combined with filtering functions that identify the parameters of interest.\
    \ By defining custom functions that can recognize and operate only on specific\
    \ parts of the `Pytree`, you can apply updates selectively.\n\n## Example Model\
    \ Parameters\n\nLet us consider a `Pytree` representing model parameters organized\
    \ as nested dictionaries:\n\n```\nimport jax\nimport jax.numpy as jnp\n# Example\
    \ model parameters\nparams = {\n    'layer1': {\n        'weights': jnp.array([[0.1,\
    \ 0.2], [0.3, 0.4]]),\n        'biases': jnp.array([0.1, 0.2]),\n    },\n    'layer2':\
    \ {\n        'weights': jnp.array([[0.5, 0.6], [0.7, 0.8]]),\n        'biases':\
    \ jnp.array([0.3, 0.4]),\n    },\n    'layer3': {\n        'weights': jnp.array([[0.9,\
    \ 1.0], [1.1, 1.2]]),\n        'biases': jnp.array([0.5, 0.6]),\n    },\n}\n```\n\
    \nIn this example, `params` is a `Pytree` with three layers, each containing `weights`\
    \ and\n\n## Defining Filter Function\n\nNow create a function that determines\
    \ whether a parameter should be updated based on a condition. For instance, suppose\
    \ you want to update only the `weights` and not the\n\n```\ndef is_weight(param_name):\n\
    \    return 'weights' in param_name\n```\n\n## Traversing Pytree with `jax.tree_map`\
    \ and Filtering\n\nSince `jax.tree_map` doesn't provide access to the parameter\
    \ names directly, we need to use custom traversal functions that include the paths.\n\
    \n```\ndef tree_map_with_path(f, tree):\n    def helper(path, subtree):\n    \
    \    if isinstance(subtree, dict):\n            return {k: helper(path + (k,),\
    \ v) for k, v in subtree.items()}\n        else:\n            return f(path, subtree)\n\
    \    return helper((), tree)\n```\n\n## Applying Updates Selectively Based on\
    \ Parameter Names\n\nCreate an update function that uses the path to decide whether\
    \ to update a parameter.\n\n```\nlearning_rate = 0.01\ndef update_param(path,\
    \ param):\n    # path is a tuple of keys leading to the param\n    if 'weights'\
    \ in path:\n        # Apply the update to weights\n        grad = compute_gradient_for_param(param)\
    \  # Placeholder for gradient computation\n        return param - learning_rate\
    \ * grad\n    else:\n        # Do not update biases; return the original param\n\
    \        return param\n```\n\nDo not forget to replace `compute_gradient_for_param(param)`\
    \ with the actual gradient for that parameter.\n\nNext, use the custom traversal\
    \ function to apply updates.\n\n```\nupdated_params = tree_map_with_path(update_param,\
    \ params)\n```\n\n## Integrating with Gradient Computation\n\nAssuming you have\
    \ computed gradients in the same structure as you can modify the `update_param`\
    \ function to include gradients.\n\n```\ndef update_param_with_grad(path, param,\
    \ grad):\n    if 'weights' in path:\n        return param - learning_rate * grad\n\
    \    else:\n        return param\n```\n\nNow, create a function to traverse both\
    \ `params` and `grads` together.\n\n```\ndef tree_map_with_path_and_grad(f, tree,\
    \ grads):\n    def helper(path, subtree, grad_subtree):\n        if isinstance(subtree,\
    \ dict):\n            return {k: helper(path + (k,), v, grad_subtree[k]) for k,\
    \ v in subtree.items()}\n        else:\n            return f(path, subtree, grad_subtree)\n\
    \    return helper((), tree, grads)\n```\n\nThen, apply the function:\n\n```\n\
    updated_params = tree_map_with_path_and_grad(update_param_with_grad, params, grads)\n\
    ```\n\nNext, check that only the `weights` have been updated.\n\n```\n# Access\
    \ updated weights and biases\nprint(\"Updated layer1 weights:\", updated_params['layer1']['weights'])\n\
    print(\"Original layer1 biases:\", updated_params['layer1']['biases'])  # Should\
    \ be unchanged\n```\n\n## Generalizing Filter Function\n\nSuppose you want to\
    \ freeze the parameters of certain layers, e.g., freeze `layer1` and update only\
    \ `layer2` and\n\nFor this, modify the `update_param_with_grad` function:\n\n\
    ```\ndef update_param_with_grad(path, param, grad):\n    if 'layer1' in path:\n\
    \        # Do not update parameters in layer1\n        return param\n    else:\n\
    \        # Update other layers\n        return param - learning_rate * grad\n\
    ```\n\nThen, apply the update.\n\n```\nupdated_params = tree_map_with_path_and_grad(update_param_with_grad,\
    \ params, grads)\n```\n\n## Using Regular Expressions for Complex Filters\n\n\
    For more complex filtering, you can use regular expressions to match parameter\
    \ names.\n\n```\nimport re\ndef update_param_with_regex(path, param, grad, pattern):\n\
    \    param_name = '/'.join(path)\n    if re.match(pattern, param_name):\n    \
    \    # Update parameters matching the pattern\n        return param - learning_rate\
    \ * grad\n    else:\n        # Do not update other parameters\n        return\
    \ param\npattern = r'^layer[23]/weights$'  # Example pattern\nupdated_params =\
    \ tree_map_with_path_and_grad(\n    lambda path, param, grad: update_param_with_regex(path,\
    \ param, grad, pattern),\n    params,\n    grads\n)\n```\n\nNow, suppose you want\
    \ to apply different learning rates to different layers.\n\n```\ndef update_param_with_variable_lr(path,\
    \ param, grad):\n    if 'layer1' in path:\n        lr = 0.01\n    elif 'layer2'\
    \ in path:\n        lr = 0.001\n    else:\n        lr = 0.0001\n    return param\
    \ - lr * grad\nupdated_params = tree_map_with_path_and_grad(update_param_with_variable_lr,\
    \ params, grads)\n```\n\n## Using `optax` for Parameter Masks\n\nAlternatively,\
    \ you can use the `optax` library to define parameter masks and apply optimizers\
    \ selectively.\n\n```\nimport optax\n# Define parameter masks\ndef mask_fn(params):\n\
    \    masks = {}\n    def create_mask(path, param):\n        if 'weights' in path:\n\
    \            return True  # Update weights\n        else:\n            return\
    \ False  # Do not update biases\n    masks = tree_map_with_path(create_mask, params)\n\
    \    return masks\n# Create an optimizer with masks\noptimizer = optax.chain(\n\
    \    optax.masked(optax.sgd(learning_rate=0.01), mask_fn(params))\n)\n# Initialize\
    \ optimizer state\nopt_state = optimizer.init(params)\n# Compute updates\nupdates,\
    \ opt_state = optimizer.update(grads, opt_state, params)\n# Apply updates\nupdated_params\
    \ = optax.apply_updates(params, updates)\n```\n\n## Combining Multiple Masks\n\
    \nYou can now create complex masks by combining multiple conditions.\n\n```\n\
    def mask_fn(params):\n    def create_mask(path, param):\n        if 'layer1' in\
    \ path and 'weights' in path:\n            return True  # Update weights in layer1\n\
    \        elif 'layer2' in path:\n            return False  # Freeze layer2\n \
    \       else:\n            return True  # Update other parameters\n    return\
    \ tree_map_with_path(create_mask, params)\n# Use the mask in the optimizer\noptimizer\
    \ = optax.chain(\n    optax.masked(optax.sgd(learning_rate=0.01), mask_fn(params))\n\
    )\n```\n\nNext, integrate selective parameter updates into your training loop.\n\
    \n```\n# Training loop\nfor epoch in range(num_epochs):\n    # Compute gradients\n\
    \    grads = compute_gradients(params, data)\n    # Update parameters selectively\n\
    \    updates, opt_state = optimizer.update(grads, opt_state, params)\n    params\
    \ = optax.apply_updates(params, updates)\n    # ... rest of training loop ...\n\
    ```\n\nThese methods afford flexibility in training models, regardless of whether\
    \ freezing certain layers, applying different learning rates or updating only\
    \ `weights` and not `biases` is required. The utilisation of custom traversal\
    \ functions, parameter masks, and `optax` enables the efficient management of\
    \ complex parameter structures, thereby facilitating more controlled and effective\
    \ training processes.\n"
