- raw: '  Resolving Issues with NaNs in Computations    When training a neural network
    on the Fashion-MNIST dataset using Google JAX, you may encounter situations where
    the model outputs NaN values during computations. These can propagate through
    the network, causing the training process to fail or produce invalid results.
    Numerical instability often leads to such issues, stemming from operations like
    division by zero, taking logarithms of zero, or exponential functions causing
    overflow. The challenge is to identify the sources of these and implement strategies
    to prevent them, ensuring stable and successful training.    To resolve issues
    with in computations, it''s essential to pinpoint where they originate and address
    the underlying numerical instability. Some of the strategies that can be put intp
    use are:    Identifying and handling unstable Modify functions prone to numerical
    issues, like softmax or logarithms.  Applying regularization Prevent weights from
    growing too large by using L2 regularization or dropout.  Implementing gradient
    Limit the magnitude of gradients to prevent extreme updates.  Adjusting the learning
    Lower it if it''s causing divergence.  Proper weight Use methods like Xavier initialization
    to start with reasonable weight values.  Monitoring activations and Inspect values
    during training to detect anomalies early.    Following is a step-by-step practical
    walkthrough to identify and resolve in your model.    Identifying Source of NaNs   
    First, determine where in the computation the are introduced. Modify your code
    to print intermediate values or use debugging tools.      for epoch in range(num\_epochs):   
        for x\_batch, y\_batch in data\_generator(train\_images, train\_labels, batch\_size):   
           x\_batch \= jnp.array(x\_batch)           y\_batch \= jnp.array(y\_batch)   
           params \= update(params, x\_batch, y\_batch)        \# Compute loss on
    training data       loss\_value \= compute\_loss(params, x\_batch, y\_batch)   
       print(f"Epoch {epoch}, Loss: {loss\_value}")      If loss\_value becomes it''s
    an indication that have been introduced during the computation.    Checking for
    NaNs in Activations and Gradients    Use jax.debug.print to inspect intermediate
    values within functions.      from jax import debug    def forward\_pass(params,
    x):        W1, b1, W2, b2 \= params        z1 \= jnp.dot(x, W1) \+ b1       a1
    \= jax.nn.relu(z1)       debug.print("Max of a1: {}", jnp.max(a1))        z2 \=
    jnp.dot(a1, W2) \+ b2       y\_pred \= jax.nn.softmax(z2)       debug.print("Max
    of y\_pred: {}", jnp.max(y\_pred))       return y\_pred      This helps identify
    if activations or outputs contain    Handling Numerical Instability in Softmax
    Function    The softmax function can produce if exponentials overflow. Here, you
    can use a stable softmax implementation.      def stable\_softmax(z):       z\_max
    \= jnp.max(z, axis=1, keepdims=True)       exp\_z \= jnp.exp(z \- z\_max)     
     sum\_exp\_z \= jnp.sum(exp\_z, axis=1, keepdims=True)       return exp\_z / sum\_exp\_z   
    \# Replace in forward\_pass    y\_pred \= stable\_softmax(z2)      Applying Gradient
    Clipping    Let us now limit the gradients'' magnitude to prevent large updates
    that can cause instability.      from jax import tree\_util    def clip\_grads(grads,
    max\_norm):        total\_norm \= jnp.sqrt(sum(\[jnp.sum(jnp.square(g)) for g
    in tree\_util.tree\_leaves(grads)\]))        clip\_coef \= jnp.minimum(1.0, max\_norm
    / (total\_norm \+ 1e-6))        return tree\_util.tree\_map(lambda g: g \* clip\_coef,
    grads)    def update(params, x, y, learning\_rate=0.01):       grads \= grad\_loss(params,
    x, y)       grads \= clip\_grads(grads, max\_norm=5.0)        params \= \[p \-
    learning\_rate \* g for p, g in zip(params, grads)\]       return params     
    Adding Regularization    The regularization process serves to prevent the weights
    from becoming excessively large, thereby reducing the likelihood of encountering
    numerical issues.      def compute\_loss(params, x, y, lambda\_reg=0.001):   
       y\_pred \= forward\_pass(params, x)       epsilon \= 1e-7        y\_pred \=
    jnp.clip(y\_pred, epsilon, 1.0 \- epsilon)       log\_probs \= \-jnp.log(y\_pred\[jnp.arange(y.shape\[0\]),
    y\])       loss \= jnp.mean(log\_probs)       # L2 regularization        l2\_loss
    \= sum(\[jnp.sum(jnp.square(p)) for p in params\])        total\_loss \= loss
    \+ lambda\_reg \* l2\_loss       return total\_loss      In the above, a high
    learning rate can cause divergence. We can simply reduce it to stabilize training
    as below:      learning\_rate \= 0.001  \# Reduced from 0.01      Proper Weight
    Initialization    We can also use methods like Xavier (Glorot) initialization
    to start with appropriate weight scales.      def glorot\_init(key, shape):   
       fan\_in, fan\_out \= shape\[0\], shape\[1\]        limit \= jnp.sqrt(6 / (fan\_in
    \+ fan\_out))       return random.uniform(key, shape, minval=-limit, maxval=limit)   
    \# Initialize weights    key \= random.PRNGKey(0)    W1 \= glorot\_init(key, (input\_size,
    hidden\_size))    b1 \= jnp.zeros((hidden\_size,))    W2 \= glorot\_init(key,
    (hidden\_size, output\_size))    b2 \= jnp.zeros((output\_size,))      Using Alternative
    Activation Functions    There are possibilities where we can consider using activations
    less prone to causing like Leaky ReLU as shown below:      def leaky\_relu(x,
    alpha=0.01):        return jnp.where(x \> 0, x, alpha \* x)    \# Use in forward\_pass   
    a1 \= leaky\_relu(z1)      We can then normalize the input data to prevent large
    activations.      mean \= jnp.mean(train\_images, axis=0)    std \= jnp.std(train\_images,
    axis=0) \+ 1e-7  \# Prevent division by zero    def normalize(x):        return
    (x \- mean) / std    \# Normalize training data    train\_images \= normalize(train\_images)   
      Implementing Batch Normalization    Batch normalization stabilizes activations
    across layers.      def batch\_norm(x, gamma, beta, eps=1e-5):       mean \= jnp.mean(x,
    axis=0, keepdims=True)       variance \= jnp.var(x, axis=0, keepdims=True)   
        x\_norm \= (x \- mean) / jnp.sqrt(variance \+ eps)        return gamma \*
    x\_norm \+ beta    \# Initialize gamma and beta    gamma1 \= jnp.ones((hidden\_size,))   
    beta1 \= jnp.zeros((hidden\_size,))    \# Include in params    params \= \[W1,
    b1, gamma1, beta1, W2, b2\]    def forward\_pass(params, x):        W1, b1, gamma1,
    beta1, W2, b2 \= params        z1 \= jnp.dot(x, W1) \+ b1       z1\_bn \= batch\_norm(z1,
    gamma1, beta1)       a1 \= jax.nn.relu(z1\_bn)        z2 \= jnp.dot(a1, W2) \+
    b2       y\_pred \= stable\_softmax(z2)       return y\_pred      Do not forget
    to use consistent data types to prevent precision-related      x\_batch \= x\_batch.astype(jnp.float32)   
    params \= \[p.astype(jnp.float32) for p in params\]      By identifying sources
    of numerical instability and applying techniques like regularization, gradient
    clipping, proper initialization, and stable function implementations, you can
    resolve NaN issues in your computations.    '
  fmt: "\n# Resolving Issues with NaNs in Computations\n\nWhen training a neural network\
    \ on the `Fashion-MNIST` dataset using Google `JAX`, you may encounter situations\
    \ where the model outputs `NaN` values during computations. These can propagate\
    \ through the network, causing the training process to fail or produce invalid\
    \ results. Numerical instability often leads to such issues, stemming from operations\
    \ like division by zero, taking logarithms of zero, or exponential functions causing\
    \ overflow. The challenge is to identify the sources of these and implement strategies\
    \ to prevent them, ensuring stable and successful training.\n\nTo resolve issues\
    \ with in computations, it's essential to pinpoint where they originate and address\
    \ the underlying numerical instability. Some of the strategies that can be put\
    \ intp use are:\n\nIdentifying and handling unstable Modify functions prone to\
    \ numerical issues, like `softmax` or `logarithms`.\nApplying regularization Prevent\
    \ weights from growing too large by using `L2` regularization or `dropout`.\n\
    Implementing gradient Limit the magnitude of gradients to prevent extreme updates.\n\
    Adjusting the learning Lower it if it's causing divergence.\nProper weight Use\
    \ methods like Xavier initialization to start with reasonable weight values.\n\
    Monitoring activations and Inspect values during training to detect anomalies\
    \ early.\n\n## Step-by-Step Practical Walkthrough\n\n### Identifying Source of\
    \ NaNs\n\nFirst, determine where in the computation the `NaN`s are introduced.\
    \ Modify your code to print intermediate values or use debugging tools.\n\n```python\n\
    for epoch in range(num_epochs):\n    for x_batch, y_batch in data_generator(train_images,\
    \ train_labels, batch_size):\n        x_batch = jnp.array(x_batch)\n        y_batch\
    \ = jnp.array(y_batch)\n        params = update(params, x_batch, y_batch)\n  \
    \  # Compute loss on training data\n    loss_value = compute_loss(params, x_batch,\
    \ y_batch)\n    print(f\"Epoch {epoch}, Loss: {loss_value}\")\n```\nIf `loss_value`\
    \ becomes `NaN`, it's an indication that `NaN`s have been introduced during the\
    \ computation.\n\n### Checking for NaNs in Activations and Gradients\n\nUse `jax.debug.print`\
    \ to inspect intermediate values within functions.\n\n```python\nfrom jax import\
    \ debug\ndef forward_pass(params, x):\n    W1, b1, W2, b2 = params\n    z1 = jnp.dot(x,\
    \ W1) + b1\n    a1 = jax.nn.relu(z1)\n    debug.print(\"Max of a1: {}\", jnp.max(a1))\n\
    \    z2 = jnp.dot(a1, W2) + b2\n    y_pred = jax.nn.softmax(z2)\n    debug.print(\"\
    Max of y_pred: {}\", jnp.max(y_pred))\n    return y_pred\n```\nThis helps identify\
    \ if activations or outputs contain `NaN`s.\n\n### Handling Numerical Instability\
    \ in Softmax Function\n\nThe `softmax` function can produce `NaN`s if exponentials\
    \ overflow. Here, you can use a stable softmax implementation.\n\n```python\n\
    def stable_softmax(z):\n    z_max = jnp.max(z, axis=1, keepdims=True)\n    exp_z\
    \ = jnp.exp(z - z_max)\n    sum_exp_z = jnp.sum(exp_z, axis=1, keepdims=True)\n\
    \    return exp_z / sum_exp_z\n# Replace in forward_pass\ny_pred = stable_softmax(z2)\n\
    ```\n\n### Applying Gradient Clipping\n\nLet us now limit the gradients' magnitude\
    \ to prevent large updates that can cause instability.\n\n```python\nfrom jax\
    \ import tree_util\ndef clip_grads(grads, max_norm):\n    total_norm = jnp.sqrt(sum([jnp.sum(jnp.square(g))\
    \ for g in tree_util.tree_leaves(grads)]))\n    clip_coef = jnp.minimum(1.0, max_norm\
    \ / (total_norm + 1e-6))\n    return tree_util.tree_map(lambda g: g * clip_coef,\
    \ grads)\n\ndef update(params, x, y, learning_rate=0.01):\n    grads = grad_loss(params,\
    \ x, y)\n    grads = clip_grads(grads, max_norm=5.0)\n    params = [p - learning_rate\
    \ * g for p, g in zip(params, grads)]\n    return params\n```\n\n### Adding Regularization\n\
    \nThe regularization process serves to prevent the weights from becoming excessively\
    \ large, thereby reducing the likelihood of encountering numerical issues.\n\n\
    ```python\ndef compute_loss(params, x, y, lambda_reg=0.001):\n    y_pred = forward_pass(params,\
    \ x)\n    epsilon = 1e-7\n    y_pred = jnp.clip(y_pred, epsilon, 1.0 - epsilon)\n\
    \    log_probs = -jnp.log(y_pred[jnp.arange(y.shape[0]), y])\n    loss = jnp.mean(log_probs)\n\
    \    # L2 regularization\n    l2_loss = sum([jnp.sum(jnp.square(p)) for p in params])\n\
    \    total_loss = loss + lambda_reg * l2_loss\n    return total_loss\n```\n\n\
    In the above, a high learning rate can cause divergence. We can simply reduce\
    \ it to stabilize training as below:\n\n`learning_rate = 0.001`  # Reduced from\
    \ 0.01\n\n### Proper Weight Initialization\n\nWe can also use methods like Xavier\
    \ (Glorot) initialization to start with appropriate weight scales.\n\n```python\n\
    def glorot_init(key, shape):\n    fan_in, fan_out = shape[0], shape[1]\n    limit\
    \ = jnp.sqrt(6 / (fan_in + fan_out))\n    return random.uniform(key, shape, minval=-limit,\
    \ maxval=limit)\n\n# Initialize weights\nkey = random.PRNGKey(0)\nW1 = glorot_init(key,\
    \ (input_size, hidden_size))\nb1 = jnp.zeros((hidden_size,))\nW2 = glorot_init(key,\
    \ (hidden_size, output_size))\nb2 = jnp.zeros((output_size,))\n```\n\n### Using\
    \ Alternative Activation Functions\n\nThere are possibilities where we can consider\
    \ using activations less prone to causing `NaN`s like Leaky ReLU as shown below:\n\
    \n```python\ndef leaky_relu(x, alpha=0.01):\n    return jnp.where(x > 0, x, alpha\
    \ * x)\n# Use in forward_pass\na1 = leaky_relu(z1)\n```\n\nWe can then normalize\
    \ the input data to prevent large activations.\n\n```python\nmean = jnp.mean(train_images,\
    \ axis=0)\nstd = jnp.std(train_images, axis=0) + 1e-7  # Prevent division by zero\n\
    def normalize(x):\n    return (x - mean) / std\n# Normalize training data\ntrain_images\
    \ = normalize(train_images)\n```\n\n### Implementing Batch Normalization\n\nBatch\
    \ normalization stabilizes activations across layers.\n\n```python\ndef batch_norm(x,\
    \ gamma, beta, eps=1e-5):\n    mean = jnp.mean(x, axis=0, keepdims=True)\n   \
    \ variance = jnp.var(x, axis=0, keepdims=True)\n    x_norm = (x - mean) / jnp.sqrt(variance\
    \ + eps)\n    return gamma * x_norm + beta\n\n# Initialize gamma and beta\ngamma1\
    \ = jnp.ones((hidden_size,))\nbeta1 = jnp.zeros((hidden_size,))\n# Include in\
    \ params\nparams = [W1, b1, gamma1, beta1, W2, b2]\n\ndef forward_pass(params,\
    \ x):\n    W1, b1, gamma1, beta1, W2, b2 = params\n    z1 = jnp.dot(x, W1) + b1\n\
    \    z1_bn = batch_norm(z1, gamma1, beta1)\n    a1 = jax.nn.relu(z1_bn)\n    z2\
    \ = jnp.dot(a1, W2) + b2\n    y_pred = stable_softmax(z2)\n    return y_pred\n\
    ```\n\nDo not forget to use consistent data types to prevent precision-related\
    \ issues:\n\n```python\nx_batch = x_batch.astype(jnp.float32)\nparams = [p.astype(jnp.float32)\
    \ for p in params]\n```\n\nBy identifying sources of numerical instability and\
    \ applying techniques like regularization, gradient clipping, proper initialization,\
    \ and stable function implementations, you can resolve `NaN` issues in your computations.\n"
  trans: "\n# 在计算中解决 NaN 问题\n\n当在 `Fashion-MNIST` 数据集上使用 Google `JAX` 训练神经网络时，您可能会遇到模型在计算过程中输出\
    \ `NaN` 值的情况。这些值会通过网络传播，导致训练过程失败或产生无效结果。数值不稳定性通常会导致此类问题，源于除以零、取零的对数或指数函数导致溢出等操作。挑战在于识别这些问题的来源并实施策略加以防止，确保训练稳定且成功。\n\
    \n要解决计算中 NaN 的问题，识别其来源并解决潜在的数值不稳定性至关重要。可以采用的一些策略有：\n\n识别并处理不稳定 修改容易出现数值问题的函数，如\
    \ `softmax` 或 `logarithms`。\n应用正则化 通过使用 `L2` 正则化或 `dropout` 防止权重增长过大。\n实现梯度裁剪\
    \ 限制梯度的幅度以防止极端更新。\n调整学习率 如果它导致发散则降低它。\n适当的权重初始化 使用方法如 Xavier 初始化以合理的权重值开始。\n监控激活值和梯度\
    \ 在训练期间检查值以尽早检测异常。\n\n## 逐步实践指南\n\n### 识别 NaN 的来源\n\n首先，确定 `NaN` 在计算的哪个位置被引入。修改代码以打印中间值或使用调试工具。\n\
    \n```python\nfor epoch in range(num_epochs):\n    for x_batch, y_batch in data_generator(train_images,\
    \ train_labels, batch_size):\n        x_batch = jnp.array(x_batch)\n        y_batch\
    \ = jnp.array(y_batch)\n        params = update(params, x_batch, y_batch)\n  \
    \  # Compute loss on training data\n    loss_value = compute_loss(params, x_batch,\
    \ y_batch)\n    print(f\"Epoch {epoch}, Loss: {loss_value}\")\n```\n如果 `loss_value`\
    \ 变为 `NaN`，则表明在计算过程中引入了 `NaN`。\n\n### 检查激活值和梯度中的 NaN\n\n使用 `jax.debug.print` 检查函数内的中间值。\n\
    \n```python\nfrom jax import debug\ndef forward_pass(params, x):\n    W1, b1,\
    \ W2, b2 = params\n    z1 = jnp.dot(x, W1) + b1\n    a1 = jax.nn.relu(z1)\n  \
    \  debug.print(\"Max of a1: {}\", jnp.max(a1))\n    z2 = jnp.dot(a1, W2) + b2\n\
    \    y_pred = jax.nn.softmax(z2)\n    debug.print(\"Max of y_pred: {}\", jnp.max(y_pred))\n\
    \    return y_pred\n```\n这有助于确定激活值或输出是否包含 `NaN`。\n\n### 处理 Softmax 函数中的数值不稳定性\n\
    \n如果指数溢出，`softmax` 函数可能会产生 `NaN`。这里可以使用稳定的 softmax 实现。\n\n```python\ndef stable_softmax(z):\n\
    \    z_max = jnp.max(z, axis=1, keepdims=True)\n    exp_z = jnp.exp(z - z_max)\n\
    \    sum_exp_z = jnp.sum(exp_z, axis=1, keepdims=True)\n    return exp_z / sum_exp_z\n\
    # Replace in forward_pass\ny_pred = stable_softmax(z2)\n```\n\n### 应用梯度裁剪\n\n\
    现在让我们限制梯度的幅度以防止可能导致不稳定的大更新。\n\n```python\nfrom jax import tree_util\ndef clip_grads(grads,\
    \ max_norm):\n    total_norm = jnp.sqrt(sum([jnp.sum(jnp.square(g)) for g in tree_util.tree_leaves(grads)]))\n\
    \    clip_coef = jnp.minimum(1.0, max_norm / (total_norm + 1e-6))\n    return\
    \ tree_util.tree_map(lambda g: g * clip_coef, grads)\n\ndef update(params, x,\
    \ y, learning_rate=0.01):\n    grads = grad_loss(params, x, y)\n    grads = clip_grads(grads,\
    \ max_norm=5.0)\n    params = [p - learning_rate * g for p, g in zip(params, grads)]\n\
    \    return params\n```\n\n### 添加正则化\n\n正则化过程有助于防止权重变得过大，从而降低遇到数值问题的可能性。\n\n```python\n\
    def compute_loss(params, x, y, lambda_reg=0.001):\n    y_pred = forward_pass(params,\
    \ x)\n    epsilon = 1e-7\n    y_pred = jnp.clip(y_pred, epsilon, 1.0 - epsilon)\n\
    \    log_probs = -jnp.log(y_pred[jnp.arange(y.shape[0]), y])\n    loss = jnp.mean(log_probs)\n\
    \    # L2 regularization\n    l2_loss = sum([jnp.sum(jnp.square(p)) for p in params])\n\
    \    total_loss = loss + lambda_reg * l2_loss\n    return total_loss\n```\n\n\
    在上述情况下，高学习率可能导致发散。我们可以简单地降低它以稳定训练如下：\n\n`learning_rate = 0.001`  # 从 0.01 降低\n\
    \n### 适当的权重初始化\n\n我们还可以使用 Xavier (Glorot) 初始化等方法以适当的权重尺度开始。\n\n```python\ndef\
    \ glorot_init(key, shape):\n    fan_in, fan_out = shape[0], shape[1]\n    limit\
    \ = jnp.sqrt(6 / (fan_in + fan_out))\n    return random.uniform(key, shape, minval=-limit,\
    \ maxval=limit)\n\n# Initialize weights\nkey = random.PRNGKey(0)\nW1 = glorot_init(key,\
    \ (input_size, hidden_size))\nb1 = jnp.zeros((hidden_size,))\nW2 = glorot_init(key,\
    \ (hidden_size, output_size))\nb2 = jnp.zeros((output_size,))\n```\n\n### 使用替代激活函数\n\
    \n我们可以考虑使用不易导致 `NaN` 的激活函数，如下所示的 Leaky ReLU：\n\n```python\ndef leaky_relu(x, alpha=0.01):\n\
    \    return jnp.where(x > 0, x, alpha * x)\n# Use in forward_pass\na1 = leaky_relu(z1)\n\
    ```\n\n然后我们可以归一化输入数据以防止激活值过大。\n\n```python\nmean = jnp.mean(train_images, axis=0)\n\
    std = jnp.std(train_images, axis=0) + 1e-7  # Prevent division by zero\ndef normalize(x):\n\
    \    return (x - mean) / std\n# Normalize training data\ntrain_images = normalize(train_images)\n\
    ```\n\n### 实现批量归一化\n\n批量归一化可稳定各层之间的激活值。\n\n```python\ndef batch_norm(x, gamma,\
    \ beta, eps=1e-5):\n    mean = jnp.mean(x, axis=0, keepdims=True)\n    variance\
    \ = jnp.var(x, axis=0, keepdims=True)\n    x_norm = (x - mean) / jnp.sqrt(variance\
    \ + eps)\n    return gamma * x_norm + beta\n\n# Initialize gamma and beta\ngamma1\
    \ = jnp.ones((hidden_size,))\nbeta1 = jnp.zeros((hidden_size,))\n# Include in\
    \ params\nparams = [W1, b1, gamma1, beta1, W2, b2]\n\ndef forward_pass(params,\
    \ x):\n    W1, b1, gamma1, beta1, W2, b2 = params\n    z1 = jnp.dot(x, W1) + b1\n\
    \    z1_bn = batch_norm(z1, gamma1, beta1)\n    a1 = jax.nn.relu(z1_bn)\n    z2\
    \ = jnp.dot(a1, W2) + b2\n    y_pred = stable_softmax(z2)\n    return y_pred\n\
    ```\n\n不要忘记使用一致的数据类型以防止精度相关问题：\n\n```python\nx_batch = x_batch.astype(jnp.float32)\n\
    params = [p.astype(jnp.float32) for p in params]\n```\n\n通过识别数值不稳定性的来源并应用诸如正则化、梯度裁剪、适当初始化和稳定函数实现等技术，您可以解决计算中的\
    \ `NaN` 问题。\n"
