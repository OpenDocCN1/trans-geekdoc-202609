    \ = [ag + g for ag, g in zip(accumulated_grads, grads)]\n    step += 1\n    if\
    \ step % accumulation_steps == 0:\n        # Update parameters with accumulated\
    \ gradients\n        params = [param - (learning_rate / accumulation_steps) *\
    \ ag for param, ag in zip(params, accumulated_grads)]\n        accumulated_grads\
