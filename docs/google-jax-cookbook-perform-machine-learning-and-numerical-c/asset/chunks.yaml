- raw: '  Performance Optimization with Custom CUDA Kernels    When it comes to high-performance
    computing tasks using GPUs, the standard operations provided by JAX might not
    be as efficient as you need for specific computations. You might need to create
    your own algorithms or tweak certain operations to get better results than what
    JAX''s library offers. Writing your own CUDA kernels lets you tweak computations
    to get the best performance on GPUs. The tricky part is figuring out how to integrate
    these custom kernels with JAX. We need to make sure they work together seamlessly
    with JAX''s JIT compilation and automatic differentiation.    JAX lets you integrate
    custom CUDA kernels using custom calls in XLA. If you define a custom JAX primitive
    and provide GPU-specific translations, you can write a custom CUDA kernel, compile
    it, and register it with JAX''s backend. This integration lets you use the custom
    kernel in JAX computations, getting the best of both worlds—the performance of
    the custom kernel and JAX''s features.    Write Custom CUDA Kernel    First, you''ll
    want to create a CUDA kernel for the operation you want to optimize. For instance,
    you could implement a custom element-wise multiplication.      // custom\_mul.cu   
    extern "C" \_\_global\_\_ void custom\_mul\_kernel(const float\* x, const float\*
    y, float\* out, int n) {        int idx \= blockIdx.x \* blockDim.x \+ threadIdx.x;   
       if (idx < n) {           out\[idx\] \= x\[idx\] \* y\[idx\];       }    }   
      Compile CUDA Kernel to PTX    Next, you''ll want to compile the CUDA kernel
    to generate PTX code, which you can then load with JAX.      nvcc \--ptx custom\_mul.cu
    \-o custom\_mul.ptx      Load PTX Code in Python    Just read the PTX code into
    Python for registration.      with open(''custom\_mul.ptx'', ''r'') as f:     
     ptx\_code \= f.read()      Define Custom JAX Primitive    We need to create a
    custom primitive for the multiplication operation.      from jax import core   
    from jax.interpreters import xla    custom\_mul\_p \= core.Primitive(''custom\_mul'')   
    def custom\_mul\_abstract(x, y):       return core.ShapedArray(x.shape, x.dtype)   
    custom\_mul\_p.def\_abstract\_eval(custom\_mul\_abstract)      You maay define
    how the primitive behaves when running on the CPU.      def custom\_mul\_impl(x,
    y):       return x \* y    custom\_mul\_p.def\_impl(custom\_mul\_impl)      Register
    Custom Call Target    Next, register the custom CUDA kernel with XLA.      from
    jax.lib import xla\_client    def register\_custom\_call():       xla\_client.register\_custom\_call\_target(   
           b''custom\_mul\_kernel'',           ptx\_code.encode(''utf-8''),       
       platform=''CUDA'',       )    register\_custom\_call()      Define GPU Translation   
    Next, please provide the GPU translation for the custom primitive.      def custom\_mul\_xla\_translation\_gpu(c,
    x, y):       shape \= c.get\_shape(x)       dtype \= shape.element\_type()   
       n \= shape.dimensions()\[0\]       out\_shape \= xla\_client.Shape.array\_shape(dtype,
    \[n\])       n\_const \= xla\_client.ops.Constant(c, np.array(n, dtype=np.int32))   
       return xla\_client.ops.CustomCall(           c,           b''custom\_mul\_kernel'',   
           operands=(x, y, n\_const),           shape=out\_shape       )    xla.backend\_specific\_translations\[''gpu''\]\[custom\_mul\_p\]
    \= custom\_mul\_xla\_translation\_gpu      Define Forward Function and JVP Rule   
    We need to write a function using the custom primitive.      def custom\_mul(x,
    y):       return custom\_mul\_p.bind(x, y)      Just give us the Jacobian-vector
    product rule so we can do the automatic differentiation.      from jax.interpreters
    import ad    def custom\_mul\_jvp(primals, tangents):       x, y \= primals   
       x\_dot, y\_dot \= tangents       primal\_out \= custom\_mul(x, y)        tangent\_out
    \= x\_dot \* y \+ x \* y\_dot       return primal\_out, tangent\_out    ad.defjvp(custom\_mul\_p,
    custom\_mul\_jvp)      Verify GPU Execution    Next, ensure that the computation
    is executed on the GPU.      from jax.lib import xla\_bridge    backend \= xla\_bridge.get\_backend()   
    assert backend.platform \== ''gpu'', "Not running on GPU"    \# Move data to GPU
    explicitly    x\_gpu \= jax.device\_put(x)    y\_gpu \= jax.device\_put(y)   
    result\_gpu \= compute\_custom\_mul(x\_gpu, y\_gpu)    print("Result on GPU:",
    result\_gpu)      Optimize CUDA Kernel    Make your kernel work better for you:   
    It''s important to choose the right block and grid sizes.  If it''s helpful, use
    shared memory.  It''s best to minimize memory accesses and optimize memory patterns.   
    Following is a quick example with kernel launch parameters:      def custom\_mul\_xla\_translation\_gpu(c,
    x, y):       # Previous code...       # Define launch dimensions       launch\_dims
    \= xla\_client.ops.Constant(c, np.array(\[n\], dtype=np.int32))        \# Pass
    launch dimensions in backend\_config       backend\_config \= xla\_client.\_xla\_ops.BuildGpuLaunchConfig(launch\_dims)   
       return xla\_client.ops.CustomCall(           c,           b''custom\_mul\_kernel'',   
           operands=(x, y, n\_const),           shape=out\_shape,           backend\_config=backend\_config   
       )      If you define your own primitives and provide GPU-specific translations,
    you can use the power of custom kernels while getting the benefits of JAX''s automatic
    differentiation and JIT compilation. This approach needs to be done right and
    you need to understand both CUDA programming and JAX''s internal mechanisms, but
    it can lead to big performance gains for specialised operations.    '
  fmt: "\n# Performance Optimization with Custom CUDA Kernels\n\nWhen it comes to\
    \ high-performance computing tasks using GPUs, the standard operations provided\
    \ by `JAX` might not be as efficient as you need for specific computations. You\
    \ might need to create your own algorithms or tweak certain operations to get\
    \ better results than what `JAX`'s library offers. Writing your own `CUDA` kernels\
    \ lets you tweak computations to get the best performance on GPUs. The tricky\
    \ part is figuring out how to integrate these custom kernels with `JAX`. We need\
    \ to make sure they work together seamlessly with `JAX`'s `JIT` compilation and\
    \ automatic differentiation.\n\n## Overview\n\n`JAX` lets you integrate custom\
    \ `CUDA` kernels using custom calls in `XLA`. If you define a custom `JAX` primitive\
    \ and provide GPU-specific translations, you can write a custom `CUDA` kernel,\
    \ compile it, and register it with `JAX`'s backend. This integration lets you\
    \ use the custom kernel in `JAX` computations, getting the best of both worlds—the\
    \ performance of the custom kernel and `JAX`'s features.\n\n## Write Custom CUDA\
    \ Kernel\n\nFirst, you'll want to create a `CUDA` kernel for the operation you\
    \ want to optimize. For instance, you could implement a custom element-wise multiplication.\n\
    \n### CUDA Kernel Implementation\n\n```cuda\n// custom_mul.cu\nextern \"C\" __global__\
    \ void custom_mul_kernel(const float* x, const float* y, float* out, int n) {\n\
    \    int idx = blockIdx.x * blockDim.x + threadIdx.x;\n    if (idx < n) {\n  \
    \      out[idx] = x[idx] * y[idx];\n    }\n}\n```\n\n### Compile CUDA Kernel to\
    \ PTX\n\nNext, you'll want to compile the `CUDA` kernel to generate PTX code,\
    \ which you can then load with `JAX`.\n\n```bash\nnvcc --ptx custom_mul.cu -o\
    \ custom_mul.ptx\n```\n\n### Load PTX Code in Python\n\nJust read the PTX code\
    \ into Python for registration.\n\n```python\nwith open('custom_mul.ptx', 'r')\
    \ as f:\n    ptx_code = f.read()\n```\n\n### Define Custom JAX Primitive\n\nWe\
    \ need to create a custom primitive for the multiplication operation.\n\n```python\n\
    from jax import core\nfrom jax.interpreters import xla\n\ncustom_mul_p = core.Primitive('custom_mul')\n\
    \ndef custom_mul_abstract(x, y):\n    return core.ShapedArray(x.shape, x.dtype)\n\
    \ncustom_mul_p.def_abstract_eval(custom_mul_abstract)\n```\n\nYou may define how\
    \ the primitive behaves when running on the CPU.\n\n```python\ndef custom_mul_impl(x,\
    \ y):\n    return x * y\n\ncustom_mul_p.def_impl(custom_mul_impl)\n```\n\n###\
    \ Register Custom Call Target\n\nNext, register the custom `CUDA` kernel with\
    \ `XLA`.\n\n```python\nfrom jax.lib import xla_client\n\ndef register_custom_call():\n\
    \    xla_client.register_custom_call_target(\n        b'custom_mul_kernel',\n\
    \        ptx_code.encode('utf-8'),\n        platform='CUDA',\n    )\n\nregister_custom_call()\n\
    ```\n\n### Define GPU Translation\n\nNext, please provide the GPU translation\
    \ for the custom primitive.\n\n```python\ndef custom_mul_xla_translation_gpu(c,\
    \ x, y):\n    shape = c.get_shape(x)\n    dtype = shape.element_type()\n    n\
    \ = shape.dimensions()[0]\n    out_shape = xla_client.Shape.array_shape(dtype,\
    \ [n])\n    n_const = xla_client.ops.Constant(c, np.array(n, dtype=np.int32))\n\
    \    return xla_client.ops.CustomCall(\n        c,\n        b'custom_mul_kernel',\n\
    \        operands=(x, y, n_const),\n        shape=out_shape\n    )\n\nxla.backend_specific_translations['gpu'][custom_mul_p]\
    \ = custom_mul_xla_translation_gpu\n```\n\n### Define Forward Function and JVP\
    \ Rule\n\nWe need to write a function using the custom primitive.\n\n```python\n\
    def custom_mul(x, y):\n    return custom_mul_p.bind(x, y)\n```\n\nJust give us\
    \ the Jacobian-vector product rule so we can do the automatic differentiation.\n\
    \n```python\nfrom jax.interpreters import ad\n\ndef custom_mul_jvp(primals, tangents):\n\
    \    x, y = primals\n    x_dot, y_dot = tangents\n    primal_out = custom_mul(x,\
    \ y)\n    tangent_out = x_dot * y + x * y_dot\n    return primal_out, tangent_out\n\
    \nad.defjvp(custom_mul_p, custom_mul_jvp)\n```\n\n### Verify GPU Execution\n\n\
    Next, ensure that the computation is executed on the GPU.\n\n```python\nfrom jax.lib\
    \ import xla_bridge\n\nbackend = xla_bridge.get_backend()\nassert backend.platform\
    \ == 'gpu', \"Not running on GPU\"\n\n# Move data to GPU explicitly\nx_gpu = jax.device_put(x)\n\
    y_gpu = jax.device_put(y)\nresult_gpu = compute_custom_mul(x_gpu, y_gpu)\nprint(\"\
    Result on GPU:\", result_gpu)\n```\n\n### Optimize CUDA Kernel\n\nMake your kernel\
    \ work better for you:\nIt's important to choose the right block and grid sizes.\
    \ If it's helpful, use shared memory. It's best to minimize memory accesses and\
    \ optimize memory patterns.\n\nFollowing is a quick example with kernel launch\
    \ parameters:\n\n```python\ndef custom_mul_xla_translation_gpu(c, x, y):\n   \
    \ # Previous code...\n    # Define launch dimensions\n    launch_dims = xla_client.ops.Constant(c,\
    \ np.array([n], dtype=np.int32))\n    # Pass launch dimensions in backend_config\n\
    \    backend_config = xla_client._xla_ops.BuildGpuLaunchConfig(launch_dims)\n\
    \    return xla_client.ops.CustomCall(\n        c,\n        b'custom_mul_kernel',\n\
    \        operands=(x, y, n_const),\n        shape=out_shape,\n        backend_config=backend_config\n\
    \    )\n```\n\nIf you define your own primitives and provide GPU-specific translations,\
    \ you can use the power of custom kernels while getting the benefits of `JAX`'s\
    \ automatic differentiation and `JIT` compilation. This approach needs to be done\
    \ right and you need to understand both `CUDA` programming and `JAX`'s internal\
    \ mechanisms, but it can lead to big performance gains for specialised operations.\n"
  trans: "\n# 使用自定义 CUDA 内核进行性能优化\n\n在涉及使用 GPU 的高性能计算任务时，`JAX` 提供的标准操作对于特定计算可能没有你需要的效率。你可能需要创建自己的算法或调整某些操作，以获得比\
    \ `JAX` 库更好的结果。编写自己的 `CUDA` 内核可以让你调整计算以获得 GPU 上的最佳性能。棘手的部分是如何将这些自定义内核与 `JAX` 集成。我们需要确保它们能与\
    \ `JAX` 的 `JIT` 编译和自动微分无缝协作。\n\n## 概述\n\n`JAX` 允许你使用 `XLA` 中的自定义调用集成自定义 `CUDA`\
    \ 内核。如果你定义一个自定义 `JAX` 原语并提供 GPU 特定的转换，你可以编写自定义 `CUDA` 内核、编译它并将其注册到 `JAX` 的后端。这种集成让你可以在\
    \ `JAX` 计算中使用自定义内核，兼得两者之长——自定义内核的性能和 `JAX` 的特性。\n\n## 编写自定义 CUDA 内核\n\n首先，你需要为想要优化的操作创建一个\
    \ `CUDA` 内核。例如，你可以实现一个自定义逐元素乘法。\n\n### CUDA 内核实现\n\n```cuda\n// custom_mul.cu\n\
    extern \"C\" __global__ void custom_mul_kernel(const float* x, const float* y,\
    \ float* out, int n) {\n    int idx = blockIdx.x * blockDim.x + threadIdx.x;\n\
    \    if (idx < n) {\n        out[idx] = x[idx] * y[idx];\n    }\n}\n```\n\n###\
    \ 将 CUDA 内核编译为 PTX\n\n接下来，你需要编译 `CUDA` 内核以生成 PTX 代码，然后可以用 `JAX` 加载它。\n\n```bash\n\
    nvcc --ptx custom_mul.cu -o custom_mul.ptx\n```\n\n### 在 Python 中加载 PTX 代码\n\n\
    只需将 PTX 代码读入 Python 以进行注册。\n\n```python\nwith open('custom_mul.ptx', 'r') as f:\n\
    \    ptx_code = f.read()\n```\n\n### 定义自定义 JAX 原语\n\n我们需要为乘法操作创建一个自定义原语。\n\n```python\n\
    from jax import core\nfrom jax.interpreters import xla\n\ncustom_mul_p = core.Primitive('custom_mul')\n\
    \ndef custom_mul_abstract(x, y):\n    return core.ShapedArray(x.shape, x.dtype)\n\
    \ncustom_mul_p.def_abstract_eval(custom_mul_abstract)\n```\n\n你可以定义原语在 CPU 上运行时\
    \ 的行为。\n\n```python\ndef custom_mul_impl(x, y):\n    return x * y\n\ncustom_mul_p.def_impl(custom_mul_impl)\n\
    ```\n\n### 注册自定义调用目标\n\n接下来，将自定义 `CUDA` 内核注册到 `XLA`。\n\n```python\nfrom jax.lib\
    \ import xla_client\n\ndef register_custom_call():\n    xla_client.register_custom_call_target(\n\
    \        b'custom_mul_kernel',\n        ptx_code.encode('utf-8'),\n        platform='CUDA',\n\
    \    )\n\nregister_custom_call()\n```\n\n### 定义 GPU 转换\n\n接下来，请为自定义原语提供 GPU 转换。\n\
    \n```python\ndef custom_mul_xla_translation_gpu(c, x, y):\n    shape = c.get_shape(x)\n\
    \    dtype = shape.element_type()\n    n = shape.dimensions()[0]\n    out_shape\
    \ = xla_client.Shape.array_shape(dtype, [n])\n    n_const = xla_client.ops.Constant(c,\
    \ np.array(n, dtype=np.int32))\n    return xla_client.ops.CustomCall(\n      \
    \  c,\n        b'custom_mul_kernel',\n        operands=(x, y, n_const),\n    \
    \    shape=out_shape\n    )\n\nxla.backend_specific_translations['gpu'][custom_mul_p]\
    \ = custom_mul_xla_translation_gpu\n```\n\n### 定义前向函数和 JVP 规则\n\n我们需要使用自定义原语编写一个函数。\n\
    \n```python\ndef custom_mul(x, y):\n    return custom_mul_p.bind(x, y)\n```\n\n\
    只需提供雅可比-向量积规则以便进行自动微分。\n\n```python\nfrom jax.interpreters import ad\n\ndef custom_mul_jvp(primals,\
    \ tangents):\n    x, y = primals\n    x_dot, y_dot = tangents\n    primal_out\
    \ = custom_mul(x, y)\n    tangent_out = x_dot * y + x * y_dot\n    return primal_out,\
    \ tangent_out\n\nad.defjvp(custom_mul_p, custom_mul_jvp)\n```\n\n### 验证 GPU 执行\n\
    \n接下来，确保计算在 GPU 上执行。\n\n```python\nfrom jax.lib import xla_bridge\n\nbackend =\
    \ xla_bridge.get_backend()\nassert backend.platform == 'gpu', \"Not running on\
    \ GPU\"\n\n# Move data to GPU explicitly\nx_gpu = jax.device_put(x)\ny_gpu = jax.device_put(y)\n\
    result_gpu = compute_custom_mul(x_gpu, y_gpu)\nprint(\"Result on GPU:\", result_gpu)\n\
    ```\n\n### 优化 CUDA 内核\n\n让你的内核为你更好地工作：\n选择合适的块和网格大小很重要。如果有帮助，使用共享内存。最好最小化内存访问并优化内存模式。\n\
    \n以下是带有内核启动参数的快速示例：\n\n```python\ndef custom_mul_xla_translation_gpu(c, x, y):\n\
    \    # Previous code...\n    # Define launch dimensions\n    launch_dims = xla_client.ops.Constant(c,\
    \ np.array([n], dtype=np.int32))\n    # Pass launch dimensions in backend_config\n\
    \    backend_config = xla_client._xla_ops.BuildGpuLaunchConfig(launch_dims)\n\
    \    return xla_client.ops.CustomCall(\n        c,\n        b'custom_mul_kernel',\n\
    \        operands=(x, y, n_const),\n        shape=out_shape,\n        backend_config=backend_config\n\
    \    )\n```\n\n如果你定义自己的原语并提供 GPU 特定的转换，你就可以利用自定义内核的强大功能，同时获得 `JAX` 自动微分和 `JIT`\
    \ 编译的好处。这种方法需要正确执行，并且你需要了解 `CUDA` 编程和 `JAX` 内部机制，但它可以为专用操作带来巨大的性能提升。\n"
