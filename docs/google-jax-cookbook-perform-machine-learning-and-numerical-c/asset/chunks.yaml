  fmt: "\n# Measuring Execution Time of JAX Functions\n\nIn the previous chapters,\
    \ various JAX codes were developed to train a neural network on the Fashion-MNIST\
    \ dataset. While JAX offers significant performance improvements over NumPy through\
    \ just-in-time compilation and automatic differentiation, certain parts of the\
    \ code may still contain bottlenecks that hinder optimal performance. Identifying\
    \ these bottlenecks is crucial for optimizing the code to achieve faster execution\
    \ times and more efficient resource utilization. The challenge lies in systematically\
    \ measuring the execution time of JAX functions and pinpointing the sections of\
    \ the code that require optimization.\n\nTo identify and optimize performance\
    \ bottlenecks in JAX code, it is essential to utilize profiling tools that measure\
    \ execution time and analyze computational efficiency. JAX provides built-in functions\
    \ for timing, and Python offers profiling libraries such as `line_profiler` that\
    \ can be employed to gather detailed performance metrics. By applying these tools\
    \ to the neural network code developed previously, insights can be obtained regarding\
    \ which functions or operations are consuming the greatest time and resources.\
    \ This information allows for the implementation of targeted optimization efforts,\
    \ which can enhance overall performance.\n\n## Identifying Functions to Profile\n\
    \nIt is recommended to begin by reviewing the neural network code from the previously\
    \ discussed recipes, with a particular focus on the key functions involved in\
    \ training:\n\n- `forward_pass(params, ...)` Computes the model's predictions.\n\
    - `compute_loss(params, x, ...)` Calculates the loss between predictions and true\
    \ labels.\n- `update(params, x, ...)` Updates model parameters using gradients.\n\
    \nThese above functions are critical to the training loop and are prime candidates\
    \ for profiling to assess their execution times.\n\n## Using JAX's Built-in Timing\
    \ Function\n\nThere is a simple way to measure the execution time of a function\
    \ using However, a more straightforward approach is to use Python's `time` module\
    \ for initial timing measurements.\n\n```python\nimport time\n# Timing the forward_pass\
    \ function\nstart_time = time.time()\ny_pred = forward_pass(params, x_batch)\n\
    end_time = time.time()\nprint(f\"Execution time of forward_pass: {end_time - start_time}\
    \ seconds\")\n```\n\nThis above method provides a basic understanding of how long\
    \ the `forward_pass` function takes to execute with a given batch of data.\n\n\
    ## Profiling with `timeit` and `cProfile`\n\nThe `timeit` module offers more accurate\
    \ timing by running the function multiple times and averaging the results.\n\n\
    ```python\nimport timeit\n# Define a wrapper function for timeit\ndef time_forward_pass():\n\
    \    y_pred = forward_pass(params, x_batch)\n# Measure execution time\nexecution_time\
    \ = timeit.timeit(time_forward_pass, number=100) / 100\nprint(f\"Average execution\
    \ time of forward_pass: {execution_time} seconds\")\n```\n\nBy executing the function\
    \ repeatedly, `timeit` mitigates the effects of transient system load and provides\
    \ a more reliable measurement.\n\nFor a more detailed analysis, the `cProfile`\
    \ module can be used to profile the entire training loop.\n\n```python\nimport\
    \ cProfile\nimport pstats\nimport io\npr = cProfile.Profile()\npr.enable()\n#\
    \ Training loop to profile\nfor epoch in range(num_epochs):\n    # Training code\
    \ as implemented previously\n    pass\npr.disable()\ns = io.StringIO()\nps = pstats.Stats(pr,\
    \ stream=s).sort_stats('cumulative')\nps.print_stats()\n# Display profiling results\n\
    print(s.getvalue())\n```\n\nThe output will show a breakdown of function calls\
    \ and the time spent in each, helping to identify which functions consume the\
    \ most time during training.\n\n## Using `line_profiler` for Line-by-Line Analysis\n\
    \nHere, to profile individual lines within a function, the `line_profiler` module\
    \ can be employed. First, decorate the function to be profiled with `@profile`.\n\
    \n```python\n# Add this decorator to the function you want to profile\n@profile\n\
    def forward_pass(params, x):\n    # Function code\n    pass\n```\n\nRun the above\
    \ script using the `kernprof` command as shown below:\n\n```\nkernprof -l -v your_script.py\n\
    ```\n\nThis above command generates a line-by-line profile report, indicating\
    \ how much time is spent on each line within the function.\n\n## Profiling JIT-compiled\
    \ Functions\n\nProfiling JIT-compiled functions requires special consideration\
    \ because JIT compilation itself takes time, and the first execution includes\
    \ the compilation overhead. To obtain accurate measurements, run the function\
    \ once to trigger compilation and then profile subsequent runs.\n\n```python\n\
    # Warm-up run to trigger JIT compilation\n_ = update(params, x_batch, y_batch)\n\
    # Measure execution time excluding compilation overhead\nstart_time = time.time()\n\
    params = update(params, x_batch, y_batch)\nend_time = time.time()\nprint(f\"Execution\
    \ time of update (post-compilation): {end_time - start_time} seconds\")\n```\n\
    \nThis approach ensures that the timing reflects the actual execution time without\
    \ the initial compilation delay.\n"
  trans: "\n# 测量 JAX 函数的执行时间\n\n在之前的章节中，开发了各种 JAX 代码来在 Fashion-MNIST 数据集上训练神经网络。虽然\
    \ JAX 通过即时编译和自动微分在性能上比 NumPy 提供了显著的提升，但代码中的某些部分仍可能包含阻碍最佳性能的瓶颈。识别这些瓶颈对于优化代码以实现更快的执行时间和更高效的资源利用至关重要。挑战在于系统地测量\
    \ JAX 函数的执行时间并找出需要优化的代码部分。\n\n为了识别和优化 JAX 代码中的性能瓶颈，至关重要的是利用能够测量执行时间并分析计算效率的分析工具。JAX\
    \ 提供了内置的计时函数，而 Python 提供了诸如 `line_profiler` 之类的分析库，可用于收集详细的性能指标。通过将这些工具应用于之前开发的神经网络代码，可以获得有关哪些函数或操作消耗最多时间和资源的见解。这些信息允许实施有针对性的优化工作，从而提高整体性能。\n\
    \n## 识别需要分析的函数\n\n建议首先回顾之前讨论的配方中的神经网络代码，特别关注训练中涉及的关键函数：\n\n-   `forward_pass(params,\
    \ ...)` 计算模型的预测结果。\n-   `compute_loss(params, x, ...)` 计算预测结果与真实标签之间的损失。\n-  \
    \ `update(params, x, ...)` 使用梯度更新模型参数。\n\n这些函数对训练循环至关重要，是评估其执行时间的分析的理想候选对象。\n\n\
    ## 使用 JAX 的内置计时函数\n\n有一种简单的方法来测量函数执行时间使用。然而，更直接的方法是使用 Python 的 `time` 模块进行初始计时测量。\n\
    \n```python\nimport time\n# Timing the forward_pass function\nstart_time = time.time()\n\
    y_pred = forward_pass(params, x_batch)\nend_time = time.time()\nprint(f\"Execution\
    \ time of forward_pass: {end_time - start_time} seconds\")\n```\n\n此方法可提供有关 `forward_pass`\
    \ 函数在给定数据批次下执行所需时间的初步了解。\n\n## 使用 `timeit` 和 `cProfile` 进行分析\n\n`timeit` 模块通过多次运行函数并取平均值来提供更准确的计时。\n\
    \n```python\nimport timeit\n# Define a wrapper function for timeit\ndef time_forward_pass():\n\
    \    y_pred = forward_pass(params, x_batch)\n# Measure execution time\nexecution_time\
    \ = timeit.timeit(time_forward_pass, number=100) / 100\nprint(f\"Average execution\
    \ time of forward_pass: {execution_time} seconds\")\n```\n\n通过重复执行函数，`timeit`\
    \ 缓解了瞬态系统负载的影响并提供了更可靠的测量结果。\n\n对于更详细的分析，可以使用 `cProfile` 模块来分析整个训练循环。\n\n```python\n\
    import cProfile\nimport pstats\nimport io\npr = cProfile.Profile()\npr.enable()\n\
    # Training loop to profile\nfor epoch in range(num_epochs):\n    # Training code\
    \ as implemented previously\n    pass\npr.disable()\ns = io.StringIO()\nps = pstats.Stats(pr,\
    \ stream=s).sort_stats('cumulative')\nps.print_stats()\n# Display profiling results\n\
    print(s.getvalue())\n```\n\n输出将显示函数调用的分解以及每个函数花费的时间，有助于识别训练期间消耗最多时间的函数。\n\n##\
    \ 使用 `line_profiler` 进行逐行分析\n\n在此，要分析函数内的单行代码，可以采用 `line_profiler` 模块。首先，使用 `@profile`\
    \ 装饰要分析的函数。\n\n```python\n# Add this decorator to the function you want to profile\n\
    @profile\ndef forward_pass(params, x):\n    # Function code\n    pass\n```\n\n\
    使用以下 `kernprof` 命令运行上述脚本：\n\n```\nkernprof -l -v your_script.py\n```\n\n此命令会生成逐行分析报告，指示函数内每行花费的时间。\n\
    \n## 分析 JIT 编译函数\n\n分析 JIT 编译函数需要特别考虑，因为 JIT 编译本身需要时间，并且首次执行包含编译开销。为了获得准确的测量结果，请先运行一次函数以触发编译，然后再分析后续运行。\n\
    \n```python\n# Warm-up run to trigger JIT compilation\n_ = update(params, x_batch,\
    \ y_batch)\n# Measure execution time excluding compilation overhead\nstart_time\
    \ = time.time()\nparams = update(params, x_batch, y_batch)\nend_time = time.time()\n\
    print(f\"Execution time of update (post-compilation): {end_time - start_time}\
    \ seconds\")\n```\n\n这种方法可确保计时反映实际执行时间，而不包括初始编译延迟。\n"
