- raw: '  Custom Pytrees for User-defined Classes    When building complex machine
    learning models with JAX, you might define custom classes to represent layers,
    modules, or other components. However, these user-defined classes are not automatically
    recognized by JAX''s PyTree system. As a result, functions like and transformations
    such as jit or grad cannot traverse or manipulate the data within these custom
    objects. This incompatibility makes it difficult to integrate your custom classes
    with JAX''s functionalities, hindering the seamless development of your models.
    The challenge is to make your custom classes compatible with JAX''s Pytrees so
    that you can leverage JAX''s powerful tools while maintaining clean and modular
    code.    To integrate custom classes with JAX''s PyTree system, you can register
    your classes as PyTree nodes. This involves defining how your class can be flattened
    into its constituent leaves (the data it holds) and how it can be reconstructed
    (unflattened) from these leaves. By registering your class with JAX''s tree\_util
    module, you enable JAX to recognize and traverse instances of your class during
    transformations and when using PyTree utilities. This process allows your custom
    objects to be manipulated just like built-in container types, making them compatible
    with JAX functions.    Define Custom Class    Let us consider that we have a custom
    class representing a neural network layer:      import jax    import jax.numpy
    as jnp    class NeuralLayer:       def \_\_init\_\_(self, weights, biases):   
           self.weights \= weights           self.biases \= biases       def \_\_call\_\_(self,
    x):           z \= jnp.dot(x, self.weights) \+ self.biases           return jax.nn.relu(z)   
      In this class, weights and biases are JAX arrays representing the parameters
    of the layer.    Use JAX Functions    Now, try using jax.tree\_map on an instance
    of your class:      layer \= NeuralLayer(weights=jnp.array(\[\[0.1, 0.2\], \[0.3,
    0.4\]\]),                       biases=jnp.array(\[0.1, 0.2\]))    \# Attempt
    to scale the parameters    scaled\_layer \= jax.tree\_map(lambda x: x \* 0.5,
    layer)      This will raise an error because JAX does not know how to traverse   
    Next, define flattening and unflattening functions as learned previously.     
    from jax import tree\_util    def neural\_layer\_flatten(layer):        \# The
    leaves are the parameters we want to transform       leaves \= (layer.weights,
    layer.biases)        \# Auxiliary data includes any static information needed
    to reconstruct the object       aux\_data \= {}       return leaves, aux\_data   
    def neural\_layer\_unflatten(aux\_data, leaves):        \# Reconstruct the NeuralLayer
    object from leaves       return NeuralLayer(\*leaves)      Register Custom Class
    as a PyTree Node    Use tree\_util.register\_pytree\_node to register your class:   
      tree\_util.register\_pytree\_node(NeuralLayer,                             
        neural\_layer\_flatten,                                  neural\_layer\_unflatten)   
      Then, you can use jax.tree\_map and other JAX utilities with instances of your
    class:      \# Scale the parameters of the layer    scaled\_layer \= jax.tree\_map(lambda
    x: x \* 0.5, layer)    \# Verify the parameters have been scaled    print("Scaled
    Weights:\\n", scaled\_layer.weights)    print("Scaled Biases:\\n", scaled\_layer.biases)   
      Integrate with JAX Transformations    You can now include your custom class
    in functions that will be transformed by JAX, such as jit or See the following
    wherein we are using jit with a custom layer:      \# Define a function that uses
    the custom layer    def forward\_pass(layer, x):       return layer(x)    \# JIT-compile
    the forward pass    forward\_pass\_jit \= jax.jit(forward\_pass)    \# Test the
    JIT-compiled function    x\_input \= jnp.array(\[\[1.0, 2.0\]\])    output \=
    forward\_pass\_jit(layer, x\_input)    print("Output:", output)      Compute Gradients   
    Now, compute gradients of a loss function with respect to the parameters in your
    custom class.      \# Define a simple loss function    def loss\_fn(layer, x,
    y\_true):       y\_pred \= layer(x)        loss \= jnp.mean((y\_pred \- y\_true)
    \*\* 2)       return loss    \# Generate dummy data    x\_data \= jnp.array(\[\[1.0,
    2.0\], \[3.0, 4.0\]\])    y\_data \= jnp.array(\[\[0.5, 1.0\], \[1.5, 2.0\]\])   
    \# Compute gradients    grads \= jax.grad(loss\_fn)(layer, x\_data, y\_data)   
      Then, use jax.tree\_map to apply parameter updates:      learning\_rate \= 0.01   
    \# Update function    def update\_params(param, grad):        return param \-
    learning\_rate \* grad    \# Update the layer''s parameters    updated\_layer
    \= jax.tree\_map(update\_params, layer, grads)      Combine Multiple Layers into
    a Model    You can compose multiple custom layers into a larger model:      class
    NeuralNetwork:       def \_\_init\_\_(self, layers):           self.layers \=
    layers       def \_\_call\_\_(self, x):           for layer in self.layers:   
               x \= layer(x)           return x    \# Create multiple layers    layer1
    \= NeuralLayer(weights=jnp.array(\[\[0.1, 0.2\], \[0.3, 0.4\]\]),             
              biases=jnp.array(\[0.1, 0.2\]))    layer2 \= NeuralLayer(weights=jnp.array(\[\[0.5,
    0.6\], \[0.7, 0.8\]\]),                        biases=jnp.array(\[0.3, 0.4\]))   
