    input_size = 784  # 28x28 pixels flattened\nhidden_size = 128\noutput_size = 10\
    \   # 10 classes\nnp.random.seed(0)\nW1 = np.random.randn(input_size, hidden_size)\
    \ * 0.01\nb1 = np.zeros((1, hidden_size))\nW2 = np.random.randn(hidden_size, output_size)\
    \ * 0.01\nb2 = np.zeros((1, output_size))\n# Activation functions\ndef relu(x):\n\
    \    return np.maximum(0, x)\ndef softmax(x):\n    exp_x = np.exp(x - np.max(x,\
    \ axis=1, keepdims=True))  # Stability improvement\n    return exp_x / np.sum(exp_x,\
    \ axis=1, keepdims=True)\n```\n\n## Defining Forward and Backward Passes\n\nOnce\
    \ created, implement the forward pass and compute the loss.\n\n```\ndef forward_pass(x):\n\
    \    z1 = np.dot(x, W1) + b1\n    a1 = relu(z1)\n    z2 = np.dot(a1, W2) + b2\n\
    \    y_pred = softmax(z2)\n    return y_pred, a1\ndef compute_loss(y_pred, y_true):\n\
    \    m = y_true.shape[0]\n    log_likelihood = -np.log(y_pred[range(m), y_true])\n\
    \    loss = np.sum(log_likelihood) / m\n    return loss\n```\n\nImplement the\
    \ backward pass to compute gradients manually.\n\n```\ndef backward_pass(x, a1,\
    \ y_pred, y_true):\n    global W1, b1, W2, b2\n    m = y_true.shape[0]\n    y_true_one_hot\
    \ = np.zeros_like(y_pred)\n    y_true_one_hot[np.arange(m), y_true] = 1\n    dz2\
    \ = y_pred - y_true_one_hot\n    dW2 = np.dot(a1.T, dz2) / m\n    db2 = np.sum(dz2,\
    \ axis=0, keepdims=True) / m\n    da1 = np.dot(dz2, W2.T)\n    dz1 = da1 * (a1\
    \ > 0)\n    dW1 = np.dot(x.T, dz1) / m\n    db1 = np.sum(dz1, axis=0, keepdims=True)\
    \ / m\n    # Update parameters\n    learning_rate = 0.01\n    W1 -= learning_rate\
    \ * dW1\n    b1 -= learning_rate * db1\n    W2 -= learning_rate * dW2\n    b2\
    \ -= learning_rate * db2\n```\n\n## Training Model\n\nNow, its time to train the\
    \ model using the manual forward and backward passes.\n\n```\nnum_epochs = 5\n\
    batch_size = 64\nfor epoch in range(num_epochs):\n    permutation = np.random.permutation(train_images.shape[0])\n\
    \    train_images_shuffled = train_images[permutation]\n    train_labels_shuffled\
    \ = train_labels[permutation]\n    for i in range(0, train_images.shape[0], batch_size):\n\
    \        x_batch = train_images_shuffled[i:i+batch_size]\n        y_batch = train_labels_shuffled[i:i+batch_size]\n\
    \        y_pred, a1 = forward_pass(x_batch)\n        loss = compute_loss(y_pred,\
    \ y_batch)\n        backward_pass(x_batch, a1, y_pred, y_batch)\n    print(f\"\
    Epoch {epoch+1}, Loss: {loss}\")\n```\n\nIt is also observed that training the\
    \ model using `NumPy` can be slow due to the manual computation of gradients and\
    \ the absence of `JIT` compilation. The execution time increases significantly\
    \ with larger datasets and more complex models, making it impractical for large-scale\
    \ machine learning tasks.\n\n## Converting NumPy Code to JAX\n\nTo accelerate\
    \ the code, convert it to use `JAX`. This involves importing `JAX`'s `NumPy` and\
    \ utilizing its `JIT` compilation and automatic differentiation features. To do\
    \ this, replace `NumPy` imports with `JAX`'s `NumPy` and import necessary `JAX`\
    \ functions.\n\n```\nimport jax.numpy as jnp\nfrom jax import grad, jit, random\n\
    from functools import partial\n```\n\nAfter this, update the activation functions\
    \ and model functions to use `JAX`'s `NumPy`.\n\n```\n# Initialize parameters\
    \ with JAX\nkey = random.PRNGKey(0)\nW1 = random.normal(key, (input_size, hidden_size))\
    \ * 0.01\nb1 = jnp.zeros((1, hidden_size))\nW2 = random.normal(key, (hidden_size,\
    \ output_size)) * 0.01\nb2 = jnp.zeros((1, output_size))\ndef relu(x):\n    return\
    \ jnp.maximum(0, x)\ndef softmax(x):\n    exp_x = jnp.exp(x - jnp.max(x, axis=1,\
    \ keepdims=True))\n    return exp_x / jnp.sum(exp_x, axis=1, keepdims=True)\n\
    ```\n\nThen, define the loss function using `JAX`.\n\n```\ndef compute_loss(params,\
    \ x, y):\n    W1, b1, W2, b2 = params\n    z1 = jnp.dot(x, W1) + b1\n    a1 =\
    \ relu(z1)\n    z2 = jnp.dot(a1, W2) + b2\n    y_pred = softmax(z2)\n    m = y.shape[0]\n\
    \    log_likelihood = -jnp.log(y_pred[jnp.arange(m), y])\n    loss = jnp.sum(log_likelihood)\
    \ / m\n    return loss\n```\n\nNext, use `JAX`'s `grad` function to compute gradients\
    \ automatically.\n\n```\ngrad_loss = grad(compute_loss)\n```\n\nAfter that, apply\
    \ `JIT` compilation to the training step function.\n\n```\n@jit\ndef update(params,\
    \ x, y, learning_rate=0.01):\n    grads = grad_loss(params, x, y)\n    params\
    \ = [param - learning_rate * grad for param, grad in zip(params, grads)]\n   \
    \ return params\n```\n\nAnd finally, train the model using the optimized `JAX`\
    \ functions.\n\n```\nparams = [W1, b1, W2, b2]\nnum_epochs = 5\nbatch_size = 64\n\
    for epoch in range(num_epochs):\n    permutation = np.random.permutation(train_images.shape[0])\n\
