  fmt: "\n# Using Custom Data Types\n\nIn certain machine learning applications, standard\
    \ data types like `float32` or `float64` may not suffice due to specific precision\
    \ requirements or the need for specialized numerical behavior. For example, you\
    \ might require fixed-point arithmetic, custom rounding behaviors, or representations\
    \ optimized for specific hardware. `JAX`, by default, supports standard numerical\
    \ types, but to meet the specialized needs of your project, you need to implement\
    \ and utilize custom data types within `JAX`'s framework. Here, the challenge\
    \ is to integrate these custom types into `JAX` so that they can participate in\
    \ `JAX`'s transformations while ensuring correct and efficient computation.\n\n\
    So to use custom data types, you can define a new data type by creating a subclass\
    \ of `jax.lax_dtype` or by using the `jax.custom_dtype` mechanism. Just to flag:\
    \ `JAX` isn't set up to work with custom data types. As an alternative, you can\
    \ simulate custom data types by representing them with standard types and overloading\
    \ the necessary operations. As another option, you can use `JAX`'s support for\
    \ custom `JVPs` (Jacobian-vector products) and `VJPs` (vector-Jacobian products)\
    \ to define custom behavior during automatic differentiation for certain use cases.\n\
    \nIn this recipe, we'll explore how to implement custom data types using `Custom\
    \ VJP` and `Custom JVP` functions, in order to define custom forward and backward\
    \ behaviors for functions involving your specialized numerical types.\n\n## Simulating\
    \ Custom Data Types\n\nTo begin with, our approach will be to simulate custom\
    \ data types using existing types. For example, you can represent a fixed-point\
    \ number using an integer type and define operations accordingly.\n\nSuppose you\
    \ want to implement fixed-point arithmetic with a specific scaling factor.\n\n\
    ```python\nimport jax\nimport jax.numpy as jnp\n# Define a fixed-point class\n\
    class FixedPoint:\n    def __init__(self, value, scale=1000):\n        self.value\
    \ = jnp.asarray(value)\n        self.scale = scale\n    def to_float(self):\n\
    \        return self.value / self.scale\n    def __add__(self, other):\n     \
    \   return FixedPoint(self.value + other.value, self.scale)\n    def __mul__(self,\
    \ other):\n        return FixedPoint((self.value * other.value) // self.scale,\
    \ self.scale)\n    # Add other necessary methods...\n# Example usage\na = FixedPoint(1000)\
    \  # Represents 1.0\nb = FixedPoint(2000)  # Represents 2.0\nc = a + b  # Represents\
    \ 3.0\nd = a * b  # Represents 2.0\n```\n\n## Using JAX Custom Transforms\n\n\
    Now, to integrate custom operations with `JAX`, you can use `jax.custom_jvp` or\
    \ `jax.custom_vjp` decorators to define custom forward and backward passes.\n\n\
    Suppose you have a function that operates on your custom data type, and you want\
    \ to define how it should behave during differentiation.\n\nConsider the following\
    \ example of a custom square function:\n\n```python\n@jax.custom_jvp\ndef custom_square(x):\n\
    \    return x ** 2\n# Define the custom JVP rule\n@custom_square.defjvp\ndef custom_square_jvp(primals,\
    \ tangents):\n    x, = primals\n    x_dot, = tangents\n    primal_out = custom_square(x)\n\
    \    tangent_out = 2 * x * x_dot  # Derivative of x^2 is 2x\n    return primal_out,\
    \ tangent_out\nx = jnp.array(3.0)\ny = custom_square(x)\ndy_dx = jax.grad(custom_square)(x)\n\
    print(\"y =\", y)          # y = 9.0\nprint(\"dy/dx =\", dy_dx) # dy/dx = 6.0\n\
    ```\n\nWe also need to ensure that our custom data types can be used with `JAX`\
    \ transformations. For this, let's define a custom data type for fixed-point numbers\
    \ that can be differentiated.\n\n```python\n# Define JVP rules\n@add.defjvp\n\
    def add_jvp(primals, tangents):\n    a, b = primals\n    a_dot, b_dot = tangents\n\
    \    primal_out = FixedPoint.add(a, b)\n    tangent_out = a_dot + b_dot\n    return\
    \ primal_out, tangent_out\n\n@multiply.defjvp\ndef multiply_jvp(primals, tangents):\n\
    \    a, b = primals\n    a_dot, b_dot = tangents\n    primal_out = FixedPoint.multiply(a,\
    \ b)\n    tangent_out = (a_dot * b.value + b_dot * a.value) // a.scale\n    return\
    \ primal_out, tangent_out\n```\n\n## Using Custom Data Type\n\nNow, you can use\
    \ `FixedPoint` in computations and apply\n\n```python\ndef compute(a_value, b_value):\n\
    \    a = FixedPoint(a_value)\n    b = FixedPoint(b_value)\n    c = FixedPoint.multiply(a,\
    \ b)\n    return c.value\n# Compute gradient with respect to a_value\ngrad_fn\
    \ = jax.grad(compute)\ngradient = grad_fn(1000.0, 2000.0)  # Inputs are scaled\
    \ integers\nprint(\"Gradient:\", gradient)\n```\n\n## Using Custom Pytrees\n\n\
    You can also represent your custom data type as a `PyTree` so that `JAX` can traverse\
    \ it.\n\n```python\nfrom jax import tree_util\ndef fixedpoint_flatten(fp):\n \
    \   return (fp.value,), fp.scale\ndef fixedpoint_unflatten(scale, value):\n  \
    \  return FixedPoint(value[0], scale)\ntree_util.register_pytree_node(FixedPoint,\
    \ fixedpoint_flatten, fixedpoint_unflatten)\n```\n\nNow, you can use `JAX` functions\
    \ on `FixedPoint` instances\n\n```python\ndef compute_sum(a_value, b_value):\n\
    \    a = FixedPoint(a_value)\n    b = FixedPoint(b_value)\n    c = a.value + b.value\n\
    \    return c\ngrad_fn = jax.grad(compute_sum)\ngradient = grad_fn(1000.0, 2000.0)\n\
    print(\"Gradient:\", gradient)\n```\n\nThis approach allows `JAX` to handle `FixedPoint`\
    \ instances in transformations, but you still need to ensure that operations are\
    \ correctly defined and compatible with `JAX`'s expectations. For advanced use\
    \ cases, you can define custom primitives as shown below:\n\n```python\ndef compute(a_value,\
    \ b_value, scale=1000):\n    a = jnp.asarray(a_value)\n    b = jnp.asarray(b_value)\n\
    \    c = fixed_mul(a, b, scale)\n    return c\ngrad_fn = jax.grad(compute)\ngradient\
    \ = grad_fn(1000.0, 2000.0)\nprint(\"Gradient:\", gradient)\n```\n\nIf you use\
    \ `JAX`'s custom transformations and primitives with custom data types, you can\
    \ make `JAX` do more for you, especially when it comes to handling special numerical\
    \ situations. This approach requires you to think carefully about how you define\
    \ operations and differentiate between them. But it lets you integrate custom\
    \ types into `JAX`'s ecosystem, which means you can use its automatic differentiation\
    \ and compilation features.\n"
  trans: "\n# 使用自定义数据类型\n\n在某些机器学习应用中，标准数据类型如 `float32` 或 `float64` 可能不足以满足特定精度要求或需要专门的数值行为。例如，你可能需要定点运算、自定义舍入行为，或针对特定硬件优化的表示形式。`JAX`\
    \ 默认支持标准数值类型，但为了满足项目的特殊需求，你需要在 `JAX` 的框架内实现并使用自定义数据类型。这里的挑战是将这些自定义类型集成到 `JAX`\
    \ 中，使其能够参与 `JAX` 的转换，同时确保正确且高效的计算。\n\n因此要使用自定义数据类型，你可以通过创建 `jax.lax_dtype` 的子类或使用\
    \ `jax.custom_dtype` 机制来定义新的数据类型。需要说明的是：`JAX` 并未设置好用于处理自定义数据类型。作为替代方案，你可以通过使用标准类型表示它们并重载必要的操作来模拟自定义数据类型。另一个选择是使用\
    \ `JAX` 对自定义 `JVPs`（雅可比-向量积）和 `VJPs`（向量-雅可比积）的支持，以在自动微分期间为某些用例定义自定义行为。\n\n在本教程中，我们将探讨如何使用\
    \ `Custom VJP` 和 `Custom JVP` 函数来实现自定义数据类型，以便为涉及你专门数值类型的函数定义自定义的前向和反向行为。\n\n##\
    \ 模拟自定义数据类型\n\n首先，我们的方法将使用现有类型来模拟自定义数据类型。例如，你可以使用整数类型表示定点数并相应地定义操作。\n\n假设你想实现具有特定缩放因子的定点运算。\n\
    \n```python\nimport jax\nimport jax.numpy as jnp\n# Define a fixed-point class\n\
    class FixedPoint:\n    def __init__(self, value, scale=1000):\n        self.value\
    \ = jnp.asarray(value)\n        self.scale = scale\n    def to_float(self):\n\
    \        return self.value / self.scale\n    def __add__(self, other):\n     \
    \   return FixedPoint(self.value + other.value, self.scale)\n    def __mul__(self,\
    \ other):\n        return FixedPoint((self.value * other.value) // self.scale,\
    \ self.scale)\n    # Add other necessary methods...\n# Example usage\na = FixedPoint(1000)\
    \  # Represents 1.0\nb = FixedPoint(2000)  # Represents 2.0\nc = a + b  # Represents\
    \ 3.0\nd = a * b  # Represents 2.0\n```\n\n## 使用 JAX 自定义转换\n\n现在，要将自定义操作与 `JAX`\
    \ 集成，你可以使用 `jax.custom_jvp` 或 `jax.custom_vjp` 装饰器来定义自定义的前向和反向传递。\n\n假设你有一个在自定义数据类型上运行的函数，并且你希望定义它在微分期间的行为。\n\
    \n考虑以下自定义平方函数的示例：\n\n```python\n@jax.custom_jvp\ndef custom_square(x):\n    return\
    \ x ** 2\n# Define the custom JVP rule\n@custom_square.defjvp\ndef custom_square_jvp(primals,\
    \ tangents):\n    x, = primals\n    x_dot, = tangents\n    primal_out = custom_square(x)\n\
    \    tangent_out = 2 * x * x_dot  # Derivative of x² is 2x\n    return primal_out,\
    \ tangent_out\nx = jnp.array(3.0)\ny = custom_square(x)\ndy_dx = jax.grad(custom_square)(x)\n\
    print(\"y =\", y)          # y = 9.0\nprint(\"dy/dx =\", dy_dx) # dy/dx = 6.0\n\
    ```\n\n我们还需要确保自定义数据类型可以与 `JAX` 转换一起使用。为此，让我们定义一种可微分的定点数的自定义数据类型。\n\n```python\n\
    # Define JVP rules\n@add.defjvp\ndef add_jvp(primals, tangents):\n    a, b = primals\n\
    \    a_dot, b_dot = tangents\n    primal_out = FixedPoint.add(a, b)\n    tangent_out\
    \ = a_dot + b_dot\n    return primal_out, tangent_out\n\n@multiply.defjvp\ndef\
    \ multiply_jvp(primals, tangents):\n    a, b = primals\n    a_dot, b_dot = tangents\n\
    \    primal_out = FixedPoint.multiply(a, b)\n    tangent_out = (a_dot * b.value\
    \ + b_dot * a.value) // a.scale\n    return primal_out, tangent_out\n```\n\n##\
    \ 使用自定义数据类型\n\n现在，你可以在计算中使用 `FixedPoint` 并应用\n\n```python\ndef compute(a_value,\
    \ b_value):\n    a = FixedPoint(a_value)\n    b = FixedPoint(b_value)\n    c =\
    \ FixedPoint.multiply(a, b)\n    return c.value\n# Compute gradient with respect\
    \ to a_value\ngrad_fn = jax.grad(compute)\ngradient = grad_fn(1000.0, 2000.0)\
    \  # Inputs are scaled integers\nprint(\"Gradient:\", gradient)\n```\n\n## 使用自定义\
    \ PyTree\n\n你也可以将自定义数据类型表示为 `PyTree`，以便 `JAX` 可以遍历它。\n\n```python\nfrom jax import\
    \ tree_util\ndef fixedpoint_flatten(fp):\n    return (fp.value,), fp.scale\ndef\
    \ fixedpoint_unflatten(scale, value):\n    return FixedPoint(value[0], scale)\n\
    tree_util.register_pytree_node(FixedPoint, fixedpoint_flatten, fixedpoint_unflatten)\n\
    ```\n\n现在，你可以在 `FixedPoint` 实例上使用 `JAX` 函数\n\n```python\ndef compute_sum(a_value,\
    \ b_value):\n    a = FixedPoint(a_value)\n    b = FixedPoint(b_value)\n    c =\
    \ a.value + b.value\n    return c\ngrad_fn = jax.grad(compute_sum)\ngradient =\
    \ grad_fn(1000.0, 2000.0)\nprint(\"Gradient:\", gradient)\n```\n\n这种方法允许 `JAX`\
    \ 在转换中处理 `FixedPoint` 实例，但你仍需要确保操作正确定义并且与 `JAX` 的期望兼容。对于高级用例，你可以按如下所示定义自定义原语：\n\
    \n```python\ndef compute(a_value, b_value, scale=1000):\n    a = jnp.asarray(a_value)\n\
    \    b = jnp.asarray(b_value)\n    c = fixed_mul(a, b, scale)\n    return c\n\
    grad_fn = jax.grad(compute)\ngradient = grad_fn(1000.0, 2000.0)\nprint(\"Gradient:\"\
    , gradient)\n```\n\n如果你使用 `JAX` 的自定义转换和原语与自定义数据类型，你可以让 `JAX` 为你做更多事情，尤其是在处理特殊数值情况时。这种方法要求你仔细思考如何定义操作并在它们之间进行区分。但它让你将自定义类型集成到\
    \ `JAX` 的生态系统中，这意味着你可以使用其自动微分和编译功能。\n"
