  fmt: "\n# Custom Pytrees for User-defined Classes\n\nWhen building complex machine\
    \ learning models with `JAX`, you might define custom classes to represent layers,\
    \ modules, or other components. However, these user-defined classes are not automatically\
    \ recognized by `JAX`'s PyTree system. As a result, functions like and transformations\
    \ such as `jit` or `grad` cannot traverse or manipulate the data within these\
    \ custom objects. This incompatibility makes it difficult to integrate your custom\
    \ classes with `JAX`'s functionalities, hindering the seamless development of\
    \ your models. The challenge is to make your custom classes compatible with `JAX`'s\
    \ Pytrees so that you can leverage `JAX`'s powerful tools while maintaining clean\
    \ and modular code.\n\nTo integrate custom classes with `JAX`'s PyTree system,\
    \ you can register your classes as PyTree nodes. This involves defining how your\
    \ class can be flattened into its constituent leaves (the data it holds) and how\
    \ it can be reconstructed (unflattened) from these leaves. By registering your\
    \ class with `JAX`'s `tree_util` module, you enable `JAX` to recognize and traverse\
    \ instances of your class during transformations and when using PyTree utilities.\
    \ This process allows your custom objects to be manipulated just like built-in\
    \ container types, making them compatible with `JAX` functions.\n\n## Define Custom\
    \ Class\n\nLet us consider that we have a custom class representing a neural network\
    \ layer:\n\n```\nimport jax\nimport jax.numpy as jnp\nclass NeuralLayer:\n   \
    \ def __init__(self, weights, biases):\n        self.weights = weights\n     \
    \   self.biases = biases\n    def __call__(self, x):\n        z = jnp.dot(x, self.weights)\
    \ + self.biases\n        return jax.nn.relu(z)\n```\n\nIn this class, `weights`\
    \ and `biases` are `JAX` arrays representing the parameters of the layer.\n\n\
    ## Use JAX Functions\n\nNow, try using `jax.tree_map` on an instance of your class:\n\
    \n```\nlayer = NeuralLayer(weights=jnp.array([[0.1, 0.2], [0.3, 0.4]]),\n    \
    \                biases=jnp.array([0.1, 0.2]))\n# Attempt to scale the parameters\n\
    scaled_layer = jax.tree_map(lambda x: x * 0.5, layer)\n```\n\nThis will raise\
    \ an error because `JAX` does not know how to traverse\n\nNext, define flattening\
    \ and unflattening functions as learned previously.\n\n```\nfrom jax import tree_util\n\
    def neural_layer_flatten(layer):\n    # The leaves are the parameters we want\
    \ to transform\n    leaves = (layer.weights, layer.biases)\n    # Auxiliary data\
    \ includes any static information needed to reconstruct the object\n    aux_data\
    \ = {}\n    return leaves, aux_data\ndef neural_layer_unflatten(aux_data, leaves):\n\
    \    # Reconstruct the NeuralLayer object from leaves\n    return NeuralLayer(*leaves)\n\
    ```\n\n## Register Custom Class as a PyTree Node\n\nUse `tree_util.register_pytree_node`\
    \ to register your class:\n\n```\ntree_util.register_pytree_node(NeuralLayer,\n\
    \                               neural_layer_flatten,\n                      \
    \         neural_layer_unflatten)\n```\n\nThen, you can use `jax.tree_map` and\
    \ other `JAX` utilities with instances of your class:\n\n```\n# Scale the parameters\
    \ of the layer\nscaled_layer = jax.tree_map(lambda x: x * 0.5, layer)\n# Verify\
    \ the parameters have been scaled\nprint(\"Scaled Weights:\\n\", scaled_layer.weights)\n\
    print(\"Scaled Biases:\\n\", scaled_layer.biases)\n```\n\n## Integrate with JAX\
    \ Transformations\n\nYou can now include your custom class in functions that will\
    \ be transformed by `JAX`, such as `jit` or `grad`. See the following wherein\
    \ we are using `jit` with a custom layer:\n\n```\n# Define a function that uses\
    \ the custom layer\ndef forward_pass(layer, x):\n    return layer(x)\n# JIT-compile\
    \ the forward pass\nforward_pass_jit = jax.jit(forward_pass)\n# Test the JIT-compiled\
    \ function\nx_input = jnp.array([[1.0, 2.0]])\noutput = forward_pass_jit(layer,\
    \ x_input)\nprint(\"Output:\", output)\n```\n\n## Compute Gradients\n\nNow, compute\
    \ gradients of a loss function with respect to the parameters in your custom class.\n\
    \n```\n# Define a simple loss function\ndef loss_fn(layer, x, y_true):\n    y_pred\
    \ = layer(x)\n    loss = jnp.mean((y_pred - y_true) ** 2)\n    return loss\n#\
    \ Generate dummy data\nx_data = jnp.array([[1.0, 2.0], [3.0, 4.0]])\ny_data =\
    \ jnp.array([[0.5, 1.0], [1.5, 2.0]])\n# Compute gradients\ngrads = jax.grad(loss_fn)(layer,\
    \ x_data, y_data)\n```\n\nThen, use `jax.tree_map` to apply parameter updates:\n\
    \n```\nlearning_rate = 0.01\n# Update function\ndef update_params(param, grad):\n\
    \    return param - learning_rate * grad\n# Update the layer's parameters\nupdated_layer\
    \ = jax.tree_map(update_params, layer, grads)\n```\n\n## Combine Multiple Layers\
    \ into a Model\n\nYou can compose multiple custom layers into a larger model:\n\
    \n```\nclass NeuralNetwork:\n    def __init__(self, layers):\n        self.layers\
    \ = layers\n    def __call__(self, x):\n        for layer in self.layers:\n  \
    \          x = layer(x)\n        return x\n# Create multiple layers\nlayer1 =\
    \ NeuralLayer(weights=jnp.array([[0.1, 0.2], [0.3, 0.4]]),\n                 \
    \    biases=jnp.array([0.1, 0.2]))\nlayer2 = NeuralLayer(weights=jnp.array([[0.5,\
    \ 0.6], [0.7, 0.8]]),\n                     biases=jnp.array([0.3, 0.4]))\n# Create\
    \ the neural network\nmodel = NeuralNetwork(layers=[layer1, layer2])\n# Register\
    \ NeuralNetwork as a PyTree node\ndef nn_flatten(nn):\n    leaves = nn.layers\n\
    \    aux_data = {}\n    return leaves, aux_data\ndef nn_unflatten(aux_data, leaves):\n\
    \    return NeuralNetwork(layers=leaves)\ntree_util.register_pytree_node(NeuralNetwork,\
    \ nn_flatten, nn_unflatten)\n```\n\nNow you can continue to train the model using\
    \ `JAX` transformations:\n\n```\n# Define the loss function for the model\ndef\
    \ model_loss_fn(model, x, y_true):\n    y_pred = model(x)\n    loss = jnp.mean((y_pred\
    \ - y_true) ** 2)\n    return loss\n# Compute gradients with respect to the model\
    \ parameters\nmodel_grads = jax.grad(model_loss_fn)(model, x_data, y_data)\n#\
    \ Update the model parameters\nupdated_model = jax.tree_map(update_params, model,\
    \ model_grads)\n```\n\n## Use `vmap` and other Transformations\n\nBecause your\
    \ custom classes are now PyTree-compatible, you can use `vmap` to vectorize operations:\n\
    \n```\n# Vectorize the forward pass over a batch of inputs\nbatched_forward =\
    \ jax.vmap(forward_pass, in_axes=(None, 0))\n# Apply to a batch of inputs\noutputs\
    \ = batched_forward(layer, x_data)\nprint(\"Batched Outputs:\\n\", outputs)\n\
    ```\n\nIf your class contains static fields (data that should not be transformed),\
    \ you can include them in the auxiliary data during flattening.\n\n```\nclass\
    \ NeuralLayerStatic:\n    def __init__(self, weights, biases, activation_fn):\n\
    \        self.weights = weights\n        self.biases = biases\n        self.activation_fn\
    \ = activation_fn  # Static field\n    def __call__(self, x):\n        z = jnp.dot(x,\
    \ self.weights) + self.biases\n        return self.activation_fn(z)\ndef layer_static_flatten(layer):\n\
    \    leaves = (layer.weights, layer.biases)\n    aux_data = layer.activation_fn\n\
    \    return leaves, aux_data\ndef layer_static_unflatten(aux_data, leaves):\n\
    \    return NeuralLayerStatic(*leaves, activation_fn=aux_data)\ntree_util.register_pytree_node(NeuralLayerStatic,\n\
    \                               layer_static_flatten,\n                      \
    \         layer_static_unflatten)\n```\n\nBy registering your custom classes as\
    \ Pytrees, you enable `JAX` to recognize and manipulate them using its powerful\
    \ functional transformations. This integration allows you to maintain clean, object-oriented\
    \ code without sacrificing compatibility with `JAX`'s ecosystem. You can now seamlessly\
    \ include your custom classes in computations, apply transformations like `jit`\
    \ and `grad` and utilize utilities like `jax.tree_map` for parameter updates.\n"
