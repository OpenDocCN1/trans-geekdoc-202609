    \ custom_layer_state_dict, custom_layer_from_state_dict\n)\n```\n\n现在，使用 保存模型参数\n\
    \n```python\n# Save the checkpoint\ncheckpoints.save_checkpoint(ckpt_dir, target=state.params,\
