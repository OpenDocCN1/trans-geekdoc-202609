  fmt: "\n# Converting JAX Models to Other Frameworks\n\nSometimes you might need\
    \ to combine your `JAX` model with other machine learning frameworks or deploy\
    \ it in places that don't support `JAX` straight away. For example, you might\
    \ want to use a framework that offers specific tools or optimizations, or deploy\
    \ your model to a platform that requires a standard format like `ONNX` (Open Neural\
    \ Network Exchange). Since `JAX` doesn't directly support exporting models to\
    \ formats that other frameworks can use, the challenge is to find a way to convert\
    \ your `JAX` models into a format that can be used elsewhere, like `ONNX`, without\
    \ losing the model's integrity or performance.\n\nIf you want to export a `JAX`\
    \ model to a format that other frameworks like `ONNX` can use, you can use the\
    \ `jax2tf` module. This converts `JAX` functions into `TensorFlow` operations.\
    \ Once you've converted the model to `TensorFlow`, you can use `TensorFlow`'s\
    \ `ONNX` exporter to convert it to the `ONNX` format. This two-step process lets\
    \ you connect `JAX` models with other ecosystems, giving you more deployment options.\n\
    \n## Simple JAX Model without Flax\n\nTo do this, let's consider a simple `JAX`\
    \ model without using `Flax`.\n\n```python\nimport jax.numpy as jnp\n\ndef relu(x):\n\
    \    return jnp.maximum(0, x)\n\ndef predict(params, x):\n    W1, b1, W2, b2 =\
    \ params\n    x = x.reshape((x.shape[0], -1))  # Flatten the images\n    z1 =\
    \ jnp.dot(x, W1) + b1\n    a1 = relu(z1)\n    z2 = jnp.dot(a1, W2) + b2\n    logits\
    \ = z2\n    return logits\n```\n\n### Initialize Model Parameters\n\nNext, initialize\
    \ the model parameters as below:\n\n```python\nimport numpy as np\n\ninput_size\
    \ = 784  # 28x28 images flattened\nhidden_size = 128\noutput_size = 10  # Number\
    \ of classes\nkey = jax.random.PRNGKey(0)\nW1 = jax.random.normal(key, (input_size,\
    \ hidden_size))\nb1 = jnp.zeros(hidden_size)\nW2 = jax.random.normal(key, (hidden_size,\
    \ output_size))\nb2 = jnp.zeros(output_size)\nparams = [W1, b1, W2, b2]\n```\n\
    \n## Convert JAX Model to TensorFlow\n\nTo convert, first you need sample input\
    \ data to trace the model during conversion.\n\n```python\n# Sample input batch\n\
    x_sample = jnp.ones((1, 28, 28))  # A batch of one image\n```\n\nNext, import\
    \ `jax2tf` and convert the `predict` function.\n\n```python\nfrom jax.experimental\
    \ import jax2tf\nimport tensorflow as tf\n\n# Wrap the predict function to accept\
    \ and return TensorFlow tensors\ndef predict_tf(params, x):\n    return jax2tf.convert(lambda\
    \ x: predict(params, x))(x)\n\n# Convert the parameters to TensorFlow tensors\n\
    params_tf = [tf.convert_to_tensor(p) for p in params]\n\n# Convert the sample\
    \ input to TensorFlow tensor\nx_sample_tf = tf.convert_to_tensor(np.array(x_sample),\
    \ dtype=tf.float32)\n```\n\n## Build TensorFlow Function for Exporting\n\nYou\
    \ can use `TensorFlow`'s `Function` decorator to build a callable that can be\
    \ exported.\n\n```python\n@tf.function(input_signature=[tf.TensorSpec(shape=[None,\
    \ 28, 28], dtype=tf.float32)])\ndef model_tf(x):\n    return predict_tf(params_tf,\
    \ x)\n```\n\n## Convert TensorFlow Model to ONNX\n\nNext, install the `tf2onnx`\
    \ package if you haven't already.\n\n```bash\npip install tf2onnx\n```\n\nNext,\
    \ you'll want to export the model to `ONNX`.\n\n```python\nimport tf2onnx\n\n\
    # Convert the TensorFlow model to ONNX\nspec = (tf.TensorSpec((None, 28, 28),\
    \ tf.float32),)\noutput_path = \"model.onnx\"\n\n# Perform the conversion\nmodel_proto,\
    \ _ = tf2onnx.convert.from_function(\n    model_tf,\n    input_signature=spec,\n\
    \    opset=13,  # Specify the ONNX opset version\n    output_path=output_path\n\
    )\n```\n\nYou can use the `onnx` library to load and check the model.\n\n```python\n\
    import onnx\n\n# Load the ONNX model\nonnx_model = onnx.load(output_path)\n\n\
    # Check the model for errors\nonnx.checker.check_model(onnx_model)\nprint(\"ONNX\
    \ model is valid.\")\n```\n\n## Run Inference with ONNX Model\n\nMake use of the\
    \ `onnxruntime` to perform inference with the exported model.\n\n```bash\npip\
    \ install onnxruntime\n```\n\nFollowing is a quick inference example:\n\n```python\n\
    import onnxruntime as ort\nimport numpy as np\n\n# Create an ONNX inference session\n\
    ort_session = ort.InferenceSession(output_path)\n\n# Prepare input data\nx_input\
    \ = np.ones((1, 28, 28), dtype=np.float32)\n\n# Run inference\noutputs = ort_session.run(None,\
    \ {'x': x_input})\n\n# Get the output logits\nlogits = outputs[0]\nprint(\"Logits:\"\
    , logits)\n```\n\n## Compare JAX and ONNX Model Results\n\nEnsure that the outputs\
    \ from the `JAX` model and the `ONNX` model are consistent.\n\n```python\n# Get\
    \ JAX model output\njax_output = predict(params, x_sample)\n\n# Compare with ONNX\
    \ model output\nprint(\"JAX logits:\", jax_output)\nprint(\"ONNX logits:\", logits)\n\
    \n# Check if the outputs are close\nare_close = np.allclose(np.array(jax_output),\
    \ logits, atol=1e-5)\nprint(\"Outputs are close:\", are_close)\n```\n\nIn this\
    \ approach, the model parameters are hardcoded in the `TensorFlow` function. If\
    \ you want a more flexible solution, especially for larger models, you might want\
    \ to think about exporting the parameters separately.\n\nAfter this, you can now\
    \ deploy the `ONNX` model using any framework or platform that supports `ONNX`\
    \ models.\n"
  trans: "\n# 将 JAX 模型转换为其他框架\n\n有时你可能需要将你的 `JAX` 模型与其他机器学习框架结合使用，或部署到不直接支持 `JAX`\
    \ 的地方。例如，你可能想要使用提供特定工具或优化的框架，或将模型部署到需要标准格式如 `ONNX`（开放神经网络交换）的平台。由于 `JAX` 不直接支持将模型导出为其他框架可用的格式，因此挑战在于找到一种方法将你的\
    \ `JAX` 模型转换为可在其他地方使用的格式，如 `ONNX`，同时不损失模型的完整性或性能。\n\n如果你想将 `JAX` 模型导出为其他框架如 `ONNX`\
    \ 可用的格式，可以使用 `jax2tf` 模块。它将 `JAX` 函数转换为 `TensorFlow` 操作。 将模型转换为 `TensorFlow` 后，你可以使用\
    \ `TensorFlow` 的 `ONNX` 导出器将其转换为 `ONNX` 格式。这种两步流程让你能够将 `JAX` 模型与其他生态系统连接起来，提供更多部署选项。\n\
    \n## 不使用 Flax 的简单 JAX 模型\n\n为此，让我们考虑一个不使用 `Flax` 的简单 `JAX` 模型。\n\n```python\n\
    import jax.numpy as jnp\n\ndef relu(x):\n    return jnp.maximum(0, x)\n\ndef predict(params,\
    \ x):\n    W1, b1, W2, b2 = params\n    x = x.reshape((x.shape[0], -1))  # Flatten\
    \ the images\n    z1 = jnp.dot(x, W1) + b1\n    a1 = relu(z1)\n    z2 = jnp.dot(a1,\
    \ W2) + b2\n    logits = z2\n    return logits\n```\n\n### 初始化模型参数\n\n接下来，按如下方式初始化模型参数：\n\
    \n```python\nimport numpy as np\n\ninput_size = 784  # 28x28 images flattened\n\
    hidden_size = 128\noutput_size = 10  # Number of classes\nkey = jax.random.PRNGKey(0)\n\
    W1 = jax.random.normal(key, (input_size, hidden_size))\nb1 = jnp.zeros(hidden_size)\n\
    W2 = jax.random.normal(key, (hidden_size, output_size))\nb2 = jnp.zeros(output_size)\n\
    params = [W1, b1, W2, b2]\n```\n\n## 将 JAX 模型转换为 TensorFlow\n\n进行转换时，首先需要示例输入数据以在转换过程中追踪模型。\n\
    \n```python\n# Sample input batch\nx_sample = jnp.ones((1, 28, 28))  # A batch\
    \ of one image\n```\n\n接下来，导入 `jax2tf` 并转换 `predict` 函数。\n\n```python\nfrom jax.experimental\
    \ import jax2tf\nimport tensorflow as tf\n\n# Wrap the predict function to accept\
    \ and return TensorFlow tensors\ndef predict_tf(params, x):\n    return jax2tf.convert(lambda\
    \ x: predict(params, x))(x)\n\n# Convert the parameters to TensorFlow tensors\n\
    params_tf = [tf.convert_to_tensor(p) for p in params]\n\n# Convert the sample\
    \ input to TensorFlow tensor\nx_sample_tf = tf.convert_to_tensor(np.array(x_sample),\
    \ dtype=tf.float32)\n```\n\n## 构建用于导出的 TensorFlow 函数\n\n你可以使用 `TensorFlow` 的 `Function`\
    \ 装饰器构建可导出的可调用对象。\n\n```python\n@tf.function(input_signature=[tf.TensorSpec(shape=[None,\
    \ 28, 28], dtype=tf.float32)])\ndef model_tf(x):\n    return predict_tf(params_tf,\
    \ x)\n```\n\n## 将 TensorFlow 模型转换为 ONNX\n\n如果尚未安装，请先安装 `tf2onnx` 包。\n\n```bash\n\
    pip install tf2onnx\n```\n\n接下来，你需要将模型导出到 `ONNX`。\n\n```python\nimport tf2onnx\n\
    \n# Convert the TensorFlow model to ONNX\nspec = (tf.TensorSpec((None, 28, 28),\
    \ tf.float32),)\noutput_path = \"model.onnx\"\n\n# Perform the conversion\nmodel_proto,\
    \ _ = tf2onnx.convert.from_function(\n    model_tf,\n    input_signature=spec,\n\
    \    opset=13,  # Specify the ONNX opset version\n    output_path=output_path\n\
    )\n```\n\n你可以使用 `onnx` 库加载并检查模型。\n\n```python\nimport onnx\n\n# Load the ONNX\
    \ model\nonnx_model = onnx.load(output_path)\n\n# Check the model for errors\n\
    onnx.checker.check_model(onnx_model)\nprint(\"ONNX model is valid.\")\n```\n\n\
    ## 使用 ONNX 模型运行推理\n\n使用 `onnxruntime` 对导出的模型进行推理。\n\n```bash\npip install onnxruntime\n\
    ```\n\n以下是快速推理示例：\n\n```python\nimport onnxruntime as ort\nimport numpy as np\n\
    \n# Create an ONNX inference session\nort_session = ort.InferenceSession(output_path)\n\
    \n# Prepare input data\nx_input = np.ones((1, 28, 28), dtype=np.float32)\n\n#\
    \ Run inference\noutputs = ort_session.run(None, {'x': x_input})\n\n# Get the\
    \ output logits\nlogits = outputs[0]\nprint(\"Logits:\", logits)\n```\n\n## 比较\
    \ JAX 和 ONNX 模型结果\n\n确保 `JAX` 模型和 `ONNX` 模型的输出一致。\n\n```python\n# Get JAX model\
    \ output\njax_output = predict(params, x_sample)\n\n# Compare with ONNX model\
    \ output\nprint(\"JAX logits:\", jax_output)\nprint(\"ONNX logits:\", logits)\n\
    \n# Check if the outputs are close\nare_close = np.allclose(np.array(jax_output),\
    \ logits, atol=1e-5)\nprint(\"Outputs are close:\", are_close)\n```\n\n在这种方法中，模型参数是硬编码在\
    \ `TensorFlow` 函数中的。如果你想要更灵活的解决方案，特别是对于较大的模型，你可能需要考虑单独导出参数。\n\n之后，你现在可以使用任何支持\
    \ `ONNX` 模型的框架或平台部署 `ONNX` 模型。\n"
