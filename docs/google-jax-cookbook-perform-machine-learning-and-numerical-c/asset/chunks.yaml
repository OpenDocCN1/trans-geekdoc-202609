  fmt: "\n# Controlling Type Promotion in Arithmetic Operations\n\nWhen working with\
    \ `JAX` for machine learning tasks, you might encounter unintended type promotions\
    \ during arithmetic operations. For example, performing calculations with mixed\
    \ data types like `float16` and `float32` can result in automatic promotion to\
    \ a higher precision type or even This promotion can increase memory usage and\
    \ computational overhead, negating the benefits of using lower precision types.\
    \ The challenge is to explicitly manage data types in your computations to prevent\
    \ unwanted type promotions, ensuring that memory usage remains optimized without\
    \ sacrificing numerical accuracy.\n\n## Steps to Control Type Promotion\n\nNow,\
    \ to control type promotion, you need to:\n- Know how `JAX` handles operations\
    \ between different data types.\n- Use casting functions to ensure variables are\
    \ in the desired data type before operations.\n- Employ `JAX`'s precision control\
    \ settings to manage default behaviors.\n- Check and enforce data types at each\
    \ step to prevent unintended promotions.\n\n## Understanding JAX's Type Promotion\
    \ Rules\n\n`JAX` follows `NumPy`'s type promotion rules, which determine the output\
    \ type when performing operations on inputs of different types.\n\nWhen combining\
    \ integers and floating-point numbers, the result is promoted to a floating-point\
    \ type.\n\n- When performing operations between `float16` and the result is promoted\
    \ to\n- Including a `float64` in any operation will promote the result to\n\n\
    Following is a quick example of unintended type promotion:\n\n```\nimport jax.numpy\
    \ as jnp\na = jnp.array([1.0, 2.0], dtype=jnp.float16)\nb = jnp.array([3.0, 4.0],\
    \ dtype=jnp.float32)\nc = a + b\nprint(c.dtype)  # Output: float32\n```\n\nHere,\
    \ adding a `float16` array to a `float32` array results in a `float32` output.\n\
    \n## Explicitly Cast Data Types before Operations\n\nTo prevent unintended promotions,\
    \ ensure all operands are of the same desired data type as below:\n\n```\na =\
    \ jnp.array([1.0, 2.0], dtype=jnp.float16)\nb = jnp.array([3.0, 4.0], dtype=jnp.float32)\n\
    # Cast 'b' to float16 before the operation\nb_cast = b.astype(jnp.float16)\nc\
    \ = a + b_cast\nprint(c.dtype)  # Output: float16\n```\n\nNow here, by casting\
    \ `b` to the addition operation retains the lower precision.\n\n## Consistent\
    \ Data Types in Model Parameters\n\nHere in this, you must ensure that all model\
    \ parameters and inputs are consistently typed.\n\n```\n# Model weights initialization\n\
    key = jax.random.PRNGKey(0)\nW1 = jax.random.normal(key, (784, 256), dtype=jnp.float16)\n\
    b1 = jnp.zeros((256,), dtype=jnp.float16)\nW2 = jax.random.normal(key, (256, 128),\
    \ dtype=jnp.float16)\nb2 = jnp.zeros((128,), dtype=jnp.float16)\nparams = [W1,\
    \ b1, W2, b2]\n```\n\n## Casting Input Data and Enforcing Data Types\n\nWhen loading\
    \ data, cast it to the desired type.\n\n```\n# Load and preprocess data\ntrain_images\
    \ = ...  # Load data as NumPy array\ntrain_images = train_images.astype(jnp.float16)\
    \ / 255.0  # Normalize and cast\n```\n\nEnsure functions do not introduce unintended\
    \ promotions.\n\n```\ndef forward_pass(params, x):\n    W1, b1, W2, b2 = params\n\
    \    x = x.astype(jnp.float16)  # Ensure input is float16\n    z1 = jnp.dot(x,\
    \ W1) + b1\n    a1 = jax.nn.relu(z1)\n    z2 = jnp.dot(a1, W2) + b2\n    y_pred\
    \ = jax.nn.softmax(z2)\n    return y_pred.astype(jnp.float16)\n```\n\n## Using\
    \ Context Managers for Precision Control\n\n`JAX` also provides context managers\
    \ to control default data types as demonstrated below:\n\n```\nfrom jax import\
    \ config\nconfig.update(\"jax_enable_x64\", False)  # Disable float64 globally\n\
    ```\n\nThis above setting forces all computations to use `float32` or lower precision,\
    \ preventing unintended promotions to\n\n## Monitoring Data Types during Computation\n\
    \nNow here, you can insert checks or print statements to monitor data types. Following\
    \ is a quick example:\n\n```\ndef forward_pass(params, x):\n    W1, b1, W2, b2\
    \ = params\n    x = x.astype(jnp.float16)\n    print(\"Input dtype:\", x.dtype)\n\
    \    z1 = jnp.dot(x, W1) + b1\n    print(\"z1 dtype:\", z1.dtype)\n    # Continue\
    \ with the rest of the computation\n```\n\nWhile you do, you may use `jax.debug`\
    \ to enforce data type constraints during execution.\n\n```\nfrom jax import debug\n\
    def forward_pass(params, x):\n    W1, b1, W2, b2 = params\n    x = x.astype(jnp.float16)\n\
    \    debug.assert_equal(x.dtype, jnp.float16, \"Input x is not float16\")\n  \
    \  z1 = jnp.dot(x, W1) + b1\n    debug.assert_equal(z1.dtype, jnp.float16, \"\
    z1 is not float16\")\n    # Continue with the rest of the computation\n```\n\n\
    ## Using Mixed Precision Training\n\nJust a heads-up that using lower precision\
