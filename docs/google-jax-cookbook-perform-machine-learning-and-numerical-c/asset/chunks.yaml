    ## Chapter 1: Transition NumPy to JAX


    ### Overview


    Moving from `NumPy` to `JAX` opens up new possibilities for machine learning engineers
    and data scientists, offering significant improvements in computational speed
    and efficiency. This chapter aims to ease this transition by addressing common
    challenges and introducing key concepts in `JAX`. The focus is on leveraging the
    advanced features of `JAX` while maintaining the familiarity of `NumPy`''s syntax
    and operations, allowing you to improve performance without a steep learning curve.


    In this chapter, we will explore five key topics. First, we examine how to speed
    up existing `NumPy` code using `JAX`''s just-in-time compilation and automatic
    differentiation. Next, we address the issue of unsupported `NumPy` functions in
    `JAX` and discover suitable alternatives for preserving functionality. We discuss
    effective management strategies for random number generation, as it differs in
    `JAX` compared to `NumPy`, to ensure reproducibility and reliability. The challenges
    posed by in-place operations require a different approach in `JAX`, which we will
    address to help you adapt your coding practices. Finally, we will explore `JAX`''s
    type promotion semantics and precision handling to maintain numerical stability
    during the transition.


    To provide a practical context, we will introduce the `Fashion-MNIST` dataset.
    This is a collection of grayscale images representing various clothing items.
    This dataset serves as an excellent testbed for building and optimizing machine
    learning models. Throughout the book, we use it to implement examples and exercises
    that allow you to apply the concepts you learn in real-world scenarios. Our hope
    is that your work with `Fashion-MNIST` will deepen your understanding of `JAX`
    while developing skills that are directly applicable to your own projects.

