- raw: '  Implementing Mixed Precision Training    Training deep neural networks can
    be pretty time-consuming, especially with large models. You might notice that
    training is slow, and you want to speed it up without losing too much accuracy
    in the model. One great way to speed things up is mixed precision training, which
    uses both 16-bit and 32-bit floating-point types to make computations faster and
    use less memory. The goal is to implement mixed precision training in JAX in a
    way that speeds up computations while keeping the numbers stable and the model
    performing well.    Mixed precision training leverages lower precision data types
    (like float16 or for most computations to speed up processing and reduce memory
    consumption. Critical parts of the computation that require higher precision use
    If you manage your data types carefully, you can get faster training times while
    keeping the model''s accuracy as good as it would be with full precision training.   
    Implement Loss Function    Now to begin, first load the training state of the
    model and then implement the loss function.      def compute\_loss(params, images,
    labels):       logits \= FashionMNISTModel().apply({''params'': params}, images)   
       loss \= optax.softmax\_cross\_entropy\_with\_integer\_labels(logits, labels).mean()   
       return loss      Now here, we need to ensure that:    Gradients are computed
    in float32 to prevent underflow.  Parameters are updated in      @jit    def train\_step(state,
    batch):       images \= batch\[''images''\]       labels \= batch\[''labels''\]   
       def loss\_fn(params):           loss \= compute\_loss(params, images, labels)   
           return loss       grad\_fn \= value\_and\_grad(loss\_fn)       loss, grads
    \= grad\_fn(state.params)       # Cast gradients to float32        grads \= jax.tree\_map(lambda
    g: g.astype(jnp.float32), grads)       # Update state       state \= state.apply\_gradients(grads=grads)   
       return state, loss      Next, following is the training loop:      rng \= jax.random.PRNGKey(0)   
    state \= create\_train\_state(rng, learning\_rate=0.001)    num\_epochs \= 10   
    for epoch in range(num\_epochs):       for batch in train\_ds:           state,
    loss \= train\_step(state, batch)        print(f''Epoch {epoch \+ 1}, Loss: {loss}'')   
      Then, implement the evaluation step:      @jit    def eval\_step(params, batch):   
       images \= batch\[''images''\]       labels \= batch\[''labels''\]       logits
    \= FashionMNISTModel().apply({''params'': params}, images)       loss \= optax.softmax\_cross\_entropy\_with\_integer\_labels(logits,
    labels).mean()        accuracy \= jnp.mean(jnp.argmax(logits, \-1) \== labels)   
       return {''loss'': loss, ''accuracy'': accuracy}      And then, evaluate the
    model:      def evaluate\_model(state, test\_ds):       metrics \= \[\]       for
    batch in test\_ds:           metrics.append(eval\_step(state.params, batch))   
       metrics\_np \= jax.device\_get(metrics)        test\_loss \= np.mean(\[m\[''loss''\]
    for m in metrics\_np\])        test\_accuracy \= np.mean(\[m\[''accuracy''\] for
    m in metrics\_np\])        print(f"Test Loss: {test\_loss}, Test Accuracy: {test\_accuracy}")   
      Monitoring Model Accuracy    After training, compare the model''s accuracy with
    that of a model trained with full precision to ensure there''s no significant
    loss. See the following code snippet:      \# Evaluate mixed precision model   
    evaluate\_model(state, test\_ds)    \# Compare with full precision model (if available)   
    \# ... (train and evaluate a full precision model)      Using ‘bfloat16’ on TPUs   
    If training on TPUs, then we need to replace float16 with bfloat16 for better
    dynamic range.      \# Modify the model to use bfloat16    class FashionMNISTModel(nn.Module):   
       @nn.compact       def \_\_call\_\_(self, x):           x \= x.astype(jnp.bfloat16)   
           # ... rest of the model ...      By using mixed-precision training, you
    can cut training times in half and reduce memory usage without losing any accuracy.
    It''s really important to handle data types carefully and make sure you''re doing
    the right level of calculation to get the results you want with mixed precision
    training.    '
  fmt: "\n# Implementing Mixed Precision Training\n\nTraining deep neural networks\
    \ can be pretty time-consuming, especially with large models. You might notice\
    \ that training is slow, and you want to speed it up without losing too much accuracy\
    \ in the model. One great way to speed things up is mixed precision training,\
    \ which uses both 16-bit and 32-bit floating-point types to make computations\
    \ faster and use less memory. The goal is to implement mixed precision training\
    \ in `JAX` in a way that speeds up computations while keeping the numbers stable\
    \ and the model performing well.\n\nMixed precision training leverages lower precision\
    \ data types (like `float16` or for most computations to speed up processing and\
    \ reduce memory consumption. Critical parts of the computation that require higher\
    \ precision use If you manage your data types carefully, you can get faster training\
    \ times while keeping the model's accuracy as good as it would be with full precision\
    \ training.\n\n## Implement Loss Function\n\nNow to begin, first load the training\
    \ state of the model and then implement the loss function.\n\n```\ndef compute_loss(params,\
    \ images, labels):\n    logits = FashionMNISTModel().apply({'params': params},\
    \ images)\n    loss = optax.softmax_cross_entropy_with_integer_labels(logits,\
    \ labels).mean()\n    return loss\n```\n\nNow here, we need to ensure that:\n\
    Gradients are computed in `float32` to prevent underflow. Parameters are updated\
    \ in\n\n```\n@jit\ndef train_step(state, batch):\n    images = batch['images']\n\
    \    labels = batch['labels']\n    def loss_fn(params):\n        loss = compute_loss(params,\
    \ images, labels)\n        return loss\n    grad_fn = value_and_grad(loss_fn)\n\
    \    loss, grads = grad_fn(state.params)\n    # Cast gradients to float32\n  \
    \  grads = jax.tree_map(lambda g: g.astype(jnp.float32), grads)\n    # Update\
    \ state\n    state = state.apply_gradients(grads=grads)\n    return state, loss\n\
    ```\n\nNext, following is the training loop:\n\n```\nrng = jax.random.PRNGKey(0)\n\
    state = create_train_state(rng, learning_rate=0.001)\nnum_epochs = 10\nfor epoch\
    \ in range(num_epochs):\n    for batch in train_ds:\n        state, loss = train_step(state,\
    \ batch)\n    print(f'Epoch {epoch + 1}, Loss: {loss}')\n```\n\nThen, implement\
    \ the evaluation step:\n\n```\n@jit\ndef eval_step(params, batch):\n    images\
    \ = batch['images']\n    labels = batch['labels']\n    logits = FashionMNISTModel().apply({'params':\
    \ params}, images)\n    loss = optax.softmax_cross_entropy_with_integer_labels(logits,\
    \ labels).mean()\n    accuracy = jnp.mean(jnp.argmax(logits, -1) == labels)\n\
    \    return {'loss': loss, 'accuracy': accuracy}\n```\n\nAnd then, evaluate the\
    \ model:\n\n```\ndef evaluate_model(state, test_ds):\n    metrics = []\n    for\
    \ batch in test_ds:\n        metrics.append(eval_step(state.params, batch))\n\
    \    metrics_np = jax.device_get(metrics)\n    test_loss = np.mean([m['loss']\
    \ for m in metrics_np])\n    test_accuracy = np.mean([m['accuracy'] for m in metrics_np])\n\
    \    print(f\"Test Loss: {test_loss}, Test Accuracy: {test_accuracy}\")\n```\n\
    \n## Monitoring Model Accuracy\n\nAfter training, compare the model's accuracy\
    \ with that of a model trained with full precision to ensure there's no significant\
    \ loss. See the following code snippet:\n\n```\n# Evaluate mixed precision model\n\
    evaluate_model(state, test_ds)\n# Compare with full precision model (if available)\n\
    # ... (train and evaluate a full precision model)\n```\n\n## Using `bfloat16`\
    \ on TPUs\n\nIf training on TPUs, then we need to replace `float16` with `bfloat16`\
    \ for better dynamic range.\n\n### Modify the model to use `bfloat16`\n\n```\n\
    class FashionMNISTModel(nn.Module):\n    @nn.compact\n    def __call__(self, x):\n\
    \        x = x.astype(jnp.bfloat16)\n        # ... rest of the model ...\n```\n\
    \nBy using mixed-precision training, you can cut training times in half and reduce\
    \ memory usage without losing any accuracy. It's really important to handle data\
    \ types carefully and make sure you're doing the right level of calculation to\
    \ get the results you want with mixed precision training.\n"
  trans: "\n# 实现混合精度训练\n\n训练深度神经网络可能相当耗时，尤其是在大型模型的情况下。你可能会注意到训练速度很慢，并且希望在不损失太多模型精度的情况下加快速度。加快速度的一个好方法是混合精度训练，它使用\
    \ 16 位和 32 位浮点类型来使计算更快并使用更少的内存。目标是在 `JAX` 中实现混合精度训练，以加快计算速度，同时保持数值稳定和模型性能良好。\n\
    \n混合精度训练利用较低精度的数据类型（如 `float16` 或 用于大多数计算以加快处理速度并减少内存消耗。需要更高精度的计算的关键部分使用 如果你仔细管理数据类型，你可以在保持模型的准确性与全精度训练一样好的同时获得更快的训练时间。\n\
    \n## 实现损失函数\n\n现在开始，首先加载模型的训练状态，然后实现损失函数。\n\n```\ndef compute_loss(params, images,\
    \ labels):\n    logits = FashionMNISTModel().apply({'params': params}, images)\n\
    \    loss = optax.softmax_cross_entropy_with_integer_labels(logits, labels).mean()\n\
    \    return loss\n```\n\n现在，这里，我们需要确保：\n梯度以 `float32` 计算以防止下溢。参数在 中更新\n\n```\n\
    @jit\ndef train_step(state, batch):\n    images = batch['images']\n    labels\
    \ = batch['labels']\n    def loss_fn(params):\n        loss = compute_loss(params,\
    \ images, labels)\n        return loss\n    grad_fn = value_and_grad(loss_fn)\n\
    \    loss, grads = grad_fn(state.params)\n    # Cast gradients to float32\n  \
    \  grads = jax.tree_map(lambda g: g.astype(jnp.float32), grads)\n    # Update\
    \ state\n    state = state.apply_gradients(grads=grads)\n    return state, loss\n\
    ```\n\n接下来，以下是训练循环：\n\n```\nrng = jax.random.PRNGKey(0)\nstate = create_train_state(rng,\
    \ learning_rate=0.001)\nnum_epochs = 10\nfor epoch in range(num_epochs):\n   \
    \ for batch in train_ds:\n        state, loss = train_step(state, batch)\n   \
    \ print(f'Epoch {epoch + 1}, Loss: {loss}')\n```\n\n然后，实现评估步骤：\n\n```\n@jit\n\
    def eval_step(params, batch):\n    images = batch['images']\n    labels = batch['labels']\n\
    \    logits = FashionMNISTModel().apply({'params': params}, images)\n    loss\
    \ = optax.softmax_cross_entropy_with_integer_labels(logits, labels).mean()\n \
    \   accuracy = jnp.mean(jnp.argmax(logits, -1) == labels)\n    return {'loss':\
    \ loss, 'accuracy': accuracy}\n```\n\n然后，评估模型：\n\n```\ndef evaluate_model(state,\
    \ test_ds):\n    metrics = []\n    for batch in test_ds:\n        metrics.append(eval_step(state.params,\
    \ batch))\n    metrics_np = jax.device_get(metrics)\n    test_loss = np.mean([m['loss']\
    \ for m in metrics_np])\n    test_accuracy = np.mean([m['accuracy'] for m in metrics_np])\n\
    \    print(f\"Test Loss: {test_loss}, Test Accuracy: {test_accuracy}\")\n```\n\
    \n## 监控模型准确率\n\n训练后，将模型的准确率与使用全精度训练的模型进行比较，以确保没有显著损失。参见以下代码片段：\n\n```\n# Evaluate\
    \ mixed precision model\nevaluate_model(state, test_ds)\n# Compare with full precision\
    \ model (if available)\n# ... (train and evaluate a full precision model)\n```\n\
    \n## 在 TPU 上使用 `bfloat16`\n\n如果在 TPU 上训练，则需要将 `float16` 替换为 `bfloat16` 以获得更好的动态范围。\n\
    \n### 修改模型以使用 `bfloat16`\n\n```\nclass FashionMNISTModel(nn.Module):\n    @nn.compact\n\
    \    def __call__(self, x):\n        x = x.astype(jnp.bfloat16)\n        # ...\
    \ rest of the model ...\n```\n\n通过使用混合精度训练，你可以将训练时间缩短一半并减少内存使用，而不会损失任何精度。仔细处理数据类型非常重要，并确保你以正确的计算级别进行操作，以获得你想要的结果。\n"
