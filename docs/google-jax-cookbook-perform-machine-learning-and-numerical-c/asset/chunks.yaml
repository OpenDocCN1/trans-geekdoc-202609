  fmt: "\n# Evaluating and Visualizing Model Performance\n\nAssessing a machine learning\
    \ model's learning progress is essential for understanding its effectiveness and\
    \ identifying areas for improvement. In `JAX`-based workflows, it can be challenging\
    \ to implement evaluation metrics and visualize the model's training and testing\
    \ performance without high-level libraries. To address this, we will use evaluation\
    \ metrics such as accuracy, precision, recall, and confusion matrices, along with\
    \ visualization tools like `Matplotlib`, to track the model's progress and gain\
    \ insights into its behavior during training. This recipe demonstrates how to\
    \ implement these techniques to monitor the performance of the `JAX` model we\
    \ have developed so far.\n\n## Overview\n\nHere, to evaluate and visualize the\
    \ model's performance effectively, we will:\n\n- Implement standard evaluation\
    \ metrics such as accuracy, precision, recall, and confusion matrix.\n- Visualize\
    \ the model's learning curves by plotting metrics like loss and accuracy over\
    \ time.\n- Use confusion matrices to identify where the model is making correct\
    \ and incorrect predictions.\n- Integrate these evaluation techniques into the\
    \ `JAX` training and testing workflow.\n\n## Implement Evaluation Metrics\n\n\
    To start, we will implement common evaluation metrics, focusing on accuracy, precision,\
    \ recall, and confusion matrix calculation.\n\n```python\nimport jax.numpy as\
    \ jnp\n\ndef compute_accuracy(params, test_ds):\n    \"\"\"Calculate the accuracy\
    \ of the model on the test dataset.\"\"\"\n    correct = 0\n    total = 0\n  \
    \  for batch in test_ds:\n        images, labels = batch\n        # Perform the\
    \ forward pass to get predictions\n        preds = forward(params, images)\n \
    \       # Get the predicted class by taking the argmax\n        predicted_class\
    \ = jnp.argmax(preds, axis=1)\n        # Count correct predictions\n        correct\
    \ += jnp.sum(predicted_class == labels)\n        total += labels.shape[0]\n  \
    \  accuracy = correct / total\n    return accuracy\n\ndef compute_precision_recall(params,\
    \ test_ds, num_classes=10):\n    \"\"\"Calculate precision and recall for each\
    \ class.\"\"\"\n    true_positives = jnp.zeros(num_classes)\n    false_positives\
    \ = jnp.zeros(num_classes)\n    false_negatives = jnp.zeros(num_classes)\n   \
    \ for batch in test_ds:\n        images, labels = batch\n        preds = forward(params,\
    \ images)\n        predicted_class = jnp.argmax(preds, axis=1)\n        for i\
    \ in range(num_classes):\n            true_positives = true_positives.at[i].add(jnp.sum((predicted_class\
    \ == i) & (labels == i)))\n            false_positives = false_positives.at[i].add(jnp.sum((predicted_class\
    \ == i) & (labels != i)))\n            false_negatives = false_negatives.at[i].add(jnp.sum((predicted_class\
    \ != i) & (labels == i)))\n    # Compute precision and recall\n    precision =\
    \ true_positives / (true_positives + false_positives + 1e-8)\n    recall = true_positives\
    \ / (true_positives + false_negatives + 1e-8)\n    return precision, recall\n\
    ```\n\nThe `compute_accuracy` function calculates the overall accuracy, while\
    \ the `compute_precision_recall` function calculates precision and recall for\
    \ each class, providing more detailed performance insights.\n\n## Compute Confusion\
    \ Matrix\n\nA confusion matrix can help visualize the model's performance across\
    \ different classes by showing where the model is making correct and incorrect\
    \ predictions.\n\n```python\ndef compute_confusion_matrix(params, test_ds, num_classes=10):\n\
    \    \"\"\"Compute the confusion matrix for the test dataset.\"\"\"\n    confusion_matrix\
    \ = jnp.zeros((num_classes, num_classes))\n    for batch in test_ds:\n       \
    \ images, labels = batch\n        preds = forward(params, images)\n        predicted_class\
    \ = jnp.argmax(preds, axis=1)\n        for true_label, pred_label in zip(labels,\
    \ predicted_class):\n            confusion_matrix = confusion_matrix.at[true_label,\
    \ pred_label].add(1)\n    return confusion_matrix\n```\n\nThe confusion matrix\
    \ will help identify patterns in the model's errors, indicating which classes\
    \ the model confuses with each other.\n\n## Visualize Training Progress\n\nTo\
    \ understand how the model improves over time, plot the training and validation\
    \ loss and accuracy for each epoch. We will use `Matplotlib` for visualization.\n\
    \n```python\nimport matplotlib.pyplot as plt\n\ndef plot_learning_curves(training_losses,\
    \ validation_accuracies):\n    \"\"\"Plot the learning curves for loss and accuracy.\"\
    \"\"\n    epochs = range(1, len(training_losses) + 1)\n    # Plot training loss\n\
    \    plt.figure(figsize=(12, 5))\n    plt.subplot(1, 2, 1)\n    plt.plot(epochs,\
    \ training_losses, label='Training Loss')\n    plt.xlabel('Epoch')\n    plt.ylabel('Loss')\n\
    \    plt.title('Training Loss Over Time')\n    plt.legend()\n    # Plot validation\
    \ accuracy\n    plt.subplot(1, 2, 2)\n    plt.plot(epochs, validation_accuracies,\
    \ label='Validation Accuracy')\n    plt.xlabel('Epoch')\n    plt.ylabel('Accuracy')\n\
    \    plt.title('Validation Accuracy Over Time')\n    plt.legend()\n    plt.show()\n\
    \n# Example data for demonstration\ntraining_losses = [0.9, 0.7, 0.5, 0.3, 0.2]\
    \  # Dummy loss values\nvalidation_accuracies = [0.70, 0.75, 0.80, 0.85, 0.88]\
    \  # Dummy accuracy values\n# Plot the learning curves\nplot_learning_curves(training_losses,\
    \ validation_accuracies)\n```\n\nThese plots help visualize the trends in loss\
    \ reduction and accuracy improvement during training, providing insight into the\
    \ model's learning process.\n\n## Visualize Confusion Matrix\n\nVisualizing the\
    \ confusion matrix helps in understanding the types of mistakes the model makes.\n\
    \n```python\nimport seaborn as sns\n\ndef plot_confusion_matrix(conf_matrix, class_names):\n\
    \    \"\"\"Plot the confusion matrix using Seaborn.\"\"\"\n    plt.figure(figsize=(10,\
    \ 8))\n    sns.heatmap(conf_matrix, annot=True, fmt=\"d\", cmap=\"Blues\", xticklabels=class_names,\
    \ yticklabels=class_names)\n    plt.xlabel('Predicted Label')\n    plt.ylabel('True\
    \ Label')\n    plt.title('Confusion Matrix')\n    plt.show()\n\n# Example class\
    \ names for Fashion MNIST\nclass_names = [\n    'T-shirt/top', 'Trouser', 'Pullover',\
    \ 'Dress', 'Coat',\n    'Sandal', 'Shirt', 'Sneaker', 'Bag', 'Ankle boot'\n]\n\
    # Compute the confusion matrix\nconf_matrix = compute_confusion_matrix(trained_params,\
    \ test_ds, num_classes=10)\n# Plot the confusion matrix\nplot_confusion_matrix(conf_matrix,\
    \ class_names)\n```\n\nThe heatmap representation of the confusion matrix reveals\
    \ which classes the model struggles to distinguish, indicating areas for potential\
    \ improvement.\n\n## Automating Evaluation after each Epoch\n\nTo monitor the\
    \ model's learning progress systematically, integrate evaluation and visualization\
    \ within the training loop.\n\n```python\ndef train_and_evaluate(train_ds, test_ds,\
    \ params, num_epochs):\n    training_losses = []\n    validation_accuracies =\
    \ []\n    for epoch in range(num_epochs):\n        # Training phase\n        epoch_loss\
    \ = 0\n        for batch in train_ds:\n            images, labels = batch\n  \
    \          grads = jax.grad(cross_entropy_loss)(params, images, labels)\n    \
    \        params = sgd_update(params, grads, learning_rate)\n            batch_loss\
    \ = cross_entropy_loss(params, images, labels)\n            epoch_loss += batch_loss\n\
    \        # Log the training loss\n        training_losses.append(epoch_loss)\n\
    \        # Evaluation phase\n        accuracy = compute_accuracy(params, test_ds)\n\
    \        validation_accuracies.append(accuracy)\n        # Print epoch summary\n\
    \        print(f\"Epoch {epoch + 1}, Loss: {epoch_loss}, Validation Accuracy:\
    \ {accuracy * 100:.2f}%\")\n    # Plot learning curves after training\n    plot_learning_curves(training_losses,\
    \ validation_accuracies)\n    # Compute and plot the confusion matrix after the\
    \ final epoch\n    conf_matrix = compute_confusion_matrix(params, test_ds, num_classes=10)\n\
    \    plot_confusion_matrix(conf_matrix, class_names)\n    return params\n\n# Train\
    \ the network and evaluate its performance\ntrained_params = train_and_evaluate(train_ds,\
    \ test_ds, params, num_epochs)\n```\n\nThis integrated training and evaluation\
    \ approach enables real-time monitoring of the model's performance, providing\
    \ valuable insights throughout the training process.\n\nWe used metrics like accuracy,\
    \ precision, recall, and confusion matrices, along with visualizing learning curves\
    \ and confusion matrices, to keep a closer eye on how the model was doing. These\
    \ techniques helped us understand how the model was learning and also showed us\
    \ where we could make it better. This made the process of developing the model\
    \ more iterative and data-driven.\n"
  trans: "\n# 评估和可视化模型性能\n\n评估机器学习模型的训练进展对于理解其有效性并识别改进空间至关重要。在基于 `JAX` 的工作流中，如果没有高级库，实现评估指标并可视化模型的训练和测试性能可能会具有挑战性。为解决此问题，我们将使用准确率、精确率、召回率和混淆矩阵等评估指标，以及\
    \ `Matplotlib` 等可视化工具，来跟踪模型的进展并深入了解其在训练期间的行为。本教程演示了如何实现这些技术来监控我们迄今为止开发的 `JAX`\
    \ 模型的性能。\n\n## 概述\n\n在这里，为了有效评估和可视化模型的性能，我们将：\n\n- 实现标准评估指标，如准确率、精确率、召回率和混淆矩阵。\n\
    - 通过随时间绘制损失和准确率等指标来可视化模型的学习曲线。\n- 使用混淆矩阵来识别模型在何处做出正确和错误的预测。\n- 将这些评估技术集成到 `JAX`\
    \ 训练和测试工作流中。\n\n## 实现评估指标\n\n开始时，我们将实现常见的评估指标，重点关注准确率、精确率、召回率和混淆矩阵计算。\n\n```python\n\
    import jax.numpy as jnp\n\ndef compute_accuracy(params, test_ds):\n    \"\"\"\
    Calculate the accuracy of the model on the test dataset.\"\"\"\n    correct =\
