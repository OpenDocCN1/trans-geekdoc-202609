    数据加载在训练管道中经常成为瓶颈，尤其是在处理大型数据集时。缓慢的数据加载会显著阻碍训练过程，导致 GPU 利用率低下和训练时间增加。为了解决这个问题，我们需要一个实用的解决方案来高效加载大型数据集、实时预处理它们，并将它们馈送到训练循环中。在本教程中，我们将使用
    `TensorFlow Datasets` 实现无缝的数据加载和预处理，使我们能够将数据管道与 `JAX` 集成以训练神经网络。


    ## Overview


    本教程将指导你完成设置 `TFDS` 以使用 `JAX` 高效加载和准备用于训练神经网络的数据的过程，利用 `TensorFlow` 的优化数据处理能力。这种方法使我们能够加载大型数据集、应用必要的转换，并将处理后的数据与
    `JAX` 无缝集成。


    ### Steps

    - 设置 `TensorFlow Datasets` 并选择合适的[content]

