- raw: '  Dealing with In-Place Operations    In the process of migrating code from
    NumPy to Google JAX for the purpose of processing the dataset, one may potentially
    encounter challenges related to in-place operations. The original NumPy code may
    have been designed with a focus on direct array modification for efficiency, such
    as updating weights or applying transformations in place. However, this is due
    to the fact that JAX does not support in-place operations, which is a result of
    its functional programming paradigm that emphasises immutability and pure functions.
    This means operations like array \*= scalar or array\[index\] \= value are incompatible
    with JAX''s just-in-time compilation and automatic differentiation. The challenge
    lies in refactoring the existing code to eliminate in-place operations while maintaining
    functionality and performance.    To resolve this issue, the code must be refactored
    in order to eliminate in-place operations. This can be achieved by adopting functional
    programming techniques. This requires that functions be rewritten in a manner
    that circumvents side effects and returns new arrays in lieu of modifying existing
    ones. As a result, the code becomes compatible with JAX''s requirements, thereby
    enabling the use of JIT compilation and automatic differentiation. It is essential
    to exercise meticulous attention to the manner in which data is conveyed and modified,
    with the objective of maintaining the integrity of each function as a pure and
    stateless entity.    Understanding In-Place Operations and JAX''s Paradigm   
    In-place operations modify the data directly, changing the state of variables
    or arrays. Examples include assignments like array += value or element-wise updates
    such as array\[i\] \= In contrast, functional programming promotes immutability,
    where data is not altered after it''s created. Functions return new data structures
    based on the input, without side effects. JAX adheres to this paradigm to facilitate
    powerful transformations and optimizations.    Consider a neural network training
    loop, where parameter updates are performed in place:      \# Original NumPy code
    with in-place updates    for param, grad in zip(params, grads):       param \-=
    learning\_rate \* grad      This code modifies param directly, which is not allowed
    in JAX. Attempting to use this in-place operation will result in an error.   
    Refactored Code using Functional Updates    To refactor the code, we create a
    function that computes the updated parameters without modifying the originals:   
      \# JAX-compatible code without in-place updates    def update\_params(params,
    grads, learning\_rate):        return \[param \- learning\_rate \* grad for param,
    grad in zip(params, grads)\]      In the training loop, we reassign the parameters
    using the returned list:      \# Training loop with functional updates    params
    \= initialize\_params()    for epoch in range(num\_epochs):       for x\_batch,
    y\_batch in data\_loader:           grads \= compute\_gradients(params, x\_batch,
    y\_batch)           params \= update\_params(params, grads, learning\_rate)   
      By avoiding in-place modifications, the code complies with JAX''s functional
    approach.    Handling In-Place Array Modifications    Suppose we need to normalize
    data by subtracting the mean and dividing by the standard deviation, modifying
    the array in place:      \# In-place normalization (NumPy code)    data \-= data.mean(axis=0)   
    data /= data.std(axis=0)      Then, refactor this code to avoid in-place operations:   
      \# JAX-compatible normalization    def normalize(data):       mean \= data.mean(axis=0)   
       std \= data.std(axis=0)        return (data \- mean) / std    normalized\_data
    \= normalize(data)      After that, by returning a new array, we maintain immutability.   
    Refactoring Conditional In-Place Updates    In cases where elements are conditionally
    updated, such as clipping values:      \# In-place clipping (NumPy code)    weights\[weights
    \> max\_value\] \= max\_value      Use JAX''s functional operations:      \# JAX-compatible
    clipping    weights \= jnp.minimum(weights, max\_value)      Or, using      weights
    \= jnp.where(weights \> max\_value, max\_value, weights)      These methods create
    a new array without modifying the original.    Avoiding In-Place Accumulations   
    In algorithms involving accumulations, such as summing gradients:      \# In-place
    accumulation (NumPy code)    total\_grad += batch\_grad      We refactor the above
    to:      \# Functional accumulation    total\_grad \= total\_grad \+ batch\_grad   
      Alternatively, use reduction functions:      \# Summing over a list of gradients   
    total\_grad \= jnp.sum(grads\_list, axis=0)      Using ‘jax.ops.index\_update’
    for Indexing Updates    For updating specific indices, the deprecated jax.ops.index\_update
    has been replaced with the at method:      \# Original in-place indexing update
    (NumPy code)    array\[index\] \= value    \# JAX-compatible update    array \=
    array.at\[index\].set(value)      This returns a new array with the specified
    update.    Refactoring Loops with In-Place Modifications    Consider a loop that
    modifies an array in place:      \# In-place modification in loop (NumPy code)   
    for i in range(len(array)):       array\[i\] \*= scale\_factors\[i\]      Now
    refactor it using functional programming:      \# JAX-compatible code    scaled\_array
    \= array \* scale\_factors      By utilizing vectorized operations, we eliminate
    the need for explicit loops and in-place modifications.    By systematically refactoring
    the code in question, the in situ operations may be eliminated, thereby allowing
    for the full utilisation of Google JAX''s features for machine learning projects.
    This approach guarantees that the resulting code is both efficient and scalable,
    and it aligns with modern practices in functional programming.    '
  fmt: "\n# Dealing with In-Place Operations\n\nIn the process of migrating code from\
    \ `NumPy` to `Google JAX` for the purpose of processing the dataset, one may potentially\
    \ encounter challenges related to in-place operations. The original `NumPy` code\
    \ may have been designed with a focus on direct array modification for efficiency,\
    \ such as updating `weights` or applying transformations in place. However, this\
    \ is due to the fact that `JAX` does not support in-place operations, which is\
    \ a result of its functional programming paradigm that emphasises immutability\
    \ and pure functions. This means operations like `array *= scalar` or `array[index]\
    \ = value` are incompatible with `JAX`'s just-in-time compilation and automatic\
    \ differentiation. The challenge lies in refactoring the existing code to eliminate\
    \ in-place operations while maintaining functionality and performance.\n\nTo resolve\
    \ this issue, the code must be refactored in order to eliminate in-place operations.\
    \ This can be achieved by adopting functional programming techniques. This requires\
    \ that functions be rewritten in a manner that circumvents side effects and returns\
    \ new arrays in lieu of modifying existing ones. As a result, the code becomes\
    \ compatible with `JAX`'s requirements, thereby enabling the use of JIT compilation\
    \ and automatic differentiation. It is essential to exercise meticulous attention\
    \ to the manner in which data is conveyed and modified, with the objective of\
    \ maintaining the integrity of each function as a pure and stateless entity.\n\
    \n## Understanding In-Place Operations and JAX's Paradigm\n\nIn-place operations\
    \ modify the data directly, changing the state of variables or arrays. Examples\
    \ include assignments like `array += value` or element-wise updates such as `array[i]\
    \ =`. In contrast, functional programming promotes immutability, where data is\
    \ not altered after it's created. Functions return new data structures based on\
    \ the input, without side effects. `JAX` adheres to this paradigm to facilitate\
    \ powerful transformations and optimizations.\n\nConsider a neural network training\
    \ loop, where parameter updates are performed in place:\n\n```\n# Original NumPy\
    \ code with in-place updates\nfor param, grad in zip(params, grads):\n    param\
    \ -= learning_rate * grad\n```\n\nThis code modifies `param` directly, which is\
    \ not allowed in `JAX`. Attempting to use this in-place operation will result\
    \ in an error.\n\n## Refactored Code using Functional Updates\n\nTo refactor the\
    \ code, we create a function that computes the updated parameters without modifying\
    \ the originals:\n\n```\n# JAX-compatible code without in-place updates\ndef update_params(params,\
    \ grads, learning_rate):\n    return [param - learning_rate * grad for param,\
    \ grad in zip(params, grads)]\n```\n\nIn the training loop, we reassign the parameters\
    \ using the returned list:\n\n```\n# Training loop with functional updates\nparams\
    \ = initialize_params()\nfor epoch in range(num_epochs):\n    for x_batch, y_batch\
    \ in data_loader:\n        grads = compute_gradients(params, x_batch, y_batch)\n\
    \        params = update_params(params, grads, learning_rate)\n```\n\nBy avoiding\
    \ in-place modifications, the code complies with `JAX`'s functional approach.\n\
    \n## Handling In-Place Array Modifications\n\nSuppose we need to normalize data\
    \ by subtracting the mean and dividing by the standard deviation, modifying the\
    \ array in place:\n\n```\n# In-place normalization (NumPy code)\ndata -= data.mean(axis=0)\n\
    data /= data.std(axis=0)\n```\n\nThen, refactor this code to avoid in-place operations:\n\
    \n```\n# JAX-compatible normalization\ndef normalize(data):\n    mean = data.mean(axis=0)\n\
    \    std = data.std(axis=0)\n    return (data - mean) / std\nnormalized_data =\
    \ normalize(data)\n```\n\nAfter that, by returning a new array, we maintain immutability.\n\
    \n## Refactoring Conditional In-Place Updates\n\nIn cases where elements are conditionally\
    \ updated, such as clipping values:\n\n```\n# In-place clipping (NumPy code)\n\
    weights[weights > max_value] = max_value\n```\n\nUse `JAX`'s functional operations:\n\
    \n```\n# JAX-compatible clipping\nweights = jnp.minimum(weights, max_value)\n\
    ```\n\nOr, using\n\n```\nweights = jnp.where(weights > max_value, max_value, weights)\n\
    ```\n\nThese methods create a new array without modifying the original.\n\n##\
    \ Avoiding In-Place Accumulations\n\nIn algorithms involving accumulations, such\
    \ as summing gradients:\n\n```\n# In-place accumulation (NumPy code)\ntotal_grad\
    \ += batch_grad\n```\n\nWe refactor the above to:\n\n```\n# Functional accumulation\n\
    total_grad = total_grad + batch_grad\n```\n\nAlternatively, use reduction functions:\n\
    \n```\n# Summing over a list of gradients\ntotal_grad = jnp.sum(grads_list, axis=0)\n\
    ```\n\n## Using `jax.ops.index_update` for Indexing Updates\n\nFor updating specific\
    \ indices, the deprecated `jax.ops.index_update` has been replaced with the `at`\
    \ method:\n\n```\n# Original in-place indexing update (NumPy code)\narray[index]\
    \ = value\n# JAX-compatible update\narray = array.at[index].set(value)\n```\n\n\
    This returns a new array with the specified update.\n\n## Refactoring Loops with\
    \ In-Place Modifications\n\nConsider a loop that modifies an array in place:\n\
    \n```\n# In-place modification in loop (NumPy code)\nfor i in range(len(array)):\n\
    \    array[i] *= scale_factors[i]\n```\n\nNow refactor it using functional programming:\n\
    \n```\n# JAX-compatible code\nscaled_array = array * scale_factors\n```\n\nBy\
    \ utilizing vectorized operations, we eliminate the need for explicit loops and\
    \ in-place modifications.\n\nBy systematically refactoring the code in question,\
    \ the in situ operations may be eliminated, thereby allowing for the full utilisation\
    \ of `Google JAX`'s features for machine learning projects. This approach guarantees\
    \ that the resulting code is both efficient and scalable, and it aligns with modern\
    \ practices in functional programming.\n"
  trans: "\n# 处理原地操作\n\n在将代码从 `NumPy` 迁移到 `Google JAX` 以处理数据集的过程中，可能会遇到与原地操作相关的挑战。原始的\
    \ `NumPy` 代码可能侧重于直接修改数组以提高效率，例如更新 `weights` 或就地应用转换。然而，这是因为 `JAX` 不支持原地操作，这是其强调不可变性和纯函数的函数式编程范式的结果。这意味着像\
    \ `array *= scalar` 或 `array[index] = value` 这样的操作与 `JAX` 的即时编译和自动微分不兼容。挑战在于重构现有代码以消除原地操作，同时保持功能和性能。\n\
    \n为了解决此问题，必须重构代码以消除原地操作。这可以通过采用函数式编程技术来实现。这要求函数以规避副作用的方式重写，并在不修改现有内容的情况下返回新数组。因此，代码变得与\
    \ `JAX` 的要求兼容，从而能够使用 JIT 编译和自动微分。必须细致关注数据传递和修改的方式，目标是保持每个函数作为纯粹且无状态实体的完整性。\n\n\
    ## 理解原地操作与 JAX 的范式\n\n原地操作直接修改数据，改变变量或数组的状态。示例包括像 `array += value` 这样的赋值或像 `array[i]\
    \ =` 这样的逐元素更新。相比之下，函数式编程提倡不可变性，即数据在创建后不会被更改。函数基于输入返回新的数据结构，且无副作用。`JAX` 遵循这一范式以实现强大的转换和优化。\n\
    \n考虑一个神经网络训练循环，其中参数更新是就地进行的：\n\n```\n# Original NumPy code with in-place updates\n\
    for param, grad in zip(params, grads):\n    param -= learning_rate * grad\n```\n\
    \n此代码直接修改 `param`，这在 `JAX` 中是不允许的。尝试使用此原地操作将导致错误。\n\n## 使用函数式更新重构代码\n\n为重构代码，我们创建一个函数来计算更新后的参数，而不修改原始参数：\n\
    \n```\n# JAX-compatible code without in-place updates\ndef update_params(params,\
    \ grads, learning_rate):\n    return [param - learning_rate * grad for param,\
    \ grad in zip(params, grads)]\n```\n\n在训练循环中，我们使用返回的列表重新分配参数：\n\n```\n# Training\
    \ loop with functional updates\nparams = initialize_params()\nfor epoch in range(num_epochs):\n\
    \    for x_batch, y_batch in data_loader:\n        grads = compute_gradients(params,\
    \ x_batch, y_batch)\n        params = update_params(params, grads, learning_rate)\n\
    ```\n\n通过避免原地修改，代码符合 `JAX` 的函数式方法。\n\n## 处理原地数组修改\n\n假设我们需要通过减去均值并除以标准差来归一化数据，并就地修改数组：\n\
    \n```\n# In-place normalization (NumPy code)\ndata -= data.mean(axis=0)\ndata\
    \ /= data.std(axis=0)\n```\n\n然后，重构此代码以避免原地操作：\n\n```\n# JAX-compatible normalization\n\
    def normalize(data):\n    mean = data.mean(axis=0)\n    std = data.std(axis=0)\n\
    \    return (data - mean) / std\nnormalized_data = normalize(data)\n```\n\n之后，通过返回新数组，我们保持不可变性。\n\
    \n## 重构条件原地更新\n\n在元素被条件更新的情况下，例如裁剪值：\n\n```\n# In-place clipping (NumPy code)\n\
    weights[weights > max_value] = max_value\n```\n\n使用 `JAX` 的函数式操作：\n\n```\n# JAX-compatible\
    \ clipping\nweights = jnp.minimum(weights, max_value)\n```\n\n或者，使用\n\n```\nweights\
    \ = jnp.where(weights > max_value, max_value, weights)\n```\n\n这些方法在不修改原始内容的情况下创建新数组。\n\
    \n## 避免原地累积\n\n在涉及累积的算法中，例如求和梯度：\n\n```\n# In-place accumulation (NumPy code)\n\
    total_grad += batch_grad\n```\n\n我们将上述内容重构为：\n\n```\n# Functional accumulation\n\
    total_grad = total_grad + batch_grad\n```\n\n或者，使用归约函数：\n\n```\n# Summing over\
    \ a list of gradients\ntotal_grad = jnp.sum(grads_list, axis=0)\n```\n\n## 使用\
    \ `jax.ops.index_update` 进行索引更新\n\n对于更新特定索引，已弃用的 `jax.ops.index_update` 已被 `at`\
    \ 方法取代：\n\n```\n# Original in-place indexing update (NumPy code)\narray[index]\
    \ = value\n# JAX-compatible update\narray = array.at[index].set(value)\n```\n\n\
    这会返回具有指定更新的新数组。\n\n## 重构具有原地修改的循环\n\n考虑一个就地修改数组的循环：\n\n```\n# In-place modification\
    \ in loop (NumPy code)\nfor i in range(len(array)):\n    array[i] *= scale_factors[i]\n\
    ```\n\n现在使用函数式编程重构它：\n\n```\n# JAX-compatible code\nscaled_array = array * scale_factors\n\
    ```\n\n通过利用向量化操作，我们消除了对显式循环和原地修改的需求。\n\n通过系统地重构相关代码，可以消除原地操作，从而允许充分利用 `Google\
    \ JAX` 在机器学习项目中的功能。这种方法保证了生成的代码既高效又可扩展，并符合函数式编程的现代实践。\n"
