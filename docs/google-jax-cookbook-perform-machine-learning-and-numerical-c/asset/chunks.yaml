  fmt: "\n# Training with Penzai\n\nManaging machine learning experiments and tracking\
    \ hyperparameters, metrics, and results systematically is crucial for optimizing\
    \ model performance and ensuring reproducibility. When working with multiple models\
    \ or tuning hyperparameters, it can be challenging to keep track of different\
    \ runs and configurations manually. To address this issue, we will use Penzai,\
    \ a tool designed for experiment tracking and management. In this recipe, we introduce\
    \ Penzai and demonstrate how to integrate it into our JAX-based workflow, allowing\
    \ us to log hyperparameters, metrics, and other important details during training,\
    \ thus making experiments easier to monitor, compare, and reproduce.\n\n## About\
    \ Penzai\n\nPenzai is a lightweight and flexible tool for managing machine learning\
    \ experiments, enabling the tracking of hyperparameters, metrics, and results.\
    \ The process involves:\n- Installing Penzai and setting up a project.\n- Logging\
    \ hyperparameters and metrics during the training process.\n- Using Penzai's visualization\
    \ and comparison tools to analyze different experiment runs.\n- Ensuring reproducibility\
    \ by saving all relevant experiment details.\n\n## Installing Penzai\n\nJust a\
    \ heads-up, you'll want to make sure Penzai is installed on your system. If you\
    \ don't have it yet, you can add it using:\n\n```\npip install penzai\n```\n\n\
    Next, initialize a new Penzai project. This step creates a configuration file\
    \ to manage experiment metadata.\n\n```\npenzai init --project-name \"Fashion\
    \ MNIST Training\"\n```\n\nThis command sets up a new project named \"Fashion\
    \ MNIST Training\" and creates the necessary configuration files. You can also\
    \ set up storage backends or cloud integration options if required.\n\n## Configuring\
    \ Penzai in Training Script\n\nTo integrate Penzai into your JAX training script,\
    \ start by importing the `penzai` module and initializing a new experiment run.\n\
    \n```\nimport penzai\n# Initialize Penzai\npenzai.init(project=\"Fashion MNIST\
    \ Training\")\n# Start a new experiment run\nrun = penzai.start_run(run_name=\"\
    Baseline Model Training\")\n```\n\nThe `start_run` function begins a new experiment,\
    \ allowing us to log hyperparameters, metrics, and results associated with this\
    \ run.\n\n## Logging Hyperparameters\n\nBefore starting the training, log the\
    \ relevant hyperparameters such as `learning_rate`, `batch_size`, and `num_epochs`.\n\
    \n```\n# Hyperparameters\nlearning_rate = 0.01\nbatch_size = 128\nnum_epochs =\
    \ 10\n# Log hyperparameters\nrun.log_hyperparams({\n    \"learning_rate\": learning_rate,\n\
    \    \"batch_size\": batch_size,\n    \"num_epochs\": num_epochs\n})\n```\n\n\
    This step ensures that the key settings for the experiment are recorded, enabling\
    \ you to refer back to them when reviewing or reproducing the run.\n\n## Logging\
    \ Training Metrics\n\nAs the training progresses, log important metrics like loss\
    \ and accuracy at each epoch. This allows Penzai to track the performance of the\
    \ model over time.\n\n```\ndef train_network_with_tracking(train_ds, params, num_epochs):\n\
    \    for epoch in range(num_epochs):\n        epoch_loss = 0\n        for batch\
    \ in train_ds:\n            images, labels = batch\n            # Compute gradients\n\
    \            grads = jax.grad(cross_entropy_loss)(params, images, labels)\n  \
    \          # Update parameters\n            params = sgd_update(params, grads,\
    \ learning_rate)\n            # Compute batch loss\n            batch_loss = cross_entropy_loss(params,\
    \ images, labels)\n            epoch_loss += batch_loss\n        # Log the epoch\
    \ loss\n        run.log_metric(\"epoch_loss\", epoch_loss, step=epoch)\n     \
    \   # Optionally, log additional metrics\n        accuracy = compute_accuracy(params,\
    \ test_ds)\n        run.log_metric(\"accuracy\", accuracy, step=epoch)\n     \
    \   print(f\"Epoch {epoch + 1}, Loss: {epoch_loss}, Accuracy: {accuracy * 100:.2f}%\"\
    )\n    return params\n# Train the network while logging metrics\ntrained_params\
    \ = train_network_with_tracking(train_ds, params, num_epochs)\n```\n\nBy logging\
    \ metrics such as `loss` and `accuracy` at each epoch, you can visualize the model's\
    \ learning curve in Penzai's dashboard.\n\n## Visualizing and Comparing Experiments\n\
    \nAfter logging metrics, use Penzai's web interface to analyze the training progress,\
    \ compare different runs, and observe trends.\n\nOpen the Penzai dashboard:\n\n\
    ```\npenzai ui\n```\n\nThen, view the experiments listed under \"Fashion MNIST\
    \ Training\" and compare metrics such as `loss` and `accuracy` across different\
    \ runs. You can also use built-in tools to create plots that show how metrics\
    \ evolve over time or how different hyperparameter settings affect the results.\n\
    \n## Logging Model Artifacts for Reproducibility\n\nApart from tracking metrics\
    \ and hyperparameters, it is important to save model artifacts (e.g., trained\
    \ parameters) for reproducibility and further analysis.\n\n```\n# Save trained\
    \ model parameters\nmodel_artifact_path = \"model_params.pkl\"\nwith open(model_artifact_path,\
    \ \"wb\") as f:\n    import pickle\n    pickle.dump(trained_params, f)\n# Log\
    \ the model artifact\nrun.log_artifact(model_artifact_path)\n```\n\nLogging artifacts\
    \ like the trained model's weights makes sure that you can recreate the experiment\
    \ or make some improvements if needed.\n\n## Ending Experiment Run\n\nAfter completing\
    \ the training and logging the necessary information, make sure to end the experiment\
    \ run.\n\n```\nrun.end()\n```\n\nThis finalizes the current experiment, allowing\
    \ you to start a new run or analyze the completed experiments in Penzai.\n\nBy\
    \ incorporating Penzai into the training process, we efficiently managed our experiments,\
    \ systematically tracked hyperparameters, and logged metrics for evaluating model\
    \ performance. Penzai's ability to visualize training progress, compare different\
    \ runs, and save model artifacts facilitates reproducibility and optimization\
    \ of machine learning projects.\n"
  trans: "\n# 使用 Penzai 进行训练\n\n管理机器学习实验并系统地跟踪超参数、指标和结果，对于优化模型性能和确保可重复性至关重要。在处理多个模型或调优超参数时，手动跟踪不同的运行和配置可能具有挑战性。为了解决这个问题，我们将使用\
    \ Penzai，这是一款专为实验跟踪和管理而设计的工具。在本教程中，我们介绍 Penzai 并演示如何将其集成到基于 JAX 的工作流程中，使我们能够在训练期间记录超参数、指标和其他重要细节，从而使实验更易于监控、比较和重现。\n\
    \n## 关于 Penzai\n\nPenzai 是一个轻量级且灵活的工具，用于管理机器学习实验，可实现对超参数、指标和结果的跟踪。该过程包括：\n-  \
    \ 安装 Penzai 并设置项目。\n-   在训练过程中记录超参数和指标。\n-   使用 Penzai 的可视化和比较工具来分析不同的实验运行。\n\
    -   通过保存所有相关的实验细节来确保可重复性。\n\n## 安装 Penzai\n\n先提醒一下，您需要确保 Penzai 已安装在您的系统上。如果您还没有，可以使用以下命令添加：\n\
    \n```\npip install penzai\n```\n\n接下来，初始化一个新的 Penzai 项目。此步骤会创建配置文件以管理实验元数据。\n\n\
    ```\npenzai init --project-name \"Fashion MNIST Training\"\n```\n\n此命令设置名为 \"\
    Fashion MNIST Training\" 的新项目并创建必要的配置文件。如果需要，您还可以设置存储后端或云集成选项。\n\n## 在训练脚本中配置\
    \ Penzai\n\n要将 Penzai 集成到您的 JAX 训练脚本中，请先导入 `penzai` 模块并初始化新的实验运行。\n\n```\nimport\
    \ penzai\n# Initialize Penzai\npenzai.init(project=\"Fashion MNIST Training\"\
    )\n# Start a new experiment run\nrun = penzai.start_run(run_name=\"Baseline Model\
    \ Training\")\n```\n\n`start_run` 函数开始一个新的实验，使我们能够记录与此运行相关的超参数、指标和结果。\n\n## 记录超参数\n\
    \n在开始训练之前，记录相关的超参数，例如 `learning_rate`、`batch_size` 和 `num_epochs`。\n\n```\n# Hyperparameters\n\
    learning_rate = 0.01\nbatch_size = 128\nnum_epochs = 10\n# Log hyperparameters\n\
    run.log_hyperparams({\n    \"learning_rate\": learning_rate,\n    \"batch_size\"\
    : batch_size,\n    \"num_epochs\": num_epochs\n})\n```\n\n此步骤可确保实验的关键设置被记录下来，以便在审阅或重现运行时可以回溯参考。\n\
    \n## 记录训练指标\n\n随着训练的进行，在每个 epoch 记录重要的指标，如 loss 和 accuracy。这使 Penzai 能够随时间跟踪模型的性能。\n\
    \n```\ndef train_network_with_tracking(train_ds, params, num_epochs):\n    for\
    \ epoch in range(num_epochs):\n        epoch_loss = 0\n        for batch in train_ds:\n\
    \            images, labels = batch\n            # Compute gradients\n       \
    \     grads = jax.grad(cross_entropy_loss)(params, images, labels)\n         \
    \   # Update parameters\n            params = sgd_update(params, grads, learning_rate)\n\
    \            # Compute batch loss\n            batch_loss = cross_entropy_loss(params,\
    \ images, labels)\n            epoch_loss += batch_loss\n        # Log the epoch\
    \ loss\n        run.log_metric(\"epoch_loss\", epoch_loss, step=epoch)\n     \
    \   # Optionally, log additional metrics\n        accuracy = compute_accuracy(params,\
    \ test_ds)\n        run.log_metric(\"accuracy\", accuracy, step=epoch)\n     \
    \   print(f\"Epoch {epoch + 1}, Loss: {epoch_loss}, Accuracy: {accuracy * 100:.2f}%\"\
    )\n    return params\n# Train the network while logging metrics\ntrained_params\
    \ = train_network_with_tracking(train_ds, params, num_epochs)\n```\n\n通过在每个 epoch\
    \ 记录 `loss` 和 `accuracy` 等指标，您可以在 Penzai 的仪表板中可视化模型的学习曲线。\n\n## 可视化和比较实验\n\n记录指标后，使用\
    \ Penzai 的 Web 界面分析训练进度、比较不同的运行并观察趋势。\n\n打开 Penzai 仪表板：\n\n```\npenzai ui\n```\n\
    \n然后，查看列在 \"Fashion MNIST Training\" 下的实验，并比较不同运行中的 `loss` 和 `accuracy` 等指标。您还可以使用内置工具创建图表，显示指标如何随时间演变或不同的超参数设置如何影响结果。\n\
    \n## 记录模型产物以实现可重复性\n\n除了跟踪指标和超参数外，保存模型产物（例如训练好的参数）以实现可重复性和进一步分析也很重要。\n\n```\n\
    # Save trained model parameters\nmodel_artifact_path = \"model_params.pkl\"\n\
    with open(model_artifact_path, \"wb\") as f:\n    import pickle\n    pickle.dump(trained_params,\
    \ f)\n# Log the model artifact\nrun.log_artifact(model_artifact_path)\n```\n\n\
    记录训练好的模型权重等产物可确保您能够重现实验或在需要时进行改进。\n\n## 结束实验运行\n\n完成训练并记录必要信息后，请确保结束实验运行。\n\n\
    ```\nrun.end()\n```\n\n这将完成当前实验，使您能够开始新的运行或在 Penzai 中分析已完成的实验。\n\n通过将 Penzai 集成到训练过程中，我们高效地管理了实验，系统地跟踪了超参数，并记录了用于评估模型性能的指标。Penzai\
    \ 可视化训练进度、比较不同运行并保存模型产物的能力促进了机器学习项目的可重复性和优化。\n"
