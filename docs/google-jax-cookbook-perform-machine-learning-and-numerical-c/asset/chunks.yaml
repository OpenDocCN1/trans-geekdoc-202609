  fmt: '

    ## Summary

    In summary, this chapter focused on the transition from `NumPy` to Google `JAX`
    for machine learning tasks. It began by demonstrating how to accelerate existing
    `NumPy` code by converting to `JAX` using just-in-time compilation and automatic
    differentiation. This resulted in significant performance gains, allowing faster
    neural network training without having to re-write the code. Next, the challenges
    posed by unsupported `NumPy` functions in `JAX` were addressed. We also looked
    at old-fashioned ways of replacing these functions while still preserving the
    original functionality of the code. This way, compatibility was ensured and a
    seamless integration of `JAX` into existing workflows was possible.


    An important topic was `JAX`''s random generation, which differs from `NumPy`.
    Here we were able to learn about the effective use of `PRNG` keys and the reproducibility
    of results. We also tackled the problem of in-place operations. These are not
    supported in `JAX` due to its functional programming paradigm. The code was refactored
    to eliminate these operations, adopting a style that avoids side effects and emphasizes
    immutability. This refactoring not only made the code compatible with `JAX`, but
    also improved its clarity and maintainability.


    Finally, we had to ensure numerical stability during the transition from `NumPy`.
    One source of instability was identified as differences in type promotion semantics
    between the two libraries. Stable computations were achieved by explicitly managing
    data types and taking care with operations that could lead to unintended type
    promotions. Techniques such as data type specification, careful handling of division
    and logarithms, and gradient clipping were used to avoid problems such as `NaN`''s
    and unbounded values in training.


    # Chapter 2: Profiling Computation and Device Memory


    ## Overview

    This chapter shifts the focus to the profiling of computation and the management
    of device memory when utilising Google `JAX` for machine learning tasks. The measurement
    of `JAX` function execution times enables the evaluation of computational efficiency
    and the informed decision-making necessary to enhance processing speed, particularly
    when dealing with data sets of a similar nature to that of `Fashion-MNIST`.


    Monitoring `GPU` memory usage is also recommended in order to prevent out-of-memory
    errors and ensure optimal utilization of hardware resources. This section explores
    memory consumption patterns in order to ascertain their efficacy in managing computational
    workloads. This understanding is essential for scaling up models and handling
    larger datasets without compromising performance. Subsequently, we examine techniques
    for representing computation graphs in order to obtain a more profound comprehension
    of the underlying operations and data flow within `JAX` models. The visualization
    of these graphs facilitates a more comprehensive understanding of the dependencies
    and structure of computations, which is beneficial for debugging and optimization
    efforts. Another crucial topic addressed in this chapter is the optimization of
    batch sizes. The adjustment of batch sizes has the potential to result in notable
    enhancements in training efficiency and resource utilization.


    Finally, the chapter introduces gradient checkpointing as a technique to reduce
    the memory footprint during the training of a model. By saving intermediate activations
    in a strategic manner and recomputing them during the backward pass, gradient
    checkpointing enables the training of deeper and more complex models without exceeding
    memory limitations.

    '
  trans: '

    ## 摘要

    总之，本章重点关注从 `NumPy` 到 Google `JAX` 在机器学习任务中的迁移。它首先演示了如何通过即时编译和自动微分将现有 `NumPy` 代码转换为
    `JAX` 来加速代码。这带来了显著的性能提升，使得神经网络训练更快，而无需重写代码。接下来，解决了 `JAX` 中不支持的 `NumPy` 函数带来的挑战。我们还研究了在仍保留代码原始功能的同时替换这些函数的传统方式。这样确保了兼容性，并使
    `JAX` 能够无缝集成到现有工作流程中。


    一个重要主题是 `JAX` 的随机数生成，它与 `NumPy` 不同。在这里，我们能够学习 `PRNG` 键的有效使用以及结果的可重复性。我们还解决了原地操作的问题。由于其函数式编程范式，`JAX`
    不支持这些操作。代码被重构以消除这些操作，采用避免副作用并强调不可变性的风格。这种重构不仅使代码与 `JAX` 兼容，还提高了其清晰度和可维护性。


    最后，在从 `NumPy` 迁移过程中，我们必须确保数值稳定性。一种不稳定性的来源被确定为两个库之间类型提升语义的差异。通过显式管理数据类型并谨慎处理可能导致非预期类型提升的操作，实现了稳定的计算。诸如数据类型指定、谨慎处理除法和对数以及梯度裁剪等技术被用来避免训练中出现
    `NaN` 和无界值等问题。


    # 第 2 章：计算分析与设备内存管理


    ## 概述

    本章将重点转向在利用 Google `JAX` 进行机器学习任务时计算的分析以及设备内存的管理。测量 `JAX` 函数的执行时间能够评估计算效率，并为提高处理速度提供有据的决策依据，尤其是在处理与
    `Fashion-MNIST` 类似的数据集时。


    监控 `GPU` 内存使用情况也有助于防止内存不足错误并确保硬件资源的最佳利用。本节探讨内存消耗模式，以确定其在管理计算工作负载方面的有效性。这种理解对于扩展模型并处理更大的数据集而不影响性能至关重要。随后，我们研究表示计算图的技术，以便更深入地理解
    `JAX` 模型中底层操作和数据流。这些图的可视化有助于更全面地理解计算的依赖关系和结构，这对调试和优化工作有益。本章讨论的另一个关键主题是批大小的优化。调整批大小有可能显著提高训练效率和资源利用率。


    最后，本章介绍了梯度检查点作为在模型训练期间减少内存占用的一种技术。通过以策略性的方式保存中间激活，并在反向传播期间重新计算它们，梯度检查点使得在不超出内存限制的情况下训练更深、更复杂的模型成为可能。

    '
