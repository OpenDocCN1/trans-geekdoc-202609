- raw: '  Inspecting Intermediate Values in JIT-Compiled Functions    When developing
    neural networks with Google JAX on the Fashion-MNIST dataset, debugging can become
    challenging, especially when functions are wrapped with jit for just-in-time compilation.
    Traditional debugging methods like inserting print statements do not work within
    functions because JAX traces the function to build a computation graph, and side-effecting
    operations like print are not executed during tracing. This makes it difficult
    to inspect intermediate values and understand the behavior of the code during
    execution. The challenge is to find effective methods to inspect runtime values
    within functions to facilitate debugging and ensure that the model functions correctly.   
    To overcome the difficulty of inspecting intermediate values in functions, we
    can utilize JAX''s debugging tools, specifically which allows printing values
    during JAX transformations. Additionally, alternative methods like returning intermediate
    values or using host callbacks can be employed to inspect runtime values successfully.
    These techniques enable us to debug functions wrapped with jit and gain insights
    into the internal computations of our models.    Understanding Why ‘print’ Statements
    Fail?    Within functions, standard Python print statements are ignored because
    JAX operates by tracing functions to create static computation graphs. Side effects
    like print do not affect the computation graph and are therefore omitted during
    tracing.    Following is a quick example:      import jax    import jax.numpy
    as jnp    @jax.jit    def compute(x):       y \= x \* 2       print(f"Intermediate
    value y: {y}")       return y    result \= compute(3.0)      This code will not
    display the intermediate value of y because the print statement is not executed
    within the function.    Using ‘jax.debug.print’ for Debugging    Below is the
    refactored code using jax.debug.print      import jax    import jax.numpy as jnp   
    from jax import debug    @jax.jit    def compute(x):       y \= x \* 2       debug.print("Intermediate
    value y: {}", y)       return y    result \= compute(3.0)      When running this
    code, the output will be:      Intermediate value y: 6.0      Here, the debug.print
    function accepts a format string and variables to display. It operates correctly
    within functions, allowing us to inspect intermediate values.    Applying ‘jax.debug.print’
    in Model    Suppose we want to inspect intermediate activations within the neural
    network''s forward pass. Following is a quick example:      def forward\_pass(params,
    x):        W1, b1, W2, b2 \= params        z1 \= jnp.dot(x, W1) \+ b1       a1
    \= jnp.maximum(0, z1)  # ReLU activation       debug.print("Activation a1 mean:
    {}", jnp.mean(a1))        z2 \= jnp.dot(a1, W2) \+ b2       y\_pred \= jax.nn.softmax(z2)   
       return y\_pred    forward\_pass\_jit \= jax.jit(forward\_pass)      By running
    forward\_pass\_jit(params, we can observe the mean value of a1 during execution.   
    Conditional Debugging    We can add conditions to the debug.print function to
    limit output to specific cases. Following is a quick example:      def forward\_pass(params,
    x):        W1, b1, W2, b2 \= params        z1 \= jnp.dot(x, W1) \+ b1       a1
    \= jnp.maximum(0, z1)       max\_a1 \= jnp.max(a1)        debug.print("Max of
    a1: {}", max\_a1, where=max\_a1 \> 10.0)        z2 \= jnp.dot(a1, W2) \+ b2   
       y\_pred \= jax.nn.softmax(z2)       return y\_pred      This will print the
    maximum value of a1 only when it exceeds helping to identify abnormal activations.   
    Using Host Callbacks with ‘jax.experimental.host\_callback’    For more advanced
    debugging, jax.experimental.host\_callback.id\_print can be used. Following is
    a quick example:      from jax.experimental import host\_callback as hcb    @jax.jit   
    def compute(x):       y \= x \* 2       hcb.id\_print(y, result=False, what="Intermediate
    value y")       return y    result \= compute(3.0)      This method sends the
    value from the device to the host and prints it, providing a way to inspect values
    during execution.    By utilizing host callbacks, and alternative methods like
    returning intermediate values, we can effectively inspect runtime values within
    functions. These techniques enhance our ability to debug and understand the internal
    computations of our models.    '
  fmt: "\n# Inspecting Intermediate Values in JIT-Compiled Functions\n\nWhen developing\
    \ neural networks with Google JAX on the Fashion-MNIST dataset, debugging can\
    \ become challenging, especially when functions are wrapped with `jit` for just-in-time\
    \ compilation. Traditional debugging methods like inserting `print` statements\
    \ do not work within functions because JAX traces the function to build a computation\
    \ graph, and side-effecting operations like `print` are not executed during tracing.\
    \ This makes it difficult to inspect intermediate values and understand the behavior\
    \ of the code during execution. The challenge is to find effective methods to\
    \ inspect runtime values within functions to facilitate debugging and ensure that\
    \ the model functions correctly.\n\nTo overcome the difficulty of inspecting intermediate\
    \ values in functions, we can utilize JAX's debugging tools, specifically which\
    \ allows printing values during JAX transformations. Additionally, alternative\
    \ methods like returning intermediate values or using host callbacks can be employed\
    \ to inspect runtime values successfully. These techniques enable us to debug\
    \ functions wrapped with `jit` and gain insights into the internal computations\
    \ of our models.\n\n## Understanding Why `print` Statements Fail\n\nWithin functions,\
    \ standard Python `print` statements are ignored because JAX operates by tracing\
    \ functions to create static computation graphs. Side effects like `print` do\
    \ not affect the computation graph and are therefore omitted during tracing.\n\
    \nFollowing is a quick example:\n\n```\nimport jax\nimport jax.numpy as jnp\n\
    @jax.jit\ndef compute(x):\n    y = x * 2\n    print(f\"Intermediate value y: {y}\"\
    )\n    return y\nresult = compute(3.0)\n```\n\nThis code will not display the\
    \ intermediate value of `y` because the `print` statement is not executed within\
    \ the function.\n\n## Using `jax.debug.print` for Debugging\n\nBelow is the refactored\
    \ code using `jax.debug.print`:\n\n```\nimport jax\nimport jax.numpy as jnp\n\
    from jax import debug\n@jax.jit\ndef compute(x):\n    y = x * 2\n    debug.print(\"\
    Intermediate value y: {}\", y)\n    return y\nresult = compute(3.0)\n```\n\nWhen\
    \ running this code, the output will be:\n\nIntermediate value y: 6.0\n\nHere,\
    \ the `debug.print` function accepts a format string and variables to display.\
    \ It operates correctly within functions, allowing us to inspect intermediate\
    \ values.\n\n### Applying `jax.debug.print` in Model\n\nSuppose we want to inspect\
    \ intermediate activations within the neural network's forward pass. Following\
    \ is a quick example:\n\n```\ndef forward_pass(params, x):\n    W1, b1, W2, b2\
    \ = params\n    z1 = jnp.dot(x, W1) + b1\n    a1 = jnp.maximum(0, z1)  # ReLU\
    \ activation\n    debug.print(\"Activation a1 mean: {}\", jnp.mean(a1))\n    z2\
    \ = jnp.dot(a1, W2) + b2\n    y_pred = jax.nn.softmax(z2)\n    return y_pred\n\
    forward_pass_jit = jax.jit(forward_pass)\n```\n\nBy running `forward_pass_jit(params`,\
    \ we can observe the mean value of `a1` during execution.\n\n### Conditional Debugging\n\
    \nWe can add conditions to the `debug.print` function to limit output to specific\
    \ cases. Following is a quick example:\n\n```\ndef forward_pass(params, x):\n\
    \    W1, b1, W2, b2 = params\n    z1 = jnp.dot(x, W1) + b1\n    a1 = jnp.maximum(0,\
    \ z1)\n    max_a1 = jnp.max(a1)\n    debug.print(\"Max of a1: {}\", max_a1, where=max_a1\
    \ > 10.0)\n    z2 = jnp.dot(a1, W2) + b2\n    y_pred = jax.nn.softmax(z2)\n  \
    \  return y_pred\n```\n\nThis will print the maximum value of `a1` only when it\
    \ exceeds helping to identify abnormal activations.\n\n## Using Host Callbacks\
    \ with `jax.experimental.host_callback`\n\nFor more advanced debugging, `jax.experimental.host_callback.id_print`\
    \ can be used. Following is a quick example:\n\n```\nfrom jax.experimental import\
    \ host_callback as hcb\n@jax.jit\ndef compute(x):\n    y = x * 2\n    hcb.id_print(y,\
    \ result=False, what=\"Intermediate value y\")\n    return y\nresult = compute(3.0)\n\
    ```\n\nThis method sends the value from the device to the host and prints it,\
    \ providing a way to inspect values during execution.\n\nBy utilizing host callbacks,\
    \ and alternative methods like returning intermediate values, we can effectively\
    \ inspect runtime values within functions. These techniques enhance our ability\
    \ to debug and understand the internal computations of our models.\n"
  trans: "\n# 在 JIT 编译函数中检查中间值\n\n在 Fashion-MNIST 数据集上使用 Google JAX 开发神经网络时，调试可能会变得具有挑战性，尤其是在函数被\
    \ `jit` 用于即时编译时。传统的调试方法，如在函数中插入 `print` 语句不起作用，因为 JAX 会追踪函数以构建计算图，而像 `print` 这样的副作用操作在追踪期间不会被执行。这使得在执行期间检查中间值并理解代码的行为变得困难。挑战在于找到有效的方法来检查函数内的运行时值以促进调试并确保模型正常运行。\n\
    \n为克服在函数中检查中间值的困难，我们可以利用 JAX 的调试工具，特别是允许在 JAX 转换期间打印值的工具。此外，还可以采用返回中间值或使用主机回调等替代方法来成功检查运行时值。这些技术使我们能够调试用\
    \ `jit` 包装的函数并深入了解模型的内部计算。\n\n## 理解为什么 `print` 语句会失败\n\n在函数内部，标准的 Python `print`\
    \ 语句会被忽略，因为 JAX 通过追踪函数来创建静态计算图。像 `print` 这样的副作用不会影响计算图，因此在追踪期间被省略。\n\n下面是一个快速示例：\n\
    \n```\nimport jax\nimport jax.numpy as jnp\n@jax.jit\ndef compute(x):\n    y =\
    \ x * 2\n    print(f\"Intermediate value y: {y}\")\n    return y\nresult = compute(3.0)\n\
    ```\n\n这段代码不会显示 `y` 的中间值，因为 `print` 语句在函数内部不会被执行。\n\n## 使用 `jax.debug.print` 进行调试\n\
    \n下面是使用 `jax.debug.print` 重构后的代码：\n\n```\nimport jax\nimport jax.numpy as jnp\n\
    from jax import debug\n@jax.jit\ndef compute(x):\n    y = x * 2\n    debug.print(\"\
    Intermediate value y: {}\", y)\n    return y\nresult = compute(3.0)\n```\n\n运行此代码时，输出将为：\n\
    \nIntermediate value y: 6.0\n\n这里，`debug.print` 函数接受格式字符串和要显示的变量。它在函数内部正确运行，使我们能够检查中间值。\n\
    \n### 在模型中应用 `jax.debug.print`\n\n假设我们想在神经网络的前向传播中检查中间激活值。下面是一个快速示例：\n\n```\n\
    def forward_pass(params, x):\n    W1, b1, W2, b2 = params\n    z1 = jnp.dot(x,\
    \ W1) + b1\n    a1 = jnp.maximum(0, z1)  # ReLU activation\n    debug.print(\"\
    Activation a1 mean: {}\", jnp.mean(a1))\n    z2 = jnp.dot(a1, W2) + b2\n    y_pred\
    \ = jax.nn.softmax(z2)\n    return y_pred\nforward_pass_jit = jax.jit(forward_pass)\n\
    ```\n\n通过运行 `forward_pass_jit(params`，我们可以在执行期间观察 `a1` 的均值。\n\n### 条件调试\n\n我们可以向\
    \ `debug.print` 函数添加条件以将输出限制为特定情况。下面是一个快速示例：\n\n```\ndef forward_pass(params,\
    \ x):\n    W1, b1, W2, b2 = params\n    z1 = jnp.dot(x, W1) + b1\n    a1 = jnp.maximum(0,\
    \ z1)\n    max_a1 = jnp.max(a1)\n    debug.print(\"Max of a1: {}\", max_a1, where=max_a1\
    \ > 10.0)\n    z2 = jnp.dot(a1, W2) + b2\n    y_pred = jax.nn.softmax(z2)\n  \
    \  return y_pred\n```\n\n这将仅在超过时打印 `a1` 的最大值，有助于识别异常激活。\n\n## 使用 `jax.experimental.host_callback`\
    \ 进行主机回调\n\n对于更高级的调试，可以使用 `jax.experimental.host_callback.id_print`。下面是一个快速示例：\n\
    \n```\nfrom jax.experimental import host_callback as hcb\n@jax.jit\ndef compute(x):\n\
    \    y = x * 2\n    hcb.id_print(y, result=False, what=\"Intermediate value y\"\
    )\n    return y\nresult = compute(3.0)\n```\n\n此方法将值从设备发送到主机并打印它，提供了一种在执行期间检查值的方法。\n\
    \n通过利用主机回调以及返回中间值等替代方法，我们可以有效地在函数内部检查运行时值。这些技术增强了我们调试和理解模型内部计算的能力。\n"
