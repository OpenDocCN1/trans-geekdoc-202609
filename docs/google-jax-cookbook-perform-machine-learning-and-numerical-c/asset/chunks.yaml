    \        x_batch = train_images_shuffled[i:i+batch_size]\n        y_batch = train_labels_shuffled[i:i+batch_size]\n\
    \        params = update(params, x_batch, y_batch)\n    current_loss = compute_loss(params,\
    \ x_batch, y_batch)\n    print(f\"Epoch {epoch+1}, Loss: {current_loss}\")\n```\n\
    \nBy converting the code to `JAX` and utilizing automatic differentiation and\
    \ `JIT` compilation, significant speedups in training time are achieved. The use\
    \ of `grad` simplifies gradient computations, and the `@jit` decorator accelerates\
    \ the execution of the training loop. Additionally, `JAX` operations are designed\
