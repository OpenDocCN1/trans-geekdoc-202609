- raw: "  Reducing Memory Footprint with Gradient Checkpointing    When training a\
    \ neural network on the Fashion-MNIST dataset using Google JAX, limited GPU memory\
    \ can become a significant constraint. Large models or deep architectures require\
    \ substantial memory to store activations during the forward pass, which can lead\
    \ to OOM errors and hinder the training process. Reducing batch size might alleviate\
    \ memory issues but can negatively impact training efficiency and convergence.\
    \ The challenge is to find a way to train complex models within the available\
    \ GPU memory without sacrificing performance. Applying gradient checkpointing\
    \ methods allows us to trade additional computation for reduced memory usage,\
    \ enabling the training of larger models on memory-constrained hardware.    Gradient\
    \ checkpointing, also known as rematerialization, is a technique that reduces\
    \ memory consumption during training by selectively storing and recomputing intermediate\
    \ activations. Instead of keeping all activations in memory for backpropagation,\
    \ certain activations are discarded after the forward pass and recomputed during\
    \ the backward pass as needed. This approach lowers the memory footprint at the\
    \ cost of increased computation time.    Understanding Forward Pass Structure\
    \    Begin by examining the forward\\_pass function used in the neural network:\
    \      def forward\\_pass(params, x):        W1, b1, W2, b2 \\= params       \
    \ z1 \\= jnp.dot(x, W1) \\+ b1       a1 \\= jnp.maximum(0, z1)  # ReLU activation\
    \        z2 \\= jnp.dot(a1, W2) \\+ b2        y\\_pred \\= jnp.exp(z2) / jnp.sum(jnp.exp(z2),\
    \ axis=1, keepdims=True)  \\# Softmax       return y\\_pred      In the above\
    \ function, activations a1 and z2 consume memory during training. For deep networks\
    \ with many layers, the cumulative memory required to store all activations can\
    \ exceed GPU capacity.    Applying ‘jax.checkpoint’ to Forward Pass    To implement\
    \ gradient checkpointing, wrap parts of the forward pass with jax.checkpoint to\
    \ indicate that intermediate values can be recomputed during the backward pass:\
    \      from jax import checkpoint    def forward\\_pass(params, x):        W1,\
    \ b1, W2, b2 \\= params        \\# Define functions for each layer       def layer1(x):\
    \           return jnp.maximum(0, jnp.dot(x, W1) \\+ b1)       def layer2(a1):\
    \           return jnp.dot(a1, W2) \\+ b2       # Apply checkpointing to layers\
    \       a1 \\= checkpoint(layer1)(x)       z2 \\= checkpoint(layer2)(a1)     \
    \  # Compute output        y\\_pred \\= jnp.exp(z2) / jnp.sum(jnp.exp(z2), axis=1,\
    \ keepdims=True)       return y\\_pred      By checkpointing layer1 and intermediate\
    \ activations z1 and a1 are not stored during the forward pass but are recomputed\
    \ during backpropagation.    Adjusting Loss Function and Gradient Computation\
    \    It is essential to guarantee that the loss function and gradient computations\
    \ are compatible with the checkpointed forward pass, as illustrated below:   \
    \   def compute\\_loss(params, x, y):       y\\_pred \\= forward\\_pass(params,\
    \ x)       loss \\= \\-jnp.mean(jnp.log(y\\_pred\\[jnp.arange(y.shape\\[0\\]),\
    \ y\\]))       return loss    from jax import grad    grad\\_loss \\= grad(compute\\\
    _loss)      Training Model with Checkpointing    Next, proceed with the training\
    \ loop as before, using the same optimizer and update functions:      def update(params,\
    \ x, y, learning\\_rate=0.01):       grads \\= grad\\_loss(params, x, y)       \
    \ params \\= \\[p \\- learning\\_rate \\* g for p, g in zip(params, grads)\\]\
    \       return params    \\# Training loop    num\\_epochs \\= 10    batch\\_size\
    \ \\= 64    for epoch in range(num\\_epochs):        for x\\_batch, y\\_batch\
    \ in data\\_generator(train\\_images, train\\_labels, batch\\_size):         \
    \  x\\_batch \\= jnp.array(x\\_batch)           y\\_batch \\= jnp.array(y\\_batch)\
    \           params \\= update(params, x\\_batch, y\\_batch)      The use of checkpoint\
    \ within the forward\\_pass function reduces memory consumption during training.\
    \    For models with more layers or complex architectures, consider applying checkpointing\
    \ more selectively or using custom strategies:    Checkpointing Groups of Layers\
    \    In a deep network, grouping multiple layers and checkpointing the group can\
    \ balance the trade-off between memory savings and computational overhead:   \
    \   def forward\\_pass(params, x):       activations \\= x        for i in range(0,\
    \ len(params), 2):  \\# Assuming pairs of (W, b)           W, b \\= params\\[i\\\
    ], params\\[i+1\\]           def layer(a, W, b):               return jnp.maximum(0,\
    \ jnp.dot(a, W) \\+ b)           # Checkpoint the group of layers           activations\
    \ \\= checkpoint(layer)(activations, W, b)       return activations      Using\
    \ ‘jax.remat’ with Custom Policies    For finer control, use jax.remat with a\
    \ custom policy to specify which operations to checkpoint:      from jax import\
    \ remat    def custom\\_policy(primitive):        \\# Decide whether to checkpoint\
    \ based on the primitive name       return primitive.name in ('dot\\_general',\
    \ 'conv\\_general\\_dilated')    def forward\\_pass(params, x):       remat\\\
    _forward \\= remat(forward\\_pass\\_body, policy=custom\\_policy)       return\
    \ remat\\_forward(params, x)      When using convolutional layers, memory consumption\
    \ can be significant. You can apply checkpointing to convolutional layers as below:\
    \      def conv\\_layer(params, x):       W, b \\= params       return jax.nn.relu(jax.lax.conv\\\
    _general\\_dilated(           x, W, window\\_strides=(1, 1), padding='SAME'   \
    \    ) \\+ b)    def forward\\_pass(params, x):        \\# Apply checkpointing\
    \ to convolutional layers       x \\= checkpoint(conv\\_layer)(params\\[0\\],\
    \ x)       x \\= checkpoint(conv\\_layer)(params\\[1\\], x)       # Continue with\
    \ other layers       return x      The incorporation of gradient checkpointing\
    \ into the neural network training process enables the alleviation of memory constraints,\
    \ thereby facilitating the training of larger or deeper models on GPUs with constrained\
    \ memory resources. Although this approach necessitates additional computation\
    \ due to the recomputation of activations, it offers a viable solution for surmounting\
    \ hardware constraints.    \n\n  Summary    We started by looking at ways to measure\
    \ the execution time of JAX functions. By identifying the bottlenecks in the code,\
    \ we were able to optimize performance using JAX's built-in tools and Python profiling\
    \ libraries, including time, cProfile, and line\\_profiler. We implemented strategies\
    \ to profile and reduce device memory consumption. We used smaller data types\
    \ like float16 instead of float32, employed generators or iterators to optimize\
    \ data loading, and adjusted batch sizes to balance memory usage and computational\
    \ efficiency.    We addressed the issue of understanding the flow of complex computations\
    \ in the model by utilizing graph visualization tools. This visualization helped\
    \ us understand the data flow and dependencies within the model, allowing us to\
    \ debug issues and optimize performance more effectively. Adding named scopes\
    \ and analyzing the intermediate representation (JAXpr) provided deeper insights\
    \ into the model's structure. Next, we must optimize batch sizes for training\
    \ efficiency. Smaller batch sizes reduce memory consumption but increase training\
    \ time due to less efficient hardware utilization. Larger batch sizes were shown\
    \ to improve computational efficiency, but risked exceeding memory limitations.\
    \ The chapter then explored how to reduce the memory footprint during training\
    \ through the use of gradient checkpointing methods, which allow for the selective\
    \ storing and recomputation of intermediate activations during the backward pass.\
    \ This enabled the training of deeper and more complex models without exceeding\
    \ memory constraints.    Overall, the chapter provided clear and practical techniques\
    \ and strategies for profiling and optimizing both computation and memory usage\
    \ when working with Google JAX.  \n\n  Chapter 3: Debugging Runtime Values and\
    \ Errors    "
  fmt: "\n# Reducing Memory Footprint with Gradient Checkpointing\n\nWhen training\
    \ a neural network on the Fashion-MNIST dataset using Google JAX, limited GPU\
    \ memory can become a significant constraint. Large models or deep architectures\
    \ require substantial memory to store activations during the forward pass, which\
    \ can lead to OOM errors and hinder the training process. Reducing batch size\
    \ might alleviate memory issues but can negatively impact training efficiency\
    \ and convergence. The challenge is to find a way to train complex models within\
    \ the available GPU memory without sacrificing performance. Applying gradient\
    \ checkpointing methods allows us to trade additional computation for reduced\
    \ memory usage, enabling the training of larger models on memory-constrained hardware.\n\
    \nGradient checkpointing, also known as rematerialization, is a technique that\
    \ reduces memory consumption during training by selectively storing and recomputing\
    \ intermediate activations. Instead of keeping all activations in memory for backpropagation,\
    \ certain activations are discarded after the forward pass and recomputed during\
    \ the backward pass as needed. This approach lowers the memory footprint at the\
    \ cost of increased computation time.\n\n## Understanding Forward Pass Structure\n\
    \nBegin by examining the `forward_pass` function used in the neural network:\n\
    \n```\ndef forward_pass(params, x):\n    W1, b1, W2, b2 = params\n    z1 = jnp.dot(x,\
    \ W1) + b1\n    a1 = jnp.maximum(0, z1)  # ReLU activation\n    z2 = jnp.dot(a1,\
    \ W2) + b2\n    y_pred = jnp.exp(z2) / jnp.sum(jnp.exp(z2), axis=1, keepdims=True)\
    \  # Softmax\n    return y_pred\n```\n\nIn the above function, activations `a1`\
    \ and `z2` consume memory during training. For deep networks with many layers,\
    \ the cumulative memory required to store all activations can exceed GPU capacity.\n\
    \n## Applying `jax.checkpoint` to Forward Pass\n\nTo implement gradient checkpointing,\
    \ wrap parts of the forward pass with `jax.checkpoint` to indicate that intermediate\
    \ values can be recomputed during the backward pass:\n\n```\nfrom jax import checkpoint\n\
    def forward_pass(params, x):\n    W1, b1, W2, b2 = params\n    # Define functions\
    \ for each layer\n    def layer1(x):\n        return jnp.maximum(0, jnp.dot(x,\
    \ W1) + b1)\n    def layer2(a1):\n        return jnp.dot(a1, W2) + b2\n    # Apply\
    \ checkpointing to layers\n    a1 = checkpoint(layer1)(x)\n    z2 = checkpoint(layer2)(a1)\n\
    \    # Compute output\n    y_pred = jnp.exp(z2) / jnp.sum(jnp.exp(z2), axis=1,\
    \ keepdims=True)\n    return y_pred\n```\n\nBy checkpointing `layer1` and intermediate\
    \ activations `z1` and `a1` are not stored during the forward pass but are recomputed\
    \ during backpropagation.\n\n## Adjusting Loss Function and Gradient Computation\n\
    \nIt is essential to guarantee that the loss function and gradient computations\
    \ are compatible with the checkpointed forward pass, as illustrated below:\n\n\
    ```\ndef compute_loss(params, x, y):\n    y_pred = forward_pass(params, x)\n \
    \   loss = -jnp.mean(jnp.log(y_pred[jnp.arange(y.shape[0]), y]))\n    return loss\n\
    from jax import grad\ngrad_loss = grad(compute_loss)\n```\n\n## Training Model\
    \ with Checkpointing\n\nNext, proceed with the training loop as before, using\
    \ the same optimizer and update functions:\n\n```\ndef update(params, x, y, learning_rate=0.01):\n\
    \    grads = grad_loss(params, x, y)\n    params = [p - learning_rate * g for\
    \ p, g in zip(params, grads)]\n    return params\n# Training loop\nnum_epochs\
    \ = 10\nbatch_size = 64\nfor epoch in range(num_epochs):\n    for x_batch, y_batch\
    \ in data_generator(train_images, train_labels, batch_size):\n        x_batch\
    \ = jnp.array(x_batch)\n        y_batch = jnp.array(y_batch)\n        params =\
    \ update(params, x_batch, y_batch)\n```\n\nThe use of `checkpoint` within the\
    \ `forward_pass` function reduces memory consumption during training.\n\nFor models\
    \ with more layers or complex architectures, consider applying checkpointing more\
    \ selectively or using custom strategies:\n\n### Checkpointing Groups of Layers\n\
    \nIn a deep network, grouping multiple layers and checkpointing the group can\
    \ balance the trade-off between memory savings and computational overhead:\n\n\
    ```\ndef forward_pass(params, x):\n    activations = x\n    for i in range(0,\
    \ len(params), 2):  # Assuming pairs of (W, b)\n        W, b = params[i], params[i+1]\n\
    \        def layer(a, W, b):\n            return jnp.maximum(0, jnp.dot(a, W)\
    \ + b)\n        # Checkpoint the group of layers\n        activations = checkpoint(layer)(activations,\
    \ W, b)\n    return activations\n```\n\n### Using `jax.remat` with Custom Policies\n\
    \nFor finer control, use `jax.remat` with a custom policy to specify which operations\
    \ to checkpoint:\n\n```\nfrom jax import remat\ndef custom_policy(primitive):\n\
    \    # Decide whether to checkpoint based on the primitive name\n    return primitive.name\
    \ in ('dot_general', 'conv_general_dilated')\ndef forward_pass(params, x):\n \
    \   remat_forward = remat(forward_pass_body, policy=custom_policy)\n    return\
    \ remat_forward(params, x)\n```\n\nWhen using convolutional layers, memory consumption\
    \ can be significant. You can apply checkpointing to convolutional layers as below:\n\
    \n```\ndef conv_layer(params, x):\n    W, b = params\n    return jax.nn.relu(jax.lax.conv_general_dilated(\n\
    \        x, W, window_strides=(1, 1), padding='SAME'\n    ) + b)\ndef forward_pass(params,\
    \ x):\n    # Apply checkpointing to convolutional layers\n    x = checkpoint(conv_layer)(params[0],\
    \ x)\n    x = checkpoint(conv_layer)(params[1], x)\n    # Continue with other\
    \ layers\n    return x\n```\n\nThe incorporation of gradient checkpointing into\
    \ the neural network training process enables the alleviation of memory constraints,\
    \ thereby facilitating the training of larger or deeper models on GPUs with constrained\
    \ memory resources. Although this approach necessitates additional computation\
    \ due to the recomputation of activations, it offers a viable solution for surmounting\
    \ hardware constraints.\n\n## Summary\n\nWe started by looking at ways to measure\
    \ the execution time of JAX functions. By identifying the bottlenecks in the code,\
    \ we were able to optimize performance using JAX's built-in tools and Python profiling\
    \ libraries, including `time`, `cProfile`, and `line_profiler`. We implemented\
    \ strategies to profile and reduce device memory consumption. We used smaller\
    \ data types like `float16` instead of `float32`, employed generators or iterators\
    \ to optimize data loading, and adjusted batch sizes to balance memory usage and\
    \ computational efficiency.\n\nWe addressed the issue of understanding the flow\
    \ of complex computations in the model by utilizing graph visualization tools.\
    \ This visualization helped us understand the data flow and dependencies within\
    \ the model, allowing us to debug issues and optimize performance more effectively.\
    \ Adding named scopes and analyzing the intermediate representation (`JAXpr`)\
    \ provided deeper insights into the model's structure. Next, we must optimize\
    \ batch sizes for training efficiency. Smaller batch sizes reduce memory consumption\
    \ but increase training time due to less efficient hardware utilization. Larger\
    \ batch sizes were shown to improve computational efficiency, but risked exceeding\
    \ memory limitations. The chapter then explored how to reduce the memory footprint\
    \ during training through the use of gradient checkpointing methods, which allow\
    \ for the selective storing and recomputation of intermediate activations during\
    \ the backward pass. This enabled the training of deeper and more complex models\
    \ without exceeding memory constraints.\n\nOverall, the chapter provided clear\
    \ and practical techniques and strategies for profiling and optimizing both computation\
    \ and memory usage when working with Google JAX.\n\n# Chapter 3: Debugging Runtime\
    \ Values and Errors\n"
  trans: "\n# 使用梯度检查点减少内存占用\n\n在使用 Google JAX 在 Fashion-MNIST 数据集上训练神经网络时，GPU 内存的限制可能成为一个重要制约因素。大型模型或深度架构需要在前向传播期间存储激活值，这需要大量的内存，可能导致\
    \ OOM 错误并阻碍训练过程。减小批量大小可能会缓解内存问题，但会负面影响训练效率和收敛性。挑战在于如何在不牺牲性能的情况下，在可用 GPU 内存内训练复杂模型。应用梯度检查点方法使我们能够用额外的计算换取减少的内存使用，从而在内存受限的硬件上训练更大的模型。\n\
    \n梯度检查点，也称为重物化，是一种通过选择性地存储和重新计算中间激活值来在训练期间减少内存消耗的技术。与将所有激活值保留在内存中用于反向传播不同，某些激活值在前向传播后会被丢弃，并在反向传播时根据需要重新计算。这种方法以增加计算时间为代价降低了内存占用。\n\
    \n## 理解前向传播结构\n\n首先检查神经网络中使用的 `forward_pass` 函数：\n\n```\ndef forward_pass(params,\
    \ x):\n    W1, b1, W2, b2 = params\n    z1 = jnp.dot(x, W1) + b1\n    a1 = jnp.maximum(0,\
    \ z1)  # ReLU activation\n    z2 = jnp.dot(a1, W2) + b2\n    y_pred = jnp.exp(z2)\
    \ / jnp.sum(jnp.exp(z2), axis=1, keepdims=True)  # Softmax\n    return y_pred\n\
    ```\n\n在上述函数中，激活值 `a1` 和 `z2` 在训练期间会占用内存。对于具有许多层的深度网络，存储所有激活值所需的累计内存可能超过 GPU 容量。\n\
    \n## 将 `jax.checkpoint` 应用于前向传播\n\n要实现梯度检查点，请使用 `jax.checkpoint` 包装前向传播的部分，以指示中间值可以在反向传播期间重新计算：\n\
    \n```\nfrom jax import checkpoint\ndef forward_pass(params, x):\n    W1, b1, W2,\
    \ b2 = params\n    # Define functions for each layer\n    def layer1(x):\n   \
    \     return jnp.maximum(0, jnp.dot(x, W1) + b1)\n    def layer2(a1):\n      \
    \  return jnp.dot(a1, W2) + b2\n    # Apply checkpointing to layers\n    a1 =\
    \ checkpoint(layer1)(x)\n    z2 = checkpoint(layer2)(a1)\n    # Compute output\n\
    \    y_pred = jnp.exp(z2) / jnp.sum(jnp.exp(z2), axis=1, keepdims=True)\n    return\
    \ y_pred\n```\n\n通过对 `layer1` 进行检查点，中间激活值 `z1` 和 `a1` 在前向传播期间不会被存储，而是在反向传播期间重新计算。\n\
    \n## 调整损失函数和梯度计算\n\n确保损失函数和梯度计算与检查点后的前向传播兼容至关重要，如下所示：\n\n```\ndef compute_loss(params,\
    \ x, y):\n    y_pred = forward_pass(params, x)\n    loss = -jnp.mean(jnp.log(y_pred[jnp.arange(y.shape[0]),\
    \ y]))\n    return loss\nfrom jax import grad\ngrad_loss = grad(compute_loss)\n\
    ```\n\n## 使用检查点训练模型\n\n接下来，如同之前一样，使用相同的优化器和更新函数继续训练循环：\n\n```\ndef update(params,\
    \ x, y, learning_rate=0.01):\n    grads = grad_loss(params, x, y)\n    params\
    \ = [p - learning_rate * g for p, g in zip(params, grads)]\n    return params\n\
    # Training loop\nnum_epochs = 10\nbatch_size = 64\nfor epoch in range(num_epochs):\n\
    \    for x_batch, y_batch in data_generator(train_images, train_labels, batch_size):\n\
    \        x_batch = jnp.array(x_batch)\n        y_batch = jnp.array(y_batch)\n\
    \        params = update(params, x_batch, y_batch)\n```\n\n在 `forward_pass` 函数中使用\
    \ `checkpoint` 可在训练期间减少内存消耗。\n\n对于具有更多层或更复杂架构的模型，请考虑更具选择性地应用检查点或使用自定义策略：\n\n###\
    \ 对层组进行检查点\n\n在深度网络中，对多个层进行分组并对组进行检查点，可以在内存节省和计算开销之间取得平衡：\n\n```\ndef forward_pass(params,\
    \ x):\n    activations = x\n    for i in range(0, len(params), 2):  # Assuming\
    \ pairs of (W, b)\n        W, b = params[i], params[i+1]\n        def layer(a,\
    \ W, b):\n            return jnp.maximum(0, jnp.dot(a, W) + b)\n        # Checkpoint\
    \ the group of layers\n        activations = checkpoint(layer)(activations, W,\
    \ b)\n    return activations\n```\n\n### 使用自定义策略的 `jax.remat`\n\n为了更精细地控制，请使用\
    \ `jax.remat` 并配合自定义策略来指定要检查点的操作：\n\n```\nfrom jax import remat\ndef custom_policy(primitive):\n\
    \    # Decide whether to checkpoint based on the primitive name\n    return primitive.name\
    \ in ('dot_general', 'conv_general_dilated')\ndef forward_pass(params, x):\n \
    \   remat_forward = remat(forward_pass_body, policy=custom_policy)\n    return\
    \ remat_forward(params, x)\n```\n\n在使用卷积层时，内存消耗可能很大。您可以按如下方式对卷积层应用检查点：\n\n```\n\
    def conv_layer(params, x):\n    W, b = params\n    return jax.nn.relu(jax.lax.conv_general_dilated(\n\
    \        x, W, window_strides=(1, 1), padding='SAME'\n    ) + b)\ndef forward_pass(params,\
    \ x):\n    # Apply checkpointing to convolutional layers\n    x = checkpoint(conv_layer)(params[0],\
    \ x)\n    x = checkpoint(conv_layer)(params[1], x)\n    # Continue with other\
    \ layers\n    return x\n```\n\n将梯度检查点纳入神经网络训练过程能够缓解内存限制，从而促进在内存资源受限的 GPU 上训练更大或更深的模型。尽管这种方法由于激活值的重新计算而需要额外的计算，但它为克服硬件限制提供了一种可行的解决方案。\n\
    \n## 摘要\n\n我们首先研究了测量 JAX 函数执行时间的方法。通过识别代码中的瓶颈，我们能够使用 JAX 的内置工具和 Python 配置文件库，包括\
    \ `time`、`cProfile` 和 `line_profiler` 来优化性能。我们实施了分析并减少设备内存消耗的策略。我们使用 `float16`\
    \ 等较小的数据类型代替 `float32`，采用生成器或迭代器来优化数据加载，并调整批量大小以平衡内存使用和计算效率。\n\n我们通过利用图形可视化工具解决了理解模型中复杂计算流程的问题。这种可视化帮助我们理解模型内部的数据流和依赖关系，从而更有效地调试问题并优化性能。添加命名作用域并分析中间表示（`JAXpr`）提供了对模型结构的更深入见解。接下来，我们必须优化批量大小以提高训练效率。较小的批量大小会减少内存消耗，但由于硬件利用率较低而增加训练时间。较大的批量大小被证明可以提高计算效率，但有超出内存限制的风险。本章随后探讨了如何通过使用梯度检查点方法在训练期间减少内存占用，该方法允许在反向传播期间选择性地存储和重新计算中间激活值。这使得在不超出内存限制的情况下训练更深、更复杂的模型成为可能。\n\
    \n总体而言，本章提供了在使用 Google JAX 时分析并优化计算和内存使用方面的清晰且实用的技术和策略。\n\n# 第 3 章：调试运行时值和错误\n"
