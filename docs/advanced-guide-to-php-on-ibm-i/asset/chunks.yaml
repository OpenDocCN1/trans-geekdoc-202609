    但请注意关于字体大小的问题。当你开始学习 CSS 时，人们很想使用像素单位（`px`）或磅单位（`pt`）。相反，请尝试使用 `em` 属性；它提供了相对于父字体的字体大小。如果父字体大小发生变化，任何基于父字体的字体大小也会随之变化。这让你能够更轻松地在各种设备上缩放显示内容。与其更改特定设备上特定页面的所有字体大小，只需更改一个并让浏览器进行计算即可。


    # CSS 布局


    到目前为止，我们已经涵盖了装饰的 CSS 定义。现在让我们来看两个管理布局的示例：`display` 和 `float`。


    ## Display


    `display` 属性几乎有 20 个不同的值。你可以用它让 `<div>` 标签表现得像表格单元格，或者让 `<span>` 像 `<li>` 元素。但你很少需要这些元素；相反，你可以依靠三个不同的值来操作显示。


    第一个是 `block` 显示。这是 `<div>` 或 `<p>` 标签（以及其他几个）的默认值。它会在新行开始并结束，并将占据父元素的整个宽度，即使它没有填满区域。即使你在
    `display` 中指定了 `width` 样式来限制块级元素，它仍然会占据父元素的整个宽度。


    第二个是 `inline` 显示。你可以将其认为关闭了块级模式。换句话说，没有新行，也不会匹配父元素宽度。这个值很有用，因为它允许你在块级区域内定义节点，并为它们分配唯一的
    ID（对于基于脚本的值替换很有用），或提供独特的装饰，如斜体、下划线或背景颜色。


    第三个是 `none` 显示。将块级元素设置为 `display: none;` 将不会对 HTML 的布局产生任何影响。它就像该元素不存在一样。尽管它确实在那里，你仍然可以使用
    JavaScript 修改其内容。


    ![Image](img/182-1.jpg)


    此 HTML 页面产生了图 6.6 所示的输出。


    ![Image](img/182-2.jpg)


    *图 6.6：包含 display 元素值的 HTML 渲染的页面*


    ## Float


    有时，你希望将内容与文本内联，例如图像或其他文本。使用 `float` 属性，你可以将元素放置在一个块中，并让其他内容绕过它。你通常使用的值有 `left`、`right`
    和 `none`（默认值）。


    考虑一下莎士。


    ![Image](img/182-3.jpg)


    图 6.7 显示了浮动的 T 是如何渲染的。


    ![Image](img/183.jpg)


    *图 6.7：带有浮动 T 的 HTML 输出*


    ## Position


    `position` 属性将带来很多乐趣，当它不按照你的意愿工作时，可能会带来相当大的挫败。除了默认的 `static` 值外，我们还将检查其他三个值：`relative`、`absolute`
    和 `fixed`。演示这些最简单的方法是修改 `top` 和 `left` 属性，这些属性控制元素在其参考系中的定位。如果你使用的是默认的 `static`
    位置值，`top` 和 `left` 属性将不起作用。


    这听起来可能很简单，但 `relative` 位置的使用可能最好被总结为“微调”。虽然 `relative` 值有时可能有更宏大的目的，但你通常会发现它在对齐不精确时将某些物体移动到与其他物体对齐时非常有用。这是因为
    `relative` 位置会将元素与其其父块对齐。


    为了演示定位元素，我们将使用此代码作为基础。示例代码将修改类为 `box` 的 `DIV`：


    ![Image](img/184.jpg)


    此代码显示了一个带有类 `box` 的 `DIV`，这是一个带有边框的 `DIV`，图 6.8 显示有背景色。


    ![Image](img/185-1.jpg)


    *图 6.8：带有背景色的框*


    为了演示定位元素，我们将使用此代码作为基础。我们将修改 `top` 和 `left` 样式。让我们先向下向左移动 10 像素：


    ![Image](img/185-2.jpg)


    当位置设置为 `relative` 时，你可以看到它偏移了框，图 6.9。


    ![Image](img/185-3.jpg)


    *图 6.9：使用相对位置向下偏移框*


    负数也有效：


    ![Image](img/185-4.jpg)


    图 6.10 显示了输出结果。


    ![Image](img/186-1.jpg)


    *图 6.10：使用负数向上移动框*


    绝对定位将相对于文档顶部对元素定位，而不是屏幕。因此，通过设置 `absolute` 值的元素，你仍然可以滚动，但它不是相对于其父元素定位的：


    ![Image](img/186-2.jpg)


    此代码打印图 6.11 所示的输出。


    ![Image](img/186-3.jpg)


    *图 6.11：绝对定位 HTML 的结果*


    注意容器 `DIV` 也收缩了。这是因为大多数块元素会伸缩以容纳内容。框 `DIV` 不再限于容器 `DIV`，因此没有东西挤压 `DIV` 的边界。


    固定定位对于将项目固定在屏幕上非常有用，例如工具栏或页脚。它的工作方式与绝对定位完全相同，直到你开始滚动。绝对定位的元素随页面滚动，但固定定位的元素将留在原地。那是因为它的测量相对于视口而不是文档，就像绝对测量一样。


    # JavaScript


    JavaScript 是一种丰富且强大的语言。要了解 JavaScript 的丰富和深度，请购买一本 JavaScript 书。这本书书是关于 PHP 的。


    但是，如果你正在进行 Web 开发，你需要了解一些 JavaScript。从开发的角度来看，JavaScript 允许你在浏览器上运行编程逻辑。你通常会使用这种语言来操作
    HTML 文档对象模型（DOM），为用户提供更具响应性和交互性的体验。但你还可以做更多，包括在服务器上运行 JavaScript。出于我们这里的讨论目的，我们将只关注基础知识。


    可以通过两种方式将 JavaScript 嵌入 Web 应用程序页面。第一种是直接嵌入：


