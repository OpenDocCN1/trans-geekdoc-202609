  raw: 'Even though you are naming this an adapter, it is an implementation of the
    Strategy. With the previous Adapter pattern, you called each adapter individually.
    With the Strategy pattern, you let the AuthenticationAdapter do that for you:


    ![Image](images/37.jpg)


    It is a subtle, somewhat confusing, but important difference.


    # Lazy Initialization and Lazy Loading


    For many programming languages, Java® for example, it makes sense to preinitialize
    objects and relationships. Java is generally run as a long-lived process, and
    developers can use much of that up-front initialization to decrease the cost of
    initialization during runtime.


    However, because PHP is a shared-nothing architecture and does not retain state
    in between requests, this kind of preinitialization can waste CPU cycles. As such,
    Lazy Initialization is a design pattern that is well worth your time to use as
    much as possible.


    The way I see it, you have two ways of using Lazy Initialization in PHP. Although
    most languages will compile down to a binary that has all the required components
    either included or referenced, PHP does not do this. It starts with a clean slate
    for each request. Because of this, you must include dependencies again for each
    request. This typically looks as follows:


    ![Image](images/38-1.jpg)


    The effect is that myclass.php and anotherclass.php will be loaded regardless
    of whether they are needed. The work-around is to use the autoloader discussed
    in [Chapter 1](#005_Chapter01.html#ch-1). In my testing, using the autoloader
    over static require() calls increased performance by more than 20 percent, even
    with an opcode cache.


    The general approach for Lazy Initialization is to delay the creation of an object
    until it is needed, as the following example shows:


    ![Image](images/38-2.jpg)


    To retrieve the Engine object from the Car object, the getEngine() method must
    be called either from inside the class or externally. By doing this, the application
    will instantiate the Engine object only when getEngine() is called, even if the
    Car class has an instance. If the Engine object is heavy in terms of its initialization
    cost, the use of Lazy Initialization can prove beneficial.


    Next is Lazy Loading. This design pattern is like Lazy Initialization, but you
    implement it from within the context of data instead of class instantiation. Although
    you can save CPU time by delaying the initialization of an object, you can save
    more time by delaying the loading of data.


    Inefficient data handling is probably one of the most common causes of performance
    problems, more so than bad architecture, though the two are often related. The
    worst problems generally come from retrieving more data than necessary, but a
    secondary issue can definitely stem from loading data when it is not needed or
    loading it multiple times.


    The following example shows stub-like code that contains some logic but none of
    the actual logic for loading (that is dependent on your data storage mechanism
    and not required for you to understand the lesson the example is teaching). I
    will omit the implementation details so you can focus on how to use Lazy Loading
    from a logical perspective:


    ![Image](images/39.jpg)


    In this class, you have defined two properties: $data and $orders. The $data property
    contains customer information, and $orders has order information. To retrieve
    the orders, you use the getOrders() method. Notice that this method first checks
    to detect whether $orders is null. If it is null, then this class will query the
    database or the Toolkit to load the orders and store them in the protected variable.
    The orders could be the raw data or a cursor, but the point is that this data
    is loaded only if some code calls the getOrders() method.


    The other method that uses Lazy Loading is getData(). When getData() is called,
    it will check whether $data has a result in it. If it does not, getData() will
    call the database or the Toolkit to retrieve that information and store it in
    the protected variable $data. Once it completes that task, getData() returns the
    requested value or returns null if the value does not exist.


    But you have defined two other methods as well: getName() and getEmail(). These
    are simple getters that retrieve the requested data from the getData() method.
    Why not just use getData()? Because you can use these getters as “documentation”
    to specify which data is to be available in the Customer class. So the programmer
    can call the getter methods with confidence that the data will exist. But because
    the getter methods use the getData() method, the use of Lazy Loading is guaranteed.


    # Observer/Visitor/Publish-Subscribe


    In the past, PHP programs did not handle customizations very well. This is readily
    apparent in the e-commerce realm but prevalent in many other places, too. Magento
    is an example of one of the earliest PHP applications to take the concept of customization
    seriously. It was born out of problems that developers had with customizing their
    existing e-commerce packages. The result was that developers frequently had to
    modify core files to make modifications, and this is a horrible thing to do if
    you intend to be able to upgrade your application.


    Often, a key feature of a customizable system is the ability to graft customizations
    onto existing functionality without making modifications. This is an important
    concept to consider. Developers frequently think of customization as having to
    change source files. However, with a well-defined application structure, you can
    customize an application with minimal, if any, core file changes. This can have
    huge implications for application management and even delivery times.


    So in this section, we will look at several different design patterns that address
    application customization and how to use them. These patterns are all methods
    of extending functionality without modifying the original code, but they have
    different means of implementation.


    With the Observer pattern, one class instructs another class to inform it when
    something specific happens. For example, say you have an authentication class
    that wants to be informed when someone is trying to log in or is attempting to
    access a restricted area. The Observer pattern is implemented when a concrete
    instance of the authentication class tells a concrete instance of a request class
    to notify it when one of those two actions occurs.


    At first glance, this seems to be a good way of extending functionality. However,
    the Observer pattern requires two things: instances of both the request class
    and the authentication class. For a large application, this can involve a lot
    of overhead to prepare the request (also called the *bootstrap process).* This
    technique might work fine in the Java world, but because PHP must be bootstrapped
    for each request, this pattern can quickly become detrimental. Additionally, it
    requires very tight coupling between classes. Because of those two points, I tend
    not to use the Observer pattern in PHP, even though I often say I do because it
    is descriptive of the end result.


    The Visitor pattern is more explicit than the Observer pattern. The Observer pattern’s
    job is to simply notify an object that another object has changed, has done something,
    or is about to do something. The Visitor pattern provides not only an event to
    respond to but also a means of modifying data within the object without having
    to extend the object. In other words, the purpose of an Observer is to “respond,”
    whereas the purpose of a Visitor is to “process.” Another difference is that an
    application can often have multiple Observers but only one Visitor, though that
    Visitor can have sub-Visitors.'
