    执行此操作的代码展示了你可以 使用的一些的一些酷功能，而这些功能是标准 DOM 操作无法实现的：jQuery 会接受 XML 作为参数并返回一个声明妥当的
    HTML 元素。在这种情况下，它创建了一个正确的 `<option>` jQuery 元素，随后你可以在 `text()` 方法调用中轻松设置它的值。这是一个简单但实用的功能。


    在 `<select>` 标签声明中，你还为 `onchange` 绑定了一个事件，每当 `<select>` 标签被修改时，该事件就会触发。你将 `getTime()`
    方法设置为监听器；`getTime()` 将读取 `<select>` 项目的选择值，并调用相应的 `URL` 来获取指定时区的当前日期。


    为了实现这一点，你通过 `JSON` 声明了一个 JavaScript 对象，直接将函数的对象属性值设置为 `gettime`，并将 `zone` 的值设置为当前选定的时区。


    接下来，你使用 jQuery 对象的辅助方法 `param()`。该方法会将 JSON 对象序列化为基于 URL 查询字符串的格式。然后，就同你之前的 Ajax
    调用一样，你在第二个参数中放入一个函数，该函数将在成功调用 URL 后执行（这正是第二个参数的作用）。现在，你将 ID 为 `current-time` 的
    `<span>` 元素中的文本设置为 Ajax 用的结果。


    我们将检查的最后一个 Ajax 功能是通过 Ajax 替换 DOM 中的项目。在处理 Ajax 时，你有两种主要方式与页面进行交互。一种是在前端实现大量的自定义逻辑，就像你刚刚做的那样。第二种是在服务器端生成布局，并通过
    DOM 选择将其注入页面中。这种方法对于服务器端开发者来说可能更容易理解。


    为了演示这一点，让我们从一个页面的框架开始：


    ![Image](img/201-1.jpg)


    这个页面有两个动态部分：身份验证部分和内容部分。两者将根据用户是否登录显示不同的数据。


    首先是内容部分。你将复用你的时区代码；为了清晰起见，你把这段代码隐藏在一个名为 `getTimeZones()` 的片段中。但只有在用户登录时你才会打印它。


    ![Image](img/201-2.jpg)


    接下来是身份验证代码。它有点复杂，但请耐心等待，因为它值得理解。


    ![Image](img/202.jpg)


    让我们将其拆解。首先是 `switch` 语句中的三个 `case` 分支。第一个 `case` 检查请求是否为 `POST` 语句。`POST` 语句表示正在进行身份验证尝试。如果
    `POST` 值大于零字符，则设置 `$_SESSION` 变量并继续。由于你在 `case` 语句中没有 `break`，将检查下一个 `case` 语句以检测
    `$_SESSION[''name'']` 是否已设置。由于 `case` 语句位于经过验证的 `POST` 请求，它也将执行这段代码块。如果请求不是 `POST`
    但 `$_SESSION[''name'']` 已设置，那么这段代码也会执行。


    当该代码执行时，它将打印用户提供的转义后的名称（你不希望受到跨站脚本攻击）。然后，你渲染一些 JavaScript 代码，用 `/content.php`
    的内容填充主页面的内容 DIV，这应该提供身份验证后的结果。


    最后一个操作（默认操作）需要进一步检查以理解正在发生什么。首先，你打印了一些标准的 HTML 组件，每个组件都分配了一个 ID。然后，你为点击事件分配了一个匿名函数。当点击事件被触发时，你对“身份验证”
    `<div>` 发起另一个 `load()` 调用，就像你在主页中做的那样。区别在于你添加了一个 JSON 编码的对象，包含 `INPUT` 元素 `user-name`
    的值。`user-name` `INPUT` 元素的值指示 `load()` 调用从 `GET` 切换到 `POST`，并将 JSON 编码对象中的值填充
    `POST` 字段。


    可能需要再读读那段。这里有很多活动部分，但因为你使用的是 `load()` 函数而不是带有一堆额外 JavaScript 代码的 `getJSON()` 函数，你可以将演示代码保留在服务器端。如果你不熟悉
    JavaScript 或不想编写冗长的 JavaScript 代码，这种方法值得考虑的。


    这种方法的用处之一是，因为在任何处理发生之前你就获得了网站的框架，你的 Web 应用程序用户会认为网站比实际运行更快。从用户的角度来看，如果你的网站很慢，这种感知比现实更重要。


    # 结论


    这是一场关于在操作浏览器时可用各种选项的闪电之旅。我们的目标是完成 HTML、CSS 和 JavaScript 的一些简单和中级活动。本章的目的并不是让你在所涵盖的任何主题上从
    A 到 Z 全面掌握，而是为你提供一些你可以进一步探索的起点。在此过程中，我希望提供了一些你在构建用户界面时可能需要考虑的有趣信息。


    ![image](img/line.jpg)


    ¹ 列表项显示样式与标准的块级显示样式相似，但增加了一些细节。


    ² 使用浏览器的开发工具是查看给定元素可用样式定义的极佳方法。


    # 7


    # 测试驱动开发


    你是否遇到过这种情况：你构建了某个东西或在某处做了更改，结果却导致其他地方崩溃了？如果你的答案是否定的，那等毕业找工作吧。这种情况一定会发生，而且有时会产生灾难性的影响。


    问题之一是我们经常并不很好地测试我们的应用程序。是的，我们会刷新并可能使用调试器，但我们有测试*系统*吗？


    但在使用测试系统之外，我们必须更深一层。为了更好地使用测试系统，我们必须构建可测试的应用。可测试的应用通常比典型的 PHP 应用复杂。然而，可测试的应用将带来成倍的回报，因为它让我们反复测试应用程序的所有部分，以确保它们从头到尾都能正常工作。


    测试驱动开发是一种基于测试构建应用程序的实践，而不是流式地构建。我们自然构建应用程序的方式是：发现问题，想出解决办法，构建应用程序，然后进行测试。测试驱动开发反转了这一过程。我们不是起初构建应用程序，而是先构建测试，然后编写通过测试的代码。这听起来有点违背直觉，因为在整个学校时代里，我们在参加毕业对之前最后做的事情就是接受测试。


    '
- fmt: "\nSome might claim that because you must now write both test and actual program\
    \ code, you are becoming less productive. Although this might seem true at first\
    \ glance, in practice it is often not the case. When writing unit tests, you are\
    \ testing individual pieces of functionality. With traditional debugging, you\
    \ are trying to coax the browser into performing a certain action, whether or\
    \ not it wants to. And though you might be writing more code, you are writing\
    \ code that is intended to verify that the function is doing what it is supposed\
    \ to be doing.\n\nUnit testing can be a complex subject to cover, but even a basic\
    \ understanding of it can pay for itself. This chapter will explain only the basics\
    \ of performing unit testing. For a more in-depth treatment of the subjects, complete\
    \ books are available that provide a deeper guide into how to do unit testing.\n\
    \n# PHPUnit\n\nBy far, the most popular PHP unit testing software is `PHPUnit`.\
    \ It is maintained by Sebastian Bergman, and you can it download at `[http://www.phpunit.de](http://www.phpunit.de)`.\
    \ `PHPUnit` is also included in your copy of Zend Studio.\n\nGenerally, tests\
    \ are created in a separate directory from the application to prevent them from\
    \ being deployed along with the application. You can, of course, put the test\
    \ files alongside your class structure and remove any unwanted tests as part of\
