    有些人可能认为，由于你现在必须同时编写测试代码和实际程序代码，你的效率变得降低。虽然这初看之下似乎是真的，但在实践中通常并非如此。在编写单元测试时，你正在测试单个功能单元。在传统的调试中，你正试图诱导浏览器执行某些操作，无论它是否乐愿执行。尽管你可能编写了更多的代码，但你写的代码是为了验证函数正在执行它本应该执行的任务。


    单元测试是一个复杂的涵盖的主题，但即使对其有基础的理解也能让你大有所获。本章将仅解释执行单元测试的基础知识。欲对这些主题进行更深入的研究，可以使用完整的书籍，它们提供了关于如何进行单元测试的更深入的指南。


    # PHPUnit


    目前为止，最流行的 PHP 单元测试软件是 `PHPUnit`。它由 Sebastian Bergman 维护，你可以在 `[`www.phpunit.de`](http://www.phpunit.de)`
    下载它。`PHPUnit` 也包含在你的 Zend Studio 中。


    通常，测试被创建在与应用程序分离的目录中，以防止它们与应用程序一起部署。当然，你可以将测试文件放在你的类结构旁边，并在部署过程中删除任何不需要的测试。但通常情况下，禁止单个目录比寄希望你的模式匹配打包过程排除掉所有测试文件要简单得多。


    你的测试结构通常应该遵循你所测试项的结构。假设你有一个名为 `My\Class` 的类。与其相关的文件应如下：


    ![Image](img/207-1.jpg)


    在某些情况下，你可以使用的一种实践是先构建你的类结构，并对你将使用的方法进行存根（stub）。考虑这个类：


    ![Image](img/207-2.jpg)


    这个示例定义了类将使用的方法，但并没有向其添加任何功能。因此，你可以在 Zend Studio 中打开 `PHPUnit` 测试窗口，并让它为你创建一个测试类（图
    7.1）。


    ![Image](img/208.jpg)


    *图 7.1：在 PHPUnit 测试窗口中创建测试类*


    老实说，Zend Studio 创建了一个相当丑的文件。让我们稍微清理一下那个文件：


    ![Image](img/209.jpg)


    这段代码中缺少了什么？它是为了你正在测试的类以及单元测试代码的 `require_once` 调用。当你创建一个新的单元测试时，我删除了 `require_once`
    调用。我也删除了大量的样板代码和其他内容。但为了加载类，你必须先安装自动加载器（autoloader）。


    为了设置这些，你定义一个引导文件（bootstrap file）。通常，引导文件是测试根目录下的一个 `PHP` 文件。它在运行测试之前会被调用以设置环境。你在该文件中做的一件事是使用自动加载器引导测试：


    ![Image](img/210.jpg)


    该引导文件可以包含任何为测试准备系统所需的功能。在这里，你只需要一个自动加载器并设置包含路径。但在某些情况下，你可能需要设置数据库连接或更改 Web 服务
    URL 进行调试。

