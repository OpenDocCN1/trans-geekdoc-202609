    # Single Responsibility


    *[http://bit.ly/php\_ibmi\_srp](http://www.bit.ly/php_ibmi_srp)*


    The Single Responsibility Principle (SRP) states that an individual class should
    have only one reason for being. In other words, a class should exist for one purpose.
    Consider a relatively simple scenario where, in order to manage HTTP requests,
    a class called WebManager manages GET and POST variables and handles aggregating
    output from multiple different sources. This violates the SRP because the WebManager
    class is responsible for both input and output.


    This tactic does not work out so well for a few reasons, the least of which is
    that it will significantly reduce your ability to modify the application. Consider
    what happens if you want to add command-line capabilities to an application. To
    use the WebManager class in that scenario requires ensuring that changes made,
    or extensibility implemented, will work with both the HTTP-based manager and the
    CLI-based manager. And if they do not, you will have a lot of work ahead of you.
    Therefore, it is better to separate responsibility into individual classes.


    Doing so affects how you start designing an application. Yes, an end goal is in
    mind, but you approach that goal with ever-decreasing layers of abstraction until
    you have an implementation that is in perfect focus (in theory). The reason for
    all these abstraction layers is to protect you against massive refactoring in
    the future and from incomprehensibly complex test cases.


    Architects do not add this complexity because they will get paid more (well, maybe
    some will). By having all these levels of abstraction, you can build out a very
    extensible system that is much more manageable over the long term.


    Let’s go back to the former example of a WebManager. Rather than having a single
    class that manages all interactions with the web server, you have distinct elements
    that manage both input and output. With the input element, you have more than
    one method of implementation for handling input. So later when you receive a new
    business requirement to have a long-running PHP request sitting on a data queue,
    you simply build out the new implementation on top of the base implementation.
    And if you have thought through the abstraction, your whole application might
    be able to use the new input method.


    Developers often implement this through the use of interfaces and abstract classes.
    Not that those interfaces and classes are required, but frequently the base levels
    of abstraction have bits and pieces implemented that are common among different
    methods but not complete enough to be considered an implementation.


    Borrowing heavily from Zend Framework, the following example shows how a request
    abstraction would look. You will build out multiple levels of abstraction so you
    can handle HTTP, HTTPS, and a command-line interface. You start with a basic interface
    called RequestInterface because (in this example) the multiple divergent paths
    share virtually no functionality:


    ![Image](images/60-1.jpg)


    With that defined, you then build an HTTP interface:


    ![Image](images/60-2.jpg)


    And now, the command-line interface:


    ![Image](images/61-1.jpg)


    But the request and response for a web or CLI request is closely related, so you
    create a request manager that houses both objects:


    ![Image](images/61-2.jpg)


    Note that the first parameter (ignore the second one) requests a type of RequestInterface.
    So any object implementing that interface will be accepted. For an HTTP-based
    bootstrap, the code looks like this:


    ![Image](images/62-1.jpg)


    And for a command-line bootstrap, it looks like this (you will ignore defining
    the options for this example):


    ![Image](images/62-2.jpg)


    Now when the request manager is passed around, it will contain the proper request
    object for the type of interface, and the rest of the application does not know
    (nor care) what initiated the request—the web or the command line. This is a main
    reason advanced applications contain such high levels of abstraction; the application’s
    internal parts should know only the minimum required to implement their functionality.
    If they need to know more than that, they start experiencing tight coupling, greatly
    decreasing your ability to modify the application and test individual components.


    Imagine you started with a web-only application but then needed to add command-line
    support. If you hard-coded request dependencies (such as directly referencing
    $\_GET), you would now have a massive refactoring job to do. However, if you built
    in a proper level of abstraction as you did here, you need to make that change
    in only one place.'
