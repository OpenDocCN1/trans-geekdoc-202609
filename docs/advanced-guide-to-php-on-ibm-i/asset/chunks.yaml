  raw: 'As noted, part of the problem with the change and refresh mechanism is that
    some of the logic to test might change the contents of the database. That means
    that the testing scenario can change over each test iteration. The code from the
    previous examples demonstrates this because it cannot be tested without directly
    calling RPG. So any code that you want to test will possibly modify the database
    that you are connected to, which is something you want to try to avoid. This is
    because, in your unit tests, you will need to allow for any changes made to the
    system. That is not a fun task to have.


    The solution to this is in [Chapter 7](#011_Chapter07.html#ch-7), which covered
    unit testing. You want to create a mock object of the ToolkitService class that
    will bypass the Toolkit calls altogether. Using mock objects in this context provides
    two benefits. The first is that, as mentioned, when properly implemented, mock
    objects will not modify data in your database. The second is that this approach
    makes your testing repeatable. Both of these benefits are two sides of the same
    coin when it comes to building manageable software.


    To see how you will do this, let’s break the unit test into three stages, all
    of which you would define in the test. We will cover each stage individually for
    the sake of clarity:


    1.  Definition


    2.  Mocking


    3.  Execution


    In this section of code, you are defining what you expect the mocked instance
    of ToolkitService to return when it is called. Here, it is simply the name IBM.
    You retrieve this value from a functional specification or, as in this case, determine
    from the RPG code what the input and output will be.


    Following is the expected Toolkit return value that the COMMONPGM code will generate:


    ![Image](images/287.jpg)


    After defining what you expect the ToolkitService object to return, you must mock
    ToolkitService so that it will return those values when it is called. Because
    we already covered this in [Chapter 7](#011_Chapter07.html#ch-7), we will not
    go over the individual details. Instead, you will provide the code only as reference.


    With one exception. The final argument of getMock() is important. It specifies
    whether the constructor will be called. Because the ToolkitService class uses
    a Singleton and the constructor is defined as protected, calling the constructor
    will result in a fatal error. So set that parameter as false to get around its
    use as a Singleton. Using it as a Singleton is not important since you will be
    mocking the only method that really matters:


    ![Image](images/288-1.jpg)


    Now, you can execute the test. Because you are using Dependency Injection, though
    not a Dependency Injection Container, you can inject the mocked ToolkitService
    object. Then, assert that the return for that method call will be the value IBM:


    ![Image](images/288-2.jpg)


    You run the test and it passes, with the mocked ToolkitService object returning
    what you expected and your concrete implementation of COMMONPGM properly handling
    the output.


    However, in addition to this code that tests a success, it is equally, if not
    more, important to test for error conditions. You provide an input that is outside
    the bounds of what you expect, mock the expected result, and verify that the error
    condition is handled properly.


    When the RPG program encounters an error, it returns the value wrong code. You
    do not want to check for this value all over your application code, so it seems
    sensible to make the COMMONPGM PHP class responsible for catching the error. In
    this case, you want to verify the value of the outbound parameter. So before modifying
    your COMMONPGM class, define the error condition in your test:


    ![Image](images/289.jpg)


    There are three differences between this test and the previous one. First, you
    set the expected exception to be a class GenericException. Second, you define
    the return value for the PgmCall method as the expected value for invalid input,
    wrong code. Third, you change the parameter input value from 1 to null. You can
    leave the value as 1 because you are checking only the return value, but it is
    still wise to match the parameters with the condition you are testing.


    If you were to run this test, PHPUnit would output the error message “Failed asserting
    that exception of type ‘GenericException’ is thrown.” Now that you have written
    your test, go into the COMMONPGM PHP class and make the changes to have the following
    occur:


    ![Image](images/291.jpg)


    When you run your test, both assertions are satisfied and the tests pass because
    you have tested both valid and invalid data.


    # Conclusion


    We began this chapter with a basic introduction to some of the functionality that
    the Toolkit provides, but definitely not all. Plenty of existing documentation
    is available to help you with that. Instead, we focused on how to build an application
    by using the Toolkit according to various programming methodologies. And we applied
    those principles in ways that make your Toolkit integrations much more manageable
    than if you had built them in the standard inline fashion.


    # **10**


    # Performance Considerations


    Building a high-performance web application is a task that can be both easy and
    hard. It is easy in that most simple applications can have great performance,
    but they will not have much functionality. It is hard when the application needs
    a lot of functionality, customization, integration, and a host of other things
    and must be fast at the same time. In light of this, we will look at a couple
    of different options to help build a fast application that still maintains a high
    level of functionality.


    When PHP was introduced on IBM i, several performance issues occurred, most specifically
    with connecting to DB2 and working with the IFS. However, over the years, IBM
    seems to have addressed many of those problems. The IFS is still slower than the
    Linux file systems, but nowhere near as slow it used to be. And although much
    improved, DB2 connections are still slower than MySQL.


    When I sat down to write this chapter, I was planning to share a cornucopia of
    content with you. However, as I began to test my assertions from previous experiments,
    I found that many of the previous issues on the IBM i platform had largely disappeared
    as *significant* drivers of reduced performance.


    This left me with performance considerations that are themselves much more general.
    So many of the performance problems you will face will be similar to the ones
    experienced by developers who deploy PHP on Linux or Microsoft Windows®.


    To illustrate, let’s look at two issues that *used* to be significant. The first
    is the IFS. Following is some test code that I ran on a local IBM i system and
    then on a local Linux machine. Neither machine is particularly powerful. The code
    does one million reads and writes to the IFS and one million reads and writes
    to an Ext4 file system:


    ![Image](images/294.jpg)


    Although it would be nice if the IFS were faster, the results are acceptable compared
    with what they were previously. The Y axis is the number of seconds it took to
    run the test ([Figure 10.1](#014_Chapter10.html#fig10-1)).


    ![Image](images/295.jpg)


    *Figure 10.1: Number of seconds to run the test on IBM i and on Linux*


    These results are not too bad.


    The second issue concerns DB2 connections. In earlier tests (done before 2010),
    it was not surprising to see 400–500 microseconds (ms) to initiate a connection
    with DB2. But that connection time has improved. In some of my testing, I clocked
    the nonpersistent connection time at about 20 ms. MySQL is better at about 2 ms,
    but compared with the 400 ms we used to see, this is much, much better. And when
    I used persistent connections, the performance was even faster at 34 ms.


    So although I would not say that the performance problems of the past are gone,
    they seem to be largely negated.'
