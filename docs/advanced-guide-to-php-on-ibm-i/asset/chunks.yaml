    如果说类是实例的定义，就像“人类”之于个体，那么接口就是期望。但与类不同，接口不包含实现细节。这是因为一个对象通常只需要知道*某些东西*存在，而不需要知道它是*如何*存在的。而且通常那个“某些东西”可能不是在类内部实例化的项，而是从外部注入的。当这种情况发生时，外部项可能包含大量对主对象无关的功能。为了更形象地理解，请看下面的示例。


    想象你正在设计一辆汽车。你有一个名为 `Car` 的基类，它定义了汽车所有的功能元素：引擎、车门、轮子等等。但汽车本身——那个*代表真实事物的对象*——需要知道引擎的实现细节吗？它需要知道它是
    4 缸、6 缸还是 8 缸吗？其实不需要。它只需要知道它有点火和燃料供应控制：


    ![Image](img/7-1.jpg)


    所以当你定义 `Car` 类时，你可以将引擎添加其中，但不需要担心 `Engine` 类是如何实现它的。你关心的只是它的*接口*。因此，你定义了一个 `setEngine`
    方法，仅允许提供 `Engine` 接口的类。具体的实现对 `Car` 类来说并不重要；唯一的是它确实是一个引擎：


    ![Image](img/7-2.jpg)


    在接下来的示例中，`TwelveCylinderEngine` 是一个具体的类，它实现了你要求作为引擎功能类所具备的所有方法。为了实现这一点，你使用了 `implements`
    关键字（我将略过具体实现的细节）：


    ![Image](img/8-1.jpg)


    现在当你想使用该类时，只需编写一些简单的代码：


    ![Image](img/8-2.jpg)


    由于 `TwelveCylinderEngine` 类实现了 `Engine`，对象将接受它作为参数。如果你尝试将引擎定义为 `Transmission`，方法调用将失败并产生致命错误。


    # 多态


    多态是定义具有多种形式的东西的能力。鱼和引擎的示例都展示了这一特性。这个词源于希腊语词根“poly”和“morph”，意思是*许多形状*或*许多形式*。但它不仅仅是定义*某些东西*。Morph
    的实际意思是*多种不同形式中的一种一种*。换句话说，它又是分类学的一种：一种有序的、通常是分级的组织。当你观察类在整个应用程序大背景下是如何结构化的时，你通常会看到特定性不断增强的层级关系。


    这就是为什么在引擎示例中，无论引擎的实际实现如何，你都可以对其进行操作：


    ![Image](img/9.jpg)


    因为要求指定变量必须是 `Engine` 类型，所以引擎有多少个缸并不重要。从汽车的角度来看，它就是一个引擎，仅此而已。因此，引擎对象仅仅是各种不同（例如，气缸）形式之一。这与下一个回顾的领域完美契合。


    # 类型提示


    通过使用类型提示（Type Hinting），类设计者可以在传递各种参数时强制执行对象类型。为了做到，你需要定义需要传递的对象的类型，通常定义在其最低可用的层级成员处。例如，如果你有一个代表本田雅阁的类，你不会在里面放一个
    12 缸引擎，尽管那样看起来可能很有趣。作为设计者，你可以使用类型提示作为限制传递到方法中的对象类型的手段。


    你已经在 `Car` 类中见过这方面的示例了：


    ![Image](img/10-1.jpg)


    `setEngine()` 方法的 `Engine` 值定义了该参数的类型提示。PHP 不允许将其他较低或异类型的变量传递给该参数。


    如果你将 `Car` 类扩展为 `HondaAccord`，你可以进一步限制传递的 `Engine` 的子类：


    ![Image](img/10-2.jpg)


    到此，我们结束对面向对象编程的基础回顾。我这次的回顾基于我之前的书中的章节。因此，如果任何 OOP 概念或技术对你来说显得太陌生，或者你想要学习更多基础知识，请拿起一本《The
    IBM i Programmer’s Guide to PHP》，以对 OOP 有更基础的介绍。


    # 命名空间 (Namespaces)


    PHP 5.3 为其面向对象的系统引入了一个等待已久的功能。命名空间（Namespaces）不仅允许类（带有其属性、方法和常量）分离，还允许类分离。在 PHP
    5.3 之前，命名空间之所以存在是因为命名空间仅仅是那样——“名称空间”。在 PHP 5.3 之前的应用程序中，类的唯一“空间”是全局的。有了 PHP 5.3，开发者现在有了将类定义划分为更独特的子单元的选项，称为*命名空间*。namespace
    结尾额外的“s”暗示了有多个可用。（尽管这在技术上并不是添加额外“s”的原因，但它可能帮助你在脑海中形成关于命名空间如何运作的画面。）


    但如果命名空间的作用只是提供一种更清晰地命名事物的方法，它们真的是一个实用的功能吗？实际上，是的。


    假设一下，你是一个大型开发团队的一部分，正在开发一个应用程序。你需要实现的一些功能需要一个名为 `File` 的类。清晰且独特，定义文件只有一种方式对吧？


    当然，但如果这个文件是数据库中的某一项，代表一个虚拟文件呢？“没问题！”你可能会说，“我用下划线来命名 `Database_File`。”


    这时我会说，“你是说 `Core_Database`吗？”


    如果所有命名空间只是提供了一种更清晰地命名事物的方法，它们真的那么有用吗？查看任何现代 PHP 框架都可以提供这种可以变得多深的示例。


    定义命名空间很容易。在定义类之前，只需使用 `namespace` 关键字后跟命名空间名称：


    ![Image](img/12-1.jpg)


    在早期的 PHP 版本中，实例化该类的方法将使用下划线 (`_`) 伪命名分隔符。但现在，如果你在命名空间内部实例化，无需指定命名空间。如果你在给定的命名空间内，它的名称被假设为：


    ![Image](img/12-2.jpg)


    但是对象的实际类名是什么？`MyClass`，对吧？让我们添加一些代码看看结果：


    ![Image](img/12-3.jpg)


    运行这段代码产生以下输出：


    ![Image](img/13-1.jpg)


