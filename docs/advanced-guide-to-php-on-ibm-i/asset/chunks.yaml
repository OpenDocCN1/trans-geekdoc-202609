  trans: '


    1. 为重要请求验证 HTTP Referer 头部。攻击者可以尝试在 JavaScript 中伪造此头部，但大多数（如果不是所有）浏览器都会覆盖攻击者设置的任何值。

    2. 为登录用户限制会话长度。这样做可以缩短伪造攻击发生的时间窗口。

    3. 在执行重要操作之前强制身份验证。然而，请谨慎使用这种策略。你很快就会陷入关于安全性与便利性之间界限的讨论中。

    4. 要求重要操作通过 POST 提交。如果你的应用程序允许通过 `GET` 请求执行这些操作，那么某些页面上的简单伪造图像 URL 可能就足以利用它。通过
    `POST` 提交操作并防止攻击，因为你仍然可以使用 JavaScript 构建 `POST` 请求。但这种技术确实限制了攻击向量，使得在第三方网站上限制较少的图像
    URL 无法用于攻击。

    5. 使用令牌值来验证请求是否来自预期的网站。


    让我们深入探讨第 5 点，因为它需要一些解释。跨站请求伪造（cross-site request forgery）顾如其名：跨站。因为它是跨站的，攻击网站很可能无法获取特定页面上的所有数据，因为浏览器不允许此类操作。因此，你可以使用一种依赖于浏览器和网站之间隐藏共享信息的技术。


    该信息是一个随机令牌或 nonce（一次性数字）。一些几个讨论跨站请求伪造的网站使用 `uniqid()` 函数来生成令牌。


    问题在于，尽管 `uniqid()` 会生成一个（大部分）唯一的 ID，但它并不是随机的。`openssl_random_pseudo_bytes()` 函数是一个更好的选择：


    ![Image](img/144.jpg)


    代码首先检查会话中是否存在令牌，以及该令牌是否过期。这里的过期时间被设置为 10 分钟。如果令牌不存在或已过期，则将使用 `openssl_random_pseudo_bytes()`
    生成一个新令牌，并使用 `sha256` 算法通过 `hmac_hash()` 函数对其进行哈希处理。通常，人们使用 `md5()` 或 `sha1()`
    对这些值进行哈希。MD5 被认为在密码学上已经破解了，而 SHA-1 也引起了一些担忧。因此，大多数安全研究人员推荐 SHA 族算法（SHA-128, SHA-224,
    SHA-256, SHA-384, SHA-512）。出于这个原因，示例使用了 `sha256` 算法。


    如果请求是 `GET` 请求，你将跳过检查并将表单写入输出缓冲区，将令牌嵌入表单的隐藏字段中。当你提交表单时，检查令牌是否与你存储在会话中的令牌匹配。如果匹配，则没问题；如果不匹配，你将发出错误消息。在请求结束时，从会话中删除令牌，使其不再被重复使用。


    # 会话固定 (Session Fixation)


    PHP 会话 ID 相对难以猜。。虽然可行，但你需要知道该人的 IP 地址、会话创建的时间和微时间，以及一些基础的随机数生成。知道其中一个或多个变量可以增加你猜中会话
    ID 的概率。


    但既然你可以直接将此链接发送给一个疏留的人，为什么要尝试去猜它呢？


    ![Image](img/145.jpg)


    在 PHP 5.3 之前，`ini` 设置 `use_only_cookies` 的默认值是关闭。因此，PHP 会认为查询字符串是会话 ID 的机制。


    这为什么很重要？


    考虑以下场景。攻击者访问一个热门网站。网站发布了一个会话 ID。攻击者将带有该会话 ID 的链接发送给毫无防备的受害者，受害者链接到该热门网站。那个人登录。PHP
    会认为哪个浏览器是权威浏览器？


    答案：两个都是。PHP（或者说大多数语言）并不使用 IP 地址作为验证会话 ID 的决定因素。如果该会话位于一个具有多个被使用的 IP 的代理后面，会发生什么？合法流量可能会被拦截。因此，会话
    ID 不被考虑在内。现在攻击者和受害者都是受害者的用户，都可以代表受害者进行操作。


    查询字符串不是唯一的可能的攻击向量。如果网站还容易受到跨站脚本攻击（技术上是 JavaScript 注入，但保护措施是相同的），个人只需在页面的某处放置此代码即可将该网站上任何人的会话设置为预设的会话
    ID：


    ![Image](img/146.jpg)


    保护你的用户相对简单。每当你的用户登录时，在更改会话之前，你调用一次 `session_regenerate_id()`。调用此函数将为用户分配一个新的会话
    ID。


    # 会话劫持 (Session Hijacking)


    会话劫持与会话固定的类似，但实现方式不同。在会话固定中，受害者被诱骗将其会话 ID 设置为预定的值。在这种情况下，攻击者是获取用户的会话 ID 然后伪装成该用户。


    会话 ID 可以通过两种主要获取：


    1. 从空气或线缆中截获；对于未加密的流量，坐在网络（有线或 WiFi）上观察未加密的 HTTP 流量很容易。

    2. 利用网站上的跨站脚本漏洞。


    第一种技术超出了本书的范围，因此我们不讨论。


    攻击容易受到跨站脚本攻击的网站使得获取会话 ID 变得简单。如果攻击者可以访问现有的服务器（假设通过非法手段），他可能可以在页面上嵌入一些简单的 JavaScript
    代码，将会话 ID 发到远程服务器，以便在那里进行收集。


    执行此操作的代码很简单：


    ```

    ![Image](img/147-1.jpg)

    ```


    此代码将利用跨站脚本漏洞将网站的所有 cookie 发送到远程站点，攻击者随后可以使用该数据伪装成用户。


    你可以通过始终调用 `session_regenerate_id(true)` 来保护用户免受此类攻击。然而，如果你受到跨站脚本攻击，那是首要解决的问题。在函数调用的第一个参数中添加值
    `true`  PHP 将删除旧会话 ID，从而最大限地减少被利用的概率。


    # 验证输入 (Validating Input)


    记住，你可以将所有这些漏洞分解为四个字：验证输入，过滤输出。验证输入不仅仅涉及数据库。它也可以指程序逻辑。过滤输出很大程度上由确保浏览器不被滥用组成，之前的许多场景已经涵盖了这一点。然而，验证输入并不总是属于易于定义的类别。


    开发者构建基础模板系统的一种方法是创建一个通用的主页，然后接受查询字符串中的值来确定要包含的具体内容。虽然这是一种原始的内容管理形式，但使用这种机制是可以的。然而，实现方式可能会引起问题。


    在示例中，你将在文档根目录下有一个名为 `/scripts` 的目录，并在文档根目录下有一个 `index.php` 文件：


    ```

    ![Image](img/147-2.jpg)

    ```


    此处的代码将包含 `$_GET[''page'']` 变量指定的任何文件。这种攻击在 Linux® 上非常有趣，因为文件系统中一切都是可用的。在集成文件系统
    (IFS) 上同样有趣，尽管它不包含整个系统，但它有很多有趣的文件。攻击者找到这些文件最简单的方法之一是通过位于 `/www/zendsvr/conf/httpd.conf`
    的 Web 服务器配置文件或 `/www/zendsvr/log` 中的日志文件。


