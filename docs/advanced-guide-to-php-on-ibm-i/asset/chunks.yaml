    手动逐进整个程序以到达你想要执行的代码段是非常耗时的。因此，设置断点可以让你直接跳转到代码的特定位置。点击 `Resume` 或按下 `F8` 将继续执行，直到遇到另一个断点或程序运行结束。这些操作听起来应该很熟悉，因为它们与
    `IBM\ i\ Debugger` 的工作原理相似。


    你使用 `Resume` 的另一种情况是你已经完成了代码的调试，并希望让当前请求执行完毕。引擎将继续运行直到请求完成，除非遇到断点或执行被暂停。


    `Suspend` 用于在引擎正在运行且你想在当前时间点停止它时。通常情况下，除非你想定期检查失控的循环，否则你不会经常使用此控制按钮。`Suspend`
    控制对于调试 Java 进程或长生命周期的任务更有用。在 PHP 中，这可能是某种 CLI 程序或套接字服务器。但这些类型的程序通常不是用 PHP 构建的，因此你可能不会经常使用
    `Suspend`。


    `Terminate` 用于停止当前请求的执行。它基本上同于在代码中放置 `exit()` 调用。然而，当你终止一个请求时，关机钩子（shutdown hooks）将不会运行。你通常会在以下调试场景中使用此控制按钮：如果继续调试，你将修改程序外部的数据。这种场景可能包括数据库插入、缓存更新或类似的继续调试会导致不可接受的操作。


    接下来的三个选项是程序流操作，这基本上是使用调试器的意义所在。它们允许你逐行执行程序并观察正在发生的情况。


    `Step Into` 将跟随程序执行流进入当前行上调用的任何函数或方法（图 4.11）。它与 `IBM\ i\ Debugger` 中的 `F22` 相同。当你“进入”一行代码时，如果该代码没有嵌套调用，调试器将无处可去。


    ![Image](img/115-1.jpg)


    *图 4.11：当前代码行和嵌套调用*


    然而，当发生函数或方法调用时（如图 4.12 所示），“进入”将深入该函数并显示该代码行中的执行流。


    ![Image](img/115-2.jpg)


    *图 4.12：调用函数*


    函数调用内部的代码将一直执行直到完成，然后正常返回（图 4.13）。


    ![Image](img/116-1.jpg)


    *图 4.13：指定输出以完成函数调用*


    `Step Over` 与 `Step Into` 类似，不同在于当当前执行是一个函数或方法调用时，调试器不会进入内部。它会执行该函数，但不会进入。这在你不需要深入请求的完整执行流时非常有用，因为你已经知道函数内部发生了什么，或者正在发生的事情与当前任务无关。`Step
    Over` 允许你跳过这一点。`Step Over` 类似于 `IBM\ i\ Debugger` 中的 `F10`。如果你想立即从函数返回，可以使用 `Step
    Out`。


