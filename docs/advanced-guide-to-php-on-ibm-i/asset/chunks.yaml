    I am not a cryptographer and am not well qualified to discuss the ins and outs
    of various encryption mechanisms. Generally, though, the higher the number the
    better. Triple DES is better than DES. Rijndael-256 is better than Rijndael-128.
    This is definitely not a hard-and-fast rule, but because the numbers in a cipher
    will typically refer to the key size, this is usually true. And the larger the
    key size, the more complex the encrypted value will be.


    Additionally, when determining which cipher to use, you should check out the NIST’s
    Advanced Encryption Standard, or AES. AES is used as the means to encrypt sensitive
    government information. Many different designs were submitted to the NIST; the
    one that eventually won was the Rijndael cipher, and the standard is a variant
    of that. The variance is that the block size is restricted to 128 bits, whereas
    the Rijndael cipher can support virtually any bit size that is a multiple of 32
    bits.


    The second value is the shared secret key. As the php.net manual says, this value
    generally should not be an ASCII string; it should be a random string that is
    as long as the requested cipher can handle. Your key is not secure if it is in
    ASCII.


    The third parameter is the value to be encrypted. Simple.


    The fourth parameter is the mode the cipher will use. This can get a little complicated,
    so we will look at that in more depth later.


    When you run the code, you will get the following output:


    ![Image](images/160-1.jpg)


    This is the base64-encoded version of the data you encrypted. (I used base64 encoding
    only because the raw data would not print well in a book.) When storing data in
    a database, you can use either the raw contents or some other encoded version.
    It does not really matter. What matters is not how you store the value but that
    the value is sufficiently indecipherable. In other words, with a good cipher,
    you should be able to place your content anywhere on the Internet and it would
    be safe.


    To decrypt the data, perform the same process but in reverse. You pass the encrypted
    data into a decryption function along with your secret key:


    ![Image](images/160-2.jpg)


    Running this code produces the output of the decrypted value:


    ![Image](images/160-3.jpg)


    That is symmetric key encryption. Easy, right? Not quite.


    What will happen if you encrypt this value repeatedly? You will get the same results
    because of the mode you are using: ECB, or Electronic Code Book. The problem with
    this mode is that it encrypts each block, or chunk of data to be encrypted, separately.
    What is the effect of this?


    ![Image](images/161-1.jpg)


    (This example is derived from “Encryption operating modes: ECB vs CBC” at *[http://www.adayinthelifeof.nl/2010/12/08/encryption-operating-modes-ecb-vs-cbc](http://www.adayinthelifeof.nl/2010/12/08/encryption-operating-modes-ecb-vs-cbc).)*


    Here is the output of this code:


    ![Image](images/161-2.jpg)


    Look at lines 1 and 5. Notice anything? Yep. Repetition. This means that this
    method can potentially leak data.


    To solve this problem, you change the mode from ECB to CBC, or Cipher Block Chaining.
    CBC applies one block of data against the previous block. You can find more information
    online, but the main difference is that ECB encrypts each block independently,
    and CBC encrypts the next block against the previous block.


    But the issue with CBC is that it requires another piece of data called an *initialization
    vector,* or *IV.* The easiest way to explain the IV is that it is similar to the
    salt you used in the hashing mechanism earlier. The IV gives the cipher a different
    starting point. Like salt, the IV can be passed along with the data. It does not
    need to be unique but, as with salt, it is best if it is. The IV helps hide the
    key from an attacker. If you fail to provide an IV value, PHP will continue to
    encrypt your document but will set a NULL IV and give you a stern warning.


    Creating the IV is easy. First, you need to know the length of the IV required
    by the cipher and the block mode. To obtain the length, ask mcrypt\_get\_iv\_size()
    for the cipher and the block mode you are using. Next, you create the IV. You
    can use any mechanism as long as it is the size of the IV length required, but
    using mcrypt\_create\_iv() is the preferred method. That said, IBM i does not
    support the default mechanism for generating the random number, so you must specify
    either MCRYPT\_RAND or MCRYPT\_DEV\_URANDOM as the source:


    ![Image](images/162.jpg)


    Running the code outputs the following:


    ![Image](images/163-1.jpg)


    When you run the code again, you get this:


    ![Image](images/163-2.jpg)


    Completely separate results. This is because the IV is different in each one.
    So although the key is the same, the different IV produces dissimilar output.


    So where do you store the IV? Anywhere you want. Like the salt, it is intended
    to be publicly available. You can place it at the beginning, middle, or end of
    the encrypted string, as long as you can extract it before decrypting. You can
    also store the IV in a different field in the database or in a session cookie.
    But the key is to ensure that the IV is available when decrypting the document.


    Let’s wrap up by appending the decryption code to the encryption code:


    ![Image](images/163-3.jpg)


    Now when you run the code, you get the following output:


    ![Image](images/164.jpg)


    As you can see, you now have your decrypted data.


    So, what have you learned here?


    *   When in doubt, ask the NIST which cipher to use. The AES/Rijndael ciphers
    are a good starting point.


    *   Use the highest bit level you are willing to spend CPU time on.


    *   Use the CBC mode and an initialization vector.


    ![image](images/line.jpg)


    [¹](#009_Chapter05.html#fn-1) These numbers vary widely depending on the source
    of the information. However, CSRF is usually near or at the bottom of successfully
    implemented attacks.


    [²](#009_Chapter05.html#fn-2) This may not be always true; Crc32 is not better
    than SHA-1. But within like hashing algorithms, this will generally be true.


