    6.9](#010_Chapter06.html#fig6-9)).


    ![Image](images/185-3.jpg)


    *Figure 6.9: Using the relative position to offset the gray box downward*


    Negative numbers work too:


    ![Image](images/185-4.jpg)


    [Figure 6.10](#010_Chapter06.html#fig6-10) shows the resulting output.


    ![Image](images/186-1.jpg)


    *Figure 6.10: Using negative numbers to shift the offset of the box upward*


    Relative positioning is as simple as that.


    Absolute positioning will position an element from the top of the document, not
    the view screen. So by setting an element with an absolute value, you can still
    scroll the document, but it will not be positioned in relation to its parent element:


    ![Image](images/186-2.jpg)


    This code prints out the result in [Figure 6.11](#010_Chapter06.html#fig6-11).


    ![Image](images/186-3.jpg)


    *Figure 6.11: Result of HTML with absolute positioning*


    Notice that the container DIV collapsed as well. This is because most block elements
    will expand and contract to hold content. The box DIV is not confined to the container
    DIV anymore, so nothing is pushing against the boundary of the container DIV.


    Fixed positioning is incredibly useful for pinning items to the screen, such as
    a toolbar or footer. It works exactly as the absolute position does until you
    start scrolling. The absolute positioned elements will scroll with the page, but
    the fixed positioned element will stay in place. That is because its measurement
    is to the viewport and not the document, like with absolute measurements.


    # JavaScript


    JavaScript is a rich and powerful language. To learn about the richness and depth
    of JavaScript, buy a JavaScript book. This book is about PHP.


    But still, if you are doing web development, you will need to know some JavaScript.
    From a development perspective, JavaScript lets you run programming logic on the
    browser. You will generally use this language to manipulate the HTML Document
    Object Model, or DOM, to give users a more responsive and interactive experience
    with your application. But you can do a lot more, including running JavaScript
    on the server. For the purpose of our discussion here, we will focus only on the
    basics and how they relate to web design.


    You can embed JavaScript into a page on a web application in two ways. The first
    is by directly embedding it:


    ![Image](images/187.jpg)'
