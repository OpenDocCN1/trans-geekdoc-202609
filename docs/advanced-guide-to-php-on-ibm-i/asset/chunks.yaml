    这是一件好事。这意味着在 IBM i 上的 `PHP` 正在接近 Linux 系统的水平。虽然很多功能是 IBM i 特有的，例如 `Toolkit`，但与过去相比，那种“为了解决性能问题而在
    IBM i 上执行某些操作作为权宜之计”的日子已经大大减少了。因此，让我们来看一下你可以采取的一些通用策略，以使你的应用程序响应更快。


    ## 缓存


    最可能提高你应用程序性能的单一最大因素就是缓存。在我看来，缓存通常意味着程序员未能设计出一种高效的方法来处理某个问题。事实并非如此，但这是我采取的方法。我见过太多次性能问题，其解决方案仅仅是“我们直接缓存它吧”。诚实地说，这种方法在某些时候是有效的。但是，如果你将其作为解决意料之外的性能问题的事后补救，那么它就不是正确的解决方案。首先，努力让出现问题的代码变得高效。然后实现缓存。或者提前做好准备。无论哪种方式，不要说“我们会直接缓存它”。


    有时候，你可能预见到某个操作根本没有更快的执行路径，因此你需要缓存结果。这就是审慎考虑问题的一个例子。但很多时候，开发者在实现某些功能后发现问题，出于懒惰，就会直接求助于缓存来保全自己。


    另一方面，也有一个截然对立但同样有效的观点。你应该尽力确保计算不会被重复执行。在数据没有变化时计算两次结果，可能表明程序员在设计系统时存在疏忽。与其将缓存作为懒惰的备选方案，那些设计需要反复执行离散部分的应用程序的开发者是缺乏远见的。


    重复是你的敌人。懒惰也是如此。设计你的应用程序使其易于被缓存。


    虽然缓存很容易，但缓存失效（cache invalidation）很难。有一句俗话说：“计算机科学中有三件困难的事：缓存失效、命名和差一错误（off-by-one
    errors）。”原话省略了最后一个，但这个变体更有趣。我总是选择这个更有趣的版本。缓存很容易，缓存失效很难。它之所以是因为没有哪个缓存条目是孤立存在的。失效一个缓存条目不可避免会影响其他内容。当你缓存了基于相关数据的计算条目时，这一点表现得最为明显。如果一个缓存项失效或其生存时间（`TTL`）过期，所有其他缓存项应该同时重新计算。否则，你的应用程序可能同时根据旧的缓存条目和一个新的缓存条目运行。在很多情况下，这种情况可能并不是世界末日，但只需要稍微思考就能构思出一个可能导致灾难的场景。


    缓存几乎总是如图 10.2 所示的方式进行的。


    ![Image](img/297-1.jpg)


    *图 10.2：数据缓存流程*


    以下是其在代码中的形式：


    ![Image](img/297-2.jpg)


    数据可以是经过处理的数据，也可以是输出。数据也可以是应用程序执行流内部的，也可以是整个页面（全页缓存）。我们不会深入探讨这个主题，因为已经有数百万个网页涵盖了
    `PHP` 中的缓存（根据 Google 的统计有 700 万个）。


    这些页面全是错误的。


    ## 预处理


    嗯，大部分都是。我也不应该说典型的缓存方法论是错误的。但它被过度使用了，用来取代了某些其他方法。


    ## 在常规计算中


    我们稍后会讨论缓存，但让我们先看看如何通过在操作期间或之后不久计算某些操作来提高其速度。我可以就理论和选项提供长篇大论，但有时从一个故事开始是最好的。所以我将谈谈
    Twitter。


    这个故事的一部分基于 `High Scalability` 博客上的一篇文章（参见 `[`highscalability.com/blog/2013/7/8/the-architecture-twitter-uses-to-deal-with-150m-active-users.html`](http://www.highscalability.com/blog/2013/7/8/the-architecture-twitter-uses-to-deal-with-150m-active-users.html)`）。当
    Twitter 出道时，它有一个 `MySQL` 服务器，后来它移动到了更多的 `MySQL` 服务器，并不断壮大。人们正如你预期的那样，在关系数据库系统中读取他们的时间线。简而言之，就是
    `JOIN` 一个关系表和一个推文表，并在用户表上带有一个 `WHERE` 子句，随后在推文表上进行 `LIMIT` 和 `ORDER`。这对于基本操作是可以的，但当你变得流行或数据开始变得复杂时，这个简单的查询可能会消耗大量资源。


    所以 Twitter 将 `SELECT` 语句移动到只有一张表（这是一种粗略描述）。该表包含推文和接收者。当消费者请求他们的时间线时，Twitter 并不是对一组表进行大型
    `JOIN`，而是对一个表（或类似的）进行一次查询，唯一的 `WHERE` 是用户 ID，并且仅在该张表上执行 `LIMIT` 和 `ORDER`。


    那么推文是如何进入该表的呢？当一个人发布推文时，他的粉丝会从数据库中被提取，并将推文插入到每个粉丝的个人表中。通过在写入时进行一次这种计算，Twitter
    节省了大量的计算时间。


    Magento 也采取了类似的方法，它称之为 `indexes,`，但它其实不是。它实际上是一个预计算表。电子商务中的定价规则可能极其复杂。因此 Magento
    构建了表，其唯一目的是允许创建 `WHERE` 子句，而不是在运行时运行极其复杂的查询。


    为了让你明白我的意思，请推推眼镜并做好准备。这是 Magento 用于构建一个预计算表的查询：


    ![Image](img/299.jpg)


    ![Image](img/300.jpg)


    以下查询将值预计算到临时表中，随后是更多的处理，然后清除实际表并将值插入其中：


    ![Image](img/301-1.jpg)


    你现在觉得你有问题了。


    所有这些计算的原因是为了稍后当有人查看目录页面时，可以通过 `SELECT` 语句上的 `JOIN` 获取价格，而不是必须运行整个初始的巨型查询：


    ![Image](img/301-2.jpg)


    尽管这个查询仍然很大，但它比实际所需的逻辑要简单得多，因为我们预处理了结果并查询了计算出的值，而不是一次性执行所有逻辑。此外，此查询更好地利用了索引，并让查询规划器更容易确定执行查询的快速方法。结果，由于查询是紧凑且为了使用这些编译后的计算表而构建的，页面响应时间得到了提高。


