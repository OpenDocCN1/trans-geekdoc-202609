- fmt: '

    The code performing this action shows something cool you can do with jQuery that
    you cannot do with standard DOM manipulation: jQuery will accept XML as an argument
    and return a properly declared HTML element. In this case, it creates a proper
    `<option>` jQuery element, which you can then easily set the value for in the
    `text()` method call. This is a simple but useful feature.


    In the `<select>` tag declaration, you also attach an event to `onchange`, which
    is triggered anytime that `<select>` tag is modified. You set the `getTime()`
    method as the listener; `getTime()` will read the selected value for the `<select>`
    item and call the appropriate `URL` to retrieve the current date for the specified
    time zone.


    To do that, you declare a JavaScript object by using `JSON`, directly setting
    the object property value for function as `gettime` and the value for `zone` as
    the currently selected time zone.


    Next, you use the jQuery object’s helper method called `param()`. This method
    will serialize a JSON object to a URL query string-based format. Then, as with
    your previous Ajax call, you put a function in the second parameter that will
    be executed upon successfully calling the URL (that is what the second parameter
    is for). Now, you set the text to the result of the Ajax call in the `<span>`
    element with the ID `current-time`.


    The last Ajax functionality we will examine is the replacement of items in the
    DOM via Ajax. When working with Ajax, you have two primary means of interacting
    with the page. The first is to implement a lot of custom logic on the front end,
    as you just did. The second is to generate a layout on the server side and inject
    it into the page by using DOM selection. This method is probably easier for a
    server-side developer to comprehend.


    To demonstrate this, let’s start with a shell of a page:


    ![Image](images/201-1.jpg)


    This page has two dynamic pieces: the authentication portion and the content portion.
    Both will display different data based on whether the user is logged in.


    First, the content. You will reuse your time zone code; for clarity, you will
    hide this code in a snippet called `getTimeZones()`. But you will print that only
    if the user is logged in.


    ![Image](images/201-2.jpg)


    Next is the authentication code. It is a little complex, but bear with it because
    it is worth understanding.


    ![Image](images/202.jpg)


    Let’s break this down into pieces. First are three case statements to the `switch`
    statement. The first case checks whether the request is a `POST` statement. A
    `POST` statement will indicate that an authentication attempt is in progress.
    If the `POST` value is longer than zero characters, set the `$_SESSION` variable
    and move on. Because you do not have a `break` in your case statement, the next
    case statement is checked to detect whether `$_SESSION[''name'']` is set. Since
    the case statement would be on a validated `POST` request, it will also execute
    this code block. If the request is not a `POST` but `$_SESSION[''name'']` is set,
    then this code will be executed as well.


    When that code is executed, it will print the escaped name the user provided (you
    do not want to be vulnerable to cross-site scripting). Then, you render some JavaScript
    code to populate the main page’s content DIV with the contents of `/content.php`,
    which should provide the authenticated results.


    The last action (the default) will take a bit more examination to understand what
    is happening. First, you print some standard HTML components, each with an ID
    assigned to it. You then assign an anonymous function to the click event. When
    the click event is triggered, you initiate another `load()` call on the “authentication”
    DIV, as you did in the main page. The difference here is that you add a JSON-encoded
    object that contains the value of the `INPUT` element `user-name`. The value in
    the `user-name` `INPUT` element instructs the `load()` call to switch from `GET`
    to `POST` and populates the `POST` fields with the values in the JSON-encoded
    object.


    Might want to read that paragraph again. There are a number of moving parts here,
    but because you are using the `load()` function instead of the `getJSON()` function
    with a bunch of additional JavaScript code, you can keep the presentation code
    on the server side. If you are unfamiliar with JavaScript or do not want to write
    verbose JavaScript code, this method is worth considering.


    One benefit of this approach is that, because you get the shell of the website
    up before any processing occurs, your web application users think the site is
    faster than it actually is. That perception is more important, from a user perspective,
    than reality if your site is slow.


    # Conclusion


    This has been a whirlwind tour of the various options available to you when working
    with the browser. Our goal was to work through a sampling of simple and intermediate
    activities for HTML, CSS, and JavaScript. This chapter was not intended to take
    you from A to Z on any of the topics we covered, but rather to give you some starting
    points that you can further explore. Along the way, I hope that I provided interesting
    pieces of information that you might need to consider when building a user interface.


    ![image](images/line.jpg)


    [¹](#010_Chapter06.html#fn-1) The list-item display style is similar to the standard
    block display style, with a few little additions.


    [²](#010_Chapter06.html#fn-2) Using your browser’s development tools is a great
    way to see the available style definitions for a given element.


    # 7


    # Test-Driven Development


    Have you ever run into a situation where you built something or made a change
    somewhere only to have it break something else? If your answer is no, wait until
    you graduate and get a job. It is bound to happen, and sometimes it will happen
    with catastrophic effects.


    Part of the problem is that we do not often test our applications very well. Yes,
    we press refresh and maybe use a debugger, but do we have a *system* for testing?


    But beyond using a testing system, we must go a little deeper. To best use our
    testing system, we have to build a testable application. A testable application
    is generally more complicated than the typical PHP application. However, a testable
    application pays for itself exponentially because it lets us repeatedly test all
    parts of our application to verify that they are working from start to finish.


    Test-driven development is the practice of building out an application based on
    tests, rather than building it in a fluid manner. The way we naturally build applications
    is that we have a problem, we figure out how to solve it, we build the application,
    and then we test it. Test-driven development flips that process around. Instead
    of initially building out the application, we build the tests first and then write
    our code to pass the tests. It sounds a little counterintuitive, because all through
    our schooling years, the last thing we did before going to the graduation party
    was be tested. However, building our tests at the outset provides a lot of benefits.


    First, it forces us to think of *how* we intend to use the functionality that
    we are creating. Second, if we are building our tests before building out the
    application, we are more likely to consider the required range of inputs, making
    us more likely to test edge conditions. This testing will lead to more stable
    software. Third, it makes us more productive. Unit testing has been shown both
    in studies and in real life to make developers more productive overall, and it
    is one of the few practices that have virtually no downside.

    '
