    这个例子的问题在于，这两个 trait（特性）都有一个名为 `toXml()` 的方法。所以问题是，你应该使用哪一个方法？这不是你可以根据上下文来定义的的东西。换句话说，你不能在一个地方向
    `Util\DOMDocument` 请求该方法，而在另一个地方向 `Util\ToXml` 请求它。这是在类级别定义的。


    以下是 `Util\DOMDocument` 的代码：


    ![Image](img/20-3.jpg)


    与 `UtM\ToXml` 特性一样，这段代码在 `toXml()` 方法中返回 XML，但它添加了一个独立的方法，通过使用 `DOMDocument` 核心类而不是
    `SimpleXML` 来实现这一点。然后你将这个特性添加到 `Filesystem\File` 类中：


    ![Image](img/21.jpg)


    但现在当你运行脚本时，你会收到一个错误：


    ![Image](img/22-1.jpg)


    所以你必须修正这种冲突。为了这一点，你使用了一个不为人知的操作符 `insteadof`。它的用法非常简单：


    ![Image](img/22-2.jpg)


    你现在已经解决了冲突，代码将按照预期运行。


    # 闭包 (Closures)


    闭包并不是纯粹意义上的面向对象编程。它们是函数，但具有基于 OOP 的实现。然而，我将它们包含在这一章中有两个原因。第一个仅仅是因为在书中没有其他地方可以放置它们了（额外增加一个关于函数的章节对书并没有多大帮助）。第二个原因是，闭包通常用在更成熟的架构中，而更成熟的架构往往是由对象驱动的。是的，你可以很容易地反驳这一点——字符串也不是对象，而且在成熟的架构中它们的使用频率比闭包高。确实如此，但我是作者，我有权决定把什么放在哪里。


    闭包还有另一个名字，可能会让它更容易理解：匿名函数（anonymous function）。正如你可能推测的那样，匿名函数没有名字。在类中定义方法时，你会给它起一个名字，如
    `getThis()` 或 `setThat()`。闭包并不绑定到类；它绑定到一个变量。


    定义一个闭包非常简单。不要给函数命名，而是将其赋值给一个变量。当你想要调用该函数时，像调用命名函数一样调用该变量：


    ![Image](img/23.jpg)


    这正如预期的那样，输出：


    ![Image](img/24-1.jpg)


    那么这样做的意义是什么？首先，要小心过度使用。很容易过度使用闭包。定义的 OOP 结构更佳。从测试的角度来看尤其是如此。然而，闭包通常只是被用作回调函数。对于一次性的定义功能片段，它们非常有用。让我们先看一个基于函数的例子，然后再看一个更详细的面向对象的例子。


    对于第一个例子，你将使用 `array_walk()` 函数通过 `strtoupper()` 将数组中的所有值转换为大写。你通常通过遍历数组中的值来实现这一点：


    ![Image](img/24-2.jpg)


    足够简单，而且完成了任务。你可以用闭包做同样的事情：


    ![Image](img/24-3.jpg)


    前面的示例调用了函数 `array_walk()`，第一个参数提供数组，第二个参数提供回调函数（在本例中是一个闭包），它会为数组的每个成员被调用。


    到目前为止一切良好。但现在假设数组是多维的。与其像在你自己的代码中那样输入解决方案，不如看看原始的 `foreach()` 循环，并考虑你需要做什么。如果你喜欢，甚至可以编写处理递归的代码。或者，如果你是个虐待狂的话。


    脑子里有数了吗？它可能并不美观。


    好。现在让我们来看一个使用闭包将数组值转换为大写的例子：


    ![Image](img/25.jpg)


    简单直接。


    那么这样做的意义是什么？首先，要小心过度使用。很容易过度使用闭包。定义的 OOP 结构更佳。特别是从测试的角度：


    ![Image](img/26-1.jpg)


    但是，通过 `use` 关键字，闭包可以携带数据：


    ![Image](img/26-2.jpg)


    正如你所推想的，通过 `use` 我们可以为闭包提供上下文：


    ![Image](img/26-3.jpg)


    ```

    $f 是 Closure 的一个实例

    ```


    不相信我吗？通过以下代码验证：


    ![Image](img/26-4.jpg)


    运行这段代码输出：


    ![Image](img/27-1.jpg)


    这是一个为了使用而存在的特殊类，它实现了 `_invoke()` 方法——这是 PHP 中添加的一个魔法方法，允许你像调用对象一样调用它：


    ![Image](img/27-2.jpg)


    所以在 `use` 变量和参数的战争中，变量赢了。


    到此结束我们对基础 OOP 的介绍。在下一章中，我们将从特性领域转向理论领域。


    ![image](img/line.jpg)


    [¹]技术上，根据良好的 OOP 设计，具体的品种应该是扩展的类定义（例如 `Corgi extends Dog`，`Shepherd` 也是，以此此类推）。


    [²]虽然这段代码可以运行，但将类定义和执行代码混合通常被认为是一种坏做法。此示例仅供演示。


    # 2


    # 设计模式 (Design Patterns)


    现在让我们从具体的对象实现转向更抽象的概念，从设计模式开始。设计模式在过去几年中非常流行，谁还没有在听到别人说“你不知道什么是设计模式？”时感到过不从心呢？诚实地说，我不知道。我是从维基百科随口说的（参见
    [`en.wikipedia.org/wiki/Memento_pattern`](http://en.wikipedia.org/wiki/Memento_pattern)）。*


    尽管许多设计模式的支持者很烦人，但理解和实现设计模式可以带来很多益处，特别是我在这里介绍的一些模式。


    设计模式与软件完全无关。它是一种由建筑师 Christopher Alexander 引入的建筑过程。它指出设计模式存在于许多不同的实例之中。


