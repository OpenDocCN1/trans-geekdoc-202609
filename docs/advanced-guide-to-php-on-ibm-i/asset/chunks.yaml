  trans: "\n然而，在开始调用程序之前，你可能需要额外做一些，特别是当你在多个用户之间使用同一个连接时。虽然不是必须的，但在实例化连接时设置 `InternalKey`\
    \ 参数仍然是一个好主意。这样做可以让你的应用程序在请求之间维持一个唯一的作业标识符，从而能够维护游标和打开的文件句柄等。你可以指定此唯一 ID，但这里有其他三种方法：\n\
    \n*   设置会话并忽略它；`Toolkit` 适配器将自动将其分配给 `session ID`。\n\n*   根据用户名设置会话：\n\n    ![Image](img/275-1.jpg)\n\
    \n*   根据会话中的唯一值设置会话：\n\n    ![Image](img/275-2.jpg)\n\n虽然设置 `InternalKey` 值无疑是优选方法，如果你没有指定它，则必须给\
    \ `Toolkit` 提供一些替代指令：\n\n![Image](img/275-3.jpg)\n\n你的连接必须使用 `InternalKey` 或设置\
    \ `stateless` 服务参数；否则，你的程序调用将无法工作。`stateless` 参数告知 `Toolkit` 连接在服务调用之间将不会维持信息，这使得它有点像\
    \ HTTP。通常，你应该使用 `InternalKey`，但如果省略了它，你必须告诉 `Toolkit` 调用是无状态的。\n\n连接创建后，你有许多函数可以从\
    \ `ToolkitService` 类向系统发起调用。它们是 `PgmCall()`、`ExecuteProgram()`、`CLCommand()`、`CLInteractive()`、`qshellCommand()`、`ClCommandWithOutput()`\
    \ 和 `ClCommandWithCpf()`。要执行 `CL` 命令，你可以这样操作：\n\n![Image](img/276-1.jpg)\n\n如果你想调用程序，将需要提供某种输入。为此，让\
    \ `ToolkitService` 类为你创建一个参数。它的实现方式类似于工厂设计模式。这种说法并不完全准确，因为 `ToolkitService` 拥有多个函数，所以它没有遵循单一职责原则，而真正的工厂\
    \ `Factory` 的职责仅是创建对象。\n\n`ToolkitService` 中定义了一部分方法来帮助创建参数对象。这些方法以关键字 `addParameter`\
    \ 开头，后跟类型。因此，如果你需要一个字符参数，就调用 `AddParameterChar()`；如果你需要 `int32`，则调用 `AddParameterInt32()`。至少，这些方法需要一个\
    \ `I/O` 类型和一个注释。`I/O` 类型决定了参数的方向性。它可以是 `in`、`out` 或两者都是。注释通常会与提供的变量名匹配，更多是为了你的方便，而不是系统的方便。事实上，注释仅在调试模式下才会被使用。\n\
    \n要查看如何使用这些参数方法，请查看你的 Zend Server 实例中包含的示例。为了完整性，我们在这里检查一个短示例。供你参考，以下是用于构建 `COMMONPGM`\
    \ 程序的 RPG 代码，摘自 Zend Server RPG 示例：\n\n![Image](img/276-2.jpg)\n\n创建参数需要调用 `AddParameterChar()`\
    \ 方法：\n\n![Image](img/277-1.jpg)\n\n在这里，第一个参数设置方向。第二个参数设置参数的大小，第三个是注释。第四个也是注释。（等等，原文说“第四个是注释”——重读一遍：“第一个参数设置方向。第二个参数设置参数的大小，第三个是注释。第四个也是注释。”）\n"
- fmt: "\nIf you have read [Chapter 2](#006_Chapter02.html#ch-2) (which covers advanced\
    \ OOP), particularly the section on Dependency Injection, you will have noticed\
    \ that the examples in the previous section here were already using Dependency\
    \ Injection. The `ToolkitService` object was injected via the constructor. You\
    \ were not managing it automatically. In this section, we will briefly look at\
    \ how to use a `DI Container` to couple the service classes with the `Toolkit`.\n\
    \nWait a second! Didn’t I say that coupling is bad? No. Coupling is not bad. *Tight*\
    \ coupling is bad, or more accurately, apt to decrease the maintainability of\
    \ your software. Tight coupling occurs when a class expressly defines the dependency\
    \ inside itself, usually meaning that it must retrieve that object from somewhere\
    \ hard-coded. You can see this if you define a call to `ToolkitService::getInstance()`\
    \ in your class. *That* is tight coupling and will probably make your application\
    \ more difficult to maintain in the long run. Loose coupling occurs when the class\
    \ defines the dependency it needs and you inject that dependency. A class without\
    \ dependencies will probably not have much use.\n\nAs you might have noted, however,\
    \ sometimes managing those dependencies can be difficult. Perhaps if you have\
    \ one dependency you can do it. But even so, you will not automatically have a\
    \ means of transporting that dependency to where it is needed.\n\nThat is where\
    \ a DI Container comes into play. Rather than manually injecting those dependencies,\
    \ you request an object from the `DI Container`, and it satisfies the dependencies\
    \ for the class for you. If this is a-little fuzzy, I suggest you read through\
    \ [Chapter 2](#006_Chapter02.html#ch-2) again, which covers advanced OOP, before\
    \ moving on.\n\nTo demonstrate this with the `Toolkit`, we will use the `DI Container`\
    \ that you defined in [Chapter 2](#006_Chapter02.html#ch-2). As in that chapter,\
    \ I will state that the `DI Container` created there is not intended for production\
    \ use and that other (supported) `DI Container` options are available for you.\
    \ This one was created to provide insight into how a `DI Container` works, rather\
    \ than being fully functional. But it is a valid `DI Container`, so if you want\
    \ to use it, you will receive no criticism from me.\n\nA key point to managing\
    \ your container is that you want to manage your dependencies via configuration.\
    \ Sometimes people will use `XML`, `JSON`, or `YAML` as a means of configuring\
    \ it. All of these are valid options, but my preference is to keep it simple,\
    \ keep it coded. That way, the opcode cache will store the configuration in memory,\
    \ so you will not have the overhead of reading it from the `IFS` each time. But\
    \ if you prefer to store it in `XML` to help with validation or to give it a more\
    \ readable format, you will be fine as well. \n\nIn the case of the `Toolkit`,\
    \ you need to define the dependency in a manner that allows calling the `getInstance()`\
    \ method on `ToolkitService`. You wrote the class in such a way that allows for\
    \ this. The configuration is stored in a configuration file, as follows:\n\n![Image](images/282-1.jpg)\n\
    \n(From here on, we will presume that an autoloader has been defined and is working.)\n\
    \nThis configuration states that when the `ToolkitService` class is listed as\
