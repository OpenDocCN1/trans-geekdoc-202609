    # **1**


    # A Re-Introduction to Basic Concepts


    We will start this section with a (very) quick re-introduction to the basic concepts
    of object-oriented programming (OOP).


    Note: My first book about PHP on the IBM i® operating system (co-authored with
    Jeff Olen) contained a chapter that introduced the basics of object-oriented programming
    (OOP), along with some of the reasons you might use OOP instead of procedural
    programming. If you do not have a basic understand of OOP, it would be wise to
    obtain a copy of that book *(The IBM i Programmer’s Guide to PHP,* MC Press, 2009)
    to make sure you have the basics down. Most of what we will discuss in [Chapters
    1](#005_Chapter01.html#ch-1) and [2](#006_Chapter02.html#ch-2) will be either
    new (since *The IBM i Programmer’s Guide to PHP* covered PHP 5.2) or more theoretical.
    In [Chapter 2](#006_Chapter02.html#ch-2), we will also take a closer look at using
    PHP’s advanced functionality.


    # Classes and Objects


    When it comes to OOP, the most basic discernible concept is the class. The class
    is the foundation of everything that follows it. You cannot have an object without
    a class. An interface is largely pointless without a class. Abstract classes refuse
    to instantiate. Sometimes that class might simply be a definition that says an
    object of said type can exist, and other times it can be part of a much larger
    grouping of functionality.


    As a general starting point, think about a class as the definition of a reference
    in an application to a real thing. Although, in practice, objects rarely are accurate
    representations of a thing, it is a good starting place for your understanding.
    It is much the same as in real life.


    Consider from within the world of biology, which has many different taxonomic
    groups, such as Plants, Fungi, and Animals. You can break down these groups into
    even more distinct categories; for example, you can sort the Animal group into
    Fish, Birds, and Mammals, and then divide the Mammals group into yet more distinct
    categories like People, Dogs, and Kittens. These are examples of classes. They
    are definitions of what could be. An object is when you give form to that definition.
    You do not just have a person, but you have a “Kevin” or a “Bob.” An individual
    can be likened to an object, whereas taxa can be likened to classes. It is the
    relationship of definition to instance.


    When defining a class, you can define three general types of things: properties,
    methods, and constants. Let’s look at an example that encapsulates about 80 percent
    of what you will be using when working with OOP:


    ![Image](images/2.jpg)


    # *Properties*


    Think of a property as a variable attached to an instance of a class. It will
    contain only data and no logic. In this case, you have two properties: $name and
    $breed.


    # *Methods*


    Methods are the class version of a function. A method is basically a function
    that is tied to a class, and where you will implement any logic in the class.


    In this example, you have two methods: setName() and setBreed(). The setBreed()
    method contains a little logic that allows only defined breeds to be set for the
    instance’s $breed property. By setting the $breed property as private (we will
    look at what that means in a bit), you ensure that the only way to set that property
    is by calling the setBreed() method.


    # *Constants*


    Classes can contain data that is consistent, or constant, across multiple instances
    of a class. This technique is often used as a means to introduce defined predictability.
    In the previous example, you would not be allowed to enter just any breed[¹](#005_Chapter01.html#fn_1);
    instead, you must enter one that the class has defined as valid. And one of the
    easiest ways of doing that is by providing the constant name rather than a defined
    value.


    The following code shows how you might be tempted to set a breed:


    ![Image](images/4-1.jpg)


    But go back and look at how you defined the constant representing a Corgi. Notice
    the difference? The code example here uses an uppercase “c,” whereas the class
    definition is all lower case. So by providing the string value, you might have
    accidentally introduced inconsistency into your data.


    However, when you use the constant, you are saying, *this dog is a Corgi, according
    to my definition.* And by doing so, you reduce the risk of accidental mistypes
    on the keyboard and provide a much more predictable use case:


    ![Image](images/4-2.jpg)


    # Context


    Context is the nature of our interaction with a definition. When you interact
    with static context, you are working with the class itself. Any logic can be executed
    from any class instance, can affect other instances, or might not be related to
    an instance of that class at all. To some degree, we can liken it to procedural
    functionality within a class structure. This is not entirely true, but it’s accurate
    enough for a base definition. If working from within the object context, you are
    interacting not with the class, but with the instance of that class.


    Two important keywords to know are self and $this. Because self refers to the
    class definition, it is somewhat global in its scope—not global like a global
    variable, but simply globally accessible. You can define the static context as
    a property (self::$breeds) or as a method (self::addBreed($breed)).


    However, you can use the self keyword only when you are working within the class
    definition itself. If you are working within the global context or calling from
    within another class, you must specify the class name to call it:


    ![Image](images/5.jpg)


    When working in the object context, you generally use the keyword $this. It is
    a reserved variable name that simply refers to the current object instance. So
    if you have two instances of the Dog class—one for Macy and another for Sasha—calling
    setName() sets the property for the individual instance, which means that $this->name
    will have a different value depending on the instance of the object that you are
    working from within.


    # Visibility


    When working in OOP, you have three levels of visibility: public, protected, and
    private, as [Table 1.1](#005_Chapter01.html#tab1-1) shows.


    | **Table 1.1: Levels of visibility** |


    | :-- |


    | **Type** || **Description** |


    | Public || Accessible from anywhere the class or instance is available |


    | Protected || Accessible from within a class, object, or child of the class that
    has extended it (we will look at this in more depth when we talk about Polymorphism)
    |


    | Private || Accessible only from within the class or object in which it was defined
    |


    # Abstract Classes


    Sometimes a class can have some functionality defined in it, but not enough to
    let it instantiate. Or it has additional functionality that will diverge at further
    levels of taxonomic completeness. For example, fish can share certain commonalities
    such as fins, scales, and cold-bloodedness. But if you were to add gills to that
    list, you would be wrong. Some fish (called the *lungfish)* have lungs. So although
    you can define the Fish class to a certain extent, you cannot include the breathing
    mechanism because it can be completely different based on the type of fish.


    Therefore, you need to define the Fish class as abstract and add functionality
    in later implementations:


    ![Image](images/6.jpg)


    Then when you later define Fish, you can include the breathing mechanism (e.g.,
    gills for trout and lungs for lungfish).


