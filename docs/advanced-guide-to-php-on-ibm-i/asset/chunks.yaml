    Most likely, you will use the Zend Debugger. The other most common option is XDebug.
    But because you are running on IBM i, you will probably use the Zend Debugger
    because it is part of Zend Server and part of Zend Studio. So it works out of
    the box.


    First, configure the Zend Debugger to allow connections from the host where you
    have installed the debugger, presumably your desktop. Often, the web server will
    look for the regular IP address of your machine, but that does not always work
    if what the debugger detects as your IP address is not actually your IP address.
    In circumstances where you are connecting to a development server, it is possible
    that the IP address the server detects is different from the IP address of your
    desktop. Because debugger security is based on IP addresses that the debugger
    considers valid, `those` are the IP addresses you need to be concerned about.


    Obtaining the IP address of your host is simple. Just upload a file to the remote
    server’s web root with this code in it:


    ![Image](images/106-1.jpg)


    The web server will then print the value for your IP address.


    Next, open the `/usr/zendsrv/etc/conf.d/debugger.ini` file, and add your IP address
    to the `zend_debugger.allow_hosts` setting, followed by a web server restart.
    Now when you initiate a debug session, the server will look at that list. If the
    list includes your IP address, the server will initiate a connection to that IP
    address on port `10137`. Port `10137` is where Zend Studio and the debugger will
    do the actual communication, though you can configure this setting.


    Zend Studio has another open port: `20080`. Connecting to this port produces the
    following output:


    ![Image](images/106-2.jpg)


    The connection allows external tooling to discover what some of the debug settings
    are for the IDE. These values are generally determined automatically, but you
    can set them by opening `Preferences` and choosing `PHP>Debug>Installed Debuggers.`
    From there, select the Zend Debugger, and click `Configure` to display the screen
    in [Figure 4.1](#008_Chapter04.html#fig4-1).


    ![Image](images/107.jpg)


    *Figure 4.1: Zend Debugger Settings*


    You can match the settings with the value that the connection to port `20080`
    reported.


    # Tunneling


    Sometimes the remote server cannot talk to the IDE over port `10137` because often
    a firewall is in place. Usually, the way to get around firewall restrictions is
    to open some kind of tunnel over an approved protocol. For example, when connecting
    to a MySQL server over TCP/IP, you might connect to the server via Secure Shell
    (SSH) and then use that connection to open another connection, which sends data
    over the existing connection to connect to the database.


    With Zend Studio, you can do something similar. But rather than connecting over
    SSH, you connect via HTTP. You make an HTTP request to a specific URL that connects
    to the debugger, and then the debugger sends the debug data back and forth over
    the HTTP connection instead of trying to connect directly to your machine. To
    do this, upload a file to your system called `dummy.php` and place it in the document
    root. The content of this file is available in your Zend Server installation,
    but it will look like this:


    ![Image](images/108-1.jpg)


    A couple of checks are done in the code, but the one call you are interested in
    is the `debugger_connect()` function. That function call initiates the debug tunnel.


    To get tunneling working in Zend Studio, click the `Tunnel` tab and select `Servers,`
    as [Figure 4.2](#008_Chapter04.html#fig4-2) shows.


    ![Image](images/108-2.jpg)


    *Figure 4.2: Servers option to select from Tunnel tab*


    The window in [Figure 4.3](#008_Chapter04.html#fig4-3) will then list the different
    servers that your system is configured to use for debugging. Select the server
    that you want to edit, and click `Edit.`


    ![Image](images/109.jpg)


    *Figure 4.3: Servers that can be used for debugging*


    Next, open the `Tunnel` tab and select `Enable Tunneling,` as in [Figure 4.4](#008_Chapter04.html#fig4-4).
    Now when you click the `Tunnel` button, you have the option of connecting any
    server that you have enabled tunneling for.


    ![Image](images/110-1.jpg)


    *Figure 4.4: Enable Tunneling selected in Tunnel tab*


    Selecting an individual server (as [Figure 4.5](#008_Chapter04.html#fig4-5) shows)
    will initiate the connection to the `dummy.php` file, and if successful, the connection
    light will turn green.


    ![Image](images/110-2.jpg)


    *Figure 4.5: Choosing one server to connect*


    # Initiating a Debug Session


    In Zend Studio, the most basic way to initiate a debug session is to open the
    `Run` menu and select `Debug URL` ([Figure 4.6](#008_Chapter04.html#fig4-6)).


    ![Image](images/111-1.jpg)


    *Figure 4.6: Selecting Debug URL from Run menu*


    [Figure 4.7](#008_Chapter04.html#fig4-7) shows the window that will be displayed.
    Here, you can specify the URL that you want to debug.


    ![Image](images/111-2.jpg)


    *Figure 4.7: Specifying the URL to debug*


    When you click the `Debug` button, you will receive a prompt asking whether you
    want to go to the `Debug` perspective. You will answer “yes.” The debug perspective
    ([Figure 4.8](#008_Chapter04.html#fig4-8)) provides a new set of views that are
    useful when debugging your code.


    ![Image](images/112.jpg)


    *Figure 4.8: Debug perspective*


    Let’s go through each of the more important parts individually. Magento (a popular
    PHP-based e-commerce program) is a good instance of a program where a debugger
    is beneficial, so we will use it as our example since there is a lot of complexity
    involved. If you don’t know Magento, don’t worry.


    In the `Debug` perspective, there is also a `Debug` view. As [Figure 4.9](#008_Chapter04.html#fig4-9)
    illustrates, the `Debug` view contains the stack trace of the current stopped
    place in code, as well as some basic controls.


    ![Image](images/113-1.jpg)


    *Figure 4.9: Debug view*


    It shows the depth of the current call. This is useful for determining where in
    your application you currently are in the execution flow.


    # Flow Control


    The other part of the `Debug` view is the control section ([Figure 4.10](#008_Chapter04.html#fig4-10)).
    This section lets you control the execution of your application. By default, the
    debugger will stop execution on the first line of code, so you can start debugging
    your request from the beginning. From there, you will need to use these controls
    to tell the debugger how you want to proceed.


    ![Image](images/113-2.jpg)


    *Figure 4.10: Control section in the Debug view*


    In order, the controls are:


    *   Remove All Terminated Launches

    *   Resume (shortcut **F8**)

    *   Suspend

    *   Terminate (shortcut **CTRL+F2**)

    *   Disconnect (not pertinent for PHP)

    *   Step Into (shortcut **F5**)

    *   Step Over (shortcut **F6**)

    *   Step Out (shortcut **F7**)


    The last two, Drop to Frame and Use Step Filters, are not used in PHP debugging.


    *Remove All Terminated Launches* is used more for housekeeping than anything else.
    Sometimes when you are going through a debugging session, multiple requests are
    opened, and after they have been completed, they are left in the **Debug** view.
    Clicking this button will remove those requests.


    *Resume* is used to continue executing as normal after the execution has halted.
    Generally, you will use **Resume** in two instances. The first is when you have
    stopped and want to continue executing to a breakpoint. We will cover breakpoints
    in more depth in a little bit, but a breakpoint is basically a place in code where
    you tell the debugger to stop executing.

