    # 基础概念重介绍


    我们将从对面向对象编程（OOP）基本概念的（非常）快速重新介绍开始本节。


    注意：我第一本关于在 IBM i® 操作系统上使用 PHP 的书（与 Jeff Olen 合著）中包含一个章节介绍了面向对象编程（OOP）的基础知识，以及你可能使用
    OOP 而不是过程化编程的一些原因。如果你对 OOP 还没有基础了解，最好获取该书的副本（*The IBM i Programmer’s Guide to
    PHP,* MC Press, 2009）以确保你已经掌握了基础。我们在第 1 章` 和 `addBreed()`。


    ## 常量


    类可以包含在所有实例中保持一致的静态数据。两个需要知道的重要关键字是 `self` 和 `$this`。因为 `self` 指的是类，所以它的作用范围某种程度上是全局的。


    ```php

    self::$breeds

    self::addBreed()

    ```


    然而，在对象上下文中工作时，你通常使用关键字 `$this`。这是一个保留变量名，仅指向当前对象。因此，如果你有两个狗的实例——一个属于 Macy，另一个属于
    Sasha——调用 `$this->setName()` 会设置该个体的属性。


    ```php

    $this->name

    ```


    ![图像](img/2.jpg)


    在类定义内部工作时，如果你使用实例或从类内部调用，必须指定：


    ```php

    $this->breed

    ```


    ## 上下文


    上下文是对象的本质。当处理静态内容时，它指的是类。如果你正在处理对象，它指的是实例。两个需要知道的重要关键字是 `self` 和 `$this`。因为 `self`
    指的是类，所以它的作用范围某种程度上是全局的。


    ```php

    self::$breeds

    self::addBreed()

    ```


    ![图像](img/4.jpg)


    然而，在对象上下文中工作时，你通常使用关键字 `$this`。这是一个保留变量名，仅指向当前对象。


    ```php

    $this->name

    ```


    ## 可可见性


    在操作 OOP 时，你有三个级别的可见性：公共、受保护和私有，如表 1.1 所示。


    | 表 1.1：可可见性级别 |

    | :--- |

    | **类型** | **描述** |

    | Public (公共) | 可以在类或实例可任何地方访问 |

    | Protected (受保护) | 可以在类、对象或扩展了它的类的内部访问 |

    | Private (私有) | 仅在其定义的类或对象内部访问 |


    # 抽象类


    有时一个类可以定义某些功能，但不足以让它实例化。或者它具有在分类完备性上进一步不同的额外功能。例如，鱼类可以共享某些共同点，如鳍、鳞片和冷血。但如果你在列表中添加鱼鳃，你就错了。某些鱼类（称为*肺鱼*）拥有肺部。因此，你需要将
    Fish 类定义为抽象类，并在后续实现中添加功能：


    ![图像](img/5.jpg)


