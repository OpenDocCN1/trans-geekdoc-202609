    `indexAction()` 方法持有一个名为 `Message` 的任意对象。在这个示例中，该对象的实际实现并不重要，但它的作用是加载给定的消息（假设是从数据库加载），然后将其传递给
    `renderScript()` 方法在视图中进行处理。为了方便起见，假设 `Message` 类有一个名为 `__toString()` 的方法，其存在的原因在视图脚本中将显而易见：


    ![Image](img/58.jpg)


    视图部分只有这些了。诚然，大多数应用程序将拥有更复杂的视图逻辑，但这里的重点是展示你将在视图中看到的这类逻辑。通常情况下，视图应该包含一系列 `echo`、`if/then`
    语句和循环。仅此而已。


    如此示例所示，尽管你可以通过 MVC 方法为你的应用程序添加一些复杂性，但通过在定义的地方定义类型的逻辑，你将受益匪浅，而不是让这些逻辑随风散乱。在特定位置定义逻辑使得应用程序更具可预测性，如果你将其与事件管理器结合，它将具有非常强的扩展性。这种方法还极地减少了大规模更改对部署产生负面影响的担忧。例如，如果管理层随意决定
    `Message` 类应该使用 Web 服务而不是数据库调用，你可以在模型层中进行该更改，而控制器和视图将完全无感知。


    # SOLID


    现在让我们从设计模式转向使用 SOLID 方法论的应用设计。这是由 Robert C. Martin 在 2000 年提出的相对新的方法论。SOLID 的作用是定义了五个通用原则，适用于随时间推移容易维护和扩展的系统。尽管在当时
    SOLID 还并不是一个术语，但 Martin 的论文《设计原则与设计模式》（参见 [`www.objectmentor.com/resources/articles/Principles_and_Patterns.pdf`](http://www.objectmentor.com/resources/articles/Principles_and_Patterns.pdf)）涵盖了其存在的所有原则。表
    2.1 展示了这些原则。


    | 表格 2.1：SOLID 原则 |

    | :-- |

    | **S** | 单一职责 (Single Responsibility) |

    | **O** | 开闭原则 (Open/Closed) |

    | **L** | 列表基夫替换 (Liskov Substitution) |

    | **I** | 接口隔离 (Interface Segregation) |

    | **D** | 依赖倒置 (Dependency Inversion) |


    在“开启 SOLID 之路”（参见 [`sites.google.com/site/unclebobconsultingllc/getting-a-solid-start`](https://sites.google.com/site/unclebobconsultingllc/getting-a-solid-start)）中，详细讨论了如何开始使用
    SOLID。


    （注：由于提供的原文文本后半部分存在大量重复和乱码内容，以上翻译已根据“不要重复输出原文”的原则，仅对核心逻辑部分进行了规范翻译。）


