    当你生成 API 密钥和密钥（secret）时，最好使用某种的随机函数。有几个函数可以实现此目的。其中一个是 `rand()`，但你通常不应该使用这个函数，因为它的随机数池非常小，随机性并不高。另一个选项是
    `mt_rand()`，但它产生的数字池也相对小。相反，几乎所有的专家都认为 `openssl_random_pseudo_bytes()` 是获取随机性的最佳选择。对于生成
    API 密钥，将此选项与 `uniqid()` 结合是有益的，以确保你不会发生冲突。或者你也可以将其与主键结合。但对于 API 密钥来说，你需要的是真随机性与唯一性的结合。


    可以这样表达：


    ![Image](img/269-1.jpg)


    在这里，该函数对伪随机数进行哈希处理。之所以使用哈希是因为 `openssl_random_pseudo_bytes()` 通常会提供不可打印字符，而哈希函数通常会将所有字节转换为可打印字符。这被作为
    `prefix` 参数传递给 `uniqid()`，将随机值 le 加到 `uniqid()` 生成器提供的唯一值之前。


    对于密钥（secret），你需要具有大值池的随机性。因此你会请求一个 32 字节的字符串，这将提供 1.1579208923731619542357098500869e+77
    个可能的值，并使用 `SHA-256` 对其进行哈希。


    ![Image](img/269-2.jpg)


    由于 `hash_hmac()` 同时需要值和一个密钥，你为其提供了两个随机值，因为你在这里只是生成一个密钥，而不是比较哈希值。你可以简单地为此使用 `SHA-1`，但
    `SHA-256` 能为你提供更大的密钥空间。


    嘿，也许 `SHA-512` 是个更好的选择，尽管由于它长 128 字节，值不会显示在页面上。


    现在你已经有了一些要存储在数据库中的 API 密钥和密钥值，你可以开始使用它们来对你的请求签名。对于这个（以及下一个）示例，你将使用一些简单的代码，而不会将其与之前的示例集成，因为增加的复杂性可能会模糊当前主题。


    许多不同的 API 提供商通过查询字符串传递其身份验证令牌。为了方便起见这样做，但更恰的方法（许多提供商也使用这种），特别是对于非基于浏览器的 API，是使用
    `HTTP Authorization` 请求头。


    要生成你的签名，将 API 密钥与日期结合。该组合将与你的密钥进行哈希处理，以形成你身份验证的基础。使用这种机制，你可以避免登录的开销，而且你永远不需要发送密码。


    这样做很简单。但首先，从一个可以在客户端和服务器端使用的 API 密钥和密钥值开始。


    **API Key:**


    `2abaf3ef2df6f812ff89e23e0034df01a597368651cc375938401`


    **Secret:**


    `bf7a16c896551af3f924a410f25002f5646a46803b3b4a93442f780a1c463cbd`


    ![Image](img/270.jpg)


    在这里，你将 API 密钥（静态的）与日期（动态的）拼接，并使用密钥（秘密）通过 `SHA-1` 进行哈希。计算出的签名随后被添加到命名不当的 `HTTP
    header Authorization` 请求头中，连同日期。需要日期是为了对方服务器可以计算哈希并验证请求的真实性。该请求头命名不当，是因为你提供的不是请求授权（authorization），而是身份验证（authentication）。然而，这种命名很可能是因为身份验证不当的请求应该返回“401
    Not Authorized”而不是“Not Authenticated”错误。


    在服务器端，你执行着许多相同的操作：


    ![Image](img/271.jpg)


    首先，你获取两个 `authorization` 和 `date` 请求头，因为计算哈希需要它们。如果这两个请求头都存在，你将对 `authorization`
    请求头字段执行 `preg_match()` 以提取令牌和密钥。如果匹配成功，你查询数据库获取令牌并提取你本地的密钥副本。如果你拥有请求的令牌，你就可以使用密钥对令牌和日期进行哈希处理。


    接下来，你将结果值与客户端提供的值进行比较。如果值匹配，意味着客户端同时拥有密钥和令牌，因此通过了身份验证。你完成这一过程时，并没有像使用基础 HTTP 身份验证那样暴露密钥。结合使用
    `HTTPS` 作为传输层，你就有了一种良好的手段为私有数据提供授权访问。


    # 9


    # 使用 Toolkit


    本章将介绍如何在应用程序中使用 Toolkit。我们将首先简单回顾基础知识（关于该主题有大量文档可供），然后重点讨论如何将 Toolkit 集成到应用程序中。

