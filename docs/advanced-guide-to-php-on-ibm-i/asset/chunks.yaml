    # spl_autoload_register()


    Except for `spl_autoload_register()`. In [Chapter 2](#006_Chapter02.html#ch-2),
    we looked at autoloading when dealing with classes. Autoloading lets you build
    out your class structure without having to ensure that all `require_once()` calls
    are in your code. It is also beneficial from a performance perspective; eliminating
    those `require_once()` calls will remove one (and often hundreds) of the calls
    from a hefty file inclusion call.


    Although `__autoload()` is often sufficient for a simple application, complex
    applications generally need multiple different autoloaders. The `spl_autoload_register()`
    function lets you define multiple different autoload functions, none of which
    require the name `__autoload()` through the use of callbacks. The autoload functions
    simply need to be able to take a class name as an argument. In addition, they
    can pass any callable function to `spl_autoload_register()`.

