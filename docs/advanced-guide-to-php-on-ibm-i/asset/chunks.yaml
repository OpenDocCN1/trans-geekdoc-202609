    现在你已经有了参数、任务名称和数据库连接，并且定义了服务。现在你创建一个任务的实例，对其进行配置，执行它并处理结果。如果任务包含错误条件，它应该抛出一个异常，将任务状态设置为
    `FAILED`，并对消息进行序列化和存储。如果任务成功，它将把任务状态设置为 `OK` 并对结果序列化：


