- fmt: '

    Think about that for a second. Your instantiation code did not change at all.
    You still called `get()` on the `DiContainer`. But by your making that change
    in the model class and doing it in a way the DI Container understood, the model
    was reconfigured without your having to change inline code. Then, for code in
    a class that requires some kind of dependent object, you simply reference the
    DI Container property `$this->container`.


    You should now be starting to see some of the power that this methodology provides.


    With that in mind, let’s dive a little deeper into this DI Container implementation.


    First, we will look at the basic constructor:


    ![Image](images/77-1.jpg)


    Here, you are storing the definitions and having the DI Container store itself
    in the `$objectStore` property. That is all you need to get started.


    Remember the mainline code we examined earlier? To retrieve an instance of the
    object, you called the `get()` method on the `DiContainer`. The implementation
    for that method is simple:


    ![Image](images/77-2.jpg)


    This code will check whether an instance of the object has been created, and if
    it has, the code will return the previously defined instance, unless `$useStore`
    is set to `false`. We use `$useStore` to allow an object to specify whether it
    wants the existing copy of the object or a new one. If you set `$useStore` to
    `false` or the `$objectStore` lacks an instance of the requested object, the `createInstance()`
    method is called:


    ![Image](images/78.jpg)


    This method first checks whether another class specification exists for the requested
    class that is defined. This is the first `isset()` check. It lets your definition
    configuration request a `CrudAdapter` but retrieve a `Db` class or a `ToolkitConnector`,
    depending on the configuration requirement. In your definition, you can also specify
    an alternate mechanism for retrieving an instance. By default, this mechanism
    will create a new object. But at times, such as when you want to create a `ToolkitService`
    instance, you will call a static method to retrieve the instance. So you use this
    mechanism as a means not only to create new objects but to call other classes
    to retrieve a requested object as well.


    Next, you do some basic reflection on the requested method to retrieve the method
    definition for the instantiation method. The following block of code uses this
    definition to populate the parameters of that method. The method `processParameter()`
    handles that processing:


    ![Image](images/80.jpg)


    The `createInstance()` method iterates over each of the parameters and passes
    each to the `processParameter()` method. Then, `processParameter()` checks whether
    a constructor entry exists for the name of the parameter, and if a definition
    does exist for that named parameter, it will check whether the definition is an
    array or a scalar value. If it is a scalar value, `processParameter()` will return
    that value. This is how you caused the DSN to be entered into the `PDO` object.


    However, if the value is an array, `processParameter()` check for a key named
    `type` to determine whether a substitution should be declared for the declared
    parameter type. If so, the DI Container will recursively call itself to retrieve
    an instance of that class.


    The short version of the logic for `processParameter()` is that it first checks
    whether a parameter declaration exists. If not, it will simply retrieve an instance
    of the class type for the parameter (the `else` statement). If there is a definition,
    `processParameter()` will check whether a type has been defined and will return
    an instance of that type by recursively calling itself, or it will return the
    scalar value that is presented.


    This is a brief overview of how a Dependency Injection Container implementation
    might appear. In [Chapter 9](#013_Chapter09.html#ch-9), which covers working with
    the Toolkit, you use the DI Container in a more practical manner to give you a
    better understanding of its benefits.


    Although this amount of code is somewhat complex for the written page, you did
    build a functional Dependency Injection Container in about 80 lines of code. Granted,
    a few things are missing, such as inheritance checking, optional parameters, and
    parameter hashing. The latter lets the developer specify runtime instance parameters
    and create distinct instances of an object.


    That said, this example can give you some insight into how to implement Dependency
    Injection, and the fact that it is not some great computer science theory that
    takes years to master. Rather, Dependency Injection is a simple concept whose
    implementation can sometimes be complex, but the benefit of which is an application
    that is much easier to maintain and to reuse.


    # 3


    # Standard PHP Library


    Programming anything that is particularly useful comes down to one of two things:
    conditional statements or loops. Granted, you can write a program that does not
    do these two things, but it will be almost useless. You can only write “Hello
    World” so many times before your ability as a programmer is challenged.


    Most programs include a lot of conditional statements. If this, do that, else
    do this. Of course, they also contain functions, classes, methods, and the like.
    But go into a program and dive into the functions, classes, and methods to the
    point where there are no more calls to other members, and you will most often
    find some conditional behavior or loops, or both; or you will find functionality
    that enables conditional behavior or looping, or both. Conditional behavior and
    loops—you cannot escape them.


    Because conditionals are basically variable comparisons, you cannot necessarily
    do much to make them more user-friendly. Looping, however, has several ways that
    make it easy to use. This is because programs frequently contain an object that
    represents a type of data that must be looped over. The looped-over data is often
    called a *collection.* Accessing particular internal data is not as simple as
    doing a `foreach` over the object, which will merely iterate over the properties:


    ![Image](images/84-1.jpg)


