    但这些功能真的需要吗？坦诚地说，不需要。并没那么。它们不是“必须”的，而且在某些情况下反而可能更加繁琐。但人们从绿色屏幕转向浏览器，并不是因为他们喜欢更华丽的图形。当实现得当时，整体用户体验通常会更好。


    这是因为浏览器是一个通用的用户界面。它通过一种名为 `HTML`（或“超文本标记语言”）的标准标记语言提供访问 Web 应用程序的接口。这种标记语言在你的桌面、手机和平板电脑上都能运行良好。如果你使用
    `Lynx` 程序，它甚至在终端上也能良好运行。结合 `JavaScript` 和层叠样式表（`CSS`），`HTML` 可以提供极其丰富的用户体验，包括图表、分级数据显示以及许多其他让你的应用程序更易于使用的选项。


    但要利用其中的某些技术，你需要忘掉数据描述规范（`DDS`）。在某些方面，`CSS` 与 `DDS` 相似，因为使用 `DDS` 时你对数据进行标记。而使用
    `CSS` 时，你不是在标记数据，而是在标记 `HTML` 节点，这些节点可以包含数据。这绝不是完美的类比，但它可能帮助你提供一个参考框架。


    本章介绍了基于浏览器的基础知识。有些人的整个生涯都致力于研究这些技术。请将此视为在浏览器领域工作的人应该掌握的语言和技术的“待办事项清单”。我们可以轻松地深入探讨这些每一个主题。如果你想学习更多关于这些技术，请找一本专门介绍它们的书籍。


    # HTML


    当你查看 `HTML` 时，你可能会认为它仅仅是为你提供了编写文本、链接图形等地方。虽然你可以那样做，但这并不是正确的思考方式。`HTML` 的最佳用途是提供结构和基础布局。通常情况下，你不应该在
    `HTML` 中描述如字体类型、大小或颜色等装饰性内容。那是 `CSS` 的工作。


    `HTML` 有多个不同的版本，但我们将仅关注 `HTML5`。它是首批真正具有某种程度标准采纳支持的版本之一。与之前的所有版本一样，`HTML5` 在不同的浏览器中确实有不同的实现。但你会发现，如果你统一使用
    `HTML5`，你的布局在各种浏览器和移动设备上将更具可预测性。


    `HTML` 基于标准通用标记语言，即 `SGML`——这也是 `XML` 衍生的相同语言。因此，如果你了解 `XML`，就会熟悉 `HTML` 的基本规则。


    `HTML` 是分级的，但与 `XML` 不同，它使用节点来遵循较强的命名结构。`HTML5` 与 `HTML 3` 和 `4` 相同的 `SGML` 基础，但它不再显式地遵循该标准了。尽管如此，它的历史、基础标记和指令处理与总的
    `SGML` 标准有着密切的关系。


    第一条指令是 `doctype`。它标识浏览器将处理的基于 `SGML` 的文档类型。`HTML 4` 提供了几种不同的 `doctype` 定义，每种定义以不同的方式指示浏览器如何工作。在
    `HTML5` 中，你可以简单地如下声明 `doctype`：


    ![Image](img/167-1.jpg)


    如果你正在使用较新版本的 Internet Explorer，这样开始你的 `HTML` 文档尤为重要。该浏览器使用此声明来切换到其更“符合标准”的模式。大多数其他浏览器将默认使用
    `HTML5`，但 Internet Explorer 通常需要它来进行正确渲染。


    紧接 `doctype` 之后……（注意：提供的源文本结尾包含重复/碎片化的句子。我将根据规则对所提供的核心内容进行处理。）

