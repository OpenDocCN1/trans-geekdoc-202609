    \n![Image](img/235-4.jpg)\n\n考虑到 Roy Fielding 共同编写了这些，REST 并不要求 HTTP。为了符合 RESTful\
    \ 标准，你应该遵循以下：\n\n![Image](img/235-5.jpg)\n\n或者使用 HTTP 这种方法：\n\n![Image](img/235-6.jpg)\n\
    \n# 认证\n\nSOAP。由于它  REST  。 如此，SOAP 是你见过的非常臃肿的协议之一，由于 REST  ，，   。\n\n由于 SOAP\
    \ 协议，你可以使用它：\n\n![Image](img/235-7.jpg)\n\n或者 SOAP 协议：\n\n![Image](img/235-8.jpg)\n\
