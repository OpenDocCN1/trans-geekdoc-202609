    The second group consists of people inside your organization. They are the ones
    who know your application better than anyone. These insiders know your `URLs`,
    server names, login requirements, and a host of other critical information that
    they can use to perform unauthorized actions. A study from 2005 found that roughly
    70 percent of successful attacks came from inside an organization. Rich Mogull
    of Gartner had an interesting take on this. He said, “Corporate networks are like
    candy bars: hard on the outside, soft and chewy on the inside.” The hacker groups
    might get all the glory, but they are a relatively small portion of the problem.


    The people who you need to most guard against are those who know how to implement
    basic web-security attacks. The attacks are not complicated and are thus easy
    to implement. And they can have devastating effects on your organization, depending
    on the nature of the attack. These people can be outside your organization or,
    in a double threat, inside your organization.


    Why would these people pose more danger than the so-called superhackers or groups
    like `Anonymous`? For one, superhackers and the like are few, and unless you are
    a big target like the Department of Energy, `Microsoft`, or `Amazon`, they will
    not take an interest in you. They do not like “boring” targets. If, in their mind,
    you are boring, they generally will not care.


    Second, individuals who can launch a basic web-security attack are more dangerous
    because these types of attacks are easy to implement without much specialized
    knowledge. These people are also generally not restricted to a particular program
    and are considered a general attack vector. In many cases, it does not matter
    which web-based programming language you are using; the attack vector will often
    be the same.


    But the good news about these attack vectors is that not many of them exist, and
    the rules for closing the attack vectors are simple. The rules are so simple that
    you can sum them up in four words:


    *   Validate input

    *   Filter output


    Although you cannot completely eliminate threats, you will make your web application
    less interesting to an attacker if the basic attacks do not work.


    Web applications tend to be vulnerable to five primary exploits:


    1. `SQL injection`

    2. `Cross-site scripting`

    3. `Cross-site request forgery`

    4. `Session fixation`

    5. `Session hijacking`


    There are more ways to get into a system, but those methods are usually more esoteric
    or require knowledge of the system. However, attackers can generally implement
    the five exploits listed here with minimal knowledge of your system.


    In this chapter, we will look at these five attacks as well as discuss some basic
    cryptography implementations.


    # SQL Injection


    The `SQL injection` attack is likely the most dangerous. It has been estimated
    that with password dumps in which an individual gains access to a website’s user
    accounts, `SQL injection` is the primary attack vector. Consider how you might
    typically query the database:


    ![Image](images/132-1.jpg)


    Here, `PHP` will interpolate data from the query string into the variable, resulting
    in a query such as this:


    ![Image](images/132-2.jpg)


    But that is if people using your site are behaving themselves. To demonstrate
    the problem, let’s look at a relatively benign attack that might get your imagination
    running. Consider what would happen if your query string changed from `search=Kevin+Schroeder`
    to `search=Kevin Schroeder’ OR NAME=''Mickey Mouse`. This modification would cause
    `PHP` to render the SQL query as follows:


    ![Image](images/132-3.jpg)


    From the viewpoint of data returned, this query is relatively inconsequential.
    However, it illustrates a problem. The attacker was able to modify the query’s
    behavior in a way that the developer did not intend. The developer did not intend
    an `OR` condition to be part of the query.


    To demonstrate a more problematic vector, consider a table containing two million
    rows. What would happen if someone were to change the query string to `search=''
    or 1 = 1--`? This string would escape out of the quotation marks and cause the
    database to query a condition that would always return true. Therefore, the following
    query would be generated:


    ![Image](images/132-4.jpg)


    Because of the true statement, this query would result in `DB2` returning every
    row in the table. (Note that you add the `--` as a comment, which nullifies any
    subsequent `SQL` tokens that are part of the original query structure.)


    This query has two obvious problems:


    1. It would return all the data, potentially giving the attacker access to data
    he or she would otherwise not have access to.

    2. An attacker could use this query as a denial-of-service attack, rendering the
    server unable to respond while the result set is processed. This attack could
    be repeated multiple times across multiple connections and bring the web application
    down.


    So far, we have looked only at modified `SELECT` queries. With some database drivers,
    attackers can perpetrate additional attacks that chain `SQL` queries together
    by terminating each one with a semicolon. They can do this by changing the `GET`
    search parameter to `search=''; DELETE FROM KEVIN.accounts; --`.


    Fortunately, although `DB2` allows this type of chaining to occur, the `DB2 PHP`
    driver does not. This measure goes a long way toward preventing catastrophic data
    loss. But if you are using a database like `MySQL`, you should be aware of this
    type of attack.


    But as bad as data deletion can be, there is a worse scenario. You can usually
    recover deleted data. At least, you *should* have some form of backup strategy
    to protect against that loss.


    The bigger problem is data modification. If someone modifies a row in a table,
    you are much less likely to notice it than if the data is gone. So it is possible
    to have an open vulnerability that can be exploited for weeks, months, or years
    without your ever knowing that you have a problem.

