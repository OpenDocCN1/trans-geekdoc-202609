- fmt: '

    When you generate the API key and the secret, it is best to use some form of randomization
    function. Several functions are available for this. One is `rand()`, but you generally
    should not use this function because it has a very small pool of random numbers,
    which are not that random. Another option is `mt_rand()`, but it, too, produces
    a relatively small pool of numbers. Instead, almost all experts agree that `openssl_random_pseudo_bytes()`
    is the best option for randomness. For generating an API key, it is beneficial
    to combine this option with `uniqid()` to ensure that you do not have collisions.
    Or you could combine it with a primary key. But the combination of true randomness
    with uniqueness is what you will want for an API key.


    This could be expressed as so:


    ![Image](images/269-1.jpg)


    Here, the function is hashing the pseudo-random number. The hash is simply because
    `openssl_random_pseudo_bytes()` will usually provide nonprintable characters,
    whereas hashing functions usually convert all bytes into printable characters.
    This is passed to `uniqid()` as the `prefix` parameter that prepends the random
    value to the unique value that the `uniqid()` generator supplies.


    For the secret, you want randomness with a large value pool. So you will ask for
    a 32-byte string that gives you 1.1579208923731619542357098500869e+77 possible
    values and hash it using `SHA-256`.


    ![Image](images/269-2.jpg)


    Because `hash_hmac()` requires both a value and a key, you provide it with two
    random values, since you are only generating a secret here and not comparing hashes.
    You could simply use `SHA-1` for this, but `SHA-256` gives you a larger secret
    key space.


    Heck, maybe `SHA-512` is a better option, though the value will not display on
    the page because it is 128-bytes long.


    So now that you have some API key and secret values that you will store in the
    database, you can start using them to sign your request. For this (and the next)
    example, you will use some simple code and not integrate it with the previous
    example, because the added complexity might cloud the topic at hand.


    Many different API providers have their authentication tokens passed via the query
    string. You can do this for expediency, but it is more proper (and many providers
    use this), particularly for an API that is not browser-based, to use the `HTTP
    Authorization` header instead.


    To generate your signature, combine the API key with the date. That combination
    will be hashed with your secret key to form the basis of your authentication.
    Using this mechanism, you can avoid the overhead of logging in, plus you never
    send the password.


    Doing this is simple. But first, start with an API key and secret value that you
    can use on the client and server side.


    **API Key:**


    `2abaf3ef2df6f812ff89e23e0034df01a597368651cc375938401`


    **Secret:**


    `bf7a16c896551af3f924a410f25002f5646a46803b3b4a93442f780a1c463cbd`


    ![Image](images/270.jpg)


    Here, you append the API key (which is static) with the date (which is dynamic)
    and hash it by using `SHA-1` with the secret key (which is secret). The calculated
    signature is then added to the poorly named `HTTP header Authorization` header
    along with the date. The date is required so that the server on the other side
    can calculate the hash and verify that the request is authentic. The header is
    poorly named because you are not providing request authorization but rather authentication.
    However, this naming is likely due to the fact that an improperly authenticated
    request should return a “401 Not Authorized” instead of a “Not Authenticated”
    error.


    On the server side, you do much of the same:


    ![Image](images/271.jpg)


    First, you retrieve both the `authorization` and `date` headers, because they
    will be needed to calculate the hash. If both of those headers are present, you
    initiate a `preg_match()` on the `authorization` header field to extract the token
    and the secret. If there is a match, you query the database for the token and
    retrieve your local copy of the secret. If you have the requested token, you then
    hash the token and the date with the secret key.


    Next, you compare the resulting value with the value the client provides. If the
    values match, that means the client has both the key and the secret and is thus
    authenticated. And you accomplished this process without exposing the secret as
    you would have with basic HTTP authentication. Couple this with using `HTTPS`
    as a transport, and you have a good means of providing authorized access to private
    data.


    # 9


    # Using the Toolkit


    This chapter will cover how to use the new Toolkit in an application. We will
    begin with a quick look at the basics (plenty of documentation is available on
    this topic) and then focus more on how you can integrate the Toolkit into your
    application in a maintainable and structured way.


    The Toolkit works by acting as an intermediary between your application and an
    XML-based service that is accessed via `DB2` or `ODBC`. Yep. That is it. It is
    10,000 lines of code for writing XML. Highly specific XML, but XML nonetheless.
    The XML contains the instructions for the IBM i internals to execute the calls
    that you need.


    But lest you think that you could just write your own adapter to the Toolkit…
    well, you would be right. However, it would be largely a waste of time. That said,
    using an open-source abstraction lets you examine the code’s details so you can
    better understand how things work. Additionally, if you were to write your own
    abstraction, you would need to ensure that your code follows any changes that
    are introduced as new Toolkit versions are released.


    # Basics


    The primary class that you will be working with is `ToolkitService`. This class
    represents the connection to the system and initiates the connection as soon as
    the object is instantiated. The ToolkitService class uses the Singleton pattern.
    So, as is typical for a Singleton-based approach, a static method called `getInstance()`
    will retrieve the instantiated instance of the class. Anytime you need the Toolkit,
    you call `ToolkitService::getInstance()` to retrieve it. It takes several different
    parameters, though. Because the Toolkit is a Singleton, these parameters will
    be ignored on subsequent calls after the Singleton has been instantiated.

