    在 Zend Studio 中，你通过双击调试器应该停止的行号来设置断点。代码窗口侧边会出现一个蓝点，如图 4.22 中的箭头所示。


    ![Image](img/121-2.jpg)


    *图 4.22：代码窗口中出现蓝点表示已设置断点*


    当你执行请求时，程序会在遇到此断点时停止。要移除断点，再次双击该行号。此外，你还可以打开图 4.23 中的“断点”（`Breakpoints`）视图并在那里移除断点。


    ![Image](img/122.jpg)


    *图 4.23：在断点视图中移除断点*


    但有时你可能会遇到断点过载。这通常发生在你想要分析的重要代码段被频繁执行时。这的一个很好的例子是 Magento 事件分发器（或者说任何基于事件的系统）。在这些系统中，通常会触发数百个事件，为了找到某个事件，你必须不断按下
    `F8 (Resume)` 直到到达你想要的那一个。


    那种方法效率很低。相反，你可以设置条件断点。要此操作，右键点击现有的断点，然后选择“断点属性”（`Breakpoint Properties`），如图 4.24
    所示。


    ![Image](img/123.jpg)


    *图 4.24：选择断点属性*


    从那里，你可以设置一个条件（PHP 表达式），只有当该条件满足时断点才会暂停执行。在图 4.25 中，你设置了断点在 `$name` 的值等于 `cms_page_load_before`
    时停止执行。


    ![Image](img/124-1.jpg)


    *图 4.25：设置 PHP 条件断点*


    但“PHP 条件断点”（`PHP Conditional Breakpoint`）窗口不仅用于进行相等检查；你还可以进行任何比较语句（图 4.26）。这在功能上与
    IBM i 调试器中的 `Break…When` 选项基本相同。


    ![Image](img/124-2.jpg)


    *图 4.26：输入比较语句*


    # 工具栏


    虽然在 Zend Studio 中使用浏览器工具很有用，但你可能会发现这些工具并不总是能完成你需要的所有工作。例如，假设你使用 Google Chrome
    进行前端开发，但 Zend Studio 中的浏览器不是 Chrome。通过使用不属于 Zend Studio 的浏览器，你无法原生为浏览器中的请求启动调试会话。


    因此，你可以获取几个工具栏，允许从浏览器内部触发调试会话。Zend 为 Mozilla Firefox 和 Microsoft® Internet Explorer
    提供了工具栏。Google Chrome 和 Apple Safari 也有基于社区的调试工具栏。所有调试工具栏的功能都大同。


    要立即启动调试会话，点击 `Debug` 按钮显示 `Debug` 菜单，并选择“此页面”（`This Page`）（图 4.27）。点击“下一页”（`Next
    Page`）将为下一个 HTTP 请求启动调试会话。要为任何 GET 或 POST 请求启动调试会话，点击 `Get, Post` 选项。`Post Only`
    将仅对 POST 请求进行调试。非常简单。


    ![Image](img/125.jpg)


    *图 4.27：在 Debug 菜单上选择“此页面”*


    但请记住，早些时候你需要进行一些设置，以便系统能够与你的 IDE 通信。为了帮助你管理这些，这里有一些设置，如图 4.28 所示。


    ![Image](img/126.jpg)


    *图 4.28：调试设置示例*


    通常，你需要开启某些设置来让调试器工作。首先，你可能需要开启 `Debug`，其次你可能需要开启 `Local Only`。如果开启了这些，调试器就会在你的机器运行。此外，你可能需要设置为
    `Yes`。


    # 手动控制


    虽然在 Zend Studio 中使用浏览器工具很有用，但你可能会发现这些工具并不总是能完成你需要的所有工作。例如，假设你使用 Google Chrome
    进行前端开发，但 Zend Studio 中的浏览器不是 Chrome。通过使用不属于 Zend Studio 的浏览器，你无法原生为浏览器中的请求启动调试会话。


