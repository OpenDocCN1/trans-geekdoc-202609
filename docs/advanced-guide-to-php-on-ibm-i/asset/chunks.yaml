    This code will display the words “Hello World” in the browser window. Although
    it might be tempting to do a lot of programming by embedding JavaScript, the preferred
    method is to write your code in external JavaScript files and then include them
    in your page. This technique encourages code reuse and allows for better caching
    of JavaScript resources. The embedded script is a simple text file, and the embedding
    code is this:


    ![Image](images/188.jpg)


    In the past, the practice was to place the JavaScript at the top of the file in
    the `<head>` section. But doing so has some unintended consequences. JavaScript
    execution will block page content rendering. So, if you have JavaScript in your
    web page, the browser will render the page to a point until that block of JavaScript
    has been either executed or downloaded, making your page seem artificially slow.
    The work-around is to load any nonessential JavaScript at the end of the page,
    not at the beginning.


    This fix is not a requirement, but something to bear in mind if you think your
    web pages are taking too long to render. CSS will not block rendering. Elements
    will be rendered and then decorated as CSS classes become available. JavaScript
    will block rendering.


    When declaring a JavaScript variable, you should usually do so by using the `var`
    keyword. If the global scope in PHP is bad, it is doubly bad on a long-lived browser
    page. Unless, of course, that data must be in the global scope. But global data
    is typically somewhat unnecessary.


    To define functions, you use the `function` keyword. As in PHP, you can define
    functions in the global scope or attach them to an individual variable. You can
    also define them as anonymous functions (we will look at that in more depth when
    we discuss events).


    When writing code for JavaScript, you have access to an environment that contains
    many predefined items. In the earlier code, you saw an example that called a `document`
    object with a `write` method. That object is a property of another object called
    `window`, which has several objects attached to it. We could say that the object
    `window` is actually the global scope. If you attach a value to `window`, that
    value is immediately accessible in the global scope:


    ![Image](images/189-1.jpg)


    Note carefully the variable definitions. You attach the value `test` to the property
    `myVar` in the `window` object. Then in the function, you reference that value
    without the object reference to `window`. This shows that when you are not explicitly
    referencing an object, the JavaScript engine will assume that you intend to work
    with the `window` object.


    But however core functions are to your architecture, it could well be said that
    events truly are the heroes of JavaScriptLand.


    Events enable web applications to execute custom browser-side logic that interacts
    with the user. You will be working with events in Ajax as well. In short, interesting
    JavaScript uses events.


    The most typical event is the `click` event. It is triggered whenever someone
    clicks or touches (on a tablet or mobile device) an element that has a callback
    defined. The most common way of defining a click handler is in the HTML itself.
    You can define most HTML-based events via an `on*` interface as an attribute of
    the element. So a click event would be `onclick`, and a mouseover event would
    be `onmouseover`:


    ![Image](images/189-2.jpg)


    All right, let’s break this one down. You defined a function called `iJustClicked()`
    that takes a parameter, `e`. The `e` parameter represents an event object that
    is created by the event manager in JavaScript. That event object has a property
    called `target`. The `target` property is a reference to the HTML element that
    triggered the event. Because it is an HTML element, the `target` also has a property
    called `style`, which has a property called `backgroundColor`. Do not worry too
    much about knowing which styles the `style` property includes. Practicing CSS
    will help with that.


    When the function is called, it will set the background color to red, and then
    it will define a timer that will call an anonymous function 1000 milliseconds
    after it is defined. That anonymous function can also access the same variables
    included in the scope it was defined in. When the anonymous function is called,
    it will reset the value to the original transparent value.


    The `iJustClicked()` function is called when a user clicks the paragraph that
    has the `onclick` event listener defined. Although you are not required to pass
    in any parameters, passing in the event value provides access to the `target`
    object.


    But we can go a lot deeper than that. To do so, we will examine a powerful part
    of mixing JavaScript and HTML: the Document Object Model.


    You can access DOM via the `document` property on the `window` object. The call
    to `document.write()` is one example. But you can do so much more:


    ![Image](images/191.jpg)


    This code will execute the `iJustClicked()` function for the first and third paragraphs
    only. Notice that several things are happening here.


    First, rather than embedding your event listeners in HTML, you are assigning them
    via JavaScript. But there is a problem here. Your JavaScript appears before your
    HTML, so when you try to find those paragraph elements, they will not exist.


    The solution is to assign a function to the `window.onload` property. The `onload`
    event will be called after the browser has completed loading everything. This
    is a good entry point for implementing the logic for an individual page. In this
    case, you assigned an anonymous function that binds `iJustClicked()` to the two
    paragraph elements.


    That anonymous function contains some new functionality. The `document` object
    follows the W3C DOM spec, which means you can assume that `document` will contain
    certain functionality. One of the more useful features is `getElementById()`.
    It lets you retrieve an element from the document based on the ID. So when you
    executed `getElementById()`, it returned a single object that matched that ID.
    From there, you assigned the `iJustClicked()` function to the `onmouseover` property;
    now that function will be called whenever that event is triggered.


    But note something else. When you specified `JustClicked`, you did not indicate
    it as `JustClicked()`. Doing so would have called the function and assigned the
    returned value to the `onmouseover` property. This illustrates the point that
    you can easily pass functions around the way you pass variables. You can do this
    in PHP as well if you are using anonymous functions or closures, but it is not
    as pervasive as in JavaScript.


    However, as great as this ability to manipulate things is, the programming can
    become tedious. Enter the JavaScript programming library.


    # *jQuery*


    Several different libraries are available, many of which are good. But the one
    library that almost every JavaScript developer will know is jQuery. At the time
    of this writing, about half of all websites use jQuery. This is largely due to
    jQuery’s focus. While other JavaScript libraries work on making web applications
    easier to build, jQuery concentrates on making the HTML DOM easier to manipulate.
    And jQuery is easy to use. So if you have a low barrier to entry, it will do 90
    percent of what you need it to, even if it does not perform those tasks gracefully.


    To get started, go to the jQuery website at *[http://jquery.com](http://www.jquery.com)*
    and look for a CDN-based link. Several Content Delivery Networks host jQuery,
    so you do not need to. At the time of this writing, the current version of jQuery
    is 1.9.1. So we will choose the URL [http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js](http://www.ajax.googleapis.com/ajax-libs/jquery/1.9.1/jquery.min.js)
    to access the jQuery library via the Google CDN. If you prefer to use a local
    library, you can use that as well:


    ![Image](images/192.jpg)

