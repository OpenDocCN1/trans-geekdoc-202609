  raw: 'If you have read [Chapter 2](#006_Chapter02.html#ch-2) (which covers advanced
    OOP), particularly the section on Dependency Injection, you will have noticed
    that the examples in the previous section here were already using Dependency Injection.
    The ToolkitService object was injected via the constructor. You were not managing
    it automatically. In this section, we will briefly look at how to use a DI Container
    to couple the service classes with the Toolkit.


    Wait a second! Didn’t I say that coupling is bad? No. Coupling is not bad. *Tight*
    coupling is bad, or more accurately, apt to decrease the maintainability of your
    software. Tight coupling occurs when a class expressly defines the dependency
    inside itself, usually meaning that it must retrieve that object from somewhere
    hard-coded. You can see this if you define a call to ToolkitService::getInstance()
    in your class. *That* is tight coupling and will probably make your application
    more difficult to maintain in the long run. Loose coupling occurs when the class
    defines the dependency it needs and you inject that dependency. A class without
    dependencies will probably not have much use.


    As you might have noted, however, sometimes managing those dependencies can be
    difficult. Perhaps if you have one dependency you can do it. But even so, you
    will not automatically have a means of transporting that dependency to where it
    is needed.


    That is where a DI Container comes into play. Rather than manually injecting those
    dependencies, you request an object from the DI Container, and it satisfies the
    dependencies for the class for you. If this is a little fuzzy, I suggest you read
    through [Chapter 2](#006_Chapter02.html#ch-2) again, which covers advanced OOP,
    before moving on.


    To demonstrate this with the Toolkit, we will use the DI Container that you defined
    in [Chapter 2](#006_Chapter02.html#ch-2). As in that chapter, I will state that
    the DI Container created there is not intended for production use and that other
    (supported) DI Container options are available for you. This one was created to
    provide insight into how a DI Container works, rather than being fully functional.
    But it is a valid DI Container, so if you want to use it, you will receive no
    criticism from me.


    A key point to managing your container is that you want to manage your dependencies
    via configuration. Sometimes people will use XML, JSON, or YAML as a means of
    configuring it. All of these are valid options, but my preference is to keep it
    simple, keep it coded. That way, the opcode cache will store the configuration
    in memory, so you will not have the overhead of reading it from the IFS each time.
    But if you prefer to store it in XML to help with validation or to give it a more
    readable format, you will be fine as well.


    In the case of the Toolkit, you need to define the dependency in a manner that
    allows calling the getInstance() method on ToolkitService. You wrote the class
    in such a way that allows for this. The configuration is stored in a configuration
    file, as follows:


    ![Image](images/282-1.jpg)


    (From here on, we will presume that an autoloader has been defined and is working.)


    This configuration states that when the ToolkitService class is listed as a dependency
    in the constructor, the method getInstance() will be called with the provided
    named parameters. The DiContainer class uses reflection to create the instance
    and call any instantiation method, so it will check whether it is a static method
    or an object method, of which ToolkitService::getInstance() is the former.


    To initialize the DiContainer class, create a new instance, and include the configuration
    file you just specified:


    ![Image](images/282-2.jpg)


    You will reuse the COMMONPGM code from earlier. To retrieve an instance of it,
    ask the DiContainer object for an instance, and verify that it has injected the
    ToolkitService object properly:


    ![Image](images/283-1.jpg)


    Running the code produces this (redacted) output:


    ![Image](images/283-2.jpg)


    So it seems to be working. Let’s look at what happens when you write the full
    code for this example:


    ![Image](images/283-3.jpg)


    When you run this code, you get the following output:


    ![Image](images/283-4.jpg)


    Easy, right? But for the sake of argument, let’s say that management has requested
    a new feature; it wants to do additional security checks via a call to RPG when
    a new connection is made. One option for making those changes is to modify the
    ToolkitService class to automatically do those security checks when the instance
    is created, as in this example:


    ![Image](images/284.jpg)


    If you had written your code in an inline style, you would now need to modify
    every place where the reference to getInstance() was made to change the class
    that you call it in. Using a DI Container, you change only the definition by adding
    a value for the key type:


    ![Image](images/285.jpg)


    Run the code now, and the ModifiedToolkitService object will be injected into
    the COMMONPGM object and will be run instead.


    # Unit Testing with the Toolkit


    We built the previous examples with the intent of using the SOLID principles,
    which are foundational principles (though not requirements) for building maintainable
    software. Note that I did not say “fast” software. The additional complexity of
    a SOLID-based application creates some overhead. The exact amount is difficult
    to ascertain because it is dependent on the code base. However, it is fair to
    say that the additional complexity will decrease the overall throughput of your
    application.


    All that to say that it largely does not matter. IT is always a balance between
    multiple different costs, and focusing too much on one cost can be detrimental
    to the whole project.


    Take, for example, the open-source PHP e-commerce application Magento. If its
    focus was solely on performance of the application, it would probably be the least
    used e-commerce software package out there. But it is not. It is the most used.
    That is because Magento does a lot of stuff for you. Granted, as I write this
    paragraph, I work for Magento, so take that statement with as much salt as you
    like. Magento does so much for the developer and can considerably shorten the
    time to market with a platform that has a bevy of options available to you.


    But compared with a custom-written e-commerce application, it is horribly slow.
    Magento’s success is (at least partially) due to its design. When the Magento
    developers designed the software, they designed it to solve the e-commerce problem
    in a way that, after all factors are considered, costs less. In fairness, I am
    not saying that Magento is following the principles for making software maintainable.
    Magento was conceived just when many of these principles were being fleshed out
    in the PHP world, and you can see this in many places. However, it illustrates
    the importance of considering multiple different ingredients that are baked into
    the software development pie.


    One of those ingredients is the economics of fixing a defect. Steve McConnell
    in his book *Code Complete* (Microsoft Press, 2004) calculated that the cost of
    fixing a defect is about 1x in the requirements phase, but that cost can increase
    to almost 100x after an application has been deployed. So the cost of fixing a
    defect is a significant factor to consider when you are designing your software
    construction methodology, and one of the reasons that test-driven development
    is so important.


    The typical method of development is change and refresh. Make a change, refresh
    your browser. This is horribly inefficient, and, as mentioned, it can modify your
    data and is not very repeatable. It is also manual, meaning that you must go through
    all your testing scenarios manually to validate that the new code works and that
    the old code still works. In other words, your cost to fix defects will be significantly
    higher.'
