  trans: '

    幸运的是，保护自己免受此类攻击非常简单。第一层防护是始终使用预处理语句（prepare statements）。这些语句为处理查询创建了一个双步过程。第一步是使用占位符而不是实际数据来创建查询。然后将查询传递给数据库，数据库返回一个该查询的唯一引用。当驱动程序接收到查询后，它可以使用独立于查询的数据来执行该语句。执行执行，通常会以一种专有的格式将参数发送到数据库，这种格式不太可能被利用。


    为了说明这一点，让我们回到第一个 `SELECT` 语句：


    ![Image](img/136-1.jpg)


    与其在查询中注入 `GET` 参数，不如提供一个占位符：


    ![Image](img/136-2.jpg)


    接下来，你准备该语句：


    ![Image](img/136-3.jpg)


    然后你执行它：


    ![Image](img/136-4.jpg)


    现在，无论有人在 `GET` 搜索参数中输入什么都不重要了。数据库将仅针对该参数的值进行查询，即使有人尝试实施 SQL 注入攻击也是如此。


    修复第二种攻击（即有人可以修改 `UPDATE` 查询）的方法同样简单。记住安全 Web 应用程序的基本规则：验证输入，过滤输出。


    防止我们之前检查的此类攻击的最佳方法是显式地定义查询中可以更新的列，然后使用预处理语句：


    ![Image](img/137.jpg)


    要在你的代码中动态生成列引用，你必须在使用预处理语句的同时显式地对你的列进行验证。解决方案看起来如下：


    ![Image](img/138.jpg)


    代码将首先验证表单提交的键。然后，它将根据过滤后的键生成 SQL，但它将使用预处理语句占位符而不是直接注入值。之前显式定义列的代码是最好的。但通过添加这种过滤，你的代码将降低其脆弱性。


    # 跨站脚本 (Cross-Site Scripting)


    虽然 SQL 注入可能是破坏性最强的攻击类型，但跨站脚本可能是最容易实现的。这很大程度上是因为数据通常从数据库中提取，数据库是本地的，而我们倾向于信任本地资源。如果数据来自外部，你不能认为数据是可靠的——如果在插入之前没有经过验证，就更是如此。而且没有办法保证来自数据库的数据已经过适当的验证。这还假设你的验证器捕获所有可能的注入方法。


    跨站脚本发生在有人向 Web 应用程序注入非预期的内容时。这些内容随后显示在用户的浏览器中，通常会以开发者无意图的方式修改页面行为。


    最典型的攻击是在页面上嵌入 JavaScript。实现此操作最简单的方法通常是通过某种自由格式文本字段或文本区域——例如，“描述”字段或“备注”字段。因为它们是自由格式的文本，这些字段通常不具有同样严格的数据格式要求。你不仅需要让它们允许字母和数字，还要允许标点符号、引号或各种符号。


    考虑一个显示用户输入记录的模板（你将填充值而不是看到完整的利用过程，因为这需要多个 HTTP 请求来演示）。


    ![Image](img/139-1.jpg)


    运行此代码将生成以下 HTML 代码：


    ![Image](img/139-2.jpg)


    这没问题。但如果有人输入包含某些 JavaScript 的描述会发生什么呢？


    ![Image](img/140.jpg)


    这段代码相对无害，但它说明了为什么这是一个问题。尽管开发者从未打算在那里执行 JavaScript，但攻击者仍然可以操纵页面。


    防止此类攻击最简单的方法是只需确保你已将任何 HTML 特有的字符转换为其等效的 HTML 实体。换句话说，确保你过滤了这些字符。

