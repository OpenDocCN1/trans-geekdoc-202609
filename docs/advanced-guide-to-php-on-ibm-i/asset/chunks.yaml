    我们已经某种程度上探究了单一职责原则（Single Responsibility Principle），但尚未完全。为了做到这一点，让我们添加 HTTPS
    支持。还记得 `RequestManager` 类吗？如果你不遵循 SRP，你可能会想要去扩展或重写该类。然而，该类的职责是作为传递请求和响应对象的通道。如果你在那里实现了
    HTTPS 支持，那么该类就拥有了多个职责。


    你可以通过实现 `RequestInterface` 来定义一个 HTTPS 接口，但这样做违反了 DRY 原则（独立于 SOLID）。DRY 的意思是*不要重复编写你自己*（Don’t
    Repeat Yourself）。


    在这个例子中，最佳方案显而易见。只需扩展 `HttpRequest` 即可：


    ![Image](img/63.jpg)


    `RequestInterface` 有一个职责：定义输入处理的要求。`HttpRequest` 类只负责提供指向 HTTP 的接口。同样，`HttpsRequest`
    类的唯一职责是提供指向 HTTPS 的接口。`CliRequest` 同样也有一个职责：提供指向命令行的接口。


    # 开闭原则 (Open-Closed)


    [*http://bit.ly/php_ibmi_oc](http://www.bit.ly/php_ibmi_oc)*


    在上一节中，你无意中也接触了开闭原则。开闭原则规定，软件实体对扩展开放，但对修改关闭。这意味着一旦一个类被定义、签名、密封并接受，它就被认为是不可变的。若要对该类进行更改，你应该扩展该类。开闭原则还断言，类的源代码在编写后不应被更改。要完全有把握地坚持这一点可能有点不实际。例如，修复漏洞（Bug
    fixes）是对类源代码可以接受的更改。


    然而，不增加或修改类的功能仍然是一个值得遵循的良好原则。这种观念促进了应用程序组件内部的*稳定性*。如果功能不改变，那么对回归测试的需求就会大大减少，或者至少失败的潜在风险会降低。正如前一段所提到的，你通过
    `HttpsRequest` 类创建了这样一个例子。你没有在 `HttpRequest` 类中创建新功能，而是扩展了它，并且顺便不仅使用了开闭原则，还使用了下一个原则：里氏夫替换原则（Liskov
    Substitution Principle）。


    上一节的示例实现了开闭原则，因为当你的应用程序增长并需要包含 HTTPS 功能时，你没有修改原始的 `HttpRequest` 类。你扩展了它并添加了功能，但你没有更改它。


    # 里氏替换原则 (Liskov Substitution)


    [*http://bit.ly/php_ibmi_ls](http://www.bit.ly/php_ibmi_ls)*


    里氏替换原则以该术语的创造者 Barbara Liskov 命名。她指出：“使用基类指针或引用的函数必须能够在不知道类型的情况下使用派生类的对象。”尽管你在
    PHP 中不使用指针，但你确实在使用类。因此，当你声明需要某个类型的类，而代码传递了一个派生类型的对象时，这对你的应用程序不应该产生任何影响。


    为了演示，让我们采用之前的请求代码并实现一些代码逻辑：


    ![Image](img/64.jpg)


    `doSomething()` 方法从请求管理器中获取请求对象，并请求一个名为 `someOption` 的参数。为每个接口实现三个不同的启动逻辑（bootstraps）看起来如下：


    ![Image](img/65-1.jpg)


    当执行 `SomeLogic::doSomething()` 中的代码时，它并不关心传递的是 CLI、HTTPS 还是 HTTP 请求对象。这就是里氏替换原则的含义。执行的逻辑并不关心传递的是哪个类。它只关心该操作是否符合预期，而这种预期是在抽象层非常底层定义的。因此，为（例如）数据队列添加另一个接口，不会对应用程序产生任何微不足道的改变。


    # 接口隔离原则 (Interface Segregation)


    [*http://bit.ly/php_ibmi_is](http://www.bit.ly/php_ibmi_is)*


    对接口隔离感到困惑的最简单方法是它指的是接口（interfaces）。我的意思是：


    ![Image](img/65-2.jpg)


    虽然实现通常会涉及接口，但我认为“接口”所指的并不是 Interface 本。接口隔离原则规定：“客户端不应被强制依赖于它们不使用的接口。”尽管 Martin
    使用了“interfaces”一词，但我认为他并非特指 Interface 的原因之一是，他的代码中没有一个包含 Interface。他用 C++ 编写了示例代码，而
    C++ 并不像 Java 和 PHP 那样拥有接口。诚然，我不是一个 C++ 程序员，我也不知道 Robert Martin 的想法。但尽管 C++ 有实现类似接口行为的机制，它们从技术上来说并不是
    Interface。


    在考虑接口隔离原则时，这种区分让我们稍微放松了一些。如果我对 Martin 文本的理解是正确的，“interface”一词更多是指 API 而不是某一个编程概念。正如前面提到的，这可能会涉及大量
    Interface 使用，但这一原则的实现并不特定于某种强定义的语言函数。随着学习的深入，你会发现为什么。。


    在思考接口隔离时，你需要观察对象是如何与其他对象之间传递的。全局变量通常被认为是不好的，有几个原因。其中一个是它们定义了应用程序运行必须满足的全局性需求。如果你在某处定义了此类需求，你就必须在所有地方都定义它。


    这就是接口隔离原则旨在限制的问题的一种近似。假设应用程序有一个执行大量操作的巨型类。在传递这个庞然大物时，会在你需要的每个地方引入依赖。


    例如，假设你有一个对象持有多个对象，例如会话管理器和数据库等。尽管你最终传递的是整个对象，但你应该让方法只感知它需要的功能。


    让依赖代码感知功能的最佳方法是使用接口。这是因为 PHP 中的接口可以多重继承，但类不能。因此，你可以构建拥有多个依赖的接口，并使用这些多重扩展的接口在方法中定义所需的信息。你不会在示例中这样做，但这是一个可选的方案。


    在示例中，你将定义两个接口：`ContainsDatabase` 和 `ContainsSessionManager`。请忽略类命名缺乏创造力。两者都定义了实现类将具有的具体需求：


    ![Image](img/67-1.jpg)


    当你构造 `BigClass` 时，确保你定义了该类实现所需接口的所有方法：


    ![Image](img/67-2.jpg)


    尽管到目前为止在使用接口隔离，但通过让接口定义单独的功能，当我们在查看依赖类的实现时，你会看到益处：


    ![Image](img/68-1.jpg)


    在这里，`save()` 方法表明你不在乎对象的其他事情，只关心提供的对象能否保存到数据库。在主代码中，你可以传递 `BigClass` 的实例或数千个其他类中的一个，但这对小类来说没有区别。因此，对
    `BigClass` 的更改不应影响小类，因为后者只关注一件事。


