    Even though you are naming this an adapter, it is an implementation of the Strategy.
    With the previous Adapter pattern, you called each adapter individually. With
    the Strategy pattern, you let the `AuthenticationAdapter` do that for you:


    ![Image](images/37.jpg)


    It is a subtle, somewhat confusing, but important difference.


    # Lazy Initialization and Lazy Loading


    For many programming languages, Java® for example, it makes sense to preinitialize
    objects and relationships. Java is generally run as a long-lived process, and
    developers can use much of that up-front initialization to decrease the cost of
    initialization during runtime.


    However, because PHP is a shared-nothing architecture and does not retain state
    in between requests, this kind of preinitialization can waste CPU cycles. As such,
    Lazy Initialization is a design pattern that is well worth your time to use as
    much as possible.


    The way I see it, you have two ways of using Lazy Initialization in PHP. Although
    most languages will compile down to a binary that has all the required components
    either included or referenced, PHP does not do this. It starts with a clean slate
    for each request. Because of this, you must include dependencies again for each
    request. This typically looks as follows:


    ![Image](images/38-1.jpg)


    The effect is that `myclass.php` and `anotherclass.php` will be loaded regardless
    of whether they are needed. The work-around is to use the autoloader discussed
    in [Chapter 1](#005_Chapter01.html#ch-1). In my testing, using the autoloader
    over static `require()` calls increased performance by more than 20 percent, even
    with an opcode cache.


    The general approach for Lazy Initialization is to delay the creation of an object
    until it is needed, as the following example shows:


    ![Image](images/38-2.jpg)


    To retrieve the `Engine` object from the `Car` object, the `getEngine()` method
    must be called either from inside the class or externally. By doing this, the
    application will instantiate the `Engine` object only when `getEngine()` is called,
    even if the `Car` class has an instance. If the `Engine` object is heavy in terms
    of its initialization cost, the use of Lazy Initialization can prove beneficial.


    Next is Lazy Loading. This design pattern is like Lazy Initialization, but you
    implement it from within the context of data instead of class instantiation. Although
    you can save CPU time by delaying the initialization of an object, you can save
    more time by delaying the loading of data.


    Inefficient data handling is probably one of the most common causes of performance
    problems, more so than bad architecture, though the two are often related. The
    worst problems generally come from retrieving more data than necessary, but a
    secondary issue can definitely stem from loading data when it is not needed or
    loading it multiple times.


    The following example shows stub-like code that contains some logic but none of
    the actual logic for loading (that is dependent on your data storage mechanism
    and not required for you to understand the lesson the example is teaching). I
    will omit the implementation details so you can focus on how to use Lazy Loading
    from a logical perspective:


    ![Image](images/39.jpg)


