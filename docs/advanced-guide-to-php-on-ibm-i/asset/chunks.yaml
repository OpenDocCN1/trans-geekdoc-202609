    # Observer/Publish/Subscribe


    In the past, PHP programs did not handle customizations very well. This is readily
    apparent in e-commerce realm but prevalent in many places. Magento is an example
    of one of the earliest applications to take concept seriously.


    At first glance, this seems to be a good way of extending functionality. However,
    the Observer pattern requires two things: instances of both the request class
    and the authentication class. For a large application, this can involve a lot
    of overhead to prepare. The `$data` property contains customer information, and
    `$orders` has order information. To retrieve the orders, you use the `getOrders()`
    method. Notice that this method first checks to detect whether `$orders` is null.
    If it is null, then this class will query the database or the Toolkit to load
    the orders.


    The Visitor pattern is more explicit than the Observer pattern. The Observer pattern’s
    job is to simply notify an object that another object has changed, has done something,
    or is about to do something. The Visitor pattern provides not only an event to
    respond to but also a means of modifying data within the object without having
    to extend the object. In other words, the purpose of an Observer is to “respond,”
    whereas the purpose of a Visitor is to “process.” Another difference is that an
    application can often have multiple Observers but only one Visitor, though that
    Visitor can have sub-Visitors.

