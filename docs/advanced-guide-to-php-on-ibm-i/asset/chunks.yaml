    ![Image](img/156.jpg)


    简单。


    到目前为止，你已经看到了 PHP 中用于哈希的两个特定函数，但许多其他哈希选项要好得多。`MD5` 基本上已经破解了；`SHA-1` 在写作时仍然还可以，但它有一个理论漏洞，并被认为是一种弱的哈希机制。那么你应该用什么呢？


    首先，即使你打算使用 `SHA-1` 或 `MD5`，也不要使用 `sha1()` 或 `md5()` 函数。更好的哈希函数是 `hash()`。它的功能与
    `sha1()` 和 `md5()` 完全相同，但 `hash()` 允许你通过参数指定机制应该使用哪个算法。要查看哪些可用算法，请使用 `hash_algos()`
    函数。当我运行它时，我得到了略多 42 个选项。那么选哪一个呢？很难确切，但美国国家标准与技术研究院（`NIST`）建议所有政府机构都使用 `SHA-2`
    算法之一。你是否信任 `NIST` 是另一回事。多种 `SHA-2` 算法都是可用的。


