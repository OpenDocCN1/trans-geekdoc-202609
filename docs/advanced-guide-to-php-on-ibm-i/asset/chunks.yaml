    第二组人员由你组织内部的人组成。他们比任何人都更了解你的应用程序。这些内部人员了解你的 `URLs`、服务器名称、登录要求以及许多其他关键信息，他们可以利用这些信息来执行未经授权的操作。2005
    年的一项研究发现，大约 70% 的成功攻击来自组织内部。Gartner 的 Rich Mogull 对此有一个非常有趣的观点。他说：“企业网络就像糖果棒：外面硬硬的，里面很软且有嚼劲。”黑客团体可能获得了所有的名誉，但他们只是问题中占比相对较小的一部分。


    你最需要防范的是那些知道如何实施基础网络安全攻击的人。这些攻击并不复杂，因此很容易实施。取决于攻击的性质，它们可能会对你的组织造成毁灭性的影响。这些人可能可能在你的组织之外，或者处于双重威胁——他们就在你的组织内部。


    为什么这些人会比所谓的“超级黑客”或像 `Anonymous` 这样的团体更危险？首先，超级黑客之类寥寥无几，除非你是像能源部、`Microsoft` 或
    `Amazon` 这样的大目标，否则他们对你不会产生兴趣。他们不喜欢“无聊”的目标。如果从他们的心里看你是无聊的，他们通常不会理会。


    其次，能够发起基础网络安全攻击的个人更危险，因为这类类型的攻击不需要太多专业知识就可以轻松实施。这些人通常也不局限于特定的程序，并被认为是一种通用的攻击向量。在许多情况下，你正在使用哪种
    Web 编程语言并不重要；攻击向量通常是相同的。


    但关于这些攻击向量的好消息是，它们并不多，而且关闭这些攻击向量的规则非常简单。这些规则简单到你可以用四个词来总结：


    *   验证输入

    *   过滤输出


    虽然你无法完全消除威胁，但如果基础攻击无效，你的 Web 应用程序对攻击者来说将变得不再有趣。


    Web 应用程序往往受到五种主要漏洞的影响：


    1. `SQL injection`（SQL 注入）

    2. `Cross-site scripting`（跨站脚本）

    3. `Cross-site request forgery`（跨站请求伪造）

    4. `Session fixation`（会话固定）

    5. `Session hijacking`（会话劫持）


    进入的方法有很多，但那些方法通常更晦奥，或者需要对系统有深入了解。然而，攻击者通常可以在对你的系统了解极少的情况下实施这里列出的五种利用。


    在本章中，我们将研究这五种攻击，并讨论一些基础加密实现。


    # SQL Injection


    `SQL injection` 攻击可能是最危险的。据估计，在个人获取网站用户账户访问权的密码泄露中，`SQL injection` 是主要的攻击向量。考虑一下你通常是如何查询数据库的：


    ![Image](img/132-1.jpg)


    在这里，`PHP` 将数据从查询字符串插值到变量中，产生如下查询：


    ![Image](img/132-2.jpg)


    但那是在使用你网站的人们表现良好的情况下。为了演示这个问题，让我们来看一个相对温和的攻击，它可能会激发你的想象力。考虑如果你的查询字符串从 `search=Kevin+Schroeder`
    变为 `search=Kevin Schroeder’ OR NAME=''Mickey Mouse` 会发生什么。这种修改将导致 `PHP` 将 SQL
    查询渲染如下：


    ![Image](img/132-3.jpg)


    从返回的数据角度来看，这个查询是无关紧要的。然而，它说明了一个问题。攻击者能够以开发者无意图的方式修改查询的行为。开发者并没有意图让一个 `OR` 条件包含在查询中。


    为了演示一个更具问题的向量，考虑一个包含两百万行数据的表。如果有人将查询字符串更改为 `search='' or 1 = 1--` 会发生什么？这个字符串将跳出引号，导致数据库查询一个始终返回为真的条件。因此，将生成以下查询：


    ![Image](img/132-4.jpg)


    因为由于这是一个真语句（true statement），此查询将导致 `DB2` 返回表中的每一行。（注意，你添加了 `--` 作为注释，这会消除掉原始查询结构中部分的任何后续的
    `SQL` 标记。）


    这个查询有两个明显的问题：


    1. 它将返回所有数据，可能让攻击者获得他或她原本无法访问的数据。

    2. 攻击者可以使用此查询作为拒绝服务攻击，在处理结果集时使服务器无法响应。这种攻击可以在多个连接中多次重复，并导致 Web 应用程序崩溃。


    到目前为止，我们只查看了修改过的 `SELECT` 查询。在某些数据库驱动程序中，攻击者可以通过分号终止每个查询来实施将 `SQL` 查询链接的额外攻击。他们可以通过更改
    `GET` 搜索参数为 `search=''; DELETE FROM KEVIN.accounts; --` 来。


    幸运的是，尽管 `DB2` 允许这种链路操作发生，但 `DB2 PHP` 驱动不允许。这种措施对于防止灾难性的数据丢失非常有帮助。但如果你正在使用像 `MySQL`
    这样的数据库，你应该意识到这种攻击。


    虽然数据删除很糟糕，但还有更糟糕的情况。你通常可以恢复被删除的数据。至少，你*应该*拥有某种备份策略来防止那种损失。


    更大的问题是数据修改。如果有人修改了表中的某行，你注意到它的概率比数据丢失要得多。因此，可能存在一个开放的漏洞，可以被利用几周、几个月或几年，而你完全不知道自己出了问题。


