  trans: "\n\n那么为什么要费尽精力去做 Apache 基本上已经在做的事情呢？原因在于这个示例并没有演示 `Front Controller`（前端控制器）的所有功能。由于\
    \ `Front Controller` 总是会被执行，你可以在其中构建逻辑来解决前面提到的某些问题。其中一个问题就是如何确保始终对管理区域进行身份身份验，而不需要不断向主执行流中注入（可能会发生更改的）验证代码。\n\
    \n为了解决这个问题，你将从你在“发布/订阅”章节中构建的 `EventManager` 类中提取一些逻辑。让我们来看内置了 `EventManager`\
    \ 支持的 `Front Controller`：\n\n![Image](img/49.jpg)\n\n![Image](img/50.jpg)\n\n\
    ![Image](img/51.jpg)\n\n在这里，你根据请求的 URL 分发了多个不同的事件，这允许你编写一个可以挂载到应用程序通用、半通用或特定位置的订阅者。URL\
    \ `http://localhost/admin` 将分发三个事件：`predispatch`（通用）、`predispatch_admin`（半通用）和\
    \ `predispatch_admin_index`（特定）。对于 URL `http://localhost/admin/logout`，事件为 `predispatch`（通用）、`predispatch_admin`（半通用）和\
    \ `predispatch_admin_logout`（特定）。\n\n现在，你可以向请求中注入订阅者，而无需修改任何主代码。在这种情况下，你将在 `predispatch_admin`\
    \ 处添加订阅者，以便验证所有进入的请求，确保它们来自已登录的管理员：\n\n![Image](img/52.jpg)\n\n此示例检查在 `http://localhost/admin`\
    \ 下处理的每个请求，以验证请求是否以管理员身份登录，`/admin/login` 和 `/admin/logout` 页面除外。这些页面是未验证用户应该所在的地方。\n\
    \n因此，即使你使用的是传统的 PHP 执行模型，也可以使用 `Front Controller` 设计模式如何让你能够在请求的任意位置注入部分功能，而无需修改先前的代码。\n\
    \n# 模型/视图/控制器 (Model/View/Controller)\n\n关于模型/视图/控制器有很多书籍，所以我们在这里只简要回顾一下。MVC 在桌面端已经存在了多年，但当\
    \ Ruby on Rails 实现它时，该框架席卷了 Web 世界，开发者发现了以前未见过的生产力。当然，正如大多数简单的断言一样，事实并非完全如此，但它足够接近事实，可以被认为是准确的。\n\
    \n在 Rails 出现之前，大多数 Web 应用基本上是 WordPress 类型的脚本。我并不是否定 WordPress 这一现象，但我怀疑是否有人认同\
    \ *WordPress 是一个伟大的架构* 这一观点。我是 WordPress 的粉丝，但实现它的架构确实缺乏某种优雅性。尽管说实话，大多数软件都缺乏优雅性。在大多数时间里，如果“优雅”是一种特性，它可能并没用。\n\
    \nMVC 允许更容易的关注点分离（separation of concerns）——即通过将具有相似功能的组件分组为不同的部分来设计应用程序的实践。在 MVC\
    \ 中，这些关注点是数据访问/处理、界面管理和请求分发。这意味着数据访问或处理与其他“模型”组件分组在一起；UI 组件与其他“视图”组件分组在一起；而分发、调解或设置操作被分组到各个“控制器”组件中。使用\
    \ MVC 让我们得到了一个更整洁的应用程序，数据访问类中没有 HTML，分发类中没有复杂的业务逻辑，UI 脚本中没有逻辑功能。这种强力分离不仅让应用程序更整洁，而且更易于测试。因此，它至少可以作为如何构建应用程序的良好示例。\n\
    \n通常，使用类似图 2.2 中的图表来描述 MVC 架构。\n\n![Image](img/54.jpg)\n\n*图 2.2：描述 MVC 框架的典型图表*\n\
    \n这张图既笨拙又愚蠢。它没有告诉我们关于 MVC 的任何信息。与其尝试想另一个笨拙的图，让我们尝试一组不那么尴尬的职责划分。\n\n*   **模型 (Models)**\n\
    \    *   负责加载数据和实现业务逻辑\n    *   不直接访问数据库\n    *   不启动新逻辑，除非是为了处理依赖逻辑\n    *  \
    \ 不渲染内容\n*   **控制器 (Controllers)**\n    *   负责初始化模型并指示它们做什么（包括验证）\n    *   指示加载哪些\
    \ UI 元素以及哪些数据供它们可用\n    *   从不直接调用数据库\n    *   从不直接输出结果\n*   **视图 (Views)**\n\
    \    *   负责处理浏览器输出\n    *   不实现渲染逻辑之外的逻辑\n    *   不直接访问数据库\n    *   不操作数据\n  \
    \  *   （通常）不创建对象\n\n让我们来看一个精简的示例以观察基本的工作部分。这不是你应该在生产环境中使用的示例；大约有一百个 PHP 框架可以更好地实现\
    \ MVC。这个示例旨在展示分离内部看起来是什么样，而不是如何最好实现它。\n\n关于大多数 MVC 实现需要记住的一点是，它们使用 URL 映射将给定的请求映射到给定的对象和方法。映射通常为\
    \ `http://localhost/class/method/parameters`，通常由 `Front Controller` 直接管理，或由分发器/路由器类管理。在这个示例中，你将重写早期的\
    \ `FrontController` 类，使其现在将 URL 映射到类结构上：\n\n![Image](img/55.jpg)\n\n这个基础路由器只需查看请求的\
    \ URI 并尝试将其与类名匹配。它没有检查控制器的有效性，这应该被检查并作为错误处理。路由器查看 URI 的第一部分并将其定义为控制器类（如果存在），并对第二部分执行相同操作，将其定义为方法。如果控制器类和方法都不可用，你将为每个部分使用默认值\
    \ index，以便你可以定义执行点。\n\n在类名后附加 Controller 标识有助于防止意外实例化不是操作控制器的对象。例如，你不会让最终用户任意实例化数据库连接。额外的保护措施是在方法名后附加\
    \ Action 名称。通过这种方式，你确保只有被定义为 public actions 的方法会被调用，从而保护类中定义的可能具有可利用逻辑的其他方法。然后，验证该对象是否扩展了新的抽象类\
    \ `ActionController`，并调用该方法。\n\n`ActionController` 类确定该类是否确实是控制器，并定义了一些常用功能：\n\
    \n![Image](img/57-1.jpg)\n\n如你所示，这里定义的唯一方法是处理视图脚本的方法。\n\n单个 action 控制器是连接视图和模型层的枢纽。它通常负责创建对象以实现逻辑，并将它们与适当的视图脚本绑定。示例展示了这种基本实现：\n\
    \n![Image](img/57-2.jpg)\n\n在这种情况下，你有一个名为 `IndexController` 的类，和一个名为 `indexAction`\
    \ 的方法。这些都是默认名称，并将映射到网站的首页：`http://localhost/`。当有人请求该 URL 时，Front Controller 将请求映射到\
    \ `IndexController::indexAction()`，并且该方法将被调用。\n\n"
- fmt: '

    The `indexAction()` method has an arbitrary object called `Message`. The object’s
    actual implementation is unimportant in this example, but its job is to load a
    given message (presumably from the database) and then be passed into the `renderScript()`
    method for processing in the view. For the sake of argument, presume that the
    `Message` class has a method called `__toString()`, the reason for which will
    be apparent in the view script:


    ![Image](images/58.jpg)


    That is all there is to the view. Granted, most applications will have much more
    complicated view logic, but the point here is to show the kind of logic you will
    see in the view. Generally, the view should contain a series of echoes, if/then
    statements, and loops. That is it.


    As this example shows, although you can add some complexity to your application
    by using the MVC approach, you gain so much by having defined types of logic in
    defined places, as opposed to letting that logic be scattered about by the wind.
    Defining logic in specific places makes an application more predictable and, if
    you do this in conjunction with an event manager, very extensible. This approach
    also minimizes the concern that large-scale changes will negatively affect deployment.
    For example, if management arbitrarily decided that the `Message` class should
    use a web service instead of a database call, you could make that change in the
    model layer, and the controller and the view would be none the wiser.


    # SOLID


    Now let’s move from design patterns to application design that uses the SOLID
    methodology. It is a relatively new methodology devised by Robert C. Martin in
    2000. What SOLID does is define five general principles applicable to systems
    that are easy to maintain and extend over time. Although at that time SOLID was
    not yet a term, Martin’s paper “Design Principles and Design Patterns” (see [http://www.objectmentor.com/resources/articles/Principles_and_Patterns.pdf](http://www.objectmentor.com/resources/articles/Principles_and_Patterns.pdf))
    covers all the principles for its existence. [Table 2.1](#006_Chapter02.html#tab2-1)
    shows these principles.


    | Table 2.1: SOLID principles |

    | :-- |

    | **S** | Single Responsibility |

    | **O** | Open/Closed |

    | **L** | Liskov Substitution |

    | **I** | Interface Segregation |

    | **D** | Dependency Inversion |


    In “Getting a SOLID start” (see [https://sites.google.com/site/unclebobconsultingllc/getting-a-solid-start](https://sites.google.com/site/unclebobconsultingllc/getting-a-solid-start)),
    Martin wisely states that these are principles and not rules. The principles are
    good to follow, but they are not always required nor will they always be beneficial.
    But using them in practice will make software easier to maintain concerning future
    changes and will make applications much more predictable.


    In the following sections, I cover each of the principles, prefaced by a link
    to the source material written by Robert Martin.


    # Single Responsibility


    [http://bit.ly/php_ibmi_srp](http://www.bit.ly/php_ibmi_srp)


    The Single Responsibility Principle (SRP) states that an individual class should
    have only one reason for being. In other words, a class should exist for one purpose.
    Consider a relatively simple scenario where, in order to manage HTTP requests,
    a class called `WebManager` manages `GET` and `POST` variables and handles aggregating
    output from multiple different sources. This violates the SRP because the `WebManager`
    class is responsible for both input and output.


    This tactic does not work out so well for a few reasons, the least of which is
    that it will significantly reduce your ability to modify the application. Consider
    what happens if you want to add command-line capabilities to an application. To
    use the `WebManager` class in that scenario requires ensuring that changes made,
    or extensibility implemented, will work with both the HTTP-based manager and the
    CLI-based manager. And if they do not, you will have a lot of work ahead of you.
    Therefore, it is better to separate responsibility into individual classes.


    Doing so affects how you start designing an application. Yes, an end goal is in
    mind, but you approach that goal with ever-decreasing layers of abstraction until
    you have an implementation that is in perfect focus (in theory). The reason for
    all these abstraction layers is to protect you against massive refactoring in
    the future and from incomprehensibly complex test cases.


    Architects do not add this complexity because they will get paid more (well, maybe
    some will). By having all these levels of abstraction, you can build out a very
    extensible system that is much more manageable over the long term.


    Let’s go back to the former example of a `WebManager`. Rather than having a single
    class that manages all interactions with the web server, you have distinct elements
    that manage both input and output. With the input element, you have more than
    one method of implementation for handling input. So later when you receive a new
    business requirement to have a long-running PHP request sitting on a data queue,
    you simply build out the new implementation on top of the base implementation.
    And if you have thought through the abstraction, your whole application might
    be able to use the new input method.


    Developers often implement this through the use of interfaces and abstract classes.
    Not that those interfaces and classes are required, but frequently the base levels
    of abstraction have bits and pieces implemented that are common among different
    methods but not complete enough to be considered an implementation.


    Borrowing heavily from Zend Framework, the following example shows how a request
    abstraction would look. You will build out multiple levels of abstraction so you
    can handle HTTP, HTTPS, and a command-line interface. You start with a basic interface
    called `RequestInterface` because (in this example) the multiple divergent paths
    share virtually no functionality:


    ![Image](images/60-1.jpg)


    With that defined, you then build an HTTP interface:


    ![Image](images/60-2.jpg)


    And now, the command-line interface:


    ![Image](images/61-1.jpg)


    But the request and response for a web or CLI request is closely related, so you
    create a request manager that houses both objects:


    ![Image](images/61-2.jpg)


    Note that the first parameter (ignore the second one) requests a type of `RequestInterface`.
    So any object implementing that interface will be accepted. For an HTTP-based
    bootstrap, the code looks like this:


    ![Image](images/62-1.jpg)


    And for a command-line bootstrap, it looks like this (you will ignore defining
    the options for this example):


    ![Image](images/62-2.jpg)


    Now when the request manager is passed around, it will contain the proper request
    object for the type of interface, and the rest of the application does not know
    (nor care) what initiated the request—the web or the command line. This is a main
    reason advanced applications contain such high levels of abstraction; the application’s
    internal parts should know only the minimum required to implement their functionality.
    If they need to know more than that, they start experiencing tight coupling, greatly
    decreasing your ability to modify the application and test individual components.


    Imagine you started with a web-only application but then needed to add command-line
    support. If you hard-coded request dependencies (such as directly referencing
    `$_GET`), you would now have a massive refactoring job to do. However, if you
    built in a proper level of abstraction as you did here, you need to make that
    change in only one place.

    '
