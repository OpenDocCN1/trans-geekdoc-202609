    What is also interesting is that while I was writing this example, a simple bug
    in the code was causing two of the five tests to fail. To figure out the problem,
    I initiated a debug unit test and stepped over the individual lines where the
    application was misbehaving. The bug took fewer than two minutes to diagnose and
    fix. Because the tests were automated, I was able to validate that the fix worked
    and that all of the other tests were still working. And I did so in a time frame
    that would have been at least an order of magnitude longer if done with traditional
    development.


    Plus, there is something satisfying about all the tests passing. As good as failure
    might feel, success is better.


    # Test Suites


    Individual tests are extremely useful from a debugging perspective, but individual
    testing is only one part of the step. You also want to be able to run large numbers
    of tests, but, after a while, the individual tests might become prohibitive. `PHPUnit`
    lets you run not just one test at a time but also collections of tests. This ability
    allows you to organize your tests and run groups of them at once.


    Doing this requires creating a new test suite class. You do not need to create
    this class to run unit tests, but it will help with organization as the number
    of tests your company writes.


    To create a new test suite, you create a new class that extends `PHPUnit_Framework_TestSuite`.
    In the constructor, set the name, and then add the full class names of all the
    tests you want in this suite.


    Following is an example of a test suite that will run the unit tests you defined
    earlier:


    ![Image](images/219.jpg)


    As you write more tests, simply add them by using the `addTestSuite()` method
    in the individual suite that will house the test. Then when you run the test suite,
    the output will look like that in [Figure 7.7](#011_Chapter07.html#fig7-7).


    ![Image](images/220-1.jpg)


    *Figure 7.7: Result of running test suite*


    The only difference between this test and the one run previously is that now the
    test is under the control of the `testsSuite` class instead of running on its
    own.


    # Injecting Dependencies


    Before moving to the next section, we need to cover a fairly complex topic. However,
    instead of delving into the details, we will cherry-pick some best practices from
    this topic and implement them in the next section, “Working with Data Sources.”


    The topic is Dependency Injection, also known as `Inversion of Control`. A lot
    of complexities can be introduced into this topic, particularly once we start
    discussing the Dependency Injection Container (`DI Container`) and its configuration.


    However, Dependency Injection as a concept is extremely simple. We talked about
    it in [Chapter 2](#006_Chapter02.html#ch-2). First, let’s presume a database class:


    ![Image](images/220-2.jpg)


    Now let’s look at the “old” way of getting a database connection:


    ![Image](images/221-1.jpg)


    Dependency Injection (or Inversion of Control) does it this way:


    ![Image](images/221-2.jpg)


    That is it. That is Dependency Injection. Rather than allowing the object to retrieve
    its dependencies, in this case a database adapter, they are given to it.


    This causes a problem because now anytime you create an instance of an object,
    you must inject its dependencies. But objects that have numerous dependencies
    might require many calls to the setters of the object. Multiply that by the number
    of objects created in a given context, and you can have a lot of boilerplate code
    to write. So along comes the idea of a DI Container.


    A DI Container is an object where you can request a class and it will provide
    an instance of that class, fully configured with all of its dependencies. It handles
    that heavy lifting for you, but at the cost of configuration. A DI Container object
    can be notoriously difficult to configure.


    Although Dependency Injection can add some complexity to your application, its
    usage can benefit you greatly when you make your application testable.


    # Working with Data Sources


    The reason for discussing Dependency Injection is that, when unit testing your
    application, you do *not* want to require the database for the test to pass. Remember,
    you are testing “units” not “systems.” After you start testing systems, you can
    get into a never-ending spiral of database setups and teardowns, your tests slow
    to a crawl, and you end up taking some form of antidepressant to help you make
    it to 5:00.


    To keep you off the antidepressants, there is a concept called `mock objects`.
    These objects look like the object you are injecting, sound like the objects you
    are injecting, taste like the objects you are injecting, but are not the objects
    you are injecting.


    This sounds less crazy when you see what you can do with them.


    You must create a mock object from within the individual unit test class. The
    functionality exists within `PHPUnit` and is not used in your production environment.
    Mock objects are used only in unit testing. Their purpose is to let you bypass
    complex logic that is executed *outside the item being tested* by providing a
    defined return value instead of executing it. In other words, you can specify
    an external dependency and customize its behavior so that any methods the class
    you are testing depends on are not executed, but their anticipated values are
    returned.


    To illustrate how mock objects work, let’s create another test that simply mocks
    the `Address` object:


    ![Image](images/223.jpg)


    First, you call `getMock()` on the current test object. There are several parameters,
    but we will examine only the first two right now. The first parameter is the name
    of the class you want to mock. The second is the name of the methods you intend
    to mock. This method returns a proxy of the mocked object that you can then configure.


    To begin, you tell the mock object what you expect to do. Here, you expect nothing
    in particular, so you specify `self::any()`. Then, `expects()` returns an invocation
    mocker. From that object, you request an individual method that you want to configure.
    In this case, it is `getState()`. However, you can also instruct it to throw an
    exception when that method is called, or you can give the mock object multiple
    values so it can return different values so that different calls will return different
    results.


    The last part of this example is where you call the method. Remember that when
    the original `Address` object is called before setting the state, it will return
    null. Here, you are testing that it will return TX.


    When you run the test, it passes.


    Let’s change the test a little. Note where it contains `self::any()`. You can
    replace the method in the `self` class with one of several different options:


    *   `any()`

    *   `never()`

    *   `atLeastOnce()`

    *   `once()`

    *   `exactly(int $count)`

    *   `at(int $index)`


    So change it to `never()` to see what happens:


    ![Image](images/224.jpg)


    This time when you run the test it fails, because you told the test that you did
    not expect the method `getState()` to be called ([Figure 7.8](#011_Chapter07.html#fig7-8)).


    ![Image](images/225-1.jpg)


    *Figure 7.8: Call to getState() causes test to fail*


    This example was for illustration purposes only. Because you mocked the element
    you tested, this test provides no benefit. So let’s write one that does have benefit.


    To do that, add a method to the original `Address` class that loads the object
    from the database:


    ![Image](images/225-2.jpg)


    As you can see, the example uses the connection from the protected property `$conn`
    and creates a prepared statement. You execute the statement and fetch the result
    set. Then, you assign each value from the result set to an internal class property.
    Never mind some of the weaknesses, such as allowing the database to arbitrarily
    set properties in the class; this is for illustration purposes.

