    # **7**


    # Test-Driven Development


    Have you ever run into a situation where you built something or made a change
    somewhere only to have it break something else? If your answer is no, wait until
    you graduate and get a job. It is bound to happen, and sometimes it will happen
    with catastrophic effects.


    Part of the problem is that we do not often test our applications very well. Yes,
    we press refresh and maybe use a debugger, but do we have a *system* for testing?


    But beyond using a testing system, we must go a little deeper. To best use our
    testing system, we have to build a testable application. A testable application
    is generally more complicated than the typical PHP application. However, a testable
    application pays for itself exponentially because it lets us repeatedly test all
    parts of our application to verify that they are working properly from start to
    finish.


    Test-driven development is the practice of building out an application based on
    tests, rather than building it in a fluid manner. The way we naturally build applications
    is that we have a problem, we figure out how to solve it, we build the application,
    and then we test it. Test-driven development flips that process around. Instead
    of initially building out the application, we build the tests first and then write
    our code to pass the tests. It sounds a little counterintuitive, because all through
    our schooling years, the last thing we did before going to the graduation party
    was be tested. However, building our tests at the outset provides a lot of benefits.


    First, it forces us to think of *how* we intend to use the functionality that
    we are creating. Second, if we are building our tests before building out the
    application, we are more likely to consider the required range of inputs, making
    us more likely to test edge conditions. This testing will lead to more stable
    software. Third, it makes us more productive. Unit testing has been shown both
    in studies and in real life to make developers more productive overall, and it
    is one of the few practices that have virtually no downside.'
