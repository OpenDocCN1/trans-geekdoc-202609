    First, the method checks whether `HTTP_ACCEPT` has been set. If it has not, the
    method will remain at the default version. If `HTTP_ACCEPT` does exist, the method
    will search the `/services` directory for the various API versions. These will
    be used as a filter. Because the `Accept` header can have multiple values separated
    by a comma, you explode it on the comma, filter out everything but the version,
    and then compare the version found with any previous versions. You always want
    to use the most current version, so check to see whether the version found is
    greater than any previous versions discovered. If you do find a valid version,
    set the API version to that.


    To activate the check, you add the call to `processApiVersion()` to the front
    of the `handle()` method. Then, change the content type from `application/json`
    to the proper `vnd` one:


    ![Image](images/262.jpg)


    Let’s see what this looks like when you check various `Accept` headers against
    this functionality.


    ### First, no API version:


    ![Image](images/263-1.jpg)


    Now, the previous API version 1.0:


    ![Image](images/263-2.jpg)


    Notice the different format of the date?


    Next, you will test with two different API versions:


    ![Image](images/263-3.jpg)


    As you can see, although two API versions were supplied, the server provided the
    more current of the two.


    But which method do you use? The version in the API? A custom HTTP header? The
    `Accept` header? Choosing one will win you accolades from one group but sneers
    from another.


    Here is the bottom line. You can search the Internet and find differing opinions
    on which method is best. Most Comp Sci purists will push for the latter, using
    content and version negotiation in the headers in their push for programming nirvana.
    And this is for good reason. Computers are technical devices, and technical devices
    tend to work better when things are done properly, static-ly, and predictably.
    However, computers are programmed by people who are not proper, static, or predictable.


    Be cognizant of your audience. If you are writing an API that is intended for
    people who know how to follow rules and will have full control over their clients,
    then by all means go the purist route. But if you are not, or if you are building
    for a high-speed developer community, then think about development iterations
    or increasing the usefulness of your API.


    The purists will claim that the world will annihilate itself if you do not use
    hypermedia properly, and this is not true. Programmers have this uncanny way of
    using improperly defined APIs anyway. It is the usefulness of your API, not its
    format purity, that will determine whether people will use it. For right or for
    wrong, ease of use will almost always trump purity.


    But remember that if you choose the quick-and-easy path, it will forever dominate
    your destiny.


    ### Content Negotiation


    Before we move on, we have one more versioning-related topic to cover: content
    negotiation. To be properly accurate, your API should also define a content type
    that can be requested as part of the `Accept` header and returned as part of the
    `Content-Type` header. You do this by adding a plus sign (`+`) to the end of the
    request.


    In the last example, you will modify your request to allow JSON or XML for v1.1
    of the API, but only JSON for v1.0:


    ![Image](images/264.jpg)


    Although the `Accept` header becomes longer, using this method lets developers
    define not only the version of the API they can process but the response type
    as well. Then as part of your output rendering scheme, you would not specify `json_encode()`
    directly; instead, you would add a test for the requested content type and filter
    it through a mechanism that could render it in any of the ways that your API definition
    allows.


    When your service has completed its rendering, it will look something like this:


    ![Image](images/265.jpg)


    # Authentication


    When it comes to user identification, two components are involved. The first is
    identity, and the second is authentication. Identity is when you say, “This is
    who I am,” and authentication is when you say, “And this is how I can prove it.”


    So when you build an API that uses token-based authentication, you are really
    not using authentication—you are using identity identification. A token-based
    API is often used for read-only access to data sources. That is because your only
    interest, as an API provider, is to know who is accessing the data. This is, of
    course, unless you have some level of ACL or protected information that you do
    not want to make available willy-nilly. But if you have public information on
    your API, such as retrieving a list of available products, a simple token frequently
    is enough.


    Developers often specify an identity by either providing the API token in the
    query string or using some kind of HTTP header. Basic HTTP authentication is acceptable
    too, but it requires both a username and a password and is more intended for use
    with a browser than an API.


    However, after you go from providing read access via your API to letting users
    modify your data, you must do more than simple identity identification.


    # Session-Based Authentication


    A common approach to authentication is to have a distinct API call that is used
    to authenticate the request. After the user is authenticated, a session is created,
    and a session ID is returned to the client, which the client will need to remember.


    For this example, you will use a simple MySQL API table for performing authentication
    and the previous JSON API service handler:


    ![Image](images/266-1.jpg)


    Let’s create a new service class that will handle authentication:


    ![Image](images/266-2.jpg)


    To authenticate, a client will need to call `/api/auth/login` and POST a JSON
    document that at least has `{"token":"c4ca238a0b923820cc09a6f75849b"}`. Whether
    the client provides a secret as part of the call will determine whether the session
    will have write access. An appropriate SQL query is created to check the database,
    and if a result is found, the session is started and the API key is added to the
    session. Connecting to this method will require an HTTP request similar to this:


    ![Image](images/267-1.jpg)


    And this is the result:


    ![Image](images/267-2.jpg)


    Note that the session ID has been set. The client will need to store that session
    ID and use it in subsequent requests.


    Notice what happens if you send an invalid token:


    ![Image](images/268-1.jpg)


    This token is 1 byte shorter than the previous token; therefore, it will not match
    what you have in the database:


    ![Image](images/268-2.jpg)


    The result is false. Also note that no session ID is sent.


    # Nonsession-Based Authentication


    Requiring an API to log in ahead of time can add a lot of overhead to an API call,
    as well as to the logic on the consumer side of the API. For one, the server must
    both authenticate and track the consumer. Additionally, the consumer must track
    the session and handle fallback if the session expires. It is not a great way
    of doing things. So what are you to do?


    A good option is to use some form of signing mechanism through a shared secret.
    This is the basis for several authentication mechanisms, such as OAuth 1, that
    standardize the signing mechanism. For our final example, we will not use OAuth
    but will instead use it as inspiration.


    To start, you need to have both a unique identifier (akin to a username) and a
    shared secret (akin to a password). However, although you use the shared secret
    to validate the user, you do not do so by passing it as part of the request. Instead,
    the shared secret signs the request so that the signature, not the password, is
    sent to the server.


    Because the secret is a shared secret, the server takes whichever portion of the
    request was signed, signs it itself, and then compares its signature with the
    signature that the client generated. If the two match, the request is considered
    authentic.

