    与 `SoapClient` 类似，第一个参数是 WSDL。然而，你目前运行在无 WSDL 模式下，因此你将 `uri` 定义为选项之一。`URI` 为响应体提供命名空间。当使用函数而不是类时，你必须单独包含所有将用于响应客户端的函数。


    服务器生成的响应所示（再次为了清晰起见，进行了格式化处理）：


    ![Image](img/238-2.jpg)


    注意，响应定义在 `body` 节点下的 `Response` 节点中。不过，这在很大程度上是无趣的，因为它是在后台发生的。但如果你需要查看正在发生什么，可以使用客户端上一个不常使用的设置：


    ![Image](img/239-1.jpg)


    此设置允许你使用另一个名为 `getLastResponse()` 的函数，它将输出从服务器接收到的 XML 文档。这对于调试非常有用。


    ![Image](img/239-2.jpg)


    虽然对于较小的 Web 服务，函数更容易实现，但随着 API 需求的增长，它们也会变得更加复杂。你可以通过定义类，然后在 `SoapServer` 实例上使用
    `setClass()` 方法来添加一个简单的类：


    ![Image](img/239-3.jpg)


    如果你针对此服务器运行你的客户端代码，代码的运行方式与之前完全相同。你可以继续这条路，但这将导致复杂性不断增加到毫无意义的地步。你可以通过编程方式配置许多
    SOAP 对象，但 SOAP 的优点之一是它应该能够自动记录并管理其中的许多内容。


    # 基于 WSDL 的操作


    你通常通过 WSDL 文件执行基于 WSDL 的操作。WSDL 提供了给定端点处每个可用方法的所有类型、返回值和参数的定义。通常，WSDL 文件是手动生成的，尽管这仅由那些不喜欢自己的家人并倾向于每天工作到午夜的人完成。Zend
    Studio 提供了一个用于生成这些文件的图形界面，尽管该界面在较新版本中默认没有没有安装。如果你有较新版本的 Zend Studio，你可能需要从欢迎界面选择该界面作为安装选项。对于大多数
    WSDL 文件，该图形界面易于使用。


    第一步是在你希望它存在的位置创建 WSDL 文件。然后，双击以打开 WSDL 编辑器。此时，你应该删除编辑器中的所有条目，因为它们将包含默认信息。如果你愿意，可以使用这些默认信息作为起点，但我们的示例将从零开始。


    从右键点击编辑器窗口开始。接下来，通过选择 `Add Service` 创建新服务，如图 8.1 所示。该服务将是你的客户端将连接的端点。


    ![Image](img/241-1.jpg)


    *图 8.1：Add Service 选项*


    现在，为端点赋予客户端发起 HTTP 请求的 URL。在这种情况下，它是 `http://localhost/soap/server.php` (图 8.2)）。


    ![Image](img/241-2.jpg)


    *图 8.2：端点将接收的 URL*


    设置好服务后，你需要创建一个新的绑定 (图 8.3)）。绑定是服务与端口类型（Port Type）之间一对多的关系，端口类型将包含你的方法声明。


