    如果你回答了除了“是的，我同意”之外的任何内容，你可能需要被降级。意外创建漏洞是可以原谅的。但因为不想写五行代码而引入漏洞，充其量是不专业的。


    在对密码进行哈希时，你基本上是将输入（密码）传递给哈希函数并将结果存储在某处。最典型的哈希方法是使用 `md5()`，它——让你惊讶吧——实现了 MD5 消息摘要算法。在一段时间内，`MD5`
    被认为是安全的。但由于可能发生哈希值碰撞，它不再被认为是安全的。这意味着只要提供两个输入，就可以产生相同的值。诚然，人利用该漏洞的概率很低，但计算机可以相当做到这一点。因此
    `MD5` 被认为在密码学上是不安全的，新的应用程序不应使用它。


    这并不意味着你需要立即更改你的密码哈希机制（除非你正在处理非常机密的内容）。但你应该替换它，这样当用户下次更改密码时，就会使用不同的哈希机制。换句话说，世界并没有因为
    `MD5` 在密码学上不安全而崩塌，但未患于其备。


