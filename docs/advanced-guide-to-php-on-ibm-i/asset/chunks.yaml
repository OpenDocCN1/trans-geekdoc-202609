    在某些方面，接口隔离（Interface Segregation）在定义层面上与单一职责（Single Responsibility）相似，但在实现上并不如此。正如之前提到的，我不认为接口隔离要求使用接口，但它通常会以这种方式实现。


    # 依赖倒置


    [`bit.ly/php\_ibmi\_di`](http://www.bit.ly/php_ibmi_di)


    编写具有依赖关系（例如依赖数据库连接）的应用程序的最自然的方法要么创建这些对象，要么去获取它们。有时，程序员会在依赖对象内部创建对象，如下所示：


    ![Image](img/68.jpg)


    这种技术很糟糕，因为它将值硬编码到类中，而且每个实例都会创建自己的到 `DB2` 连接。如果发生这种情况，CEO 会问你为什么应用程序运行得这么慢。为了解决这个问题，开发者通常会编写工厂或注册表来存储初始化的数据库连接：


    ![Image](img/69.jpg)


    尽管这种方法更好，因为它从模型类中移除了实例化，但它仍然引入了与数据库的紧耦合并导致了问题。这种与数据库的紧耦合意味着你可能无法在其他类中使用该类。这并不总是一个问题（该示例是特定的模型），但如果你正在编写更大功能库的一部分，这可能是事实。


    由于数据库适配器包含许多附加功能，让我们使用接口隔离原则定义一个模型类可以依赖的接口：


    ![Image](img/70.jpg)


    对于不熟悉的人来说，CRUD 代表 `创建/读取/更新/删除`。接下来，重新定义你的数据库适配器以适应 `CrudAdapter`：


    ![Image](img/70-2.jpg)


    现在，使用依赖倒置原则创建模型：


    ![Image](img/71.jpg)


    在这里，你添加了另一个方法 `setCrudAdapter()`，它允许你注入适配器。在保存操作期间，你检查适配器是否已设置。使用 `instanceof`
    操作符不仅检查值，还检查对象类型，从而一次完成两个检查。


    要将适配器注入模型，我们反转依赖关系。与其让类自己决定它依赖什么，不如声明它需要的（一个 `CrudAdapter`），由外部代码提供：


    ![Image](img/72-1.jpg)


    这到底带给了什么？假设你在保存到数据库之前需要添加更多数据过滤。在该点，重构所有模型类以依赖该类。然而，通过使用依赖倒置原则，你只需要做两个更改。


    首先，你创建一个处理连接的新类：


    ![Image](img/72-2.jpg)


    然后，将该适配器注入类中：


    ![Image](img/72-3.jpg)


    大功告成。


    对于只有几个模型类的小应用程序，这种技术可能过度了。但一旦你需要维护更复杂的应用程序，就需要这种方法。使用接口隔离不仅让应用程序的变化更容易管理，还简化了单元测试。现在你可以轻松地向类注入
    mock 对象以复制功能，而无需对数据库、工具包或 Web 服务进行外部调用。对于所有简单的应用程序，都是以更易管理的方式处理依赖的好方法。


    # 依赖注入简介


    处理注入可能是必须管理的大任务。当对象有许多依赖时尤其如此。为了学习如何处理注入多个依赖，我们将从 SOLID 中的依赖倒置原则转向通用的依赖注入。依赖注入意味着类不再自己去获取它所需的内容。相反，它声明需求并期望外部世界提供。


    *这*就是依赖注入的最基本定义，仅此此。依赖注入声誉一般，是因为在考虑这个概念时，人们实际上在思考它的许多不同实现之一。这个基本定义是一个很好的起点；一旦你知道依赖注入是一个简单的概念，就可以转向更复杂的实现概念。依赖倒置涉及拥有依赖的类，而依赖注入指的是这些依赖是如何满足的。


    上一个示例展示了手动注入依赖时的样子。然而，随着依赖的增加甚至更糟的变化，注入可能会变得繁琐。


    为了解决这个问题，许多新应用程序使用另一种类型的对象，称为依赖注入容器（Dependency Injection Container）或 DI 容器。该对象作为其他对象所依赖的对象的仓库。多个
    PHP 框架都有 DI 容器，但你将构建一个简单的来观察容器的作用。


    开始，你将稍微修改之前的类，使依赖在构造函数中定义。这是实现依赖注入容器的方法方法之一，但构造函数注入可能是容易用的。`CrudAdapter` 接口保持不变，但你为
    `Db` 和 `SomeDataModel` 类添加构造函数：


    ![Image](img/74-1.jpg)


    构造函数定义了 DI 容器需要实现的各个类的需求。


    接下来，你将从 DI 容器配置选项列表开始。我们稍后会查看实现，所以请记住它，但现在忽略它：


    ![Image](img/74-2.jpg)


    在这个示例中，你有两种不同类型的配置：`CrudAdapter` 和 `PDO`。`CrudAdapter` 显示了如何配置 DI 容器，在数组键类型为接口规范（`CrudAdapter`）提供具体实现（`Db`）。另一个选项是具体实现；它有一个不同的键叫做
    `constructor`，定义了各个构造参数。在这种情况下，通过使用反射将命名参数与键映射，提供了 `dsn` 参数值。


    在深入代码之前，让我们检查 DI 容器的使用。在这种情况下，你想要获取一个完全配置的 `SomeDataModel` 实例。为了做到这一点，你必须创建一个
    `DiContainer` 实例，它有一个名为 `get()` 的方法，并请求你搜索的类的实例：


    ![Image](img/75-1.jpg)


    就这些了。这种方法与简单创建一个新对象的区别在于，此 `$model` 实例将自动注入所有的依赖到模型中。如果你对 `$model` 对象执行 `var_dump()`，你可以看到它通过构造函数自动注入了所有的依赖：


    ![Image](img/75-2.jpg)


    通过简单调用 `DiContainer` 类就能获得完全配置的对象，这应该引起你的兴趣。至少有一。


    但如果你的模型在运行时可能需要访问其他类，会发生？答案很简单。只需将 `DiContainer` 本身作为依赖添加：


    ![Image](img/76-1.jpg)


    现在当你查看模型时，你看到了一个不同的故事：


    ![Image](img/76-2.jpg)

