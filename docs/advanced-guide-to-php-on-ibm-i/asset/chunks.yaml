  trans: '


    不久前，我为 Zend Server Job Queue 编写了一个面向对象的接口（请参考 `[`github.com/kschroeder/ZendServer-JobQueue-Job-API`](https://www.github.com/kschroeder/ZendServer-JobQueue-Job-API)`）。虽然那是件好事，但我在这里将提供一个更基础的示例。我们将在
    Zend Server API 和我创建的 API 之间采用一种混合方法。使用这种方法是因为它更容易演示，而且该 API 是为了云端或多任务队列环境设计的。而在你的系统中，这在很大程度上是不必要的并且会产生额外的开销。


    这与 Zend 的那些优秀同事所使用的策略不同。他们使用任务队列（类似于 REST 风格）的方法是为每个必须运行的任务提供一个唯一的 URL。这种技术的一个问题是它让任务测试变得更加困难。要测试一个任务，你必须调用浏览器来运行它。然而，任务所需的变量并不是通过普通的
    HTTP 参数发送的，而是以 JSON 字符串的形式发送。因此，在测试时你也必须考虑这一点。


    我更倾向于使用在中间有几层抽象的方法。这使得单元测试变得简单得多，并且封装了功能以便于代码复用。正如前面提到的，这种方法的实现更为复杂，但它通过让你在内联代码中更容易实现功能而证明了物有所值。


    ### 队列端


    让我们从队列端开始。你将定义一个访问队列的 URL。这与典型的 Zend Server 实现有很大不同。你也可以通过类似 REST 的 URI 实现此，然后编写一个
    Apache 重写规则返回到队列脚本。但这似乎是绕了远远的路。既然你已经要通过原生机制传递参数，为什么不把任务类也作为一个参数加入呢？


    要在任务队列中运行任务，首先要定义一个名为 `AbstractJob` 的抽象任务类。它的目的是为了为执行任务提供通用接口，并防止执行未经授权的类。这在本质上是一个
    RPC 方法，可能会被用作攻击向量。因此，你需要一些基础检查来确保不是任何类都可以调用和执行：


    ![Image](img/309.jpg)


    如你所见，这种实现要求你提供 `PDO` 和 `ToolkitService` 类。如果必须满足更多变量依赖，使用 `DI Container` 代码（或类似的代码）来处理这些依赖将证明是有益的。


    为了让任务运行抽象函数，你必须在所有构建用于运行异步任务的类中定义 `execute()`。这正是魔法发生的地方。


    ### 端点


    接下来是任务队列端点，任务将在这里执行并收集其结果。该端点还负责创建 `PDO` 和 `ToolkitService` 对象。显然，这是你应该通过配置完成的，但为了清晰起见，示例将硬编码连接信息：


