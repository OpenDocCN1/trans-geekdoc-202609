  raw: 'But are any of those amenities really needed? In all honesty, no. Not really.
    They are not “needed” and in some cases can be more cumbersome. But people are
    not moving from the green screen to the browser because they like fancier graphics.
    The user experience as a whole is usually better when it is implemented well.


    This is because the browser is a general user interface. It provides access to
    your web application via a standard markup language called *HTML,* or *Hypertext
    Markup Language.* This markup language works well on your desktop, mobile phone,
    and tablet. It even works well on the terminal if you use a Lynx program. Connected
    with JavaScript and Cascading Style Sheets (CSS), HTML can provide an incredibly
    rich user experience with graphing, hierarchical data displays, and a host of
    other options to make your application easier to use.


    But to exploit some of these technologies, you need to forget about Data Description
    Specifications (DDS). In some ways, CSS is analogous to DDS, in that with DDS,
    you are marking up data. With CSS, instead of marking up data, you are marking
    up HTML nodes, which can contain data. It is by no means a perfect analogue, but
    it might help provide you a frame of reference.


    This chapter introduces the basics of browser-based technologies. Some people
    spend their entire careers specializing in these technologies. Consider this a
    sort of punch list of the languages and techniques that someone working in the
    browser should know. We could easily dig deeper into each of these topics. If
    you want to learn more about these technologies, find a book dedicated to them.


    # HTML


    When you look at HTML, you might think that it simply provides places for you
    to write text, link to graphics, and such. Although you can do that, it is not
    the correct way of thinking. HTML is best used to provide structure and basic
    layout. Generally, you should not describe decorations such as font types, sizes,
    or colors in HTML. That is the job of CSS.


    There are several different versions of HTML, but we will focus solely on HTML5.
    It is one of the first versions that truly has some level of standards adoption
    behind it. Like all the other versions before it, HTML5 does have different implementation
    in different browsers. But you will find that if you standardize on HTML5, your
    layout will be much more predictable across various browsers and mobile devices.


    HTML is based on Standard Generalized Markup Language, or SGML—the same language
    that XML is derived from. So if you know XML, you will be familiar with the basic
    rules of HTML.


    HTML is hierarchical, but unlike XML, it uses nodes to follow a relatively strong
    naming structure. HTML5 has the same basis of SGML that HTML 3 and 4 do, but it
    is not explicitly following the standard anymore. That said, its history, base
    markup, and instruction processing have a strong relationship to the overarching
    SGML standard.


    The first instruction is the doctype. It identifies the kind of SGML-based document
    that the browser will work with. HTML 4 provided several different doctype definitions,
    each of which instructed the browser differently on how to work. With HTML5, you
    can simply declare the doctype as follows:


    ![Image](images/167-1.jpg)


    Starting your HTML document this way is of particular importance if you are working
    with newer versions of Internet Explorer. That browser uses this declaration to
    transition to its more “standards-compliant” mode. Most other browsers will default
    to HTML5, but Internet Explorer will generally require it for proper rendering.


    Following the doctype declaration is the <html> node. It is the root node, and
    every other node is its child. Sometimes it will be children of children, but
    every node will reside under the <html> node.


    The first node under the <html> node is usually the <head> node. It contains non-printable
    items, such as the title or metadata, that you want to present to the browser
    or search engines.


    On the same level as the <head> node is the <body> node. The <body> node will
    contain your presentation code. This is the code that the browser will actually
    render.


    You enclose nodes in open and closed angled brackets (<>), with the opening of
    the node matching the closing of the node designated with a forward slash (/).
    So an empty html node would look like this: <html></html>.


    The following example shows a valid HTML document that does nothing but provide
    a structured HTML5 document:


    ![Image](images/167-2.jpg)


    The doctype declaration is followed by the <html> node, which contains the <head>
    and the <body> nodes.


    To add a title to the document, you include another node under the <head> (the
    non-printable container) called <title>. The browser will generally display this
    title in the browser’s title bar and not in the window area.


    ![Image](images/168-1.jpg)


    So now your document has a title. Before we look at more head elements, it is
    beneficial to first create some basic content for the browser to render.


    Most HTML elements will fall into one of two different areas. They will be either
    a block element or an inline element, as [Figure 6.1](#010_Chapter06.html#fig6-1)
    shows.


    ![Image](images/168-2.jpg)


    *Figure 6.1: Inline elements within a block element*


    A block element is displayed in its own “space,” so to speak. An example of a
    block element is a simple paragraph, which has its own defined area on the screen.


    This is in contrast to an inline element. You can think of inline elements as
    those providing additional functionality within a paragraph, such as a link to
    an external source or a text decoration for a single word.


    Some examples of block elements are <div>, <p>, <table>, and <h1>. Examples of
    inline elements include <img>, <span>, and <a>.


    Before we move forward, it is worth mentioning that HTML is very forgiving. But
    just because it lets you do something does not mean you should. For example, although
    HTML will let you create a page of paragraph tags, you should not do that. It
    is best to think about how to create a solid structure for your page instead of
    hacking the page until it renders. Laying out the page intentionally and simply
    will often significantly reduce browser compatibility issues.


    This approach will serve you well in the long run because it lets you more easily
    separate your structure and your presentation. If your application has a menu
    bar, you should place the menu bar in its own container. Then, a designer can
    modify its layout in CSS without having to consult you about making changes to
    the HTML to fit the design. Good HTML design will often compartmentalize parts
    of the page so that they can be easily manipulated according to their function.


    The examples here will not use the paragraph (<p>) tag as the main block container,
    as you might suspect. A structured HTML document will almost always have the <div>
    tag as its base block element. You generally use the <div> tag to group, or provide
    a division for, disparate areas of content. So, for example, you will have one
    <div> tag that contains a left-hand column and another that contains the main
    content with your paragraphs.


    To illustrate this division concept, the next example will contain several elements.
    The example uses two <div> tags to separate the menu and the content. Because
    the menu will be an unordered list, you use the <ul> tag followed by several list
    elements denoted with the <li> tag. The content will contain a heading tag, or
    <h1>, (HTML has several <h\*> tags, which correspond to a descending size of heading)
    and a paragraph indicated by the <p> tag:


    ![Image](images/170-1.jpg)


    [Figure 6.2](#010_Chapter06.html#fig6-2) shows what this code looks like when
    rendered in the browser.


    ![Image](images/170-2.jpg)


    *Figure 6.2: HTML rendered in the browser*'
