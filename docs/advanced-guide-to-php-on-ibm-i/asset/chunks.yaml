    在亚历山德的书《模式语言》（A Pattern Language，牛津大学出版社，1977）中，他描述了人们如何通过一系列模式来构建自己的房屋和社区。这些模式通过门、墙、窗户、颜色等的实现来实现，使社区符合居住在里面的人们的愿望。尽管我没有读过这本书，但它有很多有趣的观察，似乎值得考虑。不过，它长达
    1,100 页，比我图书馆里那本同样没读过的 SQL 巨著还要大。


    但让我们把这些考虑因素从建筑世界中移开，从软件设计的角度来思考它们。有时，高级架构师难道不想简单地告诉初级开发者构建一个只能有一个实例的类，并让该开发者能够准确知道架构师在说什么，从而继续创建该类吗？如果有一种方法，可以在不详细描述的情况下交流这些类型的概念，那不是很好吗？


    嗯，这正是我们在这里要做的。我将向你展示 PHP 开发者使用的六种常见设计模式，并提供一些具体的示例，这样你也可以开始用设计模式的“秘密语言”进行交流了。


    # 单例模式 (Singleton)


    从数学意义上说，单例是一个有一个且只有一个值的数值集合。因此，它是一个定义为具有多个项但强制只有一个的集合。在编程中，单例设计模式限制了一个定义类只能有一个自身的实例。换句话说，如果应用程序的一个上下文有一个该对象的实例，而另一个上下文也有，那么它们使用的都是同一个实例。如果这让你有点困惑，不要担心。我们将通过一些代码来理解它：


    ```markdown

    ![Image](img/30.jpg)

    ```


    这个示例有一个名为 `Driver` 的类，代表将驾驶车辆的人。因为应用程序是代表人类（我们）操作的，所以对于特定的上下文，该驱动员始终是同一个。因此，无论你让汽车行驶还是让卡车行驶，驱动员都保持不变。


    单例模式的一个更现实的版本是代表会话（session）的对象。因为会话只能启动一次，所以它是单例模式的天然契合。`Toolkit` 连接是另一个单例的真实世界示例。


    在创建单例类定义时，你通常会创建一个受保护（`protected`）的构造函数。这样做确保了类本身负责实例化。类外部的代码无法实例化它：


    ```markdown

    ![Image](img/32-1.jpg)

    ```


    这段代码会产生错误：


    ```markdown

    ![Image](img/32-2.jpg)

    ```


    一些示例显示构造函数被定义为私有（`private`），我不确定如何看待这种做法。它不允许子类创建该类的新实例。此外，私有构造函数对子类不可用。我甚至倾向于将
    `getInstance()` 方法标记为最终（`final`），这样如果发生错误，会在加载类定义时发生，而不是在运行期间某个任意点。


    然而，单例模式并非没有反对者，他们对其提出了几项指责。


    第一个是单例很难测试。理论上，测试单例将不可避免地改变对象，因为单例通常用于维护全局状态，而不位于全局作用域中。因此，你可能无法开发出一个一致的测试。我称之为半真理，因为是的，如果你正在改变状态，你可能很难创建一个可重复的测试场景。


    第二个指责是在 PHP 中，单例 true 不是真正的单例。因为 PHP 使用无共享（shared-nothing）架构，HTTP 请求不知道其他 HTTP
    请求，因此可能存在多个实例。因此，PHP 不能拥有真正的单例。我认为这是纯主义者的胡说。


    最后一个指责是单例在你的类中创建了紧密耦合。我完全同意这一点。类中的依赖很难测试。考虑一个需要 `Toolkit` 连接的类。如果你为该类编写了单元测试，并且该类显式地从假设的
    `ToolkitAdapter` 类中获取该连接，你将无法模拟（mock）该适配器类。模拟对象是替换对象某些成员的做法，以提供数据的方式，从而跳过与外部资源的实际连接。单元测试用于测试逻辑单元，但它们几乎不应该需要外部资源。模拟让你能够通过假装对象已连接到外部资源来避免这一点，而实际上，它被注入了预期的数据。如果这个概念有点模糊，不要担心。


    那么，单例是邪恶的？如果你好奇我为什么这么问，请在 Google 中输入“are singletons”看看那些建议。我的答案是否定的，但如果你不小心，它们可能会带来麻烦。


    # 工厂模式 (Factory)


    工厂是创建对象实例的类。为什么你不直接使用 `new` 关键字来实例化它们呢？因为某些类型的类通常需要额外的逻辑：


    ```markdown

    ![Image](img/33.jpg)

    ```


    # 适配器模式 (Adapter)


    在写这本书之前，我已经构建了几个适配器类。但在深入研究后发现，尽管我的实现是正确的，但我的理解有点偏差。在发现此之前，我的工作定义是适配器为多个类提供了一个通用接口。这是的。但我错过了一个重要的细节。“适配器（adapter）”一词源于两个拉丁词：“ad”意味着向、*朝向*或在；以及“aptô”意味着*调整*或*准备*。因此，你正在将一个调整以适应另一个。适配器最常用的是用作为不同的数据库适配器提供接口的方法。PHP
    数据对象（PDO）是适配器模式的一个例子，但它是反过来的，因为它使用了驱动程序。你编写一个驱动程序来让唯一实现适配通用接口；驱动程序的责任是符合规范。适配器是一个为唯一实现转换功能的通用接口；适配器的任务是符合规范。


    以下示例定义了一个用于针对 `Toolkit` 或 `DB2` 连接进行身份验证的适配器：


    ```markdown

    ![Image](img/34.jpg)

    ```


    在这里，示例定义了一个名为 `AuthenticationAdapterInterface` 的适配器接口，它规定身份验证类必须实现 `authenticate`
    方法。这一操作强制开发者编写一个类，以使用多种不同的身份验证机制之一。这种要求是由接口定义的：


    ```markdown

    ![Image](img/36-1.jpg)

    ```


    使用适配器模式，只要你拥有需要的方法，就不必关心底层实现是什么。这在定义一个需要某种身份验证器的类时非常有用用：


    ```markdown

    ![Image](img/36-2.jpg)

    ```


    # 策略模式 (Strategy)


    适配器模式本身可能有很多用处，但它与策略模式结合使用时通常更有用。区别在于，适配器模式定义了通用接口，而策略模式实现了其中之一。定义与实现之间的区别是关键的，这使得它们成了自然的搭配：


    ```markdown

    ![Image](img/36-3.jpg)

    ```


