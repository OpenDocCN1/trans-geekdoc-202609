    # 关于作者


    Kevin Schroeder 的记忆 TTL 为 10 年，因此他使用 `PHP` 的时间比他记忆的还要长。这是他第三本关于 `PHP` 的书，之前的作品是
    *The IBM i Programmer’s Guide to PHP* (MC Press, 2009) 和 *You Want to Do WHAT
    with PHP?* (MC Press, 2010)。


    Kevin 是 `Zend Certification Advisory Board` 的成员，并且是 `Magento 认证开发者 Plus`。他曾在多个会议上发表过，包括
    `ZendCon`，在那里曾两次担任 MC。


    当他的大脑没有浸在代码中时（如果代码是诗，那么它沃根诗），Kevin 正在创作音乐，他从发型乐队流行起就开始弹吉他了（并在他们受欢迎的终结中幸存下来）。他录了两张专辑*Coronal
    Loop Safari* 和 *Loudness Wars*。Kevin 的智慧通过其 Twitter 上 `@kpschrade` 的忠实追随者以及他的博客
    `[www.eschrade.com]` 分享，在博客上他以第一人称叙述。


