    # About the Author


    Kevin Schroeder has a memory TTL of 10 years, and so he has been working with
    `PHP` for longer than he can remember. This is his third book on `PHP`, preceded
    by *The IBM i Programmer’s Guide to PHP* (MC Press, 2009) and *You Want to Do
    WHAT with PHP?* (MC Press, 2010).


    Kevin is a member of the `Zend Certification Advisory Board` and is a `Magento
    Certified Developer Plus`. He has spoken at numerous conferences, including `ZendCon`,
    where he was twice the MC.


    When his head isn’t in code (if code is poetry, then it is Vogon poetry), Kevin
    is writing music, having been a guitarist since hair bands were cool (and having
    survived their welcomed demise). He has recorded two albums, *Coronal Loop Safari*
    and *Loudness Wars*. Kevin’s wisdom is dispensed to his loyal followers on Twitter
    `@kpschrade` and on his blog at `[www.eschrade.com]`, where he speaks in the first
    person.


