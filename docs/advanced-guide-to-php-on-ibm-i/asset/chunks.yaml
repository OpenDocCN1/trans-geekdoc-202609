- fmt: '

    So we have somewhat examined the Single Responsibility Principle, but not fully.
    To do that, let’s add HTTPS support. Remember the `RequestManager` class? If you
    were not to follow the SRP, you might be tempted to extend or to override that
    class. However, that class’s responsibility is to serve as a conduit for passing
    request and response objects. If you were to implement HTTPS support there, that
    class would then have multiple responsibilities.


    You can define an HTTPS interface by implementing `RequestInterface`, but doing
    so violates the DRY Principle (separate from SOLID). DRY means *Don’t Repeat Yourself.*


    In this example, the best option is readily apparent. Simply extend `HttpRequest`:


    ![Image](images/63.jpg)


    `RequestInterface` has one responsibility: define the requirements for input handling.
    The `HttpRequest` class is responsible only for providing an interface to HTTP.
    Likewise, the `HttpsRequest` class’s sole responsibility is to provide an interface
    to HTTPS. `CliRequest` has one responsibility as well: provide an interface to
    the command line.


    # Open-Closed


    [*http://bit.ly/php_ibmi_oc](http://www.bit.ly/php_ibmi_oc)*


    In the previous section, you inadvertently worked with the Open-Closed Principle
    as well. The Open-Closed Principle states that a software entity is open to extension
    but closed to modification. This means that once a class is defined, signed, sealed,
    and accepted, it is considered immutable. To make a change to that class, you
    should extend the class. The Open-Closed Principle also asserts that the class
    source code should not be changed after it is written. This is probably a little
    impractical to hold on to with complete certainty. Bug fixes, for example, are
    changes that are acceptable to make to the class’s source code.


    However, not adding to or modifying class functionality is a good principle to
    follow. This notion promotes *stability* within application components. If the
    functionality does not change, then the need for regression testing is greatly
    reduced, or at least the potential for failure is. As noted in the previous paragraph,
    you created an example of this with the `HttpsRequest` class. Rather than creating
    new functionality in the `HttpRequest` class, you extended it and, incidentally,
    used not only the Open-Closed Principle but the next principle as well: the Liskov
    Substitution Principle.


    The example in the previous section implemented the Open-Closed Principle, because
    as your application grew and needed to include HTTPS functionality, you did not
    modify the original `HttpRequest` class. You extended it and added functionality
    to it, but you did not change it.


    # Liskov Substitution


    [*http://bit.ly/php_ibmi_ls](http://www.bit.ly/php_ibmi_ls)*


    The Liskov Substitution Principle is named after Barbara Liskov, the person who
    coined the phrase. She stated that “functions that use pointers or references
    to base classes must be able to use objects of derived classes without knowing
    it.” Although you do not use pointers in PHP, you do use classes. So when you
    state that you need a class of a certain type and the code passes an object of
    a derived type, it should make no difference to your application.


    To demonstrate, let’s take the earlier request code and implement some code logic:


    ![Image](images/64.jpg)


    The method `doSomething()` retrieves the request object from the request manager
    and asks for a parameter called `someOption`. Implementing three different bootstraps
    for each of the different interfaces looks something like this:


    ![Image](images/65-1.jpg)


    When the code in `SomeLogic::doSomething()` is executed, it does not care whether
    the CLI, HTTPS, or HTTP request object is passed. That is what the Liskov Substitution
    Principle means. The logic being executed does not care which class is being passed.
    It only cares that it does what is expected, and that expectation is defined very
    low in the abstraction layer. So adding another interface for, say, data queues,
    will not make a hill of beans’ difference to the application.


    # Interface Segregation


    [*http://bit.ly/php_ibmi_is](http://www.bit.ly/php_ibmi_is)*


    The easiest way to become confused about Interface Segregation is to think that
    it is referring to interfaces. By that I mean:


    ![Image](images/65-2.jpg)


    Although the implementation will usually involve interfaces, I do not believe
    that an Interface is what is meant by the “interface.” The Interface Segregation
    Principle states, “Clients should not be forced to depend on interfaces that they
    do not use.” Despite that Martin uses the word “interfaces,” one reason I do not
    think he means Interfaces specifically is that none of his code includes an Interface.
    He wrote his example code in C++, and C++ does not have interfaces in the same
    way that Java and PHP do. Granted, I am not a C++ programmer, and I do not know
    the mind of Robert Martin. But though C++ has a mechanism for doing Interface-like
    things, they are not technically Interfaces.


    This distinction frees us up a little when considering the Interface Segregation
    Principle. If my reading of Martin’s text is correct, the word “interface” is
    referring more to the API than to a programming concept. As noted earlier, this
    will likely involve heavy use of Interfaces, but the implementation of this principle
    is not specific to a strongly defined language function. As we go along, you will
    see why this is.


    When thinking about Interface Segregation, you need to look at how objects are
    passed back and forth into other objects. Global variables are generally accepted
    to be bad for several reasons. One is that they define global requirements that
    must be satisfied for the application to run. And if you define such a requirement
    in one place, you must define it in all places.


    That is an approximation of the problem that Interface Segregation is intended
    to limit. Say that an application has some massive class that performs a slew
    of operations. Passing that behemoth around with all its definitions could introduce
    dependencies everywhere that you need to.


    For example, imagine you have an object that holds several objects, such as a
    session manager and a database, among others. Although you will end up passing
    around the full object, you should make the method aware only of the functionality
    it needs.


    The best way to make dependent code aware of functionality is through the use
    of interfaces. That is because an interface can have multiple inheritance in PHP
    but classes cannot. So you can build interfaces that have multiple dependencies
    and use these multiple-extended interfaces to define the required information
    in the method. You will not do this in the example, but it is an available option.


    In the example, you will define two interfaces: `ContainsDatabase` and `ContainsSessionManager`.
    Forgive the lack of creativity in the class naming. Both define specific requirements
    that an implementing class will have:


    ![Image](images/67-1.jpg)


    When you construct your `BigClass`, you make sure that you define all the methods
    that the class needs to implement the required interfaces:


    ![Image](images/67-2.jpg)


    Although you are using Interface Segregation so far, by having the interfaces
    define individual bits of functionality, you will see the benefit when we look
    at the implementation of the dependent class:


    ![Image](images/68-1.jpg)


    Here, the `save()` method indicates that you do not care about anything else the
    object does, but only that the object provided can save to the database. In the
    mainline code, you could pass in an instance of `BigClass` or one of a thousand
    other classes, but it would not matter to the small class. Therefore, changes
    to `BigClass` should not affect the small class because the latter is interested
    in only one thing.

