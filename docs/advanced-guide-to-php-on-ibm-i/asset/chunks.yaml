- fmt: '

    First, this code loads the `jQuery` library. Then, it calls a weird function named
    `$`, which is a JavaScript reference to the variable `jQuery`. It is a shortcut.
    The `$` function is really a selector mechanism. Pass in a variable, string, or
    object, and `jQuery` will return the internal object that it uses to reference
    that item. In short, you have access to the requested element but with a whole
    lot of `jQuery` hooks added on.


    In the first block of code, you request the document object and call the `ready()`
    method on it. Then, `jQuery` overwrites any `window.onload` function calls and
    takes them inside. So to execute code after the window has loaded the page, you
    now insert a function, named or anonymous, by calling the `ready()` method. Although
    this process might not seem to buy you much, it does more than you might think.


    When working with `window.onload`, you can attach only one function call to that
    event. Using `$(document).ready()` lets you attach as many functions to the `onload`
    event as you want because `jQuery` is now handling them.


    So you pass in the function to the `ready()` call, and when the document is ready,
    the `initPage()` function is called. The content of the `initPage()` function
    shows why `jQuery` is used everywhere. You call the selector function and enter
    a CSS query to retrieve the `jQuery` object that references the requested item.
    If you request an item that does not exist, an object is still returned. But that
    object simply will not do anything. This protects against having JavaScript errors,
    which can break your application. In other words, null checks do not work. Although
    that might raise red flags for a developer, it helps the browser continue executing
    a web page even after an error has occurred.


    In fact, this presents an interesting issue. If the `jQuery` selector can return
    zero, one, or multiple objects, how do you know what is being returned?


    The objects returned will be dependent on the content of the page. If you are
    requesting an item with a document ID (like `#main-content` in the example), you
    should receive only one object. If you are selecting objects via a class, then
    you might receive more than one.


    Either way, the best way to verify whether you have received an object is to check
    the `length` property:


    ![Image](images/194-1.jpg)


    This code is somewhat superfluous because `jQuery` will not fail if the query
    returns nothing, but it does show how you can verify whether the CSS query has
    returned any objects.


    What happens, though, when you want to iterate over a series of one or more objects?
    Rather than using a `foreach` loop, you simply use anonymous functions again (or
    a named function; either way works).


    ![Image](images/194-2.jpg)


    The code here will iterate over all the paragraphs in the page that are of the
    class `paragraph-text` and will change their contents to upper case. But note
    something interesting in the CSS selector. You use the period to denote that you
    are selecting based on class, not ID, just as you did to define a CSS class. This
    shows that you can use defined or undefined CSS classes as a means of grouping
    like objects for easy querying. You do not even need to define the CSS classes
    for it to work.


    So far, you have seen how to programmatically manipulate the DOM. Now we will
    look at how to use `jQuery` to interact with the user, which is easy. Although
    we will use a slightly complex example, it will demonstrate some really powerful
    features. Take some time to think through this example, as it will be worth understanding
    it:


    ![Image](images/195.jpg)


    To help explain what is happening, this example lists the functions in order of
    execution. First, `initPage()`, as expected, is run when the page is loaded. This
    function uses a CSS selector to find all the elements that have a class `paragraph-text`
    assigned to them. You then bind to the `mouseover` event by calling the `mouseover`
    function on the `jQuery` object provided in the anonymous function’s value parameter.
    Next, you pass in the function, `setBackgroundToRed()` in this case, to the `mouseover()`
    method. When the mouse moves over the paragraph, `setBackgroundToRed()` will be
    called.


    The `setBackgroundToRed()` function introduces an interesting `jQuery` feature:
    animation queues. Animation queues are intended for managing sequences of animations.
    Generally, you will not want to use an animation queue to handle delayed functions,
    but here it makes sense. For most delayed execution tasks, you will want to use
    the `window.setTimeout()` function instead. But here it is reasonable to use the
    animation queue because you will need to modify individual objects eventually.
    The queue will let you work within the scope of an individual object, whereas
    `setTimeout()` works only within the global context.


    Calling `setBackgroundToRed()` will set the background color to red. Then, the
    `delay` method is called followed by the call to `queue()`, where you specify
    the function you want to call.


    But did you notice anything? When you bound to the `mouseover` events, you used
    `$(value)`. Here, you are using `$(this)`. The difference is that when you bound
    the events, you were iterating over the values in the array.


    In this context, however, you are executing from within the function that is bound
    to the object. The object “owns” the function being executed. So you can access
    the local properties and methods by using the special variable `this`. This is
    important because it lets you execute functionality that is tied directly to that
    particular object.


    Then 1000 milliseconds later, `setBackgroundToTransparent()` is called. Before
    setting the inline CSS style to red, you call `clearQueue()` on `$(this)`. Doing
    own prevents `jQuery` from re-adding the function to the queue, which is what
    you are doing in `setBackgroundToRed()`. You clear the queue so that when you
    call it on subsequent mouseover events, it will execute the call added to the
    animation queue.


    # Ajax


    DOM manipulation is fun, but combining it with server-side interaction makes it
    more useful. In this section, we will briefly deal with how to do this using the
    familiar term “Ajax.” Ajax used to be AJAX, which stood for *Asynchronous JavaScript
    and XML.* However, a lot of people started using AJAX with protocols other than
    XML. Because of that, the name was changed to Ajax, which is not an acronym but
    generally means *communication from the browser to the server over HTTP.*


    The most popular format currently used is JavaScript Object Notation, or JSON.
    Putting this format into a `<script>` section of your page will interpret that
    data into a JavaScript object or array, depending on which syntax you write.


    To demonstrate how to do this with `jQuery`, we will start with a simple PHP script
    that lets you obtain a list of time zones supported by PHP and then get the local
    time for a selected time zone:


    ![Image](images/198-1.jpg)


    We will not dive into the details of what the example is doing (you *should* know
    this). But basically, if the `GET` parameter is empty or `$_GET[''function'']`
    is set to `gettimezones`, the code will provide a list of supported time zones.
    If the function is `gettime` and `$_GET[''zone'']` is set, the example will return
    an associative array of date, time zone type, and time zone name:


    ![Image](images/198-2.jpg)


    Here, you first attach a function to the `ready()` method. This function calls
    the `jQuery.getJSON()` method, which in turn calls the specified URL and parses
    the results as JSON. The second argument of the method provides a callback that
    `jQuery` will call upon successfully returning from calling the URL. You know
    that the return value will be an array (because you coded it that way in the PHP
    script), so you iterate over the values by using the `each()` method. For each
    of the values, you append a new `<option>` tag to the `<select>` with the ID `choose-zone`.

    '
