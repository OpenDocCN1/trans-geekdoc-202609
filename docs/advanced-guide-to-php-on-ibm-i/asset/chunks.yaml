    \ `RPG` 的情况下无法对其测试。因此，你任何想要测试的代码都可能修改你所连接的数据库，而这是你想要避免的。这是因为在单元测试中，你将允许对系统所做的任何更改。这并不是一项有趣的任务。\n\
    \n解决这一问题的办法在第 7 章中，该章节介绍了单元测试。你需要为 `ToolkitService` 类创建一个 mock 对象（模拟对象），完全跳过对\
    \ `Toolkit` 的调用。在这种语境下使用 mock 对象有两个用处。首先，正如提到的，如果实现得当，mock 对象不会修改你数据库中的数据。其次，这种方法使你的测试具有可重复性。在构建易于维护的软件时，这两个优势是硬币的两面。\n\
    \n为了了解你将如何操作，我们将单元测试分为三个阶段，所有这些阶段都将在测试中定义。为了清晰起见，我们将分别介绍每个阶段：\n\n1. 定义\n2. Mock\
    \ \n3. 执行\n\n### Definition\n在这一部分代码中，你正在定义期望 `ToolkitService` mock 实例在被调用时返回的内容。在这里，它仅仅是名称\
    \ `IBM`。你从功能规格说明书中获取此值，或者像在本例中一样，从 `RPG` 代码中确定输入和输出。\n\n以下是 `COMMONPGM` 代码将生成的预期\
    \ Toolkit 返回值：\n\n![Image](img/287.jpg)\n\n### Mocking\n在定义了期望 `ToolkitService`\
    \ 对象的内容后，你必须对 `ToolkitService` 进行 mock，以便它在被调用时返回这些值。由于我们已经在第 7 章中涵盖过这一点，我们不再介绍具体的细节。相反，你只需提供代码作为参考。\n\
    \n有一个例外。`getMock()` 的最后一个参数很重要。它指定是否会调用构造函数。由于 `ToolkitService` 类使用了单例模式且构造函数被定义为保护（protected），调用构造函数会导致致命错误。因此，将该参数设置为\
    \ `false` 以绕过其作为单例的使用。将其作为单例并不重要，因为你将 mock 唯一真正的方法：\n\n![Image](img/288-1.jpg)\n\
    \n### Execution\n现在，你可以执行测试了。虽然你使用的是依赖注入（Dependency Injection）而不是依赖注入容器，但你可以注入被\
    \ mock 的 `ToolkitService` 对象。然后，断言该方法调用的返回将是值 `IBM`：\n\n![Image](img/288-2.jpg)\n\
    \n你运行测试并通过了，mock 的 `ToolkitService` 对象返回了你预期的内容，而你对 `COMMONPGM` 的具体实现正确地处理了输出。\n\
    \n然而，除了这段测试成功的代码外，测试错误情况同样（甚至更为）重要。你提供一个超出预期范围的输入，mock 预期的结果，并验证错误是否被妥善处理。\n\n\
    当 `RPG` 程序遇到错误时，它会返回值 `wrong code`。你不希望在整个应用程序代码中检查这个值，因此让 `COMMONPGM` PHP 类负责捕获错误似乎是合理的。在这种情况下，你想要验证输出参数的值。因此，在修改你的\
    \ `COMMONPGM` 类之前，先在测试中定义错误条件：\n\n![Image](img/289.jpg)\n\n此测试与上一个测试有三个区别。第一，你设置预期异常为类\
    \ `GenericException`。第二，你将 `PgmCall` 方法的返回值定义为无效输入的预期值 `wrong code`。第三，你将参数输入值从\
    \ `1` 更改为 `null`。你可以保留该值为值为 `1`，因为你只检查返回值，但将参数与你正在测试的条件匹配仍然是明智之举。\n\n如果你运行此测试，`PHPUnit`\
    \ 将输出错误信息“Failed asserting that exception of type ‘GenericException’ is thrown.”\
    \ 现在既然你已经写了测试，进入 `COMMONPGM` PHP 类并进行更改以发生以下情况：\n\n![Image](img/291.jpg)\n\n当你运行测试时，两个断言都得到了满足且测试通过了，因为你同时测试了有效和无效数据。\n\
    \n# Conclusion\n在本章开始，我们对 `Toolkit` 提供的某些功能进行了基础介绍，但绝对不是全部。有大量的现有文档可以帮助你完成这一点。相反，我们关注的是如何根据各种编程方法使用\
    \ `Toolkit` 来构建应用程序。我们应用这些原则的方式使得你的 `Toolkit` 集成比以标准内联方式构建要易维护得多。\n\n# 10\n\n\
    # Performance Considerations\n构建高性能 Web 应用程序是一项既容易又困难的任务。容易在于，大多数简单的应用程序可以具有极佳的性能，但它们不会有很多功能。困难在于，当应用程序需要大量功能、自定义、集成以及许多其他功能且必须同时保持快速时。鉴于此，我们将查看几种不同的选项，以帮助构建一个既快速又能保持高功能的应用程序。\n\
    \n当 `PHP` 引入 IBM i 时，出现了一些性能问题，最具体的是与 `DB2` 连接以及处理 `IFS` 时。但是，随着时间的推移，IBM 似乎已经解决了许多这些问题。`IFS`\
    \ 仍然比其他系统慢，但已经远不上以前的那个慢程度了。\n\n为了说明这一点，让我们看看两个曾经显著的问题。第一个是 `IFS`。以下是我在本地 IBM i\
    \ 系统和本地 Linux 机器上运行的一些测试代码。两台机器都不特别强大。该代码对 `IFS` 进行百万次读写，并对 `Ext4` 文件系统进行百万次读写：\n\
    \n![Image](img/294.jpg)\n\n尽管 `IFS` 如果更快会更好，但与以前相比，结果是可以接受的。Y 轴是运行测试所需的秒数（参见图\
    \ 10.1）。\n\n![Image](img/295.jpg)\n\n*图 10.1：IBM i 和 Linux 上运行测试的秒数*\n\n这些结果并不糟糕。第二个问题涉及\
    \ `DB2` 连接。在早期的测试中（2010 年之前），初始化 `DB2` 连接耗时 400–500 毫秒（ms）并不意外。但这种连接时间已经改进。在我的某些测试中，我将非持久连接时间记录为约为\
    \ 20 ms。`MySQL` 更好，约为 2 ms，但与我们以前看到的 400 ms 相比，这要好得多。而且当我使用持久连接时，性能更快了，达到了 34\
    \ ms。\n\n所以，尽管我不会说过去的性能问题消失了，但它们似乎在很大程度上被消除了。\n"
- fmt: '

    This is a good thing. It means that `PHP` on IBM i is approaching parity with
    the Linux systems. Plenty of things are IBM i specific, such as the `Toolkit`,
    but the days of having to `do X on IBM i as a workaround to performance problems`
    seems to be much minimized compared with the past. Because of that, let’s examine
    some general tactics you can take to make your application respond more quickly.


    ## Cache Stuff


    The single biggest thing that will probably increase your application’s performance
    is caching. Caching, in my view, often indicates that the programmer failed to
    devise an efficient means to deal with an issue. That not true, but it is the
    approach I take. Too many times, I have seen performance problems in which the
    solution was “we will just cache it.” To be sure, there are times when this approach
    is valid. However, it is not the correct solution if you do it as an afterthought
    to solve an unexpected performance problem. First, work to make the troubling
    code efficient. Then, implement caching. Or prepare ahead for it. Either way,
    do not say, “We’ll just cache it.”


    Sometimes, you might anticipate that an action simply will not have a faster execution
    path, and you will need to cache the results. That is an example of approaching
    the issue thoughtfully. But too often, developers see a problem after they have
    implemented some functionality and, out of laziness, will just resort to caching
    to save their hide.


    On the flip side is an antithetically, but equally, valid point. You should do
    your best to ensure that calculations will not be executed repeatedly. Calculating
    results twice when data has not changed can indicate an oversight on the part
    of programmers to design their systems well. And more than using caching as a
    fallback for laziness, developers who design an application that requires discrete
    parts to be executed over and over lack forethought.


    Repetition is your enemy. But so is laziness. Design your application to be cached.


    Although caching is easy, cache invalidation is difficult. There is a saying:
    “There are two hard things in computer science: cache invalidation, naming things,
    and off-by-one errors.” The original saying omitted the last one, but this variation
    is funnier. I will always opt for the funnier version. Caching is easy. Cache
    invalidation is hard. It is hard because no cache entry exists in isolation. Invalidating
    a cache entry inevitably will affect something else. Nowhere is this more apparent
    than when you have cached entries that were calculated based on related data.
    If one cache item is invalidated or its time to live (`TTL`) expires, all other
    cached items should be recalculated simultaneously. Otherwise, your application
    might be working from one cached entry that is old and one that is new. In many
    cases, this situation might not be the end of the world, but it takes just a little
    thinking to devise a scenario where it could be disastrous.


    Caching is almost always done as [Figure 10.2](#014_Chapter10.html#fig10-2) shows.


    ![Image](images/297-1.jpg)


    *Figure 10.2: Process for caching data*


    Following is what this looks like in code:


    ![Image](images/297-2.jpg)


    The data can be processed data, or it can be output. The data can also be internal
    to the execution flow of the application, or it can be the entire page (full page
    caching). We will not delve into this topic because about a million web pages
    already cover caching in `PHP` (7.1 million according to Google).


    And those pages are all wrong.


    ## Preprocessing


    Well, most of them are. And I should not say that the typical caching methodology
    is wrong, either. But it is overused in lieu of some other methodologies.


    ## In Normal Calculations


    We will talk about caching in a moment, but first let’s look at how you can speed
    up certain operations by calculating them either during a save operation or shortly
    thereafter. I could provide a long dissertation on theory and options, but sometimes
    it is best to start with a story. So I will talk about Twitter.


    Some of this story is based on a post from the `High Scalability` blog (see `[http://highscalability.com/blog/2013/7/8/the-architecture-twitter-uses-to-deal-with-150m-active-users.html](http://www.highscalability.com/blog/2013/7/8/the-architecture-twitter-uses-to-deal-with-150m-active-users.html)`).
    When Twitter debuted, it had a single `MySQL` server, which it eventually moved
    to more `MySQL` servers and grew and grew. People read their timelines exactly
    the way you would expect them to in a relational database system. In short, `JOIN`
    a relationship table with a tweet table that contained a `WHERE` clause on the
    user table, followed by a `LIMIT` and `ORDER` on the tweet table. That is fine
    for basic operations, but when you become popular or your data starts getting
    complicated, that simple query can begin consuming a lot of resources.


    So Twitter moved the `SELECT` statement to only one table (this is a loose description).
    That table has the tweet and the recipient. When consumers request their timelines,
    rather than doing a large `JOIN` on a bunch of tables, Twitter does one query
    on one table (or thereabouts), with the only `WHERE` being the user ID, and does
    the `LIMIT` and `ORDER` only on that one table.


    So how do the tweets get into that table? When a person tweets, his or her followers
    are retrieved from the database, and the tweet is inserted into each of the followers’
    individual tables. By doing this calculation once, on write, Twitter saves itself
    gobs of computing time.


    Magento also takes a similar approach, which it calls `indexes,`, but it is really
    not. It is actually a precalculation table. Pricing rules in e-commerce can be
    tremendously complex. So Magento builds tables whose sole purpose is to allow
    simple `WHERE` clauses to be created, rather than running an immensely complex
    query at runtime.


    To see what I mean, adjust your glasses and prepare yourself. This is the query
    used to build one of the precalculation pricing tables in Magento:


    ![Image](images/299.jpg)


    ![Image](images/300.jpg)


    The following query precalculates the values into a temporary table, which is
    followed by more processing and then clearing the actual table and inserting the
    values there:


    ![Image](images/301-1.jpg)


    And you think you have problems.


    The reason for all these calculations is so that later when someone is viewing
    a catalog page, the prices can be retrieved using `JOINs` on the `SELECT` statement,
    rather than having to calculate that whole initial monster query:


    ![Image](images/301-2.jpg)


    Although this query is still relatively large, it is much less complex than what
    is actually required, because we preprocessed the results and queried the computed
    values rather than executing all that logic at once. Also, this query uses indexes
    much better and lets the query planner more easily determine a quick way to execute
    the query. As a result, because the query is compact and built to use these compiled
    calculation tables, the page response times are much improved.


    You might be wondering why you would not use some of the summary indexing functionality
    available in `DB2`. Remember, here you are summarizing application logic, not
    data. That is an important difference. You are not just looking for counts of
    something, but you are precalculating the outcomes of various what-if scenarios
    ahead of time. Those scenarios might not happen, but if your application logic
    is complex enough, you might want to minimize the runtime calculation of those
    values.

    '
