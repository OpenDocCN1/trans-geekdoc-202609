    This example of a simple object does not allow much flexibility. But what if you
    had a class that was intended to represent a collection of data underneath? You
    could not simply iterate over the object because you want *specific* data inside
    the object, not just the public properties. In this case, you could have a `getData()`
    method that would return an array of elements. But what if the array of elements
    required some kind of post processing, or the element list was too large to keep
    in memory all at once? These are legitimate concerns in modern programming, and
    the predefined interfaces and Standard PHP Library (SPL) can assist with these
    issues.


