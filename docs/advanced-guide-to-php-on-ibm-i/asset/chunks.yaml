  raw: "However, before you start calling programs, you might need to do something\
    \ a little extra, particularly if you are using the same connection over multiple\
    \ users. Although it is not necessary, it is still a good idea to set the InternalKey\
    \ parameter when instantiating a connection. Doing so enables your application\
    \ to maintain a unique job identifier in between requests so it can maintain cursors\
    \ and open file handles, to name a few. You can specify this unique ID, but here\
    \ are three other ways to do it:\n\n*   Set the session and ignore it; the Toolkit\
    \ adapter will automatically assign it to the session ID.\n\n*   Set the session\
    \ according to a username value:\n\n    ![Image](images/275-1.jpg)\n\n*   Set\
    \ the session according to a unique value in the session:\n\n    ![Image](images/275-2.jpg)\n\
    \nAlthough setting the InternalKey value is definitely the preferred way to go,\
    \ if you do not specify it, you must give the Toolkit some alternate instructions:\n\
    \n![Image](images/275-3.jpg)\n\nYour connection must either use the InternalKey\
    \ or set the stateless service parameter; otherwise, your program calls will not\
    \ work. The stateless parameter informs the Toolkit that the connection will not\
    \ be maintaining information in between service calls, making it somewhat like\
    \ HTTP. Generally, you should use the InternalKey, but if it is omitted, you must\
    \ tell the Toolkit that the call will be stateless.\n\nAfter the connection has\
    \ been created, you have many functions available to make calls into the system\
    \ from the ToolkitService class. They are PgmCall(), ExecuteProgram(), CLCommand(),\
    \ CLInteractive(), qshellCommand(), ClCommandWithOutput(), and ClCommandWithCpf().\
    \ To execute a CL command, you would do it as such:\n\n![Image](images/276-1.jpg)\n\
    \nIf you want to call a program, you will need to provide some kind of input.\
    \ To do so, ask the TooklitService class to create a parameter for you. It does\
    \ it in a way similar to the Factory design pattern. This is not quite accurate\
    \ because the ToolkitService has multiple functions, so it does not follow the\
    \ Single Responsibility Principle, whereas a true Factory’s responsibility is\
    \ only to create objects.\n\nA subset of methods is defined to help with creating\
    \ parameter objects in ToolkitService. These methods start with the keyword addParameter\
    \ followed by the type. So if you require a character parameter, you call AddParameterChar(),\
    \ or if you need an int32, you call AddParameterInt32(). At a minimum, these methods\
    \ will require an I/O type and a comment. The I/O type determines the directionality\
    \ of the parameter. It can be in, out, or both. The comment will usually match\
    \ the variable name being provided and is more for your benefit than for the system’s.\
    \ In fact, the comment is used only if you are in debug mode.\n\nTo see how to\
    \ use the parameter methods, look at the samples included in your instance of\
    \ Zend Server. We will examine a short example here for the sake of completeness.\
    \ For your reference, the following is the RPG code used to build the COMMONPGM\
    \ program, stolen from the Zend Server RPG samples:\n\n![Image](images/276-2.jpg)\n\
    \nCreating a parameter requires calling the method AddParameterChar():\n\n![Image](images/277-1.jpg)\n\
    \nHere, the first parameter sets the direction. The second sets the size of the\
    \ parameter, and the third is the comment. The fourth parameter is the variable\
    \ name. The fifth is the parameter value.\n\nAll the parameters are included when\
    \ the program itself is called via the PgmCall() method:\n\n![Image](images/277-2.jpg)\n\
    \nThe result will be stored in the $result variable with the keys io\\_param and\
    \ retvals. Usually, the results are stored in an out-based or a both-based parameter,\
    \ which you can retrieve from the result of the call to PgmCall(). In the previous\
    \ example, the RPG program you called did not have a return value but used an\
    \ outbound parameter instead. To retrieve the result of the program call, you\
    \ would then read the $result variable:\n\n![Image](images/277-3.jpg)\n\n# Taking\
    \ It to the Next Level\n\nThe ability to call your RPG programs from PHP is definitely\
    \ an advantage when working to bring your application to a web-based interface.\
    \ But the default method has several problems. The first is that it is difficult\
    \ to test. The only way you can test inline functionality like that is by refreshing\
    \ your browser. But by doing so, you are then possibly modifying data that can\
    \ change the results of the next test. In the last section of this chapter, we\
    \ will look at how you can handle testing better.\n\nThe second issue, and the\
    \ one we will examine here, is that using the default method of calling your RPG\
    \ programs inline will result in a lot of boilerplate code. In addition, managing\
    \ a program change can be a daunting task because you must find and change every\
    \ occurrence of the call that was made. The solution is to encapsulate individual\
    \ calls into individual classes.\n\nLet’s see what that looks like when you use\
    \ the previous example as a template. First, start with a class that you will\
    \ use as the base class for your program calls and that will house the basic code\
    \ for injecting the Toolkit into itself:\n\n![Image](images/278.jpg)\n\nSo what\
    \ is the next task? You can take this code in three different directions.\n\n\
    The first direction, which is the wrong one, is to add some way to call methods\
    \ from this class in a generic method, such as $program->call(‘PRGNAME’, $params)\
    \ or something similar. But taking that route means you have to tightly couple\
    \ the different areas.\n\nThe second direction, which is better but not quite\
    \ correct, is to simply extend this GenericProgram class. That route is better\
    \ except for the little problem of stateless and stateful connections. Is this\
    \ sufficient, or do you need another layer of abstraction?\n\nThe correct answer\
    \ is the third direction, which allows for the fact that you have multiple types\
    \ of calls that must be made: stateful and stateless. So you create another layer\
    \ that will represent both types of state. This implements the Single Responsibility\
    \ Principle:\n\n![Image](images/279-1.jpg)\n\nAt this point, you have sufficient\
    \ levels of abstraction to start implementing your class structure. By declaring\
    \ your class as descending from either GenericStatelessProgram or GenericStatefulProgram\
    \ (not shown), you can enforce certain levels of behavior while minimizing the\
    \ amount of code you must write to implement the internal functionality.\n\nNow\
    \ you need to decide how to deal with results. With a structured result, it is\
    \ preferable to define a response class that matches what you will be expecting.\
    \ So if you were to have a “name” and “description” returned from RPG, you would\
    \ declare a class that accurately represents what that name and description are\
    \ referring to. However, in the example, you are simply returning the description\
    \ that results from passing this one code into RPG (this is based on the code\
    \ in the Zend Server samples directory). Because you are always, and only will\
    \ be, returning a string, here you return a string when you call the method:\n\
    \n![Image](images/279-2.jpg)\n\nThis class encapsulates the all the functionality\
    \ that you retrieved directly from your first call to PgmCall(). Running this\
    \ code is simple:\n\n![Image](images/280-1.jpg)\n\nWhen you run the code, you\
    \ get the output of the RPG program:\n\n![Image](images/280-2.jpg)\n\nWith the\
    \ class you defined, you have now implemented a connection to an RPG program by\
    \ using a class structure that follows the SOLID principles, is simple to maintain,\
    \ uses a minimal amount of code duplication, and can be easily reused.\n\n# Using\
    \ Dependency Injection with the Toolkit"
