    尽管你将其命名为适配器（adapter），但它是策略模式（Strategy）的实现。在之前的适配器模式中，你逐个调用每个适配器。而在策略模式中，你让 `AuthenticationAdapter`
    为你完成工作：


    ![Image](img/37.jpg)


    这是一个微妙、有些令人困惑但重要的区别。


    # 懒性初始化与懒加载


    对于许多编程语言（例如 Java®）来说，预初始化对象和关系是有意义的。Java 通常作为长生命周期进程运行，开发者可以利用这些前期初始化来降低运行期间初始化的成本。


    然而，由于 PHP 采用无共享架构（shared-nothing architecture）并且在请求之间不保留留状态，这种类型的预初始化可能会浪费 CPU
    周期。因此，懒性初始化（Lazy Initialization）是一种非常值得你花时间尽可能使用的设计模式。


    在我看来，在 PHP 中有两种使用懒性初始化的方法。虽然大多数语言都会编译成包含或引用所有必需组件的二进制文件，但 PHP 并非这样做。它为每个请求都从一个干净的状态开始。正因如此，你必须为每个请求重新包含依赖项。通常情况下如下：


    ![Image](img/38-1.jpg)


    结果是无论是否需要，`myclass.php` 和 `anotherclass.php` 都会被加载。解决方法是使用第一章中讨论的自动加载器（autoloader）。在我的测试中，即使使用了
    opcode 缓存，使用自动加载器代替静态 `require()` 调用也使性能提高了 20%以上。


    懒性初始化的通用方法是延迟对象的创建直到需要它，如下例所示：


    ![Image](img/38-2.jpg)


    从 `Car` 对象获取 `Engine` 对象，必须在类内部或外部调用 `getEngine()` 方法。通过这样做，应用程序只有在调用 `getEngine()`
    时才会实例化 `Engine` 对象，即使 `Car` 类已经有一个实例。如果 `Engine` 对象的初始化成本很高，那么使用懒性初始化被证明是有益的。


    接下来是懒加载（Lazy Loading）。这种设计模式类似于懒性初始化，但你是在数据的上下文中而不是类的实例化过程中来实现它的。虽然你可以通过延迟对象的初始化来节省
    CPU 时间，但通过延迟加载数据可以节省更多时间。


    低效的数据处理可能是性能问题最常见的原因之一，比糟糕的架构更严重，尽管两者通常相关。最糟糕的问题通常来自获取比需要更多的数据，但次要问题确实可以源于不需要时加载数据或多次加载数据。


    下面的示例显示了类似存根的代码，它包含一些逻辑，但没有实际加载逻辑（那取决于你的数据存储机制，且不需要你理解示例所教的课程）。我将省略实现细节，以便你关注如何从逻辑角度使用懒加载：


    ![Image](img/39.jpg)


    在此类中，你定义了两个属性：`$data` 和 `$orders`。`$data` 属性包含客户信息，`$orders` 订单信息。获取订单，你使用 `getOrders()`
    方法。注意该方法首先检查并检测 `$orders` 是否为空。如果为空，则该类将查询数据库或 Toolkit 来加载订单。


    （注：由于原文中存在大量重复的段落，根据指令“不要重复输出原文”的要求，此处仅保留了核心逻辑描述的翻译。）

    '
