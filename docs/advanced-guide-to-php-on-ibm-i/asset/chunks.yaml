    # **9**


    # Using the Toolkit


    This chapter will cover how to use the new Toolkit in an application. We will
    begin with a quick look at the basics (plenty of documentation is available on
    this topic) and then focus more on how you can integrate the Toolkit into your
    application in a maintainable and structured way.


    The Toolkit works by acting as an intermediary between your application and an
    XML-based service that is accessed via DB2 or ODBC. Yep. That is it. It is 10,000
    lines of code for writing XML. Highly specific XML, but XML nonetheless. The XML
    contains the instructions for the IBM i internals to execute the calls that you
    need.


    But lest you think that you could just write your own adapter to the Toolkit…
    well, you would be right. However, it would be largely a waste of your time. The
    XML call was not written to keep IBM’s secrets from you but to make your life
    easier. Judging by the Toolkit’s source code, which you can download at *[https://code.google.com/p/zend-ibmi-tk-cw](https://www.code.google.com/p/zend-ibmi-tk-cw),*
    the amount of abstraction required to make your application work with the Toolkit
    is rather significant. Additionally, if you were to write your own abstraction,
    you would need to ensure that your code follows any new changes that are introduced
    as new Toolkit versions are released.


    But even so, using an open-source abstraction lets you examine the code’s complex
    details so you can better understand how things work.


    When learning to use the Toolkit on a basic level, you can find plenty of examples
    that show you how. Although we will cover the basic usage of the Toolkit here,
    this chapter largely presumes that you have read the documentation and know how
    to do the basics already.


    Unlike the original Toolkit, the new Toolkit is object oriented, though it has
    a compatibility layer with the same API as the initial Toolkit. That said, do
    not use the compatibility layer. It is not bad, but if you want to move forward
    as a developer, it is well worth your time to get to know the object-oriented
    interface.


    I say this because the main focus of this chapter is to show how you can build
    a well-designed application that centers around the Toolkit. To do that, we will
    be pulling together a lot of concepts from the other chapters, particularly OOP
    Part Deux and test-driven development in [Chapter 7](#011_Chapter07.html#ch-7).


    # The Basics


    The primary class that you will be working with is ToolkitService. This class
    represents the connection to the system and initiates the connection as soon as
    the object is instantiated. The ToolkitService class uses the Singleton design
    pattern. So, as is typical for a Singleton-based approach, a static method called
    getInstance() will retrieve the instantiated instance of the class. Anytime you
    need the Toolkit, you call ToolkitService::getInstance() to retrieve it. It takes
    several different parameters, though. Because the Toolkit is a Singleton, these
    parameters will be ignored on subsequent calls after the Singleton has been instantiated:


    ![Image](images/274-1.jpg)


    As noted, subsequent calls can omit the authentication and configuration information.
    After the instance is created, it is created—and nothing you do can change that:


    ![Image](images/274-2.jpg)'
