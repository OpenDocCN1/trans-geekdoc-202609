    *Figure 4.22: Blue dot appears in code window to indicate a breakpoint is set*


    When you execute the request, the program will stop when it encounters this breakpoint.
    To remove the breakpoint, double-click the line number again. Additionally, you
    can open the **Breakpoints** view in [Figure 4.23](#008_Chapter04.html#fig4-23)
    and remove the breakpoint from there.


    ![Image](images/122.jpg)


    *Figure 4.23: Removing a breakpoint in the Breakpoint view*


    But sometimes you can run into breakpoint overload. This occurs when an important
    section of code that you want to analyze is frequently executed. One great example
    of this is the Magento event dispatcher (or any event-based system, for that matter).
    Often, hundreds of events are triggered in such systems, and to find an event,
    you keep pressing **F8 (Resume)** until you reach the one you want.


    That approach is inefficient. Instead, you can set a conditional breakpoint. To
    do so, right-click an existing breakpoint, and then select **Breakpoint Properties,**
    as [Figure 4.24](#008_Chapter04.html#fig4-24) shows.


    ![Image](images/123.jpg)


    *Figure 4.24: Selecting Breakpoint Properties*


    From there, you can set the condition (a PHP expression) to be satisfied for the
    breakpoint to pause execution. In [Figure 4.25](#008_Chapter04.html#fig4-25),
    you set the breakpoint to stop when the value for $name is equal to cms\_page\_load\_before.


    ![Image](images/124-1.jpg)


    *Figure 4.25: Setting a PHP conditional breakpoint*


    But the **PHP Conditional Breakpoint** window is not just for performing equality
    checks; you can also do any comparative statement ([Figure 4.26](#008_Chapter04.html#fig4-26)).
    This is essentially the same functionality as the **Break…When** option in the
    IBM i Debugger.


    ![Image](images/124-2.jpg)


    *Figure 4.26: Entering a comparative statement*


    # Toolbars


    Although working with the browser tools in Zend Studio is useful, you might find
    that the tools do not always do everything you need them to. For example, say
    you use Google Chrome for your front-end development, but the browser in Zend
    Studio is not Chrome. By using a browser that is not part of Zend Studio, you
    cannot natively initiate a debug session for requests in your browser.


    For that reason, you can get several toolbars that let you trigger debug sessions
    from within your browser. Zend offers toolbars for Mozilla Firefox and Microsoft®
    Internet Explorer. Community-based debug toolbars are also available for Google
    Chrome and Apple Safari. All the debug toolbars do about the same thing.


    To immediately initiate a debug session, click the **Debug** button to display
    the **Debug** menu, and select **This Page** ([Figure 4.27](#008_Chapter04.html#fig4-27)).
    Clicking **Next Page** will initiate a debug session with the next HTTP request.
    To initiate a debug session for any GET or POST request, click the **Get, Post**
    option. **Post Only** will debug only for POST requests. Pretty simple.


    ![Image](images/125.jpg)


    *Figure 4.27: Selecting This Page on the Debug menu*


    But remember that earlier, you needed to do some setup to enable the system to
    talk to your IDE. To help you manage that, there are often settings page similar
    to the one in [Figure 4.28](#008_Chapter04.html#fig4-28).


    ![Image](images/126.jpg)


    *Figure 4.28: Example zDebug settings page*


    Usually, you need to be specifically aware of only two settings. First, set your
    debug host as the IP address that the web server detects as your machine. And
    second, you should generally set **Debug Local Copy** to **Yes**. If this setting
    is turned on, the IDE will probably pull the file from the server by using the
    debugger protocol. Also, because the debugger can do that, you do not want the
    debugger to be installed in a production environment.


    # Manual Control


    Sometimes, using the browser tools is not enough. One example is when you are
    debugging a command-line script. A browser cannot do that because it is not running
    on the command line. You might be unaware that the debugger does not do anything
    special to initiate a debug session. It is looking in one of two places for some
    information. It looks either in the query string or in the cookie. At minimum,
    it is searching for values for start\_debug, use\_remote, debug\_port, and debug\_host.


    There are a few other options, but they are generally not needed to initiate a
    debug session. One optional parameter, however, is useful. The onginal\_url helps
    the debugger map a given file onto one of the servers that you defined earlier
    in your instance of Zend Studio.


    To debug a command-line program, enter the following on the command line before
    running it:


    ![Image](images/127-1.jpg)


    When the debugger starts, it will detect that a debug scenario has been requested
    via the query string, which will try to start the debugger.


    Likewise, when it comes to debugging web service calls, you might need to use
    a little magic, but it is still easy. You create a script that calls the web service
    according to how it should be called, and then add the cookies onto the request.
    For example, if you are using Zend Framework 1 and Zend\_XmlRpc\_Client:


    ![Image](images/127-2.jpg)


    This code will initiate the debugger, so you can start your debug session.


    # Conclusion


    Debugging is probably one of the few tasks that every programmer should ensure
    they know how to do. It makes it easier to test your code and fix bugs by giving
    you a window into what your application is doing during runtime in a way that
    a simple var\_dump() will not do. If you are not proficient at using a debugger,
    stop what you are doing and learn it. You will be glad that you did.


    # **5**


    # Security


    The IBM i operating system is known for having rock-solid security. Because of
    this, many developers have not had to concern themselves with some of the details
    of implementing a secure system. This becomes problematic as we start looking
    at deploying programs to a web-based infrastructure. Using the terminal, you also
    had the benefit of the application running on the server, which is an environment
    you can control.


    The browser, however, is beyond your control. It is running on a different system,
    perhaps outside your network. And unlike the terminal, the browser can execute
    code via JavaScript® or other embedded technologies.


    And that is assuming that an incoming request is coming from a browser. The HTTP
    protocol is easy to forge, and HTTP requests are likely the most used protocol
    on the Internet. That means they are a prime target.


    Although the web world is rife with danger, it is easy to mitigate a vast majority
    of the attack vectors. Many would have you believe that legions of attackers are
    out there who have in-depth knowledge of your stack from top to bottom and can
    make a web server accidentally dial the Department of Defense’s terrorist hotline.


    There might be people who can do this, but they are not your biggest problem.
    You have three primary types of people that you need to watch out for.


    The first group is the script kiddies. Script kiddies are people who look only
    for easy vulnerabilities, usually by running a script that does a predefined series
    of tests on a subnet. Generally, those tests are searching for some resource that
    is easily accessible or is indicative of your running exploitable software. Custom
    software installations will usually not be affected, though they might reveal
    information that can be used in a later attack. And though you typically do not
    need to worry about these types of attacks, it is well advised to monitor them
    to see how your application behaves if it becomes a target. Forensic software
    that performs log analysis will usually be enough to help you watch for these
    types of patterns.'
