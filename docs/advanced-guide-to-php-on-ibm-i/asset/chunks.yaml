    当你尝试访问一个尚未包含在当前请求作用域内的给定类时，此自动加载加载器会将文件名转换为 `MyNamespace/MyClass.php` 并尝试加载它。但请注意，此函数不适用于伪命名空间类（pseudo-namespaced
    classes），因为你没有考虑到下划线的情况。


    你*需要*遵循目录结构与命名空间值匹配的规则吗？不需要，完全不需要。事实上，你可以随心所欲，仅仅为了好玩而定义命名空间，只要你的自动加载加载器能够适应这种结构即可。但使用命名空间的目的是让你在代码中定义多个工作区域，并以一种可预测的方式进行。所以，虽然你*可以*忽略命名规范，但遵循这里描述的规范会有益得多。


    那么，如何在多个不同的命名空间之间进行工作呢？


    让我们从名为 `Util` 的命名空间开始，它将包含在应用程序中具有通用或工具类的类。`Util` 命名空间有一个名为 `Date` 的类，你用它来实现某些通用的日期处理功能。你把此类存储在名为
    `Util/Date.php` 的文件中（并存储在目录 `/lib` 中，该目录想必已在 `include_path` 中）：


    ![Image](img/14-1.jpg)


    如果你在 `index.php` 文件内部创建此类的实例，你将必须从全局作用域内调用它。当然，你可以在 `index.php` 中将代码定义在 `Util`
    命名空间内，但这违背了几乎所有认可的实践。


    `index.php` 文件看起来如下：


    ![Image](img/14-2.jpg)


    注意在创建新实例时使用的反斜杠。同时注意示例中没有包含开头的反斜杠。这很有趣，稍后你就会看到。但现在，让我们看看如何从不同的命名空间访问类。


    你将在 `Filesystem` 命名空间内部创建一个 `File` 类。该类的功能之一是返回给定文件（在此例中 `index.php`）的 `mtime`
    或修改时间。为了渲染时间戳以便无论日期格式如何都保持相同的格式，请使用 `Util\Date` 类：


    ![Image](img/15.jpg)


    让我们看看如何创建 `Util\Date` 的实例。在这里，我们在类名前面加了一个反斜杠。如果你不加，Zend Engine 将认为你是在请求 `Filesystem\Util\Date`。如果这确实是你想要的，你将创建一个名为
    `Filesystem/Util/Date.php` 的新文件，在文件中定义命名空间为 `Filesystem\Util` 并指定 `Date` 类。命名空间的工作方式与文件系统类似，特定操作的上下文会产生影响。


    但显式声明全命名空间可能会很麻烦，而且与伪命名空间相比，它并不能为代码的可读性带来多少。因此，引入了 `use` 关键字。它允许你作为开发者在实际使用类之前声明你将要使用的类。通过这样做，你可以在内联代码中仅指定类名，而不是全命名空间。


    对 `Filesystem\File` 类应用这种处理方法会产生如下类定义：


    ![Image](img/16.jpg)


    这种技术开始让你的代码变得更易读了。


    但如果你有两个同名但位于不同命名空间的类，会发生什么？例如，你提到你正在使用类 `Util\Date`，但如果你也有一个名为 `System\Date` 的类呢？


    针对这种情况，你可以使用别名（aliasing）为特定类提供替代名称以避免冲突：


    ![Image](img/17.jpg)


    这种方法有助于防范任何意外的命名冲突，并让你能够更具体以避免冲突。


    在处理任何中等复杂的应用程序时，命名空间几乎是必须的。即使在我那些只有几十个类的简单应用程序中，我也默认使用它们。它让应用程序更具可读性、更易管理，且结构更化。


    # Traits（特征）


    你在 OOP（面向对象编程）工作时可能会遇到的一个典型问题是一个包含多个迥异特征的类。考虑一个代表目录中产品的类，但它具有某些实现方法，例如一个将对象导出为
    XML 表示形式的方法。为了实现这一点，你尽可能在一个原始的类中提供这些类型的实现细节，这可能会将该功能暴露给比你想要提供的数量多的类。


    在思考 traits 时，再次考虑生物学世界以找到一个密切的类比。从“品种”的角度来考虑。狗就是狗，但狗有不同的特征，例如斑纹或大小。trait 就像是的品种。狗仍然是狗，但个体具有某些特征，而这些特征并不总是处于一种分类结构中。例如，柯基犬和腊犬都是矮的，但你不会看到女王带着一只腊犬。


    回想之前的命名空间示例，`Filesystem` 命名空间中有一个名为 `File` 的类。为了允许 `File` 类将自身导出为 XML 文档，你需要确保它继承了正确的类来这样做。但这可能是一个棘手的处地，因为
    `Filesystem` 命名空间并不自然适合将成员导出为 XML 文档。


    所以你定义了一个新的 trait，让你将所需的功能复制到 `File` 类中。你把此 trait 放在 `Util` 命名空间中：


    ![Image](img/18.jpg)


    该 trait 然后获取类的基名，并省略命名空间（`basename()` 可以处理不仅是文件名）。这是因为 `get_class()` 返回的是完全限定类名，包含了命名空间，而
    XML 节点名称不喜欢反斜杠。然后你创建一个新节点并遍历所有属性，将它们的名称和值添加到文档，最后返回。


    不使用 trait 实现此常用方法是将对象传递给某种导出类，该类会遍历对象并渲染 XML。但这种方法的问题是，私有和保护成员对外部导出器是不可见的，因此它们会被排除在导出之外。通过将导出程序放在
    trait 中，你可以访问所有成员变量。


    接下来，将 trait 添加到 `Filesystem\File` 类：


    ![Image](img/19-1.jpg)


    现在主代码中，你可以执行导出程序：


    ![Image](img/19-2.jpg)


    结果是一个代表类的良好的 XML 文档，而你不需要复杂的层次结构或技巧：


    ![Image](img/20-1.jpg)


    但如果 trait 只是简单的复制，你如何测试一个类是否使用了它们呢？简单来说，你无法测试。虽然你有多种方法测试类是否包含了 trait，但 trait 的目的是水平复用。因此，像
    `instanceof` 这样的测试从风格角度来看可能合理，但它并没有准确代表 trait 的本质。你可以在一个 GitHub 拉请求中找到关于此主题的长讨论（参见
    [`github.com/php/php-src/pull/23`](https://github.com/php/php-src/pull/23)），决定不包含此类功能。正如下一个示例所示，你可能更感兴趣函数是否存在，而不是某个
    trait 是否存在。所以，在测试所需的函数时，你可以这样做：


    ![Image](img/20-2.jpg)


    让我们把这种情况推向更有假设性的水平。假设你有一个输出 XML 的 trait，另一个 trait 返回 `DOMDocument` 而不仅仅是 XML 文本。你可能使用这种方法向文档注入
    CDATA 节点，而 SimpleXML 不写入它们。`Util\DOMDocument` trait 将有一个返回属性作为 `NodeList` 的方法，以及一个返回字符串的
    `toXml()` 方法。

