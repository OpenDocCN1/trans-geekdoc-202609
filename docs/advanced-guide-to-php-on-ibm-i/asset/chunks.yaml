    A good view of a cache is to liken it to an index. The purpose of an index is
    to get you more quickly to the place where your data exists. Isn’t that the idea
    of a cache, too? But instead of providing a pointer to the data, the cache gives
    you the data itself. In an index, the data is compiled into a predictable result
    table, so the computer can determine where to get the information it needs by
    using a shorter execution path than if you were to scan the data. You do the same
    thing with caches. It is called a `unique key.` You use a simple algorithm to
    predict where the data you need is located and ask it to be returned from the
    cache.


    You do not, however, need to do this via a cache. You can use any storage mechanism—database,
    file system, whatever—to find and retrieve the desired data. What matters is not
    so much where that data is stored but how it is computed and, here is the kicker,
    `when` it is computed. The difference of when data is calculated technically changes
    its definition from `caching` to `memoization` or `tabling` (see `[http://en.wikipedia.org/wiki/Memoization](http://en.wikipedia.org/wiki/Memoization)`).
    I just call it `precaching` or `preprocessing,` which is easier, more succinct,
    and simpler to relate to caching in general.


    The (near) fatal flaw in typical caching scenarios is that they require the first
    person who accesses the page to prime the cache. The person who primes the cache
    will be the first person in the office that morning or the first person to access
    the cache after the `TTL` expires. More than one person priming the cache before
    the request has completed can cause inconsistent data, too.


    The way I approach preprocessed caching is to start with a `TTL` of zero, meaning
    no expiration. In other words, I generally do not expire my cache items. They
    stay in the cache until they are explicitly removed or are replaced. They do not
    expire.


    Never expiring cache entries has two benefits: (1) there is almost never a “first
    person performance hit,” and (2) if part of your system goes down, your site will
    continue to function.


    Let me illustrate point number 2. A while back, I had a block of HTML on my blog
    that appeared on every page. It was a block that showed the most popular pages
    on my site according to Google Analytics. That is a web service call I would not
    wish on anybody, so I decided to cache it. But instead of doing the standard `if-data-not-exists-calculate`,
    I precached it instead. The web service call could take from 5 to 10 seconds,
    and I did not want that to ruin anyone’s experience and make them leave my blog.


    But one day I noticed that the data was not changing (shame on me for not monitoring
    it better). It turned out that a change either in the API call or in my application
    had broken the processing of that analytics data. Do you know how many of my visitors
    noticed? Zero. Had I built that caching mechanism in the traditional manner, every
    person who visited my site would have had fatal errors. Because I moved the processing
    to an asynchronous method (see next section) and injected the data into the cache,
    the data never expired and the system kept plugging along. So although I did that
    to optimize the performance of my website, I accidentally increased its fault
    tolerance at the same time.


    To use the functionality on the front end, you go from doing all those inline
    checks that you did in the previous section to something a little simpler:


    ![Image](images/304-1.jpg)


    Rather than checking to see whether the data exists, you presume that it does.
    This is an important distinction.


    But the big problem with this approach is determining what must be preprocessed.
    When you save a product, for instance, how do you know which cached items need
    to be updated?


    Figuring this out is not that difficult to do, but it requires you to construct
    an architecture that is conducive to caching. Allowing calls to the database willy-nilly
    in your application will make it difficult to predict what needs to be done. However,
    following a structured object-oriented approach lets the data be predicted. To
    do this, completely detach both the persistence layer and the caching layer from
    your mainline code. Let’s use our imaginations a little to see what this might
    look like.


    Start by creating a class that will manage the cached entries for a product class:


    ![Image](images/304-2.jpg)


    The purpose of this class is threefold, and all of the tasks are directly related.
    The first is to process the cache (`processCache()`). The second, a child task
    related to the cache processing, is to save the different cache values for different
    actions. The third is to retrieve data from the cache for those processed items.
    Notice that nowhere in the code does the class retrieve information from the database.


    The next class you need is `Product`, which will represent the persisted data
    when you have an instance of it:


    ![Image](images/306.jpg)


    This class has the functionality that the mainline code will interact with when
    working with the object that represents the individual instance. When retrieving
    a new product object, or when the product object must persist itself, the `Product`
    class uses a resource object. By having all these classes, you can separate each
    responsibility into distinct clusters of functionality. This makes for a much
    more predictable and manageable architecture. So the `Product` class represents
    an instance of the data; the cache manager handles calculating, storing, and retrieving
    cached data; and the resource interacts with the database or cache:


    ![Image](images/307.jpg)


    Now for the resource to interact with the class, you have only small amounts of
    inline code that you must write. To create a new product, simply start by interacting
    with the `ProductResource` class:


    ![Image](images/308-1.jpg)


    If you want to retrieve an instance of the product class, start in the same place:


    ![Image](images/308-2.jpg)


    By using these layers, the caching mechanism can be transparently used and completely
    skip the database for certain operations. The caching is also done on the `Product`
    object’s `save` method instead of inline in your code. To be clear, this is not
    a silver bullet that will automatically solve all your problems. But by thinking
    about your caching ahead of time, you can build an architecture that is more conducive
    to caching, rather than just bolting it on at the end when your site is too slow.


    # Asynchronous Processing


    One potential problem associated with the previous example is what happens when
    lots of calculations must be done before saving to the database or caching subsystem.
    This scenario can make the cost of precalculation too much to do inline.


    I a big fan of asynchronous processing. Particularly on write or processing operations,
    so much does not need to be done on the user’s HTTP request. Implementing a method
    for asynchronous processing will add complexity to your application, but it can
    pay off in spades toward creating a good user experience.


    I am also a big fan of the Zend Server Job Queue. I like its HTTP-based approach,
    which is something that virtually all other PHP-based queuing mechanisms do not
    do. Plenty of good queuing options are available, from local software to cloud-based
    solutions. But they either involve polling or require you to manage long-lived
    connections. Additionally, these options often require you to create a separate
    implementation of your application to handle them. Although that requirement is
    definitely not a massive roadblock, I like the fact that Zend Server does this
    out of the box.

