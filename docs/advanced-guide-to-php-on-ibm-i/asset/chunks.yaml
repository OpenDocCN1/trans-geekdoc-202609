    对缓存的一个很好的视角是将其类比为索引。索引的目的是让你更快地到达数据所在的地方。这不也是缓存的理念吗？但缓存提供的不是指向数据的指针，而是数据本身。在索引中，数据被编译成一张可预期的结果表（result
    table），因此计算机可以使用比扫描数据更短的执行路径来确定从何处获取所需的信息。你对缓存做的是同样的事情。这被称为 `unique key`（唯一键）。你使用一个简单的算法来预测你需要的数据所在地，并请求从缓存中返回该数据。


    然而，你并不需要通过缓存来实现。你可以使用任何存储机制——数据库、文件系统，任何东西——来查找并检索所需的数据。重要的不在于数据存储在哪里，而是它们是如何被计算的，而且关键在于，它们是**何何时**被计算的。数据计算时机的差异在技术上会将它的定义从
    `caching`（缓存）转变为 `memoization`（备忘录）或 `tabling`（表化）（详参见 `[`en.wikipedia.org/wiki/Memoization`](http://en.wikipedia.org/wiki/Memoization)`）。我只是称之为
    `precaching`（预缓存）或 `preprocessing`（预处理），这更容易、更简洁，也更容易与泛缓存联系起来。


    典型缓存场景中的（近乎）致命缺陷是，它们要求第一个访问页面的人来预热缓存。预热缓存的人将是早上办公室里的第一个人，或者是是 `TTL` 过期后第一个访问缓存的人。在请求完成之前，有多个个人预热缓存也会导致数据不一致。


    我处理预处理缓存的方法是从 `TTL` 为零开始，这意味着不过期。换句话说，我通常不会让我的缓存项过期。它们一直留在缓存中，直到被显式地删除或替换。它们不会过期。


    永不过期的缓存条目有两个好处：(1) 几乎永远不会出现“第一个人的性能损耗”，(2) 如果你的系统部分发生故障，你的网站将继续运行。


    让我来说一下第 2 点。不久前，我的博客上有一段出现在每个页面的 HTML 代码块。该区块根据 Google Analytics 显示我网站上最流行的页面。那是一个我不希望让给任何人的
    Web 服务调用，因此我决定对它进行缓存。但我并没有采用标准的 `if-data-not-exists-calculate` 模式，而是对其进行了预缓存。Web
    服务调用可能耗时 5 到 10 秒，我不想让这破坏任何人的体验并让他们离开我的博客。


    但有一天，我注意到数据并没有发生变化（真该我没能更好地监控它）。事实证明，API 调用或我的应用程序中的某处更改破坏了该分析数据的处理。你知道我有多少访客注意到了吗？零。如果我以传统方式构建该缓存机制，那么每个访问我网站的人都会遇到致命错误。由于我将处理过程移动到了异步方法（见下一节）并将数据注入到缓存中，数据从未过期，系统一直平稳运行。因此，虽然我这样做是为了优化网站的性能，但我却无意中同时增加了它的容错能力。


    要在前端使用此功能，你将从在上一节中执行的所有那些内联检查，转变为一些简单一点的操作：


    ![Image](img/304-1.jpg)


    与其检查数据是否存在，不如假定它存在。这是一个重要的区别。


    但这种方法的大问题在于确定哪些内容必须进行预处理。例如，当你保存一个产品时，你如何知道哪些缓存项需要更新？


    要解决这个问题并不困难，但它要求你构建一个利于缓存的架构。在应用程序中随意调用数据库将使缓存变得困难。由于将处理移动到了异步方法（见下一节）并将数据注入到缓存中，数据从未过期，系统一直平稳运行。因此，虽然我这样做是为了优化网站的性能，但我却无意中增加了它的容错能力。


    要在前端使用此功能，你将从在上一节中执行的所有那些内联检查，转变为一些简单一点的操作：


    ![Image](img/304-1.jpg)


    与其检查数据是否存在，不如假定它存在。这是一个重要的区别。


    但这种方法的大问题在于确定哪些内容必须进行预处理。例如，当你保存一个产品时，你如何知道哪些缓存项需要更新？


    要解决这个问题并不困难，但它要求你构建一个利于缓存的架构。在应用程序中随意调用数据库将使缓存变得困难。


    （抱歉，此处翻译出现了重复，我已根据要求重新整理了翻译的逻辑层）


    [/content]


    抱歉，在翻译过程中出现了逻辑重复。以下是修正后的完整翻译内容：


    [content]


    对缓存的一个很好的视角是将其类比为索引。索引的目的是让你更快地到达数据所在的地方。这不也是缓存的理念吗？但缓存提供的不是指向数据的指针，而是数据本身。在索引中，数据被编译成一张可预期的结果表（result
    table），因此计算机可以使用比扫描数据更短的执行路径来确定从何处获取所需的信息。你对缓存做的是同样的事情。这被称为 `unique key`（唯一键）。你使用一个简单的算法来预测你需要的数据所在地，并请求从缓存中返回该数据。


    然而，你并不需要通过缓存来实现。你可以使用任何存储机制——数据库、文件系统，任何东西——来查找并检索所需的数据。重要的不在于数据存储在哪里，而是它们是如何被计算的，而且关键在于，它们是**何时**被计算的。数据计算时机的差异在技术上会将它的定义从
    `caching`（缓存）转变为 `memoization`（备忘录）或 `tabling`（表化）（详参见 `[`en.wikipedia.org/wiki/Memoization`](http://en.wikipedia.org/wiki/Memoization)`）。我只是称之为
    `precaching`（预缓存）或 `preprocessing`（预处理），这更容易、更简洁，也更容易与泛缓存联系起来。


    典型缓存场景中的（近乎）致命缺陷是，它们要求第一个访问页面的人来预热缓存。预热缓存的人将是早上办公室里的第一个人，或者是 `TTL` 过期后第一个访问缓存的人。在请求完成之前，有多个个人预热缓存也会导致数据不一致。


    我处理预处理缓存的方法是从 `TTL` 为零开始，这意味着不过期。换句话说，我通常不会让我的缓存项过期。它们一直留在缓存中，直到被显式地删除或替换。它们不会过期。


    永不过期的缓存条目有两个好处：(1) 几乎永远不会出现“第一个人的性能损耗”，(2) 如果你的系统部分发生故障，你的网站将继续运行。


    让我来说一下第 2 点。不久前，我的博客上有一段出现在每个页面的 HTML 代码块。该区块根据 Google Analytics 显示我网站上最流行的页面。那是一个我不希望让给任何人的
    Web 服务调用，因此我决定对它进行缓存。但我并没有采用标准的 `if-data-not-exists-calculate` 模式，而是对其进行了预缓存。Web
    服务调用可能耗时 5 到 10 秒，我不想让这破坏任何人的体验并让他们离开我的博客。


    但有一天，我注意到数据并没有发生变化（真该我没能更好地监控它）。事实证明，API 调用或我的应用程序中的某处更改破坏了该分析数据的处理。你知道我有多少访客注意到了吗？零。如果我以传统方式构建该缓存机制，那么每个访问我网站的人都会遇到致命错误。由于我将处理过程移动到了异步方法（见下一节）并将数据注入到缓存中，数据从未过期，系统一直平稳运行。因此，虽然我这样做是为了优化网站的性能，但我却无意中同时增加了它的容错能力。


    要在前端使用此功能，你将从在上一节中执行的所有那些内联检查，转变为一些简单一点的操作：


    ![Image](img/304-1.jpg)


    与其检查数据是否存在，不如假定它存在。这是一个重要的区别。


    但这种方法的大问题在于确定哪些内容必须进行预处理。例如，当你保存一个产品时，你如何知道哪些缓存项需要更新？


    要解决这个问题并不困难，但它要求你构建一个利于缓存的架构。在应用程序中随意调用数据库将使缓存变得困难。


    # 异步处理


    一个与上一个示例相关的潜在问题是，如果在保存到数据库或缓存子系统之前必须进行大量计算，这种情况会导致内联计算的成本高到无法接受。


    我是异步处理的忠粉丝。特别是在写入或处理操作上，很多工作不需要在用户的 HTTP 请求中完成。实现异步处理方法会增加应用程序的复杂性，但在创建良好的用户体验方面会有巨大的回报。


    我也是 Zend Server Job Queue 的忠实粉丝。我喜欢它基于 HTTP 的方法，这是几乎所有其他 PHP 队列机制都不具备的。有很多优秀的队列选项可用，从本地软件到云端解决方案都有。但它们要么涉及轮询，要么需要你管理长连接。此外，这些选项通常需要你创建一个单独的应用程序实现来处理它们。虽然这种要求绝对不是巨大的障碍，但我喜欢
    Zend Server 开箱即用的这种功能。

