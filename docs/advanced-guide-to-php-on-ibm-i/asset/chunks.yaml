  trans: "\n缓存可以在客户端上进行，也可以在客户端和服务器之间的中间节点上进行。因此，API 可以使用包含许多不同缓存的分层系统，而客户端对此一无所知。通常，缓存是通过\
    \ HTTP 缓存头部来管理的，用于告知任何中间服务器（或客户端）缓存参数是什么。然而，由于每个 `URL` 旨在作为资源表示形式的位置，因此内容也可以（并且应该）在服务器端进行缓存。\n\
    \n# 资源定义\n\nREST 的魔力很大程度上取决于它处理资源端点的方式。这种策略并不新颖或独特，但它统一了所使用的方法。一个基于 REST 的场景有两种基本类型的\
    \ `URLs`：基于集合的（collection-based）和基于实体的（entity-based）。\n\n在构建典型的 API 时，开发者通常会通过带有动词的端点来构建\
    \ API；例如，`http://localhost/api/users/getUsers`（我们稍后会进行类似的操作）。但这不是 REST 的做法。REST\
    \ 的设计目标是表征性的。换句话说，它应该代表你组织中的数据，而不是描述这些数据在做什么。\n\n因此，对于用户示例，与其在 API 调用中使用动词，不如使用资源位置。在这种情况下，它是\
    \ `http://localhost/api/users`。当查询该 `URL` 时，客户端将接收到的用户资源列表，其中将包含一个 `URL`。\n\n\
    这里你可能会让纯粹主义者感到抓狂。你如何返回对用户集合的查询结果呢？你可能认为返回一个定义的用户列表是你应该做的。但你是错的。相反，为了让你的 API 遵循\
    \ RESTful 标准，你应该返回一个用户端点 `URLs` 列表。然后你通过查询这些单独的 `URLs` 来获取每个用户的数据。这就是你的 API 变为\
    \ RESTful 所需的。\n\n要检索单个实体，你将它的唯一标识符放在 `URL` 的末尾：`http://localhost/api/users/1`。每个实体都有一个\
    \ `URL`，可以从那里下载其数据负载，且仅从那里下载。\n\n但这样不是很浪费吗？你可能会说：“我可能对 API 发起成百甚至上千次查询来获取我需要的每个实体。”你是正确的。这正是许多人使用了\
    \ REST 特性但没有真正实现 RESTful 的原因。真正实现 RESTful 可能会非常痛苦。所以，如果必要，就走一些捷径吧。\n\n然而，通过走捷径，你将失去一些好处，即缓存。如果你检索一个返回实体的用户集合，你可以缓存结果吗？嗯，可以。但当有人尝试通过其唯一的\
    \ `URL` 实体时会发生什么？当该实体发生变化时又会发生什么？现在你需要知道该实体被缓存的所有位置并使它们失效。如果你在 `PHP` 内部进行缓存，这相对容易。但如果你使用\
    \ Varnish 或某种多级缓存系统会怎样？那样问题就会变得复杂得多。\n\n# HTTP 动词的使用\n\n你知道 HTTP 的方法动作不仅仅有 `GET`\
    \ 和 `POST` 吗？`RFC 2616` 定义了八种（`GET``POST`、`HEAD``OPTIONS`、`CONNECT、`PUT``DELETE`\
    \ 和 `TRACE`），`RFC 5789` 增加了另一种（`PATCH`），REST 可以利用。类 REST 的 API 不在 `URLs` 中使用动词，因此你通过\
    \ HTTP 方法确定要执行的操作类型。\n\nWikipedia 有一个非常棒的图表（`Table 8.1]`）有助于直观理解这个问题。（你可以在 http://en.wikipedia.org/wiki/representational_state_transfer\
    \ 找到该图表以及关于 REST 的其他信息）。\n\n![Image](img/235-1.jpg)\n\n因此，要删除单个用户，你会使用如下 HTTP\
