    In Alexander’s book *A Pattern Language* (Oxford University Press, 1977), he describes
    how people should be able to build their own homes and communities through a series
    of patterns. These patterns are made available via the implementation of doors,
    walls, windows, colors, and such to make a community in the likeness of the desires
    of the people who are living there. Although I have not read the book, it has
    a number of interesting observations that seem worth considering. But at 1,100
    pages, it is larger than the giant book on SQL I have in my library that I have
    not read either.


    But let’s move those considerations from the world of architecture and think about
    them from a software-design perspective. At times, wouldn’t a senior architect
    simply like to tell a junior developer to build a class that can have only one
    instance of itself, and have that developer be able to know exactly what the architect
    was talking about and proceed to create that class? Wouldn’t it be nice to have
    a means of communicating these types of concepts without having to describe them
    in detail?


    Well, that is exactly what we are going to do here. I will show you six common
    design patterns that PHP developers use and will provide some concrete examples,
    so you, too, can start talking in the secret language of design patterns.


    # Singleton


    In a mathematical sense, a singleton is a set of numbers that has one, and only
    one, value. So it is a set whose definition is to have multiple items but forcibly
    having only one. In programming, the Singleton design pattern limits a defined
    class to only one instance of itself. In other words, if one context of the application
    has an instance of the object and another context does too, both are using the
    same instance. If that is a little confusing, do not worry. We will examine some
    code to understand it:


    ```markdown

    ![Image](images/30.jpg)

    ```


    This example has a class called `Driver`, which represents someone who will drive
    a vehicle. Because the application is acting on behalf of a human (us), the driver,
    for a particular context, will always be the same. So whether you tell the car
    to drive or the truck to drive, the driver remains the same.


    A more realistic version of the Singleton design pattern is an object that represents
    a session. Because a session can be started only once, it is a natural fit for
    a Singleton. A `Toolkit` connection is another real-world example of a Singleton.


    When creating a Singleton class definition, you usually create a constructor that
    is `protected`. Doing so ensures that the class itself will be responsible for
    instantiation. Code that is outside the class cannot instantiate it:


    ```markdown

    ![Image](images/32-1.jpg)

    ```


    This code produces an error:


    ```markdown

    ![Image](images/32-2.jpg)

    ```


    Some examples show the constructor being defined as `private`, and I am not sure
    how I feel about that practice. It disallows child classes from creating a new
    instance of the class. Also, a private constructor is not available to child classes.
    I would almost prefer to mark the `getInstance()` method as `final` so that if
    an error occurs, it does so when the class definition is loaded rather than at
    some arbitrary point during runtime.


    However, the Singleton design pattern is not without its detractors, who have
    leveled several charges against it.


    The first is that Singletons are difficult to test. The theory is that testing
    a Singleton will inevitably change the object because Singletons are often used
    to maintain a global state without residing in the global scope. Therefore, you
    might not be able to develop a test that is consistent. I call this a half-truth
    because, yes, if you are changing the state, you might have difficulty creating
    a repeatable test scenario.


    The second charge is that in PHP, Singletons are not true Singletons. Because
    PHP uses a shared-nothing architecture where HTTP requests do not know about other
    HTTP requests, multiple instances could exist. Therefore, PHP cannot have true
    Singletons. This I consider purist nonsense.


    The last charge is that Singletons create tight coupling in your classes. This
    I completely agree with. Dependencies in a class are difficult to test. Consider
    a class that requires a connection to the `Toolkit`. If you built a unit test
    for that class and that class explicitly pulled that connection from a hypothetical
    `ToolkitAdapter` class, you would not be able to mock the adapter class. Mocking
    an object is the practice of replacing some of an object’s members to provide
    data in a manner that skips the actual connection to the external resource. Unit
    tests are used for testing units of logic, but they should almost never require
    external resources. Mocking lets you avoid that by pretending an object has connected
    to the external resource, when in fact, it has had the expected data injected
    into it. If this concept is a little fuzzy, do not worry.


    So, is a Singleton evil? If you wonder why I ask, type “are singletons” into Google
    to see those suggestions. My answer is no, but they can get into trouble if you
    are not careful.


    # Factory


    Factories are classes that create instances of objects. Why wouldn’t you simply
    use the `new` keyword and instantiate them? Because that additional logic is often
    required for certain types of classes:


    ```markdown

    ![Image](images/33.jpg)

    ```


    # Adapter


    Before writing this book, I had built several adapter classes. But in digging
    a little deeper, I found that although my implementations were correct, my understanding
    was a bit off. My working definition before this discovery was that an adapter
    made a common interface multiple classes. And this is true. But I missed an important
    detail. The word “adapter” comes from two Latin words: “ad,” meaning to, *toward,*
    or at; and “aptô,” meaning to *adjust* or *prepare.* Therefore, you are adjusting
    one toward another. Adapters are most commonly used as a means to provide interfaces
    to different database adapters. PHP Data Objects (`PDO`) is an example of the
    Adapter pattern but in reverse because it uses drivers. You write a driver to
    fit a unique implementation with a common interface; it is the driver’s responsibility
    to be compliant. An adapter is a common interface that translates functionality
    for the unique implementation; it is the adapter’s task to be compliant.


    Following is an example that defines an adapter for authenticating against either
    the `Toolkit` or a `DB2` connection:


    ```markdown

    ![Image](images/34.jpg)

    ```


    Here, the example is defining an adapter interface called `AuthenticationAdapterInterface`,
    which states that an authentication class must implement the `authenticate` method.
    This action forces the developer to write a class that makes a certain requirement
    to use one of the multiple disparate authentication mechanisms. That requirement
    is defined by the interface:


    ```markdown

    ![Image](images/36-1.jpg)

    ```


    Using the Adapter pattern, you do not have to care what the underlying implementation
    is as long as you have the methods you need. This is useful when defining a class
    that requires some kind of authenticator:


    ```markdown

    ![Image](images/36-2.jpg)

    ```


    # Strategy


    The Adapter pattern might have many uses on its own, but it is often more useful
    when combined with the Strategy pattern. The difference is that the Adapter pattern
    defines the common interface, whereas the Strategy pattern implements one. The
    distinction between definition and implementation is key and makes for a natural
    pairing:


    ```markdown

    ![Image](images/36-3.jpg)

    ```

