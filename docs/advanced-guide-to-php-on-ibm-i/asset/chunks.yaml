    In some ways, Interface Segregation is similar to Single Responsibility on the
    definition level but not in implementation. And as noted earlier, I do not believe
    that Interface Segregation requires the use of interfaces, but it will most often
    be implemented in that way.


    # Dependency Inversion


    [http://bit.ly/php\_ibmi\_di](http://www.bit.ly/php_ibmi_di)


    The most natural way to write applications that have a dependency, such as on
    a database connection, is to either create those objects or go out and get them.
    Sometimes, programmers will create objects inside dependent objects, as follows:


    ![Image](images/68-2.jpg)


    This technique is bad because it hard-codes values into the class, not to mention
    that each instance will create its own connection to `DB2`. If that occurs, I
    guarantee that your CEO will be calling you asking why the application is so slow.
    To get around this issue, developers will often write factories or registries
    to store a preinitialized database connection:


    ![Image](images/69.jpg)


    Although this approach is better because it removes the database instantiation
    from the data model class, it still introduces a tight coupling with the database
    class and creates problems with the code. That tight coupling with the database
    adapter means that you likely cannot use this class in other classes. This might
    not always be an issue (the example is a data model that tends to be application
    specific), but it can definitely be the case if you are writing code that is part
    of a larger library of functionality.


    Because a database adapter can contain a lot of additional functionality, let’s
    use the Interface Segregation Principle and define an interface that the model
    class can depend on:


    ![Image](images/70-1.jpg)


    For those who are not aware, CRUD stands for `Create/Read/Update/Delete`.


    Next, redefine your database adapter to fit the `CrudAdapter`:


    ![Image](images/70-2.jpg)


    And now, create the model that uses the Dependency Inversion Principle:


    ![Image](images/71.jpg)


    Here, you added another method called `setCrudAdapter()`, which lets you inject
    the database connection into the object. Then during the save operation, you check
    to see whether the adapter has been set. I like the `instanceof` operator because
    it checks not only for null values but also for object type, so I can do two checks
    at once.


    To inject the adapter into the model, you invert the dependency. Rather than having
    the class decide what it depends on, it states what it needs (a `CrudAdapter`),
    and the code outside the class provides the required dependency:


    ![Image](images/72-1.jpg)


    So what does this actually buy you? Say you need to add more data filtering or
    programmatic checks before saving to the database. At that point, you refactor
    all the model classes to depend on that class instead. However, by using the Dependency
    Inversion Principle, you make just two changes.


    First, you create a new class that handles the connection to RPG:


    ![Image](images/72-2.jpg)


    Then, you inject that adapter into the class instead:


    ![Image](images/72-3.jpg)


    And you are done.


    For a smaller application of maybe a half-dozen model classes, this technique
    might be overkill. But once you have to maintain more complicated applications,
    you need to make this a way of life. Not only does using Interface Segregation
    make handling changes in an application easier to manage, but it also simplifies
    unit testing. Now you can easily inject mock objects into your classes to replicate
    functionality without having to do external calls to a database, Toolkit, or web
    service that might cause data modifications to be considered after the test.


    For all but the simplest applications, this is a great way to work through handling
    dependencies in a more manageable fashion.


    # Introduction to Dependency Injection


    Handling injection can be a large task that itself must be managed. This is particularly
    true if an object has many dependencies. To learn how to handle injecting multiple
    dependencies, we will move from the Dependency Inversion Principle in SOLID to
    Dependency Injection in general. Dependency Injection simple means that a class
    does not go out to retrieve what it needs. Instead, it specifies its requirements
    and expects the outside world to provide them.


    *That* is the most basic definition of Dependency Injection, and nothing more.
    Dependency Injection has a bit of a bad reputation because, when considering the
    concept, people are actually thinking about one of its many different implementations.
    This basic definition is the right place to start; once you know that Dependency
    Injection is a simple concept, you can move to the more difficult concept of implementation.
    Dependency Inversion relates to a class that has dependencies, whereas Dependency
    Injection refers to how those dependencies are satisfied.


    The previous example showed how that looks when you manually inject dependencies.
    However, injection can become tedious as dependencies increase or, even worse,
    change.


    As a resolution to this problem, many new applications use another type of object
    called a `Dependency Injection Container`, or `DI Container`. This object serves
    as a repository for objects that other objects depend on. Several PHP frameworks
    have DI Containers, but you will build a simple one to see what the container
    does.


    To begin, you will slightly modify the earlier classes so that the dependencies
    are defined in the constructor. This is one of several ways to implement a Dependency
    Injection Container, but constructor injection is probably the easiest one to
    use. The `CrudAdapter` interface will remain the same, but you will add constructors
    to the `Db` and `SomeDataModel` classes:


    ![Image](images/74-1.jpg)


    The constructors define the requirements of the individual classes that the DI
    Container needs to implement.


    Next, you will start with a list of DI Container configuration options. We will
    look at the implementation a little later, so keep it in mind, but ignore it for
    now:


    ![Image](images/74-2.jpg)


    In this example, you have two different types of configurations: `CrudAdapter`
    and `PDO`. The `CrudAdapter` shows how to configure the DI Container to give an
    interface specification (`CrudAdapter`) a concrete implementation (`Db`) in the
    array key type. Another option is a concrete implementation; it has a different
    key called `constructor`, which defines the individual constructor arguments.
    In this case, mapping the named parameter with the key provides the `dsn` parameter
    value via the use of reflection.


    Before you dig into the code, let’s examine DI Container usage. In this case,
    you want to retrieve a fully configured instance of `SomeDataModel`. To do this,
    you must first create an instance of the `DiContainer`, which has a method called
    `get()`, and request an instance of the class you are searching for:


    ![Image](images/75-1.jpg)


    That is all there is to it. The difference between this method and simply creating
    a new object is that this instance of `$model` will have all of its dependencies
    automatically injected into the model. If you do a `var_dump()` on the `$model`
    object, you can see that it automatically has all of its dependencies injected
    via the constructor:


    ![Image](images/75-2.jpg)


    The fact that you have a fully configured object with a simple call to the `DiContainer`
    class should arouse your interest. At least a little.


    But what happens if you have a model that might need to access other classes during
    runtime? The answer is easy. Simply add the `DiContainer` itself as a dependency:


    ![Image](images/76-1.jpg)


    Now when you look at the model, you see a different story:


    ![Image](images/76-2.jpg)

    '
