    由于 ACL 权限有时存储在直接的键值中，而有时存储在键值加上权限设置中，因此 `hasPermission()` 方法不能简单地通过检查 `$this->data[$resource]`
    来判断用户是否有权限访问该资源。因此，你必须遍历对象以寻找任何合适的键，这使得我们需要 `Iterator` 对象。


    # ArrayObject


    尽管 `Iterator` 接口很有趣，但最好不要直接使用它。你可能已经注意到，之前的示例包含了大量的模板代码（boilerplate code），而你最不想做的事情就是花费大量时间一遍又一遍地编写代码。`Iterator`
    接口以及这些接口中的几个的用处，是通过使用类型提示（type hinting）来实现的。


    通常，你并不关乎传入对象的具体类型，但你希望确保该对象具有某种迭代功能。你可以将方法参数定义为需要一个 `Iterator`，Zend 引擎将验证提供的值是否为可迭代的对象。


    所以，如果 `Iterator` 对你没有太大帮助，你应该用什么呢？从实践角度来看，`ArrayObject` 类可能是最好的起点。之前的示例仍然不完全，它缺少了另一个类定义——`Session`
    类：


    ![Image](img/98-2.jpg)


    `ArrayObject` 类实现了 `IteratorAggregate`、`Traversable`、`ArrayAccess`、`Serializable`
    和 `Countable` 接口。它基本上处理了你之前手动编写的所有模板代码。事实上，你手动编写的每个类，可能都通过扩展 `ArrayObject` 而比使用接口写更好。


    `Acl` 类使用 `ArrayObject` 编写也会更好。它提供了基本的迭代访问，因此类中不再需要任何模板代码：


    ![Image](img/99.jpg)


    这段代码的工作原理与本章之前章节的代码完全相同，但少了大约 25 行代码。本节的目的是展示 `ArrayObject` 内部发生了什么，但你很少需要直接使用它。所以，不要使用之前章节的代码。对此抱歉。


    # 高级用法


    你可能在想 SPL 类到底有什么用。第一个原因是，它们消除了模板代码。“但为什么不直接用数组呢？它们不包含模板代码！”你可能会说。


    你是对的。但数组是基础结构。它们不包含类型检查，使用外部值检查可能会非常繁琐。面向对象编程的一个大优势是它让你将功能和数据组合在一起。


    # 拦截插入操作


    在这个示例中，你定义了一个类，该类有一个属性列表，可以在从数据库加载信息之前对对象进行验证。然而，你想让某些属性可用：


    ![Image](img/100.jpg)


    该类定义了一系列有效选项。你重写了 `offsetSet()`，因为当你设置数组值时，PHP 正是在那里与类集成。所以，当你开始向属性数组添加值时，是这样做的：


    ![Image](img/101-1.jpg)


    运行这段代码时，当你尝试设置 email 的值时，会抛出一个异常：


    ![Image](img/101-2.jpg)


    # 数组值的类型


    上一个示例展示了如何验证在作为数组使用的单个对象上设置的键。这种验证技术确实有其用处，但它的其他用途可能更贴你的日常编程生活。


    其中一个例子是能够验证数组成员的类型。假设你有一个应用程序出于某些目的需要的用户数组。在这种情况下，你在遍历它时对每个项进行验证。但这意味着你必须记住在每次遍历数组项时都进行该验证：


    ![Image](img/101-3.jpg)


    因为在运行这段代码之前没有进行类型检查，你不知道数组将是一个 `User` 对象还是一个 `Website` 对象。因此，你需要添加这段模板代码来确保你收到的对象是你预期的。代码之所以是模板代码，不是因为你需要执行的
    `instanceof` 检查，而是因为你需要在代码中使用这些用户数组的每个地方都进行该检查。


    更优雅的解决方案是创建一个类来为你完成验证，而不是将验证放在每个位置：


    ![Image](img/102-1.jpg)


    使用这段代码时，只有 `User` 实例会被添加。在这种情况下，如果传递了一个不是 `User` 类型的对象，它将静默失败。然而，在方法声明的末尾，如果提供了无效数据，你可以轻松地抛出异常。


    定义了新的集合对象后，你现在可以通过移除循环中的类型检查，并声明参数必须是 `UserCollection` 对象来简化函数：


    ![Image](img/102-2.jpg)


    # 懒性加载


    我们将查看的最后一个示例是懒性加载。有时，完成一项任务需要大量的数据或大量的处理。但如果数据或处理在整个应用程序中都是必要的，如果它们必须提前处理，那么可能无法优化逻辑。这个示例需要一点想象力。通常，这些场景中的包含相当的复杂性，如果完全写出来，在书上可能会更难以理解。考虑以下示例：


    ![Image](img/103-1.jpg)


    在这里，你为重要的全局值设置了值。但问题是，这些值都在请求开始时被加载，并且每次都会加载。通常，这是一种坏做法。但这种情况在旧应用程序中并不罕见。所以这不仅是一种坏做法，而且它的实现也会散落在整个应用程序中。让它工作需要大量的重构。


    更好的方法是让此功能懒性加载：


    ![Image](img/103-2.jpg)


    基本上，所需的功能只在被请求时才执行。在第一个示例中，如果你只需要一个数据，就会调用五个函数。但由于示例现在使用了 `ArrayObject`，它可以直接替换你之前定义的
    `$config` 数组，而无需重构代码。


    # 总结


    这些示例构成了进入 SPL 世界的一小但重要的一步。你可以根据在这里学到的知识，开始使用 SPL 中的其他组件，如 `CallbackIterator`、`DirectoryIterator`
    甚至 `SplPriorityQueue`。SPL 最初作为向 Zend 引擎提供对象钩子的手段并以此发展。大多数新的框架将使用基于 SPL 的类来实现各种内部功能，其中许多可以节省你花费大量时间编写重复代码的时间。因为好的程序员是懒的程序员，所以这是一个好事。


    # 调试基础


    调试是开发者在一天中执行的最任务之一。但遗憾的是，许多开发者对调试的看法是这样的：


    ![Image](img/105.jpg)


    这不仅是一种相对常见的技巧，而且是错误的。非常错误。


    *   它没有提供上下文（意味着它没有提供其他变量的值）。


    *   当 `$var` 变得更复杂时，它的用性就会降低。


