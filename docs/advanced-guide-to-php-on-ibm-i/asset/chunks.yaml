    The root element of the document is soap:Envelope, which has at least two elements:
    soap:Header and soap:Body.


    The header does not play as prominent a role as the body does. The header is not
    required, but the body is. It does not have the same level of structured requirements
    as the body. However, you can define the header requirements in a Web Services
    Definition Language file, or WSDL (which we will examine later), and make it a
    prerequisite for a properly constructed request.


    But for now, we will look at WSDL-less requests for simplicity:


    ![Image](images/237-1.jpg)


    This code is setting up a WSDL-less SOAP request. The first parameter in the SoapClient
    constructor is the URL of the WSDL to use. Because this example does not have
    a WSDL, you set that value as null. But by doing that, you must provide the endpoint
    for the SoapClient to call, which you do in an array of options in the second
    parameter. That value is specified in the location key. But what about that uri
    key? You use that key to specify the XML namespace for the actual SOAP call XML
    structure.


    The method that you call, in this case doCall(), does not exist in the SoapClient
    class. It is handled via \_\_call(), which lets you act upon the SoapClient object
    as if it were the remote object itself.


    When you execute the code, you get the following XML document (reformatted for
    clarity):


    ![Image](images/237-2.jpg)


    To handle the request, you create an endpoint that instantiates the SoapServer
    class. You then specify the response URI as well as a list of functions that will
    be responsible for handling any requests that are made.


    Following is a basic SOAP server implementation that will handle the request you
    previously defined:


    ![Image](images/238-1.jpg)'
