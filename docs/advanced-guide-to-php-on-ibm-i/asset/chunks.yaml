    \ only to create objects.\n\nA subset of methods is defined to help with creating\
    \ parameter objects in `ToolkitService`. These methods start with the keyword\
    \ `addParameter` followed by the type. So if you require a character parameter,\
    \ you call `AddParameterChar()`, or if you need an `int32`, you call `AddParameterInt32()`.\
    \ At a minimum, these methods will require an `I/O` type and a comment. The `I/O`\
    \ type determines the directionality of the parameter. It can be `in`, `out`,\
    \ or both. The comment will usually match the variable name being provided and\
    \ is more for your benefit than for the system’s. In fact, the comment is used\
    \ only if you are in debug mode.\n\nTo see how to use the parameter methods, look\
    \ at the samples included in your instance of Zend Server. We will examine a short\
    \ example here for the sake of completeness. For your reference, the following\
    \ is the RPG code used to build the `COMMONPGM` program, stolen from the Zend\
    \ Server RPG samples:\n\n![Image](images/276-2.jpg)\n\nCreating a parameter requires\
    \ calling the method `AddParameterChar()`:\n\n![Image](images/277-1.jpg)\n\nHere,\
    \ the first parameter sets the direction. The second sets the size of the parameter,\
    \ and the third is the comment. The fourth is the comment.\n[/content]\n```\n\
