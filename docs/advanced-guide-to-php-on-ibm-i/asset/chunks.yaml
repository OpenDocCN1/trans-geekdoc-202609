    这段代码将在浏览器窗口中显示“Hello World”字。尽管嵌入 JavaScript 来进行大量编程可能很有吸引力，但首选的方法是将代码写在外部 JavaScript
    文件中，然后将其包含在页面中。这种技术鼓励了代码复用，并允许对 JavaScript 资源进行更好的缓存。嵌入脚本是一个简单的文本文件，而嵌入代码如下：


    ![Image](img/188.jpg)


    在过去，做法是将 JavaScript 放在文件顶部的 `<head>` 部分。但这样做会导致一些意料之外的后果。JavaScript 的执行会阻塞页面内容的渲染。因此，如果你在网页中有
    JavaScript，浏览器将只渲染页面到某一点，直到该段 JavaScript 被执行或下载完成，这会让你的页面看起来人为地变慢。变通方法是在页面末尾加载任何非必需的
    JavaScript，而不是在开头。


    这种修复并不是强制性要求，但如果你认为你的网页渲染耗时过长，请记住这一点。CSS 不会阻塞渲染。元素会被渲染，然后在 CSS 类可用时再对它们进行装饰。JavaScript
    则会阻塞渲染。


    在声明 JavaScript 变量时，你通常应该使用 `var` 关键字。如果 PHP 的全局作用域很糟糕，那么在长存的浏览器页面上它会更加糟糕。除非那些数据确实必须在全局作用域中。但全局数据通常是没必要的。


    要定义函数，你使用 `function` 关键字。像 PHP 一样，你可以在全局作用域定义函数，也可以将它们附加到单个变量上。你也可以将它们定义为匿名函数（我们将在讨论事件时更深入讨论这一点）。


    在编写 JavaScript 代码时，你可以访问一个包含许多预定义项的环境。在之前的代码中，你看到了一个调用带有 `write` 方法的 `document`
    对象的示例。该对象是另一个对象 `window` 的属性，`window` 对象上附加了多个对象。我们可以说 `window` 对象实际上就是全局作用域。如果你向
    `window` 附加一个值，该值在全局作用域中可以立即访问：


    ![Image](img/189-1.jpg)


    仔细注意变量定义。你将值 `test` 附加到 `window` 对象的属性 `myVar` 上。然后在函数中，你在没有引用 `window` 对象的情况下引用了该值。这表明，当你没有显式引用对象时，JavaScript
    引擎将假设你打算与 `window` 对象进行工作。


    但无论核心函数对你的架构有多重要，完全可以说，事件确实是 JavaScript 世界的英雄。


    事件使 Web 应用程序能够执行与用户交互的自定义浏览器端逻辑。在 Ajax 中你也将将用到事件。简而言之，有趣的 JavaScript 都会使用事件。


    最典型的事件是 `click` 事件。每当有人点击或触摸（在平板电脑或移动设备上）定义了回调函数的元素时，该事件就会被触发。定义点击处理程序最常见的方法是在
    HTML 本身中定义。你可以通过 `on*` 接口作为元素的属性来定义大多数基于 HTML 的事件。因此，点击事件是 `onclick`，鼠标悬停过事件是
    `onmouseover`：


    ![Image](img/189-2.jpg)


    好了，让我们来分析一下这个。你定义了一个名为 `iJustClicked()` 的函数，它接受一个参数 `e`。`e` 参数代表由 JavaScript 事件管理器创建的事件对象。该事件对象有一个名为
    `target` 的属性。`target` 属性是对触发事件的 HTML 元素的引用。因为它是一个 HTML 元素，`target` 还有一个名为 `style`
    的属性，该属性又有一个名为 `backgroundColor` 的属性。不需要过度担心 `style` 属性包含了哪些样式。练习 CSS 将对你有帮助。


    当函数被调用时，它会将背景颜色设置为红色，然后定义一个计时器，在定义 1000 毫秒后调用一个匿名函数。该匿名函数也可以访问其所在作用域中包含的相同变量。当匿名函数被调用时，它会将值重置为原始的透明值。


    当用户点击定义了 `onclick` 事件监听器的段落时，`iJustClicked()` 函数会被调用。虽然你不需要传递任何参数，但传递事件值可以提供对
    `target` 对象的访问。


    但我们可以挖掘得更深。为了做到，我们将检查 JavaScript 和 HTML 混合的一个强大部分：文档对象模型（DOM）。


    你可以通过 `window` 对象上的 `document` 属性访问 DOM。对 `document.write()` 的调用就是一个例子。但你可以做更多事情：


    ![Image](img/191.jpg)


    这段代码将仅为第一和第三段落执行 `iJustClicked()` 函数。注意这里发生了几件事。


    首先，你没有将事件监听器嵌入 HTML 中，而是通过 JavaScript 分配了它们。但这里有一个问题。你的 JavaScript 出现在 HTML 之前，所以当你尝试寻找这些段落元素时，它们还不存在。


    解决方案是将函数分配给 `window.onload`。`onload` 事件将在浏览器完成加载后被调用。这是实现逻辑的良好切入点。在这种情况下，你将一个匿名函数绑定到两个段落。


    `document` 对象遵循 W3C 标准，这意味着 `document` 将包含某些功能。其中一个非常有用的功能之一是 `getElementById()`。它根据
    ID 获取元素。所以当你执行 `getElementById()` 时，它返回一个匹配该 ID 的对象。从那里，你将 `iJustClicked()` 函数分配给
    `onmouseover` 属性；现在每当该事件触发时，函数就会被调用。


    但请注意一点。当你指定 `JustClicked` 时，没有指定 `JustClicked()`。这样做将调用函数并将返回值赋值给 `onmouseover`
    属性。这说明你可以像传递变量一样地传递函数。在 PHP 中如果你使用匿名函数或闭包，也可以这样做，但它并不像 JavaScript 那样普及。


    然而，尽管这种操作能力非常强大，但编程可能会变得乏味。引入 JavaScript 库。


    # *jQuery*


    有许多不同的库可用，其中很多都是好的。但几乎每个 JavaScript 开发者都会的库是 jQuery。在写作期间，大约一半的网站在使用 jQuery。这在很大程度上归功于
    jQuery 的关注。


    要开始使用，请访问 jQuery 网站 *jquery.com* 并寻找基于 CDN 的链接。多个内容分发网络托管了 jQuery，所以你不需要。在写作期间，jQuery
    的当前版本是 1.9.1。因此我们选择 URL `http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js`
    通过 Google CDN 访问 jQuery 库。如果你倾向于使用本地库，也可以使用它：


    ![Image](img/192.jpg)

