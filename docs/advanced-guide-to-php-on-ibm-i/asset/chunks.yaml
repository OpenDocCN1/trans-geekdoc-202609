    So this is a bit of a diversion from what SPL is really all about. But because
    autoloading is a part of SPL, it is a necessary one.


    # Countable


    Countable is an interface defined in the SPL. It lets you directly provide information
    for the count() function when you pass an object. Although it is likely better
    to build out this functionality and call it directly instead of interfacing with
    internal functions (thus increasing the ambiguity of your code), the count() function
    provides a good introduction to how SPL works.


    When you normally work with an object and call the count() function on it, it
    will simply return the value of 1:


    ![Image](images/87-1.jpg)


    Running this code produces the following output:


    ![Image](images/87-2.jpg)


    Given that the class is called UserCollection, it is clear that you are querying
    a collection of User objects. In that case, do you really want to echo the value
    of 1, or do you want to receive the number of users accessible via the UserCollection
    class? If it is the latter, you can implement the Countable interface and provide
    a direct integration point with the internal count() function:


    ![Image](images/87-3.jpg)


    This code does not print 1 as before; instead, it outputs:


    ![Image](images/88-1.jpg)


    Let’s see what we meant by *ambiguity* noted a little earlier. The Countable interface
    is useful as an entry point to the SPL. In other words, it is a good, simple example.
    But it adds ambiguity when you try to understand how the code calculated the value.


    If you know that you have defined a method called count() in your class, how do
    you determine where that value is retrieved from? Using the count() function,
    you have a hidden layer of abstraction that is not readily clear from the code.
    In other words, in absence of any direct context (meaning that the class definition
    is not apparent), which code is clearer?


    ![Image](images/88-2.jpg)


    So Countable as an implementation detail can make your code less readable. But
    that said, Countable is useful as a means of type hinting:


    ![Image](images/88-3.jpg)


    In that function, you can use the Countable interface to require that objects
    passed to the function *can* be counted.


    So while Countable provides some advantage through the use of engine hooks, it
    offers more benefits by defining functionality that can be accessed directly,
    restricting types of objects that can be passed to a function or a method, and
    providing a simple example to demonstrate the power that is available in the SPL.


    # ArrayAccess


    ArrayAccess is a predefined interface that lets you tell the Zend Engine that
    a given object has some expected hooks for working as an array. This interface
    facilitates *iteration* by providing defined entry points for the Zend Engine
    to work directly with a class in a defined manner. You need to define four methods
    when implementing ArrayAccess. Following is a blank example of a class that has
    implemented this interface:


    ![Image](images/89.jpg)


    The individual methods defined here let various functions work with the object
    as if it were an array.


    To make this a little more interesting, let’s add some functionality to this class
    so that it mimics an array. The MyArray class will test whether a value is set,
    inform you whether it is set or unset, and print the value of the key when the
    value is set:


    ![Image](images/90.jpg)


    When you run this code, you get the following output:


    ![Image](images/91-1.jpg)


    Now let’s make the example more pertinent by having it take a session variable
    that gives you some access control in the object through a method called hasPermission(),
    which would be defined in this arbitrary Session class:


    ![Image](images/91-2.jpg)


    ![Image](images/92.jpg)


    This code creates a new method that lets you set a session object that provides
    some access control list (ACL) processing by injecting it directly into the array
    get/set functionality on an engine level. When you run your current testing code
    against this class, you get the following output:


    ![Image](images/93-1.jpg)


    Nothing happens, right? That is because you did not add an authenticated session
    to the object. So tweak the code by adding an ACL that you will configure.


    Note that you are not showing the implementation of the Acl class.


    For the moment, just presume that it works. The ‘test.w’ = true means that the
    current session has write access on the key test, whereas ‘test.w’ = false indicates
    that it does not:


    ![Image](images/93-2.jpg)


    Here, you added a new Session object that has an ACL attached to it. If you are
    not logged in, all you can do is check whether a value exists. The ACL you created
    lets this user write a value, but not read from it. Running the code produces
    this output:


    ![Image](images/94-1.jpg)


    The result shows that your ACL on the array is working. This user can write to
    the array member, but cannot read from it.


    # Iterator


    If you were watching closely, you may have noticed that we skipped a lot of code,
    namely the whole access control piece. Behind the scenes, you used an interface
    called Iterator that was implemented by an Acl object stored in a session object.
    Using this approach let you store the ACL settings in the object and iterate over
    the object itself.


    But to see how the Iterator interface works, you need to write a simple class
    that implements the Iterator class. Because the Iterator is primarily used for
    iteration, you will iterate over the individual object in a foreach loop to see
    the order of operations:


    ![Image](images/94-2.jpg)


    When you run this code, you will get the following output:


    ![Image](images/95.jpg)


    In the class, you define an internal array that contains three elements. When
    you start the foreach loop, it calls the rewind() method first to make sure that
    the array pointer is at the start of the array. Next, it calls valid() to determine
    whether the end of the array has been reached. If it has not, then foreach calls
    key() followed by current() to retrieve the value for the current iteration. After
    the end of the loop has been reached, foreach calls the next() method to advance
    the array before starting at the beginning again. Then, valid() is called again
    and the loop repeats.


    Let’s look at how you can use the Iterator interface in the ACL class:


    ![Image](images/96.jpg)


    Earlier in your ACL initialization, you created the ACL like this:


    ![Image](images/97.jpg)


    You set the ACL so that this individual user has write permission, but not read
    permission. To give total read access to the user, you would have used this ACL:


    ![Image](images/98-1.jpg)'
