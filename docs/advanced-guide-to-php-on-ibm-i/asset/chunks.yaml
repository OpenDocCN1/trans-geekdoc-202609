- fmt: '

    A while back, I wrote an object-oriented interface to the Zend Server Job Queue
    (see `[https://github.com/kschroeder/ZendServer-JobQueue-Job-API](https://www.github.com/kschroeder/ZendServer-JobQueue-Job-API)`
    Although that is a good thing, I will give a more basic example here. We will
    take a bit of a hybrid approach between what the Zend Server API and the API that
    I created provide. The reason for using this approach is that it is easier to
    demonstrate, and the API was created to work in a cloud-based, or multijob-queued,
    environment. In your system, this is largely irrelevant and creates additional
    overhead.


    This is a different tactic from the one that the good folks at Zend use. Their
    approach to using the Job Queue (which is sort of REST-like) is to provide a unique
    URL for each job that must be run. One problem with this technique is that it
    makes for a job that is more difficult to test. To test a job, you must call a
    browser to run the job. However, the job variables that the job requires are not
    sent via normal HTTP parameters. They are sent as a JSON string. So to test, you
    then have to consider that, too.


    I prefer an approach that has a few layers of abstraction in between. This makes
    it much more straightforward to unit test, and it encapsulates functionality for
    much easier code reuse. As mentioned earlier, this approach has a more complex
    implementation, but it pays for itself by letting you more easily implement functionality
    in your inline code.


    ### The Queue Side


    Let’s start on the queue side. You will have one defined URL that the queue is
    accessed from. This is a big change from the typical Zend Server implementation.
    You could do this via a REST-like URI as well and then write an Apache rewrite
    rule to return to the queue script. But that seems like the long route to take.
    Because you will be passing parameters via the native mechanism anyway, why not
    add the job class as a parameter, too?


    To run a task in the job queue, start by defining an abstract job class called
    `AbstractJob`. Its purpose will be both to provide a common interface for executing
    a job and to protect against executing unauthorized classes. This *is* basically
    an RPC method, which could be used as an attack vector. So you need some basic
    checking to make sure that not just any class can be called and executed:


    ![Image](images/309.jpg)


    As you can see, this implementation requires you to provide both `PDO` and `ToolkitService`
    classes. If more variable dependencies must be satisfied, using the `DI Container`
    code (or something like it) to handle those dependencies would prove beneficial.


    For a job to run the abstract function, you must define `execute()` in all classes
    that are built to run an asynchronous job. This is where the magic will occur.


    ### The Endpoint


    Next is the job queue endpoint, where the jobs will be executed and their results
    collected. This endpoint will also be responsible for creating the `PDO` and `ToolkitService`
    objects. Clearly, this is something you should do via configuration, but for the
    sake of clarity, the example will hard-code the connection information:


    ![Image](images/310.jpg)


    So you have your parameters, job name, and database connection, and you have your
    service defined. Now you create an instance of the job, configure it, execute
    it, and handle the results. If the job contains an error condition, it should
    throw an exception, set its job status to `FAILED`, and serialize and store the
    message. If the job is a success, it will set its job status to `OK` and serialize
    the result:


    ![Image](images/311-1.jpg)


    This example uses reflection so you can test class inheritance before instantiating
    the class. That is the safest way to instantiate a class. If the job requested
    is a child of `AbstractJob`, you create a new instance of that job and provide
    the `PDO` and `ToolkitService`. Then, you execute the job and capture either the
    result or the exception, handling both as described earlier.


    ### Client Side


    Moving now to the client side, you will create a class called `JobQueueManager`.
    This class will be responsible for interacting with the job queue. Encapsulating
    that functionality here will make your inline code much cleaner. This class has
    two tasks: (1) initiate job execution in the queue and (2) retrieve the results:


    ![Image](images/311-2.jpg)


    When instantiating the `JobQueueManager` class, you must provide the URL endpoint
    that the previous code is accessible from. If you want to execute a job, call
    the `call($job, $params)` method. This method will insert the job into the queue
    and return a job ID. You will use the job ID later to retrieve the job’s result.


    To retrieve the job, call the `getResult($jobId)` method. If the job has not started
    or has not finished executing, it will return `null`. However, if the job has
    completed, it parses the result and returns the request. Similarly, if an error
    occurs, the job parses the result and throws an exception. You must parse the
    result because the `Job Queue` stores the entire HTTP result in the status output,
    so you must extract the HTTP body before unserializing it.


    ### Implementation


    That takes care of the communication portion. Now let’s look at an actual implementation.
    Here, you will asynchronously execute the `COMMONPGM` example from [Chapter 9](#013_Chapter09.html#ch-9).
    To do that, you define a class that executes that call, but you wrap it in a job
    class that conforms to the interface the queue execution logic expects:


    ![Image](images/313.jpg)


    Notice how this code retrieves the parameters from the parent class along with
    the service instance. It then calls the `COMMONPGM` object and returns the result.
    Easy.


    Now you have both your client interface and server interface finished and a job
    that is ready to use. Next, you write the code to call the queue. Let’s play a
    little with HTTP and sessions so that when you load the page initially, it will
    insert the job. Then when you call it a second time, you will try to retrieve
    the job result:


    ![Image](images/314-1.jpg)


    Now, check the function calls that implement the logic. If the defined session
    variable is not set, you call `createJob()`:


    ![Image](images/314-2.jpg)


    Notice how you store the job ID in the session variable? This is not required,
    but if you want to retrieve the job’s results in the future, you must store the
    job ID somewhere.


    The following code processes the results:


    ![Image](images/315.jpg)


    If the `JobQueueManager` instance does not receive a result, then the job has
    not completed and it simply returns. If a result has been found, `JobQueueManager`
    echoes the result. However, if `JobQueueManager` detects an error, it throws an
    exception. Here, the exception is caught and the message displayed.


    This example shows how you can implement an interface to the Zend Server Job Queue.
    A full implementation will require a little additional functionality, such as
    the ability to throw typed exceptions, but this implementation is largely complete.
    For any long-running functionality that you must implement in your application
    (and long-running in the web world can be measured in single-digit seconds), you
    can use this option to expedite those inline requests.

    '
