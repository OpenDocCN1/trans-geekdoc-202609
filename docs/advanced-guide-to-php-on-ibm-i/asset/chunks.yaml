    Although these two patterns are typical in several programming languages, the
    one you will likely use most often in PHP is the Publish/Subscribe pattern, or
    PubSub. This is because in the previous two patterns, both objects must be instantiated
    before you can use them. If an application is small and has few dependencies,
    this is not that big of an issue. However, for a larger application, all this
    object instantiation can consume a lot of compute cycles. PHP does not retain
    state in between requests, so object instantiation for the purpose of customizing
    its response can end up being a negative.


    The PubSub pattern, however, does not necessarily require object instantiation
    to register customizations. PubSub is a way of defining decoupled dependencies
    between multiple components. You have already used PubSub if you have used RSS
    or Atom feeds. The feed is published, and you, as the subscriber, work with the
    results as you see fit.


    Although PubSub is used for distributed computing (which is what RSS is), it is
    also useful internally for passing messages back and forth between application
    components. Rather than subscribing to publishers on disparate machines or services,
    you subscribe to disparate events within the application. You do not subscribe
    to objects, but to events. This lets you define your subscriptions without requiring
    a concrete implementation of both the observer and the observed.


    Implementing this design pattern involves building an event manager, or using
    a third-party’s product, to process and instantiate subscribers. By using this
    mechanism, you can define which subscribers are subscribed to which event via
    configuration or programmatically. Because you can configure this definition,
    you might not need to instantiate the `Subscriber` class, letting you efficiently
    define relationships between components.


    Although using a third-party event manager is preferable so you have less code
    to maintain, this simple example shows the mechanism of how the PubSub pattern
    works from within an application:


    ![Image](images/42.jpg)


    Here, you have two important methods. The first, `addSubscriber()`, registers
    a subscriber with the event manager. All you do is add subscribers to an array
    that is keyed based on an event name.


    The second method, `dispatch()`, takes two parameters. The first is the event
    name that you want to dispatch. The parameter for `addSubscriber()` should match
    what will be passed to `dispatch()`.


    The second parameter on the method is the list of targets to be passed to the
    subscriber. Note that the publisher must determine which targets to pass to the
    subscriber. This means that the publisher might not provide itself as a target
    to the subscriber, or it might not provide any target at all. Generally, it is
    a good practice for the publisher to at least provide itself as a target, but
    this is not required.


    Next, you need to define two classes, the `Publisher` and the `Subscriber`:


    ![Image](images/44-1.jpg)


    The `Publisher` class has a method called `save()` defined in it. This method
    does all internal processing that is required of it. It then retrieves the `EventManager`
    object.


    You now have defined your classes, but you have not executed any logic. Your first
    task is to add a subscriber to the event manager for the event that the `Publisher`
    object will dispatch:


    ![Image](images/44-2.jpg)


    Note that although you have defined a subscription to the publisher-save event,
    you have not assigned an instantiated class. Therefore, you will not incur the
    overhead of instantiating all your subscribers until the event is triggered. At
    this point, you have configured the `EventManager` to handle that event, so you
    can execute your logic:


    ![Image](images/45-1.jpg)


    Calling this code produces the following output:


    ![Image](images/45-2.jpg)


    Saving… is called from the `Publisher`, but Saved Publisher is called from the
    `Subscriber`. So you can see how you can loosely couple multiple different objects
    from multiple different contexts in a lightweight fashion by using the Publish/Subscribe
    design pattern.


    # Front Controller


    When first building PHP applications, you likely had the typical file-URL mapping
    (`http://localhost/list.php` mapped onto `{document root}/list.php`). If you had
    a protected section, it would be under `http://localhost/admin/customers.php`,
    which would map to `{document root}/admin/customers.php`.


    But because PHP applications have an admin section, you now have to remember to
    place code like this in the application:


    ![Image](images/45-3.jpg)


    In which case you need to have the following code:


    ![Image](images/46-1.jpg)


    As you can see, forgetting to put in that piece of authentication code could become
    a big problem. Refactoring can also be a huge issue; a change to something might
    require you to go through and modify each file. Overall, once you get past basic
    applications, things can become a little tedious.


    The Front Controller pattern helps solve these problems by forcing all requests
    to go through a bootstrap process and having the application, not the web server,
    dispatch the process. To do this, the Front Controller typically uses a combination
    of a central class plus URL rewrites configured on the web server. If you are
    using Apache (and you probably are), you implement this technique through the
    extension `mod_rewrite`, though most web servers have some kind of implementation
    to do this. The Front Controller lets you modify any request so that a request
    for one URL is mapped onto something completely different. It can be as simple
    as rewriting `/images/test.jpg` to `/images/t/e/s/t/test.jpg`.


    You generally use `mod_rewrite` with a Front Controller to first check whether
    a file exists for the URI requested. If it does not exist, you route the request
    to a bootstrap file. A typical rewrite rule will look like this:


    ![Image](images/46-2.jpg)


    This example checks whether the file (`-f`), directory (`-d`), or link (`-l`)
    exists for the current request, and if it does not, it routes the request to `index.php`.
    The `[L]` tells `mod_rewrite` to stop processing. It is like an `exit()` call
    in PHP.


    Now that you have things routed to the `index.php` file, where next? The Front
    Controller design pattern is intended 99.9 percent of the time for use as part
    of a Model/View/Controller (MVC)-based application for routing to a proper controller
    and coordinating many other things. That said, MVC is not a requirement. MVC will
    most likely depend on a Front Controller, but a Front Controller does not necessarily
    require an MVC architecture.


    The Front Controller’s basic responsibility is to intercept all requests and route
    them to the right place, somewhat like `mod_rewrite` does, except that instead
    of routing requests to a common entry point, it dispatches to one of many potential
    destinations, as [Figure 2.1](#006_Chapter02.html#fig2-1) shows.


    ![Image](images/47-1.jpg)


    *Figure 2.1: The Front Controller and mod_rewrite dispatching to various destinations*


    In the following example, you will run normal PHP scripts, which are in a `/scripts`
    directory relative to the document root but hidden from the end user. Remember,
    you want to use the Front Controller to broker all incoming requests.


    The `/scripts` directory contains several files:


    ![Image](images/47-2.jpg)


    These will correspond to URLs:


    http://localhost/


    http://localhost/about-us


    http://localhost/admin


    And here is the Front Controller code to do this:


    ![Image](images/48.jpg)


    The Front Controller is created and the `run()` method is called. The `run()`
    method will examine the request URI and try to match it to a script in the `/scripts`
    directory, doing various checks to look for directory indexes and security violations.
    If the script cannot be found, then a predefined 404 script is called and loaded.

