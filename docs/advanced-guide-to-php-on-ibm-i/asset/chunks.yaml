    # 8 Web 服务


    ## 服务基础


    REST 的定义似乎有些局限性，因为 REST 旨在以 Web 的风格解决 Web 的问题。对于一个每天处理数百次请求的 API 来说，这些限制中的许多可能显得过头了，但
    REST 的设计是为了允许多个过程同时发生。


    ## REST


    基于 REST 的架构风格有几个约束，但我们将只关注其中几个。第一个是系统旨在是可扩展的。一个类 REST 系统应该是无状态的。无状态协议比那些维护状态的协议更容易扩展得多。作为一名
    Web 开发人员，你无疑会熟悉世界上最流行的无状态协议：`HTTP`。由于 `HTTP` 是无状态的，每个请求都与其他请求隔离，并且不知道之前发生了什么，这使得响应易于缓存。这是设计类
    REST 架构的重要组成部分。


