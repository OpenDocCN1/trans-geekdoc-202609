    请思考一下这一点。你的实例化代码完全没有变化。你仍然在 `DiContainer` 上调用了 `get()`。但通过在模型类中进行该更改，并以 DI 容器能够理解的方式来实现，模型在无需你更改内联代码的情况下就完成了重新配置。然后，对于需要某些依赖对象的类中的代码，你只需要引用
    DI 容器属性 `$this->container` 即可。


    你现在应该开始看到这种方法所提供的威力了。


    考虑到这一点，让我们深入探讨这个 DI 容器的实现。


    首先，我们将查看基础构造函数：


    ![Image](img/77-1.jpg)


    在这里，你正在存储定义并让 DI 容器将自身存储在 `$objectStore` 属性中。这就是你入门所需的所有。


    还记得我们之前检查的主线代码吗？为了获取对象的实例，你在 `DiContainer` 上调用了 `get()` 方法。该方法的实现非常简单：


    ![Image](img/77-2.jpg)


    这段代码会检查是否已经创建了对象的实例，如果已经创建，除非 `$useStore` 被设置为 `false`，否则代码将返回之前定义的实例。我们使用 `$useStore`
    来允许对象指定它是想要现有的副本还是一个新副本。如果你将 `$useStore` 设置为 `false` 或者 `$objectStore` 缺少请求对象的实例，则会调用
    `createInstance()` 方法：


    ![Image](img/78.jpg)


    该方法首先检查对于请求的类是否存在另一个已定义的类规范。这是第一个 `isset()` 检查。它允许你的定义配置请求一个 `CrudAdapter`，但根据配置要求检索一个
    `Db` 类或 `ToolkitConnector`。在你的定义中，你也可以指定获取实例的替代机制。默认情况下，这种机制将创建一个新对象。但在某些情况下，例如当你想创建一个
    `ToolkitService` 实例时，你会调用静态方法来获取该实例。因此，你使用这种机制不仅是为了创建新对象，还为了调用其他类来获取请求的对象。


    接下来，你对请求的方法进行一些基础反射，以获取实例化方法的的方法定义。接下来的代码块使用此定义来填充该方法的参数。`processParameter()`
    方法处理了该过程：


    ![Image](img/80.jpg)


    `createInstance()` 方法遍历每个参数并将每个参数传递给 `processParameter()` 方法。然后，`processParameter()`
    检查是否存在该参数名的构造函数条目，如果该命名参数存在定义，它将检查该定义是数组还是标量值。如果是标量值，`processParameter()` 将返回该值。这就是你如何让
    DSN 输入到 `PDO` 对象中的。


    然而，如果值是一个数组，`processParameter()` 会检查一个名为 `type` 的键，以确定是否应该为声明的参数类型声明替换。如果是的话，DI
    容器将递归地调用自身以获取该类的实例。


    `processParameter()` 逻辑的简短版本是：它首先检查是否存在参数声明。如果不存在，它将简单地获取参数的类型实例（`else` 语句）。如果存在定义，`processParameter()`
    将检查是否定义了类型，并通过递归调用自身来返回该类型的实例，或者返回所呈现的标量值。


    这是关于依赖注入容器实现可能外貌的简要概述。在第 9 章中涵盖了使用 Toolkit），你将以更具实用的方式使用 DI 容器，以便更好地理解它的优势。


    尽管这些代码量对于纸面来说有些复杂，但你确实在大约 80 行代码中构建了一个功能依赖注入容器。诚然，还缺少一些内容，例如继承检查、可选参数和参数哈希。后者允许开发者指定运行时实例参数并创建对象的不同实例。


    尽管如此，这个示例可以让你对如何实现依赖注入产生见解，并且事实这并不是某种需要多年才能掌握的伟大的计算机科学理论。相反，依赖注入是一个简单的概念，其实现有时很复杂，但它的用处是让应用程序变得更容易维护和重用。


    # 3


    # PHP 标准库 (SPL)


    编写任何特别有用的东西归结为两点之一：条件语句或循环。诚然，你可以写一个不包含这两项操作的程序，但它几乎是毫无用处的。在你的程序员能力受到挑战之前，你只能写有限次数“Hello
    World”。


    大多数程序都包含大量的条件语句。如果这样，就做那个，否则做这个。当然，它们还包含函数、类、方法等。但如果你进入一个程序并深入研究函数、类和方法，直到没有更多对其他成员的调用为止，你通常会发现一些条件行为或循环，或者两者兼有；或者你会发现启用条件行为或循环（或兼有）的功能。条件行为和循环——你无法逃避它们。


    因为条件判断基本上是变量比较，所以你不一定能做什么让它们更对用户友好。然而，循环有几种方法使其易于使用。这是因为程序经常包含一个代表必须遍历的数据类型的对象。被遍历的数据通常被称为*集合*（collection）。访问特定的内部数据并不像对对象进行
    `foreach` 那么简单，后者仅仅会遍历属性：


    ![Image](img/84-1.jpg)


    这段代码输出以下内容：


    ![Image](img/84-2.jpg)


    这个简单对象的示例没有提供多少灵活性。但如果你有一个类旨在代表底层的数据集合呢？你不能简单地遍历该对象，因为你想要对象内部的*特定*数据，而不仅仅是公共属性。在这种情况下，你可以有一个
    `getData()` 方法，它返回一个元素数组。但如果元素数组需要某种后处理，或者元素列表无法一次性加载到内存中呢？这些都是现代编程中合理的考虑，而预定义的接口和
    PHP 标准库（SPL）可以协助解决这些问题。


    SPL 不仅可以帮助你处理简单的循环，还可以帮助处理其他问题，例如内存队列和文件处理。但 SPL 的基础是循环相关的，所以我们这里的大部分内容将在这个范围内。


    # spl_autoload_register()


    除了 `spl_autoload_register()` 外。在第 2 章中，我们在处理类时查看了自动加载。`spl_autoload_register()`
    函数允许你定义多个不同的自动加载函数，通过回调，这些函数都不需要 `__autoload()` 名称。自动加载函数只需要能够接收类名作为参数即可。此外，它们可以将任何可调用函数传递给
    `spl_autoload_register()`。


