    \ more precise way to do this is to define an alternate autoloader to handle that\
    \ scenario:\n\n![Image](images/86.jpg)\n\nHere, you created two methods in the\
    \ `Autoloader` class and registered them both with SPL. Now when you instantiate\
    \ a class that has not yet been defined, PHP will first call the `autoload()`\
    \ method and then check whether the class has been defined. If it has not, it\
    \ will call the `alternateAutoload()` method to autoload the class. After calling\
    \ all the registered autoloaders, PHP will throw a fatal error if the class has\
    \ still not been defined.\n\nSo this is a bit of a diversion from what SPL is\
    \ really all about. But because autoloading is a part of SPL, it is a necessary\
    \ one.\n\n# Countable\n\n`Countable` is an interface defined in the SPL. It lets\
    \ you directly provide information for the `count()` function when you pass an\
    \ object. Although it is likely better to build out this functionality and call\
    \ it directly instead of interfacing with internal functions (thus increasing\
    \ the ambiguity of your code), the `count()` function provides a good introduction\
    \ to how SPL works.\n\nWhen you normally work with an object and call the `count()`\
    \ function on it, it will simply return the value of 1:\n\n![Image](images/87-1.jpg)\n\
    \nRunning this code produces the following output:\n\n![Image](images/87-2.jpg)\n\
    \nGiven that the class is called `UserCollection`, it is clear that you are querying\
    \ a collection of `User` objects. In that case, do you really want to echo the\
    \ value of 1, or do you want to receive the number of users accessible via the\
    \ `UserCollection` class? If it is the latter, you can implement the `Countable`\
    \ interface and provide a direct integration point with the internal `count()`\
    \ function:\n\n![Image](images/87-3.jpg)\n\nThis code does not print 1 as before;\
    \ instead, it outputs:\n\n![Image](images/88-1.jpg)\n\nLet’s see what we meant\
    \ by `ambiguity` noted a little earlier. The `Countable` interface is useful as\
    \ an entry point to the SPL. In other words, it is a good, simple example. But\
    \ it adds ambiguity when you try to understand how the code calculated the value.\n\
    \nIf you know that you have defined a method called `count()` in your class, how\
    \ do you determine where that value is retrieved from? Using the `count()` function,\
    \ you have a hidden layer of abstraction that is not readily clear from the code.\
    \ In other words, in absence of any direct context (meaning that the class definition\
    \ is not apparent), which code is clearer?\n\n![Image](images/88-2.jpg)\n\nSo\
    \ `Countable` as an implementation detail can make your code less readable. But\
    \ that said, `Countable` is useful as a means of type hinting:\n\n![Image](images/88-2.jpg)\n\
    \nSo `Countable` as an implementation detail can make your code less readable.\
    \ But that said, `Countable` is useful as a means of type hinting:\n\n![Image](images/88-3.jpg)\n\
    \nSo `Countable` as an implementation detail can make your code less readable.\
    \ But that said, `Countable` is useful as a means of type hinting:\n\n# ArrayAccess\n\
    \n`ArrayAccess` is an interface defined in the SPL. It allows an object to be\
    \ accessed like an array. To implement it, you must define four methods: `offsetGet()`,\
    \ `offsetSet()`, `offsetUnset()`, and `offsetExists()`.\n\nHere is an example\
    \ of how to implement `ArrayAccess`:\n\n```php\nclass MyArray implements ArrayAccess\
    \ {\n    private $data = [];\n    public function offsetGet($offset) {\n     \
    \   return $this->data[$offset] ?? null;\n    }\n\n    public function offsetSet($offset,\
    \ $value): void {\n        $this->data[$offset] = $value;\n    }\n\n    public\
    \ function offsetUnset($offset) {\n        unset($this->data[$offset]);\n    }\n\
    \n    public function offsetExists($offset): bool {\n        return isset($this->data[$offset]);\n\
    \    }\n}\n\n$array = new MyArray();\n$array['name'] = 'John';\necho $array['name'];\
    \ // Outputs: John\n```\n\n# Iterator\n\n`Iterator` is an interface that allows\
    \ objects to be iterated over using `foreach` loops. To implement it, you must\
    \ define five methods: `rewind()`, `current()`, `key()`, `next()`, and `valid()`.\n\
    \nHere is an example of how to implement `Iterator`:\n\n```php\nclass MyIterator\
    \ implements Iterator {\n    private $items;\n    private $position;\n\n    public\
    \ function __construct($items) {\n        $this->items = $items;\n    }\n\n  \
    \  public function rewind() {\n        $this->position = 0;\n    }\n\n    public\
    \ function current() {\n        return $this->items[$this->position];\n    }\n\
    \n    public function key() {\n        return $this->position;\n    }\n\n    public\
    \ function next() {\n        $this->position++;\n    }\n\n    public function\
    \ valid(): bool {\n        return $this->position < count($this->items);\n   \
    \ }\n}\n\n$items = ['apple', 'banana', 'cherry'];\n$iterator = new MyIterator($items);\n\
    \nforeach ($iterator as $item) {\n    echo $item . \" \";\n}\n```\n"
