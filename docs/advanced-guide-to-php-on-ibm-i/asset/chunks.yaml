    # CSS Layouts


    We have so far covered CSS definitions for decorations. Now let’s look at a couple
    of examples for managing layouts: `display` and `float`.


    ## Display


    The `display` attribute has almost 20 different values. You can use it to make
    `<div>` tags behave as table cells or make a `<span>` act as an `<li>` element.
    But you will seldom need those elements; instead, you can rely on three different
    values to manipulate the display.


    The first is the `block` display. This is the default value for `<div>` or `<p>`
    tags, along with several others. It will start and end on a new line and will
    consume the entire width of the parent element, even if it does not fill the area.
    Even if you specify a `width` style to limit block in the `display`, it will still
    block out the entire width of the parent element.


    The second is the `inline` display. You can think of this as turning off the blocking.
    In other words, no new lines and no parent-width matching. This value is useful
    because it lets you define nodes within blocked areas and assign unique IDs to
    them (useful for script-based value replacements) or provide unique decorations
    such as italics, underlines, or background colors.


    The third is the `none` display. Setting a block element to `display: none;` will
    not affect the layout of the HTML at all. It will be as if the element is not
    there. Except that it is, and you can still modify its contents by using JavaScript.


    ![Image](images/182-1.jpg)


    This HTML page produces the output in [Figure 6.6](#010_Chapter06.html#fig6-6).


    ![Image](images/182-2.jpg)


    *Figure 6.6: Page rendered from HTML containing display element values*


    ## Float


    Sometimes, you will want to place content inline with text, such as images or
    other pieces of text. Using the `float` attribute, you can position elements in
    a block and have other content flow around it. The values you will typically use
    are `left`, `right`, and `none` (the default).


    Consider Shakespeare.


    ![Image](images/182-3.jpg)


    [Figure 6.7](#010_Chapter06.html#fig6-7) shows how the floated T is rendered.


    ![Image](images/183.jpg)


    *Figure 6.7: HTML output with floated T*


    ## Position


    The `position` property will provide lots of fun, and probably a fair amount of
    frustration when it does not do what you want it to. In addition to the default
    `static` value, we will examine three other values: `relative`, `absolute`, and
    `fixed`. The easiest way to demonstrate these is by modifying the `top` and `left`
    properties, which control positioning of an element within its frame of reference.
    The `top` and `left` properties will do nothing if you are using the default `static`
    position value.


    It might sound simplistic, but the use of the `relative` position can probably
    be best summed up as “nudging.” Although the `relative` value might have a more
    grand purpose at times, you will generally find it useful for moving things into
    line with other things when the alignment is not exact. This is because the `relative`
    position aligns the element with its parent block.


    To demonstrate the positioning elements, we will use this code as a base. The
    example code will modify the `DIV` with the class of `box`:


    ![Image](images/184.jpg)


    This code displays a `DIV` with a border, which has another `DIV` with a gray
    background ([Figure 6.8](#010_Chapter06.html#fig6-8)).


    ![Image](images/185-1.jpg)


    *Figure 6.8: Box with gray background*


    To demonstrate the relative position, we will modify `top` and `left` style elements.
    Let’s start by shifting it down and to the left by 10 pixels:


    ![Image](images/185-2.jpg)


    With the position set to `relative`, you can see how you offset the box ([Figure
    6.9](#010_Chapter06.html#fig6-9)).


    ![Image](images/185-3.jpg)


    *Figure 6.9: Using the relative position to offset the box downward*


    Negative numbers work too:


    ![Image](images/185-4.jpg)


    [Figure 6.10](#010_Chapter06.html#fig6-10) shows the resulting output.


    ![Image](images/186-1.jpg)


    *Figure 6.10: Using negative numbers to shift the box upward*


    Absolute positioning will position an element from the top of the document, not
    the view screen. So by setting an element with an `absolute` value, you can still
    scroll the document, but it will not be positioned in relation to its parent element:


    ![Image](images/186-2.jpg)


    This code prints out the result in [Figure 6.11](#010_Chapter06.html#fig6-11).


    ![Image](images/186-3.jpg)


    *Figure 6.11: Result of HTML with absolute positioning*


    Notice that the container `DIV` collapsed as well. This is because most block
    elements will expand and contract to hold content. The box `DIV` is not confined
    to the container `DIV` anymore, so nothing is pushing against the boundary of
    the container `DIV`.


    Fixed positioning is incredibly useful for pinning items to the screen, such as
    a toolbar or footer. It works exactly as the absolute position does until you
    start scrolling. The absolute positioned elements will scroll with the page, but
    the fixed positioned element will stay in place. That is because its measurement
    is to the viewport and not the document, like with absolute measurements.


    # JavaScript


    JavaScript is a rich and powerful language. To learn about the richness and depth
    of JavaScript, buy a JavaScript book. This book is about PHP.


    But still, if you are doing web development, you will need to know some JavaScript.
    From a development perspective, JavaScript lets you run programming logic on the
    browser. You will generally use this language to manipulate the HTML Document
    Object Model, or DOM, to give users a more responsive and interactive experience
    with your application. But you can do a lot more, including running JavaScript
    on the server. For the purpose of our discussion here, we will focus only on the
    basics and how they relate to web design.


    You can embed JavaScript into a page on a web application in two ways. The first
    is by directly embedding it:


    ![Image](images/187.jpg)

