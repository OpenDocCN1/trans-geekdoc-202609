    Because ACL permissions are sometimes stored in the direct key value and sometimes
    stored with the key value plus the permission setting, the `hasPermission()` method
    could not simply check `$this->data[$resource]` to determine whether the user
    had permission to access that resource. For that reason, you iterated over the
    object to find any appropriate keys, hence the need for the `Iterator` object.


    # ArrayObject


    As interesting as the `Iterator` interface is, it is best not to use it directly.
    You might have noticed that the previous example included a lot of boilerplate
    code, and the last thing you want to do is spend a vast amount of time writing
    code over and over and over again. The benefit of the `Iterator` interface, as
    well as several of these interfaces, is realized through the use of type hinting.


    Frequently, you do not care exactly what type the object being passed is, but
    you want to ensure that object has some kind of iterative functionality. You can
    define the method parameter to require an `Iterator`, and the Zend Engine will
    validate that the provided value is an iterable object.


    So if the `Iterator` is not much help to you, what should you use? The `ArrayObject`
    class is probably the best place to start from a practical standpoint. The previous
    example is still not quite complete. It is missing another class definition—the
    `Session` class:


    ![Image](images/98-2.jpg)


    The `ArrayObject` class implements the `IteratorAggregate`, `Traversable`, `ArrayAccess`,
    `Serializable`, and `Countable` interfaces. It basically handles all the boilerplate
    code that you wrote by hand earlier. In fact, each of the classes that you manually
    wrote would most likely be better written by extending `ArrayObject` instead of
    using the interfaces.


    The `Acl` class would also be better written by using `ArrayObject`. It is providing
    basic iterator access and, as such, has no need for any boilerplate code in the
    class:


    ![Image](images/99.jpg)


    This code works exactly as the code in the prior sections of this chapter, but
    with about 25 fewer lines. The point of this section is to show what is happening
    beneath the `ArrayObject`, but you will seldom need to use it directly. So do
    not use the code from the previous sections. Sorry about that.


    # Advanced Usage


    You might be wondering why the SPL classes are any use at all. The first reason
    is that they eliminate boilerplate code. “But why not just use arrays? They contain
    no boilerplate code!” you might say.


    And you would be right. But arrays are basic things. They do not contain typing,
    and using external value checking can be cumbersome. One big benefit of object-oriented
    programming is that it lets you group functionality and data together.


    # Intercepting Inserts


    In this example, you define a class that has a list of properties that validate
    an object before loading that information from the database. However, you want
    to make only certain properties available:


    ![Image](images/100.jpg)


    The class defines a series of valid options. You override `offsetSet()` because
    that is where PHP integrates with the class when you set array values. So when
    you start adding values to the properties array, you do so like this:


    ![Image](images/101-1.jpg)


    Running this code throws an exception when you try to set the value for email:


    ![Image](images/101-2.jpg)


    # Typing Array Values


    The previous example showed how to validate the keys that are set on an individual
    object that is acting as an array. This validation technique definitely has its
    uses, but its other uses are probably more pertinent to your everyday programming
    life.


    One such example is the ability to validate the types for the members of an array.
    Say you have an array of users that your application needs for some purpose. In
    this case, you validate each item when you iterate over it. But doing so means
    you must remember to do that validation every time you iterate over the array
    items:


    ![Image](images/101-3.jpg)


    Because no type checking happens before running this code, you do not know whether
    the array will have a `User` object or a `Website` object. So, you need to add
    this boilerplate code to make sure that the objects you receive are the ones you
    are expecting. The code is boilerplate not because of the `instanceof` check you
    need to do, but because you need to do that check for each place in your code
    that uses one of these user arrays.


    A more elegant solution is to create a class that will do the validation for you,
    instead of putting the validation in each location:


    ![Image](images/102-1.jpg)


    Only instances of `User` will be added by using this code. In this case, it will
    fail silently if an object is passed that is not the `User` type. However, at
    the end of the method declaration, you can easily throw an exception if invalid
    data is provided.


    Having defined the new collection object, you can now simplify the function by
    removing the type check in the loop and by declaring that the parameter must be
    a `UserCollection` object:


    ![Image](images/102-2.jpg)


    # Lazy Loading


    The final example we will look at is lazy loading. Sometimes, either a significant
    amount of data or a significant amount of processing is required to accomplish
    a task. But if the data or processing is necessary across an application, it might
    not be possible to optimize the logic if it must be processed ahead of time. This
    example requires a little imagination. Often, some of these scenarios contain
    a fair amount of complexity, and writing it out exactly would probably make it
    less comprehensible in book form. Consider the following example:


    ![Image](images/103-1.jpg)


    Here, you set values for important global values. But the problem is, these values
    are all loaded at the front of the request, and they are loaded each time. Normally,
    this is a bad practice. You should encapsulate everything in an object instead
    of loading it at the front. But this scenario is not unheard of in older applications.
    So not only is this a bad practice, but its implementation will be sprinkled throughout
    the application as well. And to make it work would require a lot of refactoring.


    The better approach is to have this functionality load lazily instead:


    ![Image](images/103-2.jpg)


    Basically, the functionality required is executed only when it is requested. In
    the first example, if you wanted to retrieve the system information, all five
    function calls would be made if you needed only one piece of data. But because
    the example now uses `ArrayObject`, it can simply replace the `$config` array
    that you defined earlier without having to refactor the dependent code.


    # Conclusion


    These examples constitute a small but important step into the world of the SPL.
    You can take what you’ve learned here and start working with other components
    in the SPL, such as `CallbackIterator`, `DirectoryIterator`, or even `SplPriorityQueue`.
    The SPL originally began as a means of providing object hooks into the Zend Engine
    and has grown from there. Most new frameworks will use SPL-based classes to implement
    various pieces of internal functionality, much of which can save you from spending
    a lot of time writing a bunch of repetitive code. And because a good programmer
    is a lazy programmer, that is a good thing.


    #  Debugging Basics


    Debugging is one of the most crucial tasks that developers do during the course
    of their day. But sadly, many developers’ view of debugging is this:


    ![Image](images/105.jpg)


    Not only is this a relatively common technique, but it is wrong. So very wrong.


    *   It does not provide a context (meaning it does not provide the values of other
    variables).


    *   Its usefulness decreases in scenarios where `$var` becomes more complex.

