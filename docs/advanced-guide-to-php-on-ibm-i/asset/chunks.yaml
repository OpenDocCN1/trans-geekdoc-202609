    首先，该方法会检查 `HTTP_ACCEPT` 是否已设置。如果未设置，该方法将保持默认版本。如果 `HTTP_ACCEPT` 存在，该方法将在 `/services`
    目录中搜索不同的 API 版本。这些版本将用作过滤器。由于 `Accept` 头部可能包含多个由逗号分隔的值，因此你对其根据逗号进行拆分（explode），过滤掉除版本号以外的所有内容，然后将找到的版本与之前的任何版本进行比较。你总是希望使用最新版本的版本，因此要检查找到的版本是否大于之前发现的任何版本。如果你确实找到了有效版本，将
    API 版本设置为该版本。


    要激活此检查，你需要将 `processApiVersion()` 的调用添加到 `handle()` 方法的前部。然后，将内容类型从 `application/json`
    更改为适当的 `vnd` 类型：


    ![Image](img/262.jpg)


    让我们看看当针对此功能检查各种 `Accept` 头部时，它看起来是怎样的样的。


    ### 首先，没有 API 版本：


    ![Image](img/263-1.jpg)


    现在，是之前的 API 版本 1.0：


    ![Image](img/263-2.jpg)


    注意日期的格式不同了吗？


    接下来，你将使用两个不同的 API 版本进行测试：


    ![Image](img/263-3.jpg)


    如你所见，尽管提供了两个 API 版本，服务器提供了两者中较新的一个。


    但你应该使用哪种方法呢？API 中的版本？自定义 HTTP 头部？还是 `Accept` 头部？选择其中一种会让你赢得一群人的赞誉，但会遭到另一群人的冷嘲。


    结论是这样的：你可以在网上搜索并找到关于哪种方法最好的不同意见。大多数计算机科学纯主义者会推崇后者，即在头部中使用内容协商和版本协商来追求他们编程的彼岸境界。这有其恰之处。计算机是技术设备，当事情处理得恰当、静态且可预测时，技术设备往往运行得更好。然而，计算机是由人编写的，而人并不是恰当、静态或可预测的。


    请留意你的受众。如果你编写的 API 是为了那些知道如何遵循规则并且对客户端有完全控制权的人，那么请尽管采取纯主义路线。但如果你不是，或者你正在为高速开发者社区构建服务，那么请考虑开发迭代或增加你
    API 的实用性。


    纯主义者会声称，如果你不正确使用超媒体（hypermedia），世界将自我毁灭，但这并非事实。无论如何，程序员们总有一种奇妙的方法使用定义不当的 API。决定人们是否会使用
    API 的是它的实用性，而不是格式的纯洁性。无论对错，易用性几乎总是胜过纯洁性。


    但记住，如果你选择了快捷简便的路径，它将永远主宰你的命运。


    ### 内容协商


    在继续之前，我们还有一个与版本相关的话题需要涵盖：内容协商。为了准确起，你的 API 还应该定义一种内容类型，该类型可以作为 `Accept` 头部的一部分被请求，并作为
    `Content-Type` 头部的一部分返回。你通过在请求末尾添加加号（`+`）来实现这一点。


    在上一个示例中，你修改修改请求允许 API v1.1 使用 JSON 或 XML，但仅对 v1.0 允许 JSON：


    ![Image](img/264.jpg)


    虽然 `Accept` 头部变得更长，但使用这种方法让开发者不仅可以定义他们可以处理的 API 版本，还可以定义响应类型。然后，作为你输出渲染方案的一部分，你不会直接指定
    `json_encode()`；相反，你会对请求的内容类型进行测试，并通过一个可以用你的 API 定义允许的任何方式渲染它的机制对其进行过滤。


    当你的服务完成渲染后，它看起来像这样：


    ![Image](img/265.jpg)


    ### 认证


    当你的服务完成渲染后，它看起来像这样：


    在认证时，涉及到两个组件。第一个是身份（identity），第二个是认证（authentication）。身份是说明“我是谁”，而认证是说明“我如何证明我是我”。由于该密钥是共享的，因此在不希望公开数据的情况下，API
    密钥是安全的。为了不让数据公开，API 令牌。开发者通常通过查询字符串中提供令牌或使用 HTTP 头部来提供身份。Basic 认证也是接受的，但它需要用户名和密码。然而，为了验证身份，你需要创建一个会话。


    ### 基于会话的认证


    一种常见的认证方法是创建一个会话。在身份验证后，一个会话 ID（session ID）会被返回给客户端，客户端需要记住这个会话 ID。我们来看这个用于认证的示例：


    ![Image](img/266-1.jpg)


    让我们创建一个处理认证的服务类：


    ![Image](img/266-2.jpg)


    为了进行认证，客户端需要调用 `/auth/login` 并 POST 一个 JSON 文档 `{"token":"4ca238a0b9232cc9a6f7584"}`。创建一个适当
    SQL 查询来检查数据库，如果找到了结果，则启动会话并将 API 密钥添加到会话中。连接到此方法需要类似这样的 HTTP 请求：


    ![Image](img/267-1.jpg)


    这是结果：


    ![Image](img/267-2.jpg)


    注意会话 ID 已设置。客户端需要在后续请求中使用它。


    看一下当你发送一个无效的令牌时会发生什么：


    ![Image](img/268-1.jpg)


    此令牌比之前的令牌短了一个字节，因此它与你数据库中的内容不匹配：


    ![Image](img/268-2.jpg)


    结果为 false。同时也注意没有发送会话 ID。


    ### 无会话的认证


    要求 API 提前登录会为 API 调用增加大量的开销，以及消费者侧的逻辑负担。一方面，服务器必须同时进行认证和跟踪消费者。此外，消费者必须跟踪会话并在会话过期时处理回退。这不是一种很好的做法。那么你该怎么办？


    一个很好的选项是通过共享密钥使用某种形式的签名机制。这是某些认证机制（如 OAuth 1）的基础，这些机制标准化了签名机制。在我们最后一个示例中，我们不会使用
    OAuth，而是将其作为灵感。


