- fmt: '

    1. Validate the HTTP Referer header for important requests. An attacker can attempt
    to spoof this in JavaScript, but most (if not all) browsers will overwrite whatever
    value the attacker sets.

    2. Limit the session length for logged-in users. Doing so reduces the time window
    in which a forgery attack can take place.

    3. Force authentication before executing important actions. Be judicious with
    this tactic, however. You might soon get into discussions of where to draw the
    line between security and convenience.

    4. Require important actions to be submitted via POST. If your application allows
    those actions via a `GET` request, a simple fake image URL on some page somewhere
    might be enough to exploit it. Submitting actions via `POST` will not prevent
    an attack, as you can still construct a `POST` by using JavaScript. But this technique
    does restrict the attack vector so that image URLs, which will be less restricted
    on third-party sites, cannot be used in the attack.

    5. Use a token value to validate that a request came from the expected website.


    Let’s dive into number 5, as it requires some explanation. A cross-site request
    forgery is just that: cross-site. Because it is cross-site, the offending website
    will most likely be unable to learn about all the data on a given page since the
    browser will not allow it. Therefore, you can use a technique that relies on hidden,
    shared information between the browser and the website.


    That information is a random token or a nonce (number used once). Several websites
    that discuss cross-site request forgeries use the function `uniqid()` to generate
    a token.


    The problem is that although `uniqid()` will generate a (mostly) unique ID, it
    will not be random. The function `openssl_random_pseudo_bytes()` is a much better
    choice:


    ![Image](images/144.jpg)


    The code first checks whether a token exists in the session and whether that token
    has expired. The expiration time is set here for 10 minutes. If the token does
    not exist or it has expired, a new token is generated by using `openssl_random_pseudo_bytes()`,
    and it is hashed with the `hmac_hash()` function by using the `sha256` algorithm.
    Often, people use `md5()` or `sha1()` to hash these values. MD5 is considered
    cryptographically broken, and SHA-1 causes some furrowed brows. So most security
    researchers recommend the SHA-2 family of algorithms (SHA-128, SHA-224, SHA-256,
    SHA-384, SHA-512). For that reason, the example uses the `sha256` algorithm.


    If the request is a `GET` request, you bypass the check and write the form to
    the output buffer, embedding the token in a hidden field in the form. When you
    submit the form, you check to see whether the token matches the one you stored
    in the session. If they match, you are good; if they do not match, you issue an
    error message. At the end of the request, delete the token from the session so
    it will not be reused.


    # Session Fixation


    The PHP session ID is relatively difficult to guess. It is doable, but you need
    to know the person’s IP address, the time and microtime the session was created,
    and some modest random number generation. Knowing one or more of these variables
    can increase your chance of guessing the session ID.


    But why would you try to guess that when you can simply send this link to an unwary
    individual?


    ![Image](images/145.jpg)


    Before PHP 5.3, the default value for the `ini` setting `use_only_cookies` was
    off. Therefore, PHP would consider the query string as a mechanism for determining
    the session ID.


    Why does this matter?


    Consider this scenario. The attacker goes to a popular website. The website issues
    a session ID. The attacker sends a link with that session ID to an unsuspecting
    victim who links to the popular website. That person logs in. Whose browser will
    PHP consider the authoritative browser?


    Answer: both. PHP (or most languages, for that matter) does not use the IP address
    as a determining factor for validating the session ID. What would happen if that
    session was behind a proxy that had multiple IP addresses that the session used?
    legitimate traffic could be blocked. So the session ID is not taken into consideration.
    Now both the attacker and the victim are the victim’s user, and both can act on
    behalf of the victim.


    The query string is not the only possible attack vector. If the site is also vulnerable
    to cross-site scripting attacks (technically, JavaScript injection, but the protection
    is the same), an individual can set the session of anyone on that site to a predetermined
    session ID simply by putting this code somewhere on a page:


    ![Image](images/146.jpg)


    Protecting your users is relatively trivial. Anytime your users log in, you make
    a call to `session_regenerate_id()` before making changes in the session. Calling
    this function will issue a new session ID to the user.


    # Session Hijacking


    Session hijacking has a similar effect as session fixation, but the implementation
    is different. With session fixation, victims are tricked into setting their session
    ID to a predetermined value. In this case, the attacker is pulling a user’s session
    ID and then pretending to be that user.


    The session ID can be obtained two primary ways:


    1. Pulling it off the air or wire; for unencrypted traffic, it is easy to sit
    on a network (wired or WiFi) and watch for unencrypted HTTP traffic

    2. Exploiting a cross-site scripting vulnerability on the site


    The first technique is beyond the scope of this book, so we will not address it.


    Attacking a site that is vulnerable to cross-site scripting makes retrieving the
    session ID easy. If the attacker has access to an existing server (presumably
    through nefarious means), he or she could embed some simple JavaScript code on
    a page that sends the session ID to the remote server where it can be gathered.


    The code to do this is simple:


    ```

    ![Image](images/147-1.jpg)

    ```


    This code will use a cross-site scripting vulnerability to send all of the cookies
    for the site to a remote site, where the attacker can then use that data to pretend
    to be the user.


    You can protect your users against this type of attack by consistently calling
    `session_regenerate_id(true)`. However, if you are vulnerable to cross-site scripting,
    that is something to address first. Adding the value `true` to the first parameter
    in the function call means that PHP will remove the last session ID, thereby minimizing
    the probability of exploitation.


    # Validating Input


    Remember that you can break down all these vulnerabilities into four words: validate
    input, filter output. Validating input involves more than just databases. It can
    refer to program logic as well. Filtering output largely consists of making sure
    that the browser is not being leveraged, which many of the previous scenarios
    already covered. However, validating input does not always fall into easily definable
    categories.


    One way that developers will build a basic templating system is by creating a
    generic home page and then accepting a value from the query string to determine
    the specific content to include. Although it is a somewhat primitive form of content
    management, using this mechanism is fine. The implementation, however, can definitely
    cause problems.


    In this example, you will have a directory called `/scripts` from the document
    root and an `index.php` file in the document root:


    ```

    ![Image](images/147-2.jpg)

    ```


    The code here will include any file that the `$_GET[''page'']` variable specifies.
    This attack is really fun on Linux® because everything is available on the file
    system. It is fun on the integrated file system (IFS) as well because, although
    it does not include the full system, it does have a lot of interesting files.
    One of the easiest ways an attacker can find these files is via the web server
    configuration file at `/www/zendsvr/conf/httpd.conf` or the log files in `/www/zendsvr/log`.

