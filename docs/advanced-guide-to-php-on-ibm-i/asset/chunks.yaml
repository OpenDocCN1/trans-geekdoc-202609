    The problem with this example is that both traits have a method called `toXml()`.
    So the question is, which method do you use? This is not something you can define
    based on the context. In other words, you cannot ask for the method from `Util\DOMDocument`
    in one place and ask for the one from `Util\ToXml` in another place. This is defined
    at the class level.


    Here is the code for `Util\DOMDocument`:


    ![Image](images/20-3.jpg)


    Like the `UtM\ToXml` trait, this code returns XML in the `toXml()` method, but
    it adds a separate method that does this through the use of the `DOMDocument`
    core class instead of `SimpleXML`. You then add this trait to the `Filesystem\File`
    class:


    ![Image](images/21.jpg)


    But now when you run the script, you receive an error:


    ![Image](images/22-1.jpg)


    So you must rectify the collision. To do that, you use a little-known operator
    called `insteadof`. Its use is fairly simple:


    ![Image](images/22-2.jpg)


    You have now resolved the collision, and the code will run as expected.


    # Closures


    Closures are not object-oriented programming in a pure sense. They are functions,
    but they have an OOP-based implementation. However, I include them in this chapter
    for two reasons. The first is simply that there is no other place to put them
    in this book. (An additional chapter on functions would not add much to the book.)
    The second reason is that closures are generally used in more-mature architectures,
    and more-mature architectures tend to be object driven. Yes, you could argue against
    that quite easily—strings aren’t objects either, and they’re used more often than
    closures in mature architectures. True, but I’m the author and I get to choose
    what I put where.


    A closure has another name that might make it a little easier to understand: anonymous
    function. As you might surmise, an anonymous function is not named. When defining
    a method in a class, you give it a name such as `getThis()` or `setThat()`. A
    closure is not bound to a class; it is bound to a variable.


    Defining a closure is simple. Instead of giving the function a name, assign it
    to a variable. When you want to call the function, call the variable as if it
    were a named function:


    ![Image](images/23.jpg)


    This, as expected, outputs:


    ![Image](images/24-1.jpg)


    So what is the point of doing something like this? First, beware of overuse. It
    is easy to go overboard with the usage of closures. Defined OOP structures are
    preferable. This is particularly true from a testing perspective. However, closures
    are most often used simply as callbacks. They are incredibly useful for one-off
    bits of defined functionality. Let’s look at a function-based example first and
    then a more detailed object-oriented one.


    For the first example, you will use the `array_walk()` function to change all
    the values of an array to upper case by using `strtoupper()`. You typically do
    this by iterating over the values in an array:


    ![Image](images/24-2.jpg)


    Simple enough and it does the job. You can do the same thing as a closure:


    ![Image](images/24-3.jpg)


    The preceding example calls the function `array_walk()`, with the first parameter
    providing the array and the second parameter providing a callback, in this case
    a closure, which will be called for each member of the array.


    So far so good. But now presume that the array is multidimensional. Rather than
    typing the solution the way you would in your own code, look at the original `foreach()`
    loop and consider what you need to do. You can even write the code for handling
    the recursion, if you like. Or if you are a sadist.


    Got that in your mind? It probably is not pretty.


    Good. Now let’s examine an example that changes an array’s values to upper case
    by using a closure:


    ![Image](images/25.jpg)


    Simple.


    So you see how closures can benefit you, but let’s examine how you can use them
    in an OO context. It is not different from using them in a procedural context,
    but OO provides you a few more things to use.


    The first is that, though you might not know it, a closure is actually an instance
    of a class named, wait for it, `Closure`. So when you write code like the following:


    ![Image](images/26-1.jpg)


    ```

    $fnc is an instance of the class Closure

    ```


    Don’t believe me? Verify it with code:


    ![Image](images/26-2.jpg)


    Running this code produces the following:


    ![Image](images/26-3.jpg)


    This is a special class for use as an implementation detail for closures. It implements
    the `_invoke()` method—a magic method added in PHP 5.3 that lets developers invoke
    an instance of an object as a method, which is exactly what you are doing here.
    A couple of changes are made internally in the Zend Engine for this special instance
    but, mainly, closures are implemented by using existing internal functionality
    that is available to anyone.


    Although closures are good for doing simple one-off callbacks, they do provide
    more value than just that. Closures can also carry data along with them via the
    `use` keyword. This keyword lets you inject data into the closure from within
    the current scope of its definition:


    ![Image](images/26-4.jpg)


    Here, `$who` is global and the closure is not. By not importing `$who` with the
    `use` keyword when you run this code, you would receive an ENOTICE warning because
    `$who` would not be defined in the current function scope. With `use`, you can
    provide context data for the closure to use.


    What happens, though, if you define both a `use` variable and a parameter of the
    same name? You might use this technique as means of providing a default value
    with the “used” variable should the closure call not include a parameter.


    However, that is not how it works. Look at the following example:


    ![Image](images/27-1.jpg)


    This code outputs:


    ![Image](images/27-2.jpg)


    So in the war of “used” variable versus parameter, the used variable wins.


    That concludes our look at basic OOP. In the next chapter, we will move from the
    realm of features into the realm of theory.


    ![image](images/line.jpg)


    [¹](#005_Chapter01.html#fn-1) Technically, according to good OOP design, the individual
    breeds should probably be extended class definitions (e.g., `Corgi extends Dog`
    as does `Shepherd`, and so on).


    [²](#005_Chapter01.html#fn-2) Although this code works, it is generally considered
    a bad practice to mix class definitions and executable code. This example is for
    demonstration purposes only.


    # 2


    # Design Patterns


    Now let’s move from concrete object-oriented implementations to some more abstract
    concepts, beginning with design patterns. Design patterns have been all the rage
    for the past several years, and who has not felt a little unsure of themselves
    when someone says, “You don’t know what the Memento pattern is?” In all honesty,
    I do not. I pulled it out of the air from Wikipedia (see [http://en.wikipedia.org/wiki/Memento_pattern](http://en.wikipedia.org/wiki/Memento_pattern)).*


    Although many design-pattern proponents are annoying, understanding and implementing
    design patterns can provide a lot of benefits, particularly some of the design
    patterns I present here. You can think of these as base patterns.


    A design pattern has absolutely nothing to do with software. It is an architectural
    process first brought into form by architect Christopher Alexander. It states
    that patterns of design are inherent in many different instances. In other words,
    project A and project B, though completely disparate in every way, can still have
    similarities in design because of similar problems that need to be solved.

