    Now we move from one-way hashing to two-way encryption. You use hashing when you
    do not want to store (or you are not supposed to know) the value you are working
    with. You use encryption when you need data returned, like a credit card number.


    The simplest form of encryption (that you should use) is symmetric key, or shared
    key, encryption. With symmetric key encryption, two parties share a key to both
    encrypt and decrypt content. Asymmetric encryption is when one key decrypts content
    and another key, usually based on the private key, encrypts the document. We will
    not look at asymmetric encryption simply because you will probably not use it.
    In fact, HTTPS, which uses asymmetric encryption, only does so to pass the symmetric
    key to a browser (see “The Security of the Bazaar” at [http://readwrite.com/2013/09/19/keys-understanding-encryption](http://readwrite.com/2013/09/19/keys-understanding-encryption)).


    The most likely method you will use for encryption and decryption is the `mcrypt`
    library. You implement encryption via the `mcrypt_encrypt()` method:


    ![Image](images/159.jpg)


    In this case, you have a value stored in `$value` and a shared key stored in `$key`
    (which will be shared among endpoints) that you will use to encrypt the data.


    The first parameter is the cipher to use. The ciphers will start with the prefix
    `MCRYPT_`. The most common (based on my experience and not any hard data) are
    `MCRYPT_3DES`, `MCRYPT_BLOWFISH`, `MCRYPT_RIJNDAEL_128`, and `MCRYPT_RIJNDAEL_256`.


    I am not a cryptographer and am not well qualified to discuss the ins and outs
    of various encryption mechanisms. Generally, though, the higher the number the
    better. Triple DES is better than DES. Rijndael-256 is better than Rijndael-128.
    This is definitely not a hard-and-fast rule, but because the numbers in a cipher
    will typically refer to the key size, this is usually true. And the larger the
    key size, the more complex the encrypted value will be.


    Additionally, when determining which cipher to use, you should check out the NIST’s
    Advanced Encryption Standard, or AES. AES is used as the means to encrypt sensitive
    government information. Many different designs were submitted to the NIST; the
    one that eventually won was the Rijndael cipher, and the standard is a variant
    of that. The variance is that the block size is restricted to 128 bits, whereas
    the Rijndael cipher can support virtually any bit size that is a multiple of 32
    bits.


    The second value is the shared secret key. As the `php.net` manual says, this
    value generally should not be an ASCII string; it should be a random string that
