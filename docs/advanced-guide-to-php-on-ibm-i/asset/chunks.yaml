    尽管这两种模式在多种编程语言中都很常见，但你在 PHP 中可能最常用的模式是发布/订阅模式（Publish/Subscribe），或简称 PubSub。这是因为在之前的两种模式中，在运行它们之前必须先实例化对象。如果一个应用程序较小且依赖项较少，这并不是什么大问题。然而，对于较大的应用程序，所有这些对象的实例化可能会消耗大量的计算周期。PHP
    在请求之间不会保留状态，因此，为了自定义响应而进行的对象实例化可能会成为负面影响。


    然而，PubSub 模式并不一定要求通过实例化对象来注册自定义项。PubSub 是定义多个组件之间解耦依赖的一种。如果你使用过 RSS 或 Atom 馈送，那么你已经用过
    PubSub 了。馈送被发布，而你作为订阅者，可以根据自己的需要处理结果。


    尽管 PubSub 用于分布式计算（这正是 RSS 的作用），但它在内部对于应用程序组件之间来回传递消息也非常有用。与其订阅不同机器或服务上的发布者，不如订阅应用程序内部的各种事件。你订阅的不是对象，而是事件。这让你可以在不需要对观察者和被观察者都进行具体实现的情况下定义你的订阅。


    实现这种设计模式涉及构建一个事件管理器（或使用第三方产品）来处理并实例化订阅者。通过使用这种机制，你可以通过配置或编程方式定义哪些订阅者订阅了哪些事件。由于你可以对此定义进行配置，你可能不需要实例化
    `Subscriber` 类，从而让你高效地定义组件之间的关系。


    虽然使用第三方事件管理器更好，因为这样可以减少维护的代码，但这个简单的示例展示了 PubSub 模式在应用程序内部如何工作的机制：


    ![Image](img/42.jpg)


    在这里，你有两个重要的方法。第一个是 `addSubscriber()`，它向事件管理器注册订阅者。你所做的是将订阅者添加到以事件名称为键的数组中。


    第二个方法 `dispatch()` 接收两个参数。第一个参数是你想要派发的事件名称。`addSubscriber()` 的参数应该与传递给 `dispatch()`
    的内容匹配。


    方法的第二个参数是要传递给订阅者的目标列表。请注意，发布者必须决定将哪些目标传递给订阅者。这意味着发布者可能不会将自己作为目标提供给订阅者，或者可能不提供任何目标。通常，发布者至少提供自己作为一个目标是一个良好的做法，但并不是强制要求的。


    接下来，你需要定义两个类：`Publisher` 和 `Subscriber`：


    ![Image](img/44-1.jpg)


    `Publisher` 类中定义了一个名为 `save()` 的方法。该方法执行了它所需的所有内部处理。然后它获取 `EventManager` 对象。


    你现在定义了你的类，但还没有执行任何逻辑。你的第一个任务是为 `Publisher` 对象将派发的事件在事件管理器中添加一个订阅者：


    ![Image](img/44-2.jpg)


    请注意，尽管你定义了对 `publisher-save` 事件的订阅，但你还没有分配一个实例化的类。因此，在事件触发之前，你不会产生实例化所有订阅者的开销。在此时点，你已经配置了
    `EventManager` 来处理该事件，因此你可以执行你的逻辑：


    ![Image](img/45-1.jpg)


    调用这段代码将产生以下输出：


    ![Image](img/45-2.jpg)


    `Saving…` 是从 `Publisher` 调用的，而 `Saved` 是从 `Subscriber` 调用的。因此你可以看到如何通过发布/订阅设计模式，以轻量级的方式将来自多个不同上下文的多个不同对象松耦合。


    # 前置控制器 (Front Controller)


    在最初构建 PHP 应用时，你可能使用了典型的文件-URL 映射（`http://localhost/list.php` 映射到 `{document root}/list.php`）。如果你有一个受保护的区域，它会被映射到
    `{document root}/protected.php`。


    前置控制器模式通过强制所有请求通过一个中心点来解决这些问题。前置控制器通常依赖于 Web 服务器来分发请求，这类似于使用 Apache 的重写。一旦你将请求路由到
    `index.php`，下一步该做什么？为了解决这些问题，前置控制器设计模式在 99.9% 的情况下是作为模型/视图/控制器 (MVC) 应用程序的一部分，路由到相应的控制器并协调许多其他事务。尽管如此，MVC
    并不是前置控制器的要求。


    ![Image](img/46-1.jpg)


    ![Image](img/46-2.jpg)


    ![Image](img/45-3.jpg)


    当你使用 Apache 时，典型的重写规则会像如下代码：


    ![Image](img/45-2.jpg)


    ![Image](img/45-1.jpg)


    ![Image](img/44-2.jpg)


    ![Image](img/44-1.jpg)


    ![Image](img/42.jpg)


    ![Image](img/47-1.jpg)


    ![Image](img/47-2.jpg)


    ![Image](img/48.jpg)


