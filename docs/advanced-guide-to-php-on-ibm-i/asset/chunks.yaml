- fmt: "\nSo why go through all this effort to do what Apache basically does? The\
    \ reason is that this example does not demonstrate the full capabilities of the\
    \ `Front Controller`. Because the `Front Controller` is always executed, you can\
    \ build logic into it to solve some of the issues mentioned earlier. One of those\
    \ problems was how to ensure that you are always authenticating for the admin\
    \ area, without having to constantly inject authentication code (which might change)\
    \ into the mainline execution.\n\nTo solve that problem, you will pull some logic\
    \ from the `EventManager` class that you built in the section on Publish/Subscribe.\
    \ Let’s look at the `Front Controller` with the `EventManager` support built in:\n\
    \n![Image](images/49.jpg)\n\n![Image](images/50.jpg)\n\n![Image](images/51.jpg)\n\
    \nHere, you are dispatching a number of different events from the URL being requested,\
    \ which lets you write a subscriber that can hook in at generic, semi-generic,\
    \ or specific places in your application. A URL of `http://localhost/admin` will\
    \ have three events dispatched: `predispatch` (generic), `predispatch_admin` (semi-generic),\
    \ and `predispatch_admin_index` (specific). For a URL of `http://localhost/admin/logout`,\
    \ the events are `predispatch` (generic), `predispatch_admin` (semi-generic),\
    \ and `predispatch_admin_logout` (specific).\n\nNow you can inject a subscriber\
    \ into the request without having to modify any mainline code. In this case, you\
    \ will add a subscriber at `predispatch_admin` so you can validate all incoming\
    \ requests to ensure that they are coming from a logged-in administrator:\n\n\
    ![Image](images/52.jpg)\n\nThis example checks each request being processed under\
    \ `http://localhost/admin` to verify that the request is logged in as an administrator,\
    \ except for the pages `/admin/login` and `/admin/logout`. Those pages are places\
    \ where an unauthenticated user should be.\n\nSo even if you were using a traditional\
    \ PHP model of execution, you can see how using the `Front Controller` design\
    \ pattern lets you inject bits of functionality at arbitrary places in the request\
    \ without modifying any prior code.\n\n# Model/View/Controller\n\nMany books have\
    \ been written about Model/View/Controller, so we will take only a brief look\
    \ at it here. MVC existed on the desktop for several years, but the framework\
    \ took the web world by storm when Ruby on Rails implemented it and developers\
    \ found a level of productivity that they previously had not seen. Of course,\
    \ as with most simple assertions, that is not quite true, but it is close enough\
    \ to the truth to be considered accurate.\n\nUp until Rails came along, most web\
    \ applications were basically the WordPress type of script. I am not knocking\
    \ WordPress as a phenomenon, but I doubt that anyone would subscribe to the argument\
    \ of *WordPress is a great architecture.* I am a fan of WordPress, but the architecture\
    \ that it is implemented with does lack a certain elegance. Though, truth be told,\
    \ most software lacks elegance. Half the time, if “elegance” is a feature, it\
    \ probably is not useful.\n\nMVC allows for an easier separation of concerns——the\
    \ practice of designing an application with distinct components grouped around\
    \ similar functionality. With MVC, those concerns are data access/processing,\
    \ interface management, and request dispatching. This means that data access or\
    \ processing is grouped with other “model” components; a UI component is grouped\
    \ with other “view” components; and dispatching, brokering, or setup actions are\
    \ grouped into individual “controller” components. Using MVC gives us a much cleaner\
    \ application that has no HTML in the data access classes, no complex business\
    \ logic in the dispatching classes, and no logical functionality in the UI scripts.\
    \ This strong separation not only makes the application cleaner but also much\
    \ more testable. As such, it serves at minimum as a good example of how to build\
    \ an application.\n\nUsually, a diagram such as the one in [Figure 2.2](#006_Chapter02.html#fig2-2)\
    \ is used to describe the MVC architecture.\n\n![Image](images/54.jpg)\n\n*Figure\
    \ 2.2: Typical diagram that describes the MVC framework*\n\nThis diagram is as\
    \ clumsy as it is stupid. It does not tell us anything about MVC. Rather than\
    \ try to come up with another unwieldy diagram, let’s try a less awkward set of\
    \ responsibilities.\n\n*   **Models**\n    *   Responsible for loading data and\
    \ implementing business logic\n    *   Do not directly access the database\n \
    \   *   Do not initiate new logic except to handle dependent logic\n    *   Do\
    \ not render content\n*   **Controllers**\n    *   Responsible for initializing\
    \ models and instructing them what to do (including validation)\n    *   Indicate\
    \ which UI element(s) to load and which data is available to them\n    *   Never\
    \ directly call the database\n    *   Never directly output output\n*   **Views**\n\
    \    *   Responsible for handling browser output\n    *   Do not implement logic\
    \ beyond rendering logic\n    *   Do not directly access the database\n    * \
    \  Do not manipulate data\n    *   (Generally) do not create objects\n\nLet’s\
    \ look at a stripped-down example to see the basic working parts. This is not\
    \ an example that you should use in a production environment; about a hundred\
    \ PHP frameworks are available that implement MVC better. This example is intended\
    \ to show how the separation looks internally, but not how to best implement it.\n\
    \nThe point to remember about most MVC implementations is that they use URL mapping\
    \ to map a given request onto a given object and a given method. The mapping is\
    \ generally `http://localhost/class/method/parameters` and is usually managed\
    \ either by the `Front Controller` directly or by a dispatcher/router class. In\
    \ this example, you will rewrite your earlier `FrontController` class so that\
    \ it now maps a URL onto a class structure:\n\n![Image](images/55.jpg)\n\nThis\
    \ basic router simply looks at the request URI and attempts to match it to a class\
    \ name. It does not check the validity of the controller, which should be done\
    \ and handled as an error. The router looks at the first part of the URI and defines\
    \ that as the controller class, if it exists, and does the same for the second\
    \ part, defining that as the method. If neither the controller class nor the method\
    \ is available, you use the default value index for each so that you can define\
    \ execution points.\n\nAppending the name Controller onto the name of the class\
    \ helps protect against the accidental instantiating of an object that is not\
    \ an action controller. You would not, for example, let an end user arbitrarily\
    \ instantiate a database connection. An additional protection is to append the\
    \ name Action to the method. By doing so, you ensure that only methods that are\
    \ defined as public actions will be called, thus protecting other methods defined\
    \ in the class that might have exploitable logic. Then, validate that the object\
    \ extends a new abstract class `ActionController`, and call the method.\n\nThe\
    \ `ActionController` class determines whether the class is indeed a controller\
    \ and also defines some common functionality:\n\n![Image](images/57-1.jpg)\n\n\
    As you can see, the only method defined here is one that handles rendering a view\
    \ script.\n\nThe individual action controller is the lynchpin that joins the view\
    \ and model layers. It is usually responsible for the creation of objects to implement\
    \ logic and tying them to the appropriate view script. The example shows a basic\
    \ implementation of that:\n\n![Image](images/57-2.jpg)\n\nIn this case, you have\
    \ a class named `IndexController` with a method called `indexAction()`. These\
    \ are both default names and will map onto the front page of the website: `http://localhost/`.\
    \ When someone requests that URL, the Front Controller will will map the request\
    \ to `IndexController::indexAction()`, and this method will be called.\n"
  raw: "So why go through all this effort to do what Apache basically does? The reason\
    \ is that this example does not demonstrate the full capabilities of the Front\
    \ Controller. Because the Front Controller is always executed, you can build logic\
    \ into it to solve some of the issues mentioned earlier. One of those problems\
    \ was how to ensure that you are always authenticating for the admin area, without\
    \ having to constantly inject authentication code (which might change) into the\
    \ mainline execution.\n\nTo solve that problem, you will pull some logic from\
    \ the EventManager class that you built in the section on Publish/Subscribe. Let’s\
    \ look at the Front Controller with the EventManager support built in:\n\n![Image](images/49.jpg)\n\
    \n![Image](images/50.jpg)\n\n![Image](images/51.jpg)\n\nHere, you are dispatching\
    \ a number of different events from the URL being requested, which lets you write\
    \ a subscriber that can hook in at generic, semi-generic, or specific places in\
    \ your application. A URL of http://localhost/admin will have three events dispatched:\
    \ predispatch (generic), predispatch\\_admin (semi-generic), and predispatch\\\
    _admin\\_index (specific). For a URL of http://localhost/admin/logout, the events\
    \ are predispatch (generic), predispatch\\_admin (semi-generic), and predispatch\\\
    _admin\\_logout (specific).\n\nNow you can inject a subscriber into the request\
    \ without having to modify any mainline code. In this case, you will add a subscriber\
    \ at predispatch\\_admin so you can validate all incoming requests to ensure that\
    \ they are coming from a logged-in administrator:\n\n![Image](images/52.jpg)\n\
    \nThis example checks each request being processed under http://localhost/admin\
    \ to verify that the request is logged in as an administrator, except for the\
    \ pages /admin/login and /admin/logout. Those pages are places where an unauthenticated\
    \ user should be.\n\nSo even if you were using a traditional PHP model of execution,\
    \ you can see how using the Front Controller design pattern lets you inject bits\
    \ of functionality at arbitrary places in the request without modifying any prior\
    \ code.\n\n# Model/View/Controller\n\nMany books have been written about Model/View/Controller,\
    \ so we will take only a brief look at it here. MVC existed on the desktop for\
    \ several years, but the framework took the web world by storm when Ruby on Rails\
    \ implemented it and developers found a level of productivity that they previously\
    \ had not seen. Of course, as with most simple assertions, that is not quite true,\
    \ but it is close enough to the truth to be considered accurate.\n\nUp until Rails\
    \ came along, most web applications were basically the WordPress type of script.\
    \ I am not knocking WordPress as a phenomenon, but I doubt that anyone would subscribe\
    \ to the argument of *WordPress is a great architecture.* I am a fan of WordPress,\
    \ but the architecture that it is implemented with does lack a certain elegance.\
    \ Though, truth be told, most software lacks elegance. Half the time, if “elegance”\
    \ is a feature, it probably is not useful.\n\nMVC allows for an easier *separation\
    \ of concerns*—the practice of designing an application with distinct components\
    \ grouped around similar functionality. With MVC, those concerns are data access/processing,\
    \ interface management, and request dispatching. This means that data access or\
    \ processing is grouped with other “model” components; a UI component is grouped\
    \ with other “view” components; and dispatching, brokering, or setup actions are\
    \ grouped into individual “controller” components. Using MVC gives us a much cleaner\
    \ application that has no HTML in the data access classes, no complex business\
    \ logic in the dispatching classes, and no logical functionality in the UI scripts.\
    \ This strong separation not only makes the application cleaner but also much\
    \ more testable. As such, it serves at minimum as a good example of how to build\
    \ an application.\n\nUsually, a diagram such as the one in [Figure 2.2](#006_Chapter02.html#fig2-2)\
    \ is used to describe the MVC architecture.\n\n![Image](images/54.jpg)\n\n*Figure\
    \ 2.2: Typical diagram that describes the MVC framework*\n\nThis diagram is as\
    \ clumsy as it is stupid. It does not tell us anything about MVC. Rather than\
    \ try to come up with another unwieldy diagram, let’s try a less awkward set of\
    \ responsibilities.\n\n*   **Models** \n\n    *   Responsible for loading data\
    \ and implementing business logic\n\n    *   Do not directly access the database\n\
    \n    *   Do not initiate new logic except to handle dependent logic\n\n    *\
    \   Do not render content\n\n*   **Controllers** \n\n    *   Responsible for initializing\
    \ models and instructing them what to do (including validation)\n\n    *   Indicate\
    \ which UI element(s) to load and which data is available to them\n\n    *   Never\
    \ directly call the database\n\n    *   Never directly output output\n\n*   **Views**\
    \ \n\n    *   Responsible for handling browser output\n\n    *   Do not implement\
    \ logic beyond rendering logic\n\n    *   Do not directly access the database\n\
    \n    *   Do not manipulate data\n\n    *   (Generally) do not create objects\n\
    \nLet’s look at a stripped-down example to see the basic working parts. This is\
    \ not an example that you should use in a production environment; about a hundred\
    \ PHP frameworks are available that implement MVC better. This example is intended\
    \ to show how the separation looks internally, but not how to best implement it.\n\
    \nThe point to remember about most MVC implementations is that they use URL mapping\
    \ to map a given request onto a given object and a given method. The mapping is\
    \ generally http://localhost/class/method/parameters and is usually managed either\
    \ by the Front Controller directly or by a dispatcher/router class. In this example,\
    \ you will rewrite your earlier FrontController class so that it now maps a URL\
    \ onto a class structure:\n\n![Image](images/55.jpg)\n\nThis basic router simply\
    \ looks at the request URI and attempts to match it to a class name. It does not\
    \ check the validity of the controller, which should be done and handled properly\
    \ as an error. The router looks at the first part of the URI and defines that\
    \ as the controller class, if it exists, and does the same for the second part,\
    \ defining that as the method. If neither the controller class nor the method\
    \ is available, you use the default value index for each so that you can define\
    \ default execution points.\n\nAppending the name Controller onto the name of\
    \ the class helps protect against the accidental instantiating of an object that\
    \ is not specifically an action controller. You would not, for example, want to\
    \ let an end user arbitrarily instantiate a database connection. An additional\
    \ protection is to append the name Action to the method call. By doing so, you\
    \ ensure that only methods that are defined as public actions will be called,\
    \ thus protecting other methods defined in the class that might have exploitable\
    \ logic. Then, validate that the object extends a new abstract class called ActionController,\
    \ and call the method.\n\nThe ActionController class determines whether the class\
    \ is indeed a controller and also defines some common functionality:\n\n![Image](images/57-1.jpg)\n\
    \nAs you can see, the only method defined here is one that handles rendering a\
    \ view script.\n\nThe individual action controller is the lynchpin that joins\
    \ the view and model layers. It is usually responsible for the creation of objects\
    \ to implement logic and tying them to the appropriate view script. The example\
    \ shows a basic implementation of that:\n\n![Image](images/57-2.jpg)\n\nIn this\
    \ case, you have a class named IndexController with a method called indexAction().\
    \ These are both default names and will map onto the front page of the website:\
    \ http://localhost/. When someone requests that URL, the Front Controller will\
    \ map the request to IndexController::indexAction(), and this method will be called."
