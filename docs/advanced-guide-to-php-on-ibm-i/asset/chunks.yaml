    you are much less likely to notice it than if the data is gone. So it is possible
    to have an open vulnerability that can be exploited for weeks, months, or years
    without your ever knowing that you have a problem.


    Although the exploit can use the same methodology as the SELECT statements in
    the earlier examples that modified the WHERE clause, you have other options here,
    too. Sometimes developers like to be a little lazy.


    Consider a scenario where a help-desk individual can make changes to a person’s
    account, such as address and name but not the password. The help-desk cannot change
    the password because the theory is that only the user should know a password.
    This is a good practice.


    However, let’s also look at this hypothetical implementation, starting with this
    form:


    ![Image](images/133.jpg)


    There is nothing wrong with the form. When you submit the form, the data you receive
    will be similar to this:


    ![Image](images/134-1.jpg)


    But look at the PHP code that is being used to build the query:


    ![Image](images/134-2.jpg)


    The code first creates the base query for an array of parts. The parts correspond
    to the name value pairs passed in from the form. You omit the value for ‘key’
    because you will use it later. After you have processed the parts, append them
    to the original query followed by the conditional statement. The resulting query
    will look like this:


    ![Image](images/135-1.jpg)


    As noted earlier, this organization’s policy dictates that help-desk personnel
    cannot know a user’s password, so the form does not contain a password field.
    However, even though the form does not include the field for “password,” nothing
    is stopping the help-desk person from forging an HTTP request by using Notepad
    and Telnet or from using the browser debug tooling to change the form.


    So the attacker submits the form with this data:


    ![Image](images/135-2.jpg)


    The data in turn creates an SQL statement:


    ![Image](images/135-3.jpg)


    And now the help-desk person can set the password without the end-user’s knowledge.


    You have seen two primary means of SQL injection. The first directly modified
    the SQL query, contravening the programmer’s intent; the second changed the web
    application’s logic, violating the programmer’s intent.'
