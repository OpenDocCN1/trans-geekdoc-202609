    fine at the time of this writing, but it has a theoretical vulnerability and is
    considered a weak hashing mechanism. So what should you use?


    First, do not use the sha1() or md5() functions even if you intend to use SHA-1
    or MD5. A better function for hashing is hash(). It functions exactly as sha1()
    and md5(), but hash() lets you specify which algorithm the mechanism should use
    as a parameter. To see which algorithms are available, use the hash\_algos() function.
    When I run it, I get a little more than 42 options. So which to choose? It is
    difficult to say exactly, but the U.S. National Institute of Standards and Technology
    (NIST) recommends that all government agencies use one of the SHA-2 algorithms.
    Whether you trust the NIST is a different matter. Several SHA-2 algorithms are
    available, and when it comes to cryptography, the bigger the number the better
    it is[²](#009_Chapter05.html#fn_2).


    To implement this in the previous examples (we will abbreviate it a little), replace
    the sha1() function calls with hash(). You change the following:


    ![Image](images/157-1.jpg)


    To this:


    ![Image](images/157-2.jpg)


    Now your passwords are even more secure because you are using SHA-512 instead
    of SHA-1.


    However, these hashing functions pose a bit of a problem. Hash functions generally
    tend to be fast and computationally simple (compared to some operations). The
    end result is that some standard hashing functions such as md5() and sha1() can
    be quickly precalculated.


    For example, on a moderate IBM i system, I ran a test to see how fast that machine
    could hash the alphabet one million times with various algorithms. Following are
    my results:


    ![Image](images/157-3.jpg)


    And I did this in PHP, which is not exactly known for its prowess when handling
    complex numbers. The problem with hashing functions is that they are fast. To
    make them more secure, you must make them slow by running them many, many times
    over, hashing and rehashing. By doing this, you are making it much more computationally
    expensive for an attacker to access your passwords, and that is a good thing.


    As a rule, try to make your password-hashing mechanism take about a second to
    run (see *[http://www.zimuel.it/cryptography-made-easy-with-zend-framework](http://www.zimuel.it/cryptography-made-easy-with-zend-framework)).*
    That way, you go from having SHA-256 run 250,000 passwords per second down to
    running only one. That is a huge step. This technique is called *stretching.*
    But be mindful of the hardware you are running this algorithm on so it does not
    take too long. In my case, about 20,000 iterations sufficed to push it to 1.3
    seconds:


    ![Image](images/158.jpg)


    But will using this mechanism make your website slow? No. It will only make your
    *login* and *update password* pages slow. Everything else will remain the same.
    The net result is that your passwords will be a *lot* harder to crack should they
    ever get into the open.


