    Caching can be done either on the client or on an intermediary in between the
    client and the server. As such, an API can use a layered system with many different
    caches in between, and the client will be none the wiser. Generally, caching is
    managed via HTTP caching headers to inform any intermediary servers (or the client)
    what the caching parameters are. However, because each `URL` is intended to be
    a location to a representation of a resource, the content can (and should) be
    cached on the server side as well.


    # Resource Definitions


    Much of REST’s magic is managed in the way it handles resource endpoints. The
    tactic was not new or novel, but it unified the approach being used. A REST-based
    scenario has two basic types of `URLs`: collection-based and entity-based.


    When building a typical API, developers often build out the API by using endpoints
    with verbs; for example, `http://localhost/api/users/getUsers` (we will be doing
    something like this later). But this is not the REST way. REST is intended to
    be representational. In other words, it is supposed to represent the data in your
    organization, not describe what that data is doing.


    So for the user example, rather than having a verb in your API call, you have
    a resource location. In this case, it is `http://localhost/api/users`. When that
    `URL` is queried, the client will receive a list of user resources that will include
    a `URL`.


    Here is where you might get the purists’ panties in a bunch. How do you return
    the results of the query for the user collection? You might think that returning
    a list of defined users is what you should do. And you would be wrong. Instead,
    for your API to be properly RESTful, you should return a list of user endpoint
    `URLs`. You would then query those individual `URLs` to retrieve the user data
    for each. That is what you need for the API to be RESTful.


    To retrieve an individual entity, you put its unique identifier at the end of
    the `URL`: `http://localhost/api/users/1`. Each entity will have a `URL` where
    its data payload can be downloaded from, and only from there.


    But isn’t that kind of wasteful? “I could be making hundreds, or thousands, of
    queries against an API to get each of the entities I need,” you might say. And
    you would be right. This is exactly why many people use the REST characteristics
    without being truly RESTful. Being truly RESTful can be a giant pain in the butt.
    So take some shortcuts, if you must.


    However, by taking shortcuts, you will lose some of the benefits, namely caching.
    If you retrieve a user collection that returns entities, can you cache the results?
    Well, yes. But what happens when someone tries to retrieve the entity via its
    unique `URL`? And then what happens when that entity has changed? Now you need
    to know all the places where that entity has been cached and invalidate them all.
    Doing so is somewhat easy if you are caching internally in `PHP`. But what happens
    if you are using Varnish or some kind of multitier caching system? Then it becomes
    much more problematic.


    # Usage of HTTP Verbs


    Did you know that HTTP has more method actions than just `GET` and `POST`? `RFC
    2616` defines eight (`GET`, `POST`, `HEAD`, `OPTIONS`, `CONNECT`, `PUT`, `DELETE`,
    and `TRACE`), and `RFC 5789` adds another one (`PATCH`) that REST can exploit.
    A REST-like API does not use verbs in `URLs`, so you determine the type of action
    to do via the HTTP method.


    Wikipedia has a great chart (`[Table 8.1](#012_Chapter08.html#tab8-1)]`) that
    helps put this into perspective. (You can find the chart, along with other information
    about REST, at http://en.wikipedia.org/wiki/representational_state_transfer).


    ![Image](images/235-1.jpg)


    So to delete an individual user, you would use an HTTP request like this:


    ![Image](images/235-2.jpg)


    To update the same user, use this:


    ![Image](images/235-3.jpg)


    Or to delete all of the users, code the following:


    ![Image](images/235-4.jpg)


    Considering that Roy Fielding co-authored the HTTP protocol, it makes perfect
    sense that he would use it when defining REST. REST does not specifically require
    HTTP, but it is a protocol that fits REST’s needs for statelessness and easy caching
    better than most others. As such, the HTTP methods correspond nicely to the verbs
    that REST requires.


    # Authentication


    REST does not have a specific method of authentication as part of the standard,
    so you are free to use whichever authentication method you would like. Given that
    inherent within the REST definition is the ability to delete an entire collection,
    you should implement some level of authentication and access control as part of
    your API. But because you would do that separately from REST, though on top of
    HTTP, we will not cover it here but later in the chapter (with a more general
    discussion on authentication for APIs).


    # SOAP


    Ahh, SOAP. The only protocol that makes you feel dirty after using it. SOAP is
    one of the most bloated, complicated protocols you will ever see, but one of the
    most sophisticated. For this reason, many developers have rebelled against SOAP
    and opted for a REST-like approach. Unlike REST, which is an architectural style
    as opposed to a protocol, SOAP is a protocol that has stringent requirements and
    expectations from the clients that it interacts with. SOAP’s stringent data requirements
    are also a benefit. Because SOAP is a complex protocol, we will take only a basic
    look at both the protocol and the `PHP` implementation.


    You implement SOAP through the use of an `XML` document. Unlike REST or many web
    service implementations, the structure of the document is extremely important.
    Additionally, unlike REST, in SOAP the URL is largely unimportant because the
    procedure call is defined in the XML itself. You can find the XML Schema Definition
    (XSD) for the basic SOAP request at http://www.w3.org/2001/12/soap-envelope and
    the encoding at http://www.w3.org/TR/2000/0508/encoding-0418. The root element
    of the document is `soap:Envelope`, which has at least two elements: `soap:Header`
    and `soap:Body`. The header does not play as prominent a role as the body does.
    The header is not required, but the body is. It does not have the same level of
    structured requirements as the body. However, you can define the header requirements
    in a Web Services Definition file, or `WSDL` (which we will examine later), and
    make it a prerequisite for a properly constructed request.


    But for now, we will look at WSDL-less requests for simplicity:


    ![Image](images/237-1.jpg)


    This code is setting up a WSDL-less SOAP request. The first parameter in the `SoapClient`
    constructor is the URL of the `WSDL` to use. Because this example does not have
    a `WSDL`, you set that value as `null`. But by doing that, you must provide the
    endpoint for the `SoapClient` to call, which you do in an array of options in
    the second parameter. That value is specified in the `location` key. But what
    about that `uri` key? You use that key to specify the XML namespace for the actual
    SOAP call XML structure.


    The method that you call, in this case `doCall()`, does not exist in the `SoapClient`
    class. It is handled via `__call()`, which lets you act upon the `SoapClient`
    object as if it were the remote object itself.


    When you execute the code, you get the following XML document (reformatted for
    clarity):


    ![Image](images/237-2.jpg)


    To handle the, you create an endpoint that instantiates the `SoapServer` class.
    You then specify the response URI as well as a list of functions that will be
    responsible for handling any requests that are made.


    Following is a basic SOAP server implementation that will handle the request you
    previously defined:


    ![Image](images/238-1.jpg)

