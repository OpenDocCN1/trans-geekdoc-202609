  trans: '

    首先，这段代码加载了 `jQuery` 库。然后，它调用了一个名为 `$` 的奇特函数，它是变量 `jQuery` 的 JavaScript 引用。这是一个快捷方式。`$`
    函数实际上是一个选择器机制。传入一个变量、字符串或对象，`jQuery` 就会返回它用于引用该项的内部对象。简而言之，你可以访问所请求的元素，但其上添加了许多
    `jQuery` 钩子（hooks）。


    在第一个代码块中，你请求了文档对象并在其上调用了 `ready()` 方法。然后，`jQuery` 会覆盖任何对 `window.onload` 函数的调用并将它们包含到内部。因此，要在窗口加载页面后执行代码，你现在通过调用
    `ready()` 方法来插入一个具名或匿名的函数。虽然这个过程看起来可能没带给你太大好处，但它的作用比你想象的要大得多。


    在使用 `window.onload` 时，你只能向该事件绑定一个函数调用。而使用 `$(document).ready()` 则允许你向 `onload`
    事件绑定任意数量的函数，因为现在由 `jQuery` 来处理这些了。


    所以，你将函数传递给 `ready()` 调用，当文档准备就绪时，就会调用 `initPage()` 函数。`initPage()` 函数的内容展示了为什么
    `jQuery` 处处可见。你调用选择器函数并输入 CSS 查询，以获取引用所请求项的 `jQuery` 对象。如果你请求一个不存在的项，仍然会返回一个对象，但该对象仅仅不会执行任何操作。这可以防止
    JavaScript 错误，错误可能会破坏你的应用程序。换句话说，空检查（null checks）在这里不起作用的。尽管这可能让开发者产生警觉，但它帮助浏览器在发生错误后继续执行网页。


    事实上，这引出了一个有趣的问题。如果 `jQuery` 选择器可以返回零、一个或多个对象，你如何知道返回的是什么呢？


    返回的对象取决于页面的内容。如果你正在请求一个带有文档 ID 的项（例如示例中的 `#main-content`），你应该只接收到一个对象。如果你通过类（class）选择对象，那么你可能会接收到多个。


    无论何种情况，验证是否已接收对象的最佳方法是检查 `length` 属性：


    ![Image](img/194-1.jpg)


    这段代码有些是多余的，因为如果查询返回为空，`jQuery` 不会失败，但它确实展示了你如何验证 CSS 查询是否返回了任何对象。


    然而，当你想要遍历一系列一个或多个对象时会发生什么呢？与其使用 `foreach` 循环，你只需再次使用匿名函数（或具名函数；两种方法可行）。


    ![Image](img/194-2.jpg)


    这里的代码将遍历页面中所有具有 `paragraph-text` 类的段落，并将它们的内容改为大写。但请注意 CSS 选择器中一个有趣的地方：你使用点号（`.`）表示你是在根据类而不是
    ID 进行选择，就像你定义 CSS 类时做的一样。这表明你可以使用已定义或未定义的 CSS 类作为对相似对象分组的手段以便以便查询。你甚至不需要为它们定义
    CSS 类即可让其工作。


    到目前为止，你已经看到了如何通过程序手段操作 DOM。现在我们来看看如何使用 `jQuery` 与用户交互，这非常简单。尽管我们将使用一个稍微复杂的例子，但它将展示一些非常强大的功能。花点时间思考这个例子，因为它非常值得理解：


    ![Image](img/195.jpg)


    为了帮助解释发生了什么，这个示例按执行顺序列出了函数。首先，正如预期的那样，`initPage()` 在页面加载时运行。该函数使用 CSS 选择器找到所有分配了
    `paragraph-text` 类的元素。然后，你通过在匿名函数的值参数中提供的 `jQuery` 对象上调用 `mouseover` 函数，来绑定 `mouseover`
    事件。接下来，你将函数（在此例中为 `setBackgroundToRed()`）传递给 `mouseover()` 方法。当鼠标移动到段落上时，就会调用
    `setBackgroundToRed()`。


    `setBackgroundToRed()` 函数引入了一个有趣的 `jQuery` 特性：动画队列（animation queues）。动画队列用于管理动画序列。通常情况下，你不会想使用动画队列来处理延迟函数，但在这里是有意义的。对于大多数延迟执行任务，你会想要使用
    `window.setTimeout()` 函数。但在这里使用动画队列是合理的，因为你最终需要修改单个对象。队列允许你在单个对象的作用范围内工作，而 `setTimeout()`
    只在全局上下文中工作。


    调用 `setBackgroundToRed()` 将背景颜色设置为红色。然后调用 `delay` 方法，随后调用 `queue()`，在其中你指定你想要调用的函数。


    但你注意到什么了吗？当你绑定到 `mouseover` 事件时，你使用的是 `$(value)`。而在这里，你使用的是 `$(this)`。区别在于当你绑定事件时，你正在遍历数组中的值。


    然而，在这种上下文中，你是从绑定到对象的函数内部执行的。该对象“拥有”正在执行的函数。因此，你可以通过特殊变量 `this` 访问本地属性和方法。这很重要，因为它让你执行与该特定对象直接相关的功能。


    然后 1000 毫秒后，调用了 `setBackgroundToTransparent()`。在将内联 CSS 样式设置为红色之前，你在 `$(this)`
    上调用了 `clearQueue()`。执行此操作防止 `jQuery` 重新将函数添加到队列中，这就是你在 `setBackgroundToRed()`
    中所做的。清空队列以便在后续调用它时，能够执行添加的调用。


    # Ajax


    DOM 操作很有趣，但将其与服务器交互相结合会变得更有用。在这一节中，我们将简要处理如何使用熟悉的术语“Ajax”来实现此。Ajax 最初是 AJAX，代表*异步
    JavaScript 和 XML*。然而，许多人开始使用非 XML 的协议使用 AJAX。正因如此，名称更改为 Ajax，它不再是一个缩写，但通常指的是*浏览器与服务器之间的通信*。


    目前最流行的格式是 JavaScript 对象表示法（JSON）。将此格式放入页面的 `<script>` 部分将把这些数据解释为 JavaScript 对象或数组，取决于你写的语法。


    为了演示如何使用 `jQuery` 实现这一点，我们将从一个简单的 PHP 脚本开始，它可以让你获取 PHP 支持的时区列表，然后获取所选时区的本地时间：


    ![Image](img/198-1.jpg)


    我们不会深入探讨示例正在执行的细节（你*应该*知道这些）。但基本上，如果 `GET` 参数为空或 `$_GET[''function'']` 被设置为 `gettimezones`，代码将提供支持的时区列表。如果函数是
    `gettime` 且 `$_GET[''zone'']` 被设置，示例将返回日期、时区类型和时区名称的关联数组：


    ![Image](img/198-2.jpg)


    在这里，你首先为 `ready()` 方法附加了一个函数。该函数调用了 `jQuery.getJSON()` 方法，该方法反过来调用指定的 URL 并将结果解析为
    JSON。方法的第二个参数提供了一个回调，`jQuery` 在成功从调用 URL 返回后将调用它。你知道返回值将是一个数组（因为你在 PHP 脚本中是这样编写的），所以你使用
    `each()` 方法遍历值。对于每个值，你都向 ID 为 `choose-zone` 的 `<select>` 添加一个新的 `<option>` 标签。

