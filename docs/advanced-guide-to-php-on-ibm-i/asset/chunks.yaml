- fmt: "\nHowever, the standard that we are referring to is `ECMA 262`, or `ECMAScript`.\
    \ You will better know it as `JavaScript`. `ECMA 262` contains a definition for\
    \ handling serialized data forms by using a structure called `JavaScript Object\
    \ Notation`. Although the standard was intended for browser-based communication,\
    \ `JSON` is now one of the leading web service Remote Procedure Call (RPC) structures\
    \ in use. It is used most famously by Twitter and Facebook as part of their web\
    \ service API interface.\n\n`JSON` natively has six data types: `number`, `string`,\
    \ `Boolean`, `array`, `object`, and `null`. How data types are determined is largely\
    \ how they are represented in the markup. A string has quotation marks. An array\
    \ has square brackets. An object has curly brackets with keys and values. Boolean\
    \ are either `true` or `false`, without string encapsulation. An array is a numerical\
    \ value with no string encapsulation. Individual values in a `JSON` value are\
    \ demarcated by a comma. Because these values correspond somewhat tightly with\
    \ `PHP`’s data types, translation between the two is natural.\n\nConsider the\
    \ following code:\n\n![Image](images/249-1.jpg)\n\nWhen you run the code, you\
    \ get the following output (line endings and tabs added for clarity):\n\n![Image](images/249-2.jpg)\n\
    \nThe first level is an array, hence the square brackets. If you were to use `JSON`\
    \ to encode a string, you would not see the square brackets. The first value in\
    \ the array is a string. The second is a number. The third value is `null`, and\
    \ the fourth is `Boolean`. The fifth is a numerical array. And the sixth value\
    \ is a `JavaScript` object, which translates to an associative array.\n\nAs a\
    \ format, `JSON` is easy to read, simple to write, and does not require complex\
    \ processors to transform a serialized string into a useable object. It is also\
    \ fast to parse, but sometimes not as quick as parsing `XML`. People often think\
    \ that because `XML` has `XSS`, `XSLT`, `namespaces`, `DTDss`, and such that it\
    \ will be slower. But that is only if you use those features. Bare-bones `XML`\
    \ parsing is not much different from `JSON`. `JSON` does let you create more efficient\
    \ data serialization from a byte-count perspective, but because the `XML` parsers\
    \ are so optimized, they can often be faster than `JSON`.\n\nThe discussion of\
    \ features presents another interesting point. `JSON` has no validation features.\
    \ In other words, the only way to validate a `JSON` document is programmatically\
    \ (or manually). You must also consider this type of logic when working with `JSON`\
    \ parsing times. The `XML` parsers are extremely optimized when it comes to validation\
    \ capabilities, whereas `JSON` is not as optimized because it does not have that\
    \ functionality.\n\nAdditionally, one reason `JSON` is used is that it is less\
    \ verbose than `XML`. The theory is that because `JSON` requires less markup,\
    \ the document will be smaller. This is true unless you are using compression,\
    \ which most web servers should be doing automatically. After you add compression\
    \ to the mix, `JSON` documents can actually be larger than `XML` documents. This\
    \ is not a given, but if the web server automatically compresses the output and\
    \ the browser supports it, then the perceived size benefit might not be realized.\n\
    \nThat said, `JSON` is still a great mechanism for passing data back and forth\
    \ between the browser and the server. The reason comes not from speed, validation,\
    \ or size. It is that `JSON` provides data types that are roughly analogous to\
    \ the basic types in `PHP` and is a natural component in the browser. Because\
    \ of this, you can pass loosely typed data from the browser to the server.\n\n\
    When building out a `JSON`-based service, you typically do so in a REST-like fashion.\
    \ Developers often use `URLs` for mapping requests onto various service classes.\
    \ Although this is not a requirement, using this mapping technique helps to segment\
    \ your application into smaller pieces and make it more predictable. But because\
    \ few strong standards exist, like the ones for `SOAP`, any in-depth examples\
    \ will probably be less useful. So we will look at a simplified example that you\
    \ can use as a starting point.\n\nThis example presumes URL rewriting that will\
    \ map individual URL paths onto a single bootstrap file. If you are using `Apache`,\
    \ you do that mapping in either an `.htaccess` file or your `httpd.conf` file:\n\
    \n![Image](images/251-1.jpg)\n\nYou configure this in either a `Location` or `Directory`\
    \ configuration option, or in an `.htaccess` file in your API directory such as\
    \ `/api`.\n\nAlthough it is better to retrieve information via `GET` requests\
    \ so they can be cached, for the sake of simplicity, you will pass all information\
    \ via `POST` requests. Otherwise, the example would need to consider both `GET`\
    \ and `POST` requests, and that would become more verbose.\n\nWhen working with\
    \ `JSON`, people will often build their own server. They can use `PHP` to build\
    \ it.\n\n```php\n// Example structure of a JSON-based service\nabstract class\
    \ AbstractService {\n    protected $db;\n    public function setPdo($pdo) {\n\
    \        $this->db = $pdo;\n    }\n    public function isAllowed() {\n       \
    \ return true;\n    }\n}\n```\n"
  raw: 'However, the standard that we are referring to is ECMA 262, or ECMAScript.
    You will better know it as JavaScript. ECMA 262 contains a definition for handling
    serialized data forms by using a structure called *JavaScript Object Notation.*
    Although the standard was intended for browser-based communication, JSON is now
    one of the leading web service Remote Procedure Call (RPC) structures in use.
    It is used most famously by Twitter and Facebook as part of their web service
    API interface.


    JSON natively has six data types: number, string, Boolean, array, object, and
    null. How data types are determined is largely how they are represented in the
    markup. A string has quotation marks. An array has square brackets. An object
    has curly brackets with keys and values. Boolean values are either true or false,
    without string encapsulation. An array is a numerical value with no string encapsulation.
    Individual values in a JSON value are demarcated by a comma. Because these values
    correspond somewhat tightly with PHP’s data types, translation between the two
    is natural.


    Consider the following code:


    ![Image](images/249-1.jpg)


    When you run the code, you get the following output (line endings and tabs added
    for clarity):


    ![Image](images/249-2.jpg)


    The first level is an array, hence the square brackets. If you were to use JSON
    to encode a string, you would not see the square brackets. The first value in
    the array is a string. The second is a number. The third value is null, and the
    fourth is Boolean. The fifth is a numerical array. And the sixth value is a JavaScript
    object, which translates to an associative array.


    As a format, JSON is easy to read, simple to write, and does not require complex
    processors to transform a serialized string into a useable object. It is also
    fast to parse, but sometimes not as quick as parsing XML. People often think that
    because XML has XSS, XSLT, namespaces, DTDs, and such that it will be slower.
    But that is only if you use those features. Bare-bones XML parsing is not much
    different from JSON. JSON does let you create more efficient data serialization
    from a byte-count perspective, but because the XML parsers are so optimized, they
    can often be faster than JSON.


    The discussion of features presents another interesting point. JSON has no validation
    features. In other words, the only way to validate a JSON document is programmatically
    (or manually). You must also consider this type of logic when working with JSON
    parsing times. The XML parsers are extremely optimized when it comes to validation
    capabilities, whereas JSON is not as optimized because it does not have that functionality.


    Additionally, one reason JSON is used is that it is less verbose than XML. The
    theory is that because JSON requires less markup, the document will be smaller.
    This is true unless you are using compression, which most web servers should be
    doing automatically. After you add compression to the mix, JSON documents can
    actually be larger than XML documents. This is not a given, but if the web server
    automatically compresses the output and the browser supports it, then the perceived
    size benefit might not be realized.


    That said, JSON is still a great mechanism for passing data back and forth between
    the browser and the server. The reason comes not from speed, validation, or size.
    It is that JSON provides data types that are roughly analogous to the basic types
    in PHP and is a natural component in the browser. Because of this, you can pass
    loosely typed data from the browser to the server.


    When building out a JSON-based service, you typically do so in a REST-like fashion.
    Developers often use URLs for mapping requests onto various service classes. Although
    this is not a requirement, using this mapping technique helps to segment your
    application into smaller pieces and make it more predictable. But because few
    strong standards exist, like the ones for SOAP, any in-depth examples will probably
    be less useful. So we will look at a simplified example that you can use as a
    starting point.


    This example presumes URL rewriting that will map individual URL paths onto a
    single bootstrap file. If you are using Apache, you do that mapping in either
    an .htaccess file or your httpd.conf file:


    ![Image](images/251-1.jpg)


    You configure this in either a Location or Directory configuration option, or
    in an .htaccess file in your API directory such as /api.


    Although it is better to retrieve information via GET requests so they can be
    cached, for the sake of simplicity, you will pass all information via POST requests.
    Otherwise, the example would need to consider both GET and POST requests, and
    that would become more verbose.


    When working with JSON, people will often build their own server. They can use
    protocols such as JSON-RPC, but they frequently opt to use their own format for
    creating web services. For whatever reason, the formatted protocols for JSON have
    not caught on in a way that a standard would emerge. So we will take a “roll-your-own”
    approach as well.


    Let’s start by creating a service Handler class in the namespace Service:


    ![Image](images/251-2.jpg)


    This code lets you inject a PDO object into the handler, which in turn will be
    injected into the service object. You want to minimize the creation of external
    sources inside the class because it makes unit testing those objects more difficult.
    So you inject them from the outside.


    You can see how this looks in the Service/AbstractService class, which forms the
    base of any service that you will define:


    ![Image](images/252.jpg)


    Any service class will have the database injected into it from the handler via
    the PDO setter. But you also define some other methods: isAllowed() lets the service
    class define an ACL to validate access to the service. You can do these kinds
    of access checks inside the individual method, but you need to account for that
    in your unit tests. Doing this separately lets you bypass those checks during
    testing.


    In the Service\\Handler class, you will also include an autoloader for loading
    the class files for any required objects:


    ![Image](images/253.jpg)


    This code checks whether the class being requested is in the PublicService namespace.
    PublicService allows service classes to reside in a different location (/services)
    from the rest of the library (/lib). This separation is similar to having a controller
    defined separately from library components. I do not know how much safer this
    approach is, but I like having that additional security blanket.


    So now that you have the basic functionality down, let’s add some logic to build
    out the service class into something usable. First, you create a router. A router
    is simply logic that, when implemented, maps a given URL onto a service class.
    To do this, you create a method called getServiceCallback() in the Service\\Handler
    class:


    ![Image](images/254.jpg)


    This method takes the current directory and removes everything below the document
    root. It does so to determine the base URL from where the API bootstrap is called
    from. That way, if you have a URL called /api/service/method, it will ignore /api
    when generating the class name. This works because the URL will not provide a
    file name. Your mod\_rewrite configuration will see to that.


    Calling the array\_diff() on the two paths, the current directory and the requested
    URL, will provide an array of parts that will translate into namespace and class.
    However, because you defined the service’s method as the last item in the URL,
    you delete that method and add the word Action to explicitly define which methods
    are available to the public.


    If you do not add the word Action, then technically, setPdo() can be called. But
    because you did add Action to the end of the URL, the handler will translate the
    call to setPdoAction(), which does not exist. This is a basic, but effective,
    tool to restrict which methods can be called in a service class.'
