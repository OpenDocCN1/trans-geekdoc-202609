- fmt: '

    When you try to access a given class that has not yet been included in the current
    request scope, this autoloader will translate the file name to `MyNamespace/MyClass.php`
    and attempt to load it. Note, however, that this function does not work with pseudo-namespaced
    classes because you have not taken underscores into account.


    Do you *need* to follow the structure where directories match the namespace values?
    No, not at all. In fact, you can do whatever you want and simply define namespaces
    for the fun of it, as long as your autoloader can accommodate the structure. But
    the purpose of having namespaces is to let you define multiple working areas within
    your code and do so in a predictable fashion. So although you *can* ignore naming
    conventions, following them as described here is much more beneficial.


    So how do you work from within multiple different namespaces?


    Let’s start with a namespace called `Util` that will contain classes that have
    a general purpose, or utility, across an application. The namespace `Util` will
    have a class called `Date` that you will use for some generic date-processing
    functionality. You will store this class in a file called `Util/Date.php` (and
    store it in the directory `/lib`, which presumably is set in the `include_path`):


    ![Image](images/14-1.jpg)


    If you created an instance of this class from within an `index.php` file, you
    would have to call it from within the global scope. You could, of course, define
    the code in `index.php` to be within the `Util` namespace, but that would go against
    virtually all accepted practices.


    The `index.php` file looks like this:


    ![Image](images/14-2.jpg)


    Note the use of the backslash when creating the new instance. Also note that the
    example did not include a leading backslash. This is interesting, as you will
    see in a bit. But for now, let’s examine how to access classes from a distinct
    namespace.


    You will create a `File` class from within the `Filesystem` namespace. One of
    the functions of this class will be to return the `mtime`, or modification time,
    for a given file (`index.php`, in this case). To render the timestamp so that
    dates, however they are come by, are in the same format, use the `Util\Date` class:


    ![Image](images/15.jpg)


    Let’s look at how to create the instance of `Util\Date`. Here, you prepend the
    class with a backslash. If you did not, the Zend Engine would think that you were
    asking for `Filesystem\Util\Date`. If that was actually what you wanted, you would
    create a new file called `Filesystem/Util/Date.php`, define the namespace in the
    file to `Filesystem\Util`, and specify the `Date` class. Namespaces operate in
    a similar fashion to a file system, where the context of a given action has an
    effect.


    But explicitly declaring the full namespace can be a pain and does not buy you
    much in readable code when compared with pseudo-namespaces. For that reason, the
    `use` keyword was introduced. It lets you, as the developer, declare the classes
    that you will use before you actually use them. By doing so, you can specify only
    the class name in your inline code and not the full namespace.


    Applying that treatment to the `Filesystem\File` class produces the following
    class definition:


    ![Image](images/16.jpg)


    That technique is starting to make your code much more readable.


    But what happens if you have two classes that have the same name but are in different
    namespaces? For example, you stated that you were using the class `Util\Date`,
    but what if you also had one called `System\Date`?


    For that, you can use aliasing to give specific classes alternate names to avoid
    collisions:


    ![Image](images/17.jpg)


    This approach helps to protect you against any accidental naming collisions and
    lets you be more specific to avoid conflicts.


    Namespaces are virtually a must when it comes to any moderately complex application.
    Even in my simple applications of only 10s of classes, I use them by default.
    It makes an application more readable, more manageable, and much more structured.


    # Traits


    One typical problem you might encounter when working from within OOP is a class
    that contains multiple disparate characteristics. Consider a class that represents
    a product in a catalog but has certain implementation methods, such as a method
    that exports the object as an XML representation. To do this, you make these types
    of implementation details available in as primitive a class as possible, which
    might expose that functionality to more classes than you want to provide access
    to.


    When thinking about traits, consider again the world of biology to find a close
    parallel. Think along the lines of “breeds.” A dog is a dog is a dog, but dogs
    have different features, such as markings or size. A trait is like a breed of
    dog. The dog is still a dog, but individuals have certain characteristics, and
    these characteristics are not always in a taxonomical structure. Both Corgis and
    Dachshunds are short, for example, but you do not see the Queen with a Dachshund.


    Recall that the previous example of namespaces had a class called `File` in the
    namespace `Filesystem`. To allow the `File` class to export itself as an XML document,
    you need to ensure that it is inheriting from the proper classes to do so. But
    that can be a sticky situation because a `Filesystem` namespace does not naturally
    lend itself to exporting a member as an XML document.


    So you define a new trait that lets you copy the functionality that you need onto
    the `File` class. You will put this trait in the `Util` namespace:


    ![Image](images/18.jpg)


    This trait then retrieves the base name of the class, omitting the namespace (`basename()`
    works with more than just file names). This is because `get_class()` returns a
    fully qualified class name, including the namespace, and XML node names do not
    like backslashes. You then create a new base node and iterate over all the properties,
    adding their names and values to the document, which you finally return.


    A frequent way to do this without traits involves passing this object into some
    kind of export class, which will iterate over the object and render the XML. But
    the problem with this method is that the private and protected class members will
    not be visible to an external exporter, so they will be excluded as part of the
    export routine. By putting the export routine in the trait, you can access all
    member variables.


    Next, add the trait to the `Filesystem\File` class:


    ![Image](images/19-1.jpg)


    Now in the mainline code, you can execute the export routine:


    ![Image](images/19-2.jpg)


    The result is a nice XML document that represents the class, and you did it without
    having to resort to complex hierarchies or trickery:


    ![Image](images/20-1.jpg)


    But if traits are simply copied, how do you test whether a class is using them?
    In short, you do not. Although you have several ways to test for a trait’s inclusion
    in a class, the purpose of a trait is horizontal reuse. So a test, such as `instanceof`,
    might make sense from a stylistic perspective, but it does not accurately represent
    what a trait actually is. You can find a long discussion about this topic in a
    GitHub pull request (see [https://github.com/php/php-src/pull/23](https://github.com/php/php-src/pull/23)),
    where it was decided not to include that type of functionality. And as the next
    example shows, you might be more interested in whether the function exists than
    whether a certain trait exists. So, you can do this instead when testing for a
    required function:


    ![Image](images/20-2.jpg)


    Let’s take the situation to a little more hypothetical level. Suppose you have
    one trait that outputs XML and another one that returns the `DOMDocument` instead
    of just XML text. You might use this approach to inject CDATA nodes into the document,
    which SimpleXML will not write. The `Util\DOMDocument` trait will have a method
    that returns the properties as a `NodeList` as well as a `toXml()` method that
    returns a string.

    '
