- fmt: '

    Thankfully, protecting yourself against these kinds of attacks is easy. The first
    level of protection is to always use prepare statements. These statements create
    a two-step process for handling queries. The first step is to create the query
    with placeholders instead of actual data. The query is then passed to the database,
    and the database returns a unique reference to this query. After the driver receives
    the query, it can execute the statement by using data that is separate from the
    query. The execution will generally send the parameters to the database in a proprietary
    format that is unlikely to be exploitable.


    To illustrate this, let’s go back to the first `SELECT` statement:


    ![Image](images/136-1.jpg)


    Rather than injecting the `GET` parameter in the query, you provide a placeholder:


    ![Image](images/136-2.jpg)


    Next, you prepare the statement:


    ![Image](images/136-3.jpg)


    And then you execute it:


    ![Image](images/136-4.jpg)


    Now it does not matter what someone enters as the `GET` search parameter. The
    database will query against the value of that parameter only, even if someone
    tries to implement an SQL injection attack.


    The fix for the second attack, where someone can modify the `UPDATE` query, is
    simple as well. Remember the basic rules of secure web applications: validate
    input, filter output.


    The best method to protect against the kind of attack that we examined earlier
    is to explicitly define the columns that can be updated in a query and then use
    a prepare statement:


    ![Image](images/137.jpg)


    To dynamically generate column references in your code, you must explicitly validate
    your columns along with using prepare statements. The solution looks similar to
    this:


    ![Image](images/138.jpg)


    The code will first validate the form submission keys. Then, it will generate
    the SQL based on the filtered keys, but it will use the prepare statement placeholders
    instead of directly injecting the values. The previous code that explicitly defined
    the columns is best. But your code will decrease its vulnerability by adding this
    type of filtering.


    # Cross-Site Scripting


    Although SQL injection can be the most devastating type of attack, cross-site
    scripting is probably the easiest to implement. This is largely because data is
    often pulled from the database, the database is local, and we tend to trust local
    resources. You cannot consider that data trustworthy if it came from the outside—and
    less so if it was not validated before insertion. And there is no way to guarantee
    that data coming from the database has been properly validated. That also assumes
    that your validators caught all possible methods of injection.


    Cross-site scripting occurs when someone injects unintended content into a web
    application. This content is then displayed in the user’s browser and will typically
    modify the behavior of the page in some way that the developer did not intend.


    The most typical attack is to embed JavaScript on a page. The easiest way to do
    this is generally through some kind of free-form text field or text area—for example,
    a ”description” field or a “notes” field. Because they are free-form text, these
    fields usually do not have the same stringent data-format requirements. You need
    to leave them open not just for letters and numbers but also for punctuation,
    quotation marks, or various symbols.


    Consider a template for displaying a user-entry record (you will fill in the values
    rather than see the full exploit because that requires multiple HTTP requests
    to demonstrate).


    ![Image](images/139-1.jpg)


    Running this code generates the following HTML code:


    ![Image](images/139-2.jpg)


    Not a problem. But what happens if someone enters a description that contains
    some JavaScript?


    ![Image](images/140.jpg)


    This code is relatively benign, but it illustrates why this is a problem. Although
    the developer never intended for JavaScript to be executed there, the attacker
    can manipulate the page.


    The easiest way to protect against these types of attacks is to simply ensure
    that you have filtered any HTML-specific characters to their equivalent HTML entity.
    In other words, make sure that you filter any `<` to `&lt;` by running every outputted
    variable through the `htmlentities()` or `htmlspecialchars()` function. `htmlentities()`
    will convert each character to its HTML counterpart, whereas `htmlspecialchars()`
    will convert only a couple of more important characters. As such, using `htmlspecialchars()`
    is generally preferred.


    Basic validation and escaping is relatively simple. You can easily defang numbers
    passed as strings (as is always the case when retrieving them from an HTTP request)
    by casting them to a numerical type such as `int` or `float`. But a problem arises
    when some level of HTML is required to allow for highlighting, formatting, or
    the like.


    A couple of options are available to you. One of the more common alternatives
    is to permit the use of a different markup language to represent highlighting
    or formatting. `BBCode`, `Witext`, `Textile`, or `Markdown` are examples of text-based
    formats that expand to HTML after you enter them into the script. Because they
    do not use HTML-based formatting, these markup languages can help protect against
    the injection of HTML elements in the page. Additionally, many of them have WYSIWYG
    editors to hide the encoding from the user.


    Another option is to use libraries like `HTML Purifier`, which lets you easily
    set up a whitelist of valid HTML tags. You can build your own recursive HTML/DOM
    parser to manage your whitelist, but it is usually a good idea to default to using
    existing software and libraries unless you have a good reason not to. Out of the
    box, `HTML Purifier` protects you against many of the general attacks that will
    occur on an HTML-enabled input method.


    Let’s briefly look at some example code that shows how basic usage of `HTML Purifier`
    can filter out some dangerous HTML:


    ![Image](images/141-1.jpg)


    When you execute that code, you get the following output:


    ![Image](images/141-2.jpg)


    The first iteration shows a simple HTML paragraph tag. The second uses a span
    tag with CSS markup. The third iteration is injecting JavaScript into a paragraph
    tag. The fourth shows a paragraph tag being modified by adding a JavaScript event
    tag. In other words, the last iteration is injecting JavaScript without actually
    outputting a script tag.


    Running that code produces the following output:


    ![Image](images/142.jpg)


    As you can see, the safe paragraph is rendered the same way as is the safe span
    tag with CSS. However, the two dangerous HTML snippets have the hazardous parts
    removed, and the safe code is still presented.


    # Cross-Site Request Forgery


    Perhaps the most difficult to exploit attack in our list is the cross-site request
    forgery. In fact, only around 1 percent of successful attacks use this vector,
    compared with 17 percent for denial of service, 17 percent for SQL injection,
    and 7 percent for cross-site scripting[¹](#009_Chapter05.html#fn_1). However,
    because of what it can do, cross-site request forgery deserves serious consideration.


    Most descriptions of this attack are complex and end up obscuring the definition.
    So instead, we will consider a thought experiment.


    Say you are logged in to a bank’s website that receives an HTTP request from your
    browser requesting a transfer from one account to another. How does the bank website
    know whether the transfer was initiated because you clicked the mouse button or
    because an IFRAME was in a different browser window that used JavaScript to submit
    a form?


    There is no way of knowing for sure without some level of protection on the server.
    A browser can do little to protect against illegitimate JavaScript execution,
    so that protection will need to be on the server side.


    To help protect your application against a forgery of this type, you can use these
    five techniques:

