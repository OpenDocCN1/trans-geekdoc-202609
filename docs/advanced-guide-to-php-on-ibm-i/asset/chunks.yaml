    同样有趣的是，在我编写这个示例时，代码中的一个简单 bug 导致五个测试中的两个失败了。为了找出问题，我启动了一个调试单元测试，并逐行跳过了了应用程序运行异常的单行代码。诊断并修复这个
    bug 花了不到两分钟。因为测试是自动化的，我能够验证修复是有效的，并且所有其他测试仍然正常运行。我完成这些操作所需的时间，如果用传统的开发方法完成，至少会多出一个数量级。


    此外，所有测试都通过的感觉也让人感到满足。虽然失败的感觉可能不错，但成功显然更好。


    # 测试套件 (Test Suites)


    从调试的角度来看，单个测试非常有用，但单项测试只是步骤中的一部分。你还希望能够运行大量的测试，但随着时间推移，逐个运行测试可能会变得难以接受。`PHPUnit`
    允许你不仅可以一次运行一个测试，还可以运行一组测试。这种能力允许你组织测试并一次运行多个组测试。


    这样做需要创建一个新的测试套件类。运行单元测试时不需要创建这个类，但随着公司编写的测试数量增加，它将有助于组织工作。


    要创建一个新的测试套件，你需要创建一个继承自 `PHPUnit_Framework_TestSuite` 的新类。在构造函数中设置名称，然后添加你想包含此套件中的所有测试的完整类名。


    以下是一个将运行你之前定义的单元测试的测试套件示例：


    ![Image](img/219.jpg)


    随着你编写更多的测试，只需在包含该测试的各个套件中使用 `addTestSuite()` 方法将它们添加进来即可。当你运行测试套件时，输出结果将像图 7.7
    所示。


    ![Image](img/220-1.jpg)


    *图 7.7：运行测试套件的结果*


    此测试与之前运行的测试之间的唯一区别是，现在测试受 `testsSuite` 类的控制，而不是独立运行。


    # 注入依赖 (Injecting Dependencies)


    在移动到下一节之前，我们需要涵盖一个相当复杂的话题。然而，我们不会深入细节，而是从这个主题中挑选出一些最佳实践，并在下一节“处理数据源”中实现它们。


    这个主题是依赖注入（Dependency Injection），也称为控制反转（Inversion of Control）。这个主题可以引入许多复杂性，特别是当我们开始讨论依赖注入容器（`DI
    Container`）及其配置时。


    然而，作为一种概念，依赖注入是非常简单的。我们在第 2 章中讨论过它。首先，假设有一个数据库类：


    ![Image](img/220-2.jpg)


    现在让我们看看获取数据库连接的“旧”方法：


    ![Image](img/221-1.jpg)


    依赖注入（或控制反转）是这样做的：


    ![Image](img/221-2.jpg)


    就是这样。这就是依赖注入。与其让对象去获取它的依赖项（在此例中为数据库适配器），不如将依赖项提供给它。


    这导致了一个问题，因为现在每当你创建一个对象的实例时，都必须注入它的依赖。但具有众多依赖的对象可能需要多次调用该对象的 setter 方法。将此数量乘以在给定上下文中创建的对象数量，你会有大量的样板代码要写。于是，DI
    容器的想法运而生。


    DI 容器是一个对象，你可以在其中请求一个类，它将提供该类的实例，并完整配置好其所有的依赖项。它为你处理了这些繁重工作，但代价是配置。DI 容器对象的配置通常以困难著称。


    尽管依赖注入会为应用程序增加一些复杂性，但当你让应用程序具有可测试性时，它的用法将让你受益匪。


    # 处理数据源 (Working with Data Sources)


    讨论依赖注入的原因是，当你对应用程序进行单元测试时，你*不希望*需要数据库才能通过测试。记住，你测试的是“单元”而不是“系统”。一旦你开始测试系统，你就会陷入数据库设置和销毁的无尽循环，你的测试会慢如爬，你最终不得不服用某种形式的抗抑郁药来帮你撑到下午
    5 点。


    为了让你远离抗抑郁药，有一个概念叫做 `mock objects`（模拟对象）。这些对象看起来像你正在注入的对象，听起来像你注入的对象，尝起来也像，但它们并不是你正在注入的对象。


    当你看到用它们可以做什么时，这听起来就不那么疯狂了。


    你必须在单个单元测试类内部创建 mock 对象。该功能存在于 `PHPUnit` 内部，不会用于你的生产环境。Mock 对象仅用于单元测试。它们的目的是通过提供定义的返回值而不是执行逻辑，从而让你能够跳过在*被测试项之外*执行的复杂逻辑。换句话说，你可以指定一个外部依赖并自定义其行为，以便你正在测试的类所依赖的任何方法都不会执行，而是返回它们预期的值。


    为了说明 mock 对象是如何工作的，让我们创建另一个测试，简单地模拟 `Address` 对象：


    ![Image](img/223.jpg)


    首先，你在当前测试对象上调用 `getMock()`。有几个参数，但我们现在只检查前两个。第一个参数是你想要模拟的类名。第二个是你打算模拟的方法名。此方法返回一个被模拟对象的代理，你随后可以对其配置。


    开始，你告诉 mock 对象你期望做什么。这里，你没有特定的预期，所以指定 `self::any()`。然后，`expects()` 返回一个调用模拟器。从该对象，请求你想要配置的方法。在此例中，是
    `getState()`。然而，你也可以指示它在调用该方法时抛出异常，或者给 mock 对象多个值，以便不同的调用返回不同的结果。


    这个测试的最后部分是你调用该方法。记住，当原始 `Address` 对象在设置状态之前调用时，它将返回 null。这里，你正在测试它将返回 TX。


    当你运行测试时，通过了。


    让我们稍微修改测试。注意它包含 `self::any()`。你可以将 `self` 类中的方法替换为以下选项之一：


    *   `any()`

    *   `never()`

    *   `atLeastOnce()`

    *   `once()`

    *   `exactly(int $count)`

    *   `at(int $index)`


    将其改为 `never()` 看看发生什么：


    ![Image](img/224.jpg)


    这次当你运行测试时它失败了，因为你告诉测试你不预期 `getState()` 方法被调用（图 7.8](#011_Chapter07.html#fig7-8)）。


    ![Image](img/225-1.jpg)


    *图 7.8：调用 getState 导致测试失败*


    这个示例仅用于说明。因为你模拟了所测试的元素，这个测试没有用处。所以，让我们写一个有用处的测试吧。


    这样做，在原始 `Address` 类中添加一个从数据库加载对象的方法：


    ![Image](img/225-2.jpg)


    如你所见，示例使用了保护属性 `$conn` 的连接并创建了预处理语句。你执行语句并获取结果集。然后，你将结果集中的每个值赋值给类的内部属性。忽略其中的一些缺点，例如允许数据库任意设置类中的属性；这只是为了说明目的。


    '
- fmt: '

    One thing you do not want to do is have your unit tests touch the database. Databases
    can be updated and thus can change the results of the test. To work around that
    issue, you recreate the database each time you run the test suite. However, using
    this approach adds a tremendous amount of complexity to your testing scenarios.
    First, it will slow your tests. Second, the order of your tests will be incredibly
    important, because an out-of-order test can change the data in the database in
    a way that makes other tests fail.


    The work-around is to use the mock object functionality in PHPUnit to mock not
    just the object dependencies but also internal objects, such as a PDO database
    connection. The database connection is technically a dependency, is it not?


    To go about mocking the database connection, you override the methods that will
    be called in the `Address` class. If you plan to test the `load()` functionality,
    you must look in that method to determine what you need to mock. There, you can
    see that the method `prepare()` is called on the `PDO` object. That method returns
    an object of `PDOStatement`, which in turn has its methods `execute()` and `fetch()`
    called.


    So you need to mock `PDO::prepare()`, `PDOStatement:execute()`, and `PDOStatement::fetch()`.
    Let’s start backward by mocking the statement:


    ![Image](images/226-1.jpg)


    This mock will override the `execute()` and `fetch()` methods. Now, configure
    the `execute()` method and specify that `execute()` will simply return `true`,
    since that is what it would do in real life:


    ![Image](images/226-2.jpg)


    Next is the `fetch()` method:


    ![Image](images/227-1.jpg)


    Here, you are telling the mock that the `fetch()` method will return an array
    of data. This is your substitute result set.


    Now you need to mock the `PDO` object:


    ![Image](images/227-2.jpg)


