    你可以将设置与连接端口 `20080` 所报告的值进行匹配。


    # 隧道技术


    有时，远程服务器无法通过端口 `10137` 与 IDE 通信，因为通常设置了防火墙。通常，绕过防火墙限制的方法是通过经过允许的协议开启某种隧道。例如，当通过
    TCP/IP 连接到 MySQL 服务器时，你可以通过 Secure Shell (SSH) 连接到服务器，然后使用该连接打开另一个连接，通过现有连接发送数据以连接到数据库。


    在 Zend Studio 中，你可以进行类似的操作。但不是通过 SSH 连接，而是通过 HTTP 连接。你向一个连接到调试器的特定 URL 发送 HTTP
    请求，然后调试器通过 HTTP 连接往回发送调试数据，而不是尝试直接连接到你的机器。要实现这一点，向你的系统上传一个名为 `dummy.php` 的文件并将其放在文档根目录下。该文件的内容可以在你的
    Zend Server 安装中找到，但它看起来如下：


    ![Image](img/108-1.jpg)


    代码中执行了几项检查，但你感兴趣的调用是 `debugger_connect()` 函数。该函数调用启动了调试隧道。


    要在 Zend Studio 中启用隧道功能，点击 `Tunnel` 标签卡并选择 `Servers,` 如图 4.2 所示。


    ![Image](img/108.jpg)


    *图 4.2: Tunnel 标签卡*


    图 4.3 窗口将显示你用于调试的服务器。选择你要编辑的服务器。


    ![Image](img/109.jpg)


    *图 4.3: 用于调试的服务器*


    接下来，打开 `Tunnel` 标签卡并选择 `Enable`，如图 4.4 所示。


    ![Image](img/110-1.jpg)


    *图 4.4: Tunnel 标签卡中的启用*


    当你点击 `Enable` 按钮时，将显示使用的服务器。


    ![Image](img/110-2.jpg)


    *图 4.5: 选用的服务器*


    图 4.5 显示了 `dummy.php`，如果成功，连接将变为绿色。


    ![Image](img/111-1.jpg)


    *图 4.5: dummy.php*


    # 启动会话


    在 Zend Studio 中，启动会话最常见的方法是打开 `Run` 菜单并选择 `Debug` 如图 4.6 所示。


    ![Image](img/111-2.jpg)


    *图 4.6: Run 菜单中的 Debug*


    图 4.7 窗口将显示你要调试的 URL。


    ![Image](img/112-1.jpg)


    *图 4.7: 调试 URL*


    图 4.8) 提供了用于调试代码的视图。Magento（一个流行的 PHP 电子商务程序）是一个很好的实例，因为其中有很多复杂性。如果你不知道 Magento，不用担心。


    ![Image](img/112-2.jpg)


    *图 4.8: 视图*


    在 `Debug` 视图中，还有一个 `Debug` 视图。如图 4.9 所示，`Debug` 视图包含了当前停止位置的堆栈跟踪以及一些基本控制。


    ![Image](img/113-1.jpg)


    *图 4.9: Debug 视图*


    它显示了调用深度。这对于确定你目前位于程序的哪个位置有用。


    # 执行控制


    `Debug` 视图的另一部分是控制部分（图 4.10）。该部分允许你控制程序的执行。默认情况下，调试器会在第一行代码处停止，你可以从开始调试请求。从那里，你需要使用这些控制告诉调试器如何继续。


    ![Image](img/113-2.jpg)


    *图 4.10: Debug 视图中的控制部分*


    按顺序，控制项如下：


    *   移除所有已终止的任务

    *   恢复（快捷键 **F8**）

    *   暂停

    *   终止（快捷键 **CTRL+F2**）

    *   断开（对 PHP 不适用）

    *   单入（快捷键 **F5**）

    *   单步（快捷键 **F6**）

    *   单出（快捷键 **F7**）


    最后两项“帧帧”和“使用单步过滤器”不用于 PHP 调试。


    '
- fmt: '

    Manually stepping through an entire program to the section of code that you want
    to execute can be time consuming. So setting a breakpoint lets you jump ahead
    to a specific place in the code. Clicking `Resume` or pressing `F8` will continue
    execution until either a breakpoint is reached or the program has completed running.
    Most of this should sound familiar because it is all similar to how the `IBM\
    i\ Debugger` functions.


    The second instance where you would use `Resume` is when you have completed debugging
    your code and would like to let the current request finish executing. The engine
    will continue running until the request is finished unless a breakpoint is reached
    or the execution is paused.


    `Suspend` is used when the engine is currently running and you want to stop it
    at the current point in time. Generally, you will not use this control much unless
    you want to periodically check on a runaway loop. The `Suspend` control is more
    useful for debugging a Java process or something that is long lived. In PHP, this
    would be some kind of CLI program or socket server. But those types of programs
    are not generally built by using PHP, so you probably will not use `Suspend` often.


    `Terminate` is used to stop the current request from executing. It is basically
    the same as putting an `exit()` call in your code. However, when you terminate
    a request, shutdown hooks will not be run. You will usually use this control in
    debugging a scenario where, if you continue debugging, you will modify data outside
    the program. This scenario can include database inserts, cache updates, or something
    similar where continued debugging leads to undesirable actions.


    The next three options are program flow operations and are basically the point
    of having a debugger. They let you step through the program line by line and watch
    what is happening.


    `Step Into` will follow the program execution flow into any functions or methods
    that are called on the current line ([Figure 4.11](#008_Chapter04.html#fig4-11)).
    It is the same as `F22` in the `IBM\ i\ Debugger`. When you “step into” a line
    of code, if the code does not have nested calls, the debugger has nowhere to go.


    ![Image](images/115-1.jpg)


    *Figure 4.11: Current line of code and nested calls*


    However, when a function or method call is made, as in [Figure 4.12](#008_Chapter04.html#fig4-12),
    “stepping into” will dive into that function and show the execution flow in that
    line of code.


    ![Image](images/115-2.jpg)


    *Figure 4.12: Calling a function*


    The code inside the function call will execute until it is complete and then return
    as normal ([Figure 4.13](#008_Chapter04.html#fig4-13)).


    ![Image](images/116-1.jpg)


    *Figure 4.13: Specifying output to complete function call*


    `Step Over` is similar to `Step Into` except that when the current execution is
    a function or method call, the debugger will not step into it. It will execute
    the function, but not go into it. This is useful when you do not need to dive
    into the complete execution flow of the request because you already know what
    is happening in the function, or what is happening is not pertinent to the task
    at hand. Stepping over lets you bypass that. `Step Over` is similar to `F10` in
    the `IBM\ i\ Debugger`. If you want to return from a function immediately, you
    can use `Step Out`.

    '
  raw: 'Manually stepping through an entire program to the section of code that you
    want to execute can be time consuming. So setting a breakpoint lets you jump ahead
    to a specific place in the code. Clicking **Resume** or pressing **F8** will continue
    execution until either a breakpoint is reached or the program has completed running.
    Most of this should sound familiar because it is all similar to how the IBM i
    Debugger functions.


    The second instance where you would use **Resume** is when you have completed
    debugging your code and would like to let the current request finish executing.
    The engine will continue running until the request is finished unless a breakpoint
    is reached or the execution is paused.


    *Suspend* is used when the engine is currently running and you want to stop it
    at the current point in time. Generally, you will not use this control much unless
    you want to periodically check on a runaway loop. The **Suspend** control is more
    useful for debugging a Java process or something that is long lived. In PHP, this
    would be some kind of CLI program or socket server. But those types of programs
    are not generally built by using PHP, so you probably will not use **Suspend**
    often.


    *Terminate* is used to stop the current request from executing. It is basically
    the same as putting an exit() call in your code. However, when you terminate a
    request, shutdown hooks will not be run. You will usually use this control in
    debugging a scenario where, if you continue debugging, you will modify data outside
    the program. This scenario can include database inserts, cache updates, or something
    similar where continued debugging leads to undesirable actions.


    The next three options are program flow operations and are basically the point
    of having a debugger. They let you step through the program line by line and watch
    what is happening.


    *Step Into* will follow the program execution flow into any functions or methods
    that are called on the current line ([Figure 4.11](#008_Chapter04.html#fig4-11)).
    It is the same as **F22** in the IBM i Debugger. When you “step into” a line of
    code, if the code does not have nested calls, the debugger has nowhere to go.


    ![Image](images/115-1.jpg)


    *Figure 4.11: Current line of code and nested calls*


    However, when a function or method call is made, as in [Figure 4.12](#008_Chapter04.html#fig4-12),
    “stepping into” will dive into that function and show the execution flow in that
    line of code.


    ![Image](images/115-2.jpg)


    *Figure 4.12: Calling a function*


    The code inside the function call will execute until it is complete and then return
    as normal ([Figure 4.13](#008_Chapter04.html#fig4-13)).


    ![Image](images/116-1.jpg)


    *Figure 4.13: Specifying output to complete function call*


    *Step Over* is similar to **Step Into** except that when the current execution
    is a function or method call, the debugger will not step into it. It will execute
    the function, but not go into it. This is useful when you do not need to dive
    into the complete execution flow of the request because you already know what
    is happening in the function, or what is happening is not pertinent to the task
    at hand. Stepping over lets you bypass that. **Step Over** is similar to **F10**
    in the IBM i Debugger. If you are familiar with procedures and functions in RPG
    and using **F10** to step through the code that executes those procedures, then
    you have the gist of the **Step Over** function.


    *Step Return* is used less frequently than **Step Into** or **Step Over.** If
    you have seen what you need to in a function or method call and want to return
    to a previous point in the code, you can use **Step Return.**


    # Variables


    So far, we have looked at navigation within the execution flow. However, the benefit
    of debugging is that not only can you follow that flow, but you can also examine
    the values for the variables present at the current line of code. Consider the
    following code:


    ![Image](images/116-2.jpg)


    When you execute this code, the system will automatically pause on the first line.
    Then, you open the **Variables** view in [Figure 4.14](#008_Chapter04.html#fig4-14)
    to see a list of the variables.


    ![Image](images/117.jpg)


    *Figure 4.14: Variables view displaying superglobal variables*


    These are obviously the superglobals that are available anywhere in the program.
    The exceptions are $argv and $argc. These two variables, which you access via
    the command-line interface, show that you are running this example directly from
    within Zend Studio and not on a web server. Also notice that the variable $\_SERVER
    has 57 elements. As [Figure 4.15](#008_Chapter04.html#fig4-15) shows, you can
    expand this view to see all of the variable’s members.


    ![Image](images/118-1.jpg)


    *Figure 4.15: Expanded view of $\_SERVER variable*


    Next, step over the line of code where the object instantiation occurs. In [Figure
    4.16](#008_Chapter04.html#fig4-16), you see that you have an instance of type
    MyClass and its default property values.


    ![Image](images/118-2.jpg)


    *Figure 4.16:* MyClass *displayed with its default property values*


    When you step over the next line where the child object is created, you see that
    value added as well ([Figure 4.17](#008_Chapter04.html#fig4-17)).


    ![Image](images/119-1.jpg)


    *Figure 4.17: Child object and its property values*


    Next, step into the doSomething() function call. [Figure 4.18](#008_Chapter04.html#fig4-18)
    shows that your context includes only the $obj variable. You step over the instruction
    to set the value for property and see that change reflected in the variable values.


    ![Image](images/119-2.jpg)


    *Figure 4.18: Variables view displaying only* $obj *variable and its property
    values*


    Now when you step over, you will exit the function call and return to the mainline
    code. But before $someObj->property is assigned to $a, you can change the value
    of $someObj->property from within your debugger, as [Figure 4.19](#008_Chapter04.html#fig4-19)
    demonstrates.


    ![Image](images/120-1.jpg)


    *Figure 4.19: Changing value of* $someObj->property


    And now when you assign the value to $a, you see the new value that you manually
    entered ([Figure 4.20](#008_Chapter04.html#fig4-20)).


    ![Image](images/120-2.jpg)


    *Figure 4.20: Variables view displaying the new value of* $a


    # Expressions


    You might have noticed in the function call doSomething() that you were missing
    the superglobals. They were there, but they were not listed. Sometimes this happens,
    or sometimes you want to highlight certain variables outside of the full list.
    To do this, open the **Expressions** view ([Figure 4.21](#008_Chapter04.html#fig4-21)),
    and enter the name of the variable that you want to see.


    ![Image](images/121-1.jpg)


    *Figure 4.21: Entering the* $\_SERVER *variable in the Expressions view*


    Now that you have entered the variable name in this view, notice that none of
    the other variables are displayed. This value will always be shown but might not
    be populated, depending on the context of the current line of execution. Superglobals
    will always be displayed because they are superglobals. But normal variables,
    which you can also specify, might be shown as null if they are not defined in
    the current scope.


    # Breakpoints


    In simple programs, stepping through the execution flow is often enough. However,
    after you get beyond a few hundred lines of code, this becomes a bit confusing
    to handle. When code exceeds multiple thousands of lines, stepping through them
    becomes almost unbearable. Breakpoints let you define places in the code where
    you want the debugger to stop. By using breakpoints, you can basically skip all
    the stuff you already know and get to what is important. So rather than stepping
    over all the code, you simply select **Run (F8),** and the debugger will automatically
    stop at the breakpoint.'
