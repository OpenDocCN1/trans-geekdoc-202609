  raw: 'To solve this issue, you can compare the input with a list of known good files.
    The list can be static or generated from everything that is on the file system.
    Both are valid means of protecting yourself.


    ![Image](images/148.jpg)


    Here, the code first checks whether the resolved path to the requested page is
    in the scripts directory, and then it checks whether it is a file as opposed to
    simply existing. Using file\_exists() would probably be sufficient, but it is
    a good practice to be as specific as you can when filtering input from the outside
    world.


    This paranoia should extend to the inside world as well. Some of the more interesting
    attacks I have seen are done because internal functionality trusts the code that
    is calling it. And I have seen these attacks on very solid, very mature code bases.
    Usually, a successful exploit will require access to the source code because these
    kinds of attacks are a little more complicated.


    The following example mixes our concerns (HTML and classes) and ignores the SOLID
    principles, for the sake of brevity. Additionally, the code will not work as is;
    it is intended as an example only. The following code will create a class called
    SecurityLevels, which will retrieve the available security levels for the current
    administrative user and print the HTML for selecting those levels:


    ![Image](images/149-1.jpg)


    If the request is a POST, you will need a new service class that implements the
    functionality to update the user. The class looks like this:


    ![Image](images/149-2.jpg)


    So looking at those two sections of code, where is the vulnerability? It is not
    SQL injection.


    The code is vulnerable because the UserService does not validate that the security
    level specified in UserService::setSecurityLevel() matches what the class SecurityLevels
    provides in the <SELECT> element.


    The solution is to ensure that before saving the change to the database, you validate
    that the current user has permission to set the level to his or her specification.


    Otherwise, the system might be vulnerable to a privilege escalation attack, allowing
    unscrupulous users to increase their level of access by bypassing internal protections.
    Although the following solution is inelegant and not sound from an architectural
    perspective, it illustrates the step required to protect this class from vulnerability:


    ![Image](images/150.jpg)


    These changes retrieve the current user and the corresponding security levels
    that the user can choose from. The code then checks whether the level provided
    as a parameter is in the list of allowed levels. If it is not, the code throws
    a security exception.


    Although this example is not perfect in its architecture, it does demonstrate
    the importance of placing data validation as close to the end logic as possible.
    That validation can occur sooner to generate warning messages and such. But some
    kind of validation should happen within a method or function that is called from
    an external source, be it a server around the world or code that is not part of
    the class. As a developer, presupposing that incoming data in a method call is
    valid is a quick way to expose your application to malicious behavior.


    # Predictable Locations and Dangerous Files


    This subject is fairly self-explanatory, so for me to write a lengthy dissertation
    on it would be a disservice, in my humble opinion. One of the simplest ways to
    discover a vulnerable machine is to look for predictable files that are in predictable
    locations.


    It is often easy to find a phpinfo.php page (or p.php page), which contains the
    call to phpinfo(). Although phpinfo() is a useful debugging tool for validating
    the configuration of your system, it has no business being on a production system.
    If you must have it there, make sure the production system has the file under
    password protection.


    The output of phpinfo() provides a wealth of information. In a few cases, you
    can find the database username and password. Most applications nowadays specify
    the database connection initialization, but you can also state it in php.ini,
    which makes your database connection information viewable in phpinfo().


    Another reason that you do not want phpinfo() publicly facing is that doing so
    gives attackers ideas on how to approach your site. For example, if an attacker
    sees that display\_errors is turned on, that attacker might try to induce the
    site into an error condition to reveal some internal information. Or if your server
    is behind a firewall, an attacker might use the output for $\_SERVER\[“SERVER\_ADDR”\]
    to obtain internal information about your network.


    Want to find sites on the Internet that are doing this? Do a Google search for
    inurl:phpinfo. Although you will need to scroll through a few pages, you will
    find the pages listing these sites within a few seconds.


    Another possible issue (separate from phpinfo()) can arise if you use .inc files
    for your PHP code. Because Apache does not recognize db.inc as a PHP file, it
    will return that file as text, displaying your database connection information.
    The same thing will happen if you have a file called include.inc in your PHP.
    Do not be creative with your file naming; instead, use the same old, basic, boring
    file names that end with .php.


    Using text files for data storage in the document root is also a bad idea. Including
    logs in the document root is a bad idea as well. Storing anything important in
    your document root is a poor practice. If you store critical data in the document
    root, that data might now, if not later, be accidentally available for download
    to a third party, and that is something you want to avoid.


    # Using Encryption


    PHP does not implement any sort of internal encryption. Instead, you use third-party
    libraries, which are linked to the PHP binary, to handle this task. We will look
    at two different activities that you can use the cryptography integration in PHP
    for: hashing and symmetric key encryption. We could examine public key encryption
    as well, but because it facilitates encryption between two untrusted parties,
    you most likely will not use it in your application. Yes, you will probably use
    it in HTTPS, but that occurs before PHP gets involved.


    # *Hashing*


    Hashing is a mechanism that repeatedly calculates one value into another value,
    which is (presumably) impossible to decipher, but whose hashed output will always
    be the same for the same value.


    To illustrate this, one possible use is to do searches on anonymized data. Consider
    one organization that has data it wants to share with another organization, but
    only the information that is common between the two organizations. If both organizations
    have a requirement to share only what they have in common but keep separate what
    they do not, using standard queries can be problematic. The source organization
    cannot give open access to the recipient organization because doing so opens its
    data. And the recipient organization does not want to do plain searches because
    that will reveal its information when it conducts the searches. To solve this
    problem, search for the hashed values instead of the normal values. Because a
    hash in theory is irreversible, and because its result will always be the same,
    sending a hashed value instead of the real value allows for the matching of data
    but does not constitute data leakage.


    The most common usage of hashing functionality is that of password management.
    No matter how secure your database is, you should never risk compromising security
    by storing user passwords in plain text. If they are compromised by either an
    unknown attacker or an employee leaving the company, you would prefer that those
    passwords not be out in the open. So as a matter of best practice for the security
    of your system and your customers, you do not want to be storing your passwords
    in clear text, right?'
