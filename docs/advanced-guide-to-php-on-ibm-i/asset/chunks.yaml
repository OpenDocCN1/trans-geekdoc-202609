    *图 8.4：选择端口类型*


    如图 8.5 所示，通过选择 `NewPortType` 创建新服务。该服务将是你的客户端连接的端点。


    ![Image](img/242-2.jpg)


    *图 8.5：创建端口类型*


    由于该操作没有输入参数，你可以通过删除它们来配置，但 SOAP 认为它会自动处理很多。


    ![Image](img/243-1.jpg)


    *图 8.6：删除输入参数*


    接下来，通过选择 `NewPortType` 定义方法，如图 8.7 所示。


    ![Image](img/243-2.jpg)


    *图 8.7：设置方法名称*


    如图 8.8 所示，选择 `NewPortType` 将创建端口类型。


    ![Image](img/244-1.jpg)


    *图 8.8：创建端口类型*


    如图 8.9 所示，选择 `SOAP` 协议以生成绑定。


    ![Image](img/245-1.jpg)


    *图 8.9：选择 SOAP *


    如图 8.10 所示，右键点击并选择 `Set Type`。


    ![Image](img/245-2.jpg)


    *图 8.10：设置返回类型*


    如图 8.11 所示，点击 `Generate Binding` 将生成绑定。


    ![Image](img/246-1.jpg)


    *图 8.11：生成绑定*

