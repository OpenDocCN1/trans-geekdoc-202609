    此示例使用了反射（reflection），以便你可以在实例化类之前测试类继承。这是实例化类最安全的方法。如果请求的任务是 `AbstractJob` 的子类，你将创建该任务的新实例并提供
    `PDO` 和 `ToolkitService`。然后，你执行任务并捕获结果或异常，按照前面的描述处理两者。


    ### 客户端


    现在移动到客户端，你将创建一个名为 `JobQueueManager` 的类。该类将负责与任务队列进行交互。在这里封装该功能将使你的内联代码整洁得多。该类有两个任务：(1)
    在队列中启动任务执行，(2) 获取结果：


    ![Image](img/311-2.jpg)


    在实例化 `JobQueueManager` 类时，你必须提供之前代码可以访问的 URL 端点。如果你想执行任务，调用 `call($job, $params)`
    方法。该方法将任务插入队列并返回一个任务 ID。你稍后将使用该任务 ID 来获取任务的结果。


    要获取任务，调用 `getResult($jobId)` 方法。如果任务尚未启动或执行完成，它将返回 `null`。然而，如果任务已完成，它会解析结果并返回请求。同样，如果发生错误，任务将解析结果并抛出异常。你必须解析结果，因为
    `Job Queue` 将整个 HTTP 结果存储在状态输出中，因此你必须在反序列化之前提取 HTTP 实体。


