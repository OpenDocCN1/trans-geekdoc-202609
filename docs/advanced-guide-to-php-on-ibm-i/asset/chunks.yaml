  trans: "\n然而，我们所指的标准是 `ECMA 262`，或 `ECMAScript`。你可能更熟悉它是 `JavaScript`。`ECMA 262`\
    \ 定义了使用名为 `JavaScript Object Notation`（JavaScript 对象表示法）的结构来处理序列化数据。尽管该标准旨在用于浏览器的通信，但\
    \ `JSON` 现在是主流的 Web 服务远程过程调用（RPC）结构之一。最著名的用法是 Twitter 和 Facebook 作为其 Web 服务 API\
    \ 接口的一部分。\n\n`JSON` 原生六六数据类型：`number`、`string`、`Boolean`、`array`、`object` 和 `null`。数据类型的确定在很大程度上取决于它们在标记中的表示方式。字符串带有引号。数组带有方括号。对象带有包含键值对的大括号。布尔值为\
    \ `true` 或 `false`，不进行字符串封装。数组是一个没有字符串封装的数值。`JSON` 值中的各个值之间用逗号分隔。由于这些值与 `PHP`\
    \ 的数据类型紧密对应，因此两者之间的转换是自然而然的。\n\n考虑以下代码：\n\n![Image](img/249-1.jpg)\n\n当你运行代码时，你会得到以下输出（为了清晰添加了换行符和制表符）：\n\
    \n![Image](img/249-2.jpg)\n\n第一层是一个数组，因此有方括号。如果你使用 `JSON` 来编码一个字符串，将不会看到方括号。数组中的第一个值是字符串。第二个是数字。第三个值是\
    \ `null`，第四个是 `Boolean`。第五个是一个数值数组。第六个值是一个 `JavaScript` 对象，它翻译为关联数组。\n\n作为一种格式，`JSON`\
    \ 易读、易写，并且不需要复杂的处理器就能将序列化字符串转换为可用的对象。它的解析速度也很快，但有时没有解析 `XML` 快。人们通常认为因为 `XML`\
    \ 具有 `XSS`、`XSLT`、命名空间（namespaces）、`DTDss` 等，所以它的速度会更慢。但只有在你使用这些功能时才会如此。基础的 `XML`\
    \ 解析与 `JSON` 并没有太大区别。`JSON` 确实能让你从字节数的角度创建更高效的数据序列化，但由于 `XML` 解析器经过了高度优化，它们通常可以比\
    \ `JSON` 更快。\n\n关于功能的讨论呈现了另一个有趣的点。`JSON` 没有验证功能。换句话说，验证 `JSON` 文档的唯一方法是程序化的（或手动操作的）。在处理\
    \ `JSON` 解析时间时，你还必须考虑这种逻辑。`XML` 解析器在验证能力方面经过了极优化，而 `JSON` 则没有那么优化，因为它没有该功能。\n\n\
    此外，`JSON` 被使用的原因之一是它比 `XML` 更简洁。理论认为由于 `JSON` 需要的标记较少，文档会更小。除非你使用了压缩（大多数 Web 服务器都应该自动执行），否则这是事实。在加入压缩后，`JSON`\
    \ 文档实际上可能比 `XML` 文档大。这并不是绝对定的，但如果 Web 服务器自动压缩输出且浏览器支持它，那么感知到的尺寸优势可能就无法实现。\n\n\
    尽管如此，`JSON` 仍然是用于浏览器和服务器之间往返数据的极佳机制。原因并非源于速度、验证或大小，而是因为 `JSON` 提供了与 `PHP` 基本类型大致相似的数据类型，并且它是浏览器中的自然组件。正因如此，你可以从浏览器向服务器传递松散类型的数据。\n\
    \n在构建基于 `JSON` 的服务时，你通常以类似于 REST 的方式进行。开发者经常使用 `URLs` 将请求映射到各种服务类上。虽然这不是强制要求的，但使用这种映射技术有助于将应用程序划分成更小的部分，并使其更具预测性。但由于缺乏强有的标准（像\
    \ `SOAP` 那样的），任何深入的示例可能用处不大。因此我们将查看一个可以作为起点的简化示例。\n\n此示例假设存在 URL 重写，会将单个 URL 路径映射到单个引导文件。如果你使用\
    \ `Apache`，可以在 `.htaccess` 文件或你的 `httpd.conf` 文件执行该映射：\n\n![Image](img/251-1.jpg)\n\
    \n你可以在 `Location` 或 `Directory` 配置选项中配置，或者在 API 目录（例如 `/api`）的 `.htaccess` 文件中配置。\n\
    \n虽然通过 `GET` 请求检索信息以便进行缓存更好，但为了简单起见，我们将通过 `POST` 请求传递所有信息。否则示例示例需要考虑 `GET` 和 `POST`\
    \ 请求，那会变得更加冗长。\n\n在处理 `JSON` 时，人们通常会构建自己的服务器。他们可以使用 `PHP` 来构建它。\n\n```php\n//\
    \ 基于 JSON 的服务示例\nabstract class AbstractService {\n    protected $db;\n    public\
    \ function setPdo($pdo) {\n        $this->db = $pdo;\n    }\n    public function\
    \ isAllowed() {\n        return true;\n    }\n}\n```\n"
- fmt: '

    At this point, you iterate over the remaining parts of the URL and normalize them,
    using `ucfirst()` to change the case to a name that resembles your class structure.
    After you have built the class, you call `class_exists()`. If the class does not
    exist, `class_exists()` will automatically call the autoloader and load the class.
    Instead of simply instantiating, you call this function so you can send a “404
    Not Found” error if the class exists, rather than having to deal with a fatal
    error that would occur if you were to blindly instantiate the object without the
    `class_exists()` check.


    Now that you have created the service object, you map the existing call onto the
    method. You will do that with a method called `prepareParams()` in the `Handler`
    class:


    ![Image](images/255.jpg)


    This method first reads the contents from the HTTP input (presuming that all methods
    are being called via a `POST` and that all properties are being sent as a `JSON`
    object). So for this example, if you have parameters called `param1` and `param2`,
    you would specify them by creating the following JSON string:


    ![Image](images/256-1.jpg)


    You might be wondering why you are using reflection here. Wouldn’t it be easier
    to simply call `call_user_func_array()` and be done with it? The answer is yes,
    if you do not care about the ordering of the parameters, or if a method declaration
    has optional parameters. So you iterate over the method parameters in the order
    that they are defined and check the resulting JSON values for a match. If the
    parameter is required but not provided, you immediately fail with a “400 Bad Request.”
    If the parameter is optional (missing) but not required, set it to `null`. Otherwise,
    you provide the JSON-supplied value.


    The final method to define is `handle()`. It is responsible for calling `getServiceCallback()`
    to retrieve the instance of the class, for calling `prepareParams()` to retrieve
    the parameters, and for calling the method on the object and serializing the results:


    ![Image](images/256-2.jpg)


    After retrieving the callback, you validate that the callback object is an instance
    of the `Service\AbstractService` class. If it is, you set the database adapter.
    Next, you check whether the method is callable and that the class will allow that
    method to be called. If the method is not callable, you set the HTTP header to
    `403 Forbidden` and exit. Try to use as much of the HTTP protocol as you can,
    and try to minimize the “uniqueness” of your API.


    If all the tests pass, you call `prepareParams()` to normalize the data as the
    callback requires and call the callback. You set the HTTP `Content-Type` header
    to `application/json`, the proper content type for JSON content, and echo the
    serialized JSON data.


    The last step is to call `handler()`:


    ![Image](images/258-1.jpg)


    This is the base for creating a `JSON`-based web service. As with `REST`, libraries
    will handle some of this process for you, but they are generally not as robust
    as `REST`. And as noted earlier, few universal RPC standards exist for `JSON`.


    So now that you have the base for your service calls, you need to create a class
    that you can call. Instead of placing the class definition in the `/lib` directory,
    you will put it in the `/services` directory. By doing so, you can differentiate
    between a typical library class and the service classes. Your autoloader will
    handle this differentiation.


    Let’s start with a basic example:


    ![Image](images/258-2.jpg)


    The class name is `PublicService\Basic`. The class extends `AbstractService` but
    does not override any of the methods because you do not need any additional functionality.
    To call this method, go to `http://{hostname}/{api-base}/{service-name}/{method-name}`.
    In my case, it is `/api`, which is just inside the document root: `basic` and
    then `date`. Remember that, as a protection against outsiders calling methods
    like `setPdo()`, you append any public method with `Action`. To test this class,
    you call `http://localhost/api/basic/date`.


    When you call the method, you get the following output:


    ![Image](images/259.jpg)


    The output can be easily parsed by any language’s `JSON` parser.


    That was a simple test that you can run as a `GET` or `POST` request because it
    had no parameters.


    # Version Negotiation


    Unless your web service API will never change (and do not presume that it will
    not), you will need a way to determine which API version a client must use. One
    of the more common approaches is to determine which API version a client must
