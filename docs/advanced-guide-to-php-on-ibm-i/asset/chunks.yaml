    the parameters, and for calling the method on the object and serializing the results:


    ![Image](images/256-2.jpg)


    After retrieving the callback, you validate that the callback object is an instance
    of the Service\\AbstractService class. If it is, you set the database adapter.
    Next, you check whether the method is callable and that the class will allow that
    method to be called. If the method is not callable, you set the HTTP header to
    403 Forbidden and exit. Try to use as much of the HTTP protocol as you can, and
    try to minimize the “uniqueness” of your API.


    If all the tests pass, you call prepareParams() to normalize the data as the callback
    requires and call the callback. You set the HTTP Content-Type header to application/json,
    the proper content type for JSON content, and echo the serialized JSON data.


    The last step is to call the handler():


    ![Image](images/258-1.jpg)


    This is the base for creating a JSON-based web service. As with REST, libraries
    will handle some of this process for you, but they are generally not as robust
    as REST. And as noted earlier, few universal RPC standards exist for JSON.


    So now that you have the base for your service calls, you need to create a class
    that you can call. Instead of placing the class definition in the /lib directory,
    you will put it in the /services directory. By doing so, you can differentiate
    between a typical library class and the service classes. Your autoloader will
    handle this differentiation.


    Let’s start with a basic example:


    ![Image](images/258-2.jpg)


    The class name is PublicService\\Basic. The class extends AbstractService but
    does not override any of the methods because you do not need any additional functionality.
    To call this method, go to http://{hostname}/{api-base}/{service-name}/{method-name}.
    In my case, it is /api, which is just inside the document root: basic and then
    date. Remember that, as a protection against outsiders calling methods like setPdo(),
    you append any public method with Action. To test this class, you call http://localhost/api/basic/date.


    When you call the method, you get the following output:


    ![Image](images/259.jpg)


    The output can be easily parsed by any language’s JSON parser.


    That was a simple test that you can run as a GET or POST request because it had
    no parameters.


    # Version Negotiation


    Unless your web service API will never change (and do not presume that it will
    not), you will need a way to determine which API version a client must use. One
    of the more common approaches is to determine the API’s version based on the URL
    that is being used. To do this, you append, prepend, or plop the version of the
    API somewhere in the URL of the request. So /api/basic/date would turn into /api/1.0/basic/date.


    Although this probably is not the most appropriate way to specify an API version,
    it is one of the most foolproof. To see why, let’s look at another, more pure,
    technique and compare the differences.


    It all comes down to theory. Should a resource locator, such as a URL, have versioning
    information built into it? In theory, no. I actually agree with the theory here.
    A URL is a locator, not an API handle. As such, when you put the version of the
    API that you are calling into the URL, you are mashing up responsibilities.


    In a well-defined HTTP API, the API version should be sent as part of the HTTP
    header. This lets the client and the server *negotiate* which version of the API
    to use. The question is, what is the best way to handle versioning? There are
    basically two standard ways you can go about doing this.


    The first is through a nonstandard HTTP header. X-based HTTP headers were used
    in the past to denote nonstandard HTTP headers that were sent. In this case, an
    HTTP header for a version might look like X-API-Version: 1.0. The problem with
    this approach was that some of these nonstandard HTTP headers were making their
    way into general use and were becoming pseudo-standards.


    So the X-based headers were deprecated in June of 2012 in favor of several other
    different methods. The most interesting one is the use of the vendor-based HTTP
    header, which prefixes the HTTP header with vnd. So the website eschrade.com might
    be


    ![Image](images/260-1.jpg)


    That is one way of specifying the version.


    Another, possibly more interesting, way of handling versioning is by using the
    Accept HTTP header. Generally, the browser uses the Accept header to inform the
    server about the kind of content it is willing to accept. Here, you are telling
    the server which API version you will accept.


    This method should typically use the vnd, or vendor, prefix when determining the
    Accept type. So the website eschrade.com would look something like this:


    ![Image](images/260-2.jpg)


    What would this look like in practice with a version 1.0 and 1.1 API?


    First, you need to add the v1.0 and v1.1 directories to your /services directory.
    This is how you would separate the classes for each:


    ![Image](images/260-3.jpg)


    In the 1.0 instance of the PublicService\\Basic::dateAction() method, you used
    a simple date(‘r’) as the value. However, in the 1.1 instance, you will use the
    ATOM version:


    ![Image](images/261-1.jpg)


    To handle the new versioning logic, you add a new protected variable called $apiVersion.
    It will default to the newest version (though you could easily build some logic
    to automatically choose the highest version). Then, you will create a new method
    that processes the version portion of the request:


    ![Image](images/261-2.jpg)'
