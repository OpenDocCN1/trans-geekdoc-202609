    Like `SoapClient`, the first parameter is a WSDL. However, you are currently running
    in WSDL-less mode, so you define the `uri` as one of the options. The `URI` provides
    the namespace for the body response. When using functions instead of classes,
    you must individually include all the functions that will be used to respond to
    the client.


    The server generates a response similar to this (again, formatted for clarity):


    ![Image](images/238-2.jpg)


    Note that the response is defined in a `Response` node under the body node. This
    is largely uninteresting, however, because it happens behind the scenes. But if
    you need to see what is occurring, you can use a little-used setting on the client:


    ![Image](images/239-1.jpg)


    This setting lets you use another function called `getLastResponse()`, which will
    output the XML document that was received from the server. This is useful for
    debugging.


    ![Image](images/239-2.jpg)


    Although functions are easier to implement for smaller web services, they also
    become more complicated as the API requirements grow. You can add a simple class
    by defining the class and then using the `setClass()` method on the `SoapServer`
    instance:


    ![Image](images/239-3.jpg)


    If you were to run your client code against this server, the code would operate
    exactly as it previously did. You could continue this track, but it would result
    in increasing complexity to the point of nonsense. You can do much to configure
    the SOAP objects programmatically, but one of the benefits of SOAP is that it
    is supposed to document and manage a lot of this on its own.


    # WSDL-Based Operations


    You generally perform WSDL-based operations via a WSDL file. WSDL provides the
    definition of all the types, return values, and parameters for every method available
    at the given endpoint. Often, WSDL files are generated manually, though only by
    people who dislike their families and prefer to stay at work until midnight each
    day. Zend Studio provides a graphical interface for generating these files, though
    the interface is not installed by default in later versions. If you have a later
    version of Zend Studio, you might need to select the interface from the welcome
    screen as an option to install. The graphical interface is easy to use for most
    WSDL files.


    The first step is to create the WSDL file in the location where you want it to
    exist. Then, double-click to open the WSDL editor. At that point, you should delete
    all the entries in the editor because they will contain default information. You
    can use this default information as a starting point if you wish, but we will
    be beginning from scratch for the example.


    Start by right-clicking the editor window. Next, create a new service by selecting
    `Add Service`, as [Figure 8.1](#012_Chapter08.html#fig8-1) shows. This service
    will be the endpoint that your client will be connecting to.


    ![Image](images/241-1.jpg)


    *Figure 8.1: The Add Service option*


    Now, give the endpoint the URL that the client will be making its HTTP requests
    on. In this case, it is `http://localhost/soap/server.php` ([Figure 8.2](#012_Chapter08.html#fig8-2)).


    ![Image](images/241-2.jpg)


    *Figure 8.2: URL that the endpoint will receive*


    After you have set up the service, you will need to create a new binding ([Figure
    8.3](#012_Chapter08.html#fig8-3)). A binding is a one-to-many relationship between
    the service and the Port Type, which will contain your method declarations.


    ![Image](images/241-3.jpg)


    *Figure 8.3: Creating a new binding*


    After you have created the binding, define the Port Type by selecting `NewPortType`
    ([Figure 8.4](#012_Chapter08.html#fig8-4)).


    ![Image](images/242-1.jpg)


    *Figure 8.4: Selecting the Port Type*


    As [Figure 8.5](#012_Chapter08.html#fig8-5) shows, choosing `NewPortType` will
    create the PortType with a dummy operation defined.


    ![Image](images/242-2.jpg)


    *Figure 8.5: Creating the PortType*


    Because the dummy operation has input parameter defined and the method call does
    not have one, you can delete the input parameter, as [Figure 8.6](#012_Chapter08.html#fig8-6).
    Or you can add more parameters if the individual method definition requires them.


    ![Image](images/243-1.jpg)


    *Figure 8.6: Deleting the input parameter*


    Next, set the name of the operation to the method name as defined in the service
    ([Figure 8.7](#012_Chapter08.html#fig8-7)).


    ![Image](images/243-2.jpg)


    *Figure 8.7: Setting the name of the operation*


    After defining the operation name, you must set the return type of the operation.
    Generally, you do this by clicking the right-pointing arrow in the `MyPortType`
    window in [Figure 8.6](#012_Chapter08.html#fig8-6) to display a new page. On this
    page, right-click the response button, choose `Set Type`, and select `Browse`,
    as [Figure 8.8](#012_Chapter08.html#fig8-8) shows.


    ![Image](images/244.jpg)


    *Figure 8.8: Selecting the Set Type and Browse options*


    For the call to `getServerTime`, browse the list of return types for a string
    ([Figure 8.9](#012_Chapter08.html#fig8-9)) and set the value as `String`. The
    default return value is a sequence that `SoapClient` translates into an instance
    of `stdClass`. By setting the value as a straight string, you will receive the
    string-based return value that `getServerTime` sends.


    At this point, you might think you are done, but you have one more step to do.
    Right-click the service binding, and select `Generate Binding Content`, as [Figure
    8.10](#012_Chapter08.html#fig8-10) illustrates. Doing so adds some method invocation
    details to the binding definition in the XML that ties the service to the Port
    Type.


    ![Image](images/245.jpg)


    *Figure 8.9: Window for setting return type for String*


    ![Image](images/246-1.jpg)


    *Figure 8.10: Selecting the Generate Content option*


    When you click `Generate Binding Content`, the wizard in [Figure 8.11](#012_Chapter08.html#fig8-11)
    will be displayed. This wizard builds the content for you. Select the Port Type
    that you defined, and choose `SOAP` for the protocol. The protocol is not required
    for the wizard to complete creating the binding, but it is required for the SOAP
    definition to be valid. Selecting `HTTP` for the protocol generates the binding
    for REST-based requests, but this is seldom used.


    In your client, instead of defining the endpoint that you are connecting with,
    use the WSDL location:


    ![Image](images/246-2.jpg)


    Now when you make the server call, the WSDL will be downloaded, parsed, cached
    (so you do not have to repeatedly download the WSDL), and then used to validate
    the request before the HTTP request is made to the server.


    ![Image](images/247.jpg)


    *Figure 8.11: Selecting the Port Type and SOAP protocol in the Binding Wizard*


    Additionally, on the server, you make the server use the WSDL as well. By doing
    so, you enable WSDL to validate the request before processing it to ensure that
    the return values and faults match what is expected. If your WSDL is in the same
    location as your server entry point, you can easily make this change:


    ![Image](images/248.jpg)


    We can delve into much more detail, such as automated WSDL generation and such,
    but several different options are available for that. The base `SoapServer` class
    does not support automated generation, so we will not cover it here. What we have
    covered here is enough to get you started working with SOAP in PHP. If you need
    more information about how SOAP works, you will need a book on the subject.


    # JSON


    JSON is not a web service. Neither is it a web service standard, as SOAP is. In
    fact, it has little to do with web services because it began as a means of serializing
    data on a browser. JSON was originally based on a standard published by ECMA,
    the body responsible for several different web standards, including the familiar
    ISO 9660 (also known as ECMA 119). That is the standard for CDFS, or the CD File
    System. If you have a CD player, you are using an ECMA standard.

