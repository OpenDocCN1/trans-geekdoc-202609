    But you are not quite done yet. You have a navigation bar, but it does not link
    to anything. To create hyperlinks, you need to familiarize yourself with the `<a>`
    tag. But first, you must learn about another feature of HTML, the node `<attribute>`.


    Individual nodes such as `<div>` or `<a>` define the HTML document’s child elements.
    But sometimes these nodes have attributes that you can use to modify how they
    interact with the browser.


    A link, or `<a>` tag, is completely useless without at least one attribute. The
    attribute is called `href`. The `<a>` tag is the anchor, and the `href` attribute
    is the hypertext reference. By adding the `<a>` nodes to the `<li>` elements,
    you can let people navigate the web application by clicking or touching the hot
    link.


    ![Image](images/171.jpg)


    [Figure 6.3](#010_Chapter06.html#fig6-3) shows how the browser will render this
    code.


    ![Image](images/172-1.jpg)


    *Figure 6.3: HTML rendered with hyperlinks in the browser*


    The text elements in the navigation list automatically appear with a blue underline,
    which is a visual cue that this is clickable text. Also note that although you
    added a node to the `<li>` element, the text position and alignment did not change.
    That is because `<a>` is an inline element.


    The last HTML feature we will look at is a table. Tables are intended to display
    tabular data. In the past, web developers used tables when they became frustrated
    with CSS. This, however, is not the purpose of tables in your HTML. CSS positioning
    will almost always provide sufficient control over your position elements, without
    your having to resort to using tables.


    To construct a table, you use four primary elements. The `<table>` element declares
    that a table is to exist at the current place in the web-page flow. Every table
    beyond an empty one must contain at least one row, which you designate with the
    `<tr>` tag.


    Within a row, you can have two different types of inline elements: a header (denoted
    by `<th>`) or a cell (indicated by `<td>`).


    ![Image](images/172-2.jpg)


    [Figure 6.4](#010_Chapter06.html#fig6-4) shows how the browser will render this
    page.


    ![Image](images/174.jpg)


    *Figure 6.4: HTML rendered with a table in the browser*


    But you have a bit of a problem. The web page is horribly ugly. Nobody in their
    right mind would buy from a company whose page looks like this. For that reason,
    you need to think about decoration.


    # CSS


    If you were to remove CSS from the Facebook home page of a well-known and respected
    author, it would look like the page in [Figure 6.5](#010_Chapter06.html#fig6-5).


    ![Image](images/175.jpg)


    *Figure 6.5: Home page with CSS removed*


    Suddenly, the example page does not look too bad.


    To make this page more appealing, you can start by decorating the HTML elements
    with CSS attributes. Note that this can be an in-depth subject, so you will receive
    only a small introduction to CSS and HTML decoration here. You will learn how
    to identify elements and attach some basic styles to them. By the end of this
    section, you should understand how to read CSS files and be able to write some
    basic selectors and attributes. If you want to obtain in-depth information on
    CSS, do not get it from a book about PHP. Programmers generally make horrible
    designers.


    You can decorate HTML by using any combination of the following four ways:


    *   Type redefinition

    *   Node ID specification

    *   Class specification

    *   Inline CSS


    To understand how to use these four methods, let’s look at three new attributes
    that virtually any HTML element can have:


    *   `ID` is a unique identifier that an individual HTML node can have in a given
    document. You can reuse IDs across pages, but in an individual page, the IDs should
    be unique.

    *   `Class` lets you define a grouping of CSS attributes, which you then assign
    to zero or more nodes in an HTML document.

    *   `Style` lets you override CSS definitions on an element-by-element basis.
    Generally, this approach is not recommended because it requires modifying inline
    HTML, which is often generated by PHP, if you make changes to the decoration of
    your web page.


    Now you will modify the HTML page that you were using beforehand to tie it more
    easily to your CSS code. In doing so, you will also place your CSS code in a separate
    file, which will be included in the HTML. Separating the HTML and presentation
    code ensures that when you deploy presentation changes, you will not inadvertently
    break production functionality:


    ![Image](images/176.jpg)


    From this point forward, we will focus on the file `/site.css`, referenced in
    the HTML `<head>` section.


    Tag redefinition is a good place to start when working with CSS. It will modify
    every node whose name matches the CSS selector in your CSS document. As such,
    it does not require any changes whatsoever to your HTML layout.


    Let’s begin with the `<body>` tag. Virtually all new web applications do not use
    the Times New Roman font, which is the default for any web page. It just looks
    old. So to use a more modern font such as Arial for all the elements on a web
    page, specify that font in a tag redefinition for `<body>` by using the CSS attribute
    `font-family`:


    ![Image](images/178-1.jpg)


    This attribute will change the font for every element under `<body>` to Arial.
    The definition will “cascade,” in other words.


    You might want to change the background color as well:


    ![Image](images/178-2.jpg)


    You can specify the name of a color or, if you prefer (and most do), use hex codes
    to fill in the RGB values for the color. The hex code is a six-digit hexadecimal
    value separated into two-digit values that correspond to the value for red, green,
    and blue. In the example here, the value for red is 237, green is 237, and blue
    is 237. Mixing them together produces a light gray.


    Although you want a gray background, you do not want gray content. Instead, you
    want white content with some other decorations. In the HTML document, you defined
    your content `<div>` with the ID of `content`. You can use that ID to select that
    individual node and apply a style to that node alone. To do this, prepend a pound
    sign (`#`) to the ID that you set for a node in your CSS definition, followed
    by any pertinent styles:


    ![Image](images/179.jpg)


    Wow. You just added a lot of styles. Rather than showing off, I am simply illustrating
    that you have a lot of options for tweaking how your page will look. Here is what
    you did:


    1.  Set the background color to `#FFF` or `#FFFFFF`.

    2.  Set the width of the element to `800px`.

    3.  Set the padding to `10px`. (Padding is the spacing of the internal boundaries
    of the element and the element’s content.)

    4.  Set the value for margin to `auto`. (Unlike padding, which is internal to
    the element, the margin is the spacing of other elements around the node. You
    can use various widths, such as `10px` or `100px`. But here, you are centering
    the content node on the page. The value `auto` enables the browser to calculate
    that value.)

    5.  Set the border to `1px` wide, `solid` (instead of dashed or dotted), with
    a middle gray `#666` or `#666666` for the line color.

    6.  Add a shadow to the box by using the `offsetX`, `offsetY`, `blur radius`,
    `color`.


    Sometimes, you might want to redefine an element inside another element without
    affecting other elements of the same type.


    Consider your navigation list. Clearly, the navigation elements are a list, so
    you put them in an unordered list at the top of the page. But that does not mean
    that other unordered lists will have the same layout. For example, you might want
    to display navigation list items inline across the top of the page. But other
    lists, such as a list of jobs available, must be printed vertically.


    The definition name you specify for CSS is not really a name. It is a selector.
    CSS selectors are ways of finding elements in a document. It is a sort of query
    language.


    So when you created your CSS redefinition for `<body>`, you were actually creating
    a CSS selector that will find only the body tag.

    '
