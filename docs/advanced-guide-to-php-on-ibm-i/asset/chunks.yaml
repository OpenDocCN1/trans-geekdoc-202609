    # **8**


    # Web Service Basics


    By definition, a web service is a remote procedure call that is made over the
    web. The web is run using HTTP. So for a remote procedure call to be called a
    web service, it needs to be called over HTTP, or some derivative thereof. Although
    several protocols are used to pass information back and forth between machines,
    if this exchange is done over HTTP, then it is technically a web service.


    No web service standard exists that we need to follow for something to qualify
    as being a web service. This is both a benefit and a drawback. It is a benefit
    because getting a web service up and running can be quick and easy to do. The
    drawback is that the lack of a standard and real constraints makes the world of
    web services incredibly fragmented. What is “cool” is often what wins out, and
    it is difficult to find a pattern of best practices because everyone is doing
    things differently.


    So, as you go through this chapter, know that you will probably start out creating
    web services in a manner that is both wrong and right. But understand that it
    matters less than you think unless you are using a standard such as Simple Object
    Access Protocol (SOAP), which is very defined, rigid, and verbose.


    # REST


    We will start our examination with Representational State Transfer, or REST. There
    is lots of conversation about what is and is not REST, most of which is largely
    futile. On a basic level, REST means *do X for Y via resource Z.* But where the
    confusion sometimes lies is in how X is done and how Y is represented and what
    Z looks like. And the confusion is made worse by those who assert that certain
    REST services that claim to be RESTful are not truly RESTful and give a litany
    of reasons that rival the 95 Theses, when in reality they just need to take themselves
    a little less seriously. Most services are not truly RESTful, but it does not
    really matter.


    In actuality, most services are REST-like and not RESTful. This is probably because
    people were using REST-like systems well before REST came along, but REST provided
    an opportunity for a communication type to coalesce around a standard. As is true
    with almost every standard, however, nobody follows it perfectly. Perhaps the
    controversy stems from the fact that nobody wants his or her PhD dissertation
    to be misrepresented, but reading the dissertation itself does not render a clearly
    defined standard. Comparing the debate about REST to a “strongly” standards-based
    approach such as a Request for Comment (RFC) document or W3C standard will demonstrate
    why there is such confusion around REST. REST is not a highly structured protocol
    but a series of practices or, rather, an architectural style.


    As you read through this chapter, know that it would probably throw the REST author
    in a loop. However, my concern in writing this is to explain the benefits of a
    REST-like approach as opposed to ensuring RESTful compliance. As with many things,
    value is in knowing what to use, what to ignore, and how to balance both to optimally
    implement a given circumstance. As such, I will be highlighting important points
    to note. If you intend to build a fully RESTful interface, several online and
    print resources are available that expound upon the subject in fuller detail.


    # *Basics*


    The definition of REST might seem somewhat restrictive because REST is intended
    to solve web-based problems in a web-based style. For an API that serves a few
    hundred requests daily, many of these limitations might seem overkill, but the
    design of REST is intended to allow for several processes to occur.


    A REST-based architectural style has several constraints, but we will focus on
    just a few of them. The first is that the system is intended to be scalable. A
    REST-like system should be stateless. Stateless protocols are much easier to scale
    than those that are required to maintain state. As a web developer, you will undoubtedly
    be familiar with the world’s most popular stateless protocol: HTTP. Because HTTP
    is stateless, each request is isolated from other requests and has no knowledge
    of what happened before, making responses easily cacheable. This is a significant
    component of designing a REST-like architecture.'
