  trans: '


    要解决这个问题，你可以将输入内容与一组已知良好的文件列表进行比较。该列表可以是静态的，也可以从文件系统中的所有内容生成。这两种方法都是保护自己的有效手段。


    ![Image](img/148.jpg)


    在这里，代码首先检查请求页面的解析路径是否在脚本目录中，然后检查它是否是一个文件而不仅仅是存在。使用 `file_exists()` 可能就足够了，但在过滤来自外部世界的输入时，尽可能具体化是一个良好的实践。


    这种“偏执症”精神也应该扩展到内部世界。我见过的一些更有趣的攻击是因为内部功能信任了调用它的代码。而且在非常稳健、非常成熟的代码库中也见过这些攻击。通常情况下，成功的利用需要访问源代码，因为这类攻击要稍微复杂一些。


    为了简洁起见，下面的示例在未考虑原则的情况下混合了我们的关注点（HTML 和类），并忽略了 SOLID 原则。此外，该代码无法直接运行；它仅作为示例。以下代码将创建一个名为
    `SecurityLevels` 的类，该类将获取当前管理员用户的可用安全级别，并打印出选择这些级别的 HTML 代码：


    ![Image](img/149-1.jpg)


    如果请求是 POST，你还需要一个实现更新用户功能的新服务类。该类如下：


    ![Image](img/149-2.jpg)


    那么，看这两部分代码，漏洞在哪里呢？它不是 SQL 注入。


    代码之所以存在漏洞，是因为 `UserService` 没有验证 `UserService::setSecurityLevel()` 中指定的安全级别是否与
    `SecurityLevels` 类在 `<SELECT>` 元素中提供的匹配。


    解决方案是确保在保存更改到数据库之前，验证当前用户是否有权限将级别设置为其指定的级别。


    否则，系统可能会受到权限提升攻击，允许不法之徒通过绕过内部保护措施来增加他们的访问权限。虽然下面的解决方案并不优雅，而且从架构角度来看并不合理，但它说明了保护此类类免受漏洞所需的步骤：


    ![Image](img/150.jpg)


    这些更改获取了当前用户以及该用户可以选择相应的安全级别。代码然后检查作为参数提供的级别是否在允许的级别列表中。如果不在，代码将抛出一个安全异常。


    尽管这个示例在架构上并不完美，但它确实证明了将数据验证尽可能靠近末端逻辑的重要性。该验证可以更早发生，以生成警告信息等。但某种验证应该发生在从外部源调用的方法或函数内部，无论它是来自世界各地的服务器还是不属于该类的代码。作为开发者，假定方法调用中的输入数据是有效的，会让你的应用程序暴露于恶意行为的捷径。


    # 可预测的位置和危险文件


    这个主题本身是不而易见的，因此在我拙见看来，为它写一篇长篇论文反而是于于帮助的。发现有漏洞机器的最简单方法之一就是寻找位于预测位置的可预测文件。


    通常很容易找到 `phpinfo.php` 页面（或 `p.php` 页面），其中包含了对 `phpinfo()` 的调用。虽然 `phpinfo()` 是验证系统配置的有用调试工具，但它不应该出现在生产系统中。如果你必须把它放在那里，请确保生产系统对该文件进行了密码保护。


    `phpinfo()` 的输出提供了丰富的信息。在某些情况下，你可以找到数据库用户名和密码。现在的大多数应用程序都会指定数据库连接初始化，但你也可以在 `php.ini`
    中指定，这使得你的数据库连接信息在 `phpinfo()` 中可见。


    另一个你不想让 `phpinfo()` 公开面对的原因是，这样做会给攻击者如何接触你的网站提供思路。例如，如果攻击者看到 `display_errors`
    是开启的，该攻击者可能会诱导网站进入错误状态以显示某些内部信息。或者，如果你的服务器在防火墙后面，攻击者可以使用 `$_SERVER["SERVER_ADDR"]`
    的输出获取有关你网络的内部信息。


    想寻找互联网上正在做此事的网站吗？在 Google 上搜索 `inurl:phpinfo`。虽然你需要翻几页，但几秒钟内你就能找到列出这些网站的页面。


    如果你对 PHP 代码使用 `.inc` 文件，可能会出现另一个可能的问题（与 `phpinfo()` 无关）。因为 Apache 不将 `db.inc`
    识别为 PHP 文件，它将作为文本返回该文件，显示你的数据库连接信息。如果你在 PHP 中有一个名为 `include.inc` 的文件，也会发生同样。不要在文件命名上发挥创意；相反，请使用以
    `.php` 结尾的老旧、基础、无聊的文件名。


    在文档根目录下使用文本文件存储数据也是一个坏主意。在文档根目录下包含日志也是一个坏主意。在文档根目录下存储任何重要内容都是糟糕的做法。如果你在文档根目录下存储关键数据，这些数据现在（如果不是以后的话）可能会意外允许第三方下载，这是你想要避免的。


    # 使用加密


    PHP 没有实现任何形式的内部加密。相反，你使用链接到 PHP 二进制文件的第三方库来处理此任务。我们将查看你可以用于 PHP 加密集成的两种不同活动：哈希（Hashing）和对称密钥加密。我们也可以检查公钥加密，但因为方便两个不信任双方之间的加密，你很可能不会在应用程序中使用它。是的，你可能在
    HTTPS 中使用它，但在 PHP 介入之前就已经发生了。


    # 哈希


    哈希是一种将一个值反复计算为另一个值的机制，另一个值（推测）是无法解码的，但对于相同的值，其哈希输出总是相同的。


    为了说明这一点，一种可能的用途是对匿名数据进行搜索。考虑一个组织想与另一个组织共享数据，但仅限于两个组织共有的信息。如果两个组织都有共享共同部分但保留其他部分的要求，使用标准查询可能会有问题。源组织不能向接收组织开放访问，因为这样做会暴露其数据。而接收组织不想进行明文搜索，因为那会在执行搜索时泄露其信息。为了解决这个问题，请使用哈希值代替普通值进行搜索。


    哈希功能最常见的用法是密码管理。无论你的数据库有多安全，你都不应该通过以明文存储用户密码来冒损害风险。如果这些密码被未知攻击者或离职员工泄露，你更希望这些密码不会暴露在公开场合。因此，作为你系统和客户安全的最佳实践，你不希望以明文存储密码，对吧？


    '
- fmt: '

    If you answered anything other than “yes, I agree with you,” you might need to
    be demoted. Accidentally creating a vulnerability is forgivable. Introducing a
    vulnerability because you do not want to write five lines of code is unprofessional,
    at best.


    When hashing a password, you basically pass the input (the password) to a hashing
    function and store the result some place. The most typical hashing method to use
    is `md5()`, which—surprise!—implements the MD5 message digest algorithm. For a
    while, `MD5` was considered secure. But it is no longer considered secure because
    of possible hash value collisions. This means that, providing two inputs, one
    could produce the same value. Granted, the likelihood of a person exploiting that
    vulnerability is low, but a computer can do it somewhat easily. So `MD5` is considered
    cryptographically insecure, and new applications should not use it.


    This does not mean you need to change your password-hashing mechanism immediately
    (unless you are dealing with really secret stuff). But you should replace it so
    that the next time users change their passwords, a different hashing mechanism
    is used. In other words, the world is not falling because `MD5` is not cryptographically
    secure, but it is better to be safe than sorry.


    One possible alternative is to use the `SHA-1` algorithm, which is implemented
    in the `sha1()` function. Although this is not the best route to go, we will start
    here.


    Implementing a password-checking method is easy to do. In fact, the process is
    almost the same as if you were not hashing your password. You are simply comparing
    two values. The difference is that you are comparing two hashed values instead
    of two real values.


    Let’s start with some general password, the kind you should avoid:


    ![Image](images/153.jpg)


    Obviously, you are storing the password in plain text here. The code to log in
    is simple, too:


    ![Image](images/154-1.jpg)


    If you were to use `sha1()` (or even `md5()`, which again you should not), the
    change to the code is extremely simple. When you update the password, make it
    look like this:


    ![Image](images/154-2.jpg)


    And when you log in, make it look like this:


    ![Image](images/154-3.jpg)


    That is it. You are now about a billion times more secure.


    But wouldn’t you rather be 10 billion times more secure? As with many things,
    if you want something to taste a little better, you need to add some salt.


    Salting a hashing function is the practice of injecting random data into the prehashed
    data, making it much more difficult for someone to obtain passwords via a brute-force
    attack. To be clear, salting does not make it more difficult to crack an individual
    password, but it does make it much more time consuming to crack all of them.


    To crack hashed passwords, attackers often use a rainbow table. A rainbow table
    consists of precomputed values that have been prehashed. So if someone obtains
    an organization’s list of users and hashed passwords, that person can simply check
    the rainbow table for matching results. Finding those matches is a lot of work
    for a `CPU` to do, but `CPUs` are fast these days, and `GPUs` are even faster.
    So it does not take that much time to calculate it. And if you are hashing your
    passwords on the system, the attacker can generate the rainbow table to compare
    the values in the table to whatever is found in the database.


    Salting will inject random, preferably unique, data into password entry. The random
    data is placed alongside the password. You might think that this is not secure
    because you are placing this data in the same field of the password. This is somewhat
    true, but you would be missing the point of the salt. The salt is not a cryptographic
    key. The salt is there not to make it impossible to guess the password, but to
    make it really, really hard to guess all of them. An effective salt forces the
    attacker to create a full rainbow table for *every* password in the system. A
    good thing to remember about security is that you are not trying to make your
    system completely secure. You will be chasing after the wind. Instead, you are
    attempting to make breaking into your system so difficult that the attacker will
    look elsewhere.


    The following code shows how you can implement a salting function:


    ![Image](images/155.jpg)


    Then when you want to log in a user, you use some different code. Previously,
    you used the password as part of the query to find the user. However, because
    you do not know what random data the salt will generate for the user, you will
    need to select the user regardless of whether that user has the right password.
    So you must modify the code you use to check for passwords:


    ![Image](images/156.jpg)


    Easy.


    So far, you have seen two specific functions in PHP to do your hashing, but many
    other options for hashing are much better. `MD5` is basically broken; `SHA-1`
    is still fine at the time of this writing, but it has a theoretical vulnerability
    and is considered a weak hashing mechanism. So what should you use?


    First, do not use the `sha1()` or `md5()` functions even if you intend to use
    `SHA-1` or `MD5`. A better function for hashing is `hash()`. It functions exactly
    as `sha1()` and `md5()`, but `hash()` lets you specify which algorithm the mechanism
    should use as a parameter. To see which algorithms are available, use the `hash_algos()`
    function. When I run it, I get a little more than 42 options. So which to choose?
    It is difficult to say exactly, but the U.S. National Institute of Standards and
    Technology (`NIST`) recommends that all government agencies use one of the `SHA-2`
    algorithms. Whether you trust the `NIST` is a different matter. Several `SHA-2`
    algorithms are available.

    '
