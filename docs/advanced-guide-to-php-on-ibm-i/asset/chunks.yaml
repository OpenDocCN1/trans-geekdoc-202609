    现在我们从单向哈希转向双向加密。当你不想存储（或你不应该知道）你正在处理的值时，你使用哈希。当你需要返回数据时（例如信用卡号），你使用加密。


    加密最简单的形式（也是你应该使用的）是对称密钥加密，或称为共享密钥加密。在对称密钥加密中，双方共享一个密钥来对内容进行加密和解密。非对称加密是用一个密钥解密内容，用另一个密钥（通常基于私钥）加密文档。我们不会介绍非对称加密，因为你可能用不到它。事实上，使用非对称加密的
    HTTPS 仅仅这样做只是为了将对称密钥传递给浏览器（参参见 [`readwrite.com/2013/09/19/keys-understanding-encryption`](http://readwrite.com/2013/09/19/keys-understanding-encryption)
    上的“市集的安全性”）。


    你最可能用于加密解密的方法是 `mcrypt` 库。你通过 `mcrypt_encrypt()` 方法实现加密：


    ![Image](img/159.jpg)


    在这种情况下，你有一个存储在 `$value` 中的值，以及一个存储在 `$key` 中的共享密钥（将在端点之间共享），你将使用它来加密数据。


    第一个参数要使用的加密算法。算法将以 `MCRYPT_` 为前。最常见的（根据我的经验而非任何硬性数据）是 `MCRYPT_3DES`、`MCRYPT_BLOWFISH`、`MCRYPT_RIJNDAEL_128`
    和 `MCRYPT_RIJNDAEL_256`。


    我不是一名密码学家，也没有足够的资质来讨论各种加密机制的细节。通常情况下，数字越大越好。Triple DES 比 DES 好。Rijndael-256 比
    Rijndael-128 好。这绝对不是一条铁律，但因为加密算法中的数字通常指的是密钥长度，所以这通常是对的。密钥越大，加密后的值就越复杂。


    此外，在确定使用哪种加密算法时，你应该查看一下 NIST 的高级加密标准，即 AES。AES 被用作加密政府信息的手段。许多不同的设计被提交给了 NIST；最终获胜的是
    Rijndael 算法，而标准是该算法的一个变体。区别在于块大小被限制为 128 位，而 Rijndael 算法可以支持几乎任何 32 位倍数的位数。


    第二个值是共享秘密密钥。正如 `php.net` 手册所说，该值通常不应该是 ASCII 字符串；它应该是一个与请求算法能处理的长度等长的随机字符串。如果你的密钥是
    ASCII 格式，那么它是不安全的。


    第三个参数是要加密的值。简单。


    第四个参数是算法将使用的模式。这可能会变得有点复杂，所以我们以后会深入探讨。


    当你运行代码时，你将得到以下输出：


    ![Image](img/160-1.jpg)


    这是你加密数据的 base64 编码版本。（我使用 base64 编码仅仅是因为原始数据在书中无法很好地打印。）当在数据库中存储数据时，你可以使用原始内容或其他编码版本。这其实并不重要。重要的是你不是如何存储该值，而是该值是否足够无法破译。换句话说，有了良好的加密算法，你应该可以将内容放置在互联网的任何地方而它它是安全的。


    要解密数据，请反向执行相同的过程。你将加密数据连同你的秘密密钥传递给解密函数：


    ![Image](img/160-2.jpg)


    运行此代码产生解密值的输出：


    ![Image](img/160-3.jpg)


    这就是对称密钥加密。简单吧？并不完全。


    如果你重复加密这个值会发生什么？你会得到相同的结果，因为你使用的模式是 `ECB`，即电子密码本。这种模式的问题是它独立地加密每个块（或每个数据分块）。这样做的影响是什么？


    ![Image](img/161-1.jpg)


    （此示例源自 [`www.adayintifeof.nl/2010/12/08/encryption-operating-modes-ecb-vs-cbc`](http://www.adayintifeof.nl/2010/12/08/encryption-operating-modes-ecb-vs-cbc)
    上的“加密模式：ECB 与 CBC”）。


    这是此代码的输出：


    ![Image](img/161-2.jpg)


    看第 1 行和第 5 行。发现什么了吗？是的。重复。这意味着这种方法可能会泄露数据。


    为了解决这个问题，你将模式从 `ECB` 更改为 `CBC`，即密码块链。`CBC` 将一个数据块与前一个块结合加密。你可以在网上找到更多信息，但主要区别是
    `ECB` 独立加密每个块，而 `CBC` 针对前一个块加密下一个块。


    但 `CBC` 的问题是它还需要另一个称为“初始化向量”（`IV`）的数据。解释 `IV` 最简单的方法是它和你之前在哈希机制中使用的盐相似。`IV` 为加密提供了一个不同的起点。

