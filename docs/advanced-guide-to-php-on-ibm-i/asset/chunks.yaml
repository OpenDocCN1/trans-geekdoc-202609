    If classes are the definition of an instance, as “human” is to an individual,
    then interfaces are the expectations. But unlike classes, interfaces do not contain
    implementation details. That is because an object frequently needs only to know
    that *something* exists, not *how* it exists. And often that something might be
    an item that is not instantiated within the class itself but is injected from
    the outside. When that happens, the outside item might include a wild range of
    functionality that does not matter to the main object. For a better understanding,
    look at the following example.


    Imagine you are designing a car. You have a base class called `Car`, which defines
    all the functional elements of a car: engine, doors, wheels, and so on. But does
    the car itself, the object that *represents a real thing, need to know the implementation
    details of the engine? Does it need to know whether it is a 4-, 6-, or 8-cylinder
    car? Not really. It just needs to know that it has an ignition and a fuel supply
    control:


    ![Image](images/7-1.jpg)


    So when you define the `Car` class, you can add the engine to it but need not
    worry about how the `Engine` class does what it does. You care only about the
    *interface* to it. So you define a `setEngine` method that allows only a class
    of the `Engine` interface to be provided. The actual implementation does not matter
    to the `Car` class; the only concern is that it is actually an engine:


    ![Image](images/7-2.jpg)


    In the following example, `TwelveCylinderEngine` is an actual class that implements
    all the methods you require it to have as a class that has the function of the
    engine. To do this, you use the keyword `implements` (I will spare the details
    of actual implementation):


    ![Image](images/8-1.jpg)


    Now when you want to use the class, just write some simple code:


    ![Image](images/8-2.jpg)


    Because the class `TwelveCylinderEngine` implements `Engine`, the object will
    accept it as a parameter. If you try to define the engine as `Transmission`, the
    method call will fail with a fatal error.


    # Polymorphism


    Polymorphism is the ability to define something that has more than one form. The
    fish and engine examples both demonstrate this in action. The word comes from
    the Greek roots “poly” and “morph” and means *many shapes* or *many forms.* But
    it is more than just defining *something.* Morph actual means *one of various
    distinct forms.* In other words, it is again a sort of taxonomy: an ordered, usually
    hierarchical, organization. When you look at how classes are structured within
    the larger context of a whole application, you will often see a hierarchical relationship
    of greater and greater levels of specificity.


    That is why in the engine example you could act on the engine regardless of its
    actual implementation:


    ![Image](images/9.jpg)


    Because the requirement specified that the variable be of a type `Engine`, it
    did not matter how many cylinders the engine had. From the car’s viewpoint, it
    was an engine, and that was all. So the engine object was one of various distinct
    (cylinders, for example) forms. And this plays nicely into the next area of review.


    # Type Hinting


    By using type hinting, a class designer can enforce the object type when passing
    in various parameters. To do this, you define the type of object that needs to
    be passed, usually at its lowest usable hierarchical member. For example, if you
    had a class that represents a Honda Accord, you would not place a 12-cylinder
    engine in it, as much fun as that might be. As a designer, you can use type hinting
    as a means of restricting the types of objects that can be passed into a method
    definition.


    You already saw an example of this in the `Car` class:


    ![Image](images/10-1.jpg)


    The `Engine` value for the `setEngine()` method defines the type hint for that
    parameter. PHP will not let a variable of other lower or disparate types be passed
    in that parameter.


    If you extend the `Car` class to `HondaAccord`, you can further restrict the subclass
    of `Engine` that is passed:


    ![Image](images/10-2.jpg)


    With that, we wrap up the basic review of object-oriented programming. I based
    this review on the chapters in my earlier book. So if any of the OOP concepts
    or techniques seem too foreign to you, or you need to learn more about the fundamentals,
    pick up a copy of *The IBM i Programmer’s Guide to PHP* for a more basic introduction
    to OOP.


    # Namespaces


    PHP 5.3 introduced a long overdue feature to its object-oriented system. Namespaces
    allow for the distinct separation not only of classes (with their properties,
    methods, and constants) but of groups of classes as well. Before PHP 5.3, namespaces
    were available simply because a namespace is just that— “name space.” In pre-PHP
    5.3 applications, the only “name space” for classes was global. With PHP 5.3,
    developers now have the option of dividing class definitions into more distinct
    subunits, called *namespaces.* The extra “s” at the end of namespace implies that
    more than one is available. (Although this is not technically the reason for the
    additional “s,” it might help you form a picture in your mind as to how namespaces
    operate.)


    But if all namespaces do is provide a means of naming things more clearly, are
    they really that useful of a feature? Actually, yes.


    Presume, for a moment, that you are part of a larger development team working
    on an application. Some of the functionality that you have to implement needs
    a class called `File`. Nice and distinct, and there is only one way to define
    a file, right?


    Sure, but what if that file is a row in the database that is representing a virtual
    file? “No problem!” you might say, “I’ll just use `PSR-0` and call it `Database_File`.”


    At which point I would say, “You mean `Core_Database_Filesystem_VirtuaLFile?”
    A look at any modern PHP framework can provide examples as to how deep the psychosis
    can go.


    Defining a namespace is easy. Before you define the class, simply use the keyword
    `namespace` followed by the name of the namespace:


    ![Image](images/12-1.jpg)


    The way you would have had to instantiate this class in earlier versions of PHP
    would have been to use the underscore (`_`) pseudo-namespace separator. But now,
    if you instantiate the class from within that namespace, you can do so without
    specifying the namespace. If you are within a given namespace, its name is presumed
    by the Zend Engine:


    ![Image](images/12-2.jpg)


    But what is the object’s actual class name? `MyClass`, right? Let’s add some code
    to see what happens:


    ![Image](images/12-3.jpg)


    Running this code produces the following output:


    ![Image](images/13-1.jpg)


    What is that backslash doing there? Nowhere in the code did you enter a backslash.
    But in PHP, the backslash is the namespace separator. You use it to delineate
    the namespace from the class and to note child namespaces.


    Developers who program with languages like Java might find this convention takes
    some getting used to. That is because the backslash is also universally used as
    an escaping operator, and most languages, such as Java, use periods to denote
    namespace relationships. But in PHP, periods are already used for string concatenation,
    so deciding which character to use to denote namespaces is a little harder.


    When storing source files for namespaced code, you generally use the same naming
    convention as with pseudo-namespaces. But instead of translating underscores to
    path separators, you translate backslashes to path separators. So, for example,
    a class `MyClass` in the namespace `MyNamespace` would reside in the directory
    `MyNamespace/MyClass.php`.


    From the perspective of an autoloader (a special function/method that loads class
    definitions when they are first referenced), the logic to load the class would
    be thus:


    ![Image](images/13-2.jpg)

