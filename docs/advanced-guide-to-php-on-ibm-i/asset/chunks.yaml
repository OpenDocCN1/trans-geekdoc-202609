  raw: 'Some might claim that because you must now write both test and actual program
    code, you are becoming less productive. Although this might seem true at first
    glance, in practice it is often not the case. When writing unit tests, you are
    testing individual pieces of functionality. With traditional debugging, you are
    trying to coax the browser into performing a certain action, whether or not it
    wants to. And though you might be writing more code, you are writing code that
    is intended to verify that the function is doing what it is supposed to be doing.


    Unit testing can be a complex subject to cover, but even a basic understanding
    of it can pay for itself. This chapter will explain only the basics of performing
    unit testing. For a more in-depth treatment of the subjects, complete books are
    available that provide a deeper guide into how to do unit testing.


    # PHPUnit


    By far, the most popular PHP unit testing software is PHPUnit. It is maintained
    by Sebastian Bergman, and you can it download at *[http://www.phpunit.de](http://www.phpunit.de)*.
    PHPUnit is also included in your copy of Zend Studio.


    Generally, tests are created in a separate directory from the application to prevent
    them from being deployed along with the application. You can, of course, put the
    test files alongside your class structure and remove any unwanted tests as part
    of your deployment process. But it is usually easier to disallow a single directory
    than to hope that your pattern-matching packaging process excludes all your test
    files.


    Your tests’ structure should generally follow the structure of the items you are
    testing. So say you have a class called My\\Class. The files related to it should
    be as follows:


    ![Image](images/207-1.jpg)


    One practice you can use in some scenarios is to build out your class structure
    first and stub out the methods that you will be using. Consider this class:


    ![Image](images/207-2.jpg)


    This example defines the method that the class will use but does not add any functionality
    to it. So you can open the PHPUnit test case window in Zend Studio and have Studio
    create the test class for you ([Figure 7.1](#011_Chapter07.html#fig7-1)).


    ![Image](images/208.jpg)


    *Figure 7.1: Creating a test class in the PHPUnit test case window*


    Truth be told, Zend Studio creates a relatively ugly file. So let’s clean that
    file up a little:


    ![Image](images/209.jpg)


    What is missing in this code? It is require\_once calls to the individual class
    you are testing along with the unit testing code. When I create a new unit test,
    I remove the require\_once calls. I also delete a lot of boilerplate comments
    and other things. But to load the classes, you must first install an autoloader.


    To set this up, you define a bootstrap file. Often, the bootstrap will be a PHP
    file in the root of the test directory. The PHP file will be called before the
    test run to set up the environment. One thing you do in that file is bootstrap
    the tests with an autoloader:


    ![Image](images/210.jpg)


    This bootstrap file can contain any functionality required to prepare the system
    for a test. Here, you needed only an autoloader and to set the include path. But
    in some cases, you might have to set a database connection or change a web service
    URL to a debug service.


    You still have a problem, though. PHPUnit does not know where the bootstrap is.
    Luckily, you can configure PHPUnit with this information (and much more). PHPUnit
    will look for a file called phpunit.xml, which can contain various configuration
    options to modify how it works. Following is an example phpunit.xml file from
    the PHPUnit manual:


    ![Image](images/211-1.jpg)


    For your purposes, you need only one attribute set:


    ![Image](images/211-2.jpg)


    With that, you are ready to go.


    In Zend Studio, using PHPUnit is incredibly easy. Right-click the test file you
    want to run, and select **Run As PHPUnit Test** from the drop-down menu in [Figure
    7.2](#011_Chapter07.html#fig7-2).


    ![Image](images/212.jpg)


    *Figure 7.2: Selecting Run As PHPUnit Test from the Zend Studio menu*


    Because you have not written any of the tests and have only stubbed them out,
    you receive the output in the **PHPUnit** view in Zend Studio, as [Figure 7.3](#011_Chapter07.html#fig7-3)
    shows.


    ![Image](images/213-1.jpg)


    *Figure 7.3: Output displayed in PHPUnit view*


    The test technically passed, but only because the test was marked as unimplemented.


    So let’s change the test and add an assertion:


    ![Image](images/213-2.jpg)


    In this test, you call the setState() method on the object that was created earlier.
    To validate that this method worked, call the getState() method and assert that
    it must equal the value that was passed in. When you run the test now, you get
    a test failure ([Figure 7.4](#011_Chapter07.html#fig7-4)).


    ![Image](images/213-3.jpg)


    *Figure 7.4: Message stating that the test failed*


    But before you fix this issue, let’s consider a couple of other things you might
    want to do. First, you might want to filter or normalize the values that are in
    the test code. For example, say you want to enter Texas and have it return as
    TX. To do that, you must add another method to the test:


    ![Image](images/214-1.jpg)


    Additionally, because you are in the business of filtering, perhaps your requirements
    dictate that the state specified can also be provided in lower case:


    ![Image](images/214-2.jpg)


    Now you have a decent set of test conditions, and you have defined several cases
    within just a few lines of copied and pasted code. Except for one problem. You
    have not done any error checking. For example, say some wise guy is filling out
    the form and he enters The Shire as his state. That should show an error, correct?


    ![Image](images/214-3.jpg)


    In this test, you told PHPUnit that you are expecting the method to throw an exception
    when someone enters an invalid state. You can also do this by adding an @expectedException
    annotation to the DocBlock. But it makes sense to define the tests consistently,
    which means you would declare the expected exceptions in the same place where
    you declare your assertions—in the code.


    With that, you probably have sufficient test coverage for that method, and it
    only took about five minutes to write that code. The test class now looks like
    this:


    ![Image](images/215.jpg)


    Running this test produces the output in [Figure 7.5](#011_Chapter07.html#fig7-5).


    ![Image](images/216-1.jpg)


    *Figure 7.5: Test output*


    Failure never felt so good. Next, you write the code in the class to pass the
    tests:


    ![Image](images/216-2.jpg)


    As [Figure 7.6](#011_Chapter07.html#fig7-6) illustrates, running the test results
    in all green lights.


    ![Image](images/218.jpg)


    *Figure 7.6: Displaying green lights to indicate that the test passed*


    Now before you say, “Oh, is that all” in a semi-sarcastic voice, consider that
    the only reason you wrote that code in the Address class was to ensure that the
    test passed all the conditions you had set for it. Also consider that, had you
    tested this code in a browser, you would have had to repeatedly go through whichever
    sign-up form uses this method to test it. And each time you made a change, you
    would have had to start the test from the beginning and test each unit manually
    to ensure that the test did not break any other tests.


    Suddenly, unit testing does not seem like much additional work. In fact, it is
    starting to look like less work because, rather than refreshing the browser, you
    simply press **CTRL+F11** in Zend Studio to run the test again. Or if you want
    to debug it, press **F11.** So although you wrote more code, you knew upfront
    what you needed to do for the test to pass. And your development iteration was
    much faster because, to validate that a change was made, you pressed **CTRL+F11**
    to verify whether the change worked and whether it broke any other tests.'
