    如果你已经读过第 2 章（涵盖了高级面向对象编程），特别是关于依赖注入（Dependency Injection）的部分，你会注意到此处之前一个节中的示例已经在使用依赖注入。`ToolkitService`
    对象是通过构造函数注入的。你并没有自动地管理它。在本节中，我们将简要查看如何使用 `DI Container`（DI 容器）将服务类与 `Toolkit`
    耦合。


    等一下！我不是说过耦合是坏的吗？不是。耦合并不是坏的。*紧密*耦合才是坏的，更准确地说，它会降低你软件的可维护性。当一个类在内部显式地定义依赖时就会就会紧密耦合，通常意味着它必须从某个硬编码的地方获取该对象。如果你在类中定义了对
    `ToolkitService::getInstance()` 的调用，就能这一点。*这*就是紧密耦合，从远来看可能会让你的应用程序更难维护。松散耦合发生在类定义了它所需的依赖，并且你注入了该依赖。一个没有依赖的类可能没太大用。


    然而，正如你可能注意到的，有时管理这些依赖可能是困难的。也许如果你只有一个依赖，你可以做到。但即便如此，你也不会自动拥有一种手段将该依赖传输到需要的地方。


    这就是 `DI Container` 发挥作用的地方。与其手动注入这些依赖，不如你从 `DI Container` 请求一个对象，由它为你满足该类的依赖关系。如果这有点模糊，我建议你在继续之前再重读一遍第
    2 章，它涵盖了高级 OOP。


    为了用 `Toolkit` 演示这一点，我们将使用你在第 2 章中定义的 `DI Container`。正如在该章中一样，我要声明那里创建的 `DI Container`
    并不是用于生产环境，你还有其他（支持的）`DI Container` 选项供选择。创建这个是为了让你了解 `DI Container` 如何工作，而不是功能完整。但它是一个有效的
    `DI Container`，所以如果你想使用它，你不会受到我的任何批评。


    管理容器的一个关键点是，你想通过配置来管理依赖。有时人们会使用 `XML`、`JSON` 或 `YAML` 作为配置手段。这些都是有效选项，但我的倾向是保持简单、保持代码化。这样，字节码缓存（opcode
    cache）会将配置存储在内存中，你就不需要每次都从 `IFS` 读取它的开销了。但如果你更喜欢将其存储在 `XML` 中以便验证或提供更具可读性的格式，你也没问题。


    在 `Toolkit` 的情况下，你需要以一种允许调用 `ToolkitService` 上 `getInstance()` 方法的方式定义依赖。你编写类的方式允许了这一点。配置存储在配置文件中，如下：


    ![Image](img/282-1.jpg)


    （从这里开始，我们假设自动加载器已经定义并正在工作。）


    此配置说明，当 `ToolkitService` 类被列为构造函数中的依赖项时，将使用提供的具名参数调用 `getInstance()` 方法。`DiContainer`
    类使用反射来创建实例并调用任何实例化方法，因此它会检查它是静态方法还是对象方法，而 `ToolkitService::getInstance()` 属于前者。


    要初始化 `DiContainer` 类，创建一个新实例，并包含你刚刚指定的配置文件：


    ![Image](img/282-2.jpg)


    你将复用之前的 `COMMONPGM` 代码。要获取它的实例，向 `DiContainer` 对象请求一个实例，并验证它是否正确注入了 `ToolkitService`
    对象：


    ![Image](img/283-1.jpg)


    运行代码产生此（已脱敏）的输出：


    ![Image](img/283-2.jpg)


    所以它似乎运行正常。让我们看看编写此示例的完整代码时会发生什么：


    ![Image](img/283-3.jpg)


    当你运行这段代码时，你会得到以下输出：


    ![Image](img/283-4.jpg)


    很简单，对吧？但为了论证，让我们假设管理层请求了一个新功能；它希望在建立新连接时通过调用 `RPG` 进行额外的安全检查。实现这些更改的一种方法是在建立新连接时修改
    `ToolkitService` 类：


    ![Image](img/284.jpg)


    如果你是内联编写代码，你将修改每个调用 `getInstance()` 的地方。使用 DI Container，`ToolkitService` 对象将被注入到
    `COMMONPGM` 中：


    ![Image](img/285.jpg)


    # 使用 Toolkit 进行单元测试


    我们构建之前的示例是打算使用 `SOLID` 原则，这是构建可维护软件的基础（尽管不是强制要求）。请注意，我没有说是“快速”的软件。基于 SOLID 的应用程序的额外复杂度会产生一些开销。确切的很难确定，因为它取决于代码库。然而，可以说额外的复杂性会降低你应用程序的吞吐量。


    话虽如此，这并不重要。这始终是多种成本之间的平衡，过分关注某一种成本对整个项目是有害的。例如，开源 PHP 电子商务应用程序。如果它的关注点仅仅是应用程序的性能，它可能是那里使用率最少的软件包。但事实并非如此。它是使用最多的。这是因为
    Magento 为你做了很多工作。诚然，在我写这段话时，我为 Magento 工作，所以请根据自己的意愿对待这句话。Magento 为开发者做了大量工作，并能通过大量可用选项大幅缩短上市时间。


    但与自定义编写的电子商务应用程序相比，它极其缓慢。Magento 的成功（至少部分）归功于它的设计。当 Magento 开发人员设计软件时，他们以一种在考虑所有因素后成本更的方式解决了电子商务问题。公平地说，我并不是说
    Magento 遵循提高软件维护性的原则。Magento 构思时，许多这些原则正处于 PHP 世界的完善阶段，你可以在很多地方看到这一点。然而，它说明了在软件开发“饼图”中考虑多种不同配料的重要性。


    这些配料之一就是修复缺陷的经济学。Steve McConnell 在他的书《Code Complete》（微软 Press 出版社, 2004）中计算出，修复缺陷的成本在需求阶段大约是
    1 倍，但在应用程序部署后，该成本可能会增加到近 100 倍。因此，在你设计软件构建方法时，修复缺陷的成本是一个重要因素，这也是为什么测试驱动开发（TDD）如此重要的原因之一。


    典型的开发方法是更改并刷新。进行更改，刷新浏览器。这种方法极其低效，而且正如所提到的，它可以修改你的数据且不具重复性。它还是手工的，意味着你必须手动通过所有的测试场景以验证新代码是否有效以及旧代码是否仍然有效。换句话之，你修复缺陷的成本将高得多。


