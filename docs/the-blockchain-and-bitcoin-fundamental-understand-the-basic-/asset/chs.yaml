- "# 区块链与比特币基础：在这门大师课程中理解区块链与比特币的基本原理\n\n\n\n\n\n\n\n# 引言\n\n尽管区块链是一项新技术，但它已经拥有丰富且有趣的历史。以下是区块链发展过程中一些重要且著名事件的简要时间线。\n\
  \n## 2008\n中本聪（Satoshi Nakamoto，个人或团体匿名）发布了《比特币：一种点对点的电子现金系统》。\n\n## 2009\n计算机科学家\
  \ Hal Finn 与神秘的中本聪之间完成了首笔成功的比特币（BTC）交易。\n\n## 2010\n位于佛罗里达州的程序员 Laslo Hance 完成了史上首次使用比特币的购买——两个爸爸约翰王的披萨。Hance\
  \ 转账了 10,000 BTC，在当时价值约 60 美元。今天它价值 8000 万美元。比特币市值正式超过了 100 万美元。\n\n## 2011\n1 BTC\
  \ = 1 美元，使这种加密货币与美元平价。\n电子前疆基金会、维基解等组织开始接受比特币作为捐赠。\n\n## 2012\n区块链和加密货币在《好妻子》等热门电视节目中提到，将区块链引入了流行文化。\n\
  由早期比特币开发者 Vitalik Buterin 创办的《比特币杂志》（Bitcoin Magazine）上线。\n\n## 2013\nBTC 市值突破 10\
  \ 亿美元。比特币达到 100 美元/BTC。\nButerin 发布了《以太坊项目》，暗示区块链除了比特币还有其他可能性（例如智能合约）。\n\n## 2014\n\
  游戏行业巨头拉斯维加斯酒店等开始接受比特币。\nButerin 的以太坊项目通过代币发行（ICO）筹到了超过 1800 万美元的 BTC，为区块链开辟了新途径。由\
  \ 200 多家公司组成的 R3 成立，旨在探索区块链的实现。PayPal 宣布整合。\n\n## 2015\n接受 BTC 的商家数量超过 10 万。\n纳斯达克和西班牙公司\
  \ Chain 团队测试了交易私人股份的技术。\n\n## 2016\n科技巨头 IBM 宣布了基于云解决方案的区块链策略。日本的增长使区块链变得合法化。\n\n\
  ## 2017\n比特币首次达到 1,000 美元。加密货币市场规模达到 500 亿美元。\n摩根大通首席执行官 Jamie Dimon 表示他相信区块链是未来，为账本提供了一种离开华尔街的方式。比特币达到历史高\
  \ 19,783.21 美元。\n迪拜宣布其由政府支持。\n\n## 2018\nFacebook 承诺启动区块链，并暗示可能创建自己的加密货币。\nIBM 与银行合作开发开发了基于区块链的平台。\n\
  \n# 什么是区块链？\n\n区块链被称为分布式账本技术（DLT），通过去中心化和哈希技术使数字资产的历史不可篡改。可以把它想象成一个 Google 文档。当我们创建一个文档并与小组共享时，文档是分发的而不是复制的。这创建了一个去中心化的链，让每个人都能访问该文档。没有人可以删除内容，所有的更改都会实时记录。当然，区块链比\
  \ Google 文档复杂，但它是一项极具前景的革命性技术，因为它有助于欺诈并带来透明性。\n\n# 区块是如何工作的？\n\n使用区块链的主要目的是让人们（特别是互不信任的人）以安全、防篡的方式共享数据。区块链由核心概念组成：区块、节点和矿工。\n\
  \n## 区块\n每个链由多个区块组成，每个区块包含三个基本元素：\n*   区块中的数据\n*   一个被称为 `nonce` 的 32 位数字。`nonce`\
  \ 在创建区块时随机生成，然后生成区块头哈希。\n*   `hash` 是一个添加到 `nonce` 之上的 256 位数字。它必须以大量的零开头（即非常小）。\n\
  \n当链的第一个区块被创建时，`nonce` 生成了加密哈希。区块中的数据被视为已签名并与 `nonce` 和哈希永久绑定，除非它被挖矿。\n\n## 矿工\n\
  矿工通过挖矿的过程在链上创建新区块。在区块链中，每个区块都有独特的 `nonce` 和 `hash`，但引引用链中上一个区块的 `hash`，因此挖掘区块并不容易，特别是在大型链上。矿工使用特殊软件来解决极其复杂的数学问题，寻找能够生成被接受哈希的\
  \ `nonce`。由于 `nonce` 只有 32 位，而 `hash` 有 256 位，在找到正确的组合之前，大约有四十亿种可能的 `nonce`-hash\
  \ 组合需要挖掘。当这种情况发生时，矿工被认为找到了“黄金 nonce”，他们的区块会被添加到链中。\n\n## 节点\n区块链技术最重要的概念之一是去中心化。没有一个计算机或组织可以拥有这条链。相反，它是通过连接到链的节点实现的分布式账本。节点可以是任何维护区块链副本并保持网络运行的电子设备。\n\
  \n\n\n\n每个节点都拥有自己的区块链副本，网络必须始终批准任何新挖掘的区块，以确保链的更新、受信任和验证。由于区块链是透明的，账本中的每项操作都可以被轻松地检查和查看。每个参与者都会获得一个唯一的字母数字识别码，用于显示其交易情况。\n\
  \n将公开信息与制衡机制相结合，有助于区块链维护完整性并在用户之间建立信任。从本质上说，区块链可以被看作通过技术实现的信任扩展。\n\n# 什么是比特币？\n\n\
  比特币是一种新型货币，其运作方式与传统货币非常不同。\n\n# 关于比特币需要了解的\n\n### 适合 way 比特币\n\n没有任何个人、公司或组织可以控制比特币：它是一种去中心化的数字货币，由一个巨大的分布式计算机网络驱动。因此，当你拥有比特币时，只有你本人可以访问你的资金。你通常会使用可以免费下载的安全数字钱包应用程序来发送、接收和存储比特币。非常重要的是记住这一点，由于没有银行或其他金融中介机构可以访问你的钱包应用，因此你负责保持它的安全。\n\
  \n## 比特币可用于移动和存储资金\n\n你可以像使用普通货币一样使用比特币。交易直接在人与人之间——个人或企业之间进行发送和接收。目前有两种比特币：比特币现金（`BCH`）和比特币（`BTC`）。当你使用比特币现金时，这些交易的成本极低（不到一分！）。因此，它们比银行转账更快。你也可以选择将资金存储为比特币。如果你存储大量资金，请考虑使用硬件钱包为你的存储增加一层安全性。\n\
  \n## 比特币被接受\n\n如果你是企业主，可以接受比特币支付。这样做有助于防止欺诈。你可以同时接受比特币现金和比特币支付；我们推荐使用比特币现金，因为交易更快、更可靠。无论何种方式，要作为业务接受比特币你需要两个工具。第一个是安全的数字钱包，你将通过它接收付款。第二个是支付网关（在线业务）或销售点应用程序（实体店业务）。我们的免费销售点应用程序支持\
  \ Android 和 iOS 设备，让你的客户能够使用比特币现金进行支付。\n\n## 比特币可以兑换为其他货币\n\n无论你是购买、接收还是赚得了比特币，都可以将其兑换为传统货币（法定货币）或其他数字货币。实现此点的最简单方法之一是通过加密货币交易所。在成熟交易所创建一个账户，并在验证身份后，你就可以出售你的比特币。或者，为了在兑换比特币时获得更好的差价，可以使用像\
  \ `Local.Bitcoin.com` 这样的交易平台。这让你匿名出售比特币现金（`BCH`），且费用远低于加密货币交易所。\n\n## 已确认的交易\n\n\
  驱动比特币网络的计算机在人们发送和接收比特币时，不断处理和验证最新交易。这些交易被公开记录在名为“区块链”的全球数字账本上。每当一组新的交易列表（称为“区块”）被添加到区块链时，每一个先前的比特币交易都会被网络定期确认。这被称为“确认”，交易的确认次数越多，它就越安全。你可以通过在区块浏览器中搜索交易\
  \ ID（称为 `TXID`）来检查某笔交易执行了多少次。\n\n## 匿名交易\n\n由于你不需要分享身份即可开设数字钱包，它比账户更具私密性。然而，比特币并不是私密的：区块链是公开的，这意味着所有交易都可以被查看（尽管无法识别身份）。为了保持比特币交易的私密性，请为每笔支付使用不同的地址。在钱包中执行此操作时，如果你正在接收比特币，请点击“新地址”。或者，在发送和接收比特币现金时，你可以使用像\
  \ `Cashuff` 这样的自动化工具来帮助增强隐私。这目前在比特币现金钱包中可用，并正在添加到其他钱包中。\n\n## 比特币交易\n\n比特币交易是你投机加密货币波动的。。虽然传统上是通过交易所购买比特币并希望价格上涨，现在交易者越来越多地使用衍生品来投机价格上涨或下跌。\n\
  \n## 影响比特币价格的因素\n\n ** **比特币供应**：供应上限为 2100 万枚，预计将在 2140 年耗尽。有限的供应意味着如果需求增加，比特币可能会可能会。\n\
  - **负面新闻**：任何有关比特币安全性和价值的消息都会产生负面影响。\n- **整合**：比特币的公众形象取决于其与新系统和框架的整合。如果执行成功，需求可能会增加。\n\
  - **关键事件**：监管变化、安全漏洞和宏观经济公告会影响价格。用户之间关于如何加速网络的任何协议也可能增加对比特币的信心——推动价格上涨\n\n# 比特币交易风格与策略\n\
  \n1. 日内交易\n2. 趋势交易\n3. 比特币对冲\n4. HODL（或长期持有）\n\n## 如何进行比特币日内交易\n\n比特币日内交易意味着你在单个交易日内开启并关闭立场——因此你不会在隔夜期间承担市场风险。这意味着你将避免隔夜资金费用。如果你希望从比特币的短期价格波动中获利，这种策略可能适合你，它能让你充分利用每日波动。\n\
  \n## 如何进行比特币趋势交易\n\n趋势交易意味着采取与当前趋势一致的立场。例如，如果市场处于看涨趋势，你就会做多；如果是看跌趋势，你就会做空。如果这种趋势开始放缓或反转，你会考虑关闭立场并开一个匹配新兴趋势的新立场。\n\
  \n## 对冲策略\n\n对冲比特币意味着通过采取与你已有的仓位相反的立场来减轻风险暴露。当你担心市场朝不利于你的方向发展时，你会这样做。\n\n\n\n\n\
  “HODL”比特币策略涉及买入并持有比特币。它的名称源于一个加密货币论坛上对“hold”（持有）的误写，现在通常被解释为“死死持有”（hold on for dear\
  \ life）。然而，这个词不应该太严肃——只有当你对比特币的长期价格持有乐观态度时，才应该买入并持有。如果你的研究或交易计划表明你应该卖出仓位以获利或止损，你应该这样做——或者你可以设置止损来自动平仓。\n\
  \n# 比特币交易：HODL 策略\n\n 选择你希望接触比特币的方式\n你有几种不同的方式可以接触比特币：\n\n*   交易比特币衍生品\n*   通过交易所购买比特币\n\
  *   加密货币 10 指数\n*   通过 IG 交易比特币衍生品 通过交易所购买比特币\n*   获取 1 个比特币的成本 零售客户保证金为币种总价值的 50%\
  \ 币种的全额\n*   空卖 是否 – 除非有意愿的交易对手\n*   监管 IG Group 是一家 FTSE 250 公司，IG 国际获得百慕大货币局许可\
  \ 无专门的监管机构\n*   执行 0.0014 秒的执行速度并评估我们独特的流动性 取决于交易所的流动性水平\n*   资金和提取限制 无，提取或添加资金是免费且实时的\
  \ 你可能会被收费并在添加或提取资金时遇到限制\n*   隔夜资金费用 是 否\n*   交易比特币衍生品\n*   与我们交易比特币衍生品意味着你并不是直接拥有比特币，而是通过\
  \ `CFDs` 对其价格进行投机。因此，你可以通过“做多”看涨价格上涨或通过“做空”看跌价格下跌。\n\n以下是与我们交易比特币衍生品的其他好处\n*   杠杆和保证金：`CFDs`\
  \ 总是通过杠杆交易，这意味着你只需要支付被称为保证金的存款——即可获得全面的市场敞口\n*   深度流动性：得益于我们的客户群，我们的市场具有深度，这意味着即使你进行大额交易，你的订单也可能以你的价格成交\n\
  *   对冲：使用衍生品进行做空可以有效地对冲你的投资组合并防止市场下跌的影响。\n\n# CFD 的主要优势\n*   客户可访问\n*   基于比特币交易\n\
  *   无佣金\n*   平台 Web、交易应用程序和 `MT4`\n*   通过交易所购买比特币\n*   通过交易所购买比特币主要适用于那些使用买入持有策略的人。这意味着你正在获得比特币的所有权，并预期它会上涨\n\
  \n# 交易所购买比特币的问题\n比特币交易所往往缺乏监管以及支持市场所需的设施\n交易所上的市价单通常不可靠，可能导致滑点或准确性降低\n比特币交易所通常对账户提现收取费用并限制，而账户可能需要几天时间\n\
  \n加密货币 10 指数\n除了交易比特币衍生品或从交易所购买币币，你还可以交易 `Crypto 10 Index`，它可以让你在单笔交易中接触比特币等 10\
  \ 种主流加密货币。该指数指定了这些加密货币，并密切跟踪或镜像它们的底层市场价格\n\n决定做多还是做空\n交易金融衍生品使得做多或做空成为可能，取决于当前的市场情绪。做多意味着你预期比特币价格将上涨，做空意味着你预期价格将下跌\n\
  \n设置你的止损和限价\n止损和限价是至关重要的风险管理工具，有多种工具可以选择\n\n*   普通止损会在设定水平平掉你的仓位，但如果底层市场价格变化迅速，它们可能会受到滑点影响。\n\
  *   移动止损随从有利的市场波动以锁定利润，同时限制你的下行风险。然而，它们也可能受到滑点影响。\n*   保证止损无论任何滑点，都会在设定水平平掉你的仓位。设置保证止损是免费的，但如果你的保证止损被触发，你将被收取费用。\n\
  \n这些工具都可以通过交易平台上的交易单进行选择\n\n开启并监控你的交易\n要开启交易，如果你认为价格将上涨，则买入；如果你认为价格将下跌，则卖出。一旦交易开启，你就需要监控市场以确保它朝着对你有利的方向移动。平台上的可用指标可以帮助你判断比特币价格可能的走向。指标可以帮助你监控波动性等当前市场状况\n\
  \n开账户\n当你想要获利或亏损达到设定水平时平掉仓位。你的利润将加入你的交易账户，而亏损将从账户中扣除\n\n# 比特币的一些替代方案\n### 1. Dash\n\
  Dash 是最流行的比特币替代方案。它是一个完整的现金管理平台，你可以在其中存储和花费数字货币进行即时交易。Dash 钱包具有以下功能：\n*   它允许你进行私有交易\n\
  *   费用比比特币及许多其他钱包低\n*   即时功能允许即时支付\n*   它使用去中心化网络，没有共同的信任赖\n*   高级加密和安全防护\n*   全球范围内的资金转账\n\
  \n### 2. Litecoin (莱币)\n当 Litecoin 在 2011 年 10 月推出时，它被称为比特币（黄金）的银色替代方案。Litecoin\
  \ 与比特币遵循相同的协议，但这种币的矿成本要低得多。其他特征如下\n*   比比特币更便宜\n*   挖掘更容易、更便宜\n*   它可以处理高额交易量\n\
  *   为消费级 GPU（处理器）构建\n*   比比特币更民主化\n*   安全且私密的加密\n\n### 3. Safecoin\nSafecoin 是由\
  \ SAFE 引入的数字代币，主要旨在奖励用户对网络的贡献。以下是该币的一些显著特征：\n*   流通中一次恰好有 43 亿个 Safecoin，每种币都有独特的身份。\n\
  *   用户可以交换他们的币来购买 SAFE 网络的任何服务\n*   直接与计算机交互，不涉及中间人\n*   自加密数据以增强安全性\n*   内置冗余和数据可用性\n\
  *   机会性数据缓存\n\n### 4. Peercoin (同业币)\nPeercoin 是另一种基于比特币的数字货币，它有自己的验证挖掘代币的方法。除了工作量证明\
  \ (POW) 之外，Peercoin 还实现了权益证明 (POS) 系统。其他特征如下所示。\n*   它是一种通胀性货币，没有固定的代币上限。\n*   史上第一个权益证明币\n\
  *   没有即时挖掘或内部预售，以确保公平分配\n*   可以在任何兼容比特币的设备上挖掘\n*   稳定且安全的数字货币\n\n### 5. Steem\n\
  Steem 的灵感源自“esteem”（尊严），是一种基于奖励的社交媒体货币系统。这种基于区块链的加密货币系统要求用户奖励他人的贡献。\n\n\n\n\n\n\
  奖励的过程与在 Facebook 上点赞或为帖子投票非常相似。以下是 Steem 硬币的特性。\n\n*   基于区块链的奖励分配系统。\n*   挖矿就像给帖子投票一样简单。\n\
  *   用户投票可获得 50% 的 Steem Dollars 和 50% 的 Steem Power。\n*   奖励在内容提交 24 小时后产生。\n\n\
  ## 6 Namecoin\n\nNamecoin 于 2011 年 4 月推出，目前市场供应量超过 750 万币。\n\n该硬币最初设计为 `.bit`（比特币）域名的备用\
  \ DNS。Namecoin 的特性如下：\n\n*   合并挖矿\n*   去中心化 DNS\n*   抗审查\n*   支持顶级域名 `.bit`\n* \
  \  TLS 证书验证\n\n## 7 Primecoin\n\nPrimecoin 被称为一种创新的加密货币，是一种基于质数搜索的工作量证明数字货币。其特征简述如下：\n\
  \n*   加密安全\n*   去中心化挖矿和分配\n*   适用于数学研究\n*   涉及对特殊质数链的搜索，即双孪生链（bi-twin chains）和坎宁哈链（Cunningham\
  \ chains）\n\n## 8 Novacoin\n\nNovac 是 Peercoin 的分支，因此基于相同的 POW/POS 系统。\n\n两者的区别在于\
  \ Novac 在其 POW 系统中使用加密哈希。其他特性描述如下：\n\n*   它同时利用 POW 和 POS，但具有独立的目标限制。\n*   它基于较版本的比特币。\n\
  *   它遵循每币每年浮动的奖励模型。\n*   它没有 POW 块签名。\n\n## 9 Feathercoin\n\nFeathercoin 是一种开源数字货币，使用点对点技术来绕过旧的银行解决方案。\n\
  \n它允许任何拥有兼容硬件和免费软件的人进行全球支付。\n\n该硬币基于 NeoCrypt，具有许多大多数其他加密货币不具备的特性。以下是 Feathercoin\
  \ 的一些特性：\n\n*   每个区块奖励 80 币\n*   受 Scrypt 保护\n*   eHR（增强哈希率）\n*   当前的 ASIC 抗性\n\
  *   ACP（高级检查）\n\n## 10 Ethereum\n\n以坊被称为第二大加密货币，是盈利能力最高的硬币之一。由于成本低廉，它拥有巨大的用户兴趣和算力。自从以太坊基金转向\
  \ POS 模型以来，对矿工来说继续支持 ETC 是最有利的。\n\n矿工可能会因其支持获得丰奖励。ETC 的主要特性是：\n\n*   多平台和硬件钱包\n\
  *   无挖矿欺诈防护\n*   第三方集成\n\n## 11 Stellar\n\nStellar 的区块链具有高增长性。Stellar 的非营性和社区方法帮助它在加密货币中流行起来。现在\
  \ Stellar 区块链技术在许多金融服务公司中需求巨大。从 IBM 到全球银行，Stellar 正在解决问题。\n\nXLM 在 2019 年的价格与其他加密货币相比也保持乐观。\n\
  \n## 12 Ripple\n\nRipple 也是长期投资加密货币的热门选择。Ripple 是许多银行和金融机构的首选。得益于 Ripple 的结算区块链，Ripple\
  \ Coin 在市场上获得了积极关注，并由于结算速度快和交易快速被活跃用于跨境支付。\n\n## 13 Monero\n\nMonero 是一种具有两个突出特性的虚拟货币——匿名性和隐私。这些特性使其成为受欢迎的隐私币。\n\
  \nMonero 硬币 `XMR` 通常由发送者使用隐身地址发送给接收者，以便他们可以检测并花费这些资金。你可以轻松投资 Monero 硬币以在 2021 年获得丰厚利润。SAG\
  \ IPL 是印度最优秀的移动应用程序开发公司，为其客户提供最好的加密货币创建服务。区块链在比特币和加密货币之外还有潜在应用前景。\n\n从业务角度来看，将区块链技术视为一种下一代业务流程改进软件是有帮助的。像区块链这样的协作技术承诺能够改进公司之间发生的业务流程，从根本上降低了“信任成本”。由于这个原因，对于每投入的美元投资，它提供的回报可能比大多数传统的内部投资高得多。金融机构正在使用区块链来跟踪结算。\n\
  \n# 区块链的优势\n\n## 分布式\n\n在区块链中，数据通常存储在分布式节点网络上，数据具有很强的抗攻击性。每个节点都可以复制并存储数据的副本，正因如此，不会发生故障。相比之下，存储在少数服务器上的数据更容易受到技术和网络攻击。\n\
  \n## 不可篡改\n\n已确认的区块不太被撤销，这意味着一旦数据记录在区块链上，它就是不可更改的。这使得区块链非常适合存储财务记录或任何永久记录在分布式账本上的审计轨迹。例如，一个企业可以使用区块链来防止欺诈行为。在这种情况下，区块链可以提供公司内部发生的所有交易的安全性记录。这将使员工隐藏交易变得更加困难。\n\
  \n## 无信任系统\n\n在大多数支付系统中，交易不仅取决于参与的双方，还取决于如银行、信用卡公司或支付提供者等中间机构。使用区块链时，这不再是必要的，因为分布式网络通过被称为“挖矿”的过程来验证交易。出于这个原因，区块链是无信任的。它消除了信任单一组织的风险，并通过剔除第三方降低了整体成本和交易费用。\n\
  \n# 区块链的劣势\n\n## 51% 攻击\n\n保护比特币区块链的工作量共识算法多年来已被证明非常高效。然而，针对区块链网络可以进行一些潜在的攻击，而 51%\
  \ 攻击是其中讨论最多的。如果一个实体能够控制网络超过 50% 的算力，就可能会发生这种攻击，这最终允许他们通过蓄意排除或修改交易顺序来破坏网络。\n\n尽管在理论上是可能的，但比特币区块链从未出现过成功的\
  \ 51% 攻击。随着网络不断扩大，安全性随之增加，矿工不太可能投入资金和资源来攻击比特币，因为诚实行为会获得更好的回报。除此之外，成功的 51% 攻击只能在短时间内修改最近的交易。\n\
  \n\n\n\n\n# 数据修改\n\n区块链系统的另一个缺点是，一旦数据被添加到区块链，就很难进行修改。虽然稳定性是区块链的优势之一，但它并不总是是好事。更改区块链数据或代码通常要求极高，并且通常需要硬分叉（hard\
  \ fork），即放弃一条链并采用一条新链。\n\n## 私钥\n\n区块链使用公钥（或非对称）加密法让用户对其加密货币单位（或任何其他区块链数据）拥有所有权。每个区块链地址都有对应的私钥。地址可以共享，但私钥必须保持保密。用户需要私钥来访问资金，这意味着他们充当了自己的银行。如果用户丢失了私钥，资金将实际上丢失，且他们对此无能为力。\n\
  \n## 低效率\n\n区块链，尤其是使用工作量证明（Proof of Work）的区块链，效率非常低。由于挖矿竞争激烈，且每十分钟只有一个获胜者，其他所有矿工的工作都白费了。随着矿工不断尝试增加计算能力以获得更大的发现有效区块哈值的概率，比特币网络在过去几年中使用的资源显著增加，目前消耗的能量超过了丹麦、爱尔兰和尼日利亚等许多国家。\n\
  \n## 存储\n\n区块链账本随时间推移可能会变得巨大。比特币区块链目前需要约 200 GB 的存储空间。区块链大小的增长似乎超过了硬盘的增长速度，如果账本变得个人无法下载和存储，网络将面临丢失节点的风险。\n\
  \n## 结语\n\n尽管存在缺点，区块链技术展现了一些独特的优势，而且它绝对会留存。我们距离主流化应用还有很长的路要走，但许多行业正在开始熟悉区块链系统的优缺点。未来几年，企业和政府可能会尝试新的应用，以找出区块链技术在何处产生最大的价值。\n\
  \n# 区块链中的术语\n\n-   **地址（钱包地址）**：用于在区块链网络上发送和接收交易。地址是一个字母数字哈希值，可以表示为二维码 代码。\n-  \
  \ **空投 (Airdrop)**：一种用于向钱包发送加密货币的代币发放方法。空投用于推荐或应用等营销目的。\n-   **物理隔离 (Air-gapped)**：一种安全方法，其设备不连接到互联网或任何网络。\n\
  - ****山寨币 (Altcoin)**：比特币之外的任何数字货币。山寨币是经过微调的分叉（例如莱特币）。\n-   **AML（反洗钱）**：一套颁布的国际法律，旨在减少犯罪组织或个人通过加密货币进行洗钱的潜力。\n\
  -   **API（应用程序编程接口）**：一种允许独立应用程序进行通信的软件接口。API 定义了组件之间的方法。\n-   **ASIC（专用集成电路）**：ASIC\
  \ 是为特定任务设计的硅芯片。在用于挖掘加密货币时，ASIC 在被放入哈希算法时将执行计算以寻找值。\n-   **比特币 (BTC)**：基于工作量证明区块链的第一种加密货币。比特币由中本聪（Satoshi\
  \ Nakamoto）于 2009 年创建——他 是一个身份未知的个体的假名——加密货币的概念在一份名为《比特币：点对点电子现金系统》的白书中进行了概述。\n\
  -   **区块链**：一种共识数字账本，由不可篡改的以区块形式打包的数字记录组成。每个区块都使用加密签名“链”到下一个区块。这允许区块链像账本一样，供任何具有适当权限的人共享和访问。点击此处了解更多关于区块链的信息。\n\
  -   **区块高度 (Block Height)**：区块链中连接在一起的区块数量。例如，高度 0 是第一个区块，也称为创世区块（Genesis Block）。\n\
  -   **区块奖励 (Block Reward)**：在矿工成功哈希一个交易区块后给予的奖励。区块奖励可以是硬币和交易费的混合。其组成取决于相关加密货币使用的策略，以及所有硬币是否已挖完。比特币目前的奖励是每个区块\
  \ 12.5 比特币。\n-   **赏金 / 漏洞赏金 (Bounty / Bug Bounty)**：对给定任务的奖励。任务包括识别代码漏洞、研究、交易和影响。\n\
  -   **客户端 (Client)**：通过本地计算机访问区块链以处理交易的软件。客户端通常包含钱包。\n-   **硬币 (Coin)**：通过其区块链生成的硬币或数字资产。\n\
  -   **冷钱包 / 冷存储 (Cold Wallet / Cold Storage)**：从不连接互联网的离线钱包。这些钱包保护加密货币。\n-   **确认\
  \ / 区块确认 (Confirmation / Block Confirmation)**：确认意味着网络已经验证了区块链交易。这是通过被称为工作量证明（例如比特币）中的挖矿过程实现的。一旦交易被完全确认，执行双重花费就会变得困难。\n\
  -   **共识 (Consensus)**：一组同等节点负责维护分布式账本使用的使用的过程。对账本内容的使用达成共识的方法。\n-   **加密货币 (Cryptocurrency)**：基于数学的数字货币，使用加密来监管货币单位的创建以及验证资金的转账。加密货币独立于中央银行运行。\n\
  -   **密码学 (Cryptography)**：一种使用代码进行安全通信的方法。对称密钥加密被各种区块链网络用于加密货币的传输。为钱包生成的地址与私钥配对，允许加密货币的传输。配对的公钥和私钥允许解锁资金。\n\
  -   **DAO（数字去中心化自治组织）**：也称为数字去中心化自治组织。或者，第一个已知的 DAO 名为 The DAO。The DAO 作为一种投资者导向的风险投资基金的形式，旨在为企业提供新的去中心化业务模型。基于以太坊的\
  \ DAO 代码是开源。该组织在 2016 年创下了众筹项目的记录，但这些资金部分被黑客盗取了。这次黑客攻击导致了以太坊的分叉，从而导致了以太坊经典（Ethereum\
  \ Classic）的创建。\n-   **去中心化 (Decentralization)**：将权力和责任从中央组织、政府或一方转移到去中心化网络。\n- \
  \  **去中心化应用 (dApp)**：在去中心化网络（通常是区块链）而不是单个计算机服务器上的应用程序。\n-   **去中心化金融 (DeFi)**：一种基于区块链技术的金融生态系统，提供不依赖传统中介的金融服务。\n\
  \n\n\n\n\n去中心化金融——通常被称为 DeFi 或开放金融——是指由去中心化技术（特别是区块链网络）实现的经济范式。DeFi 代表了从中心化、封闭的金融系统向通用可访问经济的转变，这种经济基于具有互操作性、可编程组合性的开放协议。\n\
  \n## 存款 (Deposit)\n存入涉及另一方的合约中的数字财产，如果无法满足某些条件，该财产将自动没收给指定的交易对手。\n\n## 数字资产\n一种具有市场价值的、稀缺的、可电子化传输的且无形的数字商品。\n\
  \n## 数字身份\n由个人、组织或电子设备采用的在线或网络身份。\n\n## 数字签名\n通过公钥加密生成的代码，并附接在电子传输的文档上，以验证文档的内容。\n\
  \n## 分布式拒绝服务 (DoS)攻击\n一种超级攻击，攻击者通过不断向系统发送大量请求，以阻止合法请求的服务。\n\n## 分布式账本\n一种跨越多个站点、国家或机构的数据库。记录按顺序存储在连续的账本中。分布式账本数据可以是“许可的”或“非许可的”，以控制谁可以查看它。\n\
  \n## 难度 (Difficulty)\n在工作量证明（Proof of Work）挖掘期间，衡量区块链网络验证区块难程度的概念。在比特币网络中，挖掘难度每\
  \ 2016 个区块调整一次。这是为了将区块验证时间保持在十分钟。\n\n## 双重花费 (Double Spend)\n比特币网络中的人试图同时向两个不同的接收者发送特定的比特币交易的事件。然而，一旦比特币交易被确认，进行双重花费就变得几乎不可能。特定交易获得的确认次数越多，该笔比特币被双重花费的可能性就越低。\n\
  \n## 以太坊企业联盟 (EEA)\n由以太坊核心开发者、初创公司大公司组成的团体，致力于将以太坊商业化并应用于不同的业务场景。\n\n## EIP (以太坊改进提案)\n\
  以太坊改进提案（EIP）描述了以太坊平台的标准，包括核心协议规范、客户端 API 和合约标准。\n\n## 加密 (Encryption)\n一种将文档（明文）与较短的数据字符串（称为“密钥”）相结合以产生输出（密文）的过程。该输出可以由拥有密钥的人“解密”回原始明文。\n\
  \n## ERC20 代币标准\nERC 是 Ethereum 的缩写，后跟着数字。ERC20 是以太坊智能合约代币的标准。这组规则定义了代币在以太坊网络中必须满足的条件。\n\
  \n## ERC721 代币标准\n一种非同质化代币标准。该代币标准用于表示不可交换的资产。\n\n## 以太坊 (ETH)\n以太是以太坊区块链的原生货币。也称为\
  \ ETH——作为交易媒介作为以太坊的燃料。\n\n## 以太坊 (Ethereum)\n一个开发者在其上构建和运行程序的公共区块链和去中心化平台。\n\n##\
  \ EVM (以太坊虚拟机)\n以太坊虚拟机（EVM）是完整的，允许任何代码执行。所有以太坊节点运行在 EVM 上。该项目旨在防止拒绝服务攻击。它是基于以太坊的智能合约之家。\n\
  \n## 交易所 (Exchange)\n交易加密货币的地方。由 Coinbase 和 Gemini 等公司运营的中心化交易所充当中间人，而去中心化交易所没有中央机构。\n\
  \n## 法币 (Fiat Currency)\n政府发行的货币。例如：美元 (USD)、欧元 (EUR)、人民币 (CNY) 和日元 (JPY)。\n\n##\
  \ 分叉 (Fork)\n分叉创建一个区块链的替代版本，通常用于对网络进行升级。软分叉（Soft Forks）使两条链具有某些兼容性，而硬分叉（Hard Forks）创建一个必须采用才能继续的新链版本。在发生争议性硬分叉的情况下，可能会创建区块链网络的两个版本。\n\
  \n## Gas (燃料)\n衡量以太坊网络上交易所需的计算工作量的标准，等同于网络用户以指定的 Wei 为单位支付的 ETH 费用。\n\n## 创世区块 (Genesis\
  \ Block)\n区块链网络历史中计算出的初始数据块。\n\n## Wei\nETH 的一种极小且常见的单位，通常用于指定 Gas 价格。\n\n## 哈希\
  \ (Hash)\n一种接收输入并输出被称为“哈希”或“摘要”的字母数字字符串的函数。区块链中的每个区块都包含之前的交易的哈希。区块链上的哈希确认。\n\n###\
  \ 半半 (Halving)\n比特币等加密货币具有有限的供应量，这使其成为商品。发行的比特币总量是有限的。比特币的数量每四年减少 50%。这被称为减半。\n\n\
  当区块链发生不向后兼容（不与旧版本兼容）的变化时就会发生硬分叉，强制所有参与者升级到新版本才能参与网络。\n\n## 硬件钱包 (Hardware Wallet)\n\
  一种物理设备——如 Ledger 钱包——可以连接到网络也可以作为冷存储（不连接互联网）。\n\n## 热钱包 / 冷存储 (Hot Wallet / Cold\
  \ Storage)\n有时直接连接到互联网的钱包，例如位于中心化交易所的钱包。热钱包的安全性认为低于冷存储系统或硬件钱包。\n\n## 混合共识模型：PoS\
  \ / PoW\n一种结合权益证明（PoS）和工作量证明（PoW）的混合共识模型。使用这种混合共识机制，区块不仅由矿工，还由投票者（利益者）验证，以形成平衡的网络治理。\n\
  \n## 不可变性 (Immutability)\n无法随时间修改或更改的能力。区块链网络的关键要素，一旦写入区块链账本，数据就无法更改。这种不可变性为区块链网络上进行商业和贸易提供了基础。\n\
  \n## 首次币发行 (ICO)\n当新的加密货币出售预售代币以换取预付款时，就会发生首次币发行。\n\n## 星际文件系统 (IPFS)\n一种用于以太坊区块链的去中心化文件存储和引用系统。IPFS\
  \ 是一种开源协议，能够分布式方式存储和共享媒体（文本、音频、视觉），而不依赖于单点故障。这种分布式文件系统使应用程序运行更快、更安全、更透明。\n\n## 了解您的客户\
  \ (KYC)\n企业必须验证其客户身份和背景信息（地址、财务状况等）的过程。例如，目前的法规和法律要求银行和其他金融机构保留并报告客户的个人信息和交易情况。\n\
  \n\n\n公司或市场流动资产的可用性。如果一种资产可以很容易转换为现金，则它被认为具有更强的流动性。将资产转换为现金的能力越困难，该资产的流动性就越低。例如，股票被认为是流动性较高的资产，因为它们可以很容易转换为现金，而房地产被认为是非流动性资产。资产的流动性影响其风险潜力和市场价格。\n\
  \n流动性民主（委托民主）\n一种政府制度，选票可以委托或代理给其他个人，如朋友、政治家或领域专家。例如，在流动性民主中，Bob 可以将自己的选票交给 Alice，然后\
  \ Alice 将同时代表她自己和 Bob 投票。流动性民主已被探索作为去中心化自治组织（DAO）的治理机制，每个参与者都能投票或将自己的选票委托给另一个个人。\n\
  \n主网\n在特定分布式账本上发生实际交易的主要网络。例如，以太坊主网是进行网络验证和交易的公共区块链。\n\n市值\nMarket Capitalization（市场价值）的缩写，该术语是指特定行业、市场、公司或资产的总价值。对于上市公司，市值是公司未发行股份的总美元市场价值。对于比特币或以太坊，总市值是当前现有供应乘以市场价格的反映。\n\
  \n默克尔树\n类似于家族树的概念，其中父分支分裂成子分支，然后外推为孙子分支。默克尔树是一种数据结构，单个哈希函数（加密代码）分裂成更小的分支。在图中，哈希（Hash）变为“Hash\
  \ 0”和“Hash 1”，然后再次分裂并表示在区块链上。这种数据结构能够在区块网络上进行快速验证。\n\n挖矿\n对“区块”或交易进行验证并添加到区块中的过程。为了验证区块，矿工必须使用密码学问题。一旦问题被解决，该区块被认为已“挖掘”。在比特币或以太坊区块链中，矿工获得比特币或以太币。\n\
  \n多签名（Multig）\n一种需要多重签名的加密钱包。需要指定数量的个人来“签名”交易。这与只需要一个签名即可批准的钱包不同。\n\n节点（全节点）\n连接到任何计算机都称为节点。全节点是能够验证交易并下载所有区块链数据的计算机。节点并不下载所有数据。\n\
  \n非同质化代币（NFT）\n同质性是指物体与其他物体交换的能力。例如，美元被认为是同质的，因为我们可以与其他进行交易。艺术品通常被视为非同质的绘画、雕塑或杰作，它们的价值是不相等的。非同质化代币是一种独特且没有等物的代币。\n\
  \n预言机\n通常，预言机是指任何依赖于报告事件的实体或个人。在区块链网络中，预言机（人或机器）帮助将数据传输到智能合约，然后可以用于验证事件或特定结果。\n\n\
  点对点指的是发生在两个双方之间的交互，通常是两个独立的个人。P2P 网络可以是任意数量的个人。在区块链网络中，个人可以相互进行交易或交互，而无需依赖中间人或单点故障。\n\
  \n许可账本\n一种访问账本或网络需要个人或一组个人许可的区块链网络。许可账本可能有一个或多个所有者。许可账本上的共识由受信任的实体执行，例如政府部门、银行或其他已知实体。许可区块链或账本包含高度可验证的数据集，因为共识过程创建一个数字签名，所有方都可以看到。许可账本的维护比公共区块链容易得多，速度也快得多。例如，Quorum\
  \ 或 Hyperledger Besu 是可以为大型企业更容易的许可账本。相比之下，以太坊区块链是任何人都可以访问的账本。\n\n私有区块链\n由单一实体控制的封闭网络的区块链或分布式账本。私有区块链需要验证交易。私有区块链还限制了参与共识的个人。\n\
  \n私有货币\n由个人或公司使用的货币或代币。通常，该代币限制在公司网络内部使用，且不具有隐藏身份等隐私功能。\n\n私钥\n私钥是一个与单个钱包/公钥对应的字母数字字符串数据。私钥可以被视为让个人访问其钱包的奖励。谁拥有账户的私钥，谁就控制资金。\n\
  \n权威证明\n一种用于私有区块链的共识机制，授予单个密钥生成所有区块或交易的权限。\n\n权益证明（PoS）\n一种替代共识协议，其中个人或验证者使用自己的加密货币来验证交易。验证者在其选择要验证的交易上“质押”他们的加密货币（如以太币）。如果个人正确验证了区块（交易组），则该个人将获得奖励。通常，如果验证者验证了错误的交易，他们将失去质押的加密货币。与工作证明相比，权益证明所需的计算能力微乎其微（参见混合共识模型）。\n\
  \n工作证明（PoW）\n一种用于跨系统建立共识的协议，将挖矿与计算能力挂钩。对区块进行哈希处理（这本身是一个简单的计算过程）现在需要每个矿工去求解一组困难的变量。实际上，对每个区块进行哈希的过程变成了一种竞争。这种求解目标值的增加增加了成功哈希每个区块的难度。对于每个哈希过的区块，整个哈希过程将花费一些时间和计算努力。因此，哈希过的区块被认为是已的（参见混合混合共识模型）。\n\
  \n协议\n一组规定数据交换和传输的规则。在区块链中，当提到概述在特定网络中如何执行这些操作的正式规则时，它指的是加密货币。\n\n公共区块链\n一个全球开放的网络，任何人都可以参与交易、执行共识协议以帮助哪些区块被添加到链中并维护共享账本。\n\
  \n公钥\n\n\n\n\n任何人都可以获取并使用，在消息发送给具有匹配解密密钥的已知接收者之前进行加密。通过将公钥与私钥配对，可以实现不依赖参与方或中间者的交易。公钥将消息加密为不可读的格式，而相应的私钥则让目标方再次使其变得可读。\n\
  \n## 中继者 (Relayer)\n任何托管链外订单簿的节点或实体。中继者帮助交易者发现对手，并在他们之间通过密码学方式移动订单。0x 是一个流行的以太坊中继者协议。\n\
  \n### 中本聪明 (Satoshi Nakamoto)\n创建比特币协议的匿名个人或实体，解决了数字货币的“双重花费”问题。中本在 2008 年首次发表了描述该项目的白皮书，并在一年后发布了首个比特币软件。\n\
  \n## 序列化 (Serialization)\n将数据结构转换为字节序列的过程。以太坊内部使用一种名为递归长度前缀编码（RLP）的编码格式。\n\n## 可扩展性\
  \ (Scalability)\n为了处理网络需求而进行的尺寸或规模变化。该词指区块链项目处理网络流量、未来增长以及在其预期应用中容量的能力。\n\n## 分片\
  \ (Shard)\n分片是指将整个网络分成多个称为“分片”的部分。每个分片都包含自己的自己的独立状态，这意味着一组独特的账户余额和智能合约。通常，分片之间必须紧密耦合，而侧链必须松散耦合。\n\
  \n## 惩罚条件 (Slashing condition)\n导致验证者在触发条件时其质押被销毁的条件。\n\n## 智能合约 (Smart Contracts)\n\
  智能合约是将条款记录在计算机语言而非法律语言中的程序。智能合约是在满足一组条件后即可进行编码和执行的自动化操作。\n\n## 自执行 (Self-executing)\n\
  自身运行，不受自身之外的任何对象的控制。自执行合约通过消除对第三方的信任需求来降低成本/开销。\n\n## 软分叉 (Soft Fork)\n软件协议的更改，其中只有有效交易才是有效的。由于旧节点会将新区块识别为有效，因此软分叉是后兼容的。然而，这可能导致区块链的分裂，因为区块将按照新规则生成。\n\
  \n## Solidity\n用于在以太坊上编写智能合约的编程语言。\n\n## 稳定 (Stable)\n任何锚定到稳定资产（如黄金）的加密货币。由于它是根据已知资产的数量进行衡量的，因此价格保持稳定。\n\
  \n## 状态 (State)\n区块链需要追踪且当前与其上的应用相关的数据集。\n\n## 测试网 (Testnet)\n用于在安全环境中测试应用程序的替代区块链。\n\
  \n## Kovan 测试网\n使用权威证明（Proof of Authority）的以太坊测试网，目前支持 Parity。\n\n## Rinkeby 测试网\n\
  使用权威证明的以太坊测试网，目前支持 go。\n\n## Popsten 测试网\n使用工作量证明（Proof of Work）的以太坊测试网，可以使用 go，且目前是最流行的。（注意：“Popsten”\
  \ 似乎是 Ropsten 的拼写错误，但根据指示予以了保留）。\n\n## 代币 (Token)\n代币代表构建在现有区块链上的资产（不同于硬币 Coin）。代币被设计为独特的、安全的、即时传输的数字资产。\n\
  \n## 交易区块 (Transaction Block)\n区块链网络上的交易集合，被收集到一个区块中，然后进行哈希处理并添加到区块链中。\n\n## 交易费用\
  \ (Transaction Fee)\n对跨区块链网络发送的某些交易征收的小额费用。交易费用奖励给成功哈希包含相关交易区块的矿工。\n\n## 图灵完备 (Turing\
  \ Complete)\n任何在计算水平上等于可编程机器都是图灵完备的，或者说是计算通用的。\n\n## 验证者 (Validator)\n权益证明（Proof\
  \ of Stake）共识的参与者。验证者需要提交安全质押以进入验证者集合。\n\n## 钱包 (Wallet)\n数字资产（加密货币）的指定存储位置，拥有发送接收资金的地址。钱包可以是在线、离线或位于物理设备上。\n\
  \n## zk-SNARK\nzk-SNARK 是零知识简洁非交互知识证明的缩写，是一种密码学证明系统，使使用户可以在不泄露交易实际数据且不与发布交易的用户交互的情况下验证交易。\n\
  \n## 51% 攻击 (51% Attack)\n如果网络超过一半的计算能力或矿哈希率由单个人或团体运行，则可能会发生 51% 攻击。这意味着该实体对网络拥有完全控制权，并通过接管操作、停止或更改交易以及双重花费代币对加密货币产生负面影响。\n\
  \n# 结论\n大多数区块链设计为去中心化的数据库，作为分布式账本。这些区块链账本以区块记录并存储数据，区块按时间顺序组织，并通过密码学证明链接。区块链技术的出现为许多行业带来了许多优势，在无信任环境中提供了更高的安全性。然而，其去中心化的特性也带来了一些缺点。例如，与传统的中心化数据库相比，区块链的效率有限，并且需要更大的存储空间。\n\
  \n"
