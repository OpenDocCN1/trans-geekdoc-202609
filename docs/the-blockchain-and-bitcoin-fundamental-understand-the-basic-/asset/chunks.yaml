  trans: "\n每个节点都拥有自己的区块链副本，网络必须始终批准任何新挖掘的区块，以确保链的更新、受信任和验证。由于区块链是透明的，账本中的每项操作都可以被轻松地检查和查看。每个参与者都会获得一个唯一的字母数字识别码，用于显示其交易情况。\n\
    \n将公开信息与制衡机制相结合，有助于区块链维护完整性并在用户之间建立信任。从本质上说，区块链可以被看作通过技术实现的信任扩展。\n\n# 什么是比特币？\n\
    \n比特币是一种新型货币，其运作方式与传统货币非常不同。\n\n# 关于比特币需要了解的\n\n### 适合 way 比特币\n\n没有任何个人、公司或组织可以控制比特币：它是一种去中心化的数字货币，由一个巨大的分布式计算机网络驱动。因此，当你拥有比特币时，只有你本人可以访问你的资金。你通常会使用可以免费下载的安全数字钱包应用程序来发送、接收和存储比特币。非常重要的是记住这一点，由于没有银行或其他金融中介机构可以访问你的钱包应用，因此你负责保持它的安全。\n\
    \n### 比特币可用于移动和存储资金\n\n你可以像使用普通货币一样使用比特币。交易直接在人与人之间——个人或企业之间进行发送和接收。目前有两种比特币：比特币现金（`BCH`）和比特币（`BTC`）。当你使用比特币现金时，这些交易的成本极低（不到一分！）。因此，它们比银行转账更快。你也可以选择将资金存储为比特币。如果你存储大量资金，请考虑使用硬件钱包为你的存储增加一层安全性。\n\
    \n### 比特币被接受\n\n如果你是企业主，可以接受比特币支付。这样做有助于防止欺诈。你可以同时接受比特币现金和比特币支付；我们推荐使用比特币现金，因为交易更快、更可靠。无论何种方式，要作为业务接受比特币你需要两个工具。第一个是安全的数字钱包，你将通过它接收付款。第二个是支付网关（在线业务）或销售点应用程序（实体店业务）。我们的免费销售点应用程序支持\
    \ Android 和 iOS 设备，让你的客户能够使用比特币现金进行支付。\n\n### 比特币可以兑换为其他货币\n\n无论你是购买、接收还是赚得了比特币，都可以将其兑换为传统货币（法定货币）或其他数字货币。实现此点的最简单方法之一是通过加密货币交易所。在成熟交易所创建一个账户，并在验证身份后，你就可以出售你的比特币。或者，为了在兑换比特币时获得更好的差价，可以使用像\
    \ `Local.Bitcoin.com` 这样的交易平台。这让你匿名出售比特币现金（`BCH`），且费用远低于加密货币交易所。\n\n### 已确认的交易\n\
    \n驱动比特币网络的计算机在人们发送和接收比特币时，不断处理和验证最新交易。这些交易被公开记录在名为“区块链”的全球数字账本上。每当一组新的交易列表（称为“区块”）被添加到区块链时，每一个先前的比特币交易都会被网络定期确认。这被称为“确认”，交易的确认次数越多，它就越安全。你可以通过在区块浏览器中搜索交易\
    \ ID（称为 `TXID`）来检查某笔交易执行了多少次。\n\n### 匿名交易\n\n由于你不需要分享身份即可开设数字钱包，它比账户更具私密性。然而，比特币并不是私密的：区块链是公开的，这意味着所有交易都可以被查看（尽管无法识别身份）。为了保持比特币交易的私密性，请为每笔支付使用不同的地址。在钱包中执行此操作时，如果你正在接收比特币，请点击“新地址”。或者，在发送和接收比特币现金时，你可以使用像\
    \ `Cashuff` 这样的自动化工具来帮助增强隐私。这目前在比特币现金钱包中可用，并正在添加到其他钱包中。\n\n### 比特币交易\n\n比特币交易是你投机加密货币波动的。。虽然传统上是通过交易所购买比特币并希望价格上涨，现在交易者越来越多地使用衍生品来投机价格上涨或下跌。\n\
    \n### 影响比特币价格的因素\n\n ** **比特币供应**：供应上限为 2100 万枚，预计将在 2140 年耗尽。有限的供应意味着如果需求增加，比特币可能会可能会。\n\
    - **负面新闻**：任何有关比特币安全性和价值的消息都会产生负面影响。\n- **整合**：比特币的公众形象取决于其与新系统和框架的整合。如果执行成功，需求可能会增加。\n\
    - **关键事件**：监管变化、安全漏洞和宏观经济公告会影响价格。用户之间关于如何加速网络的任何协议也可能增加对比特币的信心——推动价格上涨\n\n# 比特币交易风格与策略\n\
    \n1. 日内交易\n2. 趋势交易\n3. 比特币对冲\n4. HODL（或长期持有）\n\n### 如何进行比特币日内交易\n\n比特币日内交易意味着你在单个交易日内开启并关闭立场——因此你不会在隔夜期间承担市场风险。这意味着你将避免隔夜资金费用。如果你希望从比特币的短期价格波动中获利，这种策略可能适合你，它能让你充分利用每日波动。\n\
    \n### 如何进行比特币趋势交易\n\n趋势交易意味着采取与当前趋势一致的立场。例如，如果市场处于看涨趋势，你就会做多；如果是看跌趋势，你就会做空。如果这种趋势开始放缓或反转，你会考虑关闭立场并开一个匹配新兴趋势的新立场。\n\
    \n### 对冲策略\n\n对冲比特币意味着通过采取与你已有的仓位相反的立场来减轻风险暴露。当你担心市场朝不利于你的方向发展时，你会这样做。\n"
