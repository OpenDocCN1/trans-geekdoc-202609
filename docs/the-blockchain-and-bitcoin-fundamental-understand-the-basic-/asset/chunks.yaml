  trans: '


    奖励的过程与在 Facebook 上点赞或为帖子投票非常相似。以下是 Steem 硬币的特性。


    *   基于区块链的奖励分配系统。

    *   挖矿就像给帖子投票一样简单。

    *   用户投票可获得 50% 的 Steem Dollars 和 50% 的 Steem Power。

    *   奖励在内容提交 24 小时后产生。


    ## 6 Namecoin


    Namecoin 于 2011 年 4 月推出，目前市场供应量超过 750 万币。


    该硬币最初设计为 `.bit`（比特币）域名的备用 DNS。Namecoin 的特性如下：


    *   合并挖矿

    *   去中心化 DNS

    *   抗审查

    *   支持顶级域名 `.bit`

    *   TLS 证书验证


    ## 7 Primecoin


    Primecoin 被称为一种创新的加密货币，是一种基于质数搜索的工作量证明数字货币。其特征简述如下：


    *   加密安全

    *   去中心化挖矿和分配

    *   适用于数学研究

    *   涉及对特殊质数链的搜索，即双孪生链（bi-twin chains）和坎宁哈链（Cunningham chains）


    ## 8 Novacoin


    Novac 是 Peercoin 的分支，因此基于相同的 POW/POS 系统。


    两者的区别在于 Novac 在其 POW 系统中使用加密哈希。其他特性描述如下：


    *   它同时利用 POW 和 POS，但具有独立的目标限制。

    *   它基于较版本的比特币。

    *   它遵循每币每年浮动的奖励模型。

    *   它没有 POW 块签名。


    ## 9 Feathercoin


    Feathercoin 是一种开源数字货币，使用点对点技术来绕过旧的银行解决方案。


    它允许任何拥有兼容硬件和免费软件的人进行全球支付。


    该硬币基于 NeoCrypt，具有许多大多数其他加密货币不具备的特性。以下是 Feathercoin 的一些特性：


    *   每个区块奖励 80 币

    *   受 Scrypt 保护

    *   eHR（增强哈希率）

    *   当前的 ASIC 抗性

    *   ACP（高级检查）


    ## 10 Ethereum


    以坊被称为第二大加密货币，是盈利能力最高的硬币之一。由于成本低廉，它拥有巨大的用户兴趣和算力。自从以太坊基金转向 POS 模型以来，对矿工来说继续支持 ETC
    是最有利的。


    矿工可能会因其支持获得丰奖励。ETC 的主要特性是：


    *   多平台和硬件钱包

    *   无挖矿欺诈防护

    *   第三方集成


    ## 11 Stellar


    Stellar 的区块链具有高增长性。Stellar 的非营性和社区方法帮助它在加密货币中流行起来。现在 Stellar 区块链技术在许多金融服务公司中需求巨大。从
    IBM 到全球银行，Stellar 正在解决问题。


    XLM 在 2019 年的价格与其他加密货币相比也保持乐观。


    ## 12 Ripple


    Ripple 也是长期投资加密货币的热门选择。Ripple 是许多银行和金融机构的首选。得益于 Ripple 的结算区块链，Ripple Coin 在市场上获得了积极关注，并由于结算速度快和交易快速被活跃用于跨境支付。


    ## 13 Monero


    Monero 是一种具有两个突出特性的虚拟货币——匿名性和隐私。这些特性使其成为受欢迎的隐私币。


    Monero 硬币 `XMR` 通常由发送者使用隐身地址发送给接收者，以便他们可以检测并花费这些资金。你可以轻松投资 Monero 硬币以在 2021 年获得丰厚利润。SAG
    IPL 是印度最优秀的移动应用程序开发公司，为其客户提供最好的加密货币创建服务。区块链在比特币和加密货币之外还有潜在应用前景。


    从业务角度来看，将区块链技术视为一种下一代业务流程改进软件是有帮助的。像区块链这样的协作技术承诺能够改进公司之间发生的业务流程，从根本上降低了“信任成本”。由于这个原因，对于每投入的美元投资，它提供的回报可能比大多数传统的内部投资高得多。金融机构正在使用区块链来跟踪结算。


    # 区块链的优势


    ### 分布式


    在区块链中，数据通常存储在分布式节点网络上，数据具有很强的抗攻击性。每个节点都可以复制并存储数据的副本，正因如此，不会发生故障。相比之下，存储在少数服务器上的数据更容易受到技术和网络攻击。


    ### 不可篡改


    已确认的区块不太被撤销，这意味着一旦数据记录在区块链上，它就是不可更改的。这使得区块链非常适合存储财务记录或任何永久记录在分布式账本上的审计轨迹。例如，一个企业可以使用区块链来防止欺诈行为。在这种情况下，区块链可以提供公司内部发生的所有交易的安全性记录。这将使员工隐藏交易变得更加困难。


    ### 无信任系统


    在大多数支付系统中，交易不仅取决于参与的双方，还取决于如银行、信用卡公司或支付提供者等中间机构。使用区块链时，这不再是必要的，因为分布式网络通过被称为“挖矿”的过程来验证交易。出于这个原因，区块链是无信任的。它消除了信任单一组织的风险，并通过剔除第三方降低了整体成本和交易费用。


    # 区块链的劣势


    ### 51% 攻击


    保护比特币区块链的工作量共识算法多年来已被证明非常高效。然而，针对区块链网络可以进行一些潜在的攻击，而 51% 攻击是其中讨论最多的。如果一个实体能够控制网络超过
    50% 的算力，就可能会发生这种攻击，这最终允许他们通过蓄意排除或修改交易顺序来破坏网络。


    尽管在理论上是可能的，但比特币区块链从未出现过成功的 51% 攻击。随着网络不断扩大，安全性随之增加，矿工不太可能投入资金和资源来攻击比特币，因为诚实行为会获得更好的回报。除此之外，成功的
    51% 攻击只能在短时间内修改最近的交易。


