    \ shouldn’t be taken too seriously – you should only buy and hold bitcoin if you’ve\
    \ got a positive outlook on its long-term price. If your research or trading plan\
    \ indicates that you should sell your positions to take profit or limit loss,\
    \ you should – or you could set stops to close your positions automatically.\n\
    \n# Bitcoin Trading: HODL Strategy\n\n Choose how you want to get exposure to\
    \ bitcoin\nThere are a few different ways that you can get exposure to bitcoin:\n\
    \n*   Trading bitcoin derivatives\n*   Buying bitcoin through an exchange\n* \
    \  Crypto 10 index\n*   Trading bitcoin derivatives with IG Buying bitcoin through\
    \ an exchange\n*   Cost to get exposure to 1 bitcoin Margin for retail clients\
    \ is 50% of the total value of the coin Full cost of the coin\n*   Short selling\
    \ Yes No – unless there is a willing counterparty\n*   Regulation IG Group is\
    \ a FTSE 250 company, and IG international is licensed by the Bermuda Monetary\
    \ Authority No dedicated regulatory body in place\n*   Execution 0.0014 second\
    \ execution speed and assess our unique liquidity Dependent on exchange liquidity\
    \ levels\n*   Restrictions on funding and withdrawing None, withdrawing or adding\
    \ funds is free and instant You may be charged fees and encounter restrictions\
    \ on adding or withdrawing funds\n*   Overnight funding charge Yes No\n*   Trading\
    \ bitcoin derivatives\n*   Trading bitcoin derivatives with us means that instead\
    \ of owning bitcoin outright, you’ll be speculating on its price with `CFDs`.\
    \ As a result, you’ll be able to take a position on bitcoin’s price rising by\
    \ ‘going long’ or falling by ‘going short’.\n\nHere are other benefits of trading\
    \ bitcoin derivatives with us\n*   Leverage and margin: `CFDs` are always traded\
    \ with leverage which means you’ll only have to put deposit known as margin –\
    \ get full market exposure\n*   Deep liquidity: thanks to our client base, our\
    \ market is deep means you’re more likely to have your orders filled at your price\
    \ even if you deal in larges\n*   Hedging: shorting with derivatives can be effective\
    \ to hedge your portfolio and protect market declines.\n\n# Main Benefits of CFD\n\
    *   Accessible to clients\n*   Traded on bitcoin\n*   Commission-free\n*   Platforms\
    \ Web, trading app and `MT4`\n*   Buying bitcoin through exchange\n*   Buying\
    \ bitcoin through exchange is mainly for those use buy-and-hold strategy. This\
    \ means you’re taking ownership of bitcoin with expectation it will rise\n\n#\
    \ Problems Associated with Buying bitcoin an exchange\nBitcoin exchanges often\
    \ lack regulation and the infrastructure needed to support markets\nMarket orders\
    \ on exchanges are often unreliable which can result in slippage or reduced accuracy\n\
    Bitcoin exchanges often impose fees and restrictions on withdrawing from your\
    \ account, while accounts can take days\n\nCrypto 10 Index\nAs well as trading\
    \ bitcoin derivatives or buying coins from an exchange, you can trade `Crypto\
    \ 10 Index` that gives you exposure to 10 major cryptocurrencies like Bitcoin\
    \ in one single trade. This index specifies these cryptocurrencies and closely\
    \ tracks or mirrors the underlying market price of them\n\nDecide to go Long or\
    \ Short\nTrading financial derivatives makes it possible to go both long or short,\
    \ depending on the current market sentiment. Going long means you expect bitcoin’s\
    \ price to rise, and going short means that you expect the price to fall\n\nSet\
    \ your Stops And Limits\nStops and limits are crucial risk management tools and\
    \ there are several to choose from\n\n*   Normal stops will close out your position\
    \ at a set level, but they could be liable to slippage if the underlying market\
    \ price changes quickly.\n*   Trailing stops follow favorable market movements\
    \ to lock in profits, while capping your downside risk. However, they too can\
    \ be subject to slippage.\n*   Guaranteed stops will close out your position at\
    \ a set level regardless of any slippage. Guaranteed stops are free to set, but\
    \ you’ll be charged a fee if your guaranteed stop is triggered\n\nThese tools\
    \ are all available to select via the deal ticket on the trading platform\n\n\
    Open and Monitor your Trade\nTo open a trade, you’d buy if you thought the price\
    \ was going to rise or sell if you thought the price was going to fall. Once your\
    \ trade is open, you’ll need to monitor the market to make sure it’s moving in\
    \ your favor. Indicators available on the trading platform can help you determine\
    \ what bitcoin’s price might do next Indicators help you monitor current market\
    \ conditions like volatility\n\nOpen an Account\nClose your position when you\
    \ like to take profit or to cut losses that has reached level. Your profits will\
    \ be added to your trading account, while your losses will be deducted from account\n\
    \n# Some Alternatives to Bitcoin\n### 1. Dash\nDash is the most popular alternative\
    \ to bitcoin. It is a complete cash management platform you can store and spend\
    \ digital money to make instant transactions. Dash wallet with the following features:\n\
    *   It allows you to make private transactions.\n*   Lower fee than bitcoin and\
    \ many other wallets\n*   Instant feature allows for instant payments\n*   It\
    \ uses decentralized network with no common party to trust\n*   Advanced encryption\
    \ and security\n*   Money transfers anywhere in the world\n\n### 2. Litecoin\n\
    When Litecoin was introduced in October 2011, it was termed the silver alternative\
    \ to bitcoin, gold. Litecoin follows the same protocol as bitcoin, but the mining\
    \ is much cheaper with this coin. Other features are as follows\n*   Less costly\
    \ than bitcoin\n*   Easier and cheaper to mine\n*   It can handle high transaction\
    \ volume\n*   Built for consumer-grade GPUs (processors)\n*   More democratic\
    \ than bitcoin\n*   Secure and private encryption\n\n### 3. Safecoin\nSafecoin\
    \ is a digital token introduced by the SAFE, mainly with the aim of rewarding\
    \ users for their contribution to the network. These are some of the most notable\
    \ features of this coin\n*   There are exactly 4.3 billion Safecoins in circulation\
    \ at a time, and each coin has a unique identity.\n*   Users can exchange their\
    \ coins to buy any of SAFE network services\n*   Direct computer interaction with\
    \ no middle person involved\n*   Self-encrypting data for enhanced security\n\
    *   Built-in redundancy and data availability\n*   Opportunistic data caching\n\
    \n### 4. Peercoin\nPeercoin is another Bitcoin-based digital currency, which has\
    \ its own method for verification of mined coins. In addition to proof-of-work\
    \ (POW), Peercoin also implements a proof-of-stake (POS) system. Other features\
    \ are given below.\n*   It is an inflationary currency with no fixed upper coin\
    \ limit.\n*   First-ever proof-of-stake coin\n*   No instant mining or insider\
    \ pre-sale to ensure a fair distribution\n*   Mining allowed on any device compatible\
    \ with bitcoin\n*   Stable and secure digital currency\n\n### 5. Steem\nSteem,\
    \ inspired by the word esteem, is a reward-based social media currency system.\
    \ This blockchain-based cryptocurrency system requires users to reward others\
    \ for their contributions.\n"
  trans: "\n\n“HODL”比特币策略涉及买入并持有比特币。它的名称源于一个加密货币论坛上对“hold”（持有）的误写，现在通常被解释为“死死持有”（hold\
    \ on for dear life）。然而，这个词不应该太严肃——只有当你对比特币的长期价格持有乐观态度时，才应该买入并持有。如果你的研究或交易计划表明你应该卖出仓位以获利或止损，你应该这样做——或者你可以设置止损来自动平仓。\n\
    \n# 比特币交易：HODL 策略\n\n 选择你希望接触比特币的方式\n你有几种不同的方式可以接触比特币：\n\n*   交易比特币衍生品\n*   通过交易所购买比特币\n\
    *   加密货币 10 指数\n*   通过 IG 交易比特币衍生品 通过交易所购买比特币\n*   获取 1 个比特币的成本 零售客户保证金为币种总价值的\
    \ 50% 币种的全额\n*   空卖 是否 – 除非有意愿的交易对手\n*   监管 IG Group 是一家 FTSE 250 公司，IG 国际获得百慕大货币局许可\
    \ 无专门的监管机构\n*   执行 0.0014 秒的执行速度并评估我们独特的流动性 取决于交易所的流动性水平\n*   资金和提取限制 无，提取或添加资金是免费且实时的\
    \ 你可能会被收费并在添加或提取资金时遇到限制\n*   隔夜资金费用 是 否\n*   交易比特币衍生品\n*   与我们交易比特币衍生品意味着你并不是直接拥有比特币，而是通过\
    \ `CFDs` 对其价格进行投机。因此，你可以通过“做多”看涨价格上涨或通过“做空”看跌价格下跌。\n\n以下是与我们交易比特币衍生品的其他好处\n* \
    \  杠杆和保证金：`CFDs` 总是通过杠杆交易，这意味着你只需要支付被称为保证金的存款——即可获得全面的市场敞口\n*   深度流动性：得益于我们的客户群，我们的市场具有深度，这意味着即使你进行大额交易，你的订单也可能以你的价格成交\n\
    *   对冲：使用衍生品进行做空可以有效地对冲你的投资组合并防止市场下跌的影响。\n\n# CFD 的主要优势\n*   客户可访问\n*   基于比特币交易\n\
    *   无佣金\n*   平台 Web、交易应用程序和 `MT4`\n*   通过交易所购买比特币\n*   通过交易所购买比特币主要适用于那些使用买入持有策略的人。这意味着你正在获得比特币的所有权，并预期它会上涨\n\
    \n# 交易所购买比特币的问题\n比特币交易所往往缺乏监管以及支持市场所需的设施\n交易所上的市价单通常不可靠，可能导致滑点或准确性降低\n比特币交易所通常对账户提现收取费用并限制，而账户可能需要几天时间\n\
    \n加密货币 10 指数\n除了交易比特币衍生品或从交易所购买币币，你还可以交易 `Crypto 10 Index`，它可以让你在单笔交易中接触比特币等 10\
    \ 种主流加密货币。该指数指定了这些加密货币，并密切跟踪或镜像它们的底层市场价格\n\n决定做多还是做空\n交易金融衍生品使得做多或做空成为可能，取决于当前的市场情绪。做多意味着你预期比特币价格将上涨，做空意味着你预期价格将下跌\n\
    \n设置你的止损和限价\n止损和限价是至关重要的风险管理工具，有多种工具可以选择\n\n*   普通止损会在设定水平平掉你的仓位，但如果底层市场价格变化迅速，它们可能会受到滑点影响。\n\
    *   移动止损随从有利的市场波动以锁定利润，同时限制你的下行风险。然而，它们也可能受到滑点影响。\n*   保证止损无论任何滑点，都会在设定水平平掉你的仓位。设置保证止损是免费的，但如果你的保证止损被触发，你将被收取费用。\n\
    \n这些工具都可以通过交易平台上的交易单进行选择\n\n开启并监控你的交易\n要开启交易，如果你认为价格将上涨，则买入；如果你认为价格将下跌，则卖出。一旦交易开启，你就需要监控市场以确保它朝着对你有利的方向移动。平台上的可用指标可以帮助你判断比特币价格可能的走向。指标可以帮助你监控波动性等当前市场状况\n\
    \n开账户\n当你想要获利或亏损达到设定水平时平掉仓位。你的利润将加入你的交易账户，而亏损将从账户中扣除\n\n# 比特币的一些替代方案\n### 1. Dash\n\
    Dash 是最流行的比特币替代方案。它是一个完整的现金管理平台，你可以在其中存储和花费数字货币进行即时交易。Dash 钱包具有以下功能：\n*   它允许你进行私有交易\n\
    *   费用比比特币及许多其他钱包低\n*   即时功能允许即时支付\n*   它使用去中心化网络，没有共同的信任赖\n*   高级加密和安全防护\n* \
    \  全球范围内的资金转账\n\n### 2. Litecoin (莱币)\n当 Litecoin 在 2011 年 10 月推出时，它被称为比特币（黄金）的银色替代方案。Litecoin\
    \ 与比特币遵循相同的协议，但这种币的矿成本要低得多。其他特征如下\n*   比比特币更便宜\n*   挖掘更容易、更便宜\n*   它可以处理高额交易量\n\
    *   为消费级 GPU（处理器）构建\n*   比比特币更民主化\n*   安全且私密的加密\n\n### 3. Safecoin\nSafecoin 是由\
    \ SAFE 引入的数字代币，主要旨在奖励用户对网络的贡献。以下是该币的一些显著特征：\n*   流通中一次恰好有 43 亿个 Safecoin，每种币都有独特的身份。\n\
    *   用户可以交换他们的币来购买 SAFE 网络的任何服务\n*   直接与计算机交互，不涉及中间人\n*   自加密数据以增强安全性\n*   内置冗余和数据可用性\n\
    *   机会性数据缓存\n\n### 4. Peercoin (同业币)\nPeercoin 是另一种基于比特币的数字货币，它有自己的验证挖掘代币的方法。除了工作量证明\
    \ (POW) 之外，Peercoin 还实现了权益证明 (POS) 系统。其他特征如下所示。\n*   它是一种通胀性货币，没有固定的代币上限。\n* \
    \  史上第一个权益证明币\n*   没有即时挖掘或内部预售，以确保公平分配\n*   可以在任何兼容比特币的设备上挖掘\n*   稳定且安全的数字货币\n\
    \n### 5. Steem\nSteem 的灵感源自“esteem”（尊严），是一种基于奖励的社交媒体货币系统。这种基于区块链的加密货币系统要求用户奖励他人的贡献。\n\
    \n"
