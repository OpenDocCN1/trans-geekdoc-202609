    # 引言


    尽管区块链是一项新技术，但它已经拥有丰富且有趣的历史。以下是区块链发展过程中一些重要且著名事件的简要时间线。


    ### 2008

    中本聪（Satoshi Nakamoto，个人或团体匿名）发布了《比特币：一种点对点的电子现金系统》。


    ### 2009

    计算机科学家 Hal Finn 与神秘的中本聪之间完成了首笔成功的比特币（BTC）交易。


    ### 2010

    位于佛罗里达州的程序员 Laslo Hance 完成了史上首次使用比特币的购买——两个爸爸约翰王的披萨。Hance 转账了 10,000 BTC，在当时价值约
    60 美元。今天它价值 8000 万美元。比特币市值正式超过了 100 万美元。


    ### 2011

    1 BTC = 1 美元，使这种加密货币与美元平价。

    电子前疆基金会、维基解等组织开始接受比特币作为捐赠。


    ### 2012

    区块链和加密货币在《好妻子》等热门电视节目中提到，将区块链引入了流行文化。

    由早期比特币开发者 Vitalik Buterin 创办的《比特币杂志》（Bitcoin Magazine）上线。


    ### 2013

    BTC 市值突破 10 亿美元。比特币达到 100 美元/BTC。

    Buterin 发布了《以太坊项目》，暗示区块链除了比特币还有其他可能性（例如智能合约）。


    ### 2014

    游戏行业巨头拉斯维加斯酒店等开始接受比特币。

    Buterin 的以太坊项目通过代币发行（ICO）筹到了超过 1800 万美元的 BTC，为区块链开辟了新途径。由 200 多家公司组成的 R3 成立，旨在探索区块链的实现。PayPal
    宣布整合。


    ### 2015

    接受 BTC 的商家数量超过 10 万。

    纳斯达克和西班牙公司 Chain 团队测试了交易私人股份的技术。


    ### 2016

    科技巨头 IBM 宣布了基于云解决方案的区块链策略。日本的增长使区块链变得合法化。


    ### 2017

    比特币首次达到 1,000 美元。加密货币市场规模达到 500 亿美元。

    摩根大通首席执行官 Jamie Dimon 表示他相信区块链是未来，为账本提供了一种离开华尔街的方式。比特币达到历史高 19,783.21 美元。

    迪拜宣布其由政府支持。


    ### 2018

    Facebook 承诺启动区块链，并暗示可能创建自己的加密货币。

    IBM 与银行合作开发开发了基于区块链的平台。


    # 什么是区块链？


    区块链被称为分布式账本技术（DLT），通过去中心化和哈希技术使数字资产的历史不可篡改。可以把它想象成一个 Google 文档。当我们创建一个文档并与小组共享时，文档是分发的而不是复制的。这创建了一个去中心化的链，让每个人都能访问该文档。没有人可以删除内容，所有的更改都会实时记录。当然，区块链比
    Google 文档复杂，但它是一项极具前景的革命性技术，因为它有助于欺诈并带来透明性。


    # 区块是如何工作的？


    使用区块链的主要目的是让人们（特别是互不信任的人）以安全、防篡的方式共享数据。区块链由核心概念组成：区块、节点和矿工。


    ### 区块

    每个链由多个区块组成，每个区块包含三个基本元素：

    *   区块中的数据

    *   一个被称为 `nonce` 的 32 位数字。`nonce` 在创建区块时随机生成，然后生成区块头哈希。

    *   `hash` 是一个添加到 `nonce` 之上的 256 位数字。它必须以大量的零开头（即非常小）。


    当链的第一个区块被创建时，`nonce` 生成了加密哈希。区块中的数据被视为已签名并与 `nonce` 和哈希永久绑定，除非它被挖矿。


    ### 矿工

    矿工通过挖矿的过程在链上创建新区块。在区块链中，每个区块都有独特的 `nonce` 和 `hash`，但引引用链中上一个区块的 `hash`，因此挖掘区块并不容易，特别是在大型链上。矿工使用特殊软件来解决极其复杂的数学问题，寻找能够生成被接受哈希的
    `nonce`。由于 `nonce` 只有 32 位，而 `hash` 有 256 位，在找到正确的组合之前，大约有四十亿种可能的 `nonce`-hash
    组合需要挖掘。当这种情况发生时，矿工被认为找到了“黄金 nonce”，他们的区块会被添加到链中。


    ### 节点

    区块链技术最重要的概念之一是去中心化。没有一个计算机或组织可以拥有这条链。相反，它是通过连接到链的节点实现的分布式账本。节点可以是任何维护区块链副本并保持网络运行的电子设备。


