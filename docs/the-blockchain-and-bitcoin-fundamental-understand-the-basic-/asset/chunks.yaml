    Decentralized finance—often called DeFi or open finance—refers to the economic
    paradigm enabled by decentralized你去, particularly blockchain networks. DeFi represents
    a shift from a centralized and closed financial system to a universally accessible
    economy that is based on open protocols that are interoperable, programmable,
    and composable.


    ### Deposit

    Digital property put into a contract involving a different party such that if
    certain conditions are not satisfied property is automatically forfeited to the
    identified counterparty.


    ### Digital Asset

    A digital commodity that is sparse, electronically transferable, and intangible
    with a market value.


    ### Digital Identity

    An online or networked identity adopted by an individual, organization, or electronic
    device.


    ### Digital Signature

    A code generated by public key encryption and attached to an electronically transmitted
    document in order to verify the contents of the document


    ### Distributed Denial of Service (DoS) Attack

    A type of super-attack in which the perpetrator continuously overwhelms the system
    with requests in order to prevent service of legitimate requests.


    ### Distributed Ledger

    A type of database which spreads across multiple sites, countries, or institutions.
    Records are stored sequentially in a continuous ledger. Distributed ledger data
    can be either “permissioned” or “unpermissioned” to control who can view it.


    ### Difficulty

    The concert outlining how hard it is to verify blocks in a blockchain network
    during Proof of Work mining. In the Bitcoin network, the difficulty of mining
    adjusts blocks every 2016 blocks. This is to keep block verification time at ten
    minutes.


    ### Double Spend

    The event during which someone in the Bitcoin network tries to send a specific
    bitcoin transaction to two different recipients at once. However, each bitcoin
    transaction is confirmed it becomes almost impossible to double spend it. The
    more confirmations that a particular transaction has, the decreased likelihood
    of double spending the bitcoin from the transaction


    ### Enterprise Ethereum Alliance (EEA)

    A group of Ethereum core developers, startups, and large companies working together
    to commercialize and use Ethereum for different businesses applications.


    ### EIP (Ethereum Improvement Proposals)

    Ethereum Improvement Proposals (EIPs) describe standards for the Ethereum platform,
    including core protocol specifications, client APIs, and contract standards.


    ### Encryption

    A process used to combine a document (plaintext) with a shorter string of data
    referred to as “a key” in order to produce an output (ciphertext). This output
    can be “decrypted” back into the original plaintext by someone else who has the
    key.


    ### ERC20 Token Standard

    ERC is the abbreviation for Ethereum and followed by the number. ERC20 is a standard
    for smart contracts on Ethereum tokens. This list of rules defines what a token
    must fulfill within the Ethereum network


    ### ERC721 Token Standard

    A non-fungible token standard. This token standard is used to represent assets
    that is not interchangeable


    ### Ether (ETH)

    Ether is the native currency of Ethereum blockchain. Also referred to as ETH—functions
    as fuel of Ethereum by acting as a medium of exchange for transactions


    ### Ethereum

    A public blockchain and decentralized platform upon which developers build and
    run applications


    ### EVM (Ethereum Virtual Machine)

    The Ethereum Virtual Machine (EVM) is complete and allows any code to execute.
    All Ethereum nodes run on the EVM. The project is designed to prevent denial-of-service
    attacks. It is home for smart contracts based on Ethereum


    ### Exchange

    A place to trade cryptocurrency. Centralized exchanges, operated by companies
    like Coinbase and Gemini, function as intermediaries, while decentralized exchanges
    do not have a central authority


    ### Fiat Currency

    Government-issued currency. For example: US Dollars (USD), Euros (EUR), Yuan (CNY),
    and Yen (JPY)


    ### Fork

    A fork creates an alternative version of a blockchain, and are often enacted to
    apply upgrades to a network. Soft Forks render two chains with some compatibility,
    while Hard Forks create a new version of the chain that must be adopted to continue.
    In the instance of a contentious Hard Fork, this can create two versions of a
    blockchain network


    ### Gas

    A measure of the computational effort required for a transaction on the Ethereum
    network that then equates to a fee for network users paid in small units of ETH
    specified as Wei


    ### Genesis Block

    The initial block of data computed in the history of a blockchain network


    ### Wei

    A minuscule and common denomination of ETH, and the unit in which gas prices are
    often specified


    ### Hash

    A function that takes an input and then outputs an alphanumeric string known as
    “hash” or “digest.” Each block in the blockchain contains the hash that followed
    the transaction before. Hash confirmations on the blockchain


    ### Halving

    Cryptocurrencies like Bitcoin have a finite supply, which makes them a commodity.
    The total amount of Bitcoin that will ever be issued is limited. The number of
    bitcoins reduced 50% every four years. This is called halving


    Hard Fork occurs when there is a change in the blockchain that is not backward
    compatible (not with old versions), forcing all participants to upgrade to the
    new version in order to participate on the network


    ### Hardware Wallet

    A physical device—like the Ledger Wallet—that can be connected to the web and
    also be used as cold storage (not connected to internet)


    ### Hot Wallet / Cold Storage

    A wallet that is directly connected to the internet at times, for example one
    that is held on centralized exchange. Hot wallets are considered to have lower
    security than cold storage systems or hardware wallets


    Hybrid Consensus Model: PoS / PoW

    A hybrid consensus model that utilizes a combination of Proof of Stake (PoS) and
    Proof of Work (PoW). Using this Hybrid consensus mechanism, blocks are validated
    from not only miners, but also voters (stakeholders) to form a balanced network
    governance


    Immutability

    The inability to be altered or changed over time. A key element of blockchain
    networks, once written onto a blockchain ledger, data cannot be altered. This
    immutability provides the basis for commerce and trade to take place on blockchain
    networks


    Initial Coin Offering (ICO)

    An Initial Coin Offering occurs when a new cryptocurrency sells advanced tokens
    in exchange for upfront capital


    ### InterPlanetary File System (IPFS)

    A decentralized file storage and referencing system for the Ethereum blockchain.
    IPFS is an open source protocol that enables storing and sharing media (text,
    audio, visual) in a distributed manner without relying on a single point of failure.
    This distributed file system enables applications to run faster, safer and more
    transparently


    ### Know Your Customer (KYC)

    A process in which a business must verify the identity and background information
    (address, financials, etc) of their customers. For example, current regulations
    and laws require banks and other financial institutions to keep and report customers
    personal information and transactions

