    # Introduction


    Although blockchain is a new technology, it already boasts a rich and interesting
    history. The following is a brief timeline of some of the most important and notable
    events in the development of blockchain.


    ### 2008

    Satoshi Nakamoto, a pseudonym for a person or group, publishes “Bitcoin: A Peer
    to Peer Electronic Cash System."


    ### 2009

    The first successful Bitcoin (BTC) transaction occurs between computer scientist
    Hal Finn and the mysterious Satoshi Nakamoto.


    ### 2010

    Florida-based programmer Laslo Hance completes the first ever purchase using Bitcoin
    — two Papa John’s pizzas. Hance transferred 10,000 BTCs, worth about $60 at the
    time. Today it''s worth $80 million. The market cap of Bitcoin officially exceeded
    $1 million.


    ### 2011

    1 BTC = $1USD, giving the cryptocurrency parity with the US dollar.

    Electronic Frontier Foundation, Wikileaks and other organizations start asserting
    Bitcoin as donations.


    ### 2012

    Blockchain and cryptocurrency are mentioned in popular television shows like The
    Good Wife, injecting blockchain into pop culture.

    Bitcoin Magazine launched by early Bitcoin developer Vitalik Buterin.


    ### 2013

    BTC market cap surpassed $1 billion. Bitcoin reached $100/BTC.

    Buterin publishes “Ethereum project" suggesting blockchain has other possibilities
    besides Bitcoin (e.g., smart contracts).


    ### 2014

    Gaming industry giant The Las Vegas Hotel and others start accepting Bitcoin.

    Buterin’s Ethereum project is funded via Initial Coin Offering (ICO) raising over
    $18 million in BTC and opening new avenues for blockchain. R3, a group of over
    200 firms, is formed to discover ways blockchain can be implemented. PayPal announces
    integration.


    ### 2015

    Number of merchants accepting BTC exceeds 100,000.

    NASDAQ and Spanish company Chain team test the technology for trading private
    shares.


    ### 2016

    Tech giant IBM announces a blockchain strategy for cloud-based solutions. Growth
    of Japan legitimizes blockchain.


    ### 2017

    Bitcoin reaches $1,000 for first time. Cryptocurrency market reaches $50 billion.

    JP Morgan CEO Jamie Dimon says he believes in blockchain as future, giving the
    ledger a way off from Wall Street. Bitcoin reaches all-time high at $19,783.21.


    Dubai announces its government-powered.


    ### 2018

    Facebook commits to starting a blockchain and hints at the possibility of creating
    its own cryptocurrency.

    IBM develops a blockchain-based platform with banks.


    # What is Blockchain?


    Blockchain, referred to as Distributed Ledger Technology (DLT), makes the history
    of an digital asset unalterable through the use of decentralization and hashing.
    Think of it like a Google Doc. When we create a document and share it with a group,
    the document is distributed instead of copied. This creates a decentralized chain
    that gives everyone access to the document at the same. No one can delete changes
    from it, all edits being recorded in real-time, making changes complete. Of course,
    blockchain is more complex than a Google Doc, but it is especially promising and
    revolutionary technology because it helps reduce fraud and brings transparency
    in scalable uses.


    # How Does Blockchain Work?


    The whole point of using a blockchain is to let people — in particular people
    who don''t trust one another — share data in a secure, tamperproof way. Blockchain
    consists of important concepts: blocks, nodes and miners.


    ### Blocks

    Every chain consists of multiple blocks and each block has three basic elements:

    *   The data in the block

    *   A 32-bit number called a `nonce`. The `nonce` is randomly generated when a
    block is created, which then generates a block header hash. The `hash` is a 256-bit
    number added to the `nonce`. It must start with a huge number of zeroes (i.e.,
    be extremely small).


    When the first block of a chain is created, a `nonce` generates the cryptographic
    hash. The data in the block is considered signed and forever tied to the `nonce`
    and hash unless it is mined.


    ### Miners

    Miners create new blocks on the chain through a process called mining. In a blockchain
    every block has its own unique `nonce` and `hash`, but also references the `hash`
    of the previous block in the chain, so mining a block isn''t easy, especially
    on large chains. Miners use special software to solve the incredibly complex math
    problem of finding a `nonce` that generates an accepted hash. Because the `nonce`
    is only 32 bits and the `hash` is 256, there are roughly four billion possible
    `nonce`-hash combinations that must be mined before the right one is found. When
    that happens, miners are said to have found the "golden nonce" and their block
    is added to the chain.


    ### Nodes

    One of the most important concepts in blockchain technology is decentralization.
    No one computer or organization can own the chain. Instead, it is a distributed
    ledger via the nodes connected to the chain. Nodes can be any kind of electronic
    device that maintains copies of the blockchain and keeps the network functioning.

