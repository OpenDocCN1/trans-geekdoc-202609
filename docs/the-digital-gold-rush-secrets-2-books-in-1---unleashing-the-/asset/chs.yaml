  \ 的图片，即著名的电视角色 `Homer Pepe` 的。\n\n`Decentralized`：`Rare pipes` 是在名为 `counterparty`\
  \ 的平台上提供的首批 NFT。`Pepes` 是经过各种方式编辑的绿色青蛙图像。不同种类的 `Pepe` 图像已被转换为 NFT 并卖给最高出价者。`pipes`\
  \ 中“最稀有”的是一幅 `Homer Pepe` 的图片，即著名的电视角色 `Homer Pepe` 的。\n\n\n\n\n\n### 成本\nNFT 和加密货币的成本或价格差异巨大。当我们谈到加密货币时，最流行且昂贵的加密货币是\
  \ `Bitcoin`。在 2021 年的牛市期间，`Bitcoin` 的价格达到了略高于 `64,000` 美元的顶点。与人们为某些 NFT 支付的价格相比，这完全微不足道。人们经常为\
  \ NFT 支付超过百万美元，最贵的 NFT 在 2021 年 3 月的一次拍卖中获得了约 6900 万美元。\n\n### 可分性\nNFT 和加密货币的另一个区别是它们被拆分成更小部分的能力。加密货币可以拆分成碎片，碎片进一步拆分成部分。这对于\
  \ `Bitcoin` 这样昂贵的加密货币至关重要，以便人们以较小的数量购买。NFT 总是以整体的形式存在，就像艺术品一样。它们无法拆分、交易、收藏和重新组合。\n\
  \n### 使用的区块链\n两者使用的区块链也不同。对于加密货币，几乎每种加密货币都运行在自己的区块链上，该区块链存储相应货币的交易。例如，`Ether` 的交易记录在\
  \ `Ethereum` 上。而 NFT 通常更多运行在 `ether` 区块链上，某些也运行在 `Binance bright chain` 上。这是 NFT\
  \ 最常用的两种区块链。\n\n### 购买平台\n两者交易的平台也不同。同时，加密货币在加密货币交易所交易，如 `Binance` 和 `Coinbase`。这些加密货币交易所本质上可以是中心化的也可以是去中心化的。NFT\
  \ 在 `Open Sea` 和 `Nifty Gateway` 等 NFT 平台上买卖。同时，NFT 也通过苏富比（Sotheby’s）和佳士士得（Christie’s）等拍卖行出售。\n\
  \n### 接受的货币\n购买两者时支付的货币也不同。当我们谈到加密货币时，可以使用法定货币或其他加密货币支付，取决于所在的加密交易所。因此我们看到加密货币可以很容易转换为现实货币。另一方面，购买\
  \ NFT 必须用加密货币支付。如果 NFT 是基于 `Ethereum` 区块链，则用 `Ethers`(`ETH`) 支付；如果它在 `Binance Smart\
  \ Chain` 上，则用 `Binance coins`(`BNB`) 支付。\n\n### 时间线\n两者出现的时间线也非常不同。加密货币最早创建于 2008\
  \ 年，第一个是 `Bitcoin`。加密货币在 2010 年代中后期进入主流，在 2017 年经历了第一个牛市，并在 2021 年初经历了第二个牛市。另一方面，第一个\
  \ NFT 引入于 2016 年，它由于 `crypto kitties` 和 `punks` 变得小有名气，但直到 2021 年 NFT 市场最终膨胀时才进入主流。\n\
  \n# NFT 的工作原理\n\n创建一个 NFT 相对容易；各种平台允许人们制作 NFT。要制作非同质化标记，需要两样：将转换为非同质化许可的数字艺术或资产，以及铸造的费用。最近，许多内容已转换为非同质化标记，包括数字艺术、歌曲、视频甚至推文；任何具有数字形式或签名的内容都可以转换为\
  \ NFT。一旦创建，所有者可以在钱包中查看 NFT，就像查看加密货币一样。这些 NFT 同样存在于区块链地址上，持有密钥的人可以访问。\n\n在 NFT 的铸造过程中，NFT\
  \ 的所有者或创建执行符合不同 NFT 标准的代码。NFT 使用的标准和协议如下：\n\n- **ERC - 721**: `ERC - 721` 是 2017\
  \ 年开发的用于创建 NFT 的原始标准。它使用 `Ethereum` 区块链上的 `Solidity` 编写。该标准使得铸造新 NFT 更简单、快速且唯一。`ERC-721`\
  \ 是最常用的标准；任何人都可以创建自己的 NFT。\n- **ERC - 1155**: `ERC - 1155` 是 `Ethereum` 区块链上的另一个标准。它在\
  \ `ERC-721` 之后开发，被认为是对前者的升级。它通过执行智能合约的方式来创建新的非同质化标记。`ERC - 1155` 相比 `ERC - 721`\
  \ 的显著优势之一可以在单个智能合约上创建多个 NFT。在 `ERC-721` 上，每次创建新 NFT 都必须运行智能合约。`ERC-1155` 更高效且占用的空间更少，但也更多样，因为它可以制作同质化标记和非同质化收据。\n\
  - **Hedera Token Service**: 这是 `Hedera` 提供的非以 系的标准。这比 Ethereum 标准便宜得多而且速度更快。`Infinite\
  \ by by SUKU` 是一家从 `Ethereum` 转移到 `Hedera` 的公司。\n\n目前，我们看到 NFT 是私有的且拥有单一所有者。计划在不久后引入碎片化\
  \ NFT 标准，允许多个用户拥有单个 NFT 的部分。这符合泛泛区块链的去中心化和多节点特性。\n\n## NFT 的用例\n\n### 游戏\n非同质化标记（主要是在线游戏）在游戏领域被广泛使用。最早的一些\
  \ NFT（如 `CryptoKitties`） 仅仅是建立在区块链上的游戏。NFT 在游戏中有两种宽泛的使用方式：一种是 NFT 的收集和存储本身就是一种游戏，人们试图获取\
  \ NFT，在游戏中将其转换为游戏内的其他东西，然后尝试赢得奖励，如 `crypto kitties` 或炼金术玩具（alchemy toys）所示。相反，NFT\
  \ 也可能作为其他游戏的插件。这些可以是装饰性的（`skins`、`avatars` 等）和功能性的（`weapons`、`pets` 等）。\n\n在大型多人在线角色游戏中，人们可以使用\
  \ NFT 拥有某些游戏内物品，赋予他们使用这些物品的独家权利。游戏行业是世界上增长最快的行业之一。随着移动游戏的增加和此前未开发地区互联网普及率的提高，它预计在未来几年将进一步扩张。到\
  \ 2023 年，游戏行业将价值 3000 亿美元。这为 NFT 提供了巨大的市场基础和增长潜力。\n\n### 数字资产\n数字资产市场也是这些代币最关键的用例之一。可以购买仅存在于数字世界的资产。`Decentraland`\
  \ 是购买 NFT 数字资产最常见的名称之一。`Decentraland` 是一个拥有一定数量且稀缺土地的虚拟世界。潜在买家可以从他人甚至开发人员那里购买这些土地。土地的价格就像现实世界一样，取决于该\
  \ `plot` 的位置。某些黄金地段的数字房地产正以数千美元出售。公司计划在这些空间建立数字商店。`Cryptovoxel` 是另一个人们可以买卖数字资产的项目。\n\
  \n### 艺术\n目前，艺术是 NFT 使用最广泛的领域。由于缺乏稀缺性，数字艺术多年深受容易复制的问题困扰，在数字艺术转换为 NFT 后，情况完全改变了。当艺术与\
  \ NFT 结合时，作品所有者更容易验证其所有权。这为数字艺术创造了有限供应，导致其价值飙升。在过去的几年里，我们看到一些数字绘画以惊人的价格出售，例如《every\
  \ day: The First 500 Days》，其售价为 6900 万美元。\n\n\n\n\n然而，这不仅仅是像 `Beeple` 这样著名的艺术家。然而，这不仅仅是像\
