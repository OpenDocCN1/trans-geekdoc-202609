  \n# 第一章：加密货币革命\n\n## 了解加密货币的基础\n\n电子虚拟货币起源于首个可扩展加密货币 `Bitcoin` 诞生很久以前。然而，这些货币并没有被称为加密货币，因为它们没有嵌入加密技术。但这些尝试最终导致了目前使用的加密货币的发明。\n\
  \n数字货币革命始于 20 世纪 80 年代的荷兰。一组开发者发明了一种电子卡系统，以避免晚上加油站发生的盗窃。任何想要获取燃料的人都可以使用这些卡，从而消除了真实货币的使用。\n\
  \n虚拟货币的第二次尝试由 `David Chaum` 完成。他是一位美国密码学家，`Blinded Cash` 的发明者。这种货币的独特卖点是它是不可追踪的。也就是说，使用这种虚拟货币进行的交易无法被追踪。`Chaum`\
  \ 使用复杂的加密技术实现了这一目标。然而，这种加密货币由于各种可扩展性问题而失败了。\n\n我们必须知道 `eCash`、`B-Money`、`Bit Gold`\
  \ 和 `Hashcash` 是该领域著名的失败尝试。`eCash` 是第一个概念化的个人间传输数字令牌货币。`B-Money` 被描述为一种既匿名又安全的电子现金系统。`Bit\
  \ Gold` 被认为是第一个具有完全去中心化功能的数字资产。`Bit Gold` 在去中心化的同时，锚定了黄金价值。\n\n\n\n\n加密货币仍处于初始阶段，其市场波动非常大。由于银行或任何第三方不对其进行监管，它们通常没有保险，且难以兑换成现实货币（如美元或欧元）。此外，由于加密货币是无形的技术资产，它们可能像其他资产一样被黑客。最后，由于你将加密货币存储在数字钱包中，如果你失去了钱包，将失去所有的加密货币投资。\n\
  \n# 加密货币的属性\n\n在 2008 年金融危机期间，一个名为中本聪（Satoshi Nakamoto）的匿名个人或团体发布了一篇名为《比特币：点对点电子现金系统》的白皮书。当时，很少有人意识到这一货币领域改变规则的突破。\n\
  \n由于加密技术和区块链的发展，加密货币已成为一种替代交易手段。自 2009 年诞生以来，比特币在全球范围内日益流行。由于其独特的特性，它引起了大量的关注。\n\
  \n要正确理解加密货币革命，理解加密货币和区块链的基本特征至关重要，这些特征构成了其革命性和改变规则的地位。虽然现代世界有许多加密货币，每种都有其独特特征，但加密货币的核心具有三个基本特质。\n\
  \n# 去信任化 (Trustless)\n\n比特币是去信任的，因为它被设计为不需要任何人信任其他人来运行。在比特币出现之前，每种形式的货币都需要你授权中央权威才能使用。在这些实例中，首要权威成为主要的弱点，最终导致货币的衰落。通过比特币，每个生态系统组件都验证其他成员所说的内容，而不依赖任何人。当一笔比特币交易广播时，所有节点都会接收它并验证签名是否真实。如果签名无效，交易将被丢弃。\n\
  \n由于网络上的每个人都有一份账本副本，我们不再需要依赖单一实体、组织或第三方，因为当你可以使用自己的副本对该账本进行检查时，就不需要建立信任。区块链是去中心化的账本，而个人网络参与者通过`proof-of-work\
  \ (PoW)`共识机制获得奖励是当代经济学中最具革命性的概念之一。\n\n激励机制可能帮助节点维护其完整性。如果一个贪婪的攻击者建立的 CPU 工作证明者比所有诚实节点加起来多，他必须在通过收回人们的钱来欺骗他们与生成新货币之间做出选择。\n\
  \n他应该会认为遵循规则更有利，因为规则将给予他比所有人加起来还多的新币，而不是破坏系统和他财富的合法性。虽然我们仍在探索如何以及为何使用加密货币，但它们将一直存在下去。除了加密货币和区块链技术的其他优势外，单是解决中心化信任问题就是一项重大突破，将确保加密货币的长期生命力。\n\
  \n# 不可篡改性 (Unchangeable/Immutable)\n\n在最简单的含义上，“不可篡改”意味着“无法撤销”。不可篡改性应基于关于区块链和加密货币的三个概念：重写历史极不可能或非常困难。除了`private\
  \ key`的所有者之外，任何人都无法转移资金。区块链记录所有交易以确保上述两个原则。\n\n我们查询银行的交易历史来查看我们的钱是如何从银行账户花费的。我们委托银行承担不伪造交易或操纵我们资金的责任，就像我们委托他们将交易交付给接收者的责任一样。如果发生了欺诈交易，必须信任银行能够撤销这些交易。\n\
  \n如前所示，加密货币需要更多的中心化；我们不再有可以寄予信任的第三方。因此，交易记录是公开可见且不可逆的。虽然更改交易账本并非不可能，但加密安全使其变得非常困难。\n\
  \n# 分布式 (Distributed)\n\n由于“去中心化”是加密世界中如此热门的话题，对其进行精确描述至关重要。区块链在政治上是去中心化的（没有人控制它们），在架构上是去中心化的（没有单点故障），但在概念上是中心化的——维里克·布特林（Vitalik\
  \ Buterin）\n\n容错性：由于去中心化系统依赖于独立组件的网络，它们不太失效。\n\n抗攻击性：由于去中心化系统缺乏可以被低成本攻击的中心点，因此攻击、破坏或控制它们的成本更高。\n\
  \n抗共谋：去中心化系统的个人很难以牺牲他人为代价做出有利于自身的行为。另一方面，企业和政府不断合作，肥自己而损害他人。\n\n除了中央银行和政府外，银行通过发行和利率调节货币的供应和生产。法币用户对于货币创造取决于中央银行的意志。\n\
  \n# 稀缺性与有限供应\n\n法币具有无限供应量，因为中央银行可以随心所欲地发行和打印。银行经常作为经济战略的一部分影响其国家货币的价值。法币的通胀性质意味着货币价值随着时间的推移逐渐下降。另一方面，大多数加密货币在建立时其底层算法就预设了有限的供应。\n\
  \n然而，对于加密货币，个人或财团只有在大多数人同意的情况下才能控制或对货币供应产生重大影响。最流行的加密货币具有有限的代币或具有预定义的标准的池。像比特币、莱特币和酷币，许多流行的加密货币具有有限供应量，使其天然具有通缩性。加密货币需求或接受度的任何增加都会导致价格上涨。\n\
  \n# 加密货币如何改变我们的交易方式？\n\n为了进一步理解这一点，让我们检查加密交易过程。假设 Julia 想给 Luke 25 美元的比特币。Luke 给\
  \ Julia 他的比特币地址（公公钥）。这个比特币地址与 Luke 在比特币区块链上创建的任何比特币交易所或钱包关联。显示如下：`3GTDmd3JohJ4oDbTnvgw68gEDS3y6CS7Wx`。\n\
  \nJulia 将该地址和比特币（BTC）金额——大约`0.0009 BTC`，略低于 25 美元——输入她的加密货币交易所或钱包并点击发送。\n\n\n\n\n\
  Luke 获得的 BTC 扣除了 BTC 矿工和网络收取的交易费用。这些费用可能从每小时交付的 0.05 美元到十分分钟交付的 0.58 美元不等。无论 Julia\
  \ 发送的是 25 美元还是 25,000,000 美元，费用都是相同的。现在，让我们剖析一下幕后发生了什么。从 Julia 将交易发送到区块链的那刻，比特币网络中的每个节点都会接收到交易请求。每个节点都会验证\
  \ Julia 确实是她所称的人。节点使用私钥验证 Julia 的身份——私钥可以唯一标识发送资金的来源。谁拥有访问这笔巨大资金的权限，谁就能获得你的资金？这就是为什么保护私钥至关重要的原因。我们总是希望使用自己的钱包，而不是将硬币存在交易所，这一点稍后会讨论，但请记住：你的私钥，你的加密货币（Your\
  \ Keys, Your Crypto）。\n\n由于节点拥有整个交易账本的副本，它们可以验证 Julia 是否拥有资金。如果至少 51% 的节点同意上述提到的两个部分，交易就是有效的，节点将用新的信息更新账本。\n\
  \n如果我们将其与涉及法币的典型交易进行比较，就可以看到加密货币交易有多复杂。这些额外的层次贡献了价值，并可能解决传统金融系统中的弱点。以下是加密货币可能改变我们业务方式的几种方式。\n\
  \n# 比银行更快、更便宜、更安全的交易\n\n今天的银行系统需要更新了。国际银行转账可能需要一周时间，因为两者都需要代理银行和特定国家的结算机构。即使是跨境支付数据的交换也充满了困难和摩擦。使用比特币等数字货币可以快速且廉价地完成银行交易。\n\
  \n在涉及金钱的几乎方面，欺诈是一个重大问题。无论是资金转账还是在不安全的网站上使用信用卡，欺诈的风险都是每个人非常担心的问题。这对于曾受过欺诈的个人来说尤其如此。\n\
  \n由于加密货币不与你的银行账户或现金挂钩，并且通过记录所有交易的区块链进行电子化安全传输，加密货币将显著减少欺诈并提供安心。\n\n# 全球汇款得到助力。\n\
  \n每年，来自贫困国家的移民向家乡汇出超过 5000 亿美元的资金，超过了外国直接投资。国际转账成本平均占汇款总额的 6-10%，这对世界上一些最弱势群体的影响是巨大的。技术提供了加速和降低这些转账成本的能力。\n\
  \n私人用户甚至可以通过手机使用虚拟货币直接向亲属汇款，剩余成本来自货币兑换。虽然传统的……（此处省略中间内容，以保持核心语义）……\n\n# 安全资金\n\n\
  由于加密货币不与你的银行账户或现金挂钩并且……（此处省略中间内容，以保持核心语义）……\n\n# 释放电子商务的潜力\n\n……（此处省略中间内容，以保持核心语义）……\n\
  \n# 可以用智能合约编程的货币\n\n一旦创建了数字资产，它就可以自动传输。这为实施“可编程货币”和“智能合约”打开了大门。托管账户就是一个现实的例子。这些账户已经用于大宗交易，例如购买房产。买家将资金存入托管账户，只有当卖家将物业所有权转给买家时，资金才会释放给卖家。在数字时代，当信任可能成为人与之间交易的重大障碍时，这种方法甚至可以用于更小的金额。\n\
  \n另一个例子是多签名（multi-sig），它需要几个人验证身份后才能从账户中提款。这可以用于防止数字货币被盗。尽管如此，它还可以确保资金在跨越业务部门之间，或在慈善团体与贫困国家的承包商之间传输时，不会“丢失”或被盗。\n\
  \n此外，可编程货币可能用于更复杂的合同，例如涉及许多参与方的金融交易和复杂的衍生品。你可能会将一些资金投入一项财务协议中，该协议根据特定股票价值的表现进行支付。计算机程序可能会连接到彭博终端馈送，然后根据某些股票或股票组合的表现，不同的人可能会获得资金。\n\
  \n\n\n加密货币可以取代中心化金融体系吗？在讨论这一问题之前，我们必须考虑中心化金融体系是如何形成的。这将使我们能够评估中央金融机构的功能，并确定加密货币最终是否可能取代它们。\n\
  \n# 央银行：其历史\n\n1844 年，英国通过《银行特许法》（`Bank Charter Act`）开发了中央银行制度，这项立法倡议为建立拥有货币发行专有权的组织奠定了基础。这种理念认为，一个拥有如此权力的银行在危机时期有助于金融体系的稳定。许多专家认为，这种理念在\
  \ 2007-2008 年金融危机及随后的大衰条中起到了避免灾难的作用。\n\n随着时间的推移，央银行不断发展。例如，`Federal Reserve`（联邦储备）利用货币政策来实现充分就业和价格稳定。确保国家的银行和金融体系安全健全，并允许客户获得信贷。在危机时期，稳定金融体系。对国家的支付体系进行监管。`Federal\
  \ Reserve`和其他央银行可能会通过调整利率以及创造或销毁货币来实现这些目标。\n\n例如，如果经济似乎增长过快，商品和服务的价格变得无法负担，央银行可能会提高利率以增加借贷成本。此外，央银行可能会通过减少向其他银行贷款的货币供应来抽干经济资金。由于大多数资金存在于计算机资产负债表上，只需按下`delete`键可能会使其消失。因此，购买产品的可用货币数量减少，可能导致价格下降。\n\
  \n自然地，每种行动都有相应的反应。虽然去货币化可能导致成本降低，但它让公司借钱变得更加困难。结果，这些公司可能会变得更加谨慎，犹豫于支出，并且不愿招聘新员工。\n\
  \n如果经济需要更快速的发展，央银行可能会降低利率或创造货币。利率降低使得借贷成本更低，对企业和个人来说更容易获得且更具吸引力。同样，央银行可能会增加银行可贷款的资金。\n\
  \n此外，央银行可能尝试通过其他方式影响经济。这些措施可能包括在公开市场上购买证券（债券）以创造需求。高需求会导致利率下降，因为借款人不再需要提供更高的利率，因为央银行提供了一个意向买家。\n\
  \n央银行引导经济走向繁荣的尝试充满了危险。如果利率保持得过低，通胀可能成为一个担忧。当价格上涨、人们需要帮助来负担心仪商品时，经济可能会停滞。当利率过高时，借贷受到限制，经济会受到损害。\n\
  \n低利率（与其他国相比）鼓励投资者从一个国家提取资金并转移到另一个国家，以获得更好的回报率。考虑那些收入依赖利率上升的退休者的困境。当利率很低时，他们的购买力和支付开支的能力直接受到影响。向提供更高回报率的国家汇款是一个明智的举措。\n\
  \n利率和货币供应的操纵也直接影响国家货币的价值。高汇率使得当地企业出口产品的成本增加。这可能导致国内失业。美元贬值会提高进口产品（如石油和其他大商品）的价格。这可能会增加消费者以及依赖进口组件或材料的国内产品生产者的进口成本。弱美元有利于需要提振的增长放缓的经济，而强美元则惠及消费者。\n\
  \n由于央银行启动政策调整与该举措影响国家经济之间存在延迟，央银行总是向前看。他们的目标是现在实施政策变更，以便能够实现未来的目标。\n\n# 支持去中心化的论点\n\
  \n现在让我们来看硬币的另一面。国家和全球经济的内在复杂性为以下观点提供了弹药：这些经济太不可预测了，无法通过央银行实行的操纵进行有效控制。这一观点由奥地利经济学派的支持者提出，可能为采用像`Bitcoin`这样的点对点货币提供了合理性，因为它消除了央银行及其复杂的系统。\n\
  \n自创建以来，现代央银行一直是争议的焦点。不满意的原因非常多且多样。一方面，垄断权的构想让许多人感到非常不安；另一方面，存在一个可以影响经济的自主、不透明的组织更令人警觉。\n\
  \n许多个人（包括经济学家和政治家）认为央银行犯下的错误严重影响了公民的生活。这些错误包括：货币供应量的增加（导致通货膨胀，并通过提高商品和货物价格损害消费者）。\n\
  \n实施加息措施（损害了想要借钱的消费者）。制定维持异常低通胀率的措施（导致了失业）。异常低利率（在房地产、股票或债券中制造了资产泡沫）。\n\n沿着这一思路，甚至像前联邦储备委员会主席`Bernanke`\
  \ 这样具有权威性的人物也将将 1929 年大萧条归咎于央银行的操纵。\n\n在一个技术允许消费者在没有中央机构的情况下进行交易的时代，央银行已经过时了。对金融部门进行更全面的研究加强了这一观点。\n\
  \n大衰条和一系列丑闻是由银行业腐败引发的。银行家对希腊和其他国家造成了破坏性影响。诸如国际货币基金组织（IMF）等几个机构被指控将利润置于人民之上。在更微观的层面，银行家通过作为个人交易的中介赚取了数十亿美元。在这种气候下，许多人发现废除金融体系具有吸引力。\n\
  \n总结来说，目前央银行是国家控制经济的主要机制，看看本世纪打的每一场战争，在战争结束之前该国家都没有央银行。它们拥有垄断权，不太可能在没有斗争的情况下放弃它。虽然`Bitcoin`和其他数字货币吸引了大量的关注，但它们的采用率很低，而且几乎没有官方支持。当你意识到银行不仅仅是为了交易目的（大多数加密货币仅如此），而且当`Federal\
  \ Reserve` 并不像 `Federal Express` 那样联邦，它是由英国银行和罗斯斯柴家族为了随时为金融精英层打印货币而创建的时，你可以想象他们会竭尽全力维持这套体系以维护其利益。\n\
  \n\n\n政府及其操纵它们的傀儡正摆脱金融精英的控制，接受 `Bitcoin` 或任何其他加密货币作为法定货币；它们完全取代中央银行的可能性微乎其微。全球范围都在监控并分析\
  \ `Bitcoin`。由于制造金属硬币的成本高昂（通常超过其面值），中央银行极有可能发行自己的央行数字货币（`CBDC`）。`CBDCs` 已成为全球央行者关注的最新趋势。先进经济体联盟正在向在全球范围内引入\
  \ `CBDCs` 迈进。在最近华盛顿举行的一次会议上，日本财务副大臣神田诚（Masato Kanda）宣布，`G7` 已将探索帮助发展中国家通过适当标准实施\
  \ `CBDC`的方法列为优先事项，其中包括 `G7` 关于零售 `CBDC` 的公共政策原则。\n\n`CBDCs` 是政府应对加密货币兴起的。它们将 `Bitcoin`\
  \ 背后的创新技术与美元、欧元和人民币等法币的成熟货币政策完美无缝融合。与 `bitcoin` 等传统数字货币，甚至像 `TetherUSDT` 或 `USDC`\
  \ 这样挂钩美元的稳定币不同，`CBDCs` 让政府对每一笔经济交易拥有完全的可见性和控制权。\n\n尽情享受纽约街头可的美味，毫无顾虑。你的隐私至关重要，因为当你向街头小贩递交\
  \ 5 美元时，政府没有你的身份或购买记录。体验 `CBDCs` 的革命性差异，它是传统纸币的完全对立面。介绍 `e-CNY`，中国革命性的 `CBDC`，它为政府提供了对消费者行为的实时洞察。凭借追踪购买和位置的能力，`e-CNY`\
  \ 允许政府监管认为不适合社会的交易。需要药物，政府会知道。有耗钱的成瘾，政府会知道一切。\n\n由于能够将私营支票和储蓄账户替换为政府账户，`CBDCs` 提供了新水平的便利、安全，但没有公民自由或隐私。此外，它们让联邦储备银行拥有了无限的印钞和分配资金的能力，就像今天的纸币美元一样。`CBDCs`\
  \ 甚至允许从个人银行账户中扣除资金，使其成为政府管理经济和控制他们认为错误的人的强大工具。想想看：通过他们的 `CBDCs`，他们可以在数字空间中制定并执行自己的规则。如果你想使用你的数字货币，希望你有一个良好的社会信用并且是一个好公民。\n\
  \n而且他们为什么不这样做呢？想想看：通过他们的 `CBDCs`，他们可以在数字空间中制定并执行自己的规则。如果你想使用你的数字货币，希望你有一个良好的社会信用并且不是一个坏公民。\
  \ \n\n# 央行数字货币 (CBDCs) 的缺点\n\n发现等待着你的迷人可能性。如果你尚未察觉，这里存在一些令人担忧的缺点。通过我们的产品体验完全的可追溯性——告别匿名交易。请放心，实体现金不会立即被取缔。你正在引入\
  \ `CBDCs` —— 提高交易效率和简化跨境交易的终极解决方案。通过现有系统的创新补充，你可以体验到无与伦比的便利。现金消失的必然性是不可否认的。\n\n\
  这一发展值得注意，因为它消除了我们进行匿名交易的能力。通过 `CBDCs` 体验数字货币的未来。政府控制的私有账本技术为你提供了匿名性与透明度之间的完美平衡，同时又提供了透明度。\n\
  \n\n\n前两个加密货币里程碑相继发生。域名 `Bitcoin.org` 于 8 月 18 日注册。随后，在 10 月 31 日，比特币的发明者中本聪聪发布了一份开启进程的文件：比特币是一种基于点对点运行的去中心化电子现金系统。\n\
  \n### 2009\n1 月 12 日，中本向计算机程序员 Hal Finney 发送了十个比特币（`BTC`）。\n\n### 2010\n比特币在 8 月\
  \ 15 日遭到黑客攻击，揭示了系统中的一个关键漏洞。比特币开发者 Jeff Garzik 注意到一笔涉及 1840 亿 `BTC` 的极其异常交易，并表示：“我们在这里遇到问题了。”\n\
  \n同年晚些时候，发生了首次比特币交易，这标志着加密货币首次拥有了货币价值。一位比特币用户用一万比特币换了两个披萨。由于 10,000 个 `Bitcoin`\
  \ 的价值超过 4.47 亿美元，这将成为世界上最昂贵的披萨。\n\n### 2011\n随着 `Litecoin`、`Namecoin` 和 `Swiftcoin`\
  \ 的引入，竞争性的加密货币开始出现。与此同时，由于报道称比特币被所谓的“暗网”（即 `Silk Road`）利用，比特币遭到了种种指责。比特币价格在暴涨后再次暴跌，证明了任何负面曝光都是糟糕的公关事件。\n\
  \n### 2012\n得益于美剧《好主妻》第三季中一场名为《傻瓜学比特币》的虚构化审判式剧情，加密货币进入了大众视野。\n\n### 2013\n《福布斯》将\
  \ 2013 年称为“比特币年”。这一年，比特币吸引了许多贪婪的投资者的关注，单价达到 1,242 美元并占据了新闻头条，同时推动金价跌至盘中每盎司 1,240\
  \ 美元的低点。\n\n随着它在讨论桌、互联网论坛和研讨会上获得关注，其价值飞升。这种快速增长导致了对加密货币极具分歧的观点，一些人将其视为骗局，而另一些人则将其视为获利且具有吸引力的创业项目。事实是，这两种立场都非常有说服力。由于加密货币市场的极端波动，随后的几年里价值和观点都发生了不可预测的变化。\n\
  \n当比特币持有者无法对新的交易规则达成共识时，就会发生比特币“分叉”，区块链在物理上一分为二。两个网络同时运行六小时，拥有两个不同的交易历史版本，导致了不可避免的价值下跌。\n\
  \n同时，许多政府正试图确定加密货币监管的最佳方法。泰国禁止比特币交易，并称其为非法。德国财政部不承认比特币为官方货币，而是将其视为“记账单位”，为未来征收与比特币相关的活动框架打开了大门。中国人民银行禁止金融机构使用比特币，导致其价值再次下跌。第一台比特币\
  \ ATM 取款机在加拿大温哥华开放。\n\n### 2014\n总部位于日本的加密货币交易所 `Mt Gox` 破产清算，导致投资者损失了本金。微软允许客户使用比特币购买游戏，这成为该货币吸引力日益增加的例子。\n\
  \n### 2015\n其他加密货币开始出现，包括 `Ethereum` 和 `Coinbase`（后者在一轮融资中获得了 7,500 万美元，这是比特币公司筹集的最数字）。总部位于欧洲的比特币交易所\
  \ `Bitstamp` 在遭受黑客攻击后遭遇了安全漏洞，并在几天后重启交易，并向客户保证其资金没有丢失。\n\n### 2016\n加密货币继续受到欢迎。比特币\
  \ ATM 取款机的数量从年初的约 500 台增加到年底的略低于 900 台；阿根廷的 Uber 开始接受比特币支付，而瑞士国家铁路和软件公司 `Steam`\
  \ 也是新用户之一。\n\n`DAO`（去中心化自治组织）于 5 月建立——这是一个位于 `Ethereum` 区块链上的无国界风险投资基金，也是全球最重大的众筹倡议。用户在它发布一个月后对其进行了攻击，三分之一的资产被盗取。因此，以太坊经历了“分叉”，分为\
  \ `Ethereum` 和 `Ethereum Classic`。\n\n### 2017\n这是比特币历史上的一个转折点，这一时期永久性地改变了人们看待加密货币的方式。2017\
  \ 年，比特币是所有加密货币新人的切入点。个人们有时仅将比特币视为长期投资。他们用比特币交易山寨币，并投资首次代币发行（`ICOs`），投下数百万美元期望发财。\n\
  \n普通大众在 2017 年首次意识到加密资产。监管微乎其微；任何有钱的人都可以创建并在交易所列出代币。消费者保护无从谈起，每个人都成了评估早期基于区块链的“投资”的专家。\n\
  \n这导致了首次代币发行（`ICO`）狂热，每个人都被兴奋所误导，并在从根本上糟糕的投资中亏损。比特币在不到一年的时间内从 900 美元涨到 11,000 美元。对于加密货币来说这一年更加疯狂，因为硬币价值可能在一年内从\
  \ 1 美元增加到 100,000 美元以上。\n\n在这种兴奋之外，备受期待的“比特币现金硬分叉”发生了，将比特币分为两种衍生加密货币：`BTC` 和 `BCH`。日本颁布了法律，允许接受比特币作为支付机制。同时，挪威的\
  \ `Skandiabanken` 加入了比特币账户，并认可比特币为投资资产和支付系统。\n\n### 2018\n2018 年，我们看到了比特币历史上最严重的价格下跌之一（`BTC`）。山寨币市场在\
  \ 2017 年比特币牛市期间飙升，但在 2018 年崩盘。这种模式证明了所有加密货币与比特币趋势密不可分。换句话说，曾达到 8,280 亿美元高值的开始下降。因此，市场对加密货币的兴趣正在消退。\n\
  \n许多欧洲国家合作制定加密货币立法，许多品牌也建立了创意合作，例如 `Ripple` 与 `Santander` 的合作。\n\n\n\n比特币在 4 月回升至\
  \ 7,000 美，距离其第三也是最后一次历史性事件——减半仅一个月。在经历了三个月的稳定期后，比特币在 10 月突破了 10,000 美元的关口。随后在两个月内，当投资者仍在讨论比特币可能进一步下跌的前景时，它克服了\
  \ 12 万、14 万、16 万以及最终的 1.9 万美元障碍。在 2020 年，机构投资者和政府部门无疑从比特币的增长中受益。`JPMorgan Chase`\
  \ 是这种采纳的催化剂。而这正是 2021 年加密货币牛市的动力。\n\n### 2021\n\n从 2020 年开始的牛市一直持续到 2021 年，专家和粉丝们对主流加密货币给出了丰厚的价格预测。`Elon\
  \ Musk` 在年初的支持加速了这一进程。围绕比特币的所有乐观情绪推着它推向新高，并对几乎所有的山币产生了积极影响。\n\n然而，障碍在 5 月出现，当时 `Elon\
  \ Musk` 改变了立场，表示 `Tesla` 将不再接收比特币，因为这会危及环境。更糟糕的是，5 月中国开展了一系列针对加密货币挖矿的打压行动，而该国是世界上大多数加密货币挖矿的所在地。这影响了几乎所有的加密货币，所谓的泡沫似乎已经破灭。\n\
  \n在地球另一端，距离中国半个地球的地方，2021 年将被记录为另一个南美国家首次接受了比特币。在国会收到总统 `Nayib Bukele` 拥抱加密货币并消除所有相关资本利得税的请求后，`El\
  \ Salvador` 将比特币承认为法定货币。此外，总统还承诺通过指示一家国有公用事业公司建设地热设施，利用火山能量进行比特币挖矿，从而利用该国的地热能。`BTC`\
  \ 在 2021 年的高达到了 68,000 美元，这是 2021 年 10 月的另一个历史新高，但在年底收价时低于 40,000 美元。\n\n### 2022\n\
  \n随着我们从 2021 年进入 2022 年，通货膨胀、能源危机以及由于俄罗斯对乌克兰的侵略行为导致的地缘政治动荡降低了 `BTC` 和其他顶级加密货币的价值。准备迎接\
  \ 2022 年加密冬和比特币价值的波动。从 2022 年 1 月到 5 月，比特币价格下跌。`BTC` 在 5 月自 2021 年 7 月以来首次跌破 30,000\
  \ 美元。加密冬的定义没有熊市那么明确。像熊市一样，这段时期加密货币市场持续下降，有时甚至剧烈。加密货币在第二季度下跌。`TerraUSD` 和 `Terrra\
  \ Luna` 等稳定币导致了加密货币价格的下跌。当加密货币对冲基金 `Three Arrows Capital` 违约 `bitcoin` 贷款并被`英维尔群岛`\
  \ 法院裁定清算时，比特币交易价格在 20,700 美元左右。2022 年 11 月，大型加密交易所 `FTX` 意外崩盘，进一步压低了加密货币价值。在其首席执行官\
  \ `Sam Blankman Fried` 被指控挪用资金后，该交易所宣布破产。`FTX` 的财务困难和可能的欺诈阻止了 `Binance` 对其进行救援。\n\
  \n`FTX` 震惊的崩盘震动了金融行业，在加密货币市场产生了多米诺效应，让投资者感到不安。通货膨胀担忧和利率上升影响了市场。随着 2022 年结束，比特币价格跌破\
  \ 20,000 美元，显示出加密货币市场的健康状况。\n\n### 2023\n\n上半年，`BTC` 处于 20 万美元位。我们现在正经历比特币价值缓慢但充满希望的增长，在撰写本章时，其已达到约\
  \ 30,000 美元，点燃了加密冬终于结束的一丝希望。第一季度，其他加密货币也随之表现出类似的价格趋势。\n\n# 第二章：比特币现象\n\n## 比特币诞生的故事\n\
  \n2008 年 11 月 1 日，一个名为 `Satoshi Nakamoto` 的匿名人在加密列表中发送了一封关于比特币的电子邮件。`Satoshi Nakamoto`\
  \ 提出了一种新的电子货币系统，不需要中介机构。这篇九页纸的白皮书 `Bitcoin.org/Bitcoin.pdf` 仍然可以查阅。`Satoshi Nakamoto`\
  \ 写：“我一直在研究一种不需要信任第三方的电子货币系统。”\n\n2009 年 1 月 12 日，`Nakamoto` 向 `Hal Finney` 发送了十个\
  \ `Bitcoin`，诞生了全新的金融模式，将动力从银行交回人民。此时，比特币的货币价值微乎其微。最初，用户在论坛上通过 `Bitcoin` 彼此奖励。2010\
  \ 年 5 月 22 日，发生了首次“真实”交易，当时 `Laszlo Hanyecz` 用 10,000 个 `Bitcoin` 买买了两个披萨，当时价值 30\
  \ 美元。按目前的价格计算，这次交易价值超过 3800 万美元。\n\n`Nakamoto` 与开发者的协作一直持续到 2011 年，直到他在没有预警的情况下，`Nakamoto`\
  \ 消失了，或者他只是？\n\n2009 年 1 月 3 日，在白皮书发布几个月后，比特币的第一行代码发布在 `区块链` 上。这些代码被称为“创世纪区块”，归功于名为\
  \ `Satoshi Nakamoto` 的个人或人物。\n\n`Nakamoto` 在文中提到，由于通货膨胀是一个问题，中央银行必须被信任来贬值货币。这种计划是完全去中心化的，这意味着用户不再需要信任中央银行。`Satoshi`\
  \ 写道：“货币的根源问题在于信任其运行，但法币货币的历史充满了对这种信任的背叛。”\n\n\n\n最初，比特币被视为一种带有哲学的货币。它不是由中央银行支持，而是通过编程和中本白皮书来实现，这两者都表达了对普通金融机构的怀疑态度，并提出了针对这些机构的重大理论优势。比特币的结构设计方式暴露了它的意识形态。点对点货币网络的概念是一个颠覆性的想法。\n\
  \n在进行货币交易时，你不需要向银行或货币交易所等第三方支付费用。但最初的意识形态比这更具革命性：比特币强调了货币这一概念从根本上来说是多么荒诞。在某种意义上，货币并不像汽车这样的物理资产那样是“真实的”。货币是人类的一种发明，是一种让交换变得更容易的价值令牌。但只要有足够的人相信它，人们为之奋斗和牺牲，而权机构因缺乏它而倒塌，它就能发挥作用并提供准确的支持。你可以注意到银行危机对比特币意识形态的影响。\n\
  \n它描绘了对金融机构特定的不信任。2009 年，在一个在财务困境中挣扎的经济体，许多人敏锐地寻找令他们失望的主流系统的替代方案。正如大多数人所理解的，银行系统的核心是货币。在所有以往基于互联网的货币尝试中，比特币是社会对传统金融系统普遍焦虑的最佳可能替代方案。\n\
  \n许多投资者将比特币视为一种实物商品，就像黄金一样。比特币还具有有限性，因为在当前协议下，世界上只有 2100 万个比特币。已有 1700 万个硬币被挖出，其余部分将以可预测的矿速率释放。中央银行或政治家需要能够让该系统运行得更快，或铸新货币以适应他们的政治议程。\n\
  \n# 比特币是如何工作的？\n\n像比特币这样的数字货币是一个相对现代的概念，数字货币与目前流通的政府货币之间存在本质差异。数字货币与真实货币相似，但它们不是由中央银行发行，也没有作为数字货币由国家财政支持。加密货币的发行是去中心化的，不是由政治家决定，而是由通常定义良好的技术方面决定的。\n\
  \n例如，比特币使用加密算法由网络用户生成货币，而不是由中央管理机构生成。开一个常规银行账户，可能需要几份文件（如有效身份证和居住地证明），而注册数字货币只需一个有效的\
  \ IP 地址即可。个人可以使用比特币向他人或商家付款，而无需引入任何第三方。\n\n当人们谈论比特币或区块链时，他们通常指的是比特币网络。网络中有两种参与者：钱包和节点。比特币用户通常拥有钱包，可以通过钱包发送和接收支付。节点是验证比特币交易并维护过去交易历史的计算机。一个节点也可以充当钱包。某些比特币网络节点被称为矿工。\n\
  \n任何人都可以以钱包或节点的身份加入网络，然后与其他人平等的使用比特币。尽管每个网络参与者都可以发送和接收比特币支付，但只有节点会实时跟踪整个交易历史。由节点维护的交易日志被称为比特币区块链。“区块链”一词源于在被称为“区块”的部分中添加新交易。\n\
  \n一个区块是近期交易的永久记录。记录的数据块相互构建形成区块链，可以追溯到第一笔比特币交易。\n\n# 我如何获得比特币？\n\n获取比特币并学习使用它相对简单。获取比特币的三种基本方式包括：\n\
  \n- 交易：个人和企业可以选择通过商品和服务来获得比特币。\n- 数字货币交易所：数字货币交易所的运作方式类似于传统货币交易所，允许个人买卖比特币。比特币的汇率根据流动性、需求和各种市场状况而变化。\n\
  - 挖矿：矿工是生态系统的骨干。他们为自己提供的服务获得比特币货币奖励，这有助于保护网络。\n\n# 比特币生命周期价格分析\n\n\n\n\n在过去十年的崛起过程中，比特币改变了全球市场的运作方式，并让许多人变得极其富有。这种世界上最受欢迎的加密货币于\
  \ 2009 年 1 月 3 日诞生，通过挖掘创世区块（`Block 0`）产生了 50 个比特币。2009 年 1 月 9 日，比特币 0.1 版本正式发布，其中包括将比特币总总量在\
  \ 2040 年前限制在 2100 万的发行系统。\n\n现在我们来回顾比特币走向巅峰的跌折历程，并分析该币种在此期间取得的一些重大里程碑。\n\n### 2009\
  \ - 2011\n\n在 2009 年 1 月诞生后，比特币基本上局限于开发者圈子，在境外并未引起太大关注。但随着 2009 年 10 月的到来，由一位原始比特币开发者运营的名为\
  \ `New Liberty Standard` 的加密网站显示了首次 BTC-USD 汇率。当时，他们根据挖掘一个比特币所需的电费来计算汇率，2009 年 10\
  \ 月 5 日的成本约为 0.0007 美元。不到一个月后，比特币 0.2 版本发布，支持 Linux 系统并增加了升级区块链能力的新功能。2010 年 5 月，发生了首次比特币购买：程序员\
  \ Laszlo Hanyecz 通过 Bitcointalk 论坛上的一个交易所，用 10,000 个比特币（价值约 30 美元）购买了两个教王披萨。到 2010\
  \ 年底，比特币的流行程度在原始媒体之外不断增长，势头良好；这导致比特币的总市值在 2010 年 11 月突破了 100 万美元大关。此时，一个比特币价值约为\
  \ 0.5 美元。\n\n2011 年是比特币的一的一年，因为它首次突破了 1 美元大关并登上全球新闻，进一步推高了它的人气。臭名昭著的 `Silk Road`（丝绸之路）网站在此期间由\
  \ Ross Ulbricht 先生推出，他希望创建一个无法法的暗网市场，让人们可以无痕地买卖任何东西。比特币由于其匿名性和不可追踪性，成为显而易货币选择。然而，凭借媒体关注带来的势头，比特币继续上涨，在\
  \ 2011 年 6 月突破了 10 美元并超过 30 美元。正此时，原始创始人中本聪（Satoshi Nakamoto）消失在互联网上。\n\n在从 2 月的\
  \ 1 美元反弹到 6 月 8 日 31 美元的高点后，比特币的梦幻之旅突然反转，所谓的比特币泡沫破灭了——价格在 6 月 12 日跌回个位数。\n\n突然的飙升为加密粉丝对这种新型数字货币带来了巨大的希望，一些人预计价格将达到\
  \ 1000 美元以上的高点并在年底进入主流应用。但突然的崩盘带来的绝望与上涨带来的希望一样多，很快，`Silk Road` 等黑市应用的存在让人们开始怀疑比特币的未来。比特币\
  \ 0.5 版本在此时正在运行。\n\n### 2012-2017\n\n比特币由于波动剧烈，在 2011 年 6 月价格达到顶峰后，过去几个月里再次缓慢上升，并在近一年来首次升至\
  \ 9 美元以上。随后，多次比特币交易所被黑客以及 `Silk Road` 被关闭的事件导致了大量资金损失。2012 年，比特币首次突破 10 美元。2013\
  \ 年，市场经历了极烈的波动；价格在 12 月触及 1000 美元后崩盘。2014-2016 年经历了一段相对稳定的时期，尽管技术趋于成熟。2017 年，比特币经历了巨大的牛市，在\
  \ 12 月突破了 20,000 美元大关，并引起了全球主流的关注。\n\n\n\n\n比特币价格在预期 Coinbase IPO 时飙升了 6.24%，创下超过\
  \ 63,000 美元的新高。但很快，由于特斯拉出于环境影响停止接受比特币支付，这种加密货币在反转的压力下受挫。比特币下跌了 13%。随着中国禁止金融机构提供任何加密货币相关服务，比特币陷入了另一个糟糕时期，价格下跌了\
  \ 14% 以上。\n\n比特币价格在 5 月份约为 60,000 美元，随后跌至约 30,000 美元；几乎所有其他加密货币也经历了跌式下跌。由于全球监管障碍，比特币在本周结束时下跌\
  \ 25% 后仍处于自由落体状态。5 月，比特币交易价格为 38,400 美元。来自萨尔瓦多的消息使价格飙升，因为它可能将比特币作为法定货币并采用数字代币，这一出人意料的举措可能会改变国际加密货币市场的格局。\n\
  \n在 2021 年比特币大会上，萨尔瓦多总统纳纳 5 布·布克莱莱（Nayib Bukele）宣布其国家正式采用比特币作为法定货币。一旦实施，它将是世界上第一个这样做的国家，标志着国际货币政策史上的重要里程碑。这也意味着在萨尔瓦多持有比特币没有资本利得税。与此同时，随着中国加强对加密挖矿的打击并禁止大多数挖矿活动，比特币跌至\
  \ 1 月以来的最低价格。\n\n在经历了一年的新高和抛物线增长后，加密市场正处于动荡时期，短期内似乎不会结束。比特币似乎正在回升，随着德国向更大程度的加密采用迈进，价格在\
  \ 2021 年 8 月飙升近 4 万美元，允许机构资金首次持有高达 20% 的加密资产。\n\n通胀、能源危机以及俄罗斯对乌克兰的侵略导致的地缘政治动荡导致了\
  \ 2022 年 BTC 以及其他主流加密货币价值下降。2022 年 5 月，BTC 自 2021 年 7 月以来首次跌破 30,000 美元。这段期间，加密货币市场持续下降，有时剧烈。`TerraUSD`\
  \ 和 `Terra Luna` 的失败导致了加密价格下跌。当加密货币对冲基金 `Three Arrows Capital` 比特币贷款违约并被英属维尔京岛法院裁定清算时，比特币交易在\
  \ 20,700 美元左右。FTX 交易所在其 CEO 山姆·班克曼-弗（Sam Bank Fried）被指控挪用资金后破产。由于 FTX 的财务困难和可能的欺诈，Binance\
  \ 无法对其进行救援。2022 年结束，比特币价格跌破 20,000 美元，反映了加密货币市场的健康状况。\n\n# 比特币对比银行\n\n比特币的目的是去中心化金融系统。换句话说，它旨在取代中心化的银行系统。迄为止，它尚未正式取代银行，但这些努力仍在。因此，比特币对银行的主导地位将使银行系统去中心化。因此，我们需要关注去中心化和中心化策略的特征，以理解比特币是否能够接管当前的银行系统。\n\
  \n在比特币进入市场之前，我们只接触传统银行系统的运作。比特币和其他加密货币通过在去中心化的公共账本上存储交易来运行。该账本使用加密算法来确保记录准确，且用户身份经过加密。\n\
  \n比特币所有者拥有数字钱包，可以在其中存储硬币。账本的工作是确保钱包中维持适当的可消费余额。此外，它还跟踪交易历史，以确保所有者从钱包中支出。\n\n与传统货币不同，比特币不是通过打印纸币和硬币创建的，而是通过一个被称为“加密货币挖矿”的过程制造的。挖矿通过解决复杂的数学题来确认并将交易添加到账本（区块）中。现在你已经了解了基本原理，我们就可以理解它对银行的影响。\n\
  \n# 对银行的影响\n\n近年来，人们看待业务和进行交易的方式发生了剧烈变化。人们可以在手机上点击几次即可在传统银行之外兑换货币。\n\n重要的一点是，如果人们需要融资，无需亲身前往传统银行。随着点对点网络的发展（如比特币和其他加密货币所示），这种方式变得越来越流行和熟悉，人们正在背离银行，转向像比特币这样更具去中心化的系统。\n\
  \n# 比特币 - 对传统银行的威胁？\n\n简而言之，是的。加密货币爱好者早在此就发现比特币及其技术威胁着银行业业。不仅是他们，银行对用区块链技术取代银行运作也有强烈的感知。例如，法国银业巨头法国巴黎银行（BNP\
  \ Paribas）发布了一份报告，讨论了比特币背后的技术以及它如何让传统银行变得多余。\n\n此外，该银行的一位分析师将比特币背后的软件与蒸汽机和燃机等发明相比，并认为具有转型金融世界的潜力。英国一份银行报告得出结论，比特币及后续加密货币是对传统银行的威胁，特别是当他们需要考虑人们对于如何交易货币的新偏好和行为时。\n\
  \n# 后果！\n\n为了理解比特币的力量，让我们假设一个比特币已接管金融系统的场景。以下是比特币进入金融领域后，银行可能产生的影响。\n\n# 银行系统的消亡\n\
  \n银行无法利用比特币创建储备并执行部分准备金贷款。没有任何手段可以控制比特币，因为比特币没有代表且是完全去中心化的。银行无法再通过通胀或通缩用户储蓄账户的购买力。如果加密货币在全球范围内被采用，银行无法利用比特币进行救援。\n\
  \n银行无法从汇款业务中获得收入，该业务在跨境交易中收取 10-30% 的费用。\n\n银行是每笔交易的中间人。但随着比特币进入市场，银行可能会消失，因为比特币的主要特征之一就是没有中间人。如果比特币进入主流，这些可能性就会出现。因此，银行将比特币视为自身的潜在威胁。此外，一些人认为比特币对银行和当前技术的影响将超出想象。控制政治家和媒体的金融精英将竭尽全力阻止这种事的发生。\n\
  \n\n\n像 `JP Morgan` 这样主导离岸银行业的金融机构与大型银行有联系，这使得非常高效且安全地结算数十亿美元成为可能。然而，一个缺点是，数十亿美元的转账需要大量的人工操作，包括交易验证、反洗钱检查和支付结算。但正如提到的，`Bitcoin`\
  \ 是完全去中心化的，不需要任何人工工作。此外，`Bitcoin` 提供的结算和离岸银成本更低，基础设施也更稳健。\n\n`Bitcoin` 能接管银行系统吗？答案是肯定的也是否定的。凭借\
  \ `Bitcoin` 提供的巨大收益，`Bitcoin` 有可能主宰银行系统。由于传统的银行系统已经非常成熟，人们依赖并信任这一系统。同时，`Bitcoin`\
  \ 在波动性和监管方面确实存在缺点。因此，不能肯定地说 `Bitcoin` 将取代现有的中心化系统，尽管它可以做到这一点。\n\n# 比特币的基本面分析与技术分析\n\
  \n基本面分析通过在投资前观察资产的财务表现、前景、市场价值和用场景来确定其价值。现在我们现在通过研究市值、流动性以及`Bitcoin 白皮书`等核心指标，对\
  \ `Bitcoin` 的基本面进行分析。\n\n市值（通常称为 `market cap`）是资产的总市场价值。市值等于货币的当前市场价格乘以流通中的币数量。`Bitcoin`\
  \ 的市值告诉我们它在市场中的渗透程度和采用范围。它也可以用于预测未来的增长潜力。低市值的硬币比高市值的硬币更有可能看到高增长，而高市值的硬币往往倾向于更加成熟和稳定。\n\
  \n`Bitcoin` 拥有所有加密货币中最大的市值。它是一种成熟的硬币，相对来说是一个安全的投资选择。显著的市值反映了市场参与者对该货币的信任。\n\n流动性衡量了资产被买卖的难易程度。良好的流动性是供需稳定的信号。流动性与交易量直接相关。高流动性确保了资产可以快速方便地进行交易和交换。\n\
  \n分析 `Bitcoin` 的流动性显示，其日均交易量为 20 亿至 40 亿美元，这意味着 `Bitcoin` 是一种流动性极高的资产，买卖双方随时可用。高交易量也表明市场对该硬币的兴趣。\n\
  \n货币供应的性质是加密货币的基本特征。`Bitcoin` 拥有 2100 万枚的固定总量；挖矿速度每四年减半。这样做是为了维护货币的价值并对抗通货膨胀。有限的供应对货币几乎总是有利的因为它确保了稀缺性并对抗了通胀。这使得由于有限供应带来的抗通胀属性，`Bitcoin`\
  \ 优于许多其他资产。这意味着投资 `Bitcoin` 可以对抗通胀。\n\n`Bitcoin 区链`中发生的交易频率和数量等信息为我们提供了关于网络中活动的洞察。交易价值可用于理解网络中的资金流动，因为它显示了在特定时间内转移了多少资金。`Bitcoin`\
  \ 的交易次数和权重很高，因为它是目前最活跃的加密货币。\n\n区块链运行在不同的算法上，`hash rate`（算力）可用于评估网络的健康状况。`Bitcoin`\
  \ 健康的算力表明对该货币的兴趣很高或挖矿率增加。简单来说，`hash rate` 可以被视为硬币的挖矿速率。与其他指标相结合，`hash rate` 可用于预测货币的趋势。\n\
  \n活跃地址是指在特定时期保持活跃的区块链地址。计算此指标的方法各异，但它也是`Bitcoin 生态系统`中动态市场参与者的良好指标。还可以研究几个独特地址，以观察网络中新用户的增加进展。`Bitcoin`\
  \ 在任何时候都有超过 50 万个活跃地址，暗示了它的流行程度和采用率。\n\n`whitepaper` 是一份技术文档，为提供了加密货币项目的概述。在投资某个项目之前阅读其`whitepaper`是一个好主意。一份良好的`whitepaper`应该定义网络目标，并让我们了解所使用的技术、用场景以及硬币的未来路线图。`Bitcoin`\
  \ 拥有稳固且定义良好的文档支持其区块链技术；与 2009 年由 `Satoshi Nakamoto` 发表的原始论文相比，仅进行了极微的修改和补充。\n\n\
  加密货币项目只有在保持相关性时才有价值。它应该始终具有不同或成熟的应用，或者具有某些独特、不可替代的方面，使其在加密宇宙中保持适用。因此，在研究加密货币时，必须密切关注网络与现实应用的结合。`Bitcoin`\
  \ 是最广泛且渗透率最高的。\n\n# 比特币的技术分析\n\n技术分析与基本面分析是完全不同的两个领域。在技术分析中，我们采用统计方法，通过分析关键指标并使用数学工具和函数研究图表来研究资产。这里我们将简要讨论属于技术分析的一些基本方法和概念。\n\
  \n## 支持位与阻力位\n\n支持位是一个买入意愿强烈到足以抵御卖方压力的价格水平。结果是下跌停止，价格开始再次上涨。通常，根据之前下跌建立的趋势可以预先确定支持位。同样，阻力位与支持位相反，代表了市场上方的一个水平，在那里卖方的压力超过了买方的影响。如果资产在支持位获得支撑，价格倾向于上涨，但如果它突破了支持位并向下移动，则可能会进一步下跌。同样，如果资产突破了阻力位，预计它将继续向上，但如果没有跨越该水平，则可能会下跌。\n\
  \n## K 线图\n\n与显示当前和历史价格数据的传统折线图不同，日本 K 线和柱状图在给定时间内使用多达四个数据点，而不是一个：\n\n1. 时间开始时的开盘价\n\
  2. 该时间内价格达到的最高点\n3. 该时期内价格达到的最低点\n4. 周期结束时的收盘价\n\n\n\n\n\n这四点增加了图表的信息价值，意味着它们可以立即指示市场正在发生的情况。这就是为什么\
  \ K 线图几乎总是比普通的折线图受欢迎。\n\n# 基于指标的交易\n\n技术指标是预测未来趋势和做出更好交易决策极极方法；在这里，我们将讨论交易者可以用来预测比特币市场价格未来走向的技术指标。\n\
  \n简单移动平均线 (`SMA`）是最常见的趋势指标。它提供了交易工具在特定时间内的平均价格，并识别主趋势。它在图表上看起来像一条平滑的线。移动平均通常有三种：`SMA`、`EMA`\
  \ 和 `WMA`。由于我们计算的是平均成本，所有的移动平均都需要时间跟上。如果你图表上的价格急剧上升或下降，该指标会反应，但你收到的信号将会有延迟。\n\n\
  当价格超过平均线时，它是买入信号。当价格跌破平均线下方时，它是卖出信号。因此，当收盘价高于 `MA` 时买入，收盘价低于 `MA` 时卖出。\n\n相对强度指数\
  \ (`RSI`）是一种广泛使用的技术指标。它由美国工程师威尔斯·威尔德（Welles Wilder）于 1978 年开发。`RSI` 显示价格沿其运动方向的变化程度。它将成本转换为百分比，指示超买区（30%以下）和超卖区（70%以上）。\n\
  \n因此，`RSI` 值在 30% 或以下表示超卖状态，而 `RSI` 值在 70% 或以上表示证券正变得超买。当价格从超买区进入中性区时，它是卖出信号；当成本从超卖区进入中性区时，它是买入信号。\n\
  \n尽管技术指标是使用稳健的数学和统计方法开发的，但它们并非总是 100%准确的。经验交易者在交易前会使用多个技术指标以及市场情绪、财经新闻和基本面分析技术等关键输入。除了多样化的信息，老练的交易者还有健全的风险资金策略以确保最佳结果。\n\
  \n# 为什么风险管理至关重要？\n\n交易是一个概率游戏。换句话说，交易市场是一个永远不确定的地方。因此，它带有默认风险。作为交易者，首要任务应该是尽力减少并管理风险。专业交易者认为，理解风险管理比拥有良好的策略更重要。\n\
  \n风险是指事件发生与预期结果相反的概率。交易涉及在两个选择之间做出预测。该领域的风险简单来说就是你愿意损失的资金的百分比。例如，如果一个交易者的账户余额为 $1000，并且他在某笔交易中承担\
  \ 2% 的风险，该交易者就是在押注其账户余额的 2%，即 $20。因此，如果交易不利于交易者，他最多损失 $20。\n\n# 风险管理技术\n\n能够有效管理风险的交易者可以自动实现利润最大化。专业交易者的方法是控制损失而不是追求利润。以下是每个交易者必须学会的一些风险管理策略。\n\
  \n## 1. 止损和止盈\n\n交易中的首要规则是每笔交易都设置止损和止盈。止损是一种可执行订单，当市场向预期方向移动时在指定价格切断部位。另一方面，止盈也是一种可执行订单，当市场达到有利于交易者的指定价格时结清部分仓。止损将保护交易者免受进一步损失，而止盈即使在市场之后背离预期方向也能锁定利润。\n\
  \n## 2. 头寸大小\n\n头寸大小是交易者投资的证券单位数量。这不是根据账户规模和风险承受能力得出的随机数字。\n\n首先，账户规模是交易账户中的余额。例如，如果一个交易者向其交易账户存入\
  \ $1,000，账户规模将为 $1,000。\n\n账户风险是交易者在某笔交易中愿意损失的账户规模的百分比。例如，如果你将账户风险设置为 1%，那么你将在该笔交易中承担账户余额的\
  \ 1%。\n\n交易风险简单来说就是单笔交易的止损额。它是入场价格和止损价格之间的差。例如，如果买入入场价为 $210，止损价为 $160，则每个单位交易的风险为\
  \ $50。\n\n### 仓位大小\n\n使用上述两个参数，可以确定某笔交易的仓位大小。在数学上，仓位大小通过账户风险除以交易风险获得。例如，如果某笔交易的账户风险为\
  \ $100，每单位交易风险为 $2，那么仓位大小将为 $100/$2 = 50 个单位。\n\n## 3. 风险收益率\n\n另一个关键的风险管理工具是风险收益率。该比例比较了交易中的实际风险与潜在收益。风险收益比告诉你某笔交易是否值得承担。例如，可能会出现止损价高于止盈价的情况。在这种交易中，你承担的风险大于收益。\n\
  \n因此，使用该比例是为了在此类情况下保持谨慎。例如，如果交易者在某笔交易中承担 $100 的风险，风险收益比为 1:1，他就是在冒 $100 来赚 $100。同样，如果比例是\
  \ 1:2，他将冒 $100 来赚 $200。因此，你应该避免进行低于 1:1 的交易以保护你的资金。\n\n# 第三章：比特币的未来\n\n我们已经看到了比特币区块链的、比特币令牌\
  \ (`BTC`)、其他加密货币、非同质化标记 (`NFTs`)、去中心化金融 (`DeFi`)，现在接下来是什么。让我们想象甚至梦想一下这些可能性。如果比特币已经成为从亚马逊到雪罗佛等各种规模企业广泛接受的支付方式会怎样？在亚马逊上沉浸于一本完美的书或产品，并用比特币的力量购买。介绍汽车世界的最新加入者——雪罗佛的新电动汽车，并随着雪罗佛现在接受比特币，体验未来的支付。\n\
  \n到目前听起来很棒，但假设情况变得更好，我们得到了政府的绿灯。全球政府正在积极推广和支持比特币，标志着一个接受和优惠监管的新纪元的黎明。想象一个比特币被广泛接受为法定货币的世界，就像在萨瓦多多一样，那里多年前就采用了比特币。这将是终极理想的结果。\n\
  \n现在，比特币的技术已经演进到能够实现更快速、更廉的交易，同时保持其反通胀的理想和价值价值存储的基本哲学。通过我们的区块链技术体验支付处理器的可靠性和高效。通过这一巨大的进步，体验无缝的比特币驱动的收银机结账。\n\
  \n现在让我们更进一步，想象一下，如果华尔街顶级玩家（包括高盛和贝莱德）对比特币的新发现信誉和增加的需求使他们开始将其视为主流资产类别。这一平台受到各种类型和规模投资者的青睐，他们寻求长期保护和扩大自己的财富。凭借其令人印象深刻的成就记录，比特币无疑具有成为繁荣\
  \ DeFi 景观基础的潜力。\n\n\n\n\n在没有任何确定预测的情况下，体验上述高度乌托邦式和反乌托邦式评论中迷人的思想实验。一切听起来都很奇妙，我们应该也能够为这种发生做好准备，但让我们稍微回到现实。让我们假设一个更现实的未来对比特币意味着什么。展望未来，显而易见，比特币和其他加密货币在未来几年内将经历正负面影响交织的发展。准备好迎接金融革命吧！数字货币正准备重塑市场。然而，前方的道路可能充满了意想不到的转折。\n\
  \n## 监管格局与波动性\n通过规避监管不确定性来获得安心。随着加密货币的日益普及，全球政府正面临着如何有效监管它们的挑战。随着数字货币世界的不断演变，一些国家将热烈地采纳比特币及其同类货币，而另一些国家将坚持执行限制。当监管新闻推动市场力量之间的拉锯战时，体验极端市场波动带来的快感。\n\
  \n## 市场采用趋势\n随着更多企业和消费者拥抱，比特币和其他加密货币将逐渐被采纳。然而，预计采纳速度将是稳健且适度的。由于潜在的波动风险、交易成本和监管担忧，公司可能需要帮助在当今动态的商业环境中拥抱新机会。接受度提高这一不可阻挡的趋势继续获得动力。\n\
  \n## 竞争与创新\n比特币预计将面临来自其他加密货币的竞争。发现为您的需求定制的各种选择——从极快的交易速度到降低的费用和更高的隐私性。尽管比特币是领先的加密货币，但市场上还有许多其他参与者。它在未来的持续主导地位仍待决定。\n\
  \n## 技术演进与验证\n体验比特币网络增强的技术升级，尽管这些升级可能不会立即实现并可能引发一些争论。在修改比特币协议方面，在矿工和节点运营商之间达成共识是一项挑战性的任务。\n\
  \n探索比特币验证过程的潜在未来。它会从高能的`Proof-of-Work`（工作量证明）转向更可持续的替代方案吗？你听过`Proof-of-Stake`（权益证明）系统吗，类似于以太坊实现的机制？比特币应该效仿太坊的做法，对开矿过程的资源。也许比特币需要维持其\
  \ 2100 万枚代币的寿命上限；这意味着什么呢？毫无疑问，让比特币处于加密货币市场的前沿至关重要。否则，竞争货币可能会抓住机会将其拉下神坛。\n\n## 价格波动\n\
  体验比特币持续波动带来的兴奋感，大幅的价格波动将成为常态而非异常。随着市场的成熟，波动性可能会降低。但在期间，请做好迎接几次过山车式体验的准备。比特币的未来仍待决定。然而，它可能在成为世界领先货币或完全消失之间徘徊。\n\
  \n## 全球整合\n未来，加密货币将像股票、债券和储蓄账户等传统投资选择一样被广泛接受。随着全球统一的法律和监管框架，围绕这些数字资产的任何争议将成为过去。由于完全确定的指令尚未揭晓，充满前景的未来仍然具有不确定性。需要明确的是比特币在这一格局中的具体作用是什么。\n\
  \n开启一段理解比特币和广阔加密市场的之旅是一个持续的过程，而非终点。随着这个令人兴奋的新领域的演变，通过保持信息灵、不断学习并调整您的投资策略来保持领先地位。\n\
  \n## 投资策略\n通过比特币及其加密同类货币体验高风险、高回报投资的快感。虽然它们在完善的投资组合中可能有一席之地，但重要的是，它们的波动性可能是一场巨大的考验。只有那些心理强大强大的人才需要尝试。通过稳健的方法，我对比特币作为长期获胜竞争者的潜力持有乐观态度。在加密货币领域导航需要谨慎的方法。警惕潜在的陷阱，通过通过股票、现金或指数基金等可靠的投资选择进行多元化，优先保护您的资产安全。\n\
  \n# 比特币的未来\n\n比特币价值在 2020-21 年的峰值时期飙升了 500% 以上。比特币的价值是盎司黄金的二十倍。例如，中非共和国和萨尔瓦多等某些政府最近已将比特币合法化为支付手段，增加了使用美元等当前货币购买比特币的使用。这种加密货币价值的流星式增长引发了巨大的公众兴趣，并增加了其感知价值。它也导致许多投机者和赌徒竞相投资这种货币，以实现未来的指数级回报。再次，这在其感知价值的上升中起到了重要的催化剂作用，并使货币变得极其波动。\n\
  \n缺乏中心化控制或监管机构使其容易出现合规性问题，并易受到洗钱的影响。这些方面也让许多人怀疑比特币是否是一个最终会破灭的泡沫。比特币的设计具有强度，使其成为一种可行的货币，并在多年来提升了其地位，最值得注意的是其固定供应量。比特币将每四年进行一次收益递减的开采，直到达到比特币的最大数量：2100\
  \ 万枚。比特币的这一点对其价值至关重要。由于比特币的数量有限，永远不会出现过剩。这使得比特币成为投资者投入财富的良好资产，因为通常不会由于通货膨胀而贬值。然而，与大多数加密货币一样，其价格可能会许多其他外部因素而剧烈波动。\n\
  \n加密货币在转型长期金融系统技术方面具有独特地位。由于其本质，它可以填补当前金融技术的空白。比特币的技术允许个人在不需要受信任的第三方（如银行）监督交易的情况下交换货币。使用比特币只需要手机，许多人都可以访问。由于比特币的点对点网络功能，用户可以通过扫描钱包应用程序显示的二维码来与其他进行比特币交易。这是对多年存在问题的真正创新解决方案。随着用户群的增长，交易将不可避免地增加，因此对更好的加密货币网络和应用的需求将成为显焦点。\n\
  \n\n\n\n对于开发者来说，创建这些应用程序存在一个巨大的未开发市场，因为这项技术可以被任何依赖第三方结算系统的行业所采用。比特币演变为一种变革性技术的关键，在于它能够与活跃且不断增长的用户和开发者社区相结合，解决长期以来的问题。企业也开始看到使用加密货币进行国际交易的益处。如果使用传统方法，贸易在跨境时可能会产生任何无法解释的费用，使得向另一个企业发送正确的金额变得复杂。得益于在快速点对点交易中的灵活性（特别是在国际\
  \ B2B 业务场景下），加密货币比传统货币具有显著优势。\n\n互联网市场一直蓬勃发展，是传统实体店的真正竞争对手。Amazon.com 的增长程度已经大到出乎意料。在线购物正蓬勃发展，比特币正准备通过为供应商和客户提供高效便捷的支付方式来扩展其影响力。比特币最重大的机会之一是它可以作为类似于黄金商品。正如我们在\
  \ COVID-19 疫情期间看到的，每当有事件威胁全球市场的平衡时，黄金的价值就会大幅飙。商品市场是一种被广泛认可且成熟的交易形式，而加密货币似乎开始模仿黄金的特性。黄金基于对其价值的普遍接受和信任，长期以来一直是价值载体。加密货币可能成为商品市场中的重要参与者。它们具有独特的属性，可以通过直接在线机制进行购买，这为买家创造了简单的切入点。如果比特币仍然是通货膨胀法币的有效避风港，它将获得投资者的信心，并更趋于主流。\n\
  \n众所周知，比特币的“挖矿”是一个高耗能的过程。最近的研究显示，比特币网络中的单笔交易消耗了 800 千瓦的能量。相比之下，同样的能量可以完成 50 万次 Visa\
  \ 交易。与现金或法币等其他支付方式相比，比特币是高耗能的。在目前的价格下，比特币的能源消耗并不逊色。尽管如此，全球变暖和气候变化引起了人们对比特币挖矿使用的不可再生能源的担忧。\n\
  \n我们现在正在经历比特币的崛起，这可能是 2024 年下一轮全面推进的牛市的开始。\n\n# 专家价格预测\n\n比特币在 2021 年下半年表现停滞，从 4\
  \ 月份创的约 65,000 美元的峰值下跌了一半以上。\n\n然而，比特币价格仍然显著高于 2020 年 10 月大规模大涨开始时的水平，那场牛市曾将加密货币市场总市值推向令人震惊的\
  \ 2.5 万亿美元，随后有所回落。预测比特币等加密货币的未来具有挑战性，且结果可能具有高度准确性。比特币作为市场上波动性最大的资产之一，使得未来的估值非常难准确。尽管如此，让我们概述一下加密货币专家和财务分析师对比特币未来的看法。\n\
  \n## Tim Draper\n比特币看多者 Tim Draper 对比特币做出了最乐观的预测之一，预计该代币在年底前将价值 250,000 美元。\n\n\
  ## Shervin Pishevar\nShervin Pishevar 是一位风险投资人和天使投资人，也是 Hyperloop One 和 Sherpa Capital\
  \ 的联合创始人，他推特说比特币将达到 10 万美元。这一预测是在与 MicroStrategy 首席执行官 Michael Saylor 会面后不久提出的，该公司在比特币上投资了超过\
  \ 10 亿美元。\n\n## Thomas Fitzpatrick\n花旗银行全球市场洞察产品 CitiFX Technicals 的全球负责人 Thomas\
  \ Fitzpatrick 因其对比特币 318,000 美元的估值而登上新闻，这是在一份报告在线泄露后提出的。他的分析将 20 世纪 70 年代的黄金市场与比特币的价格走相似，并指出自\
  \ COVID-19 出现以来央行印钞的加速，这可能会推动比特币的上涨。\n\n## Winklevoss twins\nWinklevoss 兄弟俩——著名的比特币万富翁，公开表示比特币有潜力在\
  \ 2030 年前达到 500,000 美元的价格。这将使其市值与约 9 万亿美元的黄金持平。\n\n## Wences Casares\nWences Casares\
  \ 是比特币钱包初创公司 Xapo 的首席执行官兼创始人，并担任 PayPal 等董事会成员。Casares 在纽约举行的 Consensus 2017 大会上表示，比特币在\
  \ 2027 年之前的某个时候将达到 100 万美元。\n\n## Chamath Palihapitiya\nChamath Palihapitiya 是 Social\
  \ Capital 的创始人，金州勇士队篮球队的所有者。他从 2012 年的一项投资开始了他的比特币投资之旅，到 2013 年，他已将比特币纳入所有的投资组合中。曾一度，他拥有所有流通比特币的\
  \ 5%。\n\nPalihapitiya 声称比特币价格将在未来 3-4 年内达到 10 万美元，并补充说它将在 2037 年达到 100 万美元。他说：“这个东西有潜力与黄金的价值相比……这是对抗专制政权和银行基础设施的极佳对冲和价值存储，我们知道这对世界的正常运作是有破坏性的。”\n\
  \n## Jeremy Liew\nJeremy Liew 是 Lightspeed Venture Partners 的合伙人。他是社交媒体应用 Snapchat\
  \ 的最早投资者之一。在接受《商业内幕》采访时，Liew 表示比特币价格“现实上”可能在 2030 年达到 500,000 美元。随后，Liew 的预测得到了\
  \ Blockchain 首席执行官兼联合创始人 Peter Smith 的支持，后者是全球最流行的比特币钱包。\n\n## Mark Yusko\nMark\
  \ Yusko 是一位万富翁投资者，Morgan Creek Capital 的创始人。他预测比特币长期将达到 400,000 美元，这一预测因其巨大的规模而成为头条。\n\
  \n“这完全是数学问题。它是黄金等；目前有约 2000 万枚比特币。黄金今天的价值约为 8 万亿美元。这算出了 40 万美元。这还没有包括与货币相关的用例，”Yusko\
  \ 说。他进一步暗示，比特币等加密货币令银行感到恐惧，因为比特币完全消除了对银行的需求。\n\n## Kay Van-Petersen\nKay Van-Petersen\
  \ 是 Saxo Bank 的分析师，这是一家专门在线交易和投资的银行。\n\n根据 CNBC News 的报道，Van-Petersen 认为比特币将在 2027\
  \ 年前达到每枚 10 万美元。他曾成功预测比特币在 2017 年上涨至 2,000 美元。尽管很乐观，但他最新的估计认为比特币将占全球外汇市场量的 10%。\n\
  \n## Mike Novogratz\n\n\n\n\n\n迈克·诺沃格拉茨（Mike Novogratz）是一位前对冲基金经理，也是比特币和区块链技术的资深投资者。他过去的几次预测既是正确的，也是错误的。2019\
  \ 年 3 月，诺沃格拉茨间接地做出了某项预测，称比特币在未来十年内将“轻松”超过黄金 7.5 亿美元的市值。这从时间线和规模来看，他的预测与埃德斯特姆（Edstrom）非常接近。从这些证言可以看出，加密和金融领域的大多数专家对比特币持看好态度，尤其是从长期角度来看。\n\
  \n# 第 4 章：山寨币市场\n\n## 什么是山寨币？\n\n自 2009 年诞生以来，比特币已成为全球首个且最受欢迎的加密货币。它为许多其他替代加密货币（或\
  \ `Altcoins`）的创造铺平了道路，这些货币在动态且快速变化的金融市场中相互竞争优劣。由于其半匿名性、缺乏监管以及在洗白在线违禁销售利润方面的有效性，比特币一直是暗网市场用户最流行的货币。然而，用户批评比特币缺乏真正的匿名性，并指责其设计上的局限性为执法部门通过区块链追踪支付提供了证据轨迹。这导致了替代加密货币（`Altcoins`）的发展增加，这些货币优先考虑匿名性和安全性，使得追踪支付和洗白收益几乎不可能。但并非所有的\
  \ `Altcoins` 都面向匿名性；任何非比特币的加密货币都被称为 `Altcoin`。\n\n由于具有增强的安全功能，`Altcoin` 的价格可能会因需求而大幅上涨。尽管如此，它可能仍然大多数人的首选货币。每个\
  \ `Altcoin` 项目都是独特的，有自己的目标利基市场、目标以及构建基础的区块链技术。\n\n## 比特币对比山寨币\n\n`Altcoins` 的工作方式与比特币不同。例如，比特币每\
  \ 10 分钟仅产生新的比特币，而 `Litecoin`（莱币）等山寨币每 2.5 分钟产生新币。这意味着 `Litecoin` 可以更快地处理支付。此外，`Litecoin`\
  \ 的总供应限制在约 8400 万 `Litecoin`，而比特币的总量约为 2100 万。\n\n`Litecoin` 的挖矿规则也与比特币不同。比特币挖矿需要昂贵的硬件，而\
  \ `Litecoin` 可以用标准的计算机硬件挖矿。\n\n`Litecoin` 只是今天现有的数千种山寨币之一。然而，某些山寨币作为比特币的热门替代品脱颖而出；尽管它们没有达到比特币\
  \ 100 亿美元的市值，但大多数与传统的比特币相比某些优势。此类山寨币的示例包括：\n\n* `Ethereum`（以太坊） - `ETH`\n* `Ripple`（瑞波）–\
  \ `XRP`\n* `Cardano`（卡尔达）– `ADA`\n* `Solona`（索拉）– `SOL`\n* `Polygon`（Polygon）– `MATIC`\n\
  * `Polkadot`（波卡） - `DOT`\n* `Litecoin` – `LTC`\n* `Avalanche`（雪崩） - `AVAX`\n\n通常情况下，这些山寨币的构建和发布是为了通过更快的交易、更高的挖矿速度、更高的安全性或更低的网络费用来改进比特币的缺陷。\n\
  \n然而，这些山寨币可能需要比特币所提供的更多稳定性、流动性和大市值。\n\n## 山寨币的早期示例\n\n最早的著名 `Altcoins` 之一是 `Litecoin`，它于\
  \ 2011 年 10 月发布，被营销为“比特币的银”。虽然在代码和功能上与比特币基本相似，但 `Litecoin` 在几个方面与比特币不同。`Litecoin`\
  \ 允许交易更频繁地获得批准。它还提供了 8400 万枚币的总供应量，是比特币总供应量的四倍。`Litecoin` 仍然是最受欢迎的山寨币之一；有些人甚至认为它可能是比比特币更好的投资。\n\
  \n## 山寨币的类型\n\n根据其功能和区块链机制，山寨币有很多种类和类别。以下是一些较重要类型的概述：\n\n### 基于挖矿的\n\n正如其名所示，基于挖矿的山寨币通过挖矿产生。此类类别的大多数山寨币使用工作量证明（`Proof-of-Work`,\
  \ `PoW`）。工作量证明是计算机通过解决复杂问题创建区块来生成新币的方式。基于挖矿的山寨币示例包括 `Litecoin`、`Zcash`（现金）和 `Monero`（门罗）。2020\
  \ 年初大多数顶级山寨币都是基于挖矿的币。预挖（Pre-mined coins）是基于挖矿的山寨币的替代方案。预挖币不是通过算法产生的，而是在加密货币交易所挂牌之前分发的。预挖币的示例是\
  \ `XRP`，也称为 `Ripple`（瑞波）。\n\n### 稳定币\n\n加密货币自推出以来，本质上一直波动很大。稳定币旨在通过将其价值挂钩到各种商品或大宗（如贵金属、法币或其他加密货币）来减少这种整体波动性。这确保了如果加密货币失败或面临问题，投资者可以兑回他们的资金。稳定币的价格波动通常不会超出很小的范围。\n\
  \n社交媒体巨头 Facebook 的 `Diem` 是稳定币最著名的例子。它是一种美元支撑的币，意味着 `Diem` 的价值与美元相关。其他稳定币的示例包括\
  \ `USDC` 和 `MakerDAO`。\n\n### 安全代币\n\n安全代币与股票市场中交易的证券可比，但它们具有数字起源。安全代币与传统股票相似，通常承诺所有权形式的股权或向持有者支付股息。此类代币价格增值的可能性是投资者购买和持有这些币的主要吸引力。安全代币通常通过主要加密交易所的\
  \ `ICOs` 或首次代币发行提供给投资者。\n\n### 用例代币\n\n用例代币用于网络内提供和使用服务。例如，它们可能被用于兑换奖励或购买服务。用例代币与安全代币不同，不支付股息。用于购买云存储空间的\
  \ `Filecoin` 是用例代币的示例。\n\n### 加密货币采用代币 (CAT)\n\n`CAT` 发布于 2023 年，被引入为先进的加密教育、采用和意识代币，包括推广加密的广告活动。加入他们和其他传播加密货币的益处并帮助变革世界。此类代币将投资支持加密的政治家并通过资金支持监管措施。他们将建立游说公司，并为下一代提供战略性的加密教育和入驻。目标是向学校、图书馆、独立研讨会、工作坊在内的公众提供加密内容。\n\
  \n\n\n\n这并不意味着你应该完全避免购买代币。代币可以作为投资者投资组合的多元化来源，因为每个代币项目通常是彼此相互独立的。\n\n加密货币市场尚未成熟，目前没有定义的投资标准或指标来评估加密货币。代币市场主要由投机驱动。目前已经存在多个崩盘和失败的加密货币案例。\n\
  \n因此，代币市场适用于那些准备好忍受在未监管新兴市场中运营风险的投资者，这种市场极易出现高波动性和价格剧烈波动。\n\n## 展望\n\n代币在原始 `Bitcoin`\
  \ 的基础上进行了改进，旨在解决加密货币的缺点。代币，如 Ripple 的 `XRP` 和以太坊的 `ether`，已经在主流金融世界变得流行，导致这些代币获得了高估值。`SEC`\
  \ 已经起诉了其中某些代币，声称它们是证券，这使得很难用 `USD` 进行交易。腐败的金融系统不希望这些项目成功是有原因的。\n\n看看当前代币市场的状况，所有的代币很可能留下来。但预计加密货币市场列出的\
  \ 2000 多种代币中，大多数将无法生存。代币市场将围绕许多具有坚实实用性和用例的代币汇聚，并主导市场。\n\n代币是加密领域的投资者扩大其 `Bitcoin`\
  \ 之外视野的一种廉价方式。代币市场的上涨产生的回报是 `Bitcoin` 产生回报的数倍。但投资代币涉及重大的风险，例如缺乏监管和巨大的价格波动。在购买任何代币之前，请进行研究并制定稳健的风险管理策略。如果交易时机正确，可以预期在代币市场中获得数倍的回报。\n\
  \n## 代币的市值\n\n代币市场近年来蓬勃发展；从 2017 年至今，代币领域的总市值增长了 100 多倍。代币市场市值目前为 8,840 亿美元，高于 `Bitcoin`\
  \ 的 6650 亿美元。让我们看看代币领域中的一些领先者，它们占据了这一惊人市值的很大一部分。\n\n### 以太坊（2,210 亿美元）\n\n`Ethereum`\
  \ 是一种从原始 `Bitcoin` 获得灵感的加密货币。虽然 `Bitcoin` 主要作为数字货币形式的价值存储手段，但 `Ethereum` 背后的理念是将应用程序和服务去中心化，从简单的应用扩展到更复杂的金融协议。`Ethereum`\
  \ 使用与 `Bitcoin` 相同的技术，即区块链使用分布式、去中心化的公共账本来实现网络的去中心化，因此它不受任何单一实体的控制。\n\n`Ethereum`\
  \ 让你能够以很小的费用向任何人发送加密货币，并为每个人都可以使用的应用程序提供动力。`Ethereum` 自称为“世界上可编程的区块链”。它在 `Bitcoin`\
  \ 创新的基础上进行构建，但也有一些重大区别。\n\n虽然 `Ethereum` 和 `Bitcoin` 都允许你在没有支付提供商或银行的情况下使用数字货币，但\
  \ `Ethereum` 具有可编程的额外优势，因此你还可以将其用于许多不同的用例和业务模型。这意味着 `Ethereum` 的应用可以超出在网络上履行支付的功能。它可以成为金融服务、游戏和应用的市场，且这些应用无法审查或窃取你的数据。`Ethereum`\
  \ 由 `Vitalik Butarin`、`Martin Wood` 和其他成员于 2013 年构思，并在几年后的 2015 年发布。通过 `Ethereum`\
  \ 项目，他们希望解决 `Bitcoin` 中存在的不同局限性，并允许在 `Blockchain` 中执行短程序。`Vitalik` 和团队其他成员寻求更好的方法来构建在\
  \ `Blockchain` 上运行应用程序的去中心化金融系统。\n\n`Ethereum` 可编程方面的的核心是智能合约和 `dApps`（去中心化应用）。`Smart\
  \ Contract`（智能合约）是一种可以在 `Blockchain` 上部署和运行的短程序。它通过执行代码处理发送给它的交易，并可以在区块链账本上持有资金（`Ether`）。这些交易可以同时传递资金和数据。\n\
  \n智能合约可以被用来执行各种功能，而无需信任的第三方或中央权威。如果你将 `Smart Contracts` 视为运行在 `Blockchain` 中的后端代码，那么\
  \ `Decentralized Applications`（去中心化应用）就是前端或 UI。它们代表了连接用户或其他应用程序与运行在 `Blockchain`\
  \ 中的 `Smart Contracts` 的可见层。最终，在 `ether` 经济体中可能会存在整个去中心化自治组织。\n\n截至 2021 年 8 月，`Ethereum`\
  \ 的交易价格为 2,913 美元，2023 年 6 月为 1,913 美元。就在几年前，它的交易价格为 390 美元；市场价格增长了五倍多。\n\n随着 `Ethereum`\
  \ 涨势加速，加密行业的许多人预测 `Ethereum` 可能超越 `Bitcoin` 成为世界价值最大的加密货币。随着其 `Blockchain` 的最新更新，`Ethereum`\
  \ 正在回到加密货币牛市，新的历史高触手可及。价格推动将 `ether` 代币推向 2,000 美元，导致加密货币总市值升至近 1.7 万亿美元。\n\n###\
  \ Tether（830 亿美元）\n\n`Tether` 或 `USDT` 是一种与 `US dollar` 1:1 挂钩的加密货币。`Tether` 目前是世界上最流行的挂钩\
  \ `USD`加密货币。根据其开发者介绍，`USDT` 的设计价值为 1 个 `USD`，美元将按 1:1 的比例支持其发行流通的每一个 `tether` 单位。然而，`USDT`\
  \ 的价格可能会波动，它在 2018 年曾以低于 `USD` 10% 的折扣进行交易。\n\n\n\n\n币安的市值超过 560 亿美元，按市值在加密货币中位列前茅。币安的故事始于首次代币发行（ICO），现已成为全球交易量和网页流量份额最大的加密货币交易所之一。\n\
  \n## Cardano (120 亿美元)\n\n查尔斯·霍斯金森（Charles Hoskinson）在 2017 年创立了 Cardano，这是在他帮助开发以太坊区块链技术两年后。他还共同创立了\
  \ Internet Online Hong Kong (IOHK)，即构建 Cardano 区块链的公司。\n\nCardano 使用一种名为证明立场（`PoS`）的时间戳方法。`PoS`\
  \ 是 Cardano 生态系统中矿工验证并可能区块交易的系统。质押简单是指一个人持有的币数量（`ADA` 代币），这同时也决定了一个参与创建新区块的能力。\n\
  \n利用从开发以太坊项目中获得的知识，霍斯金森将智能合约引入了 Cardano 项目。Cardano 在加密领域脱颖而出，在于它是通过同行评审的研究构思的。这些研究产生了独特的特性，如无与伦比的平台安全性、系统可持续性以及健壮的专业开发社区。\n\
  \n根据该项目的网站，IOHK 创建 Cardano 区块链是为了通过利用一种包容性和开源技术的新标准来“恢复全球系统的信任”。因此，“变革者、创新者和远见卓者”可以利用这项技术创造一个“更安全、更透明、更公平”的社会。\n\
  \n`ADA` 是促进 Cardano 网络参与者之间进行交易的数字货币。`ADA` 按市值位列前十大代币。。它允许在去中心化、安全且无中介的环境中进行点对点交易。正因如此，Cardano\
  \ 区块链上的交易既快速又廉价。\n\nCardano 的加密货币声称比法币具有合法优势。Cardano 基金将 `ADA` 的总供应量限制在 450 亿币。这一理念是为了避免通货膨胀并控制币值。在点对点交易的交易速度方面，`ADA`\
  \ 远优于法币。法币需要银行等中介来执行信任，导致交易链沿出现瓶颈。\n\n## XRP (300 亿美元)\n\nRipple 是一种等同于数字现金的加密货币令牌，专为支付网络和银行定制。`XRP`\
  \ 或 Ripple 是其名为 `RippleNet` 的区块链上的原生令牌。`RippleNet` 是一个由 Ripple Labs 运行并构建在去中心化开源区块链技术\
  \ `XRP Ledger`（Ripple 账本）上的支付系统。它以惊人的交易速度而自豪，平均交易结算速度为四秒。相比之下，比特币网络上的交易结算时间为 3600\
  \ 秒。\n\nRipple 产生直接影响的领域之一是跨境支付。开发者创建 `RippleNet`是为了简化交易。消费者和企业在用法币进行交易时，往往会遭受货币转换带来的不便以及由于汇率差异而产生的损失。`RippleNet`\
  \ 使用 `XRP` 代币作为中介来简化法币兑换，而不会遭受滑点损失。\n\n此外，数字货币促进了以传统支付领域未见的速度进行更快速的结算。由于使用了点对点交易系统，用户可以享受到微小费用服务，平均费用低于\
  \ $0.0003403。传统支付领域的 `RippleNet` 竞争对手（如 `VISA`）等等交易的费用高出数千倍。\n\nRipple 的力量源自区块链技术。大多数区块链平台通过工作量证明（`PoW`）或证明立场（`PoS`）机制获得共识。`PoW`\
  \ 系统较慢且消耗更多能量，而 `PoS` 系统则支持更快的交易验证和批准，同时消耗能量更少。\n\n然而，像 `XRP Ledger` 这样的区块链平台使用了另一种共识形式，在这种情况下被称为\
  \ Ripple 协议共识算法（`RPCA`）。共识是区块链网络中的节点之间保持一致和正确的机制。`RPCA` 运行在组成全球 XRP 社区的 150 多节点上。\n\
  \n健壮的共识系统是 Ripple 七年稳定的重要原因，它使其开发者能够扩展生态系统的产品范围。例如，开发者已经扩展了 `RippleNet` 的能力，为其企业客户提供按需流动性。这使得全球支付变得更快、更廉。。\n\
  \n# 有前景的代币\n\n某些代币具有主导未来市场的巨大潜力。我们现在来看这些市值多年来逐渐增加的代币。\n\n## 基础注意力令牌 (BAT)\n\n基础注意力令牌（`BAT`）是构建在以太坊区块链上的实用型令牌，它是\
  \ Brave Web 浏览平台的基金。Brave 浏览器允许用户匿名且完全无广告地浏览互联网，然后允许用户选择观看广告以换 `BAT` 代币。\n\n当用户在他们的网站上观看或点击广告时，发行商也会获得\
  \ `BAT`。广告商受益于更低的广告开销和更高的用户参与度。而用户在不牺牲定制化广告益处的情况下增加了隐私性，并可以获得 `BAT` 代币。`BAT` 代币设计用于在用户、广告商和发行商之间进行交换。它基于用户注意的概念，这对于在数字时代运营的广告公司至关重要。`BAT`\
  \ 是一个 `ERC-20` 代币，由经过严格测试的工作量证明共识算法保护，并受到广泛的以太坊矿工网络的支持。该算法确保了只有有效交易会被确认，而以太坊挖矿网络的联合工作确保了\
  \ `BAT` 交易一旦被批准就是不可逆转的。\n\n`BAT` 的开发者寻求改进数字空间中进行广告的方式。他们认为当前的系统对用户、发行商和广告商都是不利的。用户被无情地用广告和跟踪器针对，并受到日益具有侵略性和力量的恶意软件攻击。\n\
  \n随着 Google 和 Facebook 等垄断平台压低信息价格并从广告收入中抽取大量抽成，传统发行商的广告收入大幅下降。此外，机器人和恶意软件每年造成越来越多的损害，平台也遭受了信誉问题。此外，广告商需要更准确的定位方法和信息来交付内容，因为平台垄断了这些功能。\n\
  \n`BAT` 创建者相信，跟踪用户与数字广告内容的互动并将这些信息存储在分布式区块链账中，将增强并改进广告商、发行商和用户的广告体验。用户将体验更少的广告和更合身的内容，而发行商将找到新的收入来源。广告商将能够根据用户的内容偏好和兴趣目标地针对特定用户。他们还可以更有效地避免欺诈。\n\
  \n基础注意力令牌的最大总供应量上限为 15 亿币。目前这些供应几乎都在流通中。因此，基础注意力令牌可以被认为已完全流通。\n\n在 2017 年的 ICO 中，10\
  \ 亿 `BAT` 代币卖给了投资者，剩余的 2 亿币锁定在开发池中，3 亿 `BAT` 预留给用户增长池（`UGP`）。截至 2020 年 11 月，开发池和\
  \ `UGP` 池的地址几乎清空。基础注意力令牌可以在每个中心化加密货币交易所买卖，并具有良好的流动性。\n\n\n\n\n\n# Chainlink (LINK)\n\
  \nChainlink (LINK) 是一种加密货币区块链网络，为现实世界数据与智能合约之间提供连接。该平台帮助执行智能合约，智能合约是在满足必要的先决条件后自动完成执行的区块链协议。它提供了一种名为\
  \ `LINK` 的可交易加密货币代币，用于支付 Chainlink 网络上的创新合约交易。与法币相比，`LINK` 代币也保持着其自身的价值。\n\nChainlink\
  \ 由其创始人 Sergey Nazarov 于 2014 年创立，并于 2017 年推出。Nazarov 是一位 32 岁的企业家，在加密货币市场具有重要影响力。最初，Chainlink\
  \ 网络被设计为一个中心化的预言机系统，可以验证传入的信息。然而，从那以后，它转变为去中心化的预言机网络，与智能合约配合，使用外部数据源和 API 确保交易安全。\n\
  \nChainlink 帮助弥合发送现实世界数据的预言机与区块链上智能合约之间的差距。Chainlink 可以生成多个子合约，同时仅从最可信的节点和预言机获取数据，以最大地提高准确性。尽管该平台处理的智能合约数量没有限制，但\
  \ `LINK` 代币的总量上限为 10 亿。Chainlink 网络是一个相当开放的系统。任何人都可以加入它，为网络提供数据或帮助运行其相应的节点和预言机。这些操作者通过\
  \ `LINK` 代币获得报，`LINK` 是 Chainlink 网络的原生货币。\n\n随着区块链技术的日益普及，像 Chainlink 这样的网络可以补充创新合约实现，作为以太坊等主流区块链的替代方案。\n\
  \n# Polkadot (DOT)\n\nPolkadot (DOT) 是一个旨在“将所有与其他网络连接起来”的网络。与比特币等独立运行的网络不同，Polkadot\
  \ 可以连接多个网络。\n\n它的最终目标是为所有选择使用其技术的区块链充当一个标准的集成框架。其理念是处理复杂且高昂的加密货币挖矿过程（这些过程包括交易验证和安全协议），并让开发者能够完全专注于创建高效的\
  \ dApps 和智能合约功能。以太坊的联合创始人 Gavin Wood 构建了 Polkadot。\n\n构建创新型去中心化系统的开发者必须从底层开始设计这些系统，包括区块链。这意味着时间、人才和资源被分散到构建竞争性网络中，而不是创建一个所有人都能在其基础上构建的标准。这正是\
  \ Polkadot 的目标，让开发者能够在所有区块链之上构建价值，而不仅仅是某一个。\n\n区块链可以与 Polkadot 连接并以“平行链”（Para chains）的形式并行工作，以访问网络的权益证明验证系统来处理交易和安全。在网络的“中继链”（relay\
  \ chain）中，交易地址会经过检查，数据会进行标准化，以便每个参与的系统都能理解它。\n\n在功能得到保障的前提下，连接到 Polkadot 的区块链可以使用其\
  \ PoS 机制来决定何时以及如何更新代码，并运行它们偏好的 dApps 或代币。Polkadot 是一个可供选择的层，允许网络在保持其安全性完整的同时整合新协议。基于区块链的系统必须解决的两个根本问题是可扩展性——网络每秒可以处理的交易数量——以及治理：系统如何管理协议升级和更改。Polkadot\
  \ 的目标是高效地解决这两个问题。\n\n`DOT` 是 Polkadot 网络的原生代币，允许持有者对潜在的代码更改进行投票，如果达成共识，这些更改将在整个网络自动升级。Polkadot\
  \ 于 2020 年初推出主网，并迅速在投资者、开发者和加密货币交易者中获得了关注。\n\n在不到一年的时间内，它已经获得了多项令人瞩目的荣誉和进展，包括攀升成为第四大加密货币，并实现了近\
  \ 180 亿美元的峰值市值。\n\n正在进行重命名，这一过程将旧的 `DOT` 代币拆分 100 倍以产生新的 `DOT` 代币——将供应从 1000 万增加到\
  \ 10 亿，并看到开发者活动剧增，现在有超过 350 个项目在平台上积极开发中。\n\n随着区块链技术渗透传统的业务模式和用例，我们可以预计更多开发者加入智能合约和\
  \ dApps 领域；这种 Polkadot 所提的框架在这种情况下将至关重要。\n\n\n\n\n\n这些服务的运行通过区块链技术实现。区块链是一种不可篡的账本，能够以简单的形式成功存储、追踪和记录交易。这种系统通过嵌入区块链的智能合约，使得寻求者和接收者之间的金融服务交换过程更加顺畅。智能合约是两个或多个双方之间的数字协议，双方对条款达成一致并随后签署。一个设计良好的智能合约在信息方面能够保证安全性。由于合同存在于区块链上，恶意目的访问已签署合同的风险可以降低，从而增强了保险的安全性。\n\
  \n# DeFi 是如何工作的？\n\nDeFi 使用加密货币和智能合约，消除了对经纪人或其他中介干预的需求。要理解 DeFi 的运行，首先需要理解 DeFi\
  \ 的核心组成。\n\n## DeFi 的组成\n\n在理解 DeFi 的功能和特点之前，理解构成 DeFi 的组件至关重要。由于 DeFi 是一个金融生态系统的前提，它的运行方式与其他经济生态系统类似是完全合理的。因此，DeFi\
  \ 组件的宽泛分类包括：\n\n### 稳定币 (Stablecoins)\n\n此外， DeFi 上的每项金融服务交换都使用了智能合约。智能合约是 DeFi\
  \ 运行的核心，因为它们确保了条款并记录了交易活动，以确保了约定的条款。现在，让我们在软件栈的范围内理解 DeFi 系统的组件。\n\n软件栈的特点是多个层级的整合。这些不同层反又具有明确特定功能的组件，以开发\
  \ DeFi 系统的需求。这四层包括：\n\n## DeFi 软件系统栈是\n\n结算层 (Settlement Layer) 是构成 DeFi 软件系统的四层中的第一层。它可以被理解为为\
  \ DeFi 交易提供平台的底层。结算层至关重要，因为它是 DeFi 金融生态系统的锚。公共区块链和加密货币是其运行的基本组成部分。例如，`Bitcoin` 和\
  \ `Ethereum` 是结算层的典型代表。\n\n**区块链协议 (Blockchain Protocol)**：这些协议是确保系统可靠运行所需的必要规则和法规。遵守这些规则允许该行业的运营者不受阻地工作。这一层确保了资产在\
  \ DeFi 生态系统中转换为现金，提供了流动性。\n\n**应用层 (Application Layer)**：这一层简化了上述协议以确保接口服务，使系统及其服务对消费者可用。例如，这一层允许借贷服务在此处传播。虽然各个层级有不同的分类，但上述这些层经过压缩，以确保读者的理解并避免歧义。\n\
  \n在理解了 DeFi 生态的核心组件后，让我们了解这些系统的实际工作流程。由于 DeFi 仅在区块链网络上运行，因此其工作流程与区块链非常相似。DeFi 区块链通过向用户发放加密密钥来确保金融服务和交易的安全。这些密钥使用户能够接收一个他们才能访问的唯一标识符。该系统有两个基本密钥——`private\
  \ keys`（私钥）和 `public keys`。\n\n这对密钥对应不同的功能。例如，`Public key`（公钥）被感兴趣的服务寻求者或同伴用于寻找系统的所有者。所有者可以使用\
  \ `private key`（私钥）访问并授权涉及其资金的任何金融活动或交易。`private key` 至关重要，因为它作为所有者的数字钱包，用户可以通过它交换加密货币。只有所有者才能通过\
  \ `private key` 授权交易来启动交易。一旦交易请求被所有相关的参与方验证，交易就会开始执行。值得提的是，每笔交易都带有一个唯一 ID，以维持高水平的安全标准并防止平台上的任何违规行为。在了解了\
  \ DeFi 的运行机制后，让我们来看看该系统的特点。\n\n## DeFi 的主要特性\n\nDeFi 的核心特征也与这种在全球范围内传播金融服务的去中心化方法所提供的利益相一致。这些特征大部分都得到了\
  \ DeFi 服务区块链网络的支持。从系统的去中心化和许可性质等定义特征，到透明度提高、不可篡改性等相关性质，DeFi 构成了许多特性。其中一些主要特性列举如下：\n\
  \n## 去中心化的前提\n\nDeFi 的首要特性，正如其组成词汇所示，是 `Decentralization`（去中心化）。正如前几节所示，`Decentralization`\
  \ 意味着没有中心化机构或中介来增加基础金融服务流程的繁琐和复杂。在缺乏此类中介的情况下，此类金融服务的寻求者可以在不受任何对其限制的情况下访问这些服务。这一特性在下一部分进行了详细阐述，它是无许可的\
  \ (permissionless)，且与 `Decentralization` 密切相关。\n\n## DeFi 系统的无许可性质\n\n“去中心化金融”定义了这一特性，包含“去中心化”一词表明其旗舰特性是\
  \ `permissionless`（无许可的）。金融服务的去中心化允许寻求者和接收者在一个不需要像银行等外部中心化机构监督的平台上进行交互。它还减少了在寻求\
  \ DeFi 平台轻松访问的金融服务时对银行和其他中介的依赖。这一特性赋予了 DeFi 系统独立且友好的优势。因此，任何个人都可以通过最少的 `crypto wallet`（加密钱包）要求和当然的互联网连接访问这些服务。例如，`Ethereum`\
  \ 其基础是无许可区块链，这协助了该平台的普及。今天，`Ethereum` 领导着 DeFi 行业。\n\nDeFi 运行的无许可性质可能会引发对安全的怀疑。DeFi\
  \ 系统运营活动的安全性由智能合约提供补充，智能合约确保金融服务的条款和条件得到满足，从而确保了资金的安全。此外，所有的交易活动都存储在区块链本身。\n\n##\
  \ 高水平的透明度\n\n与 `Decentralization` 可能会降低透明度的普遍观念相反，`Decentralization` 在很大程度上提供了开放性。由于分布式账本涵盖了区块链网络上的所有交易活动，它为坚定的清晰度提供了空间。透明度延伸到金融数据和活动，并适用于智能合约。在智能合约的情况下，透明度扩大了任何人对其代码进行审查的内容。它确保了每个人都能获得信息。\n\
  \n\n\n\n因此，任何个人都可以根据对所关注智能合约的审查，做出明智的决策以利用其提供的金融服务。此外，DeFi 系统的透明性背景也得到了适用于区块链的基础加密规则的支持，这些规则确保了信息只有在经过适当的验证和认证程序后才会被添加。`Ethereum`\
  \ 平台上存在的 DeFi 协议要求代码开源以供用户审查。在公共 `Ethereum` 链的情况下，信息会广播给所有用户，从而增强了透明性的前提。\n\n# 不可变性\n\
  \nDeFi 提供的显著优势之一是由于减少了恶意数据篡改的可能性，实现了金融数据的**不可变性**。区块链网络上的数据存储使得记录极其安全，减少了账目发生未经授权更改的情况。这反过来降低了欺诈行为在该金融系统中盛行的可能性。此外，由于智能合约的活动对所有相关方透明，区块链上的智能合约使得单方无法更改条款和条件。DeFi\
  \ 的这一独特特征确保了金融服务交换提供了一个高度安全空间和对话环境。\n\n# 可访问性\n\n如前节所述，任何人只需具备加密钱包和互联网连接这两个最低前提条件即可使用\
  \ DeFi 金融系统。这使得全球用户都能享受到 DeFi 带来的优势。虽然此类账本在本质上是无许可的，但可能会产生许多问题，例如欺诈活动的泛滥或破坏者干扰 DeFi\
  \ 构建的金融生态系统。由于如此，DeFi 平台上的服务寻求者和提供者通过检查了解客户（`KYC`）要求，有时以及反洗钱（`AML`）来验证对方是必要的。由于防止不当行为的相关策略，可访问性仍然倾向于其赋予的利益。\n\
  \n# 灵活性与自主性\n\nDeFi 系统的无许可特性为用户提供了不受限制的灵活性和自主性。再次，这是因为没有监管机构来阻碍 DeFi 系统及其范围进展和进化。用户不需要遵守外部权威强加的一系列定义的规则条例。例如，在智能合约的情况下，软件提供的灵活性导致了自主性。一旦相关方在达成一致的基础上进入智能合约，智能合约就是自功能的，除了参与方需要遵守规定的条款外，不需要他们提供任何要求。因此，他们可以在不需要外部权威的情况下执行业务，增强了自主性。\n\
  \n现在我们已经知道了 DeFi 系统的特征，让我们将该系统与传统金融方法进行比较，并评估哪种系统具有更显著的优势。\n\n# DeFi 与传统金融系统的比较\n\
  \n传统金融系统包括由中心化权威管理的传统银行和其他金融机构，因此通常与中心化金融（`CeFi`）交替使用。作为 `CeFi` 一部分的中心化交易所危及用户资金、数据安全和隐私，因为这些中心化权威同时管理这两者。然而，这些中心化交易所允许保证金交易、借贷、贷款等各种金融服务。此外，`CeFi`\
  \ 有效地提供了跨链服务，与 DeFi 形成鲜明对比。`CeFi` 考虑多个链以获得资金的完全控制，在此之后才允许交易币。此外，它们具有所有权转移的特征，这加强了其跨链服务方面的简单性。此外，`CeFi`\
  \ 系统在处理法币方面也提供了灵活性。尽管 `CeFi` 或传统金融方法具有优势，但由于其许多优点，DeFi 系统正在金融世界获得主流认可。\n\n## 服务监管机制\n\
  \n传统金融系统的本质是存在中心权威。传统的经济系统或 `CeFi` 运行在一个伞形权威的保护下运行，该权威列出了构成它的不同组成部分的规则和条例。在 DeFi\
  \ 中，如前几节所述，智能合约负责金融服务的绝对管理和监管。这些智能合约公开可供任何用户进行审计。在 `CeFi` 的情况下，没有这种合约审计机制，因为金融服务的运行需要公开以供更多数量的人员审查。批评者可能会据此进行反驳，认为公开智能合约的存在可能会损害相关方的隐私。在这种背景下，DeFi\
  \ 确保了智能合约的公开展示是伪匿的，这意味着相关方的身份和初步信息并不包含在内。\n\n此外，在作为传播金融服务平台的金融机构的情况下，金融服务的完成由于许多具有不同分配职责的人员参与而延迟。这种繁琐且复杂的过程往往驱使金融服务的寻求者离开。在\
  \ DeFi 中，智能合约确保了服务在几乎或完全没有人工干预的情况下具有稳健性。\n\n## 无许可\n\n`CeFi` 和 DeFi 在处理金融服务所需的权限方面也不同。正如\
  \ DeFi 特性所述，DeFi 的无许可性质有助于经济活动在不费太大精力的情况下进行。用户可以将现有钱包连接到他们的 DeFi 服务平台并参与所需的金融服务。然而，在\
  \ `CeFi` 情况下，由于获得服务需要 `KYC` 要求，过程变得相对较长。\n\n## 运行空间\n\n传统金融系统与 DeFi 之间的另一个基本区别是运行平台。大多数传统经济系统需要物理空间来确保正常运行。它还需要劳动力和服务来在物理区域内继续提供其服务，因此需要花费大量资金来激励人类工作。而\
  \ DeFi 基于分布式账本技术（`DLT`）并并在区块链网络上有效运行。一方面，DeFi 的整个运行采用技术和先进软件栈，消除了对物理空间正式设置的需求；另一方面，它减少了对劳动力的需求。\n\
  \n## 货币\n\nDeFi 和 `CeFi` 在特征性资产及其性质方面也存在对比。例如，正如我们所知的，DeFi 使用加密货币，因为在这种情况下所有交易发生在数字空间中的区块链网络上。然而，`CeFi`\
  \ 必然使用法币。因此，交易使用硬币、纸币等。\n\n## 资金与资产的托管\n\n\n\n\nDeFi 用户对其资金拥有绝对的托管权，并可以选择何时进行交易、与谁进行交易以及交易金额。然而，传统的金融系统并不对资金和资产提供这种控制权。在这些系统中，个人必须将资金让交给中央机构。例如，银行就证实了这一前提。资金并非由其所有者控制，实际上处于顶级中央银行的权力之下，然后是其次的商业银行。\n\
  \n## 创新性与互操作性\n\nDeFi 的另一个特征是其创新性，它能够适应用户不断演变的预期标准。这些系统的创新性也通过下一节概述的用例得到了证实。由于以创新为核心，这些系统正在进入许多行业。然而，由于中心化的方法，传统金融生态系统只能提供快速的创新和适应。由于权威的集中化，任何创建提案都必须通过这些机构层级结构中不同层级的众多执行人员。这种严密的层级结构确保了中央机构能够做出深思熟虑的决策。虽然这种严格的多重检查方法使得提案相对防范，但往往会导致提案的延迟或完全被拒绝。由于不断演变的趋势，这种时间差可能会导致提案过时。\n\
  \n## 可访问性与范围\n\nDeFi 作为一种数字金融系统，对于全球所有具备稳定互联网连接和加密钱包基本要求的个人来说都是可用且可访问的。位于不同大陆的远人们之间的交易也可以成功发生。这些平台\
  \ 24/7 全天运行。同时，传统的融资系统受到时空限制。由于运行大多数金融活动对物理空间有要求，这些经济系统需要追上 DeFi 提供的演进系统。此外，由于启动大多数金融服务、活动和交易需要人力劳动力，这些系统在数字化方面需要更具实用性。\n\
  \nDeFi 系统与传统金融系统形成了鲜明对比。在金融世界，DeFi 比传统经济系统拥有更多优势。DeFi 系统的实用性呈指数级增长，越来越多的行业试图寻找 DeFi\
  \ 及其应用之间的交汇点，以补充它们的功能。虽然 DeFi 系统在当前的数字化趋势下显着繁荣，但它们仍有很长的路要走。尽管技术以前所未有的速度扩散，互联网服务的访问性提高，但世界上只有\
  \ 65% 的人口可以使用互联网，这使得他们无法享受这些系统提供的利益。因此，他们继续在传统经济方法的伞下向中间机构寻求金融服务。\n\n可靠信息的缺乏加剧了个人对\
  \ DeFi 平台运作的误解。他们通过放大和过度强调风险，将数字金融服务错误地归类为骗局。虽然警告用户其在金融世界的数字旅程中可能遭遇的危险至关重要，但让他们意识到与风险相应的缓解和管理性相关策略也同样关重要。此外，后文章节中讨论了\
  \ DeFi 系统的许多缺点，这损害了这些平台的声誉和信任度。因此，即使是访问 DeFi 服务的个人也克制于尝试这些平台。他们转而转向传统的金融服务系统以获得经济利益。\n\
  \n## DeFi 的用例\n\nDeFi 以其在金融操作中的高效、韧性、不可变性和透明度席卷全球。它为其全球用户群带来了许多经济机会。由于 DeFi 提供的众多优势，其应用范围已经在扩大。预计随着系统的完善和技术的进步，其应用范围将进一步扩大。DeFi\
  \ 正在使数字金融服务与最初未与这些系统产生交汇点的行业相整合。它适用于传统的金融服务，如借贷、贷款、交易、市场平台等。这些经济系统已在各个领域找到应用，从提高传统金融活动的效率到在未开发的行业中引入\
  \ DeFi。该系统的用例已以以前所未有的速度增长，预计将遵循上升趋势线。下面列出了一些突出的用例。\n\n### 借贷与贷款\n\n随着 DeFi 对金融和交易系统影响增加，传统金融系统中的漏洞对用户来说变得愈发明显。传统金融市场通过其支付给贷款人的利息和向借款人收取的利息产生大量收入。这种系统往往由于贷款资格要求的僵硬（包括可靠的抵押品和高额利息）而阻碍借款人接触这些市场。由\
  \ DeFi 支撑的数字账本技术为需要贷款但因要求僵硬而无法获得的借款人开启了机会。随着 `smart contracts` 的实施，贷款/借贷以及维护 `smart\
  \ contracts` 中列出的条款使得双向借贷过程变得顺畅。构建 DeFi 的动态支持点对点借贷。这一用例正以有关此主题的 DeFi 项目增加的形式得到广泛应用。\n\
  \n例如，`Compound` 是一个 DeFi 协议，它脱颖而出因为它具有自主的利率基础。`Compound` 欢迎贷款者在各种加密货币上赚取利。它向贷款者提供代币，然后按照算法决定的自主利率将代币引向借款者。`compound`\
  \ 是高效的，因为 `intelligent contract` 识别出具有共同利益的贷款者和借款者，并根据讨论中的借入和贷款资产比例设定利率。此类项目的另一个显著例子是“Pool\
  \ Together”，它在借贷和贷款方面使用类似的机制。\n\n### 代币化\n\nDeFi 系统的重要用例之一是在代币化背景下。代币化是指在区块链网络上策展、发行、监管和传输数字资产。代币化具有高度相关，因为任何形式的投资都可以转换为代币并存储在区块链上。`Ethereum`\
  \ 区块链成功利用了代币化，并为世界提供了基于 `Ethereum` 的代币这种安全且方便的交易方式。在使用代币所带来的许多优势中，主要优势体现在这些代币的碎片化属性及其可选的自定义方案。因此，由于其数字替代方案和补充贸易的效能，代币化是蓬勃\
  \ DeFi 生态系统的核心特征之一。\n\n## 稳定币的效能\n\n\n\n\n加密货币的显著缺点之一是加密生态系统中广泛存在的剧烈波动性。这种价值频繁上升和下降的价格波动导致了加密货币可靠性的降低。在这种背景下，稳定币扮演了救救者的角色。稳定币可以被理解为一种特殊的加密货币，因为它与一种或一组加密货币挂钩。这些资产可以是从法币到黄金，甚至是任何其他种类的加密货币。它们通过收购进行整合，提供了与加密市场波动形成的稳定性。它们还作为一种可靠的支付方式，为区块链提供了更大的信誉。稳定币现在被用于\
  \ `DeFi` 生态系统中的借贷、贷款等。\n\n# 资产管理流程\n\nDeFi 允许用户对其资产拥有更大的控制权。由于没有中心机构进行监管，去中心化帮助用户获得对资产的绝对控制。它使用户能够根据自己的意愿管理资产。这包括购买、出售、借贷或转移数字资产。通过消除中间环节，用户可以以任何他们认为完美的方式访问并管理自己的资产。例如，在许多\
  \ DeFi 项目中，包括 `Gnosis Safe`，`Argent` 促进用户对信息的完全控制，并确保只有用户本人可以安全地存储数据。\n\n# 在保险业的应用\n\
  \nDeFi 的另一个主要用例是在保险业。DeFi 正在通过消除传统保险处理系统带来的巨大局限性来彻底改变保险业。这些规则包括难以想象的文件工作、缺陷的理赔处理流程、耗时等。保险业还因为虚假理赔的欺诈行为而遭受损失。区块链的去中心化技术可以验证提交的文件、所有权、保单注册详情以及理赔的真实性。随着智能合约的使用，保险产生的财务交换过程对于寻求者和保险公司都变得更容易。\n\
  \n# KYT 机制支持的支持\n\n了解客户 (`KYC`) 协议主要引导反恐融资和反洗钱 (`AML`) 的合规性。然而，KYC 协议往往干扰 DeFi 的隐私前提。它在某个阶段也涉及到外部权威，这违背了\
  \ DeFi 的去中心化特性。因此，DeFi 引入了相对进化且更好的了解交易 (`KYT`) 机制。这种机制为关注点从用户身份转向数字地址和用户的交易行为奠定了基础。这种机制评估交易的实时行为并维护用户的隐私。这种机制有助于评估系统中扩散的风险或危机，早期发现可以对抗最终的大规模欺诈和巨额资金外流。\n\
  \n# 去中心化交易所\n\n去中心化交易所（缩写为 `DEXs`）指的是点对点（P2P）发生的加密货币交易，不涉及任何中心机构，从而支持 DeFi 的基本假设。此类交易所中的资产对任何外部交易所平台是非托管的。它允许用户进行交互、交易并保持对资产的控制。其显著优势在于降低风险。由于资产不受任何外部机构或平台的直接监督，减少了黑客攻击、欺诈和价格操纵的可能性。目前，许多\
  \ DEX 被用于用户友好且易于访问的 DeFi 空间。最流行的有 `Liquality`、`AirSwap`、`Mesa` 等。\n\n# 增强的数字身份\n\
  \n基于区块链的数字身份系统正作为可行且高效的身份系统受到关注。当与 DeFi 协议结合时，这些身份系统在需要获得金融服务时的即时处理效率可以得到提升。这些系统还在改变信誉的指标。根据传统金融系统，验证金融服务寻求者信誉的手段曾是他们的资产（拥有的房屋）和收入水平。然而，由\
  \ DeFi 和区块链协议加强的数字身份通过寻求者的交易行为、财务活动、在线声誉或任何被认为实际且必要的属性对其进行验证。这有助于金融服务寻求者克服抵押化的障碍，并根据他们关注的指标接收所需的服务。\n\
  \n# 风险缓解与管理\n\nDeFi 的核心特性突显了透明度和去中心化，这反过来又对于缓解各自平台产生的风险至关重要。这是通过用户对他们提供的数据库进行详尽的数据分析的。在进行数据分析并充分了解相关及预测的风险后，用户可以根据自己的意愿做出决策。这种全面的框架帮助用户了解风险以及缓解风险的方法。它还让用户了解市场上出现的金融机会。DeFi\
  \ 的兴起带来了 `DeFi Pulse` 和 `CoDeFi Data` 等工具，这些工具涉及上述提到的过程。\n\n# DeFi 与预测市场\n\n尽管对预测和赌博的伦理存在批判性观点，但它们吸引了许多人。预测市场允许用户对尚未发生的事件结果下注或投票赞成或反对。预测性用例范围内的事件包括对体育赛事和选举结果的预测等。预测市场的功能仅在功能上与传统的预测需求共鸣。\n\
  \n区块链与这些市场的结合消除了对中间环节的需求。DeFi 预测市场列表的前列有许多竞争者——例如 `Augur`、`Gnosis`、`Polymarket`、`Predictit`、`FTX`\
  \ 等。`Augur` 已成为列表上最强大的竞争者。该平台专门从事预测并允许用户对政治或经济事件下注。 DeFi 支持的预测市场在 2020 年美国大选期间备受关注，是因为参与预测结果的人数以及下注金额巨大。据报道，`Augur`\
  \ 在这些选举期间记录了约 800 万美元金额。\n\n# 游戏与 DeFi：无损游戏的奇\n\nDeFi 的一个基本特性是系统提供的可组合性。这种可组合性激励了产品开发者将\
  \ DeFi 协议设计到平台本身。最新的视频游戏提供了应用内购买选项，这引导用户使用实时货币购买角色、元素或游戏的其他方面。游戏领域的开发者正通过激励玩家，将他们的领域与\
  \ DeFi 系统整合。\n\n策划奖励模型通常这样做是为了针对使用 DeFi 代币的用户的快感点。例如，`PoolTogether` 是一个基于无损假设的游戏。用户被指示提交\
  \ `DAI` 稳定币以购买数字票。这些稳定币被聚在一起并储存到月底。每个月底，这笔资金会再次出现，奖励给获得利利的玩家，并将存款的金额退还给所有玩家。\n\n\
  # 合成资产的交换\n\n\n\n\n合成资产可以理解为代币化的衍生品，它们在价值和功能上与另一种资产相似，但与该资产之间没有实际的物理关系。这些加密资产代表了法币、黄金等其他类型的资产。这些合成资产可以很容易在具有预设规则、法规和协议的智能合约中，作为代币的抵押品使用。通过一个允许用户策划和交易定制化合成资产版本的平台示例，可以补充对合成资产的理解。Synthetix\
  \ 平台允许交易黄金、法币、大宗商品等各种资产的合成版本。\n\n# 高效交易实践\n\nDeFi 生态系统包含许多交易活动，从交换合成资产到交换代币和保证金交易。DeFi\
  \ 为交易行业带来的优势是减少了启动交易时对经纪人的依赖。加密货币交易者也青睐去化交易所（DEXs）的优势，因为其手续费较低、交易快速，且资产由所有者绝对。\n\
  \n## 基于区块链的在线市场\n\nDeFi 为连接感兴趣的买卖双方提供了数字空间，使得市场在此得以蓬勃。这些市场的范围和规模也在不断扩大。这些数字市场消除了对中介和经纪人的需求。这使得许多商品销售者无需在\
  \ Amazon 等零售经纪商平台上列出，即可接入 DeFi 平台的全球用户群。在线市场的很大一部分由 DeFi 协议支持，通过点对点交易实现产品和服务交换。如上所述，由于对应\
  \ DeFi 的技术的进步，这些市场的范围正在扩大。这也可以归于 DeFi 应用的增加及其优势的体现。这些应用涵盖了从服装等既有零售产品到像自由职业兼职平台这样的新业务模式。例如，`Freelancer`\
  \ 和 `Upwork` 等自由职业兼职中心正面临来自构建在区块链上的 `Anytask` 等平台的竞争。`Anytask` 这一区块链平台带来的优势在于，与\
  \ `Freelancer` 和 `Upwork` 不同，它不会为在其论坛上获取任务的服务销售者收取任何费用。\n\n如上所述，DeFi 于于借贷、资产管理、保险案例、稳定币、由\
  \ KYT 机制支持的合规性、交易、无损游戏系统等各种情况。尽管我们试图包含 DeFi 的大多数用例，但在上述章节仍有许多用例需要发现。DeFi 是一个相对新的系统，其动态机制和对不同领域的应用不断演变。由于这种不断演变的特性，随着新功能的加入，应用范围也在不断变化。尽管如此，在叙述中涵盖用例的目的是强调\
  \ DeFi 的应用，并让读者了解 DeFi 变得多么广泛，包括在其伞下的一个又一个行业。\n\n# DeFi 的重大考量\n\n尽管 DeFi 系统由于金融与区块链网络在分布式账本技术（DLT）上的结合提供了大量的优势方面，但它仍然充满了许多风险和局限性，用户在进入\
  \ DeFi 生态系统之前应该意识到这些问题。随着应用行业的增加，DeFi 也成为这些平台上网络犯罪分子的乐园。`CipherTrace`（一家从事加密分析的公司）发布的报告揭示了加密犯罪的惊人数字。根据该报告，仅\
  \ 2020 年 DeFi 的被窃金额就达到约 1 亿美元。在 2020 年下半年，约一半的加密货币被窃是因为 DeFi 协议。这些惊人的数字表明了与 DeFi\
  \ 相关的风险。除了这些风险外，该系统还有许多缺点，将在下面的章节中解释。\n\n在阐述该系统的缺点之前，有必要注意几点。首先，DeFi 缺点的更为重要的部分源于其构建的基础。基础技术的挑战反过来使得\
  \ DeFi 的次要缺点产生了深远的影响。如果构建 DeFi 应用的区块链网络或技术遭受了不稳定性问题。如果它们赖的基础技术是稳定的，那么随后开发的协议也是安全的。此外，如果用户了解与\
  \ DeFi 相关的某些风险，这些风险是可以缓解和管理的。\n\n## 由智能合约引起的风险\n\n首要且最根本的缺点源于该系统的核心组件：智能合约。虽然智能合约简化了金融服务的交换过程，确保了高可靠性，但尽管如此，它仍然面临一些技术局限性。智能合约在最初是由人类控制的，因为代码行在公开上传到区块链之前仅由个人编写。这引入了人为失错误的首次可能性。无论智能合约有多严格，它都可能存在许多漏洞。这些智能合约在公共区块链上的可用性，为内容提供了多双眼睛来审视合同以寻找最细微的漏洞。虽然只有少数个人形成了一个智能协议，但任何访问它的全局数据库都可以进行审计。这种数学特性为利用智能合约中存在的漏洞提供了机会。即使是一个漏洞也可能被滥用，从智能合约中抽走数百万美元。\n\
  \n由于智能合约在公共区块链上公开可用，潜在投资者可以自己审查它们，或者经常外包给安全公司进行审计。这揭示了由于人为错误导致损失的第二可能性。人类可能会忽略合同中的漏洞，从而导致未来的被利用并最终导致财务损失。\n\
  \n例如，`Decentralization Autonomous Organization`（`DAO`）构建在开源代码之上，允许绝对的自主性并补充了去中心化。它于\
  \ 2016 年 4 月推出，是一个由投资者指导的风险投资基金。它经历了指数级增长，很快使该平台成为最重要的众筹项目之一，筹集了约 1.2 亿美元。然而，到 2016\
  \ 年 6 月，出现了一系列黑客，他们识别出了智能合约中的一些缺陷和漏洞。这些漏洞帮助黑客抽走了约 5000 万美元。抽取的金额使得投资者在几周内无法访问他们的资金。这成为了众筹历史上最大的黑客攻击。\n\
  \n人们正努力防止智能合约被利用。例如，`Nexus Mutual` 是一个专注于去中心化保险方面的团队，旨在帮助在用户面临这些系统上网络犯罪子的诈骗和欺诈时确保其利益和安全。\n\
  \n## 黑客攻击与欺诈\n\n\n\n\nDeFi 协议非常适合确保更多的人能够获得金融服务，而不受地理障碍的影响。然而，基于区块链的项目需要提高这些宿主平台的可扩展性。DeFi\
  \ 面临的困境是，交易在确认后需要更长的时间来处理。这可以归因于这些 DeFi 系统在某一时刻内只能处理固定数量的交易。例如，基于 DeFi 的平台 `Ethereum`\
  \ 即使在总容量状态下，每秒也只能处理约 13 笔交易。与此同时，传统的中心化金融系统可以在同一时期内允许大量交易且无任何错误。因此，尽管 DeFi 在发起交易方面提供了便利，但确认交易仍需要长时间的等待。此外，在这些拥挤时期，交易成本会增加。\n\
  \nDeFi 系统的基本前提是引入去中心化，并取代以中央权威为障碍的传统金融计划。这种去中心化提供了透明度、灵活性和可访问性，增加了 DeFi 项目的可信度，并减少了欺诈和丑闻的可能性。然而，尽管有这些说法，并非所有的\
  \ DeFi 系统服务都是去中心化的。例如，这些系统以稳定币形式存在的一个关键用例引入了中央权威的角色，在基于法币的稳定币案例中是直接引入，而在商品支持的稳定币案例中则是间接引入。\n\
  \n除了上述问题，许多其他问题也影响着 DeFi 系统。首先，DeFi 系统提供的匿名性往往会加速诈骗和欺诈的机会。由于公共空间对全球所有用户开放，风险因素变得非常突出。由于\
  \ DeFi 平台不需要用户进行 `KYC`，因此它往往包含了论坛中沉溺于不合规行为的坏分子。尽管 DeFi 使用的验证系统是高效、稳健且耗时少的，但它们往往具有误导性。由于身份验证是通过跟踪在线行为、交易活动和其他此类实际属性来便利的，这些属性可以被操纵，从而欺骗身份验证系统。\n\
  \n其次，在中心化金融中，保险受到了应有的关注，因为它对于确保客户信任以及保护他们免受黑客攻击或可能导致重大财务损失的欺诈事件至关重要。然而，在 DeFi 中，保险方面很少被重视，如果有的话。此外，这种保险需要一个空间，特别是当用户必须独自承担责任时。\n\
  \n即使 DeFi 没有相关的风险或问题，所有的责任都将落在用户的身上。由于操作的复杂性，出错的空间总是存在的，特别是对于那些对操作技术经验较少或刚加入 DeFi\
  \ 平台的用户。他们由于一个微小的错误而损失资金的可能性给他们带来了重大的财务问题。因此，DeFi 领域需要更多的工作来使平台对用户友好，并创建工具来尽可能地减少潜在人为错误的风险。\n\
  \n尽管 DeFi 存在风险和局限性，但它仍然蓬勃发展，因为它通过其成功且高效的应用继续为各行业提供优势。特别是在 2020 年之后，由于锁仓资产数量的增加，这些系统必须引起关注。DeFi\
  \ 的用例也有增加，这使得系统获得了更多的认可。尽管 DeFi 使用的技术在减少相关风险的必要工具方面仍需精炼，但由于其互操作性和创新性等因素，它预计将在金融世界中占据主导地位。\n\
  \n# 第 6 章：非同质化代币\n\n## 什么是 NFT？\n\n非同质化代币或 `NFTs`，顾其名，是代币，类似于 `Bitcoin` 或 `ether`\
  \ 等其他加密代币；然而，关键区别在于它们是非同质化的，这意味着它们不能被复制或复制。每个代币本身都是独特的。例如，当你购买一种加密货币（如 `Bitcoin`）然后将其换成另一个\
  \ `Bitcoin` 时，最后你拥有的是相同的东西；无法区分你之前持有的 `Bitcoin` 和现在持有的 `Bitcoin`，这意味着它们是同质的。\n\n\
  非同质化代币是独特的，因为如果你用一个价值相似的 `NFT` 交换另一个 `NFT`，那么你手中的东西是不同的。货币和加密货币的同质性通常有助于我们将其用作交换媒介，因为每个人对该货币的所有单位都有一个公认的价值。相比之下，`NFTs`\
  \ 可以与独特的运动星卡或艺术品等收藏品相比较。\n\n`NFTs` 使用区块链技术来注册交易，通常是 `Ethereum` 区块链，但也使用其他区块链，用以跟踪\
  \ `NFT` 的所有权。`NFTs` 在这些区块链上使用 `ERC-721` 和 `ERC-1155` 框架创建。通常，`NFTs` 是艺术品，如图像、GIF、视频和音乐。情况是，购买该件原作艺术品的人拥有其所有权的证明，交易存储在区块链上。由于我们知道区块链具有不可变和永久的数据，交易无法被篡改，因此它是该人拥有特定资产的事实证明。\n\
  \n大多数事物的价值与该事物的稀缺性成正比。当我们说黄金和钻石昂贵时，是因为它们的数量有限，我们无法创造出更多的天然黄金或钻石。同样，像 `Picasso`、`Monet`、`Banksy`\
  \ 或 `Basquiat` 的这样的艺术品在拍卖和其他销售中具有天文数字般的价值，是因为此类作品的数量是的。此外，每件作品与彼此之间都是独特的。在区块链技术和\
  \ `NFTs` 出现之前，数字艺术形式并没有这种稀缺性，人们可以搜索一首歌或一张照片，并获得数千份相同的副本。然而，有了 `NFTs`，数字资产的所有权出现了新的稀缺性，这增加了这些数字资产的价值。\n\
  \n`NFTs` 作为金融资产运作；它们与物理艺术品相比，只不过它们是数字艺术形式。就像物理艺术品没有内在价值，大多数人购买它是为了拥有该艺术品所有权的虚荣，或者是为了将其作为投资，以便在未来以更高的价格卖出时获得回报一样，`NFTs`\
  \ 同样是为了未来获利而持有，或者是为了持有数字资产原作的事实。\n\n然而，人们需要理解的事实是，仅仅拥有 `NFT` 的所有权并不意味着其他人不能复制相同的数字艺术。可以把它想象成一幅画，例如文森·梵高（Vincent\
  \ Gogh）的《星夜》；与此同时，不同的画家制作了多份《星夜》的复刻品，它甚至可以作为海报或绘图辅助工具；原作《星夜》的所有权掌握在一个人手中，在这个案例中，是在\
  \ `Rijks museum` 手中。同样，相同的 GIF 或图像可以在网上各种网页或搜索引擎上可用。尽管如此，原作仍在非同质化代币所有者的手中。\n\n\n\
  \n\n当人们使用 NFT 购买艺术品时，艺术家或原始所有会将数字信息和元数据加密到区块链上。这些数据用于证明 NFT 的所有权。此外，由于区块链具有时间戳，人们甚至可以追踪数字资产的权利，查看它随时间推移何时以及转手几次。\n\
  \nNFT 可以像任何其他数字资产一样进行交易；有专门的 NFT 市场人们可以在那里购买喜欢的代币。任何固定的市场力量都不会为 NFT 设定价格；就像艺术品一样，它们的价格取决于买家愿意为资产支付的金额。NFT\
  \ 甚至可以编程，使得所有者每次转 NFT 时都能获得一定金额的回报，因此在 NFT 价格飙升的情况下，原始所有者仍能获得补偿。NFT 使用区块链等分布式账本技术，这意味着\
  \ NFT 的转让不需要中介机构或交易所，从而降低了交易成本。\n\nNFT 在全球范围内几乎没有任何监管规定，其未来与加密货币和区块链技术紧密相关。例如，如果某个国家禁止加密货币交易，那么\
  \ NFT 的买卖在该国也将受到限制。\n\n虽然 NFT 变得日益流行，但对它们的批评也随之增加。与 NFT 相关的重大批评之一是它们的碳足迹。世界目前正在应对一场气候灾难，这在一定是因为使用了不可再生和污染性的能源。我们知道区块链是一个高耗能行业。运行负责区块链挖矿的服务器需要电力。NFT\
  \ 的创建也需要类似的挖矿需求，导致了污染和气候变化。一些艺术家在了解 NFT 对环境的影响后，已经停止制作他们的 NFT。\n\n# 非同质代币的属性\n\n\
  非同质代币具有某些有助于其运行方式的特征。其中一些特征包括：\n\n- **独特**：每个 NFT 都是独一无二的，即 NFT 不能被复制。与其他加密货币不同，一个\
  \ NFT 等同于另一个 NFT，即使它们的价值相同。如果有人交易 NFT，他们手里拿的是不同的东西，而不仅仅是相同物品的另一个副本。\n- **不可分割性**：NFT\
  \ 也是不可分割的，这意味着 NFT 不能被拆分为价值较低的较小部分然后出售、再次收集并重新组装。NFT 总是作为一个整体进行交易。\n- **不可破坏性**：NFT\
  \ 的数据存储在区块链上。大多数 NFT 存储在 `Ethereum` 区块链上。由于知道区块链上的数据很难被破坏或更改（特别是在公链上），因此 NFT 无法被破坏。\n\
  - **绝对所有权**：当一个人拥有一个 NFT 时，他们对该数字资产拥有完全所有权；这不像购买特定图像、歌曲或 gif 的许可。这意味着所有者对这些 NFT\
  \ 有不受限制的访问权限。\n- **可验证性**：由于有关 NFT 所有权的数据存储在区块链上，且此类数据带有时间戳并确保了真实性，因此很容易验证和追踪 NFT\
  \ 的所有权。\n- **限量性**：NFT 的数量是有限的；它们是稀缺的。大多数 NFT 都是单一生产的；然而，艺术家可能拥有数量的相似产品，例如 10 件或\
  \ 50 件，就像现实制造商的限量服装或汽车。\n- **可转让性**：NFT 是声明数字资产所有权的数字资产或证书；因此像任何其他数字资产一样，NFT 可以以价格转让给另一个人。\n\
  - **永久性**：存储在区块链上的数据是无尽的；一旦输入，就永远在那里。与随时间推移可能会损坏的现实绘画或艺术形式不同，NFT 是永久的。\n\n# 非同质代币的历史\n\
  \n非同质代币的理念始于 2012 年的所谓“彩色币（colored coins）”，这些币是在 `Bitcoin` 区块链上提供的。这些彩色币代表了汽车、金属、房地产等现实世界的所有权。\n\
  \n非同质代币由 Kevin Mckoy 在 2014 年首次铸造。他在加密艺术中广泛使用 NFT 之前，创造了第一个名为“量子（quantum）”的非同质代币。Quantum\
  \ 是一个八角形体的像素化图像，会改变形状和颜色。\n\n在 `Ethereum` 区块链上推出 `CryptoKitties` 和加密朋克之后，NFT 开始引起公众关注。Crypto\
  \ kitties 是描绘猫的非同质代币，每只猫都有独特的年龄、尺寸和颜色特征。这意味着没有任何一只猫是相同的；因此它们在人们之间作为收藏品进行交易，就像现实中的运动卡或宝可梦卡一样。相比之下，Cryptopunks\
  \ 是转换为 NFT 的头像或个人简介，人们可以将其用于各种社交媒体平台。同样，每个赛博朋克头像都与其他不同并有自己的价值。NFT 在加密社区中增长，但它们在\
  \ 2021 年进入了主流热潮。\n\n# 2021 年的 NFT 革命\n\n2021 年，对 NFT 的兴趣飙升到了前所未的高度。虽然这与第一季度 `Bitcoin`、`Ethereum`\
  \ 甚至狗狗币等加密货币价格上涨的牛市一致，但观察发现，尽管这些加密货币的价格在第二季度从峰值下跌，但在同一时期非同质代币的买卖持续增长。\n\nNFT 市场在\
  \ 2021 年飞飞猛进。2021 年上半年，与 2020 年上半年 1,370 万美元的销售额相比，NFT 销售额飙升到几乎难以置信的 25 亿美元。其中，我们看到第一季度到第二季度的增长了约\
  \ 114.6%。在同一期间，存储 NFT 的钱包数量也大幅增加，约增加了 151.89%。`Open Sea` 等 NFT 交易平台也在增加，`Open Sea`\
  \ 目前价值约为 15 亿美元。NFT 的销售已从仅限于交易平台转变为由苏富比（Sotheby’s）和佳士得（Christie’s）等传统拍卖行进行。\n\n\
  2021 年增加的不仅仅是 NFT 销售的数量。NFT 的价值也大幅增加，有史以来最昂贵的 NFT 销售中大部分发生在 2021 年。2 月份，我们看到音乐家\
  \ Grimes 的数字艺术以接近 600 万美元的价格售出，而 Nyan cat 的 GIF 以近 50 万美元或 300 个以太坊的价格成交。3 月份，数字艺术家\
  \ Michael Winkelmann 的化名 Beeple 的名为《每天：前 5000 天》的作品由 `Christie’s` 拍卖行挂牌，并以 6930\
  \ 万美元的纪录价格售出。同月，推特创始人兼首席执行官 Jack Dorsey 将他的第一条推文转换为 NFT 后出售。这条推文以 290 万美元的价格售出。同样，各种赛博朋克头像的价格不断在从几十万美元到\
  \ 760 万美元（或 CryptoPunks #7804 的 4200 以太坊）不等。\n\n人们应该了解的一些热门 NFT 包括：\n\n- **CryptoKitties**：Crypto\
  \ kitties 是最早供公众 easily 交易的 NFT 之一。Crypto Kitties 是由加拿大开发工作室 Dapper Labs 在 2017\
  \ 年开发的。从那以后，各种猫的受欢迎程度和价格增加了许多倍，某些稀有猫（如“龙猫”）的价格超过了一百万美元。Crypto Kitties 是一个基于 `Ethereum`\
  \ 区块链的游戏。用户可以在游戏中购买、繁育和出售猫。\n\n\n\n\n\n# 独特的游戏猫\n\n游戏中的猫咪都是独一无二的。每只猫都有其独特的颜色、尺寸、名称以及无法复制的特征。用户拥有这些猫咪，因此它们不会被任何人夺走，包括游戏开发人员在内。猫咪还可以作为收藏品，人们收集特定类型的猫咪并展示这些收藏。根据其属性和稀有性，游戏中存在几种不同类型的猫，例如\
  \ `Exclusive Cats`（独享猫）、`Fancy Cats`（华丽猫）和 `Special Edition Cats`（特版猫）。\n\n## CryptoPunks\n\
  \n`CryptoPunks` 与同 `CryptoKitties` 一起，是非同质化代币领域的另外两个规则制定者。与 `CryptoKitties` 类似，`crypto\
  \ puns` 也于 2017 年推出。`Cryptopunks` 由一家名为 `Larva Labs` 的美国开发工作室创建。赛博朋克运动启发了 `crypto\
  \ punks` 的诞生。`crypto punks` 反而启发了 `Ethereum` 的 `ER-721` 标准，而该标准现在被应用于大多数数字艺术 NFT。\n\
  \n`crypto punks` 是人们可以在各种平台上用于展示图片的头像。`Larva Labs` 总共创建了 10,000 个 `crypto punks`。在这\
  \ 10,000 个 `crypto punks` 中，有 6039 个为男性，3840 个为女性，88 个是僵尸，24 个是猴子，9 个是外星人。这些 `crypto\
  \ punks` 中的每一个都是独的，因此具有自身的价值。`crypto punk` 的价格取决于稀有性；其中 9 个外星人 `crypto punks` 最稀有，到目前为止以最高价格成交。\n\
  \n`Crypto punks` 经常出现在最贵 NFT 销售名单上，其中 `CryptoPunks #7804` 以 760 万美元出售，`CryptoPunks\
  \ #6965` 以 160 万美元出售，`CryptoPunks #4156` 以 130 万美元出售。即使是主流公司也开始购买朋克了，例如 `Visa` 在\
  \ 2021 年 7 月在一个 `crypto punk` 上花费了近 17.6 万美元。## 稀有 Pepes\n\n`Rare pipes` 是在名为 `counterparty`\
  \ 的平台上提供的首批 NFT。`Pepes` 是经过各种方式编辑的绿色青蛙图像。不同种类的 `Pepe` 图像已被转换为 NFT 并卖给最高出价者。`pipes`\
  \ 中“最稀有”的是一幅 `Homer Pepe` 的图片，即著名的电视角色 `Homer Pepe` 的。\n\n## 其他项目与概念\n\n`Rare Pepes`：`Rare\
