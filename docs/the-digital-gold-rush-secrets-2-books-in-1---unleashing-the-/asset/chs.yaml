  \n## 日历工具\n\n通过 `CoinCal` 发现如何买入消息并卖出消息，加入这一强大工具实现利润最大化的交易者行列。通过我们卓越的日历发现加密货币世界的最新和最优秀。发现你自己的币种！利用市场投机实现利润。轻松使用我们的平台买入消息并卖出消息。`https://coincal.com`\n\
  \n## 下单\n\n在投资者决定想要投资的加密货币组合后，下一步是在交易所为该币下单。然而，你必须先拥有资金来下单。根据平台，加密交易所允许你通过卡片、转账或\
  \ `PayPal` 转账。\n\n在某些情况下，你需要使用其他加密货币进行购买，在这种情况下，你需要将它们存入账户。资金到账账户可能需要一段时间，因此在购买选择的加密货币之前必须等待。\n\
  \n一旦投资者账户中有资金，就可以下单。下单时，人员必须通过点击代码（取决于用户界面）来选择币，例如 `Bitcoin` 的 `BTC`，然后选择你想要购买的数量。大多数加密交易所甚至允许你购买部分昂昂的\
  \ `Bitcoin`。完成后，加密货币将存入持有者的账户，相应的资金将扣除。交易所和经纪商根据交易金额收取佣金或费用。\n\n## 你的加密货币投资\n\n\
  最后一步是安全存储你购买的加密货币，因为它是珍贵的投资。由于大多数交易所对硬币提供的保护有限，它们很容易受到攻击和盗窃。过去发生过数百万美元的加密货币被盗事件。\n\
  \n为了这个目的，人们需要将加密投资存储在加密钱包中。加密钱包有不同的类型，例如与交易所关联的钱包、软件钱包、硬件钱包、冷钱包和热钱包。根据他们的需求，人们可以选择他们种的钱包，因为不同的钱包具有不同的功能、安全性和。\n\
  \n### 替代方法\n\n\n\n\n\n如果有人对通过上述流程直接投资加密货币持怀疑态度，仍然可以间接投资加密世界正在经历的增长。为此，首先，可以等待并投资加密交易所基金，这些基金与整个交易所的价值挂钩。因此，它们可以为你的资产配置提供自动多元化支持。目前尚没有\
  \ `Crypto-ETFs`，但已计划很快推出一些。\n\n另一个选项是投资与加密货币合作的公司，例如 `Nvidia`，它创建了挖掘加密货币不可不可的处理单元；或者\
  \ `PayPal`，它已成为想要购买和出售加密货币的人的首选支付选项。\n\n# 加密货币交易所 - 它们是什么？\n\n在投资加密货币时面临的少数问题之一是，它们无法在你的常规交易所中获得，而且银行通常不提供交易服务。因此，为了这一目的，投资者需要在专门用于买卖加密货币的独立平台上创建一个账户。这些平台对于这些硬币的交易至关重要。这种平台就是我们说的加密交易所。\n\
  \n加密交易所是一个想要出售加密货币的人和想要购买加密货币的人相遇并进行交易交易的平台。加密交易所会对每笔购买收取少量费用，该费用可能根据业务和销售以及不同加密货币之间而异。实际上，它们的工作方式与常规货币兑换类似。\n\
  \n不同的加密交易所可能有不同类型的用户界面和用户体验。通常，对于新手来说，理解它们可能有些困惑；因此，它们也提供对新手友好的平台，但收费费用通常比通常要高。\n\
  \n在加密交易所上，交易者或投资者必须设置账户，然后才能开始购买或出售加密货币。要设置此账户，必须经过必要的流程并满足各种法规，例如 `KYC` 或 `AML`。账户建立后，账单的功能就像任何其他交易账户一样，你可以在其中存储硬币或代币，然后用它们进行交易。\n\
  \n## 支付选项\n\n要在加密交易所上进行交易，人们首先需要在账户中拥有用于购买加密货币的资金。你可以通过不同的方法在报告中获得资金。每个加密交易所都允许其支付方式，包括信用卡、借记卡、银行转账或\
  \ `PayPal`。这些方法使用传统的法币购买加密货币。因此，你支付的是市场决定的汇率，即你可以将纸币转换为数字货币。\n\n然而，某些加密交易所不允许使用法币购买加密货币。在这些交易所上，要购买加密货币，你需要用另一种加密货币来交换。这通常意味着人们必须使用通常常见的\
  \ `Bitcoin` 或 `Ethereum` 等常见硬币来购买其他不那么常见的加密货币。交易所根据市场力量决定其汇率。\n\n在加密交易所上可用的支付选项类型，对于决定选择哪种加密交易所进行交易来说至关重要。\n\
  \n# 加密货币交易所的类型\n\n如上所述，加密交易所平台的功能各异，并具有额外的特性。每个加密交易所都有其特点、优点和缺点。加密交易所的主要类型有：\n\n\
  ### 中心化加密货币交易所\n正如名称所示，中心化加密交易所有一个中心机构人物。该机构在加密货币的卖方和买方之间充当第三方。这些第三方被称为交易所运营商。中心化加密交易所更广泛地用于交易，因为它们更容易使用，因此即使是新手也能轻松地在这些交易所进行交易。此外，中心化交易所还允许将法币或传统货币兑换加密货币。然而，由于它们的所有数据都存储在一个空间中，它们更容易受到黑客攻击和数据泄露，并且通常有更多需要遵守的规定。一些常见的中心化加密交易所有\
  \ `Coinbase`、`Bittrex` 和 `Kraken`。\n\n### 去中心化加密货币交易所\n去中心化加密货币交易所有时被称为直接交易平台。在这种交易所中，交易只有双方。这种系统被称为点对点交易所，卖方决定价格。此外，这通常意味着人们必须使用\
  \ `Bitcoin` 或 `Ethereum` 等通常常见的硬币来购买其他不那么常见的加密货币。交易所根据市场力量决定其汇率。去中心化交易所没有中央监管，因此它们承载了加密货币的本质。虽然它们比中心化交易所更安全，但由于它们更难使用，不建议新手使用。去中心化交易所的一个问题是它们目前不允许使用法币购买加密货币。一些去中心化交易所有\
  \ `IDEX`、`Waves DEX` 和 `Stellar DEX`。\n\n### 混合加密货币交易所\n混合加密交易所出现被认为是加密货币交易的未来。它们希望获得中心化和去中心化交易所的优点并减少它们的缺点。`Qurrex`\
  \ 是第一个混合加密交易所。\n\n# 如何选择加密交易所？\n\n选择正确的加密交易所是投资决策中至关重要的一部分。选择取决于不同的因素，例如：\n\n* \
  \  **提供的币种**：在选择加密交易所之前最重要的事情是检查该业务提供哪些币种。并非所有货币在所有平台都可用。因此，选择币种较多的场所是建议的，因为这可以在无需注册多个加密交易所的情况下快速实现资产多元化。\n\
  *   **费用**：不同加密交易所对交易者收取的费用不同。通常，中心化系统的费用比去中心化系统高。同样，具有更直观新手友好用户界面和用户体验的企业费用略高。每天交易的人受价格的影响大于那些购买加密货币作为价值存储的人。\n\
  *   **支付方式**：交易所提供的支付类型也会影响对加密交易所的选择。如前所述，如果人们想用法币购买加密货币，只需要从中心化加密交易所中选择。此外，如果只想只想特定的支付方式（例如银行转账），他们必须相应地选择加密交易所。\n\
  *   **类型**：正如我们所看到的，有三种类型的加密交易所；现在，选择加密交易所取决于你想要的加密交易所。一个人可能因为额外的安全性而想要去中心化交易所。相比之下，另一个人可能想要中心化交易所上更容易使用的平台。\n\
  *   **基于国家的法规**：加密货币法规随国家和地区而异。因此，某些加密交易所可能在某些地区无法运行。所以在选择加密交易所之前，人们必须查看它是否符合国家的法规。\n\
  *   **KYC**：了解您的客户（KYC）法规也取决于加密交易所。有些规则较松的，而另一些则非常严格。个人可以根据自己的隐私顾虑来选择业务。\n\n\n\n\
  \n\n## 安全性\n* **安全性**: 在选择加密货币交易所之前，研究其安全规定是至关重要的。正如我们在 `Mt Gox` 黑客攻击期间看到的，如果加密交易所本身不安全，可能会损失数百万美元。由于许多人将加密货币存储在与其账户关联的钱包中，他们可能面临这种风险。\n\
  \n## 加密货币经纪商\n\n了解加密交易所平台有时需要花费精力，特别是在入门阶段。因此，你可以通过经纪商进行交易，这样更易用。这些经纪商会为投资者的交易收取名义手续费。然而，在使用经纪商之前必须考虑到，某些经纪商不允许投资者将加密货币从其钱包中提取出来。这可能导致安全泄露的风险，因为它们比冷钱包等其他钱包更容易被盗。`Robin\
  \ Hood` 和 `Sifi` 是目前市场上两种常用的加密货币经纪商。\n\n# 市场上流行的加密货币交易所\n\n尽管人们有多种加密交易所平台可选择，但大多数人都在使用几个常见的平台。其中一些常见且流行的加密交易所包括：\n\
  \n* **Coinbase**: `Coinbase` 成立于 2012 年，是目前全球最大、使用最广泛的加密货币交易所之一。`Coinbase` 是一个受监管的中心化加密交易所。它的界面非常易用，因此推荐给大多数初学者。然而，它的交易费用相对较高。它还有一个名为\
  \ `Coinbase Earn` 的平台，人们可以通过学习视频来赚取加密货币。\n\n* **Bin 安 (Binance)**: 这是另一个非常热门的加密交易所，在全球通过\
  \ `Binance.com` 运行，在美国则通过 `Binance.us` 运行。它是一个稍微高级的交易所，但费用较低，因此人们在更熟悉加密货币投资后就可以使用它。`Binance`\
  \ 还允许你通过借记卡或信用卡购买加密货币。通过 `Binance`，人们很容易用法币购买加密货币。\n\n* **Kraken**: `Kraken` 是另一个早期的加密交易所之一，成立于\
  \ 2013 年。`Kraken` 允许全球投资者参与，因此比某些针对特定国家的加密交易所更开放。`Kraken` 以其加密钱包良好的安全性而闻名。`Kraken`\
  \ 也面向稍微高级的加密货币投资者。\n\n* **Uniswap**: `Uniswap` 是最流行的去中心化加密交易所平台之一。它成立于 2018 年。`Uniswap`\
  \ 通过智能合约在由 `Ethereum` 建立的 `Blockchain` 上提供加密货币之间的自动交易。\n\n* **eToro**: `eToro` 是一个高级的加密货币交易平台。它甚至允许你使用名为\
  \ `CopyTrader` 的功能复制其他顶尖交易者的策略。此外，它还允许你虚拟交易加密货币以学习这一过程，而无需投入自己的资金。\n\n# 加密货币投资策略\n\
  \n投资不仅仅是一场运气游戏，正如现在许多人开始相信的那样。投资需要大量的分析、决策以及提出正确的问题。正如被誉为价值之父的本·格雷厄（Ben Graham）曾说的：“个人投资者应该一如既往以投资者的身份行动，而不是投机。”所以，仅仅因为某种硬币或货币流行就将其投入资金并不是明智的。要成为一名更优秀的投资者，你需要学习游戏规则，并根据特定的想法和目标开始投资；这意味着你必须遵循一套特定的策略。当然，这些策略内部以及个人决策仍然有很大的回旋地，但它们为你提供了一条可以遵循的引导路径。\n\
  \n## 定额成本法 (Cost Averaging)\n\n这是最常用的投资策略之一。根据所使用的货币，它有时被称为`定额成本法` (Dollar Cost\
  \ Averaging)。该策略的核心思想是在更长的时间内平摊投资成本，特别是在高波动市场中或当该投资标的价格较高时进行投资。\n\n在定额成本法下，投资者并不是一次性在某个时间点购买所有投资份额，而是将购买分散在时间上。购买可以每周或每月在同一时间进行。这降低了投资价格在短时间内大幅下跌的风险，避免了手中持有高价买入的加密货币从而减少了可能的利润。\n\
  \n例如，如果投资者 A 想要购买价值 100 美元的加密货币，而当前价格为 10 美元，那么他可以一次性购买十个币；但是，如果他先投资 40 美元获得 4 个币。然后下周当价格为\
  \ 11 美元时，他用 30 美元获得 2.7 个币；再下周，当价格为 8 美元时，他用 30 美元获得 3.75 个币。这样三周结束后，他拥有 10.45 个币，每币平均成本为\
  \ 9.56 美元。我们可以看到，尽管存在波动，但每种货币的平均成本低于一次性投入所有资金。如果价格大幅上涨，投资者可以根据意愿推迟后续投资。\n\n## HODL\n\
  \n`HODL` 意味着 `HODLing`（持有），这是单词 \"holding\" 的故意拼写错误。它的产生源于当时一个比特币论坛上的投资者看到比特币价格下跌并说“我正在持币（I\
  \ am HOLDING）”。理解这种策略背后的概念很容易。这是最直接的策略之一，大多数初学者都会尝试使用它。这是一种投入你已知几年内不需要的资金来赚被动收入的方法。应该遵循黄金法则：只投入你亏得起的钱。\n\
  \n其要点是投资蓝筹加密货币，如 `Bitcoin` 或 `Ethereum`，然后持有几年。这种策略实际上不仅限于加密货币；公认为持有蓝筹股比其他投资收益更好。这种策略基于这样一个事实：区块链和加密货币是未来的趋势。`HODLing`\
  \ 还能通过收益获得收入。如果你质押你的加密货币，每年可以获得 5-15% 的利润。当然，这包含了一程度的风险，因为并不是所有的硬件钱包都支持质押。\n\n##\
  \ 平衡组合多元化\n\n多元化是投资领域最古老的策略之一，同样适用于加密货币投资。正如前面提到的，投资多元化是将风险分散到不同的加密货币上。即使其中一种失败了，你仍然可以通过其他加密货币的盈利来平衡损失。当然，这种模式的回报略低，风险也是如此。\n\
  \n在平衡组合中，投资者向所有投资项目投入相同的金额；例如，如果他有 500 美元并投资 5 种加密货币，情况如下：\n\n1. `Bitcoin` - 100\
  \ 美元 (20%)\n2. `Ethereum` - 100 美元 (20%)\n3. `Polkadot` - 100 美元 (20%)\n4. `其他山币`\
  \ - 100 美元 (20%)\n5. `Tether` 或其他`稳定币` - 100 美元 (20%)\n\n确的金额被投入到不同的加密货币中。投入的价值并不取决于加密货币的市场、单一货币的前景或任何其他研究。如果初学者需要了解更多加密货币，可以采用这种策略。这意味着如果你不知道哪种加密货币会带来最大的收益或哪种风险最高，你就对所有项目都投入相同金额。\n\
  \n# 不平衡组合多元化\n\n\n\n\n\n不平衡投资组合多元化策略实际上只是一种稍微高级一点的多元化方式。初学者通常保持平衡的投资组合，但大多数经验丰富的加密货币投资者拥有不平衡的投资组合，这让他们在资金使用上更加灵活。\
  \ \n\n例如，如果一个人有 500 美元，并想投资四种不同的币，那么根据它们的前景，他可能会如下配置：\n\n1. 比特币 - 300 美元 (60%) \n\
  2. 以太坊 - 100 美元 (20%)\n3. Tether 或其他稳定币 - 75 美元 (15%)\n4. 其他山寨币 - 25 美元 (5%)\n\n\
  在这种情况下，我们通常看到投资组合中很大一部分投入在了更具意义、更常见且稍微稳定的加密货币中，例如比特币。这让某个人既拥有一项可以持有的固定投资，同时也允许能够在波动性更大的币种上操作市场，以获得更快的收益。\n\
  \n## 利润再投资\n\n人们通常认同，应该只将不需要的资金投入加密货币，但这可能意味着想要赚更多钱的人资金匮乏。为了这一目的，人们可以再投资之前投资获得的利润。例如，如果\
  \ A 以 50 美元的成本购买了三个币，然后以 450 美元的价格卖出，那么 A 获得的总利润为 1200 美元（每个币 400 美元）。A 不需要将这笔钱作为收入，而是可以将获得的\
  \ 1200 美元利润投回加密货币。这为 A 提供了额外的资金，而无需挖掘自己的资源。 \n\n利润再投资可能意味着短期收益有限，因为资金被回了市场。尽管如此，这也意味着投资者的长期进展可以指数级增长。\n\
  \n## 金叉/死叉\n\n金叉/死叉策略略带技术性，并运用了统计学。这种策略中需要的基本价值是加密货币在长时间范围内的 50 日平均线和 200 日平均线。当我们把这两张图表叠在一起时，可以看到两种点：汇聚点（即金叉）和发散点（即死叉）。\n\
  \n在汇聚点，我们看到 50 日均线穿过 200 日均线，这意味着处于买方市场，短期价格在长期平均水平之上，因此应该购买加密货币。在发散点，50 日均线跌至 200\
  \ 日均线下方，这表明处于卖方市场，价格低于长期平均水平，人们应该卖出手币。 \n\n这种方法在波动较大的市场中效果最好。当然，这些并不是万无一失的方法，但它们能给你提供价格的总体趋势，以及你应该购买还是出售加密货币。\n\
  \n这些是投资者可以用来进行更佳投资的各种策略。这些设计并不是互斥的，一个人可以同时使用多个系统，以便在更长的时间内实现收益最大化。\n\n# 如何安全存储你的加密货币？\n\
