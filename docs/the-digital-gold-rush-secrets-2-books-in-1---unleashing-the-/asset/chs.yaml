  \n\n\n\n# 区块链技术的演变\n\n区块链是一种记录任何交易的可靠且安全的方式。它消除了对外部权威的需求，这也是许多人被这一想法所吸引的原因之一。比特币用户每次进行交易时都不需要向第三方汇报。相反，他们依靠不断演进的区块链和其他比特币用户来保持一切的稳健、健康和安全。这一概念是新颖且革命性的，它让加密货币的想法变得现实，甚至成为可能。有了这些安全的检查点，加密货币得以建立并繁荣发展。\n\
  \n区块链是那块将一切联系在一起的缺失拼图，它将比特币带入了一个以前可能的加密货币从未达过的领域。现在，人们可以遵循一个具有成功蓝图的计划和真实的加密货币了。区块链消除了对加密货币将不受监管且完全不安全的忧虑；它不再被视为现代社会的“西部荒野”之地。相反，它现在比传统货币更安全。如果实施，这一计划将依赖于使用比特币的人。他们将成为执行者、先锋，是保持整个系统诚实稳健的安全保障。这是一个绝妙的构想，将加密货币的冠军和最重要的粉丝转变为它的守护者和保护者。还有谁比他们更适合运营并确保一切顺利安全地进行呢？这些人利益相关最深的人；他们参与程度最高是有理的。\n\
  \n中本（Nakamoto）的比特币概念，特别是区块链的引入，让全球许多人感到兴奋。终于，用精确的细节和易于理解的语言写出了那个多年来被许多人支持的终极构想：一种数字化货币的假设，这种货币为民所用、由民所有，且不依赖银行。区块链提供的安全性让许多人的这种信念变得更加诱人。数字货币的支持者们终于有了一个强大、经过测试且能够独立存在的概念。他们面对批评者，向他们证明了加密货币不仅是安全的，而且是可能的。\n\
  \n## 比特克的诞生\n\n随后，比特币诞生了，加密货币被引入世界。2009 年 1 月 3 日，当中本创建（或“挖矿”）了第一个比特币区块 `block 0`\
  \ 时，比特币网络正式启动。澳大利亚程序员 Hal Finley 是第一个收到任何比特币的人。他在第一天下载了比特币软件，并从中本那里收到了十个比特币作为对他的报酬。那笔发生在\
  \ 2009 年 1 月 12 日的交易是历史上第一笔比特币交易。参与的双方并不知道那一刻是多么具有历史意义。\n\n## 去中心化架构\n\n如所述，区块链并不存储在一个中央位置，像银行的金库那样。相反，它分布在系统的所有用户之间。每个人都有这个区块链的副本，并且当网络上添加新交易时，就会传播并刷新它。与其说是一个银行金库，不如将其想象成全球数百万个储物柜。但除非你能在不被发现的情况下同时访问所有的柜子，否则没有任何是有值的。运行区块链的计算机网络使其几乎不可能被破解或戏弄。\n\
  \n## 核心原则与影响\n\n区块链是一种记录任何交易的可靠且安全的方式。它消除了对外部权威的需求，这也是许多人被这一想法所吸引的原因之一。比特币用户每次进行交易时都不需要向第三方汇报。相反，他们依靠不断演进的区块链和其他比特币用户来保持一切的稳健、健康和安全。这一概念是新颖且革命性的，它让加密货币的想法变得现实，甚至成为可能。有了这些安全的检查点，加密货币得以建立并繁荣发展。\n\
  \n区块链是那块将一切联系在一起的缺失拼图，它将比特币带入了一个以前可能的加密货币从未达过的领域。现在，人们可以遵循一个具有成功蓝图的计划和真实的加密货币了。区块链消除了对加密货币将不受监管且完全不安全的忧虑；它不再被视为现代社会的“西部荒野”之地。相反，它现在比传统货币更安全。如果实施，这一计划将依赖于使用比特币的人。他们将成为执行者、先锋，是保持整个系统诚实稳健的安全保障。这是一个绝妙的构想，将加密货币的冠军和最重要的粉丝转变为它的守护者和保护者。还有谁比他们更适合运营并确保一切顺利安全地进行呢？这些人利益相关最深的人；他们参与程度最高是有理的。\n\
  \n中本比特币概念，特别是区块链的引入，让全球许多人感到兴奋。终于，用精确的细节和易于理解的语言写出了那个多年来被许多人支持的终极构想：一种数字化货币的假设，这种货币为民所用、由民所有，且不依赖银行。区块链提供的安全性让许多人的这种信念变得更加诱人。数字货币的支持者们终于有了一个强大、经过测试且能够独立存在的概念。他们面对批评者，向他们证明了加密货币不仅是安全的，而且是可能的。\n\
  \n## 早期阶段与估值\n\n比特币在开盘当天价值多少钱？非常少，几乎忽略不计。然而，这个金额是以非常民主且公平的方式达成的。使用比特币论坛的人决定并谈判了这些首批交易的价值。他们会辩论、争论、达成一致，并达成一个大家认同的合适金额。再次，这证明了比特币是并将永远是一种让其用户处于中心位置并始终掌握控制权的货币形式。即使从开始，比特币就强烈强调自己是一种民主且去中心化的支付形式，始终会将人放在首位。\n\
  \n比特币诞生了，但它的未来从一开始初是不确定的。随着时间的推移，它会被反复证明，其未来往往将保持不确定性。它将去向何方？同样的力量将决定过去所形成的未来：争论双方对比特币最关心的人。支持和反对比特币的战斗才刚刚开始。\n\
  \n当中本聪（Satoshi Nakamoto）发表关于创建、管理和维护比特币的论文时，比特币只是一个充满前景但难以理解的想法。从那里开始，进展非常迅速，第一枚硬币于\
  \ 2009 年 1 月 3 日诞生。\n\n在第一枚比特币诞生后，该系统开始变得活跃并独立运行，这个系统的兴衰完全取决于那些支持并参与它的人的投入。\n\n\
  在比特币的前头几年里，比特币的价值一直处于低水平。它非常低、极其低。在开始时，单个比特币的价值仅为 0.003 美元。从那以后，它所跨越的距离真的是天文数字。\n\
  \n\n\n\n尽管比特币在早期的成本微不足道，但人们并不知道如何使用它。他们不知道如何获取它，也不知道如何确定它的价值。尽管那个名为中本聪（Satoshi Nakamoto）的个人或团体已经已经制定了比特币的蓝图，但他并没有留下来见证它能走多远。2011\
  \ 年，中本离开了比特币去开发其他项目。从那以后再也没有关于他的消息，而且由于他的真实身份匿名，他从未被发现。比特币的创造者在他“孩子”变成蹒跚学步时消失了。\n\
  \n# 比特币早期时代\n比特币的早期是非常狂野且随意的。能够获得比特币的人会对其进行交易，或者用它们从社区内的其他人那里购买商品。2010 年 5 月，一位名叫\
  \ 拉斯兹洛·哈尼克（Laszlo Hanyec）的佛罗里达程序员提议用 10,000 个比特币换一些教父约翰的披萨。一位英国比特币粉丝接受了他的提议，并向哈尼克的家里送了两个披萨。那一天，即\
  \ 2010 年 5 月 22 日，现在被称为“比特币披萨日”。对许多人来说，这被认为是比特币首次用于实际购买。比特币并没有买下披萨，买的是英国粉丝的信用卡。但这是比特币首次用于接收商品或服务。在\
  \ 2010 年，10,000 个比特币的价值仅相当于两个大披萨。从那以后，时代发生了巨大的变化。\n\n# 交易所的兴起\n在比特币披萨日左右，在线用户确定他们需要建立一些在线交易系统，以便诚实地交易和方便地购买比特币。他们注意到股票市场和交易网站的技术，这些技术让客户能够快速买卖和交易股票。如果能为比特币创建这样的网站，支持者认为将看到大量想要买卖的人，从而增加比特币的普及度。\n\
  \n# Bitcoinmarket.com\nBitcoinmarket.com 由一位比特币留言板的用户于 2010 年 1 月 15 日推出。该网站最初非常简陋，但这也是一项了不起的成就，是比特币未来的一一步。在网站上，人们可以用户确定的价格购买比特币。这将是决定比特币价值的方式。它将使用最基本的资本主义原则以及供需关系。如果人们想在比特币上花更多钱，他们可以这样做；如果人们认为它没有那么价值，他们的财务报价就会表达这一点。\n\
  \n# 建立价值\n这是比特币的一个具有重大意义的时刻。此时事情开始向前发展，这种新货币真实的、易于理解的价值也随之建立。通过简单的供需关系和用户的投机观点，比特币正在获得一种真正的价值感。正如前面提到的，这种价值并不多。在早期，单枚\
  \ `Bitcoin` 的成本还不到一美分。但随着时间的推移，在早期交易网站建立的相同理念将延续到其他地方。在短短几年内，将会有多种方式来购买、交易和投机比特币。价值也只会不断上涨。但这一切始于\
  \ 2010 年的早期，当时一个匿名用户自发地创建一个网站来主导比特币市场。\n\n# 为民的比特币\n这是另一个比特币为民并由人民创造的例子。在开始，没有人知道一个\
  \ `Bitcoin` 多少钱。\n\n\n\n如果你正试图理解加密货币和区块链，那么将其拆解为基础组件、核心思想和概念是非常关重要的。如果你尝试在投资领域为自己开辟一条道路，或者想向不了解它们的人解释区块链和加密货币，这些知识将非常有价值。\n\
  \n在教育他人和提升自己时，知道如何用简单、基础的术语总结概念至关重要。即使是最复杂的思想和机构，也可以拆解为简单的术语，并以每个人都能理解的方式进行传播。区块链及其系统——加密货币也是如此。\n\
  \n事实是，许多人之所以没有进入加密货币的世界是因为他们害怕它。他们为什么害怕它呢？仅仅是因为他们不知道如何理解它。他们不理解它。他们不知道它是如何运作的、为什么有效，或者为什么值得他们投入时间和精力。\n\
  \n这看起来可能并不容易，事实也如此，但它的核心概念非常简单。区块链的一个例子是数据库。要理解区块链，必须首先理解什么是数据库。\n\n电子数据库是存储在计算机系统上的信息集合。数据库通常以表格的形式存储信息，以便更容易地搜索特定信息。这与使用电子表格代替数据库来存储数据有区别吗？\n\
  \n电子表格的设计用于存储和访问个人或小小组可用的有限信息。相比之下，数据库设计用于存储大量数据，多个用户可以同时访问、过滤和操作。\n\n数据存储在大型数据库的强大计算机上。为了让大型数据库能够同时被访问，这些服务器可能会使用数百台计算机来提供计算能力和存储容量。通常，电子表格或数据库由企业拥有，并由特定个人管理，该个人拥有访问所有数据的权限。\n\
  \n# 区块链和数据库之间有什么区别？\n\n事实上，它们之间有许多区别。典型数据库和区块链之间的一个关键区别是数据的结构化方式。区块链将信息成组收集，也称为“区块”，这些区块包含一组信息。区块具有特定的存储容量，当填满时，它们会被链接到先前的区块上，形成被称为“区块链”的数据链。紧随在该新添加区块之后的所有新信息都将被编译进新形成的区块中，并在填满后被添加到链中。\n\
  \n与将数据结构化为表格的数据库不同，区块链顾其名，将其数据结构化为连接在一起的块（区块）。换句话说，并不是所有的数据库都是区块链，但所有区块链都是数据库。当以去中心化的方式实现时，该系统会创建一个不可逆的数据时间线。一旦区块被填满，它就被板上钉钉并成为这条时间线的一部分。合伙伴在添加到链时会获得一个精确的时间戳。\n\
  \n比特币对区块链的实现提供了一个理解区块链的有用背景。比特币的区块链存储在计算机集合上，就像数据库一样。比特币中的区块链充当数据库，用于保存有过的每一笔比特币交易。大多数数据库的情况并非如此，在比特币的情况下，每个计算节点\
  \ `node` 都由一个个人或一小小组控制。\n\n假设一家公司拥有一台拥有 10,000 台计算机的服务器以及一个包含所有客户账户信息的数据库。他们有一个仓库，所有的计算机都在同一个屋下，并且对每台计算机及其存储的数据具有完全的控制权。与比特币一样，`node`\
  \ 由一个个人或一小小组控制。\n\n\n\n这会导致受攻击版本的比特币价值暴跌，使得攻击最终变得毫无意义，因为那个恶劣的行为者控制的是毫无价值的资产。如果那个极其糟糕的行为者攻击新的比特币分叉，也会发生同样的情况。这种设计是为了让参与网络带来的经济激励远大于攻击网络。\n\
  \n# 区块链的起源\n\n区块链旨在允许数字信息被记录和分发，但不可被编辑。区块链技术最早由 Stuart Haber 和 W. Scott Stornetta\
  \ 在 1991 年概述，这两位研究人员希望实现一种文档时间戳无法被篡改的系统。但在几乎度过了近 20 年后， 2009 年 1 月比特币的发布是区块链首次用于现实目的。\n\
  \n区块链是比特币协议的基础。比特币的匿名创始人中本聪聪（Satoshi Nakamoto）将这种数字货币称为“一种全新的、完全点对点的、没有任何信任第三方的电子现金系统”。\n\
  \n比特币使用区块链来透明地记录支付，但从理论上讲，它可以不可篡改地记录任何数量的数据。这可能是一次交易、选举中的投票、产品库存、状态识别、房屋契约等。\n\n\
  有几个基于区块链的项目正在探索将区块链用于记录交易之外的。一个很好的例子是使用区块链进行民主化选举。由于区块链的不可篡改性，欺诈投票将变得极不可能。\n\n例如，每个国家的公民都可以获得加密货币或代币作为投票系统。在收到钱包地址后，每位候选人将获得他们自己的地址，然后他们的代币或加密货币将发送到该地址。由于区块链的透明性和可追溯性，投票将不再需要人工干预，物理选票也不会被篡改。\n\
  \n# 区块链的优缺点\n\n区块链是一项革命性的创造，它为加密货币提供动力，并能够改善其他行业。\n\n尽管有其优点和优势，区块链也有一些缺点。了解两者对于充分掌握区块链的潜力和能力是必要的。\n\
  \n需要注意的是，许多人极反对区块链和所有加密货币，认为它是危险的且应该是违法的。我们很快会更深入的讨论。但同样重要的是，要理解，人们对区块链和加密货币的许多问题（无论是否有效）都被夸大了。更重要的是，困扰人们这两项技术奇迹的许多问题在地球上几乎任何其他形式的货币中都能找到。当你看到区块链的所有烦人问题时，你会发现这些问题也可以适用于美元、日元等更多货币。\n\
  \n事实是，所有形式的货币及其运行的系统都有优缺点。这并不是区块链和加密货币所独有的。这一点可以在不完全否定这两者重要性的情况下得到承认并解决。。因此，虽然区块链确实有很多好处和坏处，但它们并不是某些权势人物所描述的那种巨大的、可怕的致命性问题。\n\
  \n# 区块链的优势\n\n## 链的准确性\n\n一个由成千万台计算机组成的网络批准区块链网络上的交易。在验证过程中，几乎所有的人工输入都被消除了，导致更少的人为错误和更准确的数据。网络上某一台计算机犯的计算错误只会影响某些区块链。这需要网上至少有\
  \ 51% 的计算机犯下同样的错误，而对于像比特币这样一个迅速扩张的网络来说，这几乎是不可能的。\n\n## 降低成本\n\n客户通常支付相关费用。通过消除第三方验证，区块链提供了低廉的费用。\n\
  \n## 去中心化\n\n没有存储信息的中心位置。由于信息分布在网络中，区块链更难被篡改。\n\n## 高效交易\n\n交易结算可能需要几天时间。区块链每天 24\
  \ 小时、每周 7 天、每年 365 天工作，与在营业时间内运营的金融机构不同。交易最快可以在十分钟内完成。\n\n## 私密交易\n\n某些区块链网络的交易历史对任何连接互联网的人都开放。用户可以访问信息，但无法看到个人的身份。一种常见的误解是比特币等区块链网络是匿名的。它们不是，但在大多数情况下又是匿名的。\n\
  \n当用户进行公开交易时，他们的唯一代码（称为 `public key`）记录在区块链上，而不是他们的个人信息。如果某人在要求身份的交易所购买了比特币，他们的身份仍然与其区块链地址关联。尽管如此，交易即使与姓名关联也不会泄露个人信息。\n\
  \n## 安全交易\n\n一旦记录，区块链网络必须验证交易的真实性。在区块链上，成千上万台计算机确认详情。计算机验证交易并将其添加到区块链。在区块链中，每个区块都有其唯一的哈希和上一个区块的哈希。编辑区块信息会影响该区块的哈希，但不会影响之后区块的哈希。这种差异只有在预先通知的情况下才能改变区块链信息。\n\
  \n## 透明性\n\n大多数区块链都是完全开源的软件。这意味着任何人和每个人都可以查看其代码。这让审计人员能够审查比特币等加密货币的安全性。这意味着也没有绝对的权威来控制比特币的代码或如何编辑它。正如此，任何人都可以对系统提出更改或升级。如果大多数网络用户同意带有推广的新版本代码是可靠且值得的，那么比特币就可以更新。\n\
  \n## 为没有银行服务的人提供服务\n\n区块链和比特币最深远的意义可能是允许无论种族、性别或文化背景如何，任何人都可以使用它。根据世界银行的数据，接近 20\
  \ 亿成年人没有银行账户，也没有任何存储资金或财富的方式。这些人中几乎都生活在经济处于起步阶段的发展中国家，那里完全依赖现金。\n\n\n\n\n这些人通常赚取的收入很少且是以现金形式支付的。随后他们需要将这些现金储存在家里或居住地的隐蔽位置，这使他们面临抢劫或不必要的暴力风险。`Bitcoin`\
  \ 钱包的密钥可以存储在纸上、廉价手机上，甚至在必要时记脑子里。对于大多数人来说，这些选项可能比床垫下的一小叠现金更容易隐藏。\n\n未来的区块链也正在寻找解决方案，使其不仅是财富存储的记账单位，还能存储医疗记录、产权以及各种其他法律合同。\n\
  \n# 区块链的缺点\n\n虽然区块链具有显著的优势，但其采纳也面临着巨大的挑战。如今应用区块链技术的障碍并不仅仅限于技术层面。真正的挑战是政治和监管方面的，更不用说为了将区块链整合到现有的业务网络中，还需要成千上万小时（即：大量金钱）的定制软件设计和后端编程工作。以下是阻碍区块链广泛采用的一些挑战。\n\
  \n### 成本\n\n尽管区块链可以为用户节省交易费用，但这项技术远非免费。例如，`Bitcoin` 用于验证交易的“工作量证明”系统消耗了巨大的计算能力。在现实世界中，`Bitcoin`\
  \ 网络数百万台计算机消耗的能量接近丹麦全年的消耗量。假设每千瓦小时成本 `$0.03~$0.05`，不考虑硬件费用，每币的挖矿成本约为 `$5,000~$7,000`。\n\
  \n尽管开挖 `Bitcoin` 成本高昂，用户仍继续推高电费来验证区块链交易。这是因为当矿工向 `Bitcoin` 区块链添加新区块时，他们获得的 `Bitcoin`\
  \ 奖励足以让他们投入的时间精力物值。然而，对于不使用加密货币的区块链，必须向矿工支付费用或通过其他激励来验证交易。\n\n解决这些问题的方案开始出现。例如，已经建立了\
  \ `bitcoin` 矿场，以使用太阳能、水力压裂作业场的过剩天然气或风电场的能量。\n\n## 速度\n\n`Bitcoin` 是区块链可能低效的完美案例。`Bitcoin`\
  \ 的“工作量证明”系统大约需要十分钟才能向区块链添加一个新区块。按照该速度，估计区块链网络每秒只能处理约七笔交易 (`TPS`)。虽然其他加密货币（如 `Ethereum`）的表现优于\
  \ `Bitcoin`，但区块链仍然限制了它们。作为参考，老牌 `Visa` 每秒可以处理 `24,000 TPS`。\n\n针对这一问题的解决方案已经开发多年。目前已有一些区块链声称每秒处理超过\
  \ `30,000` 次交易。\n\n## 非法活动\n\n虽然区块链网络的机密性保护用户免受攻击并维护隐私，但它允许在区块链网络上进行非法交易和活动。最常被引用的区块链用于交易的例子可能是“丝绸之路”(Silk\
  \ Road)，这是一个从 2011 年 2 月运行到 2013 年 10 月 `FBI` 关闭的在线“暗网”毒品市场。\n\n该网站允许用户使用 `Tor`\
  \ 浏览器在不被追踪的情况下浏览，并使用 `Bitcoin`或其他加密货币进行非法购买。目前的美国法规要求金融服务提供商在客户开户时获取客户信息，验证每个客户的身份，并确认客户未出现在任何已知或怀疑的恐怖组织列表中。这种系统既可以被看作优点，也是缺点。它让任何人都能访问财务账户，并允许分子进行更多交易。\n\
  \n## 监管\n\n加密领域的许多人对政府监管表示了担忧。尽管情况变得越来越复杂，但像 `PayPal` 这样的大公司已开始允许使用 `cryptrencies`。\n\
  \n# 区块链安全吗？\n\n这是一个会被反复问到的问题。你一定会学到答案并全心地信服它。尽管如此，它的解决方案是一个需要说服某些人的过程。\n\n\n\n\n\
  值得反复提到的是，加密货币一直被怀疑、传言且往往恐惧所围绕。人们并不理解它，最糟糕的是，许多人似乎害怕它。他们必须学习像加密货币这样新颖且不同的事物是如何确保安全的。它存在于在线这一事实对它也并无帮助。许多投资者，包括那些在互联网出现之前积累经验并作为市场重要贡献因素的年长者，必须看到纯纯线上的事物是如何安全的。这难道不是一个巨大的骗局吗？它不会偷走你所有的钱并让你一无所有吗？\n\
  \n现在，回到当前的问题上，也就是那个会被反复问到你的问题：加密货币安全吗？答案是响亮且热烈的肯定。你可以自信地说出这一点，并且在每次谈及它时说说真话。加密货币极其安全。它们通常比我们目前所有人使用的传统货币安全得多。是否存在黑客攻击威胁会从你最信任的网站上掠取你的个人信息？如果我们诚实地说，我们必须说，是的，存在。然而，对于任何形式的货币都是如此：任何银行或机构都面临着信息被盗取的风险。你并不处在一个没有风险的世界里。你听过多少次银行和其他主要金融机构遭受重大的安全漏洞，导致数百万、数百万客户的信息泄露？这种情况经常发生。我们生活在一个这已成为业务标准组成的世界里。因此，金钱的所有方面都存在风险；接受并存储你资金的每家公司、机构或企业都是黑客的目标。\n\
  \n然而，加密货币容易被破解的想法是荒谬且显而易见的错误的。正如上一节所述，驱动加密货币的区块链技术对于几乎所有的破解方案来说都是不可逾越的。是的，你可能会在抢劫中丢失信息，但你失去有价值的\
  \ `Bitcoin` 或其他形式加密货币的总体概率几乎不存在。\n\n加密货币是安全的；它一直安全，并将永远安全。它是用最安全、最的系统之一创建的：`blockchain`。有了它，加密货币不是可以轻易摆弄的东西。也不会在半夜轻易被偷走。你可能从未手持加密货币，它可能只存在于线上，但它仍然应该是地球上最安全、受保护最好的货币形式之一。\n\
  \n许多人对加密货币安全的恐惧是没有根据的，它是受投机、困惑、无知，以及有时试图抹黑加密货币之人的贪婪所驱使的。世界上没有什么比持有加密货币更安全的了。\n\n\
  虽然加密货币是安全的，购买加密货币也是安全的，但某些风险因素取决于你与谁购买和交易你的加密货币。你通过在线交易所和网站投资并保护你的加密货币，这些网站充当购买、交易和存储你加密货币的在线市场。当你购买你的加密货币份额时，你会获得一个\
  \ `private key`，这是一个复杂且私密的代码字符串，用于授权 `blockchain` 网络上所有的出账交易。将你的密钥想象成与你的加密货币关联的唯一\
  \ ID。它就像是你加密货币的 `DNA`，只不过你拥有它，而且它访问着你最有价值的信息。\n\n我们不能说你的加密货币在任何情况下都是安全的，因为在极少数情况下，制作粗糙且监管不严的在线交易所允许自己为危险方案打开大门。\n\
  \n不幸的是，多年来黑客入侵了多家在线交易所，并偷走了价值数百万美元的加密货币。这在高端在线业务中尚未发生，因为它们采取了额外的步骤来确保其安全性比竞争对手更具挑战性。但在低层次平台中发生过，导致一些人失去了宝贵的投资。这是一种罕见事件，发生的频率并没有加密货币批评者希望你相信的那样频繁。虽然某些在线交易所无法为你找回加密货币，但另一些则有保险，确保你在遭受攻击后得到照顾。因此，虽然黑客威胁偶尔会在加密货币领域露头角，但如果你选择声誉良好且可靠的在线交易所，就可以。这给了你更多理由去确保你把钱投入一家你可以信任的企业中。\n\
  \n# 第 4 章：区块链与市场\n\n## 区块链如何改变并驱动市场\n\n在过去的十年里，营销经历了许多变化；现在，它将经历另一场革命，主要由于 `blockchain`。尽管我们大多数人将数字营销与\
  \ `AI` 和分析联系在一起，但 `blockchain` 可能是打击所有行业营销人员最具破坏性的技术。你可能会对谁将从 `blockchain` 中受益感到惊讶。\n\
  \n通过 `blockchain` 技术，双方可以进行交易而不需要第三方验证任何内容。区块链技术主要用于金融和 `cryptocurrencies` 领域，但它也可以用于营销。\n\
  \n`blockchain` 允许消费者重新获得对个人信息的控制，从而平衡竞争环境。以下是 `blockchain` 永远改变数字营销的方式——而且是朝着更好的方向。\n\
  \n`blockchain` 最令人兴奋方面是它将数据价值还给了消费者。在过去，许多公司拥有获取客户信息的优势。几乎所有人都会询问我们的电话号码、电子邮件地址和地址，甚至是我们长子的名字，即使我们只是店里或在线进行简单的购物也是如此。这有助于消费者，因为它允许公司对他们进行精准营销。然而，这这也是一种侵入性做法，因为公司可以通过收集、有时出售任何与其产品互动的人的个人数据来盈利。\n\
  \n这在数字营销方面是简单但具有革命性的。这种无节制的数据抢夺已经结束了。\n\n事实上，如果你身处营销行业，你可能不喜欢这个概念。在许多方面，它就像是回到了起点——依靠客户提供你想要和需要的信息，以便更好地服务他们。也许这对于数字营销来说不是最好的消息——但在消费者保护方面是必要的一步。\n\
  \n`blockchain` 技术可以做的比改变人们接触和营销的方式多得多。`blockchain` 承诺实现双方之间信息的顺畅交换并简化业务流程。企业级 `blockchain`\
  \ 可以保证信息、商品和服务的准确性和质量，并实现合同自动化。\n\n\n\n在业务网络中，区块链增强了信任，使参与者能够在没有额外担保的情况下协作。同一行业内的公司倾向于彼此信任，因为它们都在朝着帮助业务成功的共同目标努力。不同公司代表的个人之间这种信任是罕见的，这使得协作变得具有挑战。区块链可以跨多个组织建立信任并改进流程。\n\
  \n东柯达（Eastman Kodak），这家传奇相机制造商，是区块链如何影响业务的极佳案例。随着智能手机的出现，该公司一直努力保持竞争力。这家老牌在区块链技术的帮助下实现了自我蜕变。为了创建一个版权所有权的数字账本，该公司宣布发布了\
  \ `KODAKOne`。摄影师可以使用该平台注册他们的新旧作品并对其进行授权出售。通过这个系统，专业人士可以通过接收照片的即时、安全支付，来参与摄影的新型经济。\n\
  \n会计领域也可以因此发生根本性的变化。区块链技术对会计领域非常有益。会计工作充满了挑战——从极其复杂的税法典到对准确性和精度的要求。区块链可以解决所有这些问题。\n\
  \n区块链通过提供透明度，可以减少审计人员对交易进行采样和验证的时间。审计人员可以花更多时间关注控制和其他重要任务。\n\n基于区块链的系统还可以影响跨国公司和跨境业务的薪资。它简化并标准化了不同货币的支付，改变了公司向员工支付的方式。改变工人储蓄养老金的方式可以提高雇主的关怀。\n\
  \nWorkchain 是一个用于工作经济的去中心化协议，提供了一个巨大的基于区块链的薪资系统。使用 `Workchain`，员工在完成工作后即可获得工资。同时，雇主可以通过自动化薪资解决方案降低成本并提高效率。\n\
  \nAworker 是另一个人力资源用例示例；它是一种用于应用程序创建的多链验证数据协议，简化了基于经验证数据和信誉评分的应用程序的设计和管理。得益于 `Aworker`\
  \ 的灵活性，公共区块链可以为各种应用程序进行定制。\n\n# 什么是密码学？\n\n密码学是研究安全通信技术的学科，这些技术允许只有发送者和预期的接收者看到消息内容。该术语源于希腊单词\
  \ `Kryptos`，意思是“隐藏”。密码学涉及将普通文本混乱成所谓的密文，然后在交付时将其转换回明文。密码学还包括使用微点或合并技术对图像中的信息进行混淆。最早的现代密码之一被归功于尤利·凯撒，他在复杂的象形文字使用了这些方法之一。\n\
  \n最常用的是，密码学用于加密和解密明文电子邮件和其他电子数据。非对称或“密钥”系统是最简单的方法。私密钥加密数据，然后将编码后的消息和密钥发送给接收者进行解密。问题所在哪里？当消息被拦截时，第三方就可以获得解密和阅读新闻所需的所有信息。因此，密码学家发明了非对称关键系统。每个用户有两个密钥：公钥和私钥。发送者加密消息并连同接收者的公钥一起发送。当消息到达时，只有接收者的私钥可以对其进行解码——这意味着没有相应的私钥，窃取是无效的。\n\
  \n尽管存在恶意的第三方（被称为攻击者），密码学仍提供了安全的通信。算法和密钥的结合可以将输入（明文）转换为加密输出。当在给定的算法上使用相同的密钥时，明文将不断转换为相同的密文。\n\
  \n如果攻击者在给定密文的情况下无法确定明文或密钥的任何属性，则认为该算法是安全的。在许多使用该密钥的明文/密文组合下，攻击者不应该能够关于密钥的任何信息。\n\
  \n密码学有两种不同类型：对称和非对称。它们是什么？它们是如何工作的？为什么它们重要？\n\n在对称加密中，加密和解密使用相同的密钥。发送者和接收者必须已经拥有一个双方都已知的共享密钥。密钥分发是一个棘手的问题，这也是开发非对称加密的动力。\n\
  \n在非对称加密中，使用两个不同的密钥进行加密和解密。每个非对称加密系统有一个公钥和一个私钥。私钥始终保持保密，但公钥可以自由分发。\n\n使用公钥加密的数据只能用相应的私钥解密。只有\
  \ John 拥有私钥才能解密。发送消息给 John 需要使用 John 的公钥对其进行加密。只有 John 拥有私钥才能解读消息。任何使用私钥加密的数据都可以用相应的公钥进行解密。同样，Jane\
  \ 使用她的私钥对消息进行数字签名，任何拥有她公钥的人都可以解密并验证确实是由她发送的。\n\n对称加密通常非常快，适用于加密大量数据。非对称加密慢得多，且只能加密小于关键尺寸的数据（通常为\
  \ 2048 位或更小）。因此，非对称加密通常用于加密密钥，而密钥又用于加密更大的数据块。对于数字签名，非对称加密通常用于加密消息的哈希值而不是整个消息。\n\n\
  加密系统提供密钥管理，包括密钥的生成、交换、存储、使用、撤销和替换。\n\n安全系统应该提供多种保证，例如数据的机密性、完整性和可用性，以及真实性和不可否认性。在使用正确的情况下，密码学有助于提供这些保证。密码学可以确保传输和存储数据的机密性和完整性。它还可以验证发送者和接收者的身份，并防止否认。\n\
  \n软件系统通常有多个端点，通常是多个客户端和一个或多个后端服务器。这些客户端/服务器通信发生在不可信的网络上，如互联网等开放网络。\n\n它可以保护跨越不可信网络的通信。攻击者可能会尝试对网络进行两种主要的攻击。被动攻击涉及攻击者仅仅监听网络分段，并尝试读取传输中的敏感信息。被动攻击可以是在线线的（攻击者实时读取流量）或离线的（攻击者实时捕获流量并在稍后查看——可能在花费一些时间解密之后）。主动攻击涉及攻击者冒充客户端或服务器，拦截传输中的通信，并在传递给预期目的地之前查看并修改内容（或完全丢弃）。\n\
  \n由 `SSL/TLS` 等密码学协议提供的机密性和完整性保护可以保护通信免受恶意的窃听和篡改。真实性保护确保用户正在与预期的系统进行通信。例如，你正在将网上银行密码发送给你的银行还是其他人？\n\
  \n\n\n\n[content]\n它也可以用于保护静态数据。可以对可移动磁盘或数据库上的数据进行加密，以防止在物理介质丢失或被盗时泄露敏感数据。此外，它还可以为静态数据提供完整性保护，以检测恶意篡改。\n\
  \n# 加密的不同类型\n\n有许多加密算法在使用，但通常情况下它们可以分为三类：对称密钥加密、公钥加密和哈希函数。它们在密码学领域中都扮演着各自的角色。\n\n\
  ## 对称密钥加密\n\n上述的`凯撒密码`是私钥密钥加密的一个极佳示例。在我们使用的模型中，如果凯撒与他的某百夫长之间交换加密消息，双方都必须知道密钥——在这种情况下，即在字母表中向前或向后移动多少字母才能将明文转换为密文（或反之）。但这个核心密钥必须在他们之间保密。例如，不能将密钥随消息一起发送，因为如果两者都落入敌手，他们将很容易地解密消息，从而违背了最初加密的意义。\n\
  \n对称密钥加密（有时称为对称加密）广泛用于保持数据的机密性。它对于维护本地硬盘是有益的；例如，由于同一个用户通常负责加密和解密数据，因此共享密钥并不是问题。\n\
  \n## 公钥加密\n\n公钥加密（有时称为非对称加密）可能让你与百夫长面对面交流，但你可能不想进银行学习加密你通信内容的私钥是什么。通常情况下，为了安全运行，互联网需要一种让双方在对话时能够建立安全通道的方法。这种工作方式是通过公钥加密实现的。每个参与者都有两个密钥：一个是共享的，并发送给任何想要通信的任何人；另一个密钥是私有的，不与任何人共享，它是解密这些消息所必需的。用比喻来说：把公钥想象成一个邮箱，大小刚好足够投进一封信。私钥就是你用来打开邮箱的工具，以便取出信件。\n\
  \n使用一个密钥加密消息而使用另一个密钥解密它的数学原理比凯撒密码的工作原理要不直观得多。使该过程运行的核心原理是这两个密钥在数学上是相关的，因此从私钥推导出公钥很容易，但反之则不然。例如，私钥可能是两个巨大的数字，你通过将它们相乘得到公钥。\n\
  \n公钥加密所需的计算比对称基础设施要复杂得多且消耗更多资源。幸运的是，你不需要用它保护你发送的每条消息。相反，通常发生的情况是，一方使用公钥加密加密一个包含另一个密钥的消息。在安全地跨越互联网传输后，该密钥将成为通过对称密钥加密编码会话的私钥。\n\
  \n通过这种方式，公钥加密有助于维护机密性。但这些公钥也是一组广泛函数的一部分，称为公钥基础设施或`PKI`。`PKI`提供了方法来确保任何公钥都与特定的个人或机构相关。使用公钥加密的消息确认了发送者的身份，从而建立了身份验证和不可否认性。\n\
  \n## 哈希函数\n\n公钥和私钥加密算法将明文转换为密文再转换回明文。相比之下，哈希函数是一种单向加密算法：一旦加密了明文，你就无法从生成的密文（哈希值）中恢复它。\n\
  \n这可能让哈希函数看起来像某种无意义的尝试。但它们用途的关键在于，对于任何给定的哈希函数，没有两个明文产生相同的哈希值。（从数学上讲，这需要修正，但对于任何正在使用的哈希函数，这种情况发生的概率通常微乎其微，可以安全地忽略。）\n\
  \n这使得哈希算法成为确保数据完整性的极佳工具。例如，可以随消息发送其哈希值。收到消息后，你可以对文本运行相同的哈希算法；如果你生成的哈希值与随消息的哈希值不同，你就知道消息在传输过程中被修改过。\n\
  \n哈希也用于确保密码的机密性。以明文存储密码是一个重大的安全禁忌，因为这会让用户在数据泄露后容易遭受账户和身份盗窃（遗憾的是，这并不能阻止大巨头这样做）。相反，如果你存储的是用户密码的哈希版本，即使黑客成功攻破了你的防御，他们也无法解密并在其他地方使用它。当合法用户使用密码登录时，你可以对其进行哈希处理，并与你文件中存储的哈希值进行比对。\n\
  \n# 加密与加密\n\n加密货币的一大吸引力是它们在区块链上的安全性和透明度。这一切都依赖于加密机制。这就是大多数基于区块链的加密货币维持安全的方式；因此，它构成了加密货币的本质。\n\
  \n早在 2009 年在一个加密留言板上，比特币的创始人`中本聪`（Satoshi Nakamoto）提出了一种解决双花费问题的方法，这个问题长期一直是数字货币的阿喀琉斯之踵。双花费发生在同一个加密单位可能被花费两次，这将破坏人们对其作为在线支付解决方案的信任，并使其变得基本毫无价值。\n\
  \n`中本聪`建议使用一种点对点的分布式账本进行时间戳标记和加密保护，这导致了我们今天所知的区块链的诞生。与所有技术一样，加密将演进以适应安全数字环境的需求。随着区块链和加密货币在行业和范围内日益普及，这一点尤为如此。\n\
  \n\n\n\n\n# 以太坊概览\n\n以太坊自称为“世界上可编程的区块链”。它与比特币的区别在于，它是一个可编程的网络，作为金融服务、游戏和应用程序的市场，所有这些内容都可以使用加密货币\
  \ `Ether` 进行支付，并且免受欺骗、盗窃或审查。\n\n以太坊由一小群区块链爱好者于 2015 年 7 月推出。他们包括 `ConsenSys` 的创始人\
  \ Joe Lubin，`ConsenSys` 是一家使用 `Ethereum` 网络的区块链应用程序开发开发者。另一位共同创始人维太林·布特林（Vitalik\
  \ Buterin）被认为是以太坊概念的创立者，目前担任其 CEO 和公众形象。布特林有时被描述为世界上最年轻的加密货币富翁。\n\n`Ether` 加密货币设计用于用于\
  \ `Ethereum` 网络内部。然而，像 `Bitcoin` 一样，`Ether` 现在已成为某些商户和服务供应商接受的支付形式。`Overstock`、`Shopify`\
  \ 和 `CheapAir` 是接受 `Ether` 支付的在线网站。\n\n以太坊的创始人是最早考虑区块链技术在虚拟货币安全交易之外用途潜力的人之一。其 `ETH`\
  \ 加密货币的创建主要是为了作为在其平台上构建的应用程序的支付介质。\n\n它对黑客和其他窥探者的免疫力为存储私有信息开启了可能，从医疗记录到投票系统不一。它对加密货币的依赖为程序员在网络上创建和营销游戏以及业务应用提供了机会。\n\
  \n## 安全与历史\n\n区块链可能对黑客攻击具有免疫力，但并不是因为没有人尝试过。在 2016 年，一名恶意行为者盗取了价值超过 5000 万美元的 `Ether`，这些资金是为一个名为\
  \ `The DAO` 的项目筹集的，该项目是一组由第三方创建并源自以太坊软件平台的智能合约。这次成功的抢劫事件被归咎于一个第三方开发者。\n\n以太坊社区选择通过创建“硬分叉”来撤销盗窃，使现有的区块链失效并创建了第二个\
  \ `Ethereum` 区块链。原始链被称为 `Ethereum Classic`（经典太坊）。\n\n截至 2021 年 5 月，`Ethereum` 是市场上第二大虚拟货币，仅次于\
  \ `Bitcoin`。流通中的 `ETH` 数量在 2018 年超过了 1 亿。与 `Bitcoin` 不同，`ETH` 的生成数量没有限制。\n\n## 以太坊\
  \ 2.0 与机制\n\n以太坊目前正在进行一项期待已久的升级，被称为 `Ethereum 2.0`，旨在允许网络进行扩展，同时解决过去减慢其速度的拥堵问题。\n\
  \n你会如何用最简单的语言向某人解释 `Ethereum`？这相对容易。`Ethereum` 和任何区块链一样，是一个被设计为不可黑客的信息数据库。`Ether`\
  \ 或 `ETH` 是用于在区块链上完成交易的加密货币。\n\n与传统数据库不同，区块链中的信息被组织成由数据“区块”组成的按顺序的“链”。例如，每笔 `Ether`\
  \ 硬币交易都必须经过验证，并作为额外的区块记录在在该硬币唯一的区块链上。这种在顺序中记录每笔交易的过程就是为什么区块链经常被比作账本。\n\n以太坊区块链存储的不仅仅是\
  \ `Ether` 货币的交易记录。它允许软件开发者创建名为 `dApps` 的游戏和业务应用程序，并将它们推给用户。这些用户希望利用在万网上存储敏感信息时相对较低的风险。\n\
  \n## 与比特币的比较\n\n但它比 `Bitcoin` 及其竞争对手更好吗？在某些方面确实如此。与 `Bitcoin` 区块链不同，`Ethereum` 的创建并不是为了支持加密货币。`Ether`\
  \ 加密货币的创建是为了为构建在 `Ethereum` 区块链上的应用程序提供内部货币。\n\n## Cardano 项目\n\nCardano 是一个第三代权益证明（PoS）区块链平台，旨在成为工作量证明（PoW）网络的更高效的替代方案。基础设施负担、增长成本、能源消耗和交易缓慢限制了以太坊等\
  \ PoW 网络的可扩展性、互操作性和可持续性。\n\n工作量证明（PoW）区块链以太坊的创始人查霍斯金（Charles Hoskinson）理解这些挑战的影响，并从\
  \ 2015 年开始开发 Cardano 及其主加密货币 ada，并在 2017 年推出了该平台和 `ADA` 代币。\n\nCardano 平台运行在 `Ouroboros`\
  \ 共识协议上。`Ouroboros` 由 Cardano 在基础阶段创建，它是第一个被证明是安全的 PoS 协议，也是第一个受学术研究指导的协议。Cardano\
  \ 路线图中的每个开发阶段（或时代）都以基于研究框架为基础，将同行评审的见解与基于证据的方法相结合，以推进并实现与区块链网络未来方向和 `ADA` 代币相关的里程碑。\n\
  \n\n\n\n\n2017 年，Cardano 发布了其原生加密货币 ADA，该货币以 19 世纪著名的数学家阿达·洛夫莱斯（Ada Lovelace）的名字命名。洛夫莱斯被认为是世界上首批计算机程序员之一，因为她首次发表了关于用于类计算机“分析引擎”的机器算法的想法。Cardano\
  \ 项目本身以意大利全才学者杰罗拉莫·卡尔诺（Gerolamo Cardano）的名字命名。对洛夫莱斯和卡尔诺的致敬仅仅是这一极具前景的区块链和代币背后团队向那些使整个项目和系统成为可能的先驱者致敬的另一个例子。\n\
  \nCardano 的主要应用在于身份管理和可追溯性。前者可以用于简化和优化需要从多个数据源收集数据的流程。后者可以追踪并审计产品从源头到成品的制造过程，并可能从上消灭伪造品市场。\n\
  \nCardano 协议生态系统进展的监督是去中心化的，Cardano 的合作伙伴共同承担着责任：Cardano 基金会、IOHK 和 EMURGO。Cardano\
  \ 基金会是一家非营利组织，负责 Cardano 品牌的主要监督和管理。该基金会提升协议在全球范围内的可见度，培养用例机会，并与政策制定者、监管机构和学术界建立联系。\n\
  \nIOHK 是负责构建 Cardano 的软件工程和技术公司，拥有一个致力于促进区块链教育的研究部门。IOHK 与学术合作伙伴紧密合作，不仅是为了进一步履行其教育使命，还通过使用最新的同行评审科学研究为平台实施前的更新提供支持，以提高\
  \ Cardano 协议的长期可扩展性。EMURGO 是全球技术合作伙伴，负责推动 Cardano 协议的商业化应用，将各广泛的业务整合到其区块链系统中。\n\n\
  Cardano 背后的组织发布了三个产品：Atala PRISM、Atala SCAN 和 Atala Trace。第一种产品被定位为一种身份管理工具，可以提供服务的访问权限。例如，它可以用于验证开设银行账户的证明或获得政府援助的资格。另外两个产品则追踪产品在供应链中的历程。\n\
  \nCardano 还在开发一种创新的合约平台，该平台将为开发企业级去中心化应用提供稳定性和安全性。不久后，Cardano 团队计划使用一种名为 Project\
  \ Catalyst 的民主链上治理系统来管理项目的开发和执行。他们还将改造其国库管理系统，使用 Project Catalyst 资助未来的成本。\n\nCardano\
  \ 区块链分为 Cardano 结算层 (CSL) 和 Cardano 计算层 (CCL)，将 Cardano 与普通的创新合约平台隔离开。以太坊运行单层架构，这导致它经历了网络拥堵、交易速度慢和高\
  \ Gas 费的问题。\n\nCardano 试图通过 CSL 和 CCL 解决这些问题。其 CSL 层有助于点对交易，例如用户之间的代币传输。CSL 是 Cardano\
  \ 的余额账本。Cardano 使用权益证明共识算法（`Ouroboros protocol`）生成新区块并确认交易，旨在改进比特币的工作证明协议。\n\nCCL\
  \ 层是 Cardano 真正脱颖而出的地方。CCL 为区块链的计算需求提供支持，实现了智能合约的执行。\n\n该层与结算层分开运行，以便在需要时提供灵活性。其链下提供了更大的数据存储灵活性，其访问模型允许用户在验证交易时创建自定义规则。\n\
  \n高费用一直是 DeFi 领域的限制因素。随着锁定价值创下新高，这些项目的吸引力不断增加，以太坊的 Gas 费让它们成为了一项昂贵的尝试。Cardano 旨在通过其\
  \ Mary 升级修复这一系列问题。\n\nCardano 开发者现在可以创建自定义代币，或从其他区块链将项目导入 Cardano 网络。这可能让像 DeFi\
  \ 和 NFT 生态系统这样令人兴奋的项目受益。\n\nCardano 的 Mary 升级最终能让这个曾经的落后者成为以太坊的严肃挑战者吗？当 Cardano\
  \ 正在创新时，其他区块链平台——包括以太坊——也在解决可扩展性和可持续性等问题。\n\n但在技术领域，获胜的并不一定是最好的技术，而是拥有更好商业策略的技术。时间将证明\
  \ Cardano 的非洲和财富五百强策略是否会胜。\n\nCardano 的哪些之处引起了它周围关注热度的提升？从表面上看，它看起来与市场上的许多其他代币并无异。它具有波动性，并有其自身的起伏；它可以像以太坊以及许多其他与比特币竞争并试图挑战比特币的代币一样，在许多在线交易所进行交易。那么，到底是什么让\
  \ Cardano 如此独特呢？\n\n它的知名度、背后的人，以及驱动 Cardano 的科学技术应该是吸引投资者的主要特征。仅仅因为它是由那些让以太坊运行起来的同人组装并启动的，对许多人来说就是一个巨大的吸引力。而运行\
  \ Cardano 的区块链技术只是这些极具前景代币的锦上添花。\n\n但也有缺点，当你把钱投入 Cardano 时需要考虑这些因素。首先，它的系统、技术和功能是有限的。Cardano\
  \ 确实建立在开源区块链之上，社区的其他人可以对其进行调整和改进。这是一个至关重要的特征，是一个让 Cardano 更具吸引力的巨大优势。然而，它也很难精通，并不是最容易被企业和业务采用的技术。它需要大量工作，并且对新程序员来说具有挑战性。运行\
  \ Cardano 的基础部分复杂、错综，并且具有陡峭的学习曲线。尽管它对任何想尝试的人开放，但不太可能很快就能在许多企业和其他代币中看到 Cardano 系统，因为精通它具有挑战性。\n\
  \n尽管有这些缺点，Cardano 仍然是最有前景的代币之一。有很多人把钱投入 Cardano 是理由的，这不仅仅是因为它背后的团队。\n\n# 第五章：山寨币\
  \ (Altcoins)\n\n你已经学习了加密货币整体以及它最受欢迎、广为人知的代表：比特币。事实上，当人们谈论加密货币时，几乎都会提到比特币，因为它是席卷世界的货币，向那些最顽固的反对者证明了所有类型加密货币的潜力。\n\
  \n\n\n\n\n这些其他形式的加密货币是什么？它们被称为山寨币（altcoins）——而且种类非常多。但它们到底是什么？它们是如何工作的？它们为什么存在？让我们深入探讨。\n\
  \n# 为什么会有山寨币？\n\n山寨币是 `Bitcoin` 的替代方案，它们的存在是为了扩展加密货币的领域，并让投资者和买家在进入这个蓬勃发展的加密货币市场时有更多选择。这就是山寨币存在的原因，也是最礼貌的说法。其他原因导致了山寨币的诞生——以及更多它们变得如此受欢迎的原因。\n\
  \n从本质上说，山寨币的产生是因为其他人有机会体验财务增长的机会。所有加密货币背后的概念是，人们可以买卖商品并使用一种新形式的数字支付来付款。这确实是事实。然而，加密货币之所以如此流行还有其他原因。首先，它是一个投资机会，是人们将资金投入市场并追随其成功的一种。如果你操作得当，你可以向加密货币投入几百美元，并带走数千美元的回报。这对许多人来说是非常兴奋的。在全球范围内启动山寨币的企业和企业家看到了赚钱的机会，赚大钱的机会。他们知道，如果他们尽早入场并提供可能为许多人带来巨大财务收益的东西，他们就会找到粉丝和愿意接受这一获利机会的人。\n\
  \n是的，山寨币的存在是为了人们能够赚钱。这一事实并不可羞耻。然而，为什么人们不投资 `Bitcoin` 呢，特别是它已经被证明是最流行、最成功的加密货币形式？首先，这些人认为，他们正在启动或购买的山寨币有可能成为下一个大事件，成为一种威胁到\
  \ `Bitcoin` 在食物链中顶端地位的加密货币。加密货币领域永远有扩张和成功的空间；谁能说下一个山寨币不会是迄为止最大的一个呢？\n\n此外，许多人关注山寨币是因为它们可能具有\
  \ `Bitcoin` 不具备的特性。例如，由于其经历的处理过程，成功发送或接收 `Bitcoin` 需要时间。硬币需要被发送；它必须经过整个加密挖矿过程，以验证一切都是准确且合法的。这比在当地商店将借记卡滑过机器所需的时间要长得多。然而，某些山寨币加快了这一过程。凭借市场上特定的山寨币，你可以快速进行购买并完成支付。对于这些某些币来说，这是一个巨大的优势，也是一些人被它们吸引的重要原因。另一个事实是，某些山寨币比\
  \ `Bitcoin` 更匿名。虽然大多数使用加密货币购买物品的人都是完全合规的，没有做任何丑闻或犯罪活动，但某些人正在使用加密货币支付非法商品和服务。为什么不使用一种无法追踪你的身份或位置的山寨币呢？某些山寨币仅凭一个原因就吸引了人们。\n\
  \n山寨币的存在是因为加密货币世界是一个蓬勃发展的市场，充满了许多潜在的买家、投资者、发明者等。这是一个正在寻求不断扩张的行业领域，来自世界各地的人都希望进入其中。他们正在寻找替代方案、下一个突破，或者仅仅是一个让他们赚点钱的机会。这就是山寨币存在的原因。加密货币世界的潜力是巨大且无止尽的，以至于山寨币开始利用这种潜力。\n\
  \n## 山寨币的历史\n\n虽然山寨币领域现在非常拥挤且仍在不断增长，但有时情况有所不同。曾有一段时间，只有一个山寨币在与 `Bitcoin` 竞争。尽管如此，在当时，根本谈不上竞争。\n\
  \n第一个山寨币是一次实验，为了看看山寨币的理念是否可行，或者仅仅是一个永远无法落地的希望和梦想。然而，像加密货币一样，山寨币最终变得强大，并成为一个与 `Bitcoin`\
  \ 的流行度和潜在增长相衡的整个行业。\n\n第一个山寨币是一次实验，为了看看山寨币的理念是否可行，或者仅仅是一个永远无法落地的希望和梦想。然而，像加密货币一样，山寨币最终变得强大，并成为一个与\
  \ `Bitcoin` 的流行度和潜在增长相衡的整个行业。（*注：此处由于原文中存在段落重复，根据指令“不要重复输出原文”原则，此处译文已按翻译逻辑处理，或遵循原文结构进行翻译。若原文确实重复，翻译亦应对应其结构。重新检查原文，发现确实存在重复，以下为按原文结构完整翻译。*）\n\
