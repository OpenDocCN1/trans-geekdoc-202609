  \n\n\n\n\n## 纸钱包\n\n纸钱包（Paper wallets）顾其实名，仅仅是打印有公私私钥的纸张。密钥可以以 `QR code` 的形式发布。它们被视为一种冷钱包，因为人们无法在线访问它们。纸钱包具有争议，因为它们既是安全的（因为只有纸张持有者才能拥有密钥），同时，如果纸张本身丢失，密钥就可能会泄露。此外，如果纸张形式损坏，可能会导致许多问题。`Bitaddress.org`、`Verge\
  \ paper wallet generator` 和 `Walletgenerator.net` 是人们经常使用的纸钱包生成器。\n\n## 如何选择加密货币钱包？\n\
  \n正如我们所看到的，有许多类型的加密货币钱包，而且每种类型都有许多其他公司提供的钱包。这对于某人来说可能并不清晰。因此，为了更好地选择正确的加密货币钱包，应该考虑以下因素：\n\
  \n**价格**：加密货币钱包的价格或成本是首要考虑的因素。网上有很多免费的在线钱包，但它们的安全性较低；如果人们负担不起更好的钱包，就可以选择它们。与此同时，来自\
  \ `Ledger` 等公司的硬件钱包可能会稍贵一些，但它们非常安全，应该供资产组合丰富的人使用。\n\n**安全性**：不同的加密货币钱包提供不同程度的保护。获取加密货币钱包的全部目的是为你的加密资产提供一个安全的网关。在选择之前，应该仔细评估与不同钱包相关的风险。硬件钱包的安全性通常比热钱包高；然而，即使在软件钱包之间，某些也比其他的更安全。如果一个人规避风险，他们可以购买软件钱包。\n\
  \n**用户界面**：用户界面对于投资者的体验至关重要。初学者通常从更易于使用的加密货币钱包开始，然后再转向更具技术性的。移动钱包（即移动应用程序）提供了最易用的平台。纸钱包也被认为易于使用，特别是对于那些不热于使用数字软件的人来说。\n\
  \n**灵活性兼容性**：加密货币钱包提供的兼容性和移动性也是重要的因素。如果人们想随时使用钱包并从任何计算机或设备访问，那么推荐使用在线钱包甚至是移动钱包。桌面钱包和硬件钱包的移动性较差，因为人只能有时携带它们。如果钱包可以在手机、桌面电脑、笔记本电脑等多个设备以及\
  \ `Windows`、`Mac`、`Linux`、`iOS`、`Android` 等操作系统上使用，那么它就被认为是一个好钱包。\n\n**支持的货币**：还必须考虑钱包支持的加密货币数量。如果一个人计划拥有包含许多不同加密货币的资产组合，最好获得一个支持多种货币的钱包。然而，如果一个人只投资单一货币，那么获得一个专为该货币设计的钱包即可。\n\
  \n**备份**：钱包的备份是必要的。在某些情况下，人们由于钱包损坏而无法访问加密资产，这可能导致严重的担忧。即使在备份的情况下，也有多个价格不同的钱包。\n\n\
  **多重签名 (Multisig)**：多重签名是特定加密钱包上的一种新功能。这意味着多个人持有私钥。为了进行一笔交易，需要所有的私钥。即使其中一个私钥被泄露或被黑客攻击，钱包仍然是安全的。这种功能对于家庭和合作伙伴来说是理想的。\n\
  \n**透明度**：钱包提供商必须是透明的。基于开源的钱包提供商通常是安全的。这是加密钱包的一种选项。\n\n**隐私**：用户的隐私至关重要；在选择钱包时，应该查看所有的\
  \ `KYC` 流程，以确保加密钱包不会泄露此类数据。这些是必须考虑的因素；然而，人们可以根据自己的选择来决定。这可能是一个特定的加密货币钱包。大多数交易所平台都有自己的钱包；然而，它们比加密钱包风险更大。\n\
