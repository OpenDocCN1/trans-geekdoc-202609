  \n## 边玩赚的潜力\n\n通过探索一些吸引投资者和游戏玩家的热门边玩赚（`P2E`）项目，发现这种模式的巨大潜力。\n\n发现风靡游戏世界的最新、最棒的 `P2E`\
  \ 游戏。从刺激的冒险到策略挑战，这些游戏提供了无尽的娱乐时间和获得真实奖励的机会。加入数百万迷于这些精彩游戏的玩家行列，体验终极的游戏体验。\n\n游戏行业的边玩赚模式具有巨大的潜力，正如我们的发现所示。在沉浸于不断演变的平台的同时，体验一种新颖且兴奋的财富创造方式。体验游戏与金融汇的惊险冒险。对于许多人来说，这是激动旅程的完美起点。\n\
  \n体验边玩赚游戏的快感，赚取轻松转换为加密货币的游戏内奖励。通过我们基于区块链的平台体验新水平的游戏。赚取专属非同质化代币（`NFTs`）和游戏内资产，这些资产可以在热门在线市场上轻松交易或出售。通过\
  \ `Axie Infinity`、`Decentraland` 和 `The Sandbox` 等热门作品探索区块链游戏的惊险世界。\n\n## 游戏挖\n\n\
  `Game Mining` 是通过完成任务或关卡获取加密货币代币的创新方法。它类似于边玩赚模式，但侧重于挖掘。体验通过玩 `Alien Worlds` 和 `RollerCoin`\
  \ 等热门游戏来制作加密代币的快感。这些游戏允许玩家在游戏生态系统中使用票据，或在顶级加密货币交易所进行交易。\n\n在玩你喜爱的游戏时，解锁稀有物品、角色甚至房地产等专属游戏内资产。通过将你的数字资产表示为\
  \ `NFTs` 来解锁其潜力。在 `CryptoKitties` 和 `Punks` 等平台上对其进行交易或出售。\n\n# 书籍 #2\n\n## 初学者：比特币与区块链技术详解\n\
  \n## 引言\n\n想象一个钱不再装在钱包里的世界。想象一个你只需简单点击即可买卖物品的世界。想象一个你永远不需要访问银行或任何其他主流金融机构的世界。\n\n\
  现在，想象这种新的赚钱系统影响的不仅是你你的消费和储蓄的方式。想象这个新世界改变了政治的运作方式、人们被对待的方式以及贫困公民被对待的方式。\n\n### 加密货币与\
  \ P2E 的未来\n\n这听起来可能像小说情节，或者是对未来过度乐观的人的白日梦。但这样的世界是存在的。我们距离这样一个世界成为我们的生活仅仅一步。我们正处于一个社会的边缘，在那里我们以不同的方式制造、储蓄和花费资金。虽然这些变化对某些人来说可能是微小的，但它们是巨大且产生影响的。\n\
  \n我们还处于一个社会的边缘，在那里现状将发生剧烈的动摇和改变——向更好的方向发展。世代以来，那些被视为图腾柱底端的人受到的对待一直没有像顶端的人那样好。这导致了阶级之间巨大的财务差距以及一个不公平的世界。这个系统倾向于富人，让他们变得越来越富有，而穷人变得越来越贫穷。但这个新提议的金融系统可以消除其中的许多现象，并创造一个公平的竞争环境。它可以真正帮助人们，并保持事物的平衡与公正。\n\
  \n\n\n\n答案就是你。这套全新的金融系统变革行业、企业和人类的力量掌握在你手中。这是因为解锁这一切的关键在于加密货币。而驱动加密货币的动力是区块链。加密货币和区块链都由人们来驱动、维护和使用。它们并不受制于银行、抵押贷款贷款者和经纪公司等大型金融机构的随意摆布。不，它们是由那些将从中受益的人们使用的：即那些渴望加入游戏并帮助让每个人都变得更加公平的普通公民。\n\
  \n加密货币和区块链技术可以改变世界，这是非常准确的。为什么这是真的？因为这一切已经在发生。你可能不知道，但区块链和加密货币已经在改变着大小事务的运作方式。你可能没有察觉到，但事实确实如此。在整个世界范围内，在无数企业中，这两项强大的未来电子工具正在成为当下的益处，并动着着局势。\n\
  \n一旦你理解了加密货币及其区块链引擎，你就会看到它是多令人印象深刻。你也将知道为什么投资、信任并使用它是如此明智。你会发现，加密货币不仅仅是买卖产品。它远比交易加密货币（像人们在华尔街交易商品那样）要有意义得多。不，加密货币的意义远不止于。它是世界上规模最大、最强大、可能影响最深远的无声抗议。\n\
  \n你还会看到，区块链不仅仅是全球数百万人“挖”硬币并以此获利。区块链不仅仅是为了驱动各种加密货币。不，区块链关乎帮助企业和整个巨型行业运行得更好、更快、更安全。区块链关乎更新和增强那些在不知不觉中已经停滞不前且过时的系统。\n\
  \n你会经常听到加密货币和区块链这两个术语被放在一起。对某些人来说，它们是可以互换的。这是因为它们之间的联系如此紧密；它们确实在携手合作。事实是，没有其中一个，另一个就不存在。尽管它们在所有工作中仍然紧密关联并共同使用，但它们也是分离的，并以巨大且令人印象深刻的方式运行。加密货币和区块链都在各自发挥作用，并扩展到世界的其他地区，不再被迫在全球范围内手牵手。看到它们如何演变和增长是奇妙、令人兴奋且令人赞叹的。知道它们的局限是无限的，这非常令人兴奋。\n\
  \n毫不夸张地说，区块链和加密货币可以改变世界——并改变你的生活。它们确实可以做到，而且在某些方面，它们已经做到了。但在你理解它们能为你准备了什么之前，你必须真正理解它们是如何工作的。你需要知道它们在做什么、为什么这样做、以及如何做，才能看到它们对你产生的影响。\n\
  \n一旦你理解了所有这些，你就会看到加密货币和区块链如何帮助你，并以某些彻底的方式彻底你的生活。你可以利用它来优势进行投资、消费、储蓄，并应对一个全新的金融格局，这一格局正在全球范围内创造数百万美元的财富并改善企业。\n\
  \n首先，你需要知道加密货币是什么。更重要的是，你需要理解它为什么产生。加密货币和区块链有一段深厚、丰富的历史，尽管两者都只有十多年的历史。让我们回到一切开始的地方，找出它是开始的。更重要的是，让我们找出它为什么开始的。\n\
  \n\n\n\n我不清楚你对加密货币或比特币有何种程度的经验，但也许我们应该从比特币的定义开始这本书，并结束这段引言……比特币是第一个可以完全通过数字方式确认的限量资源。\n\
  \n通过 `Bitcoin` 探索加密货币世界，这是一种利用密码学确保顶级安全的数字货币。通过 `bitcoins` 体验纯数字货币的便利性。与传统货币不同，`bitcoins`\
  \ 没有物理形式。相反，它们由与公钥和私钥相关的余额表示，这些余额可以解释为通过复杂的数学加密算法链接的长数字和字母。\n\n`Bitcoin` 这种“限量资源”引起了全球投资者和精通技术的人士的关注。由于\
  \ 2100 万 `bitcoins` 的硬上限，稀缺性的潜力将需求推向了新高度。`Bitcoin` 背后的天才大脑中本·中中丰将这一限制嵌入了 `code`\
  \ 中。由于已挖掘的 `bitcoins` 数量不断增加，挖掘新的 `Bitcoins` 变得越来越具有挑战性且耗费资源。同样，`Bitcoin` 的行为类似于金银等稀缺商品。\n\
  \n探索在 `Bitcoin Blockchain` 上验证交易的无缝过程，在那里确认完全通过数字手段实现。体验 `Bitcoin` 交易安全且透明的世界。“矿工”网络通过复杂的数学问题求解不疲倦地验证每笔交易。一旦通过验证，交易就会被添加到不可篡改的\
  \ `Bitcoin blockchain` 中，确保安全性和透明度。\n\n挖掘是一个完全数字化的过程，使 `Bitcoin network` 能够确认交易并防止重复支出，而无需信任的第三方。挖掘也是创建\
  \ `Bitcoins` 的方法名称。`Bitcoin` 是一项前所未有的发展，因为它是一种完全数字化的有限资源，利用了去中心化的验证系统。\n\n# 第一章：加密货币\
  \ 101 - 它是什么？\n\n什么、如何、何地、何时以及为什么？你过去确实被告知，当你试图弄清某事、理解它并真正掌握它时，这些是最重要的问题。这些是真正理解一个主题或事件的基础基石。有了这些，你就会对某事有所认知。\n\
  \n对于加密货币也是如此，它已被证明对数百万人来说非常复杂。仅仅是这个词就足以让人们望而却畏，而不吸引他们去学习更多。无数人认为加密货币是一个超级先进、复杂且令人生畏的系统，复杂到令他们无法理解。虽然加密货币非常深奥，其策略也很困难，但不应该吓到任何人。当你将其拆解时，加密货币是简单的，特别是在研究它的原则、信仰和概念时。\n\
  \n谁？什么？何地？何时以及为什么？关于加密货币的大部分信息在我们讲述它的故事时会显现，但最好的方式是从问“为什么”开始——在涉及加密货币时，“为什么”是如此宝贵的。与许多其他市场的资产不同，加密货币的创造不仅仅是为了让人们赚取数百万美元。最初，加密货币是抗议者发声的一种方式。权势者收到了一条信息。它的重要性无论如何强调都不为过。加密货币开始——且仍然持续——的原因之一是它的意义和信息传递的力量。许多人相信加密货币是因为因为它不仅仅关乎金钱。它所代表的、它所象征的，是他们信仰的。\n\
  \n创建加密货币并从初就捍卫它的人是独特的投资者，正如你在学习加密货币时将看到那样。他们的目标是表达观点并拥有声音。一条信息正在发送中，一个系统正在被改变。赚钱只是许多目标之一。事实上，这些人为了正义的事业和信念开启了比特币和加密货币。\n\
  \n许多这些充满活力且投入的交易者直到今天仍参与着加密货币市场，这就是为什么你理解他们为何做出那样的决定是至关重要的。由于他们打造的市场是按照他们的形象创建的，你将能够更好地理解他们。一旦你知道先驱们在想什么，你就能更好地导航加密货币。也许你甚至持有着与他们相同的原则。\n\
  \n# 什么是加密货币？\n\n这是一个让许多人困惑的百万美元问题，尽管它很简单，答案也显而易见。尽管它简单，在你掌握其他任何事情之前，你必须掌握它，尤其是当加密货币已经普及并变得越来越成功时，仍有许多人在问这个问题。\n\
  \n所以，这个困扰并困惑许多人的问题是：什么是加密货币？有多少人问过这个问题？又有多少人能够准确地回答？\n\n它是一种数字货币。这看起来不是很直白吗？`Crypto`\
  \ 提供的远不止于此，但这是主旨。与传统货币（如借记卡、信用卡或钱包里的现金）不同，所有加密货币都是用于购买商品和服务的数字货币。尽管有些人可能如何想，加密货币可以用来购买任何东西。某些地方允许你使用加密货币购买机票、家居用品、食物甚至是汽车。当你思考加密货币能做什么时，把它看作与\
  \ `Dollar`、`Yen` 或全球范围内看到的任何其他支付形式没有区别。\n\n加密货币的独特之处在于两点：它是如何持有的以及如何保持安全的。这是对待金的两种截然不同的方法，也是人们不理解它或（更糟糕的是）恐惧它的两个主要原因。当你听到人们谈论加密货币时，很多人会谈论它的安全性。许多人认为加密货币是不安全的，那是因为他们不知道它的运作方式。如果他们了解真相，就像你一样，他们会发现加密货币比世界上任何其他货币都安全得多。\n\
  \n\n\n\n\n加密货币另一个激进且独特之处在于它是如何确保安全的。这便引入了 `blockchain`（区块链）的概念。区块链是一个巨大的、不断变化的在线账本系统，支持每一笔加密货币交易的检查。区块链遍布全球计算机，是一个活生生的生命体，是一段让每笔交易都可见且可追溯的巨大代码。它是追踪加密货币世界的一种完全不同的方式，我们稍后会详细介绍。但请放心，无论区块链有多复杂和新颖，它也是加密货币最关键、最具革命性的方面之一，并使其它的安全与可靠。\n\
  \n有太多的人将加密货币视为虚假货币，认为它是不真实的，不应该像看待传统货币那样看待它。但这种观点实在太短视了。加密货币不同吗？是的。在变得像美元一样强大之前，它是否仍然有很大的增长空间？是的。但它是否拥有与任何其他货币同样的潜力和承诺？它确实如此。尽管某些事物是新颖且截然不同的，但它必须比其同类产品更为关键。曾几何一个时代，电视看起来是激进的，飞机、互联网等等也是如此。\n\
  \n现在，仍有数百万人将加密货币视为一种奇特的小众货币，只有少数人在在线使用。这种说法是完全错误的。全球不仅有数百万人投资和使用加密货币，而且它现在已是小众了。在过去的十年里，它增长得如此巨大。如果人们知道它是如何开始的，以及它曾经价值有多小，他们再也不会称加密货币为小了。\n\
  \n# 为什么要用加密货币？\n\n我为什么应该使用加密货币？你会反复听到这个问题。甚至你可能在问自己：我为什么要读关于它、学习它，或者对它再考虑一下？为什么不使用我熟悉的货币形式，即我一辈子以来所知的传统货币呢？既然我现有的已经很好了，为什么要冒加密货币的险呢？\n\
  \n这些都是有效的问题，也是许多人会问。答案对每个人都不同，人们有很多正当且合理的理由投身加密货币领域。然而，典型的回答是，加密货币比世界上任何其他形式的货币都更有潜力、承诺和力量。它在多个方面都有价值，使其对寻求完善财富管理方法的人和寻求投资的人来说都具有吸引力。\n\
  \n有些人购买加密货币是因为他们相信它的事业以及它代表的理念。这就是为什么当加密货币首次推出时，有这么多人涌入加密世界。这是一种抗议形式，表达观点并采取立场。其他人使用加密货币是因为他们认为它有机会成为未来的货币。他们看到人们可以走进街角商店，用\
  \ `crypto wallet`（加密钱包）而不是传统货币支付。还有人投资加密货币是因为他们想顺应市场并获利。就像股市一样，有些人购买加密货币是为了顺应市场的浪潮，在正确的时间变现，并带着比开始时更多的钱离开。这是一项明智的投资，数百万从从中赚到大额金钱的人已经证明了这一点。\n\
  \n由于这些原因，现代加密货币应该被视为一种货币，也应视为一种商品。这意味着它是你可以像现金一样可以消费的东西，也可以进行投资和交易的东西。本质上，如果你拥有任何加密货币，你就是持有了该加密货币的股票。它所属的市场已经又一次证明了，它可以为参与者创造丰\
  \ amount 的收益。\n\n与许多其他资产和行业不同，人们有太多理由进入加密货币领域了。这不仅仅有一个坚实、肯定的理由，而是成千上万的理由。每一个都是有效的，可以独立存在，并且足以动摇最谨慎和不确定的投资者。加密货币有许多不同的可能用途、许多吸引人的特征以及许多令人兴奋的方面，其原因数不胜尽且似乎在不断增长。\n\
  \n事实是，投资任何东西都有风险。投资像牛奶这样常见实用的东西仍然可能有风险，因为你无法控制你周围的世界，也无法阻止投资者或市场。如果你在寻找某种无风险的东西，那么投资加密货币——或任何东西——都不适合你。\n\
  \n\n\n\n此外，加密货币已成为巨大的颠覆者。比任何时候都，加密货币向许多长期深耕投资领域的人传递了一个信息。加密货币发出了一道先发制警告，震动了现状，并向年轻和老的世界展示了：现状并非是事物演变的唯一方式。事物可以改变，项目可以被修改，即使在几代人之后也是如此。\n\
  \n加密货币不仅仅是人们赚取数百万的一种。它向世界展示了技术的潜力和新的思维方式。不要误会：加密货币不仅仅是在一个激进的自由市场上交易的资产。它是一条信息，是一场无声却依然响亮的抗议。任何不承认这一点的人都忽视了加密货币的总体概念和理想。\n\
  \n你可能会认为，像加密货币这样充满前景且具有突破性的东西，在全球范围内应该只有粉丝。然而，事实并非如此。人们需要帮助来理解它。即使是研究最深、最精通的交易员也有基础问题。是的，即使是那些研究了华街几十年、并在投资、买入、卖出和交易中积累巨额财富的人，甚至无法真正表达加密货币是什么。\n\
  \n有无数又无数的人，无论专业与非专业，都需要学习加密货币是如何运作的、为什么运作以及它是关于什么的。混乱充斥着，盲目的投机、谣言和怀疑也如影随形。许多人将加密货币视为一种偶然、一种不存在的事物，或者是一个像金字塔骗会偷走你钱的大骗局。事实上，尽管这些观点是基于事实错误的假设以及缺乏知识和研究，但几乎每个关于加密货币的信念都是坚定且固执成规的。\n\
  \n无论人们怎么说，加密货币并不是犯罪分子为了利用互联网中中腰包或做可怕事情而创造的阴险骗局。这与事实相去甚远。对于任何愿意投入市场的人来说，事实要精彩得多。事实是，加密货币是投资的最佳方式之一，进入一个仍然年轻新鲜且需要许多人充分估值的市场的深思方法。虽然许多人需要帮助来准确理解加密货币，但对于想要赚钱的人来说这没关系。如果你想成为一名活跃且成功的加密货币交易员，这对你是有利的。你对加密货币的知识越多，你掌握的力量就越大。一旦你真正理解了它如何运作、为什么运作以及未来可能如何运作，你赚大钱的机会就越大。\n\
  \n如果你十年前问专家是否应该投资虚拟货币，你会被他们嗤之以鼻。现在，情况已经扭转了。这种数字编码货币——加密货币是无可争议的，并被称为全球金融秩序的下一个前沿。加密货币将继续繁荣并存在很长时间，因为流通的种类超过\
  \ 5000 种。\n\n加密货币被视为投资领域内利润最高的资产。尽管它最初是作为法币驱动的传统金融系统的去中心化替代方案，但加密货币逐渐成为投资者存储资本的首选。`Bitcoin`\
  \ 和 `Ethereum` 等加密货币建立了良好的声誉。对于一种货币要保持稳健，它的供应、功能、安全协议和接受度必须到位。人们可以通过研究这些方面来评估加密货币是否是一项良好的投资。\n\
  \n是的，加密货币非常有潜力。一些人认为它比大多数传统形式的货币更有潜力。这是因为它代表的意义、它的功能及其表现，以及为驱动和保护它而建立的系统。\n\n是的，加密货币后的引擎是人们相信并投资加密货币的最大原因之一。这个引擎像一台润滑良好的机器一样创建并维持制衡。而这个引擎，就像加密货币本身一样，是由人民并为了人民而驱动的。使用和相信加密货币的人与那些关注它并确保一切运行顺畅且符合预期的人是同一群人。\n\
  \n加密货币引擎的重要部分被称为 `blockchain` 的东西。在某些方面，`blockchain` 比加密货币本身更复杂。事实上，无法否认 `blockchain`\
  \ 是一个巨大的系统，运行像一个永不睡眠、永不休息的有机体。有许多活动部件——数百万个。然而，像加密货币一样，`blockchain` 的基本假设和概念并不理解。一旦你掌握了它们并真正看到它们是如何以及为什么运作，它将开启投资、储蓄和交易的途径，让你获得一笔财富。\n\
  \n但 `blockchain` 不仅仅于此，这正是它具有如此潜力的原因。从医疗保健到自动化，从选举到交通、运输等，`blockchain` 正在找到触及全球行业的方法。`blockchain`\
  \ 证明它可以做什么——以及它如何以轻松高效的方式改变整个业务。由于这个原因以及许多其他原因，`blockchain` 的潜力是言语无法总结的。它最终拥有改变世界的力量。\n\
  \n# 第二章：加密货币的历史\n\n## 它是开始的？\n\n加密货币以及支持它的 `blockchain` 系统——自多年前构思以来已经走了很远的路。就像\
  \ 21 世纪及以前所有伟大的发明一样，这两样东西最初都是想法，是看似不可实现但从一开始就带有巨大前景的构思。它们在付诸行动之前，经过了精炼、构思和创造。但它们从哪里来？为什么要制造它们？为什么自从起，它们就一直被认为是革命性和激进的思想和理念？\n\
  \n危急时刻需要果断的措施。如果你在 21 世纪 00 年代中后期生活过，你就知道那个时期是多么绝望。事实确实如此，2000 年代后期混乱且令人不安的时代，在经历了多年对其进行投机后，促成了加密货币的诞生。现状已达到一个不再安全或稳定的界点，人们正寻求以某种重大、震惊的方式来震动它。这种震动导致了加密货币的实际实施。简而言之，它将改变世界。\n\
  \n记住那个时期经济状况如何非常重要。每一个行动都是一种反应。`Bitcoin`、`altcoins`、交易市场以及所有加密货币的起源，都是一个系统疯狂偏离正轨的反应。\n\
  \n美国和全球经济在 20 世纪 90 年代蓬勃发展。股市上涨，创造了数百万工作岗位，互联网改变了赚钱和消费的方式。数百万人感到快乐。在经历了 1980 年代末和\
  \ 90 年代初的衰退后，经济开始繁荣。几代人以来第一次，2000 年是令人兴奋且充满希望的。\n\n2000 年，许多人的财务状况。全球贸易日益增长，银行从许多限制其贷款能力的金融规则中解放出来，互联网也变得稳固且新颖。没有重大冲突允许了多个超级大国之间的石油和贸易。\n\
  \n互联网在不断增长。网站一夜之间增加。`Amazon` 和 `Google` 起始良好。它们重新定义了现实。许多人无法想象没有这些网站之前的生活。\n\n互联网的成功帮助了几家大公司。事物升级了。好事终有尽。几年后，互联网泡沫破灭，许多有前景的网站倒闭了。早期的互联网企业评估了每一个想法。许多继续了下来。许多消失了。投资者震惊。即使在好的时期，市场也只对某些公司仁慈。高处必落。美好会消逝。\n\
  \n\n\n\n\n当互联网陷入低谷时，房主和贷款申请者却过得很富裕——多年来银行贷款一直很困难。你需要良好的信用。由于政府的严格限制，美国银行在有限的贷款额度必须做出明智决策。银行与\
  \ 20 世纪 80 年代的过度扩张作斗争。这些限制导致数百万美国人无法获得梦想中的家。如果有资金，银行就会接纳他们。\n\n# 贷款标准的转变\n21 世纪初情况有所不同。华盛顿特区在多届政府执政期间让贷款人和银行贷款申请人的生活变得更加轻松。\n\
  \n保守的美国人改变了法规。这些结构在十年前消失了。新的心态鼓励打破规则和不受节制的企业精神。经过多年的调整，银行贷款标准在 20 世纪 90 年代末和 21\
  \ 世纪初有所放宽。许多银行对贷款和金额拥有完全控制权。在重大的立法变革中，任何人都可能拥有住房。银行向许多以前无法负担的人提供贷款。银行现在对敌恶性信贷客户进行折扣并偿还。在全国范围内，低于\
  \ 30,000 美元的买家购买了两居室的住房。\n\n## 系统的运作机制\n原因？因为旧规则被了。银行有更多的自由来刺激经济。银行签署了数十亿美元的贷款和租赁。美国人买房并消费获利。他们仍在扩张。\n\
  \n银行通过新方式从抵押贷款和借款人身上获得更多利润。债务让他们受益。当客户违约时，他们将抵押贷款出售给其他银行。银行购买债务。一家银行会购买客户债务，知道消费者或第三方会支付。购买债务的银行依然盈利。贷款和购买应收款为银行带来了资金。\n\
  \n这是一个聪明的系统，让银行和贷款公司从别人的痛苦中获得无限的资金。新房主的困苦让银行受益。系统崩溃了。这个腐败且关联的系统导致了这一切。\n\n# 金融网的崩溃\n\
  数百万人收到了欺诈贷款和抵押贷款。为什么不呢？银行赢了。他们可以收取抵押贷款，或将不良贷款和债务出售给其他银行以获利。收获比预期的要多。无法负担抵押贷款的新房主继续违约。许多人欠债。数百万的期款高达数万亿。\n\
  \n银行损失了钱，因为他们迅速将这些债务出售给各种金融机构。许多人无法支付，基于抵押贷款的资金需要更充足。债务销售未达预期。糟糕的是，购买那些债务的银行和金融机构也遭受了痛苦。他们购买贷款债务预期付款。糟糕的贷款人和借款人应该支付。银行亏了钱。\n\
  \n一个金融网交换了消费者债务。全球银行合作，因此认为其中一个失败是不可想象的。为什么如此不可能性？因为这种情况已经持续了数千年，如果这个网中的一个组件消失，其他也会消失。多米诺骨牌将撞毁金融世界——网络中断。贪婪和逐钱建立了一个共同体。单只船沉没了整个舰队。一场末日般的崩溃似乎是无法理喻的。\n\
  \n# 经济后果\n在缺乏制的情况下，它崩塌了。住房泡沫灾难性爆发。购房者停止了。银行和抵押贷款公司破产，向所有人贷款。在债务之后，他们变得一无所有。坏账和债务购买花费了数十亿美元。他们无法等待。大银行和公司需要收账。\n\
  \n这是一系列不断的经济震荡。每周，每月。糟糕的财务新闻堆积，损害了美国和全球经济。千刀万剐杀了美国经济。它们持续着。一切倒塌了。情况恶化了。\n\n华尔街最著名的名字在像商品一样交易债务后，陷入了这场巨大的灾难中。华尔街巨头们挣扎。所有人相互关联。银行、经纪公司、抵押贷款贷款者等。所有人瞬间死亡。\n\
  \n贷款停止了，影响了全球更多企业。没有钱，业务就会停止。银行需要更有活力来贷款或承担风险。在银行停止融资后，全球公司削减了开支、工时间和员工。一切冻结了。许多成功的企业失败了，因为银行不给他们贷款。在一次异常衰退期间，一些大公司以惊人的速度裁员员工。钱消失了。没有人可以借钱、贷款、工作或依靠银行。\n\
  \n# 2008 年危机与政治影响\n媒体和经济每天都在制造破坏。2008 年秋季，每天都有大型零售商、银行或公司倒闭。每个故事都被摧毁了。一些几十年历史的品牌关闭并裁了工人。失业率飙升。许多美国城市出现了帐篷村，因为家庭以惊人的速度被驱逐。有影响力的人看起来很害怕。那些放宽限制并允许银行为了他们的利益更改法律的官僚们现在正在修复一切。历史学家见证了\
  \ 1920 年代大萧条的开始。只有这次危机可能会让情况变得比那个历史低点糟。\n\n理解全球和美国的愤怒。大多数人是无辜的。因此，他们感到被骗了。大多数人避开了问题的贷款和昂贵的住宅。大多数人工作并储蓄。与此同时，有影响力的银行和政治家修改了系统以产生更多钱——一场所未有的经济崩溃。大多数人遵守规则，但计划是被操纵的，其扭曲的法律让人们处于危险之中。\n\
  \n非参与者也应该了解政治状况。银行和其他金融机构倒闭了，经济崩溃了，担忧和不确定性笼罩了美国最好的总统竞选历史。在华尔街和主街崩溃之前，选举花费了数百万。两个领先的候选人，亚利桑州参议员约翰·凯恩和伊利诺伊州参议员巴拉克·奥巴马试图适应这一新现实，并证明他们可以恢复经济和稳定。乔治·W·布什警告\
  \ 2008 年 11 月的获胜者一个独特的问题。长期危机。它在新总统任内生存了下来。\n\n他的冷静和奉献帮助奥巴马参议员在 2008 年 11 月获得压性胜利。这位具有历史意义的候选人面临数十年的风暴。总统后来预测了更深层的经济衰退和\
  \ 20 世纪 30 年代以来未见的短缺。奥巴马的乐观并没有帮助。\n\n2008 年，更多不匹配的机构失败了。CEO 和华盛顿权势人物的无能和阴暗破坏了这些巨型公司。如果他们失败，许多其他企业将随其后，摧毁数十年的经济。蜘蛛网正在解体，多米诺骨牌正在倒下，美国政府面临一个选择：让它们全部崩溃并摧毁全球经济，使美国一夜之间变成第三世界国家，还是用美国纳税人的钱支撑这些企业。政府在历史上最具争议的时刻之一选择了后者。\n\
  \n许多人对政府救助大银行、贷款者和华尔街巨头感到不快。大多数美国人意识到，如果不采取行动，世界将进入一个黑暗的金融时代，然而许多人对国会总统的选择感到不满。当主街遭受更多时，为什么要支持华尔街？为什么银行家和贷款者被雇佣而其他人在失业队伍中等待？感到被背叛，批准率下降。这些大公司违反了规定并因贪婪的行为逍遥法外，却获得了丰厚的报酬，而苦干的工人因为他们没做过的事失去了工作。\n\
  \n没有人被定罪。在数百万工作岗位和企业关闭后，经济恢复了。华尔街和大银行被豁免了。国会传了证人，一些人失去了高薪职业，但什么都没有改变。他们正在违反规则。对冲基金经理和\
  \ CEO 在赚数百万的同时炫耀他们的财富和无法无天。没有法官或陪审团看到他们。他们逃脱了。导致了自 20 世纪 30 年代以来最严重衰退的腐败仍然存在。\n\n\
  \n\n\n\n# 大衰退 \n\n大衰退引发了许多疑问。许多人讨论了我们的系统。系统的创建者从中获利。为什么？为什么公民需要权威？他们是如何获利的？百万富翁是如何从购房者的痛苦中获益的？为什么没有人去保护那些小小的家庭，尽管银行明知他们不符合贷款条件，却向他们承诺了贷款？这个系统是如何变得如此腐败的？混乱导致了金融灾难。受害最深的是？美国公民。犯罪分子剥削了他们。犯罪分子掌控着华尔街和银行。正如所示，恶棍们不在乎，当普通美国人挣扎时，他们继续掌握着权力。\n\
  \n数百万人陷入愤怒。华盛顿的政治和系统受到憎恨。腐败日益加剧。许多人目睹了未受惩罚的犯罪，却感到无能为力。如何改变一个庞大且根深蒂固的系统？他们无法离开。他们拒绝奖励不配得者的财务计划。\n\
  \n他们能如何逃脱？美国和全球银行的替代方案是不可能的。精英阶层似乎在创新面前占据上风。重新开始看起来很难。这就像为了使用不同的货币而去办理车管所（DMV）许可证一样。没有人知道怎么做。\n\
  \n突然，那些在互联网深处存在已久的想法获得了新的生命，并引起了新的关注。人们一直一直在讨论传统货币及其使用系统的替代方案，这种讨论已经存在了多年多年，但它从未仅仅是八卦和推测，也就是在线论坛所擅长的类型。在某些互联网圈子里，人们谈论并写过一种全数字形式的货币，仅在网上使用。它不会被打印；无法被持有。它将从导致许多问题的强大、限制且腐败的系统中解放出来。它将是一种属于人民、由人民的货币。如果有人能想出如何创建和实施这样一个系统，他们就可以带领数百万人进入全新的赚钱、储蓄、消费和购买方式。\n\
  \n但如何实现呢？人如何能创建一个全数字货币系统？人如何能监控它并确保它不被利用或误用？没有人认为只有华尔街的富人和权贵才会变得腐败。巨大的权力和财富创造了对更多的渴望，往往导致人们打破规则、违反法律，并采取一切手段来推进自己。\n\
  \n显而易见，如果全数字货币是实用的，那么它就是值得的。然而，尽管对这种在线货币有所有讨论，没有人知道如何创建并让它运行起来。所有呈现的选项都依赖于许多人试图远离的旧机构，如银行和政府。提议数字货币的人不想与那些权力有任何关系，所以他们最初创造了这种想法。\n\
  \n然后，在 2008 年，一切都改变了，一个男人（或一群人）提出了后将成为 `Bitcoin` 的东西。只需几次简单的击键和一些新想法，幻想就变成了现实，并让我们的世界变得更美好。\n\
  \n# 比特币的诞生\n\n数字货币的概念以前被互联网上的许多不同的人讨论过。然而，最终转化为 `Bitcoin` 和加密货币的核心思想是在 2008 年 10\
  \ 月 31 日引入的，就在总统大选前几天，正值大衰退期间。这些思想和切实的计划是由一个名为 `Satoshi Nakamoto` 的人或团体提交的。你可能在问自己，`Satoshi\
  \ Nakamoto` 是谁？简单的答案是没人知道。由于 `Nakamoto` 永远不会透露自己的身份，这个名字仍然笼罩在真正的神秘之中。一个人或一个团体可以使用一个单词产生他们的内容。许多人假设\
  \ `Satoshi Nakamoto` 是一些个人使用的假名，他们共享一个单一、强大的想法，即用加密货币的运作概念来彻底改革银行系统。`Nakamoto` 是谁并不重要，因为他们创造的思想比身份更响亮；它们远比某个人或一个名字意义重大。\n\
  \n`Nakamoto` 仅通过点击鼠标就开启了一场运动。他在密码学邮件列表中创建了一个帖子。他创建了一个标题为“Bitcoin: A Peer-to-Peer\
  \ Electronic Cash System”的帖子（注：原文未直接给出标题，但语境指代白文书，此处按原文逻辑翻译）为：`Nakamoto` 仅通过点击鼠标就开启了一场运动。……（此处重复逻辑）\n\
  \n但如何能实现呢？人如何能创建一个全数字货币系统？人如何能监控它并确保它不被利用或误用？没有人认为只有华尔街的富人和权贵才会变得腐败。巨大的权力和财富创造了对更多的渴望，往往导致人们打破规则、违反法律，并采取一切手段来推进自己。\n\
  \n显而易见，如果全数字货币是实用的，那么它就是值得的。然而，尽管对这种在线货币有所有讨论，没有人知道如何创建并让它运行起来。所有呈现的选项都依赖于许多人试图远离的旧机构，如银行和政府。提议数字货币的人不想与那些权力有任何关系，所以他们最初创造了这种想法。\n\
  \n然后，在 2008 年，一切都改变了，一个男人（或一群人）提出了后将成为 `Bitcoin` 的东西。只需几次简单的击键和一些新想法，幻想就变成了现实，并让我们的世界变得更美好。\n\
