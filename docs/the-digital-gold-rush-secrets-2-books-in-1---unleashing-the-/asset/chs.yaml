  \ `Beeple` 这样著名的艺术家。通过 NFT，艺术家可以实现作品的变现。通过 NFT，艺术家可以确保作品的真实性。通过 NFT，艺术家可以保护其所有权。通过\
  \ NFT，艺术家可以获得二次销售的版税。通过 NFT，艺术家可以创造数字世界的稀缺性。通过 NFT，艺术家可以解决伪造问题。\n\n### 身份识别 (Identification)\n\
  不可同质化代币（NFT）在身份识别领域具有独特用途。通过 NFT，用户可以证明其数字资产的唯一性。通过 NFT，身份信息可以是不可篡改的。通过 NFT，数字身份可以被验证。通过\
  \ NFT，身份信息无法被伪造。通过 NFT，这些所有权信息被存储在区块链上。\n\n### 收藏品 (Collectibles)\n不可同质化代币（NFT）在收藏领域也有广泛应用。通过\
  \ NFT，收藏品可以实现数字化的形式。通过 NFT，收藏品的来源可以被追溯。通过 NFT，数字收藏品变得更加稀缺。通过 NFT，收藏品可以在全球范围内流通。通过\
  \ NFT，收藏品的价值可以得到保障。\n\n# 如何安全地购买 NFT 以及在哪里购买 (How To Safely Buy NFTs And Where?)\n\
  \n不可同质化代币（NFT）无法在传统的股票交易所购买。某些平台和企业专门处理 NFT。\n\n### 购买加密货币 (Purchase Cryptocurrency)\n\
  购买 NFT 的第一步是获取加密货币。NFT 基于区块链技术，每个区块链都有自己的加密货币。通过支付区块链加密货币来购买 NFT。\n\n### 转移加密货币到钱包\
  \ (Transfer Crypto to a Wallet)\n下一步是将以太或其他加密货币转移到像 `MetaMask` 这样的钱包中。钱包存储加密货币的访问密钥，并防止黑客攻击。\n\
  \n\n\n\n# 选择 NFT 交易平台\n\n下一步是选择一个交易平台。有很多平台可供选择。每个平台都有其独特的特性、交易成本和其他特征。在选择想要购买 NFT\
  \ 的平台之前，必须充分考虑所有这些因素。\n\n**将你的钱包连接到交易平台**：下一步是让买家将其存储有加密货币的钱包连接到市场平台。这允许加密货币通过市场平台从你的钱包转移到卖家的钱包。\n\
  \n**选择 NFT**：在这个过程中，最关键的步骤之一是在平台上选择你想要购买的 NFT。这些平台上提供了成千上万种不同的 NFT，而且市场每天都在增长。选择\
  \ NFT 是一项至关重要的决策，由于这这是一项长期投资决策，因此必须在充分了解的情况下做出。\n\n**购买 NFT**：最后一步是购买你选定的 NFT。在平台上的购买有两种方式：要么以拍卖形式进行，由出价最高者获得\
  \ NFT；要么由卖家报价，买家支付相应金额以购买产品。一旦加密货币转移完成，交易将存储在区块链上，所有权将转移给新主人。\n\n这是 NFT 购买通常的方式。然而，我们最近也看到一些现实中的拍卖行已开始通过拍卖销售数字艺术品。\n\
  \n## 如何选择 NFT？\n\n选择 NFT 应该是一个基于以下因素的明智决策：\n\n**价格**：选择 NFT 之前第一个也是最重要的因素是其出售价格。人们必须考虑自己的预算，然后决定哪些\
  \ NFT 是其预算范围内的可以购买。\n\n**区块链**：另一个必须考虑的因素是 NFT 铸造所在的区块链。大多数 NFT 都在 `Ethereum` 上；不过，其他区块链也提供铸造流程。应该选择一个信赖且良好的区块链。\n\
  \n**稀有性**：NFT 的稀有性是影响 NFT 未来价格的因素。例如，`crypto punks` 中的外星朋克现在比人类朋克更有价值，因为只有九个奇怪的朋克。\n\
  \n**创作者**：就像购买真实的艺术品一样，数字艺术 NFT 也应该根据作品创作者的身份来购买。你可以投资你认为将会变得流行并成名的艺术家的 NFT。\n\n\
  **类型**：NFT 的类型和种类也是必要的。有些人将 NFT 作为数字资产，有些人将其作为收藏品或游戏道具，而另一些人则将其视为金融工具。\n\n# 如何选择\
  \ NFT 交易平台？\n\n选择正确的 NFT 交易平台也非常重要。在选择 NFT 交易平台时，必须考虑以下因素：\n\n**代币标准**：制作 NFT 使用多种不同的代币标准。根据你想要购买的\
  \ NFT，你应该检查该平台是否提供该代币标准的 NFT。\n\n**交易成本**：每次购买或出售 NFT 时，都会发生交易并记录在区块链上。对于每笔交易，平台都会收取费用或佣金。这种费率在不同平台之间存在，在决定时应当考虑。\n\
  \n**类型**：有不同类型的市场。有些是通用的，允许交易各种代币，而另一些仅提供特定的。\n\n**验证流程**：平台对想要在平台上出售 NFT 的创作者有验证流程。这必须是一个严格的流程，以限制伪品和欺诈行为的存在。\n\
  \n**定价方法**：NFT 的定价方式取决于平台。有些使用固定价格，而另一些使用拍卖系统。\n\n# 热门 NFT 平台\n\n一些流行的平台包括：\n\n\
  * `OpenSea`\n* `Nifty Gateway`\n* `Bakeryswap`\n* `Axie Marketplace`\n* `NFT showroom`\n\
  * `Binance NFT`\n* `Atomic Market`\n* `Rarible`\n* `Foundation`\n\n\n\n\n此外，这些智能合约是不可更改的。它们具有防篡功能，一旦合约激活，没有人可以更改其条款。如果任何一方试图更改合约条款，该协议将被拒绝，并通知所有相关方。更重要的是，这些合约非常具有成本效益，因为我们可以消除诸如授权者、文档创建者等典型中介的费用。\n\
  \n在过去的十年里，区块链技术变得非常流行，这主要归功于加密货币的巨额投资。区块链是加密货币所赖的基础技术。许多人听说过它，并需要解释，或者认为它是一项超出他们理解范围的复杂技术；然而，事实并非如此。\n\
  \n简单来说，区块链是一个用于存储信息的数据库或账本。它也被称为分布式账本技术（`DLT`）。数据库是存储在计算机或电子设备上的数据，通过组织这些数据以便于使用和查看。直到最近，数据一直以数据库的形式存在，但随着区块链技术的出现，这种情况已经发生了变化。\n\
  \n在区块链中，数据或信息存储在被称为“区块”的组中。每当一个具有有限存储容量的联盟满时，它就会与上一个区块链联。然后，会创建一个新的伙伴关系，从而形成一个按时间顺序存储的长区块链，这被称为区块链。每个新区块在存储空间填满后都会添加，链条会不断变长。\n\
  \n区块链与其他传统的数据库形式不同之处在于，虽然其他数据库以整体形式存储数据，但区块链中的数据是分成较小的单元组合在一起的。另一个关键区别是，区块链带有时间戳存储信息，这意味着我们总是知道数据是何时时候进入系统的。它确保了与数据相关的时间条目是有效的。事实上，区块链还充当了数据的时间轴。\n\
  \n使区块链与众不同的另一个关键组件是它是去中心化的，这从它的“去中心化账本技术”中显而易见。其他数据库需要存储在由单一实体拥有并运营的地点服务器，相比之下，区块链将其数据存储在多个名为`nodes`（节点）的服务器上。这样，任何单一实体都不会控制数据，每当产生新的数据条目时，它都会通过预定义的算法复制到所有节点上。\n\
  \n由于区块链具有使其成为真实、透明且不可编辑数据库的特性，它正逐渐被许多公司和政府机构所采用。\n\n区块链是过去几年科技领域看到的最大的游戏改变者之一。根据世界经济论坛的《未来就业报告》，区块链在未来五年内（到\
  \ 2025 年）将是最大的就业创造者之一。预计区块链将为许多行业的工作方式带来重大变化，例如金融业、银行业、零售业、供应链行业，甚至是政府管理。\n\n##\
  \ 区块链的历史\n\n拥有存储数据在区块中的去中心化账本的想法已经存在了几十年。然而，在 2008 年，一位开发者（或多个开发者）以`Satoshi Nakamoto`（中本聪）的化名创建了第一个真正的区块链。次年，2009\
  \ 年，中本首次实际应用区块链来维护一个公共账本，以跟踪`Bitcoin`的交易。比特币就是在那时发明的。\n\n第一次使用`Bitcoin`进行购买发生在 2010\
  \ 年，当时一个佛罗里达洲的男子花 10,000 个`Bitcoins`从必胜客购买了两个披萨。\n\n将区块链专门用作存储加密货币交易详情的账本一直持续到 2014\
  \ 年。这被称为区块链的第一阶段。2014 年后，区块链技术进入了第二阶段。在此阶段，区块链的用途不再局限于加密货币。2014 年，`Ethereum`（以太坊）开始创建作为`smart\
  \ contracts`（智能合约）金融工具的计算机代码。同年，区块链公司 R3 成立，探索区块链可以的不同领域。\n\n2015 年，`NASDAQ`和区块链公司`Chain`合作，测试区块链来交易私有公司的股票。2016\
  \ 年后，`Facebook`和`IBM`等公司开始研究区块链技术。\n\n## 区块链的类型\n\n**公共区块链（Public Blockchains）**：这是最常见的区块链类型。顾如名，公共区块链对所有人开放，任何人都可以访问此类区块链上的数据。公共区块链是透明度最高的区块链形式。公共区块链用于追踪`Bitcoin`和`Litecoin`等加密货币的交易。这些区块链比私有区块链慢一些，因为公共区块链中有更多的`nodes`，且交易必须在每个`node`中记录。\n\
  \n**私有区块链（Private Blockchains）**：私有区块链是另一种主要的区块链类型。在私有区块链中，用户数量是限制的。只有获得授权访问区块链的人才能看到区块链上的数据并在上面记录交易。组织和公司可以拥有私有区块链来存储数据，只有组织内部的人才能访问。私有区块链比其公共对应快得多；然而，由于区块链技术的本质是通过多个`nodes`进行验证以确认，因此私有区块链不被认为像公共区块链那样安全。\n\
  \n**混合区块链（Hybrid Blockchains）**：混合区块链是公共区块链和私有区块链的混合，因此它们试图兼顾公共和私有区块链的优点。在混合区块链中，部分数据对公众开放，而其他更敏感的数据可以仅供少数选定人员访问。这使得区块链同时更快速且更安全。\n\
  \n**联邦区块链（Federated Blockchains）**：联邦区块链也称为`Consortium blockchains`（联盟链区块链）。它们与私有区块链类似，但联邦区块链不是由一个组织组成，而是将访问授予属于更大机构（如政府）的多个组织。\n\
  \n## 区块链的关键组件\n\n要理解区块链如何工作，必须首先了解区块链是由什么组成的。区块链的组件有：\n\n**区块（Blocks）**：区块是区块链上存储信息的各种单元。当每个区块填满后，它就会与上一个区块连接，从而形成我们称为区块链的数据链。区块本身由多个部分组成。这些部分是：\n\
  \n**数据（Data）**：这些数据被安全地存储在区块上。\n\n**随机数（Nonce）**：在创建新的伙伴关系时，为每个区块生成一个 32 位的整数。这个`nonce`随后创建了`hash`。\n\
  \n**哈希（Hash）**：`hash`是每个区块唯一的 256 位数字。这个`hash`加密区块上的数据并将给定区块链中的区块连接起来。\n\n**区块头（Block\
  \ header）**：区块头提供了与区块相关的元数据，例如上一个区块的哈希、时间戳和`nonce`。\n\n**交易（Transactions）**：区块包含了存储在区块上的所有交易。\n\
  \n**节点（Nodes）**：`Nodes`指的是共享区块链的人或服务器。区块链没有中央机构，数据存储在分布式账本上。每个这些账本都有自己的`node`。区块链中`nodes`的数量越多，就越安全。由于相同的数据在每个`node`上都是安全的，黑客必须访问每个`node`并更改数据才能进行黑入或做出更改。\n\
  \n\n\n矿工：矿工是负责向区块链添加新区块的人员。要向区块链添加新区块，需要解决一个复杂的数学问题；这个问题只能通过尝试错误法来解决，因此需要巨大的计算能力。`nonce`（随机数）是一个\
  \ 32 位数字，而 `hash`（哈希值）是一个 256 位数字，因此大约有 40 亿种随机数位组合可能。寻找正确组合的过程被称为挖掘。在进行这一过程中，矿工将获得加密货币作为奖励。\n\
  \n## 区块链原理\n\n区块链技术基于某些原理运行；这些原理是：\n\n### 分布式数据库：区块链背后最基本的原理是数据库并不存储在单一位置，而是分散在各个节点和服务器上。这意味着为了将一笔交易输入区块链，必须进入每一个节点，这使其成为一种非常安全的数据存储形式，尽管速度稍慢。\n\
  \n### 点对点交易：区块链中的交易和通信直接发生在点与节点之间，而不是通过中间协调者。这确保了区块链网络用户之间存在某种程度的信任和透明度。\n\n###\
  \ 透明性：存储在公共区块链上的交易是透明的。任何人都可以访问这些交易，使人们很难通过创建虚假记录来欺骗或欺诈他人。\n\n### 不可逆性：交易一旦存储在区块链上，就会被标记时间戳并以此存储。数据一旦输入，之后就无法更改。为了对区块链上的任何一个区块进行即使微小的更改，必须对整个链进行重新挖掘。这需要巨大的计算能力，并且几乎是不可能的。\n\
  \n### 计算逻辑：数据以逻辑格式存储在区块上，因此用户不需要手动添加。他们可以自己创建算法来输入交易。\n\n# 区块链中的密码学\n\n区块链使用两种基本的加密类型：非对称加密和哈希函数。这两种被同时使用且具有不同的流程。\n\
  \n非对称加密意味着需要两种密钥，这两种密钥同时使用并具有不同的流程。非对称加密意味着公钥和私钥，这确保了区块链网络用户之间的某种信任和透明度。公钥是公开的，而私钥是私有的。数据一旦加密，就无法更改，除非你有私钥。哈希函数是区块链中的一种加密方式，它从数据输入生成固定长度的输出字符串。这确保了每个区块都有其唯一的哈希值。哈希函数是区块链中的一种加密方式，它从数据输入生成固定长度的输出字符串。这确保了每个区块都有其唯一的哈希值。哈希函数是区块链中的一种加密方式，它从数据输入生成固定长度的输出字符串。这确保了每个区块都有其唯一的哈希值。哈希函数是区块链中的一种加密方式，它从数据输入生成固定长度的输出字符串。这确保了每个区块都有其唯一的哈希值。哈希函数是区块链中的一种加密方式，它从数据输入生成固定长度的输出字符串。这确保了每个区块都有其唯一的哈希值。哈希函数是区块链中的一种加密方式，它从数据输入生成固定长度的输出字符串。这确保了每个区块都有其唯一的哈希值。这种方法允许：\n\
  - 这种方法允许人们在区块链上进行交易。\n- 这种方法允许人们在区块链上进行交易。\n- 这种方法允许人们在区块链上进行交易。\n- 这种方法允许人们在区块链上进行交易。\n\
  \n# 交易是如何运行的？\n- 这种方法允许人们在区块链上进行交易。\n- 这种方法允许人们在区块链上进行交易。\n- 这种方法允许人们在区块链上进行交易。\n\
  - 这种方法允许人们在区块链上进行交易。\n\n# 区块链的基本属性\n\n区块链的一些基本属性包括：\n\n### 分布式：区块链最基本的特征之一是账本是分布式的。这意味着它在多个节点上运行，而不是在单一中心。这确保了数据在所有节点上都是存储的。这减少了物理持有这些服务器的成本。\n\
  \n### 不可篡改性：区块链中的数据是不可篡改的，也就是说它是永久的，一旦存储就无法更改。要更改区块链上的数据，需要拥有正确的 `nonce` 和 `hash`\
  \ 组合，这在计算上几乎是不可能的。此外，每个区块都有其下一个区块的哈希值。\n\n### 时间戳：区块链技术的定义特征之一是所有存储在区块链上的交易都标记了时间戳。这意味着一旦交易进入区块，就会同时标记时间和日期。这确保了没有人可以回溯并更改数值。这为我们提供了按时间顺序的记录。这种特性允许我们跟踪所有的加密货币交易。\n\
  \n### 共识性：平台上的数据是共识的，因为平台上的每个人都经过了验证和接受。一个节点可能带有不同的值或交易，而另一个节点则带有额外的权重或交易。由于这一特性，每个人都可以访问相同的数据，减少了通信中的差异和错误。\n\
  \n### 匿名性：区块链上记录的交易不携带人员的姓名或身份。大多数交易都是匿名或伪匿的。这允许人们在不与身份关联的情况下进行交易，并在某种程度上遵守各种法律法规。这些交易无法追溯到个人。\n\
  \n### 安全性：区块链上的数据历史被认为是极其安全的。由于数据不是存储在单一服务器上，而是存储在网络中的多个节点上，因此很难入侵区块链网络并更改每个节点的数据。因此，区块链比通常的服务器安全得多。\n\
  \n 区块链可以改变哪些行业？\n\n银行业行业\n\n\n银业是区块链技术将彻底转型的最大的行业之一。目前，银行将所有数据存储在中心化服务器上，这些服务器容易受到黑客攻击和大规模资金盗窃的威胁，每年导致数十亿美元的损失。一旦银行开始在区块链上存储交易历史，它们将获得额外的安全保障。此外，这些银行的用户或客户的另一个优势是数据将是透明的，所有人都可以访问。\n\
  \n当此类数据对公众时，它可以减少财务违规行为，多年来发生的银行故障事件（例如罗逸兄弟银行）将不会再次发生。\n\n区块链在银行业中的某些用途包括：\n\n-\
  \ 跨境支付将快得多。\n- 通过点对点贷款提供更更容易获取的贷款，而不是使用中央银行。\n- 银行使用的清算系统也将更加快速。\n- 将加密货币作为与法币行的行的支付系统形式。\n\
  \n## 政府记录部门\n记录行业，尤其是政府部门，将从区块链技术的出现中获益。由于区块链中记录的数据是不可更改且永久的，并带有时间戳，这将确保不会提供有关身份、所有权、死亡、出生和财产转移的虚假证书和记录。这使得访问这些证书和信息变得更加容易。\n\
  \n区块链技术提供的数据透明性意味着每个人都有选择查看这些数据，而且它将不是秘密，这意味着人们可以轻松验证政府向他们提供的记录是否真实。这将减少福利欺诈，政府设施可以更好地对准那些需要它们的人群。\n\
  \n## 医疗保健部门\n数据存储是医疗保健部门面临的最重大问题之一。患者在每次去不同的医院时，必须重复填写多种形式、文件和记录。这个问题可以通过使用区块链技术得到快速解决。此外，通过这种方式，所有医院都可以从透明且真实的开源源访问其患者疾病和受伤的旧记录。\n\
  \n在全球范围内，越来越多的医生和医疗专业人士倡导全民医疗，包括医生以数字形式从患者那里获取的各种信息。这种全民医疗可以通过使用区块链来实现。\n\n## 媒体与娱乐部门\n\
  在过去的十年里，随着 `Netflix`、`Amazon Prime` 和 `YouTube` 等在线媒体平台的出现，媒体行业发生了巨大变化。在该领域使用区块链技术，我们可以更好地跟踪购买这些账户支付的费用，并进一步防止多人通过单次费用使用的情况。\n\
  \n它还将帮助媒体领域的公司跟踪其产品（如歌曲、电影等）如何以及何时发布，以及实际反馈如何，而不会受到推广人员的篡改。独特的视图或印象将通过区块链计数，而不是重复的计数。\n\
  \n## 供应链部门\n一旦区块链最终采纳并整合到供应链中，供应链将成为一个不同的部门。对全球产品来源的担忧使得全球公司有必要追踪每个产品的来源以及其生产者是谁。消费者变得越来越有意识，不再使用源自于雇佣童工或违反劳动法地区的产品。为了实现这一目的，区块链技术可以跟踪此类数据。通过它，每个人也将能够访问这些数据，以确保公司是否正确提供了数据。区块链还将增强供应链的精益化。因为如果生产者可以将供应链追溯到产品制造商，那么他就可以减少浪费。\n\
  \n## 交通部门\n交通部门本身将成为采用区块链技术的巨大受益者。在航空领域内部，我们看到在多个检查点都要进行支付，例如代理人、保险公司、乘客和航空公司。有了区块链，成本的结算将快快得多，从而增加了预订的便利性。此外，它还可以增加受超售过程影响的效率，因为每个人都可以从单一的中心空间看到预订数量。\n\
  \n区块链系统可以建立一个提供所有步骤的单一身份验证，减少乘客和航空公司之间的时间。区块链还将降低运输和货物部门数据收集中的冗余和差异。\n\n## 农业部门\n\
  随着区块链技术引入农业部门，我们看到物流处理方式发生了重大变化。首先，它帮助我们确保向消费者提供质量最好的作物，并且它们是健康的。它还将跟踪农产品的来源，以便更好地控制其质量。农民面临的最严重问题之一是他们的付款有时会延迟，他们需要这些资金来购买下一季的种子；如果没有这些付款，他们的季节可能会受到严重影响，有了区块链，价格将几乎瞬时的，这将极大地帮助农民。\n\
  \n## 零售部门\n零售部门可以用多种方式使用区块链技术，主要方式是跟踪库存。这种易于访问的数据选项允许所有人看到使用了多少库存以及速度如何；通过这种方式，可以适当安排补货流程，从而节省零售公司的备货成本。\n\
  \n此外，在零售部门，这将使客户更容易验证零售店所提供产品的真实性和安全性，以及它们是否为合规来源采购。对供应商可见的透明供应链也有助于更快地解决他们与零售商之间的纠纷。\n\
  \n## 保险部门\n在保险行业，区块链应用试图提高运营效率。与其他行业相比的一个显著区别是，在该行业，技术的目标并不是创建新的产品或服务，而是降低成本、提高服务速度并提供更好的客户服务。通过拥有透明且永久的记录，该行业还将减少保险欺诈或多次投保的情况。同时，这对被保险方也有帮助，因为它允许人们更快地从保险公司获得理赔和赔付，如果延迟，会严重影响这些人的生活。智能合约作为区块链技术的应用，还将缩短核保流程的时间和成本。\n\
  \n## 房地产部门\n\n\n\n\n\n房地产行业在账记录和支付流程中引入区块链技术后，将得到极大推动。在房地产领域，买卖双方之间的信任至关重要；买方必须确保卖方是物业的实际所有者，且没有任何现有权益；卖方也必须保证买方是真实的买家，会为该物业全额付款。区块链技术的去中心化、透明数据记录方法增强了这种信任。此外，通过更安全、更快速的支付方式，物业转移成本将显著降低，使双方受益。像`Safewire`这样的公司使用区块链技术来减少房地产交易中常见的电汇诈骗。\n\
  \n## 医药行业\n\n制药行业存在假药、专利过期和测试周期长等问题。区块链技术可以帮助解决大部分此类问题。首先，开放透明的账本让消费者更容易检查所售药品是否为正品以及是否过期。此外，大多数药物的高成本是因为制药公司通过区块链对其主张了专利；人们可以轻松地追踪哪些专利即将到期，从而以更低向消费者提供同类仿制药，进而拯救许多生命。测试阶段也可以通过区块链得到改进，一旦出现错误，可以迅速发现并追溯到同一批药品。\n\
  \n## 教育行业\n\n在教育领域，人们经常提供虚假的学位、文凭和证书。可以通过确保所有证书都在公共区块链平台上来检查这一点。教育机构可以确认并验证所提供的证书是否由相应部门颁发，以及是否属于正确的人。此外，证书可能会丢失或损坏，甚至将它们从一个地方带到另一个地方也是一个问题；通过在安全且经过认证的平台上，学生和学位持有者只需在物理上携带它们（有时用于认证）。区块链还将帮助图书馆的工作，因为它有助于更好地追踪借书情况以及谁拥有了哪些书，甚至允许建立点对点的图书馆。\n\
  \n## 股票交易行业\n\n就像加密货币交易存储在区块链技术上一样，整个资产交易行业可以完全转向区块链技术。该行业与加密行业最为接近，因为区块链技术最初主要是为此创建的。使用带有时间戳的交易，可以很容易找到特定股票的所有者，以及他是否已将其卖给他人。此外，如果通过区块链开始交易，结算速度将快得多，卖方可以立即收到资金。通过算法和智能合约的使用，股票交易者自己执行交易将变得更加容易。\n\
  \n## 能源行业\n\n能源行业在过去是最集权化的行业之一，能源采集和分配是通过电力公司（私人或公共）完成的，取决于国家和地区。有了区块链，这可能会发生彻底改变，人们将从这些集中的电力生产者转向从去中心化来源获取电力，即点对点购买电力，这减少了中间环节，从而降低了能源和生产成本。此外，使用这种技术，可以找到所用能源的来源，即消耗的能源是清洁的还是不可再生资源制造的。一些区块链公司使用能源证书，这些可以从一个人出售给另一个人，然后兑换电力。区块链影响领域的另一种方式是引入能源证书。\n\
  \n## 食品饮料行业\n\n食品和饮料通常有保质期，这会导致许多疾病。通过区块链，可以追踪食品产品的位置。通过使用`smart contracts`，公司还可以实现订单自动化。此外，如果出现问题，更容易追踪材料来源。\n\
  \n## 选举行业\n\n全球范围内，特别是发展中国家的选举，饱受选民欺诈。一旦区块链存储选票，选举将变得安全得多。首先，当选民数据存储在区块链上时，它是透明的，每个人都能看到特定地区的选民。此外，验证和追踪选票意味着可以证明其没有被黑客攻击。此外，区块链公司正在研究开始投票的方法。我们需要提醒任何人关于\
  \ 2020 年美国大选的混乱局面吗？\n\n## 审计行业\n\n一旦公司数据和信息上传到区块链上，审计过程将变得简单得多。这使得公司难以伪造账目，因为这会显示财务状况的准确图景。此外，它更容易追踪全年的采购和销售情况，由于带有时间戳的交易，隐藏此类费用变得更加困难。\n\
  \n## 采矿行业\n\n采矿业也开始采用区块链技术。在采矿行业，存在多个中间环节。使用这项技术，可以迅速让所有环节达成一致，这使得矿产产品从矿山到达终端消费者变得更加便利。此外，消费者可以将产品追溯到其声称产地矿山。这确保了石头或金属的源头具有特定的价值。钻石公司戴比尔开发了一种名为`Tracr`的区块链解决方案，可以追踪从矿山到买家的钻石来源。\n\
  \n## 公共援助\n\n区块链的运用可以显著减少浪费。通过这种方式，非政府组织和其他政府间机构可以追踪其援助资金，并验证援助的最终接收者是否为目标支持对象。世界粮食计划已采用区块链技术，通过区块链认证直接向需要帮助的人发送援助。在约旦等国家，世界粮食计划已将人们的生物识别与其基于区块链的账户绑定；一旦个人身份确认，通过该账户收到的援助资金将被自动检测，从而在杂货店实现即时结算。\n\
  \n\n\n\nUber 和 Lyft 等网约车公司目前主导着这一领域；然而，这些公司代表了中央机构或中介，通过他们将司机连接到乘客。随着使用区块链技术的公司的出现，这些公司将为网约车服务提供直接的点对点网络。这意味着任何中央机构都不会控制该司机，司机可以自由地创建自己的市场空间，并根据其意意的费率提供服务。这对乘客也有利，因为由于消除了中介的佣金，乘车的成本将更低。目前一些区块链共享乘车应用（如\
  \ `arcade city` 和 `Drive`）已经上线。用户还可以在这些应用上通过加密货币进行支付。\n\n## 慈善\n如果慈善机构采用区块链来追踪机构内部的资金，它们处理捐款的方式也将发生变化。通过这种方式，捐赠者可以精确追踪捐赠资金的去向，并确保机构没有将其用于其他用途。这为慈善事业提供了透明度，可能会鼓励更多的人捐赠，因为许多人由于认为慈善机构腐败而不进行捐赠。许多公司正致力于该领域的工作，例如基于\
  \ `Bitcoin` 的慈善机构 `Bitgive Foundation`，以及基于区块链的捐赠平台 `Givetrack`，它拥有全球慈善交易的永久记录。\n\
  \n## 已产生影响的流行区块链公司\n既然我们知道加密货币是最关键的区块链应用，让我们讨论一下全球前两大加密货币。\n\n### 比特币 (Bitcoin)\n\
  `Bitcoin` 是原始加密货币，也是第一个商业化区块链技术的工具。它始于 2008 年。`Bitcoin` 是一个点对点支付网络，通过它你可以在没有任何中央银行或机构的情况下向他人付款。`Bitcoin`\
  \ 使用底层的区块链技术来管理和跟踪交易。`Bitcoin` 在大众中普及了加密货币的概念，目前市值约为 9500 亿美元。\n\n### 以太坊 (Ethereum)\n\
  `Ethereum` 是最著名的区块链公司之一，被归功于引入了智能合约的概念。`Ethereum` 工作于金融服务领域，允许个人通过互联网进行贷款、借贷和储蓄产品。它还运行\
  \ `ether`，按市值排名第二加密货币。`Ethereum` 让人们能够其智能合约进行操作。\n\n## 其他流行的区块链公司\n\n### Chorus\
  \ One\n`Chorus One` 是由雄心勃勃、自我反思的人组成的社区，致力于为去中心化网络构建高可靠性的基础设施。他们相信加密经济和去中心化网络将实现全球范围的协作，并推动人类进化的下一个阶段。`Chorus\
  \ One` 正在为去中心化网络构建验证器节点和链际通信，允许我们的用户获得更多代币并塑造新兴的开放金融系统。他们的工作处于金融服务和加密货币的交汇点。通过 `Chorus\
  \ One` 顶级的验证和质押服务，体验权益证明机制区块链网络的力量。\n\n`Chorus One` 已获得来自 `Celo Foundation` 和 `Interchain\
  \ Foundation` 的资助，用于开发跨链通信 (`IBC`) 模块的必不可构建区块。该模块将实现 `Celo` 区块与其他构建在 `Cosmos SDK`\
  \ 上的网络之间的无缝通信。\n\n通过我们的权益证明网络体验终极的区块链安全性，其中验证者是保护您平台的关键。区块链项目寻求能够运行验证器节点的可靠验证者。通过我们可靠的验证器节点体验质押资金的力量。通过增加您的质押并保障区块链安全，作为验证器节点实现奖励最大化。\n\
  \n### Sciencesoft\n`Sciencesoft` - 该公司成立于 1989 年，服务于非 IT 企业和软件产品公司，并经常因 CRM、数据分析、协作与知识管理以及信息安全方面的定制和平台开发而受到寻求。该公司还提供端到端的区块链软件和应用开发。该公司服务于中中大型国际组织，包括\
  \ `Walmart`、`IBM`、`Nestle`、`eBay` 和 `NASA JPL`。\n\n### Ripple Labs\n`Ripple Labs`\
  \ - 该公司成立于 2012 年，与其客户现有的金融系统合作。\n\n### R3\n`R3` 通过提供分布式账本技术为全球银行提供服务。它最近与瑞士银行合作，结算基于区块链的交易。\n\
  \n### Pledgecamp\n`Pledgecamp` 是一个众筹平台。它利用区块链的追踪功能，让捐赠者或投资者看到他们投入项目的资金去向。\n\n###\
  \ Binance\n`Binance` 是目前全球最大的加密交易所之一。加密货币没有在传统股票交易所上市，仅通过加密交易所进行买卖。加密交易所通常会对每笔交易收取少量费用。\n\
  \n### Zweispace\n`Zweispace` 是一家位于日本的公司，开发了基于区块链的遗嘱处理程序。在确认委托去世后，资产会自动转移给继承人，从而避免了通常随遗嘱的法律诉讼。\n\
  \n### Republic\n`Republic` 是一个基于区块链的投资平台。人们可以在该平台上投资房地产、初创公司甚至加密货币。`Republic` 是一个安全的平台，特定的公司获得了上市机会，因此可以通过\
  \ `Republic` 确保投资安全。\n\n### SALT\n`SALT` 是一个作为加密货币与现实世界桥梁的区块链平台。用户可以利用他们在 `SALT`\
  \ 上的加密资产获取贷款。贷款人可以获得最长 3 年的贷款。\n\n\n\n\n\n## Hashed Health\nHashed Health 是健康领域最受欢迎的区块链公司之一。其目标是为患者和医生记录提供分布式账本。他们的项目之一将允许医生生成执照，显示他们被许可的执业范围。他们正在与医疗保健公司合作，提供分布式账本以提高透明度。\n\
  \n## Follow My Vote\nFollow My Vote 是一个去中心化应用平台，顾如其名，它的目的是追踪选区内每位选民的声音；这为投票过程提供了透明度，同时避免了选民欺诈。它可以为各种类型的投票提供服务，包括组织内部、大学系统，甚至更大规模的投票。\n\
  \n## Open Bazaar\nOpen Bazaar 是基于区块链技术的电子商务平台。与其他任何电子商务平台不同，它作为一个点对点平台，人们可以在此出售任何想要出售的东西而无需支付任何费用，因为没有中央机构。支付通过加密货币完成，交易记录在区块链上。这些购买行为可以涵盖从艺术品到日常用品的任何物品。\n\
  \n## Consensys\nConsensys 是一家区块链软件工程公司，为企业提供有关区块链技术的端端解决方案。它最近与微软和酩华轩易威登（Moët Hennesy\
  \ Louis Vuitton）合作，创建了区块链软件，帮助他们追踪公司及其子公司生产的奢侈品，并提供真实性保障。它还允许客户从设计到购买全程追踪其产品。\n\n\
  # 如何选择区块链？（针对企业主）\n\n根据业务或组织的需求，他们可能会选择区块链。选择正确区块链的决策取决于以下因素：\n\n### 适应性\n在业务中采用区块链技术时，第一个因素是检查该区块链是否适用于你的领域。区块链需要对所有人开放的服务器信息，因此它可能不适用于处理敏感数据。此外，区块链并不是一种廉价的技术，至少目前不是。聘请区块链专家非常昂贵，对于小型公司来说可能负担。\n\
  \n### 可扩展性\n可扩展性指的是单个区块链平台处理的交易数量。如果业务需要大量交易，则可以相应选择平台。虽然某些平台（如 `Bitcoin`）提供的 `TPS`（每秒交易数）仅约为\
  \ `7 TPS`，但其他平台如 `Stellar` 可以达到几乎 `1000 TPS`。区块链的可扩展性从三个因素进行衡量：速度、安全性和去中心化。\n\n\
  ### 新 vs 现有\n组织可以决定其需求需要使用区块链技术；他们随后必须选择是使用已有的区块链平台，还是创建自己的平台。开发新平台可能会稍微昂贵且耗时；然而，它对需求的会更具个性化。\n\
  \n### 公有 vs 私有\n区块链平台分为大类：私有或公有。公有和私有网络都有优缺点；虽然公共网络更安全，但速度稍慢。私有网络节点较少，因此处理交易快得多，但它们需要更安全，因为黑客更容易访问较少的节点。\n\
  \n## 安全性\n在考虑区块链平台时，安全性是非常关注的问题，特别是对于处理敏感信息的公司。应该查看你所选择论坛的同行评审。\n\n# 第 8 章：投资加密货币\n\
  \n加密货币市场的历史比其他传统市场要短得多。然而，它已经广泛扩展。这完全是因为加密货币所提供的特性。`Bitcoin` 以及其他所有加密货币以其高波动性闻名，如果投资者能够消化风险，将为他们提供巨大的收益机会。\n\
  \n加密货币是一个在线市场，几个数字平台简化了人们投资该市场的过程。然而，相比之下，它比获取传统货币复杂得多。如果你是该领域的新手并愿意投资加密货币，这里是你需要了解的一切。\n\
  \n# 加密货币与投资 - 基础\n\n市场上存在数千种加密货币，弄清楚钱放在哪里变得令人望而畏。从广泛的角度来看，每种加密货币都是高度加密的，且大多数是去中心化的。但\
  \ `Bitcoin` 是区块链技术市场上最认可的加密货币。因此，这使得 `Bitcoin` 世界上最可靠的货币之一。\n\n许多投资者倾向于只投资 `Bitcoin`\
  \ 和其他少数流行货币。例如，人们热衷投资 `Ethereum`，试图买低卖高，相信它可以成为下一个 `Bitcoin`。\n\n在你投资的任何加密货币中，都有一个共同点——波动性。加密货币的一个事实是，只要人们理解它具有价值，它就有价值。虽然在技术上对任何货币都是准确的，但加密货币意义重大，因为它们不像其他传统货币那样有政府或贵金属的支持。因此，投资加密货币带有额外的风险。\n\
  \n# 入门\n\n投资加密货币意味着购买并存储它们。因此，为了投资加密货币，我们需要研究在哪里购买和存储。加密交易所是购买货币的地方。它们是允许使用法币或其他数字资产交换货币的在线平台。\n\
  \n互联网上有许多加密交易所。选择一个正确的是必要的，因为那是你购买、出售、交易和存储数字资产的地方。一些流行的加密交易所包括 `Coinbase`、`Gemini`、`Binance`、`Kucoin`、`Kraken`、`Bybit`\
  \ 和 `Bitfinex`。除了流行之外，它们也是最可靠的交易所。\n\n研究加密货币和交易所的最佳网站是 `https://coinmarketcap.com`；如果你在美国，你必须接触一个可以将\
  \ `USD` 转换为 `Crypto` 的交易所，例如 `Gemini` 或 `Coinbase`。但它们可能不支持并持有你想购买和保存的所有 `Crypto`。这时你可能需要使用另一个允许加密加密货币加密加密货币交易所；你必须使用如\
  \ `Kucoin`、`Kraken` 或 `Binance`。\n\n某些交易所方便交易者用加密货币买卖加密货币。技术上，你可以交易 `ETH/BTC` 和\
  \ `XRP/BTC` 等交易对，而不仅仅是 `BTC/USD` 或 `ETH/USD`。因此，你不需要涉及传统货币来买卖加密货币。\n\n\n\n\n除了这两种交易所，另一种类型允许参与者直接买卖他们的加密货币。`LocalBitcoins`\
  \ 是最老且最流行的加密货币点对平台之一。在 2023 年初，规模最大的点对交易所已停止提供 `Bitcoin` 交易服务，因此请务必小心，不要在这些平台上留下资金。还有其他网站，如\
  \ `Paxful`，由卖家设定价格，而非交易所。然而，这是购买和投资加密货币的路线，因为它涉及到与无法验证的陌生人交易。所以，如果你是加密货币投资的新手，建议从像\
  \ `Coinbase` 这样的交易所开始，将 `USD` 转换为 `ETH` 或 `BTC`。\n\n另一个日益流行的选项是 `Bitcoin ATMs`。根据来源，目前有超过\
  \ 4000 个加密货币 ATM 位于七十六个国家。这些可以用于购买 `Bitcoin` 并将其存入你的加密货币钱包。\n\n“加密钱包”这一术通常用于存储硬币。这是因为加密钱包是一种设备或软件，允许用户存储和检索数字资产。这种钱包代表了你的投资组合。例如，当你在\
  \ `Coinbase` 创建账户时，你会自动获得一个软件钱包。如果你购买任何加密货币，它将反映在你的 `Coinbase` 钱包中。这些金额可以用于其他交易所的加密交易。\n\
  \n从 `Bitcoin` 发布以来，我们观察到价格呈现波浪运动。起初它增长缓慢，在 2017 年飙升至 20000 美元，随后无法持续并跌至 3500 美元。这代表了\
  \ `Bitcoin` 的波动性。\n\n所以，投资加密货币与传统投资大不同。然而，风险分析可以同样进行。与任何其他投资一样，你必须权衡潜在收益与愿意承担的风险。投资加密货币取决于你是什么样的交易者。如果你是一个希望降低风险并随时间增加利润的保守型投资者，加密货币可能不是正确的投资选择。相反，如果你能承受高风险以极大化收益，你可以尝试在这个市场试一把。\n\
  \n`Bitcoin` 和 `altcoins` 是增长不稳定且波动性巨大的市场。因此，“投机”比“投资”更符合上述描述。\n\n# 如何投资？\n\n对于刚进入投资世界的初学者来说，实际上开始投资的任务看起来可能很艰巨，尽管它非常简单且易于学习。由于购买加密货币与在股票交易所或通过当地银行投资其他资产不同，它需要一种不同的方法。然而，这样做只需要投资者可以在几个步骤内完成的微小程序。只需遵循这些基本步骤并辅以必要的研究，一个人就可以开始他的加密货币投资之旅。这些步骤是：\n\
  \n*   初步研究\n*   选择加密交易所\n*   在加密交易所创建账户\n*   选择加密货币\n*   下单\n*   存储你的加密投资\n\n##\
  \ 初步研究\n\n在做出任何投资决定之前，第一步也是最重要的一步之一，是对将研究的潜在资产或投资进行初步研究。这条规则在加密投资方面同样具有价值。\n\n关于加密货币，潜在投资者应该期待获得有关各种主题的信息，例如目前流行的市场类型、市场上提供的不同类型的加密货币、有关加密货币投资的规则法规、他们所在地国家和领土的加密资产、他们愿意投入的金额，最后也是最的，是围绕支持这一新兴加密货币领域而演出的各种风险。\n\
  \n虽然没有必要，但投资加密货币的人应该具备其背后的技术基础知识——`Blockchain`。投资者应该了解 `Blockchain` 如何工作以及它是如何保护他们的加密交易的。投资者还应该意识到加密货币挖矿是如何发生的。\n\
  \n这个人还应该知道他们计划购买的特定加密货币具有什么样的模式，以及关于发行这些货币的消息和信息。此外，了解自己想要什么样的投资组合也是关重要的。此外，对于加密货币选择加密交易所是明智的，以减少加密的风险。\n\
  \n## 选择加密交易所\n\n拥有加密货币的下一步是选择加密交易所。我们知道加密货币在股票交易所或通过当地银行可用，但有些已经开始提供加密货币。除了这两种类型的交易所，还有其他平台如\
  \ `Robinhood` 和 `SoFi`。选择加密交易所取决于许多因素，例如加密交易所的真实性、安全性。在加密交易所上，用户可以购买的加密货币，以及加密交易所的费率。\n\
  \n全球一些主要的加密交易所包括 `Coinbase`、`Cash App`、`Binance`、`Bisq`、`eToro`、`Gemini` 和 `Kraken`。不需要局限于特定的加密交易所。\n\
  \n## 在加密交易所创建账户\n\n在决定加密交易所后，下一个逻辑步骤是在该加密交易所创建账户。一个人需要一个预算来购买加密货币。根据各种反洗钱（AML）和了解您的客户（KYC）准则，通常必须提供身份证明以完全设置账户。\n\
  \n一旦完成此类手续，人们就可以在加密交易所卖出或购买加密货币。个人可能会被要求向公司提供政府颁发的身份证，由于所有这些过程都在在线进行，他们甚至可能要求提供照片以与提供的文件匹配。\n\
  \n## 选择加密货币\n\n选择加密货币是购买加密货币中最关键的一步。成百上千种不同的加密货币可以购买。\n\n在全球范围内交易的一些加密加密货币：\n\n\
  *   `Bitcoin` (`BTC`)\n*   `Ethereum` (`ETH`)\n*   `Polkadot` (`DOT`)\n*   `Cardano`\
  \ (`ADA`)\n*   `Ripple` (`XRP`)\n*   `Binance Coin` (`BNB`)\n*   `Litecoin` (`LTC`)\n\
  *   `Chainlink` (`LINK`)\n*   `Stellar` (`XLM`)\n*   `Internet Computer` (`ISP`)\n\
  *   `Filecoin` (`FIL`)\n*   `Aave` (`AAVE`)\n*   `Hedera` (`HBAR`)\n*   `Algorand`\
  \ (`ALGO`)\n*   `Uniswap` (`UNI`)\n*   `Near Protocol` (`NEAR`)\n*   `Crypto Adoption\
  \ Token` (`CAT`)\n\n人们应该根据各种参数来决定加密货币，例如：\n\n\n\n\n# 加密货币投资指南\n\n* 应该应该查看币种的总市值，并且无法获取其供应量和流通量。这有助于你理解加密货币的规模，并对其可能提供的稳定性提供提示。\n\
  * 加密货币价格的剧烈波动通常不被视为好信号。应该避免那些仅因为某个人或某公司的背书而升值的币种。\n* 在购买加密货币之前，研究发行该加密货币的人和公司至关重要。公司经营的业务类型以及个人的声誉可能会影响硬币的未来价值。\n\
  * 白皮书是未来的计划。它是为每种硬币创建的，包含了特定加密货币的目的和愿景。投资者应该查看白皮书，并对比已完成的内容与承诺的内容。\n* 技术：加密货币的底层技术也至关重要；具有更广阔前景的颠覆性技术为硬币提供了更好的价值，例如\
  \ `Ethereum` 发起的创新合约技术。\n\n此外，必须理解仅投资一种加密货币并不是明智的决定。因此，有必要根据你的需求以及它们为投资者提供的价值来构建一个多种加密货币的投资组合。理想情况下，投资者应该在高风险但高收益的币种与稳定但低收益的币种之间保持健康的平衡。最初，将投资组合更多倾向于安全的选择被认为是更好的选择。当一个人变得更有经验时，就可以开始投资风险更高的币种。\
  \ \n\n一个良好的投资组合应包含以下部分：\n\n* 价值存储型：`Bitcoin`, `Ethereum`\n* 数字货币：`Litecoin`, `XRP`,\
  \ `XLM`, `dash` 等\n* 分布式应用：`Polkadot`, `Cardano`, `Tron`, `Waves` 等\n* 新技术：`ADA`,\
  \ `Tezos`, `Nano`\n* 私有币：`Monero`, `Verge` 等\n* 交易所代币：`Binance coin`, `Uniswap`\
  \ 等\n* 稳定币：`Tether`, `DAI`, `USD coin`\n\n上述内容的健康组合将为投资者提供极佳的风险收益比，适合长期投资。\n\n##\
  \ 交易平台\n\n有几个地方可以管理和跟踪你的数字钱包，但通过 `Coinigy` (`https://www.coinigy.com/`) 可以体验无与伦比的交易体验。这是市场上最流行的交易平台。自\
  \ 2014 年成立以来，他们经历了稳步增长。通过我们顶级的支持和先进的交易图表，在 45 多个交易所中体验无缝交易。凭借 45 多个交易所，`Coinigy`\
  \ 用户相比那些不使用该平台的人具有明确的优势。\n\n## 图表工具\n\n除了 `CoinMarketCap`，你还应该花些时间使用如 `https://www.tradingview.com`\
  \ 等工具。通过我们的图表工具体验可视化交易指标和市场趋势的力量。绘制趋势线并获得前所未有的市场价值洞察。通过通过这些交易指标和趋势线来精练你的专业知识，增强你的技术分析\
  \ (`TA`) 技能并保持领先。在尖端加密分析工具的帮助下，通过行业领先公司 `Tradingview` 的加密货币和股票实时交易图表，作为 `TA` 专家实现收益最大化。发现业内最大的图表提供者之一的无与伦比的专业知识。凭借丰富的技术指标，你将拥有做出明智决策所需的一切。通过我们提供免费和高级功能的通用平台开启可能的世界。发现顶级交易员青睐的加密货币图表工具：`Tradingview`。\n\
  \n## 市场数据\n\n发现检查硬币最新价格、成交量供应量的终极平台——`Coinmarketcap` (`https://coinmarketcap.com`)。加入百万信任这个领先市场网站的用户，满足他们所有的加密货币需求。此外，他们的\
  \ `API` 非常可靠，可以与你的用户界面无缝集成以检索数据。通过理解市场视角获得竞争优势。\n\n通过 `Messari` 发现 `Coinmarketcap`\
