  \n[content]\n# 大衰退 \n\n大衰退引发了许多疑问。许多人讨论了我们的系统。系统的创建者从中获利。为什么？为什么公民需要权威？他们是如何获利的？百万富翁是如何从购房者的痛苦中获益的？为什么没有人去保护那些小小的家庭，尽管银行明知他们不符合贷款条件，却向他们承诺了贷款？这个系统是如何变得如此腐败的？混乱导致了金融灾难。受害最深的是？美国公民。犯罪分子剥削了他们。犯罪分子掌控着华尔街和银行。正如所示，恶棍们不在乎，当普通美国人挣扎时，他们继续掌握着权力。\n\
  \n数百万人陷入愤怒。华盛顿的政治和系统受到憎恨。腐败日益加剧。许多人目睹了未受惩罚的犯罪，却感到无能为力。如何改变一个庞大且根深蒂固的系统？他们无法离开。他们拒绝奖励不配得者的财务计划。\n\
  \n他们能如何逃脱？美国和全球银行的替代方案是不可能的。精英阶层似乎在创新面前占据上风。重新开始看起来很难。这就像为了使用不同的货币而去办理车管所（DMV）许可证一样。没有人知道怎么做。\n\
  \n突然，那些在互联网深处存在已久的想法获得了新的生命，并引起了新的关注。人们一直一直在讨论传统货币及其使用系统的替代方案，这种讨论已经存在了多年多年，但它从未仅仅是八卦和推测，也就是在线论坛所擅长的类型。在某些互联网圈子里，人们谈论并写过一种全数字形式的货币，仅在网上使用。它不会被打印；无法被持有。它将从导致许多问题的强大、限制且腐败的系统中解放出来。它将是一种属于人民、由人民的货币。如果有人能想出如何创建和实施这样一个系统，他们就可以带领数百万人进入全新的赚钱、储蓄、消费和购买方式。\n\
  \n但如何实现呢？人如何能创建一个全数字货币系统？人如何能监控它并确保它不被利用或误用？没有人认为只有华尔街的富人和权贵才会变得腐败。巨大的权力和财富创造了对更多的渴望，往往导致人们打破规则、违反法律，并采取一切手段来推进自己。\n\
  \n显而易见，如果全数字货币是实用的，那么它就是值得的。然而，尽管对这种在线货币有所有讨论，没有人知道如何创建并让它运行起来。所有呈现的选项都依赖于许多人试图远离的旧机构，如银行和政府。提议数字货币的人不想与那些权力有任何关系，所以他们最初创造了这种想法。\n\
  \n然后，在 2008 年，一切都改变了，一个男人（或一群人）提出了后将成为 `Bitcoin` 的东西。只需几次简单的击键和一些新想法，幻想就变成了现实，并让我们的世界变得更美好。\n\
  \n# 比特币的诞生\n\n数字货币的概念以前被互联网上的许多不同的人讨论过。然而，最终转化为 `Bitcoin` 和加密货币的核心思想是在 2008 年 10\
  \ 月 31 日引入的，就在总统大选前几天，正值大衰退期间。这些思想和切实的计划是由一个名为 `Satoshi Nakamoto` 的人或团体提交的。你可能在问自己，`Satoshi\
  \ Nakamoto` 是谁？简单的答案是没人知道。由于 `Nakamoto` 永远不会透露自己的身份，这个名字仍然笼罩在真正的神秘之中。一个人或一个团体可以使用一个单词产生他们的内容。许多人假设\
  \ `Satoshi Nakamoto` 是一些个人使用的假名，他们共享一个单一、强大的想法，即用加密货币的运作概念来彻底改革银行系统。`Nakamoto` 是谁并不重要，因为他们创造的思想比身份更响亮；它们远比某个人或一个名字意义重大。\n\
  \n`Nakamoto` 仅通过点击鼠标就开启了一场运动。他在密码学邮件列表中创建了一个帖子。他创建了一个标题为“Bitcoin: A Peer-to-Peer\
  \ Electronic Cash System”的帖子（注：原文未直接给出标题，但语境指代白文书，此处按原文逻辑翻译）为：`Nakamoto` 仅通过点击鼠标就开启了一场运动。……（此处重复逻辑）\n\
