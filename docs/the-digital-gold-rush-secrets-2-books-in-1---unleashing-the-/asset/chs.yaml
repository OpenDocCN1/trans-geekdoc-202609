  \n第一个山寨币是一次实验，为了看看山寨币的理念是否可行，或者仅仅是一个永远无法落地的希望和梦想。然而，像加密货币一样，山寨币最终变得强大，并成为一个与 `Bitcoin`\
  \ 的流行度和潜在增长相衡的整个行业。\n\n第一个山寨币是一次实验，为了看看山寨币的理念是否可行，或者仅仅是一个永远无法落地的希望和梦想。然而，像加密货币一样，山寨币最终变得强大，并成为一个与\
  \ `Bitcoin` 的流行度和潜在增长相衡的整个行业。\n\n\n\n\n对于某些人来说，局限于加密市场的视野也未不可，但如果你想成为一名有才华且成功的交易者，你就应该让你的投资组合包含一些代币。为什么呢？因为代币为你提供了更多成功的机会、多样性和潜力。这是一种任何投资课程中都会教到的简单投资方法：你拥有的加密货币种类越丰富，成功的机会就越大。选项越多，你获得财务成功的可能性就越大。为什么要将自己仅限制在比特币上？是的，你确实只靠比特币发财；但它会极大地限制你的发挥。理想情况下，你应该找到具有巨大潜力的代币，并研究和理解它们以及市场。一旦你理解了加密货币市场是如何运作的，以及它为什么会出现通常的波动，你就能更好地判断哪些代币前景良好，哪些可能成为热门，而哪些将会失利。\n\
  \n代币是赚更多钱以及发现他人可能错过的成功机会的绝佳方式。但最好的方式始终选择你想要投资的代币。相反，最好基于对市场以及加密货币、比特币和代币历史的理解来做出选择。了解是什么驱动了其他代币推向高峰又跌入低谷。你将开始在加密货币世界发现规律，即某些吸引投资者的特征以及那些不吸引他们的特征。这将你的选择提供参考，并引导你找到正确的代币。在有这么多选项和如此多获得巨大价值或重大损失的机会面前，严肃对待购买代币至关重要。否则，这就像是你把钱扔掉一样。\n\
  \n投资代币是为你自己开启更多可能性的一种，也是真正接触加密货币格局本质和性格的一种。多年来出现了许多代币，直到今天还有更多，其中每一个都有潜力彻底打破系统，在主要程度上与比特币一匹并马，并为投资者创造重大的财务横财。没有理由忽视代币。不给予它们应有的关注将是错过成为他人羡慕的投资者的稳妥方法。\n\
  \n# 最常见的代币\n\n虽然你可能了解代币，但到底有多少个呢？你知道在投资代币时，你的选择不仅有几十种，而是成百上千甚至上万种花钱和赚钱的方式吗？\n\n\
  事实确实；代币世界在过去几年里爆炸了。比特币不再是孤单的，远非如此。现在许多加密货币投资者仍然需要购买比特币。相反，他们选择寻找一个看起来对他们有吸引力的代币。某些企业也开始创建自己的代币，当然，它们可以创建出强大、现代且尖端的东西。\n\
  \n市场上有这么多代币，以至于找到最适合你的那一个的想法简直让人无从从心。虽然你可以花费几天时间研究和调查代币以找到你想要投资的那一个，但最好了解这个行业中的顶尖名称以及引起过最大影响的最重要代币。你比这些有多多的选择，但这里是一些令人印象深刻、稳健且可靠的代币，它们显著改变了加密货币世界。\n\
  \n## 币 (Litecoin)\n\n如果我们谈论代币，我们不妨从产生最重大影响的一个开始讨论。莱币不仅仅是一个大代币，它是一个巨大的代币，很多人认为它在力量和潜力方面已经超过了比特币。如果有人能取代比特币成为世界上最重大的加密货币，那那无疑是莱币。\n\
  \n莱币创建于 2011 年，迅速成为代币的黄金标准。毫无疑问或质疑，莱币是顶尖之作，是市场上评分最高、最受追捧的代币。它的受欢迎和成功一直在增长，最令人印象深刻的是在整个生命周期中保持了稳定。在一个看到大量波动和突然变化的市场中，莱币多年来一直保持一致和强劲。这种一致性吸引了许多买家，尤其是新买家，这使得莱币粉丝群的规模逐年增长。\n\
  \n和所有代币一样，莱币的成本没有比特币那么高。这只是它的许多优点之一，也是莱币继续吸引新投资者的众多原因之一，甚至是那些尚未购买过碎片比特币的人。在投资莱币时，你不需要损失那么多钱。然而，其他特征使得这种代币对所有投资者都有吸引力。莱币的存在——或将要存在的数量——也极具吸引力。\n\
  \n关于莱币的可用性和未来，有非常多的莱币可以挖矿。这很惊讶，因为莱币非常像比特币，并希望保持可控的供应。这种代币最初是作为比特币的分支启动的。它现在的供应限制约为\
  \ 8400 万，远高于比特币将有的限制。这意味着莱币的供应更多，意味着你有更好的机会以更低的价格购买，因为需求对供应的影响没有其他代币那么大，尤其是对比比特币。一些人认为莱币是开始投资生涯时值得关注的最佳代币。\n\
  \n### 以太坊 (Ethereum)\n\n每当你提到莱币是代币的黄金标准时，你必须提到以太坊，它是莱币的银。它可能没有莱币那么受欢迎，但它仍然有一个庞大且忠诚的粉丝，他们经常赞美它。\n\
  \n这种代币在多年来变得越来越受欢迎，并展示了它对所有加密货币未来是多么忠诚。2016 年，以太坊分为两个：以太坊和以太坊经典。与比特币和其他一些代币相比，以太坊的价格相对较低，但许多人预测它的价值只会一直上扬。\n\
  \n以太坊最有前景的方面是它的速度。虽然比特币的加密、挖矿和确认可能需要 15 分钟，而以太坊完成同样的操作仅需 15 秒。这不仅仅是快，而是极快。\n\n速度非常出色；价格并不那么理想。投资以太坊将花费你一笔小钱。但它具有如此前景和增长空间，忽视它将是愚蠢。对于严肃的投资者来说，那些不在意投入大笔资金追求更多的人，以太坊是正确的选择。\n\
  \n## 比特币 (Bitcoin Cash)\n\n这种代币的名字困扰了许多人。比特币现金？所以它是比特币的一种吗？如果是这样，为什么人们不买比特币？\n\n\
  我们理解这种困惑，并知道需要一个解释。\n\n比特币现金是市场上最早的代币之一，它拥有从原始比特币频繁进行硬分叉的身份。分叉是指开发者和矿工无法达成共识，决定在代码中产生巨大差异并分支出去，完成一种全新的加密货币。当这种情况发生时，原始区块链继续运行，新的加密货币及其链则“分叉”并走自己的路。这就是比特币现金（或\
  \ `BCH`）发生的情况。在 2017 年 8 月，它被创建并独立发展。\n\n\n\n\n这一 2023 年支持加密教育、采用和公众意识的代将彻底改变加密货币。加密采用代（`CAT`）独特的广告活动推广了加密货币巨大的潜力。加入\
  \ `CAT` 的未来！加入一个由有远见人士组成的活力社区，他们希望分享加密货币的益处。我们可以改变货币，创造一个更好的未来。这些惊人的硬币将改变政治筹款。这些硬币通过支持亲加密政治家和监管改革正在改善未来。加入这场运动，现在就开始改变！一个革命性的比特币教育和倡导项目。一个新的游说业务将通过战略性的加密知识赋能下一代。介绍一个普及加密货币的独特项目！`CAT`\
  \ 将通过让公众广泛获取加密知识来赋予人们加密知识。采用类代币正在通过学校、图书馆、独立讲座、研讨会和其他吸引人的场所，改变人们看待和参与这一激动人心的数字前沿的方式。加入我们这段惊人的旅程，揭开加密的秘密，创建一个更好、更具知情的未来！\n\
  \n# Celsius\n\n回到 2018 年，`Celsius Network` 通过众筹赚了 2000 万美元。这表明了在 `Celsius` 正式推出之前，人们对它有多感兴趣。自从创建和发布以来，它已经发放了超过\
  \ 600 万美元的贷款，并产生了超过 1100 万美元的利息。\n\n`Celsius` 产生了如此多的贷款令人惊讶且鼓舞，但也引起了担忧。多年来，我们看到许多贷款巨头因为糟糕的投资和无法偿还贷款而倒闭。`Celsius`\
  \ 对于贷款世界来说太新了，会做出错误的决策，并向那些不需要且不应该获得贷款的人提供贷款。如果是这样，你可以预计 `Celsius` 在未来几年将面临严重的问题。然而，`Celsius`\
  \ 有可能继续扩张而不是崩溃。如果你仍然参与加密货币，你就知道 `Celsius` 已经破产了，抵押品卡在失败平台上的客户不得不向破产法院和程序寻求救济。现在我们又有了一个拥有有趣名字的加密技术，以及另一个恰好由\
  \ `Ethereum` 背后的创造者之一发起的加密货币。\n\n# Polkadot\n\n说这很有趣，这是肯定的。但 `Polkadot` 远不仅仅是一个有趣的、俏皮的名字。它是一个技术和系统，旨在将各种其他区块链整合在一起，为了所有区块链和所有加密货币的利益。\n\
  \n从本质上说，`Polkadot` Best 描述为一个将不同的专业区块链连接成一个统一网络的多链网络。这些连接的区块链被称为“平行链”（para chains）。这些\
  \ `para chains` 汇聚在一起创造了一个统一、易于理解、易于修复和调整并不断演化的网络。所有的 `para chains` 也独立运行并彼此并行。这很好，因为它防止了网络过载，并让每个\
  \ `para chain` 在连接到整个 `Polkadot` 网络的同时快速、安全地运行。`Polkadot` 还创建了协议，允许其网络与其他区块链进行交互。由于其区块链网络非常灵活，它具有更强的转型能力并服务于更特定的需求。\n\
  \n### 为什么这很重要？`Polkadot` 革命性的区块链链有什么特性使其独一无二并值得你投入时间和金钱？它的重要性在于 `Polkadot` 能够为所有开发者构建具有价值、安全性和统一系统的区块链。\n\
  \n通过 `Polkadot`，区块链可以在 `para chains` 中连接。当它们放在一起时，这些 `para chains` 创造了一个所谓的“中继链”（relay\
  \ chain），在该链中，所有的交易地址都经过检查和验证，所有的数据都被标准化以理解中继链中的每个系统。`Polkadot` 将所有区块链变成一个极长、极安全的区块链。\n\
  \n但 `Polkadot` 不仅仅有它的区块链技术。与 `Cardano` 和其他加密货币系统一样，`Polkadot` 提供它的代币，命名为 `DOT`。`DOT`\
  \ 是一种内部加密货币代币，可以直接影响 `Polkadot` 网络。购买 `DOT` 的用户可以对 `Polkadot` 内部的潜在更改进行投票，这意味着每一次购买通行证也是一次投票，也是民主\
  \ `Polkadot` 过程的一部分。\n\n`Polkadot` 是加密货币大师 `Gavin Wood` 的作品，他是竞争对手币 `Ethereum` 历史上的一个重要人物。`Wood`\
  \ 是 `Ethereum` 的联合创始人之一核心开发人员之一，`Ethereum` 将成为游戏领域最大的名字之一，并且目前证明仍然是市场上最流行的币之一。`Wood`\
  \ 是编写该平台第一个实现代码的人，撰写了它的正式规范，并发明了 `Solidity` 合约编程语言。他很久就证明了自己的价值和能力，为加密投资者提供了充分的理由相信他并跟随他的领导。\n\
  \n他离开了 `Ethereum`，人们对他接下来要做什么非常感兴趣。他对 `Polkadot` 对区块链的这种新尝试以及将它们连接成一条巨大的、极安全的链的想法感到非常满意。\n\
  \n2016 年 1 月 11 日，`Wood` 完全离开了了 `Ethereum`，并将所有注意力都放在了 `Polkadot` 上。在 `Wood` 看来，这种后来被称为\
  \ `Polkadot` 的新技术将履行 `Ethereum` 仍需实现的许多承诺。他心中寄托了很高的期望和许多目标。`Wood` 说，`Polkadot` 的原始想法是在\
  \ 2016 年夏天出现在他脑海中的。在同位开发者 `Marek Kotewicz` 的推动下，`Wood` 开始设计一个尽可能简单的 `Ethereum` 分片版本。到\
  \ 2016 年 10 月，`Wood` 完成了《Polkadot 白皮书》的第一稿，他立即知道自己拥有了某种特别的东西。\n\n自上市以来，`Polkadot`\
  \ 已经达了许多里程碑，证明了许多人确实相信 `Wood` 并追随他开启了新事业。它攀升成为第四大加密货币，并达到了 180 亿美元的市值顶点。\n\n不仅仅是投资者相信\
  \ `Polkadot`。其他加密货币公司和团队也真心相信 `Polkadot` 背后的理念和概念。这是如何知道的？由于现在有超过 340 个项目在 `Polkadot`\
  \ 系统上积极开发。它们都将通过 `Polkadot` 的平行链系统连接。如果这么多创建加密货币的人都相信 `Polkadot`，普通投资者也相信它并不意外。\n\
  \n# 为什么是山寨币？\n\n有些人在进入加密货币领域时只想投资 `比特币`。他们觉得 `比特币` 是唯一可靠的选择，一种总会有回报的投资，而且比其他风险更低。\n\
  \n对于那些人来说这很好，但你应该在投资组合中加入一些山寨币，以成为一个才华且成功的交易者。\n\n\n\n山寨币（Altcoins）是赚钱以及发现他人可能错错成功机会的极佳途径。但最好的方式总是选择你想要投资的山寨币。相反，最好的做法是基于对市场以及加密货币、比特币和山寨币历史的理解做出选择。了解是什么推动了其他山寨币走向巅峰或陷入低谷。你将开始在加密货币世界中发现规律，某些吸引投资者的特征以及那些不吸引他们的特征。这将为你的选择提供参考，并引导你找到正确的山寨币。在有这么多选择、这么多获得巨大价值或遭受重大损失的机会的情况下，认真对待购买山寨币至关重要。否则，这就像是在挥霍资金。\n\
  \n# 如何购买比特币和山寨币\n\n在掌握了更多关于市场运作方式的知识后，是时候进入另一个重要主题了：到底在地球的哪里购买加密货币并开始你的交易生涯呢？\n\n\
  幸运的是，现在你有很多选择。在加密货币的早期，购买某些货币是一项挑战性任务。人们需要学习如何购买属于自己的加密货币份额。这主要是因为没有规则或规定，没有指导指南告诉人们去哪里、如何购买以及看什么。记住，一切都是由那些渴望系统并长期期待加密货币的人所创造的。他们既是决定系统如何运作的人，也是使用该系统的人。\n\
  \n在早期，这就像许多人在漆黑的房间里徘徊寻找灯开关。他们不知道该去哪里，不知道该做什么，也不知道应该采取的正确步骤。随着时间的推移，正式的程序开始形成，某些网站和留言板应运而生。随着加密货币变得越来越流行，即使人数相对较少，事情也变得简单多了。加密货币的早期，人们在留言板上买卖硬币，这种原始且复杂的交易方式花费了太多的精力和精力，而且让人困惑。\n\
  \n天哪，时代变了。今天，你可以轻松地购买加密货币。这就像登录网站一样简单。只需几分钟时间，你就可以创建一个与你的借记卡关联的新账户，并能够投资你选择的加密货币。\n\
  \n你可以购买加密货币的网站被称为在线交易所（online exchanges），它们是你购买加密货币的市场场所。根据网站的不同，你在购买时会有特定的选项。你会有很多选择，比几年前要多得多。我们稍后会介绍所有其他类型的加密货币，即山寨币。然而，在我们的示例中，我们将专门关注第一种最流行的加密货币形式：比特币。\n\
  \n最好的做法是决定哪家在线交易所值得投入你的时间、精力和金。这是一个关键决定，因为一个经验法是对于所有的加密货币需求都坚持同一家在线业务。无论你选择哪家，请尝试在整个交易生涯中一直使用他们。\n\
  \n选择在线交易所时你有哪些选择？选择多样且总是充满希望。这取决于你自己判断谁适合你。\n\n## Coinbase\n\n让我们从这个业内最大的名字开始。Coinbase\
  \ 无疑是全球最流行的在线加密货币交易所。它是最为人知的交易所，也是许多人的首选。\n\n是什么吸引了这么多选择 Coinbase？有些人说是因为易用性，另一些人则是因为安全性。Coinbase\
  \ 也是提供多种币的交易所之一，这使其成为新手入门的热点。\n\nCoinbase 还提供一个名为 `Coinbase Pro` 的高级版本，专为更高级的交易者设计。该版本提供了更多的工具和功能，帮助用户做出更明智的交易决策。\n\
  \n### Binance\n\nBinance 成立于 2017 年。从那时，它积累了令人印象目的粉丝，是市场上最受欢迎的在线交易所之一。\n\n是什么导致了其人气的爆炸式增长？有些人是因为币种数量多，另一些人则是因为手续费低。Binance\
  \ 还提供了许多帮助用户应对加密货币世界的功能。\n\nBinance 还以其数据和图表为自豪，这对于做出明智投资至关重要。然而，该网站对新手来说可能有点让人无措，更适合经验丰富的用户。\n\
  \n## KuCoin\n\nKuCoin 起源于中国，是最受欢迎的在线交易所之一，凭借其丰富的加密货币供应积累了大量的粉丝。\n\nKuCoin 的优点之一，无疑也是吸引如此多用户的原因之一，是它没有充值费。当提到交易费时，它也相对便宜，仅为\
  \ `.1%`。KuCoin 还承诺在其他方面也保持低价格。\n\n\n\n\n现在，KuCoin 也有它的缺点。使用该网站最显著的缺点之一是它仅支持传统货币或法币。这意味着在\
  \ KuCoin 开始交易之前，你必须使用其他服务来获取比特币或以太坊。\n\nKuCoin 是对于新手和资深交易者来说都是一个令人兴奋且创新的在线交易所。它跳出框架，尝试新事物，并以不同的方式运营，试图提供其他网站未提供的额外激励和奖励。总之，KuCoin\
  \ 会吸引人们，而不仅仅是因为它让投资和交易硬币变得简单。\n\n## eToro\n\neToro 是另一个极受欢迎的加密货币在线交易所，现在已在 100 多个国家立足。eToro\
  \ 起于以色列，最初仅提供比特币交易，但最终开放接受更多形式的加密货币，包括几十种有前景且低为人知的山寨币。它现在为最资深的专业人士提供了大量的选择。但即使你刚进入加密货币世界，eToro\
  \ 也有很多为你提供的内容。\n\n首先，eToro 是一个易用且功能强大的网站，具有许多实用的功能。这些功能让投资和交易变得轻松直观，无论你是开始第一笔还是第百次交易。事实是，许多在线交易所往往对用户不是非常友好。遗憾的是，许多人在进行加密货币投资时感到很困难，但\
  \ eToro 让这一切变得简单，并让你觉得对事物有了深入且稳固的理解。\n\n他们的一些新想法简直是天才的。例如，跟单交易。这项惊的功能允许你复制网络中其他交易者的仓，即使你不认识他们。这可能看起来更兴奋、更新颖，但如果你在网站上认识了你正在寻求的成功的其他人，这非常有帮助。为什么不直接复制他们的仓呢？尝试像你尊重的人并不可耻。如果你成为某个特定投资者的粉丝或想模仿他们的成功，跟单功能将让你如愿以。\n\
  \neToro 允许你尝试不仅限于加密货币的内容。你还可以购买和交易股票、货币、大商品等。你会发现许多在线交易所开始允许客户购买其他物品，将比特币与供应相结合，并给他们一种真正的正常感。\n\
  \n## Gemini\n\nGemini 由 Tyler 和 Cameron Winklevoss 创立，这对双胞胎大亨声称他们是 Facebook 理念的创造者。他们进军加密货币行业引起了推测和关注；在\
  \ Gemini 完全推出之前，就有人准备好使用它了。对某些人来说，这感觉像是两个科技初创公司的名人试图登上下一个大热门的车，但并没有真正相信它。尽管如此，Winklevoss\
  \ 兄弟俩在 Gemini 上付出了大量精力，使其成为一个自立自生的特殊事物。\n\nGemini 的外观和感觉简洁且现代，看起来非常时髦；它让投资加密货币感觉很酷。整个网站也非常用户友好，拥有许多直观的控制控件，这会让初次用户感到轻而易举。他们在创造一个简单、无痛的投资过程上投入了巨大精力。\n\
  \nGemini 有很多优点但也有一些缺点。例如，可选货币并不多，而且社区仍然非常紧密，对对某些人来说可能感觉很小。它也可能感觉过于紧密、太近了。这意味着在 Gemini\
  \ 上与他人建立许多个人联系是困难的。其他人声称 Gemini 感觉很冰冷、冷漠，与包容性相反。然而，它运行良好，外观也很棒，并且可以在美国、加拿大、日本、英国等许多地区访问。至于审美方面，这是许多其他现代网站追求的风格，因为它散发出一种时髦、年轻、现代的氛围。\n\
  \n但不仅于此；购买比特币和加密货币的其他方法不需要你登录网站。随着加密货币热潮在过去全球范围内升温，一种购买加密货币的现实替代方案已经出现。\n\n## 比特币\
  \ ATM\n\n你可能会对这里列出的“比特币 ATM”这一术语感到困惑，因为你被再一次告知你无法在现实世界购买比特币或加密货币。这仍然是真的；你不能像购买任何实体资产那样购买它们。但时代已经了，你可以亲身购买加密货币。某种程度上。\n\
  \n自从比特币 ATM 诞生，在线交易所不再是你购买比特币的唯一途径。投资现在变得像走到 ATM 一样简单。这是因为现在世界上有了比特币 ATM。像普通的银行\
  \ ATM 一样，比特币 ATM 允许你投入钱以换取一些比特币。但由于比特币并不物理存在，将钱放入比特币 ATM 就像将你的法币投到网上。你永远不会再看到它，但你知道它就在那里，正在为你赚钱。\n\
  \n比特币 ATM 背后的概念可以更精确，因为与传统的 ATM 不同，你并不是在这些机器上存款或取现现金。是的，你正在把钱放入机器里。但它并没有进入你的账户。相反，比特币\
  \ ATM 是用于使用法币买卖比特币。所以你走到机器前，输入你的信息，存现金，然后选择你想要购买的加密货币。这是一种无需登录电脑就能进入比特币行业并投资的方式。\n\
  \n使用比特币 ATM 购买或出售相对简单，类似于在普通传统 ATM 上采取的步骤。首先，你靠近机器，你必须做的第一件事是验证你的身份。大多数比特币 ATM 通常会要求你输入手机信息。输入之后，你将在继续操作之前会收到一条短信来验证你的身份。\n\
  \n如果你想在 ATM 购买比特币，必须存入相应数的现金。之后，自动取款机将生成一个唯一的 二 ，你的数字钱包 App 在手机上扫描。通过这种方式，ATM 告诉你的数字钱包交易成功，并将数字资金添加到你的钱包中。在整个过程中，除了最初投入机器的钱外，从未发生过资金交易。这可能会吓跑一些人，因为他们需要习惯\
  \ ATM 不给他们东西。但这是比特币 ATM，而且像所有加密货币一样，它高度重视互联网。\n\n## 如何存储加密货币？\n\n之前提到过加密货币的安全性，得出的结论是，尽管它有风险，加密货币是一种安全的投资商品。黑客攻击或盗窃偷走你积累财富的概率是罕见的。它比罕见还要罕见。尽管如此，这种情况绝非零。\n\
  \n\n\n\n\n# 这就是为什么有些人会投资购买钱包。什么是钱包？钱包顾名其义，就是你存储资金的地方。然而，由于这是加密货币，加密钱包与之还关联着重大的数字属性。你可能会问自己，如何留住一个并不存在的东西呢？如果一切都是数字化的，钱包内部又装了什么？由于这是一种现代数字货币，这是一个非常时尚的数字钱包。\n\
  \n加密货币钱包存储了私钥，私钥充当了你的专用 ID，即允许你与其他进行加密货币交易的唯一代码。加密钱包的工作原理是，你通过只有你自己知道的唯一密码访问它。与所有密码一样，你永远不应该交出你的加密钱包。否则，你将面临严的痛苦和财务损失。\n\
  \n需要注意的是，大多数在线交易所都提供内置的加密钱包。当你通过这些网站购买加密货币时，它们也会存储在这些区域内，你可以登录网站监控你的加密货币，并直接通过网站进行发送、投资和购买更多。这让许多人问，为什么要离开你购买加密货币的地方？为什么不直接使用他们提供的钱包呢？答案是，许多人希望为自己的投资提供额外的安全保障。他们希望更进一步，购买一个能提供更高安全的钱包。全球许多钱包和账本公司已经向数百万客户证明了它们自己，这些公司比在线交易所更进一步，并承诺更多。\n\
  \n如今市场上有多多种加密钱包，每种都有其优缺点。根据你属于哪种类型的交易者以及你需要的安全程度，有一种钱包会让你感到完美。例如，正如你想象的那样，网络钱包允许你直接从网络浏览器接收、发送和存储你的比特币和其他加密货币。这种基础形式的钱包易于使用，学习曲线很短。几乎所有提供账户的在线交易所也会为你提供一个免费的网络钱包。然而，通常建议你研究并投资另一种类型的钱包，即具有更强大安全措施的钱包，这会带给你更多的舒适和安全。虽然在线交易所是寻找、购买和交易加密货币的好地方，但当你想要存储它们时，那里并不总是最好的。\n\
  \n还有桌面钱包，它将你的私钥直接存储在硬盘上。这让你所有的钱都存储在一个中心位置。桌面钱包将你的电脑变成一个存放你辛苦赚来的加密货币的保险箱。由于它只存储在那个位置，只有当你能够访问带有硬盘的唯一电脑时，才能访问此钱包。这是一个巨大的优势，因为你将始终知道钱在哪里，这让许多用户感到安心。然而，你必须确保安装桌面钱包的电脑比比安全还要安全，并且无法受到外部人员的入侵。\n\
  \n此外，还有移动钱包。它们是便携式设备，你可以在智能手机上随身携带。通过`QR codes`和其他移动技术，这些移动钱包允许你经常且费费精力地访问和监控你的资金。\n\
  \n硬件钱包是最常见的类型之一。它们看起来像你在许多学生和商务人士手中看到的小型 USB 闪存驱动，即你可以插入笔记本电脑并随身携带信息的小型硬盘。就像`USB\
  \ drives` 一样，硬件钱包是拥有非实体物品——你的加密货币的物理方式。通过硬件钱包，你可以通过只有你自己知道的密码访问资金。随着这些硬件钱包变得越来越流行，它们的功能越来越强大，也更容易发现和使用。它们现在配备了专门为它们创建的应用程序。硬件钱包市场日益增长，是所有加密货币领域最令人兴奋的行业之一。它也是最安全的行业之一。\n\
  \n为你的硬件钱包创建密码所带来的额外安全性是拥有它的众多红利之一。你可以将钱包离线并断开网络连接，这一事实使其免受黑客攻击，而密码则使其免于任何拿到你钱包的人。由于你为硬件钱包创建密码所带来的额外安全性是拥有它的众多红利之一。这些保护层硬件钱包更安全、更易用且更可靠。\n\
  \n# 第 6 章：加密之外的区块链\n\n## 区块链如何改变世界？\n\n正如你所见，区块链技术被许多行业的许多公司使用。它是一个全球范围内的巨型电子表格。它是开源的，任何人都可以更改底层代码，并看到发生的情况。它是真正的对点化的；不需要强大的中介来验证身份或结算交易。\n\
  \n这种想法本身就是区块链如此具有革命性和改变游戏规则的原因之一。它让普通人变得像顶层一样强大。\n\n但区块链对世界的影响不仅于此。以发送资金为例。跨境汇款可能需要几天时间。最好的情况下，这是令人沮丧的；最坏的情况下，它可能意味着缺乏物资或等待医疗治疗。\n\
  \n目前，银行在其他国家持有`nostro/vostro accounts`并使用 `SWIFT` 消息系统安排传输。如果银行之间存在协议，传输通常可以在当天完成。但在货币受严格控制的发展中国家，你的银行必须使用中介或流动性代理，这更加昂贵、耗时且劳动密集。\n\
  \n区块链解决方案大大缩短了跨境汇款的时间和成本。通过区块链网络连接的参与银行，所有的合规身份检查将自动完成并通过加密签名进行验证。一旦清除，交易通常在几秒钟内结算，为双方银行留下不可篡改的记录。\n\
  \n买房呢？你知道区块链也将协助这一古老的流程吗？房地产市场是一个混乱、乏味的业务。买房可能需要几个月的痛苦文件和昂贵的律师费。在英国，情况更加糟糕。卖家可以接受你的报价，但后来由于更高的报价而拒绝，这种策略被称为`gazumping`（跳价，尽管官方人员终于开始监管它）。\n\
  \n大多数房地产市场问题源于对更多信任的需求。由大量签名文件支持的复杂土地登记使得追踪变得困难，而验证需要银行、政府机构和律师的协调。结果是我们许多人畏惧的昂贵且耗时的过程。\n\
  \n然而，区块链是不需要信任的，消除了对中介执行复杂验证过程的需求。通过区块链，只有一个透明的真相版本，如果没有其他人的同意，一方无法进行更改。它在实际上是防篡改的，减少了纸质工作并降低了欺诈风险。\n\
  \n最重要的是，区块链将显著改善医疗行业。你的病史有助于医生快速有效地治疗你，但你的病史可能分散在多个医疗服务者处。服务者系统之间的不兼容性减慢了记录传输，通常需要人工干预。没有完整的病史，医生可能会在不需要的测试上浪费金和时间，或者无法为你提供最佳治疗。\n\
  \n\n\n\n区块链可以通过从根本上提高医疗记录的准确性和可用性，使治疗健康问题变得更加容易。通过创建一个你拥有的、可访问且永久的 `blockchain`\
  \ 记录，你可以立即显示疾病、过敏史和生活方式因素，这些有助于医生对你进行诊断和治疗。它还能验证你的身份，确保你不会与候诊室里的另一个 `John Smith`\
  \ 混淆。\n\n最后，`blockchain` 将为你提供更强大的保障，确保你购买的商品是正品。\n\n### 供应链管理透明化\n\n目前，大部分供应链管理是通过\
  \ `EDI` 完成的，这是一种最早于 20 世纪 70 年代引入系统。虽然比纸质时代有了巨大的进步，但远非完美。`EDI` 仅支持双向通信，将其他相关方排除在之外。如果双方约定共同欺骗第三方，他们的活动将保持隐秘（例如，假货制造商与分销商合谋在\
  \ `Amazon` 上销售产品）。\n\n`blockchain` 则并非如此。产品旅程的每一个阶段，从制造到集装箱序列号，都会被记录并供所有利益相关者查看，不存在走捷径或伪造信息的可能。它还提供了一个开放透明的框架，消除了困惑和争议。`blockchain`\
  \ 确保当你购买某件物品时它是真品。当你购买东西时，它是实真实实的。\n\n# 为什么区块链变得如此流行？\n\n无疑， `blockchain` 背后的科学技术正在发力，并在全球许多公司、行业和各行各业吸引了新的粉丝。为什么？是什么在推动这种流行？\n\
  \n`blockchain` 技术之所以成为大趋势，是因为它与 `cryptocurrencies` 和 `tokenized solutions` 相关联。`Tokenization`（代币化）是将价值单位拆分为更小的单位，以便更多的人可以购买比通常情况下更小的单位。这在现有的信息和通信互联网的基础上，增加了货币和价值交易的互联网。\n\
  \n这种技术可以采取的形式巨大且多样，从 `Bitcoin` 和其他 `cryptocurrencies` 到 `Facebook` 对国际支付系统、银行和金融的计划；从基于\
  \ `blockchain` 的更快速更安全的国际结算设计，到房地产和其他基于证券的投资（允许人们对过去价值门槛很高的证券进行小额投资）；再到基于 `IOT`（物联网）传感器的自动发票和支付，或者仅仅是小额的在线打赏。\n\
  \n`blockchain` 获取了互联网——并加上了钱。这种钱不受现有的国家和国际 `fiat currencies`（法定货币）银行系统的控制、监管或限制。而\
  \ `blockchain` 才刚刚开始。就像互联网一样，随着技术的成熟和更多易用消费者解决方案的出现，这项新技术被采纳和使用的速度将越来越快。\n\n## NFTs\n\
  \n一个 `NFT` 本质上是一种收藏级数字资产，作为 `cryptocurrency` 以及艺术或文化的形式具有价值。就像艺术被视为一种价值投资一样，`NFTs`\
  \ 也是如此。但是如何实现的呢？\n\n首先，我们来拆解这个术语。`NFT` 代表 `non-fungible token`（非同质化代币）——一种数字令牌，属于\
  \ `cryptocurrency` 的类似于 `Bitcoin` 或 `Ethereum`。但与 `Bitcoin` `blockchain` 中的标准币不同，`NFT`\
  \ 是唯一的，不能进行等物交换（因此是“非同质化的”）。\n\n那么是什么让 `NFT` 比普通的 `crypto coin` 更特殊呢？文件存储了额外信息，使其超越了纯货币，并进入了任何领域。`NFTs`\
  \ 的类型极其多样，但它们可以采取以下形式……\n\n*(注：由于原文部分文本在 NFT 处存在大量截断或重复，此处已根据要求保留核心语义并排版)*\n\n\n\
  \n\nNFT 在创建过程中消耗了惊人的能量。这甚至让许多抗议者对这种狂热给环境可能造成的真实影响感到担忧。一个名为“新冠病毒”的作品在创建时消耗了惊人的 192\
  \ kWh 电能。这等同于一个欧盟居民两周的总能源消耗。但你可能会问，那一定是一件特别巨大的作品吧？不，一个“简单”的 GIF 也可以达到同样的消耗量。\n\n\
  在一个人们努力变得更加绿色、对地球更友好的现代，NFT 因为它们对环境造成的破坏而引发了争议。\n\n# 第 7 章：加密货币挖掘\n\n如果你正在研究加密货币并考虑进入买卖领域，那么“挖掘”这个词你已经听很多了。事实上，当人们谈论加密货币时，挖掘是最常讨论的话题之一。它可能会让你想到一个老金矿工用铁镐在黑暗、危险的洞穴深处开采黄金或钻石。\n\
  \n果不其然，挖掘确实可以帮你找到以 `Bitcoin` 形式存在的属于你自己的钻石。它确实可以让许多加密货币进入你的口袋。但就像 1800 世纪淘金热中的矿工一样，挖掘也可能让你一无而归。挖掘确实有丰厚的回报，但也存在巨大的风险。\n\
  \n那么它到底是什么？这种吸引了这么多人的挖掘之物到底是什么？即使在经验丰富的加密货币粉丝中，挖掘也是一个令人困惑的症结，提出的问题比答案还多。长期研究加密货币的人仍然不会尝试挖掘，因为这令人生生畏且具有挑战性。是什么让它如此困难？另外，它值吗？是付出的努力大于价值，还是某种赚取额外收入的正当方式？\n\
  \n加密货币挖掘非常复杂。不仅实际过程本身复杂，它的解释也是如此。我们将尝试尽可能快速、通俗地将其拆解，但如果没听懂，请不要惊讶。\n\n加密货币挖掘是一个缓慢而艰苦的过程，通过检查最新的加密货币交易来验证它们，并确保其合法性。挖掘的目标是避免可怕的“双重花费”概念。双重花费是直接影响加密货币的问题。它是指某人同时在两个地方花费同一笔钱。\n\
  \n实体货币是不可能双重花费的。如果你走进商店花 10 美元买一个三明治，你将 10 美元钞票交给员工，它就不再属于你了，你无法再在别处花掉它。使用借记卡或信用卡支付也是如此。无论你属于哪家金融机构，都会立即从你的结算账户或信用卡中扣除精确金额，那笔钱就不再由你支配了。\n\
  \n但当你用加密货币支付时，你可以同时在两个地方花费这笔钱。你使用的是为每笔交易创建的代码和特定密钥进行支付。而且你是在没有银行和其他稳定货币系统建立的常规检查与平衡的情况下完成这一切的。如果没有人在看，作弊是有可能的。\n\
  \n这就是加密货币挖掘派上用场的地方。挖掘是你确保没有人被诈骗所需要的检查与平衡。然而，挖掘并不是由你银行的员工或某台遵循内置程序的匿名计算机完成。相反，挖掘是由最初投资和交易加密货币的那些自己完成的。\n\
  \n# 什么是挖掘？\n\n加密货币挖掘是一个通过将 `Bitcoin` 交易添加到货币的账本或记录（即 `blockchain`，区块链）中来验证交易的过程。这是一个挑战性的过程，也是一个漫长的过程。挖掘不是你随手就能拿起或在任何电脑上运行的东西。\n\
  \n矿工使用专用硬件来完成确认 `Bitcoin` 交易的复杂计算。简单来说，矿工正试图组装一个巨大且极难的拼图。成千上万的矿工同时工作，试图破解发送给他们的代码。他们是匿名的审计员，所有人朝着同一个目标努力。谁先获得它，谁就获得奖励：`Bitcoins`。\n\
  \n挖掘持续着我们之前提到的 `blockchain`。挖掘是处理重要信息（如 `Bitcoin` 交易在过去 10 分钟内的操作）。从那里，`miner`（矿工）必须解决一个计算谜题。一旦有人解决了谜题，他们就会获得奖励：`Bitcoins`。\n\
  \n# 我能成为矿工吗？\n\n假设你决定尝试，并投入时间和金钱构建自己的加密货币挖掘电脑。你研究了信息，并确定如果你的电脑运行良好，就可以赚取 `Bitcoin`\
  \ 奖励。\n\n现在是确定购买和构建你的挖掘电脑需要什么了。如果你遵循这些步骤，保持耐心，并且不预期立即成功，巨大的利润可能等待着你。\n\n在我们进入具体的物品和步骤之前，必须再次提醒你：通过加密货币挖掘可能赚到很多钱，但这仍然不确定。你可能一分钱也赚不到。\n\
  在进入加密货币世界时不要预期惊喜。现在没有，也许永远没有。如果它回报，回报会很丰厚。但并没有承诺它一定会有回报。\n\n# 矿机类型\n\n什么是矿机？它是一台电脑。但它不是你家里的那种电脑。不，矿机是一台没有显示器的电脑。矿机机箱拥有\
  \ `GPU` 卡、主板、冷却系统等。\n\n那么它是如何运行的呢？矿机当然需要连接到互联网，以及它所需的 `blockchain` 网络。`blockchain`\
  \ 网络每天 24 小时独立运行，由连接到网络的电脑中的显卡驱动。\n\n```\nASIC\n```\n\n\n\n\n首先是 ASIC 矿机。ASIC 代表\
  \ `Application-Specific Integrated Circuits`（专用集成电路）。这些是为单一目的而创建的特殊设备。当你想要开启加密货币挖矿之旅时，这是最重要、最强大的选择。必须记住，它们不仅仅是电脑。ASIC\
  \ 矿机是专为一件事且仅为一件事而制造工具。在这种情况下，那件事就是挖矿。这是一台为了完成任务而设计的专用机器。\n\n制造或购买 ASIC 是困难的，因为它们在自己的领域内表现非常出色。它们令人印象深刻的性能意味着许多想要进入挖矿领域的人都想要\
  \ ASIC。这意味着它们很难获得。虽然最终获得一台 ASIC 是值得的，而且可能可能是你获得成功挖矿生涯的最佳选择，但寻找它将耗费大量精力。你将不得不依赖第三方卖家，或者一个非常、非常、非常精通技术的朋友，他们可以为你制造一台。记住，这看起来不像你在家里用来上网或玩视频游戏的个人电脑。这是一个完全不同的物物种。\n\
  \n关于 ASIC 组装也存在一些争议。这些引人注目的设备被指控在戏弄和干扰网络上的其他挖矿设备，这导致它们遭到了许多鄙视和指责。当你创建或购买 ASIC 时，你需要记住这一点，特别是如果你关心网络上其他矿工的利益。尽管如此，这仍然是挖矿的最强大、最令人印象深刻的计算机。\n\
  \n# GPU\n\n如果你想挖矿，并且说，在空余时间看看 Netflix 或和朋友在线玩游戏，那么 GPU 挖矿方法是一个很棒的选择。与 ASIC 方案不同，它们可以不仅仅是矿机。这使得它们非常受欢迎，而且相对容易创建和维护。\n\
  \nGPU 矿机是那些想要组装电脑的人的最爱。虽然这仍然困难并需要大量的计算机知识，但并非不可能，而且几乎不像购买 ASIC 那样令人生畏。\n\nGPU 矿机有两种类型：简单型和专用矿机。你可以猜到什么是专用矿机了。它那是一台专为挖矿制造的\
  \ GPU 计算机。如果你想全心投入加密货币挖矿，并希望投入大量时间来解锁和加密区块链，这是一条正确的路径。\n\n但如果你想和家里的其他人共享电脑呢？如果你是一个热衷的《魔兽世界》玩家，或者用电脑做作业呢？那么你将想要简单矿机，即第二种\
  \ GPU 计算机。你可以使用此设备进行挖矿，并完成个人电脑可以做的其他典型事务。在这两个选项之间选择的能力，对于想要尝试挖矿的人来说是一个极佳的激励。\n\n\
  缺点又是什么？在购买或制作 GPU 计算机时有一个主要的缺点。那就是价格。创建或购买这些设备之一可能非常昂贵。与 ASIC 模型不同，GPU 严重依赖于显卡。显卡可能会变得昂贵，尤其是当你寻找能够胜任的高端显卡时。\n\
  \n最终影响你钱包的不仅仅是显卡。你的 GPU 需要许多华丽的配置和一些插件来保持在最佳状态运行。你需要冷却设备和稳健的电力系统。如果你的 GPU 遇到波折需要维修，你将不得不花费大量的资金才能有效地进行。\n\
  \n尽管存在这些挫折和挑战。\n\n\n\n在组装电脑时，你需要投入一笔巨款来打造一台能够胜任工作的设备。CPU 矿机所需的显卡至少需要 700 美元。有些显卡的价格比这贵得多，这取决于你对使用的舒适程度。请记住，在矿机的任何部分上偷工减料追求便宜，长远来看都会让你付出代价，并影响你电脑成功挖矿的能力。这样花钱很难，但看着其他电脑在性能上一个个超过你，而你付出了这一切却毫无无获，那将更加困难。\n\
  \n单是显卡就会让你的银行账户大出血。从那里开始，其他组件也没有便宜到哪里。有人花费大约 3,000 美元组建加密货币矿机，但那是你可能花费的最低金额，而且那种电脑将没有前景，也不会提供太多的成功机会。\n\
  \n另一方面，有些人在矿机上花费了超过 10,000 美元。这比许多汽车都要贵。即便如此，也无法保证成功。你可能在矿机上花费数千美元，但最终还是空手而归。你的机会会根据你花费的金额而增加吗？是的，确实会。但不要认为花费\
  \ 10,000 美元自动意味着你将赚到比特币。\n\n进入挖矿领域，电脑的价格并不是你唯一考虑的因素。记住你挖矿时将使用的电力。总费用会迅速增加，并让一些人直接陷入破产法。\n\
  \n我们都有电费单，并对平均价格很熟悉。你知道在冬夏高峰期，由于你和家人的保暖或酷凉所需的消耗，你的电费将会飙升。但即使是你遇到过的最高账单，与你开始在家进行加密货币挖矿将经历经历相比也微不足道。\n\
  \n研究表明，挖出一个比特币的最低电力成本超过 3,000 美元。这是一个天文数字，而且还处于光谱的低端。在全美电价最低的州，你需要花费大约 3,000 美元才能挖出一个币。如果你住在电价较高的州，你可能需要花费\
  \ 6,000 美元来挖你的比特币。这个报价，加上创建和维护矿机的成本，是令人难以接受的。如果你投入了这么多钱却没有得到任何回报，这将是很难被接受的。按照那个速度，可能需要几周或几个月才能获得投资回报，而这仅仅是在你的矿机运行完美且足够幸运挖出一个币的情况下。\n\
  \n你可以从你投入资金的多少中看到与加密货币挖矿相关的风险和回报。构建和维护矿机的成本足以让许多人放弃尝试通过这种方式赚钱。但当你回回报比特币的价值时，它听起来更有前景了。请记住，像与加密货币相关的一切事物一样，你的成功不是肯定的，而且这种成功不会很快发生。\n\
  \n# 挖矿合法吗？\n\n加密货币挖矿和加密货币本身一样，在全球范围内并不是法的。虽然大多数国家允许 `Bitcoin` 和其他代币，但有些国家并不允许。如果你住在埃及、厄瓜多尔、尼泊尔、巴基斯坦和摩洛哥，你将无法购买或交易加密货币，也无法挖矿。\n\
  \n然而，在其他国家，你可以自由购买和挖矿。但这并不意味着情况将永远如此。随着加密货币变得越来越流行并破坏传统的货币体系，越来越多掌握权力的人（如政治家）已经站出来反对它，并希望限制或完全剥夺它。如果这种情况在你居住的国家发生，你挖矿和购买加密货币的能力将成为过去，并可能使你陷入严重的法律困境。\n\
  \n这是加密货币挖矿的另一个风险之一。加密货币格局不断变化，无论好坏。持续波动的不仅是硬币的价值。对加密货币的观点和未来展望也一直处于变动之中。在未来的几个月和几年里，一些国家将成功禁止加密货币以及购买、交易和挖币的能力。\n\
  \n这种不可预测性是挖矿的一个重大缺陷。想象一下在挖矿上投入了成千上万美元。想象一下开始获利。想象一下它在你所在的地区被禁止了，而你实际上在触法。所有的钱、所有的时间、所有的能量——全部付诸东流。这就是你参与这个仍然不成熟的行业所承担的风险。\n\
  \n# 矿池如何？\n\n你可能读到过矿池作为运行矿机的智能替代方案。这是一条更简单的路线，但它也有自己的缺点。什么是矿池？它是一组矿工共同工作以解锁并获得奖励。正如你想象的那样，产生的币并不属于某一个矿工。相反，所有参与者平分收益。\n\
  \n这些矿池由依赖计算机网络的第三方运行。这确实是一种更简单且利润更丰厚的挖矿方式。工作的重量不在你和你你的矿机上，而是均匀分布在你的矿池中。然而，再次重要的是，即使你是矿池的一员，挖矿也没有成功的保证。\n\
  \n# 底线：我应该挖加密货币吗？\n\n像与加密货币相关的一切事物一样，挖矿需要更清晰的说明。一些人认为它是稳赢的，是快速致富的好方法。然而，其他人认为挖矿的回报是不可能的，它将是时间和金钱的浪费。\n\
  \n现实介于两者之间。不，它不是一个暴富计划，也不应该被这样认为。它也不是完全完全浪费时间和金钱。你可能无法通过挖加密货币获得大富，但你有机会赚到钱。这些钱是否足以支付计算和电力的成本？\n\
  \n# 什么是分叉（Fork）？\n\n你以前可能听说过分叉，但可能没有听说过金融分叉，对吧？但分叉是金融机构的重要部分，特别是加密货币。它们可能会摧毁整个加密货币。\n\
  \n硬分叉（Hard fork）是指区块链新版本的节点不再接受旧版本，从而导致与之前的版本产生永久性的分歧。\n\n\n\n\n区块链的分叉（fork）可能发生在任何加密技术平台——而不仅仅是比特币。这是因为无论运行在何种加密平台上，区块链和加密货币的工作方式都是相同的。你可以将区块链中的区块看作移动内存的加密密钥。因为区块链中的矿工设定了驱动网络内存的规则，所以这些矿工了解这些新规则。\n\
  \n然而，所有矿工都必须对新规则以及链中有效区块的组成达成共识。因此，当你想要更改这些规则时，你需要对它们进行“分叉”（fork it）——就像路上的叉路口——以表示协议发生了变化或偏离。开发者随后可以更新软件以反映新规则。\n\
  \n通过这一分叉过程，出现了许多与比特币名称相似的数字货币：`bitcoin cash`（比特币现金）、`bitcoin gold`（比特币黄金）等。对于偶然的加密货币投资者来说，要区分这些加密货币的差异并将各种分叉映射到时间线上可能是困难的。为了帮助解决这个问题，我们编写了一份过去几年关键比特币硬分叉的历史。\n\
  \n开发者可能实施硬分叉的原因有几个，例如修复旧版本软件中发现的关键安全风险、添加新功能或撤销交易——例如 `Ethereum` 区块创建一个硬分叉来撤销对去中心化自治组织（DAO）的黑客攻击。\n\
  \n攻击发生后，`Ethereum`社区几乎一致地投票支持进行硬分叉，以回溯被匿名黑客盗走的价值数千万美元数字货币。硬分叉还帮助 `DAO` 代币持有者取回了他们的\
  \ `ether` 资金。\n\n硬分叉的建议并没有完全撤销网络的交易历史。相反，它将与 `DAO` 绑定的资金转移到一个新创建的智能合约中，让原始所有者提取资金。\n\
  \n`DAO` 代币持有者可以以约 `1 ETH` 兑 `100 DAO` 的比例提取 `ETH`。`DAO` 的策划人提取并分配了由于硬分叉而剩余的额外代币余额和任何剩余的\
  \ `ether`，以向该组织提供“故障保护”。\n\n# 第 8 章：如何在加密货币中保持安全\n\n我们已经研究并讨论了投资比特币和加密货币的众多优点，以及区块链惊人的力量。它有快速投资回报、开设新账户的便利，而且没有政府机构试图放慢你速度的限制。事实上，加密货币有很多值得庆祝的地方，它提供了赚钱并成为这一令人兴奋的市场的一部分的新颖且简单的方法。\n\
  \n加密货币是前所未有的，它的益处似乎是无尽的且真正令人印象深刻。对于投资者来说，它是一股清风，带来了许多从未投资或交易过、想在某种特殊事物的底层入场的新手。\n\
  \n不幸的是，它也招出了相当数量的骗子。正如我们之前说的，加密货币需要更多的透明度；人们需要学习很多知识，有很多容易被夸大或模糊的内容。加密货币带有某种模糊性，因为媒体需要准确地报告和描述它，而且由于其有些复杂的本质。如果你需要更熟悉这项技术，加密货币可能会让你感到苦恼。然而，仍然有人想要投资，尽管他们需要帮助来理解自己在做什么。这是一个灾难的根源，也是骗子梦想的成真。\n\
  \n由于对加密货币的困惑以及大型机构缺乏监管和监督，诈骗不幸地成为加密货币世界的一个重要组成部分。然而，你注定不会被骗子利用。有方法可以避开这些想要从你身上赚钱的罪犯。你只需要做好准备并保持警惕。\n\
  \n\n\n\n\n问题在于，他们可能需要投入更多。这些骗局希望通过向你展示带有伪造数字的虚假语句来欺骗你。你会认为自己做得很好，不会要求卖出你的硬币。或者你可能会要求获得目前为止的一小部分利润，这是他们付得起的代价。然而，他们正在给你使用他人的钱，同时吸收更多资金以维持他们骗局的运行。一旦系统被识破，它就会崩溃，谁也无法空无而归。\n\
  \n## 针对比特币的另一种庞氏骗围绕加密货币矿\n\n针对 `Bitcoin` 的另一种庞氏骗围绕加密货币矿。已经有新兴企业邀请你投资挖矿。正如我们讨论过的，加密货币挖矿是一个极其复杂的过程，需要大量的工作和处理能力来创建、加密和验证不断增长的区块链。然而，如果你的系统是幸运地成功挖出一个区块，你将获得`Bitcoin`\
  \ 作为奖励，这可以为你赚取数千美元。\n\n全球各地的骗子都知道挖矿是一件非常困惑的事情，大多数人对此知之甚少。但他们也知道很多人知道如果你成功挖矿，将获得巨大的回报。因此，这些骗子用最后将获得巨额现金的承诺来吸引人们。他们承诺自己拥有计算能力和技术；他们只需要钱让一切运转起来。\n\
  \n2019 年，一群骗子在创建了一家名为 `BitClub Network` 的公司后被破获。他们经营了多年骗局。他们通过承诺在巨型加密货币矿池中占有一席，向投资者募集了超过\
  \ 7.22 亿美元。他们信誓旦旦，巨大的利润即将到来，如果投资者招募其他人加入，可以赚到更多钱。最后，投资者们空手而归。\n\n庞氏骗局是一个很容易掉入的陷阱。它利用了你快速且不费力地赚钱的欲望。骗子非常清楚该说什么以及如何诱骗你。他们是口滑花舌的人，让自己看起来很博学、友好且乐于提供帮助。事实上，他们正在猎取那些不明真相的人。这是一种可怕的赚钱方式，是你应该一直警惕的。\n\
  \n确保你看到利润的证明，不要投资那些无法证明你赚了多少钱的阴暗业务。对任何潜在的骗局进行事实核查，在网上调查并进行一些研究。理想情况下，避免任何可能成为庞氏骗局的情况是最好的。致富的计划看起来太好而难以置信，因为它们几乎总是如此。你赚钱会比某些人所说的慢且更高效，所以如果有人告诉你你可以这样做，你应该非常警惕。\n\
  \n## 虚假比特币交易所\n\n韩国，2017 年。金融当局在该国进行了一次重大打击。涉嫌犯罪分子经营着一个名为 `BitKRX` 的骗局。`BitKRX`\
  \ 做了什么？他们向投资者承诺他们是该国最强大的 `Bitcoin` 交易平台，并从那些希望通过加密货币获利和赚钱的人那里骗取了数以百万计的美元。\n\n这类虚假网站这些年来变得越来越流行。`Bitcoin`\
  \ 变得越大，这些骗局也变得越严重。他们掠夺那些对投资不了解、不了解购买和交易 `Bitcoin` 复杂细节的人。他们知道人们终究想赚钱，而这些虚假交易所承诺了这一点。但他们给出的汇率也是前所未闻且坦率地说是不合理的。他们承诺你只需几乎不花钱就能投资，而且过程将是轻松且快速的。事实上，他们正在利用你并简单地偷走你的钱。这些钱没有没有购买\
  \ `Bitcoin` 或其他代币；没有进入任何市场。他们只是把你的现金装进了口袋，而你一无所有。\n\n虚假比特币交易所很难对，因为骗子很容易创建看起来真实、感觉像真的一样的网站。对于那些尚未进行适当研究的人来说，他们很容易上当。\n\
  \n\n\n\n\n诈骗者还有其他从你那里取钱的方法。不合法的虚假手机应用程序只会耗尽你的现金；诈骗网站植的恶意软件会黑入你的账户并窃取你的银行或电子邮件信息。甚至还有其他与比特币相关的骗局，例如有人自称是美国国税务局（IRS）的人，要求你缴纳通过加密货币筹集资金的税款。如果你不留神，有很多方法可以从你身上赚钱。我们列出的只是诈骗者采取的众多手段之一。你必须保持关注、获取信息，并始终确保自己的安全。投资比特币确实提供了赚钱的机会，这是事实。但成为比特币骗局的受害者只会带来心碎和财务破产。\n\
  \n# 加密货币会被禁止吗？为什么人们对其不不信任？\n\n正如你反复听到的那样，对比特币和加密货币的不信任程度是无与伦比的。许多人并不理解比特币，并且相信最受炒作和耸人听的阴谋论。有些人认为比特币只被黑客、诈骗者以及想要偷取你辛苦钱钱的人使用。另一些人认为比特币很容易被破解和盗窃，没有理由投资，因为它会被某些犯罪计算机高手夺走。还有人认为它在任何地方在使用，或者它没有任何价值。\n\
  \n许多关于比特币的困惑且毫无根据的想法导致了狂热的投机以及偏颇的见解观点。然而，另一些人很清楚。有些人了解比特币和加密货币的细节及其运作方式。他们是现实主义者；他们理解比特币的优缺点。尽管如此，他们仍然选择反对比特币，并拼命确保它无法在现代世界中立足脚跟。为什么这些人对比特币及其潜力反击得如此激烈？他们在害怕什么？为什么他们如此地仇恶它？为什么这些本该了解更多的人会对比特币发泄如此大的愤怒？\n\
  \n## （传统）货币就是权力\n\n记住金钱是多么强大且至关重要，这没办法否认这一点，对这一陈述也没有好争论。人们说金钱是万恶之源，这可能是的。但它也是所有权力的根源。当一个人拥有权力时，他们就想要抓住它。\n\
  \n值得注意的是，某人仅仅想控制自己的权力并维持现状并不意味着他们邪恶。对此有充分的论据。当事物变化过于剧烈或过快时，整个世界的进程可能会崩溃。有些人正当当地想要保留他们获得的权力，因为他们真心相信替代方案可能会给经济和其中的人们带来终结。并不是每个想要维持现状强大的人都是贪财好爱的怪物。人们有目标、预期、偏见和欲望。为了你真心认为正确的事物而战并不是错的。\n\
  \n许多在政府和大型企业中获得巨大权力的人都是通过金钱实现的。他们赚了许多钱，花了许多钱才达到现在的地位。他们使用法币做到这一点。法币是一个描述传统货币的术语，例如`美元`、`日元`等。\n\
  \n法币的问题在于，它们之所以真正有价值是因为政府说它们有。例如，美国政府说过`美元`是美国唯一的有价值货币。如果他们某天出来宣布贝壳是美国新的、唯一接受的货币，那么贝壳现在就有了价值，而`美元`将变成一张毫无意义的薄纸。任何实体资产在技术上都不支撑法币。你在阅读关于金钱的内容时可能会看到一个术语。它写着“由政府的全信任和信誉背书”。这意味着政府相信这种货币，这就是它有价值的原因。它被选中、被认为是合适的，这就是你使用它的原因。\n\
  \n随着技术的进步，这对某些人来说意义变得越来越小。但对于权势者来说，各国使用了几代的法币必须保持是唯一的、无与伦比的支付形式。那是他们积累的这种货币，是让世界运转的这种货币，是让企业繁荣、股市大涨的这种货币。如果法币因为有了合法的竞争而没有那么大的价值，那么权力就不会那么强大。金钱就是权力，而且只有一种类型的钱可以被认可：权势者使用的钱。那就是法币。\n\
  \n政府希望避免新形式的货币，因为他们需要学习如何处理它。他们必须学会如何适当监控、征税或控制它。目前的政府对流通资金量和征税额有极大的控制权。他们可以追踪资金，因为他们正在处理资金。如果法币失去了权力，更多的人转向加密货币，政府将不再那么受控，这是他们极力想要避免的。\n\
  \n失去了对货币的控制，世界政府将无法控制财政政策、犯罪和商业世界。记住，那些控制傀儡政的金融精英在当前系统中有大量投资，他们会竭尽全力维持其现状。他们甚至会创建自己的央行数字货币（`CPDC`）来继续控制系统。但这只会帮助比特币繁荣，而不是关闭它。\n\
  \n权势者认为比特币或加密货币背后的概念是好的。有些人认为这个想法是革命性且至关重要的；有些人真心相信分支出并开启新事物。然而，许多人知道，如果权力在拥有权力的人和其他人之间分配，事情可能会变得混乱。经济会发生什么？商业行业会发生什么？如果加密货币变成主流，许多事情将发生改变。最重要的是，权力平衡将移动。他们不想那样。\n\
  \n不幸的是，这就是为什么如此多人转向对加密货币的影射、以及直白的阴谋论和谎言。一些政家和工业家公开表示，他们不希望看到加密货币繁荣，因为它有可能打破目前的运行模式。这是对事物的一种诚实观点。\n\
  \n\n\n\n\n这些人，连同那些不信任比特币力量并出于真正的关怀和担忧的人，有时会聚集在一起向立法者施压，要求他们通过立法来阻止比特币的发展。到目前为止，还没有人能够阻止像美国这样重要国家比特特的发展。在这个国家和其他其他国家，比特币仍然是自由且不受监管的。但这并没有阻止人们对其进行限制或直接禁止的尝试。\n\
  \n## 各州为比特币而战（或反对比特币而战）\n\n比特币最初被视为一种无国界——无民族的数字货币，它可以被随处接受，无论你在何处消费，它都不会受到任何监管。比特币理念背后最令人兴奋的方面之一是，你可以在任何地方使用它，用于任何物品。没有理由让比特币不并在所有辖辖区内普遍合法且不受限制，不仅是在美国，而是全球范围内。\n\
  \n然而，事实并非如此。正如所提到的，全球许多国家已经制定了针对和反对比特币以及加密货币的特定规则。美国各州的情况也是如此。由于联邦政府迄为止一直试图远离加密货币的争斗，决定不对其进行监管并让人们自行运营，一些州已经站出来支持或抵制比特币的兴起。\n\
  \n某些州对比特币来说比其他州更好。由于许多州长签署了州级法律，比特币的用途和交易更加高效，在某些州可以购买，而在另一些州获取和支持则变得更加复杂。\n\n例如，纽约州一直是比特币的宿敌。考虑到有多少与华尔街有关的权势人士住在纽约州，这并不意外。理所当然，这些有影响力的人士会利用他们与州长的关系来限制比特币的力量。这正是发生过的情况，因为纽约州从未支持过比特币。所有在线交易所必须向纽约州官员披露其全球客户群。对某些人来说，这听起来像是对隐私的大规模入侵。这只是纽约州阻碍比特币力量的方式之一。\n\
  \n纽约州州长安德鲁·库奥莫（Andrew Cuomo）建立了一个比特币工作小组，以研究比特币的使用和复杂性，因此，如果工作小组发现比特币没有什么可畏的，未来可能会发生变化。加密货币的支持者正希望情况如此。\n\
  \n另一个对加密货币和比特币发起猛攻的州是罗德岛州。他们的参议员谢登·怀特豪斯（Sheldon Whitehouse）长期以来一直抨比特币，并表示这是外国势力干预美国事务的一种。他是州级立法的重要支持者，该立法对在线交易所和所有加密货币交易征收重税。这表明不仅是谢登·怀特豪斯认为比特币和加密货币可以是外国政府和对手的工具。\n\
  \n其他州，如亚利桑那州，制定了反对欢迎比特币的特定法律和税。这损害了当地支持者的基础，并引起了加密货币爱好者的强烈反弹。这与比特币背后的思想和目的背道而驰，比特币一直一直是关于一种通用货币，政府不会因为不需要它们而对其进行阻碍。比特币可以在没有任何联邦权力机构的监管、监督或帮助的情况下独立繁荣。\n\
  \n但如果没有它们，它就无法存在。事实是，比特币将永远与政府面对面。这是不可避免的。某些国家和州推行的这些严格法律表明，比特币可能存在于系统之外，但很大程度上仍然留在系统之内。\n\
  \n幸运的是，并非所有州都是这样。科拉拉多州可能是对比特币最友好的州之一。该州在`2014`年通过了一项法律，将加密货币免于证券。这对于加密社区来说是一个巨大的胜利，因为它表明该州具有前瞻性。科拉拉多州还在`2016`年通过了一项法律，允许数字货币作为支付手段。这表明该州对金融的未来持开放态度。\n\
  \n俄明州可能是联邦中最对加密货币友的州。它通过了多项法律来承认和支持加密货币。该州甚至制定了一项法案，赋予数字货币与其他货币相同的法律地位。由于对加密货币（包括比特币）的长期支持，俄明州已成为许多加密公司的所在地，并赢得了它们应有的赞誉。\n\
  \n\n\n\n\n# 所以，比特币的未来如何？\n\n许多人认为它正处于重大突破的边缘，这将将其带向前所未有的高度。这种突破会是什么样子？有人推测，某个大型零售商很快就会开始接受比特币。如果像\
  \ `Target`、`Walmart` 或 `Amazon` 这样的企业开始接受比特币作为货币，这将改变游戏规则。如果真的发生，你可以看到 `Bitcoin`\
  \ 的价值在短时间内飞猛增长。\n\n如果一家大型零售商欢迎比特币，这将向全球其他企业传递一个强烈的信号：加密货币将长期存在，并且可以被信任和安全接受。它还将向全球普通投资者传递一个巨大的信息：重要的商业巨头现在开始接受加密货币的想法。这将推动人们涌向在线交易所，最终想要把钱花在加密货币上，这只会让该行业更加繁荣。\n\
  \n如果一家零售商很快开始接受比特币，立即产生的连锁反应将被人感知。它将提高所有加密货币的价值，而不只是 `Bitcoin`。人们将寻求通过加密货币赚钱，而不会只关注\
  \ `Bitcoin`。然而，`Bitcoin` 本身将变得更加重要、更受追捧。头条新闻和报道将传遍地球上的每一份报纸和网络。这将是今年最大的商业故事之一。\n\
  \n这种可能的发展是许多人一直期待的。`Bitcoin` 的粉丝一直在期待一家更有影响力的零售企业迈出第一步，在门店开始接受 `Bitcoin` 作为支付。多年来，`Amazon`\
  \ 一直是圣杯，因为 `Bitcoin` 用户知道在 `Amazon` 消费 `Bitcoin` 会有多方便。然而，这个在线市场尚未接受这一理念，`Amazon`\
  \ 也拒绝在对 `Bitcoin` 的抵抗上做出改变。\n\n比特币的支持者一直关注其他零售商，希望他们迈出第一步，因为 `Amazon` 多年来一直犹豫不决。他们的目标对准了\
  \ `Best Buy` 以及其他为许多客户提供最新技术、设备和设备的企业。一些活动已经说服这些企业接受 `Bitcoin` 和加密货币，但尚未取得更多进展。这种发生的可能性仍然是加密货币未来最大的问题。这是它走向主流最重要的一步，而许多加密货币粉丝认为这是必要的。\n\
  \n如果大型零售商在短期内仍无法 `Bitcoin` 触及，这并不是加密货币的终点。无论如何，加密货币的未来仍然是光明的。为什么？因为比向加密货币的人比以往任何时候都多。年复一年，这种货币吸引着新的投资者进入市场，每当有人买入，价值就会增加。这就是为什么你看到各种加密货币（尤其是\
  \ `Bitcoin`）的价格在过去几年里飞猛增长。\n\n然而，如果 `Bitcoin` 和其他加密货币未能让一些大公司关注并加入，你可以预计它们的需求将得到澄清，并受到普通投资者的疑虑。你还可能看到许多成功的商界人士和政客继续反对加密货币，并试图将其击垮。\n\
  \n在未来几年里，可能会爆发针对 `Bitcoin` 及其竞争对手的更激烈的战斗。我们已经看到这种斗争在印度、埃及和**美国**开始。加密货币迅速赚取了数十亿美元，而在大多数国家，金钱等同于权力。对于那些长期掌握旧权力的人来说，新能量可能是可怕的。它被视为一种可能推翻控制者地位的新威胁，在它变得太强大之前需要对其进行限制。许多\
  \ `财富 500 强`企业的首席执行官正希望在未来几年内约束加密货币，而他们有强大的朋友可以实现这一点。\n\n至于 `blockchain`，它的未来潜力是无限的。随着越来越多的主要公司和行业发现\
  \ `blockchain` 的力量，它的受欢迎程度只会增加，并继续在全球范围内发挥影响力。`Blockchain` 的出现初仅仅是为了方便 `Bitcoin`\
  \ 和加密货币的使用。但它已成为医疗保健行业、货运运输、汽车公司甚至薪资技术的一部分。\n\n`Blockchain` 从未有过如此充满前景的未来。它已不仅仅是\
  \ `Bitcoin` 和加密货币的伴随技术。它拥有了自己的生命，并且仍然有机会改变世界上几乎每一项业务——如果他们愿意接受的话。\n\n# 第 10 章：区块链将如何影响你、你朋友以及家人的生活！\n\
  \n## 区块链的现实世界应用是什么\n\n`Blockchain` 已经在全球范围内，并以最好的方式显著影响着它所触及的一切。哪些行业从 `blockchain`\
  \ 及其提供的所有服务中受益最多？\n\n### 医疗保健\n\n以制药行业为例。确保药物从制造到消费过程中完整性的新规则可以拯救上百万人的生命。生命科学和医疗保健公司为药物单位和设备部件创建唯一的序列号，这些序列号在源头被扫描、捕和验证。\n\
  \n如果应用得当，`blockchain` 可以将追溯序列化提升到新水平，降低成本、提高安全性和信任、消除易错的数据移动，并实现供应链的实时透明。当每个物品通过供应链移动时，会使用\
  \ `blockchain` 添加额外的经过验证的信息。这些数据块无法被篡改，并由所有利益相关者共同验证。结果是一个端到端的系统，比我们以前看到的任何系统都更简单、更安全。它更私密、透明、高效，风险更小，并符合甚至超过全球序列化要求。\n\
  \n时尚世界也在拥抱区块链。`CGS` 是一个提供业务应用、企业学习系统和外包服务的组织，他们来自时尚、服装和消费品客户的反馈，称他们正在寻找通过 `blockchain`\
  \ 简化供应链的新方法。\n\n### 食品安全\n\n从供应链的角度来看，`blockchain` 可以建立交易伙伴和消费者之间的信任。通过 `blockchain`\
  \ 技术，消费者可以查看服装从农场到货架的整个生命周期。消费者正从盲目信任变为对件衣服历程的完全理解。\n\n食品安全是一个极其重要的重大行业。如果没有它，整个社会都会遭受痛苦。而现在，`blockchain`\
  \ 正在到来，让整个系统运行得更好、更顺畅、更高效。\n\n`IBM` 正与食品供应商（包括 `Dole`、`Nestlé` 和 `Walmart`）合作，利用\
  \ `blockchain` 更好地监管食品安全。在全球食品供应链行业，所有种植者、供应商、加工商、分销商、零售商、监管机构和消费者都可以获得权限访问交易中食品来源和状态的信息。生态系统中的所有成员都可以使用\
  \ `blockchain` 网络在时间内将污染食品追溯到源头，以确保它们迅速从商店架上撤下。\n\n世界自然基金也正在使用 `blockchain` 来更好地追踪海鲜，如果你能相信的话。\n\
  \n\n\n\n消费者正呼吁提供可追溯的海鲜，这些产品不能源自非法捕捞或滥用人权的场所。海鲜批发和零售采购商要求提高透明度和可追溯性，以降低其品牌与可疑及非法活动产生联系的风险。区块链与来自其他电子技术平台的实时信息相结合，可以提供零售商和消费者所渴望的前所未有的供应链透明度和可追溯性。\n\
  \n# 石油与天然气\n\n石油天然气公司也采用了区块链，并且已经因此赚了数百万美元。能源领域的区块链允许用户监控交易、控制输出并验证证书的来源。\n\n有一个基于区块链的交易项目，参与者包括\
  \ `BP`、`Shell`、`Statoil`、`Gunvor`、`Koch Supply & Trading` 和 `Mercuria` 等商业企业，以及银行界的\
  \ `ABN Amro`、`ING` 和 `Societe Generale`。他们开发了一个管理能源市场交易的数字平台。该项目的目的是减少对传统纸质合同和大量纸质文件的依赖，转而使用数字注册表。\n\
  \n区块链将允许能源行业降低运营成本，加速所有能源供应链的国内交易业务，并提高其运营的可靠性。大多数项目目前处于开发阶段，但行业代表早已理解了其相关性和重要性。无疑，随着时间的推移，经济各部门区块链解决方案的数量将显著增加，其应用的益处将变得显而易见。\n\
  \n# 汽车\n\n汽车行业的区块链被视为智能汽车存储和传输数据的工具。此外，该技术可用于在各种注册表中存储有关特定车辆的数据。区块链将使车辆数据无法伪造。例如，在车辆上市后，所有关于该车辆的数据（包括维修和保养信息）都将使用区块链存储。因此，车主将能够随时检查车辆经历的维修次数、事故数据和其他信息。\n\
  \n汽车行业参与者多年来一直在探索区块链的可能性。两年前，`Toyota` 宣布了一项新计划，将区块链引入其创新汽车技术中，其中分布式注册表被用智能车辆交换数据的基础。`General\
  \ Motors` 正在实施一个类似的项目，并已于 2019 年对其技术申请了专利。`Volkswagen` 正在开发区块链技术，允许智能汽车交换有关路况的信息。根据开发人员介绍，该项目可以减少因路面质量差、恶劣天气条件或其他事故导致的事故。\n\
  \n# 选举欺诈\n\n区块链不仅适用于金融交易，也适用于任何数据传输。这种系统基础设施受益于投票，因为投票是一小部分高价值数据。由于迫性需要，现代投票系统主要仍停留在上个世纪，那些想要投票的人必须离开家门向当地机构提交纸质选票。为什么不将这一过程搬到网上呢？有些人已经尝试过，但由于存在重大的安全漏洞，要对结果产生信任被证明是困难的。\n\
  \n区块链可以解决这些早期在线投票尝试发现的许多问题。基于区块链的投票应用程序无需担心其 `Internet` 连接的安全性，因为任何访问终端的黑客都无法影响其他节点。选民可以有效地提交选票，而无需向公众透露自己的身份或政治偏好。官员可以在绝对确定的情况下进行计票，因为他们知道每个\
  \ `ID` 都可以归于一张选票，无法创建伪票，且无法篡改。\n\n选民的冷漠导致近年来参与投票人数不断减少，尽管投票已变得更加至关重要。光是在美国，投票人数也远低于有投票资格的人数。投票箱前的冷漠在许多方面损害了国家。通过民众的参与，政府可以走正确的道路。人们需要投入其中，人们需要关心。区块链可以帮助人们比现在更多地相信投票。\n\
  \n如果能通过手机或 `PC` 提供一种不可否认且便捷的投票方式，这些惨淡悲伤的数字将会增加。区块链为人们提供了一种通过手机或 `PC` 投票的不可否认且易于操作的方式。\n\
  \n# 结论\n\n## 加密货币的未来能提供什么？\n\n许多人都在好奇加密货币的未来如何。在短短十年内，它在普及功能上经历了爆炸式增长，并为许多人带来了巨大的财富。尽管如此，加密仍处于发育阶段，有很大的增长空间。尽管它频繁出现在头条新闻中，许多人对它仍然一无知。加密货币的未来是什么？它会对抗美元吗？`Bitcoin`\
  \ 会突破 70000 大关吗？加密货币会进入零售业吗？如果会，会发生什么？\n\n\n\n但亚马逊可能避开加密货币还有其他原因。有人推测，亚马逊并不喜欢加密货币，是因为它的波动性太大了。这确实是一个值得警惕的合理理由。加密货币的价值波动剧烈，远超美元。当比特币的价值变幻莫测时，亚马逊和它的第三方在线零售商该如何使用比特币为产品定价呢？如果比特币市场能稳定一年左右，你可能会看到亚马逊开始使用它。\n\
  \n亚马逊与 Visa 和万事达（Mastercard）等大型信用卡公司有许多幕后交易。这两个大品牌都不喜欢比特币，以及它对货币业务所带来的颠覆。为了让信用卡公司满意，在所有方达成共识之前，亚马逊可能不会接受比特币。然而，美国运通（American\
  \ Express）等公司要接受比特币还需要很长时间，因为它们被视为即将改变现状的直接竞争对手。\n\n也许亚马逊不使用比特币的另一个原因是，它正在考虑创建仅属于该网站的加密货币。这完全不是什么意之外的举动，做法也称不上原创。其他许多比亚马逊小得多的电子商务网站都创建了自己的形式的加密货币。这些货币正越来越受欢迎，且只能在它们设计的区域使用。如果亚马逊推出自己的系列加密货币，将是一个巨大的成功，甚至可以与比特币匹敌。这就是他们缓慢接受比特币的一个重要原因，因为他们某天可能会与之进行直接竞争。\n\
  \n亚马逊似乎永远不会在其网站上接受比特币作为支付方式。这很遗憾，对加密货币社区来说是一个巨大的打击。如果一家规模巨大且无处不在的企业决定拥抱加密货币，它将被视为一个重大的成功案例，并让比特币的人气似乎在夜之间飙升。亚马逊掌握着让加密货币和比特币成功的关键，但他们并没有采取任何行动促进其在普通购物者中的增长。\n\
  \n# 区块链将如何彻底每个人的生活\n\n有太多的人认为区块链是获取比特币或加密货币的方式。而更多的人根本没有考虑过区块链。\n\n这很遗憾，因为在未来的几年里，区块链极有可能真正彻底改变世界和你认识的每个人的生活。它可能已经改变了你的生活，只是你可能不知道。\n\
  \n区块链的作用是去中心化系统吗？它不是将某些数据集中在一个地方，而是将其分散到整个庞大的网络中。这个网络始终处于自我检查、更新和自我维护状态。它始终准确，且几乎无法渗透或被黑客攻击。\n\
  \n将区块链想象成一个有呼吸的生命生物是最好的，它是一个独立存在、自给自足，并且比任何替代方案都更强大更安全的创造。\n\n从这个角度看，你可以看到为什么区块链能席卷全球。从汽车制造到产品运输和生产，从医疗保健公司甚至地方选举的投票，区块链都能让一切运行得更好、更快、更安全，且更独立、高效。\n\
  \n区块链将压力从工人身上释放出来，转而放到可以承受巨大压力的系统和基础设施上。区块链也有其缺点，就像任何方法都有缺点一样，但它是安全的，而且几乎总是可靠的。\n\
  \n更多的公司和企业需要看到区块链的价值和潜力。它已经进入了世界上许多主要参与者的领域，但还有非常大的增长空间。如果它能占据更多市场，你可以看到生活中的许多方面表现得更好。区块链有许多实用方法可以适应日常世界，但仍有很多方法尚未被发现。\n\
  \n区块链将一直存在。它允许了加密货币的增长和繁荣，并最终将改变许多其他事情。区块链确实拥有改变你的生活和周围世界的力量。它已经做到了。而这才刚刚开始。\n\n\
