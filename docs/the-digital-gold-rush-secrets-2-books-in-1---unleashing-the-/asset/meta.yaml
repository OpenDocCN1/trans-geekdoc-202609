- - '##'
  - 区块链原理
- - '###'
  - 分布式：区块链基本的原理是数据库并不存储在单一位置，而是分散在各个节点上。这意味着速度稍慢。
- - '###'
  - 点对点交易：区块链中的交易直接发生在节点之间，而不是通过协调者。这确保了网络之间存在某种程度的信任。
- - '###'
  - 透明性：存储在公共区块链上的交易是透明的。任何人都可以访问，使人们很难创建虚假记录来欺骗。
- - '###'
  - 不可逆性：交易一旦存储在区块链上，就会被更改。这需要巨大的计算能力，几乎是不可能的。
- - '###'
  - 计算逻辑：数据存储在区块上，因此用户不需要手动添加。他们自己创建算法来交易。
- - '#'
  - 区块链中的密码学
- - '#'
  - 交易是如何运行的
- - '#'
  - 区块链的基本属性
- - '###'
  - 分布式：区块链最特征之一是账本分布。这意味着它在多个节点上运行，而不是单一中心。这确保了数据在所有节点上都是存储的。
- - '###'
  - 不可篡性：区块链中的数据是不可改的，也就是说它是永久的，一旦存储无法更改。
- - '###'
  - 时间戳：区块链技术的定义特征之一是存储在区块链上的交易都标记了时间和日期。这确保了拥有正确的 `nonce` 和 `hash`。
