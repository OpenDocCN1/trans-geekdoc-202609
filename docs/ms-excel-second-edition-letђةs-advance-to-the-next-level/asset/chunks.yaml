    ## B) 在水平查找中，操作从工作表范围的第一行开始。


    当每列包含单独的记录时，请使用 `HLOOKUP`。


    这些函数可以帮助我们在大较大的矩阵中查找特定的数据单元格。


    语法为 `VLOOKUP (Search Value, Range, Column Number, Error)` ==> 在由 `Search Value`
    指定的行和 `Column Number` 指定的列中查找值。


    - `Search Value`（查找值）表示“匹配键”（即在第一列中找到包含 `Search Value` 的行）。

    - `Range`（范围）指定包含数据的单元格。

    - `Column Number`（列数）指定包含你要的数据元素的列。

    - `Error`（错误）决定当 Excel 无法找到你所需的确切 `Search Value` 时发生什么。

    - `FALSE` 导致 Excel 在找不到精确匹配项时显示 `#N/A`。

    - `TRUE` 导致 Excel 显示比 `Search Value` 小的下一个值。


    ![](img/f026-1.jpg)


    现在假设你想从上面的字段中提取政党（Political Party）。


    ![](img/f026-2.jpg)


    **将光标放在单元格 D2。点击“公式”选项卡并选择“插入函数”。**


    ![](img/f027-1.jpg)


    **在“查找函数:”文本框中，输入“vlookup”并点击“转”按钮。**


    ![](img/f027-2.jpg)


    ![](img/f028-1.jpg)


    - 在 `Lookup_value`（查找值）文本框中输入“C2”。

    - 在 `Table_array`（数组）文本框中，选择 Excel 用于查找描述的区域。点击 `Party Codes` 工作表并突出范围 `A2:B45`。

    - 在 `Col_index_num`（列索引数）字段中输入“2”。这是我们在 `Party Codes` 工作表中包含政党描述的索引列。

    - 在 `Range_lookup`（范围查找）中输入“false”，因为我们需要精确匹配。


    ![](img/f028-2.jpg)


    记得通过在单元格引用周围放置 `$` 符号编辑 `Table array` 值。这使单元格引用变为绝对引用。


    同样，我们将使用 `HLOOKUP (Search Value, Range, Row Number, Error)` ==> 在由 `Search Value`
    指定列和由 `Row Number` 指定行中查找值。


    ### INDEX 函数


    ![](img/f029-1.jpg)


    ```

    = INDEX (B3:F8, 4, 1)

    ```


    选择单元格矩阵：表格（`B3:F8`）并指定行数和列数（即分别为 `4` 和 `1`）。这将获取 4 月份 `Dept_01` 的值。


    ![](img/f029-2.jpg)


    同样，你可以在行数中应用“3”来获取 3 月的值。


    ### MATCH 函数


    此函数识别特定参数在指定列表中的位置。


    `MATCH` 函数在单元格范围内搜索指定项目，然后返回该项目在范围内的相对位置。例如，如果范围 `A1:A3` 包含值 5、25 和 38，则公式 `=MATCH
    (25, A1:A3, 0)` 返回数字 2，因为 25 是第二个项目。


    当你需要范围中项目的位置而不是项目本身时，请使用 `MATCH` 代替 `LOOKUP` 函数之一。注意我们在语法中使用了参数“0”，因为我们需要精确匹配。


    ![](img/f030-1.jpg)


    如果范围 `A1:A4` 包含 Nuts（螺母）、Bolts（螺栓）、Washers（垫圈）和 Nails（钉子），则公式 `=MATCH (“Bolts”,
    A1:A3, 0)` 返回数字 2，因为 `Bolts` 是范围内的第二个项目。`Washers` 将返回 3；`Nails` 将返回 4。


    现在改用“1”试试——假设你想获取与给定值最接近的值。那么我们在语法中使用参数“1”。所以，如果我们使用 `MATCH (5000, D2:D16, 1)`，我们得到最接近
    5,000 的值。返回信息是 7。记住，值必须按升序排列。


    ![](img/f030-2.jpg)


    | Match_type | 行为 | 影响 |

    | :--- | :--- | :--- |

    | 1 或省略 | 查找小于或等于查找值的最大值。 | 矩阵中的值必须是升序的。 |

    | 0 | 查找第一个完全等于查找值的值。 | |

    | -1 | 查找大于或等于查找值的最小值。 | 矩阵中的值必须是降序的。 |


    ### 结合 MATCH 的 INDEX


    `INDEX` 函数与 `MATCH` 函数结合时，在查找**不在**表格左侧列的值时非常有用，此时无法使用 `VLOOKUP`。在下表中，你想查找代码编号为
    `AA105` 的人的名字。


    ![](img/f031.jpg)


    公式 `=INDEX (A1:D5, MATCH (“AA105”, D1:D5, FALSE), 1)` 将返回 Brown 的正确值。`INDEX` 函数内部的
    `MATCH` 函数识别出表格中哪行包含 `AA105`（第 3 行）。然后 `INDEX` 函数能够将其交叉引用到表格的第 1 列。因此公式返回的是第 3
    行和第 1 列的内容。


    ### 结合 INDEX 的 VLOOKUP


    `INDEX` 函数也可以用于 `VLOOKUP` 公式，以识别你想要返回返回值的列。在下面的示例中，使用 `MATCH` 函数来返回员工 Smith 的
    `Salary`（工资）列（第 3 列）的内容。


    ```

    =VLOOKUP (“Smith”, A1:D5, MATCH (“Salary”, A1:D1, FALSE), FALSE)

    ```


    ![](img/f032.jpg)


    该公式将返回 £4,500。`MATCH` 函数返回 3（单词 `Salary` 在范围 `A1:D1` 中的位置）。然后 `VLOOKUP` 返回第 3
    列的值。


    ### 数据透视表 (Pivot Table)


    当查找不在表格左侧列的值时，`INDEX` 函数结合 `MATCH` 函数非常有用。数据透视表是一种强大的数据分析工具，它可以帮助我们在极短时间内从大型数据库中生成汇总信息。它可以帮助创建动态变化的表格。假设从总销售数据库中，我们正在查找客户分类的分类。数据透视表的主要功能如下：


    A) 快速易用。

    B) 可以通过拖拽字段、排序和过滤来处理数据。

    C) 通过适当的表示创建洞察。

    D) 还可以创建具有交互性的视觉报告。


    #### 如何创建数据透视表


    ![](img/f033-1.jpg)


    创建空白的数据透视表：


    - 在“插入”选项卡的“表”组中，点击“数据透视表”。

    - 选择要分析的数据（打开工作簿中的表格或范围或外部连接）。

    - 选择放置数据透视表的位置：新工作表或现有工作表，然后确定。


    Excel 在新工作表中创建数据透视表。在新工作表中，将显示数据透视表和“数据透视表字段”任务面板。该面板显示数据集中的字段以及创建布局的区域。这些区域用于按列、行、值来组织数据。


    如右下角所示，有四个区域：


    ![](img/f034-1.jpg)


    A) 筛选——在数据透视表上方显示顶级过滤器，以便根据你设置的特定条件显示结果。

    B) 列——显示所选字段的汇总列。

    C) 行——根据所选字段在第一列中分类数据。

    D) 值——显示所选字段的统计数据（如总计或平均值）。


    ![](img/f034-2.jpg)


    然后可以将字段从“选择字段”拖动到“数据透视表字段”列表底部的“报告筛选”、“列标签”、“行标签”和“值”框中。


    #### 示例说明


    你还可以使用数据透视表对数字进行分组——按年龄范围、价格范围或任何符合你数据的数值范围进行汇总。为了说明，假设我们有一份包含选民年龄的投票结果列表，你想按年龄组汇总结果。你的数据可能如下：


    ![](img/f035-1.jpg)


