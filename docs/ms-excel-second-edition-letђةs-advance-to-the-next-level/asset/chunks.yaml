    # 基础透视表


    要开始按年龄对数据进行分组，请先正常程序创建透视表。接下来，将 `Age`（年龄）字段作为`行标签`，将 `Vote`（投票）字段作为`列标签`。最后，将
    `Name`（名称）作为`值`。在示例中，我们还将“Grand Total”（总计）重命名为“Total”。此时，我们的透视表看起来如下：


    ![](img/f036-1.jpg)


    ## 按年龄分组


    虽然这个透视表很有趣，但它并不 Practical 用，因为按实际年龄自动分组太细了。我们并不关心有五个 20 岁的人投了 B ——我们希望按年龄范围查看投票结果，例如
    20 到 29 岁、30 到 39 岁等。这可以使用透视表内置的分组功能轻松实现。要按年龄对结果分组，右键点击 `Age` 字段中的任何值，并在菜单中选择
    `Group`（分组）。


    ![](img/f037-1.jpg)


    ### 指定间隔


    当 `Grouping` 对话框出现时，在“By:”输入区域中输入任何有意义的间隔。在本示例中，我们将按 10 年一个间隔进行分组。


    ![](img/f038-1.jpg)


    当你点击 `OK` 时，你将看到数据按 10 年一个间隔整齐地按年龄分组。


    ![](img/f038-2.jpg)


    你可以使用相同的方法以许多有用方式对数值数据进行分组。你可以根据总销售额对客户分组，根据入时长对员工分组，根据温度对天气数据分组——这个列表是无尽的。


    ## 修改透视表


    ![](img/f039-1.jpg)


    要将字段作为行添加，你可以执行以下步骤之一：


    * 在 `Choose fields to add to report`（选择要添加到报告的字段）部分点击字段的复选框进行选择。

    * 从 `Choose fields to add to report` 部分拖动字段，并将其释放到 `ROWS`（行）区域。

    * 在 `Choose fields to add to report` 部分右键点击字段名，并选择 `Add to Row Labels`（添加到行标签）。


    `ROWS`区域内字段的顺序决定了层级结构。在本示例中，我们希望在教科书列表中每个 `Discipline`（学科）下显示 `Areas`（区域）。要显示此层级，请在
    `ROWS` 区域先列出 `Discipline` 字段，后列出 `Area` 字段。


    ![](img/f039-2.jpg)


    正如我们在 `Rows` 中看到的，要向透表中添加值，你可以执行以下步骤之一：


    A) 在 `Choose fields to add to report` 部分点击字段的复选框进行选择。

    B) 从 `Choose fields to add to report` 部分拖动字段，并将其释放到 `VALUES`（值）区域。

    C) 在 `Choose fields to add to report` 部分右键点击字段名，并选择 `Add to Values`（添加到值）。


    在本示例中，我们正在按标题（`Aging/Death`）统计书籍数量，查找销售数量（`Introductory` 中的 `179,415`）以及销售额（`Research/Stats`
    中的 `273,970`）。


    ![](img/f040-1.jpg)


    要将数据细分为列，从 `Choose fields to add to report` 部分拖动字段并将其释放到 `COLUMNS`（列）区域。此幻灯片显示了一个透视表，它使用
    `Discipline` 字段作为行、`Units Sold` 字段的 `Sum` 作为值，以及 `Copyright` 字段作为列。每个学科标签和版权年份只出现一次。


    ![](img/f041-1.jpg)


    当你继续添加和排列字段时，透视表可能包含过多数据而无法使用，因此需要移除字段。你可以移除字段来减少数据量。要从透视表中移除字段，你可以执行以下步骤之一：


    * 在 `Drag fields between areas below`（在下方区域之间拖动字段）部分点击字段名并选择 `Remove Field`（删除字段）。

    * 点击 `Choose fields to add to report` 部分字段名旁边的复选框。

    * 在 `Drag fields between areas below` 部分将字段名拖到 `PivotTable List`（透视表列表）之外。


    要将字段从一个透视表区域移动到另一个，你可以执行以下步骤之一：


    * 在 `Drag fields between areas below` 部分拖动字段。

    * 点击区域内的字段箭头并选择 `Move to Filter`（移动到筛选）、`Move to Row Labels`（移动到行标签）或 `Move to
    Values`（移动到值）。


    在本示例中，要移除 `Units Sold`，请取消选中它的复选框。要将 `Area` 从 `ROWS` 移动到 `COLUMNS`，请将其从一个区域拖动到另一个。


    ![](img/f042-1.jpg)


    除了数值字段的 `SUM` 和文本字段的 `COUNT`，我们可能还想使用 `AVERAGE` 等其他函数。你还可以更改摘要上方显示的列标签，或者可能需要对聚合值进行格式设置。要修改这些设置中的任何内容，你可以：


    * 点击透表中相应字段中的值，点击 `Analyze` 选项卡上 `Active Field`（活动字段）组中的 `Field Settings`（字段设置），显示
    `ValueField Settings`（值字段设置）对话框。

    * 在 `Custom Name` 框中输入想要作为列标签显示的名称。

    * 选择你想要使用的摘要函数进行汇总。

    * 格式。


    如果你对数据源进行任何更改，透视表不会自动更新。要更新透视表，你需要


    * 点击透视表。

    * 点击 `Analyze` 选项卡。

    * 点击 `Data` 组中的 `Refresh`（刷新）。


    ![](img/f043-1.jpg)


    ## 筛选和切片透视表


    透视表显示每个类别的聚合数据。然而，你可能希望通过 `FILTERS`（筛选）区域筛选特定字段来显示子集。要设置透视表筛选，你可以：


    * 将字段![](img/bl.jpg) 拖动到 `FILTERS` 区域。

    * 点击透视表中的筛选箭头，并执行以下步骤：


    ![](img/bl.jpg) 如果你想选择多个值，请勾选 `Select Multiple Items`。


    ![](img/bl.jpg) 按值筛选透视表。


    ![](img/bl.jpg) 如果列表很长且你想快速找到某个值，在 `Search` 框中输入值。


    ![](img/bl.jpg) 点击 `OK`。


    在本示例中，我们显示筛选了 1、2、5、7、9 版的版本。


    ![](img/f043-2.jpg)


    切片是一个包含字段每个唯一项目按钮的小窗口，可以快速筛选透视表。要插入切片，你需要


    * 点击 `Analyze` 选项卡中的 `Filter` 组中的 `Insert Slicer`。

    * 选中一个或多个字段复选框以显示一个或多个切片并点击 `OK`。


    ![](img/f044-1.jpg)


    当你选择切片时，会显示 `Slicer Tools`（切片工具）选项卡以便你自定义切片。以下列表描述了 `Slicer Tools` 选项卡上的命令：


    * `Slicer`——允许更改切片标题。

    * `Slicer Styles`——通过指定筛选项的颜色为切片应用样式。

    * `Arrange`——指定切片相对于其他组的位置。

    * `Buttons`——定义所选切片中显示多少列以及切片内部每个按钮的高度和宽度。

    * `Size`——设置切片窗口的高度和宽度。


    在两个切片的示例中：


    * `Edition` 切片中的活动筛选项显示蓝色，不可用项目显示浅蓝色。

    * `Edition` 切片中有两列，`Discipline` 切片有一列。

    * `Discipline` 切片的高度为 3.13”。


    ![](img/f045-1.jpg)


    透视表时间轴根据所选日期范围筛选数据。透视表时间轴是一个从数据源的第一个日期到最后一个日期结束的小窗口，它包含可以点击的水平磁贴，按按、月、季度或年进行筛选。


    要在透表中插入时间轴并在时间轴上筛选数据：


