    The Goal Seek Command


    What-If Analysis provides an ability to pursue the cycle of trial-and-error use
    of base numbers in formulas.


    ![](OEBPS/images/f049-1.jpg)


    Using the Goal Seek Tool automates the process of changing one variable while
    calculating the function to get the value that you want.


    A) Set cell: The cell that will display what you are trying to get. It must contain
    a formula.


    B) To value: The value that you want. It must be numeric.


    C) By changing cell: The cell that Excel changes.


    Goal Seek is a tool, not a function.


    The cell displaying the outcome must contain a formula that is somehow dependent
    on the variable cell.


    You can reverse any changes using Undo.


    ![](OEBPS/images/f050-1.jpg)


    Sensitivity Analysis with Data Tables


    Excel is very powerful at making calculations.


    Let’s say you the formula for Loan Payments set out as **PMT (rate,** nPeriods**,**
    pValue**)**


    What if we want to see how our calculations change as we change the parameters?


    We have multiple options:


      I. We can manually adjust the values and try to remember earlier results.


     II. We can copy the formula across many cells and use different inputs for each
    copy.


    III. We can use the best approach: the Excel Data Table.


    There are two different types of Data Tables:


    A) **One-way** Data Tables: Allow you to change one parameter.


    B) **Two-way** Data Tables: Allow you to change two parameters.


    Create a One-Variable Data Table


    A one-variable data table is a structured range that contains different values
    for one variable to compare how the different values affect one or more calculated
    results. For example, a one-variable data table is used to compare monthly payments
    on a mortgage. After determining the variables to manipulate, you need to specify
    the substitution values. A substitution value is a value that replaces the original
    input value of a variable in a data table. You can enter the substitution values
    yourself or use the Series dialog box to help complete a series of values.


    To use the Series dialog box, you:


    • Type the first substitution value and keep that cell as the active cell.


    • On the Home tab in the Editing group, click Fill and then select Series to open
    the Series dialog box.


    • Click Rows or click Columns to select the direction of the series of substitution
    values.


    • Enter the value increment in the *Step value* box, enter the ending value for
    the series in the *Stop value* box, and click OK.


    ![](OEBPS/images/f051-1.jpg)


    In this example, the first substitution value is 5 percent in cell D4; Columns
    is clicked, so the series of substitution values is down a column, the increment
    value is 0.5 percent, and the stop value is 9 percent.


    After the substitution values have been added to a column or row, formulas must
    be added that relate mathematically to the variable that is used for the substitution
    values.


    To complete the one-variable data table, you:


    A) Select the data table boundaries, starting in the blank cell in the top-left
    corner of the data table. Drag down and to the right, and if there is more than
    one column, select the last blank cell at the intersection of the last substitution
    value and the last formula reference.


    B) On the Data tab in the Forecast group, click What-If Analysis and select Data
    Table to open the Data Table dialog box.


    C) Enter the cell reference of the cell containing the original variable for which
    you are substituting values. If the substitution values are listed in a row, enter
    the original variable cell reference in the Row input cell box. Similarly for
    a column, enter the original variable cell reference in the Column input cell
    box.


    D) Click OK.


    ![](OEBPS/images/f052-1.jpg)


    **Example: Car Loan Payments**


    Let’s create a one-way Data Table: Car Loan Payments.


    We borrow $20,000 from a creditor to buy a car.


    Annual interest rate is 5 percent.


    We plan to pay the loan in 36 months.


    Our monthly payments can be calculated by the **PMT** function:


    Monthly Payment = PMT (5/12, 36, 20,000)


    How do our payments change as the **interest rate** changes?


    Two-Way Data Tables


    Excel Data Tables let us see the impact of change in parameters.


    Two-way Data Tables: Allow us to change two parameters.


    Create a Two-Variable Data Table


    There are times when you might want to compare the results of a calculation on
    the basis of two variables. A two-variable data table is a structured range that
    contains different values for two variables to compare how these differing values
    affect the results for one calculated value.


    For example, you might want to compare the combined effects of various interest
    rates and different down payments. Creating a two-variable data table is similar
    to the method used for a one-variable data table. For a two-variable data table,
    you use the top row for one variable’s substitution values and the first column
    for the other variable’s substitution values. The two-variable data table enables
    you to use two variables, but you are restricted to only one result instead of
    multiple results. Enter the formula or reference to the original formula in the
    blank cell in the top-left corner. For example, enter the cell reference for the
    monthly payment (=B12) in cell D3.


    ![](OEBPS/images/f053-1.jpg)'
