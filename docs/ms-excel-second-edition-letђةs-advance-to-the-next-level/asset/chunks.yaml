    ## [Preface](#05_contents.xhtml#r1)\n\nThe operational efficiency of any knowledge\
    \ professional can improve significantly with an upgradation of his or her skills\
    \ of *MS Excel*. With every additional function that you learn, life can become\
    \ a lot easier.\n\nWhile in the first edition we had focused on the very basics,\
    \ a common feedback was that readers wanted a more actionable book.\n\nHence,\
    \ the material in this version has been organized as follows:\n\nA) Financial\
    \ functions\n\nB) Conditional math and statistical functions\n\nC) Data analysis\n\
    \nD) Decision making\n\nE) Data cleaning and use of macros\n\nF) Auditors\n\n\
    I hope this will significantly enhance the utility of the book.\n\nDon’t just\
    \ read this book like a novel. Practice it and the learning curve will be the\
    \ steepest.\n\n“The proof of the pudding lies in the eating.” So let the pages\
    \ make their sales pitch themselves.\n\n## [Acknowledgments](#05_contents.xhtml#r2)\n\
    \nThe first edition of this book was received with great interest by readers.\
    \ It focused on providing users with a first-hand experience of the nuances of\
    \ MS Excel. A lot of them have generously taken time out to provide feedback.\n\
    \nI wish to express my special thanks to the reviewer, Sonia Singal, my better\
    \ half.\n\nI also greatly appreciate the strategic comments and advice of Ayush\
    \ Agarwal, who diligently and generously provided extensive comments as well as\
    \ encouragement.\n\nScott Isenberg, Managing Executive Editor, and Charlene Kronstedt,\
    \ Director of Production, Business Expert Press, have been a pillar of support.\n\
    \nRene Caroline provided excellent copyediting and book production.\n\n[CHAPTER\
    \ 1](#05_contents.xhtml#r3)\n\n[Excel for Personal Financial Decisions](#05_contents.xhtml#r3)\n\
    \nPV and FV\n\nExcel has several financial functions:\n\nA) The PV (Present Value)\
    \ function calculates the total present (current) value of an investment with\
    \ a fixed rate, specified number of payment periods, and a series of identical\
    \ payments that will be made in the future.\n\nB) The FV (Future Values) function\
    \ calculates the future value of an investment, given a fixed interest rate, term,\
    \ and identical periodic payments.\n\nC) The NPV (Net Present Value) function\
    \ calculates the net present value of an investment, given a fixed rate (rate\
    \ of return) and future payments that may be identical or different.\n\n![](OEBPS/images/f001-1.jpg)\n\
    \nInternal Rate of Return (IRR)\n\nThis returns the internal rate of return for\
    \ a series of cash flows represented by the numbers in values. These cash flows\
    \ do not have to be even, as they would be for an annuity. However, the cash flows\
    \ must occur at regular intervals, such as monthly or annually. The internal rate\
    \ of return is the interest rate received for an investment consisting of payments\
    \ (negative values) and income (positive values) that occur at regular periods.\n\
    \n![](OEBPS/images/f002-1.jpg)\n\nDetermine # Periods in Bond Problem\n\n![](OEBPS/images/f003-1.jpg)\n\
    \nYield to Maturity\n\n![](OEBPS/images/f004-1.jpg)\n\nNPER and RATE\n\nThe NPER\
    \ (Number of PERiods) function calculates the number of payment periods for an\
    \ investment or loan given a fixed interest rate, periodic payment, and present\
    \ value.\n\nThe RATE function calculates the periodic rate for an investment or\
    \ loan given the number of payment periods, a fixed periodic payment, and present\
    \ value.\n\n![](OEBPS/images/f005-1.jpg)\n\nThis slide shows specific examples\
    \ of how the number of periods (NPER) and rate (RATE functions) have been applied\
    \ in a worksheet.\n\nCreate a Loan Amortization Table\n\nSuppose you want to create\
    \ a payment schedule that shows the interest per payment period, principal repayment\
    \ for each payment, and the balance after each payment is made. This is called\
    \ a loan amortization table, and a partial table is shown in the slide. Because\
    \ this example is for a car loan over 4 years or 48 monthly payments, the complete\
    \ schedule cannot be viewed in its entirety.\n\nLet’s look at the financial functions\
    \ that are needed to generate this amortization table.\n\n![](OEBPS/images/f005-2.jpg)\n\
    \nIPMT\n\nThe IPMT function calculates the periodic interest for a specified payment\
    \ period on a loan or an investment given a fixed interest rate, specified term,\
    \ and identical periodic payments.\n\n\\=IPMT(rate,per,nper,pv,\\[fv\\],\\[type\\\
    ])\n\nThe PPMT function calculates the principal payment for a specified payment\
    \ period on a loan or an investment given a fixed interest rate, specified term,\
    \ and identical periodic payments.\n\n\\=IPMT(rate,per,nper,pv,\\[fv\\],\\[type\\\
    ])\n\nThe arguments for these two functions are:\n\nA) The rate argument is the\
    \ periodic interest rate. If the APR is 6 percent and the payments are made monthly,\
    \ then the rate is 6 percent/12 or 0.5 percent.\n\nB) The per argument is the\
    \ specific payment or investment period to use to calculate the interest where\
    \ the first payment period is 1."
