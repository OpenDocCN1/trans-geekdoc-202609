    ### 摘要

    `MS Excel` 是业务经理可以使用的最强大的工具之一。在书中，我尝试将技能组合提升到高级水平，并为用户提供可操作的见解。


    因此，此版本的内容组织如下：

    A) 金融函数

    B) 条件数学和统计函数

    C) 数据分析

    D) 决策制定

    E) 数据清洗和宏的使用

    F) 审计师


    目标是让你体验如何利用大量的函数让生活变得更容易、更高效。通过掌握 Excel 的基础知识，你可以取得一些惊人的成果。


    不要像读小说一样只读这本书。请在工作簿上同时执行给定的函数并体验这段旅程。只有那些实践的人才会发现学习曲线是最陡峭的。


