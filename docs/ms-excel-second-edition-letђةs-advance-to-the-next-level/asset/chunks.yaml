    #### 旭日图

    在这里我们可以看到多层分级中的最大贡献部分。视觉布局非常直观，可以显示任何数量的分级。


    ### 颜色


    填充颜色和字体颜色提供了预设颜色调色板。可以通过选择许多颜色或红绿蓝自定义组合获得更多颜色。


