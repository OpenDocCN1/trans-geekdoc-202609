    输入替换值并引用一个公式结果后，您就可以完成表格以查看结果了。


    完成双变量数据表：


    -   选择数据表边界，从数据表的左上角开始。

    -   向下并向右拖动，选择列和行最后一个替换值交汇处的最后一个空白单元格。

    -   在`Data`（数据）选项卡的`Forecast`（预测）组中，点击`What-If Analysis`（模拟分析），并选择`Data Table`（数据表）以显示数据表对话框。

    -   在`Row input cell`框中输入包含第一行替换值原始值的单元格。在`Column input cell`框中输入包含第一列替换值原始值的单元格。

    -   点击`OK`。


    ![](img/f054-1.jpg)


    ### 示例：汽车贷款还


    让我们创建一个单向数据表：汽车贷款还


    我们从债权人处借了 $20,000 用于买车。


    年利率为 5%。


    我们计划在 36 个月内还清贷款。


    我们的每月还款额可以通过 `PMT` 函数计算：


    `Monthly Payment = PMT (5/12, 36, 20,000)`


    随着`interest rate and/or payment period`发生变化，我们的还款额会如何变化？


    ### 使用场景管理器进行敏感性分析


    允许输入并比较多组模拟数据。


    每组为一个场景。`Scenario Manager`通过名称跟踪每个场景。


    每个场景都可以随时重新激活并更改。


    局限性是所有场景都使用相同的单元格。


    ![](img/f055-1.jpg)


    场景摘要报告对比各个场景。


    ![](img/f055-2.jpg)


    ### 使用 Excel 求解进行优化


    Excel 具有解决线性（通常是非线性）规划问题的能力。


    #### Excel 中的 Solver 工具


    A) 可用于求解线性是非线性优化问题。

    B) 允许对决策变量设置整数或二进制限制。

    C) 可用于解决具有最多 200 个决策变量的问题。


    #### 为什么你需要了解这些


    它允许您使用线性规划来寻找最佳输入，以实现某些所需的计算结果（例如，通过同时增加每日票量、扩大商店面积、提高单票销售额等来实现收入最大化）。


    在以下情况下使用 `Solver` 而不是 `Goal Seek`：


    -   您需要对输入变量设置约束（例如，商店每天营业时间不能超过 24 小时）。

    -   涉及多个输入变量。

    -   除了将计算设置为预设值外，您还希望最小化或最大化生成的计算结果。


    ### 加载 Solver 插件


    ![](img/f056-1.jpg)


    插件是可以添加到 Excel 中以提供增强功能的程序。`Solver` 是一个插件应用程序，它通过在您施加的限制内调整几个变量的值，寻找问题的最佳或最优解决方案。您可以使用
    `Solver` 创建优化模型。优化模型通过调整所选变量的值，为某个特定结果找到最高、最低或确切值。


    要加载 `Solver`：


    1. 点击`File`（文件）选项卡并选择`Options`（选项）。

    2. 点击`Add-ins`（加载项）查看活动和未活动的插件应用程序列表。

    3. 点击对话框底部的`Manage`（管理）箭头，选择`Excel Add-ins`（Excel 加载项），然后点击`Go`（转到）打开加载项对话框。

    4. 在可用加载项列表中勾选`Solver Add-in`并点击`OK`。


    ### 如何使用此功能


    在电子表格上求解线性规划（LP）的关键在于：


    -   `Objective cell`（目标单元格）——指定包含公式的单元格，该公式通过调整一个或多个变量的值来产生您想要优化的值（即最大化、最小化或设置为某个值）。

    -   识别可以更改的决策变量。这些被称为`Changing Cells`（可更改单元格）。

    -   识别包含目标函数的单元格作为`Target Cell`（目标单元格）。

    -   识别约束并告诉 `Solver`求解该问题。

    -   此时，我们问题的最优解将放置在电子表格上。


    #### 案例 1—使用 Solver 确定最佳产品组合


    ![](img/f058-1.jpg)


    指定目标、更改单元格和约束，您需要：


    -   点击`Data`选项卡上`Analyze`（分析）组中的`Solver`以打开 `Solver Parameters`（求解参数）对话框。

    -   点击`Subject to`（约束）右侧的`Add`（添加）。

    -   点击`OK`添加。。记住：

    -   目标单元格将是支付的总利息

    -   更改变量将是首付款和年数

    -   约束可以是首付款在 $5,000 到 $8,000 之间。


    ![](img/f059-1.jpg)


    要创建 Solver 报告，您需要：


    -   在`Solver Parameters`对话框中点击`Solve`。当 Solver 完成迭代过程时，会出现`Solver Results`对话框。如果找到了解决方案，`Reports`列表将显示报告类型。如果
    Solver 无法达到最优解，则没有可用报告。

    -   点击`Keep Solver Solution`（保留求解结果）以保留更改的值，或点击`Restore Original Values`（恢复原始值）返回原始值。

    -   从`Reports`列表中选择报告并点击`OK`。

    注意：如果您保留了更改后的值，Excel 将对电子表格进行这些更改。


    ![](img/f059-2.jpg)


    Solver 创建一个新的电子表格作为求解报告，包含四个主要部分：


    -   第一部分显示报告信息。

    第二部分显示目标单元格信息。具体而言，此部分显示原始和最终的目标单元格值。

    第三部分显示变量单元格。具体而言，它显示单元格引用、变量名称、原始值和最终值。

    第四部分列出约束。它显示每个定义约束的单元格引用、描述、新单元格值、公式、状态和松弛度。


    保存 Solver 模型时，您保存的是目标值、更改的变量和约束。


    要保存 Solver 设置，您需要：


    1. 在`Solver Parameters`对话框中点击`Load/Save`。

    2. 点击电子表格上放置第一个单元格。

    3. 点击`Save`返回`Solver Parameters`对话框。


    如果您想在使用新数据或更新的数据使用现有 Solver 模型，则必须返回之前的 Solver 模型。


    要使用已保存的 Solver 模型，您需要：


    1. 在`Solver Parameters`对话框中点击`Load/Save`。

    2. 选择包含 Solver 数据的电子表格单元格。

    3. 点击`Load`加载模型值，并返回求解参数对话框。


    ### 蒙特卡洛模拟简介


    我们希望能够准确估算不确定事件的概率。例如，新产品现金流具有正净现值（NPV）的概率是多少？我们投资组合的风险是多少？蒙特卡洛模拟允许我们对存在不确定性的情况进行建模并在计算机上运行数千次。


