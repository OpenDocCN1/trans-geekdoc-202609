    ### NPER 和 RATE

    `NPER`（期数）函数在给定固定利率、每期付款和现值的情况下，计算投资或贷款的期数。


    `RATE` 函数在给定期数、固定付款和现值的情况下，计算期利率。


    ![](img/f004.jpg)


    ### 创建摊销表

    假设你想创建一个还款计划，显示每期的利息、每笔付款的本金偿还额以及每笔款支付后的余额。这被称为贷款摊销表，幻灯片中了一个部分表格。由于此示例是为期 4 年或
    48 个月付款的汽车贷款，因此无法完整查看整个计划。


    让我们看看生成此摊销表所需的金融函数。


    ![](img/f005-1.jpg)


    #### IPMT

    `IPMT` 函数在给定固定利率、期限和每期付款的情况下，计算投资或贷款在特定期内的利息。


    ```

    =IPMT(rate,per,nper,pv,[fv],[type])

    ```


    #### PPMT

    `PPMT` 函数在给定固定利率、期限和每期付款的情况下，计算投资或贷款在特定期内的本金偿还额。


    ```

    =IPMT(rate,per,nper,pv,[fv],[type])

    ```


