- raw: 'The name Monte Carlo simulation comes from the computer simulations performed
    during the 1930s and 1940s to estimate the probability that the chain reaction
    needed for an atom bomb to detonate would work successfully. The physicists involved
    in this work were big fans of gambling, so they gave the simulations the code
    name Monte Carlo.


    What Happens When I Enter =RAND () in a Cell?


    When you enter the formula =*RAND ()* in a cell, you get a number that is equally
    likely to assume any value between 0 and 1.


    ![](OEBPS/images/f061-1.jpg)


    Since RAND () is used as the probability, a random probability is generated at
    refresh.


    ![](OEBPS/images/f062-1.jpg)


    • Next, highlight the area where we want to house the 1,000 iterations.


    • Select Data > Data Tables.


    • For Column input cell: Select a blank cell. In the download file, cell D11 is
    selected.


    • Select OK.


    ![](OEBPS/images/f062-2.jpg)


    Once OK is selected from the previous step, a table is inserted that auto populates
    the 1,000 simulations.


    ![](OEBPS/images/f063-1.jpg)


    Once the simulations are run, it is time to gather summary statistics.


    In this example, I used the COUNTIF () function to determine the percentage of
    simulations that are unprofitable, and the likelihood of a profit greater than
    $1 million.


    ![](OEBPS/images/f064-1.jpg)


    This was gathered by using the COUNTIF () function to count the simulations that
    were less than zero and dividing by the 1,000 iterations.


    [CHAPTER 5](#05_contents.xhtml#r7)


    [Excel for Data Dashboards and Visualization](#05_contents.xhtml#r7)


    What Is a Dashboard?


    ![](OEBPS/images/f065-1.jpg)


    Business Intelligence is a hot commodity in today’s world, and dashboards are
    the most frequently used method of providing that information.


    Through dashboards, we compile the data, in the form of analysis and charts.


    The same should fit entirely on a single computer screen so it can be monitored
    at a glance.


    Planning


    At the planning stage, one must have a look at the following:


    • Why are you creating a dashboard?


    • Who is the audience?


    • What are the KPIs (Key Performance Indicators) that you have to demonstrate?


    • What is the time period, for example, a month, quarter, or year?


    • What is the data source?


    • What will be the frequency of its population and mode of delivery—online/offline?


    It may be worthwhile to have a mock-up of the data that you seek to demonstrate
    through the dashboard on paper before you dive into Excel. Time spent here will
    save you hours of redesign later.


    ![](OEBPS/images/f066-1.jpg)


    Importance of Design


    Design can be quite a determinant of the data dashboard’s utility—can it convey
    your message quickly and easily, or does it hide it in a sea of formatting and
    chart junk like these donut charts and gauges?


    ![](OEBPS/images/f067-1.jpg)


    While this dashboard may look aesthetic in the first instance, it’s cluttered
    with overuse of formatting and bad chart choices. Once users realize it’s taking
    them a long time to glean any meaningful information, it will lose its utility.


    You need to strike a perfect balance between making it look striking (so that
    it holds your audience’s attention) but not so stylized that it takes away from
    the data to be presented.


    A KISS (Keep It Simple Stupid) approach is best.


    ![](OEBPS/images/f067-2.jpg)


    Charts are a useful tool in communicating messages through a picture. That is,
    the shape of the data contains a pattern, trend, or exception. Knowing which chart
    to use for your data and message is essential.


    Design—Less Is More


    ![](OEBPS/images/f068-1.jpg)


    When it comes to dashboard design, remember the maxim—“Less is More.” That is,
    less colors, less fonts, and less formatting.


    Stay well away from 3D effects, gradient fills, shadows and any of the other unnecessary
    formatting.


    If you have two charts displaying the same metric but in a different context,
    you might color them the same to show the reader that they are related. Just as
    in the previous example, the dashboard with the bar charts in the top 10 tables
    at the bottom, which both use the same color because they both display visitor
    numbers, just grouped differently.


    Comparing Categories—Bar Graph


    This is useful when we want to compare one concept with another as well as trends.


    ![](OEBPS/images/f068-2.jpg)


    ![](OEBPS/images/f069-1.jpg)


    Line Graph


    ![](OEBPS/images/f069-2.jpg)


    These graphs determine trends over a period of time.


    Pie Chart


    When you need a graph representing proportions of a whole


    ![](OEBPS/images/f070-1.jpg)


    Tables


    Tables are great if you have detailed information with different measuring units,
    which may be difficult to represent through other charts or graphs.


    ![](OEBPS/images/f071-1.jpg)


    This table shows Customer Activity by Month through Customer | Total Sales | Percent
    of Total


    Using the New, Modern Chart Types


    Excel 2016 includes modern chart types that provide a rich, new set of storytelling
    tools that can be customized to fit your needs.


    ![](OEBPS/images/f071-2.jpg)


    Waterfall


    It’s a simple visual of the running total of your financial data, showcasing the
    element-wise change between, say, budgeted profit and actual profit.


    Histogram


    It displays the frequencies within a distribution. A histogram will help you explore
    and analyze a distribution.


    Pareto


    Here we can focus on the largest impact items by automatically sorting the frequency
    of the most prevalent issues (the bar graph) and then showing the additive contributions
    of each issue as we move along the horizontal axis (the line graph).


    Box and Whisker


    This shows the distribution of information and provides key insights about the
    distribution in one view, including range, quartiles, mean, and outliers.


    Treemap


    We can compare similar or competing products through a hierarchical view of your
    data and easily compare different levels of categorization.


    Sunburst


    Here, we can see the largest contributing segments within a hierarchy of multiple
    levels. The visual layout is intuitively natural for finding how each slice is
    broken down to the most basic contribution. The Sunburst is versatile, displaying
    any number of levels for any category.


    For Colors


    Fill Color and Font Color buttons offer a palette with preset colors. More colors
    are available by selecting one of many standard colors, or a custom combination
    of red, green, and blue.


    ![](OEBPS/images/f073-1.jpg)


    [CHAPTER 6](#05_contents.xhtml#r8)


    [Excel for Data Cleaning and Use of Macros](#05_contents.xhtml#r8)


    Excel’s extensive functionality can best be judged by three of its most essential
    characteristics for the accountant:


    A) Ease with which a user can convert and summarize thousands of lines of raw
    data, even if these are imported from other applications like SAP


    B) Flexibility to accommodate changes at very short notice, thereby relieving
    somewhat the added pressure of tight deadlines; and


    C) Formula/function structure underpinned by logical steps that are simple to
    follow


    Importing data into Excel


    Importing data into Excel from other applications in CSV, TXT format entails:


    • Performing changes and formats on the data available


    • Merging data from more than one source


    • Summarizing data into tables


    Some of the functions that are useful here are:


    \=TRIM: Removes extra spaces


    \=PROPER: Makes first letter in each word uppercase


    \=CLEAN: Removes all nonprintable characters from text


    \=VALUE: Converts text to number


    \=TEXT: Converts number or text to new format


    \=TRIM (PROPER ()): Removes extra spaces and capitalizes each word of text


    \=VALUE (TRIM (CLEAN ())): Converts numbers to text and removes nonprintable characters


    *Example*


    ![](OEBPS/images/f076-1.jpg)


    Since the entire data is in a single column, it must be structured to perform
    data analysis. However, initially you need to clean the data.


    You need to remove any nonprintable characters and excess spaces that might be
    present in the data. You can use the CLEAN function and the TRIM function for
    this purpose.'
