    # 使用文本函数提取数据值


    假设你数据中的字段既没有由字符分隔，也没有通过空格在列中对齐，你可以使用文本函数来提取数据值。即使字段有分隔符，你仍然可以使用文本函数来提取数据。


    一些对此有用的文本函数包括：


    - `LEFT`——返回文本值最左侧的字符

    - `RIGHT`——返回文本值最右侧的字符

    - `MID`——从你指定的位置开始，从文本字符串返回指定数量的字符

    - `LEN`——返回文本字符串中的字符数


    # 宏


    如果你在 `Microsoft Excel` 中有重复执行的任务，可以录制宏来自动化这些任务。宏是你可以运行任意次数的动作或一组动作。当你创建宏时，你正在记录你的鼠标点击和按键输入。创建宏后，你可以对其进行编辑，对其工作方式进行细微更改。


    假设你每个月都要为会计经理创建一个报告。你希望将逾期账户的名称格式化为红色，并应用加粗格式。你可以创建并运行一个宏，快速将这些格式更改应用到你选择的单元格上。


    ![](img/f080-1.jpg)


    宏是一组指令，通过执行一系列命令来自动化重复或例行的任务。你可以使用“宏录制器”，也可以使用 `Visual Basic for Applications
    (VBA)` 编写指令，VBA 是一种可以在各种软件包内部使用的用于增强和自动化功能的编程语言。“宏录制器”会记录你的命令、按键输入和鼠标点击，并将 `Excel`
    命令作为 `VBA` 代码存储在工作簿中。要使用宏录制，你必须先在功能区上安装它。


    ### 在功能区上显示“开发工具”选项卡：


    • 点击“文件”选项卡并点击“选项”，打开“Excel 选项”对话框。

    • 点击“自定义功能区”以显示“自定义功能区”选项。

    • 在“主选项卡”列表中勾选“开发工具”以选中它，然后点击“确定”。


    幻灯片显示已添加了“开发工具”选项卡。花些时间熟悉此选项卡上的组和按钮。注意：我们将在下一张幻灯片中讨论“录制宏”按钮。


    ![](img/f081-1.jpg)


    录制宏非常简单：启动宏录制，按照常例执行一系列命令，然后停止录制。


    ### 录制宏：


    • 在“开发工具”选项卡的“代码”组中，点击“录制宏”显示“录制宏”对话框。

    • 在“宏名称”框中为宏输入一个有意义的名字。

    • 如果需要，在“快捷键”框中为宏分配键盘快捷键。

    • 点击“存储宏的位置”箭头并选择一个存储位置。

    • 在“描述”框中输入宏的描述及其目的，点击“确定”开始录制宏。

    • 执行你想要录制的命令。

    • 在“开发工具”选项卡上点击“停止录制”。


    ![](img/f082-2.jpg)


    录制宏的操作非常直观：启动宏录制，按照常例执行一系列命令，然后停止录制。


    确定宏是否应该使用相对引用、绝对引用或混合引用是重要的，这在你录制宏时。默认情况下，当你录制宏时，它使用绝对引用。


    ### 运行宏：


    • 选择要运行宏的单元。

    • 在“开发工具”选项卡的“代码”组中，点击“宏”显示“宏”对话框。

    • 从宏列表中选择宏并点击“运行”。


    # 创建宏按钮


    在工作簿中访问常用宏的最简单方法是将其将其分配到按钮上。这样，当你点击按钮时，宏就会运行。这种方法将宏分配到工作表上的按钮非常简单。


    ![](img/f083-1.jpg)


    ### 为工作表添加宏按钮：


    • 在“开发工具”选项卡的“控件”组中，点击“插入”，然后在“控件”部分点击“按钮（表单控件）”。

    • 拖动光标在工作表上绘制按钮。当你松开鼠标时，会显示“分配宏”对话框。

    • 选择要分配的宏并点击“确定”。

    • 右键点击按钮，选择“编辑文字”，为按钮输入更具描述性的名称。

    • 点击工作表完成按钮。


    ![](img/f084-1.jpg)


    我们看到 `ClearForm` 宏已分配到“Clear Form”按钮上，并放置在工作表下方。


