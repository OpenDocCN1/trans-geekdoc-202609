    To create a blank `PivotTable`:


    - On the Insert tab in the Tables group, click PivotTable.

    - Select the data that you want to analyze (table or range within the open workbook
    or a connection to an external dataset).

    - Select where you want to place the `PivotTable`: New Worksheet or Existing Worksheet
    and click OK.


    Excel creates a `PivotTable` on a new worksheet. On the new sheet, a `PivotTable`
    and the `PivotTable Fields List` task panel are displayed. The panel displays
    the list of fields in a dataset and areas to place the fields to create the layout.
    These areas are used to organize data in columns, rows, values, and filters.


    As seen in the lower right of the slide, there are four areas:


    ![](OEBPS/images/f034-1.jpg)


    A) FILTERS—displays top-level filters above the `PivotTable` so that you can set
    filters to display results on the basis of particular conditions you set.

    B) COLUMNS—displays columns of summarized data for the selected field(s).

    C) ROWS—groups the data into categories in the first column on the basis of the
    selected field(s).

    D) VALUES—displays summary statistics, such as totals or averages, for the selected
    field.


    ![](OEBPS/images/f034-2.jpg)


    Fields can then be dragged from the Choose fields to add to report list in the
    `PivotTable Field List` to the Report Filter, Column Labels, Row Labels, and Value
    boxes at the bottom of the `PivotTable Field List`.


    #### Illustration


    You can also use a pivot table to group data by numbers—summarizing data by age
    range, price range, or any numerical range that makes sense for your data. To
    illustrate, let’s assume you have a list of voting results that includes voter
    age, and you want to summarize the results by age group. Your data might look
    something like this:


    ![](OEBPS/images/f035-1.jpg)

