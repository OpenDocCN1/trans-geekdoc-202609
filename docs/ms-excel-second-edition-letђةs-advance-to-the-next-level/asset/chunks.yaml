    Benford’s Law


    Benford’s law states that the probability of the first digit of the amount column
    from a huge database of normal transactions should follow the distribution as
    shown in the table.


    | First Digit || Probability (percent) |


    | --- | --- |


    | 1 || 30.10 |


    | 2 || 17.61 |


    | 3 || 12.49 |


    | 4 ||   9.69 |


    | 5 ||   7.92 |


    | 6 ||   6.69 |


    | 7 ||   5.80 |


    | 8 ||   5.12 |


    | 9 ||   4.58 |


    By examining our data against this distribution, we can make conclusions about
    the normalness of data.


    We can Use LEFT(), COUNTIF() functions.


    Univariate Statistics


    Univariate Statistics mean the statistics relating to a single variable. Through
    this, we can find out the mean, median, mode, standard deviation, skewness, kurtosis,
    and various other statistical data relating to the variable. The study of these
    statistics can not only give a general idea about the behavior pattern of data
    but also form a support base for conducting further statistical analysis of the
    data.


    Use the ADD-IN Analysis Tool pack—Descriptive statistics


    Sampling


    In audit, Sampling is used to provide a reasonable basis for the auditor to draw
    conclusions about the population from which the sample is selected. Sampling is
    done because it would be impossible to perform a Test of Detail for 100 percent
    transactions; or the cost of testing would likely exceed the expected benefit.


    There are generally two sampling approaches:


    1. Statistical sampling


    2. Nonstatistical sampling (e.g., judgmental sampling)'
