    INDEX Function


    ![](OEBPS/images/f029-1.jpg)


    \= INDEX (B3:F8, 4, 1)


    Select the cells matrix: table (B3:F8) and specify the row number and column number
    (i.e., 4 and 1, respectively). This will fetch the value of Dept\_01 in April.


    ![](OEBPS/images/f029-2.jpg)


    Similarly, you can apply “3” in the row number to fetch the values for March.


    MATCH Function


    This function identifies the location of a specific parameter in the specified
    list.


    The MATCH function searches for a specified item in a range of cells and then
    returns the relative position of that item in the range. For example, if the range
    A1:A3 contains the values 5, 25, and 38, then the formula =MATCH (25, A1:A3, 0)
    returns the number 2 because 25 is the second item in the range.


    Use MATCH instead of one of the LOOKUP functions when you need the position of
    an item in a range instead of the item itself.


    Note that we used the parameter “0”in the syntax as we wanted an exact match.


    ![](OEBPS/images/f030-1.jpg)


    If the range A1:A4 contains the values Nuts, Bolts, Washers, and Nails, then the
    formula =MATCH (“Bolts”, A1:A3, 0) returns the number 2 because Bolts is the second
    item in the range. Washers would return 3; Nails would return 4, and so on.


    Now using “1” instead


    Let’s say you want to fetch the value that is closest to a given value. Then we
    use the parameter “1” in the syntax.


    So if we use MATCH (5000, D2:D16, 1), we get the value that is closest to 5,000.


    The return information is 7.


    Remember that the values must be sorted in ascending order for this utility to
    work.


    ![](OEBPS/images/f030-2.jpg)


    | Match\_type || Behavior |


    | --- | --- |


    | **Match Type** || **Implications** |


    | 1 or omitted || MATCH finds the largest value that is less than or equal to
    lookup value. The values in the matrix must be in ascending order. |


    | 0 || MATCH finds the first value that is exactly equal to lookup value. |


    | −1 || MATCH finds the smallest value that is greater than or equal to lookup
    value. The values in the matrix must be in descending order. |


    INDEX with MATCH Function


    The INDEX function combined with the MATCH function is useful when looking up
    values that are NOT in the leftmost column of a table, and hence the VLOOKUP cannot
    be used. In the table below, you want to look up the name of the person whose
    code number is AA105.


    ![](OEBPS/images/f031-1.jpg)


    The formula =INDEX (A1:D5, MATCH (“AA105”, D1:D5, FALSE), 1) will return the correct
    value of Brown. The MATCH function inside the INDEX function identifies which
    row in the table contains AA105 (row 3). The INDEX function is then able to cross-reference
    that to column 1 of the table. The formula is thus returning what is in row 3
    and column 1 of the table.


    VLOOKUP with INDEX Function


    The INDEX function can also be used in a VLOOKUP formula to identify the column
    that you want to return the value from. In the example below, the MATCH function
    is being used to return what’s in the Salary column (column number 3) for the
    employee Smith.


    \=VLOOKUP (“Smith”, A1:D5, MATCH (“Salary”, A1:D1, FALSE), FALSE)


    ![](OEBPS/images/f032-1.jpg)


    The formula would return £4,500. The MATCH function returns 3 (the position of
    the word Salary in the range A1:D1). The VLOOKUP then returns the value that is
    in column 3 for the person named Smith.


    Pivot Table


    This is a powerful tool for data analysis. It helps us generate summary information
    from a large database in a very short span of time.


    It helps us assimilate a humungous quantum of data and create a compact table
    that can be changed dynamically. The tool is simple to use, yet powerful.


    Suppose, from a total sales database, we are looking for a particular kind of
    classification like Customer-wise Sales.


    The major features of a PivotTable are as follows:


    A) It’s quick and easy to use.


    B) You can churn data by simply dragging off fields, sorting and filtering, and
    applying different calculations on the data.


    C) Create insights from data through suitable representation.


    D) Create aesthetically soothing reports that are interactive in nature as well.


    How You Create Pivot Tables


    ![](OEBPS/images/f033-1.jpg)


    To create a blank PivotTable:


    • On the Insert tab in the Tables group tab, click PivotTable to open the Create
    PivotTable dialog box.


    • Select the data that you want to analyze (table or range within the open workbook
    or a connection to an external dataset).


    • Select where you want to place the PivotTable: New Worksheet or Existing Worksheet
    and click OK.


    Excel creates a PivotTable on a new worksheet. On the new sheet, a PivotTable
    and the PivotTable Fields List task panel are displayed. The panel displays the
    list of fields in a dataset and areas to place the fields to create the layout.
    These areas are used to organize data in columns, rows, values, and filters.


    As seen in the lower right of the slide, there are four areas:


    ![](OEBPS/images/f034-1.jpg)


    A) FILTERS—displays top-level filters above the PivotTable so that you can set
    filters to display results on the basis of particular conditions you set.


    B) COLUMNS—displays columns of summarized data for the selected field(s).


    C) ROWS—groups the data into categories in the first column on the basis of the
    selected field(s).


    D) VALUES—displays summary statistics, such as totals or averages, for the selected
    field.


    ![](OEBPS/images/f034-2.jpg)


    Fields can then be dragged from the Choose fields to add to report: list in the
    PivotTable Field List to the Report Filter, Column Labels, Row Labels, and Value
    boxes at the bottom of the PivotTable Field List.


