    Pivot Charts


    ![](OEBPS/images/f047-1.jpg)


    Pivot Chart is the graphical representation of a Pivot Table. It also provides
    a high degree of flexibility and enables us to extract the exact information.


    A PivotChart is an interactive graphical representation of the data in a PivotTable
    and visually presents the consolidated data.


    To create a PivotChart, you:


    • Click inside the PivotTable.


    • On the Analyze tab in the Tools group, click PivotChart.


    The PivotChart contains elements that enable you to set filters.


    • The ROWS area is replaced by AXIS (CATEGORY).


    • The COLUMNS area is replaced by LEGEND (SERIES).


    • The field used for the FILTERS area remains a field to use to filter data within
    the PivotChart.


    • The field used for VALUES in a PivotTable remains a field that builds the plot
    area within the PivotChart.


    Excel creates the PivotChart on the basis of the current PivotTable settings,
    but you can change the settings using the PivotChart Fields List.


    • Click the FILTERS arrow and select values to filter the chart.


    • Click the AXIS (CATEGORY) arrows to sort or filter the categories and subcategories
    in rows.


    • Click the LEGEND (SERIES) to filter the chart on the basis of the values.


    Note: Any changes you make to the PivotChart also affect the corresponding PivotTable.


    Using the GETPIVOTDATA Function


    This query can retrieve specific data on the basis of the pivot table structure
    of an existing pivot table.


    To extract data from a cell in a pivot table, you can enter a normal cell link,
    such as =B5, or you can use the GetPivotData function, which is specially designed
    to extract data from a pivot table.


    ![](OEBPS/images/f048-1.jpg)


    In the preceding example, the formula in cell A9 was created by typing an equal
    sign and then clicking on cell B5. It returns the total for file folders.


    \=**GETPIVOTDATA (“Total”, $A$3,“Product”,“File Folders”)**


