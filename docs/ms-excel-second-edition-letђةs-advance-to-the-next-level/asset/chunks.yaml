    ### 使用新的图表类型


    Excel 包含了现代图表类型，提供了根据你的需求进行丰富的工具。


    ![](img/f071-2.jpg)


    #### 瀑布图

    它是一种简单的视觉效果，显示例如预算利润与实际利润之间的变化。


    #### 直方图

    它显示频率分布。直方图将帮助你探索和分析分布。


