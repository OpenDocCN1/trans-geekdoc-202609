- raw: 'The Basic Pivot Table


    To get started on grouping the data by age, first create your pivot table normally.
    Next, add the field Age as a Row Label, and the field Vote as a Column Label.
    Finally, add Name as a Value. In the following example, we also renamed Grand
    Total “Total.” At this point, our pivot table looks like this:


    ![](OEBPS/images/f036-1.jpg)


    Grouping by Age


    Although this pivot table is interesting, it’s not very useful because the automatic
    grouping by actual age is too granular. We don’t care that five 20-year-olds voted
    for Option B—we want to see voting results by age ranges, like 20 to 29, 30 to
    39, and so on. This is easily done using the grouping feature built into pivot
    tables. To group results by age, right-click any value in the Age field and choose
    Group from the menu.


    ![](OEBPS/images/f037-1.jpg)


    Specifying the Interval


    When the Grouping dialog box appears, enter any interval that makes sense in the
    “By:” input area. For this example, we’ll group by 10 years.


    ![](OEBPS/images/f038-1.jpg)


    When you click OK, you’ll see your data neatly grouped by age at 10-year intervals.


    ![](OEBPS/images/f038-2.jpg)


    You can use this same approach to group numeric data in many useful ways. You
    can group customers by total sales, group employees by their time at a company,
    group weather data by temperature—the list is endless.


    Modify a PivotTable


    ![](OEBPS/images/f039-1.jpg)


    To add a field as a row, you would do one of these steps:


    • Click the field’s check box to select it in the Choose fields to add to report
    section.


    • Drag the field from the Choose fields to add to report section, and drop it
    in the ROWS area.


    • Right-click the field name in the Choose fields to add to report section, and
    select Add to Row Labels.


    The sequence of the fields within the ROWS area dictates the hierarchy. In this
    example, we want to show the Areas within each Discipline for the textbook list.
    To show this hierarchy, list the Discipline field first and Area field second
    in the ROWS area.


    ![](OEBPS/images/f039-2.jpg)


    As we saw with Rows, to add values to the PivotTable, you would do one of the
    following steps:


    A) Click the field’s check box to select it in the Choose fields to add to report
    section.


    B) Drag the field from the Choose fields to add to report section, and drop it
    in the VALUES area.


    C) Right-click the field name in the Choose fields to add to report section, and
    select Add to Values.


    • In this example, we are counting the number of books by titles (9 Aging/Death),
    finding the number of books sold (179,415 in the Introductory Discipline), and
    the sales ($21,273,970 for Research/Stats)


    ![](OEBPS/images/f040-1.jpg)


    To subdivide data into columns, drag a field from the Choose fields to add to
    report section and drop it in the COLUMNS area. This slide shows a PivotTable
    that uses the Discipline field as rows, the Sum of Units Sold Wholesale field
    as values, and the Copyright field as columns. Each discipline label and each
    copyright year label appears only once in the PivotTable.


    ![](OEBPS/images/f041-1.jpg)


    As you continue adding and arranging fields, the PivotTable may contain too much
    data to be useful, making it necessary to remove fields. You can remove fields
    to reduce the amount of data to analyze.


    To remove a field from the PivotTable, you would do **one** of the following steps:


    • Click the field name in the *Drag fields between areas below* section and select
    Remove Field.


    • Click the check box next to the field name to deselect it in the *Choose fields
    to add to report* section.


    • Drag a field name in the *Drag fields between areas below* section outside the
    PivotTable Fields List.


    To move a field from one PivotTable area to another, you would do **one** of the
    following steps:


    • Drag the field in the Drag fields between areas below section.


    • Click the field arrow within the area and select Move to Report Filter, Move
    to Row Labels, Move to Column Labels, or Move to Values.


    In this example, to remove the Units Sold Wholesale, deselect its check box. To
    move Area from ROWS to COLUMNS, drag it from one section to the other.


    ![](OEBPS/images/f042-1.jpg)


    Apart from the default functions of SUM for numerical and COUNT for text fields,
    we might want to use other functions as well such as AVERAGE.


    You can also change the column label that appears above the summary statistic,
    or you might need to format the aggregated values.


    To modify any of these settings, you would:


    • Click a value in the appropriate field in the PivotTable, and click Field Settings
    in the Active Field group on the Analyze tab to display the ValueField Settings
    dialog box.


    • Type the name you want to appear as the column label in the Custom Name box.


    • Select the summary statistical function you want to use to summarize the values
    in the *Summarize value field* by list.


    • Click Number Format to open an abbreviated version of the Format Cells dialog
    box; then select a number type and click OK twice.


    PivotTables are not automatically updated if you make any changes to the underlying
    data in the data source.


    To update the PivotTable, you:


    • Click in the PivotTable.


    • Click the Analyze tab.


    • Click Refresh in the Data group to refresh the current PivotTable only, or click
    the Refresh arrow and select Refresh All to refresh all PivotTables in the workbook.


    Filter and Slice a PivotTable


    ![](OEBPS/images/f043-1.jpg)


    PivotTables display aggregated data for each category. However, you may want to
    apply filters to show only a subset of the PivotTable. You can specify a particular
    field to filter the PivotTable.


    To set a PivotTable filter, you:


    • Drag a field to the FILTERS area in the PivotTable Fields List.


    • Click the filter arrow in cell B1 to open the Filter menu and perform **one**
    of the following steps:


    ![](OEBPS/images/bl.jpg) Select the value in the list to filter the data by that
    value only.


    ![](OEBPS/images/bl.jpg) Click the Select Multiple Items check box if you want
    to select more than one value to filter the PivotTable. Click the check boxes
    by each value you want to set.


    ![](OEBPS/images/bl.jpg) Type a value in the Search box if the list is long and
    you want to find a value quickly.


    • Click OK.


    In this example, we are displaying values filtered for the 1, 2, 5, 7, 9 editions.


    ![](OEBPS/images/f043-2.jpg)


    A slicer is a small window containing one button for each unique item in a field
    so that you can filter the PivotTable quickly.


    To insert a slicer, you go to:


    • The Analyze tab in the Filter group, and click Insert Slicer to open the Insert
    Slicers dialog box.


    • Click one or more field check boxes to display one or more slicers and click
    OK.


    ![](OEBPS/images/f044-1.jpg)


    When you select a slicer, the Slicer Tools Options tab is displayed so that you
    can customize a slicer.


    The following list describes the commands on the Slicer Tools Options tab:


    • Slicer—enables you to change the slicer caption.


    • Slicer Styles—applies a style to the slicer by specifying the color of the filtered
    item in the Slicer.


    • Arrange—specifies the slicer’s placement in relation to other groups.


    • Buttons—defines how many columns are displayed in the selected slicer and the
    height and width of each button inside the slicer.


    • Size—sets the height and width of the slicer window.


    In this example for the two slicers:


    • The active filters in the Edition slicer appear in blue, and unavailable items
    appear in light blue.


    • There are two columns in the Edition slicer and one in the Discipline slicer.


    • The Discipline slicer’s height is 3.13”.


    ![](OEBPS/images/f045-1.jpg)


    A PivotTable timeline filters data on the basis of the date range selected. A
    PivotTable timeline is a small window that starts with the first date and ends
    with the last date in the data source, and it contains horizontal tiles that can
    be clicked to filter data by day, month, quarter, or year.


    To insert a timeline and filter data on a timeline in a PivotTable:'
