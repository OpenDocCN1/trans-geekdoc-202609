    • Click OK.


    ![](OEBPS/images/f054-1.jpg)


    **Example: Car Loan Payments**


    Let’s create a one-way Data Table: Car Loan Payments


    We borrow $20,000 from a creditor to buy a car.


    Annual interest rate is 5 percent.


    We plan to pay the loan in 36 months.


    Our monthly payments can be calculated by **PMT** function:


    Monthly Payment = PMT (5/12, 36, 20,000)


    How do our payments change as the **interest rate and/or payment period** changes?


    Using the Scenario Manager for Sensitivity Analysis


    Allows multiple sets of what-if data to be entered and compared.


    Each set is a scenario. Scenario Manager tracks each scenario with a name.


    Each scenario can be reactivated and changed at any time.


    The limitation is that the same cells are used for all scenarios.


    ![](OEBPS/images/f055-1.jpg)


    Scenario summary report compares the scenarios together.


    ![](OEBPS/images/f055-2.jpg)


    Optimization with Excel Solver


    Excel has the capability to solve linear (and often nonlinear) programming problems.


    The Solver tool in Excel


    A) May be used to solve linear and nonlinear optimization problems.


    B) Allows integer or binary restrictions to be placed on decision variables.


    C) Can be used to solve problems with up to 200 decision variables.


    Why You Need to Know This


    It allows you to use linear programming to find the optimal inputs to achieve
    some desired calculation result (e.g., maximize revenues by increasing daily tickets,
    increasing store size, average sale/ticket, etc. simultaneously).


    Use Solver instead of Goal Seek when:


    • You need to place constraints on the input variable (e.g., cannot open a store
    for more than 24 hours a day).


    • More than one input variable is involved.


    • You want to minimize or maximize the resulting calculation in addition to just
    setting the calculation to a predetermined value.


    Load the Solver Add-In


    ![](OEBPS/images/f056-1.jpg)


    Add-ins are programs that can be added to Excel to provide enhanced functionality.
    Solver is an add-in application that searches for the best or optimum solution
    to a problem by manipulating the values for several variables within restrictions
    that you impose. You can use Solver to create optimization models. Optimization
    models find the highest, lowest, or exact value for one particular result by adjusting
    values for selected variables.


    To load Solver, you:


    Click the File tab and select Options.


    Click Add-ins to see a list of active and inactive add-in applications.


    Click the Manage arrow at the bottom of the dialog box, select Excel Add-ins,
    and then click Go to open the Add-ins dialog box.


    Click the Solver Add-in check box in the Add-ins available list and click OK.


    How You Use This Feature


    The key to solving an LP on a spreadsheet is:


    • **Objective cell**—specifies the cell that contains a formula that produces
    a value that you want to optimize (i.e., maximize, minimize, or set to a value)
    by manipulating values of one or more variables.


    • Identify the decision variables that can be varied. These are called **Changing
    Cells.**


    • Identify the cell that contains your objective function as the **Target Cell.**


    • Identify the constraints and tell **Solver** to solve the problem.


    • At this point, the optimal solution to our problem will be placed on the spreadsheet.


    Case 1—Using Solver to Determine the Optimal Product Mix


    ![](OEBPS/images/f058-1.jpg)


    To specify the objective and changing cells and constraints, you:


    • Click Solver in the Analyze group on the Data tab to open the Solver Parameters
    dialog box.


    • Enter the cell containing the formula for which you want to optimize its value
    in the *Set Objective* box.


    • Click an option in the *To* section to specify what type of value you need to
    find for the target cell. In our example, you would click Min and then specify
    the value in the *Value Of* box.


    • Enter the cell references that contain variables in the By Changing Variable
    Cells box.


    • Click Add to the right of the *Subject to the Constraints* list in Solver Parameters
    to open the Add Constraint dialog box.


    • Enter the cell reference, the operator to test the cell reference, and the constraint
    the cell needs to match.


    • Click OK to add the constraint and return to the Solver Parameters dialog box,
    or click Add to add the constraint and create another constraint.


    Remember:


    • The objective cell would be the cell containing the total interest paid formula,
    which we would like to minimize.


    • The changing variable cells would be the down payment and the number of years.


    • The constraints could be that the down payment is between $5,000 and $8,000.


    ![](OEBPS/images/f059-1.jpg)


    To create a Solver report, you:


    • Click Solve in the Solver Parameters dialog box. When Solver completes the iterative
    process, the Solver Results dialog box appears. If it finds a solution, the Reports
    list displays available report types. If Solver cannot reach an optimal solution,
    no reports are available.


    • Click Keep Solver Solution to keep the changed objective and variable values,
    or click Restore Original Values to return to the original values in the worksheet.


    • Select a report from the Reports list and click OK.


    Note: If you keep the changed values, Excel makes those changes to the actual
    worksheet.


    ![](OEBPS/images/f059-2.jpg)


    Solver creates a new worksheet for the Solver summary report containing four major
    sections:


    • The first section displays information about the Solver report.


    • The second section displays the objective cell information. Specifically, this
    section shows the original and final objective cell values.


    • The third section displays the variable cells. Specifically, it displays the
    cell references, the variable cell names, original values, and final values.


    • The fourth section lists the constraints. It displays the cell reference, description,
    new cell value, formula, status, and slack for each defined constraint (not shown
    on the slide).


    When you save a Solver model, you save the objective value, the changing variable
    cells, and the constraints.


    To save Solver settings, you:


    • Click Load/Save in the Solver Parameters dialog box.


    • Click in the worksheet where the first cell is to be placed.


    • Click Save to return to the Solver Parameters dialog box.


    If you want to use an existing Solver model with new or updated data, you must
    return to a previous Solver model.


    To use a Solver model that you saved, you:


    • Click Load/Save in the Solver Parameters dialog box.


    • Select the worksheet cells that contain the Solver data.


    • Click Load to load the model’s values, and return to the Solver Parameter dialog
    box.


    Introduction to Monte Carlo Simulation


    We would like to be able to accurately estimate the probabilities of uncertain
    events. For example, what is the probability that a new product’s cash flows will
    have a positive net present value (NPV)? What is the riskiness of our investment
    portfolio? Monte Carlo simulation enables us to model situations that present
    uncertainty and play them out thousands of times on a computer.'
