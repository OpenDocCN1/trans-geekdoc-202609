    ## [CHAPTER 2](#05_contents.xhtml#r4)


    ## [Excel for Conditional Math and Statistical Functions](#05_contents.xhtml#r4)


    As against specialist software packages for statistical analysis like SPSS, R,
    SAS, and Minitab, the reason we often use Excel for statistical analysis is


    A) Convenience as it’s already installed on our PCs. It is to be noted that unless
    the statistical computational needs are highly advanced, for beginners Excel is
    quite user-friendly and eliminates the need to learn another software. Excel also
    integrates easily into other Microsoft Office software products, and this can
    be helpful when preparing reports or presentations.


    B) Cost—There is no need to incur license costs of an SPSS, R, SAS, and Minitab.


    There are a host of statistical analysis functions for descriptive statistics.
    In addition, it provides the standard worksheet functionality and makes it useful
    for other analysis and data manipulation tasks, including generating graphical
    and other presentation formats.


    This table shows some of the statistical functions available in Excel:


    | Function name | Description |

    | --- | --- |

    | AVERAGE | Returns the arithmetic mean (average) of the given numbers |

    | CHISQ.DIST.RT | Returns the right-tailed probability for the chi-squared distribution
    |

    | CHISQ.TEST | Returns the `p`-value for the chi-squared test of association |

    | CONFIDENCE.T | Returns the margin of error for a confidence interval for the
    mean |

    | COUNT | Counts the number of cells in a range that contain numbers |

    | COUNTIF | Counts the number of cells in a range that meet a given condition
    |

    | COUNTA | Counts the number of cells in a range that are not empty |

    | KURT | Returns the kurtosis of a dataset |

    | MAX | Returns the maximum value of the given numbers |

    | MEDIAN | Returns the median of the given numbers |

    | MIN | Returns the minimum value of the given numbers |

    | MODE.SNGL | Returns the mode of the given numbers |

    | PEARSON | Returns the mode of the given numbers |

    | SKEW | Returns the skewness of a dataset |

    | STDEV.P | Returns the standard deviation of the population |

    | STDEV.S | Returns the standard deviation of the sample |

    | VAR.P | Returns the variance of the population |

    | VAR.S | Returns the variance of the sample |


    The SUMIF, AVERAGEIF, COUNTIF functions are located under Math & Trig. The SUMIFS,
    AVERAGEIFS, COUNTIFS functions are statistical.


    ![](OEBPS/images/f11.jpg)


    ## Measure Tendency


    When calculating central tendencies, there are two groups:


    • A population is a dataset that contains all data.

    • A sample is a smaller, manageable portion.


    Excel provides two versions to calculate these:

    The SUMIFS, AVERAGEIFS, COUNTIFS functions are used of each.


    ## Dispersion


    Variance is a measure of a dataset’s dispersion. Standard deviation is the measure
    of how far the data is spread around the mean.


    Standard Deviation Functions:

    • `STDEV.P` calculates the standard deviation of the population.

    • `STDEV.S` calculates the standard deviation of the sample.


    The arguments for these two functions are:

    The first argument specifies the range of values used to calculate.


    Variance Functions:

    • `VAR.P` calculates the variance of the population.

    • `VAR.S` calculates the variance of the sample.


    ![](OEBPS/images/f12.jpg)


    ## Correlation


    This quantifies the causal relationship between two variables, for example, smoking
    and cancer or hours spent studying and the grades.


    The correlation coefficient can vary between −1 and 1. The stronger the relationship,
    the closer the coefficient is to −1 or 1. The `CORREL` function, short for "correlation
    coefficient," helps determine the strength of relationship between two variables.


    ## Frequency


    The frequency distribution is a meaningful descriptive tool because it determines
    how often a set of numbers appears within a dataset. The `FREQUENCY` function
    determines the frequency distribution of a dataset.


    The two arguments for the function are:

    • `data_array`: contain the values that are being evaluated for frequency of occurrence.

    • `bins_array`: the range of numbers that specify the bins in which the data should
    be counted.


    As seen in the Formula Bar, we are using Column C... 12 people in the first quartile
    and 13 in the second and third quartiles.


    ![](OEBPS/images/f13.jpg)


    ## Load the Analysis ToolPak


    To enable the Analysis ToolPak add-in, you:

    • Click the File tab and click Options.

    • Select Add-ins on the left side.

    • Ensure that Excel Add-ins is selected in the Manage box and click Go.

    • Click the Analysis ToolPak check box to select it and click OK.


    The functions available are:


    | Function name | Description |

    | --- | --- |

    | ANOVA: Single Factor | Performs a one-way analysis of variance (ANOVA) |

    | Correlation | Creates a correlation matrix showing the Pearson correlation coefficient
    (*r*) for each pair of variables of *N* cases selected |

    | Descriptive statistics | Calculates a range of univariate descriptive statistics,
    including measures of central tendency, dispersion, skewness, and kurtosis for
    a variable |

    | Histogram | Generates a histogram for a range of data (this function also generates
    a table of the data on which the histogram is based and can be used for Pareto
    analysis) |

    | *t*\-Test: Paired Two-Sample for Means | Performs a *t*\-test to compare the
    means of a paired sample |

