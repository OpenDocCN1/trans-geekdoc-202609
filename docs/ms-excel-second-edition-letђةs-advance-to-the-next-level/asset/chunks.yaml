    Both sampling approaches require the exercise of auditor judgment during the planning,
    implementation, and evaluation of the sampling.


    In some circumstances, statistical sampling is more appropriate because it can
    be measured and controlled.


    Firms without the resources to purchase expensive audit software may consider
    using `Excel` to perform sophisticated statistical sampling methods.


    # Random Sampling


    Random sampling ensures that all items within a population stand an equal chance
    of selection.


    The random selection by manually picking any “n” number of transactions by ticking
    in a list what strikes the eye might be highly unscientific.


    Excel provides a function `RAND()` to generate a random number.


    With the support of an Add-In, it also provides the feature to generate multiple
    random numbers at one go, between a given set of range based on various settings.
    These random numbers are based on random tables built within the computer and
    are thus more efficient.


    Use the `RAND()` function or `Analysis Toolpak > Random Numbers`.


    # Stratifying Data in a Pivot Table


    We can stratify the data and prepare a frequency distribution of the data. This
    can be done for numeric fields as well as for the text fields in the data. The
    distribution of data can give us important information about the nature of the
    data and can also help us identify the areas where detailed tests should be conducted.


    It can also help us prepare the list of key data on the basis of `PARETO ANALYSIS`,
    which states the 80 to 20 rule. For example, 20 percent of your customers contribute
    toward 80 percent of the sales.


    We can use the `COUNTIF()` and `SUMIF()` functions or `PIVOT TABLES`.


    ## Illustration


    We can use a `NESTED IF` for stratification of data:


    ```

    =IF (B4>1000, “3. Over $1000”, IF (B4>100, “2. Over $100 to $1,000”, IF (B4<=100,
    “1. Up to $100”)))

    ```


    This will create three strata:

    1. Up to $100

    2. Over $100 to $1,000

    3. Over $1,000


    Start from highest to lowest—Excel picks the first matching item.


    # Specific Accounts Payable Tests


    1. (What) Summarize activity on the amount field (absolute value of debit or credit)
    to identify the top occurring amounts. Then summarize activity by vendor and the
    amount identified for the top 25 appearing.

    2. (What) Extract payables that equate to round multiples of 10,000, 100,000,
    and 1,000,000.

    3. (When) Extract transactions posted on weekends and holidays.

    4. (When) Summarize activity by day, month, and year.

    5. (Who) Summarize activity by user and month.


    # Calculating an Average DPO


    ![](OEBPS/images/f088-1.jpg)


    Create a calculated field for check less invoice date (DPO)—in data or the `Pivot`.
    Add sum of `Invoice Amount` and `Average` of newly calculated field.


    # Identify the Longest Time to Enter a Vendor Invoice


    ![](OEBPS/images/f088-2.jpg)


    # Audit Data Lying at Extremes (Outliers)


    Sometimes, it might make audit sense to audit all the data lying at extremes (outliers).
    This can be easily identified using `Excel`’s `Filter` option once we decide the
    confidence level. It is usually taken that data lying outside `MEAN ± (3 × STD
    DEV)` give data that lie `OUTSIDE` the confidence level of over 99 percent for
    a normal distribution. Once we know the value of the above variables, we can filter
    the data for the outliers.


    We can use `Descriptive Statistics` followed by `AutoFilter`.


    ## Scatter Plot


    ![](OEBPS/images/f089-1.jpg)


    Scatter plots do not connect individual data points with a line but instead express
    a trend. This trend can be represented through the distribution of points or through
    the addition of a trend line/regression line. The explanation for this is as follows:


    ![](OEBPS/images/f090-1.jpg)


    1—High dollar change and low count (outliers)

    2—Charges that make sense

    3—Changes that don’t make sense

    4—Inefficiency that is developing


    # Aging of Receivables


    In audit, we often have to compute a schedule for aging of receivables.


    ### Step 1

    Label the following cells:

    - `A1`: Customer

    - `B1`: Order #

    - `C1`: Date

    - `D1`: Amount Due


    Enter in the corresponding information for your customers and their orders underneath
    the headlines.


    ![](OEBPS/images/f090-2.jpg)


    ### Step 2

    Add additional headers for each column as:

    - `E1`: Days Outstanding

    - `F1`: Not Due

    - `G1`: 0 to 30 days

    - `H1`: 31 to 60 days

    - `I1`: 61 to 90 days

    - `J1`: >90 days


    ![](OEBPS/images/f091-1.jpg)


    ### Step 3

    Next, we will input a formula for the `Days Outstanding` column that will let
    us know how many days that invoice has gone unpaid since the due date.


    In cell `E2`, enter in the following formula:

    ```

    = IF (TODAY ()>C2, TODAY ()-C2, 0)

    ```


    ![](OEBPS/images/f091-2.jpg)


    Drag the formula till the end. Drag the fill handler from cell `E2` all the way
    to the last customer. This will populate the formula down the whole column so
    you do not have to enter it in over again.


    ![](OEBPS/images/f091-2.jpg)


