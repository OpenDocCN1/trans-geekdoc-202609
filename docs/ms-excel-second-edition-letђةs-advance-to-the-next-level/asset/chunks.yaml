    蒙特卡洛模拟的名称来源于 20 世纪 30 年代和 40 年代期间进行的计算机模拟，这些模拟用于估计原子弹爆炸所需的链式反应能够成功的概率。参与这项工作的物理学家们都是赌博的大粉丝，因此他们将这些模拟代命名为“蒙特卡洛”。


    ## 在单元格中输入 =RAND() 会发生什么？


    当你在单元格中输入公式 `=RAND()` 时，你会得到一个在 0 到 1 之间任何数值概率相等的数字。


    ![](img/f061-1.jpg)


    由于 `RAND()` 被用作概率，刷新时会生成一个随机概率。


    ![](img/f062-1.jpg)


    • 下，高亮我们想要放置 1,000 次迭代的区域。

    • 选择 `数据` > `数据表`。

    • 对于 `列输入单元格`：选择一个空白格。在下载文件中，选择了单元格 `D11`。

    • 选择 `确定`。


    ![](img/f062-2.jpg)


    一旦在上一步选择了 `确定`，就会插入一个表格并自动填充 1,000 次模拟。


    ![](img/f063-1.jpg)


    模拟运行完成后，就是时候收集汇总统计数据了。


    在这个示例中，我使用了 `COUNTIF()` 函数来确定亏损模拟的百分比，以及利润大于 100 万美元的可能性。


    ![](img/f064-1.jpg)


    这是通过使用 `COUNTIF()` 函数统计小于零的模拟次数，并除以 1,000 次迭代得到的。


    # 第 5 章


    ## Excel 用于数据仪表盘和可视化


    ### 什么是仪表盘？


    ![](img/f065-1.jpg)


    商业智能是当今世界的一种热销商品，而仪表盘是提供此类信息最常用的方法。通过仪表盘，我们以分析和图表的形式汇总数据。这些内容应该完全适应在一个电脑屏幕上，以便一目了然地监控。


    ### 计划


    在规划阶段，必须考虑以下内容：


    • 为什么要创建仪表盘？

    • 受众是谁？

    • 你必须展示的 KPI（关键性能指标）有哪些？

    • 时间段是多久，例如，一个月、一个季度或一年？

    • 数据源是什么？

    • 它的填充频率和交付模式（在线/离线）是什么？


    在深入 Excel 之前，在纸上对你想要通过仪表盘展示的数据进行草图绘制可能是值得的。在这里花费的时间将节省你日后重新设计的几个小时时间。


    ![](img/f066-1.jpg)


    ### 设计的重要性


    设计可以是数据仪表盘实用性的相当决定因素——它是能够快速快捷地传达你的信息，还是将其隐藏在像这些环形图和仪表盘之类的格式和图表杂质中？


    ![](img/f067-1.jpg)


    虽然这个仪表盘初看起来可能很美观，但它由于过度使用格式和糟糕的图表选择而显得杂乱。一旦用户发现获取任何有意义的信息需要很长时间，它就会失去实用性。你需要在让它看起来引人注目（以吸引观众的注意力）与不要过于风格化而影响要展示的数据之间取得完美的平衡。采用
    KISS（保持简单，愚蠢）的方法是最好的。


    ![](img/f067-2.jpg)


    图表是通过图片传达信息的有用工具。也就是说，数据的形状包含了一种模式、趋势或异常。知道对你的数据和信息使用哪种图表是关重要的。


    ### 设计——少即是多


    ![](img/f068-1.jpg)


    涉及仪表盘设计时，记住格言——“少即是多”。也就是说，更少的颜色、更字体和少的格式。远离 3D 效果、渐变填充、阴影和任何其他必要的格式。


    如果你有两个图表显示相同的指标但背景不同，你可以给它们涂相同的颜色，告诉读者它们是相关的。就像之前的示例一样，底部前 10 表格中的柱状图仪表盘使用了相同的颜色，因为它们都显示访问人数，只是分组方式不同。


    #### 比较类别——柱形图


    当我们想要比较一个概念与另一个概念以及趋势时，这非常有用。


    ![](img/f068-2.jpg)

    ![](img/f069-1.jpg)


    #### 折线图


    ![](img/f069-2.jpg)


