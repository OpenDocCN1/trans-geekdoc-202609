  trans: '


    两种采样方法都需要在抽样的计划、实施和评估过程中行使审计师的判断。


    在某些情况下，统计抽样更为合适，因为它是可以衡量和控制的。


    没有资源购买昂贵审计软件的公司可以考虑使用 `Excel` 来执行复杂的统计抽样方法。


    # 随机抽样


    随机抽样确保总体中的所有项目都有平等的被选机会。


    通过手动在列表中勾选肉眼看到的任意“n”笔交易来进行随机选择，可能是非常不科学的。


    Excel 提供了一个 `RAND()` 函数来生成随机数。


    在加载项（Add-In）的支持下，它还提供了根据各种设置在给定范围内一次性生成多个随机数的功能。这些随机数基于计算机内置的随机表，因此效率更高。


    使用 `RAND()` 函数或 `Analysis Toolpak > Random Numbers`。


    # 在透视表中对数据进行分层


    我们可以对数据进行分层并准备数据的频率分布。这既可以针对数值字段，也可以针对数据中的文本字段。数据分布可以为我们关于数据性质的重要信息，并帮助我们识别应该进行详细测试的领域。


    它还可以帮助我们根据 `PARETO ANALYSIS`（帕累托分析）准备关键数据列表，该分析遵循 8020 法则。例如，20%的客户贡献了 80%的销售额。


    我们可以使用 `COUNTIF()` 和 `SUMIF()` 函数或 `PIVOT TABLES`。


    ## 示例


    我们可以使用 `NESTED IF` 对数据进行分层：


    ```

    =IF (B4>1000, “3. Over $1000”, IF (B4>100, “2. Over $100 to $1,000”, IF (B4<=100,
    “1. Up to $100”)))

    ```


    这将创建三个层：

    1. $100 以下

    2. $100 到 $1,000 之间

    3. $1,000 以上


    从高到低开始——Excel 会选择第一个匹配的项目。


    # 特定应付账款测试


    1. (内容) 汇总金额字段（借方或贷方的绝对值）的活动，以识别出现频率最高的金额。然后按供应商和识别出的前 25 次出现的金额汇总活动进行

    2. (内容) 提取等于 10,000、100,000 和 1,000,000 整数倍倍的应付账款。

    3. (时间) 提取在周末和节假日发布的交易。

    4. (时间) 按天、月、年汇总活动。

    5. (人员) 按用户和月份汇总活动。


    # 计算平均 DPO


    ![](img/f088-1.jpg)


    为发票日期小于到期日（DPO）创建一个计算字段——在数据或 `Pivot` 中。添加 `Invoice Amount` 的总和以及新计算字段的平均值。


    # 识别输入供应商发票的最长时间长


    ![](img/f088-2.jpg)


    # 审计极端值数据（离群值）


    有时，审计所有处于极端的数据（离群值）具有审计意义。一旦我们决定了置信水平，可以使用 `Excel` 的 `Filter` 选项轻松识别。通常认为，位于 `MEAN
    ± (3 × STD DEV)` 之外的数据对于正态分布处于超过 99%的置信水平之外。一旦我们知道上述变量的值，就可以过滤出离群值。


    我们可以使用 `Descriptive Statistics` 然后使用 `AutoFilter`。


    ## 散点图


    ![](img/f089-1.jpg)


    散点图不用线连接单个数据点，而是表达趋势。这种趋势可以通过点的分布或通过添加趋势线/回归线来表示。其解释如下：


    ![](img/f090-1.jpg)


    1—金额变化大且数量少（离群值）

    2—合理的费用

    3—不合理

    4—正在发展的低效率


    # 应收账款账龄


    在审计中，我们经常必须计算应收账款年龄表。


    ### 第一步

    标记以下单元格：

    - `A1`: 客户

    - `B1`: 订单号

    - `C1`: 日期

    - `D1`: 应收金额


    在标题下方输入您的客户及其订单相应的信息。


    ![](img/f090-2.jpg)


    ### 第二步

    为每列添加额外的标题，如：

    - `E1`: 未未天数

    - `F1`: 未到期

    - `G1`: 0 到 30 天

    - `H1`: 31 到 60 天

    - `I1`: 61 到 90 天

    - `J1`: >90 天


    ![](img/f091-1.jpg)


    ### 第三步

    接下来，我们将为 `DaysOutstanding` 列输入公式，使我们知道该发票自到期日以来未支付了多少天。


    在单元格 `E2` 中，输入以下公式：

    ```

    = IF (TODAY ()>C2, TODAY ()-C2, 0)

    ```


    ![](img/f091-2.jpg)


    拖动公式直到结束。从单元格 `E2` 拖动填充句直到最后一个客户。这将填充整个列公式，因此您不需要重复输入。


    ![](img/f091-2.jpg)


    '
