    Extracting Data Values with Text Functions


    Suppose the fields in your data are neither delimited by a character nor aligned
    in columns with spaces between each field, you can use text functions to extract
    data values. Even if the fields are delimited, you can still use text functions
    to extract data.


    Some of the text functions that are useful for this purpose are:


    LEFT—Returns the leftmost characters from a text value


    RIGHT—Returns the rightmost characters from a text value


    MID—Returns a specific number of characters from a text string starting at the
    position you specify


    LEN—Returns the number of characters in a text string


    Macro


    If you have tasks in Microsoft Excel that you do repeatedly, you can record a
    macro to automate those tasks. A macro is an action or a set of actions that you
    can run as many times as you want. When you create a macro, you are recording
    your mouse clicks and keystrokes. After you create a macro, you can edit it to
    make minor changes to the way it works.


    Suppose that every month you create a report for your accounting manager. You
    want to format the names of the customers with overdue accounts in red and also
    apply bold formatting. You can create and then run a macro that quickly applies
    these formatting changes to the cells you select.


    ![](OEBPS/images/f080-1.jpg)


    A macro is a set of instructions that executes a sequence of commands to automate
    repetitive or routine tasks. You can either use the Macro Recorder or type instructions
    using Visual Basic for Applications (VBA), which is a programming language that
    can be used within various software packages to enhance and automate functionality.
    The Macro Recorder records your commands, keystrokes, and mouse clicks and stores
    Excel commands as VBA code within a workbook. To use the macro record, you must
    first install it on the Ribbon.


    To display the Developer tab on the Ribbon:


    • Click the File tab and click Options to open the Excel Options dialog box.


    • Click Customize Ribbon to display the Customize the Ribbon options.


    • Click the Developer check box in the Main Tabs list to select it and click OK.


    The slide shows that the Developer tab has been added. Take some time to familiarize
    yourself with the groups and buttons on this tab. Note: The Record Macro button,
    which we will discuss on the next slide.


    ![](OEBPS/images/f081-1.jpg)


    Recording a macro is straightforward: You initiate the macro recording, perform
    a series of commands as you normally do, then stop the macro recording.


    To record a macro:


    • On the Developer tab in the Code group, click Record Macro to display the Record
    Macro dialog box.


    • Type a meaningful name for the macro in the Macro name box.


    • Assign a keyboard shortcut, if desired, for your macro in the Shortcut key box.


    • Click the Store macro in arrow and select a storage location.


    • Type a description of the macro and its purpose in the Description box, and
    click OK to start recording the macro.


    • Perform the commands that you want to record.


    • Click Stop Recording on the Developer tab.


    ![](OEBPS/images/f082-1.jpg)


    It is important to determine whether your macro should use relative, absolute,
    or mixed references as you record the macro. By default, when you select cells
    when recording a macro, the macro records the cells as absolute references. If
    you want flexibility such that commands are performed relative to the active cell
    when you run the macro, click the Macros arrow in the Macros group on the View
    tab and select Use Relative References before you perform the commands.


    To run a macro:


    • Select the location where you will test the macro.


    • On the Developer tab in the Code group, click Macros to display the Macro dialog.


    • Select the macro from the Macro name list and click Run.


    As seen in the slide, the ClearForm macro will be run. Because the macro was named
    with a meaningful name, we know that it will clear the contents of a form.


    Create Macro Buttons


    ![](OEBPS/images/f083-1.jpg)


    The simplest way to access frequently used macros within a workbook is to assign
    a macro to a button on a worksheet. That way, when you or other people use the
    workbook, it is easy to click the button to run the macro.


    To add a macro button to a worksheet:


    • On the Developer tab in the Controls group, click Insert, and then click Button
    (Form Control) in the Form Controls section of the Insert gallery.


    • Drag the crosshair pointer to draw the button on the worksheet. When you release
    the mouse button, the Assign Macro dialog box is displayed.


    • Select the macro to assign to the button and click OK.


    • Right-click the button, select Edit Text, and type a more descriptive name for
    the button.


    • Click the worksheet to complete the button.


    • Click the cell that should be the active cell when the macro runs, and click
    the button to execute the macro assigned to the button.


    ![](OEBPS/images/f084-1.jpg)


    We see that the ClearForm macro has been assigned to the button Clear Form and
    positioned on the worksheet below the form.


