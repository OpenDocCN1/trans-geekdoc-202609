    ## 更改透视表设计


    ![](img/f046-3.jpg)


    ## 数据透视图


    ![](img/f047-1.jpg)


    `Pivot Chart` 是 `Pivot Table` 的图形表示。它还提供了高度的灵活性，使我们能够提取确切的信息。


    `PivotChart` 是 `PivotTable` 中数据的交互式图形表示，并直观地展示汇总数据。


    要创建 `PivotChart`，您：

    - 点击 `PivotTable` 内部。

    - 在 `Tools` 组的 `Analyze` 选项卡上，点击 `PivotChart`。


    `PivotChart` 包含允许您设置筛选器的元素。

    - `ROWS` 区域被 `AXIS (CATEGORY)` 替换。

    - `COLUMNS` 区域被 `LEGEND (SERIES)` 替换。

    - 用于 `FILTERS` 区域的字段仍然用于过滤 `PivotChart` 内数据的字段。

    - 在 `PivotTable` 中用于 `VALUES` 的字段仍然用于在 `PivotChart` 中构建绘图区域的字段。


    Excel 根据当前的 `PivotTable` 设置创建 `PivotChart`，但您可以使用 `PivotChart Fields List` 更改设置。

    - 点击 `FILTERS` 箭头并选择值以过滤图表。

    - 点击 `AXIS (CATEGORY)` 箭头以对行中的类别和子类别进行排序或过滤。

    - 点击 `LEGEND (SERIES)` 根据值过滤图表。


    注意：您对 `PivotChart` 进行的任何更改也会影响相应的 `PivotTable`。


    ## 使用 GETPIVOTDATA 函数


    此查询可以根据现有透视表的结构检索特定数据。


    要从透视表中的单元格中提取数据，可以输入普通的单元格链接，例如 `=B5`，或者可以使用 `GetPivotData` 函数，该函数专门设计用于从透视表中提取数据。


    ![](img/f048-1.jpg)


    在前面的示例中，单元格 `A9` 中的公式是通过输入一个等号然后点击单元格 `B5` 创建的。它返回了文件文件夹的总计。


    ```

    =GETPIVOTDATA (“Total”, $A$3,“Product”,“File Folders”)

    ```


    ## 第 4 章：用于决策的 Excel


    ### 目标查找命令


    `What-If Analysis` 提供了一种对公式中基础数字进行试错循环的能力。


    ![](img/f049-1.jpg)


    使用 `Goal Seek` 工具可以自动化更改一个变量并计算函数，以获得您想要的值。

    - A) 设置单元格 (Set cell)：显示您尝试获取内容的单元格。它必须包含公式。

    - B) 数值 (To value)：您想要的值。它必须是数字。

    - C) 通过更改单元格 (By changing cell)：Excel 更改的单元格。


    `Goal Seek` 是一个工具，而不是函数。


    显示结果的单元格必须包含依赖于变量单元格的公式。您可以使用 `Undo` 撤销任何更改。


    ![](img/f050-1.jpg)


    ### 使用数据表进行敏感性分析


    Excel 在计算方面非常强大。


    假设您的贷款付款公式设定为 `PMT (rate, nPeriods, pValue)`


    如果我们想看看随着参数的改变，我们的计算会发生什么变化？

    我们有多个选择：

    I. 我们可以手动调整值并尝试记住较早的结果。

    II. 我们可以公式复制到许多单元格中，并为每个副本使用不同的输入。

    III. 我们可以使用最好的方法：`Excel Data Table`（Excel 数据表）。


    有两种不同类型的数据表：

    - A) `One-way`（单向）数据表：允许您更改一个参数。

    - B) `Two-way`（双向）数据表：允许您更改两个参数。


    #### 创建单变量数据表


    单变量数据表是一个结构区域，包含一个变量的不同值，以比较不同值如何影响一个或多个计算结果。例如，单变量数据表用于比较抵押贷款的每月付款额。在确定要操作的变量后，您需要指定替换值。替换值是替换数据表中变量原始输入值的值。您可以手动输入替换值，或使用
    `Series` 对话框来帮助完成一系列值。


    要使用 `Series` 对话框，您：

    - 输入第一个替换值并保持该单元格为活动单元格。

    - 在 `Home` 选项卡中的 `Editing` 组中，点击 `Fill` 然后选择 `Series` 以打开 `Series` 对话框。

    - 点击 `Rows` 或点击 `Columns` 以选择替换值序列的方向。

    - 在 `Step value` 框中输入值增量，在 `Stop value` 框中输入序列的结束值，并点击 `OK`。


    ![](img/f051-1.jpg)


    在此示例中，第一个替换值是 `D4` 中的 `5 percent`；点击了 `Columns`，因此替换值序列沿列向下排列，增量为 `0.5 percent`，停止值为
    `9 percent`。


    在将替换值添加到列中之后，必须添加与变量相关的公式。要完成单变量数据表，您：

    - A) 选择数据表边界，从左上角的空白单元格开始。向下并向右拖动，如果有多于一列，选择最后一个替换值与公式引用交叉处的最后一个单元格。

    - B) 在 `Data` 选项卡的 `Forecast` 组中，点击 `What-If Analysis` 并选择 `Data Table` 以打开 `Data
    Table` 对话框。

    - C) 输入您正在替换的变量变量单元格引用。如果替换值在行中，则在 `Row input cell` 框中输入原始单元格引用。同样对于列，在 `Column
    input cell` 框中输入原始单元格引用。

    - D) 点击 `OK`。


    ![](img/f052-1.jpg)


    #### 示例：汽车贷款


    让我们创建一个单向数据表：汽车贷款。我们向债权人借了 `$20,000` 来买车。年利率为 `5 percent`。我们计划在 `36 months` 内还清贷款。每月付款额可以通过
    `PMT` 函数计算：


    ```

    Monthly Payment = PMT (5/12, 36, 20000)

    ```


    随着 `interest rate` 的变化，我们的付款会如何变化？


    #### 双向数据表


    `Excel Data Tables` 让我们看到参数变化的影响。`Two-way` 数据表：允许我们更改两个参数。


    #### 创建双变量数据表


    在情况下，您可能想根据两个变量来比较计算结果。双变量数据表是一个结构区域，包含两个变量的不同值，以比较这些不同的值如何影响一个计算结果。例如，您可能想比较各种利率和不同首付款的共同影响。创建双变量数据表的方法与单变量数据表的方法相似。对于双变量数据表，您使用顶行作为一个变量的替换值，使用第一列作为另一个变量的替换值。双变量数据表允许您使用两个变量，但您仅限于一个结果，而不是多个结果。在左上角的空白单元格中输入公式或原始公式的引用。例如，在
    `D3` 单元格中输入每月付款的单元格引用 (`=B12`）。


    ![](img/f053-1.jpg)


