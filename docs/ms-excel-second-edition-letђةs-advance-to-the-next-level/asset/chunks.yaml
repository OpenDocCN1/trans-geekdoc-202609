    # 第 6 章


    ## Excel 用于数据清洗和宏的使用


    Excel 广泛的功能可以通过会计师最重要的三个基本特征进行最佳判断：


    A) 用户轻松转换和总结数千行原始数据，即使这些数据是从 SAP 等应用程序导入的

    B) 灵活适应极短时间内的变化，从而缓解紧迫截止日的压力；以及

    C) 公式/函数结构基于易遵循的逻辑步骤


    ### 将数据导入 Excel


    从其他应用程序以 CSV、TXT 格式将数据导入 Excel 包括：


    • 对可用数据进行更改和格式化

    • 合并多个来源的数据

    • 将数据汇总成表格


    这里可以使用的一些函数：


    `=TRIM()`：删除多余空格

    `=PROPER()`：每个单词的首字母大写

    `=CLEAN()`：从文本中删除所有不可打印字符

    `=VALUE()`：将文本转换为数字

    `=TEXT()`：将数字或文本转换为新格式

    `=TRIM (PROPER ())`：删除多余空格并大写每个单词的首字母

    `=VALUE (TRIM (CLEAN ()))`：将数字转换为文本并删除不可打印字符

