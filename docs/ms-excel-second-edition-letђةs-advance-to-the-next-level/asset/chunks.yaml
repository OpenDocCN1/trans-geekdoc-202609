    ### 第 1 章 用于个人财务决策的 Excel

    假设你想创建一个还款计划，显示每期的利息、每笔付款的本金偿还额以及每笔款支付后的余额。这被称为贷款摊销表，幻灯片中了一个部分表格。由于此示例是为期 4 年或
    48 个月付款的汽车贷款，因此无法完整查看整个计划。


    让我们看看生成此摊销表所需的金融函数。


    A) `PV`（现值）函数在给定固定利率和每期付款的情况下，计算投资的现值。


    B) `FV`（未来值）函数在给定固定利率和期限的情况下，计算投资的未来值。


    C) `NPV`（净现值）函数计算投资的净现值。


