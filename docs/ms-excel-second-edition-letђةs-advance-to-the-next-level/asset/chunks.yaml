    有很多用于描述性统计的统计分析函数。此外，它还提供了标准的工作表功能，使其适用于其他分析和数据处理任务，包括生成图形和其他演示格式。


    此表显示了 Excel 中可用的一些统计函数：


    | 函数名称 | 说明 |

    | --- | --- |

    | AVERAGE | 返回给定数字的算术平均值（平均数） |

    | CHISQ.DIST.RT | 返回卡方分布的右尾概率 |

    | CHISQ.TEST | 返回相关性卡方检验的 `p` 值 |

    | CONFIDENCE.T | 返回均值置信区误差范围 |

    | COUNT | 计数区域中包含数字的单元格个数 |

    | COUNTIF | 计数区域中满足给定条件的单元格个数 |

    | COUNTA | 计数区域中非空单元格个数 |

    | KURT | 返回数据集的峰度 |

    | MAX | 返回给定数字的最大值 |

    | MEDIAN | 返回给定数字的位数 |

    | MIN | 返回给定数字的最小值 |

    | MODE.SNGL | 返回给定数字的众数 |

    | PEARSON | 返回给定数字的众数 |

    | SKEW | 返回数据集的偏度 |

    | STDEV.P | 返回总体的标准差 |

    | STDEV.S | 返回样本的标准差 |

    | VAR.P | 返回总体的方差 |

    | VAR.S | 返回样本的方差 |


    SUMIF、AVERAGEIF、COUNTIF 函数位于“数学与三角”下。SUMIFS、AVERAGEIFS、COUNTIFS 函数是统计函数。


    ![](img/f11.jpg)


    ## 趋势测量


    在计算中心趋势时，分为两组：


    • 总体是一个包含所有数据的数据集。

    • 样本是一个较小的、易管理的部分。


    Excel 提供了两个版本来计算这些：

    SUMIFS、AVERAGEIFS、COUNTIFS 函数分别用于。


    ## 离散程度


    方差是数据集离散程度的衡量。标准差是衡量数据围绕平均值的分布程度。


    标准差函数：

    • `STDEV.P` 计算总体的标准差。

    • `STDEV.S` 计算样本的标准差。


    这两个函数的参数是：

    第一个参数指定用于计算的数值范围。


    方差函数：

    • `VAR.P` 计算总体的方差。

    • `VAR.S` 计算样本的方差。


    ![](img/f12.jpg)


    ## 相关性


    这量化了两个变量之间的因果关系，例如吸烟与癌症或学习时长与成绩之间的关系。


    相关系数可以在 −1 到 1 之间变化。关系越强，系数越接近 −1 或 1。`CORREL` 函数是“correlation coefficient”的缩写，有助于确定两个变量之间关系的强度。


    ## 频率


    频数分布是一个有意义的描述性工具，因为它确定了一组数字在数据集中出现的频率。`FREQUENCY` 函数确定数据集的频率分布。


    该函数的两个参数是：

    • `data_array`：包含正在评估出现频率的数值。

    • `bins_array`：指定数据计数分箱范围的数字范围。


    如公式栏所示，我们正在使用 C 列...第一四位数有 12 人，第二、第三四位数有 13 人。


    ![](img/f13.jpg)


    ## 加载分析工具包


    要启用分析工具包加载项，你需要：

    • 点击“文件”选项卡并点击“选项”。

    • 选择左侧的“加载项”。

    • 确保“管理”框中选择了“Excel 加载项”并点击“转”。

    • 勾选“分析工具包”复选框以选择它，并点击“确定”。


    可用函数有：


    | 函数名称 |  |

    | --- | --- |

    | ANOVA: Single Factor | 执行单因素方差分析 (ANOVA) |

    | Correlation | 创建相关矩阵，显示选 N 个案例中每对变量的皮尔逊相关系数 (*r*) |

    | Descriptive statistics | 计算变量的一系列单变量描述性统计，包括中心趋势、离散程度、偏度和峰度的量 |

    | Histogram | 为数据范围生成直方图（此函数还会生成基于直方图的数据表，并用于帕累托分析） |

    | *t*\-Test: Paired Two-Sample for Means | 执行 *t* 检验以比较配对样本的均值 |


