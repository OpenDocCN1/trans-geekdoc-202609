    the means of two independent samples, assuming equal variances |

    | `t`-Test: Paired Two-Sample Assuming Unequal Variances | Performs a `t`-test
    to compare the means of two independent samples, assuming unequal variances |


    ## Illustration


    The following example of applying the `Descriptive Statistics` function to generate
    a range of descriptive statistics for the variable `age` in the sample dataset
    illustrates their use:


    * Select `Data` > `Data Analysis` to open the `Data Analysis` menu dialog box.


    ### Data Analysis menu dialog box

    ![](OEBPS/images/f015-1.jpg)


    * Select the desired function, in this case `Descriptive Statistics`, which opens
    the relevant dialog box.

    * Enter the desired range in the `Input Range` box. The default setting is `New
    Worksheet Ply`, which creates a new worksheet for the output since most `ToolPak`
    outputs are quite large.

    * Select `Summary Statistics` to get descriptive statistics for your chosen data.
    You can also select an appropriate confidence interval for the mean if desired
    (the default is 95 percent).


    ### Descriptive Statistics dialog box

    ![](OEBPS/images/f016-1.jpg)


    * Click `OK`. The output will be shown in a new worksheet. Note that here the
    column widths have been adjusted to make it easier to read.


    ### Descriptive Statistics output for variable Age

    ![](OEBPS/images/f016-2.jpg)


    ## ANOVA


    `ANOVA` tests statistically whether samples of data were taken from the same population.
    In practical use, it can be used to accept or reject a hypothesis.


    For `ANOVA`, we have to use the `Analysis ToolPak`. Of the three types of `ANOVA`,
    we will create an `ANOVA` report using a single-factor `ANOVA` about a school
    system’s high school students.


    To use the `Analysis ToolPak` to create a single-factor `ANOVA` report:


    * On the `Data` tab in the `Analysis` group, click `Data Analysis` to display
    the `Data Analysis` dialog box.

    * Select `ANOVA: Single Factor` and click `OK`.

    * Click the `Input Range` selection box and select the range of data you want
    to analyze.

    * Select either `Grouped by Columns` or `Grouped By Rows` on the basis of your
    data layout.

    * Choose the default `Alpha 0.05` (meaning there is a 5 percent chance of rejecting
    the null hypothesis).

    * Select an output option and click `OK`.


    This slide shows the result of an `ANOVA` test, and the table shows how to interpret
    the results.

    ![](OEBPS/images/f017-1.jpg)


    ## Covariance


    `Covariance` is similar to correlation. It is a measure of how two sets of data
    vary simultaneously. In Excel, there are `COVARIANCE.P` and `COVARIANCE.S` functions
    that can calculate covariance, and there is also a covariance reporting feature
    included in the `Analysis ToolPak`.


    To create a covariance report:


    * On the `Data` tab in the `Analysis` group, click `Data Analysis` to display
    the `Data Analysis` dialog box.

    * Select `Covariance` and click `OK`.

    * Click the `Input Range` selection box, and select the range of the data you
    want to analyze.

    * Select `Grouped By Columns` or `Grouped By Rows` depending on the organization
    of the dataset.

    * If the first row contains labels, check the `Labels in the First Row` check
    box to select it.

    * Select an output option and click `OK`.


    In this example, we are hypothesizing that the more days of school missed by students,
    the lower the student’s `SAT` scores. We would expect a negative relationship,
    which is indicated in the results.

    ![](OEBPS/images/f018-1.jpg)


    ## Histogram


    A `histogram` is a visual display of tabulated frequencies. We can use the `Analysis
    ToolPak`. Creating a histogram is somewhat similar to using the `FREQUENCY` function
    in that it requires bins to tabulate the data and will return a frequency distribution
    table.


    To create a histogram:


    * On the `Data` tab in the `Analysis` group, click `Data Analysis` to display
    the `Data Analysis` dialog box.

    * Enter the `Input Range` in the `Input Range` box.

    * Enter the `Bin Range` in the `Bin Range` box.

    * Click the `Labels` box.

    * Select the output options of your choice.

    * Select an output option and click `OK`.


    The following is the frequency distribution table from which the histogram is
    created.

    ![](OEBPS/images/f019-1.jpg)


