  [⁴⁵]: section19.xhtml#ftn.252\n[⁴⁶]: section19.xhtml#ftn.253\n[⁴⁷]: section19.xhtml#ftn.254\n\
  [⁴⁸]: section19.xhtml#ftn.255\n[⁴⁹]: section19.xhtml#ftn.256\n[⁵⁰]: section19.xhtml#ftn.257\n\
  [⁵¹]: section19.xhtml#ftn.258\n[⁵²]: section19.xhtml#ftn.259\n\n\n\n\n\n##### 处罚\n\
  \n###### BIPA\nBIPA 法定授权的最低处罚范围为：每次过失违规 `$1,000`，每次故意违规 `$5,000`。[⁵⁵] 对于过失违规和故意违规两种情况，BIPA\
  \ 还允许以实际损害赔偿替代法定最低额，并以两者中较高者为准。此外，胜诉方有权获得律师费。伊利诺伊州法院将每一次单独的生物识别数据泄露均解释为违反 BIPA 的行为。[⁵⁶]\n\
  \n###### 德克萨斯州\n在德克萨斯州法律规定的处罚比 BIPA 更严厉的为数不多的情况下，德克萨斯州法规授权每次违规处罚高达 `$25,000`。[⁵⁷]\n\
  \n###### 华盛顿州\n最后，华盛顿州法律规定，违反其生物识别隐私法的行为可“处以不超过五十万美元的民事罚款”。[⁵⁸]\n\n#### IV. 结束语\n\
  \n在本章中，我们探讨了侧重于保护信息免遭滥用的隐私法律。目前，这些问题主要由州法律而非联邦法律来解决。这增加了这些领域实务操作的复杂性，法律界将从标准化中受益。在此期间，律师精通技术变得更加必要。数据安全是执业律师的道德关切，而证据问题日益电子化。法律职业必须有目的地演进以适应新的技术环境，这一点至关重要，因为法律职业的核心在于信息。\n\
