  \n\n\n\n\n##### 现代计算与通信技术的创新\n\n现代计算和通信技术的创新始于二十世纪中叶。许多与计算机和安全相关的重要要素是在第二次世界大战期间开发的。例如，盟军招募了破译德军用于加密通讯的“恩尼格玛”密码的数学家，这促进了密码学的进步。战后，计算机技术创新的重点除了军事用途外，还开始转向私营部门用途。早期的计算机可能占据整个房间。Intel\
  \ 于 1971 年推出了首款商用微处理器，随着计算机体积缩小，个人计算市场随之增长。\n\n与此同时，研究人员正在开发互联网，其功能的首次重大演示发生在 1977\
  \ 年。在互联网研究开始之前，计算机并非设计用于与其他计算机互联。为了实现全球计算机网络，早期的互联网研究人员必须对相关技术进行标准化。他们通过创建 `IP`\
  \ 和 `TCP` 等协议来实现这一点，这些协议允许计算机相互通信。`IP` 代表 Internet Protocol（互联网协议），`TCP` 代表 Transmission\
  \ Control Protocol（传输控制协议）。`IP` 专注于将数据包从 A 点传输到 B 点，而 `TCP` 保护数据包的完整性，确保数据包离开 A\
  \ 点时的状态完好无损地到达 B 点。1\n\n##### 计算机指令与软件\n\n计算机根据操作员的输入执行任务。为了简化用户操作，计算机程序员编写供用户用于特定任务的指令。这些指令最终必须采用机器语言，它完全由数字组成，大多数人类无法阅读。高级编程语言（如\
  \ `C#`）允许程序员用类似人类语言的方式编写指令，然后将其编译为机器语言并由计算机执行。这包指令通常被称为软件。\n\n随着现代生活对软件功能需求的增加，软件变得更加复杂。一些互联网政策评论员建议通过激励软件程序员发布更安全的代码来解决信息安全问题。然而，没有任何激励措施能完全消除软件漏洞。安全漏洞并非代码编写水平差的标志。复杂的软件包本身就必须包含大量计算机指令，这创造了太多出错的机会。在批评程序员的软件缺陷之前，律师最好回想一下，通读一份\
  \ 10,000 字的法律备忘录或合同以查找任何笔误是多么费力。一个相对简单的移动应用程序可能包含 10,000 行代码，而 2011 版 Android 操作系统拥有超过\
  \ 100 万行代码。软件功能越多，代码就越复杂。运行 CERN 的大型强子对撞机需要 5,000 万行代码，而 Facebook 依赖超过 6,000 万行代码。想象一下检查那么多代码的笔误。\n\
  \n软件无处不在，包括你的汽车。现代高端汽车可能依赖包含 1 亿行代码的软件。如此庞大的代码量可能隐藏规避法规的功能。大众汽车于 2015 年 9 月陷入丑闻，原因是曝光其数百万辆柴油车包含旨在伪造排放测试结果的软件。\n\
  \n软件中的 Bug 是大多数网络安全威胁的基础。软件缺陷是许多入侵事件的潜在因素，因为这些缺陷往往使外部入侵成为可能。但正如我们的示例故事所示，这些入侵中的许多（如果不是大多数）实际上可能是软件缺陷和人为错误的结合。“黑帽”黑客\
  \ Brian 的攻击之所以得逞，是因为 Retailco 的粗心员工 Andrew 点击了钓鱼邮件中的链接。部分责任也在于 Retailco 的系统管理员，未能用\
  \ Compbiz 的新版本产品更新系统。Compbiz 发布有缺陷的软件可能也有过错，但其责任可能受到限制。最终用户许可协议（EULA）中的合同条款通常保护软件制造商免于因安全缺陷承担责任。\n\
  \n卡内基梅隆大学的研究人员估计，美国开发的平均软件每百万行代码有 6,000 个软件缺陷，其中 1% 到 5% 是安全漏洞。即使是卓越的软件，每百万行代码也可能有几百个缺陷。2\
  \ 如果即使只有 10% 的安全漏洞具有关键安全影响，拥有 4,000 万行代码的 Windows 7 等软件包仍可能有数十个关键安全漏洞和数百个非关键安全缺陷。由于流行消费产品依赖数千万行代码，安全缺陷的危险无处不在。在我们的例子中，Andrew\
  \ 可能本不该点击可疑邮件中的链接，但木已成舟。Retailco 现在能做的只是设法控制损失。\n\n# 黑客攻击\n\n网络安全和技术领域有许多读者可能不熟悉的流行词汇。在本节中，我们将提供有关这些术语及相关黑客活动的背景知识。\n\
  \n首先要解释的流行词是“黑客攻击”。基本上，黑客攻击包括以一种旨在让行为者实现工具预期用途之外功能的方式使用工具。在最良性的情况下，黑客攻击是一种独创性的练习，可以带来新的和更好的结果，正如网上许多“生活窍门”视频和帖子所证明的那样。但既然我们关注的是网络安全背景，良性黑客攻击在我们的讨论中将较少涉及。\n\
  \n“社会工程学”是一个用于特定语境下欺骗行为的术语。在信息安全中，社会工程学通常是黑客攻击的早期阶段，攻击者说服守门人提供访问权限。但社会工程学也可以是整个骗局。例如，黑市上存在承诺客户昂贵在线购物退款的服务。计划通常是受雇人员说服客服代表物品未收到。客户支付给该人一笔固定费用或购买价格的一定比例，如果成功，原购买价格将被退还，客户以大幅折扣获得昂贵产品。此类退款服务可在在线黑市论坛上找到。许多论坛位于网络的未索引区域。这些区域统称为“深网”，而提供非法服务的网站通常被视为“暗网”的一部分。\n\
  \n零日漏洞和利用代码，通常简称为“零日”，是一种极具价值的软件漏洞类型。零日漏洞在被破坏性利用之前，软件制造商并不知情。当此类漏洞被武器化时，可能被称为零日利用代码。第一个主要网络武器“震网”使用了四个零日利用代码。零日在合法性各异的市场上频繁买卖。\n\
  \n\n\n\n\n计算机黑客攻击遵循一种可预测的模式。系统漏洞被识别、分析并加以利用。在我们的示例故事中，George 和 Brian 都是自由职业黑客，他们识别出了同一个漏洞。然而，Brian\
  \ 来自“黑帽”阵营，想利用该信息谋取私利，而 George 更倾向于白帽或灰帽阵营，其最终目标是带来安全改进。由于 Brian 利用的漏洞在被利用前已为人所知并已修补，因此不应将其称为零日漏洞。尽管如此，媒体报道往往过度使用该术语，令许多安全专业人士懊恼不已，他们也常因“cyber”被用作名词而感到尴尬。\n\
  \n漏洞知识既可用于修复系统，也可用于利用系统，两者易如反掌。漏洞知识的这种双重用途性质造成了一个重大的网络安全政策问题。假设安全利用是一种社会祸害，那么鼓励善意研究以发现和修复软件漏洞符合社会利益。政策应如何在鼓励\
  \ George 的同时遏制 Brian？惩罚性网络犯罪法律的一个危险在于，此类法律对威慑良性黑客攻击的效果，可能比对威慑恶意黑客攻击更有效。与故意寻求破坏法律的黑客相比，怀有善意的黑客更有可能被将其行为定为非法的法律所威慑。\n\
  \n## a.网络攻击\n\n在现代词汇中，所有类型的计算机入侵通常都被称为“网络攻击”，但该领域的许多专业人士和评论员会断言，不加区分地使用“网络攻击”一词是不正确的。美国国家研究委员会\
  \ 2009 年关于网络攻击能力的报告（“NRC 报告”）将网络攻击定义为“采取蓄意行动——可能持续一段较长时间——以改变、中断、欺骗、降级或破坏对手的计算机系统或网络，或驻留在或传输通过这些系统或网络中的信息和/或程序。”3\
  \ 网络攻击也可被视为针对网络上组件或设备的完整性、真实性和可用性的行动。4 组织信息安全实践通常强调类似的 CIA 三要素：机密性、完整性和可用性。\n\n\
  2009 年 NRC 抄报告区分了网络攻击和网络利用：网络攻击具有破坏性，而网络利用是提取机密信息的非破坏性行动。然而，很难区分网络攻击和网络利用，因为两者使用相似的技术，主要区别在于二者的目标。例如，网络攻击者的目标可能是销毁信息，而利用者的目标只是复制信息或观察网络活动。Duqu\
  \ 是一种与 Stuxnet 有一些相似之处的网络利用工具，它演示了这两个概念的重叠。赛门铁克的研究人员推测，Duqu 的目的是为未来的攻击收集信息。5 另一种说法是，网络攻击和网络利用均可称为网络入侵。我们将主要把网络安全事件统称为网络攻击或网络事件。\n\
  \n网络安全领域的另一个常用术语是“高级持续性威胁”。APT 通常针对特定目标。APT 一般涉及恶意软件和外部命令与控制能力，以使外部攻击者能持续访问受感染系统。APT\
  \ 的诱人目标包括政府系统、大学和关键基础设施。\n\n### i.关键基础设施面临的风险\n\n关键基础设施系统连接着日常生活的许多基础要素，因此这些系统中的漏洞可能造成全社会范围的风险。大多数关键基础设施由私营部门拥有和运营，因此安全实践可能存在显著差异。2012\
  \ 年，据报道攻击者攻破了 Telvent，该公司为石油和天然气管道运营商提供信息技术服务。6 Telvent 的入侵者可能窃取了敏感信息，如北美和南美石油天然气管道的蓝图和远程访问代码。\n\
  \n网络威胁也危及经济基础设施。华尔街的金融行为体经常成为分布式拒绝服务（DDoS）攻击的目标。黑客还攻破了经纪账户，实施“入侵、拉升、抛售”骗局以操纵垃圾股价格。2013\
  \ 年，黑客攻破了美联社的 Twitter 账户，发布了一条关于白宫发生爆炸的虚假推文，导致标普 500 指数在短短几秒内价值下跌了近一个百分点。叙利亚电子军承认对该攻击负责。\n\
  \n互联网底层的关键信息基础设施是攻击者的另一个诱人目标。赛门铁克的一项调查显示，2010 年，约有一半的关键信息基础设施提供商受到了政治动机网络攻击的影响。7\
  \ 2015 年 12 月，媒体报道称，未知黑客试图通过针对关键服务器发动 DDoS 攻击来关闭整个互联网。2016 年 10 月，未知黑客或黑客组织成功关闭了主要域名服务器（DNS）基础设施提供商\
  \ Dyn 的服务器。对 Dyn 的攻击利用了一个大型僵尸网络的一部分，该网络由数百万台联网设备组成，包括闭路电视摄像头和数字视频录像机。一些对信息基础设施的威胁是物理层面的，例如加利福尼亚州反复发生的破坏者切断光纤电缆事件。无论是物理还是数字威胁，关键信息基础设施中的漏洞都可能因民用和军用网络的重叠而具有国家安全影响。\n\
  \n随着物联网日益普及，家用电器纷纷联网，通常缺乏强有力的安全防护，在许多情况下甚至完全没有安全措施。2015 年和 2016 年针对乌克兰电网的攻击使用了针对关键基础设施的恶意软件，但智能设备可能提供另一种破坏电力供应的途径。研究人员警告称，最终，攻破大量“智能”大型家用电器（如空调和热水器）的黑客可能会导致电力消耗激增，从而引发大面积停电。8\n\
  \n## b.威胁类别\n\n要了解网络安全威胁的范围，还应基本了解攻击方法。网络威胁有三大类：恶意软件（如病毒、特洛伊木马和蠕虫）、个人未经授权的远程入侵，以及拒绝服务（DoS）攻击。这些类别之间的界限并不总是清晰的。SQL\
  \ 注入的某些方面（我们将在本章后面探讨）类似于未经授权的远程入侵，因为这种方法允许攻击者对数据库执行他们本不该执行的操作。当创建了一个利用 SQL 漏洞的工具时，它也属于恶意软件类别。\n\
  \n\n\n\n\n###### 恶意软件\n\n恶意软件也称为恶意代码，形式多种多样，包括特洛伊木马和 Rootkit。**特洛伊木马**是一段看似合法但具有有害影响的软件，其潜在危害可能包括允许恶意用户获得系统的后门访问权限。赛门铁克针对\
  \ Windows 机器将“Rootkit”定义为：“利用系统挂钩或修改来隐藏文件、进程、注册表项和其他对象，以隐藏程序和行为的程序。”9 简单来说，Windows\
  \ 机器上的 Rootkit 可以让攻击者在被发现前造成更大的破坏。Rootkit 还被用于赋予攻击者提升的授权级别。Stuxnet 蠕虫包含一个 Rootkit，被认为是首个已知影响工业控制系统的\
  \ Rootkit。\n\n####### i. 僵尸网络\n\n某些恶意软件并非旨在危害目标，而是将该计算机作为工具用于攻击其他目标。当计算机以这种方式被控制时，有时被称为**僵尸系统**。僵尸化恶意软件可用于控制未受保护（或保护不足）的计算机，使其成为同一个“僵尸群”或**僵尸网络**中的成千上万台计算机之一。僵尸网络可定义为“通常被编程用于执行某些重复性任务、处于单一控制机制下的计算机网络。”10\
  \ 僵尸网络主控者随后可利用僵尸网络发送海量垃圾邮件，或指令僵尸网络向组织网站发送海量数据和请求，发起**分布式拒绝服务（DDoS）**攻击。\n\n旨在“僵尸化”系统的病毒可能利用**零日漏洞**来攻陷大量系统，但非零日漏洞同样可能奏效。零日漏洞的广泛有效性通常不是构建僵尸网络的必要条件。要构建僵尸网络，黑客只需使用一种足够多计算机都易受攻击的攻击方法。\n\
  \n####### ii. 拒绝服务攻击\n\n另一类攻击是**拒绝服务（DoS）**攻击。DoS 攻击由攻击者发起，通过向目标计算机系统发送海量数据和请求，使目标无法正常运行。DoS\
  \ 攻击是一种需要随时间进行多次攻击的网络行动示例，因为一旦攻击停止，目标系统将会恢复。CERT 将 DoS 攻击定义为旨在“阻止服务的合法用户使用该服务”的攻击。11\n\
  \n随着网络容量的增长，攻击者放大了攻击规模。**分布式拒绝服务（DDoS）**攻击是来自大量计算机的同时发起的 DoS 攻击。有了 DDoS 攻击，防御者更难阻断导致系统崩溃的“噪音”源头。DDoS\
  \ 攻击之所以仍是严重威胁，部分原因在于当前技术市场上涌入了大量联网设备，且许多设备在设计时未考虑安全性。例如被 **Mirai 僵尸网络** 操控的摄像头和\
  \ DVR，该僵尸网络是针对 Dyn 发动 DDoS 攻击的工具。联网闭路电视摄像头让人们能通过智能手机随时随地查看家庭情况，但这种连接性也导致部分摄像头被攻陷。从摄像头到计步器和冰箱，市场推出了许多新型联网设备。若缺乏安全关注，这些设备往往易被攻陷并被用于向目标发送数据噪音，导致其系统崩溃。\n\
  \n但有时，系统崩溃可能是因为过多合法用户同时尝试访问。联邦**计算机欺诈和滥用法案（CFAA）**涉及的一个案例就考虑了这一问题。在 *Pulte Homes,\
  \ Inc. v. Laborers’ Intern. Union of North America* 一案中，一个工会发起运动鼓励人们就劳工问题联系一家建筑商。12\
  \ 该运动非常成功，随着联系请求涌入，电话线和传真线被占满。由于难以区分大量合法请求和 DDoS 攻击，因此很难有效将 DDoS 攻击定罪。在 *Pulte*\
  \ 案中，法院裁定该洪水般的联系尝试构成了 CFAA 下一项主张所指的传输行为，但驳回了 Pulte 关于狂轰滥炸的电话和电子邮件构成未经授权访问的论点。\n\n\
  DDoS 攻击难以防御，还可能压垮被动防御措施，使系统更容易遭受其他攻击。这些攻击对企业也造成高昂成本。网站安全公司 Incapsula 通过调查收集数据，于\
  \ 2014 年发布报告估计 DDoS 攻击每小时给企业造成约 40,000 美元的损失。人们高度担忧攻击者可能针对关键基础设施（如医院和国防设施）发动 DDoS\
  \ 攻击。2016 年，攻击者通过让一家主要 **DNS** 基础设施提供商下线，成功中断了美国数百万用户的互联网接入。使用 **Dyn** 域名系统的网站（包括\
  \ **Twitter** 和 **Reddit** 等知名服务）突然无法访问。攻击手段是利用 **Mirai 僵尸网络** 发动的 DDoS 攻击，该网络允许约\
  \ 100,000 个物联网设备被用作针对该提供商的大规模武器。\n\nDDoS 攻击历来依赖僵尸网络，但近期发展表明并非总是如此。2018 年 2 月 28\
  \ 日，热门开发者平台 **GitHub** 遭遇了一场高达 1.35 Tbps 的天文数字级 DDoS 攻击，打破了此前针对 Dyn 攻击时创下的 1.2 Tbps\
  \ 纪录。GitHub 使用可缓解 DDoS 攻击的安全产品，攻击在约二十分钟内结束。这是一场利用 **memcached 服务器** 的**放大攻击**，memcached\
  \ 服务器是一种提高网络和网站访问速度的互联网功能。攻击 GitHub 时，攻击者伪造受害者的 IP 地址并向 memcached 服务器发送请求，导致服务器响应的数据量是攻击者从伪造\
  \ IP 地址原始发送量的五十倍。\n\nDDoS 攻击也作为一种服务提供，让技术不精的人也能付费针对选定目标发动攻击。2018 年，一个国际执法团队关闭了 **Webstresser.org**，该网站被认为当时是互联网上最大的\
  \ DDoS 租赁网站。\n\n###### c. 黑客技术\n\n软件产品固有缺陷，其中一些是安全漏洞。要利用安全漏洞，黑客会识别代码中允许外部人员对系统施加一定控制的脆弱点。该点有时被称为“**攻击向量**”，因为它是黑客获取系统未经授权访问权限的路径。\n\
  \n过去几年中，许多针对私营公司的公开攻击都涉及“**SQL 注入**”，这是一种非常流行且有效的黑客手段，尤其是在目标为窃取信息时。**SQL** 代表“结构化查询语言”，这是一种常用于管理大型数据库的编码语言。如果用户有机会输入数据，导致系统执行比预期输入更多的命令或产生更多信息，代码就可能容易受到\
  \ SQL 注入攻击。SQL 注入本质上是通过使用相似语法打断预写命令并插入新命令。\n\n\n\n\n\n###### 一个过度简化的解释可以帮助读者形象地理解这一点。\n\
  \n想象一下，你有一个带有表单的网站。表单允许网站收集访问者的反馈，但也是一个臭名昭著的脆弱功能。计算机必须执行网站的代码。如果黑客知道网站是如何编码的，他们有时可以利用\
  \ Web 表单欺骗计算机，使其认为用户输入已结束，然后插入一条新命令，该命令将在表单提交时执行。所以假设你有一个如下所示的字段：\n\n![](img/Image_6.jpg)\n\
  \n想要破坏网站的人可能会对网站代码的编写方式做出一些合理的猜测。如果他们能用计算机在执行网站代码时所期望的相同语法输入正确的命令，计算机可能会转而执行入侵者要求的任何操作。而现在，潜在的黑客输入了以下内容：\n\
  \n![](img/Image_7.jpg)\n\n如果语法正确，且右括号、引号和分号被视为表单输入的结束，这将告诉计算机 Name 字段中的输入是“Pat”。然后计算机将继续执行后续命令。“Drop\
  \ table”是删除数据库一部分的命令。在这里，如果数据库中有一个名为“index”的部分，该数据表将被删除。或者，使用这种方法的攻击者可能会插入一条导致计算机显示数据库内容的命令，从而窃取数据。\n\
  \n其他可能的漏洞包括权限设置中的 Bug、缓冲区溢出 Bug 和内核缺陷。缓冲区溢出 Bug 是恶意软件非常常见的攻击目标，部分原因在于其熟悉度和可预测性。它们在功能上类似于\
  \ SQL 注入。软件通常会为用户输入分配一段固定的空间，即缓冲区。如果提供的输入不适合分配的缓冲区，缓冲区可能会像堵塞的水槽一样溢出。黑客可能会在溢出部分包含新语句，导致其他事情发生。影响\
  \ OpenSSL 加密软件的 Heartbleed（心脏出血）漏洞就是此类 Bug 的一种变体，因为它允许攻击者利用缓冲区限制问题查看受保护的数据。与 SQL\
  \ 注入一样，这些攻击向量的主要吸引力在于它们能让入侵者访问非公开信息。在我们的故事中，Compbiz 产品中的安全缺陷允许未经授权访问数据库。因此，缓冲区溢出利用或\
  \ SQL 注入很可能是 Brian 恶意软件的嫌疑对象。\n\n发现漏洞（如上述的 SQL 注入或缓冲区溢出机会）只是第一步。当有人投入时间和精力将漏洞武器化，从而创建出利用代码时，软件漏洞才变得危险。利用代码随后可被恶意使用，也可用于和平研究。此外，利用代码可能只是给计算机所有者带来麻烦，因为它们导致受感染机器运行变慢；也可能具有破坏性，导致重要文件损坏或删除。与破坏性利用代码相比，安全消费者可能对麻烦型利用代码的反应更加矛盾，尽管如果计算机运行受损是因为它已成为僵尸网络的一部分，麻烦型利用代码的社会成本可能是一样的。\n\
  \n在确定安全缺陷后，黑客可能会编写一个工具来利用该漏洞，或许将其作为用户想要安装的东西的“特洛伊木马”附件。一旦编写了该工具，目的就是让某人在黑客想要攻陷的系统上安装该工具。传统上，这需要目标实际打开一个可执行文件；但黑客也成功地将恶意软件嵌入文字处理文件和\
  \ PDF 文件中。13 此外，恶意黑客可以感染那些并非有意安装任何东西的网站访问者。例如，他们可能利用网站编码将一个恶意网站嵌入到访问者打算访问的网站中，从而传播特洛伊木马。14\
  \ 我们故事中的黑帽黑客 Brian 利用一个恶意网站访问了 Retailco 保护不力的系统。\n\n最近引起广泛关注的一种特定攻击类型是勒索软件。勒索软件是一种恶意软件威胁，对律师事务所可能造成毁灭性打击。当计算机感染勒索软件时，恶意软件会加密计算机上的所有文件。然后勒索软件会向用户显示一条消息，指示他们在特定时间限制内（通常仅几天）支付赎金，否则解密密钥将被销毁，数据将永远无法访问。虽然存在一些潜在的技术解决方案，但如果公司不持续备份必要文件，支付赎金的诱惑可能非常大。FBI\
  \ 甚至在受害者是否应直接支付赎金的问题上表现出了一些矛盾态度。\n\n勒索软件通常通过网络钓鱼邮件中的恶意链接传播，这与我们故事中 Brian 的技术非常相似，只不过\
  \ Brian 的目标是窃取信息，而不是破坏网络的可访问性。医院已成为勒索软件极具吸引力的目标，因为获取患者档案中最新、最准确的信息可能关乎生死。对于许多其他需要立即访问数字存储信息的职业来说，勒索软件也是一种威胁。2017\
  \ 年，一家律师事务所起诉其保险提供商，辩称该提供商在事务所计算机感染勒索软件且存储数据无法访问长达三个月时，拒绝提供业务中断保险赔偿，违反了合同义务。15\n\
  \n加密货币挖矿恶意软件是另一种日益增长的网络安全威胁，尽管其对受感染系统的影响可能不如勒索软件严重。此类恶意软件不加密数据，而是重新分配计算机资源，代表某个中心操作员“挖掘”加密货币，从而直接为该操作员创造利润。\n\
  \n###### d. 技术黑客攻击加人为错误\n\n针对机构的黑客通常需要凭证才能获得访问权限。获取此信息的方法有很多，但其中最有效的可以说是网络钓鱼，它主要利用另一种类型的漏洞——人为操作员。网络钓鱼骗局长期以来一直是获取访问权限的有效途径，这些骗局造成的后果对受害者来说可能代价高昂。\n\
  \nFBI 追踪一种特定类型的网络钓鱼骗局，通常称为商业电子邮件入侵（BEC）骗局或 CEO 冒充骗局，自 2013 年 FBI 开始追踪此类骗局以来，已造成公司至少\
  \ 30 亿美元的损失。16 BEC 骗局通常涉及犯罪分子伪造实际高管或实际业务合作伙伴的身份，然后诱骗受害者将大笔资金汇入某个银行账户。此类骗局通常具有很强的针对性，但也存在更通用的网络钓鱼攻击方法，试图感染计算机恶意软件或获取访问凭证。当一名公司员工成为涉及恶意软件的网络钓鱼攻击的受害者时，这会使其他公司计算机面临风险。即使黑客仅获得了该员工的凭证，这仍可能足以促成大规模客户信息或知识产权窃取。\n\
  \n#### IV. 安全的法律与经济学\n\n\n\n\n\n##### 网络安全中的外部性问题\n\n与安全缺陷的斗争受困于外部性问题。Anderson 和\
  \ Moore 敏锐地观察到：“当守护系统的人不是系统失效时受损的人时，系统特别容易失效。”17 单台受感染的计算机可能只会给其用户带来不便，但作为僵尸网络一部分所能造成的总体危害，并非该用户必须承担的成本。这属于外部性。如果用户修复问题所承担的成本大于其预期因攻击遭受的损失，那么激励安全投资将变得更加困难。\n\
  \n部分由于潜在成本的存在，面对安全威胁的不作为并不总是源于无知。Workman 2008 年的研究发现，公众了解安全威胁及应对措施，但往往不使用免费的对抗措施。18\
  \ 他们可能转而依赖他人的投资。之所以可能，是因为与网络安全相关的风险和收益都是共享的，这可能限制了用户单方面投资的激励。这造成了“搭便车”问题，即社区成员个人不担心安全，因为他们确信其他人正在处理。\n\
  \n因此，网络安全的社会危害是个人用户不承担的外部性，个人用户体验到的危害有限。个人用户所经历的有限危害，反过来又是软件供应商不承担的外部性。在软件开发过程中，有人认为供应商倾向于更关注功能而非安全。19\
  \ 这可能是因为消费者往往对功能比对安全更了解。当信息不对称导致所售商品质量下降时，可能会形成“柠檬市场”。如果消费者不要求安全的软件，开发商投资安全功能的激励就会减弱，从而可能导致安全领域的“柠檬市场”。\n\
  \n黑客自身也可被视为经济行为体。正如我们的示例故事所示，黑客行为的道德和伦理各不相同。Wilma 代表白帽子身份。她为 Securesoft 工作，研究新兴网络安全威胁，以更好地服务\
  \ Securesoft 的客户。自由职业的灰帽子黑客 George 对识别和演示漏洞感兴趣，他发现了一个可实现数据库利用的缺陷。黑帽子黑客 Brian 为自身利益和盈利动机行事。\n\
  \n最优秀的黑客通常受金钱或声望驱动去创新，这与驱动其他任何职业人士的动机相同。年度 Pwn2Own 黑客大赛吸引全球人才，承诺提供经济激励和极大的炫耀权利。私营部门之外也有竞赛。为发掘顶尖人才，中国政府举办自己的区域性黑客大赛。黑客攻击是一个拥有自身经济体系的产业，黑客通常是理性的市场行为体。如果能将知识变现，他们中的许多人就会这么做。\n\
  \n网络安全知识有多种变现途径。世界各地的知名公司都提供漏洞赏金计划，奖励在其产品中发现安全漏洞的研究人员。公司通常会宣布计划并提供指南，提交的漏洞会被修复，发现者会获得报酬。\n\
  \n漏洞赏金计划并不总能按预期工作。2016 年，网约车公司 Uber 被一名黑客联系，该黑客闯入 Uber 计算机系统并窃取大量用户信息。据报道，该黑客在 Github\
  \ 上存储的一个文件中找到了一个密码，该密码允许访问 Uber 远程服务器上的备份文件。Github 是一个软件开发人员分享代码的热门网站。获取数据的黑客勒索赎金以换取被盗数据。Uber\
  \ 员工没有向警方报告勒索要求，也没有向任何人报告数据泄露，而是将黑客的要求通过漏洞赏金计划处理，并支付了黑客费用，条件是删除数据。\n\n除了漏洞赏金，还有其他变现漏洞信息的方式。在所谓的灰色市场中，Zerodium\
  \ 等公司为零日漏洞利用代码支付巨额资金。与漏洞赏金不同，灰色市场的买家通常不利用这些知识修复底层漏洞，而是可能将这些漏洞利用代码提供给政府购买。政府囤积零日漏洞目前是法律和政策领域的一个空白地带，私营部门许多人对此做法深感担忧。2016\
  \ 年，一个名为 Shadow Brokers 的组织宣布，他们从国家安全局（NSA）窃取了大量零日漏洞利用代码。2017 年，毁灭性的 WannaCry 攻击利用\
  \ NSA 开发并由 Shadow Brokers 泄露的 EternalBlue 漏洞利用代码，引发全球性勒索软件攻击，造成大规模破坏。\n\n正如存在帮助向政府提供安全漏洞知识的灰色市场，也存在旨在向其他愿意付费的买家提供此类服务的黑色市场。漏洞信息（尤其是零日漏洞利用代码）的黑色市场通常隐藏在暗网论坛中，只能通过高度安全的网络浏览方式访问，卖家以加密货币收款。\n\
