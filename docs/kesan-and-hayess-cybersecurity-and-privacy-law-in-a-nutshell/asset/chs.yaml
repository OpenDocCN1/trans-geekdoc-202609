  \ 28 J. Marshall J. Computer & Info. L. 451, 481 (2011).\n\n## 第 3 章 应对网络威胁\n\n\
  好吧，网络威胁是个大问题。我们能做些什么？从大的方面来看，网络防御的方法可以用“三个 D”来分类：**防御**、**威慑**、**缓和**。\n\n**防御**意味着拥有阻止攻击尝试的手段，例如通过防火墙和杀毒产品。**威慑**主要从攻击者的角度来考虑。什么能让他们相信风险不足以证明其潜在回报的合理性？威慑可以通过惩罚攻击者来实现，但**拒止式威慑**也是可能的。**缓和**旨在确保系统具有弹性，并能从事件中迅速恢复。\n\
  \n有许多技术可以改善防御，从上述的防火墙和杀毒产品到入侵检测系统、溯源方法，以及旨在引诱攻击者以了解更多关于他们及其方法信息的**蜜罐**。法律发展也可能包括对安全实践的要求。例如，罗德岛州要求处理州居民个人信息的实体建立基于风险的信息安全计划。1\n\
  \n威慑归根结底是要阻止恶意行为者。在冷战期间，**相互保证毁灭**是防止核打击的主要威慑力量。刑法和国际网络犯罪条约在惩罚性威慑范式下提供了一定的潜在威慑效果。强大的防御技术可以支持拒止式威慑。\n\
  \n缓和是关于恢复常态。专注于提高弹性的缓和策略可以包括演练，以使员工为网络安全事件做好准备。审计可以通过识别组织问题和量化可用资源来提高弹性。\n\n在这三者中，威慑可能是最复杂的。网络犯罪给执法带来了新挑战，犯罪者只不过是影子，因为很难将特定个人在攻击发生时与特定计算机联系起来。\n\
  \n近年来，打击网络犯罪取得了许多进展。一个常用的工具是**网站关停**。调查人员已经关停了许多用于协调非法活动的网站。在 2018 年 4 月域名被欧洲刑警组织查获之前，**Webstresser.org**被认为是互联网上最大的\
  \ DDoS 租赁网站。2018 年 2 月，司法部宣布起诉对**InFraud**负责的个人，InFraud 是一个处理欺诈性财务信息的热门互联网论坛。InFraud\
  \ 网站也被当局关闭。InFraud 专注于**盗刷**，并围绕一个大型讨论论坛进行组织。2 盗刷通常涉及使用被盗凭证实施的金融欺诈。对 InFraud 的起诉或许是根据《受勒索影响和腐败组织法》（RICO）将在线讨论论坛归类为犯罪组织的首个主要案例。\n\
  \n在许多情况下，确立网站的法律责任很困难。根据《通信 decency 法案》（CDA）第 230 条，网站所有者不对其用户撰写的内容负责。第 230(c)(1)条规定：“不得将交互式计算机服务的提供者或用户视为任何由其他信息内容提供者提供的信息的发布者或发言人。”\
  \ 该条款被解释为：只要网站所有者不协助开发非法内容，即赋予其广泛的免责豁免权。3 第九巡回法院在一个案件中认定不适用 CDA 豁免权，该网站向用户提出一系列问题，这些问题可用于筛选潜在室友匹配，因为这些问题“实质性地促成了指控行为的非法性”。4\
  \ 该案涉及**Roommates.com**网站，法院得出结论：在提出额外问题时，该网站充当了信息内容提供者，而非交互式计算机服务。\n\n2018 年，国会通过了**FOSTA-SESTA**法案包，旨在打击网络性贩运。FOSTA-SESTA\
  \ 在美国法典第 117 章中增加了第 2421A 条。新第 2421A 条通过宣布网站发布者对第三方卖淫广告负责，为第 230 条豁免权创造了一个例外。根据第\
  \ 2421A 条，如果交互式计算机服务“意图促进或便利他人卖淫”而运营，将承担刑事责任。国会通过 FOSTA-SESTA 是因为法律中存在一个被感知的漏洞，阻碍了允许成人服务广告的网站所有者被起诉。FOSTA-SESTA\
  \ 的具体目标是**Backpage**，一个成功的分类广告服务，其许多客户是性工作者。司法部在 FOSTA-SESTA 通过后不久、法律生效前设法查封了 Backpage.com，令媒体感到意外，导致一些人质疑新法律是否必要。因此，责任的“大棒”已在多种情境下被用于威慑特定的在线行为。通过关闭网站和查封资源，执法部门希望威慑此类在线活动。\n\
  \n政策制定者通常通过加重刑罚来应对犯罪率上升，但研究表明，加重刑罚对实际减少犯罪作用甚微。5 相反，可能发生的是，加重惩罚仅仅增加了 Herbert Packer\
  \ 教授所谓的“犯罪价码”，这使得犯罪分子因被抓获的风险而能为其非法服务收取更高费用。6\n\n\n\n\n\n### 网络安全威慑与法律框架\n\n关于反向黑客攻击（hacking\
  \ back）对黑客的潜在威慑价值也存在一些理论，但在线自卫充其量只是一个法律灰色地带。拒绝式威慑在法律上是合规的，但它依赖于对强安全实践的持续应用。虽然攻击者可能因徒劳无功而不敢以防护完善的公司为目标，但除非所有潜在目标都受到同等程度的保护，否则攻击者只需继续寻找薄弱环节即可。\n\
  \n这并非意味着任何防御尝试都将徒劳无功。有许多安全公司可就网络安全实践提供咨询。执法机构跨国合作以应对网络犯罪威胁，从而实现更有效的威慑。\n\n一些行业也在数据安全事务上实施自我监管。支付卡行业制定了称为\
  \ `PCI-DSS` 的数据安全标准，商家必须遵守这些条款才能在其经营场所接受信用卡支付。二十多年来，`TrustArc`（前身为 `TRUSTe`）一直为网站提供认证，以表明其负责任的数据隐私实践。然而，2014\
  \ 年，`FTC` 认定 `TRUSTe` 未能按承诺进行年度重新认证，在 2006 年至 2013 年间共有 1,000 多起此类事件。7\n\n有人呼吁建立公私合作伙伴关系以改善网络安全，认为政府与私营部门的合作能使各方了解新兴趋势。有兴趣了解特定行业此类合作的律师可寻找相关的信息共享与分析中心（`ISAC`）。金融服务业、通信业、汽车业等均设有\
  \ `ISAC`。\n\n1[R.I. Gen. Laws § 11–49.3–2](https://www.westlaw.com/Document/N20D8CCC0373D11E5823BE24E38CB0B04/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\n\
  \n2Press Release, U.S. Dep't of Just., Thirty-six Defendants Indicted for Alleged\
  \ Roles in Transnational Criminal Organization Responsible for More than $530 Million\
  \ in Losses from Cybercrimes (Feb. 7, 2018), available at [`www.justice.gov/opa/pr/thirty-six-defendants-indicted-alleged-roles-transnational-criminal-organization-responsible`](https://www.justice.gov/opa/pr/thirty-six-defendants-indicted-alleged-roles-transnational-criminal-organization-responsible)\n\
  \n3[J.S. v. Village Voice Media Holdings, LLC, 184 Wash. 2d 95 (Wash. 2015)](https://www.westlaw.com/Document/I2d4de5f2530111e5a807ad48145ed9f1/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\n\
  \n4[Fair Hous. Council of San Fernando Valley v. Roommates.com, LLC, 521 F.3d 1157,\
  \ 1168 (9th Cir. 2008)](https://www.westlaw.com/Document/Iff32686601a811ddb6a3a099756c05b7/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0&fragmentIdentifier=co_pp_sp_506_1168)\n\
  \n5Steven N. Durlauf & Daniel S. Nagin, Imprisonment and Crime: Can Both Be Reduced?,\
  \ 10 Criminology and Pub. Pol'y 13 (2011)\n\n6Herbert Packer, The Crime Tariff,\
  \ 33 Am. Scholar 551 (1964)\n\n7Press Release, Federal Trade Commission, TRUSTe\
  \ Settles FTC Charges It Deceived Consumers Through Its Privacy Seal Program (Nov.\
  \ 17, 2014), available at [`www.ftc.gov/news-events/press-releases/2014/11/truste-settles-ftc-charges-it-deceived-consumers-through-its`](http://www.ftc.gov/news-events/press-releases/2014/11/truste-settles-ftc-charges-it-deceived-consumers-through-its)\n\
  \n## 第 4 章\n\n### 计算机欺诈与滥用法案\n\n我们现在从对网络安全与法律的一般性讨论，转向禁止网络不当行为的具体法规。在美国，最著名的法规是联邦《计算机欺诈与滥用法案》（`CFAA`）。国会于\
  \ 1984 年颁布了 `CFAA` 的一个版本，并于 1986 年对其进行了大幅修订。1986 年至 2018 年间，`CFAA` 共被修订了九次，最近一次修订发生在\
  \ 2008 年。`CFAA` 广泛禁止对受保护计算机的未授权活动，以及其他少数犯罪。对于某些条款，未授权活动的禁止范围既包括无授权活动，也包括超出授权访问的活动。\n\
  \n`CFAA` 的全文见 [18 U.S.C. § 1030](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)。[第\
  \ 1030(a) 节](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 列出了具体的禁止行为。下表总结了 `CFAA` 下的犯罪行为及初犯的量刑标准。\n\n| 犯罪行为 | 条款 | 初犯最高刑期 |\n| :--- | :---:\
  \ | :--- |\n| 未经（或超出）授权获取国家安全信息 | (a)(1) | 10 年 |\n| 未经（或超出）授权访问计算机并获取信息 | (a)(2)\
  \ | 1 年或 5 年（存在加重因素时） |\n| 未经授权访问政府计算机 | (a)(3) | 1 年 |\n| 未经（或超出）授权访问计算机以实施欺诈并获取价值\
  \ | (a)(4) | 5 年 |\n| 故意传输代码造成损害，且未经授权 | (a)(5)(A) | 1 年或 10 年至终身监禁（存在加重因素时） |\n\
  | 故意访问导致鲁莽损害，且未经授权 | (a)(5)(B) | 1 年或 5 年（存在加重因素时） |\n| 故意访问导致损害和损失，且未经授权 | (a)(5)(C)\
  \ | 1 年 |\n| 密码贩卖 | (a)(6) | 1 年 |\n| 涉及计算机的勒索 | (a)(7) | 5 年 |\n\n**表 1：CFAA 条款**\n\
  \n在上一章扣人心弦的网络安全故事中，黑帽黑客 `Brian` 诱骗 `Retailco` 员工点击钓鱼链接。随后，`Brian` 利用被攻陷的计算机从公司客户数据库中获取信息。其行为明显违反了\
  \ [第 1030(a)(2) 节](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，该条款禁止未经授权获取信息。他还违反了\
  \ 1030(a)(5)(A)，因为他向目标机器传输了恶意代码。视 `Brian` 下载数据库的目的而定，可能还触犯 1030(a)(4)。此外，若其行为导致\
  \ `Retailco` 数据丢失，或导致 `Retailco` 及其客户服务中断，其行为可能还违反了 1030(a)(5)(B) 或 1030(a)(5)(C)。这取决于\
  \ `CFAA` 对“损害”的定义，将在后文讨论。\n\n#### I. 犯罪与惩罚\n\n\n\n\n上表指出，加重因素可增加初犯的刑期。加重因素随所违反的条款而异。如果犯罪行为是为了“商业优势或私人经济利益”，或“为了推进任何犯罪或侵权行为”，或所获信息价值超过\
  \ 5,000 美元，则违反 `1030(a)(2)` 的最高刑期为五年。如果违反行为造成的累计损失超过 5,000 美元、涉及医疗信息、造成公共安全威胁、在一年内损坏十台或更多计算机，或受损计算机包括美国政府为“推进司法管理、国防或国家安全”而使用的计算机，则违反\
  \ `1030(a)(5)(A)` 和 `(B)` 的最高刑期更高。`1030(c)(4)(E)` 和 `(c)(4)(F)` 对违反 `(a)(5)(A)`\
  \ 的行为规定了更严厉的刑罚。如果传播造成的故意损害导致严重身体伤害，最高刑期为二十年。如果违反行为导致死亡，无期徒刑将成为初犯的最高可能刑期。\n\n对于所有条款，后续犯罪也会加重潜在刑期。对\
  \ `1030(a)(1)`、`(a)(5)(A)` 或 `(a)(5)(B)` 的后续定罪，最高刑期为二十年。对于所有其他条款，后续定罪的最高刑期为十年。\n\
  \n#### II. 什么是计算机？\n\nCFAA 将计算机定义为“执行逻辑、算术或存储功能的电子、磁性、光学、电化学或其他高速数据处理设备”。法院已认定 CFAA\
  \ 下的“计算机”涵盖广泛的设备。然而，CFAA 的大多数条款要求计算机具有更具体的属性。最初，CFAA 要求受影响的系统必须是“联邦利益计算机”。在 1986\
  \ 年版的 CFAA 中，“联邦利益计算机”被定义为仅包括用于实施犯罪的计算机，或由金融机构或美国政府使用的计算机。几年后，CFAA 修正案将“联邦利益计算机”替换为“受保护计算机”。根据现行定义，“受保护计算机”可以是金融机构的计算机、美国政府使用的计算机，或任何用于或影响州际贸易或通信的计算机。\n\
  \n最后一类似乎包括任何具有互联网连接的计算机。在 2008 年修订 CFAA 的过程中，弗吉尼亚州众议员 Scott 主张利用互联网接入来满足“受保护计算机”定义中关于影响州际贸易或通信的要求。1\
  \ 这一来自立法历史的解释也得到了 2007 年第八巡回法院案件 *United States v. Trotter* 的支持。2 在 *Trotter* 案中，被告试图辩称“受保护计算机”不应包括非营利组织的计算机。法院不同意，引用早期法院关于\
  \ CFAA 的观点：“一旦计算机被用于州际贸易，国会就有权保护它。” 随着信息时代的发展，CFAA 的涵盖范围已扩大到包括任何访问互联网的工具，包括笔记本电脑、智能手机、iPad\
  \ 和物联网设备。\n\n#### III. 民事诉讼\n\n法院一贯对 CFAA 的措辞做出非常宽泛的解释，以禁止各种各样的行为，这或许部分是因为国会在过去\
  \ 30 年中每次修订 CFAA 时都一贯扩大了其范围。如今，审查涉及基于 CFAA 索赔的案件会发现，大量事件涉及员工在离职前后从雇主的计算机中获取信息。此类案件通常也涉及商业秘密盗窃指控。这还不包括已提起的众多刑事案件。\n\
  \n虽然 CFAA 主要是一部刑事法规，但 CFAA 的第 `(g)` 款创设了诉因，允许受害者起诉违规者以获得补偿性损害赔偿或衡平法救济。根据 `1030(g)`\
  \ 提起的民事诉讼仅限于涉及 [第 1030(c)(4)(A)(i) 节](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 中列出的前五个因素之一的行为。这些因素是针对违反 [第 1030(a)(5)(B) 节](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 规定的加重因素。请记住，`1030(a)(5)(B)` 禁止故意未经授权的访问并以鲁莽方式造成损害。根据 `1030(g)` 提起的民事诉讼通常基于违反 [第\
  \ 1030(a)(5)(B) 节](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 的主张，但法院也允许基于违反其他条款提起民事诉讼。这包括 `(a)(2)` 关于访问和获取信息的条款、`(a)(4)` 关于以欺诈意图访问的条款，以及 `(a)(5)(A)`\
  \ 关于传播造成损害的条款，前提是存在加重因素。\n\n[第 1030(c)(4)(A)(i) 节](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 实际上有六个因素，但 `1030(g)` 仅引用前五个作为提起民事诉讼的依据。第六个因素——在一年内造成影响十台或更多计算机的损害——明显缺失。所有六个因素及其中五个对民事诉讼的重要性，均以现行形式在\
  \ [Public Law 110–326](https://www.westlaw.com/Document/IE9C993D08CA411DDB113A560C25CB2C0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)（即《前副总统保护法案》H.R.\
  \ 5938）中被添加。立法历史表明，关于损坏十台或更多计算机的第六个因素是为应对间谍软件威胁而添加的。国会为何未认定损坏十台或更多计算机足以支持根据 [第 1030(g)\
  \ 节](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 提起民事诉讼，目前尚不清楚。\n\n在 1990 年代末的一段短时期内，原告曾试图适用 CFAA 让其产品导致客户计算机损坏的软件生产商承担责任。其中一例是\
  \ *Shaw v. Toshiba America Information Systems* 案，争议缺陷在于有缺陷的微代码。3 2001 年，[第 1030(g)\
  \ 节](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 修订为不允许因计算机软件、硬件或固件的疏忽设计或制造而提起民事诉讼。另一方面，[第 1030(g) 节](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 一再被解释为为遭受不忠员工侵害的雇主以及网络攻击受害者提供救济途径。国会未像限制制造商责任那样修订 CFAA 以限制雇佣冲突背景下的责任，因此目前可以推定这些诉因落入国会的意图范围内。CFAA\
  \ 的历史因此显示了一个不断完善责任问题的持续过程。\n\n#### IV. CFAA、《保护商业秘密法》和《经济间谍法》\n\n\n\n##### 企业依赖知识产权保护以确保竞争优势\n\
  \n商业秘密历史上一直是州法律层面民事诉讼的问题，尽管 2016 年《保护商业秘密法案》（DTSA，编纂于 `18 U.S.C. § 1836`）的通过改变了这一状况。在\
  \ DTSA 之前，联邦《经济间谍法》（EEA）针对商业秘密盗窃，但其语言侧重于政府执法。DTSA 通过后，如果商业秘密“与在州际或外国贸易中使用或意图用于其中的产品或服务有关”，商业秘密所有者即拥有针对商业秘密盗用的联邦诉因。\n\
  \n如前所述，《计算机欺诈与滥用法》（CFAA）的民事条款常被用于起诉窃取公司商业秘密的不忠员工。目前尚不清楚 DTSA 将对依据 CFAA `Section\
  \ 1030(g)` 提起的商业秘密相关诉讼数量产生何种影响。在 CFAA 被用于确立联邦管辖权的范围内，诉讼当事人可能更倾向于 DTSA 更具针对性的商业秘密保护。正如本章其余部分所阐明的，关于\
  \ CFAA 的法律问题层出不穷，特别是涉及授权和损害赔偿方面。\n\n在 DTSA 通过之前，《经济间谍法》仅规定了针对商业秘密盗窃的罚款和监禁刑罚。因此，它当时并非民事诉讼当事人的可行选项。CFAA\
  \ 通过允许就不当获取信息提起民事诉讼，为 EEA 提供了联邦层面的补充。使问题复杂化的是，这两部法典在制定时均未考虑到对方。EEA 的语言聚焦于商业秘密，而\
  \ CFAA 则笼统地聚焦于信息。两者目标不同的另一个迹象是所针对的行为类型。CFAA 仅限于计算机媒介，而违反 EEA 的行为可涉及任何商业秘密盗窃手段。\n\
  \n然而，两者均针对有利于外国政府的行为。在 EEA 中，这是 `Section 1831`，专门针对将使外国政府受益的商业秘密盗窃。在 CFAA 中，这类似于\
  \ [`Section 1030(a)(1)`](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 中列举的首项违法行为。该条款针对未经授权获取需要“防止不当披露”的信息或“受限数据”，以及随后涉及该信息的作为或不作为。如果该信息“可被用于损害美国利益，或有利于任何外国”，则此类行为受\
  \ CFAA 管辖。\n\n尽管 DTSA 改变了民事责任范式，但监管范式基本未变，EEA 仍为与商业秘密盗用相关的行为提供刑事处罚。一些犯罪基于该活动对实施未来犯罪的效用。其他犯罪则着眼于犯罪行为所得的未来用途。CFAA\
  \ 在 `Section 1030(a)(6)` 中规定了上游犯罪，将贩卖密码或类似访问相关信息的行为定为犯罪。EEA 则规定了下游犯罪，将明知为非法获取而接收信息的行为定为犯罪。州网络犯罪法中这种上游/下游区别的出现方式将在后续章节中讨论。\n\
  \n#### V. 巡回法院分歧\n\nCFAA 是各司法管辖区间存在重大分歧的主题。第一个主要实质性分歧涉及哪些类型的损害计入法典的损害和损失要求。第二个实质性分歧涉及授权的含义及授权何时丧失。\n\
  \n本章将讨论的许多案件涉及商业秘密盗用。本文主要关注安全与隐私，但值得注意的是，CFAA 常被用于支持商业秘密盗用和不正当竞争的主张。同样，DTSA 通过后\
  \ CFAA 在商业秘密领域的未来适用仍不明朗，但这些案件仍为 CFAA 提供了必要的分析。部分由于证据问题，实际网络犯罪的起诉并不常见，且产生已发表判例的起诉更少。因此，依据\
  \ `Section 1030(g)` 提起的民事案件为理解法典语言提供了有益指导。\n\n##### a. 损害与损失\n\n`Section 1030(a)(5)`\
  \ 常是涉及造成损害的计算机入侵案件的核心。“损害”在 `1030(e)` 中定义为“对数据、程序、系统或信息的完整性或可用性的任何损害”。在评估该定义时，法院常认定永久删除文件构成损害。`International\
  \ Airport Centers v. Citrin` 案即属此类，被告使用安全擦除程序永久删除文件以掩盖其可疑活动。\n\n另一方面，单纯的信息窃取是否构成损害则不那么明确。大多数司法管辖区认为不构成。例如，`Garelli\
  \ Wong & Associates, Inc. v. Nichols` 案中地区法院认定，通过未经授权的计算机访问窃取商业秘密不属于 CFAA 下的损害。此外，`Garelli\
  \ Wong` 法院认为，CFAA 诉状必须同时确立损害和损失，尽管 `1030(g)` 仅要求损害或损失。\n\n关于 CFAA 下的损害问题，少数法院认为“数据完整性受损”可包含信息窃取。在\
  \ `Shurgard Storage Centers, Inc. v. Safeguard Self Storage, Inc.` 案中，地区法院指出：“在数据语境下，‘完整性’一词必然包含将数据维持在受保护状态的含义。”法院进一步得出结论，1996\
  \ 年 CFAA 修正案的立法历史支持这一解释。\n\n考虑过这一点的其他巡回法院通常不同意 `Shurgard` 法院的观点，但第九巡回法院尚未就此问题作出裁决，因此\
  \ `Shurgard` 在其判决所在地的华盛顿西区仍具先例效力。在 `Garelli Wong & Associates` 案中，法院拒绝遵循 `Shurgard`\
  \ 案，断言后续立法历史取代了对损害定义的这一解读。这一结论的理由不明确，因为后续修正案未缩小 1996 年修正案增加时所存在的损害定义，也未定义“完整性”。\n\
  \n“损失”在 `Section 1030(e)` 中定义为：“受害者的任何合理成本，包括应对犯罪的成本、进行损害评估的成本、将数据、程序、系统或信息恢复到犯罪前状态的成本，以及因服务中断而导致的任何收入损失、成本支出或其他后果性损害。”因此，损失指因损害而产生的成本，但收入损失仅在因服务中断导致时才被考虑。因此，聘请计算机取证顾问以确定危害程度的成本，完全可以被视为\
  \ CFAA 下的损失。另一方面，如果指控的 CFAA 犯罪涉及前雇员窃取商业秘密并跳槽至竞争对手，因该背叛行为导致的收入损失极不可能被视为 CFAA 下的损失。\n\
  \n\n\n\n###### 另一个源自华盛顿州的案件\n\n另一个源自华盛顿州的案件，*Pacific Aerospace & Electronics v.\
  \ Taylor*，采用了对“损失”的广泛解释。8 *Pacific Aerospace & Electronics* 案还依赖第一巡回法院的案件 *EF Cultural\
  \ Travel v. Explorica*，得出结论认为“源于未经授权行为的任何损失均可获得赔偿”。*Explorica* 案涉及一家公司使用抓取软件从竞争对手的网站收集数据。9\
  \ *Explorica* 案中的原主张的损失“包括业务减少、商誉受损，以及其为评估 EF 系统可能遭受的损害而采取诊断措施所产生的费用”。\n\n######\
  \ 损害与损失的概念\n\n在 CFAA（计算机欺诈和滥用法）的民事条款 **第 1030(g) 节** 中，损害和损失的概念变得更加复杂。造成困惑的确切措辞是：\n\
  \n> 任何因违反本节规定而遭受损害或损失的人，均可对违规者提起民事诉讼，以获得补偿性损害赔偿和禁令救济或其他衡平法救济。仅当该行为涉及第 (c)(4)(A)(i)\
  \ 款第 [5] 项 (I)、(II)、(III)、(IV) 或 (V) 目所述因素之一时，方可就违反本节规定的行为提起民事诉讼。\n\n*Shurgard*\
  \ 案是一起 **1030(g)** 案件，大多数批评 *Shurgard* 的案件也是如此。引用的小节规定如下：\n\n> (c) 违反本节第 (a) 款或\
  \ (b) 款规定的罪行的处罚是……\n>\n> (4)\n>\n> (A) 除第 (E) 款和 (F) 款规定外，处以本编规定的罚金、不超过 5 年的监禁，或两者并罚，适用于——\n\
  >\n> (i) 违反第 (a)(5)(B) 款规定的罪行，该罪行不发生在因违反本节规定的其他罪行被定罪之后，如果该罪行造成了（或就企图犯罪而言，如果完成将会造成）——\n\
  >\n> (I) 在任意 1 年期间内对 1 个或多个人造成损失（且就美国提起的调查、起诉或其他程序而言，因影响 1 台或多台其他受保护计算机的相关行为过程造成的损失），总价值至少达\
  \ 5,000 美元；\n>\n> (II) 对 1 个或多个人的医疗检查、诊断、治疗或护理进行修改或损害，或潜在的修改或损害；\n>\n> (III) 对任何人造成人身伤害；\n\
  >\n> (IV) 对公共卫生或安全构成威胁；\n>\n> (V) 影响由美国政府实体为推进司法行政、国防或国家安全而使用的计算机的损害；或\n>\n> (VI)\
  \ 在任意 1 年期间内影响 10 台或更多受保护计算机的损害\n\n除了上文所述对 (VI) 项的遗漏外，**1030(g)** 还遗漏了 **第 (c)(4)(A)(ii)\
  \ 款**，该款适用于企图犯罪。这表明如果犯罪仅属企图但未遂，则不能提起 **1030(g)** 诉讼。\n\n**1030(g)** 诉讼中当事人最常依赖的因素是\
  \ **1030(c)(4)(A)(i)(I)**。该因素为“在任意 1 年期间内对 1 个或多个人造成损失……总价值至少达 5,000 美元”。\n\n由此引发的争论尚未尘埃落定，焦点在于损害的定义是否包含信息窃取，如果包含，此类损害在何种程度上足以满足\
  \ **第 1030(g) 节** “损害或损失”条款的要求。在这种情况下，信息窃取是否可能导致除收入损失以外的经济损害？\n\n###### 授权\n\n从根本上说，CFAA\
  \ 关乎对信息的控制。根据 CFAA，当控制权由本不应拥有控制权的人行使时，即产生责任。大多数条款针对的是影响他人拥有的计算机的行为。CFAA 归根结底是关于财产犯罪。如果我给自己的房子喷漆，这没问题。如果我的邻居未经我允许给我的房子喷漆，那就是破坏财物。但区分物理财产相对容易。计算机案件中的许可问题包含大量模糊地带。因此，CFAA\
  \ 下的授权问题可能成为从业者的雷区。\n\n授权是 CFAA 责任认定的核心，也是另一个巡回法院分歧的主题。一些法院将这种分歧描述为：在 CFAA 下，什么构成“拥有”、“丧失”或“超越”授权，存在狭义观点与广义观点的对立。第七巡回法院在\
  \ *International Airport Centers, L.L.C. v. Citrin* 案中采纳了广义观点，借鉴代理法得出结论：当雇员违背对雇主的忠诚义务时，即丧失了授权。在\
  \ *United States v. John* 案中，10 第五巡回法院适用“预期用途分析”，得出结论：被告将工作计算机用于收集欺诈信息，属于超越授权访问。同样，在\
  \ *United States v. Rodriguez* 案中，第十一巡回法院认定社会安全管理局的雇员使用工作计算机查询其认识的女性的个人信息，构成超越授权访问。11\
  \ 公共网站也一直是基于授权分析的对象。2001 年，第一巡回法院在 *EF Cultural Travel BV v. Explorica, Inc.* 案中判定，被告使用由原告前雇员参与设计的抓取程序访问原告网站，构成超越授权访问。12\n\
  \n另一方面，狭义观点往往强调 CFAA 对黑客行为的关注。采纳狭义观点的法院不太可能仅因雇员挪用公款就认定违反 CFAA。有多起刑事案件采纳了狭义观点，侧重于法律解释和宽严相济原则。2012\
  \ 年，第九巡回法院在 *United States v. Nosal* 案中判定，13 CFAA 中的授权语言适用于访问限制，而非使用限制。\n\n在遵循 2012\
  \ 年 *Nosal* 判决先例的司法管辖区，被告若获授权访问计算机，随后挪用该计算机上的数据，不因其侵权意图而丧失授权。第二巡回法院在 *United States\
  \ v. Valle* 案中采纳了这一做法，14 该案与 *United States v. Rodriguez* 案有许多相似之处。在 *Valle* 和 *Rodriguez*\
  \ 两案中，政府雇员均利用其访问公民信息的权限，收集其认识的特定人员的敏感信息。但第十一巡回法院认定，通过授权访问获取信息后加以滥用，违反了 CFAA；而第二巡回法院采纳狭义解释，得出结论：不存在此类违规行为。在作出该判决时，*Valle*\
  \ 法院强调，政府对 CFAA 的解读可能将日常活动定罪，并拒绝“仅因为政府承诺负责任地使用该法规，就支持对该法规的高度成问题的解释”。\n\n\n\n\n\n\
  ####### 民事诉讼中的狭义解释\n\n狭义解释也已被采用于民事诉讼中。在 *Nosal* 案之前，第九巡回法院审理了 *LVRC Holdings LLC\
  \ v. Brekka* 案 15，该案探讨了当雇员将机密文件发送至其个人电子邮箱时，其行为是否构成“未经授权”。在 *Brekka* 案中，第九巡回法院明确驳回了第七巡回法院在\
  \ *Citrin* 案中的结论，即授权会因不忠行为而丧失。第四巡回法院在 *WEC Carolina Energy Solutions LLC v. Miller*\
  \ 案中 16 采纳了 *Brekka* 案的推理。与许多依据 CFAA 提起的民事诉讼一样，*WEC Carolina* 案也发生在雇佣背景下。*WEC Carolina*\
  \ 案法院认定，当雇员“利用其访问权限获取或篡改超出其获准访问范围之外的信息”时，即构成超越授权访问。然而，根据他们的解读，滥用雇员获准访问的信息不属于 CFAA\
  \ 管辖范围。\n\n尽管 *Nosal* 案中的五项 CFAA 指控于 2012 年被驳回 17，Nosal 最终仍因违反 CFAA 被定罪。这基于 Nosal\
  \ 在其数据库访问权限被撤销后，使用了他人的密码。根据法院认定，这属于未经授权的访问。Nosal 等人使用了 Nosal 前助理的登录信息，以便在其自身访问权限被撤销后继续获取机密信息。2016\
  \ 年，Nosal 再次上诉至第九巡回法院，该法院维持了对 Nosal 的定罪 18。第九巡回法院推理的核心在于被告为规避访问限制所做的努力。然而，法院强调，规避技术性访问屏障并非证明某人缺乏授权的必要条件。2017\
  \ 年，最高法院决定不受理 *United States v. Nosal* 案的上诉审查，因此第九巡回法院关于授权与规避的裁决继续有效。\n\n过去，司法部曾主张，如果社交媒体用户违反了服务的使用条款，则该用户的后续行为属于未经授权。支持狭义授权观点的一个常见论据是：利用私人计算机使用政策和最终用户许可协议来判定是否构成犯罪，赋予了这些私人合同过大的权力。包括\
  \ *United States v. Drew*19、*Continental Group v. KW Property Management*20 和 *Modis,\
  \ Inc. v. Bardelli*21 在内的多个案件，均强调依据合同语言来判定个人是否超越了授权访问。涉案合同分别为：网站服务条款协议、一套计算机访问政策和一份雇佣协议。\n\
  \n#### VI. 具体案例\n\n本节将考察三起依据 CFAA 提起的具体刑事起诉案件。第一起，*United States v. Morris*22，是第二巡回法院的一个案件，在两个意义上具有里程碑意义。首先，它是依据\
  \ CFAA 提起的首起公诉；其次，它涉及首个已知的互联网蠕虫。第二起案件，*United States v. Auernheimer*23，由第三巡回法院于\
  \ 2014 年判决。*Auernheimer* 案之所以重要，是因为它展示了 CFAA 违法行为内涵的演变。第三起案件，*United States v. Nosal*，是第九巡回法院将\
  \ CFAA 应用于机密信息挪用问题的案例。\n\n##### a. United States v. Morris 案（第二巡回法院，1991 年）\n\n\
  *Morris* 案是依据 CFAA 提起的首起联邦公诉。被告 Robert Morris 是康奈尔大学的一名计算机科学研究生，他编写并释放了一个利用计算机网络漏洞的蠕虫。正是通过\
  \ *Morris* 案，我们确立了目前的理解：除非另有规定，CFAA 的故意要求主要适用于“访问”行为。重点在于你是否意图访问该计算机，而不在于你是否意图未经授权地行动。\n\
  \n值得注意的是，Robert Morris 不仅是首位依据 CFAA 被起诉的人，其 Morris 蠕虫也是互联网上首个已知的蠕虫。Morris 陈述称，该蠕虫的初衷是估算互联网的规模。不幸的是，计算机上运行的蠕虫副本越多，运行速度越慢，直到计算机无法使用。这种影响常被归类为非预期后果。然而，疑问依然存在。如果\
  \ Morris 无意让蠕虫造成破坏，为何要在 MIT 网络而非他就读的康奈尔大学网络上释放它？\n\n无论意图如何，该蠕虫确实造成了破坏。如果非要说有什么意义，*Morris*\
  \ 起诉代表了将 CFAA 应用于由好奇心驱动的计算机安全行为。\n\n##### b. United States v. Auernheimer 案（第三巡回法院，2014\
  \ 年）\n\n一次偶然的安全漏洞发现引出了 *United States v. Auernheimer* 案。Daniel Spitler 是 Andrew\
  \ Auernheimer 的一位网友，也是被告的共谋者。这次偶然发现发生在 2010 年，当时 Spitler 试图弄清如何在不购买 iPad 的情况下，获得\
  \ AT&T 向 iPad 用户提供的每月 30 美元无限流量套餐。在 Spitler 的尝试过程中，他发现使用 iPad 浏览器访问用户账户需要一个 19 位或\
  \ 20 位的集成电路卡标识符（ICC-ID），且该号码与设备绑定。从 iPad（或伪装的 iPad 浏览器）访问 AT&T 登录页面会导致用户的电子邮件地址自动填充到用户标识字段中，因为浏览器检测到\
  \ ICC-ID 并将用户重定向到一个 URL 中显示 ICC-ID 的登录页面。猜测 ICC-ID 号码可能是连续的，Spitler 在末位数字上加 1，浏览器随即填充了一个列出另一位\
  \ iPad 用户电子邮件地址的登录页面。\n\n随后 Spitler 联系了 Auernheimer，两人开发了一个程序，可自动递增 ICC-ID 号码并记录生成的电子邮件地址。通过这种方式，两人发现了\
  \ 114,000 位 iPad 用户的电子邮件地址。虽然信息仅限于电子邮件地址，但其中包含一些知名人士的邮箱，使该数据库极具潜在价值。两名共谋者通过联系媒体公开了他们的发现。\n\
  \n随后，新泽西联邦法院提起公诉。Spitler 认罪并因悔罪表现良好被判处缓刑。Auernheimer 因共谋违反 CFAA 和联邦身份盗窃法接受审判，被定罪后判处\
  \ 41 个月监禁。上诉中，第三巡回法院以管辖地不当为由撤销了定罪。犯罪发生时，Auernheimer 和 Spitler 均不在新泽西州，受影响的系统也不在该州，虽然泄露信息的人员中可能有人居住在新泽西州，但法院认为这还不够。法院考虑了被指控罪行的基本行为要素是否发生在新泽西州，结论是该司法管辖区不存在基本行为。\n\
  \n\n\n\n\n###### 刑事辩护律师或许也应关注 Auernheimer 案的另一个层面\n\n上诉中，第三巡回法院承认，Auernheimer 的罪行因检方策略性地加入违反新泽西州计算机犯罪法规的指控，而从轻罪升级为重罪。CFAA\
  \ 量刑条款中的一项要素规定，如果违反第 `1030(a)(2)(C)` 节的行为是为了进一步违反州法律，则可将其升级为重罪。新泽西州的计算机犯罪法与 CFAA\
  \ 相似，因此，允许州法为 CFAA 量刑提供加重资格，实质上意味着罪行自我加重。上诉法院并未探讨利用州网络犯罪法规来加重 CFAA 刑罚这一机制。\n\n#####\
  \ c. 美国诉 Nosal 案（第九巡回法院）\n\nDavid Nosal 是猎头公司 Korn Ferry 的区域总监。在错失晋升机会后，他开始与公司其他员工计划离职创业，成立一家竞争对手公司。为便于此事，他们想要复制\
  \ Korn Ferry 数据库 Searcher 的内容。该公司视 Searcher 及其内容为专有机密。Searcher 受密码保护，仅限员工访问。Nosal\
  \ 及其同伙在仍拥有自己密码访问权限时，从 Searcher 下载了部分内容。离职且访问权限被撤销后，他们继续使用一名现任 Korn Ferry 员工的密码访问\
  \ Searcher。\n\n2012 年，第九巡回法院裁定，在职期间从 Searcher 下载信息不构成 CFAA 项下的“超越授权访问”。该上诉后，Nosal\
  \ 因包括违反 CFAA 和《经济间谍法》在内的其余若干罪名被判有罪。Nosal 提起上诉，辩称除其他理由外，政府对 CFAA 的解读将导致密码共享行为定罪。第九巡回法院于\
  \ 2016 年维持原判。多数意见认为，问题不在于密码共享，而在于授权的撤销以及规避该撤销的行为。密码共享仅是实现规避的工具。Reinhardt 法官对 2016\
  \ 年的多数意见持异议，警告称多数派“忽视了 CFAA 的反黑客立法目的。”\n\n综合 2012 年和 2016 年的 Nosal 判决来看，其确立的原则是：如果一个人使用自己的密码访问计算机，然后挪用其中的信息，不构成超越授权访问；但故意撤销授权不得通过其他手段加以颠覆。\n\
