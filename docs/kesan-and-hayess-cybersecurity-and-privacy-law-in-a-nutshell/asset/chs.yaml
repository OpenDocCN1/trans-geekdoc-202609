  \n\n## 第 6 章\n\n### 数据泄露\n\n在撰写本文时，尚无通用的联邦数据泄露法律。虽然已提出了一些联邦立法，且一些特定行业的联邦信息隐私法规包含了发生泄露时须遵循的要求，但当今的数据泄露法规均为州法律。各州采纳数据泄露法律的过程跨越了十余年。截至\
  \ 2018 年，所有五十个州均已颁布数据泄露法规。\n\n数据泄露法律通常规定了法律保护的信息范围、遭泄露公司必须通知的时间和对象，以及数据泄露受害者是否可提起民事诉讼。州数据泄露法律通常也涉及加密问题。例如，在没有解密密钥的情况下窃取加密数据，通常不会触发州数据泄露法律下的通知要求。\n\
  \n#### 一、 法律要求保护哪些信息\n\n目前，所有五十个州、哥伦比亚特区、波多黎各、关岛和美属维尔京群岛均已生效实施了关于数据泄露的法律。阿拉巴马州是最后一个采纳数据泄露法律的州，于\
  \ 2018 年 4 月通过。大多数数据泄露法律遵循一个基本定义，界定何为安全漏洞以及必须受到保护的个人信息，仅有细微差别。安全漏洞通常被定义为包括未经授权获取受保护信息，从而危及该信息的安全性、机密性或完整性。一些州将未经授权的访问纳入漏洞定义。少数州在定义安全漏洞时，不采用“安全性、机密性或完整性”这一措辞。\n\
  \n几乎所有州数据泄露法律中都存在几个共同特征。它们都定义了必须受到保护的信息类别。一般而言，“个人信息”要求包含姓名（全姓和至少一个名的首字母）并结合至少另一类信息。不过，纽约州的法律不要求信息必须关联姓名，只要受影响的信息是多种信息的组合即可。[¹]\
  \ 大多数州在其数据泄露法律中提及加密，通常是在定义何种信息丢失构成泄露的背景下。数据泄露法律通常适用于未加密数据，但当加密密钥也遭泄露时，加密数据也可能受数据泄露法律管辖。\n\
  \n在大多数州，至少有三类信息被视为受保护信息：\n1.  社会安全号码\n2.  驾驶执照号码或其他政府签发的身份证件号码\n3.  金融账户号码（包括信用卡和借记卡账户）及访问该账户所需的验证信息\n\
  \n大多数州排除合法存在于公开可用来源中的信息，尽管许多州将此类别限制为政府记录。除了“三大类”（社会安全号码、驾驶执照、金融账户）之外，许多州还将额外的数据类别纳入受保护个人信息范围。例如，哥伦比亚特区在其个人信息定义中包含了个人的电话号码和地址。\n\
  \n最常见的额外保护是医疗信息保护，由十五个州和波多黎各提供。这些州法律涵盖的信息范围各不相同。例如，在阿肯色州，医疗信息“指以电子或物理形式记录的、关于个人病史或医疗护理专业人员作出的医疗诊断的任何可识别个人身份的信息。”[²]\
  \ 在密苏里州，其含义为“关于个人病史、精神或身体状况，或医疗护理专业人员作出的医疗诊断的任何信息。”[³] 德克萨斯州采用较窄的定义，适用于关于“个人身体或精神健康或状况”的信息。[⁴]\
  \ 德克萨斯州还认为，当信息涉及“为个人提供医疗服务”或支付上述医疗费用时，医疗信息属于“敏感个人信息”。\n\n在保护医疗信息的州中，有五个州——阿拉巴马州、加利福尼亚州、密苏里州、内华达州和德克萨斯州——保护健康保险信息。内华达州的保护范围涵盖“健康保险识别号码”。除了上述医疗信息定义外，密苏里州将健康保险信息定义为“个人的健康保险单号或订户识别号，[或]健康保险公司用于识别个人的任何唯一标识符。”[⁵]\n\
  \n一些州列出了受保护的其他身份识别信息来源。九个州规定保护用户名或电子邮件（结合密码或安全问题答案）。[⁶]\n\n[¹]: section13.xhtml#ftn.57\n\
  [²]: section13.xhtml#ftn.58\n[³]: section13.xhtml#ftn.59\n[⁴]: section13.xhtml#ftn.60\n\
  [⁵]: section13.xhtml#ftn.61\n[⁶]: section13.xhtml#ftn.62\n\n\n\n\n\n##### 生物识别数据和其他受保护信息\n\
  \n生物识别数据也是一种日益流行的额外保护措施。康涅狄格州、伊利诺伊州、爱荷华州、内布拉斯加州、新墨西哥州、北卡罗来纳州、俄勒冈州、南达科他州、威斯康星州和怀俄明州均将生物识别数据纳入其个人信息的定义中。威斯康星州比其他州走得更远，还将个人的\
  \ DNA 概况纳入其中。7 三个州——佐治亚州、缅因州和俄勒冈州——均保护任何足以构成身份盗窃的数据。新泽西州也规定：“如果访问分离数据的方法与访问分离数据本身相关联，则构成个人信息的分离数据（如果关联起来）即为个人信息。”8\n\
  \n纳税人识别号在康涅狄格州、马里兰州和怀俄明州受到专门保护。波多黎各对税务信息作出规定。通过车牌注册获得的信息在加利福尼亚州受保护。康涅狄格州保护外国人登记号，佛罗里达州保护军人识别号，两州均保护护照号。内布拉斯加州还包括“唯一电子识别号或路由代码，与任何所需的安全码、访问码或密码组合使用时”。9\n\
  \n北达科他州将个人信息定义为包含若干额外信息类型，包括出生日期、“个人母亲的婚前姓氏”、“由个人雇主分配给个人的识别号（与任何所需的安全码、访问码或密码组合使用时）”，以及电子签名。10\
  \ 南卡罗来纳州保护广泛类别的“可用于访问个人财务账户的其他号码或信息，或由政府或监管实体颁发的可唯一识别个人的号码或信息”。11 怀俄明州保护出生或结婚证明。12\
  \ 最后，波多黎各保护工作评估记录。13\n\n#### II. 遭泄露实体何时必须通知及通知对象\n\n在确认发生泄露后，各州对谁必须接收通知有不同规定。常见的接收方包括：信息被盗者本人、州检察长、消费者报告机构和其他政府实体。各州对何为泄露的定义大体相同，无论是阿拉斯加州规定的“未经授权获取……损害个人信息的安全性、保密性或完整性的个人信息……”14，还是肯塔基州规定的“未经授权获取未加密和未编辑的计算机化数据，从而损害可识别个人身份信息的安全性、保密性或完整性”15。\n\
  \n州数据泄露法律还有其他共同之处。大多数州数据泄露法律也适用于政府机构。大多数州数据泄露法律还规定了不视为泄露的排除情形。在肯塔基州，“信息持有者的雇员或代理人为信息持有者的目的，善意获取可识别个人身份信息，不构成安全泄露”16，前提是该信息本身未被用于帮助他人攻破系统。各州通常还规定，任何通知均可延迟，以免影响执法机构的调查。17\
  \ 部分州还有额外规定，如果通知会“危及国土或国家安全”，则允许延迟通知。18 州法律还规定了通知的方式，通常通过邮寄或电子通知。19 部分州还允许通过电话通知，或在发行量大的报纸上刊登通知。20\n\
  \n各州对公司何时必须实际提供通知存在分歧。十八个州 21 属于最主流的类别，即如果对消费者不存在合理的损害可能性，则无需进行通知。正如爱荷华州《个人信息安全泄露保护法》所述，如果“因泄露导致或将导致其个人信息被获取的消费者不存在合理的财务损害可能性”，则无需通知。22\
  \ 判断是否存在损害可能性的通常方式是查看泄露数据是否经过加密或编辑。23\n\n各州使用不同措辞描述何时触发法规的通知要求。南卡罗来纳州通过将泄露定义限定为“信息被非法使用已经发生或合理地可能发生，或信息的使用给居民造成实质性损害风险时”，对其泄露定义进行了限制。24\
  \ 俄亥俄州和威斯康星州均不要求在非法获取不造成“身份盗窃的实质性风险”时进行通知。25 在马萨诸塞州，泄露必须造成“身份盗窃或欺诈的重大风险”才要求通知。26\
  \ 在罗德岛州，除非存在“重大的身份盗窃风险”，否则不要求通知。在马里兰州，只有在数据持有者的调查结束后，“认定个人个人信息被滥用已经发生或合理地可能发生”时，才要求通知。27\
  \ 因此，是否需要通知往往取决于数据保护者对风险何时合理可能、重大、实质性或重大的判断。\n\n九个州和哥伦比亚特区要求通知在泄露期间其个人信息被合理认为已被获取的任何人。28\
  \ 这些法规使用的通用语言很简单。例如，在北达科他州，必须向“未加密的个人信息被未经授权的人获取，或合理地被认为已被获取”的任何居民发出通知。29 德克萨斯州使用略有不同的措辞，仅规定“敏感个人信息”。30\n\
  \n八个州要求进行调查以确定个人信息被滥用的可能性，如果不太可能，则无需通知。31 在爱达荷州，任何遭泄露的实体必须“善意进行合理且及时的调查，以确定个人信息被滥用的可能性”，且“只有当调查确定涉及爱达荷州居民的信息滥用已经发生或合理地可能发生时，机构、个人或商业实体才应发出通知……”。32\
  \ 密西西比州用否定语言描述义务，称“如果经过适当调查，相关人员合理地确定泄露不太可能导致受影响个人遭受损害，则不要求通知”。33\n\n\n\n\n\n#####\
  \ 七个州规定，如果泄露未实质性危害个人信息安全，则无需通知\n\n所有这些州均要求立即通知，但对“泄露”的定义方式使其仅在此种情况下触发。例如，亚利桑那州要求在调查确定发生泄露时“以最快的方式且不合理地延迟”进行通知，但将泄露定义为仅当泄露“实质性地危害个人信息的安全或机密性”时才触发，而这一认定需要先进行某种形式的调查。内华达州有类似法规，要求通知其信息被合理认为已被获取的任何居民，但将泄露定义为“未经授权获取计算机化数据，从而实质性地危害个人信息的安全、机密性或完整性……”。\n\
  \n弗吉尼亚州和西弗吉尼亚州对通知也设定了很高的门槛。在弗吉尼亚州，泄露仅涵盖实体“合理地认为已导致或将导致身份盗窃或其他欺诈”的情况。西弗吉尼亚州的措辞非常相似。大多数其他使用类似语言的州将报告要求建立在风险基础上。在新墨西哥州，如果数据泄露“不会引起重大的身份盗窃或欺诈风险”，则无需通知。\n\
  \n##### 各州在何时需要通知州检察长方面也存在差异\n\n阿拉斯加州和康涅狄格州的实体必须在存在合理危害可能性时通知其检察长。在伊利诺伊州、北达科他州、俄勒冈州和南达科他州，当受影响居民达到\
  \ 250 人时触发此通知要求。在另外五个州，受影响居民必须达到 500 人，而在阿拉巴马州、密苏里州和新墨西哥州，受影响居民必须达到 1000 人才触发通知要求。在爱达荷州，如果受害者是公共机构，则无论受影响人数多少，均须通知检察长。在一些州，必须在发现泄露后尽快通知检察长。马里兰州要求在通知任何州居民之前先通知检察长。\n\
  \n##### 大多数州要求泄露实体在达到特定阈值时向消费者报告机构 (CRA) 通报泄露情况\n\n明尼苏达州和罗德岛州要求，如果必须通知 500 名居民，则也必须通知\
  \ CRA。二十七个州和哥伦比亚特区将这一阈值设定为 1000 名居民。纽约州将其阈值设定为 5000 名居民，而佐治亚州和德克萨斯州将其设定为 10000 名居民。爱荷华州不要求直接通知\
  \ CRA，但要求通知居民时包含 CRA 的联系信息。同样，马萨诸塞州不要求泄露实体直接通知，但消费者事务和商业监管局局长将自动就任何规模的泄露通知 CRA。\n\
  \n##### 许多州还要求向检察长办公室以外的政府机构发送通知\n\n蒙大拿州要求将通知发送给行政部的州首席信息官，爱达荷州也有此要求，但仅当泄露实体为州机构时。夏威夷州要求通知消费者报告办公室。马萨诸塞州要求通知消费者事务和商业监管局局长。在缅因州，如果实体受其监管，则必须通知专业与金融监管部，否则直接通知检察长。在新泽西州，在进行任何其他通知之前，必须通知法律与公共安全部的州政策司。在纽约州，必须通知州务部和州警察局。最后，在南卡罗来纳州，如果泄露影响\
  \ 1000 名居民，则必须通知消费者事务部的消费者保护司。\n\n##### 在三个州，针对影响医疗信息的泄露适用额外的通知要求\n\n加利福尼亚州和华盛顿州均要求在医疗信息泄露时通知卫生服务部门。在弗吉尼亚州，如果医疗信息泄露，必须通知检察长。\n\
  \n#### III. 私人诉因\n\n十三个州允许居民对泄露实体提起民事诉讼，哥伦比亚特区、波多黎各和美属维尔京群岛亦然。在许多法规中，诉因基于州不公平贸易行为法。路易斯安那州允许提起民事诉讼以追偿泄露造成的实际损害。马萨诸塞州允许判赔高达三倍损害赔偿。北卡罗来纳州最高可判赔\
  \ 5000 美元外加三倍损害赔偿。在这十三个州中的三个州——加利福尼亚州、北卡罗来纳州和南卡罗来纳州——也提供禁令救济。俄勒冈州允许私人民事诉讼，但也允许在民事诉讼不切实际时命令赔偿。\n\
  \n对于承认与数据泄露相关的诉因的法律，各州也有差异。在内华达州，消费者无私人诉因，但数据收集者可对泄露系统的人提起诉讼。一些州为特定类别的泄露数据创设了诉权。新罕布什尔州允许在泄露影响医疗信息时对数据收集者提起民事诉讼。\n\
  \n#### IV. 加密要求\n\n各州通常也规定了加密在泄露是否触发法规中的作用。在一些州，如果解密手段也丢失，则丢失加密数据需要通知。否则，数据泄露法规通常仅适用于未加密数据。例如，在密苏里州，法规仅适用于“如果任何数据要素未加密、未编辑，或未以任何方法或技术以使姓名或数据要素不可读或不可用的方式进行其他更改”。密苏里州将加密定义为“一种算法过程，将数据转换为一种形式，在不使用机密过程或密钥的情况下，数据变得不可读或不可用”。此类别中的所有州都遵循将加密定义为数据转换以使其“无需使用机密过程或密钥即不可使用”的通用规则。如果密钥在泄露中也丢失，通知要求通常会被激活。\n\
  \n#### V. 数据泄露诉讼\n\n虽然一些州数据泄露法创设了诉因，但数据泄露后提起的大量诉讼依据的是普通法。一个日益可能变得重要的区别是数据泄露与数据滥用的区别，尽管目前法院经常不作此区分。\n\
  \n每当发生数据泄露时，共同因素是泄露信息的排他性丧失。数据泄露可能导致各种结果，但泄露之所以存在，是因为本应仅限于有限受众知悉的信息暴露在该受众之外。另一方面，数据滥用存在于未经授权的数据使用时。身份盗窃并非直接由数据泄露引起，而是由敏感数据的滥用引起。因此，数据泄露和数据滥用可能同时发生，也可能分别发生。虽然数据泄露可能是意外的，但数据滥用通常涉及某人的自愿行为。\n\
  \n\n\n\n\n##### 数据泄露诉讼中的责任与起诉资格\n\n虽然追究不法分子的责任更为理想，但在数据泄露的背景下这非常困难，因此数据泄露诉讼的焦点通常集中在泄露的一级受害者身上——即其计算机系统遭到入侵的实体。在其著作《事故成本》中，Guido\
  \ Calabresi 认为民事诉讼可用于控制事故成本，并将负担转移给最能预防事故的一方。根据这一观点，一级受害者的数据泄露责任对于提高整体安全性这一总体目标至关重要。通过胡萝卜加大棒的方式增加保护数据的激励，政府行动有助于构建更强大的网络安全环境。\n\
  \n在美国，数据泄露诉讼的结果难以预测。一项实证研究发现，当泄露影响的人数更多，或个人已因泄露遭受经济损失时，被泄露实体更有可能被起诉。历史上，向受害者提供免费信用监控服务的实体被起诉的比率较低。在诉讼中，提供免费信用监控似乎没有显著的负面影响，法院通常驳回“提供免费信用监控构成认罪”的论点。\n\
  \n在 Romanosky 的数据集中，76% 的诉讼为集体诉讼。一旦提起数据泄露诉讼，Romanosky 的计算表明诉讼以和解告终的几率约为 50/50。剩余的许多诉讼甚至无法通过庭前审查阶段。同一研究在数据泄露案件中发现了不少于\
  \ 86 种独特的诉因。一些常见的诉由基于州不公平商业行为法、联邦《公平信用报告法》、违约和过失。\n\n###### 起诉资格中的损害量化难题\n\n数据隐私侵权造成的损害难以量化，这给数据泄露诉讼带来了问题。许多在联邦法院提起的数据泄露诉讼甚至无法进入实质审理阶段，因为它们因缺乏《宪法》第三条要求的具体且特定的损害而被驳回。联邦案件中因缺乏起诉资格而被驳回的情况，通常基于关于未来损害起诉资格的判例法。\n\
  \n2013 年，最高法院在 *Clapper v. Amnesty International* 案中作出裁决。该案涉及 Amnesty International\
  \ 是否有资格质疑无证监控的合宪性。法院以 5 比 4 的表决结果裁定，无证监控可能造成的未来损害过于推测性，不足以构成“必然迫在眉睫”的损害。Amnesty\
  \ International 为保护通信免受监控而付出了高昂成本，但法院也拒绝了这一损害理论，指出“当事人不能仅因基于并非必然迫在眉睫的假设性未来损害而选择支出费用，就制造起诉资格”。\n\
  \n在尚未指控欺诈的数据泄露案件中，起诉资格分析因此往往聚焦于损害是否“必然迫在眉睫”。通常，法院寻找的损害是经济损害。即使在个人遭遇信用卡欺诈的案件中，发卡机构通常会吸收损失，因此面临身份盗窃风险的人可能没有资格起诉。身份盗窃的修复成本高昂，但尚未遭受身份盗窃的原告并未承担这些成本。大多数个人受害者顶多只支付了信用监控和其他微小交易成本。一些原告将其损害比作医疗监测案件，其中损害主要与未来患病的焦虑有关。\n\
  \n*Beck v. McDonald* 是第四巡回法院的一起数据泄露起诉资格案件，源于四箱病理报告和一台包含未加密患者文件的笔记本电脑被盗。法院未发现存在实质性的身份盗窃损害风险，因此拒绝了“盗窃行为足以构成起诉资格”的论点。法院不认定起诉资格的原因之一是，这将要求做出过多假设，例如笔记本电脑是因其中包含的信息而被盗。\n\
  \n虽然一些法院在驳回因缺乏起诉资格的数据泄露诉讼时引用了 *Clapper* 案，但也有其他法院作出了相反的裁决。在 *Galaria v. Nationwide\
  \ Mutual Insurance Company* 案中，第六巡回法院认定数据泄露原告主张的实质性未来损害风险足以构成起诉资格。第七巡回法院同样在两起案件中认定数据泄露可构成起诉资格所需的损害。与\
  \ *Galaria* 案类似，在 *Remijas* 案中，第七巡回法院得出结论认为存在实质性的未来损害风险。另一方面，第八巡回法院在 *In re Supervalu*\
  \ 案中虽未发现实质性的未来身份盗窃损害风险，但仍基于现存损害认定数据泄露原告具有起诉资格。这是因为其中一名信用卡信息泄露者在泄露后经历了该卡上的欺诈性收费。\n\
  \n数据泄露诉讼通常涉及财务信息或其他机密个人信息。在 *Galaria* 案中，被泄露被告是一家保险公司，泄露信息包括姓名、出生日期、社会安全号码和驾照号码。*Remijas*、*Lewert*\
  \ 和 *In re Supervalu* 涉及支付卡信息被盗。\n\n###### *Spokeo v. Robins* 案的影响\n\n紧随 *Clapper*\
  \ 案之后，最高法院在 *Spokeo v. Robins* 案中重新审视了起诉资格问题。*Spokeo* 案涉及基于被告违反 FCRA（《公平信用报告法》）的起诉资格。在该案中，原告起诉一家个人数据聚合公司发布关于他的虚假信息。法院得出结论认为，该虚假发布未主张任何损害。\n\
  \n2017 年，第三巡回法院将 *Spokeo* 案应用于一起数据泄露案件，并认定损害足以构成起诉资格。*Horizon* 诉讼基于 FCRA，正如 *Spokeo*\
  \ 诉讼一样，但第三巡回法院基于这样一个先例作出裁决：当起诉资格基于违反隐私法时，经济损失不是衡量损害的适当标准。因此，第三巡回法院隐含地得出结论，*Spokeo*\
  \ 案原告未因虚假信息发布遭受任何类型的损失（无论是经济上还是其他方面）。相比之下，受 *Horizon* 数据泄露影响的人员，其隐私因真实信息被传播而受到侵犯。\n\
