  \n\n\n\n\n## 第 7 章\n\n### 身份盗窃——联邦层面\n\n美国的身份盗窃法律在所有五十个州以及联邦层面均存在广泛差异。我们将首先概述现行的联邦法律，随后介绍各州法律及其共性与差异。\n\
  \n美国现行的联邦法律（[18 U.S.C. § 1028](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)）涵盖了八种不同的情形，采用了各种必要的犯罪意图和行为。所有这些罪行均被归类为“与身份证件有关的欺诈及相关活动”。第一条，[第\
  \ 1028(a)(1) 款](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，禁止明知故犯地制作身份证件。第二条惩罚明知身份证件被窃或系非法制作而仍予以转让的行为。第三，持有五份或以上身份证件（本人的证件或经持有者许可的除外）并意图非法使用或转让，属于犯罪。第四，根据[第\
  \ 1028(a)(4) 款](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，明知故犯地持有身份证件（适用上述相同例外情况）意图欺诈美国政府，属于犯罪。\n\
  \n第五种违法行为，[第 1028(a)(5) 款](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，不一定完全归属于联邦法律中列出的其他七种同一类别。它涵盖了持有、转让或制作“制证工具或防伪特征”，并意图用于制作虚假证件或其他制证工具的情形。\n\
  \n[第 1028(a)(6) 款](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)禁止明知为被窃或非法制作的美国身份证件或防伪特征而予以持有。第七种行为是明知故犯地转让、持有或使用属于他人的身份识别手段，并意图实施任何联邦罪行或任何州的重罪。最后，根据[第\
  \ 1028(a)(8) 款](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，不得明知故犯地贩运用于虚假身份证件的虚假或真实防伪特征。该法规将防伪特征定义为包括水印等事物。\n\
  \n联邦身份盗窃法规中与犯罪行为相关的动词有五个：制作、转让、持有、使用和贩运。[第 1028(a) 款](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 中包含的大多数违法行为要求的不仅仅是单纯的持有。[第 1028(a)(3) 款](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)禁止持有五份或以上身份证件并意图非法使用或转让这些证件。[第\
  \ 1028(a)(4) 款](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)禁止持有身份证件并意图欺诈美国政府。[第\
  \ 1028(a)(5) 款](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)禁止持有制证工具或防伪特征，并意图利用这些物品制作虚假身份证件。[第\
  \ 1028(a)(7) 款](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)禁止持有属于他人的身份证件并意图实施犯罪。对此例外的是[第\
  \ 1028(a)(6) 款](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，该款禁止在持有者知晓联邦政府签发的身份证件被窃或系无合法授权制作的情况下，持有此类证件。\n\
  \n\n\n\n\n#### 联邦身份盗窃法规：处罚与加重犯罪\n\n##### 联邦身份盗窃法规下的处罚\n\n在联邦身份盗窃法规中，与大多数州的身份盗窃法律一样，根据犯罪情节的不同，处罚程度也有所差异。\n\
  \n*   当伪造的身份证明文件为出生证明或政府签发的身份证明，或指控涉及“制作或转让超过五份身份证明文件……”，大多数犯罪的最高刑期为**十五年**。\n*\
  \   违反 `1028(a)(5)` 的，最高亦可判处**十五年**监禁。\n*   违反 `1028(a)(7)` 的，若被告因该违法行为获取价值 1,000\
  \ 美元或以上的利益，最高可判处**十五年**监禁；若被告获益价值不足 1,000 美元，最高可判处**五年**监禁。\n*   违反 `1028(a)(3)`\
  \ 的最高刑期为**五年**。\n\n##### 加重处罚\n\n若任何违法行为属于以下情形，处罚可增至最高**二十年**监禁：\n*   为贩毒提供便利时\n\
  *   与暴力犯罪相关联时\n*   在有前科定罪后实施\n\n若违法行为为国内或国际恐怖主义活动提供便利，最高可判处**三十年**监禁。\n\n企图和共谋实施这些违法行为，与实际犯罪的处罚相同。\n\
  \n若单纯违反持有条款 [`Section 1028(a)(6)`](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，且未伴随\
  \ [`Section 1028(b)`](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 中列出的其他加重因素，最高可判处一年监禁。\n\n##### 身份证明文件与识别手段的定义\n\n本节所用的身份证明文件通常指任何政府签发的身份识别文件，包括出生证明、驾驶执照或个人身份证。\n\
  \n此外，本节还定义了“识别手段”，该概念与“个人可识别信息”有大量重叠。联邦身份盗窃法将以下内容纳入其认定的识别手段范围：\n\n*   姓名\n*   社会安全号码\n\
  *   出生日期\n*   驾驶执照\n*   外国人登记号码\n*   政府护照\n*   雇主或纳税人识别号码\n*   生物特征数据（包括指纹、声纹、视网膜图像、虹膜图像或其他独特的身体特征）\n\
  *   电子识别号码、地址或路由代码\n*   电信识别信息或接入设备\n\n所有上述内容及更多项目，均以各种组合形式被纳入各州的身份盗窃法律中。\n\n#####\
  \ 加重身份盗窃 (18 U.S.C. § 1028A)\n\n美国还有一部联邦法规 ([`18 U.S.C. § 1028A`](https://www.westlaw.com/Document/NA573B040D9B511D8B577B397ED5BB27E/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0))\
  \ 专门针对加重身份盗窃。该罪名仅包含两种类型：\n\n1.  **明知故犯地使用、持有或转让他人的识别手段**，且与 [`Section 1028A(c)`](https://www.westlaw.com/Document/NA573B040D9B511D8B577B397ED5BB27E/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 列举的重罪之一相关联。违反此款将在基础重罪刑罚基础上**增加两年**刑期。\n2.  **明知故犯地贩卖虚假或真实的认证特征且与恐怖主义相关联**。此罪的处罚是在基础重罪刑期基础上**额外增加五年**。\n\
  \n###### 加重身份盗窃的基础犯罪\n\n支持以加重身份盗窃提起诉讼的基础犯罪均为联邦罪行，其中若干罪行涉及移民领域：\n\n*   [`Section\
  \ 1028A(c)(2)`](https://www.westlaw.com/Document/NA573B040D9B511D8B577B397ED5BB27E/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 引用了 [`18 U.S.C. § 911`](https://www.westlaw.com/Document/NFADCB760B36411D8983DF34406B5929B/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，该条款禁止虚假冒充美国公民。\n\
  *   [`Section 1028A(c)(6)`](https://www.westlaw.com/Document/NA573B040D9B511D8B577B397ED5BB27E/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 和 `1028A(c)(7)` 规定，当盗窃行为与美国法典第 18 编第 69 章和第 75 章的任何重罪违规相关联时，即构成加重身份盗窃。\n    *\
  \   第 69 章涉及国籍与公民身份。\n    *   第 75 章涉及护照与签证。\n*   《移民与国籍法》的特定违规行为也是加重身份盗窃的基础犯罪。\n\
  *   将身份盗窃提升为加重身份盗窃的其他犯罪还包括各类欺诈和金融犯罪。\n\n通过加重身份盗窃条款，联邦身份盗窃法强化了联邦移民法，但这种强化并非无限制的。\n\
  \n###### *Flores-Figueroa 诉美国案* (2009)\n\n2009 年，最高法院在 *Flores-Figueroa 诉美国案* 中作出了一致判决。[¹]\n\
  \nIgnacio Flores-Figueroa 是一名来自墨西哥的无证移民。\n*   2000 年，他使用以 Horatio Ramirez 名义伪造的永久居民卡和社会安全号码，在一家钢铁公司谋得职位。\n\
  *   2006 年，Flores-Figueroa 购买了带有自己姓名的伪造身份证明文件。\n\n虽然 Ramirez 身份证明文件对应的是虚构身份，且无真实人物持有该\
  \ Ramirez 社会安全号码，但新购买的身份证明文件所含的社会安全号码却与一名真实人物相关联。\n\nFlores-Figueroa 被指控违反 [`18\
  \ U.S.C. § 1546`](https://www.westlaw.com/Document/NFDA32A60B36411D8983DF34406B5929B/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)（滥用移民文件），该重罪属于美国法典第\
  \ 18 编第 75 章范畴，因此可作为指控加重身份盗窃的基础犯罪。\n\n####### 主观故意要求\n\n联邦身份盗窃法规要求特定的主观故意。[`Section\
  \ 1028`](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 和 `Section 1028A` 的所有违规行为均要求行为人**明知故犯**。\n\nFlores-Figueroa 明知购买的是伪造文件，但他不知情所购文件包含真实的社会安全号码。政府辩称，明知要求不延伸至被告是否知晓该身份信息属于他人。最高法院不同意政府律师的观点，推翻了第八巡回法院的判决。\n\
  \n####### *Flores-Figueroa 案* 后的解释\n\n依据 *Flores-Figueroa 案* 判决，联邦身份盗窃法规应被理解为：若被违反条款涉及“他人”，则要求行为人知晓所使用的身份信息属于他人。这包括：\n\
  \n*   [`Section 1028(a)(7)`](https://www.westlaw.com/Document/N2F5DFDC0CF3B11DAADF7EE7F81C867F0/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\n\
  *   [`Section 1028A(a)`](https://www.westlaw.com/Document/NA573B040D9B511D8B577B397ED5BB27E/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 的两项条款\n\n上述所有条款均涉及与“他人的识别手段”相关的行为。[`Section 1028A(a)(2)`](https://www.westlaw.com/Document/NA573B040D9B511D8B577B397ED5BB27E/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 下的恐怖主义犯罪，是这三项罪名中唯一一项也适用于使用虚假身份证明文件的罪名。\n\n[¹]: [556 U.S. 646 (2009)](http://lawschool.westlaw.com/shared/westlawRedirect.aspx?task=find&cite=556+U.S.+646&appflag=67.12).\n\
  \n---\n\n## 第 8 章\n\n\n\n\n### 州身份盗窃法\n\n美国经济依靠信用运转，因此身份盗窃可能引发诸多问题。如果身份盗窃者以他人名义开设账户且不偿还账单，良好的信用记录可能迅速变为不良记录。身份盗窃之所以成为一种普遍的现代威胁，部分原因在于数据不安全问题。除了上一章讨论的联邦身份盗窃法外，每个州也都针对该犯罪的某些形式制定了法律。在多个州执业的律师应注意，各州身份盗窃法之间存在许多细微差别，这些差别可能影响案件结果。仅持有本不该持有的信息是否足以构成犯罪？持有信息并意图将其用于非法用途呢？还是说必须等到信息被实际使用时才算作身份盗窃？\n\
  \n身份盗窃法的主要关注点是信息。信息为何被获取？信息如何被使用？身份盗窃法尤为关注 `PII`，根据询问对象不同，该缩写可能代表 personally identifiable\
  \ information（个人可识别信息）、personally identifying information（个人识别信息）或 personal identifying\
  \ information（个人身份信息）。各州对 `PII` 的认定略有差异。一些州将生物识别信息纳入定义，而另一些州则没有。网络相关法律之间存在大量重叠，出于身份盗窃目的的个人信息定义，通常类似于该州数据泄露法中对个人信息的看法。\n\
  \n各州身份盗窃法差异巨大，因此本章将主要关注关键差异类别。例如，在定义身份盗窃罪行时，各州使用了许多不同的动词。在涉及对数据或身份证件采取行动的条款中，这些动词可能包括\
  \ `take`（获取）、`obtain`（获得）、`possess`（持有）、`manufacture`（制造）、`record`（记录）和 `use`（使用）。通常，关于行为人“动词”识别信息或文件的条款，会伴随对行为人未来意图的描述。当存在我们所认为的“低动作”基准动词时，这种情况尤为常见。例如，[《明尼苏达州法典》第\
  \ 609.527 节](https://www.westlaw.com/Document/NADC8AC00CAC211DFA578CAF9FC5A6559/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 规定，当一个人“转移、持有或使用非其本人的身份，并意图实施、协助或教唆任何非法活动”时，即构成身份盗窃。`Possess`（持有）被我们视为一个低动作动词，因为它将身份盗窃法规变成了一种准未遂犯罪。请注意区分“为非法目的使用信息”与“持有信息并意图将该信息用于非法目的”。\n\
  \n为作演示，我们将描述俄亥俄州身份盗窃法的不同部分，该法是我们分析过的较为宽泛的法律之一。在俄亥俄州，该罪行包括持有他人个人身份信息并意图冒充该人。这种“持有并意图冒充”的标准，可以说低于更常见的“持有并意图欺诈”标准。俄亥俄州法律还包含从犯责任。此外，虽然大多数州强调个人信息主体未同意其信息被使用，但俄亥俄州实际上认定：将个人信息借给他人并意图欺诈，构成犯罪。意图欺诈而借用信息的人，在俄亥俄州法律下也是犯罪人。\n\
  \n#### I. 身份盗窃法的名称与类型\n\n每个州均认定身份盗窃为犯罪，但术语各异。例如，各州在将该罪行称为“身份欺诈”还是“身份盗窃”上可能存在差异。联邦身份盗窃法实质上两者兼用。联邦法\
  \ `Section 1028A` 提及“加重身份盗窃”，而主要罪名是“与身份证件有关的欺诈及相关活动”。各州如何对其身份盗窃法进行分类——无论是归为身份盗窃、身份欺诈，还是其他变体——值得斟酌。《内布拉斯加州法典》分别认定身份盗窃和身份欺诈。在内布拉斯加州，身份盗窃发生在行为人获取真实或虚假的识别信息，并意图将该身份用于非法目的时。而身份欺诈则发生在行为人\
  \ 1) 制造或篡改身份证件，或 2) “为任何欺骗目的”获取个人身份证件时。内布拉斯加州在“获取信息（身份盗窃）”与“获取证件（身份欺诈）”之间做出的区分，是大多数州不愿细分的细节，大多数州倾向于采用这两个术语的其中一种变体。\n\
  \n各州身份盗窃法涵盖的罪行性质通常相似。许多州强调信息的使用。加利福尼亚州设有两个不同罪行——未经授权使用个人身份信息，以及以虚假身份实施特定行为（类似于刑事冒充）。北达科他州也禁止未经授权使用个人身份信息。爱达荷州称之为挪用个人身份信息。缅因州将其归类为滥用身份证明。内华达州设有多个罪名，名称均较为模糊，但最好可描述为“身份冒充”和“公职人员身份盗窃”，两者均有不同严重程度。罗德岛州设有以虚假借口或冒充他人获取财产的特定罪行。西弗吉尼亚州认定冒用他人身份为罪行。\n\
  \n我们讨论身份盗窃的主要目的，在于提高对数据安全角度及受害者影响的认识，但某些州身份盗窃法甚至适用于采用虚假人设的情形。这引出了一个基本的法规分析问题：身份盗窃法旨在保护谁？\n\
  \n印第安纳州同时禁止身份欺骗和合成身份欺骗。印第安纳州目前是唯一使用“合成”限定词的州，尽管其他一些州强调其身份盗窃法适用于真实和虚构身份的使用。在俄勒冈州，《第\
  \ 165.813 节》涉及非法持有虚假身份证件。许多州还在法律中指出，身份盗窃禁令适用于真实识别信息的使用，无论数据主体是生是死。这包括《佛罗里达州法典》第\
  \ 817.568(8) 节，该条款禁止欺诈性使用已故个人和解散商业实体的信息。德克萨斯州也将已故个人列为可能的身份盗窃目标，[《德克萨斯州刑法典》第 32.51\
  \ 节](https://www.westlaw.com/Document/N210BEE50DE3111E2BC90EB2E88DA73D5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 将死胎婴儿或胎儿视为已故自然人，以适用身份盗窃法。\n\n\n\n\n\n##### 刑事冒名顶替与身份盗窃法律分析\n\n各州对刑事冒名顶替的处理方式存在差异。在阿拉斯加，刑事冒名顶替是指犯罪者持有并使用他人的身份证明文件作为自己的文件。在其他州，刑事冒名顶替包括假装成处于权威或信任地位的人。例如，除了单独的身份欺诈罪名外，阿肯色州还承认刑事冒名顶替，这涉及假装成执法人员或使用带有此类标志的车辆，使其看起来像执法车辆。1\
  \ 在纽约，假装成公职人员属于二级刑事冒名顶替，2 假装成执法人员属于一级刑事冒名顶替。3 在包括伊利诺伊州和田纳西州在内的某些州，刑事冒名顶替法律延伸至假装成武装部队成员，这类似于联邦《窃取荣誉法案》。\n\
  \n#### II. 意图\n\n身份盗窃法律通常取决于犯罪者的意图，例如犯罪者是否具有欺诈意图。在大多数州，身份盗窃法律指的是犯罪者具有某种欺诈或欺骗意图。许多州禁止利用他人身份协助实施犯罪，而其他州则宽泛地指代具有“非法目的”的行为。南卡罗来纳州的金融身份欺诈法规包含“非法设计欺诈计划或伎俩”的意图。4\
  \ 内布拉斯加州的身份欺诈法规分别提及具有欺骗意图的行为和为“任何欺骗目的”而实施的行为。\n\n许多州的规定更为具体。法律通常不只指代欺诈意图，而是具体说明犯罪者试图通过身份盗窃实现的目标。康涅狄格州的身份盗窃法包含“获取或试图获取金钱、信用、商品、服务、财产或医疗信息”的意图。5\
  \ 新泽西州的身份盗窃法禁止为获取福利或服务、或为逃避支付先前服务费用而实施身份盗窃。6 华盛顿特区的身份盗窃法针对犯罪者获取财产的意图，财产被广泛定义为包括不动产、动产、服务、信用、债务和政府福利。7\n\
  \n许多州的身份盗窃法律包含准未遂犯罪，即当像持有这样低程度的行为与实施非法行为的意图相结合时，即构成身份盗窃。二十七个州使用类似“持有并意图欺诈”的措辞来界定涉及个人信息收集的犯罪某些方面。其中一些州还禁止以欺诈意图获取信息，这是一种发生在持有阶段之前的低程度行为。十一州禁止持有身份盗窃工具并意图使用这些工具，或协助他人使用这些工具实施非法行为。在新墨西哥州，如果犯罪者知道支付卡丢失或投递错误，并意图使用该卡或将其出售给非持卡人或发卡机构以外的人，则持有该支付卡属于轻罪。\n\
  \n全国范围内最宽泛的基于持有的身份盗窃法规可能是佛罗里达州法典第 817.5685 条。该条款禁止明知未经授权以任何形式持有他人的个人身份信息。此处没有未来意图要求。佛罗里达州将个人身份信息定义为包括社会安全号码、政府签发的身份证号码、金融账户号码和医疗记录等。在佛罗里达州，持有五名或以上个人的信息将支持推定该持有行为是明知的、故意的和未经授权的。其他州也有类似法律，但没有佛罗里达州法律那样宽泛。加利福尼亚州承认持有真实身份证件的犯罪，马里兰州禁止持有虚假或欺诈性篡改的身份证件。宾夕法尼亚州禁止持有“明知其为伪造、篡改、不完整或属于未授权其持有的他人”的访问设备。佛罗里达州的法律不限于访问设备或文件，而是适用于以“任何形式”持有个人身份信息的情况。\n\
  \n在一些州，身份盗窃法律要求对信息采取某种行动。二十一州禁止使用身份信息试图获取某种利益。一些州使用更宽泛的语言，涉及使用或意图使用身份信息实施犯罪或用于其他非法目的。\n\
  \n通过未经授权使用他人信息所寻求的利益通常不是金钱上的。有几个州还包括利用他人身份获取就业。在亚利桑那州和佐治亚州，带有此类意图违反身份盗窃法将使该行为升级为加重身份盗窃。8\
  \ 包括新泽西州和南卡罗来纳州在内的几个州禁止使用他人的身份信息以逃避执法部门的侦查。在弗吉尼亚州，利用他人身份“逃避传票、逮捕、起诉或阻碍刑事调查”是非法的。北卡罗来纳州宽泛地指代“逃避法律后果的目的”的行为。阿拉巴马州承认利用虚假身份妨碍司法公正的犯罪，这大致与其他关于利用他人身份逃避逮捕的法律相呼应。\n\
  \n受害者的经济资源可能受到负面影响，例如窃贼使用被盗的信用卡号。但在许多情况下，受害者可能不会遭受任何经济损失。没有任何州要求受害者必须遭受经济损失，身份盗窃才能得到救济。在其身份盗窃法规中，亚利桑那州和纽约州均将受害者的经济损失作为一个因素，但在该等州，证明经济损失并非确立身份盗窃的唯一途径。\n\
  \n#### III. 冒名顶替\n\n冒名顶替或刑事冒名顶替通常与州身份盗窃法律相关联。许多此类法律涉及假装成他人以获取信息。例如，伊利诺伊州和内华达州是禁止假装成他人以获取该人信息的两个州。蒙大拿州认为此类行为属于刑事侵犯个人隐私。北达科他州和俄克拉荷马州禁止使用他人信息获取另一个人的个人身份信息，尽管从法定语言来看，不清楚这是否仅限于试图获取犯罪者所模仿之人的信息。一些州将假装成他人或组织的代表以获取利益定为犯罪。在纽约，向警方谎报姓名、出生日期或地址被视为冒名顶替。\n\
  \n许多刑事冒名顶替法律更多地是关于假装成某种类型的人，而不是假装成某个特定的人。纽约将向警方谎报身份定为犯罪，并承认一级刑事冒名顶替包括假装成警察的行为。因此，如果\
  \ Frank 向警官 Bob 谎报身份，但 Bob 实际上只是冒充警察，Frank 和 Bob 都具有各自犯罪所需的犯罪意图。然而，由于 Frank 的信念是错误的，Bob\
  \ 可能是唯一面临法律风险的人。\n\n\n\n\n\n##### 身份盗窃与犯罪冒名顶替\n\n身份盗窃与犯罪冒名顶替之间存在一定重叠，但并非完全重合。我们不会将犯罪人冒充执法人员以操纵他人的行为视为身份盗窃，但有几个州将这两种犯罪视为相关联的罪行。这些罪行确实具有欺骗和操纵的共同主题。有时会出现交叉，例如针对冒充武装部队成员的法规。纽约州的身份盗窃法将加重身份盗窃认定为一种犯罪，包括通过冒充犯罪人知晓的当前正在部署的特定武装部队成员来获取利益。2018\
  \ 年，田纳西州修改了其犯罪冒名顶替法规，将冒充武装部队成员以获取有形利益纳入其中。\n\n一些州将网络冒名顶替认定为独立罪行。在加利福尼亚州，有一项法律禁止在网上对他人进行“可信的冒名顶替”。在密歇根州，利用电子邮件冒充企业成员以实施犯罪属于违法行为。9\
  \ 纽约州同样禁止在网上冒充他人以获取利益或实施欺诈。纽约州还惩罚以行使权力为目的冒充“公职人员”进行网络冒名顶替的行为。\n\n#### IV. 关联罪行\n\
  \n##### a. 贩运被盗身份信息\n\n许多州将与身份盗窃相关的其他活动定为犯罪。最常见的关联罪行是贩运被盗身份信息。有十个州对此罪行有某种版本的规定。10\
  \ 田纳西州将其版本称为“身份盗窃贩运”，11 肯塔基州的版本称为“贩运金融信息”，12 堪萨斯州的版本称为“买卖虚假身份证件”。13\n\n堪萨斯州将身份证件定义为包括信用卡或借记卡、“驾驶执照、非驾驶人员身份证、出生/死亡/结婚/离婚证明的认证副本、社会安全卡和雇员身份证”。14\
  \ 阿拉巴马州和新泽西州也为其法规定义了身份证件，阿拉巴马州是极少数将护照列为身份证件形式的州之一。15\n\n阿拉巴马州、密苏里州和北卡罗来纳州均要求行为人意图将贩运的信息或文件用于实施身份盗窃。康涅狄格州和密歇根州要求意图实施任何犯罪，而肯塔基州将此意图作为选项之一。田纳西州要求意图出售身份识别手段。\n\
  \n在行为方面，阿拉巴马州、肯塔基州、密苏里州和新泽西州均将制造、分发或持有任何含有个人身份信息的物品纳入其中。亚利桑那州、康涅狄格州、堪萨斯州、密歇根州、北卡罗来纳州和田纳西州要求行为人明知故犯地出售或转让他人的个人身份信息，尽管田纳西州也将持有该信息纳入其中。新泽西州和田纳西州均要求行为人知晓购买信息或文件的人正在协助欺诈或造成伤害。田纳西州还要求行为人本应知晓这一点。\n\
  \n这些法规的处罚差异很大。阿拉巴马州的法规 16 规定了最严厉的惩罚，犯罪者因 B 级重罪面临 2 至 20 年的法定监禁。该法规还规定了最高 30,000\
  \ 美元的罚款。亚利桑那州规定了最高可能的罚款，属于 2 级重罪，最高罚款 150,000 美元，法定监禁 4 至 10 年。亚利桑那州还可判处最长七年的缓刑期。\n\
  \n康涅狄格州将该罪行定性为 D 级重罪，最高罚款 5,000 美元，最长法定监禁五年。堪萨斯州将其定性为 8 级非人身重罪，法定监禁 9 至 11 个月。肯塔基州将其定性为\
  \ C 级重罪，法定监禁 5 至 10 年。密歇根州规定最高罚款 25,000 美元，最长法定监禁五年。密苏里州将该罪行定性为 B 级重罪，法定监禁 5 至 15\
  \ 年。\n\n新泽西州最初将该罪行定性为四级犯罪，最高罚款 10,000 美元，最长法定监禁十八个月。如果贩运物品达二十件或以上，或来自五名或以上受害者的物品达五件或以上，则属三级犯罪，最高罚款\
  \ 15,000 美元，法定监禁 3 至 5 年。如果贩运物品达五十件或以上，或来自五名或以上受害者的物品达十件或以上，则升为二级犯罪，最高罚款 150,000\
  \ 美元，法定监禁 5 至 10 年。\n\n北卡罗来纳州将该罪行定性为 E 级重罪，法定监禁 15 至 63 个月。田纳西州将该罪行定性为 C 级重罪，最高罚款\
  \ 10,000 美元，法定监禁 3 至 15 年。\n\n##### b. 协助身份盗窃\n\n贩运是第三方因其对他人犯罪活动的贡献而承担责任的一种罪行类型。许多州还针对持有和使用身份盗窃工具进行了规定，通常单独设条款处理使用读卡器和重编码器窃取金融账户信息并将该信息转移到空白卡上的行为。犯罪人可能会在加油机的信用卡读卡器上安装读卡器。通过这种方式，犯罪人可以在不窃取实体卡的情况下获取卡片数据。通常，州法律对此类工具的规定要求持有工具且意图将其用于非法用途，但在佛罗里达州，持有读卡器即属重罪，无需涉及未来意图的表述。\n\
  \n少数州对明知接受虚假个人信息的第三方施加责任。佐治亚州认定“接收欺诈性身份识别信息的身份欺诈”17 为犯罪。亚利桑那州认定“明知故犯地接受他人身份”为犯罪，旨在打击明知故犯地接受虚假身份信息以核实雇佣资格的雇主。爱达荷州禁止持有行为人本应知晓是通过身份盗窃获得的商品或现金。18\n\
  \n三个州还涉及身份盗窃中销毁记录的某些方面。伊利诺伊州有协助身份盗窃的法规。19 例如，拉尔夫是一名政府职员，作为其工作的一部分可以接触到个人身份信息。伊利诺伊州法规规定，如果拉尔夫“明知故犯，且意图实施身份盗窃、加重身份盗窃或违反伊利诺伊州金融犯罪法的任何行为”，在未以某种方式销毁该信息的情况下予以处置，即构成犯罪。根据该条款，拉尔夫若仅因疏忽丢弃一堆文件而未对敏感信息进行特殊销毁，大概率不会惹上法律麻烦。\n\
  \n\n\n\n\n###### 伊利诺伊州在犯罪记录销毁条款方面独树一帜\n\n伊利诺伊州因其纳入了与记录销毁相关的刑事条款而独树一帜。在其他地方，记录销毁要求通常被视为监管违规。\n\
  \n在密歇根州，维护个人信息数据库者必须在个人从数据库中移除时，彻底移除并销毁关于该个人的信息。[¹³⁶]\n\n田纳西州同样要求负责任地销毁不再需要保留的个人信息。在田纳西州，违反该条款被视为违反州消费者保护法。[¹³⁷]\n\
  \n###### 主观恶意与协助者责任\n\n随着责任从最直接的不法行为人向外扩展，各州通常要求协助者与使用被盗信息的身份窃贼具有同等的 culpability（刑事责任/过错）。通常，身份盗窃所需的\
  \ *mens rea*（主观恶意/犯罪故意）为故意、知情或蓄意。极少数州承认鲁莽行为可支持作为主要或协助犯罪的身份盗窃责任。\n\n根据阿拉巴马州的《消费者身份保护法》，如果消费者报告机构在未能遵守消费者关于冻结因身份盗窃导致的信用信息变更的请求时表现出鲁莽行为，则可被追究民事责任。\n\
  \n在阿拉斯加州，一级刑事冒充要求行为人鲁莽地损害了受害者的财务声誉。\n\n在佛蒙特州，某人鲁莽地协助他人实施身份盗窃属于犯罪。[¹³⁸]\n\n特拉华州是唯一一个鲁莽的\
  \ *mens rea* 可支持身份盗窃主犯罪的州，因为该法律提及鲁莽持有信息。然而，即使持有个人信息是“鲁莽”的，该持有行为仍必须具有实施犯罪的意图。[¹³⁹]\n\
  \n#### 五、惩罚\n\n各州司法系统在如何给犯罪分级以及可施加何种监禁刑期或罚款方面存在显著差异。各州使用不同的标准来确定量刑和犯罪分级，因此在具体节点上比较各州是低效的。身份盗窃罪行可以是轻罪或重罪，且两者的区别往往取决于受害人或行为人是谁。\n\
  \n许多州承认可能加重惩罚范围的因素。在大多数州，惩罚可能受行为人获取的价值、受害人损失的价值或受害人数量的影响。约四分之一的州在受害人为老年人或属于其他弱势群体时，承认加重身份盗窃罪行。\n\
  \n内华达州针对公职人员实施的身份盗窃设有单独罪名。[¹⁴⁰] 两类身份盗窃均为 B 类重罪，但违反 `205.464` 条的最低监禁期限为五年，而更通用的 `205.463`\
  \ 条身份盗窃法的最低监禁期限为一年。此外，根据内华达州的通用身份盗窃法，针对老年人的身份盗窃违规最低监禁期限为三年，而如果行为人是违反 `205.464` 条的公职人员，最低监禁期限为七年。除受害人弱势性外，可能增加最低监禁刑期的其他因素包括受影响的受害人数量和受害人遭受的经济损害。\n\
  \n#### 六、受害人赔偿\n\n本节将讨论三种主要类型的受害人赔偿：身份盗窃护照、恢复原状（赔偿）和民事救济。\n\n身份盗窃受害人还受益于对信用报告机构施加要求的法律。\n\
  \n- 阿拉巴马州、弗吉尼亚州和新泽西州要求这些机构从消费者的信用档案中屏蔽因身份盗窃而添加的项目。\n- 特拉华州和蒙大拿州要求信用报告机构接受身份盗窃护照作为争议通知。\n\
  - 西弗吉尼亚州规定了当消费者请求安全冻结时信用报告机构的要求。\n\n此类冻结允许消费者阻止其信用报告中的新活动。消费者随后可根据需要解冻其信用。西弗吉尼亚州是少数几个在与身份盗窃相关的法规中涉及安全冻结的州之一。信用机构过去会对安全冻结收费，一些州身份盗窃法设定了可收取的安全冻结费用上限。自\
  \ 2018 年 9 月起，联邦法律要求信用机构免费向客户提供安全冻结。这一要求是作为国会于 2018 年通过的《经济增长、监管救济和消费者保护法案》的一部分而增加的。\n\
  \n十个州允许受害人申请身份盗窃护照。[¹⁴¹] 内华达州设有“身份盗窃计划卡”，似乎起到与身份盗窃护照相同的作用。在十个州中有八个（弗吉尼亚州和新墨西哥州除外）要求身份盗窃受害人在申请身份盗窃护照前必须先报警。获批的申请将转交州检察长，由其向受害人签发身份盗窃护照。\n\
  \n受害人可向执法机构出示身份盗窃护照，“以帮助防止受害人因他人使用其身份实施的犯罪而被逮捕或拘留。”[¹⁴²] 这类似于其他身份盗窃法律中关于受害人权利的条款，即如果犯罪是利用其信息实施的，受害人有权要求法院记录修改以反映其事实上的清白。在俄克拉荷马州，此类撤销记录可用于获取身份盗窃护照。身份盗窃护照也可与债权人和信用报告机构共享，作为潜在欺诈性指控的通知。\n\
  \n关于谁可以获得身份盗窃护照存在一些限制。\n\n- 爱荷华州要求受害人必须是该州公民或在爱荷华州遭遇身份盗窃，才能获得身份盗窃护照。[¹⁴³]\n- 内华达州法律规定，内华达州居民可在任何州向执法机构报案，但在内华达州遭遇身份盗窃的非居民必须在该州报案。[¹⁴⁴]\n\
  \n大多数州不使用身份盗窃护照这一工具。相反，各州通常规定身份盗窃受害人可寻求报销哪些费用。大多数州身份盗窃法涉及对身份盗窃受害人的恢复原状（赔偿）。这可能包括律师费、信用监控费用或更换支票的费用等。\n\
  \n在十个州，身份盗窃法为受害人创设了民事诉因。[¹⁴⁵] 另外三个州在有限情况下创设了民事诉因。\n\n- 南卡罗来纳州承认导致非法居留的身份欺诈受害人享有诉权，但不适用于普通身份欺诈。\n\
  - 加利福尼亚州和怀俄明州承认针对违反各自州在线冒充法的行为提起私人诉讼的权利。\n\n许多身份盗窃法根据受害人身份加重处罚或提高罪级。十三个州在受害人为老年人时规定更严厉的惩罚。一些关于冒充的州法律规定，如果被冒充者为执法人员或武装部队成员，则构成更高级别的犯罪。\n\
  \n[¹³⁶]: #section15.xhtml#ftn.136\n[¹³⁷]: #section15.xhtml#ftn.137\n[¹³⁸]: #section15.xhtml#ftn.138\n\
