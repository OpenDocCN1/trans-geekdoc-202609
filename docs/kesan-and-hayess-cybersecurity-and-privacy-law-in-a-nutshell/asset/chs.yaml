- "## Kesan 和 Hayes 的网络安全与隐私法概要\n\n\n\n献给 Rosalyn  \n—J.P.K.\n\n## 致谢\n\n本简明指南的内容部分基于作者过去十年的研究。我们对国家研究委员会就我们的主动防御研究提供的反馈表示感谢。我们也感激在关键基础设施韧性研究所（国土安全部卓越中心）内所有的合作机会。我们还要感谢\
  \ Katie Bethke 和 Kyle Dettro 提供的优秀研究协助。\n\n本书部分内容改编自作者发表在《哈佛法律与技术期刊》、《华盛顿与李法律评论》、《印第安纳法律期刊》、《密歇根州立法律评论》、《亚利桑那法律评论》、《明尼苏达法律评论》、《伊利诺伊法律评论》、《云计算百科全书》和《数字通信与社会国际百科全书》上的作品。我们也感谢这些出版物的编辑。\n\
  \n## 第 1 章\n\n### 导论\n\n网络安全是现代社会的一大关切。我们的现实生活与数字生活往往密不可分。律师及其委托人均深受网络安全事件影响。数据安全也正成为律师的一个职业道德问题。为保护委托人信息，律师必须采取积极措施保护数据，而不仅仅是避免泄露。\n\
  \n网络安全政策问题涉及国内法之外的私法和公法层面的国际法。网络安全形势造就了一个环境，要求普通执业律师应了解特定行为的国际影响。民用与军用信息基础设施的重叠意味着平民可能直接受到主权国家间网络战的影响。在本简明指南中，我们将概述许多与网络安全相关的主要法律问题。我们决定在本章首先简要介绍主要的国际网络安全问题，部分原因在于在网络安全领域，国内法与国际法之间没有清晰的界限。互联网提供了一个论坛，它既是世界上最大的会议室，也是世界上最大的战场。\n\
  \n网络安全并非律师可以置身事外、漠不关心的领域。它影响着政府、军队、大企业、小企业以及律师事务所自身。无论律师的委托人或执业领域如何，只要互联网仍然存在，人们在个人和职业生活中仍然使用计算机，数据安全几乎将成为律师所做一切工作的潜在关切。\n\
  \n#### I. 国际网络安全\n\n国际网络安全问题主要出现在过去十年中。2007 年，不明攻击者出于政治动机，对爱沙尼亚政府系统发动了网络攻击。2008\
  \ 年，针对格鲁吉亚的网络攻击与该国与俄罗斯的战争爆发时间吻合。2010 年，研究人员发现了 `Stuxnet`（震网病毒），这是一种恶毒且顽强的蠕虫病毒，它利用四个零日漏洞破坏伊朗的核离心机，引发了关于网络战的广泛讨论。零日漏洞是在被利用前未为发布者所知的安全缺陷，通常被认为相当罕见，这也是\
  \ `Stuxnet` 利用了四个此类漏洞令人印象深刻的原因。`Stuxnet` 强制离心机的控制系统使其超速旋转，导致烧毁，同时从监控人员的角度来看，仍保持着正常运行的假象。[1]\
  \ 受损的离心机被认为减缓了受影响设施中的铀浓缩进程。\n\n\n\n\n\n##### Stuxnet and the Physical Impact of\
  \ Cyberattacks\n\n震网病毒可能是利用网络攻击破坏物理基础设施能力的首个著名演示案例，但它既非首例，也绝非末例。2007 年，研究人员在爱达荷国家实验室进行了一项测试，通常称为“极光发电机测试”。[²]\
  \ 极光发电机测试揭示了黑客可以利用恶意指令导致发电机涡轮机过热并损坏设备，展示了网络攻击像物理攻击一样发挥作用的真实潜力。2014 年 12 月，德国的一份报告显示，一起网络攻击对一家德国钢铁厂造成了重大损害。迄今为止，网络攻击至少在两次高调事件中扰乱了乌克兰的电网，分别发生于\
  \ 2015 年 12 月和 2016 年 12 月。\n\n#### II. Domestic Cybersecurity\n\n网络攻击对国内事务也产生了重大影响。仅\
  \ 2011 年一年发生的重大黑客事件数量，就为网络安全成为美国政策中的核心关切奠定了基础。那年的著名攻击目标包括政府承包商、安全技术公司，以及索尼电脑娱乐等娱乐公司。利用网络攻击手段的行动主义，即“黑客行动主义”，因“阿拉伯之春行动”等事件而受到全球关注，政治活动家得到了松散的黑客组织“匿名者”的支持。\n\
  \n2011 年备受瞩目的美国攻击目标之一是政府网络安全承包商 HBGary Federal。当公司领导宣布准备揭露“匿名者”成员身份时，该黑客组织通过入侵 HBGary\
  \ Federal 的系统并从公司邮箱账户下载敏感信息进行了报复。HBGary 这场注定失败的挑战“匿名者”的尝试招致了批评，Brown 和 Metcalf 指出：“不幸的是，[CEO]未能遵循一条基本规则——在挑战黑客组织之前，确保你的计算机系统是安全的。”[³]\n\
  \n高调攻击持续不断，大量安全漏洞波及了个人信息被盗的无辜个人。2013 年假日购物季期间，Target 遭遇重大安全漏洞，黑客窃取了数百万条支付记录。Target\
  \ 的漏洞可能影响了多达三分之一的美国人口。2014 年 11 月，黑客从索尼影业娱乐服务器泄露了大量敏感信息，威胁如果索尼影业继续按计划上映《采访》（一部关于记者前往朝鲜的喜剧片），将造成进一步伤害。2015\
  \ 年 3 月，Premera Blue Cross 宣布遭到黑客攻击，导致 1100 万人的健康记录泄露。同年晚些时候，联邦人事管理局（OPM）宣布发现大规模窃取政府雇员及安全许可申请人个人信息的事件。虽然最初认为\
  \ OPM 黑客事件仅影响几百万人，但这一数字很快跃升至 2150 万。2017 年 Equifax 的数据泄露可能暴露了超过 1.45 亿美国成年人的完整信用记录。\n\
  \n此类安全漏洞是主要关注领域，且此类漏洞的威胁持续增长。然而，检测这些漏洞并不总是容易，有时是受害者以外的第三方首先发现。Verizon 2017 年数据泄露调查报告发现，27%的数据泄露是由第三方发现的。\n\
  \n当公司遭遇信息安全漏洞时，这些漏洞可能损害系统、降低业务运营效率并破坏消费者信心。Ponemon Institute 2015 年的一项研究估计，当机密信息被盗时，在美国应对漏洞的平均成本为每条记录\
  \ 217 美元。[⁴] 到 2018 年，这一数字已增至每条泄露记录 258 美元。[⁵] Target 漏洞发生后，据报道银行的成本约为 2.4 亿美元，仅用于更换受影响的卡片，不包括漏洞发生后产生的任何欺诈性费用。如果公司未能采取基本预防措施，如维护防火墙、保持防病毒软件更新、加密密码和信用卡号等敏感信息，风险将进一步加剧。\n\
  \n安全漏洞可能使公司面临各种责任，包括联邦贸易委员会（FTC）的制裁。2015 年，第三巡回法院裁定，FTC 可以根据其第 5 条权力（防止不公平或欺骗性行为或做法），起诉采用不充分安全措施的公司。[⁶]\
  \ 然而，FTC 倾向于依赖临时裁决，且第 5 条授权的处罚可能不足以威慑不良安全行为。第三巡回法院的裁决涉及 FTC 对温德姆酒店集团的诉讼，该诉讼于 2012\
  \ 年在发现多起数据泄露后首次提起。诉讼持续数年才达成和解。温德姆以未加密格式存储客户信用卡信息，未使用防火墙，且各分店通常使用易于发现的默认用户名和密码连接温德姆的中央网络。与\
  \ FTC 达成的最终和解仅涉及未来的监督，不包含任何财务处罚。[⁷] 这在很大程度上是 FTC 裁决的典型特征，和解令和同意令通常要求持续监督，而不对首次裁决施加财务责任。\n\
  \n网络安全事件可能带来广泛的后果。窃贼利用被盗信用卡进行购买的危险非常现实，但威胁远不止金钱损失。几乎每个行业都依赖有效的网络安全。针对医院的勒索软件攻击，甚至可能通过阻碍医疗专业人员获取准确及时的患者信息，而危及患者生命。在法律领域，保护客户信息已成为一种道德义务，而不仅仅是技术或财务问题。\n\
  \n本文无意危言耸听。相反，我们的目标是赋能律师了解这些风险，并将这些风险知识融入其职业和个人生活中。依赖数字信息存储存在风险，但几乎所有事物都伴随风险。关键在于意识到风险并采取措施加以缓解。驾驶风险可通过系安全带、定期车辆保养和遵守交通法规来缓解。信息安全风险类似，但威胁未被广泛理解，因此风险缓解颇具挑战。然而，随着时间的推移，信息安全实践将变得像系安全带一样成为第二天性。\n\
  \n在此期间，不确定性渗透法律职业在处理隐私和安全问题时的方方面面。在本书中，我们将探讨律师应牢记的判例法、立法和行政行动，无论他们是在处理网络安全案件，还是仅想了解互联网时代的安全与隐私。\n\
