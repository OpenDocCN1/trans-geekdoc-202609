  [¹⁴⁵]: #section15.xhtml#ftn.145\n\n\n\n\n\n## 第 9 章\n\n### 联邦网络安全法的近期变更\n\n十个州提供了一个流程，供身份盗窃受害者请求修改法庭记录，以反映受害者在针对使用其信息的身份窃贼的起诉中事实上的无辜。其中六个州——阿拉巴马州、加利福尼亚州、伊利诺伊州、北卡罗来纳州、犹他州和怀俄明州——并没有身份盗窃护照计划。密西西比州、蒙大拿州、内华达州和弗吉尼亚州都提供了修改法庭记录的这一流程，并且它们也拥有类似或等同于身份盗窃护照的制度。\n\
  \n这一身份盗窃法律摘要表明，立法者微小的措辞选择（“使用信息进行欺诈”对比“持有信息并意图用于欺诈”）可能会导致同一行为在跨州起诉时产生重大差异。\n\n1\
  \ [`A.C.A. § 5–37–208`](https://www.westlaw.com/Document/NDCC87BD040EE11E7920982F6038E6B32/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)。\n\
