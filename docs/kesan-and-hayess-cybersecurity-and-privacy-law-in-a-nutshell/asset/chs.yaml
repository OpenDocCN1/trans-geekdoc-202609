  \n\n\n\n\n## 第 10 章：网络安全与国际法\n\n国界对数据传输并无太大意义。法律从业者一直在钻研互联网相关国内案件中的管辖权问题。各州的网络犯罪法规通常专门规定管辖权问题。当相关国界涉及国际层面时，实体法律问题可能变得非常复杂。\n\
  \n本章侧重于国际法。[¹] 国际法的主要作用是管理国家间的关系。随着全球化的兴起，国际法持续演变。互联网和日益数字化的世界带来了新的挑战。在本章中，我们重点关注这些发展所牵涉最深的国际法层面。这包括条约、对两用物品的限制、对同时服务于军事和非军事目的目标的保护，以及战争法如何适用于网络武器。欧盟的《通用数据保护条例》（GDPR）将在后面关于隐私的章节中讨论。\n\
  \n正如我们之前所指出的，网络安全法正处于变动之中，讨论往往借鉴其他法律领域。这一挑战在战争法中尤为迫切。在网络战的背景下，什么规则适用于这些新型武器？战争法是由物理互动和威胁塑造的。无论是箭矢、长剑、投石机、AK-47、生物武器、凝固汽油弹还是核弹，常规武器的威胁都会影响物理环境，且通常很容易判断何时使用了武器。而对于网络武器，模糊点似乎无穷无尽。目前民用和军用信息基础设施也存在一些重叠，因此即使是私营部门的律师，也能从对网络安全相关国际法发展问题的一定认知中受益。\n\
  \n### I. 国际协定\n\n为解决网络武器国际法中的模糊性，一种选择是让各国共同起草条约。根据《国际法院规约》第 38 条的定义，国际条约是国际法的四大渊源之一。另外三个列举的国际法渊源是国际习惯、文明国家所公认的法的一般原则，以及司法判决。\n\
  \n《维也纳条约法公约》第 2 条将条约定义为“国家之间以书面形式缔结并受国际法管辖的国际协定”。条约也可能被称为其他术语，包括法案、议定书、公约或宣言。条约的制定包含几个阶段。首先，协商条约内容。然后，通过条约的最终形式。最后，一旦条约被通过，由同意受其约束的国家接受条约而使其生效。在某些情况下，签署条约即足以表示同意受其约束。但在其他情况下，可能还需要批准，这要求条约还须经签署国的国内议会或立法机关批准。非签署国也可能通过加入条约条款而成为条约缔约方，通常是通过提交加入书。\n\
  \n#### a. 示例——欧洲网络犯罪公约\n\n为制定针对网络犯罪问题的共同刑事政策，欧洲委员会制定了《欧洲网络犯罪公约》（ECC）。ECC 于 2001\
  \ 年 11 月 23 日开放签署。ECC 条款要求至少五份批准书，其中三份必须来自欧洲委员会成员国，该公约才能生效。ECC 于 2004 年 7 月 1 日生效。截至\
  \ 2018 年，欧洲委员会 47 个国家中有 46 个已签署或批准 ECC，俄罗斯是欧洲委员会内唯一的坚持不签署国家。\n\n除了 46 个成员国签署国外，还有\
  \ 13 个非成员国签署、批准或加入了 ECC：澳大利亚、加拿大、智利、多米尼加共和国、以色列、日本、毛里求斯、巴拿马、塞内加尔、南非、斯里兰卡、汤加和美国。ECC\
  \ 的存在表明，即使它未被广泛采纳，领导人也已意识到网络安全关切超越了国界。\n\nECC 分为四章和一个序言。第一章定义了一些关键术语。第二章涉及参与国应在国家层面采取的措施。第二章第一节是关于在各国间统一实体刑法。第一类法律涵盖危害数据和系统机密性、完整性和可用性的犯罪。ECC\
  \ 还要求参与国制定针对计算机相关伪造和欺诈、儿童色情制品以及侵犯知识产权的刑法。ECC 的其他方面涉及程序性要素，如数据保存、调查期间的数据收集和管辖权。ECC\
  \ 第三章规定了网络犯罪调查中国际合作的原则。ECC 第四章规定了公约通过和适用的最后条款。\n\n#### b. 出口管制\n\n涉及技术、国际法和商业的一个问题是出口限制的使用。美国政府拥有一套复杂的法规体系来管制出口。消费者在网上购物时，有时会注意到一条声明，称他们订购的产品不能运往美国境外。这类声明通常与出口管制有关。出口管制法规往往聚焦于恐怖分子或敌对国家可能用来危害美国的技术。许多此类技术被视为两用技术，即它们既有和平用途，也有进攻性应用。\n\
  \n加密技术长期以来一直被视为两用技术。美国对加密产品的出口法规时松时紧。密码学管制最早由国会于 1979 年引入。[²] 对密码学工具的出口限制导致了多起事件，研究人员在试图在国际会议上发表密码学研究时面临限制。[³]\
  \ 世纪之交前后，加密技术的大众市场变得更加自由化。到 2002 年，加密出口的门槛大幅降低，这显然是行业的一次胜利。\n\n现存的国际法已包含涉及两用物品的条约，如《生物武器公约》（BWC）。BWC\
  \ 旨在在防御性及和平的生物武器研究需求（如开发新型炭疽疫苗）与禁止最终具有破坏性目标的大规模研究需求之间，寻找一个可行的妥协方案。\n\n[¹]: 原文脚注\
  \ 1 参考。\n[²]: 原文脚注 2 参考。\n[³]: 原文脚注 3 参考。\n\n\n\n\n\n##### 出口管制与网络威胁\n\n##### 出口管制：瓦森纳协定\n\
  \n与条约一样，出口管制也可以集体讨论。其中一个自愿性制度是**《常规武器及两用物项和技术出口管制瓦森纳协定》**。瓦森纳协定是一个多边出口管制机制，拥有 41\
  \ 个参与国。2015 年，瓦森纳协定经过修订，纳入了“入侵软件”以及用于或与入侵软件交互的产品。[¹] 该协定明确提及了“专门设计或改装用于生成、指挥控制或传递‘入侵软件’的系统、设备及其部件”。该修正案在计算机安全行业内几乎遭到了普遍反对。\n\
  \n根据最初的措辞，当软件“专门设计或改装用于逃避计算机或网络设备的监控工具检测，或击败其防护对策”时，即成为瓦森纳协定下的入侵软件。具体而言，该定义聚焦于用于提取或修改数据，或利用外部指令修改目标程序动作的软件（例如利用缓冲区溢出漏洞的恶意软件）。不在该定义范围内的包括：虚拟机监视器、调试器、软件逆向工程工具和数字版权管理软件。“入侵软件”也不包括由制造商、管理员或用户安装的追踪软件。\n\
  \n2015 年，商务部**工业与安全局 (BIS)** 发布了一项拟议规则，旨在落实瓦森纳协定。[²] BIS 的提案将对出口与入侵软件相关的技术施加许可要求。由于监管机构听取了行业领袖的强烈抗议，该拟议规则并未颁布实施。\n\
  \n2017 年 12 月，瓦森纳协定再次修订，做出了多项令计算机安全业界满意的更改。增加了一项重要豁免，适用于试图进行国际漏洞信息沟通的安全研究人员。根据早先的措辞，瓦森纳协定将向研究人员施加繁重的许可要求，使得及时沟通时效性信息变得更加困难。尽管如此，瓦森纳协定的最终效力仍将取决于采纳该协定的国家以及这些国家如何解读其条款。\n\
  \n### II. 网络威胁与战争\n\n在将冲突原则应用于战场时，互联网时代创造了全新的战场，也带来了全新的复杂性。互联网在许多方面都是游戏规则的改变者。尽管它始于一项旨在确保通信能力在灾难面前具备韧性的政府项目，但互联网已成为一项变革性技术，极大地重塑了人们的生活、工作和娱乐方式。\n\
  \n截至 2018 年，国际法适用于网络战尚无正式共识，但新的研究有助于弥合理解上的鸿沟。**《塔林手册》**于 2013 年 4 月首次出版，是国际法与网络战问题专家小组历时三年完成的成果。该成果产出了一本\
  \ 300 页的手册，包含 95 条规则及解释性评论，全面而详尽地描绘了现有国际法原则在网络战中的应用。《塔林手册》不像**《欧洲网络犯罪公约》**那样是条约，也不像瓦森纳协定那样是自愿性协定，但它有可能为各国理解并将现有国际法应用于网络领域做出重大贡献。2017\
  \ 年，同一工作组发布了**《塔林手册 2.0》**。新版《塔林手册》扩展了对低于《联合国宪章》“武力使用”门槛的网络行动的法律分析。\n\n#### a. 网络威胁准备\n\
  \n一些国家设有专门负责网络战能力的军事部门。中国军队包含“信息作战部队”，朝鲜的**121 部队**专注于网络战。近期估计表明，目前有 140 个国家拥有或正在发展网络战能力。[³]\n\
  \n美国是发展网络战能力的国家之一。**美国战略司令部 (STRATCOM)** 是**国防部 (DOD)** 负责监控针对国防部系统攻击的部门。国防部负责保障\
  \ `.mil` 域的安全，并运营**美国网络司令部**以开展防御性和进攻性计算机网络行动。\n\n网络战活动很可能会被国防部视为“信息行动”。根据隶属于美国空军的**网络空间与信息行动研究中心**的定义，信息行动包括“电子战、计算机网络行动、心理战、军事欺骗和作战安全”。因此，网络战的讨论将涉及战争的所有根本问题，例如战争如何发动及管辖战争的规则，包括国家领导人的相应战争决策权力。正如\
  \ Brenner 和 Clarke 所指出的，网络战对军事领导人极具吸引力，因为它能节约人力和物力资源，尽管低成本也可能消除对进攻性行动的抑制因素。[⁴]\n\
  \n网络行动的重点很大程度上在于防御性能力的运用。美国领导人公开强调了网络安全对国家安全的重要性。分析和应对网络威胁长期以来一直是美国政府关注的领域。**“合格接收者”行动**是\
  \ 1997 年的一场为期 90 天的网络战演习，由 35 人扮演流氓国家。演习报告显示，政府和商业站点均易受使用“现成”技术的攻击。2002 年，**美国海军战争学院**模拟了一场针对关键基础设施的“数字珍珠港”攻击，以深入了解此类攻击将如何实施及其影响。据分析师称，当时发动足以瘫痪关键基础设施的攻击，攻击方需投入超过\
  \ 2 亿美元。\n\n自 2002 年以来，入侵技术已有长足发展。**“震网”病毒**展示了代码摧毁设备的潜力，近年来针对乌克兰电网的攻击表明，恶意软件可被用于制造大规模中断。许多近期网络事件被归因于国家行为体。2018\
  \ 年，国家情报总监丹·科茨警告称，关键基础设施可能面临类似“9·11”事件的网络攻击。尽管许多怀疑论者质疑网络攻击对关键基础设施实际潜在影响的范围，但这显然是一个新的战场。\n\
  \n许多其他国家也在采取措施应对未来的网络威胁。中国于 2011 年公开承认中国军队存在一个专注于网络安全事务的部门，但强调该部门专注于防御措施，而非进攻措施。2014\
  \ 年 5 月，**联邦调查局 (FBI)** 起诉五名中国军方官员，罪名是对美国实施网络间谍活动。2015 年，中国国家主席习近平与美国总统奥巴马达成协议，双方共同承诺不开展或支持为窃取对方知识产权而实施的网络盗窃活动。\n\
  \n[¹]: 原文参考脚注 4。\n[²]: 原文参考脚注 5。\n[³]: 原文参考脚注 6。\n[⁴]: 原文参考脚注 7。\n\n\n\n\n\n#####\
  \ 国际网络威胁与政府政策\n\n###### 俄罗斯的官方立场\n\n俄罗斯的官方立场，正如其在 2000 年向联合国提交的文件所表达的那样，是各国有义务避免开发和使用网络进攻技术。[8]\
  \ 《俄罗斯联邦信息安全学说》最近一次修订于 2016 年 12 月，强调防御，除了提及应对网络攻击的能力外，未涉及俄罗斯信息安全力量的进攻能力。关于俄罗斯信息战的争议全貌，特别是涉及\
  \ 2016 年总统大选的部分，超出了本简明教程的范围。\n\n###### 实际行动中的国际网络威胁\n\n现实已超越了模拟演练和政策辞令。2007 年 4\
  \ 月，源自俄罗斯的网络攻击持续数周，瘫痪了爱沙尼亚商业和政府部门的计算机网络。2007 年 6 月，源自中国的网络攻击导致华盛顿特区五角大楼的 1,500 台计算机瘫痪。2008\
  \ 年 7 月，网络攻击者对格鲁吉亚发动了协同网络攻击，随后不久俄格武装冲突爆发。2009 年，一系列分布式拒绝服务（DDoS）攻击导致吉尔吉斯斯坦一半的互联网服务提供商关闭。上述攻击均未被确定为国家资助，且将网络敌对行动准确归因于肇事方仍然非常困难。\n\
  \n上述事件均未像 `Stuxnet`（震网病毒）那样引发“网络武器”这一术语的使用。2010 年，安全研究人员发现了 `Stuxnet`，它被描述为一种复杂的网络武器，旨在渗透工业控制系统，特别是与伊朗核基础设施相关的系统。据估计，`Stuxnet`\
  \ 导致伊朗用于浓缩铀的离心机多达五分之一被毁。无人正式站出来认领 `Stuxnet`，但普遍认为 `Stuxnet` 是美国和以色列合作的成果。正如这些技术在现实世界中的应用所见，网络行动的性质、广泛范围以及来源的模糊性，凸显了在法律中彻底处理这些问题的必要性。\n\
  \n`Stuxnet` 并非网络敌对行动的开端，但它显然是一个转折点。据称涉及 `Stuxnet` 的行动始于 2007 年，尽管直到 2010 年才被发现。安全专业人员还怀疑\
  \ `Stuxnet` 与其他三个恶意软件包有关：`Flame`（火焰病毒）、`Duqu` 和 `Gauss`。\n\n随后几年的恶意网络安全活动可大致归为三类：监视与泄露、计算机服务或数据中断、物理基础设施中断。`Stuxnet`\
  \ 之所以重要，是因为它是首批得到确认的成功网络攻击之一，其造成的损害是物理上的，而不仅仅是数字上的。`Duqu`、`Flame` 和 `Gauss` 主要专注于信息窃取和监视。\n\
  \n研究人员怀疑有许多攻击是由国家实施或资助的。首先是 `Stuxnet` 系列恶意软件。随后在 2014 年，美国政府指责朝鲜黑客攻击 `Sony Pictures`（索尼影业），据称是为了报复即将上映的喜剧片*《采访》*，该片讲述了刺杀朝鲜领导人金正恩的阴谋。据称，由中国政府资助的黑客对\
  \ 2015 年披露的美国 `Office of Personnel Management`（人事管理局）黑客攻击事件负责。许多安全专家怀疑俄罗斯政府是 2015\
  \ 年和 2016 年分别导致乌克兰部分电网瘫痪的网络攻击的幕后黑手。同样在 2016 年，据称受俄罗斯政府指使的黑客对 `Democratic National\
  \ Committee`（民主党全国委员会）的黑客攻击负责。2018 年 7 月，特别检察官的调查起诉了十二名俄罗斯公民，指控他们涉嫌参与 `DNC` 黑客攻击以及针对选举基础设施的网络攻击。\n\
  \n普遍认为许多政府都在开发恶意软件。美国尤其因囤积零日漏洞以备将来使用，而非披露这些漏洞以便修复，而受到批评。例如，`National Security Agency\
  \ (NSA)`（美国国家安全局）被广泛认为利用此类漏洞开发了大量黑客工具。我们知道这一点是因为一个自称 `Shadow Brokers`（暗影经纪人）的组织于\
  \ 2016 年从 `NSA` 自身的服务器窃取了许多此类工具，并于 2017 年 4 月在互联网上发布了数十个工具。到 2017 年 6 月，其中一些工具已被改造为勒索软件攻击。臭名昭著的\
  \ `WannaCry`（想哭勒索病毒）攻击于 5 月底迅速蔓延全球，导致英国十多家医院被迫停止运营，直到重新获得计算机访问权限。另一个被称为 `NotPetya`\
  \ 的恶意软件包紧随 `WannaCry` 之后，尽管尚不清楚它们是否具有相同的 `NSA` 相关来源。`NotPetya` 伪装成勒索软件，但安全专业人员怀疑\
  \ `NotPetya` 仅旨在制造混乱，因为支付赎金的尝试均告失败。一些专家声称 `WannaCry` 和 `NotPetya` 均由俄罗斯情报机构创建。\n\
  \n政府还将恶意软件生产外包。这可能导致专门从事间谍软件开发的政府承包商的出现。2015 年，一家名为 `Hacking Team`（黑客团队）的意大利公司遭到黑客入侵，攻击者泄露了大量敏感数据。这些敏感数据中披露，`Hacking\
  \ Team` 的客户包括美国的多个机构。根据泄露信息，`Hacking Team` 的其他客户还包括哈萨克斯坦、沙特阿拉伯、尼日利亚和苏丹等国的政府。\n\n\
  ###### 网络安全中的政府与私营部门\n\n在网络战事务上，政府与私营部门的界限模糊不清。在某些情况下，政府已将操作网络技术以收集和分析情报的任务委托给私营公司。此外，一个国家的关键基础设施是恐怖分子极具吸引力的目标，在战时也可能成为目标。在美国，关键基础设施通常由私营部门拥有和运营。战争法禁止以不参与冲突的平民和民用物体为目标，但正如《塔林手册》第\
  \ 39 条规则所指出的，如果物体是两用的——即同时用于民用和军用目的——则该禁令不适用。因为此类物体用于军事目的，所以它成为合法的军事目标。根据《塔林手册》第\
  \ 51 条规则，只要攻击具有合法的军事目标，附带损害就是被允许的，前提是附带损害不“超过预期的具体和直接军事优势”。[9] 换句话说，如果美国发现自己与另一个国家处于战争状态，我们大部分的信息基础设施很可能都是合法目标。\n\
  \n\n\n\n\n##### 信息基础设施与关键基础设施\n\n信息基础设施是关键基础设施的一个子集。关键基础设施可定义为对国家福祉至关重要的系统，包括银行业、通信、公用事业、应急服务和交通运输。大多数关键基础设施为私有。成功的网络攻击可能会扰乱医院、国防系统、金融系统以及各种其他重要服务。针对交通运输部门的网络攻击可能导致飞机坠毁或列车相撞，而针对供水服务的网络攻击可能导致泄洪闸开启，或致使未经处理的污水被排入当地环境。\n\
  \n一个关键结论是，关键基础设施在未来的网络冲突中极有可能成为极具吸引力的目标，但保护关键基础设施的责任主要落在私营部门身上。在网络战背景下，这种平民与军事目标的重叠可能会带来问题。国际法目前为非战斗人员提供保护，但尚不清楚这些保护将如何适用于网络战场。例如，民间运营的关键基础设施是否应根据国际法受到保护，从而在战时不成为合法目标？军事对关键基础设施的依赖程度达到何种程度，才足以使该基础设施成为“两用”设施？最终，常规战争理论在多大程度上适用于网络战尚不清楚，尽管《塔林手册》提供了非常有益的指导。\n\
  \n### III. 网络战问题\n\n目前，关于如何根据国际法和战争法处理网络攻击存在大量不确定性。首先，存在严重的归因问题，因为网络攻击的源头最初很可能是未知的。由于网络攻击的成本低于物理攻击，资金相对有限的团体也可能实施网络攻击。将网络攻击归因于民族国家可能需要大量信息。《塔林手册》第\
  \ 8 条规则强调，将网络行动路由通过某一国家，并不使该行动可归因于该国；《塔林手册》第 7 条规则规定，即使网络行动是从政府网络基础设施发起的，仅凭这一点也不足以将该行动归因于该国。\n\
  \n因此，如果发生网络攻击，首要问题是攻击者的身份。如果外国行动是由公民而非政府行为体实施的，依据刑法追究肇事者责任将是可取的。然而，有效归因网络攻击仍然非常困难。2016\
  \ 年，一些影响美国的重大网络事件被追溯到俄罗斯情报机构 GRU。这一归因的主要来源据称是荷兰情报机构，其黑客在攻击发生前已攻入 GRU 的系统。\n\n《欧洲网络犯罪公约》为解决网络犯罪问题提供了一些指导和标准。然而，如果政府无法识别肇事者，刑事起诉将不可能进行。即使攻击被归因于非国家行为体，且东道国同意追究刑事责任，某些国家可能会根据受害者的身份对攻击者实施不同的惩罚，例如因攻击更敏感的计算机而加重制裁。国际法的某些领域也涉及执法部门的调查权限，例如欧盟的《申根协定》，允许执法官员追捕嫌疑人进入另一国家，前提是应该国要求停止追捕。\n\
  \n如果网络攻击被归因于政府行为体，战争法可能适用，这引发了与网络战相关的更复杂问题。网络战行动可能限制附带动能损害，但网络战敌对行动仍可能升级为动能攻击。正如近期美国及全球发生的网络攻击所证明的，网络攻击的影响可能非常严重。例如，针对医院的勒索软件攻击阻碍医生和护士访问重要患者数据，或乌克兰大范围地区的停电。\n\
  \n在网络语境下，有许多潜在的权威可指导行为。如前所述，《塔林手册》为自愿准则提供了良好基础。关于现有法律如何适用于网络冲突存在模糊地带。条约是国际义务的一个来源，例如《联合国宪章》以及《海牙公约》和《日内瓦公约》。例如，《国际电信公约》于\
  \ 1973 年 10 月生效，禁止缔约方有害地干扰电信，《防止危险军事活动协定》禁止有害地干扰军事对手的指挥和控制系统。\n\n学术界讨论常建议依据《武装冲突法》（“LOAC”）和《联合国宪章》来评判网络攻击。LOAC\
  \ 有两项核心伦理原则：第一，如果一国对另一国使用武力，必须有正当理由；第二，如果暴力冲突爆发，各方应尽量减少不必要的人员痛苦。\n\n#### a. 攻击责任\n\
  \n判例法已就这些原则的一些较为模糊的应用有所发展。即使国家政府并未直接控制网络攻击，该政府仍可能对其境内第三方的行为承担责任。在“科孚海峡案”中，国际法院（“ICJ”）裁定，一国有义务不得明知其领土被用于侵犯其他国家权利的行为，这一裁定在“德黑兰案”中得到重申。10\n\
  \n在其专注于非国家行为体网络攻击者的行为能否归因于其原籍国的文章中，Sklerov 建议了关于国家必须对第三方拥有多少控制权的最宽泛标准：“间接责任”。根据间接责任标准，如果一国庇护某团体（如恐怖组织），并在另一国要求后拒绝停止庇护，则该国可对该第三方的行为承担责任。这一标准曾在恐怖组织行为的背景下被讨论，包括美国对\
  \ 2001 年 9 月 11 日袭击事件的回应。在那种情况下，国际社会认定基地组织的行为可归因于阿富汗塔利班政府。然而，正如 Sklerov 所指出的，任何跨境回应行动应限于针对实施初始攻击的非国家行为体。\n\
  \n“间接责任”测试侧重于东道国所负义务的存在及其违反情况。依据习惯国际法，一国所负义务可能包括通过严格法律将特定行为定罪、积极调查犯罪、起诉攻击者，以及在调查期间与受害国合作。国际法判例也支持国家负有防止针对其他国家攻击的肯定义务。然而，这些案例是否适用于网络攻击以及动能攻击，仍是一个悬而未决的问题。\n\
  \n\n\n\n##### “间接责任”测试\n\n“间接责任”测试可能会导致认定接收国违反了其对其他国家负有的义务，但这种违反义务的行为并不一定意味着受害国现在与接收国陷入了国际武装冲突。如果将非国家行为体的敌对行为解释为造成了国际武装冲突的局面，可能会产生许多负面后果。因此，用于评估非国家行为体的敌对行为是否可归因于某一国家、从而足以认定存在国际武装冲突的测试，要比“间接责任”测试严格得多。\n\
  \n在《塔林手册》第 22 条规则附带的注释 2 中，专家们采用了“总体控制”标准，以判定非国家行为体的行为何时会导致认定冲突属于国际性质。在网络冲突背景下，一国必须行使超越单纯财务控制的“总体控制”，非国家行为体的行为才会被解释为具有国际性质。“总体控制”测试源自前南斯拉夫问题国际刑事法庭审理的塔迪奇案，该案的焦点在于一外国是否对一个有组织、有等级结构的群体行使了“总体控制”。这一“总体控制”测试要求该外国还协助了该组织军事或准军事活动的规划，但不要求该外国实际下达了导致非国家行为体违反国际法的命令。\n\
  \n第三种、范围更窄的选择是国际法院在尼加拉瓜案中确立的“实际控制”测试。根据尼加拉瓜测试，要证明实际控制，必须确定该国“指使或强制实施了申请国指控的那些违反人权和人道主义法的行为”。11\
  \ 这一测试比“总体控制”测试更严格，因为它要求支持非国家行为体的外国还必须下达了导致违反国际法行为的命令。在第 24 条规则中，《塔林手册》采用了一种“实际控制”测试的变体，以对指挥官因下属行为而承担的刑事责任进行规定。12\n\
  \n#### b. 战争法\n\n如果网络敌对行为可归因于某一国家，战争法将适用。战争法分为两部分：*诉诸战争法*（jus ad bellum），即冲突管理法；以及*交战法*（jus\
  \ in bello），即武装冲突法。*诉诸战争法*是适用于冲突前的一套法律（如《联合国宪章》第 2 条第 4 款，禁止使用武力），而*交战法*管辖冲突期间的行为，主要由《海牙公约》和《日内瓦公约》及国际习惯法管辖。\n\
  \n*诉诸战争法*是否提供了足够的保障来应对网络攻击，目前尚不清楚，部分原因在于归因和定性网络攻击存在困难。《塔林手册》在第 10 条规则中强调，如果网络攻击构成对一国的威胁或使用武力，则根据*诉诸战争法*属于非法。13\
  \ 《塔林手册》第 11 条规则规定，如果网络行动的规模和效果类似于构成使用武力的非网络行动，则应将其视为“使用武力”。14 《联合国宪章》常被引用于国际法与网络攻击的语境中。与本讨论特别相关的《联合国宪章》条款是第\
  \ 2 条第 4 款、第 39 条和第 51 条。\n\n第 2 条第 4 款禁止以“与联合国宗旨不符”的方式对国家进行“威胁或使用武力”。这项对使用武力的绝对禁止只有两个例外：安理会授权的行为，以及出于自卫而采取的行为。第\
  \ 39 条赋予联合国安理会权力：（1）确定何时存在对和平的威胁、破坏和平或侵略行为；（2）提出建议以维护国际和平与安全。根据第 51 条，针对联合国会员国的“武装攻击”，存在行使自卫的权利，尽管行使自卫的一方必须通知安理会。当满足第\
  \ 39、41 和 42 条的条件时，第 42 条允许安理会使用武力以恢复和平。\n\n#### c. 诉诸战争法：使用武力与武装攻击\n\n根据《联合国宪章》第\
  \ 2 条第 4 款，何为“使用武力”有时并不明确。通常，经济制裁不被视为使用武力，但经济封锁属于使用武力。常规武器攻击肯定属于第 2 条第 4 款中的“使用武力”范畴，旨在造成物理损害或人员伤亡的网络攻击也可能被归类为使用武力。然而，国际社会在网络攻击总体上是否可被视为武器、使用武力或武装攻击这一问题上，尚未达成共识。《塔林手册》第\
  \ 11 条规则采用了一种“规模与效果”测试，在判定网络行动是否构成使用武力或武装攻击时，将其与规模和效果相当的非网络行动进行比较。15\n\n然而，在分析规模与效果之前，存在一个门槛问题，因为《联合国宪章》并未定义“使用武力”或“武装攻击”这两个术语。尽管《联合国宪章》条款未包含这些术语的明确定义，但还有一些额外文件可为理解这些术语提供指导。\n\
  \n根据《日内瓦公约》共同第 2 条的官方评注，“事实上的敌对行动”足以认定存在“武装冲突”，这表明公约意在让“武装冲突”一词具有较低的门槛。联合国大会 1974\
  \ 年 12 月通过的《侵略定义》决议，提供了符合侵略行为资格的国家行为示例。该决议还将侵略定义为“国家以武力侵犯另一国家的主权、领土完整或政治独立，或以与《联合国宪章》不符的任何其他方式使用武力。”\n\
  \n《侵略定义》可被理解为为国际法下的“武装攻击”定义提供指导，尽管《侵略定义》主要涉及“武装力量”和侵略。有益的是，《侵略定义》决议提到了“违反《联合国宪章》的侵略行为和其他使用武力行为”，表明并非所有使用武力都是侵略行为，但所有侵略行为都是使用武力。由此可以得出结论，某些使用武力行为的破坏性会比侵略行为大或小。\n\
  \n\n\n\n##### 武力使用与武装攻击的界定\n\n但是，侵略行为属于武力使用中较轻微的一端，还是较严重的一端？《联合国宪章》第 39 条的措辞涉及安理会对“任何和平威胁、破坏和平行为或侵略行为”的权力。这使我们得出结论：侵略行为是一种不构成武装攻击的武力使用，因为《联合国宪章》第\
  \ 51 条明确保留了国家针对“武装攻击”行使自卫权的权利。因此，“武力使用”是一个光谱：在破坏性较小的一端是侵略行为；在破坏性较大的一端是武装攻击。综合来看，这表明《联合国宪章》下的“武力使用”类似于《日内瓦公约》下的“武装冲突”，且《联合国宪章》第\
  \ 51 条下的“武装攻击”应根据《侵略定义决议》中关于“侵略行为”的关系来解读。在此观点下，“武装攻击”是加重的“武力使用”，而“侵略行为”则是虽不那么严重但仍能触发联合国安理会权威的行为。\n\
  \n在评估作为“武力使用”的攻击是否上升到“武装攻击”级别时，一种方法是使用皮克特测试，该测试考虑攻击的范围、持续时间和强度。让·皮克特是瑞士法学家，也是 1949\
  \ 年 8 月 12 日《日内瓦公约》的总编辑。应用皮克特测试时，有三种近期模型：\n\n*   **基于工具的模型**：考察造成的损害类型是否为过去需要动能攻击才能实现的类型（例如关闭电网）。\n\
  *   **基于效果的模型**：关注对受害国的整体影响（例如针对金融机构的信息攻击，导致受害国经济福祉遭受重大损害）。\n*   **严格责任模型**：将任何针对关键基础设施的网络攻击均视为武装攻击。\n\
  \n针对这一问题，最受推崇的基于效果的模型之一是施米特模型，该模型提出了一种侧重后果的方法，考量六个要素以确定网络攻击是否构成国际法下的“武力使用”：严重性、即时性、直接性、侵入性、可测量性和推定合法性。16\
  \ 另一种判断行为是否为“武力使用”及/或“武装攻击”的方法是定义方法，该方法考察：(1) 网络武器是否被用于“针对国家的财产或人员”；(2) 外国是否明知允许其法律控制下的实体使用该网络武器针对受害国。\n\
  \n关于“武力使用”和“武装攻击”术语，最早提出的担忧之一是：网络攻击可能因目标是计算机或网络而非建筑物、车辆或人员，而不符合任一概念的要求。\n\n试图监管网络攻击的另一困难在于：网络攻击能力可能广泛地为非国家行为体（如无意遵守国家间任何协议的恐怖组织）所获取，这反过来可能降低国家依据《联合国宪章》指导其对国际网络攻击做出回应的意愿。然而，已批准或采纳《欧洲网络犯罪公约》（ECC）的国家可能已建立足够的控制措施，以有效处理其境内的网络犯罪。因此，若\
  \ ECC 是应对网络犯罪的有效方法，采纳 ECC 可减少根据国际法追究国家因公民实施网络犯罪而承担责任的必要性。\n\nECC 目前是唯一明确解决网络犯罪问题的国际条约，它强调通过执法部门与政府其他部门的合作来应对网络攻击。ECC\
  \ 要求缔约国通过刑法禁止未经授权的访问以及对数据和计算机系统的干扰。ECC 还包含建议缔约国在其国内法中采纳的程序和保障条款，并包含数条强制缔约国间进行国际合作的条款。ECC\
  \ 确立了缔约国应采纳并适用作为网络犯罪法规的最低标准，呼吁缔约国禁止非法访问、非法拦截非公开传输、数据干扰、系统干扰和设备滥用。ECC 分别处理两类损害：(1)\
  \ 数据损害；(2) 计算机功能损害。除了将网络攻击定罪外，ECC 还确认国家有义务防止非国家行为体利用其领土对其他国家实施网络攻击。然而，许多批评者认为 ECC\
  \ 无效，因为网络领域潜在的主要参与者中有不少并非缔约国。\n\n即使在某些情况下网络攻击可构成“武装攻击”，使得依据《联合国宪章》第 51 条行使自卫行动成为正当，自卫行动的范围仍然模糊。第\
  \ IV 节将更详细地讨论自卫问题。\n\n##### 战时法\n\n一旦冲突开始，战时法即开始适用。战时法传统上聚焦于动能武器，但国际法院在其《核武器咨询意见》中指出，武装冲突法适用于“任何武力使用，无论所用武器为何”。然而，国际法下缺乏公认的“武器”定义，因此当问题涉及卷入冲突的国家时，网络武器是否会被视为武器尚不清楚。因此，正如战前使用网络能力时《开战法》的适用不明确一样，冲突期间使用网络能力时《战时法》的适用也可能不明确。鉴于武装冲突相关问题的复杂性，《塔林手册》第一版从第\
  \ 20 条规则起的大部分内容均致力于网络武装冲突法。\n\n战时法包含对目标的限制，将目标限定为直接为敌方战争努力做出贡献且若受损或摧毁将产生军事优势的实体。战时法允许直接攻击战斗员，但非战斗员平民不得成为目标，除非其直接参与敌对行动。根据《日内瓦公约》第\
  \ 43 条第 2 款，战斗员被定义为“冲突一方武装部队的成员”，他们“有权直接参与敌对行动”。美国目前的立场是，战争中有三类人员：合法战斗员、非法战斗员和平民。\n\
  \n战时法还要求攻击与所获军事优势成比例，禁止背信弃义行为，要求遵守军事必要性原则，并要求行动者在实施攻击时尽合理努力区分军事与民用资产和人员。我们依次描述这些要求。\n\
  \n首先，比例性原则要求造成的损害与攻击所获军事优势成比例。然而，预测网络攻击可能造成的附带损害需要大量情报，且难以反驳企图主张网络攻击不成比例从而违反武装冲突法（LOAC）的国家提出的虚假附带损害指控。\n\
  \n\n\n\n\n##### 规则禁止背信弃义\n\n第二，禁止背信弃义的规则基本意味着战斗员不能通过欺骗手段利用敌方对武装冲突法（LOAC）的遵守来对付敌方。例如，战斗员使用受保护实体的标志（如国际红十字会），而敌方不能合法攻击该实体，以便接近并实施自己的攻击，这将违反禁止背信弃义的规则。目前尚不清楚这一原则是否或何时会因攻击者的网络钓鱼活动而被触发。\n\
  \n##### 区分原则\n\n最后，区分原则强调了区分军事目标与非军事目标的必要性。区分原则并未明确禁止不分皂白的武器，但鼓励冲突各方使用能够区分军事和民用资产的武器。\n\
  \n##### 中立国豁免权\n\n战争法（jus in bello）的另一个重要方面是中立国享有免受攻击的豁免权，前提是它们保持中立。由于网络空间缺乏国界，这一原则在网络攻击案件中可能变得复杂。例如，Kastenberg\
  \ 表达了担忧：如果中立国的私人行为者采取措施帮助卷入冲突的国家的政府行为者（例如为遭受围攻的计算机系统提供支持），该中立国在冲突中的中立地位是否会受到损害。鉴于与中立相关的重要问题，《塔林手册》第\
  \ 7 章专门讨论了关于中立和网络战的规则。\n\n#### 国际法下的网络防御\n\n许多关于网络战的讨论都假设军事网络攻击学说将遵守战争法原则。据称，美军将战争法的标准原则应用于网络攻击，持这样的立场：网络攻击应满足战争法关于军事必要性、相称性和区分性的要求。美国国会\
  \ 2012 年《国防授权法案》第 954 条也明确规定，管辖动能冲突的相同规则将适用于网络冲突。然而，正如战争法（jus ad bellum）原则如何适用于正式冲突开始前的网络侵略尚不清楚一样，战争法原则如何适用于正式冲突期间的网络侵略也尚不清楚。因此，像《塔林手册》这样的新资源的出现非常重要。显然，网络战问题在国际舞台上受到越来越多的关注，《塔林手册》很可能只是国际协作项目的第一个，旨在就这些关键议题达成共识。\n\
  \n##### 国际法条款\n\n一些国际法条款涉及自卫问题。《联合国宪章》第 51 条下的自卫、习惯国际法下的预防性自卫以及报复措施，是分析网络防御的三种可能学说。Oppenheim\
  \ 的国际法论著断言，武力使用可构成自卫，当其是对武装攻击的回应时；或在预防性自卫情况下，当满足以下条件时：（1）武装攻击迫在眉睫，（2）存在采取防御行动的紧迫必要性，（3）除自卫外别无可行选择，（4）自卫行动仅限于防御需要。自卫权的存在也可能增强国际法为威慑网络攻击而产生的威慑效果。\n\
  \n##### “武装攻击”认定\n\n根据《联合国宪章》第 51 条，一个国家是否有权因网络攻击而行使自卫，取决于最初的网络攻击是否构成“武装攻击”。第 51\
  \ 条的措辞提到，在发生针对联合国会员国的武装攻击时，存在“固有的个人或集体自卫权”。但目前尚不清楚应赋予谁权力来决定网络攻击是否足够严重，以证明根据第 51\
  \ 条行使自卫是正当的。一种理论认为，系统管理员需要被委以描述入侵性质并决定网络反击是否恰当的职责，部分原因是高级政策官员无法参与决策的所有层面。\n\n#####\
  \ 自卫的限制条件\n\n第 51 条保留了针对武装攻击进行自卫的固有权利，但正如受战争法管辖的行动必须遵守区分和相称等原则一样，自卫的使用反过来又受到必要性和相称性要求的限制。评估是否满足必要性要求，涉及确定是否可能通过更和平的解决方式、评估侵略的性质和各方的目标，以及估计干预有效的可能性。相称性要求回应仅限于合理必要的武力程度，以中断正在进行的攻击或威慑未来的攻击，但这一相称性要求并不要求回应必须限于攻击者最初使用的武力数量或类型。不过，Graham\
  \ 指出，使用动能武器回应网络攻击可能是不相称的，且不如以牙还牙的回应有效。\n\n除了必要性和相称性，战争法（jus ad bellum）下的自卫还要求即时性，但在国际法下，即时性原则非常宽泛，可能允许在初始攻击发生数天或数周后进行回应。\n\
  \n网络反击将受到这三项原则的限制，不得构成报复或惩罚性行动。因此，作为国际法问题，网络反击的执行必须严格遵守缓解原则，而不承担报复性目标。这些要求也呼应了“正义战争”学说下有效反击的传统要求。正义战争学说要求有效反击必须满足：（1）若不反击，将面临严重损害的威胁；（2）反击有严肃的成功前景；（3）没有实际或有效的替代反击方案。\n\
  \n##### 归因问题与应对危机\n\n“武装攻击”的区分是《联合国宪章》第 51 条下自卫概念的核心。即使网络攻击可被视为“武装攻击”，如果攻击不能归因于国家行为体，目前也不清楚是否允许以自卫名义进行回应。在这些情况下，受害国发现自己陷入“应对危机”，即它们无法干涉他国内政，必须依赖另一国通过其刑法体系来处理攻击。然而，在极端情况下，可能会承认国家有权针对非国家行为体行使自卫，例如\
  \ 2001 年 9 月 11 日基地组织袭击美国，联合国安理会重申美国有权根据第 51 条行使自卫。如果一个国家对第三方行为负有“间接责任”，则该国可能需承担责任，从而允许网络攻击受害者利用自卫权回应非国家行为体的网络攻击。“间接责任”意味着该国疏于履行防止其境内人员对其他国家实施犯罪的义务。然而，受害国的目标必须限于非国家行为体攻击者，除非其合法的跨境行动遭到东道国武力阻挠。\n\
  \n\n\n\n因此，当前的国际法范式限制了可用的响应选项，因此在不潜在违反国际法的情况下难以应对攻击。然而，Sklerov 建议，与使用动能攻击来应对网络攻击相比，用网络攻击回应网络攻击更有可能符合武装冲突法（jus\
  \ in bello）的区分、人道、必要性和比例性原则。20\n\n即使能够确定攻击源，受害国系统的系统管理员还必须绘制攻击计算机系统的图谱，以确定系统的功能以及关闭系统可能导致的后果。这将有助于确保主动网络防御符合区分和比例性原则。由于当前的技术限制，要对特定攻击者进行“外科手术式打击”很可能是不可能的，对无辜系统的损害可能被视为违反战争法的区分和比例性原则。触犯国际法的危险是使用最精准的技术来探测、追踪和应对网络攻击至关重要的原因之一。\n\
  \n另一个有争议的问题是，网络反击是否只能由根据战争法被视为“合法战斗人员”的人来实施。如果私人实体对外国攻击者进行网络反击并对该国的其他公民造成伤害，该私人实体可能会失去其作为受保护非战斗人员的地位。\n\
  \n国际法还包含预期自卫的概念，当自卫的必要性是即时且压倒性的、没有其他应对方式、也没有时间进行审议时，即允许预期自卫。这是 1837 年一艘船遭袭后产生的 Caroline\
  \ 预期自卫标准。预期自卫的即时性要求取决于国家的实力，它要求：(1) 侵略者致力于发动武装攻击，以及 (2) 如果防御方等待回应，其自卫能力将受到阻碍。如果有证据表明针对某国的持续行动正在进行，则可能授权预期自卫，因为未来的武装攻击被视为迫在眉睫。\n\
  \n目前尚不清楚《联合国宪章》第 51 条是否允许预期自卫。一种观点认为，由于第 51 条的措辞，自卫严格限于应对“武装攻击”。另一种观点认为，第 51 条仅仅是将固有的自卫权成文法化，因此\
  \ Caroline 标准下的预期自卫仍可作为一种应对手段。但即使适用 Caroline 标准，该标准要求回应的必要性必须是“即时的、压倒性的、不留任何选择手段的余地、也不留任何审议的时刻”，这可能使得预期自卫在网络攻击背景下更难适用。\n\
  \n如果自卫严格限于应对“武装攻击”，由于网络攻击的性质，尤其是网络攻击极不可能被视为本身即“武装攻击”这一事实，将会产生许多复杂情况。关于将网络攻击定性为武装攻击的论点，通常着眼于特定网络攻击的特征、后果或影响。从实际角度来看，当判断网络攻击是否为“武装攻击”主要取决于事后分析时，要主张一个国家即将遭受网络“武装攻击”以证明预期自卫的正当性，将是非常困难的。\n\
  \nSchmitt 认为，如果存在三个因素，预期自卫可用于应对网络攻击：(1) 该攻击是最终导致武装攻击的整体行动的一部分，(2) 该攻击作为通向迫在眉睫且不可避免的攻击的一步是不可逆转的，以及\
  \ (3) 对该攻击的预期性回应是在最后可能的时刻为应对攻击而采取的。21 这可以说设定了一个很高的门槛，然而，如果采纳 Schmitt 提出的标准，预期自卫作为网络反击理由的适用性可能在很大程度上变得不可用。《塔林手册》第\
  \ 15 条规则的附注探讨了在迫在眉睫的网络武装攻击情况下，预期自卫是否可能是一种选择。根据第 15 条规则附注 4，参与起草《塔林手册》的大多数专家似乎支持“最后可行机会窗口”标准，该标准允许在“攻击者明确致力于发动武装攻击，且受害国除非采取行动，否则将失去有效自卫的机会”时实施预期自卫。22\n\
  \n另一种理论认为，当证据表明针对某国的持续行动正在进行时，可授权预期自卫。因此，即使预期自卫在任何损害发生之前可能不可用，但如果有证据表明损害将持续发生，在初始损害发生后预期自卫可能是可能的。在这种情况下，需要有证据表明先前的武装攻击是持续行动的一部分，因此刚刚经历的那类网络“武装攻击”在未来是“迫在眉睫”的。\n\
  \n除了传统的自卫概念外，国家还可能有权使用报复措施或相称的对抗措施来应对武力的使用。然而，报复措施本身不得涉及“武力的使用”。23 报复措施还必须满足三个额外要求：(1)\
  \ 对抗措施用于国家对国家的背景，(2) 防御国已告知侵略国停止，以及 (3) 对抗措施的效果与所受损害相称。因此，如果国家希望应对非国家行为体的攻击，报复措施不是一种选择。此外，如果网络攻击在国际法下被视为“武力的使用”，报复措施将不可用。然而，如果国际社会宣布网络攻击不属于“武力的使用”，因此网络攻击不违反《联合国宪章》第\
  \ 2 条第 4 款，则以符合报复定义的方式利用网络反击，将是国家在外国发动动能“武力使用”事件中保护其利益的有效方式。然而，正如所指出的，报复措施是针对“武力使用”的潜在回应，其本身不能上升到“武力使用”的程度。如果网络攻击不属于武力使用，针对网络攻击的网络反击就不属于报复。然而，针对未达到“武装攻击”级别的非网络攻击“武力使用”实施网络反击，可能是国家在不依赖联合国安理会的情况下保护其利益的一种方式。\n\
  \n《塔林手册》中关于报复措施的讨论使用“交战方报复”来描述为诱使敌方未来遵守武装冲突法而采取的行为。24 《塔林手册》采纳的解释表明，报复可以是武力的使用，但手册也在第\
  \ 46 条规则的正文中强调，交战方报复不得针对非法目标。\n\n1 本章部分内容此前曾发表于作者撰写、Wiley-Blackwell 2015 年出版的《国际数字传播与社会百科全书》一书的一个章节中。经许可转载。本章的某些方面也源自作者撰写的其他法律评论文章。\n\
  \n\n\n\n## 第 11 章\n\n### 隐私理论与调查\n\n#### I. 作为理论的隐私\n\n在美国，隐私理论领域最重要的早期著作通常被认为是沃伦和布兰代斯\
  \ 1890 年发表的文章《隐私权》。文中，二人著名地将隐私定性为“独处权”。1 据说该选题由塞缪尔·沃伦提出，但未来的最高法院大法官路易斯·布兰代斯完成了大部分写作工作。\n\
  \n塞缪尔·沃伦对独处权有着特殊的兴趣。1883 年，沃伦与梅布尔·贝亚德结婚，当时她的父亲是特拉华州的联邦参议员。1885 年，沃伦的岳父托马斯·贝亚德在格罗弗·克利夫兰总统任内被任命为国务卿。沃伦是个相当注重隐私的人，不喜欢媒体对其家庭表现出的那种程度的关注。对当时报纸和八卦专栏的研究表明，沃伦对媒体的反感可能是由其小姨子和岳母葬礼的新闻报道，以及公众对其妻子的关注（因她与克利夫兰总统\
  \ 21 岁的新娘成为挚友）所激起的。2\n\n因此，沃伦和布兰代斯撰写了《隐私权》，文中作者指出，受保护免受个人信息公开之权利，基于人格不可侵犯原则。该权利并非无条件的。作者强调，隐私权不得阻止涉及公共利益事项的发表。该权利也不得阻止在法律程序等特权语境下对私人信息的披露。《隐私权》对普通法隐私权的发展极具影响力，尽管法院并不总是认同隐私侵权应在侵权法下得到认可。\n\
  \n隐私理论的下一个重大发展出现在 1960 年，随着《普罗瑟论隐私》的出版而到来。普罗瑟本职是侵权法学者，依据当代侵权法原则分析隐私损害。普罗瑟提出的四大侵权类型，至今仍是法院采用的四大主要隐私侵权类型，即：侵扰隐私、公开私人事实、虚假曝光和盗用。现代隐私理论有时是在反对普罗瑟对隐私的形式主义方法的背景下发展起来的，特别是在信息隐私领域，因为那里的损害难以量化。\n\
  \n\n\n\n\n##### 隐私法与调查\n\n通过审视隐私法，我们希望提供一个有用的分析，说明隐私理论是如何被实务化的。隐私法主要分为两大类：一类侧重于政府调查，另一类侧重于数据保护。本章剩余部分专门讨论调查方面的隐私法，如《第四修正案》和《电子通信隐私法》。在下一章中，我们将探讨强调数据保护的隐私法。这第二类隐私法最有可能适用于美国的私营部门。\n\
  \n#### II. 作为法律的隐私——调查\n\n在 Warren 和 Brandeis 的文章、Prosser 的隐私侵权理论以及其他学者提供的见解的帮助下，普通法在\
  \ 20 世纪得到了发展，开始承认并补救因隐私侵犯造成的损害。宪法和成文隐私法也在此期间得到了发展。\n\n如上所述，美国的隐私法主要分为两大类。第一类涉及保护公民免受政府的隐私侵犯。这些法律在范围上各不相同，在广泛责任与广泛抗辩之间存在一个渐变尺度。证明隐私侵犯责任越困难，针对该主张的抗辩就越有力。\n\
  \n2016 年，对《刑事诉讼规则》`Rule 20641` 的修正带来了一项提供更强抗辩的近期法律变更。这些变更影响了获取搜查令的程序。具体而言，当实际管辖权“已通过技术手段隐藏”时，这些变更允许几乎任何推事签发搜查令，以远程访问电子媒体。这种跨辖区搜查令权力还延伸至对违反\
  \ [`18 U.S.C. § 1030(a)(5)`](https://www.westlaw.com/Document/N6DD98460F4E511E8A7C0DAA3A56050F5/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 的调查，该条款是 CFAA 中关于造成损害的未经授权传输的规定，适用于受损计算机“位于五个或更多辖区”的情况。这通常被理解为指僵尸网络，赋予调查人员获取搜查令以远程访问受感染计算机的权力。\n\
  \n在技术和信息隐私背景下，调查限制的两大主要来源是宪法和《电子通信隐私法》。\n\n##### a. 宪法\n\n1965 年，最高法院在 *Griswold\
  \ v. Connecticut* 案中宣称，存在从宪法中列举的主要权利发散出的权利阴影区，其中包括隐私权。[¹] *Griswold* 案涉及康涅狄格州的一项法律，该法律禁止任何人（包括已婚夫妇）使用避孕措施。\n\
  \n*Griswold* 案的多数意见在《权利法案》的几项修正案的阴影区中看到了隐私权。例如，第一修正案暗示了免受政府侵入的隐私权，如 *NAACP v. Alabama*\
  \ 案所示，该案涉及政府是否能强制组织披露其成员姓名。[²] 同样，第三修正案保护房主免于为驻军提供住所而交出房屋的目的，从根本上说是对隐私的保护。第四修正案及其对不合理搜查和扣押的保护植根于隐私价值观，第五修正案的不得强迫自证其罪条款亦是如此。*Griswold*\
  \ 案法院推理认为，婚床完全处于宪法保护的“隐私区域”内。如果不进行严重的隐私侵犯，禁止使用避孕措施的法律将难以执行，因此最高法院判定该康涅狄格州法律违宪。\n\
  \n对于涉及刑事案件证据的第四修正案主张，一个关键问题是是否存在合理的隐私期待，这自 1967 年的 *Katz v. United States* 案以来一直是标准。[³]\
  \ 第三方原则为第四修正案的保护创设了一个例外，即当嫌疑人自愿向第三方披露信息时。在 *Couch v. United States* 和 *United States\
  \ v. Miller* 两案中，最高法院均认为，通过向会计师或金融机构披露财务记录，一个人不再对该信息享有合理的隐私期待。[⁴]\n\n当涉及第三方时，有时另一个问题涉及私人搜查。如果第三方发现了非法活动并向执法部门报告，私人搜查原则通常允许不超出原始私人搜查范围的无证搜查。*United\
  \ States v. Jacobsen* 案同时涉及私人搜查和第三方原则。联邦快递员工打开了一件运输途中损坏的包裹，因为公司政策要求检查损坏包裹以核实内容物是否受损。包裹内装有白色粉末袋，缉毒局（DEA）特工确认为可卡因。最高法院表示，无证搜查不得超出揭露违禁品的私人搜查范围，但因鉴定粉末而造成的任何隐私侵犯均属微不足道。[⁵]\n\
  \n第四修正案在关于数字证据收集方法合宪性的讨论中反复出现。在 *City of Ontario v. Quon* 案中，最高法院假设但未最终裁定，从服务提供商处获取的短信将受第四修正案保护。[⁶]\
  \ 第三方原则在数字证据上的适用凸显了法律澄清的必要性，特别是考虑到许多法官的技术素养。在 *Quon* 案的口头辩论中，大法官 Roberts 表现出对电子消息传递工作原理的困惑，并表示他最初认为，如果此类消息在传输过程中由第三方处理，第四修正案将不适用。[⁷]\
  \ 以第三方必须将数据从一台设备传输到另一台设备为由使第四修正案保护失效，将导致几乎没有电子通信设备受到保护，或许只有对讲机除外。\n\n接下来，在 *United\
  \ States v. Jones* 案中，最高法院审议执法人员在嫌疑人汽车上安装 GPS 设备是否违反第四修正案。[⁸] *Jones* 案本可能对关于在线合理隐私期待的当前辩论产生影响。然而，尽管\
  \ *Jones* 案多数意见得出结论认为在汽车上安装 GPS 设备违反第四修正案，但这一结论是基于侵入理论，而非基于合理的隐私期待。[⁹]\n\n最高法院从\
  \ 2014 年的 *Riley v. California* 案开始更倾向于第四修正案对数字证据的保护。在 *Riley* 案中，核心问题是逮捕附带搜查是否可对手机进行无证搜查。Riley\
  \ 的手机是智能手机，法院承认智能手机实际上是口袋大小的计算机，“同样可以被称为相机、视频播放器、通讯录、日历、录音机、图书馆、日记、相册、电视、地图或报纸。”法院裁定，通常在搜查嫌疑人手机之前需要搜查令，包括在逮捕附带搜查的背景下。[¹⁰]\
  \ 因此，搜查令要求的通常逮捕附带搜查例外不延伸至授权警方对手机内容进行无证搜查。\n\n[¹]: [#section18.xhtml#ftn.194]\n[²]:\
  \ [#section18.xhtml#ftn.195]\n[³]: [#section18.xhtml#ftn.196]\n[⁴]: [#section18.xhtml#ftn.197]\n\
  [⁵]: [#section18.xhtml#ftn.198]\n[⁶]: [#section18.xhtml#ftn.199]\n[⁷]: [#section18.xhtml#ftn.200]\n\
  [⁸]: [#section18.xhtml#ftn.201]\n[⁹]: [#section18.xhtml#ftn.202]\n[¹⁰]: [#section18.xhtml#ftn.203]\n\
  \n\n\n\n\n###### 数字隐私与卡彭特诉美国案\n\n数字隐私也是*卡彭特诉美国案*的核心，这是一起于 2017 年 11 月提交最高法院审理的案件。但*莱利案*关注的是存储在手机上的内容，而*卡彭特案*则关乎元数据。*卡彭特案*的核心问题是，调查人员在收集历史基站定位数据前，是否应当申请搜查令。2018\
  \ 年 6 月，最高法院裁定收集此类定位信息构成第四修正案意义上的“搜查”，因此执法部门在强制要求提供该信息前必须获得搜查令。13 最高法院进一步裁定，第三方原则不适用于历史基站定位数据。首席大法官罗伯茨代表多数派撰写意见书，总结道：要求提供此类定位信息并非如政府所主张的那样，仅仅是“向第三方证人提出的寻常信息请求”。\n\
  \n*卡彭特案*多数派进一步指出，第三方原则仅会降低隐私期待，而非将其消除。法院推理认为，即使在适用第三方原则的案件中，对于特定性质的信息，第四修正案的保护依然可能存在。首席大法官罗伯茨代表多数派指出：“[第三方原则案件]\
  \ 所涉及的有限类型个人信息，与无线运营商如今随意收集的详尽位置信息编年史之间，有着天壤之别。” 多数派还裁定，《存储通信法》中的强化传票程序不得用于获取历史基站定位数据，这一点将在下文讨论。\n\
  \n*卡彭特案*的判决范围相当狭窄，且与实体物体的存在紧密相关。根据*卡彭特案*，对于这类自动生成的、追踪特定通信设备位置的信息，享有第四修正案保护。此前关于第四修正案下定位隐私的案件，涉及的是桶装信标和汽车上的\
  \ GPS 设备。基站数据的覆盖面更广，因为在许多情况下，手机实际上已成为人体的延伸。法院指出，大多数人始终将智能手机置于离身边几英尺范围内。\n\n*卡彭特案*多数派还警示，不应允许“科学的进步”侵蚀第四修正案的保护，并引用了布兰代斯大法官在*奥尔姆斯特德诉美国案*中的异议意见。在该异议中，布兰代斯警示在未确保充分的第四修正案保护前，不应使用更隐蔽的手段侵犯隐私。*奥尔姆斯特德案*本身涉及第四修正案在电话窃听中的适用问题。\n\
  \n手机已在社会中普及。在 20 世纪 90 年代，琐事问答游戏仍具挑战性，因为核实许多信息需要去图书馆。情景喜剧能以一个角色断言一个冷门事实、其余角色花费接下来\
  \ 22 分钟试图证伪为贯穿始终的包袱，制作成整整一集。普通家庭会购买百科全书套装，以便查阅常识。到了 2018 年，似乎几乎人人都随身携带一台设备，能在几秒钟内接入全人类的知识宝库。\n\
  \n为了促进信息和通信的快速传输，蜂窝服务提供商将信号从一个基站导向另一个基站，以在设备间传输数据。关于数据路径的信息随之存储，包括传输至设备前最后一个基站是哪个。在技术早期，该数据仅能在传输时刻大致确定设备所在区域，但基站数据逐渐变得更精准。向设备传输信息或从设备接收信息，是这些信号识别人员位置的必要条件，但随着推送通知的普及和软件更新的必要性，许多智能手机应用最终会频繁联系外部服务器。这意味着，获取这些记录可让执法部门在较长时间内以日益详尽的方式绘制嫌疑人行踪图。*卡彭特案*判决后，想获取此类信息的执法官员收到的信号很明确：去申请搜查令。\n\
  \n##### 电子通信隐私法\n\n《电子通信隐私法》包含三个实质性章节：《窃听法》、《笔式记录器法》和《存储通信法》。除了是一部隐私法规外，《电子通信隐私法》还可能与网络犯罪受害者相关，因为这些法规中的禁止性规定可能限制网络事件发生后的补救选项。例如，溯源追踪有助于确定攻击来源，但《存储通信法》禁止未经授权访问电子通信服务以获取存储的通信。《存储通信法》的刑事条款由此创设了一项罪名，其功能上等同于《计算机欺诈与滥用法》第\
  \ 1030(a)(2)(C) 条，但仅适用于提供电子通信服务的设施。从某种意义上说，将攻击溯源至其发起点，使黑客跨越其他系统进行数字闯入所造成的损害加倍。\n\
  \n###### 窃听法\n\n《窃听法》广泛禁止截获通信，但规定了执法部门申请窃听的程序。《窃听法》常被称为“第三编”。《窃听法》第 2511 条对截获电子通信及使用非法截获的电子通信作出一般性禁止。\n\
  \n第 2511 条列出了可支持窃听令的联邦罪行。值得注意的是，《窃听法》第 2511 条的重罪违规行为属于可申请窃听令的合格罪行。窃听也不应是首选的调查手段。第\
  \ 2518(1)(c) 条要求在诉诸窃听申请前，说明其他调查程序的使用情况。申请实体通常还必须设定截获维持的截止日期。\n\n\n\n\n\n#######\
  \ 窃听法与 FISA 的重叠\n\n窃听法与《外国情报监视法》（FISA）之间存在一定的重叠。FISA 第 704 条（编纂于 [50 U.S.C. § 1804](https://www.westlaw.com/Document/NEB4892302D4511E085059313582677B6/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)）规定了申请电子监视法院命令所需的程序。与窃听法类似，第\
  \ 704 条要求提供诸如预期监视时长等详细信息，以及一份声明，说明所寻求的信息“无法通过常规调查技术合理获取”。第 704 条还要求申请人提供拟议的最小化程序声明，以尽量减少收集“涉及未同意的美国人的信息”。FISA\
  \ 第 702 条（编纂于 [50 U.S.C. § 1802](https://www.westlaw.com/Document/NE6ABB1802D4511E0B43684C0FBDD697B/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)）规定了司法部长在无授权情况下批准监视的程序。无授权监视命令仍然要求最小化程序。此外，司法部长必须宣誓证明，不存在“实质性可能”收集到其中一方为美国人的通信内容。\n\
  \n###### 笔式记录器\n\n笔式记录器法规禁止在未先获得法院命令的情况下使用笔式记录器。笔式记录器法院命令要求证明所可能获取的信息与正在进行的刑事调查相关。笔式记录器揭示通信的非内容方面，如时间、时长、电话号码或\
  \ IP 地址。当服务提供商在正常业务过程中记录此类元数据时，明确被排除在笔式记录器的定义之外。此外，笔式记录器通常获取实时元数据。关于存储元数据的收集存在重大的现代争议，这属于\
  \ ECPA 的第三部分，即《存储通信法》。\n\n![Figure 1: Different aspects of the ECPA](img/Image_8.jpg)\n\
  \n###### 存储通信法\n\n在互联网普及之前，窃听和笔式记录器已投入使用。但随着个人计算机和互联网变得更加普遍，存储数据的法律含义变得更加复杂。《存储通信法》（SCA）于\
  \ 1986 年颁布，旨在解决新技术与第四修正案保护之间日益扩大的差距。\n\nSCA 的大部分措辞保持不变，但自 1986 年以来互联网技术已发生巨大变化。例如，考虑网页邮件。互联网之所以能工作，是因为网络上的计算机使用相同的协议实现互联，从而使数据能够跨网络传输。最著名的协议之一是简单邮件传输协议（SMTP），它在万维网出现之前的\
  \ 1980 年代就已实现电子邮件交换。在 1980 年代中期 SCA 颁布时，电子邮件的传输相当分散。电子邮件通信从服务器传输到服务器，在被接收者下载之前，会在传输过程中临时存储在各个位置。\n\
  \n如今，网页邮件仍可能使用 SMTP 协议，但也使用互联网消息访问协议（IMAP）。IMAP 允许通过互联网连接从任何地方访问电子邮件，因为电子邮件永久存储在提供商的服务器上。能够从任何地方访问重要通信对移动性和移动计算至关重要，但根据目前的\
  \ SCA 规定，已读电子邮件可由政府获取，而无需满足搜查令所要求的高标准“合理根据”。\n\nSCA 有三项主要实质性条款：一项刑事条款，禁止未经授权收集存储的通信；另一项条款对服务提供商在其控制下自愿披露存储的通信时施加要求；还有一项条款规定政府行为人如何强制要求提供存储的通信。根据\
  \ SCA，内容和元数据均被视为存储的通信。\n\nSCA 要求的程序因提供商是电子通信服务还是远程计算服务、所寻求的数据类型，以及在某些情况下数据的存储时长而异。例如，未打开或不足\
  \ 180 天的电子邮件只能凭搜查令获取。超过该期限后，中级命令生效，通常称为 2703(d) 命令。该中级命令也足以获取大多数存储的元数据。传票足以获取关于用户的基本身份信息。法院此前在历史基站位置数据问题上存在分歧，一些法院认为此类信息需要搜查令，而另一些法院则认为位置信息不受宪法保护。如果信息不受宪法保护，这意味着要求\
  \ 2703(d) 命令在之前毫无保护的地方创造了保护。\n\n在上一节中，我们讨论了 *Carpenter v. United States* 案，该案涉及第四修正案和《存储通信法》。Carpenter\
  \ 的论点部分源于使用 2703(d) 命令进行的无授权搜查。[¹⁴] 在 Carpenter 案中，调查人员使用增强型传票 2703(d) 获取了关于 Carpenter\
  \ 127 天行踪的信息，包含 12,898 个单独数据点。法院裁定，2703(d) 命令不足以收集历史基站位置数据，调查人员必须证明“合理根据”以获得命令进行此类回溯性监视。\n\
  \nCarpenter 案并未使 2703(d) 命令失效，仅限于其不能作为获取基站数据搜查令的替代品。为获得 2703(d) 法院命令，政府实体必须确立“具体且明确的事实”，证明有“合理理由”相信所寻求的信息“与正在进行的刑事调查相关且重要”。[¹⁵]\
  \ 这一标准低于获取搜查令所需的“合理根据”标准，但高于获取传票的标准。为获得传票，政府必须证明所寻求的信息与正在进行的调查合理相关。所寻求的信息类型也决定了\
  \ 2703(d) 命令或传票是否必须附带对目标的事先通知。此外，SCA 允许在特定情况下延迟通知，详见第 2705 条。\n\n2703(d) 命令用于存储电子邮件的充分性在\
  \ *United States v. Warshak* 案中经第六巡回法院审理。[¹⁶] 该案涉及生产 Enzyte 的公司所有者的欺诈活动，Enzyte 是一种大肆广告的营养补充剂，其广告以“微笑鲍勃”形象为特色。Enzyte\
  \ 的流行度在 2000 年代中期达到顶峰。然而，Warshak 并非善意推销其产品。未同意未来收费的客户经常被自动加入自动发货选项，其信用卡会定期被扣款。\n\
  \n[¹⁴]: section18.xhtml#ftn.205\n[¹⁵]: section18.xhtml#ftn.206\n[¹⁶]: section18.xhtml#ftn.207\n\
  \n\n\n\n\n该公司与代表其处理信用卡交易的商户银行关系也很紧张。当退单率过高——即发放了过多退款——这些银行会很不高兴。为了解决这个问题，该公司惯常使用各种手段人为降低其销售的退单比率，其中包括一种称为“双重扣款”的做法，即将一笔单独的扣款拆分为多笔扣款，还有一种更阴暗的做法，即员工向沃沙克的个人信用卡扣款\
  \ 1 美元，直到达到其信用额度，然后公司再向沃沙克报销这些费用。\n\n政府曾要求沃沙克的信息服务提供商（ISP）在调查期间保留沃沙克电子邮件的副本，并根据[《存储通信法》（SCA）第\
  \ 2703(b) 节](https://www.westlaw.com/Document/NA0E8AA80F4E911E8A479CD48F360012F/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)以及第\
  \ 2703(d) 节命令，强制要求提供这些电子邮件。使用第 2703(b) 节强制获取电子邮件表明，政府将该 ISP 定性为“远程计算服务”（RCS），这一点意义重大，因为当从“电子通信服务”（ECS）提供商处寻求通信内容时，SCA\
  \ 提供的替代搜查令的途径更少。\n\n然而，即使对于 RCS 提供商，如果在没有搜查令的情况下寻求通信内容，也需要事先通知用户。沃沙克直到一年后才收到其电子邮件被披露的通知。不过，在申请命令时，政府确实根据\
  \ SCA 第 2705 节寻求并获得了延迟通知要求的许可，但未请求进一步延迟。法院承认这违反了 SCA 的通知要求，但由于在最初收集电子邮件时并未违反通知要求，因此不影响最初数据收集的合法性。\n\
  \n最终，第六巡回法院裁定，无搜查令收集电子邮件违反了第四修正案，但由于政府基于对第 2703(b) 节和第 2703(d) 节的特定解释表现出了**善意依赖**，这些电子邮件无需从审判中排除。\n\
  \nSCA 的自愿披露条款也很重要，需要了解。例如，根据第 2702(c)(6) 节的自愿披露条款，仅禁止向非政府实体披露通信**内容**。因此，如果蜂窝服务提供商自愿向多疑的配偶提供其伴侣的基站位置数据，并不违反\
  \ SCA。无论如何，大多数服务提供商内部可能都有禁止此类披露的政策。\n\nSCA 备受批评的一个方面是 ECS 提供商与 RCS 提供商之间的区别。这种区别在根据第\
  \ 2702(a) 节进行自愿披露的背景下尤为重要。根据第 2702(a)(1) 节，ECS 提供商被明确禁止向任何人披露其持有的处于“电子存储”状态下的通信内容。\n\
  \n然而，第 2702(a)(2) 节禁止 RCS 提供商披露通信内容，但附带两个条件。首先，第 2702(a)(2)(A) 节涉及由 RCS 服务“代表……并通过电子传输方式从……该服务的用户或客户处接收”的数据。\n\
  \n其次，根据第 2702(a)(2)(B) 节，服务提供商被禁止披露仅为“向该用户或客户提供存储或计算机处理服务之目的”而携带或维护的通信内容，“前提是该提供商无权为提供存储或计算机处理以外的任何服务之目的而访问任何此类通信的内容”。法院在适用该短语时，往往似乎认为第二款不限制第一款，这可以说与法律解释规则不一致。如果提供商维护通信内容是为了“提供存储或计算机处理服务之目的”，但根据用户协议也有权为其他目的访问该信息（例如，扫描电子邮件内容以实现个性化广告），会怎样？这种营销通常被描述为对消费者的一种服务，但它可能与存储或计算机处理无关。\n\
  \n2018 年，国会通过《澄清海外数据合法使用法案》（CLOUD Act）修订了《存储通信法》。在 CLOUD Act 通过之前，SCA 是否允许执法部门强制要求提供存储在外国的数据尚不清楚。2016\
  \ 年，第二巡回法院依据域外推定不适用原则，撤销了根据 SCA 签发的搜查令。该判决被上诉至最高法院，即“美国诉微软案”。该案起因是执法部门向微软送达搜查令，要求提供基于网络的电子邮件账户内容，但微软拒绝遵守搜查令的部分内容，因为所寻求的数据存储在爱尔兰。CLOUD\
  \ Act 向 SCA 增加了第 2713 节，澄清即使数据存储在外国，服务提供商也必须遵守根据 SCA 强制要求提供数据的命令。这是 CLOUD Act 中确保美国执法机构可以使用美国司法官签署的搜查令来访问存储在外国的数据的部分。CLOUD\
  \ Act 通过不到一个月，“美国诉微软案”即因案由消失而被驳回。\n\nCLOUD Act 的第二部分确保外国政府能够强制要求提供存储在美国的数据。为此，CLOUD\
  \ Act 还修订了 ECPA 的另一部分——《窃听法》。CLOUD Act 向《窃听法》增加了第 2523 节，创建了一种称为“行政协议”的法律机制，以简化跨司法管辖区数据请求的合作流程。联邦官员可以与满足特定隐私保护和网络犯罪法律基本要求的“合格外国政府”签订行政协议。如果与另一国存在行政协议，且该国政府命令公司披露存储在美国的数据，该公司不得以披露将违反美国国内法为由拒绝。\n\
  \n第 2523 节强调，外国政府的命令必须遵守类似于美国签发搜查令的标准。此类命令必须以预防、侦查、调查或起诉“严重犯罪”为目的。命令必须提供“具体标识符作为命令对象”，并且必须基于“明确且可信的事实、特定性、合法性以及受调查行为的严重性”提供“合理理由”来支持该命令。与存在行政协议的外国政府发出的命令必须接受司法审查或由独立机构进行类似审查。如果命令涉及电子数据拦截，第\
  \ 2523 节施加了类似于《窃听法》的额外要求。此类命令必须具有“固定、有限的期限”，“不得超过合理必要的期限以实现命令批准的目的”，且仅在“同一信息无法通过其他侵入性较小的方法合理获得”时才可使用。\n\
  \n1[Samuel D. Warren & Louis D. Brandeis, The Right to Privacy, 4 Harv. L. Rev.\
  \ 193, 196 (1890)](https://www.westlaw.com/Document/Ic54d5914720f11de9b8c850332338889/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0&fragmentIdentifier=co_pp_sp_3084_196)。\n\
  \n\n\n\n\n## 第 12 章\n\n### 隐私法与数据保护\n\n#### I. 作为法律的隐私——数据保护\n\n如前所述，隐私法的第一大类涉及保护公民免受政府侵害。第二大类涉及保护公民的隐私不被其他公民侵犯。有特定法规限制私营行业如何处理他人数据，但这些法规通常仅针对有限的数据类别。例如，医疗信息、视频租赁记录和教育记录均在联邦法律下享有特定保护。《驾驶员隐私保护法案》限制了机动车记录中个人信息的披露。在欧盟，隐私法广泛保护公民免受私人主体及政府的侵犯。而在美国，数据保护法对政府行为主体的约束最为广泛，除此之外往往仅针对特定行业单独立法。\n\
  \n在前一章中，我们指出个人可识别信息（`PII`）通常是各州管理数据泄露法律的核心。同样，`PII` 也是联邦隐私法的核心。州数据泄露法通常将该术语定义为：姓名或社会安全号码等身份识别信息，与可能具有敏感性质的其他信息相结合。\n\
  \n1974 年《隐私法案》采用的定义与州法规中的定义相似。该法案未使用“个人可识别信息”这一术语，但将“记录”定义为“由机构保存的关于个人的任何……信息，包括……教育、金融交易、病史、犯罪记录或就业记录”，并结合姓名、识别号码或其他特定于个人的信息（如照片或指纹）1。\n\
  \n根据《联邦法规汇编》（`CFR`）第 2 编 `Section 200.79`，个人可识别信息被更抽象地定义为“可用于区分或追踪个人身份的信息，无论单独使用，还是与其他关联或可关联到特定个人的个人或识别信息结合使用”。\n\
  \n##### a. 适用于政府记录的隐私法\n\n在美国法律中，一个共同主题是：在没有市场失灵的情况下，立法者不愿对私营行业施加监管要求。这可能是当前适用于私营部门的隐私法呈现碎片化状态的原因之一。然而，涉及政府持有的数据时，限制更多。例如，1974\
  \ 年《隐私法案》和《联邦信息安全现代化法案》（`FISMA`）均要求政府采取措施保障政府计算机系统的安全。\n\n1974 年《隐私法案》保护由政府机构持有的可识别个人的记录。该法案要求机构建立技术防护措施，“以确保记录的安全性和机密性，并防范任何预期的威胁或危害，防止其安全性或完整性受损，从而导致对档案中任一个人造成实质性损害、尴尬、不便或不公正待遇。”2\n\
  \n\n\n\n\n###### 联邦信息安全管理法案与现代化法案\n\n联邦信息安全管理法案（FISMA）于 2002 年颁布，要求政府机构和承包商采取网络安全措施。该法案于\
  \ 2014 年被联邦信息安全现代化法案取代。根据《美国法典》第 40 编第 11331 节，管理和预算办公室（OMB）主任有权根据国家标准与技术研究院（NIST）提出的标准制定具有约束力的信息安全标准。根据\
  \ [15 U.S.C. § 278g–3](https://www.westlaw.com/Document/N1356D530F3A511E6959E90F85B91838D/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，NIST\
  \ 被法律授权并要求为政府机构开发此类标准。这些标准独立于网络安全框架，后者是 NIST 为私营部门（特别是关键基础设施的私营运营商）开发的自愿性信息安全标准。\n\
  \n###### 各州生物识别数据法律\n\n随着各州开发出更多识别公民身份的高科技手段，法律也随之发展以考量这些新能力。各州日益承认并规范生物识别数据的使用。每个州都设定了“生物识别信息”的法律定义。区分哪些类型的数据属于各州定义的管辖范围至关重要，因为覆盖范围的广度可能会导致某些形式的生物识别安全被纳入或排除在外。\n\
  \n####### 伊利诺伊州：生物识别信息保护法案 (BIPA)\n\n在伊利诺伊州，《生物识别信息保护法案》（BIPA）将“生物识别标识符”定义为“视网膜或虹膜扫描、指纹、声纹、手部或面部几何扫描”。BIPA\
  \ 还适用于“生物识别信息”，其定义为“无论以何种方式捕获、转换、存储或共享，基于个人生物识别标识符用于识别个人的任何信息”。3 对“生物识别信息”的额外覆盖意味着任何数据转换（如将视网膜或指纹扫描简化为数学函数）本身也受到保护。然而，BIPA\
  \ 排除了书写样本、手写签名、一般照片、用于科学测试的人体生物样本、人口统计数据、纹身描述、身高、体重或眼睛颜色等身体特征描述，以及在医疗环境中从患者处获取的信息。\n\
  \n###### 德克萨斯州\n\n德克萨斯州仅将生物识别数据保护延伸至生物识别标识符，包括“视网膜或虹膜扫描、指纹、声纹、手部或面部几何扫描”，大体类似于 BIPA\
  \ 标准。然而，与 BIPA 不同，德克萨斯州的定义中不包含“生物识别信息”，这意味着生物识别数据的抽象表示或分析本身不受德克萨斯州法律保护。4\n\n######\
  \ 华盛顿州\n\n在华盛顿州，生物识别标识符被定义为“由个人生物特征自动测量生成的数据”，包括“指纹、声纹、眼视网膜、虹膜或用于识别特定个人的其他独特生物模式或特征”。5\
  \ 虽然该定义比德克萨斯州的更宽泛，甚至可能比 BIPA 定义更宽泛，但法律并未明确列举面部几何或手部形状。此外，华盛顿州特别排除了“物理或数字照片、视频或音频记录或由此生成的数据”，表明立法者在面部识别技术方面划出了例外。华盛顿州法律包含因分析生物识别信息而生成的任何数据，但为特定行业（如用于监控员工工作时间表的考勤应用）划出了具体例外。\n\
  \n##### 针对私营部门的隐私法律\n\n美国法典包含一系列旨在保护特定类型信息的联邦隐私法律，这与欧盟广泛的数据隐私方法形成对比。\n\n###### 健康保险流通与责任法案\
  \ (HIPAA)\n\n《健康保险流通与责任法案》（HIPAA）因患者每次看医生似乎都要签署或签字确认的隐私声明而广为人知。除了旨在保护隐私的要求外，HIPAA\
  \ 还包含信息安全规则。除其他事项外，受管实体必须“防范对[受保护健康信息]的安全性或完整性的任何合理预期的威胁或危害”。6\n\nHIPAA 的最大重点是防止医疗信息被未经授权地披露。由于债务催收活动中很大比例涉及医疗债务，国会还修订了《公平信用报告法》，禁止消费者报告机构在极少数情况下之外披露消费者的医疗信息。此类信息可作为保险交易的一部分在消费者“明确同意”下发布；当信息相关且“消费者提供具体书面同意”时可用于就业目的；以及在催收医疗债务时，前提是使用代码报告服务性质的信息。7\
  \ 如果信息至关重要且获取同意不切实际，只要满足特定要求，有时可在未经患者同意的情况下进行医学研究。这些要求包括：1) 机构审查委员会（IRB）已批准研究方案和数据使用；2)\
  \ 数据披露风险最小；3) 研究不影响个人隐私和福利；4) 制定计划防止不当披露；5) 未经 IRB 新授权不将数据用于其他目的。\n\nHIPAA 限制了私人健康信息传输和披露的程度。属于\
  \ HIPAA 管辖“受管实体”的组织必须遵守该法规的隐私和保密程序，并遵守卫生与公众服务部（HHS）颁布的相关法规。8 健康计划、医疗服务提供者和医疗信息清算机构被视为\
  \ HIPAA 下的“受管实体”。9 《HITECH 法案》要求在涉及受保护健康信息时通知数据安全漏洞。HIPAA 下不存在私人诉权，但违规者可面临民事和刑事处罚。\n\
  \n受管实体还必须遵守 HHS 颁布的严格隐私和安全规则。隐私规则限制患者信息披露，仅在特定情况下允许，且在这些情况下，受管实体仍必须将信息的使用和披露限制在最低必要范围内。10\
  \ 安全规则包含针对电子存储个人健康信息保护的条款。11 这包括确保员工接受适当的安全措施培训，以及加密所有涉及个人健康信息的电子通信。\n\n###### 遗传信息非歧视法案\
  \ (GINA)\n\n健康信息也是联邦《遗传信息非歧视法案》（GINA）的核心。根据 GINA，健康保险公司不得在决定资格或保费时使用个人的遗传信息，也不得要求个人接受基因检测。雇主不得在雇佣决策中考虑遗传信息，也不得请求、要求或购买关于雇员或其家庭成员的遗传信息。\n\
  \n\n\n\n\n####### 政府收集基因信息\n\n政府收集基因信息通常遵循不同的标准。根据[美国法典第 34 编第 40702 节](https://www.westlaw.com/Document/NC6FCF4D076EE11E78E5FF3477C69ED24/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，执法部门被授权从被羁押人员以及处于监督释放、假释或缓刑人员处收集\
  \ DNA 样本。司法部长被允许从被羁押人员处收集 DNA 样本，政府被要求从已被判犯有合格联邦罪行的个人处收集 DNA 样本。如果 DNA 收集已获授权而当事人拒绝配合收集令，则属于刑事犯罪，按\
  \ A 级轻罪处罚。根据最高法院判例，DNA 和其他识别特征（如指纹）可被强制提取，且不违反第五修正案的不自证其罪条款。12\n\n###### 金融信息保护\n\
  \n联邦法律涉及的另一类敏感信息是金融信息。《公平信用报告法》是金融信息保护的一个来源，尽管 FCRA 主要适用于消费者报告机构。《格雷姆-里奇-比利雷法案》（GLBA）是另一项金融隐私法规，适用于定义更广泛的“金融机构”。GLBA\
  \ 要求金融机构采取保障措施，保护客户信息免受“任何预期的威胁或危害，或对该等记录的安全性或完整性的危害”。13 GLBA 进一步要求受监管实体防范客户记录被访问或使用，“这可能导致任何客户遭受重大损害或不便”。14\
  \ GLBA 还要求公司向客户发送年度隐私通知。\n\n###### 通信隐私与网络中立性\n\n其他隐私法伴随社会和技术发展而出现。《有线通信政策法案》于 1984\
  \ 年颁布，旨在解决有线电视用户的隐私顾虑。推测这是为了填补有线服务与电话公司等公共承运人之间的潜在空白。根据《通信法案》，公共承运人有责任保护“客户专有网络信息”，其中包括客户如何使用其服务的信息。15\
  \ CCPA 提供了类似但更灵活的指导方针，以涵盖新的有线服务，而无需将这些服务宣布为公共承运人。\n\n####### 通信法案与互联网的关系：网络中立性辩论\n\
  \n网络中立性是指互联网服务提供商不应优先处理某一类流量而非另一类的观点。关于网络中立性法规的大多数讨论都涉及联邦通信委员会（FCC），因为《通信法案》赋予 FCC\
  \ 对电信服务的管辖权。《通信法案》第 2 编适用于电话公司等电信服务。这些服务面临比其他服务更严格的要求，并被视为“公共承运人”。除其他事项外，第 2 编包含数据隐私和非歧视要求。然而，这些要求仅适用于电信服务，而在大约\
  \ 2005 年至 2015 年期间，宽带互联网被视为“信息服务”，而非电信服务。\n\n根据 1996 年《电信法案》，“信息服务”被定义为“通过电信提供生成、获取、存储、转换、处理、检索、利用或提供信息的能力”。16\
  \ 2002 年，FCC 将有线互联网指定为“信息服务”而非“电信服务”（后者将使其受《电信法案》第 2 编公共承运人法规约束），最高法院维持了这一指定。17\
  \ 后来该指定扩展至包含 DSL 服务。18 2015 年，FCC 颁布规则将宽带提供商重新归类为公共承运人。\n\n2016 年 10 月，FCC 通过新隐私规则管辖互联网服务提供商与其客户之间部分关系。这些规则明确规定\
  \ ISP 不得向广告商出售用户数据。FCC 的《宽带消费者隐私规则》涉及[第 222 节](https://www.westlaw.com/Document/N2C8162605A6011DDBD72FD83EF82BB51/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，标题为“客户信息隐私”。[第\
  \ 222 节](https://www.westlaw.com/Document/N2C8162605A6011DDBD72FD83EF82BB51/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)要求电信承运人保护客户信息，并限制这些承运人被允许与他人共享此类信息的情况。19\n\
  \n与许多事物一样，这些争论往往归结为金钱。宽带提供商希望与其他互联网公司竞争广告收入。Google 和 Facebook 是将消费者信息货币化最成功的两家公司。ISP\
  \ 接触的消费者数据比其他公司多得多，因此他们可以通过向广告商出售关于您的信息赚取巨额利润。但 ISP 不仅仅是一个您可以选择不访问的网站。许多地区的宽带提供商竞争不充分，如果您不喜欢\
  \ ISP 如何使用您的个人信息，要“用脚投票”要困难得多。\n\n联邦法律允许国会在机构规则通过后一定期限内予以阻止，2017 年 3 月，国会利用《国会审查法案》（该法案允许国会在六十个立法日内撤销监管机构的行动）通过联合决议否决了宽带隐私规则。特朗普政府的\
  \ FCC 还采取额外措施推翻宽带重新分类，重新解除对宽带服务提供商的监管。其效果是现任 FCC 阻碍了上届政府将互联网服务视为受《通信法案》相关条款约束的公共承运人的努力。\n\
  \n###### 保护特定群体的联邦法规\n\n前几段重点讨论了联邦隐私法保护（或未保护）的信息类型。还有联邦法规旨在保护特定群体，如儿童、学生和最高法院提名人。1998\
  \ 年，国会颁布《儿童在线隐私保护法案》（COPPA），对面向 13 岁以下儿童的网站施加了重大新要求。换言之，COPPA 是 Facebook 等网站在其使用条款中列出最低年龄\
  \ 13 岁的原因，也是您的侄女最初谎报年龄注册 Facebook 账户的原因，直到她决定 Instagram 更好。\n\n《家庭教育权利和隐私法案》（FERPA）涉及教育机构的信息隐私，从而保护学生隐私。19\
  \ FERPA 于 1974 年颁布，适用于接受联邦资助的所有教育层级。20 FERPA 下的“教育记录”包括学校持有的各类信息，不仅限于成绩。FERPA 将“教育记录”定义为包含“直接与学生相关的信息”且“由教育机构或机构或代表该机构或机构行事的人员维护”的材料。21\n\
  \n\n\n\n\n####### FERPA 隐私保护\n\nFERPA 通过两种方式保护隐私：(1) 确保学生及/或其父母能够查阅学生的教育记录，并提供一种质疑记录内容的方式[²²]；(2)\
  \ 禁止教育机构在未适用例外情况或未获得同意的情况下，将学生的教育记录与他人共享[²³]。例如，在学生年满 18 岁之前，父母对这些记录拥有广泛的查阅权，但年满\
  \ 18 岁或以上学生的父母，只有在该学生被视为父母纳税意义上的受抚养人时，才能在未经学生同意的情况下获取其教育记录[²⁴]。FERPA 法规还规定了在披露教育记录中包含的信息前必须获得同意的更具体准则[²⁵]。\n\
  \n###### 视频隐私保护法案 (VPPA)\n\n关于我们三段前提到的第三类群体，不，并不存在“最高法院提名人隐私保护法案”。我们拥有的是**视频隐私保护法案\
  \ (VPPA)**，该法案是在罗伯特·博克 (Robert Bork) 最高法院大法官提名失败后颁布的。罗伯特·博克认为宪法中不存在隐含的隐私权“阴影”，因此隐私保护必须由立法赋予[²⁶]。一位名叫迈克尔·多兰\
  \ (Michael Dolan) 的作家与博克住在同一个社区，他向当地的录像带租赁店索要博克租借过的电影清单。清单中包括《无情大地有情天》(Ruthless\
  \ People)、《擒凶记》(The Man Who Knew Too Much) 和《赛马场的一天》(A Day at the Races) 等主流电影。这显然更多是一种象征性的举动，而非人格抹杀，而且迈克尔·多兰实际上并不反对博克的提名。尽管如此，这一漏洞已暴露无遗，决策者迅速颁布了\
  \ VPPA，将录像带租赁记录纳入法定受保护的私人信息范畴。一种解读认为 VPPA 代表了联邦立法中“吱吱作响的车轮得润滑”式的应对方式，但这也可能表明许多政客意识到，他们自己的录像带租赁记录比博克的更“精彩”。\n\
  \n###### 州隐私法律\n\n各州也制定自己的隐私法律。正如前几章所讨论的，所有五十个州都有关于数据泄露通知的法律，且许多州在其法律中还有额外要求。例如，马萨诸塞州的法规要求制定详细的数据安全程序，以保护联邦州居民的个人信息[²⁷]。这些法规包括要求对个人信息进行加密，并对系统进行“合理监控”，以防止“未经授权使用或访问个人信息”。明尼苏达州有一项商家责任法规，规定如果泄露事件影响“存取设备”（定义为包括信用卡和借记卡），且泄露受害者在交易授权后不当保留了持卡数据，则泄露方公司需承担责任[²⁸]。加利福尼亚州的**宋-比弗利法案\
  \ (Song-Beverly Act)** 禁止商家要求顾客提供地址、邮政编码或电话号码等个人信息“作为接受顾客信用卡的条件”。第 6 章对州数据泄露法律的讨论中将探讨类似的法规。\n\
  \n##### 欧盟的隐私保护\n\n在欧盟，隐私被视为一项基本权利。**通用数据保护条例 (GDPR)** 于 2016 年经欧洲议会和欧盟理事会批准，并于\
  \ 2018 年 5 月 25 日生效。GDPR 取代了 1995 年颁布的**数据保护指令 95/46/EC**。由于 GDPR 是一项条例而非指令，它无需成员国通过实施立法即可生效。GDPR\
  \ 的某些条款明确允许成员国法律存在一定的差异。例如，GDPR 的**第 23 条**规定了成员国如何限制 GDPR 中列举的某些义务和权利。\n\nGDPR\
  \ 包含 99 个条款和 173 条序言。大多数序言提供评论和示例，以阐明条款的各个方面。十一条条款提供关于 GDPR 的一般信息。十二条条款涉及数据主体的权利，二十条条款探讨控制者和处理者的义务。七条条款涉及向不受\
  \ GDPR 约束的国家或组织传输个人数据。八条条款详述可用的补救措施和潜在的处罚。其余条款主要关于 GDPR 的管理。\n\n###### GDPR 范围与定义\n\
  \nGDPR 适用于个人数据的处理。**处理** 被广泛定义为“对个人数据或个人数据集合执行的任何操作或一组操作”。GDPR 监管个人数据**控制者** 和**处理者**\
  \ 的行为。**控制者** 是决定如何处理个人数据的个人或实体。**处理者** 是代表控制者处理数据的第三方。\n\nGDPR 下的**个人数据** 涵盖种类极其广泛的信息。信息所指向的自然人在\
  \ GDPR 下被称为**数据主体**。个人数据是指可用于直接或间接识别数据主体的数据，包括姓名和识别号码等常见信息。GDPR 下的个人数据还包括位置数据、在线标识符，以及数据主体“体现其身体、生理、基因、心理、经济、文化或社会身份的因素”。GDPR\
  \ 的**第 9 条** 列明了除非适用例外情况否则不得处理的个人特殊类别数据。这些特殊类别包括种族或民族出身、政治观点、宗教或哲学信仰、工会会员身份、基因和生物特征数据、健康数据，以及关于个人性生活或性取向的数据。重要的是，数据主体不限于控制者的客户。控制者的雇员也是受\
  \ GDPR 保护的数据主体。\n\n###### GDPR 领土范围 (第 3 条)\n\n根据**第 3 条**，控制者或处理者的活动受 GDPR 管辖共有三种方式。第一，GDPR\
  \ 适用于在欧盟设立的控制者和处理者。第二，GDPR 适用于处理位于欧盟境内的数据主体个人数据的控制者和处理者。**第 3(2) 条** 的具体措辞提及“在联盟内”的数据主体，因此按其语言表述，其不限于欧盟公民，原则上也可适用于保护在欧洲度假的美国人的个人数据。第三，如果公认的国际法承认某成员国法律适用，则\
  \ GDPR 适用于欧盟境外的情况。GDPR 的序言以外交使团或领事馆为例，说明了这一第三种选项。\n\n###### GDPR 数据处理原则 (第 5 条)\n\
  \nGDPR 的**第 5 条** 为个人数据确立了一些基本保障。此类数据必须依法、公平且透明地进行处理。数据收集必须具有特定、明确和合法的目的，收集应仅限于为实现这些目的所必需的个人数据，且个人数据的处理方式必须与这些目的相兼容。控制者还有义务确保其保护下的个人数据的准确性、完整性和保密性。\n\
  \n[²²]: section19.xhtml#ftn.229\n[²³]: section19.xhtml#ftn.230\n[²⁴]: section19.xhtml#ftn.231\n\
  [²⁵]: section19.xhtml#ftn.232\n[²⁶]: section19.xhtml#ftn.233\n[²⁷]: section19.xhtml#ftn.234\n\
  [²⁸]: section19.xhtml#ftn.235\n\n\n\n\n###### GDPR 数据主体权利与合法处理\n\n####### 数据主体权利（第\
  \ 12 条，第 3 章）\n\nGDPR 第 12 条要求控制者告知数据主体其在 GDPR 下享有的权利。这些权利列举于 GDPR 第 3 章的其余部分：\n\
  \n- **知情权** 了解其个人数据的处理情况（第 13–15 条）\n- **更正权** 更正其个人数据（第 16 条）\n- **限制处理权或反对权**\
  \ 限制或反对对其个人数据的处理（第 18 条和第 21 条）\n- **数据可携权** —— 以机器可读格式获取其个人数据（第 20 条）\n- **被遗忘权**（第\
  \ 17 条） —— 要求控制者具备删除数据主体所有个人数据的能力\n- **通知义务**（第 19 条） —— 控制者必须根据数据主体的请求，通知任何接收方个人数据的变更\n\
  - **人工审查权**（第 22 条） —— 如果处理可能对数据主体产生“法律效力”或以其他方式对其产生重大影响，数据主体有权要求由人而非自动化系统处理其个人数据\n\
  \n控制者有一个月的时间回应客户主张其 GDPR 权利的请求，除有限情况外，不得向客户收取此回应的费用。\n\n####### 处理的合法依据（第 6 条）\n\
  \n根据 GDPR 第 6 条，处理具有合法依据的方式有多种：\n\n######## 同意\n首先，如果数据主体已给予同意，则处理是合法的。GDPR 对同意的标准高于许多互联网用户习惯的标准：\n\
  \n- **第 3 条**：同意必须是“自由给予的、具体的、知情的和明确的。”\n- **第 7 条**：规定了同意的若干条件。数据控制者必须能够证明数据主体已给予同意。\n\
  - **撤回权**：数据主体有权随时撤回其同意，且撤回同意必须像给予同意一样容易。\n- **选择加入模式**：GDPR 对同意采用选择加入模式，即必须做出主动选择才能同意处理。\n\
  - **附条件同意**：如果同意是使用服务的条件，GDPR 认为这种动态可能会影响法院认定同意并非自由给予。\n- **第 8 条**：要求控制者在处理 16\
  \ 岁以下数据主体的个人数据前获得父母同意。成员国可选择设定较低年龄，但在任何情况下，如果数据主体未满 13 岁，其同意均无效。\n\n######## 其他合法依据\n\
  在没有充分同意的情况下，处理在 GDPR 下仍可能合法，情形包括：\n\n- 为履行合同所必需\n- 为遵守法律义务\n- 为保护他人的重大利益\n- 所涉任务属于公共利益\n\
  - **合法利益** —— 使处理合法的更广泛规定，但 GDPR 警告数据主体的权利可能凌驾于这些合法利益之上\n\n####### 国际数据传输\n\n受 GDPR\
  \ 约束的个人数据可传输至欧盟以外的国家，前提是满足条件：\n\n- **第 45 条**：如果委员会已认定接收方司法管辖区确保了个人数据的充分保护水平，则该传输无需特别授权。\n\
  - **第 46 条**：如果不存在此类充分性认定，控制者或处理者必须为传输提供适当的保障措施。\n\n######## 历史背景\n自《95/46/EC 数据保护指令》通过以来，国际数据传输一直是重要考量因素：\n\
  \n- **2000–2015 年**：美国与欧洲之间的数据传输由 **安全港框架** 实现。\n- **2015 年 10 月**：欧洲法院判决废除了安全港。\n\
  - **2016 年起**：传输由 **欧盟-美国隐私盾** 管辖。\n- 推测隐私盾将继续作为工具，用于判断公司的保障措施是否足以符合 GDPR 合规要求。\n\
  \n####### 合规要求\n\n为遵守 GDPR，与欧洲客户开展业务的公司通常被建议：\n\n- 对其系统进行彻底审计，以确定信息流向的路径及最终去向\n\
  - 实施安全措施\n- 指定 **数据保护官**\n\n######## 数据泄露通知\n- 控制者必须在发现泄露后 **72 小时** 内通知监管机构（通常为政府机构）。\n\
  - 受泄露影响的数据主体必须“毫不拖延”地收到通知。\n\n####### 执法与处罚\n\n- **第 79 条**：数据主体有权就控制者或处理者违反其在 GDPR\
  \ 下的权利提起诉讼。\n- **第 83 条**：规定了行政罚款的条件。\n- **最高罚款**：2000 万欧元或控制者全球年收入的 4%。\n- **未报告个人数据泄露**：最高罚款\
  \ 1000 万欧元或控制者全球年收入的 2%。\n\n---\n\n#### II. 隐私与社交媒体\n\n尽管联邦政府有若干针对特定行业的隐私法律，但信息技术行业在美国仍\
  \ largely 处于无监管状态。这种情况可能会改变，因为公众对社交媒体服务隐私的看法似乎正从对数据收集的宽容态度转变。相反，社交媒体网站上可能的隐私侵犯，通常根据其是否以及在多大程度上违背网站的使用条款来判断。\n\
  \n##### Facebook 情绪传染研究（2012 年）\n\n如果您在 2012 年 1 月拥有 Facebook 账户，Facebook 可能会改变您在新闻动态中看到的内容，以观察是否会影响您的情绪。\n\
  \n2014 年，一个研究团队发表了一项有争议的研究，题为 **“通过社交网络进行大规模情绪传染的实验证据”**。三位作者之一是 **Facebook 数据研究科学家**，这使得研究人员能够拥有近\
  \ **70 万名不知情的测试对象**。\n\n###### 方法论\n- 大多数 Facebook 用户使用 Facebook 的 **新闻动态** 工具了解其社交网络的最新情况。\n\
  - 研究人员操纵测试对象的 **新闻动态**，使其显示来自 Facebook 好友的更多积极或消极帖子。\n- 研究人员随后监控对象的帖子，以查看被操纵的新闻动态的情感内容是否影响了对象帖子的情感内容。\n\
  \n###### 伦理担忧\n在互联网上，公司尝试其用户界面以查看新设计是否能更好地留住用户兴趣是常见做法 —— 这称为 **A/B 测试**。许多技术专业人士为\
  \ Facebook 的实验辩护，称其类似于 A/B 测试。然而：\n\n- Facebook 并非试图确定哪种界面对业务更有利。\n- Facebook 故意操纵用户所见内容，以对用户情绪进行实验。\n\
  \n####### 知情同意问题\n在发表的文章中，作者明确声称，因为研究由 Facebook 进行，参与者已受 Facebook **数据使用政策** 约束，且因他们同意该政策，故提供了知情同意。\n\
  \n**然而**，根据存档网站显示，Facebook 的数据使用政策最早直到 **2012 年 5 月** 才规定 Facebook 可将您的数据用于研究。这意味着当\
  \ Facebook 在 **2012 年 1 月** 进行此实验时，即使接受隐私政策等同于知情同意，那 **689,003 名用户** 在数据收集时也未同意此项研究。\n\
  \n\n\n\n\n##### Facebook 隐私政策与实践\n\nFacebook 长期以来在用户隐私方面存在有问题的政策。2011 年，Facebook\
  \ 与 FTC（联邦贸易委员会）签署了一项同意令，该令禁止 Facebook “就消费者个人信息的隐私或安全作出虚假陈述。”[²⁹] 在备受争议的情绪研究发表后，电子隐私信息中心向\
  \ FTC 提交投诉，请求调查，指控该行为部分违反了 Facebook 早先的同意令。当时 FTC 未采取行动。\n\n目前，Facebook 广告的主要方式是利用关于用户的各种数据点。《华盛顿邮报》2016\
  \ 年报道称，Facebook 追踪 98 个不同的数据点，这些数据点来源于发布到 Facebook 的信息、用户登录 Facebook 状态下访问的特定网站，以及\
  \ Experian、Acxiom 和 Epsilon 等数据经纪人收集的信息。[³⁰] Facebook 还因允许广告商排除受保护群体而受到批评。在可能违反《公平住房法》的情况下，想通过\
  \ Facebook 投放广告的房东可以主动决定将非裔美国人排除在广告受众之外。[³¹] 这个例子显示了将歧视隐藏在看似公正的算法背后的可能性。\n\n#####\
  \ Facebook 与剑桥分析公司\n\n2018 年，随着剑桥分析公司购买了多达 8700 万独立 Facebook 用户档案中提取的信息这一消息的曝光，公众对\
  \ Facebook 隐私实践的关注再度升温。据称，这些数据被用于开发心理画像，以帮助政治竞选活动通过最有效的广告定向用户，有人认为这可能影响了 2016 年总统大选。Facebook\
  \ 还据称向俄罗斯操盘手出售了广告，其目标是在 2016 年大选前在美国选民中制造分歧。\n\n2010 年，Facebook 对其平台进行了一项更改，允许第三方应用开发者获得更多\
  \ Facebook 用户数据的访问权限。Facebook 禁止第三方应用开发者将用户数据出售给他人，但这些条款被证明难以执行。第三方应用必须在安装期间获得用户许可，但一旦授予许可，它们就能访问指定的用户数据。例如，FourSquare\
  \ 应用用于在实体地点“签到”，用户只需单击一下，该应用就会将用户的位置发布给其 Facebook 好友。为此，该应用需要访问用户的位置、代表用户发帖的权限，以及访问用户的“好友列表”以识别使用该应用的好友。默认情况下，许多此类应用请求大量访问权限，但用户可以选择退出其中部分请求。选择退出数据收集通常要求在应用初始安装期间取消勾选复选框。\n\
  \n2013 年，一名名为 Aleksandr Kogan 的学术研究人员创建了一个名为“This Is Your Digital Life”（这是你的数字生活）的第三方应用。该应用包含一个性格测试，且默认应用权限极其宽泛。30\
  \ 万人安装了该应用。部分安装该应用的人授予了该应用不仅访问其好友列表，还访问其私人消息的权限。总计而言，这 30 万次安装使 Kogan 的应用能够访问 8700\
  \ 万用户的 Facebook 档案信息。据称，Kogan 下载了他能访问的所有数据，然后将这些数据出售给相关方，包括剑桥分析公司。凭借详细的记录，剑桥分析公司创建了用户的心理画像，据称这些画像被用于开发产品，推广虚假新闻故事和宣传，以影响选举并支持特定政治竞选活动。\n\
  \n总之，几年来，Facebook 允许第三方应用开发者请求广泛访问用户数据，许多应用请求的信息远超其功能所必需的范围。Kogan 利用“This Is Your\
  \ Digital Life”这一设计，收集了 30 万应用安装者及其约 8700 万好友的信息。Kogan 将数据出售给剑桥分析公司，后者据称利用这些数据帮助政客当选。\n\
  \n在 2018 年的国会听证会上，Facebook 创始人 Mark Zuckerberg 多次指出，由于 Facebook 在 2014 年大幅限制了第三方应用的潜在访问权限，这一系列事件在\
  \ Facebook 当前的平台上已不可能发生。2015 年，当他们得知 Kogan 违反了与 Facebook 的协议条款时，Zuckerberg 称 Facebook\
  \ 要求 Kogan 和剑桥分析公司从其系统中删除挪用的数据。当被问及公司是否根据 2011 年的同意令向联邦贸易委员会披露了该事件时，Zuckerberg 告知参议院，Facebook\
  \ 未通知 FTC，因为他们将其视为一个“已结案”的问题。\n\nFTC 显然持不同意见，并已启动调查，以确定 Facebook 是否违反了早先的同意令。截至撰写本文时，FTC\
  \ 的调查结果尚未公布，但违反同意令可能导致每次隐私违规处以 40,000 美元的罚款。如果 Facebook 被罚款，FTC 将不得不决定是基于单独事件的数量、受影响个人的数量，还是其他指标来设定罚款金额。\n\
  \n##### 社交网络上的合同\n\n服务条款协议（TOS 协议）和隐私政策是实际上每位互联网用户在使用每个网站时都必须接受的合同。TOS 协议规定了服务提供商与其客户之间关系的条款。通常，面向个人用户的基于\
  \ Web 的服务附带不可协商的 TOS 协议，这些协议有利于服务提供商而非最终用户。隐私政策通常伴随 TOS 协议，用户同意网站的隐私政策即表示同意其中包含的条款。这些条款通常涉及将收集哪些信息以及与谁共享这些信息。隐私政策通常还涉及数据安全问题，如数据传输过程中\
  \ SSL 加密的使用。\n\n根据合同普通法，缔结合同需要双方共同同意。当合同不可协商，且由强势方以“要么接受要么放弃”的方式提供时，该合同通常被称为附合合同。隐私政策和\
  \ TOS 协议通常符合附合合同的定义。此类合同不会自动无效，但可能受到更严格的审查。如果法院认定合同显失公平，则可能无法强制执行。[³²] 目前尚不清楚 TOS\
  \ 协议和隐私政策在多大程度上能满足 GDPR 关于自由给予的知情同意的要求。\n\n国会于 2016 年颁布了《消费者评论公平法案》（CRFA）。CRFA 解决了与社交媒体网站上常见的点击式协议相关的问题。大多数人不会阅读他们所接受的条款，如果他们与提供产品的公司发生纠纷，这可能成为一个问题，因为这些未知条款现在已成为具有约束力的合同的一部分。CRFA\
  \ 专门针对限制客户发布评论权利的格式合同。\n\n[²⁹]: section19.xhtml#ftn.236\n[³⁰]: section19.xhtml#ftn.237\n\
  [³¹]: section19.xhtml#ftn.238\n[³²]: section19.xhtml#ftn.239\n\n\n\n\n2003 年，纽约一家法院裁定，流行的防病毒公司\
  \ McAfee 不得再在其格式合同中使用禁止客户在未经 McAfee 许可的情况下发布产品评论或基准测试的语言。然而，该裁决仅适用于一个司法管辖区内的一家公司。自那时起，类似的噤声条款仍不断出现。例如，度假租赁房屋的业主可能会偷偷加入一条规定，赋予业主在遇到差评时保留初始押金的权利。《消费者评论公平法案》（CRFA）规定，格式合同中禁止客户发布评论的条款，或要求客户将其在评论中的知识产权转让给公司的条款均属无效。\n\
  \n当然，也存在例外情况。该禁令不影响公司在存在诽谤、或评论与公司提供的商品或服务无关、或评论明显虚假或具有误导性时采取行动的能力。如果评论包含辱骂性或不当内容，或包含机密或其他敏感信息（如商业秘密或医疗信息），仍可予以删除。\n\
  \n法定语言赋予联邦贸易委员会（FTC）执行《消费者评论公平法案》的权力。州检察长和州消费者保护官员也可以调查并起诉在其格式合同中包含这些禁止条款的公司。\n\n\
  最终，《消费者评论公平法案》应能保护客户免受一种被用来压制诚实批评的手段的侵害。然而，SLAPP（针对公众参与的策略性诉讼）仍是一个问题。SLAPP 代表“针对公众参与的策略性诉讼”。28\
  \ 个州加上哥伦比亚特区拥有反 SLAPP 法律。《消费者评论公平法案》解决了公司利用格式合同中的噤声条款欺凌批评者使其噤声的问题，但并未解决全部问题。尽管如此，有人认为反\
  \ SLAPP 法律使得真诚的原告更难请求法院纠正真正的不法行为，目前尚不清楚我们应如何控制法律制度的滥用。\n\n#### III. 生物识别信息隐私法\n\n\
  最后，我们将重点关注信息保护法律中不断增长的一个子集：涉及生物识别数据隐私的法律。近年来科技领域最显著的进步之一，或许莫过于生物识别安全功能的广泛引入。对于消费者而言，苹果和安卓智能手机、笔记本电脑以及“智能”安防设备等产品，现在正利用指纹和面部扫描来准确识别用户。在商业领域，许多公司开始使用指纹识别，以减少员工打卡欺诈，并保障敏感文件的访问安全。甚至像六旗大美洲乐园和\
  \ Ticketmaster 这样的公司，也已开始在门票上使用生物识别安全技术，确保只有持票人才能入场，防止个人共享门票或倒卖门票。\n\n生物识别学是利用人体固有的物理特性来识别个人身份的科学。指纹、视网膜、声纹匹配，甚至一个人的步态都能起到唯一识别作用，从而被用于解锁各种安全系统。公司热衷于开发生物识别安全系统，以提高安全性，甚至创造更便捷的身份验证方法。\n\
  \n生物识别安全背后的理论很简单。通过利用个体独有的固有生物特征，我们实际上将自己的身体变成了钥匙；钥匙始终随身携带、随时可用，且难以轻易复制。通过增加生物识别安全功能，用户也免去了携带物理钥匙或记忆密码的麻烦，这两者都可能因用户疏忽而丢失或被盗。但重要的是要注意，生物识别安全并不专门涉及人类基因组；一个人的\
  \ DNA 序列被视为一个独立领域，区别于现代生物识别学所关注的内容。\n\n生物识别安全的相对新颖性，导致制定针对生物识别数据隐私的具体法律的州寥寥无几。在州立法机构未对生物识别安全制定规则的情况下，企业和私人实体收集和存储生物识别数据有多大的自由度？谷歌、苹果或\
  \ Facebook 等公司能否逍遥法外地收集和编目指纹等独特的生物识别标识符？这些公司可以将生物识别数据用于何种目的？这些问题尤为突出，因为生物识别标识符具有永久性；我们无法像更改信用卡号或密码那样轻易更改指纹或视网膜等常见的生物识别标识符。生物识别数据一旦被盗无法更改或替换，这使得生物识别数据库成为数据窃贼极具诱惑的目标。\n\
  \n极少数州立法机构颁布了具体的生物识别数据隐私法律。只有伊利诺伊州、德克萨斯州和华盛顿州法律条文中有关于生物识别数据的具体规定。伊利诺伊州的《生物识别信息隐私法案》（BIPA）于\
  \ 2008 年颁布，被认为是美国历史最悠久、范围最广、最全面的数据隐私法。在 BIPA 通过后，德克萨斯州于 2009 年跟进颁布了《生物识别标识符获取或使用法》（CUBI）。最近，华盛顿州于\
  \ 2017 年颁布了一套生物识别安全法律。每个州都颁布了略有不同的政策，并划定了各州立法机构认为在企业利益和个人隐私权之间达到的适当平衡。\n\n一些州将生物识别信息纳入个人信息的定义中，而个人信息早已受现有通用隐私法律管辖。在联邦层面，关于生物识别安全的立法进展甚微，仅有《儿童在线隐私保护法案》（COPPA）专门规范从未成年人那里收集生物识别数据（且仅涵盖收集未成年人的图像或声音）。\n\
  \n尽管伊利诺伊州、德克萨斯州和华盛顿州之间存在一些差异，但这三个州的法律都具有以下共同特征：\n\n*   适用于私人实体；\n*   要求私人实体在收集生物识别信息前提供通知；\n\
  *   限制或禁止生物识别数据的出售或披露；\n*   强制规定与生物识别数据存储相关的保护标准和保留指南；以及\n*   要求在生物识别数据不再用于其最初收集目的时最终销毁该数据。\n\
  \n##### a. 定义生物识别数据\n\n拥有专门生物识别数据法律的三个州，各自都有“生物识别信息”的法律定义。区分各州定义范围内包含哪些类型的数据非常重要，因为覆盖范围的广度可能会导致某些形式的生物识别安全被纳入或排除在外。\n\
  \n在伊利诺伊州，BIPA 将“生物识别标识符”定义为“视网膜或虹膜扫描、指纹、声纹，或手部或面部几何结构扫描”。BIPA 还适用于“生物识别信息”，其定义为“无论以何种方式捕获、转换、存储或共享，基于个人生物识别标识符用于识别个人的任何信息”。对“生物识别信息”的额外覆盖意味着，任何数据转换（如将视网膜或指纹扫描转化为数学函数）本身也受到保护。但“生物识别标识符”不包括书写样本、手写签名、一般照片、用于科学测试的人体生物样本、人口统计数据、纹身描述、身高、体重或眼睛颜色等身体描述，或在医疗环境中从患者处获取的信息。\n\
  \n\n\n\n###### 德克萨斯州生物识别数据保护\n\n德克萨斯州仅将生物识别数据保护延伸至**生物识别标识符**，其中包括“视网膜或虹膜扫描、指纹、声纹，或手部或面部几何结构扫描”，这与\
  \ BIPA 标准大体相似。然而，与 BIPA 不同的是，德克萨斯州的定义中不包含“生物识别信息”，这意味着生物识别数据的抽象表现形式，或对生物识别数据的分析，本身不受德克萨斯州法律保护。[³⁹]\n\
  \n###### 华盛顿州生物识别数据保护\n\n在华盛顿州，**生物识别标识符**被定义为“通过自动测量个人生物特征生成的数据”，包括“指纹、声纹、眼视网膜、虹膜，或用于识别特定个人的其他独特生物模式或特征”。[⁴⁰]\
  \ 虽然该定义比德克萨斯州的更宽泛、更具扩展性，甚至可能比 BIPA 的定义更宽泛，但该法律并未明确列举面部几何结构或手部形状。此外，华盛顿州特别排除了“物理或数字照片、视频或音频记录，或由此生成的数据”，这表明立法者在面部识别技术方面划定了一个例外。华盛顿州的法律涵盖因分析生物识别信息而产生的任何数据，但为特定行业划出了具体例外，例如用于监控员工工作时间表的考勤应用。为便于理解背景，值得注意的是华盛顿州是亚马逊总部所在地，该公司在面部识别技术领域不断创新。亚马逊的面部识别技术正日益被执法机构使用。\n\
  \n##### 商业目的与保护范围\n\n生物识别信息的预期用途可决定法律的适用范围。德克萨斯州和华盛顿州均将其生物识别数据法律限制在具有商业目的的行为上。德克萨斯州未针对生物识别数据定义何为“商业”性质的目的。[⁴¹]\n\
  \n华盛顿州将“商业目的”定义为“为向第三方销售或披露生物识别标识符以营销商品或服务而推进的目的，而该商品或服务与个人首次获取他人生物识别标识符的初始交易无关”。[⁴²]\
  \ 华盛顿州法律明确区分了“商业目的”与“安全目的”，后者“防止商店行窃、欺诈，或任何其他对贵重物品的挪用或盗窃”。其效果是华盛顿州法律的适用范围受到限制；仅适用于涉及“第三方”的交易，且仅适用于“商业”交易。\n\
  \n伊利诺伊州的 BIPA 没有类似的商业限制语言，广泛适用于所有非政府的商业和安全筛查交易。[⁴³]\n\n##### 通知与同意\n\n生物识别隐私法旨在解决的最大问题之一，是企业如何收集并获取同意以存储大量个人可识别信息。此外，所有隐私法都要求向提交生物识别数据的人员发出通知。然而，可接受的通知形式因州而异。\n\
  \n###### BIPA（伊利诺伊州）\n\nBIPA 对通知有若干具体要求。通知必须声明：\n\n1.  “正在收集或存储生物识别标识符或生物识别信息”\n\
  2.  “收集、存储和使用生物识别标识符或生物识别信息的具体目的和期限长度。”[⁴⁴]\n\n此外，通知和同意表格必须采用书面形式，这给公司带来了更高的合规负担。另外，BIPA\
  \ 强制要求公司向员工提供一份书面政策，该政策须：\n\n1.  制定生物识别数据的保留时间表；以及\n2.  说明员工的生物识别数据将如何被销毁。[⁴⁵]\n\
  \n###### 德克萨斯州\n\n相比之下，德克萨斯州对通知或同意没有实质性要求。与 BIPA 不同，德克萨斯州的通知要求不强制公司向公众披露具体的期限或目的。\n\
  \n###### 华盛顿州\n\n最后，华盛顿州强制规定，任何人不得在未先提供通知并获得同意，或未提供“防止随后将生物识别数据用于商业目的的机制”的情况下，放弃生物识别标识符。[⁴⁶]\
  \ 与德克萨斯州一样，华盛顿州法律的要求未作明确规定，仅要求同意须“视语境而定”，并“通过合理设计以便于受影响个人随时获取的程序给出”。\n\n##### 诉权\n\
  \n仅 BIPA 在生物识别隐私法被违反时设立了私人诉权。在华盛顿州和德克萨斯州，仅州检察长可提起诉讼。[⁴⁷] BIPA 的这一独特特性确保了伊利诺伊州仍是美国生物识别安全和数据隐私判例法的重要（如果不是唯一）来源。\n\
  \nBIPA 的诉权于 2019 年得到伊利诺伊州最高法院的确认。[⁴⁸] *Rosenbach* 案涉及使用指纹进行公园入场验证。法院裁定，根据 BIPA 提起的诉讼，无需证明除违反\
  \ BIPA 所赋予权利之外的实际损害。\n\n##### 披露与出售限制\n\n总体而言，这三个州的隐私法均限制生物识别信息的披露。为使公司合法披露生物识别数据，个人必须给予同意，或披露属法律强制要求。此外，若披露系依据搜查令或法院命令强制要求，公司可合法披露生物识别数据。最后，三州均允许在为完成个人授权的金融交易而必要的情况下进行披露。\n\
  \n关于生物识别数据的出售，BIPA 完全禁止生物识别信息的出售、租赁或交易。[⁴⁹] 然而，华盛顿州和德克萨斯州的法规在满足披露要求时允许出售生物识别数据。尽管德克萨斯州将出售或披露的情形限制在三种实例中：\n\
  \n*   为识别失踪或死亡人员；\n*   州法律要求或为追究搜查令；或\n*   为完成金融交易。[⁵⁰]\n\n华盛顿州也列举了关于生物识别数据披露的若干例外情况。[⁵¹]\
  \ 允许在以下情形下披露：\n\n*   “为提供个人订阅、请求或明确授权的产品或服务所必需”；\n*   “向第三方披露，该第三方在合同上承诺不再进一步披露该生物识别标识符，且不会将其录入数据库用于与通知和同意要求不一致的商业目的”；或\n\
  *   “为诉讼准备，或为回应或参与司法程序而作出的披露。”\n\n##### 生物识别数据的销毁与保留\n\n无论哪个州，所有三部法规均对公司可合法保留和存储生物识别数据的期限设定了一定限制。\n\
  \n在伊利诺伊州，企业必须在“收集或获取此类标识符或信息的初始目的已达成，或自个人与私人实体最后一次互动之日起三年内，以先发生者为准”时删除生物识别数据，[⁵²]\
  \ 这设定了公司在数据不再使用后最多可保留三年数据的上限，此后伊利诺伊州法律强制要求删除生物识别数据。此外，BIPA 强制要求公司必须公开其保留政策并予以披露。\n\
  \n[³⁹]: section19.xhtml#ftn.246\n[⁴⁰]: section19.xhtml#ftn.247\n[⁴¹]: section19.xhtml#ftn.248\n\
