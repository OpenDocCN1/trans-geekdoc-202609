  \n## 第 5 章\n\n### 州网络犯罪法\n\nCFAA 为网络犯罪提供了联邦框架，且所有五十个州均在其州法典中制定了额外的网络犯罪法。本章探讨各州应对网络犯罪的方法可能存在的差异。美国目前尚无统一的网络事件法，《模范刑法典》也缺乏对网络犯罪日益增长的威胁的实质性探讨。\n\
  \n近年来，助长最严重网络犯罪事件的技术呈爆发式增长，但尽管国会做出努力，CFAA 自 2008 年以来未曾修订。一些州更新网络犯罪法律的步伐也较慢，无法跟上不断扩大的威胁，但大多数州在\
  \ 2012 年至 2018 年间至少修订过一次其网络犯罪法。\n\n\n\n\n\n#### 网络犯罪法律：演变、组织与实体构成要素\n\n##### 演变与管辖权复杂性\n\
  \n仅在过去十年中这些法律发生了如此巨大的变化，这一事实就已将网络犯罪与盗窃和纵火等旧类犯罪区分开来。重要的是，当诉讼在技术层面变得复杂时，律师应牢记网络犯罪法律的演变性质。例如，由于互联网上国家和州边界的模糊现实，管辖权在网络犯罪起诉和民事诉讼中可能是一个棘手的话题。有二十五个州在其网络犯罪法律中，或在引用网络犯罪法律的单独条款中，明确处理管辖权和审判地问题。\n\
  \n##### 网络犯罪法律的组织\n\n网络犯罪法律的组织结构也值得注意。大多数州在其成文法中设有专门针对计算机犯罪的章或分章。然而，少数州将网络犯罪条款分散在各种其他刑事条款中。例如，俄亥俄州将计算机犯罪条款插入其成文法第\
  \ 2909 章（标题为“纵火及相关犯罪”）的若干不连续位置。\n\n##### 章节结构与参考表\n\n本章其余部分总结了美国各地网络犯罪法律的一些共同构成要素。本章不单独讨论各州的网络犯罪法律，而是笼统地提及反复出现的主题。法条列于附录中。为了代替本章中的个别州引用，我们制作了表格，列出了州网络犯罪法律的若干不同方面以及涉及这些方面的州。这些表格置于本章末尾。如果某州有特定类别的条款，其邮政缩写将列在右栏。\n\
  \n##### I. 实体法\n\n###### 授权：核心概念\n\n各州对社会变迁的回应各不相同，但所有五十个州在其网络犯罪法律中都强调授权这一概念，这并不令人意外。某行为是否获得授权或是否超出授权访问，对\
  \ CFAA（计算机欺诈和滥用法）至关重要。州法律亦然，尽管只有二十五个州明确禁止超出授权访问的行为。\n\n授权是 CFAA 下巡回法院分歧的主题。联邦层面的一个根本问题是如何判断某行为是否属于授权，因为\
  \ CFAA 未提供授权的定义。在州层面，二十一州以某种形式定义了授权。一些州从“无授权”的含义来界定，另一些州则从“授权用户”的含义来界定。定义范围从同义反复（如：授权用户是获授权的用户）到引用默示和明示同意的详细定义不等。\n\
  \n###### 未经授权的访问：轻罪与重罪\n\n在 CFAA 中，仅基于导致获取信息的未经授权访问设有一项轻罪条款，而重罪条款则要求未经授权访问*加上*其他要素——例如，未经授权访问*加上*实施犯罪或侵权行为的意图。在各州中，三十八个州的网络犯罪法律包含对未经授权访问的广泛禁止，且几乎所有州都考虑与未经授权访问相关的意图或后果。最常见的一类条款涉及未经授权访问与改变、损坏或破坏计算机、网络、程序或数据的行为相结合的情况。各州常使用多个动词来涵盖这些概念，但许多州寻找的核心概念是由未经授权访问所引起的*改变*。一些法律更为具体。二十八个州有法律禁止未经授权引入计算机污染物，十五个州有法律禁止未经授权的间谍软件。2018\
  \ 年 4 月，佐治亚州立法机构通过一项法案，扩大其网络犯罪法律，将单纯的未经授权访问定为轻罪，无需造成不良后果。州长否决了该法案，理由是担心该法案的范围可能阻碍防范网络攻击的努力。\n\
  \n###### 基于意图的网络犯罪\n\n网络犯罪也根据意图进行定义和区分。三十六个州的网络犯罪法律涵盖为获取有价值物品而实施的访问，三十八个州涵盖为实施欺诈而实施的访问，二十七个州涵盖为获取计算机服务而实施的访问。十个州禁止使用计算机实施单独的犯罪。例如，路易斯安那州网络犯罪法律第\
  \ 73.9 节规定，使用虚拟街道地图协助实施犯罪，将在基础犯罪刑期上至少增加一年。\n\n###### 以数据为中心的条款\n\n网络犯罪法律也经常针对可能不构成系统变更的数据操作行为。三十五个州处理未经授权披露、使用、控制或获取数据的行为。通过此类条款，网络犯罪法律有时与数据泄露法律重叠，后者将在后续章节讨论。十六个州明确禁止通过未经授权手段获取涉及个人的信息，十五个州禁止窃取机密信息。十三个州专门针对分发或使用账户访问信息（如密码和账号）的行为。八个州将接收非法获取的数据定为犯罪。\n\
  \n###### 工具与技术：破坏、污染物与间谍软件\n\n一些法律适用于与网络犯罪相关的特定工具。三十个州禁止旨在破坏系统或导致拒绝服务的行为。如上所述，二十八个州禁止未经授权引入计算机污染物，十五个州禁止未经授权引入间谍软件。计算机污染物通常被定义为包括恶意软件。十四个州的网络犯罪法律涉及键盘记录软件。十三个州禁止欺骗他人安装软件的行为。后者通常在禁止间谍软件的背景下。\n\
  \n###### 网络钓鱼与电子邮件相关犯罪\n\n二十个州处理网络钓鱼和/或涉及电子邮件的其他非法行为。其中七个州禁止分发或贩卖伪造电子邮件传输信息的软件，此类工具可能用于网络钓鱼活动或传播垃圾邮件。华盛顿州明确禁止欺骗，该法律将其描述为未经授权且明知地传输他人身份信息，以获取未经授权的访问权限并意图实施犯罪。\n\
  \n###### 网络犯罪法律中的加密\n\n一些涉及网络犯罪工具的州甚至进一步涉及加密的使用，加密是互联网安全通信的基础。五个州禁止在实施犯罪过程中使用加密。明尼苏达州是这五个州之一，其法律包含第\
  \ 609.8912 节，标题为“加密的犯罪使用”。在该节中，明尼苏达州法律还禁止故意使用加密“以阻止、阻碍、延迟或破坏他人的计算机、计算机程序或计算机系统的正常操作或使用”。阿拉斯加州在其网络犯罪法律中或许有最宽泛的加密引用。阿拉斯加州网络犯罪法律第\
  \ 11.46.740(a)(1)(G) 条仅规定，如果某人“无权”这样做，明知“加密\\[ \\]或解密\\[ \\]数据”即构成刑事犯罪。德克萨斯州在其刑法典中包含“非法解密”，第\
  \ 33.024 条规定，如果某人“故意通过欺骗手段且无合法商业目的解密加密的私人信息”，则构成非法解密刑事犯罪。\n\n\n\n\n有些法律显然是针对特定立法会议期间出现的具体问题而制定的权宜补丁。密歇根州和德克萨斯州都有针对\
  \ `Phantom-ware`（幽灵软件）及可用于利用销售终端系统漏洞的类似设备的具体条款。路易斯安那州、密西西比州、德克萨斯州和罗德岛州设有名为 `Online\
  \ Impersonation`（网络冒充）的罪名，我们将在身份盗窃章节中重新探讨该罪名。德克萨斯州于 2017 年修订其刑法典，在 `Section 33.023`（第\
  \ 33.023 节）下明确禁止使用 `ransomware`（勒索软件）。科罗拉多州有法律禁止使用 `ticket line-skipping software`（抢票/跳过排队软件），印第安纳州立法机关通过了一项针对目标相似但范围稍广的法律，法规中将其描述为\
  \ `merchandise-hoarding software`（囤货软件）。在科罗拉多州和印第安纳州，立法目标似乎都是为了解决利用软件进行在线购买、从而对不使用自动化购物工具的客户造成不公平待遇的问题。有九个州在其网络犯罪法规中包含\
  \ `cyber harassment`（网络骚扰）法律。我们未分析网络犯罪章节中那些远超安全与隐私范畴的计算机辅助犯罪条款，例如招揽未成年人和儿童色情犯罪。计算机犯罪章节或分章节中最独特的例子出现在宾夕法尼亚州。根据\
  \ [18 Pa. Cons. Stat. Ann. § 7641](https://www.westlaw.com/Document/N16C320F061E611DAA188ED95E5365C89/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，畜主被禁止从事计算机辅助的动物远程捕猎/收割。\n\
  \n只有五个州似乎在其网络犯罪法规中承认非恶意黑客行为。佛罗里达州关于针对计算机用户犯罪的法律包含一项例外，适用于“执行政府或企业授权安全操作”者。内华达州设有\
  \ `penetration testing`（渗透测试）例外，德克萨斯州则基于以评估安全为目的的行为提供抗辩理由。华盛顿州法律甚至在其定义部分中明确界定了 `white\
  \ hat security research`（白帽安全研究）。犹他州可以说是这五个州中走得最远的，它基于针对先前安全漏洞的响应行为，确立了一项积极抗辩。\n\
  \n某些犯罪可被归类为上游或下游犯罪，因为它们助长了独立的犯罪活动，或由独立的犯罪活动助长。在《CFAA》（计算机欺诈与滥用法案）中，唯一的上游条款涉及贩卖密码及类似访问信息。一些州将贩卖助长电子邮件欺骗的软件等上游犯罪定罪。通过颁布此类法律，各州将监管目标上溯至为他人造成危害提供工具的供应商。其他州的网络犯罪法律也着眼下游，针对非法获取信息的接收方，这类似于联邦《经济间谍法》禁止接收非法获取的商业秘密。通过将接收非法获取信息的行为定罪，立法者将监管目标下溯至数据窃贼之后、可能更容易识别的信息接收者。\n\
  \n##### II. 处罚\n\n各州对各类网络犯罪的量刑等级各不相同。阿拉斯加州是唯一一个网络犯罪法规仅设有一种处罚等级（C 级重罪）的州。所有其他州均根据所违反的具体条款，或将具体条款与其他因素结合，来区分处罚。有八个州仅根据条款区分处罚或等级。其余\
  \ 41 个州则利用其他要素来区分违法行为。\n\n十九个州根据受影响方提供不同处罚——例如，目标是政府机构或专注于公共安全的组织。十五个州根据对关键基础设施的影响加重某些条款的处罚。三十九个州根据金钱损害程度（通常按范围）区分处罚。例如，金钱损害低于\
  \ 500 美元可能属于一种处罚等级，而 500 美元至 1500 美元之间则属于另一种。十二个州在量刑时考虑非金钱影响，如某行为造成人身伤害风险。十六个州对后续违反网络犯罪法的行为加重处罚，二十个州考虑情境或动机因素，如以欺诈为目的实施的行为。\n\
  \n冒着“在无差别处制造差别”的风险，必须指出的是，一些州作为加重处罚要素的因素，在其他州的法律中却作为实体条款的一部分出现。例如，一些州将带有欺诈意图的行为作为禁止行为的一部分加以规定，而其他州仅在处罚小节中涉及欺诈意图。在以欺诈意图加重处罚的州，带有欺诈意图行事可能将一级轻罪升级为三级重罪。当然，当欺诈意图被纳入犯罪的实体定义中时，也可能有效产生相同后果。\n\
  \n除了影响处罚的不同因素外，各州通常还规定其他救济途径。十二个州涉及与违反网络犯罪法相关的没收，更多州可能在其州法典的更一般性条款中涉及没收。二十七个州赋予受害方基于违反网络犯罪法提起民事诉讼的权利。大多数涉及网络钓鱼和间谍软件的法律仅包含民事处罚。\n\
  \n##### III. 近期变化\n\n如上所述，各州网络犯罪法律频繁变更。本简短章节关注单一州——华盛顿州——的努力，其立法机关于 2016 年采用了一种新的网络犯罪立法方法。立法机关的调查结果强调了他们共同的信念：网络犯罪需要一种新方法——而不仅仅是一套关于以新方式实施的旧罪行的法律。华盛顿州立法机关的努力以微软的\
  \ `STRIDE` 网络威胁建模系统为指导。`STRIDE` 代表：\n\n*   **Spoofing**（欺骗/冒充）\n*   **Tampering\
  \ with data**（数据篡改）\n*   **Repudiation**（抵赖/不可否认性缺失）\n*   **Information disclosure**（信息泄露）\n\
  *   **Denial of service**（拒绝服务）\n*   **Elevation of privilege**（权限提升）\n\n这六个类别涵盖了一系列活动。欺骗涉及未经授权使用他人的认证信息。华盛顿州并非唯一承认欺骗威胁的州，尽管大多数涉及该威胁的州都在网络钓鱼法律的背景下处理，这通常涉及除冒充身份以外的其他损害。数据篡改指恶意修改。在计算机安全领域，抵赖指缺乏问责的行为。当入侵者能够“隐藏踪迹”时，就会出现抵赖威胁。此类威胁主要通过行业最佳实践来应对，即强调记录和审计追踪以跟踪系统中的每一个动作。信息泄露威胁类别涵盖因入侵导致的数据泄露和其他隐私威胁，而拒绝服务威胁类别涵盖影响服务可用性的风险。利用系统弱点提升自身系统权限的攻击者，能够强制实施整个系统的根本性变更，而此类变更本应仅受最受信任的管理员控制。\n\
  \n对华盛顿州网络犯罪法的修订还非常新。这些变化主要代表了对网络犯罪法旨在应对的风险进行可视化的目的论转变。`STRIDE` 威胁模型是否为立法的最佳方法仍有待观察。华盛顿州立法机关的方法至少表明了网络危害概念的扩展，而这些正是从业者应准备应对的变化类型。\n\
