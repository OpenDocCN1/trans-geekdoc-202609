  \n29 `AL, CA, GA, IL, MO, NJ, OK, SC, VA`。\n\n\n\n\n\n#### Stuxnet 的发现及由此引发的网络安全政策变革\n\
  \n2010 年 Stuxnet（震网病毒）的发现，为计算机安全行业、关键基础设施提供商、普通公众，以及基本上所有未参与 Stuxnet 蠕虫病毒创建和传播的人敲响了警钟。最终，讨论导致了国家网络安全政策发生了一系列主要为增量式的变化。其中第一项是奥巴马总统的[第\
  \ 13,636 号行政命令](https://www.westlaw.com/Document/IC57D5C407A6C11E2868A865AE0FC4153/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)，标题为“改善关键基础设施网络安全”。该命令对网络安全政策最重要的贡献可以说是其关于开发网络安全框架的指示。自该命令签署以来的几年里，网络安全框架也已成为关键基础设施领域之外的安全专业人员的重要资源。第\
  \ 13,636 号行政命令 (EO 13,636) 由第 21 号总统政策指令 (PPD-21) 予以补充，后者阐述了政府机构在实施[EO 13,636](https://www.westlaw.com/Document/IC57D5C407A6C11E2868A865AE0FC4153/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 中的各自角色。2014 年 12 月通过了多项网络安全相关法案，联邦《网络安全信息共享法案》于 2015 年 12 月作为综合预算法案的一部分颁布实施。我们从对\
  \ [EO 13,636](https://www.westlaw.com/Document/IC57D5C407A6C11E2868A865AE0FC4153/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 的解释入手，因为它为后来在网络安全标准和网络威胁信息共享领域的发展奠定了基础。\n\n#### I. 第 13,636 号行政命令、第 21 号总统政策指令与网络安全框架\n\
  \n##### 第 1 节：目的与政策\nEO 13,636 第 1 节强调，该命令的目的是应对影响关键基础设施系统的网络风险增长，同时平衡安全与隐私这两个偶尔会发生冲突的价值观。该命令第\
  \ 1 节突出了政府的政策：在不牺牲“商业机密、隐私、[或] 公民自由”的前提下，加强关键基础设施系统的安全性和韧性。\n\n##### 第 2 节：关键基础设施的定义\n\
  在第 2 节中，该命令将关键基础设施定义为：“无论是物理还是虚拟的系统和资产，对美国至关重要，以至于此类系统和资产的丧失能力或被破坏将对安全、国家经济安全、国家公共卫生或安全，或上述事项的任何组合产生衰弱性影响。”这也是《国土安全法》采用的关键基础设施定义。\n\
  \n##### 第 3 节：机构间协调\n第 3 节指示各机构利用既定的机构间协调流程——国家安全委员会体系，就与该命令相关的问题进行协调。\n\n#####\
  \ 第 4 节：网络安全信息共享\n第 4 节规定了网络安全信息共享的准则。第 4 节的重点是确保政府能够轻松地与私营部门的关键基础设施提供商共享机密网络威胁信息。\n\
  \n##### 第 5 节：隐私与公民自由保护\n第 5 节涉及所披露信息的隐私和公民自由保护，命令要求此类保护必须基于《网络空间可信身份国家战略》中列出的八项公平信息实践原则\
  \ (FIPPs)。根据 FIPPs：\n1. 组织必须对其如何处理个人可识别信息 (PII) 提供透明度。\n2. 必须有流程让个人参与组织对 PII 的处理。\n\
  3. 组织必须说明其收集 PII 的依据和原因。\n4. 组织必须将 PII 的收集限制在为特定目的所必需的范围内。\n5. 组织必须将 PII 的使用限制在为特定目的所必需的数量和类型上。\n\
  6. 组织必须保护 PII 以维护数据质量和完整性。\n7. 组织必须为 PII 设置适当的安全保障措施，以防止未经授权的访问或使用。\n8. 组织必须建立问责和审计流程，以确保未来遵守\
  \ FIPPs。\n\n用更适合列表呈现的术语表达，八项 FIPPs 为：\n1. 透明度\n2. 个人参与\n3. 目的特定\n4. 数据最小化\n5. 使用限制\n\
  6. 数据质量与完整性\n7. 安全性\n8. 问责与审计[¹]\n\n[¹]: section16.xhtml#ftn.146\n\n联邦贸易委员会 (FTC)\
  \ 也有其自身的公平信息实践理念。FTC 的方法比国土安全部 (DHS) 更以消费者为导向。FTC 认为 FIPs 基于五大核心原则：\n1. 通知与消费者知情权\n\
  2. 消费者选择与同意\n3. 接触与参与流程\n4. 数据完整性与安全性\n5. 执法与救济[²]\n\n[²]: section16.xhtml#ftn.147\n\
  \n##### 第 7 节：网络安全框架开发\n在第 7 节中，[EO 13,636](https://www.westlaw.com/Document/IC57D5C407A6C11E2868A865AE0FC4153/View/FullText.html?transitionType=Default&contextData=(sc.Default)&VR=3.0&RS=da3.0)\
  \ 指示国家标准与技术研究院 (NIST) 开发网络安全框架 (CSF)，作为私营实体可采用的自愿性网络安全标准。NIST 完成了该任务，CSF 可在 NIST\
  \ 网站上获取。\n\n##### 第 10 节：CSF 采纳流程\n第 10 节涉及 CSF 的采纳流程。\n\n##### 网络安全框架结构\nCSF 旨在作为关键基础设施服务提供商使用的自愿性网络安全标准，但\
  \ CSF 的结构也适用于其他行业。CSF 采用基于风险的框架，分为五大核心功能：识别、保护、检测、响应和恢复。每个功能细分为类别和子类别。\n\n######\
  \ 识别\n识别核心功能强调提前识别潜在问题的工作。例如，资产管理和风险评估是识别核心功能中的两个类别。\n\n###### 保护\n保护核心功能关乎预防，类别包括防护技术和维护。\n\
  \n###### 检测\n检测核心功能涉及确保在合理时间内检测到网络安全事件的步骤。检测核心功能中的一个类别是安全持续监控。\n\n###### 响应\n响应核心功能的类别包括分析和缓解。\n\
  \n###### 恢复\n恢复核心功能关乎系统的韧性，恢复规划是其类别之一。\n\n##### 第 8 节：机构支持\n第 8 节概述了机构对关键基础设施网络安全计划的支持。被指定为部门特定机构的机构，是各行业私营企业的重要联络点。\n\
  \n##### 第 9 节：高风险基础设施识别\n最后，EO 13,636 第 9 节要求识别面临网络安全事件导致灾难性后果最大风险的关键基础设施提供商。\n\n\
  ##### PPD-21 战略要务\nPPD-21 侧重于三大战略要务。\n\n###### 第一战略要务：统一联邦行动\n第一战略要务强调统一联邦政府在关键基础设施保护方面的行动。为推进这一目标，PPD-21\
  \ 要求 DHS 运营两个关键基础设施中心：一个专注于物理基础设施，一个专注于网络基础设施。\n\n###### 第二战略要务：基线数据与系统要求\n第二战略要务关注基线数据和系统要求，以确保格式统一、互操作性和冗余性，从而在发生中断时确保持续访问。\n\
  \n###### 第三战略要务：数据分析辅助决策\n第三战略要务是利用数据分析为关键基础设施相关决策提供依据，包括对事件、威胁和新兴风险的持续分析，以提供“近实时态势感知能力”。\n\
  \n\n\n\nSSAs 是 PPD-21 的重点关注对象。根据该指令，SSAs 被定义为被指定与特定关键基础设施部门合作开展其安全和韧性计划的部门或机构。PPD-21\
  \ 确定了十六个关键基础设施部门。在这十六个部门中，DHS 被列为八个部门的唯一 SSA，并担任另外两个部门的联合 SSA。DHS 通常是网络安全政策讨论中的重要参与者。《2014\
  \ 年国家网络安全保护法案》（我们稍后将讨论）引用了 PPD-21 中的态势感知和部门特定机构语言，这表明国会在通过 NCPA 时，意在将 PPD-21 的许多要素正式立法化。\n\
  \n###### a. EO 13,636 和 PPD-21\n\nEO 13,636 和 PPD-21 均要求提交多份年度报告。EO 13,636 第 5(b)\
  \ 节要求每年审查一次关于该计划相关隐私和公民自由风险的报告，3 第 8 节和第 9 节各要求提交一份关于被认定为风险最大的关键基础设施的年度报告。4 根据第\
  \ 8(c) 节，SSAs 需要每年向总统报告风险最大的关键基础设施的所有者和运营商参与该计划的情况；根据第 9(a) 节，风险最大的关键基础设施清单应每年审查和更新一次。PPD-21\
  \ 还保留了国土安全部部长提交“国家关键基础设施状况”年度报告的义务，并要求 SSAs 提供年度报告以支持部长编制其年度报告。\n\n#### II. 立法行动\n\
  \n2014 年 12 月，国会通过了三项网络安全相关法案，奥巴马总统于 2014 年 12 月 18 日全部签署生效：1)《2014 年联邦信息安全现代化法案》（FISMA），5\
  \ 2)《2014 年国家网络安全保护法案》（NCPA），6 3)《2014 年网络安全强化法案》（CEA）。7 FISMA 是对旧版《联邦信息安全管理法案》的更新，侧重于联邦机构的网络安全实践。8\
  \ 本文后面的隐私章节也将简要讨论 FISMA。\n\nNCPA 将国土安全部（DHS）国家网络安全与通信整合中心（NCCIC）的职能成文法化。9 NCPA 从信息共享的角度切入网络安全，尽管\
  \ NCPA 仅允许政府共享信息，并未涉及私营部门持有的网络安全信息。10 NCCIC 获权促成用于网络安全目的的信息共享协议。\n\nCEA 解决了网络安全研究和教育等多个议题，但就目前而言，其最重要的贡献是第一编，该编为美国国家标准与技术研究院（NIST）与网络安全标准相关的活动制定了详细指导。通过这一编，CEA\
  \ 对 CSF 实施了立法监督。\n\n大量正式立法行动都强调了关键基础设施。EO 13,636 使用了《国土安全法》定义的“关键基础设施”一词，但总统政策指令\
  \ 21 (PPD-21) 通过专门列举涵盖的部门，缩小了该术语的范围。CEA 和 NCPA 同样使用“关键基础设施”一词，CEA 还包含了 PPD-21 中限制性的“部门特定机构”语言。\n\
  \n2015 年 12 月，国会将《网络安全信息共享法案》（CISA）作为 2016 年综合预算法案的一部分颁布实施。CISA 的主要重点是建立一个政府与私营部门之间双向网络威胁信息共享的模式。CISA\
  \ 和 CEA 均被编入第 6 编的网络安全章节。\n\nCISA 第一编创建了一个信息共享计划，旨在使政府更容易与私营部门共享网络威胁信息，反之亦然。CISA\
  \ 将“网络安全威胁”定义为一种“行为”，该行为“可能导致未经授权的努力，从而对信息系统或存储在、由其处理或传输中的信息的安全性、可用性、机密性或完整性产生不利影响”。CISA\
  \ 的大部分条款涉及“网络威胁指标”的共享，后者被定义为描述或识别与安全相关的各种事项的信息，包括“导致拥有合法访问权限的用户……不知不觉地使安全控制失效或导致安全漏洞被利用的方法”。另一种网络威胁指标是恶意侦察，其定义为“为辨别信息的安全漏洞而主动探测或被动监控信息系统的方法，前提是该方法与已知或疑似的网络安全威胁相关联”。安全漏洞被广泛定义为“硬件、软件、流程或程序的任何属性，均可能使安全控制的失效成为可能或提供便利”。\n\
  \n##### a. CISA 与第一修正案\n\n仔细阅读 CISA 中“网络威胁指标”的定义，会发现其与第一修正案存在潜在冲突。可共享的此类指标之一是关于导致合法操作员“不知不觉地使安全控制失效”的方法的信息。如果这仅限于技术手段，可能关切较小，因为按其措辞，该定义最明显地指向网络钓鱼攻击。然而，按其撰写内容，CISA\
  \ 可能支持这样一种起诉：调查的触发因素是某人共享了关于社会工程学的信息。将安全漏洞定义为包括流程和程序，支持了这种解释。\n\n社会工程学是黑客攻击的主要组成部分。电影常将黑客攻击描绘为由无尽的技术术语和在屏幕前度过的无数小时组成，但现实中的黑客攻击往往涉及通过冒充有权接收该信息的人员，来收集个人信息甚至密码。通过将关于社会工程学的信息纳入“网络威胁指标”的定义，CISA\
  \ 引发了关于非法煽动和第一修正案的担忧。\n\n非法煽动是第一修正案关于信息性言论司法实践中出现的一个问题。信息性言论案件棘手的部分原因在于，某些类型的信息既可能有益用途，也可能有害用途。在网络安全背景下，关于漏洞的信息\
  \ 153 可以帮助防御者加固系统，也可能使攻击者开发新的攻击方法。此类信息常在信息安全会议上展示。信息安全会议吸引数千名安全专业人员，参加漏洞利用演示的大多数人更可能对了解潜在威胁感兴趣，而非为个人利益实际利用漏洞。无论如何，公开演示仍然带来恶意行为者将利用该信息实施有害行为的危险。\n\
  \n\n\n正如上文所述，CISA 的措辞也可能足够宽泛，以涵盖社会工程学实践。据称，一名青少年通过社会工程学而非复杂工具，黑入了中情局局长约翰·布伦南的个人\
  \ AOL 电子邮件账户。在发现布伦南是 Verizon 客户后，该青少年声称他和一名朋友联系了 Verizon，冒充一名因计算机故障无法获取客户记录的 Verizon\
  \ 技术人员。通过这种方式，黑客获取了关于布伦南的多种个人信息，包括其银行卡后四位数字。随后，他利用这些信息重置了布伦南 AOL 账户的密码，并浏览了布伦南个人邮箱的内容。在三天内，布伦南三次夺回账户控制权，黑客也三次夺回控制权，直到布伦南最终彻底删除其\
  \ AOL 账户。\n\n对黑客社会工程学技术的描述很容易被归类为“关于一种方法的信息”，满足了成为网络威胁指标的门槛之一。Verizon 员工向黑客泄露敏感客户信息，显然“在不知情的情况下使安全控制失效”。通过讲述黑客的攻击过程，我们现在传播的信息已被\
  \ CISA 授权收集和共享。CISA 的这一要素很容易产生寒蝉效应。公开的秘密是，最严重的安全缺陷通常位于键盘和椅子之间（即人为因素），但人为安全缺陷最好通过组织政策来解决。恶意社会工程学已通过禁止欺诈的刑法予以规制，将社会工程学信息视为网络威胁指标的潜在做法是不必要且无益的。\n\
  \n##### b. CISA、恶意侦察与研究\n\nCISA 下的另一种网络威胁指标是关于恶意侦察的信息。恶意侦察不是基于行为定义的，而是基于方法定义的。如果某种方法“与已知或疑似网络安全威胁相关联”，则探测或监控信息系统以发现漏洞即属于恶意侦察。请注意，该措辞指的是该方法与疑似网络安全威胁相关联，并未限定搜索漏洞之人的意图。安全研究人员通常使用与恶意黑客相同的“方法”来发现技术漏洞，尽管他们通常不意图造成“网络威胁”定义中所要求的那种不利影响。将这种行为宣布为“恶意侦察”可能会影响自由职业安全研究人员未来的选择。\n\
  \n黑客通常被分为三类：白帽黑客、灰帽黑客和黑帽黑客。白帽黑客通常是直接为其所测试产品的公司工作的安全研究人员。黑帽黑客处于另一极端，通常意图制造麻烦。介于两者之间的是灰帽黑客，他们可能会发现产品漏洞，然后提出将信息出售给供应商。如果供应商不愿购买该信息，黑客可能会坐拥该信息，或寻找其他买家，例如向政府出售漏洞的漏洞转售商。\n\
  \n尽管“恶意侦察”一词暗示恶意应为必要要素，但其定义本身过于宽泛。通过基于方法而非行为或意图来定义恶意侦察，CISA 可能会使灰帽黑客在向公司披露其有信息出售的那一刻，就面临政府强制力的介入。一家想要信息但不想付费的公司可能会向政府举报该通信。政府调查该黑客，并可能强制黑客免费向供应商提供信息，从而使黑客投入的时间和专业知识变得毫无价值。这种结构可能导致一些灰帽黑客向黑帽黑客靠拢，因为他们向供应商出售信息的激励机制已不复存在。\n\
  \n#### III. 关键基础设施与网络安全\n\n对关键基础设施的担忧在过去几年中推动了联邦网络安全法的发展。关键基础设施系统通常依赖监控与数据采集（`SCADA`）系统。`Stuxnet`（震网病毒）利用了\
  \ `SCADA` 系统。`Stuxnet` 的发现可能促使了更多针对 `SCADA` 漏洞的研究。根据赛门铁克的数据，2010 年有 15 个公开已知的 `SCADA`\
  \ 漏洞，而 2011 年则有 129 个。`Stuxnet` 于 2010 年被发现。\n\n第 13636 号行政命令还要求国土安全部（`DHS`）提出可能的激励措施，以促进关键基础设施提供商参与自愿网络安全计划。然而，该命令指出，可能需要额外的立法来实施某些类型的激励措施。在财政激励方面，当公司被认定充分遵守该计划时给予减税，或就实施建议控制措施的成本给予税收抵免，这两者都可能是可行的选择。另一种选择是，当实体善意努力遵守框架时，网络安全框架豁免私人实体的民事责任（Trope\
  \ 和 Humes 在一篇法律评论文章中概括性地讨论了这一选项）。11\n\n法定责任豁免并不罕见。《存储通信法》中就有一项此类豁免，免除电子通信服务提供商因共享客户信息而承担的责任。12\
  \ 2008 年《外国情报监视法修正案》也为遵守国家情报总监和司法部长发布的指令而提供信息的电子通信服务提供商提供责任豁免。13\n\n#### IV. 行政机关\n\
  \n行政机关也在不同程度上参与了网络安全监管。例如，证券交易委员会（SEC）已发布关于网络安全的指导文件。14 该指导于 2018 年 2 月更新，强调网络安全事件对投资者信心的重大影响，并重申利用网络安全事件的非公开信息进行内幕交易是违法的。2018\
  \ 年 3 月，SEC 指控一名前 Equifax 高管内幕交易，因为该前高管在 Equifax 发现 2017 年数据泄露事件与 Equifax 向公众披露该事件之间的时间窗口内，抛售了大量\
  \ Equifax 股票。15\n\n国土安全部（`DHS`）运营国家网络安全与通信整合中心，协调私营和政府部门的响应。16 `DHS` 还运营网络安全与通信办公室，专注于关键信息基础设施。17\n\
  \n\n\n\n##### 卫生与公众服务部发布 NIST 网络安全框架与 HIPAA 安全规则互操作指南\n\n卫生与公众服务部（DHHS）已发布关于 NIST\
  \ 网络安全框架与 HIPAA 安全规则之间相互关系的指南。18 DHHS 民权办公室承认该映射并不完美，但网络安全框架中的大多数功能子类别在安全规则中都有一项或多项相应条款。例如，网络安全框架的“识别”功能包含“风险评估”类别。该类别中的一项要求是必须识别并记录资产漏洞，这与\
  \ HIPAA 安全规则 `45 C.F.R. §§ .308(a)(1)(ii)(A)`、`164.308(a)(7)(ii)(E)`、`164.308(a)(8)`、`164.310(a)(1)`、`164.312(a)(1)`\
  \ 和 `164.316(b)(2)(iii)` 相对应。\n\n##### 联邦贸易委员会成为网络安全和隐私问题的主要行政机构\n\n联邦贸易委员会（FTC）已成为解决网络安全和隐私问题的主要行政机构。FTC\
  \ 的权力主要源于其谴责私营公司不公平或欺骗性行为或做法的权力。《FTC 法案》第 5 条赋予 FTC 认定商业行为为不公平且因此非法的权力，前提是该行为对消费者造成“实质性损害”。许多\
  \ FTC 行动以和解或同意令告终。2014 年 8 月，FTC 就 Fandango 和 Credit Karma 未能充分保护客户通过其移动应用程序提交的敏感信息的指控达成和解。19\n\
  \n##### 第三巡回法院在 FTC 诉 Wyndham 案中确认 FTC 权威\n\n2015 年，第三巡回法院在 *FTC v. Wyndham* 案中确认了\
  \ FTC 的权力，结论是当网络安全做法导致消费者受到损害时，FTC 有权将其视为不公平做法。20 过往的同意令表明，不公平的网络安全做法包括：不防范“众所周知或合理可预见的第三方攻击”、不加密数据、不使用入侵检测系统、不向员工提供网络安全培训。21\n\
  \n##### FTA 裁决常导致要求持续监控的同意令\n\n通常，FTC 裁决会导致要求持续监控的同意令，但受谴责的组织不会被罚款。2011 年，Facebook\
  \ 与 FTC 签订了一项同意令，禁止 Facebook “就消费者个人信息的隐私或安全作出虚假陈述”。22 违反同意令可处以每项违规 40,000 美元的罚款。截至撰写本文时，FTC\
  \ 仍在评估 Facebook 的案件。\n\n## 参考文献\n\n1 Hugo Teufel III, Chief Privacy Officer, U.S.\
