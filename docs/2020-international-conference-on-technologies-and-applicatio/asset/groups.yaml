    图 1. 用于 DNN 的 CSAE 训练 [18]


    ## III. 框架


    虽然 CSNN 是目前最先进的，但其设计基于带有 sigmoid 激活函数的全连接层，并存在一些问题。我们在第 III-A 节中讨论了促使我们提出更好框架的
    CSNN 问题，并在第 III-B 节中介绍该框架。


    #### A. 动机


    CSNN 中的核心思想可能是 CSAE。这是为了理解深度学习中预训练的必要性。在早期，网络使用 sigmoid 或双曲正激活函数进行层间的非线性变换 [27,
    28, 29]。这两个函数在曲线的部分区域都表现出平坦性，这可能导致梯度变小。随着网络规模扩大，网络后层较小的梯度使得网络前层在反向传播过程中遭受影响，这种现象被称为梯度消失。[29]
    和 [19] 的早期工作通过提出一种贪心逐层策略来解决梯度消失问题。然而，在某种程度上，如果使用相同的激活函数，随着网络加深，问题仍然会存在。


    近年来，解决梯度消失问题的另一种途径是通过使用其他激活函数，例如 ReLU，它不像 sigmoid 或双曲激活函数那样受到梯度消失问题的影响，这并非必须的
    [30]。ReLU 及其许多变体 [31, 32] 仍然是深度学习研究中的主流激活函数 [33, 44]。引入 CSNN 是通过模拟 [19] 对普通深度学习所做的来处理成本敏感深度学习：使用
    sigmoid 激活函数，并采用贪心逐层预训练。正如我们在 IV 节的实验结果所示，CSNN 在网络加深时会带有梯度消失的问题。为了使成本敏感深度学习与现代深度学习接轨，有必要进行成本敏感深度学习


    ![](img/f31ca6d362fad6bbb3ee936a52aee682_2_1.png)


    图 2. 一个使用辅助成本敏感目标（AuxCost）框架设计的带有隐藏层的 DNN。


    尽管如此，直接移除 CSNN 中的预训练阶段将失去 CSAE 在使最新表示具有成本感知能力的一个重要优势。接下来，我们提出了我们的框架来挽救这一优势。


    #### B. 逐层成本估计


    我们的目标是构建一个能够同时从成本感知表示估计（类似于 CSAE 使用的）和任何结构的灵活性中受益的 DNN。CSAE 通过在自动编码器中使用 $K$ 个辅助神经元进行成本估计，实现了成本感知表示。我们的核心思想是在自动编码器中使用与
    DNN 分的 $K$ 个额外神经元，我们建议通过“合并” DNN 的内部神经元与所提神经元来替换 CSAE。所提出的结构如图 2 所示。每一层的原始 DNN
    都有一个辅助隐表示输出以估计成本，从而轻而易举地实现了成本感知估计。


    如图 2 所示，通过向 DNN 的每一层添加 K 个辅助神经元，我们遵循 CSAE 的方法，使 DNN 的输出层具有成本估计。唯一的任务是使用更好的损失函数训练“升级”的
    DNN。我们将 $L_{OSR}^{(i)}$ 定义为第 $i$ 隐藏隐藏层输出的辅助损失函数，并将 $L_{OSR}^{(i)}$ 定义为该层的平均值，我们通过以下公式训练升级的
    DNN：


    $$\sum_{i=1}^{H} a_{i} \cdot (L_{OSR}^{(i)} + L_{OSR}^{(i)})$$


    $H$ 是 DNN 中的隐藏层数，$\alpha_i$ 是 $L_{OSR}^{(i)}$ 的平衡系数。


    凭借所提出的结构改进和损失函数，我们现在准备在算法 1 中给出完整的框架。该框架将命名为成本敏感目标（AusCT）。新框架看起来简单，具有许多优点。通过它，我们现在可以使用
    ReLU 或其他激活函数并避免梯度消失问题。我们还可以构建任意层数的成本敏感 DNN。此外，我们可以直接将此框架应用于 ResNet [4] 等先进的 DNN
    结构。


    尽管如此，直接移除 CSNN 中的预训练阶段将失去 CSAE 在使最新表示具有成本感知能力的一个重要优势。接下来，我们提出了我们的框架来挽救这一优势。


    （注：原文中后续存在大量重复段落，译文已按要求去重，仅保留核心逻辑翻译）

