    ## 基于逐层成本估计的成本敏感深度学习


    Yu-An Chung

    马萨诸塞理工学院

    美国马萨诸塞州剑桥

    andyuan@mit.edu


    Shao-Wen Yang

    亚马逊

    美国华盛顿州西雅图

    swyang@amazon.com


    Hsuan-Tien Lin

    国立台湾大学

    台湾台北市

    hlin@csie.ntu.edu


    **摘要—** 尽管深度网络在图像分类、目标检测和语音识别等多个领域取得了成功，但当应用对不同类型的分类错误和分类误差有成本要求时，要达到极高精度是非常困难的。目前的成本敏感分类深度网络模型受其架构和深度。在本文，我们提出了一种新的框架，该框架可以应用于任何结构的深度网络，以促进其学习成本敏感问题。该框架允许深度网络的端到端训练。在具有两种成本设置的基准数据集上的实验结果表明，我们的框架优于最先进的成本敏感深度学习方法。


    **索引术—** 成本敏感分类，深度学习，成本估计


    ## I. 引言


    深度学习在许多应用中取得了巨大成功，例如图像分类 [1, 2, 3, 4] 和语音识别 [5]。在这些属于每种分类错误受惩罚相同的的大类分类应用中，其性能是有限的。


    然而，使用准确率作为所有情况的指标并不总是能产生最成本敏感的系统。事实上，现实应用如 [6, 7, 8, 9, 10] 对不同类型的分类错误有不同的成本。例如，在构建真实的脸部识别系统
    [9, 11, 12] 中，将政府工作人员误识别为冒充者只会导致轻微的不便；然而，分类错误的人可能会导致严重的损害。


    人们在研究成本敏感分类算法方面已经付出了大量努力。在 [14, 15, 16] 的工作中，研究人员提出更方便地考虑具有需求成本的概率分类器。我们遵循了许多早期的成本敏感工作
    [14, 15, 27, 18]，在进行基准实验时采用了成本敏感设置。


    贝叶斯理论使分类器能够在预测期间考虑成本信息。其他研究将现有的成本敏感分类算法扩展到成本敏感领域，例如支持机 [17]。深度神经网络（DNN）已在广泛的机器学习中成为最先进的
    [5, 3, 4]，研究人员正尝试通过 [18] 中所谓的成本敏感 DNN (CSDN) 使 DNN 具有成本敏感性。第一步是通过成本敏感版本的传统自动编码器
    [19] 逐层初始化 DNN。第二步涉及训练一个成本敏感损失函数，以最小化最终成本。


    CSSDN 的设计基于带有 ReLU 激活函数的全连接 DNN，并面临两个问题。首先，该设计限制了其对如卷积层 [20] 和池化层等更多结构的适用性。其次，sigmoid
    函数来自深度网络中的梯度消失问题，即使在许多个 epoch 之后也是如此。


    在本文中，我们提出构建一个用于成本敏感深度学习的新框架。对于一个 K 类成本敏感分类问题，所提出的框架将逐层成本估计替换为成本估计单元。在每层的输出处增加了
    K 个神经元。K 个神经单元作为辅助，帮助 DNN 学习向单元的有意义的表示。通过求解与这些单元相关的加权损失函数上的联合优化问题来训练 DNN。在具有两种成本设置的基准数据集上进行的实验验证了所提出的框架优于
    DNN。所提出的框架可以轻松且有效地应用于如 ReLU [AlexNet] 这样的深度网络，正如这项工作的完整版本 [22] 所示。性能和通用性使得所提出的框架成为一个可信的选择。


    使用额外神经元作为辅助单元的思想已被几项深度学习工作研究过，例如著名的 GoogleLeNet [3]，它将选定隐藏层中的神经元作为中间分类器作为调节器。深层监督网络
    [23] 为所有层添加了额外的神经元作为中间分类器，并报告这些节点不仅是调节器，还改善了收敛收益。BehaviorNet [24] 考虑了预测的各个点的隐藏层进行测试。然而，所有之前的工作都侧重于使用常规（成本敏感）分类器作为辅助单元。据我们所知，所提出的框架是第一个通过逐层辅助单元解决成本敏感深度学习的框架。


    本文的其余部分组织如下。在 II 节中，我们正式定义了成本敏感分类问题并引入了相关工作。然后，我们在 III 节中提出了我们的框架，并在 IV 节中使用真实数据集验证了性能。最后，我们在
    V 节中得出结论。


    ## II. 准备知识


    ### A. 成本敏感分类


    在 K 类分类问题中，大小为 N 的集合 $S = \{(x_i, y_i)\}_{i=1}^N$，其中每个输入向量 $x_i$ 属于输入空间 $x_i \in
    \mathcal{X}$，每个标签 $y_i$ 属于标签空间 $\mathcal{Y} = \{1, ..., K\}$。常规分类使用 $S$ 来训练分类器
    $g: \mathcal{X} \to \mathcal{Y}$，以使测试样本 $(x, y)$ 上的期望误差 $[y \neq g(x)]$ 最小。也就是说，每种分类错误带有相同的惩罚。


    我们在设计所提出的框架时，考虑了成本向量的成本敏感分类 [14, 17]。成本向量设置通过为每个样本 $(x, y)$ 添加一个额外的成本向量 $c \in
    \{0, ..., \infty\}^K$ 来表示信息，其中 $c$ 的第 $j$ 分量 $c_j$ 表示将类 $j$ 预测为类 $k$ 的成本。


    成本敏感设置的一个特殊情况是使用 $K \times K$ 成本矩阵。每个元素 $C_{ij}$ 表示将类 $j$ 预测为类 $i$ 的成本。通过将 $(x,
    y)$ 中的成本向量定义为成本矩阵 $C$ 的第 $y$ 行，可以将成本矩阵中的信息简单地转换为成本向量。考虑 $S = \{(x_i, y_i, c_i)\}_{i=1}^N$，使用
    $S_i$ 训练分类器 $g: \mathcal{X} \to \mathcal{Y}$ 以使测试样本 $(x, y)$ 上的期望成本 $[c_{y_i,
    g(x_i)}]$ 最小。


    ### B. 成本敏感分类的学习


    如今的 DNN 设计用于解决常规分类问题 [3, 4]。这些 DNN 通常在末尾使用带有 $K$ 个神经元的 softmax 层。每个输入 $x$ 经过不同的隐藏层并转换为不同的潜在表示。softmax
    层将最后的表示转换为每类的概率，概率最高的类别即为网络的预测类别。


    另一方面，很少有工作使用深度网络或神经网络探索成本敏感分类。在通过采样和重阈值处理使神经网络具有成本敏感性之前；[26] 这些每项都探索了用于成本敏感性的神经网络。[18]
    尝试通过产生成本敏感深度学习算法 CDNN 来使神经网络具有成本敏感性。


    在这些结构中，我们在成本估计层上使用成本敏感损失函数 $L_{cost}$。[18] 发现通过仔细训练可以提高网络性能，并提出了成本敏感自动编码器 (CAE)。CAE
    的运行类似于传统的自动编码器 [19]，后者是一种将任何输入 $x$ 映射到输出 $x$ 为输入图像重构的网络。


    重构误差通过交叉熵损失衡量，但这并不意味着网络是成本敏感的。我们证明了具有用于成本估计的额外神经元的网络是成本敏感的。也就是说，CAE 尝试尝试估计成本 $c$。该尝试通过混合层
    $L = \alpha L_{rec} + (1-\alpha) L_{cost}$ 来实现，其中 $L$ 是 CAE 的损失层。当 $\alpha = 0$
    时，CAE 转换为通用自动编码器。


    图 1 显示了如何使用 CAE 展示 CDNN。通过初始化，CDNN 的每一层都承担估计成本的任务。也就是说，它练习了潜在表示。报告称这种初始化允许 CDNN
    收敛到比最先进方法更好的选择。


    > ¹ 术语 $L_{cost}$ 代表单敏感回归，源于一项敏感 SVM 工作 [17]。由于空间限制，此处省略了细节。


