    ## V. 结论与展望


    我们提出了一种新颖的辅助敏感目标 (AuCST) 框架，用于端到端的成本敏感 DNN 学习。与以往的方法相比，该框架可以应用于任何结构的 DNN，以解决挑战性的成本敏感分类问题。实验结果证明了所提框架在使任何
    DNN 模型具有成本敏感性方面的有效性。未来，我们将使用 AuCost 框架构建更深的网络，以应对 ImageNet 敏感的分类问题。


