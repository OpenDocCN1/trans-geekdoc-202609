    **Abstract—** While deep networks have succeeded in several applications, such
    as image classification, object detection, and speech recognition, reaching very
    high accuracy is difficult when application demands costs for different types
    of misclassification and classification errors. Current models of deep networks
    for cost-sensitive classification are limited by their architecture and depth.
    In this paper, we propose a new framework that can be applied to deep networks
    with any structure to facilitate their learning of cost-sensitive problems. The
    framework allows end-to-end training of deep networks. The framework is designed
    by augmenting neural networks with cost estimation within the optimization objective.
    Experimental results on benchmark datasets with two cost settings show that our
    framework outperforms state-of-the-art cost-sensitive deep learning methods.


    **Index Terms—** Cost-sensitive classification, deep learning, cost-estimation


    # I. INTRODUCTION


    Deep learning has shown great success in many of applications such as image classification
    [1, 2, 3, 4], and speech recognition [5]. In such applications belonging to a
    large class of classification in which each of misclassification error is penalized
    equally, the performance is limited.


    Nevertheless, using accuracy as the metric for all cases does not always produce
    the most cost-sensitive system in the world. In fact, real-world applications
    like [6, 7, 8, 9, 10] demand varying costs for different types of misclassification.
    For example, in building a realistic face recognition system [9, 11, 12], in which
    a government staff is misidentified as an impostor can only cause a slight inconvenience;
    however, a misclassified person can result in severe damage.


    Much effort has been made to study cost-sensitive classification algorithms. In
    the works of [14, 15, 16], the researchers proposed to consider probabilistic
    classifiers with


    Bayes theory enables the classifiers to consider the cost information during prediction.
    Other studies have extended existing cost-sensitive classification algorithms
    to cost-sensitive, such as support machine [17]. Deep neural (DNN) have become
    state-of-the-art on a broad range of machine learning [5, 3, 4], researchers are
    attempting to make DNN cost-sensitive through the called Cost-Sensitive DNN (CSDN)
    in [18]. The first step is to initialize the DNN in the layer-wise by a cost-sensitive
    version of the conventional auto-encoder [19]. The second step involves the training
    of a cost-sensitive loss function to minimize the final cost.


    CSSDN, whose design is based on the fully-connected DNN with ReLU activation functions
    and experiences two issues. First, the design restricts the applicability to more
    structures such as convolutional [20] and pooling layers. Second, the sigmoid
    functions from the problem of vanishing gradients in deep networks, even after
    many epochs,


    In this paper, we propose to build a new framework for cost-sensitive deep learning.
    For a K-class cost-sensitive classification problem, the proposed framework replaces
    the layer-wise cost estimation with cost estimation units. K additional neurons
    are added to the output of each layer. K neural units serve as auxiliary to help
    that the DNN learn meaningful representations towards units. The DNN is trained
    by solving a joint optimization problem on the weighted loss function associated
    with these units. Experiments conducted on benchmark datasets with two cost settings
    validate that the proposed framework outperforms DNN. The proposed framework can
    be easily and effectively applied to deep networks like ReLU [AlexNet], as shown
    in the longer version of this work [22]. The performance of benefits and generality'
