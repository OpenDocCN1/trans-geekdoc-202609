    # B. Compare with state-of-the-art


    In this experiment, we used two DNNs with without AuCST framework and compare
    them to state-of-the-art Cost-sensitive Deep Neural Network (DNN) [18]. We emphasize
    the two major drawbacks of CDNN such:


    +   1) CDNN uses sigmoid functions for non-transformation which results in diminishing
    gradients when the network grows.

    2) CDNN can be applied to DNN that consists of fully-connected layers, which limits
    its potential to be extended by adding more layers that require modern functions
    such as convolution and attention layers.


    To give CDNN fair comparison, the two DNNs used also consist of fully-connected
    layers, and ReLU is used as activation function. The first DNN is equipped with
    AuCST by setting α = 0.2, as 0.2 was found to be of the best value for comparison
    in IV, whereas the second DNN, referred to as NaiveDNN, did not use any AuCST
    and was directly optimized by L_out, it is equivalent to setting α = 0 in (2).


