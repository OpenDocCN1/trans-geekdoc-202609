    ## B. 与先进技术的对比


    在本次实验中，我们使用了两个不带 AuCST 框架的 DNN，并将它们与最先进的成本敏感深度神经网络 (DNN) [18] 进行了比较。我们强调了 CDNN
    的两个主要缺点：


    - 1) CDNN 使用 sigmoid 函数进行非变换，导致网络在增长时出现梯度消失。

    - 2) CDNN 仅适用于由全连接层组成的 DNN，这限制了它通过添加更多需要卷积和注意力层等现代函数的层来扩展的潜力。


    为了给 CDNN 提供公平的比较，所使用的两个 DNN 也包含全连接层，并使用 ReLU 作为激活函数。第一个 DNN 通过设置 $\alpha = 0.2$
