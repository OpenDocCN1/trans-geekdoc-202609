    # V. CONCLUSION AND FUTURE


    We propose a novel framework Auxiliary-Sensitive Targets (AuCST) for end-to-end
    cost-sensitive DNN learning. From the previous approaches, the framework can be
    applied to DNN that consists of any structures to challenging cost-sensitive classification
    problems. Experimental results demonstrate the uselessness of the proposed framework
    for making any DNN models'
