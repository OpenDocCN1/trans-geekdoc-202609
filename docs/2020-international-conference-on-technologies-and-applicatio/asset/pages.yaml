    The idea of using additional neurons as auxiliary units has been studied by several
    deep learning works, as the well-known GoogleLeNet [3], which takes the neurons
    as intermediate classifiers in selected hidden layers as regulators. Deeply-Supervised
    Nets [23] add additional neurons as intermediate classifiers to all layers and
    reported that the nodes are not only as regulators but also improve convergence
    benefit. BehaviorNet [24] considers each hidden layer at various points of prediction
    to test. Nevertheless, all previous works focus on using regular (cost-sensitive)
    classifiers as auxiliary units. To the best of our knowledge, proposed framework
    is the first that tackles cost-sensitive deep learning with layer-wise auxiliary
    units.


    The rest of this paper is organized as follows. In Section II, we formally define
    the cost-sensitive classification problem and introduce related works. Then, we
    propose our framework in Section III, and validate the performance with real-world
    data sets in Section IV. Finally, we conclude in Section V.


    # II. PRELIMINARY


    # A. Cost-Sensitive Classification


    In a K-class classification problem, a size-N set $S = \{(x_i, y_i)\}_{i=1}^N$,
    where each input vector $x_i$ is within input space $x_i \in \mathcal{X}$, and
    each label $y_i$ is within a label space $\mathcal{Y} = \{1, ..., K\}$. Regular
    classification uses $S$ to train a classifier $g: \mathcal{X} \to \mathcal{Y}$
    to minimize the expected error $[\[y \neq g(x)\]$ on the test examples $(x, y)$
    which is small. That is, each type of misclassification is carried with the same
    penalty.


    We consider cost-sensitive classification [14, 17] of cost-vector when designing
    the proposed framework. The cost-vector setting represents the information by
    adding an additional cost vector $c \in \{0, ..., \infty\}^K$ for each example
    $(x, y)$, where the $j$-th component $c_j$ of $c$ denotes the cost of predicting
    class $j$ as class $k$.


    A special case of the cost-sensitive setting is using a $K \times K$ cost matrix.
    Each entry $C_{ij}$ denotes the cost of predicting class $j$ as class $i$. The
    information in cost matrix can be simply cast as the cost vectors by defining
    the cost vector in $(x, y)$ as the $y$-th row of the cost matrix $C$. Consider
    $S = \{(x_i, y_i, c_i)\}_{i=1}^N$, cost-sensitive classification at using $S_i$
    to train a classifier $g: \mathcal{X} \to \mathcal{Y}$ to minimize the expected
    cost $[\[c_{y_i, g(x_i)}\]]$ on the test examples $(x, y)$.


    demanded costs more easily. We follow many earlier cost-sensitive works [14, 15,
    27, 18] to take the cost-sensitive setting when conducting benchmark experiments.


    # B. Learning for Cost-Sensitive Classification


    Nowadays DNNs are designed to solve regular classification problems [3, 4]. Those
    DNNs usually use a softmax layer with $K$ neurons at the end. Each input $x$ passes
    through different hidden layers and is transformed into different levels of latent
    representations. The softmax layer converts the last representation into per-class
    probability, and the class with the highest estimated probability is the predicted
    class of the network.


    On the other hand, few works have explored cost-sensitive classification using
    deep or neural networks. Prior to the developing of making neural networks cost-sensitive
    by sampling and re-thresholding to take the class imbalance problem; [26] Each
    of these explores methods of neural networks for cost-sensitivity. [18] attempted
    to make cost-sensitive neural networks by producing a cost-sensitive deep learning
    algorithm Cost-DNN (CDNN).


    In the structure, we use a cost-sensitive loss function $L_{cost}$ on the cost-estimation
    layer. [18] found that the performance of the network can be improved by careful
    training, and proposed a Cost-Sensitive Auto-Encoder (CAE). CAE operates similar
    to a conventional auto-encoder [19], which is a neural network that maps any input
    $x$ to a space where the output $x$ is the reconstruction of the input image.


    The reconstruction error is measured by cross-entropy loss, but that does not
    make that the network is cost-sensitive. We show that the network is cost-sensitive
    with $K$ additional neurons for cost estimation. That is, CAE attempts not only
    to reconstruct x but also estimating the cost $c$. The attempt is attempted with
    a mixture layer $L = \alpha L_{rec} + (1-\\alpha) L_{cost}$, where $L$ is the
    loss layer of CAE. When $\alpha = 0$, CAE converts to a generic auto-encoder.


    Figure 1 shows how CAE is used to present CDNN. With theing, each layer in CDDNN
    carries to estimate the cost. That is, the practices the latent representations.
    reported that such initialization allows CDNN to converge to a better option than
    state-of-the-art methods.


