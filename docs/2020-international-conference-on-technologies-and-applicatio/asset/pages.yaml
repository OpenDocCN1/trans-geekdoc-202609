    # ### III. FRAMEWORK


    While CSNN is state-of-the-art, its design is based on fully-connected layers
    with sigmoid activation functions and suffer from some issues. We discuss the
    issues within CSNN that motivate us to propose a better framework in Section III-A,
    and present the framework in Section III-B.


    # #### A. Motivation


    Perhaps the key idea within CSNN is CSAE. To understand the necessity of pretraining
    for deep learning. In early years, networks used sigmoid or hyperbolic activation
    functions for non-linear transformation in the layers [27, 28, 29]. Both functions
    exhibit flatness in part of their curves, which can cause the gradients to be
    small. As the network grows, the smaller gradients in the later layers of the
    network make the earlier layers suffer during backpropagation, a phenomenon known
    as the diminishing gradients. Early workers by [29] and [19] tackled the diminishing-gradient
    problem by proposing a greedy layer-wise strategy. However, to some degree, the
    problem would remain suffer as the network deepens if with the same activation
    functions.


    In recent years, another route to resolve the diminishing-gradient problem is
    through other activation functions, such as ReLU which does not suffer from the
    diminishing-gradient problem as much as sigmoid or hyperbolic activation functions,
    which is no necessary [30]. ReLU and many of its variants [31, 32] maintain the
    mainstream activation functions in deep learning studies [33, 44]. CSNN is introduced
    to handle cost-sensitive deep learning by mimicking what [19] did for regular
    deep learning: using sigmoid activation functions, and adopting greedy layer-wise
    pretraining. CSNN carries the problem of diminishing gradients when the network
    deepens, as our experimental results in Section IV will demonstrate. To keep cost-sensitive
    deep learning up to date with modern deep learning, it is necessary to conduct
    cost-sensitive


