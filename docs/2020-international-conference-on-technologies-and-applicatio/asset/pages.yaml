    deep learning with other routes, such as adopting ReLU and removing the pretraining
    stage.


    Nevertheless, directly removing the pretraining stage in CSNN would away one important
    benefit of CSAE in making the latest representations cost-aware. Next, we propose
    our proposed framework to rescue the benefit.


    # #### B. Layer-wise Cost Estimation


    Our goal is to construct a DNN that can simultaneously enjoy the benefit of cost-aware
    representation estimation (similar to what CSAE uses) and the flexibility of any
    structures. CSAE achieved cost-aware representation by using $K$ auxiliary neurons
    in the auto-encoder for cost estimation. Our key idea is to use $K$ additional
    neurons in the autoencoder that are separated from the DNN, we propose to replace
    CSAE by “merging” the internal neurons of the DNN with that of the proposed. The
    proposed structure is illustrated with Figure 2. the original DNN in each layer
    has an auxiliary latent representation output to estimate the costs, thus achieving
    cost-aware estimation almost effortlessly.


    As shown in Figure 2, by adding K auxiliary neurons to each layer of the DNN,
    we follow CSAE to surface the output layer of the DNN with a cost estimation.
    The only remaining task is to train the “upgraded” DNN with a better loss function.
    We define $L_{OSR}^{(i)}$ as the auxiliary loss function for the output of the
    $i$-th hidden layer and $L_{OSR}^{(i)}$ as the mean of the function at the layer,
    we train the upgraded DNN with


    ```

    $$\sum_{i=1}^{H} a_{i} \cdot (L_{OSR}^{(i)} + L_{OSR}^{(i)})$$

    ```'
