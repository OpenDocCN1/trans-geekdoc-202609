    **对抗平均置信度 (MeanConf):**

    MeanConf 是成功对抗样本中对抗类别的平均置信度：$MeanConf = \frac{1}{n} \sum_{i=1}^{n} d(y, y_{\delta,i})$，其中
    $n$ 是无目标攻击和目标攻击中成功对抗样本的数量。


    对于目标攻击，目标标签 $y^{t}$ 是某个目标函数，用于衡量对抗输入 $x_{\delta}$ 的预测向量与目标标签 $y^{t}$ 之间的距离。目标是最小化该距离，使得通过向
    $x$ 注入扰动生成的对抗输入 $x_{\delta}$ 能以高置信度匹配目标标签。在无目标攻击中，我们需要最大化原始标签 $y$ 的概率置信度。因此，攻击需要在增强目标标签概率置信度的同时，最小化所有其他标签的概率置信度，使目标标签脱而出。这可以通过由扰动函数
