    $f_i(i=1, \dots, n)$, which operates on an activation function, e.g., $ReLU$;
    the output of each layer is the input to the next layer to generate a new representation.
    The weight vectors $\mathbf{W}_i=\{w_{ij}\}_{j=1}^{K_i}$ and bias vectors $\mathbf{B}_i=\{b_{ij}\}_{j=1}^{K_i}$,
    where $K_i$ denotes the number of neurons in layer $i$. Let $y$ be the class label
    of $x$, and $\hat{y} = f(x)$ is the classification result for input $x$ in an
    $m$-dimensional vector space $\mathcal{Y}$, such that $p_i$ indicates the probability
    of predicted class $y_i$ where $0 \leq p_i \leq 1$ and $\sum_{i=1}^m p_i = 1$.
    $\hat{y}$ is the class with the largest probability in the prediction.


    The deployment of a DNN model consists of two phases: training phase and test
    phase. In the training phase, a set of input-label pairs $(x, y)$ is used to train
    a DNN model $f$, where $y$ is the ground truth label of the input $x$. The model
    learns classification from data using a loss function $J(\hat{y}, y)$, which measures
    the distance between the prediction and the ground truth. The DNN training algorithm
    updates the parameters $\theta$ at each layer with an optimizer, e.g., stochastic
    gradient descent (SGD). In an iterative process, the DNN will be trained until
    convergence. Metrics are used to measure the difference between the predicted
    and the ground truth label of test input: whether the predicted class $\hat{y}$
    is identical to its ground-truth label $y$. The other is the loss function computes
    the distance of the predicted class $\hat{y}$ to the target label $y^*$. The DNN
    model produced at the end of the training phase is used for classification prediction.
    In the test phase, the DNN model is expected to receive an input $x$ and return
    the corresponding label $y_*$ via the fixed set of parameters learned in the training
    phase.


