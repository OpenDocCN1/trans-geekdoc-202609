    **B. Attack Evaluation**

    We evaluate several attacks on datasets: MNIST and CIFAR-10. MNIST consists of
    70000 grayscale-images of digits from 0 to 9 at size of $28\times28$. CIFAR-10
    dataset consists of 60000 images of objects from 0 to 9 at size of $32\times32$.
    The experiment is conducted on a machine with an Intel Core i7 CPU @ 2.50GHz $\times$
    4 and NVIDIA RTX 1080 GPU. Our experiment is built on top of DeepEvolution-Z [33].
    The method produces high-quality results. The seven-layer CNNs have an accuracy
    of 0.9949 on the MNIST and the DenseNet [34] has an accuracy of 0.9844 on the
    CIFAR-10. Some attacks are expensive to re-evaluate, so we select the first 100
    predicted examples to be the test set for each dataset for TFSM, CW and TBIM attacks.
    Due to their low success rate, the first 2000 predicted examples are selected
    for attack. We choose DeepFlow in MNIST generated to recognize the unacceptable
    attacks. The results are presented in Table 2. We have made some observations:


