    # 深度学习中的对抗性欺骗：分析与缓解


    Wenqi Wei*, Ling Liu*, Margaret Lopez*, Ka-Ho Chow*, Emnet Emre*, Stacey Troy*,
    and Yanzhao Wu*

    * 美国佐治亚大学，佐治亚州亚特兰大

    * 佐治理工学院研究院，佐治亚州亚特兰大


    摘要— 深度学习的巨大成功由于更多任务伴随着敏感数据，引发了安全和隐私方面的关注。深度学习中的对抗性攻击已成为一系列关键任务深度学习系统和应用的主要威胁之一。本文通过研究对抗样本的散度效应，提出了一种针对深度学习对抗样本的全方位防御方法，并提出了三个原创贡献的攻击无关防御措施。首先，我们提供了对抗样本的实例级散度的通用公式。然后，我们通过多种评估指标对对抗攻击进行评估，以研究其优势和成本。最后，我们通过使用对抗样本和目标攻击的测试用例研究了对抗样本的有效性，并证明了它们跨对抗攻击的散度。我们利用散度提出了策略性输入变换防御。所提出的防御方法与攻击无关，并且能够在对抗输入上进行自动重构和自动验证。我们证明，与代表性的防御方法相比，该防御可以实现高成功率和低误报率。


    **关键词—** 深度学习中的信任与可靠性，对抗攻击，缓解策略


    接收者将一个受损的停止指令误解为通过性指令 [121]。


    对抗样本的数量与神经网络攻击算法的资源增长趋势相似 [10]–[25]。即使仅对学习即服务（LaaS，如 Amazon、Google 或 IBM 提供的服务）的预测
    API 进行黑盒访问，也可能对已训练的深层神经网络（DNN）模型发动攻击。对于可迁移性 [26–29]，来自深度学习模型的对抗样本可以转移到其他深度学习模型中。尽管许多热点尚未被理解，但盲点可以被用来生成对抗样本的伪影。此外，对抗攻击可以发生在训练阶段和推理阶段。训练阶段攻击将对抗样本注入到网络模型的原始训练集中
    [30]。本文关注在预测阶段匹配的对抗攻击。


    为了开发针对对抗攻击的有效策略，深入理解对抗样本的本质和散度至关重要。在本文中，我们采用全方位的方法来表征深度学习中的对抗样本，并基于该表征提出了输入变换防御。首先，我们提供了对抗样本的通用公式、对抗防御原则，并用多种负面影响和成本对其评估。我们通过使用对抗样本和目标攻击的测试用例，对对抗行为的实例级散度进行了实证评估。根据观察，我们表明防御策略可以创建与攻击无关且能够对对抗输入上的决策进行自动重构和自动验证的防御。我们在
    15 种攻击上测试了所提出的防御，并证明与代表对抗噪声散度表征现有防御方法相比，我们的防御可以实现高成功率和低误报率。该研究为针对现在和未来的对抗攻击设计缓解策略和防御机制。


    ## I. 引言


    深度学习在计算机视觉 [1] 和自然语言处理 [2] 以及其他架构映射等领域取得了巨大成功。许多深度学习应用，如人脸识别 [3]–[4]、语音识别 [5]
    和恶意软件检测 [6]，都是安全关键的对抗攻击 [7–9]。我们已经证明深度学习模型在预测阶段容易受到对抗输入的影响 [10]。对抗是在是在样本的基础上添加对抗样本创建的输入。添加对抗噪声的存在会导致学习模型对输入进行错误分类。例如，攻击者可以使用对抗样本导致监控摄像头或政府实体的授权被错误分类
    [11]。早期，如果视觉摄像头由于对抗扰动识别出停止标志，或者如果指令，自动驾驶汽车可能会采取意料之外的行动。


    ## II. 对抗攻击的公式化


    ### A. DNN 模型


    令 $x \in X$ 为训练数据集 $X$ 中的输入样本。一个 DNN 模型 $f(x) = f_n(f_{n-1}(\dots f_1(x)))$ 由从输入到输出层的
    $n$ 层连续神经元组成。每一层表示一个参数函数 $f_i(i=1, \dots, n)$，作用于激活函数，例如 $ReLU$；每一层的输出是下一层的输入，生成一个新的表示。权重向量
    $\mathbf{W}_i=\{w_{ij}\}_{j=1}^{K_i}$ 和偏置向量 $\mathbf{B}_i=\{b_{ij}\}_{j=1}^{K_i}$，其中
    $K_i$ 表示第 $i$ 层神经元的数量。令 $y$ 为 $x$ 的类别标签，$\hat{y} = f(x)$ 是 $m$ 维向量空间 $\mathcal{Y}$
    中输入 $x$ 的分类结果，使得 $p_i$ 表示预测类别 $y_i$ 的概率，$0 \leq p_i \leq 1$ 且 $\sum_{i=1}^m p_i
    = 1$。$\hat{y}$ 是概率最大的类别。


    DNN 的部署包含两个阶段：训练阶段和测试阶段。在训练阶段，一组输入-标签对 $(x, y)$ 用于训练模型。在测试阶段，对未见数据进行评估。目标是最小化损失函数。然而，对抗攻击旨在引入不可察的扰动来破坏这一过程。


