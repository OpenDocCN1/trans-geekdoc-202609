    # V. 策略性输入组合防御


    ## A. 输入变换技术


    对抗攻击在像素级上对图像进行攻击；它们很容易在计算出的位置引入噪声，使得扰动后的输入在不被人类察觉的情况下欺骗分类器。我们引入了输入变换技术来清除噪声或减轻噪声的影响。前者表示为移除扰动，后者则通过映射函数增强数据。尽管这些技术没有移除注入的噪声，但它们利用了实例的不准确性并延长了惩罚时间。对处理量和计算机计算能力没有限制，我们只研究一类对防御可能所有用的技术：颜色红色检测、图像平滑（中值滤波和非局部均值），


    有两种输入变换策略：仅检测和带检测。我们将模糊（fuzzing）[13] 作为前者，并认为合法示例及其测量的版本应该是相似的；而对抗示例及其引起的实例的预测结果则明显不同。输入与其变换后的版本之间预测向量的差异足以建立并区分对抗样本和良性输入。当存在多种输入变换技术时，图
    7 提供了输入变换防御的说明。不同的输入变换技术可以将对抗样本推向决策空间中不同的次优解以实现正确预测。我们在表 V 中评估了对抗样本的防御成功率，并证明了简单的输入变换可以通过预测这些示例的正确标签来显著增强模型的鲁棒性


    ![](img/c405e4fc84edc19e79233606c35adda7_6_0.png)


    | | bit | medfilter | rotation |

    |---|---|---|---|---|

    | Input image | CW, most | depth 1 | 3*3 | -12 |

    | TM | 5 (1) | 3 (1) | 5 (0.994) | 3 (0.991) | 3 (1) |

    | Input image | TM (0.959) | bird (0.985) | dog (0.996) | example (0.921) |


    图. 8：策略性输入变换组合的说明。MNIST 示例无法通过 CIFAR-10 示例提供正确预测。


    对抗示例。同时，输入变换对分类器在合法示例上的性能没有显著影响。在表中，bit 表示原始编码从 8-bit 到 1-bit（1 ≤ k ≤ 8）；k 表示内核为
    k 的中值滤波器，a-b-c 表示滑动窗口大小为 a、块大小为 b、高斯滤波器宽度为 c 的非局部平滑。


    有多种方法组合不同的输入变换技术。目标是排除传入噪声或增强防御精度。通过高级组合，我们可以确保防御不依赖于任何数据集或攻击算法。我们可以选择不同的技术来处理每种噪声并将它们组合起来。局部滤波器擅长移除
    L2 噪声，我们可以将其与非局部滤波器组合进行过滤。我们还依靠多样性能力来增强防御。具体来说，我们将处理不同类型噪声的技术进行分组。在每个组内，我们选择一种技术，并通过在测试集上准确率较低的方法进行过滤来选择参数。我们还为策略性防御建立了一个排名系统，通过聚合每个单一变换方法的投票来确定最佳组合。我们证明了三种不同的技术就足以有效防御对抗示例。虽然本文中仅探索了一种单一策略，但我们认为还有其他类型的变换也是有效的。输入变换方法的未来是开放的。我们可以结合任何输入变换技术来实现动态化。图
    8 提供了策略性输入变换组合的说明。


    ## B. 防御指标与评估


    防御成功率 (PSR)：被目标模型修正并分类的对抗样本百分比。对于防御测试集，PSR 表示测试准确率。


    表 V：针对 MNIST 和 CIFAR-10 的输入变换技术平均防御


    检测成功率 (RSR)：可以被防御机制拒绝但被正确分类为攻击的对抗示例百分比。

    **防御成功率 (DSR)：** DSR = PSR + RSR。

    **误报率 (FPR)：** 被拒绝或（修复）但标记为对抗的对抗示例百分比。对于良性集，FPR 代表正确分类的示例被标记为对抗的百分比。


    策略性防御不依赖于任何特定攻击。相反，我们使用输入变换技术的多个独立决策，并结合基于置信度和 $L_1$ 距离的排名。对于大多数输入变换方法一致的决策，我们将每个技术的预测向量平均作为输出。对于
    $L_1$ 距离内变换产生的（近）完全决策集，不使用加权一致得分。


    对于少数情况（变换数量 ≤ 2，或 > 1/3），我们进行置信度和 $L_1$ 距离排名。例如，如果我们考虑此实验中三个决策中的两个，当两个决策认为相同标签时，我们认为该标签处于
    $L_1$ 距离内。在任何位置，两个一致示例的 $L_1$ 距离可以接近 0。如果输入是对抗的，且一致变换的 $L_1$ 距离接近 2，意味着大多数转换的使得产生了正确的预测。当这些一致决策的
    $L_1$ 距离接近 0 时，其中一个变换犯了错误。在这种情况下，我们输出在所有标签上具有更高置信度的预测向量。基于置信度的策略基于以下假设：对输入进行均匀变换会导致对抗示例被正确分类为攻击，或者攻击必须被检测到。


    ## C. 对比研究


