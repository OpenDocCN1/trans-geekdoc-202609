    a confidence and $L_1$-distance-ranking. For example, if we consider two of three
    decisions in this experiment, when two agree on the same label, we consider that
    label to be in $L_1$ distance. Since any location, the $L_1$ distance of the two
    agreed examples can be close to 0 or not. If the input is an adversarial and the
    $L_1$ distance of the agreed transformations is close to 2, it means the majority
    of the transformed inputs by the carefully selected transformation method makes
    it highly likely that the correct predictions are the agreed decisions. When $L_1$
    distance of those agreed decisions is close to 0, the situation is either one
    of the transformations makes a mistake or the adversarial sample undergoes multiple
    diverse transformations. In this case, we output the prediction vector which has
    the higher confidence on all labels. Since confidence-driven strategy is based
    on the following assumptions: Input transformation on an adversarial example can
    lead to three cases: an adversarial example being correctly classified as an attack,
    a misclassification, or the attack must still be detected. The transformation
    is performed uniformly on the input image without losing the radiance.


    ## C. Comparison Study


    We provide a comparison in Table VI: Adversarial Training (AdvTrain), Defensive
    Distillation (DefDist), and Input Transformation (EnTrans). For adversarial training,
    we use adversarial examples generated by random noise $[0, 0.016]$ for CIFAR-10.
    For distillation, the temperature is set to 5 for MNIST and CIFAR-10. The input
    transformation ensemble for both datasets is presented in Table VI.


