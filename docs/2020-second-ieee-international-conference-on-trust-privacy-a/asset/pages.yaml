    Detection Success Rate (RSR): percentage of adversarial examples that could be
    rejected but are correctly classified as an attack by the defense mechanism.

    **Defense Success Rate (DSR):** DSR = PSR + true.

    **False Positive Rate (FPR):** percentage of adversarial examples that are either
    rejected or (repaired) but flagged as adversarial. For the benign set, FPR represents
    the percentage of the correctly classified examples being flagged as adversarial.


    Strategic defense does not rely on any specific attacks. Instead, we use multiple
    independent decisions from input transformation techniques and combine a confidence
    and $L_1$ distance-based ranking. For decisions agreed by a majority of input
    transformation methods, we average the prediction vector of each technique as
    the output. For (near) complete sets of decisions made by transformations within
    an $L_1$ distance, a weighted agreement score is not used.


    For minority cases (where $\le 2$, or $> 1/3$ of-transformations), we conduct
    a confidence and $L_1$-distance-ranking. For example, if we consider two of three
    decisions in this experiment, when two agree on the same label, we consider that
    label to be in $L_1$ distance. Since any location, the $L_1$ distance of the two
    agreed examples can be close to 0 or not. If the input is an adversarial and the
    $L_1$ distance of the agreed transformations is close to 2, it means the majority
    of the transformed inputs by the carefully selected transformation method makes
    it highly likely that the correct predictions are the agreed decisions. When $L_1$
    distance of those agreed decisions is close to 0, the situation is either one
    of the transformations makes a mistake or the


