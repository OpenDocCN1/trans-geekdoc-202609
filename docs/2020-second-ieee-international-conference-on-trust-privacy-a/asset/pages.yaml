    Adversarial attacks can be targeted or untargeted. Untargeted attack means making
    the predicted class of the benign input changed by adding adversarial perturbation
    to some other classes in $\mathcal{Y}$ without a specific target class. Targeted
    attack seeks to misclassify the class label of a benign input $x$ to a target
    class in $\mathcal{Y}$ by purposely changing the benign input $x$ via adversarial
    perturbation. An adversarial attack is intended to construct a perturbed input
    $x_{adv}$ with minimal distance to $x$ to fulfill the goal of the resulting prediction:
    the predicted label $\hat{y}_{adv}$, which is different from $y$, and yet its
    user would still consider the adversarial input $x_{adv}$, similar to the benign
    input $x$, to believe that the predicted label $\hat{y}_{adv}$ should be identical
    to $y$.


    $$\Delta_{adv} = dist(x, x_{adv})$ measures the distance between the adversarial
