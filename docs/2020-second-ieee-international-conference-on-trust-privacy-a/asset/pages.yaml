    # VI. CONCLUSION


    We have taken a holistic approach to characterize 15 adversarial attacks and show
    the effectiveness and defense of adversarial examples in deep learning systems.
    We show with three cases that different input class behave identically under the
    same attack strategy, for untargeted and targeted attacks. We propose the strategic
    input transformation defense. The proposed defense is attack-independent and capable
    of outperforming others. Strategic training and input transformation defense yields
    high success rates with high attack prevention success and low false positive
    rates compared to representative defense methods.'
