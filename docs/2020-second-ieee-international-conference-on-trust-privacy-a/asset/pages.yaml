  md: '# V. STRATEGIC INPUT TEAMING DEFENSE


    # A. Input Transformation Techniques


    Adversarial attacks attack the image at the pixel level; they make it easy to
    introduce noise at calculated location so that the perturbed input could fool
    the classifier without being noticed by the human. We introduce input transformation
    techniques to clean the noise or mitigate the effect of the noise. The former
    denotes by removing the perturbation. The latter augments the data with mapping
    function. Although these techniques do not remove the injected noise, they take
    advantage of the inaccuracy of the instance and make the penalty longer. There
    are no limits on the amount of processing and computer power and we only study
    a category of all potentially useful for defense: color-red detection, image smoothing
    (median filter and non-local means),


    There are two input transformation strategies: detection-only and with detection.
    We feature fuzzing [13] as the former and we believe that for a legitimate example
    and its measured version should be similar; the predictions for adversarial examples
    and its caused instance are comparatively different. The difference of the prediction
    vectors between an input and its transformed version is enough to establish and
    distinguish the adversarial example and benign input. When there are multiple
    input transformation techniques, an illustration of input transformation defense
    is provided in Figure 7. Different input transformation techniques could push
    the adversarial example to different sub-optimum in the decision space for correct
    prediction. We evaluate the defense success rate of adversarial examples in Table
    V and demonstrate that simple input transformation can significantly enhance the
    robustness of a model by predicting correct labels of these


    ![](img/c405e4fc84edc19e79233606c35adda7_6_0.png)


    | | bit | medfilter | rotation |

    |---|---|---|---||

    | Input image | CW, most | depth 1 | 3*3 | -12 |

    | TM | 5 (1) | 3 (1) | 5 (0.994) | 3 (0.991) | 3 (1) |

    | Input image | TM (0.959) | bird (0.985) | dog (0.996) | example (0.921) |


    Fig. 8: Illustration of strategic input transformation teaming. The MNIST example
