    MR is defined as the percentage of misclassified adversarial examples in all attacks:
    $MR = \frac{AEF}{AE}$


    class of adversarial input is the same as that of the benign input; $y_{\delta}$
    indicates the label space excluding $y$. For untargeted attacks, the label $y_{\delta}$
    generates the predicted class $y_{\delta}$, and the distance measures the distance
    between the prediction vector of adversarial input $x_{\delta}$ and $y_{\delta}$.
    This distance is maximized to achieve the goal of the predicted $y_{\delta}$ of
    adversarial input in successful attacks, achieving the goal of not changing the
    label of original input $x$. Accordingly, the distance between the predicted class
    of adversarial example and the predicted class of benign example, defined as $d(y,
    y_{\delta})$.


    **Mean confidence on adversarial (MeanConf):**

    MeanConf is the mean confidence on adversarial class in successful adversarial
    examples: $MeanConf = \frac{1}{n} \sum_{i=1}^{n} d(y, y_{\delta,i})$, where $n$
    is the number of successful adversarial examples in an untargeted attack and targeted
    attack.


    For targeted attacks, the target label $y^{t}$ is some objective function that
    measures the distance between the prediction vector of adversarial input $x_{\delta}$
    and the target label $y^{t}$. The goal is to minimize this distance so that the
    adversarial input $x_{\delta}$, generated by injecting perturbation into $x$,
    matches the target label with high confidence. In untargeted attacks, we need
    to maximize the probability confidence on the original label $y$. Therefore, the
    attack needs to enhance the probability confidence on the target label while minimizing
    the probability confidence for all other labels so that the target label stands
    out. This can be done using $\Delta_{\delta}$ which is generated from perturbation
    function $d(y, y_{\delta})$.


    **DiAATA:** DiAATA measures the mean distance between the adversarial class and
    correct class in successful adversarial examples: $DiAATA = \frac{1}{n} \sum_{i=1}^{n}
    |p - p_{\delta,i}|$, where $p$ is the probability confidence.


    Adversarial examples use a variety of evaluation metrics to study their effects
    and costs. These attacks also include FGSM [14] and those used in robustness,
    PGD [31], C&W and JSMA [15]. These attacks concern different norms of the perturbation
    distance in equation: $L_{\infty}$, $L_0$, and $L_2$. For each targeted attack,
    we assume two kinds of target attack: the most-likely class in the prediction
    vector ($y^{\delta} = \arg\max_{y} p(y)$) and the least-likely class ($y^{t}$
    in targeted attack).


    **DiAOC:** DiAOC measures the average distance between adversarial class and true
    class in the benign example. Given the probability confidence on benign example,
    this is used to compare quality. If the probability confidence of benign example
    is higher than that of adversarial example, the attack is considered successful.


    The effect of adversarial examples can be measured with various costs: perturbation
    cost which can be measured using different norms, perception cost which is measured
    by image quality evaluation, and time cost. **Perturbation Distance (DistPerturb):**
    $Disturb = \frac{1}{n} \sum_{i=1}^{n} ||x_{\delta,i} - x_i||$, where $n$ is the
    number of adversarial examples.


    # III. CHARACTERIZATION OF ATTACKS


    We propose the following evaluation metrics to analyze and compare the effect
    of adversarial examples. AE, SAE, and MAE adversarial examples, successful adversarial,
    and misclassified adversarial examples are considered successful when under limited
    amount of perturbation noise, $y_{\delta} \neq y$ in untargeted attacks or $y_{\delta}
    \neq y^{t}$ in targeted attacks.


    **Attack Success Rate (ASR):** The percentage of adversarial examples that are
    successful in all attacks. $ASR = \frac{AEF}{AE}$. The higher is the ASR, the
    more effective the adversarial attack can cause.


    **Perception Distance (Dist-SSIM):** SSIM [32] is used for measuring the visual
    similarity between two images. It image degraded as a perceived structural change
    in input and incorporates luminance masking and contrast masking. We compute the
    cost of the adversarial example. If the two images are similar, the SSIM is high.


    **Perception Distance (Dist-PSNR):** PSNR is an approximation to human perception
    of perceived quality and is conceptually used to measure the quality of image.
