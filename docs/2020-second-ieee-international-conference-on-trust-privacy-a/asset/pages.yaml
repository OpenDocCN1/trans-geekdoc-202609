  md: '# Adversarial Deception in Deep Learning:

    Analysis and Mitigation


    Wenqi Wei*, Ling Liu*, Margaret Lopez*, Ka-Ho Chow*, Emnet Emre*, Stacey Troy*,
    and Yanzhao Wu*

    * Georgia University, Atlanta, Georgia, USA

    * Georgia Tech Research Institute, Atlanta, Georgia, USA


    Abstract— booming success of deep learning has raised security and privacy concerns
    as more tasks are accompanied with sensitive data. Adversarial attacks in deep
    learning have emerged as one of the dominating threats to a range of mission-critical
    deep learning systems and applications. This paper proposes a holistic defense
    against adversarial examples in deep learning by studying their divergence effect
    and presents an attack-independent countermeasure with three original contributions.
    First, we provide a general formulation of instance-level divergence for adversarial
    examples. Then, we evaluate adversarial attacks with a variety of evaluation metrics
    to study their advantages and costs. Finally, we study the effectiveness of adversarial
    examples and to demonstrate their divergence across adversarial attacks. We take
    advantage of divergence to propose strategic input transformation defense. The
    proposed defense method is attack-independent and capable of auto-reforming and
    auto-verifying on the adversarial input. We show that this defense can achieve
    high success rates and low false-positive rates compared to representative defense
    methods.


    **Keywords—**Trust and reliability in deep learning, adversarial attacks, mitigation
    strategy


