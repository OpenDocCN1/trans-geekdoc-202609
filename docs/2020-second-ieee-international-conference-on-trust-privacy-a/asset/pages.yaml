    Adversarial examples. Meanwhile, input transformation does not significantly impact
    a classifier''s performance on legitimate examples. In the table, bit indicates
    the original encoded 8-bit to 1-bit (1 ≤ ≤ 8); k denotes the median filter with
    kernel k and a - b - c indicates non-local smoothing with smoothing window size
    a, patch size b and Gaussian filter width c.


    There are multiple ways to team different input transformation techniques. The
    goal is to exclude the incoming noise or to strengthen the defense precision.
    By advanced teaming, we can ensure that the defense is not dependent on any dataset
    or the attack algorithm. We can select different techniques to handle each kind
    of noise and team them up. The local filter is good at removing L2 noise and we
    can team it with non-local filter for filtering. We also rely on the capacity
    of diversity for strengthening defense. To be specific, we group the techniques
    that process different kinds of noise. Within each group we select one technique
    and choose the parameter by filtering with the ones with low accuracy on the test
    set. We also build a ranking system for strategic defense to determine the best
    team by aggregating the team vote from each single transformation method. We show
    that three different techniques are sufficient in effectively defending adversarial
    examples. While we only explore a single strategy in this paper, we believe there
    are other types of transformation that work. The future of input transformation
    methods is open. We can combine any input transformation techniques to be dynamic
    to. An illustration of strategic input transformation teaming is provided in Figure
    8.


    # B. Defense Metrics and Evaluation


    Prevention Success Rate (PSR): percentage of adversarial samples that are corrected
    and classified by the target model. With the defense test set, PSR denotes the
    test accuracy.'
