- pgno: 50
  md: '# Services Running


    Many moons ago, I taught the CompTIA classes for Iron Horse University at Fort
    Carson in Colorado Springs. My soldiers would sit in my classroom for two weeks
    of instruction and hands-on learning. So, if someone wanted to talk to one of
    my soldiers, they would come down the hall into classroom 4. They needed a specific
    person, so they would go to that person''s seat so they could talk to him or her.


    As an example, let''s say the soldier''s name was Carla, who was seated in seat
    23. So, Carla''s socket was classroom.23. A socket is a point of ingress or egress.
    The combination of an IP address and a port is called an endpoint. A socket is
    one of the endpoints in a two-way conversation between two programs communicating
    over a network. A socket is bound to a port number so we know which data that
    destined for.


    The person in seat 23 is like the program that is registered with the operating
    system to listen at that. What if Carla was absent? What if someone was sitting
    in seat 23? Programs listening on a certain port may or not be the usual listener.
    You need to know whether Carla and Robert swapped seats. Table 3.1 describes the
    most common ports and the services that should running.


    # Table 3.1: Top Ports Defined


    | PORT NUMBER | NAME | USED FOR |

    |---|---|---||

    | 20 | FTP-data | File Transfer Protocol | Moving files between client and server
    |

    | 21 | FTP-control | File Transfer Protocol | Control information for moving files
    |

    | 22 | SSH | Secure Shell | Security for logging in and file transfer |

    | 23 | Telnet | Telnet Protocol | Obsolete encrypted communication |

    | 25 | SMTP | Simple Mail Transfer Protocol | Sending/routing email |

    | 53 | DNS | Domain Name System | Phonebook of the Internet; translates names
    of websites to IP addresses |

    | 80 | HTTP | Hypertext Transfer Protocol | Foundation of the World Wide Web |

    | 110 | POP3 | Post Office Protocol | Receiving email by downloading to your host
    |'
  merge: -1
  img_proc: true
