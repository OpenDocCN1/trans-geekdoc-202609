    - Sysinternals

    - GodMode


    In 2012, I left the great state of Louisiana for Colorado to take a position with
    the Communications-Electronics Command (CECOM) at Fort Carson for the U.S. Army.
    My job was to train soldiers for information assurance (IA). The Department of
    Defense has a requirement that any full- or part-time military service member
    or contractor with privileged access have certain computer certifications. This
    was known as DoD 8570. My role was to teach these certification classes to help
    soldiers achieve the correct IA level needed to perform their job.


    My commandant Ryan Hendricks is a networking guru, and he wanted to stay in Cisco
    classes. Someone needed to teach A+, Network+, Security+, Server+, CASP, and CISP
    as well as Microsoft Active Directory, SCCM, and SharePoint. We both held the
    opinion that it wasn''t fair for us to teach the class if we didn''t hold the
    certification. He continued down the path, and I skipped down the CompTIA/Microsoft
    certification path.


    While studying these certifications, I had many "aha" moments that are relatively
    today. In fact, when I am teaching my certification classes for Rapid7, I often
    take a few minutes when everyone is getting settled into or her seat after lunch
    show some of these cool troubleshooting tricks for Windows. It''s a bit of a bonus
    for coming back on time.'
