    he scan shown in the figure is targeting your network. Your results will be different.


    By watching the pane, you see each of the four distinct phases. The first phase
    you saw in the discovery scan was the ping. After you know there is a response,
    Metasploit runs Nmap to identify the ports that are open and by default will look
    for commonly open ports such as HTTP and SSH. The third phase that kicked in was
    looking at key indicators or fingerprints of operating systems and versions. The
    last action was bubbling that information up into the project.


    # Gaining Access


    An exploit is a program that takes advantage of a vulnerability that is on a device.
    Exploits can be remote or client-side. A remote exploit will be the type that
    focuses on services running on network-connected machines that you have decided
    to target. A client-side exploit is the type of exploit that takes advantage of
    vulnerability in software you have installed on a computer system. There are software
    packages that have a reputation for being vulnerable even after you run a patch
    on them. I have experienced the frustration of patching systems, running a vulnerability
    scan, and then finding the patch I just used has a vulnerability.


    If you look at your first scan retrieved by navigating the Overview page, you
    will see there are four quadrants. So far, I have done only a discovery scan to
    try to figure out what is running on my network. As you see in Figure 10.10, the
    initial scan returned 7 hosts and 26 services with 0 vulnerabilities and 0 applicable
    modules identified. Let’s dig deeper into this example.'
