- pgno: 203
  md: '# Chapter 13 - Securing OSI Layer 8


    wherever I knew people congregated or were a captive audience. Every other month,
    I would have a contest that would involve some of the information in the newsletter,
    and the reward could be a day off or some type of recognition. People started
    paying attention. When IT periodically phased our internal employees, they recognized
    the teltale signs and were able to push phish-ing to the proper authorities at
    the company.


    If you think you were a victim of a social engineering campaign and have revealed
    sensitive information, report it to the right people—including network administrators.
    They have tools and can be the alert for any suspicious behavior. If you believe
    you have financial accounts that have been compromised, contact organization immediately.
    Close that account and watch for anything unexplainable. Check your credit reports
    for any accounts that are opened you did not authorize. I have my credit and my
    children''s accounts locked down. Unfortunately, I was a victim a few years ago
    in the U.S. Office of Personnel Management hack, and in my clearance paperwork
    was the personally identifiable information about my family.


    Lastly, password hygiene is a fiercely debated topic in IT. If you''re compromised,
    immediately change any passwords you might have revealed. If you use the same
    password on multiple sites for different accounts, change those as well, and never
    use that password again. Some sites require the password to be a certain length,
    with uppercase, lowercase, and special-characters. Some people swear by using
    password managers like LastPass, Keeper, and Dashlane. A password manager is a
    tool that does the work of creating and remembering all the passwords for your
    accounts. For me, it sounds great but is a single point of failure.


    To make accounts safer, you should make sure your passwords are


    +   - Long and complicated. Ideally, your password should be totally randomized
    with uppercase and lowercase letters, making it very difficult to remember. Try
    to create a long password out of one of your favorite books—for example, WhoJn@Gl!

    - Do not write down or use birthdays.

    - Always use multifactor authentication, whenever possible.

    - Don''t be too terribly on social media. Nearly 90 million Facebook accounts
    had their profile information shared by researchers using a third-party quiz app.
    If you''re not paying for it, you are the product. Nothing is ever true on social
    media.


    Lastly, if you have chosen to create your passwords yourself, you do have another
    option. A friend of mine, Michael Hawkins of Wanttegrity, has a site built essentially
    for his customers but has made it available to anyone who would like to play with
    it. If you visit www.wanttegrity.com/passwords.php, you can use your regular-sized
    normal password as the master key and the account you are'
