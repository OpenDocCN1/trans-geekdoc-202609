- pgno: 205
  md: '# 196 Chapter 13 Securing OSI Layer 8


    ![](img/e8e965b6c3537819be0d570febb3fc1d_205_0.png)


    Figure 13.2: 70.22 percent of the planet runs Windows.


    There are pros and cons for everything, and there are times and places for tools.
    WSL has its benefits as well as drawbacks. A lot of great tools have been developed
    for Linux that are free, WSL supports a wide variety of distributions. WSL is
    easy to install, and it takes about 5 minutes (not counting the reboot). When
    WSL is running, you can access your local machines filesystem through the subsystem.
    The flip side of this is that WSL is almost like a Linux. It was not engineered
    for heavy-duty production loads, and it might be more efficient and faster to
