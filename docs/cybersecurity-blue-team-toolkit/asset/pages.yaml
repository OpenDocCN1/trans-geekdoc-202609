- pgno: 75
  md: '# Chapter 5 ■ Monitoring with OSSEC 63


    Several options are available in the agent manager. You can choose to add an agent,
    extract a key for an agent, list existing agents, remove an agent, and quit. Each
    of these has a corresponding letter to those actions.


    # Adding an Agent


    To perform this, type a at the Choose Your Agent prompt on the manage_agents screen
    and press Enter.


    You are prompted to provide a new name for the agent. This can be the hostname
    or random string to identify the system. Figure 5.6 shows an example of how to
    create a name for an agent. For best practice, create a constant naming convention
    using some type of spreadsheet that allows you to track your agents.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_75_0.png)


    Figure 5.6: An example of a representative agent name


    From this agent name, I know that it is an agent in Denver in rack 3. It’s, and
    the agent sequence number is 01. Too many organizations name their machines what
    they are and give a road map to exploitation to the hacker on a silver plate.
    Security through obfuscation is a pillar of our industry. You wouldn''t name a
    machine WIN2K8SQL, would you?


    After you have named the agent, you have to specify the IP address for the agent.
    This can be a single IP address or an entire range of IPs. If you use a specific
    IP address, it should be unique. If you duplicate any IP addresses, it will most
    likely cause issues in the future.


    After you specify the ID you want to assign to the agent, manage_agents will suggest
    a value for the ID. This will be the lowest number that is not already assigned
    to another agent. The ID 000 is assigned to the OSSEC server. To accept the suggestion,
    simply press Enter. To choose another value, type it and press Enter.


    As the final step in creating an agent, you have to confirm adding the agent.
    For example, you would enter the values shown in here:


    ```

    ID: 000

    Name: ADENRK3SVR01

    IP Address: 192.168.100.1

    ```'
  merge: -1
  img_proc: true
