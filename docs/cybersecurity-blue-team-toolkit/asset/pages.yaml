    it evolved and is available for Windows as well as in a graphical user interface
    (GUI) format, Zenmap. There are more than 100 command-line options in Nmap, and
    none of these were fully documented by the author, Gordon Lyon.


    In any size but especially large, dynamic networks, it is vitally important to
    break down these complex networks and analyze traffic, facilitate issues, and
    fix connection problems. Network scanning is a process of finding assets that
    are alive or have a heartbeat, communicating and then gathering as much vital
    information about those assets as possible. Network scanning can be divided into
    four stages:


    +   - Network mapping

    - Open ports

    - Services running

    - Operating systems


    # Network Mapping


    Network mapping uses a process to discover and visualize assets by actively probing
    them. Nmap sends both TCP and UDP packets to a targeted machine. These are called
    probe packets. A probe packet is used in an active tool to collect information
    on a network segment of interest. Data is collected after sending those probe
    packets that hop from node to node and asset, which returns to Nmap.


    If you were to scan 65,536 ports on every single machine in your ecosystem, this
    could take an astronomically long time and is really unnecessary. Occasionally,
    you may hear someone refer to a host discovery scan as a ping scan. In Nmap, you
    could choose to skip the ping and use other targeted methods to find the active
    hosts on your network.


    Network environments are all different; therefore, host discovery are going to
    be very different. The hosts on your network serve multiple purposes, and from
    a priority standpoint, not all assets are created equal. Some assets are mission
    critical, some are used occasionally and are not as important.


    By default, Nmap starts its process by launching host discovery. Nmap will send
    an ICMP echo request, ICMP timestamp request, and a TPC'
