    # OSI Model


    The OSI model was created by the International Organization for Standardization
    (ISO) to give architects, engineers, and manufacturers a modular way to troubleshoot
    issues. Certain protocols work at certain layers of OSI. As illustrated in Figure
    7.2, the OSI moves in both directions depending on whether someone is sending
    or receiving data.


    When data is sent across a network, the information is encapsulated as it travels
    down the OSI layers. When the data is received, it travels up the layers and is
    demultiplexed and deivered to the end user at the upper layers. This process is
    likened to using the post office. You write a letter, fold it and put it in an
    envelope, address it with a destination and receiving address, pay postage, and
    drop it off at the post office. The post office delivers it to its destination
    address and intended person.


    Complex problems can be more easily solved when you take this huge process and
    break it into smaller pieces. Nontechnical end users turn on their system, log
    in, open a browser, type email in a URL, and enter a username and password to
    read and compose their email with no clue what it looks like from a point of view.
    For any type of analysis, it''s important to understand what is happening at the
    different layers of the OSI model. Wireshark will capture filter traffic on specific
    fields within supported protocols manageable-sized .pcap files in real time.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '![](img/e8e965b6c3537819be0d570febb3fc1d_98_0.png)


    Figure 7.2: The OSI model sensing and receiving data


    The physical layer is where you start. This is where the transmission of data
    using electrical signals, light, or radio occurs. Typically you can think of this
    as being the hardware layer. Devices such as hubs, the actual cables, and Ethernet
    work at this. When forming a hypothesis for correcting issues in your network,
    the physical layer is the equivalent of "Have you turned it on?" If there is no
    power, you have no communication, so start troubleshooting the physical layer.


    The data link layer (or layer 2) is responsible for the encoding and decoding
    the electrical signals from the physical layer into bits and bytes and frames.
    The data link layer can be subdivided into two sublayers: MAC and Logical Link
    Control (LLC). The MAC layer controls how a computer on the network gains access
    to data, and the LLC layer controls flow and error checking. Think of MAC as the
    MAC address that is burned into the network interface card.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Chapter 7 Wireshark


    The network layer is where switching and routing take place using IP addresses.
    This is where the logical path gets plotted across the World Wide Web, taking
    the data packet to its final destination.


    The transport layer is responsible for end-to-end error recovery. TCP and UDP
    work to get the data where, but in many different ways. Using the post office
    analogy, TCP is like using request received, and UDP may or not get packet in
    your mailbox. TCP is connection-oriented architecture where you will see SYN,
    SYN-ACK, and ACK. TCP’s three-way handshake technique is often referred to as
    “SYN, SYN-ACK, ACK” because there are three messages transmitted. SYN synchronize,
    and ACK is acknowledge. When you send a packet, which is the SYN, and the receiver
    acknowledges the receipt of packet, which is the SYN-ACK. You acknowledge receivers
    acknowledgement that they did receive that packet, which is the ACK. TCP is used
    to make sure systems get all the packets they need to reassemble a message. This
    is called a three-way handshake. UDP doesn''t care if you receive your data. Think
    of a video or voice stream. Nothing gets lost if the connection breaks, and nothing
    is acknowledged that it received. Figure 7 shows the ACK of packets and their
    number to be rebuilt properly by the receiver.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_99_0.png)


    Figure 7.7: Wireshark acknowledgement traffic'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# Chapter 7 ■ Wireshark 89


    The session layer is layer 5 of the OSI model. It is responsible for making, managing,
    and terminating connections. Layer 6 is the presentation layer, which is in charge
    of what gets presented to your screen. Encryption and decryption of data happen
    at layer 6 as well. Finally, the seventh layer is the application layer, which
    supports the end users and their processes. Quality of service (QoS) works at
    layer 7 as well as application services such as email and HTTP. QoS is the ability
    of a network to provide better service to network traffic. The primary goal is
    to give priority to traffic by dictating bandwidth to control latency.


    Each layer of the OSI model ensures the delivery of data from one place to another.
    If a layer fails, you end up with an error. With Wireshark''s help to diagnose
    the failing protocol, you can pinpoint where the problem is occurring so you can
    fix the error.


    # Capture


    One of my favorite ways to teach Wireshark to beginners is to have students download
    and install Wireshark, bring up a terminal window, and capture the traffic after
    they launch Nmap. As you learned in Chapter 3, "Nmap: The Network Mapper," good
    guys as well as bad guys use it. You can recognize what Nmap traffic looks like
    and you know that it''s not the one running, when others is someone attempting
    to map out your network.


    | LAB 7.1: ZENMAP AND WIRESHARK |

    | --- |


    > NOTE You need to use three tools to make this lab work: a terminal window, Zenmap,
    and Wireshark. I am running this lab on a Windows 10 machine I can open a command
    shell. You used Zenmap in Chapter 3. You can down-load Wireshark from www.wireshark.org.


    1. Open a terminal window. Run the following command: ipconfig /all. Look for
    the IP address on your Wi-Fi network interface card.

    2. Open Zenmap. In the target field, add the IP address identified in the previous
    step. In the profile field, leave the default of intense scan.

    3. Open Wireshark. On the welcome page as you saw in Figure 7.1, identify the
    Wi-Fi interface that corresponds with step 2. Double-click the connection. It
    will start capturing data.

    4. Go back to Zenmap and click the Scan button. On a single asset, the Nmap scan
    may last up to 2 minutes.

    5. When the Nmap scan is done, return to Wireshark and click the red box under
    the word Edit. This will stop the capture, and you now have data to save and analyze.

    Continues'
