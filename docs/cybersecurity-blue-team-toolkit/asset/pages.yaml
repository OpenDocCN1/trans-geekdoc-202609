    I years of vulnerability management experience. At first, it was was theoretical
    when I was teaching at Louisiana State University. It became a more hands-on role
    when I worked as an IT director for a small private school and then again when
    I worked for the U.S. Department of Defense (DoD) as a contractor. If you are
    planning to take any security certification exams—whether it ISACA, ISC2, or CompTIA—you
    need to be aware that the management of the vulnerability lifecycle and risk is
    a key component on those exams.

    Some ships are titanic, and some boats are like a kayak, could represent your
    home network, while a Fortune 50 company would be more like the Queen Elizabeth
    II. The goal of both vessels is the same: Don''t sink. If you have been tasked
    with vulnerability management, your task is the same: Don''t sink.


    # Managing Vulnerabilities


    As I mentioned earlier, you must know your environment better than an attacker
    and use that attacker''s mind-set in key controls to develop your security program.
    Now that you have all the open-source tools to troubleshoot your network and


