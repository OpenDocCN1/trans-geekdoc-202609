    list of the asset followed by a possible hostname. It includes information such
    as the IP address of as if it was possible to be operated by the operating system,
    purpose, and services running. For a Metasploit user, the last column is most
    important: What is the current host status of these devices? The status can be
    scanned, shelled, looted, or cracked. The status will change depending on the
    last action successfully performed on that asset.


    +   - Scanned—A discovery scan or import was completed.

    - Shelled—A session was opened.

    - Looted—Data, files, screenshots were collected.

    - Cracked—The password was cracked and is now available in plain text.


    Next to Hosts on your project page, you have the Notes tab that lists the type
    of data that was retrieved on each asset. The Services tab lists the name and
    protocol, port number, and current state of each service. The Vulnerability tab
    may populate this project with a few exploited vulnerabilities found during the
    discovery scan that are considered low-hanging fruit that can be easily exploited.
    The Applicable Modules tab lists the Metasploit modules that are avenues of exploitation.
    Captured data will help you build a report of what was found in the environment
    during the discovery and future scans of the selected IP address range. With the
    paid version, Network Topology will draw a picture of the environment like Zenmap.
    Zenmap is the GUI Nmap tool that was used in Chapter 3.


