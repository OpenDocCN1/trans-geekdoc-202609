- pgno: 130
  md: '# Chapter 9 ■ Managing Logs 119


    anomalies occurring. A few failed login attempts by a user might be considered
    normal, but hundreds or thousands of failed login attempts might point to a brute-force
    or malicious attack.


    Consolidating and centrally managing all logs is different from logging each and
    event. The big question of what events to record and how much you need to log
    is a problem best addressed by an auditor. With the right coordination, an auditor
    along with your legal department focused on compliance with a technical CISO''s
    perspective can give consideration as to what the right level of information is.
    These questions typically need to be answered for every component of your system
    and be well documented so you are able to easily scale in the future. For most
    assets, you will probably stick with defaults. The only major operating system
    that does not have built-in support for sending syslog is Microsoft Windows. Windows
    includes PowerShell, and PowerShell can use the .NET Framework to send UDP packets
    to a syslog server.


    Another thing to think about is your data retention. How do you need to keep the
    logs? Do you need them for troubleshooting? Are there regulatory or audit requirements
    that require you to keep the logs for a certain period of time?


    When I was to CISSP for ISC², one of the best tools they gave us to teach with
    was 250 retired questions. I remember one concerning logs:


    > You are a system administrator. Your organization’s security policy states that
    you keep logs for 3 years. You have kept logs for 5 years. You have been subpoenaed
    for 5 years of logs. What do you legally have to give the authorities?”


    The answer is to turn everything you have. We have to trust that the management
    team has security policies in place for a reason. If you disagree with the policy,
    it is our responsibility as cyber professionals to pursue a discussion with the
    chain of command until we understand why the policy is in place or we change the
    policy. Otherwise, the violation of records too long could open up potential damaging
    and sometimes legal issues.


    Your daily log volume might already be substantial, but it can exponentially when
    a device fails. The resulting log messages could easily quintuple the number of
    log messages that generated.


    Log files come in a variety of formats. Some formats more traditional standards,
    while others are completely custom. Your log solution should be able to parse
    and present the data in a comprehensive form in real time, and it should allow
    you to define custom parsing rules. Parsing is breaking down a log into smaller,
    better digestible messages and putting them into their own groups so that you
    can analyze and visualize them in order to identify data inconsistencies.'
  merge: -1
  img_proc: true
