    # Wireshark


    My first real experience using Wireshark was in a forensics class with Sherri
    Davidoff, CEO of LMG Security. Sherri walked us through many tools to investigate
    a case where money had been stolen. Wireshark was the tool we kept returning to
    time and again to prove what had been planned and executed, and eventually we
    were able to prove the threat actors were.

    Wireshark is a tool that every network or security administrator should know.
    It is an open-source tool used for capturing network traffic and analyzing packets
    at an extremely granular level. Sometimes Wireshark is called a network analyzer
    or a sniffer. Packet capturing can tell you about transmit time, source, destination,
    and protocol type. This can be critical for evaluating events that are happening
    or troubleshooting devices across your network. It can also help a analyst determine
    whether network traffic is a malicious attack, what type of attack, the IP addresses
    that were targeted, and where the attack originated. As a result, you will be
    able to create rules on a firewall to block the IP addresses where the malicious
    traffic originated.


    Cybersecurity Blue Team Toolkit, First Edition, Nadean H. Tanner

    © 2019 John Wiley & Sons, Inc. Published 2019 by John Wiley & Sons, Inc.


    83'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'Wireshark shows packet details captured from different network media, breaking
    down the Open Systems Interconnection (OSI) model into the data link, network,
    transport, and application layers. At the bottom of the workspace, you have an
    option to view the hexadecimal with corresponding ASCII values on the right.


    Wireshark is a powerful tool and technically can be used for eavesdropping. When
    you plan use this in a business environment, you will want to get written permission
    to use it and make sure your organization has a clearly defined security policy
    that protects the rights of individuals using the network. Stories abound of administrators
    capturing usernames, passwords, email addresses, and other sensitive user data.
    Wireshark is legal to use, but it can become illegal if you attempt to monitor
    a network that you do not have explicit authorization to monitor.


    Determining the resources that Wireshark needs on the size of the .pcap file you
    are examining. If you have a busy network, the files will be large. Wireshark
    can run on Windows and Linux machines. You will need a supported network card
    for capturing data, such as an Ethernet card or a wireless adapter. To get the
    latest copy of Wireshark, visit www.wireshark.org. The download page will have
    the proper version for your computers architecture and operating system. A new
    version typically comes every other month.


    To install Wireshark, double-check the name of the file you have downloaded. If
    you have downloaded Wireshark-win64-2.6.4.exe, you will be installing Wireshark
    2.6.4 for Windows 64-bit architecture. The download will include WinCap, which
    allows you to capture live network traffic, not just saved packets (.pcap files).


    Once you have installed the Wireshark executable, you will see the list of the
    different network interfaces that are functioning on the device as well as a graph
    of current network activity on each interface. It reminds you of an electrocardiogram
    (EKG) that measures heart rhythms. As you see in Figure 7, if you have peaks and
    valleys, you have traffic on that interface. If the line is flat, then that interface
    is not active.


    When double-click a network interface that is displaying activity, the main window
    will open to display all the traffic on that network. The major components of
    this page include the menu; the packet list, details, and bytes panes; and the
    status bar at the bottom, which can give you a great deal of detail regarding
    your capture.


    The packet list pane is located in the top third of the window and by default
    shares information from the headers of each packet captured. Summary information
    includes source IP address, destination IP address, protocol in use,'
  merge: -1
