    Now that you have the asset configured with all the proper policies and patched,
    it is time to prepare it for cloning.


    # Clonezilla Live


    Using any of the freely available imaging solutions like Clonezilla is an efficient
    way to create a fully configured and patched system image for distribution on
    your network. Clonezilla can be implemented from a server or a bootable'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Chapter 12 ⊟ Patch and Configuration Management


    device and permits users a variety of options based on their needs. One of the
    more flexible options of this solution can be deployed using a portable drive.
    This drive can contain prestaged images for on-site deployment. Sometimes you
    will have a situation where a machine will not boot to the network or it is against
    regulations to move an ailing asset and using a portable drive is ideal.


    If you have an on-site technician, you can create an effective cloning system
    using a server machine, one or more technician machines, and a network switch
    to facilitate deployment to multiple systems at once. Many environments have this
    equipment sitting unused on a shelf. In practice, this simple setup has been shown
    to be agile and deploy more than 100 systems in a single week.


    Some best practices to consider when deciding to clone systems versus original
    media installations include the following:


    +   - Use an established checklist for pre- and post-imaging actions to ensure
    proper system deployment.

    - Update your technician machine(s) to the most current updates according to your
    security policy.

    - Update your images on a manageable schedule. This ensures that systems require
    less post-deployment patching.

    - Have important drivers readily available for the variety of systems that your
    image will support.

    - Use a sysprep tool to remove system identifiers prior to taking your image.

    - Use a secure repository to hold your system images; often having a stand-alone
    cloning system works well.

    - Have a method to positively assure the integrity of your stored images. Hashing
    is a cheap but effective method for this purpose.


    In Lab 12.5, you''ll be creating a Clonezilla Live USB.


    # LAB 12.5: CREATING A CLONEZILLA USB


    +   1. Go to www.clonezilla.org. Two types of Clonezilla are available: Clonezilla
    and Clonezilla SE. Click the link for Clonezilla Live. (Clonezilla SE is for enterprise,
    where Clonezilla Live is for a single backup and restore. Personally have multiple
    USBs in the same time.)

    2. For a USB flash drive or USB hard drive install, find the document link for
