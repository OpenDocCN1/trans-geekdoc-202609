  md: '# Reconnaissance


    Before you start this Metasploit journey, you have to do your homework. After
    you have gained permission to legally explore a network, you need to gain as much
    information about that network. This includes information such as DNS, domains,
    ports, and services. A physical or digital folder for this process. It makes so
    much easier when you have to create a report. It works as a great resource when
    you expanding your reach deeper into a network. I use Microsoft Note because it
    is so versatile and keeps everything together in a single location.


    Reconnaissance is gathering intelligence about an organization and can take two
    forms: passive and active. Passive reconnaissance is done to gather as much information
    as possible without any type of engagement. The information you gather will be
    used to attempt successful exploitation of targets. The more you learn, the better
    crafted the attacks will be. Passive reconnaissance is completely and totally
    legal. You can browse the company website you like were a typical user.


    It amazes me much information is shared on social media websites. Professional
    social media websites are excellent places to discover employees’ names and email
    structures. If you decide to conduct a social engineering campaign, it is helpful
    to know if the employees email accounts are set up a first.lastname@company.com.


    You can visit the websites that most companies use to advertise the jobs they
    currently have available. When you go to the technical positions section, if organizations
    are looking for an Active Directory administrator, you can confirm they are using
    Microsoft infrastructure. They are looking for someone with a CCNA certification,
