- pgno: 233
  md: '# Sparta


    Sparta is another Python tool that is a GUI application that assists in the scanning
    and enumeration phase. It feels like Zenmap in the beginning when you define the
    parameters of the network you would like to investigate, as shown in Figure 14.23.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_233_0.png)


    Figure 14.23: Defining parameters in Sparta


    However, when you launch Sparta, after the initial Nmap scan and some data collection,
    it proceeds to run additional tools against the discovered services such as nikto,
    sbenmum, snmpcheck, and more. Figure 14.24 shows an example of some of the data
    that can be extracted, as the Sign In screen for the ASUS router at 192.168.1.117.


    Services that need a login telnet or SSH can be sent to the brute-force tool on
    the next tab to attempt to crack the password. Right-click any service that has
    been discovered and Select To Brute. Sparta attempts to automate several tasks
    that you would normally execute separately.


    # MacChanger


    After you have all the information from the three previous tools, you may want
    to change or fake your MAC address if you are attempting to disguise any of your
    exploit attempts. First, to find a list of all MAC vendors, type macchanger -1
    in your terminal window. You will get a list of all hardware vendors if there
    is a specific one you want to impersonate.'
  merge: -1
  img_proc: true
