    # Filters and Colors


    Wireshark uses display filters to concentrate on interesting packets while hiding
    the boring ones. You can select packets by protocol, value, or comparison. To
    filter packets by protocol, type the protocol you want to narrow down to, as shown
    in Figure 7.7. Press Enter to accept the filter selection. When you''re using
    a filter, it only changes the view, not the contents. The capture filter remains
    intact. To remove a filter, click the clear button, which is the X to the right
    of the filter.


    You can compare values inside packets as well as combine expressions into far
    more specific expressions. Every field inside a packet can be used as a string,
    such as `tcp`. A tcp string will show all packets containing the TCP protocol.
    Once you have found the packets you want to analyze, choose the appropriate filter.
    Table 7.2 lists used filters.'
