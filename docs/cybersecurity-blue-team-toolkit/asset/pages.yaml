  md: '# Chapter 5 ■ Monitoring with OSSEC 65


    for ID and the key are kept to avoid conflicts when deleting agents. Deleted agent
    can no longer communicate with the OSSEC server.


    When you have installed your agents on Windows and Linux machines, they should
    automatically start checking in with the manager. When you open up the Kibana
    OSSEC dashboard, you will see there are major panels.


    +   - OSSEC Alerts Over Time—There is a graph that displays the number of events
    by a unit of time.


    +   - Top Alerts Per Agent—This pie chart shows the top alerts for each active
    agent.


    +   - OSSEC Alert Data—This table displays the individual agents and the fields
    being alerted, as you see in Figure 5.7.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_77_0.png)


    Figure 5.7: OSSEC individual agent chart


    # Log Analysis


    Now that you have your agents logging and bringing them into your OSSEC server,
    it is for decoding, inspecting, filtering, classifying, and analyzing. The goal
    of LIDS is to find any attacks, misuse, or errors that systems are generating
    logs.


    Logs are monitored in real time by the manager. By default, log messages from
    host agents delete these logs unless the <logall> option is included in the OSSEC
    manager''s ossec.conf file. If this is enabled, OSSEC stores the incoming logs
    from agents in a text file that is rotated daily. The resources used by agents
    are minimal, but the resources used by the manager can fluctuate depending on
    the events per second (EPS). There are two ways you can analyze your logs: either
    by the processes that are running or by the files you are monitoring.


    When you are monitoring processes on an asset with OSSEC, the logs that are generated
    with rules contained within the database. If some information is not readily available
    in the logs, OSSEC can still monitor it by examining the output of commands and
    treating the output as it is a log file. Log monitoring will monitor log files
    for new events. When a new log arrives, it forwards the log for processing and
    decoding.'
  merge: -1
  img_proc: true
