  md: '# Access Management


    Access management is the process of identifying, controlling, managing, and auditing
    users'' access to any asset you manage. Typically in IT, asset management (AM)
    is used in conjunction with identity management (IM). IM creates and provisions
    different users, roles, groups, and policies where AM ensures the security guidelines,
    procedures, and policies are followed.


    There are many different organizations selling IM/AM solutions. Picking a solution
    is not easy. You have to keep in mind scalability, performance, and usability.
    Close-sourced solutions can hamper your ability to adapt applications to your
    specific requirements and total cost of ownership high. Open-source management
    can give you freedom to make good business decisions, customize for unique situations,
    and have low or no maintenance fees, but it can be difficult to implement. Not
    only do you have to manage IM/AM, you have to add privilege into the equation.
    The practice of least privilege limiting rights of users to only what they need
    to get the job done. Josh Franz, a security consultant at Rapid7 says, “Simply
    put, if you don''t have identity management in your company, you do not have security.
    All the security controls in the world won''t stop an attacker if everyone on
    your network is a domain admin.


    # AAA


    Authentication, authorization, and auditing (AAA) are often used together in cybersecurity
    when it comes to how someone gains access to a system. Authentication and authorization
    are critical points often confused, but they are different from each other. Authentication
    is confirming who you are, while authorization means what you have access to.
    Authentication is usually a username or ID and a password could also be something
    you have like a token or something you are like a fingerprint.


    Based on your security policies, you and your organization may need levels of
    authentication.


    +   * Single-factor—least authentication, usually a simple password to grant access
    to a system or domain.

    * Two-factor—two-step verification that results in more security. When you visit
    the bank to withdraw money from an ATM, you need both a physical card and a personal
    identification number (PIN).

    * Multifactor—the most secure type of authentication to grant access, using two
    or more techniques from different categories.


    Authorization happens after you have been authenticated. In the two-factor analogy,
    after using the ATM card and PIN, you get access to your money, and only your
    money. Authorization determines your ability to access what'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Chapter 8 Access Management 99


    systems and which accounts are you able to withdraw money from. This is a key
    component to access policy.


    Auditing (some say the third A) is used to make the controls put in place. Auditing
    is used to support accounting. Auditing is the logging of events that have significance
    such as who has logged in and logged out or who attempted some of privileged action.
    Monitoring can make sure that there are no malicious activities in the environment.
    If you are looking to prove someone did something on your network, audit and security
    logs are the absolute best files to maintain that someone or something performed
    an action in a networked environment.


    Another important part of auditing and accounting is nonrepudiation. Nonrepudiation
    cannot deny the performance of an action. You do not want a situation where one
    person claims an action happened and another is in total opposition to the story.
    A traditional example of nonrepudiation is a signature you received a document.
    In cybersecurity, nonrepudiation requires the creation of certain artifacts such
    as the:


    +   - An identity

    - Authentication of that identity

    - Evidence connecting identity to an action


    # Least Privilege


    If ever take a certification exam, you may see this as principle of least privilege
    (PoLP) and even privilege of least authority (PoLA). It is a concept that reduces
    the accidental or purposeful attack surface of an organization. There are several
    ways through access management you can use this concept to protect your ecosystem.
    In IT, we learn from others'' mistakes.


    About a decade ago, I was an administrator on a network with about 12,000 machines
    and 9,000 users. We used Group Policy in Windows to control the working environment.
    It was a way to centralize management of users'' settings, applications, and operating
    systems in an Active Directory environment. Had someone new to the organization
    who was full of great ideas but was not aware of or willing to follow the change
    management procedures we put in place to safeguard the network.


    He changed a feature in Group Policy that had catastrophic results. In the Event
    Viewer on a Windows machine you can configure your security logs. He checked the
    box to not overwrite security logs and pushed it out to 12,000 machines using
    Group Policy objects. If you''ve been IT for a while, you might be cringing. Within
    24 hours, he had locked out 9,000 users on our network by'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'filling up the allotted log space for successful and failed logon/logoff events.
    Frankly, we were able to fix the problem within about 30 minutes after we had
    figured out what had happened. At first, we had thought we were under attack.
    Through nonreproduction, we knew which admin had been logged into the system when
    the change occurred.


    Here are the morals of this story:


    +   - If you''re not sure what you''re doing, then ask.

    - Just because you can''t mean you should.

    - If you have limit access to critical systems, you reduce your attack surface.


    Most devices have mechanisms built in you where standard end-user and administrator
    accounts are for users who full access to all areas of the machine where user
    accounts are restricted; users can run applications but do not have full administrative
    access.


    One reason this principle works so well is that it will make you research on privileges
    at what level are actually needed. Unfortunately, the path of least resistance
    in many organizations is the overuse of accounts with deep and far-reaching privilege.
    The consequences of a network administrator opening an email attachment that launches
    malware while logged into the domain administrator''s account is that the malware
    will have administrator''s privilege on the domain and unrestricted access to
    the network. If the network administrator is logged into a standard end-user account,
    the malware only has access to the user''s data, and the potential compromise
    scope is much smaller.


    You should default to creating a separate user account for every user including
    administrators, and every account should use at least-factor authentication. This
    enables you to control what the users can install and websites they can visit.
    Many organizations allow all users on their network administrative privileges,
    and it creates a massive attack surface. Administrators should always log in their
    standard user account and use the Run As Administrator feature to run too many
    breaches that get traced back to administrators opening email and clicking a link
    that leads to a malicious download that compromises an attack that spreads through
    a network and steals everything. Not only do organizations lose intellectual property,
    but they too end up fined for violations of compliance, which can lead to a loss
    of millions in a single breach.'
