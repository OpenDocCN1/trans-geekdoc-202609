- pgno: 202
  md: '# Education


    Criminals are familiar with human nature. They will use whatever is in their arsenal
    to attack your organization and the people who work with you. No one who interacts
    with others is immune. You must educate your users to


    +   - Be very suspicious of any phone calls, visits, or email messages that they
    did not initiate. If you get requests for information about other employees, try
    to verify the identity of the requesters. If it is legitimate, they will provide
    credentials. If they have malicious intent, they will usually give up and try
    to find easier way

    - Do not ever reveal personal or financial information in email, and do not respond
    to email solicitations requesting this information. This includes clicking the
    links sent in an email. Banks will never ask for your PIN. The IRS will never
    call you.

    - Pay close attention to the URL of a website linked in the email or SMS message.
    Malicious websites may look very similar to a legitimate site. If you know the
    URL of the site you want to visit, type it in yourself. Do not click the link.

    - If you are unsure whether an email request is legitimate, forward it to your
    incident and response team. Do not use contact information provided on a website
    connected to the request.

    - Install and maintain antivirus software, firewalls, and email filters.

    - Block ads and pop-ups whenever possible. When you click an ad, you are susceptible
    to a number of attacks like downloading malware or clickjacking.


    Another of my favorite resources is Lance Spitzner, director of SANS Security
    Awareness. He says, "People are not the weakest link today, and they are the most
    common vector." "One of the biggest takeaways that SANS offers everyone is our
    OUCH! newsletters. If you have not subscribed, then I highly recommend you put
    this book long enough to SANS OUCH! OUCH! is a free security-awareness newsletter
    designed for everyone, not just IT professionals. These newsletters are published
    every month in multiple languages and are meticulously reviewed by other SANS
    instructors. You can go back several years or search for a specific category.


    A couple years back, I was tasked with coming up with some security awareness
    training for a software security company I worked for. I would print out the SANS
    OUCH! newsletters and put them above the coffee pot in the breakroom, on the mirror
    between the sinks in the bathroom, or above the copier. I put them'
