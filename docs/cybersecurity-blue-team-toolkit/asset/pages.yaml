    # The Social Engineer Toolkit


    According to the global statistics provided by gs.statcounter.com (see Figure
    13.2), 70.22 percent of all global desktop users are using Windows—more than 50
    percent of those users are on Windows 10, and interestingly, 2.22 percent are
    on Windows XP. According to this graph, there more global users of Linux, statistically
    speaking. I have done my best to show you mainly tools of the Windows persuasion.
    However, we''ve gotten to a tool that only runs on Linux and macOS. But I have
    a few tricks.


    Windows 10 has an interesting tool called the Windows Subsystem for Linux (WSL).
    It is a compatibility layer for running a Linux-compatible kernel interface that
    can then run GNU on top of it. GNU is not an acronym—it is an antelope project
    this was was named after. GNU is an operating system composed wholly of free software
    like Ubuntu, openSUSE, Debian, or Kali Linux. The type of user space will allow
    you to use a bash shell or programming languages like Ruby or Python.'
