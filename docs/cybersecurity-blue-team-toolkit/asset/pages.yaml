- pgno: 129
  md: '# Chapter 9 Managing Logs


    Syslog is a way for network devices to send a message to a logging server. It
    is supported by a wide range of devices. It can be used to log different types
    of events. Syslog is an awesome way to consolidate logs from many different sources,
    in different formats, and in massive volumes into a single location. If you don''t
    have a log management strategy in place to monitor and secure connected devices,
    the results can be difficult to overcome if at all.


    Using a syslog server to collect and store syslog messages provides a reliable
    central repository for log data. Syslog uses UDP communication to send messages
    to a central collector, also known as a syslog server. Syslog messages are used
    to troubleshoot network problems, establish forensic evidence, and prove compliance.
    Forwarding syslog messages to a central syslog server helps you correlate events
    across your network.


    Typically, most syslog servers have the following components:


    +   * Syslog Listener A syslog server needs to receive messages over the network.
    A listener processes syslog data over UDP 514. UDP is not connection oriented,
    messages aren''t acknowledged. In some cases, network devices will send syslog
    data over connection-oriented TCP 1468 to ensure and confirm delivery.


    +   * Database Large networks can generate a huge amount of Syslog data. Most
    Syslog servers will use a database to store syslog data to search and query.


    +   * Management Software With so much data, it is looking for a specific needle
    in a haystack. Use a syslog server that automates part of the work. Syslog servers
    should be able to generate alerts, notifications, and alarms in response to select
    messages. If you read the Verizon report, you know you have 16 minutes from compromise
    before the first click on a phishing campaign. As a security administrator, you
    need to be able to work quickly.


    A log management solution aggregates, indexes, parses, and generates metrics.
    Syslog messages are generated by operating systems and applications—as well as
    processes on printers, routers, and switches—and are configured to send to your
    syslog server. If your network includes Windows systems, the syslog server can
    help you manage Windows event log.


    Logs where there are many login attempts on a single account from diverse geographic
    locations or other suspicious activity is any situation administrator will want
    to investigate. Proactive, automated detection of unusual activity is critical.
    Cybersecurity is incredibly dynamic, and we do not know every single potential
    attack pattern in device, so monitoring for this type of activity is not an easy
    task. If you don''t analyze your logs to see what''s going on, you''ll never be
    able to detect suspicious activity.


    A baseline is a starting point you can use for comparisons. Create a baseline
    that represents normal activity on your system so you''re aware when there are'
