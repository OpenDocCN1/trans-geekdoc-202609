  md: '# Foreword


    The year was 2012 and I took a big leap in my own career to move across the country.
    I filled a role to lead a three-person team providing information technology and
    security training to Department of Defense personnel. This leadership role was
    new to me having worked for the past eight years in the intelligence and information
    security world for the most part as a trainer. While building out the team in
    the fall of 2012, and most importantly, I interviewed a wonderful candidate from
    Louisiana named Ndean Tanner. She was full of personality, charisma, knowledge,
    and most importantly, she had the ability to train. She proved this as part of
    her training demonstration in the interview process. I knew she was the right
    candidate and hired her almost immediately. Hiring Ndean is still one of the best
    decisions I Made, and My philosophy is that a great trainer does not simply regurgitate
    what they know. Rather, they have the ability to explain a topic in different
    ways so that each learner can comprehend. Ndean embodies this philosophy.


    Ndean trained thousands of learners on hardware to advanced security. In each
    class, she takes the time and effort to ensure every learner gets what they need.
    Whether learning a product for performing their job, building out their professional
    development, or advancing their career with a certification, Ndean covers all.
    If you had the opportunity to attend one of her training classes, consider yourself
    blessed by a great trainer. If you have not, you picked up this book, which is
    the next best thing. I am glad to see her author allowing everyone to experience
    her ability to explain complicated topics in simple ways.


    In the world of cybersecurity we are constantly bombarded with new products, new
    tools, and new attack techniques. We are pulled daily in multiple directions on
    what to secure and how to secure it. In this book, Ndean will'
  merge: -1
