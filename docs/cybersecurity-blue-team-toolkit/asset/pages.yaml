    One of the first things is a habit to update Kali Linux every single time I open
    it up. Offensive Security pulls from Debian four times a day. This ensures patches
    and updates are getting incorporated into Kali Linux on a daily basis. Keep your
    system up-to-date and make it part of your routine. As the OS loads, open a terminal,
    and run apt-get update, as shown in Figure 14.15. When that process completes
    and you get your command prompt back, run apt-get dist-upgrade (also shown in
    Figure 14.15).


    ![](img/e8e965b6c3537819be0d570febb3fc1d_227_0.png)


    Figure 14.15: Updating Kali Linux through a terminal


    Next, think about the credentials you need to use this VM of Kali Linux. Those
    are root credentials. This book has caused you with least privileges. Adding a
    non-root user to Kali Linux is pretty easy. You can still use the root/root credentials
    as needed. You can see in Figure 14.16, the commands to add a user and password
    are simply useradd -m nt -G -s /bin/bash and passwd nt, respectively.


    You might want to change your name or initials, not (even though mine are pretty
    awesome considering I''m in IT). Cognizant of using any information or credentials
    that someone else could use uselessly. Another way to disable the screen lock
    feature. The easiest and fastest way is to navigate the menu to the left of bottom.
    of dots, which is your'
