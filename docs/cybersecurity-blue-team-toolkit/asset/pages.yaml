- pgno: 176
  md: '# 166 Chapter 12  Patch and Configuration Management


    Goon at DefConf, says that in her experience of small to medium businesses, only
    one business in five has a well-documented patch-management policy in place. That''s
    not good.


    Patch management is a vital area of systems management. As your security model
    matures, it becomes necessary to develop a strategy for managing patches and upgrades
    to systems and software. Most software patches are necessary to fix existing problems
    with software that are discovered after the initial release. A great majority
    of these are security focused. Other patches might have to do with some type of
    specific addition or enhancement to functionality of software. As you see in Figure
    12.1, the patch management lifecycle is similar to the vulnerability management
    lifecycle I discussed in Chapter 4, “OpenVAS: Vulnerability Management.",


    ![](img/e8e965b6c3537819be0d570febb3fc1d_176_0.png)


    Figure 12.1: The patch management lifecycle


    # Patch Management


    I believe there are two deadly attitudes in cybersecurity: “This is how we have
    always done it and “It will never happen to me.” On March 14, 2017, Microsoft
    issued a critical security bulletin for the MS17-010. This vulnerability, nicknamed
    EternalBlue, was an exploit written by the National Security Agency (NSA) and
    was leaked to the general public by the Shadow Brokers hacker group one month
    later. EternalBlue exploits a Microsoft SMB vulnerability and, in short, the NSA
    warned about the theft of the exploit allowing the company to prepare a patch.
    Too many people did not install the patch, and in May of the same year, the WannaCry
    ransomware virus used the EternalBlue exploit'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Chapter 12 = Patch and Configuration Management 167


    to infect the vulnerable systems. More emergency patches were released by Microsoft.
    Again, many people did not patch, and in June, NPetyya malware swamped the globe,
    focusing on the Ukraine in June 2017.


    Have you watched a horror movie and thought to yourself, "That was your first
    mistake… was your second… and third..." If organizations had been paying attention
    in March, which would have been fine. If they had paid attention in April, would
    they have learned how to circumvent the exploit. Again, in May and then in June,
    patches could have been run and problem averted. The exploit is still a problem
    today and has morphed into many variants, targeting the cryptocurrency industry
    with malware WannaMine. Cryptjacking is a term we use to define the process where
    malware silently infects a victim''s computer and then uses machine''s resources
    to run complex decryption routines that Monero is a cryptocurrency that can be
    added to a digital wallet and spent. It feels harmless, thinking back to the CIA
    triad, you are losing your CPU and RAM resources to the malware, and it can spread
    across your network. If you think of the volumes of processing power and bandwidth
    it will consume in your organization, you definitely dont want this infect.


    The lesson learned is that we must keep our systems up-to-date. In your patch
    management program, you will have to include operating system patches and updates
    for Microsoft, Apple, and Linux as well as third-party applications such as Chrome,
    Firefox, Java, and Adobe Flash. You may have other software or firmware on your
    network. If you have with software, you must have security policy outlining when
    to patch systems. If you take the risk of not patching, you will leave your systems
    vulnerable to an attack that is preventable.


    The patch management lifecycle will start with an audit where you scan for needed
    patches. After you know which patches are needed and you roll out those patches
    to the entire organization, test patches on a nonproduction system. If you do
    not, you take the risk of breaking something with what should have fixed it. If
    you are able to identify issues before a global rollout, your operations should
    not be impacted. Once you know what patches are missing and which patches are
    viable, install them on the vulnerable system. Most of the time, this is done
    with Windows Update. Most enterprise-sized organizations will use some type of
    patch management software solution.


    Focusing on your most vulnerable systems like those running Windows operating
    systems, as well as highly vulnerable third-party programs like Adobe Flash, Adobe
    Reader, and Java, is one of patch management''s key concepts. Starting with your
    most risky yet mission-critical devices allows you to allocate time and resources
    where they will be best utilized and provide the most risk mitigation.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# 168 Chapter 12 » Patch and Configuration Management


    Depending on the size of your organization, how many people you have on your cybersecurity
    team, the hours they can devote to patch management, and how many systems need
    to be kept up-to-date, you may want to utilize third-party patch management software.
    For Microsoft patching specifically, Microsoft includes a tool called Windows
    Update Services (WSUS) with all Windows Server operating systems. WSUS may be
    insufficient, unless you are using third-party applications like Adobe Flash or
    Java. I have used and like the ease of deploying DesktopCentral by ManageEngine.


    ManageEngine DesktopCentral is web-based, desktop management software. You can
    remotely manage and schedule updates for Windows, Mac, and Linux, but in local
    area networks and across wide area networks. In addition to patch management,
    software installation, and service pack management, you can also use it to standardize
    desktops. You can use it to keep your images central and synchronized by applying
    the same wallpapers, shortcuts, settings, and much more.


    DesktopCentral is free for small businesses and supports one technician across
    25 computers and 25 mobile devices. Its professional and enterprise versions make
    it scalable as your business grows. The free edition still gives you access to
    all the essential features of the software, and it is easy to set up. In 12.1,
    you''ll be installing DesktopCentral by ManageEngine.


    LAB 12.1: INSTALLING DESKTOP CENTRAL


    +   1. Browse to https://www.manageengine.com. In the upper-right corner of the
    screen, open the search field by clicking the magnifying glass. Type Desktop Central.
