    18 zeros after the 1.


    Some of these logs are routine, and some indicate poor network health. Log file
    contains a wealth of information to reduce exposure to intruders, malware, and
    legal issues. Log data needs to be collected, stored, analyzed, and monitored
    to meet and report on regulatory compliance standards such as HIPAA, FISMA, FERPA,
