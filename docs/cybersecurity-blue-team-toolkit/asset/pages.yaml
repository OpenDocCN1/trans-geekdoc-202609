  md: '# Chapter 14  Kali Linux


    The more command allows you to page down line by line through this file.

    Once you''re out 80 to 85 percent down the page, you should see what''s shown

    in Figure 14.32.


    ```

    # If set to MD5, MD5-based algorithm will be used for encrypt password

    # If set to SHA256, SHA256-based algorithm will be used for encrypt password

    # If set to SHA512, SHA512-based algorithm will be used for encrypt password

    # If set to AES, AES-based algorithm will be used for encrypt password (default)

    # Overrides the MD5 CRYPT ENAB option


    # Note: It is recommended to use a value consistent with

    # the PAM modules configuration.


    ENCRYPT_METHOD SHA512


    # Only used if ENCRYPT_METHOD is set to SHA256 or SHA512.

    -- (186)--

    ```


    Figure 14.32: Kali Linux using Encrypt_Method SHA512


    Now you can put all the puzzle pieces together. Make a copy of your hashes

    in a separate file by using the following cp command:


    ```

    cp /etc/shadow hash.lst

    ```


    To make sure that it worked, type the following:


    ```

    More hash.lst

    ```


    To prepare this file for cracking, you need to remove everything but the hashes.

    Open the hash.lst file with edit or vim and delete all the usernames and the

    colon. Remove the ending columns too. Now the file is only the raw hash itself.

    To crack these hashes, I used the following:


    ```

    hashcat -m 1800 -a 0 success.txt -remove hash.lst

    /usr/share/sqlmap/txt/wordlist.txt

    ```


    where


    +   - m 1800 is the type of hash I''m cracking.

    - a 0 is a dictionary attack.

    - o success.txt is the output file.

    - remove says delete the hash after it was cracked.

    - hash.lst is the input file.

    - /usr/share/sqlmap/txt/wordlist.txt is the path to the wordlist.


    Open your success.txt file. It took me over 10 minutes to get the

    acked passwords. If you have issues, try running the command again

    a --force at the end. If it doesn''t work, you may have to give the Kali Linux

    box a few more than the default resources.'
  merge: -1
  img_proc: true
