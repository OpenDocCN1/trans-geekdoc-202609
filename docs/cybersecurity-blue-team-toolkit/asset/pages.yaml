- pgno: 126
  md: '# Chapter 9 | Managing Logs 115


    ![](img/e8e965b6c3537819be0d570febb3fc1d_126_0.png)


    **Figure 9-7:** Elevated command prompt prompting on security audit logs


    After you have collected the logs you need and so you do not fill up all the storage
    on your asset, do not forget to run the following command:


    ```

    Auditpol /set /Category:System /failure:disable

    ```


    Searching logs using PowerShell has an advantage over Windows Event Viewer. You
    can check for events on remote computers quicker, which is extremely valuable
    if you do server management. There is no need to physically connect to a computer
    to collect the logs. By using the PowerShell parameter -ComputerName, you can
    connect and pass a command to the remote computer you choose and select the information
    you want. If you want to pull all system logs off the computer named PCI, you
    can do so using the following command:


    ```

    Get-EventLog -ComputerName PCI -LogName System

    ```


    One of the integral parts of understanding these logs and their access to remote
    regions of your network is your IP address. The Internet has run out of IPv4 addresses,
    and the landscape of the Internet is constantly evolving. IPv4 is the technology
    that allows us to connect our devices to the web with a unique, numerical IP address
    consisting of 4 octets separated by a decimal with no number over 255. It looks
    like 192.168.1.0. Sending data from one computer to another and generating logs
    while doing so on an IP address on both devices.


    But we are in transition. With many applications and with the evolution of the
    Internet of Things (IoT), we are starting to see and more IPv6 addresses in our
    logging. Google collects statistics surrounding IPv6 adoption globally, and the
    latest numbers indicate that more than 25 percent of Google accesses their resources
    with IPv6. For home users and small businesses, this may take another few years
    to become an issue, but nearly all modern devices support this new technology.


    What you will see in your logs will be a local network IPv6 address of 128 bits
    instead of an IPv4 address. IPv6 is represented in hexadecimal as opposed to dotted
    decimal, and the numbers are grouped together in groups of four instead of groups
    of three. There are some short techniques. For example, if the IPv6 address has
    a group of 0000, it will display as ::. Be aware, if you ever start to see your
    source address of your logs displaying 32 hexadecimal characters instead of your
