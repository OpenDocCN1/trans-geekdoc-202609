- pgno: 157
  md: 'The default DVWA username is admin, and the default password is pass-word.
    Once you''re inside the DVWA, you have the option of choosing different vulnerabilities
    and then using this tool to learn about each vulnerability and attempting to compromise
    the web application with that vulnerability.


    For example, one of the vulnerabilities is SQL injection (SQLi). SQLi is a technique
    often used to attack data-driven applications using code injection. This is done
    by including portions of the SQL statement in an entry field in attempt to get
    the website to pass new commands to the database. The vulnerability occurs when
    user input is not valid and is unexpectedly executed. A well-known attack against
    websites, but it can be used to attack any type of MySQL, MSSQL, or PostgreSQL
    database. To learn how to create the rogue SQL commands, just use the DVWA to
    experiment.


    # Meterpreter


    The discovery scan by Metasploitable is not as robust as the scan you will get
    from your vulnerability management program. If you still have Nppose Community
    installed, launch a vulnerability scan using the full audit template against the
    Metasploitable2 machine. List of possible exploits you can use may include that
    give you a shell on a system.


    A successful exploit can give you access to a target system in a multitude of
    ways. The premier choice of access is a meterpreter shell. A command shell is
    nice, and PowerShell is even nicer, but until you have experienced perfect red
    team bliss. No one for-gets or her first meterpreter shell. Teaching Metasploit
    for the past couple of years, I have had students astonished when they see the
    power embedded in a meterpreter shell on a compromised system. You can steal hashes
    of passwords, take screenshots, explore hard drives, escalate privileges, and
    ultimately drop a proxy to explore the rest of the network undetected. You literally
    have the SSH keys to the kingdom.


    Meterpreter is a proprietary Metasploit payload that gives you an interactive
    shell in memory. You do not execute it on a drive. There are no remnants in logs,
    and it is extremely difficult to be detected by anyone watching-tasks running
    on a device. You are running a service on the compromised machine, and one of
    the unique features of this shell is you can hop from one service to another to
    remain undetected. Meterpreter offers the usual command-line interface, including
    command history and table completion.'
