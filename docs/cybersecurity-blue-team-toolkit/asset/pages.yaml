  md: '# Chapter 2 Troubleshooting Microsoft Windows 21


    file by default. If customers/employees having an IT issue, they can easily email
    this file with all the contents for you to examine the issue. When you open the
    .zip file, you''ll notice the file type is MHTML. You can right-click and open
    this file type with Word and edit until it reads exactly as you want it to for
