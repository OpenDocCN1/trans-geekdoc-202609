  md: '# Chapter 15 = CISv7 Controls and Best Practices


    specific CVE. Finally, https://cve.mitre.org/ is an extremely valuable resource
    for a list of entries containing an identification number, a description, and
    a reference for every publicly known cybersecurity vulnerability. I normally check
    in these sites once to a week to see what is out there.


    # Controlled Use of Administrative Privileges


    Have you noticed that the critical controls are following a logical progression?
    As you gradually improve your security posture, they layer on top of each other.
    Now that you know what you have and what''s on those machines, including vulnerabilities,
    you need to control who has access to those machines.


    One of my penetration tester''s story is a phishing campaign launched against
    a service department where six people clicked the link in the email, and two of
    the six were logged into their administrators account when they clicked and were
    compromised in 22 seconds. Within hours, the entire network belonged to the pen
    tester. You have to control who has administrative privileges and how those administrators
    use their credentials. When you are logged in as an admin, you should not be opening
    your email under circumstances. This is what your user account is.


    Two common attacks rely on privilege to execute. That is one reason CVSS assesses
    privilege is necessary for exploitability. The first type of an attack is the
    one I described previously where a user with elevated credentials opens a malicious
    attachment. The other is the elevation of privilege when cracking a password for
    an administrator. If the password policy is not enforced, the danger increases
    exponentially.


    Educate your leadership and help create a robust security posture where you restrict
    admin privilege. Your IT admins make a list of the tasks that they do on an average
    day. Check the tasks that require administrative controls. Create an account for
    normal tasks that all users can do and use the admin account for only those tasks
    where it''s necessary. If you ensure executives are not using admin privilege,
    remember that they are the ones that hackers are targeting.


    Microsoft has guidance on implementing least privilege. For Linux, each sysadmin
    should have a secure account and use the sudo by disabling sudo. You should also
    change all default passwords on all assets in your environment and making sure
    that each password is as robust as possible. Use multifactor authentication and
    configure systems to issue an alert if an admin mistypes or her password.


    The most secure admin I personally used on a military network. My password was
    at least 16 characters, uppercase, lowercase, special characters, and could not
    spell anything in Merriam Webster''s dictionary. I also had a lockout policy of
    one missed password. I was logging into upwards of 40 to 80 machines multiple
    times a day. If I locked myself out, I was basically in limbo for the rest of
    the day because I had to call the help desk to have reset my password, which could
    take hours. That might be an extreme for the'
  merge: -1
