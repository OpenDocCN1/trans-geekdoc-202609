- pgno: 16
  md: '# CHAPTER 1


    # # Fundamental Networking and Security Tools


    **WHAT YOU WILL LEARN IN THIS CHAPTER:**


    +   * Ping

    * IPConfig

    * Tracerert

    * NSLookup

    * NetStat

    * PuTTY


    Before heading off to the cybersecurity conference Black Hat in Las Vegas, a friend
    of mine, Douglas Brush, posted on his LinkedIn page a warning for other InfoSec
    professionals. He said, “Don’t go to these events to buy curtains for the house
    when you don''t have the concrete for the poured foundation yet.”

    Too many in the years I''ve been in information technology (IT), I have seen people
    forget they need the basics in place before they try to use shiny new tools. Before
    you use any new tools, you must have a foundation to build upon. In IT, these
    tools are fundamental. They are a must for any computer/InfoSec/analyst to know
    how to use and when to use them. It''s rather impressive when a manager who is
    nontechnical asks you to ping that asset, run a tracer, and discover the physical
    and logical addresses of the web server that is. Sometimes they do speak your
    language!


    # ## Ping


    Ping will make you think of one two things. If it makes you think of irons and
    drivers and 18 hours of beautiful fairway, then you are definitely CIO/'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Chapter 1 Fundamental Networking and Security Tools


    CEO/CISO: It. If you think of submarines or bats, you''re probably geekier like
    me.


    Packet Internet Gener, or what we affectionately call ping, is a networking utility.
    It is used to test whether a host is "alive" on an Internet Protocol (IP) network.
    A host is a computer or other device that is connected to a network. It will measure
    the time it takes for a message sent from one host to reach another and echo back
    to the original host. Bats are able to echo-location, or bio sonar, to locate
    and identify objects. We do the same in our networked environments.


    Ping will send an Internet Control Message Protocol (ICMP) request to the target
    and wait for a reply. This will report problems, trip time, and packet loss if
    the asset has a heartbeat. If the asset is not alive, you will get back an ICMP
    error. The command-line option for ping is easy to use no matter what operating
    system you are using and with multiple options such as the size of the packet,
    how many requests, and time to live (TTL) in seconds. This field is decremented
    at each machine where data is processed. The value in this field will be at least
    great as the number of gateways has to hop. Once a connection is made between
    the two systems, this could test the latency or the delay between them.


    Figure 1.1 shows a running ping on a Windows operating system sending four requests
    to google.com using both IPv4 and IPv6.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_17_0.png)'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Chapter 1 Fundamental Networking and Security Tools


    What this figure translates to is that my computer can reach through the network
    and touch a Google server. The www.google.com part of this request is called a
    resource locator (URL). A URL is the address of a page on the World Wide Web (WWW).
    The numbers you see to the URL is called an IP address. Every device on a network
    must have a unique IP network address. If you are attempting to echo-locate another
    host, you could substitute the www.google.com for an IP address. We will do a
    deeper dive into IPv4 and IPv6 in Chapter 9, Log Management.


    There are more granular ping commands. If you type ping along with an option or
    switch, you can troubleshoot issues that might be occurring in your network. Sometimes
    these issues are naturally occurring problems. Sometimes they could signal some
    sort of attack.


    Table 1.1: shows different options you can add to the base command ping.


    | OPTION | MEANING |

    |---|---|

    |/? | Lists command options. |

    |-t | Pings the host until stopped with Ctrl+C ping -t is also known as the ping
    of death. It can be used as a denial-of-service (DoS) attack to cause a target
    machine to crash. |

    |-a | Resolves address to hostname |

    |-n count | How many echoes to request from 1 to 4.2 billion. (In Windows operating
    systems, 4 is the default). |

    |-r count | Records route for count hops (IPv4 only). The maximum is 9, if more
    than 9, tracerert might work better (covered later in the chapter). |

    |-s count | Timestamp for count hops (IPv4 only). |

    |-i TTL | Time to live; maximum is 255. |


    Did you know that could ping yourself? Figure 1.2 shows that 127.0.0.1 is a special
    IP address. It is traditionally called a loopback address. When you ping this
    IP address, you are testing your network system to make sure it is working properly.
    If this IP doesn''t return an appropriate response, you now know the problem is
    with your system, not the network, the Internet service provider (ISP), or your
    target URL.


    ```

    C:\windows\system32>ping -a 127.0.0.1

    PINGING DESKTOP-BUBNZVK [127.0.0.1] with 32 bytes of data:

    Reply from 127.0.0.1: bytes=32 time=<1ms TTL=128

    Reply from 127.0.0.1: bytes=32 time=<1ms TTL=128

    Reply from 127.0.0.1: bytes=32 time=<1ms TTL=128

    Reply from 127.0.0.1: bytes=32 time=<1ms TTL=128

    Statistics for 127.0.0.1:

    Packets: Sent = 4, Received = 4, loss = 0 (%)

    Approximate round time in milliseconds:

    Minimum = <1ms, Maximum = <1ms, Average = <1ms

    ```


    Figure 1.2: pinging a loopback address'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 4 Chapter 1 Fundamental Networking and Security Tools


    If you are experiencing network difficulties, this is the first tool to pull out
    of your toolkit. Go ping yourself and make sure everything is working as it should
    (see Lab 1.1).


    | LAB 1.1: PING |

    | 1. Open a command prompt or a terminal window.

    | 2. Type `ping -t www.example.com` and then press Enter. (You can use another
    URL or hostname of your choice.)

    | 3. After a few seconds, hold the Ctrl button and press C (abbreviated as Ctrl+C
    in subsequent instructions in this book.)

    | 4. When the command prompt returns, type `ping -a 127.0.0.1` and press Enter.|


    What is the name of your host? As you can see in Figure 1.2, mine is DESKTOP-OU8N7VK.
    A hostname is comprised of alphanumeric characters and possibly a hyphen. There
    may be times in the future you know an IP address but not the hostname or know
    hostname but not the IP address. For certain troubleshooting steps, you will need
    to be able to resolve the two on a single machine.


    # IPConfig


    The command ipconfig is usually the next tool that you will pull out of your toolbox
    when you''re networking a system. A lot of valuable knowledge can be gleaned from
    this tool.


    Internet Protocol is a set of rules that govern how data is sent over the Internet
    or another network. Routing function essentially creates the Internet we know
    and love.

    IP has the function of taking packets from the source host and delivering them
    to the proper destination host based on the IP addresses in a packet. The data
    being sent has two parts: a header and a payload. The header has the information
    to get the information where it should go. The payload is the stuff you want the
    other host to have.

    In Lab 1.2, you''ll use the `ipconfig` command.


    | LAB 1.2: IPCONFIG |

    | 1. Open a command prompt or a terminal window.

    | 2. Type ipconfig and press Enter if you are on a Windows system. If you are
    on Linux, type ifconfig.

    | 3. Scroll through your adapters and note the ones that are for Ethernet or Wi-Fi
    or Bluetooth.|'
  merge: -1
  img_proc: true
