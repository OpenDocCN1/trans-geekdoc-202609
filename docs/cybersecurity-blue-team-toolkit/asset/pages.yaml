- pgno: 183
  md: '# Chapter 12 = Patch and Configuration Management 173


    The time between the discovery of a vulnerability and the action IT administrator
    should take to protect the environment from that vulnerability should be as short
    as possible, especially on assets that are mission critical. That philosophy possibly
    cause issues where rapid patch management causes a problem with change management
    and quality assurance testing. It will be a balance evaluating the risk of an
    unpatched system with the possibly breaking systems in the process of fixing it.
    Creating a patch management program where you document your strategy for establishing,
    documenting, and maintaining the changes is the beginning. The next level in your
    security maturity model should be configuration management. You must have a hardened
    baseline.


    # Configuration Management


    2010, I was hired for a Department of Defense (DoD) contract to help deploy the
    technical assets for the newly formed Air Force Global Strike Command (AFSC) with
    Lt. General Klot in command. The AFSC mission was to manage the U.S. Air Force
    (USAF) portion of the U.S. nuclear arsenal. With a newly formed team of 10, the
    decision was made to split the team based on our strengths, and I ended up in
    the lab with someone who was become one of my very best friends, newly retired
    Master Sergeant Robert Bills. He is the type of IT guy who does IT for the fun
    of it. His call in the lab was Crazy Vista because sometimes solving the problem
    was so obvious it was.


    When we walked into the lab, the process was to take a Windows XP, Windows Vista,
    or Windows 7 .iso of an operating system, burn it to a DVD, and image a single
    machine. After imaging, joining to the domain, adding the appropriate software,
    and forcing group policy on the system, it could take 7 to 10 days to get one
    machine ready for the end user. Over the next two years, we developed a system
    using master images, an old 40-port Cisco switch, and a whole lot of cable to
    scale down the deployment process to about 45 minutes per machine with a hardened
    image built specifically for the division it intended for.


    Some administrators refer to a golden image as a master image that can be to clone
    and deploy other devices consistently. System cloning is an effective method of
    establishing a baseline configuration for your organization. It requires effort
    and expertise to establish and maintain images for deployment. However, the ability
    to push a tested and secure system image to your devices can save countless hours
    per tech refresh. In fact, our images were so good, the other technicians in other
    divisions would take them to the field to reimage machines that were having issues
    rather than troubleshoot the problem. It took less time to image than to fix them.'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'To start this process in your organization, build an inventory of every server,
    router, switch, printer, laptop, desktop, and mobile device in your environment
    that is going to be connected to the network using some of the tools we have already
    explored. Ideally, the inventory list should be dynamically and automatically
    managed. Manually entering an inventory list into a spreadsheet is not scalable
    and opens up opportunities for human error. This should include the location,
    hostname, IP address, MAC address, and operating system. For servers, identifying
    the function and services running on those systems is also helpful.


    After you have an inventory of systems, you need to configure the image you will
    use in the future for all servers and workstations. I have worked with small to
    medium businesses whose idea of providing a laptop for a new user is to order
    from New Egg, open the box, hand the new employee the machine, and let him or
    her set it up. If you accept the default options on a Windows machine, how many
    vulnerabilities are sitting there out in the open?


    Security is about balance. Considering the CIA triad, use caution when securing
    a workstation. Some organizations lock down their systems so they make it difficult
    for end users to do their job. Some organizations do nothing to preconfigure a
    system and leave themselves vulnerable. There are a couple of free tools you can
    use to compare a configuration to a predetermined template.


    Microsoft has a Security Configuration and Analysis tool that is free. It is a
    standalone snap-in that users can import one or more saved configurations. Importing
    configurations builds a specific database that stores a composite configuration.
    You can apply this composite configuration to the computer and analyze the system
    configuration against the base-line configuration stored in the database. These
    configurations are saved as text-based .inf files.


    In Lab 12.3, you''ll be adding the Security Configuration and Analysis (SCA) tool
    to a Microsoft Management Console (MMC).


