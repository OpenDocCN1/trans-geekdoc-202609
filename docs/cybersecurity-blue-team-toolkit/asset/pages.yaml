- pgno: 214
  md: 'enough, Kali is the Hindu goddess who brings the death of the ego. I think
    this software is aptly named.


    We have examined many tools throughout this book, and now we''ve reached one of
    my favorites. Some of the tools in Kali have entire chapters devoted to them in
    this book, such as Metploit Framework, Nmap, Wireshark, and Burp. The best way
    to master any skill or tool is hands-on. One method you could take is to load
    these tools on your computer and use them to examine your personal systems. That
    is a great introduction, but it doesn''t scale well. Most of us don''t have many
    systems in our private network and may not be able to fully realize the usefulness
    of these tools. You could use these tools to examine Google or Yahoo! or some
    other production system out on the Web, but the major problem with doing that
    is you don''t have permission to do it. It could get you into a lot of legal trouble.
    Another alternative, and the one I use the most, is to use virtualization.


    # Virtualization


    Virtualization is a technology that system administrators have been using in datacenters
    for years, and it is at the heart of cloud computing infrastructure. It is a technology
    that allows the physical resources of a computer (CPU, RAM, hard disk, graphics
    card, etc.) to be shared by virtual machines (VMs). Consider the old days when
    a single physical hardware platform—the server—was dedicated to a single-server
    application like being a web server. It turns out that a typical web application
    server didn''t utilize much of the underlying hardware resources available to
    it on the server. For purposes of this discussion, let''s assume that a web application
    running on one of our physical servers utilized 30 percent of the hardware resources.
    That meant 70 percent of the physical resources were going unused; thus, the server
    was underutilized.


    With virtualization, we could now install three servers by utilizing 30 percent
    of the physical hardware resources of the server. We are now utilizing 90 percent
    of the physical hardware resources of the server, which is a much better return
    on our investment in the server. We will be using this technology to help us master
    the tools discussed in this chapter. By installing virtualization software on
    your computer, you can create VMs that can be used with the tools discussed. The
    rest of this chapter is concerned with just that.


    Let''s first define some of the proper vocabulary:

    A hypervisor is the software that is installed on a computer that supports virtualization.
    It can be implemented as firmware, which is specialized hardware it could also
    be hardware with installed software. It is within the hypervisor that the VMs
    will be created. Examples of hypervisor software allocate the underlying hardware
    resources to the VMs. VMware Workstation and Oracle''s VirtualBox. There are free
    versions of each of these hypervisors that you can download and use as we did
    in Lab 10.4 in Chapter 10, "Metasploit."'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Chapter 14 ■ Kali Linux 207


    There are two types of hypervisors. Type 1 hypervisor runs directly on the bare
    metal of a system. Type 2 hypervisor runs on a host operating system that provides
    virtualization services. In our lab, you will be setting up a Type 2 hypervisor
    in the first lab of this chapter.


    A virtual machine is a machine that is created on the hypervisor. It will have
    its own operating system and be allocated physical hardware resources such as
    CPU, RAM, hard disk, etc. Various network resources can also be allocated to each
    VM.


    The host operating system is the operating system of the computer the hypervisor
    is installed on.


    The guest operating system is the operating system of the VM that remains within
    the hypervisor.


    For example, I have a tower computer with an Intel i7 processor, 32 GB of RAM,
    and multititerabytes of hard disk space running Windows 10 Pro as my host operating
    system. I also have VMware Workstation Pro as my hypervisor with multiple VMs
    loaded in it, like Kali Linux and Metasploitable2. Linux is the guest operating
    system of both these instances.


    Before you start this, you need to make sure that the computer you plan to use
    for virtualization can support the VMs you intend to load on it as well as its
    operating system. Table 14.1 lists the requirements for Windows 10, Ubuntu Linux,
    and Kali Linux.


    Table 14.1: Resource requirements for Windows 10, Ubuntu, and Kali Linux


    | RESOURCE | WINDOWS 10 | UBUNTU LINUX | KALI LINUX |

    | --- | --- | --- | --- |

    | Processor | 1 GHz or faster | 2 GHz dual-core processor | CPU supplied by at
    least one of the AMD64, i386, armel, armhf, or arm64 architectures |

    | RAM | 1 GB for 32 bit 2 GB for 64 bit | 2 GB | 2 GB |

    | Hard drive space | 16 GB for 32 bit 32 GB for 64 bit | 25 GB | 20 GB |

    | Graphics card | Direct 9 or later with WDDM 1.0 driver | | |

    | Display | 800x600 | 1024x768 | |


