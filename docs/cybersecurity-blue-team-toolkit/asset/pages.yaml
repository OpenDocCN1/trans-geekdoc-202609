- pgno: 112
  md: '# Chapter 8 Access Management 101


    Do an audit of privilege on a regular basis. It is operational. Who has access
    to what, and who has changed jobs and retained access to their old permissions?
    This is not a one-and-done exercise.


    Start every account as low as possible. Only add higher permissions as needed/requested
    and only for the time needed. An auditor may need elevated privileges but only
    for the duration of the audit.


    Separation of duties (SoD) is a strategic function of least privilege. You have
    one person write the code and one person sign the check. By having more than one
    person accomplish a task, it can help prevent fraud or errors. The Group policy
    story earlier, was part of that process. If the employee followed procedures for
    change management, I could have told him why it was a really bad idea.


    By implementing least privilege, you can improve operational performance, reduce
    the chance of unauthorized behavior, reduce the attack surface, and reduce the
    chances of malicious software propagating that might need elevated processes to
    run. One of the biggest benefits of implementing least privilege is that it makes
    it easier to meet compliance requirements. Many compliance regulations such as
    PCI-DSS, HIPAA, FISMA, and SOX require that organizations apply privilege to ensure
    proper data management and security.


    The Federal Desktop Core Configuration requirements by the National Institute
    of Standards and Technologies (NIST) say that federal employees must log into
    PCs with standard privileges. PCI-DSS 3.0.7.2 requires assignment of privileges
    to individuals based on job classification and function.


    # Single Sign-On


    Working in our modern-day environments requires us to log into multiple programs
    to get our jobs done. We have to log into customer management databases, share
    resources in cloud applications, check email, and create documentation online.
    It can be a headache for the average user to remember all these usernames and
    passwords. To alleviate this, we use sign-on (SSO) applications. SSO is another
    form of access control between multiple, interrelated software systems.


    Benefits of single sign-on can include the reduction of password fatigue or having
    users write their passwords on sticky notes and put them on their monitor or over
    the keyboard. It can save time typing in passwords over and over and ideally reduce
    helpdesk issues of people calling because they were on vacation and forgot their
    password and locked themselves out. One of the biggest criticisms of SSO is the
    access to many different resources from just one.'
  merge: -1
  img_proc: true
