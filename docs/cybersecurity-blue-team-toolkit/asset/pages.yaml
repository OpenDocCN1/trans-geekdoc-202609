- pgno: 57
  md: 'you know what assets you have to protect, you have to be able to assess assets
    for vulnerabilities. It is a cyclic endeavor, as shown in Figure 4.1.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_57_0.png)


    **Figure 4.1:** The vulnerability management lifecycle


    In the discovery phase, you have to figure out what is on your network communicating
    to other devices. You cannot protect what you don''t know you have. Once you''re
    able to map out the assets, hosts, nodes, and intermediary devices on your network,
    then you''re able to move to the next step.


    Not all devices are created equal. A domain is a group of computers and other
    devices on a network that are accessed and administered with a common set of rules.
    A Windows domain controller (DC) is a Microsoft server that responds to login
    authentication requests within a network. In an enterprise environment, if a DC
    fails, your help desk will explode with calls because of the inability for users
    to log in the domain. However, if you have a marketing department with a small
    file server that it backs up once a month, if this machine fails, it might warrant
    a phone call or two. After you know which machines exist on your network, you
    must prioritize which assets are mission critical.


    Once you have identified assets which have a heartbeat and you know which assets
    would cause chaos through failure or compromise, the next step is to determine
    the assets'' ''vulnerabilities.'' This is usually accomplished by analyzing the
    operating system, ports that are open, services running on those ports, and applications
    you have installed on those assets.


    Now you''re ready to build a report. Some reports will bubble up to require information
    such as trending analysis and vulnerability remediation plans. The decisions that
    upper management will make based on these reports could be budgetary or based
    on head count. The more'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Chapter 4 = Vulnerability Management 45


    technical reports usually trickle down to the asset owner and contain what needs
    to be fixed on that device.

    With the report in hand, you now have a list of vulnerabilities in your environment
    and on what device they reside. Some software with advanced capabilities will
    generate instructions on how to remediate these vulnerabilities.

    Most of these technical reports will give you a severity rating typically based
    on the Common Vulnerability Scoring System (CVSS), as listed in Table 4.1. The
    National Institute of Standards and Technology (NIST) maintains the National Vulnerability
    Database (NVD). In this database, you can get a quantitative analysis of every
    vulnerability by access vector, complexity, and authentication as well as the
    impact to confidentiality, integrity, and availability. Basically, it means every
    vulnerability will have a score of 0 to 10, with 0 being good and 10 being horrendous
    awful.


    Table 4.1: CVSS v3.0 Ratings


    | SEVERITY | BASE SCORE RANGE |

    |---|--|

    | None | 0 |

    | Low | 0.1–3.9 |

    | Medium | 4.0–6.9 |

    | High | 7.0–8.9 |

    | Critical | 9.0–10.0 |


    Source: National Institute of Standards and Technology


    In the vulnerability management lifecycle, building your remediation attack plan
    is a critical step. After completing the asset classification and vulnerability
    assessment, you correlate the findings to compile your plan of action. There are
    some organizations I have worked with that have the goal of becoming 100 percent
    free of vulnerabilities, and that isn''t a realistic goal to have in our modern
    digital infrastructure. If you have devices connecting and communicating to the
    world, there is a way into your network and way out. On-critical devices, prioritize
    the repair of critical and high-severity vulnerabilities. Save the less critical
    devices to be remediated later.


    There is nothing more frustrating than taking apart a PC, fixing what you think
    is the problem, putting that PC completely back together, and then realizing you
    didn''t fix it and having to start over. Verification is vital to this process.
    If you do not recount assets looking for the same vulnerability and assume your
    fix worked but it didn''t, you will have a false sense of confidence in that item
    and leave yourself open to attack.


    It been my experience that the IT industry is one of the most dynamic, with constant
    change and evolution. There will be times in an enterprise environment that risky
    behavior will happen when change management processes'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'and procedures are not followed. Our networks are constantly changing and evolving.
    The networking infrastructure staff throws a new server with no patches on the
    domain because the people who requested it have the authority to bypass security
    controls. There are people in the DoD with enough brass on their shoulders to
    ask something like this without understanding the repercussions. Those assets
    still need to be scanned, and if they''re not scanned before being added to your
    network, you get to scan them after.


    Some organizations I have worked with compliance needs that require they scan
    monthly. Some organizations have a robust security policy where they require assets
    to be scanned at least once a week. Either way, vulnerability scanning is not
    just a one-time action. It is something that needs to be maintained to ensure
    your network/infrastructure is secure.


    # OpenVAS


    The Open Vulnerability Assessment System (OpenVAS) is an open-source framework
    of several tools and services that offers powerful vulnerability scanning and
    management systems. It was designed to test networked devices, accessible ports,
    and services for vulnerabilities. It is a competitor to the well-known Nexpose
    or Nessus vulnerability scanning tool. Analyzing the results from tools like this
    is an excellent first step for an IT team working to create a robust, fully developed
    picture of their network. These tools can also be used as part of a more IT platform
    that regularly assesses a corporate network for vulnerabilities and alerts professionals
    when a major change or new vulnerability has been introduced.


    At the center of this modular-service-oriented product is the OpenVAS scanner,
    sometimes called an engine. The scanner uses the Network Vulnerability Tests (NVT)
    maintained by Greenbone Networks in Germany. Greenbone Networks was founded by
    experts for network security and software in 2008 and provides an open-source
    solution for analyzing and managing vulnerabilities, assessing risk, and recommending
    an action plan. According to the OpenVAS website, there are more than 50,000 NVTs,
    and this number is growing weekly.


    The OpenVAS Manager is the actual manager of the processes, controlling the scanner
    using OpenVAS Transfer Protocol (OTP) and OpenVAS Management Protocols (OMP).
    The Manager component schedules and manages the generation of reports. The Manager
    runs on a SQL database where all the scan results are stored. The Greenbone Security
    Manager (GSM) web interface is the easiest alternative to the command-line client
    to control the scanner, schedule scans, and view reports. Once you have OpenVAS
    installed, you will log in through the Greenbone Security Assistant, as shown
    in Figure 4.2.'
