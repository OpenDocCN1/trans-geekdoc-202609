- pgno: 29
  md: '# PuTTY


    Up until now, the tools discussed are embedded in your operating systems. This
    tool will require a little more effort on your part. PuTTY is a free, open-source
    terminal emulation, serial console, and network transfer program. Originally written
    for Windows, it can be used with other operating systems. PuTTY is an amazingly
    versatile tool that allows you to gain secure access to another computer and is
    most likely the highly used SSH client for the Microsoft Windows platform.


    I believe that IT professionals who have been in the industry for a while lose
    track of where we have been. We keep adding knowledge and experience to our repertoire
    and touch, "Everyone should know that." As an educator, I am not allowed to do
    it. My job is to show you how to use all these shiny things in your tool. I can
    hear some people saying, "You had me until SSH!"


    Secure SSH is a network protocol for creating an encrypted channel over an unencrypted
    network. The Internet is unsecured. You don''t want your data out there in the
    Web hanging freely for all to see! SSH provides a administrator with a safe way
    to reach a system that is remote using strong authentication and secure, encrypted
    data transmission. There have been times as an administrator when part of my responsibilities
    were to manage computers I could not reach or physically touch—execute commands
    or moves from one computer to another. SSH is the protocol most hosts support.
    An SSH server, by default, will run on TCP port 22.


    As mentioned earlier in this, SSH creates an encrypted channel to communicate
    over. The first version of SSH debuted in 1995. Brad Pitt was the Sexiest Man,
    Mel Gibson''s Braveheart won Best Picture, and Match was new and the only online
    dating site. A lot... and I mean has changed since then. Over the years, several
    flaws were found in SSH1, and it is no longer used. The current SSH2 was adopted
    in 2006 and uses a stronger encryption algorithm to improve security. As of yet,
    there are no exploitable vulnerabilities in SSH2, although there have been rumors
    that the National Security Agency (NSA) may be able to decrypt SSH2 traffic.


    In Lab 1.6, you will use PuTTY.


    # LAB 1.6: PuTTY


    +   1. You can download a copy of PuTTY from www.putty.org. There will be a link
    on the page that you take to the package file. Make sure you are getting the correct
    version for the hardware you are running. One size does not fit all.

    2. Double-click the file you just downloaded. Follow the instructions until you
    finish the installation and open PuTTY by double-clicking the icon that looks
    like two computers linked together with a lightning bolt.'
  merge: -1
  img_proc: true
