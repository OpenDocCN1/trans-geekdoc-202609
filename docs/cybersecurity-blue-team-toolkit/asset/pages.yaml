- pgno: 79
  md: '# CHAPTER

    6

    Protecting Wireless Communication


    **WHAT YOU WILL LEARN IN THIS CHAPTER:**


    +   - 802.11

    - inSSIDer

    - Wireless Network Watcher

    - Hamachi

    - TOR


    The wireless technology that we use today can trace its origin to radiotelegraphy,
    which transmitted information using electromagnetic waves. Wireless communication
    today travel over the same electromagnetic waves including radio frequencies,
    infrared, cellular, and satellite. The Federal Communications Commission (FCC)
    regulates how the wireless spectrum is used in the United States to ensure stability
    and reliability. It is up to the users to protect their data at rest as well as
    their in transit.


    # 802.11


    The Institute of Electrical and Electronics Engineers Standards Association (IEEE)
    is an organization that develops standards for wireless communication gathering
    information from subject-matter experts (SME). IEEE is not an institution formed
    by a specific government but is a community of recognized leaders who follow the
    principle of “one country, one vote.”

    The IEEE 802.11 is a set of specifications on implementing wireless over several
    frequencies. As technology has evolved, the need for more revisions. If you were
    going to shopping for wireless equipment, you would see'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'array of choices you have based on those revisions of 802.11. Most consumer
    and enterprise wireless devices conform to 802.11a, 802.11b/g/n, and 802.11ac
    standards. These standards are better known as Wi-Fi. Bluetooth and wireless personal
    area networks (WPANs) are specialized wireless technologies, and they are defined
    by IEEE 802.15.


    In Figure 6.1, you see a simple wireless topology; you have a laptop, a printer,
    and a mobile device all connecting through one wireless access point (WAP) via
    a router that connects directly to the Internet service provider (ISP), giving
    the end devices access to the Internet all at the same time.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_80_0.png)


    Figure 6.1: Simple star wireless topology


    To utilize and protect this wireless environment, you need to understand how it
    works. If you control electromagnetic waves, you can use them to communicate.
    Information is sent from one component called a *transmitter* and picked up by
    another called a *receiver*. The transmitter sends electrical signals through
    an antenna to create waves that spread out. The receiver with another antenna
    in the path of these waves picks up the signal and amplifies it so can be processed.
    A wireless router is simply a router that uses radio waves instead of cables.
    It contains a low-power radio transmitter and receiver, with a range of about
    90 meters or 300 feet, depending on what your walls are made of. The router can
    send and receive Internet data to any computer in your environment that is also
    equipped with wireless access. Each computer on the wireless network has a transmitter
    and receiver in it. A router becomes an access point for the Internet, creating
    an invisible “cloud” of wireless connectivity called as a hotspot.


    There are advantages and disadvantages to communicating wirelessly. Networks are
    pretty easy to set up and rather inexpensive with several choices of frequencies
    to communicate over. Disadvantages can include keeping this communication secure,
    the range of the wireless devices, reliability, and, of,'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Chapter 6 Protecting Wireless Communication 69


    speed. The transmitter and receiver need to be on the same frequency, and each
    802.11 standard has its own set of pros and cons. Table 6.1 describes the IEEE
    802.11 standards for wireless devices. As with any technology, wireless devices
    have evolved to become faster with more range depending on the standard. 802.11ac
    is sometimes referred to as Wi-Fi 5 and is what most current wireless routers
    are compatible with. These devices will have multiple antennas to send and receive
    reducing errors and boosting speed. There is a new Wi-Fi technology coming in
    the near future 802.11ax or Wi-Fi 6. 802.11ax will be anywhere from four to ten
    times faster than Wi-Fi with wider channels available to be less congested and
    promises to improve battery life on mobile devices since it is transmitted faster.


    Table 6.1: IEEE 802.11 standards


    | FEATURE | 802.11A | 802.11B | 802.11G | 802.11N | 802.11AC |

