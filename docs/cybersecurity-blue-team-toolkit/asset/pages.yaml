- pgno: 133
  md: '# Chapter 9 Managing Logs


    ports using UDP 514, the default port that syslog will use to communicate. If
    a different process is consuming UDP 514, open your Task Manager by pressing Ctrl+Alt+Delete
    and ending that task. Return to the Menu in Kiwi Syslog Server and restart the
    service, and it will take its place on UDP port 514.


    According to Request for Comments (RFC) 5424, the document provided by the Internet
    Engineering Task Force (IETF) that specifies defines the syslog protocol, syslog
    will convey notification messages using an architecture that supports different
    transport protocols. This RFC defines syslog as having three layers: content,
    application, and transport. There is no rule on how a syslog will be, but it will
    contain at least a timestamp, a hostname or IP address of the device sending the
    message, and the message data itself. Data is usually human readable like the
    example in Figure 9.12.


    | Dec 31 2018 21:00:01 | 192.168.1.21 | %PIX-7-123456 User "Robert" Executed the
    ''Configure'' Command |

    |---|---|---|---|n| Timestamp | Device ID | Details | Message |

    | | Hostname | Facility Code | |

    | | IP Address | Severity (1–7) | |

    | Context | Message Number (6 Digits) | |


    Figure 9.12: Anatomy of a syslog message


    Once you have logs flowing into the syslog server, it is time to consider what
    rules will be applied to the log information. The rules determine what happens
    when the syslog server sees certain items in a log and what action it takes. You
    can create rules to log all messages, send an email if something critical occurs,
    and even run a script if a log contains a certain word. When beginning your rules,
    as you see in Figure 9.12, you will be filters and actions. Kiwi Syslog Server,
    you can have up to 100 rules, and each rule has up to 100 possible filters and
    100 actions.


    If you have built rules on a firewall, building rules in a syslog server is similar.
    When the server sees a message and that message meets the criteria for the first
    rule, it is then passed to the second rule, if there is one. You must build the
    rules in the order in which you want to apply. When a rule applies to a message,
    the filters will start matching TRUE or FALSE. If the first filter returns TRUE,
    it will attempt to match the second filter. If the filter returns FALSE, the next
    message is processed. For example, Figure 9.13 shows the workflow of a rule matching
    the first filter but not matching the second.'
