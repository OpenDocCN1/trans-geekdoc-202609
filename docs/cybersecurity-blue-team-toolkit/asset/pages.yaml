    # Inventory and Control of Software Assets


    Taking an inventory and control of software installed on your assets is taking
    the first control to the next level. You should be able to see what software is
    on your systems, what it installed, and what its function is. You need this information
    to prevent software that is not authorized from being installed on endpoints.
    Some organizations see this as a very complicated, highly managed process, but
    there are several ways to do this efficiently and automatically.


    Many of the methods used to implement the inventory of authorized and unauthorized
    software will also improve the implementation of other controls relating to network
    access, asset configuration, and system management. Administrator access and installation
    rights should not be granted for every user. I have worked for organizations where
    all employees, including the warehouse personnel and receptionist, had administrative
    rights on their computer and could download any application they needed with no
    processes in place to protect the network. Limiting who can install software also
    limits who can install innocent applications or games that contain malware, adware,
    and other when creating a list of unauthorized and authorized applications.


    Once installation has been limited, the next stage is creating blacklisting and
    whitelisting. Blacklisted software should never be allowed on the network, and
    whitelisting is the software organization needs to get the job done. It can be
    rolled out as an authorized software policy first and followed up with scanning,
    removal, and then, central inventory control. The inventory management is usually
    based on a software inventory tool or endpoint management services such as SCCM
    or based on GPO and local policies on Windows.


    AppLocker, natively in Windows 10 and Server, can help you control which apps
    applies and files users can run on their systems. AppLocker can define rules based
    on file attributes, assign a rule to a group or user, and create exceptions to
    rules. It helps reduce what is seemingly complicated, like standardizing approved
    software configuration to disallowing unlicensed software or certain apps from
    running.


    From AppLocker, Microsoft allows Group Policy-based whitelisting for supported
    versions of Windows. These can be edited locally unless you have the Home version
    of Windows. If your organization has a domain controller or Group Policy Objects,
    you can use the same process by Software Restriction Policies (SRP). For more
    general-purpose workstations, a number of client-based solutions, including antivirus
    and endpoint protection suites that limit software from a central console, like
    Carbon Blacks Consolidated Endpoint Security.


    You can use software inventory to collect information about files on client devices
    that already exist. It can be a specific file, with a specific extension,'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Chapter 15 = CISv7 Controls and Best Practices 239


    or all files on the computer. Software inventory can also collect files from client
    devices and store them on the server site. SCCM is often for this kind of mature
    process, especially if you have it in place for hardware management as well. All
    the machines in an SCCM environment will have an SCCM client agent installed on
    them. This helps a machine to be able to communicate with the SCCM servers to
    receive their respective packages. Packages contain the executable files and the
    command lines for an application to be installed. These packages then replicated
    on distribution points. Distribution points are used to store the content of the
    packages for a particular region. Machines that are remotely located can locally
    download the application from a distribution point, rather than connecting all
    the way to the SCCM primary server.


    A deployment of approved software is created by the SCCM administrator. With the
    help of the SCCM client agent installed on the user''s machine, it keeps checking
    for new policies or deployments. After software inventory is enabled, clients
    run a software inventory cycle. The SCCM sends the information to a management
    point in the client''s site. The management point then forwards the inventory
    information to the SCCM site server. This information is stored in the site database.
    When software inventory runs on a client device, the first report is a full inventory.
    In the next cycle, the reports contain only updated inventory information, giving
    you the most current information of what is on that system.


    # Continuous Vulnerability Management


    Organizations today operate in a constant dynamic stream of new security information:
    software updates, patches, and security advisories. It is easy to become overwhelmed
    with the amount of cybersecurity threat advisories that bombard our inbox daily.
    Being able to understand and manage vulnerabilities is a continuous activity and
    requires a significant amount of time and attention to do it well.


    A big part of your assessment and remediation has to do with scanning and finding
    the vulnerabilities in the hardware and software you have the inventory of CIS
    controls 1 and 2. By not scanning for vulnerabilities and addressing discovered
    flaws, the likelihood of an organization''s computer systems compromised is high.
    Identifying and remediating vulnerabilities on a regular basis is also essential
    to a strong overall information security program. Depending on your organization''s
    needs, you may scan monthly or weekly. Some three-letter-agencies I have worked
    with scan vulnerabilities every single night and patch every day. You need to
    create a process around remediation and ensure that the most mission-critical
    assets with the most dangerous vulnerabilities get first.


    One of my favorite sites that I recommend to your RSS feed is www.us-cert.gov/ncas/current-activity.
    This web page by the United States Emergency Readiness Team is regularly updated
    with the most frequent and high-impact security incidents. Another site is https://nvd.nist.gov/vuln/search.
    Here you can scan the vulnerability database for a product, vendor, or'
