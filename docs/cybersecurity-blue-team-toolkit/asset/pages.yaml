    is a multipatform, free, and open source application. There are some benefits
    to Zenmap that the old command-line Nmap cannot do, such as building topology,
    creating interactive maps, showing comparisons between two scans, keeping and
    tracking the results of a scan, and making the scan duplicable. Zenmap''s goal
