    # # Port Scanning


    A port scan is a way to figure out which ports on a network are open and which
    are listening and possibly show whether there are any security devices such as
    firewalls between the sender and receiver. This process is called fingerprinting.
    Ports are numbered from 0 to 65,535, but the lower range of 0 to 1,023 consists
    of “well-known” ones. A port scan will craft a packet to each destination port.
    There are some basic techniques to choose from, depending on the network topology
    and scanning goals.


    +   - Villa scan: This is the most basic scan, fully connecting to 65,536 ports.
    It''s accurate but easily detectable.

    - SYN scan: This sends a SYN but does not wait for a response. It''s faster, but
    you still if the port is open.

    - Strobe scan: This selectively attempts to connect to only a few ports, typically
    fewer than 20.


    There are some other techniques that penetration testers use, such as Stealth,
    FTP Bounce, XMAS, and scans that were developed so the sender could scan undetected.
    The sender''s location can be obfuscated so that an attacker can get the information
    while not being tracked.


    Now that you know a machine is alive on the network, it''s time to determine which
    ports are open on host. From a security viewpoint, it is vital to know the health
    and well-being of your network to know exactly which of the 65,536 ports might
    be exposed. There are six port states that are currently recognized by Nmap.


    +   - Open: An application is actively listening for a connection.

    - Closed: A probe has been received, but no application is listening.

    - Filter: It''s unknown if port is open; packet filtering typically from a firewall
    has prevented a probe from reaching the port. Sometimes you get an error response,
    and sometimes filters drop the probe.

    - Unfiltered: A port is accessible, but Nmap hasn''t a clue if the port is open
    or closed.'
