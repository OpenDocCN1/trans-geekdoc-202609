- pgno: 165
  md: 'The Internet. It provides a global, distributed directory service. It coordinates
    information with domain names assigned to a numerical IP address. It is much harder
    for as humans to remember the four octets for every website we want to visit.
    It is much easier to remember www.example.com.


    There are 4,294,967,296 IPv4 addresses. It would be very difficult to build and
    maintain a database of all IPv4 addresses in one place. With the addition of the
    340,282,366,920,948,463,374,607,431,768,215 IPv6 addresses, it is mind-boggling.
    It is estimated that there are 7.7 billion people on Earth. That is more than
    a trillion IP addresses assigned to every single person on this planet. We need
    a way to track all these addresses. Actually, we have to delegate this process
    to a system.


    The DNS is going to share responsibility of assigning domain names and mapping
    those names by designating authoritative name servers for each domain. A name
    server is going to respond to questions asked about domain names that are specifically
    configured by a network administrator. This allows this process to be distributed
    and fault tolerant. Could you imagine what would happen should single point of
    failure bring down the naming system for the entire Internet?


    The common types of records are going to be the Start of Authority (SOA), IP addresses
    (A and AAAA), SMTP mail exchange (MX), name servers (NS), and Domain Name Aliases
    (CNAME). The CNAME is also called the canonical name. It can point www.example.com
    and ftp.example.com to the right DNS entry for example.com, which has an A record,
    which is the IP address.


    The DNS zone refers to a certain portion or space within the global system. There
    is a boundary of authority subject to management, which is represented by a zone.
    DNS zones are organized like a tree according to the hierarchy of cascading lower-level
    domains. In Figure 11.7, you see an example of a DNS domain namespace.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_165_0.png)


    Figure 11.7: The domain namespace of example.com'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Chapter 11 | Web Application Security 155


    A DNS zone transfer is the process where a DNS server passes part of its database
    to another DNS server. There is a master DNS server and one or more slave DNS
    servers so you have more than one DNS server to answer questions about a particular
    zone. A DNS zone transfer attack is to pretend you''re a slave DNS server and
    ask the master for a copy. A best practice is to restrict zone transfers. At the
    minimum, tell the IP addresses of the slaves so they don''t share information
    with an impersonator.


    # Defense in Depth


    If you have ever toured a well-engineered medieval castle, you have walked through
    a defense in depth. The ultimate goal is to keep the bad guys out. You have to
    cross a moat and get through the outer portcullis, and the castle itself is usually
    in a well-defended place on a cliff with high walls and arrow slots for archers.
    Individuals who do web development think about their processes of defense in the
    same manner.


    The personal information and intellectual proprietary information need to be hosted
    in the most, protected area of the castle so that attackers get over the moat,
    they still have not been able to get the keys to the kingdom. There are several
    mechanisms you can put in place that will protect web applications. Most web applications
    use the authentication, session management, and access control to reduce their
    attack surface. They have interdependencies, providing overall protection. Any
    defect in any part of the trial could possibly give an attacker access to the
    data.


    Authentication is the most basic where you have to prove who you are say you are
    by logging into a site. After you log with a strong password or multifactor authentication,
    the authenticated person''s session must be managed. This is usually done with
    some of token. When a user gets a token, the browser submits it to the server
    in each HTTP request. If the user is not active, the token will ideally require
    that user to log in again. Access control is put in place to make and enforce
    who has access to what. If this has been deployed correctly, it will know if this
    user is authorized to perform an action or access the data he she is requesting.


    Even using this, no web application or technology has proven to be invulnerable.
    New threats and techniques pop up every day that add a dynamic element to defense.
    Bad guys attack and we to defend. Anyone who is in a development role must realize
    that you can maintain security in your web applications during the actual development
    of tools. A good rule of thumb is to assume all input is hostile. Validation is
    done so that only properly formed data can be placed in a web application. The
    next time you pull up a form, check to see whether you can add letters in the
    field for a ZIP code. The field should accept numbers only, as well as a certain
    number of numbers.'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Chapter 11 - Web Application Security


    Encryption is another defense mechanism whether it''s protecting data in transit
    or at rest. You must implement an authentication plan, but the data those served
    must be encrypted in some way. An open, unsecured web service is a hacker''s best
    friend, and there are algorithms that can crawl the web looking for this.


    Another development-focused security tool to implement is exception handling.
    Think of the last time you mist your username and password. Did the error tell
    you it was your username or password? Ideally, it should be generic. If the error
    message was that your password was incorrect, hackers now know that the username
    was correct and to focus their efforts on your password. In any case, the exception
    or error should reject or fail closed. An application that fails securely will
    prevent operations from happening that shouldn''t.


    Lastly, don''t forget logging as well as quality assurance and testing. Logs often
    reveal suspicious activity and can provide individual accountability. If you can,
    hire a third-party service that specializes in penetration testing or vulnerability
    scanning. In college, one of the best practices was to have another person read
    your tests. You become immune to your errors. You know what you meant to say,
    but did you say it right? Getting someone with expertise to give your application
    a test can make the difference between a multimillion dollar breach and no at
    all.


    I''m lucky to call Chris Roberts, the Sidragon himself, a friend. I would have
    to be unlucky to call him again. Physically imposing, even wearing a kilt and
    sporting a foot-length blue beard, he is one of the security researchers out there
    and one of the nicest guys you''ll ever meet. He says, "There are those of us
    in the know, know what is going on and there are too many organizations out saying
    ''Oh, we are perfectly safe,'' but we do have a help of a lot of people who are
    unaware." We have to learn and evolve.


    # Burp Suite


    Burp Suite is a Java-based web penetration testing tool developed by PortSwigger
    Web Security. It has become an industry-standard suite of tools used by security
    professionals. There are three versions: the community edition the professional
    and enterprise versions that have a trial. Burp Suite helps you identify vulnerabilities
    and verify attack vectors that are affecting your applications. In its simplest
    form, Burp Suite can be used as a proxy server, scanner, and intruder.


    While browsing a target application, penetration testers can configure their Internet
    browser to route traffic through the proxy server. Burp Suite then captures and
    analyzes each request to and from the target web application. This allows the
    interception, inspection, and possible modification of the raw traffic. Penetration
    testers can pause, manipulate, and replay individual HTTP'
  merge: -1
  img_proc: true
