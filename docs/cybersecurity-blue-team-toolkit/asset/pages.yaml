- pgno: 21
  md: '# 6 Chapter 1 Fundamental Networking and Security Tools


    To find your router''s private IP address, look for the default gateway. Think
    of this as a literal gateway that you will use to access the Internet or another
    network. What tool would you use to make sure that the router is alive? Why, ping
    of course!


    # THE INTERNET IS DOWN—NOW WHAT?


    The Internet is down.


    You ping yourself at 127.0.0.1, and everything is fine on your machine. You ping
    www.google.com, and it times out. You do an ipconfig /all on your host machine.
    What can you assume if your ipconfig /all command lists the default gateway as
    0.0.0.0?


    As an experienced IT person will tell you, the best thing to do is turn any device
    off and again—first your host and then the router. Still not working? Expand your
    hypothesis to host on your network—can it reach the Internet or the router? Does
    it pull an IP address from the router? When you are troubleshooting, use the scientific
    method. Form a hypothesis, test, modify, and for a new hypothesis.


    Here are two more acronyms to add to your IT vernacular: DHCP and DNS. DHCP stands
    for Dynamic Host Configuration Protocol. Let''s isolate each word.


    **Dynamic:** Ever-changing, fluid


    **Host:** Asset on a network


    **Configuration:** How the asset is supposed to work


    **Protocol:** Rules that allow two assets to talk


    DHCP is a network management tool. This is the tool that dynamically assigns an
    IP address to a host on a network that lets it talk to other hosts. Most simply,
    a router or gateway can be used to act as a DHCP server. Most residential routers
    will get their unique public IP address from their ISP. This is who you write
    to check each month.


    In a large enterprise, DHCP is configured on servers to handle large networks''
    IP addressing. DHCP decides which machine gets what IP address and for long. If
    your machine is using DHCP, did you notice in your ipconfig /all command how long
    your lease was? If you are not leasing, you are using a static IP address.


    Here are two more commands for you to use if you want a new IP address:


    ```

    ipconfig /release: This releases all IPv4 addresses.

    ```


    ```

    ipconfig /renew: This retrieves a new IP address, which may take a few moments.

    ```'
