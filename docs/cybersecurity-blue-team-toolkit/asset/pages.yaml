- pgno: 174
  md: '# Chapter 11 ■ Web Application Security 163


    Web application vulnerabilities will offer a huge amount of risk to an organization,
    especially to enterprise systems. Too many of the vulnerabilities are a result
    of lack of data validation, and bad actors can leverage to misuse the application.
    Make a checklist and check everything. Best practice says the outgoing, internal,
    and mail links. Test your forms for default values, and test your cookies to make
    sure they are deleted properly. Test HTML and CSS so there are no syntax errors
    and so that other search engines can crawl your site easily. Test the content
    and navigation as well as the database for integrity and response time.


    A web application penetration tester will tell you it will be an arduous process
    and you are going to run into roadblocks. Deadlines will be a huge issue since
    everything is needed now, not tomorrow. Plan your work, know what is expected
    of the process, and create the best process for your organization.'
  merge: -1
  img_proc: true
