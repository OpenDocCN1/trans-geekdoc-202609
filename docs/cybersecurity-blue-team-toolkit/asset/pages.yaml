  md: '# CHAPTER

    13


    # Securing OSI Layer 8


    WHAT YOU WILL LEARN IN THIS CHAPTER:


    +   - Human Nature

    - Social Engineering Attacks

    - Education

    - The Social Engineer Toolkit


    > “The definition of insanity is doing the same thing over and over again expecting
    a different result.”

    Quote attributed to Albert Einstein


    > “There are three kinds of men: The ones who learn by reading, the few who learn
    by observation. The rest of them have to pee on the electric fence for themselves.”

    Will Rogers


    Most people think that cyberattackers are going to use high-tech, very advanced
    techniques to hack into their accounts and infect their systems. The simple truth
    is that the easiest way to hack a system is through human hacking or social engineering.
    Kevin Mitnick,world-renowned social engineer says, “Companies spend millions of
    of dollars on firewalls and secure access devices, and it’s money wasted because
    none of these measures address the weakest link in the security chain: the people
    who use, administer, and operate computer systems. It takes only one person clicking
    one link and downloading one malicious exploit.'
