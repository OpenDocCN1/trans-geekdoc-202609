- pgno: 197
  md: '# Human Nature


    We are funny creatures, we humans. We have put men on the moon and nearly wiped
    polio on the face of the earth, but when faced with the elevator not coming as
    we like, we press the button over and thinking it might speed things up a bit.
    If I am waiting at the elevator with you, I have already made several assumptions
    about you and your need to get where you''re going as quickly as possible. First
    impressions are very important in social engineering.

    nYou have approximately 8 seconds before people will have a solid impression of
    who you are, and it is difficult to overcome a first impression.


    Social engineering is practiced every day by everyone in every walk of life. If
    you have ever had a job interview, you attempted to social engineer the interviewer
    giving you the job. If you have ever had a first date, you were attempting to
    make someone like you enough to go on a second. Social engineering is when person
    A attempts to manipulate person B into doing what person A wants B to do. It doesn''t
    have to be malicious or evil. It could be a marketing campaign trying to sell
    you a car you don''t really need. It could be a political campaigning for a vote
    or a magazine telling you what you should read. Social engineering is influence
    by whatever means necessary to get what you want. It could be a vote, a sale,
    a vacation, or your administrative credentials.


    In cybersecurity, this is done through any type of social interaction whether
    in person, the phone, or over the Internet. The absolute best defense is training
    and education. If you can recognize that someone is attempting to influence you,
    you become hyperaware to the attempt. If you look at the results of the DEFCON
    Social Engineering Capture the Flag (CTF), it is obvious that the winners employ
    the “6 Principles of Persuasion laid out by Professor Robert Caldini. In his research
    and what he believes to be the science before getting people to say “yes” are
    six fundamentals that guide human behavior:


    +   - Reciprocity


    +   - Scarcity


    +   - Authority


    +   - Consistency


    +   - Liking


    +   - Consensus


    Reciprocity is defined as being an exchange for mutual benefit. You scratch my
    back, and I will scratch yours. You may have heard this in Latin as quid pro quo.
    In IT social engineering, I have seen this as a simple, “Please click this link
    and fill out this survey for a $5 gift card.” As a pen testing campaign against'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'an organization, it works extremely well unless your end users are aware of
    attacks like these. If you are the one creating the attack, be the first to make
    an offer and make sure it is meaningful.


    A used car is the epitome of social engineering. “Someone was here an hour ago,
    and they really want this car.” Scarcity creates a sense of urgency. People want
    more of the things they cannot have. With any type of social engineering, the
    timing is key, but especially with scarcity. I have seen this in password reset
    emails. What do people stand to lose if they do not ask? They lose access to their
    files, then they can’t do their job; now they can’t pay the rent, and they’re
    homeless. A little extreme, but does it create a sense of urgency.


    A few years ago, I was an adjunct instructor teaching a computer class for a nursing
    school. The chancellor asked all the professors to wear a doctor’s coat, even
    if we were not teaching medical classes. At the time, it was a little odd until
    I went to pick up a prescription for my daughter. Even the pharmacist assumed
    I was in a position of authority and had me to the head of the line. Then it clicked.
    The students had been conditioned to recognize the doctor’s coat to the authority
    figure. If someone wears a uniform, people will naturally follow the lead of that
    person. It is important to signal what makes you a credible, knowledgeable authority
    before you try to influence them.


    Greg Foss, senior researcher at Carbon Black, told me of a time that he was conducting
    a penetration test and consistency was the theme of his experiment. He had created
    a Google phone number, created a voicemail message, and called his target at a
    time when he knew the target was not going to be around. He left a message that
    person called back because he needed to help the individual with a problem that
    was having. They played telephone a few times, which built a foundation of trust
    and consistency with the target.


    There are three components to principle of liking. We like people who give us
    compliments. We like people who have the same goals as we do. We like them even
    more if they are willing to help us get to our goal. One of the things to try
    to do with social engineering is to have someone form a goal of his or her volition
    that we have actually orchestrated. The very first thing you should do in a job
    interview is find some commonality with the interviewer, and in your mind-set,
    the interviewer is a friend, not an adversary. The goal for that person is to
    woo you to the organization, and you are now interviewing that person.


    One of the best tools we have in social engineering is to smile. Smiling has been
    shown to be a psychological signal of altruism. Altruism is the concept that you
    want to help others because of a concern for their happiness, not your own. Smiling
    even makes you look younger, giving you a mini facelift because it lifts your
    cheeks, jowls, and neck. Every time you smile, dopamine,'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'endorphins and serotonin throw a little party in your brain. For most people,
    smiles are contagious, so they respond to a smile with a smile of their own, having
    their own little party, making you seem alike and competent. The next time you
    have to deal with a difficult person, make eye contact and smile.


    As for consensus, marketing and politicians do this all the time. Ninety percent
    of dentists recommend this toothpaste. If you''re a good and intelligent person
    like you, you will vote this way. When individuals don''t have a strong opinion,
    they can be easily swayed and follow others. In cybersecurity, it can be dangerous
    to trust but verify


    "Trust, but verify" is an old proverb. The phrase became popular during the late
    1980s when U.S. President Ronald Reagan was negotiating disarmament with the Soviet
    Union''s General Secretary Mikhail Gorbachev. I believe it the mind-set of a cybersecurity
    professional. When an outcome matters more than a relationship, you have to trust,
    but verify. In IT, security are of utmost importance over-critical parameters.
    If a relationship matters more than an outcome, then this philosophy doesn''t
    fit well.


    Add to Professor Caldini''s six principles of persuasion, when you are crafting
    a social engineering campaign, there are six human truths I have learned over
    the past 20 years. These have helped me social engineer both professionally and
    personally.


    +   - Most people want to be helpful.

    - Humans want instant gratification.

    - Never use the words "obviously" and "but.\n- The brain wants order and dislikes
    change.

    - Most people, including my students, have a limited attention span.

    - Humans respond to beauty and emotion.


    David Kennedy, founder of TrustedSec and DerbyCon, says because of this attitude
    in our culture, women aren''t to be technical or disingenu. He also says it is
    helpful to have a Southern accent. A Southern accent is'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Chapter 13 ■ Securing OSI Layer 8 191


    synonymous with warmth and hospitality, whereas a New York accent can be fast
    and harsh. It is my goal one day to participate in the Social Engineering CTF
    in Vegas. As a technically adequate female who was born and raised in Louisiana,
    I feel that I have a bit of advantage, especially if I ask for help. I have had
    the doors held for me in a secure location because I have arms full of books,
    ignoring the RFID badge reader and the mantrap.


    Humans are hardwired to want what we want without delay or denial. It’s evolutionary.
    Humans survive when they take the smaller reward but skip the bigger yet delayed
    reward. If you have children, experiment with them. They can have one if you wait
    5 minutes, they can have two. Never wait for that.


    I met Desiree about a year ago when she gave the keynote at EC Councils Hacker
    Conference in Atlanta. In her keynote, she said we ought to choose our words with
    care. There was a list of several words you ought not to use, but the two that
    burned into my brain are “obviously” and “but.” Trying “obviously” in a sentence
    and not sound condescending. If you are attempting a role that is arrogant or
    patronizing, by all means it might work for you. She also suggested using “and”
    instead of “but.” No one hears anything “but “ I love this idea, but can we do
    this instead?” That sentence sounds a lot different than “I love this idea, and
    what do you think about this instead?” “But” will start an argument or stop the
    conversation. “And” will engage.


    The brain wants order and dislikes changes. I think this becomes more pronounced
    the older we get. If you are attempting a social engineering campaign, you have
    to build it around something that is believable and not out of the ordinary.


    Most people, including my students, have a limited attention span. I was studying
    for my CompTIA Certified Technical Trainer certification, my instructor told the
    class that we had 20 minutes to engage students with a lecture before they started
    thinking what was for dinner or what movie they were going to this weekend. If
    you need someone’s attention for more than 20 minutes, you will have to change
    the delivery. In training, we can show a video or give a hands-on exercise. In
    penetration testing, you don’t normally want a long personal engagement. What
    you want to get, what you need to do, and get out.


    Humans respond to beauty and emotion. I believe this is self-explanatory. People
    are attracted to what they find beautiful or what makes them feel great emotion.
    The movie Oceans made me chuckle when Rhianna social-engineered the security engineer
    with a compromised secret about the Wheat bread of dogs. I’m not sure I could
    drop a Meterpreter as fast as she did in the movie and turn on her webcam, but
    yes, that’s exactly how it’s done. Appeal to your targets’ interests, what they
    feel is beautiful, and you will have a great start to a campaign.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Human Attacks


    Before I talk about different type of social engineering attacks, I would like
    to take a quote from Chris Hadnagy''s book, The Science of Human Hacking. He says,
    "A professional social engineer''s goal is to educate and assist rather than humiliate
    to." The whole purpose of this chapter is for you to understand the way most people
    make decisions and help organizations educate their end users how to recognize
    someone is trying to take advantage of them for gain. Education and training is
    one of the most important things you can do to secure your organization, but unfortunately,
    one of the first things to get cut out of a budget.


    If you are doing any social engineering campaign, just like any penetration test,
    it must be documented and permission given. You also have to be careful with any
    type of impersonation. I had a student my Metasploit class as a result of a decision
    he made to internally phish his organization and impersonate a three-letter agency.
    The campaign was discovered because the comptroller of the company he worked for
    was married to an agent for this three-letter agency. She made a phone call to
    ask him if the agency was indeed audited.


    Phishing is one of the most popular ways to gain access into an organization.
    Through open-source intelligence (OSINT), you know who works for the organization
    and the positions they are. You know from different press releases that the company
    is excited about. Sometimes penetration testers use phishing for knowledge and
    sometimes for gain. If we are able to compromise a system with stolen credentials
    from a phish because we successfully extracted information from an end user, we
    can attempt to elevate those privileges to administrative levels, just like this
    type of phishing test is to leverage what we can find into what else we can find.
    Phishing will often take advantage of things going on either within the organization
    or other popular events or disasters.


    Vishing (voice phishing) is still popular, which surprises me. I never answer
    the phone. In fact, most people will text me if they are about to call me. Vishers
    use the phone to gain access to personal or financial information. One I have
    seen in the news lately targets older people with grandchildren. With enough OSINT,
    criminals know how to impersonate the grandchild and call the grandparent because
    they''ve gotten into trouble and need them to send money. If the grandchild is
    off school, odds the parents are not in constant contact. Smishing (social media
    phishing) sends a text message to a mobile phone to attempt to gain access to
    personal information with the same intention as phishing or vishing.'
