    | Range indoors | 100 feet | 100 feet | 125 feet | 225 feet | 90 feet |

    | Range outdoors | 400 feet | 450 feet | 450 feet | 825 feet | 1,000 feet |


    As with any technology, it evolves, you will start making decisions on what scenario
    is best for you and your organization. There will be trade-offs on frequency used,
    speed, or the range of a device from a Wi-Fi hotspot. A hotspot is merely an area
    with an accessible network.


    When building a wireless small office or home office (SOHO) environment, after
    you identify what technology and design is best for your situation, you configure
    the settings of your router using a web interface. You can select the name of
    the network you want to use, known as the service identifier (SSID). You can choose
    the channel. By default, most routers use channel 6 or 11. You will also choose
    security options, such as setting up your username and password as well as encryption.


    As a best practice when you configure security settings on your router, choose
    Wi-Protected Access version 2 (WPA2). WPA2 is the recommended security standard
    for Wi-Fi networks. It can use either TKIP or AES encryption, depending on the
    choices you make during setup. AES is considered more secure.


    Another best practice is configuring MAC filtering on your router. This uses a
    password to authenticate. The MAC address of the device itself. Each device that
