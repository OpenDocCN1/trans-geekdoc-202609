    **Figure 9.6:** Disk errors and warnings in system logs


    Windows enables most log files by default, although what level of logging you
    need. Turning on verbose logging, the most detail possible should be done only
    during a specific event or while trying to track an active, security incident.
    If you aren''t careful, the volume of logs can take up terabytes of disk space.
    Systems have been known to crash because well-meaning system administrators enabled
    verbose logging for all systems and then forget to disable it when troubleshooting
    was completed. Be sure to put a sticky note on your reminder to revert logging
    levels after you''ve done troubleshooting.


    Great logging is about pulling out the necessary critical events and alerts from
    an otherwise overwhelming amount of information. The problem for most admins is
    not about getting enough information, but getting useful information out of an
    overwhelming deluge of data.


    To enable a security audit policy to capture log failures in the audit logs, open
    an elevated Command Prompt by right-clicking the Cmd.exe shortcut and selecting
    Run as Administrator. You can also press Windows+R to run the box. Type cmd and
    press Ctrl+Shift+Enter to run the command as an administrator. In the elevated
    Command Prompt, run the following-command:


    ```

    Auditpol /set /Category:System /failure:enable

    ```


