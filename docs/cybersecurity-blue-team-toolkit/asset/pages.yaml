    \n# John the Ripper\n\nTwo community favorite password tools are Hashcat and John\
    \ the Ripper. If\nyou ask people which one is their, chances the answer will depend\n\
    on the person. I like both. If I am not successful with one, I will try the other.\n\
    usually use John the Ripper first.\n\nJohn the Ripper was originally designed\
    \ to crack Unix passwords. Now it\runs on pretty everything and cracks almost\
    \ anything. The original\nversion is maintained by Openwall. The version that\
    \ comes in Kali Linux\nis called the Jumbo version because it has more types and\
