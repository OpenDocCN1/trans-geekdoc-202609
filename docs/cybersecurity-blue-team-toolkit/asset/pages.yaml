- pgno: 96
  md: 'length of the packet, and information about the packet. By clicking the individual
    packets, you control what is shown in the bottom two panes. To drill down into
    each packet, select the packet in the packet list pane to view more details in
    the middle window, which feeds data into the bottom window.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_96_0.png)


    **Figure 7.1:** Choosing a network interface card for capture


    In the packet details pane, you see individual packet size, both on the wire and
    bytes captured. You also see the transmission medium, protocol, source port, and
    destination port, and then depending on the type of packet, you may see flags
    or queries. You can click the > sign on the left to reveal different levels of
