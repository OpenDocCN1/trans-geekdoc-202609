- pgno: 92
  md: '# Chapter 6 Protecting Wireless Communication


    timeline of activity, websites you''ve visited, and images you''ve viewed. Have
    you ever had a conversation with a friend and the very next ad you see on your
    PC or your phone is in correlation to the conversation you had? Tor (also called
    The Onion Router) is the answer to much of this. Tor is a network that allows
    you to stay anonymous on the Internet. It is based on "onion routing" developed
    at the U.S. Naval Research Laboratory and was launched in2002. The Tor Project
    (www.torproject.org) is a nonprofit organization that currently maintains and
    develops the free Tor Browser client. The U.S. government funds it with some support
    from the Swedish government and some individual contributors.


    Is Tor illegal? No. Engaging in activities that are illegal in your country or
    on Tor illegal?

    Some professionals believe that using Incognito mode in Chrome is the same thing
    as running Tor. Browsing the Internet in Incognito mode only keeps your browser
    from saving your history, cookies, or form data. It does not hide your browsing
    from your ISP, employer, spouse, or the NSA. To activate Incognito mode in a Chrome
    browser, please press the Ctrl+Shift+N. In Figure 6.12, you see Chrome in Incognito
    mode.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_92_0.png)


    Figure 6.12: Chrome in Incognito mode


    By contrast, Tor reduces the risk of traffic analysis by distributing it so that
    no single point can link you to your destination. To create a private network
    path, the users of the Tor Browser client will incrementally build a circuit of
    encrypted connections through different relays on the network. In Figure 6.13,
    you see the route that takes from your Tor Browser client to the destination.
    The circuit is built one hop at a time so that each relay only knows to whom it''s
    giving data and where it is sending data. No individual relay knows the entire
    path. For security, after 10 minutes, a new circuit is created to keep anyone
    from attempting to figure out the path through the nodes.'
  merge: -1
  img_proc: true
