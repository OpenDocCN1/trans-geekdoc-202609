- pgno: 69
  md: '# CHAPTER

    5


    # Monitoring with OSSEC


    WHAT YOU WILL LEARN IN THIS CHAPTER:


    +   - Log-Based Intrusion Detection Systems

    - Agents

    - Log Analysis


    Open Source Security (OSSEC) is a free, open-source, host-based intrusion detection
    system (HIDS). Daniel Cid, the author of OSSEC, often refers to it in the log
    analysis portion of OSSEC as a *log-based intrusion detection system* (LIDS).
    Log analysis for intrusion detection is the process of using the recorded events
    to detect attacks on a specific environment.


    With the proper agents installed on your assets and logs being processed by OSSEC,
    you meet the criteria for appropriate control. CIS Control 6 is the maintenance,
    monitoring, and analysis of logs. You must ensure that logging is enabled locally
    on your systems and is actively being monitored. Sometimes logging is the only
    record or evidence of a successful attack. Without solid logs, an attack may go
    undetected, and damage can be ongoing for months, if not years. Not only can a
    LIDS protect against an external threat, it can also protect against an internal
    threat such as detecting a user who is violating an acceptable use policy (AUP).


    # Log-Based Intrusion Detection Systems


    On your hosts across your network, it is vital to monitor the current state of
    a machine, check the files that are stored on that machine (the log files), and
    check to make sure these files have not been changed. OSSEC operates on the principle
    that attackers who are successful at exploiting a vulnerability and'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Chapter 5 Monitoring OSSEC


    have gained access to a machine will leave evidence of their activities. Once
    attackers gain access to a system, they of course will not want to lose access.
    Some attackers will establish some backdoor that allows them to return, bypassing
    all security you have in place. A computer system should be able to detect these
    modifications and find persistent threats that penetrate firewalls and other network
    intrusion systems.


    OSSEC is a security log analysis and is not known to be useful for log management.
    It will store the alerts but not every single log. You will have another mechanism
    for log storage if you need to store logs for your internal security policies
    or compliance. If you choose to use OSSEC as a HIDS, you will be using a database
    to monitor file objects. OSSEC can remember, attributes, and dates as well as
    a hash of contents on a machine. For example, if integrity is the most important
    aspect of file monitoring, an MD5 sum will use an algorithm to create a digital
    fingerprint of the file.


    With new project/program implementation, there comes a need for evaluation. Your
    team will need to define what will look like, analyze your current situation,
    start with a few key components, and take a look at your incident response (IR)
    plan. An IR plan will contain policies, procedures, and guidelines surrounding
    processes to complete if an unplanned event occurs.


    The benefits to using OSSEC is that it is an open-source free tool that doesn''t
    require a lot of hardware. This HIDS tool will give you visibility into logs generated
    by firewalls, applications, servers, and routers. You also gain visibility to
    encrypted protocols such as SSH and SSL logs.


    A challenge with OSSEC is it focuses on reactive remediation, reacting to an event
    that already occurred rather than proactive remediation, where you may mitigate
    and remedy the issue before it occurs. Another challenge you may face is "alert
    fatigue." This happens when a system floods you with alerts hundreds of times
    to every incident. This can be managed with log correlation and fine-tuning.


    OSSEC can be used to monitor thousands of servers with OSSEC agents. These will
    be monitored by the OSSEC manager.


    OSSEC is fairly easy to install'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Chapter 5 ■ Monitoring with OSSEC 59


    DNS should be implemented on separate servers. A database, which needs to have
    strong security measures in place, would be at risk sharing a server with a web
    application, which needs to be open and directly face the Internet. Each server
    may generate its own unique type of logs, and that may require some configuration
    of OSSEC. In Figure 5.1, you see the process that OSSEC will use to gather, analyze,
    and possibly alert you to its activity.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_71_0.png)


    Figure 5.1: The collection of data from agents analyzed and possibly generating
    alerts


    The log analysis flow for the client/server/agent architecture begins with the
    collection of logs from the assets that need monitoring. After the logs are collected,
    generic information is extracted as hostname, program name, and time from the
    syslog header.


    The OSSEC is a virtual appliance based on CentOS and includes Elastic search-Logstash-Kibana
    (ELK). It comes with its own library of log decoders that will be used by default.
    These decoders can parse or analyze the logs from Windows, SSH, or Apache using
    default tags within the logs that help identify what they are and where they came
    from. The decoders in OSSEC are written in XML and organized into libraries to
    make them easy to open, decode, define, and clone. As you see in Figure 5.2, the
    virtual appliance spans up for you to begin interacting with the dashboard, libraries,
    and parsing data.


    OSSEC must first understand what is in a log before it can tell you something
    is wrong or alert you to an event. After parsing and normalizing the data, it
    will match fingerprint with fingerprint and with syntax, for forwarding the log
    file to be evaluated by the rules for processing. If OSSEC receives a log that
    it doesn''t understand, it will generate an event 1002, “Unknown problem somewhere
    on the system,” as you see in Figure 5.3. One of the best solutions is to configure
    some type of trigger that lists a unique field in the log so it is no longer unknown.


    Straight out of the box, there is an extensive set of rules embedded in OSSEC.
    The rules themselves can be correlated and grouped. After decoding the log, the
    next step is to check the rules. The rules are internally stored in a tree-type'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 60 Chapter 5 Monitoring with OSSEC


    structure and allow you to match on user-defined expressions based on the decoded
    information. There are more than 400 rules available by default. Please do not
    modify the default rules inside OSSEC as they will be written over when you upgrade.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_72_0.png)


    Figure 5.2: The OSSEC appliance


    | Time | Agent | Rule | Alert_Level | Description | Details | File | Syslog_Host
    | Syslog_Program |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | October 29th 2018, 19:18:01 | root | 1002 | 2 | Unknown problem somewhere in
    the system. | Oct 29 19:17:55 ossec-ser ver db(sshd)5) failed to activate service;
    error= timeout | message | ossec-server | ossec |


    Figure 5.3: An OSSEC 1002 alert


    There are two basic types of rules: atomic and composite. Atomic rules are based
    on a single event occurring, while a composite rule is based on patterns across
    multiple logs. When you''re learning to write rules, it requires a rule ID, a
    level that is between 0 and 15, and a pattern. For example, if a log is decoded
    as SSH, generate rule 123. If you want to add a secondary rule, it will be dependent
    on the first. You can add more rules to be called if the second one matches; for
    example, you can specify whether the IP address comes from inside or outside the
    network. Be careful—don’t write new rules dependent on composite rules. You should
    look at the atomic rule that the composite rule is based on.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Chapter 5 ■ Monitoring with OSSEC 61


    OSSEC can generate thousands of alerts a day and, if misconfigured, in a much
    shorter period of time. You must tune your instance or else you will start to
    ignore these alerts. Make sure your alerts are relatively rare and relevant to
    your environment.


    # Agents


    To start with these processes, OSSEC has many different options for installation.
    From the www.ossec.net website, you can choose from a server/agent tar.gz file,
    a virtual appliance, a Docker container, and an .exe file for the Windows agents.


    The easiest for a new user is the virtual appliance. Inside the virtual appliance,
    which is based on CentOS Linux 7 distribution, you have the files needed, getting
    the .ova file set up is fairly easy. Do not forget: When you download an .ova
    there is usually a _readme file. Be sure to open and read the file for any helpful
    hints such as default passwords, ports to open or connect, or ways to bridge with
    your host network. Two CentOS users are predefined in the virtual appliance: ossec
    and root. The root password is _ossec_. The ossec user does not have a password,
    so you can just press Enter to log on.


    If you are working with the OSSEC Virtual Appliance 2.9.3 and downloaded from
    its OSSEC GitHub, it already contains the following:


    +   - OSSEC 2.9.3

    - Elasticsearch-Logstash-Kibana (ELK) 6.1.1

    - Cerebro 0.7.2

    - CentOS 7.4


    You can import this virtual appliance into most virtual systems. OSSEC recommends
    VirtualBox for creating and running the appliance, but VMware works as well. The
    appliance network interface is configured to NAT mode. To use this as a server,
    you must configure the network to use bridged mode and set a static IP. In Figure
    5.4, you see the Kibana OSSEC dashboard is built to visualize alerts, including
    how many over time, top alerts per agent deployed, and alert data.


    Two types of agents feed data into OSSEC: installable and agentless. Installable
    agents are installed on hosts, and they report to the server: agentless agents
    require no installation on a remote host. Both of these processes are started
    and maintained from the OSSEC manager. After information is gathered, it uses
    SSH, RDP, SNMP, or WMI to send the data to the manager for processing and decoding.'
  merge: -1
  img_proc: true
