  md: '# Chapter 2 Troubleshooting Microsoft Windows


    Problem Steps Recorder (PSR) goes back to Windows 7 and Server 2008. PSR is a
    combination troubleshooting, assistance, screen capture, annotation tool that
    few IT professionals know about. You can use it to document your steps quickly
    with annotated screenshots and instructions. You can use it to troubleshoot an
    issue for a customer who is not as IT-savvy as you. My favorite way to use it
    is to build documentation.


    One of the best questions you can ask your IT manager is, "What keeps you up at
    night?" When I am teaching, I try to learn as much as I can about my students''
    needs and goals. One of the best responses to the question about their security
    challenges is lack of documentation and continuance. This tool will help solve
    that.


    In my experience, I have managed people new to IT who ask the same questions over
    and over. Empower them to find the answers, I created PSRs for repetitive tasks
    like the following and store them on an easily searchable SharePoint site:


    In Lab 2.2, you''ll use PSR.


