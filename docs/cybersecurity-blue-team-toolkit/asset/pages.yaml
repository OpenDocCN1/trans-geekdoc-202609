  md: '# 226 Chapter 14 Kali Linux


    ![](img/e8e965b6c3537819be0d570febb3fc1d_234_0.png)


    Figure 14.24: Spoarta data collected while a running scan


    Next, type ifconfig eth0 down in your terminal so that you can reassign a new
    MAC address to eth0, as shown in Figure 14.25. Then type macchanger -s - r to
    figure out what your current MAC is. Change -s to reassign a random MAC to eth0.
    To bring the eth0 back up, type ifconfig eth0 up. If you did not have a specific
    MAC address you want to use, the command you would use is macchanger -m 00:00:00:00:00:00
    eth0. A MAC address is hexadecimal, so you could use any number from 0 to 9 and
    any letter from A to F.


    ```

    root@kali:~# ifconfig eth0 down

    root@kali:~# macchanger -s eth0

    Current MAC MAC: 00:0c:29:34:b0:06 (VMware, Inc.)

    Permanent MAC: 00:0c:29:34:b0:06 (VMware, Inc.)

    Current MAC: 00:0c:29:34:b0:06 (VMware, Inc.)

    Permanent MAC: 00:0c:29:34:b0:06 (VMware, Inc.)

    New MAC: d4:01:e9:33:53 (unknown)

    ```


    Figure 14.25: Spoofing your MAC address


