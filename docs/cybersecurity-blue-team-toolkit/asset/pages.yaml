    \n# Hashcat\n\nHashcat provides much of the same functionality as John the Ripper.\
    \ They are open-source and share the same features. Hashcat is built around the\
    \ GPU rather than the CPU as John the Ripper does. A CPU is the central processing\
    \ unit, often called the brains of a PC. A GPU is the graphics processing unit,\
    \ which comprises the chips that render the displays images to monitors. If the\
    \ CPU is the brain, then call the GPU. A GPU is better at focusing all the computing\
    \ power on a specific task. If you're looking to do password-cracking on a system\
    \ that has GPU, use Hashcat. It will be better and faster for many complex passwords.\n\
    \nRemember, passwords should not be stored in clear text. They are stored in one-way\
    \ encryption as hashes. There are a couple ways of obtaining these hashes, but\
    \ once you grab them, the next step is to reverse-engineer the hash, unless you\
    \ pass the Hash to Metasploit. There are wordlists available on the Internet,\
    \ but Kali Linux already has some. In A wordlist is a text file that contains\
    \ a collection of words to be used in a dictionary attack."
  merge: -1
  img_proc: true
