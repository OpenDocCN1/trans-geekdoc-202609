    # Web Development


    It takes a lot of work to create really great applications and even more to maintain
    the evolution of those applications over time. In the past 20 years, the Internet
    has progressed exponentially. Take, for example, the original Facebook page, which
    was www.facebook.com in 1999. If you use the Internet archive site called the
    Wayback Machine at www.archive.org, you can see what Facebook looked like two
    decades ago (see Figure 11.1). What I love about the Wayback Machine is if you
    want, you can right-click the website archived and view the page source.


    The progression of the Web has led to a need for the evolution of web application
    testing. Back in the day, a web page was a static page, and the flow of information
    was from server to browser. Most sites did not require any type of authentication
    just it wasn''t needed. Any issue you had as a result of vulnerabilities in a
    web server. Now you see web applications that are dynamic and customized for each
    user, and the problem is private data exposed to the public, not just server files.


    Every developer knows that the foundation of a strong application is the framework
    and architecture it is built on. Web application architecture is the interaction
    between applications, middleware, and the databases the application relies on.
    It is critical when a user hits the Submit button through that the information
    is processed correctly. Middleware is the software that provides services to applications
    besides those offered by the operating system. Any software between the kernel
    and the application can be middleware. Some describe middleware as "software glue."


    You type in a URL, and the browser finds server that hosts the website and asks
    for that particular page within that site. The server responds by sending the
    appropriate files to the browser to execute. Now you get to interact with the
    web. The most important thing here is the code. The code gets parsed by the browser,
    which may or not have specific instructions to tell the browser what to do. The
    web application framework and architecture have all the components and routines
    needed for the application.


    Ultimately, the design of web applications is for usability. You want an application
    to accomplish goals efficiently. This is critical for many organizations since
    the majority of global business and our lives are on the Internet. Every application
    and device today is built with the idea of web-based interaction. You have Amazon
    for shopping, Instagram to keep up with friends, JPMorgan Chase for banking, and
    all the email you send using Google or Yahoo!. When you have the assurance that
    these web applications are protected and the'
