    # Hamachi


    Hamachi by LogMein is a cloud-based, professional-level application that allows
    you to easily create a virtual private network (VPN) in minutes. A VPN seems complicated,
    but Hamachi is not. Unlike traditional software-based VPNs, Hamachi is on-demand,
    giving you secure access to your business anywhere you have an Internet connection.
    Without protection, the information you send will be out in the open, and anyone
    interested in intercepting your data can capture it. Figure 6.4 shows an example
    of a laptop sending an email using VPN to secure transmission over the Internet.


