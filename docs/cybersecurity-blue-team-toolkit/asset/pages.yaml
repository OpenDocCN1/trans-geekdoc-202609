    5. Click the View All Problem Reports link in the lower-right corner next to the
    Save Reliability History link. This will open a new page that includes all the
    problems this device experienced and can be reported directly to Microsoft. When
    there is a solution, it will appear in Security Maintenance.


    # USING RELI


    Let''s say you are a system administrator. Most system administrators install,
    upgrade, and monitor software and hardware for their organizations. You have a
    server in your datacenter that is potentially misbehaving. You attempt to troubleshoot
    the issue and cannot duplicate the problem that was reported to you. Instead,
    you get the infamous BSOD.

    You will learn that the first thing you ask customers when they report a problem
    is, "Have you tried turning it off and again? If you unfortunately experience
    a BSOD, your only option is to power down and turn the device back on. Check reliability
    to determine what caused crash.

    It has been my experience that BSOD is caused by bad drivers, overheating, or
    someone installing new software that is incompatible with either the hardware
    or the operating system. Using reliability is how you figure out what really happened.

    No one admits to downloading and playing Duke Nukem Forever.


    # PSR


    Are you the one in your organization who is responsible for continuance or documentation?
    Do you have to train others how to do their job, or have you been asked to train
    someone to do yours? Do you ever have to troubleshoot an environmental problem
    on a system or give a presentation at the last minute?'
