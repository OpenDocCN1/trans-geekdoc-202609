    In a meshed network, every single member of the network is connected to every
    other member, which makes it easier to relay data. A mesh topology handles high
    amounts of network traffic every device is considered a node. Interconnected devices
    can transfer data at the same time, and data moves smoothly, which makes this
    an ideal choice for gaming. The hub-and-spoke topology provides more control than
    the meshed network topology. Hubs are connected to everyone, and you spokes connected
    to hubs but not to each other. This is a typical choice for a corporate environment
    where you have workstations connecting to a server. A gateway network will integrate
    well with a physical network, giving members access to the physical network. There
    will be only one gateway, and there can be many members.


