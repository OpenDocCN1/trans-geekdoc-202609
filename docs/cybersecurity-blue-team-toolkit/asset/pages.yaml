- pgno: 33
  md: '# Chapter 2 Troubleshooting Microsoft Windows


    Even seasoned professionals who work with massive networks have years of experience
    have uttered a few words when they see tools that are meant to make their life
    easier after they''ve been doing the hard way for years and years. If nearly 90
    percent of your network is Windows, you need these tools to make your administrative
    life easier.


    # RELI


    I call this RELI because when you type these four letters in the Windows search
    box on the taskbar, there is usually nothing else to choose from besides this,
    the Reliability History/Monitor. RELI traces its roots all the way back to Windows
    Vista. It allows you to see the stability of a machine in a timeline. When you
    start typing in the Start menu, you''ll notice the name of the tool displays Reliability
    History. When you open the tool, it renames itself to Reliability Monitor. (Thank
    you, Microsoft)


    Reliability Monitor will build a graph for you of important events, application
    and Windows failures, and updates and other information that might be important.
    Figure 2.1 shows the graph that gets generated from application, Windows, and
    miscellaneous failures. In Lab 2.1 you''ll use RELI.


    ![](img/e8e965b6c3537819be0d570febb3fc1d_33_0.png)


    Figure 2.1: Reliability Monitor graph


    # LAB 2.1: RELI


    +   1. To open this tool, open the Start menu and begin typing reli.

    2. When you see the blue flag icon next to Reliability History in your Start menu,
    press the Enter key. Wait while it builds your graph timeline.'
