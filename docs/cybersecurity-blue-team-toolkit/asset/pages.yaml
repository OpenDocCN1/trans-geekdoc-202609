    register for technical support, you can do that here.


    +   3. Navigate to your download folder. Find the ManageEngine DesktopCentral
    executable and double-click it.


    +   4. During the install process, you will get a warning exceptions for the c:\ManageEngine
    directory. Antivirus could possibly interfere with database files. Check to make
