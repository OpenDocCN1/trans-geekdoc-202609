  md: '# Chapter 15 = Clsv7 Controls and Best Practices 241


    average organization, but the fundamentals are the same. By using robust passwords,
    limited privilege accounts, and a lockout policy, and you are making it more difficult
    for the attacker to compromise your account or steal important data.


