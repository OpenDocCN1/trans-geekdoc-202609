- pgno: 242
  md: '# # CHAPTER

    15


    # ## CISv7 Controls and Best Practices


    ### WHAT YOU WILL LEARN IN THIS CHAPTER:


    +   - CIS Basic Controls—The Top Six


    As an educator, I firmly believe that humans are curious creatures of habit and
    do not change unless sufficiently motivated. Most of us are motivated by either
    the love of something or the fear of it. In our cyber society, people need to
    know why certain controls are important, and they have to understand why they
    are important on a personal level. Knowing something and understanding it are
    very different. As a cybersecurity trainer, it is my personal mission to educate
    the public and bring understanding to cyber threats in a personal way. I believe
    we have hope for the best but prepare for the worst.


    When you are evaluating and auditing your environment for managing your processes
    and systems, you should determine whether the options you are following are the
    best practices of conducting inventories, adopting computer policy, and communicating
    to the people using those systems. You also have to evaluate whether people in
    the management roles have the practical and technical expertise to assess these
    options and can provide support and training for users.


    The Center for Internet Security (CIS) is a self-described forward-thinking, nonprofit
    entity dedicated to protecting private domains and public society against cyber
    threats. The controls they preach are the global standard and are recognized best
    practices for security. As our worries evolve, so do these best practices. As
    a cybersecurity professional, I refer to these CIS 20 controls fairly often as
    a reminder to secure the world to our best ability.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'The CIS top 20 controls are broken into three sections. The first six controls
    are the basic ones. These six controls are essential in any organization for cyber
    defense. The rest of the controls are divided into foundational and organizational,
    which focus on technical best practices and processes.


    # CIS Basic Controls—The Top Six


    I recommend that you go to the SANS website, www.sans.org, and look for conferences
    that you are happening now. In the evenings, they will have mini-sessions free
    to the public, usually about an hour long each, of interesting security topics
    taught by the certified SANS instructors. Sometimes, if you''re lucky, they will
    have an assortment and up to three or four in one evening. In the dozens of sessions
    I''ve attended, the one that stands out most is the Eric Conrad a couple of years
    ago in Orlando, Florida. He talked about the top CIS controls. He said that he
    was consulting for a governmental organization on another continent, implementing
    the top controls about 80 percent of problems resulting in more security and less
    likelihood of a breach. The top CISv7 basic controls are as follows:


    +   - Inventory and Control of Hardware Assets

    - Inventory and Control of Software Assets

    - Continuous Vulnerability Management

    - Controlled Use of Administrative Privileges

    - Secure Configuration for Hardware and Software on Mobile Devices, Laptops, Workstations,
    and Servers

    - Maintenance, Monitoring, and Analysis of Audit Logs


    If you read about the major breaches in the last five years, most of them could
    have been avoided if the organization subscribed to and executed these six controls.
    The CISv7 have cross-compatibility or directly map to other compliance and security
    standards like NIST 800-53, PCI DSS, and HIPAA. This translates to other organizations
    using these suggestions as regulations to aid in their respective compliance.
    The NIST Cybersecurity Framework is another tool that organizations use to organize
    and strengthen their security posture using the CIS top controls as their baseline
    for several of their best practices. Let''s look at these in more detail.


    # Inventory and Control of Hardware Assets


    One of my favorite sayings in class is that “you cannot protect what you don''t
    know you have.” This control specifically addresses the need to know what is connected
    to your network. You must develop policy and procedures around'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Chapter 15  CISv7 Controls and Best Practices 237


    maintaining an accurate inventory. It can be tedious, but it is critical. If you
    do it right, it reduces risks. You must know what is on your network and who the
    system belongs to and use that data to prevent any unauthorized from accessing
    the network.


    Creating a system inventory is a common task for system and network administrators.
    An open source audit tool Nmap or Zenmap has all the features needed to run an
    ad hoc or automated inventory process. By simply scanning a network using system
    identification (-o) switch and possibly verbose output (-v) switch, you can get
    a list of systems and their protocols. The inventory provided information that
    is critical to system, application, and protocol management. The inventory will
    not include information such as how much the system has or how many processors
    are there. This type of hardware inventory requires either an SNMP agent on the
    system or a script running on the system to determine the hardware in the system.


    What do all network-connected devices have in common? They speak to each other
    using a logical address called IP addresses. Who manages IP addresses? Dynamic
    Host Configuration Protocol (DHCP) manages IP addresses. DHCP generates logs.
    For DHCP-enabled networks, deploying a mechanism to focus on combining system
    inventory with configuration management and network access control is a win-win.
    The inventory portion is usually based on some type of endpoint management software
    like System Configuration Manager (SCCM). SCCM is a Microsoft systems management
    software product for managing large groups of computers from servers to mobile
    devices. Do not forget IoT when you are coming up with a management policy of
    your hardware inventory.


    If you are a Microsoft customer with an enterprise agreement, you may already
    have a SCCM license. SCCM provides software distribution, operating system deployment,
    and network access as the CIS hardware inventory. There are a datacenter edition
    as well as a standard edition. Both editions include the following tools:


    +   - Configuration Manager—for managing the deployment of applications and devices
    in an enterprise network

    - Data Protection Manager—for performing backup and recovery for business continuance
    and disaster recovery

    - Endpoint Protection—for managing anti-malware and firewall security

    - Operations Manager—for monitoring the health and performance of operating systems
    and hypervisors

    - Orchestrator—for standardizing and automating processes for operational efficiency'
  merge: -1
  img_proc: true
