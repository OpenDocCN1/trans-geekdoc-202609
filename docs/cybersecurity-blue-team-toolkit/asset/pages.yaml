    # In Conclusion


    When my husband suggested that I write a book I wanted to read, I decided to write
    the book I wanted to read when I was starting in IT. My career has bounced between
    doing and teaching, and I love my niche. Being in IT as a technical educator is
    not just my job, it is my passion. I try to give my students the tools and knowledge
    they need to be successful in whatever they have chosen to do.


    The last six months'' writing journey has pushed me to put down on paper what
    I know and how I''ve used it to make the world a safer place. As Ryan said in
    the Foreword, the world of cybersecurity, we are constantly bombarded with new
    products, new tools, and new attack techniques. We are pulled daily in multiple
    directions on what to secure and how to secure it. I hope I''ve given you tools
    to make successful.


    What now? Keep going. Keep learning and growing your toolkit. Our industry will
    keep evolving, and you will have to keep up or, even better, become a leader.
    Share your knowledge. Remember, as you learn more, the more you realize, there
    is so much out there to know, and if you understand it well enough, you will be
    able to explain it simply.'
