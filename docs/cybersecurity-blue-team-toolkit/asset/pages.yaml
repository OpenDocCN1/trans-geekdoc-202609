    Each step recorded has a date and time and is annotated in bright green in the
    screenshot surrounding what you clicked. Examine your screenshots. In the first
    frame, your Start button will be highlighted in green with an arrow on it. The
    explanation at the top of each picture will tell you how the data was entered.
    When you''re troubleshooting, sometimes makes a difference.


    At the bottom of the Recorded Steps page, there will be an Additional Details
    section. This section contains specific details about software and operating systems
    that only professionals or advanced IT people will understand. Review to make
    sure nothing is in that you don''t want.


    Have you ever asked to present in a meeting with 15 minutes prep time? I''m good,
    but not that. If you are being asked to present on something that you can show
    in PSR, scroll up to the top of the page and click the hyperlink "Review the recorded
    steps as a slide show."


    There are a few caveats to PSR. It will look much more professional if you record
    on just one monitor. It will not record text that you type such as passwords;
    it will record only function and shortcut keys. It will not capture streaming
    video or a full-screen game. You may get a static picture, but this file delivers
    a flat, one-dimensional file. You are also limited by default to only 25 screenshots.
    If you need more than 25, you will have to go to the Help menu and adjust the
    settings. These settings will be temporary and not retained. They go back to the
    default when you close and reopen the program.


    I had professional IT students tell me this tool was worth the price of admission
    to class.


