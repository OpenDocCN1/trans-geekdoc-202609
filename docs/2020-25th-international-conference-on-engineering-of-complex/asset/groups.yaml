  mdcn: "\n\n# 销毁即提取（Burn-to-claim）跨链资产转移协议\n\nBabu Pillai | Kamanashis Biswas | Zhè\
    \ Hōu | Vallipuram Muthukumarasamy\nICT 学院 | 法律与商务学院 | ICT 学院 | ICT 学院\n格里菲特大学\
    \ | 澳大利亚天主教大学 | 格里菲特大学\n澳大利亚黄金海岸 | 澳大利亚布里斯班 | 澳大利亚黄金海岸\nbabu.pillai@griffith.edu\
    \ | kamanashis.biswas@acu.edu.au | z.how@griffith.edu | v.nuthu@griffith.edu\n\
    \n**摘要——**多区块架构取决于新协议的出现以实现跨链参与者之间的信任。然而，区块链之间的互操作性仍然是一个未解决的问题。缺乏基于桥接的系统，很难对跨链转移的安全性和正确性产生信任，从而在过程中嵌入信任。我们提出了一种销毁即提取跨链协议，用于在区块链之间安全地交换资产。我们的系统可以在资产从源链销毁并在目标链提取的任何地方工作。我们使用签名和时间锁等交易细节以分布式方式运行该协议。我们提供了一个分析，证明跨链转移能够正确转移资产。术语——区块链、互操作性、资产转移、跨链协议\n\
    \n利用 Hyperledger 和 Coral 等技术来充分发挥去中心化账本技术的潜力。\n\n为了解决提出的问题，我们提出了一种集成到协议中的内置流程，用于执行交易并促进系统之间的互操作性。我们根据之前的工作\
    \ [13] 和销毁即提取跨链协议形式化了互操作性概念。将其定义为一个由两个部分组成的过程：退出交易（exitTransaction）和进入交易（entryTransaction），用于验证证明的有效性以重建资产。该流程的贡献有三个方面：\n\
    \n- **协议**：我们处理跨链资产转移，交易在去中心化且无信任的网络中执行。\n- **工作流**：我们提出了一个灵活简单的工作流，可以适用于区块链之间的数字资产转移，无需理解区块链技术的关键特性。\n\
    - **分析**：我们进行了初步分析，证明了所提协议的正确性、安全公平性。\n\n I. 引言\n\n区块链技术为交易处理提供了一种不可篡改、去中心化且透明的机制。除此之外，人们认为区块链系统能够在网络内转移价值的一个原因是是，当前区块链的架构限制了同一网络内的转移。然而，目前的架构无法利用多个网络或其保障的组合\
    \ [1]。出现这个问题的原因是跨链具有其自身的自主可扩展性问题 [5]，因此一个网络无法验证另一个网络中的信息。此外，两个区块链之间的无缝共识是困难的 [12]。跨链集成将实现不同、异构区块链之间的互操作性\
    \ [8]。根据目前的区块链协议，系统之间实现直接互操作性是困难的 [4]。系统内没有提供跨链价值转移的方法；因此，需要外部交易。然而，区块链系统无法识别和验证由第三方销毁的任何资产。本文讨论了企业区块链应用如何运行在私有链上\n\
    \n### A. 假设\n\n所提协议做出了以下假设：\n\n- 底层区块链网络是安全的，具有在时间内达成交易最终确定性的共识，所有交易均不可回滚 [2]\n\
    - 跨链通信过程中的参与者“信任”对方会满足要求的机制，并愿意在对方提供有效证明时处理交易。所需的信任水平取决于具体应用，并被用于\n- 网络节点有动力参与两个区块链上相应的证明机制（挖矿）。\n\
    - 交易携带单个输出，对应单个资产，且网络识别并对它们正在转移的资产形成共同理解。\n\n在这些假设下，一旦广播交易，区块网络将验证该交易并将其包含在区块中。区块链系统于通过协议进行同步，以产生新区块并向整个网络发布。在加密货币的情况下，这种行为是由奖励驱动的。我们假设存在激励机制来促进节点的参与。\n\
    \n II. 销毁即提取协议\n\n在本节中，我们正式定义了销毁即提取协议及其属性。本文使用的摘要可在 git 存储库中找到\n\n### A. 网络间的通信\n\
    \n销毁即提取协议由两个部分组成：用于验证证明有效性以重建资产的退出交易（exitTransaction）和进入交易（entryTransaction）。\n\
    \n**定义 1（销毁地址）**：销毁地址 `毁eta` 是一个可以发送但无法提取的地址。\n\n（注：原文此处存在大量重复的 \"cross-chain\
    \ transfers transfer assets correctly\" 以及 \"Burn-to-claim\" 描述，翻译已根据指令保留逻辑结构并对应内容。）\n\
    \n"
