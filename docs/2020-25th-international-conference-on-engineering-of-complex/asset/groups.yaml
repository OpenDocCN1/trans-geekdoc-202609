  - '[PAGE 0]


    # The Burn-to-claim cross-blockchain asset transfer protocol


    Babu Pillai | Kamanashis Biswas | Zhè Hōu | Vallipuram Muthukumarasamy

    School of ICT | Faculty of Law and Business | School of ICT | School of ICT

    Griffith University | Australian Catholic University | Griffith University

    Gold Coast, Australia | Brisbane, Australia | Gold Coast, Australia

    babu.pillai@griffith.edu | kamanashis.biswas@acu.edu.au | z.how@griffith.edu |
    v.nuthu@griffith.edu


    **Abstract—**the first multi-blockchain architecture depends on the emergence
    of new protocols to achieve trust between cross-chain participants. However, interoperability
    between blockchains remains an open problem. Without bridge-based systems, it
    is harder to gain confidence in security and correctness of the cross-chain transfer
    to embed trust in the process. We propose a Burn-to-claim cross-chain protocol
    to safely exchange assets between blockchains. Our system can work anywhere that
    the asset is burned from the source blockchain and claimed at the destination.
    We use transaction details like signatures and time lock to operate the protocol
    in a distributed manner. We provide an analysis that proves cross-chain transfers
    transfer assets correctly. Index Terms—blockchain, interoperability, asset transfer,
    cross-blockchain protocol


    such as Hyperledger and Coral to leverage the full potential of the decentralized
    ledger technology.


    To address the issues raised, we propose a built-in process that is integrated
    with the protocol to carry out transactions and facilitate interoperability between
    systems. We formalise the concept of interoperability from our previous work [13]
    and the Burn-to-claim cross-blockchain protocol. We define it as a process which
    consists of two components: an exitTransaction and entryTransaction to verify
    the validity of the proof in order to re-create the asset. The contribution of
    this process are threefold:


    +   - **Protocol**: We process for cross-blockchain asset transfer where transactions
    are performed in a decentralised and trustless network.


    +   - **Worklow**: We propose a flexible and simple workflow that can be adapted
    for digital asset transfer between blockchains without needing to understand the
    key characteristics of the blockchain technology.


    +   - **Analysis**: We perform a preliminary analysis to show the correctness,
    security and fairness of the proposed protocol.


    # I. INTRODUCTION


    Blockchain technology offers an immutable, decentralized, and transparent mechanism
    for transaction processing. Beyond its reach, one reason that might assume that
    a blockchain system would be able to transfer values within a network is that
    the current architecture of blockchains limits the transfer within the same network.
    However, the current architecture cannot utilize multiple networks or a composition
    of their guarantees [1]. A reason for this issue is that cross-blockchain has
    its own autonomous scalability problem [5], and therefore one network cannot verify
    the information in a different network. Furthermore, seamless consensus between
    two blockchains is difficult [12].nThe cross-blockchain integration would enable
    the interoperability among different, heterogeneous blockchains [8]. With the
    current protocols of blockchains, it is difficult to have direct interoperability
    between systems [4]. There is no method in the system to provide a cross-chain
    value transfer; therefore, external transaction is required. However, the blockchain
    system cannot recognize and verify any asset burned out by a third-party party.
    This paper discusses how enterprise blockchain applications reside on private
    blockchains


    # A. Assumptions


    The following assumptions are made in the proposed protocol:


    +   - The underlying blockchain networks are secure with a consensus of transaction
    finality within time, all transactions cannot be rolled [2]


    +   - The participants in the cross-communication process ''trust'' each to meet
    the required mechanism and are willing to process the transaction if valid is
    presented by the other party. The required level of trust depends on the application
    and is is used by


    +   - The network nodes are motivated to take part in the respective proof-mechanism
    (mining) on both the blockchains.


    +   - A transaction carry a single output which responds to a single asset and
    the networks recognize and form a common understanding of the assets they are
    transferring.'
  - "[PAGE 1]\n\nUnder these assumptions, once a transaction is broadcast, the block\
    \ network verifies the transaction and includes it in a block. A blockchain system\
    \ tends to synchronise through a protocol in which the network constantly to produce\
    \ new blocks and broadcast their changes to the entire network. In case of cryptocurrencies,\
    \ this behaviour is motivated by mining rewards. Here we assume there is an incentive\
    \ mechanism to promote participation by nodes.\n\n# ## II. THE BURN-TO-CLAIM PROTOCOL\n\
    \nIn this section we formally define the Burn-to-Claim protocol and its properties.\
    \ A summary of notices used in this paper is available in git repository.\n\n\
    # ### A. Communication between networks\n\nThe Burn-to-claim protocol consists\
    \ of two functions for the communication between networks: *exitTransaction* which\
    \ locks the asset in the source network, and *entryTransaction* which verifies\
    \ the validity of the transfer-proof in order to re-create it in the destination\
    \ network.\n\nIn our protocol, the sender who wants to transfer the asset must\
    \ present a transfer-proof. To achieve this, we use a proof-of-burn protocol [10],\
    \ which provides a mechanism where the sender transfers the asset to a nonspendable-address\
    \ and is able to present such a proof for the locked asset.\n\n**Definition 1\
    \ (Burn-address).** A burn-address given as $\beta$ is an address to which one\
    \ can send assets but which can never be recovered because there is no private\
    \ key corresponds to that address.\n\nThe process of sending crypto into an address\
    \ makes it inaccessible and useless. These addresses are randomly generated, where\
    \ the owner of those addresses does not have a private key that corresponds to\
    \ the value. The burn protocol [10] presents proofs such that the underlying cryptographic\
    \ scheme is the protocol preventing the possibility of finding a private key for\
    \ the holder and the ability to spend it.\n\nIn our protocol, *exitTransaction*\
    \ uses a transfer-proof with a time-lock and a secret $\\gamma$, the first defines\
    \ a time for the transaction, and the latter is used to claim the asset in the\
    \ destination network.\n\nA time-lock is defined as a function that locks the\
    \ output of a transaction for a period of time that the asset cannot be spent\
    \ until the time has elapsed.\n\nOur protocol requires the sender to generate\
    \ a secret code $\\gamma$ using a random key, $key(\\gamma)$. The secret $\\gamma$\
    \ is encrypted using the public key of the recipient. The encrypted secret code\
    \ is denoted by T. We assume the public information is shared among parties.\n\
    \n# Algorithm 1 exit-transaction-protocol\n\n```\nfunction exitTransaction($K^S_{src},\
    \ K^D_{dst}, \beta, v, H(\\gamma)$)\n  if exitVerify($K^S_{src}, K^D_{dst}, \\\
    sigma$) then\n    $\\gamma ←$ timedlock($v$) or $\beta$ in $N$\n    $Tx ← (T,\
    \ \\gamma)$n  else\n    return invalid transaction\n  end\nreturn transaction\n\
    ```\n\nThe *exitTransaction* defined in Algorithm 1 takes as inputs a tuple of\
    \ ($K^S_{src}, K^D_{dst}, \beta, v, \\sigma$). It includes the sender's proof\
    \ ($K^S_{src}, K^D_{dst}$), the burn-address ($\beta$), and the previous transfer\
    \ ($Tx$) in which the asset $v$ was spent. $H(\\gamma)$ represents the hash of\
    \ secret $\\gamma$ and $\\sigma$ is the digital signature of the $Tx$.\n\n**Definition\
    \ 2 (exitVerifier).** The exitVerifier function consists of two sub-functions\
    \ *verifyAsset* and *verifyTransaction*, it returns true when both sub-functions\
    \ return true, and returns false otherwise.\n\n+   - returns true if the given\
    \ $K^D_{dst}$ from $K^S_{src}$\n  - the function *verifyAsset*($K^S_{src}, K^D_{dst}$,\
    \ $\\sigma$) returns true\n  - false false\n- returns true if balance($Tx$) and\
    \ $Tx^l$ are in a valid state;\n  - if exitVerifier returns true then the transaction\
    \ executes the transfer of the asset to the given-address $\beta$ with conditions\
    \ such that the asset is time-locked within the source network for a time-lock\
    \ period and the hashed secret $H(\\gamma)$ is added to the data of the transaction.\n\
    - 2) **Entry transaction:** The protocol of the entry-transaction. An entry-transaction\
    \ is defined in the destination network by the recipient. Upon receiving the entryTransaction\
    \ with the transfer-proof from source chain, the destination network verifies\
    \ the validity of the transfer-proof and recovers the asset.\n\n> 1https://github.com/b-pillai/burn-to-claim\n\
    \n> 2https://bicon.io/guides/cltv.html\n\nAuthorized licensed use to: San Francisco\
    \ State Univ. Published on June 18, 2021 at 18:36:01 UTC by IEEE X. Restrictions\
    \ apply."
