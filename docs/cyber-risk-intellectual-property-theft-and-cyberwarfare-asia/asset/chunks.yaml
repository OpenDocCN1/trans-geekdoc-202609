    Smart grids constitute the amalgamation of traditional electrical power networks
    with modern digital technology. Electrical power grids are the underpinning of
    any successful modern economy and ensure all manner of physical infrastructure
    works smoothly such as mass transport and lighting systems. To make them more
    effective and deal with increasing sophistication of modern cities with their
    growing populations, electrical power grids from which all electricity is generated
    have now become digitised. This makes them more efficient and safer to use but
    also comes with the new security hazard of cyber risk and cyberattack.


    Cyberattacks can cause power outages and affect the quality of the service including
    service disruption. The implications of such disruption can be both economically
    and socially destructive. The loss of power to both homes on the domestic side
    and, for example, to manufacturers of perishable goods can cause untold damage.
    Loses can include loss of time, equipment, production, services, command and control,
    confidential data, privacy and security, disruption of supply chains and government
    revenues.


    The implementation of smart grids is increasing rapidly around the globe and they
    are in current use, for example, in the United States, Europe, Russia and India.
    In cyber terms they are a magnet for geo-political state actors trying to gain
    advantage over another country: rogue states such as North Korea and terrorists
    of every description let alone a wide array of cybercriminals or individuals with
    a grievance. As mentioned in [Chapter 4](#ch13.xhtml#book-part-004) in this book
    dealing with Russia, smart grids are an attractive target in a war of attrition.
    Cyberattacks on power grids are increasing as witnessed in the second week of
    March 2020 with a European organisation that coordinates 42 power grids confirming
    a successful cyber breach on all of the grids.[[¹](#ch16.xhtml#en118)


    ## IP and value


    Both loss of IP on a large scale and attendant loss of value pose real threats
    to the worth of the global economy. Cyberattacks on organisations are a serious
    threat to IP losses and the reputation of a company. The IoT means that in 2020
    the internet will have more than 50 billion devices connected to it. This means
    the scope for economic loss due to IP theft, for example, requires cyber intelligence
    and countermeasures to increase just as quickly as the disruptive technologies
    are increasing.


    As of 2020, cybercrime costs the global economy US$ 575 billion annually. It also
    extracts 20% of value created by the internet, which in 2020 means that up to
    US$ 3 trillion of global economic value is at risk. IP losses mean that increased
    cybersecurity investment costs are incurred. These include, among other countermeasures,
    installing additional cybersecurity technologies, introducing new procedures and
    policies, hiring cybersecurity experts and having more external audits. These
    are all essential as IP is the lifeblood of all major organisations including
    smart grids.


    There are two main drivers for companies wishing to tighten their cybersecurity.
    The first is a concern for keeping data safe. This can be customer information
    or data related to the personnel the company has hired. The second, and related
    to the first, is IP, trade secrets and related business assets.


    ## Cyber weaknesses of smart grids


    As advanced systems, smart grids require advanced security technologies and their
    subsystems need to be functional even if under cyberattack. Additionally, smart
    grids – often through smart meters – gather sensitive information concerning their
    users. Smart grids not only capture information concerning users’ usage of energy,
    but also credit issues and other personal private data. Customers can only feel
    secure if their privacy of data is secured. This includes third parties who may
    need to work on the smart grid and are bound to contractual obligations not to
    pass on data.


    Yet, with the `IoT`, smart grids allow two-way communication between businesses
    and homes and the energy grid. This process will make the consumer aware of their
    energy consumption but will also allow energy, such as excess solar energy, to
    transmitted back to the energy grid. As renewables grow in use, this process will
    become widespread. In 2020, almost all European countries including Britain have
    smart meters. As smart grids are used in all advanced economies, the smart grid
    firms will then move on to developing economies spreading the cyber risk to data,
    privacy issues and IP even globally.


    As smart grids are data and IP driven, the risks of cyberattacks increase and
    the added requirement of cybersecurity measures also expand and become more costly
    and complex in nature. Smart grids have moved on from mechanical ones, which makes
    them more efficient but more vulnerable to cyberattack. Smart grids still rely
    on a large central generation centre for support, which leaves them open to cyberattack
    that leads to damage to physical infrastructure. It is the new, complex nature
    of digitisation of the electrical process that leads to new vulnerabilities and
    ways to attack the physical infrastructure. The central storage station includes
    a significant number of installations of energy storage and of renewable energy-generation
    facilities. These exist at the bulk power system level as well as distributed
    throughout the network. The smart grid also holds a greatly enhanced control and
    sensory capability that is configured to accommodate these distributed resources
    and electric vehicles, which allows for direct consumer involvement in energy
    management and efficient communicating appliances. This is an extremely complex
    system of millions of nodes that are all interconnected.


    ## Use of blockchain

