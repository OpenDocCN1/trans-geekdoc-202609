    窃取他人知识产权（IP）的欲望从未改变，无论对方是创意个人，还是在专利池中工作以创造新创新的公司团队。政治手段已变得更加复杂，通过创建开源访问来贬低人类创意产出的价值，使这些内容可以被所有人随意获取。例如，加利福尼亚州旧金山的一家开放获取图书馆开放后引发了骚动，该图书馆在未经作者许可的情况下自自入备了知名书籍，且无意图通过版税来承认或补偿作者。只有当最著名的作家威胁要起诉时，人们才开始关注。这种情况也发生在著名的发明家身上。英国著名发明家詹姆斯·戴森（James
    Dyson）因侵犯`Dyson`专利从吸尘器竞争对手 Hoover 那里赢得了 400 万美元，但他认为，如果他的公司规模更小，他将会输掉诉讼。


    剥夺创意人士原创思想和创新回报的另一种主要途径是通过网络攻击，这种攻击在全球范围内日益增加，并像本书所的那样需要解决。无论动机如何，通过网络攻击窃取知识产权绝不能被低估。事实上，数字时代的新“沙皇”（如
    Napster、Facebook 和 Google 的创始人）在从内容创作者和创意过程中获利时，希望拥有与他们所批评的企业资本主义者相同甚至更多的控制权。


    Napster 的创始人肖·帕克（Sean Parker）是最早的例子之一，他创建了一种可以数字提取 CD 音乐内容的软件，允许多达 700 万用户在计算机网络上免费分享。帕克知道自己正在违反版权法并窃取音乐内容创作者的知识产权。最终，唱片公司对这种公然的侵权行为提出了法律诉讼，并于
    2001 年 7 月关闭了 Napster。肖·帕克对于成为被定罪的企业黑客并无遗憾，并为自己是第一个窃取知识产权技术的发明者感到自豪。


    正如电影《社交网络》（*The Social Network》，关于 Facebook）所示，帕克最终被 Facebook 创始人马克·扎克伯格（Mark
    Zuckerberg）任命为 Facebook 总裁。Google 创始人兼首席执行官拉里·佩奇（Larry Page）从未成为萨克斯演奏家或音乐作曲的天赋，因此他转向了计算机科学并最终了
    Google。在建立这家数字公司的治理结构时，佩奇和他在 Google 的伙伴谢尔盖·布林（Sergei Brin）组织了一个双层股东制度，他们的投票权是购买公开募股股份的人的十倍。正如佩奇在给股东的第一封信中解释的那样，“新投资者将充分分享
    Google 的长期经济未来，但通过投票权对其战略决策的影响微乎其微”。其底层哲学似乎是，在未经许可的情况下获取创意内容是可以接受的，因为 Google 复制了整个全球网的内容并在未征得任何人许可的情况下对其进行了索引。这一切都源于佩奇最初创建了从
    CD 中提取音乐内容的软件，这种软件侵犯了版权，并在未经任何人许可的情况下窃取了知识产权。


    因此，黑客以及 Napster、Facebook 和 Google 等数字时代公司的支持者认为，窃取知识产权和剥真正的内容创作者获得版税是自然而然的发展趋势，这并不意外，这种观点与支持开放获取（open
    access）的人的想法是一致的。这些趋势与其他基于网页的社会不适症有关，例如不尊重数据收集的私密性，或对选举结果的干预。这导致万维网创始人蒂姆·伯纳斯-李爵（Sir
    Tim Berners-Lee）与“数字乌托邦”抗争，并建立加强监管和某些标准。2019 年 11 月，他通过他的世界维网基金会提出了《网络公约》（Contract
    for the Web），旨在阻止外国势力干预选举、仇恨言论、侵隐私和虚假信息。


    正如我的书籍《金融领域的网络风险管理》（*Managing Cyber Risk in the Financial Sector*）中提到的，在计划缓解网络风险时，调查中心不应基于统计模型或仅基于
    IT 软件包，而应基于人的变量。如果没有人类的无知/错误、合谋、怨恨、贪婪、恶意和地缘政治迫性，黑客无法窃取知识产权或更改连接到船舶导航的 GPS 系统。因此，不仅了解技术是如何运作的（例如物联网（IoT）设备的多重连接使得黑客有更多种方式来利用许多连接中的弱点以进入网络系统），理解黑客背后的人类动机也至关重要。


    在组织内部寻找那些有动机实施网络攻击以破坏系统且不被发现的人也至关重要。在一个日益复杂的世界中，特别是在网络战争中，我们必须评估网络攻击背后真实的全球参与者的动机。同样，在公司内部，培训员工、客户以及中小企业（SME）供应链中的经理至关重要。那些向大型公司提供货物的人由于缺乏人力是最薄弱的环节。大型公司通常由于规模效应拥有丰富的人力和技术资源，对反网络攻击的准备最充分。


    ## 知识产权盗窃


    正如美国国务卿迈克·波洛（Mike Pompeo）在提到与中国目前的贸易问题时提到的，知识产权盗窃是大多数网络风险/攻击问题的核心。“中国为了军事目的窃取知识产权，”他说，“它想主导人工智能、太空技术、弹道导弹和许多其他领域。”这句话再贴切不过，因为我
    2019 年 3 月/4 月为了这本书对日本的研究访问显示，最大的网络风险/攻击问题围绕着知识产权盗窃展开。


    一项于 2018 年进行并在次年由声誉卓的国际社会经济研究所（IISE）发表的日本调查显示，在考虑网络攻击机构目标时，日本的知识产权盗窃最高——日本为 25%，而亚洲平均水平为
    10%，全球为 12%。这就是为什么我们在书中关注日本，因为日本的知识产权盗窃异常高。在全球范围内，知识产权盗窃最高的地方是美国、英国和西欧。


    根据这项 IISE 调查，业务中断（BI）是组织网络攻击的主要目标，全球范围内为 30%，亚洲为 27%，而日本为 17%。这些差异对于评估为何知识产权盗窃研究较少，以及为何其影响针对的是少数具有重大经济意义的国家（并往往产生毁灭性影响）具有重要意义。业务中断对企业和政府机构来说可能是毁灭性的，但可以恢复，而知识产权的被盗是无法挽回的，会对组织或个人造成毁灭性影响。


