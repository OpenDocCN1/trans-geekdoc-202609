    获取数据的另一种途径是通过供应链进行知识产权窃取和恶意软件植入，这些行为尚未引起公司足够的关注，导致了来自个人和国家级攻击者的间接泄露。大多数大中公司以及政府机构都依赖于某种形式的供应链，这对于产品和服务来说都是必不可少的。事实上，公司规模越大，对供应链的依赖程度就越高。最近的一个案例涉及两家酒店连锁店，一家在
    14 个国家拥有 107 家酒店，另一家在全球 14 个国家拥有 73 家酒店。一次 Magecard 侧持器攻击通过第三方供应链破坏了这些酒店的移动端网站。趋势科技的研究人员发现，黑客针对了位于巴塞罗纳的
    `Roomleader`，植入了恶意的 `Javascript`。`Roomleader` 提供数字营销和网站开发服务，通过一个名为 `viewedhotels`
    的库模块协助酒店公司处理预订功能，该模块用于在游客浏览器 cookie 中保存浏览过的酒店信息。与常见的 `Magecart` 攻击类似，该侧持器旨在收集有关客人联系方式的信息和数据，例如电子邮件地址、信用卡详情和房间偏好。在这种案例中，侧持器被设计为仅针对移动网站用户，而不针对使用
    PC 的用户。事实上，桌面用户使用的是普通的 `Javascript` 接收预订信息。趋势科技的欺诈研究员 Joseph Chen 建议，移动网站之所以成为目标是因为它们没有受到常规
    PC 安全软件的保护，更容易进入且逃避检测。黑客将酒店支付表单替换为他们略有不同的版本，但将其翻译成与原始表单相同的八种语言，以帮助避免检测。此外，许多酒店不会向客人询问信用卡验证码（`CVC`），而客人到达时询问。在他们的替换支付表单中，他们要求客人提供
    `CVC` 安全代码。


    微软和保险公司 Marsh（这两者都是电脑生产和保险领域的重要公司）最近的一项调查报告显示，公司领导对网络攻击的快速增加感到更加担忧。然而，这些业务领导人和高管在应对此类网络风险方面的信心比以前更低。


    ## Notes

    [1] ‘Good for Google, bad for America’, Peter Thiel, *New York Times* (1 August
    2019).

    [2] ‘Cybercrime and espionage go hand in hand as groups target healthcare and
    video game world’, Erin Ayers, *Advisen Cyber News*, *Digest Edition* (8 August
    2019).

    [3] ‘Beijing hackers moonlight for cash’, Boer Deng, *The Times* (9 August 2019).

    [4] ‘Chinese hackers “turned” US spy tools on West’, Boer Deng, *The Times* (8
    May 2019).

    [5] ‘Huawei says without evidence that U.S. pressured its employees’, Raymond
    Zhong, *New York Times* (3 September 2019).

    [6] ‘North Korea “stole $2bn for weapons via cyber-attacks”’, *BBC News Online*
    (7 August 2019). See `www.bbc.co.uk/news/world-asia-49259302`

    [7] ‘Russia suspected by some in giant Bulgarian hack’, Marc Santora and Eric
    Schmitt, *New York Times* (14 August 2019).

    [8] ‘Episode 13: “The Blueprint”’, Producer/Director John Marks, *New York Times*
    (6 September 2019).

    [9] ‘European Values Think-Tank among 30 Russian watchers targeted by the most
    sophisticated cyber attack ever done on ProtonMail, probably by the GRU’, press
    release, *European Values* (14 August 2019). N.B. Technical details of this cyberattack
    were made public by Bellingcat.

    [10] ‘Cyber attack on Ministry of Foreign Affairs’, Naveen Goud, *Cybersecurity
    Insiders*. See `www.cybersecurity-insiders.com/cyber-attack-on-czech-ministry-of-foreign-affairs/`

    [11] ‘Iranian hackers targeted presidential campaign, Microsoft says’, Nicole
    Perlroth, *New York Times* (4 October 2019).

    [12] ‘Microsoft warns Russian hackers can breach secure networks through simple
    IoT devices’, Zak Doffman, *Forbes* (5 August 2019). ‘Russian hacks are infiltrating
    companies through the office printer’, *MIT Technology Review Computing* (5 September
