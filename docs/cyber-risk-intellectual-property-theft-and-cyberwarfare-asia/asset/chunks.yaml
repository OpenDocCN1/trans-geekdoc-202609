    2019 年 6 月，普华道（PwC）与美国上市航运公司的审计委员会主席举行了审计座讨会，强调了加强航运网络安全问题意识的必要性。会议强调的关键问题之一是需要一种全面的、垂直的团队协作网络安全措施，涵盖高层管理人员、董事会成员、风险技术、法律、运营和审计人员。随着船舶日益数字化、人员减少且复杂性增加，这种需求变得尤为迫。


    复杂性尤其体现在运营技术（`OT`）以及`IoT`的互联性上，这扩大了船舶的 IT 攻击面，为破坏关键运营基础设施的网络攻击开辟了道路。会议指出，大量的`OT`
    在网络风险问题方面仍处于未管理状态，并建议作为至少的行动措施，必须对其进行理解和监控。会议还指出，软件开发人员需要根据船舶的需求创建定制的具有网络韧性的软件，因为船舶的关键基础设施与其他行业不同。


    正如本书上一章提到的智能电网一样，监管机构和政策制定者在此类发展中起着作用，以缓解网络攻击。针对海员的意识培训被认为是一项重要举措，可以防止船舶成为联盟企业网络网络感染的入口。与`IoT`一样，船舶可能成为一种间接且不被察觉的方式渗透其所属的企业网络，例如持有有价值`IP`和人员数据库的母公司。海运行业有其独特的生态系统，包括实际船舶、港口、母航运公司、供应链和软件设计商，所有都需要免受网络攻击的保护。


    正如书中多次提到的，`IoT`是一种特别复杂的网络风险。Inmarsat 在 2018 年委托的一份报告指出，船东计划在未来三年内在`IoT`网络安全解决方案上花费
    250 万美元。在采用新一代技术方面，`IoT`解决方案将占据船舶 IT 预算中最大的部分。日本公司是`IoT`技术最先的采用者，而希腊船东则被认为是最保守的。在
    Inmarsat 报告的 125 名受访者中，65%的人在使用`IoT`网络安全解决方案监控燃料消耗。这一比例预计到 2023 年将上升到 100%。


    《船载网络安全指南》（`Guidelines on Cybersecurity Onboard Ships`）概述了针对船舶的多种网络威胁。之一是激进分子，包括不满员工的威胁，这可能会中断运营服务并导致声誉损失。其目标可能包括破坏或发布敏感数据、引起媒体关注或实施`DoS`（拒绝攻击）。`IP`盗取将发生在前两个目标中，而第一个和第三个目标可能涉及某种形式的网络战争，以获取用于对手招聘的人员数据，并在宣传战中使用媒体。


    第二类是寻求财务利益、商业或工业间谍活动的犯罪分子。最终收益是出售和索取被盗数据、索取系统运行权限、组织货物欺诈运输以及获取情报（例如寻找货物的确切位置）。再次，`IP`盗取是第一项的一部分，网络战争是最后一项的一部分。偷取和出售`IP`对于网络犯罪分子来说是一门利润丰厚的生意，尽管大多数追求金钱的犯罪分子并不理解`IP`的真实价值。网络犯罪分子/佣兵将利用货物的确切位置偷取军事设备，并例如参与向非法战争区域欺诈运输军事设备。


    第三类是出于挑战性而进行网络攻击的机会主义者。他们的目标是突破网络防御和获取财务利益，这两者都不涉及轻易的`IP`盗取或出于网络战争目的，因为这类黑客更感兴趣于证明自己。第四类是竞争政府和国家行为体，其行为目的是地缘政治利益和间谍活动。目标是获取知识并破坏经济和关键基础设施。`IP`盗取和网络战争都是此类网络攻击不可或缺的一部分。`IP`盗取可能包括用于对手军事技术进步的海军蓝图，协助其获得全球。。


    港和船舶是全球贸易的重要组成，全球大部分贸易通过海上活动进行。对船舶和港口使用网络攻击将对全球经济造成重大破坏。《指南》针对航运区分了两种不同类型的网络攻击。一种是非针对性攻击，即公司或船舶的系统和数据只是许多潜在目标之一。另一种是有针对攻击，即公司或船舶的系统和数据是实际目标。


    ## 新型网络风险解决方案


    以色列网络安全公司`Naval Dome`创建了一种新技术，用于保护阿什杜德港（以色列最大、最繁忙的港口）。该网络保护系统命名为`Port Dome`将防止黑客入侵阿什杜德港的`OT`系统。试点测试已于
    2020 年初开始，保护着港口整个`OT`网络，包括所有访问点和网关、运输控制系统（`VTMAS` – 船舶交通管理系统/`VTS` – 船舶交通服务）、锁和门、泊位、桥、终端起重机和存储设施。


    `Naval Dome`的 CEOItai Sela 解释说，`Port Dome`将在不对现有基础设施进行升级或更改的情况下提供最高级别的防御。阿什杜德港的人员不需要培训，`OT`系统将像安装`Port
    Dome`之前一样运行，唯一的变化是黑客将无法对这一以色列港口发动网络攻击。阿什杜德港主席表示：


    > 球港口和终端的安全对于确保能源、商品和消费品向市场的供应至关重要，我们与`Naval Dome`建立了合作伙伴关系，以确保发生网络事件不会影响港口或客户的运营。`Port
    Dome`是任何具有基于网络的`OT`系统的自动化港口的技术必需品。阿什杜德港克服了许多政府性公司面临的官僚主义障碍，现在已与创新和技术世界连接。我为领导以色列第一个应对挑战的港口感到自豪，将阿什杜德港推向了先进的全球标准。


