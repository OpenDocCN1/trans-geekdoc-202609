- fmt: "\nThere are many points of cyberwarfare engagement between the US and Iran.\
    \ In the last decade, the US has launched at least three cyberattacks at Iran,\
    \ mainly in relation to halting its nuclear missile programme, to punish Iran,\
    \ for example, for trying to subvert sanctions or for its covert and overt military\
    \ support for militants in the Middle Eastern region such as proxy wars in Yemen\
    \ against Saudi Arabia or Hezbollah in Lebanon and Hamas in Gaza. \n\nIn 2019\
    \ Iranian cyberattacks increased, giving rise to General Nakasone, head of the\
    \ US `Cyber Command`, questioning if the cyberattacks were an effective deterrent\
    \ stopping Iran. The ‘Stuxnet’ cyberattack that crippled Iranian nuclear enrichment\
    \ centrifuges nearly a decade ago is a case in point. It destroyed 1,000 of the\
    \ 5,000 centrifuges operational at the time. Iran recovered slowly and built 14,000\
    \ more centrifuges and then in counter cyberattack disabled `Saudi Aramco`’s computer\
    \ systems to devastating effect. \n\nWhile cyberattacks have slowed Iran’s missile\
    \ development, they have not deterred Iran from continuing to supply Hamas and\
    \ other terrorist groups in the region with thousands of small-range rockets.\
    \ Iran’s cyberattacks culminated in destroying two major Saudi oil facilities\
    \ in September 2019 with new-generation rockets. The Saudis knew it was Iran because\
    \ pieces of the missiles found made their origin clear. The US responded with\
    \ a cyberattack but as it is a clandestine method of warfare the Iranians may\
    \ not know about the attack for years to come. \n\nSome in `Cyber Command` are\
    \ also concerned that the relatively small nature of most of the cyberattacks\
    \ issued to date means the Iranians will not fear US attacks. They argue rather\
    \ than small-scale cyberattacks what is needed to deter Iran would be a major\
    \ cyberattack that destroys its electric grid or shuts down Iran’s major `Salman`\
    \ oil fields and refineries. The problem with the above strategy is that it would\
    \ not be easy to carry out and even if successful it could lead to a major escalation\
    \ in conflict with Iran, as well as having an undesirable impact on the civilian\
    \ population. \n\nYet, in simulations of cyberattacks that took place before the\
    \ attack on the Saudi’s oil fields, `Cyber Command` were unsure how successful\
    \ a major cyberattack would play out against Iran’s increasingly skilled cyberwarriors.\
    \ Iranian attacks to date have destroyed 30,000 of Saudi’s `Aramco` computer systems,\
    \ frozen operations at American banks with a `DoS` attack and disabled a Las Vegas\
    \ casino. They became increasingly concerned about possible Iranian interference\
    \ in US elections. \n\nThe US cyber-arsenal is very secretive as it is not desirable\
    \ to give enemies the chance to create effective countermeasures. Yet General\
    \ Nakasone stated that his cyberwarriors would be permanently engaging in skirmishes\
    \ in cyberspace undermining any perceived cyberattack while continuing with a\
    \ physical presence such as warships patrolling the seas. It was approved by Congress\
    \ that counter cyberattacks would not need to go through a lengthy decision-making\
    \ process culminating with presidential approval but allowed `Cyber Command` to\
    \ act when necessary, much like traditional military services. \n\nGeneral Nakasone\
    \ was involved in developing a cyber plan in the event of war with Iran when cyberattacks\
    \ would be used to shut down Teheran and other major cities in Iran. The idea\
    \ behind this was that the cyberattack by the US would be so devastating that\
    \ Iran would surrender without any physical military action. \n\nIran in its support\
    \ of terrorist groups in the Middle East region not only contributes physical\
    \ weapons but also, in a similar vein as it has learned from others, contributes\
    \ cyber capabilities. One of the most significant concerns is the potential for\
    \ these groups to engage attacks on critical infrastructure, which could lead\
    \ to widespread disruption and loss of life.\n"
