    # 9 保险行业


    保险行业多年来一直试图将网络风险和威胁纳入其主流保单中，但与知识产权（IP）覆盖类似，这一努力尚未取得成功。对于像网络攻击那样的充分的知识产权盗窃全面覆盖需求，保险行业一直未能满足。[¹]](#ch18.xhtml#en142)
    `Beazley` 的报告指出，随着越来越多的人居家办公（这受 `COVID-19` 疫情影响一直在增加），勒索软件网络攻击正在增长。`Beazley` 的报告指出，2019
    年以来，全球勒索软件攻击增加了 131%。² 考虑到网络攻击和知识产权盗窃的规模（特别是中小企业供应链供应商针对大型公司），目前正在采取更密集的行动。这还包括网络战争的风险，这种风险最近才被认为是对政府和公司的真实威胁。


    ## 中小企业网络保险


    在保险公司的起源地英国，分析公司 Global Data 发现，针对中小企业的网络保险仅占中小企业的 34.6%。在已涵盖的企业中，仅不到四分之一（23.9%）涵盖了人为错误。仅在
    2020 年 2 月，警方就估计有 21 起独立的与冠状病毒相关的钓鱼攻击案件，给受害者造成了 80 万英镑的损失。在这些案件中，黑客称有一份 `COVID-19`
    感染者名单，或要求受害者用 `Bitcoin` 为名单付费。制作网络风险和威胁全面保险保单的核心问题在于，其范围如此广泛，包括支付赎金金、知识产权损失、物理损坏和数据泄露等。因此，许多中小企业（四分之一之一，即
    23.9%）认为人为错误保险最可能涵盖网络攻击的多个方面。潜在的理赔类别可能包括物理损坏、声誉损失、营业中断（`BI`）、数据泄露和钓鱼。五分之一之一的中小企业（18.6%）认为员工培训是缓解网络攻击最有效的预防措施。³
    然而，网络风险保单也始终可能与中小企业认为的最大问题最为贴合，例如将网络包含在知识产权保险中，或者像他们处理人为错误那样，将网络战争保险附加在 `BI` 保险上。因此，与其为中小企业提供全方位的网络风险威胁保险保单，不如在与其业务最相关且受影响最大的类别中提供网络保险。中小企业无法负担针对网络和知识产权盗窃的近乎全面的保单（后者是由
    `Hiscox` 等伦敦大型保险公司提供的），这超出了他们的能力范围，因此与人为错误等更广泛问题相关的针对性保险覆盖可能是未来最好的出路。


    ## 员工培训解决方案


    员工培训可能是缓解内部人为错误的最佳实践，例如前面的章节提到的错误：在停车场捡起由俄罗斯特工留下的受感染 `UBS` U 盘，并将其插入美国情报相关机构的计算机中。正如本书的第
    1 章 所示，人为错误往往是黑客更容易进入目标公司的原因。在企业中，正如本书关于日本的第 3 章 所示，公司计算机网络最薄弱的切点是通过中小企业供应链。在海事领域，即上一章第
    8 章 中提到的主题，包含大量邮件往来的计算机系统网络数字化为黑客获取核心数据提供了机会。`Shipowners Claims Bureau Inc.`（`American
    Club` 的经理）创建了一种新的培训方法，通过一本名为《Cyber Awareness》的卡通手册对船员和港口终端员工进行培训。它通过卡通人物和幽默简单地解释了海员如何需要熟悉网络攻击应对措施，无论是勒索软件还是钓鱼攻击。正如本书的第
    8 章 所示，从 2021 年 1 月 1 日起，运行安全管理系统的公司将被按照 `ISM` 的规定包含网络风险管理实践。《`Cyber Awareness`》旨在为海员提供此类培训，以防止昂贵且破坏性的网络攻击，包括知识产权盗窃和来自网络战争的攻击。⁴


    ## 网络保险进展


    `IUA` 于 2020 年 3 月 16 日成立了一个新的伦敦市场委员会，首次处理非肯定性网络覆盖。此举是为了应对监管机构对包含或排除网络风险的保单日益严格的审查。网络风险管理已成为伦敦商业市场的首要任务。这个新的专门委员会旨在通过收集和共享公开信息来理解网络风险的细节，考虑模型条款对不同业务范围的影响，并分析定制网络保险与其他保险保单之间的相互作用。`IUA`
    市场服务执行官 Tom Hughes 是该新委员会的秘书。他指出，“[重大的网络事件可能对许多不同类别的业务产生广泛影响]。”


    > 公司一直在努力评估和控制其对非肯定性网络风险的敞口，这些努力仍在进行中。市场状况、不断变化的客户预期以及历史数据的缺乏都是必须审慎管理的问题。


    `IUA` 新成立的“非肯定性网络风险委员会”（`Non-Affirmative Cyber Risk Committee`）将通过识别复杂领域并在整个伦敦商业市场推广最佳实践来协助成员。⁵
    在美国，`Marsh` 报告称，2019 年美国 40%的客户购买了网络保险。⁶ 创建能够充分满足受此类影响的现代公司需求的网络风险保险保单，问题之一正如
    Tom Hughes 上述的，是历史数据的缺乏。灾难保险或海事损失保险已经演变了一百年，为承保保险保单提供了可借鉴的保险事件经验证据。网络攻击在历史上非常近期，系统数字化也较新，因此只有在收集了足够了解此类损失情况和实际市场价值的数据后，才能理解网络风险。估值是保险理赔中最困难、最复杂的领域。不同的估值方法多样，通常不遵循既定的量化体系，因此历史数据和分析对于理解索赔和损失至关重要。IP
    和网络战争都是复杂的，其内在价值尚未被完全理解。⁷


