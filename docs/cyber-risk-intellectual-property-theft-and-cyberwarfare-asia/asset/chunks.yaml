    \ and business models that create new value. Members, for example, include Preferred\
    \ Network (development and offering of deep-learning framework) and Caulis (business\
    \ to business unauthorised access detection service). \n\n## Potential security\
    \ threat from 5G\n\nGiven the demand for change in capacity through the introduction\
    \ of 5G, the introduction and expansion of network capacity means that increased\
    \ traffic lends itself to a greater number of cyberattacks. Multiple connections\
