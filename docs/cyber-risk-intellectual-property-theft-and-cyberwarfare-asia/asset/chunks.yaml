- fmt: "\nAfter the cyberattack on Hillary Clinton’s presidential campaign by the\
    \ Russians in 2016, political parties have been attempting to strengthen their\
    \ cyber defences. The current obstacle to finding the most effective cybersecurity\
    \ service is the federal law that stipulates private, corporate security companies\
    \ cannot offer free or discounted cybersecurity services to federal candidates.\
    \ If political parties wish to offer their candidates cybersecurity services,\
    \ this law also prohibits such actions as they are deemed in-kind donations. The\
    \ Federal Election Commission blocked an offer in 2019 from `Area 1`, a Silicon\
    \ Valley cybersecurity firm, to offer discounted cyber defence services to 2020\
    \ presential candidates. Senator Ron Wyden introduced a bill soon after that ruling\
    \ that would have allowed all political parties to offer their candidates expert\
    \ cybersecurity assistance but the Senate majority leader Mitch McConnell stopped\
    \ it and any like bills from even being voted on. This was despite the warning\
    \ from FBI Director Christopher Wray in April 2019 that Russian counterintelligence\
    \ efforts to disrupt the 2020 US presidential elections remain a real and continued\
    \ threat. \n\nCyber risk is a great obstacle for presidential candidates trying\
    \ to run for federal office who, unlike corporations, do not have hundreds of\
    \ millions of dollars to hire cybersecurity experts. Laura Rosenberger, the Director\
    \ of the Alliance for Securing Democracy (a group that both tries to track and\
    \ expose attempts by authoritarian regimes to undermine democratic elections)\
    \ states that allowing presidential candidates to fend for themselves without\
    \ any extra, expert assistance that can employ the latest technology such as cyber\
    \ defence countermeasures is posing challenging obstacles to free and fair elections.\
    \ Laura Rosenberger has first-hand experience of such cyberattacks as she was\
    \ foreign policy advisor to Hillary Clinton during her 2016 presidential campaign\
    \ when Russian hackers mounted a spear-phishing campaign that compromised Clinton’s\
    \ Campaign Chairman John Podesta’s e-mails in addition to those of the Democratic\
    \ Congressional Campaign Committee. \n\nWith Russia, as mentioned above, through\
    \ state actors and individual criminals showing the way or actually selling the\
    \ hacking technology, there is great scope for authoritarian rogue states, stateless\
    \ actors and domestic terrorists to interfere in the 2020 elections, which are\
    \ so important to world economic and geo-political stability. Given these inherent\
    \ risks, the Federal Election Commission in May 2020 ruled that that a non-profit\
    \ company founded by two bi-partisan former campaign managers called `Defending\
    \ Digital Campaigns` can offer its services to presidential candidates. `Area\
    \ 1` attempted to apply to offer its breakthrough new anti-phishing technology\
    \ but it was `Microsoft` that was given permission to offer cyber defence services\
    \ to its clients as it was for business purposes only. \n\nThe Federal Election\
    \ Commission has a very difficult decision to make because a less than cautious\
    \ approach could open the door to corporations or other businesses wishing to\
    \ offer cybersecurity services while really wanting to affect the election outcome.\
    \ In fact, cybersecurity issues for the Democratic caucuses in Iowa in February\
    \ 2020 have caused such concern over cyberattack that the `DNC` sent their best\
    \ disinformation and cybersecurity specialists. This was to ensure that the caucuses\
    \ do not experience hacking and serious disinformation, which can influence who\
    \ will become the Democratic presidential candidates. The `DNC` is concerned that\
    \ Russia or even Iran will try to influence the outcome in their favour. \n\n\
    Yet, after the failure of the high-tech app used to count votes as those volunteering\
    \ to run the election fairly had little understanding of how to make the new app\
    \ work, when they attempted to contact those organising the app on a bespoke helpline\
    \ they could not reach anyone as the lines were overwhelmed with other equally\
    \ bewildered election volunteers trying to reach for help. The backup in the end\
    \ that was relied on consisted of paper presidential preference sheets. There\
    \ is a call now to revert to this 19th-century technology in the future for fair,\
    \ Russian hacking-free results.\n\n## The role of Cyber Command\n\nTo cope and\
    \ counter very serious cyberwarfare attacks including potential and actual physical\
    \ infrastructural ones and political ones to do with subsequent elections, the\
    \ `US Cyber Command` was given legal sweeping powers to deal with the Russian\
    \ cyber threat. In August 2018, President Trump signed a much-anticipated executive\
    \ order named `National Security Presidential Memorandum 13`. The essence of this\
    \ Congress-generated executive order was that `Cyber Command` would be enabled\
    \ to carry out all types of countermeasures that also included infiltrating foreign\
    \ networks without presidential approval. This was a practical move as US computer\
    \ networks were under such intensive attack that the `Cyber Command` required\
    \ unfettered access to the foreign networks, such as the Russians’ in this case\
    \ to speedily counter such cyber intrusions into all areas of American life. \n\
    \nCongress authorised this freedom of action as `Cyber Command` was viewed as\
    \ part of the regular military, which included cyberspace, and their work was\
    \ to be viewed as carrying out patrols. Once given the authority, the `Cyber Command`\
    \ attacked the Russian intelligence units responsible for the bulk of the US election\
    \ hacking. During the time of the subsequent mid-term elections, they also shut\
    \ down the `Internet Research Agency` in St Petersburg, which had been responsible\
    \ for designing disinformation social media ads such as those that were found\
    \ on Facebook. `Cyber Command` also targeted the `GRU`, the Russian military intelligence\
    \ responsible for breaking into the `DNC` making their private data public. They\
    \ also sent text messages to Russian hackers and officials warning them that they\
    \ knew who they were and where to find them if they continued to make trouble\
    \ for US elections and politics in general. Much of this action was made public.\
    \ There is a good deal of discussion and concern of the role Russia will play\
    \ in influencing the 2020 US elections. Will they exploit the COVID-19 pandemic\
    \ to boost the fortunes of incumbent Trump? Will the Russian intelligence service\
    \ `SVR`, the counterpart to the US primary intelligence agency `CIA`, become more\
    \ involved in the US election disinformation campaign than the Russian military\
    \ intelligence agency, the `GRU`? As it was the `GRU` that was caught meddling\
    \ in the 2016 elections, perhaps the more skilled `SVR` will take the lead? Such\
    \ political intelligence movements have direct implications for the extent and\
    \ success of IP theft as outlined in this chapter and the use of cyberattack as\
    \ a means for military domination in the increasing move towards cyberwarfare.\n\
    \n## Public grid retaliation\n"
  raw: "After the cyberattack on Hillary Clinton’s presidential campaign by the Russians\
    \ in 2016, political parties have been attempting to strengthen their cyber defences.\
    \ The current obstacle to finding the most effective cybersecurity service is\
    \ the federal law that stipulates private, corporate security companies cannot\
    \ offer free or discounted cybersecurity services to federal candidates. If political\
    \ parties wish to offer their candidates cybersecurity services, this law also\
    \ prohibits such actions as they are deemed in-kind donations. The Federal Election\
    \ Commission blocked an offer in 2019 from Area 1, a Silicon Valley cybersecurity\
    \ firm, to offer discounted cyber defence services to 2020 presential candidates.\
    \ Senator Ron Wyden introduced a bill soon after that ruling that would have allowed\
    \ all political parties to offer their candidates expert cybersecurity assistance\
    \ but the Senate majority leader Mitch McConnell stopped it and any like bills\
    \ from even being voted on. This was despite the warning from FBI Director Christopher\
    \ Wray in April 2019 that Russian counterintelligence efforts to disrupt the 2020\
    \ US presidential elections remain a real and continued threat. Cyber risk is\
    \ a great obstacle for presidential candidates trying to run for federal office\
    \ who, unlike corporations, do not have hundreds of millions of dollars to hire\
    \ cybersecurity experts. Laura Rosenberger, the Director of the Alliance for Securing\
    \ Democracy (a group that both tries to track and expose attempts by authoritarian\
    \ regimes to undermine democratic elections) states that allowing presidential\
    \ candidates to fend for themselves without any extra, expert assistance that\
    \ can employ the latest technology such as cyber defence countermeasures is posing\
    \ challenging obstacles to free and fair elections. Laura Rosenberger has first-hand\
    \ experience of such cyberattacks as she was foreign policy advisor to Hillary\
    \ Clinton during her 2016 presidential campaign when Russian hackers mounted a\
    \ spear-phishing campaign that compromised Clinton’s Campaign Chairman John Podesta’s\
    \ e-mails in addition to those of the Democratic Congressional Campaign Committee.\
    \ With Russia, as mentioned above, through state actors and individual criminals\
    \ showing the way or actually selling the hacking technology, there is great scope\
    \ for authoritarian rogue states, stateless actors and domestic terrorists to\
    \ interfere in the 2020 elections, which are so important to world economic and\
    \ geo-political stability. Given these inherent risks, the Federal Election Commission\
    \ in May 2020 ruled that that a non-profit company founded by two bi-partisan\
    \ former campaign managers called Defending Digital Campaigns can offer its services\
    \ to presidential candidates. Area 1 attempted to apply to offer its breakthrough\
    \ new anti-phishing technology but it was Microsoft that was given permission\
    \ to offer cyber defence services to its clients as it was for business purposes\
    \ only. The Federal Election Commission has a very difficult decision to make\
    \ because a less than cautious approach could open the door to corporations or\
    \ other businesses wishing to offer cybersecurity services while really wanting\
    \ to affect the election outcome.[⁸](#ch13.xhtml#en86) In fact, cybersecurity\
    \ issues for the Democratic caucuses in Iowa in February 2020 have caused such\
    \ concern over cyberattack that the DNC sent their best disinformation and cybersecurity\
