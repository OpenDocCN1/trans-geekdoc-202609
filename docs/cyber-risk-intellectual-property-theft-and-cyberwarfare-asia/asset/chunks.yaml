    What the public has been less aware of was a covert action by the US using cyber
    tools to place codes inside the Russian power grid where they would not be seen
    but which were there in the event the US needed to undermine Russian utilities.
    Russians already had the capability to undermine US utilities by placing malware
    codes in them. The US now had the same possibility to destroy Russian utilities
    by placing a ticking time bomb that could be unleashed if the conflict between
    the two countries deteriorated into cyberwarfare with tangible physical infrastructural
    effects. These acts of potentially highly damaging infrastructural destruction
    could be as deadly as bombing in that huge numbers of civilians in hospitals or
    care homes without electricity could quickly die. The Russians, as do other countries
    such as Iran, do not wish to enter full-scale war with the US. It is too dangerous
    for all involved. Therefore, to date, cyberwarfare is being used by the Russians
    as short-term warfare to have limited and subtle effects such as interfering in
    elections while pretending not to and supporting candidates that are favourable
    to Russia. Therefore, the situation between Russia and its main adversary, the
    US, is manifested as a war of attrition, unlikely to break out into major cyberwarfare
    for the foreseeable future. Yet, examples of Russian interference can be seen
    all around the world, using cyber tools to gain geo-political influence and power
    over many countries not as advanced in cyberattack. This may still be at the stage
    of the nuclear deterrent option of we need to have one to stop being attacked
    by another entity, but will not use such a lethal option. However, cyber tools
    are being used to develop clothing and robots to perhaps engage in an actual physical
    cyberwar. At present, it is still a war of attrition and AI, the subject of the
    follow-on book from this one, may have a determining role in such an outcome.
    In a subsequent chapter (`Chapter 7`) we will also deal with the vulnerability
    of power grids to cyberattack and the importance of keeping safe from such cyber
    risk and attack.


    Notes

    1. ‘Russia is teaching the world to spy: easy-to-use technology straight from
    Moscow for any aspiring strongman – at a low price’, Alina Polyakova, *New York
    Times* (5 December 2019).

    2. ‘Russia successfully tests its “unplugged internet”’, *BBC News* (24 December
    2019). ‘Russia internet freedom: thousands protest against cyber-security bill’,
    *BBC News* (10 March 2019).

    3. ‘Britain is “at war every day” due to constant cyber attacks, Chief of the
    Defence Staff says’, Dominic Nicholls, *The Telegraph* (29 September 2019).

    4. ‘Facebook identifies Russia-linked misinformation campaign’, Adam Satariano,
    *New York Times* (17 January 2019).

    5. ‘As protests in South America surged, so did Russian trolls on Twitter, U.S.
    finds’, Lara Jakes, *New York Times* (19 January 2020).

    6. ‘GozNym cyber-crime gang which stole millions busted’, Jane Wakefield, Technology
    Reporter, *BBC News* (16 May 2019).

    7. ‘“Chaos is the point”: Russian hackers and trolls grow stealthier in 2020’,
    Victor J. Blue, *New York Times* (10 January 2020).

    8. ‘The only safe election is a low-tech election’, Kevin Roose, *New York Times*
    (4 February 2020).

    9. ‘Election rules are an obstacle to cybersecurity of presidential campaigns’,
    Nicole Perlroth and Matthew Rosenberg, *New York Times* (6 June 2019).

    10. ‘DNC heads to Iowa to help protect caucuses from digital attacks and disinformation’,
    Erin Ayers, *Advisen Cyber News*, *Digest Edition* (31 January 2020).

    11. ‘Can Russia use the coronavirus to sow discord among Americans?’, Thomas Rid,
    *New York Times* (16 March 2020).

    12. ‘US escalates online attacks on Russia’s power grid’, David E. Sanger and
    Nicole Perlroth, *New York Times* (15 June 2019).


    # 5 China


    China (People’s Republic of China or PRC) and its acolyte state North Korea use
    cyberattack and hacking, mainly on the state level, for a wide variety of purposes.
    The major use is to steal IP to keep up with advances in technology in the US,
    UK and other Western-allied countries with advanced technology such as Israel.
    As a good deal of the IP stolen has to do with military technology, the other
    use is to become militarily dominant through cyberwarfare tactics on a geo-political
    level.


    ## IP theft


    There is a pattern of behaviour that typifies China’s theft of IP. The Department
    of Justice (DOJ) has been investigating IP theft for more than a decade. The Obama
    administration reached an agreement with China to halt this theft. In due course
    China no longer honoured this agreement leading to increased IP theft and the
    use of trade talks and punitive tariffs to try to force China to agree to stop
    stealing US IP. Yet, using trade talks such as those of the trade meeting of the
    World Trade Organization (WTO) in December 2018, when the United States accused
    China of circumventing the law to advance its economic interests, did not accord
    with the views of law-enforcement officers. While perhaps agreeing in principle
    that China engages unfair advantage through subsidising and maintaining excess
    capacity, in steel production for example, dumping these state-subsidised products
    cheaply on other countries forcing their producers out of business, the DOJ at
    that time did not make decisions to intervene on the basis of political situation.
    The DOJ for a decade before this WTO meeting has been using the rule of law through
    criminal case development, prosecuting those who as part of Chinese companies
    and government have been through cyberattack means means stealing IP, trade secrets
    and military data to build China into a major global player. In December 2018,
    the DOJ, under the leadership of Deputy Attorney General Rod Rosenstein, unsealed
    an indictment that broadly outlined a campaign of many years that found China
    stealing US technological advances through IP theft and trade secrets from a wide
    variety of industries, which had assisted the Chinese government in eroding the
    US military’s pre-eminence and undercut international competitors.


