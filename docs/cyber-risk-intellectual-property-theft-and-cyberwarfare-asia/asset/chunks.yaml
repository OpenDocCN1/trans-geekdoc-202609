    \ 740 million. In the UK the ‘National Cyber Security Strategy 2016–2021’ has\
    \ (1) Defend, (2) Deter and (3) Development, the last of which references R&D.\
    \ It has identified the important areas of IoT, the smart city, data and information\
    \ protection, automation, machine learning and AI in its ‘cyber security science\
    \ and technology strategy’. Under the framework of Academic Centre of Excellence\
    \ (ACE) and the initiative of the government, universities that have passed the\
    \ approval criteria are leading the promotion of R&D. The ‘Israel Cyber Security\
    \ Strategy’ has (1) Robustness, (2) Resilience and (3) Defence. R&D is positioned\
    \ as part of capacity development to enable these aims. The Israeli government\
    \ has established a cybersecurity research centre that focuses on various areas\
    \ of policy and technology at Ben-Gurion University and Tel Aviv University. There\
    \ are four pillars in Singapore that support cybersecurity R&D: (1) flexible infrastructure\
    \ development, (2) maintenance of safer cyberspace, (3) development of an active\
    \ cyber eco system and (4) strengthening international partnership. R&D is positioned\
    \ in point 3. The Singaporean government formulated an implementation plan until\
    \ 2020 in its ‘National Cybersecurity R&D Programme’. The Singapore cybersecurity\
    \ consortium operates as a collaborative organisation between industry, the government\
    \ and academia \n\n## Federal cybersecurity R&D strategic plan in the USA\n\n\
    The ‘2016 Federal Cybersecurity Research and Development Strategic Plan’ identifies\
    \ the most relevant areas of R&D to focus on. It formulates an implementation\
    \ plan on an annual basis and promotes it to industry, the government and academic\
    \ institutions. The plan defines four categories of R&D focus which are Deter,\
    \ Protect, Detect and Adapt while providing short-term, medium-term and long-term\
    \ R&D approaches. In addition, the following areas will be focused on as advanced\
    \ technology to make the above categories more comprehensive: 1Cyber physical\
    \ systems especially IoT 2Cloud computing 3High-capacity calculation 4Autonomous\
    \ systems 5Mobile devices The four categories are as follows. \n\n## Short term\n\
    \n### Deter\n\n•Measurement criteria of attack levels •Assessment of relationships\
    \ between prevention of attack and criminal/economic sanctions "
