    \ and there are four categories in AI-related topics such as attacks using AI,\
    \ autonomous attacks by AI, attacks on AI and security measures using AI. As AI\
    \ is a relatively new technology possible cyber breaches are explored in relation\
    \ to issues of liability especially in the event of accidents occurring because\
    \ of seemingly independent actions taken by AI mechanisms. This could be, for\
    \ example, an algorithmic quirk in a cyberwarfare robot taking potentially lethal\
    \ action. All countermeasures and policies include support for general society\
    \ within the ‘cybersecurity eco system’. This is akin to innovative eco systems\
    \ in general but in this case one in which the protection afforded by cybersecurity\
    \ will aid the creation of innovation, which will produce value. This eco system\
    \ in turn will be used for investment, R&D and human resources, leading to further\
    \ innovation in society. Each citizen is expected to have awareness and understanding\
    \ of cybersecurity measures and deal with risks autonomously in their daily life,\
    \ such as washing their hands to prevent infection or observing traffic lights\
    \ to prevent a car crash. Therefore, cyber defence is not only proactive but also\
    \ integrated fully into society at every level. Implementation of active preventive\
    \ measures against cyber threats includes the amendment of NICT law (National\
    \ Institute of Information and Communications Technology). This is an innovative\
    \ approach in that the law allows for investigation into potentially vulnerable\
    \ IoT devices before an incident takes place, not after it occurs. Another innovation\
    \ is the CSC, which accommodates private-sector involvement in addition to governmental\
    \ bodies and critical infrastructure vendors.[^(10)](#ch12.xhtml#en74) \n\n##\
    \ Performance and assessment of cybersecurity measures, 2018\n\nSome of the results\
    \ of actions taken in 2018 include a workshop of ‘cybersecurity management guidelines’\
    \ and a handbook on information protection, which aims to enhance awareness among\
    \ corporate executives and senior management. Other actions taken involve a public\
    \ hearing on ‘Cyber physical security measures framework’ that is related to safe\
    \ supply chains, an effort to establish safe IoT systems, provision of an attack\
    \ early-detection tool through IPA and JPCERT/CC, further strengthening of the\
    \ information sharing system and risk assessment, protection of IT assets and\
    \ the research environment in higher education and further promotion of risk management\
    \ among critical service vendors in preparation for the Olympics. There is also\
    \ a ‘Proven in Japan’ concept for verification and assessment of new security\
    \ technologies including IoT devices in addition to further follow-up work in\
    \ relation to the already-held Japan–ASEAN (Association of Southeast Asian Nations)\
    \ cybersecurity policy conference. As for the CSC, its operation commenced from\
    \ May 2019 with the second and third member application opened in 2019 as well.\
    \ The main ministries aimed to achieve in 2019 the enhancement of awareness of\
    \ cybersecurity, promotion of investment in cybersecurity, strengthening cybersecurity\
    \ businesses that support innovative promotion of supply chains that produce value,\
    \ support for SMEs, systematisation and internationalisation of standards in IoT,\
    \ further protection of critical infrastructure, further promotion of information\
    \ sharing, international cooperation and collaboration on cybersecurity, promotion\
    \ of R&D and human resource implementation of cybersecurity awareness throughout\
    \ all departments. \n\n## Risk management practice\n\nIn Japan there is concern\
    \ that the only way to mitigate cyber risk in all its forms and in relation to\
    \ IP and cyberwarfare is to prepare all those involved so they are an integral\
    \ part of the countermeasures. Stakeholders as they are referred to in Japan need\
    \ to exchange both information and opinions on how to work internally to prevent\
    \ cyberattacks. Both the private sector and the government must work together\
    \ to protect critical infrastructure. Promotion of risk communication and consultation\
    \ is encouraged among top management, cybersecurity departments, departments of\
    \ control and information systems using IT e.g. operational control (OT) or IoT,\
    \ user departments and other internal stakeholders. The CEPTOAR council, which\
    \ is made up of independent bodies including government organisations, is used\
    \ for cross-sectoral promotion of the enhancement of information and opinion exchanges\
    \ in cooperation with diverse stakeholders while collecting information necessary\
    \ for studies and analyses of new risk sources and risks. Top-level management\
    \ are viewed as responsible for showing leadership in cybersecurity matters as\
    \ individuals contributing to society as a whole. This also means involving all\
    \ those in their supply chains including business partners, subsidiaries and affiliated\
    \ companies. They should also be involved in incident readiness at all times and\
    \ if an incident occurs, dealing with it promptly from the perspective of gaining\
    \ trust and encouraging feelings of security among stakeholders. Senior management\
    \ need to continually procure and maintain budgets, systems and personnel to secure\
    \ all the above measures and allocate them in the most risk-free manner. \n\n\
    ## Development of human resources"
