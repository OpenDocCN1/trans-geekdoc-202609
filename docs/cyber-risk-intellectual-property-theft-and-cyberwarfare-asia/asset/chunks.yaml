    \ was based on the research of senior maritime stakeholders from over 50 countries,\
    \ found that cyberattacks and data theft were the weak links in the maritime industry.\
    \ Cybersecurity was regarded as the most pressing for shipping of 17 global issues\
    \ highlighted. Compared to aerospace and aviation industries, the International\
    \ Maritime Organization (IMO) was late in viewing cybersecurity as a pressing\
    \ need for the maritime sector. The IMO in 2016 issued interim guidelines on ‘Maritime\
    \ cyber risk management’ but has since chosen to amend its general security codes,\
    \ the International Ship and Port Facility Security Code and International Security\
    \ Management Code to include amendments on cybersecurity but not new guidelines.\
    \ These will not be enforced until 1 January 2021. This has left BIMCO (Baltic\
    \ and International Maritime Council) and the US Coast Guard, for example, to\
    \ cover maritime cybersecurity issues, which are outlined in this chapter. The\
    \ June 2017 NotPetya cyberattack was the one that increasingly focused the attention\
    \ of the maritime industry on being prepared through countermeasures to cyberattack.\
    \ Danish shipping company Maersk lost between US$ 250 million and US$ 300 million\
    \ because of this brutal cyber hacking that closed down IT systems across multiple\
    \ sites and businesses. Luckily for the maritime industry, shipping companies\
    \ did not rush and spend millions on cyber solutions without carefully assessing\
    \ the vulnerabilities. Below are outlined a number of vulnerabilities and solutions\
    \ undertaken by shipowners and port owners. John Boles, the former head of the\
    \ FBI’s global cyber operations and investigations division and currently director\
    \ of global consultancy Ankara, noted that the lack of regulatory pressure in\
    \ the international maritime sector has given a false sense of security. Like\
    \ in the banking and power grid sectors, it is the level of lack of information\
    \ sharing and the under-reporting of cyberattacks that he finds of greatest concern.\
    \ However, as in other sectors, those owners of shipping companies and ports have\
    \ the tendency to believe their reputation will be damaged if they are found to\
    \ be victims of cyberattack, which will undermine clients’ trust in them.[²](#ch17.xhtml#en122)\
    \ Therefore, with increased digitisation and greater connectivity such as IoT,\
    \ cyber-risk mitigation measures need to be pursued. \n\n## Acceleration of maritime\
    \ cyberattacks"
