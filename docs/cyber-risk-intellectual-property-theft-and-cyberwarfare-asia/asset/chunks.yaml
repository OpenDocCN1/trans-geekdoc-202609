    \n## Future considerations\n\n## COVID-19 future cyberattacks\n\nThe global pandemic\
    \ caused by coronavirus or COVID-19 that began in Wuhan in China through eating\
    \ wild animals that harbour coronavirus from an unhygienic, live wildlife food\
    \ market has ravaged the global economy and now global health. Can it cause even\
    \ greater problems for the global economy and social situations such as the potential\
    \ cancelling of the Tokyo Olympics, which would cause further damage to the Japanese\
    \ economy? It seems it can and in relation to cyber risk, threat and attack. As\
    \ unprecedented numbers of people are working from home, the problems of maintaining\
    \ adequate cybersecurity are burgeoning. Phishing attacks have risen by 667% in\
    \ the UK since the start of March 2020. This estimation was based on calculations\
    \ by the security firm Barracuda Networks, which saw the 137 coronavirus phishing\
    \ e-mails identified in January 2020 and the 1,188 in February 2020 explode to\
    \ 9,000 in March 2020. These phishing attacks are the work of malicious hackers\
    \ who are bombarding home-based workers with coronavirus alerts from fake charities\
    \ purporting to stop the spread of the virus. The alerts are sent by hackers who\
    \ try to extort information or money from recipients. Despite this, according\
    \ to Barracuda Networks the 467,825 COVID-19 related phishing e-mails only account\
    \ for 2% of cyberattacks worldwide from the beginning of March 2020.[¹](#ch19.xhtml#en160)\
    \ Yet, as COVID-19 continues, the scale and amount of cyberattacks in all their\
    \ forms as mentioned in this book are increasing in scope and potential for damage.\
    \ Working from home accelerates the potential for cyberattack as home computers\
    \ often lack the security measures exercised and available in the workplace. This\
    \ can facilitate further stealing of IP and cyberwarfare-related cyberattacks\
    \ that target the names and particulars of military personnel and can cause infrastructural\
    \ damage. \n\n## Cyberattacks increase but so does future awareness"
