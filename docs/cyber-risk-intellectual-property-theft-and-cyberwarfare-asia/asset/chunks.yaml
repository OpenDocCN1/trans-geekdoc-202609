    美国海岸卫队（USCG）在 2019 年 5 月 24 日的一份安全公告中警告称，针对商业船只的钓鱼攻击和恶意软件等网络攻击再次频发。黑客试图使用看起来像官方港口国管当局的电子邮件地址，以获取如官方到达通知等敏感数据。此外，黑客正在安装会破坏船载计算机系统的恶意软件。


    另一一起针对船舶 IT 系统的重大网络攻击于 2019 年 2 月在美国发生。在该案例中，一艘开往纽约和新泽西港的国际航深水船舶报告称，其遭遇了一场影响船载网络的重大网络安全事件。由美国海岸卫队领导的网络安全专家做出了响应，并对船载网络和关键控制系统进行了分析。跨部门小组得出结论，尽管恶意软件严重了船载计算机系统的功能，但关键的船舶控制系统未受影响。然而，跨部门响应小组发现，该船在运行时没有有效的网络安全防护措施，这导致关键的船舶控制系统暴露在许多漏洞之中。


    在此次网络攻击之前，船员对船载网络带来的网络安全风险已是为人知。因此，大多数船员克制使用船载计算机检查个人电子邮件、进行在线购物或查询银行账户。然而，船载网络仍被用于日常行政事务，如更新电子海图、管理货物数据以及与岸上设施、引航员、代理和海岸卫队通信。目前尚清楚这艘特定船舶是否代表了当前深水船舶的网络安全现状。然而，这引发了人们的担忧：导航系统和电子海图是否得到了充分的网络安全防护措施的保护。


    美国海岸卫队发现，用网络安全措施保护这些系统，与控制船舶的物理访问或对传统机械进行常规维护同样重要。美国海岸卫队发布了一份安全通知，强调海事界必须认识并实施基本的网络安全防护措施，以适应新技术和日益增长的网络风险。为了提高船舶和设施的韧性，并保护其运行水道的安全，美国海岸卫队强烈建议船舶设施所有者、运营商和其他相关方遵循若干基本防护措施以提高其网络安全。这些包括：


    - **网络分段**：“扁平化”网络允许攻击者轻松向连接到该特定网络的任何系统移动。解决方案是将网络划分为“子网络”，使攻击者更难访问关键系统和设备。

    - **用户配置文件和密码**：消除多名人员使用通用登录详情的情况。为每位员工创建网络配置文件。要求员工输入密码和/或插入 ID 卡以登录船载设备。将访问/权限限制在允许每个用户完成其工作所需的级别。管理员账户应节节使用，且仅在必要时使用。

    - **使用外部介质时要加小心**：上述网络攻击表明，在码头通过 `USB drive` 传输货物数据是一种常见做法。那些 `USB drives` 经常被直接插入船载计算机中，而没有事先进行恶意软件扫描，或确认来源是否可靠。在将任何外部介质插入任何船载网络之前，必须在独立系统上对其进行恶意软件扫描。

    - **安装基础杀毒软件**：安装并定期更新基础杀毒软件非常重要。

    - **不要忘记打补丁**：打补丁并非易事，但它包含了网络安全就绪的核心。影响操作系统和应用程序的漏洞在不断变化，使得补丁成为有效网络安全不可或缺的一部分。


    在与上述纽约和新泽西港网络攻击相关的安全警报中，美国海岸卫队指出，维持有效的网络安全不仅是一个 IT 问题，更是 21 世纪海事环境中的基本操作要求。因此，美国海岸卫队强烈鼓励所有船舶设施所有者和运营商开展网络安全评估，以更好地理解和评估其网络漏洞的范围。


    美国海岸卫队提供的许多建议似乎显而易见，但这种必要性指向了海事部门存在的底层网络安全就绪不足问题。在将 `USB` 插入船舶计算系统之前进行测试似乎是理所当然的。然而，正如本书的
    `第 1 章` 提到的，一次网络事件是因为对 `USB sticks` 的疏忽引发的，当时一名俄罗斯特工在美国情报人员使用的停车场内丢弃了 `USB sticks`。这些
    `USB sticks` 被这些员工捡起并插入了他们的工作电脑，导致计算机系统感染了恶意软件，为俄罗斯特工提供了进入个人数据和敏感数据的入口。这种疏忽的行为就可能导致知识产权、商业秘密和网络战争计划被盗取。


    尽管有关于如何阻止网络攻击的建议，但一家 IT 安全公司 Dualog（航运专业公司）在 2018 年第二季度发现，在扫描了总计 1930 万封电子邮件后，有
    160,482 封被识别为带有不安全网站链接的钓鱼邮件，而 140,010 封是带有病毒和多种类型钓鱼恶意软件的恶意软件。网络攻击是全球性的，黑客通过来自不同国家的机器人插入恶意软件。随着通过电子邮件附件发送到船舶的数据日益增加，问题变得愈发严重。


    ## GPS 漏洞


    '
- fmt: '

    Ships have had their GPS systems attacked by hackers as noted in previous books
    by the author of this book, in which a number of examples of GPS manipulation
    by hackers on ships have occurred. One was the practice of Somali pirates around
    the Horn of Africa manipulating the GPS systems of ships, in this greatly frequented
    waterway, to make them navigate into Somalian waters so crews could be held for
    ransom and anything valuable on the ships would be stolen. Another example was
    in Singapore in 2018 whereby a US warship, the `Admiral John McCain`, was manipulated
    through `GPS` to nearly collide with a Nigerian oil tanker. The latest of such
    GPS manipulation was seen in 2019 with an increasing number of GPS spoofing breaches
    taking place in and around coastal ports in China (PRC).


    In July 2019 an American containership navigating the `Huangpo River` near the
    port of Shanghai had ships appearing and disappearing on its electronic chart
    display information system screen. As it was nearing its berth in Shanghai its
    `GPS` systems lost all signals. The Centre for Advanced Defense Studies, which
    is a non-profit organisation analysing global conflict and security, conducted
    an investigation into `Automatic Identification System (AIS)` data in the area
    and found that this had been happening for months with hundreds of foreign ships
    being spoofed and losing GPS signalling while traversing the waters of the `Huangpo
    River`. Days and weeks of data collection that unlike traditional GPS spoofing
    moves signals all to the same position confusing ships, this latest cyberattack
    moved all signals into a circle. Spoofing is more easily detected around coastal
    areas because of the dense availability of AIS data. In 2017, a number of ships
    were spoofed in the Black Sea. This was most likely occurring elsewhere but was
    too difficult to detect because of a lack of AIS data.


    Both GPS jamming (blocking of a satellite signal so a receiver can no longer operate)
    and spoofing (making a GPS receiver show a false position) are increasing and
    have the ability to cause confusion in a ship’s wheelhouse, especially when navigating
    through a busy port. GPS malfunctioning due to cyberattack is very dangerous for
    vessels and shipping in general. The ship’s master can use a number of remedies
    to try and rectify the situation. These are: plot manually the vessel’s last-known
    position; switch to a primary or secondary form of navigation; log an entry showing
    exactly where the `GPS` failure occurred; use all means of navigation available
    to navigate safely; report all failures to the appropriate authorities immediately.


    ## Navy contractors targeted


    Another branch of maritime trade that is being attacked for both the purposes
    of IP theft and cyberwarfare are naval contractors. Chinese hackers have been
    involved in large-scale cyberattacks to steal everything from ship maintenance
    data to missile plans. In June 2018, a major breach of a naval contractor occurred
    stealing secret plans to build a super-sonic anti-ship missile to target submarines.
    Such a prototype would have involved IP theft. The hackers had breached an undisclosed
    sub-contractor with the US Navy’s `Naval Undersea Warfare Center` in Newport,
    Rhode Island. The breach was so severe that Navy Secretary `Richard Spencer` ordered
    a review of his branch’s cyber vulnerabilities. During an 18-month period hackers
    had through cyber breaches obtained access to more than five items deemed critical
    information to keep the US Navy with a military advantage. The Chinese military
    and government denied involvement but Navy officials stated the hack had all the
    hallmarks of a Chinese cyberattack that was seeking weaknesses in US naval defences
    that could be exploited through cyberwarfare means without a shot being fired.


    ## Internal threat


    The demand for stealing IP blueprints for weapons and sensitive technology, often
    associated with naval and maritime activities, is increasing as are potential
    adversaries. During the Cold War period it was just the Soviet Union but now,
    as outlined in this book, it is China, Russia, North Korea and Iran that are increasingly
    engaged in such activities. Since 2013 in the US, roughly 3,000 people have been
    caught by the `DHS` attempting to smuggle weapons and sensitive technologies such
    as circuits for ballistic missiles. Federal agents also seized more than 7,000
    items such as jet engine parts and microchips that were to be smuggled out to
    adversaries. Compounding the problem, as with all hybrid cyberwarfare attacks,
    is the internal enemy working within a country or shipping organisation who are
    stealing IP or smuggling parts out of defensive military services such as the
    US Navy. A case in point was a Texas businessman who was paid US$1.5 million to
    buy radiation-resistant circuits for space programmes in Russia and China. The
    businessman named as `Peter A. Zuccarelli` was working with a smuggling ring headed
    by an American citizen born in Pakistan. Court documents verified that `Mr Zuccarelli`
    falsified shipping documents and mislabelled the circuits as being for touch-screen
    computers. He was sentenced to four years in prison in January 2018.


    ## Cyberattack insurance cover

    '
