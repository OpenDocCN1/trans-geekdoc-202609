- fmt: '

    The hacking cyberattack discovered in September 2018 into the Marriott Hotels
    chain collecting the personal details of 500 million guests by Chinese intelligence
    units involves theft of personal data, espionage and is related to cyberwarfare
    and IP breaches. Other targets were the data of millions of security clearances
    and health insurers. The Marriott Hotels chain intrusion was very worrying for
    the US government because this is where American government and military officials
    stay. The Marriott cyberattacks signalled that China had reneged on the 2015 agreement
    between former President Barack Obama and President Xi.


    A spokesman for China’s Ministry of Foreign Affairs, Geng Shuang, even denied
    any knowledge of the Marriott cyberattack stating: ‘China opposes all forms of
    cyberattack and cracks down on it in accordance with the law.’ He further stated:
    ‘If offered evidence, the relevant Chinese departments will carry out investigations
    according to the law.’


    The hacking into the Marriott computer systems, coupled with the codes and patterns
    used, pointed to Chinese intelligence units rather than a commercial or financially
    motivated hack. The latter would have been interested in the credit cards stolen
    but not the 327 million passport details, which includes pictures of individuals,
    what borders and countries they were visiting. This was coupled with security
    clearance forms that contain information concerning finances and what foreigners
    the passport holders have met with and where they travelled to. This is exactly
    the kind of information Chinese government agents would require to identify American
    spies and the Chinese nationals they were speaking to. It would also lead to Americans
    who may be ripe for recruitment as spies for the Chinese and, in tandem with the
    stolen data from health insurers such as Anthem, the travel habits of millions
    of Americans would be revealed.


    The Obama administration was so alarmed already in 2016 by Chinese efforts to
    amass the personal data of Americans that the US$ 14 billion bid by the Chinese
    Anbang Insurance Group Co. to acquire the Starwood Hotel & Resorts worldwide was
    blocked by the Committee on Foreign Investments in the United States. Instead
    the Marriott Hotels chain bought the Starwood group for US$ 13.6 billion. However,
    by then it was too late as Starwood’s data had already been stolen by Chinese
    intelligence unit hackers. Marriott became the largest hotel chain in the world
    but only disclosed the massive data breach on 30 November 2018.


    ### Recruitment of Foreign Spies


    Chinese intelligence units are the most active of their counterparts in other
    countries in recruiting foreign spies. One common source they recruit from is
    LinkedIn, a website owned by an American that seeks to introduce those operating
    in similar businesses or in research. Sites such as LinkedIn are preferred because
    Chinese agents can do this from Beijing, issuing a false profile and pretending
    to be from a corporate recruitment agency, for example. There are many cases of
    such recruitment being reported.


    One such case involved a former CIA and Defence Intelligence Agency employee Kevin
    Patrick Mallory. He was sentenced to 20 years in prison for spying for China.
    The FBI stated that the recruitment of Mallory took place in February 2017 after
    he responded to a LinkedIn message from a Chinese intelligence agent who pretended
    he was a representative of a think-tank. Another well-reported case concerned
    Yanjun Xu who was charged with economic espionage by the DoJ after he recruited
    a General Electric Aviation engineer through correspondence on LinkedIn.


    ## Equifax cyberattack


    On Monday 10 February 2020, US officials from the DoJ issued indictments alleging
    that four members of China’s military had stolen trade secrets and the personal
    data of 145 million Americans from Equifax. This occurred in 2017, targeting one
    of the largest credit reporting agencies in the US. The DoJ believe this theft
    of data was carried out by Chinese military and intelligence units to better target
    intelligence officers and officials.


    In response, Wu Qian, on behalf of China’s Ministry of National Defence, stated
    that their members were not responsible for such thefts and claimed that the Americans
    were legally bullying. This gave a signal to the DoJ that the Obama administration
    agreement to cease cyberattacks for the purposes of stealing IP, trade secrets
    and personal data was no longer being adhered to. Mr Wu also mentioned in his
    response that according to Edward Snowden, the former NSA employee who defected
    to Russia while sending many sensitive e-mails from the NSA for publication on
    Wikileaks, had confirmed through the e-mail leak that the US has also actively
    engaging in such espionage.


    The Equifax cyberattack was noteworthy because of the scale of the hack. Equifax
    holds data on 820 million American consumers including some Canadian and UK clients
    and 91 million businesses. The nine-count indictment accuses the Chinese military
    hackers identified as Wu Zhiyong, Wang Qian, Xu Ke and Liu Lei, who are allegedly
    members of the People’s Liberation Army’s 54th Research Institute, a part of the
    Chinese military, of stealing trade secrets. This includes data compilation and
    database designs, the latter being IP. The four accused Chinese hackers spent
    weeks in the company’s computer system, breaking into security networks and trawling
    for personal data.


    Geng Shuang, who spoke on behalf of the Chinese Foreign Ministry, stated that
    the Chinese government and military never steal trade secrets and repeated again
    that China is the victim of US cyberattack. Yet, the information stolen was never
    used to defraud the victims’ credit cards or bank accounts, which usually points
    to a state actor such as China who are more concerned with stealing IP and gathering
    intelligence for future cyberwarfare activities.


    Although the Equifax CEO Mark Begor was grateful that US law-enforcement agencies
    takes cybercrime seriously and does everything possible to locate the perpetrators,
    Equifax was forced to pay US$ 700 million (£541 million) to the Federal Trade
    Commission for failing to safeguard adequately their information systems and not
    informing their customers quickly enough.

    '
