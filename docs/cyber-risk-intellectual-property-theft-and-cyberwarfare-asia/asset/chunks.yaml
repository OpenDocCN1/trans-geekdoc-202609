    The third major case that involves the building of communications infrastructure
    for 5G globally is viewed by most countries in the West as having the potential
    to invite Chinese access to all their technology and military plans. This is because
    the Chinese government has backed `Huawei` from its inception with massive state
    cash injections to allow it to develop the next generation of telecommunications,
    hence 5G. This is one of the most comprehensive steps in the development of generational
    telecommunications and `Huawei` is ahead of all countries globally, including
    the US. It supplies smartphones to 170 nations at a cheaper cost than its rivals
    and dominates the supply of inexpensive networking equipment globally. The arrival
    of 5G means `Huawei` is already in situ in most parts of the world to build on
    its own networking equipment and up take of smartphones dominating all the networked
    equipment known as the `IoT`. This means that the Chinese government and military
    can gain intimate access to `IP`, trade secrets and personal data through `Huawei`-installed
    and embedded network infrastructure. The founder `Zen Rengfei` and his eldest
    daughter `Meng Wanzhou`, `Huawei`’s Chief Financial Officer, have insisted that
    they are an independent Chinese company that would not give the Chinese government
    and military access to `IP`, trade secrets or personal data. This is despite `Meng
    Wanzhou` being arrested in Vancouver in the latter part of 2018 for fraud and
    breaking sanctions on the behest of US officials who are still trying to extradite
    her from Canada to the US. Many, especially those from the intelligence communities,
    such as the five eyes (US, UK, Australia, New Zealand and Canada) have severe
    doubts this is the truth as the Chinese government have invested so heavily in
    `Huawei` and continue to do so.


    ### Huawei IP theft


    Such suspicions have intensified culminating in an indictment on Thursday 13 February
    2020 that was unsealed in the Eastern District of New York, in which the US `DoJ`
    alleged that `Huawei` had engaged in racketeering by stealing the trade secrets
    of six major US telecommunications companies. The `IP` stolen included manuals
    for wireless technology and source codes. The six companies were not specified
    but from previous court filings they most likely are `Motorola Solutions`, `Quintel
    Technology`, `Cisco Systems`, `T-Mobile`, `CNEX Labs` and `Fujitsu` (US branch).
    The particular charges of these indictments related to efforts by `Huawei` and
    its subsidiaries over decades both in the US and in the PRC to misappropriate
    `IP` from the six US technology companies. However, the most immediate worry for
    US officials is that the 5G superfast network will control communications that
    are already working on an `IoT` basis including critical infrastructure such as
    the operations running military bases, factories and autonomously run vehicles.


    ### Damage limitation


    The US government has been scrambling to carry out damage limitation in light
    of its lack of investment in R&D for 5G technology. The US has been trying to
    limit Chinese companies’ access to their new technology and now is working to
    restrict Chinese access to robotics, AI developments, advanced software and even
    sharing research. Coupled with this is intense pressure on European allies to
    not adopt `Huawei` 5G network equipment technology. To date `Huawei` will not
    be asked to participate in 5G development in the UK. As the former president of
    Estonia `Toomas Hendrik Ilves` asked:


    > Many of us in Europe agree that there are significant dangers with `Huawei`,
    and the U.S. for at least a year has been telling us, do not use `Huawei`. Are
    you offering an alternative? …What is it that we should do other than not use
    `Huawei`?


    In July 2020, the Interior Minister of Germany `Horst Seehofer` announced that
    `Ericson` and `Nokia` can replace `Huawei` for 5G and that all EU members feel
    the same.


    ### Alternatives to Huawei’s 5G


    The only viable alternative to `Huawei` at present is Sweden’s `Ericsson` and
    Finland’s `Nokia`. They have provided network equipment for years to many European
    countries but they do not have government R&D support to extend their 5G network
    equipment to 5G at a low price that can compete with Chinese government subsidised
    `Huawei` 5G network equipment. A possible alternative, harnessing the power of
    SME companies as well, is a plan being discussed among wireless carriers that
    involves a common and standard architecture for both software and hardware being
    developed by the US carriers. This would allow SME companies to each produce a
    small part of the standardised 5G network equipment, undercutting `Huawei’s market
    dominance. The Attorney General `Barr` expressed his scepticism of this plan but
    in real terms senior lawmakers from the Senate Intelligence Committee in the form
    of `Richard M. Burr`, Republican of North Carolina and `Mark Warner`, Democrat
    of Virginia in January 2020 already introduced a Bill to allocate US$ 750 million
    to create such a US shared patent pool system. In addition, another US$ 500 million
    will be allocated to support a trusted and secure 5G network equipment system
    globally. `Larry Kudlow`, Director of the National Economic Council, reported
    to the `Wall Street Journal` in February 2020 that the US government was supporting
    the development of software to undercut `Huawei’s efforts`.


    Additionally, the US has taken a number of countermeasures to secure `IP`. These
    include limiting access of Chinese companies to American technology, limiting
    or revoking the visas of Chinese students studying science and technology in the
    US and those considered to be spying for China. The US Commerce Department in
    May 2019 placed `Huawei` and its affiliate companies on a list of companies deemed
    to be a risk to US national security. This listing will prevent `Huawei` from
    buying American parts and technology without US approval. The US government is
    being supported by telecommunications companies that view `Huawei’s practices`
    unacceptable. British Telecom (`BT`), the largest such company in Britain, is
    tearing out existing `Huawei` network equipment after purchasing another company
    that was based on the Chinese company network. `BT` was concerned by British intelligence
    warnings of growing risks from `Huawei’s 5G networks`. `Vodafone Group`, which
    is based in London, placed a temporary embargo on buying `Huawei` 5G network equipment.
    Also, in 2019 `Verizon` and `AT&T` (American Telephone and Telegraph) stopped
    selling `Huawei` smartphones in their stores after it emerged that `Huawei` was
    using its own manufactured chips instead of using American or European chips.
    The US `NSA` was alerting telecommunications companies that `Huawei` was steadily
    replacing all parts of their networking equipment and smartphones with Chinese-made
    products that would mean, in real terms, that `Huawei` and the Chinese government
    would have total control over the 5G network allowing them to interfere and extract
    personal data, `IP` and trade secrets without users knowing. This would mean that
    intelligence agencies like the `NSA` could not warn American companies or of allies
    such as the Europeans that they were being spied on by the Chinese government
    and military by inserting malware or other covert cyberattacks.

