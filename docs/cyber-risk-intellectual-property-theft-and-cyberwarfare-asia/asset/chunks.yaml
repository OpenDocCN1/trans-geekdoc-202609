    According to statistics from the UK Department for Digital, Culture, Media and
    Sport (DCMS), nearly a half of businesses in Britain have experienced a cyberattack
    that attempted to or breached their security measures. This was for the past 12
    months from March 2019, with 68% of SMEs and 75% of large companies being the
    target of cyberattacks. The 2019 DSMC report noted that the increase in cyberattacks
    is most likely linked to an increase in cybersecurity awareness. Out of the 46%
    that stated they were being subject to cyberattack, the majority noted that they
    were being hacked once a week, which showed a 32% awareness compared to 22% in
    2017. The nature of cyberattacks is shifting towards phishing e-mails from 72%
    in 2017 to 86% in 2020 accompanied by a fall in viruses and malware from 33% to
    16%. Yet, phishing cyberattacks are often made in tandem with malware. Over the
    past five years more management board members of companies are becoming involved
    in instituting cybersecurity countermeasures. The DSMC report found that 80%,
    compared to 69% in 2016, of senior management now viewed cyber risk and security
    as top priorities. It found that more businesses were proactive in finding out
    information concerning cybersecurity measures from the NCSC. They believe this
    has been driven by GDPR concerns, which have been discussed in this book in a
    number of chapters. The DSMC report noted, however, that a good deal more work
    is needed in relation to external and internal security audits with only half
    of businesses carrying them out in the past 12 months and quality varying a great
    deal. Insurance take up to cover cyber risk, threat and attack still remains quite
    low at 32%. Some of the reasons for this have been outlined in [Chapter 9](#ch18.xhtml#book-part-009)
    of this book on insurance. The 2019 DSMC report noted that the average or mean
    cost to the UK businesses surveyed of cyber incidents was £3,230 for small businesses
    and £5,220 for medium and large businesses.


    ## Stigma of reporting diminishing in future


    Reactions to the DCMS report largely point to the fact that the stigma faced by
    many companies in relation to reporting publicly cyberattacks is beginning to
    abate. As mentioned many times in this book, whether it is Japan the US, the UK
    or Europe in general, one of the major impediments in dealing with cyber risk
    has been the fear of companies that if they report that they have been successfully
    hacked it will expose them to loss of reputation and they will lose customers
    and customer confidence. Now that so many companies large and small have been
    reporting their cyberattacks and the regulatory framework is levelling fines while
    at the same time rewarding them for reporting, the stigma is now diminishing.
    The stigma related to reporting has also decreased because governments are also
    having to report because of sheer numbers of increasing cyberattacks. Charities
    are also increasingly bearing the brunt of cyberattacks and so are cloud services,
    which are supposed to protect against data breaches. Therefore, the emphasis is
    changing towards greater interest in how companies can find the best countermeasures
    to mitigate cyber risk, threat and attack and how to best train staff in implementing
    countermeasures. Yet, as mentioned many times in this book it is not the technology
    that is failing companies and those, for example, who use cloud platforms such
    as Amazon Web Services that provide good cybersecurity measures. It is instead
    human error that allows the cyberattacks to occur because staff who are managing
    the countermeasure systems do not understand them well enough. The knowledge gap
    between understanding the need for cybersecurity measures to be intact needs to
    be matched by the equally important requirement of skilled experts to operate
    such cyber mitigation systems. When this gap closes and all businesses view reporting
    cyber incidents as an effective and efficient method of fighting cyber risk and
    as a matter of routine, countering cyberattacks will become much more efficacious.[²](#ch19.xhtml#en161)


    ## Future insurance solutions


    Willis Towers Watson (NASDAQ: WLTW), with roots dating back to 1828 in London,
    is a major global advisory, broking and solutions company that employs 45,000
    people in 140 countries. Its announcement on 28 April 2020 of the launch of CyNav
    highlights future developments in sectoral cyber insurance cover. In this case
    it is a new type of cyber insurance cover designed specifically for marine sector
    shipowners. The new cyber insurance product addresses the increasing need for
    a bespoke marine cyber solution, built from the ground up to specifically address
    shipoperators’ exposures, rather than trying to use pre-existing generic cyber
    products amended marginally to fit marine exposures. Shipowners are increasingly
    reliant on digital technology for all aspects of their operations and their unique
    risks associated with this dependency can lead to significant financial damage
    as outlined in [Chapter 8](#ch17.xhtml#book-part-008) of this book on the marine
    sector. CyNav’s pioneering approach includes the following central features:

    - Crisis management costs include cover that protect the rights of shipowners
    from the most common cyberattacks of ransomware attack and data breaches.

    - BI, the second most common outcome of cyberattack, cover in the event of a cyber
    incident that disrupts operations (including where the incident occurs at a third-party
    IT service provider upon which the shipowner relies).

    - Property infrastructural damage and loss of hire cover arising from a cyberattack
    or satellite communication interference such as GPS (spoofing).

    - Loss of hire cover arising from disruption to or detainment of a vessel following
    a cyberattack such as pirates mentioned in [Chapter 8](#ch17.xhtml#book-part-008)
    of this book.

    - Cover for fines and defence costs arising from regulatory actions, including
    those under GDPR and the Network and Information Systems Directive. As the financial
    impact of cyber incidents continue to accelerate while the silent cyber cover
    in traditional marine cover is being reduced substantially, CyNav offers a cyber
    solution of the future, which is designed to close remaining gaps in current cyber
    cover. Ben Abraham, Global Head of Marine at Willis Towers Watson, said:


    > Barely a week goes by without new cyber events affecting the maritime sector.
    Many are minor and unreported, but the major cases have caused consequential commercial
    losses in the hundreds of millions of dollars. CyNav offers a genuinely pioneering
    marine-specific cyber solution. In an environment of increasing ingenuity of cybercriminals
    and increasing levels of cyber security governance in the maritime industry, CyNav
    anticipates the protection that shipowners need to mitigate their cyber risk.[³](#ch19.xhtml#en162)


    ## AI and future cyberattack mitigation


    As human error is often the cause of successful entry into computer systems, it
    is possible that learning machines could be used to protect IP from theft and
    nations suffering from cyberwarfare attacks. This is nothing to do with science
    fiction or the unrealistic horror scenario of robots developing their own minds
    and murdering masses of people. AI is being developed as learning aids in education
    and even to map areas to assist with stopping pandemics such as the current COVID-19.


    ## Slowing the pandemic

