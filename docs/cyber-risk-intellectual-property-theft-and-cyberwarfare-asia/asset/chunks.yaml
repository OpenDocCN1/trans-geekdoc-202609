- fmt: "\nExperts, as mentioned above, are tasked with raising awareness and promote\
    \ understanding to top management of critical infrastructure operators presenting\
    \ cybersecurity measures based on each company’s business policies fostering personnel\
    \ who can bridge critical infrastructure protection related departments within\
    \ the company to make comprehensive adjustments while leading working-level officials.\
    \ Human resource managers are responsible for upgrading cybersecurity measures\
    \ due to changing circumstances for `OT` management departments and legal affairs\
    \ among other relevant departments. `IT` management departments are only one of\
    \ many as the emphasis needs to be with organising a structure that straddles\
    \ all departments and sectors when it concerns cybersecurity countermeasures.\
    \ In industry, academia and government collaborations clarifying the definitions\
    \ of required security experts are necessary while promoting concrete human development\
    \ measures such as exercises, training and obtaining of qualifications. There\
    \ has also been created for all stakeholders involved different levels from 1–5\
    \ of perceived severity of cyberattack threat to critical infrastructure. This\
    \ ranges from: \n- `Level 5 Emergency` for a wide-scale imminent threat.\n- `Level\
    \ 4 Severe` with a significant impact.\n- `Level 3 High` with a demonstrable effect.\n\
    - `Level 2 Medium`, which may be critical.\n- `Level 1 Low` and unlikely to affect\
    \ critical infrastructure.\n\n## Future of ICT and Japanese cybersecurity\n\n\
    In recent years, the number of cyberattacks, including suspected attempts, is\
    \ on the rise and the amount of new malware is increasing every year. The occurrence\
    \ of new threats lies with new technologies in particular such as `AI`, `IoT`\
    \ and `5G` telecommunications systems. As mentioned above, supply-chain companies,\
    \ usually `SMEs`, are a particular focus of cyberattacks with `IP theft`, as shown\
    \ at the beginning of this chapter, the most frequent target. This is occurring\
    \ within the context of large-scale cyberattacks in which hackers take advantages\
    \ through more sophisticated and large-scale attacks utilising new technologies.\
    \ There is an increase in suspect packets that are being delivered to the `NICT`\
    \ monitoring system named `Nicter`, which shows they are infected with malware,\
    \ and there is an increase in servers that have been subject to `DoS` cyberattacks.\n\
    \nA prediction by `Symantec` is that cyberattackers will be utilising assistance\
    \ from `AI` to infiltrate `AI` systems. This will be especially the case in relation\
    \ to defence systems and cyberwarfare that will be required to rely more on `AI`\
    \ to identify vulnerability and execute countermeasures. The spheres of attack\
    \ will become expanded due to the introduction of `5G` new-generation telecommunications\
    \ bandwidth and have been complicated by Chinese telecommunications company `Huawei`,\
    \ which the `US` is banning and Europe is allowing to develop `5G` but with caution\
    \ due to fears of access by the Chinese government to `IP`, defence data and many\
    \ other sensitive data bases. This was discussed in `Chapter 1` of this book and\
    \ will be expanded upon in `Chapter 5` on China.\n\nIt is also predicted by `Symantec`\
    \ as by many others conversant with `IoT` that a new and more dangerous attack\
    \ than `DoS` will emerge due to expansion of `IoT` infrastructure especially between\
    \ large corporates and their suppliers. This is already leading to a qualitative\
    \ and quantitative increase in cyberattacks targeting supply chains as mentioned\
    \ above. `McAfee`, in turn, predicted that further utilisation of `AI` in future\
    \ preventive technologies would occur with the next target being `IoT` devices\
    \ that use voice-recognition features. `Trend Micro` also predicts future highly\
    \ sophisticated targeted attacks that use `AI` and increased competition among\
    \ hackers over `IoT` attacks.\n\n## Trends and outlook of the global cybersecurity\
    \ market and in Japan\n\nWith an ever-growing cyber threat, there has been an\
    \ increased need for cybersecurity products and services. In `2018`, the value\
    \ of the cybersecurity market reached `US153 billion` and it is estimated to reach\
    \ `US230 billion` by `2022`. Yet, the market share of Japanese products is relatively\
    \ small, lagging behind the `US` and Europe. Foreign companies are also entering\
    \ into the Japanese market challenging the market share of Japanese goods and\
    \ services. This trend may be seen below in the current status of the Japanese\
    \ `ICT` product market within the global context:\n- Base stations: `29%` `Ericsson`\
    \ (Sweden), `26%` `Huawei` (China), `23.4%` `Nokia` (Finland), `11.7%` `ZTE` (China),\
    \ `5%` `Samsung` (South Korea)\n- Routers (product share in `3Q 2018`): `US60%`,\
    \ `Europe27%`, `China6.8%`, `Japan4.6%` and others `1.2%`\n- Server products (product\
    \ share in `4Q 2018`): `US68.7%`, `China26.3%`, `Japan5%`\n- Smartphones: Chinese\
    \ products `57.4%`, `US20.8%`, `SouthKorea18.8%`, `Japan1.2%` and others `1.8%`\n\
    \n## Comparison of R&D between foreign companies and Japanese companies\n\n- Companies\
    \ listed in top ranking include global companies such as `Amazon` and `Alphabet`,\
    \ both of which spend more than `10%` of profits on `R&D`. Chinese companies also\
    \ follows this trend.\n- Japanese companies spend less than `10%`, except for\
    \ the healthcare sector.\n\n## Global ranking of R&D spending\n\nGlobal `R&D`\
    \ spending shows the leaders as `Amazon`, `Alphabet`, `VW`, `Samsung`, `Intel`,\
    \ `Microsoft`, `Apple`, `Roche`, `Johnson and Johnson` and `Merck` as the top\
    \ ten companies, with the Japanese company `Toyota` as eleventh in the global\
    \ rankings.\n\n## Japanese ranking of R&D spending\n\nThe top ten companies in\
    \ Japan in terms of amount spent on `R&D` are `Toyota`, `Honda`, `Nissan`, `Sony`,\
    \ `Panasonic`, `Denso`, `Hitachi`, `Takeda`, `Canon` and `Toshiba` in ranked order.\
    \ The first three are automotive manufacturing companies.\n\n## Chinese ranking\
    \ of R&D spending\n\nChinese companies in ranked order are `Alibaba`, `Tencent`\
    \ and `Baidu`, which have been spending about `10%` of all profits on `R&D` since\
    \ `2013`. There are only three but all relate to the internet.\n\n## Environment\
    \ surrounding start-ups and Japan’s presence\n"
