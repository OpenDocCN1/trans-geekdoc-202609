- fmt: "\nIt is the intangible aspects of IP that makes it so vulnerable to cyber\
    \ risk and attack affecting business and trade relations worldwide. It can operate\
    \ at a number of levels and in all types of industries as this book will demonstrate.\
    \ Levels include industry, government, military defence establishments and businesses\
    \ of all sizes. The geo-political, trade sectors and finance including banking\
    \ and insurance are all prey to this 21st-century digital-age menace. Some industries\
    \ are more prone to IP theft, cyberattack and potential/variants of cyberwarfare,\
    \ often in unexpected ways, such as shipping, national grids, defence systems\
    \ and retail banking systems. Examples as in previous books are mainly from Japan,\
    \ Europe and the USA but in terms of the shipping sector, for instance, it can\
    \ occur anywhere in the world because of global trade routes. \n\nCyber risk/attack\
    \ and IP theft are very broad topics that touch most aspects of our lives but\
    \ often most of us are not even aware of them or the remedies for dealing with\
    \ them occurring at all different levels. For example, in the insurance industry,\
    \ which through underwriting should cover a wide range of cyber risk, is only\
    \ now dealing with silent cyber risk. Two new London Market model clauses to help\
    \ underwriters manage cyber losses have been published by the International Underwriting\
    \ Association (IUA). The wordings have been developed in order to address issues\
    \ of non-affirmative or ‘silent’ cover, where traditional insurance policies may\
    \ unintentionally suggest protection for undefined cyber risks. The importance\
    \ of wordings cannot be underestimated as explained in my presentation book launch\
    \ of `Managing Cyber Risk in the Financial Sector` in the City of London on 16\
    \ March 2016 supported by the IUA. I stated that:\n\n> Insurers were left in a\
    \ difficult position because of the dearth of facts and detail. We are dealing\
    \ with a new phenomenon where people do not even know the language to use to describe\
    \ cyberattack, and how can you deal with something when you do not share a common\
    \ language?\n\nSince then definitions of cyber words used in insurance documents\
    \ have moved forward.[^8](#ch10.xhtml#en11) First, a Cyber Loss Absolute Exclusion\
    \ Clause (reference: `IUA 09-081`) provides market participants with an option\
    \ to exclude in the broadest possible manner any loss arising from the use of\
    \ a computer system, network or data – each of which is clearly defined. Meanwhile,\
    \ a Cyber Loss Limited Exclusion Clause (reference: `IUA 09-082`) enables only\
    \ the exclusion of losses directly caused by cyber events, rather than ‘directly\
    \ or indirectly’. Chris Jones, IUA director of legal and market services, said:\n\
    \n> These two new model clauses provide broad policy exclusions which may be utilised\
    \ as a starting or reference point for underwriters offering cover for traditional\
    \ business classes that may include an element of cyber risk. By developing class-specific\
    \ write backs insurers can then explicitly state the extent of any cover provided\
    \ for such losses.\n\nBoth clauses were developed in response to concerns expressed\
    \ by the Prudential Regulation Authority (PRA) about potentially unintended or\
    \ unclear provision of coverage for cyber risks in various classes of insurance\
    \ business. The issue was addressed by the regulator in a November 2016 consultation\
    \ paper (`Cyber insurance underwriting risk`) and subsequent policy statement\
    \ (`PS 15/17`). Companies were urged to actively manage their exposures by considering\
    \ adjustments to premiums, robust wording exclusions and specific limits of cover.\
    \ Mr Jones added:\n\n> Silent cyber cover creates uncertainty for both insurers\
    \ and clients and has been a hot topic in the London company market for some time\
    \ now. Increasing regulatory scrutiny has, of course, further highlighted the\
    \ issue, but IUA members have been considering different approaches even before\
    \ it was first raised by the PRA. Many traditional policies were designed when\
    \ cyber wasn’t a major risk and often do not explicitly mention cyber. Some high-profile\
    \ cyber events and losses have clearly demonstrated, however, how important it\
    \ is to address.[^9](#ch10.xhtml#en12)\n\nAwareness and concern of companies of\
    \ all sizes of cyber risk, and how it affects their business and insurance needs\
    \ has been highlighted recently by global professional services firm Aon plc,\
    \ which released its Cyber Captive Survey 2019 Report entitled `Creating Value\
    \ for the Cyber Risk Agenda`, which shows an increase in demand for cyber products\
    \ among captive owners who have bought such cover in the past. As captive insurance\
    \ companies were set up by parent companies to cover risks that were not widely\
    \ covered by mainstream insurance companies and that were too costly because companies\
    \ required stable pricing, it is apposite to note that captives are providing\
    \ cyber-risk cover at an accelerated rate with increasing demand. This report\
    \ reveals current attitudes and trends among captive buyers of cyber insurance\
    \ that include global insights into the ongoing challenges and opportunities for\
    \ captive owners seeking to manage cyber risk. It also highlights the growing\
    \ need for cyber-risk cover and sectoral demand:\n\n* The growth in gross written\
    \ premium for cyber risks within the captive market has accelerated in the last\
    \ year by 263% year on year.\n* The industries buying most cyber cover within\
    \ a captive are Healthcare (19%) and Energy (15%).\n* The range in limits of cover\
    \ taken out is up to US$ 100,000 million.\n* The percentage of captives surveyed\
    \ that are incubating cyber risk has reached 41%.\n* The percentage of captives\
    \ that are having BI cover wording within their cyber policies has reached 63%.\
    \ This reflects the IISE study mentioned above emphasising BI being the most frequent\
    \ purpose of cyberattack among organisations globally.\n* Captives that have suffered\
    \ a cyber loss has reached 26% and 29% of losses have been a full-limit loss.\n\
    * Greater control of insurance programmes (37%) and achieving cost efficiencies\
