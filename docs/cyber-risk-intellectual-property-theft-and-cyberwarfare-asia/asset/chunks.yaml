    根据英国数字、文化、媒体和体育部（DCMS）的统计，英国近一半的企业曾经历过试图或攻破其安全措施的网络攻击。这是指在从 2019 年 3 月起的过去 12
    个月内，68% 的中小企业和 75% 的大型公司是网络攻击的目标。2019 年的 DSMC 报告指出，网络攻击的增加可能与网络安全意识的提高有关。在 46%
    表示遭受过网络攻击的企业中，大多数人表示他们每周被攻击一次，与 2017 年的 22% 相比增加了 32%。网络攻击的性质正在发生变化，钓鱼邮件从 2017
    年的 72% 增加到 2020 年的 86%，而病毒和恶意软件从 33% 下降到 16%。然而，钓鱼攻击通常与恶意软件同时进行。在过去的五年里，越来越多的公司管理层成员参与到建立网络安全防御措施中。DSMC
    报告发现，80% 的高层管理人员（2016 年为 69%）现在将网络风险和安全视为首要任务。报告发现，有更多企业主动从 NCSC 获取有关网络安全措施的信息。他们认为这是受
    GDPR 担忧驱动的，这些担忧在本书的多个章节中已进行讨论。然而，DSMC 报告指出，在外部和内部安全审计方面仍需大量工作，过去 12 个月只有一半的企业进行了此类审计，且质量存在很大差异。用于涵盖网络风险、威胁和攻击的保险比例仍然很低，仅为
    32%。其中的一些原因已在关于保险的第 9 章中概述。2019 年的 DSMC 报告指出，受调查的英国企业网络事件的平均成本，小型企业为 3,230 英镑，中大型企业为
    5,220 英镑。


    ## 未来报告污名化正在减少


    对 DCMS 报告的反应主要反映了一个事实：许多公司在公开报告网络攻击时面临的污名感开始减轻。正如本书多次提到的，无论是在日本、美国、英国还是整个欧洲，应对网络风险的主要障碍之一是公司担心，如果他们报告自己被成功破解，会导致声誉损失，并失去客户和客户信任。现在，随着越来越多的大小公司开始报告其网络攻击，而且监管框架在进行罚款的同时对报告行为给予奖励，这种污名感正在消失。与报告相关的污名也所减少，因为由于网络攻击数量的增加，政府也必须进行报告。慈善机构也日益成为网络攻击的受害群体，本应防止数据泄露的云服务也是如此。因此，重点正在转向：更多地关注公司如何找到最佳的应对措施来缓解网络风险、威胁和攻击，以及如何更好地培训员工实施这些措施。然而，正如本书多次提到的，导致公司失败的并非技术，例如使用亚马逊服务（Amazon
    Web Services）等云平台的公司提供了良好的网络安全措施。相反，是人为错误导致了网络攻击的发生，因为管理防御系统的人员对其并不足够了解。理解网络安全措施完整性需求之间的知识鸿沟，需要同样重要的熟练专家来操作此类网络缓解系统来匹配。当这一差距被弥补，所有企业都将报告网络事件视为应对网络风险的有效高效方法和常态工作时，应对网络攻击将变得更加有效。²


    ## 未来保险解决方案


    威世通陆（NASDAQ: WLTW）根源可追溯到 1828 年的伦敦，是一家主要的全球咨询、经纪和解决方案公司，在 140 个国家拥有 45,000 名员工。它于
    2020 年 4 月 28 日宣布 CyNav 发布，凸显了行业网络保险保障的未来发展。在这种情况下，这是一种专门为海运部门船主设计的新类型网络保险。这种新型网络保险产品解决了对定制化海洋网络解决方案日益增长的需求，从零开始构建，专门针对船舶运营商的风险，而不是试图通过对现有的通用网络产品进行微调来适应海洋领域的风险。船主日益依赖数字技术来处理运营的所有方面，而与这种依赖性相关的独特风险可能会导致巨大的财务损失，正如本书关于海洋部门的第
    8 章所示概述。CyNav 的开创方法包括以下核心特征：

    - 危机管理成本，包括保护船主免受最常见的网络攻击（勒索软件攻击和数据泄露）权利的保障。

    - 营业中断（BI），这是网络攻击的第二常见结果，涵盖因网络事件中断运营的情况（包括事件发生在船主所依赖的第三方 IT 服务提供商处的情况）。

    - 财产基础设施损坏和由于网络攻击或卫星通信干扰（如 GPS 欺骗）导致的租期损失保障。

    - 由于网络攻击导致船舶中断或被扣留（如海盗）而产生的租期损失保障，这涉及到本书第 8 章中提到的海盗。

    - 涵盖因监管行动产生的罚金和辩护费用，包括 GDPR 和《网络和信息系统指令》项下的费用。随着网络事件财务影响持续加速，而传统海洋保险中的“无声网络险”（silent
    cyber cover）大幅减少，CyNav 提供了一种未来的网络解决方案，旨在填补现有网络保障的遗留空白。威世通海洋业务全球负责人 Ben Abraham
    表示：


    > 几乎没有一个星期没有出现新的网络事件影响海运领域。许多事件是微小的且未报告的，但重大案件已导致了数亿美元的后果性商业损失。CyNav 提供了一种真正开创性的、针对海洋的特定网络解决方案。在网络犯罪分子手段日益高明、行业网络安全治理水平不断提高的环境下，CyNav
    预见了船主缓解其网络风险所需的保护。³


    ## AI 与未来的网络攻击缓解


    由于人为错误通常是成功进入计算机系统的原因，机器学习可能被用于保护知识产权免受盗窃，并保护遭受网络战攻击的国家。这与科幻无关，也与机器人产生自我意识并屠杀人类等不真实的恐怖场景无关。AI
    正在被开发的教育辅助工具，甚至用于绘制地图以帮助遏制如当前的 COVID-19 等流行病。


    ## 减缓流行病


