    \ into software and the use of third-party apps will also increase vulnerability.\
    \ It is predicted that the potential threats will involve DoS and large-scale\
    \ DoS cyberattacks bringing unauthorised access and interception. \n\n## Trends\
    \ in standardisation and countermeasures\n\nWith the advent of 5G, reliability\
