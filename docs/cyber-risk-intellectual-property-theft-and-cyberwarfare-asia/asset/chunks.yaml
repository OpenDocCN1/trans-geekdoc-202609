- fmt: '

    In parallel to this indictment, a Chinese intelligence official operating in Belgium
    was arrested for ‘training’ employees of US companies to steal trade secrets and
    was extradited to the US. Additionally, two Chinese nationals, named `Zhu Hua`
    and `Zhang Shilong`, were charged with conspiracy to hack into a number of US
    companies and government agencies. The latter included sensitive agencies such
    as `NASA’s Goddard Space Center` and `Jet Propulsion Laboratory` and the `Lawrence
    Berkeley National Laboratory` in California. They had hacked into computer systems,
    committed wire fraud and identity theft targeting a wide range of companies including
    telecommunications, pharmaceuticals, aviation and satellite.


    The `DoJ` stated that the hackers were working at the behest of the Chinese Ministry
    of State Security’s `Tianjin State Security Bureau`. They were part of a hacking
    group described in [Chapter 2](#ch11.xhtml#book-part-002) of this book known as
    `APT10`, which US cybersecurity firms had identified as sending phishing e-mails
    that install malicious software onto the computers of their intended victims.
    ‘This is outright cheating and theft, and it gives China an unfair advantage at
    the expense of law-abiding businesses and countries that follow the international
    rules in return for the privilege of participating in the global economic system,’
    `Rod J. Rosenstein`, the deputy attorney general, stated at a news conference.
    `APT10` has been very difficult to contain as it continually changes the technology
    it uses and its internet protocol addresses to both avoid detection and to stay
    longer on the systems of those they are hacking.[¹](#ch14.xhtml#en91)


    ## IP is key


    It is estimated by experts in the field that the US loses are between US$ 30 billion
    to US$ 500 billion per annum from IP theft. Most of the theft occurs through cyberattack
    by stealth or in tandem with willing collaborators or those unknowingly being
    misled or coerced. Many of the laws in China, such as those that involve joint
    ventures between Chinese and US companies, build in requirements such as compulsory
    mergers that inevitably cause technology and IP transfer to occur. Chinese laws
    require foreign-owned research facilities to be built in China, which makes the
    stealing of trade secrets easier. Data pools are also at risk as `Amazon` and
    `Apple`, for example, were required in joint ventures to work with local partners
    in China allowing them to handle data. Chinese officials state that such requirements
    are made to protect privacy and for security reasons. They also insist on foreign
    companies giving them access to sensitive technology to ensure the safety of Chinese
    consumers. However, the IP and technology made available to Chinese state-owned
    enterprises finds its way back to the Chinese government. There are also compulsory
    certification programmes that require foreign products to undergo rigorous testing.
    During the testing process source codes and algorithms become exposed that allow
    products such as medical devices and certain types of machinery to be more easily
    replicated. Medical devices in particular are an area that the Chinese have been
    keen to develop because of their own domestic ageing market and those worldwide.
    A major part of the punitive tariffs the US is placing on China is to force them
    to sign agreements to stop the above practices that are so damaging to US businesses
    due to loss of IP and trade secrets. The US wishes to continue to do business
    with China but without such punitive losses to its industry – high technology
    in particular.


    ## Cyberespionage


    A report released in summer 2017 by the White House Office of Trade and Manufacturing,
    which was led by `Peter Navarro`, put forward a detailed case outlining the extent
    and costs of China’s cyberespionage campaign, as they termed it. The report analysed
    the Chinese cyberattacks on US companies and the many examples of how they have
    reversed engineered and counterfeit products. The report quoted a study that put
    the cost of counterfeiting software at US$ 600 billion per annum losses to the
    economy. `Derek Scissors`, of the `American Enterprise Institute`, who advised
    the Trump administration on Chinese thefts in 2017, has argued that China – through
    its theft of IP and suppression of foreign competition – has diminished its capacity
    for genuine innovation, relying instead on coercion and cyber theft.[²](#ch14.xhtml#en92)
    Yet, the Chinese are very sensitive to being called thieves and losing face. Saving
    face is very important in Chinese culture so taking a more indirect approach can
    be more successful. In Beijing there have been IP courts established in which
    foreign companies can legally take Chinese companies that have stolen their IP
    or to task. There have been a number of cases in which foreign companies have
    won their cases and counterfeiters have been shut down (see the case of `Hongda`
    and `Honda` in `Ruth Taplin`’s book *Intellectual Property and the New Global
    Economy*). Using tariffs as a means to pressure the Chinese government to change
    their practices and institutions can be more productive, resulting recently in
    China easing its stringent requirements for foreign businesses being involved
    in joint ventures in certain sectors or by slowly developing IP appeals courts
    to give foreign companies a further chance to prove their case. This does not
    stop China from denying any involvement in the cyber theft of IP and secrets,
    arguing that technology transfer is a normal part of business relations, or alleging
    that the US has engaged in IP theft or technology transfer from Britain in its
    early years. Yet, there is plenty of evidence that China has been stealing essential
    data of all types, such as personal, military and technical not simply to inflate
    their government coffers like North Korea but to support a whole programme of
    economic and military domination in many parts of the world. This enables them
    to be able to recruit foreign spies, grab mineral resources, and compromise lesser
    developed countries through debt leverage into leasing on a long-term basis prime
    sea ports and strategic locations to further their goals of becoming the pre-eminent
    military and economic nation globally, returning to the days of the Middle Kingdom
    when foreigners travelled to China to supplicate themselves before the emperors
    of the ancient regime – the Chinese characters for China mean Middle Kingdom.
    Recent examples of gaining essential data through cyberattack include the cyberattack
    on `Marriott Hotels` and the `Equifax` cyberattacks to gain a massive amount of
    personal data.

