    外交部并非对网络攻击免疫，尤其是那些作为北约成员并因此与美国军方保持紧密关系的国家。捷克外交部每周都会遭受网络攻击。2017 年 1 月，网络攻击急剧增加，其模式与针对美国民主党国家委员会（DNC）的攻击相似。捷克外交部长表示，没有发生重大的机密信息泄露，且未提及可能此的国家级行为者。然而，一位政府消息人士透露，极可能是俄罗斯。有人推测，这次重大网络攻击可能是俄罗斯网络军实施的，以此对捷克与北约及欧盟紧密关系的报复。


    ## 伊朗作为地缘政治网络攻击的来源


    伊朗与俄罗斯一起，出于地缘政治原因发起网络攻击。2019 年 10 月初，微软表示，有 2700 次针对总统竞选、报道美美关系的美国记者以及美国政府部门的黑客尝试。攻击者使用了并不复杂的方法，通过最初获取受害者的信息来获取访问其账户的密码。伊朗正在效仿俄罗斯的模式，试图通过地缘政治网络攻击进行干预。2019
    年 7 月，微软公司副总裁 Tim Burt 表示，目前大多数地缘政治网络攻击源自俄罗斯、伊朗和朝鲜，目标是与美国政治竞选合作的非政府组织（NGO）和智库。


    ## 物联网（IoT）日益增长的重要性


    俄罗斯网络作为经济和政治武器的模式涉及多种形式的网络攻击、否认自身责任、将归咎于他人（尤其是代理人），并利用网络战争产生经济、政治、社会和基础设施的物理破坏。他们的整个运作模式依赖隐蔽、欺骗、否认和推卸责任。这意味着他们选择的网络机制不易被发现，且本质上是间接的。因此，正如`第
    1 章`中提到的，物联网的使用日益增加。一个典型的例子发生在 2019 年 4 月，微软通过其威胁情报中心报告了一起事件：通过越网络协议（VoIP）、打印机和视频解码器实施了物联网网络攻击。这些物联网设备为广泛的企业网络中的多个位置提供了“软访问”。三台设备中有两个具有出厂安全设置，而第三个尚未更新。微软指出，这次网络攻击具有与格总局（GRU）相关的俄罗斯黑客特征，他们使用
    Fancy Bear、APT28 和 Strontium 等多种名称。如上所述，这群俄罗斯国家黑客自 2007 年以来一直活跃，但从 2019 年 4 月起，微软注意到他们的网络攻击重心转向了物联网。人们通常认为黑客针对智能手机和电脑是为了易访问数据信息或植入恶意设备，但更多时候是摄像头、打印机和解码器提供了“软访问”。这些设备的访问点是默认密码或未更新的密码。由于安全措施未更新，黑客创建了一个滩头，作为他们进入未受保护的企业网络的起点。一旦黑客建立了对网络的稳固访问，通过对网络进行简单扫描寻找其他不安全的设备，他们就可以移动提供数据和其他特权信息的高价值账户。从那里，黑客从一个设备移动到另一个设备，同时绘制网络地图并与控制服务进行通信。微软观察到俄罗斯国家黑客在全球活动日益增加。自最初的网络攻击以来，微软已通知
    1400 名被`APT28`或`Fancy Bear`入侵的接收者。在这些目标中，有 20%是上述的如“欧洲价值观”之类的智库、与政治相关的组织和非政府组织。其余占网络攻击
    80%的部分包括教育、技术、工程、医学、军事、奥林匹克组织者、反兴奋剂机构和酒店业。2018 年，FBI 采取行动破坏了一项名为`VPNFilter`的 Fancy
    Bear 行动，该行动利用恶意软件针对网络存储设备和路由器，该软件具有通过删除固件使设备“变砖”并使其失效的破坏能力。该行动特别针对乌克兰，乌克兰通常是俄罗斯国家黑客的目标。随着物联网设备的迅速增加以及复杂性的低技术设备成为熟练黑客（在此例中为俄罗斯国家行为者）的进入点，网络攻击/网络战争的严重性持续增加。当
    Armis 的安全人员发现全球所有物联网设备运行操作系统`VxWorks`在多个零日领域存在漏洞时，这种物联网网络风险范围得到了证明。这一披露意味着物联网中的低技术设备（如防火墙、医疗平台等医疗设备以及打印机）可以如上述所示产生企业网络的软访问点，这将导致多层安全失效。微软指出，问题部分在于物联网设备只是互联的促进者，几乎完全没有管理监督。有多少公司雇佣员工来维护其打印机的漏洞？事实上，微软指出，大多数客户的
    IT 运营部门不知道他们的简单设备已连接到互联网。更糟糕的是，网络分析显示物联网受到外部控制和指令，这允许寻找进一步访问点的黑客进行入侵。微软发布这一披露是为了警示公司面临面临的网络风险，特别是因为物联网设备的数量远超个人电脑（PC）和手机的总和。本书将涵盖的特别易受网络攻击影响的部门也将根据物联网漏洞进行评估，正如我之前关于在金融领域管理网络风险的书中所做的那样。多年来，网络犯罪专家一直发出警告，即使是普通的办公室咖啡机也可能成为网络犯罪分子的目标，因为进入容易，而且犯罪分子从暗网购买勒索软件很便宜。在这种情况下，甚至可能买一送一一个勒索软件，并与编写代码的人分享利润。Demos
    社交媒体分析中心主任 Jamie Bartlett 指出，物联网的设计非常糟糕，以后可能被迫支付一小笔加密货币赎金才能从办公室咖啡机中获得咖啡。


    ## 加密货币——另一种网络风险


    '
- fmt: '

    Cryptocurrencies present another opportunity for cyber hackers whether state actors
    or individuals to flourish. The seemingly innocent alternative currency system
    provides cover for a whole host of cybercriminals. A prime example is the North
    Korean state actors who use increasingly sophisticated means to procure finance
    through cyberattack/cyberwarfare. A recent UN report outlined the ways in which
    North Korean state-backed cyber hackers have stolen at least US$ 2 billion from
    financial institutions and in cryptocurrencies. Such monies, which are either
    regulated by global nation-states or unregulated speculators in the case of cryptocurrencies,
    are used to build WMD and missiles to threaten their enemies around the world
    except for its backer Mainland China.


    The UN report is 33 pages in length with 192 annexes that chronicle at least 35
    examples of North Korean state actors stealing monies from financial institutions
    and cryptocurrencies. This is in addition to stealing IP blueprints from advanced
    missile-producing countries globally.


    Cryptocurrencies are preferred targets for cyber theft because according to the
    UN report they are harder to trace, not being subject to regulation and oversight
    by different countries’ central banking systems. Such illegal transfer of funds
    from countries outside North Korea is facilitated by 30 overseas North Korean
    banking outlets.


    The advance in cryptocurrency use is facing many hurdles in the case of Mark Zuckerberg,
    CEO of Facebook, trying to launch a new cryptocurrency entitled `Libra`. This
    move has been met with scepticism given the criticisms of how Facebook was used
    by the Russians to bias the 2016 American presidential election towards Donald
    Trump through social media. There have been moves by countries that have rogue
    dictators as leaders and small island countries to also issue cryptocurrencies,
    which would boost their economies and also allow dictatorships such as North Korea
    to launder money from ill-gotten gains.


    Venezuela has tried unsuccessfully to launch a sovereign cryptocurrency, the `petro`
    but it has failed. The government of the small Marshall Islands has launched in
    2018 a `SOV Development Fund` to create a cryptocurrency named the `SOV`. The
    government has passed a bill in the legislature to support the `SOV` as it would
    raise much-needed revenue for the islanders who have suffered from a US crackdown
    on money laundering, which has raised compliance fees and most banks no longer
    wish to operate in the Marshall Islands.


    With the `SOV` the Marshall Islands can send their own money directly without
    using the global banking system. The problem is when recipients try to convert
    the `SOV` into dollars or other local currencies. In addition the International
    Monetary Fund and the US Treasury have raised concerns that such `SOV`-based revenue
    building could come at a high cost to the Marshall Islands’ reputation and money-laundering
    risks. The Marshall Islands government in turn has argued that the `SOV` will
    be tamper proof and allow for lower-cost compliance to be instituted.


    Cryptocurrencies are becoming less attractive in mainstream markets because of
    the risks they pose and their use by cybercriminals especially increasingly in
    relation to ransomware attacks. UK marine engineering firm London Offshore Consultants
    (`LOC`) were hacked by a group called `Maze` who claimed they stole 300GB of data
    and leaked some of this online to pressure `LOC` to pay the ransom to unlock their
    frozen computers. Early in December 2019 the FBI had warned that `Maze` ransomware
    attacks had been identified since November of that year, often posing as US government
    agencies, stealing data, then encrypting it to be able to extort victims further.
    One of the multiple methods `Maze` used was their own creation of a malicious,
    fake cryptocurrency site in addition to malspam to impersonate government agencies.


    ## Supply-chain cyberattack entry

