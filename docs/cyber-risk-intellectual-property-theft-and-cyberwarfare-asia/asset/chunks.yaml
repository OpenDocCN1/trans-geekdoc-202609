    与这项起诉并行，一名在比利时工作的中国情报官员因“培训”美国公司员工窃取商业秘密被捕，并被引渡到美国。此外，两名名为`Zhu Hua`和`Zhang Shilong`的中国公民被指控合谋入侵多家美国公司和政府机构。后者包括一些敏感机构，如`NASA
    的戈达德太空中心`、`喷气推进实验室`以及位于加利福尼亚州的`劳伦斯·伯克利国家实验室`。他们入侵了计算机系统，并针对电信、制药、航空和卫星等在内的广泛公司实施了电信诈骗和身份盗用。


    `DoJ`表示，这些黑客是受中国国家安全部`天津市国家安全局`指使而行动的。他们是本书第 2 章中描述的名为`APT10`黑客小组的一部分，美国安全公司已确认该小组通过发送钓鱼邮件在目标受害者的计算机上安装恶意软件。副检察长`Rod
    J. Rosenstein`在新闻发布会上表示：“这是赤裸裸的欺诈和窃取，它以牺牲守法企业和遵循国际规则获得参与全球经济体系权利的国家为代价，为中国赢得了不公平的优势。”`APT10`非常难以抑制，因为他们不断改变使用的技术和互联网协议地址，以规避检测并在被黑客的系统中停留更久。¹


    ## 知识产权是关键


    领域专家估计，美国每年在知识产权盗窃方面的损失在 300 亿至 5000 亿美元之间。大多数盗窃行为发生在隐蔽的网络攻击中，或与自愿合作者以及那些在不知情的情况下被误导或胁迫的人合作。中国的许多法律（例如涉及中外合资企业的法律）包含了强制合并等要求，这不可避免地导致了技术和知识产权的转移。中国法律要求外资研究机构必须在
    във境内建立，这使得窃取商业秘密变得更容易。数据池也面临风险，例如`Amazon`和`Apple`在合资企业中被要求与中国当地合作伙伴合作，允许其处理数据。中国官员表示，此类要求是为了保护隐私和出于考虑。他们还坚持外国公司提供敏感技术，以确保中国消费者的安全。然而，提供给中国国有企业的知识产权和技术会流回中国政府。还有强制性认证计划，要求外国产品经过严格测试。在测试过程中，源代码和算法会暴露，导致医疗设备和某些类型的机械等产品更容易被复制。医疗设备特别是中国人热于开发的领域，因为他们国内的老龄化市场以及全球市场的需求。美国对中国征收惩罚性关税很大程度上是为了迫使他们签署协议，停止上述由于知识产权和商业秘密损失而对美国企业造成巨大损害的径。美国希望继续与中国做生意，但不想让其工业——特别是新技术——遭受此类惩罚性损失。


    ## 网络间谍


    2017 年夏天白宫贸易与制造办公室发布的一份由`Peter Navarro`领导的报告提供了一个详细的案例，概述了他们所谓的“中国网络间谍活动的规模和成本”。该报告分析了中国对美国公司进行的网络攻击，以及他们如何进行逆工程和伪造产品的许多案例。报告引用了一项研究，伪造软件的成本每年给经济带来
    6000 亿美元的损失。在 2017 年就特朗普政府的中国窃取行为提供建议的美国企业研究院的`Derek Scissors`认为，中国通过窃取知识产权和压制外国竞争，削弱了其真正的创新能力，转而依赖胁迫和网络窃取。²然而，中国人对被称为小偷和丢脸非常敏感。面子在中国文化中非常重要，因此采取更间接的方法可能更成功。在北京已经建立了知识产权法院，外国公司可以在那里合法地追究窃取其知识产权的中国公司。已经有许多外国公司赢得诉讼、伪造者被关闭的案例（参见`Ruth
    Taplin`的著作《知识产权与新全球经济》在书中`Hongda`与`Honda`的案例）。将关税作为向中国政府施其做法和制度的手段可能更有成效，这导致最近中国放宽了外国企业在某些领域参与合资的严苛要求，或者通过缓慢开发知识产权上诉法院，为外国公司提供进一步证明其主张的机会。这并没有阻止中国否认参与任何知识产权和秘密的网络窃取，他们辩称技术转移是业务关系中的正常部分，或指控美国在早期曾从英国窃取知识产权或进行技术转移。然而，有充分证据表明，中国一直在窃取各种基本数据（如个人、军事和技术数据），不仅是为了像朝鲜那样充实政府国库，而是为了支持全球许多地区的经济和军事统治计划。这使他们能够招募外国间谍、获取矿产资源，并通过债务杠杆让欠发达国家长期租赁主要的海港和战略位置，以进一步实现其成为全球领先军事和经济国家的目标，回到“中间王国”的日子，那时外国人来到中国在古代政权的皇帝面前乞求自己——“中国”字的意思就是中间王国。近期通过网络攻击获取关键数据的案例包括对`万豪酒店`的网攻击以及对`Equifax`的网络攻击，以获取海量个人数据。


