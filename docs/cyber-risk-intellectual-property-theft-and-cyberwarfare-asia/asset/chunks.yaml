- fmt: "\nOne solution for those in the shipping industry that are the targets of\
    \ increasing cyberattacks is to find adequate insurance cover. Insurance companies\
    \ have tended to view cyber risk as an add-on or as part of existing insurance.\
    \ Cyber risk has grown in the maritime sector, which traditionally relied heavily\
    \ on insurance to cope with the risks of loses at sea. Marine insurance was the\
    \ first insurance of the London market and has a great deal of experience of marine\
    \ accidents to be able to insure fairly and for catastrophic losses. Cyber being\
    \ a new risk and threat will need to build on history and experience to gauge\
    \ potential loss. The growing seriousness of cyber threat is leading to new models\
    \ of reassessment. \n\nIn 2018, `Tom Walter`, partner at `HFW`’s (world’s leading\
    \ legal advice team for marine insurers) London office warned that in the course\
    \ of assessing whether a vessel is seaworthy and therefore insurable, insurers\
    \ in relation to cyber cover for vessels will need to send software engineers\
    \ aboard as well to assess whether the latest patches have been implemented. `HFW`\
    \ also carried out a six-part examination on the consequences of a `GPS spoof`\
    \ discussed above in which a fully laden autonomous cargo vessel collides with\
    \ a `10,000 TEU containership` as a result of a cyberattack. As mentioned above,\
    \ such a `GPS spoofing attack` could be caused by geo-political actors as part\
    \ of cyberwarfare tactics. This possible scenario was put forward by `Walter`\
    \ and `Jonathan Goulding`, Senior Associate and Mariner at `HFW`, who also foresaw\
    \ national preceding international legislation meaning that, for example, a Norwegian\
    \ autonomous vessel entering Swedish waters would be subject to the latter’s regulation,\
    \ which complicates insurance coverage. \n\nAs cyber risks and threats move more\
    \ quickly than insurance provisions it is likely that cyberattack exclusion clause\
    \ `380` used by many `P&C` (property and casualty) insurers would not be used\
    \ very much by 2020 and it would take up to eight years to have a full cyber-risk\
    \ international regime in place for maritime insurance, which would by then be\
    \ outdated. Associates `Henry Clack` and `Mathew Dow` pointed to insurance implications\
    \ for `P&I` as the safety of ports becomes a more central issue for cyber risk.\
    \ While the definition of what is a safe port has been developed over time, complications\
    \ for insurance arise when terminals do not share their cybersecurity measures\
    \ with visiting vessels. Such legal ramifications could be seen in the `San Diego\
    \ cyberattack` mentioned earlier in this chapter. \n\nAnother legal complication\
    \ in relation to cyberattack insurance coverage concerns what is considered an\
    \ abnormal, rare or unexpected cyber risk. While the `Ocean Victory` case was\
    \ viewed legally as abnormal, rare and unexpected, ports such as `Los Angeles`,\
    \ which experience at least one cyberattack per month, could not be viewed in\
    \ the same light. Likewise, the maritime industry has potential flaws native only\
    \ to that sector. `Secure Shell (SSH)` protocol, not mentioned above, presents\
    \ such a cybersecurity vulnerability. It is largely known as a terminal screen\
    \ that is used to input commands to access passwords, overrule security measures,\
    \ reconfigure e-mails and upload malicious files. Hackers use `SSH` to deploy\
    \ ransomware and to install malicious files so employees can assist unwittingly\
    \ in spreading the cyberattack throughout the company including in encrypted data.\
    \ If external hackers achieve such access to internal systems the results can\
    \ be catastrophic. Therefore, it is essential to have cybersecurity countermeasures\
    \ in place to add further security layers between systems to stop a cyberattack\
    \ in an early entry point within the system. \n\nTechnological innovations need\
    \ to be constantly improved and adapted as cloud-based systems also hold such\
    \ injection flaws. Such systems include management applications, planned maintenance\
    \ systems, crewing portals, e-learning training and cargo-voyaging-charting platforms.\
    \ In the case of vessels, it is best to create bespoke solutions for work purposes\
    \ rather than generic ones. However, several basic countermeasures are suggested\
    \ to mitigate cyber risk and attack. These include:\n\n1. Make sure that codes\
    \ of web-pages are not allowed to trigger additional queries.\n2. Keep webservers,\
    \ mail exchanger records and other servers from each other.\n3. Encrypt credentials\
    \ with two-factor authentications.\n4. Utilise differing passwords in each platform.\n\
    5. Filter location-based connections.\n6. Keep software updated to most recent\
    \ programme.\n7. Maintain regular back-up whether it is `OneDrive` or `iCloud`,\
    \ for example.\n8. All staff should have IT training and be familiar with procedures.\n\
    \nThe final chapter on insurance is unique in that the insurance sector has the\
    \ dual role of protecting companies, governments and individuals from cyberattacks\
    \ emanating from `IP theft` and acts of cyberwarfare it can also be directly affected\
    \ by these cyber risk itself.\n\n1. ‘Two Hong Kong shipping lines hacked within\
    \ five minutes of casual” browsing’, `Sam Chambers`, `Greater China Tech`, `Splash\
    \ 24/7` (4 April 2019).\n2. ‘Maritime wakes up to security threat’, `Linton Nightingale`,\
    \ `The Intelligence` (October/November 2018). See `www.lloydlist.com`.\n3. ‘Weekly\
    \ report details growing number of shipping companies targeted by malware’, `Sam\
    \ Chambers`, `Operations Tech`, `Splash 24/7` (25 February 2020).\n4. ‘U.S. and\
    \ allies blame Russia for cyberattack on Republic of Georgia’, `David E. Sanger`,\
    \ `Marc Santora`, `New York Times` (20 February 2020).\n5. ‘Ports on alert as\
    \ cyber attacks proliferate’, `Sam Chambers`, `Americas Ports and Logistics Tech`,\
    \ `Splash 24/7` (28 September 2018).\n6. Material from report ‘Shen attack: cyber\
    \ risk in Asia ports’ produced by the `University of Cambridge Centre for Risk\
    \ Studies` on behalf of `Cyber Risk Management (CyRiM)` project, in partnership\
    \ with `Lloyd’s` (30 October 2019).\n7. ‘Cybersecurity: addressing the gap in\
    \ understanding between C-Suite and IT managers’, `David Glass` (17 December 2019).\
    \ See `www.seatrade-maritime.com`.\n8. This was posted on `Seatrade Maritime News\
    \ (UBM(UK) Ltd)` on 6 June 2018. See `www.seatrade-maritime.com/asia/shipowners-set-25m-iot-solutions-over-next-years-inmarsat-report`.\n\
    9. Taken from the `Guidelines on Cyber Security Onboard Ships`, Version 3`, produced\
    \ and supported by `BIMCO`, `CLIA`, `Intercargo`, `InterManager`, `InterTanker`,\
    \ `IUMI`, `OCIMF` and `World Shipping Council`, 2018.\n10. ‘Port of Ashdod provides\
    \ Naval Dome with its first reference for Port-Dome security system’, `Patrik\
    \ Wheater`, `Seaborne Communications` (14 January 2019).\n11. See `BIMCO` website:\
    \ `www.bimco.org/`.\n12. ‘Norway warns shipping is being targeted by hackers’,\
    \ `Sam Chambers`, `European Operations Tech`, `Splash 24/7` (27 August 2019).\n\
    13. ‘US Coast Guard warns on renewed cyberattacks aimed at shipping’, `Sam Chambers`,\
    \ `American Operations Tech`, `Splash 24/7` (29 May 2019).\n14. Safety Alert 06-19\
    \ Washington, DC Cyber Incident Exposes Potential Vulnerabilities Onboard Commercial\
    \ Vessels`, `United States Coast Guard, Department of Homeland Security` (8 July\
    \ 2019).\n15. ‘Dualog warns of continued spam attacks as it stops 3.5 M infected\
    \ e-mails’, `Elaborate Communication Ref.: 18107` (5 September 2018).\n16. For\
    \ example, `Ruth Taplin (ed.), Managing Cyber Risk in the Financial Sector: Lessons\
    \ from Asia, Europe and the USA`, Abingdon: Routledge, 2016 and `Ruth Taplin`,\
    \ *Innovation, Investment and Intellectual Property in South Korea: Park to Park*,\
    \ Abingdon: Routledge, 2018.\n17. See `HFW`, the world’s leading legal advice\
    \ team for marine insurers who have dealt with 75% of legal cases in relation\
    \ to losses due to hijacking and kidnapping by Somali pirates, `www.hfw.com/Home`.\n\
    18. ‘Mass global positioning (GPS) spoofing at the People’s Republic of China’,\
    \ `The American Club` (30 December 2019). See `www.american-club.com/files/files/MA_123019_Mass_GPS_Spoofing_at_Ports_in_the_PRC.pdf`.\n\
    19. ‘Chinese hackers breach Navy data’, `Gordon Lubold` and `Dustin Volz`, `Dow\
    \ Jones News Service` (15 December 2018).\n20. ‘Smuggling of U.S. technology is\
    \ outpacing Cold War levels, experts say’, `Ron Nixon`, `New York Times` (17 March\
    \ 2018).\n21. ‘Cyber could bring new definitions of seaworthiness’, `Insurance\
    \ Marine News` (10 October 2019).\n"
