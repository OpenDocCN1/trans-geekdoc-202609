- fmt: "\nBlockchain technology can be used in smart grids to provide greater transparency\
    \ for consumers allowing them to track directly from where their electricity is\
    \ produced. Its use allows greater direct contact between energy providers and\
    \ consumers. With a blockchain contract` it would simplify transactions and allow\
    \ consumers who operate their own solar power systems to sell power directly to\
    \ neighbours or power companies turning it into a renewable small business. \n\
    \nIn creating a decentralised system, it enhances cybersecurity. It does this\
    \ by holding any information and setting rules on how the information can be updated.\
    \ Blocks of data increase as new information is appended and linked (chained).\
    \ It has a cryptographic hash function that can mathematically add a new hash\
    \ value while obscuring the nature of each input. There is no centralised authority\
    \ operating the blockchain only the participants or nodes so if a breach occurs\
    \ on one computer system, the blockchain will reject this particular computer\
    \ data. \n\nFurthermore, to confuse cyberattackers many of the nodes hold a full\
    \ copy of the blockchain database but not all. The continuous verification process\
    \ of authenticating the validity of the data is termed mining. The rewards for\
    \ miners engaging in this authentication process is being paid in a cryptocurrency\
    \ such as `Bitcoin`.\n\nThe caveat for the blockchain technology is that it is\
    \ new, remains largely untested and can be used for criminal activities because\
    \ it is so decentralised and lacks regulation. This means that cyber countermeasures\
    \ are required to work on a number of levels to protect the interconnected vulnerabilities\
    \ of the system or losses to the economy and society can be severe. According\
    \ to the NIST the benefits of smart grids include:\n- improved quality and reliability\
    \ of power\n- optimised facilities that do not require backup during peak load\
    \ times\n- a capacity for predictive maintenance and self-repairing capabilities\
    \ of the system\n- expanded deployment of renewable energy sources\n- reduced\
    \ greenhouse emissions\n- new energy storage options\n- increased consumer choice\
    \ by enabling new products and services and with a new blockchain contract.\n\n\
    All these enhancements require new cybersecurity technologies to protect the system.\
    \ Cybersecurity is therefore an integral part of the smart grid. Without it, interlinked\
    \ losses can be substantial. The scale of it could be seen in the August 2003\
    \ blackout, which caused electricity outages for up to two days and affected 50\
    \ million in eight US states and the Canadian province of Ontario. The resultant\
    \ cost to the US and Canadian economies was between US$4 to 10 billion. There\
    \ were blackouts resulting in train stoppages, bank, business and school closures,\
    \ no public lighting and reduced hospital capacity that had to rely on emergency\
    \ generators. Both private sectors such as businesses and homes as well as the\
    \ public sector experienced severe damage. This ranged from households losing\
    \ perishable goods in their refrigerators/freezers, ill health from lack of hot\
    \ water to rising insurance premiums. Protecting IP may also be included in this\
    \ list of costs from damage caused by such power outages.\n\n## Cyberwarfare and\
    \ smart grids\n\nOne of the worst attacks within the context of geo-political\
    \ conflict was the 23 December 2015 cyberattack against the Ukrainian power facility\
    \ which left 225,000 customers without power and in the dark for roughly three\
    \ hours. The Russian intelligence services were believed to carry out the attack.\
    \ It was this incident of cyberwarfare that made other governments including the\
    \ US think about the vulnerabilities of their smart grids in the event of a cyberattack\
    \ from a rival power. The US initiated new investment in countermeasures against\
    \ such damaging acts of cyberwarfare. \n\nDuring the 2015 cyberattack against\
    \ the Ukrainian power grid, which was the first known power outage from cyberattack,\
    \ with 30 substations affected, an estimated 73MWHh was not supplied. It was suspected\
    \ that the Russian persistent threat group called `Sandworm` was responsible as\
    \ it occurred during the political and military conflict between Russia and the\
    \ Ukraine over Crimea. As mentioned in this book in [Chapter 4](#ch13.xhtml#book-part-004)\
    \ on Russia, the country has many government and military-linked hacker groups\
    \ who use sophisticated means to attack geo-political enemies but in a manner\
    \ that is difficult to trace. \n\nThe cyberattack was very much in keeping with\
    \ a sophisticated Russian cyberattack using the following steps:\n1. The first\
    \ step involved compromising the network through an e-mail using `BlackEnergy`\
    \ malware. `BlackEnergy` is a much-used malware created by the Russian underground,\
    \ which automates criminal activity and has been sold since 2007. Originally,\
    \ it was a toolkit used to create botnets for carrying out DDoS cyberattacks.\n\
    2. Second, the hackers harvested user credentials.\n3. Third, the hackers seized\
    \ control over the digital control systems of the power plant by remotely switching\
    \ off the substations.\n4. Then they disabled IT infrastructure components and\
    \ destroyed files on IT infrastructure using `KillDisk` malware.\n5. Then they\
    \ deployed a DoS attack on the power plant call centre.\n\nThis cyberattack was\
    \ coordinated efficiently and thoroughly. In this geo-political, cyberwarfare\
    \ attack the United States, being an ally of the Ukraine, was keen to understand\
    \ the nature of the cyberattack and its malware. A report ensued entitled *Seven\
    \ Strategies to Defend Industrial Control Systems*, written by the DHS in 2015.\
    \ As the cooperation between the US and its ally Ukraine was very strong, the\
    \ former was allowed to analyse the cyberattack in detail and to create better\
    \ cybersecurity measures for potential cyberattacks on power grids.\n\n## Cybersecurity\
    \ solutions for smart grids\n"
