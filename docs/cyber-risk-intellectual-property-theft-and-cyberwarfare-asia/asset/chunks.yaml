  trans: '

    正如本书作者在之前的著作中所提到的，船舶的 GPS 系统曾遭受黑客攻击，书中记录了许多黑客对船舶进行 GPS 操纵的案例。之一是非洲之角附近的索马里海盗通过操纵这条繁忙航道上船舶的
    GPS 系统，使其驶入索马里海域，从而劫持船员索要赎金并偷走船上的任何贵重物品。另一个案例是 2018 年的新加坡，一艘名为`约翰·麦克因海军号`的美国军舰通过`GPS`被操纵，几乎与一艘尼日利亚油轮发生碰撞。此类
    GPS 操纵的最新案例出现在 2019 年，中国及周边沿海港口发生的 GPS 欺骗攻击日益增多。


    2019 年 7 月，一艘在上海港附近的黄浦江航行的美国集装箱船在其电子图显示系统屏幕上看到船舶出现又消失。当它靠近上海泊位时，其`GPS` 系统丢失了所有信号。分析全球冲突与安全的非营利组织高级防御研究中心对该地区的`自动识别系统
    (AIS)` 数据进行了调查，发现这种情况已经持续了几个月，数百艘外国船舶在穿越黄浦江水域时遭到欺骗并丢失了 GPS 信号。与传统的 GPS 欺骗（将所有信号移动到同一位置以使船舶困惑）不同，这次最新的网络攻击将所有信号移动到一个圆形区域内。由于沿海地区
    AIS 数据分布密集，欺骗行为在这些地区更容易被发现。2017 年，黑海曾有多艘船舶遭到欺骗。这种现象很可能发生在其他地方，但由于缺乏 AIS 数据，极难被检测。


    GPS 干扰（阻塞卫星信号使接收器无法工作）和 欺骗（使 GPS 接收器显示虚假位置）都在增加，并具有导致船舶驾驶台混乱的能力，特别是在繁忙的港口航行时。由于网络攻击导致的
    GPS 故障对船舶和整个航运业来说是非常危险的。船长可以使用多种补救措施尝试纠正局面，包括：手动绘制船舶的最后已知位置；切换到主或次级导航形式；记录`GPS`
    故障发生的确切位置；使用所有可用的导航手段进行安全航行；立即向相关部门报告所有故障。


    ## 海军承包商成为目标


    另一个同时遭受知识产权盗窃和网络战争目的攻击的海事贸易分支是海军承包商。中国黑客已参与了大规模网络攻击，窃取从船舶维护数据到导弹计划的一切信息。2018 年
    6 月，发生了一起针对海军承包商的大规模泄露，盗取了用于攻击潜艇的超音速反舰导弹的秘密计划。此类原型将涉及知识产权盗窃。黑客攻破了位于罗德岛州纽波特的美国海军`海军水下作战中心`下的一家未公开分包商。此次泄露非常严重，以至于海军部长`理查德·斯宾塞`下对其部门的网络漏洞进行审查。在为期
    18 个月的时间里，黑客通过网络泄露获取了五项以上被认为对保持美国海军军事优势的关键信息。中国军方和政府否认参与，但海军官员表示，该黑客攻击具有中国网络攻击的所有特征，旨在寻找美国海军防御中的漏洞，以便在不发一言通过网络战争手段进行利用。


    ## 内部威胁


    对武器和敏感技术知识产权蓝图的需求日益增加，这些通常与海军和海事活动有关，潜在的对手也随之增加。在冷战期间，只有苏联，但现在，正如本书概述的，中国、俄罗斯、朝鲜和伊朗正越来越多地参与此类活动。自
    2013 年以来，美国约有 3000 人被`国土安全部 (DHS)`抓获试图走运武器和弹道导弹电路等敏感技术。联邦探员还没收了 7000 多个物品，如喷气发动机零件和微芯片，这些物品本要走运给对手。更为严重的问题是，与所有混合网络战争攻击一样，还有国家或航运组织内部的敌人正在窃取知识产权或从美国海军等防御性军事部门走运零件。一个案例是一个德克萨斯州商人，他被支付
    150 万美元，为俄罗斯和中国的太空计划购买抗辐射电路。这位名为`Peter A. Zuccarelli`的商人一直与一个出生在巴基斯坦的美国公民领导的走私集团合作。法院文件证实，`Zuccarelli
    先生`伪造了货运文件并将电路误标记为用于触摸屏电脑。他于 2018 年 1 月被判入监禁。


    ## 网络攻击保险保障


