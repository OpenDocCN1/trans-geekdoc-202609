    \ experts in cybersecurity whose job it is to tackle those threats before they\
    \ cause us harm. Just as AI can ‘learn’ to spot patterns of coincidence or behaviour\
    \ that can signal an attempted attack, it can learn to adapt in order to disguise\
    \ the same behaviour and trick its way past our defences. This added level of\
    \ complexity also forms a geo-political threat between many state actors such\
    \ as the US, Russia and China. \n\n## East and West lead to increased security\
    \ threats\n\nThe internet and the online world is an international entity – relatively\
    \ free of borders or restriction on the free movement of information and ideas.\
    \ It’s been built that way to leverage international cooperation and talent. In\
    \ reality, the corporations, networks and associations that provide the infrastructure\
    \ behind the scenes are legal entities obliged to comply with national laws and\
    \ regulations. \n\n## Political interference is increasingly common and increasingly\
    \ sophisticated\n\nTargeted disinformation campaigns aimed at swaying public opinion\
    \ have almost become an accepted feature of democracy today. So far, cybercrime\
    \ targeting elections has taken two forms. The first involves the spreading of\
    \ ‘fake news’ and false narratives – usually designed to slur a candidate – via\
    \ social media. The second is direct attacks against candidates’ or digital electoral\
    \ infrastructure. Countering the false narratives means building systems, either\
    \ automated or manual, that can sift out lies, propaganda and bad-faith by analysing\
    \ both content and metadata – where the information originates from, and who is\
    \ likely to have created it. \n\n## The cybersecurity skills gap continues to\
    \ grow\n\nDuring 2020, it is projected the number of unfilled cybersecurity jobs\
    \ will increase from just 1 million in 2014 to 3.5 million in Australia. This\
    \ deficit of skills is likely to become a growing matter of public concern during\
    \ the early part of this new decade. The threats we face in cyberspace today,\
    \ from thieves attempting to clone identities to carry out fraud, to political\
    \ disinformation campaigns designed to alter the course of democracies, will only\
    \ become more intense unless there are sufficient people with the skills to counter\
    \ them coming through the pipeline. In NSW this is an area where significant work\
    \ has been done creating a cyber talent accelerator that links areas of talent\
    \ to business. A pipeline from schools, vocational education and training through\
    \ to higher education has been created. "
