    大卫·彼得鲁斯将（前中央情报局局长、美国陆军退役将领）支持卡特将军关于未来战争将在网上进行的观点。他认为网络战正日益受到中国和俄罗斯的推动。他看到，中国在过去
    40 年中作为大国以前所未有的崛起，俄罗斯的复仇主义倾向，是改变全球战争国际规范的驱动力。他此归功于俄罗斯迫使`NATO`（北大西洋约组织）进行现代化，并使其理解未来的战争将在网络空间和现实太空中进行。卡特将军认同，中国和俄罗斯都破坏了所谓武装冲突的法律和伦理基础。他承认未来的战争将变得以信息为中心，对信息的控制和操纵将成为任何冲突的核心。


    ## 网络战争与保险


    保险业在试图定义网络攻击的本质时，再次反映了当前的现状。`Capsicum Reinsurance`的一份新报告明确表示，保险业将无法依靠传统方法来判断网络攻击是否应被视为战争行为。报告建议，应将网络攻击视为一种危险，并从这一起点出发决定在战争背景下如何对其进行保险。


    ## 网络战争与政治干预


    俄罗斯正在使用一种新型网络战，为战争的定义增加了新的维度。它正在使用一种极其有效的政治和虚假信息战，这种形式比传统战争有效得多。它针对非常特定的政治弱点（如选举），而对银行或基础设施等其他部分保持现状。通过这种方式，俄罗斯黑客只需极少的时间和金钱，无需杀死任何人或造成明显的物理破坏，让一个国家的领导人在不被察觉的情况下执行有利于俄罗斯的政策。涉及虚假信息的网络攻击是间接的、难以追踪的，并且可以从一个平台转移到另一个平台。这反映在目前对即将到来的
    2020 年美国选举的担忧中。2016 年的选举由于俄罗斯通过社交媒体的协同干预，对特朗普为领导人的共和党支持更多。这包括通过虚假信息通过对`希拉里·克林顿`的坏行为和不可信的人格进行虚假描述来恐吓选民，以及让不存在的美国人作证为什么选民不应该投票给`克林顿`。人们担心，如果不对为美国所有政党候选人提供一种能够抵御此类受俄罗斯支持的政治网络战争攻击的网络安全基金，将再次使选举偏向民主党。这种为所有竞选者提供此类网络安全资金的尝试被参议院共和党领袖米奇·麦康威尔所否决，他支持个人和政党应该提供自己的网络安全观点。日益明显的是，雇佣私人网络安全公司以确保选举公平的成本远超大多数政党和个人的能力范围。在英国，陆军已被征集来针对俄罗斯政治干预发动网络战（例如社交媒体上贬低军队效能的虚假信息），通过部署士兵在社交媒体上工作来阻止此类具有潜在破坏性的干扰。陆军司令官伊万·琼斯中将将利用其部队，通过社交媒体以数字方式抵御恶意的俄罗斯影响以及伊斯兰国（Isil）等恐怖组织的影响。


    ## 网络战争产权盗窃


    然而，一种非政治但具有物理破坏性的网络战争可能变成现实，并与知识产权盗窃有关。《华盛顿邮报》在 2018 年报道，中国政府入侵了一家美国海军承包商，窃取了大量与潜艇战争相关的高度敏感数据。


    ## 网络雇佣兵


    随着网络战争的出现，一种新型雇佣兵正在兴起。这是受雇执行计算机战争的网络雇佣兵。战争正在被外包和私有化给一群新的网络雇佣兵。国家对网络雇佣兵的吸引力在于，他们可以被用难以追踪的非国家行为者，特别是在执行国家想要撇清的脏工作时，例如
    2015 年俄罗斯黑客对乌克兰政府系统的网络攻击，这给全球带来了数亿美元的损失。受雇的网络黑客可以更容易嫁祸他人并掩盖踪迹，因为他们可以快速从一个国家移动到另一个国家。在与伊朗的冲突中，越来越多的证据表明，美国正在放弃传统战争方法，转而使用更具双性的网络战争形式。美国已准备好所有的传统战争手段，但在发动空袭前几分钟停止了，作为对霍尔穆兹海峡国际海域击毁一架价值
    1.3 亿美元无人机以及对非伊朗油轮进行攻击的报复。美国转而发起了网络攻击。其目标是开发与美国指责伊朗革命卫卫队通过针对美国的网络攻击所实施的影子战争类似的行动。这些网络攻击针对一个美国官员认为是该系列油轮攻击背后的伊朗情报机构，旨在关闭该情报小组使用的计算机和网络。另一项独立的在线行动针对控制伊朗导弹发射的计算机。这种影子混合战争通过网络和实际物理攻击等间接手段，例如使波斯湾地区的保险费（这次是劳合公司）过高，而美国、欧洲以及日本依赖该地区的石油。根据
    CrowdStrike 和 FireEye 等网络安全公司的说法，伊朗在 2019 年 6 月一直在使用极可能是政府支持的黑客，通过发送大量钓鱼邮件攻击美国政府机构以及石油、天然气和金融等关键经济部门。


    ## 网络攻击的部门目标


    在书中我们还将研究受网络攻击影响日益严重的工业部门，这对比产权盗窃和网络战争具有影响。电网最常受到攻击，其次是石油和天然气。后者在全球范围内拥有复杂的网络和物理基础设施。


    ## 航运与航空部门


    '
- fmt: '

    Although it would appear that the avaiation sector should be a prime target of
    cyberattack, it has been less of a target than the marine sector, for example.
    This has been the case largely because of the very strict security at airports
    that was tightened substantially since the 9/11 terrorist attacks that took place
    in 2001 in the US. Yet, a recent report by the Atlantic Council in the US argues
    that the aviation industry has a good deal of work to do in relation to pilot
    training and information sharing. The shipping industry has long underemphasised
    its vulnerability but is realising its susceptability to cyberattack in recent
    years. According to a new report from Allianz Global Corporate and Speciality
    (AGCS), the shipping industry is acknowledging that events such as the `NotPetya`
    attack of June 2017 has put at risk not only safety but also operations and revenue
    of maritime trade upon which all global industrial trade is reliant. Another sector
    that is increasingly vulnerable is medical/healthcare (as mentioned in my last
    book on the subject `Managing Cyber Risk in the Financial Sector`). A medical
    testing company in the US, `Labcorp`, reported a 7.7 million customer personel
    and financial data breach. The breach occurred through a third-party billing collections
    agency company. Cyber theft of IPR can also take the form of very longstanding
    disputes between telecoms companies, for example over design or patent theft.
    The `Qualcomm`, `Samsung` and `Apple iPhone` disputes have been some of the longest
    running in the industry. They have been covered in many of my previous books (see
    `Managing Cyber Risk and the Financial Sector` for example) but amazingly are
    still continuing and will be analysed within this book. A recent dispute over
    alleged patent theft has `Huawei`, which is one of China’s largest technology
    companies, accusing the US telecoms company `Verizon` of infringing 238 of its
    patents. The problem is complex because `Verizon` does not buy any wireless or
    networking products off `Huawei` but uses 20 vendors who do use `Huawei` technology.
    `Huawei` is trying to force `Verizon` to pay its licensing fees, which could amount
    to one billion dollars. This request for licensing fees by `Huawei` could be linked
    to China’s threat of retribution against US telecoms/IT companies if they follow
    President Trump’s ban on using `Huawei`’s products because they are a security
    risk to the US, a claim that is ostensibly linked to Chinese cyberattacks and
    theft of US IPR, especially in the defence industry.


    ## Cyber and state control


    Cyber theft of IP and cyberwarfare is increasingly not only used by countries
    against foreign adversaries who they wish to undermine but also against their
    own population they wish to control. In Hong Kong from 12 to 14 June 2019 a massive
    protest occurred challenging a new extradition bill that was to be passed by the
    Hong Kong legislature, which would mean in real terms anyone deemed a ‘criminal’
    in Hong Kong could be extradited to Mainland China. Protestors wary of being silenced
    with no access to independent legal aid if extradicted used their mobiles and
    the secure `Telegram` app to communicate the details of where and when the protest
    would be held. China bombarded the `Telegram` app to disrupt communication between
    the protestors. Another area that can be attacked causing limited but severe infrastructural
    damage are the electrical grids that every major city has to power light, heat,
    air conditioning and many other essentials. This is another target for cyberattack
    often by Russia and rogue states such as North Korea. The importance of power
    grids is becoming more complex as they transform to smart grids. Jacob Mendel
    describes a smart grid as a system that integrates traditional electrical power
    networks with communications and information digital technology. This comprehensive
    system that can manage itself is becoming more vulnerable to cyberattack that
    can amount to a form of cyberwarfare. Many countries such as those in the EU,
    the United States and India are digitising their energy infrastructure, which
    means that they are also being required to develop cybersecurity measures to counteract
    the possible hacking into such essential economic infrastructure. The costs therefore
    are very high if such a cyberattack is successful, not only in monetary costs
    to be borne by the electric company and taxpayers but also in terms of the electric
    company’s reputation, IPR and loss of data to name a few consequential losses.
    Therefore, many countries by necessity are developing cybersecurity tools and
    frameworks to deal with such potentially catastrophic cyberattacks. Yet, recently,
    it has been the US that is attacking Russia’s power grid. In June 2019, the US
    increased its digital incursions into targeting Russia’s electrical power grid.
    This cyberattack was felt acutely at a heating power plant in Moscow. This has
    occurred after years of warnings issued by the `FBI` and the Department of Homeland
    Security (`DHS`) that a Cold War retaliation would ensue if Russia did not stop
    inserting malware into US computers that could sabotage US power grids, water
    supplies and oil and gas pipelines. The Russians were able as early as 2008 to
    begin this Cold War cyberwarfare by dropping `USBs` infected with malware in the
    car parking lot of an American base in a Middle Eastern country. US personnel
    picked them up and inserted them into their computers. The `US Cyber Command`
    was born out of this `USB` malware infected strategy aided by human personnel
    thoughtlessness and error. This was the same year that the Chinese hacked into
    `Lockheed Martin`, the aerospace designer and manufacturer, to steal their IP
    designs of the `F-35` fighter jet. Today China has built a fighter jet very similar
    to the `F-35`. These are cyberwarfare attacks on the military and defence manufacturers
    but in 27 April 2007 the small northern European country of Estonia had all its
    online attacked for weeks to deadly effect. Government agencies, banks and media
    outlets were disabled. Motivation for the attack may have come from the moving
    of a statue of Stalin from the capital Tallinn to the outskirts or from Russia’s
    desire for revenge on Estonia for breaking away politically (Estonia took many
    of the secrets of the Soviet space programme with it as most of the computer programmers
    were Estonian). However, although the hackers had Russian `IP addresses`, it was
    impossible to prove that Russia was responsible because, as mentioned above, cyber
    hackers’ `IP addresses` can be easily obscured. In May 2017 an attack, thought
    to be from North Korea, known as the `WannaCry` ransomware attack, was unleashed
    on 150 countries. The Trojan virus disrupted vital information systems from railways
    to banks and demanded users pay a ransom to restore their data. According to the
    UK’s Ministry of Defence (`MoD`), the cost of cyberattacks in 2018 reached roughly
    US$ 2.1 trillion and this is set to rise by 15% year on year. The major risk according
    to the `MoD` is that cyberattacks can disable or shut down industrial facilities
    and public services.


    ## SME companies

