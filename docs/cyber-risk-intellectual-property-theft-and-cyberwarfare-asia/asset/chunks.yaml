    \ in the personal data of Americans, particularly government employees. After\
    \ those two breaches, other businesses that hold large collections of personal\
    \ data began reporting that they had been targeted. The list included other major\
    \ insurers; Equifax, the large credit reporting bureau; hospitality companies\
    \ such as the Marriott Hotel Group; and airlines such as British Airways.[^(11)](#ch10.xhtml#en14)\
    \ The stolen data never appeared on the so-called dark web, where criminals trade\
    \ it for identity theft and other schemes – suggesting that the attackers had\
    \ a motive other than profit. Security researchers and government officials said\
    \ they believed that the stolen data were being stockpiled. It could be used for\
    \ a number of purposes, including rooting out spies and their collaborators. The\
    \ Chinese authorities could, for example, look at hotel reservations to see if\
    \ people they suspected of espionage stayed in the same city at the same time.\
    \ They could also use sensitive health and financial data for blackmail.[^(12)](#ch10.xhtml#en15)\
    \ A Senate hearing had staff from the FBI (Federal Bureau of Investigation) testifying\
    \ that they wished they had acted more quickly to stop Chinese recruiting US researchers\
    \ to steal IP from laboratories on a large scale. John Brown, Assistant Director\
    \ of the Counterintelligence Division of the FBI, confirmed the findings of a\
    \ Senate subcommittee report that a delay in action by federal agencies allowed\
    \ China to recruit the researchers with the result that US taxpayers inadvertently\
    \ actually funded the rise of the Chinese military and economy. He stated: ‘With\
    \ our present-day knowledge of the threat from Chinese plans, we wish we had taken\
    \ more rapid and comprehensive action in the past.’ Brown added, ‘The time to\
    \ make up for that is now.’ This IP theft occurred despite China’s announcement\
    \ in 2008 of the Thousand Talents Plan in which China had originally planned to\
    \ recruit some 2,000 people but ended up recruiting more than 7,000 by 2017. In\
    \ spite of these warnings the FBI did not respond with any gravitas until 2018.\
    \ Part of the current trade war between the US and China rests with Washington’s\
    \ demands and dismay that China has been using a number of illicit methods as\
    \ described below to take a short cut to advance technologically at the expense\
    \ of the US. The Chinese government, in turn, has denied allegations of espionage\
    \ and has said actual cases of those prosecuted for such offences are politically\
    \ motivated and exaggerated. Senators also asked officials from the National Science\
    \ Foundation, the National Institutes of Health, and the Department of Energy\
    \ and State Department as to what can be done to counter China’s stealing of IP\
    \ from the US. Senator Maggie Hassan stated: ‘I hope very much that this is one\
    \ of the first steps we take in developing a real national strategy in combating\
    \ this because clearly China has a strategy, and we need one of our own.’ Senators\
    \ Rob Portman, the Republican subcommittee chairman, and Tom Carper, its top Democrat,\
    \ noted they would use the report to write legislation to end ‘this abuse’ of\
    \ US research, IP and taxpayer money funding it.[^(13)](#ch10.xhtml#en16) The\
    \ European Union (EU) issued a report in October 2019 warning without mentioning\
    \ any names that a country hostile to the interests of the EU could use its 5G\
    \ telecoms infrastructure to create havoc through cyberattacks at every level\
    \ of the political economy and society. Yet, the implication pointed to Chinese\
    \ telecommunications giant Huawei, which has been banned by the US for exactly\
    \ these cyber risks.[^(14)](#ch10.xhtml#en17) To date, Huawei will not be asked\
    \ to participate in 5G development in the UK. However, it is not just external\
    \ enemies from foreign companies/countries who use cyberattacks to obtain stolen\
    \ IP. In the US people who commit such espionage are seen to be motivated by other\
    \ drivers. US officials who have studied the crime of espionage created an acronym\
    \ that establishes motives: MICE (money, ideology, compromise and ego). Seeming\
    \ American patriots such as suburban based Kevin Mallory are typical of those\
    \ recruited by Chinese agents to steal US trade secrets for them.[^(15)](#ch10.xhtml#en18)\
    \ Russia is the other significant land of hackers who steal IP, trade secrets\
    \ and data. The Bank of Lithuania noted that cybercrime poses the greatest risk\
    \ to its domestic financial system.[^(16)](#ch10.xhtml#en19) This is why a small\
    \ country such as Lithuania in 2019 ranked fourth after the UK, the US and France\
    \ in cyber preparedness having installed a network of comprehensive cybersecurity\
    \ systems and relying on innovation to find cyber solutions. It was ranked in\
    \ 2017 by the United Nations (UN) Survey as 57th for cybersecurity readiness.\
    \ Since then, it is leading an EU initiative to create a cyber rapid response\
    \ force.[^(17)](#ch10.xhtml#en20) \n\n## Cyberwarfare definitions and directions\n\
    \nYet again warfare is not a new subject but unfortunately part of the human condition\
    \ since time immemorial. The essence of human warfare is a relentless quest for\
    \ power and domination over others whether they be nations, tribes or individuals.\
    \ Warfare also involves theft of the resources, material objects, property in\
    \ any form and even happiness of others targeted. However, conventional warfare\
    \ is becoming a relic of the past to be replaced by cyberwarfare. As General Sir\
    \ Nick Carter, the Chief of the Defence Staff in the UK has stated, Britain is\
    \ ‘at war every day’ due to constant cyberattacks from Russia and elsewhere. He\
    \ further noted that distinctions between peace and war ‘don’t exist any longer’\
    \ in the modern world and that \n\n> I feel I am now at war, but it’s not a war\
    \ in the way we would have defined it in the past. And that is because great power\
    \ competition and the battle of ideas with non-state actors is threatening us\
    \ on a daily basis. "
