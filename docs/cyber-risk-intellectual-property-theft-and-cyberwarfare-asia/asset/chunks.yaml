- fmt: "\nSupply chains are becoming more advanced in Japan having increased dealings\
    \ with companies in other countries. It was found in a recent survey by the Osaka\
    \ Chamber of Commerce that only 4% of SMEs in Japan have implemented information\
    \ security measures according to government guidelines on cyber risk. Osaka has\
    \ been traditionally a major centre of SMEs supplying `shogo shosha`, having their\
    \ own trade-union-like organisation that is local to their members. The survey\
    \ also showed that the majority of the SME companies had digital systems that\
    \ allowed unauthorised access. An example of such breaches was an auto parts manufacturer\
    \ in Tokyo that received a warning from its car maker client that suspect e-mails\
    \ were received from it which were infected with viruses. This was potentially\
    \ a very dangerous breach for the client’s company by the SME manufacturer as\
    \ the latter held sensitive information concerning orders in particular. The SME\
    \ supplier company, as most others, could not afford to hire a bespoke IT manager,\
    \ so the large client company had the supply company visit its IT company providers\
    \ to organise effective security measures to resolve the problem. \n\n## SMEs\
    \ under cyberattack\n\nThe Osaka Chamber of Commerce, which has had an IT-related\
    \ department since 1971, selected in September 2018, 30 SME companies to monitor.\
    \ The survey was assessing external communication with their offices over a three-month\
    \ timeframe and found that all of them had suspicious e-mails related to a cyberattack.\
    \ Although all the SMEs monitored were subject to some form of cyberattack, none\
    \ of them actually understood the full nature of the attack. There is a growing\
    \ concern over a potential impact on supply chains due to a delay in implementing\
    \ information security measures among SMEs. According to this survey by the Osaka\
    \ Chamber of Commerce, only 4% of SMEs have implemented measures that comply with\
    \ the guidelines issued by a public body. As supply chains have become more advanced,\
    \ there is a growing risk of a leak of trade secrets held by major companies through\
    \ SMEs to foreign countries. The auto parts manufacturer in Tokyo received a warning\
    \ from its consignor, a car maker, saying that they had received suspicious e-mails\
    \ from it. It turned out that this manufacturer’s PCs were infected by viruses\
    \ that then affected the large car maker. The manufacturer had been dealing with\
    \ important data related to orders coming from the car maker. As this SME did\
    \ not have anyone in charge of IT, it visited an IT company designated by the\
    \ car maker to resolve the matter and to set up security measures that hitherto\
    \ were not present. Mr Ooshiba of the Security Business Department of Digital\
    \ Hearts, a software inspection provider in Tokyo, stated in relation to this\
    \ situation: ‘They are aiming to steal the design drawing of cars manufactured\
    \ by a major car maker by way of SMEs that are poorly prepared against cyberattacks.’\
    \ No matter how hard major car makers implement countermeasures, important information\
    \ that is shared with their contractors will be put at risk if these contractors\
    \ remain vulnerable to cyberattacks.[⁵](#ch12.xhtml#en69) The above assessment\
    \ has been supported by another survey by Dell Japan and EMC Japan between 2017–2018\
    \ that showed that only 4% of Japanese SMEs had adopted the security measures\
    \ recommended by the Information-technology Protection Agency (IPA). A study by\
    \ Dell Japan carried out between December 2018 and December 2019 showed that only\
    \ 38% of SMEs had one bespoke IT person while 19% were without any specialised\
    \ IT person. In 2017, the IPA carried out 1,249 interviews with large companies\
    \ concerning cybersecurity risks linked to supply chains. They found that only\
    \ 47% had knowledge of the cybersecurity measures of their sub-contractors or\
    \ consignees with whom they had no direct contact. Outsourcing therefore produced\
    \ further layers of risk that were difficult for large companies to trace. The\
    \ IPA has issued a statement of ‘10 major threats to the information security\
    \ business 2019’ showing that supply-chain cyber risk now ranks fourth for the\
    \ first time. Domestic cyber risk is not necessarily the greatest risk for supply-chain\
    \ attack. Overseas hackers, whether individuals or state actors, carry out cyberattacks\
    \ through phishing e-mails to infect supply-chain SMEs that have not adopted rigorous\
    \ countermeasures. The situation is such a serious one that a number of public\
    \ bodies are making an effort to research to find out the extent and nature of\
    \ the breaches. The Ministry of Economy, Trade and Industry, the IPA, and the\
    \ aforementioned Digital Hearts will be carrying out a survey on cyberattack damage\
    \ to 100–200 companies in the Miyazaki, Fukushima and Iwate Prefectures. A specialised\
    \ device has been set up in these Prefectures in February 2020, which will monitor\
    \ communications and analyse them on an ongoing basis using AI. Technicians will\
    \ also be sent from Digital Hearts in the event breaches require a visit. Mr Miyazaki,\
    \ who is a security consultant from Digital Hearts, will try to find out the pricing\
    \ range for their services that would be acceptable and affordable to the SME\
    \ companies surveyed. Japan has been looking to the US and Europe as in the US,\
    \ for example, the government administration had warned those companies wishing\
    \ to be part of defence procurement that they must have cybersecurity countermeasures\
    \ in place. Accordingly, Mr Naota Yokohama of the IPA has warned recently that\
    \ any Japanese companies without sufficient countermeasures could be removed from\
    \ supply-chain lists. Mr Yokohama noted that once a breach occurs, which will\
    \ inevitably have multiple company impact, the company responsible will be found\
    \ accountable for the breach. He believes the business contract should make it\
    \ clear but adds the proviso that a number of companies do not even have stipulations\
    \ concerning cyberattack and risk in their business contracts. In a recent IPA\
    \ survey on outsourcing, 80% of company respondents answered that their business\
    \ contracts do not stipulate who is responsible for the new threats of cyberattack.\
    \ The latest moves to facilitate security countermeasures to be adopted in supply\
    \ chain companies include the Ministry of Economy, Trade and Industry facilitating\
    \ discussions concerning how the sphere of responsibility could be defined. For\
    \ example, a contract can contain a duty allotment table, which clarifies beforehand\
    \ the responsibility of maintaining security either by the consignor or consignee.\
    \ Awareness for cyber countermeasures is now required in business contracts by\
    \ law.[⁶](#ch12.xhtml#en70) \n\n## Prevention of cyberattack\n\n## Information\
    \ sharing\n"
