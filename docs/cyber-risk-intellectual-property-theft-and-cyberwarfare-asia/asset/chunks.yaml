    日本政府应对网络安全的行动计划由两部分组成（第一部分为 2018 年年度报告，第二部分为 2019 年新行动计划），主要处理 2018 年日本的网络安全态势及政策的执行状况。第一部分包含三个主要议题，如：制定新战略（2018
    年 7 月 27 日）、修订政府机关信息安全准则组（2018 年 7 月 25 日）以及超越现有框架的信息共享与合作方法（2018 年 12 月 5 日）。第二部分侧重于根据政策采取的方法，以及根据新战略实施的具体举措。理解这些战略对于了解日本如何看待网络威胁攻击，以及如何实施应对知识产权（IP）盗取风险和网络战争方面的预防措施至关重要。


    ## 合并网络空间与物理空间的措施


    2018 年 7 月，政府制定了一项新战略，旨在实现一个“网络安全生态系统”。在该系统中，不仅是政府、关键基础设施供应商和私营部门，预计使用其服务的个人和组织也应参与到网络安全的自主实践中。自
    2000 年以来，政府和关键基础设施供应商一直致力于各项倡议，以增强和维持经济社会的活力。对社会具有重大影响的公司被视为实施网络安全措施的关键参与者。


    ## 网络空间的变化与威胁严峻性的增加


    新的网络安全战略展示了国家在未来三年内（包括临时推迟至 2021 年的东京奥运会）采取各项措施的目标和政策。网络空间的持续发展只有通过在社会各层面上运行的改进型网络安全才能实现。这包括了带网络安全的数字化转型、网络空间中的威胁及其影响（如运营和服务中断、信息泄露、网络钓鱼和欺诈以及勒索软件）。诸如
    G20 和东京奥运会等国际活动易受到网络攻击的威胁，因为它们是吸引媒体关注的非凡事件，且在发生网络战争攻击时将产生最大影响。人工智能（AI）也被纳入考量范围，AI
    相关议题分为四类：使用 AI 的攻击、AI 的自主攻击、针对 AI 的攻击以及使用 AI 的安全措施。由于 AI 是一项相对较的技术，人们正在就责任问题探索可能的网络违规行为，特别是当由于
    AI 机制采取的看似独立的行动导致事故时。例如，网络战争机器人的算法缺陷可能采取致命致命行动。所有反应对措施和政策都包含了对“网络安全生态系统”内普通社会的支持。这类似于通用的创新生态系统，但在这种情况下，网络安全提供的保护将有助于创新的产生，从而创造价值。这一生态系统反过来将用于投资、研发和人力资源，导致社会进一步的创新。每位公民都被认为对网络安全措施有意识和理解，并在日常生活中自主应对风险，例如通过洗手预防感染或遵守交通信号灯以防止车祸。因此，网络防御不仅是主动的，而且完全整合到社会的每一个层面。针对网络威胁的积极预防措施的实施包括修订`NICT`（信息通信技术研究机构）法律。这是一种创新方法，因为该法律允许在事故发生前对潜在的`IoT`设备进行调查。另一项创新是`CSC`，它允许私营部门的参与。


    ## 2018 年网络安全措施的绩效与评估


    2018 年采取行动的部分成果包括举办关于`网络安全管理`的研讨会和信息保护手册，旨在增强企业高管和高级管理人员的意识。其他采取的行动还涉及与安全供应链相关的`网络物理措施`公开听证会、通过`IPA`（信息处理促进机构）和`JPCERT/CC`加强系统、进一步加强信息共享、IT
    资产保护以及为奥运会做准备的高等教育研究环境。对于已行的日本-东盟（东南亚国家联盟）网络安全政策会议，还有“在日本证明”的概念。至于`CSC`，其运作从 2019
    年 5 月开始，第二和第三成员已开放。主要部门在 2019 旨在实现的目标是：增强网络安全意识、促进网络安全投资、加强支持创新的网络安全业务、支持中小企业、`IoT`标准的系统化和国际化、进一步保护关键基础设施、进一步促进信息共享、网络安全国际合作与协作，以及促进网络安全的研发和人力资源实施。


    ## 风险管理实践


    在日本，人们担心缓解所有形式的（与知识产权和网络战争相关的）网络风险的唯一方法，是让所有相关人员做好准备，使其成为反应对措施中不可或缺的一部分。利益相关者需要就如何在内部工作以防止网络攻击交换信息和意见。私营部门和政府必须共同努力保护关键基础设施。`CEPTOAR`理事会由包括政府组织在内的独立机构组成，用于与多元利益相关者合作，跨部门促进信息和意见交换的加强，同时收集研究和分析新风险源及风险所需的信息。高层管理人员被认为有责任作为对整个社会贡献的个人在网络安全方面发挥领导作用。高级管理人员需要不断采购和维护预算、系统和人员，以确保上述所有措施的实施，并以最无风险的方式进行分配。

