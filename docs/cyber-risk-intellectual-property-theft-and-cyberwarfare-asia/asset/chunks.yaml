  trans: '

    加密货币为无论是国家行为者还是个人的网络黑客提供了另一个滋生的机会。这种看似无害的替代货币系统为大量网络犯罪分子提供了掩护。一个典型的例子是朝鲜国家行为者，他们正利用日益复杂的手段通过网络攻击/网络战争获取资金。联合国最近的一份报告概述了受国家支持的朝鲜网络黑客如何从金融机构和加密货币中盗取了至少
    20 亿美元。这些资金要么受全球国家监管，要么在加密货币的情况下由不受监管的投机者持有，被用于制造大规模杀伤性武器（WMD）和导弹，以威胁其支持者中国大陆以外的全球敌人。


    这份联合国报告长 33 页，附有 192 个附录，记录了至少 35 个朝鲜国家行为者从金融机构和加密货币中盗取资金的案例。此外，他们还从全球先进的导弹生产国盗取知识产权蓝图。


    加密货币是网络盗窃的首选目标，因为根据联合国报告，它们更难追踪，且不受不同国家中央银行系统的监管和监督。通过 30 个海外朝鲜银行网点，来自朝鲜境外资金的此类非法转变为提供了便利。


    由于 Facebook 首席执行官马克·扎克伯格试图推出名为 `Libra` 的新加密货币，加密货币的使用面临着许多障碍。考虑到人们批评俄罗斯如何利用社交媒体使
    2016 年美国大选倾向于唐纳德·特朗普，此举已遭到了怀疑。一些由流氓独裁者领导的国家和小岛屿国家也曾尝试发行加密货币，这将提振它们的经济，并允许像朝鲜这样的独裁政从非法收益中洗钱。


    委内瑞拉曾尝试推出一种主权加密货币 `petro`，但失败了。马绍尔群岛小政府于 2018 年启动了 `SOV Development Fund`，以创建一种名为
    `SOV` 的加密货币。政府在立法机构通过了一项法案来支持 `SOV`，因为它将为遭受美国打击洗钱打击的岛民募集急需的收入，而这种打击增加了合规费用，导致大多数银行不再愿于在马绍尔群岛经营。


    通过 `SOV`，马绍尔群岛可以直接发送自己的货币，而无需使用全球银行系统。问题在于当接收者试图将 `SOV` 转换为美元或其他当地货币时。此外，国际货币基金组织和美国财政部已担心，这种基于
    `SOV` 的收入建设可能对马绍尔群岛的声誉和洗钱风险产生高昂。马绍尔群岛政府反驳称，`SOV` 是防篡改的，并允许实施低成本的合规。


    由于加密货币带来的风险以及网络犯罪分子对其的使用（特别是与勒索软件攻击的关系），它们在主流市场正变得越来越缺乏吸引。英国海洋工程公司伦敦离岸顾问公司 (`LOC`)
    被一个名为 `Maze` 的组织入侵，该组织声称盗取了 300GB 数据并在网上泄露了部分内容，以迫使 `LOC` 赎金以解锁被冻结的电脑。2019 年 12
    月初，FBI 警告称自去年 11 月以来发现了 `Maze` 勒索软件攻击，这些攻击通常伪装成美国政府机构，窃取数据并加密以进一步勒索受害者。`Maze`
    使用的多种方法之一是他们自己创建的恶意假加密货币网站，外加垃圾邮件冒充政府机构。


    ## 供应链网络攻击入口


    '
- fmt: '

    Another route for obtaining data, IP theft and the implantation of malware that
    has not been given adequate attention by companies leading to indirect breaches
    from both individuals and state actors is through supply chains. Most companies
    large and small, as well as government agencies, rely on some form of supply chain,
    which is required for both products and services. In fact, the larger the company
    the more it relies on supply chains. A recent example involves two hotel chains,
    one with 107 hotels in 14 countries and the other with 73 hotels in 14 countries
    worldwide. A Magecard skimming campaign compromised the hotels’ mobile websites
    through a third-party supply chain. Trend Micro researchers found that hackers
    had targeted `Roomleader` based in Barcelona implanting a malicious `Javascript`.
    `Roomleader` offers digital marketing and website development services assisting
    hospitality companies with their booking functions through a library module named
    `viewedhotels`, which serves to save viewed hotel information in guests’ browser
    cookies. In line with the usual `Magecart` attacks the skimmer was designed to
    glean information and data concerning guests’ contact details such as e-mail addresses,
    credit card details and room preferences. In this case the skimmer card was constructed
    to only target mobile website use and not those who had utilised their PCs. Desktop
    users in fact were sent booking information using the normal `Javascript`. Joseph
    Chen, the fraud researcher at Trend Micro, suggested that mobile websites were
    targeted because they were not protected by the usual PC security software and
    were easier to enter while escaping detection. The hackers replaced the hotel
    payment forms with their own slightly different version but translated them into
    eight different languages like the original payment forms to help avoid detection.
    Additionally, many hotels do not ask guests for their Card Verification Code (`CVC`)
    doing so when the guests arrive. In their replacement payment forms they were
    sure to request guest `CVC` security codes.


    A recent survey by Microsoft and insurance company Marsh, significant companies
    in both producing computers and insuring their use, reported that company leaders
    have become even more concerned about the rapid increase in cyberattack. Yet,
    these business leaders and executives are even less confident than they were in
    dealing with such cyber risks.


