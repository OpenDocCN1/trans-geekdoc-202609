  trans: '

    全球范围内 5G 通信基础设施建设的第三大重点，被西方大多数国家认为可能导致中国接触其所有的技术和军事计划。这是因为中国政府从 `Huawei` 成立之初就通过大量的国家资金注入对其支持，允许其开发下一代电信技术，即
    5G。这是代际电信发展过程中最全面的步骤之一，且 `Huawei` 领先于全球包括美国在内的所有国家。它以比竞争对手更低的价格向 170 个国家提供智能手机，并主导了全球廉价网络设备的供应。5G
    的到来意味着 `Huawei` 已经在世界大部分地区到位，利用其自身的网络设备进行建设，并且其智能手机的普及在所有被称为 `IoT` 的联网设备中占据主导地位。这意味着中国政府和军队可以通过
    `Huawei` 安装和嵌入的网络设施获得对 `IP`、贸易秘密和个人数据的密切访问权限。华为创始人`任正飞` 及其长女、华为首席财务官`孟万洲` 坚称，他们是一家独立的中国公司，不会让中国政府和军队接触
    `IP`、贸易秘密或个人数据。尽管`孟万洲` 在 2018 年晚些时候在温哥华因欺诈和违反美国官员要求的制裁而被捕，美国官员仍在试图将其从加拿大引渡到美国。许多人，特别是来自情报机构的人员（如五眼联盟：美国、英国、澳大利亚、新西兰和加拿大），对这一真实深表怀疑，因为中国政府对
    `Huawei` 的投入如此巨大且仍在持续进行。


    ### 华为知识产权盗窃


    这种怀疑日益加剧，并于 2020 年 2 月 13 日周四在纽约东区公布的一份起诉书中达到顶点。美国 `DoJ` 指控 `Huawei` 通过窃取六家美国主要电信公司的贸易秘密从事团伙犯罪。被盗的
    `IP` 包括无线技术手册和源代码。这六家公司未具体指明，但根据之前的法院文件，它们最可能是 `Motorola Solutions`、`Quintel Technology`、`Cisco
    Systems`、`T-Mobile`、`CNEX Labs` 和 `Fujitsu`（美国分支）。这些起诉的特定指控涉及 `Huawei` 及其子公司数十年来在美国和中国境内试图从这六家美国技术公司手中挪用
    `IP` 的行为。然而，美国官员最直接的担忧是，5G 超速网络将控制已在 `IoT` 基础上运行的通信，包括关键基础设施，如运行军事基地、工厂和自动驾驶车辆的运营系统。


    ### 损害控制


    鉴于美国在 5G 技术研发方面的缺乏投入，美国政府一直忙于采取措施以控制可能造成的负面影响。美国一直试图限制中国公司获取其新技术，现在正致力于限制中国接触机器人、AI
    进展、先进软件甚至共享研究。与此同时，欧洲盟友也面临着巨大的压力，要求其不采用 `Huawei` 5G 网络设备技术。到目前，`Huawei` 将不会被参与英国的
    5G 开发。正如爱沙尼亚前总统`Toomas Hendrik Ilves` 所问的那样：


    > 我们欧洲的许多人一致认为 `Huawei` 存在巨大的危险，而美国至少一年来一直在告诉我们：不要使用 `Huawei`。你们提供替代方案吗？……除了不使用
    `Huawei` 之外，我们应该做什么？


    2020 年 7 月，德国内政部长`Horst Seehofer` 宣布 `Ericson` 和 `Nokia` 可以取代 `Huawei` 进行 5G 建设，且所有欧盟成员都有相同感受。


    ### 华为 5G 的替代方案


    目前，`Huawei` 的唯一可行替代方案是瑞典的 `Ericsson` 和芬兰的 `Nokia`。他们多年来一直许多欧洲国家提供网络设备，但他们缺乏政府研发支持，以无法低价地将其网络设备扩展到
    5G 水，并与中国政府补贴的 `Huawei` 5G 网络设备竞争。另一种可能的替代方案（同时也利用中小企业的力量）是无线运营商之间讨论的一项计划，涉及由美国运营商开发一种软件和硬件通用的标准架构。这将允许中小企业分别生产标准化
    5G 网络设备的小部分，从而削弱 `Huawei` 的市场主导地位。司法部长 `Barr` 对此计划表示怀疑，但在现实中，2020 年 1 月，参议院情报委员会的高级议员们——来自北卡罗来纳州的共和党人
    `Richard M. Burr` 和来自弗吉尼亚州的民主党人 `Mark Warner`——已经提交了一项法案，拟分配 7.5 亿美元以建立这样一个美国共享专利池系统。此外，还将分配另外
    5 亿美元用于支持全球范围内信誉安全的 5G 网络设备系统。国家经济委员会主任`Larry Kudlow` 在 2020 年 2 月向《华尔街日报》报告，美国政府正在支持软件开发以削弱
    `Huawei` 的努力。


    此外，美国采取了多项应对措施来保护 `IP`。这包括限制中国公司获取美国技术的途径，限制或撤销在美国学习科学技术的中国学生以及被认为为中国从事间谍活动的人的签证。美国商务部于
    2019 年 5 月将 `Huawei` 及其关联公司列入对美国国家安全构成风险的公司名单。该名单将阻止 `Huawei` 在没有美国批准的情况下购买美国零件和技术。美国政府得到了电信公司的支持，他们认为
    `Huawei` 的行为是不可接受的。英国电信（`BT`）作为英国最大的此类公司，在购买另一家基于中国公司网络后，正在移除现有的 `Huawei` 网络设备。`BT`
    对英国情报关于 `Huawei` 网络风险日益增加的警告表示担忧。总部位于伦敦的沃丰达集团（`Vodafone Group`）对购买 `Huawei` 5G
    网络设备实施了临时禁令。此外，2019 年，`Verizon` 和 `AT&T`（美国电话电报公司）在发现 `Huawei` 使用其自制芯片而非美国或欧洲芯片后，停止在其商店销售
    `Huawei` 智能手机。美国 `NSA` 一直提醒电信公司，`Huawei` 正在逐步将其网络设备和智能手机的所有部分替换中国制造的产品，从现实而言这意味着
    `Huawei` 和中国政府将对 5G 网络拥有完全控制权，允许他们在用户不知情的情况下干预并提取个人数据、`IP` 和贸易秘密。这意味着像 `NSA` 这样的情报机构无法警告美国公司或欧洲等盟友，他们正受到中国政府和军队通过植入恶意软件或其他秘密网络攻击进行的间谍活动。


