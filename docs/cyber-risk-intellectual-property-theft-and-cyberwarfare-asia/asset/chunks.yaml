    # 俄罗斯


    ## 网络战与虚假信息


    俄罗斯利用网络攻击的主要目的是重新确立其作为全球主要地缘政治力量的地位，以此约束国内人口并减少任何对其领导政治霸权干预的威胁。知识产权盗窃似乎并非首要任务，因为政治霸权是目标，而不是依赖创新来实现经济增长。俄罗斯拥有无与伦比的自然资源，如燃气储备和矿产，这些资源由与统治核心相关的国家控股寡头控制。


    ## 内部控制优先


    俄罗斯运行一种相对低成本的技术来控制国内互联网，这种技术可以在世界其他地方轻易复制，并用于网络战，允许俄罗斯统治者在全球范围内进行政治干预。俄罗斯的监控技术依赖于压迫性的法律网络、对政府和私营公司的恐吓、临时监控，而不依赖于大规模过滤。这意味着它是低成本且有效的，因为它通过现有的制度结构和组织运作，而不是花费巨资创建新的机构。这意味着从表面上看，俄罗斯人可以访问
    Facebook、Google 和其他社交媒体。为了从实质上控制国内访问，俄罗斯领导层在开放数字空间构建了他们的数字监控基础设施。为了有效地实现这一点，苏联时代的行动搜索系统（SORM，曾用于监听电话）在
    1995 年重新设立，用于监控所有电子邮件和在线浏览。目前，大多数公司根据法律要求安装 SORM 设备。此类公司包括互联网服务提供商、社交媒体平台和电信公司。SORM
    并不阻止信息，而是让克里姆林控制的安全部门和政府机构能够访问流经互联网的所有数据。此类数据访问可以包括互联网 IP 地址、社交媒体用户的真实姓名以及政治反对人士在计划组织抗议集会时的电子邮件地址。俄罗斯公司在全球范围内销售
    SORM 设备，特别是那些希望监控其国内人口的国家，如白俄罗斯、哈萨克斯坦和乌克兰，以及拉丁美洲、中东和非洲的其他国家。MFI Soft 是 SORM 设备最大的供应商之一，提供多种软件包和
    24 小时客户服务。最受欢迎的软件包之一被称为 `SORMovich`，价格约为 2 万美元。MFI Soft 在 2017 年被并入俄罗斯所谓的信息安全公司组成的
    Citadel 集团，这使得克里姆林能够扩大功能并统一价格。在任何地缘政治冲突中，克里姆林控制的 SORM 设备使其不仅能监控本人口，还能对安装了该设备的国家进行信息收集控制。在网络战的情况下，这为克里姆林提供了一个理想的平台，用于策划网络攻击、挖掘影响政治结果的数据，或巩固攻击计划。¹


    ## Runet 全球互联网替代方案

