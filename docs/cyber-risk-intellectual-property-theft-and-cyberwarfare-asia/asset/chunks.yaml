    # 5 中国


    中国（中华人民共和国，简称 PRC）及其追随国家朝鲜利用网络攻击和黑客行为（主要在国家层面）来实现多种目的。其最主要的用途是窃取知识产权（IP），以跟上美国、英国以及以色列等拥有先进技术的西方盟国的科技进步。由于被窃取的大量
    IP 与军事技术有关，另一个用途是通过地缘政治层面的网络战战术来获得军事主导地位。


    ## 知识产权窃取


    存在一种典型的中国窃取 IP 的行为模式。美国司法部（DOJ）调查知识产权窃取已十多年。奥巴马政府与中国达成了停止此类窃取的协议。随后，中国不再履行该协议，导致知识产权窃取增加，美国并通过贸易谈判和惩罚性关税试图迫使中国同意停止窃取美国
    IP。然而，利用贸易谈判（例如 2018 年 12 月世界贸易组织（WTO）贸易会议上的谈判），美国当时指责中国违反法律以推进其经济利益，这与执法人员的观点并不一致。尽管可能在原则上同意中国通过补贴和维持过剩产能（例如在钢铁生产领域）获取不公平优势，并将这些国家补贴的产品廉价倾销到其他国家，迫使这些国家的生产者破产，但当时的司法部并未根据政治局势做出干预决定。在这次
    WTO 会议之前的十年里，司法部通过刑事案件开发利用法治，起诉那些作为中国公司和政府成员的、通过网络攻击手段窃取 IP、商业秘密和军事数据，以将中国培养成全球主要参与者。2018
    年 12 月，在副司法部长 Rod Rosenstein 的领导下，司法部公布了一份起诉书，概括概述了多年的行动，即中国通过从各行业窃取美国知识产权和商业秘密的技术进步，这帮助了中国政府削弱了美国的军事领先地位并打击了国际竞争对手。


    ## APT10 的作用

