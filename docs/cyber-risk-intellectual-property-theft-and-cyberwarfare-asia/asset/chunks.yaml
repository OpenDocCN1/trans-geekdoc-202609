    朝鲜是一个利用网络攻击为大规模杀伤性武器（WMD）筹资金的国家。这是一个利用网络手段来对其邻国发动可能的真实的、物理性战争，或用于国内控制其人口的案例。联合国安全会发布了一份报告，指出朝鲜黑客已盗取了超过
    20 亿美元资金，用于资助核和非核弹道导弹计划。这些被盗资金获取自某些在制裁实施的情况下仍与朝鲜有业务往来的金融机构（如银行），这使得朝鲜人比那些完全遵守制裁且毫无联系的国家更容易攻击这些国家。朝鲜黑客特别针对如`Bitcoin`等加密货币，因为这些货币不受单一国家的监管和审查。这意味着朝鲜政府可以通过网络攻击获得难以追溯来源的巨额收入，并从其他国家窃取与大规模杀伤性武器开发的知识产权。联合国报告发现，这些资金的大部分并未用于发展朝鲜或富其公民，而是为了让金正恩享受奢侈生活，并让其军队配备最新的军事技术，用于制造大规模杀伤性武器。⁶


    ## 俄罗斯网络战争与知识产权盗窃


    有许多例子表明，网络战争、地缘政治/军事竞争以及个人金钱驱动了源自俄罗斯、中欧和东欧国家的众多网络攻击。在保加利亚的一个离奇案例中，凸显了追踪网络攻击元手和动机的困难性：一名年轻保加利亚人被指控实施了重大网络攻击。一名来自保加利亚第二大城市普尔罗夫迪夫的
    20 岁男子被指控实施了保加利亚历史上最大的网络攻击，从国家税务局盗取了该国所有在职成年人的个人数据。该年轻人否认了所有指控，安全专家和西方情报机构也不认可这一事件说明。在保加利亚通过购买
    8 架 F-16 战斗机来加强与北约关系之际，从俄罗斯 IP 地址公开发所有被黑数据的时间点，使得对该保加利亚年轻人的指控显得荒谬。情况尤其如此，因为购买
    F-16 是美国人旨在使保加利亚战斗部队与北约平齐，取代老旧苏联战机的计划。然而，这次泄密是使用黑客使用的最基础工具之一实现的，即`SQL`（结构化查询语言）注入，攻击者利用登录页面插入恶意代码以获取数据访问。这次网络攻击指向了保加利亚政府在网络防御方面的缺乏准备，甚至没有建立基本的防御措施来应对此类黑客攻击。“尽管保加利亚是北约的热心成员，但其网络防御薄弱且多漏洞——可能是联盟中最糟糕的，”前北约四星级指挥官詹姆斯·G·斯塔夫里迪斯将说道。他继续道：“大量的网络犯罪活动（包括一些由俄罗斯国家资助的活动）随可见，”而且“[任何]‘盾墙’的强度取决于最薄弱的屏障，而在保加利亚进行演习和部署期间通过其接入北约基础设施的链路令人担忧。”
    7 换句话之，成功的网络攻击是基于找到进入系统的薄弱环节，以进一步实现网络战争、知识产权盗取和地缘政治目的。保加利亚对北约和俄罗斯的地缘政治重要性显著，因为它位于东欧的维谢格德国家（如波兰、捷克、匈牙利和斯洛伐克）之间。


    ### 维谢格德国家对网络战争的地缘政治重要性


    爱沙尼亚官员早在 2007 年就描述了一个被定义为网络战争的早期案例。源自俄罗斯的网络攻击关闭了政府、媒体和银行系统。这次极端网络攻击发生在爱沙尼亚决定移除一座苏联时代的战争纪念碑之后，当时爱沙尼亚被俄罗斯人作为网络专家来推动其太空计划。俄罗斯领导人最初谴责移除纪念碑的行为，并煽动了俄罗斯族人和爱沙尼亚人之间的敌对，这种敌对演变成了暴力和致命。这种网络战争战术并未平息，而是通过全球范围内的社交媒体日益加剧。这在
    2016 年美国选举中可见，社交媒体充斥着阴谋论和对总统候选人希拉拉·克林顿的魔化。联邦调查局目前担心 2020 年选举将再次受到俄罗斯黑客的干扰。 8 地缘政治网络战争攻击变得越来越复杂，因此更难被定位、隔离和对抗。通常是专家揭露了成为此类政治网络战争目标的俄罗斯网络攻击。`ProtonMail`及其所在的欧洲价值观智库（European
    Values Think-Tank）的专家在 2019 年 7 月下旬成为目标，其首席执行官描述为“他遇到过最复杂的”。根据调查小组`Bellingcat`的说法，这次网络钓鱼攻击针对的是那些分析俄罗斯地缘政治策略的人士。目标人物包括`BBC/*Guardian`的调查记者、`Bellingcat`的研究人员以及关注克里姆林宫外交政策的学者。由于这次网络攻击的复杂性，很难确定位执行者，但`Bellingcat`的调查人员非常确定凶手是俄罗斯的`GRU`（军事情报局）。


    ### 俄罗斯网络攻击的线索


    多条线索使俄罗斯`GRU`成为可能的嫌疑执行者：

    *   用于钓鱼网站的源代码指向一个国家行为者，而非任何个人黑客。

    *   网络攻击的策划时间为一年，这表明国家行为者拥有能够投入如此长时间和大量人力的资源。`Bellingcat`能够重构大部分修改`ProtonMail`图像的恶意代码，并创建了一个伪造图像，该工作始于
    2018 年 3 月 8 日，即在大规模网络攻击发生的一年前。

    * 另一个指向网络钓鱼攻击起源的线索是，`Swisscom`的威胁情报经理`Marcus Neis`发现了一个与最终攻击相关的测试网站，该网站与一个钓鱼网站具有重叠的指纹。`欧洲价值观智库`执行执行官`Jakub
    Janda`表示：


    > 我们的分析师与西方调查俄罗斯敌对行为的精英一起成为目标，这一事实向我们证实了我们正处于之中。这就是揭露俄罗斯独裁政权在中东欧地区敌对活动所付出的代价。在这次事件期间，我们的关键数据没有被泄露。我们要感谢民主国家的安全机构，他们正在帮助像我们这样许多的人。
    9


    ### 东欧外交部遭攻击


