    尽管航空领域似乎应该是网络攻击的首要目标，但与海运行业相比，它成为攻击目标的概率较低。这在很大程度上是因为机场的安全措施非常严格，自 2001 年美国发生
    9/11 恐怖袭击以来，这些措施得到了大幅度加强。然而，美国大西洋理事（Atlantic Council）最近的一份报告认为，航空业在飞行员培训和信息共享方面有大量工作待完成。运输业长期以来低估了自身的脆弱性，但近年来已意识到其对网络攻击的易敏感性。根据安联全球企业及特种保险公司（AGCS）的一份新报告，航运业承认，诸如
    2017 年 6 月的 `NotPetya` 攻击等事件，不仅威胁了安全，还危及了作为全球工业贸易赖以生存的海运贸易运营和收入。另一个日益脆弱的领域是医疗/健康保健（正如我上本关于该主题的著作
    `Managing Cyber Risk in the Financial Sector` 中提到的）。美国的一家医疗检测公司 `Labcorp` 报告了
    770 万名客户人员和财务数据泄露。该泄露是通过一家第三方账单催收公司发生的。知识产权（IPR）的网络窃取也可能表现为电信公司之间长期存在的争议，例如关于设计或专利盗窃。`Qualcomm`、`Samsung`
    和 `Apple iPhone` 的争议是该行业持续时间最长的案件之一。这些争议在我之前的许多书中都曾提到（例如参见 `Managing Cyber Risk
    and the Financial Sector`），但令人惊讶的是，这些争议仍在持续，并在本书中进行分析。最近一起涉及涉嫌专利窃取的争议中，中国最大的科技公司之一
    `华为` 指控美国电信公司 `Verizon` 侵犯了其 238 项专利。这个问题非常复杂，因为 `Verizon` 没有从 `华为` 购买任何无线或网络产品，而是使用了
    20 家使用 `华为` 技术的供应商。`华为` 试图强制 `Verizon` 支付许可费，金额可能高达 1 亿美元。`华为` 对许可费的要求可能与中国对美国电信/IT
    公司的报复威胁有关，如果这些公司遵循特朗普总统禁止使用 `华为` 产品的命令（因为这些产品对美国构成了安全风险），而这一说法表面上与中国的网络攻击和对美国知识产权的窃取有关，特别是在国防领域。


    ## 网络与国家控制


    知识产权的网络窃取和网络战争日益不仅被各国用于对其想要削弱的外国敌手，也被用于对其他们想要控制的本国民。2019 年 6 月 12 日至 14 日，香港发生了大规模抗议活动，挑战香港立法会即将通过的一项新引渡法案，该法案从实际上意味着任何在香港被视为“犯罪分子”的人都可以被引渡到中国大陆。抗议者担心在引渡后无法获得独立的法律援助而被封口，他们使用手机和安全的
    `Telegram` 应用来通信抗议举行地点和时间的细节。中国对 `Telegram` 进行了攻击以干扰抗议者之间的通信。另一个可能导致有限但严重的基础设施破坏的攻击领域是电网，每个大城市都需要它提供照明、供热、空调等许多基本用品。这是网络攻击的另一个目标，通常由俄罗斯和朝鲜等流氓国家发起。随着电网向智能电网转型，电网的重要性变得更加复杂。Jacob
    Mendel 将智能电网描述为将传统电力网络与通信和信息数字技术集成的系统。这种可以自我管理的综合系统正变得更容易受到网络攻击，这种攻击可能等同于一种网络战争。许多国家（如欧盟国家、美国和印度）正在将其能源基础设施数字化，这意味着他们也被要求开发网络安全措施，以应对针对此类关键经济基础设施的可能入侵。因此，如果此类网络攻击成功，成本将非常高，不仅是电力公司和纳税者承担的金钱成本，还包括公司的声誉、知识产权和数据丢失等后果性损失。因此，许多国家迫切需要开发网络安全工具和框架，以应对此类潜在的灾难性网络攻击。然而，最近，是美国在攻击俄罗斯的电网。2019
    年 6 月，美国增加了针对俄罗斯电网的数字入侵。这次网络攻击在莫斯科的一家供热电厂受到了尤为严重。这是在 `FBI` 和国土安全部（`DHS`）发布多年警告后发生的，这些警告称，如果俄罗斯不停止向美国计算机植入恶意软件（这些软件可能会破坏美国的电网、水供应以及石油和天然气管道），将引发一场冷战式的报复。俄罗斯人早在
    2008 年就开始了这种冷战式的网络战争，他们在中东国家的一个美国基地的停车场里投放了带有恶意软件的 `USBs`。美国人员捡起了它们并将其插入电脑。美国网络司令（`US
    Cyber Command`）是在这种人员疏忽和错误帮助下的这种 `USB` 恶意软件感染策略而生的。同年，中国入侵了航空航天设计和制造商洛克希德·马丁（Lockheed
    Martin），盗走了他们的 `F-35` 战斗机知识产权设计。今天，中国已经制造了一架与 `F-35` 非常相似的战斗机。这些是对军事和国防制造商的网络战争攻击，但在
    2007 年 4 月 27 日，北欧小国爱沙尼亚的所有在线系统遭受了数周的攻击，造成了致命影响。政府机构、银行和媒体陷入瘫痪。攻击的动机可能来自将斯大林像从首都塔林迁到郊区，也可能是俄罗斯对爱沙尼亚政治脱离的报复心理（爱沙尼亚带走了苏联航天计划许多秘密）。然而，尽管黑客拥有俄罗斯的
    `IP 地址`，但无法证明是俄罗斯负责，因为如上述所述，黑客的 `IP 地址` 可以很容易被掩盖。


    ## 中小企业


    '
- fmt: '

    Cyberattacks are usually associated with large companies and the large corporates
    are those most written about in relation to such attacks; cyber solutions and
    insurance cover focus on the bigger sized firms. Yet, it is the SME sector that
    often needs cover the most because in the supply chain they are the weakest link.
    Japan, being a country of very large corporations (`shogo shosha`) with large
    trading arms (`keiretsu`) and dependent on many smaller companies for manufactured
    parts, is particularly prone to cyberattacks that involve IP theft through the
    SME supply chains. On 2 July 2019, the Japanese `Nikkei` newspaper warned that
    cyberattacks against SME supply chains can have dire consequences because only
    4% of SMEs in Japan have countermeasures against cyberattack. This means that
    cyber assailants can easily steal the IP blueprints of big car manufacturers through
    attack of the smaller subsidiary SMEs. The Ministry of Economy, Trade and Industry
    (METI) and other governmental agencies are concerned that this weakness against
    the cyberattack on the supply chain of SMEs will weaken overall cyber preparedness.


    SME sectors as a whole need to be analysed within the framework of their special
    vulnerabilities in terms of being attacked directly as they are seen as both repositories
    of innovative IP and because they are part of extensive supply chains SMEs are
    viewed as easy and indirect conduits for stealing IP from larger corporates.


    ## Maritime sector


    Other than digitised power grids we also assess the whole maritime world from
    navies to commercial shipping. Navies constitute the military might of national
    self-defence while commercial shipping underpins the strength of global trade
    so integral to economic success of nations. Cyber risk and attack were not taken
    that seriously in the maritime sector until recently when cyberattack vulnerabilities
    were becoming increasingly exposed in navies of the world that experienced attacks
    on GPS navigational systems whether in the straits of Malacca or by Somali pirates
    in the Horn of Africa. This is changing however, especially with a new report
    from a government watchdog that stated that the US Department of Transportation’s
    Maritime Administration was showing signs of cyber-vulnerability to ‘basic hacker
    techniques’. Cyber risk and attack within these sectors have increased so acutely
    that cybersecurity systems have now become as integral a framework for a ship’s
    safety as structure and machinery according to the Chairman of the International
    Association of Classification Societies (IACS). The IACS has in fact published
    numerous recommendations that explain how the shipping industry can make their
    fleets more resilient against cyberattack and there are further recommendations
    to come. Cybercriminals until recently have been more intent on searching for
    their ill-gotten gains by concentrating on banking and finance sectors. Yet, unaccounted
    for electronic interference such as that recently experienced around the Suez
    Canal approaches and cyberattacks on navies of the world by local hackers in different
    ports are a foretaste of how the commercial shipping industry is being targeted.
    This is placing the onus on commercial shipping to improve their cyber defences
    more rapidly. Navies of the world have already risen to the challenge by spending
    as much on cyber defence as they do on weaponry and ship structures. Navies have
    a particular vulnerability in relation to IP as the `Weaponry Report: Cyber Security`
    notes that defence systems are protected by various aspects of IPR. The United
    States Coast Guard (USCG) has recently issued an alert concerning marine safety
    in relation to cyberattacks in the form of a cyber malware incident on a deep-draft
    vessel that impacted its shipboard network. This incident was so serious that
    it prompted the USCG to request that cyber assessments with regards to cyber vulnerabilities
    be carried out on all related vessels by vessel and facility owners and operators.


    ## Internet of Things


    The Internet of Things (IoT) is defined in my book `Managing Cyber Risk in the
    Financial Sector` (2016: 15) as the interconnectiveness of all systems through
    the internet. This affects cyber risk and attack in a more comprehensive manner
    and also affects the insurance value chain in a similar manner to the aforementioned
    way SMEs act as a conduit for cyber risk and attack as part of a supply chain
    for larger companies. The rapid growth in IoT breaches of cybersecurity is so
    prevalent that a UK government report in 2018 proposed that IoT training to prevent
    and deal with cyberattack from individual or state-sponsored actors become part
    of training for all engineers who work with connected devices. This would include
    plumbers and gas engineers. The Home Office also proposed investing £5million
    to train police forces in cybersecurity measures, especially to protect SME companies
    and individuals. In 2018 only 30% of police forces met the minimum cybercrime
    capability. Amber Rudd, the Home Secretary, at this time noted that the National
    Cyber Security Centre (NCSC) had responded to 49 incidents associated with Russian
    cybergroups with some having hundreds of potential victims. This will be explored
    in subsequent chapters as indirect entry paths for cyberattack to occur is not
    made clear in much of the literature, especially in relation to IoT.


    ## Data breaches

