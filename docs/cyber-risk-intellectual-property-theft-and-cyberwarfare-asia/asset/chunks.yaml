- fmt: '

    The USCG warned in a safety bulletin on 24 May 2019 of a renewed spate of cyberattacks
    such as phishing and malware targeting commercial vessels. Hackers have been attempting
    to obtain sensitive data such as the official notice of arrival through using
    e-mail addresses that appear to be official Port State Control authorities. In
    addition, hackers are installing malicious software that disrupts shipboard computer
    systems.


    Another significant cyberattack targeting ships’ IT occurred in February 2019
    in the US. In this case, a deep-draft vessel on an international voyage bound
    for the port of New York and New Jersey reported that it was experiencing a major
    cyber incident impacting its shipboard network. Cybersecurity experts, led by
    the USCG, responded and carried out an analysis of the shipboard network and essential
    control systems. The interagency team concluded that despite the malware having
    greatly degraded the functionality of the onboard computer system, essential vessel
    control systems had not been impacted. Yet, the interagency response team found
    that the ship was operating without effective cybersecurity countermeasures in
    place, which exposed critical vessel control systems to a number of major vulnerabilities.


    Prior to this cyberattack, the cybersecurity risk presented by the shipboard network
    was well known to the crew. Therefore, most crewmembers refrained from using onboard
    computers to check personal e-mails, make online purchases or to check their bank
    accounts. Yet, the shipboard network was used for everyday administrative business
    such as updating electronic charts, managing cargo data and to communicate with
    shore-side facilities, pilots, agents and the Coast Guard. It is not known whether
    this particular vessel was representative of the current state of cybersecurity
    aboard deep-draft vessels. However, it gave rise to concerns as to whether navigation
    systems and electronic charting were being protected by adequate cybersecurity
    countermeasures, if at all.


    The USCG found that protecting these systems with cybersecurity measures is as
    essential as controlling physical access to the ship or performing routine maintenance
    on traditional machinery. The USCG issued a safety notice stating it is imperative
    that the maritime community adapts to new technologies and increasing cyber risk
    by recognising the need for and implementing basic cyber countermeasures. In order
    to improve the resilience of vessels and facilities, and to protect the safety
    of the waterways in which they operate, the USCG strongly recommends that vessel
    and facility owners, operators and other related parties follow a number of basic
    countermeasures to improve their cybersecurity. These include:


    - **Segment networks**: ‘Flat’ networks allow an adversary to easily manoeuvre
    towards any system connected to that particular network. The solution is to segment
    networks into ‘subnetworks’ to make it more difficult for an adversary to gain
    access to essential systems and equipment.

    - **User profiles and passwords**: Eliminate the use of generic log-in details
    for multiple personnel. Create network profiles for each employee. Require employees
    to enter a password and/or insert an ID card to log onto onboard equipment. Restrict
    access/privileges to only those levels necessary to allow each user to do his
    or her job. Administrator accounts should be used sparingly and only when necessary.

    - **Exercise caution when using external media**: The above-mentioned cyberattack
    showed that it is common practice for cargo data to be transferred at the pier,
    via `USB drive`. Those `USB drives` were routinely plugged directly into the ship’s
    computers without prior scanning for malware or ascertaining if the source was
    trustworthy. It is imperative that any external media should be scanned for malware
    on an independent system before being plugged into any shipboard network.

    - **Install basic antivirus software**: It is important to install and routinely
    update basic antivirus software.

    - **Don’t forget to patch**: Patching is not an easy task, but it comprises the
    core of cybersecurity readiness. Vulnerabilities impacting operating systems and
    applications are constantly changing making the patch an integral part of effective
    cybersecurity.


    In the safety alert related to the cyberattack in the port of New York and New
    Jersey mentioned above, the USCG notes that maintaining effective cybersecurity
    is not just an IT issue, but is rather a fundamental operational imperative in
    the 21st-century maritime environment. The USCG therefore strongly encourages
    all vessel and facility owners and operators to carry out cybersecurity assessments
    to better understand and assess the extent of their cyber vulnerabilities.


    Many of the items of advice given by the USCG seem obvious but the need for this
    points to an underlying problem of cybersecurity unreadiness that exists in the
    maritime sector. It would seem straightforward that a `USB` requires testing before
    inserting it into ships’ computing systems. Yet, as mentioned in `Chapter 1` of
    this book a cyber incident was started by carelessness with `USB sticks` when
    a Russian operative dropped `USB sticks` in a car park used by American intelligence
    workers. The `USB sticks` were picked up by these employees and inserted into
    their work computers with the result that computer systems were infected with
    malware providing entry to the Russian agents to both personal and sensitive data.
    This one act of thoughtlessness can facilitate the stealing of IP, trade secrets
    and plans for cyberwarfare.


    Despite all the advice on how to thwart cyberattacks, one IT security company
    Dualog (specialists for shipping) found in the second quarter of 2018 that after
    scanning a total of 19.3 million e-mails, 160,482 were identified as phishing
    e-mails that had links to unsecured websites while 140,010 were malware with viruses
    and a number of different types of phishing malware. Cyberattacks were on a global
    basis with hackers inserting malware through bots operating from a variety of
    countries. The problem has increased with the growing use of data being sent to
    ships through e-mail attachments.


    ## GPS vulnerabilities

    '
