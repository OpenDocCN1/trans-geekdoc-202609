    \ 2020). [17](#ch18.xhtml#fnen158)`Looking beyond the clouds: a U.S. cyber insurance\
    \ catastrophe loss`, `Chubb`. See [`www.cybcube.com/wp-content/2020/01/Beyond-the-Clouds.pdf`](http://www.cybcube.com/wp-content/2020/01/Beyond-the-Clouds.pdf)\
    \ [18](#ch18.xhtml#fnen159)‘Insurers fear they will join bankers as hate figures’,\
    \ Katherine Griffiths, *The Times* (23 March 2020). \n\n# Conclusion (#ch05.xhtml#tocbook-part-01)\n\
    \n## Future considerations\n\n### COVID-19 future cyberattacks\n\nThe global pandemic\
    \ caused by coronavirus or COVID-19 that began in Wuhan in China through eating\
    \ wild animals that harbour coronavirus from an unhygienic, live food market has\
    \ ravaged the global economy and now global health. Can it cause even greater\
    \ problems for the global economy and social situations such as the potential\
    \ cancelling of the Tokyo Olympics, which would cause further damage to the Japanese\
    \ economy? It seems it can and in relation to cyber risk, threat and attack. As\
    \ unprecedented numbers of people are working from home, the problems of maintaining\
    \ adequate cybersecurity are burgeoning. Phishing attacks have risen by 667% in\
    \ the UK since the start of March 2020.\n"
  raw: "With the COVID-19 pandemic raging and insureds clamouring for cover, insurance\
    \ companies are concerned that they will become the focus of public backlash –\
    \ the fate that befell the banking community after the 2008 financial crisis.\
    \ The message from many insurance companies that they will not pay out for lost\
    \ business or abandoned travel costs is viewed as a lack of empathy with problems\
    \ insureds face when compared to other business sectors such as banks, which are\
    \ offering mortgage ‘holidays’. By comparison, insurance companies are seen as\
    \ greedy as they face an avalanche of complaints from those insureds who find\
    \ they are not covered for critical illness, travel disruption and BI because\
    \ of cyberattacks. Insurers will not pay out for BI because most companies buy\
    \ for day-to-day risks such as flood and fire. Insurers are in difficulties themselves\
    \ as policies did not price in pandemics so they have not been able to create\
    \ reserves to be able to pay out. Executives have stated that they are trying\
    \ to assist customers through policy payment holidays and advice giving but acknowledge\
    \ that creating policies to cover the risk of such devastating pandemics are beyond\
    \ the scope of any domestic insurer.[^(18)](#ch18.xhtml#en159) As the fallout\
    \ grows from COVID-19 cyberattacks mentioned above and the global pressures of\
    \ the pandemic, the insurance industry may also have to prepare for cyberwarfare.\
