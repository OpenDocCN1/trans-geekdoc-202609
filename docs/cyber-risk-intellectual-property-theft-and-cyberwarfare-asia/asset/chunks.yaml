    # [4Russia](#ch05.xhtml#tocbook-part-004)


    ## Cyberwarfare and disinformation


    Russia’s main use of cyberattack is to re-assert itself as a major global geo-political
    force that keeps its own population subdued and reduces the threat of any interference
    to its leaders’ hegemony politically. IP theft does not seem to be a priority
    as political hegemony is the goal rather than relying on innovation for the economy
    to expand. Russia holds unrivalled natural resources such as gas reserves and
    mineral resources, which are controlled by state-run oligarchs who are linked
    to the ruling inner circle.


    ## Internal control a priority


    Russia’ operates a relatively low-cost technology to control the domestic internet,
    which can be replicated easily elsewhere in the world and used in cyberwarfare
    that allows Russian rulers to politically interfere around the world. Russian
    surveillance technology relies on a repressive legal network, intimidation of
    governmental and private companies, ad-hoc monitoring and much less on mass filtering.
    This means that it is low cost and effective as it works through existing institutional
    structures and organisations rather than having to create new ones at great expense.
    This means that Russians, on the face of it, have access to Facebook, Google and
    other social media. To control domestic access in real terms the Russian leadership
    built their digital surveillance infrastructure on open digital spaces. To do
    this effectively the Soviet-era System of Operative Search `SORM`, which was used
    to spy on telephone calls, was re-instituted in 1995 to monitor all e-mails and
    online browsing. Most companies to date are now legally required to install `SORM`
    equipment. Such companies include internet service providers, social media platforms
    and telecommunications firms. `SORM` does not block information but rather gives
    backdoor access to Kremlin-controlled security services and government agencies
    to all data that flows through the internet. Such data access can include internet
    protocol addresses, the real names of social media users and e-mail addresses
    of all political opposition when they are planning to organise opposition rallies.
    `SORM` equipment has been sold by Russian companies all over the world, especially
    those that wish to surveil their domestic populations such as Belarus, Kazakhstan
    and the Ukraine as well as other countries in Latin America, the Middle East and
    Africa. MFI Soft is one of the largest suppliers of `SORM` equipment offering
    a number of packages and a 24-hour customer service. One of the most sought-after
    packages is called `SORMovich`, which can be bought for roughly US$20,000. MFI
    Soft in 2017 became incorporated into the Citadel group of Russian so-called information
    security companies, which would allow the Kremlin to expand capabilities and standardise
    pricing. In any geo-political conflict `SORM` equipment controlled by the Kremlin
    gives it information gathering control not just over its own population but also
    over countries in which it is installed. In the case of cyberwarfare this would
    give the Kremlin an ideal platform to plan cyberattacks, data mining to influence
    political outcomes or to consolidate attack plans.[¹](#ch13.xhtml#en79)


    ## Runet global internet alternative

