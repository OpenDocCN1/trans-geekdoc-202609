    随着新冠肺炎（COVID-19）肆延，被保险人纷纷要求理赔，保险公司担心自己将成为公众抵制的焦点——这正是 2008 年金融危机后银行业业所遭遇的命运。许多保险公司表示不会不对业务损失或放弃的旅行费用进行赔付，这被认为对被保险人所面临的问题缺乏同理心，相比银行等其他业务部门，银行正在提供抵押贷款“假期”。与此相比，保险公司被视为贪婪的，因为他们面临来自被保险人的大量投诉，这些人发现自己的大疾病、旅行中断以及因网络攻击导致的
    `BI`（营业中断）不在保险范围内。保险公司不会赔付 `BI`，因为大多数公司购买的是洪水和火灾等日常风险。保险公司自身也陷入了困境，因为保单定价未考虑大流行病，因此他们无法建立足够的准备金来进行赔付。高管们表示，他们正试图通过保费支付假期和提供建议来帮助客户，但承认制定涵盖此类毁灭性大流行病风险的保单已超出任何本土保险公司的范围。随着上述新冠肺炎网络攻击的影响扩大以及全球范围内大流行病的压力，保险行业可能还必须为网络战做好准备。


