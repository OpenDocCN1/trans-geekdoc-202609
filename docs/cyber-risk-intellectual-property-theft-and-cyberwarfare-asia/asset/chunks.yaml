  trans: "\n\n![cover](img/0.jpeg)\n\n盗取他人知识产权（IP）的欲望始终存在，无论是对于创意个人，还是在专利池中工作以创造新创新的公司团队。政治手段已变得更加复杂，通过创建开源访问权限来贬低人类创作成果的价值，而这种访问可以被任何人自由取用。改变的是基于网络的新技术，它增加了知识产权被窃取的可能性。同样，为了地缘政治目的而进行的战争并不新奇，但实际上能够通过网络空间实施基础设施破坏的先进网络手段是新的，并因此被称为网络战争。本文探讨了在物联网（`IoT`）等新型复杂数字技术，网络策略如何应用于知识产权盗窃和网络战争，并结合了经济中的特定关键部门：海洋、智能能源电网和保险。基于网络攻击的接收方或实施者（或两者兼有）的国家特定研究对日本、中国、朝鲜、俄罗斯、欧洲（特别是英国）、伊朗和美国进行了分析。`Ruth\
    \ Taplin`（伦敦政治学院博士，法学研究生证书）是《跨学科经济与商业法杂志》（`IJEBL`）编辑，23 本书和 200 多篇文章的作者/编辑，Routledge\
    \ 特色作家以及日本及东亚研究中心主任。\n\nRoutledge 亚洲增长型经济研究 139\n韩国的创新、投资与知识产权 Park to Park `Ruth\
    \ Taplin` 140\n南亚的小信贷替代方案 Akhuwat 的实验 `Shahrukh Rafi Khan and Natasha Ansari`\
    \ 141\n南亚的发展议程与捐赠者影响 孟加拉在 PRSP 制度下的经验 `Mohammad Mizanur Rahman` 142\n中国一带一路倡议如何改变全球经济格局\
    \ `Yuan Li and Markus Taube 编` 143\n亚太地区的工会与劳工运动 `Byoung-Hoon Lee, Sek-Hong Ng\
    \ and Russell Lansbury 编` 144\n国际创业：比较比较分析 `Susan Freeman, Ying Zhu and Malcolm\
    \ Warner` 145\n中国大都市的仪式与经济：一种全球性社会科学方法 `Carsten Herrmann-Pillath, Guo Man and\
    \ Feng Xingyuan` 146\n网络风险、知识产权盗窃与网络战争 亚洲、欧洲与美国 `Ruth Taplin`  \n有关本系列的更多信息，请访问：[www.routledge.com/asianstudies/series/SE0133](http://www.routledge.com)\n\
    \n# 网络风险、知识产权盗窃与网络战争\n\n## 亚洲、欧洲与美国\n\nRuth Taplin ![Image](img/1.jpeg)\n\n2021\
    \ 年由 Routledge 首次出版，地址为 2 Park Square, Milton Park, Abingdon, Oxon OX14 4RN；由\
    \ Routledge 出版，地址为 52 Vanderbilt Avenue, New York, NY 10017。`Routledge` 是 Taylor\
    \ & Francis 集团下的一个品牌© 2021 `Ruth Taplin`。`Ruth Taplin` 根据《1988 年版权、外观设计与专利法》第\
    \ 77 和第 78 条的规定，已主张其作为本作品作者的身份确认权。保留所有权利。未经出版者书面许可，本书的任何部分不得以任何形式或通过任何电子、机械或其他手段（无论是现在还是以后发明的，包括复印和录音）印刷、复制或在信息存储或检索系统中中使用。`商标通知`：产品或公司名称可能是商标或注册商标，仅用于识别和解释，并无侵权意图。`英国图书馆出版目录数据`：大英图书馆提供本书的目录记录。`美国国会图书馆出版目录数据`：已申请本书的目录记录\
    \ ISBN `978-1-138-32058-1` (hbk) ISBN `978-0-429-45319-9` (ebk) 由 Newgen UK 使用\
    \ Times New Roman 字体排版 UK\n\n# 目录\n\n前言 致谢 网络术语表 缩写表 1 引言 2 知识产权盗窃与网络战争 3 日本 4\
    \ 俄罗斯 5 中国 6 美国 7 智能电网 8 海洋部门 9 保险部门 10 结论 *索引*\n\n前言\n\n## 澳大利亚的网络安全——全球共同主题\n\
    \n"
- fmt: "\nAustralia, like all countries, is well and truly engaged in the opportunity\
    \ and challenge of cybersecurity. It is in the forefront of the minds of organisations,\
    \ individuals and governments in figuring out how to best deal with a cyber-attack.\
    \ Australia has sovereign capability and a mature approach to cybersecurity as\
    \ well as an innovative eco-system to support companies and governments dealing\
    \ with this new-age threat. In the case of the State of New South Wales there\
    \ are cyber competitive advantages that are world leading such as Fin-tech, Ag-tech\
    \ and a cyber skilled workforce. \n\n`New approaches and thinking` are needed\
    \ to address cybersecurity threats in a space where malicious actors are becoming\
    \ more sophisticated, are using advanced capabilities in technologies and are\
    \ global. Attacks are now using advanced artificial intelligence (AI), voice recognition,\
    \ social media, big data and connected devices such as mobile phones to breach\
    \ organisations and individuals. Strategic decision-making is required to allow\
    \ for more informed investment and resourcing in order to enhance preparedness\
    \ and resilience. Traditional ways to defend against cyber threats need to evolve\
    \ and be implemented at an increasingly fast rate to keep pace with the advanced\
    \ attacks that are occurring.\n\n`Cyber is an enabler not just a risk mitigation\
    \ strategy`. Traditionally, cybersecurity is seen as a risk mitigation tool used\
    \ by information technology (IT) teams to try to stop and/or quickly mitigate\
    \ a cyber breach. This view and approach is limiting the opportunities for an\
    \ organisation to use data more proactively and enable new technologies and paradigms\
    \ such as big data, AI, edge computing and automation. This is the opportunity\
    \ for businesses and agencies to use cyber as an enabler and create value rather\
    \ than as a cost centre. In terms of how cyber breaches happen still, upwards\
    \ of 70% of attacks occur because of human error such as opening a phishing e-mail.\
    \ Increasingly, the phishing attacks are not just on laptop devices but hand-held\
    \ devices too. Cyber is primarily a people problem not an IT problem! `Used well\
    \ cyber builds trust`. If people and businesses don’t trust you with their data\
    \ they are not going to buy your product and you don’t have a business. \n\nTo\
    \ build trust, you need to have a strong governance structure to support cyber\
    \ initiatives. To assist in addressing this and as a first step, board and C-suite\
    \ members as well as high-level policy-makers need to gain a better understanding\
    \ of the cyber risks to which their organisation, municipality or country are\
    \ exposed. This does not mean becoming full-on technical experts; technical expertise\
    \ rests with the information and communications technology (ICT) and information\
    \ security departments or contracted cybersecurity service providers. What urgently\
    \ needs to improve is the communication and translation of cybersecurity issues\
    \ between practitioners and leadership. Corporate leaders need to have a strong\
    \ grasp of their entity’s vulnerabilities and which critical assets are at risk.\
    \ This will allow them to take timely strategic decisions on investment and resourcing\
    \ to bolster their organisations’ resilience and safeguards; a holistic approach\
    \ needs to be used to be successful. This type of thinking may require organisational\
    \ restructures and governance in order to break down silos and enable a more robust\
    \ cybersecurity attitude. \n\nBeyond economic losses, the legal, reputational\
    \ and even physical consequences of a cyberattack can be huge. Leaders must create\
    \ greater cyber-savviness across organisational functions such as risk, compliance,\
    \ legal, human resources and communications, among others. A cybersecurity culture\
    \ needs to be instilled across the organisation, from the top floor through to\
    \ the shop floor. New thinking may include deploying AI for threat detection and\
    \ analysis as well as for incident response enabling more effective and efficient\
    \ cybersecurity. At the same time, cybercriminals are adopting new technologies\
    \ even faster and to their advantage. The developments in AI, quantum and identity\
    \ management, among others, call for ever-greater investment to stay ahead of\
    \ malicious actors. Needless to say, talent development also requires funding\
    \ to build a strong cybersecurity-aware workforce. `Eco-system development and\
    \ innovative partnerships` are essential for not only addressing cybersecurity\
    \ threats but in developing economic development outcomes. In a connected world\
    \ it is essential that value is retained locally and high value-added jobs are\
    \ being created and retained locally. In NSW (New South Wales) there is a strong\
    \ and evolving cyber eco-system that consists of industry (private companies,\
    \ small and medium-sized enterprises (SMEs) and non-governmental organisations\
    \ (NGOs)), research, training providers including schools, vocational education\
    \ and training, and government. `Key trends in cyber` that will affect success\
    \ and growth this year are discussed here.\n\n## AI will play an increasing role\
    \ in both cyber-attack and defence\n\nAI is the new way to get an edge over your\
    \ opponents, but in an interconnected world anyone can get involved. Previously,\
    \ governments could use this resource because of its expense, now everyone can\
    \ use it. This means that while AI is undoubtedly being researched and developed,\
    \ it’s also easily used by parties with malicious intent. So rather than between\
    \ countries, today’s race is between hackers, phishers and data thieves, and the\
    \ experts in cybersecurity whose job it is to tackle those threats before they\
    \ cause us harm. Just as AI can ‘learn’ to spot patterns of coincidence or behaviour\
    \ that can signal an attempted attack, it can learn to adapt in order to disguise\
    \ the same behaviour and trick its way past our defences. This added level of\
    \ complexity also forms a geo-political threat between many state actors such\
    \ as the US, Russia and China.\n\n## East and West lead to increased security\
    \ threats\n\nThe internet and the online world is an international entity – relatively\
    \ free of borders or restriction on the free movement of information and ideas.\
    \ It’s been built that way to leverage international cooperation and talent. In\
    \ reality, the corporations, networks and associations that provide the infrastructure\
    \ behind the scenes are legal entities obliged to comply with national laws and\
    \ regulations. \n\n## Political interference is increasingly common and increasingly\
    \ sophisticated\n\nTargeted disinformation campaigns aimed at swaying public opinion\
    \ have almost become an accepted feature of democracy today. So far, cybercrime\
    \ targeting elections has taken two forms. The first involves the spreading of\
    \ ‘fake news’ and false narratives – usually designed to slur a candidate – via\
    \ social media. The second is direct attacks against candidates’ or digital electoral\
    \ infrastructure. Countering the false narratives means building systems, either\
    \ automated or manual, that can sift out lies, propaganda and bad-faith by analysing\
    \ both content and metadata – where the information originates from, and who is\
    \ likely to have created it.\n\n## The cybersecurity skills gap continues to grow\n\
    \nDuring 2020, it is projected the number of unfilled cybersecurity jobs will\
    \ increase from just 1 million in 2014 to 3.5 million in Australia. This deficit\
    \ of skills is likely to become a growing matter of public concern during the\
    \ early part of this new decade. The threats we face in cyberspace today, from\
    \ thieves attempting to clone identities to carry out fraud, to political disinformation\
    \ campaigns designed to alter the course of democracies, will only become more\
    \ intense unless there are sufficient people with the skills to counter them coming\
    \ through the pipeline. In NSW this is an area where significant work has been\
    \ done creating a cyber talent accelerator that links areas of talent to business.\
    \ A pipeline from schools, vocational education and training through to higher\
    \ education has been created.\n"
