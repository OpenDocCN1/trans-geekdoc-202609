- fmt: "\nCyberattacks on ships are accelerating at an alarming rate as noted by cybersecurity\
    \ consultants Red Sky Alliance, which have in tandem with Dryad Global, maritime\
    \ security specialists, begun to publish weekly the names of ships that have been\
    \ appearing in malicious e-mails. Malware and phishing e-mails have been used\
    \ most widely by hackers. The most common subject headlines to entice those in\
    \ the shipping industry to open e-mail attachments and links are motor vessels\
    \ (MV) and motor tankers (MT). Vessels are being impersonated with such malicious\
    \ e-mails. Such spoofing cyberattacks are targeted at various levels of supply-chain\
    \ companies.\n\nIn the week of 25 February, for example, malicious e-mails trying\
    \ to insert Trojan malware named `Wacatac` into unsuspecting supply-chain computer\
    \ systems also contained a `D` variant for the first time. Hackers are developing\
    \ new hacking tools each day and in February 2020 started using `Maersk` again\
    \ for spoofing purposes as `Maersk` was the victim of a notorious cyberattack\
    \ in 2017. \n\nIn 2017, the Russian military intelligence (`GRU`) launched an\
    \ unprecedented cyberattack on companies worldwide with `Maersk` and `Federal\
    \ Express` experiencing billions of US dollars in damage. This was the infamous\
    \ `NotPetya` cyberattack that was carried out to inflict maximum damage on Ukraine\
    \ but also subjected the shipping operations of `Maersk` and `Federal Express`\
    \ to extensive damage. It could be seen as part of the Russian attempt to use\
    \ hybrid warfare, which combines actual conventional attacks on physical infrastructure\
    \ with cyberwarfare tactics disabling critical infrastructure such as ports, shipping\
    \ terminals and related IoT computer systems. This attack was also linked to a\
    \ cyberattack on Georgia that shut down websites and television broadcasting.\
    \ Britain, Australia and other European nations all concurred with the US State\
    \ Department that these cyberattacks were carried out by Russia’s Main Centre\
    \ for Technology, a part of the `GRU` military intelligence.\n\nIn 2018, a number\
    \ of ports around the world experienced a variety of cyberattacks. The port of\
    \ San Diego during this time period was subject to a ransomware attack that demanded\
    \ `Bitcoin` be paid to re-open computer systems. The attack caused limited functionality\
    \ to a variety of services such as access to public record requests and business\
    \ services. The port of Barcelona also suffered a cyberattack and `Cosco` shipping\
    \ was victim to a severe cyberattack linked to the port of Long Beach in California.\
    \ Dr Giovanni Vigna of the University of California, Santa Barbara’s Centre for\
    \ Cybersecurity noted that shipping ports handle sensitive information that attracts\
    \ financial fraud and spear-phishing cyberattacks. As such personnel-, financial-\
    \ and military-related data becomes increasingly digitised, the greater the cyber\
    \ risk. Dr Vigna suggested that shippers need to become more aware of the cyber\
    \ threat and invest more in protection.\n\n## Cyberattacks in the Asia-Pacific\n\
    \nAs nine out of ten of the busiest container ports are based in the Asia-Pacific\
    \ region, the region is subject to increased cyberattack. If a sustained cyberattack\
    \ virus infected 15 of the major ports in Japan, China, South Korea and so forth,\
    \ a study commissioned by Lloyd’s notes that it could lead to US$ 110 billion\
    \ in losses. At current rates of insurance coverage that would leave roughly US$\
    \ 101 billion uninsured. The report produced by the University of Cambridge Centre\
    \ for Risk Studies under Cyber Risk Management projected that 92% of the global\
    \ economy would not only be unprepared but also uninsured for losses. Angela Kelly,\
    \ the Country Manager for Singapore at Lloyd’s, noted that cyber risk is one of\
    \ the most complex and critical risks facing the maritime industry today. \n\n\
    As the implementation of new technology and automation progresses, risk managers\
    \ and insurers need to work together to plan insurance solutions. The report notes\
    \ further that such a projected large-scale attack outlined in the report would\
    \ not only cause severe disruption to the ports and economy in the Asia-Pacific\
    \ region but would also impact the global economy because of interconnectivity\
    \ and global supply chains. The research report estimates that losses in productivity\
    \ would affect every country that has bilateral trade with the ports that experienced\
    \ the cyberattack. Estimated losses would be up to US$ 27 billion in indirect\
    \ economic losses in Asia, in Europe US$ 623 million and US$ 266 million in North\
    \ America. Claims on insurance would emanate from 50% of port operators, 21% of\
    \ insured losses along the supply chain and 16% of insured losses from logistics\
    \ and cargo-handling companies.\n\n## Understanding cyber risks\n"
