    Without thinking through the governance implications, cybersecurity measures will
    never be implemented. Creating uniform standards for cyber-risk insurance is one
    way. The other is to have an overarching regulatory framework that operates in
    the interest of businesses with good corporate governance and that is an independent
    regulatory commission in its own right.


    The wisdom of this regulatory policy when dealing with cyber risk, which impacts
    insurance policies and premiums, is shown in the US `SEC` (Security Exchange Commission),
    which is an independent agency of the federal government. It is primarily responsible
    for enforcing the federal securities laws and regulating the securities industry
    including the electronics securities markets in the US. Cybersecurity guidance
    released on 12 March 2018 made it clear that public companies must have effective
    and apposite disclosure controls. Procedures must be in place that accurately
    record cybersecurity events in a timely manner. The guidance also encourages companies
    to consider how their policies, procedures and controls prevent trading on the
    basis of non-public information (insider trading) related to cybersecurity risks
    and incidents. Although the guidance does not introduce novel concepts and expectations,
    it encourages companies to both assess and tighten their existing disclosure policies,
    controls and procedures to ensure that they effectively address cyber-related
    matters.


    The `SEC` has been known for its very stringent regulation and fines for those
    breaching its financial security market rules so such guidance should encourage
    companies to revise their cyber risk measures where appropriate. A further example
    whereby the `SEC` is providing guidelines and is encouraging US securities companies
    to assess and deal with cyber risk is through their reports. The `SEC` issued
    a `Report of Investigation` on 16 October 2018 to highlight the cyber threat of
    spoofed or manipulated electronic communications. It urged reporting companies
    to tighten and adjust their internal accounting controls in accordance with the
    current risk environment. The `SEC` investigated nine listed companies at this
    time in a range of different industries that were targets of fraudulent e-mails
    from fake executives or vendors. The investigation concerned determining whether
    the companies violated federal securities laws by failing to maintain adequate
    internal controls. Each company was cyber defrauded of at least US$ 1 million
    and two of over US$ 30 million. Federal securities laws demand that public companies
    maintain internal accounting systems that ensure all transactions are authorised
    and scrutinised with management’s general or specific authorisation. While the
    companies that were targeted by hackers had procedures in place and updated vendor
    data, there existed weaknesses in policies, procedures and management of human
    vulnerabilities that were exploited by hackers rendering any safeguards ineffective.
    In this case, the `SEC` did not take action against these companies as they attempted
    after these cyberattacks to improve authorisation procedures and verification
    requirements for vendor information change. The companies also bolstered account
    reconciliation procedures and outgoing payment notification. Finally, they provided
    staff with training concerning relevant threats in addition to policies and procedures
    to mitigate such cyber threats. The `SEC` in this case emphasised to these companies
    the necessity of having internal control systems that factor in both cyber-related
    threats and human error.


    ## Insurance company digitalisation


    Insurance companies which are part of the city of London market have been relatively
    slow to incorporate digitalisation processes that are required both for the digital
    age and to deal with cyber risk, threat and cyberattack. `Lloyd’s of London`,
    the oldest and largest syndicate insurance companies in the city of London, which
    has its roots in a coffee house opened by Edward Lloyd in 1686 where shipping
    merchants exchanged shipping intelligence, carried out a digitalisation drive.


    `DBRS Morningstar` released commentary on this procedure and contrasted it with
    the Association of Bermuda Insurers and Reinsurers. The commentary pointed to
    a number of policy measures by `Lloyd’s` to re-organise its business into a digital
    one. One such policy measure concerns `Lloyd’s` laying the groundwork from plans
    set out in May 2019, which should show results in the first quarter of 2020. It
    was a six-month thinking through the transition process that aimed to both strengthen
    and expedite insurance risk protection services to clients while increasing the
    ease of doing business through digitalisation and reducing costs. It is an attempt
    to bring `Lloyd’s` into the digital age allowing it to compete with other large
    insurance markets that have lower expenses.


    `DBRS Morningstar` has noted that `Lloyd’s` is making progress in its strategy
    to digitalise, innovate and expedite needed changes that will be clarified after
    the first quarter of 2020. These changes to progress digitalisation are necessary
    to improve efficiency in the insurance underwriting business while increasing
    competitiveness in the lower cost insurance market. `Lloyd’s` has through these
    measures been closing down underperforming syndicates and raising prices.


    `Lloyd’s of London` has had a few problems related to its website, which was not
    updated. The `PRA` had `Lloyd’s` placed on special measures in December 2019,
    as it emerged that a whistleblowing hotline for staff to report misconduct and
    fraud anonymously had been unusable for 16 months. Additionally, the e-mail and
    telephone numbers on its websites for members to submit complaints about agents
    were left unattended for weeks as the contact details were out of date.


    In the author of this book’s estimation, such re-organisation of large, cumbersome,
    paper-based insurance companies is sorely needed to ensure that they can provide
    cyber-risk insurance of a high standard that is relevant to the current situation
    of increasing cyberattacks that include IP theft and cyberwarfare. Without digitising
    their own company, they cannot underwrite adequately cyber risk and institute
    their own cyber threat countermeasures that will prevent their own organisations
    from becoming victims of cyberattack and losses. `Lloyd’s` digitisation process
    has been reaping results on the back of their 2018 annual report, which showed
    that they underwrite roughly a third of the global cyber-risk market share, which
    mainly derives from the US market.


    ## Cyberwarfare insurance


    Cyberwarfare, as mentioned in previous chapters of this book, is in ascendancy
    using cyberattack for both physical targets and non-physical ones. Targets include
    power grids, shipping and military installations and personnel. This is such a
    new cyber risk that insurance companies have only begun to think about the risks
    that need protecting and the values inherent in underwriting such cyber losses.
    Many experts in the insurance industry note that more consensus and consistency
    are necessary before the insurance industry can arrive at workable solutions.


    ## Cyber risk – the top peril for insurance

