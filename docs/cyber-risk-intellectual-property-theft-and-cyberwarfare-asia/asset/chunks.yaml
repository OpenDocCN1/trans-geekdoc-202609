    如上所述，专家的任务是提高关键基础设施运营者高层管理者的意识，并促进其理解。根据每家公司的业务政策制定网络安全措施，培养出能够连接公司内部关键基础设施保护相关部门的桥梁，并在领导执行级官员的同时进行全面调整的人才。由于
    `OT` 管理部门和法律事务等其他相关部门的情况不断发生变化，人力资源经理负责升级网络安全措施。`IT` 管理部门仅是众多部门中的一个，因为在涉及网络安全对策措施时，重点需要放在组织一个跨越所有部门和领域的结构上。在工业、学术界和政府的合作中，有必要明确所需安全专家的定义，同时促进如演习、培训和获得资格等具体的人才培养措施。此外，针对所有相关的利益相关者，还创建了针对关键基础设施的网络攻击威胁感知严重程度，分为
    1 到 5 级。这包括：

    - `Level 5 紧急`：针对大规模且迫在眉睫的威胁。

    - `Level 4 严重`：具有重大影响。

    - `Level 3 高级`：具有可见的影响。

    - `Level 2 中等`：可能可能是关键的。

    - `Level 1 低级`：不太影响关键基础设施。


    ## ICT 的未来与日本的网络安全


    近年来，网络攻击的数量（包括疑似的尝试）在不断上升，新恶意软件的数量逐年增加。新威胁的出现源于新技术，特别是如 `AI`、`IoT` 和 `5G` 通信系统。如上所述，供应链公司（通常是
    `SMEs`）是网络攻击的特别关注点，正如本文开头所示，`IP 盗窃` 是最频繁的 target。这种情况正发生在大规模网络攻击的背景下，黑客利用新技术通过更复杂、更大规模的攻击来从中获利。传输到名为
    `Nicter` 的 `NICT` 监控系统的可疑数据包有所增加，这表明它们已被恶意软件感染；遭受 `DoS` 网络攻击的服务器也有所增加。


    `Symantec` 的预测是，网络攻击者将利用 `AI` 的帮助来渗透 `AI` 系统。这种情况在防御系统和网络战方面尤其如此，因为这些领域将更多地依赖
    `AI` 来识别漏洞并执行对策措施。由于 `5G` 新一代电信带宽的引入，攻击领域将扩大，并由于中国电信公司 `Huawei` 的加入而变得复杂；`US`
    禁止了该公司，而欧洲允许其开发 `5G` 但持谨慎态度，因为担心中国政府访问 `IP`、国防数据以及许多其他敏感数据库。这在本书的 `第 1 章` 中讨论过，将在
    `第 5 章` 关于中国的章节中扩展。


    `Symantec` 以及许多其他熟悉 `IoT` 的人士还预测，随着 `IoT` 基础设施的扩张（特别是在大型企业与其供应商之间），将出现一种比 `DoS`
    更新、更危险的攻击。如上所述，这已经导致了针对供应链的网络攻击在质和量上的增加。`McAfee` 反则预测，未来预防性技术将进一步利用 `AI`，而下一个目标将是使用语音识别功能的
    `IoT` 设备。`Trend Micro` 也预测未来将出现使用 `AI` 的高度精细的针对性攻击，以及黑客之间针对 `IoT` 攻击的竞争将加剧。


    ## 全球及日本网络安全市场的趋势与展望


    随着日益增长的网络威胁，对网络安全产品和服务的需求日益增加。`2018 年`，网络安全市场价值达到 `1530 亿美元`，预计到 `2022 年`将达到 `2300
    亿美元`。然而，日本产品的市场份额较小，落后于 `US` 和欧洲。外国公司也正在进入日本市场，挑战日本商品服务的市场份额。这一趋势从从全球背景下日本 `ICT`
    产品市场的现状中看到：

    - 基站：`29%` `Ericsson`（瑞典）、`26%` `Huawei`（中国）、`23.4%` `Nokia`（芬兰）、`11.7%` `ZTE`（中国）、`5%`
    `Samsung`（韩国）

    - 路由器（2018 年第三季度市场份额）：`60%` `US`、`27%` 欧洲、`6.8%` 中国、`4.6%` 日本以及其他 `1.2%`

    - 服务器产品（2018 年第四季度市场份额）：`68.7%` `US`、`26.3%` 中国、`5%` 日本

    - 智能手机：中国产品 `57.4%`、`20.8%` `US`、`18.8%` 韩国、`1.2%` 日本以及其他 `1.8%`


    ## 外国公司与日本公司的研发对比


    - 榜单前名的公司包括全球性公司 `Amazon` 和 `Alphabet`，它们将利润的 `10%` 以上用于研发。中国公司也遵循这一趋势。

    - 日本公司的占比低于 `10%`，医疗保健除外。


    ## 全球研发排名


    全球研发排名显示 `Amazon`、`Alphabet`、`VW`、`Samsung`、`Intel`、`Microsoft`、`Apple`、`Roche`、`Johnson
    and Johnson` 和 `Merck` 为前十，日本公司 `Toyota` 排名第十一。


    ## 日本研发排名


    日本研发投入金额排名前十的公司依次为 `Toyota`、`Honda`、`Nissan`、`Sony`、`Panasonic`、`Denso`、`Hitachi`、`Takeda`、`Canon`
    和 `Toshiba`。前三是汽车制造企业。


    ## 初创企业环境与日本的情况


    '
- fmt: '

    New companies that develop advanced technologies to tackle cyberattacks have been
    set up but most are based in the US and Israel. Japanese companies have failed
    to be ranked in the cybersecurity sector leaving them vulnerable to both cyberattack
    and economically. Abenomics, which began in 2013 with a three-pronged strategy
    that included monetary and fiscal stimulus in addition to structural reforms,
    has failed to produce results needed for innovation and growth in the Japanese
    economy. A new package of fiscal stimuli amounting in real terms to £182 billion
    (Yen 13.2 trillion) was introduced by Prime Minister Abe in December 2019 to counter
    a low expansion rate of 0.2% in the third quarter of 2019 and a collapse in retail
    sales as consumers reacted adversely to a new consumption tax. The history of
    consumption taxes in Japan is that they depress severely consumer confidence with
    retail sales falling significantly. There is also concern that without substantive
    investment in innovation, temporary growth from the Tokyo Olympics in 2021 will
    fall again after the event is finished.


    However, there are some start-ups specialising in cybersecurity in Japan through
    a venture/start-up support system that was initiated during Prime Minister Koizumi’s
    administration initiatives. If Koizumi’s son runs for Prime Minister and wins
    the next election there is a good chance that start-up initiatives will be re-started.
    In the last 20 years one of Japan’s most innovative projects, a biotech start-up
    in Tsuruoka, Yamagata Prefecture is now an innovation high-tech cluster, which
    has also prevented the town of Tsuruoka from disappearing because of little or
    no employment prospects for younger people who moved to Tokyo. It all began when
    Professor Masuru Tomita from Keio University was asked to start a science laboratory
    in the feudal, agricultural town of Tsuruoka. Opposition from the local population
    was fierce as their taxpayer money was to be spent supporting this research initiative.
    The Mayor Yoichi Tomizuka was very visionary and courageous as he insisted this
    project should proceed. It now is home to several world-class innovative enterprises
    including Spiber Ltd, which has through R&D created synthetic spider silk. A report
    published in March 2019 stated that the Science Park has generated Yen 3 billion
    per annum and created over 500 new jobs. All Professor Tomita’s colleagues had
    predicted that the new Science Park project would collapse because it was not
    based in Tokyo but, to the contrary, he notes it has flourished because of the
    tranquility, fresh air and good food. Also as an incentive for the local community,
    a new hotel complex and indoor children’s playground was built. As the old Japanese
    proverb states, ‘the ship turns around slowly!’


    Evidence that Japan is lagging behind is that there are only three Japanese companies
    among the top 500 cybersecurity companies. Even among the most growth-friendly
    cities globally for ICT/cybersecurity start-ups, Japanese cities are not included
    in the list (top 12) of New York, Boston, Silicon Valley, Phoenix, Toronto-Waterloo,
    Ottawa, Hague, Frankfurt, Berlin, Prague, Tel Aviv and Be’er Sheva. A start-up
    initiative in Japan is `J-Startup`, a programme designed to support start-ups,
    aiming to make them become competitive globally with innovative technologies and
    business models.


    ## Potential threat from 5G


    Given the demand for `5G`, increased capacity and multiple connections will lead
    to vulnerability. With the advent of `5G`, the introduction of flexible infrastructure
    and automation will result in security assessment.


    ## Trends in standardisation and countermeasures


    With the advent of `5G`, the introduction of technology and automation will result
    in security assessment. It is predicted that `5G` will lead to a detected event.


    ## Cybersecurity R&D in USA, UK, Israel and Singapore


    In a comparison, the USA, UK, Israel and Singapore were found to have more advanced
    R&D than Japan. In the USA, the `2016 Cybersecurity Research and Development Strategic
    Plan` defines the four categories `Deter`, `Protect`, `Detect` and `Adapt` and
    gives short-, medium- and long-term R&D approaches to each. Every year, an implementation
    plan is formulated. Industry, the government and academia collaborate to promote
    R&D in the National Institute of Standards and Technology (`NIST`), the National
    Science Foundation (`NSF`), the `NSA`, the Defense Research Projects Agency (`DARPA`),
    the `DHS` and the Department of Defense (`DoD`). The 2019 budget was US$740 million.


    In the UK `National Cyber Security Strategy 2016–2021` has (1) `Defend`, (2) `Deter`
    and (3) `Development`, the last of which references R&D. It has identified the
    important areas of `IoT`, the smart city, data and information protection, automation,
    machine learning and AI in its `cyber security science and technology`. Under
    the framework of Academic Centre of Excellence (`ACE`) and the initiative of the
    government, universities that have passed the approval criteria are leading the
    promotion of R&D.


    The `Israel Cyber Security Strategy` has (1) `Robustness`, (2) `Resilience` and
    (3) `Defence`. R&D is positioned as part of capacity development to enable these
    aims. The Israeli government has established a cybersecurity research centre that
    focuses on various areas of policy and technology at Ben-Gurion University and
    Tel Aviv University.


    There are four pillars in Singapore that support cybersecurity R&D: (1) flexible
    infrastructure development, (2) maintenance of safer cyberspace, (3) development
    of an active ecosystem and (4) strengthening international partnership. R&D is
    positioned in point 3. The Singaporean government formulated an implementation
    plan until 2020 in its `National Cybersecurity R&D Programme`.

