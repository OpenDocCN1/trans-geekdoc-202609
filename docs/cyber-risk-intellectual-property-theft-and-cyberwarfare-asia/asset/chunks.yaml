- fmt: '

    The use of bots has accelerated in the US to try an influence peoples’ opinions
    on particular matters and can be used to influence elections or other geo-political
    issues that can be targeted in cyberwarfare. Climate change has been one of the
    areas targeted in the US since President Trump in 2017 removed the US from the
    Paris Climate Accord (this has been reversed in February 2020 perhaps with pressure
    from European states who used the adoption of Chinese Huawei 5G technology as
    a bargaining chip). Bots are computer programmes that masquerade as human beings
    and send messages on social media. According to a study by researchers at Brown
    University in the US, 25% of 6.5 million tweets during the removal of the US from
    the Paris Climate Accord were from bots. The high number of bot-generated tweets
    concerned denial of climate change and were devoid of any scientific proof. The
    bots were utilised to give the impression and amplify the message that climate
    change evidence should be rejected and denied. Although Brown University researchers
    could not identify who were the manipulators behind the bots, by using a `botometer`
    they could determine which tweets were human or bot generated. They found further
    that bots generated 38% of those that rejected scientific findings surrounding
    climate change, while 28% of tweets concerning Exxon oil company were posted by
    bots. Only 5% of tweets supporting action on climate change were generated by
    bots. With a quarter of potentially belief-influencing tweets deriving from bots
    on an issue such as climate change, it is not inconceivable that these bots can
    be used to influence not only elections but also sentiments concerning going to
    war or persecuting a particular group of people.


    ## Cyber torture


    It is not a great leap from psychological based information and mental coercion
    to another unfortunate facet of war – torture. The possibilities for cyber torture
    are not to be underestimated as shown in a documentary entitled ‘Eminent monsters:
    a manual for modern torture’, by Bafta-winning film maker Stephen Bennett. The
    documentary follows the CIA-funded techniques in the 1950s that developed psychological
    torture that were further developed by the Scottish born psychiatrist Dr Ewen
    Cameron. The film shows how patients at a research institution run by Dr Cameron
    in Canada were subject to LSD injections, forced comas and extreme mental and
    physical torture. These practices on patients are no longer allowed in Canada.
    Nils Melzer, Professor of Law at the University of Glasgow, is the Swiss UN special
    rapporteur on torture and other cruel or inhuman or degrading treatment. He has
    argued that cyber torture through psychological methods could be readily exploited
    by states that understand physical torture is banned under the UN and other international
    law-enforcement bodies. He believes the internet can be used remotely to psychologically
    torture individuals through surveillance, intimidation, harassment, isolation,
    public shaming and defamation. In February 2020 Professor Melzer presented a report
    to the UN in Geneva underlining his concerns that cyber technology psychological
    torture is somehow regarded not as severe or real as physical torture and his
    worries that cyber torture could be legitimised by states. He further argues that
    just because psychological torture does not leave physical marks it can lead to
    social isolation, severe depression and suicidal tendencies. There seems to be
    a good deal of merit in Professor Melzer’s observations as seen by the litany
    of cases in which all social media can be used to bully, intimidate and isolate
    causing depression and suicide. Trolling, bombardment with abusive messages, often
    pushes the vulnerable over the edge. Such online abuse is especially worrying
    when the President of the United States, Mr Trump continually ridicules his opponents
    by calling them demeaning, humiliating names and is relentless in his abuse of
    targeted, perceived enemies tweeted online. It is fortunate given the possibilities
    of cyber torture being legitimised that the majority of American senior officials
    from the Pentagon to those in charge of foreign policy refrain from issuing humiliating
    and abusive tweets or in other social media forms. IP theft will continue unabated
    as long as other countries or state-backed companies have a paucity of creative
    ideas and rely on stealing them rather than inventing new technology that can
    be utilised to good effect. Cyberwarfare will also evolve given the no return
    prospects of nuclear technology and will be guided by geo-political imperatives.
    Yet, understanding and subverting cyberattacks that imperil creative IP and those
    that further the most destructive forms of cyberwarfare is of paramount importance
    to the world of digitisation in which information is the new gold standard commodity.
    In subsequent chapters, we analyse how increases in cyberattack affect major industries
    and pillars of economic infrastructure and what countermeasures can be taken to
    undermine such cyberattacks. To this end we look at electric power grids, the
    shipping and insurance sectors.


    ### Notes

    [1] ‘Data breach hits agency overseeing White House communications’, Zoe Thomas,
    Technology Reporter, *BBC News Online* (20 February 2020).

    [2] ‘North Korea defector hack: personal data of almost 1,000 leaked’, *BBC News
    Online* (28 December 2018).

    [3] ‘North Korea skirted UN sanctions and earned US$ 2 billion using cyberattacks.
    A new UN report says’, Pamela Falk, *CBS News Online* (6 August 2019).

    [4] ‘Chinese nationals charged with iTunes money laundering’, *BBC News Online*
    (3 March 2020).

    [5] See Ruth Taplin, *Innovation, Investment and Intellectual Property in South
    Korea: Park to Park*, Abingdon: Routledge, 2018.

    [6] ‘Ransomware attacks grow, crippling cities and businesses’, Nathaniel Popper,
    *New York Times* (9 February 2020).

    [7] ‘Iranian hackers targeted presidential campaign says’, Nicole Perlroth, *New
    York Times* (4 October 2019).

    [8] Ibid.

    [9] ‘The urgent search for a cyber silver bullet against Iran’, David E. Sanger
    and Julian E. Barnes, *New York Times* (23 September 2019).

    [10] ‘Israeli soldiers duped by Hamas “fake women” phone ruse’, *BBC News Online*
    (17 February 2020).

    [11] ‘“Dark web” hackers could target gas pumps’, Sarah Min, *Money Watch* (13
    September 2019), updated.

    [12] ‘Study finds quarter of climate change tweets from bots’, *BBC Online* (22
    February 2020).

    [13] ‘UN warns of rise of “cybertorture” to bypass physical ban’, Owen Bowcott,
    Legal Affairs Correspondent, *Guardian* (21 February 2020).

