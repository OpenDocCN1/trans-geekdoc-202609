  raw: "Without thinking through the governance implications, cybersecurity measures\
    \ will never be implemented. Creating uniform standards for cyber-risk insurance\
    \ is one way. The other is to have an overarching regulatory framework that operates\
    \ in the interest of businesses with good corporate governance and that is an\
    \ independent regulatory commission in its own right. The wisdom of this regulatory\
    \ policy when dealing with cyber risk, which impacts insurance policies and premiums,\
    \ is shown in the US SEC (Security Exchange Commission), which is an independent\
    \ agency of the federal government. It is primarily responsible for enforcing\
    \ the federal securities laws and regulating the securities industry including\
    \ the electronics securities markets in the US. Cybersecurity guidance released\
    \ on 12 March 2018 made it clear that public companies must have effective and\
    \ apposite disclosure controls. Procedures must be in place that accurately record\
    \ cybersecurity events in a timely manner. The guidance also encourages companies\
    \ to consider how their policies, procedures and controls prevent trading on the\
    \ basis of non-public information (insider trading) related to cybersecurity risks\
    \ and incidents. Although the guidance does not introduce novel concepts and expectations,\
    \ it encourages companies to both assess and tighten their existing disclosure\
    \ policies, controls and procedures to ensure that they effectively address cyber-related\
    \ matters.[^(10)](#ch18.xhtml#en151) The SEC has been known for its very stringent\
    \ regulation and fines for those breaching its financial security market rules\
    \ so such guidance should encourage companies to revise their cyber risk measures\
    \ where appropriate. A further example whereby the SEC is providing guidelines\
    \ and is encouraging US securities companies to assess and deal with cyber risk\
    \ is through their reports. The SEC issued a Report of Investigation on 16 October\
    \ 2018 to highlight the cyber threat of spoofed or manipulated electronic communications.\
    \ It urged reporting companies to tighten and adjust their internal accounting\
    \ controls in accordance with the current risk environment. The SEC investigated\
    \ nine listed companies at this time in a range of different industries that were\
    \ targets of fraudulent e-mails from fake executives or vendors. The investigation\
    \ concerned determining whether the companies violated federal securities laws\
    \ by failing to maintain adequate internal controls. Each company was cyber defrauded\
    \ of at least US$ 1 million and two of over US$ 30 million. Federal securities\
    \ laws demand that public companies maintain internal accounting systems that\
    \ ensure all transactions are authorised and scrutinised with management’s general\
    \ or specific authorisation. While the companies that were targeted by hackers\
    \ had procedures in place and updated vendor data, there existed weaknesses in\
    \ policies, procedures and management of human vulnerabilities that were exploited\
    \ by hackers rendering any safeguards ineffective. In this case, the SEC did not\
    \ take action against these companies as they attempted after these cyberattacks\
    \ to improve authorisation procedures and verification requirements for vendor\
    \ information change. The companies also bolstered account reconciliation procedures\
    \ and outgoing payment notification. Finally, they provided staff with training\
    \ concerning relevant threats in addition to policies and procedures to mitigate\
    \ such cyber threats. The SEC in this case emphasised to these companies the necessity\
    \ of having internal control systems that factor in both cyber-related threats\
    \ and human error.[^(11)](#ch18.xhtml#en152) \n\n## Insurance company digitalisation\n\
