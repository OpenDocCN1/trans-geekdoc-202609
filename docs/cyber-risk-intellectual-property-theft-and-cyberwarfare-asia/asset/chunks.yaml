  trans: "\n\nNISC 将负责 CSC（网络安全委员会）的行政办公室工作，并计划将部分行政任务委托给 JPCERT/CC（日本计算机应急响应小组/协调中心）。为了实现实时信息共享，委员会将通过系统而非实体会议进行协调。（这适用于全体会议和运营委员会。）JPCERT/CC（一个提供早期预警信息的系统）目前正在开发\
    \ CISTA（受信倡导者的集体智能代理程序），该系统通过收集广泛的信息，然后发送早期阶段预警通知。委员会的系统将基于 CISTA，但添加了必要的功能，例如用于成员间进行实时信息共享的门户网站。为了减轻成员的负担，CSC\
    \ 将加强与现有各种信息共享系统的合作。委员会对信息的接纳将作为成员已参与的任何类型框架的一部分来处理。然而，如果成员要求直接向委员会提交信息（且委员会将适用严格的保密规定），则此类事项在未来将直接处理。\n\
    \n## CSC 的结构\n\nCSC 的网络安全信息结构和目标可见表 3.1、表 3.2 和表 3.3。\n\n### 表 3.1 信息共享结构\n\n\
    | *供应商的关注点与不确定性* | | | *通过运营规则（条款与条件）采取的措施* |\n| --- | --- | --- | --- |\n| 希望仅自愿向信任的对象披露信息内容并进行咨询\
    \ | | → | 提供信息的人可以设定信息共享范围的限制。未经同意，此类限制不会更改 |\n| 自愿性咨询可能导致受到相关部门的处罚 | | → | 提供信息的人可以将相关部门排除在信息共享接收者之外\
    \ |\n| 由于可能存在提供信息的义务，请求的信息可能比预期的多 | | → | 此类义务的触发因素将明确定义并限制在“大规模网络攻击”等方面 |\n|\
    \ 条款的修改可能导致所有信息都受到请求的情况 | | → | 条款的修改需要在全体会议（包括私营部门在内的所有成员）上通过投票通过 |\n| 退出委员会可能可能困难\
    \ | | → | 成员可以随时提交信函终止身份 |\n\n### 表 3.2 委员会在信息共享中的角色\n\n| *专业机构和供应商面临的问题* | |\
    \ | *委员会解决问题采取的方向* |\n| --- | --- | --- | --- |\n| 很难向公司外披露尚未证实的分析内容等信息 | | →\
    \ | 通过充分利用委员会的益处（例如保密义务，违反将面临罚款或费用），将在委员会内建立一个工作小组（TF）。该特殊工作小组将仅容纳少数之间具有高度信任关系且可以相互共享信息（包括未经证实的分析内容）的志愿者成员\
    \ |\n| 因为信息具有价值，让他们持续输出信息是不公平的 | | → | 工作小组将防止“搭便车”行为，信息共享将基于“互有交换” |\n| 提供了有价值的信息，因此需要给予适当反馈\
    \ | | → | 工作小组将确保有一套系统对所提供的信息进行提供反馈 |\n\n### 表 3.3 信息共享组织架构\n\n| *第 1 类组成员（政府条例规定的法人实体，如安全专家和供应商）*\
    \ | | | *第 2 类组成员，普通成员（国家、地方行政机关、主要基础设施、教育机构、私营部门）——是否参与委员会取决于各实体的意愿* |\n| ---\
    \ | --- | --- | --- |\n| ① 主要组成员将在内部共享，并对在强保密义务下的内部尚未证实的分析内容交换反馈，以便快速提高分析准确性，并让其他成员获得有关应对措施的信息。\
    \ | | ① 提供包括应对措施的信息（高准确度）→ → ② 提供包括应对措施的信息（低准确度）→ ← ② 反馈 ← ← ③ 内部咨询 ← → ③ 内部建议\
    \ → | ① 第 2 类和普通成员将收到委员会提供的高准确度信息，并将其用于自身组织的应对措施。② 此外，第 2 类成员能够收到更早提供的包括应对措施的信息（此阶段不保证准确性，且适用保密义务）。他们将发送反馈。\
    \ |\n| 例如：高度专业的分析 •攻击中使用的漏洞标识符 •恶意软件行为 | 例如：应对措施 •某些制造商的特定修复/补丁 •不使用 PC ② 第 1\
    \ 类成员仅向第 2 类成员在内部提供具有强保密义务的尚未证实的应对措施信息。根据其反馈，这些第 1 类成员将快速提高分析准确性。③ 第 1 类成员将通过与受影响公司的处理来了解社会正在发生的情况。\
    \ | | ③ 第 2 类成员和普通成员可以在强保密义务下与第 1 类成员进行内部咨询（自愿）。※即使是直觉认为的事情也可以请求咨询。※任何国家或地方行政机关、主要基础设施、教育机构和私营部门，符合标准并申请后即可成为第\
    \ 2 类成员。如果第 2 类成员未能履行其义务，将失去成员身份。 |\n| ※ 除专业机构或供应商外的任何符合标准并申请的实体均可成为第 1 类成员。如果第\
    \ 1 类成员未能履行其义务，将失去成员身份。 | | |\n\n来源：所有表格汇自以下：[www.jpcert.or.jp/english/](https://www.jpcert.or.jp/english/),\
    \ [www.nisc.go.jp/active/infra/outline.html](https://www.nisc.go.jp/active/infra/outline.html),\
    \ [www.ipa.go.jp/files/000032417.pdf](https://www.ipa.go.jp/files/000032417.pdf),\
    \ [www.jc3.or.jp/media/pdf/press releaseEnglish.pdf](https://www.jc3.or.jp/media/pdf/press\
    \ releaseEnglish.pdf), [www.enisa.europa.eu](https://www.enisa.europa.eu), [www.fsisac.com](https://www.fsisac.com)\
    \ 和 [www.eisac.com](https://www.eisac.com) \n\n"
- fmt: "\nThe Japanese government action plan to deal with cybersecurity consists\
    \ of two parts (one is an annual report for 2018 as part 1 and a new action plan\
    \ for 2019 as part 2), and mainly deals with the situation of cybersecurity in\
    \ Japan in 2018 and the status of policy implementation. The first part contains\
    \ three major topics such as formulation of a new strategy (27 July 2018), amendments\
    \ of a group of criteria for information security in governmental organs (25 July\
    \ 2018) and approaches to information sharing and cooperation that go beyond the\
    \ existing framework (5 December 2018). The second part focuses on approaches\
    \ according to policies as well as concrete measures in accordance with the new\
    \ strategy. An understanding of these strategies is vital to knowing how Japan\
    \ perceives cyber threat attack and how to implement preventive measures that\
    \ deal with the risk of IP theft and aspects of cyberwarfare. \n\n## Measures\
    \ for merging cyberspace and physical space\n\nIn July 2018, the government formulated\
    \ a new strategy that aimed to achieve a ‘cybersecurity eco system’, in which\
    \ not only the government, critical infrastructure vendors and private sectors\
    \ but also individual citizens and organisations that use their services are expected\
    \ to engage in autonomous approaches to cybersecurity. Since 2000, the government\
    \ and critical infrastructure vendors have been working on various initiatives\
    \ to enhance and maintain the vitality of economic society. Companies with significant\
    \ influence on society are considered as key players in implementing cybersecurity\
    \ measures. \n\n## Changing cyberspace and increased seriousness of threats\n\n\
    The new cybersecurity strategy demonstrates the nation’s aim and policies of various\
    \ measures over the next three years including the Tokyo Olympics, which have\
    \ been provisionally postponed to 2021. Continuous development of cyberspace can\
    \ only be achieved through improved cybersecurity that operates at all levels\
    \ of society. This includes digital transformation with cybersecurity, threats\
    \ and their impact in cyberspace such as through operation and service disruption,\
    \ information leaks, phishing and fraud as well as ransomware. International events\
    \ such as the G20 and the Tokyo Olympic Games are vulnerable to cyberattack as\
    \ they are extraordinary events that draw media attention and have maximum impact\
    \ in the case of a cyberwarfare attack, for example. AI is also taken into account\
    \ and there are four categories in AI-related topics such as attacks using AI,\
    \ autonomous attacks by AI, attacks on AI and security measures using AI. As AI\
    \ is a relatively new technology possible cyber breaches are explored in relation\
    \ to issues of liability especially in the event of accidents occurring because\
    \ of seemingly independent actions taken by AI mechanisms. This could be, for\
    \ example, an algorithmic quirk in a cyberwarfare robot taking potentially lethal\
    \ action. All countermeasures and policies include support for general society\
    \ within the ‘cybersecurity eco system’. This is akin to innovative eco systems\
    \ in general but in this case one in which the protection afforded by cybersecurity\
    \ will aid the creation of innovation, which will produce value. This eco system\
    \ in turn will be used for investment, R&D and human resources, leading to further\
    \ innovation in society. Each citizen is expected to have awareness and understanding\
    \ of cybersecurity measures and deal with risks autonomously in their daily life,\
    \ such as washing their hands to prevent infection or observing traffic lights\
    \ to prevent a car crash. Therefore, cyber defence is not only proactive but also\
    \ integrated fully into society at every level. Implementation of active preventive\
    \ measures against cyber threats includes the amendment of `NICT` law (National\
    \ Institute of Information and Communications Technology). This is an innovative\
    \ approach in that the law allows for investigation into potentially vulnerable\
    \ `IoT` devices before an incident takes place, not after it occurs. Another innovation\
    \ is the `CSC`, which accommodates private-sector involvement. \n\n## Performance\
    \ and assessment of cybersecurity measures, 2018\n\nSome of the results of actions\
    \ taken in 2018 include a workshop on `cybersecurity management` and a handbook\
    \ on information protection, which aims to enhance awareness among corporate executives\
    \ and senior management. Other actions taken involve a public hearing on `Cyber\
    \ physical measures` that is related to safe supply chains, an effort to enhance\
    \ systems through `IPA` and `JPCERT/CC`, further strengthening of information\
    \ sharing, protection of IT assets and the research environment in higher education\
    \ in preparation for the Olympics. There is also `Proven in Japan` concept for\
    \ already-held Japan–ASEAN (Association of Southeast Asian Nations) cybersecurity\
    \ policy conference. As for `CSC`, its operation commenced from May 2019 with\
    \ the second and third member opened. The main ministries aimed to achieve in\
    \ 2019 the enhancement of awareness of cybersecurity, promotion of investment\
    \ in cybersecurity, strengthening cybersecurity businesses that support innovation,\
    \ support for SMEs, systematisation and internationalisation of standards in `IoT`,\
    \ further protection of critical infrastructure, further promotion of information\
    \ sharing, international cooperation and collaboration on cybersecurity, promotion\
    \ of R&D and human resource implementation of cybersecurity. \n\n## Risk management\
    \ practice\n\nIn Japan there is concern that the only way to mitigate cyber risk\
    \ in all its forms and in relation to IP and cyberwarfare is to prepare all those\
    \ involved so they are an integral part of the countermeasures. Stakeholders need\
    \ to exchange both information and opinions on how to work internally to prevent\
    \ cyberattacks. Both the private sector and the government must work together\
    \ to protect critical infrastructure. The `CEPTOAR` council, which is made up\
    \ of independent bodies including government organisations, is used for cross-sectoral\
    \ promotion of the enhancement of information and opinion exchanges in cooperation\
    \ with diverse stakeholders while collecting information necessary for studies\
    \ and analyses of new risk sources and risks. Top-level management are viewed\
    \ as responsible for showing leadership in cybersecurity matters as individuals\
    \ contributing to society as a whole. Senior management need to continually procure\
    \ and maintain budgets, systems and personnel to secure all the above measures\
    \ and allocate them in the most risk-free manner.\n"
