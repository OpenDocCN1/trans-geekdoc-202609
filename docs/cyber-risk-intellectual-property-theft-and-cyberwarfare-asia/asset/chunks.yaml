- fmt: "\n![cover](Images/0.jpeg)\n\nThe desire to steal the intellectual property\
    \ (IP) of others, be they creative individuals or company teams working in patent\
    \ pools to create new innovations, remains the same. Political methods have become\
    \ more sophisticated in terms of devaluing the output of creative humans by creating\
    \ open-source access, which can be taken freely by all and sundry. What has changed\
    \ is the new cyber-based technology that allows increased theft of IP. Likewise,\
    \ warfare for geo-political imperatives is not new but sophisticated cyber-based\
    \ methods that can actually carry out infrastructural damage through cyberspace\
    \ are new and are accordingly termed cyberwarfare. How cyber strategies are used\
    \ in IP theft and cyberwarfare in relation to new complex digital technology such\
    \ as the Internet of Things (`IoT`) is explored in relation to particular essential\
    \ sectors in the economy: marine, smart energy power grids and insurance. Country-specific\
    \ studies based on either being the recipient or perpetrator (or both) of cyberattacks\
    \ provide analysis in relation to Japan, China and North Korea, Russia, Europe\
    \ (the UK in particular), Iran and the USA.  `Ruth Taplin` (PhD LSE, Graduate\
    \ Diploma in Law) is Editor of the `Interdisciplinary Journal of Economics and\
    \ Business Law` (`IJEBL`), Author/Editor of 23 books and over 200 articles, Featured\
    \ Author Routledge and Director of the Centre for Japanese and East Asian Studies.\n\
    \nRoutledge Studies in the Growth Economies of Asia 139\nInnovation, Investment\
    \ and Intellectual Property in South Korea Park to Park `Ruth Taplin` 140\nA Microcredit\
    \ Alternative in South Asia Akhuwat’s experiment `Shahrukh Rafi Khan and Natasha\
    \ Ansari` 141\nDevelopment Agenda and Donor Influence in South Asia Bangladesh’s\
    \ experiences in the PRSP regime `Mohammad Mizanur Rahman` 142\nHow China’s Silk\
    \ Road Initiative is Changing the Global Economic Landscape `Edited by Yuan Li\
    \ and Markus Taube` 143\nTrade Unions and Labour Movements in the Asia-Pacific\
    \ Region `Edited by Byoung-Hoon Lee, Sek-Hong Ng and Russell Lansbury` 144\nInternational\
    \ Entrepreneurship: A Comparative Analysis `Susan Freeman, Ying Zhu and Malcolm\
    \ Warner` 145\nRitual and Economy in Metropolitan China A global social science\
    \ approach `Carsten Herrmann-Pillath, Guo Man and Feng Xingyuan` 146\nCyber Risk,\
    \ Intellectual Property Theft and Cyberwarfare Asia, Europe and the USA `Ruth\
    \ Taplin`  \nFor more information about this series, please visit: [www.routledge.com/asianstudies/series/SE0133](http://www.routledge.com)\n\
