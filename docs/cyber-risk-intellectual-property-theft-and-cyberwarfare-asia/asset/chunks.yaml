  trans: '

    网络攻击通常与大型企业相关联，而大型企业也是此类攻击中被报道最多的群体；网络解决方案和保险范围也侧重于规模较大的公司。然而，中小企业（SME）部门往往最需要保险保障，因为在供应链中，它们是最薄弱的一环。日本作为一个拥有许多大型企业（`shogo
    shosha`）和大型贸易集团（`keiretsu`）的国家，并依赖许多小型公司提供的制造零件，因此特别容易受到通过中小企业供应链进行知识产权（IP）盗窃的网络攻击。2019
    年 7 月 2 日，日本《日本新闻》警告称，针对中小企业供应链的网络攻击可能导致严重后果，因为日本只有 4%的中小企业采取了网络攻击防御措施。这意味着网络攻击者可以通过攻击较小的子公司中小企业，轻松地窃取大型汽车制造商的
    IP 蓝图。经济产业省（METI）及其他政府机构担心，这种针对中小企业供应链网络攻击的脆弱性将削弱整体的网络防御能力。


    整个中小企业领域需要从其特殊脆弱性的框架内进行分析。由于它们既被视为创新知识产权的存储库，又是广泛供应链的一部分，中小企业被视为从大型企业窃取知识产权的容易且间接的。


    ## 海运部门


    除了数字化的电网，我们还评估了从海军到商业航运的整个海洋世界。海军构成了国家国防的军事力量，而商业航运则支撑着全球贸易的力量，对国家的经济成功至关重要。直到最近，随着世界各国海军的网络攻击漏洞日益暴露（例如在马六甲海峡或遭受非洲之角的索马里海盗遭遇的
    GPS 导航系统攻击），海运部门对网络风险和攻击才开始重视。然而，这种情况正在发生变化，特别是来自政府监管机构的一份新报告指出，美国交通部海运管理局显示出对“基础黑客技术”的网络脆弱性。根据国际船级社协会（IACS）主席的说法，这些领域的网络风险和攻击日益严剧，以至于网络安全系统已成为像船舶结构和机械一样不可或缺的安全框架。IACS
    事实上已经发布了许多建议，解释了航运业如何提高船队对网络攻击的韧性，并且还有进一步的建议。直到最近，网络犯罪分子更倾向于专注于银行和金融领域以寻找非法收益。然而，近期在苏伊士运河入口附近发生的未说明的电子干扰，以及不同港口的当地黑客对世界海军的网络攻击，都是商业航运业正成为攻击目标的预演。这使得商业航运承担了更快速改进其网络防御的责任。各国海军已经迎接了挑战，他们在网络防御上的投入与武器和船体结构的投入一样多。正如《武器报告：网络安全》所提到的，海军在知识产权方面具有特殊的脆弱性，因为防御系统受到知识产权法多个方面的保护。美国海岸岸卫队（USCG）最近发布了一项关于网络攻击相关海洋安全的警报，形式为某深水船舶上的网络恶意软件事件，影响了其船载网络。该事件非常严重，促使美国海岸岸卫队要求所有船舶所有者和运营商对相关船舶进行针对网络漏洞的网络评估。


    ## 物联网


    物联网（IoT）在我的著作《金融领域的网络风险管理》（2016: 15）中被定义为所有系统通过互联网的互连性。这以更全面的方式影响了网络风险和攻击，并以类似的方式影响保险价值链，正如前提到的中小企业作为大型公司供应链的一部分充当网络风险和攻击的渠道一样。物联网网络安全漏洞的快速增长非常普遍，以至于英国政府
    2018 年的一份报告建议，防止和处理来自个人或国家支持行为的网络攻击的物联网培训，应成为所有与连接设备工作的工程师培训的一部分。这包括水管工和燃气工程师。内政部还建议投资
    500 万英镑对警察部队进行网络安全措施培训，特别是为了保护中小企业和个人。2018 年，只有 30%的警察部队达到了最低网络犯罪能力。当时的内政部长安珀·鲁德（Amber
    Rudd）指出，国家网络安全中心（NCSC）已应对 49 起与俄罗斯网络小组相关的事件，其中某些事件涉及数百个潜在受害者。这将在后续章节中进行探讨，因为网络攻击发生的间接进入路径在许多文献中并不明确，特别是在物联网方面。


    ## 数据泄露


    '
- fmt: '

    Data breaches through `IoT` or otherwise are being taken very seriously by both
    governments and companies through regulations and fines. Personal data being breached
    by hackers who then pass it on for use by fraudsters has been increasing rapidly
    and making companies realise that it is their responsibility to ensure personal
    data entrusted to them is not breached in any manner. The recent cases of `British
    Airways` and `Marriott Hotels` are a case in point.


    The Global Data Protection Regulation (`GDPR`) was introduced on 25 May 2018 in
    the EU jurisdiction. `British Airways` was fined more than £183 million by the
    Information Commissioner’s Office for the breach of a wide range of personal data
    of half a million of their customers. This seems to be a very large fine but Darren
    Wray, CEO of `Fifth Step` a cyber resiliency consultancy, noted that the EU regulator
    could have fined `British Airways` up to 4% of their annual revenue, instead of
    1.5%, which would have added £300 million to the total fine.


    `British Airways` was criticised by the Information Commissioner’s Office for
    not even ensuring basic customer data protection such as rudimentary encryption.
    The `Marriott` international hotel chain has been fined £123 million for their
    2018 data breach of personal customer information under `GDPR` and intends to
    fight it. Throughout the EU in 2018 there were 206,326 cases of cyberattacks involving
    data breaches with 52% now closed, 47% ongoing and 1% appealed.


    Not all firms have integrated `GDPR` practices into their businesses as yet and
    for SME companies it is costly, if not financially impossible, to hire a data
    protection officer. `IP` can be seen as both personal and company owned depending
    on whether it is a sole inventor, single company or patent pool invention. How
    will legislation evolve to cover breaches of `IP` and who will be deemed responsible
    for such breaches? Will the defence departments of governments be seen as responsible
    when `IP` concerning defence plans is breached?


    `IP` is much more complicated when theft takes place as the implications are much
    wider, affecting individuals, companies and governments including infrastructure,
    defence, education and so forth. The complications of `IP`, especially through
    the `IoT`, not only make it more difficult to protect but also to insure. The
    extent and variation of cyberattack is expanding at such a rapid rate that insurers
    protecting companies both large and small and across all sectors are not able
    to update their cyber products rapidly enough and are even unsure what are the
    best policies to offer.


    In, for example, industries such as the maritime sector, the data upon which experience
    is based to formulate policy cover are not extensive enough. Many of the cyber
    risk insurance products focus on `BI`, which is inadequate for the maritime sector
    as it has to deal with damage resulting from the loss of vessels’ `IP` data through
    theft and `GPS` navigational attacks. The most difficult problem in creating a
    comprehensive insurance policy for the maritime sector surrounds exclusion, which
    also exemplifies the heart of the matter surrounding the management of cyber risk/attack
    explored in this book. This is how we define whether a cyberattack is a result
    of war or crime. Is a terrorist derived cyberattack an act of war or is it basically
    a crime when it involves, for example, hacking into a vessel’s navigational system
    to change the course of a ship to land where it can be robbed of its content to
    fund terrorist activities? The theft of data, `IP`, or locking companies or public
    services out from their data such as the `WannaCry` ransomware attack can be considered
    both an act of war and a crime. Is the physical destruction of infrastructure
    through cyberattack an act of war or a crime? The overlap between the two needs
    to be explored and definitions/analysis expanded, which we do in subsequent chapters.


    ### Notes

    1. A debate covered in my last few books such as *Managing Cyber Risk in the Financial
    Sector: Lessons from Asia, Europe and USA*, Abingdon: Routledge, 2016.

    2. ‘Fractured system needs urgent fix’, Daniel Thomas, *Patents*, *The Times*
    (18 December 2018).

    3. ‘Predators of the internet who do as they please’ Jonathan Taplin, *The Times*
    (6 May 2017).

    4. ‘Web inventor in battle to avert a digital dystopia’, Mark Bridge, *The Times*
    (25 November 2019).

    5. ‘Pompeo attacks China and warns Britain over Huawei security risks’, Stephen
    Castle, *New York Times* (9 May 2019).

    6. `PwC` Japan, Economic Crime and Fraud Survey 2018. See `www.pwc.com/jp/ja/knowledge/thoughtleadership/economic-crime-survey2018.html`.

    7. Ibid.

    8. ‘Insurance industry must learn from global markets to meet challenge of huge
    rise in cyber-risk’, James Brewer, *AllAboutShipping* (18 March 2016).

    9. ‘IUA publishes cyber exclusion clauses’, Scott Farley, Communications Director,
    *IUA Press Release* (5 June 2019).

    10. *Creating Value for the Cyber Risk Agenda* (10 June 2019). See `https://aon.io/2KwPoaQ`.

    11. See, for example, `BA staff warn over data vulnerabilities`, Josh Spero, *Financial
    Times* (25 March 2019).

    12. ‘Two from China are charged in Anthem breach’, Nicole Perlroth, *New York
    Times* (9 May 2019).

    13. ‘FBI wishes it had acted quicker as China stole intellectual property’, Daphne
    Psaledakis, *Reuters* (19 November 2019).

    14. ‘Without naming Huawei, E.U. warns against 5G firms from hostile powers’,
