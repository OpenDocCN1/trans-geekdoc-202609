    通过 `IoT` 或其他途径发生的数据泄露正受到政府和公司的高度重视，各国已通过法规和罚款采取应对措施。黑客窃取个人数据并将其转给诈骗者使用的情况正迅速增加，这让公司意识到，确保受托的个人数据不以任何方式泄露是其责任。最近的英国航空（`British
    Airways`）和万豪酒店（`Marriott Hotels`）就是例子。


    《通用数据保护条例》（`GDPR`）于 2018 年 5 月 25 日在欧盟司法管辖区引入。英国航空因泄露 50 万名客户的广泛个人数据，被信息专员办公室处以超过
    1.83 亿英镑的罚款。这似乎是一笔巨额罚款，但网络韧性咨询公司 `Fifth Step` 的首席执行官达伦·雷（Darren Wray）指出，欧盟监管机构本可以对英国航空处以其年收入
    4%的罚款，而非 1.5%，这将使总罚款增加 3 亿英镑。


    英国航空因未能确保最基本的客户数据保护（如基础加密）而受到信息专员办公室的批评。万豪国际酒店集团因在 2018 年违反 `GDPR` 泄露个人客户信息，被罚款
    1.23 亿英镑，并打算对此进行抗诉。2018 年，整个欧盟范围内发生了 206,326 起涉及数据泄露的网络攻击，其中 52%已关闭，47% 进行中，1%
    正在上诉。


    并非所有公司已将 `GDPR` 实践整合到其业务中，对于中小企业（SME）来说，聘请数据保护官成本高昂，甚至在财务上是不可能的。取决于是个人发明、单一公司还是专利池发明，`IP`
    可以被个人或公司所有。法律将如何演变以涵盖 `IP` 泄露？谁将被视为此类泄露负责？当涉及国防计划的 `IP` 泄露时，政府的国防部门会被视为负责？


    当发生盗窃时，`IP` 要复杂得多，因为其影响范围广泛，涉及个人、公司和政府，包括基础设施、国防、教育等。`IP` 的复杂性（尤其是通过 `IoT` 发生的）不仅增加了保护的难度，也增加了保险的难度。网络攻击的范围和变化正以如此快的速度扩张，导致保护大小企业及各业的保险公司无法足够快速地更新其网络产品，甚至不确定提供什么策略最佳。


    例如，在海运等行业，用于制定保单范围的经验数据并不充分。许多网络风险保险产品聚焦于业务中断（`BI`），这对于海运行业来说是不够的，因为其必须处理因盗窃和
    `GPS` 导航攻击导致船舶 `IP` 数据丢失而造成的损失。为海运行业创建全面的保险单时，最困难的问题在于免责条款，这恰体现了书中探讨的网络风险/攻击管理的核心问题。这就是我们如何定义网络攻击是战争的结果还是犯罪的结果。恐怖主义引发的网络攻击是战争行为还是基本上是犯罪？例如，入侵船只的导航系统以改变航线，使其靠岸后被掠夺货物以资助恐怖活动，这属于战争行为还是犯罪？数据、`IP`
    的窃取，或将公司或公共服务锁定在其之外（如 `WannaCry` 勒索软件攻击），既可以被视为战争行为也可以是犯罪。通过网络攻击对基础设施进行物理破坏是战争行为还是犯罪？两者之间的重叠需要被探讨，并扩大定义/分析，我们将在后续章节中进行讨论。


    ### 注释

    1. 我在过去的几本书中讨论过的一个辩论，如*金融领域的网络风险管理：来自亚洲、欧洲和美国的教训*，Abingdon: Routledge, 2016。

    2. “破碎的系统需要紧急修复”，Daniel Thomas, *Patents*, *The Times* (2018 年 12 月 18 日)。

    3. “随心所欲的互联网掠食者”，Jonathan Taplin, *The Times* (2017 年 5 月 5 日)。

    4. “为避免数字乌托邦而战的网络发明者”，Mark Bridge, *The Times* (2019 年 11 月 25 日)。

    5. “普林佩奥攻击中国并就华为安全风险警告英国”，Stephen Castle, *New York Times* (2019 年 5 月 9 日)。

    6. `PwC` 日本，2018 年经济犯罪与欺诈调查。见 `www.pwc.com/jp/ja/knowledge/thoughtleadership/economic-crime-survey2018.html`。

    7. 同上。

    8. “保险业必须从全球市场学习以应对网络风险剧增的挑战”，James Brewer, *AllAboutShipping* (2016 年 3 月 18
    日)。

    9. “IUA 发布网络免责条款”，Scott Farley，通讯总监，*IUA Press Release* (2019 年 6 月 5 日)。

    10. *为网络风险议程创造价值* (2019 年 6 月 10 日)。见 `https://aon.io/2KwPoaQ`。

    11. 例如，`BA 员工警告数据漏洞风险`，Josh Spero, *Financial Times* (2019 年 3 月 25 日)。

    12. “两名中国人在 Anthem 破解事件中被指控”，Nicole Perlroth, *New York Times* (2019 年 5 月 9 日)。

    13. “FBI 希望自己行动得更快，因为中国窃取了知识产权”，Daphne Psaledakis, *Reuters* (2019 年 11 月 19 日)。

    14. “在不点名华为的情况下，欧盟警告不要使用 5G”，E.U. warns against 5G, *Advisen Cyber News*, *Digest
    Edition* (2019 年 10 月 15 日)。

    15. “网络安全威胁威胁”，陶 McElvey, Kevin,, *2 (2019 年)。

