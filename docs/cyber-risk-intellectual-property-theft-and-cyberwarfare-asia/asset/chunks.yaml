    \ opposition rallies. SORM equipment has been sold by Russian companies all over\
    \ the world, especially those that wish to surveil their domestic populations\
    \ such as Belarus, Kazakhstan and the Ukraine as well as other countries in Latin\
    \ America, the Middle East and Africa. MFI Soft is one of the largest suppliers\
    \ of SORM equipment offering a number of packages and a 24-hour customer service.\
    \ One of the most sought-after packages is called SORMovich, which can be bought\
    \ for roughly US$ 20,000. MFI Soft in 2017 became incorporated into the Citadel\
    \ group of Russian so-called information security companies, which would allow\
    \ the Kremlin to expand capabilities and standardise pricing. In any geo-political\
    \ conflict SORM equipment controlled by the Kremlin gives it information gathering\
    \ control not just over its own population but also over countries in which it\
    \ is installed. In the case of cyberwarfare this would give the Kremlin an ideal\
    \ platform to plan cyberattacks, data mining to influence political outcomes or\
    \ to consolidate attack plans.[¹](#ch13.xhtml#en79) \n\n## Runet global internet\
    \ alternative"
