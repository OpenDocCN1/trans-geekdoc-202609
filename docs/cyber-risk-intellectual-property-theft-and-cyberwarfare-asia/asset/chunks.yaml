  trans: '


    日本机构缓解网络风险和攻击（无论是涉及知识产权窃取还是网络战争）的主要方法之一是通过信息共享。这种方法强调通过组织良好的人类通信来为试图渗透网络系统的黑客提供屏障。网络安全委员会（`CSC`）于
    2019 年 4 月解释了为什么这种信息共享方法可以成为一种有效的应对措施。他们指出，如果没有对网络攻击的性质（包括方法和应对措施）进行快速信息共享，损害和攻击范围将在机构间蔓延。信息共享面临的最大障碍之一是机构之间缺乏信任，以及对公司机密信息泄露可能损害其声誉的担忧。2018
    年 12 月，《网络安全法》的一项重大修订促成了 `CSC` 的诞生，并允许通过立法使信息共享成为一项法定义要求的义务。`CSC` 承认，由于对这类信息处理不当，公司在信息共享泄露中遭受了严重影响。此类泄露往往导致违反其他法律，从而进一步损害了公司。一个例子是敏感数据的泄露，这些数据可能帮助公司竞争对手获取研究结果或尚未申请专利的知识产权。`CSC`
    决定制定合规立法，规定在公司间共享信息时具有保密义务。法律规定的不合规行为意味着泄露者将受到惩罚，最高可处监禁一年或最高 50 万日元的罚款。信息共享的义务还受到精确法律和法规的约束。此外，一个由政府法令定义的专门机构/机构被委托运行
    `CSC` 的信息共享活动。人们认为，存在一个机构/机构来协调信息共享，作为联系点以让公司成员放心，是至关重要的。


    ## 《网络安全法》修订


    来自国家信息安全中心（`NISC`）的一份文件概述了《网络安全法》修订的内容和 `CSC` 的结构。修订《网络安全法》部分内容的立法草案包括以下内容：


    - 设立 `CSC` 是为了让各种公共和私营实体能够在网络安全信息共享方面相互合作，讨论并实施必要的应对措施，以确保网络安全的实现，并使日本为 2021 年东京奥运会做好充分准备。

    - 第一项任务是由“网络安全战略总部”建立 `CSC`，这将允许公私实体在信息共享和讨论所需应对措施方面进行相互合作。该机构的结构将总部设在 `NISC`，并在其他专门机构设立办公室，如国家和地方行政机关、主要基础设施和网络实体、教育或研究机构以及专家群体。

    - 如上所述，将确保对委员会的保密性、合作和信息共享，这将有利于与总部的沟通。该过程的行政职能也将由总部管辖。这包括与日本国内及境外有关网络安全事件的人员进行通信。部分行政操作将与政府法令规定的实体进行协调，法案中还详细规定了其保密义务的条款，期限不超过法案实施之日起一年。`CSC`
    的结构如下：


    > 网络安全委员会总部 (NISC 及专门机构) 专家

    > 专门机构提供的威胁信息将以战略性和快速的方式进行共享

    > 国家行政机关 | 地方当局 | 主要基础设施实体 | 网络实体（安全/系统运营商） | 教育机构

    > 以上所有实体分别实施应对措施 ↓

    > 促进以确保网络安全 ↓

    > 确保公民的安全与保障


    - 有助于增强日本社会经济系统的顺畅运行。

    - 委员会还与海外的行政机构和私营部门进行合作。


    ## 信息共享的挑战


    2019 年 6 月，超过 8000 名参与者在以色列特拉维夫大学举行的国际网络安全会议“2018 网络安全周”上聚集。许多演讲者都将信息共享视为未来的挑战。Check
    Point 副总裁 Dorit Dor 先生对现状表示：“如果我们不共享攻击方法和背景，信息共享将是微不足道毫无意义的。然而，这是一个非常的问题，许多人只在攻击发生后才共享结果。”为了应对网络物理攻击，本·盖恩国际机场三年前开发了一个先进的安全运营中心，该中心整合了利用
    AI 进行实时检测的能力，并整合了 `IT` 和 `OT`（运营技术）部门的管理系统。然而，信息共享一直仅限于机场及其所属的机构或机构之间进行，与机场外部实体共享信息非常罕见。Dor
    先生指出，当攻击者被认为在使用暗网来加强其活动网络时，攻击防御专家之间的合作是不够的。


    ## 外包分析


    有一公司正尝试利用区块链在负责攻击防御的人员之间实现合作。美国初创公司 `PolySwarm` 旨在创建一个恶意软件分析的外包市场，来自全球的安全分析师通通智能合约自由参与，并获得加密货币激励报。该公司描绘了未来业务的蓝图：专家们合作构建一个分析引擎，相关人员共享信息。它还旨在提高安全专家的地位，以防止他们由于财务原因而被迫成为攻击者。这种日本专家与海外专家之间的合作可能会带来积极结果，例如由于网络安全风险专家的匮缺而增强的攻击防御和解决能力。在网络安全领域应用区块链方面，必须关注
    `IoT` 和数字数据的安全应对措施，因为区块链提供了高完整性和可用性。例如，由爱沙尼亚的 `Guardtime` 开发的的一种基于区块链的电子签名技术被用于检测政府提供的在线服务中的操纵和篡改，它已经证明了区块链的用处。尽管区块链不能解决所有问题，但人们期待它可以解决某些网络安全问题。


    ## 社会跨学科参与


    英国的 `NCSC` 设有社会技术安全小组，该小组开展的 `R&D` 工作侧重于“社会如何参与技术”，而不是“如何用技术解决问题”。来自社会经济、心理学、计算和哲学等不同领域的专家参与讨论，以制定指导方针和安全工具。在目前普遍认为网络安全不仅仅是一个技术问题的背景下，这种探索社会参与的方法可以为理解如何接触最新技术提供线索。


