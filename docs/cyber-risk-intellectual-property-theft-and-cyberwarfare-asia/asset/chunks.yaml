    # 结论 (#ch05.xhtml#tocbook-part-01)


    ## 未来考虑


    ### 新冠肺炎未来的网络攻击


    由新冠病毒或 COVID-19 引起的全球大流行始于中国武汉，由于在不卫生的活鲜市场食用携带冠病毒的野生动物，它摧毁了全球经济，现在也影响了全球健康。它是否会给全球经济和社会局势带来更大的问题，例如东京奥运会可能取消，这将对日本经济造成进一步损害？看起来似乎会，而且在网络风险、威胁和攻击方面也是如此。随着前所未有的人数居家，维持足够的网络安全的问题正日益凸显。自
    2020 年 3 月初以来，英国的钓鱼攻击增长了 667%。


