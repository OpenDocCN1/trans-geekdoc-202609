    \ and other major cities in Iran. The idea behind this was that the cyberattack\
    \ by the US would be so devastating that Iran would surrender without any physical\
    \ military action.[⁸](#ch15.xhtml#en112)[⁹](#ch15.xhtml#en113) Iran in its support\
    \ of terrorist groups in the Middle East region not only contributes physical\
    \ weapons but also, in a similar vein as it has learned from cyber interference\
    \ in elections, can pass its hacking knowledge along to such groups. An example\
    \ of such possible hacking training could have been a recent cyber scam by Hamas\
    \ against Israel. The former often acts as a proxy for Iran while the latter is\
    \ a US ally. In February 2020 dozens of Israeli soldiers had their smartphones\
    \ hacked by Hamas militants posing as young females trying to get the attention\
    \ of the soldiers. According to Lt. Col. Jonathan Conricus it was the third attempt\
    \ to obtain information about Israeli soldiers. In this case, which was the most\
    \ sophisticated to date, when Israeli soldiers downloaded the young females app\
    \ they allowed access to all the information and data on their smartphones. The\
    \ female imposters said they could not speak Hebrew properly because they were\
    \ immigrants to cover up the reality they were Hamas members. They would send\
    \ the soldiers links to exchange pictures that downloaded malware programmes to\
    \ infect the smartphones and any computer devices. This allowed the smartphone\
    \ to take pictures and make recordings of conversations without the owner having\
    \ any idea that this cyber spying was occurring. Lt. Col. Conricus stated that\
    \ the Israel Defense Forces let the scam run for several months under surveillance\
    \ before shutting it down and warning soldiers to be vigilant with regards to\
    \ what messages they open on their smartphones.[^(10)](#ch15.xhtml#en114) \n\n\
    ## IoT and the dark web\n\nHowever, it is once more the newly emerging interconnectedness\
    \ of the IoT that signals the greatest potential problems for cyberattacks in\
    \ the US. This could be seen in previous chapters of this book that illustrate\
    \ the IoT in relation to Huawei and 5G and why the US is increasingly wary and\
    \ is trying to block access by the Chinese telecommunications systems even in\
    \ the most marginal manner. When the IoT is used by cyber hackers who use the\
    \ dark web, the capacity for damage multiplies both physically and in cyberspace.\
    \ In the US there is increasing use of IoT devices from electric toothbrushes\
    \ to thermostats to lightbulbs. All this interconnectivity makes it easier for\
    \ hackers to enter a number of systems. One of the devices most actively used\
    \ under cyberattack, which can do great damage to homes and factories, is the\
    \ internet-connected gas pump. Cybersecurity firms in the US are noting that gas\
    \ pumps can be accessed remotely through the IoT. The security firm Trend Micro\
    \ has noted that the most requested hacking methods on the dark web continue to\
    \ be routers, webcams and printers, and tutorials for hacking online gas pumps\
    \ with logic controllers, which are not just for controlling homes but factory\
    \ machinery remotely. A common method for cyberattacks on IoT devices is for the\
    \ hacker to create a botnet, which is a network of devices they control. The botnet\
    \ can be used to carry out Distributed Denial of Service (DDoS) that can shut\
    \ down both services and devices. The concerning part of IoT is that even teenage\
    \ skilled hackers can cause damage between the cyber and physical world. In 2016,\
    \ teenage hackers in the US used a botnet named Mirai IoT to shut down internet\
    \ services in a number of places in the East Coast of America. Poorly secured\
    \ linked internet devices can be used in stealing personal data and IP, monitoring\
    \ networks and spying through a computer camera in addition to shutting down services\
    \ or causing physical damage. A countermeasure to IoT cyberattacks can be using\
    \ complex passwords, changing passwords often and using VPNs (Virtual Private\
    \ Networks) in their home network to encrypt traffic.[^(11)](#ch15.xhtml#en115)\
    \ \n\n## Bots and climate change"
