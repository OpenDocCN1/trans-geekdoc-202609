    # Automotive hacking, smart homes and data theft increases


    Today, vehicles are basically moving data plants. Modern cars are fitted with
    an array of global positioning system (`GPS`) devices, sensors and in-car communication
    that make them an increasingly profitable target for hackers and data thieves.
    Likewise, this occurs in a modern home with an array of networked devices. In
    an interconnected world of technology, the `IoT` cannot be underestimated regarding
    how data theft could occur. More devices are constantly being added across the
    globe, adding to the complexity and options for data thieves. Criminals have learned
    to piggyback into private networks through connected home appliances and smart
    devices thanks to the lack of security standards among the thousands of device
    manufacturers and service providers. Attackers will have the choice of targeting
    either vehicles or homes, perhaps using them to access e-mail accounts and then
    personal information, or the cloud services where our data are routinely sent
    for storage and analysis. Large-scale harvesting and resale of these data on the
    black market is highly lucrative for cybercriminals.


    ## Increasing cyberwarfare


    The goal of cyberwarfare is the ‘weaken, disrupt or destroy’ an enemy target.
    These targets could be attacked either by a nation-state or Denial of Service
    (`DoS`) attacks. Cyberwarfare threats range from propaganda to espionage and serious
    disruption with loss of life and extensive infrastructure disruption. These types
    of cyberattacks are disrupting governments and societies in a high-impact way
    that we have never seen before. They constitute the future of warfare globally.
    Finally, with all these growing cyber risks, this book by Ruth Taplin is both
    timely and much needed to explain all the above aspects of a future of increased
    cyberattack and how we need to deal with such events globally. If we do not heed
    these warnings, all of us will be the losers. As noted in research by Coveware,
    the average ransomware payment in the fourth quarter has increased from US$ 41,198
    in the third quarter to US$84,116 in the US in 2019.[¹]](#ch06.xhtml#en1) Furthermore,
    cyberattacks are taking a physical form as an Israeli cybersecurity firm identified
    a new type of ransomware that it believes was created by Iran to lock up or even
    delete industrial control systems as happened at Bahrain Petroleum Co.[²]](#ch06.xhtml#en2)
    To counter cyber risk and cyberattack whether it be financial, BI, physical infrastructure
    or reputational attack, it is vital to have local experts involved, cooperation
    and sharing of information between those under cyberattack, experts who understand
    the complexity of `IoT` and a book such as this one that will point those under
    cyberattack in the right direction to both understand and deal with these cybersecurity
    issues. Todd Williams Director, NSW Cyber Security Node New South Wales, Australia


    ### Notes

    [1](#ch06.xhtml#fnen1)‘Average ransomware payment jumped 104 percent in the fourth
    quarter’, Erin Ayers, *Advisen Cyber News* (31 January 2020). [2](#ch06.xhtml#fnen2)‘Cyberattacks
    linked to Iran appear to target Bahrain Petroleum Co.’, Erin Ayers, *Advisen Cyber
    News* (31 January 2020).


    # Acknowledgements (#ch05.xhtml#tocack-001)


    The author would like thank a number of colleagues for their assistance with this
    book. They include Prof. Motohiro Tsuchiya of Keio University, Prof. Akio Nishizawa
    of Toyo University, Mr Akio Ono of Japan Subway Association and Mr James Brewer


    ## Cyber glossary (#ch08.xhtml#glossary-001)


    | `Back door` | An entry that is hidden |

    | :--- | :--- |

    | `Big data` | Very large data sets |

    | `Black hat` | This refers to hackers who for financial gain |

    | `Botnet` | A network of devices controlled by hackers |

    | `Bots` | These are computer-generated programmes |

    | `Brute force attack` | Automated search for every possible password |

    | `Business interruption` | Disrupting the normal flow |

    | `BYOD` | Bring Your Own Device |

    | `Cracking` | Attempted break-in |

    | `DDoS` | Distributed Denial of Service |

    | `DoS` | Denial of Service |

    | `Doxing` | Tracing the digital footprint of user and then making it public |

    | `Dragonfly` | It uses two types of malware |

    | `Grey hat` | Someone hacking for a non-pecuniary reason such as a political
    one |

    | `Honeypot` | An information system... used to detect and deflect hackers |

    | `Identity theft` | Impersonation of real people and organisations through fraudulently
    having obtained details

    || `Internet protocol address` | A device’s fingerprint that can be used to track
    the person |

    | `IoT` | Internet of Things |

    | `ISP` | Internet service provider |

    | `Keystroke logging` | Tracking by keys being pressed on a computer |

    | `LAN` | Local Area Network |

    | `Malspam` | Malware delivered through e-messages |

    | `Malware` | A malicious software programme designed to steal data |

    | `Metadata` | Data that give information regarding other data |

    | `Misconfigurations` | Interference in configurations in devices |

    | `MITM` | Man-in-the-Middle |

    | `Node` | An individual system within the blockchain |

    | `Phishing` | Fraudulently tricking users of digital devices |

    | `QoS` | Quality of Service |

    | `Reputational loss` | An attempt to ruin the reputation of a company |

