    ### 保护 (Protect)

    - 安全更新机制开发

    - 证据评估技术

    - 轻量级加密、隐私数据库、抗量子密码学


    ### 检测 (Detect)

    - 网络映射自动化工具

    - 安全运营工具的用户界面改进


    ### 适应 (Adapt)

    - 在遭受攻击时允许重要资产持续使用的技术


    ## 中期 (Medium term)


    ### 威慑 (Deter)

    - 实时溯源


    ### 保护 (Protect)

    - 减少漏洞的静态/动态分析工具

    - 自动化提取安全策略的工具

    - 软硬件真实性验证率的工具与技术


    ### 检测 (Detect)

    - 识别恶意网络活动（降低误报率和漏报率）


    ### 适应 (Adapt)

    - 相互依赖系统功能的及时恢复


    ## 长期 (Long term)


    ### 威慑 (Deter)

    - 对攻击者进行准确高效的识别


    ### 保护 (Protect)

    - 支持每 10 万行代码一个故障的软件开发工具

    - 在十年内将安全控制的有效性和效率提升至两个数量级


    ### 检测 (Detect)

    - 自动化网络威胁预测工具


    ### 适应 (Adapt)

    - 自适应且有效的集体防御


    ## 英国的 ACE (ACE in the UK)


    英国的网络安全研发推广是在 ACE 框架内进行的，该框架由通过 `NCSC` 和工程与物理科学研究委员会 (`EPSRC`) 批准标准的标准的大学组成。2001
    年，`EPSRC` 和 `GCHQ`（政府通信总部）启动了 ACE 框架，旨在增强应对网络攻击的韧性。此后，`NCSC` 接管了 `GCHQ` 的这一职能。截至
    2019 年 1 月，参与的大学有 17 所。每年约有 2 万英镑的资金被拨给给贝尔法斯特皇后大学、布里斯托尔大学、罗伊霍洛大学、纽卡斯尔大学和伦敦帝国学院等获批大学。这些英国大学的关键领域如下：

    - 加密、密钥管理及相关协议

    - 信息风险管理

    - 系统工程与安全分析

    - 信息保证方法论

    - 运行保证技术

    - 战略技术与产品安全研究

    - 网络安全与人类因素科学

    - 高可靠系统的建立


    ACE 批准大学的方法如下：

    - `伦敦帝国学院`：安全且韧性的软件系统工程，包括操作系统和信息保证/安全分析以及系统验证

    - `纽卡斯尔大学`：利用技术的网络犯罪、基础设施的安全保障、网络安全科学

    - `贝尔法斯特皇后大学`：网络物理系统安全、实时网络分析与虚拟化、高规格/低能耗加密架构

    - `罗伊霍洛大学`：逻辑与实际加密应用、网络安全的社会、技术和组织视角、`RFID`（射频识别）标签、智能标签和植入设备的信息保证


    ## 以色列的网络安全生态系统 (Israel’s cybersecurity eco system)


    以色列通过军队、政府、工业界和学术机构建立了独特的网络安全生态系统，并涵盖了产生许多初创企业的 `Cyber Spark` 以及专注于网络安全研究的学术界。


    ## 源自安全领域的学术生态系统 (Academic eco system with its origin in the security area)


    包括`本·古里恩大学`和特拉维大学在内的六所大学建立了一个网络安全研究中心，专注于政策、技术和学术生态系统等领域。该生态系统的驱动力是对国国防领域网络安全的投资。在培养高标准网络意识未来员工方面，教育是关键。这始于中学阶段，并在军事服役的人力资源中持续进行专家培训。一旦表现出网络研究天赋的学生高中毕业并开始服役，他们会被送到网络相关部门以获得进一步的专家知识。离开军队后，他们将在大学和私营部门工作。


    ## Cyber Spark 的建立 (Establishment of the Cyber Spark)


    在内塔尼亚胡总理和国家网络安全局的倡议下，`Cyber Spark` 于 2014 年在贝谢法的建立，形成集群，旨在成为一个活跃的生态系统。`Deutsche
    Telekom`、`EMC`、`洛希德德马丁`、`Oracle`、`IBM` 和 `JVP` 等公司和企业在 `Cyber Spark` 设有办公室，那里有很多初创企业。


    ## 新加坡的国家网络安全研发 (Singapore’s national cybersecurity R&D)


    新加坡国立大学和国家研究基金是基于 2013 年启动的“网络安全研发计划”的领先安全研发机构。2016 年，新加坡网络安全联盟成立，这是一个工业界、政府和学术界之间的合作组织，旨在开展研发、人力资源和网络安全意识工作。以下概述了重点关注的六个研发主题。到
    2020 年的预算为 19 亿美元。

    1. 可扩展的可信系统

    2. 韧性系统

    3. 有效的态势感知和攻击溯源

    4. 应对内部威胁

    5. 威胁检测、分析与防御

    6. 高效的数字取证


    ## 创新是成功的关键 (Innovation as key to success)


