    Foreign ministries are not exempt from cyberattacks, especially those that are
    part of NATO and therefore hold a close relationship to the US military. The Czech
    Ministry of Foreign Affairs experiences cyberattacks weekly. In January 2017 the
    cyberattacks increased dramatically and followed the same pattern as those that
    were targeted against the Democratic National Committee (DNC) in the US. The Czech
    Foreign Minister stated there were no major breaches of confidential information
    and did not mention the state actor that may have been responsible. However, a
    government source reported that it was most likely Russia. It has been speculated
    that the major cyberattack could have been carried out by the Russian Cyber Army
    as vengeance for the Czech Republic’s close relationship with NATO and the EU.


    ## Iran as a source of geo-political cyberattacks


    Iran, along with Russia, has been initiating cyberattacks for geo-political reasons.
    In early October 2019 Microsoft stated that 2,700 hacking attempts were made in
    relation to a presidential campaign, American journalists who were covering Iran-US
    relations and US government departments. Unsophisticated methods were used to
    find out passwords to access victims’ accounts through finding out information
    about the victims initially. Iran is following the example Russia set of trying
    to interfere through geo-political cyberattacks. In July 2019 Tim Burt, Corporate
    Vice President of Microsoft, said that the majority of geo-political cyberattacks
    now emanate from Russia, Iran and North Korea targeting NGOs and think-tanks that
    work with US political campaigns.


    ## The IoT’s growing importance


    The Russian model of cyber as an economic and political weapon involves cyberattack
    in various forms, denial that they are responsible, placing the blame on others,
    especially proxies, and using cyberwarfare to produce economic, political, social
    and infrastructural physical damage. Their whole modus operandi relies on stealth,
    deceit, denial and blaming others. This means they choose cyber mechanisms that
    are not easy to detect and that are indirect in nature. Therefore, an increasing
    use of the IoT, as mentioned in `Chapter 1`, is taking place. A prime example
    occurred in April 2019 when Microsoft reported an incident through its Threat
    Intelligence Center that an IoT cyberattack had been carried out through Voice
    Over Internet Protocol, a printer and video decoder. The IoT devices provided
    soft access to a number of locations in the wider corporate network. Two of the
    three devices had factory security settings while the third had not been updated
    as yet. Microsoft noted the cyberattack bore the hallmarks of Russian hackers
    who are linked to the GRU using a variety of names such as Fancy Bear, APT28 and
    Strontium. This group of Russian state hackers have been active since 2007 as
    outlined above but since April 2019 Microsoft noticed that the direction of their
    cyberattack focus changed to IoT. It is usually thought that hackers target smartphones
    and computers for easy access to data and information or implanting malicious
    devices but it is more often that cameras, printers and decoders offer the soft
    access. The point of access to these devices are default passwords or passwords
    that are not updated. With the security not updated, the hackers create a beachhead
    that is their starting point for entering the unprotected corporate networks.
    Once the hacker has established a firm access to the network, a simple scan of
    the network for additional insecure devices allows them to move to more high-value
    accounts offering data and other privileged information. From there, the hackers
    move from one device to another, all the while mapping the network and communicating
    with command and control services. Microsoft has been observing an increase in
    global activity from the Russian state hackers. Since the initial cyberattack
    Microsoft has notified 1,400 recipients who have been compromised by `APT28` or
    `Fancy Bear`. Of those targeted 20% have been think-tanks such as European Values
    mentioned above, politically affiliated organisations and NGOs. The remainder,
    which comprises 80% of the cyberattacks, includes, among others, education, technology,
    engineering, medicine, the military, Olympic organisers, anti-doping agencies
    and the hospitality industry. In 2018, the FBI took action to disrupt a Fancy
    Bear campaign named `VPNFilter`, which targeted network storage devices and routers
    with malware that had the destructive capacity of ‘bricking’ devices through deleting
    firmware and rendering the devices useless. This campaign targeted the Ukraine
    in particular, which is often the target of Russian state hackers. As IoT devices
    rapidly increase and less sophisticated, low-technology devices become the entry
    point for skilled hackers, in this case Russian state actors, the severity of
    the cyberattack/cyberwarfare continues. The extent of this cyber risk in relation
    to IoT was demonstrated when security researchers at Armis found that `VxWorks`,
    the operating system that powers all the IoT devices globally, had vulnerabilities
    in multiple zero-day areas. This disclosure meant that the low-technology devices
    connected in IoT such as firewalls, medical equipment such as telemedicine platforms,
    and printers could as described above produce soft access points to corporate
    networks, which would render multiple layers of security useless. Microsoft noted
    that part of the problem is that IoT devices are just interconnected facilitators
    with little if no management oversight. How many companies hire staff to look
    after the vulnerabilities of their printers? In fact Microsoft noted that most
    of their customer IT operations do not know that their simple devices are connected
    to the internet. Worse, a network analysis showed that the IoT devices are subject
    to external control and command, which allows ingress from hackers hunting further
    access points. Microsoft made this disclosure to alert companies to the cyber
    risks they face especially as the number of IoT devices are far in excess of personal
    computers (PCs) and mobile phones combined. The sectors particularly vulnerable
    to cyberattack to be covered in this book will also be assessed in terms of IoT
    vulnerability as in my previous book on managing cyber risk in the financial sector.
    There have been warnings for years from cybercrime experts that even the humble
    office coffee machine can be a target of cybercriminals because of the ease of
    entry and also it is cheap for criminals to buy ransomware from dark web sites.
    In such cases it is even possible to buy one ransomware, get one free and share
    profits with the people have written the code. Jamie Bartlett, Director of the
    Centre for Analysis of Social Media at Demos, noted the IoT is so poorly designed
    that it could in the future become possible to be forced to pay a small ransom
    in cryptocurrency to obtain coffee from the office coffee machine.


    ## Cryptocurrencies – another cyber risk

