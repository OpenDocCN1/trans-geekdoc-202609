    正是知识产权（IP）的这些无形特性使其极易受到网络风险和攻击的影响，从而影响全球业务和贸易关系。正如本书所示，它可以在多个层面并在所有行业中运行。这些层面包括行业、政府、军事国防机构以及各种规模的企业。地缘政治、贸易部门和金融（包括银行和保险）都是这种
    21 世纪数字时代威胁的猎物。某些行业更容易遭受知识产权盗窃、网络攻击以及潜在/变种的网络战争，且往往以意想不到的方式发生，例如航运、国家电网、防御系统和零售银行系统。前书中提到的示例主要来自日本、欧洲和美国，但在航运领域，由于全球贸易路线的存在，这种情况可以在世界上任何地方发生。


    网络风险/攻击和知识产权盗取是非常广泛的话题，触及了我们生活的方方面面，但我们大多数人甚至没有意识到它们的存在，或者不知道在不同层面存在应对它们的补救措施。例如，保险行业通过承保本应涵盖广泛的网络风险，但直到现在才开始处理“无形网络风险”（silent
    cyber risk）。国际承保协会（IUA）发布了两个新的伦敦市场模型条款，以帮助承保人管理网络损失。这些条款的制定是为了解决非肯定性或“无形”涵盖的问题，即传统保险保单可能无意中暗示对未定义的网络风险提供保护。正如我在
    2016 年 3 月 16 日在 IUA 的支持下于伦敦城举行的《金融领域网络风险管理》新书发布会上现场解释的那样，条款的重要性是不容低估的。我当时：


    > 由于事实和细节的匮乏，保险公司陷入了困难的境地。我们正在处理一种新现象，人们甚至不知道用什么语言来描述网络攻击，当你们没有共同语言时，又该如何处理这类问题呢？


    从那时起，保险文件中使用的网络词汇定义已经有了进展.⁸ 首先，“网络损失绝对排除条款”（参考：`IUA 09-081`）为市场参与者提供了一个选择，以最广泛的方式排除因使用计算机系统、网络或数据产生的任何损失——这些每一项都有明确的定义。同时，“网络损失有限排除条款”（参考：`IUA
    09-082`）仅允许排除由网络事件直接导致的损失，而非“直接或间接”。IUA 法务和市场服务总监 Chris Jones 表示：


    > 这两个新的模型条款提供了广泛的保单排除责任，可以作为承保人为那些可能包含网络风险元素的传统业务类别提供涵盖的起点或参考点。通过开发特定类别的回保条款（write
    backs），保险公司可以明确说明对此类损失所提供的任何涵盖范围。


    这两个条款的制定是为了回应监管监管局（PRA）的担忧，即在各类保险业务类别中可能存在无意或不明确的网络风险涵盖提供。监管机构在 2016 年 11 月的一份咨询文件（`网络保险承保风险`）以及随后的政策声明（`PS
    15/17`）中解决了这个问题。敦促公司通过调整保费、稳健的条款排除和特定的涵盖限额来积极管理风险敞口。Jones 先生补充道：


    > 无形网络涵盖为保险人和客户都带来了不确定性，长期以来这一直是伦敦公司市场的热点话题。监管审查的加强自然也进一步凸显了这一问题，但 IUA 成员在 PRA
    首次提出这个问题之前就已经在考虑不同的方法了。许多传统保单在网络还不是主要风险时设计，往往没有明确提到网络。然而，一些高关注度的网络事件和损失清楚地表明了解决这些问题是多么重要.⁹


    各种规模的公司对网络风险及其如何影响其业务和保险需求的意识和关注近期受到了全球专业服务公司 Aon plc 的重点关注。该公司发布了名为《2019 年网络自留调查报告》，题为《为网络风险议程创造价值》，该报告显示，过去购买过此类涵盖的自留所有者对网络产品的需求正在增加。由于自留保险公司是由母公司设立的，用于涵盖主流保险公司未广泛涵盖且由于公司需要稳定定价而成本过高的风险，因此值得注意的是，随着需求的增加，自留公司正在加速提供网络风险涵盖。该报告揭示了网络保险自留买者的当前态度和趋势，包括对寻求管理网络风险的自留所有者面临的持续挑战和机遇的全球洞察。它还强调了网络风险涵盖日益增长的需求和行业需求：


    * 自留市场内网络风险毛签保费去年同比增长加速了 263%。

    * 在自留市场中购买最多网络涵盖的行业是医疗保健（19%）和能源（15%）。

    * 所投涵盖限额的范围高达 1,000 亿美元。

    * 调查的自留公司中孵化网络风险的比例达到 41%。

    * 在其网络保单中包含业务中断（BI）涵盖条款的自留公司比例达到 63%。这反映了上述的 IISE 研究，强调业务中断是全球组织网络攻击最频繁的目的。

    * 遭受网络损失的自留公司比例达到 26%，29% 的损失是全额限额损失。

    * 对保险计划的更大控制（37%）和实现成本效益（37%）是自留公司使用网络风险的两个主要原因。

    * 预计五年后 34% 的自留公司将承保网络业务。Aon 自留与保险管理部门首席执行官 John English 表示：


    > 自留公司在解决所有公司的新兴风险问题方面继续发挥价值作用。我们的调查表明，自留公司不仅可以提供创新的涵盖并为这一快速变化的风险的话题释放额外的额度，还能更好地协调公司内部的关键团队，以提高整体资本配置、战略规划和网络风险的改进。Aon
    网络解决方案全球实践负责人 Adam Peckman 表示：


    > 在数字经济的推动下，网络仍然是所有全球企业面临的最关键风险之一；然而，这项调查发现，网络风险的管理在公司职能之间仍然是碎片化且不一致的。将网络风险视为企业风险并将其纳入现有的风险管理框架至关重要。风险经理可以通过利用自留公司作为关键战略工具，通过更复杂的分析来揭秘网络风险，并推动更具针对性的资产负债表保护.¹⁰


    本书将探讨包括知识产权（IPR）盗窃在内的网络风险保险需求。


    ## 谁在进行知识产权盗窃？


