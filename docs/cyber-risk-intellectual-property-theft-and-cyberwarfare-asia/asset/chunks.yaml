    \ the financial sector.[^(13)](#ch11.xhtml#en58) There have been warnings for\
    \ years from cybercrime experts that even the humble office coffee machine can\
    \ be a target of cybercriminals because of the ease of entry and also it is cheap\
    \ for criminals to buy ransomware from dark web sites. In such cases it is even\
    \ possible to buy one ransomware, get one free and share profits with the people\
    \ have written the code. Jamie Bartlett, Director of the Centre for Analysis of\
    \ Social Media at Demos, noted the IoT is so poorly designed that it could in\
    \ the future become possible to be forced to pay a small ransom in cryptocurrency\
    \ to obtain coffee from the office coffee machine.[^(14)](#ch11.xhtml#en59) \n\
    \n## Cryptocurrencies – another cyber risk"
