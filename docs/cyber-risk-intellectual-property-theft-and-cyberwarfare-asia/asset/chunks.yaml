- fmt: "\nThere is a growing challenge of silent cyber/non-affirmative or unintended/affirmative\
    \ insurance policies. The first refers to non-inclusion of cyber liabilities either\
    \ unintended or intended and the latter to inclusion. The first category refers\
    \ to cases in which cyber risks and threats are not explicitly excluded or included.\
    \ When included, the language used is ambiguous and the insurer did not price\
    \ in or even contemplate loss scenarios due to cyber threats and attacks. \n\n\
    These omissions in cyber coverage can be related to property such as `BI` and\
    \ errors and omissions liability such as covering human error when securing data.\
    \ Other areas can concern directors or officers who require indemnification in\
    \ the event of breaches because adequate protocols or procedures were not in place\
    \ or general liability in which property damage, bodily harm or breach of privacy\
    \ occurs. An example of the latter is that a cyberattack targets a building’s\
    \ elevators causing physical damage to the system and bodily harm when the people\
    \ inside the elevator fall when it jerks as it stops. This means that unknown\
    \ or unquantified exposures because of cyberattack result in liabilities that\
    \ are linked to traditional property or liability coverage.\n\n### Affirmative\
    \ (the second category)\nAffirmative refers to inclusion of cyber risks and threats/attacks\
    \ in stand-alone network and security private policies. These can also take the\
    \ form of endorsements added to `P&C` policies that cover the costs linked to\
    \ data breach and network security failure because of cyberattack. Common coverages\
    \ can include first and third party. \n\n* **First-party coverage**: Can be in\
    \ relation to event management/breach response for call centres, forensics, public\
    \ relations or credit monitoring services; `BI` losses and expenses; and cyber\
    \ extortion and ransomware where payments, for example, are demanded to re-open\
    \ computer systems. Also included would be costs associated with data restoration.\n\
    * **Third-party coverage**: Would be in the case of privacy liabilities such as\
    \ failure to prevent unauthorised access/disclosure of confidential information\
    \ and fines and penalties associated with this. \n* **Network security liability**:\
    \ Another area that concerns failure to prevent or employ countermeasures to stop\
    \ an attack on computer systems.\n* **Privacy regulatory defence costs**: The\
    \ third area is where a privacy breach may be subject to regulatory fines or penalties.\n\
    \n### Market Impact and Regulatory Outlook\nFirst-party cyber liabilities were\
    \ clarified after the devastating 2017 `NotPetya` and `WannaCry` attacks. `NotPetya`,\
    \ in particular, aided clarification because ransomware and `BI` losses went over\
    \ the billion-dollar benchmark. The `PRA` believes that UK insurers should be\
    \ able to assess their non-affirmative exposure more accurately. Companies with\
    \ the most developed approaches are those that can analyse and bring together\
    \ different parts of their organisation. `Lloyd’s` is seeking to make every policy\
    \ written by a `Lloyd’s` market participant either provide affirmative cyber coverage\
    \ or exclude cyber coverage explicitly.\n\nThe global insurance market is concerned\
    \ about cyber coverage because losses could outstrip incoming premiums if silent\
    \ cyber is not dealt with adequately. A study by `Guy Carpenter` and `CyberCube`\
    \ in 2019 estimated that the US industry within a 1-in-100 return period produces\
    \ a yearly total of cyber-catastrophe insured losses of `US$ 14.6 billion`. This\
    \ estimate can include one or more incidents within the same year. This was based\
    \ on the US stand-alone cyber insurance industry. \n\nCyber insurance stress tests\
    \ in the UK according to a `PRA` survey in 2018 show that gross losses could outstrip\
    \ cyber premiums several times over. This estimation did not include silent cyber.\
    \ The `PRA` survey suggested that a cyber catastrophe could substantially alter\
    \ the dynamics of the market. Yet, even without a major cyber event, demand from\
    \ all quarters could push premiums into `US$ billions`.\n\n## Insurers ––– the\
    \ new ‘hated’ bankers\n"
