    # 知识产权盗取与网络战


    ## 在何处以及由谁实施？


    无论是在美国、中国、英国还是俄罗斯，大多数的技术进步都是由国家的军事部门创建并资助的。因此，大量的知识产权盗取与网络战的发展有关，这并不令人意外。此活动的目的是在收集新防御策略的数据和蓝图方面获得情报优势。网络攻击被用于渗透由将们领导的网战这一相对较新领域的防御。其次，这些技术进步还通过工业界的研发（R&D）得到进一步促进，通常通过共享的专利池实现。其目标是超越竞争对手并主导贸易和制造业。为了获得市场支配地位，知识产权盗取屡见不鲜。对此类技术进步和知识产权的利用往往来自于地缘政治力量，他们希望削弱其他地理位置的政治对手或被视为国内政敌（包括恐怖分子）。最后，出于个人利益的贪婪、个人能力不足或恶意的纯粹犯罪因素驱动了网络攻击和知识产权盗取。后者可能不是主要目标，而是为了金钱利益偷取价值物品的一部分。为了使情况更加复杂，还存在国家赞助的黑客组织，他们针对书中涵盖的各种行业，目标不仅是为了情报或专利收益，还为了金钱目的。火眼（Fireeye）的一份新报告指出，这种双重网络攻击活动既是新的，而且规模不断扩大。这种趋势的近期示例是受国家赞助的中国黑客，他们作为副业利用其黑客技术对加密货币提供商和游戏公司进行网络攻击，以获取个人利益。一个名为**高级持续性威胁
    41**（`APT41`）的中国黑客团体是此类国家赞助的网络间谍活动黑客中效率最高的。自 2012 年成立以来，`APT41` 已对包括美国、英国（注：原文此处为欧洲或指英国）、欧洲和亚洲在内的
    14 个国家的多个组织发动网络攻击。其主要重点是攻破医疗、新闻、教育、高科技、电信、旅游和视频游戏领域公司的数据系统。`APT41` 及其姐妹组织 `APT10`（后者专门对公用事业公司进行攻击，例如
    2019 年 7 月对美国三家公司的攻击）表明，基于地缘政治竞争、知识产权盗取和个人贪婪的网络战在大型网络攻击案例中可以融为一体。据称，`APT41` 对美国和欧洲的制药公司进行了大规模知识产权盗取，同时为中国政府收集有关近期频繁的香港民主运动的情报。在
    2014 年之前，对于受国家赞助的中国黑客来说，出于个人利益的动机的网络攻击几乎不存在，因为他们通常拥有国家的资金支持。然而，在 2014 年，视频游戏公司成为这些团体获取个人财物的目标。中国国家赞助的黑客攻破了如
    `Fifa Online` 等拥有数百万粉丝的视频游戏系统。这可以带来数百万的收入，满足这些黑客对金钱的贪婪，他们还广告自己愿意按雇进行黑客攻击。由特朗普总统发起的与关税上调相关的当前贸易战，在很大程度上与中国政府对美国政府和公司进行的知识产权盗取有关。甚至连美国国家安全局（`NSA`）使用的网络间谍工具也被一个与位于北京的安全部有关的中国黑客团体窃取。`APT3`（也称为
    `Buckeye` 或 `Gothic Panda`）一直在窃取 `NSA` 使用的黑客代码，用于渗透网络，例如 2010 年禁用伊朗核计划。对于 `NSA`
    来说问题在于此类攻击留下了恶意代码痕迹，这些代码可以被提取并重构以暴露 `NSA` 的工具。`APT3` 位于中国东南部的广东省，至少从 2009 年起一直活跃。然而，正如本书第一章提到的，2019
    年，美国司法部起诉并随后审判了 `APT3` 的两个成员，指控他们在六年内偷取信息，包括来自卫星软件公司 `Trimble`、西门子 `Siemens` 和金融服务公司
    `Moody’s Analytics` 的知识产权。中国黑客针对了美国的多个领域，如 `NASA` 太空技术、航空、国防、石油天然气公司以及生物技术领域，主要是为了窃取知识产权和私人信息。`APT3`
    窃取 `NSA` 工具是已知的外国国家组织通过活跃攻击窃取代码的第一个案例。这导致 FBI 院长克里斯托弗·雷伊（Christopher Wray）表示，中国国家赞助的黑客团体是“对我们进行经济间谍活动最活跃的实施者”，而且“没有任何国家对我们的经济和网络基础设施构成了更广泛、更严重和长期的威胁”。`APT`
    组织的数量及其成员数量不断增加。他们对美国的网络攻击正在扩大，例如 `APT40` 对与美国海军有联系的研究大学的攻击。


    ## 反指控与知识产权盗取


    另一个知识产权盗取的指控和实际案例与地缘政治网络及经济战争紧密结合的例子，是中国电信公司华为（Huawei）近期对美国提出的反指控，以及一起涉及中国公司的专利专利窃取案。华为对美国政府提出指控，称
    `FBI` 曾访问华为员工的家中试图强迫他们为美国当间谍，并对华为的内部运作发动了网络攻击。这些指控在没有任何证据的情况下提出的，但背景是美国政府试图阻止并说服用户和美国电信公司不使用华为设备且不向其出售零件，因为它们被视为安全风险。此类行动包括要求高通（Qualcomm）不销售其微芯片，以及谷歌（Google）不提供其智能手机软件。美国商务部通过将华为列入出口实体黑名单强调了这一行动。`NSA`
    在 2010 年就开始调查并实际上入侵了他们的服务器，因为他们怀疑其意图是安全威胁。这引发了美国政府最新的指控，该指控与《华尔街日报》的一份报告有关，报告称华为偷了一个葡萄牙多媒体设计师的专利。华为在声明中指出，其代表曾于
    2014 年与 `Rui Olivera` 先生会面，讨论使用其智能手机相机专利设计，但决定不使用它。2017 年，华为开发了自己的智能手机相机，`Olivera`
    先生在 2018 年声称这违反了他的在美国的专利，并威胁说如果不对侵权行为进行补偿，他将在新闻媒体上曝光华为。华为反而在美国法院提交了申请，称他们没有侵犯
    `Olivera` 先生的专利，美国官员仍在对此调查。


    ## 为大规模杀伤武器提供资金的知识产权盗取网络攻击


