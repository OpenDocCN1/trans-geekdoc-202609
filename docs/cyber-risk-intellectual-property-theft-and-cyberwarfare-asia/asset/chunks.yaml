- fmt: '

    In June 2019, PwC held an audit roundtable with the Audit Committee Chairs of
    US-listed shipping companies highlighting the need for a greater awareness of
    cybersecurity issues in shipping. One of the crucial issues highlighted at the
    roundtable was the need for a holistic, vertical team effort approach to cybersecurity
    measures including top management, board members, risk technology, legal, operations
    and auditors. This is especially needed as ships become digitised, with less manning
    and more complexity.


    The complexity lies in particular with operations technology (`OT`) and the interconnectiveness
    of `IoT`, which expands the IT surfaces of ships opening avenues for cyberattack
    that damages critical operational infrastructure. It was noted at the roundtable
    that there is a good deal of `OT` that remains unmanaged in relation to cyber-risk
    issues and it was suggested that it is essential that as a minimum course of action
    it should be understood and monitored. It was also noted that software developers
    need to create cyber-resilient software bespoke to the requirements of ships,
    which has different critical infrastructure than other industries.


    As with smart grids as mentioned in the previous chapter of this book, regulatory
    bodies and policy-makers have a role in such developments to mitigate cyberattacks.
    Awareness training for mariners was suggested as an important initiative to stop
    ships from becoming the entry point for cyber infection of allied corporate networks.
    As with `IoT`, ships could be an indirect and unsuspected way to infiltrate the
    corporate networks they are linked to, such as parent companies that hold valuable
    `IP` and personnel databases. Maritime industries have their own distinctive eco
    systems that include actual vessels, ports, parent shipping companies, supply
    chains and software designers that all require protection from cyberattack.


    `IoT`, as mentioned many times in the course of this book, is an especially complex
    cyber risk. A report commissioned by Inmarsat in 2018 noted that in the next three
    years shipowners intend to spend US$ 2.5 million on `IoT` cyber solutions. `IoT`
    solutions were to comprise the largest part of ships’ IT budgets in relation to
    adoption of new-generation technology. Japanese companies were the foremost adopters
    of `IoT` technology while Greek shipowners were found to be the most conservative.
    Of 125 respondents in the Inmarsat report, 65% were found to be using `IoT` cyber
    solutions for the purposes of monitoring fuel consumption. That percentage should
    rise to 100% by 2023.


    The `Guidelines on Cybersecurity Onboard Ships` outline a number of cyber threats
    for ships in particular. One is the activist, including the disgruntled-employee
    threat that can disrupt operational services and involve reputational loss. The
    objective can be among others, destruction or publication of sensitive data, to
    gain attention from the media or `DoS`. `IP` theft would occur in the first two
    objectives and the first and third could involve a form of cyberwarfare to obtain
    data concerning personnel for recruitment purposes by adversaries and using the
    media in a propaganda war.


    The second are criminals seeking financial gain, commercial or industrial espionage.
    The end gain would be selling and ransoming stolen data, ransoming system operability,
    organising fraudulent transportation of cargo and intelligence such as finding
    the exact location of cargo. Again, `IP` theft would be part of the first item
    and cyberwarfare part of the last item. Stealing and selling `IP` can be a lucrative
    business for cybercriminals although most criminals after pecuniary gain do not
    understand the real value of `IP`. Cybercriminals/mercenaries would use knowing
    the exact location of cargo to steal military equipment and be involved, for example,
    in the fraudulent transportation of military equipment to illegal war zones.


    The third are opportunists who carry out cyberattacks for the challenge of it.
    Their aim is to break through cyber defences and for financial gain, neither of
    which would involve readily `IP` theft or for cyberwarfare purposes as these types
    of hackers are more interested in proving themselves. The fourth are rival governments
    and state actors which act for geo-political gain and espionage. The objective
    is to gain knowledge and disrupt economies and critical infrastructure. Both `IP`
    theft and cyberwarfare are integral parts of such cyberattacks. `IP` theft can
    include naval blueprints for military technical advancement of an adversary to
    assist in gaining global dominance.


    Ports and ships are essential parts of global trade with the bulk of global trade
    being carried out through maritime activities. To use cyberattacks on ships and
    ports would be a major disruption to the global economy. The `Guidelines` make
    a distinction between two different types of cyberattacks in relation to shipping.
    One comprises an untargeted attack whereby a company or ship’s systems and data
    are one of many potential targets. The second is a targeted attack whereby the
    company or ship’s systems and data are the actual target.


    ## New cyber-risk solutions


    A new technology has been created by the Israeli cybersecurity firm `Naval Dome`
    to protect the port of Ashdod, the largest and busiest shipping port in Israel,
    which is near Tel Aviv. Named `Port Dome`, the cyber protection system will prevent
    hackers breaking into the port of Ashdod’s `OT` systems. Pilot trials have begun
    in early 2020 and are protecting from cyberattack the entire `OT` networks at
    the port including all access points and gateways, transport control systems (`VTMAS`
    – Vessel Traffic Management System /`VTS` – Vessel Traffic Service), locks and
    gates, berths, bridges, terminal cranes and storage facilities.


    Itai Sela, the CEO of `Naval Dome`, explained that `Port Dome` will provide the
    highest level of cyber defence without upgrades or changes to existing infrastructure.
    There is no training required for port of Ashdod staff and `OT` systems will be
    able to operate as they did prior to the installation of `Port Dome` with the
    only change being that hackers will not be able to carry out cyberattacks against
    the Israeli port. The chairwoman of the port of Ashdod stated:


    > With the security of the world’s ports and terminals vital to ensuring the supply
    of energy, commodities and consumer goods to market, we have partnered with `Naval
    Dome` to ensure that should a cyber event take place it does not affect the port’s
    or our customers’ operations. `Port Dome` is technological must-have for any automated
    port with network-based `OT` systems. Ashdod Port overcame the red tape many governmental
    companies deal with and is now connected to the world of innovation and technology.
    I am proud to lead the first port in Israel to have stepped up to the challenge
    bringing Ashdod Port to an advanced global standard.

