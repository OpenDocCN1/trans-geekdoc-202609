    澳大利亚与所有国家一样，正全心地投入到网络安全带来的机遇与挑战之中。在研究如何最佳应对网络攻击方面，组织、个人和政府都将其置于首要位置。澳大利亚拥有主权能力和成熟的网络安全方法，以及一个创新的生态系统，以支持公司和政府应对这种新型威胁。在新威尔士士州，拥有着世界领先的网络安全竞争优势，例如金融科技（Fin-tech）、农业科技（Ag-tech）和高技能网络安全人才。


    在一个恶意攻击者变得日益复杂、利用先进技术能力且具有全球性的领域里，需要`新的方法和思维`来应对网络安全威胁。现在的攻击正利用先进的人工智能（AI）、语音识别、社交媒体、大数据以及手机等连接设备来攻入组织和个人。需要进行性的决策，以便进行更具信息水平的投资和资源配置，从而增强防备能力和韧性。防御网络威胁的传统需要演进并以越来越快的速度实施，以跟上正在发生的先进攻击。


    `网络不仅是风险缓解策略，更是赋能因素`。传统上，网络安全被视为信息技术（IT）团队使用的风险缓解工具，旨在阻止和/或快速缓解网络泄露。这种观点和方法限制了组织更主动地使用数据并启用大数据、AI、边缘计算和自动化等新技术及范式的机会。这是企业和机构将网络作为赋能因素并创造价值，而非视为成本中心的机会。在网络泄露的发生方面，仍有超过
    70%的攻击是因为人为错误，例如打开钓鱼邮件。日益增加的是，钓鱼攻击不仅针对笔记本电脑设备，还针对手持设备。网络本质上是一个人的问题，而不是 IT 问题！`用得当的网络就能建立信任`。如果人们和企业不信任你处理的数据，他们就不会购买你的产品，你就无法做生意。


    为了建立信任，你需要一个强大的治理结构来支持网络安全倡议。为了协助解决这个问题并作为第一步，董事会成员、C 级高管以及高层政策制定者需要更好地了解其组织、城市或国家面临的网络风险。这并不意味着要成为完全的技术专家；技术专业知识由信息通信技术（ICT）和信息安全部门或外包的网络安全服务提供商承担。迫切需要改进的是从业人员与领导层之间网络安全问题的沟通与翻译。企业领导者需要牢掌握其实体的漏洞以及哪些关键资产面临风险。这将使他们能够在投资和资源配置上做出及时的战略决策，以增强其组织的韧性和保护措施；需要采用全面的方法才能获得成功。这种思维可能需要组织重组和治理，以打破部门隔垒并建立更稳健的网络安全态度。


    除了经济损失外，网络攻击带来的法律、声誉甚至物理后果可能是巨大的。领导者必须在风险、合规、法律、人力资源和传播等组织职能部门中培养更强的网络素养。需要从顶层一直到生产车间，在整个组织内部培养一种网络安全文化。新的思维可能包括部署
    AI 进行威胁检测和分析以及事件响应，以实现更有效、更高效的网络安全。与此同时，网络罪分子正以更快的速度采用新技术并为为己所用。AI、量子和身份管理等的发展要求投入更大的资金，以保持领先于恶意攻击者。。不用说，人才培养也需要资金来建立一支具有网络安全意识的人才队伍。`生态系统开发和创新伙伴关系`不仅对于应对网络安全威胁，对于发展经济发展成果也至关重要。在一个连接的世界里，将价值保留在当地并在当地创造和保留高附加值工作是至关重要的。在新威尔士州（NSW），存在一个强大且不断发展的网络生态系统，它由行业（私营公司、中小企业（SMEs）和非政府组织（NGOs））、研究、培训提供者（包括学校、职业教育）以及政府组成。这里讨论了影响今年成功和增长的`网络关键趋势`。


    ## AI 在网络攻击和防御中将发挥日益增长的作用


    AI 是获得竞争优势的新途径，但在一个互联的世界里，任何人都可以参与。以前，政府可以因为费用高昂而使用这种资源，而现在每个人都可以使用。这意味着虽然 AI
    无疑正在被研究和开发，但也容易被具有恶意意图的方利用。因此，今天的竞争不再是国家之间，而是黑客、钓鱼者、数据窃取者网络安全专家之间的竞争，后者的工作是在这些威胁造成我们伤害之前解决它们。正如
    AI 可以“学习”识别可能预示攻击尝试的巧合或行为模式，它还可以学习适应以伪装相同的行为并骗过我们的防御。这种复杂性的增加也形成了许多国家行为者（如美国、俄罗斯和中国）之间的地缘政治威胁。


    ## 东西方领先导致安全威胁增加


    互联网和在线世界是一个国际实体——在信息和思想的自由流动上相对没有国界或限制。它被设计成这样是为了利用国际合作和人才。事实上，提供幕后基础设施的公司、网络和协会是有义务遵守国家法律法规的法律实体。


    ## 政治干预日益普遍且日益复杂


    旨在操纵公众舆论的定向虚假信息活动几乎成为今天民主的一种被接受的特征。到目前为止，针对选举的网络犯罪有两种形式。第一种涉及通过社交媒体传播“假新闻”和虚假叙述——通常旨在诋毁某个候选人。第二种是针对候选人或数字选举基础设施的直接攻击。反击虚假叙述意味着建立系统（自动或手动的），通过分析内容和元数据（信息的来源以及可能创建该信息的人）来过滤掉谎言、宣传和恶意信息。


    ## 网络安全人才缺口持续扩大


    预计 2020 年，未填充的网络安全职位数量将从 2014 年的 100 万增加到澳大利亚的 350 万。这种技能短缺在这一新十年的初期可能会成为日益受关注的公共问题。我们今天在网络空间面临的威胁，从试图克隆身份进行欺诈的窃贼，到旨在改变民主进程的政治虚假信息活动，除非有足够技能的人才进入体系，否则这些威胁只会变得更加剧烈。

