- fmt: '

    One of the major ways organisations in Japan are mitigating cyber risk and attack
    whether related to IP theft or cyberwarfare is through information sharing. This
    method emphasises human communication to be organised to provide a barrier to
    hackers trying to penetrate cyber systems. The Cyber Security Council (`CSC`)
    in April 2019 explained why such an information sharing approach can be an effective
    countermeasure. They note that without rapid information sharing of the nature
    of the cyberattack including the method and countermeasures, the damage and the
    extent of the attack will proliferate across organisations. One of the greatest
    barriers to information sharing was a lack of trust between organisations and
    concerns that their reputations could be damaged through leaks of information
    confidential to companies. A significant amendment to the `Cybersecurity Act`
    in December 2018 gave rise to the `CSC` and allowed for legislation to occur that
    would make it a legal requirement to share information. It was acknowledged by
    the `CSC` that companies were affected badly by leaks in information sharing due
    to the poor handling of such information. Such leaks often led to the breaking
    of other laws, which further damaged companies. An example of this would be the
    leaking of sensitive data that could assist a company competitor gaining access
    to the results of research or IP that had not as yet been patented. The `CSC`
    decided to create compliance legislation that included an obligation of confidentiality
    when sharing information between companies. Non-compliance enshrined in law meant
    that leaks would be punished by the perpetrator to be imprisoned for up to one
    year or fines up to Yen 500,000. The obligation of information sharing was also
    subject to precise laws and regulation. In addition, a specialised organisation/agency,
    which was defined by the government ordinance, was entrusted with the running
    of the information sharing activities for the `CSC`. It was seen as imperative
    that an organisation/agency exists to coordinate the information sharing, acting
    as a contact point to give company members peace of mind.


    ## Cybersecurity Act revision


    A document from the National Information Security Center (`NISC`) provides a summary
    of the `Cybersecurity Act` revision and the structure of the `CSC`. The legislative
    Bill to amend parts of `Cybersecurity Act` includes the following


    - The `CSC` has been instituted to enable various public and private entities
    to mutually cooperate in the sharing of cybersecurity information, discussing
    and implementing of necessary countermeasures in order to ensure cybersecurity
    takes place and that Japan will be fully prepared for the Tokyo 2021 Olympic Games.

    - The first task will be the establishment of a `CSC` by the `Cyber Security Strategy
    Headquarters`, which will allow public and private entities to mutually cooperate
    in the sharing of information and discussion of required countermeasures. The
    structure of this organisation will have its Headquarters at the `NISC` and have
    offices at other specialised institutions such as national and local administrative
    organs, principal infrastructure and cyber entities, educational or research institutions,
    and among experts.

    - Confidentiality, cooperation and information sharing to the council will be
    ensured as mentioned above, which will facilitate communications with the Headquarters.
    The administrative functions of this process will be under the jurisdiction of
    the Headquarters as well. This will include communications with those in Japan
    and abroad in relating cybersecurity incidents. Parts of these administrative
    operations will coordinate with entities stipulated in government ordinances,
    which will also define in detail terms of their obligations to confidentiality
    not exceeding one year from enactment within the Bill. The `CSC` is structured
    in the following manner:


    > Cyber Security Council Headquarters (NISC and specialised institutions) Experts

    > Information on threat provided by specialised institutions will be shared strategically
    and swiftly

    > National administrative organs | Local authorities | Principal infrastructure
    entities | Cyber entities (security/system operators) | Educational institutions

    > All the above entities implementing countermeasures individually ↓

    > Facilitating to ensure cybersecurity ↓

    > Ensuring safety and security of the citizens


    - Contributing to enhance the smooth functioning of social economic systems in
    Japan.

    - The Council also cooperates with administrative organs and private sectors abroad.


    ## Challenges of information sharing


    In June 2019, over 8,000 attendants gathered at `Cyber Week 2018`, the international
    conference on cybersecurity, held at Tel Aviv University in Israel. Many of the
    speakers raised the issue of information sharing as a future challenge. Mr Dorit
    Dor, Vice President at Check Point, said about the current situtation: ‘Information
    sharing would be insignificant and meaningless unless we share attack methods
    and context. However, this is a very complex matter and many share only the outcome
    once attacks have taken place.’ In preparation for cyber physical attacks, the
    Ben Gurion International Airport developed a state-of-the-art security operation
    centre three years ago, which incorporates the capacity of real-time detection
    by utilizing AI and also integrates the management systems of both the `IT` and
    `OT` (operations technology) departments. However, information sharing has been
    kept among those agencies or institutions affiliated to the Airport and it was
    very rare to share information with those outside the Airport entity. Mr Dor noted
    that cooperation among attack prevention experts is not sufficient whilst attackers
    are thought to be using dark webs to strengthen their activity network.


    ## Outsourcing analysis


    There is one company that is attempting to achieve cooperation among those who
    are in charge of attack prevention, by utilising blockchain. `PolySwarm`, a US
    start-up, is aiming to create an outsourcing market place for malware analysis
    where security analysts from the around globe can participate freely with smart
    contracts and also get paid incentives in cryptocurrencies. The company gives
    a picture of future business in which specialists are working together to build
    an analysis engine and those related are sharing information. It also aims to
    improve the status of security specialists in order to prevent them from being
    forced to become attackers for financial reasons. This type of cooperation between
    Japanese specialists and those abroad would potentially bring a positive outcome
    such as enhanced attack prevention and resolution due to lack of cyber risk specialists.
    In terms of the use of blockchain in cybersecurity, attention must be paid to
    security countermeasures in `IoT` and digital data since blockchain offers high
    integrity and availaiblity. For example, a blockchain-based e-signature technology,
    developed by `Guardtime` in Estonia, is used to detect manipulation and tampering
    for online services provided by the government and it has proven the usefulness
    of blockchain. Although blockchain would not solve all issues, there is anticipation
    it can address some cybersecurity issues.


    ## Societal interdisciplinary involvement


    The `NCSC` in the UK has the Sociotechnical Security Group, where `R&D` has been
    carried out by focusing on ‘how society becomes involved in technology’, not on
    ‘solving issues with technology’. Experts from various fields such as socio-economy,
    psychology, computing and philosophy engage in discussions to develop the guidance
    and security tools. In the current circumstance where it is commonly said that
    cybersecurity is not just a technological issue, this type of approach exploring
    the involvement of society can provide an inkling to understanding how to engage
    with the latest technology.


    ## Real-time information sharing

