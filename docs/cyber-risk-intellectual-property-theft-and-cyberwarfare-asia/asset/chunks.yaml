    2018 年 9 月发现的一起针对万豪酒店（Marriott Hotels）连锁的黑客网络攻击中，中国情报部门收集了 5 亿名客人的个人详细信息，该事件涉及个人数据窃取、间谍活动，并与网络战和知识产权泄露有关。其他目标还包括数百万安全许可人员和健康保险公司的数据。万豪酒店连锁的入侵事件令美国政府非常担忧，因为那里是美国政府和军方人员居住的地方。万豪网络攻击表明，中国已经违背了前总统贝巴拉克·奥巴马与习近平主席在
    2015 年达成的协议。


    中国外交部发言人耿双甚至否认对万豪网络攻击一事无所知，并表示：“中国反对一切形式的网络攻击，并依法依法对其进行严厉打击。”他进一步表示：“如果提供证据，相关中国部门将根据法律进行调查。”


    对万豪电脑系统的入侵，结合其所使用的代码和模式，指向了中国情报部门，而非以商业或财务利益为目的的黑客行为。后者会对被盗的信用卡感兴趣，但不会对 3.27 亿份护照详情感兴趣，这些信息包含了个人的照片、他们访问的边境和国家。此外还包括安全许可表，其中包含财务信息以及护照持有者曾与哪些外国人见面以及去过哪里。这正是中国政府特工识别美国间谍及其交谈的中国公民所需的信息。这还将导致那些可能易于招募为中国间谍的美国人，并结合从安泰（Anthem）等健康保险公司盗取的数据，数百万美国人的旅行习惯将被暴露。


    奥巴马政府在 2016 年就已经对中国收集美国人个人数据的努力感到震惊，以至于美国外国投资委员会阻止了中国安邦保险集团（Anbang Insurance Group
    Co.）以 140 亿美元收购全球万豪酒店度假集团公司的报价。相反，万豪酒店连锁以 136 亿美元的价格购买了万豪集团。然而，到那时已经为时已晚，因为万豪的数据已被中国情报部门的黑客盗取。万豪成为了全球最大的酒店连锁，但直到
    2018 年 11 月 30 日才公开披露了这一大规模数据泄露事件。


    ### 招募外国间谍


    中国情报部门在招募外国间谍方面比其他国家的对应部门最为活跃。他们常用的招募来源之一是领英（LinkedIn），这是一个由美国人拥有的网站，旨在介绍从事相似业务或研究的人士。领英等网站受到青睐是因为中国特工可以在北京执行此类操作，例如发布虚假资料并假装成公司招聘机构。已有许多此类招募案例被报道。


    其中一个案例涉及前中央情报局（CIA）和国防情报局（DIA）员工凯文·帕特里克·马洛里（Kevin Patrick Mallory）。他因为中国做谍被判入
    20 年。联邦调查局（FBI）表示，招募马洛里发生在 2017 年 2 月，当时他回复了来自假装成智库代表的中国情报特工发送的领英消息。另一个被广泛报道的案例涉及徐延君（Yanjun
    Xu），他通过领英上的通信招募了一名通用电气航空工程师，被美国司法部指控犯经济间谍罪。


    ## Equifax 网络攻击


    2020 年 2 月 10 日周一，美国司法部（DoJ）官员发布了诉状，指控中国军方的四名成员从安信（Equifax）盗取了贸易秘密和 1.45 亿美国人的个人数据。这发生在
    2017 年，目标是美国最大的信用报告机构之一。司法部认为，这次数据窃取是由中国军方情报部门实施的，旨在更好地针对情报人员和官员设定目标。


    作为回应，吴前代表中国国防部表示，其成员对此类窃取行为不负责，并声称美国人在进行法律上的霸凌。这向司法部传递了一个信号，即奥巴马政府达成的停止为了窃取知识产权、贸易秘密和个人数据而进行网络攻击的协议不再遵守。吴先生在回应中还提到，根据爱德华·斯诺登（Edward
    Snowden）的说法——这位前国家安全局（NSA）员工在向维基解发送大量来自国家安全局的敏感邮件后逃往俄罗斯——已通过邮件泄露证实，美国也积极参与了此类间谍活动。


    Equifax 网络攻击之所以值得关注，是因为其攻击规模之大。Equifax 持有有 8.2 亿美国消费者（包括一些加拿大和英国客户）以及 9100 万家企业的数据。这项包含九项指控的诉状指控被确认为中国解放军第
    54 研究学院（中国军方的一部分）成员的中国军方黑客吴志勇、王强、徐克和刘磊盗取了贸易秘密。这包括数据编译和数据库设计，后者属于知识产权。这四名被指控的中国黑客在公司的电脑系统中停留了数周，闯入安全网络并搜寻个人数据。


    代表中国外交部发言的耿双表示，中国政府和军方从未窃取贸易秘密，并再次强调中国是美国网络攻击的受害者。然而，被盗信息从未被用于欺骗受害者的信用卡或银行账户，这通常指向像中国这样的国家行为者，他们更关注获取知识产权和为未来的网络战活动收集情报。


    尽管 Equifax 首席执行官马克·贝戈（Mark Begor）对美国执法机构重视网络犯罪并尽一切可能定位犯罪犯的行为表示感谢，但 Equifax 仍被迫向联邦贸易委员会（FTC）支付
    7 亿美元（5.41 亿英镑），原因是其未能充分保护信息系统，且未能及时通知客户。


