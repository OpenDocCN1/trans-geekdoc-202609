  trans: '

    随着与其他国家公司往来的增加，日本的供应链变得日益先进。大阪商会所的一项近期调查发现，日本只有 4% 的中小企业（SME）根据政府的网络风险风险指南实施了信息安全措施。大阪传统上是供应“商社”（`shogo
    shosha`）的中小企业主要中心，拥有针对其成员的本地类工会组织。调查还显示，大多数中小企业的数字系统允许未经授权的访问。此类泄露的一个例子是东京的一家汽车零部件制造商，它收到了汽车制造商客户的警告，称收到了来自其的受病毒感染的可疑邮件。对于客户公司而言，这家中小制造商的这可能是一次非常危险的泄露，因为后者持有有关订单的敏感信息。和其他大多数公司一样，这家中小供应商公司无力聘请定制的
    IT 管理员，因此大客户公司让供应公司访问其 IT 服务供应商，以组织有效的安全措施来解决问题。


    ## 遭受网络攻击的中小企业


    大阪商会所自 1971 年起就设有 IT 相关部门，并在 2018 年 9 月选取了 30 家中小企业进行监控。该调查评估了在三个月时间范围内与其办公室的外部通信，发现所有公司都收到了与网络攻击相关的可疑邮件。尽管所有监控的中小企业都遭受了某种形式的网络攻击，但没有一家真正理解攻击的完整全貌。由于中小企业实施信息安全措施的延迟，对供应链产生潜在影响的担忧日益增加。根据大阪商会的这项调查，只有
    4% 的中小企业实施了符合公共机构颁发指南的措施。随着供应链变得日益先进，大公司通过中小企业向国外泄露贸易秘密的风险日益增加。东京的那家汽车零部件制造商收到了其委托人（一家汽车制造商）的警告，称他们收到了来自其的可疑邮件。事实证明，该制造商的电脑被感染了病毒，随后影响了该大型汽车制造商。该制造商一直在处理来自汽车制造商的订单相关数据。由于这家中小企业没有专门负责
    IT 的人员，他们访问了汽车制造商指定的 IT 公司来解决该问题，并建立了此前不存在的安全措施。东京软件检测提供商 Digital Hearts 安全业务部的大岛（Mr
    Ooshiba）对此情况表示：“他们的目标是通过那些对网络攻击准备不足的中小企业，窃取大型汽车制造商制造的汽车设计图纸。”无论大型汽车制造商如何努力实施应对措施，如果这些承包商仍然对网络攻击脆弱，那么与他们共享的重要信息将面临风险。⁵
    上述评估得到了戴尔日本和 EMC 日本在 2017–2018 年进行的另一项调查的支持，该调查显示只有 4% 的日本中小企业采用了信息处理推进机构（IPA）的安全措施。戴尔日本在
    2018 年 12 月至 2019 年 12 月进行的一项研究显示，只有 38% 的中小企业拥有一名定制 IT 人员，而 19% 没有专门的 IT 人员。2017
    年，IPA 对涉及供应链的网络安全风险的大公司进行了 1,249 次访谈。他们发现，只有 47% 的公司了解与其没有直接接触的分包商或受托人的网络安全措施。因此，外包产生了大型公司难以追踪的进一步层次的风险。IPA
    发布了一份名为“2019 年信息安全业务十大重大威胁”的声明，显示供应链网络风险首次位列第四。国内网络风险并不意味着是供应链攻击的最大风险。海外黑客（无论是个人还是国家行为者）通过钓鱼邮件进行网络攻击，以感染未采取严密应对措施的供应链中小企业。情况非常严重，许多公共机构正努力研究以查明泄露的范围和性质。经济贸易省、IPA
    以及上述的 Digital Hearts 将对宫崎、福岛和岩手县的 100–200 家公司进行有关网络攻击损害的调查。2020 年 2 月，在这些县设立了专用设备，将利用
    AI 对通信进行持续监控和持续分析。如果泄露需要访问，还将从 Digital Hearts 派遣技术人员。来自 Digital Hearts 的安全顾问宫崎先生（Mr
    Miyazaki）将尝试寻找对于受调查的中小企业可以接受且负担得起的服务价格。日本一直向美国和欧洲寻求经验，例如在美国，政府管理部门已警告那些希望加入国防采购的公司，他们必须具备网络安全应对措施。因此，IPA
    的横滨直人（Mr Naota Yokohama）先生最近也警告说，任何没有足够应对措施的日本公司都被从供应链列表中移除。横滨先生指出，一旦发生泄露（这将不可避免地影响多家公司），责任公司将被发现对泄露承担责任。他认为业务合同应当明确这一点，但补充了一个前提，即许多公司在业务合同中甚至没有关于网络攻击和风险的规定。在
    IPA 最近的一项关于外包的调查中，80% 的公司受访者回答说其业务合同未规定谁对网络攻击的新威胁负责。促进供应链公司采取安全应对措施的最新动态包括经济贸易省促进有关如何定义责任范围的讨论。例如，合同可以包含一份职责分配表，事先明确由委托人还是受托人维护安全的责任。法律现在要求在业务合同中具备网络应对措施的意识。⁶


    ## 防止网络攻击


    ## 信息共享

