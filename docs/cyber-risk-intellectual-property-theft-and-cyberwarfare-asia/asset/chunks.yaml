    For the first time cyber risk has become the main peril judged by companies worldwide
    according to the `Allianz Risk Barometer 2020`. In the `Ninth Allianz Risk Barometer`,
    39% of respondents for the first time viewed cyber incidents as the number one
    business risk, relegating the usual top business peril of `BI` to second place
    with 37% of respondents. Given the growing reliance of companies on IT and data,
    awareness has been increasing in recent years of cyber threat through numerous
    cyber incidents. Just seven years ago cyber risk ranked 15th among `6%` of respondents.
    The survey incorporates the views of 2,718 experts including CEOs, risk managers,
    brokers and insurance experts. Other than cyber risk, the top concerns that have
    gained prominence in the 2020 survey include changes in regulation and legislation
    at number three with 27% and climate change at number seven with 17% of respondents.
    Joachim Muller, the CEO of `AGCS`, noted that the `2020 Barometer` pointed to
    the fact that cyber risk and those risks associated with climate change are the
    most significant threats to global business. He stated:


    > Of course, there are many other damage and disruption scenarios to contend with,
    but if corporate boards and risk managers fail to address cyber and climate change
    risks this will likely have a critical impact on their companies’ operational
    performance, financial results and reputation with key stakeholders. Preparing
    and planning for cyber and climate change risks is both a matter of competitive
    advantage and business resilience in the era of digitalization and global warming.


    Cyber risk is viewed not only as the top risk globally but also among the three
    most important risks in countries such as Austria, Belgium, France, India, South
    Africa, South Korea, Spain, Sweden, Switzerland, the UK and the US. The rate of
    data breaches is increasing with ransomware and spoofing being among the most
    common cyberattacks. In conjunction with the frequency of cyberattacks comes privacy-related
    fines as mentioned in relation to `GDPR` above and to increased litigation. A
    large data breach that involves over 1 million compromised records costs on average
    `US$ 42 million`, which is up 8% year on year. As mentioned above, the cause of
    many cyber incidents are related to human error. Often hackers are given entry
    into the computer systems of companies through ignorance, carelessness or in some
    cases employee grudges. Marek Stanislawski, Deputy Head of `AGCS` noted: ‘Many
    incidents are the results of human error and can be mitigated by staff awareness
    trainings which are not yet a routine practice across companies.’


    ## Business interruption


    After seven years, `BI`, is no longer at the top of company priorities, but in
    second place it still constitutes a great concern according to the `Allianz Barometer`.
    In fact, as noticed in this book, `BI` risk has expanded and diversified. With
    cyberwarfare and physical damage to infrastructure occurring more frequently through
    cyberattack mechanisms, `BI` has become more complex and profound. Raymond Hogendoorn,
    Global Head of Property and Engineering Claims at `AGCS`, says:


    > Digital supply chains and platforms today allow for full transparency and traceability
    of goods but a fire at a data center, a technical glitch or a hack could bring
    large BI losses for multiple companies that all rely and share the same system
    and which cannot switch back to manual processes.


    State-supported terrorism such as `ISIS`, rogue state missile damage such as from
    North Korea, which is missile testing once again in March 2020, to cyberattacks
    on power grids that make them unworkable all feed `BI`. Insurance underwriters
    are being required to expand their definition and cover for cyber risk. Changes
    in regulation and legislation ranked third and much of the risk is related directly
    to trade war disputes as between China and the US. This type of risk is directly
    related to `IP` and trade secret theft. In 2019 about 1,300 trade barriers were
    initiated. As it becomes increasingly part of geo-political influence and rivalry
    between states, cyberattack in general and cyberwarfare will grow in importance
    as insurable risks. New regulatory changes such as those inspired by climate change
    will accelerate the need for new definitions of cyber risk. Climate change is
    in the top three business risks for the Asia-Pacific region. Businesses are increasingly
    worried about physical damage caused by climate change. In the `Allianz Risk Barometer`
    49% of respondents expressed such concerns. Extensive flooding, droughts that
    cause fire damage and fierce storms all cause damage and pose threats to factories,
    corporate physical assets and supply chains. Operational disruptions that lead
    to relocation of facilities all constitute greater risk. Litigation is increasing
    in relation to carbon issues, especially in the US, which complicates insurance
    underwriting and places greater pressure on the role of risk managers. Cyber-risk
    assessment is so important to insurance underwriters because cyber threat and
    attack are increasingly causing the risk and damage for insurance claims. It is
    also important for insurers in general as they are becoming the target of hackers.
    US insurer `Chubb`, which is a major player in the cyber insurance market, seems
    to have been the target of a ransomware attack.


    ## Future issues for cyber insurance


    ### Standardisation of policy wording


    A present and future challenge to the assessment of the outcome to such scenarios
    is the standardisation of policy wordings. A danger to both such standardisation
    and assessing such scenarios is not having clear, robust exclusions and also ambiguity
    of wording, which allows for many different interpretations. The author of this
    book, when having an `IUA`-supported book launch of her `Managing Cyber Risk in
    the Financial Sector` book in 2016, noted in her presentation and in her book
    that a lack of rigorous use of standardised language only leads to unsatisfactory
    cyber-risk underwriting as in the end neither the insurers nor the insureds understand
    fully for what they are being covered. This is especially the case in cyber `IP`
    theft where the cyber risk is complicated by the sophistication of valuing the
    worth of `IP` and in many cases the theft of trade secrets.


    ## Silent cyber vs affirmative

