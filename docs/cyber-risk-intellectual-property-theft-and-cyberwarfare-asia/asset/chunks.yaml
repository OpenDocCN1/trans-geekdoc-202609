    Ships in the maritime sector are increasingly becoming victims of cyberattacks
    related to both IP theft and cyberwarfare. Shipping is the lifeblood of the global
    economy dominating trade routes all nations that engage in commerce Ships are
    also becoming increasingly digitised using the latest IT to store data new technologies
    and advanced GPS. Therefore, it has become easier for hackers, whether state actors,
    pirates, military intelligence or cybercriminals, to attack the shipping industry
    digitally. The maritime sector by its nature holds many companies in its supply
    chain which allows hackers to enter through the backdoor and exploit IoT systems.
    Captain Ozgur Dogan Gunes a Turkish Master Mariner with a software development
    background who is based in hacked into two Hong Kong vessels in minutes Gunes
    obtained the password and all the data he could gather from the ships he stated
    that small to medium bulk carriers were sent courtesy call from him explaining
    how unready they were and open to reputational and operational loss if discovered
    by others. Gunes noted that both shipowners had outsourced their IT to the same
    third party which left wide gaps in their basic cybersecurity systems. A survey
    of 6,000 active seafarers in March 2018 by the consultancy company Futurenautics
    revealed that 47% of the respondents had sailed on ships that had been victims
    of cyberattacks, and only 15% of them had any cybersecurity training. Surprisingly,
    just 33% of respondents stated that the last shipping company they worked for
    had a policy to regularly change onboard while 18% noted that the company last
    worked for had a policy to change default equipment onboard.¹](#ch17.xhtml#en121)


    A report in January 2020 from PriceWaterhouseCoopers (PwC) highlighted the fact
    that as the shipping industry becomes more interconnected (like the IoT) it needs
    a plan to respond to cyber events in a proportionate and measured way. PwC further
    suggested that members of the board should always make security diligence their
    primary concern when acquiring new software or businesses. Ken Munro of the cybersecurity
    firm Pan Test Partners suggested that hackers are attracted to sectors with weakest
    security. What is the point of hackers developing expensive sophisticated tools
    to carry out cyberattacks on banks if they can just use an XP Windows programme
    to obtain the same financial rewards through obtaining personnel data to hold
    their victims to ransom? In a poll in October 2018 of Lloyd’s List readers only
    6% of the maritime industry felt confident it could deal with a cyberattack. This
    poll came shortly before a major survey conducted by the Copenhagen-based trade
    association Global Maritime Forum, insurer Marsh and the International Union of
    Marine Insurance as part of its Global Maritime Issues Monitor 2018 report. This
    study which was based on the research of senior maritime stakeholders from over
    50 countries found that cyberattacks and data theft were the weak links in the
    maritime industry. Cybersecurity was regarded as the most pressing for shipping
    of 17 global issues highlighted.


    Compared to aerospace and aviation industries, the International Maritime Organization
    (IMO) was late in viewing cybersecurity as a pressing need for the maritime sector.
    The IMO in 2016 issued interim guidelines on ‘Maritime cyber risk management’
    but has since chosen to amend its general security codes the International Ship
    and Port Facility Security Code and International Security Management Code to
    include amendments on cybersecurity but not new guidelines. These will not be
    enforced until 1 January 2021. This has left BIMCO (Baltic and International Maritime
    Council) and the US Coast Guard, for example to cover maritime cybersecurity issues
    which are outlined in this chapter. The June 2017 NotPetya cyberattack was the
    one that increasingly focused the attention of the maritime industry on being
    prepared through countermeasures to cyberattack. Danish shipping company Maersk
    lost between US$250 million and US$300 million because of this brutal cyber hacking
    that closed down IT systems across multiple sites and businesses. Luckily for
    the maritime industry, shipping companies did not rush and spend millions on cyber
    solutions without carefully assessing the vulnerabilities. Below are outlined
    a number of vulnerabilities and solutions undertaken by shipowners and port owners.
    John Boles, the former head of the FBI’s global cyber operations and investigations
    division and currently director of global consultancy Ankara, noted that the lack
    of regulatory pressure in the international maritime sector has given a false
    sense of security. Like in the banking and power grid sectors, it is the level
    of lack of information sharing and the under-reporting of cyberattacks that he
    finds of greatest concern. However, as in other sectors, those owners of shipping
    companies and ports have the tendency to believe their reputation will be damaged
    if they are found to be victims of cyberattack, which will undermine clients’
    trust in them.[²](#ch17.xhtml#en122)

