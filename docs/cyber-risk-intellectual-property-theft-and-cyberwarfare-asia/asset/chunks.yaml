- fmt: "\nWith the COVID-19 pandemic raging and insureds clamouring for cover, insurance\
    \ companies are concerned that they will become the focus of public backlash –\
    \ the fate that befell the banking community after the 2008 financial crisis.\
    \ The message from many insurance companies that they will not pay out for lost\
    \ business or abandoned travel costs is viewed as a lack of empathy with problems\
    \ insureds face when compared to other business sectors such as banks, which are\
    \ offering mortgage ‘holidays’. By comparison, insurance companies are seen as\
    \ greedy as they face an avalanche of complaints from those insureds who find\
    \ they are not covered for critical illness, travel disruption and `BI` because\
    \ of cyberattacks. Insurers will not pay out for `BI` because most companies buy\
    \ for day-to-day risks such as flood and fire. Insurers are in difficulties themselves\
    \ as policies did not price in pandemics so they have not been able to create\
    \ reserves to be able to pay out. Executives have stated that they are trying\
    \ to assist customers through policy payment holidays and advice giving but acknowledge\
    \ that creating policies to cover the risk of such devastating pandemics are beyond\
    \ the scope of any domestic insurer. As the fallout grows from COVID-19 cyberattacks\
    \ mentioned above and the global pressures of the pandemic, the insurance industry\
    \ may also have to prepare for cyberwarfare.\n\nNotes [1](#ch18.xhtml#fnen142)See\
    \ Ruth Taplin, *Managing Cyber Risk in the Financial Services: Lessons from Asia,\
    \ Europe, and USA*, Abingdon: Routledge, 2016. [2](#ch18.xhtml#fnen143)‘Ransomware\
