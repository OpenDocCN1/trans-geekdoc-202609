    海运部门的船舶日益成为与知识产权盗窃和网络战争相关的网络攻击的受害者。航运是全球经济的命脉，主导着所有参与贸易国家的贸易路线。船舶也正变得日益数字化，利用最新的
    IT 技术存储数据、使用新技术以及先进的 GPS。因此，对于黑客（无论是国家行为者、海盗、军事情报还是网络犯罪分子）来说，通过数字手段攻击航运业变得更容易了。海运部门的性质决定了其供应链包含许多公司，这使得黑客可以通过后门进入并利用
    IoT 系统。奥兹古尔·多根·古内什斯（Ozgur Dogan Gunes）是一位具有软件开发背景的土耳其高级船员，他在几分钟内就入侵了两艘香港船舶。古内什斯获取了密码以及能从船上收集到的所有数据。他表示，他向中中小型散货船发送了“礼性访问”，解释了他们准备得多么不足，如果被他人发现，将面临声誉和运营损失。古内什斯注意到，两家船主都将他们的
    IT 外包给了同一个第三方，这导致他们的基础网络安全系统存在巨大漏洞。咨询公司 Futurenautics 在 2018 年 3 月对 6,000 名活跃海员进行的调查显示，47%
    的受访者曾乘坐过遭受网络攻击的船舶，而只有 15% 的人接受过任何网络安全培训。惊讶的是，只有 33% 的受访者表示他们上一个工作的航运公司有定期更换车载设备的政策，而
    18% 的人指出他们最后工作的公司有更换船上默认设备的政策。¹


    普华道会计（PwC）在 2020 年 1 月的一份报告强调，随着航运业变得更加互联（如物联网），它需要一个计划来以比例和审慎的方式应对网络事件。普华道进一步建议，董事会成员在收购新软件或业务时应始终将安全尽职调查作为首要考虑。网络安全公司
    Pan Test Partners 的 Ken Munro 建议，黑客会被安全性最薄弱的部门所吸引。如果他们可以使用 XP Windows 程序通过获取人员数据并勒索受害者来获得同样的财务报酬，那么黑客开发昂贵复杂的工具来对银行进行网络攻击有什么意义呢？在
    2018 年 10 月对《劳氏日报》（Lloyd’s List）读者的调查中，只有 6% 的海运业人士对自己能够应对网络攻击充满信心。这项调查在此之前，位于哥本哈根的贸易协会全球海运论坛（Global
    Maritime Forum）、保险公司马士（Marsh）和国际保险协会作为《2018 年全球海运问题监测》报告的一部分进行了一项重大调查。该研究基于来自
    50 多个国家高级海运利益相关者的研究，发现网络攻击和数据盗窃是海运业的薄弱环节。在强调的 17 个全球问题中，网络安全被认为是航运业最迫切的问题。


    与航空航天工业相比，国际海事组织（IMO）在将网络安全视为海运部门的迫切需求方面为迟了。IMO 在 2016 年发布了“海事网络风险管理”的临时指南，但此后选择修改其通用安全规则——《国际船舶和港口设施安全规则》和《国际安全管理规则》，以包含有关网络安全的修订，而不是新的指南。这些规定直到
    2021 年 1 月 1 日才会生效。这导致例如 BIMCO（波罗及国际海运协会）和美国海岸卫队不得不涵盖本章概述的海事网络安全问题。2017 年 6 月的
    NotPetya 网络攻击日益使海运业关注如何通过反制措施对网络攻击做好准备。丹麦航运公司马士基（Maersk）由于这次残酷的网络黑客攻击损失了 2.5 亿至
    3 亿美元，这次攻击关闭了多个站点和业务的 IT 系统。对于海运业来说，庆幸的是，航运公司没有在没有仔细评估漏洞的情况下匆忙花费数百万购买网络解决方案。以下概述了船主和港口主采取的一些漏洞和解决方案。John
    Boles（前 FBI 全球网络行动和调查部门主管，现任全球咨询公司 Ankara 董事）指出，国际海运部门缺乏监管压力产生了一种虚假的安全感。与银行和电网部门一样，他发现最担心的是信息共享缺失以及网络攻击报告过少。然而，正如其他行业一样，那些航运公司和港口主倾向于认为，如果发现他们是网络攻击的受害者，他们的声誉将会受损，这将损害客户对他们的信任。²


