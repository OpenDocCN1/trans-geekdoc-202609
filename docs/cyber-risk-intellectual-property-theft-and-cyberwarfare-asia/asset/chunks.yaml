  raw: "The NISC will be in charge of the administrative office of the CSC and it\
    \ is planned that parts of administrative tasks will be commissioned to JPCERT/CC\
    \ (Japan Computer Emergency Response Team /Coordination Center). To achieve real-time\
    \ information sharing, the Council will be coordinated through the system, not\
    \ a physical meeting. (This is applicable to the general meeting and operational\
    \ committee.) JPCERT/CC (a system to provide early-warning information) is currently\
    \ developing CISTA (Collective Intelligent Agents for Trusted Advocates), by collecting\
    \ a wide range of information, and then sending out notification for early-stage\
    \ warnings. The Council’s system will be based on CISTA, but adds necessary features\
    \ such as a portal website where information sharing is taking place in real time\
    \ among members. To alleviate burdens on its members, the CSC will strengthen\
    \ cooperation with existing various information sharing systems. The acceptance\
    \ of information at the Council will be dealt as part of any type of framework\
    \ in which a member has already participated. However, in the event that members\
    \ request direct submission of information to the Council, where strict confidentiality\
    \ is applied, such matters will be handled directly in the future. \n\n## Structure\
    \ of the CSC\n\nThe CSC cybersecurity information structure and aims can be seen\
    \ in [Tables 3.1](#ch12.xhtml#table-wrap-001), [3.2](#ch12.xhtml#table-wrap-002)\
    \ and [3.3](#ch12.xhtml#table-wrap-003). Table 3.1 Structure for information sharing\
    \ \n\n| *Concerns and uncertainty of vendors*  ||  || *Measures taken with operational\
    \ rules (T&Cs)*  |\n\n| --- | --- | --- |\n\n| A wish to disclose the content\
    \ of information and consultation on a voluntary basis only to those trusted \
    \ || →  || Those who provide information can set up a limit on the extent of information\
    \ sharing. Such limits will not be changed without consent  |\n\n| A consultation\
    \ on a voluntary basis may result in punishment by related authorities  || → \
    \ || Those who provide information could exclude related authorities from the\
    \ extent of information sharing recipients  |\n\n| More information may be requested\
    \ than expected due to potential application of obligation for information provision\
