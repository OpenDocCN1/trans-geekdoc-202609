    对于智能电网而言，最重要的网络安全解决方案之一是在当其他能源提供商遭受网络攻击时进行信息共享。在乌克兰，这种情况相对简单，因为美国与乌克兰作为地缘政治盟友保持着紧密的关系。美国情报机构需要确切了解在这场首次由网络攻击导致的大规模停电事件中，攻击攻击是如何实施的。美国之所以特别需要这些知识，是因为出于各种原因，黑客正越来越多地开发新方法来攻击关键基础设施，例如水电大坝、交通系统、化学工厂或石油炼油厂。随着公用事业开始使用连接到物联网（IoT）和
    BYOD（自带设备）的智能电网，这导致了更大的脆弱性，网络攻击随之增加。


    解决方案和应对措施与银行业相似。正如本书作者之前的著作《金融领域网络风险管理》（`Managing Cyber Risk in the Financial
    Sector`）中所述的，为了对抗网络攻击并降低风险，银行需要像专利池一样共享信息，以创建其他公司共同享的解决方案。实现此点的障碍在于，人们不愿让公众知道他们托付财务的信赖银行竟然允许黑客盗取个人数据、知识产权或实际储蓄。


    电网的运行方式也类似，如果它们允许黑客进入，黑客不仅会盗取个人数据，还会导致停电以及引发的一系列问题——从冷冻食物食物变质到因光线不足导致的盗窃，这会导致失去信任。与银行业一样，解决方案是一个受信赖的第三方，能够机密地收集网络攻击事件及其性质。在美国、日本和欧洲，已经建立了此类非党派机构，在竞争对手之间收集并共享有关网络攻击性质的信息。


    例如，在欧洲，银行业协助建立了金融服务信息共享与分析中心（`FS-ISAC`），其中包括执法机构、欧洲刑警组织（Europol）和欧洲中央银行在内的代表。有关网络攻击的信息会进行共享，例如攻击的性质、其对金融社区的影响、新的脆弱性、技术趋势和威胁、网络攻击事件以及案例研究。可以建立这样一个伞组织，以有效保护智能电网免网络攻击的侵害。


    在美国奥巴马政府时期，建立了一个网络威胁情报整合中心，以促进公共部门和私营部门之间的信息共享。这鼓励了政府机构与私营公司之间加强合作，实时共享信息，以警示所有人关于入侵政府机构、学术界和公司所使用的最新工具。这种合作允许用标准化的语言产生及时的网络安全信息，既能突出潜在的网络攻击，又能破坏黑客的经济策略。


    黑客通过对多个受害者实施类似的攻击来利用规模效应以获得最高回报。实时信息共享可以立即通知用户社区，以便他们采取行动防止或破坏网络攻击。这将防止黑客使用相同方法进行多次突破，从而推高了所有人网络安全措施的成本。


    AI 的发展及其在保护智能电网免受网络攻击方面的应用将允许 AI 学习机器缓解已知的网络攻击，让专家有专业的时间处理黑客的新型未知的攻击形式。在降低网络攻击缓解成本的同时，网络安全将得到增强。这将允许已知（例如恶意软件）和网络攻击的自动化，通过自动机器进行拦截，从而消除导致许多网络攻击成功的人为错误。


    ### 注释

    1. `欧洲电网组织确认“网络侵入”`, Erin Ayers, *Advisen Cyber Digest* (2020 年 3 月 12 日)。

    2. 参阅 Ruth Taplin (ed.), `Managing Cyber Risk in the Financial Sector: Lessons
    from Asia, Europe and the USA`, Abingdon: Routledge, 2016.

    3. 本章的部分材料源自 Jacob Mendel 于 2018 年 6 月 1 日日在波兰波兹南经济与商务大学国际经济与商务学院完成的博士论文。本书作者已获得
    Jacob Mendel 及其主导师 Tadeusz Kowalski 教授的许可从该博士论文中引用材料。该博士论文的题目为《智能电网网络安全的经济视角》（`The
    economic perspective on the smart grid cybersecurity`）。本章材料还取自 Jacob Mendel 与其在波兹南大学的另一位博士导师
    Piotr Lis 教授在《经济与商业评论》（`EBR`）上撰写的一篇文章。请参阅 EBR 文章：`www.ebr.edu.pl/pub/2019_2_24.pdf`。


