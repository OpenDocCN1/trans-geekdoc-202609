    # 6 United States


    In the summer of 2019, computer systems controlled by the Defense Information
    Systems Agency (DISA), part of the US DoD, were hacked stealing the personal data
    of 200,000 personnel including names and security numbers. There are 8,000 military
    and civilian employees at the DISA but it also handles data for other individuals.
    Ironically, this was the White House agency in charge of secure communications
    for military communications including presidential calls by mobile and telephone.
    Even more alarming for the agency and personnel is that it includes in its remit
    responsibility for military cybersecurity and organises communications in combat
    zones. On its website, the DISA states its mission as being ‘… the trusted provider
    to connect and protect the war fighter in cyber-space’. The DoD would not disclose
    who were the perpetrators of the cyberattacks but confirmed it moved swiftly to
    fix and thwart further such hacks. Letters were sent to those whose data were
    breached by the attacks in February 2020 offering to assist in mitigating any
    damage and free credit-monitoring services.[¹]


    ## Who is cyberattacking the US?


    There are a number of geo-political rivals that are responsible for cyberattacks
    that target the personal data of government and military officials, as mentioned
    in `Chapter Five` on China, to recruit them for espionage, spying and cyberwarfare
    purposes. Other than Russia and China, Iran and North Korea are at the forefront
    of such attacks. In a possible attempt to derail talks between North Korean leader
    Kim Jong-un and President Trump and his advisors in December 2018, the South Korean
    Unification Ministry reported a malicious programme installed on a desktop computer
    at a resettlement centre for North Korean defectors in North Gyeongsang Province.
    This is one of 25 resettlement centres that are run to assist some 32,000 North
    Korean defectors to adjust to life in South Korea. At least 997 of the defectors
    whose details were stolen were notified. This caused anxiety for them as they
    did not know if their families in North Korea would be attacked. North Korea had
    no capability to find out who are the defectors from their country but this would
    assist them. It could also assist in re-capturing them and interrogating them
    about South Korea, a military ally of the US. An expert on North Korean cyberwarfare,
    Simon Choi, thought that this was the work of a North Korean government group
    of hackers who try to find the names and details of North Korean defectors and
    noted that another resettlement centre had been hacked the previous year.[²] Similar
    to China’s breaking of UN sanctions such as `Huawei`’s breach of sanctions against
    Iran and using `HSBC` as a conduit for money laundering from illegal earnings
    in Iran without the bank’s knowledge, North Korea has been engaged in sanctions
    busting. In defiance of sanctions placed on it by the US and UN, North Korea has
    used cyberspace to launch sophisticated cyberattacks on financial institutions
    in the US and through cryptocurrency exchanges to generate income. An expert UN
    panel that contributed to a report on North Korean breaking of sanctions found
    that through cyber means government hackers illegally forced transfers from financial
    institutions and cryptocurrency exchanges, laundering the proceeds to generate
    income to evade sanctions. The use of cryptocurrencies is more difficult to detect
    and trace as with the use of traditional banks and is the main motive for North
    Korea’s large-scale cyberattacks on cryptocurrency exchanges such as `Bitcoin`.[³]


    ## Money laundering


    Two Chinese nationals who were working for the notorious North Korean hacking
    organisation called the `Lazarus Group`, laundered US$ 100 million of stolen crypto-currency.
    A portion of US$ 1.4 million of it was laundered by selling `Bitcoin` for pre-paid
    Apple iTunes gift cards. US officials allege that `Tian Yinyin` and `Li Jiadong`
    acted as money mules for the `Lazarus Group`, which was responsible for the 2017
    `WannaCry` global cyberattack and a 2018 hack of an unnamed cryptocurrency exchange.
    According to the indictment, the pair in 2018 hacked into a virtual currency exchange
    stealing currency worth US$ 250 million. The funds were laundered through hundreds
    of automated cryptocurrency transactions to avoid being caught by any law enforcers.
    It was alleged that a portion of the laundered funds were used by the North Korean
    government to improve its cyber infrastructure to steal funds from the financial
    industry in the US.[⁴] These sanction-busting cyberattacks for illegal financial
    gain are linked to cyberwarfare for the illicit monies are used in large part
    to fund nuclear missile programs that the US and UN are trying to stop. Despite
    Kim Jong-un entering years of negotiations with the US government to halt production
    and testing of nuclear ballistic missiles, he and his father and grandfather who
    preceded him never had any genuine intention of curbing their nuclear intentions.[⁵]


    ## Ransomware


    Ransomware attacks are the most prevalent of criminal attacks that not only raise
    inordinate amounts of illegal funds for cybercriminals but also disrupt the operations
    of the governmental institutions and companies attacked according to the FBI.
    These attacks are so effective because they use cryptocurrencies and messaging
    platforms that are so difficult to trace, allowing them to communicate and transact
    with their victims anonymously. The other problem is that the hackers live outside
    the jurisdiction of American law so even when US law enforcement finds the cybercriminals
    and indicts them they are never subject to extradition. The majority of these
    cybercriminals derive from North Korea, Iran and Russia where the US has no extradition
    treaties and whose governments either initiate the hacks or share in the breached
    files, which are full of useful information such as personal data of government
    and military officials in the US, IP, trade secrets and military information used
    for cyberwarfare purposes.[⁶]


    ## Cyberattacks on elections


    In July 2019, Tom Burt explained to those attending the Aspen Security Conference
    in Colorado that Microsoft had evidence that Russian, Iranian and North Korean
    hackers were the most active nations conducting cyberattacks. Mr Burt, Microsoft
    Corporate Vice-President, further narrowed the focus of the cyberattacks to the
    three countries targeting NGOs and think-tanks that work with US political campaigns.
    In the case of Iran, a report by Microsoft in October 2019 stated that hackers
    supported by the government of Iran made over 2,700 hacking attacks to identify
    the e-mail accounts of current and former US government officials, journalists
    who have covered US political campaigns and accounts that have been associated
    with one major US presidential campaign. Hackers further attacked 241 accounts
    and were successful in four cases when they used information concerning their
    victims’ profiles online to discover their passwords. Many of these politically
    motivated cyberattacks are using the same techniques that the Russians had used
    in the US elections of 2016.[⁷]


    ## Cyberwarfare with Iran

