- fmt: '

    It is not always the Russian government that hacks into international systems.
    There are highly trained Russians conversant with digital technology who, unable
    to find work with government agencies, work on their own building networks to
    defraud companies and individuals globally driven by pecuniary concerns. If IP
    theft delivers them a worthwhile return on their time, they will steal `IP`. If
    working as cyber mercenaries involves easy monetary gain, they will hire themselves
    out to the highest bidder. This is potentially how Russian hackers/mercenaries
    could contribute to cyberwarfare in the future.


    A criminal cybercrime gang called `GozNym` was started in 2007 by five Russian
    hackers. The name is a hybrid of two pieces of malware: `Gozi` and `Nymaim`. The
    first piece acts as a dropper software that enters or drops into a computer system,
    installing malware. Until 2015 it was mainly used to install ransomware. The other
    piece of this hybrid used a variety of techniques over the years to mine financial
    data globally, although largely in the US. The Russian cybercriminals used gang
    members in the US, Germany, Bulgaria, Moldova, Georgia and the Ukraine to steal
    from bank accounts, money launder and defraud banks.


    In all, before they were caught and prosecuted, they stole US$ 100 million (£77
    million) from more than 40,000 victims including international corporations, SMEs,
    law firms and NGOs. In a cross-border cooperation between Europol and law-enforcement
    agencies in the US, all but the initial five Russian hackers were caught and tried
    with the international gang dismantled. The five Russian nationals who were not
    apprehended were found to be making money and spreading the cyber mechanisms of
    the crime through leasing `GozNym` to other cybercriminals worldwide. Russian
    cybercriminals seem able to slip back into their country and disappear more effectively
    than in many other countries. Yet, they do not seem to have the protection of
    the Kremlin and non-Russian members of the gang can be caught as in this example.
    It is quite possible they will re-emerge in a different guise, maybe as cyberwarfare
    mercenaries.


    ## Geo-political interference


    The Russian government and its agencies are proving much more difficult to catch
    than their home-grown cybercriminals as they operate through deceit and denial.
    In October 2019, the `NSA` and its British counterpart issued a warning that the
    Russians have returned and with an increased stealth. Russian government intelligence
    agencies, they noted, had been hacking into the network of high-level Iranian
    intelligence agency units attacking governments and private companies in Britain
    and the Middle East attempting to create havoc by having Teheran blamed.


    For those state and federal administrative officials who are tasked with safeguarding
    the 2020 US elections, it is becoming clear that a Russian-directed election cyberwar
    will be different than the one carried out in 2016. Russian stealth is increasing
    and the Russians attaching themselves to Iranian networks is a sign of the deceitful
    tactics of hacking and disinformation to come in the US 2020 elections. The Russian
    government can easily blame another country for its own interference, much like
    attempting to blame Ukraine for Russia’s election meddling.


    US defences against cyberattack have improved hugely since the 2016 cyberwar waged
    by Russia. `Facebook`, a prime carrier of disinformation is now, as mentioned
    above, much more aware of tactics such as fake ads being paid for in rubles or
    calls for California, the world’s sixth largest economy, to secede from the union,
    with this movements’ headquarters being based in Moscow. `Facebook` is searching
    for and deleting such disinformation. Likewise, officials who oversee voting have
    been familiarising themselves with how cyberattacks are carried out through malware
    and bots, for example. In addition, military officials, as mentioned above, are
    considering engaging in information cyberwarfare and even in retaliating by hacking
    into senior Russian officials’ accounts. Yet, many of the cyber vulnerabilities
    that US elections faced in 2016 not only remain but also have become stealthier.
    A major issue that has changed, however, is that in 2020 Russian disinformation
    and troll cyberattacks are no longer a new surprise that American political parties
    and voting officials had no idea were imminent.


    A number of problems remain that affected the election in 2016. One is that political
    campaigns are unwilling to spend the amounts needed for effective cyber defences.
    The second is that social media, the messages emanating from the White House and
    certain news channels confuse the electorate with misleading stories and cries
    of fake news plus the increasing inability of many voters to be able to distinguish
    between fact and reality denial. Much of social media, cult-like figures and peddlers
    of conspiracy theories blur the lines between fact and fiction. Therefore, the
    burden often falls on vigilant, well-trained election officials to detect cyberattacks
    that can disrupt full and fair access to facts about the candidates that are free
    from damaging doubts sowed by Russian- or now Iranian-backed stealth misinformation
    campaigns.


    ## Obstacles to fighting electoral cyberattack

