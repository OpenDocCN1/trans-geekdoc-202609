    \ financial industry in the US.[⁴](#ch15.xhtml#en108) These sanction-busting cyberattacks\
    \ for illegal financial gain are linked to cyberwarfare for the illicit monies\
    \ are used in large part to fund nuclear missile programmes that the US and UN\
    \ are trying to stop. Despite Kim Jong-un entering years of negotiations with\
    \ the US government to halt production and testing of nuclear ballistic missiles,\
    \ he and his father and grandfather who preceded him never had any genuine intention\
    \ of curbing their nuclear intentions.[⁵](#ch15.xhtml#en109) \n\n## Ransomware\n\
    \nRansomware attacks are the most prevalent of criminal attacks that not only\
    \ raise inordinate amounts of illegal funds for cybercriminals but also disrupt\
    \ the operations of the governmental institutions and companies attacked according\
    \ to the FBI. These attacks are so effective because they use cryptocurrencies\
    \ and messaging platforms that are so difficult to trace, allowing them to communicate\
    \ and transact with their victims anonymously. The other problem is that the hackers\
    \ live outside the jurisdiction of American law so even when US law enforcement\
    \ finds the cybercriminals and indicts them they are never subject to extradition.\
    \ The majority of these cybercriminals derive from North Korea, Iran and Russia\
    \ where the US has no extradition treaties and whose governments either initiate\
    \ the hacks or share in the breached files, which are full of useful information\
    \ such as personal data of government and military officials in the US, IP, trade\
    \ secrets and military information used for cyberwarfare purposes.[⁶](#ch15.xhtml#en110)\
    \ \n\n## Cyberattacks on elections\n\nIn July 2019, Tom Burt explained to those\
    \ attending the Aspen Security Conference in Colorado that Microsoft had evidence\
    \ that Russian, Iranian and North Korean hackers were the most active nations\
    \ conducting cyberattacks. Mr Burt, Microsoft Corporate Vice-President, further\
    \ narrowed the focus of the cyberattacks to the three countries targeting NGOs\
    \ and think-tanks that work with US political campaigns. In the case of Iran,\
    \ a report by Microsoft in October 2019 stated that hackers supported by the government\
    \ of Iran made over 2,700 hacking attacks to identify the e-mail accounts of current\
    \ and former US government officials, journalists who have covered US political\
    \ campaigns and accounts that have been associated with one major US presidential\
    \ campaign. Hackers further attacked 241 accounts and were successful in four\
    \ cases when they used information concerning their victims’ profiles online to\
    \ discover their passwords. Many of these politically motivated cyberattacks are\
    \ using the same techniques that the Russians had used in the US elections of\
    \ 2016.[⁷](#ch15.xhtml#en111) \n\n## Cyberwarfare with Iran"
