    在 2016 年俄罗斯对希拉里·克林顿的总统竞选发起网络攻击后，各政党一直试图加强网络防御。目前寻找最有效的网络安全服务的障碍是联邦法律，该法律规定私人企业安全公司不能向联邦候选人提供免费或折扣的网络安全服务。如果政党希望为其候选人提供网络安全服务，该法律也禁止此类行为，因为这些行为被视为实物捐赠。联邦选举委员会在
    2019 年阻止了硅谷网络安全公司`Area 1`的一项提议，该公司曾拟向 2020 年总统候选人提供折扣网络防御服务。在该裁决后不久，参议员龙·怀登提出了一项法案，拟允许所有政党为其候选人提供专家网络安全援助，但参议院多数党领袖米奇·麦康奈阻止了该法案以及任何类似法案进入投票程序。尽管
    FBI 局长克里斯托弗·雷伊在 2019 年 4 月警告说，俄罗斯反情报机构干扰 2020 年美国总统选举的行动仍然是一个真实且持续的威胁。


    网络风险是尝试竞选联邦职位的总统候选人的巨大障碍，因为与公司不同，他们没有数亿美元来聘佣网络安全专家。民主安全联盟主管劳拉·罗森伯（该组织试图追踪并揭露威权政权破坏民主选举的尝试）表示，允许总统候选人在没有任何利用网络防御反措施等最新技术的额外专家援助的情况下自力更生，将为自由公平选举带来挑战性障碍。劳拉·罗森伯拥有此类网络攻击的第一手经验，她在希拉里·克林顿
    2016 年总统竞选期间担任外交政策顾问，当时俄罗斯黑客发起了鱼叉式钓鱼攻击，入侵了克林顿竞选主席约翰·波斯塔的电子邮件以及民主党国会竞选委员会的电子邮件。


    如上所述，俄罗斯通过国家行为者和个人犯罪分子指导或实际出售黑客技术，威权流氓国家、无国家行为者国内恐怖分子有很大的空间干扰 2020 年选举，而这场选举对世界经济和地缘政治稳定至关重要。考虑到这些内在风险，联邦选举委员会在
    2020 年 5 月裁定，由两名跨党前竞选经理成立的非营利公司`Defending Digital Campaigns`可以向总统候选人提供其服务。`Area
    1`曾尝试申请提供其突破性的新型反钓鱼技术，但最终是`Microsoft`获得了为其客户提供网络防御服务的许可，因为这仅出于商业目的。


    联邦选举委员会面临着非常困难的决策，因为不加谨慎的方法可能会为那些希望提供网络安全服务但实际上想影响选举结果的企业或其他业务敞大门。事实上，2020 年 2
    月爱荷华州民主党党选的网络安全问题引起了对网络攻击的极大担忧，以至于`DNC`派遣了他们最好的虚假信息和网络安全专家。这是为了确保党选不会遭受黑客攻击和严重的虚假信息影响，这些可能会影响谁成为民主党总统候选人。`DNC`担心俄罗斯甚至伊朗会试图影响结果以有利于他们。


    然而，在用于计入选票的高科技应用程序失败后，那些负责公平开展选举的志愿者对如何让这个新程序运行了解甚少，当他们尝试通过定制的服务热线联系该程序的人员时，他们联系不上任何人，因为电话线被其他同样困惑并寻求帮助的选举志愿者占满了。最终依靠的备份方案是纸质总统偏好选择表。现在有人呼吁在未来恢复这种
    19 世纪的技术，以获得公平且不受俄罗斯黑客攻击影响的结果。


    ## 网络司令部的角色


    为了应对和反击严重的网络战争攻击，包括潜在和实际的物理基础设施攻击以及与后续选举相关的政治攻击，`美国网络司令部`被赋予了广泛的法律权力来处理俄罗斯的网络威胁。2018
    年 8 月，特朗普总统签署了一份名为`国家安全总统备忘录 13`的备受期待的行政命令。这项由国会产生的行政命令的本质是，网络司令部将允许执行所有类型的反措施，包括在未经总统批准的情况下渗透外国网络。这是一个务实的举措，因为美国计算机网络正受到如此密集的攻击，网络司令部需要不受限制地访问外国网络（在这种情况下为俄罗斯），以反击对美国各个领域的网络入侵。


    国会授权了这种行动自由，因为网络司令部被视为正规军的一部分（包括空间），其工作被视为执行巡逻。一旦获得授权，网络司令部攻击了负责美国选举黑客活动的大部分俄罗斯情报部门。在随后的中期选举期间，他们还关闭了位于彼得堡的`互联网研究院`，该机构曾负责设计出现在
    Facebook 上的虚假信息社交媒体广告。网络司令部还针对了`GRU`，即负责入侵`DNC`并将其私人数据公开的俄罗斯军事情报局。他们还向俄罗斯黑客和官员发送了短信，警告他们，如果继续为美国选举和整体政治制造麻烦，他们知道这些人是谁以及在哪里可以找到他们。这些行动的大部分已经公开。对于俄罗斯在影响
    2020 年美国选举方面将扮演的角色，存在大量的讨论和担忧。他们会利用新冠肺炎来增加现任总统特朗普的吗？俄罗斯情报局`SVR`（美国主要情报机构`CIA`的对应机构）会比俄罗斯军事情报局`GRU`更深入参与美国选举虚假信息运动吗？既然是`GRU`干预了
    2016 年选举，或许更精明的`SVR`将占据主导地位？


