    # 9 Insurance sector


    The insurance industry has for years trying to incorporate cyber risk and threat
    into its mainstream policies but similar to IP coverage it has not been successful
    in this endeavour. The needs for adequate IP theft comprehensive cover like cyberattack
    has eluded the insurance sector.[¹](#ch18.xhtml#en142) A report from `Beazley`
    noted as more people work from home (and this has been increasing with the `COVID-19`
    pandemic), ransomware cyberattacks have been growing. Over 2019 the `Beazley`
    report noted ransomware attacks increased by 131% worldwide.[²](#ch18.xhtml#en143)
    Given the extent of cyberattack and IP theft especially through SME supply-chain
    providers to large companies more intensive action is being taken. This also includes
    the risks of cyberwarfare, which is only very recently being acknowledged as a
    real threat to governments and companies.


    ## SME cyber insurance


    In the UK, which is home to the earliest insurance companies, Global Data, an
    analytics company, found that cyber insurance for SME companies only accounted
    for 34.6% of SMEs. Of those covered, just under one in four (23.9%) are covered
    for human error. In February 2020 alone, there were estimations by the police
    that there were 21 separate cases of coronavirus-related phishing attacks, which
    cost victims £800,000. In these cases the hackers claimed to have a list of those
    with `COVID-19` or asked the victims to make payments in `Bitcoin` for the list.
    The essential problem for producing a comprehensive insurance policy for cyber
    risk and threat is that it is so expansive including ransom payments, loss of
    IP, physical damage and data breaches to name a few. Therefore, many SME companies,
    one in four (23.9%) see insurance for human error as most likely to cover many
    aspects of cyberattack. Potential claims categories would include physical damage,
    reputational losses, `BI`, data breaches and phishing. One in five SMEs (18.6%)
    believes that staff training is the most effective preventive measure to mitigate
    cyberattack.[³](#ch18.xhtml#en144) Yet, it could always be the case that cyber-risk
    policies could be the most closely aligned to what SMEs consider to be their greatest
    problems such as cyber included in IP insurance, cyberwarfare insurance attached
    to `BI` insurance like they are doing with human error. Therefore, instead of
    an all-encompassing insurance policy for cyber risk and threat for SMEs, cyber
    insurance could be offered within the categories most pertinent to their business
    and what they would be most affected by. SME companies cannot afford the near
    comprehensive insurance policies for cyber and IP theft, the latter that was offered
    by large city of London insurers such as `Hiscox`. It is beyond their means so
    a more targeted insurance cover linked to a wider problem such as human error
    may be the best way forward.


    ## Staff training solutions


    Staff training may also be the best practice to mitigate internal human error
    such as the aforementioned mistake mentioned in previous chapters of picking up
    infected `UBS` sticks in a parking lot left by Russian agents and then inserting
    them into the computers of a US intelligence-related agency. As noted in [Chapter
    1](#ch10.xhtml#book-part-001) of this book human error is often the reason why
    entry to hackers is made easier in targeted companies. In SME companies, as noted
    in [Chapter 3](#ch12.xhtml#book-part-003) on Japan in this book, the weakest entry
    point in a company computer network is through the SME supply chain. In the marine
    sector, the topic of the previous [Chapter 8](#ch17.xhtml#book-part-008), it was
    noted that the digitisation of the computer system networks containing many e-mail
    correspondences provides an opening for hackers to gain entry to essential data.
    The `Shipowners Claims Bureau Inc.`, Managers of the `American Club` created a
    novel way of training staff both onboard and at port terminals through a cartoon
    booklet entitled `Cyber Awareness`. It explains simply through cartoon figures
    and humour how seafarers need to be conversant with cyberattack countermeasures,
    whether they be ransomware or phishing hacks. As mentioned in [Chapter 8](#ch17.xhtml#book-part-008)
    of this book, by 1 January 2021 companies operating safety management systems
    will be required to include cyber-risk management practices as set out in the
    `ISM`. `Cyber Awareness` is intended to facilitate such training for seafarers
    to assist with the prevention of costly, damaging cyberattacks including IP theft
    and those emanating from cyberwarfare.[⁴](#ch18.xhtml#en145)


    ## Cyber insurance progress


    The `IUA` established on 16 March 2020 a new London market committee to deal with
    non-affirmative cyber coverage for the first time. This move is in response to
    growing regulatory scrutiny of policies that either include or exclude cyber risks.
    The management of cyber risks has become now a priority for the London company
    market. The new dedicated committee is aiming to understand the details of cyber
    risk through collating and sharing information that is publicly available, considering
    the model clauses in terms of impact on different lines of business as well as
    analysing the interactions between bespoke cyber and other insurance policies.
    Tom Hughes, the `IUA` market services executive, is secretary to this new committee.
    He noted that ‘[a] major cyber event could have widespread impact on a number
    of different classes of business’.


    > Companies have been working hard to assess and control their exposures to non-affirmative
    cyber risks and these efforts are very much ongoing. Market conditions, changing
    client expectations and lack of historical data are all issues that must be prudently
    managed.


    The `IUA`’s new `Non-Affirmative Cyber Risk Committee` will assist members by
    identifying areas of complexity and promoting best practice across the London
    company market.[⁵](#ch18.xhtml#en146) In the US it has been reported by `Marsh`
    that 40% more of their clients in the US purchased cyber insurance in 2019.[⁶](#ch18.xhtml#en147)
    One of the problems for creating cyber-risk insurance policies that adequately
    cover the needs of present-day companies affected by these events has been, as
    Tom Hughes notes above, the lack of historical data. Catastrophic insurance or
    marine loss insurance have been evolving for over a hundred years providing empirical
    evidence of insurable incidents that can be drawn upon when underwriting insurance
    policies. Cyberattacks are very historically recent with digitisation of systems
    relatively new so data on cyber risk can only be understood once enough data are
    collected to understand both the circumstances and the actual market values of
    such losses. Valuation is the most difficult and complex area of underwriting
    insurance claims. The different methods of valuation are varied and often do not
    follow an established system of quantification so historical data and analysis
    are essential to understanding claims and losses. Both IP and cyberwarfare are
    complex and the values inherent in them are not fully understood.[⁷](#ch18.xhtml#en148)


    ## Insurance cryptoassets

