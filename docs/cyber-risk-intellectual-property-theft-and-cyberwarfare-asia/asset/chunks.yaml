    One of the most important cybersecurity solutions for smart grids is information
    sharing when a cyberattack occurs at another energy provider. In the case of Ukraine
    this was relatively straightforward as the US had a close relationship with the
    Ukraine as a geo-political ally. The US intelligence agencies needed to know exactly
    how the cyberattack was carried out in this first ever major power outage caused
    by a cyberattack. This knowledge was especially needed by the US because hackers
    for whatever reason are increasingly developing new ways to attack critical infrastructure
    such as hydroelectric dams, transportation systems and chemical plants or oil
    refineries. Cyberattacks are increasing as utilities begin using smart grids that
    are connected to the IoT and BYOD (Bring Your Own Device) that causes greater
    vulnerabilities.


    Solutions and countermeasures are close to those in the banking sector. As argued
    in the author of this book’s previous book, `Managing Cyber Risk in the Financial
    Sector`, to combat cyberattacks and mitigate risk banks need, like patent pools,
    to share information to create a solution shared by other companies. Obstacles
    to this have been an unwillingness to let it be known to the wider public that
    their trusted bank that they entrust with their finances has allowed a hacker
    to steal personal data, IP or actual savings.


    Power grids operate in a similar manner in that trust in them will be lost if
    they allow in hackers who not only steal personal data but also cause blackouts
    with all the attendant problems that causes from food in freezers perishing to
    burglaries because of a lack of lighting. Like in the banking sector, the solution
    is a trusted third party that can collect confidentially incidents of cyberattack
    and their nature. In the US, Japan and Europe such non-partisan agencies have
    been developed to collect and share information about the nature of cyberattacks
    among competitors.


    In Europe, for example, the banking sector helped to create the Financial Services
    Information Sharing and Analysis Center (`FS-ISAC`), which includes representatives
    from law-enforcement agencies, Europol and the European Central Bank among others.
    Information concerning cyberattacks is shared, such as the nature of the attacks,
    and how they affect the financial community, new vulnerabilities, technology trends
    and threats, cyberattack incidents along with case studies. Such an umbrella organisation
    could be created to protect smart grids effectively from cyberattacks.


    In the US under the Obama administration, a Cyber Threat Intelligence Integration
    Center was created to facilitate information sharing between the public and private
    sectors. This has encouraged greater cooperation between government agencies and
    privately-run companies to share information on a real-time basis to warn all
    about the latest tools used to hack into both government organisations, academia
    and companies. This cooperation allows timely cybersecurity information to be
    produced in a standardised language to both highlight potential cyberattacks and
    to undermine the economic strategies of hackers.


    Hackers use economies of scale by carrying out similar attacks on multiple victims
    to obtain the highest rewards. Information sharing in real time serves to notify
    the community of users immediately so they all can act to prevent or undermine
    the cyberattack. This will prevent hackers from using multiple breaches using
    the same methods, which drives up the cost of cybersecurity measures for all.


    The development of AI and its use to protect smart grids from cyberattacks will
    allow the AI learning machines to mitigate known cyberattacks leaving the experts
    with high expertise time to deal with new and unknown forms of attacks by hackers.
    Cybersecurity will be enhanced while keeping down costs of cyberattack mitigation.
    This would allow for automation of known, for example, malware, and cyberattacks
    to have automated machines to block them, dispensing with human error, which allows
    so many cyberattacks to be successful.


    ### Notes

    1. `European power grid organization confirms “cyber intrusion”`, Erin Ayers,
    *Advisen Cyber Digest* (12 March 2020).

    2. See Ruth Taplin (ed.), `Managing Cyber Risk in the Financial Sector: Lessons
    from Asia, Europe and the USA`, Abingdon: Routledge, 2016.

    3. Some of the material in this chapter has been derived from the PhD thesis of
    1 June 2018 by Jacob Mendel at the Poznan University of Economics and Business,
    Faculty of International Economics and Business, Poznan, Poland. Permission to
    draw material from this awarded doctorate was granted to the author of this book
    by Jacob Mendel himself and his main supervisor, Professor Tadeusz Kowalski. The
    title of this doctorate is `The economic perspective on the smart grid cybersecurity`.
    Material in this chapter was also drawn from an article written in *Economics
    and Business Review* (`EBR`) by Jacob Mendel and his other PhD supervisor at Poznan
    University Prof. Piotr Lis. See EBR article `www.ebr.edu.pl/pub/2019_2_24.pdf`.

