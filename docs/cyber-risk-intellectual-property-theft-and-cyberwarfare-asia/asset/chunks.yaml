  raw: "In June 2019, PwC held an audit roundtable with the Audit Committee Chairs\
    \ of US-listed shipping companies highlighting the need for a greater awareness\
    \ of cybersecurity issues in shipping. One of the crucial issues highlighted at\
    \ the roundtable was the need for a holistic, vertical team effort approach to\
    \ cybersecurity measures including top management, board members, risk technology,\
    \ legal, operations and auditors. This is especially needed as ships become digitised,\
    \ with less manning and more complexity. The complexity lies in particular with\
    \ operations technology (OT) and the interconnectiveness of IoT, which expands\
    \ the IT surfaces of ships opening avenues for cyberattack that damages critical\
    \ operational infrastructure. It was noted at the roundtable that there is a good\
    \ deal of OT that remains unmanaged in relation to cyber-risk issues and it was\
    \ suggested that it is essential that as a minimum course of action it should\
    \ be understood and monitored. It was also noted that software developers need\
    \ to create cyber-resilient software bespoke to the requirements of ships, which\
    \ has different critical infrastructure than other industries. As with smart grids\
    \ as mentioned in the previous chapter of this book, regulatory bodies and policy-makers\
    \ have a role in such developments to mitigate cyberattacks. Awareness training\
    \ for mariners was suggested as an important initiative to stop ships from becoming\
    \ the entry point for cyber infection of allied corporate networks. As with IoT,\
