    日本在处理网络风险管理方面存在许多矛盾，包括知识产权（IP）盗窃和网络战争问题，这些将在本章中进行探讨。众所周知的是，知识产权盗窃是最频繁的网络攻击和网络盗窃形式。日本过去和现在都是创新国家，曾生产过中村修二发明的蓝光二极管，目前是老年人医疗设备开发的领导者。这些都创造了知识产权，特别是在专利方面。由于研发成本高昂，日本公司在专利池方面与公司其他部门或外部公司合作。这意味着资源、开支以及随之产生的专利成果都是共享的。在准备网络攻击方面，日本政府是世界上最有条理的政府之一。这从目前针对日本
    2021 年奥运会所组织的网络攻击防御准备中可以看出。计划在最微小的细节上经过了周密准备，拥有数百张支持图表和许多委员会。在日本，计划是从自下而上协调，然后从上而下执行。这种准备通常被比作在初冬移栽树木之前妥善准备树根。这是一个被称为
    `nemawashi`（根回）的决策过程^¹。这种网络准备状态往往由于计算机素养的缺乏而遭到破坏。多年来访问许多公司时，我不禁惊讶，无论是在酒店服务业还是医疗服务业，在整个业务活动中，有多少日本员工不懂计算机。也许更令人震惊的是，负责
    2021 年东京奥运会网络安全（包括电脑或手机阻止网络攻击）的安全部长樱田义孝（Sakurada Yoshitaka），他一生从未用过电脑，对 USB 闪存有什么也一无所知。他说从
    25 岁开始职业生涯以来，他一直将任何与计算机相关的任务委托给他的员工和秘书^²。也许正是日本的 `tatamae`（建前）和 `honne`（本音）概念让日本人能够表现出这种矛盾性：`tatamae`
    指事物本应的样子，而 `honne` 指事物在现实中的实际情况^³。这意味着，对知识产权盗窃、网络战争、网络风险和管理的网络攻击的任何理解，都需要根根于这种矛盾框架的分析。要理解知识产权盗窃和网络战争对业务的网络攻击的优劣势，理解大型企业集团（`shogo
    shosha`，综合社）及其贸易分支（`keiretsu`，系列企业）与供应链中中小企业供应商之间的关系至关重要。这是因为供应链中的中小企业往往是最薄弱的环节，黑客（无论是个人还是国家行为者）利用其作为较软的访问点，对大型企业组织实施网络攻击。


    ## 综合社与中小企业


    日本公司源于传统的 `zaibatsu`（财阀），财阀由家族所有的企业性集团组成，例如最古老的财阀三井（Mitsui），它变成巨大的交叉持股网络。交叉持股的性质非常秘密，只有极受信任的外部人员才被允许参与交易。随后形成了许多从属公司，如
    `keiretsu` 或贸易分支，它们的名称与母公司不同，但通过交叉持股成为其不可分割的整体。二战后，美国管理人员禁止了财阀，取而代之的是 `shogo shosha`（综合社），它们遵循与财阀相同的模式，但表面上不再有以家族为中心的控制。`shogo
    shosha` 的中心是其金融核心——银行。例如，三井银行或三菱银行为其他相关的公司分支提供融资并持有其汇款。这种章鱼般的、本质上相互关联的结构，使得以网络攻击者形式入侵的入侵者很难渗透。对企业集团组织的忠诚是至关重要的，任何试图破坏关联公司之间紧密结构的人都会被社会所排斥，并处于极度孤立的非常不愉快境地。


    ## 集体与层级决策


    对和谐和集体的强调在传统上源于水稻农业，群体中的所有成员都要通过群体共识进行协商，群体和谐优先于任何其他形式的群体组织。群体共识既是正式的而非正式的，但两者都巩固了人际关系。在公司里，雇主与员工之间的关系与义务性的礼貌仪式结合在一起，这种仪式一贯强调等级和正式性。然而，这种自上而下/自下而上的共识管理与集体主义观念相关，而非正式性与平等主义观念联系在一起。因此，一旦雇主和员工离开办公室，就会进行非正式的社交，而且最重要的社交往往发生在此时。在日本公司，控制权并非由高级官员负责，而是下放到所有管理层级。委托通过整个等级制度运作，包括
    `shacho`（社长）、`juyaki`（董事）、`bucho`（部长）和 `kacho`（课长）。`hira-shain`（普通员工）主要通过质量小组和建议系统，或通过对其工作有直接影响的其他有限方式参与决策。全公司范围的委托是真实的，而不仅仅是形式上的委托头衔。公司各地的员工，甚至是他们自己机器的操作员，实际上对他们的环境以及对根据其工作情况需要做出的决策拥有功能性权力，但仅是为了提高生产力。部门经理或科长可以对其特定的工作要求行使相当大的权力和控制力。这可能再次与平等主义和集体主义的基本文化假设有关，人们信任彼此进行治理，因为他们被预期承担责任。社会责任和潜在丢脸的社会压力消除了不断受到法律约束的需求。由于下级在义务和共识方面发挥的社会控制功能，上级是信任下级的，因此他们被授权对自己在公司、社会或家庭中的特定职能负责。对社会共识的高度强调确保了社会控制将迫使人们以负责社会责任的方式行为。不成文的社会“法律”规范着日本人的行为，即使是在雇用条款等情况下，而在这些情况下，西方公司的员工会要求法律合同。因此，由于对忠诚有如此要求、义务的约束性约束以及作为公司决策不可或缺的一部分，黑客突破日本公司员工闭环或内部员工对同公司其他成员实施网络攻击的可能性确实非常其微^⁴。


    ## 供应链网络脆弱性


