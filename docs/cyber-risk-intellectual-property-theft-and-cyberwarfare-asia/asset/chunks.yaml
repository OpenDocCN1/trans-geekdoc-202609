  trans: '

    并非总是俄罗斯政府在入侵国际系统。也有一些受过高度训练、精通数字技术的俄罗斯人由于无法在政府机构找到工作，在金钱利益的驱动下，自己建立网络来欺骗全球的公司和个人。如果知识产权窃取能为他们带来物价值的回报，他们就会偷取
    `IP`。如果作为网络佣兵可以轻松获得金钱，他们就会把自己卖给出价最高者。这可能是俄罗斯黑客/佣兵未来参与网络战争的一种方式。


    一个名为 `GozNym` 的刑事网络犯罪集团由五名俄罗斯黑客于 2007 年创立。该名称是两种恶意软件的混合体：`Gozi` 和 `Nymaim`。第一种作为下载器软件进入或释放到计算机系统中，安装恶意软件。在
    2015 年之前，它主要被用于安装勒索软件。该混合体中的另一部分在多年来使用了多种技术在全球范围内挖掘财务数据，尽管大部分在美国。俄罗斯网络犯罪分子利用在美国、德国、保加利亚、摩尔多、格鲁吉亚和乌克兰的集团成员从银行账户中盗窃、洗钱并欺骗银行。


    总而言，在被捕并起诉之前，他们从超过 40,000 名受害者（包括国际公司、中小企业、律师事务所和非政府组织）手中盗走了 1 亿美元（7700 万英镑）。在欧洲警与美国执法机构的跨境合作中，最初的五名俄罗斯黑客以外，所有人均被捕并受审，该国际集团也被取散。未被捕的五名俄罗斯公民被发现正在赚钱，并通过向全球其他网络犯罪分子租赁
    `GozNym` 来传播这种犯罪的网络机制。俄罗斯网络犯罪分子似乎能够回到自己的国家并比许多其他国家更有效地消失。然而，他们似乎并没有得到克里姆林的保护，集团中的非俄罗斯成员可以像本例一样被捕。他们很有可能以不同的伪装重新出现，也许作为网络战争佣兵。


    ## 地缘政治干预


    俄罗斯政府及其机构通过欺骗和否认运作，事实证明比本土网络犯罪分子难对付得多。2019 年 10 月，`NSA` 及其英国同行发布警告，称俄罗斯人已经回来，而且隐蔽性增加了。他们指出，俄罗斯政府情报机构已入侵伊朗高级情报机构部门的网络，攻击英国和中东的政府和私营公司，试图通过让德黑背黑来制造混乱。


    对于那些负责保护 2020 年美国选举的州和联邦行政官员来说，已经很清楚，俄罗斯指导的选举网络战争将与 2016 年进行的活动不同。俄罗斯的隐蔽性正在增加，而他们依附于伊朗网络，是
    2020 年美国选举中即将出现的黑客和虚假信息欺骗战术的信号。俄罗斯政府可以很容易将其自己的干预行为归咎于另一个国家，就像试图将俄罗斯的选举干预归咎于乌克兰一样。


    自 2016 年俄罗斯发动网络战争以来，美国对网络攻击的防御有了巨大提高。作为虚假信息的主要载体，`Facebook` 如上所述，现在更地意识到某些策略，例如用卢布支付的虚假广告，或呼吁加利福尼亚（世界第六大经济体）脱离联邦，而这些运动的总部位于莫斯科。`Facebook`
    正在寻找并删除此类虚假信息。同样，负责监督投票的官员已经在熟悉如何通过恶意软件和机器人实施网络攻击等。此外，如上所述，军事官员正在考虑参与信息网络战争，甚至考虑通过入侵俄罗斯高级官员的账户进行报复。然而，美国选举在
    2016 年面临的许多网络漏洞不仅依然存在，而且变得更加隐蔽。然而，一个发生重大变化的问题是，2020 年，俄罗斯的虚假信息和水军网络攻击不再是让美国政党和投票官员完全预料到即将发生的新奇现象。


    许多影响 2016 年选举的问题仍然存在。其是政治竞选不愿投入有效网络防御所需的资金。其次是社交媒体、来自白宫的信息以及某些新闻频道通过误导性故事和对“虚假新闻”的控诉来干扰选民，加上许多选民区分事实与否认现实的能力日益下降。大部分社交媒体、邪教式人物和阴谋论传播者模糊了事实与虚构的界限。因此，责任往往落在警觉、训练良好的选举官员身上，让他们探测那些可能破坏人们充分公平获取有关候选人事实的网络攻击，而这些事实应不受俄罗斯或现在是伊朗支持的隐蔽性虚假信息活动所制造的损害性怀疑的影响。


