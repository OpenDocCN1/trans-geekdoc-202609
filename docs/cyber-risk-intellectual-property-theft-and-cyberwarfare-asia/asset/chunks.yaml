- fmt: '

    In 2019 Russia successfully tested Runet, unplugging the Russian-controlled internet
    from the global internet. Russian users would not have been aware of what was
    occurring during the test but results would have been given to President Putin.
    The Russian public had the situation explained to them through the major newspaper
    `Pravda` and local newspapers quoting the Deputy Minister of Communications, Alexey
    Sokolov, who described the tests as dealing with emerging cyber risks and threats
    ensuring the stability of the internet and a unified telecommunications system
    in the Russian Federation. TASS, the government news agency, reported that the
    test showed the Russian internet robust enough to stop cyberattack through the
    IoT and from external influences that may be negative. Russia is also developing
    bespoke services such as a Russian version of Wikipedia and also passed a legislative
    bill that banned the sale of smartphones that did not first have Russian software
    installed. There have been many protests against the Russian unplugged internet
    from the global internet, especially when in March 2019 the Kremlin passed cyber-security
    bills that many Russians believe are not targeted at protection from cyberattack
    externally but will be used to limit information sources to the Russian population.
    The so-called Digital Sovereignty Bill, which the Russian government claims will
    reduce reliance on US-based internet servers, was challenged by protesters who
    believe the Bill will increase censorship by the Kremlin and stifle dissent as
    well as freedom of speech. Other bills passed in March 2019 included the banning
    of internet conversation that ‘disrespects’ the Russian authorities or that promotes
    ‘fake news’ as defined by them. Campaigners in 2019 also protested about the media
    watchdog trying to close the encrypted messaging system Telegram because the FSB
    stated that it was a favoured service of international terrorists.


    ## Cyberattacks and cyberwarfare


    The Chief of the Defence Staff in Britain, Sir General Nick Carter, explained
    how the digital age has served to blur the distinction between war and peace,
    making cyberattack warfare a daily occurrence. Russia was singled out in particular
    for creating a cyberwarfare based on competition for power and ideology. US General
    Petraeus noted that Russia was revanchist or trying reprise former glory days
    when it was an international power player not subservient to the US. General Carter
    noted that Russia is much more of a threat today than it was five years ago because
    it realizes that physical warfare is receding, being replaced by domination of
    information and the ability to deploy it to the hacker’s advantage through controlling
    its dissemination. He stated clearly that future warfare will be based on control
    and adept use of information. General Carter noted that NATO will have to adapt
    to the biggest future challenges since the Cold War era and that involves preparing
    the military to understand and be trained to fight cyberwarfare battles. President
    Putin has been a great catalyst according to both General Carter and General Petraeus
    in making NATO aware of the new emerging cyberwarfare battle already here and
    to come. A key to cyberwarfare they both agreed is disinformation and denying
    being the source of such duplicitous information. Such tactics presented difficulties
    for the US and UK military, which have been guided by the rule of law and judged
    by a court of public opinion. General Carter viewed bringing back the lost art
    of deceptive tactics as central to combating Russian cyberattacks that are now
    an integral part of increased cyberwarfare.


    ## Social media used by Russians


    To vindicate the explanations of the two generals of how Russia is leading the
    cyberwarfare campaign of disinformation to reprise its perceived role of former
    geo-political dominance, social media has become awash with Russian disinformation.
    In January 2019, Facebook had to delete about 500 pages of misleading information
    campaigns targeting Europe and Central Asia that were directly linked mainly to
    employees of Sputnik. Sputnik is an agency controlled by the Kremlin that was
    established to disseminate favourable information about Russia globally. Its use
    of deception is intensive as it spreads disinformation through seemingly innocuous
    news items related to travel, sports and even the weather. It leaks disinformation
    through pretending to provide useful, unbiased news items to often gullible readers.
    Nathaniel Gleicher, Head of Cybersecurity at Facebook, stated that they are constantly
    trying to detect people using manipulative tactics to promote their disinformation
    schemes through content such as seemingly genuine articles and videos. There is
    also the problem of fake accounts being created in different countries other than
    Russia with the sole purpose of sharing content with Sputnik. In 2016 during the
    US presidential election it became abundantly clear that Facebook served as a
    major platform to influence voters through disinformation, sow divisions and target
    particular groups of voters. Facebook believes that it is difficult to detect
    all the disinformation on a platform of two billion users. Facebook has been trying
    to trace and delete fake and misinformation accounts originating from Sputnik.
    In August 2019, Facebook removed 652 fake accounts originating with Russian groups
    to counter attempts to influence US elections and other misinformation. However,
    as with cyberwarfare, this is an ongoing battle with Russian agencies related
    to the Kremlin becoming ever more deceptive and sophisticated in such deceit.
    The Atlantic Council’s Digital Forensic Research Lab found that on a single day
    in October 2017, Sputnik content was created to target Armenia, Chechnya, Estonia,
    Georgia, Latvia, Lithuania, Kyrgyzstan and Tajikistan. There were also fan pages
    purporting to support the presidents of Uzbekistan and Tajikistan created, but
    they were actually run from Russia. Part of the Russian cyberwarfare strategy
    is to target the greatest number of people in many countries through social media
    giants, bombarding them with deceitful cyber misinformation.


    ## Cyberwarfare enters Latin America


    Latin American countries are the latest to be the target of Russian-backed cyberwarfare
    through social media. The cyber influence campaigns began a decade ago in tandem
    with digital technology and the rise in social media use. Russia has become one
    of the strongest allies of President Maduro in Venezuela and has been using that
    country as a springboard for spreading conspiracy theories, disinformation and
    even outright falsehoods to undermine liberal, democratic policies. Two Spanish-language,
    Russian-based news organisations have been at the forefront of such disinformation
    activities in Latin American countries. One is Sputnik Mundo, a Spanish-language
    arm of Sputnik mentioned above, which is produced partly in Montevideo, Uruguay
    and began broadcasting in the last few years. The other is RT (Russian Television)
    Espanol, which states it reaches 18 million people in ten Latin American countries
    every week and has over a billion views on YouTube. Evidence of Russian interference
    in Latin American countries’ political affairs is growing. In Bolivia, for example,
    Russian-backed tweets were fewer than five a day but around the time President
    Evo Morales was pressured to resign on 10 November 2019, Russian-based Twitter
    accounts rose to over 1,000. It was also found over one 30-day period in Bolivia,
    Ecuador, Columbia, Chile and Peru that Russian-backed accounts sent out very similar
    messages within 90 minutes of each other.


    ## Rogue cybercriminal hackers/mercenaries

