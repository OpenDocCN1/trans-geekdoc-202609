    \ companies large and small, as well as government agencies, rely on some form\
    \ of supply chain, which is required for both products and services. In fact,\
    \ the larger the company the more it relies on supply chains. A recent example\
    \ involves two hotel chains, one with 107 hotels in 14 countries and the other\
    \ with 73 hotels in 14 countries worldwide. A Magecard skimming campaign compromised\
    \ the hotels’ mobile websites through a third-party supply chain. Trend Micro\
    \ researchers found that hackers had targeted Roomleader based in Barcelona implanting\
    \ a malicious Javascript. Roomleader offers digital marketing and website development\
    \ services assisting hospitality companies with their booking functions through\
    \ a library module named ‘viewedhotels’, which serves to save viewed hotel information\
    \ in guests’ browser cookies. In line with the usual Magecart attacks the skimmer\
    \ was designed to glean information and data concerning guests’ contact details\
    \ such as e-mail addresses, credit card details and room preferences. In this\
    \ case the skimmer card was constructed to only target mobile website use and\
    \ not those who had utilised their PCs. Desktop users in fact were sent booking\
    \ information using the normal Javascript. Joseph Chen, the fraud researcher at\
    \ Trend Micro, suggested that mobile websites were targeted because they were\
    \ not protected by the usual PC security software and were easier to enter while\
    \ escaping detection. The hackers replaced the hotel payment forms with their\
    \ own slightly different version but translated them into eight different languages\
    \ like the original payment forms to help avoid detection. Additionally, many\
    \ hotels do not ask guests for their Card Verification Code (CVC) doing so when\
    \ the guests arrive. In their replacement payment forms they were sure to request\
    \ guest CVC security codes.[^(18)](#ch11.xhtml#en63) A recent survey by Microsoft\
    \ and insurance company Marsh, significant companies in both producing computers\
    \ and insuring their use, reported that company leaders have become even more\
    \ concerned about the rapid increase in cyberattack. Yet, these business leaders\
    \ and executives are even less confident than they were in dealing with such cyber\
    \ risks.[^(19)](#ch11.xhtml#en64) Notes [1](#ch11.xhtml#fnen46)‘Good for Google,\
    \ bad for America’, Peter Thiel, *New York Times* (1 August 2019). [2](#ch11.xhtml#fnen47)‘Cybercrime\
    \ and espionage go hand in hand as groups target healthcare and video game world’,\
    \ Erin Ayers, *Advisen Cyber News*, *Digest Edition* (8 August 2019). [3](#ch11.xhtml#fnen48)‘Beijing\
    \ hackers moonlight for cash’, Boer Deng, *The Times* (9 August 2019). [4](#ch11.xhtml#fnen49)‘Chinese\
    \ hackers “turned” US spy tools on West’, Boer Deng, *The Times* (8 May 2019)*.*\
    \ [5](#ch11.xhtml#fnen50)‘Huawei says without evidence that U.S. pressured its\
    \ employees’, Raymond Zhong, *New York Times* (3 September 2019). [6](#ch11.xhtml#fnen51)‘North\
    \ Korea “stole $2bn for weapons via cyber-attacks”’, *BBC News Online* (7 August\
    \ 2019). See [www.bbc.co.uk/news/world-asia-49259302](http://www.bbc.co.uk) [7](#ch11.xhtml#fnen52)‘Russia\
    \ suspected by some in giant Bulgarian hack’, Marc Santora and Eric Schmitt*,\
    \ New York Times* (14 August 2019). [8](#ch11.xhtml#fnen53)‘Episode 13: “The Blueprint”’,\
    \ Producer/Director John Marks, *New York Times* (6 September 2019). [9](#ch11.xhtml#fnen54)‘European\
    \ Values Think-Tank among 30 Russian watchers targeted by the most sophisticated\
    \ cyber attack ever done on ProtonMail, probably by the GRU’, press release, *European\
    \ Values* (14 August 2019). N.B. Technical details of this cyberattack were made\
    \ public by Bellingcat. [10](#ch11.xhtml#fnen55)‘Cyber attack on Ministry of Foreign\
