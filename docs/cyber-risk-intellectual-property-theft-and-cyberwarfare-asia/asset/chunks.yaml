  raw: "North Korea is a country that is using cyberattack to raise funds for weapons\
    \ of mass destruction (WMD). This is a case of cyber being used to produce a possible\
    \ tangible, physical war on its neighbours or for domestic use to control its\
    \ population. The UN Security Council made public a report that more than US$\
    \ 2 billion have been stolen by North Korean hackers to fund nuclear and non-nuclear\
    \ ballistic missile programmes. The stolen monies have been obtained from the\
    \ financial institutions such as banks that still have dealings with North Korea\
    \ despite sanctions being in place, which allows North Koreans to hack these countries\
    \ more easily than countries that have no connections at all adhering to sanctions.\
    \ North Korean hackers target in particular cryptocurrencies such as Bitcoin as\
    \ they are not subject to individual country regulation and scrutiny. This means\
    \ that the North Korean government can obtain through cyberattack vast amounts\
    \ of revenue that cannot be easily traced to source and steal IP related to WMD\
    \ development from other countries. The bulk of these monies the UN report found\
    \ were not used to develop North Korea and enrich its citizens but to keep Kim\
    \ Jong-un in luxury and his military up-to-date with latest military technology\
    \ for weaponry that can be used for WMD.[⁶](#ch11.xhtml#en51) \n\n## Russian cyberwarfare\
    \ and IP theft\n\nThere are numerous examples of issues of cyberwarfare, geo-political/military\
    \ rivalry and personal monetary gain driving the numerous cyberattacks that emanate\
    \ from Russia, central and Eastern European countries. In a curious case in Bulgaria,\
    \ which highlights the difficulty of tracing both the culprits and motives for\
    \ cyberattacks, a young Bulgarian was accused of a major cyberattack. A 20-year-old\
    \ from Bulgaria’s second largest city Plovdiv has been accused of carrying out\
    \ the largest cyberattack in Bulgaria involving the theft of personal data from\
    \ every working adult in the country from the National Revenue Agency. The young\
    \ man denied all charges and both security experts and Western intelligence did\
    \ not subscribe to this account of events. The timing of the public release of\
    \ all the hacked data from a Russian IP address when Bulgaria was strengthening\
    \ its relationship with NATO by purchasing eight F-16 fighter jets made the accusations\
    \ against the young Bulgarian seem ludicrous. This was especially the case as\
    \ the F-16 purchase was a plan by the Americans to bring Bulgaria’s fighting forces\
    \ on a par with NATO, replacing ageing Soviet jets. However, this breach was carried\
    \ out with one of the most basic tools used by hackers, an SQL (structured query\
    \ language) injection in which the cyberattacker uses a login page to insert a\
    \ malicious code that allows access to data. What this cyberattack points to is\
    \ the lack of preparedness by the Bulgarian government to be cyber ready and even\
    \ put in place basic countermeasures to combat such hacking. ‘While an enthusiastic\
    \ member of NATO, Bulgaria has weak and porous cyberdefenses – probably the worst\
    \ in the alliance,’ said Admiral James G. Stavridis, a four-star former NATO military\
    \ commander. He continued: ‘Significant cybercriminal activity, including some\
    \ sponsored by the Russian state, is rife’, and ‘\\[a\\]ny “shield wall” is only\
    \ as strong as the weakest barrier, and the linkages into NATO infrastructure\
    \ via Bulgaria during exercises and deployments there are concerning’.[⁷](#ch11.xhtml#en52)\
    \ In other words, cyberattacks that are successful are based on finding the weakest\
    \ links to enter a system that can further cyberwarfare, IP theft and geo-political\
    \ ends. Bulgaria’s geo-political importance to NATO and Russia is marked as it\
    \ lies between the Visegrád countries of Eastern Europe such as Poland, the Czech\
    \ Republic, Hungary and Slovakia. \n\n### Geo-political importance of Visegrád\
    \ countries for cyberwarfare\n\nAn early example of cyberwarfare that was described\
    \ as such by Estonian officials occurred already in 2007. The cyberattack emanating\
    \ from Russia shut down the government, media and banking systems. This extreme\
    \ cyberattack followed the Estonian decision to remove a war memorial from the\
    \ Soviet era when Estonia was used by Russians as the cyber experts to drive their\
    \ space programme. Russian leaders initially denounced the war memorial removal\
    \ and stoked antagonisms between ethnic Russians and Estonians, which became violent\
    \ and deadly. Such cyberwarfare tactics have not abated but intensified mainly\
    \ via social media throughout the world. This was seen in the 2016 elections in\
    \ the US when the social media was inundated with conspiracy theories and the\
    \ demonising of presidential hopeful Hillary Clinton. The FBI is currently concerned\
    \ that the 2020 elections will once more be interfered with by Russian hackers.[⁸](#ch11.xhtml#en53)\
    \ Geo-political cyberwarfare attacks are becoming increasingly sophisticated and,\
    \ consequently, more difficult to locate, isolate and combat. Often it is experts\
    \ who expose Russian cyberattacks that are becoming the target of such political\
    \ cyberwarfare. ProtonMail and its experts of the European Values Think-Tank were\
    \ targeted in late July 2019 by what their CEO described as ‘the most sophisticated\
    \ \\[he has\\] ever encountered’. The phishing cyberattack, according to the investigative\
    \ group Bellingcat, targeted those analysing Russian geo-political strategies.\
    \ Those targeted included BBC/*Guardian* investigative journalists, Bellingcat\
    \ researchers, and academics who are focused on Kremlin foreign policy. Due to\
    \ the complexity of this cyberattack it was difficult to pinpoint the perpetrator\
    \ but Bellingcat investigators were quite sure it was the Russian GRU (military\
    \ secret service). \n\n### Clues to the Russian cyberattack\n\nA number of clues\
    \ made the Russian GRU the likely suspected perpetrator: •The source codes that\
    \ were used on the phishing sites pointed to a state actor rather than any individual\
    \ hacker. •The planning time of the cyberattack was a year, which is indicative\
    \ of state actors who have the resources to devote such a long period of time\
    \ and human resources. Bellingcat was able to reconstruct a good deal of the malicious\
    \ code that modified the ProtonMail image creating a fake one which began being\
    \ worked on 8 March 2018, a year before the massive cyberattack. •Another clue\
    \ to the origins of the phishing cyberattack was that a test site linked to the\
    \ final attack was discovered by Marcus Neis, the Threat Intel Manager at Swisscom\
    \ who discovered an overlapping fingerprint on his company’s site with one of\
    \ the phishing sites.  Jakub Janda, Executive Director of European Values Think-Tank,\
    \ stated: \n\n> The fact that our analysts are targets of such sophisticated operations\
    \ alongside the elite of Western investigators of Russian hostilities only confirms\
    \ to us that we have targets on our backs. That is the price you pay for exposing\
    \ hostile activities by the Russian dictatorship also in our Central and Eastern\
    \ European region. None of our critical data were compromised during this incident.\
    \ We would like to thank to security institutions of democratic countries who\
    \ are helping to protect people like us and many others.[⁹](#ch11.xhtml#en54)\
    \ \n\n### Eastern European foreign ministries attacked"
