    Cryptoassets are another area difficult to insure as it is so new and has little
    historical data to draw on when valuing it for underwriting purposes. Even less
    than IP and cyberwarfare and cyber risk in general, there is less than 0.5% of
    capacity in the global insurance market to cover the value of cryptoassets. Why
    are cryptoassets so important to the cyber-risk insurance market? It is because
    `Bitcoin` and other cryptocurrencies are increasingly being used in ransomware
    and other forms of cyberattack as mentioned in this book. Rogue nations such as
    North Korea and Chinese intelligence operatives in cyberattacks such as `NotPetya`
    will only agree to unfreeze computer systems if ransoms are paid in cryptocurrencies.
    This is because such currencies are not regulated by any authority and are very
    difficult to trace. They are used in IP theft and in acts of cyberwarfare. `Evertas`
    is the world’s first cryptoasset insurance company with a large UK presence. `Evertas`
    has estimated that the current market is about US$ 200 billion in total but will
    grow to US$ 1 trillion in the next five years as institutional investors increase
    their exposure to the market. `Evertas` has also estimated that the value of crypotoassets
    held by institutions is roughly US$ 75 billion but predicts that over the next
    three years this will rise to over US$ 135 billion. `Evertas` believes the lack
    of insurance availability for cryptoassets is for three reasons. One is the relatively
    small size of the cryptoasset market compared to other sectors. Two is the lack
    of underwriting experience as this is such a new sector with little historical
    data and therefore little underwriting expertise. Three is that it is not encouraged
    by regular markets to write insurance policies in the cryptospace. There is a
    good deal of negative recent data that links cryptoassets to criminal activity.
    To establish and expand cryptoasset insurance `Evertas` has announced plans to
    launch a Managing General Agent (`MGA`), which specialises in cryptoasset theft
    and loss coverages. A `MGA` is a specialised form of broker or agent that has
    been granted underwriting authority by an insurer in addition to being able to
    administer programmes and negotiate contracts for an insurer. Such activities
    include underwriting and pricing, settling claims and appointing regional retail
    agents. The `MGA` manages all or part of the insurance business of an insurer,
    acting as an agent or broker for them while working as the intermediary between
    insurers, agents and insureds. Raymond Zenkich stated:


    > We hold a unique position in the sector today as we are the only company focused
    exclusively on the underwriting of cryptoassets and insurance for institutions
    such as custodians/exchanges, traditional financial institutions, cryptofunds,
    traditional funds, market utilities, and family offices.[⁸](#ch18.xhtml#en149)


    In trying to cover insurance risks for a wide variety of institutions traditional
    and modern, it seems as if they are trying to institutionalise cryptocurrencies
    as well.


    ## Governance and standards


    The problem of cryptocurrencies is that because they are non-institutional and
    not formally regulated it is difficult to value losses that can be measured against
    benchmarks supplied by national government standard-setting bodies. The efficacy
    of `blockchain`, `Bitcoin` and other cryptocurrencies is being challenged as the
    regulatory authority is either absent or too nebulous to account for what constitutes
    the value of cyberattack losses such as theft or other damage either physical
    to computer systems or through ransomware or the installation by hackers on the
    victims’ computer network systems of malware. Too often, cryptocurrencies are
    used by hackers, geo-political cyberattackers and criminals as mentioned in this
    book to money launder, for example, as it is harder to trace. How can insurance
    account for such cyber risk unless it can adhere to standardised benchmarks? On
    9 July 2018 the Association for Cooperative Operations Research and Development
    (`ACORD`), the global standards body for the insurance industry, released the
    `Cyber Data Breach Standard`, which constitutes the insurance industry’s first
    standard for the breach of cyber data. This pioneering standard, which will promote
    both efficiency and effectiveness in the world’s insurance value chain, was developed
    in tandem with `Beazley` and `Aon`. The former is a specialist insurer providing
    global underwriting and claims services while the latter is another major insurance
    company dealing with risk, retirement and health solutions. This `Cyber Data Breach
    Standard` has been created in a timely manner as nearly 60% of insurers according
    to a 2017 `ACORD/NAIC` (National Association of Insurance Commissioners) insurance
    survey have viewed the lack of uniform data standards and forms as the main obstacle
    to the development and growth of cyber-risk insurance policies. There has been
    increasing demand growing with the rise in related cyber risk, threats and IP
    theft/cyberwarfare through cyberattacks, which has led to this streamlined, standardised,
    cyber-risk data exchange. As mentioned in previous chapters of this book, there
    is a need for reliable communication between organisations, in this case, insurance.
    The `ACORD Cyber Data Breach Standard` facilitates accurate, speedy data exchange
    for stakeholders in a variety of businesses throughout the insurance value chain
    including brokers, carriers, agents and software providers. This new `ACORD` standard
    takes the need for standardised cyber risk data exchange further by increasing
    operational efficiency and effectiveness for those stakeholders experiencing cyber
    risks while establishing a baseline for compliance and audit-related activities.
    It also allows solution providers to leverage standards for increased support.
    The introduction of `GDPR` in 2017 put more pressure on companies and their insurers
    as claims increased sharply as all manner of hackers including government-backed
    intelligence agencies, geo-political rivals, companies globally interested in
    stealing IP, blueprints and trade secrets and those state actors involved in stealing
    military secrets to advance their dominance globally, realized a premium was being
    placed on private data. Companies have faced increasing reputational losses and
    pecuniary ones. `GDPR` has given incentive for companies to report data breaches
    and attempts of extortion by hackers through ransomware cyberattacks, which will
    give rise to more claims by companies to their insurers as well as from rising
    numbers of shareholders suing their companies for loss of personal data and privacy.
    The establishment therefore of the `ACORD Cyber Data Breach Standard` has assisted
    companies in information sharing during risk assessment and policy workflow. As
    increasing numbers of insurance leaders contribute to such standards, the greater
    the benefit in mitigating cyber risk, threats and attacks globally.[⁹](#ch18.xhtml#en150)

