    对于那些成为日益增加的网络攻击目标的航运业者，一种解决方案是找到合适的保险范围。保险公司倾向于将网络风险视为附加险或现有保险的一部分。网络风险在海运领域不断增长，而该领域传统上高度依赖保险来应对海上损失的风险。海运保险是伦敦市场的第一种保险，在处理海上事故方面拥有丰富经验，能够公平地进行承保并为灾难性损失提供保单。网络作为一种新风险和威胁，需要基于历史和经验来评估潜在损失。网络威胁日益严峻，正导致新的重新评估模式的出现。


    2018 年，`HFW`（全球领先的海运保险公司领先法律咨询团队）伦敦办公室的合伙人 `Tom Walter` 警告说，在评估船舶是否具备适航性并因此具有可保性的过程中，涉及船舶网络承保的保险公司将需要派遣软件工程师上船，以评估是否实施了最新的补丁。`HFW`
    还对上述 `GPS spoof` 欺骗的后果进行了六部分的审查，在其中讨论了由于网络攻击导致一艘满载的自主货物货轮与一艘`10,000 TEU 集装箱船`碰撞的情况。如上所述，这种
    `GPS spoofing attack` 可能由地缘政治力量作为网络战战术的一部分引起。这种可能的情景由 `HFW` 的高级助理兼海员 `Jonathan
    Goulding` 提出，他还预见到国家立法将先于国际立法，这意味着例如，一艘进入瑞典水域挪威船舶将受其监管约束，这增加了保险覆盖的复杂性。


    由于网络风险和威胁的发展快于保险条款的制定，许多 `P&C`（财产和意外险）保险公司使用的网络攻击排除条款 `380` 到 2020 年可能不会被频繁使用，而且需要长达八的时间才能为海运保险建立一套全面的网络风险国际体系，而那时该体系已经过时了。助理
    `Henry Clack` 和 `Mathew Dow` 指出，随着港口安全成为网络风险日益核心的问题，`P&I`（保赔保险）将面临保险影响。虽然安全港口的定义已随着时间的推移而不断完善，但当码头不与访问船舶共享其网络安全措施时，保险就会出现复杂情况。这种法律影响可以在本章提到的
    `San Diego cyberattack` 中看到。


    与网络攻击保险覆盖相关的另一个法律复杂性问题涉及什么被认为是异常、罕见或意外的网络风险。虽然 `Ocean Victory` 案在法律上被视为异常、罕见和意外，但像
    `Los Angeles` 这样每月至少遭受一次网络攻击的港口不能同等看待。同样，海运业也有该领域特有的潜在缺陷。上述未提到的 `Secure Shell
    (SSH)` 协议就存在这样的网络安全漏洞。它被广泛认为是用于输入命令以访问密码、覆盖安全措施、重新配置电子邮件和上传恶意文件的终端屏幕。黑客利用 `SSH`
    部署勒索软件并安装恶意文件，以便员工在无意中协助网络攻击扩散到整个公司，包括加密数据。如果外部黑客获得了此类内部系统的访问权限，结果将是灾难性的。因此，建立网络安全防御措施以在系统之间增加额外的安全层，从而在系统的早期入口处阻止网络攻击。


    技术创新需要不断改进和适应，因为云系统也存在此类注入漏洞。此类系统包括管理应用程序、计划维护系统、船员门户、在线学习培训和货物航行图表平台。对于船舶而言，最好为工作目的创建定制解决方案，而不是通用方案。然而，建议采取了一些基本的防御措施来减轻网络风险和攻击。这些包括：


    1. 确保网页代码不允许触发额外的查询。

    2. 将 Web 服务器、邮件交换器记录和其他服务器相互隔离。

    3. 使用双重身份验证加密凭据。

    4. 在每个平台使用不同的密码。

    5. 过滤基于位置的连接。

    6. 将软件更新到最新程序版本。

    7. 维护定期备份，例如 `OneDrive` 或 `iCloud`。

    8. 所有员工应接受 IT 培训并熟悉相关程序。


    关于保险的最后一章是独特的，保险部门具有双重角色：既要保护公司、政府和个人免受来自 `IP theft` 和网络战行为的网络攻击，也可能受到这些网络风险本身的影响。


