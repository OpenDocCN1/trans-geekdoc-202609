    | **Scanning** | Attacking large portions of the internet at random. Targeted
    attacks can be more sophisticated using or creating tools specifically for a targeted
    attack on a company or ship. Such a technique could be `social engineering`, which
    is a non-technical approach that manipulates insiders to break security procedures,
    usually initiated through social media but not exclusively |


    | **Script kiddie** | A description of a hacker who lacks technical skills |

    | **Secure Shell (SSH)** | Protocol for connecting to a server enabling file transfers,
    for example |

    | **Side channel attacks** | These are targeted to retrieve confidential information
    from a smart grid’s critical infrastructure equipment such as passwords and cryptographic
    keys |

    | **Spear-phishing** | This is the same as phishing but targeted at individuals
    with a group |

    | **Spoofing** | Altering an e-mail so it appears to be originated from an organisation
    such as a person’s bank or insurance company |

    | **Spyware** | A malware programme that sends back information while hiding in
    a computer |

    | **SQL** | Structured query language is similar to a code injection attack in
    that it inserts new code into vulnerable software to change the information or
    flow of execution |

    | **Stuxnet** | The first malware developed solely for the purposes of targeting
    industrial control systems such as a power plant or gas pipeline |

    | **Trojan horse** | Malware that masquerades as useful software while installing
    a back door into a user’s computer |

    | **TSA** | Time sychronisation attack, which targets the timing information of,
    for example, a smart grid |

    | **Viruses** | Self-replicating malware that continues to reproduce itself inside
    a user’s computer while destroying hard drives, stealing data and logging into
    keystrokes |

    | **VPN** | Virtual Private Network |

    | **WAN** | Wide Area Network |

    | **Water holing** | Establishing a fake website or compromising a genuine website
    to exploit visitors |

    | **Whaling** | Phishing that targets the upper management of companies for either
    pecuniary gain or wider exposure for the political cause of the hacker |

    | **White hat** | An ethical hacker who uses their digital skills for social good
    and/or assists organisations to overcome vulnerabilities in their computing systems
    |

    | **Zero-day** | The threat of an unknown cybersecurity vulnerability |


    Note [1](#ch08.xhtml#en3)Most of these definitions are taken from my previous
    books such as Ruth Taplin (ed.), *Managing Cyber Risk in Financial Institutions:
    Lessons from Asia, Europe and the US*, Abingdon: Routledge, 2016. Other sources
    are fully attributed within the book.


