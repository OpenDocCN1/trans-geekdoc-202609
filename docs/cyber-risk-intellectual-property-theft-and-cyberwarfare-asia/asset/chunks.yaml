    开发先进技术以应对网络攻击的新型公司已经开始设立，但大多数位于美国和以色列。日本公司未能进入网络安全领域的前列，这使得它们在面对网络攻击和经济方面都处于脆弱地位。“安倍经济学”始于
    2013 年，采取了三管齐下的战略，包括货币和财政刺激以及结构性改革，但未能产生日本经济的创新和增长所需的成果。安倍首相在 2019 年 12 月推出了一项实际价值
    1820 亿英镑（13.2 万亿日元）的新轮财政刺激方案，以应对 2019 年第三季度 0.2%的低增长率，以及消费者对新消费税产生负面反应导致的零售额萎缩。日本消费税的历史表明，消费税会严重打击消费者信心，导致零售额大幅下降。人们还担心，如果不对对创新进行实质性投资，2021
    年东京奥运会带来的临时增长在活动结束后将再次回落。


    然而，通过小泉纯政政期间发起的风险投资/初创企业支持体系，日本确实出现了一些专门从事网络安全的初创企业。如果小泉之子竞选首相并赢得下一次选举，初创企业倡议很有可能重启。在过去的
    20 年里，日本最具创新性的项目之一——位于山形县鹤冈市的一家生物技术初创企业已成为一个创新高科技集群，这防止了鹤冈市因年轻人迁往东京后缺乏就业前景而消失。这一切始于庆应义大学的富田彻教授受邀在具有封建色彩的农业镇鹤冈市建立一个科学实验室。当地居民的反对意见非常激烈，因为这意味着他们纳税人的资金将用于支持这项研究倡议。市长富泽阳一非常有远见且富有勇气，他坚持该项目应该进行。现在，这里是几家世界级创新企业的家园，包括
    Spiber Ltd 公司，该公司通过研发创造了合成蜘蛛丝。2019 年 3 月发表的一份报告显示，科学园区每年产生 30 亿日元的收益，并创造了 500
    多个新工作。富田教授的所有同事曾预测新的科学园区项目将会失败，因为它不在东京；但相反，他指出，该项目因为安静的环境、清新的空气和美食而蓬勃发展。此外，作为对当地社区的激励，当地还建立了一个新的酒店综合体室内儿童游乐场。正如日本古谚所说，“船转得慢！”


    日本落后的证据之一是，在 500 强网络安全公司中，只有三家日本公司。即使在全球范围内对 ICT/网络安全初创企业最友好的城市中，日本城市也没有进入前 12
    名的名单（包括纽约、波士顿、硅谷、凤凰、多伦华滑特卢、渥太华、海牙、法兰克福、柏林、普拉格、特拉维夫和谢费）。日本的创业计划是`J-Startup`，这是一个旨在支持初创企业的计划，目标让他们通过创新技术和商业模式在全球范围内具有竞争力。


    ## 5G 的潜在威胁


    鉴于对`5G`的需求，容量增加和多连接将导致脆弱性。随着`5G`的到来，灵活基础设施和自动化的引入将导致安全评估。


    ## 标准化与应对措施的趋势


    随着`5G`的到来，技术和自动化的引入将导致安全评估。预计`5G`会导致检测事件。## 美国、英国、以色列和新加坡的网络安全研发


    相比之下，美国、英国、以色列和新加坡的研发比日本更先进。在美国，`2016 Cybersecurity Research and Development Strategic
    Plan`定义了“威慑(Deter)”、“保护(Protect)”、“检测(Detect)”和“适应(Adapt)”四大类，并为每类提供了短期、中期和长期研发方法。每年制定一份计划。工业界、政府和学术界合作在国家标准与技术研究院(`NIST`)、国家科学基金会(`NSF`)、`NSA`、国防高级研究计划署(`DARPA`)、国土安全部(`DHS`)和国防部（`DoD`）推动研发。2019
    年的预算为 7.4 亿美元。


    在英国，`National Cyber Security Strategy 2016–2021`包含(1) `防御`、(2) `威慑`和(3) `发展`，后者引用了研发。它在其`网络安全科学技术`中确定了`IoT`、智慧城市、数据和信息保护、自动化、机器学习和人工智能等重要领域。在学术卓越中心（`ACE`）框架和政府倡议下，通过审批标准的大学正领导着研发的推进。


    `以色列网络安全战略`包含(1) `稳健性`、(2) `韧性`和(3) `防御`。研发被定位为能力建设的一部分，以实现这些目标。以色列政府在本古瑞大学和特拉维夫大学建立了网络安全研究中心，专注于政策和技术的各个领域。


    新加坡有四个支柱支持网络安全研发：(1) 灵活基础设施的发展，2) 维护更安全的网络空间，3) 活跃的生态系统以及 (4) 加强国际伙伴关系。研发位于第三点。新加坡政府在其`National
    Cybersecurity R&D Programme`中制定了直到 2020 年的实施计划。

    '
- fmt: '

    ### Protect

    - Development of secure update mechanisms

    - Evidence assessment technologies

    - Lightweight encryption, private databases, quantum-proof cryptography


    ### Detect

    - Automation tool for mapping networks

    - User interface improvement in security operation tools


    ### Adapt

    - Technologies that allow for continuous use of important assets in the case of
    an attack


    ## Medium term


    ### Deter

    - Real-time attribution


    ### Protect

    - Static/dynamic analytical tool to reduce vulnerability

    - A tool that automates the extraction of security policy

    - A tool and technology that verifies the authenticity of software and hardware
    at 98%


    ### Detect

    - Identifying malicious cyber activities (reduction of false positive rate, false
    negative rate)


    ### Adapt

    - A timely recovery of features of mutually dependent systems


    ## Long term


    ### Deter

    - Accurate and efficient identification of an attacker


    ### Protect

    - A tool that supports development of software with one fault per 100,000-line
    code

    - Enhancing effectiveness and efficiency of security control with two-digit orders
    in ten years


    ### Detect

    - Automated cyber threat prediction tool


    ### Adapt

    - Adaptive and effective collective defence


    ## ACE in the UK


    In the UK the promotion of cybersecurity R&D is within the framework of the ACE,
    which consists of universities that have passed the approval criteria of the `NCSC`
    and Engineering and Physical Sciences Research Council (`EPSRC`). In 2001, the
    `EPSRC` and `GCHQ` (Government Communications Headquarters) commenced the ACE
    framework for the purpose of enhancing resilience against cyberattacks. The `NCSC`
    has since taken this remit from `GCHQ`. The number of participating universities
    is 17 as of January 2019. Funding of approximately £20,000 is awarded annually
    to approved universities such as Queens University in Belfast, Bristol University,
    Royal Holloway, Newcastle University and Imperial College London. The key areas
    of R&D at these UK universities are the following:

    - Encryption, key management and related protocol

    - Information risk management

    - System engineering and security analysis

    - Methodology of information warranty

    - Operation warranty technology

    - Research of strategic technologies and product safety

    - Cybersecurity and science of human factors

    - Reliability and establishment of a highly reliable system


    The approaches of ACE-approved universities are the following:

    - `Imperial College London`: Secure and resilient software system engineering
    including operation systems and information assurance/security analysis and system
    verification

    - `Newcastle University`: Cybercrime using social technology, security assurance
    of infrastructure, cybersecurity science

    - `Queen’s University Belfast`: Cyber physical system security, real-time network
    analysis and virtualisation, high-spec/low-energy consumption cryptography architecture

    - `Royal Holloway`: Logical and practical encryption applications, social, technological
    and organisational perspectives of cybersecurity, information assurance of `RFID`
    (Radio-Frequency Identification) tag, smart tag and implanted devices


    ## Israel’s cybersecurity eco system


    Israel has a unique cybersecurity eco system through the military, the government,
    industry and academic institutions and accommodates the `Cyber Spark`, which produces
    many start-ups, and the academic, which concentrates on cybersecurity research.


    ## Academic eco system with its origin in the security area


    A cybersecurity research centre has been initiated at six universities including
    `Ben-Gurion University` and `Tel Aviv University`, which focuses on various areas
    such as policy and technology and the academic eco system. The driver of the eco
    system is investment in cybersecurity in the national defence area. In relation
    to producing future employees who are cyber aware to a high standard, education
    is the key. This begins at the middle-school level and continues with expert training
    during military service human resources. Once students who show aptitude for cyber
    studies graduate from high school and begin serving in the military, they are
    sent to cyber-related departments to gain further expert knowledge. After leaving
    the military, they will work at universities and in the private sector.


    ## Establishment of the Cyber Spark


    Under the initiative of Prime Minister Netanyahu and the National Cyber Agency,
    the `Cyber Spark` was established at `Be’er Sheva` in 2014, which forms a cluster,
    aiming to be an active eco system. Companies and ventures such as `Deutsche Telekom`,
    `EMC`, `Lockheed Martin`, `Oracle`, `IBM` and `JVP` have their offices at the
    `Cyber Spark` and there are many start-ups.


    ## Singapore’s national cybersecurity R&D


    The `National University of Singapore` and `National Research Foundation` are
    leading cybersecurity R&D institutions based on the `Cybersecurity R&D Programme`
    started in 2013. In 2016, the Singapore cybersecurity consortium was established
    as an organisation for collaboration between industry, the government and academia
    for the purpose of R&D, human resources and awareness of cybersecurity. The six
    themes in R&D areas that are focused on are outlined below. A budget of US$ 190
    million is allocated until 2020.

    1. Scalable trustworthy systems

    2. Resilient systems

    3. Effective situation awareness and attack attribution

    4. Combatting insider threats

    5. Threats detection, analysis and defence

    6. Efficient and effective digital forensics


    ## Innovation as key to success

