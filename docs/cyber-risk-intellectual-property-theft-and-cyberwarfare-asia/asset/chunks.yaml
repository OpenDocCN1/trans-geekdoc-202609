- fmt: '

    The C3.ai Digital Transformation Institute is a new research consortium that includes
    commitments from Princeton University, Carnegie Mellon University, the Massachusetts
    Institute of Technology, the University of California, the University of Illinois
    and the University of Chicago, as well as C3.ai and Microsoft. It is attempting
    to find expert scientists who can use AI to solve a number of social problems.
    It views the coronavirus as its first challenge. This new institute has been seeking
    novel ways of slowing the pathogen’s spread, speeding the development of medical
    treatments, designing and repurposing drugs, planning clinical trials, predicting
    the disease’s evolution, judging the value of interventions, improving public
    health strategies and finding better ways in the future to fight infectious outbreaks.[⁴](#ch19.xhtml#en163)


    ## Cyberwarfare


    As AI can be used for protective measures, such as fighting the coronavirus pandemic,
    it can also be used to operate cybersecurity systems that mitigate cyberattack
    by detecting hackers, their malware and blocking them. Such AI machine learning
    systems are already in operation within the realm of cyberwarfare. Stuart Russell,
    a computer scientist at University of California, Berkeley, noted that there are
    many weapons systems currently that use AI based on software transforming the
    technology already in use. The concept of artificial general intelligence that
    can operate on its own does not exist in practice at this point in time. Paul
    Scharre, a former Army Ranger now acting as a policy analyst, wrote in his book
    *Army of None: Autonomous Weapons and the Future of War* that over 30 countries
    already use defensive supervised autonomous weapons in situations where the speed
    of engagement is too fast for humans to respond. The most well-known of such weapons
    is the Israel Aerospace Industries Harpy. This is an armed drone that can maintain
    a presence high in the skies while surveying large areas of land until it detects
    an enemy radar signal and at this point it collides with the source of the radar
    warning, destroying both itself and the target.[⁵](#ch19.xhtml#en164) These type
    of AI high-tech cyberwarfare drones are not flexible but execute precisely what
    they are programmed to do. They are not just driven by military need but by high-tech
    companies that are expanding their AI products and services. This same technology
    can be used to prevent human error in relation to companies losing their IP through
    cyberattack as in cyberwarfare to destroy cyber-activated weapons out to destroy
    human targets for geo-political reasons.


    ## Future cyberattacks on IP, intelligence and AI


    Future cyberattacks on IP, trade secrets and intelligence will be from China and
    Russia. An alliance of these two authoritarian states is one of the greatest threats
    to democracy globally and the protection of IPR as a whole. A recent example of
    the dangers of such an alliance is that of the Turbine Panda. The latter is the
    name of a Chinese-based cyberespionage group that carried out cyberattacks on
    US aeronautics companies with the intention of stealing the IP blueprints of the
    components for the C919 custom built engine, which the Chinese state-owned enterprise
    `COMAC` (Commercial Aircraft Corporation of China) asked the US-based `CFM International`
    to create. `CFM International` is a joint venture between General Electric, a
    US firm, and Safran Aircraft Engines of France. Between 2010 and 2015, Turbine
    Panda Chinese state-sponsored hackers carried out cyberattacks against multiple
    companies that were component suppliers for `CFM International` such as Safran
    and Honeywell. Subsequently in August 2016 researchers noted that the `CJ-1000AX`
    engine made by a Chinese company in which `COMAC` became a recent shareholder
    produced an engine similar to the `C919`, especially in the turbofan blade design.
    Both `Crowdstrike Intelligence Reporting` and unnamed US government sources concluded
    that China used IP theft from insiders, joint ventures, forced technology transfer
    and cyberattack espionage to obtain the technical information it needed.[⁶](#ch19.xhtml#en165)
    The Chinese insider who carried out the IP theft worked for the French-Chinese
    joint venture `Safran Suzhou`. He was recruited by a Chinese intelligence officer
    who provided him with a `USB drive` with Chinese-developed `Sakula` malware on
    it, which the Chinese insider inserted into the `Safran Suzhou` computer system.
    This occurred in January 2014 and the two Chinese were eventually arrested but
    the cyberattacks have not stopped, with the goal being a Chinese-Russian substitute,
    which appears to be the `CJ2000` aircraft engine. Can future AI development stop
    such IP theft? A report by the Royal United Services Institute (RUSI) in April
    2020 commissioned by `GCHQ` points to increasing and more sophisticated cyberattacks
    on the intelligence communities. As adversaries will turn to cyberspace to launch
    cyberwarfare attacks, intelligence communities will be required to use AI to detect
    and stop them. The cyberattacks will be from state actors for geo-political reasons
    and by criminals, both groups using AI for attack purposes. The RUSI report notes
    that this will give rise to further complications such as new human rights and
    privacy, which will require new guidance on these issues. AI will be used in a
    number of ways in the future. One way it can be used is to mutate `malware cyberattacks`.
    This could, first, make it more difficult for normal computer systems to detect
    or, second, it could be used to re-programme drones to attack the senders. Other
    future uses could be to create what is termed `deep fakes`, which appear to be
    a real person but actually is manipulated image that could be used to persuade
    voters, for example, in an election to support a particular candidate. Therefore,
    AI will be used as a countermeasure against malicious hackers who are trying to
    use it to attack for geo-political or criminal reasons. It will be less effective
    in use for predictive profiling, for example, of terrorists as innumerable variables
    will dilute the effectiveness of its usage in this application. Consequently,
    AI will be developed incrementally rather than be instantaneous totally new mode
    of operation. Ethical considerations will also be of paramount importance in its
    development.[⁷](#ch19.xhtml#en166) Finally, whether it is deterring the theft
    of IP or dealing with issues of cyberwarfare, machine learning or AI will develop
    to be used to counter cyberattacks and hopefully within an ethical framework.
    Notes [1](#ch19.xhtml#fnen160)`Email phishing attacks rise 667 percent`, Sead
    Fadilic, *IT ProPortal* (31 March 2020). [2](#ch19.xhtml#fnen161)`Almost half
    of UK businesses suffered a cyber attack in past year`, Alex Scroxton, Security
    Editor, *Computer Weekly Online* (25 March 2020). [3](#ch19.xhtml#fnen162)`Willis
    Towers Watson launches customised cyber cover for shipowners`, Sam Horril, WLTW
    press release, London (28 April 2020). [4](#ch19.xhtml#fnen163)`A.I. versus the
    coronavirus`, William J. Broad, *New York Times* (26 March 2020). [5](#ch19.xhtml#fnen164)`A.I.
    is making it easier to kill (you). Here’s how`, Jonah M. Kessel, *New York Times*
    (13 December 2019). [6](#ch19.xhtml#fnen165)`Security firm revealed that China-linked
    APT group Turbine Panda conducted cyber-espionage operations aimed at various
    aerospace firms for years`, Pierluigi Paganini, *Security Affairs* (18 October
    2019). [7](#ch19.xhtml#fnen166)`UK spies will need artificial intelligence – Rusi
    report`, Gordon Corera, Security Correspondent, *BBC News Online* (27 April 2020).

