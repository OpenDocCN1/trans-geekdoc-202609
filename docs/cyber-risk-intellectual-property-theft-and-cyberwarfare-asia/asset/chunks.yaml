    # 2IP theft and cyberwarfare


    ## Where and by whom?


    The majority of technological advances are created and funded by a state’s military
    whether in the US, China, Britain or Russia. Therefore, it should be no surprise
    that a good deal of IP theft is related to the development of cyberwarfare. The
    object of the exercise is to gain an intelligence advantage in gathering data
    and blueprints of new defence strategies. Cyberattacks are being used to penetrate
    the defences of the relatively new arena of cyberwarfare that is led by generals.
    Such technological advances are secondly furthered by industry through research
    and design (R&D), often through shared patent pools. The aim is to outperform
    rival companies and dominate trade and manufacturing. IP theft is rife to gain
    market dominance. The exploitation of such technological advances and IP is often
    by geo-political forces that wish to undermine political rivals in other geographical
    locations or those considered domestic political enemies including terrorists.
    Finally, there is the pure criminal element of greed for personal advantage, personal
    inadequacy or malice that drives cyberattack and IP theft. The latter may not
    even be the main target but is part of the process of stealing something valuable
    for pecuniary gain. To complicate matters even further there exist state-sponsored
    hacking groups that target a variety of industries covered in this book for not
    only intelligence or patent gains, but also for pecuniary purposes. A new report
    from Fireeye notes that such dual cyberattack activity is both new and increasing
    in scope. A recent example of this tendency are the state-sponsored Chinese hackers
    who as a sideline use their hacking skills to carry out cyberattacks on cryptocurrency
    providers and gaming companies for their own personal gain. One group of Chinese
    hackers called Advanced Persistence Threat 41 (`APT41`) are the most effective
    of such state-sponsored cyberespionage hackers. Since its inception in 2012, `APT41`
    has carried out cyberattacks on a variety of organisations in 14 countries including
    the US, UK Europe and Asia. The main focus has been breaching the data systems
    of those companies in the healthcare, news, education, high-tech, telecommunications,
    travel and video gaming sectors. `APT41` and its sister organisation `APT10`,
    which specialises in attacks on utility companies such as the three in the US
    in July 2019, demonstrate that cyberwarfare based on geo-political rivalry, IP
    theft and personal greed can all meld into one in the cases of large cyberattacks.
    `APT41` has allegedly carried out IP theft on a large scale against pharmaceutical
    companies in the US and Europe, while gathering intelligence for the Chinese state
    on pro-democracy demonstrations in Hong Kong, which have been increasing recently.
    Financially motivated cyberattacks for individual gain have until 2014 been almost
    non-existent for Chinese state-sponsored hackers who are usually well-funded by
    the state. However, in 2014, video gaming companies became a target by these groups
    for personal pecuniary gain. Chinese state-sponsored hackers breached the video
    gaming systems such as `Fifa Online`, which has millions of followers. This can
    bring in millions of dollars in revenue to satiate individual greed for these
    hackers who also advertise their willingness to hack on a hire basis. The current
    trade war initiated by President Trump in relation to tariff rises has been linked
    to a great extent to IP theft by the Chinese state from the US government and
    companies. Even cyberespionage tools used by the US National Security Agency (`NSA`)
    have been stolen by a Chinese hacking group linked to the Beijing-based Ministry
    of State Security. `APT3`, also known as `Buckeye` or `Gothic Panda`, has been
    stealing hacking codes used by the `NSA` to infiltrate networks such as the disabling
    of the Iranian nuclear programme in 2010. The problem for the `NSA` is that such
    attacks leave traces of malware codes, which can be lifted and reconstructed to
    expose `NSA` tools. `APT3` is based in Mainland China’s south-eastern Guangdong
    Province and has been active since at least 2009. However, in 2019, as mentioned
    in Chapter 1 of this book, the US Justice Department charged and later prosecuted
    two members of `APT3` for stealing information over a six-year period, including
    IP from `Trimble`, a satellite software firm, `Siemens` and `Moody’s Analytics`,
    the financial services company. Chinese hackers have targeted many US sectors
    such as `NASA` space technology, aeronautics, defence, oil and gas companies and
    the biotechnology sector mainly to steal IP and private information. `APT3`’s
    theft of `NSA` tools was the first known instance of a foreign-based state group
    stealing codes through an active hack. This led Christopher Wray, the Director
    of the `FBI`, to state that Chinese state-sponsored hacking groups as the ‘most
    active perpetrators of economic espionage against us’ and ‘no country poses a
    broader, more severe and long-term threat to our nation’s economy and cyber-infrastructure
    than China’. The number of `APT` groups and the number of members of those `APT`
    groups keep increasing. Their cyberattacks on the US are expanding such as `APT40`’s
    attacks on research universities with ties to the US Navy.


    ## Counter accusations and IP theft


    Another example of how allegations and actual cases of IP theft are integrally
    linked to geo-political cyber and economic warfare are the recent counter accusations
    of the Chinese telecommunications company `Huawei` against the US and a case of
    patent theft by the Chinese company. `Huawei` has made accusations against the
    US government stating that the `FBI` had visited `Huawei` own employees’ homes
    trying to force them to spy for the US and had committed cyberattacks on the internal
    workings of `Huawei`. This was alleged without any evidence but within the context
    of the US government trying to block and persuade users and US telecommunications
    companies not to use `Huawei` equipment and not to sell them parts because they
    are seen as a security risk. Such action included requesting `Qualcomm` not to
    sell its microchips and `Google` its smartphone software. The US Commerce Department
    underscored this action by placing `Huawei` on a blacklist for exporting companies.
    The `NSA` already in 2010 had begun investigating and actually intruding into
    their servers to find out how `Huawei` operated as they were suspicious of their
    intent as a security threat. That has triggered the latest accusations by the
    US government connected to a report in the `Wall Street Journal` that `Huawei`
    had stolen patents from a Portuguese multimedia designer. `Huawei` noted in its
    statement that its representatives had met with `Mr Rui Olivera` in 2014 to discuss
    using his patented design for a smartphone camera but decided against using it.
    In 2017 `Huawei` had developed its own smartphone camera, which in 2018 `Mr Olivera`
    claimed was a violation of his US-based patents and he threatened to expose `Huawei`
    in the news media if they did not compensate him for this infringement. `Huawei`
    in turn filed in the US courts a request stating that they did not infringe `Mr
    Olivera`’s patent, which the US officials are still investigating.


    ## Cyberattack to fund IP theft for WMD

