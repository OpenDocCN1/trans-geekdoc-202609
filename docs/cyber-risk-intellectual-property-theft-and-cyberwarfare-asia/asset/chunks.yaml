    公众较少意识到美国曾利用网络工具进行的一项秘密行动，即在俄罗斯电网中植入代码。这些代码在平时不会被察觉，但一旦美国需要破坏俄罗斯公用设施，它们就会存在。俄罗斯已经具备通过在美国公用设施中植入恶意代码来破坏其设施的能力。现在美国也拥有了同样的可能性，通过放置一个定时炸弹来破坏俄罗斯公用设施，如果两国之间的冲突恶化为产生实体物理基础设施影响的网络战，这个炸弹就会被引爆。这种具有高度破坏性的基础设施破坏行为可能与轰炸一样致命，因为医院或养老院中大量没有电的平可能会迅速死亡。俄罗斯和伊朗等国家一样，并不希望与美国发生全面战争。这对所有参与方来说都太危险了。因此，迄为止，俄罗斯将网络战争作为一种短期战争手段，以产生有限且微妙的影响，例如在假装未干预的情况下干预选举，并支持有利于俄罗斯的候选人。因此，俄罗斯与其主要竞争对手美国之间的局势表现为一场消耗战，在可预见的未来不太爆发大规模的网络战争。然而，在世界各地都能看到俄罗斯干预的例子，他们利用网络工具对许多网络攻击技术并不先进的国家获取地缘政治影响力和权力。这可能仍处于核威慑的阶段，即我们需要一种威慑来防止被另一个实体攻击，但不会使用这种致命的手段。然而，网络工具正被用于开发服装和机器人，或许是为了参与实际的物理网络战。目前，这仍然是一场消耗战，而
    AI（本书后续著作的主题）可能对这种结果起到决定性作用。在随后的章节（`第 7 章`）中，我们还将讨论电网对网络攻击的脆弱性，以及远离此类网络风险和攻击的重要性。


