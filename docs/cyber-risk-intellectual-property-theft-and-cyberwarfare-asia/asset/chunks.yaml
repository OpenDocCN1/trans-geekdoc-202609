    如果不深入思考治理层面的影响，网络安全措施将永远无法实施。为网络风险保险建立统一标准是一种方法。另一种方法是建立一个全面的监管框架，该框架根据公司治理良好的企业的利益运行，并且本身就是一个独立的监管委员会。


    在处理影响保险单和保费的网络风险时，这种监管政策的智慧在美国的 `SEC`（美国证券交易委员会）中得到了体现，该机构是联邦政府的一个独立机构。它主要负责执行联邦证券法并监管证券行业，包括美国的电子证券市场。2018
    年 3 月 12 日发布的网络安全指南明确指出，上市公司必须拥有有效且恰当的**披露控制**。必须建立相关程序，及时准确地记录网络安全事件。该指南还鼓励公司考虑其政策、程序和控制措施如何防止基于与网络风险和事件相关的非公开信息（内幕交易）进行交易。尽管该指南没有引入新的概念和预期，但它鼓励公司既评估又收紧其现有的披露政策、控制措施和程序，以确保它们能够有效应对网络相关事务。


    `SEC` 以其极其严厉的监管以及对违反金融证券市场规则行为的巨额罚款而闻名，因此此类指南应鼓励公司在适当的情况下修订其网络风险措施。另一个 `SEC` 提供指导方针并鼓励美国证券公司评估和应对网络风险的例子是通过其报告。`SEC`
    于 2018 年 10 月 16 日发布了一份《调查报告》，以强调伪造或操纵电子通信的所带来的网络威胁。它敦促报告公司根据当前的风险环境加强并调整其内部会计控制。当时，`SEC`
    调查了来自多个不同行业的九家上市公司，这些公司是虚假高管或供应商发送的欺诈邮件的攻击目标。调查的重点在于确定这些公司是否因未能维持足够的内部控制而违反了联邦证券法。每家公司都遭受了至少
    100 万美元的网络诈骗损失，其中两家损失超过了 3000 万美元。联邦证券法要求上市公司维持内部会计系统，确保所有交易均在管理层的通用或特定授权下获得许可并经过审查。虽然被黑客攻击的公司已经制定了相关程序并更新了供应商数据，但在政策、程序和人为脆弱性管理方面仍存在漏洞，这些漏洞被黑客利用，导致任何保护措施都失效了。在这种情况下，`SEC`
    没有对这些公司采取行动，因为它们在这些网络攻击后尝试改进了授权程序和供应商信息变化的验证要求。这些公司还加强了账户对账程序和付款通知。最后，他们还为员工提供了有关相关威胁的培训，以及缓解此类网络威胁的政策和程序。在这种情况下，`SEC`
    向这些公司强调了有必要建立同时考虑到网络相关威胁和人为错误的内部控制系统。


    ## 保险公司数字化


    伦敦市场的一部分保险公司在整合数字时代以及应对网络风险、威胁和网络攻击所需的数字化流程方面进展缓慢。`Lloyd’s of London` 是伦敦最古老、最大的联合保险公司，其根源于
    1686 年由爱德华·洛德开设的一家咖啡馆（当时商人在此交换运输情报），该公司已开展了一项数字化驱动。


    `DBRS Morningstar` 对这一程序发表了评论，并将其与百慕大保险公司和再保险协会进行了对比。评论指出 `Lloyd’s` 采取了多项将其业务重组为数字化业务的措施。其中一项政策措施涉及
    `Lloyd’s` 为 2019 年 5 月概述的计划奠定基础，这些计划应在 2020 年第一季度显示成效。这是一个为期六月的过渡过程思考，旨在加强和加速对客户的保险风险保护服务，同时通过数字化增加业务便利性并降低成本。这是试图将
    `Lloyd’s` 引入数字时代，使其能够与其他成本较低的大型保险市场竞争。


    `DBRS Morningstar` 指出`Lloyd’s` 在其数字化、创新以及在 2020 年第一季度后将明确所需变更的战略方面取得了进展。这些推进数字化的变革对于提高承保业务效率同时增加在低成本保险市场的竞争力是必要的。`Lloyd’s`
    通过这些措施关闭了表现不佳的联合体，并提高了价格。


    `Lloyd’s of London` 曾因网站未更新而出现过问题。`PRA`（审慎监管局）于 2019 年 12 月对 `Lloyd’s` 实施了特别措施，因为发现供员工匿名举报不当行为和欺诈的热线已失效
    16 个月。此外，其网站上供成员提交代理人投诉的电子邮件和电话号码因信息过时而无人问津了数周。


    在本书作者看来，这种对大型、繁琐、纸质化保险公司的重组是迫切需要的，以确保它们能够提供符合当前日益增加的 IP 攻击和网络攻击现状的高标准网络风险保险。如果不将自己的公司数字化，就无法充分承保网络风险，并建立自己的网络威胁防御措施，以防止自己的组织成为网络攻击和损失的受害者。`Lloyd’s`
    的数字化进程在其 2018 年度报告中已取得成效，报告显示他们承保了全球约三分之一的网络风险份额，主要来自美国市场。


    ## 网络战争保险


    正如本书前面的章节提到的，网络战争正在兴起，利用网络攻击针对物理和非物理目标。目标包括电网、航运、军事设施和人员。这是一种非常新的网络风险，保险公司才开始思考需要保护的风险以及承保此类网络损失的内在价值。保险业的许多专家指出，在保险行业得出可行的解决方案之前，需要更多的共识和一致性。


    网络风险 – 保险的首要威胁


