    2019 年，俄罗斯成功测试了“联网”（Runet），将俄罗斯控制的互联网与全球互联网断开。俄罗斯用户在测试期间可能并不知道发生了什么，但结果会提交给普京总统。俄罗斯公众通过主流报纸《真理报》（Pravda）和当地报纸引用通信部副部长亚列克谢·索科洛夫（Alexey
    Sokolov）的话解释了这种情况，他将这些测试描述为应对新兴的网络风险和威胁，以确保俄罗斯联邦境内互联网和统一电信系统的稳定性。政府新闻社塔斯斯（TASS）报告说，测试显示俄罗斯互联网足够强大，能够阻止通过物联网进行的网络攻击以及来自外部的负面影响。俄罗斯还在开发定制服务，例如俄罗斯版维基百科，并通过了一项立法法案，禁止销售未预安装俄罗斯软件的智能手机。对于俄罗斯将全球互联网断开的行为，出现了许多抗议，特别是在
    2019 年 3 月，克里姆林宫通过了网络安全法案，许多俄罗斯人认为这些法案并非针对外部网络攻击的保护，而是将用于限制俄罗斯民众的信息来源。所谓的《数字主权法案》据俄罗斯政府声称将减少对美国互联网服务器的依赖，但遭到抗议者的挑战，他们认为该法案将增加克里姆林宫的审查，并压制异见以及言论自由。2019
    年 3 月通过的其他法案还禁止“不尊重”俄罗斯当局或推广他们所定义的“虚假新闻”的网络对谈。2019 年，活动人士还抗议媒体监管机构试图关闭加密消息系统 Telegram，因为俄罗斯联邦安全局（FSB）声称它是国际恐怖分子青睐的服务。


    ## 网络攻击与网络战


    英国国防总参谋长尼克·卡特爵士将军（Sir General Nick Carter）解释了数字时代如何模糊了战争与和平之间的界限，使网络攻击战成为日常常态。俄罗斯被特别点名，因为它创造了一种基于权和意识形态竞争的网络战争。美国将军佩特雷乌斯（General
    Petraeus）指出，俄罗斯具有复仇主义倾向，或试图恢复其曾作为一个不隶从于美国的国际力量参与者的辉煌旧日。卡特将军指出，如今俄罗斯俄的威胁比五年前大得多，因为它意识到物理战争正在消退，取而代之的是对信息的支配，以及通过控制信息传播将其部署到有利于黑客的地位上的能力。他明确表示，未来的战争将基于对信息的控制和熟练运用。卡特将军指出，北约必须适应冷战以来最大的未来挑战，这涉及让军队理解并接受参加网络战战斗的训练。根据卡特将军和佩特雷乌斯将军的说法，普京总统是一个巨大的催化剂，使北约意识到已经发生且未来将到来的新兴网络战战斗。他们都认为网络战的关键在于虚假信息以及否认自己是此类欺骗性信息的来源。这种战术为美英军事部队带来了困难，因为他们受法治指导，并受到公众舆论法庭的审判。卡特将军认为，找回失传的欺骗艺术是对抗俄罗斯网络攻击的核心，这些攻击现在已成为日益增长的网络战不可或的一部分。


    ## 俄罗斯人使用的社交媒体


    为了证实两位将军关于俄罗斯如何通过领导虚假信息网络战运动来恢复其认为的昔地缘政治主导地位的解释，社交媒体充斥着俄罗斯的虚假信息。2019 年 1 月，Facebook
    不得不删除约 500 个针对欧洲和中亚的误导性信息活动页面，这些活动主要与卫星社（Sputnik）的员工直接相关。卫星社是由克里姆林宫控制的机构，旨在全球范围内传播有关俄罗斯的有利信息。它对欺骗的使用是密集的，因为它通过与旅行、体育甚至天气相关的看似无害的新闻条目传播虚假信息。它通过假装向往往轻信的读者提供有用且中立的新闻来泄露虚假信息。Facebook
    网络安全负责人尼泽尔·格莱希尔（Nathaniel Gleicher）表示，他们一直在试图检测那些利用操纵手段、通过看似真实的文章和视频等内容推广其虚假信息计划的人。还存在在俄罗斯以外其他国家创建虚假账户的问题，其唯一目的是与卫星社分享内容。2016
    年美国总统大选期间，显而易见，Facebook 已成为一个通过虚假信息影响选民、煽动分裂和针对特定选民群体的主要平台。Facebook 认为，在拥有两亿用户的平台上检测出所有的虚假信息是困难的。Facebook
    一直试图追踪并删除源自卫星社的虚假和误导性账户。2019 年 8 月，Facebook 删除了 652 个源自俄罗斯集团的虚假账户，以应对影响美国选举和其他虚假信息的尝试。然而，正如网络战一样，这是一场持续的战斗，与克里姆林宫相关的俄罗斯机构在这些欺骗方面变得越来越狡猾复杂。大西洋理事会数字调查实验室发现，在
    2017 年 10 月的某一天，卫星社的内容针对亚美尼亚、车臣、爱沙尼亚、格鲁吉亚、拉脱维亚、立陶宛、吉尔吉斯斯坦和塔吉克斯坦。还创建了支持乌兹别克斯坦和塔吉克斯坦总统的粉丝页，但实际上是从俄罗斯运营的。俄罗斯网络战战略的一部分是通过社交媒体巨头针对许多国家的多数人，用欺骗性的网络虚假信息轰炸他们。


    ## 网络战进入拉丁美洲


    拉丁美洲国家是俄罗斯支持的网络战争的目标。网络影响活动始于十年前，随着数字技术的发展和社交媒体使用的增加。俄罗斯已成为委内瑞拉马杜罗（Maduro）总统最强大的盟友之一，并一直以此国作为跳板，传播阴谋论、虚假信息甚至赤裸裸的谎言，以破坏自由、民主政策。两家位于俄罗斯的西班牙语新闻机构是拉丁美洲国家此类虚假信息活动的前沿。其中一个是卫星世界（Sputnik
    Mundo），上述卫星社的西班牙语分支，部分内容在乌拉圭蒙特维亚制作，并在过去几年开始广播。另一个是俄语电视台西班牙语（RT Español），它声称每周覆盖十个拉丁美洲国家的
    1800 万，在 YouTube 上的观看次数超过十亿次。俄罗斯干预拉丁美洲国家政治事务的证据正在增加。例如，在玻利维，俄罗斯支持的推文每天少于 5 条，但在
    2019 年 11 月 10 日总统莫拉莱斯（Evo Morales）被迫辞职期间，俄罗斯的推特账户增加到 1000 多个。还发现在玻利维、厄瓜多尔、哥伦比亚、智利和秘鲁的一个为期
    30 天的时间段内，俄罗斯支持的账户在 90 分钟内发送了非常相似的消息。俄罗斯网络战战略的一部分是通过社交媒体巨头针对许多国家的多数人，用欺骗性的网络虚假信息轰炸他们。


