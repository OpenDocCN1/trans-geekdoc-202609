    Japan is a country that holds many contradictions in relation to dealing with
    managing cyber risk including IP theft and issues of cyberwarfare, which will
    be explored in this chapter. It is not widely known that IP theft is the most
    frequent form of cyberattack and cyber theft. Japan has been and is still an innovative
    country producing in the past the blue-emitting diode invented by Nakamura Shuji
    and currently being a leader in developing medical devices for the elderly. These
    all create IP especially in terms of patents. Japanese companies, because of the
    high costs of R&D, work together with other parts of their companies or external
    companies in terms of patent pools. This means resources and expenses are shared
    as well as the results of the patent that ensues. The Japanese government is one
    of the most methodical in the world in terms of preparing for cyberattack. This
    can be seen in the current preparations against cyberattack organised for the
    2021 Olympics in Japan. Plans are meticulously prepared in the smallest detail
    with hundreds of supporting diagrams and many committees. In Japan plans are coordinated
    from the bottom up to the top and then top down. Such preparations are often compared
    to preparing the roots of trees properly before the tress are moved in early winter.
    This is a decision-making process called `nemawashi.`[¹](#ch12.xhtml#en65) Such
    cyber readiness is then often undermined by the lack of computer literacy. When
    visiting many companies over the years, it never ceases to amaze me how many Japanese
    employees are computer illiterate all across business activity whether in the
    hospitality industry or medical services. Perhaps even more astounding is the
    minister in charge of cybersecurity that includes stopping cyberattacks through
    computers or mobile phones for the 2021 Tokyo Olympics, Mr Sakurada Yoshitaka,
    has never in his life used a computer and had little idea what to with a USB stick.
    He said since he was 25 years old and started his career, he always delegated
    any computer-related tasks to his staff and secretaries.[²](#ch12.xhtml#en66)
    Perhaps it is the Japanese concepts of `tatamae` and `honne` that enable Japanese
    with such contradictions: `tatamae` refers to how things should be while `honne`
    means how things actually are in reality.[³](#ch12.xhtml#en67) This means that
    any understanding of cyberattack in terms of IP theft, cyberwarfare, cyber risk
    and management requires an analysis rooted within this contradictory framework.
    To understand the strengths and weaknesses of cyberattacks in terms of IP theft
    and cyberwarfare on business it is essential to understand the organisation of
    the large corporate conglomerates (the `shogo shosha`) and their trading arms
    (the `keiretsu`) vis-à-vis their SME suppliers in the supply chain. This is because
    supply-chain SMEs are often the weakest link in which hackers, either individuals
    or state actors, use as a softer access point to carry out a cyberattack on the
    larger corporate organisation.


    ## Shogo shosha and SMEs


    Japanese companies originate from the traditional `zaibatsu`, which consisted
    of family-owned conglomerates such as the oldest `zaibatsu` Mitsui, which became
    a huge network of cross-shareholding firms. The nature of the cross-shareholdings
    were very secretive and only very trusted outsiders were let into the family dealings.
    Many subordinate companies such as `keiretsu` or trading arms were formed that
    have different names from the parent companies but are an integral part of them
    through cross-shareholding. `Zaibatsu` were banned by the American administrators
    after the Second World War and were replaced by `shogo shosha` that followed the
    same pattern of the `zaibatsu` but without ostensibly the family-centred control.
    The `shogo shosha` has at its centre, the financial heart, a bank. The Mitsui
    bank, for example, or the Mitsubishi bank lends finance and holds remittances
    from the other related company arms. This octopus-like structure that is all essentially
    inter-related, makes it very difficult for intruders in the form of cyberattackers
    to penetrate. Loyalty to the conglomerate organisation is at a premium and any
    that would try to undermine the tightly knit structure of the related companies
    would be socially ostracised and left in a very unpleasant position of extreme
    isolation.


    ## Group and hierarchal decision-making


    The emphasis on harmony and the group has its roots traditionally in wet rice
    agriculture where all members of the group are consulted with group consensus
    and harmony taking precedence over any other form of group organisation. Group
    consensus is both formal and informal but both solidify interpersonal relations.
    In companies, relationships between employers and employees are bound up with
    obligatory polite ritual that consistently emphasises rank and formality. Yet,
    the management by consensus from the top-down/bottom-up approach is linked to
    ideas of groupism with informality linked to ideas of egalitarianism. Therefore,
    once employers and employees are out of their offices, informal socialising takes
    place with often the most important socialising taking place. Control in Japanese
    companies is delegated down throughout all levels of management not just by senior
    officials. Delegation operates through the entire ranking system from `shacho`
    (president), `juyaki` (director), `bucho` (department head) and `kacho` (section
    head). The `hira-shain` (ordinary worker) is mainly involved in decision-making
    through quality circles and the suggestion system or in other limited ways that
    have direct implications for their jobs. The delegations throughout the company
    are real and not just token titles of delegation. Employees throughout the company,
    and even operators of their own machines, are actually given functional power
    over their environment and over the decisions needed to be made with regard to
    their working situations, but only to improve productivity. A department or section
    head can exercise quite a high degree of power and control over his own particular
    job requirements. This may be related once more to the basic cultural assumptions
    of egalitarianism and groupism with people trusting each other to govern, because
    they are expected to take responsibility. Social responsibility and the social
    pressure of potentially losing face obviates the need to be constantly constrained
    by laws. People are to be trusted by their superiors because of their social control
    function of obligation and consensus and therefore are empowered to be responsible
    for their own particular functions in the company, in society or in the family.
    The heavy emphasis on social consensus ensures that social control will compel
    people to behave in a socially responsible manner. Unwritten social ‘law’ governs
    the behaviour of the Japanese, even in circumstances such as terms of employment,
    in which a legal contract would be demanded by employees of a company in the West.
    Therefore, with such demands on loyalty, the binding constraints of obligation
    and being an integral part of the company decision-making, the possibilities for
    hackers to break into the closed ranks of Japanese company employees or for an
    internal employee to cyberattack another member of the same company is slim indeed.[⁴](#ch12.xhtml#en68)


    ## Supply-chain cyber weaknesses

