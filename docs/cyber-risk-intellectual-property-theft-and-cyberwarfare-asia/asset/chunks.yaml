    \ in 5G network’, David Bellamy with AFP, *Euronews Online* (26 July 2020). [9](#ch14.xhtml#fnen99)‘Huawei\
    \ is winning the argument in Europe as the US fumbles to develop alternatives’,\
    \ David E. Sanger and David McCabe, *New York Times* (17 February 2020). [10](#ch14.xhtml#fnen100)‘America\
    \ pushes allies to fight Huawei in new arms race with China’, David E. Sanger,\
    \ Julian E. Barnes, Raymond Zhong and Mark Santora, *New York Times* (26 January\
