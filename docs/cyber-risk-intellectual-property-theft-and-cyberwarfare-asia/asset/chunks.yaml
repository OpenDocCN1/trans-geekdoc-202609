    # 谁在通过黑客收集未经授权的数据进行这些影响知识产权的网攻击？


    美国司法部在 2019 年公布了对两名中国公民的起诉书，指控他们在 2014 年入侵了保险公司 Anthem，并在次的一年对其他三家未命名的美国企业进行了攻击。这些指控是美国官员一系列激进行动的最新进展，他们表示自己正试图打击中国对贸易秘密和个人数据的盗窃。


    在 Anthem 总部所在地印第纳波利斯的联邦大陪审团指控了来自深圳的 32 岁男子 `Fujie Wang`（王辉洁）和一名被指控为 `John Doe`
    的个人，合谋实施诈骗、电信诈骗和故意破坏受保护的计算机。起诉书称，从 2014 年 2 月 18 日开始，黑客利用所谓的“鱼叉式钓鱼”邮件，针对 Anthem
    的一家子公司以及至少另外三家其他公司的目标员工了攻击。起诉书表示，在不到一个月后，黑客就进入了 Anthem 的网络并搜索了大量的个人数据。


    起诉书指出，到 2015 年 1 月为止，黑客已获取了近 800 万条记录，包括 Anthem 客户和员工（包括 Anthem 的首席执行官）的社会安全号码、出生日期、邮政/电子邮件地址以及就业和收入信息。该公司于
    2015 年 2 月披露了这次攻击，而联邦人事管理局（OPM）在四个月后披露的一起重大泄露，这标志着中国网络间谍活动的一个转折点。


    此前，中国黑客主要关注窃取美国的贸易秘密——从本杰明·摩油漆配方到隐形轰炸机的蓝图无所不。但随着对 Anthem 和人事管理局的攻击，中国黑客对美国人的个人数据（特别是政府员工）表现出了新的兴趣。在在那两次泄露之后，其他持有大量个人数据的企业开始报告称自己也成为了目标。名单包括其他大型保险公司；大型信用报告机构
    `Equifax`（富信磊）；如 `万豪酒店集团` 这样的酒店客运公司；以及如 `英国航空` 等航空公司。


    被盗的数据从未出现在所谓的“暗网”上——在那里犯罪分子用其换取身份盗窃或其他计划——这表明攻击者的动机除了利润之外。安全研究人员和政府官员表示，他们认为被盗的数据正在被储存。这些数据可以用于多种目的，包括挖掘间谍及其同谋。例如，中国当局可以查看酒店预订，看看他们怀疑从事间谍活动的人是否在同一住在同一个城市。他们还可以利用敏感的健康和财务数据进行勒索。


    参议院听证会上来自 `FBI`（联邦调查局）的人员作证说，他们希望自己能采取更迅速的行动来阻止中国大规模招募美国研究人员从实验室窃取知识产权。`FBI` 反间谍部门助理主任
    `John Brown` 证实了参院小组委员会报告的发现，联邦机构行动的延迟让中国招募了这些人员，导致美国纳税人在无意中实际上资助了中国军事和经济的崛起。他表示：“根据我们现在对中国计划的威胁的了解，我们希望过去能采取更快速、更全面的行动。”Brown
    补充道，“补这一点的机会就是现在。”


    尽管中国在 2008 年宣布了“千才计划”，该计划最初计划招募约 2000 人，但到 2017 年已招募了超过 7000 人，这种知识产权窃取仍然发生了。尽管有这些警告，`FBI`
    直到 2018 年才以严肃的态度做出回应。目前中美贸易战的一部分在于华盛顿的诉求和不满，即中国一直在下文描述的多种非法手段以牺牲美国为代价走技术发展的捷径。中国政府则否认了间谍活动指控，并表示对此类犯罪进行起诉的实际案件具有政治动机且被夸大了。


    参议员还询问了来自`国家科学基金会`、`国立卫生研究院`、`能源部`以及美国务部的官员，可以采取什么措施来应对中国从美国窃取知识产权。`Maggie Hassan`
    参议员表示：“我非常希望这是我们在制定对抗这一问题的真正国家战略采取的第一步之一，因为显然中国有一个战略，而我们需要我们自己的。”共和党小组委员会主席 `Rob
    Portman` 和其民主党领军人物 `Tom Carper` 指出他们将利用该报告编写立法，结束这种对美国研究、知识产权以及资它们的纳税人资金的“滥用”。


    欧盟 (`EU`) 于 2019 年 10 月发布了一份报告，在未提及任何名称的情况下警告称，对欧盟利益敌对的国家可以使用其 5G 电信基础设施，在政治经济和社会的各个层面通过网络攻击制造破坏。然而，其暗示指向了中国电信巨头
    `华为`，该公司正因为这些网络安全风险被美国禁止。截至目前，`华为` 将不会被要求参与英国的 5G 开发。


    然而，利用网络攻击获取被盗知识产权的不仅仅是外国公司/国家的外部敌人。在美国，实施此类间谍活动的人被认为受到其他因素驱动。研究过间谍犯罪的美国官员创建了一个缩写来确立动机：`MICE`（金钱、意识形态、妥协和自我）。像居住郊区的
    `Kevin Mallory` 这样看似美国爱国主义者的人是那些被中国特工招募为他们窃取美国贸易秘密的典型。


    俄罗斯是另一个窃取知识产权、贸易秘密和数据的黑客大国。立陶宛银行指出，网络犯罪对其国内金融系统构成了最大风险。这就是为什么像立陶宛这样的小国在 2019 年的网络安全准备方面位列英国、美国和法国之后，他们安装了全面的网络安全系统并依靠创新来寻找网络解决方案。它在
    2017 年的联合国 (`UN`) 调查中网络安全就绪性排名第 57。从那以后，它一直在领导一项创建网络快速反应部队的欧盟倡议。


    ## 网络战争的定义与方向


    再次，战争并不是一个新课题，但遗憾的是自古以来一直是人类状况的一部分。人类战争的本质是对权力和支配他人的持续追求，无论是国家、部落还是个人。战争还涉及对资源、物质物品、任何形式的财产甚至是他人快乐的窃取。然而，传统战争正成为过去的遗迹，并被网络战争所取代。正如由于大国竞争和与非国家行为者的思想之战每天都在威胁着我们，英国国防参谋
    `Nick Carter` 所，英国“每天都处于战争状态”。


    > 我觉得现在正处于战争之中，但这不是我们过去定义的那种战争。


    '
- fmt: '

    General David Petraeus, former Director of the CIA and retired United States Army
    General, supports General Carter in viewing the future of warfare being waged
    online. He also believes cyberwarfare is being increasingly driven by China and
    Russia. He sees China’s unprecedented rise as a major power in the last 40 years
    coupled with Russia’s revanchist tendencies are the drivers in changing international
    norms concerning global warfare. He credits Russia with forcing `NATO` (North
    Atlantic Treaty Organization) to modernise and to understand that future warfare
    will take place in cyberspace and actual space. General Carter concurred that
    both China and Russia have broken the legal and ethical basis of what was known
    as armed conflict. He acknowledged that future warfare will become information-centric
    with control and manipulation of information at the core of any conflict.


    ## Cyberwarfare and insurance


    The insurance industry is again reflecting current reality when trying to define
    the nature of cyberattack. A new report by `Capsicum Reinsurance` makes it clear
    that the insurance industry will not be able to rely on traditional methods for
    determining whether cyber should be considered acts of war. The report suggests
    that cyber should be viewed as a peril and from that starting point decide how
    to insure it within the warfare context.


    ## Cyberwarfare and political interference


    Russia is using a new type of cyberwarfare that adds a new dimension to the definition
    of warfare. It is using a hughly effective form of political and disinformation
    warfare that is much more effective than conventional warfare. It targets very
    specific political weaknesses such as elections and leaves the rest such as banks
    or infrastructure alone. This way Russian hackers can expend as little time and
    money without killing a single person or causing obvious physical damages, leaving
    the leader of a country to carry out policies favourable to Russia without being
    detected. Cyberattacks involving disinformation are indirect, difficult to trace
    and can be moved from one platform to another quickly. This is reflected in current
    concerns about the forthcoming 2020 elections in the US. The 2016 elections were
    more supportive of the Republicans with Trump as their leader due to concerted
    Russian interference through social media. This ranged from disinformation frightening
    voters with false descriptions of `Hilary Clinton’s` bad behaviour and untrustworthy
    character to non-existent Americans giving testimony why voters should not vote
    for `Clinton`. There is concern that in not providing all political party candidates
    in the US a cybersecurity fund that provides cyber protection against such Russian-backed
    political cyberwarfare attacks will again bias the election against the Democrats.
    The attempt to provide such cybersecurity funding to all running for election
    was squashed by `Mitch McConnell`, the Republican leader of the Senate who supports
    the idea that individuals and parties should provide their own cybersecurity.
    It is increasingly clear that the costs of hiring private cybersecurity companies
    for electoral fairness is way beyond the means of most political parties and individuals.
    In Britain, the Army has been recruited to wage a cyberwar against Russian political
    interference, such as false items on social media that disparage the effectiveness
    of the Army, by deploying soldiers to work on social media to block such potentially
    damaging interference. Lieutenant General `Ivan Jones`, Commander of the Field
    Army, will be using his forces to counter malign Russian influence and that of
    terrorist groups such as `Isil` digitally through social media.


    ## Cyberwarfare IP theft


    Yet, a non-political but physically damaging form of cyberwarfare can become a
    reality and is linked to IP theft. The `Washington Post` reported in 2018 that
    the Chinese state hacked into an American Naval contractor and stole a significant
    amount of very sensitive data related to submarine warfare.


    ## Cybermercenaries


    A new type of mercenary is emerging alongside the advent of cyberwarfare. This
    is the cybermercenary for hire to carry out acts of computerised warfare. War
    is being outsourced and privatised to a new group of cybermercenaries. The attraction
    of cybermercenaries for nation-states is that they can be used as non-state actors
    who are difficult to trace especially when doing the ‘dirty work’ the state wants
    to distance itself from such as the Russian hackers cyberattack in 2015 on the
    Ukranian government’s IT systems, which caused hudreds of millions of dollars
    damage worldwide. Cyber hackers for hire can implicate others and cover their
    tracks more easily as they can move from one country to another rapidly and often
    without trace. In the conflict with Iran there is growing evdence that the US
    is moving away from coventional warfare methods to use a more two-pronged hybrid
    form of cyberwarfare. The US had all conventional methods of warfare attack ready
    but stopped it short of ten minutes of air strikes being launched in retalitaion
    for the destruction of a US$ 130 million drone in international waters of the
    `Straits of Hormuz` and attacks on non-Iranian oil tankers in the area for which
    the US had pictures and Iran denied responsibility. The US then launched cyberattacks
    instead. The goal was to develop operations similar to the shadow war the US has
    accused Tehran of carrying out through cyberattacks directed at the US by the
    `Iranian Revolutionary Guards Corps`. The cyberattacks were targeted at an Iranian
    intelligence group that American officials believe was behind the series of attacks
    on tankers and was intended to shut down the computers and networks used by the
    intelligence group, even temporarily. Another separate online operation was aimed
    at destroying computers that control Iranian missile launches. This shadow hybrid
    warfare uses indirect means through cyber and actual physical attack to, for example,
    make insurance premiums, this time `Lloyd’s`, excessively high in the Persian
    Gulf region upon which the US and Europe as well as Japan depend on for oil. Iran
    in June 2019 had been using hackers, most likely government sponsored, to cyberattack
    US government agencies and key economic sectors such as oil, gas and finance by
    sending waves of phishing e-mails according to cybersecurity companies such as
    `CrowdStrike` and `FireEye`.


    ## Sectoral targets of cyberattack


    In this book we will also look at different industrial sectors increasingly affected
    by cyberattack, which has implications for IP theft and cyberwarfare. Power grids
    are the most often attacked followed by oil and gas. The latter has complex systems
    of networks and physical infrastructure globally. It is often hostile states that
    are the main perpetrators of such attacks but it can also be other types of hackers
    who are interested in extorting money. The attack on the `Saudi Arabian Aramco`
    oil installations was an early incident of cyberwarfare.


    ## Shipping and aviation sectors

    '
