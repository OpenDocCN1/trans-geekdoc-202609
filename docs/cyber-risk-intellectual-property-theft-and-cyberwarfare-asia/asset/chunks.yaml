    The aim of using this newly developed cyber defence for the maritime trade is
    to prevent hackers shutting down port operations, paralysing supply chains, damaging
    systems that can result in loss of human life, and causing financial as well as
    reputational damage. The annual throughput of the port of Ashdod is 1.5 MTEU (1.5
    Million Twenty-foot Equivalent Units or 1.5 million standard containers that are
    twenty-foot globally), the largest volume of containers for the whole of Israel.


    In 2018, `BIMCO` (the international shipowners’ association) found that it could
    not wait for regulators to introduce cybersecurity clauses as cyberattacks against
    vessels and ports were increasing. Therefore, it introduced a cybersecurity clause
    into its charter party agreements and other contracts from May 2019. It includes
    protection of both `IT` and `OT` systems that are vulnerable to cyberattack. `IT`
    systems require protection against fraud, `IP` and data theft while `OT` needs
    cybersecurity to mitigate the effects of threats to critical systems such as navigation
    or hotel systems, ensuring the safety of crews, passengers and vessels.


    Shipowners have traditionally had problems insuring their `PC` systems against
    cyberattack so the `BIMCO` clause incorporates this coverage. `BIMCO` has stated
    that liability for cyberattack should not exceed US$ 100,000 but other amounts
    could be negotiated during the contract stage. `BIMCO` represents not only shipowners
    but also managers, trade brokers and other stakeholders. It is an organisation
    that tries to simplify and influence international trade agreements related to
    shipping.


    The Norwegian National Security Authority (`NSM`) in summer 2019 warned of increasing
    cyberattacks in the maritime sector and proposed countermeasures. The `Norwegian
    Maritime Authority` has been warning shipowners and shipping companies that hackers
    have been using social media such as `LinkedIn`, `Facebook Messenger` and `WhatsApp`
    to install malware on e-mails and not to open attachments connected to social
    messages.


    The `Norwegian Maritime Authority` recommended that networks should be segmented
    with all physical connections between administrative and operative parts separated.
    The `NSM` recommended that ships use encrypted communications between vessels
    at sea and land-based infrastructure. `P&I` (protection and indemnity) Club `Gard`
    recommended that all ships report cyberattacks immediately to the national security
    authorities and ensure that their management systems are ready to deal with cyber
    risks by 1 January 2021 as required by the `ISM` (International Safety Management)
    Code `IMO`.


