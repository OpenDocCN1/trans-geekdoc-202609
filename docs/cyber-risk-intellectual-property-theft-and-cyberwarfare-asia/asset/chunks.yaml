    \ and fierce storms all cause damage and pose threats to factories, corporate\
    \ physical assets and supply chains. Operational disruptions that lead to relocation\
    \ of facilities all constitute greater risk. Litigation is increasing in relation\
    \ to carbon issues, especially in the US, which complicates insurance underwriting\
    \ and places greater pressure on the role of risk managers.[^(15)](#ch18.xhtml#en156)\
    \ Cyber-risk assessment is so important to insurance underwriters because cyber\
    \ threat and attack are increasingly causing the risk and damage for insurance\
    \ claims. It is also important for insurers in general as they are becoming the\
    \ target of hackers. US insurer Chubb, which is a major player in the cyber insurance\
    \ market, seems to have been the target of a ransomware attack.[^(16)](#ch18.xhtml#en157)\
    \ \n\n## Future issues for cyber insurance\n\n## Standardisation of policy wording\n\
    \nA present and future challenge to the assessment of the outcome to such scenarios\
    \ is the standardisation of policy wordings. A danger to both such standardisation\
    \ and assessing such scenarios is not having clear, robust exclusions and also\
    \ ambiguity of wording, which allows for many different interpretations. The author\
    \ of this book, when having an IUA-supported book launch of her *Managing Cyber\
    \ Risk in the Financial Sector* book in 2016, noted in her presentation and in\
    \ her book that a lack of rigorous use of standardised language only leads to\
    \ unsatisfactory cyber-risk underwriting as in the end neither the insurers nor\
    \ the insureds understand fully for what they are being covered. This is especially\
    \ the case in cyber IP theft where the cyber risk is complicated by the sophistication\
    \ of valuing the worth of IP and in many cases the theft of trade secrets. \n\n\
    ## Silent cyber vs affirmative"
