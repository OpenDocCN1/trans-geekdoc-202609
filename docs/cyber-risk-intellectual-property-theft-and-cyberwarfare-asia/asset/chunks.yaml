    # 6 美国


    2019 年夏季，美国国防部下属国防信息系统局（DISA）控制的计算机遭到黑客攻击，盗取包括姓名和安全号码在内的 20 万名人员的个人数据。DISA 有 8,000
    名军职人员和平职员工，但它也处理其他个人的数据。讽刺的是，该机构是白宫负责军事通信安全的部门，包括通过移动设备和电话进行的总统通话。更令该机构及相关人员深感警觉的是，其职责范围还包括军事网络安全责任，并组织战区的通信。在在其官方网站上，DISA
    将其使命描述为“……成为连接和保护网络空间作战人员的信赖提供者”。美国国防部未透露网络攻击的实施者身份，但确认已迅速采取措施修复并阻止进一步的此类攻击。2020
    年 2 月，官方已向数据被攻击泄露的人员发送了信函，提议协助减轻任何损失并提供免费的信誉监控服务。[¹]


    ## 谁在网络攻击美国？


    正如`第五章`中关于中国的介绍，有许多地缘政治对手负责针对政府和军方官员个人数据的网络攻击，旨在招募他们从事间谍活动、渗透和网络战争。除了俄罗斯和中国外，伊朗和朝鲜处于此类攻击的最前沿。在
    2018 年 12 月一次可能旨在破坏朝鲜领导人金正恩与特朗普总统及其顾问之间谈判的尝试中，韩国统一部报告称，位于庆尚北道一个朝鲜离亡者定居中心的一台台式电脑上被安装了恶意程序。该中心是
    25 个定居中心之一，旨在帮助约 32,000 名朝鲜离亡者适应韩国的生活。在个人信息被盗窃的离亡者中，至少有 997 人收到了通知。这引起了他们的焦虑，因为他们不知道在朝鲜的家人是否会遭到攻击。朝鲜没有能力查明本国离亡者的身份，但这种攻击将有助于他们。这还可能协助他们重新捕捉离亡者，并就美国的军事盟友韩国对其进行审问。朝鲜网络战争专家西蒙·崔伊（Simon
    Choi）认为，这是朝鲜政府黑客组织所为，他们试图寻找朝鲜离亡者的姓名和详细信息，并指出另一个定居中心在去年也遭过攻击。[²] 与中国违反联合国制裁相似（例如`华为`违反对伊朗的制裁，以及在银行不知情的情况下将`汇丰`（HSBC）作为伊朗非法收益洗钱的渠道），朝鲜一直在规避制裁。为了无视美国和联合国对其施加的制裁，朝鲜利用网络空间对美国金融机构发动复杂的网络攻击，并通过加密货币交易所产生收入。一个参与编写关于朝鲜违反制裁报告的联合国专家小组发现，政府黑客通过网络手段非法迫使金融机构和加密货币交易所进行转账，洗白收益以产生收入并规避制裁。与使用传统银行相比，加密货币的使用难以检测和追踪，这也是朝鲜对`比特币`等加密货币交易所发动大规模网络攻击的主要动机。[³]


    ## 洗钱


    两名为臭名昭著的朝鲜黑客组织“拉撒斯集团”（`Lazarus Group`）工作的中国籍人士洗白了 1 亿美元的被盗加密货币。其中 140 万美元通过出售`比特币`换取预付的
    Apple iTunes 礼品卡进行洗钱。美国官员指控`田荫音`（Tian Yinyin）和`李家东`（Li Jiadong）充当“拉撒斯集团”的钱骡，该组织负责
    2017 年的`WannaCry`全球网络攻击以及 2018 年对某未名加密货币交易所的入侵。根据起诉书，这对两人在 2018 年入侵了一家虚拟货币交易所，盗取了价值
    2.5 亿美元的货币。这些资金通过数百次自动加密货币交易进行洗白，以避免被任何执法部门发现。据指控，部分洗白的资金被朝鲜政府用于改进其网络基础设施，以从美国金融行业窃取资金。[⁴]
    这些为了非法利益而进行的违制网络攻击与网络战争有关，因为非法资金很大用于资助美国和联合国试图停止的核导弹计划。尽管金正恩与美国政府进行了多年谈判以停止核弹道导弹的生产和测试，但他及其父祖祖从未真正打算抑制其核意图。[⁵]


    ## 勒索软件


    根据 FBI 调查，勒索软件攻击是最常见的犯罪攻击，不仅为网络犯罪分子获取了大量非法资金，还干扰了受攻击政府机构和公司的运营。这些攻击之所以如此有效，是因为它们使用了难以追踪的加密货币和消息平台，允许他们匿名与受害者进行通信和交易。另一个问题是，黑客居住在美国法律管辖范围之外，因此即使美国执法部门发现了网络犯罪分子并对其提起诉讼，他们也永远不会受到引渡。这些网络犯罪分子大部分源自朝鲜、伊朗和俄罗斯，美国与这些国家没有引渡条约，且其政府要么发起了攻击，要么共享了泄露的文件，这些文件包含了大量有用信息，如美国政府和军事官员的个人数据、IP
    地址、贸易秘密以及用于网络战争的军事信息。[⁶]


    ## 针对选举的网络攻击


    2019 年 7 月，汤·伯特（Tom Burt）向科罗拉多州阿斯彭安全会议的人解释说，微软有证据表明俄罗斯、伊朗和朝鲜黑客是进行网络攻击最活跃的国家。微软公司副总裁汤·伯特进一步将网络攻击的焦点缩小到三个针对与美国政治竞选合作的非政府组织和智库的国家。在伊朗案例中，微软在
    2019 年 10 月的一份报告指出，伊朗政府支持的黑客发起了超过 2700 次黑客攻击，旨在识别美国现任和前任政府官员、报道美国政治竞选的记者以及与某个主要美国总统竞选相关的电子邮箱。黑客进一步攻击了
    241 个账户，并在利用受害者在线个人资料信息发现其密码时，在四个案例中成功了。许多此类受政治驱动的网络攻击使用了俄罗斯人在 2016 年美国大选中使用的技术。[⁷]


    ## 与伊朗的网络战争


