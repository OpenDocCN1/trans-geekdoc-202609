  raw: 'Data breaches through IoT or otherwise are being taken very seriously by both
    governments and companies through regulations and fines. Personal data being breached
    by hackers who then pass it on for use by fraudsters has been increasing rapidly
    and making companies realise that it is their responsibility to ensure personal
    data entrusted to them is not breached in any manner. The recent cases of British
    Airways and Marriott Hotels are a case in point. The Global Data Protection Regulation
    (GDPR) was introduced on 25 May 2018 in the EU jurisdiction. British Airways was
    fined more than £183 million by the Information Commissioner’s Office for the
    breach of a wide range of personal data of half a million of their customers.
    This seems to be a very large fine but Darren Wray, CEO of Fifth Step a cyber
    resiliency consultancy, noted that the EU regulator could have fined British Airways
    up to 4% of their annual revenue, instead of 1.5%, which would have added £300
    million to the total fine.[^(40)](#ch10.xhtml#en43) British Airways was criticised
    by the Information Commissioner’s Office for not even ensuring basic customer
    data protection such as rudimentary encryption. The Marriott international hotel
    chain has been fined £123 million for their 2018 data breach of personal customer
    information under GDPR and intends to fight it.[^(41)](#ch10.xhtml#en44) Throughout
    the EU in 2018 there were 206,326 cases of cyberattacks involving data breaches
    with 52% now closed, 47% ongoing and 1% appealed.[^(42)](#ch10.xhtml#en45) Not
    all firms have integrated GDPR practices into their businesses as yet and for
    SME companies it is costly, if not financially impossible, to hire a data protection
    officer. IP can be seen as both personal and company owned depending on whether
    it is a sole inventor, single company or patent pool invention. How will legislation
    evolve to cover breaches of IP and who will be deemed responsible for such breaches?
    Will the defence departments of governments be seen as responsible when IP concerning
    defence plans is breached? IP is much more complicated when theft takes place
    as the implications are much wider, affecting individuals, companies and governments
    including infrastructure, defence, education and so forth. The complications of
    IP, especially through the IoT, not only make it more difficult to protect but
    also to insure. The extent and variation of cyberattack is expanding at such a
    rapid rate that insurers protecting companies both large and small and across
    all sectors are not able to update their cyber products rapidly enough and are
    even unsure what are the best policies to offer. In, for example, industries such
    the maritime sector, the data upon which experience is based to formulate policy
    cover are not extensive enough. Many of the cyber risk insurance products focus
    on BI, which is inadequate for the maritime sector as it has to deal with damage
    resulting from to the loss of vessels’ IP data through theft and GPS navigational
    attacks. The most difficult problem in creating a comprehensive insurance policy
    for the maritime sector surrounds exclusion, which also exemplifies the heart
    of the matter surrounding the management of cyber risk/attack explored in this
    book. This is how we define whether a cyberattack is a result of war or crime.
    Is a terrorist derived cyberattack an act of war or is it basically a crime when
    it involves, for example, hacking into a vessel’s navigational system to change
    the course of a ship to land where it can be robbed of its content to fund terrorist
    activities? The theft of data, IP, or locking companies or public services out
    from their data such as the WannaCry ransomware attack did can be considered both
    an act of war and a crime. Is the physical destruction of infrastructure through
    cyberattack an act of war or a crime? The overlap between the two needs to be
    explored and definitions/analysis expanded, which we do in subsequent chapters.
    Notes [1](#ch10.xhtml#fnen4)A debate covered in my last few books such as *Managing
    Cyber Risk in the Financial Sector: Lessons from Asia, Europe and USA*, Abingdon:
