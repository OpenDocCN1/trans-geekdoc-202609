  raw: "It is the intangible aspects of IP that makes it so vulnerable to cyber risk\
    \ and attack affecting business and trade relations worldwide. It can operate\
    \ at a number of levels and in all types of industries as this book will demonstrate.\
    \ Levels include industry, government, military defence establishments and businesses\
    \ of all sizes. The geo-political, trade sectors and finance including banking\
    \ and insurance are all prey to this 21st-century digital-age menace. Some industries\
    \ are more prone to IP theft, cyberattack and potential/variants of cyberwarfare,\
    \ often in unexpected ways, such as shipping, national grids, defence systems\
    \ and retail banking systems. Examples as in previous books are mainly from Japan,\
    \ Europe and the USA but in terms of the shipping sector, for instance, it can\
    \ occur anywhere in the world because of global trade routes. Cyber risk/attack\
    \ and IP theft are very broad topics that touch most aspects of our lives but\
    \ often most of us are not even aware of them or the remedies for dealing with\
    \ them occurring at all different levels. For example, in the insurance industry,\
    \ which through underwriting should cover a wide range of cyber risk, is only\
    \ now dealing with silent cyber risk. Two new London Market model clauses to help\
    \ underwriters manage cyber losses have been published by the International Underwriting\
    \ Association (IUA). The wordings have been developed in order to address issues\
    \ of non-affirmative or ‘silent’ cover, where traditional insurance policies may\
    \ unintentionally suggest protection for undefined cyber risks. The importance\
    \ of wordings cannot be underestimated as explained in my presentation book launch\
    \ of *Managing Cyber Risk in the Financial Sector* in the City of London on 16\
    \ March 2016 supported by the IUA. I stated that: \n\n> Insurers were left in\
    \ a difficult position because of the dearth of facts and detail. We are dealing\
    \ with a new phenomenon where people do not even know the language to use to describe\
    \ cyberattack, and how can you deal with something when you do not share a common\
    \ language? \n\nSince then definitions of cyber words used in insurance documents\
    \ have moved forward.[⁸](#ch10.xhtml#en11) First, a Cyber Loss Absolute Exclusion\
    \ Clause (reference: IUA 09-081) provides market participants with an option to\
    \ exclude in the broadest possible manner any loss arising from the use of a computer\
    \ system, network or data – each of which is clearly defined. Meanwhile, a Cyber\
    \ Loss Limited Exclusion Clause (reference: IUA 09-082) enables only the exclusion\
    \ of losses directly caused by cyber events, rather than ‘directly or indirectly’.\
    \ Chris Jones, IUA director of legal and market services, said: \n\n> These two\
    \ new model clauses provide broad policy exclusions which may be utilised as a\
    \ starting or reference point for underwriters offering cover for traditional\
    \ business classes that may include an element of cyber risk. By developing class-specific\
    \ write backs insurers can then explicitly state the extent of any cover provided\
    \ for such losses. \n\nBoth clauses were developed in response to concerns expressed\
    \ by the Prudential Regulation Authority (PRA) about potentially unintended or\
    \ unclear provision of coverage for cyber risks in various classes of insurance\
