    2019 年春季，全球最大的网络设备供应商华为向美国电信公司威信森（Verizon）写了一封信，指控其侵犯了华为 238 项专利。华为要求威信森为其专利组合购买许可。威信森的回应是，通过华为提出的中方指控和要求具有地缘政治性质，是一个更广泛的问题，影响到所有美国科技公司，而不仅仅是威信森。电信领域的许多专家认为，这些专利要求的根源在于华为被排除在美国的智能手机市场之外，因此它正试图通过专利侵权指控来索取收入。这些索赔涉及无线技术和网络设备，可能为华为带来超过
    10 亿美元的费用。这些索赔将相当于间接赔偿，因为威信森并不使用华为的产品，仅通过其采购设备的的 20 多个供应商进行间接使用，而这些供应商的设备可能使用了华为的部分技术。因此，知识产权窃取不仅可以通过偷取其他公司的专利来避免研发成本，还可以通过对其自身窃取行为的指控，向所谓的专利侵权者勒索收入。


    ## “狼性文化”


    在围绕知识产权窃取（无论是来自美方还是中方）的所有冲突和反控中，已有确凿证据表明华为试图通过所有的网络设备使用后门通道。5G 时代后物联网（IoT）方面的全面性——它们通过物联网连接在一起——构成了最大的风险。从未有一个电信系统通过物理路由器和交换机连接过如此互联的设备。海量信息数据在极少人工干预的情况下通过网络传输，使得黑客有可能在网络所有者未察觉的情况下截获数据。华为以所谓的“狼性文化”闻名，没有什么能阻止这家公司极力推压员工，为了公司的增长可以不择手段。这导致了华为首席财务官孟万洲在美国的要求下在加拿大被捕，涉与银行欺诈和违反对伊朗的制裁有关。华为于
    1999 年进入伊朗市场，并在十年内通过其光纤电缆连接了 130 个城市。到 2009 年，华为已成为伊朗电信硬件的主要供应商。然而，在不久后的 2011
    年，由于伊朗的核计划，联合国和美国对与伊朗的业务实施了新的制裁。华为宣布将不再与伊朗开展新业务，并将限制与现有客户的业务。然而，在孟万洲保释听证期间公开的一份宣誓书中，显示华为使用一家名为
    Skycom 的公司作为非官方子公司，以维持伊朗业务的正常运行。她利用首席财务官的角色向汇丰银行（HSBC）等银行保证，华为没有违反美国或联合国的制裁。根据宣誓书，汇丰银行通过其美国子公司，诚意地在
    2014 年之前与伊朗的 Skycom 处理了超过 1 亿美元的交易。华为的此类行为是其多项涉嫌洗钱、知识产权窃取、通过网络攻击非法收集数据和间谍活动的活动之一，这些活动可能赋予华为技术主导地位，以及通过物联网控制全球网络的能力（物联网也与网络战能力相连），这正是为什么关于允许华为不仅在“五眼联盟”国家、而且在其他国家运营
    5G 网络的讨论会如此激烈激烈的原因。


    ## 华为提起诉讼


    2019 年 3 月，华为提起了一项诉讼，指控美国政府通过一项限制其与美国联邦机构及其承包商开展业务能力的法律，违反了其宪法权利。一位位于德克萨斯州的美国联邦地区法院法官阿莫斯·马赞特（Amos
    Mazzant）在一份 57 页的判决书中支持了美国国会，其中包括《国家国防授权法案》（NDAA）中的限制。限制不仅限于华为，还包括另一家电信公司中兴（ZTE）。华为对这一决定表示不悦，在裁决后表示，`NDAA`提供了一种虚假的安全感，同时损害了华为的宪法权利，并将将寻求其他的法律手段。


    ### 注


    [1] “中国的网络犯罪是不可接受的，”罗森斯坦，Katie Benner, Julian E. Barnes 和 Glenn Thrush，《纽约时报》，2018
    年 12 月 20 日。

    [2] “随着特朗普和习近平见面，知识产权成为焦点，”Alan Rappeport，《纽约时报》，2018 年 11 月 28 日。

    [3] “数据泄露追踪到中国，美国正准备打击，”David E. Sanger, Nicole Perlroth, Glenn Thrush 和 Alan
    Rappeport，《纽约时报》，2018 年 12 月 11 日。

    [4] “中国如何 LinkedIn 招聘间谍，”Edward Wong，《纽约时报》，2019 年 8 月 28 日。

    [5] “中国以强硬言辞否认此事，”Paul Mozur，《纽约时报》，2020 年 2 月 13 日。

    [6] “汇丰：美国指控四名军事人员进行大规模攻击，”Gordon Corera，《BBC 新闻》，2020 年 2 月 11 日。

    [7] 引用自《纽约时报》，2020 年 2 月 18 周二。

    [8] “欧盟坚持欧洲公司可以替代华为，”David Bellamy AFP，《欧洲新闻在线》，2020 年 7 月 26 日。

    [9] “由于美国未能开发替代方案，华为在欧洲赢得了论，”David E. Sanger 和 David McCabe，《纽约时报》，2020 年 2 月
    17 日。

    [10] “美国推动盟友在新的军备竞赛中对抗华为，”David E. Sanger, Julian E. Barnes, Raymond Zhong 和 Mark
    Santora，《纽约时报》，2019 年 1 月 26 日。

    [11] “据称华为向威信森索要专利费，”Paul Mozur 和 Edmund Lee，《纽约时报》，2019 年 6 月 12 日。

    [12] “华为的‘狼性文化’帮助其增长但也使其陷入麻烦，”Raymond Zheng，《纽约时报》，2018 年 12 月 18 日。

    [13] “法院拒绝华为对美国限制的挑战，”Lam Yik Fei，《纽约时报》，2020 年 2 月 19 日。

    [14] 有许多关于三星与苹果之间长期侵权诉讼的书籍和报告。例如，参见 Ruth Taplin (编),《金融领域的网络风险管理：亚洲、欧洲和美国的教训》，Abingdon:
    Routledge, 2016 以及《知识产权估值与创新：迈向全球统一》，Abingdon: Routledge, 2014。


