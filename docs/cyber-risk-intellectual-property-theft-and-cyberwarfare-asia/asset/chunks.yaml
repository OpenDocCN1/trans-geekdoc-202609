    Japan, although suffering from theft of its IP through cyberattack, has also the
    corresponding problem of not investing enough or creating new innovations to sustain
    a strong economy. When it does allow innovative ideas to come to the fore such
    as the `Tsuruoka Science Park` innovation that not only creates brilliant new
    inventions but also revitalises regions that are losing their youth to Tokyo,
    there is great resistance to such innovative ideas. Cyberwarfare is not an immediate
    threat as Japan tries to keep itself geo-politically neutral and the culture is
    a closed one that would not easily be affected by election interference and disinformation
    campaigns by foreign powers.


