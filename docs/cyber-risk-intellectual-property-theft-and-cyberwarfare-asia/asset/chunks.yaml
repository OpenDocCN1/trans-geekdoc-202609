    根据`Allianz Risk Barometer 2020`，网络风险首次成为全球企业评判认为的首要威胁。在《第九份安联风险展望报告》中，39% 的受访者首次将网络安全事件视为首要业务风险，使得通常位居榜首的业务威胁——`BI`（营业中断）降至第二位，受访者占比
    37%。鉴于公司对 IT 和数据的依赖日益增加，近年来通过大量的网络安全事件，人们对网络威胁的意识也不断增强。仅在七年前，网络风险在`6%` 的受访者中仅排名第
    15。该调查涵盖了包括 CEO、风险经理、经纪人和保险专家在内的 2,718 名专家的观点。除了网络风险外，2020 年调查中凸显的其他主要关注点包括：法规和法律的变化位列第三（占比
    27%），气候变化位列第七（受访者占比 17%）。`AGCS` 首席执行官 Joachim Muller 指出，《2020 年报告》表明，网络风险以及与气候变化相关的风险是全球业务面临的最重大威胁。他表示：


    > 当然，还有许多其他损害和中断场景需要应对，但如果公司董事会和风险经理未能应对网络和气候变化风险，可能会对其公司的运营绩效、财务结果以及与关键利益相关者的声誉产生性影响。在数字化和全球变暖时代，对网络和气候变化风险做好准备和规划既是竞争优势，也是业务韧性的体现。


    网络风险不仅被视为全球首要风险，也是奥地利、比利时、法国、印度、南非、韩国、西班牙、瑞典、瑞士、英国和美国等国家三大风险之一。数据泄露的发生正在增加，勒索软件和欺骗是最常见的网络攻击手段。随着网络攻击频率的增加，还出现了上述与
    `GDPR` 相关的隐私罚款以及诉讼的增多。一起涉及超过 100 万条受损记录的大型数据泄露平均成本为 `US$ 4200 万`，同比增长 8%。如前所述，许多网络事件的原因与人为失误有关。黑客往往由于无知、疏忽或在某些情况下由于员工的情怨而进入公司的计算机系统。`AGCS`
    副主管 Marek Stanislawski 指出：“许多事件都是人为失误的结果，可以通过员工意识培训来缓解，但这种培训在各公司中尚未成为常态。”


    ## 营业中断


    根据《安联报告》，七年之后，`BI` 已不再是公司首要考虑的优先级，但它仍位居第二位，构成了巨大的关注。事实上，如本书所示，`BI` 风险已经扩大并多元化。随着通过网络攻击机制发生的网络战争和对基础设施的物理损害增加，`BI`
    变得更加复杂和深远。`AGCS` 全球财产和工程理赔部门主管 Raymond Hogendoorn 表示：


    > 如今的数字供应链和平台允许货物完全透明和可追溯，但由于数据中心的火灾、技术故障或黑客攻击可能给所有相关公司带来巨大的 BI 损失，这些公司都依赖并共享同一个系统，且无法切换回手动流程。


    国家支持的恐怖主义（如 `ISIS`）、流氓国家的导弹损害（如朝鲜在 2020 年 3 月再次进行导弹测试的损害），以及导致电网无法运行的网络攻击，都加剧了
    `BI`。保险承保人被要求扩大对网络风险的定义和涵盖范围。法规和法律的变化排名第三，许多风险与中美之间的贸易战争端直接相关。这类风险与 `IP`（知识产权）和贸易秘密盗窃直接相关。2019
    年启动了约 1,300 项贸易壁垒。随着网络攻击日益成为地缘政治影响和国家间竞争的一部分，普通网络攻击和网络战争作为可保风险的重要性将不断增加。新的监管变化（如气候变化引发的变革）将加速对网络风险新定义的需求。气候变化是亚太地区三大业务风险之一。企业日益担心由气候变化造成的物理损害。在《安联风险报告》中，49%
    的受访者表达了此类担忧。严重的洪灾、导致火灾损害的干旱和剧烈风暴都对工厂、公司实体资产和供应链造成了损害并构成了威胁。导致设施搬迁的运营中断构成了更大的风险。与碳问题相关的诉讼日益增加，特别在美国，这增加了保险承保的复杂性，并给风险经理的角色带来了更大的压力。网络风险评估对保险承保人至关重要，因为网络威胁和攻击日益导致保险理赔的风险和损失。对于普通保险公司来说也很重要，因为他们正成为黑客的目标。作为网络保险市场的主要参与者，美国保险公司
    `Chubb` 似乎曾是一次勒索软件攻击的目标。


    ## 网络保险的未来问题


    ### 保单条款的标准化


    评估此类场景结果面临的当前和未来挑战是保单条款的标准化。对这种标准化以及评估此类场景的危险在于，缺乏清晰、稳健的免责条款，以及措辞歧义，这导致了许多不同的解释。本书作者在
    2016 年参加由 `IUA` 支持的其著作《金融领域的网络风险管理》（Managing Cyber Risk in the Financial Sector）发布会上，她在演讲和书中指出，缺乏严谨的标准化语言会导致网络风险承保不尽如人意，因为最终保险人和被保险人都不完全理解自己承保了哪些内容。这在网络
    `IP` 盗窃中尤为如此，由于 `IP` 价值评估的复杂性以及在许多情况下涉及贸易秘密的盗窃，网络风险变得更加复杂。


    ## 默示网络 vs 确认性网络


