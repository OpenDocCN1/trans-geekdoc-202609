    C3.ai 数字化转型学院是一个新的研究联盟，包含了普林斯顿大学、卡内基梅梅隆大学、马萨诸塞理工学院、加州大学、伊利诺伊大学和芝加哥大学，以及 C3.ai
    和微软的参与。该学院正试图寻找能够利用人工智能解决许多社会问题的专家科学家。它将冠状病毒视为其首要挑战。这家新学院一直在寻求减缓病体传播的新颖方法、加速疗法开发、设计和重新利用药物、规划临床试验、预测疾病的演变、判断干预措施的价值、改进公共卫生策略，并在未来找到找到对抗传染病爆发的更好方法。⁴


    ## 网络战


    由于人工智能可以用于保护性措施（例如对抗冠状病毒疫情），它也可以用于操作网络安全系统，通过检测黑客及其恶意软件并阻断他们来缓解网络攻击。此类人工智能机器学习系统在网络战领域已经投入运行。加州大学伯克利分校的计算机科学家斯图亚特·罗塞尔（Stuart
    Russell）指出，目前许多武器系统正在使用基于软件的人工智能，这是对已用技术的转化。能够独立运行的人工通用智能概念在实践中目前并不存在。前陆军游击队、现任政策分析师的保罗·沙尔（Paul
    Scharre）在其著作《无名之：自主武器与战争的未来》（*Army of None: Autonomous Weapons and the Future
    of War*）中写道，已有 30 多国在交战速度快到人类无法反应的情况下使用防御性监督自主武器。此类武器中最闻名的是以色列航空工业公司的“哈蜂蜂”（Harpy）。这是一种武装无人机，可以在高空停留并侦察大片土地，直到检测到敌方雷达信号，此时它将与雷达警告源发生碰撞，从而摧毁自身和目标。⁵
    这类人工智能高科技网络战无人机并不灵活，而是精确地执行其程序设定的任务。它们不仅受军事需求驱动，还受到那些不断扩大其人工智能产品和服务业务的高科技公司的驱动。这种同样的技术也可以用于防止公司因网络攻击导致知识产权损失的人为错误，就像在网络战中摧毁为了地缘政治原因而针对人类目标的网络激活武器一样。


    ## 知识产权、情报和人工智能未来的网络攻击


    未来针对知识产权、贸易秘密和情报的网络攻击将来自中国和俄罗斯。这两个威权国家的结联盟是对全球民主和整个知识产权（IPR）保护的最大威胁之一。这种联盟危险性的一个近期例子是“涡轮熊猫”（Turbine
    Panda）。后者是一个总部位于中国的网络间谍组织名称，它曾对美国航空动力公司发动网络攻击，意图窃取 C919 定制发动机组件的知识产权蓝图，该发动机由中国国有企业
    `COMAC`（中国民用飞机公司）要求位于美国的 `CFM International` 设计。`CFM International` 是美国公司通用电气（General
    Electric）与法国赛飞飞机发动机公司（Safran Aircraft Engines）的合资企业。2010 年至 2015 年间，“涡轮熊猫”受中国政府支持的黑客对
    `CFM International` 的多个组件供应商（如赛飞/Safran 和霍尼韦/Honeywell）发动了网络攻击。随后在 2016 年 8 月，研究人员注意到由
    `COMAC` 成为近期股东的中国公司制造的 `CJ-1000AX` 发动机产了与 `C919` 类似的发动机，特别是在涡涡扇叶片设计上。`Crowdstrike
    Intelligence Reporting` 和未名的美国政府来源均得出结论，中国利用内部人员窃密、合资企业、强制技术转让和网络攻击间谍活动来获取其所需的技术信息。⁶
    实施知识产权窃取的中国内部人员就职于法中合资企业 `Safran Suzhou`（赛飞苏州）。他被一名中国情报官员招聘，后者向他提供了一个 `USB drive`，其中装有由中国开发的
    `Sakula` 恶意软件。这种行为发生在 2014 年 1 月，但网络攻击并未停止，目标是 `Safran Suzhou` 系统。人工智能的发展能阻止这种知识产权窃取吗？英国皇家联合服务研究所（RUSI）在
    2020 年 4 月的一份由 `GCHQ`（英国政府通信总部）委托的报告指出，随着攻击的增加，情报机构将需要人工智能来检测并阻止它们。网络攻击将来自国家行为，出于地缘政治或犯罪原因使用人工智能。RUSI
    报告指出，这将引发如人权和隐私等新问题。人工智能在未来将以多种方式用于网络攻击。其中一种方式是让普通系统更难检测，或者，它可能被用于重新编程无人机以攻击发送者。未来的其他用途可能是创建所谓的“深度伪造”（deep
    fakes），它们看起来是真实的但实际上是操纵的，可能在选举期间说服选民支持特定的候选人。因此，人工智能将作为出于地缘政治或犯罪原因使用它的恶意黑客的防御措施。在对恐怖分子进行预测分析方面，由于无数变量会稀释其应用的有效性，人工智能在这一领域将是渐进式的发展，而非瞬间产生的全新模式。伦理考量在其发展中至关重要。⁷
    最后，无论是威慑知识产权窃取还是处理网络战问题，机器学习或人工智能将发展并用于对抗网络攻击，并希望在一个理框架内进行。


