    加密资产是另一个难以投保的领域，因为它们非常新，在出于承保目的进行估值时，几乎没有历史数据可供参考。与知识产权（IP）、网络战争以及广义的网络风险相比，全球保险市场仅有不足
    0.5% 的承保能力可以覆盖加密资产的价值。为什么加密资产对网络风险保险市场如此重要？这是因为正如本书提到的，`Bitcoin` 和其他加密货币越来越多地被勒索软件和其他形式的网络攻击。诸如朝鲜等流氓国家，以及在
    `NotPetya` 等网络攻击中行动的中国情报特工，只有在收到加密货币支付的赎金后才会同意解冻计算机系统。这是因为此类货币不受任何机构的监管，且极难追踪。它们被用于知识产权盗窃和网络战争行为。`Evertas`
    是全球首家加密资产保险公司，在英国有大规模业务。`Evertas` 估计，目前市场总额约为 2000 亿美元，但随着机构投资者增加对该市场的敞口，未来五年内规模将增长到
    1 万亿美元。`Evertas` 还估计，机构持有的加密资产价值约为 750 亿美元，但预计未来三年内将增加到 1350 亿美元以上。`Evertas` 认为，加密资产缺乏保险可用性于三个原因：第一，加密资产市场规模与其他行业相比相对较小；第二，缺乏承保经验，因为这是一个全新的领域，几乎没有历史数据，因此缺乏承保专业知识；第三，常规市场并不鼓励在加密空间签发保险保单。近期有大量将加密资产与犯罪活动联系起来的负面数据。为了建立和扩大加密资产保险，`Evertas`
    宣布计划推出一家管理通用代理人（`MGA`），专门负责加密资产盗窃和损失保障。`MGA` 是一种特殊的经纪人或代理形式，除了能够为保险公司管理计划和谈判合同外，还获得了保险授予的承保授权。此类活动包括承保和定价、理赔结算以及任命区域零售代理人。`MGA`
    管理保险公司的全部或部分保险业务，作为其代理或经纪人，同时在保险公司、代理人和被保险人之间充当中间人。Raymond Zenkich 表示：


    > 我们目前在行业中占据着独特的地位，因为我们是唯一专注于加密资产承保，以及为托管机构/交易所、传统金融机构、加密基金、传统基金、市场公用事业和家族办公室等机构提供保险的公司。⁸


    在尝试为各种传统和现代机构提供保险风险承保时，他们似乎也在试图将加密货币机构化。


    ## 治理与标准


    加密货币的问题在于，由于它们是非机构化的且没有经过正式监管，因此很难根据国家政府标准制定机构所提供的基准来衡量可度量的的损失。`区块链`、`Bitcoin`
    和其他加密货币的效能正面临挑战，因为监管机构要么缺失，要么过于模糊，无法界定什么构成了网络攻击损失的价值，例如盗窃或其他对计算机系统的物理损害，或是通过勒索软件造成的损害，或是黑客在受害者计算机网络系统中安装恶意软件造成的。正如本书提到的，加密货币经常被黑客、地缘政治网络攻击者和犯罪分子用于洗钱，例如因为它们更难追踪。如果不能遵循标准的基准，保险如何应对此类网络风险呢？2018
    年 7 月 9 日，全球保险行业标准机构合作运营与开发协会（`ACORD`）发布了《网络数据泄露标准》，这成了保险行业针对网络数据泄露的首个标准。这项开拓性的标准由
    `Beazley` 和 `Aon` 共同开发，将提高全球保险价值链的效率和效果。前者是提供全球承保和理赔服务的专业保险公司，后者是另一家处理风险、退休和健康解决方案的大型保险公司。该《网络数据泄露标准》的创建非常及时，根据
    2017 年 `ACORD/NAIC`（美国保险专员协会）的调查，近 60% 的保险公司认为缺乏统一的数据标准和表格是网络风险保险保单发展和增长的主要障碍。随着相关网络风险、威胁以及通过网络攻击进行的知识产权盗窃/网络战争增加，需求日益增长，导致了这种精简、标准的网络风险数据交换。正如本书前面的提到的，组织之间（在此例中为保险）需要可靠的通信。`ACORD
    网络数据泄露标准`为保险价值链中各种业务的利益相关者（包括经纪人、承运人、代理人和软件供应商）提供了准确、快速的数据交换。这项新的 `ACORD` 标准通过提高遭受网络风险的利益相关者的运营效率和效果，进一步推进了标准网络风险数据交换的需求，同时为合规和审计活动建立了基准。它还允许解决方案供应商利用标准获得更多支持。2017
    年 `GDPR` 的引入给公司及其保险公司带来了更大的压力，因为理赔案件激增，各种黑客（包括政府支持的情报机构、地缘政治竞争对手、全球范围内对窃取 IP、蓝图和贸易秘密的公司，以及为了窃取军事秘密以推进全球主导地位的国家力量）都意识到私人数据正被溢价。公司面临着日益增加的名誉损失和金损失。`GDPR`
    激励公司报告数据泄露和黑客通过勒索软件网络攻击进行的勒索行为，这将导致公司向保险公司提出的理赔请求增加，以及越来越多的股东因个人数据和隐私损失而起诉其公司。因此，`ACORD
    网络数据泄露标准`的建立协助了公司在风险评估和保单流程期间进行信息共享。随着越来越多的保险领袖参与此类标准的制定，对全球网络风险、威胁和攻击的益处将更大。⁹


