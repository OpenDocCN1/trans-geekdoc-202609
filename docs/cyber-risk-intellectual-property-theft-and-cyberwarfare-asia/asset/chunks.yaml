    # 汽车攻击、智能家居与数据窃取的增加


    如今，车辆基本上是移动的数据工厂。现代汽车配备了一系列全球定位系统（`GPS`）设备、传感器和车载通信设备，这使其成为黑客和数据窃取者日益增加的盈利目标。同样，这种情况也发生在现代现代家庭中，那里有一系列网络设备。在技术互联的世界中，绝不能低估
    `IoT` 在数据窃取可能发生方面的影响。全球范围内不断增加的设备进一步增加了数据窃取者的复杂性和选择范围。由于成千个设备制造商和服务提供商之间缺乏安全标准，犯罪分子已经学会了通过连接的家电和智能设备搭入私人网络。攻击者可以选择针对车辆或家庭，或许利用它们来访问电子邮件账户，进而获取个人信息，或是访问我们例行发送数据以进行存储和分析的云服务。在黑市上大范围收割并转售这些数据，对于网络犯罪分子来说是极其丰利的。


    ## 日益增长的网络战


    网络战的目标是“削弱、干扰或破坏”敌人目标。这些目标可能受到国家级攻击或拒绝服务（`DoS`）攻击。网络战的威胁范围从宣传到间谍活动，再到导致人员死亡和广泛基础设施破坏的严重干扰。这些类型的网络攻击正以我们以前所未有的高影响方式干扰着政府和社会。它们构成了全球战争的未来。最后，面对所有这些日益增长的网络风险，Ruth
    Taplin 编写的这本书既及时又非常需要，它解释了上述关于未来网络攻击增加的所有方面，以及我们应该如何在全球范围内应对此类事件。如果我们不听取这些警告，我们所有人都将成为输家。正如
    Coveware 的研究所示，2019 年美国第四季平均勒索软件支付金额从第三季的 41,198 美元增加到 84,116 美元。[¹]](#ch06.xhtml#en1)
    此外，网络攻击正在呈现物理形态，以色列一家网络安全公司识别出一种新型勒索软件，它认为该软件是由伊朗创建的，用于锁定甚至删除工业控制系统，正如之前巴林林石油公司发生过的那样。[²]](#ch06.xhtml#en2)
    为了应对网络风险和网络攻击（无论是财务、业务中断（BI）、物理基础设施还是声誉攻击），让当地专家参与、在受网络攻击者之间进行合作和信息共享、让理解 `IoT`
    复杂性的专家，以及像这样一本能够引导受攻击者朝着正确方向去理解和处理这些网络安全问题的书籍至关重要。Todd Williams，新南威尔士网络安全节点主管，澳大利亚新南威尔士


    ### 注释

    1“第四季度勒索软件平均支付额飙升 104%”，Erin Ayers，*Advisen Cyber News* (2020 年 1 月 31 日)。2“与伊朗相关的网络攻击似乎针对巴林石油公司”，Erin
    Ayers，*Advisen Cyber News* (2020 年 1 月 31 日)。


