- fmt: "\nThe NISC will be in charge of the administrative office of the CSC and it\
    \ is planned that parts of administrative tasks will be commissioned to JPCERT/CC\
    \ (Japan Computer Emergency Response Team /Coordination Center). To achieve real-time\
    \ information sharing, the Council will be coordinated through the system, not\
    \ a physical meeting. (This is applicable to the general meeting and operational\
    \ committee.) JPCERT/CC (a system to provide early-warning information) is currently\
    \ developing CISTA (Collective Intelligent Agents for Trusted Advocates), by collecting\
    \ a wide range of information, and then sending out notification for early-stage\
    \ warnings. The Council’s system will be based on CISTA, but adds necessary features\
    \ such as a portal website where information sharing is taking place in real time\
    \ among members. To alleviate burdens on its members, the CSC will strengthen\
    \ cooperation with existing various information sharing systems. The acceptance\
    \ of information at the Council will be dealt as part of any type of framework\
    \ in which a member has already participated. However, in the event that members\
    \ request direct submission of information to the Council, where strict confidentiality\
    \ is applied, such matters will be handled directly in the future.\n\n## Structure\
    \ of the CSC\n\nThe CSC cybersecurity information structure and aims can be seen\
    \ in [Tables 3.1](#ch12.xhtml#table-wrap-001), [3.2](#ch12.xhtml#table-wrap-002)\
    \ and [3.3](#ch12.xhtml#table-wrap-003).\n\n### Table 3.1 Structure for information\
    \ sharing\n\n| *Concerns and uncertainty of vendors* | | | *Measures taken with\
    \ operational rules (T&Cs)* |\n| --- | --- | --- |\n| A wish to disclose the content\
    \ of information and consultation on a voluntary basis only to those trusted |\
    \ | → | Those who provide information can set up a limit on the extent of information\
    \ sharing. Such limits will not be changed without consent |\n| A consultation\
    \ on a voluntary basis may result in punishment by related authorities | | → |\
    \ Those who provide information could exclude related authorities from the extent\
    \ of information sharing recipients |\n| More information may be requested than\
    \ expected due to potential application of obligation for information provision\
    \ | | → | A triggering factor of such obligation will be defined and limited expressly\
    \ in ‘a large scale cyberattack’ and others |\n| Amendment of the terms and conditions\
    \ may bring a situation in which all information is requested | | → | Amendment\
    \ of the terms and conditions will require a majority in voting at the general\
    \ meeting, which consists of all members including private sectors |\n| Termination\
    \ of the membership of the council may be difficult | | → | Members can terminate\
    \ their membership at any time by submitting a letter |\n\n### Table 3.2 Council\
    \ role in information sharing\n\n| *Issues for specialised institutions and vendors*\
    \ | | | *Direction the Council takes to resolve issues* |\n| --- | --- | --- |\n\
    | It is difficult to disclose information such as analysis content that has not\
    \ been proven yet to the outside of the company | | → | By making the most of\
    \ the benefit of the Council such as the obligation to keep confidentiality, which\
    \ is subject to fines or charges if breached, the Task Force (TF) will be set\
    \ up in the Council. This special TF will accommodate only a few volunteer members\
    \ who have a high level of relationship of trust among themselves and can share\
    \ information mutually, including unproven analysis content |\n| It is not fair\
    \ for them to keep outputting information because it is valuable | | → | The TF\
    \ will prevent ‘free riding’ and information sharing will be based on ‘give and\
    \ take’ |\n| Valuable information is provided, so appropriate feedback needs to\
    \ be given | | → | The TF will ensure there is a system to provide feedback to\
    \ information provided without fail |\n\n### Table 3.3 Organisation of information\
    \ sharing\n\n| *The Category 1 group members (corporate entities defined by the\
    \ government ordinance such as security specialists and vendors)* | | | *The Category\
    \ 2 group members, ordinal members (national, local administrative organs, principal\
    \ infrastructure, educational institutions, private sectors) – whether to participate\
    \ in the Council is left to each entity’s will* |\n| --- | --- | --- |\n| ① The\
    \ primary group members will share internally and also exchange feedback regarding\
    \ the content of analysis that has not been proven as yet in-house with a strong\
    \ obligation of confidentiality so that the level of accuracy on analysis would\
    \ be enhanced rapidly and other members would be able to receive information on\
    \ countermeasures. | | ① Provision of information including countermeasures (high\
    \ degree of accuracy) → → ② Provision of information including countermeasures\
    \ (low degree of accuracy) → ← ② Feedback ← ← ③ Internal consulting ← → ③ Internal\
    \ advice → | ① The members of Category 2 and ordinal members will receive information\
    \ with a high degree of accuracy that is provided by the Council, and will utilise\
    \ it for their own organisations’ countermeasures. ② In addition, the members\
    \ of the Category 2 group will be able to receive information including countermeasures,\
    \ which is given at an earlier stage. (Accuracy is not guaranteed at this stage\
    \ and obligation of confidentiality is applied.) They will send feedback. |\n\
    | E.g. Highly specialised analysis •Identifier of vulnerability used in attacks\
    \ •Malware behaviour E.g. Countermeasures •Special fixes/patches from certain\
    \ manufacturers •Not using PCs ② The Category 1 members provide information internally\
    \ on countermeasures that has not been proven as yet with strong obligation of\
    \ confidentiality to the Category 2 members only. Following their feedback, these\
    \ Category 1 members will enhance the accuracy level of analysis rapidly. ③ The\
    \ Category 1 members will also be able to understand what is taking place in the\
    \ society by dealing with consulting with companies that are affected. | | ③ The\
    \ ordinal members and those in the Category 2 group can consult internally with\
    \ the members of Category 1 group with strong obligation of confidentiality for\
    \ advice (voluntary). ※ They can request a consultation casually even for a matter\
    \ they feel intuitively. ※ Any entity regardless of national or local administrative\
    \ organ, principal infrastructure, educational institution and private sector\
    \ could become a member of Group 2 once it meets the criteria and upon request.\
    \ ※ In the case where any Category 2 member fails to fulfil their contribution\
    \ requested, such a member will not maintain its status in the group. |\n| ※ Any\
    \ entity, other than a specialised institution or vendor, that meets criteria\
    \ and upon request could become the members in the Category 1 group. ※ In the\
    \ case where any Category 1 member fails to fulfil their contribution requested,\
    \ such a member will not maintain its status in the group. | | |\n\nSources: All\
    \ tables compiled from the following: [www.jpcert.or.jp/english/](http://www.jpcert.or.jp/english/),\
