    开发这种新型海运贸易网络防御手段的目的是防止黑客关闭港口运营、瘫痪供应链、破坏可能导致人员伤的系统，并造成财务和声誉损害。阿什杜德港（Ashdod）的年吞吐量为
    150 万 MTEU（即 150 万个二十英尺集装箱，或全球 150 万个标准集装箱），是整个以色列最大的集装箱处理量。


    2018 年，`BIMCO`（国际船东协会）发现，由于针对船舶和港口的网络攻击日益增加，他们不能等待监管机构引入网络安全条款。因此，它从 2019 年 5
    月开始在其租船协议和其他合同中引入了网络安全条款。该条款涵盖了对易受网络攻击的 `IT` 和 `OT` 系统的保护。`IT` 系统需要防范欺诈、IP 攻击和数据盗窃，而
    `OT` 系统则需要网络安全措施来缓解对导航或住宿系统等关键系统威胁的影响，以确保船员、乘客和船舶的安全。


    船东传统上难以为其 `PC` 系统购买网络攻击保险险，因此 `BIMCO` 条款包含了这一保障范围。`BIMCO` 表示，网络攻击的责任额不应超过 10 万美元，但其他金额可以在合同阶段进行协商。`BIMCO`
    不仅代表船东，还代表管理公司、贸易经纪和其他利益相关者。这是一个试图简化并影响与航运相关的国际贸易协议的组织。


    挪威国家安全局（`NSM`）于 2019 年夏天警告海运部门网络攻击正在增加，并提出了应对举措。挪威海事局一直在警告船东和航运公司，黑客正利用 `LinkedIn`、`Facebook
    Messenger` 和 `WhatsApp` 等社交媒体在电子邮件中安装恶意软件，并提醒不要打开与社交信息相关的附件。


    挪威海事局建议对网络进行分段，将行政部分与运行部分之间的所有物理连接分离。`NSM` 建议船舶在海上与陆地基础设施之间使用加密通信。`P&I`（和平保赔）协会
    `Gard` 建议所有船舶立即向国家安全部门报告网络攻击，并确保其管理系统按照 `IMO`（国际海事组织）的 `ISM`（国际安全管理）规范的要求，在 2021
    年 1 月 1 日之前准备好应对网络风险。


    ## 美国海岸警卫队网络攻击警告


