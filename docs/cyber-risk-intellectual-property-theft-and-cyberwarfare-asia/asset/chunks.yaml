    网络安全顾问公司 Red Sky Alliance 指出，针对船舶的网络攻击正以惊人的速度加速。该公司正与海事安全专家 Dryad Global 合作，并已开始每周发布出现在恶意邮件中的船舶名称。恶意软件和网络钓鱼邮件是黑客使用最广泛的手段。为了诱导航运行业人员打开邮件附件和链接，最常见的主题行是“机动船（MV）”和“机动油轮（MT）”。船舶正被此类恶意邮件所冒充。此类欺骗性网络攻击针对的是供应链公司的各个层级。


    例如，在 2 月 25 日所在的一周，试图向毫无防备的供应链计算机系统中注入名为 `Wacatac` 的木马恶意软件的恶意邮件中，首次包含了一个 `D` 变体。黑客每天都在开发新的黑客工具，并在
    2020 年 2 月开始再次使用 `Maersk` 进行伪装，因为 `Maersk` 曾于 2017 年遭受过臭名昭著的网络攻击成为受害者。


    2017 年，俄罗斯军方情报部门（`GRU`）对全球公司发起了史无未有的网络攻击，导致 `Maersk` 和 `Federal Express` 遭受了数十亿美元的损失。这就是臭名的
    `NotPetya` 网络攻击，其目的是对乌造成最大的破坏，但也对 `Maersk` 和 `Federal Express` 的航运业务造成了严重损害。这被视为俄罗斯试图利用混合战争的一部分，这种战争将对物理基础设施的实际常规攻击与禁用港口、航运终纽和相关
    IoT 计算机系统等关键基础设施的网络战战术相结合。这次攻击还与针对格鲁吉亚的网络攻击有关，该攻击导致了网站和电视广播中断。英国、澳大利亚和其他欧洲国家均与美国国务院达成一致，认为这些网络攻击是由俄罗斯技术总中心（`GRU`
    军方情报部门的一部分）实施的。


    2018 年，全球多个港口遭受了各种网络攻击。在此期间，圣地亚哥港遭受了勒索软件攻击，要求支付 `Bitcoin` 以重新开放计算机系统。该攻击导致多种服务（如公共记录请求和商业服务）的功能受到限制。巴塞罗纳港也遭受了网络攻击，而
    `Cosco` 航运公司则是与加利福尼亚州长滩港相关的严重网络攻击的受害者。加州大学圣芭芭拉分校网络安全中心的 Giovanni Vigna 博士指出，航运港口处理的敏感信息吸引金融欺诈和针对性钓鱼网络攻击。因此，随着人员、财务和军事相关数据的日益数字化，网络风险也越大。Vigna
    博士建议，发货人需要增强网络威胁意识，并在保护方面投入更多资金。


    ## 亚太地区的网络攻击


    由于十个最繁忙的集装箱港中有九位于亚太地区，该地区面临着日益增加的网络攻击。如果持续的网络病毒感染了日本、中国、韩国等地的 15 个主要港口，劳子保险委托的一项研究指出，这可能导致
    1100 亿美元的损失。按照目前的保险覆盖率，将有约 1010 亿美元缺乏保险保障。剑桥大学风险研究中心网络风险管理小组发布的报告预测，全球经济的 92%
    不仅对损失毫无准备，而且没有保险。劳子保险新加坡国家经理 Angela Kelly 表示，网络风险是当今海运业面临的最复杂且最关键的风险之一。


    随着新技术和自动化的实施，风险经理和保险公司需要通力规划保险解决方案。报告进一步指出，报告中所述的此类预期大规模攻击不仅将对亚太地区的港口和经济造成严重破坏，还将由于互联性和全球供应链的原因影响全球经济。该研究报告估计，生产力损失将影响每一个与遭受网络攻击的港口有双边贸易的国家。预计亚洲的间接经济损失将高达
    2700 亿美元，欧洲为 6.23 亿美元，北美为 2.66 亿美元。保险理赔将将来自 50% 的港口运营商、供应链中 21% 的已保损失以及来自物流和装卸货公司
    16% 的已保损失。


    ## 理解网络风险


