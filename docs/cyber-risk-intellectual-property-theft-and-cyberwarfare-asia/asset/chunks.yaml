    \ York Times* (16 March 2020). [12](#ch13.xhtml#fnen90)‘US escalates online attacks\
    \ on Russia’s power grid’, David E. Sanger and Nicole Perlroth, *New York Times*\
    \ (15 June 2019). \n\n# [5China](#ch05.xhtml#tocbook-part-005)\n\nChina (People’s\
    \ Republic of China or PRC) and its acolyte state North Korea use cyberattack\
    \ and hacking, mainly on the state level, for a wide variety of purposes. The\
    \ major use is to steal IP to keep up with advances in technology in the US, UK\
    \ and other Western-allied countries with advanced technology such as Israel.\
    \ As a good deal of the IP stolen has to do with military technology, the other\
    \ use is to become militarily dominant through cyberwarfare tactics on a geo-political\
    \ level. \n\n## IP theft\n\nThere is a pattern of behaviour that typifies China’s\
    \ theft of IP. The Department of Justice (DoJ) has been investigating IP theft\
    \ for more than a decade. The Obama administration reached an agreement with China\
    \ to halt this theft. In due course China no longer honoured this agreement leading\
    \ to increased IP theft and the use of trade talks and punitive tariffs to try\
    \ to force China to agree to stop stealing US IP. Yet, using trade talks such\
    \ as those of the trade meeting of the World Trade Organization (WTO) in December\
    \ 2018, when the United States accused China of circumventing the law to advance\
    \ its economic interests, did not accord with the views of law-enforcement officers.\
    \ While perhaps agreeing in principle that China engages unfair advantage through\
    \ subsidising and maintaining excess capacity, in steel production for example,\
    \ dumping these state-subsidised products cheaply on other countries forcing their\
    \ producers out of business, the DoJ at that time did not make decisions to intervene\
    \ on the basis of political situation. The DoJ for a decade before this WTO meeting\
    \ has been using the rule of law through criminal case development, prosecuting\
    \ those who as part of Chinese companies and government have been through cyberattack\
    \ means stealing IP, trade secrets and military data to build China into a major\
    \ global player. In December 2018, the DoJ, under the leadership of Deputy Attorney\
    \ General Rod Rosenstein, unsealed an indictment that broadly outlined a campaign\
    \ of many years that found China stealing US technological advances through IP\
    \ theft and trade secrets from a wide variety of industries, which had assisted\
    \ the Chinese government in eroding the US military’s pre-eminence and undercut\
    \ international competitors. \n\n## The role of APT10"
