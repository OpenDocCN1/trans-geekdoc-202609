- fmt: "\nIn spring 2019 Huawei, the biggest suppliers of networking equipment, wrote\
    \ a letter to Verizon, the American telecommunications company, alleging that\
    \ they had infringed 238 of Huawei’s patents. Huawei was asking Verizon to buy\
    \ a licence to its patent portfolio. Verizon reacted by stating that the Chinese\
    \ allegations and demands through Huawei were geo-political in nature and a much\
    \ wider issue that had implications for all US technology companies not just Verizon.\
    \ Many experts in the telecommunications area believed that the roots of these\
    \ patent demands lay with Huawei being shut out of the smartphone market in the\
    \ US and that it was trying to extract revenue through patent infringement allegations.\
    \ The claims included wireless technology and networking devices and could have\
    \ brought Huawei over US$ 1 billion in fees. These claims would have amounted\
    \ to indirect awards as Verizon does not use Huawei’s products but only has indirect\
    \ use through the over 20 vendors from whom they purchase equipment that may use\
    \ parts of Huawei technology. Therefore, IP theft can not only be used to avoid\
    \ R&D costs by stealing the patents from other companies but also through allegations\
    \ of its theft can be used to extort revenue from supposed infringers of patents.\n\
    \n## ‘Wolf culture’\n\nWith all the conflict and counter-allegations surrounding\
    \ IP theft, whether from the US side or Chinese side, there has been concrete\
    \ evidence that Huawei tries to use backdoor channels through all its networking\
    \ equipment. It is the comprehensive nature of the IoT aspects after 5G, which\
    \ are linked by IoT, that presents the greatest risks. Never before has a telecommunications\
    \ system served through physical routers and switches so many interconnected devices.\
    \ Vast amounts of information data travel through the networks with little human\
    \ intervention so that it becomes possible for hackers to tap into data without\
    \ the owners of the networks being aware of such intrusions. Huawei is known for\
    \ its so-called ‘wolf culture’ and nothing has stopped the company from pushing\
    \ its employees very hard to go any lengths to benefit company growth. This led\
    \ to Huawei’s Chief Financial Officer, Meng Wanzhou, being arrested in Canada\
    \ at the behest of the US in relation to committing bank fraud and sanctions busting\
    \ in Iran. Huawei entered the Iranian market in 1999 and within a decade it connected\
    \ 130 cities through its fibre-optic cables. By 2009, Huawei had become the major\
    \ supplier of telecommunications hardware to Iran. However, soon after in 2011,\
    \ because of Iran’s nuclear programme, both the UN and the US imposed new sanctions\
    \ on doing business with Iran. Huawei declared it would not engage in new business\
    \ with Iran and would limit its business with existing customers. However, an\
    \ affidavit that was made public during Meng Wanzhou’s bail hearing it became\
    \ clear that Huawei used a company called Skycom as an unofficial subsidiary to\
    \ maintain business as usual in Iran. She used her role as Chief Financial Officer\
    \ to reassure banks such as HSBC that Huawei was not breaking US or UN sanctions.\
    \ HSBC, in good faith through its American subsidiary, cleared more than US$ 100\
    \ million in transactions with Skycom in Iran by 2014 according to the affidavit.\
    \ Such actions by Huawei, which are among many that have implicated it in money\
    \ laundering, IP theft, illegal data collection through cyberattack and espionage\
    \ that could give Huawei technological domination and the ability to control global\
    \ networks through IoT, which are also connected to cyberwarfare capabilities,\
    \ are the reasons why the discussions are so fierce concerning Huawei being allowed\
    \ to operate 5G networks in not only the five eye countries but also in others\
    \ as well.\n\n## Huawei files lawsuit\n\nIn March 2019, Huawei filed a lawsuit\
    \ that alleged the US government to be breaching its constitutional rights by\
    \ having instituted a law that restricted its ability to carry out business with\
    \ US federal agencies and their contractors. A Texas-based federal US district\
    \ judge, Amos Mazzant, in a 57-page decision ruled in favour of the United States\
    \ Congress, which included the restriction in the National Defense Authorization\
    \ Act (NDAA). Restrictions were not limited to Huawei but also included another\
    \ company and telecommunications firm, ZTE. Huawei was not pleased with this decision\
    \ stating after the ruling that the `NDAA` was providing a false sense of protection\
    \ while undermining Huawei’s constitutional rights and that it would be pursuing\
    \ other legal options in the future. Like the Samsung vs Apple patent infringement\
    \ cases written about at length in previous books by this author, these cases\
    \ can rumble on over 50 cases, but the safety of American and European systems\
    \ from IP theft, personal data breaches and the uses of these against them by\
    \ geo-political rivals for world domination such as this Chinese case rests with\
    \ being in control of 5G network equipment, understanding the IoT and how to protect\
    \ it from such damaging cyberattacks as outlined above. The brunt of so many geo-political,\
    \ military and IP theft purposes are borne by the current number-one economy,\
    \ the United States. Therefore, the next chapter will look at the US in terms\
    \ of the cyberattacks that have involved IP theft, personal data hacking to collect\
    \ government and military officials details and cyberwarfare and how the US is\
    \ engaging in countermeasures against such cyberattacks. Countries other than\
    \ Russia and China will be brought into the analysis such as North Korea, Iran\
    \ and Israel.\n\n### Notes\n\n[1] ‘Cybercrime by China is “unacceptable”, Rosenstein\
    \ says’, Katie Benner, Julian E. Barnes and Glen Thrush, *New York Times* (20\
    \ December 2018). \n[2] ‘Intellectual property to take center stage as Trump and\
    \ Xi meet’, Alan Rappeport, *New York Times* (28 November 2018). \n[3] ‘Data breach\
    \ is traced to Chinese hackers as U.S. readies crackdown’, David E. Sanger, Nicole\
    \ Perlroth, Glenn Thrush and Alan Rappeport, *New York Times* (11 December 2018).\
    \ \n[4] ‘How China used LinkedIn to recruit spies’, Edward Wong, *New York Times*\
    \ (28 August 2019). \n[5] ‘With harsh words, China’s military denies it Equifax’,\
    \ Paul Mozur, *New York Times* (13 February 2020). \n[6] ‘Equifax: US charges\
    \ four military officers over huge hack’, Gordon Corera, *BBC News* (11 February\
    \ 2020). \n[7] Quote from *New York Times* Tuesday (18 February 2020). \n[8] ‘EU\
    \ insists European companies could replace Huawei in 5G network’, David Bellamy\
    \ with AFP, *Euronews Online* (26 July 2020). \n[9] ‘Huawei is winning the argument\
    \ in Europe as the US fumbles to develop alternatives’, David E. Sanger and David\
    \ McCabe, *New York Times* (17 February 2020). \n[10] ‘America pushes allies to\
    \ fight Huawei in new arms race with China’, David E. Sanger, Julian E. Barnes,\
    \ Raymond Zhong and Mark Santora, *New York Times* (26 January 2019). \n[11] ‘Huawei\
    \ is said to demand patent fees from Verizon’, Paul Mozur and Edmund Lee, *New\
    \ York Times* (12 June 2019). \n[12] ‘Huawei’s “wolf culture” helped it grow and\
    \ got it into trouble’, Raymond Zheng, *New York Times* (18 December 2018). \n\
    [13] ‘Court rejects Huawei’s challenge to U.S. limits’, Lam Yik Fei, *New York\
    \ Times* (19 February 2020).\n[14] There are many books and reports covering the\
    \ long running Samsung vs Apple infringement case. See, for example, Ruth Taplin\
    \ (ed.), *Managing Cyber Risk in the Financial Sector: Lessons from Asia, Europe\
    \ and the USA,* Abingdon: Routledge, 2016 and *Intellectual Property Valuation\
    \ and Innovation: Towards Global Harmonisation*, Abingdon: Routledge, 2014.\n"
  raw: "In spring 2019 Huawei, the biggest suppliers of networking equipment, wrote\
    \ a letter to Verizon, the American telecommunications company, alleging that\
    \ they had infringed 238 of Huawei’s patents. Huawei was asking Verizon to buy\
    \ a licence to its patent portfolio. Verizon reacted by stating that the Chinese\
    \ allegations and demands through Huawei were geo-political in nature and a much\
    \ wider issue that had implications for all US technology companies not just Verizon.\
    \ Many experts in the telecommunications area believed that the roots of these\
    \ patent demands lay with Huawei being shut out of the smartphone market in the\
    \ US and that it was trying to extract revenue through patent infringement allegations.\
    \ The claims included wireless technology and networking devices and could have\
    \ brought Huawei over US$ 1 billion in fees. These claims would have amounted\
    \ to indirect awards as Verizon does not use Huawei’s products but only has indirect\
    \ use through the over 20 vendors from whom they purchase equipment that may use\
    \ parts of Huawei technology.[^(11)](#ch14.xhtml#en101) Therefore, IP theft can\
    \ not only be used to avoid R&D costs by stealing the patents from other companies\
    \ but also through allegations of its theft can be used to extort revenue from\
    \ supposed infringers of patents. \n\n## ‘Wolf culture’\n\nWith all the conflict\
    \ and counter-allegations surrounding IP theft, whether from the US side or Chinese\
    \ side, there has been concrete evidence that Huawei tries to use backdoor channels\
    \ through all its networking equipment. It is the comprehensive nature of the\
    \ IoT aspects after 5G, which are linked by IoT, that presents the greatest risks.\
    \ Never before has a telecommunications system served through physical routers\
    \ and switches so many interconnected devices. Vast amounts of information data\
    \ travel through the networks with little human intervention so that it becomes\
    \ possible for hackers to tap into data without the owners of the networks being\
    \ aware of such intrusions. Huawei is known for its so-called ‘wolf culture’ and\
    \ nothing has stopped the company from pushing its employees very hard to go any\
    \ lengths to benefit company growth. This led to Huawei’s Chief Financial Officer,\
    \ Meng Wanzhou, being arrested in Canada at the behest of the US in relation to\
    \ committing bank fraud and sanctions busting in Iran. Huawei entered the Iranian\
    \ market in 1999 and within a decade it connected 130 cities through its fibre-optic\
    \ cables. By 2009, Huawei had become the major supplier of telecommunications\
    \ hardware to Iran. However, soon after in 2011, because of Iran’s nuclear programme,\
    \ both the UN and the US imposed new sanctions on doing business with Iran. Huawei\
    \ declared it would not engage in new business with Iran and would limit its business\
    \ with existing customers. However, an affidavit that was made public during Meng\
    \ Wanzhou’s bail hearing it became clear that Huawei used a company called Skycom\
    \ as an unofficial subsidiary to maintain business as usual in Iran. She used\
    \ her role as Chief Financial Officer to reassure banks such as HSBC that Huawei\
    \ was not breaking US or UN sanctions. HSBC, in good faith through its American\
    \ subsidiary, cleared more than US$ 100 million in transactions with Skycom in\
    \ Iran by 2014 according to the affidavit.[^(12)](#ch14.xhtml#en102) Such actions\
    \ by Huawei, which are among many that have implicated it in money laundering,\
    \ IP theft, illegal data collection through cyberattack and espionage that could\
    \ give Huawei technological domination and the ability to control global networks\
    \ through IoT, which are also connected to cyberwarfare capabilities, are the\
    \ reasons why the discussions are so fierce concerning Huawei being allowed to\
    \ operate 5G networks in not only the five eye countries but also in others as\
    \ well. \n\n## Huawei files lawsuit\n\nIn March 2019, Huawei filed a lawsuit that\
    \ alleged the US government to be breaching its constitutional rights by having\
    \ instituted a law that restricted its ability to carry out business with US federal\
    \ agencies and their contractors. A Texas-based federal US district judge, Amos\
    \ Mazzant, in a 57-page decision ruled in favour of the United States Congress,\
    \ which included the restriction in the National Defense Authorization Act (NDAA).\
    \ Restrictions were not limited to Huawei but also included another company and\
    \ telecommunications firm, ZTE. Huawei was not pleased with this decision stating\
    \ after the ruling that the NDAA was providing a false sense of protection while\
    \ undermining Huawei’s constitutional rights and that it would be pursuing other\
    \ legal options in the future.[^(13)](#ch14.xhtml#en103) Like the Samsung vs Apple\
    \ patent infringement cases written about at length in previous books by this\
    \ author, these cases can rumble on over 50 cases, but the safety of American\
    \ and European systems from IP theft, personal data breaches and the uses of these\
    \ against them by geo-political rivals for world domination such as this Chinese\
    \ case rests with being in control of 5G network equipment, understanding the\
    \ IoT and how to protect it from such damaging cyberattacks as outlined above.[^(14)](#ch14.xhtml#en104)\
    \ The brunt of so many geo-political, military and IP theft purposes are borne\
    \ by the current number-one economy, the United States. Therefore, the next chapter\
    \ will look at the US in terms of the cyberattacks that have involved IP theft,\
    \ personal data hacking to collect government and military officials details and\
    \ cyberwarfare and how the US is engaging in countermeasures against such cyberattacks.\
    \ Countries other than Russia and China will be brought into the analysis such\
    \ as North Korea, Iran and Israel. Notes [1](#ch14.xhtml#fnen91)‘Cybercrime by\
    \ China is “unacceptable”, Rosenstein says’, Katie Benner, Julian E. Barnes and\
    \ Glen Thrush, *New York Times* (20 December 2018). [2](#ch14.xhtml#fnen92)‘Intellectual\
    \ property to take center stage as Trump and Xi meet’, Alan Rappeport, *New York\
    \ Times* (28 November 2018). [3](#ch14.xhtml#fnen93)‘Data breach is traced to\
    \ Chinese hackers as U.S. readies crackdown on Beijing’, David E. Sanger, Nicole\
    \ Perlroth, Glenn Thrush and Alan Rappeport, *New York Times* (11 December 2018).\
    \ [4](#ch14.xhtml#fnen94)‘How China used LinkedIn to recruit spies abroad’, Edward\
    \ Wong, *New York Times* (28 August 2019). [5](#ch14.xhtml#fnen95)‘With harsh\
    \ words, China’s military denies it hacked Equifax’, Paul Mozur, *New York Times*\
    \ (13 February 2020). [6](#ch14.xhtml#fnen96)‘Equifax: US charges four Chinese\
    \ military officers over huge hack’, Gordon Corera*, BBC News* (11 February 2020).\
    \ [7](#ch14.xhtml#fnen97)Quote from *New York Times* Tuesday briefing (18 February\
