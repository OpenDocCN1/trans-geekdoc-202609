    在美国，机器人的使用正在加速，其目的是影响人们对特定事项的观点，并可用于影响选举或其他网络战中可能针对的地缘政治问题。气候变化一直是美国面临的目标领域之一，自
    2017 年特朗普总统宣布美国退出《巴黎气候协定》以来（这一点在 2020 年 2 月得到了扭转，这可能是由于来自欧洲国家的压力，他们将采用中国华为 5G
    技术作为谈判筹码）。机器人是伪装成人类并在社交媒体上发送信息的计算机程序。根据美国布朗大学研究人员进行的一项研究，在美国退出《巴黎气候协定》期间，650 万条推文中有
    25%是机器人生成的。这些大量由机器人生成的推文涉及否认气候变化，且没有任何科学依据。这些机器人被用来制造一种印象，并放大这种信息：即气候变化的证据应该被拒绝和否认。尽管布朗大学的研究人员无法识别机器人背后的操纵者，但通过使用`botometer`，他们可以确定哪些推文是人类或机器人生成的。他们进一步发现，在拒绝有关气候变化科学发现的推文中，有
    38%是由机器人生成的，而有关埃克森石油公司的推文中，有 28%是由机器人发布的。在支持气候变化行动的推文中，仅有 5%是机器人生成的。在气候变化等可能影响信仰的问题上，推文有四分之一的内容来自机器人，那么这些机器人不仅可以影响选举，还可能影响有关开战或迫害特定群体的情绪，这并非不可想象。


    ## 网络酷刑


    从基于心理的信息和精神胁迫到战争的另一个不幸方面——酷刑，并不是一个巨大的飞跃。网络酷刑的可能性不容低估，正如获得英国学院奖的电影制作人斯蒂芬·本内特（Stephen
    Bennett）的纪录片《显眼的怪物：现代酷刑手册》所示。该纪录片追踪了 20 世纪 50 年代 CIA 资助的心理酷刑技术，这些技术后来由出生于苏的精神医生埃文·卡梅隆博士（Ewen
    Cameron）进一步发展。电影展示了卡梅隆博士在加拿大研究机构的患者如何遭受 LSD 注射、强制昏迷以及极端的精神和肉体。这些对患者的做法在加拿大已不再被允许。格拉斯哥大学法律教授尼尔斯·梅泽（Nils
    Melzer）是联合国酷刑及其他残忍、不人道或侮辱性待遇的瑞士特别报告员。他认为，那些深知联合国和其他国际执法机构禁止肉体酷刑的国家，可以很容易利用心理方法进行网络酷刑。他相信互联网可以用来通过监控、恐吓、骚扰、隔离、公开羞辱和诽谤，远程对个人进行心理酷刑。2020
    年 2 月，梅泽教授向日内瓦联合国提交了一报告，强调他担心网络技术心理酷刑在某种程度上被认为不如肉体酷刑那样严重或真实，并担心网络酷刑会被国家合法化。他进一步认为，仅仅因为心理酷刑没有留下身体痕迹，它就可能导致社会孤立、严重抑郁和自杀倾向。梅泽教授的观察似乎很有道理，正如层层案例所示，所有的社交媒体都可以被用于欺凌、恐吓和隔离，从而导致抑郁和自杀。网络攻击（Trolling）、辱骂性信息的轰炸往往会将弱势群体推向边缘。当美国总统特朗普先生不断通过称呼对手贬低、羞辱性的名称来嘲讽他们，并对网络上针对的、感知中的敌人进行无情辱骂时，这种网络虐待尤为令人担忧。考虑到网络酷刑被合法化的可能性，从五角大楼到负责外交政策的人员，大多数美国高级官员克制了发布侮辱性和辱骂性的推文或其他社交媒体信息，这是幸运的。只要其他国家或国家支持的企业缺乏创意，并依赖于盗窃而非发明可以有效利用的新技术，知识产权盗窃将持续进行。鉴于核技术不可逆转的前景，网络战也将演变，并将受到地缘政治迫要求的指导。然而，理解并颠覆危及创意知识产权的以及进一步推进破坏性形式的网络攻击，对于信息数字化的世界至关重要。在随后的章节中，我们将分析网络攻击如何影响主要行业和经济支柱，以及可以采取哪些措施来破坏此类攻击。


    ### 注释

    [1] “政府机构数据泄露，”Zoe Thomas，技术记者，*BBC Online* (2020 年 2 月 22 日)。

    [2] “朝鲜离脱者黑客：近 100 人的个人数据泄露，”*BBC Online* (2018 年 12 月 28 日)。

    [3] “朝鲜绕过联合国制裁通过网络攻击赚取 20 亿美元。联合国新报告称，”Pamela Falk，*CBS News Online* (2019 年 8
    月 6 日)。

    [4] “中国公民被指控洗钱，”*BBC News Online* (2020 年 3 月 3 日)。

    [5] 参见 Ruth Taplin，《韩国的创新、投资与知识产权》，Abingdon: Routledge, 2018。

    [6] “勒索软件攻击增加瘫痪了城市和企业，”Nathaniel Popper，*New York Times* (2020 年 2 月 9 日)。

    [7] “伊朗黑客针对总统竞选，”Nicole Perlroth，*New York Times* (2019 年 10 月 4 日)。

    [8] 同上。

    [9] “寻找伊朗的网络银弹的紧迫寻找，”David E. Sanger 和 Julian E. Barnes，*New York Times* (2019
    年 9 月 23 日)。

    [10] “以色列士兵被哈马斯的‘假女性’电话骗局欺骗，”*BBC News Online* (2020 年 2 月 17 日)。

    [11] “‘暗网’黑客可能攻击加油站，”Sarah Min，*Money Watch* (2019 年 9 月 13 日)，更新。

    [12] “研究发现气候变化推文有四分之一来自机器人，”*BBC Online* (2020 年 2 月 22 日)。

    [13] “联合国警告‘网络酷刑’兴起以规避肉体禁止，”Owen Bowcott，法律事务记者，*Guardian* (2020 年 2 月 21 日)。


