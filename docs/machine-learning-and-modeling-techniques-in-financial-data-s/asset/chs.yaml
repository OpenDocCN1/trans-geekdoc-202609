  \n## 第 2 章\n\n# 从金融科技到绿色金融科技：如何让金融领域的 AI 脱碳\n\nRoberto Vergallo \n![Orcid 图标](https://orcid.org/0000-0003-3560-8X)](https://orcid.org/0000-0003-3560-8X)\n\
  佩加索大学，意大利\n\nSimone Casciaro\n![Orcid 图标](https://orcid.org/0000-0003-3560-8X)](https://orcid.org/0000-0003-3560-8X)\n\
  萨伦托大学，意大利\n\nLuca Mainetti\n![Orcid 图标](https://orcid.org/0000-0003-3560-8X)](https://orcid.org/0000-0003-3560-8X)\n\
  萨伦托大学，意大利\n\n### 摘要\n\n机器学习和深度学习正在金融领域以惊人的速度蔓延。然而，相关的能源消耗与银行的可持续性要求不一致。特别是，随着运行复杂算法所需的能量增加，由于依赖化石燃料的电网释放了更多的二氧化碳。虽然出现了一些技术来缓解\
  \ AI 的碳足迹，但金融科技面临着将这些策略整合到领域特性中的挑战，该领域需要及时性、数据保护和合规性。在本文中，我们介绍了先进的绿色 AI 技术，报告了现有的实验结果，并批判性地评估了它们在金融领域的适用性。\n\
  \n### 1. 引言\n\n2023 年是人工智能（AI）的一年。OpenAI 在市场上推出的 `ChatGPT` 标志着我们近期历史上的重大转折点，对技术发展产生了深远影响，并为新的\
  \ AI 辅助社会奠定了基础。这一惊人的突破得益于大语言模型（LLM）在复杂性和性能上的巨大进步，这促使所有 ICT 公司跟上 AI 革命。\n\n金融行业并未免受人类历史这一重大转折点的影响。虽然\
  \ AI 技术在银行流程中的实施已经进行了很长时间——无论客户是否意识到——但实施能够快速自动化传统由人类执行的任务的智能系统的竞争现在已达到高潮。这迫使中央银行和国家银行等监管机构发布了特定的法规，以使金融领域\
  \ AI 的发展与保护客户的最终目标保持一致。\n\n\n\n\n\n特别是，可持续性在银领域并非完全新概念。环境、社会和治理（ESG）可持续性方面的责任使银行和金融机构处于严格的之下，它们自身有义务证明其在衡量和减轻对人类及环境的非经济影响方面做出的实质性承诺。AI\
  \ 已被证明具有惊人的能耗，这是因为其算法极其复杂，需要大量的处理资源和时间。国际能源署（IEA）最近的研究显示，数据中心、AI 和加密货币领域的用电量到 2026\
  \ 年可能会翻一倍¹。事实上，在 2022 年全球消耗了估计 4600 亿瓦时（TWh）后，数据中心的总用电量到 2026 年可能超过 1000 亿瓦时。这些数据与\
  \ 2018 年之前的研究一致，当时 Belkhir & Elmeligi (2018)显示，整个信息和通信技术（ICT）部门预计到 2040 年将占全球碳足迹的\
  \ 14%，与整个航空业相当。即使是生成式 AI（如 ChatGPT）的使用也导致了这种影响。单次查询产生约 4.32 克二氧化碳，15 次查询产生的排放量相当于在\
  \ Netflix 上观看一小时视频。除了能量之外，水资源的消耗也非常显著：用 ChatGPT 生成 100 个字消耗的水相当于一瓶水，而 Google Gemini\
  \ 的数据中心消耗的水量几乎是达拉斯这类城市需量的四分之一。\n\n考虑到可持续性要求及其对计算资源（即能源）的需求，这些预测对金融科技（Fintech）领域是一个巨大的问题。使用的能量越多，就需要燃烧更多的化石燃料来满足指数级的需求。需要从金融科技向绿色金融科技（Green\
  \ Fintech）转型以实现该行业的去碳。如果 AI 如此消耗资源，如何让银行能够满足 ESG 标准呢？金融部门面临的一个风险是其近期在 AI 方面进展的不可持续性。由于可以假设无法回到没有\
  \ AI 的世界，因此研究应该为金融领域提供所有必要的概念、方法和技术工具，以衡量和减轻其所使用的 AI 带来的影响。\n\n## 软件可持续性与绿色工程\n\n\
  软件可持续性正成为质量和创新的基本指标，与可维护性、效率和代码安全等传统衡量并列。在软件质量保证（QA）中，行业习惯于考虑错误计数、执行速度、测试覆盖率和健壮性等指标。然而，需要更广泛的视角：将地球作为一个利益相关者。软件不仅仅是产品或工具；它也是能源和水资源的重要消费者。将环境影响纳入质量指标，对于确保技术进步不损害地球未来至关重要。\n\
  \n在过去的两年里，一种名为绿色软件工程（GSE）或可持续软件工程（SSE）的新学科运运生。GSE 有许多定义，其中之一是：GSE 是研究创建软件系统的学科，这些系统能够在长期创造价值，而不阻碍其周围的环境。正如微软前开发者\
  \ A. Hussain²（现任绿色软件基金会执行董事官³）所说，碳高效应用是指对于其所负责排放到大气中的每克碳提取最大价值的应用。除了技术债或可扩展性等传统指标外，可持续性可以被视为一个并行维度。将可持续性整合到软件实践中不仅是一种伦理选择，也是一种战略选择。地球作为一个利益相关者，要求公司考虑其对环境的影响。\n\
  \n## 金融科技面临的挑战与未来方向\n\n目前，关于 GSE 主题的研究主要是实证性的，因为新兴技术的有效性仍然未知。绿色 AI 子领域研究了能够在整个流程中减轻能耗和碳排放的技术和工具的有效性，特别关注三个阶段：开发（训练）、生产（推理）和维护（即重新训练）。根据可再生能源的高度波动性，其中一些技术涉及在空间和时间上的工作负载迁移。虽然上述技术（将在本章中详细描述）在总体上提供了有趣的结果，但由于金融领域的特殊性，也出现了一些问题。特别是对法规的强制性遵守以及用例的严格时间要求，使得此类技术无法立即应用。此外，由于目前绿色\
  \ AI 领域的文献非常碎片化，金融科技从业者、监管机构、公司/初创企业和研究人员很难掌握可用策略和所提挑战的整体视图。\n\n因此，本章的主要目标是为上述对金融应用中\
  \ AI 去碳感兴趣的利益相关者提供“一站式服务”。本章深入了几个对推进金融科技领域可持续发展至关重要的课题。它首先检查了碳指标，这些指标对于衡量金融科技运营的环境影响以及引导去碳工作至关重要。然后我们探讨了绿色软件设计的基本原则，强调了可持续编码实践和能效软件架构的需求。本章还回顾了正在进行的标准化倡议，旨在为将可持续性整合到金融科技生态系统建立共同框架和指南。此外，我们对绿色金融科技和绿色\
  \ AI 的现状进行了深入分析，突显了最新进展，以及利用 AI 技术促进金融行业可持续性的日益增长的兴趣。文中通过案例研究展示了 AI 如何被应用于金融科技以驱动更具可持续性的实践，并理解该行业面临的挑战。\n\
  \n\n\n\n本章其余部分的结构如下：第一节报告了技术背景，重点关注了可持续性标准。第二节描述了绿色金融科技（Green Fintech）和绿色人工智能（Green\
  \ AI）领域的文献综述，并证明了待解决的问题和动机。第三、第四节专门描述了适用于金融领域的碳感知 AI 技术：前者与训练阶段相关，后者关注于部署阶段。第五节进行了深入讨论。第六节（也是最后一节）总结了结果，包括最后的结语。\n\
  \n## 2. 技术背景与标准化倡议\n\n### 碳强度指标\n\n由于可再生能源相比传统能源具有成本优势，且随着技术进步其成本持续下降，再生能源正日益占据主导地位。为了加速向再生能源转型，必须在提高再生能源项目财务吸引力的同时，降低化石燃料能源生产的盈利能力。一种有效的策略包括：当低碳能源（如风能和太阳能）发电时增加用电，而在煤炭和天然气等高碳能源供电时减少用电。\n\
  \n“碳感知”意味着根据任何时刻电网的`碳强度`（Carbon Intensity）来调整能量消耗。`碳强度`包含了一系列评估特定时间和和能源生产对环境影响的指标。鉴于消耗的能量是化石燃料和再生能源的混合，生产单位能量的影响在不同时间和地区可能会有显著差异。虽然能源充足，但高效的捕获和存储仍然是挑战。\n\
  \n受不同地区资源可用性的影响，再生能源的部署在全球范围内扩大。然而，太阳能和风能等再生能源具有间歇性；阳光、风模式和云层覆盖不受人类的直接控制。此外，政治决策在再生能源的投资水平上起着重要作用。这对于某些清洁能源（如核能）尤为相关，尽管其排放较低，但引发了感知风险方面的担忧。由于这些因素，能源需求的增加或再生能源可用性的减少通常需要依赖化石燃料，从而提高了`碳强度`。衡量任何特定时刻正在使用的能源的当前“脏污”，可以为能源消耗的最佳时间和地点做出明智决策。\n\
  \n`碳强度`的单位是单位能量的质量（通常为`kg/kWh`或`lbs/kWh`）。质量指的是`CO2eq`（二氧化碳当量）的数量。相比于简单的`CO2`，更倾向于使用二氧化碳当量单位，因为有几种对大气有害的温室气体（`GHG`），它们对全球变暖的影响各异。1997\
  \ 年签署的《京都议定书》定义了 7 种有害的`GHG`，其中二氧化碳的危害最小。其他`GHG`包括甲烷（CH4）、氧化亚二氮（N2O）、氢氟碳氢化合物（HFCs）、全氟碳（PFCs）、六氟化硫（SF6）和三氟化氮（NF3）。人��类活动引发的`GHG`排放是全球变暖的主要根源。由于拥有\
  \ 7 种不同的`碳强度`信号是不现实的甚至是没有意义的，因此排放被转换为其二氧化碳当量。即使系统没有直接排放二氧化碳，测量其碳影响也是至关重要的。\n\n另一个重要的考虑是，并非所有温室气体都在相同的时间跨度内影响环境。按照惯，环境影响通常基于\
  \ 100 年影响的气体计算，被称为`100 年全球变暖潜力（100-GWP）`。下表是使用此标准计算得的。\n\n### 表 1. 京都议定书中定义的某些温室气体的\
  \ 100-GWP 值\n\n| GHG || 100-GWP |\n| --- | --- |\n| 二氧化碳 || 1 |\n| 甲烷 || 21 |\n\
  | 氧化亚二氮 || 310 |\n| 六氟化硫 || 23,900 |\n\n根据上表，`1kg`的甲烷（CH4）被估计比`1kg`二氧化碳（CO2）危险 21\
  \ 倍，`1kg`的氧化亚二氮（N2O）危险 310 倍，`1kg`的六氟化硫（SF6）危险 23,900 倍。（注：此处原文逻辑略有混乱，译文根据表格数据进行了对齐）。*更正：原文逻辑应为：*\n\
  \n由于拥有 7 种不同的`碳强度`信号是不现实的甚至是没有意义的，因此排放被转换为其二氧化碳当量。即使系统没有直接排放二氧化碳，测量其碳影响仍然是至关重要的。\n\
  \n另一个重要的考虑是，并非所有温室气体都在相同的时间跨度内影响环境。按照惯例，环境影响通常基于具有 100 年影响的气体计算，被称为`100 年全球变暖潜力（100-GWP）`。下表是使用此标准计算得的。\n\
  \n### 表 1. 京都议定书中定义的某些温室气体的 100-GWP 值\n\n| GHG || 100-GWP |\n| --- | --- |\n| 二氧化碳\
  \ || 1 |\n| 甲烷 || 21 |\n| 氧化亚二氮 || 310 |\n| 六氟化硫 || 23,900 |\n\n根据上表，`1kg`的甲烷（CH4）被估计比`1kg`的二氧化碳（CO2）危险\
  \ 21 倍，`1kg`的氧化亚二氮（N2O）危险 310 倍。一种权重函数用于将所有气体排放合并为二氧化碳当量：\n\n* 公式 1. 二氧化碳当量函数\n\n\
  ```\n${CO2}eq = \\sum_{g \\in GHG}\\left({{GWP_{g} \\bullet m_{g}} \\right)}\n```\n\
