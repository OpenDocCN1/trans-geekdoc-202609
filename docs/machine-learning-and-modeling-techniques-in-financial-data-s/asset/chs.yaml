  印度，尼赫鲁工程技术学院（Nehru Institute of Engineering and Technology）\n\nP. Dhivya\n印度，卡帕加姆工程学院（Karpagam\
  \ College of Engineering）\n\nS. Parameswari\n印度，斯里赛姆技术学院（Sri Sairam Institute of\
  \ Technology）\n\nK. S. Shreenidhi\n![Orcid Imagehttps://orcid.org/0000-0002-6844-0454](https://orcid.org/0000-0002-6844-0454)]\n\
  印度，拉贾拉克什米工程学院（Rajalakshmi Engineering）\n\n### 摘要\n将数据分析整合到内部审计中代表了一种变革性的方法。本探索探讨了数据分析如何增强审计活动的效能、生产力和整体价值主张。面临的挑战包括数据质量和技能缺口，而人工智能和机器学习等新兴趋势有望彻底改变审计。\n\
  \n### 1. 引言\n在咨询领域，审计过程涉及检查组织的运作方式。这一初始阶段为顾问与利益相关者合作以定义范围、目标和时间表奠定了基础。随后，顾问将运用各种方法来评估风险、检测欺诈并评估不同部门的绩效。\n\
  \n### 审计流程循环\n审计流程循环是持续的，因为它反馈到组织的学习、增长和未来的审计实践。如图 1 所示，该循环允许组织应对变化的市场动态保持灵活性。\n\
  \n#### 图 1. 审计流程循环\n```\n![979-8-3693-0001.f01](img/979-8-3693-0001.f01.png)\n```\n\
  \n\n\n\n\n这种转型的核心数据分析涉及对来自多种来源的结构化和非结构化数据的收集、清洗和分析，例如企业资源计划（ERP）系统、财务数据库、交易记录和外部数据。通过利用\
  \ `ETL`（提取、转换、加载）过程，可以将来自这些各种来源的数据整合到统一存储库中，从而对绩效指标、趋势和异常观察进行全面分析。这种数据驱动的方法支持更精细的风险评估和审计规划，使内部审计师能够优先考虑某些活动、有效分配资源，并针对识别出的风险和控制弱点定制审计程序。随着组织继续拥抱数字化转型，数据分析在提高审计效率和准确性方面的作用变得日益突出，这促使审计师需要采用新的技能和方法论，以补充传统的审计技术。\n\
  \n此外，数据分析促进了持续监控和实时风险评估，使审计师能够主动管理风险并在早期检测新兴威胁。这在监管要求不断演变的行业中尤为重要，在这些行业中，违规或忽视潜在风险的成本可能是毁灭性的。除了风险管理之外，数据分析通过对财务交易、账户余额和内部控制进行深度分析，显著增强了实质性测试。审计师现在可以使用分层、回归分析和预测性分析等技术，更准确地识别差异、违规行为和潜在欺诈。这些高级分析技术允许审计师深入挖掘数据，揭示通过传统抽样方法难以检测的隐藏模式。此外，数据分析使审计师能够跨业务部门、地区或时期进行趋势分析、基准比较和比较评估，为组织绩效提供宝贵的见解。\n\
  \n这种向数据驱动、以风险为核心的审计方法的转变不仅提高了运营效率，还为组织增加了战略价值。通过识别低效环节、揭示根本原因并与行业标准进行基准比较，内部审计师能够更好地与管理团队协作，实施纠正措施并驱动整个组织的持续改进。这种方法确保了审计不仅是合规性检查，而是成为战略决策和业务流程优化的不可或缺的一部分。通过利用数据分析，内部审计师可以发现直接影响组织底线的见解，从成本节约和流程改进到增强风险管理实践。结果是，数据分析正在从根本上重塑内部审计职能，将其从传统的基于样本的方法转向提供可操作、客观洞见的全面、数据密集方法。\n\
  \n本章探讨了数据分析在各行业内部审计流程现代化中的转型性作用。目标是研究数据分析的整合如何优化审计方法、增强风险管理、提高运营效率并驱动战略决策。通过深入研究金融、医疗保健、制造业、技术和政府等行业的实际应用，本文旨在强调数据分析对内部审计师的多方面益处。此外，本论文还探讨了数据分析如何促进持续监控、实时评估以及新兴风险的识别，从而为审计师提供为组织创造更大价值的工具。此外，本文调查了审计师在适应新技术时面临的不断变化的挑战和机遇，强调了审计行业中持续学习、创新和数据驱动见解的必要性。\n\
  \n在快速发展的数字版图中，数据分析仍然是内部审计未来的关键基础，使审计师能够在现代审计环境中适应、演进并取得成功。内部审计师角色的演变——即日益依赖数据和技术的角色——对于维护当今业务环境中审计职的完整性和相关性至关重要。在本章中，我们将研究数据分析如何重塑各部门的内部审计流程，以及组织如何利用这些进步来提高运营性能、降低风险并驱动价值创造。如\
  \ `图 2` 所示，这种向数据分析的转变使审计师能够保持领先，使他们能够适应新挑战、拥抱创新并在数字时代蓬勃发展。通过对数据分析潜力的探索，内部审计职能可以突破可能的边界，改进风险评估和管理，并成为组织创造价值的信赖来源。\n\
  \n#### 图 2. 数据分析在内部审计中的影响\n\n![979-8-3693-8186-1.ch009.f02](img/979-8-3693-8186-1.ch009.f02.png)\n\
  \n本书章节的其余结构如下：第 2 节回顾了关于内部审计整合数据分析的文献。第 3 节讨论了数据分析对内部审计工作流的影响。第 4 节探讨了整合数据分析的趋势，包括其在风险管理中的作用以及特定应用（如工资监控和收入审计）。第\
  \ 5 节强调了数据分析在内部审计中的优势，而第 6 节专注于数据分析咨询。第 7 节探讨了实施数据分析时面临的挑战，第 8 节涵盖了监管和合规考虑。第 9 节展望了数据分析技术的未来趋势，包括人工智能、机器学习和区块链。第\
  \ 10 节提供了行业实践和未来发展的见解，第 11 节通过总结发现和对未来实践的建议结束本章。\n\n### 2. 文献回顾\n\n数据分析正成为现代内部审计实践日益不可缺的一部分，提供了提高审计质量、完善风险评估技术和优化决策过程的潜力。其影响跨越金融、医疗保健和技术等多个领域。每个行业都为数据提供了独特的挑战、机遇和特定的方法。\n\
  \n在学术文章和行业报告的支持下，咨询公司在推进内部审计中使用数据分析方面发挥着关键作用。他们引入了方法论、框架、工具和技术，有助于客户组织内部实施数据分析流水线。这种日益增长的趋势强调了数据分析在提高审计效率和有效性方面的重要性。\n\
  \n特别是在医疗和金融等受监管的行业，对稳健数据治理策略的需求至关重要。有效的数据治理必须与监管环境保持一致，以确保合规并降低风险。文献回顾强调了真实案例研究，展示了数据分析在内部审计部门的成功应用，证明了这种转型方法的切实益处和成果。\n\
  \n\n\n\n\n# 大数据与审计的演变\n\nAlles & Gray (2016)的研究显示，企业对大数据的投资在 2013 年已达到 340 亿美元，预计这一数字到\
  \ 2016 年将飙升至 2320 亿美元。四大会计师处于将大数据整合到其业务实践的前沿，特别是当它成为其保证流程中至关重要时。尽管大数据在营销和医疗保健等领域取得了实质进展，但在审计中的应用仍处于早期阶段。该研究强调了阻碍大数据在财务报表审计中广泛采用的障碍，并提出了应对这些挑战的研究议程。\n\
  \n与此一致，Brazel et al. (2013)对审计师如何处理欺诈检测和决策提供了见解，揭示了少数审计人员即使在发现欺诈红旗时，也依赖非财务指标（`NFMs`）进行测试。他们的发现还表明，仅凭高欺诈风险不足以触发对不一致\
  \ `NFMs` 的深层审查，尽管审计师在受到适当提示时可以更有效率。此外，内部审计向更具协作性的、教练式的方法转变——而非“警察式”心态——已被证明能够增加对内部审计师建议的认同感，特别是在细微错误被忽略时（Brown\
  \ & Fanning, 2018）。这些见解强调了传统审计方法和大数据等新技术必须共同演进，以增强审计实践和有效性。\n\n## 信任与内部审计师\n\n有趣的是，经理倾向于信任内部审计师的建议，即使这些建议与他们的偏好冲突，特别是当这些建议被量化时。相比之下，经理对外部审计师的信任较低（Burton\
  \ et al., 2012）。作为管理培训地（`MTG`）的内部审计师被认为更有能力，这项研究（Carcello et al., 2018）首次证明了将内部审计作为\
  \ `MTG` 可以产生积极影响，这与此前的报告相反。\n\n## 行业改革\n\n内部审计师对管理决策的影响是显著的，从业人员文献表明，由于缺乏外部审计中常见的客户服务激励，“警察方法”往往会损害关系。这种紧张关系对内部审计师、管理层、外部审计师和公司治理具有深远影响（Fanning\
  \ & Piercey, 2014）。全球范围内提出了审计改革，旨在解决伦理、独立性、社会环境会计以及审计的未来等争议性问题。这些发展对于审计和会计领域的立法者、监管机构、专业人员、学生和研究人员至关重要（Hay\
  \ et al., 2014）。\n\n## 偏好翻转与可视化\n\n在审计中，当决策者根据是联合评估还是单独评估来对比评估选择时，就会发生偏好翻转（`PR`）（Hsee,\
  \ 1996）。该理论表明，`PR`的出现是因为某些选择特征在单独评估时更容易判断，而另一些则更具挑战性。决策者经常使用各种可视化工具分析跨不同领域（如营销和销售）的大数据集。Lurie\
  \ & Mason (2006)强调了视觉表示如何影响营销经理和消费者的决策，特别是在涉及数据分析或综合的语境下。此类表示可以提高效率、提供新见解并增加客户满意度，尽管尽管它们也可能引入偏差。\n\
  \n## AIS 研究的未来\n\nMoffitt et al. (2016)的研究补充了 2015 年美国会计协会关于会计信息系统（`AIS`）研究历史与未来的小小组讨论。它识别了顶级\
  \ `AIS`期刊中的关键研究课题，并预测了未来 30 年的研究趋势。同样，Stippich (2016)探索了审计领导者如何整合数据挖掘和分析，以优化审计部门的影响力和效率。他的目标是开发一个数据分析平台，以增强风险覆盖、提高审计效率并减少数据挖掘工作中的重复。IIA\
  \ 研究基金与勤诚天道的合作为这项研究提供了专业知识，该研究探讨了内部审计师的绩效声誉如何影响公司经理的信任（Tang et al., 2017）。\n\n##\
  \ 特定行业的数据分析\n\n在内部审计有效性领域，利用数据分析的项目在不同行业之间存在差异，每个项目都有针对其独特挑战的特定目标。例如，在金融领域，诸如`欺诈检测与预防增强`等项目使用先进的统计分析和机器学习算法来识别财务交易中的异常模式和潜在欺诈。在医疗保健领域，如`计单与理审计优化`等计划采用多种数据分析技术来提高计单活动的准确性，检测编码违规并防止收入损失，确保符合`HIPAA`等法规。同时，在技术领域，`IT\
  \ 控制评估与优化`等项目侧重于分析系统日志、网络流量和用户访问模式，以识别网络安全漏洞并加强信息安全措施。\n\n在咨询行业，如`内部审计转型计划`等计划旨在评估现有流程并实施数据分析解决方案，采用基于风险的审计方法来增强审计质量、简化运营并通数据驱动的见解提供价值。\n\
  \n除了行业特定的倡议外，各行业的组织现在正采用跨部门的数据分析项目，旨在不断改进和创新内部审计实践。这些计划通常涉及内部审计团队、IT 部门和数据分析专家之间的协作，他们共同努力创建满足组织特定需求和目标的定制化解决方案。通过战略伙伴和跨学科合作，组织可以利用数据分析来增强审计效率、优化风险管理策略，并开启价值创造的新机会。\n\
  \n\n\n\n\n通过培养数据驱动的决策文化并促进持续学习，组织能够使自己能够在不断演变的商业环境中蓬勃发展。在这种背景下，有效利用数据分析的能力已成为决定竞争优势和组织成功的关键因素。人工智能领域（Patil\
  \ et al., 2024；Prabhu, Nandanwar, et al., 2024；Prabhu, Kanse, et al., 2024)）、网络安全领域（Anand\
  \ et al., 2023；Prabhu et al., 2024；Ravindranathan et al., 2024)）、云计算领域（Saxena et\
  \ al., 2024）以及聊天机器人领域（Waghambare et al., 2023；M. Waghambare et al., 2024)的相关持续研究进一步贡献了业务运营的财务和非财务方面，驱动了创新并加强了内部审计功能。\n\
  \n### 3. 数据分析对内部审计工作流的影响\n\n数据分析显著重塑了内部审计工作流，提高了效率、准确性和降低风险的能力。数据分析工具在审计实践中的引入带来了更全面、实时的洞察，改进了传统审计流程的每一个步骤。下面，我们将探讨数据分析如何改变图\
  \ 3 所示的内部审计工作流的关键阶段。\n\n#### 图 3. 内部审计流程图\n\n![979-8-3693-8186-1.ch009.f03](img/979-8-3693-8186-1.ch009.f03.png)\n\
  \n在设定审计目标的初期，数据分析取代了依赖手动范围和有限洞察的传统方法。通过利用历史数据和之前的审计报告，审计师可以识别模式、优先考虑高风险领域，并将精力集中在潜在漏洞上。预测模型进一步完善了这些目标，对新兴风险提供了预见，并确保与更广泛的组织战略保持一致。\n\
  \n曾经耗时且碎片的数据源理解过程通过数据分析工具得到了简化。审计师现在可以整合并分析数据源。\n\n### 4. 集成数据分析的趋势\n\n数据分析已成为内部审计职中不可或缺的工具，从技术资产演变为决策和风险管理的基石。通过利用分析的力量，内部审计师现在可以提供实时洞察。依赖抽样和手动流程的传统审计模型已被数据驱动的方法所取代，后者提供了更全面、准确和及时的结果。随着组织继续产生海量数据，数据分析在内部审计中的作用预计将进一步增长。\n\
  \n#### 4.1 审计范式的转变：从传统方法到数据驱动方法\n\n商业环境日益复杂的复杂性以及对更敏捷审计流程日益增长的需求，使得数据分析变得不可或缺。通过提供组织运营更细粒度、全局性的视图，数据分析帮助内部审计师识别风险、提高合规性，并确保运营符合战略目标。\n\
  \n\n\n\n当今的商业环境运行在复杂的财务和信息系统中，对数据进行详细分析至关重要。与其依赖小样本子集，全面的数据分析能够描绘出更完整的潜在风险和弱点图景。内部审计职面临着提高效率的压力，要求尽早识别风险、及时响应并为组织运营提供价值的见解。通过采用数据分析，内部审计师可以满足这些日益增长的需求，提高风险评估的效率、准确性和有效性。这种方法还通过在风险升级之前对其进行识别和缓解，增强了组织的韧性。\n\
  \n## 4.4 数据分析在内部审计职能中的应用\n\n数据分析日益应用于内部审计的各个职能领域，特别是在支出管理、薪资发放和应收账款等交易领域。这些领域受清晰规则和流程的，为识别错误、成本节约机会和潜在欺诈提供了最佳机会。通过分析跟踪数据，审计师可以验证账单准确性并评估对合同义务的遵守情况。`IDEA`\
  \ 和 `ACL` 等高级工具简化了抽样过程，允许审计师确定合适的样本量和组成，从而在将其应用于整个总体而非仅是样本时，提供具有防御性的推论。\n\n## 4.5\
  \ 薪资与员工费用监控\n\n薪资管理面临着重大风险，包括幽灵员工、伪造工资索赔和篡改的时间表。数据分析提供了一种早期识别这些威胁的方法，允许组织维护财务完整性并确保合规。具体应用包括：\n\
  \n*   幽灵员工检测：通过分析个人信息的差异，识别薪资名单上已不再为组织工作的员工。\n*   离职后付款：跟踪员工离职后的付款情况，以防止未经授权的交易。\n\
  *   未批准的时间条目：检测可能导致过度支付的未经授权的时间条目。\n*   薪资分析：审查薪资数据的异常情况（例如过度加班），以识别值得关注的领域。\n*\
  \   费用报销申请监控：确保费用报销申请在批准限额内，并识别潜在的欺诈。\n\n这些技术不仅有助于降低财务风险，还能确保符合组织的政策和法规。\n\n## 4.6\
  \ 增强收入和应收账款审计\n\n数据分析在审计收入流和发票流程方面起着关键作用，特别是在电信和公用事业等等数据量巨大的行业。通过使用数据分析验证大型数据集的账单准确性，审计师可以更有效地检测传统抽样方法可能被忽略的错误和差异。同样，在应收账款方面，数据分析可以帮助识别诸如重复发票、缺失收据或坏账等问题。通过揭示信用控制过程中的弱点，审计师可以为改进财务管理和降低风险提供价值的见解。\n\
  \n## 5. 审计中数据分析的益处\n\n内部审计中数据分析的益处和挑战涵盖了广泛的因素，这些因素对于希望熟练实施分析以加强审计流程、识别风险并创造业务价值的公司至关重要。这项详尽的回顾解释了将分析整合内部审计的主要优缺点。\n\
  \n*   **增强风险识别与评估**：内部审计师利用数据分析分析来自不同来源的海量数据。这能够以更全面的方式识别和评估风险。通过应用先进的分析技术，欺诈审计师可以识别反复出现的模式、异常案例和新兴趋势（这些趋势代表了风险），然后采取预防和纠正措施。\n\
  *   **提高审计效率和有效性**：数据分析的使用确保了手动流程自动化、消除了重复性任务并加速了审计程序；这提高了审计效率和有效性。通过使用分析工具进行数据提取、清洗和分析，审计师可以集中在更具价值的任务上，如风险评估、根因识别和战略决策支持，从而实现资源优化并获得更好的审计结果。\n\
  *   **增强欺诈检测与预防**：数据分析允许内部审计师通过仔细检查交易数据、识别差异和揭示指示欺诈活动的模式，更有效地检测和预防欺诈。通过利用预测性分析模型和异常检测技术，审计职能可以对潜在欺诈风险进行主动识别，巩固内部控制并减少财务损失。\n\
  *   **优化资源分配与优先级排序**：内部审计职能的数据分析允许他们确定审计活动的优先级，以最有效的方式分配资源，并识别风险和影响最大的领域。审计师进行持续的基于风险的评估，并利用数据分析根据特定目标、标准和新风险规划和制定审计策略，以提高资源效率和范围。\n\
  \n## 6. 内部审计数据分析咨询\n\n内部审计数据分析咨询已成为应对日益复杂的商业环境的必要服务。面对监管要求不断演变、技术快速进步和海量数据等挑战，咨询公司通过使用数据分析为优化内部审计流程提供有价值的指导。这些公司帮助企业利用分析的力量来简化运营、增强决策并加强风险管理策略。咨询公司的主要目标是将数据分析与组织的战略目标相结合，使企业能够优化资源并促进可持续增长。\n\
  \n咨询公司的关注点之一是确保数据分析计划与组织的战略目标和风险管理优先级密切对齐。通过理解客户的目标、合规需求和风险概况，顾问量身定制分析模型以解决特定的业务挑战。这种战略对齐不仅有助于组织改进资源管理，还有助于改进决策并确保内部审计流程与公司的长期愿景保持一致。\n\
  \n除了战略对齐，咨询公司还强调将先进分析技术整合到内部审计职能中。他们与客户评估现有基础设施并识别差距，然后帮助实施能够处理来自各种来源的海量数据的领先分析平台。无论是通过数据可视化工具、预测模型还是机器学习算法，顾问都能确保组织能够获得尖端技术，使其能够做出数据驱动的决策并优化其内部审计流程。\n\
  \n\n\n风险评估和优先级排序是内部审计数据分析咨询视角下的其他关键要素。顾问强调了采用基于风险的审计方法的重要性，这有助于组织根据风险发生的概率和影响来确定审计活动的优先级。通过使用数据分析来评估各个业务职能固有风险和剩余风险，顾问能够帮助组织增强风险管理能力并加强内部控制，从而在潜在问题出现之前进行预防。\n\
  \n此外，数据质量和治理对于任何数据分析计划的成功至关重要。咨询公司帮助客户建立稳健的数据管理框架，制定全面的数据治理政策并实施质量保证流程。在整个数据生命周期中确保数据的准确性、完整性和透明度，对于生成可靠的分析输出以辅助决策并确保符合法规至关重要。\n\
  \n咨询公司还意识到在组织内部开发能力以支持数据驱动的内部审计非常重要。他们提供定制的培训计划，使内部审计人员具备数据分析工具和技术方面的必要技能和专业知识。通过培养持续学习和改进的文化，顾问帮助组织实现其分析投资回报率的最大化，并驱动内部审计实践的持续优化。\n\
  \n最后，顾问强调了对数据分析过程进行持续监控和完善的必要性。他们为组织提供了关键绩效指标（`KPIs`）、指标和基准，以衡量分析对内部审计效率和有效性的影响。通过定期的评估和反馈机制，咨询公司帮助组织识别优化和创新的领域，确保内部审计功能保持敏捷并响应不断变化的业务需求。\n\
  \n总之，在内部审计中成功实施数据分析需要战略对齐、先进技术的整合、彻底的风险评估、稳健的数据治理、技能开发以及持续的过程改进。咨询公司在指导组织完成这些步骤方面发挥着关键作用，帮助他们建立一个更高效、更有效且数据驱动的内部审计功能，在快速变化的业务环境中创造价值并降低风险。\n\
  \n## 7. 内部审计中数据分析面临的挑战\n\n#### 数据质量与完整性\n内部审计数据分析的主要风险是确保数据的质量、完整性和可靠性。不准确、不完整或有偏差的数据可能会导致分析结果产生偏差，从而导致不准确的推断。内部审计师必须部署现代的数据管理框架、数据清洗方法和验证流程，以缓解分析生命周期中的数据完整性问题。\n\
  \n#### 技术复杂性与集成\n数据分析技术的引入是一个复杂的过程，涉及将其整合到现有的审计流程中。组织在选择合适的分析工具、配置数据基础设施以及整合不同的数据源时可能会遇到困难。内部审计人员必须具备适当的技术知识，并与\
  \ IT 人员和外部供应商合作，以规避技术障碍并实现分析解决方案的平稳应用。\n\n#### 技能与人才缺口\n数据分析涉及统计分析、数据处理、编程语言以及数据可视化的能力。在这些情况下，审计师可能在使用分析工具时无效，或者不根据从工具中获得的信息采取行动。组织应始终在专业发展计划中分配资源，以帮助建立内部能力并培养数据驱动决策的文化，弥补审计职中存在的任何技能和人才短缺。\n\
  \n#### 数据隐私与安全担忧\n数据分析引发了许多隐私、机密和安全问题，特别是当数据涉及个人或敏感信息时（这在通过互联网传输数据时经常如此）。而这只是众多问题之一。组织应该遵循数据隐私和安全的监管要求、行业标准和最佳实践，以避免数据泄露、未经授权的访问以及对任何机密信息的错误处理。内部审计师应实施强大的数据治理框架、加密协议授权控制，确保敏感数据的安全并降低隐私风险。\n\
  \n#### 洞察的解释与可操作性\n数据分析专业知识仅是第一步。因此，在下一步中——审计师应该理解数据分析输出并对其进行确认以创建建议。理解业务背景、检测真实问题和清晰的报告是驱动变革和增强组织绩效的基本要求。审计师、利益相关者和经理之间的合作，以及以易于理解的方式展示发现结果，对于数据分析为业务提供可衡量的结果非常重要。\n\
  \n总而言之，数据分析为内部审计提供了许多优势，包括增强风险发现能力、提高效率、欺诈检测、资源优化以及更佳的法规合规性。然而，公司也必须解决若干挑战，例如数据质量、技术复杂性、技能开发、数据隐私和洞察的解释，以便充分发挥数据分析在其实内部审计功能中的潜力。\n\
  \n## 8. 监管与合规考量\n\n基于数据分析的内部审计需要一种全面的方法，并要考虑到各种法规的差异、管理实践、隐私因素、报告要求以及对不断变化的法规的适应性。现在我们将逐一查看这些元素。\n\
  \n#### 监管框架与标准\n内部审计部门应该深入了解其所在行业和地区的监管要求。这涵盖了相关法律的知识，例如针对上市公司的《萨班斯-奥克斯莱法案》(SOX)、针对处理欧盟公民个人数据的《通用数据保护条例》(GDPR)，或针对医疗保健机构的行业特定法规，如《健康保险可携带性与责任法案》(HIPAA)。遵守这些法规可确保数据分析过程符合法律并满足监管预期。\n\
  \n#### 数据隐私与机密性\n随着数据隐私成为一个非常关注的问题，内部审计师应确保数据分析项目符合严格的隐私和机密标准。这意味着要建立保护敏感信息的机制，并尽可能对数据进行匿名化或去标识化处理，同时确保符合\
  \ `GDPR`、`CCPA` 等其他数据保护法。审计师应监控数据访问控制、加密协议以及数据使用政策，以确保机密数据的安全。\n\n#### 数据留存与存储\n\
  \n\n\n\n法规通常规定了特定类型的数据应存储多久以及何种形式。审计师必须制定严格的数据留存策略，以符合法规和公司政策。他们应当确保数据存储解决方案是安全的、可扩展的，并且能够在指定时间内保留数据。定期对数据留存进行审计对于跟上监管要求、避免由数据存储和归档带来的安全风险至关重要。\n\
  \n### 审计追踪与记录\n维护完整的审计追踪对于证明遵守法律法规至关重要。内部流程审计师应记录数据处理的所有方面，例如方法论、假设、转换以及结果。这些记录是审计活动中尽尽职调查的证明，并为监管机构在审计期间查看提供了信誉支持。审计追踪管理的强度确保了审计职能的责任性和完整性。\n\
  \n### 监管报告与披露\n整合数据分析和组织审计需要负责任且合规的法规。此外，内部审计团队必须处理大量的法律法规，例如 `SOX`、`GDPR` 以及其他既定政策，以确保各种数据分析和其他业务流程基于法律，并符合监管机构的法律要求和预期。这意味着要对数据隐私和机密性实施严格措施，并制定清晰的数据留存和存储策略，同时维护跟踪所有数据分析程序下执行活动的完整审计追踪。内部审计师通过维护高标准的监管有助于保持合规，这增加了监管机构和利益相关者对组织的信任，并展示了组织对监管事务的重视。\n\
  \n### 主动监控\n此外，内部审计师应主动监控监管环境的变化，并转变其实以满足新要求。监管格局是动态的，法律法规随时间不断演变，因此非常需要对监管变化管理采取主动方法。内部审计团队需要不断评估不断演变的监管环境，批判性地审视这些更新，并相应调整合规框架以反映此类变化。在审计过程中体现灵活性和敏捷性以应对法规的变化，使审计实践符合现行法规、行业标准和最佳实践，从而提升了审计质量，并增强了组织对监管环境变化的适应能力。\n\
  \n总而言之，从内部审计部门的成功来看，监管和合规问题是部署数据分析的基石。通过主动遵守监管要求、保护数据隐私、妥善管理数据留存和存储、完整保留审计追踪、协助监管报告并跟上变化的法规，内部审计师可以在不断变化的监管框架下提高审计质量，最小化合规风险并维护组织完整性。不可否认，数据分析收集起初可能看起来很难，但不必成为你无法掌握的挑战。这可以通过应用现有工具并逐步将分析引入审计活动来实现。如果为数据收集和分析设定了特定目标，数据收集和分析将更加有效；同时，这确保了分析结果在每个审计周期中都能产生价值。\n\
  \n# 财务审计中数据分析技术的 9 大未来趋势\n新兴技术的整合正在重塑内部审计格局，在风险管理、运营效率以及审计师从组织数据中获取的洞察深度方面提供了重大进展。这些技术从人工智能\
  \ (`AI`）和机器学习 (`ML`）到区块链和高级数据分析，不仅正在改变传统的审计职能，还实现了一种更主动、数据为驱动的审计方法，从而推动更好的决策和组织韧性。\n\
  \n## 9.1 AI 与 ML 技术的整合\n彻底改变内部审计的最显著技术之一是人工智能 (`AI`）和机器学习 (`ML`）。这些工具使审计师能够实时分析完整数据集，识别传统抽样方法可能会错过的复杂模式。通过自动执行交易测试、文档审查和合规检查等常规任务的能力，`AI`\
  \ 减少了人为错误并提高了审计的准确性和效率。特别是机器学习，它从历史数据中不断学习，开发预测模型以预判潜在风险，包括合规违规、财务违异常和运营效率低下。这使得审计师能够专注于更高价值的任务，例如战略性风险评估和决策，而不是常规的数据处理。通过利用这些技术，内部审计正在从被动转向主动，预测性风险建模和异常检测现在已处于审计实践的最前沿。\n\
  \n## 9.2 机器人流程自动化\n机器人流程自动化 (`RPA`) 是另一项在内部审计领域取得巨大进展的技术。`RPA` 允许精确且一致地自动化重复的基于规则的任务。例如，`RPA`\
  \ 机器人被用于从多个系统中提取并验证数据，进行持续交易测试并生成全面的审计日志——且无需人工干预。这减少了审计师的人工工作量，提高了审计的速度和准确性，并实现了对财务和运营系统更广泛的覆盖。随着\
  \ `RPA` 全天候工作，审计持续进行，消除了与传统审计周期相关的延迟，并对组织的风险状况提供实时洞察。\n\n高级数据分析平台正越来越多地用于将原始数据转换为可操作的洞察。这些平台聚合并处理来自不同来源的海量数据，允许审计师创建动态仪表板，突出显示潜在风险、运营效率低下和性能趋势。实时监控能力实现了持续审计，这意味着审计师可以在异常情况发生时立即识别。此外，这些平台利用复杂的统计算法和机器学习技术来发现细微的模式并生成预测模型，为审计师的风险评估和欺诈检测提供了无与伦比的准确性。这种向数据驱动审计的转变确保了内部审计团队能够对组织绩效和治理提供更有价值的见解。\n\
  \n## 9.3 区块链与去惩罚化\n\n\n\n\n\n区块链技术通过提供不可篡改、透明且去中心化的交易账本，在内部审计领域也留下了自己的足迹。记录在区块链上的每笔交易都经过加密安全保护，创建了防篡改的审计追踪，确保了数据的完整性并消除了未经授权修改的风险。这对于透明度和可追溯性至重要的财务交易、供应链和合同协议的审计特别有益。此外，智能合约——由预定义条件触发的自动化合同——正在简化合规性验证和审计流程。通过实现交易的实时验证，区块链技术确保了审计人员能够获得完整的、防篡改的历史记录，增强了审计的准确性和可靠性。\n\
  \n## 9.4 云端审计管理系统\n\n云端审计管理系统正成为现代内部审计运营的基石。这些平台实现了数据存储的集中化，并加强了审计团队之间的协作，特别是对于分布在多个地点的团队。通过提供安全、可扩展的基础设施，云端系统能够实时访问审计文档、工作底纸和审计追踪，从而优化工作流和决策制定。高级加密、多因素身份验证和自动化备份机制确保了审计数据的安全性，而与企业软件的无缝集成则实现了数据的自动同步和性能跟踪。这种集中化的方法不仅提高了审计的效率和安全性，还促进了审计团队之间的强化协作，使得管理复杂的跨区域审计变得更加容易。\n\
  \n## 10. 行业洞察与未来趋势\n\n展望未来，预测性分析将成为内部审计策略的关键组件。通过分析历史数据，预测模型可以在潜在的未来风险、财务异常和合规问题发生之前对其进行预判。这种主动的方法允许审计人员更高效地分配资源，优先考虑高风险领域，并制定预防性的缓解策略。随着预测性分析工具的不断演进，预计它们将整合更多更先进的机器学习技术，以提高风险预测的准确性，并提供实时的动态风险评估。在问题出现之前预测并解决问题的能力将使内部审计师成为组织战略不可或缺的贡献者，而不仅仅是风险评估人员。\n\
  \n自然语言处理（NLP）另一项有望进一步增强内部审计的新兴技术。NLP 允许审计人员分析非结构化的文本数据（如合同、电子邮件和通信日志），以发现传统的人工审查可能会忽略的潜在风险或合规违规行为。NLP\
  \ 算法可以对文档进行分类和归类、执行情感分析并检测语义模式，为审计人员提供有关组织通信的深层洞察。这种能力将使审计人员能够自动化文档审查流程，减少在人工分析上花费的时间，并更快发现隐藏风险。随着\
  \ NLP 技术的成熟，预计其在合同分析、合规验证，甚至通过分析企业通信来检测新兴风险的作用将不断扩大。\n\n网络安全分析也正成为内部审计师日益关键的工具。随着组织面临日益复杂的网络威胁，实时监控数字安全态势的能力已变得至关重要。利用机器学习，网络安全分析工具能够惊人的速度和准确性检测漏洞、未经授权的访问尝试和潜在的突破。这些工具可以创建动态风险画像，预测潜在威胁并自动化事件响应机制，使内部审计师能够在网络安全风险管理中采取更主动的角色。未来，这些分析工具可能会与整体审计功能更加更加集成，为审计人员提供有关财务和数字风险的实时洞察，并允许跨运营和网络安全领域的全面风险评估。\n\
  \n持续监控和保证的趋势是另一个新兴技术预计在内部审计未来发挥重要作用的领域。通过采用评估关键风险指标和交易数据的实时监控系统，审计人员将能够进行不仅限于周期性循环的审计，而是对组织的风险态势提供持续洞察。这种转变将允许审计人员在问题出现时识别并解决它们，显著提高审计流程的响应能力和相关性。随着持续监控工具变得越来越精密，它们将整合预测能力和实时告警，进一步增强审计效率和响应能力。\n\
  \n## 11. 结论\n\n总而言，将数据分析整合到内部审计流程中，代表了各行业组织在管理风险、确保合规和提高性能方面的革命性转变。本研究对内部审计可以增强的领域中数据分析的探索表明，这种这种新方法具有显著的益处和广泛的应用。在金融、银行、医疗保健、制造业、科技和政府等行业中，数据分析赋能内部审计功能变得更加有效、高效，并符合客户对价值驱动型服务的需求。\n\
  \n例如，在金融和银行业，数据分析帮助内部审计师验证反欺诈检测、强化风险管理并维护严格的监管标准。同样，在医疗保健领域，理赔和账单审计、患者数据安全和欺诈检测等应用对于保护患者信息和财务完整性至关重要。在制造业和供应链管理中，数据分析增强了库存优化，改进了产品质量控制流程，并缓解了供应链风险，有助于运营的韧性和卓越表现。\n\
  \n在科技和 IT 服务行业，数据分析为内部审计功能提供了强大的工具来应对网络安全挑战、改进 IT 治理并加强事件响应能力，从而保护关键资产和基础设施免受不断变化的网络威胁。政府部门也受益于数据分析，它增强了财务管理，改进了计划绩效，加强了欺诈检测并确保了公共资源的有效分配。这种透明度有助于问责，并使服务接受公民的监督。\n\
  \n在这些行业中，数据分析不仅识别了风险和弱点，还为流程改进、成本降低和更有信息的战略决策提供了解决方案。这最终提升了组织的创新能力和竞争力。要在内部审计功能中成功采用数据分析，战略思维、稳健的基础和学习文化是至关重要的。随着组织在快速变化的技术格局中持续运营，数据分析已成为确保内部审计有效性的不可或的工具，允许审计人员保持领先，在数字时代进行创新并蓬勃发展。\n\
  \n\n\n\n通过探索数据分析的潜力，内部审计职可以突破可能性的边界，在增强风险评估与管理的同时，成为组织内部价值创造的信赖来源。此外，区块链技术的整合进一步增强了数据隐私。与传统的集中化系统不同（个人数据存储在单个易受攻击的单一数据库中），区块链确保参与方的数据经过加密并独立于网络，为保护个人隐私提供了成本效益的解决方案。区块链的共识算法维护了这种隐私性，任何新功能或开发都需要现有矿工的同意。这种民主化的方法确保了系统的稳定性并提高了透明度，进一步增强了对审计过程的信任。\n\
  \n\n\n\n在本研究中，利用人工智能和机器学习技术，对比分析了影响能源、信息技术和机械行业资本结构的财务指标。每个行业独特的财务结构导致了其资本结构管理策略的差异。研究应用了\
  \ `Lasso regression`、`ElasticNet` 和 `LightGBM` 机器学习算法来确定各行业特征重要性。分析表明，在突出流动比率、资产增长率和\
  \ `EBITDA 利润率`等关键指标的行业特定差异时，`LightGBM` 具有最高的预测性能。研究结果强调了基于 AI 的模型在财务分析中的重要性，这些模型通过揭示行业特定的优先事项来支持战略决策，并为更有效的资本结构管理和风险缓解策略做出了贡献。\n\
  \n### 1. 引言\n\n资本结构决策是指企业通过在股权和负债之间寻找理想平衡，为其投资融资的方式。在这种背景下，理想的资本结构可以使公司价值最大化、财务风险最小化并减少控制稀释。由于资本结构对公司价值和风险管理具有深远影响，它一直是公司金融领域的一个重要研究方向。(Jensen\
  \ & Meckling, 1976; Harris & Raviv, 1990, 1991; Stulz, 1990)\n\n资本结构也是揭示企业风险管理策略最重要的指标之一。特别是对于经营不同行业的公司，债务融资的结构和影响会随着行业经济、运营和财务动态的变化而变化。在这种背景下，确定影响不同行业企业资本结构的因素并分析这些资历的重要性，对于提高财务管理流程的有效性以及为投资者的风险评估过程做出贡献都具有重要意义。(Ahmad\
  \ et al., 2012; Rehan et al., 2023)\n\n近年来，机器学习（ML）和人工智能（AI）方法在财务分析和决策中的应用迅速增加，改进了各部门的战略决策。(Nguyen\
  \ et al., 2023; Wall, 2018)在这种背景下，将机器学习和人工智能应用于资本结构理论，与传统的回归模型相比，允许考虑多得变量，并揭示了影响资本结构决策因素之间的复杂关系（(Kraus\
  \ & Litzenberger, 1973)）。利用机器学习确定资本结构预测中解释变量的重要性，有助于企业的财务风险管理和战略决策。\n\n本研究旨在分析影响能源、IT\
  \ 和机械行业负债率的因素，确定影响不同行业企业资本结构的因素并分析这些资历的重要性具有具有重要意义。本章的结构安排如下：第 2 节回顾相关文献；第 3 节介绍使用的数据和方法；第\
  \ 4 节评估预测性能；第 5 节探讨特征；第 6 节提供结论。\n\n### 2. 文献回顾\n\n## 2.1 资本结构理论\n\n资本结构理论旨在解释公司如何平衡债务和股权，以及这种平衡如何影响表现。这些理论中广为人知的是\
  \ Modigliani & Miller, 1958。根据 `Modigliani-Miller` 定理，资本结构对价值没有影响。公司的价值完全由其利润决定。然而，该定理在没有税收、破产成本和信息不对称的情况下有效。在现实世界中，这些因素会导致公司调整融资水平。Modigliani\
  \ & Miller, 1963 修正了之前的理论并包含了税收的影响。在这种背景下，税盾理论认为利息支出为公司提供了税盾，因此融资可以增加公司价值。换言之，由于债务利息可以抵税，公司可能会利用这一点增加融资。然而，破产成本理论认为增加融资会增加破产风险，在这种情况下，融资可能会产生过高的成本。因此，公司融资到税收收益等于破产概率增加成本的程度。\n\
  \n另一个重要的理论是信号理论，它认为资本结构可以向外部提供有关公司的信息(Ross, 1977)。债务水平可以提供有关公司现金流和风险的信息。例如，高负债可以向投资者传递公司具有良好的盈利前景并能够偿还债务。\n\
  \n另一方面，层次理论建议公司按顺序进行融资决策。根据该理论，由于信息不对称和逆选择问题，公司首选从内部获得融资，并将外部融资作为最后手段。这种方法与信息不对称和外部融资的高成本（特别是发行股票的成本）有关(Myers,\
  \ 1984, 2001; Myers & Majluf, 1984)。当公司内部资源不足时，他们首先转向贷款，发行股权是最后首选的融资方式。\n\n## 2.2\
  \ 人工智能与资本结构\n\n\n\n\n\n近年来，关于机器学习和资本结构的研究已经超越了确定资本结构的传统方法。这些方法旨在通过使用更大的数据集和算法模型来确定企业的最优资本结构，从而优化融资决策。在此背景下，下文介绍了相关的文献，并回顾了构成本研究理论基础的先人研究。\n\
  \n## 文献综述\n\n### Tellez Gaytan 等 (2022) 旨在评估资本结构在金融市场中的预测性能，并识别最佳的预测模型。他们利用人工神经网络、支持向量回归和线性回归预测方法，分析了新兴市场指数中在巴西、中国和沙特阿拉伯运营的市值最高的\
  \ 9 家公司的资本结构。该研究重点于一个包含 46 个观测单位的数据集，涵盖了从 2010 年第一季度至 2021 年第二季度的季度财务报表中提取的 15 个财务比例。结果显示，`ANN`\
  \ 模型最适用于非线性数据，而线性回归模型在线性情景下表现更好。该研究还发现，`ANN` 网络在预测资本结构方面优于其他模型，特别是在新兴市场。\n\n###\
  \ Eliasy 和 Przychodzen (2020) 调查了人工智能是否可以用于资本资产定价模型（`CAPM`），以及 AI 是否能提供更准确的预期收益估算。资本成本定义了企业对任何投资的最低预期收益。因此，准确估算资本成本对于经理实现公司价值化至关重要。为了探索这一点，研究检查了\
  \ 2013 年 1 月 1 日至 2019 年 1 月 1 日期间，在 `S&P 500` 中列的前 10 家美国科技公司的收盘价。结果显示，使用人工智能使权益资本成本估算的准确性提高了\
  \ 60% 以上。所选的深度学习神经网络预测股票价格的强大能力使收益预测的准确性至少提高了 18%。该研究得出结论，人工智能在不久将来具有替代传统资产定价模型的巨大潜力。\n\
  \n### Bilgin (2023) 旨在使用非线性机器学习方法为实证资本结构研究选择控制变量，以最小化减少变量偏差，这在识别杠杆的潜在决定因素时往往被忽视。分析涵盖了\
  \ 2002 年至 2019 年间 58 个国家的 32,401 家公司。Bilgin 使用 `LASSO` 方法确定了现金资产、非债务税盾和流动比率的边际贡献。结果显示，这些指标是影响企业杠杆决策的显著因素，在实证资本结构研究中应对对其进行控制。\n\
  \n### Huang 等 (2021) 使用决策树方法分析动态资本结构与公司绩效之间的关系。该研究检查了公司随时间不断调整以达到最优资本结构的负债率是否是公司绩效的决定因素。他们还研究了决策树方法中关联规则是否能揭示有助于公司绩效的变量之间的隐藏关系。研究发现，负债率较低的公司表现更好，但\
  \ `Tobin's Q` 和 `ROA` 随着负债率的增加而恶化。他们还发现调整速度与公司绩效负相关，表明公司可能仍因此表现不佳。最后，他们得出资本结构外，市盈率、研发支出和分红率等变量也有影响。\n\
  \n### Amini 等 (2021) 调查了机器学习模型是否比线性模型更好地预测杠杆，通过构建 1972 年至 2018 年 128,417 个公司-年观测样本，并采用了\
  \ `random forest`、梯度提升机、广义加性模型 (`GAM`) 和 `LASSO`。比较分析显示，机器学习方法能更全面地选择因素，提供更准确的目标衡量，并加快目标的调整速度。该研究还允许确定的相对重要性。\n\
  \n### Karlsen 和 Mathisen (2021) 调查了机器学习在预测资本结构中的应用，并与传统模型进行了比较。他们分析了 1990 年至 2019\
  \ 年斯堪的纳维亚公司的数据。研究发现，`random forest` 和 `LASSO` 等技术优于传统的 `OLS` 模型，将错误率降低了 5% 到 49%。他们还比较了挪威和芬兰公司，揭示了行业差异。结果他们得出结论，单一模型无法准确预测资本结构，结合多种因素和机器学习方法可以显著提高准确性。\n\
  \n### Ghosh (2024) 分析了 2017 年至 2024 年来自不同行业（包括科技、汽车、食品、制造业和航空）的 51 家美国公司的财务数据，使用机器学习方法预测企业未来改变资本结构的决策。在分析中，考虑了\
  \ 600 多个可能影响资本结构变化决策的财务参数，并识别了最有效的 10 个参数。研究显示，`random forest` 方法在预测企业未来改变资本结构的决策方面结果非常成功。\n\
  \nJanabi 和 M (2021) 旨在利用机器学习优化经济资本结构，并通过更准确地模拟流动性和市场风险来增强资本结构，特别是在复杂和流动性差的市场中。分析结果强烈证实了在流动性调整\
  \ `VaR` 优化中应用具有财务和运营意义的非线性动态约束的重要性。\n\n### Myrland 等 (2022) 关注 161 家挪威运输公司的杠杆决策，使用各种回归模型（包括机器学习）检查企业贷款的决定因素。分析的时间跨度涵盖了\
  \ 2008 年至 2019 年，他们发现了对多债务利用理论的支持。他们还发现资产流动性是对比杠杆率影响最大的变量。此外，他们确定了资产流动性与杠杆之间的正相关关系，以及盈利能力与杠杆之间的负相关关系，并得出这些发现支持所有三种资本结构理论。\n\
  \n\n\n\nQi 和 Wang (2021) 从 2,541 家公司中构建了一个包含 24,512 个“公司-年度”观测值的最终样本，以调查美国公司债务结构变化的频率和性质，并利用机器学习方法分析公司如何随时间改变债务融资。他们还研究了不同信用评级公司之间在债务结构调整上的差异，并调查了财务约束如何影响这些变化的频率和动机。他们发现，公司频繁改变其债务结构，超过三分之一的公司每年都会改变债务结构，且这种变化通常持续年以上。他们还发现，高信用质量的公司通过调整结构来降低借贷成本，而低信用质量公司调整结构的频率频率高于高信用质量的公司。\n\
  \n# 3. 数据与方法论\n\n## 3.1 数据\n\n本研究分析了伊斯坦布尔交易所（Borsa Istanbul）交易的能源、IT 和机械领域 71 家公司从\
