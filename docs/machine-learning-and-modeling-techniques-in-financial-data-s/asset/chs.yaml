  \ |\n| 平均协作指数 | 3.44 |\n| 最大 h 指数 | 5 |\n| 总引用次数 | 16090 |\n| 每位作者平均引用次数 | 5.73\
  \ |\n| 每个机构平均引用次数 | 13.09 |\n| 每篇文档平均引用次数 | 18.04 |\n| 每个来源平均引用次数 | 39 |\n\n表 1\
  \ 对我们为科学计量学分析收集的数据集的统计数据和关键指标提供了全面概述，涵盖了 1996 年至 2024 年间发表的文档。该数据集包含来自 390 个不同来源的共\
  \ 892 篇文档，涉及 88 个国家和 1229 个机构的 2806 位独立作者。这些文档中的大多数（98%）以英语发表，尽管近 50% 的研究来自非英语国家，但英语仍然是科学通用语言。\n\
  \n文档类型多种多样，包括 623 篇论文、2 篇书籍章节、100 篇会议论文、166 篇论文集和 1 篇综述。这种多样性反映了学术期刊和会议环境对**金融数据预测中的机器学习**日益浓厚且不断增长的兴趣。大量的会议论文和论文集凸显了在科学会议上进行持续讨论和快速展示新兴研究结果的重要性，而大量的期刊文章则证明了对传播同行评审研究的坚定承诺。这些出版类型共同强调了该领域的重要性，以及其在学术文献和学术会议中活跃的跨学科参与度。\n\
  \n每位作者的平均文档数量为 1.1 篇，这反映了高水平的协作合著，`3.44` 的平均协作指数和 828 篇多作者文档证明了这一点，这些文档占文档总数的 93%。\n\
  \n此外，数据集显示了总计 2219 个作者关键词和 2056 个 Keywords Plus，这扩展了集合的主题广度。这些文档的影响通过总 16090 次引用得以体现，其中每位作者平均引用\
  \ `5.73` 次，每篇文档平均引用 `18.04` 次。这些指标突显了研究社区对这一作品的高度关注，表明这些出版物不仅被广泛引用，而且在该领域具有影响力。\n\
  \n随着我们继续进行探索性数据分析，我们转而使用词云对摘要进行视觉化探索。这种技术允许我们快速识别文档摘要中出现频率最高的术语，为不同作者讨论的核心主题和话题提供见解。\n\
  \n#### 图 2. 摘要中主要术语的词云\n\n![979-8-3693-8186-1.ch018.f02](img/979-8-3693-8186-1.ch018.f02.png)\n\
  \n#### 表 2. 摘要中的前 10 个单词\n\n| 单词 | 得数 |\n| :--- | :--- |\n| model | 1.0 |\n| data\
  \ | 0.705 |\n| financial | 0.637 |\n| learning | 0.617 |\n| forecasting | 0.537\
  \ |\n| prediction | 0.460 |\n| market | 0.442 |\n| stock | 0.407 |\n| price | 0.382\
  \ |\n| time | 0.39 |\n\n\n\n\n通过将 `UMAP` 与嵌入相结合，图 4 提供了基于主题相似性的文档聚类可视化，揭示了研究版图中五个不同的聚类。嵌入捕捉了文档之间的语义关系，而\
  \ `UMAP` 则将这些高维表示降低到二维空间，使得模式更容易被观察。图中的每个圆代表一个文档，每篇文档都分配了从 1 到 892 的 ID 编号。颜色编码的聚类将具有共同研究重点或方法论的文档归为一组。例如，绿色和橙色簇分布密集且位置接近，表明它们之间存在强的主题重叠，可能围绕机器学习算法和时间序列预测等核心话题。相比之下，紫色和黄色簇的位置较远，可能表明在金融数据预测的机器学习方法中，存在更专业、新兴或未被探索的领域或方法。总的来说，该图揭示了研究的主题和课题并非广泛分散；而是呈现出相对同质性，表明研究版图具有凝聚力，课题与方法之间相互关联。\n\
  \n此外，下方的颜色编码条形图提供了研究主题随时间演变的视觉表示，为新兴趋势和未来探索的潜在领域提供了见解：\n\n### 图 5 2010-2024 年期间关键词及增强关键词的演变\n\
  \n![979-8-3693-8186-1.ch018.f05](img/979-8-3693-8186-1.ch018.f05.png)\n\n图 5 展示了涵盖\
  \ 2010-2024 年期间文档摘要中使用的关键词和增强关键词（keywords plus）的演变，突显了利用机器学习方法进行金融预测领域时，该领域内研究重点的转移。在早期的年份里，即\
  \ 2010 年至 2014 年之间，“series”（序列）、“periods”（时期）和“method”（方法）等关键词非常突出，反映了对时间序列分析和基础预测方法的基础关注。在\
  \ 2015 年左右，“time”（时间）和“stock”（股票）等术语开始频繁出现，表明人们对金融市场应用（特别是股票预测）的兴趣日益增长。\n\n从 2017\
  \ 年开始，关键词显示向机器学习和先进预测技术的显著转变。“model”（模型）、“prediction”（预测）和“results”（结果）等术语变得更加频繁，标志着对预测建模的关注增加，以及对稳健结果的需求。到\
  \ 2020 年，关键词扩展到“machine learning”（机器学习）和“data”（数据），揭示了人们对将机器学习方法整合到金融预测中增长的兴趣。这种重新定位表明了这些模型在捕捉金融市场复杂动态方面的证明有效性，能够对未来市场趋势进行更准确的预测。\n\
  \n在最近几年，特别是 2022 年和 2023 年，该图显示与更特定方法和应用相关的关键词有所增加，例如“market”（市场）、“based”（基于）和“study”（研究），突显了向应用研究和现实应用的转变。这一进展强调了该领域从传统的时间序列分析向更复杂的机器学习技术和应用的演变，反映了更广泛的技术进步，以及对利用数据驱动方法进行金融决策日益加深的兴趣。\n\
  \n为了进一步调查，我们现在将重点转向国家、机构、来源和作者贡献的分析。\n\n### 图 6 桑基图：通过连接作者、国家、机构和语言，展示研究领域内复杂协作网络的全景\n\
  \n![979-8-3693-8186-1.ch018.f06](img/979-8-3693-8186-1.ch018.f06.png)\n\n图 6 所示的桑基图通过连接作者、国家、机构和语言，提供了研究领域复杂协作网络的全景。它突显了该领域的跨学科和国际化性质，展示了来自不同国家和机构的研究人员如何贡献共同知识体系。例如，我们观察到来自芬兰、德国和印度等国家的作者隶属于不同的学术部门，包括计算机科学、经济学和数学，强调了对于推进金融预测中机器学习应用至关重要的多学科方法。\n\
  \n这些连接也反映了英语作为出版主要语言的主导地位，说明了其作为学术研究通用语的作用。英语的广泛使用使得跨境合作成为可能并促进了全球思想交流，使研究结果能够更广泛的读者。此外，该图揭示了机构所属的多样性，研究人员遍布“Dept\
  \ Comp Sci”（计计系）、“Dept Econ”（经济系）和“Dept Inform Technol”（信息技术系）。这种多样性表明，对该领域的贡献不仅限于单一学科，而是通过多个学术视角的投入而丰富。总之，该图强调了该领域研究的协作性和跨学科性质，作者、机构和国家共同努力推向机器学习和金融数据预测领域知识的边界。\n\
  \n### 图 7 按文档数量统计的来源树图\n\n![979-8-3693-8186-1.ch018.f07](img/979-8-3693-8186-1.ch018.f07.png)\n\
  \n图 7 代表数据集中文章发表的主要来源树图。“Expert Systems with Applications”、“IEEE Access”和“Computational\
  \ Economics”作为最频繁使用的期刊脱颖而出，分别举办了 35、24 和 15 篇文档。这种分布表明了对关注应用计算方法的跨学科期刊的偏好，意味着金融市场是开发和应用预测方法最新创的主要领域之一。\n\
  \n基于这一见解，下方的图 8 提供了作者产出的时间分析，突显了关键贡献者多年来的发表模式。值得注意的是，时间线显示从 2017 年开始研究活动显著扩张，反映了对金融预测领域日益增长的兴趣和投入，同时在探索新的创新路径。诸如\
  \ `Iosifidis Alexandros` 和 `Kannaiainen Juho` 等作者表现出持续的参与，在多年中定期发表，表明他们在推动研究版图发展方面持续持续投入。该图还强调了协作努力，因为若干作者在同一年份发表论文，暗示了可能推动创新和发展的共同作者和伙伴关系。\n\
  \n\n\n为了进一步理解该领域的协作动态，我们现在将重点转向对国际研究伙伴关系的分析。在进行详尽的统计分析和探索性数据分析 (`EDA`) 后，提供了一份协作关系表，用于展示全球研究网络。它还突显了国家之间的联系以及跨区域共同作者的强度，揭示了研究活动的关键中心和国际合作的范围。\n\
  \n### 图 8. 作者生产力图\n\n![979-8-3693-8186-1.ch018.f08](img/979-8-3693-8186-1.ch018.f08.png)\n\
  \n### 图 9. 使用机器学习方法的财务预测领域全球协作网络图\n\n![979-8-3693-8186-1.ch018.f09](img/979-8-3693-8186-1.ch018.f09.png)\n\
  \n图 9 中的世界地图说明了使用机器学习方法的财务预测全球协作网络，强调了跨国研究努力的互通性。每条线代表国家之间的共同作者链接，而颜色深浅表示合作出版物的数量，颜色越深反映的活跃程度越高。值得注意的是，该地图说明财务预测是一个全球关注的话题，吸引了来自世界各个地区的学者。中国、美国、印度和多个欧洲国家等关键枢纽在跨国合作中处于领先，但亚洲、非洲、南美和澳大利亚国家的积极参与强调了该领域研究真正的全球性。这种广泛的国际合作增强了财务预测视角和专业知识的多样性，促进了创新并推进了对复杂财务系统的理解。所有大陆之间强有互通性强调了全球伙伴关系在推动财务预测研发方面的重要性。\n\
  \n作为研究的最后一步，我们探索了财务预测领域内的底层主题，使用自然语言处理 (`NLP`) 执行了主题建模分析。该分析识别出 13 个不同的主题，每个主题代表文献中一个独特的关注领域，如表\
  \ 3 所示。\n\n### 表 3. 从 NLP 分析生成主题\n\n| 主题 | 名称 |\n| --- | --- |\n| -1 | data_financial_forecasting_learning_model\
