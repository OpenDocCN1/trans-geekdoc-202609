  \n[content]\n本章其余部分的结构如下：第一节报告了技术背景，重点关注了可持续性标准。第二节描述了绿色金融科技（Green Fintech）和绿色人工智能（Green\
  \ AI）领域的文献综述，并证明了待解决的问题和动机。第三、第四节专门描述了适用于金融领域的碳感知 AI 技术：前者与训练阶段相关，后者关注于部署阶段。第五节进行了深入讨论。第六节（也是最后一节）总结了结果，包括最后的结语。\n\
  \n## 2. 技术背景与标准化倡议\n\n### 碳强度指标\n\n由于再生能源相比传统能源具有成本优势，且随着技术进步其成本持续下降，再生能源正日益占据主导地位。为了加速向再生能源转型，必须在提高再生能源项目财务吸引力的同时，降低化石燃料能源生产的盈利能力。一种有效的策略包括：当低碳能源（如风能和太阳能）发电时增加用电，而在煤炭和天然气等高碳能源供电时减少用电。\n\
  \n“碳感知”意味着根据任何时刻电网的`碳强度`（Carbon Intensity）来调整能量消耗。`碳强度`包含了一系列评估特定时间和地区能源生产对环境影响的指标。鉴于消耗的能量是化石燃料和再生能源的混合，生产单位能量的影响在不同时间和地区可能会有显著差异。虽然能源充足，但高效的捕获和存储仍然是挑战。\n\
  \n受不同地区资源可用性的影响，再生能源的部署在全球范围内扩大。然而，太阳能和风能等再生能源具有间歇性；阳光、风模式和云层覆盖不受人类的直接控制。此外，政治决策在再生能源的投资水平上起着重要作用。这对于某些清洁能源（如核能）尤为相关，尽管其排放较低，但引发了感知风险方面的担忧。由于这些因素，能源需求的增加或再生能源可用性的减少通常需要依赖化石燃料，从而提高了`碳强度`。衡量任何特定时刻正在使用的能源的当前“脏污”，可以为能源消耗的最佳时间和地点做出明智决策。\n\
  \n`碳强度`的单位是单位能量的质量（通常为`kg/kWh`或`lbs/kWh`）。质量指的是`CO2eq`（二氧化碳当量）的数量。相比于简单的`CO2`，更倾向于使用二氧化碳当量单位，因为有几种对大气有害的温室气体（`GHG`），它们对全球变暖的影响各异。1997\
  \ 年签署的《京都议定书》定义了 7 种有害的`GHG`，其中二氧化碳的危害最小。其他`GHG`包括甲烷（CH4）、氧化亚二氮（N2O）、氢氟碳氢化合物（HFCs）、全氟碳（PFCs）、六氟化硫（SF6）和三氟化氮（NF3）。人类活动引发的`GHG`排放是全球变暖的主要根源。由于拥有\
  \ 7 种不同的`碳强度`信号是不现实的甚至是没有意义的，因此排放被转换为其二氧化碳当量。即使系统没有直接排放二氧化碳，测量其碳影响仍然至关重要的。\n\n另一个重要的考虑是，并非所有温室气体都在相同的时间跨度内影响环境。按照惯例，环境影响通常基于具有\
  \ 100 年影响的气体计算，被称为`100 年全球变暖潜力（100-GWP）`。下表是使用此标准计算得的。\n\n### 表 1. 京都议定书中定义的某些温室气体的\
  \ 100-GWP 值\n\n| GHG || 100-GWP |\n| --- | --- |\n| 二氧化碳 || 1 |\n| 甲烷 || 21 |\n\
  | 氧化亚二氮 || 310 |\n| 六氟化硫 || 23,900 |\n\n根据上表，`1kg`的甲烷（CH4）被估计比`1kg`的二氧化碳（CO2）危险\
  \ 21 倍，`1kg`的氧化亚二氮（N2O）危险 310 倍。一种权重函数用于将所有气体排放合并为二氧化碳当量：\n\n* 公式 1. 二氧化碳当量函数\n\n\
  ```\n${CO2}eq = \\sum_{g \\in GHG}\\left({{GWP_{g} \\bullet m_{g}} \\right)}\n```\n\
  \n不幸的是，拥有 7 种不同的`碳强度`信号是不现实的甚至是没有意义的，因此排放被转换为其二氧化碳当量。即使系统没有直接排放二氧化碳，测量其碳影响仍然至关重要的。\n\
  \n（注：由于原文中存在大量重复段落，此处译文已去重并确保逻辑通顺。）\n\n\n\n\n有几个基于 Web 的服务可以提供实时碳强度信号（包括 AOER 和\
  \ MOER）。它们是 Electricity Maps⁴、WattTime⁵ 和 Carbon Aware SDK⁶。它们都提供了可以集成到现有软件中的 API。它们还提供历史数据集和预测数据。Electricity\
  \ Maps 仅提供 AOER，而 WattTime 同时提供 AOER 和 MOER。Carbon Aware SDK 是前两个提供者的封装，由绿色软件基金会（Green\
  \ Software Foundation）维护。WattTime 还提供一种健康信号（仅针对美国地区），以每兆瓦时（MWh）成本衡量。它基于 `VSL`（统计生命价值）的原理，根据该原理，人类生命的价值被评估为个人为避免死亡风险而愿意支付的价格。美国的\
  \ `VSL` 为 7.5M$ ⁷。健康信号衡量了产生 1MWh 电能（由于污染空气）所造成的健康损害（以美元计）。\n\n存在两种碳感知技术来减轻软件系统的环境足迹影响：需求转移（demand\
  \ shifting）和需求塑形（demand shaping）。它们都利用碳强度指标来改变软件的行为。接下来的两个小节将对其描述。\n\n### 需求转移\n\
  \n当活动（如数据密集型任务）允许在时间或位置上具有灵活性时，可以通过选择电网碳足迹较低的时段来优化能量消耗。例如，训练机器学习模型等任务可以推迟或迁移到可再生能源比例更高的时间或地点。研究表明，通过采用这些做法，可以实现显著的减排，范围从\
  \ 45% 到高达 99% 不等（Kelly et al. 2011），具体取决于电网可用的可再生能源组合。需求转移可分为两类：空间转移（spatial shifting），指根据位置调整能源使用；时间转移（temporal\
  \ shifting），涉及根据时间改变能量消耗。这些策略在实施时，对于最大化可再生能源利用和最小化碳排放起着关键作用。\n\n### 空间转移\n\n空间转移是指将计算任务迁移到当前能源供应碳强度较低的物理位置。这种方法利用了更依赖清洁能源的地区。例如，可以根据光照时间的季节性变化在不同半球之间切换计算，从而在太阳能供应充足的期间实现利用率最大化。\n\
  \n### 时间转移\n\n在空间转移不可行的情况下，时间转移提供了替代方案。这涉及重新调度计算任务，使其处于碳强度较低的时间，例如太阳能或风能发电增加的期间（这可能发生在一天中的晚时候或深夜）。天气预报的进步允许对未来的碳强度进行相当准确的预测，从而为何时执行密集型操作提供更有依据的决策。\n\
  \n大型科技公司已经意识到碳感知实践的价值，并利用复杂的建模技术来实施需求转移策略。例如，Google 开发了碳感知数据中心（Radovanović et al.,\
  \ 2022），该项目旨在将云负载与碳强度较低的时段对齐。通过预测模型预测未来的碳强度和负载需求，Google 优化大型任务的时间和位置，确保能量消耗与低碳时期重合。同样，微软在\
  \ Windows⁸ 中引入了碳感知倡议，从在碳强度较低的时间调度更新开始。\n\n### 需求塑形\n\n需求塑形是需求转移的补充策略。需求塑形并不涉及迁移或重新调度任务，而是涉及调整计算活动的水平以匹配当前的能源供应。当电网强度较低时，可以增加计算需求，允许执行更密集的任务。相反地，当碳强度较高时，则会减少需求。在碳感知应用中，需求塑形侧重于动态调整需求以匹配波动的能源成本。这一过程可以是自动的，也可以由用户决定。例如，家电器（如汽车或洗衣机）中常见的节能模式代表了需求塑形。当开启节能模式时，性能会刻意降低以节约能源。软件应用程序同样可以整合节能模式，无论是自动还是通过用户许可，以减少碳排放。一个相关的例子是视频会议软件在带宽较低时会自动降低视频质量，优先保证音频，以消耗更少的资源。\n\
  \n### 可持续 Web\n\n随着互联网成为我们生活中日益不可缺的一部分，其对环境的影响也显著增加。数据中心、服务器基础设施和大型 Web 应用的能源需求导致了数字领域的碳足迹不断。为了应对这个问题，可持续\
  \ Web 开发原则已变得至关重要。这些方法不仅旨在提高网站的性能和用户体验，还通过使 Web 体验更加节能和具有环保意识来减少其对环境的影响。\n\n\n\n\
  \n\n除了测试自动化和缺陷管理等传统的 QA 实践外，某些特定策略对可持续性有直接贡献。性能预算（Performance budgeting）在 W3C 的《Web\
  \ 可持续性指南》⁹中有详细介绍，它是确保由于数据传输减少和页面复杂性降低而消耗更少能量的核心工具。性能预算涉及对每个页面或功能允许消耗的资源设置限制。这种方法源于更广泛的性能优化领域，开发者旨在提高网站的速度和响应能力。在性能预算中，在开发过程早期就会定义特定的指标——例如页面权重、加载时间和请求数——以指导设计和技术选择，保持在这些限制之内。例如，性能预算可能会限制单个页面允许加载的图像、脚本或字体的总大小。通过执行这些约束，开发者可以避免不必要的膨肿，减少带宽占用并限制数据传输，这些共同导致了更快的加载速度和更流畅的用户体验。重要的是，这种做法还最小化了跨用户设备和服务器的能量消耗，因为较低的数据负载需要更少的处理能力和服务器资源。这既改进了软件性能，也减轻了环境影响。\n\
  \n此外，QA 的一项成熟做法是消除死代码或过时功能以增强可维护性。移除不必要的元素可以减少服务器工作负载和能量消耗，展示了可持续性和代码质量如何汇聚并造于软件和环境。另一种有影响的方法涉及降低网页的亮度。正如\
  \ W3C Susty Web 小组¹⁰所示，降低网络界面的平均亮度可以延长用户设备的电池寿命并减少整体能量消耗。此外，消除过时或未使用的功能不仅可以精简代码，还能减少技术债，在降低能源需求的同时增强可维护性。\n\
  \n为了有效衡量和减少网站的生态足迹，由 Green Web Foundation¹¹ 开发的 `CO2.js` 等工具提供了宝贵的见解。这个 JavaScript\
  \ 库允许开发者根据数据传输大小估计网页的 CO2 排放量。通过使用 `CO2.js`，开发团队可以识别优化区域，帮助减少数据传输和能量消耗。该库的完整文档可在\
  \ GitHub¹² 上获取，为开发者在旨在减少数字产品环境影响时提供了切实的指标。\n\nScottLogic 提供的《技术碳标准》¹³提供了另一个分析和缓解\
  \ IT 排放的有用框架。它将排放分为三个阶段：上游，关注开发期间的资源使用（例如夜间关闭测试服务器）；运营，目标是减少本地数据中心的排放，并倡导使用更绿色能源的云提供商；以及下游，强调优化软件以降低终端用户设备上的能量消耗。\n\
  \n由 W3C 可持续 Web 设计社区小组（SustyWeb）推广的 Web 可持续性原则进一步强化了效率、长寿和清洁能源的重要性。通过优化代码和减少页面权重来创建高效的\
  \ Web 体验，确保了网站的需求更少。为长寿进行设计减少了频繁更新或完全重构的需求，节省了能量和开发者资源。此外，对托管服务采用再生能源可以大幅减少网站和 Web\
  \ 应用程序的碳足迹。对于寻求将可持续性整合到数字运营中的组织，五步行动计划可以作为路线。首先，必须使用 `CO2.js` 等工具分析排放，以识别产生最大环境影响的地方。接下来，应该定义明确的可持续性目标，例如为代码和基础设施设置成熟度，并将可持续性纳入企业\
  \ KPI。第三，消除不必要的代码和功能将精简软件并减少能量消耗。第四步涉及实验和创新，鼓励采用具有可衡量目标的新型可持续解决方案。最后，通信至关重要：与同事和用户分享可持续性倡议可以培养更大的参与度和减少数字服务环境影响的承诺。通过采用这些做法，公司不仅可以提高软件的质量和效率，还可以为更可持续的数字未来做出贡献，为用户、利益相关者地球带来切实利益。\n\
  \n有关如何实施这些策略的更多细节，Climate Product Leaders 小组¹⁴ 的白皮书是一份宝贵的资源。\n\n## 全球标准化倡议\n\n国际标准化组织（ISO）和国际电工委员会（IEC）等多个机构已转向促进法规、标准、方法论和指南，以推动新技术的伦理、可持续和透明化开发。想要使用\
  \ AI 以环境可持续方式提供新服务的公司也必须遵守这些法规。下面简要介绍了目前执行的主要标准。\n\n*   **欧洲人工智能法案 15**：AI 系统可能对安全构成威胁，因为它可以影响人类的决策、观点和行动。2021\
  \ 年，欧洲委员会提出了一规则，旨在确保在日常活动和服务中使用 AI 系统的个人和企业的安全及基本权利。委员会根据风险对 AI 系统进行排序：不可接受的风险、高风险、有限风险和极低风险。所有欧盟成员国都必须遵守这项规定，并限制\
  \ AI 引入的安全风险。\n\n*   **ISO/IEC 42001:2023 AI 管理系统 16**：这是一项国际标准，规定了在组织内部建立、实施、维护和持续改进人工智能管理系统（AIMS）的要求。对于组织而言，它提供了一种结构化的方法来管理与\
  \ AI 相关的风险机遇，平衡创新与治理。\n\n*   **ISO/IEC 21031:2024 软件碳强度规范 17**：该文档描述了使用 `SCI` 评分（软件碳强度评分）计算软件系统碳排放率的方法。其目的是通过提供一种透明、标准的排放评估方法，增加人们对整个软件基础设施堆栈（硬件、软件、网络接口等）环境影响的意识。计算\
  \ `SCI` 评分（`公式 2`）的关键值是`运营排放`（软件运行产生的碳排放）、`隐含排放`（运行软件所需的物理资源产生的碳排放）和`功能单元`（例如每用户、每次\
  \ API 调用等）。\n\n    *   公式 2.SCI 速率公式\n\n```\n$SCI = \\\\frac{\\\\left( {~Operational~Emissions\
  \ + Embodied~Emissions} \\\\right)}{Function~Unit}$\n```\n\n\n\n\n- **运营排放（Operational\
  \ emissions）**是指系统或设备在使用期间产生的温室气体（GHG），包括运行软件或长期运行硬件时消耗的能量。**硬件体现（Embodied hardware）**包含了与物理组件生产、运输和处置相关的排放，涵盖了设备制造和整个生命周期影响的碳足迹。最后，**功能单位（function\
  \ unit）**提供了一个工作的衡量标准，例如“每交易”或“每个用户会话”，能够根据输出对不同系统进行一致比较。\n\n- **SCI 得分（SCI score）**的计算需要分析\
  \ IT 基础设施、代码效率、服务器能耗、地理位置、操作频率和持续时间、人数以及其他影响能源消耗的因素。根据得分，可以采用相关技术减轻所考虑软件对环境的影响。在下一节中，我们将详细介绍一家金融科技公司的案例研究，该公司使用\
  \ `SCI score` 定义了二氧化碳排放基准。\n\n- **可持续发展目标（SDG）**：`SDG` 是联合国于 2015 年建立的一组 17 个全球目标，作为《2030\
  \ 年可持续发展议程》的一部分。这些目标旨在解决贫困、零饥饿、良好健康与福祉、优质教育等全球性挑战。特别是目标 13 是指为应对气候变化及其影响而采取的行动。政府间气候变化专门委员会（IPCC）在\
  \ 2021 年显示，人类活动产生的温室气体排放导致自 19 世纪后期（1850-1900 年）以来全球变暖了约 1.1°C。`IPCC`估计全球温度将在未来二十十年内上升\
  \ 1.5°C。然而，这些估计是在 AI 时代之前做出的，而超级计算机需要越来越多的资源（能源和水）来训练算法，因此预期的全球温度可能远超过之前的预测。如果不采取适当措施，可能会导致水循环增强，在高纬度地区出现预期降水和相关洪水，亚热带地区出现罕见降雨，海平面上升导致海岸侵蚀、更频繁的海洋热浪、海洋酸化以及城市温度升高，对基础设施和公共健康产生严重后果。\n\
  \n- **环境、社会和治理（ESG）**：`Environmental, Social, Governance (ESG)` 是一套标准，允许投资者不仅根据财务回报，还根据公司的环境可持续性实践、社会影响和治理实践来评估其绩效。私人公司和认证公司根据特定参数为其他公司分配\
  \ `ESG score`。\n\n- 较低的 `ESG score` 与所有采用可持续性实践的公司相关。`Gupta et al. (2021)` 进行的研究显示了\
  \ `ESG` 值与财务价值之间存在统计相关性。具体而言：\n\n    - 低`ESG`公司和高`ESG`公司的平均“投资回报率”分别为 5.4%和 2.93%。\n\
  \    - 低`ESG`公司和高`ESG` 公司的平均“净资产收益率”分别为 19.83%和 2.93%。\n    - 银行 ICT 基础设施的去碳化是 `ESG`\
  \ 标准中 E（环境）部分的一个关键方面。去碳过程影响着整个 ICT 基础设施：从使用的服务器数量到其地理位置，从用户执行的操作次数到应用的后台消耗。尽管这个过程可能是令人恐惧、昂贵且耗时的，但它可以从新的基于\
  \ AI 的服务的去碳化开始。绿色 AI 技术使金融科技部门能够履行 `ESG` 监管并缓解气候变化。\n\n- **欧洲可持续发展报告标准（ESRS）**：《企业可持续发展报告指令》（`CSRD`）于\
  \ 2023 年 1 月 5 日正式生效。该指令要求欧洲以及部分非欧洲的公司和中小企业编制一份关于可持续性的综合报告。这些报告必须采用双重重要性视角——说明可持续性问题如何影响公司的财务绩效，以及公司的运营如何影响环境和社会因素。报告必须符合\
  \ `European Sustainability Reporting Standards (ESRS)`。`ESRS` 是由欧洲财务报告咨询小组（`EFRAG`）建立的一\
  \ set 原则，旨在标准化公司披露其 `ESG` 影响的方式。\n\n- **全球报告性倡议（GRI）**：`GRI Standard` 为公司创建报告提供了一套全面的指南，涵盖了环境、社会和治理的可持续性方面。这些标准与\
  \ `ESG` 原则兼容，并促进了组织在可持续发展方面的透明度和问责制。\n\n### 3. 文献综述\n\n在本节中，我们将介绍`绿色金融科技（Green Fintech）`和`绿色\
  \ AI（Green AI）`的最新进展。对金融科技领域采用基于 AI 技术的概述将有助于确定可能从去碳化中受益的用例数量和类型。然后，报告了与`绿色 AI`相关的现有行业案例研究。最后，提出了促使本章编写的开放问题。\n\
  \n### 绿色金融科技\n\n`Green Fintech`一词首次出现在 2017 年，当时联合国环境规划署（`UNEP`）和蚂蚁集团在世界经济论坛上发起了绿色数字联盟（`GDFA`），这是一个非营利基金会，旨在为气候、自然和生物多样性实现并共同创造变革性的数字和金融创新。`Green\
  \ Fintech`是金融技术与环境可持续性的结合，有两个主要目标。第一个是通过提供服务和资本来刺激绿色经济。第二个是在提供这些服务的同时，尽可能地减少这些服务对环境的影响。\n\
  \n正如`Google Trends`确认的，对`Green Fintech`主题的兴趣从 2016 年至今显著增长（见`图 2`）。y 轴上的数字代表相对于指定区域和时期图表最高点的搜索兴趣。数值\
  \ 100 表示该词搜索频率最高，50 表示一半的搜索量。另一方面，0 分表示未收集到足够该词的数据。金融公司对`Green Fintech`日益增长的兴趣表明，他们不仅在这一领域创造创新，而且正日益更加明智地这样做，即考虑环境。\n\
  \n### 图 2. “Green Fintech”查询的网页搜索数量的增长\n\n![979-8-3693-8186-1.ch002.f02](img/979-8-3693-8186-1.ch002.f02.png)\n\
  \n\n\n\n\n《巴黎协定》和联合国《可持续发展目标》（SDGs）代表了各国必须实现的目标，以应对气候变化、改善环境可持续性并促进社会经济增长。《巴黎协定》²⁵\
  \ 第 2.c 条邀请各国使“资金流向与低温室气体排放和具有气候韧性的发展路径保持一致”。实现这些目标需要应用新的技术，从环境角度来看，这些技术比现有的技术更具可持续性。这种向新技术的迁移需要大量的投资。2014\
  \ 年联合国会议期间提交的《贸易与发展报告》估计，每年总投资额为 5 万至 7 万亿美元（Nassiry, 2018）。\n\n尽管银行和金融机构采用可持续技术所需的投资可能会让他们望而却步，但在消费者对气候变化意识的提高推动下，存在潜在的投资回报。正如多项研究所示，消费者愿意为环保的服务和产品支付溢价（Biswas\
  \ & Roy, 2016; Wei et al., 2018; Namkung & Jang, 2017）。此外，千禧一代是金融科技的主要驱动力之一，并对可持续投资特别感兴趣²⁶（Hosen\
  \ et al., 2023; Srivastava et al., 2024）。\n\n金融领域的技术使得允许通过低成本投资将金融资源引导至可持续企业（Macchiavello\
  \ & Siri., 2022）。`Blockchain`、分布式账本技术（`DLT`）、`AI`、`Big Data` 和物联网（`IoT`）正被确保供应链、数字身份、金融包容、产权、绿色交易平台以及绿色众筹等其他绿色应用的透明度（Nassiry,\
  \ 2018; Macchiavello & Siri, 2022）。一个问题随之产生：使用非环保的 ICT 基础设施提供绿色服务的成本效益究竟如何？`Blockchain`\
  \ 和 `DLTs` 正确运行需要不忽视的能量，而这种能量会通过排放 `CO2` 影响环境。`AI` 算法的训练以及所有其他服务也是如此。\n\n### 金融科技中的\
  \ AI\n\n`AI` 在金融科技领域的整合不仅是一大趋势，更是一场影响现有金融系统、未来金融服务设计和消费者体验的伟大革命。在过去的 20 年里，关于金融科技中\
  \ `AI` 应用的文献大幅增加（Bahoo et al., 2024; Biju et al., 2024）。这是因为 `AI` 显著影响了金融机构管理安全、合规性、反欺诈措施、反洗钱（`AML`）以及了解客户（`KYC`）政策的方式（Bagó,\
  \ 2023](#979-8-3693-8186-1.ch002.bits-pdf.xhtml#_idTextAnchor127) 进行了一项全面的综述，确定了应用\
  \ `AI` 的十大主要研究方向：股市、交易模型、波动率预测、投资组合管理、绩效、风险与违约、加密货币、衍生品、银行信用风险、投资者情绪分析和外汇管理。Aysan\
  \ et al. (2024) 应用 `Random Forest` 算法利用 2016 年至 2021 的数据调查伊斯兰银行的风险管理。`Random Forest`\
  \ 广泛用于分类和回归任务。它基于多棵决策树的组合以提高预测的准确性和稳健性。同样的算法也被 Zheng et al. (2024) 用于分析和预测美国股市，准确率约为\
  \ 85%-95%。\n\n金融服务之外，`AI` 可用于保护消费者，防止信用卡欺诈、异常检测、保护敏感数据并提升整体客户体验。Lacruz & Saniie\
  \ (2021) 开发了两种高精欺诈检测方法：`Autoencoder`（半监督学习算法）和 `Logistic Regression`（监督学习算法）。Distante\
  \ et al. (2022) 应用 `AI` 来改善消费者体验。特别是作者应用了改进版的 `U-net`（Ronneberger et al., 2015），它利用用户的购买习惯来判断购买是否为典型，从而在购买典型购买时豁免强客户身份验证（`SCA`）。`U-net`\
  \ 是一种卷积神经网络（`CNN`），能够通过基于重构误差的方法进行异常检测，在训练和评估阶段均具有良好的性能。Aslan (2023) 为土耳其金融科技公司\
  \ Token Financial Technologies 提出了一种基于 `Isolation Forest` 算法的自动异常检测系统。`Isolation\
  \ Forest` 是一种无监督机器学习算法，它通过孤立异常点而非直接对典型数据进行建模来工作。该检测系统使该公司在 2020 年第四季度防止了超过 55%的银行应用程序被删除。\n\
  \n\n\n\n银行对人工智能（AI）的开发和应用得益于大数据的广泛利用。金融机构拥有涵盖交易历史、客户习惯、市场趋势等的数据，这些数据可以用于 AI 训练过程。金融科技\
  \ AI 算法的开发可以分为四个阶段：数据准备、模型选择、模型训练、验证与测试。\n\n在数据准备阶段，对可用数据进行预处理，以消除任何错误、纠正异常（例如不完整交易中的缺失值），并将其转换为规范化格式或便于处理的有用格式。在模型选择阶段，选择最合适的技术和算法来解决关注的问题。在模型训练期间，算法通过识别模式和关系从数据中学习。对模型参数进行微调和优化，以尽可能的减少误差并提高预测准确性。微调是指使用比训练数据集更小的数据，针对特定任务（如异常检测、财务预测、用户画像等）专门化模型。在验证和测试阶段，在与训练数据不同的数据上运行算法，以评估其在生产场景中的表现。如果性能不理想，可以返回之前的阶段来识别并解决任何开发错误或设计选择。需要考虑的是，选择模型需要对现有模型架构进行探索、研究和测试。这涉及大量的时间和计算资源，导致了显著的环境影响（Poenaru-Olaru\
  \ et al., 2023a）。即使在不完整或不适当的数据集上开始训练阶段也会导致资源的浪费，加剧环境影响。\n\n正如我们在下一节中看到的，有一些技术可以在不损害准确性或不增加处理时间的情况下减轻这种环境影响。\n\
  \n## 绿色 AI (Green AI)\n\n在本节中，我们通过分析提供的、可在开源许可下在线访问的复制包²⁷（Verdecchia et al., 2023），我们总结了近期系统性综述的一些结果。该研究分析了\
  \ 98 篇同行评审论文，强调了自 2020 年以来研究活动的显著增加。该综述对绿色 AI 文献中的关键主题进行了详尽总结，确定了 13 个不同的关注领域。其中，监控、超参数调优、模型基准测试和部署受关注最多。另一方面，探索较少的领域（如以数据为中心的方法、估算和排放）表明了未来应该解决的潜在研究空白。\n\
  \n在图 3 中，我们根据用于评估 AI 环境影响的抽象程度，展示了根据不同绿色 AI 定义的出版分布：能源效率（Verdecchia et al., 2021）、碳足迹（Wiedmann\
  \ & Minx, 2008）或生态足迹（Matuštík et al., 2021）。该图显示，只有 20 篇论文（占主要研究的 22%）专门针对 AI 碳足迹。这是值得注意的，最近的研究（Luccioni\
  \ & Hernandez-Garcia, 2023）强调，仅减少 AI 的能耗是一种过于简单的方法。\n\n### 图 3 按绿色 AI 定义分类的出版物\n\
  \n![979-8-3693-8186-1 type](img/979-8-3693-8186-1.ch002)\n\n20 篇主要研究分为观测类（Strubell\
  \ et al., 2020）、Dodge et al., 2022）、Fraga-Lamas et al., 2021）、Wu et al., 2022）、Ferro\
  \ et al., 2023）、Asperti et al., 2021）、Jooste et al., 2021; Bannour et al., 2021），定位类（Tamburrini,\
  \ 2022）、Kaack et al., 2022）、Willenbacker et al., 2021; Patterson et al., 2022）、Ligozat\
  \ et al., 2022）、Dhar, 2020；Rohde et al., 2021），以及面向解决方案的论文（Wenninger et al., 2022）、Henderson\
  \ et al., 2020）、Anthony et al., 2020；Lannelongue, 2021）。在这些论文中，观测类和解决方案类论文对本研究特别相关，我们在此简要总结了它们的内容。\n\
  \n\n\n\n## 文献综述\n\nStrubell 等人 (2020) 提出了一项开创性研究，评估了训练先进模型对碳的影响，强调了减少与 AI 开发和部署相关的碳足迹的紧迫需求。他们的工作在\
  \ AI 研究社区中引发了重要的讨论。\n\nDodge 等人 (2022) 引入了灵活启动、暂停与恢复训练策略的首个基准测试，该策略将在下一节中详细阐述。\n\
  \nFraga-Lamas 等人 (2021) 研究了 AI 系统创建和使用过程中涉及的碳足迹，特别关注 AI 驱动的 IoT 场景中的能量消耗，并报告了不同国家和能源来源产生的碳排放。\n\
  \nWu 等人 (2022) 研究了先进模型在整个生命周期内的能量消耗，为 Facebook AI 的碳足迹提供了见解。他们揭示，AI 模型约 50% 的总碳成本源于模型开发所用硬件的隐含碳，同时注意到\
  \ `GPUs` 的利用率极低，在大多数训练工作流中运行仅为容量的 30-50%。\n\nFerro 等人 (2023) 使用两种决策树算法和两种集成方法在二十七个数据集上进行了分类和回归任务的实验，评估了这些机器学习算法的能量效率以及设计参数对能量消耗的影响。\n\
  \nAsperti 等人 (2021) 评估了与各种变分编码器相关的能量成本，为比较不同模型和训练技术的能量足迹提供了有用的基准。\n\nJooste 等人 (2022)\
  \ 展示了模型蒸馏技术如何使机器翻译系统更具可持续性。在模拟的低资源德译英任务中，他们证明学生模型可以减少近 50% 的排放和成本。\n\n最后，Bannour\
  \ 等人 (Bannour, 2021) 回顾了测量自然语言处理 (NLP) 方法能量消耗和二氧化碳排放的工具。他们在不同的计算环境（本地服务器与云端）中使用命名实体识别实验比较了六种工具——`carbon\
  \ tracker`、`experiment impact tracker`、`Green algorithms`、`ML CO2 impact`、`energy\
  \ usage` 和 `cumulator`。\n\n关于 Wenninger 等人 (2022)，他们提供了一个估算任何机器学习模型碳足迹的框架。\n\nHenderson\
  \ 等人 (2020) 关注如何减少自身运营的排放。\n\nAnthony 等人 (2020) 建议银行应该投资耗能更低的机器。\n\nLannelue 等人\
  \ (2021) 提出了一种行业去碳的方法论。\n\n### 案例研究\n\n目前，可以观察到在倡议方面缺乏文档。\n\n2023 年，欧洲中央银行 (ECB)\
  \ 对欧元的环境足迹进行了一项研究。根据报告，纸币的环境影响 37% 源于 ATM 能量消耗，35% 源于运输，10% 源于纸张，5% 源于验证活动。\n\n\
  2024 年，多渠道银行软件公司 Auriga 发布了一份关于如何减少现金处理和访问排放的意见书。根据 Auriga 的观点，银行应该投资耗能更低并配备智能管理的新机器，例如低能耗\
  \ LED 照明、环境光检测和更高效的模块。论文还提到，向银行分支和 ATM 分配现金是碳足迹的第二大来源。\n\n因此，找到提高现金分配效率的方法至关重要。这涉及到解决物理分配方法，重点关注现金运（CIT）车辆如何减少燃料消耗或使用零排放燃料（如电力或绿氢）。此外，通过使用智能现金管理系统优化现金交付，可以减少物理现金的碳足迹，从而降低与\
  \ ATM 相关的排放。利用预测分析、人工智能和机器学习对现金取现进行实时监控，可以实现更可持续的管理策略。AI 可以分析整个 ATM 网络，以确定每台机器的理想位置、服务和现金水平，优化整体网络管理策略。此外，AI\
  \ 驱动的现金运输路线和频率优化有助于减少碳排放。Auriga 正在通过提供名为 `WWS Cash Management` 的 AI 服务帮助银行更具可持续性。`WWS\
  \ Cash Management` 是能够优化银行和金融机构整个现金管理流程的后端模块。其算法使用 12 个月的现金需求和流动数据集进行训练，使银行能够减少\
  \ 10% 到 25% 的现金处理成本。\n\n埃森提出的另一项研究（32）发现，全球只有 12% 的银行处于减少自身运营排放的正确轨道上。此外，IT 基础设施不仅需要大量电力，还需要冷却系统水资源。最后，ING\
  \ 银行通过发布报告（33）证明了对环境问题的承诺，报告显示全球用水量已从 2015 年的 738 亿升增加到 2021 年的 840 亿升以上。\n\n\n\n\
  \n\n全球领先的财富管理机构瑞银³⁴ 发布的一项案例研究，是唯一有案记录的银行主动为其软件产生的碳排放建立基准的情况。瑞银与绿色软件基金会（Green Software\
  \ Foundation）合作，使用 `SCI` 评分量化两个应用程序（投资银行应用和资产管理应用）对环境的影响。在进入实际用例之前，我们定义如下：\n\n*\
  \   `Energy`（能量）：硬件使用的最大能量。此数据来自中央应用数据库中的所有服务器。\n\n*   `Resource Share`（资源份额）：软件使用的硬件比例。此数据记录在中央应用数据库中，对于\
  \ `Virtual Machine`（虚拟机），可以从硬件使用数据得出。\n\n*   `Operating Time`（运行时间）：服务器运行以支持应用服务的时间。在研究中，作者假设软件每年运行\
  \ 365 天，每天 24 小时（8760 小时）。对于投资银行应用和资产管理应用，流程涉及计算每小时和每年的总二氧化碳运营排放，代表应用运行期间产生的排放（见\
  \ 表 2 和 表 3）。此外，该流程还包括计算托管应用的服务器总二氧化碳隐含排放（见 表 4）。最后，计算了应用本身的总二氧化碳隐含排放（见 表 5）。碳强度数据来源于数据中心所在国家的电网。\n\
