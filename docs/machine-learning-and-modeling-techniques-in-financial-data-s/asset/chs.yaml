  \n# 第一节\n## 金融服务中的 ESG、可持续性与公平性\n\n# 第一章\n## 信贷决策机器学习模型中的公平性与偏见\n\nSilvio Andrae\n\
  \n![Orcid Imagehttps://orcid.org/0000-0002-8586-7812)](https://orcid.org/0000-0002-8586-7812)\n\
  \n独立研究员，德国\n\n### 摘要\n机器学习(ML)模型改变了信用决策，提高了效率、预测准确性和可扩展性。然而，这些创新引发了对公平性和偏差的关键关注。本章探讨了在贷款领域应用\
  \ ML 的复杂性。平衡公平性和预测准确性是一项核心挑战，通常需要权衡，这凸显了 ML 系统的局限性。分析深入探讨了统计公平指标，并研究了这些指标如何解决或加剧偏见与公平之间的权衡。它强调了\
  \ ML 模型透明度和解释性的重要性，因为这些不仅是理想的，而且是建立信任和在不牺牲性能的情况下使系统易于理解所必要的。来自美国和英国的实证研究强调了数据质量、模型设计和跨学科协作在缓解偏见方面。本章涵盖了技术和社会和社会维度，并为在贷款中负责任地利用\
  \ ML 同时降低伦理和经济风险提供了可行建议。\n\n### 1 引言\n贷款是现代金融系统的基本功能之一，是经济增长和社会流动性的关键驱动力。近期，行业经历了范式转移，因为机器学习和人工智能日益取代信用决策过程中的传统方法。这些技术可以加速数据分析，提高准确性，并更高效地评估信用风险。然而，这场革命也带来了巨大的挑战，特别是在公平性和偏差方面，这些是科学、监管和社会辩论的核心(Jui\
  \ & Rivas, 2024)。\n\n贷款领域引入 AI 和 ML 通常被誉为创新和效率的规则改变者。这些技术具有根据人类大脑无法访问的大数据集进行准确预测的潜力。它们承诺自动化复杂流程，并为数据驱动的业务模式（特别是金融科技）提供新机会。这种创新潜力不仅令人兴奋，还为贷款的未来开启了无限可能。然而，重要的是记住这些技术并非没有风险，风险可能会影响平等和公平等基本社会原则(Pagano\
  \ et al., 2023)。\n\n\n\n\n批评者主要强调了“深度自动化偏见”的严重风险，该术语用于描述机器学习系统持续存在并放大现有偏见的倾向；这种偏见由于机器学习质量不足、算法问责机制缺失以及误读的共同风险而进一步放大，并可能导致人机决策中的冲突发生阶跃性变化（O'Neil,\
  \ 2016）。尽管存在多种形式的偏见，如种族偏见、性别偏见或社会经济偏见，但这些风险最终源于由于函数复杂性和用户实践（受限于控制选项）导致机器学习系统行为与规则之间可能发生冲突。这些挑战不仅是伦理问题，还可能产生经济和法律后果。例如，基于性别、种族或其他特征的歧视可能会限制获取金融服务的途径，并降低对技术创新的信任。对于公司而言，这面临着声誉损害、监管制裁和法律诉讼的风险。\n\
  \n本书章探讨了信贷决策机器学习模型中公平性与预测准确性之间的张力。公平性有多种概念，主要的基于独立性、分离性和充分性标准。然而，贷款是一项不仅取决于机器学习预测（例如违约概率），还取决于主观决策（一组阈值）的决策，而这反过来又取决于风险偏好（Babaei\
  \ & Giudici 2024）。将机器学习用于决策使得发现海量数据中的隐藏模式成为可能。它可以提高对借款人还款行为预测的准确性。然而，这引发了这些技术对人群潜在影响的问题（Brotcke,\
  \ 2022）。担忧之一是，分析现有数据可能会复制、延续甚至放大过去的人类偏见。然而，这不仅仅是一个技术优化问题，还涉及这些技术的伦理和社会影响。一个特别具有挑战性的问题是在不损害模型效率和性能的情况下提高透明度。虽然算法决策可以比人类判断更精确，但它们往往缺乏解释性。这种所谓的“黑箱”问题导致在评估模型是否运行良好且可靠时存在不确定性。\n\
  \n另一个重点是识别和分析偏见，偏见可以在多个层次产生：训练数据、模型架构以及使用模型所在的制度框架中。本章研究了如何结合技术、组织和法律措施，在最大限化发挥\
  \ AI 效益的同时，度地减少歧视。\n\n本章采用混合方法法来探索贷款机器学习模型中的公平性和偏见。它将理论分析与实证研究相结合，借鉴了美国和英国的案例研究来说明真实世界的应用和挑战。评估了关键的公平性指标（如机会均等和人口统计学差异），以评估它们在信用评分中的适用性。该方法还涉及对学术文献、政策框架和行业实践的批判性审查，以识别偏见模式和潜在解决方案。评估了技术措施（如公平性约束学习和对抗训练）在平衡准确性与公平性方面的有效性。该研究进一步结合了来自跨学科的定性见解。\n\
  \n### 2\\. 公平性的概念与指标\n第 2 节首先讨论了预测准确性与公平性之间的权衡。它定义了核心术语，包括公平性和偏见。介绍了多种公平性指标，例如 `equality\
  \ of opportunity`（确保相似的个体得到相似对待）和 `demographic parity`（确保不同群体之间的影响相似）。\n\n### 3\\\
  . 透明度与黑箱问题\n第 3 节讨论透明度，将其描述为一把“双刃剑”。一方面，透明度对于让用户理解决策是如何做出的至关重要；另一方面，当复杂模型难以理解时，它可能会导致挑战，从而在解释性（模型如何运作）和可理解性（决策如何被接受）之间产生张力。我们越透明，我们的受众就越感到安心。\n\
  \n### 4\\. 实证研究：美国与英国\n第 4 节回顾了关于贷款公平性的实证研究，重点关注了美国和英国的案例。美国的分析侧重于信用评分和金融科技公司的角色，而英国视角则强调了模拟。两种方法都强调了数据质量和模型设计的重要性。\n\
  \n### 5\\. 偏见分析\n第 5 节分析了偏见的成因和影响。它讨论了训练数据、算法偏见和文化因素的作用。强调了偏见的潜在后果——包括歧视、信任缺失和经济损害——以强调解决这一问题的紧迫性。\n\
  \n### 6\\. 措施与解决方案\n第 6 节介绍了涵盖技术、组织和法律措施在内的解决方案。这些包括以下方法：\n- `fairness constraint\
  \ learning`（训练模型，使其预测不受种族或性别等敏感属性的影响）\n- 多元化的开发团队（在模型设计过程中带来不同的视角）\n- 定期审计（有助于识别和纠正偏见）\n\
  人工智能监管和反歧视也被强调为重要的行动领域。\n\n### 7\\. 结论与未来方向\n第 7 节总结了主要发现，并探讨了开放问题和未来研究领域。这些包括开发新的公平性指标、设计符合伦理的\
  \ AI 系统，以及跨学科协作的必要。这种协作对于解决信贷决策机器学习系统中公平性和偏见的复杂挑战至关重要。\n\n\n\n\n金融中介的业务模式依赖于对客户需求的良好理解。为了从风险角度正确评估金融产品的价格，对客户的信誉状况进行评估也是必要的。机器学习模型在信贷决策过程中的日益整合，显著提高了信用风险评估的效率和准确性。对贷款申请的自动化分析减少了决策过程的主观性。然而，由于机器学习基于银行数据集中记录的过去决策，该过程往往会强化对由种族、性别、性取向等特征定义的群体的既有偏见和偏差（Garcia\
  \ et al., 2024）。它关注的是公平性和偏见，因为算法决策往往会在无意中强化歧视。本节将阐明公平性和偏见在这一特定背景下的含义、它们如何产生冲突，以及受众在解决算法偏见方面发挥的关键作用，以使这些复杂关系变得可衡量且对所有人更加公平。\n\
  \n## 1.1 定义\n\n贷款背景下的公平性是指无论性别、种族、年龄或其他受保护特征等因素如何，对个人或群体进行平等对待。其目标是确保算法决策不会系统性地使某些群体不利或强化现有的社会不平等。通过促进公平性，我们可以努力减少这些社会不平等。公平性并没有一个统一的定义，它取决于视角和应用场景。在信贷模型背景下，通常区分两种基本方法：程序公平性和结果导向的公平性。程序公平性指的是决策过程的公平性，而结果导向的公平性旨在实现不同群体结果的平等。\n\
  \n另一方面，偏见在贷款决策中起着重要作用，导致结果出现系统性扭曲，这些扭曲可以追溯到不公平或不准确的假设、数据或模型架构。这些扭曲可能发生在各个阶段，从用于的训练数据到算法假设，再到结果的解释。例如，用于构建模型的历史数据可能会在无意中将现有的不平等纳入模型决策中。当偏见导致某些群体（如贷款中的女性或少数群体）面临系统性劣势时，问题会变得尤为严重。\n\
  \n## 1.2 预测准确性与公平性之间的权衡\n\n应用基于人工智能的信贷模型时，一个核心争议点是预测准确性与公平性之间的平衡。至关重要的是要理解，机器学习模型的设计是为了根据可用数据做出尽可能准确的预测。在此过程中，这些模型通常优先考虑整体效率和准确性的最大化。然而，如果某些群体在数据中的代表性不足或受到系统性偏见的影响，这可能导致不平等的对待。根据\
  \ TransUnion (2022)，在美国，有超过 4500 万消费者被认为没有银行账户或银行服务不足。在其他国家，当地信贷局能看到的人群更少。这种平衡不仅是一个技术挑战，更是一种道德义务。\n\
  \n一个说明性的例子是使用过去可能遭受歧视的历史贷款数据。例如，在这些数据上训练的模型可能会通过系统性地为不利社区的申请人生成较低的信用评分，从而复制这些模式。这在严格的统计意义上可能提高了预测准确性，但与确保公平性直接冲突。\n\
  \n另一个紧张源于需要直接从模型中移除特征或中和其影响。从数据中删除性别等属性在直觉上是公平的，但它可能会适得其反，因为特征通常由其他变量（如收入）间接表示。当一个看似中性的变量被用作受保护特征的替代品时，就会发生代理歧视，导致歧视性结果。预测准确性与公平性之间的权衡是技术性的，具有深远的社会影响。高精度对贷款人来说在经济上具有吸引力，但必须满足社会对公平的预期以建立信任。\n\
  \n## 1.3 衡量公平性的指标\n\n为了更好地理解和管理这种冲突，使公平性变得可衡量至关重要。统计公平性准则可以表示为属性、结果和评分的联合分布。Barocas\
  \ et al. (2018)识别了三个准则作为近似：充分性、分离性和独立性。\n\n独立性意味着预测与敏感属性（例如种族、性别）统计无关。它要求模型在每个群体内部产生相同的评分分布。由于人口群体之间的收入和财富存在显著差异，这对于评估还款风险并不是一个有意义的公平准则。因此，独立性作为评分公平的准则至少受到了质疑。\n\
  \n分离性准则假设结果的评分分布在每个群体中是相同的。这保证了对于贷款决策中使用的任何阈值，每个群体的真阳性性和假阳性率都是相同的。最后是充分性准则：无论属于哪个群体，模型分配相同评分的个体其实违约风险是相同的（Bono\
  \ et al., 2021）。\n\nLiu et al. (2019) 显示，标准的机器学习程序隐含地追求充分性。这假设受保护特征可以通过其他变量的帮助进行良好的三角测量。然而，同时也指出，没有评分系统可以同时完美满足充分性和分离性。\n\
  \n公平性指标在解决公平性的不同方面起着关键作用，取决于应用的背景。最佳技术取决于具体的背景和应用，因为每种方法都有其优缺点（Siddique et al.,\
  \ 2024）。最常见的方法包括：\n\n1. **均等机会 (Equal Opportunity)**：该指标确保在符合条件的情况下，所有群体获得积极结果（例如贷款批准）的概率相同。如果不同人口群体的准确积极率相同，则模型满足了这一要求。这种视角确保了不利群体不会被不正地排除在积极结果之外。\n\
  \n\n\n\n\n### 2 b) 人口统计均衡 (Demographic Parity)\n该指标要求正面结果（例如贷款批准）的分布在所有群体中保持一致，无论它们的资质如何。这一标准经常受到批评，因为它可能导致某种形式的歧视，即为了实现结果平等而倾向于某组资质较低的申请者。\n\
  \n### 3 c) 错误率均衡 (Error Rate Parity)\n该指标确保错误率（假阳性和假阴性率）在不同群体之间保持一致。例如，少数群体被错误拒绝（假阴性率）或错误批准（假阳性率）的可能性不应高于多数群体。\n\
  \n### 4 d) 个体公平 (Individual Fairness)\n这种方法强调相似的申请人无论属于哪个群体，都应该受到相似的对待。它要求模型评估具有更细的粒度，并且通常更具挑战性，因为它对“相似性”有清晰的定义。\n\
  \n### 5 e) 基于因果指标 (Causal-Based Metrics)：\n这些指标识别并消除敏感特征与模型决策之间的直接和间接因果关系。然而，此类方法需要对数据和底层关系有深入的理解。\n\
  \n这些指标每一个都为公平性提供了独特的视角，但也带来了挑战。同时满足所有公平性标准并不常见，因为其中许多标准之间会相互冲突。这种稀有性凸显了在机器学习模型中实现公平性的复杂性和困难。此外，公平性指标的选择还受到政治和社会优先事项的影响，这为这项任务增加了另一层复杂性。\n\
  \n## 2 透明度：一把双刃剑\n透明度是机器学习中的关键元素，特别是在贷款领域。它不仅关乎加强对算法的信任并确保决策问制，更是一个复杂的问题，面临着从技术追溯性到终端用户理解能力的各种挑战。而且它并非没有悖论，悖论可能会使披露与可用性之间的平衡。\n\
  \n### 2.1 透明度的重要性\n算法决策的可追溯性是一个关注点，特别是在贷款等领域，决策会对个人和群体产生深远影响。在这种背景下，透明度意味着导致决策的过程和标准是公开且可理解的。它有几个作用：\n\
  \n*   **促进信任**：通过促进信任，透明度在增强用户对机器学习系统的信心方面发挥着关键作用。它通过揭示这些系统如何工作并使结果变得易于理解，从而消除用户对其可靠性的担忧。\n\
  *   **提高问责制**：当算法透明的时，错误的决策可以被更好地追踪和纠正。这对于识别和补歧视或系统性偏差至关重要。\n*   **满足监管要求**：透明度不仅是一种良好的做法，而且许多国家（特别是欧盟）的法律要求。诸如\
  \ `General Data Protection Regulation (GDPR)` 等法规要求自动化决策具有可解释性，这使得透明度成为合规的必要条件。\n\
  \n然而，尽管透明度关重要，但它并不是最终解决方案。其有效性取决于如何定义和实施它。如果设计不当，可能会导致意想不到的后果，从而凸显了问题的紧迫性。\n\n###\
  \ 2.2 透明度的定义\n根据视角和目标观众的不同，透明度可以有不同的解释。两种常用的方法是技术透明度和社交透明度：\n\n**技术透明度**。这种方法通过强调模型内部运行机制的披露来实现授权，包括底层数学算法、使用的训练数据和变量权重。其目标是确保专家能够彻底分析和评估模型，让他们对工作产生控制感和信心。技术透明度对于开发者、数据科学家和监管机构特别为重要。\n\
  \n**社交透明度**。它涉及以非技术用户可以轻松理解的方式展示模型的结果和决策过程。示例包括简单的解释、视觉化表示或阐明模型如何运行的类比示例。社交透明度针对终端用户、政治决策者和普通公众，让他们对模型感到安心和舒适。\n\
  \n这两种方法都有其用之地，并满足了不同的需求。虽然技术透明度能够更深层的洞察和控制，但社交透明度对于培养用户的信任和接受度至关重要。这种平衡确保了所有利益相关者的需求和关注点得到了解决。\n\
  \n### 2.3 透明度的悖论\n技术披露与人类理解力之间的悖论是实施透明度的关键问题。这种张力以几种形式表现出来：\n\n*   **复杂性 vs 可理解性**：现代机器学习模型（特别是基于深度学习的模型）的复杂性通常需要即使是最资深的专业人士才能理解其决策过程。这种“黑箱”问题（即使在技术披露的情况下，内部过程仍然保持不透明）凸显了你在该领域专业知识的重要性。\n\
  *   **可解释性 vs 准确性**：提高模型可解释性的努力可能会损害其预测准确性。更简单的模型，例如 `decision trees`，更容易解释，但性能通常不如更复杂的模型，例如\
  \ `neural networks`。\n*   **可解释性 vs 公平性**：这两个者密切相关。然而，目前还没有研究将它们结合起来（Chen et al.,\
  \ 2024`）。\n*   **可理解性 vs 安全性**：完全披露算法带有系统被滥用于攻击的风险。这在贷款领域特别相关，欺诈者可能试图操纵算法以获得非法利益。\n\
  \n这些悖论强调了机器学习中的透明度并不是通用目标，而是各种要求和限制之间复杂的相互作用。解决这些挑战不仅需要算法算法，还需要开发仔细考虑每个应用特定背景的定制方法。\n\
  \n### 2.4 解释复杂模型的挑战\n在实践中实施透明度是一项多方面的任务，充满了多种技术和概念挑战。最困难的问题之一是设计复杂的模型，以便其结果可以被解释和验证。存在以下挑战：\n\
  \n*   **黑箱模型**：许多机器学习系统基于如 `neural networks` 等算法，这些算法依赖于变量之间的非线性关系并包含数百万个参数。虽然这些模型提供了令人惊叹的准确结果，但必须解释其内部逻辑。\n\
  \n\n\n\n\n- **解释性方法**：对于复杂的机器学习（ML）决策过程，特别是在神经网络的背景下，由于其复杂性，无法为某个决策给出唯一的有效理由。目前已有如\
  \ `SHAP`（Shapley 加加性解释）或 `LIME`（局部可解释模型无关解释）等各种方法来解释复杂模型的结果。虽然这些方法提供了宝贵的见解，但它们通常仅限于专家，并且需要深层次的技术理解（Alonso\
  \ & Carbo, 2022）。这些方法试图在事后找到合理的解释。尽管所有这些选项在技术上本身是合理的，但在实践中，它们往往会得出截然不同的解释，这就是为什么实际原因往往仍然不明（Bordt\
  \ et al., 2022）。\n\n- **数据质量**：透明度取决于模型训练用数据的质量。偏见或不完整的数据可能反映历史上的不平等或社会偏见，导致即使是透明的算法也会产生错误或歧视性的结果。这强调了数据质量的重要性，以及需要严谨的数据收集和预处理方法，以确保机器学习系统的公平性和准确性。\n\
  \n- **文化与语境微妙差异**：透明度的另一个方面是考虑文化和社会差异。例如，在特定文化背景下开发的模型可能由于社会规范、价值观或法律框架的差异而无法迁移到其他背景。这使得它们更难以被解释和接受，并强调了在人工智能开发和部署中对全球视角的需求。\n\
  \n- **沟通**：挑战不仅在于创造透明度，还在于有效地进行沟通。这是一个不能被忽视的关键方面。需要专门的方法将技术内容翻译成外行人士可以理解的方式，同时又不会丢失重要信息。\n\
  \n透明度对于在贷款领域使用机器学习是不可或缺的，但它并非万灵药。它带来的挑战与益处同样多，必须与安全性、准确性和伦理责任等其他要求仔细平衡。这种微妙的平衡是决策过程的一个关键方面。需要一种兼顾技术和社会透明度的细致方法，在不损害模型有效性的情况下促进信任和问责制。只有通过这种方法，透明度才能帮助加强贷款决策的公平性，同时最大化人工智能的实际效用。\n\
  \n## 3. 贷款公平性的实证研究\n\n关于贷款公平性和偏见的实证研究证明，对于理解和解决全球范围内基于机器学习模型的挑战至关重要。包括美国和英国在内的多个国家研究了传统模型和基于机器学习的模型如何影响贷款决策，以及为了避免歧视性行为需要哪些措施。以下章节强调了这些国家的经验，并得出了普遍性的教训，将你与更广泛的研究人员和专业人士联系起来。\n\
  \n### 3.1 美国\n\n在美国，贷款长期以来一直受到算法和统计模型的影响。使用基于 `FICO` 系统或 `VantageScore` 的信用分非常广泛。这些模型基于信用参考机构\
  \ `Equifax`、`Experian` 和 `TransUnion` 的数据。然而，最近引入的基于机器学习的方法带来了关于公平性和歧视的新挑战。尽管如此，只有当这种分类基于非法特征或与这些特征高度相关时，才会产生（非法的）歧视。例如，在美国，禁止基于包括种族、性别和婚姻状况在内的各种类别进行歧视。\n\
  \n歧视通常可以分为两类（Garcia et al., 2024）：直接歧视是指群体成员遭受了可以直接归因于决策者偏好的歧视性对待。因为其可以追溯到决策者，所以通常被称为“基于品味的”。第二类歧视是间接歧视，也被称为统计歧视。关于贷款，统计歧视意味着，例如借款人因为使用了不允许的特征，在信誉评估中获得了不优惠的条件。使用与上述特征高度相关的数据点也是被禁止的，例如发色（白发与年龄高度相关）或居住的社区，在美国，这通常可以推导出关于族裔的结论（Morse\
  \ & Pence, 2021）。\n\n传统的信用分基于历史数据，这些数据往往反映了系统性偏见。收入、社区或就业状况可能会在无意中使历史上获取机会较低的群体处于不利地位。研究表明，某些人口群体，特别是美国的非洲裔裔和西班牙裔家庭，即使在财务状况相当的情况下，其贷款被拒率也远高于白人家庭。\n\
  \n机器学习模型的引入部分地加剧了这个问题。在历史数据上训练的机器学习算法往往会因为强化训练数据中的模式而重现现有的偏见。Bartlett et al. (2022)\
  \ 的一篇研究论文非常有启发性。作者检查了美国对不同人口群体提供贷款的不同条件。他们发现，作为私人家庭通常信用评级部分的 `FICO` 分别容易受到歧视的影响。贷款方根据其使用先进方法衡量机器学习的影响被归分类。有趣的是，更倾向于使用机器学习的金融科技公司提供的贷款并没有导致更多歧视。事实上，对于政府担保的抵押贷款，金融科技公司融资的测得歧视甚至更低，为反对歧视的斗争带来了一线希望。\n\
  这一结果的一种解释可能是，金融科技公司在业务关系中不太依赖客户顾问与客户之间的直接接触。因此，直接歧视几乎被消除了。然而，业务模式也可能从间接歧视的角度为这一结果提供可能的解释。可以想象，内部拥有特定数据技能的金融服务提供者更好地检测不允许的统计歧视（Bartlett\
  \ et al., 2022）。\n\n传统信用分与基于机器学习模型的比较显示，虽然机器学习系统通常提供更高的预测准确性，但这可能以牺牲公平为代价（Hall et\
  \ al., 2021）。这种差异的原因之一是模型的不透明性。虽然传统模型容易解释，但机器学习系统的决策逻辑通常是不透明的，这使得识别和纠正偏见变得困难。\n\n\
  \n\n\n\n像 SoFi 这样的金融科技公司在贷款领域采用机器学习（ML）方面发挥了关键作用。这些公司已经在信用评分中使用机器学习，将借款人的教育背景、公用事业缴费、保险理赔和手机使用情况等因素纳入考虑。通过将替代数据源（如社交媒体活动或在线购物行为）与预测评分模型相结合，可以开发创新的信产品（学生贷款、住房贷款、个人贷款和信用卡）（Berg\
  \ et al., 2021; Johnson et al., 2019)）。金融科技算法可能会强化隐含偏，，当替代数据源未能充分考虑到社会和文化差异时。[Fuster\
  \ et al. (2022)] 显示了基于美国抵押贷款数据利用传统模型和机器学习模型对违约的预测。他们发现，黑人和希斯尼裔借款人在机器学习引入中获益的比例远低于其他群体。\n\
  \n然而，Tigges et al. (2024)] 显示，将此前无法获得银行服务的群体纳入范围，改进了预测能力和风险管理，降低了违约率，并改善了信贷获取。尽管如此，对于重要的挑战，如知情同意问题、算法透明度、数据质量、数据滥用、代表性、可追溯性、责任、偏见和歧视，必须遵守严格且批判性的伦理考量。作为该领域的专业人士，我们的责任是确保这些考量处于工作的首位。\n\
  \n### 3.2 英国\n\n在英国，贷款行业也经历了类似的演变。我们的发现显示，机器学习模型往往对训练数据中的偏偏敏感。为了缓解这一点，细致的数据清洗和公平性指标的引入对于防止歧视性行为至关重要。Binns\
  \ et al. (2018)的一项研究中，英国参与者被要求对机器学习算法在三种场景（包括贷款申请）中提出的决策的公平性进行评价。作者考察了五个维度：解释中缺乏人情味、解释机器结果的困难、采取导致机器结果的因素来改变结果的可能性，以及与机器结果道德层面的关系。结果表明，机器呈现的解释风格（理解力与主体性）显著影响了参与者对结果的感知和接受，这对英国贷款行业具有潜在影响。\n\
  \n在另一项研究中，基于 800,000 名英国借款人的详细信贷数据，模拟了从传统（逻辑）信用评分模型向机器学习集成方法的转变。作者确认，机器学习模型整体上表现出更高的预测性能。然而，所有模拟的信用评分方法中，没有一种能完全满足根据受保护和敏感标准定义的人口子群的统计公平性。该研究还发现，从传统建模方法转向机器学习方法既没有加剧也没有改善结果的单面性（Bono\
  \ et al., 2021)）。重要的是，这些只是观察结果，本身并没有提供关于导致所观察到的统计公平差距的机制的见解。此外，该研究没有考虑信贷评分模型的变化如何在现实世界的贷款和定价决策中发挥作用，并最终影响客户福利，这凸显了在该领域进一步研究的必要性。\n\
  \n英国的另一项研究使用机会均等和影响等公平性指标，考察了不同信用评分模型的公平性（Dobbie et al., 2018)）。该研究强调了选择公平性指标在评估模型对不同人口群体影响时的关键作用。虽然传统模型在机会均等性方面表现更好，但机器学习模型在提高预测整体准确性方面更为有效。一个有趣的发现是，结合传统方法和基于机器学习方法的混合模型在预测准确性与公平性之间取得了更好的平衡。此类模型利用传统方法的可解释特征来平衡机器学习决策中的偏见。\n\
  \n### 3.3 共同发现\n\n来自美国和英国的研究为贷款公平性的挑战和机遇提供了宝贵的见解。尽管法律和文化背景不同，但存在以下几项共性发现：\n\n**确保公平性的挑战。**\
  \ 确保机器学习系统的公平性仍然是一项关键挑战。结果显示，训练数据中的偏见和算法扭曲可能会强化系统性的不平等。这需要技术、组织和监管措施（第 6.1 节）。\n\
  \n**数据质量和模型设计的重要性不言而喻。** 数据质量和模型设计在减少偏见方面起着至关重要的作用。数据清洗、选择合适的公平指标以及整合公平约束学习是防止歧视性行为的必要步骤（第\
  \ 6.1 节）。\n\n**跨学科协作迫在眉睫。** 解决公平问题需要工程师、社会科学家、律师和政治家之间的合作。只有通过跨学科的方法才能制定可持续的解决方案（Kirat\
  \ et al., 2023)（第 6.2 节）。\n\n**监管在确保机器学习系统公平性方面起着关键作用。** 监管机构需要制定明确的指南，引入强制审计并提高透明度。这些措施有助于建立对基于人工智能的贷款系统的信任（第\
  \ 6.3 节）。\n\n实证研究表明，基于机器学习的贷款系统具有显著提高决策效率和准确性的潜力。然而，它们强调了仔细规划和监控以避免歧视性行为性，正如美国和英国的经验所示。\n\
  \n纯统计学标准显然不足以证明歧视是否存在。这取决于信贷决策实际上是如何产生的，从而引入了对算法公平性的经济视角。\n\n### 4 偏见的成因与影响\n\n\
  机器学习模型中的偏见是贷款领域中使用机器学习的最大挑战之一。它发生在多个层面，从训练数据到算法，再到社会文化影响。这些偏见的影响从歧视和信任危机到对公司和社会产生巨大的经济后果不等。本节重点讨论了偏见的成因和后果，并强调了受众在确保负责任使用机器学习系统中的关键作用（Mehrabi\
  \ et al., 2022)）。\n\n### 4.1 偏见的成因\n\n\n\n\n\n训练数据质量对于机器学习（ML）模型的性能和公平性至关重要。许多机器学习系统从历史数据中学习，这些数据反映了人类的决策、行为和评估。如果这些数据包含对某些群体或个人的偏见，AI\
  \ 就会学习这些偏见并在决策中复制它们（Barocas & Selbst, 2016）。在贷款背景下，这种偏差可能会出现，例如，如果某些人口群体在数据中的代表性不足，或者历史歧视反映在数据中（Mitchell\
  \ et al., 2018）。\n\n与种族或性别等受保护特征相关的不利可能会在模型开发过程中无意中产生（Vanhoof et al., 2018）。技术团队需要更多多样性是解决这一问题的关键因素（Lee,\
  \ 2018）。它也可能在预测模型的开发或决策阶段（即根据预测采取行动时）通过意识性行为产生。\n\n一个经典的例子是基于居住数据的歧视。在历史上，地图上将特定社区归类为高风险或低劣的“红线”导致了少数群体在财务上的劣势。如果将此类数据未经过滤地输入机器学习模型，这种歧视就会持续下去。另一个问题是数据质量或代表性不足。例如，如果富裕人口群体的数据占比过高，模型倾向于向具有相似背景的人提供贷款，进一步排斥了弱势群体（Tucker,\
  \ 2023）。\n\n算法本身也可能引入偏差，这种偏差源于模型开发底层的数学和统计假设。例如，机器学习模型可能会考虑收入或职业等与信用信誉高度相关的特定特征，而不考虑底层的系统性原因。此外，优化目标（如最大化预测准确率）可能会导致无意中的不平等。在这种情况下，算法可能会无意识地做出在统计学上是最优的但在伦理上存在问题的决策（Brotcke,\
  \ 2022）。\n\n算法偏差的另一个例子是所谓的“反馈循环”。模型一旦做出歧视性决策，它们会在未来的训练数据中被强化，因为这些数据基于之前的模型决策。这导致了难以纠正的自我强化偏见。Dobbie\
  \ et al. (2018) 讨论了许多发达国家不同人口群体在信贷可用性和成本方面观察到的显著差异。\n\n机器学习的一个元风险是深度自动化偏见（DAB）。DAB\
  \ 是多层面的，由几个驱动因素塑造，包括技术和社会方面。它们共同影响了对理解的不确定性……以及和 2。\n\n## 4.2 偏差的影响\n\n机器学习中由偏差引发的最紧迫的问题之一是对特定群体的歧视。这可能意味着少数群体或老年人在财务比性方面处于劣势地位。研究表明，非裔美国人和西班牙裔家庭获得的信贷贷款条件比白人家庭更差（[Adeg\
  \ et et., 22224979-8-3693-8186-1.ch001.bits-pdf..#_idTextAnchor040)）。\n\n机器学习系统中的偏差会导致信任的大幅丧失。如果消费者和组织认为机器学习模型是不公平或具有歧视性的，这将限制此类技术的采用。这种信任的损失影响到执法等领域。\n\
  \n解决这一问题需要更多的透明度。需要帮助理解决策如何产生的消费者倾向于不信任机器学习系统。当模型做出缺陷或不公正的决策且没有明确解释时，这种效应会被放大。\n\
  \n对于企业来说，使用有偏见的机器学习模型可能会产生重大的经济后果。歧视性做法可能导致严重的法律和监管后果，包括罚款和损害。此外，负面新闻会损害公司的声誉并吓跑客户。另一个问题是偏差导致的效率低下。系统性排除群体的模型未能利用市场的全部潜力。例如，歧视女性或少数群体的贷款机构可能会失去这些领域的客户。不平等的贷款会碍创新，因为潜在的企业家需要资源。它还由于风险在某些领域的集中而危及金融系统的稳定性。\n\
  \n在社会层面，信贷偏差会加剧现有的不平等。如果弱势群体无法获得信贷，他们的参与经济的机会就会受到限制。这会导致贫富差距的扩大并增加社会不公。\n\n## 4.3\
  \ 框架\n\n\n\n\n这里介绍了四象限框架，它是分类机器学习（ML）算法的关键工具。该框架在图 1）具有重要作用。它根据预测能力（`y 轴`）和偏差（`x\
  \ 轴`）对算法进行分类，假设当前系统从轴的交点开始。新算法带来的任何潜在变化都必须与现有系统进行比较。\n\n现实世界也不是一个没有偏差或完全准确的理想世界。它迫使决策者考虑，引入一个具有某些偏差但预测能力比当前系统的新系统是否代表了进步。至关的一点是，由于新技术包含某些偏差而拒绝它们并不意味着该系统就能免疫偏差。此外，避免小量的偏差可能无法实现预测能力的巨大潜力。因此，应该仔细考虑引入具有某些偏差但预测能力更的新系统的潜在收益，因为这可能代表了巨大的进步，这些决策的权重不应被低估。\n\
  \n### 图 1. 将机器学习纳入信贷决策的框架\n\n![979-8-3693-8186-1.ch001.f01](img/979-8-3693-8186-1.ch001.f01.png)\n\
  \n第三象限代表机器学习算法存在偏差且不公平的情况。由于预测能力较低，从业务角度来看，实施可能并无益。该系统需要更多的透明度和问责制。至关重要的是理解，例如，底层数据可能不准确或存在偏差。仅仅依靠市场激励无法获得更高的准确性；考虑到纠正数据的成本以及对速度和数量的需求，市场甚至可能导致不准确。这凸显了形势的紧迫性，以及采取行动解决这些问题的必要。\n\
  \n在第一象限可以发现完全相反的情况。它代表了提高准确性并减少偏差的机器学习引入。乍一看，这应该是一个双赢局面。银行通过更好地预测违约概率来更准确地提供信贷。同时，消费者受益于比现状更准确的条款和更少的偏差，获得更好的信贷可用性。这种乐观的情景是完全现实的，尽管实现它仍需要做一些工作。在考虑到现有偏差的一个重要来源源于贷款中使用的信息时，这一点尤为真实。\n\
  \n提高准确性但引入更多偏差的 AI 正如其地受到了广泛关注。这种情景在框架的左上角（第四象限）所示，其范围很广。它可以从引入包含受保护类别代理变量的数据，到初看看似乎没有偏差但实际上存在偏差的信息或技术。机器学习的代理人歧视（Proxy\
  \ discrimination）更令人不安，因为算法本应能够揭示人类以前未考虑过的代理变量。\n\n最后一种组合涉及更高程度的公平性但准确性降低（第二象限）。在这里，使用特定变量可能会提高合同价格的准确性，但违反了公平性准则。消费者倡导者关注扩大保护和减少歧视。扭曲不仅仅是一个技术问题。由于对公平性的各种、有时相互矛盾的概念和定义，该问题的复杂性已经显而易见。对于公平、公正或中立没有通用的有效定义（第\
  \ 2.3 节）。\n\n### 5. 解决方案的途径\n\n机器学习在贷款中日益增加的使用带来了公平性和偏差方面的挑战，并通过创新方法解决这些问题提供了机会。解决方案策略可以分为技术措施、组织变革和法律框架。这些方法要求开发人员、组织、政治家和社会之间进行高水平的，以确保高效、公平且负责地使用机器学习系统。\n\
  \n### 5.1 技术措施\n\n透明度是减少扭曲的关键要素（第 3 节），在技术设计中可能是矛盾的。它可以既意味着揭示也意味着隐藏信息。从设计的角度来看，透明度涉及隐藏信息以降低复杂性并帮助理解。这与透明性的常见理解相冲突。因此，对抗偏差的技术方法可能会引入额外的偏差。\n\
  \n机器学习系统的歧视主要源于技术偏差。然而，技术解决方案的形式仍存在希望。这些是源于系统设计或功能的约束。它们可能包括硬件和软件问题，例如不当编程到算法中的规则。一种前景良好的解决方案是将公平约束直接整合到建模过程中。在公平约束学习中，模型的设计同时优化预测准确性和公平性标准。例如，可以训练模型以考虑机会均等或影响均等，从而减少歧视性结果。然而，这种方法具有局限性，因为最大化准确性和公平性往往是一种微妙的平衡。具有严格公平约束的模型其预测能力可能会受到。尽管如此，研究表明，即使是适度的公平要求也能带来显著改进而不损害准确性（Pagano\
  \ et al., 2023）。\n\nKozodoi 等人 (2022) 研究了统计公平性标准及其在信贷评分中的适用性。实证结果支持对公平性标准的评估，并得出结论：可以同时满足多种公平标准。他们建议将分离作为衡量评分公平性的合适标准。\n\
  \nHurlin 等人 (2024) 展示了如何对评分模型的算法公平性进行正式测试，以及如何识别导致缺乏公平性的变量。然后使用这些变量来优化公平性与性能之间的平衡。作者表明，在保持高预测准确性的同时，可以提高受保护群体的利益。\n\
  \nCoraglia 等人 (2024) 提出了一种方法，对德国信贷评分使用的机器学习系统的公平性问题进行定量彻底的分析。他们使用 BRIO 来评估机器学习系统涉及社会不公以及更广泛的不伦理行为。它有一个独立模型的偏差检测模块。他们将\
  \ BRIO 公平指标应用于多个社会敏感属性，并量化不同人口细分的公平性，以识别信贷评分模型中潜在的偏差和歧视来源。\n\n另一种技术方法是在模型开发过程中使用分析方法，在贷款发生之前消除统计歧视。可能的措施包括禁止特征与最初允许特征之间的显式相关性测试，或者明确要求如果模型导致不可接受的歧视标准适用，则将其丢弃。\n\
  \n\n\n\n上述技术解决方案建议算法应受到形式化的公平性约束。Chohlas-Wood et al. (2023) 认为，流行的约束虽然在直觉上很有吸引力，但往往会恶化边缘群体成员的结果。它们甚至可能让所有人的状况都变糟。作者概述了一种更全面的方法来提高算法驱动决策的公平性（尽管不适用于金融领域）。\n\
  \n对抗训练是对抗偏见的另一种技术方法。它涉及使用额外的模型作为主模型的“竞争对手”。这种方法虽然具有挑战性，但可以成为对抗偏见的强有力工具。当主模型做出准确预测时，对手模型则试图识别并最小化偏见。\n\
  \n虽然对抗训练已被证明在减少偏见方面有效，但它需要大量的计算资源和对底层算法的深度理解。因此，开发团队具备必要的技术知识以成功实施这种方法至关重要。对技术专长的强调凸显了在机器学习系统中使用对抗训练对抗偏见所面临的挑战和要求。\n\
  \n开发可解释模型是确保公平性的另一重要技术措施。决策树或线性回归模型等可解释模型为人工智能的决策逻辑提供了清晰的见解。这种透明度更容易识别和纠正潜在的偏见。与深度神经网络等复杂的黑箱方法相比，可解释模型更容易被验证和理解。然而，在分析大型复杂数据集时，它们的性能往往较弱。可以使用混合模型进行复杂预测，但通过简化的代理模型使其具有可解释性，从而结合这两种方法的优点。\n\
  \nNwafor et al. (2024) 了一种结合了一维卷积神经网络（1DCNN）与极端梯度提升算法（XGBoost）的混合模型。他们将混合模型与三种传统算法（1DCNN、XGBoost、逻辑回归\
  \ logistic regression, LR））进行了比较，并使用了一个超过两万条点对消费信贷观测数据集（P2P）。结果显示，该混合模型在分类准确性方面更为优。作者还表明，移除年龄和性别等潜在的歧视性特征并不会显著影响混合模型的分类能力。公平且无偏的信用评分模型可以在不牺牲准确性的情况下实现高有效性。`SHAP`\
  \ 方法被用于提高可解释性。\n\n## 5.2 组织措施\n\n开发团队的多样化在设计公平且包容的机器学习系统方面发挥着核心作用。这不仅仅是一个偶然问题，而是公司应该采取的积极举措。包含不同背景、观点和经验成员的团队能够更早地识别潜在的偏见。多元化的团队为开发过程带来了不同的文化和社会视角，并确保模型不会仅对应于狭隘的世界观。公司应该采取措施积极促进多样性，例如通过针对性的招聘和培训计划。\n\
  \n消除滥用和漏洞的另一个例子是所谓的“红队”。这些专家协作工作，从对手的角度审视系统，以识别可以缓解的可能漏洞。AI 红队可以被视为网络安全红队的延伸，尽管机器学习系统的数据驱动和日益通用的本质需要新的技能。AI\
  \ 红队专家在不同组织和公司之间分享经验。这种方法承认，机器学习引起的歧视不能仅通过技术手段解决。不公平、歧视性、不伦理或社会不可接受的结果并非纯粹的技术问题，而是社会技术问题。\n\
  \n在组织内部建立伦理委员会是解决偏见和公平性问题的有效方法。这些委员会可以为模型开发制定指南、进行审计，并作为独立机构评估伦理问题。伦理委员会应该是跨学科的，涵盖技术、社会和法律视角。这种视角的多元化不仅仅是形式，而且解决伦理问题的关键要素。他们的职责可能包括在部署前审查敏感模型，并培训员工如何处理伦理问题。\n\
  \n定期审计对于确保机器学习模型的长期公平性和准确性至关重要。此类审计可以揭示数据和算法中的偏见，并确保模型持续符合标准。有效的审计应该同时考虑技术和社会方面。除了审查模型和数据集，审计还应纳入用户反馈以评估模型的影响。用户反馈可以为模型在现实世界的感知和使用提供价值见解。此外，审计可以作为持续改进的基础。\n\
  \n数据质量在防止歧视方面起着关键作用。传统的“适用性”方法应被更特定阶段的数据质量方法所取代。这种关注数据在机器学习周期中何时产生的方法需要协作。它有助于从业者、软件开发者和组织规划数据质量任务，以满足接触数据的利益相关者的需求。它允许更好地考虑可以追踪的数据质量主要类别（内在性、上下文性、代表性和可用性）([Priestley\
  \ et al., 2023)。\n\n## 5.3 法律框架\n\n人工智能和机器学习应用的监管不仅是必要的，也是确保贷款公平和问责的助力。监管框架通过建立透明度要求、数据质量和模型审查，为更公平的贷款环境铺平道路。Cowgill\
  \ and Tucker (2020) 认为，有效的监管应该关注结果，而不是“技术程序或技术”。\n\n替代评分技术对消费者最终结果的影响应进一步探讨，考虑到不同方法如何影响贷款人的行为以及对定价和准入决策的影响。\n\
  \n\n\n\n被遗忘权已纳入欧洲数据保护立法（`Art. 17 GDPR`），也必须对其予以考虑。虽然从外行人的角度来看，直接删除用户数据是可以接受的，但在实践中，这通常是一个复杂且漫漫的过程。这很重要，因为要删除的客户数据已整合到模型中，这些模型只有在重新训练后才能忘记从数据中获得的知识。删除请求在实际应用中是一个可以解决的挑战。然而，必须在设计和实现\
  \ AI 系统早期就考虑这一点。如果实施不当，删除客户数据可能会违背系统的实际目的，例如在客户体验领域。\n\n除了监管 AI 系统外，迫切需要更新和扩展现有的反歧视法律，以考虑\
  \ AI 带来的特定挑战。这包括保护弱势群体，并建立允许个人挑战歧视性决策的机制。\n\n法律框架还应明确定义组织和开发者的责任。这对于让受众放心关重要：使用\
  \ AI 和 `ML` 模型的公司必须证明它们已采取措施最大限度地减少偏差并确保公平的结果。\n\n## 6. 结论\n\n将 `ML` 整合到贷款流程中可以使决策过程更加高效、可扩展且由数据驱动。然而，这种发展也带来了重大挑战，特别是在公平性和透明度方面。本章探讨了预测准确性与公平性之间的张力，以及透明度和可解释性在此背景下的作用。\n\
  \n一个关键挑战是确保贷款模型的公平性。算法本身并不是中立的，因为它们基于历史数据，而这些数据往往反映了现有的社会不平等。这种偏差可能会体现在算法决策中，导致对某些群体的歧视（`Brotcke,\
  \ 2022`）。\n\n`ML` 模型中公平与预测准确性之间的微妙平衡是一个重大挑战。追求最大准确性可能会无意中导致对少数或弱势群体的偏偏对待，因为它们在训练数据中的代表性不足。相反，确保公平的努力可能会影响模型的整体准确性。\n\
  \n透明度是克服这些挑战的关键方面。通过可理解的决策过程，借款人和监管机构可以信任模型，这有助于对此类技术的接受。然而，透明度也包含悖论。技术透明度（例如披露模型的数学原理）并不一定能让外行人更好地理解。相反，必须将复杂的技术细节翻译成易于理解的、结合背景的解释，以促进人类理解。\n\
  \n可解释性在这里提供了重要的补充。如果模型的决策可以用易理解的规则或逻辑关系来解释，用户就可以质疑其结果并在必要时进行批判性地调整。同时，挑战仍然在于如何在不牺牲准确性的情况下，使高性能的高度复杂模型具有可解释性。\n\
  \n现有研究已经提供了多种公平性指标，例如机会均等或影响均等。公平测量通常分为三大类：(1) 基于的测量，(2) 基于个人的测量，以及(3) 反事实公平性测量。然而，这些指标仅在某些情况下适用。未来的研究必须开发考虑特定背景和社会需求的新指标。一个重要领域是开发动态指标，以衡量不同时期和人口群的公平性。此外，这些指标必须是便于开发者和决策者快速实施和解释的（`Sargeant,\
  \ 2023; Babaei & Giudici, 2024`）。\n\n`Chen et al. (2024)` 通过共同考虑 `ML` 模型的解释性和公平性弥补了这一差距。作者提出了一种基于\
  \ `ML` 模型的信用评级方法，通过使用解释变量的 `Shapley-Lorenz values` 来衡量解释性，并通过比较每个人口群体计算出的 `Shapley-Lorenz\
  \ values` 来衡量公平性。结果显示了哪些变量得到了最好的解释。测试的信用评级模型在不同国家和行业之间都是公平的。\n\n开发者必须确保他们的模型基于伦理原则，而不仅仅是技术效率的最大化。同时，需要对系统进行持续监控和调整，以确保它们在不断变化的和社会监管环境中负责任运行。\n\
  \n一个关键方面是考虑利益相关者的观点。这不仅包括技术和商业利益，还包括借款人、监管机构和社会活动家的声音。这种以对话为导向的方法可能有助于培养在贷款中适当使用\
  \ `ML` 的社会共识（`Sharma, 2024`）。\n\n`ML` 中的公平性问题需要跨学科的方法（`Kirat et al., 2023`）。仅靠技术创新无法解决社会问题；相反，法律或伦理指南只有通过技术实施才能具有实用性。社会科学家可以分析模型的社会影响，而政策制定者必须建立的法律框架来促进公平并防止歧视。这强调了在解决\
  \ AI 公平问题时协作和共同责任的必要性。\n\n这些群体之间的协作还应该建立促进知识转移和标准共同开发的平台或机构。例如包括联合研讨会、伦理委员会或旨在负责任\
  \ AI 开发的公私合作伙伴关系。\n\n本章提出的解决方案的实际实施需要制定明确的指南和最佳实践（`Valdrighi et al., 2024`）。公平性约束学习和可解释模型等技术措施必须在实验室和现实应用中进行评估。组织必须确保建立定期审计和多样性倡议等内部流程，以确保伦理和实际实施。\n\
  \n在社会层面，问题仍然在于贷款中应给予机器学习系统多少责任。虽然 `ML` 系统可能看起来更高效、客观，但最终的决策责任仍然是一项深刻的人类任务。`ML` 的未来发展可以专注于逻辑思维和伦理决策。然而，更公平、更负责任地使用\
  \ `ML` 需要不断适应和反思，这强调了受众中持续警惕和责任的重要性。\n\n总之，AI 和 `ML` 在贷款中的成功整合是一个持续学习的过程，必须平等地考虑技术、社会和理方面。通过解决未解决的问题、开发创新解决方案和定义明确的价值观，组织、社会和研究人员可以利用\
  \ AI 的潜力为更公正、更具包容性的未来做出贡献，为受众带来希望和乐观。\n\n## 参考文献\n\n\n\n\n\n## 参考文献\n\n- Adegoke,\
