  \ 增长 |\n\n## 3.2 方法论\n\n人工智能和机器学习凭借其识别财务数据中模式的能力，提供了分析影响公司财务表现和风险概况的广泛因素的能力（Huber,\
  \ 2019）。换句话说，与传统的回归模型相比，机器学习算法能够考虑多得变量，并可能揭示影响资本结构决策的因素之间复杂的关系（James et al., 2023）。然而，人工智能研究中最重要的挑战是确定用于训练模型的最佳方法和算法。因此，在尝试为任何目的开发人工智能时，通常会尝试许多算法，并选择最成功的方法作为最终决策者（Ballings\
  \ et al., 2015）。在本研究中，通过 `Lasso regression`、`ElasticNet` 和 `LightGBM` 算法确定了资本结构的基础动态，并比较了这些算法的性能。80%\
  \ 的数据用于训练，20% 用于测试。分析中执行了 5 折交叉验证。每个方法和行业的最合适参数通过 `GridSearch` 方法确定。\n\n### 3.2.1\
  \ Lasso 回归\n\nLasso 回归是一种用于高维数据集中进行变量选择和正则化的回归方法。该模型在确定回归系数时最小化误差项的平方和，并根据系数绝对值之和应用惩罚（Tibshirani,\
  \ 1996）。换句话说，`Lasso regression` 方法使用正则化项 `L[1]` 来缩小回归系数。虽然这种惩罚项确保参数保持在一定限制范围内，但它会导致某些系数精确为零。因此，不必要变量的系数被减为零并自动完成变量选择（Emmert-Streib\
  \ & Dehmer, 2019；Fan & Lv, 2010）。通过这种方式，模型中仅包含最重要的变量，减少了过拟合风险并创建了更简单、更具解释性的模型（Emmert-Streib\
  \ & Dehmer, 2019）。\n\n\n\n\n在公式 1 中，`y` 是因变量的第 `i` 个观测值，`x` 是第 `i` 次观测处自变量的第 `j`\
  \ 个值，`βj` 是第 `j` 个自变量的系数，`λ` 是正则化参数或惩罚项权重，`n` 是观测数量，`p` 代表自变量的数量。模型的第一部分最小化经典线性回归中的误差，而模型的第二部分表示为惩罚项\
  \ $\\lambda\\sum_{j = 1}^{p}|\\beta_{j}|$，通过最小化系数绝对值的和来使模型变得简单（Zhao & Yu, 2006）。模型中应用的一些惩罚项\
  \ `βj` 使系数恰好为零的特性允许 `Lasso` 能够进行变量选择。因此，不必要的变量被完全从模型中移除。\n\n### 3.2.2 弹性网 (Elastic\
  \ Net)\n弹性网是一种结合了 `Ridge` 回归和 `Lasso` 回归优势的方法。与 `Lasso` 回归一样，它通过分配零系数创建简化模型。它通过对系数进行正则化来避免过拟合问题，并在高维数据上提供更好的性能。弹性网的数学描述见公式\
  \ 2，它同时使用 `L2` 范数（`Ridge`）和 `L1` 范数（`Lasso`）惩罚来选择特征并处理多共线性问题。通过这种方式，它既确保不重要的变量变量，又允许高度相关的变量共同建模。因此，弹性网往往优于\
  \ `Lasso`，特别是对于高度相关的估计器。\n\n其中：\n当 `α = 1` 时，弹性网与 `Lasso` 相同。随着 `α` 逐渐于 0，弹性网趋于岭回归。对于\
  \ `α` 的其他值，惩罚项 `Pα(β)` 在 `β` 的 `L1` 范数和 `β` 的平方 `L2` 范数之间进行插值。\n\n### 3.2.3 LightGBM\n\
  LightGBM 是一种在大规模高维数据集上运行快速且高效的提升算法。它是作为 `XGBoost` 的替代方案开发的，在速度和内存使用方面具有特别优势。LightGBM\
  \ 基于梯度提升，每棵新树都会纠正之前树所犯的错误。在每次迭代中，目标变量 `yi` 是在之前的树之间用 `yhati` 估计出的值。因此，每棵树都通过关注之前树的误差来改进（Ke\
  \ et al., 2017）。\n\n在 `LightGBM` 模型中，目标是添加一个新的决策树，利用负梯度最小化损失函数。该模型支持 `L2` 范数（`MSE`）和\
  \ `L1` 范数（`MAE`）损失函数。\n\n在公式 3 中，`d` 是分裂标准，`n` 是点总数，`j` 是应用分裂的特征，`a` 是大梯度数据的采样率，`b`\
  \ 是小梯度数据的采样率。\n\nLightGBM 使用叶子生长策略（leaf-wise），只增加误差减少最大的叶节点，而不是同时扩展所有叶节点的层级生长策略（level-wise）。这种策略增加了树的深度，但提供了更高的准确性和更快的优化速度（Ke\
  \ et al., 2017）。然而，叶子生长方法构建更深决策树的倾向会导致过拟合问题。为了克服这个问题，`LightGBM` 在采用叶子生长方法的同时还施加了最大深度限制，从而在确保效率的同时降低过拟合风险（Wang\
  \ et al., 2022）。`LightGBM` 与经典梯度提升决策树的另一个不同点是使用直方图来确定分点。基于直方图的数据分组通过将连续变量划分为区间来提高处理速度。`LightGBM`\
  \ 算法的另一个区别是使用基于梯度的单侧采样 (`GOSS`) 来选择大梯度样本进行训练加权。最后，`LightGBM` 互斥特征绑定（Exclusive Feature\
  \ Bundling）方法，通过将互斥的特征归为同一组来减少维度（Zhang & Gong, 2020）。\n\n\n\n对于 IT 行业，`Lasso regression`\
  \ 和 `ElasticNet` 的 `MAE` 值分别为 `21.00` 和 `21.02`。对于这两个模型而言，这些值表明预测值与实际值并不接近。在能源领域，`Lasso`\
  \ 和 `ElasticNet` 的表现相似，`MAE` 值分别为 `15.60` 和 `14.65`，表明 `Lasso` 的误差范围比 `ElasticNet`\
  \ 大。在机械领域，`MAE` 值的较低且在接受范围内，数值为 `5.82`。由于 `Lasso` 和 `ElasticNet` 在此处的数值相同，说明该行业的预测误差比其他行业更小。`LightGBM`\
  \ 在 IT 和能源领域均具有最低的 `MAE` 值（`3.12` 和 `7.12`），表明该模型无论在哪个行业都具有强强大的预测性能。\n\n在分析中，使用\
  \ `R-square` 指标来衡量模型解释因变量变异的百分比。当公式 6 定义的 `R-square` 接近 `1` 时，表明模型很好地解释了因变量的变异。\n\
  \n在 IT 行业，`Lasso` 和 `ElasticNet` 的 `R²` 值均较低，为 `0.14`。这表明模型无法利用自变量充分解释因变量的变异。在能源领域，`Lasso`\
  \ 的 `R²` 值为 `0.22`，`ElasticNet` 为 `0.32`。虽然这表明模型的解释能力稍好，但仍处于较弱的解释水平。在机械领域，`R²` 值很高，达到\
  \ `0.80`，表明模型能够很好地捕捉自变量与因变量之间的关系。`LightGBM` 模型具有卓越的解释能力，特别是在 IT 领域值为 `0.98`，同时在能源和机械领域也显示出强力的拟合度，值分别为\
  \ `0.83` 和 `0.92`。\n\n用于评估分析结果的最终指标是平均绝对百分比误差（`MAPE`）。由公式 7 定义的 `MAPE` 以百分比形式显示模型预测的准确性。它是预测值与实际值之间绝对误差与实际值之比的平均值。\n\
  \n在公式中，`n` 为数据点数量，`y[i]` 为真实值，`yhat[i]` 为估计值，`\\overset{-}{y}` 代表真实值的平均值。\n\n在 IT\
  \ 行业，`Lasso` 的 `MAPE` 值 `144.28` 和 `ElasticNet` 的 `MAPE` 值 `145.04` 都非常高，表明这些模型的预测离现实很远。在能源领域，`Lasso`\
  \ 的 `MAPE` 值为 `45.34`，`ElasticNet` 为 `42.79`。这表明两个模型都有接受的预测成功，但仍有改进空间。在机械领域，`10.59`\
  \ 的 `MAPE` 值是一个理想的结果。这表明机械行业的预测接近现实，两个模型都运行良好。`LightGBM` 的表现非常成功，IT 领域的 `MAPE` 值为\
  \ `12.54`，能源领域为 `19.77`，机械领域为 `6.30`。这些结果表明 `LightGBM` 能够在每个行业做出非常强大的预测。\n\n###\
  \ 5. 特征重要性\n\n确定机器学习模型中特征的重要性是提高模型成功率和可解释性的关键步骤。通过确定每个输入对模型输出的贡献程度，特征重要性既优化了模型性能，又使决策过程透明化。换句话说，分析被定义为“黑箱”的机器学习模型中的特征重要性，有助于理解模型如何做出决策，并为模型提供透明度和可解释性。\n\
  \n在 `LightGBM` 中，可以使用三种不同的指标评估特征重要性（`LightGBM` 文档）。其中一个指标是分裂次数（`number of splits`）。模型在`decision\
  \ trees` 中使用某项特征的次数表明该特征具有改进模型的巨大潜力，被认为更重要。`gain` 指标根据每次划分减少错误率（`loss function`）或更好地分离数据集的程度进行计算。具有更大基于划分增益的特征被认为更重要。`Cover`\
  \ 指模型中使用某项特征的划分总数覆盖了数据集的多少比例。它显示了该特征对多少数据样本有效。在本研究中，特征重要性是通过 `number of splits`\
  \ 确定的。\n\n#### 图 1. LightGBM 在能源行业的特征重要性\n\n![979-8-3693-8186-1.ch010.f01](img/979-8-3693-8186-1.ch010.f01.png)\n\
  \n[图 1] 显示了使用 `LightGBM` 计算的能源行业特征重要性。由于其资本密集型的性质，能源行业是财务策略中债务利用和财务杠杆的重点。根据通过 `LightGBM`\
  \ 模型获得的特征重要性排名，影响能源行业负债率的主要因素可以解释如下。\n\n\n\n\n考虑到宏观经济状况，`GDP` 对负债率的高度重要性表明能源行业直接受经济周期的影响。这可能是因为在经济加速增长时期，能源需求和投资的增加，从而导致公司资金需求的不断。。另一个高度显著的指标是资产增长率。高资产增长率意味着公司未来需要更多融资，因此其负债率可能会增加。这是因为能源部门的增长与大型基础设施项目有关，而这些项目通常通过债务融资。另一个重要变量是\
  \ `EBITDA 毛利率`。`EBITDA 毛利率` 的高度显著性表明，企业的经营盈利能力对于维持财务杠杆至关重要。这是因为高经营盈利能力提高了还债能力，允许公司拥有更高的负债率。`流动比率`作为高显著性变量之一，反映了短期还债能力。对于能源公司而言，高`流动比率`表明其具有强大的短期债务融资能力和更良好的负债率管理。另一方面，`固定资产周转率`通过固定资产的高效利用显示了能源公司的资本效率。固定资产的高效利用可能通过发行更多债务来提高杠杆率。`PD/DD\
  \ 比率`是市场相关指标之一，反映了市场对公司的认知。换句话说，高`PD/DD 比率`反映了投资者对公司的信心，这可能会影响公司的融资成本并使其更有效地利用杠杆。\n\
  \n这项分析表明，能源行业负债率最重要的决定因素是经济增长、资产增长、经营盈利能力和资本效率。特别是`GDP`和资产增长等宏观经济指标揭示了该行业对经济周期的敏感性。此外，`流动比率`和`EBITDA\
  \ 毛利率`在融资能力和还债能力方面脱出的关键元素。最后，利率和通胀等宏观因素对能源行业的影响相对较小。这表明该行业的融资策略很大程度上基于公司表现和投资项目。\n\
  \n## 图 2. IT 行业 LightGBM 特征重要性\n\n![979-8-3693-8186-1.ch010.f02](img/979-8-3693-8186-1.ch010.f02.png)\n\
  \n图 2 显示了使用 LightGBM 为 IT 行业计算的特征重要性。可以看出，运营 IT 行业的公司其负债率最重要的动态因素之一是`流动比率`。`流动比率`显示了公司履行短期负债的能力。由于\
  \ IT 行业通常以低库存需求和快速现金流而闻名，高`流动比率`可能并不常见。然而，它与负债率的直接关系表明了公司采用基于股权的融资策略而非短期贷款的程度。IT\
  \ 行业杠杆率高度显著的动态因素之一是`固定资产/总资产`比率。事实上，IT 行业通常由软件、专利和研发等无形资产主导。然而，它与公司债务负担的关系可能反映了基础设施投资是否是通过债务融资的。此外，由于国防行业和\
  \ IT 行业在如 `ASELS` 等公司中交织（该公司属于本分析范围内的 IT 行业），这可能导致 `固定资产/总资产` 比率成为一个重要变量。利息和财务支出占营业利润的比率表明了公司应对债务负担的能力。尽管\
  \ IT 行业倾向于低负债，但涉及债务时，经营盈利能力重要性会增加。`资产周转率`显示了公司利用资产的有效性。对于 IT 公司来说，该指标对于评估现有基础设施投资的有效性和可持续现金流非常重要。低资产强度可以减少快速增长策略对借贷的需求。`PD/DD\
  \ 比率`反映了投资者对公司股权的价值评估。由于 IT 公司以高估值交易，它们可以以低债务实现高市值。该比率也影响公司的融资意愿和投资者预期。`净资产周转率`与利用股权产生的收入有关。由于\
  \ IT 行业中基于股权而非债务的融资很常见，可以说股权效率在降低负债率方面发挥着关键作用。运营 IT 行业的公司杠杆率的另一个重要决定因素是资产增长率。由于\
  \ IT 行业具有快速增长的特点，高资产增长率意味着负债率可能会增加。该指标是评估维持增长所用融资策略的重要指标。`EBITDA 毛利率`表示了公司相对于债务负担的经营效率。它也是\
  \ IT 公司与杠杆相关的重要比例之一，因为高盈利能力具有减少贷款需求或便于债务管理的潜力。\n\n结果显示，IT 行业中对融资比例影响最大的变量是`流动比率`，这表明短期负债管理在该行业起着重要作用。此外，`EBITDA\
  \ 毛利率`和资产增长率等盈利和增长指标的重要性为公司在增长过程中如何管理融资策略提供了重要线索。\n\n## 图 3. 机械行业 LightGBM 特征重要性\n\
  \n![979-8-3693-8186-1.ch010.f03](img/979-8-3693-8186-1.ch010.f03.png)\n\n\n\n\n\
  机械行业估算负债率的特征重要性排序反映了该行业的资本密集型结构、增长动态和财务盈利能力。`流动比率`是影响机械行业企业资本结构最大的比率之一。这种情况表明机械行业企业对营运资金的需求较高。因此，`流动比率`成为估算负债率的关键变量。影响机械行业企业资本结构的决定性比率之一是`市盈率`。`市盈率`显示了市值与盈利能力之间的关系。机械行业中高`P/E`比率可能意味着公司为了预期增长需要较少的借贷。`净收益率`（`ROE`）显示了公司利用股权的效率。在机械行业中，平衡债务和股权至关重要。高`ROE`\
  \ 表示公司能够在不贷款的情况下增长，并有效利用了其股权。`ROE`对于希望保持低负债率的公司来说是一个关键指标。同样，`权益周转率`显示了公司利用股权的有效性。在机械行业这一资本密集型行业，限制债务融资并优先使用股权是普遍做法，对负债率产生巨大影响。由于机械行业是一个需要大量物理资产的行业，影响资本结构的比率之一是`固定资产/总资产`比率。随着固定资产占总资产份额的增加，贷款的需求可能会增加。该比率对公司的财务杠杆策略具有重大影响。由于机械行业的增长需要新的投资和扩张，可以观察到高`资产增长率`的公司需要更多借贷。这一变量对于理解该行业增长与借贷之间的关系非常重要。`EBITDA\
  \ 利润率`反映了经营盈利能力。当机械行业的运营效率较高时，借贷需求可能会减少。否则，公司可能会转向债务融资以维持盈利能力。\n\n因此，如`流动比率`和`ROE`等流动性和盈利能力指标对机械部门的借贷率具有决定性影响。该行业的资本密集型结构使得`固定资产/总资产`比率在决定借贷策略方面至关重要。此外，`资产增长率`和`销售增长`等增长指标直接影响公司的借贷需求。\n\
  \n## 6. 解决方案与建议\n\n本研究获得的结论从两个不同的维度进行了分析：关于分析中使用的算法，以及关于企业的资本结构决策。\n\n在本研究中，使用了`Lasso\
  \ 回归`、`ElasticNet`和`LightGBM`算法来确定影响负债率特征的重要性水平。由于每种算法在财务数据建模能力、准确性以及特征选择方面的成功方面存在差异，比较这些方法的性能至关重要。研究中使用的模型在捕捉线性和非线性关系的能力、处理高维数据集的能力以及对特征选择的影响方面进行了评估。\n\
  \n### 图 4. 不同算法和所属的预测性能对比\n\n![979-8-3693-8186-1.ch010.f04](img/979-8-3693-8186-1.ch010.f04.png)\n\
  \n图 4 根据性能指标比较了算法在行业层面的成功情况。`Lasso 回归`是一种在特征选择中有效且能防止模型过拟合的方法。得益于正则化过程，它通过消除不必要或不重要的特征提供了一种更简单的模型结构。然而，当因变量和自变量之间存在线性关系时，`Lasso\
  \ 回归`的成功率更高。在分析如`负债率`等复杂的财务变量时，它无法很好地捕捉非线性关系，在某些情况下会导致性能下降。\n\n`ElasticNet`是一种结合了`Lasso`和`Ridge\
  \ 回归`优点的混合算法。通过同时使用`L1`（绝对偏差）和`L2`（平方偏差）范数，它在选择特征方面提供了更大的灵活性。`ElasticNet`在具有高度相关特征的数据集上表现尤为出色。然而，由于能源、IT\
  \ 和机械行业数据中变量的复杂性和非线性关系，其准确性可能会受到限制。尽管如此，通过比`Lasso`在模型中保留更多特征，它具有更全面地检查多个因素对资本结构影响的优势。\n\
  \n`LightGBM`是一种基于决策树的机器学习算法，可以在大型高维数据集上产生快速且有效的结果。`LightGBM`的优势在于它比其他算法能更好地捕捉非线性关系，并且具有很高的训练速度。此外，计算特征重要性水平的能力使得该算法在`负债率`等多因素分析中脱颖而出。在确定能源行业宏观经济指标和\
  \ IT 行业流动性管理等不同特征重要性方面，`LightGBM`的表现优于`Lasso`和`ElasticNet`。因此，使用如`LightGBM`等强大的机器学习算法能够实现更有效的资本结构预测，并实现跨行业的定制化财务政策的发展。\n\
  \n### 图 5. 各行业最重要的五个特征\n\n![979-8-3693-8186-1.ch010.f05](img/979-8-3693-8186-1.ch010.f05.png)\n\
  \n分析结果也可用于分析企业的资本结构决策。如图 5 所示，分析结果强调了行业特定的财务动态，并强调有效的资本结构管理策略需要根据每个行业的独特特性采取特定方法。\n\
  \n能源行业受宏观经济增长的影响，因此`GDP`成为该行业最关键的因素之一。`GDP 增长`增加了能源需求，这对公司的收入产生积极影响并增强了其还债能力。由于该行业的资本密集型性质，`资产增长率`是一个重要指标；该比率为新投资提供了关键参考。`EBITDA\
  \ 利润率`通过反映运营效率直接对公司的财务可持续性做出贡献。尽管`流动比率`是流动性管理中的一个重要指标，但在能源行业，短期债务相对不重要，因为长期项目和投资处于重点。`固定资产周转率`是另一个衡量资本密集型投资有效利用的重要指标。该行业应该制定长期融资策略，并为资本密集型项目提供适当的资金来源。规划应结合宏观预测，并针对需求的变化采取灵活的财务策略。应通过优先考虑提高运营效率的技术投资来加强`EBITDA\
  \ 利润率`。\n\n\n\n\n由于市场动态瞬息万变且竞争激烈，IT 行业高度重视流动性管理。流动率是该行业的一个关键特征，在短期债务管理中起着决定性作用。固定资产与总资产之比（`Fixed\
  \ Assets / Assets`）显示了该行业资本投资的有效性，而 `EBITDA / 净融资费用` 比率则反映了公司经营业绩对融资成本的影响。`资产周转率`揭示了\
  \ IT 公司利用资源的效率，而 `PD/DD` 比率在管理借贷风险方面是一项重要指标。在 IT 行业运营的公司应制定策略以维持短期流动性。此外，公司应该提高资产收益率并优化其成本结构。\n\
  \n机械行业以生产周期长和资本密集型活动为特点，其资本结构决策需要在运营效率和长期投资之间采取平衡的方法。换句话说，由于资本密集型的结构，在机械行业运营的企业必须平衡流动性指标和盈利能力指标。虽然流动率对于有效管理营运资金至关重要，但市盈率（P/E）通过反映投资者的预期决定了资本成本。净资产收益率（ROE）是一项重要的绩效指标，它提高了该行业的投资效率和投资者对公司的信心。权益周转率显示了公司的资源利用效率，而固定资产与总资产之比在资本密集型项目的融资中起着决定性作用。该行业的企业应通过采用长期融资策略确保资本密集型投资的可持续性，关注\
  \ `ROE` 和 `P/E` 比率以增加投资者信心，并追求高盈利和股权的高效利用。此外，还应采取措施增强经营业绩并确保固定资产的高效利用。\n\n## 7.\
  \ 结论\n\n近年来，人工智能和机器学习越来越多地应用于财务分析。特别是特征重要性的确定，是一个提高机器学习模型透明度和预测能力的过程。特征重要性通过揭示哪些解释变量对资本结构等因变量影响更大，来支持财务决策。这类分析的优势能够检测传统回归方法难以捕捉的复杂关系。如\
  \ `LightGBM`、`Lasso regression` 和 `ElasticNet` 等现代算法允许在财务分析中同时评估大量变量并识别出最重要的特征。\n\
  \n本研究利用 `Lasso regression`、`ElasticNet` 和 `LightGBM` 算法，对 2019 年第三季度至 2024 年第二季度期间在伊斯斯坦尔证券交易所交易的能源、IT\
  \ 和机械行业 71 家公司的样本로行业层面的资本结构决定因素进行了分析。在分析中，比较了机器学习算法的性能，结果表明 `LightGBM` 模型可以做出精度最高的预测。\n\
  \n在影响资本结构的因素中，`GDP`、流动率、`EBITDA` 毛利率、权益周转率以及反映公司增长的资产增长率等指标表现突出。然而，每个行业独特的债务管理策略和财务结构导致特征的重要性在不同行业之间存在差异。因此，分析特定行业的决定因素有助于公司通过理解借贷政策如何受行业特定动态的影响，从而制定更有效的财务策略。在此背景下，由于\
  \ `LightGBM` 模型提供了成功的预测，特征的重要性水平由该模型确定。\n\n分析结果揭示了不同行业的借贷政策如何根据行业动态而不同。能源行业以其资本密集和基于长期投资的结构脱颖而出。与其他行业相比，营运资金和流动率等短期流动性指标在该行业并不重要。相反，固定资产占总资产比例和资产增长率对财务杠杆的影响更大。由于能源行业的借贷通常用于资助长期项目，利率和通胀等宏观经济变量对借贷的影响有限。\n\
  \nIT 行业高度重视基于流动性的指标和股权利用。流动率、权益周转率和资产增长率等措施直接影响借贷决策。此外，IT 行业的快速增长潜力和灵活结构要求投资者对经济指标更加敏感。在\
  \ IT 行业，由于通胀对成本结构和盈利能力的影响，它是比能源和机械行业更显著的因素。\n\n由于资本密集型的结构，机械行业同时关注固定资产利用和盈利率。在该行业中，股权和债务之间的平衡具有战略意义，固定资产效率和销售增长率等指标起着决定性作用。\n\
  \n这项分析揭示了每个行业都有不同的财务和运营重点，且用于预测资本结构的特征在不同行业间存在差异。通过机器学习方法获得的这些特征重要性分析为财务策略的制定过程做了重要贡献。识别行业特定的关键因素允许投资者和经理更有效地管理风险。此外，本研究还揭示了人工智能提供的分析能力在理解财务数据和加速决策过程方面发挥着重要作用，预计这些技术对财务管理的影响未来将加深。本研究有助于理解不同行业的债务管理策略，并为利用人工智能和机器学习技术开发特定行业的财务政策提供了重要指南。\n\
