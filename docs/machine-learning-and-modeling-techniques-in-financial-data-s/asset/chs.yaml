  ⁵ 访问于 2024.3.09\n\n## 第 9 章\n\n# 通过策略性数据分析提升审计效能\n\nAshok Panchapakesan\n![Orcid\
  \ Imagehttps://orcid.org/0000-0002-5859-6041](https://orcid.org/0000-0002-5859-6041)]\n\
  印度，共生国际大学（Symbiosis International University）\n\nHarishchander Anandaram\n![Orcid\
  \ Imagehttps://orcid.org/0000-0003-2993-5304](https://orcid.org/0000-0003-2993-5304)]\n\
  印度，阿姆里塔维速大学（Amrita Vishwa Vidyapeetam）\n\nLakshmi Sridevi\n印度，钦奈技术学院（Chennai Institute\
