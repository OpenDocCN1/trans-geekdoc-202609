  \ | 0.192 | 16.614 | 0.22 | 0.026 | 0.195 | 16.614 | 0 |\n\n### 1 分钟频率预测\n\n在 1\
  \ 分钟频率预测中，`LSTM` 在所有市场的 `Adjusted Total Return`（调整后总收益）方面均优于 `XGBoost`，但`银期货`除外，这两个模型的表现均不理想。`LSTM`\
  \ 的`原油期货` `Mean Return`（平均收益）为 `0.008`，高于 `XGBoost` 的 `0.005`，但更显著的差异在于 `Adjusted\
  \ Total Return`，`LSTM` 达到了 `44.62%`，而 `XGBoost` 为 `35.00%`。`Return Std.`（收益标准差）的差异也值得注意；`XGBoost`\
  \ 较高的 `Return Std.`（0.164）相比于 `LSTM` 的（0.15）表明 `XGBoost` 在承担更大风险的同时回报更少，因为其经波动调整后的收益较低。在`金期货`中观察到了类似的趋势，尽管两个模型的\
  \ `Mean Return` 均为 `0.006`，但 `LSTM` 在 `Adjusted Total Return`（38.77%）上再次领先于 `XGBoost`（`29.92%`）。`LSTM`\
  \ 在`金期货` 中的 `Return Std.`（0.167）略高于 `XGBoost` 的（0.151），但风险的增加仍然带来了更好的收益。在`大豆期货`中，`LSTM`\
  \ 产生的 `Mean Return`（0.009）远高于 `XGBoost` 的 `0.004`，并且提供了更高的 `Adjusted Total Return`（`39.45%`\
  \ 对 `16.45%`），反映了它即使在管理 `Return Std.` 为 `0.208`（高于 `XGBoost` 的 `0.204`）的波动的情况下，也能产生卓越利润的能力。\n\
  \n对于`银期货`，结果有所不同。尽管 `LSTM` 的 `Mean Return` 较高（`0.002` 对 `0.001`），但两个模型的 `Return\
  \ Std.` 都处于较高水平（`LSTM` 为 `0.191`，`XGBoost` 为 `0.201`），导致两者的 `Adjusted Total Return`\
  \ 都很糟糕。`LSTM` 的 `-10.2%` `Adjusted Total Return` 与 `XGBoost` 的 `-18.11%` 形成对比，表明尽管\
  \ `LSTM` 更好，但两个模型在这个波动市场中都表现艰难。在`螺筋期货`中，`LSTM` 再次显示出更好的性能，`Mean Return` 为 `0.009`，`Adjusted\
  \ Total Return` 为 `38.33%`，相比 `XGBoost` 的 `0.003` 和 `15.08%`。两个模型的 `Return Std.`\
  \ 均较低（`LSTM` 为 `0.168`，`XGBoost` 为 `0.158`），但 `LSTM` 仍然成功产生了更优的收益，表明它更有效地处理`螺筋期货`的低风险环境。\n\
  \n### 5 分钟频率预测\n\n在 5 分钟频率预测中，`LSTM` 在所有市场的 `Adjusted Total Return` 方面均优于 `XGBoost`，但`银期货`除外，这两个模型的表现均不理想。`原油期货`中\
  \ `LSTM` 的 `Adjusted Total Return` 为 `37.69%`，优于 `XGBoost` 的 `26.03%`。尽管 `XGBoost`\
  \ 的 `Return Std.` 略高（`0.197`），但这种波动并未带来相应的回报。`LSTM` 在保持 `Return Std.` 为 `0.181`\
  \ 的同时产生了更优收益。类似的趋势也出现在`金期货`中，`LSTM` 在 `Adjusted Total Return`（`35.62%`）上领先于 `XGBoost`（`29.23%`），尽管收益标准差分别为\
  \ `0.182` 和 `0.172`。在`银期货`中，`XGBoost` 的表现虽然波动但收益不佳。`LSTM` 的 `Adjusted Total Return`\
  \ 为 `33.12%`，相比 `XGBoost` 的 `-4.90%` 有显著改进，这表明 `LSTM` 能够更好地管理该市场的波动。在`大豆期货`中，`LSTM`\
  \ 的 `Adjusted Total Return`（`7.62%` 对 `0.53%`）远高于 `XGBoost`，且其较高的 `Return Std.`（`0.247`）反映了该市场的波动性，而\
  \ `LSTM` 处理得更好。在`螺筋期货`中，`LSTM` 再次表现出更好的性能，`Adjusted Total Return` 为 `10.2%`，相比 `XGBoost`\
  \ 的 `1.26%`，尽管其 `Return Std.` 分别为 `0.186` 和 `0.171`。\n\n### 15 分钟频率预测\n\n最后，在 15\
  \ 分钟频率下，`LSTM` 在所有市场的 `Adjusted Total Return` 方面均优于 `XGBoost`，但`银期货`除外，这两个模型的表现均不理想。`原油期货`中，`LSTM`\
  \ 的 `Adjusted Total Return` 为 `44.62%`，优于 `XGBoost` 的 `35.00%`。尽管 `XGBoost` 的 `Return\
  \ Std.` 较高（`0.164`）相比于 `LSTM` 的（`0.15`），这表明 `XGBoost` 在承担更大风险的同时回报更少，因为其经波动调整后的收益较低。在`金期货`中，`LSTM`\
  \ 在 `Adjusted Total Return`（`38.77%`）上领先于 `XGBoost` 的（`29.92%`），尽管两个模型的 `Mean Return`\
  \ 均为 `0.006`。`LSTM` 在`金期货`中的 `Return Std.`（`0.167`）略高于 `XGBoost` 的（0.151`），但风险的增加仍然带来了更好的收益。在`大豆期货`中，`LSTM`\
  \ 产生的 `Mean Return`（`0.009`）远高于 `XGBoost` 的 `0.004`，并且提供了更高的 `Adjusted Total Return`（`39.45%`\
  \ 对 `16.45%`），反映了它即使在管理 `Return Std.` 为 `0.208`（高于 `XGBoost` 的 `0.204`）的波动的情况下，也能产生卓越利润。\n\
  \n对于`银期货`，结果有所不同。尽管 `LSTM` 的 `Mean Return` 较高（`0.002` 对 `0.001`），但两个模型的 `Return\
  \ Std.` 都处于较高水平（`LSTM` 为 `0.191`，`XGBoost` 为 `0.201`），导致两者的 `Adjusted Total Return`\
  \ 都很糟糕。`LSTM` 的 `-10.2%` `Adjusted Total Return` 与 `XGBoost` 的 `-18.11%` 形成对比，表明尽管\
  \ `LSTM` 更好，但两个模型在这个波动市场中都表现艰难。在`螺筋期货`中，`LSTM` 再次显示出更好的性能，`Mean Return` 为 `0.009`，`Adjusted\
  \ Total Return` 为 `38.33%`，相比 `XGBoost` 的 `0.003` 和 `15.08%`。两个模型的 `Return Std.`\
  \ 均较低（`LSTM` 为 `0.168`，`XGBoost` 为 `0.158`），但 `LSTM` 仍然成功产生了更优的收益，表明它更有效地处理`螺筋期货`的低风险环境。\n\
  \n#### 7.3 特征重要性\n\n特征重要性提供了关于哪些输入变量对模型决策影响最大的见解，这对于模型的可解释性和决策具有直接影响。然而，`LSTM` 和\
  \ `XGBoost` 评估特征重要性的方法存在显著差异。\n\n在 `XGBoost` 中，可以通过内置方法直接访问并解释特征重要性，这些每个特征对模型预测的贡献。`XGBoost`\
  \ 使用决策树作为其基学习器，因此它能够通过评估特征在树节点中使用的频率来计算特征重要性。`XGBoost` 评估特征重要性的两种常用方法是：\n\n*   基于权重的重要性：该方法统计每个特征在每个节点用于分割数据的次数。使用频率越高的特征被认为越重要。这为评估特征相关性提供了一种简单直观的方法。\n\
  \n\n\n\n\n## 基于增益的重要性 (Gain-Based Importance)\n\n该方法通过衡量特征在分裂中使用后对模型性能的提升（通常通过损失函数的减少来衡量）来实现。对模型准确性或性能提升最大的特征被赋予更高的重要性。这种方法以一种更细粒度的方式捕捉每个特征的贡献，考虑了该特征对模型预测的实际影响（Chen\
  \ & Guestrin, 2016）。\n\n在本研究的背景下，考虑到特征之间存在交互效应，因此基于增益的 F 分（F-score by gain）是衡量特征重要性的更为方法。这是因为\
  \ `F-score by gain` 反映了特征对提高模型性能的贡献程度，即使这种改进仅在特征与其他特征相互作用时发生。这特别有价值，因为特征重要性并不完全取决于特征使用的频率（如\
  \ `F-score by weight`），而是取决于它在多大程度上增强了模型的预测准确性。图 1 展示了黄金期货市场 1 分钟后预测的特征重要性（基于增益）图，该图使用\
  \ `XGBoost` 包生成。`F-scores` 显示，根据 `XGBoost` 分类器，过去价格、波动性和持仓量变化是预测期货价格方向最重要的特征之一。与直觉观察相反，模型使用的某些技术特征在预测期货价格波动方面似乎并不显著。\n\
  \n### 图 1. 基于增益的特征重要性：黄金期货市场 1 分钟后预测的 XGBoost 分类器\n\n![979-8-3693-8186-1.ch014.f01](img/979-8-3693-8186-1.ch014.f01.png)\n\
  \n相比之下，`LSTM` 作为一种循环神经网络（`RNN`），处理序列数据和时间依赖性，使其在涉及特征重要性时本质上更加复杂。`LSTM` 不提供像 `XGBoost`\
  \ 那样易于获取的内置特征重要性衡量标准。由于 `LSTM` 是一种深度学习模型，它通过跨时间步的一系列加权连接学习特征之间的时间关系。`LSTM` 中的特征重要性隐含在网络的权重中，而不是通过特征使用或增益显式定义。\n\
  \n然而，存在间接方法来评估 `LSTM` 模型中的特征重要性：\n\n- **排列重要性 (Permutation Importance)**：该方法涉及扰动输入数据的每个特征（例如通过随机打乱其值），并观察模型性能的变化。扰动导致模型准确性下降最大的特征可以被认为是最重要的。这种方法可以应用于任何模型（包括\
  \ `LSTM`），以估算每个特征对模型预测能力的影响（Fisher et al., 2019）。\n\n- **基于梯度的方法 (Gradient-Based\
  \ Methods)**：诸如显著性图和 `Integrated Gradients`（积分梯度）等技术可用于损失函数对输入特征的梯度。这些方法通过检查特征值的变化如何影响模型损失，提供了一种评估在每个时间步哪些特征对模型输出贡献最大的方法。在\
  \ `LSTM` 的背景下，这些方法有助于识别时间依赖预测中影响最大的特征（Simonyan et al., 2013; Bach et al., 2015）。\n\
  \n- **注意力机制 (Attention Mechanisms)**：在某些 `LSTM` 变体中（例如 `Attention-based LSTM` 模型），模型显式学习“关注”输入序列的特定部分，在预测时对某些特征或时间步赋予更多权重。注意力权重可以解释为特征重要的一种形式，突出了模型认为输入数据的哪些部分与其预测最相关。这种方法在时间序列预测等序列任务中特别有用，因为特征的相对重要性可能会随时间而变化（Niu\
  \ et al., 2021）。\n\n虽然这些技术提供了有用的见解，但它们通常的计算量更大，且不如 `XGBoost` 中提供的特征重要性指标那么直观。`LSTM`\
  \ 模型的可解释性是一个持续的研究领域，虽然排列重要性和显著性图等方法可以提供宝贵的见解，但它们需要额外的步骤，并且不提供像 `XGBoost` 等树模型那样的透明度。\n\
  \n## 8. 结论\n\n本研究通过比较两种广泛使用的机器学习分类器——`XGBoost` 和 `LSTM` 在预测极短期市场方向（1-15 分钟跨度）方面的性能，为短期期货市场预测的文献做了贡献。研究关注了来自中国五个关键期货市场——原油、黄金、大豆、白银和钢筋期货的高频交易数据。通过评估\
  \ `XGBoost` 和 `LSTM` 的相对优势，这项研究填补了文献中的重要空白，因为大多数先前的研究侧重于长期预测或价格预测，而不是极短期的方向预测。`LSTM`\
  \ 以捕捉时间序列中的时间依赖和长期模式而称，而 `XGBoost` 擅长建模结构化数据集中的非线性关系，两者的选择是基于其互补的优势。\n\n\n\n\n\n\
