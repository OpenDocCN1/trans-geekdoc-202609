  \n### 第 4 节\n### 金融市场预测与策略优化应用\n\n## 第 4 节\n# 金融市场预测与策略优化应用\n\n## 第 12 章\n# 从图表到图表：\n\
  \n## 使用 LSTM 分析音乐排行榜歌词内容以预测股价\n\n### 摘要\n本研究在之前研究的基础上，探索了歌词的主题和情感内容与股价波动之间更深层次的关系。本研究以经股指数为核心，利用流加权歌词（`SWML`）向量作为长记忆（`LSTM`）模型的输入，基于语义内容预测股票回报。研究结果通过引入音乐消费作为一个有价值的指标，为该领域做出了重要贡献。\n\
  \n### 1 引言\n音乐作为一种无处不在的享乐消费形式，长期以来其捕捉和传递社会情感和情绪的能力被所认可。特别是流行歌曲的歌词，往往反映了公众的主流情绪、关注和愿望。鉴于音乐对个人的情感和心理影响，不难推断流行音乐中表达的情绪可能是集体情绪的镜像，甚至是其催化剂。\n\
  \n此前的研究通过识别音乐情绪与股市回报之间的正相关性为本研究奠定了基础。在此基础上，我们的研究旨在通过关注音乐歌词的主题和情感内容，探索这种关系的细微差别。\n\
  \n\n\n\n日本股市因其在全球经济中的重要地位以及作为亚洲最大金融中心的地位，为本研究提供了一个理想的背景。截至 2024 年 9 月，日本东京证券交易所（`TSE`）上市公司的月度市值总额约为\
  \ 950.24 万亿日元。截至 2023 年底，`TSE` 上市公司约有 3,900 家（Statista, 2024 年 10 月）。由于东京证券交易所是全球流动性最强且机制最完善的市场之一，日本经济为研究复杂的金融现象（特别是行为金融学领域）提供了坚实的基础。日本股市的规模和影响力提供了一个广泛的数据集，并为观察市场动态如何受到各种因素（包括投资者情绪）的影响提供了一个清晰的窗口。作为全球经济强国，从日本股市得出的任何见解对于理解其他主要金融市场的市场波动可能具有更广泛的影响。\n\
  \n与其他市场的投资者投资者相比，日本投资者倾向于表现出独特的行为，通常表现出更强的风险规避性和对长期投资的偏好（Hamao & Mei, 2001）。这些行为深根于日本的文化和社会价值观，使得对文化因素的研究变得尤为相关。日本的流行音乐，尤其是\
  \ J-pop，在反映和塑造公众情绪方面发挥着核心作用，使其成为社会情感脉搏的关键文化指标。流行音乐在日本的广泛吸引力和影响为探索音乐歌词中的情感和主题如何影响投资者情绪提供了机会。日本文化的同质性放大了这种关系，因为流行音乐有潜力与公众（包括投资者）产生更统一（一致性）的共鸣，这可能对市场波动产生可衡量的影响。\n\
  \n此外，日本股市经历过独特的经济状况，例如长期的通货紧缩、低利率和波动时期，使其对心理和情感信号尤为敏感。这种对情绪的敏感性，结合该国丰富的文化遗产及其音乐的情感深度，为研究流行文化如何影响市场动态提供了一个引人注目的背景。通过调查流行音乐歌词内容与股票收益之间的联系，本研究旨在为非传统因素（如文化情绪）如何与金融行为相互作用提供新视角。来自日本市场的发现也可以为其他市场的研究提供参考，对流行文化在全球金融市场作用提供更广泛的见解。\n\
  \n为了捕捉一个国家所采用的音乐特征，我们借鉴了 Edmans 等人(2022)提出的音乐情绪测量概念框架。该框架假设，与排名靠后的歌曲相比，排名较高的歌曲对全球情绪的贡献更大。然而，我们的研究不仅限于歌词内容传递的积极或消极情绪的简单提取，而是对歌词进行了更全面的特征提取过程。基于加权原理，我们针对\
  \ Spotify 日本的前 200 首歌曲构建了每日`流加权音乐歌词`（`SWML`）向量。`SWML`是一个`64-D`向量，用于描述描述某国每日前 200\
  \ 首歌曲歌词中隐藏的语言特征。它涵盖了多个语言维度，包括功能词、人称代词和心理过程（例如情感、社交、认知、驱动、个人关注、非正式语言等）。\n\n随后，我们将`SWML`时间序列数据与日本尼经指数（`NI225`）同步，得到了一个跨越\
  \ 247 天的综合数据集，其中包含了音乐和股市信息。为了探索预测市场收益的潜力，我们应用了`长短期记忆`（`LSTM`）模型，以利用歌词词汇频率与股票指数所反映的市场收益之间的关系。\n\
  \n我们的初步发现揭示了音乐歌词与股市动态之间关系中有趣的模式。例如，“钱（money）”一词通常与个人关注和愿望相关，它与每日“收盘（Close）”价显示出正相关，这表明歌词关注财务成功和财富的歌曲可能与股市乐观时期和上升趋势产生共鸣。我们的研究还识别了音乐中特定语言特征与股票表现之间的显著关联，进一步验证了它们使用`LSTM`进行预测的潜力。\n\
  \n我们发现的意义超越了行为金融学的范畴，为理解投资者情绪和市场动态提供了一个新视角。通过揭示音乐歌词内容与股票价格之间的关系，我们对投资者心理如何影响金融市场的更广泛理解做出了贡献。这项研究为希望将非常规指标纳入投资策略的市场参与者提供了宝贵的见解，并强调了在金融决策中考虑文化和心理因素的重要性。\n\
  \n## 2. 文献综述\n\n行为金融学研究投资者的心理学及其在金融决策中的作用（Kapoor & Prosad, 2017）。它将人类偏见和非理性引入金融决策过程，并对市场定价异常提供了解释，而传统的有效市场理论在此时是不够的。在现代金融中，行为金融学已成为最重要的研究领域之一，它整合了心理学的见解来理解偏离理性的偏差，涵盖认知偏差、情感影响和集体行为模式。人们日益达成共识，即恐惧和贪婪等情绪驱动的投资者情绪可能会引发放大市场波动的反馈循环，从而导致股价波动。通过更好地理解投资者的心理偏差如何转化为其行为并导致做出次优决策，以及这些决策如何在规模上影响市场资产定价，研究人员和从业人员将能够更好地防止灾难性的市场异常并建立更有效的定价模型。\n\
  \n### 2.1 股市与投资敏感性及情绪\n\n这类文献通过引入“情绪贝塔（mood beta）”建立了此类实证定价模型。如 Hirshleifer 等人(2020)所示，情绪贝塔通过检查金融资产对投资者情绪的不同敏感性来构建，并用于解释股票收益的横截面季节性。Hirshleifer\
  \ 等人(2020)发现证据表明，单个股票或投资组合在过去高或低情绪月份和工作日的相对表现倾向于在情绪一致的时期再次出现，而在情绪不一致的时期发生反转。此外，对整体情绪敏感性较高的（即情绪贝塔较高）资产，在情绪上升期间获得较高收益，在情绪下降期间获得较低收益。\n\
  \n\n\n自那以后，其他研究人员在多个市场发现了支持性证据。例如，Wen 等人 (2022) 研究了中国 A 股市场，并发现显著的情绪季节性效应：在情绪一致期间，情绪\
  \ beta 因子与股票收益之间存在正相关，且基于二月份的情绪 beta 值的投资策略可以获得显著为正的平均收益。Atilgan 等人 (2023) 将情绪季节性扩展到了国际背景下；他们不仅证实了原始研究的结果，还将其发现扩展到非美国市场，并证明这些发现并非特定样本的。他们发现，股票的相对历史季节性收益在相似或一致的情绪期间与其未来的相对季节性收益呈正相关，在不同或不一致的情绪期间与其未来的相对季节性收益呈负相关。\n\
  \n另外另一类研究为衡量投资者情绪提出了多种方法。早期的一些尝试使用了心理学上更直观的方法，例如，Brown and Cliff (2004) 使用调查数据作为投资者情绪的衡量标准来预测市场收益，Schmeling\
  \ (2009) 使用消费者信心作为个人投资者情绪的代理。\n\n一些实证研究使用基于市场的指标作为情绪衡量。Baker and Stein (2004) 认为流动性（如市场换手率）可以作为情绪指标。他们理论化地，非理性投资者往往对订单流中包含的信息反应不足，从而增强了流动性。当市场存在卖空限制时，高流动性是市场由这些非理性投资者主导并被高估的症状。\n\
  \nKumar and Lee (2006) 基于买卖不平衡建立了一个个人投资者情绪衡量指标，并证明它对零售户集中度较高的股票（即市值、价值股、机构持股比例较低以及低价股）具有增量解释力，特别是当这些股票的套利成本较高时。基于这种买卖不平衡衡量指标，Kim\
  \ and Lee (2022) 进一步包含了调整后的换手率和相对强度指数，构建了投资者情绪指数。他们在韩国市场发现证据，该投资者情绪指数显著影响股票收益，在个人参与度较高的\
  \ KOSDAQ 市场表现更为明显。\n\n其他研究将不同的情绪代理指标组合成综合情绪指数。Baker and Wurgler (2006) 基于六个代理指标构建了情绪综合指数，包括封闭式基金折价、换手率、首次公开发行（IPO）的数量和首日平均收益率、新发行的股票股以及股利溢价。Baker\
  \ 等人 (2012) 为六大主要股市构建了投资者情绪指数，并将其分解为一个全球指数和六个局部指数。Chen 等人 (2010) 开发了一个衡量香港股市情绪的综合指数。他们的指数是六个代理指标的线性组合，其权重通过主成分法获得。这些代理指标包括空头量、香港同业拆定利率、相对强度指数、资金流向指数、换手率以及美国和日本的股市表现。他们认为，与之前的模型相比，他们的模型具有高预测能力。Chen\
  \ 等人 (2014) 根据经济因素（利率、汇率、工业产值变化和货币供应量变化）和市场因素（换手率和新投资者账户数量）为中国股市构建了基于主成分的综合情绪指数。他们展示了该指数对市场波动良好的预测性。\n\
  \n## 2.2 股市与社交媒体\n\n近年来，行为金融学与计算方法的交叉引发了人们对利用非传统数据源预测股票收益日益增长的兴趣。研究人员越来越多转向大规模数据以构建投资者情绪的有效衡量标准：Bollen\
  \ 等人 (2011) 调查了源自推特的集体情绪状态测量是否与道斯指数（DJIA）相关。Berger (2022) 直接从散户交易活动中创建了投资者情绪衡量指标，以识别估值偏差并检查其联系。Wisniewski\
  \ and Yekini (2015) 使用计算语言工具分析了英国上市公司的年度报告，并使用语言指标的频率预测未来收益。他们发现其中两个指标“活动”和“现实”可以预测价格上涨。\n\
  \nMcGurk 等人 (2020) 通过对社交媒体进行文本分析，考察了投资者情绪与股票收益的关系，发现他们的投资者情绪衡量对异常股票收益有显著影响。他们提出了一种基于推特的特定股票情绪估计方法，如\
  \ Taddy (2013) 所开发，该方法不依赖于预定义的字典，也不假设单个单词具有相同的情绪。在这种方法中，个人用户在推特上的推文训练集被确定为积极、中性或消极情绪，然后用这些来预测所有其他推文的情绪信息。他们认为其发现在不同模型和设定下是一致的，为非行为理论提供了进一步证据。\n\
  \n更有趣的是，另一组研究发现了音乐情绪与股市表现之间的相关性。Maymin (2012) 发现公告牌 100 歌曲的节拍方差可以预测股市波动，而 Fernandez-Perez\
  \ 等人 (2020) 根据个人所听歌曲的情价（valence）开发了投资者情绪衡量指标。Fernandez-Perez 等人 (2020) 发现证据表明，他们的音乐情绪衡量捕捉了季节和天气引起的情绪波动，并系统性的定价纠正模式相关。\n\
  \n\n\nEdmans 等人 (2022) 利用全球领先的在线音乐平台 Spotify 的收听数据，并构建了一种新颖的国家情绪衡量指标，用于衡量个人选择收听的歌曲的积极性。这被认为是对情绪的直接衡量方法，因为它没有预先设定某些影响情绪的事件，也没有假设这些事件对投资者的影响程度。具体而言，他们构建了每个国家、每个国家前\
  \ 200 首歌曲的每日流加权平均效价（`SWAV`），并使用 `SWAV` 的变化作为基于音乐的情绪衡量指标。他们发现，在控制了全球市场收益、季节性和宏观经济变量后，音乐情绪与同期市场收益之间存在正相关且显著的关系。值得注意的是，Edmans\
  \ 等人 (2022) 还揭示了国家效应，但该效应主要被视为控制变量。\n\n音乐的另一个引起研究人员兴趣的方面是歌词的语言特征。例如，Harsley 等人 (2016)\
  \ 假设前 100 首歌曲的情绪可以代表公众情绪，并与股市变化相关。他们分析了 2008 年至 2013 年间的数据，从七个维度对情绪的极性和心情进行了分析，并发现歌词情绪极性与\
  \ `DJIA` 收市价之间存在统计学上的显著相关性。他们的结果得到了其他研究语言和叙事研究的支持，包括 Wisniewski 和 Yekini (2015)，他们使用计算语言学工具分析了英国上市公司年度报告的定性部分。更具体地说，他们使用与不同语言指标相关的词汇频率来预测未来的股票收益。他们发现，这些指标中捕捉“活动性”和“现实性”的两个指标在控制了广泛因素后，仍能预测随后的价格上涨。因此，他们建议投资者仔细审阅年度报告的叙述，因为其中包含了可能尚未体现在价格之中的宝贵信息。\n\
  \n通过上述少数研究，人们可能会意识到，音乐作为一种内在的多模态数据类型，是复杂且多层面的，其各个方面都贡献了它的丰富性和深度。除了纯器乐曲外，与音乐相关的歌词对于歌曲的接收和信息传递而言，与音频同关重要（Mayer\
  \ & Rauber, 2010）。音乐数据的丰富性为揭示更多与情绪相关的维度提供了机会，使我们的研究能够深入探讨音乐歌词内容嵌入的情绪与股票收益之间的特定关系。通过关注日本市场，我们探索了流行音乐歌词中表达的主题和情感如何反映或影响投资者情绪以及股价波动。\n\
  \n为了研究这种关系，与 Guan 等人 (2024) 类似，我们构建了一个每日流加权音乐歌词（`SWML`）向量，用于量化日本 Spotify 前 200 首歌曲中歌词的情绪和主题内容。我们使用语言探究及词汇计数（`LIWC`）分析器进行文本分析，得出各种语言维度，包括功能词、人称代词和心理过程（例如：情感、社交、认知、驱动力、个人关注、非正式语言等）。这种方法使我们能够捕捉流行音乐中盛行的的情绪和主题，我们假设这些可能与投资者情绪、进而与股市波动相关联。\n\
  \n## 2. 股市预测\n\n最近的研究探索了机器学习和深度学习技术用于股市预测。深度学习方法，特别是卷积神经网络（`CNN`）和长短期记忆网络（`LSTM`），在性能上显示出优于传统的机器学习算法。Nikou\
  \ 等人 (2019) 评估了 2015 年 1 月至 2018 年 6 月 iShares MSCI 英国交易所交易基金的预测能力。他们测试了四种机器学习算法模型，发现深度学习方法在预测方面优于其他方法，而支持向量回归方法在神经网络和随机森林方法之后位居次席，误差较小。\n\
  \n在另一项研究中，Nabipour 等人 (2020) 比较了机器学习和深度学习算法，利用特黑兰证券交易所四个板块的数据预测股市趋势，发现 `RNN` 和 `LSTM`\
  \ 等深度学习模型优于其他机器学习模型，特别是在使用连续数据时。证实这些研究，Le 等人 (2020) 分析了六十篇研究论文，以提取所需的定量信息、应用和结果。他们发现，在所有收集的论文中深度学习都优于机器学习，它是股市预测领域最合适的方法。\n\
  \n这些深度学习模型，如卷积神经网络（`CNN`）和长短期记忆（`LSTM`），利用了各种输入，包括历史价格数据、技术指标和来自新闻的文本信息（Guo & Tuckfield,\
  \ 2020；Lee 等人，2024；Oncharoen & Vateekul, 2018）。Oncharoen 和 Vateekul (2018) 采用了事件嵌入技术来改进财经新闻的文本表示，其结果显示增强文本向量并将数值和文本信息同时作为深度神经网络的输入可以提高预测性能。一些研究实现了令人深刻的高准确率。例如，Mukherjee\
  \ 等人 (2021) 尝试通过深度学习模型优化股市预测，他们报告其 `ANN` 模型准确率达到了 97.66%，而 `CNN` 模型的准确率达到了 98.92%。`CNN`\
  \ 模型使用了从特定时间段内量化数据集生成的二维直方图，并对该数据进行预测。在最近的 COVID-19 疫情期间测试时，该研究获得了不错的结果，准确率达到 91%。\n\
  \n然而，由于金融数据的非平稳性、噪声性和混沌性，预测股市趋势仍然面临挑战（Rath 等人，2023）。Raza (2017) 等研究探索了在机器学习方法中使用各种因素，如宏观经济指标、公众情绪、新闻以及\
  \ `ARIMA` 和 `SMA` 等时间序列分析技术。\n\n\n\n长短期记忆（`LSTM`）网络是一种循环神经网络，与其他深度学习方法相比，它在各种应用中均展现出了优势。研究表明，`LSTMs`\
  \ 不仅在时间序列预测和债券收益率预测方面表现出色，在文本分类任务中也实现了高准确率（Nunes 等，2019; Sari 等，2019）。\n\n#### 4.1\
  \ 股票价格预测\n特别是，`LSTMs` 通过捕捉金融时间序列数据中复杂的时间依赖关系，在股票价格预测方面展现了良好的的前景（Gaurav 等，2023; Zhang\
  \ 等，2021）。例如，Zhang 等（2019）](#979-8-3693-8186-1.ch012.bits-pdf.xhtml#_idTextAnchor769）发现，`LSTM`\
  \ 和门控循环单元（`GRU`）神经网络能够以显著高于 50%的准确率预测方向变化，方向准确率在 54% 到 82% 之间，并且 `LSTM` 在样本外收益预测和风险调整后收益方面均优于\
  \ `GRU` 和线性 `ARIMA` 模型。\n\n#### 4.2 全球股票收益预测\n`LSTM` 模型也成功应用于预测不同国家的股票收益：Chen 等（2015）](#979-8-3693-8186-1.ch012.bits-pdf.xhtml#_idTextAnchor756）使用\
  \ `LSTM` 分析了印度国家证券交易所（`NSE`）的股票数据，他们发现 `LSTM` 优于前馈人工神经网络。[Makamo (2023)] 也使用 `LSTM`\
  \ 分析了印度国家证券交易所（`NSE`）的股票数据，他们发现 `LSTM` 优于前馈人工神经网络。\n\n### 3\\. 方法\n为了研究这种关系，我们采用了以下方法论。\n\
  \n\n\n\n## 4.1 音乐衡量指标：流加权音乐歌词\n\n为了捕捉一个国家所采用的音乐特征，我们参考了 Edmans et al. (2022] 提出的音乐情感衡量理念：即高排名歌曲对全球情感的贡献比低排名歌曲更大，但我们深入研究了歌词特征提取，而不仅仅是提取歌曲中呈现的积极或消极情绪。基于权重概念，我们针对\
  \ Spotify 日本区前 200 歌曲构建了每日流加权音乐歌词（SWML）向量如下：\n\n```\n${SWML}\\_{i,~d} = ~{\\\\sum\\\
  limits\\_{j = 1}^{200}\\\\left( {\\\\frac{{Streams}\\}_{j,d}}{\\sum\\_{j = 1}^{j\
  \ = 200}{Streams}\\_{j,d}} \\\\bullet {LyricsVector}\\}_{j}} \\right)}\n```\n\n\
  `SWML[i, d]` 是一个 64 维向量，用于描述第 `d` 天 `i` 国家前 200 首歌曲歌词中隐藏的语言特征。其中，`Streams[j, d]`\
  \ 是歌曲 `j` 在第 `d` 天 Spotify 总播放量，`LyricsVector[j]` 是使用 NLP 工具语言查询与词汇计数（LIWC）提取的歌曲\
  \ `i` 的 64 维歌词特征。它涵盖了多种语言维度，包括功能词、人称代词和心理过程（例如语言相关性、社交、个人关注、认知、情感和对话等）。\n\n我们还将日本的\
  \ SWML 时间序列数据与日经 225 日线指数（NI225 指数）同步，得到了一个包含 247 天音乐和市场指数信息的组合数据集。\n\n## 4.2 相关性分析\n\
  \nSWML 与市场指数之间的皮尔逊相关性揭示了提取词汇与日本股市之间的隐藏模式。观察到日本市场大多数歌词词汇与“收盘价”（Close）之间呈现出正相关关系。图\
  \ 2 展示了关于“money”、“you”和“we”词的每日前 200 歌词分布示例与 NI225 每日市场收盘价的对比。“money”一词显示出与“收盘价”相似的下降趋势，而“you”和“we”则呈现出不一致的趋势。\n\
  \n### 图 2. 前 200 歌词词汇与日本每日收盘指数的分布示例\n\n![979-8-3693-8186-1.ch012.f02](img/979-8-3693-8186-1.ch012.f02.png)\n\
  \n## 4.3 市场收益分析\n\n为了缓解时间序列数据中可能的非平稳性，我们的音乐文本特征 `MusicVector` 给出：\n\n```\nMusicVector[i,\
  \ d] = SWML[i, d] - SWML[i, d]\n```\n\n我们将市场收益定义为日本每日股票价格的变化：\n\n```\nMarketReturn[i,\
  \ d] = Close[i, d] - Close[i, d]\n```\n\n为了测试 `MusicVector[i, d]` 与 `MarketReturn[i,\
  \ d]` 之间可能的关系，我们进行了三个 `OLS` 模型：\n- `Model 1`: 仅音乐文本特征 (`M1`）\n- `Model 2`: 仅市场指数\
  \ (`M2`）\n- `Model 3`: 兼考虑音乐文本和市场指数信息的完整模型 (`M3`)，其中市场指数信息也是每日的，并定义为 `OpenInfo[i,\
  \ d] - Close[i, d]`。\n\n对于每个模型，我们包含了月份（即 `Months 1` 到 `12`）和年份（即 `2017`、`2018`）作为控制变量。为了控制主题的热度，我们引入了每个国家的每日搜索趋势（数据获取自\
  \ Google Trends, 2024)）。具体而言，我们使用相应的股票指数作为关键词来捕捉日本的兴趣水平。这种方法允许我们对股市的公众兴趣变量进行标准化，确保搜索频率的波动被考虑在内。日本的建模结果所示如表\
  \ 1](#979-8-3693-8186-1.ch012.bits-pdf.xhtml#_idTextAnchor708)。\n\n六个（6）类语言类别/过程（包括语言相关性、社交、个人关注、认知、情感和对话）的影响列在表\
  \ 1](#979-8-3693-8186-1.ch012.bits-pdf.xhtml#_idTextAnchor708)中。每个类别对市场收益产生不同的影响。通常情况下，`MusicTex`\
  \ 的影响在考虑 `OpenInfo` 时（即 `M3`）与不考虑时（即 `M1`）保持一致。这些类别/过程中的具体影响可以总结如下：\n\n- **语言维度**：语言维度有助于理解歌曲如何在歌词中使用语言，为认知风格甚至其的人格特征提供了见解。结果显示，第一人称代词（如\
  \ `I`、`we`、`us`、`our`）和第三人称代词（如 `they`）与日本市场呈负相关，尽管并不显著。对于否定词（如 `no`、`not`、`never`），它们与日本市场收益也呈负相关。词汇数量呈现出相反的模式，它们与日本市场收益正相关（尽管不显著）。\n\
  - **社交过程**：社交过程反映了社交互动、关系以及与人的交流。这些过程的结果显示与日本市场有更强的关系，例如，人类（如 `adult`、`baby`、`boy`）负相关且显著（Model\
  \ 3 中 p 值 < 0.1），家庭（如 `daughter`、`husband`、`aunt`）与日本市场收益负相关。\n- **个人关注**：休闲词（如\
  \ `cook`、`chat`、`movie`）与市场负相关，金钱词（如 `audit`、`cash`、`owe`）和工作词（如 `work`、`school`、`class`）在\
  \ `M1` 中正相关但在 `M3` 中为负相关，然而这些影响并不显著。成就词（如 `earn`、`hero`、`win`）显示出持续且积极的影响。\n- **认知过程**：这些过程反映了各种类型的思考，并捕捉了人们处理信息和做出决策的方式。尝试性词如“if”、“or”和“any”与日本市场负相关，而排除性词如“but”、“without”和“exclude”与日本市场显著正相关。\n\
  - **情感**：情感过程指的是反映情绪表达、心情和感受的词汇。例如，焦虑、愤怒和悲伤词与市场呈负相关但不显著，而积极词汇带来了积极影响且显示显著。\n- **对话**：表示同意、自信或接受的赞同词，如“yeah”、“yes”和“ok”，与两个市场的收益趋势均显著正相关（Model\
  \ 3 中 p 值 < 0.05）。\n\n除了 `MusicVector` 和 `SWML` 之外，三个控制变量 `month`、`year` 和 `search\
  \ trend` 对市场收益没有显示显著影响。\n\n### 表 1. 日本市场收益\n\n| 变量 | M1 | M2 | M3 |\n| :--- | :---\
