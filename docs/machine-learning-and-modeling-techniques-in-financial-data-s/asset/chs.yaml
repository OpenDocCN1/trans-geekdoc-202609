  \n## 第 14 章\n\n\n\n\n\n# 优化后的 LSTM 和 XGBoost 分类器在高频期货市场预测中的有效性评估\n\n陈浩军\n\n![Orcid\
  \ Imagehttps://orcid.org/0000-0001-9168-9234](https://orcid.org/0000-0001-9168-9234)]\n\
  \n中国，广州华丽职业学院\n\n### 摘要\n\n本研究比较了两种机器学习模型——长短期记忆网络（`LSTM`）和 `XGBoost`——在高频日内期货市场预测中的性能。通过使用来自中国五个主要期货市场的历史市场数据，本研究从预测准确性和回测收益方面对专用分类器进行了评估。结果显示，在原油和白银期货等波动市场中，`LSTM`\
  \ 的表现优于 `XGBoost`，具有更高的预测准确性和风险调整后收益。然而，`XGBoost` 在大豆和螺纹钢等较稳定的市场中表现出更好的稳定性和。回测结果表明，两种模型都能在实时、高频交易环境中生成高质量的交易信号。本研究为应用这些分类器进行短期期货市场预测提供了见解，并为中国期货市场的高频交易策略提供了重要启。\n\
  \n### 1. 引言\n\n在金融市场预测领域，`XGBoost` 和 `LSTM` 是两种最广泛使用的机器学习模型，由于它们能够捕捉金融数据中复杂的模式和依赖关系（例如：Chen\
  \ & Guestrin, 2016; Oukhouya, et al., 2024; Vuong, et al., 2022, Raudys & Goldstein,\
  \ 2022）。`XGBoost` 以其处理结构化数据和识别特征交互的效率而称，已成功应用于股票价格预测和资产价格预测等任务。同样，`LSTM` 凭借其建模时间依赖的能力，经常用于时间序列预测，特别是金融市场数据（Fischer\
  \ & Krauss, 2018）。然而，尽管这些模型已广泛用于价格预测，但很少有研究专门将它们用作分类器来预测极短期的市场价格方向，例如在高频交易环境中。文献中的这一空白凸显了评估这些模型以提高日益自动化的交易系统中实时市场预测预测的准确性和效率方面的潜力价值。\n\
  \n预测市场方向（即价格是上涨还是下跌）与预测绝对价格水平相比具有多个实际优势，特别是在节奏快且波动较大的市场中。通过关注方向，分类任务对市场噪声和波动更具稳健性，为实时交易决策提供了更可靠的依据（Rouf\
  \ et al, 2021）。这种方法非常符合高频交易（HFT）系统的需求，这些系统需要对快速市场变化即时产生买/卖信号。此外，市场方向预测允许设计更灵活、可扩展的交易策略，这些策略可以对短期价格波动做出反应，而不是依赖于挑战性极精确价格水平预测（O’hara,\
  \ 2015）。在这些系统中，对市场运动的准确分类是在日益自动化的环境中进行获利决策的基础。\n\n在本研究中，我们证明了利用中国期货市场的高频市场数据，使用\
  \ `XGBoost` 和 `LSTM` 分类器预测期货市场方向的有效性。中国期货市场以其快速增长、流动性不断增加而闻名。\n\n\n\n\n本研究的一项关键启示是，`LSTM`\
  \ 和 `XGBoost` 在未来的研究和实际应用中具有相互互补的潜力。虽然 `LSTM` 更擅长捕捉高频数据的序列模式，但 `XGBoost` 可以通过识别\
  \ `LSTM` 可能会忽略的重要市场信号来增强特征工程。将这两种模型的优势相结合可以对市场方向进行更准确、更稳健的预测，特别是在波动且复杂的市场环境中。\n\n\
  本文的结构安排如下：第 2 节对相关文献进行了全面综述，重点关注以往与高频日内期货市场预测和机器学习应用的相关研究。第 3 节概述了制度背景，描述了中国主要的期货市场及其特征。第\
  \ 4 节详细介绍了本研究使用的数据，包括从实时市场数据和技术指标中得出的特征。第 5 节阐述了方法，解释了 `LSTM` 和 `XGBoost` 分类器的开发、优化和评估。第\
  \ 6 节提供了描述性统计，突出了研究中使用的数据和特征的主要特性。第 7 节给出了结果，从预测准确性、盈利能力和回测性能方面对模型进行了对比分析。最后，第 8\
  \ 节通过讨论研究结果对高频交易策略的启示并对未来研究方向建议总结了全文。\n\n## 2. 文献综述\n\n本研究旨在通过对比极短期日内期货市场背景下两种最常用的机器学习（ML）模型——`LSTM`\
  \ 和 `XGBoost` 的性能，对现有的金融市场预测机器学习文献做出贡献。这项对比研究增加了探索机器学习技术在市场预测中日益增长的工作。\n\n`LSTM`\
  \ 网络因其建模长期依赖和捕捉序列模式的能力而闻名，在金融市场预测中地位突出（Fischer & Krauss, 2018）。例如，Bao et al. (2017)\
  \ 证明 `LSTM` 模型在预测股票趋势方面非常有效，特别是在捕捉短期价格变化的日内设置中。Guo et al. (2021) 通过在更复杂的环境中应用 `LSTM`\
  \ 网络进一步强化了这一观点，显示了其在处理日内市场波动数据时的稳健性。\n\n相比之下，作为广泛使用的梯度提升算法，`XGBoost` 在处理结构化数据和识别特征间的非线性关系方面表现出色（Chen\
  \ & Guestrin, 2016）。Patel et al. (2015) 证明 `XGBoost` 在利用结构化市场数据和捕捉多个市场特征间的相互作用进行股票预测方面优于其他模型。Hossain\
  \ & Kaur (2024) 对比了 `XGBoost` 和 `LSTM` 在股票价格预测中的性能，显示 `XGBoost` 在稳定性和效率方面表现，而 `LSTM`\
  \ 在复杂序列数据下表现更优。同样，Tian (2024) 研究了用于加密货币市场预测的 `XGBoost` 和 `LSTM`，发现 `XGBoost` 在均方误差（`MSE`）和稳定性方面优于\
  \ `LSTM`，而 `LSTM` 在极端异常值面前不稳定。\n\n对机器学习预测市场的日益兴趣导致了将技术指标整合到这些模型中以提高准确性的趋势。移动平均线、`RSI`、`MACD`\
  \ 和布林带等技术指标一直被应用于金融市场，根据历史数据捕捉趋势、动量和波动（Achelis, 2001）。尽管一些学者对其理论基础表示质疑，技术指标在算法和高频交易中仍是无价值的工具。最近的研究展示了将机器学习技术与技术指标相结合以改进短期市场预测的潜力。例如，Fischer\
  \ and Krauss (2018)强调了 `LSTM` 网络在建模价格模式与技术指标之间复杂非线性关系方面的有效性。其他研究，包括 Jose & Varshini\
  \ (2024)、Sharma & Verma (2024) 以及 Lee (2024) 的研究表明，将技术指标与机器学习模型相结合可以通过捕捉动量和波动等各种市场信号之间的相互作用来增强预测性。此外，Gezici\
  \ & Sefer (2024)、Zhang et al. (2022) 以及 Wang et al. (2022) 的近期研究证明了深度 Transformer\
  \ 网络在预测波动方面的前景。\n\n尽管将 `LSTM` 和 `XGBoost` 与技术指标结合具有明显优势，但大多数文献集中在长期预测或价格预报上，导致短期方向预测的研究存在空白。本研究通过提供对期货市场极短期方向预测（1\
  \ 至 15 分钟）的 `LSTM` 和 `XGBoost` 分类器的对比分析，填补了这一空白。这种方法通过引入机器学习分类器和技术指标扩展了以往的研究。本研究的创新性在于关注高频方向预测，这在文献中尚未得到充分探索。\n\
  \n本研究还对中国市场的机器学习文献做出了贡献。中国期货市场以高波动性、政策的影响和日益增长的流动性为特征，是测试机器学习模型的理想环境（Li et al.,\
  \ 2024）。如 He et al. (2023) 等研究表明，中国商品期货市场不是弱有效的，这使得基于机器学习的技术分析能够产生额外收益并支持高频预测。Wang\
  \ et al. (2023) 引入了一种用于原油期货市场事件波动预测的深度学习模型。Ke et al. (2023) 提出了一种 EEMD-Hurst-LSTM\
  \ 混合模型，改进了预测性能并为高频数据提供了更好的交易策略支持。\n\n\n\n然而，尽管市场对机器学习应用于期货市场的兴趣日益增加，但很少有研究关注高频交易中使用分类器进行方向性预测。唯一的一此类研究是\
  \ Deng 等人 (2022)，他们利用 `XGBoost`、`SMOTE` 和 `NSGA-II` 技术将 1 小时频率的期货市场预测转变为多分类问题。因此，这项研究通过探索这一未被充分开发的领域，并为使用机器学习分类器进行短期方向预测提供新见解，提供了新的贡献。\n\
  \n## 3. 机构背景\n\n本研究的原始数据集由来自中国市场最活跃的五个期货合约的高频交易数据组成：原油期货、黄金期货、大豆期货、白银期货和螺纹期货。这些合约在中国不同的期货交易所交易，每种合约都有独特的特征和流动性状况，这对于理解高频水平上的市场动态至关重要。\n\
  \n这五个期货市场的交易时间根据交易所和品种而异。原油期货、黄金期货、白银期货的交易时间为上午 9:00 到下午 3:00，期间上午 11:30 到下午 1:30\
  \ 有午休，夜盘交易时间为晚上 9:00 到凌晨 2:30。大豆期货和螺纹期货的日盘交易时间相似，但夜盘交易时间较短：晚上 9:00 到晚上 11:00。\n\n\
  原油期货在上海国际能源交易所 (`INE`) 交易，该交易所是上海期货交易所 (`SHFE`) 的组成部分。这些合约在全球能源市场中起着重要角色，为投资者提供了原油价格波动的机会。`INE`\
  \ 原油期货年均成交量超过 2 亿手，每手合约代表 1,000 桶原油。\n\n黄金期货也在 `SHFE` 交易，是投机或对冲金价波动的关键工具。作为中国市场最受欢迎的商品之一，黄金期货的年交易量超过了\
  \ 5 亿手。每手合约代表 1 公斤黄金，为零售和机构投资者提供了金价动态的敞口。\n\n大豆期货在大连商品交易所 (`DCE`) 上市，是中国主要的农产品商品，与国内动物饲料和食品制品的需求高度相关。`DCE`\
  \ 大豆期货的年均成交量约为 1.5 亿手。每手合约代表 10 公吨大豆，吸引了寻求对冲或投机该领域价格变化的农业领域投资者。\n\n白银期货是另一类在 `SHFE`\
  \ 交易的重要商品，专注于白银市场波动的投机和对冲。白银期货的年交易量经常超过 1 亿手，每手合约代表 15 公斤白银，为市场参与者提供了管理银价风险的手段。\n\
  \n螺纹期货在 `DCE` 交易，投资者和行业参与者利用其管理螺纹钢（一种关键建筑材料）价格相关的风险。鉴于是中国最大的钢铁消费国，螺纹期货的年均成交量约为 4\
  \ 亿手。每手合约代表 10 公吨螺纹钢，使其成为建筑制造业的关键工具。\n\n这些期货合约代表了中国市场上一些最重要的商品，每种合约都有独特的特征、成交量和合约规模。从这些合约衍生的高频交易数据为理解市场运动提供了宝贵的见解，并可开发预测模型和交易策略。Deng\
  \ 等人 (2022) 证明了使用机器学习分类器进行日内预测（1 小时频率）的潜力，特别是针对螺纹期货市场，凸显了机器学习在短期应用中的良好前景。\n\n##\
  \ 4. 数据与特征\n\n### 4.1 原始数据\n\n从期货交易所的数据 API 获取了高频历史市场数据，具有市场横面视角，记录从 2024 年 1 月\
  \ 11 日到 2024 年 9 月 5 日约每半秒记录一次。该数据集包含来自五个期货市场的共 55,621,318 个观测值。对于每个市场，原始数据使用前向填充（forward-fill）方法重采样为\
  \ 1 分钟、5 分钟和 15 分钟的间隔。\n\n### 4.2 特征\n\n本研究利用了多种特征，将其分为两大主要类：实时市场数据特征和基于技术指标的特征。这些特征总结在两个表中。表\
  \ 1 展示了由期货交易所提供的实时市场数据派生的特征，包括关键指标，如买卖差价、委托量、成交量和其他订单簿动态。另一方面表 2 侧重于基于技术指标的特征。\n\
  \n技术指标是对市场数据（如价格、成交量或持仓量）的数学计算，广泛用于技术分析以识别市场的趋势、动量和潜在的反转。常见示例包括移动平均趋敛指数 (`MACD`)、相对强度指数\
  \ (`RSI`) 和布林带。虽然这些指标通常缺乏理论支持，但它们为市场行为提供了可操作的见解，是交易者的实用工具。\n\n尽管学术界存在一些怀疑，技术指标仍然是机器学习\
  \ (`ML`) 模型的有效输入。机器学习模型的设计旨在灵活评估特征的预测价值（包括基于启发式的特征），并根据经验性能分配权重。`MACD` 和 `RSI` 等指标可以捕捉市场数据中传统方法难以表达的复杂非线性模式。此外，技术指标与理论依据的相结合可以增强机器学习模型的稳健性。机器学习的数据驱动性质允许纳入不受假设的特征类型，从而提高预测准确性。\n\
  \n#### 表 1 实时市场价格和量特征摘要\n\n| 市场数据 | 特征变量 | 描述 |\n| --- | --- | --- |\n| 持仓量 | `openInt_last`\
  \ | 最新观测到的持仓量 |\n| --- | --- | --- |\n| `oi_change` | 观测窗口内持仓量的变化。持仓量反映了未交合约数量，是衡量市场参与度和情绪的重要指标。\
  \ |\n| OHLC | `high_pct` | 与最高、最低、开盘价的百分比差异。这些特征有助于捕捉相对价格运动和市场部位 (Achelis, 2001)\
  \ |\n| `low_pct` | | |\n| `open_pct` | | |\n| `lastset_pct` | | |\n| 成交量 | `dvol`\
  \ | 观测窗口内成交量的量。先前的研究表明，分析价格运动与成交量之间的关系有助于判断趋势是否有强有市场参与的支持 (Tan & Ting 2015; Unger,\
  \ 2018; Li et al. 2021)。 |\n\n\n\n\n| 技术指标 | 相关特征 | 描述 |\n| :--- | :--- | :--- |\n\
  | 价格波动率 | `vola` | 价格波动率的衡量，计算为 60 个观测窗口内价格百分比变化平方的滚动平均值。波动率是市场风险和不确定性的基础指标 (Engle,\
  \ 1982)。 |\n| 价格变化 | `pct_chg` | 观察间隔内价格的百分比变化。该指标直接捕捉了价格动量，这是技术分析和交易策略中广泛使用的概念\
  \ (Dunham, 2012)。 |\n| 流动性 | `baspread` | 买卖价差是指买方愿意支付的最高价格（买入价）与卖方愿意接受的最低价格（卖出价）之间的差额。窄的价差通常意味着较高的流动性，而宽的价差则信号着低流动性或不确定性\
  \ (Hasbrouck, 1991)。 |\n| `baVol` | 买卖量反映了这些价格下的可用数量，提供了市场情绪和订单流不平衡的洞察。这些特征可以预测短期期货市场收益，因为它们捕捉了流动性和情绪动态变化\
  \ (Easley & O’Hara, 1987)。 |\n\n#### 表 2. 基于技术指标的特征总结\n\n| 技术指标 | 相关特征 | 描述 |\n\
  | :--- | :--- | :--- |\n| MACD (快=12,慢=26,信号=9) | MACD 线、MACD 信号线和 MACD 柱状图 | MACD\
  \ 系统包含三个组件——MACD 线、MACD 信号线和 MACD 柱状图。MACD 线与信号线之间的相对位置指示了潜在的交易信号，MACD 柱状图代表了动量的变化率：增长的柱状图表示动量增强，而缩小的柱状图则表明动量减弱。这些\
  \ MACD 组件的值被包含在特征集中。 |\n| RSI (长度=14) | RSI | RSI 是技术分析中常用的动量震荡器，用于衡量近期价格变化的速度和幅度。它的范围在\
  \ 0 到 100 之间，主要用于识别超买或超卖状态，以及价格趋势的潜在反转。 |\n| 随机指标 (长度=14) | `StoFASTK`, `StoFASTD`\
  \ | 随机指标是技术分析中常用的动量指标，用于将证券的收价与其特定时期内的价格范围进行比较。它有助于识别超买或超卖状态以及潜在的趋势反转。`StoFASTK`\
  \ 和 `StoFASTKed` 是随机指标的变体。技术指标的相对位置被认为是买卖信号和市场超卖/超买状态的指标。 |\n| ADX | ADX | ADX (平均方向指数)\
  \ 是一种衡量趋势强度的常用技术指标，无论其方向如何。ADX 范围在 0 到 100 之间，值越高表示趋势越强。它是基于另外两个组件计算的：正方向指数 (+DI)\
  \ 和负方向指数 (-DI)。 |\n| MFI (长度=14) | MFI | MFI (资金流量指数) 是一种结合了价格和成交量的动量指标，用于衡量买卖压力。它通常被称为“成交量加权\
  \ RSI”，因为它与相对强度指数 (RSI) 相似，但在计算中包含了成交量。 |\n| 移动平均线 | `DMA30`, `DMA60`, `DMA120`,\
  \ `DMA240` | 这些特征值的计算方法为当前价格与四个选定窗口（30、60、120 和 240 周期）的移动平均线之间的距离。到移动平均线的距离被认为是识别价格偏离趋势和潜在反转机会的关键衡量\
  \ (Achelis, 2001; Gu et al., 2020) | |除了 表 1 和 表 2 中出的特征外，以下特征是从原始数据中生成的：\n\n**滞后特征**\n\
  价格、未平仓量、成交量变化和波动率的滞后值生成了最多 20 个滞后，以将历史背景纳入数据集。这些滞后变量（包括价格百分比变化、交易量和波动率）对于捕捉时间依赖性和动量效应至关重要，正如\
  \ Lo 和 MacKinlay (1998) 所强调的那样。通过使用这些滞后特征，模型可以更好地考虑过去的市场状况并提高其预测能力。\n\n**间隔的周期编码**\n\
  `intervals` 变量代表交易时段的 15 分钟片段，使用周期变换进行编码。每个间隔映射到正弦和余弦分量（`interval_sin`, `interval_cos`），如下：\n\
  \n`Interval_sin = $sin\\left( \\frac{2\\pi*interval\\_ index}{N} \\right)$, `Interval_cos\
  \ = $cos\\left( \\frac{2\\pi*interval\\_ index}{N} \\right)$\n\n其中 `N` 是唯一间隔的总数，包括两次开盘竞价。这种转换允许模型识别出会会段开始的间隔（例如晚上\
  \ 8:45）与上一个交易日的最后一个间隔接近。日内时间效应在中国期货市场中非常显著，特定的间隔（如晚上 8:45 和早上 8:45 的开盘竞价）由于市场活动集中表现出独特的价格行为\
  \ (Cao, Hansch, and Wang, 2009)。\n\n#### 4.3 目标变量\n本研究侧重于预测价格波动方向的分类机器学习模型。目标变量是市场价格未来一步的移动方向，1\
  \ 表示正方向，0 表示负方向。为了避免类别不平衡，模型训练中剔除了目标变量为 0 的观测值。\n\n#### 4.4 标准化\n除了周期编码特征 `interval_sin`\
  \ 和 `interval_cos` 之外，所有数值特征都使用以下公式进行标准化：\n\n$z = \\frac{x - u}{\\sigma}$\n\n其中\
  \ `z` 是特征的标准化值，`x` 是原始值，`u` 是基于训练样本平均值估计的均值，$\\sigma$ 是基于训练样本的标准差。标准化确保了这些特征的均值为\
  \ 0，标准差为 1。这对于将所有特征带到可比范围至关重要，特别是当它们具有不同的单位和范围时（这在金融数据中很常见）。\n\n### 5. 方法论\n期货市场的动态和高频性质要求预测模型能够捕捉复杂的特征相互作用和序列时间模式。本研究采用了\
  \ XGBoost 和长短期记忆 (LSTM) 网络，因为这些算法在应对这些挑战方面互为补充。XGBoost 擅长在包含工程预测的结构化数据集中识别非线性关系，而\
  \ LSTM 则设计用于有效对交易数据中固有的时间依赖和序列模式。本节提供了当前研究背景下的分类算法概述，由于市场预测的性质，准确率是关键性能指标。\n\n####\
  \ 5.1 XGBoost 分类器\n\n\n\n\n\nXGBoost 分类器通过称为梯度提升（gradient boosting）的迭代过程提高预测准确性，在该过程中，顺序训练多棵决策树（Chen\
  \ & Guestrin, 2016）。最初，第一棵树产生原始分数，这些分数代表了模型对预测每个类别概率的信心（例如，市场上涨还是下跌）。这些原始分数本质上是对数几率（log-odds），通过\
  \ sigmoid 函数转换为概率。随着模型每添加一棵新树，它都会专注于修正之前树模型所产生的残差（或误差）。通过这种方式，模型迭代地调整并改进其预测，在每一步中精炼其准确性。每棵树的原始分数被合并，总和通过\
  \ sigmoid 函数产生最终的预测概率。这一过程一直持续，直到模型在预测准确性方面达到最佳性能，平衡偏差（bias）和方差（variance）之间的权衡。\n\
  \n准确率是本研究中 XGBoost 的关键性能指标，因为模型的目标是高精度预测正确的市场方向。为了优化这一准确率，XGBoost 最小化对数损失（log-loss），也称为二交叉熵，它衡量了预测概率与真实类别标签之间的差异。对数损失对那些自信但错误的预测进行更严厉的惩罚，鼓励模型产生校准良好的概率。通过迭代修正误差并针对准确率进行优化，XGBoost\
  \ 确保了最终模型具有稳健性，并在每次迭代中提高预测性能。\n\n## 5.2 LSTM 网络分类器\n\n在本研究中，长短期记忆（LSTM）网络被用作二分类任务的分类器。LSTM\
  \ 网络特别适用于序列数据，因为它们能够捕捉长程依赖关系，这对于基于时间序列数据预测市场方向至关重要。分类的模型架构由三个主要部分组成：\n\n* • LSTM\
  \ 层：LSTM 层处理序列输入数据，通过内存单元随时间保留信息。这些内存单元有助于捕获长程模式，这对于预测市场走势等时间序列问题中的准确分类至关重要。\n*\
  \ • Dropout 层（丢弃层）：包含一个 Dropout 层用于正则化，在训练期间随机激活神经元以防止过拟合，并提高模型对未见数据的泛化能力（Srivastava\
  \ et al., 2014）。\n* • 带有 Sigmoid 激活函数的全连接层：输出层是一个带有 sigmoid 激活函数的密集层，它将模型的原始输出映射到\
  \ 0 到 1 之间的概率值，代表样本属于特定类别的概率。\n\nLSTM 模型使用 `Adam` 优化器进行优化，优化器会在训练期间动态调整每个参数的学习率（Kingma\
  \ & Ba, 2015）。这有助于模型高效收敛，即使在梯度稀疏或存在噪声时也是如此。模型使用二交叉熵作为损失函数，衡量预测概率与真实类别标签之间的差异。该损失函数引导模型最小化预测误差，提高其二分类的准确性。模型的性能使用准确率得分（accuracy\
  \ score）进行评估，该得分跟踪训练和测试期间正确预测的比例。在此背景下，准确率至关重要，因为它反映了模型预测市场方向的能力，确保模型的预测与真实结果一致。通过迭代这些步骤——通过\
  \ `Adam` 更新梯度、通过二交叉熵最小化损失以及通过准确率跟踪性能——模型在每个 epoch 都会学习如何更有效地分类数据，最终优化了分类器在高频市场预测中的性能。\n\
  \n## 5.3 交叉验证与超参数调优\n\n本研究首先根据每日间隔，使用 80:20 划分将完整数据集分为训练期和测试期。从训练期中选择具有最高准确率的最佳模型，通过滚动时间序列划分验证（RTSV）方法进行超参数调优，随后在测试集上进行评估。表\
  \ 3 总结了本研究中的超参数调优配置。\n\n### 表 3. 超参数调优配置摘要\n\n| 超参数 | 调优范围 | 描述 |\n| :--- | :---\
  \ | :--- |\n| XGBoost | | |\n| `learning_rate` | `[0.001, 0.3]` | 在向损失函数最小值移动时每次迭代的步长；较小的值会导致更缓慢的更新并可能带来更好的泛化性，但需要更多的提升轮才能收敛。\
  \ |\n| `max_depth` | `[3, 9]` | 指定每棵决策树的最大深度，控制模型的复杂度；更深的树可以捕捉更复杂的模式，但可能导致过拟合，而较浅的树可能对数据欠拟合。\
  \ |\n| LSTM | | |\n| `units` | `[20, 300]` | 决定模型捕捉和存储信息的能力。更多的单元允许网络从数据中学习更复杂的模式和关系，但也增加了过拟合风险和计算成本。\
  \ |\n| `dropout_rate` | `[0.1, 0.9]` | 一种正则化技术，通过在训练期间随机将部分输入单元设置为零来防止过拟合 |\n| `epochs`\
  \ | `[5, 100]` | 定义模型训练期间遍历训练数据集完整次数。 |\n| `batch_size` | `[32, 64]` | 决定每次正向/反向传播中使用的训练样本数量。\
  \ |\n\n在训练期内，初始训练窗口设置为包含时间轴早期 80% 的数据。候选分类器使用该训练集进行训练，并根据训练窗口之后交易日的观测对其进行评估。随后，训练窗口和相应的测试交易日逐步移动，持续此过程直到达到数据期的结束。\n\
  \n## 5.4 优化后的分类器\n\nRTSV 方法为序列数据（如时间序列）定制。与随机洗牌并划分数据的传统交叉验证方法不同，滚动验证尊重观测的时间顺序，这对于时间间隔关系至关重要的金融数据集特别为适用。Bergmeir\
  \ 等人 (2018) 的研究强调了在时间序列数据交叉验证中保留时间顺序的重要性，指出随机洗牌会导致误导性的乐观性能估计。\n\n然而，RTSV 方法并非没有局限性。一个显著缺点是其计算密集性。每个折都需要在不断变训练集上重新训练模型，对于\
  \ XGBoost 和 LSTM 等复杂算法来说，这非常消耗资源。例如，LSTM 等模型涉及跨时间的迭代反向传播，多次训练会大幅增加计算负载。此外，不同折之间训练数据的重叠可能会导致冗余，因为模型可能会反复遇到相似的模式，从而限制从验证过程中获得见解的多样性。另一个局限性是早期折中验证集规模较小，可能无法代表全范围的时间模式，导致性能评估出现偏差。\n\
  \n\n\n\n尽管面临这些挑战，滚动验证（rolling validation）通过模拟使用历史数据预测未来事件的过程，对模型的预测性能提供了真实的评估。在本研究背景下，滚动验证确保了\
  \ `XGBoost` 和 `LSTM` 的超参数优化方式与期货市场数据的时间属性保持一致。这种方法平衡了对稳健评估的需求与高频金融建模固有的计算需求。通过遵循滚动验证的原则，本研究使其方法论与时间序列分析的最佳实践保持一致，这正如\
  \ Hyndman 和 Athanasopoulos (2021) 以及 Bergmeir 等人 (2018) 等著作中所强调的那样。\n\n## 6. 描述性统计\n\
  \n附录中提供了五个期货市场——原油、黄金、大豆、银和螺纹钢的关键实时市场数据特征的描述性统计表。该数据集提供了一个全面的视角，突出了每个期货合约独特的市场特征。这些差异反映了与每种商品相关的不同经济角色、交易动态和投资者行为。\n\
  \n原油期货在关键市场指标上表现出显著的波动性，特别是在成交量和未持量方面。值得注意的是，成交量显示出极端波动，反映了市场的高流动性，而未持量持续保持高位，表明市场参与度活跃。原油期货市场的波动性显而易见，不同时间频率下的波动率存在相当差异。在\
  \ 1 分钟间隔内，波动率相对较低，但随着时间跨度的增加而稳步上升，表明随着时间推移，市场波动和风险增大。基差（表示合约之间的价差）维持在狭窄范围内，但偶尔会出现峰值，说明了市场不确定性加剧或流动性变化的时期。\n\
  \n黄金期货虽然同样具有波动性，但在未持量方面比原油表现出更多的稳定性。黄金期货市场的特点是价格范围略低且成交量相对更一致，剧烈波动较少。基差通常很窄，但偶尔会变宽，这可能反映了市场情绪或其他外部因素的变化。黄金期货在所有时间间隔内的波动性保持在相对低位，表明市场环境更为稳定。与原油不同，黄金期货倾向于具有较小的平均百分比变化，标志着平均价格波动不剧烈，但在重大新闻事件影响投资者情绪时，偶尔会出现剧烈偏离。\n\
  \n大豆期货以其高成交量波动性脱颖而出，极端的成交量凸显了市场对供需冲击的敏感性，这在农产品中很常见。大豆期货还表现出高水平的未持量，表明市场成熟且投资者活动频繁。基差异常宽**，在不同频率下保持在\
  \ 1.00 的恒定值，但出现了明显的峰值，暗示了供需动态的变化。与其他市场相比，其波动性中等，1 分钟间隔内价格波动较小，但在较长时间段内变得更加明显，表明价格发生了更实质性的移动。与其他商品相比，该市场平均价格较高且价格范围更广，反映了农产品独特的动态，天气和季节性会对其产生深远影响。\n\
  \n白银期货显示出较高程度的波动，特别是在 1 分钟频率下，价格和成交量均出现了明显的峰值。白银期货的平均价格显著高于黄金和大豆期货，表明其作为金属市场中更具溢价商品的地位。白银的未持量与大豆期货相当，高水平表明市场深度且活跃。基差比黄金略宽，反映了合约价格更大的波动。白银期货市场的波动性与黄金和大豆市场相比均更为显著，其数值在较长的时间间隔内大幅增加，强调了通常与投资者行为和地缘政治因素相关的内在风险和市场动态。此外，白银期货显示出最大的百分比变化，表现出更剧烈的价格波动，这是对宏观趋势敏感的贵金属市场的特征。\n\
  \n螺纹钢期货主要由建筑业驱动，显示出独特的特征，与其他市场相比波动性较低。螺纹钢期货的平均价格与其他商品相比处于中等水平，波动不那么极端。虽然成交量巨大，但未达到原油或大豆市场看到的峰值，但仍然反映了活跃的交易活动。螺纹钢期货的未持量也较高，表明市场稳定且成熟，基差通常接近\
  \ 1.00，显示出缺乏剧烈的价格变化或突然的市场转变。波动性虽然低于银和原油，但在不同时间频率下显示出中等变化，这对于与工业部门相关的市场是典型的。螺纹钢期货的百分比变化通常小于其他市场，表明市场平均价格波动不剧烈。\n\
  \n总体而言，虽然五个市场都表现出高波动和波动的时期，但每个市场都有其独特特征。原油和白银期货对全球经济和地缘政治事件更敏感，通常表现出更高的波动和更大的价格移动。另一方面，黄金大豆期货倾向于更具稳定性，其中黄金反映了在不确定时期传统的“避港”角色。大豆作为一种农产品，受季节和气候因素影响。螺纹钢期货与建筑部门挂钩，波动性较低且价格变化较小，表明了工业商品市场更稳定的性质。\n\
  \n## 7. 结果与性能比较\n\n### 7.1 预测准确率\n\n表 4 总结了 `LSTM` 和 `XGBoost` 分类器（交叉验证后优化）在五个期货市场中的性能，预测针对不同的预测跨度：1\
  \ 分钟、5 分钟和 15 分钟。\n\n#### 表 4 优化后的 LSTM 和 XGBoost 分类器准确率摘要\n\n| | LSTM 分类器 | XGBoost\
  \ 分类器 |\n| --- | --- | --- |\n| | 1 分钟后预测 | | |\n| 期货市场 | 训练准确率 | 测试准确率 | 训练准确率\
  \ | 测试准确率 |\n| 原油期货 | 0.82 | 0.71 | 0.64 | 0.6 |\n| 黄金期货 | 0.76 | 0.69 | 0.73 |\
  \ 0.66 |\n| 白银期货 | 0.72 | 0.65 | 0.57 | 0.52 |\n| 大豆期货 | 0.77 | 0.72 | 0.71 | 0.66\
  \ |\n| 螺纹钢期货 | 0.77 | 0.74 | 0.66 | 0.63 |\n| | 5 分钟后预测 | | | |\n| 期货市场 | 训练准确率\
  \ | 测试准确率 | 训练准确率 | 测试准确率 |\n| 原油期货 | 0.79 | 0.7 | 0.66 | 0.6 |\n| 黄金期货 | 0.76 |\
  \ 0.67 | 0.72 | 0.66 |\n| 白银期货 | 0.73 | 0.67 | 0.59 | 0.56 |\n| 大豆期货 | 0.81 | 0.73\
  \ | 0.73 | 0.65 |\n| 螺纹钢期货 | 0.79 | 0.74 | 0.68 | 0.62 |\n| | 15 分钟后预测 | | | |\n\
  | 期货市场 | 训练准确率 | 测试准确率 | 训练准确率 | 测试准确率 |\n| 原油期货 | 0.8 | 0.71 | 0.69 | 0.61 |\n\
  | 黄金期货 | 0.74 | 0.68 | 0.74 | 0.65 |\n\n\n\n\n\n| 白银期货 | 0.76 | 0.69 | 0.61 | 0.54\
  \ |\n| 大豆期货 | 0.82 | 0.78 | 0.77 | 0.63 |\n| 钢筋期货 | 0.78 | 0.72 | 0.71 | 0.65 |\n\
  | 平均值 | 0.77 | 0.71 | 0.68 | 0.62 |\n\n结果显示，`LSTM` 在所有市场和预测跨期内始终优于 `XGBoost`，特别是在较短的时间跨度内。例如，在\
  \ 1 分钟后预测中，`LSTM` 的测试准确率从`白银期货`的 `0.65` 到`钢筋期货`的 `0.74` 不等，而 `XGBoost` 的测试准确率范围在\
  \ `0.52`（白银期货）到 `0.66`（大豆期货）之间。这一趋势在其他跨期中同样适用，`LSTM` 总体上保持较高的准确率，特别是在`原油期货`和`白银期货`等波动较大的市场中，这些市场中\
  \ `XGBoost` 难以获得强劲表现。两个模型之间的性能差距在 15 分钟后预测中最为明显，此时 `LSTM` 在所有市场中均表现出更好的泛化能力，而 `XGBoost`\
  \ 的性能则下降，尤其是在波动性较高的市场中。\n\n几个因素可以解释这些性能差异。`LSTM` 的核心优势之一是其处理序列数据和捕获长期依赖的能力。与 `XGBoost`\
  \ 不同（后者独立地处理每个观测值，且缺乏对时间关系的建模内在机制），而 `LSTM` 专门为模拟时间序列数据中固有的时间动态而设计，例如高频金融市场中的数据。`LSTM`\
  \ 捕获序列依赖的能力使其能够更好地随时间变化的市场波动和波动模式，这对于短期预测的准确至关重要。此外，两个模型使用的特征（包括未平持仓量 `Open Interest`、成交量\
  \ `Volume`、价格波动率 `Price Volatility` 和流动性 `Liquidity`）反映了本质上具有时间依赖性的市场情绪和价格波动。`LSTM`\
  \ 捕获这些时间依赖特征之间相互作用的能力（例如时间间隔的周期编码）有助于模拟与特定时间（如开盘价和收盘价）相关的市场行为。相比之下，虽然 `XGBoost`\
  \ 处理相同的特征，但它缺乏对这些时间依赖关系的自然机制，这限制了它随着预测跨期延伸的有效性。\n\n`LSTM` 优异性能的另一个原因在于其处理波动性和流动性变化的能力，这在高频金融数据中很常见。如买卖价差\
  \ `bid-ask spread` 和市场深度 `market depth` 等特征反映了短期市场状况，`LSTM` 能够更好地学习流动性或波动性的突然变化如何预示未来的价格走势。这种能力在`原油期货`等市场中尤为重要，价格波动可能会受到微结构变化（如流动性转变）的影响。相比之下，`XGBoost`\
  \ 作为基于树的模型，对这些快速市场变化的可能不敏感，因此难以有效捕捉底层动态，特别是当这些动态变化迅速时。\n\n观察到的训练准确率差异表明，`LSTM` 可能对训练数据存在过拟合，特别是在`原油期货`等频繁发生价格和流动性快速波动的市场中。然而，尽管存在过拟合，`LSTM`\
  \ 仍然能够很好地泛化到未知数据，其持续较高的测试准确率证明了这一点。这表明 `LSTM` 擅于利用时间关系和模式，有助于其更好地泛化到新数据。另一方面，`XGBoost`\
  \ 虽然能够建模复杂的相互作用，但在高波动性面前显得力不从心。\n\n结论是，结果表明 `LSTM` 更适用于高频金融任务。它捕获序列依赖和时间特征的能力相比\
  \ `XGBoost` 具有明显优势，特别是在波动较大的市场中。两个模型之间的性能差距在 15 分钟后预测中最为明显，此时 `LSTM` 在所有市场中均表现出更好的泛化能力，而\
  \ `XGBoost` 的性能则下降，尤其是在波动性较高的市场中。\n\n\n\n\n\n| 银银期货 | 3079 | 0.019 | 0.233 | 58.501\
