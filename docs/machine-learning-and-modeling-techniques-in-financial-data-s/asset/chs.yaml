  ### 关键术语定义\n\n低延迟网络：低延迟网络能够在交易平台与交易所之间快速传输数据，减少数据通信中的延迟（延迟）。通过高速光纤电缆、微波传输和直接市场访问\
  \ (`DMA`)，这些网络确保交易算法能够在毫秒内对市场变化做出反应，为高频公司提供竞争优势。\n\n高级算法交易软件：此类软件使用复杂的数学模型和统计技术来分析市场数据、识别交易机会并自动执行交易。MetaTrader\
  \ 和 NinjaTrader 等平台提供回测、实时分析和风险管理工具，允许交易者完善策略并优化性能。\n\n\n\n\n\n高性能计算 (HPC)：具有强大处理器、大容量内存和并行计算技术的\
  \ HPC 系统，对于处理高频交易（HFT）所需的海量数据至关重要。这些系统能够实时运行复杂的模型和模拟，从而增强对盈利交易机会的识别，并实现有效的风险管理。\n\
  \n托管服务 (Co-Location Services)：托管服务将交易服务器放置在交易所数据中心附近以降低延迟。这种近距离性使得高频交易公司能够更快地访问市场数据并更快地执行交易，与竞争对手相比具有显著的速度和可靠性优势。\n\
  \n机器学习与人工智能 (AI)：机器学习和 AI 增强了高频交易中的决策和预测能力。算法分析大型数据集以识别模式和趋势，使高频系统能够适应变化的市场状况。AI\
  \ 驱动的工具（如自然语言处理 (NLP））可以分析新闻和社交媒体情绪，为市场情绪和潜在价格走势提供洞察。\n\nFPGA 和 ASIC 技术：现场可编程门阵列\
  \ (FPGA) 和应用专用集成电路 (ASIC) 是用于实现超低延迟和高吞吐量的专用硬件组件。FPGA 可以针对特定任务进行编程且延迟极低，而 ASIC 是为高频交易应用定制的芯片，提供更卓越的性能和效率。\n\
  \n实时市场数据馈：访问实时市场数据对于做出明智的交易决策至关重要。市场数据馈提供价格、成交量、订单簿深度和其他指标的更新。彭博（Bloomberg）和汤森路透（Thomson\
  \ Reuters）等供应商以及交易所直接馈，确保了准确及时的数据，以便快速做出反应。\n\n智能订单路由系统：这些系统通过分析市场状况、订单簿深度和交易量，优化跨多个交易场所的交易执行。通过将订单动态路由到有利的市场，智能订单路由系统有助于获得更优的价格、降低交易成本，并在技术问题出现期间确保交易持续进行。\n\
  \n合规与监管系统：合规系统确保遵守市场法规和报告要求，帮助高频交易公司避免法律和财务处罚。对交易活动进行实时监控可以降低过度市场敞口、算法错误和违反监管规定等风险，确保高频交易运营的稳定和合法。\n\
  \n## 第 5 章\n\n# 机器人交易员与 PPO：\n\n## 使用深度强化学习推进网格交易\n\n陈浩军 (Haojun Chen)\n\n![Orcid\
  \ Imagehttps://orcid.org/0000-0001-9168-9234](https://orcid.org/0000-0001-9168-9234)\n\
  \n中国，广州华力学院\n\n### 摘要\n\n本文探讨了近端策略优化（PPO）这一深度强化学习（DRL）技术在算法交易网格交易中的应用。利用白银期货市场的历史频价格数据，我们证明了盯市会计（mark-to-market\
  \ accounting）如何将交易盈亏平滑地转换为 DRL 代理的奖励。本研究介绍了初始化、训练和更新 PPO 模型的详细方法，重点关注网格交易背景下的环境搭建和代理训练过程。我们的结果表明，尽管存在市场噪声，PPO\
  \ 模型能够有效自适应其交易策略，取得了理想的性能，并展示了盈利交易的巨大潜力。本文为强化学习与金融交叉领域日益增长的研究做出了贡献，强调了利用高频数据进行金融市场实时决策的重要性。\n\
  \n### 1. 引言\n\n2015 年，OpenAI 的 AlphaGo 通过击败世界围棋冠军李世石而登上全球头条，展示了深度强化学习（DRL）的巨大潜力。AlphaGo\
  \ 的成功不仅归于其先进的算法，还源于它从试错中学习的能力，能够在先验知识很少的动态不确定环境中做出决策。这标志着强化学习（RL）的一个水岭时刻，凸显了它解决传统方法（依赖固定规则和数据）无法解决的问题的能力。DRL\
  \ 的核心是代理通过与环境交互来学习决策、接收反馈（奖励或惩罚）并相应调整其行为 (Sutton & Barto, 2018)。这种试错学习过程使代理能够处理复杂的序列决策问题，使得\
  \ DRL 特别适用于金融市场等动态环境。\n\nDRL 最显著的进展之一是近端策略优化（PPO），这是由 OpenAI 开发的一种方法，由于其在计算效率和强大性能之间取得了平衡，迅速成为最流行的强化学习算法之一\
  \ (Schulman et al., 2017)。PPO 是一种策略梯度方法，通过避免大型且不稳定的更新来稳定训练，使其成为现实应用（包括自动化交易）的实用选择。与依赖标记数据的传统机器学习模型不同，PPO\
  \ 允许代理根据市场反馈持续学习并实时调整策略。这种适应变化市场状况的能力使 PPO 成为增强交易策略的理想候选者，特别是在节奏快且波动剧烈的金融市场中。\n\n\
  网格交易是算法交易中一种成熟但往往未被充分利用的策略，涉及在设定价格周围的定期间隔内下入买卖单。其目标是在价格在定义范围内波动时执行交易，利用市场波动 (Douglas\
  \ et al. 2011)。然而，传统网格交易方法的静态性——即如网格大小和仓位规模等交易参数是预定义且固定的——使得在面对动态市场状况时优化性能具有挑战性。这正是\
  \ DRL（特别是 PPO）提供显著优势之处。通过持续学习市场行为，PPO 可以动态调整关键交易参数（如网格大小），以实时优化能力。\n\n在算法交易中使用 DRL\
  \ 方法的一个关键优势是，它允许执从业人员根据实际经验开发模型，而不仅仅依赖于封装在概念和数学框架中的预定义目标和约束（例如参见 Taranto & Khan\
  \ 2021）。传统方法通常要求建模者将复杂的市场现实简化为僵化的结构，这会导致真实世界的本质受到损害。相比之下，强化学习允许更自然、更自适应的学习过程，捕捉了金融市场固有的复杂性和不确定性。这种方法为交易者提供了一种更直观、响应迅速且数据驱动的策略，该策略可以随市场演变，而不是受到固定规则或假设的限制。\n\
  \n\n\n\n本文的主要目标是探索 PPO 在网格交易中的应用，为算法交易提供一种更具适应性和灵活性的方法。我们首先介绍了网格交易、深度强化学习（DRL）和\
  \ PPO 的基础知识，并强调了它们与金融应用的相关性。随后在第 2 节中，我们回顾了目前的文献。在第 3 节中，我们展示了在强化学习背景下初始化、训练和更新\
  \ PPO 模型的方法，以及用于研究实际方面的市场数据。第 4 节讨论了训练和测试结果。最后，在第 5 节中，我们探讨了研究的局限性并为未来的研究提出了建议方向。\n\
  \n通过本文，我们希望为 DRL 与金融领域日益增长的知识体系做出贡献，证明 PPO 在算法交易中的应用。我们通过使用白银期货的逐笔高频价格数据来探索这一实际方面，其中市市会计法可以将交易盈亏平滑地转换为\
  \ DRL 智能体的奖励。我们的结果表明，尽管存在市场噪声，PPO 模型能够有效学学习并适应其交易策略，显示出盈利交易的巨大潜力，并增强了随时间推移适应不断变化的市场状况的能力。\n\
  \n### 2. 文献回顾\n\n### 2.1 金融市场的短期价格行为\n\n根据有效市场假说（EMH），所有可用信息都会迅速反映在资产价格中，使得价格不太可能以系统性的方式呈现\
  \ (Fama, 1970)）。相反，股价倾向于围绕反映底层资产基本价值的均值波动 (Reboredo et al., 2013)）。这种随机性可以归因于多种因素，每种因素都导致了金融市场中观察到的波动性和短期价格波动\
  \ (Fama, 1995)。\n\n导致这些波动的因素因素之一是市场噪声，它是与资产底层经济基本面没有直接联系的随机或异常价格波动 (Gao & Ladley,\
  \ 2022)。市场噪声可以源于多种来源，包括短期投资者行为、传言，甚至是更广泛的市场情绪，这些情绪会影响买卖决策，但不会反映公司价值的任何重大变化 (Brogaard\
  \ et al., 2022)。例如，市场参与者对新闻或事件的反应可能会导致短期价格变化，即使这些运动并没有反映底层资产基本面前景的长期转变。\n\n投资者情绪是另一个驱动短期价格波动的关键因素\
  \ (Wang et al., 2021)。投资者情绪往往受到心理偏差的影响，例如过度反应、羊群效应或恐惧与贪婪 (Yan, 2023)。这些情绪驱动因素会导致投资者在短期内高估或低估股票\
  \ (Gupta et al., 2025)。例如，在市场乐观或悲观时期，即使基本面没有发生重大变化，价格也会大幅上涨或下跌。\n\n流动性在短期波动中也起着作用\
  \ (Amihud & Mendelson, 1986)。在流动性不佳的市场中，小交易会对价格产生巨大影响，因为买家或卖家的缺乏会导致价格的突然波动 (Getmansky\
  \ et al., 2015)。流动性受多种因素影响，包括市场状况、交易量或机构投资者的行为 (Karolyi et al., 2012)。\n\n最后，随机订单流——买和卖订单不可预测的到达——会导致价格波动\
  \ (Gerig, 2008)。即使在有效市场中，订单流本质上也是随机的，大订单或买卖活动之间的平衡可能会导致价格以难以预测的方式移动 (Cont et al.,\
  \ 2014)。这些波动通常是暂时的，一旦市场适应了新信息或交易动态，它们可能会恢复。例如，在高频交易的背景下，订单的快速执行会加剧短期的价格波动 (Virgilio,\
  \ 2022)。总之，金融市场的短期价格波动是由多种因素共同驱动的，包括市场噪声、投资者情绪、流动性问题和随机订单流。这些因素会导致价格发生不可预测的移动并引发波动，即使底层资产的价值没有发生基本变化。这种随机性是金融市场的一个内在特征。\n\
  \n### 2.2 算法交易\n\n算法交易涉及使用自动化系统执行交易策略，它改变了现代金融市场（参见，例如 Kim, 2010; Lenglet, 2011)）。通过依靠算法做出高速、数据驱动的决策，算法交易在速度、准确性以及处理大量数据方面具有优势\
  \ (MacKenzie 2021)。这些系统已从股票到外汇的所有金融市场中无处不在，被机构投资者、对冲基金甚至个人交易者所使用。\n\n\n\n早期算法主要侧重于优化订单执行和最小化交易成本，这被称为智能订单路由(Hendershott\
  \ et al., 2011)）。这些算法通过识别不同交易所之间的最佳价格并据此执行交易来运行，从而减少滑点并提高流动性。随着金融市场变得日益复杂以及交易量的增加，算法交易演变出了包含了更复杂的策略。其中一种策略是做市，即算法被设定为在特定的价格间隔内买卖资产，在为市场提供流动性的同时，通过买卖差差获利(Li\
  \ et al., 2014)）。这种策略常用于高频交易 (HFT)，受益于算法高速执行交易并实时响应市场状况的能力。近年来，算法交易的角色已扩展到更复杂的策略，例如统计套利和趋势跟踪，这些策略使用定量模型和历史数据来预测价格走势并识别获利机会(Menkveld,\
  \ 2013)。\n\n算法交易领域一个备受关注的重要方向是利用机器学习来增强算法决策(Hansen 2020)。机器学习模型，特别是监督学习和强化学习，因其能够从历史数据中学习并根据新信息调整策略而变得流行。例如，强化学习已被应用于优化交易策略，通过对盈利交易的算法给予奖励，并对亏损交易进行惩罚，从而实现持续的适应和改进(Moody\
  \ et al., 1998)。这导致了自学习系统的开发，这些系统能够在极少人工干预的情况下应对高度波动的市场。\n\n总之，算法交易彻底改变了金融市场的格局，更快速、更高效的交易策略成为可能。从基础订单执行系统到基于机器学习的先进策略，算法交易在不断进化。随着技术的进步和监管框架的收紧，算法交易的未来可能会涉及更复杂的风险管理和收益优化技术。\n\
  \n### 2.3 网格交易\n\n网格交易是一种广泛使用的算法交易策略，通过在预定义的价格间隔或“网格”水平上设置买卖订单从市场波动中获利(Guilbaud,\
  \ 2013)。这种方法的简单性允许交易者无需预测市场方向，这对于波动或横盘运行的市场特别具有吸引力。网格交易的优势之一是能够在不同价格水平上执行多次交易来减少损失的影响，从而在保持盈利能力的同时降低风险(Rundo\
  \ et al., 2019)。然而，高效管理这些交易（特别是在高频交易 HFT 环境下）可能是相当复杂的，因为它需要精确的参数，如距离和头寸(Rundo et\
  \ al., 2019)。\n\n最近的进展通过整合机器学习显著提升了网格交易的灵活性和性能。例如，Yeh et al. (2023 提出了一种灵活模型，利用`全连接神经网络`\
  \ (`FNN`) 和`长短期记忆网络` (`LSTM`) 来进行动态调整。同样，Rundo et al. (2019 引入了`网格交易系统` (`GTS`)，这是一种自动高频系统。尽管取得了这些进展，但人工智能（特别是强化学习\
  \ `RL`）在网格交易中的应用仍然有限。在其他领域，深度强化学习已经产生了重大影响(Moody et al., 1998); Mille et al., 2021);\
  \ Briola et al., 2021); Zhang et al., 2022a); Zhang et al., 2022b); Sun & Wang,\
  \ 2023); Kwon & Lee, 2024); Abdolmaleki et al., 2018) 强调了机器学习在与网格交易结合时如何显著减少回撤。因此，本研究旨在扩大深度强化学习在网格交易中的应用。\n\
  \n### 2.4 深度强化学习与 PPO\n\n深度强化学习 (DRL) 通过试错学习并不断改进决策的能力，在算法交易领域受到了广泛关注(Mnih et al.,\
  \ 2015)。DRL 的核心是智能体与其环境的交互，智能体根据状态观测采取行动并获得奖励或惩罚。这种框架使得 DRL 特别适用于动态随机环境，例如金融市场，最优决策需要适应不断变化的情况(Liang\
  \ et al., 2018)。\n\nDRL 中应用最大的算法之一是近端策略优化 (`PPO`)，它由 Schulman et al. (2017) 引入。PPO\
  \ 是一种策略梯度方法，通过解决与传统策略优化相关的问题来提高强化学习的稳定性和性能。与早期的方法如 `REINFORCE` 算法(Williams, 1992)（其更新方差过大的问题）不同，PPO\
  \ 确保策略更新保持在与旧策略的一定范围内。这种约束对于避免可能导致学习过程不稳定的过大更新至关重要。PPO 因其在简单性和性能之间的平衡，在各个领域变得广受欢迎，为在复杂环境中训练深度神经网络提供了一种可靠的方法(Abdolmaleki\
  \ et al., 2018)。\n\n\n\n\n在金融市场背景下，`PPO` 已用于开发交易策略，智能体学习根据市场条件做出买入、卖出或持有决策（Yang\
  \ et al., 2020）。通过历史价格数据，智能体经过训练以最大化其累积奖励，这可能对应于利润、风险调整后收益或其他交易目标。例如，Chiumera (2022)\
  \ 将 `PPO` 应用于股票交易环境，并证明在盈利能力和风险管理方面，它优于传统的机器学习模型（如决策树和支持向量机）。这项研究凸显了 `PPO` 处理金融数据固有的复杂性和不确定性的能力，与更传统的方法相比，它产生了更优的结果。\n\
  \n`PPO` 相比其他强化学习算法（如 `Deep Q-Learning` (Mnih et al., 2013) 或 `A3C` (Mnih et al.,\
  \ 2016)）的关键优势之一是它能够同时从连续和离散动作空间学习。这使得 `PPO` 特别适用于交易应用，因为智能体可能需要对连续的资产价格或时间间隔做出决策\
  \ (Suri et al., 2021; Han et al., 2023)）。此外，`PPO` 使用裁剪目标函数（clipped objective functions）确保了策略更新更加受控，有助于防止模型对历史数据产生过拟合，并提高其对未见市场状况的泛化能力\
  \ (Schulman et al., 2017。\n\n尽管 `PPO` 在金融应用中展现了巨大的前景，但目前的研究在探索其全部潜力方面仍然较为有限，特别是在高频交易（HFT）环境中。高频交易中的高计算需求和快速决策节奏为包括\
  \ `PPO` 在内的强化学习模型带来了严峻挑战（Del Rio 2024）。在这种背景下，实时决策至关重要，策略不仅必须适应短期市场波动，还必须适应其他市场参与者的行为\
  \ (Zheng et al., 2023。\n\n综而言，`DRL` 和 `PPO` 在算法交易策略的开发中显示出巨大潜力，为金融市场应用中的传统方法提供了极具前景的替代方案。`PPO`\
  \ 特别证明是复杂动态环境（如股票交易和投资组合管理）学习优化策略的有效工具。虽然 `PPO` 在高频交易中的应用仍是一个活跃的研究领域，但它在现实场景中的适应性和性能已成为旨在增强自动化交易系统的研究人员关注的重点。\n\
  \n### 3. 数据与方法\n\n强化学习（RL）过程由几个相互作用的组件组成 (Sutton & Barto 2018)。这些元素是建立强化学习的基础：\n\
  \n- **环境 (Environment)**：环境是智能体交互的外部系统。它定义了问题的规则、条件和动态。在网格交易环境中，环境就是金融市场。\n- **智能体\
  \ (Agent)**：智能体是决策者。它从环境中学习，选择动作并尝试优化行为。\n- **状态空间 (State Space)**：状态空间代表智能体在任何一点可以观察到的所有状态。状态封装了智能体做出决策所需的所有信息。在网格交易环境中，状态可能包括历史价格、成交量和智能体的位置。\n\
  - **动作空间 (Action Space)**：动作空间定义了智能体在给定时间内可以采取的动作集。在网格交易中，动作空间可以代表网格大小配置或交易决策（例如买、卖、持）。\n\
  - **奖励函数 (Reward Function)**：奖励函数是强化学习的关键组件，因为它定义了智能体在采取动作后收到的反馈。奖励是一个标量值，表示智能体的动作在实现目标方面的优坏。\n\
  \n#### 3.1 网格训练环境与智能体设置\n\n必须清晰定义 AI 网格交易员与之交互的环境和数据，以促进强化学习（RL）过程。尽管网格交易可以应用于各种金融市场，但期货市场特别适合这项任务。在期货交易中，标准合约交易的利润可以很容易地映射到输入强化学习智能体的奖励函数中。为了本章的实际演示，我们将使用真实数据模拟期货交易员所面临的环境。\n\
  \n### 3.1.1 时间步长 (Time Step)\n\n强化学习项目的关键设置之一（特别是在网格交易背景下）是`Time Step`（时间步长），它定义了智能体策略更新之间间隔。对于人类投资者来说，这种决策频率受其注意力跨度和信息处理能力的限制，他们只能以有限的频率对市场信号做出反应。相比之下，机器人交易员可以以微秒级的决策间隔运行。然而，将决策频率设置得过小（例如一秒）会导致模型过拟合，特别是在短期波动无法反映真实趋势的噪声市场中（Peng\
  \ & Souza 2024）。为了平衡这些考虑，此训练环境中的决策频率最初设定为 10 分钟。这个间隔提供了一个合理的折中，允许智能体适应市场变化，同时减轻了由于对噪声过度敏感导致的过拟合风险。\n\
  \n### 3.1.2 回合 (Episode)\n\n\n\n\n\n当前项目训练环境的另一个重要设置是 `Episode`（回合），它代表遍历训练数据集的一个完整循环。一个\
  \ `episode` 在代理初始化其环境时开始，并在代理达到预定义条件时结束，例如完成训练数据的完整循环或达到最大步数。对于人类交易员来说，一个“回合”可以被看作是一个交易日，他们根据截至当时的可用信息做出决策。对于机器人交易员，一个\
  \ `episode` 对应于代理在整个训练数据集与环境交互的能力，随着时间的推移优化其策略。在项目中，每个 `Episode` 被定义为遍历整个训练数据集的一个完整循环。在每个\
  \ `episode` 之后，代理的交易环境将重置，并开始一个新的训练会话，允许代理根据上一个 `episode` 的结果完善其策略。这种结构使代理能够从整个\
  \ `episode` 内的事件序列及其动作中学习，并在多个 `episodes` 中迭代以获得更优的交易策略。\n\n### 3.1.3 网格交易交易员的动作空间\n\
  \n我们训练项目中网格交易代理动作空间的设置将对结果产生深远影响。该设置必须反映真实人类交易员决策的现实。对于典型的网格交易策略，网格大小（指示对冲头寸之间的价差）将决定代理在下一个时间步（10\
  \ 分钟交易）的交易收益（奖励）。当市场价格波动（而非单向趋势）时，大（小）的网格大小将导致较少（更多）的交易和更高的回报。对于日内交易员，尤其是期货交易员，累计头位（无论是多头还是空头）将导致市场价格风险敞口的增加。在实践中，某些交易员对结算未平头寸有预定义规则，例如在日末或周末结算。对于我们的强化学习项目，我们将头位管理决策整合到代理的动作空间中，使代理可以选择清空所有未平头寸并在下一个时间步停止交易，而不是为下一个时间步选择网格大小。我们还将允许代理的网格大小限制在\
  \ 20 个刻。当在强化学习中选择较大的动作空间时，问题的复杂性会显著增加，因为代理在每个决策步骤必须评估更多的潜在动作。这可能导致学习变慢并需要更多的计算资源，因为代理需要在大量的可能性中进行探索和优化，通常会导致更长的训练时间和较低的样本效率(Mnih\
  \ et al. 2015)。\n\n### 3.1.4 网格交易代理与奖励机制\n\n对于期货市场中的交易员，在每日盯市（mark-to-market）安排下，奖励可以在每次价格变化后计算如下：\n\
  \n$$Profit~\\\\left( or~Loss \\\\right)~ = ~contract\\\\\\_ value \\times position\
  \ \\times \\frac{end\\\\\\_ price~ - ~start\\\\\\_ price}{tick\\\\\\_ size}$$  \n\
  \n(1)\n\n其中：\n\n* `tick_size` 指最小的价格变动\n* `contract_value` 是单个刻度变动的货币价值\n* `position`\
  \ 是代理在任何给定时刻持有的合约数量\n* `end_price` 和 `start_price` 分别是该时期结束和开始的价格\n\n`tick_size`、`contract_value`、`position`、`end_price`\
  \ 和 `start_price` 用于计算代理的奖励。代理利用此奖励随时间推移更新其策略。\n\n### 3.1.5 头位管理\n\n需要注意的是，网格大小在每个时间步都会进行更新。代理的头位也会根据市场波动进行更新。总奖励是时间步结束时奖励之和。代理可以选择清空所有未平头寸并在下一个时间步停止交易，而不是为下一个时间步选择网格大小。\n\
  \n\n\n\n\n*   `last_price`: 此变量代表上一个时间间隔结束时标的期货合约的最新价格。它是代理决策的参考点，因为代理将使用最后观察到的市场价格来评估挂挂网格单的可能性。它帮助代理跟踪价格波动，并使其感知市场的即时状态。通过了解最后价格，代理可以决定是否进入或退出交易，这是决策过程中的至关重要的一部分。\n\
  \n*   `last_range`: 在上一个步骤间隔内计算的价格范围（最高/最低 - 1）表明了该间隔内市场的波动性。该变量为代理提供了最近交易期间市场波动水平的洞察。如果范围很大，说明波动性增加，可能意味着需要更激进的交易策略或更宽的网格间隔。相反，较小的范围表示市场较稳定，可能导致代理收紧网格间隔或采用更保守的策略。理解市场的波动性有助于代理精调决策。\n\
  \n*   `day_high`: 上一个时间步结束时观察到的日最高价是指整个交易日内的最高价格。该变量允许代理评估当日交易背景下的最高潜在市场价格。它帮助代理衡量当前价格相对于日最高值的水平，并决定市场是朝着较高还是较低的价格趋势发展。了解日高价有助于代理理解更广泛的市场趋势并相应调整策略。\n\
  \n*   `day_low`: 与 `day_high` 类似，上一个时间步结束时观察到的日最低价反映了整个交易日内的最低价格。该变量提供了对市场最低点的洞察，让代理对交易日的下跌潜力有所感。代理可以使用此来管理风险，决定在价格接近日低时是否应该挂多单，或在价格接近低点时避免挂空单。日低在设置交易决策的风险阈值方面发挥作用。\n\
  \n*   `3day_high`: 过去三个交易日内观察到的市场峰值让代理对市场的近期高点有了了解。通过考虑三天的窗口，代理可以更好地理解短期价格趋势，并确定市场相对于最近几天是否处于峰值。这些信息帮助代理在设置网格单时做出明智决策，确保其设置的价格不会离市场近期高点太远。此外，该变量可以向代理指示何时根据历史价格波动获利或调整仓位。\n\
  \n*   `3day_low`: 过去三个交易日内观察到的最低价提供了与 `3day_high` 类似的功能，但方向相反。它帮助代理理解市场的近期底部，并可识别买入机会或支撑点。了解\
  \ 3 日低价允许代理避免在过接近此价格水平的地方挂网格单，减少被止损的风险。该变量与 3 日高价结合使用时，提供了关于市场价格范围更平衡的视角，提高了代理设置有效网格大小的能力。\n\
  \n*   `position`: 仓位变量表示代理在上一个时间步结束时在市场中的仓位价值，按因子 10 进行了缩小。\n\n### 3.2 归一化与裁剪（Normalization\
  \ and Clipping）\n\n#### 3.2.1 数据归一化\n在 DRL 背景下，管理状态变量的范围至关重要。控制范围的主要原因之一是避免模型对异常值过度敏感，这会偏离学习。如果允许状态变量不受控地变化，模型可能会面临学习困难。通过对输入进行归一化，我们确保模型接收到一致且稳定的数据。对于本项目，我们使用了特定领域的归一化方法，对所有价格进行缩放。此外，我们设计了\
  \ `last_range`（跟踪上一个时间步期间的价格范围），使其限制在 0 和 1 之间。这防止了代理过度强调较大的波动，确保模型学习相对变化。此外，反映暴露的代理\
  \ `position` 通过分母进行缩放，将其范围缩小到 [0, 1]。这种归一化确保仓位值处于可管理的范围内，防止了大仓位不成比例地影响代理的决策。\n\n\
  我们还为每个变量设置了裁剪范围（见表 1），以确保超过阈值的值被截断，防止异常值偏离模型的学习。这有助于维持稳定性，并确保模型不受代表典型市场行为的值的影响。同样，奖励也使用相同的方法进行了归一化和裁剪。这种方法保持了训练过程的稳定性，确保模型从相关数据中学习，避免受到噪声或异常数据点的干扰。\n\
  \n### 3.3 使用 PPO 进行网格交易的训练过程\n在项目中，DRL 代理的训练过程遵循结构化的程序，利用近端策略优化（PPO）算法。代理的目标是学习期货市场网格交易的最优策略。网格交易是在当前市场价格上下按照预定义的间隔挂单，目标是从市场价格的波动中获利。\n\
  \n训练过程可以分解为几个关键步骤，包括定义目标函数、计算价值函数损失以及优化总目标以完善代理的策略（utton & Barto 2018）：\n\n*   第一步：初始化\n\
  \n\n\n\n\n- 初始化策略网络（`actor`）和价值网络（`critic`）。这两个网络在项目中均实现为 `MLPs`（多层感知器，Murtagh 1991）。\n\
  - 策略网络输出每个动作的概率（离散动作空间）。\n- 价值网络输出一个标量值，用于估计状态价值（从某个状态开始期望回报）。\n\n## 第二步：将环境状态（市场视图）输入到神经网络\n\
  \n- 智能体观察环境状态 `s[t]`（最近的市场价格、该项目中的持仓情况）。\n- 状态 `s[t]` 被输入到两个网络中（`actor` 和 `critic`，它们通常被实现为具有共享隐藏层的相同\
  \ `MLP` 模型）。\n\n## 第三步：动作\n\n- 智能体从策略网络给出的动作分布中采样动作 `a[t]`。对于我们项目中定义的离散动作空间（即网格大小），这涉及到从\
  \ `softmax` 输出（概率）中采样。\n\n## 第四步：计算优势\n\n- 执行动作 `a[t]` 后，智能体接收奖励 `R[t]` 并转移到下一个状态\
  \ `s[t + 1]`。\n- 优势使用价值函数计算：`A[t]=R[t] - V(s[t])`，其中 `V(s[t])` 代表估计的状态价值——遵循当前策略的期望未来累计回报。\n\
  - 优势告诉智能体，所采取动作与状态预测值相比是好是坏。\n\n## 第五步：计算损失函数\n\n- 损失函数定义为 `L[total] = L^P(θ) +\
  \ c[1]L^V(θ) + c[2]L^E(θ)`。\n- 其中 `c[1]` 和 `c[2]` 是平衡损失的超参数。\n- `L^P(θ)` 是策略损失部分：\n\
  \n```\nL^{P}\\left( \\theta \\right) = - E\\_{t}\\left\\lbrack {min\\left( p\\_{t}\\\
  left\\lbrack \\theta \\right\\rbrack\\hat{A\\_{t}},~clip\\left( p\\_{t}\\left\\\
  lbrack \\theta \\right\\rbrack,1 - \\varepsilon,~1 + \\varepsilon \\right)\\hat{A\\\
  _{t}} \\right)} \\right\\rbrack\n```\n\n- 其中：\n- ![](img/1.png) 是新旧策略之间的概率比例。\n\
  - `π[θ]` 是动作概率，其中 `θ` 代表神经网络的参数（权重）。这是智能体用于采取动作的策略。\n- `s[t]` 分别代表环境状态，`a[t]` 代表智能体在时间步\
  \ `t` 采取的动作。\n- `\\hat{A_{t}}` 是时间步 `t` 处的优势函数。\n- `\\epsilon` 是裁剪参数，将概率比例限制在 1\
  \ 附近的区域。\n- `L^V(θ)` 是价值损失部分，计算方法为估计值与实际回报之间的均方误差。\n- `L^E(θ)` 是熵损失部分，通过通过惩罚确定性策略来鼓励探索。\n\
  \n```\nL^{P}\\left( \\theta \\right) = - E\\_{t}\\left\\lbrack {min\\left( p\\_{t}\\\
  left\\lbrack \\theta \\right\\rbrack\\hat{A\\_{t}},~clip\\left( p\\_{t}\\left\\\
  lbrack \\theta \\right\\rbrack,1 - \\varepsilon,~1 + \\varepsilon \\right)\\hat{A\\\
  _{t}} \\right)} \\right\\rbrack\n```\n\n\n\n\n\n`explained_variance` 的时间序列图展示了模型解释价值函数变异的程度，该图位于图\
  \ 3 的顶部。随着训练时间步的增加，未平滑的数值在 0.75 附近波动，表明平均而言，价值函数能够准确预测很大一部分收益。波动反映了代理所面临的期货市场不确定性。值得注意的是，`explained_variance`\
  \ 的波动所反映的奖励方差通过网格交易策略得到了缩小，而该策略本身对不利的价格变动具有内在的鲁棒性。`explained_variance` 的波动幅度在训练后期趋于稳定。这表明随着代理获得更多关于环境的“经验”，其决策策略变得更加稳定。\n\
  \n图 3 底部的学习率图使我们能够验证收敛到最优解的速度是否符合训练设置中学习率表的规定。下降趋势的图表表明模型在初期学习很快，并在收敛到解决方案时对其参数进行微调。\n\
  \n#### 图 3. 损失（顶部）与 `Approx_kl`（底部）的训练后指标报告截图\n\n![979-8-3693-8186-1.ch005.f03](img/979-8-3693-8186-1.ch005.f03.png)\n\
  \n损失指标表示了当前的总损失值 `L[total]`。损失值图显示在图 3 的顶部。损失值的演变表明网格交易代理在学习早期在最大化奖励方面取得了显著但剧烈的进展。随着策略变得更加高效以及学习率的降低，总损失值趋于稳定。然而，总损失值的波动在整个训练后期仍然存在，反映了网格交易代理所面临的不可预测的市场环境。\n\
  \n`approx_kl` 指标显示在图 3 的底部，指的是新旧策略之间的近似 Kullback-Leibler (KL) 散度。它表示新策略与旧策略之间的差异有多大。较小的\
  \ KL 散度表明策略更新幅度不大，这是稳定性的一个积极信号。图表显示该指标收敛于 0，表明随着训练后期额外的学习进行，策略更新变得微乎其微。\n\n总而言之，训练过程显示网格交易代理随着时间的推移变得越来越稳定，解释方差表明模型有效地预测了市场收益，随着模型对其参数的微调，学习率逐渐降低。损失指标在初期有所波动，但随着策略的改进趋于稳定，而\
  \ `approx_kl` 指标收敛于零，表明在训练后期后期策略更新变得微乎其微。鉴于关键指标的稳定，训练过程似乎是成功的，代理可能已经达到了满意的学习水平，尽管仍可以进行进一步评估以确保其在现实场景中的鲁棒性。\n\
  \n### 4.2 测试性能\n\n我们使用训练好的 RL 代理在测试期间实施网格交易策略。测试奖励计算方法为持有价值为 1 单位合约的头寸的名义收益（见公式\
  \ 1）。训练好的 RL 交易员的初始余额设置为 100,000。每日性能统计摘要列在表 2 中。\n\n### 表 2. 训练代理在测试集上的性能摘要\n\n\
