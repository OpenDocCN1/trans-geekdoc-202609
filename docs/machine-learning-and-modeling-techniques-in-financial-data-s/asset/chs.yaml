  \n另一个重要的考虑是，并非所有温室气体都在相同的时间跨度内影响环境。按照惯例，环境影响通常基于具有 100 年影响的气体计算，被称为`100 年全球变暖潜力（100-GWP）`。下表是使用此标准计算得的。\n\
