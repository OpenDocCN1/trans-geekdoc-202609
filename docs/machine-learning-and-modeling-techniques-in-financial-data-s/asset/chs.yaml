  \ 50%和 75%行数据存在细微出入，此处已按逻辑对齐)*\n\n#### 图 4. 训练代理在测试集上的时间序列图\n\n![979-8-3693-8186-1.ch005.f04](img/979-8-3693-8186-1.ch005.f04.png)\n\
  \n图 4 提供了有关代理在每个时间步性能的进一步见解。该图将奖励、头寸和点大小叠加在一个时间序列中。它显示尽管出现过下跌，交易者的余额在测试结束时仍增长到初始值的\
  \ 2.5 倍。未平头的波动是风险的主要驱动因素。时间步奖励显示出巨大的波动，特别是当代理在某个方向持有大量合约时，这导致了观察到的波动。\n\n总体而言，基于\
  \ RL 的网格交易代理在账户余额上表现出强劲增长，同时表现出巨大的波动。代理的策略涉及激进，这既带来了高回报也带来了风险。\n\n### 5. 局限性\n\n\
  本研究依赖于与近期价格相关的有限环境变量。在实践中，网格交易者会整合更广泛的信息，包括实时订单簿和订单流(Hirschey,2021)，并对短期价格波动做出反应（Hagströmer，2013）。交易者通常依赖技术分析指标，包括跨长时间的价格和成交量数据。这种简化可能导致图\
  \ 3 和图 4 中所示模型指标中观察到的波动。\n\n此外，动作空间和奖励函数未能有效激励代理管理头寸风险，这在现实交易中可能会导致巨大的成本(Shleifer\
  \ & Vishny,1997; Chen & Maher,2013)。\n\n\n\n\n\n在我们的 PPO 模型中，近似动作概率分布的策略网络以及近似价值函数的价值函数网络，均是使用多层感知器（`MLP`）构建的。这种架构在网格交易背景下存在若干几个局限性。`MLPs`\
  \ 不擅长捕捉时间依赖关系，而这种关系对于金融时间序列数据至关重要，可能导致次优的交易决策。金融数据的波动性和高维性（例如仓位大小和奖励）可能会挑战 `MLP`\
  \ 在各种市场条件下的泛化能力，特别是当训练数据有限或存在噪声时。此外，`MLPs` 缺乏自动特征提取的能力（Shaheen et al., 2016），且模型对超参数调优的敏感性可能会在波动环境中导致过拟合和不稳定性（Rijsdijk\
  \ et al., 2021).\n\n## 6. 结论\n\n本文探讨了近端策略优化（`PPO`）在网格交易中的应用，利用白银期货的高频 Tick 级数据训练了一个深度强化学习（`DRL`）智能体。我们证明了\
  \ `PPO` 在存在市场噪声的情况下随时间适应并优化交易策略的潜力。该智能体成功学习了如何适应市场状况，捕捉短期波动，并在波动或横盘市场中展现出盈利交易的强大潜力。\n\
  \n本研究的一个核心贡献在于将深度强化学习（`DRL`）和 `PPO` 应用于网格交易的详细方法。我们彻底解释了强化学习（`RL`）的基础原理以及它们是如何被应用于此语境的。特别是，我们描述了环境、智能体和奖励函数，强调了如何整合\
  \ Tick 级市场数据来指导智能体的决策过程。通过根据网格交易的动态定义状态和动作空间，我们能够模拟出一个真实的交易环境，智能体可以在多次迭代中学习优化其策略。\n\
  \n虽然本研究为 `PPO` 在算法交易中的潜力提供了宝贵的见解，但未来的研究可以在我们方法的基础上，探索额外的特征，例如风险管理或更复杂的状态表示（如情绪或宏观经济因素）。结合这些元素可以进一步增强智能体的决策能力。尽管如此，我们的结果证实了\
  \ `PPO` 是开发自适应、灵活交易策略的一种极具前景的工具，特别是在市场调整对成功至关重要的高频交易场景中。\n\n本研究的发现对算法交易领域的学术研究和实际应用都具有若干重要意义。首先，`PPO`\
  \ 在网格交易中的成功应用凸显了强化学习（`RL`）在金融市场中日益增长的相关。随着市场变得复杂且数据丰富，传统策略可能难以适应快速变化。`PPO` 响应不断的市场状况持续优化交易策略的能力表明，基于\
  \ `RL` 的方法可能成为增强市场效率和流动性的关键工具。\n\n对于从业者来说，这些意义是重大的。实时适应交易策略的能力（特别是在波动或横盘市场）可以提供巨大的竞争优势。高频交易（`HFT`）公司和自营交易部门可能会从能够自主微调网格交易策略的\
  \ `DRL` 智能体的开发中受益。\n\n## 参考文献\n\n- Abdolmeli, A., Guez, A., & Silver, D. (2018).\
