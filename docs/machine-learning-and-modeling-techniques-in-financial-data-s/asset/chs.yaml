  \ 摩洛哥\n\n**Zineb Sabri**\nSidi Mohamed Ben Abdellah University, 摩洛哥\n\n### 摘要\n\n\
  近期的研究强调了机器学习（`ML`）在金融领域日益增长的应用，这通过文献计量分析得到了证实。Kureljusic 和 Karger (2024) 回顾了财务会计中基于\
  \ `AI` 的预测，识别了研究空白并提出了未来的研究议程。同样，Biju 等人 (2023) 探讨了金融领域 `AI`、深度学习和 `ML` 的分类，强调了出版数量的增加以及对算法金融技术进行实证研究的需求。在这一基础上，本研究对\
  \ 1996 年至 2024 年间金融数据预测中的 `ML` 进行了科学计量分析。利用 Scopus 和 Web of Science 的数据，我们研究了关键主题、协作网络和影响力贡献。通过使用\
  \ `Sentence-BERT`、`BerTopic`、`BERT`、`ChatGPT` 和 `PEGASUS` 等深度学习工具，我们为 `ML` 如何重塑金融预测提供了见解。该分析为未来的研究提供了基础，引导学者和从业者关注金融领域具有影响力的领域。\n\
  \n### 1. 引言\n\n\n\n\n\n对研究产出量化的日益增长的需求催生了科学计量学和文献计量学，用于绘制科学领域的发展蓝图。科学可以被理解为一个由信息流驱动的自组织系统，新发现建立在过去思想的基础上，通过集体且循序的过程不断演变。虽然社会压力和组织结构等外部因素可能会影响科学运行的环境，但它们不会从根本上改变其有机发展方向——就像生物体的发育是由遗传信息而非外部条件塑造一样（Nalimov\
  \ & Mulchenko, 1971）。在金融数据预测的背景下，机器学习技术的整合代表了重大的演进，其驱动力来自这些技术在转型建模、风险评估和决策过程方面的潜力。\n\
  \n受科学计量分析与机器学习在金融领域转型潜力交叉研究的启发，本章旨在解决几个关键问题：塑造该领域的主要主题和合作网络是什么？具有影响力的贡献者和研究集群是如何随时间演变的？现有文献中存在哪些可能激发未来创新的空白？通过回答这些问题，我们旨在强调科学计量工具在揭示隐藏模式和促进跨学科合作方面的关键作用。\n\
  \n在金融预测机器学习领域进行科学计量学研究，可以为研究方法论的发展提供必要的见解，并突显影响力作者的贡献。这些分析通过关键词共现识别新兴主题，揭示可以塑造未来研究的趋势，作为理解研究版图的路线图（Donthu\
  \ et al., 2021）。此外，科学计量学在揭示研究人员之间的合作网络方面起着至关作用，强调了驱动各个科学领域创新的伙伴关系。通过绘制一个领域的协作和主题维度，这些研究提供了关于知识演变路径的洞察，使学者能够识别新兴趋势、影响力作者和重大研究集群。科学计量学还帮助发现跨学科联系，展示了不同领域如何汇聚应对复杂挑战，并促进了更整合的研究社区。这种方法不仅为未来的研究方向提供了信息，还增强了对科学进步及其广泛影响的集体理解。\n\
  \n最近的研究强调了机器学习在金融领域日益增长的应用，正如全面的文献计量分析所示。例如，Kureljusic and Karger (2024)系统地回顾了财务会计中基于\
  \ AI 的预测，识别了差距并提出了未来的研究议程。同样地，Biju 等人（2023）研究了金融领域人工智能、深度学习和机器学习的分类，揭示了出版趋势的激增以及对算法金融技术进行实证研究的需求。这些发现共同强调了文献计量和科学计量研究在绘制金融机器学习应用版图方面的关键作用，强调了不仅要理解当前趋势，还要理解推动该领域发展的基础伙伴关系和方法的重要性。\n\
  \n本研究在这些工作的基础上，对 1996 年至 2024 年金融数据预测中的机器学习进行了科学计量分析。利用来自 Scopus 和 Web of Science\
  \ 的数据，本研究探索了该领域的主要主题、合作网络和影响力贡献者。通过利用由 `Sentence-BERT`、`BerTopic`、`BERT`、`ChatGPT`\
  \ 和 `PEGASUS` 等模型支持的嵌入向量、主题建模和文本摘要等深度学习工具，旨在对机器学习如何重塑金融预测提供细致理解。最终，这项分析为未来研究奠定了基础，引导学者、从业人员和政策制定者关注具有巨大影响潜力的金融领域。\n\
  \n## 2. 文献综述\n\n文献计量分析是一种广泛认可且严谨的方法，用于探索和分析大量的科学数据（Donthu et al., 2021）。更具体地说，文献计量分析是指对文献材料的定量研究。它涉及测量和分析科学出版物的各个方面，如论文数量、引用次数、作者和期刊，以便对一个研究领域提供全面概述（Merigó\
  \ & Yang, 2017）。这种方法允许对出版物、作者和来源进行分类和排名，有助于识别特定领域内的影响力作品和关键贡献者。\n\n在此基础上，文献计量分析不仅提供了研究领域的整体概况，还揭示了内部细微的演变趋势，同时强调了新兴的兴趣领域。通过阐明既有和不断增长的研究轨迹，文献计量分析成为理解科学知识动态发展的重要工具。\n\
  \n因此，研究人员最终可能会划定“已知”与“未 own”之间的界限，使他们能够更有效地识别对某一领域现有理解的空白。这种区分对于指导未来的研究工作至关重要，因为它突显了需要进一步调查的领域，并通过鼓励学者探索未知领域来促进创新。通过清晰地界定已知内容与不确定内容，研究人员可以优先考虑其调查事项，更有效地分配资源，并为科学发现的进步做出贡献，特别是在数据科学等快速发展的领域（Purnomo\
  \ et al., 2020)以及人工智能（Tapeh & Naser, 2023).）。然而，在我们的工作中，我们选择使用“科学计量分析”（scientometric\
  \ analysis）和“科学计量学”（scientometrics）这两个术语，因为它们更好地反映了我们研究的特定背景，即对科学产出、研究绩效和特定科学领域内知识结构的评估。同时也关注科学生产和研究动态的定量评估（Ellegaard\
  \ & Wallin, 2015)；Bar-Ilan 2008, 2010)）。从历史上看，科学计量学起源于一种量化科学内部交流的方法，被 Nalimov 和\
  \ Mulchenko (1971) 正式定义为分析科学作为信息过程发展的定量方法研究。其范围从那时扩大，包含了文献计量学、信息计量学、网络计量学和替代计量学等学科，这些学科处理了数字和社交媒体对科学传播的影响（Mingers\
  \ & Leydesdorff, 2015)）。\n\n\n\n\n科学计量学的发展主要关注于引文分析，这在研究人员、观点、出版物和机构之间建立了联系，使得对科学网络进行经验研究成为可能\
  \ (Mingers & Leydesdorff, 2015; De Bellis, 2014)）。该领域由尤金·加菲尔德（Eugene Garfield）在\
  \ 20 世纪 50 年代创立《科学引文索引》（SCI）而发起，随后演变并包含了各种指标，例如用于评估期刊的影响因子，以及用于绘制出版物之间关系的共引网络（Larsen\
  \ & Ins, 2010; Carpenter & Narin, 1981)）。SCI 现已成为 Web of Science（科学平台）的一部分，推动了许多进展，包括科学网络的可视化，以及利用\
  \ `h-index` 等概念对学者生产力进行分析，该指标被认为是下一代指标和标准之一 (Dong et al., 2015; Hirsch & Buela-Casal,\
  \ 2014; Kelly & Jennions, 2006; Hirsch, 2005)。尽管具有影响力，但传统指标面临着局限性，例如过度署名带来的偏差或不同的引文惯例。像\
  \ `h-frac` 这样的指标提供了应对这些挑战的替代方案，反映了更准确的学术贡献 (Singhal et al., 2013; Koltun & Hafner,\
  \ 2021)。\n\n此外，关键词共现分析被广泛应用于通过分析标题、摘要或正文中关键词的共现情况来理解主题趋势 (Zhao, 2024; Narong & Hallinger,\
  \ 2023; Bornmann et al., 2017)。网络分析技术经常被用于可视化作者、机构或主题之间的连接，从而增强了对协作和知识流的理解 (Yue\
  \ et al., 2021; Madani, 2015)。\n\n这些方法通常与数据可视化工具（如 `VOSviewer`、`Gephi` 和 `R`（通过\
  \ `bibliometrix`、`ggplot2`、`igraph` 或 `biblioshiny` 等包）相结合，对于揭示科学知识产生的动态和识别新兴研究前沿至关重要\
  \ (Purnomo et al., 2020)。`R` 已成为该领域的强大工具，提供了强大的统计和可视化能力，使其在文献计量学和科学计量学分析中非常多化 (Zejjari\
  \ & Benhayoun, 2024)。\n\n近年来，人工智能（AI）与科学计量分析的整合为获取更先进、更细致的洞察开辟了新途径。AI 驱动的工具可以处理远超人类能力的大数据集，促进科学趋势的实时追踪以及跨学科复杂模式的检测。例如，机器学习算法通过识别出版物、作者之间的潜在关系，增强了传统的引文分析。自然语言处理（NLP）进一步通过分析文本内容，扩展了研究范围，并进行更细致的分析\
  \ (Gomez et al., 2023)。此外，人工智能在科学计量学中的应用正日益受到关注，并正成为学术研究的热点。\n\n机器学习的整合为获取更先进、更细致的洞察开辟了新途径。AI\
  \ 驱动的工具可以处理远超人类能力的大数据集，促进科学趋势的实时追踪以及跨学科复杂模式的检测。例如，机器学习算法通过识别出版物、作者之间的潜在关系，增强了传统的引文分析。自然语言处理（NLP）进一步通过分析文本内容，扩展了研究范围，并进行更细致的分析。此外，人工智能在科学计量学中的应用正日益受到关注，并正成为学术研究的热点。\n\
  \n近年来，文献计量和科学计量学分析揭示了机器学习与财务数据预测之间日益增长的交叉。例如，Zakaria et al. (2023) 对 `SCOPUS` 中的\
  \ 189 篇文章进行了全面的文献计量研究，揭示了 2017 年后出版数量显著增加。他们的发现强调了机器学习技术在各种财务预测任务（如众筹和破产预测）中的应用关键趋势。同样，Salehpour\
  \ & Samadzamini (2024) 探索了经济学、计量经济学和金融领域的机器学习应用，分析了 2013 年至 2022 年的出版物。他们的研究让我们了解机器学习如何日益整合到经济预测模型中，从而提高了该领域的预测准确性。\n\
  \n\n\n\n同样地，Manogna & Anand (2023)对金融领域知名作者的影响进行了全面分析，特别关注了深度学习（`DL`）的应用。结果显示，自\
  \ 2017 年以来，金融领域对`DL`的使用显著增加。研究识别了四个关键研究领域：神经网络与股市模拟、投资组合优化与风险管理、时间序列分析与预测，以及高频交易。\n\
  \n此外，Martins & Galegale (2023)侧重于对机器学习文献进行更广泛的文献计量分析，强调了与金融数据预测相关的预测性算法。他们识别了关键主题和引用趋势，同时指出缺乏将机器学习与金融领域大数据相结合的整合性研究。总而言之，这些研究强调了文献计量和科学计量分析在描绘金融领域机器学习应用演变格局中的重要性，揭示了具有影响的研究人员并突出了未来的研究探索领域。\n\
  \n## 3. 材料与方法\n\n为了实现本章的目标，我们采用了连接主义方法对机器学习在金融时间序列预测中的应用进行科学计量分析。该方法旨在捕捉大型集中复杂的关系和模式，增强我们对机器学习（特别是深度学习模型）如何用于预测金融趋势的理解。该方法论对现有研究现状进行了细致分析，同时识别了新兴趋势和未来的探索领域。\n\
  \n### 3.1 数据收集\n\n本研究的数据源自`Scopus`和`Web of Science`，使用了包含“机器学习”、“金融数据”和“预测”等关键词的结构化查询。在删除重复项后，共汇编了\
  \ 1996 年至 2024 年间发表的 892 篇独立文档。元数据（包括作者所属机构、关键词、摘要和引用次数）构成了分析的基础。为了确保覆盖全面，保留了多种语言的文档，其中英语占据数据集主体。\n\
  \n### 3.2 数据预处理\n\n将原始元数据统一为一致的数据集。删除了重复条目，并协调了不同数据库数据条目之间的差异。优先考虑具有可用摘要的文章，以确保分析的相关性和质量。这一预处理步骤实现了与高级分析工具的无缝衔接。\n\
  \n### 3.3 统计与网络分析\n\n统计方法评估了作者、机构和来源的产力和影响力。关键指标包括`h-index`、引用次数和合作指数，这些指标突出了有影响力的贡献者和合作伙伴。引用分析描绘了出版物随时间增长的情况，并识别了研究重点的转移。可视化技术（如`Evolution\
  \ Plots`演化图）追踪了文档的生产趋势和关键词的使用情况，为该领域的新兴主题提供了见解。\n\n合作分析检查了机构和国际层面的共同作者模式。全球合作网络展示了机构与国家之间研究伙伴关系的规模和强度，强调了金融预测研究的跨学科和全球性。\n\
  \n### 3.4 探索性数据分析 (EDA)\n\n为了实施这一方法，我们采用了 Pereira 等人（2024）提出的方法论。他们的方法引入了`pyBibX`，这是一个专门设计的`Python`库，用于对源自如`Scopus`、`Web\
  \ of Science`和`PubMed`等数据库的原始数据文件进行全面的文献计量和科学计量分析。该库的核心集成了先进的人工智能（AI）能力，使其成为深入分析的强大工具。该方法涉及进行彻底的探索性数据分析（`EDA`），利用清晰的图表展示来检查数据的结构、分布和潜在异常。随后是网络分析，结合了引用、合作和相似性分析，使我们能够发现作者、机构和研究主题之间的关系。通过检查这些网络，我们对该领域的协作性质有了见解，突出了关键贡献者和高影响合作伙伴关系。\n\
  \n使用`pyBibX` `Python`库库采用了可视化技术，如词云、`N-grams`和用于降维的`UMAP`。`UMAP`根据语义相似性对文档进行聚类，能够探索数据集内部潜在的关系。Sankey\
  \ 图展示了跨作者、机构和国家的科研产出流向，而树图和柱状图则量化了研究产出的分布情况。\n\n### 3.5 AI 驱动的分析工具\n\n采用了先进的 AI\
  \ 模型来丰富分析：\n\n- `BERT`：促进关键词提取和语义分析，以准确分类研究主题。\n- `Sentence-BERT`：生成相似性分析的嵌入，对具有主题重叠的文档进行聚类。\n\
  - `BerTopic`：识别并分类研究主题，映射随时间推的趋势和变化。\n- `ChatGPT`：总结大量文本，提供关于研究贡献的简洁见解。\n- `PEGASUS`：通过生成式摘要突出文档中的核心思想。\n\
  \n这些工具解决了数据同质性和可扩展性等挑战，实现了全面且详细的科学计量分析。\n\n### 3.6 主题建模\n\n使用来自`Sentence-BERT`的嵌入，主题建模揭示了主题集群和新兴研究领域。生成式和抽取式摘要技术为单项研究提供了简洁概述，突出了它们的主要贡献。这种由`NLP`-驱动的方法丰富了分析，揭示了研究主题与其随时间演变之间的微妙联系。\n\
  \n图 1 下方总结了科学计量分析过程，说明了顺序步骤：数据收集、预处理、统计分析、探索性数据分析、合作分析和主题建模。\n\n#### 图 1. 科学计量分析过程概述\n\
  \n![979-8-3693-8186-1.ch018.f01](img/979-8-3693-8186-1.ch018.f01.png)\n\n## 4. 发现与见解\n\
  \n在本节中，我们展示了科学计量分析的关键发现和见解，突出了定义研究格局的主要主题和趋势。这些见解深了我们对机器学习技术如何应用于金融数据预测的理解，并揭示了领域内不断发展的兴趣。\n\
