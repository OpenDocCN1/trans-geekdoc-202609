  \ 5% 的显著性水平上统计显著。该参数的值（0.8898）非常接近 1，表明指数波动率具有持续性并表现出波动聚集性。这说明 S&P/TSX 的突然冲击不会被迅速吸收，而是对指数产生持久影响。\n\
  \n同样，捕捉 S&P500 指数波动率的参数 Φ[S&P500] 也具有统计显著性，其值为 0.9220。参数值接近 1 意味着 S&P500 的波动率具有持续性，对指数的冲击具有持久影响，这与波动簇的存在是一致的。\n\
  \n代表两个指数之间波动传递效应的参数 Φ[S&P500-TSX] 和 Φ[TSX-S&P500] 也具有统计显著性。这表明 S&P/TSX 和 S&P500\
  \ 之间的波动传递机制是双向的。具体而言，S&P500 的 1% 冲击将在下一个交易日使 S&P/TSX 的波动增加 0.0828%，而 S&P/TSX 的 1%\
  \ 冲击将会在下一个交易日使 S&P500 的波动增加 0.0699%。这些结果表明两个指数之间的波动传递是双向的，与反向影响相比，S&P500 对 S&P/TSX\
  \ 波动的影响相对较大。\n\n代表 S&P/TSX 和 S&P500 指数之间相关性的参数 Ψ[TSX] 和 Ψ[S&P500] 统计统计性，表明这两个变量之间存在强有且动态的关系。\n\
