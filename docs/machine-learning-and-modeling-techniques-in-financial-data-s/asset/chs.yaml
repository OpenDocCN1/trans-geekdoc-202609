  \n## 第 11 章\n# 印度银行与非银行金融公司 (NBFCs) 的 AI 驱动信用评估：全面分析\n\nShikha Malhotra\n印度克里斯特大学\n\
  \nK. A. Dhanya\n印度克里斯特大学\n\nRaj M. S. Prathibha\n印度克里斯特大学\n\nPriyakrushna Mohanty\n\
  印度克里斯特大学\n\n### 摘要\n\n\n\n\n\n本研究探讨了 AI 框架在现实场景中的应用，包括监管合规、欺诈检测、信用评分、违约预测和投资组合管理（Moscato\
  \ 等人，2020）。通过利用 AI 获得对借款人信用状况更深层的洞察，金融机构可以优化决策、简化流程并营造更稳定的金融环境。然而，在展现出巨大变革潜力的同时，AI\
  \ 的实施也面临着重大挑战。确保数据质量、提高模型的可解释性、遵守监管合规以及处理伦理考量对于实现公平无偏的结果至关重要。本文强调了将 AI 集成到金融系统中相关的机遇与复杂性，并强调了平衡且负责任的采用需求。\n\
  \n### 1. 引言\n\n在 18 世纪和 19 世纪工业生产和计算机科学分别发展之后，人工智能（AI）成为经济史上第三次重大技术革命(Ernst 等人,\
  \ 2019)）。从根本上说，人工智能（AI）是计算机对人类智能过程的复制，包括广泛解决问题的能力(Zhang & Lu, 2021)。机器学习（ML）是该学科中一个突出的领域，使计算机能够从数据中自主学习规则。由于\
  \ AI、ML 和预测性分析的快速发展，金融服务业正在发生变化(Mhlanga, 2020)。银行正在利用这些改进来更好地分析客户数据，从而使贷款准备更加有效。机器学习和人工智能在银行及其他金融机构的应用正在不断增长。经济的其他领域也存在类似的模式。在过去的几十年里，金融领域发展最领域之一是银行风险管理，但对该主题的工作需求一直不断增加。\n\
  \n银行业部门的信用风险评估涉及借款人对其贷款义务发生违约的概率，从而增加了贷款人的风险(Behr & Güttler, 2007)。确定借款人违约其财务义务的概率对于评估信用风险至关重要。执行此点的传统方法包括审查财务记录、信用报告和历史数据。这些方法是有效的，但存在一些问题(Abdou\
  \ & Pointon, 2011)。首先，它们依赖于静态数据。其次，它们无法适应变化的经济状况。\n\n随着先进技术和分析引入贷款领域，信用风险评估已经发生了显著演变。印度银行频繁地使用金融科技技术和替代数据源来评估潜在借款人的信用状况(Tigges\
  \ 等人, 2024)。在银行和非银行金融公司（NBFCs）中，数据驱动的风险评估涉及对大型数据集进行彻底检查，以评估借款人的信用状况、财务稳定潜在风险。虽然信用评分和过去的财务数据通常是传统方法的基础，但现代方法使用了更多的数据元素。除了财务信息外，它还包含了非传统数据源，如交易历史、社交媒体的存在和参与，甚至涉及相关行为模式的趋势。人工智能极大影响了信用评分，与传统方法相比，它提供了一种革命性的方法。传统的评分方案往往无法捕捉个人财务行为的复杂性和变化(Ashofteh\
  \ & Bravo, 2021)。相反，人工智能（AI）能够分析大型数据集、识别模式并产生高度准确的预测。这使得以公平和定制的方式评估信用状况成为可能(Leal,\
  \ 2024)。为了检测可能的交易对手风险，AI 还可以分析来自多种来源的非财务数据，包括法律文件等各种来源的文件、社交媒体等。例如，金融机构使用 AI 技术跟踪有关客户的新闻和社交媒体帖子，以发现任何可能负面影响交易对手风险状况的进展。对于风险状况下降的交易对手，可能会启动信用额度审查(Brigo\
  \ 等人, 2013)。\n\n通过分析来自内部和外部的海量交易对手数据（例如财务报表、过往付款数据、过去进行的各种水平的交易等），基于 AI 的平台能够检测到可能的信用问题。例如，AI\
  \ 系统能够快速高效地大规模分析交易对手的财务报表，以发现任何财务警告信号，例如关键财务指标下降(Guo & Polak, 2021)。它们能够自动识别并突出与延迟监管文件、未付账单或交易对手流动资金恶化相关的模式。随后，这些数据可用于评估交易对手的财务状况并识别违约风险。\n\
  \n此外，信贷可用性是经济扩张的主要因素。尽管有坚实的基础和严格的限制，印度经济仍存在严重的信贷缺口。与其他发达国家相比，印度的信贷与国内总值（GDP）之比较低表明了巨大的差异。由于运营成本高和承保挑战，目前的银行基础设施未能充分服务于小型企业（MSME）和其他中小借款人(Esubalew\
  \ & Raghurama, 2019)。结果，这种缺口对这些借款人的影响尤为严重。这代表了人工智能（AI）和机器学习（ML）在贷款发放方面可能最大的影响。\n\
  \n印度储备银行（RBI）最近宣布利用人工智能（AI）对受监管机构的运营获得更深层的洞察。这包括使用网络关键风险指标、预警系统、压力测试模型、脆弱性评估、网络侦察、钓鱼演练，以及对反洗钱（AML）和了解客户（KYC）合规性的针对性评估，以及先进的数据分析(Doshi\
  \ & Pillai, 2024)。\n\n人工智能正在改变银行行业，机器学习算法正在重塑传统的僵化且缺乏适应性的信用风险评估技术。AI 的日益采用源于其分析海量数据的能力，发现了传统方法往往会错过的复杂模式和联系(Guo\
  \ & Polak, 2021)。\n\n\n\n\n\n这些 AI 框架已应用于各种现实场景，包括合规性、欺诈检测、信用评分、违约预测和组合管理 (Moscato\
  \ et al., 2020)。通过利用 AI 对借款人信用状况进行更全面的理解，金融机构可以做出更明智的决策，优化流程并促进更稳定的金融环境。然而，在展现其巨大潜力的同时，实施\
  \ AI 也需要解决关键挑战。确保数据质量、模型可解释性、监管合规性以及对伦理标准的遵守，对于实现公平公正的流程至关重要。\n\n## AI 在信用评估中运用的各个方面\n\
  \n麦肯锡最近的一项研究描述了 AI 在银行业和金融领域的应用潜力，该研究显示该行业最终的发展规模可能达到 1 万亿美元。来自剑桥大学的首席分析师也明确表示，银行\
  \ AI 应用的发展需要大量数据，而机构已经将这些数据安全地存储在他们的库中。银行和金融部门已广泛采用 AI 驱动的信用评估，改变了贷款者确定借款人信用状况并决定是否提供贷款的过程\
  \ (Agarwal, 2019)。根据专家介绍，人工智能（AI）将帮助贷款者覆盖超过 3.5 亿首次申请贷款，并至少降低 33% 的贷款违约率。通过对贷款申请人提交的信息和文件快速识别错误，AI\
  \ 和 `ML` 帮助银行拒绝潜在的违约者。预测分析有助于减少违约，其在预测潜在客户的还款行为方面的有效性达 90%（来源：ICICI）。\n\n如今许多许多银行正在使用人工智能（AI）来改善客户服务并加快贷款流程。80%\
  \ 的银行承认人工智能（AI）为银行业带来的优势 (Bhattacharya & Sinha, 2022)。银行能够通过机器学习算法快速有效地检查大量数据，以评估信用状况并实时做出贷款决策\
  \ (Garcia & Lee, 2019)。在贷款流程中使用 AI 的优点之一是可以减少偏见并提高评分准确性。除了信用历史，算法还可以考虑交易数据和社交媒体活动，提供申请人财务状况更全面的画像。另一方面，偏见和决策的重要性仍是问题。\n\
  \n以下领域定义了 AI 模型如何在银行和非银行金融公司（NBFC）的信用评估过程中中使用并变革这一流程。\n\n### 2.1 信用决策\n\n在研究决策中使用\
  \ `AI/ML` 时，监督学习或无监督学习方法等因素发挥了作用。例如，机器学习 (`ML`) 可以使各种因素可视化，从某些贷款属性、还款计划到特定地区或收入维的趋势\
  \ (Salah et al., 2019)。这种研究对于评估个体的还款能力非常有用。Capital Float 利用 `AI` 进行市场营销、风险评估、决策，并防止坏账的发生。它还利用人工智能研究消费模式，从而通过其应用\
  \ `Walnut` 提供财富管理服务 (Yadav, 2020)。Lendingkart 使用人工智能 (`AI`) 处理万个数据点以评估信用、催收债务并在贷款违约之前进行干预。\n\
  \n### 2.2 信用评分\n\n目前，许多分析初创公司正致力于创新完美的替代评分系统 (Markov et al., 2022)。他们针对大型非银行金融公司（NBFCs），使其能够向没有传统信用评分的人发放个人贷款\
  \ (Bansal, 2024)。位于金奈的 NBFC Shriram Finance 正在通过 `CreditMantri` 进行个人贷款来打破信用评分系统，允许不同类型的评分。`CreditMantri`\
  \ 是一个评分数字市场，帮助 Shriram Finance 推出非传统评分构建器。\n\n印度政府已将金融包容性列为重点。通过利用 `AI` 识别那些不在金融体系且没有信用历史的人，这些努力可以加速。金融科技公司现在可以利用人工智能\
  \ (`AI`) 和替代数据源（手机手机使用、家庭历史以及消费和收入模式）为这些人创建信用评分。\n\n银行随后利用这些评分来寻找和增加新客户。银行可以使用 `AI`\
  \ 算法从各种数据中提取见解，包括客户的银行交易、过去的财务决策、社交媒体使用、浏览器历史和心理测试，从而准确评估客户的信用状况并加快贷款决策 (Lakshminarayana\
  \ & Deepthi, 2019)。\n\n金融科技公司 `Loan Frame` 通过查看个人资料并使用 `AI` 和 `ML` 来评估借款人的信用状况。同样，为了降低违约风险，`Monsoon\
  \ Credit Tech` 和 `Capital Floating` 等初创公司利用 `AI` 评估中小微企业（MSMEs）的信用状况。\n\n### 2.3\
  \ 预警信号\n\n过去的事件表明，缺乏强大的预警系统会导致灾难性的财务后果。例如，曾出现即将到来问题的迹象，如资产贬值和客户流失，这预示了 2008 年雷曼兄弟的崩溃，这是美国历史上最大的破产案之一。这些警告指标被忽视或无视了太久，引发了连锁反应，助成了世界金融危机的发展。\n\
  \n与此，2020 年的 COVID-19 疫情引起了密切关注此类威胁的必要性。2019 年 12 月开始的爆发只是一个信号，逐渐变成了一个重全球经济问题。随着人工智能\
  \ (`AI`) 和机器学习 (`ML`) 的引入，银行识别和应对预警信号的方式发生了巨大变化。`AI` 驱动的系统可以立即分析大量数据，然后可能发现指向潜在危险的趋势和联系。\n\
  \n这些说明强调了预警信号在早期风险识别中发挥的至关作用，使机构能够在太晚之前采取适当行动。在标准账户中，将检测到压力信号并向职能人员发送通知。因此银行能够利用\
  \ `AL` 模型采取必要的补救措施并防止侵蚀，从而缓解信用风险。\n\n\n\n\n银行从 E-value serve 的 Insights First EWI\
  \ 系统中受益匪浅，该系统帮助他们监控信用风险并做出明智的贷款决策。通过将该系统集成到现有的框架中，银行增强了识别早期预警信号和高效处理风险的能力。\n\n##\
  \ 2.4 运营效率\n\nAI 技术帮助银行和其他金融机构降低成本并改进运营流程。计算机学习并使其能够根据人类信息进行思考和工作的能力被称为“自然学习过程”。这种现成的解决方案技术能够在给定的时间范围内筛选海量数据，有助于在降低成本的同时提高效率和精准度（Locatelli\
  \ et al., 2022）。此外，AI 还帮助银行准备了与其客户相关的几份外部报告。因此，它改进了为客户提供的服务和整体体验。AI 使通信政策和账户对账自动化功能成为可能，这些功能帮助银行理解与不同账户有关的风险敞口。目前正呈现出使用聊天机器人和机器人顾问的趋势，以帮助客户处理财务事务，而无需访问银行。由于\
  \ AI 驱动的应用，申请人的贷款申请、处理和放发放变得更加简单。今天银行的一种中等先进且多功能的产品特性是聊天机器人。大多数银行在其网站上安装了聊天按钮，以便轻松识别客户需求，一旦安装，它们就会分析每个客户在网站上的行为模式。他们能更地理解客户的思维方式，从而提供个性化关注，并为个人指出最佳财务解决方案。因此，这消除了与银行使用电子邮件和其他通信手段相关的延迟。美国银行或其他任何机构最常用、最广泛使用的是\
  \ Erica AI 聊天机器人。它于 2018 年推出，截至今日，互动次数已超过 20 亿次，并已服务了 4200 万家银行。在印度，它的应用仍有很大的改进空间，尽管其在使用上具有潜力，但欧洲大多数女性对使用它持谨慎态度。银行还会收到有关用户信用卡债务风险的反馈，以及关于如何管理债务的指令和定期的系统维护。SBI\
  \ 的呼叫中心已经使其能够为客户提供更好的服务。\n\n得益于名为 SIA 的 AI 驱动聊天机器人的帮助，SBI 的客户服务得到了进一步增强。通过提供市场活动全面分析的\
  \ AI 驱动应用，投资决策也得到了提升。得益于 AI 平台的优化开发（导致过度买入或过度卖出特定股票），在该领域的投资相关支出可以降低。汇丰银行（HSBC）移动应用的整体功能在\
  \ `Payme` 应用中集成了 AI 系统以增强其支付选项。SBI 卡的交互式实时协助（ILA）为其提供的商品和服务提供最新的帮助。HDFC 银行引入了 AI\
  \ 辅助聊天机器人 `EVA`（电子虚拟助理），目前它已经解决了 420 万个问题。ICICI 还推出了一个女性友好的机器人并命名为 `iPal`，自推出以来已处理了\
  \ 310 万次客户咨询。\n\n目前，作为印度最大的私立银行，HDFC 计划利用大语言模型（LLMs）来改进关系维护。技术公司微软正与 Axis Bank 和\
  \ Aditya Birla Capital 等其他项目合作，实施利用生成式 AI 的呼叫中心和承保。\n\n## 2.5 欺诈检测\n\n与即时拒绝或批准欺诈交易的机器学习相反，生成式\
  \ AI 允许金融机构分析可能的欺诈。任何违反现有法律的行为都将被人工智能系统标记，并将发出相应的警报。这将使银行能够且及时地处理欺诈案件。基于规则的反欺诈解决方案使得检测检测变得更容易。因此，无需物理确认合规性。AI\
  \ 的使用通过提供风险风险概来警惕过度。生成式 AI 还用于货币不稳定、政治动荡或环境灾难期间的决策。AI 还被用于防止此类数据盗取、钓鱼欺诈、信用卡欺诈、生物识别攻击以及通过伪造签名和假身份证等进行的欺诈。涉及欺诈检测通常遵循以下步骤：数据分析、模式识别、预测建模和异常检测。\n\
  \nPine Labs 旗下的金融科技公司 Setu 推出了 `Sesame`，这是首个针对银行、金融和服务保险（BFSI）行业训练的大语言模型（LLM），并获得了专注于人工智能研究的本土公司\
  \ `Sarvam AI` 的支持。LLM 是文本理解认知过程，是经过大量文本和人类语言训练的增强型 AI 程序。\n\nSetu 的联合创始人 Nikhil\
  \ Kumar 认为，这是一个银行和金融服务领域可以与 ChatGPT 的时刻。金融科技生态系统中还有其他参与者，例如专注于检测金融欺诈的初创公司 AdvaRisk（受\
  \ ICICI 银行和其他投资者支持）；几年前成立的基于现金流的平台 Velocity（受 Peter Thiel 的 Valar Ventures 支持）；以及另一个客户服务自动化的初创公司\
  \ Gnani.ai（受三星支持）——它们都帮助银行通过使用数据增强其主要业务。\n\n在线支付欺诈损失从 2018 年估计的每年 2200 亿美元增加到 2023\
  \ 年的每年 480 亿美元。在这种情况下，AI 主动监控和检测各种欺诈、洗钱和违规案件的情况可能会大幅增加。通过观察个人的支出模式和行为趋势来寻找不规则交易是其方法之一。\n\
  \n\n\n\n国家犯罪记录局（NCRB）的数据显示，2025 年第二季度，在线金融诈骗占了所有网络犯罪投诉的惊人 67.8%。在 2020 年至 2022 年间，欺诈案件数量增加了\
  \ 31%，令人担忧的是，2022 年已达到 115 万例。在其中一起案件中，海德拉巴印度国家银行（SBI）分行经理及其同犯因一起涉及 17.5 亿卢比的欺诈案被捕。根据网络安全局的介绍，该诈骗案涉及使用“人头账户”来转移巨额资金。`MuleHunter\
  \ AI`是 RBIH（印度储备银行创新中心）内部开发的 AI/ML 模型，部署在银行中后，它可以帮助检测人头账户。人头账户是由一个人创建但由另一个人操作的账户。这些账户通常被用于洗钱和逃税。\n\
  \n技术解读趋势并不断调整以识别新颖欺诈策略的能力，将使银行能够在提高欺诈检测和预防有效性的同时，大幅降低成本。\n\n#### 2.6 贷款处理与收益回收\n\
  \n超过半数向金融机构寻求贷款的首次借款人被拒绝。随着技术（这是贷款评估中最常见的技术）的发展，这种情况可能会发生变化。值得注意的是，多年来，借款人和放贷流程都滥用了信用评分、声誉系统和无休止的文件工作，但人工智能已经在彻底改变针对性贷款的零售申请人评估流程。国家商业研究院与\
  \ Narrative Science 合作的一份报告概述，该国约三分之一的金融服务提供者已采纳人工智能，约 32%的企业借此提供更好的服务。即使是金融科技公司专门整合了人工智能（AI）来增强其贷款能力，传统银行和非银行金融公司（NBFCs）也开始采用这项技术，以满足不断变化的消费者需求（Kedar,\
  \ 2024）。\n\n专家表示，得益于 AI 系统，多家金融机构能够获得接近 3.5 亿首次借款人，并使贷款违约减少至少 33%。这是因为市场依赖 AI 和\
  \ ML 技术，这些技术通过信息和文件验证来快速识别贷款申请人信息中的潜在错误，因此金融机构可以选择忽略此类潜在的违约者([Çallí & Coşkun, 2021];\
  \ [Wang & Kim, 2017])。预测性分析在预测潜在客户偿还所提供贷款的可能性方面的准确率达 90%，从而控制了破产水平。如果银行和 NBFCs 能够利用机会获取完全不同的数据集，以针对印度不断增长的青年市场，则可以创造新市场并增强贷款能力（Narasimha\
  \ [Raju, 2023]）。同时，数百万家庭获得便捷的信贷将刺激消费，从而推动经济增长。波士顿咨询集团的一份报告估计，到 2023 年，数字贷款或在线贷款领域的收入将达到高达\
  \ 10 万亿卢比（ICICI 银行 贷款评估中的人工智能）。\n\n#### 2.7 更快速、高效的文档处理流程\n\n纸质文档通常利用各种工具和技术转换为数字格式，这些工具可以被硬件和软件用于实现程序或工作流的自动化。文档可以被扫描并转换为`PDF`，也可以通过`OCR`软件、文档管理系统或智能文档处理系统转换为电子版本。分析文档涉及将图像转换为文本以便计算机检索。目前已采用多种方法，例如光电识别（OMR）、光学字符识别（OCR）、光学条形码识别（OBR）和智能字符识别（ICR）。\n\
  \n一种解码照片内文本的先进方法称为输出字符识别，或`OCR`。它将具有视觉效果的文本转换为易读的字符，以便计算机决定下一步做什么。支票上的手写金额、账户信息和授权签名都可以由银行和商业贷款公司使用光学字符识别（OCR）技术记录。贷款的应用包括各种文件和数据。人工智能（AI）技术有助于从物理文档中高效提取数据和信息。`OCR`技术允许现代机器学习获取更多数据点，以改进处理结果。\n\
  \n理解海量文档是一个挑战。如今，创新的 AI 解决方案利用机器学习映射来提取这些文档的内容，这对于监控贷款和借款人详情非常需要。机构可以快速集成 AI 驱动的信息处理框架。自然语言处理（NLP）方法对深度学习算法和架构的巨大进展做出了贡献([Khan\
  \ & Chen, 2018]）。主题建模、情感分析和实体识别是超越传统技术的突破性发明。此外，`NLP`在自动化合规方面起着重要作用。这些先进技术减少了劳动密集型的手动工作，为贷款公司增加了价值。\n\
  \n#### 2.8 其他示例\n\n汇丰银行（HSBC）是一家全球性银行和金融服务公司，利用 AI 驱动的语音识别技术进行用户识别。通话期间，AI 系统利用银行交易中的独特语音模式和特征来验证客户身份。这种安全实用的验证方法减少了对密码和`PIN`等复杂安全措施的需求。这些真实案例展示了人工智能如何在金融和银行业应用。它们证明了银行业如何通过人工智能（AI）技术，在欺诈检测、客户服务、风险管理、投资管理和验证程序等领域提高生产力、准确性和客户满意度（Durongkadej\
  \ et al., 2024）。\n\n\n\n\n\n在不充分且分散的数据集上创建 AI 模型将产生不可靠的结果。有缺陷的数据会导致模型不完善，并对结果产生深远影响。由于\
  \ `Ai` 模型依赖大型数据集来识别模式和行为，数据不足可能会导致产生噪声而非有用信号。因此，这可能导致不可靠的信誉评估。缺乏多样化的数据也可能影响贷款决策，因为它无法代表广泛的人口统计或信誉行为。数据的限制也可能导致模型的有效性受到质疑。\n\
  \n### 3.2 缺乏数据标准化\n\n需要标准的方法来确保一致性、可比性和法规合规性。缺乏数据标准化可能导致信誉评估方法不一致，可能会让客户、官员甚至监管机构感到困惑。不同地区有不同的监管要求，如果没有标准程序，银行可能会发现难以满足不断变化的法律要求，并导致罚款和运营风险。不兼容的数据集还会阻碍最佳实践和见解的共享，从而影响信誉评估工具的有效性。另一方面，过度标准化也会阻碍系统。如果银行认为他们无法遵守现有标准，他们可能不愿意尝试新模型。\n\
  \n### 3.3 数据补充担忧\n\n如果补充数据不准确、过时或不完整，可能会降低 AI 模型的性能，导致糟糕的信誉评估。在从其他来源整合额外数据时，可能会出现一些集成挑战。格式不同、数据结构差异或定义不一致可能会阻碍评估模型。银行在获取和使用额外数据时必须确保\
  \ `GDPR`（通用数据保护条例）。如果补充数据存在偏见或缺乏代表性，可能会加剧现有数据中的偏差，导致不公平的贷款行为和声誉损害。对于较小的银行来说，获取补充数据将是一项昂贵的事务，并可能会负担预算。此外，补充数据可能不是实时数据，可能会出现延迟，影响信誉决策的及时性。银行内部利益利益者对补充数据的使用可能有不同意见，如果不进行妥当调整，可能会导致冲突。银行应该制定适当的数据获取策略来克服这些挑战。数据漂移也是影响补充数据源真实性的因素之一。市场动态可能导致数据漂移。\n\
  \n### 3.4 模型选择与评估\n\nAI 领域没有通用的选择。不同的应用如信誉评估、算法评分、个性化建议等可能需要不同类型的模型（Ubarhande &\
  \ Chandani, 2021）。AI 和 `ML` 模型的范围有时让人难以应交。银行必须选择平衡复杂度、可解释性和性能的正确模型，这可能是一项艰的任务（Patel\
  \ & Brown, 2021）。让所选模型与可用数据兼容是另一个挑战。为模型选择选择合适的指标也很重要。财务指标如 `ROI`、成本节约以及客户指标（如满意度评分、参与率等）可以用于模型选择（Schlueter\
  \ et al., 2016）。某些复杂模型可能会过拟合数据，在测试中表现良好但在实际应用中表现不佳。\n\n### 3.5 训练算法\n\nAI 工具缺乏可解释性和复杂性将显著影响用户的信任，特别是在医疗保健和金融领域。缺乏适当的解释会导致困惑，因为用户无法理解\
  \ AI 系统是如何得出特定结论的。在医疗保健领域，可解释 AI 主要用于预测糖尿病、心脏病和不同类型的癌症等疾病的发病。在信用评分、欺诈检测等敏感的财务决策中，向客户解释原因至关重要。但许多\
  \ AI 模型像黑箱一样运行，难以理解背后的原因。AI 这种可解释性的缺乏会损害信任并引发关注（[[2023, Jain]](#979-8-3693-8186-1.ch011.bits-pdf.xhtml#_idTextAnchor669)）。\n\
  \n### 3.6 嵌入偏见\n\n如果在有偏见的数据上进行训练，或者开发者在无意中加入了自己的偏见，AI 算法可能会无意中延续偏见。偏见的模型通常不会被多样化的群体接受。由于\
  \ AI 系统从历史数据中学习，它们更容易受到偏见的影响。如果我们在公司使用 AI 进行招聘，会发现大多数被选候选人是男性。这种差异是因为历史上该公司招募的男性多于女性。这在男性主导的社会中也会发生。这是一个嵌入偏见的例子。AI\
  \ 偏见带来的挑战可以是数据偏见、算法偏见或 AI 开发缺乏多样性，这可能导致不公平的决策。\n\n### 3.7 可解释性与复杂度\n\nAI 工具缺乏可解释性和复杂性显著影响用户的信任，特别是在医疗保健和金融领域。缺乏适当的解释会导致困惑，因为用户无法理解\
  \ AI 系统是如何得出特定结论的。在医疗保健领域，可解释 AI 主要用于预测糖尿病、心脏病和不同类型的癌症等疾病的发病。在信用评分、欺诈检测等敏感的财务决策中，向客户解释原因至关重要。但许多\
  \ AI 模型像黑箱一样运行，难以理解背后的原因。AI 这种可解释性的缺乏会损害信任并引发关注（2023, Brindha Jeyaraman）。\n\n###\
  \ 3.8 网络安全与数据隐私\n\n银行中 AI 驱动的数据大部分基于客户画像、财务行为等敏感信息。保护这些数据免受泄露和滥用对于避免财务损失非常重要。银行通常从第三方供应商获取\
  \ AI 服务，因此这增加了数据泄露的概率。AI 驱动的网络攻击如 AI 驱动的网络钓鱼、深度伪造欺诈、自适应恶意软件也很流行（Enyinaya et al.,\
  \ 2024）。\n\n### 3.9 用户容量\n\n\n\n\n以 AI 能理解的方式表达请求或查询可能是困难的：使用银行服务的消费者群体广泛，且其数字素养程度不一，这加剧了这个问题。只有当客户的数据对于使用这些数据的\
  \ AI 系统而言是有意义且可理解时，银行或金融服务才是有效的。在那种情况下，AI 系统能够识别他们的查询并提供充分的答复。\n\n### 3.10 多语言\n\
  \n鉴于印度语言的多样性，能够以用户的母语言或首选语言接触大多数印度人的 AI 辅助通信系统将是最有效的。然而，目前这仍然很困难，因为缺乏用于自然语言处理和生成算法训练的机器可读的本地语言语料库。目前，能够处理和理解当地语言的\
  \ AI 远落于仅能英语或双语模式运行的 AI。为了有效提供银行或金融服务，基于 AI 的通信平台必须能够理解用户的口语并用相同的语言进行回答。\n\n###\
  \ 3.11 受培训的劳动力\n\n由于缺乏具备必要数据科学能力的专家，该国只有极少数胜任的数据科学家可以从事 AI 工作。除了技能的人力资本匮乏外，目前的银行员工也对最新技术和软件缺乏熟悉度。金融服务部门必须与印度机构合作，培养合格的数据科学家，并建立内部培训计划，使员工能够成功地将\
  \ AI 技术应用于银行业务。全球各大学（包括美国和英国的大学）已开始应对 AI 给金融领域带来的变化，提供金融科技方向的本科和硕士学位。在印度，`HDFC Bank`\
  \ 已与工程学院和 MBA 学院合作，启动了一项教授学生尖端银行技术的倡议。\n\n### 3.12 不同的执行策略\n\n使用 AI 解决方案的金融机构由于不同国家和监管机构之间的执行策略缺乏一致性而面临困难。不同的执行策略使得企业难以采用通行的全球标准，也难以评估在全球范围内使用\
  \ AI 技术时所涉及的风险。\n\n### 3.13 监管与合规挑战\n\n在监管方面，主要问题是数据安全和隐私问题，特别是在遵循法律方面（Lee et al.,\
  \ 2023）。银行在维护消费者数据安全和隐私的同时，必须遵守这些要求。此外，缺乏专门为银行 AI 设计的明确监管框架，这引发了对问责制、透明度和 AI 伦理应用的担忧（Lee,\
  \ 2019）。此外，将风险管理中的 AI 应用与监管机构建立的规范和法规相匹配至关重要。\n\n#### 图 1. AI 驱动的信用评估框架 (FACA)\n\
  \n![979-8-3693-8186-1.ch011.f01](img/979-8-3693-8186-1.ch011.f01.png)\n\n### 4 结论\n\
  \n图 1 总结了本章提出的 AI 驱动的信用评估框架 (`FACA`)。该框架阐了人工智能如何通过提供结构化方法来自动化贷款发放、服务、欺诈检测和风险评估等关键流程，从而改变贷款部门。\n\
