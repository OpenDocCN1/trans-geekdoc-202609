  \ 的 1% 冲击将使 `VIX` 的波动率增加 `0.0050%`。这些结果显示 `VIX` 对 `S&P/TSX` 波动率的影响较大，而 `S&P/TSX`\
  \ 对 `VIX` 波动率的影响相对较小。\n\n参数 `Ψ[TSX]` 和 `Ψ[VIX]` 衡量 `S&P/TSX` 与 `VIX` 之间的相关性，两者在统计上都是显著的。这意味着变量之间存在强相关关系，并具有动态相关结构。\n\
  \n参数 `σ[TSX]` 和 `σ[VIX]` 衡量未来波动率的可预测性，在 5% 的显著性水平上显著。这些参数的平方值 `S&P/TSX` 为 `0.0332`，`VIX`\
  \ 为 `0.2367`。平方值越接近零，波动率的可预测性越高。因此，`σ[TSX]` 波动率的可预测性高于 `σ[VIX]` 波动率，表明 `S&P/TSX`\
