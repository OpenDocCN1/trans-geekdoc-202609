  \ Zhong, G., Dong, J., Wang, S., & Wang, Y. (2019). 基于生成对抗网络的股市预测。《计算机科学进展》(Procedia\
  \ Computer Science), 14.\n\nZhang, K., Zhong, G., Dong, J., Wang, S., & Wang, Y.\
  \ (2019). 基于生成对抗网络的股市预测。《计算机科学进展》(Procedia Computer Science), 14.\n\n（注：提供的文本包含重复引用；为了专业化展示，已对其进行清理。）\n\
  \n## 引言\n\n本章探讨了传统投资组合理论与现代机器学习方法之间的交叉领域，重点关注机器学习如何解决经典模型（如 `MPT` 和 `CAPM`）在应用于加密货币市场时存在的局限性。通过结合这些方法，我们可以开发出更准确反映这些市场真实情况的策略，最终改进决策制定并优化投资结果。\n\
  \n由于加密货币与股票、债券等传统资产的相关性较低，它们已成为现代投资组合中一种极具吸引力的资产类别。与传统金融资产不同，如 `Bitcoin`、`Ethereum`、`Solana`\
  \ 和 `Binance Coin` 等加密货币通常对不同的市场驱动因素（例如投机、技术进步和监管发展）做出反应，导致它们行为独立于传统金融市场。这种差异为多元化提供了重大机会。通过在投资组合中加入加密货币，投资者可以降低与传统资产类别的相关性来降低风险，从而对传统市场风险提供潜在的对冲。\n\
  \n\n\n\n除了多元化之外，加密货币还有潜力作为应对系统性风险（如通胀或金融危机）的对冲工具。比特币通常被称为“数字黄金”，其有限的供应以及在通胀期间保持价值的能力尤为引人注目。与经常受通胀或政府干预影响的传统金融市场相比，比特币等资产表现出了韧性，在传统市场面临巨大压力时充当价值存储手段（Yermack,\
  \ 2024）。通过将加密货币纳入投资组合，投资者获得了新资产类别的风险，这不仅提供了多元化，有助于降低与传统金融资产相关的风险，进一步增强了这些数字资产的战略价值。\n\
  \n机器学习的最新进展为改进价格预测和投资组合管理提供了良好的前景，可能超越传统模型的预测能力。其中一种技术是长短期记忆（LSTM），它是循环神经网络，擅长捕捉序列数据中的非线性模式并建模长期依赖关系（Bukhari\
  \ et al., 2020）。LSTM 在预测加密货币等高波动资产的价格波动方面已展现出巨大潜力（Seabe et al., 2023）。然而，尽管其在时间序列预测中取得了证明的成功，但\
  \ LSTM 在投资组合优化中的应用仍未得到充分探索，有必要对其在该领域的完整能力进行进一步研究。\n\n另一种强大的机器学习方法是极端梯度提升（XGBoost），这是一种基于决策树的算法，以其在回归任务中的高效性和准确性而闻名（Sahin,\
  \ 2020）。XGBoost 特别擅长处理结构化数据并提供高速性能，使其成为波动市场中预测加密货币价格的极具前景的工具（Vuong et al., 2022）。虽然\
  \ XGBoost 天生并非为时间序列数据设计，但其在特征工程中的灵活性使其能够捕捉关键趋势并对比特币、以太坊、Solana 和币安币等加密货币做出稳健预测。\n\
  \n本章将首先评估 LSTM 和 XGBoost 模型在预测加密货币价格方面的性能，以比特币作为主要的分析资产。随后，我们将分析扩展到以太坊、Solana 和币安币，展示如何应用\
  \ LSTM 预测这些加密货币的价格。从这些预测中获得的见解将为旨在实现风险调整收益最大化的资产配置策略提供参考，利用蒙特卡洛模拟和有效前沿等技术。通过研究机器学习模型在价格预测和投资组合优化中的应用，本章将强调这些先进方法在增强加密货币市场投资策略方面的潜力。\n\
  \n## 2. 文献综述\n\n加密货币市场日益增长的波动性和复杂性给传统的投资组合优化模型带来了巨大挑战，例如现代投资组合理论（MPT）和资本资产定价模型（CAPM），这些模型是在资产收益稳定且正态分布的假设下开发的（Markowitz,\
  \ 1952; Sharpe, 1964）。当这些模型应用于加密货币等高波动市场时，其效果较差，因为加密货币的价格波动往往受到市场情绪、投机行为等因素的影响（Giici\
  \ et al., 2020）。例如，MPT 假设资产收益呈正态分布且资产相关性是稳定的，这在加密货币领域均不成立（Alessandretti et al.,\
  \ 2018）。因此，传统模型难以捕捉这些市场的复杂动态，使其在指导投资方面不够可靠。\n\n相比之下，机器学习（ML）技术的最新进展，如长短期记忆（LSTM）和极端梯度提升（XGBoost），在解决这些挑战方面展现了前景。LSTM\
  \ 网络具有建模长期依赖的能力，在预测比特币等资产方面证明特别有效（Bukhari et al., 2020）。通过引入可以随时间保留信息的记忆单元，LSTM\
  \ 能更好地预测受短期波动和长期趋势影响的价格波动（Seabe et al., 2023）。同样，XGBoost 作为一种强大的基于决策树的算法，由于其高效处理结构化数据的能力，在回归任务中被广泛应用（Vuong\
  \ et al., 2022）。\n\nLSTM 和 XGBoost 等机器学习模型的应用已从加密货币市场扩展到更广泛的金融市场预测任务。LSTM 在预测股价和市场指数方面的有效性已有大量文献，Wang\
  \ et al. (2024) 显示了其预测传统金融资产短期价格波动的能力。另一方面，XGBoost 因其在回归任务中的灵活性以及在处理大型复杂数据集时仍提供高速性能的能力而受欢迎（Narvaez\
  \ et al., 2019）。例如，Islam et al. (2021) 证明了使用 XGBoost 在预测美元汇率方面的准确性有了显著提高，这凸显了该算法管理多方面市场数据和增强交易策略的能力。\n\
  \n\n\n\n## 引言\n\n投资组合优化是投资策略制定的一个关键方面，正日益与机器学习模型相结合，特别是在加密货币的背景下（Ma et al., 2020）。传统的投资组合优化技术，如马科维茨组合理论（`MPT`）和\
  \ `CAPM`，长期一直是资产配置和风险管理的基础（Markowitz, 1952）。然而，随着加密货币等高波动市场的兴起，这些模型因无法适应市场变化和极端价格波动而受到批评。最近的研究表明了机器学习在投资组合优化方面优于传统方法的潜力。例如，Shen\
  \ et al. (2021) 发现，使用 `LSTM` 动态调整的投资组合在主动收益和夏普比率方面均优于基准指数，凸显了机器学习在适应变化市场状况方面的优势。同样，Betancourt\
  \ and Chen (2021) 利用深度强化学习（`RL`）进行投资组合优化，表明基于机器学习的投资组合比传统的静态方法产生了更具适应性和响应速度的策略。此外，Dezhkam\
  \ 和 Manzuri (2020) 探索了使用 `XGBoost` 构建投资组合，其中模型的预测见解指导了资产配置并改进了风险调整收益。\n\n尽管取得了这些进展，但将机器学习技术（特别是\
  \ `LSTM` 和 `XGBoost`）整合到加密货币预测和投资组合优化中仍有待进一步探索。大多数现有研究将加密货币价格预测和投资组合优化视为独立的领域，通常对每个领域采用不同的模型和技术。然而，将先进预测方法与优化策略相结合以改进加密货币投资决策的潜在收益尚未被充分探索。\n\
  \n本章采用的方法与 Song (2023) 的研究相似，该研究在股市中应用了基于 `LSTM` 的投资组合优化技术。然而，本研究关注加密货币，其特点是独特的价格行为和市场微观结构，并通过引入\
  \ `XGBoost` 模型扩展了之前的工作。\n\n## 3. 加密货币概述\n\n本章关注四种主要的加密货币：比特币 (`BTC`)、以太坊 (`ETH`)、Sol\
  \ 拉纳 (`SOL`) 和币安币 (`BNB`)。选择这些数字资产是因为它们在全球加密货币市场中具有重要的地位和影响力，以及它们不同的特性为分析提供了多样化的数据支持。\n\
  \n## 3.1 比特币 (BTC)\n\n比特币是第一个且最广泛认可的加密货币，由名为 Satoshi Nakamoto 的匿名实体于 2009 年创建（Nakamoto,\
  \ 2008）。作为一种去中心化的数字货币，比特币运行在点对网络上，不需要中心机构，而是依靠一种名为工作量证明（`PoW`）的共识机制来验证交易。由于其价值存储属性，比特币经常被称为“数字黄金”，并且仍然是市值领先的加密货币（Yermack,\
  \ 2024）。\n\n## 3.2 以太坊 (ETH)\n\n以太坊是 2015 年由 Vitalik Buterin 和其他创始人推出的，通过为去中心化应用（`dApps`）提供平台扩展了区块链。与比特币类似，以太坊的主要区别在于它具有执行编码在区块链上的智能合约的能力（Buterin,\
  \ 2014）。\n\n## 3.3 Solana (SOL)\n\nSolana 是一种较新的加密货币，于 2020 年推出，专注于高吞吐量和扩展性。与比特币和以太坊不同，Solana\
  \ 使用了一种名为历史证明（`PoH`）的新颖共识机制，结合权益证明（`PoS`）以实现高交易速度和低成本（Solana Foundation, 2020）。\n\
  \n## 3.4 币安币 (BNB)\n\n币安币是全球最大的加密货币交易所之一币安交易所的原生加密货币。最初作为币安平台交易手续费折扣的实用型代币推出，`BNB`\
  \ 在加密货币生态系统中扩展了其角色，为支持去中心化应用和 DeFi 项目的区块链平台——币安智能链（`BSC`）提供动力（Binance Academy, 2021）。\n\
  \n## 3.5 选择依据\n\n本研究选择的四种加密货币——比特币、以太坊、Solana 和币安币——代表了加密货币市场的广泛横截，从成熟且广泛采用的比特币和以太坊，到快速演变的\
  \ Solana 和币安币。这种多样性为加密货币价格动态提供了全面的视角，这对于评估在价格预测和投资组合优化中的机器学习模型至关重要。通过包含长期存在的数字货币和新的高性能资产，本研究旨在捕捉广泛的市场行为，并评估\
  \ `LSTM` 和 `XGBoost` 等机器学习算法在预测不同加密货币价格和指导投资组合决策方面的潜力。下面的表 1 提供了获取本研究涵盖的四种主要加密货币市场数据的符号。\n\
  \n\n\n\n\n## 表 1. 加密货币选择\n\n| 符号 | 名称 |\n| --- | --- |\n| BTCUSDT | 比特币 |\n| ETHUSDT\
  \ | 以太坊 |\n| BNBUSDT | 币币 |\n| SOLUSDT | Solana |\n\n## 4. 方法论\n\n本节概述了使用两种先进机器学习学习技术——长短期记忆（LSTM）网络和极端梯度提升（XGBoost）对比特币价格进行建模和预测的方法。该方法侧重于利用历史价格数据预测比特币的未来价格走势，并比较这两个模型在加密货币预测中的性能。本节将详细介绍本研究中使用的数据收集、预处理、模型实现、评估指标以及投资组合优化技术。\n\
  \n### 4.1 数据收集与预处理\n\n本研究使用的数据由上一节介绍的四种主流加密货币的历史数据组成，跨度从 2021 年到 2024 年。数据源自 `Bloomberg\
  \ Terminal`，观测频率为每日。分析的数据集涵盖了 2020 年 11 月到 2024 年 1 月期间。\n\n除了每日收盘价外，数据集还包括其他相关的财务指标，如交易量、移动平均线和波动性指标。这些额外指标为比特币及其他加密货币的市场行为提供了进一步深入的洞察。\n\
  \n预处理步骤包括通过处理缺失值来清洗数据、数据归一化，以及将数据集分为训练集和测试集。具体而言，使用对数差算子对加密货币价格进行标准化，以消除单位根和过度价格波动。这一步骤确保模型在准确且具有代表性的数据上进行训练，同时在未见的数据上对其进行评估，以衡量其稳健性和泛化能力。\n\
  \n### 4.2 长短期记忆 (LSTM)\n\n长短期记忆（LSTM）是循环神经网络（RNN）的一个子集，旨在克服普通 RNN 的局限性，特别是在处理序列输入中的长期依赖关系时\
  \ (Brownlee, 2017)）。LSTM 的独特设计使其能够长时间保留信息，使其非常适合预测加密货币价值，因为加密货币经常同时出短期波动和长期模式。\n\
  \nLSTM 通过集成可以跨多个时间步存储数据的记忆单元来实现这一点。流入和流出这些单元的信息流由三个被称为“门”的基本机制调节：输入门、遗忘门和输出门。这些门对预测过程中哪些信息被保留、更新或丢弃具有显著影响。\n\
  \n**输入门**：该门决定了当前输入信息中有多少被用于修改记忆单元。它规定了新输入中有多少保留在单元状态中。输入门的计算公式为：\n\n```\ni[t]=σ(W[i]x[t]+U[i]h[t−1]+b[i])\
  \ ~ (Input)\n```\n\n其中 `σ` 是 sigmoid 激活函数，`x[t]` 是当前时间步的输入，`h[t−1]` 是上一个时间步的隐藏状态，`W[i]`\
  \ 和 `U[i]` 是权重矩阵，`b[i]` 是偏置。\n\n**遗忘门**：应该保留还是擦除上一个单元的记忆由遗忘门决定。它过滤掉上一个时间步的无关数据。其计算方式为：\n\
  \n```\nf[t]=σ(W[f]x[t]+U[f]h[t−1]+b[f]) ~ (Forget)\n```\n\n遗忘门的值范围于 0 到 1 之间，影响了先前的单元状态\
  \ `c[t−1]` 的保留比例。\n\n**输出门**：输出门调节从当前记忆单元发送到下一层或下一个时间步的数据量。它决定了更新后的单元状态中哪些部分贡献于隐藏状态。输出门的计算如下：\n\
  \n```\nO[t]=σ(W[o]x[t]+U[o]h[t−1]+b[o]) ~ (Output)\n```\n\n计算出门值后，根据输入门和遗忘门的交互更新\
  \ LSTM 中的记忆单元。首先，使用双曲正切（tanh）激活函数建立一个候选单元状态，该函数考虑了当前输入和先前的隐藏状态。该候选状态反映了将添加到单元状态的最新数据。\n\
  \n$\\tilde{c}_{t} = tanh(W_{c}x_{t} + U_{c}h_{t - 1} + b_{c})$\n\n下一步是更新单元状态 `c[t]`，这是\
  \ LSTM 网络中维持长期记忆的关键。虽然输入门 `i[t]` 调节了引入候选单元状态 $\\tilde{c}_{t}$ 的量，但遗忘门 `f[t]` 决定了应保留多少旧单元状态\
  \ `c[t−1]`。单元状态更新如下：\n\n```\nc_t = f_t \\times c_{t-1} + i_t \\times \\tilde{c}_t\n\
  ```\n\nLSTM 单元在当前时间步的输出，即隐藏状态，必须通过输出门对更新后的单元状态进行压缩在 -1 到 1 之间得到：\n\n```\nh[t]=O[t]\
  \ \\times tanh(c[t])\n```\n\n该隐藏状态 `h[t]` 既是 LSTM 单元的输出，也是下一个时间步的输入。这一过程使得 LSTM\
  \ 能够捕捉序列中的依赖，成为预测加密货币波动的有效工具。\n\n#### 图 1. 图表\n\n![979-8-3693-8186-1.ch013.f01](img/979-8-3693-8186-1.ch013.f01.png)\n\
  \n图 2 提供了 LSTM 学习过程的总结。通过这些机制，LSTM 模型能够学习序列数据中的复杂关系（例如加密货币的历史模式），并预测未来的价格趋势 (Wahid,\
  \ 2024)。\n\n#### 图 2. LSTM 的工作机制\n\n![979-8-3693-8186-1.ch013.f02](img/979-8-3693-8186-1.ch013.f02.png)\n\
  \n(Olah, 2015)\n\n### 4.3 极端梯度提升 (XGBoost)\n\n极端梯度提升（XGBoost）是一种先进的梯度提升方法，旨在提高机器学习模型的性能、可扩展性和效率，特别是在回归和分类任务中\
  \ (Wade & Glynn, 2020)。\n\nXGBoost 基于按顺序构建模型的梯度提升框架 (Zhu et al., 2021)。序列中每个后续模型的目标都是修复早期版本的错误。\n\
  \n\n\n\n\n在梯度提升（Gradient Boosting）框架中，树（通常是决策树）是顺序创建的，以最小化给定的损失函数。其目标是通过迭代减少误差，在已学习知识的基础上优化模型的预测。从数学角度来看，该模型表示为：\n\
  \n$\\hat{y\\_{i}} = {\\\\sum\\\\limits\\_{k = 1}^{K}{f\\_{k}\\\\left( x\\_{i} \\\
  right),f\\_{k} \\in F}}$\n\n其中，最终模型是这些学习器的和，`f`[*k] 代表单个弱学习器。在 XGBoost 中，目标函数表示如下：\n\
  \n$obj\\left( \\theta \\right) = {\\\\sum\\\\limits\\_{k = 1}^{n}{l\\left( {y\\\
  _{i},\\\\hat{y\\_{i}}} \\right) + {\\\\sum\\\\limits\\_{k = 1}^{K}{\\\\Omega\\left(\
  \ f\\_{k} \\right)}}}}$\n\n在这里，$l\\left( {y\\_{i},\\\\hat{y\\_{i}}} \\right)$ 是损失函数，`Ω`(`f`[*k*])\
  \ 是正则化项，用于控制模型复杂性以避免过拟合。XGBoost 并不是一次性训练整个模型，而是采用加法训练过程，通过添加每个新树 `f`*t*)来最小化当前模型的误差。在每次迭代\
  \ `t` 中，模型更新定义为：\n\n`ŷ`[*i*]^((*t*)) = `ŷ`[*i*]^((*t* −  1)) + `f`*t*\n\n新模型预测\
  \ `ŷ`[*i*]^((*t*)) 是之前的预测 `ŷ`[*i*]^((*t* −  1)) 与新添加树 `f`*t* 输出之和。\n\nXGBoost\
  \ 使用正则化来管理树的复杂度并减少过拟合。正则化项 `Ω`(`f`[*k*])的定义如下：\n\n$\\\\Omega\\left( f \\right) =\
  \ \\gamma T + \\frac{1}{2}\\\\lambda{\\\\sum\\\\limits\\_{j = 1}^{T}w\\_{j}^{2}}$\n\
  \n其中 `T` 是叶子数量，`γ` 是添加新叶子的惩罚，`λ` 是针对叶子权重 `w`[*j] 的 L2 正则化项。\n\n剪枝用于通过控制执行分裂所需的最小增益来防止树的过度生长。如果分裂没有产生足够的增益，则对其进行剪枝以减少过拟合。\n\
  \nXGBoost 使用梯度下降法通过调整弱学习器来最小化损失函数。目标函数使用二阶泰勒展开进行近似：\n\n${obj}^{(t)} = {\\\\sum\\\
  \\limits\\_{i = 1}^{n}{\\\\left\\\\lbrack {g\\_{j}f\\_{t}\\\\left\\\\lbrack x\\\
  _{i} \\\\right]\\\\rbrack + \\\\frac{1}{2}h\\_{i}f\\_{t}^{2}\\\\left\\\\lbrack x\\\
  _{i} \\\\right]\\\\rbrack} \\\\right\\\\rbrack + \\\\Omega\\\\left( f \\\\right)}}}$\n\
  \n在这里，`g`[*j] 和 `h`[*i] 是损失函数对预测值的一阶和二阶导数。泰勒展开简化了过程并使其更加高效（Xie et al., 2022）。\n\n\
  在 XGBoost 中，权重被分配给预测的残差，使其产生影响。例如，增益的计算方式为：\n\n$Gain = \\frac{1}{2} \\left[ \\frac{(G_L\
  \ + G_R)²}{H_L + H_R + \\lambda} - \\frac{G_L²}{H_L + \\lambda} - \\frac{G_R²}{H_R\
  \ + \\lambda} \\right] - \\gamma$\n\n其中 `G_L`、`G_R`、`H_L` 和 `H_R` 分别代表左、右分支的梯度和海森矩阵（hessians）。\n\
  \n\n\n\n\n$\\sigma_{p}^{2} = {\\sum\\limits_{1}w_{i}^{2}}\\sigma_{i}^{2} + {\\sum\\\
  limits_{i}{\\sum\\limits_{j}{w_{i}w_{j}\\sigma_{i}\\sigma_{j}\\rho_{ij}}}$\n\n由于相关性较小或负相关的资产可能会降低投资组合的总风险，该方法同时考虑了每个资产的风险以及资产之间的相互作用。\n\
  \n投资组合的表现使用`Sharpe Ratio`（夏普比率）进行评估，该比率计算风险调整后的收益。`Sharpe Ratio`的计算方法如下：\n\n`Sharpe\
  \ Ratio` = $\\frac{R_p - R_f}{\\sigma_p}$\n\n其中 `sigma_p` 代表投资组合的标准差，`R_f` 代表无风险利率，`R_p`\
  \ 是投资组合的预期收益。该比例有助于投资者评估与无风险投资相比，其组合中所承担的风险是否获得了充分补偿。\n\n`Mean-Variance Model`（均值方差模型）有助于识别处于有效前沿的投资组合，有效前沿是投资组合在给定风险水平下获得最佳预期收益的区域。投资者特别关注两个最优投资组合：一个是使`Sharpe\
  \ ratio`最大化的组合，另一个是在预期收益下波动率最小的组合。\n\n#### 4.6 蒙特卡洛模拟\n\n`Monte Carlo method`（蒙特卡洛方法）是一种强大的统计技术，依赖随机采样和模拟来解决传统确定性方法难以处理的复杂问题（Rubinstein\
  \ & Kroese, 2016）。通过运行大量的模拟，它产生一系列可能的结果，允许对概率进行估计、预测未来事件并近似求解。这种方法在具有内在不确定性的场景（如金融市场）中特别有用，因为它考虑了变性和随机性。在投资组合优化的背景下，蒙特卡洛方法被用于根据资产的不同配置模拟广泛的潜在投资组合收益，有助于评估不同的风险-收益场景。通过生成成千上万可能的投资组合组合，它提供了一个稳健的框架，用于理解不同的资产配置在各种市场条件下的表现，从而做出更明智的投资决策。该方法在理解加密货币投资组合的潜在结果范围非常有价值，因为波动性和市场动态通常是不可预测的。\n\
  \n#### 4.7 有效前沿\n\n有效前沿是现代投资组合理论中的基本概念，它描勒了在特定风险水平下提供最大预期利润或在指定收益水平下提供最低可行风险的最优组合集合。由于没有其他组合可以在不增加风险的情况下提供更高的预期收益，或在不降低收益的情况下提供更低的风险，落在有效前沿上的投资组合被认为是最优的，因为它们在风险和收益之间实现了最有效的平衡（Merton,\
  \ 1972）。在本研究中，使用有效前沿通过视觉和分析识别最优加密货币投资组合。通过绘制各种投资组合的风险（波动率）与预期收益的关系图，有效前沿突出了提供最佳风险调整收益的投资组合。利用蒙特卡洛方法生成成千上万个随机投资组合配置，据此构建有效前沿。这是投资加密货币时可以进行的风险-收益衡的清晰示例，并通过协助识别在特定风险水平下收益最大化或在预期收益下风险最小化的投资组合，为投资组合配置和优化提供了有用信息。\n\
  \n#### 4.8 网格搜索与模型调优\n\n确定特定机器学习模型理想超参数 set 的常用超参数调优技术是网格搜索（Hossain & Timmer, 2021）。网格搜索中的每个模型参数都有一组预定义的超参数值，并对这些参数的每种可能的组合对模型进行训练和评估。在投资组合优化任务中，目标是根据所选的评估参数（如准确率、均方误差\
  \ `MSE` 或 `Sharpe ratio`）来确定哪种组合产生最高性能。例如，在使用`LSTM`时，可以使用网格搜索优化 epoch 数（epochs）、`batch\
  \ size`（批大小）、学习率（learning rate）或每层单元数等超参数。如果你为每个超参数定义了多个值（例如，`batch sizes` 为 1,\
  \ 16, 32，`epochs` 为 10, 50, 100），网格搜索将测试每个组合，例如 `batch size = 1` 和 `epochs = 10`，`batch\
  \ size = 16` 和 `epochs = 50` 等。\n\n在网格搜索过程中，会在验证集上评估每个组合的模型性能，并选择产生最佳验证性能的组合。这种方法确保了模型能够根据计算成本、训练时间和性能等现实约束给出最优结果。\n\
  \n由于网格搜索评估参数的每种可能的组合，其计算成本可能很高，特别是在处理大型数据集或复杂模型时（Syarif et al., 2016）。然而，它为超参数调优提供了一种系统且彻底的方法，并对于优化如\
  \ `LSTM` 等机器学习模型非常有用，因为正确的参数组合会显著影响性能。通过采用随机搜索策略或更复杂的方法（如贝叶斯优化）来更智能地探索超参数空间，可以使网格搜索更加有效。\n\
  \n### 5. 结果与预测性能\n\n#### 5.1 使用 LSTM 预测比特币价格\n\n为了预测比特币价格，使用比特币的历史收盘价作为输入开发了长期记忆（`LSTM`）模型。数据集被分为两个部分：20%\
  \ 用于测试，80% 用于模型训练。为了确保有效学习，数据被归一化到 0 到 1 之间。使用连续 60 天的历史价格序列作为输入训练模型，目标是预测次日价格。\n\
  \n`LSTM` 模型由两层 `LSTM` 组成，旨在捕捉长期依赖关系并识别序列数据中的模式。在 `LSTM` 层之后，模型中添加了两个全连接层（`Dense`）。这些层共同工作输出次日的预测比特币价格。使用\
  \ `Adam` 优化器来优化模型，并使用均方误差（`MSE`）对性能进行评估，该指标量化了价格与预测价格之间的差异。\n\n#### 图 4. LSTM 模型摘要\n\
  \n![979-8-3693-8186-1.ch013.f04](img/979-8-3693-8186-1.ch013.f04.png)\n\n\n\n\n\n\
  用于训练 `Long Short-Term Memory (LSTM)` 模型的批大小（batch size）为 `16`，迭代次数（epochs）为 `100`。`batch\
  \ size` 指在模型内部参数更新之前处理的训练样本数量。较小的批大小（如 `16`）可以通过更频繁地更新模型权重来导致更快的收敛。然而，由于每个批次仅代表整个数据集的一小部分，它可能会为权重更新引入额外的噪声。相反，较大的批大小可能导致学习速度较慢，但更新更稳定，因为它们反映了更广泛的数据。\n\
  \n`epochs` 的数量表示模型遍历整个训练数据集的次数。在实验中，模型训练了 `100` 个 `epochs`，这使其能够持续从数据中学习并相应地调整其权重。虽然较高的\
  \ `epochs` 能够让模型捕捉更复杂的模式，但也增加了过拟合的风险——即模型在训练数据上表现良好，但在泛化到新的未见数据时表现挣扎。选择 `16` 作为批大小和\
  \ `100` 个 `epochs` 代表了频繁更新与充分数据暴露之间的平衡，从而优化了模型预测未来比特币价格的能力。\n\n训练完成后，模型在测试数据集上进行价格预测，并将这些预测值重标回其原始比例。为了评估模型的性能，计算了`均方根误差\
  \ (RMSE)`，它量化了预测价格与实际价格之间的平均差异。对于该模型，`RMSE` 为 `684.792`，`平均绝对误差 (MAE)` 为 `722.25`，`R\
  \ 方值 (R²)` 为 `0.97`。最后，通过在图 5 和图 6 中绘制实际价格和预测价格来实现结果可视化。\n\n#### 图 5.基于 LSTM 的比特币价格预测\n\
  \n![979-8-3693-8186-1.ch013.f05](img/979-8-3693-8186-1.ch013.f05.png)\n\n利用 `LSTM`\
  \ 模型预测未来比特币价格模式的结果显示出极高的精度。预期的价格线与实际价格线相似，两者之间仅有细微差异。\n\n#### 图 6.基于 LSTM 的比特币价格预测\n\
  \n![979-8-3693-8186-1.ch013.f06](img/979-8-3693-8186-1.ch013.f06.png)\n\n值得注意的是，模型能够迅速适应趋势变化（包括价格的上升和下跌），证明了其处理加密货币市场固有波动性的能力。这种程度的精度强调了\
  \ `LSTM` 在时间序列预测方面的优势，特别是对于需要同时捕捉长期依赖关系和短期波动的复杂金融数据集。\n\n`LSTM` 的架构整合了记忆单元和门控机制，使其能够在长时间保留相关的历史信息，同时根据新数据动态更新预测。这使得它对于需要捕捉时间依赖的任务特别有效。\n\
  \n#### 5. 使用 XGBoost 进行预测\n\n虽然 `LSTM` 在处理序列数据方面非常强大，但 `XGBoost` 是一种梯度提升决策框架，在处理表格化数据方面表现出色。`XGBoost`\
  \ 的架构通过构建决策树集成，并顺序添加树来纠正之前树的错误，从而实现损失最小化。这使其在捕捉金融数据集中的非线性关系时特别有效。\n\n\n\n\n\n图 10\
  \ 和 图 11 展示了优化后的 `XGBoost` 模型下实际价格与预测价格的对比图。虽然预测捕捉到了比特币价格的总体趋势，但其准确性明显低于 `LSTM`\
  \ 模型。尽管 `XGBoost` 准确地预测了价格变化的整体方向，但在某些情况下，预测价格与实际价格存在显著偏差。特别是预测价格线在某些点与实际价格线大幅偏离，凸显了该模型在捕捉数据中细粒度波动方面的局限性。\n\
  \n#### 图 10. XGBoost 预测的比特币价格\n\n![979-8-3693-8186-1.ch013.f10](img/979-8-3693-8186-1.ch013.f10.png)\n\
  \n此外，还存在 `XGBoost` 在实际价格上涨时预测为下降趋势的情况，导致了反向趋势预测。\n\n#### 图 11. XGBoost 预测的比特币价格\n\
  \n![979-8-3693-8186-1.ch013.f11](img/979-8-3693-8186-1.ch013.f11.png)\n\n在之前的实验中，对于\
  \ `XGBoost` 预测比特币价格的性能出现了一些担忧。尽管模型成功捕捉到了总体趋势，但预测价格与实际价格之间往往表现出显著偏差。在某些情况下，预测甚至显示出反向趋势，即在实际价格上涨时模型预测价格下降。导致这些不准确性的一种可能解释是比特币高昂和巨大的市值，这可能会降低模型对微小价格波动的敏感性。考虑到比特币的峰值价格\
  \ $64,872，市值达 1.28 万亿美元，即使是微小的百分比变化也会导致巨大的绝对差异，从而可能放大预测误差。此外，`XGBoost` 基于树的架构不太适用于时间序列数据，可能难以捕捉像比特币这样高波动资产的细微差别。这与\
  \ `LSTM` 等模型形成对比，后者更好地处理序列依赖关系 (Brini & Lenz, 2024)。\n\n#### 5.3 Solana 作为低价格的替代方案\n\
  \n为了评估 `XGBoost` 在价格较低且波动较小的资产上表现是否更好，使用 Solana 进行了额外的实验。Solana 的价格图表见图 12。Solana\
  \ 的峰值价格为 $154.72，市值为 730 亿美元，代表了价格更适中的资产。这一替代测试旨在评估 `XGBoost` 是否更适合预测价格较低且波动较小的资产。\n\
  \n#### 图 12. XGBoost 预测的比特币价格\n\n![979-8-3693-8186-1.ch013.f12](img/979-8-3693-8186-1.ch013.f12.png)\n\
  \n在之前的实验中，对于 `XGBoost` 预测比特币价格的性能出现了一些担忧。尽管模型成功捕捉到了总体趋势，但预测价格与实际价格之间往往表现出显著偏差。在某些情况下，预测甚至显示出反向趋势，即在实际价格上涨时模型预测价格下降。导致这些不准确性的一种可能解释是比特币高昂和巨大的市值，这可能会降低模型对微小价格波动的敏感性。考虑到比特币的峰值价格\
  \ $64,872，市值达 1.28 万亿美元，即使是微小的百分比变化也会导致巨大的绝对差异，从而可能放大预测误差。此外，`XGBoost` 基于树的架构不太适用于时间序列数据，可能难以捕捉像比特币这样高波动资产的细微差别。这与\
  \ `LSTM` 等模型形成对比，后者更好地处理序列依赖关系 (Brini & Lenz, 2024)。\n\n预测 Solana 的过程遵循相同的步骤。首先，收集\
  \ Solana 的历史数据，并计算各种指标——例如 9 日指数移动平均线 (`EMA`)、10 日、15 日和 30 日简单平均线 (`SMA`)。为了进一步捕捉动量，还计算了移动平均收收离指数\
  \ (`MACD`) 和相对强度指数 (`RSI`)。然后将数据分为两组：训练集（80%）和测试集（20%）。训练后，使用均方误差 (`MSE`) 作为评价指标。\n\
  \n#### 图 13. XGBoost 预测的比特币价格\n\n![979-8-3693-8186-1.ch013.f13](img/979-8-3693-8186-1.ch013.f13.png)\n\
  \n#### 图 14. XGBoost 预测的比特币价格\n\n![979-8-3693-8186-1.ch013.f14](img/979-8-3693-8186-1.ch013.f14.png)\n\
  \n#### 5.4 使用长短期记忆网络 (LSTM) 进行组合配置与优化\n\n鉴于 `LSTM` 在加密货币价格预测方面优于 `XGBoost`，它成为实施我们加密货币投资组合策略的首选候选。目标是利用\
  \ `LSTM` 捕捉加密货币市场短期波动和长期趋势的能力，为更有效的投资组合配置决策提供支持。\n\n##### 5.4.1 均值与方差统计\n\n####\
  \ 图 15. 加密货币的统计摘要\n\n![979-8-3693-8186-1.ch013.f15](img/979-8-3693-8186-1.ch013.f15.png)\n\
  \n\n\n\n\n图 15 对所选的加密货币 ——比特币、以太坊、币安币和 Solana —— 进行了统计总结，提供了关于它们在测试期间价格行为的关键见解。比特币作为市场中最显眼的加密货币，展现出最高的平均价格。然而，它也表现出最大的波动性，这从其巨大的标准差中看出。这表明比特币在整个一年里经历了显著的价格波动。以太坊和币安币的平均价格低于比特币，但表现出中等波动性，其中币安币与其他者相比显示出相对稳定的价格范围。\n\
  \nSolana 尽管平均价格较低，但表现出最高的相对波动性，其巨大的标准差以及最高、最低价格之间的巨大范围证明了这一点。这表明 Solana 经历了显著的价格波动，包括剧烈的飙升，使其与其他资产相比成为更具风险的资产。所有四种资产的四分位范围（第\
  \ 25 到 75 百分位数）表明，大部分价格波动保持在稳定范围内。然而，最高价格突出了潜在的离群事件，这些事件可能会对投资组合收益产生重大影响。这些发现强调了这些加密货币不同的风险收益特征，比特币和以太坊提供了更多的稳定性，而\
  \ Solana 则具有更高的波动性，这对于投资组合优化策略至关重要。\n\n#### 图 16. 四种加密货币的累计收益\n\n![979-8-3693-8186-1.ch013.f16](img/979-8-3693-8186-1.ch013.f16.png)\n\
  \n图 16 所示的累计收益时间序列图突显了比特币 (BTC)、以太坊 (ETH)、币安币 (BNB) 和 Solana (SOL) 之间显著的性能差异。图表揭示了每种加密货币从\
  \ 2023 年 1 月到 2024 年 1 月的累计收益。Solana (SOL) 在四者中表现出最明显的上升趋势，特别是在 2023 年的后几个月。几个因素导致了这一点，包括市场对\
  \ Solana 区块发展的反应、去中心化应用的使用增加以及重大的网络升级，导致累计收益增长了近十倍。这种剧烈上升强调了 Solana 的投机性质和巨大收益的潜力，尽管这种快速增长通常伴随着风险的增加。\n\
  \n比特币 (BTC) 作为最受认可的加密货币，在全年显示出更一致的收益。尽管它的增长没有 Solana 那么，但比特币继续巩固其在加密货币市场的主导地位。以太坊\
  \ (ETH) 显示出稳健增长，反映了其在智能合约功能和去中心化金融 (DeFi) 领域的领先。虽然 ETH 和 BTC 有相似之处，但以太坊的表现略微波动，受到网络更新（如以太坊合并）等因素的影响。相比之下，币安币\
  \ (BNB) 作为币安交易所的实用代币，遵循更为谨慎的增长轨迹。其相对稳定的增长表明，与其他加密货币相比，波动性较低。\n\n总的来说，这种比较强调了这些加密货币不同的风险收益特征。风险承受能力较高的投资者可能会发现\
  \ Solana 因其波动性和快速增长而具有吸引力，定位为高风险、高回报的资产。相反，寻求稳定收益的风险厌恶型投资者可能会被比特币、以太坊和币安币吸引，因为这些资产提供了更大的稳定性。\n\
  \n#### 5.4.2 相关性分析\n\n相关性热图 (图 17) 为比特币 (BTCUSDT)、以太坊 (ETHUSDT)、币安币 (BNBUSDT) 和\
  \ Solana (SOLUSDT) 在一年内的收盘价之间的关系提供了宝贵的见解。分析显示比特币和以太坊之间存在强正相关 (0.91)，表明这两种资产表现出高度同步的价格移动，可能对市场状况做出相似的反应。比特币和\
  \ Solana 之间存在同样强的相关性 (0.85)，表明 Solana 的价格趋势紧密跟随比特币。以太坊和 Solana 之间的相关性 (0.75) 为中等强度，表明尽管这两种资产通常朝相同方向移动，但它们之间的关系没有比特币和以太坊那样紧密。\n\
  \n相反，币安币表现出明显不同的相关性模式。它与以太坊呈弱正相关 (0.05)，与 Solana 几无相关 (0.06)，与比特币呈轻微负 (-0.23)。总而言之，对比特币、以太坊、币安币和\
  \ Solana 价格变化的分析为未来的建模奠定了坚实的基础。\n\n#### 图 17. 加密货币热图\n\n![979-8-3693-8186-1.ch013.f17](img/979-8-3693-8186-1.ch013.f17.png)\n\
  \n#### 5.5 投资组合优化\n\n在使用长短期记忆 (LSTM) 进行投资组合配置和优化时，预测方法与之前的步骤基本相同：两个各 100 个单元的 LSTM\
  \ 层、一个 25 单元的全连接层和一个 1 个单元的输出层。通过对训练参数的关键调整，将批量大小 (batch size)设置为 `1`，并将迭代次数 (epochs)\
  \ 减少到 `10`。使用 `1` 的较小批量允许对模型权重进行更精细的更新，确保模型从每个数据点中学习。然而，这带来了更高的计算成本，特别是在处理大型数据集时。将迭代次数减少到\
  \ `10` 有助于缓解训练时间，同时确保模型捕捉到本质模式。\n\n 表 2 预测的均方根误差\n\n| 加密货币名称 | 均方根误差 (RMSE) |\n\
  | --- | --- |\n| 比特币 | 1552.471 |\n| 以太坊 | 68.186 |\n| 币安币 | 8.695 |\n| Solana |\
  \ 10.889 |\n\n#### 图 18. LSTM 预测四种加密货币的价格\n\n![979-8-3693-8186-1.ch013.f18](img/979-8-3693-8186-1.ch013.f18.png)\n\
  \n从生成的图可以看出，预测的加密货币价格与实际价格紧密贴合，有效地捕捉到了整体趋势。这证明了模型准确预测价格移动的能力，并强调了使用 `LSTM` 的优势。预测值与实际值之间的强相关性展示了\
  \ `LSTM` 分析序列数据的能力，使其成为加密货币等波动市场预测的可靠工具。\n\n\n\n\n在计算出每种加密货币的每日百分比收益后，模拟为每个组合随机生成资产权重，确保总权重之和为\
  \ 1。假设每年有 252 个交易日，使用每种资产收益的加权平均值来估计组合的年化收益。随后利用资产收益的协方差矩阵计算组合波动率，从而量化整体风险。最后，通过从组合收益中减去无风险率并除以其波动率，计算出`Sharpe\
  \ ratio`，代表风险调整后的收益。\n\n### 表 3. 两种方法的投资组合分配权重\n\n| | BTC | ETH | BNB | SOL |\n\
  | :--- | :--- | :--- | :--- | :--- |\n| --- | --- | --- | --- | --- |\n| 最大夏普比率\
  \ | 7.854% | 3.013% | 57.351% | 31.782% |\n| --- | --- | --- | --- | --- |\n| 最小波动率\
  \ | 32.024% | 16.889% | 48.827% | 2.259% |\n\n`Table 3` 总结了模拟下两个优化投资组合的权重：具有`maximum\
  \ Sharpe ratio`的组合提供了最佳的风险调整后收益，而具有`minimum volatility`的组合则提供了最低的风险。对于这两个组合，均展示了预期收益、波动率、`Sharpe\
  \ ratio`以及特定的资产配置等关键统计数据。\n\n### 图 19. 有效前沿\n\n![979-3693-8186-1.f19](img/979-3693-8186-1.f19.png)\n\
  \n`Figure 19` 展示了有效前沿的可视化，说明了组合波动率（风险）与预期收益之间的关系。所有模拟组合都绘制在散点图上，并根据它们的`Sharpe ratios`进行颜色编码。图中突出了两个关键组合：`maximum\
  \ Sharpe ratio` 组合（用红色星号表示）和 `minimum volatility` 组合（用蓝色标记）。这种可视化有助于说明风险与收益之间的权衡，为基于不同风险风险承受度的最优配置策略提供了宝贵的见解。\n\
  \n使用`LSTM`预测进行投资组合优化的结果表明，该模型在组合配置方面非常有效。`maximum Sharpe ratio` 组合显示出约 2.37 的高收益，波动率为\
  \ 0.38，产生了令人印象深刻的 6.18 `Sharpe ratio`，标志着卓越的风险调整后收益。该组合多元化良好，在`Binance Coin`和`Solana`中占有很大权重，这贡献了其强劲的表现。`minimum\
  \ volatility` 组合也展示了良好的风险收益平衡，`Sharpe ratio`为 4.69，波动率较低为 0.28，使其成为风险厌恶投资者的极具吸引力的选择。这些结果表明，使用\
  \ `LSTM` 预测加密货币价格为构建优化投资组合提供了坚实的基础，因为该模型捕捉了关键市场趋势，导致了高效的配置策略。因此，`LSTM`可以成为组合管理中非常有价值的工具，特别是在加密货币等波动较大的市场中。\n\
  \n为了比较加密货币投资组合的性能，我们首先计算了实际每日复合收益。这是在计算组合中每种加密货币的每日收益后，应用源自`Maximum Sharpe Ratio`和`Minimum\
  \ Volatility`技术的组合权重实现的。然后对每日收益进行复合计算，以确定每天的总收益。累计收益通过连续相乘每日复合收益获得。通过将这两种拟议组合策略的累计收益与基准指数`CMI10`（加密市场指数\
  \ 10）进行比较，对所提组合的性能进行了彻底评估。这种比较通过评估预测组合配置相对于更广泛的加密货币市场的表现，为每种方法的有效性提供了宝贵的见解。\n\n\
  ### 图 20. 两种方法与 CMI 10 累计收益的比较\n\n![979-3693-8186-1.f20](img/979-3693-8186-1.f20.png)\n\
  \n图表清楚地表明，在观察期间，`Maximum Sharpe Ratio`和`Minimum Volatility`投资组合策略都显著优于`CMI 10`（加密市场指数\
  \ 10）基准。`maximum Sharpe ratio`组合表现出最高的累计收益，凸显了其在优化风险与收益平衡以实现收益最大化方面的有效性。相比之下，`Minimum\
  \ Volatility`组合虽然更为保守，但仍然成功优于`CMI 10`指数，在较低风险和竞争性收益之间提供了良好的平衡。这些结果表明，两种策略（特别是当使用`LSTM`-预测数据进行优化时）相对于由`CMI\
  \ 10`代表的更广泛的加密货币市场极具竞争力。这些组合持续优于市场指数的能力强调了机器学习驱动的投资组合配置在实现卓越投资性能方面的潜力。\n\n## 6.\
  \ 结论\n\n本研究对两种广泛使用的机器学习模型——用于比特币价格预测和加密货币预测的`LSTM`和`XGBoost`进行了全面的比较。结果显示，`LSTM`在预测时间价格方面非常出色，它能够捕捉时间模式和长期依赖关系。相比之下，`XGBoost`虽然在处理结构化数据方面有效，但在预测`Solana`等低价资产方面面临挑战。\n\
  \n在投资组合优化方面，使用`LSTM`构建`maximum Sharpe ratios`和`minimum volatility`组合展示了其在预测方面的优势，以及在平衡风险和收益方面的实力。通过`Mean-Variance\
  \ Model`、`Monte Carlo simulations`和`efficient frontier`，该研究说明了机器学习如何增强投资策略。\n\n\
  总而言之，研究结果表明`LSTM`在时间序列预测和组合管理方面具有明显优势，为投资者提供了宝贵的见解。未来的研究可以探索混合模型、特征工程或更多数据源，以进一步提高`XGBoost`等机器学习模型在金融应用中的性能。\n\
