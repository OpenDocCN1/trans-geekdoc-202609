  \n\n\n\n\n从加拿大视角来看，分析 `S&P/TSX` 与全球主要市场指数（包括 `S&P500`、`Gold`、`WTI`、`VIX` 和 `BO`）之间的波动传递具有特殊意义。加拿大市场与全球经济高度整合，对全球大宗商品（特别是石油）和其他资源具有巨大的风险敞口。因此，全球市场的波动会对\
  \ `S&P/TSX` 指数产生实质影响，因为该指数能源和自然资源股票的权重很高。此外，与 `U.S.` 或 `Eurozone` 等大型经济体相比，加拿大的市场规模较小，使其更容易受到外部冲击，从而导致来自全球市场的波动溢出。通过理解全球市场（如\
  \ `S&P500` 或 `Gold`）的波动如何影响加拿大市场，金融专业人士可以更好地预测风险、优化组合配置并改进资产多元化策略。\n\n本文通过动态相关多变量随机波动模型\
  \ (`DC-MSV`) 模拟 `S&P/TSX` 与其他主要指数之间的波动传递，旨在加深对这些相互关系的理解。该模型非常有价值，因为它考虑了波动的随时间变化的特性，并允许详细检查波动如何在多个市场之间传播。通过采用这种方法，本文利用特定期间的每日市场指数收益率，对\
  \ `S&P/TSX` 与其他全球金融市场之间的相关性动态 string 了全面分析。研究结果为波动溢出的方向和幅度提供了关键见解，阐明了 `S&P/TSX`\
  \ 指数的冲击如何影响其他市场，反之亦然。这些发现对于加拿大金融专业人士特别重要，因为在日益互联的金融格局中，它们可以为风险管理、组合构建和市场择机策略提供参考。\n\
  \n研究的主要发现显示，`S&P/TSX` 指数对传统的避险资产 `Gold` 表现出最强的波动传递性，且影响显著。这表明，在市场压力时期，加拿大投资者可能将\
  \ `Gold` 视为对冲国内股票市场波动的工具。此外，观察到 `S&P/TSX` 与 `S&P500` 等其他主要指数之间存在双向波动传递，凸显了这些市场的互联互通。有趣的是，研究还显示从\
  \ `S&P/TSX` 到 `WTI` 和 `BO`（油价）的波动传递非常显著，这强调了能源价格在塑造加拿大市场情绪中的关键作用。虽然加拿大市场似乎受到 `VIX`\
  \ 的显著影响，但其将波动传递到 `VIX` 的程度并不相同。这些结果不仅为 `S&P/TSX` 的特定动态提供了宝贵的见解，还有助于对加拿大市场如何与关键全球金融指标相互作用有更广泛的理解。\n\
  \n本文部分的结构如下：第 2 节`文献综述` (`Literature Review`) 概述了关于油价、股市指数和其他金融资产之间波动传递的相关研究，强调了该领域的关键方法和发现。第\
  \ 3 节`金融市场概述` (`Overview of the Financial Markets`) 介绍了本研究考察的关键金融市场，包括 `S&P/TSX`、`S&P500`、`Gold`、`VIX`、布伦特原油\
  \ (`BO`) 和德克萨斯州中期原油 (`WTI`)，重点介绍了它们的特征以及与波动传递研究的相关性。第 4 节`方法论` (`Methodology`) 概述了用于分析这些市场之间动态波动相互作用的随机变量随机波动\
  \ (`DC-MSV`) 模型。第 5 节`数据与发现` (`Data and Findings`) 展示了波动传递分析的实证结果，提供了有关市场之间关系和随变化的波动溢出的详细见解。第\
  \ 6 节`启示` (`Implications`) 讨论了这些发现对金融专业人士、投资者和决策制定者（特别是加拿）的实际应用，并强调了理解波动传递如何指导风险管理策略和投资决策。最后，第\
  \ 7 节`结论` (`Conclusion`) 总结了主要发现，讨论了研究的局限性，并为未来的研究提出了方向。\n\n## 2. 文献综述\n\n油价、`波动指数`\
  \ (`VIX`) 与各种股市指数之间的关系在金融文献中已通过多种方法得到了广泛研究。然而，采用多变量随机波动模型 (`DC-MSV`) 的研究有限，特别是在不同市场之间波动传递的背景下。本节回顾了探索油气市场、股票指数和其他金融资产之间波动溢出的关键研究，强调了本研究旨在填补的文献空白。\n\
  \n`Hepsağ (2013)` 考察了布伦特原油 (`BO`) 价格与 `MIST` 国家（墨西哥、印度尼西亚、韩国和土耳其）工业部门指数之间的波动互动。通过使用\
  \ `CCC-GARCH`、`DCC-GARCH`、`CCC-MSV` 和 `DCC-MSV` 在内的多个模型，研究得出结论：所有国家的工业部门收益与原油收益之间存在随时间变化的相关性。发现这些相关性随时间变化，反映了油价与股市收益之间关系的动态性质。这一发现表明，波动溢出不是静态的，受到各种宏观经济和地缘政治因素的影响。\n\
  \n`Kılıç (2022)` 利用 `DC-MSV` 模型分析了石油风险、石油现市场和石油期货市场之间的随机波动溢出。研究发现石油风险与现市场之间没有显著的波动传递，但揭示了石油风险与石油期货市场之间存在正向的双向波动溢出。此外，研究识别了从现市场到石油期货市场的单向波动传递。这些发现强调了期货市场在传递波动方面的重要性，凸显了其作为石油风险扩散到金融系统不同部门关键通道的作用。\n\
  \n`Le 等人 (2022)` 应用了带有随机波动的时变参数自回归模型 (`TVP-VAR-SV`) 研究影响 `WTI` 原油价格实现波动率的因素。研究发现\
  \ `WTI` 波动对石油产量、石油库存、美元指数和 `VIX` 等因素有积极反应，其中 `VIX` 的影响最为显著。分析还显示，`WTI` 价格的波动在经济危机期间（如\
  \ COVID-19 流行期间）尤为突出，强调了石油市场对经济冲击和金融市场条件的敏感性。\n\n`Vo (2011)` 使用 `CCC-MSV` 和 `DCC-MSV`\
  \ 模型探讨了石油市场与 `S&P500` 指数之间的波动互动。研究发现石油市场与 `S&P500` 之间存在强烈且显著的波动关系，表明油价波动对股市波动有实质影响，反之亦然。这强调了商品市场与股票市场之间的互联性，一个市场的波动往往会溢出到另一个市场，特别是在市场不确定性加剧的时期。\n\
  \n\n\n\n\n在这些基础研究的基础上，本文通过 `DC-MSV` 模型探讨了 `S&P/TSX 综合指数`、`S&P500`、`黄金`、`VIX`、`布伦特油\
  \ (BO)` 和 `西得州油 (WTI)` 之间的波动传输，为相关文献做了贡献。通过关注这些市场之间动态且随时间变化的关系，研究对一个市场的冲击如何影响其他市场的波动提供了详细的见解。特别是，本研究旨在阐明加拿大市场（`S&P/TSX`）与其他全球金融及大商品市场之间的波动溢出效应。研究结果为这些市场之间的波动传输提供了最新且全面的信息，为学术研究以及风险管理和金融决策的实际应用提供了宝贵的见解。\n\
  \n本文不仅通过将 `DC-MSV` 模型应用于广泛的金融数据，填补了文献空白，还为加拿大的金融专业人士提供了重要的启示。研究结果有助于更好地理解全球市场动态如何影响加拿大市场的波动，特别关注了加拿大股市如何与全球油价、美国股票市场以及\
  \ `VIX` 交互。通过加强对这些波动传输机制的理解，本研究帮助金融分析师、投资者和决策制定者在日益互联的全球金融格局中做出更明决策。\n\n### 3. 金融市场概述\n\
  \n本研究重点分析了几个关键金融市场之间的波动传输，特别是 `S&P/TSX 综合指数`、`S&P500`、`布伦特油 (BO)`、`西得州油 (WTI)`、`VIX`（波动率指数）和\
  \ `黄金`。这些市场每一个在全球金融系统中都发挥着至关重要的作用，理解它们之间的互动为风险管理和市场动态提供了宝贵的见解，特别是从加拿大金融专业人士的角度来看。\n\
  \n`S&P/TSX 综合指数`代表了加拿大最大的公司，提供了加拿大股市的全面概览，并作为加拿大经济健康的晴雨表。该指数高度偏向能源部门，这使其对全球能源价格（包括油价）的波动特别为敏感。`S&P500`\
  \ 是美国最著名的指数之一，追踪美国 500 家规模最大的上市公司的表现。该指数涵盖了技术、能源、医疗保健和金融等广泛领域，与 `S&P/TSX` 具有高度相关性，反映了共同的经济趋势，但也反映了行业成分的差异。这两个指数的波动对加拿大投资者来说特别重要，因为它们经常被用作全球经济状况的基准，用于理解美国市场对加拿大资产的影响。\n\
  \n除了这些股票指数，本研究还考察了 `布伦特油 (BO)` 和 `西得州油 (WTI)`，它们是全球范围内最具影响力的两种基准原油。`BO` 主要从北海开采，因其较低的精炼成本和更易的海上运输而受到青睐，成为国际市场的首选。`WTI`\
  \ 开采于美国，通常被精制成汽油和其他轻产品，并用作美国市场的主要石油基准。这些基准石油油的价格是全球经济状况的关键驱动因素，影响着从通胀到能源政策的方方面面。\n\
  \n研究分析的另一个关键市场因素是 `VIX`，或波动率指数，通常被称为“恐慌指数”。`VIX` 通过追踪 `S&P500` 期权的隐含波动率来衡量市场不确定性和投资者情绪。它是衡量市场风险和投资者焦虑的关键指标，在金融不稳定或经济危机期间上升。最后，`黄金`\
  \ 因其作为避险资产的角色被纳入本研究。投资者在市场风险增加或经济不确定性时期期间通常转向 `黄金`，使其成为理解跨市场波动传输动态的重要资产。\n\n这些市场——`S&P/TSX`、`S&P500`、`布伦特油`、`WTI`、`VIX`\
  \ 和 `黄金`——共同提供了全球金融趋势和风险因素的广泛视角。通过研究这些市场之间的波动传输，本研究揭示了一个市场的冲击或价格波动如何渗透到其他市场，影响着从投资策略到风险管理的各个方面。\n\
  \n本文提出的分析对加拿大金融专业人士特别有意义。加拿大的经济严重依赖能源部门，特别是石油，理解全球能源市场和如 `S&P500` 等关键全球指数如何影响 `S&P/TSX`，可以为市场动态提供宝贵的见解。鉴于加拿大和美国市场之间的高相关性，以及全球油价对加拿大经济表现的重要影响，理解这些市场之间的波动传输可以帮助加拿大投资者和金融分析师预测市场波动、管理风险并做出更明智的投资决策。\n\
  \n### 4. 方法论\n\n本节介绍了用于实现本研究结果的波动预测模型和机器学习技术。\n\n#### 4.1 波动模型概述\n\n##### 4.1.1\
  \ ARCH 和 GARCH 模型\n\n`ARCH`（自回归条件异异）和 `GARCH`（广义 ARCH）模型常用于波动预测，重点建模随时间变化的条件方差。这些模型是对称的，假设正负冲击对波动率的影响相同。由\
  \ `Engle (1982)` 开发的 `ARCH` 模型引入了随时间变化的条件方差的概念，与早期假设方差恒不变的模型不同。由 `Bollerslev (1986)`\
  \ 引入的 `GARCH` 模型通过结合过去的误差项和过去的条件方差扩展了 `ARCH`，以更全面地建模波动。\n\n尽管应用广泛，`ARCH` 和 `GARCH`\
  \ 模型受限于对称性，这意味着它们无法捕捉杠杆效应（负冲击对波动率的影响往往大于正冲击）。为了解决这个问题，`EGARCH` (`Nelson, 1991`)\
  \ 和 `TGARCH` (`Zakoian, 1994`) 等模型被开发出来以允许非对称效应，从而对金融波动提供了更好的拟合 (`Güriş, 2020`）。\n\
  \n##### 4.1.2 随机波动模型\n\n由 `Taylor (1986)` 引入的随机波动 (`SV`) 模型通过将波动视为不可观测的潜变量，为 `ARCH`\
  \ 类模型提供了替代。这种潜过程使得 `SV` 模型相比 `ARCH` 类模型中的确定性假设能够捕捉更复杂的波动模式。通过建模波动的条件和无条件特征，`SV`\
  \ 模型在预测金融资产波动方面提供了更大的灵活性能力 (`Broto and Ruiz, 2004`）。与主要关注条件波动的 `ARCH` 类模型不同，`SV`\
  \ 模型可以整合短期和长期的波动动态 (`Hepsağ, 2013`）。\n\n###### 4.1.2.1 单资产收益率的基础随机波动 (SV) 模型\n\n\
  \n\n\n\n单个资产收益率的基础随机波动率（SV）模型如下：\n\n$$y_{t} = {e^{\\frac{h_{t}}{2}}\\epsilon_{t}}$$\
  \  \n\n(1)\n\n其中：\n\n* `y[t]` 是资产在时间 `t` 的观测收益率，\n* `h[t]` 是时间 `t` 的潜伏（未观测的）波动率，`exp(h[t]/2)`\
  \ 确保了波动率是严格正的（因为波动率必须为正值）。\n* `ϵ[t]` 是标准正态创新项（即冲击或误差项）\n\n波动率 `h[t]` 本身遵循一阶自回归过程（AR(1)），该过程模拟了对数波动率随时间的演变。这可以写为：\n\
  \n`h[t] = \\gamma + \\phi h[t-1] + \\eta[t]`\n\n(2)\n\n其中：\n\n* `\\gamma` 是常数项（为了简单起见通常设置为\
  \ 0），\n* `\\phi` 是持久性参数，它决定了过去的波动率对当前波动率的影响程度，\n* `\\eta[t]` 是波动率的创新或冲击，假设它服从均值为\
  \ 0、方差为 $\\sigma²$ 的正态分布。\n\n## 4.1.2.2 多变量随机波动率 (MSV) 模型\n\n通过考虑时间 `t` 时 `n` 个资产的收益率，SV\
  \ 模型可以扩展为多变量随机波动率（MSV）模型，记为 `y[t] = (y[1, t], y[2, t],...... y[n, t])` 和潜波动率向量 `h[t]\
  \ = (h[1, t], h[2, t],…, h[n, t])`，其中每个 `h[i, t]` 都遵循独立的 AR(1)过程。为了简单，本研究关注 `n=2`\
  \ 的双变量情况。在这种情况下，模型表示为：\n\n`y[t] = \\Omega[t]\\epsilon[t]`\n\n其中：\n\n* `\\Omega_{t}\
  \ = diag\\left( e^{\\frac{h_{t}}{2}} \\right)`\n* `\\epsilon_{t}\\overset{iid}{\\\
  sim}N\\left( {0,I} \\right)`\n\n波动率过程按照以下方式演变：\n\n`h[t+1] = \\mu + diag(\\phi[11],\
  \ \\phi[22])(h[t] - \\mu) + \\eta[t]`\n\n其中：\n\n* `\\mu = h[0]`（初始波动率）\n* `\\eta_{t}\\\
  overset{iid}{\\sim}N\\left( {0,diag\\left( \\sigma_{\\eta_{1}}^{2},\\sigma_{\\eta_{2}}^{2}\
  \ \\right)} \\right)`\n\n该模型本质上是单变量 SV 模型的组合，捕捉了尖峰收益分布和波动率聚集。然而，它没有考虑到收益率或波动率之间的相关性或格兰杰因果关系。\n\
  \n## 4.1.2.3 动态相关多变量随机波动率 (DC-MSV) 模型\n\n更先进的双变量模型是由 [Yu and Meyer (2006)] 引入的 DC-MSV\
  \ 模型，它允许时间变化的相关性和波动率。该模型可以表示为：\n\n`y[t] = \\Omega[t]\\epsilon[t]`，\n\n其中 `\\Omega[t]`\
  \ 是一个包含时间变化波动率（如方程 (3) 定义）的对角矩阵，`\\epsilon[t]` 是时间 `t` 的冲击向量，假设其服从均值为零且具有时间变化协方差矩阵\
  \ `\\Sigma[\\epsilon, t]` 的独立同分布正态分布，其相关系数 `\\rho[t]` 于 -1 到 +1 之间：\n\n$\\Sigma_{\\\
  epsilon,t} = \\begin{pmatrix} 1 & \\rho_{t} \\\\ \\rho_{t} & 1 \\\\ \\end{pmatrix}$\n\
  \n时间变化的波动率按照以下方式演变：\n\n`h[t+1] = \\mu + diag(\\phi[11], \\phi[22])(h[t] - \\mu)\
  \ + \\eta[t]`\n\n其中，\n\n* `\\eta_{t}\\overset{iid}{\\sim}N\\left( {0,diag\\left(\
  \ \\sigma_{\\eta_{1}}^{2},\\sigma_{\\eta_{2}}^{2} \\right)} \\right)`\n* `\\mu =\
  \ h[0]`\n\n此外，相关性 `\\rho[t]` 的过程给出：\n\n$q_{0} = \\psi_{0}, q_{t + 1} = \\psi_{0}\
  \ + \\psi(q_{t} - \\psi_{0}) + \\sigma_{p}, \\nu_{t}\\overset{iid}{\\sim}N(0,1)$\n\
  \n其中 `\\rho[t]` 确定为：\n\n* `\\eta[t]` 和 `\\epsilon[t]` 是具有相同分布的独立随机变量。\n* `\\phi`\
  \ 衡量冲击的稳定性。\n* `h[t]` 代表不可观测的波动率。\n* `\\sigma[\\eta]²` 是波动率过程的方差，表示对未来波动率的不确定性。`\\\
  sigma[\\eta]²` 与 `\\phi` 之间存在反比关系，当 `\\phi` 接近 1 时，`\\sigma[\\eta]²` 趋于零。\n\n##\
  \ 5 数据与发现\n\n本研究使用了 2016.01.01 至 2020.10.25 期间从“Yahoo Finance”获取的每日数据。研究调查了 `S&P/TSX`、`S&P500`、`Gold`\
  \ 和 `WTI` 的波动率传输。缩写如下：`S&P/TSX` 指多伦多证券交易所，`BO` 代表布伦特油，`VIX` 是恐慌指数，`WTI` 指得克萨斯油。采用了\
  \ DC-MSV 模型，该模型假设其相关性随时间变化。为了优化模型，进行了 50,000 次迭代，每次迭代基于上一步的结果对模型进行调整，以确保收敛至最优解。这种迭代过程允许模型能够捕捉时间变化的波动率并提高其预测精度。此外，在\
  \ 2022 年至 2023 年间，这些变量的波动率再次增加，这受到俄乌战争、全球能源危机、经济不确定性以及供应链中断等因素的影响。油价自二战以来最显著下降发生在\
  \ 2014 年至 2016 年之间，原因包括美国页岩气产量增加、石油生产效率提高以及需求恶化。期间美国选举的不确定性也导致市场波动加剧。\n\n### 5.1\
  \ 描述性统计与初步分析\n\n从 2016 年 1 月到 2024 年 10 月 25 日的变量时间路径如图 1 所示。变量通常表现出不规则的轨迹，在大流行期间存在显著波动。\n\
  \n#### 图 1 S&P/TSX、S&P500、黄金、VIX 和 BO 序列的变化\n\n使用公式计算的所有变量的收益序列如图 2 所示。通过观察图表可以明显发现许多极端值。这些极端值的存在表明了波动率聚集，指示时间序列中存在序列依赖。\n\
  \n#### 图 3 S&P/TSX 与 S&P500、黄金、VIX、WTI 的相关性矩阵\n\n\n\n\n\n图 3 显示了 `S&P/TSX` 与其他指数收益之间的相关性矩阵。相关性矩阵显示了数据集中变量之间关系的方向和强度。特别是，它评估了每个变量与其他变量之间的线性关系。相关系数为\
  \ `0` 表示两个变量之间没有关系。随着系数从 `0` 移动到 `1` 或 `-1`，关系的强度随之增加。相关系数为 `1` 表示两个变量之间存在完全正相关，而\
  \ `-1` 则意味着两个变量之间存在完全负相关。\n\n与 `S&P/TSX` 相关性最强的变量是 `S&P500` 指数 (0.82)，其次是 `BO` (0.38)。`GOLD`\
  \ 与 `S&P/TSX` 的相关性最弱。另一个有趣的发现是 `VIX` 与其他变量之间的相关性。`VIX` 与 `BO`、`WTI`、`S&P/TSX` 和\
  \ `S&P500` 呈负相关，但与 `GOLD` 呈正相关。负相关通常意味着随着市场不确定性（由 `VIX` 上升指示）的增加，股价下跌，经济增长预期下降，反过来对石油需求产生负面影响。`VIX`\
  \ 与 `GOLD` 之间的正相关可以解释为投资者在不确定时期寻求如 `gold` 等更安全的资产。黄金在经济衰退期间往往会升值，使其在市场面临高度不确定性时成为首选资产。\n\
  \n在做出投资决策时，检查变量间相关性随时间的变化是非常重要的。6 个月滞后的时间相关相关性变化所示图 4。进行 6 个月滞后相关性分析的原因是它可以捕捉周期性波动。这种分析有助于在做出投资决策时提供更好的预见。每日相关性容易受市场波动和价格波动的影响。因此，为了减少这种噪声，认为周期性相关性分析是恰当的。图\
  \ 4 显示了 `S&P/TSX` 与其他资产之间的关系随时间的变化。\n\n#### 图 4. `S&P/TSX` 与 `S&P500`、`GOLD`、`VIX`、`WTI`\
  \ 和 `BO` 之间的动态相关性矩阵\n\n![979-8-3693-8186-1.ch015.f04](img/979-8-3693-8186-1.ch015.f04.png)\n\
  \n当分析 `S&P/TSX` 与其他变量的时间相关相关性时，其相关关系在 2020-2021 年期间是相对稳定的。疫情后的经济衰退和供应链中断导致了股市和大宗商品市场的不确定性。这种状况在变量之间创造了相似的模式，并导致相关关系保持不变。2022\
  \ 年，俄乌战争的突然爆发导致 `VIX` 获得上升动力，能源价格飙升。这导致了 `S&P/TSX`、能源资产与 `VIX` 之间的相关性增加。另一点是，在整个分析期间，`S&P/TSX`\
  \ 与 `S&P500` 指数之间的相关性保持相对稳定且强大。\n\n研究中收益变量的描述性统计见表 1。\n\n#### 表 1. 变量的描述性统计\n\n\
