  \ `IAENG` 的终身成员。\n\nAysel Varoglu 拥有加齐大学（Gazi University）经济学 `BS` 学位（2013 年）和安卡拉社会科学大学的能源经济学与管理\
  \ `MA` 学位（2022 年）。她在贸易部从事能源经济学和分析工作。她在能源和气候变化的战略和经济重要性方面发表了研究文章和书籍章节。她的研究兴趣主要是能源和气候变化的宏观经济影响。\n\
  \n\n\n\nTarun Kumar Vashishth 是一位活跃的计算机科学领域学者和研究人员，拥有 21 年的经验。他获得了数学博士学位，专攻运筹学；曾担任过多个学术职位，如系主任、副院长、学术协调员、部门研究委员会秘书、大学中心主任以及大学考试主考官。他积极参与学术发展和学术活动。他是国际工程师协会、数字信息与无线通信协会、全球教授福利协会、国际学术与企业联合协会\
  \ (IAAC)、计算机科学教师协会以及互联网学会的成员。他的研究兴趣包括云计算、人工智能、机器学习和运筹学；发表了超过 45 篇研究论文，以及 2 本专著和\
  \ 55 个书籍的章节。他还担任了由 CRC Press、Taylor and Francis、Springer、IGI global 以及其他大学出版的会议和各类计算机期刊的编辑委员会和评审委员会成员。\n\
  \nRoberto Vergallo 是软件工程领域的终身制助理教授。他目前的研究课题包括利用人工智能、`IoT` 和 `DLT` 的最新进展驱动，为银行业领域设计和开发创新的客户体验（CX）。作为一个旁支研究课题，他致力于可持续软件工程领域的基础工作，特别关注绿色\
  \ AI 方法和技术。他在国际期刊、会议论文集和书籍上发表了 50 多科学论文。2024 年，他在 `TU Delft`（荷兰）担任访问研究员，加入了由 `Arie\
  \ van Deursen` 教授领导的软件工程研究小组（`SERG`），为绿色 AI 领域做出贡献。此前在 `University of Salento`（意大利莱切切）任职期间，他协调了由\
  \ `Luca Mainetti` 教授领导的 `GSA-Lab` 活动长达 15 年。他的博士论文（2014 年）关于用于 `IoT` 的模型驱动云架构。这是他在著名的\
  \ `UCLA`（加州洛杉矶）经历的成果，之后他回到意大利并创立了一家名为 `Vidyasoft srl` 的衍生公司。通过这家衍生公司，他从工业界获得了 20\
  \ 万欧元的科研成果资金，并收到了来自银行和金融机构的各种资助和奖项。2022-2023 年，他与`意大利银行`密切合作，因为他被入选了 `MilanoHub`\
  \ 项目（金融科技 AI）以及首个意大利监管沙盒。2023 年，他通过提出一种离线 `P2P` 支付协议发明，参与了 `ECB`（欧洲中央银行）关于数字欧元项目的公共讨论。他是三本国际期刊的编辑委员会成员：`MDPI\
  \ Fintech`、`信息与通信技术期刊 (JICT)` 以及 `电信、电子与计算机工程期刊 (JTEC)`。2024 年，他担任第 10 届意大利智慧城市与社区\
  \ ICT 会议（`I-CiTies`）的组织委员会，并在智慧城市大学挑战赛的国家协调员。\n\n余颖辉（Yu Yinghui）是新加坡社会大学（`SUSS`）的副教授。她在香港大学获得金融学博士学位，其研究兴趣包括资产定价、另类投资、风险管理以及金融技术与创新。\n\
