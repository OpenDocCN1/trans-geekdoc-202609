  \ 360 (用户数) |\n\n### 4\\. 金融领域 AI 训练阶段的脱碳\n\n\n\n\n\n在本节中，我们将探索文献中提出的某些用于减少 AI 训练阶段碳足迹的技巧。与传统的软件工程项目相比，AI\
  \ 项目的训练阶段对应于系统开发，而推理阶段则对应于系统投入产。虽然 AI 模型投产的排放就像每个软件工程项目一样，在预料之中，但由项目开发（即模型训练）引起的排放则是一个新现象。事实上，训练\
  \ AI 模型取代了开发人员的工作，开发者通常以自上而下的方式编写业务逻辑：首先引导需求，然后将其变为用例，并在定义数据之间的主要关系后实现这些用例。这需要对领域有很高的了解，但即使对于领域专家，治理现象的大多数规则也可能难以提取。此外，数据之间的关系可能会随着时间而变化。训练\
  \ AI 可以被视为一种绕过所有传统软件开发步骤的“暴力破解法”，因为它不需要领域知识，也不需要将数据之间的关系形式化：它们只是从证据中通过一种自下而上（或数据驱动）的方法提取的。这种软件开发的暴力破解方法消耗了更多的能量，因为它需要校准神经网络数十亿个参数的权重。某些算法可能更高效并能在更短的时间内收敛，但所需的能量计算将始终多于开发者在其开发环境中编写系统规则时所需的能量。\n\
  \n这在金融科技（Fintech）领域同样适用，例如让我们考虑 SCA（强客户身份认证）豁免案例。第二版支付服务指令（PSD2）允许在持卡发机构进行交易风险分析（TRA）的情况下，跳过数字支付的双重身份验证（2FA）。规范并未强制规定\
  \ TRA 的执行方式：跳过 SCA/2FA 的决策可以源于自上而下或自下而上的评估。目前，自上而下的评估是常态，例如：网站（或 IP 地址）可以被列入黑名单；整个国家可以被列入黑名单；支付卡可能是最近发放的，且客户信息不足；支付金额很高，绕过\
  \ SCA 风险太大。这些仅仅是领域专家可以在 TRA 软件中配置的一些自上而下的规则示例。相比之下，自下而上的方法将直接查看数据——即欺诈交易历史——以提取特征之间的关系，从而重建典型欺诈（或非欺诈）交易的形状。通过\
  \ AI，即使是领域专家不可见的关系（因为它们太复杂，或不接近人类的理解和思维方式）也会显现。顺便说，通过训练某些 AI 来暴力破解此类关系，其能量消耗远高于领域专家在软件组件中输入已知规则所需的能量。由于这个原因，在金融领域训练\
  \ AI 消耗的能量将始终比配置传统的非 AI 系统消耗得多。\n\n在接下来的章节中，我们将看到如何将需求转移（demand shifting）和需求塑造（demand\
  \ shaping）策略应用于金融领域，以减轻训练 AI 产生的碳足迹。\n\n### 灵活启动（Flexible Start）\n\n灵活启动（Flexible\
  \ Start，简称 FS）是一种应用于 AI 训练案例的时间性需求转移策略。其工作原理非常简单：只需在开始训练前等待获得更佳的碳强度（Carbon Intensity）即可。其益处首次在\
  \ Dodge et al. (2022) 中针对 11 项 NLP 和计算机视觉任务进行了衡量。一项确认性研究（Vergallo & Mainetti, 2024）证实了金融科技领域四项异常检测（AD）任务（欺诈检测）在节碳方面的收益。对于每项训练任务，Dodge\
  \ et al. (2022) 使用每 5 分钟跟踪一次的 GPU 能耗计算了排放，并使用了 WattTime 提供的 5 分钟粒度的历史 MOER（平均运行效率）。这意味着，为了获得最佳结果，仅仅查看特定时刻的碳强度是不够的，FS\
  \ 需要特定时间窗口内的预测值。通过这种方式，可以找到最佳启动时间，因为仅仅查看瞬时碳强度可能会忽略随后的波动。在报告 Dodge et al. (2022)\
  \ 观察到的结果之前，必须强调，完成这 11 任务的最大时间窗口延长有两种定义方式：每个任务固定增加 24 小时，以及相对于原始任务持续时间增加 100%。相对时间延长更为公平，因为较长的任务（例如训练一个拥有\
  \ 61 亿参数的 transformer）如果时间延长是固定的，那么从 FS 中获得的优势将较小（即在时间窗口内跨越的选项较少）。在这种情况下，节碳量为 3-7%，较短的任务取得了更好的结果，因为较长的任务在训练期间更容易遇到高碳强度时刻（因为在\
  \ FS 中，训练一旦开始，在结束前不会停止的）。仅仅增加 24 小时，较短的任务就取得了非常惊人的结果（20 分钟的任务实现了 26.8%）。Vergallo\
  \ & Mainetti (2024) 在金融科技领域复制了该实验：AD 任务案例。测试了四种算法：孤立森林（IF）（（Liu, F. T., 2008）、支持向量机（SVM）（Hearst,\
  \ M. A., 1998）、自动编码器（AE）（Bank, D., 2023）以及无感强身份认证（HF-SCA）（Distante et al., 2022)）。排放基准从\
  \ SVM 的 0.25kgCO2eq 到 HF-SCA 的 1.7kgCO2eq。这些算法使用相同的数据进行训练：由一家意大利银行提供的 500 万条交易历史。该数据集是有标记的，这意味着每笔交易都有布尔欺诈信息。在评论基准算法的\
  \ FS 结果之前，作者讨论了碳排放与性能之间的权衡。仅仅查看性能指标（在 AD 中考虑 AUC 评分），决策者可能会因为 97% 的评分而倾向于选择 HF-SCA。遗憾的是，HF-SCA\
  \ 也是污染性最强的选择，如上所示。AE 同样取得了良好的结果（73%），且仅消耗 0.3 kgCO2eq，但评分差异太大，不至于让人偏好 AE。决策者可以选择\
  \ HF-SCA，同时采用一些碳感知的策略，如 FS 或将在后续章节中介绍的策略。另一个可能驱动算法决策的问题是：算法应该多久训练一次？这将在接下来的章节中讨论。\n\
  \n### 暂停与恢复（Pause and Resume）\n\n\n\n\n\n这是一种更为详尽的策略，因为 `Pause & Resume` (`PaR`)\
  \ 从时间零开始开始，并顾如其名，持续观察 `Carbon Intensity`（碳强度）信号以确定非计算周期，即应该暂时停止训练负载的时期。`PaR` 的参考文献仍然是\
  \ Dodge et al. (2022) 和 Vergallo & Mainetti (2024)，因此实验设置与上一个小节相同。观测结果显示，对于较长的负载，效果更好：在\
  \ Dodge et al. (2022) 中高达 11.4%，在 Vergallo & Mainetti (2024) 中高达 7.3%（后者负载较短）。这在直上是正确的，因为通过\
  \ `PaR`，较长的负载可以在 `Carbon Intensity` 高的时刻暂停执行。对于较长的负载（例如 ML、计算机视觉、NLP），`PaR` 是一种优选策略。通过\
  \ `PaR`，金融科技利益者只需采用一条非常简单的规则，就能显著降低其 AI 带来的碳影响。\n\n## 追随太阳 (Follow the Sun)\n\n\
  `FS` 和 `PaR` 使用时间需求转移来缓解训练 AI 算法的影响。然而，它们的益处高度取决于启动负载的地区，因为特定区域具有不同的能源组合。进一步的步骤可能包括明智地选择执行计算的\
  \ `Cloud` 区域。Dodge et al. (2022) 和 Vergallo & Mainetti (2024) 都提供了关于在多个 `Cloud`\
  \ 区域训练相同算法的不同碳足迹的有用视觉化表示。\n\n然而，如果我们所有人都在法国或北欧训练 AI，这些地区面临很快耗尽清洁/绿色能源的风险。必须采用动态方法来使区域选择更具可持续性。正如名称（部分）所示，`Follow\
  \ the Sun` (`FtS`) 将计算负载跨不同的 `Cloud` 区域移动。像向日葵一样，该策略持续寻找 `Carbon Intensity` 较低的区域，一旦找到，就会停止执行并将半完成的模型移动到新区域。尽管如此，`FtS`\
  \ 考虑了所有可用的可再生能源。在预印工作中，Vergallo 等人 (2024) 报告了使用 `FtS` 的四种 `AD` 算法节省了 14.58% 的碳排放。\n\
  \n尽管如此，仍应考虑 `FtS` 的缺点。尽管其可行性已得到证明 (James & Schien, 2019)，但相对于 `FS` 和 `PaR`，其架构复杂性的增加是显见的。此外，并不是每个\
  \ AI 都可以随意迁移。最后，一个主要问题是数据传输。事实上，`FtS` 并不符合欧洲 `GDPR` 等当地法规。顺便说一下，`FtS` 是一种非常有趣的策略，其功效已被证明，可以激发更好的管理。\n\
  \n## 负责任重新训练 (Responsible Re-Train)\n\nAI 的开发需要一个训练阶段，在该阶段算法从数据中学习。例如，AI 需要交易记录等数据。数据规模随时间增长，这可能导致安全漏洞\
  \ (Lyu et al., 2021)）。如果用户习惯发生，AI 模型需要重新训练以确保性能。这些变化被称为 `concept drift`（Gama et\
  \ al.,2014）。`AI` 和 `ML` 中的 `concept drift` 概念与可持续性密切相关。如果一家公司想保持竞争力并提供基于 AI 的工具，迟早必须更新并改进其模型。然而，可以负责任地减轻\
  \ `concept drift` 以减少排放，例如仅在意识到性能下降时才识别替换 AI 的最佳时机。\n\nPoenaru-Olaru et al. (2023a)的研究是在\
  \ `ING Netherlands` 进行，因此对金融科技领域具有特别意义。该论文探索了概念漂移适应技术，并从可持续性的角度定义了新的研究路径。上述文献中提出的三种主要的概念漂移适应技术是：`Dataset\
  \ Adaptation`（数据集适应）、`Model Adaptation`（模型适应）和 `Frequency Adaptation`（频率适应） (Celik\
  \ & Vansoren, 2021; Gama et al.,2014; Kavikondala et al., 2019)。\n\n`Dataset Adaptation`\
  \ 技术根据用于训练考虑的数据的时间间隔而不同。定期扩大训练集 (Kavikondala et al., 2019)) 涉及随时间推移向现有训练集持续添加新的数据样本。一旦达到阈值，将使用扩展的数据集重新训练模型。`ual\
  \ forgetting`（逐渐遗忘）假设最近的数据更相关。因此，在训练阶段，权重的分配考虑了样本的时间顺序。`Abrupt forgetting`（突发遗忘）涉及仅在新数据上训练模型——旧的样本被移出。\n\
  \n`Model Adaptation` 侧重于模型的性能。在这种情况下，模型可以用性能更好且更适合执行特定任务的模型来替换；或者使用新的或更新的数据集进行重新训练。\n\
  \n\n\n\n\n频率自适应（Frequency Adaptation）是指使用新可用数据改进模型。这一过程可以定期发生（例如每个一个月、每六个月等），且不进行任何调查（盲目自适应），或者仅在需要时进行（知情自适应）（Gama\
  \ et al., 2014）。每种技术都可以考虑环境可持续性进行处理。数据集自适应影响最低的方法是意外遗忘——仅使用数据最新的样本来重新训练模型。Verdecchia\
  \ et al. (2022) 研究了不同数据集大小对能量效率的影响，并得出小数据集在训练期间所需能量少的结论。在模型自适应技术中，尚不清楚在新的数据上重新训练模型或选择一个新的架构（通过回顾前文描述的探索、分析和测试）更方便。从频率自适应的角度来看，Poenaru-Olaru\
  \ et al. (2023)](979-3693-8186-1.ch002.bits-pdf.xhtml#_idTextAnchor173) 得出结论，只有在必要时才进行模型自适应，尽管从业人员定期地适应模型（Lyu\
  \ et al., 2021）。\n\n监控概念漂移对于金融科技开发能够随时间保持性能的算法至关重要。如果自适应算法没有根据用户的消费习惯进行更新，可能会无法注意到异常支付——从而损害用户和对银行的信任——或者产生虚假报警、阻塞用户交易，从而导致糟糕的用户体验（UX）。Poenaru-Olaru\
  \ et al. (2023)](979-3693-8186-1.ch002.bits-pdf.xhtml#_idTextAnchor172) 研究了名为概念漂移检测器的工具应用于先进自适应算法（如快速傅里叶变换\
  \ `FFT`、残差 `SR`、置信区间 `PCI`、长记忆自编码器 `LSTM-AE` 和残差卷积神经网络 `SR-CNN`）的情况。概念漂移检测器可以分析数据并识别何时需要重新训练以确保高性能。该工具在避免过度重新训练（浪费能量和增加碳足迹）以及频繁重新训练方面起至关重要的作用。然而，现有文献尚未报告使用一种策略相比另一种策略节省了多少碳。因此，金融科技行业应该尝试校准方法。\n\
  \n### 金融领域 AI 推理阶段的脱碳\n\n对未见过的数据进行 AI 模型推理产生的碳排放，概念上可能对应于软件生产系统的排放。然而，可以采取几项考虑。首先是反弹效应（Willenbacher,\
  \ 2021）：像 AI 这样的突破技术不仅让流程变得高效，还创造了新的需求。例如，人们使用 `ChatGPT` 在几分钟内而不是小时内编写文本，但也创造了他们不会编写的内容，因为\
  \ `ChatGPT` 可用。这种效应在多个领域发生：更高效的引擎让人们旅行更多、大电池允许人们全天在社交网络上观看视频、更快的 `GPU` 允许训练更多的 AI\
  \ 等。\n\n同样在金融科技领域，反弹效应使得 AI 和 ML 等先进技术的优势被部分抵消，导致能量消耗或排放的意外增加。AI 和 ML 模型越来越多用于复杂的金融分析、欺诈检测和客户个性化。虽然这些技术提高了运营效率，但它们的实现需要大量的计算能力，可能导致更高的碳排放。例如，基于\
  \ AI 的自动交易平台需要大量资源来实时分析并执行高频交易。随着这些平台的扩展和市场参与者使用算法交易，累计计算负载增加。尽管自动交易是的，但对持续数据处理和低延迟系统的增加了数据中心和金融网络的能量消耗。此外，随着更多金融服务集成\
  \ AI 和 ML，银行和金融机构必须升级硬件以处理增加的计算负载。这通常意味着采用为高性能计算设计的 `GPUs`。但这些 `GPUs` 的生产带有“嵌入碳”足迹——指制造、运输和处置期间产生的碳排放。对这种先进硬件的需求进一步加剧了反弹效应。AI\
  \ 模型推理阶段的碳排放往往将高于软件工程系统的生产阶段。为了推理阶段的脱碳可以做什么？金融科技世界有一些选项，将在下面的子节中讨论。\n\n### 模型压缩\n\
  \n金融科技公司面临的挑战之一是让客户可以使用 AI 模型。复杂的 `ML` 和 `DL` 模型需要高计算成本和大量的可用内存（Schwartz et al.,\
  \ 2020; Desislavov et al., 2021）。这使得大型模型无法在消费级手机或 IoT 设备（Zhu & Gupta, 2017）。模型量化主要分为两大类。第一类关注参数范围如何映射；第二类关注这些范围何时被计算。第一类包括均匀量化、非均匀量化和混合精度量化。第二类包括静态量化、动态量化和量化感知训练。\n\
  \n### 图 4. FP32 权重矩阵映射到 INT8 的示例\n\n![979-8-3693-8186-1.ch002.f04.png](img/979-8-3693-8186-1.ch002.f04.png)\n\
  \n\n\n\n均匀量化是一种将参数值范围划分为等距间隔，并将每个间隔映射到最近的量化层级的技术。这种方法可以分为标量量化和向量量化。标量量化是指独立于其他参数地对每个参数进行映射；向量量化是指对参数组进行联合映射。标量量化（Choi\
  \ et al., 2020）计算效率，但数据压缩效率较低；向量量化（Wu & Yu, 2019）能够更好地保持性能，但会增加模型的复杂度。\n\n与间隔等距的均匀量化不同，在非均匀量化中，参数被映射到变长度的间隔中。间隔的大小取决于参数的密度。密集的参数范围将被分配较小的间隔。在图\
  \ 5 中，r 轴上用橙色标记表示的实值被映射到量化域（Q 轴）中的离散低精度值。在均匀量化中，这些量化值之间的间距是规律的，而在非均匀量化中，层级之间的距离可能不规则。非均匀量化提高了压缩效率，但增加了计算成本。一种流行的非均匀量化技术是\
  \ k-means 量化（Choi et al., 2016）。\n\n### 图 5. 均匀量化 (a) 与非均匀量化 (b) 的对比\n\n![979-8-3693-8186-1.ch002.f05](img/979-8-3693-8186-1.ch002.f05.png)\n\
  \n混合精度量化根据参数的重要性分配不同的表示形式。最重要的模型参数将使用更多的位宽进行量化以保持性能，而不重要的参数将用较少的位宽表示以减小模型尺寸。类似于均匀向量量化，参数可以在量化之前分组在一起，但也可以对层进行分组（Dong\
  \ et al., 2019; Pandey et al., 2023）。\n\n静态量化是一种训练后方法，其中间隔是预先计算的，并在推理阶段保持不变。这种技术计算效率高，但可能导致精度较低。动态量化不仅涉及权重的转换，还涉及实时激活值的转换。这种技术计算开销大，但通常能获得最高的精度。然而，从业者倾向于使用静态量化（Gholami\
  \ et al., 2022）。因此，目前为止的量化方法涉及在训练之前、之后或期间更改参数。相反，一种将量化过程整合其中的技术是量化感知训练。在量化感知训练（图\
  \ 6）中，前向传播模拟低精度行为（权重使用更少的位量化），反向传播保持不变。前向传播是输入数据通过网络以计算输出的过程；反向传播——或反向传播——是根据输出与真实值之间的误差更新网络参数和权重的过程（Gurney,\
  \ 2018; Wythoff, 1993）。\n\n### 图 6. 量化感知训练的示例\n\n![979-8-3693-8186-1.ch002.f06](img/979-8-3693-8186-1.ch002.f06)\n\
  \n### 模型剪枝\n\n模型剪枝是一种旨在通过移除冗余或不重要的参数来减少机器学习和深度学习算法尺寸的技术。例如，使用的设备类型可能不会带来有用的信息。剪枝的类型可能是用于\
  \ AI 性能的冗余（图 7）。非结构化剪化是基于阈值](#979-8-3693-8186-1.ch002.bits-pdf.xhtml#_idTextAnchor113)\
  \ 移除权重或连接。剪枝过程可以是非结构化的或结构化的；一次性剪化允许细粒粒压缩，但可能导致不规则的访问，这在硬件加速上更难优化。最常见的非结构化剪枝包括幅度剪枝（Han\
  \ et al., 2015）、梯度剪枝（Liu et al., 2014）、激活剪枝（Liu & Yu, 2019）以及海森剪枝（Liu et al., 2021）。\n\
  \n图 7. 非结构化权重剪枝的示例。a) 是初始网络，b) 是要移除的权重，c) 是非结构化剪化后的网络。\n\n![979-8-3693-8186-1.ch002.f07](img/979-8-3693-8186-1.ch002.f07.png)\n\
  \n结构化剪枝关注于移除神经元或整个层，而不是单个权重。这种方法保留了数据布局，有利于硬件加速。然而，移除整个层会导致模型性能下降。最常见的结构化剪枝包括通道剪枝、滤波器剪枝或层剪枝。迭代剪枝（Castellano\
  \ et al., 1997; Gordienko et al., 2019）涉及多次剪枝步骤，逐个移除权重、过滤器或神经元。在每次剪枝步骤后，模型都会进行重新训练，使其逐渐适应。这种方法通常保持性能，但计算成本更高。\n\
  \n一次性剪枝（Chen & Zhao, 2018）涉及单次剪枝步骤，移除权重、过滤器或神经元。这种方法计算效率高，但通常会导致初始性能下降。\n\n图 8.\
  \ 结构化权重和神经元剪枝示例\n\n![979-8-3693-8186-1.ch002.f08](img/979-8-3693-8186-1.ch002.f08.png)\n\
  \n### 知识蒸馏\n\n知识蒸馏是一种旨在将大型、复杂的预训练模型（教师模型）知识知识到较小、简单的模型（学生模型）的技术。目标是训练最简单的模型，使其行为类似于复杂模型。学生模型的训练基于教师模型提供的原始数据和输出，知识传递在此处发生（图\
  \ 9）。\n\n### 图 9. 知识蒸馏过程的示例。学生模型通过纠正感兴趣的参数来模仿教师的行为。\n\n![979-8-3693-8186-1.ch002.f09](img/979-8-3693-8186-1.ch002.f09)\n\
  \n\n\n\n在这种语境下，知识指的是教师模型捕获并传递给学生模型的信息。与之相反，蒸馏指的是针对教师模型和学生模型的训练算法。它是用于指导知识从教师模型向学生模型迁移的策略。Gou\
  \ 等人 (2021) 已主导了一项关于知识蒸馏策略的综述。\n\n知识可以根据基于响应、基于特征和基于关系进行分类。相反，蒸馏可以根据离线、在线和自蒸馏进行分类。\n\
  \n在基于响应的知识中，学生模型被训练为通过 `logits` 模仿教师模型的最终预测（图 10）。在基于特征的知识中，中间特征或激活值从教师模型传输到学生模型。在这种情况下，学生模型不仅从中间层学习，还像基于响应的知识一样从最终层学习（图\
  \ 11）。在基于关系的知识中，学生模型从教师处学习样本之间的相互关系。这种方法有助于学生模型更好地理解数据结构（图 12）。\n\n### 图 10. 基于响应的知识示例\n\
  ![979-8-3693-8186-1.ch002.f10](img/979-8-3693-8186-1.ch002.f10)\n\n### 图 11. 基于特征的知识蒸馏示例\n\
  ![779-8-3693-8186-1.ch002.f11](img/779-8-3693-8186-1.ch002.f11)\n\n### 图 12. 基于关系的知识蒸馏示例\n\
  ![779-8-3693-8186-1.ch002.f12](img/779-8-3693-8186-1.ch002.f12)\n\n### 知识蒸馏策略\n\n\
  离线或原始知识蒸馏包含两个阶段。第一阶段是训练大型教师模型。在第二阶段，使用教师模型的 `logits` 或 `features` 训练学生模型。这种方法需要额外的时间成本，因为两个模型的训练无法同时进行。此外，教师和学生模型之间的性能差距仍然很大。\n\
  \n在在线知识蒸馏中，教师模型和学生模型同时进行训练。这涉及使用互学习（`Zhang et al., 2018`），自蒸馏在准确性、硬件加速和模型压缩方面提供了改进。这三种技术都如图图\
  \ 13 所示。\n\n### 图 13. 蒸馏技术的比较\n![779-8-3693-8186-1.ch002.f13](img/779-8-3693-8186-1.ch002.f13)\n\
  \n### 延迟与迁移推理：挑战与局限\n\n模型压缩代表了需求塑造的形式，即向系统请求更少的 `features` 而不损害其长期价值。在这种情况下，`features`\
  \ 是处理器的计算能力以及相关的内存需求。然而，时间与空间的需求迁移也可以作为推理阶段的选项：\n\n- **时间需求迁移**是延迟推理的一种，这意味着 AI\
  \ 的终端用户（即利用部署在环境中 AI 模型 `features` 的用户）可以收到建议，等待一段时间后再进行查询，以便利用更佳的碳强度（Carbon Intensity）。\n\
  - **空间需求迁移**可以将推理任务迁移到碳强度更好的地理区域。然而，必须考虑正在运行的多个服务器集合的碳足迹。\n\n该领域的研究尚未提供有趣的证据。此外，金融科技领域的特殊性值得进行专门的研究。例如，银行业具有某些时间敏感性需求，这使得推迟计算以匹配更好的碳强度变得非常困难。对交易进行实时监控以防止欺诈的案例特别具有说明性，因为检测欺诈活动的延迟会导致巨大的财务损失。\n\
  \n银行可能会考虑接受某些未立即检测到的欺诈，以减少碳足迹。这种折中引发了关于金融安全与环境可持续性之间平衡的重要问题。\n\n\n\n\n最后，研究的一个有趣维度将涉及比较不同城市的边际运行排放率（`MOER`）。这将表明，在能源网更清洁的地区，欺诈检测的性能本质更好，这可能为在这些地区运营的金融机构提供天然优势。这些策略的结果不仅受益于欺诈检测，还可以扩展到其他对时间的领域，例如网络安全和应急响应系统，在这些领域，实时处理至关重要，且必须与减排努力取得平衡。\n\
  \n## 7. 讨论\n\n在本节中，我们批判性地评估了 AI 去碳技术的局限性，并讨论了金融科技行业和研究社区面临的挑战。这些挑战跨越了监管、财务、技术和组织领域，说明了绿色\
  \ AI 理论进展与金融服务中实际落地之间的巨大差距。\n\n一个主要的监管挑战涉及数据隐私法，这些法律限制了利用碳强度时空变异性来优化 AI 工作负载的潜力。利用空间变异性在能源源清洁的地区执行任务的技术，通常与限制敏感数据地理传输的隐私法规相冲突。同样，尽管利用时间变异性的技术（例如在碳强度较低期间运行\
  \ AI 任务）很有前景，但它们可能对于时间敏感的财务操作不可行，例如高频交易或欺诈检测，在这些领域，即使是极小的延迟也可能转化为巨大的财务风险。\n\n从技术角度来看，尽管可用的绿色\
  \ AI 工具和方法越来越多，但它们尚未设计为易于实现、开箱即用的方案。缺乏熟悉可持续性实践的专业“绿色”开发者的短缺加剧了这一差距。许多习惯丰富云资源的开发者可能不会优先考虑能源优化，导致忽视效率的资源密集型做法。小型银行面临着额外的限制，因为它们经常外包软件且缺乏对基础设施的控制，削弱了它们在内部实施可持续实践的能力。\n\
  \n组织阻力进一步增加了整合绿色 AI 的难度。对于许多金融机构而言，技术可持续性似乎并不紧迫。银行通常通过投资、客户选择或购买可再生能源来解决 ESG ，这导致人们认为这些措施已经足够。相比之下，绿色\
  \ AI 有时被认为是有风险的，或者是对性能或监管合规性的潜在妥协，增加了采用这些技术的疑虑。\n\n此评估的一项关键发现是，虽然金融科技领域的绿色 AI 已经受到了理论关注，但它主要关注“为了可持续性而技术”，而不是\
  \ AI 本身的可持续实践。尽管提出的去碳技术日益增加，但该领域缺乏实证研究，特别是在金融部门。许多技术需要先进的技能、硬件和资源来进行定制和实验，而并非所有机构都能轻松获得。此外，让银行客户参与绿色\
  \ AI 实践可以培养意识和认可，使他们成为这一转型过程中至关重要的盟友。\n\n这些分析结果为行业和研究社区提出了重要问题。鉴于改变现有习惯的困难（特别是在大型机构中），我们必须考虑生态系统中较小的参与者（如初创加速器）是否能更灵活、快速地推动可持续实践。此外，银行与能源提供者之间的合作可以提供比公共来源更细粒度的碳数据，从而优化能源使用并节省成本。中央银行等监管机构在建立金融科技绿色\
  \ AI 标准方面可能起着关重要的作用。是否应该要求每个机构在执行行业标准之前进行绿色 AI 实验以收集数据？设定基准可持续性要求（可能强制每个组织至少进行一次绿色\
  \ AI 实验），允许金融机构在任何更广泛的生效之前评估其结果。\n\n这引发了另一个关于时机和适用性的问题：何时应该考虑这些技术，何时它们可能是不切实际的？从一开始就根据可持续原则构建新服务远比现有系统复杂得多。遗留产品通常需要复杂的重构，而小规模、非关键服务提供了一个更容易切入点，可能会提高开发者和经理对绿色实践价值的认识。要让绿色\
  \ AI 在金融科技中成为现实，必须首先提供清晰、可量化 AI 系统碳足迹的仪表板和指标。标准化指标（例如每个客户、每笔交易、每次欺诈检测或每笔投资的二氧化碳当量数）允许机构设定具体的可持续性目标。额外的数据信号（例如由于碳强度导致未执行\
  \ AI 的财务成本）可以为能源密集型任务提供更精确的调度和位置选择。\n\n开发者和 AI 科学家在这一转型中将发挥至关重要的作用。开发者可以通过创建自动化压缩工具、能源跟踪软件、低能加密以及保护隐私并满足金融科技独特需求的\
  \ SDK 等解决方案，来促进绿色 AI 的采用。同时，AI 科学家可以通过将关注从模型准确率扩展到效率和资源优化，来推进绿色 AI 实践。通过评估与模型训练和部署相关的能量、时间和计算成本，研究人员可以帮助减少金融科技中所用\
  \ AI 模型的足迹。AI 科学家还可以通过优先考虑模型重用和特定任务微调，以及选择满足特定金融科技应用需求的较小模型来做出贡献。这种关注点的转移通过选择在不损害核心结果的情况下减少计算开销的方法，可以限制“红\
  \ AI”（即那些资源需求过高的模型）的使用。\n\n## 8. 结论\n\n\n\n\n从金融科技（Fintech）向绿色金融科技（Green Fintech）的转型是一个必要且复杂的程，其驱动力在于使\
  \ AI 系统符合金融机构的可持续性目标这一紧迫需求。随着 AI 技术（特别是机器学习 `ML` 和深度学习 `DL`）成为金融领域不可或的一部分，它们的能源消耗和碳足迹不容忽视。本章探讨了绿色\
  \ AI 技术的格局，重点关注如何将其应用于金融科技领域，该领域面临着如时间敏感型操作、严格的监管要求以及数据保护等特定挑战。\n\n## 本章的主要结果可总结如下：\n\
  \n* 建立了一个中心资源，指导金融科技部门采用 AI 脱碳技术，为整个行业的可持续 AI 集成提供了易于获取的基础。\n* 对绿色金融科技和绿色 AI 进行了广泛且深入的研究，涵盖了最新进展，并为可持续技术的进一步创新和研究奠定了基础。\n\
  * 系统地概述了组织内部关于环境可持续性的相关标准和倡议，为金融科技公司提供了理解和实施这些实践的清晰框架。\n* 收集并分析了绿色金融科技的现有案例，并识别出显著空白，强调了需要新见解和可操作策略的领域。\n\
  * 对 AI 训练和部署的脱碳技术进行了详细检查，并针对金融科技行业的特定需求和限制对种方法进行了批判性分析。\n* 讨论深入探讨了金融科技面临的独特监管、性能和运营限制，阐明了绿色\
  \ AI 策略与行业特定需求之间复杂的相互作用。\n\n未来的研究方向必须解决金融科技中绿色 AI 技术在经验证据方面的重大空白。为了评估这些技术的适用性并获得监管支持，行业特定的案例研究和数据收集至关重要。只有通过严格的测试和验证，我们才能衡量金融科技中绿色\
  \ AI 实践的有效性，并确定这些方法对于各种金融应用的适用性。\n\n## 本工作旨在服务以下利益相关者：\n\n* **金融机构（银行、金融科技公司和资产管理器）：**\
  \ 提供的见解可以帮助这些机构减少其 AI 驱动的产品和服务的碳足迹。通过采用绿色 AI 技术，它们可以符合可持续目标，降低能源成本，并在不影响金融操作速度或准确性的情况下证明其对环境责任的承诺。\n\
  * **监管机构和监督部门：**该研究为旨在鼓励或强制金融领域采取可持续实践的监管者提供了宝贵信息。它强调了如何在保持符合法律要求的同时整合绿色 AI 技术，特别是在数据保护、安全和反欺诈等领域，有助于为未来政策的制定。\n\
  * **从业人员（AI 工程师、数据科学家和金融科技开发者）：** 从业人员可以直接应用本工作中讨论的策略和技术来优化 AI 系统的效率。这包括在 AI 开发的训练和推理阶段提高能源效率，从而能够创造符合行业标准的更可持续的金融科技解决方案。\n\
  * **学生：** 本工作为学生提供了关于金融领域 AI 与可持续性交叉区域的易于理解的介绍。它是理解减少 AI 碳足迹重要性的宝贵资源，并对可持续 AI 实践如何应用于金融科技提供了实用的见解。\n\
  * **研究人员：** 研究人员将发现本工作是进一步探索金融领域绿色 AI 的有用基础。它强调了需要进一步调查的领域，例如优化性能与可持续性之间的平衡，并对现有文献进行了全面综述，为金融科技应用的高效\
  \ AI 技术的新进展提供了基础。\n\n### REFERENCES\n\nAnthony, L. F. W., Kanding, B., & Selvan,\
