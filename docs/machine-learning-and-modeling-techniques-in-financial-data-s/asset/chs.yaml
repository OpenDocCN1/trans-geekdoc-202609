  \ |\n| 4 | bitcoin_cryptocurrency_price_cryptocurrencies_forecasting |\n| 5 | sentiment_stock_analysis_market_data\
  \ |\n| 6 | deep_learning_stock_financial_market |\n| 7 | lstm_stock_model_prediction_series\
  \ |\n| 8 | oil_crude_prediction_series |\n| 9 | volatility_forecasting_models |\n\
  | 10 | financial_forecasting_risk |\n| 11 | cyber_attacks_prediction |\n\n为了完成分析，图\
