  \ 0.1, \\*\\* `p` < 0.05, \\*\\*\\* `p` < 0.01\n\n## 4.2.1 市场收益趋势预测\n\n日本模型 1 的\
  \ `R²` 为 0.212（调整后的 `R²` 值为 0.108），结果表明仅使用所提的音乐文本特征 `MusicTexVector` 即可正确预测 246\
  \ 个市场收益趋势中的 162 个（即显示每日的上涨或下降）。市场趋势的预测准确率约为 65.85%，平均绝对误差 (`MAE`）为 106.72。虽然它没有优于仅使用市场指数信息的模型\
  \ 2，但它可以从解释性和准确性两个进一步增强模型 2 的能力。模型 3 将 `R²` 值提高到 0.617（调整后 `R²` 值为 0.561），趋势预测准确率提高到\
  \ 78.05%，同时将 `MAE` 降低到 71.80。\n\n图 3 展示了模型 3 对日本的预测情况。红线表示实际每日市场收益，蓝线表示使用 `MusicTexVector`\
  \ 和市场指数 `OpenInfo` 预测的市场收益。很容易发现，日本的预测线与真实值的拟合度更好。我们下一节中对模型 3 进行详细解释。\n\n#### 图\
  \ 3. 使用 SWML 与市场收益指数的预测对比\n\n![979-8-3693-8186-1.ch012.f03](img/979-8-3693-8186-1.ch012.f03.png)\n\
  \n## 4.2.3 使用 LSTM 进行股票预测\n\n进一步采用了 `LSTM` 以进行稳健性检查。`LSTM` 模型对于时间序列数据分析特别有用，因为它可以学习时间序列数据中复杂的时间模式、关系和依赖性，即使在重要变化或事件之间存在长时间滞后。\n\
  \n对于市场收益数据，我们应用了数据归一化，并将前 200 天作为训练集，剩余数据作为测试集。构建了一个具有两个隐藏层的 `LSTM` 模型，第一层有 50 个单元，第二层包含\
  \ 16 个单元。采用 `MAE` 作为损失函数，并应用 `Adam` 优化器来训练模型。考虑到时间滞后可能产生的影响，我们还尝试了具有不同天数数的输入矩阵。表\
  \ 2 显示了不同滞后值下的训练和测试损失值。建模结果证实了所提 `MusicTexVector` 提高市场收益趋势预测的能力。在后续节中，我们将深入讨论建模和预测结果。\n\
  \n#### 表 2. 不同滞后值的 LSTM 预测性能\n\n| | MAE |\n| :--- | :--- |\n| 损失函数 – 滞后 = 1 天 |\
  \ |\n| 训练损失 | 0.0179 |\n| 测试损失 | 0.0348 |\n| 损失函数 – 滞后 = 3 天 | |\n| 训练损失 | 0.0292\
  \ |\n| 测试损失 | 0.0416 |\n| 损失函数 – 滞后 = 7 天 | |\n| 训练损失 | 0.0362 |\n| 测试损失 | 0.0545\
  \ |\n\n#### 图 4. 滞后 7 天的损失函数\n\n![979-8-3693-8186-1.ch012.f04](img/979-8-3693-8186-1.ch012.f04.png)\n\
  \n\n\n\n\n开盘信息具有高度显著性。这种一致性强调了前期市场趋势和信息在预测当前市场表现中的重要性。这表明，尽管音乐中的语言特征具有显著影响，但传统的市场指标仍然是股市波动的关键预测因素。\n\
  \n`LSTM` 模型得的结果凸显了模型性能对不同滞后期间的敏感性。如损失曲线所示，`1` 天滞后期的模型表现最佳，训练损失达到 `0.0179`，测试损失为\
  \ `0.0348`。这表明模型对短期序列依赖关系经过了调优，训练损失与测试损失之间的差距较小，说明过拟合情况极低。然而，当滞后期增加到 `3` 天和 `7`\
  \ 天时，训练损失和测试损失均有上升，其中 `7` 天滞后的训练损失达到了 `0.0362`。这一趋势表明模型难以捕捉数据中更长期的依赖关系，导致预测准确性略有下降。损失的增加可能归因于随着滞后时间的延长，过去数据的相关性降低，从而为预测引入了更多不确定性和噪声。这些发现强调了金融时间序列中短期预测的有效性，即近期数据比更久远的数据具有更高的预测能力。未来的研究可以探索诸如引入外生变量或高级正则化技术等策略，以提高长滞后期的性能。\n\
  \n总之，我们的分析结果提供了稳健的实证证据，支持了以下假设：音乐文本特征对股票指数变化产生影响。语言维度、社会过程、对话、个人关注、认知过程和情感过程之间微妙的相互作用，强调了嵌入在音乐偏好中的心理共鸣对日本金融市场动态的深远影响。\n\
  \n## 5.0 结论\n\n本研究推进了对热门音乐与金融市场之间相互作用的理论理解。通过建立一种新的跨学科联系，我们从几个方面做出了贡献。\n\n首先，这是首项系统检查音乐歌词对股市动态影响的研究，从而扩展了行为金融学的文献。传统的行为金融学文献主要关注于更直接的行为和经济指标，例如新闻（Tetlock,\
  \ 2016）、搜索趋势（Ding et al., 2020）、社交媒体情绪（Guan et al., 2022）、在线评论（Ding et al., 2017）或投资者情绪调查（Gric\
  \ et al., 2023）。通过引入音乐语义作为一种反映社会心理状态的人制品，我们有助于更深入地理解环境情感和认知刺激（如流行歌曲的主题内容）如何影响市场行为，特别是在日本股市的背景下。这通过增加歌词内容这一塑造投资者情绪的叙事维度，扩展了\
  \ `Shiller (2020` 的工作。\n\n其次，`SWML` 向量的代表代表方法论的进步。该工具量化了音乐歌词的语义方面，允许将心理状态整合到经济模型中，这是金融研究的一种新方法。以往的方法通常关注于媒体或财务报告文本的情绪分析（Loughran\
  \ & McDonald, 2011）；然而，`SWML` 向量不仅能够研究显性情感维度（例如正面或负面情绪），还能研究更复杂的语言结构，如否定、时间引用和社交动态，以及它们在塑造市场结果方面的潜在作用。这种方法为研究开辟了新的途径。\n\
  \n最后，本研究的发现为金融市场参与者、投资公司和政策制定者提供了若干项实践意义，特别是在认识影响市场行为的心理维度方面。音乐歌词内容与股市表现之间的相关性，强调了公众情绪和社会趋势对投资者行为的影响。\n\
  \n\n\n\n\n政策制定者也可以从理解市场行为的心理驱动力中获益，这种动力通过音乐等消费行为反映出来。通过识别集体状态在市场波动中的作用，监管机构可以设计更具响应性的金融政策，以考虑到市场参与者的行为因素。此类政策可能侧重于提高投资者的金融素养和情感韧性，帮助缓解过度反应或从众行为等心理偏差，这些因素导致了市场的不稳定性（如\
  \ De Bondt & Thaler, 1985）。\n\n总之，我们的研究通过提供日本市场音乐歌词内容与股市动态之间关系的实证证据，为日益增长的行为金融学文献做出了贡献。本研究证明了将心理洞察整合到金融市场分析中的重要性。通过利用语义等非传统数据源，本研究鼓励采用更全面的金融分析和投资策略开发方法，从而做出更明智的并改进风险管理。\n\
  \n## 局限性\n\n本研究的一个局限性是无法确定音乐主题内容与股市指标之间明确的因果关系。虽然已经发现了相关性，但尚不清楚歌词的变化是否直接影响市场波动，还是这两个变量都受到更广泛的经济状况或关键事件等潜在因素的影响。这呼应了以往研究对行为金融研究中建立因果关系困难的担忧，在这些研究中，情绪和市场波动可能受到外部经济力量或宏观经济趋势的驱动（Baker\
  \ & Wurgler, 2006; Tetlock, 2007）。尽管情绪分析技术越来越多地用于预测市场结果，例如对媒体和社交媒体情绪的研究（Bollen et\
  \ al., 2011; Loughran & McDonald, 2011），但将情绪从其他因果因素中分离仍然是该领域的一个持续存在的问题（Kumar et\
  \ al., 2013）。\n\n此外，对日本股市的关注限制了结果的通用性。日本独特的和心理背景（例如长期的通缩和对风险的文化态度）可能会影响投资者行为和市场动态，而这些影响并不适用于其他地区。未来的研究可以通过扩大分析范围以涵盖更长时间，并引入时间滞后模型来更稳健地探索潜在因果关系，从而解决这一局限性（Engle\
  \ & Granger, 1987; Granger, 1969）。时间滞后模型有助于确定音乐语义是先于市场变化，还是两者都是由更广泛的宏观经济条件触发的共同运动。\n\
  \n此外，跨多个国家和地区进行比较分析可以更广泛地理解音乐情绪在不同背景下如何与股市表现相关。跨国分析（如全球市场相关性研究所示 Forbes & Rigobon,\
  \ 2002）可以揭示观察模式在变化的文化和经济环境中是否适用。通过在未来的研究中解决这些局限性，我们可以更全面地理解心理现象与金融市场之间的相互作用，提供更广泛适用的见解。\n\
