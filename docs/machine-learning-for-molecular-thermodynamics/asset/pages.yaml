    # Introduction


    Machine learning has emerged as a versatile tool to predict and investigate the
    thermodynamics of complex systems. One task for molecular thermodynamics is to
    predict the thermodynamic properties of complex systems with high accuracy. The
    theoretical or semi-theoretical models have been used for learning of various
    systems [1–11]. However, it remains a challenge to develop robust models that
    can predict the thermodynamic properties of complex systems at the molecular level
    using the traditional mathematical framework. Machine learning offers to computer
    algorithms that can learn from [12,13]. The machine learning methods are known
    for their extraordinary performance in self-driving vehicles and games against
    humans [14–16]. Due to the ability of learning to describe complex relationship
    between variables, we have witnessed growing accuracy of these models in the material
    and chemical engineering


    fields, ranging from [17–22], exploration to molecular thermodynamics prediction
    [28–34].


    Machine learning has helped the research of molecular dynamics from three aspects
    (Fig. 1). First, it can help develop robust molecular models for complex systems.
    Obtaining accurate thermodynamic properties of a system is essential for developing
    processes. Nevertheless, theoretical or empirical models have been developed for
    predicting thermodynamic properties of various systems. These models use although
    consist of mathematical functions using hypothesis-driven functions and the parameters
    derived from theory or experiment. Most of the limitations of these methods rely
    heavily on the intuition of a "trial-and-error" approach. Deep machine learning
    methods provide a new way of learning and predicting the thermodynamic properties
    of complex systems. Many learning methods such as the neural network and decision
    tree can quantify the relationship between the targeted properties with the selected
    molecular database provide opportunity to develop such machine learning models
    [39–42].


