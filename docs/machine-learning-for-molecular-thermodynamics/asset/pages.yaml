    # 6. Perspective


    The examples above show the promising role of machine learning in predicting and
    modeling properties of chemical materials. Material design also benefits from
    the combination of machine learning and high-throughput simulations. Machine learning
    force field can accelerate the computation of thermodynamics in complex systems.
    However, application of machine learning in chemical engineering remains in a
    primitive stage, due to the scarcity of datasets in this area of champions. Some
    methods may be expensive, unlike in NLP or computer vision, prediction models
    in chemistry and material science are often scarce. The challenges include the
    uncertainty of the model. Thus, establishing databases with high data diversity
    and reliability is of great significance for future machine learning applications.
    We expect more applications that combine high-throughput simulation and machine
    learning. Another issue is the interpretability of


    machine learning is another important application in the field of quantum mechanics
    and all-atomic molecular dynamics. Current machine learning potential fields face
    some challenges, such as the limitation of element type and sensitivity with input
    configurations. Machine learning potentials have been developed and successfully
    accelerated simulations and it is becoming a powerful tool for computational chemistry.


