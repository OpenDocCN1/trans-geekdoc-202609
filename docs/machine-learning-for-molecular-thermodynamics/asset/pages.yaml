    # 3.2. Solution free


    Solution affects many processes such as phase equilibrium. Solution free is another
    important thermodynamic property and attracts researchers in the fields of chemical
    and biological engineering [118–120]. Three methods can derive the solution free:
    (a) from the formation of a cavity within the solvent, which is both physically
    and chemically; (b) from the solute particles from the bulk, which is entropically
    highly unfavorable but enthalpy favorable; (c) from the solvent-solute interactions
    in terms of entropy and enthalpy. It lot of methods have been made to derive solution
    free from thermodynamic properties or to calculate it with quantum mechanics.


    Another study by Cai et al. [116] focuses on the viscosity temperature characteristic
    of hydrocarbons using machine learning to predict the parameters of empirical
    equation. They obtained the NIST database of 21 pure hydrocarbons and used them
