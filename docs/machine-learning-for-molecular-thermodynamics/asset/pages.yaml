    # 5.2. Machine learning force field for water molecules


    The machine learning force field is capable of describing energy change accuracy.
    Controlling long-time-scale process is challenging for all-atom force fields in
    MD simulations. As shown in [57,58], coarse grained simulation of water calculations
    with the mW molecular force field. Without explicit hydrogen, the CG model can
    accelerate the nucleation process by several orders of magnitude. The limitation
    of CG models is the phase-changing mechanism. However, the dependence of the all-atom
    machine learning force field on energy AD has had bias effect. From the all-atom
    machine learning force field, Zhang et al [150] proposed a machine learning force
    field for water free from the constraints.


    They developed a coarse-grained machine learning force field for water. Each water
    molecule was treated as a particle, which contains only the oxygen atom, so that
    the oxygen correlation functions produced by the coarse grained machine learning
    force field agree well with those calculated by the all-atom machine learning
    force field. The coarse-grained model can describe the water phase accurately
    while retaining the description of the structural features.


    The data sets were constructed using MD simulations driven by both quantum mechanical
    and all-atom machine learning models.


    # 5. Machine Learning Forces


    The machine learning force field could investigate the dynamics of complex systems
    with an accuracy of quantum calculations and efficiency far exceeding MD. The
    new force field can describe different systems ranging from nanostructures [148,150]
    to complex organic and inorganic materials [151–154]. In the training process,
    quantum calculations were used to generate the data set with appropriate amount
    of data and corresponding properties to extract local structural interactions
    of multiple atoms from the system.


