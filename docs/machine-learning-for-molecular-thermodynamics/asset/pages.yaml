    Thermodynamic properties of complex systems play an essential role in driving
    chemical engineering research. It remains a challenge to predict the thermodynamic
    properties of complex systems in a wide range and describe the behavior of ions
    and molecules in complex systems. Machine learning emerges as a powerful tool
    to resolve this issue it can describe complex properties beyond the capacity of
    traditional mathematical functions. This review will summarize the discovery of
    traditional machine learning methods and explore the different aspects of machine
    learning using several examples. The first aspect is to apply machine learning
    to predict the thermodynamic properties of a broad spectrum of systems based on
    known data. The second aspect is to integrate machine learning and molecular simulations
    to accelerate the discovery of new materials. The third aspect is to develop machine
    learning models that handle both harmonic and all-atom molecular dynamics simulations.
    The applications in these three aspects illustrate the potential of machine learning
    in thermodynamics of chemical engineering. We will also discuss the perspective
    of the broad applications of machine learning in chemical engineering.


