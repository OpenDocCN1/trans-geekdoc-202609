    # 2. Data, Descriptor, and Algorithm


    As stated, machine learning refers to the methods that can predict the output
    of a system based on selected features (descriptors) using algorithms from a set
    of databases. The development of a machine learning model includes four critical
    steps: (1) data collection, (2) selecting the descriptors and algorithm, (3) training
    the algorithm based on the dataset, and (4) using the trained model to predict
    the output of a test set. The process of developing a machine learning model depends
    on three ingredients: dataset, descriptors, and algorithms [66–68]. The research
    on these ingredients and many comprehensive reviews have covered the relevant
    knowledge of them [62,66,67]. This section will only introduce them.


    # 2.1. Database


    A database refers to the collection of experimental and computational results
    that could be used to train and validate the machine learning model [66]. Quite
    few thermodynamic databases have been published [70]. Indeed, these databases
    are playing an important role in the development of machine learning models for
    chemical properties. The rapid progress in machine learning researchers. Users
    need to develop their own databases for specific purposes. Such efforts are critical
    for developing a database: the quality and scale of data (72). The quality data
    determines how well the machine learning model can perform many predictions [71,72].
    Data cleaning also allows us to prepare quality dataset by removing irrelevant,
    duplicated or modified overlapping data [66,73]. The scope


