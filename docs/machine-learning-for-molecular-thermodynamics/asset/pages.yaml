    # 3. Learning in Predicting Thermodynamic Properties


    The development of chemical processes such as reaction, separation and purification
    rely on the thermodynamic properties of industrial substances. However, researchers
    have many databases making it difficult to collect data for all attributes and
    their combinations. A predictive model is critical


    # 2.2. Descriptor


    Descriptors refer to the features that can be used to characterize the system
    [67]. They are attributes of the data and selected inputs for the machine learning
    model. A molecular descriptor can describe the system qualitatively or quantitatively.
    For instance, a descriptor for a molecule could be its molecular weight. Another
    descriptor can be its molecular structure. Another widely used descriptor is group
    description; however, the frequency of each distinct group [75–78]. Thousands
    of descriptors have been developed up to date but importance of selecting right
    ones. Generally, the descriptors should be relevant to the target, and not contain
    highly correlated ones (e.g., solubility and water solubility). Several methods
    have been developed to select descriptors in terms of eliminating and retaining
    the most relevant features [81–85]. Some novel methods to construct descriptors
    were inspired by using molecular language [86–89] and treating structures as “words”
    (Section 3.2). These methods learn the features of structures from classical molecular
    representations such as simplified input line entry (SMILES) and molecular graphs
    [90]. Descriptors describe such as crystalline structures and atomic properties
    are quite different from molecular descriptors.


    Traditional predictive models use mathematical functions, such as data-driven
    methods. Machine learning provides an alternative and efficient way to predict
    thermodynamic properties, bypassing the mechanism and prior knowledge of the equation
    of state. A large number of databases provide the bases of thermodynamic properties
    such as the National Institute of Standards and Technology (NIST) chemical handbook
    [71] and the Design and Engineering Physics Institute (DEPI) database [70]. The
    combination of machine learning and these databases have been used to predict
    industrial properties, enthalpy of phase change and other properties.


    We will illustrate the ability of machine learning using neural network vector
    models to predict the density and viscosity of fuel compounds. The example predicts
    predictions for free energy of organic solvents in generic solvents.


    # 3.1. Liquid density and viscosity


    Liquid density and viscosity are critical thermodynamic properties for petroleum,
    aviation fuel, and other fields [109,110]. The Creton group [111] developed machine
    learning to predict density (ρ) and viscosity (η) of compounds. They used experimental
    data from the DEPI database that contains hydrocarbons and organic compounds collected
    from different sources.


    They compared two sets of descriptors, including molecular descriptors and functional
    group descriptors (FCCD). Molecular descriptors include geometric, topological
    and electronic properties. Functional group descriptors are computed for each
    molecule by size, bonds, branching and dipole moment. Some of these descriptors
    are related to molecular weight and properties, and Other features may determine
    physicochemical behaviors of molecules, for instance, hydrocarbons


    # 2.3. Algorithm


    Algorithms refer to mathematical models that can be used to predict a variable
    based on other variables [99]. Algorithms recognize the descriptors and predict
    either qualitatively or quantitatively. Such a connection helps the system to
    predict new data [99]. Selecting an appropriate algorithm is another key to building
    a successful machine learning model. The algorithm is probably one of the most
    active areas in machine learning [100–105]. These algorithms have been grouped
    into two categories: supervised learning and unsupervised learning.


    Supervised learning involves learning with labeled data (known), where the model
    predicts the values of interest. For applications in molecular thermodynamics,
    these output values can be either the category of unknown compounds (classification)
    or variables of a system (regression). Gaussian regression [103] and support vector
    methods (SVM). However, unsupervised learning methods use unlabeled data to train
    models, which classify input data with no labels. These methods are used for clustering
    hierarchical clustering [106] and gaussian mixture model [107]. The features of
    these two categories have been extensively used in textbooks and literature


