    # ### 4.1. Peptide design


    One might obtain insights from the machine-learning-based prediction of thermodynamic
    properties: (1) experimental chemical databases have potential benefits when combining
    (2) datasets which are thorough and as many possible substructures in the test
    set (3) test with enough data fitting to replace the accuracy of internal mechanism
    completely; perhaps it will help researchers understand the mechanism while providing
    more accurate and targeted data.


    Peptides can self-assemble into ordered structures [135,136]. Their assembly can
    be built using empirical forces. The π-conjugated peptides contain aromatic and
    symmetrical oligomers on both sides. The sequence order of aromatic residues determines
    the specific interactions between the aromatic rings [137–240]. DXX-DXX is a peptide
    with two terminal amino acids (Asp) and X which represents 20 of non-polar amino
    acids. In these peptides, the pH-charged moieties are protonated at a low pH,
    inhibiting the electrostatic repulsion between adjacent molecules.


    Molecular dynamics and DFT simulations have been conducted to discuss the effects
    of sequence properties and π-cores on the self-assembly process and interactions.
    In the framework of the Fergus group [141], the self-assembly of DAFAC was investigated
    using molecular simulation, in which OPV is oligo-phenylenevinyl; the aggregate
    forms a β-sheet-like structure, which is driven by aromatic cores, hydrophobic
    interaction, and hydrogen bonding. The peptide-based conjugated peptides benefit
    from the electron delocalization along the π-core.


