    # 引言


    机器学习已成为一种多功能工具，用于预测和研究复杂系统的热力学。分子热力学的一项任务是高精度地预测复杂系统的热力学性质。理论或半理论模型已用于各种系统的学习
    [1–11]。然而，使用传统的数学框架开发出能够在分子水平上预测复杂系统热力学性质的稳健模型仍然是一项挑战。机器学习提供了可以从数据中学习的计算机算法 [12,13]。机器学习因其在自动驾驶车辆和人机游戏中的卓越性能而闻名
    [14–16]。由于学习具有描述变量间复杂关系的能力，我们见证了模型在材料和化学工程领域的准确性不断提高，范围涵盖从探索 [17–22] 到分子热力学预测
    [28–34]。


    机器学习从三个方面帮助了分子动力学研究（图1）。首先，它可以帮助为复杂体系开发稳健的分子模型。获取体系准确的热力学性质对于开发工艺至关重要。尽管如此，已经开发了理论或经验模型来预测各种体系的热力学性质。这些模型虽然由假设驱动的数学函数以及源自理论或实验的参数组成，但这些方法的大多数局限性很大程度上依赖于“试错法”的直觉。深度机器学习方法为学习和预测复杂系统的热力学性质提供了新途径。许多学习方法（如神经网络和决策树）可以量化目标属性与选分子数据库之间的关系，为开发此类机器学习模型提供了机会
    [39–42]。


