    # J. Ding 等人/中国化学学报 31 (2021) 227–239


    数据的多样性也决定了机器学习模型的性能 [17,72,74]，


    ## 3. 热力学性质预测中的学习


    反应、分离和提纯等化学过程的发展依赖工业物质的热力学性质。然而，研究人员拥有许多数据库，这使得难以收集所有属性及其组合的数据。预测模型是至关重要的。


    ### 2.2. 描述符


    描述符是指用于表征系统的特征 [67]。它们是数据的属性，也是机器学习模型的选定输入。分子描述符可以定性或定量地描述系统。例如，一个分子的描述符可以是其分子量。另一个描述符可以是其分子结构。另一种广泛使用的描述符是基团描述；然而，每个不同基团的频率
    [75–78]。目前为止已开发了数千种描述符，但选择正确的符至关重要。通常，描述符应该与目标相关，并且不包含高度相关的项（例如，溶解度和水溶性）。已经开发了多种方法通过消除和保留最相关的特征来选择描述符
    [81–85]。一些构建描述符的新颖方法灵感来自使用分子语言 [86–89] 并将结构视为“单词”（第 3.2 节）。这些方法从经典的分子表示（如简化输入线条目表示
    SMILES 和分子图）中学习结构的特征 [90]。描述如晶体结构和原子属性的描述符与分子描述符非常不同。


    传统的预测模型使用数学函数，例如数据驱动方法。机器学习为预测热力学性质提供了一种替代且高效的方法，绕过了状态方程的机制和先验知识。大量的数据库提供了热力学性质的基础，例如美国标准与技术研究院（NIST）化学手册
    [71] 和设计与工程物理研究所（DEPI）数据库 [70]。机器学习与这些数据库的已已预测工业性质、相变焓和其他性质。


    我们将阐明使用神经网络向量模型通过机器学习预测燃料化合物密度和粘度的能力。该示例预测了通用溶剂中有机溶剂自由能的预测值。


    ### 3.1. 液体密度和粘度


    液体密度和粘度是石油、航空燃料等领域关键的热力学性质 [109,110]。Creton 组 [111] 开发了机器学习来预测化合物的密度（ρ）和粘度（η）。他们使用了来自
    DEPI 数据库的实验数据，其中包含从不同来源的烃类和有机化合物。


    他们比较了两组描述符，包括分子描述符和功能基团描述符（FCCD）。分子描述符包括几何、拓扑和电子性质。功能基团描述符根据大小、键、分支和极矩为每个分子计算。其中一些描述符与分子量和性质有关，其他特征可能决定分子的物理化学行为，例如烃类。


    ### 2.3. 算法


    算法是指根据其他变量预测变量的数学模型 [99]。算法识别描述符并进行定性或定量预测。这种连接有助于系统预测新数据 [99]。选择合适的算法是构建成功的机器学习模型的另一个关键。算法可能是机器学习中最活跃的领域之一
    [100–105]。这些算法分为两类：监督学习和无监督学习。


    监督学习涉及带有标记数据（已知）的学习，其中模型预测感兴趣的值。在分子热力学应用中，这些输出值可以是未知化合物的类别（分类）或系统的变量（回归）。高斯回归
    [103] 和支持向量机（SVM）。然而，无监督学习方法使用未标记数据来训练模型，对无标签的输入数据进行分类。这些方法用于聚类、层次聚类 [106] 和高斯混合模型
    [107]。这两类的特征已在教科书和文献中广泛使用。


    * 星号


