    # Predicting thermodynamic properties


    | Machine learning | Designing materials | Molecular thermodynamics |

    |---|---|---|

    | | Developing many-body force field |


    **Fig. 1.** Three contributions of machine learning to molecular thermodynamics
    (1) predicting thermodynamic properties based on molecular descriptors; (2) designing
    materials with large-scale molecular simulations; and (3) developing many-body
    force fields that enable the simulations of complex systems.


    Second, machine learning can predict the complex behavior of systems by combining
    with classical modules. Molecular simulations show their essential role in revealing
    mechanisms governing thermodynamics. They provide coordinates and velocities of
    atoms or particles that we use to analyze their thermodynamic and kinetic properties
    [43–45]. This analysis is usually using a “hypothesis-driven” strategy. Machine
    learning, however, operates using the “data-driven” strategy. High-throughput
    molecular simulations contribute to this “data-driven” strategy by providing a
    large amount of data [13–46–50]. These data far exceed the scale of classical
    databases and thus enhance the performance of the machine learning model.


    Third, machine learning can provide “many-body” force fields for molecular simulations,
    enabling a fast and accurate description of complex interactions. Classical MD
    simulations [55–59] have well-known force fields that are relatively fast but
    limited in their potential overlap over bonding and formation. In contrast, quantum
    molecular simulations can describe complex systems but the computational cost
    is immense. Their unique feature originates from the ability of the machine learning
    models to describe complex interactions. The systems using machine learning force
    fields can achieve the accuracy of quantum calculations while improving the efficiency
    of classical MD.


    This minreview introduces several examples in the applications of machine learning
    in the three aspects mentioned above. The goal of this review is to inspire the
    application of machine learning in molecular thermodynamics and introduce necessary
    knowledge of machine learning. Many comprehensive reviews


    have showcased the applications of machine learning in the development of materials
    and processes [60–65]. Section 2 will introduce some basic concepts of machine
    learning. Section 3 will illustrate the applications of machine learning in complex
    relation-ship problems based on experiment. Section 4 will discuss the applications
    of machine learning based on high-throughput simulations using the methods of
    peptide design and prediction of thermodynamic properties. Section 5 will discuss
    machine learning in complex domains that enables high speed and accurate simulations.
    Finally, we will present a perspective of machine learning in thermodynamic contexts.


    # 2. Data, Descriptor, and Algorithm


    As stated, machine learning refers to the methods that can predict the output
    of a system based on selected features (descriptors) using algorithms from a set
    of databases. The development of a machine learning model includes four critical
    steps: (1) data collection, (2) selecting the descriptors and algorithm, (3) training
    the algorithm based on the dataset, and (4) using the trained model to predict
    the output of a test set. The process of developing a machine learning model depends
    on three ingredients: dataset, descriptors, and algorithms [66–68]. The research
    on these ingredients and many comprehensive reviews have covered the relevant
    knowledge of them [62,66,67]. This section will only introduce them.


