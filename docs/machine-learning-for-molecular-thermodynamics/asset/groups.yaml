    # 预测热力学性质


    | 机器学习 | 材料设计 | 分子热力学 |

    |---|---|---|

    | | 开发多体力场 | |


    **图 1.** 机器学习对分子热力学的三个贡献：(1) 基于分子描述符预测热力学性质；(2) 利用大规模分子模拟设计材料；以及(3) 开发能够模拟复杂系统的高体力场。


    其次，机器学习可以通过与经典模块结合预测系统的复杂行为。分子模拟显示了它们在揭示控制热力学的机制方面的至关作用。它们提供了原子或粒子的坐标和速度，我们利用这些来分析它们的热力学和动力学性质
    [43–45]。这种分析通常使用“假设驱动”策略。然而，机器学习运行的是“数据驱动”策略。高通量分子模拟通过提供大量数据为这种“数据驱动”策略做出了贡献 [13–46–50]。这些数据远超经典数据库的规模，从而增强了机器学习模型的性能。


    第三，机器学习可以为分子模拟提供“多体”力场，实现对复杂相互作用的快速准确描述。经典的 MD 模拟 [55–59] 具有著名的力场，它们速度较快，但在成键和形成方面的势能重叠有限。相比之下，量子分子模拟可以描述复杂系统，但计算成本巨大。它们的独特特征源于机器学习模型描述复杂相互作用的能力。使用机器学习力场的体系可以达到量子计算的准确性，同时提高经典
    MD 的效率。


    这篇微综述（minreview）介绍了机器学习在上述三个方面应用中的几个示例。本综述的目标是激发机器学习在分子热力学中的应用，并介绍机器学习所需的知识。许多综合综述已经了机器学习在材料和工艺开发中的应用
    [60–65]。第 2 节将介绍机器学习的基本概念。第 3 节将说明机器学习在基于实验的复杂关系问题中的应用。第 4 节将讨论基于高通量模拟的肽设计和热力学性质预测方法的应用。第
    5 节将讨论复杂领域的机器学习，实现快速且准确的模拟。最后，我们将介绍热力学背景下机器学习的前景。


    # 2. 数据、描述符和算法


    如所述，机器学习是指根据一组数据库中的算法，基于选定的特征（描述符）来预测系统输出的方法。机器学习模型的开发包括四个关键步骤：(1) 数据收集，(2) 选择描述符和算法，(3)
    基于数据集训练算法，以及(4) 使用训练好的模型预测测试集的输出。机器学习模型的开发过程取决于三个要素：数据集、描述符和算法 [66–68]。对这些要素的研究和许多综合综述已涵盖它们的相关知识
    [62,66,67]。本节将仅介绍它们。


    ## 2.1. 数据库


    数据库是指用于训练和验证机器学习模型的实验和计算结果的集合 [66]。目前发表的热力学数据库很少 [70]。事实上，这些数据库在开发化学性质机器学习模型方面发挥着重要作用。机器学习研究人员的发展需要针对特定目的开发自己的数据库。此类努力对于开发数据库至关重要：数据的质量和规模
    (72)。高质量的数据决定了机器学习模型进行预测的能力 [71,72]。数据清洗还允许通过移除无关、重复或修改的重叠数据来准备高质量的数据集 [66,73]。范围


