    ### 4. 基于高通量分子模拟的学习


    分子模拟可以为机器学习提供海量数据。实验很难获得微特征。例如，由于实验困难和几乎无数的溶剂-溶剂组合，扩散性质的数据集很少。高通量框架使我们能够产生比预期大数量级的数据集。


    另一项 DFT 研究 [142] 计算了类似的寡肽，表明光谱吸收来自于 C2p 轨道跃迁，多肽上的大残基导致


