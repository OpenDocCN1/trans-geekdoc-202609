    是机器学习中的另一个重要模型。结合核方法 [115]，SVM 可以将高维空间中线性不可分的样本转换为线性可分的样本。


    对于几组同类物的严重程度（此处此处似乎不完整），他们发现预测结果在较高温度的区域较低。为了验证异构体的区分性，他们使用训练好的模型预测了四氢呋和 itiso
    异构体的 T(t)。如图 5 所示，带有修正参数的 Andrade 方程也可以预测异构体的 T(t)。


    他们从描述符和算法的组合构建了机器学习模型。所有模型都产生了准确的预测，其决定系数（R²）高于 0.98。FVN 和 SVM 在 R² 和 p 方面表现更好。与其他方法相比，GCFD
    模型具有较低的平均绝对误差（MAE）。然而，几个模型通过使用实验数据提供了更好的共识。然后，他们建立了一个预测模型的的共识模型。


    这些机器学习可能应用于预测系统性质的不同步骤。研究人员可以使用机器学习来建立从特征到性质的映射关系，或使用它来估计经验方程中的参数。后者的优点是得到的参数较少，便于使用。


    模型的性能以及所有预测结果与实验数据的对比图。结果显示，共识模型比单个模型更健壮。


    ### 3.2. 溶液自由


    溶液影响许多过程，如相平衡。溶液自由是另一个重要的热力学性质，吸引了化学和生物工程领域研究者的关注 [118–120]。三种方法可以导出溶液自由：(a) 来自溶剂中空腔的形成，这在物理和化学上都是的；(b)
    从本体中分离溶质颗粒，这在熵上是极不利的但在焓上有利；(c) 从熵和焓的角度考虑溶剂-溶质相互作用。许多方法已从热力学性质导出溶液自由或通过量子力学进行计算。


    Cai 等人 [116] 的另一项研究关注烃类的粘度温度特性，使用机器学习来预测经验方程的参数。他们获得了包含 21 种纯烃的 NIST 数据库，并使用它们回归一个
    Andrade 方程 [117]，通过两个参数 A 和 B 确定 T(η)。开发了一个神经网络来预测 B 和 T，使用了 35 种化学和分子描述符对烃类进行分类（烷烃、环烷烃和芳香烃），以及遗传算法。


    B 和 T 的预测通过测试集测量。相关系数 R 和 p 分别为 0.987 和 0.994，相对误差分别为 4.08% 和 2.50%。预测值与实验数据良好一致；然而，对比信息来自如
    ESOL（估计溶解度）[41]、FreeSol（自由溶解度数据库）[124] 和 MnSol（明尼苏达溶解度数据库）[125]。两者提供了溶解度和溶液自由


