    time-scale processes at an accurate level. However, some issues remain to be solved
    during the development of machine learning forces. One issue is how to handle
    data set with realistic data distribution and how counts [155] provide several
    methods to solve the issue.


    ## 5.2. Machine learning force field for water molecules


    The machine learning force field is capable of describing energy change accuracy.
    Controlling long-time-scale process is challenging for all-atom force fields in
    MD simulations. As shown in [57,58], coarse grained simulation of water calculations
    with the mW molecular force field. Without explicit hydrogen, the CG model can
    accelerate the nucleation process by several orders of magnitude. The limitation
    of CG models is the phase-changing mechanism. However, the dependence of the all-atom
    machine learning force field on energy AD has had bias effect. From the all-atom
    machine learning force field, Zhang et al [150] proposed a machine learning force
    field for water free from the constraints.


    They developed a coarse-grained machine learning force field for water. Each water
    molecule was treated as a particle, which contains only the oxygen atom, so that
    the oxygen correlation functions produced by the coarse grained machine learning
    force field agree well with those calculated by the all-atom machine learning
    force field. The coarse-grained model can describe the water phase accurately
    while retaining the description of the structural features.


    The data sets were constructed using MD simulations driven by both quantum mechanical
    and all-atom machine learning models.


    ## 5. Machine Learning Forces


    The machine learning force field could investigate the dynamics of complex systems
    with an accuracy of quantum calculations and efficiency of quantum calculations.


    ## 5.1. Atom-specific machine learning


    ionic force has a 7.5 times faster than the atomic force. The huge improvement
    in speed shows that the coarse-grained machine learning field has the ability
    to capture dynamics of big molecules like polymers (Fig. 11).


    machine learning models. For example, the weights of different models in deep
    neural networks are difficult to be directly related to the descriptors of molecules.
    Emerging algorithms computer science can provide a reference for chemical engineering.
    In recent years, such as active learning, neural network, and attention mechanism
    have been adopted by chemistry. These advanced methods provide new opportunities
    for broader applications of machine learning in thermodynamics.


    ## 6. Perspective


    The examples above show the promising role of machine learning in predicting and
    modeling properties of chemical materials. Material design also benefits from
    the combination of machine learning and high-throughput simulations. Machine learning
    force field can accelerate the computation of thermodynamics in complex systems.
    However, application of machine learning in chemical engineering remains in a
    primitive stage, due to the scarcity of datasets in this area of champions. Some
    methods may be expensive, unlike in NLP or computer vision, prediction models
    in chemistry and material science are often scarce. The challenges include the
    uncertainty of the model. Thus, establishing databases with high data diversity
    and reliability is of great significance for future machine learning applications.
    We expect more applications that combine high-throughput simulation and machine
    learning. Another issue is the interpretability of another important application
    in the field of quantum mechanics and all-atomic molecular dynamics. Current machine
    learning potential fields face some challenges, such as the limitation of element
    type and sensitivity with input configurations. Machine learning potentials have
    been developed and successfully accelerated simulations and it is becoming a powerful
    tool for computational chemistry.


