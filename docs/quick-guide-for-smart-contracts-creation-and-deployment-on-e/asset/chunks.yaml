    [msg.sender\\]\\[\\_spender\\] = \\_value;\n\nApproval(msg.sender, \\_spender,\
    \ \\_value);\n\nreturn true;\n\n}\n\nfunction transferFrom(address \\_from, address\
    \ \\_to, uint256 \\_value) public returns (bool success) {\n\nrequire(\\_value\
    \ <= balanceOf\\[\\_from\\]);\n\nrequire(\\_value <= allowance\\[\\_from\\]\\\
    [msg.sender\\]);\n\nbalanceOf\\[\\_from\\] -= \\_value;\n\nbalanceOf\\[\\_to\\\
    ] += \\_value;\n\nallowance\\[\\_from\\]\\[msg.sender\\] -= \\_value;\n\nTransfer(\\\
    _from, \\_to, \\_value);\n\nreturn true;\n\n}\n\n}\n\nLet's take a look at what\
    \ this smart contract does, and how it implements the ERC-20 standard:\n\n*  \
