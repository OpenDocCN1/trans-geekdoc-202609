    \ contract and types of functions that the smart contract must have. It also provides\
    \ some suggested functions that are nice to have, but ultimately optional. It\
    \ dictates certain events that our token must have, like a transfer event. See,\
    \ smart contracts can emit events that consumers can subscribe to, and with this\
    \ standard, we can subscribe to events that tell us when tokens are sold.\n\n\
    Here is an example implementation of the `transfer` function specified by the\
    \ ERC-20 standard. It is required by the smart contract, and governs how someone\
    \ can send an ERC-20 token from their wallet to another.\n\n```\ncontract ERC20Token\
    \ {\n\n // ...\n\n function transfer(address _to, uint256 _value) public returns\
    \ (bool success) {\n require(balanceOf[msg.sender] >= _value);\n balanceOf[msg.sender]\
    \ -= _value;\n balanceOf[_to] += _value;\n Transfer(msg.sender, _to, _value);\n\
    \ return true;\n }\n\n // ...\n}\n```\n\nThis function implements the ERC-20 standard\
    \ the following ways:\n\n*   The function exists.\n*   It accepts the correct\
