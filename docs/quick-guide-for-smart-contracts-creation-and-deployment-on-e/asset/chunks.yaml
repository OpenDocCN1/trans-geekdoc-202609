    **l) Library**


    Library is used so we don’t repeat the code I each new contract code. Lets declare
    library Math.


    pragma solidity 0.5.1;


    library Math{


    function divide(uint256 a, uint256 b) internal pure returns (uint256) {


    require(b>0);


    uint256 c=a/b;


    return c;


    }


    }


    contract MyContract {


    uint256 public value;


    function calaculate (uint \_value1, uint \_value2) public {


    value=Math.divide(\_value1, \_value2);


    }


    }


    MyContract will use the defined library Math to divide a and b.


    Deploy MyContract and give the values of a and b in the Calculate function fields.
    Attached the screenshot og the result:


    ![](images/159551592223141044_9.jpg)


    **m) Including library in separate file**


    We can put the library in separate file and call it inside the contract by including
    the library file.


    As an example, we opened new file for the Math library we wrote. The new file
    is Library.sol. Here the code inside the library:


    pragma solidity 0.5.1;


    library Math{


    function divide(uint256 a, uint256 b) internal pure returns (uint256) {


    require(b>0);


    uint256 c=a/b;


    return c;


    }


    }


    Then we can call the library file Math.sol inside MyContract.sol file through
    import command. Here the complete code:


    pragma solidity 0.5.1;


    import "./Math.sol";


    contract MyContract {


    uint256 public value;


    function calaculate (uint \_value1, uint \_value2) public {


    value=Math.divide(\_value1, \_value2);


    }


    }


