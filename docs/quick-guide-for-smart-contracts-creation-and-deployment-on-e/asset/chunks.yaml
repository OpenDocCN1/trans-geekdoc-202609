    balanceOf[_to] += _value;\n\nemit Transfer(_from, _to, _value);\n\n// 断言用于使用静态分析查找代码中的\
    \ bug。它们永远不应失败\nassert(balanceOf[_from] + balanceOf[_to] == previousBalances);\n\
    ```\n\n### `transfer` 函数\n\n```solidity\n/**\n * 转账代币\n *\n * 从您的账户向 `_to` 发送\
    \ `_value` 个代币\n *\n * @param _to 接收者地址\n * @param _value 发送数量\n */\nfunction\
    \ transfer(address _to, uint256 _value) public returns (bool success) {\n    _transfer(msg.sender,\
    \ _to, _value);\n    return true;\n}\n```\n\n### `transferFrom` 函数\n\n```solidity\n\
    /**\n * 从其他地址转账代币\n *\n * 代表 `_from` 向 `_to` 发送 `_value` 个代币\n *\n * @param _from\
    \ 发送者地址\n * @param _to 接收者地址\n * @param _value 发送数量\n */\nfunction transferFrom(address\
    \ _from, address _to, uint256 _value) public returns (bool success) {\n    require(_value\
    \ <= allowance[_from][msg.sender]); // 检查授权额度\n    allowance[_from][msg.sender]\
    \ -= _value;\n    _transfer(_from, _to, _value);\n    return true;\n}\n```\n\n\
    ### `approve` 函数\n\n```solidity\n/**\n * 为其他地址设置授权额度\n *\n * 允许 `_spender` 代表您花费不超过\
    \ `_value` 个代币\n *\n * @param _spender 被授权花费的地址\n * @param _value 最大可花费数量\n */\n\
    function approve(address _spender, uint256 _value) public returns (bool success)\
    \ {\n    allowance[msg.sender][_spender] = _value;\n    emit Approval(msg.sender,\
    \ _spender, _value);\n    return true;\n}\n```\n\n### `approveAndCall` 函数\n\n\
    ```solidity\n/**\n * 为其他地址设置授权额度并通知\n *\n * 允许 `_spender` 代表您花费不超过 `_value` 个代币，然后通知合约此事\n\
    \ *\n * @param _spender 被授权花费的地址\n * @param _value 最大可花费数量\n * @param _extraData\
    \ 发送给被授权合约的一些额外信息\n */\nfunction approveAndCall(address _spender, uint256 _value,\
    \ bytes memory _extraData) public returns (bool success) {\n    tokenRecipient\
    \ spender = tokenRecipient(_spender);\n    if (approve(_spender, _value)) {\n\
    \        spender.receiveApproval(msg.sender, _value, address(this), _extraData);\n\
    \        return true;\n    }\n}\n```\n\n### `burn` 函数\n\n```solidity\n/**\n *\
    \ 销毁代币\n *\n * 从系统中不可逆地移除 `_value` 个代币\n *\n * @param _value 要销毁的金额\n */\nfunction\
    \ burn(uint256 _value) public returns (bool success) {\n    require(balanceOf[msg.sender]\
    \ >= _value); // 检查发送者是否有足够余额\n    balanceOf[msg.sender] -= _value; // 从发送者扣除\n\
    \    totalSupply -= _value; // 更新 totalSupply\n    emit Burn(msg.sender, _value);\n\
    \    return true;\n}\n```\n\n### `burnFrom` 函数\n\n```solidity\n/**\n * 从其他账户销毁代币\n\
    \ *\n * 代表 `_from` 从系统中不可逆地移除 `_value` 个代币。\n *\n * @param _from 发送者地址\n * @param\
    \ _value 要销毁的金额\n */\nfunction burnFrom(address _from, uint256 _value) public\
    \ returns (bool success) {\n    require(balanceOf[_from] >= _value); // 检查目标余额是否足够\n\
    \    require(_value <= allowance[_from][msg.sender]); // 检查授权额度\n    balanceOf[_from]\
    \ -= _value; // 从目标余额扣除\n    allowance[_from][msg.sender] -= _value; // 从发送者的授权额度扣除\n\
    \    totalSupply -= _value; // 更新 totalSupply\n    emit Burn(_from, _value);\n\
    \    return true;\n}\n```\n\n## 部署注意事项\n\n部署代码时必须调整以下内容：\n\n1. **Contact Mycoin**\
    \ 必须是您的合约名称\n2. `totalSupply`\n3. `initalSupply`\n4. `tokenName`\n5. `tokenSymbol`\n\
    \n## 部署步骤\n\n1. 在 [`remix.ethereum.org/`](https://remix.ethereum.org/) 编译代码\n\
    2. 将 MetaMask 连接到 Rinkeby 测试网络\n3. 从水龙头 [`faucet.rinkeby.io/`](https://faucet.rinkeby.io/)\
    \ 获取测试以太币（将向您的以太坊账户发送 3 个以太币）\n4. 部署前设置以下参数示例：\n   - `initialSupply`: 1000000\n\
    \   - `tokenName`: hidaia\n   - `tokenSymbol`: hedaia\n\n![部署参数设置](img/159551591983952036_2.jpg)\n\
    \n5. 合约部署后，您将获得可填写的表单界面\n\n![合约交互界面](img/159551591982184671_3.jpg)\n\n6. 您可以尝试销毁一些代币，会看到总供应量减少了相应数量\n\
    7. 也可以尝试其他操作\n\n## 9. Solidity 入门教程\n\n### a) 数据类型与数据结构\n\n访问 [`remix.ethereum.org/`](https://remix.ethereum.org/)\
    \ 并创建新文件，命名为 `MyContract.sol`。\n\n首先在文件第一行声明要使用的 Solidity 编程语言版本：\n\n```solidity\n\
    pragma solidity ⁰.4.24;\n```\n\n现在可以像这样声明智能合约：\n\n```solidity\npragma solidity\
    \ ⁰.4.24;\n\ncontract MyContract {\n    // ...\n}\n```\n\n智能合约是在以太坊区块链上执行的代码片段。它的功能类似于\
    \ Web 上公开可访问的 API 微服务。智能合约的所有代码对公众可见，我们可以允许连接到网络的任何人调用智能合约上的函数。\n\n首先，我们将编程一个简单的“存储”智能合约，它能够：\n\
    - 存储一个值\n- 检索这个值\n\n我们将通过一个名为 `value` 的变量来创建一种在智能合约中存储字符串值的方式。Solidity 是静态类型语言，因此声明变量时必须首先指定数据类型：\n\
    \n```solidity\npragma solidity ⁰.4.24;\n\ncontract MyContract {\n    string value;\n\
    }\n```\n\n现在创建一个函数从存储中读取这个值。首先用 `function` 关键字声明一个名为 `get()` 的函数：\n\n```solidity\n\
    function get() {\n    // ...\n}\n```\n\n现在用 `return` 关键字从状态变量返回值。将此函数的“可见性”设为\
    \ `public`，以便任何连接到区块链的人都可以调用它。最后，为函数指定返回值类型 `string`：\n\n```solidity\npragma solidity\
    \ ⁰.4.24;\n\ncontract MyContract {\n    string value;\n\n    function get() public\
    \ view returns(string) {\n        return value;\n    }\n}\n```\n\n让我们创建一种从智能合约外部设置此值的方法。我们将创建一个\
    \ `set` 函数。我们只是创建了一个接受 `_value` 参数（类型为 `string`）的函数。此函数也是公开可见的，以便任何连接到区块链的人都可以调用它。现在实际更新智能合约的值：\n\
    \n```solidity\nfunction set(string _value) public {\n    value = _value;\n}\n\
    ```\n\n现在在智能合约的构造函数中为 `value` 状态变量设置默认值：\n\n```solidity\nconstructor() public\
    \ {\n    value = \"myValue\";\n}\n```\n\n请记住，以太坊区块链由称为“区块”的记录捆绑包组成，这些区块“链接在一起”构成公共账本。所有这些区块的基本单位是交易。您可以在下方看到它们的列表。您可以点击“向下”箭头查看收据的所有详细信息。\n\
    \n我将选择 JavaScript 虚拟机，它将在我们的浏览器中提供一个模拟区块链。\n\n让我们更新智能合约中的代码，使其兼容撰写本文时最新版本的 Solidity。我们可以修改智能合约代码的第一行：\n\
    \n```solidity\npragma solidity ⁰.5.1;\n```\n\n首先，修改 `get()` 和 `set()` 函数如下：\n\n\
    ```solidity\npragma solidity ⁰.5.1;\n\ncontract MyContract {\n    string value;\n\
    \n    constructor() public {\n        value = \"myValue\";\n    }\n\n    function\
    \ get() public view returns(string memory) {\n        return value;\n    }\n\n\
    \    function set(string memory _value) public {\n        value = _value;\n  \
    \  }\n}\n```\n\n我们也可以像这样给状态变量赋默认值：\n"
