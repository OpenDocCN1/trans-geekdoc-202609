  fmt: "\n# Solidity 基础数据类型与结构\n\n## 状态变量\n\n```solidity\nstring public value = \"\
    myValue\";\n```\n\n我们也可以将此值设置为永不改变的常量：\n\n```solidity\nstring public constant\
    \ value = \"myValue\";\n```\n\n我们可以像这样创建布尔状态变量：\n\n```solidity\nbool public myBool\
    \ = true;\n```\n\n这可以是 `true` 或 `false`。\n\n现在我们可以像这样创建整数：\n\n```solidity\nint\
    \ public myInt = 1;\n```\n\n整数可以是正数或负数，即有符号。如果你不希望数字为负数，可以像这样创建无符号整数：\n\n```solidity\n\
    uint public myUint = 1;\n```\n\n我们可以为数字指定位数。上述示例默认为 256 位。我们可以显式指定：\n\n```solidity\n\
    uint256 public myUint256 = 9999;\n```\n\n我们也可以将值限制为 8 位：\n\n```solidity\nuint8\
    \ public myUint8 = 8;\n```\n\n## b) Enums（枚举）\n\n现在让我们了解一下 Solidity 中的一些基本数据结构。首先，让我们看看\
    \ `Enum` 数据结构，它是在 Solidity 中跟踪枚举列表的一种方式。我们可以在编写智能合约时针对该列表进行检查。让我们在智能合约中创建一个枚举：\n\
    \n```solidity\nenum State { Waiting, Ready, Active }\n```\n\n以此为例，这将通过提供 `Waiting`、`Ready`\
    \ 和 `Active` 选项帮助我们跟踪智能合约的活动状态。我们可以像这样检查智能合约的当前状态：\n\n```solidity\nState public\
    \ state;\n```\n\n现在，我们可以在构造函数中设置默认状态：\n\n```solidity\nconstructor() public {\n\
    \    state = State.Waiting;\n}\n```\n\n我们可以像这样将当前状态更新为 `Active`：\n\n```solidity\n\
    function activate() public {\n    state = State.Active;\n}\n```\n\n最后，我们可以针对枚举列表进行检查，以查看状态当前是否为\
    \ `Active`：\n\n```solidity\nfunction isActive() public view returns(bool) {\n\
    \    return state == State.Active;\n}\n```\n\n现在最终的智能合约代码应如下所示：\n\n```solidity\n\
    pragma solidity 0.5.1;\n\ncontract MyContract {\n    enum State { Waiting, Ready,\
    \ Active }\n    State public state;\n\n    constructor() public {\n        state\
    \ = State.Waiting;\n    }\n\n    function activate() public {\n        state =\
    \ State.Active;\n    }\n\n    function isActive() public view returns(bool) {\n\
    \        return state == State.Active;\n    }\n}\n```\n\n## c) Structs（结构体）\n\n\
    Solidity 允许你使用 `Structs` 定义自己的数据类型。你基本上可以使用任意数据类型的任意属性来建模任何类型的数据。让我们通过创建一个 `people`\
    \ 结构体来看看这是如何工作的：\n\n```solidity\nstruct Person {\n    string _firstName;\n   \
    \ string _lastName;\n}\n```\n\n我们在这里建模了一个拥有 `_firstName` 和 `_lastName` 的人。请注意，我们能够指定任意想要的数据类型！这里我们对两个属性都使用了字符串。我们最多可以在此添加\
    \ 17 个不同的属性，且数据类型任意。\n\n现在我们需要一个地方来存储这个 `Person` 结构体。让我们使用数组！我们可以像这样声明 `people`\
    \ 数组：\n\n```solidity\nPerson[] public people;\n```\n\n请注意，我们在数组内声明类型，即 `Person`。我们还将可见性设置为\
    \ `public` 并将其赋值给名为 `people` 的状态变量。这将为我们提供一个函数，允许我们访问该数组内部的人员。我应该提到，在智能合约外部调用\
    \ `people()` 函数不会返回整个数组。相反，`people()` 函数将接受一个索引参数，允许我们根据该索引（从零开始）引用数组内部的人员。例如，我们可以像这样访问\
    \ `people` 数组中的第一个人：`people(0)`。\n\n现在让我们创建一种向该数组添加人员的方法。我们将创建一个 `addPerson()`\
    \ 函数：\n\n此函数将接受 `Person` 结构体属性的参数，然后实例化一个新的 `Person` 并使用 `push` 函数将其添加到 `people`\
    \ 数组中。它还会将 `peopleCount` 状态变量加 1。我们可以在智能合约中像这样实现该状态变量：`uint256 public peopleCount;`\n\
    \n```solidity\nfunction addPerson(string memory _firstName, string memory _lastName)\
    \ public {\n    people.push(Person(_firstName, _lastName));\n    peopleCount +=\
    \ 1;\n}\n```\n\n现在完成的智能合约代码应如下所示：\n\n```solidity\npragma solidity 0.5.1;\n\ncontract\
    \ MyContract {\n    Person[] public people;\n    uint256 public peopleCount;\n\
    \n    struct Person {\n        string _firstName;\n        string _lastName;\n\
    \    }\n\n    function addPerson(string memory _firstName, string memory _lastName)\
    \ public {\n        people.push(Person(_firstName, _lastName));\n        peopleCount\
    \ += 1;\n    }\n}\n```\n\n## d) Mapping（映射）\n\nSolidity 提供了一种称为 `mapping` 的数据结构，它允许我们存储键值对。此结构的作用很像其他语言中的关联数组或哈希表。我们可以在智能合约中像这样声明映射：\n\
    \n```solidity\nmapping(uint => Person) public people;\n```\n\n这将是一个存储 `Person`\
    \ 结构体的映射。它将替换我们在上一个示例中使用的 `people` 数组。键将是一个无符号整数，值将是一个 `Person` 结构体。我们将把键视为数据库\
    \ ID。我们可以更新 `Person` 结构体以跟踪该 ID：\n\n```solidity\nstruct Person { uint _id; string\
    \ _firstName; string _lastName; }\n```\n\n现在我们可以修改 `addPerson()` 函数以更新 `people`\
    \ 映射。以下代码使用 `peopleCount` 计数器缓存为人员创建 ID。然后使用该 ID 和传入的属性实例化一个新的 `Person` 结构体。然后将其添加到\
    \ `people` 映射中。完成的智能合约代码应如下所示：\n\n```solidity\npragma solidity 0.5.1;\n\ncontract\
    \ MyContract {\n    uint256 peopleCount = 0;\n    mapping(uint => Person) public\
    \ people;\n\n    struct Person {\n        uint _id;\n        string _firstName;\n\
    \        string _lastName;\n    }\n\n    function addPerson(string memory _firstName,\
    \ string memory _lastName) public {\n        peopleCount += 1;\n        people[peopleCount]\
    \ = Person(peopleCount, _firstName, _lastName);\n    }\n}\n```\n\n我们可以部署合约来检查代码。如果我在\
    \ `addPerson` 字段中输入：\n\n`\"_firstName\"=\"Hidaia\"` 和 `\"_lastName\"=\"Alassouli\"\
    `\n\n这将作为第一个元素存储在 `people` 数组中。我在 `people` 字段中输入 `1`，将获得存储在数组 `people` 中元素 `1`\
    \ 的数据。\n\n![图片](images/159551592035104727_4.jpg)\n\n## e) Function Visibility（函数可见性）\n\
    \n让我们谈谈函数可见性。在上一节中，我们多次使用了 `public` 函数可见性，以便网络连接的账户可以在智能合约外部调用智能合约函数。如果我们想创建仅在智能合约内部使用的函数怎么办？我们可以使用\
    \ `internal` 可见性来实现。让我们将 `peopleCount` 的增加封装到其自己的 `internal` 函数中：\n\n```solidity\n\
    function incrementCount() internal {\n    peopleCount += 1;\n}\n```\n\n此函数仅可在智能合约内部访问，而不能通过其他账户的公共接口访问。现在我们可以在\
    \ `addPerson()` 函数内部调用此函数：\n\n```solidity\nfunction addPerson(string memory _firstName,\
    \ string memory _lastName) public {\n    incrementCount();\n    people[peopleCount]\
    \ = Person(peopleCount, _firstName, _lastName);\n}\n```\n\n## f) Modifiers（修饰符）\n\
    \n现在这是其他类型函数可见性的一个示例。让我们谈谈函数修饰符。这些将允许我们为函数添加特殊行为，如添加权限。让我们创建一个修饰符，仅允许管理员或“所有者”调用\
    \ `addPerson()` 函数，并限制其他所有人调用此函数。\n\n首先，我们将创建一种存储此智能合约所有者的方法。我们可以使用状态变量来实现：\n\n\
    ```solidity\naddress owner;\n```\n\n现在让我们创建一个修饰符，检查调用函数的人是否为所有者：\n\n```solidity\n\
    modifier onlyOwner() {\n    require(msg.sender == owner);\n    _;\n}\n```\n\n\
    让我解释这段代码：\n\n首先，我们使用 `modifier` 关键字声明修饰符，后跟修饰符名称 `onlyOwner`。\n\n接下来，我们使用 `msg.sender`\
    \ 访问调用该函数的当前账户。\n"
  trans: "\n\n# Solidity 基础数据类型与结构\n\n## 状态变量\n\n```solidity\nstring public value\
    \ = \"myValue\";\n```\n\n我们也可以将此值设置为永不改变的常量：\n\n```solidity\nstring public constant\
    \ value = \"myValue\";\n```\n\n我们可以像这样创建布尔状态变量：\n\n```solidity\nbool public myBool\
    \ = true;\n```\n\n这可以是 `true` 或 `false`。\n\n现在我们可以像这样创建整数：\n\n```solidity\nint\
    \ public myInt = 1;\n```\n\n整数可以是正数或负数，即有符号。如果你不希望数字为负数，可以像这样创建无符号整数：\n\n```solidity\n\
    uint public myUint = 1;\n```\n\n我们可以为数字指定位数。上述示例默认为 256 位。我们可以显式指定：\n\n```solidity\n\
    uint256 public myUint256 = 9999;\n```\n\n我们也可以将值限制为 8 位：\n\n```solidity\nuint8\
    \ public myUint8 = 8;\n```\n\n## b) Enums（枚举）\n\n现在让我们了解一下 Solidity 中的一些基本数据结构。首先，让我们看看\
    \ `Enum` 数据结构，它是在 Solidity 中跟踪枚举列表的一种方式。我们可以在编写智能合约时针对该列表进行检查。让我们在智能合约中创建一个枚举：\n\
    \n```solidity\nenum State { Waiting, Ready, Active }\n```\n\n以此为例，这将通过提供 `Waiting`、`Ready`\
    \ 和 `Active` 选项帮助我们跟踪智能合约的活动状态。我们可以像这样检查智能合约的当前状态：\n\n```solidity\nState public\
    \ state;\n```\n\n现在，我们可以在构造函数中设置默认状态：\n\n```solidity\nconstructor() public {\n\
    \    state = State.Waiting;\n}\n```\n\n我们可以像这样将当前状态更新为 `Active`：\n\n```solidity\n\
    function activate() public {\n    state = State.Active;\n}\n```\n\n最后，我们可以针对枚举列表进行检查，以查看状态当前是否为\
    \ `Active`：\n\n```solidity\nfunction isActive() public view returns(bool) {\n\
    \    return state == State.Active;\n}\n```\n\n现在最终的智能合约代码应如下所示：\n\n```solidity\n\
    pragma solidity 0.5.1;\n\ncontract MyContract {\n    enum State { Waiting, Ready,\
    \ Active }\n    State public state;\n\n    constructor() public {\n        state\
    \ = State.Waiting;\n    }\n\n    function activate() public {\n        state =\
    \ State.Active;\n    }\n\n    function isActive() public view returns(bool) {\n\
    \        return state == State.Active;\n    }\n}\n```\n\n## c) Structs（结构体）\n\n\
    Solidity 允许你使用 `Structs` 定义自己的数据类型。你基本上可以使用任意数据类型的任意属性来建模任何类型的数据。让我们通过创建一个 `people`\
    \ 结构体来看看这是如何工作的：\n\n```solidity\nstruct Person {\n    string _firstName;\n   \
    \ string _lastName;\n}\n```\n\n我们在这里建模了一个拥有 `_firstName` 和 `_lastName` 的人。请注意，我们能够指定任意想要的数据类型！这里我们对两个属性都使用了字符串。我们最多可以在此添加\
    \ 17 个不同的属性，且数据类型任意。\n\n现在我们需要一个地方来存储这个 `Person` 结构体。让我们使用数组！我们可以像这样声明 `people`\
    \ 数组：\n\n```solidity\nPerson[] public people;\n```\n\n请注意，我们在数组内声明类型，即 `Person`。我们还将可见性设置为\
    \ `public` 并将其赋值给名为 `people` 的状态变量。这将为我们提供一个函数，允许我们访问该数组内部的人员。我应该提到，在智能合约外部调用\
    \ `people()` 函数不会返回整个数组。相反，`people()` 函数将接受一个索引参数，允许我们根据该索引（从零开始）引用数组内部的人员。例如，我们可以像这样访问\
    \ `people` 数组中的第一个人：`people(0)`。\n\n现在让我们创建一种向该数组添加人员的方法。我们将创建一个 `addPerson()`\
    \ 函数：\n\n此函数将接受 `Person` 结构体属性的参数，然后实例化一个新的 `Person` 并使用 `push` 函数将其添加到 `people`\
    \ 数组中。它还会将 `peopleCount` 状态变量加 1。我们可以在智能合约中像这样实现该状态变量：`uint256 public peopleCount;`\n\
    \n```solidity\nfunction addPerson(string memory _firstName, string memory _lastName)\
    \ public {\n    people.push(Person(_firstName, _lastName));\n    peopleCount +=\
    \ 1;\n}\n```\n\n现在完成的智能合约代码应如下所示：\n\n```solidity\npragma solidity 0.5.1;\n\ncontract\
    \ MyContract {\n    Person[] public people;\n    uint256 public peopleCount;\n\
    \n    struct Person {\n        string _firstName;\n        string _lastName;\n\
    \    }\n\n    function addPerson(string memory _firstName, string memory _lastName)\
    \ public {\n        people.push(Person(_firstName, _lastName));\n        peopleCount\
    \ += 1;\n    }\n}\n```\n\n## d) Mapping（映射）\n\nSolidity 提供了一种称为 `mapping` 的数据结构，它允许我们存储键值对。此结构的作用很像其他语言中的关联数组或哈希表。我们可以在智能合约中像这样声明映射：\n\
    \n```solidity\nmapping(uint => Person) public people;\n```\n\n这将是一个存储 `Person`\
    \ 结构体的映射。它将替换我们在上一个示例中使用的 `people` 数组。键将是一个无符号整数，值将是一个 `Person` 结构体。我们将把键视为数据库\
    \ ID。我们可以更新 `Person` 结构体以跟踪该 ID：\n\n```solidity\nstruct Person { uint _id; string\
    \ _firstName; string _lastName; }\n```\n\n现在我们可以修改 `addPerson()` 函数以更新 `people`\
    \ 映射。以下代码使用 `peopleCount` 计数器缓存为人员创建 ID。然后使用该 ID 和传入的属性实例化一个新的 `Person` 结构体。然后将其添加到\
    \ `people` 映射中。完成的智能合约代码应如下所示：\n\n```solidity\npragma solidity 0.5.1;\n\ncontract\
    \ MyContract {\n    uint256 peopleCount = 0;\n    mapping(uint => Person) public\
    \ people;\n\n    struct Person {\n        uint _id;\n        string _firstName;\n\
    \        string _lastName;\n    }\n\n    function addPerson(string memory _firstName,\
    \ string memory _lastName) public {\n        peopleCount += 1;\n        people[peopleCount]\
    \ = Person(peopleCount, _firstName, _lastName);\n    }\n}\n```\n\n我们可以部署合约来检查代码。如果我在\
    \ `addPerson` 字段中输入：\n\n`\"_firstName\"=\"Hidaia\"` 和 `\"_lastName\"=\"Alassouli\"\
    `\n\n这将作为第一个元素存储在 `people` 数组中。我在 `people` 字段中输入 `1`，将获得存储在数组 `people` 中元素 `1`\
    \ 的数据。\n\n![图片](img/159551592035104727_4.jpg)\n\n## e) Function Visibility（函数可见性）\n\
    \n让我们谈谈函数可见性。在上一节中，我们多次使用了 `public` 函数可见性，以便网络连接的账户可以在智能合约外部调用智能合约函数。如果我们想创建仅在智能合约内部使用的函数怎么办？我们可以使用\
    \ `internal` 可见性来实现。让我们将 `peopleCount` 的增加封装到其自己的 `internal` 函数中：\n\n```solidity\n\
    function incrementCount() internal {\n    peopleCount += 1;\n}\n```\n\n此函数仅可在智能合约内部访问，而不能通过其他账户的公共接口访问。现在我们可以在\
    \ `addPerson()` 函数内部调用此函数：\n\n```solidity\nfunction addPerson(string memory _firstName,\
    \ string memory _lastName) public {\n    incrementCount();\n    people[peopleCount]\
    \ = Person(peopleCount, _firstName, _lastName);\n}\n```\n\n## f) Modifiers（修饰符）\n\
    \n现在这是其他类型函数可见性的一个示例。让我们谈谈函数修饰符。这些将允许我们为函数添加特殊行为，如添加权限。让我们创建一个修饰符，仅允许管理员或“所有者”调用\
    \ `addPerson()` 函数，并限制其他所有人调用此函数。\n\n首先，我们将创建一种存储此智能合约所有者的方法。我们可以使用状态变量来实现：\n\n\
    ```solidity\naddress owner;\n```\n\n现在让我们创建一个修饰符，检查调用函数的人是否为所有者：\n\n```solidity\n\
    modifier onlyOwner() {\n    require(msg.sender == owner);\n    _;\n}\n```\n\n\
    让我解释这段代码：\n\n首先，我们使用 `modifier` 关键字声明修饰符，后跟修饰符名称 `onlyOwner`。\n\n接下来，我们使用 `msg.sender`\
    \ 访问调用该函数的当前账户。\n\n"
