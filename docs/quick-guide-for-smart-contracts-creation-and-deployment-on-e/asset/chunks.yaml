- raw: "    The address type represents a 20 byte value, which is meant to store an\
    \ Ethereum address. Variables that are typed as address also have members, including\
    \ balance and transfer.\n\n4.  **bytes1 through 32**  \n\n    This is a fixed-size\
    \ byte array.\n\n5.  **bytes**  \n\n    A dynamically-sized byte array.\n\n6.\
    \  **string**  \n\n    A dynamically signed string.\n\n7.  **mapping**  \n\n \
    \   Hash tables with key types and value types. We will look at mappings more\
    \ in depth later on in the course.\n\n8.  **struct**  \n\n    Structs allow you\
    \ to define new types. We will also cover this more in depth shortly.\n\n*   Let's\
    \ define a string variable in our contract.  Let's also define my age. No one\
    \ can have a negative age, so we will use an unsigned integer for this:\n\npragma\
    \ solidity ^0.4.18;\n\ncontract Coursetro {\n\nstring fName = 'Gary';\n\nuint\
    \ age = 34;\n\n}\n\n*   Solidity has four types of visibilities for both functions\
    \ and variables:\n\n1.  **Public**  \n\n    This allows you to define functions\
    \ or variables that can be called internally or through messages.\n\n2.  **Private**\
    \  \n\n    Private variables and functions are only available to the current contract\
    \ and not derived contracts.\n\n3.  **Internal**  \n\n    Fuctions and variables\
    \ that can only be accessed internally (current contract or derived).\n\n4.  **External**\
    \  \n\n    Functions that can be called from other contracts and transactions.\
    \ They cannot be called internally, except with \"this.functionName()\".\n\n*\
    \   **Let's add the public visibility to our variables:**\n\npragma solidity ^0.4.18;\n\
    \ncontract Coursetro {\n\nstring public fName = 'Gary';\n\nuint public age = 34;\n\
    \n}\n\n*   Click **Deploy**, we can now see on the right that we have 2 blue buttons\
    \ with the name of our variables and the associated values. When you define public\
    \ state variables, the EVM creates getter functions for them. So, you can actually\
    \ click on these buttons and it will return the value, as if it were a function.\n\
    \n*   Every smart contract has a constructor function. This constructor is called\
    \ when a contract is created. Inside of it, you can define the values of variables.\
    \ Let's re-adjust our code to work with a constructor:\n\npragma solidity ^0.4.18;\n\
    \ncontract Coursetro {\n\nstring public fName;\n\nuint public age;\n\nfunction\
    \ Coursetro() public {\n\nfName = 'Gary';\n\nage = 34;\n\n}\n\n}\n\n*   Variables\
    \ can be declared as being constant. As the name suggests, these are variables\
    \ with a constant value that does not change.Let's transform the **fName** variable\
    \ to a constant variable:\n\npragma solidity ^0.4.18;\n\ncontract Coursetro {\n\
    \nstring constant fName = 'Gary';\n\nuint public age;\n\nfunction Coursetro()\
    \ public {\n\nfName = 'Gary';\n\nage = 34;\n\n}\n\n}\n\nIn your IDE, you'll notice\
    \ a red \"X\" next to line 9. If you hover over it, you will notice that it says,\
    \ \"*TypeError: cannot assign to a constant variable*\". Remove line 9 and the\
    \ error goes away.\n\n*   Our smart contract at this point is pretty boring. Let's\
    \ integrate a potential user interaction where we can manually define a Coursetro\
    \ Instructor's name and age. Paste the following:\n\npragma solidity ^0.4.18;\n\
    \ncontract Coursetro {\n\nstring fName;\n\nuint age;\n\nfunction setInstructor(string\
    \ \\_fName, uint \\_age) public {\n\nfName = \\_fName;\n\nage = \\_age;\n\n}\n\
    \nfunction getInstructor() public constant returns (string, uint) {\n\nreturn\
    \ (fName, age);\n\n}\n\n}\n\n*   Our smart contract at this point is pretty boring.\
    \ Let's integrate a potential user interaction where we can manually define a\
    \ Coursetro Instructor's name and age. Paste the following:\n\npragma solidity\
    \ ^0.4.18;\n\ncontract Coursetro {\n\nstring fName;\n\nuint age;\n\nfunction setInstructor(string\
    \ \\_fName, uint \\_age) public {\n\nfName = \\_fName;\n\nage = \\_age;\n\n}\n\
    \nfunction getInstructor() public constant returns (string, uint) {\n\nreturn\
    \ (fName, age);\n\n}\n\n}\n\n*   We have two functions, setInstructor() and getInstructor().\
    \ **setInstructor** accepts 2 parameters, \\_fName and \\_age. Once called, we\
    \ set our string fName to the returned \\_fName, and same with age. Then, our\
    \ **getInstructor()** function is defined as being constant, and it returns a\
    \ string and a uint. This is where we return the fName and age variable once it's\
    \ called. Click **Deploy** and under the red **set Instructor** button, type in:\
    \ \"Gary\", 34 and click the button. Next, click on the **getInstructor()** button\
    \ and you will notice it now returns the inputed value! This is how you set variables\
    \ from user input in a smart contract.\n\n### 4\\. How to setup or install Ethereum\
    \ on Windows\n\n**4\\. How to setup or install Ethereum on Windows**\n\n*   Install\
    \ chocolatey on windows . Go to \"https://chocolatey.org/install\" and copy window\
    \ command or simply run below command to install chocolatey on windows\n\n@\"\
    %SystemRoot%System32WindowsPowerShellv1.0powershell.exe\" -NoProfile -InputFormat\
    \ None -ExecutionPolicy Bypass -Command \"iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))\"\
    \ && SET \"PATH=%PATH%;%ALLUSERSPROFILE%chocolateybin\"\n\n*   Run below command\
    \ to install Node Js\n\nchoco install nodejs.install –y\n\n*   Or simply download\
    \ the installer from \"https://nodejs.org/en/download/\" link\n\n*   Install Git.\
    \ To install either run below command\n\nchoco install git –y\n\n*   Or download\
    \ the installer from \"https://gitforwindows.org/\" link.\n\n*   Install Visual\
    \ Studio Code along with solidity extension. To install either run below command\n\
    \n. choco install VisualStudioCode –y\n\n*   Or download the installer from \"\
    https://www.visualstudio.com/downloads/\" link\n\n*   Install Python on Windows.\
    \ To install either run below command\n\nchoco install python –y\n\n*   Or download\
    \ the installer from \"https://www.python.org/downloads/\" link.\n\n*   Open the\
    \ visual studio consol. Go to extensions page. Install the solidity extension\n\
    \n*   Install Python on Windows. To install either run below command\n\nchoco\
    \ install python –y\n\n*   Install Ganache on Windows. Download the installer\
    \ from below link. http://truffleframework.com/ganache/\n\n*   Or install it from\
    \ command line\n\nnpm install –g ganache -cli\n\n*   What is ganache.When you\
    \ develop application, that application will be held in application server. In\
    \ case of Ethereum, the Ethereum blockchain will hold the smart contract. The\
    \ blockchain is acting as application server. Ganache is simulation blockchain\
    \ that runs locally in the system and simulate the Ethereum blockchin for you.\
    \ It comes as GUI or command line.\n\n*   When you run ganache, you will see this\
    \ image. You see many ether addresses. Each ether address has some ethereum on\
    \ it.\n\n![](images/15955159139154190_1.jpg)\n\n*   Remix is IDE used to build\
    \ smart contract. Remix web based IDE https://remix.ethereum.org\n\n*   Install\
    \ IDE from git or npm using below command npm \n\ninstall remix-ide -g remix-ide\
    \ git clone https://github.com/ethereum/remix-ide...\n\ncd remix-ide\n\nnpm  install\n\
    \nnpm  run setupremix   \n\nnpm start\n\n### 5\\. How to compile and deploy smart\
    \ contract on JavaScriptVM\n\n**5\\. How to compile and deploy smart contract\
    \ on JavaScriptVM**\n\n*   URL to open Remix IDE https://remix.ethereum.org\n\n\
    *   When we compile the solidity code, we get byte code that we can deploy in\
    \ Ethereum blockchain.\n\n*   Start new contract student.sol\n\n*   Below is smart\
    \ contract code\n\npragma solidity ^0.4.18;\n\ncontract student {\n\nstring name;\n\
    \nuint age;\n\nfunction setStudentDetails(string \\_name, uint \\_age) public{\n\
    \nname=\\_name;\n\nage=\\_age;\n\n}\n\nfunction getStudentDetails() public view\
    \ returns(string, uint){\n\nreturn (name, age);\n\n}\n\n}\n\n*   We must deploy\
    \ the smart contract on Blockchain. There are different blockchains available.Among\
    \ them are: main net block chain and test net blockchains. Or we can deploy the\
    \ smart conract on our self blockchain environment. We will use first to deploy\
    \ smart contract on the inbuilt blockchain inside the Remix IDE which is Java\
    \ Script VM.\n\n![](images/159551591335092675_1.jpg)"
