    ### 10\. ERC-20 smart contract and crowd sale (ICO) smart contract:


    **10\. ERC-20 smart contract and crowd sale (ICO) smart contract:**


    I''m going to show you how to code your own cryptocurrency on the Ethereum blockchain
    and sell it! I''ll show you how to create your own ERC-20 token and crowd sale
    step-by-step with Ethereum smart contracts, how to test the smart contracts, how
    to deploy the smart contracts to the Ethereum blockchain, and how to build an
    ICO website deployed to the web. I''ll also explain what an ERC-20 token is, how
    an Ethereum token works, how an initial coin offering (ICO) works.


    **a. What is an ERC-20 Token?**


    The Ethereum blockchain allows you to create your own cryptocurrency, or token,
    that can be purchased with Ether, the native cryptocurrency of the Ethereum blockchain.
    ERC-20 is simply a standard that specifies how these tokens behave, so that they
    are compatible with other platforms like cryptocurrency exchanges.


    Ethereum is a blockchain like Bitcoin. Like Bitcoin, Ethereum keeps track of account
    balances for people who own Ether, Ethereum’s native cryptocurrency. Unlike Bitcoin,
    Ethereum is also a platform that allows you to create your own token without creating
    a new blockchain.


    You can create an Ethereum token with a smart contract. ERC-20 is a standard that
    specifies how this token smart contract should work.


    Let’s use an example to understand how an ERC-20 token smart contract works. Let’s
    say that we want to create a token called “My Token” with the symbol “MTK” and
    that there will be 100,000,000 of these tokens in existence.


    First, the token smart contract keeps track of some basic token attributes. For
    example it records the name “My Token", the symbol that you see on a cryptocurrency
    exchange, and how many total tokens exist.


    It also keeps track of who owns “My Token” and how much.


    ERC-20 tokens can be transferred from one account to another as payment, just
    like any other cryptocurrency.


    They can also be purchased in a crowd sale, like an ICO, which we will examine
    in the next section.


    They can also be bought and sold on a cryptocurrency exchange.


    ### b. How ERC-20 Tokens Work


    **b. How ERC-20 Tokens Work**'
