    ```\nevent Purchase(\n    address indexed _buyer,\n    uint256 _amount\n);\n```\n\
    \nNow you know how to work with events inside Solidity. At this point your complete\
    \ smart contract code should look like this:\n\n```\npragma solidity 0.5.1;\n\n\
    contract MyContract {\n    mapping(address => uint256) public balances;\n    address\
    \ payable wallet;\n\n    event Purchase(\n        address indexed _buyer,\n  \
    \      uint256 _amount\n    );\n}\n```\n"
