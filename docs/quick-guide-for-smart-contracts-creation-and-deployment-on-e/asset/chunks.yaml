- raw: "Next, we use require() to check that the account calling the function is the\
    \ owner. If the result of the expression passed into require() evaluates to true,\
    \ then code resumes execution. If not, it throws an error. In this case, if the\
    \ account calling the function is not the owner, then Solidity will throw an error.\n\
    \nNow we can set the owner inside the smart contract as the account that deploys\
    \ the smart contract like this:\n\nconstructor() public {\n\nowner = msg.sender;\n\
    \n}\n\nNow we can add the modifier to the addPerson() function so that only the\
    \ owner can call it.Try to run your code to see if only the owner can call the\
    \ function successfully without any errors! At this point, the complete smart\
    \ contract code should look like this:\n\npragma solidity 0.5.1;\n\ncontract MyContract\
    \ {\n\nuint256 public peopleCount = 0;\n\nmapping(uint => Person) public people;\n\
    \naddress owner;\n\nmodifier onlyOwner() {\n\nrequire(msg.sender == owner);\n\n\
    \\_;\n\n}\n\nstruct Person {\n\nuint \\_id;\n\nstring \\_firstName;\n\nstring\
    \ \\_lastName;\n\n}\n\nconstructor() public {\n\nowner = msg.sender;\n\n}\n\n\
    function addPerson(\n\nstring memory \\_firstName,\n\nstring memory \\_lastName\n\
    \n)\n\npublic\n\nonlyOwner\n\n{\n\nincrementCount()\n\npeople\\[peopleCount\\\
    ] = Person(peopleCount, \\_firstName, \\_lastName);\n\n}\n\nfunction incrementCount()\
    \ internal {\n\npeopleCount += 1;\n\n}\n\n}\n\n**g) Time**\n\nWe can create a\
    \ new modifier that uses time to illustrate a use case for time in Solidity. We'll\
    \ create a new modifier called onlyWhileOpen that will check that the current\
    \ time on the blockchain is past a time that we specify. This is a common practice\
    \ when creating ICO crowdsale smart contracts that have an \"opening time\". Often\
    \ times, these smart contracts will reject investor contributions that are made\
    \ before the crowdsale has started. We can model similar behavior by restricting\
    \ access to the addPerson() function until after the opening time has passed.\
    \ First let's create a state variable to store the opening time:\n\nuint256 startTime;\n\
    \nWe can store the startTime with this state variable in seconds, as that's how\
    \ we express timestamps in Solidity. In fact, the time stamps are expressed in\
    \ unix time which is the number of seconds that have passed since Thursday, 1\
    \ January 1970. Now I'll set the start time in the constructor like this:\n\n\
    constructor() public {\n\nstartTime = (unic timestamp);\n\n}\n\nYou can use https://www.epochconverter.com/\
    \ to generate a unix timestamp in the future for your own purposes! Now let's\
    \ create a modifier to check that the start time has passed like this:\n\nmodifier\
    \ onlyWhileOpen() {\n\n **require(block.timestamp >= startTime);**\n\n\\_;\n\n\
    }\n\nFirst, we declare the modifier, just like we did in the last example. Next,\
    \ we require the specific condition.Then we compare the start time to \"now\"\
    , by checking the current block's timestamp with block.timestamp.\n\nNow we can\
    \ add the modifier to the addPerson() function\n\npragma solidity 0.5.1;\n\ncontract\
    \ MyContract {\n\n**uint256** **public peopleCount = 0;**\n\n**mapping(uint =>\
    \ Person) public people;**\n\nuint256 startTime;\n\n **modifier onlyWhileOpen()\
    \ {**\n\nrequire(block.timestamp >= startTime);\n\n\\_;\n\n}\n\n **struct Person\
    \ {**\n\n **uint \\_id;**\n\n **string \\_firstName;**\n\n **string \\_lastName;**\n\
    \n}\n\n**constructor()** **public {**\n\n**startTime =** **1544668513; // Update\
    \ this value**\n\n}\n\n **function addPerson(**\n\n **string memory \\_firstName,**\n\
    \n **string memory \\_lastName**\n\n **)**\n\n **public**\n\nonlyWhileOpen\n\n\
    \ **{**\n\npeople\\[peopleCount\\] = Person(peopleCount, \\_firstName, \\_lastName);\n\
    \n}\n\n **function incrementCount() internal {**\n\n**peopleCount +=** **1;**\n\
    \n}\n\n}\n\n**h) Sending Ether & Events**\n\nNow let's write a function that accepts\
    \ Ether. To demonstrate this, I'll create an ico-like contract with a buyToken()\
    \ function. This will allow an account to send ether to pay for tokens with Ether.\
    \ The smart contract will be responsible for issuing the tokens, tracking the\
    \ balance of the account, and also transferring the Ether funds to another wallet\
    \ address.\n\nFirst we'll create a mapping to track the token balances like this:\n\
    \nmapping(address => uint256) public balances;\n\nNow I'll create the buyToken()\
    \ function that will increment the balance like this:\n\nfunction buyToken() public\
    \ {\n\nbalances\\[msg.sender\\] += 1;\n\n}\n\nNow I'll declare a wallet where\
    \ the ether funds will be sent whenever an account buys tokens:\n\naddress wallet;\n\
    \nNow we can transfer funds to the wallet whenever the buyToken() function is\
    \ called like this:\n\nfunction buyToken() public payable {\n\nbalances\\[msg.sender\\\
    ] += 1;\n\nwallet.transfer(msg.value);\n\n}\n\nNow let me explain this code:\n\
    \nWe can transfer ether directly to the wallet by calling wallet.transfer()\n\n\
    We can get the value of the Ether sent in by function caller with msg.value, just\
    \ like msg.sender\n\nWe also must use the payable modifier so that accounts can\
    \ send Ether when calling the function.\n\nLikewise, to update to Solidity 0.5.1,\
    \ we must explicitly declare the wallet payable as well:\n\naddress payable wallet;\n\
    \nNow let's set the wallet address inside the constructor function of the contract\
    \ (we'll use the payable modifier here, too):\n\nconstructor(address payable \\\
    _wallet) public {\n\nwallet = \\_wallet;\n\n}\n\nAwesome! Now watch the video\
    \ above as I demonstrate how to send Ether with this function inside of Remix.\
    \ You complete smart contract code should look like this up to this point:\n\n\
    contract MyContract {\n\nmapping(address => uint256) public balances;\n\naddress\
    \ payable wallet;\n\nconstructor(address payable \\_wallet) public {\n\nwallet\
    \ = \\_wallet;\n\n}\n\nfunction buyToken() public payable {\n\nbalances\\[msg.sender\\\
    ] += 1;\n\nwallet.transfer(msg.value);\n\n}\n\n}\n\nWe can test the code. When\
    \ running the code, I deployed the contract with some ether address. Then I bought\
    \ tokens with other ether addr by clicking buy token and I set the amount ex:\
    \ 2 eth. Then I clicked the balance button. It shows the balance incremented by\
    \ 1 and the ether balances increased in deployed contract by 2 and decreased for\
    \ the buyer ether address by 2.\n\n![](images/159551592057389693_5.jpg)\n\nNow\
    \ I'll show you how to create a default or \"fallback\" function inside Solidity.\
    \ This is a function that will get called anytime an account sends Ether to a\
    \ smart contract. This is a very common pattern for ICO smart contracts, where\
    \ you simply send Ether to a smart contract and it executes a function. That's\
    \ exactly what we'll do here. We'll declare a fallback function that wraps the\
    \ buyTokens() function. It will purchase tokens any time an account sends Ether\
    \ to the smart contract. We can do that like this:\n\nfunction() external payable\
    \ {\n\nbuyToken();\n\n}\n\nNow let's talk about Events. Events are a way of dealing\
    \ with the asynchronous nature of the blockchain. We can declare events inside\
    \ smart contracts that can be subscribed to by external consumers. These consumers\
    \ will be able to listen for these events to know that something happened inside\
    \ the smart contract. We'll declare a Purchase event at the top of the smart contract\
    \ like this:\n\nevent Purchase(\n\naddress \\_buyer,\n\nuint256 \\_amount\n\n\
    );\n\nThis event will log the buyer and the token amount. We'll be able to trigger\
    \ this event inside the buyToken() function like this:\n\nfunction buyToken()\
    \ public payable {\n\nbalances\\[msg.sender\\] += 1;\n\nwallet.transfer(msg.value);\n\
    \nemit Purchase(msg.sender, 1);\n\n}\n\nThis event will allow us to know any time\
    \ a token is purchased inside this smart contract. But what if we only wanted\
    \ to listen for events that were relevant to our account? Good news! Solidity\
    \ allows us to subscribe to filter events by indexed values. We can index the\
    \ \\_buyer inside the event like this:\n\nevent Purchase(\n\naddress indexed \\\
    _buyer,\n\nuint256 \\_amount\n\n);\n\nNow you know how to work with events inside\
    \ Solidity. At this point your complete smart contract code should look like this:\n\
    \npragma solidity 0.5.1;\n\ncontract MyContract {\n\nmapping(address => uint256)\
    \ public balances;\n\naddress payable wallet;\n\nevent Purchase(\n\naddress indexed\
    \ \\_buyer,\n\nuint256 \\_amount\n\n);"
