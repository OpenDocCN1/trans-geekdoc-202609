    \ 代币，以太坊代币如何工作，以及首次代币发行（ICO）如何运作。\n\n## a. 什么是 ERC-20 代币？\n\n以太坊区块链允许你创建自己的加密货币或代币，可以用以太币（以太坊区块链的原生加密货币）购买。ERC-20\
