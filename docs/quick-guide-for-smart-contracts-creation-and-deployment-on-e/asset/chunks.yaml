    \nbalanceOf\\[msg.sender\\] -= \\_value;\n\nbalanceOf\\[\\_to\\] += \\_value;\n\
    \nTransfer(msg.sender, \\_to, \\_value);\n\n **return true;**\n\n}\n\n **// ...**\n\
    \n}\n\nThis function implements the ERC-20 standard the following ways:\n\n* \
    \  The function exists.\n\n*   It accepts the correct arguments.\n\n*   It fails\
    \ if the user doesn't have enough tokens to transfer, i.e., an insufficient balance.\n\
    \n*   It transfers the balance from the sender's account to the receiver's account.\n\
    \n*   It triggers a sell event.\n\n*   It returns the correct value, e.g., true.\n\
    \n### c. How a crowd sale (ICO) works\n\n**c. How a crowd sale (ICO) works**\n\
    \nERC-20 tokens can be distributed in a variety of ways. One popular method is\
    \ holding a crowd sale, or an initial coin offering (ICO). Crowd sales are a way\
    \ for a company to raise capital for their business by creating their own ERC-20\
    \ token that can be purchased by investors with Ether.\n\nYou can watch this video\
    \ below for more information on how crowd sales work in addition to following\
    \ along with this article.\n\nWhenever a crowd sale takes place, the company gets\
    \ liquid capital in the form of Ether that was paid by the investors, as well\
    \ as holding onto a reserved amount of the ERC-20 tokens that were sold in the\
    \ crowd sale.\n\nIn order to participate in a crowd sale, an investor must connect\
    \ to the Etherum Blockchain with an account. This account has a wallet address\
    \ that can store Ether, as well as the ERC-20 tokens that are purchased in the\
    \ crowd sale.\n\nThe investor must visit a crowd sale website that talks to a\
    \ smart contract. The smart contract governs all of the rules for how the crowd\
    \ sale works.\n\nWhenever an investor purchases tokens on the crowd sale website,\
    \ they send Ether from their wallet to the smart contract, and the smart contract\
    \ instantly dispenses the purchased tokens to their wallet.\n\nThe smart contract\
    \ sets the price of the token in the crowd sale and governs how the crowd sale\
    \ behaves.\n\nCrowd sales can take on all kinds of shapes and sizes. They can\
    \ have multiple tiers or phases, like Pre ICO, ICO, and ICO Bonus phase. Each\
    \ of these tiers can happen at different points of time and can behave differently.\n\
    \nThey can also have white lists to restrict which investors can purchase tokens.\n\
    \nThey can also have a reserved amount of tokens that are not sold in the crowd\
    \ sale. These reserves are usually set aside for specific members of each company\
    \ like founders and advisors. These reserves can be a fixed amount of tokens or\
    \ a percentage.\n\nWhenever a crowd sale ends, it can be finalized by an administrator.\
    \ Whenever this happens, all of the reserved tokens will be distributed to the\
    \ appropriate accounts and the crowd sale will officially be over.\n\n### d. Short\
    \ code of ERC20 smart contract\n\n**d. Short code of ERC20 smart contract**\n\n\
