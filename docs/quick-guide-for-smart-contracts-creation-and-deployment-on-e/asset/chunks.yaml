    \ `msg.sender`\n    /// @param _to The address of the recipient\n    /// @param\
    \ _value The amount of token to be transferred\n    /// @return Whether the transfer\
    \ was successful or not\n    function transfer(address _to, uint256 _value) public\
    \ returns (bool success);\n\n    /// @notice send `_value` token to `_to` from\
    \ `_from` on the condition it is approved by `_from`\n    /// @param _from The\
    \ address of the sender\n    /// @param _to The address of the recipient\n   \
    \ /// @param _value The amount of token to be transferred\n    /// @return Whether\
    \ the transfer was successful or not\n    function transferFrom(address _from,\
    \ address _to, uint256 _value) public returns (bool success);\n\n    /// @notice\
    \ `msg.sender` approves `_spender` to spend `_value` tokens\n    /// @param _spender\
    \ The address of the account able to transfer the tokens\n    /// @param _value\
    \ The amount of tokens to be approved for transfer\n    /// @return Whether the\
    \ approval was successful or not\n    function approve(address _spender, uint256\
    \ _value) public returns (bool success);\n\n    /// @param _owner The address\
    \ of the account owning tokens\n    /// @param _spender The address of the account\
    \ able to transfer the tokens\n    /// @return Amount of remaining tokens allowed\
    \ to spent\n    function allowance(address _owner, address _spender) public view\
    \ returns (uint256 remaining);\n\n    // solhint-disable-next-line no-simple-event-func-name\n\
    \    event Transfer(address indexed _from, address indexed _to, uint256 _value);\n\
    \    event Approval(address indexed _owner, address indexed _spender, uint256\
    \ _value);\n}\n```\n\n# 部署与测试 ERC20 智能合约\n\n## 部署步骤\n\n1. 首先在 Rinkeby 测试网络上部署智能合约\n\
    2. 运行 `EIP20`。部署 `EIP20` 智能合约时，必须输入初始数量、代币符号、小数位数和代币名称。示例设置：初始数量 = 100000000，代币名称\
    \ = \"Hidaia\"，代币符号 = \"HIDI\"，小数位数 = 2。\n\n   ![部署参数](img/159551593099238062_1.jpg)\n\
    \n3. 点击 transact。合约部署完成后，可查询以下数据：\n\n   ![合约数据](img/159551593114927686_2.jpg)\n\
    \n4. 可查询任意数据。例如：`BalanceOf = 100000000`\n\n   ![余额查询](img/159551593166352841_3.jpg)\n\
    \n5. 可通过 `transfer` 字段向其他地址转账代币。设置目标以太坊地址和代币数量。示例：向地址 `0x5673C69337457E0Cf7F68e86D878B2D35B0F9F46`\
    \ 转账 1000 个代币，随后检查余额。\n\n   ![转账操作](img/159551593172245506_4.jpg)\n\n6. 可在 Rinkeby\
    \ 测试网络使用 [`rinkeby.etherscan.io/`](https://rinkeby.etherscan.io/) 测试交易\n7. 在测试网络确认无误后，可在以太坊主网重复上述流程\n\
