  trans: "\n\n`address` 类型代表一个 20 字节的值，用于存储以太坊地址。类型为 `address` 的变量也拥有成员，包括 `balance`\
    \ 和 `transfer`。\n\n### 4. `bytes1` 到 `bytes32`\n\n这是固定大小的字节数组。\n\n### 5. `bytes`\n\
    \n动态大小的字节数组。\n\n### 6. `string`\n\n动态大小的字符串。\n\n### 7. `mapping`\n\n具有键类型和值类型的哈希表。我们将在课程后面更深入地探讨映射。\n\
    \n### 8. `struct`\n\n结构体允许你定义新类型。我们稍后也将更深入地介绍这一点。\n\n*   让我们在合约中定义一个字符串变量。也定义一下我的年龄。没有人会有负年龄，所以我们将使用无符号整数：\n\
    \n```\npragma solidity ⁰.4.18;\n\ncontract Coursetro {\n\n    string fName = 'Gary';\n\
    \n    uint age = 34;\n\n}\n```\n\n*   Solidity 对函数和变量都有四种可见性类型：\n\n#### 1. `Public`\n\
    \n这允许你定义可以在内部调用或通过消息调用的函数或变量。\n\n#### 2. `Private`\n\n私有变量和函数仅对当前合约可用，对派生合约不可用。\n\
    \n#### 3. `Internal`\n\n只能在内部访问的函数和变量（当前合约或派生合约）。\n\n#### 4. `External`\n\n可以从其他合约和交易调用的函数。它们不能在内部被调用，除非使用\
    \ `this.functionName()`。\n\n*   **让我们给变量添加 `public` 可见性：**\n\n```\npragma solidity\
    \ ⁰.4.18;\n\ncontract Coursetro {\n\n    string public fName = 'Gary';\n\n   \
    \ uint public age = 34;\n\n}\n```\n\n*   点击**部署**，我们现在可以在右侧看到 2 个蓝色按钮，显示着我们变量的名称和关联的值。当你定义\
    \ `public` 状态变量时，EVM 会为它们创建 getter 函数。所以，你实际上可以点击这些按钮，它会返回值，就像调用函数一样。\n\n*   每个智能合约都有一个构造函数。当合约被创建时会调用此构造函数。在其中，你可以定义变量的值。让我们调整代码以配合构造函数工作：\n\
    \n```\npragma solidity ⁰.4.18;\n\ncontract Coursetro {\n\n    string public fName;\n\
    \n    uint public age;\n\n    function Coursetro() public {\n\n        fName =\
    \ 'Gary';\n\n        age = 34;\n\n    }\n\n}\n```\n\n*   变量可以声明为 `constant`。顾名思义，这些是值恒定不变的变量。让我们将\
    \ `fName` 变量转换为 `constant` 变量：\n\n```\npragma solidity ⁰.4.18;\n\ncontract Coursetro\
    \ {\n\n    string constant fName = 'Gary';\n\n    uint public age;\n\n    function\
    \ Coursetro() public {\n\n        fName = 'Gary';\n\n        age = 34;\n\n   \
    \ }\n\n}\n```\n\n在你的 IDE 中，你会注意到第 9 行旁边有一个红色的 \"X\"。如果你悬停在上面，会注意到它提示 \"*TypeError:\
    \ cannot assign to a constant variable*\"（类型错误：无法赋值给常量变量）。删除第 9 行，错误就会消失。\n\n\
    *   到此我们的智能合约还很无聊。让我们集成一个潜在的用户交互，手动定义 Coursetro 讲师的姓名和年龄。粘贴以下代码：\n\n```\npragma\
    \ solidity ⁰.4.18;\n\ncontract Coursetro {\n\n    string fName;\n\n    uint age;\n\
    \n    function setInstructor(string _fName, uint _age) public {\n\n        fName\
    \ = _fName;\n\n        age = _age;\n\n    }\n\n    function getInstructor() public\
    \ constant returns (string, uint) {\n\n        return (fName, age);\n\n    }\n\
    \n}\n```\n\n*   我们有两个函数，`setInstructor()` 和 `getInstructor()`。`setInstructor`\
    \ 接受 2 个参数，`_fName` 和 `_age`。调用后，我们将字符串 `fName` 设置为返回的 `_fName`，`age` 同理。然后，我们的\
    \ `getInstructor()` 函数被定义为 `constant`，并返回一个 `string` 和一个 `uint`。这是调用时返回 `fName`\
    \ 和 `age` 变量的地方。点击**部署**，在红色的 **set Instructor** 按钮下，输入：\"Gary\", 34 并点击按钮。接着，点击\
    \ **getInstructor()** 按钮，你会注意到它现在返回输入的值！这就是在智能合约中通过用户输入设置变量的方法。\n\n## 4. 如何在 Windows\
    \ 上设置或安装以太坊\n\n*   在 Windows 上安装 Chocolatey。访问 \"https://chocolatey.org/install\"\
    \ 并复制 Windows 命令，或直接运行以下命令在 Windows 上安装 Chocolatey：\n\n```\n@\"%SystemRoot%\\\
    System32\\WindowsPowerShell\\v1.0\\powershell.exe\" -NoProfile -InputFormat None\
    \ -ExecutionPolicy Bypass -Command \"iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))\"\
    \ && SET \"PATH=%PATH%;%ALLUSERSPROFILE%\\chocolatey\\bin\"\n```\n\n*   运行以下命令安装\
    \ Node.js：\n\n```\nchoco install nodejs.install -y\n```\n\n*   或者直接从 \"https://nodejs.org/en/download/\"\
    \ 链接下载安装程序。\n\n*   安装 Git。要安装，请运行以下命令：\n\n```\nchoco install git -y\n```\n\n*\
    \   或者从 \"https://gitforwindows.org/\" 链接下载安装程序。\n\n*   安装 Visual Studio Code\
    \ 以及 Solidity 扩展。要安装，请运行以下命令：\n\n```\nchoco install VisualStudioCode -y\n```\n\
    \n*   或者从 \"https://www.visualstudio.com/downloads/\" 链接下载安装程序。\n\n*   在 Windows\
    \ 上安装 Python。要安装，请运行以下命令：\n\n```\nchoco install python -y\n```\n\n*   或者从 \"https://www.python.org/downloads/\"\
    \ 链接下载安装程序。\n\n*   打开 Visual Studio 控制台。转到扩展页面。安装 Solidity 扩展。\n\n*   在 Windows\
    \ 上安装 Ganache。从以下链接下载安装程序：http://truffleframework.com/ganache/\n\n*   或者从命令行安装：\n\
    \n```\nnpm install -g ganache-cli\n```\n\n*   **什么是 Ganache？** 当你开发一个应用程序时，该应用程序将托管在应用服务器上。在以太坊的情况下，以太坊区块链将持有智能合约。区块链充当应用服务器。Ganache\
