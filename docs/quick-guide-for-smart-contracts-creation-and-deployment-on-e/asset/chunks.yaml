    \nNow I'll show you how to create a default or \"fallback\" function inside Solidity.\
    \ This is a function that will get called anytime an account sends Ether to a\
    \ smart contract. This is a very common pattern for ICO smart contracts, where\
    \ you simply send Ether to a smart contract and it executes a function. That's\
    \ exactly what we'll do here. We'll declare a fallback function that wraps the\
    \ `buyTokens()` function. It will purchase tokens any time an account sends Ether\
    \ to the smart contract. We can do that like this:\n\n```\nfunction() external\
    \ payable {\n    buyToken();\n}\n```\n\nNow let's talk about Events. Events are\
    \ a way of dealing with the asynchronous nature of the blockchain. We can declare\
    \ events inside smart contracts that can be subscribed to by external consumers.\
    \ These consumers will be able to listen for these events to know that something\
    \ happened inside the smart contract. We'll declare a `Purchase` event at the\
    \ top of the smart contract like this:\n\n```\nevent Purchase(\n    address _buyer,\n\
    \    uint256 _amount\n);\n```\n\nThis event will log the buyer and the token amount.\
    \ We'll be able to trigger this event inside the `buyToken()` function like this:\n\
    \n```\nfunction buyToken() public payable {\n    balances[msg.sender] += 1;\n\
    \    wallet.transfer(msg.value);\n    emit Purchase(msg.sender, 1);\n}\n```\n\n\
    This event will allow us to know any time a token is purchased inside this smart\
