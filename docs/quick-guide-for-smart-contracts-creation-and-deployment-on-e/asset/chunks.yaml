    require(tokenContract.transfer(msg.sender, \_numberOfTokens));


    tokensSold += \_numberOfTokens;


    Sell(msg.sender, \_numberOfTokens);


    }


    function endSale() public {


    require(msg.sender == admin);


    require(tokenContract.transfer(admin, tokenContract.balanceOf(this)));


    // Just transfer the balance to the admin


    admin.transfer(address(this).balance);


    }


    }


    Let''s take a look at what this smart contract does, and how it functions as a
    crowd sale:


    *   It stores an admin account for the crowd sale address admin.


    *   It references the ERC-20 token smart contract DappToken public tokenContract.


    *   It stores the token price uint256 public tokenPrice.


    *   It stores the number of tokens sold uint256 public tokensSold.


    *   It implements a sell event so that consumers can get notifications whenever
    a token has been sold.


    *   It implements a buyTokens function that allows users to purchase tokens in
    the crowd sale.


    *   It implements an endSale function that allows an admin to end the crowd sale
    and collect the Ether funds that was raised during the sale.


