  trans: "\nEthereum 允许开发者编写运行在区块链上的应用程序，并通过智能合约来实现，智能合约封装了这些应用程序的所有业务逻辑。它们使我们能够读取和写入区块链数据，以及执行代码。智能合约是用一种名为\
    \ Solidity 的编程语言编写的，它看起来很像 Javascript。它是一门功能齐全的编程语言，能让我们做许多 Javascript 能做的事情，但由于其用例不同，它的行为略有差异，正如我们在本教程中将看到的那样。\n\
    \n在 ERC-20 代币的情况下，智能合约管控代币运作的所有行为，并记录代币所有权和账户余额。\n\nERC-20 是关于如何构建 Ethereum 代币的\
    \ API 规范。它是一个社区采用的标准，使代币能在各种用例中得到支持。我们想要构建一个符合该标准的代币，以便它能被广泛接受。如果没有这样的标准，我们可能会有无穷无尽的方式来创建代币，而它们彼此可能不兼容！\n\
    \n使用 ERC-20 标准可确保代币符合以下用例（以及更多）：\n\n*   钱包转账 - 从一个账户向另一个账户发送代币\n*   在加密货币交易所买卖\n\
    *   在众筹（ICO）中购买代币，就像我们将在本教程中演示的那样\n\nERC-20 规范本质上规定了智能合约必须响应的接口。它指定了智能合约的结构以及智能合约必须拥有的函数类型。它还提供了一些建议拥有但最终可选的函数。它规定了我们的代币必须拥有的特定事件，比如转账事件。你看，智能合约可以触发事件供使用者订阅，有了这个标准，我们就可以订阅事件，在代币售出时收到通知。\n\
    \n下面是 ERC-20 标准指定的 `transfer` 函数的一个实现示例。智能合约要求有此函数，它管控用户如何将 ERC-20 代币从其钱包发送到另一个钱包。\n\
    \n```\ncontract ERC20Token {\n\n // ...\n\n function transfer(address _to, uint256\
    \ _value) public returns (bool success) {\n require(balanceOf[msg.sender] >= _value);\n\
    \ balanceOf[msg.sender] -= _value;\n balanceOf[_to] += _value;\n Transfer(msg.sender,\
    \ _to, _value);\n return true;\n }\n\n // ...\n}\n```\n\n该函数通过以下方式实现了 ERC-20 标准：\n\
    \n*   该函数存在。\n*   它接受正确的参数。\n*   如果用户没有足够的代币进行转账，即余额不足，则失败。\n*   它将余额从发送者账户转移到接收者账户。\n\
    *   它触发一个出售事件。\n*   它返回正确的值，例如 true。\n\n### c. 众筹（ICO）如何运作\n\nERC-20 代币可以通过多种方式分发。一种流行的方法是举办众筹，或首次代币发行（ICO）。众筹是公司通过创建自己的\
    \ ERC-20 代币供投资者用 Ether 购买，从而为其业务筹集资金的一种方式。\n\n除了阅读本文外，您还可以观看下面的视频，了解更多关于众筹如何运作的信息。\n\
    \n每当进行众筹时，公司都会获得投资者支付的 Ether 形式的流动资金，同时保留一部分在众筹中售出的 ERC-20 代币。\n\n为了参与众筹，投资者必须使用账户连接到以太坊区块链。该账户拥有一个钱包地址，可存储\
    \ Ether 以及在众筹中购买的 ERC-20 代币。\n\n投资者必须访问一个与智能合约交互的众筹网站。智能合约管控众筹运作的所有规则。\n\n每当投资者在众筹网站上购买代币时，他们会从自己的钱包向智能合约发送\
    \ Ether，智能合约会即时将购买的代币分发到他们的钱包中。\n\n智能合约设定众筹中的代币价格，并管控众筹的行为。\n\n众筹可以呈现各种形式和规模。它们可以有多个层级或阶段，如\
    \ Pre ICO、ICO 和 ICO 奖励阶段。每个层级可以在不同的时间点发生，并表现出不同的行为。\n\n它们也可以设有白名单，以限制哪些投资者可以购买代币。\n\
    \n它们还可以预留一部分不在众筹中出售的代币。这些预留代币通常留给公司的特定成员，如创始人和顾问。这些预留可以是固定数量的代币，也可以是一个百分比。\n\n\
    每当众筹结束时，管理员可以将其最终确定。一旦发生这种情况，所有预留代币将分发给相应账户，众筹正式结束。\n\n### d. ERC20 智能合约简短代码\n\
    \n让我们开始构建我们的 ERC-20 代币吧！这是完整的 ERC-20 代币智能合约 Solidity 代码。创建文件 `DappToken.sol`。\n\
    \n```\npragma solidity ⁰.4.2;\n\ncontract DappToken {\n\n string public name =\
    \ \"DApp Token\";\n string public symbol = \"DAPP\";\n string public standard\
    \ = \"DApp Token v1.0\";\n uint256 public totalSupply;\n\n event Transfer(\n address\
    \ indexed _from,\n address indexed _to,\n uint256 _value\n );\n\n event Approval(\n\
    \ address indexed _owner,\n address indexed _spender,\n uint256 _value\n );\n\n\
    \ mapping(address => uint256) public balanceOf;\n mapping(address => mapping(address\
    \ => uint256)) public allowance;\n\n function DappToken (uint256 _initialSupply)\
    \ public {\n balanceOf[msg.sender] = _initialSupply;\n totalSupply = _initialSupply;\n\
    \ }\n\n function transfer(address _to, uint256 _value) public returns (bool success)\
    \ {\n require(balanceOf[msg.sender] >= _value);\n balanceOf[msg.sender] -= _value;\n\
    \ balanceOf[_to] += _value;\n Transfer(msg.sender, _to, _value);\n return true;\n\
    \ }\n\n function approve(address _spender, uint256 _value) public returns (bool\
    \ success) {\n allowance[msg.sender][_spender] = _value;\n Approval(msg.sender,\
    \ _spender, _value);\n return true;\n }\n\n function transferFrom(address _from,\
    \ address _to, uint256 _value) public returns (bool success) {\n require(_value\
    \ <= balanceOf[_from]);\n require(_value <= allowance[_from][msg.sender]);\n balanceOf[_from]\
    \ -= _value;\n balanceOf[_to] += _value;\n allowance[_from][msg.sender] -= _value;\n\
    \ Transfer(_from, _to, _value);\n return true;\n }\n\n}\n```\n\n让我们看看这个智能合约的作用，以及它是如何实现\
    \ ERC-20 标准的：\n\n*   它存储代币名称 `string public name = \"DApp Token\"`。\n*   它存储用于加密货币交易所的代币符号\
    \ `string public symbol = \"DAPP\"`。\n*   它存储存在的代币总供应量 `uint256 public totalSupply`。\n\
    *   它使用 Solidity 映射来存储拥有代币的每个账户的余额 `mapping(address => uint256) public balanceOf`。\n\
    *   它实现了 `transfer` 函数，允许用户向另一个账户发送代币。\n*   它实现了 `approve` 函数，允许另一个账户花费代币，比如在加密货币交易所上。这会更新\
    \ `allowance` 映射，以查看该账户被允许花费多少。\n*   它实现了 `transferFrom` 函数，允许另一个账户转移代币。\n\n###\
    \ e. 众筹（ICO）智能合约简短代码\n\n现在我们可以构建一个众筹智能合约，允许投资者在首次代币发行（ICO）中购买代币。这是完整的众筹智能合约 Solidity\
    \ 代码：\n\n```\npragma solidity ⁰.4.2;\n\nimport \"./DappToken.sol\";\n\ncontract\
    \ DappTokenSale {\n\n address admin;\n DappToken public tokenContract;\n uint256\
    \ public tokenPrice;\n```\n"
