    \n![](img/159551592354341205_10.jpg)\n\n# 10. ERC-20 智能合约与众筹（ICO）智能合约\n\n我将向你展示如何在以太坊区块链上编写你自己的加密货币并将其出售！我将分步演示如何使用以太坊智能合约创建你自己的\
