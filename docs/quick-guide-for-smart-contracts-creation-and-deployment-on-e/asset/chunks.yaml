    We can also set this value as a constant that will never change like this:


    string public constant value = "myValue";


    We can create a boolean state variable like this:


    bool public myBool = true;


    This can be either true or false.


    Now we can create an integer like this:


    int public myInt = 1;


    Integers can be positive or negative, i.e., signed. If you don''t want a number
    to be negative, you can create an unsigned integer like this:


    uint public myUint = 1;


    We can specify the number of bits for the number. The above example defaults to
    256 bits. We can be explicit like this:


    uint256 public myUint256 = 9999;


    We can also restrict the value to 8 bits, like this:


    uint8 public myUint8 = 8;


    **b) Enums**


    Now let''s go over some basic data structures in solidity. First, let''s look
    at the Enum data structure, which are a way of keeping track of enumerated lists
    in Solidity. We can check against this list whenever you''re writing smart contracts.
    Let''s create an enum in the smart contract like this:


    enum State { Waiting, Ready, Active }


    Just as an example, this will help us keep track of the active state of the smart
    contract by providing Waiting, Ready, and Active options. We can check the current
    state of the smart contract like this:


    State public state;


    Now, we can set the default state in the constructor:


    constructor() public {


    state = State.Waiting;


    }


    We can update the current state to active like this:


    function activate() public {


    state = State.Active;


    }


    And finally, we can check against the enum list to see if the state is currently
    active like this:


    function isActive() public view returns(bool) {


    return state == State.Active;


    }


    Now the final smart contract code should look like this:


    pragma solidity 0.5.1;


    contract MyContract {


    enum State { Waiting, Ready, Active }


    State public state;


    constructor() public {


    state = State.Waiting;


    }


    function activate() public {


    state = State.Active;


    }


    function isActive() public view returns(bool) {


    return state == State.Active;


    }


    }


    **c) Structs**


    Solidity allows you to define your own data types with Structs. You can basically
    model any kind of data you want with arbitrary attributes of varying data types.
    Let''s look at how this works by creating a people struct:


    struct Person {


    string \_firstName;


    string \_lastName;


    }


    We''ve modeled a person here that has a \_firstName and \_lastName. Notice that
    we''re able to specify any data type that we want! We''ve used strings for both
    attributes here. We could add up to 17 different attributes here with any data
    type.


    Now we need a place to store this person struct. Let''s use an array for this!
    We can declare people array like this:


    Person\[\] public people;


    Notice we declare the type within the array, i.e., Person. We also set the visibility
    to public and assigned it to a state variable called people. This will provide
    us with a function that will allow us to access the people inside this array.
    I should mention though, that calling the people() function outside the smart
    contract will not return the entire array. Instead, the people() function will
    accept an index argument that will allow us to reference the person inside the
    array based upon that index, which is zero-based. For example, we can access the
    first person in the people array like this: people(0)


    Now let''s create a way to add a person to this array. We''ll create an addPerson()
    function like this:


    This function will accept the arguments for the person struct attributes, then
    instantiate a new person and add it to the people array with the push function.
    It also increments the peopleCount state variable by 1. We can implement that
    state variable in the smart contract like this: uint256 public peopleCount;


    function addPerson(string memory \_firstName, string memory \_lastName) public
    {


    people.push(Person(\_firstName, \_lastName));


    peopleCount += 1;


    }


    Now the completed smart contract code should look like this:


    pragma solidity 0.5.1;


    contract MyContract {


    Person\[\] public people;


    uint256 public peopleCount;


    struct Person {


    string \_firstName;


    string \_lastName;


    }


    function addPerson(string memory \_firstName, string memory \_lastName) public
    {


    people.push(Person(\_firstName, \_lastName));


    peopleCount += 1;


    }


    **}            **


    **d) Mapping**


    Solidity provides a data structure called a mapping which allows us to store key-value
    pairs. This structure acts much like an associative array or a hash table in other
    functions. We can declare a mapping in the smart contact like this:


    mapping(uint => Person) public people;


    This will be a mapping where we store person structs. It will replace the people
    array we used in the previous example. The key will be an unsigned integer, and
    the value will be a person struct. We''ll treat the key like a database id. We
    can update the person struct to keep track of that id like this:


    struct Person { uint \_id; string \_firstName; string \_lastName; }


    Now we can modify the addPerson() function to update the people mapping. The following
    code uses the peopleCount counter cache to create an id for the person. Then it
    instantiates a new person struct with the id and the passed in attributes. It
    then adds this to the people mapping. The completed smart contract code should
    look like this:


    pragma solidity 0.5.1;


    contract MyContract {


    uint256 peopleCount = 0;


    mapping(uint => Person) public people;


    struct Person {


    uint \_id;


    string \_firstName;


    string \_lastName;


    }


    function addPerson(string memory \_firstName, string memory \_lastName) public
    {


    peopleCount += 1;


    people\[peopleCount\] = Person(peopleCount, \_firstName, \_lastName);


    }


    }


    We can deploy the contract to check the code. If I putin addPerson field:


    “\_firstName”=”Hidaia” and “\_secondName”=”Alassouli”


    This will be stored as the first element in people array. I put 1 in people field
    and I will get the data stored in the element 1 in array people.


    ![](images/159551592035104727_4.jpg)


    **e) Function Visibility**


    Let''s talk about function visibility. In the last sections, we used the public
    function visibility several times so that the smart contract functions can be
    called outside the smart contract by accounts connected to the network. What if
    we wanted to create functions that are only used inside the smart contract? We
    can do this with the internal visibility. Let’s increment the peopleCount to its
    own internal function like this:


    **function incrementCount() internal {**


    peopleCount += 1;


    }


    This function will only be accessible inside the smart contract, not by the public
    interface for other accounts. Now we can call this function inside the addPerson()
    function like this:


    function addPerson(string memory \_firstName, string memory \_lastName) public
    {


    incrementCount()


    people\[peopleCount\] = Person(peopleCount, \_firstName, \_lastName);


    }


    **f) Modifiers**


    Now that''s an example of other types of function visibly. Let''s talk about function
    modifiers. These will allow us to add special behavior to our functions, like
    add permissions. Let''s create a modifier that only allows an admin or "owner"
    to call the addPerson() function, and restrict everyone else from calling this
    function.


    First, we''ll create a way to store the owner of this smart contract. We can do
    that with a state variable like this:


    address owner;


    Now let''s create a modifier that checks if the person calling the function is
    the owner:


    modifier onlyOwner() {


    require(msg.sender == owner);


    \_;


    }


