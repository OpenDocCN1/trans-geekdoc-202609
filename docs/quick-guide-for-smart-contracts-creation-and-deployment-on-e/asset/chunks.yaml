    \ internal {\n        peopleCount += 1;\n    }\n}\n```\n\n### h) Sending Ether\
    \ & Events\n\nNow let's write a function that accepts Ether. To demonstrate this,\
    \ I'll create an ico-like contract with a `buyToken()` function. This will allow\
    \ an account to send ether to pay for tokens with Ether. The smart contract will\
    \ be responsible for issuing the tokens, tracking the balance of the account,\
    \ and also transferring the Ether funds to another wallet address.\n\nFirst we'll\
