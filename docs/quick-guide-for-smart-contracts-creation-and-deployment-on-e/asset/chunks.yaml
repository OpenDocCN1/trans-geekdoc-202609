    *   Or install it from command line


    npm install –g ganache -cli


    *   What is ganache?? When you develop application, that application will be held
    in application server. In case of ethereum, the Ethereum blockchain will hold
    the smart contract. The blockchain is acting as application server. Ganache is
    simulation blockchain that runs locally in the system and simulate the Ethereum
    blockchin for you. It comes as GUI or command line.


    *   When you run ganache, you will see this image. You see many ether addresses.
    Each ether address has some money on it.


    ![](images/159551591363022050_1.jpg)


