- raw: "\n\n![cover](images/cover.jpeg)\n\nDr. Hedaya Mahmood Alasooly  \n\n# Quick\
    \ Guide for Smart Contracts Creation and Deployment on Ethereum Blockchain\n\n\
    ## \n\nBookRix GmbH & Co. KG  \n\n80331 Munich  \n\n### Quick Guide for Smart\
    \ Contracts Creation and Deployment on Ethereum Blockchain\n\n**Quick Guide for\
    \ Smart Contracts Creation and Deployment on Ethereum Blockchain**\n\nBy\n\nDr.\
    \ Hedaya Mahmood Alasooly\n\nHedaya\\_alasooly@yahoo.com\n\n### 1\\. Overview:\n\
    \n**1\\. Overview:**\n\nThis work explains briefly the creation and deployment\
    \ Of Smart Contract on Ethereum Blockchain. The work consists from the following\
    \ sections\n\n*   Blockchain\n\n*   Solidity variables and types\n\n*   How to\
    \ Setup or Install Ethereum on Windows\n\n*   How to compile and deploy smart\
    \ contract on JavaScriptVM\n\n*   How to install Ganache Blockchain on Windows\
    \ and deploy smart contract using it.\n\n*   How to compile and deploy Smart Contract\
    \ on Test Networks,\n\n*   Quick example of deploying ERC20 token smart contract.\n\
    \n*   Getting started tutorial on Solidity\n\n*   Creating ERC-20 smart contract\
    \ and crowd sale (ICO) smart contract without coding\n\n*   ERC-20 smart contract\
    \ and crowd sale (ICO) smart contract:\n\n*   Creating Ethereum ERC-20 Tokens\
    \ and Crowd Sales (ICO) without coding with Token Wizard:\n\n*   Example of creating\
    \ and deploying an ERC20 token on the test and main network!!!\n\n### 2\\. Blockchain:\n\
    \n**2\\. Blockchain:**\n\nA blockchain is a digital record of transactions. The\
    \ name comes from its structure, in which individual records, called blocks, are\
    \ linked together in single list, called a chain. Blockchains are used for recording\
    \ transactions made with cryptocurrencies, such as Bitcoin, and have many other\
    \ applications.\n\nEach transaction added to a blockchain is validated by multiple\
    \ computers on the Internet. These systems, which are configured to monitor specific\
    \ types of blockchain transactions, form a peer-to-peer network. They work together\
    \ to ensure each transaction is valid before it is added to the blockchain. This\
    \ decentralized network of computers ensures a single system cannot add invalid\
    \ blocks to the chain.\n\nWhen a new block is added to a blockchain, it is linked\
    \ to the previous block using a cryptographic hash generated from the contents\
    \ of the previous block. This ensures the chain is never broken and that each\
    \ block is permanently recorded. It is also intentionally difficult to alter past\
    \ transactions in blockchain since all the subsequent blocks must be altered first.\n\
    \n*   **Blockchain Uses:** While blockchain is widely known for its use in cryptocurrencies\
    \ such as Bitcoin, Litecoin, and Ether, the technology has several other uses.\
    \ For example, it enables \"smart contracts,\" which execute when certain conditions\
    \ are met. This provides an automated escrow system for transactions between two\
    \ parties. Blockchain can potentially be used to allow individuals to pay each\
    \ other without a central clearing point, which is required for ACH and wire transfers.\
    \ It has potential to greatly increase the efficiency of stock trading by allowing\
    \ transactions to settle almost instantly instead of requiring three or more days\
    \ for each transaction to clear. Blockchain technology can also be used for non-financial\
    \ purposes. For example, the InterPlanetary File System (IFPS) uses blockchain\
    \ to decentralize file storage by linking files together over the Internet. Some\
    \ digital signature platforms now use blockchain to record signatures and verify\
    \ documents have been digitally signed. Blockchain can even be used to protect\
    \ intellectual property by linking the distribution of content to the original\
    \ source.\n\n*   Blockchain is decentralized database that consists from records\
    \ and data. The entire data is spread out in bounch of distributed computers to\
    \ end to be pear to pear p2p network. The records in these databases are stored\
    \ in form of blocks which linked together in secured way.\n\n*   The bitcoin blockchain\
    \ stores data specific to keep track of crypto currencies balances between different\
    \ parties.\n\n*   Ethereum block chain can store much more deep data than bitcoin\
    \ block chain. Ethereum block chain allows building decentralized apps. These\
    \ decentralized apps defined by smart contracts. So smart contract allows individuals\
    \ to exchange information in trusted confident free manner without relying on\
    \ third party as bank or lawyer or other way. So these Ethereum smart contracts\
    \ stored in special transections in Ethereum blockchain which can be used then\
    \ to build applications. So you can think on smart contracts as decentralized\
    \ api's. As smart contracts stored in Ethereum blockchains, they need to be validated\
    \ or mined as any other transactions. So there is small costs associated with\
    \ deploying smart contracts.\n\n*   How to code smart contract. We do that with\
    \ solidity. Solidity is a code used. Solidity is a language used to code smart\
    \ contract. And syntax is similar to java script and is designed with Ethereum\
    \ virtual machine in mind. So we will use solidity to create smart contract in\
    \ web based ide called remex\n\n### 3\\. Solidity variables and types\n\n**3\\\
    . Solidity variables and types**\n\n*   You can write the solidity and test code\
    \ in https://remix.ethereum.org/.\n\n*   Here screen of https://remix.ethereum.org\n\
    \n![](images/159551591299085953_1.jpg)\n\n*   Create new contract. I called it\
    \ Coursetro.\n\n*   Start off by writing (or pasting) the following code:\n\n\
    pragma solidity ^0.4.18;\n\ncontract Coursetro {\n\n}\n\nThe very first line defines\
    \ the version of solidity you're going to use.\n\nNext, you define the contract\
    \ and its name and open it up like a JavaScript class.\n\n*   On the right side\
    \ of the browser under the Run tab, you will see a Deploy button. Click on this.\
    \ You will notice that underneath the Deploy button shows a new section with the\
    \ name of the contract and \"at 0x...\" (memory):\n\n![](images/159551591230265132_2.jpg)\n\
    \n*   This means that the smart contract (yes, it's not very smart at this point)\
    \ lives at an address. To see this full address along with other information,\
    \ in the debugger if you click on the **Details** button, it will provide you\
    \ with more information:\n\n*   Notice there's a **contractAddress**, this is\
    \ where the smart contract actually lives. No, it's not live on the Ethereum Blockchain\
    \ because right now, we're simply working within the Javascript EVM.\n\n*   Also\
    \ notice **gas**. Every time a contract is deployed and modified, nodes on the\
    \ Ethereum network must verify the contract. It's referred to as being redundantly\
    \ parallel, as a way to reach consensus.Gas is the name for the execution fee\
    \ that senders of transactions (in our case, senders of a smart contract transaction)\
    \ will pay for verification.\n\n*   **Elaborating on this further**, from etherdocs.org:\n\
    \n*   *\"Gas is the name for the execution fee that senders of transactions need\
    \ to pay for every operation made on an Ethereum blockchain. The name gas is inspired\
    \ by the view that this fee acts as cryptofuel, driving the motion of smart contracts.\
    \ Gas is purchased for ether from the miners that execute the code. Gas and ether\
    \ are decoupled deliberately since units of gas align with computation units having\
    \ a natural cost, while the price of ether generally fluctuates as a result of\
    \ market forces. The two are mediated by a free market: the price of gas is actually\
    \ decided by the miners, who can refuse to process a transaction with a lower\
    \ gas price than their minimum limit. To get gas you simply need to add ether\
    \ to your account. The Ethereum clients automatically purchase gas for your ether\
    \ in the amount you specify as your maximum expenditure for the transaction.\"\
    *\n\n*   In Solidity, you define a variable by first specifying its type.\n\n\
    What other types are there?\n\n1.  **bool**  \n\n    This is a Boolean, which\
    \ returns true or false.\n\n2.  **int / uint**  \n\n    Both int and uint represent\
    \ integers, or number values. The primary difference between int and uint (Unsigned\
    \ Integer), is that int can hold negative numbers as values.\n\n3.  **address**\
    \  "
  fmt: "\n![cover](images/cover.jpeg)\n\nDr. Hedaya Mahmood Alasooly\n\n# Quick Guide\
    \ for Smart Contracts Creation and Deployment on Ethereum Blockchain\n\nBookRix\
    \ GmbH & Co. KG  \n80331 Munich\n\n## Quick Guide for Smart Contracts Creation\
    \ and Deployment on Ethereum Blockchain\n\n**By**  \nDr. Hedaya Mahmood Alasooly\
    \  \nHedaya_alasooly@yahoo.com\n\n## 1. Overview\n\nThis work explains briefly\
    \ the creation and deployment of Smart Contracts on the Ethereum Blockchain. The\
    \ work consists of the following sections:\n\n*   Blockchain\n*   Solidity variables\
    \ and types\n*   How to Setup or Install Ethereum on Windows\n*   How to compile\
    \ and deploy smart contract on JavaScriptVM\n*   How to install Ganache Blockchain\
    \ on Windows and deploy smart contract using it\n*   How to compile and deploy\
    \ Smart Contract on Test Networks\n*   Quick example of deploying ERC20 token\
    \ smart contract\n*   Getting started tutorial on Solidity\n*   Creating ERC-20\
    \ smart contract and crowd sale (ICO) smart contract without coding\n*   ERC-20\
    \ smart contract and crowd sale (ICO) smart contract\n*   Creating Ethereum ERC-20\
    \ Tokens and Crowd Sales (ICO) without coding with Token Wizard\n*   Example of\
    \ creating and deploying an ERC20 token on the test and main network!!!\n\n##\
    \ 2. Blockchain\n\nA blockchain is a digital record of transactions. The name\
    \ comes from its structure, in which individual records, called blocks, are linked\
    \ together in a single list, called a chain. Blockchains are used for recording\
    \ transactions made with cryptocurrencies, such as Bitcoin, and have many other\
    \ applications.\n\nEach transaction added to a blockchain is validated by multiple\
    \ computers on the Internet. These systems, which are configured to monitor specific\
    \ types of blockchain transactions, form a peer-to-peer network. They work together\
    \ to ensure each transaction is valid before it is added to the blockchain. This\
    \ decentralized network of computers ensures a single system cannot add invalid\
    \ blocks to the chain.\n\nWhen a new block is added to a blockchain, it is linked\
    \ to the previous block using a cryptographic hash generated from the contents\
    \ of the previous block. This ensures the chain is never broken and that each\
    \ block is permanently recorded. It is also intentionally difficult to alter past\
    \ transactions in a blockchain since all the subsequent blocks must be altered\
    \ first.\n\n### Blockchain Uses\n\nWhile blockchain is widely known for its use\
    \ in cryptocurrencies such as Bitcoin, Litecoin, and Ether, the technology has\
    \ several other uses. For example, it enables \"smart contracts,\" which execute\
    \ when certain conditions are met. This provides an automated escrow system for\
    \ transactions between two parties. Blockchain can potentially be used to allow\
    \ individuals to pay each other without a central clearing point, which is required\
    \ for ACH and wire transfers. It has the potential to greatly increase the efficiency\
    \ of stock trading by allowing transactions to settle almost instantly instead\
    \ of requiring three or more days for each transaction to clear. Blockchain technology\
    \ can also be used for non-financial purposes. For example, the InterPlanetary\
    \ File System (IPFS) uses blockchain to decentralize file storage by linking files\
    \ together over the Internet. Some digital signature platforms now use blockchain\
    \ to record signatures and verify documents have been digitally signed. Blockchain\
    \ can even be used to protect intellectual property by linking the distribution\
    \ of content to the original source.\n\nBlockchain is a decentralized database\
    \ that consists of records and data. The entire data is spread out in a bunch\
    \ of distributed computers to form a peer-to-peer (p2p) network. The records in\
    \ these databases are stored in the form of blocks which are linked together in\
    \ a secured way.\n\nThe Bitcoin blockchain stores data specific to keeping track\
    \ of cryptocurrency balances between different parties.\n\nThe Ethereum blockchain\
    \ can store much deeper data than the Bitcoin blockchain. The Ethereum blockchain\
    \ allows building decentralized apps. These decentralized apps are defined by\
    \ smart contracts. So smart contracts allow individuals to exchange information\
    \ in a trusted, confident, free manner without relying on a third party such as\
    \ a bank or lawyer. These Ethereum smart contracts are stored in special transactions\
    \ in the Ethereum blockchain which can then be used to build applications. You\
    \ can think of smart contracts as decentralized APIs. As smart contracts are stored\
    \ in Ethereum blockchains, they need to be validated or mined as any other transactions.\
    \ So there are small costs associated with deploying smart contracts.\n\nHow to\
    \ code a smart contract? We do that with Solidity. Solidity is a language used\
    \ to code smart contracts. The syntax is similar to JavaScript and is designed\
    \ with the Ethereum Virtual Machine (EVM) in mind. So we will use Solidity to\
    \ create smart contracts in a web-based IDE called Remix.\n\n## 3. Solidity variables\
    \ and types\n\n*   You can write the Solidity code and test it at `https://remix.ethereum.org/`.\n\
    *   Here is a screenshot of `https://remix.ethereum.org`:\n\n![](images/159551591299085953_1.jpg)\n\
    \n*   Create a new contract. I called it `Coursetro`.\n*   Start off by writing\
    \ (or pasting) the following code:\n\n```solidity\npragma solidity ^0.4.18;\n\n\
    contract Coursetro {\n\n}\n```\n\nThe very first line defines the version of Solidity\
    \ you are going to use. Next, you define the contract and its name and open it\
    \ up like a JavaScript class.\n\n*   On the right side of the browser under the\
    \ **Run** tab, you will see a **Deploy** button. Click on this. You will notice\
    \ that underneath the Deploy button a new section appears with the name of the\
    \ contract and \"at 0x...\" (memory):\n\n![](images/159551591230265132_2.jpg)\n\
    \n*   This means that the smart contract (yes, it's not very smart at this point)\
    \ lives at an address. To see this full address along with other information,\
    \ in the debugger if you click on the **Details** button, it will provide you\
    \ with more information:\n*   Notice there is a `contractAddress`; this is where\
    \ the smart contract actually lives. No, it's not live on the Ethereum Blockchain\
    \ because right now, we are simply working within the JavaScript EVM.\n*   Also\
    \ notice `gas`. Every time a contract is deployed and modified, nodes on the Ethereum\
    \ network must verify the contract. It is referred to as being redundantly parallel,\
    \ as a way to reach consensus. `Gas` is the name for the execution fee that senders\
    \ of transactions (in our case, senders of a smart contract transaction) will\
    \ pay for verification.\n\n### Elaborating on this further\n\nFrom `etherdocs.org`:\n\
    \n> \"Gas is the name for the execution fee that senders of transactions need\
    \ to pay for every operation made on an Ethereum blockchain. The name gas is inspired\
    \ by the view that this fee acts as cryptofuel, driving the motion of smart contracts.\
    \ Gas is purchased for ether from the miners that execute the code. Gas and ether\
    \ are decoupled deliberately since units of gas align with computation units having\
    \ a natural cost, while the price of ether generally fluctuates as a result of\
    \ market forces. The two are mediated by a free market: the price of gas is actually\
    \ decided by the miners, who can refuse to process a transaction with a lower\
    \ gas price than their minimum limit. To get gas you simply need to add ether\
    \ to your account. The Ethereum clients automatically purchase gas for your ether\
    \ in the amount you specify as your maximum expenditure for the transaction.\"\
    \n\nIn Solidity, you define a variable by first specifying its type. What other\
    \ types are there?\n\n1.  **bool**  \n    This is a Boolean, which returns `true`\
    \ or `false`.\n\n2.  **int / uint**  \n    Both `int` and `uint` represent integers,\
    \ or number values. The primary difference between `int` and `uint` (Unsigned\
    \ Integer) is that `int` can hold negative numbers as values.\n\n3.  **address**\n"
  trans: "\n\n![cover](img/cover.jpeg)\n\nDr. Hedaya Mahmood Alasooly\n\n# 在以太坊区块链上创建和部署智能合约的快速指南\n\
    \nBookRix GmbH & Co. KG  \n80331 Munich\n\n## 在以太坊区块链上创建和部署智能合约的快速指南\n\n**作者**\
    \  \nDr. Hedaya Mahmood Alasooly  \nHedaya_alasooly@yahoo.com\n\n## 1. 概述\n\n\
    本文简要解释了在以太坊区块链上创建和部署智能合约的过程。全文包含以下章节：\n\n*   区块链\n*   Solidity 变量与类型\n*   如何在\
    \ Windows 上设置或安装以太坊\n*   如何在 JavaScriptVM 上编译和部署智能合约\n*   如何在 Windows 上安装 Ganache\
    \ 区块链并使用它部署智能合约\n*   如何在测试网络上编译和部署智能合约\n*   部署 ERC20 代币智能合约的快速示例\n*   Solidity\
    \ 入门教程\n*   无需编码创建 ERC-20 智能合约和众筹 (ICO) 智能合约\n*   ERC-20 智能合约和众筹 (ICO) 智能合约\n\
    *   使用 Token Wizard 无需编码创建以太坊 ERC-20 代币和众筹 (ICO)\n*   在测试网和主网上创建和部署 ERC20 代币的示例！！！\n\
    \n## 2. 区块链\n\n区块链是交易的数字记录。其名称源于其结构：单个记录（称为区块）链接在一起形成单个列表（称为链）。区块链用于记录使用加密货币（如比特币）进行的交易，并有许多其他应用。\n\
    \n添加到区块链的每笔交易都由互联网上的多台计算机进行验证。这些系统被配置为监控特定类型的区块链交易，形成一个点对点网络。它们协同工作，确保每笔交易在被添加到区块链之前都是有效的。这种去中心化的计算机网络确保了单个系统无法向链中添加无效区块。\n\
    \n当新区块被添加到区块链时，它会使用由前一个区块内容生成的加密哈希值链接到前一个区块。这确保了链永远不会断裂，并且每个区块都被永久记录。由于必须先更改所有后续区块，因此有意使区块链中的过往交易难以篡改。\n\
    \n### 区块链用途\n\n虽然区块链因其在比特币、莱特币和以太币等加密货币中的应用而广为人知，但该技术还有其他多种用途。例如，它支持“智能合约”，当满足特定条件时会自动执行。这为双方之间的交易提供了一个自动化的托管系统。区块链有可能允许个人之间直接付款，而无需\
    \ ACH 和电汇所需的中央清算点。它有可能极大地提高股票交易的效率，使交易能够几乎即时结算，而不再需要每笔交易等待三天或更长时间才能清算。区块链技术也可用于非金融目的。例如，星际文件系统\
    \ (IPFS) 利用区块链通过在互联网上链接文件来实现文件存储的去中心化。一些数字签名平台现在使用区块链来记录签名并验证文档已被数字签名。区块链甚至可以通过将内容分发链接到原始来源来保护知识产权。\n\
    \n区块链是一个由记录和数据组成的去中心化数据库。所有数据分散在一堆分布式计算机中，形成一个点对点 (p2p) 网络。这些数据库中的记录以区块的形式存储，并以安全的方式链接在一起。\n\
    \n比特币区块链存储专门用于跟踪不同方之间加密货币余额的数据。\n\n以太坊区块链可以存储比比特币区块链深得多的数据。以太坊区块链允许构建去中心化应用。这些去中心化应用由智能合约定义。因此，智能合约允许个人在不依赖银行或律师等第三方的情况下，以可信、自信、自由的方式交换信息。这些以太坊智能合约存储在以太坊区块链的特殊交易中，随后可用于构建应用程序。你可以将智能合约视为去中心化的\
    \ API。由于智能合约存储在以太坊区块链中，它们需要像其他交易一样被验证或挖掘。因此，部署智能合约会产生少量费用。\n\n如何编写智能合约？我们使用 Solidity\
    \ 来实现。Solidity 是一种用于编写智能合约的语言。其语法类似于 JavaScript，并考虑到以太坊虚拟机 (EVM) 进行设计。因此，我们将使用\
    \ Solidity 在一个名为 Remix 的基于 Web 的 IDE 中创建智能合约。\n\n## 3. Solidity 变量与类型\n\n*   你可以在\
    \ `https://remix.ethereum.org/` 编写和测试 Solidity 代码。\n*   以下是 `https://remix.ethereum.org`\
    \ 的截图：\n\n![](img/159551591299085953_1.jpg)\n\n*   创建一个新合约。我将其命名为 `Coursetro`。\n\
    *   通过编写（或粘贴）以下代码开始：\n\n```solidity\npragma solidity ⁰.4.18;\n\ncontract Coursetro\
    \ {\n\n}\n```\n\n第一行定义了你将使用的 Solidity 版本。接下来，定义合约及其名称，并像 JavaScript 类一样打开它。\n\n\
    *   在浏览器右侧的 **Run（运行）** 选项卡下，你将看到一个 **Deploy（部署）** 按钮。点击它。你会注意到在 Deploy 按钮下方出现了一个新部分，显示合约名称和\
    \ \"at 0x...\"（内存地址）：\n\n![](img/159551591230265132_2.jpg)\n\n*   这意味着智能合约（是的，此时它还不太“智能”）存在于一个地址上。要查看此完整地址及其他信息，请在调试器中点击\
    \ **Details（详情）** 按钮，它将提供更多信息：\n*   请注意有一个 `contractAddress`；这是智能合约实际驻留的位置。不，它并不在以太坊区块链上，因为目前我们只是在\
    \ JavaScript EVM 中工作。\n*   还请注意 `gas`。每当合约被部署和修改时，以太坊网络上的节点必须验证该合约。这被称为冗余并行，作为达成共识的一种方式。`Gas`\
    \ 是发送交易者（在我们的例子中是发送智能合约交易者）为验证支付的执行费用的名称。\n\n### 进一步阐述\n\n引自 `etherdocs.org`：\n\
    \n> “Gas 是发送交易者为在以太坊区块链上进行的每项操作支付的执行费用的名称。Gas 这一名称源于这样一种观点：该费用充当加密燃料，驱动智能合约的运行。Gas\
    \ 由矿工用以太币购买并执行代码。Gas 和以太币被刻意解耦，因为 Gas 单位与具有自然成本的计算单位对齐，而以太币的价格通常因市场力量而波动。两者由自由市场调节：Gas\
    \ 的价格实际上由矿工决定，他们可以拒绝处理 Gas 价格低于其最低限制的交易。要获得 Gas，你只需向账户添加以太币。以太坊客户端会自动按你指定的作为交易最大支出的金额，用你的以太币购买\
    \ Gas。”\n\n在 Solidity 中，你通过首先指定其类型来定义变量。还有哪些其他类型？\n\n1.  **bool**  \n    这是布尔类型，返回\
    \ `true` 或 `false`。\n\n2.  **int / uint**  \n    `int` 和 `uint` 都代表整数或数值。`int`\
    \ 和 `uint`（无符号整数）的主要区别在于 `int` 可以保存负数作为值。\n\n3.  **address**\n\n"
