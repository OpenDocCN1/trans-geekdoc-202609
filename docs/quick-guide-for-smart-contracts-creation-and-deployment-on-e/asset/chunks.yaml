    **j) Smart contract interaction**


    I''ll show you how to work with multiple smart contracts in solidity. First, I''ll
    show you how to call smart contract functions from within another smart contract.


    I''ll create the token contract like this:


    contract ERC20Token {


    string name;


    mapping(address => uint256) public balances;


    function mint() public {


    balances\[msg.sender\] += 1;


    }


    }


    Now we can mint tokens from MyContract using the ERC20Token contract. In order
    to do this, we need to a few things: the address of the token, and the smart contract
    code in order to call its mint() function. First I''ll store the token address
    in a state variable like this:


    contract MyContract {


    address public token;


    //...


    }


    Now we can set the value for the token address inside the constructor like this:


    constructor(address payable \_wallet, ERC20Token \_token) public {


    wallet = \_wallet;


    token = \_token;


    }


    Now that we have the address available, we can access the smart contract code
    inside of the buyToken() function like this, and call the mint() function on it
    like this:


    function buyToken() public payable {


    ERC20Token \_token = ERC20Token(address(token));


    \_token.mint();


    wallet.transfer(msg.value);


    }


    I want to draw your attention to something before we continue. If you were to
    call the buyToken() function from your personal account right now, you would not
    mint any tokens for yourself. Why is that!? Let''s revisit the mint() function
    as it is now:


    function mint() public {


    balances\[msg.sender\] += 1;


    }


    The reason it will not mint tokens for your account is because msg.sender is actually
    referencing the address of MyContract, which is calling the function from inside
    its buyToken()function! If we want to mint tokens for our own account, we must
    use tx.origin to reference the account that originated the transaction on the
    blockchain like this:


    function mint() public {


    balances\[tx.origin\] += 1;


    }


    You will need to deploy the token smart contract first, obtain its address, and
    then include it as an argument whenever you deploy the second smart contract.
    At this point your complete smart contract code should look like this:


    pragma solidity 0.5.1;


    contract ERC20Token {


    string name;


    mapping(address => uint256) public balances;


    function mint() public {


    balances\[tx.origin\] += 1;


    }


    }


    contract MyContract {


    address public token;


    address payable wallet;


    constructor(address payable \_wallet, address \_token) public {


    wallet = \_wallet;


    token = \_token;


    }


    function buyToken() public payable {


    ERC20Token \_token = ERC20Token(address(token));


    \_token.mint();


    wallet.transfer(msg.value);


    }


    }


    Now test the code


    *   Deploy the ERC20Token contract first.


    *   Take the contract address from debug menu


    *   Deploy MyContract after putting the creator wallet address and ERC20Token
    smart contract address arguments in deploy field.


    *   Press the buyToken field


    *   Then presss the balance field in ERC20Token contract and put the buyer address
    to show the balance (address of the person initiated the transection)


    ![](images/159551592146506453_7.jpg)


    **k) Inheritance**


    Now let''s talk about inheritance. Solidity allows you to create smart contracts
    that inherit from one another. Let''s create a new pseudo token called MyToken
    that inherits from our original token smart contract. We''ll use inheritance to
    give it a unique name, symbol, and mint function. We can inherit from the smart
    contract like this


    contract MyToken is ERC20Token {


    // ...


    }


    Now we can keep track of the token name in the parent smart contract like this:


    pragma solidity 0.5.1;


    contract ERC20Token {


    string public name;


    mapping(address => uint256) public balances;


    constructor(string memory \_name) public {


    name = \_name;


    }


    function mint() public {


    balances\[tx.origin\] ++;


    }


    }


    We can override the name of the parent token inside the constructor of our child
    token. While we''re here, we''ll also create a symbol for the child token and
    set it in the constructor. I''ll show you how to override the parent token contract
    constructor, while assigning the new values like this:


    contract MyToken is ERC20Token {


    string public symbol;


    constructor(


    string memory \_name,


    string memory \_symbol


    )


    ERC20Token(\_name)


    public {


    symbol = \_symbol;


    }


    }


    Awesome! Now we have customized MyToken. Now let''s update the mint() function
    to override the functionality of the parent token. First, let''s create a way
    to store the address of all the token owners. We''ll also set the count of all
    the owners like this:


    contract MyToken is ERC20Token {


    address\[\] public owners;


    uint256 public ownerCount;


    //...


    }


    Now let''s update these values inside our own mint() function while preserving
    the behavior of the parent token smart contract. We can do that with the super
    keyword like this:


    function mint() public {


    super.mint();


    ownerCount ++;


    owners.push(msg.sender);


    }


    Awesome! Now we''ve created our own custom token that inherits from the parent
    token. Your full smart contract code should look like this:


    pragma solidity 0.5.1;


    contract ERC20Token {


    string public name;


    mapping(address => uint256) public balances;


    constructor(string memory \_name) public {


    name = \_name;


    }


    function mint() public {


    balances\[tx.origin\] ++;


    }


    }


    contract MyToken is ERC20Token {


    string public symbol;


    address\[\] public owners;


    uint256 public ownerCount;


    constructor(


    string memory \_name,


    string memory \_symbol


    )


    ERC20Token(\_name)


    public {


    symbol = \_symbol;


    }


    function mint() public {


    super.mint();


    ownerCount ++;


    owners.push(msg.sender);


    }


    }


    Now test the code. I deployed the contract “MyToken” with the name argument “Hidaia”
    and symbol “HED”


