    \ the token symbol for cryptocurrency exchanges string public symbol = \"DAPP\"\
    .\n\n*   It stores the total supply of tokens in existence uint256 public totalSupply.\n\
    \n*   It uses a Solidity mapping to store the balance of each account that owns\
    \ tokens mapping(address => uint256) public balanceOf.\n\n*   It implements a\
