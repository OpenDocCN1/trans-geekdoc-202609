    **9\. Getting started tutorial on solidity:**


    **a) Data Types and Data Structures**


    Go to https://remix.ethereum.org/ and create new file. I called it MyContrct.sol.


    Let''s create a new file named MyContract.sol. On the first line of this file,
    we''ll declare the version of the solidity programming language we want to use:


    pragma solidity ^0.4.24;


    Now we can declare the smart contract like this:


    pragma solidity ^0.4.24;


    contract MyContract {


    // ...


    }


    A smart contract is a piece of code that gets executed on the Ethereum blockchain.
    It functions somewhat like an API microservice on the web that is publicly accessible
    to everyone. All of the code of the smart contract is visible to the public, and
    we can allow anyone connected to the network to call functions on the smart contract.


    First, we''ll program a simple "storage" smart contract that will be able to:


    Store a value


    Retrieve this value


    We''ll start by creating a way to store a string value in the smart contract like
    this. We''ll do that with a variable called value. Solidity is a statically typed
    language, so we must first specify the data type when declaring the variable like
    this:


    pragma solidity ^0.4.24;


    contract MyContract {


    string value;


    }


    Now let''s create a function to read this value from storage. We''ll start by
    declaring a function called get() with the function keyword like this:


    function get() {


    // ...


    }


    Now we''ll return the value from the state variable with the return keyword like
    this. We''ll set the "visibility" of this function to public so that anyone connected
    to the blockchain can call it. Finally, we''ll specify the return value string
    for the function:


    pragma solidity ^0.4.24;


    contract MyContract {


    string value;


    function get() public view returns(string) {


    return value;


    }


    }


    let''s create a way to set this value from outside the smart contract. We''ll
    create a set function. We simply created a function that accepts a \_value argument
    of string type. This function is also publicly visible so that anyone connected
    to the blockchain can call it. Now let''s actually update the smart contract value
    like this:


    function set(string \_value) public {


    value = \_value;


    }


    Now let''s set a default value for the value state variable. We''ll do that inside
    the smart contract constructor function like this:


    constructor() public {


    value = "myValue";


    }


    Remember, the Etherum blockchain is made up of bundles of records called "blocks"
    which are "chained together" to make up the public ledger. The basic units of
    all these blocks are transactions. You''re seeing them listed here below. You
    can click the "down" arrow to see all details of the receipt.


    I''ll select the JavaScript virtual machine, which will give us a simulated blockchain
    inside our browser.


    Let''s update the code in our smart contract to be compatible with the latest
    version of Solidity at the time of writing this article. We can modify the first
    line in the smart contract code like this:


    pragma solidity ^0.5.1;


    First, modify the get() and set () functions to look like this:


    pragma solidity ^0.5.1;


    contract MyContract {


    string value;


    constructor() public {


    value = "myValue";


    }


    function get() public view returns(string memory) {


    return value;


    }


    function set(string memory \_value) public {


    value = \_value;


    }


    }


