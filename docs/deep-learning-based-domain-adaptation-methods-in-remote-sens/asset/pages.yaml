    **Integrated-Training Based Methods.** To achieve improved model performance in
    addressing the domain shift problem, numerous domain adaptation methods employ
    an integrated-training strategy, which is also referred to as a hybrid-training
    strategy. Alongside basic task-specific loss functions for optimization (referenced
    in Eq. 4, 7, 10, 12), adversarial learning plays a crucial role in achieving consistency
    alignment, while the self-training mechanism primarily aims to mitigate the representation
    bias of source-trained networks. Therefore, these two training strategies are
    compatible, and integrating them with a combined loss function can enhance the
    model from different perspectives.


    **Large Vision Model Based Methods.** In the field of DA-RS, the domain shift
    issue is particularly severe due to various factors (Fig. 1). Essentially, a single
    model often fails to perform well across different domains due to its limited
    generalization ability. Large vision models \[58\], can effectively mitigate this
    issue. Their generalized representation capabilities arise from extensive pre-training
    on large amount of samples, covering a wide range of domains.


    Recently, LVM-based methods on DA-RS tasks remain relatively unexplored. The challenge
    lies in how to effectively transfer the generalized capabilities of LVMs to a
    specific downstream DA-RS task, as well as how to design an optimization paradigm
    tailored for LVM-based approaches.


    # III. METHODOLOGY: A SURVEY


    In this section, we will conduct a comprehensive review of methodologies from
    the taxonomy based on supervision paradigm and the taxonomy based on algorithm
    granularity. First, we will include different methods that are pertinent to different
    task categories according to the taxonomy based on supervision paradigm. Following
    this, we will delve into a detailed introduction of these methods, structured
    in accordance with the taxonomy based on algorithm granularity. Given that the
    majority of existing DA-RS methods use "Single-Source Single Target" as input
    mode, we will also delve into methods that employ other input modes. It is important
    to acknowledge that there may be inevitable overlaps among the methods within
    these three taxonomies. Specifically, some methods may fall into the realm of
    more than one taxonomy.


    # A. Taxonomy Based on Supervision Paradigm


    # 1) UDA-RS Methods:


    In remote sensing field, the high cost of annotation raises a significant challenge
    for remote sensing (RS) tasks. Consequently, researching methods to reduce the
    reliance on a vast number of annotated samples has emerged as a popular topic.
    As previously mentioned, UDA-RS strives to train a model using source images while
    having access to target images but not their corresponding annotations. The representative
    UDA-RS methods are included in Tab. III.


    Before the deep learning era, pioneering traditional methods define the UDA-RS
    task and introduce a variety of machine


    learning models \[168\]–\[174\], which significantly advances the development
    within this field. Upon entering the deep learning era, deep learning techniques
    have shown superior performance over traditional methods.


    # UDA-RSCls. Unsupervised domain adaptation Hyperspectral image (HSI) classification
    stands as a pivotal topic within the UDA-RSCls task. As shown in Tab. III, many
    methods \[30\], \[61\], \[62\], \[64\], \[67\]–\[69\], \[72\], \[74\], \[79\],
    \[81\], \[83\], \[88\], \[90\], \[92\], \[94\] with variety of algorithms have
    been proposed to address the challenge of UDA HSI classification. Unsupervised
    domain adaptation for aerial image classification represents another fascinating
    research topic within the UDA-RSCls task. Many notable methods \[29\], \[42\],
    \[59\], \[60\], \[63\], \[65\], \[66\], \[70\], \[71\], \[76\]–\[78\], \[84\],
    \[87\], \[89\], \[95\]–\[99\] are proposed to exploit the abundant information
    contained in high-resolution aerial and satellite images. Given the unique imaging
    characteristics and inherent domain shifts of SAR data, unsupervised domain adaptation
    for SAR image classification emerges as another compelling direction within the
    broader scope of UDA-RSCls. Several recent studies \[75\], \[80\], \[82\], \[85\],
    \[86\] have explored strategies to mitigate the significant domain gap in different
    SAR data, aiming to enhance cross-domain generalization.


    # UDA-RSSeg. Unsupervised domain adaptation for remote sensing semantic segmentation
    focusses primarily on adapting models across high-resolution (HR) aerial and satellite
    optical images \[33\], \[44\]–\[46\], \[100\]–\[120\], addressing domain shifts
    caused by geographic or acquisition differences. Some methods \[121\]–\[124\]
    also aim to bridge modality gaps for cross-domain segmentation on multispectral
    or SAR imagery, addressing challenges such as variations in texture, resolution,
    and spectral characteristics.


    # UDA-RSDD. Unsupervised domain adaptation for remote sensing object detection
    primarily focuses on transferring knowledge from labeled optical aerial and satellite
    images to unlabeled imagery from different domains \[41\], \[132\]–\[143\], where
    significant domain gaps arise from fundamentally different imaging mechanisms,
    object textures, and background clutter. Unlike optical-to-optical adaptation,
    SAR data introduce significant challenges in feature representation and alignment,
    prompting the development of specialized techniques such as domain-invariant feature
    learning, cross-modality alignment, and pseudo-label refinement \[125\]–\[129\].


    # 2) SSDA-RS Methods: Semi-supervised domain adaptation in remote sensing aims
    to transfer knowledge from a labeled source domain to a partially labeled target
    domain, reducing annotation costs while adapting to new geographic regions or
    sensor types. Some methods focus on classification tasks \[20\], \[28\], \[146\]–\[156\],
    while others target semantic segmentation \[157\]–\[160\] or object detection
    \[161\]–\[167\], addressing different remote sensing tasks under the SSDA paradigm.


