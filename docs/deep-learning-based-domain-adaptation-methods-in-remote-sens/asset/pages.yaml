    # *B. Comparison and Analysis on Experimental Results*


    In this section, we review state-of-the-art methods for DA-RS tasks, with a particular
    focus on the mainstream benchmark datasets summarized in Tab. V, Tab. VI, and
    Tab. VII. We highlight representative algorithms that are widely used for comparative
    evaluation. Since different papers re-implemented other methods for comparison,
    the results in the table are reported according to the original papers.


    In this survey, we focus on the widely studied UDA setting, which mainly refers
    to the single-source single-target scenario. We also include other settings where
    relatively systematic studies have been conducted.


    # 1) *Benchmark Performance on DA-RSCls:*

    In DA-RSCls task, the commonly applied evaluation metrics are Overall Accuracy
    (OA), Average Accuracy (AA), and kappa coefficient (κ). OA measures the proportion
    of correctly classified samples over the entire dataset, which reflects the global
    classification performance. AA computes the mean of per-class accuracies, providing
    a fairer evaluation when the class distribution is imbalanced. The κ considers
    the agreement between prediction and ground truth beyond chance, offering a more
    rigorous assessment of classification consistency. For the sake of experimental
    consistency across different methods, this survey mainly adopts OA as the primary
    evaluation metric.


    **Benchmark Performance on HSI datasets.** Tab. VIII summarizes the performance
    of representative UDA-RSCls methods on the HSI benchmark datasets listed in Tab.
    V.


