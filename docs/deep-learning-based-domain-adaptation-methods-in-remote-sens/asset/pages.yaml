  md: "+   - Adaptation between HRRSD and SSTD\n  (HRRSD → SSTD),\n- Adaptation between\
    \ LEVIR and SSTD\n  (LEVIR → SSTD).\n\nAmong UDA-RS Det tasks, the “HRRSD → SDD”\
    \ task represents an optical-to-SAR scenario, while the “LEVIR → SDD” task corresponds\
    \ to a typical SAR-to-SAR setting. All remaining tasks fall under the optical-to-optical\
    \ category.\n\nThe results are summarized in Tab. XII. Here, we first clarify\
    \ that some methods have different experimental settings on the same datasets,\
    \ such as different dataset splits and model choices. Therefore, the comparisons\
    \ may not be strictly fair. This survey only reports the results from original\
    \ paper listed in Tab. VII. For more details, please refer to the original papers.\
    \ From the results and the detailed information provided in the original papers,\
    \ it can be observed that recent approaches such as FIE-Net [143] and CDST [41]\
    \ consistently achieve leading performance across multiple cross-domain tasks.\n\
    \nBased on experimental results and previous reviews, our analysis is as follows.\
    \ Current UDA-RS Det methods mostly use hybrid strategies, with self-training\
    \ at the core to gradually adapt to the target domain using high-quality pseudo-labels.\
    \ Adversarial alignment acts as an auxiliary tool, often combined with class-wise\
    \ constraints or contrastive learning to improve feature consistency.\n\n# V.\
    \ FUTURE WORKS\n\nIn recent years, deep learning based DA-RS methods has achieved\
    \ notable progress across classification, segmentation, detection, and change\
    \ detection. Despite the huge progress, several challenges remain for practical\
    \ deployment and further breakthroughs.\n\n**Research on Limited Computation Resources.**\
    \ Most DA-RS methods rely on computationally demanding deep models, which restricts\
    \ their use in real-world platforms such as satellites, UAVs, and edge devices.\
    \ Future work should focus on lightweight architectures, efficient optimization,\
    \ and model compression techniques to balance performance with practical deployment.\n\
    \n**Extension to Multiple-Source/Target Settings.** Most DA-RS methods focus on\
    \ a single-source to single-target source, and only a few consider the issue concerning\
    \ multi-source or multi-target. In practice, applications always face diverse\
    \ domains with different conditions. Extending DA-RS to multi-source and multi-target\
    \ settings can improve scalability and robustness, which requires new strategies\
    \ for domain fusion and adaptive generalization.\n\n**Further Exploration on Transformer\
    \ Structure.** Transformers have achieved success in vision and multimodal learning,\
    \ but their potential in DA-RS remains underexplored. Future methods should investigate\
    \ how attention mechanisms and hierarchical representations can capture cross-domain\
    \ in- variances, improve semantic consistency, and enhance adaptability across\
    \ tasks.\n\n**Exploration on Foundation Model Paradigm.** Most foundation models\
    \ are built on transformer architectures, their emergence brings new opportunities\
    \ for DA-RS. Leveraging vision or vision-language foundation models and adapting\
    \ them to remote sensing tasks can bring new advantages. They may provide stronger\
    \ cross-domain generalization, support open-vocabulary recognition, and enable\
    \ task transferability. Together, these advances point to a new paradigm for domain\
    \ adaptation research.\n\nThis survey provides a comprehensive survey of the recent\
    \ advancements of deep learning based domain adaptation methods in remote sensing,\
    \ which have rapidly evolved in recent years. We review existing related methods\
    \ through a unified perspective that considers task categorization, input mode,\
    \ supervision paradigm, and algorithmic granularity, thereby offering a systematic\
    \ understanding of the field. Moreover, we summarize benchmarking efforts including\
    \ widely used datasets and performance evaluations of state-of-the-art methods.\
    \ Finally, the discussion of future research directions has outlined promising\
    \ avenues for further exploration. We hope this survey helps advance the understanding\
    \ of domain adaptation in remote sensing and serves as a reference to support\
    \ and guide future research.\n\n# REFERENCES\n\n+   [1] G. Xia, J. Hu, F. Hu et\
    \ al., “AID: A benchmark data set for performance evaluation of aerial scene classification,”\
    \ IEEE Transactions on Geoscience and Remote Sensing (TGRS), vol. 55, no. 7, pp.\
    \ 3965–3981, 2017.\n\n+   [2] G. Cheng, J. Han, and L. Lu, “Remote sensing image\
    \ scene classification: Benchmark and state of the art,” Proceedings of the IEEE,\
    \ vol. 105, no. 10, pp. 1865–1883, 2017.\n\n+   [3] Q. Zhao, S. Lyu, Y. Li et\
    \ al., “MGML: Multigranularity multilead feature ensemble network for remote sensing\
    \ scene classification,” IEEE Transactions on Neural Networks and Learning Systems\
    \ (TNNLS), vol. 34, no. 5, pp. 2308–2322, 2023.\n\n+   [4] X. Tan, J. Jiao, Y.\
    \ Zhao et al., “The CNRRIEEICOM: A communication-navigation-remote sensing-integrated\
    \ ecological environment emergency monitoring chain for tailings areas,” International\
    \ Journal of Applied Earth Observation and Geoinformation (IAG), vol. 108, p.\
    \ 102710, 2022.\n\n+   [5] S. Steinbach, A. Rienow, M. W. Chege et al., “Low-cost\
