  md: 'The DA-RSCD task, also known as Cross-Domain Change Detection (CCD), focuses
    on detecting changes in remote sensing image pairs acquired from different sensors
    or under varying imaging conditions. *Chen et al*. [222] provide the first systematic
    review of DA-RSCD. This survey examines the key components of this research direction,
    including image preprocessing, feature representation and change detection strategies,
    while identifying current challenges and future research avenues. *Cheng et al*.
    [223] also investigate the domain adaptation issue in the realm of change detection
    tasks.


    # ## IV. BENCHMARK PERFORMANCE


    In this section, we first introduce the primary datasets commonly used in the
    field of DA-RS. We then present state-of-the-art methods evaluated on these primary
    datasets. It is worth noting that our focus is on representative algorithms that
    are widely adopted for comparative analysis.


    # ### A. Benchmark Datasets for DA-RS


    As shown in *Tab*. V, *Tab*. VI, *Tab*. VII we will summarize the dominant benchmark
    datasets widely used in DA-RS research. These datasets are designed to support
    various domain adaptation tasks, including DA-RSCIs, DA-RSSeg, and DA-RSCD. For
    each dataset, we highlight its imaging mode, characteristics, and suitability
    for evaluation.


    # **1) Benchmark Datasets for DA-RSCIs:** For DA-RSCIs, the benchmark datasets
    (*Tab*. V) cover hyperspectral (HSI), optical, and SAR imagery, reflecting the
    task’s global classification characteristics. This diversity captures varying
    spectral, spatial, and modality features, providing a comprehensive basis for
    evaluating domain adaptation methods.


    **The Houston Datasets (Houston2013 [224], Houston2018 [225])** consist of hyperspectral
    images from 2013 and 2018, collected over the University of Houston area using
    different sensors. After spectral and spatial alignment, a shared region of size
    209 × 955 with 48 spectral bands and 7 consistent land cover categories is extracted
    from the Houston2013 scene to correspond with the Houston2018 scene.


    **Pavia University and Center Datasets (PU and PC)** are acquired by the ROSIS
    sensor during a flight campaign over Pavia, northern Italy. The number of spectral
    bands is 102 for PC and 103 for PU. Both datasets contain 9 categories, though
    their category definitions are not entirely identical. For domain adaptation experiments,
    only the 7 classes shared between the two datasets are selected to ensure label
    consistency.


    **Botswana Dataset (May, June, and July)** ^{1} consists of three multitemporal
    hyperspectral images captured by the NASA EO-1 Hyperion sensor over the Okavango
    Delta, Botswana, in May, June, and July 2001. Each image contains 9 annotated


    categories with 242 spectral bands covering the 357–2576 nm range at a 10 m spectral
    resolution and a 30 m spatial resolution. After removing uncalibrated and noisy
    bands, 145 bands are retained for experiments.


    **The HyRANK Dataset** ^{2} [226] comprises satellite hyperspectral imagery acquired
    by the HyPerion sensor (EO-1, USGS), with 176 spectral bands. The dataset includes
    two labeled scenes, Dionio and Loukia. Both scenes share 12 consistent land cover
    categories.


    **The KSC (Kennedy Space Center) Dataset** ^{3} is captured by the AVIRIS sensor
    with 224 spectral bands and 18 m spatial resolution. After removing noisy and
    water absorption bands, 176 bands remain for use. It contains two spatially disjoint
    subsets, which share 10 common categories. These two subsets are commonly used
    as source and target in domain adaptation experiments.


    **The Indian Pines Dataset** [228] is collected by NASA’s AVIRIS sensor. The original
    data set consists of 224 bands. After preprocessing, the data contain 200 spectral
    bands, covering a 3 km area with 20-meter spatial resolution. To simulate domain
    adaptation task, each hyperspectral image is split into two parts by grouping
    its spectral bands. One subset is designated as the source domain and the other
    as the target domain, mimicking data acquired from different sensors with varying
    spectral coverages.


    **The Salines Dataset** ^{4} is acquired by the AVIRIS sensor. After removing
    20 water absorption bands, the dataset includes 204 spectral bands at 3.7 m resolution,
    with 16 labeled land-cover categories used for classification tasks.


    **The Hangzhou-Shanghai Datasets** [227] are acquired by the EO-1 Hyperion sensor
    in 2002, each retaining 198 spectral bands after preprocessing. Both datasets
    cover urban and rural regions with 3 labeled land-cover categories. Hangzhou-Shanghai
    datasets are commonly used for domain adaptation due to their similar geographical
    scene composition.


    **Aerial Image Dataset (AID)** [1] contains 30 scene categories and a total of
    10,000 large-scale RGB images, each with a size of 600 × 600 pixels. The number
    of images per category ranges from 220 to 420. The spatial resolution varies between
    0.5 and 8 meters.


    **NWP-UE-REISSC45 Dataset** [2] comprises 31,500 RGB images across 45 scene categories
    with sized at 256 × 256 pixels. Every category includes 700 samples. The spatial
    resolution spans a wide range from 0.2 to 30 meters.


    **UC-Merced Dataset** [229] contains 2,100 RGB images evenly distributed across
    21 scene categories, with each category comprising 100 images. All images have
    a spatial resolution of 0.3 meters and a fixed size of 256 × 256 pixels.


    **WHU-RS19 Dataset** [230], [231] includes 1,005 high-resolution scene images,
    grouped into 19 semantic categories. Each category is represented by approximately
    50 to 70 samples, with all images uniformly sized at 600 × 600 pixels.


    **RSSCN7 Dataset** [232] consists of 2,800 images across 7 categories. The images
    are 400 × 400 pixels and sourced from Google Earth under varying seasons and lighting
    conditions.


    **PattersonNet Dataset** [233] is a large-scale remote sensing dataset designed
    for image retrieval, containing 30,400 images'
