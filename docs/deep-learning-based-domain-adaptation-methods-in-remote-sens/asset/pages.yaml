    # Self-Training Based Methods. As a non-adversarial UDA paradigm, self-training
    has attracted much attention in DA-RS tasks. This algorithm promotes the adaption
    ability by generating reliable, consistent, and class-balanced pseudo labels.
    By supervising the model with high-quality pseudo ground-truth derived from the
    target domain, models can quickly adapt to target images.


    Self-training mechanism mainly contains two processes. The first process involves
    the updating stage, where the exponential moving average (EMA) technique is commonly
    applied to the original network, referred to as the student network. Once the
    EMA-updating process is completed, the resulting network functions as the EMA-teacher.
    Specifically, during each training step $t$, the EMA-teacher’s weights are updated
    by student’s weights by EMA operation, which can be formulated in Eq. 22.


    ```

    $\phi_t = \alpha \phi_{t-1} + (1 - \alpha) \theta_t \tag{22}$

    ```


    where $\alpha$ represents the EMA decay factor, which controls the rate of updating.
    $\phi_t$ denotes the weights of the EMA-teacher at the $t^{th}$ step. $\theta_t$
    signifies the weights of the student network at the same $t^{th}$ step.


    After updating the weights of the teacher networks, the second process involves
    generating pseudo-labels for target images and utilizing these pseudo-labels for
    supervision. For specific DA-RS tasks, input images are fed into the teacher'
