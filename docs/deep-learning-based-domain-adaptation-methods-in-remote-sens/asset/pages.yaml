    # DA-RSDet.


    Object detection poses a significant challenge, as it strives to simultaneously
    locate and classify objects within an image. By leveraging domain adaptation,
    the detector can achieve accurate detections even when faced with samples from
    different data distributions. As shown in Fig. 4 (c), the basic detectors is combined
    with encoder and heads, which provides a general overview of both the “one-stage
    detector” and “two-stage detector” architectures.


    Similar to DA-Cl s and DA-Seg tasks, both source and target images will be delivered
    to the detector ($f_{det}(\cdot)$) and generate final predictions ($\mathcal{P}_{S-det},
    \mathcal{P}_{T-det}$). Specifically in “one-stage detector”, these predictions
    are structured as a single tensor that integrates both localization and classification
    outcomes. Conversely, in a “two-stage detector”, the predictions are generated
    from distinct branches dedicated to localization and classification. Regardless
    of the variations among different types of detectors, both regression loss for
    bounding boxes ($\mathcal{L}_{reg}$) and classification loss ($\mathcal{L}_{cls}$)
    for posterior probabilities of instances are required. As a whole, the vanilla
    loss function ($\mathcal{L}_{DA-det}^i$) for DA-Det optimization can be formulated
    from Eq. 8 to Eq. 10.


    ```

    $$\mathcal{P}_{S-det} = f_{det}(\boldsymbol{x}_S), \quad \mathcal{P}_{T-det} =
    f_{det}(\boldsymbol{x}_T)$$

    ```


    ```

    $$\mathcal{L}_{DA-det}^i = \mathcal{L}_{reg}(\boldsymbol{P}_{S-det}^i, \boldsymbol{P}_{T-det}^i;
    \boldsymbol{y}_S^{i-box}, \boldsymbol{y}_T^{i-box}) + \mathcal{L}_{cls}(\boldsymbol{P}_{S-det}^i,
    \boldsymbol{P}_{T-det}^i; \boldsymbol{y}_S^{i-cls}, \boldsymbol{y}_T^{i-cls})$$

    ```


    ```

    $$\mathcal{L}_{DA-det} = -\frac{1}{B} \sum_{i=1}^{B} \mathcal{L}_{DA-det}^i$$

    ```


    # DA-RSCD.


    Change detection is an essential task in remote sensing that aims to detect and
    analyze changes occurring in the same geographical area over time. As shown in
    Fig. 4 (d), the change detection model operates by accepting image pairs as input.
    $\boldsymbol{x}_A$ and $\boldsymbol{x}_B$ respectively denote the pre-change (pre-event)
    and post-change (post-event) images. In RSCD task, $\boldsymbol{x}_A$ and $\boldsymbol{x}_B$
    show minimal discrepancy, indicating less degree of domain-shift. In DA-RSCD task,
    $\boldsymbol{x}_A$ and $\boldsymbol{x}_B$ exhibit a significant domain-shift problem,
    which is often caused by the use of different sensors or varying imaging conditions.


    # TABLE II: Mathematical definitions for different input modes. The formulations
    in this table can be referred to Eq. 1.


    | Input modes | Source Input: $D_S = \{ D_S^i \}_{i=1}^{N_S}$ | Target Input:
    $D_T = \{ D_T^i \}_{i=1}^{N_T}$ |

    | :--- | :--- | :--- |

    | One-to-One | $N_S = 1$ | $N_T = 1$ |

    | One-to-Many | $N_S = 1$ | $N_T > 1$ |

    | Many-to-Many | $N_S > 1$ | $N_T > 1$ |

    | None-to-One/Many | Not Available | $N_T \geq 1$ |


    The architecture of change detector ($f_{cd}(\cdot)$) is similar to segmenter.
    $\boldsymbol{x}_A$ and $\boldsymbol{x}_B$ are fed into an “Encoder-Decoder” structure
    to generate a binary prediction ($\boldsymbol{P}_{cd} \in \mathbb{R}^{N \times
    C \times H \times W}$), where $N_C = 2$. This process is expressed in Eq. 11.


    ```

    $$\boldsymbol{P}_{cd} = f_{cd}(\boldsymbol{x}_A, \boldsymbol{x}_B)$$

    ```


    The optimization of DA-RSCD can be considered as a binary segmentation optimization
    problem. The specific formulation of the vanilla loss function ($\mathcal{L}_{DA-cd}$)
    is detailed in Eq. 12, where $\mathcal{L}_{bce}$ denotes the binary cross-entropy
    loss.


    ```

    $$\mathcal{L}_{DA-cd} = -\frac{1}{BHW} \sum_{i=1}^{B} \sum_{h=1}^{H} \sum_{w=1}^{W}
    \mathcal{L}_{bce}(\boldsymbol{p}_{cd}^{i,h,w}, y^{i,h,w})$$

    ```


    The DA-RSCD task distinguishes itself from the aforementioned three DA-RS tasks
    in that the domain-shift issue arises within image pairs. Conversely, the domain-shift
    challenges faced by DA-RSCIs, DS-RSSeg, and DA-RSDet manifest between the source
    and target datasets.


    # 2) Mathematical Definitions for Different Input Modes:


    In the taxonomy of input modes, there are primarily five distinct types of DA-RS
    methods, categorized with respective of the number of source and target subsets
    (Fig. 3). The specific definitions are shown in Tab. II.


    +   Single-Source Single-Target (“One-to-One”). When $N_S$ and $N_T$ are set as
    1, this corresponds to a standard domain adaptation configuration on distinct
    tasks. In this mode, model are trained to adapt from the source-domain to target-domain.


    +   Single-Source Multi-Target (“One-to-Many”). When $N_S$ is as 1 while $N_T$
    is set to a value greater than 1, the primary objective is to develop models that
    can perform well across different target domains. One typical domain adaptation
    task in this mode is known as domain generalization (DG).


    +   Multi-Source Single-Target (“Many-to-One”). When $N_S$ is set to a value greater
    than 1 while $N_T$ is set as 1, the goal is to develop a model that can leverage
    the collective knowledge from multiple source domains to enhance the model’s generalization
    capabilities on an unseen target domain. Another crucial challenge in this scenario
    is to mitigate the adverse effects of domain-shift among various source subsets.


    +   Multi-Source Multi-Target (“Many-to-Many”). When $N_S$ and $N_T$ are both
    set to a value greater than 1, the task will become further complex. Models are
    required to effectively optimized for generalizing from multiple source domains
    to multiple target domains.


    +   Source-free Single-Target / Multi-Target (“None-to-One/Many”). In this mode,
    $N_T$ is set to a value greater than 1 while $N_S$ is not available in adaptation
    phase due to'
