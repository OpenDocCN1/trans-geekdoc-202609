    +   • We summarize the existing methods in this field and present our perspective
    on future trends and topics that worth further exploration.


    As shown in Fig. 2, this paper is organized as follows. In Sec. II, we review
    the preliminary knowledge of domain adaptation methods in remote sensing including
    “Preliminary Knowledge” and “Methodology Taxonomy & Mathematical Notation”. In
    Sec. III, we conduct a thorough review of existing literature in a paper-to-paper
    manner and make categorization into four perspectives. In Sec. IV, we first introduce
    the benchmark datasets. Then we present a detailed performance comparison across
    diverse benchmark datasets on various remote sensing tasks. In Sec. V, we discuss
    the future research trends and topics as well as our viewpoints. Finally, we conclude
    this survey in Sec. VI.


    # II. PRELIMINARY KNOWLEDGE


    As shown in Fig. 2, we will first introduce the preliminary knowledge including
    some basic notations. Subsequently, we organize and present methodology taxonomy
    as well as mathematical definitions across different methods in this field.


    # A. Mathematical Notation


    As shown in Fig. 2, we provide a detailed taxonomies of existing methods, categorizing
    them based on four perspectives: task categorization, input mode, supervision
    paradigm and algorithm granularity. The specific methodology taxonomy is shown
    in Fig. 3.


    Tab. I shows the preliminary mathematical notations. For the four tasks focused
    in this survey (Fig. 3), existing methods always construct a model, optimize it
    using the training set ($\mathcal{D}_{train}$) and evaluate its performance on
    the testing set ($\mathcal{D}_{test}$). These training and testing partitions
    from a comprehensive dataset ($\mathcal{D}$ = $\mathcal{D}_{train}$ $\cup$ $\mathcal{D}_{test}$).
    Therefore, despite potential disparities in data distribution existing between
    the training and testing datasets, we still treat them as samples from the same
    domain. When domain adaptation is integrated into the previously mentioned four
    tasks, the problem definition will undergo a significant change.


    For domain adaptation remote sensing (DA-RS) tasks, it always encounters source
    dataset ($\mathcal{D}_{S}$) and target dataset ($\mathcal{D}_{T}$). If the category
    sets of source and target dataset are respectively denoted as $\mathcal{C}_{S}$,
    $\mathcal{C}_{T}$, two sets have same number of categories ($N_{\mathcal{C}_{S}}$
    = $N_{\mathcal{C}_{T}}$) in general terms.


    ```

    $\mathcal{D}_{S}$ = {$\mathcal{D}_{S}^{i}$}$^{N_{S}}_{i=1}$, $\mathcal{D}_{T}$
    = {$\mathcal{D}_{T}^{i}$}$^{N_{T}}_{i=1}$ (1)

    ```


    The $i^{th}$ sub-set of source and target dataset respectively contain $K_{S}^{i}$
    and $K_{T}^{i}$ samples, where $K_{S}^{i}$ $\ge$ 0 and $K_{T}^{i}$ $\ge$ 0. This
    process can be formulated in Eq. 2.


    ```

    $\mathcal{D}_{S}^{i}$ = {($\mathbf{x}_{S}^{i,j}$, $\mathbf{y}_{S}^{i,j}$)}^{K_{S}^{i}}_{j=1}$,
    $\mathcal{D}_{T}^{i}$ = {($\mathbf{x}_{T}^{i,j}$, $\mathbf{y}_{T}^{i,j}$)}^{K_{T}^{i}}_{j=1}$
    (2)

    ```


    To optimize a model for DA-RS tasks, $\mathcal{D}_{T}$ is divided into training
    and testing sub-sets ($\mathcal{D}_{T-train}$, $\mathcal{D}_{T-test}$), where
    $\mathcal{D}_{T}$ = $\mathcal{D}_{T-train}$ $\cup$ $\mathcal{D}_{T-test}$. Consequently,
    for a given DA-RS task, the training dataset encompasses both the source dataset
    $\mathcal{D}_{S}$ and the training subset of the target dataset ($\mathcal{D}_{T-train}$),
    while the testing dataset $\mathcal{D}_{test}$ consists solely of $\mathcal{D}_{T-test}$.
    It means that both $\mathcal{D}_{S}$ and a portion of $\mathcal{D}_{T}$ will be
    leveraged during the training phase. It is worthy of noting that the proportion
    of $\mathcal{D}_{T}$ in the training phase may be 0, implying that the target
    dataset will not be used for training purposes in certain cases.


    As shown in Eq. 1 and Eq. 2, the source dataset comprises $N_{S}$ sub-sets, whereas
    the target dataset includes $N_{T}$ sub-sets, with the constraints that $N_{S}$
    $\ge$ 1 and $N_{T}$ $\ge$ 1. This indicates that both datasets contain at least
    one sub-set each.


    # B. Methodology Taxonomy


    # 1) *Problem Definitions for DA-RS Tasks:*


    As shown in Fig. 3, this survey mainly review four DA-RS Tasks, which are DA-RSCls,
    DA-RSSeg, DA-RSdet, DA-RSCLD. The specific illustration are shown in Fig. 4.


    # **DA-RSCls.**


    As shown in Fig. 4 (a), the classifier comprises a solitary encoder. During forward
    pass, source and target images ($\mathbf{x}_{S}$, $\mathbf{x}_{T} \in \mathbb{R}^{B
    \times C \times H \times W}$) are fed into the encoder ($f_{cls}(\cdot)$) to generate
    predictions, formulated in Eq. 3. In classification task, the predictions ($\mathbf{P}_{S-cls}$,
    $\mathbf{P}_{T-cls} \in \mathbb{R}^{B \times N_{C}}$) are denoted as posterior
    probabilities across various categories. Here, $N_{C}$ indicates the number of
    categories.


    ```

    $\mathbf{P}_{S-cls} = f_{cls}(\mathbf{x}_{S}), \quad \mathbf{P}_{T-cls} = f_{cls}(\mathbf{x}_{T})$
    (3)

    ```


    To optimize the encoder, the vanilla loss $\mathcal{L}_{DA-cls}$ is shown in Eq.
    4, where $\mathcal{L}_{ce}$ denotes cross-entropy loss. Based on this optimization
    paradigm, existing methods integrate various loss components to construct a combined
    loss including adversarial loss, self-training loss, etc.


    ```

    $\mathcal{L}_{DA-cls} = \frac{1}{B}\sum_{i=1}^{B} \mathcal{L}_{ce}(\mathbf{P}_{S-cls}^{i},
    \mathbf{P}_{T-cls}^{i}; y_{S}^{i}, y_{T}^{i})$ (4)

    ```


    # **DA-RSSeg.**


    As shown in Fig. 4 (b), the segmentor employs an “Encoder-Decoder” architecture
    ($f_{seg}(\cdot)$). $\mathbf{x}_{S}$, $\mathbf{x}_{T}$ respectively pass through
    the segmentor to generate pixel-level predictions ($\mathbf{P}_{S-seg}$, $\mathbf{P}_{T-seg}
    \in \mathbb{R}^{B \times N_{C} \times H \times W}$), as formulated in Eq. 5. Each
    pixel in these predictions represents a


