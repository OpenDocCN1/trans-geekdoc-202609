    To alleviate the domain shift and bridge the domain gap between the source and
    target images in remote sensing scenes, numerous domain adaptation methods have
    been proposed. Before deep learning era, domain adaptation methods mainly focus
    on traditional methods [17] such as invariant feature selection [18]–[21], data
    distribution adaptation [22]–[25], etc., with the aim of adjusting the distribution
    discrepancy between the source and target domains. In the past decade, the rapid
    development of deep learning [26], [27], especially deep neural networks, has
    promoted the development of domain adaptation methods in remote sensing field.
    Initially, adversarial learning emerges as the predominant technology [28]–[35],
    which is primarily utilized for feature-level or image-level alignment. As another
    remarkable technique, self-training has garnered considerable attention in the
    realm of remote sensing domain adaptation tasks [36]–[41]. This non-adversarial
    paradigm enhances adaptation capabilities by generating reliable, consistent,
    and class-balanced pseudo labels for target domain images. As adversarial learning
    and self-training enhance the efficiency of domain adaptation methods from distinct
    perspectives, the integration of these two techniques has become as a novel research
    focus [42]–[46]. The introduction of


    Model (SAM) [47], [48] has marked a revolutionized era in the realm of computer
    vision. Leveraging their exceptional generalization capabilities across diverse
    scenarios, the field of remote sensing stands to gain significantly from domain
    adaptation methods [49]–[51] informed by these advancements. Despite the fact
    that LVM-based domain adaptation methods in remote sensing remain relatively underexplored,
    it still reveals a significant and promising recent research trend.


    With the plethora of recent domain adaptation methods in remote sensing, some
    survey papers have been proposed. Notably, [52], [53] delve into the domain adaptation
    methods specifically tailored for remote sensing classification tasks. [54] clarifies
    and reviews the idea of unsupervised domain adaptation in remote sensing area.
    Since the most recent pertinent survey only encapsulates methods up to 2022, there
    arises a necessity to provide a more updated survey in this rapid-developed field.
    Compared to previous survey papers, we provide a updated overview of the most
    recent methods. For various specific remote sensing tasks, we review and present
    a detailed and comprehensive experimental comparison across diverse benchmark
    datasets. Considering that large vision models (LVMs) are anticipated to become
    a focal research topic in the forthcoming years, we will specifically explore
    LVM-based domain adaptation methods and outline the emerging trends in remote
    sensing area.


    In summary, the main contributions of this survey can be listed as follows.


    +   - We provide systematical overview of the latest research on domain adaptation
    methods in remote sensing. Compared to prior survey works, our study provides
    a broader scope and more updated content.


    +   - We present several systematic taxonomies of current domain adaptation methods
    in remote sensing, organized from four perspectives: task categorization, input
    model, supervision paradigms and algorithm granularity.


