    # 3) Mathematical Definitions for Different Supervision Paradigms: As shown in
    Fig. 3, there are mainly three supervision paradigms in the DA-RS methods.


    # **Unsupervised domain adaptation in remote sensing (“UDA-RS”)**. UDA is a notable
    and widely-applied paradigm in realm of remote sensing. In general terms, UDA
    indicates that the labels of target images are unavailable, yet these target images
    can still be incorporated into the training phase. Mathematically, in Eq. 2, each
    target sample $(\boldsymbol{y}_T^{i,j})$ is denoted as “None”, formulated in Eq.
    13. Under this setting, $\boldsymbol{y} \boldsymbol{r}$ is denoted as an empty
    set in loss functions for each task shown in Eq. 4, Eq. 6 and Eq. 9.


    $\boldsymbol{y} \boldsymbol{r}=\emptyset, \quad \forall i \in[1, N_T], j \in[1,
    K_T^{i, j}], y_T^{i, j} \rightarrow None$ (13)


    As narrowly defined, UDA-RS indicates a typical single-source single-target RS
    task, where $N_S=1, N_T=1$. Obviously, the methods utilized within this paradigm
    are intended to address the limitation posed by the insufficient availability
    of labeled target domain samples, as well as to address the issue of high annotation
    costs.


    # **Semi-supervised domain adaptation in remote sensing (“SSDA-RS”)**. SSDA is
    another hot topic in remote sensing field, which aims to improve the generalization
    performance by labeling a few target domain samples. As shown in Eq. 2, each sub-set
    of target dataset $(D_T^{i,j})$ contains labeled and unlabeled samples, where
    the number of unlabeled samples $(K_{T-i, u}^{j})$ is much larger than that of
    labeled samples $(K_{T-u}^{i, j})$. This paradigm can be formulated in Eq. 14.


    $\mathcal{D}_{T}^{j}=\left(\left\{\boldsymbol{x}_{T-u}^{i, l}\right\}_{l=1}^{K_{T-i,
    l}^{j}} \cup\left\{\left(\boldsymbol{x}_{T-u}^{i, j}, \boldsymbol{y}_T^{i, j}\right)\right\}_{u=1}^{K_{T-u}^{j}}\right)$
    (14)


    where $K_{T-i}^{j}+K_{T-u}^{j}=K_T^{j}$ and $K_{T-i}^{j}<<K_{T-u}^{j}$. Similar
    to UDA-RS, existing methods concerning SSDA-RS primarily utilize the single-source
    single-target input mode as well. Compared to UDA-RS, SSDA-RS emphasizes exploring
    information from limited labeled samples while maximizing the utilization of unlabeled
    samples.


    # **Supervised domain adaptation in remote sensing (“SDA(Finetuning)-RS”)**. SDA
    assumes that labeled samples are available for both domains. SDA methods focus
    on challenging situations where labeled target-domain samples are less numerous
    than those available in the source domain [52]. In such conditions, the proper
    use of source domain information and the finetuning technique on target domain
    are very important in solving the target problem. Mathematically, this paradigm
    can be represented as $\sum_{i=1}^{N_T} K_T^{i}<<\sum_{i=1}^{N_S} K_S^{i}$.


    In remote sensing scene, acquiring data from various sensors such as satellites
    and drones is relatively straightforward, resulting in an abundant supply of data
    from diverse domains. However, due to the vast geographical land cover, the challenge
    of high annotation costs becomes more pronounced. Consequently, the paradigms
    of UDA-RS and SSDA-RS are more aligned with practical requirements.


    ![](img/6f3fe8f45739aa0bcfea4346d3596801_5_0.png)


    # 4) Mathematical Definitions for Typical Algorithms: As shown in Fig. 3, DA-RS
    methods primarily consist of five typical types of algorithms.


    # **Distribution Measurement Based Methods.** Distribution measurement based methods
    mainly aim to match distributions between hidden features from different domains.
    As shown in Fig. 5 and Eq. 15, the common operation is to embed adaptation metric
    (e.g., Maximum Mean Discrepancy, MMD) into the neural networks.


    $\mathcal{MMD}(D_S, D_T) = ||\frac{1}{N_S}\sum_{i=1}^{N_S} E(\boldsymbol{x}_S^{i})
    - \frac{1}{N_T}\sum_{j=1}^{N_T} E(\boldsymbol{x}_T^{j})||_2$ (15)


    DAN [55] is the pioneer in leveraging the deep convolutional neural networks to
    learn transferable hidden features across domains in UDA task. It embeds MMD metric
    for adaptation. Subsequent to DAN, numerous DA-RS tasks adopt MMD for distribution
    measurement across intermediate feature maps of images belonging to different
    domains.


    # **Adversarial Learning Based Methods.** Adversarial learning is frequently utilized
    in DA-RS methods, primarily encompassing two types: image-level and no feature-level
    adversarial learning-based methods. The illustration of these two typical adversarial
    learning paradigms is shown in Fig. 6.


    Image-level adversarial learning-based methods utilize image generalization techniques,
    such as image translation [56], [57], to synchronize the data distribution between
    source and target images. These methods initially apply image-level adaptation
    and subsequently train models using cross-domain synthetic data. As depicted in
    Fig. 1 (a), $G_{S \rightarrow T}$ and $G_{T \rightarrow S}$ are responsible for
    adapting images from the source domain to the target domain, and vice versa. Meanwhile,
    the role of $D_S$ and $D_T$ is to distinguish between authentic source data and
    the fake data produced by the generators. For optimization, adversarial loss is
    employed, which is formulated in Eq. 16.


    $\begin{cases}\mathcal{L}_{adv}(G_{S \rightarrow T}, D_T) = \mathbb{E}_{x_T \sim
    X_T}[\log(D_T(x_{\boldsymbol{T}}))] + \mathbb{E}_{x_S \sim X_S}[\log(1-D_T(G_{S
    \rightarrow T}(x_S)))]\\\mathcal{L}_{adv}(G_{T \rightarrow S}, D_S) = \mathbb{E}_{x_S
    \sim X_S}[\log(D_S(x_{\boldsymbol{S}}))] + \mathbb{E}_{x_T \sim X_T}[\log(1-D_S(G_{T
    \rightarrow S}(x_T)))]\end{cases}$ (16)'
