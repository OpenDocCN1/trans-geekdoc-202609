    # Feature-level Adversarial Learning Based Methods.


    Feature-level adversarial learning aims to align the feature maps from both the
    source and target domains into a unified latent space, thereby mitigating biases
    during the process of mapping feature-level adversarial learning. At the global
    scale, feature adversarial alignment encourages the model to learn domain-invariant
    category-level semantics, thereby improving the consistency of predictions across
    domains. SSMT-RS [63] leverages meta-learning to distinguish multiple target domains
    and utilizes adversarial learning to confuse the distinction between the source
    domain and a mixed multi-target domain. These two processes, meta-learning and
    adversarial learning, operate iteratively and dynamically. ADA-Net [64] develops
    generator based on variational autoencoders, which is designed to acquire spectral
    and spatial characteristics from both domains. By incorporating two objective
    functions for adversarial learning, the global and local alignment will be taken
    into account. To address the domain-shift issue between multiple source domain
    datasets and single target dataset, MSNRC [65] initially designs a pre-trained
    CNN to extract image features across diverse domains. Subsequently, the features
    from each source domain and the target domain are aligned by a cross-domain alignment
    module, which is composed of different source-specific discriminators. ECB-FAM
    [66] integrates an error-correcting boundaries mechanism into a feature-level
    adversarial learning framework. This integration enables the simultaneous construction
    of both domain-invariant features and semantically meaningful features. CDA [67]
    integrates class-wise adversarial alignment and PMMD (Probability MMD) strategies
    to achieve unsupervised domain adaptation by aligning domain-invariant features
