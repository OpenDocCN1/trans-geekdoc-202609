    # Benchmark Performance on DA-RS$^\text{Det}$. In the DA-RS$^\text{Det}$ task,
    model performance is commonly evaluated using $AP_i/mAP$, $AR_i/mAR$, and $F_1/mF_1$-score.
    For each class $i$, the Average Precision ($AP_i$) is defined as the area under
    the precision-recall curve, while the Mean Average Precision ($mAP$) is the average
    of $AP_i$ across all classes. The Average Recall ($AR_i$) reflects the proportion
    of correctly detected objects, and $mAR$ is its mean across classes. The $F_1$-score
    is defined as $2 \times \frac{Precision \times Recall}{Precision + Recall}$, with
    $mF_1$-score denoting the mean across classes. In this survey, $mAP@50$ ($mAP_{50}$)
    is adopted as the primary evaluation metric, as it is used by most existing methods.


    We select the datasets in Tab. VII to systematically report the performance of
    UDA-RS$^\text{Det}$ methods, with the detailed tasks listed as follows.


    +   Adaptation between xView and DOTA (xView $\to$ DOTA-3).

    Adaptation between DIOR and DOTA (DIOR $\to$ DOTA-10).

    Adaptation between NWPU VHR-10 and DIOR (NWPU VHR-10 $\to$ DIOR).

    Adaptation between UCAS-AOD and CARPK (UCAS-AOD $\to$ CARPK & CARPK $\to$ UCAS-AOD).

    Adaptation between UCAS-AOD and ISPRS Potsdam (UCAS-AOD $\to$ ISPRS Potsdam).'
