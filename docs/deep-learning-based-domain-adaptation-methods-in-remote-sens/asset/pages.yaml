    **SAMPLE Dataset** [234] contains 1,345 paired synthetic and measured SAR images
    across 10 vehicle types, generated under matched imaging parameters from the MSTAR
    dataset$^{1}$. Synthetic and measured images are respectively produced using CAD
    models and real SAR captures.


    **FUSAR-Ship Dataset** [235] comprises over 5,000 high-resolution ship chips cropped
    from 126 GF-3 scenes. It introduces an extensive SAR ship taxonomy with 15 categories
    and 98 subcategories, enabling comprehensive development, evaluation, and benchmarking
    of ship recognition algorithms.


    **OpenSARShip Dataset** [236] is a large-scale SAR ship detection benchmark built
    from Sentinel-1 imagery. It contains 11,346 ship chips from 41 SAR scenes covering
    17 AI-defined ship types with detailed subtype annotations. This dataset is valuable
    for detection, fine-grained classification as well as domain adaptation research.


    **OpenSARShip 2.0 Dataset** [237] expands on its predecessor by offering 34,528
    SAR ship chips extracted from 87 Sentinel-1 images. It offers multiple data formats,
    including original, grayscale, pseudo-color, and calibrated versions, supporting
    deeper analysis of ship targets in SAR imagery.


    # 2) Benchmark Datasets for DA-RS2Seg


    For DA-RS2Seg, the benchmark datasets (Tab. VI) mainly comprise HR aerial and
    satellite optical imagery, offering fine-grained spatial details suitable for
    semantic segmentation. These datasets feature diverse geographic regions and acquisition
    conditions, enabling comprehensive evaluation of domain adaptation methods.


    **ISPRS Dataset** [8] offers pixel-level annotations across 6 land-cover categories
    and includes Potsdam and Vaihingen datasets. Potsdam contains 38 VHR orthophotos
    (6000 x 6000 pixels) in IR-R-G, R-G-B, and R-G-B-IR modes, while Vaihingen has
    33 orthophotos (~2000 x 2000 pixels) in IR-R-G mode. The domain adaptation segmentation
    experiments are conducted between the Potsdam and Vaihingen datasets.


    **LoveDA Dataset** [6] provides 5,987 VHR remote sensing images (1024 x 1024)
    from Nanjing, Changzhou, and Wuhan, covering both urban and rural environments.
    It spans urban and rural domains to evaluate model generalization across diverse
    geospatial features.


    **CITY-OSM Dataset** [7] is an urban-focused dataset that provides pixel-level
    annotations for cities such as Berlin, Chicago, Zurich, Paris, and Tokyo. It highlights
    key urban elements with 3 categories: “background”, “road”, and “building”.


    **WHU Dataset** [238] delivers extensive pixel-level annotations for building
    extraction, including aerial and satellite imagery. The aerial subset contains
    8,189 RGB images from New Zealand with 0.3 m resolution. The Satellite II subset
    comprises 17,388 RGB patches from East Asia with 2.7 m resolution. Both subsets
    provide diverse building types and are available for domain adaptation experiments.


    **BLU Dataset** [239] is collected by the Beijing-2 satellite'
