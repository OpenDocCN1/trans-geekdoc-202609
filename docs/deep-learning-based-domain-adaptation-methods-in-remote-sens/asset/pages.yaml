    In domain adaptation experiments, aerial and satellite optical image datasets
    such as AID [1], NWPU-RESISC45 [2], UC-Merced [229], WHU-RS19 [230], [231], RSSCN7
    [232], PatternNet [233] are used by selecting shared categories and treating them
