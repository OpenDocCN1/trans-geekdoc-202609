    based methods exploit domain discriminators for global alignment, particularly
    effective in classification tasks with coarse domain shifts. Self-training based
    methods leverage pseudo-labels for progressive adaptation, proving especially
    powerful in dense prediction tasks such as segmentation and detection. Integrated-training
    methods combine alignment, self-training, and auxiliary techniques like contrastive
    learning or style transfer to achieve more robust semantic consistency. Most recently,
    large vision model based methods are gaining momentum, adapting pretrained foundation
    models to remote sensing tasks and opening a new paradigm with transferable and
    open-vocabulary capabilities.


