    # 1) Domain Adaptation across Varying Label Spaces: While our focus remains on
    domain adaptation under shared label spaces, real-world remote sensing scenarios
    often involve mismatched category configurations between source and target domains.
    Cross-label settings like partial, open-set, and universal domain adaptation pose
    additional challenges beyond distribution alignment. Since these approaches primarily
    tackle label space discrepancies, we briefly mention them here without delving
    into detailed discussion.


    As shown in Fig. 7, partial domain adaptation (PDA) assumes that target label
    sets are considered a subset of source label sets. In contrast, open set domain
    adaptation (OS-DA) assumes that the target label set contains unknown classes
    not present in the source label set, which means that the source label sets are
    considered a subset of target label sets. Universal domain adaptation (UniDA)
    poses no prior knowledge on the label sets of source and target domains. Instead,
    it assumes that each domain contains a mix of shared and private (domain-specific)
    label sets. Building on this, source-free universal domain adaptation (SF-UniDA)
    further assumes that the source data is inaccessible during adaptation, and only
    a trained source model and unlabeled target data are available. In the'
