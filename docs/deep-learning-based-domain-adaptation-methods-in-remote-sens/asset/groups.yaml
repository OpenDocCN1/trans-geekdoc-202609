    \ O→F | **75.6/77.5** |\n\n### 任务配置\n- AID 与 WHU-RS19 之间的适应\n  - (A → W & W →\
    \ A)。\n- AID 与 NWPU-RESISC45 之间的适应\n  - (A → N & N → A)。\n- UC-Merced 与 RSSCN7\
    \ 之间的适应\n  - (U → R & R → U)。\n- AID 与 RSSCN7 之间的适应\n  - (A → R & R → A)。\n- NWPU-RESISC45\
    \ 与 RSSCN7 之间的适应\n  - (N → R & R → N)。\n- WHU-RS19 与 RSSCN7 之间的适应\n  - (W → R\
    \ & R → W)。\n\n根据表 IX 中的性能对比，我们将对以下几点进行分析。(1) DATSNET [95]、MLDAN [96]、AMRAN [97]、SRETT\
    \ [98] 和 DDCI [99] 采用了相似的任务配置和实现细节。其中，DDCI [99] 取得了最佳的整体性能。(2) 在 UDA-RSCls 任务中，通常采用对抗学习机制进行特征对齐，但对于此场景而言，这可能不够经济高效。由于分类依赖于全局语义特征而非细粒度的局部细节，对抗训练可能会引入不必要的复杂性和不稳定性。相比之下，更直接的分布度量算法可以以更简单且更稳定的方式缩小域差距，同时保持效率。\n\
    \n## SAR 数据集上的基准性能。尽管关于使用 SAR 数据集的 UDA-RSCls 的研究相对有限，我们仍在表 X 中总结了 SAR 基准数据集上的代表性\
    \ UDA-RSCls 方法。\n\n在 SAMPLE [234] 数据集中，UDA-RSCls 任务在合成子集和测量子集之间进行，其中合成子集作为源域，测量子集作为目标域。\n\
    - 从合成适应到测量 (S → M)。\n- 由于缺乏实际相关性，未考虑反向设置 (M → S)。\n\n在 UDA SAR 船舶分类任务中，使用了 FUSAR-Ship\
    \ [235] 和 OpenSARShip [236]。为确保一致性，选择了五个共享类别。任务通过跨这两个数据集的适应来构建。\n- 从 FUSAR-Ship\
    \ 适应到 OpenSARShip (F → O)。\n- 从 OpenSARShip 适应到 FUSAR-Ship (O → F)。\n\n如表 X 所示，PEDA\
    \ [75]、VSFA [80]、TSIC [208] 和 DST [86] 为 SAR 图像分类的域适应提供了见解。其中，VSFA [80] 和 DST\
    \ [86] 在各自的实验设置中取得了最佳性能。\n\n### 2) DA-RSseg 的基准性能。在 DA-RSseg 任务中，模型性能使用 IoU/mIoU\
    \ 和 F1/mF-score 进行评估。对于类别 $i$，$IoU_i = tp_i/(tp_i + fp_i + fn_i)$，其中 $tp_i$、$fp_i$\
    \ 和 $fn_i$ 分别表示真阳性、假阳性和假阴性。$mIoU$ 是所有类别的平均值。F1-score 定义为 $2 \\times Precision\
    \ \\times Recall/(Precision + Recall)$，mF-score 是所有类别的平均值。为确保方法之间的公平且一致的比较，本综述主要报告使用\
    \ mIoU 作为主要评估指标的结果。\n\n如前所述，大多数最新的 DA-RSseg 方法专注于高分辨率航拍和卫星光学图像。在本综述中，我们在两个著名的基准数据集\
    \ ISPRS [8] 和 LoveDA [6] 上系统地比较了它们的性能。结果汇总于表 XI。\n\nISPRS [8] 是 UDA-RS$^\\text{Seg}$\
    \ 任务中应用最广泛的基准数据集。它为 DA 任务提供了全面覆盖，其中波茨坦（Potsdam）提供大规模多模态 VHR 图像（IR-R-G 和 R-G-B），而费辛根（Vaihingen）提供\
    \ IR-R-G 图像。现有方法通常遵循两种评估设置：一些方法考虑包括“杂项”（Clutter）在内的所有 6 个类别（含“Clutter”），而另一些方法采用排除它的\
    \ 5 类设置（不含“Clutter”）。该数据集上的 DA 任务列举如下。\n- 从波茨坦 IR-R-G 适应到费辛根 IR-R-G (P $\\to$\
    \ V\\textsection1)。\n- 从费辛根 IR-R-G 适应到波茨坦 IR-R-G (V $\\to$ P\\textsection1)。\n\
    - 从波茨坦 R-G-B 适应到费辛根 IR-R-G (P $\\to$ V\\textsection2)。\n- 从费辛根 IR-R-G 适应到波茨坦 R-G-B\
    \ (V $\\to$ P\\textsection2)。\n\nLoveDA [6] 是 DA-RS$^\\text{Seg}$ 任务的另一个著名基准数据集。它支持两个跨域任务（列举如下），并且其测试集通过在线服务器评估[^2]。\n\
    - 从城市适应到农村 (U $\\to$ R)。\n- 从农村适应到城市 (R $\\to$ U)。\n\n如表 XI 所示，可以得出以下观察结果：(1)\
    \ 在 ISPRS 数据集上，MEB5 [114] 在“含 Clutter”设置下取得了最佳性能，DeGL-GAN [110] 在“不含 Clutter”配置下优于所有其他方法。此外，DEGLAN\
    \ 在 LoveDA 数据集的“R $\\to$ U”任务上表现出强劲的结果，而 ST-DAsegNet [46] 在“U $\\to$ R”任务上取得了最佳性能。(2)\
    \ PFM-JOnet [51] 未能达到最先进（state-of-the-art）的性能，突显了基于基础模型的方法并不总是在特定下游任务上优于专用模型。(3)\
    \ UDA-RS$^\\text{Seg}$ 任务中按类别划分的 $IoU$ 结果提供了模型在不同类别上性能的更详细视图，可参考原始论文进行进一步分析。(4)\
    \ 需要注意的是，LoveDA 排行榜包含许多方法，但并非所有方法都关联已发表的论文。\n\n[^2]: https://github.com/June-Je/Wang/LoveDA\n\
