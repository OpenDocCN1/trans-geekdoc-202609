    ## 3) Mathematical Definitions for Different Supervision Paradigms


    As shown in Fig. 3, there are mainly three supervision paradigms in the DA-RS
    methods.


    ### Unsupervised domain adaptation in remote sensing (“UDA-RS”)


    UDA is a notable and widely-applied paradigm in the realm of remote sensing. In
    general terms, UDA indicates that the labels of target images are unavailable,
    yet these target images can still be incorporated into the training phase. Mathematically,
    in Eq. 2, each target sample $(\boldsymbol{y}_T^{i,j})$ is denoted as “None”,
    formulated in Eq. 13. Under this setting, $\boldsymbol{y}_T$ is denoted as an
    empty set in loss functions for each task shown in Eq. 4, Eq. 6 and Eq. 9.


    $$

    \boldsymbol{y}_T = \emptyset, \quad \forall i \in[1, N_T], j \in[1, K_T^{i, j}],
    y_T^{i, j} \rightarrow None \tag{13}

    $$


    As narrowly defined, UDA-RS indicates a typical single-source single-target RS
    task, where $N_S=1, N_T=1$. Obviously, the methods utilized within this paradigm
    are intended to address the limitation posed by the insufficient availability
    of labeled target domain samples, as well as to address the issue of high annotation
    costs.


    ### Semi-supervised domain adaptation in remote sensing (“SSDA-RS”)


    SSDA is another hot topic in the remote sensing field, which aims to improve the
    generalization performance by labeling a few target domain samples. As shown in
    Eq. 2, each sub-set of target dataset $(D_T^{i,j})$ contains labeled and unlabeled
    samples, where the number of unlabeled samples $(K_{T-u}^{j})$ is much larger
    than that of labeled samples $(K_{T-l}^{j})$. This paradigm can be formulated
    in Eq. 14.


    $$

    \mathcal{D}_{T}^{j}=\left(\left\{\boldsymbol{x}_{T-l}^{i, l}\right\}_{l=1}^{K_{T-l}^{j}}
    \cup\left\{\left(\boldsymbol{x}_{T-u}^{i, j}, \boldsymbol{y}_T^{i, j}\right)\right\}_{u=1}^{K_{T-u}^{j}}\right)
    \tag{14}

    $$


    where $K_{T-l}^{j}+K_{T-u}^{j}=K_T^{j}$ and $K_{T-l}^{j} \ll K_{T-u}^{j}$. Similar
    to UDA-RS, existing methods concerning SSDA-RS primarily utilize the single-source
    single-target input mode as well. Compared to UDA-RS, SSDA-RS emphasizes exploring
    information from limited labeled samples while maximizing the utilization of unlabeled
    samples.


    ### Supervised domain adaptation in remote sensing (“SDA(Finetuning)-RS”)


    SDA assumes that labeled samples are available for both domains. SDA methods focus
    on challenging situations where labeled target-domain samples are less numerous
    than those available in the source domain [52]. In such conditions, the proper
    use of source domain information and the finetuning technique on the target domain
    are very important in solving the target problem. Mathematically, this paradigm
    can be represented as $\sum_{i=1}^{N_T} K_T^{i} \ll \sum_{i=1}^{N_S} K_S^{i}$.


    In the remote sensing scene, acquiring data from various sensors such as satellites
    and drones is relatively straightforward, resulting in an abundant supply of data
    from diverse domains. However, due to the vast geographical land cover, the challenge
    of high annotation costs becomes more pronounced. Consequently, the paradigms
    of UDA-RS and SSDA-RS are more aligned with practical requirements.


