    It aligns SAR and optical domains at both global (structure-level via Fourier-based
    alignment) and local (instance-level via prototype alignment) scales to enhance
    cross-modal detection performance. CORAL-ADA [137] integrates correlation alignment
    and adversarial domain adaptation into a region-based detector, further enhanced
    by reconstruction loss, achieving obvious performance gain in the target domain.


    Some semi-supervised domain adaptation methods are centered around distribution
    alignment or distance measurement, as the availability of a small amount of labeled
    target data allows for more reliable estimation of domain discrepancies and better
    guidance in aligning feature spaces between source and target domains. TDDA [146]
    proposes a two-stage deep domain adaptation method for hyperspectral image classification,
    which combines MMD-based domain alignment and a Spatial-Spectral Space Network
    with pairwise loss to learn a discriminative embedding space using few labeled
    target samples. DJ-CORAL [150] projects heterogeneous features into a shared subspace
    and jointly aligns marginal and conditional distributions. This method effectively
    leverages unlabeled target data to reduce domain shifts and improve classification
    performance. BsCA [152] effectively reduces domain shift and leverages both labeled
    and unlabeled data across source and target domains by combining unsupervised
    maximum mean discrepancy alignment and supervised class-aware alignment. SSCA
    [155] integrates a rotation-robust convolutional feature extractor (RCFE) to handle
    rotation variations and a neighbor-based subcategory centroid alignment (NSCA)
    module to mitigate intra-class discrepancies across domains. CDMPc [158] introduces
    a contradictory structure learning mechanism and self-supervised learning strategy
    to enhance domain alignment and improve the use of limited labeled target samples.
    SAR-CDSS [163] proposes a semi-supervised cross-domain object detection framework
    for SAR imagery by leveraging optical data and a few labeled SAR samples. It reduces
    domain shift progressively at the image, instance, and feature levels through
    image mixing and instance swapping for data augmentation and an adaptive optimization
    strategy for selective feature alignment. CDTL-YOLOV5 [167] raises a semi-supervised
    SAR target detection method based on YOLOv5. By introducing few-target domain
    adaptation constraints, the model transfers rich knowledge from labeled optical
    data to improve SAR feature learning under limited annotation.


    ## 2) Adversarial Learning Based Methods


    As previously mentioned, adversarial learning techniques aim to derive information
    at either the feature-level, pixel-level, or both, to reduce the discrepancy that
    exists between various domains. Among the methods shown in Tab. III, adversarial
    learning plays an important role on different tasks with different supervision
    paradigms.


    ### Feature-level Adversarial Learning Based Methods


    Feature-level adversarial learning aims to align the feature maps from both the
    source and target domains into a unified latent space, thereby mitigating biases
    during the process of mapping feature-level adversarial learning. At the global
    scale, feature adversarial alignment encourages the model to learn domain-invariant
    category-level semantics, thereby improving the consistency of predictions across
    domains. SSMT-RS [63] leverages meta-learning to distinguish multiple target domains
    and utilizes adversarial learning to confuse the distinction between the source
    domain and a mixed multi-target domain. These two processes, meta-learning and
    adversarial learning, operate iteratively and dynamically. ADA-Net [64] develops
    generator based on variational autoencoders, which is designed to acquire spectral
    and spatial characteristics from both domains. By incorporating two objective
    functions for adversarial learning, the global and local alignment will be taken
    into account. To address the domain-shift issue between multiple source domain
    datasets and single target dataset, MSNRC [65] initially designs a pre-trained
    CNN to extract image features across diverse domains. Subsequently, the features
    from each source domain and the target domain are aligned by a cross-domain alignment
    module, which is composed of different source-specific discriminators. ECB-FAM
    [66] integrates an error-correcting boundaries mechanism into a feature-level
    adversarial learning framework. This integration enables the simultaneous construction
    of both domain-invariant features and semantically meaningful features. CDA [67]
    integrates class-wise adversarial alignment and PMMD (Probability MMD) strategies
    to achieve unsupervised domain adaptation by aligning domain-invariant features
    on a per-class basis. To address cross-domain feature distribution discrepancies
    in HSI classification, JDA [68] first maps data into a shared latent space via
    a coupled-VAE (variational autoencoders) module, then refines class-wise alignment
    through a fine-grained joint distribution alignment module. DFEnet [71] combines
    a context-aware feature refinement (CAFR) module for adaptive extraction of global
    and local discriminative features with a multilevel adversarial dropout (MAD)
    module. This design enhances feature generalization by selectively suppressing
    low-quality information at both feature and decision levels. UDACA [72] proposes
    a novel UDAsHI method, which performs content-wise feature alignment by jointly
    reducing class-level and style-perceive-level discrepancies through an adversarial
    framework. TAADA [74] extracts spectral-spatial joint information through attention-based
    dual-branch feature extraction and adversarial learning, enabling more effective
    cross-domain classification performance. SSWDA [79] addresses the challenges of
    cross-scene wetland mapping with hyperspectral images. It introduces a spatial-spectral
    weighted adversarial domain adaptation framework that leverages joint 2D-3D convolutions,
    instance-weighted discrimination, and multi-classifier learning to enhance domain
    alignment and target classification. FDAN [83] designs a feature disentanglement-based
    domain adaptation network for cross-scene coastal wetland classification, aiming
    to extract class-specific domain-invariant features by explicitly separating out
    domain-specific and class-invariant components. Through a transformer-convolution
    fusion encoder and adversarial disentangled strategy, the method enhances both
    transferability and class discriminability. AdaIN [85] combines dual-level feature
    adversarial learning and adaptive instance normalization based simulation of cross-domain
    characteristics. DACNN [86] achieves physically plausible adaptation between SAR
    and optical domains. ADDA [28] extends the adversarial discriminative domain adaptation
    method to a semi-supervised setting for remote sensing object recognition, enabling
    effective adaptation to new geographic regions using both labeled and unlabeled
    data. CDADA [147] encourages the generator to produce transferable features that
    align across domains while remaining distant from class boundaries through incorporating
    dual land-cover classifiers as discriminators. DACNN-MME [148] uses cross-entropy
    loss on labeled data with an adversarial min-max entropy loss on unlabeled target
    data to jointly promote domain-invariant and class-discriminative feature learning.
    SSDAN [149] jointly optimizes standard cross-entropy loss and an adversarial min-max
    entropy loss, the method effectively learns domain-invariant yet discriminative
    features using both labeled and unlabeled target data. SASS [156] proposes a semi-supervised
    learning method for hyperspectral and LiDAR data classification by introducing
    a shared-private feature decoupling mechanism and multi-level feature alignment.
    This method effectively leverages both labeled and unlabeled data to enhance classification
    performance with limited annotations.


    At the pixel-level, feature-level adversarial learning mainly aim to enhance dense
    prediction consistency. MBATA-GAN [105] proposes a transformer-based framework,
    leveraging a mutually boosted attention module to effectively capture cross-domain
    semantic dependencies. By combining global attention with enhanced feature-level
    adversarial learning, it significantly improves feature transferability. JDAF
    [107] jointly aligns marginal and conditional distributions and incorporates an
    uncertainty-adaptive learning strategy to improve pseudo-label reliability and
    reduce domain gaps. CSLG [108] progressively aligns features from local semantic
    to global structural levels based on patch-level adaptation difficulty. With this
    design, it effectively addresses both local distribution shifts and global domain
    gaps caused by diverse land covers and sensor variations. MemoryAdaptNet [109]
    combines output space adversarial learning with a category-aware invariant feature
    memory module to bridge domain gaps and enhance feature consistency, achieving
    superior performance across multiple cross-domain tasks. De-GLSNG [110] enhances
    semantic segmentation in remote sensing by leveraging multiscale high/low-frequency
    decomposition and global-local representative adversarial learning to improve
    domain-invariant representation learning and cross-domain generalization. RCA-DD
    [111] proposes a region and category adaptive domain generalization, which incorporates
    an entropy-based regional attention module and a class-clear module. This method
    focuses on hard-to-align regions and selectively updating category distributions
    during training. MIDANet [112] employ multitask learning and entropy-based adversarial
    training, leveraging semantic segmentation and elevation estimation to extract
    domain-invariant features and enhance generalization without requiring target-domain
    labels. MMDANet [119] improves UDA-based semantic segmentation of high-resolution
    RSI by integrating DSM data through a multipatch branch and multitask decoder,
    and further aligns source and target domains using feature-level adversarial learning,
    enabling richer representations and improved segmentation via height-aware fusion
    refinement. HighDan [122] enhances the transferability by combining multi-resolution
    fusion and adversarial learning on multimodal remote sensing data (hyperspectral,
    multispectral, SAR) for cross-city segmentation.


    At the instance-level, feature-level adversarial learning mainly promotes feature
    alignment for more accurate object localization and recognition across domains.
    IDA [128] addresses domain shift by enforcing prediction consistency through a
    newly designed loss function. By aligning semantic information at both the image
    and instance levels, it enhances feature discrimination and reduces the risk of
    negative transfer, with theoretical analysis supporting its convergence properties.
    DFD-TCAT [129] utilizes dynamic feature discrimination and center-aware calibration
    to mitigate bounding box regression errors and feature misalignment caused by
    scattering differences across SAR sensors. By leveraging bidirectional feature
    aggregation and centerness-guided alignment, the approach enhances detection robustness
    under cross-domain conditions. FACL [130] incorporates adversarial learning with
    specialized attention and compensation modules. The Adversarial Learning Attention
    (ALA) uses entropy-based weighting for precise instance- and pixel-level alignment,
    while the Compensation Loss Module (CLM) enforces prototype feature consistency
    across domains to enhance detection accuracy. To tackle feature incompatibility
    across domains, PDSR [131] captures domain-specific features with patch-wise channel
    recalculation and leverages dynamic weighted prototype alignment (DWPA) to alleviate
    the impact of noisy pseudo-labels during early training. RIRA [132] framework
    introduces image-level and prototype-level feature alignment via a relation-aware
    graph, along with a rotation-invariant regularizer, effectively improving cross-domain
    detection robustness. FADA [133] integrates adversarial training (AT) via adversarial-based
    foreground alignment and further refines domain generalization through prototype-based
    confusing feature alignment. RFA-Net [134] introduces a unified framework combining
    data-level augmentation, sparse feature reconstruction, and pseudo-label generation.
    This design enhances instance-level alignment while reducing the influence of
    background noise in unsupervised domain adaptation scenarios. APA [135] proposes
    an adversarial prediction-space alignment method that jointly adapts location
    and class confidence outputs for vehicle detection in satellite images, yielding
    improvement and enhanced cross-domain detection performance. FIE-Net [143] addresses
    the foreground-background imbalance in a foreground-enhanced alignment framework.
    It emphasizes salient instance features by integrating a foreground-focused multigranularity
    alignment module and a progressive focal filtering strategy. DA-FRCNN [161] proposes
    a domain adaptive Faster R-CNN [179] framework for SAR target detection with limited
    labeled data by transferring knowledge from labeled optical images. It uses a
    GAN-based constraint after proposal

