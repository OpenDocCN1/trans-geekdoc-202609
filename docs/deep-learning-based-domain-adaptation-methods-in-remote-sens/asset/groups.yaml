    \ | - | 95.9 | 97.4 | 94.6 | 96.8 | 98.4 | - |\n\n*注：根据文本描述，文中的“MRDAN”可能对应表格中的“MLDAN”\
    \ [96]，“SRKT”可能对应“SRETT” [98]。下表保留了原始 OCR 的参考文献编号。*\n\n## 表 X：UDA-RSCls 任务中代表性方法在\
    \ SAR 数据集上的性能。表现最佳的模型以粗体表示。\n\n| 方法 | 来源 | 任务 | OA (%) |\n| :--- | :--- | :---:\
