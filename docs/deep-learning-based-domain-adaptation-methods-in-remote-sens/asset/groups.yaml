    ## 4) Mathematical Definitions for Typical Algorithms


    As shown in Fig. 3, DA-RS methods primarily consist of five typical types of algorithms.


    ### Distribution Measurement Based Methods


    Distribution measurement based methods mainly aim to match distributions between
    hidden features from different domains. As shown in Fig. 5 and Eq. 15, the common
    operation is to embed adaptation metric (e.g., Maximum Mean Discrepancy, MMD)
    into the neural networks.


    $$

    \mathcal{MMD}(D_S, D_T) = ||\frac{1}{N_S}\sum_{i=1}^{N_S} E(\boldsymbol{x}_S^{i})
    - \frac{1}{N_T}\sum_{j=1}^{N_T} E(\boldsymbol{x}_T^{j})||_2 \tag{15}

    $$


    DAN [55] is the pioneer in leveraging deep convolutional neural networks to learn
    transferable hidden features across domains in UDA task. It embeds MMD metric
    for adaptation. Subsequent to DAN, numerous DA-RS tasks adopt MMD for distribution
    measurement across intermediate feature maps of images belonging to different
    domains.


    ### Adversarial Learning Based Methods


    Adversarial learning is frequently utilized in DA-RS methods, primarily encompassing
    two types: image-level and feature-level adversarial learning-based methods. The
    illustration of these two typical adversarial learning paradigms is shown in Fig.
    6.


    Image-level adversarial learning-based methods utilize image generalization techniques,
    such as image translation [56], [57], to synchronize the data distribution between
    source and target images. These methods initially apply image-level adaptation
    and subsequently train models using cross-domain synthetic data. As depicted in
    Fig. 1 (a), $G_{S \rightarrow T}$ and $G_{T \rightarrow S}$ are responsible for
    adapting images from the source domain to the target domain, and vice versa. Meanwhile,
    the role of $D_S$ and $D_T$ is to distinguish between authentic source data and
    the fake data produced by the generators. For optimization, adversarial loss is
    employed, which is formulated in Eq. 16.


    $$

    \begin{cases}

    \mathcal{L}_{adv}(G_{S \rightarrow T}, D_T) = \mathbb{E}_{x_T \sim X_T}[\log(D_T(\boldsymbol{x}_{T}))]
    + \mathbb{E}_{x_S \sim X_S}[\log(1-D_T(G_{S \rightarrow T}(\boldsymbol{x}_S)))]
    \\

    \mathcal{L}_{adv}(G_{T \rightarrow S}, D_S) = \mathbb{E}_{x_S \sim X_S}[\log(D_S(\boldsymbol{x}_{S}))]
    + \mathbb{E}_{x_T \sim X_T}[\log(1-D_S(G_{T \rightarrow S}(\boldsymbol{x}_T)))]

    \end{cases} \tag{16}

    $$


    ![](img/6f3fe8f45739aa0bcfea4346d3596801_6_0.png)


    Fig. 6: Illustration of the common-utilized adversarial learning paradigms. $\{G_{S
    \rightarrow T}, G_{T \rightarrow S}\}$ and $\{D_S, D_T, D_F, D_P\}$ respectively
    denote generators and discriminators. $E$ and $\{f_S, f_T\}$ respectively denote
    encoders and feature mapping modules.


    To optimize $G_{S \rightarrow T}$ and $G_{T \rightarrow S}$, “Min-max” criterion
    is adopted, which can be expressed in Eq. 17.


    $$

    \begin{cases}

    \min_{G_{S \rightarrow T}} \max_{D_T} \mathcal{L}_{adv}(G_{S \rightarrow T}, D_T)
    \\

    \min_{G_{T \rightarrow S}} \max_{D_S} \mathcal{L}_{adv}(G_{T \rightarrow S}, D_S)

    \end{cases} \tag{17}

    $$


    In this paradigm, reconstruction loss ($\mathcal{L}_{rec}$) or cycle consistency
    loss is consistently utilized alongside the adversarial loss. The formulation
    for this is presented in Eq. 18.


    $$

    \begin{split}

    \mathcal{L}_{rec}(G_{S \rightarrow T}, G_{T \rightarrow S}) = & \mathbb{E}_{x_T
    \sim X_T}[\|G_{S \rightarrow T} G_{T \rightarrow S}(\boldsymbol{x}_T) - \boldsymbol{x}_T\|_a]
    \\

    & + \mathbb{E}_{x_S \sim X_S}[\|G_{T \rightarrow S} G_{S \rightarrow T}(\boldsymbol{x}_S)
    - \boldsymbol{x}_S\|_a]

    \end{split} \tag{18}

    $$


    where $\|\cdot\|_a$ indicates $L_a$-norm, which is served as loss function. Among
    the commonly applied norms, the $L1$-norm and $L2$-norm are particularly prevalent.
    This loss function aims to encourage the preservation of structural properties
    during the style transfer process.


    Feature-level adversarial learning-based methods delve into the domain-invariant
    features shared between source-style and target-style features. These methods
    leverage feature-level alignment strategies to address the domain shift problem.
    Typically, discriminators are integrated into the networks to ensure consistency
    alignment on intermediate feature maps or output posterior probabilities.


    As shown in Fig. 6 (b), $E$ are used for feature extraction, which share their
    weights in most scenarios. $f_S$ and $f_T$ are utilized to transform the extracted
    features into predictions. The design of these modules, as well as whether they
    share weights or not, may vary depending on the specific DA-RS tasks. To optimize
    the framework, feature-level adversarial loss can be depicted in Eq. 19 and Eq.
    20.


    $$

    \mathcal{L}_{adv}(E, D_F) = \mathbb{E}_{x_S \sim X_S}[\log(D_F(E(\boldsymbol{x}_S)))]
    + \mathbb{E}_{x_T \sim X_T}[\log(1 - D_F(E(\boldsymbol{x}_T)))] \tag{19}

    $$


    $$

    \begin{split}

    \mathcal{L}_{adv}(E, f_S, f_T, D_P) = & \mathbb{E}_{x_S \sim X_S}[\log(D_P(f_S(E(\boldsymbol{x}_S))))]
    \\

    & + \mathbb{E}_{x_T \sim X_T}[\log(1 - D_P(f_T(E(\boldsymbol{x}_T))))]

    \end{split} \tag{20}

    $$


    Similar to the optimization process in image-level adversarial learning (Eq. 17),
    the “min-max” criterion is also utilized for optimizing the loss function, shown
    in Eq. 21.


    $$

    \begin{cases}

    \min_g \max_{D_K} \mathcal{L}_{adv}(E, D_F) \\

    \min_{\{E, f_S, f_T\}} \max_p \mathcal{L}_{adv}(E, f_S, f_T, D_P)

    \end{cases} \tag{21}

    $$


    ### Self-Training Based Methods


    As a non-adversarial UDA paradigm, self-training has attracted much attention
