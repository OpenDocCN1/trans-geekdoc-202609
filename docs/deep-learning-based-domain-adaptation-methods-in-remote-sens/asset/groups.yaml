    $\boldsymbol{y} \boldsymbol{r}=\emptyset, \quad \forall i \in[1, N_T], j \in[1,
    K_T^{i, j}], y_T^{i, j} \rightarrow None$ (13)


    As narrowly defined, UDA-RS indicates a typical single-source single-target RS
    task, where $N_S=1, N_T=1$. Obviously, the methods utilized within this paradigm
    are intended to address the limitation posed by the insufficient availability
    of labeled target domain samples, as well as to address the issue of high annotation
    costs.


    # **Semi-supervised domain adaptation in remote sensing (“SSDA-RS”)**. SSDA is
    another hot topic in remote sensing field, which aims to improve the generalization
    performance by labeling a few target domain samples. As shown in Eq. 2, each sub-set
    of target dataset $(D_T^{i,j})$ contains labeled and unlabeled samples, where
    the number of unlabeled samples $(K_{T-i, u}^{j})$ is much larger than that of
    labeled samples $(K_{T-u}^{i, j})$. This paradigm can be formulated in Eq. 14.


    $\mathcal{D}_{T}^{j}=\left(\left\{\boldsymbol{x}_{T-u}^{i, l}\right\}_{l=1}^{K_{T-i,
    l}^{j}} \cup\left\{\left(\boldsymbol{x}_{T-u}^{i, j}, \boldsymbol{y}_T^{i, j}\right)\right\}_{u=1}^{K_{T-u}^{j}}\right)$
    (14)


    where $K_{T-i}^{j}+K_{T-u}^{j}=K_T^{j}$ and $K_{T-i}^{j}<<K_{T-u}^{j}$. Similar
    to UDA-RS, existing methods concerning SSDA-RS primarily utilize the single-source
    single-target input mode as well. Compared to UDA-RS, SSDA-RS emphasizes exploring
    information from limited labeled samples while maximizing the utilization of unlabeled
    samples.


    # **Supervised domain adaptation in remote sensing (“SDA(Finetuning)-RS”)**. SDA
    assumes that labeled samples are available for both domains. SDA methods focus
    on challenging situations where labeled target-domain samples are less numerous
    than those available in the source domain [52]. In such conditions, the proper
    use of source domain information and the finetuning technique on target domain
    are very important in solving the target problem. Mathematically, this paradigm
    can be represented as $\sum_{i=1}^{N_T} K_T^{i}<<\sum_{i=1}^{N_S} K_S^{i}$.


    In remote sensing scene, acquiring data from various sensors such as satellites
    and drones is relatively straightforward, resulting in an abundant supply of data
    from diverse domains. However, due to the vast geographical land cover, the challenge
    of high annotation costs becomes more pronounced. Consequently, the paradigms
    of UDA-RS and SSDA-RS are more aligned with practical requirements.


