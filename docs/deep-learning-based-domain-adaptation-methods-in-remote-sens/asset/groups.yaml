    **UDA-RSCls.** 无监督域适应高光谱图像（HSI）分类是 UDA-RSCls 任务中的一个关键话题。如表 III 所示，许多采用不同算法的方法
    [30], [61], [62], [64], [67]–[69], [72], [74], [79], [81], [83], [88], [90], [92],
