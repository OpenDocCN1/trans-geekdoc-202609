    DA-RS 方法使用“单源单目标”作为输入模式，我们还将深入探讨采用其他输入模式的方法。必须承认，在这三个分类法中的方法之间可能存在不可避免的重复。具体来说，某些方法可能属于多个分类法的范畴。


