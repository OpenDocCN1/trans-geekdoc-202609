    advances the development within this field. Upon entering the deep learning era,
    deep learning techniques have shown superior performance over traditional methods.


    **UDA-RSCls.** Unsupervised domain adaptation Hyperspectral image (HSI) classification
    stands as a pivotal topic within the UDA-RSCls task. As shown in Tab. III, many
    methods [30], [61], [62], [64], [67]–[69], [72], [74], [79], [81], [83], [88],
    [90], [92], [94] with variety of algorithms have been proposed to address the
    challenge of UDA HSI classification. Unsupervised domain adaptation for aerial
    image classification represents another fascinating research topic within the
    UDA-RSCls task. Many notable methods [29], [42], [59], [60], [63], [65], [66],
    [70], [71], [76]–[78], [84], [87], [89], [95]–[99] are proposed to exploit the
    abundant information contained in high-resolution aerial and satellite images.
    Given the unique imaging characteristics and inherent domain shifts of SAR data,
    unsupervised domain adaptation for SAR image classification emerges as another
    compelling direction within the broader scope of UDA-RSCls. Several recent studies
    [75], [80], [82], [85], [86] have explored strategies to mitigate the significant
    domain gap in different SAR data, aiming to enhance cross-domain generalization.


