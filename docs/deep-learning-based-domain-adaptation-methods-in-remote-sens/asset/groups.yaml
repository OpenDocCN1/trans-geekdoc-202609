    extraction, modality-based similarity estimation, and a sharpness-aware feature
    discriminating (SAFD) strategy. GreRa-Net [189] enhances cross-scene classification
    of multisource remote sensing data by jointly modeling global-local features and
    inter-class relations. A tailored pseudo-label-guided alignment strategy further
    refines domain adaptation.


    With this design, FDINet enhances generalization without sacrificing feature discrimination.


    ### 3) Many-to-One

    MSCN [65] is the first article to address UDA task on multiple source domain datasets
    with unshared categories in remote sensing. Unlike most UDA methods assuming class
    symmetry, MS-CADA [115] addresses the more realistic yet unders explored problem
    of class-asymmetric adaptation for remote sensing images using multiple sources.
    SSDAN [149] proposes a multi-source semi-supervised domain adaptation method for
    remote sensing scene classification that leverages a pre-trained EfficientNet-B3
    [205] to extract discriminative features and employs a prototype-based classification
    module with cosine distance. AMDA [190] efficiently adapts training data from
    multiple domains and achieves significant performance gains for local climate
    zone (LCZ) classification task. IMIS [191] addresses cross-domain scene classification
    with incomplete multiple source domains, where target categories may be partially
    unknown to each source. To handle this, it proposes a separation mechanism that
    distinguishes known and unknown categories in the target domain before performing
    alignment. Swin-DA [192] aligns source and target domains without repeatedly accessing
    source data, achieving superior performance and stability across multiple high-resolution
    remote sensing datasets. ALKA [193] proposes a novel multi-source unsupervised
    domain adaptation architecture. To reduce domain discrepancy, a Minmax entropy
    optimization strategy is employed, adversarially aligning target features with
    source classifiers for improved generalization. MECKA [194] designs a unified
    framework for multisource-single-target domain adaptation in remote sensing. It
    smoothly transfers information to target domains with incomplete class overlap,
    enhancing classification robustness. MSSDANet [195] is a novel unsupervised multi-source
    domain adaptation framework. It combines a two-stage feature extraction strategy
    with newly designed discriminant semantic transfer (DST) and class correlation
    (CC) losses, which enhances semantic alignment across domains without requiring
    target domain labels.


    ### 4) Source-Free

    Source-free domain adaptation refers to adapting a pre-trained source model to
    an unlabeled target domain without access to source data, relying solely on the
    target data and the transferred model parameters. HSI-SFDA [196] generates source
    spectral features and aligning them with target features via contrastive learning,
    combined with a logits-weighted prototype classifier for iterative pseudo-labeling,
    the method enables effective target domain adaptation without access to labeled
    source data. MSF-UDA [197] combines weighted information maximization and pseudo-labeling
    losses to align source and target feature distributions across multiple source
    domains. It enhances target domain classification accuracy while reducing dependence
    on source data during adaptation. MLDP-SFOD [198] consists of domain perturbation,
    multi-level alignment, and prototype-based distillation within a mean teacher
    framework. With this design, it effectively extracts domain-invariant features
    to adapt source-pretrained models to target domains without accessing source data.
    SFDUDA [199] proposes a source-free unsupervised domain adaptation (UDA) method
    for cross-regional and cross-time crop type mapping, effectively addressing the
    limitations of traditional UDA methods that require source data during adaptation.
    This method demonstrates strong generalization capabilities across different countries,
    sensors, and time periods. SFOD [142] also addresses the limitations of traditional
    UDA methods that rely on access to source data during adaptation. It effectively
    extracts domain-invariant features without requiring source images. APD-SFDA [200]
    pioneers source-free domain adaptation segmentation for remote sensing images,
    eliminating the need for source data during adaptation. By integrating vision
    foundation models with attention-guided prompt tuning and a similarity-based feature
    alignment strategy, the method effectively adapts pretrained models to diverse
    target images. LPLDA [201] distills low-confidence proposals and introduces an
    instance consistency loss. This approach enhances the robustness of small object
    representation under domain shifts, making it particularly effective for fine-grained
    targets in aerial scenes. SD-SFDA [202] proposes a source-free cross-sensor adaptation
    method for hip-detection in SAR images, addressing the limitations of fixed-threshold
    pseudo-labeling in heterogeneous domains like optical-to-SAR transfer. S$^3$LH
    [203] adapts SDAH-trained models to target domains using only unlabeled data during
    test-time training. It integrates sliding aided hyper inference (SAHID) and instance-level
    contrastive learning under a mean-teacher framework to overcome both data scarcity
    and domain shift challenges. SMNA [204] incorporates a model statistics-guided
    alignment strategy alongside a noise adaptation module, enabling the target domain
    features to align with the source distribution while mitigating the impact of
    label noise.


    ## D. Others


    ### 1) Domain Adaptation across Varying Label Spaces

    While our focus remains on domain adaptation under shared label spaces, real-world
    remote sensing scenarios often involve mismatched category configurations between
    source and target domains. Cross-label settings like partial, open-set, and universal
    domain adaptation pose additional challenges beyond distribution alignment. Since
    these approaches primarily tackle label space discrepancies, we briefly mention
    them here without delving into detailed discussion.


    As shown in Fig. 7, partial domain adaptation (PDA) assumes that target label
    sets are considered a subset of source label sets. In contrast, open set domain
    adaptation (OS-DA) assumes that the target label set contains unknown classes
    not present in the source label set, which means that the source label sets are
    considered a subset of target label sets. Universal domain adaptation (UniDA)
    poses no prior knowledge on the label sets of source and target domains. Instead,
    it assumes that each domain contains a mix of shared and private (domain-specific)
    label sets. Building on this, source-free universal domain adaptation (SF-UniDA)
    further assumes that the source data is inaccessible during adaptation, and only
    a trained source model and unlabeled target data are available. In the'
