    ## Deep Learning Based Domain Adaptation Methods in Remote Sensing: A Comprehensive
    Survey


    **Authors:** Shuchang Lyu, Member, IEEE; Qi Zhao, Member, IEEE; Zheng Zhou; Meng
    Li; You Zhou; Dingding Yao; Guangliang Cheng; Huiju Zhou; Zhenwei Shi, Senior
    Member, IEEE


    **Abstract**— Domain adaptation is a crucial and increasingly important task in
    remote sensing, aiming to transfer knowledge from a source domain to a differently
    distributed target domain. It has broad applications across various real-world
    applications, including remote sensing element interpretation, ecological environment
    monitoring, and urban/rural planning. However, domain adaptation in remote sensing
    poses significant challenges due to differences in data, such as variations in
    ground sampling distance, imaging modes from various sensors, geographical landscapes,
    and environmental conditions. In recent years, deep learning has emerged as a
    powerful tool for feature representation and cross-domain knowledge transfer,
    leading to widespread adoption in remote sensing tasks. In this paper, we present
    a comprehensive survey of significant advancements in deep learning based domain
    adaptation for remote sensing. We first introduce the preliminary knowledge to
    clarify key concepts, mathematical notations, and the taxonomy of methodologies.
    We then organize existing algorithms from multiple perspectives, including task
    categorization, input mode, supervision paradigm, and algorithmic granularity,
    providing readers with a structured understanding of the field. Next, we review
    widely used datasets and summarize the performance of state-of-the-art methods
    to provide an overview of current progress. We also identify open challenges and
    potential directions to guide future research in domain adaptation for remote
    sensing. Compared to previous surveys, this work addresses a broader range of
    domain adaptation tasks in remote sensing, rather than concentrating on a few
    subfields. As well, we attempt a systematic taxonomy, providing a more comprehensive
    and organized understanding of the field. As a whole, this survey can inspire
    the research community, foster understanding, and guide future work in the field.


    ![](img/6f3fe8f45739aa0bcfea4346d3596801_0_0.png)


    Fig. 1: Illustration of the cases to explain the main challenges of domain adaptation
    methods in remote sensing. Different colors represent specific sections. Best
    viewed in color.


    **Index Terms**— Domain Adaptation, Remote Sensing, Deep Learning, Comprehensive
    Survey.


    ### I. INTRODUCTION


    Remote sensing (RS) technology has been extensively utilized across various real-world
    applications, including remote sensing element interpretation [1]–[3], ecological
    environment monitoring [4], [5], urban/rural planning [6]–[8], etc. Over the past
    decade, advancements in deep learning, such as deep convolutional neural networks
    [9]–[11], Transformers [12], [13] and Mamba [14]–[16], have significantly accelerated
    the development of remote sensing applications. However, their effectiveness often
    relies on costly and labor-intensive training samples with annotations that adequately
    cover complex scenes. In practical scenarios, the scarcity of such samples frequently
    fails to adequately address the discrepancies between the training (source) and
    testing (target) images, leading to a notable deterioration in performance. This
    domain shift phenomenon and the subsequent gap between source and target domains
    pose significant challenges. To mitigate this issue and bridge the domain gap
    effectively, domain adaptation methods for remote sensing have emerged as a pivotal
    research topic. These methods strive to enhance the generalization capabilities
    of RS models, enabling them to perform robustly across diverse and unseen domains,
    thus overcoming the limitations imposed by insufficient and biased training data.


    Deep learning based domain adaptation methods are designed to train a model using
    source dataset and then transfer its capabilities to generate accurate predictions
    on target dataset. In the realm of remote sensing science, several challenges
    persist, encompassing the following aspects. (1) Severe variation caused from
    different ground sampling distances. As shown in Fig. 1 (a), objects such as “cars”
    in images captured with varying ground sampling distances exhibit obvious differences
    in characteristics. (2) Discrepancy of certain categories between source and target
    images due to the utilization of different imaging modes. As illustrated in Fig.
    1 (b), the color of “trees” varies between R-G-B and IR-R-G images. (3) Discrepancy
    of same categories under different geographical landscapes. As depicted in Fig.
    1(c), “buildings” in rural and urban exhibit distinct architectural patterns.
    (4) Large domain shifts occur due to different environmental factors (weather
    conditions, illumination, shadows, etc.). Fig. 1 (d) shows the contrast between
    a “railway station” scene with and without mist. As a whole, these challenges
    exist in varying degrees of data distribution discrepancies, leading to a domain
    shift problem between source and target domain images.


    ![](img/6f3fe8f45739aa0bcfea4346d3596801_1_0.png)


    Fig. 2: Illustration of the pipeline of this survey. Different colors represent
    specific sections. Best viewed in color.


    To alleviate the domain shift and bridge the domain gap between the source and
    target images in remote sensing scenes, numerous domain adaptation methods have
    been proposed. Before deep learning era, domain adaptation methods mainly focus
    on traditional methods [17] such as invariant feature selection [18]–[21], data
    distribution adaptation [22]–[25], etc., with the aim of adjusting the distribution
    discrepancy between the source and target domains. In the past decade, the rapid
    development of deep learning [26], [27], especially deep neural networks, has
    promoted the development of domain adaptation methods in remote sensing field.
    Initially, adversarial learning emerges as the predominant technology [28]–[35],
    which is primarily utilized for feature-level or image-level alignment. As another
    remarkable technique, self-training has garnered considerable attention in the
    realm of remote sensing domain adaptation tasks [36]–[41]. This non-adversarial
    paradigm enhances adaptation capabilities by generating reliable, consistent,
    and class-balanced pseudo labels for target domain images. As adversarial learning
    and self-training enhance the efficiency of domain adaptation methods from distinct
    perspectives, the integration of these two techniques has become as a novel research
    focus [42]–[46]. The introduction of Model (SAM) [47], [48] has marked a revolutionized
    era in the realm of computer vision. Leveraging their exceptional generalization
    capabilities across diverse scenarios, the field of remote sensing stands to gain
    significantly from domain adaptation methods [49]–[51] informed by these advancements.
    Despite the fact that LVM-based domain adaptation methods in remote sensing remain
    relatively underexplored, it still reveals a significant and promising recent
    research trend.


    With the plethora of recent domain adaptation methods in remote sensing, some
    survey papers have been proposed. Notably, [52], [53] delve into the domain adaptation
    methods specifically tailored for remote sensing classification tasks. [54] clarifies
    and reviews the idea of unsupervised domain adaptation in remote sensing area.
    Since the most recent pertinent survey only encapsulates methods up to 2022, there
    arises a necessity to provide a more updated survey in this rapid-developed field.
    Compared to previous survey papers, we provide a updated overview of the most
    recent methods. For various specific remote sensing tasks, we review and present
    a detailed and comprehensive experimental comparison across diverse benchmark
    datasets. Considering that large vision models (LVMs) are anticipated to become
    a focal research topic in the forthcoming years, we will specifically explore
    LVM-based domain adaptation methods and outline the emerging trends in remote
    sensing area.


    In summary, the main contributions of this survey can be listed as follows.


    - We provide systematical overview of the latest research on domain adaptation
    methods in remote sensing. Compared to prior survey works, our study provides
    a broader scope and more updated content.

    - We present several systematic taxonomies of current domain adaptation methods
    in remote sensing, organized from four perspectives: task categorization, input
    model, supervision paradigms and algorithm granularity.

    - We highlight influential works with state-of-the-art performance.


    > This work was supported by “the Fundamental Research Funds for the Central Universities”
    (grant number 501YC2025102002).


    Shuchang Lyu, Qi Zhao, Zheng Zhou, Meng Li and You Zhou are with the Department
    of Electronic and Information Engineering, Beijing University. Zhenwei Shi is
    with the Image Processing Center, School of Aeronautics, Beihang University. E-mail:
    l.yushucheng@buaa.edu.cn, zhaofy@buaa.edu.cn, zhengzhou@buaa.edu.cn, li@buaa.edu.cn,
    sy420322@buaa.edu.cn, shiwenqj@buaa.edu.cn.

    Dingding Yao is with Institute of Acoustics, Chinese Academy of Sciences. (dyao@ioa.ac.cn).

    Guangliang Cheng is with the Department of Computer Science, at the University
    of Liverpool. (Guangliang.Cheng@liverpool.ac.uk).

    Huiju Zhou is with the School of Computing and Mathematical Sciences, at the University
    of Leicester (hz143@leicester.ac.uk).

    Corresponding author: Qi Zhao

