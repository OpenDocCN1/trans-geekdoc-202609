  - "[PAGE 23]\n\n+   - Adaptation between HRRSD and SSTD\n  (HRRSD → SSTD),\n- Adaptation\
    \ between LEVIR and SSTD\n  (LEVIR → SSTD).\n\nAmong UDA-RS Det tasks, the “HRRSD\
    \ → SDD” task represents an optical-to-SAR scenario, while the “LEVIR → SDD” task\
    \ corresponds to a typical SAR-to-SAR setting. All remaining tasks fall under\
    \ the optical-to-optical category.\n\nThe results are summarized in Tab. XII.\
    \ Here, we first clarify that some methods have different experimental settings\
    \ on the same datasets, such as different dataset splits and model choices. Therefore,\
    \ the comparisons may not be strictly fair. This survey only reports the results\
    \ from original paper listed in Tab. VII. For more details, please refer to the\
    \ original papers. From the results and the detailed information provided in the\
    \ original papers, it can be observed that recent approaches such as FIE-Net [143]\
    \ and CDST [41] consistently achieve leading performance across multiple cross-domain\
