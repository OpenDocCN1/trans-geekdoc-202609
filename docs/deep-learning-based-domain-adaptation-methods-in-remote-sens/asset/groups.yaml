    **UDA-RSDD.** 针对遥感目标检测的无监督域适应主要侧重于将知识从标记的光学航空和卫星图像转移到来自不同域的未标记图像 [41], [132]–[143]，其中显著的域差距源于根本不同的成像机制、物体纹理和背景杂乱。与光学到光学的适应不同，SAR
    数据在特征表示和对齐方面引入了重大挑战，促使开发了专门的技术，如域不变特征学习、跨模态对齐和伪标签细化 [125]–[129]。


