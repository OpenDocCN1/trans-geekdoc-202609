    基于自训练的域自适应方法通过为未标记数据迭代生成伪标签并重新训练模型来提高目标域性能。这些方法利用模型自身的预测来逐渐细化决策边界，从而在域偏移下实现更好的类判别。


    UDA-SAR [82] 利用基于伪标签的对比学习，以增强光学源域和SAR目标域之间的按类对齐。通过整合一致性约束和跨域伪标签监督，该方法有效地缓解了源域偏差，并逐渐细化目标域表征以实现准确的SAR船舶分类。DST
