    ## 遥感领域中基于深度学习的域适应方法：综合综述


    **作者：** Shuchang Lyu（IEEE 会员）；Qi Zhao（IEEE 会员）；Zheng Zhou；Meng Li；You Zhou；Dingding
    Yao；Guangliang Cheng；Huiju Zhou；Zhenwei Shi（IEEE 高级会员）


    **摘要** — 域适应是遥感领域一项至关重要且日益重要的任务，旨在将知识从源域迁移到具有不同分布的目标域。它在各种实际应用中具有广泛的用途，包括遥感要素解译、生态环境监测以及城乡规划。然而，由于数据差异（如地面采样距离的变化、来自不同传感器的成像模式、地理景观和环境条件等），遥感中的域适应面临着重大挑战。近年来，深度学习已成为特征表示和跨域知识迁移的有力工具，并在遥感任务中得到广泛应用。在本文中，我们对基于深度学习的遥感域适应的重要进展进行了综合综述。我们首先介绍基础知识，以澄清关键概念、数学符号和方法分类。然后，我们从多个角度组织现有算法，包括任务分类、输入模式、监督范式和算法粒度，为读者提供对该领域的结构化理解。接下来，我们回顾广泛使用的数据集，并总结最先进方法的性能，以概述当前的进展。我们还指出了开放挑战和潜在方向，以指导未来遥感域适应的研究。与之前的综述相比，本工作涵盖了更广泛的遥感域适应任务，而不是集中在少数子领域。此外，我们尝试了系统分类，提供了对该领域更全面和有序的理解。总体而言，本综述可以激发研究界，促进理解，并指导该领域的未来工作。


    ![](img/6f3fe8f45739aa0bcfea4346d3596801_0_0.png)


    图 1：说明遥感域适应方法主要挑战的案例图示。不同颜色代表特定部分。建议以彩色查看。


    **索引术语** — 域适应，遥感，深度学习，综合综述。


    ### I. 引言


    遥感（RS）技术已广泛应用于各种实际应用中，包括遥感要素解译 [1]–[3]、生态环境监测 [4], [5]、城乡规划 [6]–[8] 等。在过去十年中，深度学习的发展，如深度卷积神经网络
    [9]–[11]、Transformer [12], [13] 和 Mamba [14]–[16]，极大地加速了遥感应用的发展。然而，它们的有效性通常依赖于昂贵且劳动密集型的训练样本，这些样本的标注需要充分覆盖复杂的场景。在实际场景中，此类样本的稀缺往往无法充分解决训练（源）图像和测试（目标）图像之间的差异，导致性能显著下降。这种域偏移现象以及随后的源域和目标域之间的差距构成了重大挑战。为了缓解这一问题并有效弥合域差距，遥感域适应方法已成为一个关键的研究主题。这些方法致力于增强
    RS 模型的泛化能力，使其能够在多样且未见过的域中稳健运行，从而克服由训练数据不足和偏差带来的限制。


    基于深度学习的域适应方法旨在利用源数据集训练模型，然后迁移其能力以在目标数据集上生成准确的预测。在遥感科学领域，仍存在若干挑战，涵盖以下几个方面。(1) 由不同地面采样距离引起的严重变化。如图
    1 (a) 所示，以不同地面采样距离拍摄的图像中的对象（如“汽车”）在特征上表现出明显的差异。(2) 由于使用不同的成像模式，源图像和目标图像中特定类别之间的差异。如图
    1 (b) 所示，“树木”在 R-G-B 和 IR-R-G 图像中的颜色有所不同。(3) 不同地理景观下相同类别的差异。如图 1(c) 所示，农村和城市的“建筑物”呈现出不同的建筑模式。(4)
    由于不同的环境因素（天气状况、光照、阴影等）导致的大规模域偏移。图 1 (d) 展示了有雾和无雾的“火车站”场景之间的对比。总体而言，这些挑战存在不同程度的数据分布差异，导致源域和目标域图像之间的域偏移问题。


    ![](img/6f3fe8f45739aa0bcfea4346d3596801_1_0.png)


    图 2：本综述流程的图示。不同颜色代表特定部分。建议以彩色查看。


    为了缓解遥感场景中源图像和目标图像之间的域偏移并弥合域差距，已提出了许多域适应方法。在深度学习时代之前，域适应方法主要关注传统方法 [17]，如不变特征选择
    [18]–[21]、数据分布适应 [22]–[25] 等，旨在调整源域和目标域之间的分布差异。在过去十年中，深度学习 [26], [27]，特别是深度神经网络的快速发展，促进了遥感领域域适应方法的发展。最初，对抗学习成为主要技术
    [28]–[35]，主要用于特征级或图像级对齐。作为另一项显著技术，自训练在遥感域适应任务领域引起了相当大的关注 [36]–[41]。这种非对抗范式通过为目标域图像生成可靠、一致且类别平衡的伪标签来增强适应能力。由于对抗学习和自训练从不同角度提高了域适应方法的效率，这两种技术的结合已成为一个新的研究焦点
    [42]–[46]。模型（SAM）[47], [48] 的引入标志着计算机视觉领域的一个革命性时代。利用其在不同场景中的卓越泛化能力，遥感领域将从这些进步所驱动的域适应方法
    [49]–[51] 中显著受益。尽管基于 LVM 的遥感域适应方法仍然相对未得到充分探索，但它仍然揭示了一个重要且充满前景的近期研究趋势。


    鉴于近期遥感领域涌现了众多域适应方法，一些综述论文已被提出。值得注意的是，[52], [53] 深入探讨了专门为遥感分类任务定制的域适应方法。[54] 澄清并回顾了遥感领域非监督域适应的思想。由于最近的相关注仅概括了截至
    2022 年的方法，因此在快速发展的领域需要提供更新的综述显得十分必要。与之前的综述论文相比，我们提供了对最新方法的更新概述。对于各种特定的遥感任务，我们审查并在不同的基准数据集上呈现了详细和全面的实验对比。考虑到大型视觉模型（LVMs）预计将成为未来几年的研究焦点，我们将专门探索基于
    LVM 的域适应方法，并概述遥感领域的新兴趋势。


    总而言之，本综述的主要贡献可以列举如下。


    -   我们提供了对遥感域适应方法最新研究的系统概览。与先前的综述工作相比，我们的研究提供了更广泛的范围和更新的内容。

    -   我们展示了当前遥感域适应方法的几个系统分类，从四个角度进行组织：任务分类、输入模式、监督范式和算法粒度。

    -   我们突出了具有最先进性能的影响性工作。


