    同时优化从源到目标和从目标到源的转换，以利用互补的域信息。通过整合双向语义一致性损失并在推理时结合双分类器，该方法在多个数据集上优于传统的单向方法。MHDAA
    [117] 为遥感分割引入了一种统一的多级无监督域自适应框架，特别强调通过循环一致性进行图像级对抗学习。通过结合实例级对齐、特征级对比学习和决策级任务一致性，它在无需目标域监督的情况下有效解决了复杂的域偏移问题。FDADA
