    In the field of remote sensing, numerous recent advances have been made to address
    the challenges of PDA [78], [206], OS-DA [86], [207]–[215], UniDA [89], [216]–[219],
    and SF-UniDA [77], [220], [221].


    **PDA Remote Sensing Methods.** PDA [78] makes the first attempt to address the
    partial domain adaptation problem in remote sensing scene classification, where
    the source label space subsumes the target''s. A progressive auxiliary domain
    module, multi-weight adversarial learning, and attentive entropy regularization
    are introduced to mitigate negative transfer and improve adaptation performance.
    PDANN [206] designs a partial domain adversarial neural network to address domain
    shift and label space mismatch in crop yield prediction, improving transferability
    by down-weighting outlier source samples during domain alignment.


    **OS-DA Remote Sensing Methods.** OSDANet [207] tackles open set domain adaptation
    for remote sensing image scene classification by leveraging adversarial learning
    between a feature generator and a classifier to distinguish shared classes and
    reject unknown target samples. ODA-SAR [208] proposes a spherical space domain
    adaptation network for SAR image classification under open set conditions, where
    features are mapped to a hypersphere to enhance class separability. OSDA-ETD [209]
    jointly explores transferability to reduce inter-domain and intra-class discrepancies,
    while enhancing inter-class separability through discriminability, thereby effectively
    addressing the challenges of unseen categories and strong inter-class similarity
    in remote sensing images. SSOUDA [210] addresses open-set unsupervised domain
    adaptation in optical remote sensing by integrating contrastive self-supervised
    learning with consistency self-training, enabling the extraction of discriminative
    target features and reliable unknown class samples.


    DST [86] is a novel approach designed to tackle open-set UDA challenges in heterogeneous
    SAR image classification. The proposed framework adaptively distinguishes unknown
    target classes from known ones, enabling more robust cross-domain recognition.
    IAFAAN [211] employs an instance affinity-based mechanism to separate unknown
    samples and a sample discriminability loss to enhance class separation, while
    a novel Mask-MMD metric ensures precise alignment of known classes without negatively
    transferring unknown ones. MAOSDAN [212] enhances model robustness in complex
    real-world scenarios with partially overlapping label spaces. It integrates attention-aware
    backpropagation, auxiliary adversarial learning, and adaptive entropy suppression
    to effectively separate known and unknown target classes while mitigating negative
    transfer. OSDA-ST [213] introduces max-logit score thresholding and dynamic source
    selection to estimate unknown classes. PUMCL [214] effectively handles unknown
    classes and improves cross-domain generalization by aligning features and refining
    pseudo-labels. DFEIN [215] jointly captures local discriminative patterns and
    global semantic correlations to enhance the detection of unseen categories by
    leveraging sample similarity to known classes.


    **UniDA Remote Sensing Methods.** C³DA [89] proposes a universal domain adaptation
    method for remote sensing scene recognition, which introduces a novel "C³" criterion
    that integrates confidence, consistency, and centrality to effectively identify
    unknown classes. By optimizing the loss function design, it enhances training
    efficiency and improves adaptability across diverse DA scenarios. HyUniDA [216],
    [218] eliminates reliance on prior label space knowledge. It effectively identifies
    shared classes and estimates target domain structure, enabling robust knowledge
    transfer across diverse HSI domains. SPOT [217] leverages unbalanced optimal transport
    and a sample complement mechanism to effectively distinguish shared and private
    classes. By enhancing inter-class separability and intra-class compactness, it
    achieves improved accuracy and robustness under complex domain shifts. DCMix [219]
    integrates closed-set and open-set classifiers with a feature mixup strategy,
    which enhances target domain generalization and enables more robust cross-domain
    transfer.


    **SF-UniDA Remote Sensing Methods.** SDG-UniDA [220] first generates synthetic
    source data from a pre-trained model and then adapts using a transferable weight
    mechanism to distinguish shared and unknown classes. SDG-MA [77] proposes a UniDA
    framework for remote sensing image scene classification without prior knowledge
    of label sets. By synthesizing source data from a pretrained model and introducing
    transferable weights, the method effectively identifies shared categories while
    detecting unknown classes in the target domain. OKRA [221] employs neighborhood
    similarity for knowledge distillation and utilizes energy-based uncertainty modeling
    to distinguish known and unknown target samples effectively, without requiring
    source data or manual thresholding.


    ### 2) DA-RSCD


    As previously mentioned, the DA-RSCD task differs from DA-RSCIs, DS-RSSEG, and
    DA-RSEND in that the domain shift occurs within paired images, rather than across
    separate domains (source and target domains).


    The DA-RSCD task, also known as Cross-Domain Change Detection (CCD), focuses on
    detecting changes in remote sensing image pairs acquired from different sensors
    or under varying imaging conditions. *Chen et al*. [222] provide the first systematic
    review of DA-RSCD. This survey examines the key components of this research direction,
    including image preprocessing, feature representation and change detection strategies,
    while identifying current challenges and future research avenues. *Cheng et al*.
    [223] also investigate the domain adaptation issue in the realm of change detection
    tasks.


