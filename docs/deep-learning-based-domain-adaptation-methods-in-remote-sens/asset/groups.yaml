    [80] 整合了视觉特征和散射拓扑特征，以改善合成SAR图像与实测SAR图像之间的目标识别。通过利用图神经网络和按类对齐策略，该方法实现了卓越的性能。UDA-GAN
    [100] 是首个应用基于GAN的分割网络来解决UDA-RSseg（无监督域自适应遥感分割）任务的方法。它引入了一种图像级对抗学习方案，其中生成器将源图像转换为目标域风格，而判别器鼓励转换后的图像在视觉上难以与真实目标图像区分，从而在像素级别缩小域差距。ResiDualGAN
