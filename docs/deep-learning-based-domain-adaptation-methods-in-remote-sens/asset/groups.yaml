    提高模型的泛化能力和鲁棒性。DCA [103] 显式地对齐类别特征以学习域不变表示，从而在失衡和不一致分布下增强类内紧凑性和类间可分性。为了解决船舶检测中标记SAR数据缺乏的问题，HSANet
    [126] 引入了一个分层域自适应框架，该框架利用了已标记的光学图像。它在全局（通过基于傅里叶的对齐进行结构级对齐）和局部（通过原型对齐进行实例级对齐）两个尺度上对齐SAR域和光学域，以增强跨模态检测性能。CORAL-ADA
    [137] 将相关性对齐和对抗域自适应集成到基于区域的检测器中，并通过重建损失进一步增强了性能，在目标域取得了显著的性能提升。


    一些半监督域自适应方法围绕分布对齐或距离度量展开，因为少量标记目标数据可用性使得对域差异进行更可靠的估计成为可能，并更好地指导源域和目标域之间特征空间的对齐。TDDA
    [146] 提出了一种用于高光谱图像分类的两阶段深度域自适应方法，该方法结合了基于MMD的域对齐和一个具有成对损失的空间谱空间网络，利用少量标记的目标样本学习判别性嵌入空间。DJ-CORAL
    [150] 将异构特征投影到共享子空间中，并对齐边缘分布和条件分布。该方法有效利用未标记的目标数据来减少域偏移并提高分类性能。BsCA [152] 通过结合无监督最大均值差异对齐和有监督类别感知对齐，有效减少了域偏移，并利用源域和目标域中的标记和未标记数据。SSCA
    [155] 集成了一个旋转鲁棒卷积特征提取器（RCFE）来处理旋转变化，以及一个基于邻居的子类质心对齐（NSCA）模块来缓解跨域类内差异。CDMPc [158]
    引入了矛盾结构学习机制和自监督学习策略，以增强域对齐并改善有限标记目标样本的利用。SAR-CDSS [163] 通过利用光学数据和少量标记的SAR样本，提出了一种用于SAR图像的半监督跨域目标检测框架。它通过图像混合和实例交换进行数据增强以及用于选择性特征对齐的自适应优化策略，在图像、实例和特征级别逐步减少域偏移。CDTL-YOLOV5
    [167] 提出了一种基于YOLOv5的半监督SAR目标检测方法。通过引入少目标域自适应约束，该模型从标记的光学数据中迁移丰富知识，以在有限标注下改善SAR特征学习。


    ## 2) 基于对抗学习的方法


    如前所述，对抗学习技术旨在获取特征级、像素级或两者兼有的信息，以减少不同域之间存在的差异。在表III所示的方法中，对抗学习在不同任务和不同监督范式下都发挥着重要作用。


    ### 基于特征级对抗学习的方法


    特征级对抗学习旨在将源域和目标域的特征图对齐到统一的潜在空间，从而缓解特征级对抗学习过程中的偏差。在全局尺度上，特征对抗对齐鼓励模型学习域不变的类别级语义，从而提高跨域预测的一致性。SSMT-RS
    [63] 利用元学习来区分多个目标域，并使用对抗学习来混淆源域与混合多目标域之间的区别。元学习和对抗学习这两个过程迭代且动态地运行。ADA-Net [64]
    开发了基于变分自编码器的生成器，旨在从两个域获取光谱和空间特征。通过引入两个对抗学习目标函数，将同时考虑全局和局部对齐。为了解决多源域数据集和单一目标数据集之间的域偏移问题，MSNRC
    [65] 最初设计了一个预训练的CNN来提取不同域中的图像特征。随后，通过一个由不同源特定判别器组成的跨域对齐模块对齐每个源域和目标域的特征。ECB-FAM
    [66] 将误差校正边界机制集成到特征级对抗学习框架中。这种集成使得能够同时构建域不变特征和语义有意义的特征。CDA [67] 集成了逐类对抗对齐和PMMD（概率MMD）策略，通过按类对齐域不变特征来实现无监督域自适应。为了解决高光谱分类中的跨域特征分布差异，JDA
    [68] 首先通过耦合VAE（变分自编码器）模块将数据映射到共享潜在空间，然后通过细粒度联合分布对齐模块优化逐类对齐。DFEnet [71] 结合了用于自适应提取全局和局部判别特征的背景感知特征细化（CAFR）模块和多级对抗丢弃（MAD）模块。该设计通过在特征和决策层面选择性抑制低质量信息来增强特征泛化能力。UDACA
    [72] 提出了一种新的UDAsHI方法，通过对抗框架联合减少类别级和风格感知级差异来执行内容级特征对齐。TAADA [74] 通过基于注意力的双分支特征提取和对抗学习提取光谱-空间联合信息，实现更有效的跨域分类性能。SSWDA
    [79] 解决了高光谱图像跨场景湿地制图面临的挑战。它引入了一种空间-光谱加权对抗域自适应框架，利用联合2D-3D卷积、实例加权判别和多分类器学习来增强域对齐和目标分类。FDAN
    [83] 设计了一种基于特征解耦的域自适应网络，用于跨场景沿海湿地分类，旨在通过显式分离域特定和类别不变成分来提取类别特定的域不变特征。通过Transformer-卷积融合编码器和对抗解耦策略，该方法增强了可迁移性和类别判别力。AdaIN
    [85] 结合了双层级特征对抗学习和基于自适应实例归一化的跨域特征模拟。DACNN [86] 实现了SAR域和光学域之间的物理合理适应。ADDA [28]
    将对抗判别域自适应方法扩展到了遥感目标识别的半监督设置中，利用标记和未标记数据实现对新地理区域的有效适应。CDADA [147] 通过引入双土地覆盖分类器作为判别器，鼓励生成器产生跨域对齐且远离类别边界的可迁移特征。DACNN-MME
    [148] 使用标记数据的交叉熵损失和未标记目标数据的对抗最小-最大熵损失，共同促进域不变和类别判别特征学习。SSDAN [149] 联合优化标准交叉熵损失和对抗最小-最大熵损失，该方法利用标记和未标记目标数据有效学习域不变但具有判别力的特征。SASS
    [156] 通过引入共享-私有特征解耦机制和多级特征对齐，提出了一种用于高光谱和LiDAR数据分类的半监督学习方法。该方法有效利用标记和未标记数据，在有限标注下增强分类性能。


    在像素级，特征级对抗学习主要旨在增强密集预测的一致性。MBATA-GAN [105] 提出了一种基于Transformer的框架，利用相互增强的注意力模块有效捕捉跨域语义依赖。通过结合全局注意力和增强的特征级对抗学习，它显著提高了特征的可迁移性。JDAF
    [107] 联合对齐边缘分布和条件分布，并引入不确定性自适应学习策略以提高伪标签的可靠性并减少域差距。CSLG [108] 基于块级适应难度，从局部语义到全局结构级别逐步对齐特征。通过这种设计，它有效解决了由多样化土地覆盖和传感器变化引起的局部分布偏移和全域差距。MemoryAdaptNet
    [109] 结合输出空间对抗学习和类别感知不变特征记忆模块来桥接域差距并增强特征一致性，在多个跨域任务中取得了卓越的性能。De-GLSNG [110] 通过利用多尺度高低频分解和全局-局部代表性对抗学习来增强遥感中的语义分割，以改善域不变表示学习和跨域泛化。RCA-DD
    [111] 提出了区域和类别自适应域泛化方法，其中包含基于熵的区域注意力模块和类别清晰模块。该方法专注于难以对齐的区域，并在训练过程中选择性地更新类别分布。MIDANet
    [112] 采用多任务学习和基于熵的对抗训练，利用语义分割和海拔估计来提取域不变特征并增强泛化能力，无需目标域标签。MMDANet [119] 通过通过多补丁分支和多任务解码器集成DSM数据，改善了基于UDA的高分辨率遥感图像语义分割，并进一步使用特征级对抗学习对齐源域和目标域，通过高度感知融合细化实现更丰富的表示和更好的分割。HighDan
    [122] 通过组合多分辨率融合和针对多模态遥感数据（高光谱、多光谱、SAR）的对抗学习，增强跨城市分割的可迁移性。


    在实例级，特征级对抗学习主要促进特征对齐，以实现跨域更准确的目标定位和识别。IDA [128] 通过新设计的损失函数强制执行预测一致性来解决域偏移问题。通过对齐图像和实例两个层面的语义信息，它增强了特征判别力并降低了负迁移的风险，理论分析支持了其收敛特性。DFD-TCAT
    [129] 利用动态特征判别和中心感知校准来缓解由不同SAR传感器散射差异引起的边界框回归错误和特征错位。通过利用双向特征聚合和中心性引导对齐，该方法增强了跨域条件下的检测鲁棒性。FACL
    [130] 将对抗学习与专门的注意力和补偿模块相结合。对抗学习注意力（ALA）使用基于熵的加权实现精确的实例级和像素级对齐，而补偿损失模块（CLM）强制执行跨域原型特征一致性以提高检测精度。为了解决跨域特征不兼容性，PDSR
    [131] 通过逐块通道重计算捕捉域特定特征，并利用动态加权原型对齐（DWPA）以缓解早期训练中噪声伪标签的影响。RIRA [132] 框架通过关系感知图引入图像级和原型级特征对齐，以及旋转不变正则化器，有效提高了跨域检测鲁棒性。FADA
    [133] 通过基于对抗的前景对齐集成对抗训练（AT），并进一步通过基于原型的混淆特征对齐优化域泛化。RFA-Net [134] 引入了一个结合数据级增强、稀疏特征重建和伪标签生成的统一框架。该设计增强了实例级对齐，同时减少了无监督域自适应场景中背景噪声的影响。APA
