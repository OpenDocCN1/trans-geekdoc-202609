    ## 3) 不同监督范式的数学定义


    如图 3 所示，DA-RS 方法主要包含三种监督范式。


    ### 遥感中的无监督域适应（“UDA-RS”）


    无监督域适应（UDA）是遥感领域一个显著且应用广泛的范式。一般而言，UDA 表示目标图像的标签不可用，但这些目标图像仍可以被纳入训练阶段。在数学上，在公式
    2 中，每个目标样本 $(\boldsymbol{y}_T^{i,j})$ 被标记为“None”，其形式化定义见公式 13。在此设定下，$\boldsymbol{y}_T$
    在公式 4、公式 6 和公式 9 中所示的每个任务的损失函数中被表示为空集。


    $$

    \boldsymbol{y}_T = \emptyset, \quad \forall i \in[1, N_T], j \in[1, K_T^{i, j}],
    y_T^{i, j} \rightarrow None \tag{13}

    $$


    狭义定义下，UDA-RS 指的是一种典型的单源单目标遥感任务，其中 $N_S=1, N_T=1$。显然，该范式中所利用的方法旨在解决标注的目标域样本可用性问题不足带来的限制，以及解决高昂的标注成本问题。


    ### 遥感中的半监督域适应（“SSDA-RS”）


    半监督域适应（SSDA）是遥感领域的另一个热点话题，其目标是通过标注少量目标域样本来提高泛化性能。如公式 2 所示，目标数据集的每个子集 $(D_T^{i,j})$
    包含有标签和无标签样本，其中无标签样本的数量 $(K_{T-u}^{j})$ 远大于有标签样本的数量 $(K_{T-l}^{j})$。该范式可形式化为公式
    14。


    $$

    \mathcal{D}_{T}^{j}=\left(\left\{\boldsymbol{x}_{T-l}^{i, l}\right\}_{l=1}^{K_{T-l}^{j}}
    \cup\left\{\left(\boldsymbol{x}_{T-u}^{i, j}, \boldsymbol{y}_T^{i, j}\right)\right\}_{u=1}^{K_{T-u}^{j}}\right)
    \tag{14}

    $$


    其中 $K_{T-l}^{j}+K_{T-u}^{j}=K_T^{j}$ 且 $K_{T-l}^{j} \ll K_{T-u}^{j}$。与 UDA-RS
    类似，现有的 SSDA-RS 方法主要也采用单源单目标输入模式。与 UDA-RS 相比，SSDA-RS 强调在有限有标签样本中挖掘信息，同时最大限度地利用无标签样本。


    ### 遥感中的有监督域适应（“SDA(微调)-RS”）


    有监督域适应（SDA）假设两个域都有可用的有标签样本。SDA 方法关注那些有标签的目标域样本数量少于源域可用样本的挑战性情况 [52]。在这种条件下，合理利用源域信息以及针对目标域的微调技术对于解决目标问题至关重要。在数学上，该范式可以表示为
    $\sum_{i=1}^{N_T} K_T^{i} \ll \sum_{i=1}^{N_S} K_S^{i}$。


    在遥感场景中，获取来自卫星和无人机等多种传感器的数据相对简单，导致来自不同域的数据供应丰富。然而，由于地理土地覆盖范围广阔，高昂的标注成本这一挑战变得更加突出。因此，UDA-RS
    和 SSDA-RS 范式更符合实际需求。


    ![](img/6f3fe8f45739aa0bcfea4346d3596801_5_0.png)


    ## 4) 典型算法的数学定义


    如图 3 所示，DA-RS 方法主要由五类典型算法组成。


    ### 基于分布测量的方法


    基于分布测量的方法主要旨在匹配不同域隐藏特征之间的分布。如图 5 和公式 15 所示，常见的操作是将适应度量指标（例如，最大均值差异，MMD）嵌入到神经网络中。


    $$

    \mathcal{MMD}(D_S, D_T) = ||\frac{1}{N_S}\sum_{i=1}^{N_S} E(\boldsymbol{x}_S^{i})
    - \frac{1}{N_T}\sum_{j=1}^{N_T} E(\boldsymbol{x}_T^{j})||_2 \tag{15}

    $$


    DAN [55] 是利用深度卷积神经网络在 UDA 任务中跨域学习可迁移隐藏特征的开创者。它嵌入了用于适应的 MMD 度量指标。继 DAN 之后，许多 DA-RS
    任务采用 MMD 来测量属于不同域的图像中间特征图之间的分布。


    ### 基于对抗学习的方法


    对抗学习在 DA-RS 方法中经常被使用，主要包含两种类型：图像级和特征级对抗学习方法。这两种典型对抗学习范式的示意图如图 6 所示。


    图像级对抗学习方法利用图像泛化技术，如图像翻译 [56]、[57]，以同步源图像和目标图像之间的数据分布。这些方法首先应用图像级适应，随后使用跨域合成数据训练模型。如图
    1 (a) 所示，$G_{S \rightarrow T}$ 和 $G_{T \rightarrow S}$ 分别负责将源域图像适应到目标域，反之亦然。同时，$D_S$
    和 $D_T$ 的作用是区分真实的源数据和生成器产生的虚假数据。为了优化，采用了对抗损失，其形式化定义见公式 16。


    $$

    \begin{cases}

    \mathcal{L}_{adv}(G_{S \rightarrow T}, D_T) = \mathbb{E}_{x_T \sim X_T}[\log(D_T(\boldsymbol{x}_{T}))]
    + \mathbb{E}_{x_S \sim X_S}[\log(1-D_T(G_{S \rightarrow T}(\boldsymbol{x}_S)))]
    \\

    \mathcal{L}_{adv}(G_{T \rightarrow S}, D_S) = \mathbb{E}_{x_S \sim X_S}[\log(D_S(\boldsymbol{x}_{S}))]
    + \mathbb{E}_{x_T \sim X_T}[\log(1-D_S(G_{T \rightarrow S}(\boldsymbol{x}_T)))]

    \end{cases} \tag{16}

    $$


    ![](img/6f3fe8f45739aa0bcfea4346d3596801_6_0.png)


    图 6: 常用对抗学习范式的示意图。$\{G_{S \rightarrow T}, G_{T \rightarrow S}\}$ 和 $\{D_S, D_T,
    D_F, D_P\}$ 分别表示生成器和判别器。$E$ 和 $\{f_S, f_T\}$ 分别表示编码器和特征映射模块。


    为了优化 $G_{S \rightarrow T}$ 和 $G_{T \rightarrow S}$，采用“极小极大”准则，其表达式见公式 17。


    $$

    \begin{cases}

    \min_{G_{S \rightarrow T}} \max_{D_T} \mathcal{L}_{adv}(G_{S \rightarrow T}, D_T)
    \\

    \min_{G_{T \rightarrow S}} \max_{D_S} \mathcal{L}_{adv}(G_{T \rightarrow S}, D_S)

    \end{cases} \tag{17}

    $$


    在此范式中，重构损失（$\mathcal{L}_{rec}$）或循环一致性损失始终与对抗损失一起使用。其公式表述见公式 18。


    $$

    \begin{split}

    \mathcal{L}_{rec}(G_{S \rightarrow T}, G_{T \rightarrow S}) = & \mathbb{E}_{x_T
    \sim X_T}[\|G_{S \rightarrow T} G_{T \rightarrow S}(\boldsymbol{x}_T) - \boldsymbol{x}_T\|_a]
    \\

    & + \mathbb{E}_{x_S \sim X_S}[\|G_{T \rightarrow S} G_{S \rightarrow T}(\boldsymbol{x}_S)
    - \boldsymbol{x}_S\|_a]

    \end{split} \tag{18}

    $$


    其中 $\|\cdot\|_a$ 表示 $L_a$ 范数，用作损失函数。在常用的范数中，$L1$ 范数和 $L2$ 范数尤为普遍。该损失函数旨在鼓励在风格迁移过程中保持结构特性。


    特征级对抗学习方法深入挖掘源风格特征和目标风格特征之间共享的域不变特征。这些方法利用特征级对齐策略来解决域偏移问题。通常，判别器被集成到网络中，以确保在中间特征图或输出后验概率上的一致性对齐。


    如图 6 (b) 所示，$E$ 用于特征提取，在大多数场景下它们共享权重。$f_S$ 和 $f_T$ 用于将提取的特征转换为预测值。这些模块的设计，以及它们是否共享权重，可能因具体的
    DA-RS 任务而异。为了优化框架，特征级对抗损失可以用公式 19 和公式 20 表示。


    $$

    \mathcal{L}_{adv}(E, D_F) = \mathbb{E}_{x_S \sim X_S}[\log(D_F(E(\boldsymbol{x}_S)))]
    + \mathbb{E}_{x_T \sim X_T}[\log(1 - D_F(E(\boldsymbol{x}_T)))] \tag{19}

    $$


    $$

    \begin{split}

    \mathcal{L}_{adv}(E, f_S, f_T, D_P) = & \mathbb{E}_{x_S \sim X_S}[\log(D_P(f_S(E(\boldsymbol{x}_S))))]
    \\

    & + \mathbb{E}_{x_T \sim X_T}[\log(1 - D_P(f_T(E(\boldsymbol{x}_T))))]

    \end{split} \tag{20}

    $$


    类似于图像级对抗学习的优化过程（公式 17），“极小极大”准则也被用于优化损失函数，如公式 21 所示。


    $$

    \begin{cases}

    \min_g \max_{D_K} \mathcal{L}_{adv}(E, D_F) \\

    \min_{\{E, f_S, f_T\}} \max_p \mathcal{L}_{adv}(E, f_S, f_T, D_P)

    \end{cases} \tag{21}

    $$


    ### 基于自训练的方法


    作为一种非对抗性的 UDA 范式，自训练在 DA-RS 任务中吸引了许多关注。该算法通过生成可靠、一致且类别平衡的伪标签来促进适应能力。通过利用源自目标域的高质量伪真值对模型进行监督，模型可以快速适应目标图像。


    自训练机制主要包含两个过程。第一个过程涉及更新阶段，其中指数移动平均（EMA）技术通常应用于原始网络，称为学生网络。一旦完成 EMA 更新过程，生成的网络作为
    EMA 教师发挥作用。具体而言，在每次训练步骤 $t$ 中，EMA 教师的权重通过 EMA 运算由学生网络的权重更新，其公式表达见公式 22。


    $$

    \phi_t = \alpha \phi_{t-1} + (1 - \alpha) \theta_t \tag{22}

    $$


    其中 $\alpha$ 代表 EMA 衰减因子，控制更新速率。$\phi_t$ 表示第 $t^{th}$ 步时 EMA 教师的权重。$\theta_t$ 表示同一
    $t^{th}$ 步时学生网络的权重。


    在更新教师网络的权重后，第二个过程涉及为目标图像生成伪标签并利用这些伪标签进行监督。对于具体的 DA-RS 任务，输入图像被馈送到教师


