    **BLU 数据集** [239] 由北京二号卫星采集，地面采样距离 (GSD) 为 0.8 m。它为北京多样化的城市和农村场景中的 6 个土地利用类别提供细粒度的像素级注释。该数据集由
    4 个大型高分辨率瓦片组成（每个 15680 × 15680 像素），裁剪为 256 个子图像，并以非重叠分割的方式用于训练、验证和测试。


    **OpenEarthMap 数据集** [240] 是一个综合性的全球数据集，旨在用于高分辨率土地覆盖制图，包含来自 44 个国家 97 个区域多样的航空和卫星影像。它提供
