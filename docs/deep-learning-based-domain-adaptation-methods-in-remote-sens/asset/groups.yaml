    遥感中的半监督域适应旨在将知识从标记的源域转移到部分标记的目标域，在适应新的地理区域或传感器类型时减少标注成本。一些方法专注于分类任务 [20], [28],
    [146]–[156]，而其他方法则针对语义分割 [157]–[160] 或目标检测 [161]–[167]，在 SSDA 范式下解决不同的遥感任务。


