    \ $AP_i/mAP$、$AR_i/mAR$ 和 $F_1/mF_1$-score 进行评估。对于每个类别 $i$，平均精度（Average Precision,\
    \ $AP_i$）定义为精度-召回率曲线下的面积，而平均精度均值（Mean Average Precision, $mAP$）是所有类别 $AP_i$ 的平均值。平均召回率（Average\
    \ Recall, $AR_i$）反映正确检测对象的比例，$mAR$ 是其在各类别上的均值。$F_1$-score 定义为 $2 \\times \\frac{Precision\
    \ \\times Recall}{Precision + Recall}$，$mF_1$-score 表示其在各类别上的均值。在本综述中，采用 $mAP@50$\
    \ ($mAP_{50}$) 作为主要评估指标，因为它被大多数现有方法所使用。\n\n我们选择表 VII 中的数据集，系统地报告 UDA-RS$^\\text{Det}$\
