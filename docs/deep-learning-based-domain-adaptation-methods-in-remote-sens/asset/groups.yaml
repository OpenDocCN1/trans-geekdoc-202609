    [178] 探索了遥感中大型预训练基础变换器模型的高效适应策略。旨在克服预训练和下游任务之间的分布差距，同时避免全训练的高昂成本。CrossEarth [180]
    首次提出针对遥感语义分割领域泛化的基础模型。


    总体而言，遥感中的域适应已从传统的浅层方法演变为基于深度学习的框架，现在正朝着由基础模型驱动的方向发展。沿着这一轨迹，出现了一些代表性的范式。基于分布测量的方法通过对齐统计分布来缩小领域差距，为早期的域适应研究奠定了基础。基于对抗学习的方法利用领域判别器进行全局对齐，在处理具有粗糙领域偏移的分类任务中特别有效。基于自训练的方法利用伪标签进行渐进式适应，在密集预测任务（如分割和检测）中证明特别强大。集成训练方法结合对齐、自训练以及对比学习或风格迁移等辅助技术，以实现更鲁棒的语义一致性。最近，基于大型视觉模型的方法正在
    gaining 势头，将预训练的基础模型适应到遥感任务，开启了具有可迁移性和开放词汇能力的新范式。


