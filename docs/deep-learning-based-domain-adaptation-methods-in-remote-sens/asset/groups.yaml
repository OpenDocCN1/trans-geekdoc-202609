    \ positive, and false negative, respectively. $mIoU$ is the average across all\
    \ classes. The F1-score is defined as $2 \\times Precision \\times Recall/(Precision\
    \ + Recall)$, and mF-score is its mean over all classes. To ensure fair and consistent\
    \ comparison across methods, this survey primarily reports results using mIoU\
    \ as the main evaluation metric.\n\nAs previously noted, most recent DA-RSseg\
    \ methods focus on HR aerial and satellite optical images. In this survey, we\
