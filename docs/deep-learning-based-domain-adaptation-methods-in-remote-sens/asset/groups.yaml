    **杭州-上海数据集 [227]** 由 2002 年的 EO-1 Hyperion 传感器获取，预处理后各保留 198 个光谱波段。两个数据集均覆盖城市和农村区域，包含
    3 个标注土地覆盖类别。杭州-上海数据集由于具有相似的地理场景组成，常用于域适应。


    **航空影像数据集（AID）[1]** 包含 30 个场景类别和总共 10,000 张大规模 RGB 图像，每张大小为 600 × 600 像素。每个类别的图像数量从
    220 到 420 不等。空间分辨率在 0.5 到 8 米之间变化。


    **NWP-UE-REISSC45 数据集 [2]** 包含 45 个场景类别中的 31,500 张 RGB 图像，大小为 256 × 256 像素。每个类别包含
    700 个样本。空间分辨率跨度广泛，从 0.2 到 30 米。


    **UC-Merced 数据集 [229]** 包含 2,100 张 RGB 图像，均匀分布在 21 个场景类别中，每个类别包含 100 张图像。所有图像的空间分辨率为
    0.3 米，固定大小为 256 × 256 像素。


    **WHU-RS19 数据集 [230]、[231]** 包括 1,005 张高分辨率场景图像，分为 19 个语义类别。每个类别由大约 50 到 70 个样本表示，所有图像大小统一为
    600 × 600 像素。


    **RSSCN7 数据集 [232]** 由 7 个类别中的 2,800 张图像组成。图像大小为 400 × 400 像素，来源于 Google Earth，具有不同的季节和光照条件。


    **PattersonNet 数据集 [233]** 是一个为图像检索设计的大规模遥感数据集，包含 30,400 张图像

