    focusses primarily on adapting models across high-resolution (HR) aerial and satellite
    optical images [33], [44]–[46], [100]–[120], addressing domain shifts caused by
    geographic or acquisition differences. Some methods [121]–[124] also aim to bridge
    modality gaps for cross-domain segmentation on multispectral or SAR imagery, addressing
    challenges such as variations in texture, resolution, and spectral characteristics.


