    ## 图 7：跨不同标签空间的域适应范式示意图。


    在遥感领域，针对 PDA [78]、[206]，OS-DA [86]、[207]–[215]，UniDA [89]、[216]–[219] 以及 SF-UniDA
    [77]、[220]、[221] 的挑战，近期取得了诸多进展。


    **PDA 遥感方法。** PDA [78] 首次尝试解决遥感场景分类中的部分域适应问题，其中源标签空间包含目标标签空间。引入了渐进辅助域模块、多权重对抗学习和注意力熵正则化，以减轻负迁移并提高适应性能。PDANN
    [206] 设计了部分域对抗神经网络，以解决作物产量预测中的域偏移和标签空间不匹配问题，通过在域对齐期间降低异常源样本的权重来提高可转移性。


    **OS-DA 遥感方法。** OSDANet [207] 通过利用特征生成器和分类器之间的对抗学习来解决遥感图像场景分类中的开集域适应问题，以区分共享类别并拒绝未知目标样本。ODA-SAR
    [208] 提出了一种适用于开集条件 SAR 图像分类的球面空间域适应网络，其中特征被映射到超球面上以增强类间可分离性。OSDA-ETD [209] 联合探索可转移性以减少域间和类内差异，同时通过判别性增强类间可分离性，从而有效解决遥感图像中未见类别和强类间相似性的挑战。SSOUDA
    [210] 通过结合对比自监督学习和一致性自训练，解决光学遥感中的开集无监督域适应问题，实现判别性目标特征和可靠未知类别样本的提取。


    DST [86] 是一种旨在解决异构 SAR 图像分类中开集 UDA 挑战的新方法。所提出的框架能够自适应地区分未知目标类别和已知类别，从而实现更鲁棒的跨域识别。IAFAAN
    [211] 采用基于实例亲和力的机制来分离未知样本，并使用样本判别性损失来增强类间分离，同时一种新颖的 Mask-MMD 指标确保已知类别的精确对齐，而不会造成未知类别的负迁移。MAOSDAN
    [212] 增强了模型在具有部分重叠标签空间的复杂真实场景中的鲁棒性。它集成了注意力感知反向传播、辅助对抗学习和自适应熵抑制，以有效分离已知和未知目标类别，同时减轻负迁移。OSDA-ST
    [213] 引入了最大 Logit 分数阈值化和动态源选择来估计未知类别。PUMCL [214] 通过对齐特征和完善伪标签，有效处理未知类别并提高跨域泛化能力。DFEIN
    [215] 通过利用与已知类别的样本相似度来增强未见类别的检测，联合捕捉局部判别模式/global 语义相关性。


    **UniDA 遥感方法。** C³DA [89] 提出了一种用于遥感场景识别的通用域适应方法，引入了一个新的 "C³" 标准，该标准集成了置信度、一致性和中心性，以有效识别未知类别。通过优化损失函数设计，它提高了训练效率并增强了在多样化
    DA 场景中的适应性。HyUniDA [216]、[218] 消除对先验标签空间知识的依赖。它有效识别共享类别并估计目标域结构，从而实现在多样化 HSI 域之间的鲁棒知识迁移。SPOT
    [217] 利用非平衡最优传输和样本互补机制来有效区分共享类别和私有类别。通过增强类间可分离性和类内紧凑性，它在复杂域偏移下实现了更高的准确性和鲁棒性。DCMix
    [219] 集成了闭集和开集分类器以及特征混叠策略，增强了目标域泛化能力，并实现了更鲁棒的跨域迁移。


    **SF-UniDA 遥感方法。** SDG-UniDA [220] 首先从预训练模型生成合成源数据，然后使用可转移权重机制进行适应，以区分共享类别和未知类别。SDG-MA
    [77] 提出了一种无需标签集先验知识的 UniDA 框架，用于遥感图像场景分类。通过从预训练模型合成源数据并引入可转移权重，该方法在目标域中有效识别共享类别并检测未知类别。OKRA
    [221] 采用邻域相似度进行知识蒸馏，并利用基于能量的不确定性建模来有效区分已知和未知目标样本，无需源数据或人工阈值设定。


    ### 2) DA-RSCD


    如前所述，DA-RSCD 任务与 DA-RSCIs、DS-RSSEG 和 DA-RSEND 的不同之处在于，域偏移发生在成对图像内部，而非独立的域（源域和目标域）之间。


    DA-RSCD 任务，也称为跨域变化检测（CCD），专注于检测从不同传感器获取或在不同成像条件下获取的遥感图像对中的变化。*Chen et al*. [222]
    提供了 DA-RSCD 的首次系统性综述。该综述检查了这一研究方向的关键组成部分，包括图像预处理、特征表示和变化检测策略，同时识别了当前的挑战和未来的研究途径。*Cheng
    et al*. [223] 也调查了变化检测任务领域的域适应问题。


    # IV. 基准性能


    在本节中，我们首先介绍 DA-RS 领域中常用的主要数据集。然后，我们展示了在这些主要数据集上评估的最先进方法。值得注意的是，我们的重点是那些在对比分析中广泛采用的代表性算法。


    ## A. DA-RS 的基准数据集


    如表 V、表 VI、表 VII 所示，我们将总结 DA-RS 研究中广泛使用的主要基准数据集。这些数据集旨在支持各种域适应任务，包括 DA-RSCIs、DA-RSSeg
    和 DA-RSCD。对于每个数据集，我们强调其成像模式、特征以及评估适用性。


    ### 1) DA-RSCIs 的基准数据集


    对于 DA-RSCIs，基准数据集（表 V）涵盖高光谱（HSI）、光学和 SAR 图像，反映了该任务的全局分类特征。这种多样性捕捉了不同的光谱、空间和模态特征，为评估域适应方法提供了全面的基础。


    **休斯顿数据集（Houston2013 [224]，Houston2018 [225]）** 由 2013 年和 2018 年使用不同传感器在休斯顿大学区域采集的高光谱图像组成。经过光谱和空间对齐后，从
    Houston2013 场景中提取了一个大小为 209 × 955、包含 48 个光谱波段和 7 个一致土地覆盖类别的共享区域，以对应 Houston2018
    场景。


    **帕维亚大学和帕维亚中心数据集（PU 和 PC）** 由 ROSIS 传感器在意大利北部帕维亚的飞行活动中获取。PC 的光谱波段数为 102，PU 为 103。两个数据集均包含
    9 个类别，但它们的类别定义不完全相同。为了域适应实验，仅选择两个数据集之间共享的 7 个类别以确保标签一致性。


    **博茨瓦纳数据集（5 月、6 月和 7 月）¹** 由 NASA EO-1 Hyperion 传感器在 2001 年 5 月、6 月和 7 月在博茨瓦纳的奥卡万戈三角洲拍摄的三幅多时相高光谱图像组成。每幅图像包含
    9 个标注类别，具有 242 个光谱波段，覆盖 357–2576 nm 范围，光谱分辨率为 10 m，空间分辨率为 30 m。在移除未校准和有噪声波段后，保留
    145 个波段用于实验。


    **HyRANK 数据集² [226]** 由 HyPerion 传感器（EO-1, USGS）获取的卫星高光谱影像组成，包含 176 个光谱波段。数据集包括两个标注场景，Dionio
    和 Loukia。两个场景共享 12 个一致的土地覆盖类别。


    **KSC（肯尼迪航天中心）数据集³** 由 AVIRIS 传感器采集，具有 224 个光谱波段和 18 m 的空间分辨率。在移除有噪声和水吸收波段后，剩余
    176 个波段供使用。它包含两个空间上不重叠的子集，共享 10 个共同类别。这两个子集通常用作域适应实验中的源域和目标域。


    **Indian Pines 数据集 [228]** 由 NASA 的 AVIRIS 传感器收集。原始数据集由 224 个波段组成。经过预处理后，数据包含
    200 个光谱波段，覆盖 3 平方公里区域，空间分辨率为 20 米。为了模拟域适应任务，每幅高光谱图像通过分组其光谱波段分为两部分。一个子集被指定为源域，另一个作为目标域，模拟从具有不同光谱覆盖范围的传感器获取的数据。


    **Salines 数据集⁴** 由 AVIRIS 传感器获取。在移除 20 个水吸收波段后，数据集包含 204 个光谱波段，分辨率为 3.7 米，包含 16
