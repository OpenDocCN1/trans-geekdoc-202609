    Based on experimental results and previous reviews, our analysis is as follows.
    Current UDA-RS Det methods mostly use hybrid strategies, with self-training at
    the core to gradually adapt to the target domain using high-quality pseudo-labels.
    Adversarial alignment acts as an auxiliary tool, often combined with class-wise
    constraints or contrastive learning to improve feature consistency.


    ## V. FUTURE WORKS


    In recent years, deep learning based DA-RS methods has achieved notable progress
    across classification, segmentation, detection, and change detection. Despite
    the huge progress, several challenges remain for practical deployment and further
    breakthroughs.


    **Research on Limited Computation Resources.** Most DA-RS methods rely on computationally
    demanding deep models, which restricts their use in real-world platforms such
    as satellites, UAVs, and edge devices. Future work should focus on lightweight
    architectures, efficient optimization, and model compression techniques to balance
    performance with practical deployment.


    **Extension to Multiple-Source/Target Settings.** Most DA-RS methods focus on
    a single-source to single-target source, and only a few consider the issue concerning
    multi-source or multi-target. In practice, applications always face diverse domains
    with different conditions. Extending DA-RS to multi-source and multi-target settings
    can improve scalability and robustness, which requires new strategies for domain
    fusion and adaptive generalization.


    **Further Exploration on Transformer Structure.** Transformers have achieved success
    in vision and multimodal learning, but their potential in DA-RS remains underexplored.
    Future methods should investigate how attention mechanisms and hierarchical representations
    can capture cross-domain invariants, improve semantic consistency, and enhance
    adaptability across tasks.


    **Exploration on Foundation Model Paradigm.** Most foundation models are built
    on transformer architectures, their emergence brings new opportunities for DA-RS.
    Leveraging vision or vision-language foundation models and adapting them to remote
    sensing tasks can bring new advantages. They may provide stronger cross-domain
    generalization, support open-vocabulary recognition, and enable task transferability.
    Together, these advances point to a new paradigm for domain adaptation research.


    This survey provides a comprehensive survey of the recent advancements of deep
    learning based domain adaptation methods in remote sensing, which have rapidly
    evolved in recent years. We review existing related methods through a unified
    perspective that considers task categorization, input mode, supervision paradigm,
    and algorithmic granularity, thereby offering a systematic understanding of the
    field. Moreover, we summarize benchmarking efforts including widely used datasets
    and performance evaluations of state-of-the-art methods. Finally, the discussion
    of future research directions has outlined promising avenues for further exploration.
    We hope this survey helps advance the understanding of domain adaptation in remote
    sensing and serves as a reference to support and guide future research.


