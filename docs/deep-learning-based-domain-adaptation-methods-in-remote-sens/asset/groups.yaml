    Semi-supervised domain adaptation in remote sensing aims to transfer knowledge
    from a labeled source domain to a partially labeled target domain, reducing annotation
    costs while adapting to new geographic regions or sensor types. Some methods focus
    on classification tasks [20], [28], [146]–[156], while others target semantic
    segmentation [157]–[160] or object detection [161]–[167], addressing different
    remote sensing tasks under the SSDA paradigm.


