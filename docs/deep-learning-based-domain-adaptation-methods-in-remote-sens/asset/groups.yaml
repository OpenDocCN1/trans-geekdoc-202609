    # 3) Mathematical Definitions for Different Supervision Paradigms: As shown in
    Fig. 3, there are mainly three supervision paradigms in the DA-RS methods.


    # **Unsupervised domain adaptation in remote sensing (“UDA-RS”)**. UDA is a notable
    and widely-applied paradigm in realm of remote sensing. In general terms, UDA
    indicates that the labels of target images are unavailable, yet these target images
    can still be incorporated into the training phase. Mathematically, in Eq. 2, each
    target sample $(\boldsymbol{y}_T^{i,j})$ is denoted as “None”, formulated in Eq.
