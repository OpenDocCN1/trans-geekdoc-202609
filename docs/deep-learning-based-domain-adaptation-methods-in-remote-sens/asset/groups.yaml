    them based on four perspectives: task categorization, input mode, supervision
    paradigm and algorithm granularity. The specific methodology taxonomy is shown
    in Fig. 3.


    Tab. I shows the preliminary mathematical notations. For the four tasks focused
    in this survey (Fig. 3), existing methods always construct a model, optimize it
    using the training set ($\mathcal{D}_{train}$) and evaluate its performance on
    the testing set ($\mathcal{D}_{test}$). These training and testing partitions
    from a comprehensive dataset ($\mathcal{D}$ = $\mathcal{D}_{train}$ $\cup$ $\mathcal{D}_{test}$).
    Therefore, despite potential disparities in data distribution existing between
    the training and testing datasets, we still treat them as samples from the same
    domain. When domain adaptation is integrated into the previously mentioned four
    tasks, the problem definition will undergo a significant change.


    For domain adaptation remote sensing (DA-RS) tasks, it always encounters source
    dataset ($\mathcal{D}_{S}$) and target dataset ($\mathcal{D}_{T}$). If the category
    sets of source and target dataset are respectively denoted as $\mathcal{C}_{S}$,
    $\mathcal{C}_{T}$, two sets have same number of categories ($N_{\mathcal{C}_{S}}$
    = $N_{\mathcal{C}_{T}}$) in general terms.


    ```

    $\mathcal{D}_{S}$ = {$\mathcal{D}_{S}^{i}$}$^{N_{S}}_{i=1}$, $\mathcal{D}_{T}$
    = {$\mathcal{D}_{T}^{i}$}$^{N_{T}}_{i=1}$ (1)

    ```


    The $i^{th}$ sub-set of source and target dataset respectively contain $K_{S}^{i}$
    and $K_{T}^{i}$ samples, where $K_{S}^{i}$ $\ge$ 0 and $K_{T}^{i}$ $\ge$ 0. This
    process can be formulated in Eq. 2.


    ```

    $\mathcal{D}_{S}^{i}$ = {($\mathbf{x}_{S}^{i,j}$, $\mathbf{y}_{S}^{i,j}$)}^{K_{S}^{i}}_{j=1}$,
    $\mathcal{D}_{T}^{i}$ = {($\mathbf{x}_{T}^{i,j}$, $\mathbf{y}_{T}^{i,j}$)}^{K_{T}^{i}}_{j=1}$
    (2)

    ```


    To optimize a model for DA-RS tasks, $\mathcal{D}_{T}$ is divided into training
    and testing sub-sets ($\mathcal{D}_{T-train}$, $\mathcal{D}_{T-test}$), where
    $\mathcal{D}_{T}$ = $\mathcal{D}_{T-train}$ $\cup$ $\mathcal{D}_{T-test}$. Consequently,
    for a given DA-RS task, the training dataset encompasses both the source dataset
    $\mathcal{D}_{S}$ and the training subset of the target dataset ($\mathcal{D}_{T-train}$),
    while the testing dataset $\mathcal{D}_{test}$ consists solely of $\mathcal{D}_{T-test}$.
    It means that both $\mathcal{D}_{S}$ and a portion of $\mathcal{D}_{T}$ will be
    leveraged during the training phase. It is worthy of noting that the proportion
    of $\mathcal{D}_{T}$ in the training phase may be 0, implying that the target
    dataset will not be used for training purposes in certain cases.


