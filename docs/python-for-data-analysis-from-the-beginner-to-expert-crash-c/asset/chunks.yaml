- raw: 'Welcome to the Python advanced course! We have spent some time in the previous
    chapters looking at some of the basics that allow you to do some great stuff with
    Python and get some familiarity with this kind of language, and now it is time
    to take it to the next level. In this chapter, we are going to spend some time
    taking a look at some more advanced features of writing codes in Python, and options
    that you are going to use more as you advance your skills more and more. In this
    case, we are going to talk about how to write out inheritances and how to handle
    and raise your own exceptions. Let’s take a look at how these two topics work
    so we can get started with them right away! Writing Your Own Inheritances Now
    that we are spending some time working on a more advanced course in Python, it
    is time to start out with a bit of work with the Python inheritance. These inheritances
    are going to be important because they allow the programmer to write out a lot
    of complex code, without having to go through and type this outline by line again.
    This will help to keep the code looking nice and organized, can save some time
    and will still ensure the code works the way that you would like. To help us make
    sure that the inheritance is going to work the way that we would like within the
    code, we must remember how it works. With this, an inheritance is a process of
    taking the original code, which will be the base or the parent code, and then
    we are able to copy it down later in the code to make the derived or the child
    code. These derived codes are going to be adjustable, so you can add or take away
    parts from them, without having any negative effects on the original parent code.
    You are also able to choose whether to just make one derived class, or make a
    family tree of sorts and keep going down and reusing the code as much as you would
    like. Working with an inheritance in Python is actually a lot easier to work with
    than it may sound in the beginning. You are able to go through this and add or
    take away as much information as we would like in the code to ensure that it works
    the way that we want. To get an idea of how to work with these inheritances, and
    what they are able to do for us, we can work with the following example: #Example
    of inheritance #base class class Student(object): ​ def\_\_init\_\_(self, name,
    rollno): ​ self.name = name ​ self.rollno = rollno #Graduate class inherits or
    derived from Student class class GraduateStudent(Student): ​ def\_\_init\_\_(self,
    name, rollno, graduate): ​ Student\_\_init\_\_(self, name, rollno) ​ self.graduate
    = graduate def DisplayGraduateStudent(self): ​ print”Student Name:,” self.name)
    ​ print(“Student Rollno:,” self.rollno) ​ print(“Study Group:,” self.graduate)
    #Post Graduate class inherits from Student class class PostGraduate(Student):
    ​ def\_\_init\_\_(self, name, rollno, postgrad): ​ Student\_\_init\_\_(self, name,
    rollno) ​ self.postgrad = postgrad ​ def DisplayPostGraduateStudent(self): ​ print(“Student
    Name:,” self.name) ​ print(“Student Rollno:,” self.rollno) ​ print(“Study Group:,”
    self.postgrad) #instantiate from Graduate and PostGraduate classes ​ objGradStudent
    = GraduateStudent(“Mainu,” 1, “MS-Mathematics”) ​ objPostGradStudent = PostGraduate(“Shainu,”
    2, “MS-CS”) ​ objPostGradStudent.DisplayPostGraduateStudent() When you type this
    into your interpreter, you are going to get the results: (‘Student Name:,’ ‘Mainu’)
    (‘Student Rollno:,’ 1) (‘Student Group:,’ ‘MSC-Mathematics’) (‘Student Name:,’
    ‘Shainu’) (‘Student Rollno:,’ 2) (‘Student Group:,’ ‘MSC-CS’) Inheritances are
    nice because they are going to give us some freedom when it is time to write out
    any kind of code. If you already have a parent or a base class that you are interested
    in working with, and you would like to use as the basis of your derived class,
    this is something that we are easily able to do without having to waste time or
    space rewriting that code over and over again. With this inheritance, we are able
    to keep some of the features that we want out of that original base class, and
    then we can change up the features that are not needed, or add in some new things
    if they will make a bit more sense for the code that we are writing. And all of
    this can be done to strengthen the code that we are using, without having to worry
    about it messing with the original code that you went through and wrote out. You
    can technically go through and make as many derived classes as you want. As long
    as you keep doing them in order with each other and you use the example above
    to make your own, you can make as many of these derived classes as you would like.
    This makes things easier, limits the amount of code that you have to write out,
    and can really make things easier on you when you create a new program. Each new
    derived class will be able to take the features that it likes from its parent
    code and use them or drop them to make the code continue on and be stronger than
