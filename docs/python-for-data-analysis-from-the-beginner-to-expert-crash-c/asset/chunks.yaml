    ```\n\n在继续之前，请将此代码输入你的编译器。如果你运行这段代码，将立即在屏幕上看到结果。这将包括猫的名字是 Frisky（如果你愿意，可以将名字改为其他内容），年龄是\
    \ 5，体重是 10。这是输入代码的信息，因此编译器会将它们提取出来，给你想要的结果。你可以花些时间在代码中添加不同的选项，看看它如何随时间变化。这些类最好的部分是它们实际上并不难使用。它们将使你更容易管理所有信息并确保其井然有序，以便一切尽可能合乎逻辑。你可以创建任何你喜欢的类，并添加对你最有意义的对象，而且由于这种语言的设置方式，你知道这些部分将保持原位，绝不会四处移动。\n\
    \n## 决策控制语句的工作原理\n\n接下来我们要看的主题是**条件语句**。当你希望计算机自行做出决策时，无论你从用户那里获得什么样的输入，这些语句都很有用。有时很难弄清楚对方将向系统输入什么，使用这些决策控制语句或条件语句可以改变你处理这类事情的效果。\n\
    \n在 Python 中，我们将能够使用三种主要的条件语句。这三种类型被称为 `if` 语句、`if else` 语句和 `elif` 语句。它们都将帮助你在代码中获得良好的结果，并可用于确保你找到正确的解决方案以保持代码运行，但它们的实现方式不同。\n\
    \n在这三种条件语句中，我们将首先重点关注 `if` 语句。当我们提到 `if` 语句时，我们处理的思路是用户的回答要么是真要么是假。如果答案被视为真，那么我们将看到代码的执行过程。如果被视为假，那么我们将看到程序停止。我们已经能看到这种语句的一些问题，但它仍然是一个需要关注的重要内容，所以我们将在这里花些时间讨论它。\n\
    \n为了更好地了解这些 `if` 语句如何工作，我们可以看一下下面的语法：\n\n```python\nage = int(input(\"Enter your\
    \ age:\"))\nif (age <= 18):\n    print(\"You are not eligible for voting, try\
    \ next election!\")\nprint(\"Program ends\")\n```\n\n让我们探讨一下当你将这段代码放入程序时会发生什么。如果用户来到程序并输入他们未满\
    \ 18 岁，那么屏幕上将显示一条消息。在这种情况下，消息将显示“You are not eligible for voting, try next election!”然后程序将按原样结束。\n\
    \n但如果用户输入的年龄是 18 岁或以上，这段代码会发生什么？对于 `if` 语句，如果用户说他们的年龄超过 18 岁，什么也不会发生。`if` 语句只有一个选项，将专注于用户提供的答案是否与你在代码中设置的条件相匹配。在这种情况下，用户必须输入他们未满\
    \ 18 岁，否则你将无法让程序再次运行。\n\n现在，我们已经可以看到这种条件语句将给我们带来一些问题。你的目标是设置它，以便用户使用最适合他们和他们年龄的答案，而不是最适合程序的年龄。如果用户\
    \ 25 岁，你希望他们能够输入该数字，而系统完全没有任何问题。这是一个很好的例子，说明为什么 `if` 条件语句不会被大量使用。\n\n好消息是我们可以继续学习第二种条件语句，并用它来解决这类问题，同时仍然让程序按我们希望的方式工作。我们现在将使用\
    \ `if else` 语句。\n\n假设我们正在使用与之前相同的想法，并且我们希望确保程序无论用户给出什么输入都能产生结果。`if else` 语句将给我们一个机会，也许有一个\
    \ 18 岁以下的组，和一个 18 岁及以上的组。我们可以使用的代码类型包括：\n\n```python\nage = int(input(\"Enter\
    \ your age:\"))\nif (age <= 18):\n    print(\"You are not eligible for voting,\
    \ try next election!\")\nelse:\n    print(\"Congratulations! You are eligible\
    \ to vote. Check out your local polling station to find out more information!\"\
    )\nprint(\"Program ends\")\n```\n\n正如你所见，这确实有助于为你的代码增加更多选项，并将确保无论用户给你什么结果，你都能得到答案。你也可以更改消息以显示你想要的任何内容，但无论用户给出什么答案，都将使用相同的想法。你可以选择添加更多可能性。你不限于像上面那样的两个选项。如果这适合你的程序，那就很好用。但如果你需要使用两个以上的选项，你也可以扩展它。\n\
    \n例如，获取上面的选项并将其扩展为几个不同的年龄组。也许你想为 18 岁以下的人、18 到 30 岁之间的人以及 30 岁以上的人提供不同的选项。你可以以这种方式将其分开，当程序从用户那里得到答案时，它将执行你想要的部分。\n\
    \n另一个示例是程序要求用户选择他们最喜欢的颜色。你可以设置代码，使有六种颜色带有消息，例如红色、紫色、橙色、黄色、蓝色和绿色。用户可能会选择另一种颜色作为他们最喜欢的，但你甚至不想尝试列出世界上所有可能的颜色。因此，我们添加\
    \ `else` 语句的兜底部分来帮助解决这个问题。在这部分代码中，`else` 语句将是重要部分，因为它将捕获用户可能给出的所有其他你未在代码中列出的答案。世界上显然有数百种颜色，但你不想逐一列出它们。`else`\
    \ 语句将确保无论用户给出什么答案，计算机上仍然会显示一些内容。\n\n最后，我们需要看一下 `elif` 语句。这些与其他两种条件语句略有不同，但你会发现它们也能帮助你在代码中完成大量工作，并且它们也有助于做决策。这些将被设置为给用户一些选择。根据用户选择的答案，程序将确保显示你在程序的这一部分实现的正确结果。\n\
    \n你将在许多地方看到这些 `elif` 语句。一个选项是在游戏中。如果你曾经使用过一个程序或另一个游戏，它给了你一个菜单式的选择，那么你就已经看到了这些\
    \ `elif` 语句的实际运行。当你希望确保用户有几个选项可用时，这些语句是一个很好的起点。你可以自由地在代码中添加任意数量的这些语句，我们只需要确保将正确类型的函数也添加到组合中。\n\
    \n学习这些 `elif` 语句如何工作的最好方法是实际查看一个工作的语法。一个很好的例子，以及 `elif` 语句将如何工作，将包括：\n\n```python\n\
