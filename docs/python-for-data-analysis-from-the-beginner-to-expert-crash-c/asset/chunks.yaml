    Python 时最棒的事情之一就是它简单易用。无论你过去是否使用过编程语言，你都会发现 Python 是一个绝佳的选择。它的设计初衷是供初学者使用，并旨在帮助我们在学习过程中取得良好成果。这对我们来说是个好消息，因为它将有助于确保我们能完成编码任务，并保证我们不会在有机会入门之前就被吓退。

    *   **Python 能为我们提供强大的能力来处理所需的项目。** 你可能读了上一条提到的优势后，担心实际使用这门语言完成某些目标会有多难。但你无需担心。Python
    虽然对许多初学者来说容易上手，但当你需要用它处理任务时，它依然拥有你所寻找的强大功能。使用 Python 你能做很多事情。它能处理编码所需的一切，无论是帮你入门的基础代码，还是更难驾驭的复杂代码。Python
    都拥有处理各类编码所需的能力和扩展。

    *   **有大量库和扩展可供添加到 Python 语言中。** Python 自带的标准库非常强大，将为你提供许多在机器学习等领域想要实现的功能。这将确保我们取得惊人的成果，并能帮助处理本指南中将讨论的大量代码。然而，使用
    Python 时你会发现的一个很酷的地方是，我们还能处理所有额外的库和功能。有许多库专门用于辅助机器学习，增加处理科学、数学等所需的能力，以满足我们在数据分析和机器学习中的需求。

    *   **这门语言是数据科学和机器学习的绝佳选择。** 当需要处理机器学习和数据科学相关任务时，还有其他选择，有时它们可能表现得更好。但当你想处理这些领域的多种不同类型的流程和主题时，Python
    能帮你搞定。大多数人会很乐意用 Python 满足所有机器学习和数据分析需求。他们知道这是一门易于学习的语言，如果他们过去从未接触过编程，这很好。而它依然拥有所需的强大功能和所有额外特性，以确保算法能在你每次需要时顺利运行。无论你想在机器学习方面做什么，Python
    编程语言都能胜任。

    *   **当需要与其他编程语言搭配使用时，Python 表现良好。** 为了实现机器学习和数据分析的目标，我们需要的一些库可能要求引入另一种语言来执行代码中想要的某些功能。这是一个很好的选择，因为
    Python 能与你想用的任何其他编程语言良好配合。

    *   **Python 拥有许多不同的社区，可以帮助你在学习过程中解答大量疑问和顾虑。** 当你在弄清楚代码该怎么写时遇到问题，或者开始新项目需要帮助时，你可以求助于这些社区获取答案。无论你的编程水平如何，这个社区都能成为帮助你起步的宝贵工具。


    正如我们所见，决定使用 Python 编程语言时，有许多不同的优势可用。它是目前最好的通用语言之一，能帮助你在短时间内完成大量编码和项目的其他方面。无论你只是想学一门新编程语言，还是想完成数据分析或机器学习工作，Python
    都是帮助你起步的正确选择。


    ## Python 语言的基本组成部分


    现在我们已经花些时间了解了 Python 语言及其包含的内容，是时候直接深入学习更多关于 Python 语言的知识以及我们能用它做什么了。有许多不同的部分发挥作用，这也是一门令人兴奋的语言值得我们投入时间。了解其中一些基本部分及其如何满足你的需求，将对你从本指南后续讨论的更复杂内容中获益多少产生巨大影响。


    ### 关键字


    我们需要了解的基础第一部分是 `keywords`（关键字）。这些是保留用来告诉编译器我们想要的任何命令的部分。它们很重要，因为它们基本上是编译器需要遵循的指令。你不能在代码的任何其他地方使用它们，也不能给代码的其他部分（如
    `function` 函数或 `variable` 变量）起 `keyword` 关键字的名字，否则编译器会报错且无法按你的意愿工作。这些是给编译器的重要指令，请在尝试使用它们前记住这一点。


    ### 标识符


    列表中的下一项是 `identifiers`（标识符）。这些对代码很重要，因为它们数量众多。尽管这些 `identifiers` 有很多选择，但你会发现它们遵循相同的命名规则，这能让初学者更轻松。


    第一条要记住的规则是命名这些 `identifiers` 时。你有很多命名选项。例如，你可以在命名时同时使用大写和小写字母、任何数字以及下划线符号（`_`）。你也可以将这些任意组合。这里要记住一点：名称不能以数字开头，且书写的单词之间不应有空格。因此，你不能写
    `3words` 作为名称，但可以写 `words3` 或 `threewords`。确保不要使用我们上面讨论的 `keywords` 之一，否则会报错。


    选定 `identifier` 名称时，你可以遵循上述规则，并尝试选择一个容易记住的名字。稍后编写代码时，你需要调用它，如果起的名字难以记忆，可能会遇到问题或报错，因为东西不会按你想要的方式显示。除了这些规则外，你可以随意命名
    `identifiers`。


    ### 注释


    如果不先看看如何在 Python 中编写 `comments`（注释），我们就无法完成关于 Python 基础的话题。在编写代码时，你可能会发现有时需要在代码中留下解释或笔记。这是给你自己或与其他程序员分享看的，不需要由编译器运行，对代码运行也不是必需的。事实上，你不希望代码运行这部分内容。


    这就是 `comments` 派上用场的地方。这些 `comments` 帮助我们向可能阅读代码的人解释正在发生什么，但编译器看到它会直接跳过，完全不理会。它不会出现在你编写的任何程序中；只有实际查看你编写脚本的人才能看到。


    要编写这些 `comments`，你只需在 `comment` 前添加一个 `#` 符号，编译器就会知道应该跳过所有这些内容。作为程序员，你可以在代码中写入任意数量的注释。但通常最好将其保持在最少且最合理的范围内。这有助于始终保持你的编码整洁有序。


    ### 变量


    我们需要了解的代码下一部分是 `variables`（变量）。这些很重要，仅仅因为它们在我们编写的代码中非常常见。`variables` 之所以重要，是因为它们占据计算机内存中的空间来保存你想要的任何值。你可以通过在两者之间放置等号（`=`）轻松地将任何值赋给
    `variable`。甚至可以将两个值赋给同一个 `variable`（如果你愿意）。这些很常见，当我们浏览本指南中处理的一些代码时，你会发现随处可见这些
    `variables`。


    ### 运算符


    本节我们要看的最后一项是 `operators`（运算符）。这些将是代码中简单的部分，但学习如何使用它们依然很重要。你会发现有许多不同类型的 `operators`
    可供使用。


    你可以选择专注于 `arithmetic operators`（算术运算符），它们将帮助我们在代码中编写数学方程。这只是你能使用的一种 `operator`。还有
    `assignment operators`（赋值运算符），它们将帮助我们将选定的特定值赋给 `variable`，以便编译器在合适时刻提取它们。也可以有
    `comparison operators`（比较运算符），它们将帮助我们检查代码的不同部分，判断它们是否匹配。


    正如我们通过本节所见，Python 编程语言有许多不同的基础知识，我们只抽时间看了其中几个。在后续章节中，我们将花时间探讨借助 Python 语言能做的许多其他事情，以及如何使用它们。但我们会更进一步，让你能在短时间内开始编写自己的代码。


    '
