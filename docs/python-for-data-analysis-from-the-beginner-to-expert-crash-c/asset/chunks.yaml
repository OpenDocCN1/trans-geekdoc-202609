    \n### for 循环\n\n接下来要看的第二种循环称为 `for` 循环。它常出现在 `while` 循环适用的相同场景中，常被视为处理循环的更传统方法。这意味着如果您想保持简单，通常可以直接使用\
    \ `for` 循环而不会有任何问题。\n\n进一步说，`for` 循环的设置方式是由循环本身（而非用户输入的信息）决定何时停止。循环会按顺序遍历迭代，自动执行正确的次数。除非代码到达末尾，否则不需要外部用户或力量来控制这一切。\n\
    \n以下是实现此功能的代码示例：\n\n```python\n# Measure some strings:\nwords = ['apple', 'mango',\
    \ 'banana', 'orange']\nfor w in words:\n    print(w, len(w))\n```\n\n将上述 `for`\
    \ 循环示例添加到编译器并执行。执行时，屏幕上会按代码编写的顺序依次显示这四种水果。如果想以不同顺序显示，需回到代码中按所需顺序重写。一旦按语法写好并准备执行，就无法再更改顺序。\n\
    \n### 嵌套循环\n\n最后要介绍的循环类型是嵌套循环。它的独特之处在于会在一个循环内部运行另一个循环。两个循环都将继续其路径并持续运行，直到全部完成。这有时看似多余，但在许多编写代码的场景中却是必需的。\n\
    \n例如，您可能需要编写一个乘法表（从 1 到 10 并列出答案）。若逐行编写代码来生成此表，代码量将巨大。虽然可行，但即使是初学者也能看出这需要大量时间和精力。\n\
    \n更好的方法是使用以下代码：\n\n```python\n# write a multiplication table from 1 to 10\nfor\
    \ x in range(1, 11):\n    for y in range(1, 11):\n        print('%d * %d = %d'\
    \ % (x, y, x*y))\n```\n\n运行该程序后，输出将类似于：\n\n```text\n1 * 1 = 1\n1 * 2 = 2\n1 *\
    \ 3 = 3\n1 * 4 = 4\n...\n1 * 10 = 10\n2 * 1 = 2\n2 * 2 = 4\n...\n10 * 10 = 100\n\
    ```\n\n请在编译器中运行并观察结果。您只需四行代码即可生成完整的乘法表。想想若用传统方式逐行编写需要多少行代码？此表仅用几行就完成了，充分展示了嵌套循环的强大与高效。\n\
    \n循环是添加到代码中的绝佳选择。在许多情况下，您需要创建循环并将其嵌入代码中。您可以利用它在极少行数内完成大量编码工作，同时清理代码，在不编写过多代码的前提下实现相同功能。编译器会持续读取循环，直到您设定的条件不再有效。这为代码开启了更多可能性，同时保持了代码的整洁与可管理性。\n\
    \n## 类的重要性\n\n使用 Python 时，一个非常重要的事实是它被组织为类。我们在使用 Python 时会大量接触到类，因为这是我们在编写语言时保持事物有序且易用的主要方式。\n\
    \n描述类的方式有很多，但基本上，它们是容器，用于存放对象，并确保我们能在合适的时间轻松提取所需部分。您可以将任何对象放入类中，但必须确保该对象放在特定类中是合理的。例如，如果有一个关于鱼的类，却放入了一架飞机，这讲不通。您在大多数情况下可以自行决定如何组织，但必须考虑什么最适合您的需求，并思考这对其他人和您的类来说是否合理。\n\
    \n### 创建类\n\n首先要了解的是如何创建类。为此，我们需要在命名类之前使用正确的关键字。您可以为类命名任何喜欢的名称，只需确保名称紧跟在关键字之后，且命名为日后易于记忆的内容。\n\
    \n给类起好名字后，接下来是命名子类。这部分将放在括号内，帮助我们遵循一些正确的编程规则。请确保在创建类时，第一行末尾加上冒号（Python 语法要求），以遵循正确的编程规范。\n\
    \n好消息是，创建自己的类只需记住这些，而且这个过程往往听起来比实际更复杂。开始编写自己的类所需的步骤包括：\n\n"
