    # Chapter 4: Python Intensive Course


    In the previous chapters, we spent some time taking a look at some of the more
    common things that you are able to do with Python coding. The more that you learn
    about this language, the more complexity we are able to add to some of the codes
    to make them stronger. With this in mind, we have a few more intensive options
    that we need to look at in order to help round out some of the things that we
    are able to do with this language, and to ensure that we have everything we need
    to move onto some of the more complex aspects of this process as well.


    Some of the topics that we need to take a look at include:


    ## Namespaces


    When we are going through this process, we will need to work on the namespaces
    sometimes. For example, think back to when you were in school and you had other
    students in your class. How many times in those classes did you meet more than
    one person who had the same name as you or just the same name as each other? When
    this happened, when the teacher asked for a particular student, most of the time,
    the other students are going to ask about which one they were meaning. The teacher
    then would have to use some other identifying feature or another addition to the
    name to make sure the right student was going to answer them.


    Of course, life would be easier if each person had a special name, one that no
    one else would share. This would help to cut out some of the confusion and you
    wouldn’t have to go through the process to provide additional information while
    making sure that they were getting ahold of the right person. But since there
    are a limited number of names, and parents can certainly choose whatever name
    they would like, this is an impossible task to work with.


    There is going to be an issue that is similar to working in Python and other programming
    languages. When a programmer is writing a short program that won’t have any dependencies
    on outside information, it is going to be easier to provide relevant and unique
    names that will work with all of the different variables that you have. But, when
    you are working on a really long code with thousands of lines of coding, and you
    add in some outside modules that are all loaded up, it is going to become harder
    to keep with this.


    The good news is that we are going to see how namespaces are able to make this
    a bit easier. These namespaces are going to come into play when we want to give
    each variable and more a name that can make it unique. To understand these namespaces,
    we first need to look closer at why they are important, and how this namespace
    is going to be a system to make sure that all of the names in a program are unique.
    And when we can do this, it is going to help us use the variable without any conflict.


    With this, we are going to find that there are a few types of namespaces that
    are available and these include:


    *   **Local namespaces**: These are namespaces that are of local names inside
    a function. These will be created when functions are called and will only last
    until the functions return.

    *   **Global namespaces**: These namespaces will comprise of names from the different
    modules that you bring in to complete the project. They are created when the modules
    are incorporated into the project and will stick around until the script ends.

    *   **Built-in namespaces**: These types of namespaces consist of built-in exception
    names and functions.


    The namespaces are going to be important when you want to write out some parts
    of your code. They are going to be there to help make it easier to find what is
    needed later on as you go through the code. They are also there to help your program
    learn what you would like it to pull up at a given time. If you don’t take the
    time to give the variable, function, or another part of the code a namespace,
    how will your code really know what you would like to pull up at a later time
    when you call it up.


    You also have to be careful when it is time to type in the name that you would
    like to give each part of the code. If your name is a bit confusing, or you are
    not able to remember it, then it is going to be really hard to call this up later
    on. If you go through and spell the name of something the wrong way, or you aren’t
    calling it up in the proper manner, then you may find that you are going to get
    an error in the process. Take some caution when you create the different names
    of the parts of your code, and then make sure that they are names that you will
    be able to remember and identify later on.


    There are a few rules that come with these namespaces in Python, although you
    still have a lot of flexibility with the name that you are using. First, you can
    use any character, number, and symbol that you want, such as an underscore. But
    you have to start with a letter. You can name something `two_pieces` if you would
    like, but you can’t name it `2pieces` or `_twopieces`. If you do this, either
    when naming or calling up the property, you are going to end up with an error
    message in your program.


    And one final note here is that when you create your namespaces, make sure that
    you don’t try to give two different variables or functions the same name. This
    is going to cause a lot of problems in your code because the program won’t know
    which one you want to save or call up. Give each part their own namespace so that
    your code can run as smoothly as possible.


    ## Handling Strings


    Now it is time for us to take a look at something that is known as the Python
    strings. We did take a look at these a bit with some of the other topics, but
    now it is time to give them a look of their own. To make this process simple,
    remember that this string is going to just be a series of text characters that
    are found in your code and can help you to get things done.


    There are a few different operators that we need to focus on when we want to handle
    our strings in Python. An operator is going to be a simple symbol that we are
    able to use to perform the operations that are necessary inside of our code. Some
    of the operators that we need to spend the most time looking through when we work
    with Python include:


    *   **Concatenation operator**: This is the operator that you would want to use
    when it is time to concatenate strings.

    *   **Repetition operator**: This is the operator that you will use in order to
    create many copies of a string. You can choose how many times you would like to
    repeat the string.

    *   **Slice operator**: This is the operator that is going to look through your
    string and then retrieve the specific character that you want from there. Any
    time that you use this one, you would need to remember that zero is going to be
    the first character of the string.

    *   **Range slice operator**: This is the operator that is going to retrieve a
    range of characters from your index, rather than just one character. If you just
    want to showcase one word or one part of your string, you would use this kind
    of operator.

    *   **In operator**: This operator is going to search for a specified character
    in a target string. If the character is present somewhere in the string, then
    you will get an answer of `True` returned to you. If that character is not inside
    the string, then you will get an answer of `False` returned to you.

    *   **Not in operator**: This is the operator that will work in the opposite manner
    as the `in` operator. It is going to search for a specified character in your
    string. But if the operator is not able to find that character in the string,
    then you will get the `True` answer returned. If that character is found in the
    string, then it is going to return `False`.

