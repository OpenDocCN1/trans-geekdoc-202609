    # Chapter 6: The Steps of a Data Analysis


    With some of the ideas of a data analysis defined above to show us why this is
    so important, it is time for us to take a look at some of the steps that are so
    important to this process. When we know a bit more about some of the steps of
    this data analysis, and what we are able to do with it, we are going to find why
    we should use this method of learning from Big Data and then ensuring that your
    business will be able to use this information in order to get further ahead of
    the competition.


    For most businesses, there isn’t going to be any problem with a lack of information.
    In fact, these businesses are going to suffer from having too much information
    to handle, and they are not certain what they are supposed to do with it. This
    over-amount of data is going to make it harder to come up with a clear decision
    based on the data, and that can be a problem as well. With so much data to go
    and sort through, we need to get something more from the data. This means that
    we need to know that the data we have is right for the questions that we want
    to be answered. We need to know how we can draw some accurate conclusions from
    the data that we are working with. And we need data that is going to be able to
    take on and inform our decision-making process. In all, we need to make sure that
    we have the best kind of data analysis set up and ready to go. With the right
    process and tools set up for our data analysis, something that may have seemed
    like too much in the beginning and like an overwhelming amount of stuff to go
    through will then become a simple process that is clear and easy as possible.


    To help us get all of this done, we need to go through some of the basic steps
    that are needed to use this data to make better decisions overall. There are a
    lot of ways that we are able to divide this all up and make it work better for
    our needs, but we are going to divide this up into five steps that we are able
    to use and rely on to see some of the best results overall. Some of the steps
    that we can use to help make our data analysis more productive for better decision
    making in the company include:


    ## Defining Your Question


    The first step that we need to undertake when it comes to working on data analysis
    is to define the main question that we would like to handle. You should not just
    randomly work with the data that is on hand and hope that it shows you something.
    Because this is just going to get you lost and confused in the process. You need
    to have a clear picture of where you want to go and what you would like to learn
    from this data, and then work from there.


    In your data analysis, you need to start out with the right questions. Questions
    are important, but we need to make sure that they are concise, measurable, and
    clear. Design the questions so that they are able to either qualify or disqualify
    some of the potential solutions that you are looking for on a specific problem
    or opportunity.


    For example, you may want to start out with a problem that you are able to clearly
    define. Maybe you are a government contractor, and you find that your costs are
    rising quite a bit. Because of this, you are no longer able to submit a competitive
    contract for some of the work that you are doing. You will want to go through
    with this and figure out how to deal with the business problem. One of the questions
    that you may be taking a look at right now in order to help you solve this problem
    could be, “Can the company reduce its staff without compromising quality?”


    ## Set up Clear Measurements


    The next thing that we need to be able to do here is make sure that we are able
    to set up some clear priorities on your measurements. This is one that we will
    be able to break down into two subsets to help us out. The first part is that
    we need to decide what we want to measure. And then the second thing we need to
    decide is how to measure it.


    So, let’s start with the first part of deciding what we would like to measure.
    Going with the example of being a government contractor from before, we would
    have to take this time to consider what kind of data is needed in order to answer
    that question we posed in the beginning. In this case, you would first need to
    gather up information on the number and the cost that you have for that current
    staff and the amount of time that these employees are going to spend on business
    functions that are necessary.


    When we are going through and answering this kind of question, there are going
    to be a number of other questions that we need to answer as well to help us figure
    out the options that we need to take as well. For example, we would want to see
    if there are any employees we could do without if the staff is under-utilized
    in their current jobs, and what you could do to help out with some of this.


    And then, we are going to get to the decision that we want to measure. When doing
    this, we need to make sure that we are considering any of the objections, the
    reasonable ones, of stakeholders and others who are working with the company.
    They may be worried about what would happen if you reduced the staff, and then
    there was a big surge in demand shortly afterward, and you were not able to hire
    more people in the right amount of time.


    Once we are done with that first step, it is time for us to make some decisions
    on how to measure. Thinking about how we are able to measure the data that we
    have is going to be just as important here, especially before we go through the
    phase of collecting data because the measuring process is going to either back
    up our analysis or discredits it later on.


    There are a lot of different questions that you are going to ask in this stage,
    but some of the most important ones to consider will include:


    1. What is the time frame that we are looking at?

    2. What is the unit of measure that we are relying on?

    3. What factors are important to consider in all of this.


    ## Collect the Data


    After we have had some time to go through and define our big problem and then
    work on the measurements that we are going to use, it is time for us to move on
    to collecting the data. With the question defined and the measurement priorities
    set, it is now time for us to go through and collect the data.


    As we organize and collect the data, there are going to be a lot of important
    points that we must keep in mind with this will include:


    1. Before you go out and collect some new data, you need to determine what information
    that we need to work with. We can look through some of the existing databases
    and some of the existing sources that we have on hand. You need to go through
    and collect some of this data first because it is simple and easier and can save
    a lot of money as well. We can move out to some other sources later, as well,
    if we need more information.

    2. During this process, we also need to determine what naming system and file
    storing system we would like to use. This is going to make it easier for your
    team members to collaborate with one another. This process is going to save some
    time and will prevent members of your team from wasting time and money by collecting
    the same kind of information more than once.

    3. If you would like to gather up data through interviews and observations, then
    you need to go through and develop an interview template ahead of time. This is
    going to ensure that we are able to save some time and that there is some continuity
    that goes on in this process as well.

    4. And finally, we need to be able to keep the collected data that we have as
    organized as possible. We can work with a log that has the collection dates and
    add in the notes about sources as you would like. This should also include some
    data normalization that you may have performed as well. This is going to be important
    because it will validate the conclusions that you make down the road.

    '
