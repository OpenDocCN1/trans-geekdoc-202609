  trans: "\n# 欢迎来到 Python 进阶课程！\n\n在前几章中，我们花了一些时间了解了一些基础知识，这些知识让你能用 Python 做一些很棒的事情，并熟悉这类语言，现在是时候将其提升到一个新的水平了。在本章中，我们将花一些时间来了解\
    \ Python 编写代码的一些更高级的功能，以及随着技能不断进阶你将会更多使用的选项。在这种情况下，我们将讨论如何编写继承，以及如何处理和引发你自己的异常。让我们看看这两个主题是如何工作的，以便我们能立即开始使用它们！\n\
    \n## 编写你自己的继承\n\n既然我们正在花一些时间学习 Python 进阶课程，是时候开始学习 Python 继承了。这些继承非常重要，因为它们允许程序员编写大量复杂的代码，而无需逐行重复输入这些大纲。这将有助于保持代码整洁有序，节省一些时间，同时仍能确保代码按照你期望的方式工作。\n\
    \n为了帮助我们确保继承能在代码中按预期方式工作，我们必须记住它是如何工作的。在此过程中，继承是一个获取原始代码（即基类或父类代码）的过程，然后我们能够在代码后面复制它以生成派生类或子类代码。这些派生代码是可调整的，因此你可以从中添加或移除部分，而不会对原始父代码产生任何负面影响。你还可以选择只创建一个派生类，或者创建一种家族树结构，继续向下复用代码，次数不限。\n\
    \n在 Python 中使用继承实际上比听起来容易得多。你可以浏览代码并根据需要添加或移除任意数量的信息，以确保其按我们想要的方式工作。为了了解如何使用这些继承以及它们能为我们做什么，我们可以通过以下示例来实践：\n\
    \n```python\n# 继承示例\n# 基类\nclass Student(object):\n    def __init__(self, name,\
    \ rollno):\n        self.name = name\n        self.rollno = rollno\n\n# GraduateStudent\
    \ 类继承或派生自 Student 类\nclass GraduateStudent(Student):\n    def __init__(self, name,\
    \ rollno, graduate):\n        Student.__init__(self, name, rollno)\n        self.graduate\
    \ = graduate\n\n    def DisplayGraduateStudent(self):\n        print(\"Student\
    \ Name:\", self.name)\n        print(\"Student Rollno:\", self.rollno)\n     \
    \   print(\"Study Group:\", self.graduate)\n\n# PostGraduate 类继承自 Student 类\n\
    class PostGraduate(Student):\n    def __init__(self, name, rollno, postgrad):\n\
    \        Student.__init__(self, name, rollno)\n        self.postgrad = postgrad\n\
    \n    def DisplayPostGraduateStudent(self):\n        print(\"Student Name:\",\
    \ self.name)\n        print(\"Student Rollno:\", self.rollno)\n        print(\"\
    Study Group:\", self.postgrad)\n\n# 从 GraduateStudent 和 PostGraduate 类实例化\nobjGradStudent\
    \ = GraduateStudent(\"Mainu\", 1, \"MS-Mathematics\")\nobjPostGradStudent = PostGraduate(\"\
    Shainu\", 2, \"MS-CS\")\nobjPostGradStudent.DisplayPostGraduateStudent()\n```\n\
    \n当你将此代码输入解释器时，将获得以下结果：\n\n```\n('Student Name:', 'Mainu')\n('Student Rollno:',\
    \ 1)\n('Student Group:', 'MSC-Mathematics')\n('Student Name:', 'Shainu')\n('Student\
    \ Rollno:', 2)\n('Student Group:', 'MSC-CS')\n```\n\n继承很好用，因为它们在编写任何类型的代码时都能给我们一些自由度。如果你已经有一个感兴趣的父类或基类，并希望将其作为派生类的基础，我们可以轻松做到这一点，而无需浪费时间和空间反复重写代码。通过这种继承，我们能够保留原始基类中我们想要的特性，然后更改不需要的特性，或添加一些新东西（如果它们对我们正在编写的代码更合理的话）。所有这些都可以在不必担心弄乱你编写的原始代码的情况下，增强我们正在使用的代码。\n\
    \n从技术上讲，你可以创建任意数量的派生类。只要你保持它们之间的顺序，并使用上面的示例来创建自己的类，你就可以创建任意数量的这些派生类。这使事情变得更容易，限制了你必须编写的代码量，并且当你创建一个新程序时，真的能让事情变得更轻松。每个新的派生类都能够从其父代码中获取它喜欢的特性并使用它们，或丢弃它们，以使代码继续下去并比以前更强大。\n\
    \n## 异常处理\n\n我们在本节中需要关注的第二个主题是关于如何不仅处理，而且引发我们自己的异常。当我们用 Python 进行编码工作时，你会发现 Python\
    \ 语言会自动识别一些异常，我们也能够专注于处理它们。这些是库会视为错误的情况，例如当用户试图在代码中除以零时，程序会引发错误消息。然而，我们也能够在此过程中引发我们自己的异常。有些异常仅针对你正在编写的特定程序，你必须告诉编译器停止允许其发生。如果你正在创建游戏或做类似的事情，这很有用。\n\
    \n我们目前需要关注的第一种异常类型是如何在我们自己的代码中引发异常，以及如何处理编译器已经知道如何处理的一些自动异常。我们还将了解如何提前为这些异常做好准备，以及如何稍微更改错误消息，使其更加用户友好且易于理解。\n\
    \n如果你已经在处理一些代码，并且注意到可能会出现某种问题，或者你正在进行一些研究以弄清楚为什么某些东西没有按你想要的方式工作，你会注意到会出现一个错误或异常。这发生在编译器有机会浏览代码并发现有些地方不太对劲时。好消息是，通常这是一个简单的修复，比如注意你用什么做除数（在\
    \ Python 中不能除以零），或者你拼错了类名或其他部分属性的名称。\n\n弄清楚如何处理这些异常并真正了解我们在这里在做什么的最好方法之一，就是实际把它写出来并看到它的运行情况。一个你可以编写来处理这些异常的代码的好示例将包括：\n\
    \n```python\nx = 10\ny = 10\nresult = x/y # 试图除以零\nprint(result)\n```\n\n当你尝试让解释器运行这段代码时，将获得的输出如下：\n\
    \n```\n>>> Traceback (most recent call last):\n  File \"D:\\Python34\\tt.py\"\
    , line 3, in <module>\n    result = x/y\nZeroDivisionError: division by zero\n\
    >>>\n```\n\n当你查看此示例时，你的编译器将引发一个错误，仅仅因为你或用户试图除以零。Python 代码不允许这样做，因此它会引发该错误。现在，如果你保持这种方式并完全按原样运行程序，你将得到一个混乱的错误消息，这可能是你的用户无法理解的。这会让代码难以理解，且没人知道下一步该做什么。\n\
    \n一个更好的主意是看看一些你可以添加到代码中的不同选项，以帮助防止之前的混乱。你要确保用户理解为什么引发此异常，而不是让他们感到困惑。一种不同的编写代码的方式，以确保大家都在同一页面上，包括：\n\
    \n```python\nx = 10\ny = 0\nresult = 0\ntry:\n    result = x/y\n    print(result)\n\
    except ZeroDivisionError:\n    print(\"You are trying to divide by zero.\")\n\
    ```\n\n如果我们将这第二段代码输入编译器，我们将看到它将类似于我们对第一段代码所做的操作。但它将更进一步，并向我们展示有一个更好、更易读的选项可供阅读。你会真正喜欢使用这个，因为它有助于为你的用户提供一些他们实际可以阅读和理解的内容，而不是难以处理的消息。\n\
    \n现在，我们可以更进一步，看看一些你可以采取的步骤来引发专门的异常。这些将是你希望在代码中看到的异常，但不会被 Python 编译器自动识别。也许你正在创建一个游戏或类似的东西，并且希望该异常能阻止某些答案，或者只允许一定数量的猜测后停止。\n\
    \n请记住，当我们引发自己的异常时，它们将是你代码独有的。如果你希望它们出现在多个代码中，你必须每次都引发它们。如果你不花时间编写这些异常，那么编译器根本不会提前识别它们。\n\
    \n整齐的是，我们能够编写任何我们想要的异常，其思路类似于我们之前讨论的内容。引发你自己的异常的一个示例将如下所示：\n\n```python\nclass\
    \ CustomException(Exception):\n    def __init__(self, value):\n        self.parameter\
    \ = value\n\n    def __str__(self):\n        return repr(self.parameter)\n\ntry:\n\
    \    raise CustomException(\"This is a CustomError!\")\nexcept CustomException\
    \ as ex:\n    print(\"Caught:\", ex.parameter)\n```\n\n当你完成这段特定代码时，你就成功添加了你自己的异常。当有人引发此异常时，屏幕上将出现消息“Caught:\
    \ This is a CustomError!”。你可以随时更改消息以显示任何你想要的内容，但这只是作为一个占位符来展示我们在做什么。\n\n花点时间将其添加到编译器中，看看会发生什么。处理异常是我们随着时间的推移在某些编码中会出现的事情，并且可以为你尝试编写的某些代码增加另一个层次。正如我们在这里看到的，编写一个已存在的异常和编写你自己的自定义异常并不是一个困难的过程，你将能够迅速掌握它并准备就绪。\n"
