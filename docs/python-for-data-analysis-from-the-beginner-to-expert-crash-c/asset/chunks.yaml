    # Pandas 库概述


    接下来我们要花一些时间了解的主题是 **Pandas 库**。这将是我们能够用来在数据分析中取得良好结果的最佳库之一。如果你想处理数据科学的流程，并且不想跳来跳去地使用许多不同的部分，那么
    **Pandas 库** 将是你最好的选择之一。


    **Pandas 库** 代表 **Python 数据分析库**，在数据分析方面以及在 **Python** 语言中进行更多数学工作等方面，它将提供很大帮助。**Pandas**
    这个名称源自 **面板数据** 这一术语，后者在数据科学领域常见，用于处理多维结构化数据集。无论这个名字是如何起源的，或者它对我们意味着什么，它仍然是一个很好的名字，帮助我们在该语言中完成一些目标。


    你会发现，在进行数据分析时，**Pandas** 能做很多事情来改变我们整个编码过程的游戏规则。事实上，当需要在该语言（以及该过程的其他部分）中处理 **数据清洗**
    和 **数据整理** 时，这将是最常用、最受欢迎的工具之一。**Pandas** 也是免费且 **开源** 的，这意味着任何人都可以使用它，以安全、有效且快速的方式处理他们的数据。虽然还有许多其他的库，但你会发现许多公司和个人都喜欢使用
    **Pandas**。


    **Pandas** 有一个非常酷的功能：它能获取数据，无论数据来自 **SQL 数据库**、**TSV 文件** 还是 **CSV 文件**，然后将这些信息转换为一个
    **Python 对象**。这将被转换为列和行，并被称为 **数据框**，它看起来非常类似于我们在其他统计软件中看到的表格。如果你以前用过 **R**，那么这些对象将与
    **R** 有很多相似之处。当你想要工作且不想担心字典、列表循环或列表推导式时，这些对象将更容易处理。还记得我们之前讨论过循环在 **Python** 中很好用，但你会发现，在数据分析方面，这些循环可能笨重、占用大量空间且处理时间过长。使用这种编码语言将帮助你完成任务，而无需经历所有麻烦。


    我们之前稍微提到过，你需要完成一些步骤才能在计算机上安装 **Pandas 库**。最好在安装 **Python** 和其他库的同时安装它，以便于操作并确保所有库都准备就绪。如果你还没时间做这件事，现在就去做吧。


    一旦我们下载了 **Pandas 库**，就可以开始使用该库的所有功能了。该库将有大量功能可供使用，花一些时间了解更多关于它的信息以及如何让它为我们工作，真的能让我们在使用这类库时取得更大的成就。当你准备好并有时间尝试该库附带的一些功能后，我们就可以分析已经收集的一些数据了。通常有三种不同的方法可供我们使用。


    ## 数据输入的三种主要方法


    我们将能够使用该库的三种主要方法包括：


    1.  你可以将 `NumPy 数组`、`Python 列表` 或 `Python 字典` 转换为 **Pandas** 可用的 `数据框`。

    2.  你可以在 **Pandas** 的帮助下打开计算机上找到的本地文件。这通常是 `CSV 文件`，但在某些情况下也可能是 `Excel` 或 `定界文本文件`
    等其他格式。

    3.  你也可以选择使用它来打开远程文件或另一个数据库，包括通过 `URL` 位于网站上的 `JSON` 或 `CSV`，或者你可以让程序读取来自 `SQL`
    的数据库或表。


