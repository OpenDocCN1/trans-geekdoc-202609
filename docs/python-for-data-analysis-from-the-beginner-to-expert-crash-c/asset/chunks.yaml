    of storage from us. Your storage solution is going to vary based on how you would
    like to handle the data. It can be on the premises of the business, on the cloud,
    and sometimes, it is a combination of both. You can then store the data in any
    kind of form you would like, and then bring about the desired requirements for
    processing and the necessary process engines to those sets of data when they are
