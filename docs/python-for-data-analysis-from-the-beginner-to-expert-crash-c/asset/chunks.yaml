  trans: "\n# Python 函数\n\n函数是你在代码中会经常遇到的东西。它们本质上是一段代码块，你可以重复使用它来在代码中完成特定任务。\n\n当我们花时间在\
    \ Python 中定义函数时，必须了解两种主要类型，以确保我们以正确的方式使用它们。这两种类型包括用户定义函数和内置函数。我们要查看的内置函数已经随 Python\
    \ 自带，你可以直接按原样使用它们。但我们也有用户定义函数，这些是开发者能够根据其项目创建和定义的函数。然而，无论我们使用哪种函数，函数都将被视为对象，这使得它们比某些高级编程语言中的函数更易于使用。这将使函数的使用变得更容易一些。\n\
    \n一般来说，开发者既可以编写自己的用户定义函数，也可以从与 Python 没有直接关系的第三方库中借用这些函数。这些函数将帮助我们获得优势，具体取决于我们如何以及何时想要在代码中使用它们。\n\
    \n不过，当我们使用这些函数时，必须记住以下几点：\n\n*   这些函数将由可重用的代码块组成。只需编写一次，然后你就可以在代码中根据需要多次使用它们。你甚至可以将该用户定义函数用在你的其他应用程序中。\n\
    *   这些函数也非常有用。你可以用它们来处理任何你想要的事情，从编写特定的业务逻辑到处理通用工具。你还可以根据自己的需求修改它们，使程序正常运行。\n*\
    \   代码通常对开发者友好、易于维护且结构良好。这意味着你能够支持模块化设计方法。\n*   你可以独立编写这些类型的函数。如果需要，你的项目任务可以分发出去以进行快速应用开发。\n\
    *   一个经过深思熟虑且定义良好的用户定义函数可以简化应用程序的开发过程。\n\n现在我们对 Python 用户定义函数的用法有了更好的了解，是时候来看看你在处理这类函数时可以使用的几种参数，然后看看编写这类函数时可以使用的一些代码。\n\
    \n当开始使用这些类型的函数时，我们必须记住它们将采用四种不同类型的参数供我们使用。这些将是预定义的类型，开发者无法更改它们。相反，开发者可以选择遵循这些规则。我们在处理这些用户定义函数时可以使用的四种参数类型包括：\n\
    \n*   **默认参数**：这种编程语言有一种不同的方式来表示函数参数的默认值和语法。这些默认值表明，如果你在函数调用期间没有为参数传递值，函数参数将采用该值。你可以通过等号（`=`）来识别默认值。\n\
    *   **必需参数**：这些是你函数中强制要求的参数。当调用函数时，你需要按正确的顺序和数量传递这些值，否则代码将无法正常工作。\n*   **关键字参数**：另一个可用的选项是关键字参数。这些也与\
    \ Python 中的函数调用相关。这些关键字将在你的函数调用中被提及，连同与之对应的一些值。这些关键字将与函数参数映射，使你更容易识别所有正确的值，即使你在调用时顺序不正确。这有助于保持代码井然有序。\n\
    *   **可变数量的参数**：这是另一个可用的选项，当你不知道需要向函数传递的确切参数数量时，它非常有用。或者你可以设计它，使得只要满足你设定的要求，就可以传递任意数量的参数。\n\
    \n在结束之前，我们需要花些时间编写一些这些用户定义函数。既然我们已经有机会查看了可以使用的参数类型，现在是时候学习完成这一切所需的步骤了。我们只需遵循四个基本步骤即可实现这一点，这会让事情变得更容易处理。我们可以用于这些函数的基本步骤包括：\n\
    \n1.  **声明你想要使用的函数**。然后你需要使用 `def` 关键字，函数名称将紧随其后。\n2.  **编写你想要使用的参数**。这些参数将位于函数的两个括号内，使用我们之前提到的参数。用冒号结束此声明，以帮助我们遵循这种语言中被视为正确的编写协议。\n\
    3.  **添加你希望程序按正确方式执行的必要语句**。\n4.  **结束函数**。然后你可以选择是否使用 `return` 语句来结束。\n\n考虑到这一点，是时候来看一个我们可以用这种编码做什么的示例了。你可以用来创建此类函数的语法示例将包括：\n\
    \n```\ndef userDefFunction (arg1, arg2, arg3, …):\n    program statement1\n  \
    \  program statement2\n    program statement3\n    ….\n    Return;\n```\n\n# 第\
    \ 5 章：什么是数据分析？\n\n![](img/rsrcGK.jpg)\n"
