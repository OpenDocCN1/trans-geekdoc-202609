    then the trainers have to show the system what is right and what is not. Then,
    as the system learns from what the trainer is telling it, it will be able to get
    smarter and work on improving itself even when the trainer is no longer there
    to provide it with the feedback it needs. After the trainer has spent some time
    training the computer and helping this algorithm work, the algorithm will be able
    to apply the information that it has learned from the data earlier on so it can
    take a new input and make the best predictions possible.


    The concept that we are going to see with supervised learning is going to be similar
    to what we are going to see when a teacher is trying to show their class something
    new. For this, the teacher is going to provide some kind of lesson to the students
    and then provide some examples to help drive the point home. The students will
    take a look at the examples and can gain some new knowledge and some new rules
    from the examples that their teacher gives. They are then able to take that knowledge
    that they gain in the process and apply it to a lot of different situations, even
    when the new situations don’t really match up, but are similar to the examples
    that they were able to get in the classroom from the teacher.


    When we take a look at this supervised machine learning, it is going to be important
    that we know the differences between the classification problems and the regression
    problems that we are going to handle. The regression problem is going to happen
    when the target is a numeric value that we need to work with. But the classification
    kinds of problems are going to include a tag or a class. The regression tag is
    going to be important because we can use it in situations where we are trying
    to figure out the average costs of all the properties in the town, while the classification
    problem will be used in order to figure out what flower type is in a picture by
    looking at the color and the size of the flower petals. We have to remember that
    at times, the accuracy that comes with this one is going to suffer a bit when
    you have unlikely, impossible, and incomplete values that are being used with
    your training data. Being able to take a look at some of the training data that
    you want to work with, before placing it through the algorithm, and getting a
