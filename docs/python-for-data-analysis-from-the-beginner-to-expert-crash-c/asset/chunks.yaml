    # However, while there are a lot of promises and potential that comes with big
    data, we have to take a look at some of the challenges that can show up as well.


    First, big data is going to include a ton of data. Although there are new technologies
    that have been developed to handle data storage, the volumes of data are doubling
    in size every two years. This makes it hard for companies to keep pace with this
    data and to find ways to store and use it in the most effective manner possible.


    Big data is going to provide us with some new insights that can really open up
    some new opportunities and business models. But to get started with this, there
    are three key actions that we need to talk about first.


    ## Integration


    To start with this, we need to work on integration. Big data is going to bring
    together a lot of data from disparate sources and various applications. The traditional
    mechanisms of data integration are generally not expandable to some of the work
    that we see. This kind of data is going to require us to work with new strategies
    and technologies in order to analyze the big sets of data at a terabyte or sometimes
    even a petabyte scale.


    During the process of integration, we are going to bring in the data, process
    it, and then make sure that it is formatted and available in the right form. Once
    all of this has happened, your business analysts can then go through the writing
    process to work with the data and start putting it through the algorithms that
    are needed for success.


