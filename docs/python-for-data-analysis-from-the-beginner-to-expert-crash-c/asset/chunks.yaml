    10 result = x/y #trying to divide by zero print(result) The output that you are
    going to get when you try to get the interpreter to go through this code would
    be: \>>> Traceback (most recent call last): ​ File “D: \\Python34\\tt.py,” line
    3, in <module> ​ result = x/y ZeroDivisionError: division by zero \>>> When you
    take a look at this example, your compiler is going to bring up an error, simply
    because you or the user is trying to divide by zero. This is not allowed with
    the Python code so it will raise up that error. Now, if you leave it this way
    and you run the program exactly how it is, you are going to get a messy error
