- raw: 'Now that we know some of the basics that come with coding in the Python language,
    it is time for us to move on to the next level. These types of codes that we will
    look at coming up next can help us to really expand what we know how to do in
    Python and will make it easier for us to really write the kinds of codes that
    we would like. In this chapter, we are going to spend our time looking at how
    to write loops, the importance of the classes in Python and how we can make these
    work, and adding in some of the decision control statements as well. Let’s dive
    in and see what we are able to do with all of these. Writing Your Loops The first
    thing that we can take a look at when we want to move up with our skills in Python
    is the idea of a loop. With these loops, we are able to take a bunch of lines
    of our code, and squeeze it down into just a few lines instead. This makes writing
    codes a lot easier and also helps us to know that the codes are going to be organized
    and look better as well. The loops are going to be the most useful in your code
    when you would like it to go through and repeat several lines many times, but
    you don’t want to spend all of that time rewriting the code a bunch and making
    it look messy along the way. When you are working with some of the basics of coding,
    you may not think that this is really something that is necessary when you are
    just writing out two or three lines of code. But if you would like to have something
    repeat itself 100 times or more, you can see where the loop, which can take these
    lines and limit them to just a few, can be helpful. For example, let’s say that
    you want to write out a program that counted from one to one hundred for you.
    You could go through and handwrite the whole thing, but think about what a mess
    this would end up being. The loop, on the other hand, can take over on this and
    get all of this to show up in just a few lines of code or less to make life a
    little bit easier. One thing though that we need to take into consideration when
    we are doing all of this is that we have to add in a condition at the end. This
    condition is going to be important so the code knows when to stop going through
    itself and when the loop is all over. If you don’t add in this condition, you
    will just get your computer stuck and frozen, and this is never a good idea either.
    Having this break or a condition set up right from the beginning can help us to
    avoid this problem and will get the code to work the way that you want from the
    beginning. With this in mind, let’s take a look at some of the different types
    of loops that we are able to work in order to see some results and to see how
    this kind of process is going to work for us. The first loop on the list is the
    while loop. This is the best type of loop to use when you want to make sure that
    the code you are using is going through a cycle a certain number of times. You
    are able to figure out and set up how many times this is written from the beginning
    to ensure that the loop only goes through as often as you want. With the while
    loop, your goal is not to make the code go through its cycle an indefinite amount
    of times, but you do want to make sure that it goes through for a specific number
    of times. If you are counting from one to ten, you want to make sure it goes through
    the loop ten times to be right. With this option, the loop is going to go through
    at least one time and then check to see if the conditions are met or not. So,
    it will put up the number one, then check its conditions and put up the number
    two, and so on until it sees where it is. To give us a little bit better of an
    understanding on how these loops work, let’s take a look at some sample codes
    of the while loop and see what happens: counter = 1 while(counter <= 3): ​ principal
    = int(input(“Enter the principal amount:”)) ​ numberofyeras = int(input(“Enter
    the number of years:”)) ​ rateofinterest = float(input(“Enter the rate of interest:”))
    ​ simpleinterest = principal \* numberofyears \* rateofinterest/100 ​ print(“Simple
    interest = %.2f” %simpleinterest) ​ #increase the counter by 1 ​ counter = counter
    + 1 ​ print(“You have calculated simple interest for 3 time!”) While we are here,
    you should type in the code above to your compiler and see what will happen with
    it. You will see when this is executed, that the output is going to come out in
    a way that the user is able to place any information that they want inside of
    the program. Then the program will be able to do its computations and tell us
    what the interest rates are, based on that information, as well as the final amounts.
    With this example, we were able to set it up so that the loop went through three
    times. This is going to provide the user with a chance to try out three different
    items before it moves on. You can always make some changes to this though, and
    let it loop through more times if you wish. With that in mind, it is time to take
    a look at the second type of loop, which is known as a loop. This one is often
    going to show up in a lot of the same situations where we find the for loop, and
    it is often seen as the more traditional approach to doing loops. What this means
    is that if you would like to keep things simple, you can usually work with the
    for loop and not have any problems with it at all. To take this further, the for
    loop is going to be set up in a manner so that it is not the user who decides
    what information to give the program that will determine when it is time for the
    loop to stop. The loop, in this case, is going to be set up to go over the iterations
    in the order they are in to start the right number of times. There isn’t going
    to be the need from an outside user or force to handle all of this, at least until
    the code reaches the end. An example of the code that you would be able to use
    to make this happen includes: \# Measure some strings: words = \[‘apple,’ ‘mango,’
    ‘banana,’ ‘orange’\] for w in words: print(w, len(w)) When you work with the for
    loop example that is above, you are able to add it to your compiler and see what
    happens when it gets executed. When you do this, the four fruits that come out
    on your screen will show up in the exact order that you have them written out.
    If you would like to have them show up in a different order, you can do that,
    but then you need to go back to your code and rewrite them in the right order
    or your chosen order. Once you have them written out in the syntax and they are
    ready to be executed in the code, you can’t make any changes to them. And then
    we can move on to the final type of loop that we are going to talk about in this
    guidebook. This is going to be one that is known as the nested loop. We will find
    that this one is unique because it is going to run a loop inside another loop
    to get it to work. Both of these loops will continue on their path and will keep
    on running until everything is done. This is sometimes going to seem like a silly
    thing to add to the code, but there are a lot of times when you will write out
    a code, and this is needed. For example, you may find that you are working on
    a code where it is time to write out your own multiplication table. Maybe your
    goal is to write it from one to ten and have the answers lined up with this as
    well. This can be done with the nested loop to make things easier. With this one,
    there is going to be a huge amount of code if you went through and wrote out each
    line of code to make this table and to get it to behave. This is something that
    you can do, but even as a beginner, you can see how this is going to take a lot
    of time and effort in order to complete. A better method to help you get this
    kind of thing done is to work with the following code: #write a multiplication
    table from 1 to 10 For x in xrange(1, 11): ​ For y in xrange(1, 11): ​ Print ‘%d
    = %d’ % (x, y, x\*x) When you got the output of this program, it is going to look
    similar to this: 1\*1 = 1 1\*2 = 2 1\*3 = 3 1\*4 = 4 All the way up to 1\*10 =
    2 Then it would move on to do the table by twos such as this: 2\*1 =2 2\*2 = 4
    And so on until you end up with 10\*10 = 100 as your final spot in the sequence.
    Go ahead and put this into the compiler and see what happens. You will simply
    have four lines of code and end up with a whole multiplication table that shows
    up on your program. Think of how many lines of code you would have to write out
    to get this table the traditional way that you did before? This table only took
    a few lines to accomplish, which shows how powerful and great the nested loop
    can be. The loops are great options to add to your code. There are a lot of reasons
    when you would need to make a loop and add it inside your code. You will be able
    to use it as a way to get a lot of coding done in just a few lines, and a way
    to clean up the code so that you can still get the same thing done without writing
    out too much. The compiler is set up to keep reading through the loop until the
    condition that you set is no longer valid. This can open up a lot of things that
    you are able to do with your code, while also keeping things clean and manageable
    all at the same time. The Importance of Classes One thing that is really important
    when it comes to working with Python is the fact that it is separated out into
    classes. This is going to be something that we will see a lot of when it is time
    to work with Python because this is the main way that we keep things organized
    and easy to use within the language we are writing. There are a lot of ways that
    we are able to describe these classes, but basically, they are going to be containers
    that will hold onto our objects and make sure that it is really easy to pull out
    the parts that we would like at the right time. You are able to put any object
    that you would like into one of your classes, but we have to make sure that the
    object makes sense to be inside of a certain class. If you have a class that is
    all about fish, and you put in a plane, this is not going to make much sense.
    You get to choose how this works in most cases, but you have to consider what
    is going to work the best for your needs and think about how much sense it makes
    to others and to your class. The first thing that we are going to take a look
    at when we focus on these classes is how to create one. To do this, we need to
    use the right keywords ahead of naming the class. You need to use the right keywords
    before naming the class. You can name this class anything that you would like,
    we just have to make sure that the name is right after the keyword, and that this
    is named something that is easier for you to remember at a later time. After you
    get a chance to give your class a good name, it is time to move on to the second
    part, which is naming your subclass. This is the part that is going to be placed
    inside the parenthesis to help us stick with some of the proper rules of programming.
    Make sure that at the end of the first line, whenever you create a class, put
    in a semicolon to help you stick with some of the proper programming rules. The
    good news is, that is all that we need to remember when it is time to create our
    own classes, and this process is often going to sound more complex than it really
    is. The steps that we need to use to get started with writing out some of our
    own classes will include:  '
  fmt: "\n# Python 进阶：循环、类与决策控制语句\n\n现在我们已经了解了 Python 语言编码的一些基础知识，是时候进入下一阶段了。接下来要介绍的代码类型将帮助我们真正拓展\
    \ Python 技能，并使我们更容易编写想要的代码。在本章中，我们将花时间学习如何编写循环、Python 中类的重要性及其工作原理，以及如何添加决策控制语句。让我们深入探索这些内容的用处。\n\
    \n## 编写循环\n\n当我们想要提升 Python 技能时，首先要了解的是循环的概念。通过循环，我们可以将大量代码行压缩为仅几行。这不仅让编码变得更容易，还有助于保持代码的组织性和美观性。\n\
    \n当您希望代码重复执行多行多次，但又不想花费大量时间重写代码导致混乱时，循环最为实用。在处理编码基础时，如果只是编写两三行代码，可能不觉得循环有必要。但如果您希望某段代码重复执行\
    \ 100 次或更多，就会明白循环的价值所在——它能将这些行限制在极少数行内，极大地简化工作。\n\n例如，假设您想编写一个从 1 数到 100 的程序。您可以手动逐行编写，但想想最终会有多乱。而循环可以接管这项任务，仅用几行代码或更少就能完成，让生活轻松许多。\n\
    \n不过，我们在做这一切时需要考虑一点：必须在最后添加一个条件。这个条件很重要，它让代码知道何时停止循环、何时结束。如果不添加这个条件，计算机就会卡死冻结，这绝不是好主意。从一开始就正确设置中断或条件，可以帮助我们避免此问题，并让代码从一开始就按预期工作。\n\
    \n考虑到这一点，让我们看看几种不同类型的循环，了解它们如何工作并产生结果。\n\n### while 循环\n\n列表中的第一个循环是 `while` 循环。当您希望确保代码按特定次数循环时，这是最佳选择。您可以从一开始就计算并设置循环次数，确保循环仅按您想要的频率执行。\n\
    \n使用 `while` 循环的目标不是让代码无限循环，而是确保其按特定次数执行。例如，如果从 1 数到 10，您需要确保循环恰好执行 10 次。使用此选项时，循环至少会执行一次，然后检查条件是否满足。因此，它会输出数字\
    \ 1，然后检查条件并输出数字 2，依此类推，直到条件不再满足。\n\n为了更好地理解这些循环的工作原理，让我们看一些 `while` 循环的示例代码：\n\
    \n```python\ncounter = 1\nwhile(counter <= 3):\n    principal = int(input(\"Enter\
    \ the principal amount:\"))\n    numberofyears = int(input(\"Enter the number\
    \ of years:\"))\n    rateofinterest = float(input(\"Enter the rate of interest:\"\
    ))\n    simpleinterest = principal * numberofyears * rateofinterest/100\n    print(\"\
    Simple interest = %.2f\" % simpleinterest)\n    # increase the counter by 1\n\
    \    counter = counter + 1\nprint(\"You have calculated simple interest for 3\
    \ time!\")\n```\n\n请在编译器中输入上述代码并观察运行结果。您会看到，执行时用户可以将任意信息输入程序。随后程序会根据这些信息进行计算，并告知利率及最终金额。在本例中，我们设置循环执行三次，让用户有机会尝试三组不同的数据。您随时可以修改代码，让其循环更多次。\n\
    \n### for 循环\n\n接下来要看的第二种循环称为 `for` 循环。它常出现在 `while` 循环适用的相同场景中，常被视为处理循环的更传统方法。这意味着如果您想保持简单，通常可以直接使用\
    \ `for` 循环而不会有任何问题。\n\n进一步说，`for` 循环的设置方式是由循环本身（而非用户输入的信息）决定何时停止。循环会按顺序遍历迭代，自动执行正确的次数。除非代码到达末尾，否则不需要外部用户或力量来控制这一切。\n\
    \n以下是实现此功能的代码示例：\n\n```python\n# Measure some strings:\nwords = ['apple', 'mango',\
    \ 'banana', 'orange']\nfor w in words:\n    print(w, len(w))\n```\n\n将上述 `for`\
    \ 循环示例添加到编译器并执行。执行时，屏幕上会按代码编写的顺序依次显示这四种水果。如果想以不同顺序显示，需回到代码中按所需顺序重写。一旦按语法写好并准备执行，就无法再更改顺序。\n\
    \n### 嵌套循环\n\n最后要介绍的循环类型是嵌套循环。它的独特之处在于会在一个循环内部运行另一个循环。两个循环都将继续其路径并持续运行，直到全部完成。这有时看似多余，但在许多编写代码的场景中却是必需的。\n\
    \n例如，您可能需要编写一个乘法表（从 1 到 10 并列出答案）。若逐行编写代码来生成此表，代码量将巨大。虽然可行，但即使是初学者也能看出这需要大量时间和精力。\n\
    \n更好的方法是使用以下代码：\n\n```python\n# write a multiplication table from 1 to 10\nfor\
    \ x in range(1, 11):\n    for y in range(1, 11):\n        print('%d * %d = %d'\
    \ % (x, y, x*y))\n```\n\n运行该程序后，输出将类似于：\n\n```text\n1 * 1 = 1\n1 * 2 = 2\n1 *\
    \ 3 = 3\n1 * 4 = 4\n...\n1 * 10 = 10\n2 * 1 = 2\n2 * 2 = 4\n...\n10 * 10 = 100\n\
    ```\n\n请在编译器中运行并观察结果。您只需四行代码即可生成完整的乘法表。想想若用传统方式逐行编写需要多少行代码？此表仅用几行就完成了，充分展示了嵌套循环的强大与高效。\n\
    \n循环是添加到代码中的绝佳选择。在许多情况下，您需要创建循环并将其嵌入代码中。您可以利用它在极少行数内完成大量编码工作，同时清理代码，在不编写过多代码的前提下实现相同功能。编译器会持续读取循环，直到您设定的条件不再有效。这为代码开启了更多可能性，同时保持了代码的整洁与可管理性。\n\
    \n## 类的重要性\n\n使用 Python 时，一个非常重要的事实是它被组织为类。我们在使用 Python 时会大量接触到类，因为这是我们在编写语言时保持事物有序且易用的主要方式。\n\
    \n描述类的方式有很多，但基本上，它们是容器，用于存放对象，并确保我们能在合适的时间轻松提取所需部分。您可以将任何对象放入类中，但必须确保该对象放在特定类中是合理的。例如，如果有一个关于鱼的类，却放入了一架飞机，这讲不通。您在大多数情况下可以自行决定如何组织，但必须考虑什么最适合您的需求，并思考这对其他人和您的类来说是否合理。\n\
    \n### 创建类\n\n首先要了解的是如何创建类。为此，我们需要在命名类之前使用正确的关键字。您可以为类命名任何喜欢的名称，只需确保名称紧跟在关键字之后，且命名为日后易于记忆的内容。\n\
    \n给类起好名字后，接下来是命名子类。这部分将放在括号内，帮助我们遵循一些正确的编程规则。请确保在创建类时，第一行末尾加上冒号（Python 语法要求），以遵循正确的编程规范。\n\
    \n好消息是，创建自己的类只需记住这些，而且这个过程往往听起来比实际更复杂。开始编写自己的类所需的步骤包括：\n"
