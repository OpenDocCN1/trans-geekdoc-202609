    我们现在对云数据安全采取更长远的视角。我们正在创造新技术来解决问题。然而，这些新技术并没有让问题消失，而是为解决旧问题提供了新的视角。本节重点介绍了三个可能对云数据存储的隐私和安全带来长期挑战的技术趋势：物联网、量子内存和基于
    DNA 的数据存储设备。


    ### 7.2.1 物联网


    物联网（`IoT`）与无处计算以及连接到互联网的设备有关。海量的设备和收集的数据量为只有云计算才能提供的大规模数据分析提供了机会。因此，我们现在看到了物联网云（`CoT`）的兴起。物联网云将为物联网中是最简单的设备提供实际上无限的数据存储和数据处理能力（


    具备网络功能的设备数量持续增长，涵盖了从家电、手表到汽车的设备。虽然互联网连接允许这些设备为用户提供有用数据，但这些设备也可以让你的数据暴露给他人，提供如位置、当前活动、随时间变化的活动甚至你的情绪等信息，并可以将这些信息与你现有的画像进行关联的能力。通过物联网，我们每个人都变成了“公民传感器”。


    你的位置、周围的视听、你与人及物的互动以及你的情绪都代表了关于你的数据，你可能希望保持这些数据的隐私和安全。即使在公共场所，大多数人也会有人跟踪他们并记录他们所做的一切感到不舒服。你的智能设备将这些数据放在云端供他人使用。


    Google Glass 允许人们下载其周围环境的数据，并捕获和上传它和你收集的新信息。图像可能其他信息可能包含他人。此类设备将人变成了数据收集工具。每个拥有此类设备的人实际上都变成了一个移动的
    CCTV 摄像头，记录他们视范围内每个人的活动，外记录他们自己的活动和吸引他们注意的事物。快速的人脸识别算法和专用处理器将推动我们走向每个人（无论是否连接）的实时识别和追踪。想象一下，广告商能够访问此类表面在公共场所收集的数据，他们可以利用这些数据来识别你并追踪你的活动，作为其营销研究的一部分。如果他们仅将这些信息用于定向广告，那么这可能对你和广告公司都是双赢的。在更阴险的一面，这些数据的存在让你容易受到意图不明的未知人的侵害。此外，这些数据通过提供关于你与谁交往、你在特定时间所在地、你在做什么等信息，可能产生刑事和民事法律后果。在极端情况下，1942
    年纳粹德国的弗兰克家族无法在不被察觉的情况下到达避难所。


    能够连接到互联网的日常物品的种类和数量将增加。这种物联网提供了在云端存储关于你的新类型数据的新方法。你将自己和周围人的实时数据提供到云端。任何时候，提供商、提供者的第三方客户和黑客都可以登录并下载你数据的最新版本。将其视为协作云数据服务吧。你更新你的生活，其他人阅读并从中获利，希望在这个过程中不会给你带来不便。可能会出什么问题呢？


    惠尔士普在 2014 年关于物联网的报告（


    最近，数据监视小组发现一个位于俄罗斯的网站显示了网络摄像头的直播画面（


    ### 7.2.2 未来数据存储


    在本书中，我们讨论了云存储与数据安全相关的各个方面。目前，大多数存储提供商使用磁性介质，即涂有铁磁材料的旋转磁盘或圆柱体，这些材料被磁化为两个方向之一，用于表示二进制的
    `1` 或 `0`。`1`s 和 `0`s 在磁盘上特定的可寻址位置写入和读取。硬盘最早由 `IBM` 在 20 世纪 50 年代发明，并于 1956 年上市。


    另一方面，固态硬盘使用半导体芯片代替磁性介质来存储数据。它没有移动部件。二进制 `1`s 和 `0`s 使用开启或关闭的晶体管表示。优点是固态硬盘访问速度快。缺点是由于底层物理机制，它们会随时间衰减，连接在反复的擦写周期中会产生电阻。目前可用的固态设备在发生这种情况之前可以提供
    50000 次擦写周期。


    如前，固态硬盘正成为云存储用户的一种选择，尽管需要额外的成本。在不久的将来，随着这种存储设备技术的价格更具竞争力，固态硬盘可能会变得更加普及。然而，尽管底层技术不同，安全和隐私问题依然存在。


    ### 7.2.3 量子内存


    可能影响云存储未来的一个领域是量子计算。全球范围内大学的物理学家正在利用量子物理概念突破边界，利用原子核来存储数据。具体来说，在加拿大的西蒙·弗莎大学（`SFU`），研究人员将量子位（称为
    `qubits`）形式的信息编码在纯硅基底的磷原子核中。他们使用磁场脉冲倾斜原子核的自旋来“写入”量子内存。由于 `qubits` 依赖于原子核的自旋，将这些材料保持在绝对零度附近非常重要，这可以减少原子级的噪声并提高量子比特的稳定性。`SFU`
    研究的有趣之处在于，他们能够在室温保持量子比特稳定性 39 分钟，并在温度升高并回回绝对零度时操纵量子比特（


    `qubits` 有许多有趣的特性，研究人员正在研究这些特性。在量子系统中，`qubit` 存储在叠加态中，可以同时代表 `1` 和 `0`。研究人员指出，这种特性使得
    `qubits` 能够同时执行多次计算。


