    - 谁执行了审计？（项目）

    - 何时执行的？（项目）

    - 结果是什么？（项目）

    - 是否有完整的结果供审查？（是）


    ### 6.3.15 云存储存储数据时需要考虑的其他事项

    本节提出了在使用云存储服务时应该考虑的问题。这些问题的答案是主观的，取决于云存储的实际应用和使用。提供这些问题是为了帮助开始就应该考虑的云存储方面进行对话。


    - 云存储对组织有哪些风险和收益？

    - 如果云提供商倒闭了怎么办？

    - 如果云提供商被卖给其他公司怎么办？

    - 如果云数据中心位于政治或财务动荡的国家怎么办？

    - 你是否需要对单一服务提供商提供的备份进行备份？

    - 如果你正在将数据迁移到云端，需要多长时间？

    - 带宽要求是什么？

    - 组织和云提供商能否支持上传/下载带宽要求？

    - 云提供商是否提供使用物理介的数据迁移？

    - 如果你更换云服务提供商，云服务提供商是否有相应的程序来促进传输？

    - 该过程需要多长时间？

    - 如果存储在云端的数据损坏，根据可能损坏的数据类型，对组织会有什么影响？


    ## 6.4 总结

    本章重点介绍了评估云存储的最佳实践。提供了一个基于数据类型、内容和敏感性确定云端存储数据安全和隐私需求的示例。然后将其与用户的“需知情权”相结合，以制定数据安全策略。文中提供了一个清单，有助于说明在确定数据云存储安全需求时需要考虑的问题类型。


