    第 5 章


    # 隐私工具


    本章讨论了其他类型的隐私保护，用以补充或替代云存储提供商所提供的保护。双重身份验证使您的移动设备成为保护云数据隐私的工具。自行加密数据的工具可以将加密密钥和密码保留在您自己的控制和查看范围内。隐私和安全取决于良好的密码，因此我们展示了关于创建和管理强密码的工具和建议。如果连接到云端的设备缺乏安全性，那么保护云端数据将意义不大，因此我们还讨论了保护这些设备上私有数据的工具。作为标准商业云数据存储的替代方案，我们提出了私有化和点对点的分布式存储选项。企业和组织可以考虑购买
    `Security-as-a-Service`（安全服务）来将其云数据安全管理外包。最后，我们提供了一份利用这些工具保护私有数据的最佳列表。


    ### 关键词


    隐私工具；密码；密钥管理；`Security-as-a-Service`

