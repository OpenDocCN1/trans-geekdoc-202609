    it leaves its network to be stored at the cloud provider’s location. Since the
    PII is encrypted prior to transfer, the cloud service provider does not have access
    to PII – they only have random encrypted bits. This requires the covered entity
    maintain and control access to the encryption key.


    As described in the section on HIPAA, the covered entity is responsible for the
    actions of their business partners, including cloud service providers. In the
    case of HIPAA, a special contract is *required* between the covered entity and
    the cloud provider that spells out the security requirements for managing and
    storing PHI. These security requirements must meet HIPAA standards. If the cloud
    provider is a qualified business associate and implements the security requirements
    defined by HIPAA, then it is possible that the cloud storage provider could manage
    the encryption key(s) and still be in compliance with HIPAA regulations.


    Another way that PII can be protected is to remove any identifying information
    from the PII before it is transferred and stored. While this is possible, it may
    not meet the requirements of SOX and Dodd-Frank which require complete transactional
    records to be kept. De-identified PII is often used for research in health care
    and for other government statistical purposes. HIPAA has a provision for a limited
    data set, from which most but not all potentially identifying information has
    been removed.


    ## 4.4 Laws and Regulations of Other Countries


    So far we have focused on the laws of the United States that govern data that
    is stored in the cloud. Other countries have passed laws to protect the privacy
    of their citizens. With the Internet and multi-national companies that have worldwide
    data storage facilities, the idea of borders and jurisdictions become complicated.
    While countries can pass laws to protect their citizens’ privacy, it is difficult
    in the current environment to keep data from crossing borders and being used for
    whatever purpose. What is unlawful in one country may be perfectly legal in another.
    This section will provide an overview of some of those laws and provide references
    to more detailed information.


    ### 4.4.1 European Data Protection Directive of 1995


    The European Data Protection Directive of 1995 was created to ensure that data
    are protected in the same manner throughout the European Union. This provides
    a framework and a set of principles to assist in data-related compliance for companies
    doing business with countries in the EU. Rather than having to navigate the data
    regulatory laws of 28 different EU countries, companies doing business in the
    EU would have a single source to ensure compliance. The directive also expands
    the rights of the individual to be informed of the types of data that is collected
    and challenge the way this data are handled. The individual has the right to know
    which government agencies have access to which kind of personal data.


    This directive was agreed to by EU members in 1995. That was in the pre-dawn of
    the Internet and decades before the concept of cloud computing and storage and
    did not anticipate or accommodate technological changes and developments such
    as data globalization, social networks, and cloud computing. As a result, the
    European Commission determined that new guidelines for data protection and privacy
    were needed. The commission has set forth a set of proposals for a comprehensive
    reform of the Data Protection Directive that updates and modernizes the principles
    defined in the 1995 Directive.


    The European Commission defines personal data as “any information relating to
    an individual, whether it relates to his or her private, professional or public
    life. It can be anything from a name, a photo, an email address, bank details,
    and posts on social networking websites, medical information, or a computer’s
    IP address.” The reforms are summarized in the EU Commission’s fact sheet (


    #### 4.4.1.1 Benefits for EU Citizens


    The data protection reform will strengthen citizens’ rights and thereby help restore
    trust. Better data protection rules mean you can be more confident about how your
    personal data is treated, particularly online. The new rules will put citizens
    back in control of their data, notably through:


    • **A right to be forgotten:** When you no longer want your data to be processed
    and there are no legitimate grounds for retaining it, the data will be deleted.
    This is about empowering individuals, not about erasing past events or restricting
    freedom of the press.


    • **Easier access to your own data:** A right to data portability will make it
    easier for you to transfer your personal data between service providers.


    • **Allowing you to decide how your data is used:** When your consent is required
    to process your data, you must be asked to give it explicitly. It cannot be assumed.
    Saying nothing is not the same thing as saying yes. Businesses and organizations
    will also need to inform you without undue delay about data breaches that could
    adversely affect you.


    • **The right to know when your data has been hacked:** For example, companies
    and organizations must notify the national supervisory authority of serious data
    breaches as soon as possible (if feasible within 24 hours) so that users can take
    appropriate measures.


    • **Data protection first, not an afterthought:** “Privacy by design” and “privacy
    by default” will also become essential principles in EU data protection rules
    – this means that data protection safeguards should be built into products and
    services from the earliest stage of development, and that privacy-friendly default
    settings should be the norm – for example, on social networks or mobile apps.


    #### 4.4.1.2 Benefits for Business


    Data is the currency of today’s digital economy. Collected, analyzed and moved
    across the globe, personal data has acquired enormous economic significance. According
    to some estimates, the value of European citizens’ personal data has the potential
    to grow to nearly €1 trillion annually by 2020. Strengthening Europe’s high standards
    of data protection is a business opportunity. The European Commission’s data protection
    reform will help the digital single-market realize this potential, notably through
    four main innovations:


    • One continent, one law: The Regulation will establish a single, pan-European
    law for data protection, replacing the current inconsistent patchwork of national
    laws. Companies will deal with one law, not 28. The benefits are estimated at
    €2.3 billion per year.


    • One-stop-shop: The Regulation will establish a “one-stop-shop” for businesses:
    companies will only have to deal with one single supervisory authority, not 28,
    making it simpler and cheaper for companies to do business in the EU; and easier,
    swifter, and more efficient for citizens to get their personal data protected.


    • The same rules for all companies – regardless of their establishment: Today
    European companies have to adhere to stricter standards than companies established
    outside the EU but also doing business with the Single Market. With the reform,
    companies based outside of Europe will have to apply the same rules. We are creating
    a level-playing field.


    • European regulators will be equipped with strong enforcement powers: data protection
    authorities will be able to fine companies who do not comply with EU rules with
    up to 2% of their global annual turnover. The European Parliament has even proposed
    to raise the possible sanctions to 5%. Privacy-friendly European companies will
    have a competitive advantage on a global scale at a time when the issue is becoming
    increasingly sensitive.'
