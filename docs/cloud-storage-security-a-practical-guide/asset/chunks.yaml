    Parents and family members can violate the privacy of children by posting sensitive
    information or pictures. Sometimes this happens without considering the consequences.


    Before the Internet, many children and adults experienced the trauma of having
    their parents show embarrassing photos to friends who came to visit. Internet
    social media has the potential to amplify this trauma by exposing the photos to
    more people and making them harder to forget.


    Parents sometimes use social media to punish their children in view of the world.
    One parent, after catching his young daughter lying about her age, had her wear
    a shirt with her age and posted the photo to `Facebook`.


    Some parents use social media to discuss medical, psychological, or disciplinary
    issues with their children. Parents did these things before the Internet. However,
    social media includes vastly more people in the discussion and effectively leaves
    a permanent record. Even when laws allow parents to make public sensitive information
    about their children without consent, parents should consider their children’s
    privacy before sharing information in the cloud.


    Parents need to consider the consequences of punishing their children by putting
    photos and other information about their children on social media. Doing so amplifies
    the severity of the punishment and may perpetuate it long after its intended duration.


    ## 3.5 Summary


    Data privacy challenges exist because your data has value to so many, both the
    content of the files, the metadata associated with the files, and the identities
    of those who access the files. Experts expect more incidents of data breaches
    as more people migrate sensitive data to cloud storage. Using cloud storage to
    make your data available from anywhere could have legal implications in regard
    to travel, foreign and domestic laws, employment, and insurance. We all worry
    about criminals stealing data. However, we should worry equal about ourselves,
    families, and friends exposing our private data. In the extreme, some must worry
    about privacy violations by authoritarian governments.


