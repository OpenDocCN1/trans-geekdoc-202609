    \ with what they do with the information and your personal privacy:\n\nWhen you\
    \ register with Yahoo! and sign in to our services, you are not anonymous to us.\n\
    \n(Yahoo! and Google generally adhere to a similar core set of personal identifying\
    \ information (PII) uses. They use this information to customize advertising and\
