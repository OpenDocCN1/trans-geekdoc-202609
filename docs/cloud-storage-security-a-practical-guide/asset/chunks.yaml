    \ country. We prefer that cloud storage providers give their customers a readily\
    \ accessible and exhaustive list of the countries with their data centers. You\
    \ cannot assume that a provider based in your country has data centers only in\
    \ your country. Often they will lease space with global data centers, so your\
    \ data could physically reside anywhere in the world. Data privacy and security\
    \ protections you expect in your country might not apply in countries where your\
    \ provider stores it.\n\nWe looked to the cloud storage provider websites for\
    \ security information for our evaluation. Our failure to identify privacy and\
    \ security features does not mean they do not exist. However, we suggest caution\
    \ when considering cloud storage from providers who do not clearly and obviously\
    \ state useful details about how they protect your privacy and data security.\n\
    \n## 1.4 Cloud-Based Data Sharing\n\nWe distinguish between cloud storage and\
    \ cloud data sharing because sharing data with others adds additional security\
    \ issues to those of storing data for personal use only. Cloud-based data sharing\
    \ includes social media, shared file storage, and collaborative work spaces. Individuals\
    \ use cloud-based data sharing to exchange photos, music, or thoughts with a small\
    \ group of friends. Companies use cloud-based data sharing to enable employees\
    \ to access data remotely and to collaborate with customers. Research institutions\
    \ want to collect, analyze, and share data with others. This has tremendous value\
    \ for science.\n\nIssues to consider for cloud-based data sharing fall into three\
    \ categories:\n\n• Member trust\n\n• Access control"
