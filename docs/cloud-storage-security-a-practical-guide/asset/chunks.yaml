- fmt: '

    Some private P2P file sharing tools allow for sharing only among trusted hosts.
    RetroShare ([http://retroshare.sourceforge.net/](http://retroshare.sourceforge.net/))
    calls itself a “secure decentralized communication platform.” You can use RetroShare
    to provide your own private cloud storage solution. RetroShare uses `SSL` to encrypt
    data in transit, but you will still need to consider data privacy and security
    at the endpoints. To use RetroShare, users might have to configure their own firewalls
    to open a port and forward requests to the computer running RetroShare. Similar
    P2P file sharing options include GigaTribe ([http://www.gigatribe.com/](http://www.gigatribe.com/))
    and Infinit ([https://infinit.io/](https://infinit.io/)).


    Cubby ([https://www.cubby.com/](https://www.cubby.com/)) by LogMeIn offers a secure
    cloud storage solution that, for a fee, allows users to avoid storing data in
    the cloud. Instead, files distribute directly between peers. Cubby keeps dynamic
    DNS and firewall issues transparent to users. Cubby also has security features
    for revoking permissions and erasing files on devices.


    ## 5.8 Security-as-a-Service


    Security-as-a-service (`SECaaS` or `SaaS`) provides cloud data security with a
    cloud service. The `SECaaS` market continues to grow, especially as more small
    and medium size companies look to the cloud to reduce costs and improve efficiency.
    SECaaS allows smaller companies and organizations to outsource cloud security
    and leverage the infrastructure and expertise of dedicated cloud security experts.


    SECaaS creates a layer between applications and cloud data. This layer provides
    identity and access management (`IAM`) and allows for single-sign-on (`SSO`) for
    all cloud accounts. Applications attempting to access cloud data are redirected
    to the SECaaS, which authenticates the user and provides a single-sign-on (`SSO`)
    for the user to all managed cloud data across all cloud storage providers. Policy-driven
    key management allows organizations to coordinate data encryption and access.
    The service manages and distributes keys to authorized users and devices then
    uses policies to control access to encrypted data. Key management may include
    encryption key rotation to coordinate distribution of new keys and decrypting
    data encrypted with old keys. Full service SECaaS comprises a number of security
    services, including email virus scanning, encryption, encryption key management,
    and vulnerability scanning.


    Many well-known companies in cloud and computer security have products and services
    for SECaaS and `IAM`. Among these include Oracle ([http://www.oracle.com/](http://www.oracle.com/)),
    TrendMicro ([http://www.trendmicro.com/](http://www.trendmicro.com/)), McAfee
    ([http://www.mcafee.com/](http://www.mcafee.com/)), and Symantec ([http://www.symantec.com/](http://www.symantec.com/)).


    ## 5.9 Summary


    Throughout this chapter we have discussed tools for individuals and both small
    and large companies and organizations to protected their cloud data. These tools
    make it easier to manage cloud data security yourself or augment cloud data security
    provided to you by others.


    Regardless of the tools and services you use to protect your cloud data, your
    own mind represents one of the best tools for data privacy. Develop and practice
    these attitudes and habits to maximize the effectiveness of your data privacy
    tools.


    * Resist putting any private data in cloud storage without encrypting it first.

    * Use file naming conventions that do not leak metadata about the contents of
    the file, its creator, or origin.

    * Carefully review the security policies of the cloud storage provider before
    uploading private data. Seek reviews of their security from objective and trusted
    experts. Look carefully at the details about sharing files and any attached metadata.
    Know your rights if the cloud storage provider suffers a data breach or loses
    your data, and what privacy laws apply to your data.

    * Secure devices you use to access cloud storage. Apply the latest operating system
    patches. Update software. Use virus scanners, firewalls, and intrusion detection
    systems (`IDS`).

    * Only access your cloud data from trusted devices on trusted networks.

    * If you must use an untrusted device, keep applications and data on your own
    USB stick. This will not protect you from keystroke loggers or possibly having
    your private data cached on the untrusted hard disk, but it might help keep your
    data from discovery.

    * Limit the number of people with access to your private data. When they no longer
    need access, revoke their access privileges, change passwords, and/or re-encrypt
    the data.

    * Instruct people with access to your private data about security practices you
    expect them to follow.

    * When accessing your device and cloud storage accounts, beware of shoulder surfers
    and surveillance cameras that could observe you entering passwords.

    * Do not let others use devices that you use to access or cache your private data.
    The person might see your private data, copy it to an external device, send it
    as an email attachment, or download malware.

    * Take care when keeping local copies of your cloud data. You may want to have
    local copies of your data so that you can access it regardless of cloud storage
    provider or network availability, but realize that each copy becomes a vulnerability.

    * Applications that access your cloud data should never remain logged in or remember
    your username and password. Always log out of your cloud storage accounts when
    not using them. Turn off auto-sync so that even those who successfully log in
    to your device must still negotiate a separate login to get to your private data.
    This will protect your private data, but will require you to re-login each time
    you want to access files stored in the cloud.

    * Follow best practices for managing your passwords, including changing your passwords
    frequently and using strong, random passwords.


    ## References


    1. Bletchley Park. Breaking Enigma. [Online] [http://www.bletchleypark.org.uk/content/hist/worldwartwo/enigma.rhtm](http://www.bletchleypark.org.uk/content/hist/worldwartwo/enigma.rhtm)
    (Last accessed May 2015).

    2. Duckett, C., 2012. Pairing Apache and Google Authenticator. Tech Republic.
    [Online] 3 September. [http://www.techpublic.com/blog/australian-technology/pairing-apache-and-google-authenticator/](http://www.techpublic.com/blog/australian-technology/pairing-apache-and-google-authenticator/)
    (Last accessed May 2015).

    3. Price, J., 2015. PAM Module Instructions. [Online] 9 March. [https://github.com/google/google-authenticator/wiki/PAM-Module-Instructions](https://github.com/google/google-authenticator/wiki/PAM-Module-Instructions)
    (Last accessed May 2015).

