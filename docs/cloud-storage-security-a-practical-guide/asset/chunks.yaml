    - Google, 2015. 隐私与政策。[在线] [`www.google.com/intl/policies/`](https://www.google.com/intl/policies/)

    - GSA, 2015. 隐私。[在线] [`www.gsa.gov/content/10256`](https://www.gsa.gov/content/10256)

    - IT Target, 2015. 安全性。[在线] [`www.ittarget.com/security/`](http://www.ittarget.com/security/)

    - Microsoft, 2015. 安全与合规性。[在线] [`support.microsoft.com/fwlink/40124`](https://support.microsoft.com/fwlink/40124)

