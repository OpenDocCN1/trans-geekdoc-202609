    The Gramm–Leach–Bliley Act (`GLBA`), also known as the Financial Services Modernization
    Act of 1999 is commonly pronounced “glibba,” was enacted on November 12, 1999.
    It requires financial institutions to establish standards for protecting the security,
    integrity, and confidentiality of their customers’ nonpublic personal information.
    Nonpublic personal information (`NPI`) is any “personally identifiable financial
    information” that a financial institution collects about an individual in connection
    with providing a financial product or service, unless that information is otherwise
    publicly available. Section `501(b)` of the act specifies the objectives of these
    standards:


    *   The `Financial Privacy Rule` – secure the privacy of customer information
    and records

    *   The `Safeguards Rule` – provide ongoing protection against threats to the
    security and integrity of customer information

    *   The `Pretexting provisions` – prevent unauthorized access and use of customer
    information by accessing private information using false pretenses (e.g., phishing,
    social engineering)


    The law covers a broad range of financial institutions, including many companies
    not traditionally considered financial institutions because they engage in certain
    “financial activities.” The privacy rule applies to businesses that are “significantly
    engaged” in “financial activities” as described in section `4(k)` of the `Bank
    Holding Company Act`. This can include banks, lenders, check cashers, wire transfer
    services, sellers of money orders, credit counselors, financial planners, tax
    preparers, accountants, and investment advisors, loan brokers and services, debt
    collectors, real estate settlement services, and others


    `GLBA` guidelines direct financial organizations to “evaluate” the use of encryption
    to secure customer information while in motion and at rest. The Federal Financial
    Institutions Examination Council is a formal interagency body of the US government
    made up of five banking regulators, including the `Federal Reserve Board of Governors`,
    and others, that is “empowered to prescribe uniform principles, standards, and
    report forms, and to promote uniformity in the supervision of financial institutions”


    `GLBA` prohibits the sharing of certain kinds of customer financial information
    with unaffiliated parties. A cloud storage company may be considered an unaffiliated
    party so the encryption of customer information should be done prior to being
    transmitted to the cloud provider for storage. Some cloud providers allow customers,
    in this case the financial institution, to provide and manage their own encryption
    keys. This would meet the intent of `GLBA` if the encryption is done prior to
    leaving the financial institutions premises and the cloud provider does not have
    access to the key; otherwise there is a possibility that cloud provider employees
    could access covered data. Encryption of data prior to transfer also addresses
    the risk of disclosure or alteration of sensitive information in transit, although
    most if not all cloud storage service providers use `SSL` for data in motion.


    Additionally, `GLBA` requires that financial institutions give customers written
    privacy notices that explain their information-sharing practices.


    Information on the content of the notification, who should receive it, how often,
    opt-out requirements, etc. can be found at `http://www.ftc.gov`.


    ### 4.2.4 SOX


    The Sarbanes-Oxley Act (`SOX`) of 2002, administered by the `Securities and Exchange
    Commission` (`SEC`), was established to regulate the financial practices of companies
    and protect against fraud. The bill was enacted as a reaction to a number of major
    corporate and accounting scandals, including `Enron`, and `WorldCom`. Many publicly
    held companies and registered public accounting firms come under the jurisdiction
    of `SOX`, which defines a set of standards and guidelines for.


    Section `404` of `SOX` requires that companies establish and maintain adequate
    internal control over financial reporting and report on the effectiveness of these
    controls annually. Section `302` of `SOX` requires that officers certify the accuracy
    of financial reports and provides for criminal penalties for altering, destroying,
    or falsifying records. Section `802` of `SOX` requires that auditors maintain
    work papers for at least seven years.


    The `SOX` act is designed to protect investors by improving the accuracy and reliability
    of corporate disclosures.

