- fmt: "\nAnother property that is intriguing in the application of quantum computing\
    \ to cloud security is the concept of quantum entanglement. Entanglement is a\
    \ property that allows a set of `qubits` to express a high degree of correlation\
    \ even if separated by distance. The implications of this property is that if\
    \ a set of entangled `qubits` are in different locations, a change in value of\
    \ a `qubit` at one location will also be reflected in the `qubit` value in another\
    \ location – without any physical connection. (Actually, if the `qubit` in one\
    \ location has a value, or spin, interpreted as 1, then the value of its entangled\
    \ `qubit` will be 0, and vice versa, which can easily be accounted for in its\
    \ interpretation). In a research paper entitled Unconditional Quantum Teleportation\
    \ between Distant Solid-State Quantum Bites\n\nIn the future, quantum communications\
    \ and quantum networks may provide a new modus operandi to securely transmit and\
    \ store data in cloud structures without the need for transport encryption. Many\
    \ research hurdles are left to conquer. And as usual, this new technology will\
    \ inevitably provide new opportunities and a new set of security challenges.\n\
    \n## 7.2.4 The Future of Storage Technology – DNA\n\nWe now take a look at the\
    \ cutting edge of research in storage technology and consider what the more distant\
    \ future of storage technology has in “store.” Specifically we look at one possible\
    \ future that brings together biology and computer science to provide massive\
    \ storage capabilities that can store data for hundreds of thousands or even millions\
    \ of years. The new approach has some built-in security features that are unavailable\
    \ in current technology, but as with most new technology, it comes with its own\
    \ set of new security concerns.\n\nEvery living creature on earth shares one thing\
    \ in common: they contain the molecular instructions for life called deoxyribonucleic\
    \ acid or `DNA`. Encoded within `DNA` are the instructions for building, maintaining,\
    \ and replicating an organism. The information in `DNA` is stored as a code made\
    \ up of four chemical bases: adenine (A), guanine (G), cytosine (C), and thymine\
    \ (T). Human `DNA` consists of a set of about 3 billion of these bases. The order,\
    \ or sequence, of these bases determines the information available for building\
    \ an organism, similar to the way in which letters of the alphabet appear in a\
    \ specific order to form words, sentences, paragraphs, and chapters\n\n`DNA` bases\
    \ pair with each other in sets of two: A with T and C with G, to form units called\
    \ base pairs. Together, a base, sugar, and phosphate are called a nucleotide.\
    \ `Nucleotides` are arranged in two long strands that form a spiral called a double\
    \ helix, as shown below.\n\n![](images/F000071u07-01-9780128029305.jpg)\n\nStructure\
    \ of the double helix (Courtesy of the National Human Genome Research Institute’s\
    \ Talking Glossary [http://www.genome.gov/glossary/])\n\nThe structure of the\
    \ double helix is somewhat like a ladder, with the base pairs forming the ladder’s\
    \ rungs and the sugar and phosphate molecules forming the vertical sidepieces\
    \ of the ladder\n\nFrom biology we know it is the order of the bases along a single\
    \ strand that determines the genetic code. Bases are read in sets of three to\
    \ form the instruction, or code, (in biology they are called `codons`) that determine\
    \ which amino acid (building block) to use. A sequence of amino acids, called\
    \ a `gene`, are linked together to form a protein by reading the `nucleotides`\
    \ along a `DNA` strand. Certain three-letter nucleotide `codons` specify start\
    \ and stop positions within the `DNA` strand, much like the computer programming\
    \ language construct `BEGIN/END`, or the bit sequences found in communication\
    \ protocols, or end-of-file markers\n\n## 7.2.5 Biology to Computer Science\n\n\
    In the simplest case we could use the A-T base pair to represent binary 0 and\
    \ G-C to represent binary 1. Using this encoding and keeping with biological constructs,\
    \ reading a sequence of three `nucleotides` at a time we could represent `2^3`\
    \ binary values (0–7 decimal) per read; reading 32 sets of 3 `nucleotides` would\
    \ result in 96 bits, or 12 bytes of data. For example if we look at the `DNA`\
    \ diagram we see that the first three base pairs (starting from the top) are C-G,\
    \ T-A, and G-C, which using our encoding scheme would represent 010.\n\nCurrent\
    \ research in this area has used different encoding and representational schemes.\
    \ Church, Gao, and Kosuri, in their paper “Next-Generation Digital Information\
    \ Storage in DNA,” calculate that a single-strand of `DNA` can store 5.49 petabits\
    \ per cubic millimeter. One petabit is equal to 1000 terabits, or `10^15` bits.\
    \ Church’s experiments showed that the total writing, amplification, and reading\
    \ process resulted in 10 bit errors out of 5.27 megabits\n\nStill, there are many\
