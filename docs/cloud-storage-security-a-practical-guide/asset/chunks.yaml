- fmt: '

    We now take a longer term view of cloud data security. We create new technologies
    to solve problems. Yet, these new technologies do not so much make the problem
    go away as they provide a fresh perspective on the old problem. This section highlights
    three technology trends that will likely provide long-term challenges to cloud
    data storage privacy and security: the Internet of Things, quantum memory, and
    DNA-based data storage devices.


    ### 7.2.1 Cloud of Things


    The Internet of Things (`IoT`) relates to ubiquitous computing and the pervasiveness
    of devices connected to the Internet. The sheer number of devices and the volume
    of data collected create an opportunity for large-scale data analysis that only
    cloud computing can provide. Hence, we now see the emergence of the Cloud of Things
    (`CoT`). The CoT will give effectively unlimited data storage and data processing
    capabilities to even the simplest devices in the IoT (


    The number of network-enabled devices continues to grow with devices ranging from
    home appliances, watches, to automobiles. While Internet connectivity allows these
    devices to provide useful data to the user, these devices can also make your data
    available to others, providing information such as location, current activity,
    activity over time, even your mood, and the ability to correlate this information
    with your existing profile. With the Internet of Things, we each become “Citizen
    Sensor.”


    Your location, sights and sounds around you, your interactions with people and
    things, and your mood all represents data about you that you might want to keep
    private and secure. Even when in public, most people would feel uncomfortable
    with someone following them around and recording everything they did. Your smart
    device puts this data in the cloud for others to use.


    Google Glass allows people to download data about their immediate surroundings
    and also to capture and upload new information that it and you collect. Images
    and perhaps other information may include other people. Such devices transform
    people into data collection tools. Every person with such a device effectively
    becomes a mobile CCTV camera recording the activities of every person in their
    view, in addition to recording their own activities and what attracts their attention.
    Fast facial recognition algorithms and dedicated processors will advance us toward
    real-time identification and tracking of everyone, connected or not. Imagine advertisers
    able to access such data, ostensibly collected in public places, who could use
    this to identify you and track your activities as part of their marketing research.
    If they only use this information for targeted advertising then it might involve
    a win-win for both you and the company doing the advertising. On the more sinister
    side, the existence of this data makes you vulnerable to unknown people with unknown
    intentions. In addition, this data can have both criminal and civil legal ramifications
    by providing information on who you associate with, where you were at a specific
    time, what you were doing, etc. In the extreme, the Frank family in 1942 Nazi
    Germany would not have gotten to a safe house unobserved.


    The variety and number of everyday items able to connect to the Internet will
    increase. This Internet of Things offers new ways to store new types of data about
    you in the cloud. You make real-time data about yourself and those around you
    available in the cloud. At any time, providers, third-party customers of the provider,
    and hackers can login and download the latest version of your data. Think of it
    as collaborative cloud data service. You update your life, others read it and
    profit from it, hopefully without inconveniencing you in the process. What could
    possibly go awry?


    A 2014 Hewlett-Packard report on the Internet of Things (


    Recently, data watchdog groups found a Russian-based website showing live feeds
    from webcams (


    ### 7.2.2 Future Data Storage


    In this book we have discussed the various aspects of cloud storage as it relates
    to data security. Currently most storage providers use magnetic media, a spinning
    disk or cylinder coated with ferromagnetic material that is magnetized in one
    of two directions, which is used to represent a binary `1` or `0`. The `1`s and
    `0`s are written and read at specific addressable locations on the disk. Hard
    drives were first invented by `IBM` in the 1950s and were commercially available
    in 1956.


    Solid state drives on the other hand, use semiconductor chips instead of magnetic
    media to store data. There are no moving parts. Binary `1`s and `0`s are represented
    using transistors that are switched on or off. The advantage is that solid state
    drives have faster access times. Their disadvantage is that they tend to decay
    over time because of the underlying physics of the transistor and connections
    tend to build up electrical resistance with repeated erase/write cycles. Currently
    available solid state devices can deliver up to 50000 erase/write cycles before
    this occurs.


    As previously pointed out, solid state drives are becoming an option for users
    of cloud storage, albeit at an additional cost. In the near future solid state
    drives will likely become more prevalent as the cost of this storage device technology
    becomes more competitive in price. However, the same security and privacy issues
    remain despite the underlying technology.


    ### 7.2.3 Quantum Memory


    One area of research that may impact the future of cloud storage is quantum computing.
    At universities worldwide, physicists are pushing the envelope using the concepts
    of quantum physics to store data using the nucleus of atoms. Specifically, at
    Canada’s Simon Fraser University (`SFU`) researchers have encoded information
    in the form of quantum bits, called `qubits`, into the nuclei of phosphorus atoms
    held in a purified substrate of silicon. They used magnetic field pulses to tilt
    the spin of the nuclei to “write” qubit memory. Since `qubits` rely on the spin
    of nuclei, it is important that these materials are kept near absolute zero, which
    minimizes noise at the atomic level and increases the stability of `qubits`. What
    makes the `SFU` research interesting is that they were able to maintain qubit
    stability at room temperature for 39 minutes and were able to manipulate qubits
    as the temperature climbed and fell back toward absolute zero (


    `qubits` have a number of interesting properties that researchers are investigating.
    In a quantum system, a `qubit` is stored in a superposition state where it can
    represent both `1` and `0` at the same time. This property, as researchers note,
    enables `qubits` to perform multiple calculations simultaneously.

