  trans: "\n邮件系统包含大量的个人信息。大多数此类服务都提供在线日历、联系人列表、日程、聊天会话以及电子邮件通信。在注册这些`free` 服务时，用户需要提供某些信息以换取免费服务。虽然这些信息是由服务用户自愿提供的，但其他信息则会经过整合和聚合，以提供用户的行为画像。关于收集、聚合和使用了哪些信息的示例，可以在用户在注册服务时同意的隐私政策和用户服务条款（TOS）协议中找到。在同意之前，你确实是仔细阅读了这些内容的，对吧？以下是邮件服务提供商“可能”收集的信息示例：\n\
    \n- 你在注册时`freely` 提供的个人个人信息\n- 你的姓名、电子邮件地址、电话号码、出生日期、性别、邮政编码、职业、行业和个人兴趣\n- 针对某些金融产品和服务，他们可能还会要求提供：\n\
    \    - 你的地址、社会安全号码、信用卡号以及有关你资产的信息\n- 邮件服务提供商在你在使用产品或服务时收集的个人信息，包括：\n    - 你使用了哪些服务\n\
    \    - 你访问了哪些页面\n    - 你如何使用这些服务\n    - 你如何与广告互动——你点击了哪些广告\n    - 从其他公司获得的你的信息\n\
    \    - 关于你交易的信息\n    - 关于你使用金融产品和服务的信息\n    - 设备和浏览器信息\n    - IP 地址\n    - 设备标识符\
    \ – MAC 地址\n    - Cookie 信息\n    - 软件和硬件属性\n    - 操作系统和浏览器版本\n    - 提供商在他们的服务器日志上存储的信息\n\
    \    - 查询记录\n    - 位置信息\n    - 访问日期和时间\n    - 本地存储——服务提供商也可能会在你设备上存储他们收集的信息\n\n\
    顺便提一下，收集软件和硬件属性可用于对特定计算机或设备进行画像分析和唯一标识。这可以用于识别不同的在线身份实际上是同一个人。例如，假设 Alice 创建了一个电子邮件账户\
    \ `bob@gmail.com`，然后使用该电子邮件地址以化名 Charlie 注册了 Facebook 账号。Alice 还使用同一台设备在 `acme.com`\
    \ 查看工作邮件。通过设备画像分析和访问时间分析，可以将 Alice、Bob 和 Charlie 关联在一起，并且有很高的概率可以确定他们是同一个人。从这些账户及其关联\
    \ Cookie 中收集的信息可以与注册时的数据聚合，以构建出更稳健的 Alice 人口统计和行为画像。\n\n### 2.1.3.9 来源于 Google\
    \ 隐私政策\n\n……我们可能会替换与你的 Google 账户关联的旧名称，以便我们在所有服务中的呈现保持一致。如果其他用户已经有了你的电子邮件或其他识别你的其他信息，`我们可能会向他们展示你公开的\
    \ Google 个人资料信息，例如你的姓名和照片`。\n\n（似乎存在，如果 Alice 使用自己的真实使用电子邮件和其他服务，那么在 Facebook\
    \ 上与 Bob 通信的人可能会看到 Alice 的简介和照片。）\n\n### 2.1.3.10 邮件服务提供商如何使用这些信息\n\n那么，所有这些信息在收集后会发生什么呢？首先，Yahoo!\
    \ 在如何处理信息和你的个人隐私方面非常透明：\n\n当你在 Yahoo! 注册并登录我们的服务时，你对我们来说并不是匿名的。\n\n（Yahoo! 和 Google\
    \ 通常遵循相似的核心个人身份识别信息 (PII) 使用 set。他们使用这些信息来定制广告和内容、建议/提供产品和服务、改进他们的服务、进行研究，并为内部和外部客户提供匿名报告。\n\
    \n他们还会根据保密协议向信任的合作伙伴提供这些信息。这些公司可能会使用你的个人信息就营销合作伙伴的优惠与你进行沟通。然而，根据提供商的隐私政策，这些公司没有共享这些信息的独立权利。\n\
    \n这些服务收集的个人信息也受相关州和联邦法律的约束。它们还受到民事诉讼的影响。它们必须响应传票、法院命令、法律程序和国家安全指令。根据提供商的隐私政策，国家安全指令是有效的来自联邦机构的传票，要求披露客户记录（司法部（DOJ）。国家安全指令实际上是联邦调查局\
    \ (FBI) 的指令，你将不会收到通知。\n\n信息还可以在民事诉讼中被请求，例如医疗过失和违约。这将需要法院命令。此外，除了法律调查，邮件提供商可以使用他们收集的数据调查欺诈、对人员的威胁以及违反使用条款。）\n\
    \n### 2.1.3.11 邮件服务提供商的差异\n\n除了所有邮件提供商都遵循的邮件访问法律问题，我们的最初问题仍需解决：是否其他人可以访问/读取我的邮件和附件？\n\
    \n### 2.1.3.12 来源于 Google 服务条款\n\n我们的自动化系统分析你的内容（包括电子邮件），以提供个性化的产品功能，例如定制搜索结果、定制广告以及邮件和恶意软件检测。这种分析在内容发送、接收以及存储时进行。\n\
    \n（所以“其他人可以读取我的邮件”的答案是肯定的。此外，这意味着任何向 Gmail 地址发送邮件的人即使他们与 Gmail 没有关联且没有同意 Google\
    \ 的任何条款，他们的邮件也会被扫描和阅读。这也回答了关于加密存储的问题。如果对存储数据进行“分析”，则数据必须是明文而非加密。此外，Google 的条款还规定：当你通过我们的服务上传、提交、存储、发送或接收内容时，你授予\
    \ Google（以及我们的合作伙伴）全球范围内的许可使用、托管、存储、复制、修改、创建衍生作品（例如为了使你的内容更好地适用于我们的服务而进行的翻译、改编或其他更改）、传播、发布、公开表演、公开展示和分发此类内容。（这让“不要把出现在纽约时报首页的内容放在邮件里”这句话有了新的含义。）\n\
    \n从业务角度来看，通过 Gmail 账户发送业务信息似乎并不保密，且是一个重大的安全担忧。）\n"
