    Zero-knowledge encryption will compete with default encryption for securing cloud
    data. Recent incidents in the news about governments, companies, and criminals
    continue to erode the trust people have in cloud storage providers to manage data
    encryption. Cloud data storage providers will promote zero-knowledge encryption
    as the only real way to secure personal or corporate data. Companies especially
    will look to zero-knowledge encryption to protect their data.


    ### 7.1.4 Anonymity Networks


    For those seeking to protect their cloud meta-data, anonymity networks like `Freenet`
    ([https://freenetproject.org](https://freenetproject.org)), `I2P` ([https://geti2p.net/](https://geti2p.net/)),
    and `Tor` ([https://www.torproject.org/](https://www.torproject.org/)) will grow
    in popularity. These anonymity networks allow for anonymous access to cloud storage.
    You must still encrypt the stored data, but the anonymity network prevents your
    provider from tracking your IP address or physical location. `Tails` ([https://tails.boum.org/](https://tails.boum.org/))
    provides a live operating system with `Tor` and other tools for anonymous Internet
    activity. Tails can be installed on and executed from a USB memory stick, leaving
    no trace on the host computer once Tails is shutdown and the memory stick is removed.
    The creators of Tails have the goal of making anonymity online easily accessible
    to everyone anywhere.


    On the negative side, using these anonymity networks to move even encrypted data
    in and out of the cloud creates the possibility that a rogue node will make a
    copy of the data and attempt a brute force or cryptographic attack on it. Furthermore,
    anonymity networks do have vulnerabilities that can expose the identity of users.
    On the positive side, the hypothetical increase in anonymity of the increasing
    size of these networks will make them more secure for users, and more difficult
    for those wanting to monitor your on-line activity.


    ### 7.1.5 Monetizing Security and Privacy


    We expect to see growth in niche services that provide cloud data privacy. Data
    security comes at a price and free cloud data storage costs somebody. Cloud storage
    providers typically use free accounts to build a customer base to attract investors,
    show advertisements, and sell additional services. These activities, to do well,
    require user data, hence the need to collect information from user metadata and
    content. Reputable companies do not use this data maliciously. However, its existence
    makes it attractive to criminals and authoritarian governments.


    Cloud storage providers could seek to increase sales with fee for accounts offering
    encryption and security compliance, e.g., `Safe Harbor` or `HIPAA`. Providers
    might offer free accounts with large amounts of unencrypted storage, and then
    encourage users to secure it with encryption for a fee. The assurance of compliance
    with independent security standards will also draw more businesses into using
    cloud data storage and services.


    Expect to see social networking sites offering no user data collection for a fee.
    Premium accounts will enable more privacy and security options. Other social networking
    sites will try different business models to find a niche in the cloud data security
    and privacy market. The social network site `Ello` ([https://ello.co/](https://ello.co/))
    formed as a Public Benefit Corporation with the pledge of not collecting user
    data for tracking, selling user data, or profiting from advertising. It remains
    to be seen how successful this for-profit business model will become in the cloud
