  raw: 'Consider the case where an observer has access to only your cell phone metadata
    for calls and text. This metadata includes who you call, when you call, from where
    you call, and how quickly you answer. From this limited metadata, researchers
    found they could predict the Big Five Personality traits (neuroticism, extraversion,
    conscientiousness, agreeableness, and openness) of the user significantly better
    than random (


    Cloud data security should also include a consideration of information that could
    uniquely identify a person. Cloud storage providers may collect a variety of user
    data, such as real name, email, phone, physical address, IP address, MAC address,
    physical location (from GPS or IP geolocation), contacts, browser history, and
    cloud storage usage patterns. They can collect much of this data through both
    client applications and server-side interfaces.


    Cloud storage providers will use your data and metadata to improve their quality
    of service (QoS) to you. This affords justification to them for searching your
    data and metadata for clues to provide advertising links that generate clicks
    and sales to their advertisers. They might also sell this data to third parties.
    However, usage patterns could leak information about sensitive activities about
    individuals or companies. For example, a company might show more or less activity
    related to certain files before making public announcements. The ability to predict
    the timing and nature of such announcements could provide others with valuable
    insider information about the company.


    Some providers may also scan your files for patterns of colors, shapes, or terms.
    In addition to looking for terms to use for targeted advertising or sale to third
    parties, cloud storage providers may scan images using face recognition software
    or other software to detect things like pornography or even commercial products
    appearing in you these images.


    The HTTP protocol allows providers to track your browser history through the REFERER
    header field. This field gives the provider the site you visited just prior to
    their site and might also contain search query data. Accessing your cloud storage
    by logging in through a social media site might give the cloud storage provider
    permission to retrieve your social media data as well. Third-party cookies in
    your browser can also reveal to others at least the time patterns that you do
    things with your cloud storage. Smart phone applications that access cloud storage
    collect information about your location from Wi-Fi access points and about your
    contacts.


    We include in our discussion of cloud data security the concept of data availability.
    People and organizations put data in the cloud because they want it available
    anywhere, anytime. Your inability to access your critical data represents a security
    concern, whether that unavailability comes from technical or legal issues, or
    malicious action. The legal and financial stability of the data storage provider
    deserves consideration. Bankruptcy or legal action against the company could make
    your data unavailable to you, temporarily or permanently, and with little notice
    for you to prepare alternatives. Also, such action could put your data in the
    hands of other entities and agencies. You should also consider your cloud storage
    provider’s policies and procedures to protect their network from intrusions, denial
    of service attacks, malicious insiders, and hardware failures. The geographic
    location of the data center(s) can affect availability. Natural disasters far
    away can destroy your data or temporarily deny you access to it.


