- fmt: "\nThe Recording Industry Association of America (RIAA) and the Motion Picture\
    \ Association of America (MPAA), among others, have concerns about cloud storage\
    \ used to illegally share copyrighted material. The Digital Millennium Copyright\
    \ Act (DMCA) gives copyright holders legal authority to act against suspected\
    \ copyright violators. While `DMCA` tactics and enforcement remains controversial,\
    \ these organizations do have a valid point. They sell copyrighted material for\
    \ use by one person. If that person makes copies and gives or sells them to others,\
    \ then they have potentially deprived the copyright holder of material benefit.\
    \ This issue does not happen for physical items like cars. When you purchase a\
    \ car, you can use it or let some else use it. You cannot make free copies of\
    \ the car and give them away. However, you can do this with digital media and\
    \ this creates difficulties for copyright holders.\n\nCivil litigation, such as\
    \ from business lawsuits or divorce, may give others legal access to your cloud\
    \ data. Requests for this data will go to your cloud provider, who will likely\
    \ comply with any legitimate legal request. As a result, unknown others may view\
    \ your sensitive data and download and archived by the court to places not under\
    \ your control and for an unknown time. Furthermore, the data they view or download\
    \ may not in fact relate to the litigation, but get included because of the scope\
    \ of the data request.\n\nLegal warrants could make a significant amount of your\
    \ data accessible to law enforcement and whatever agency (public or private) tasked\
    \ to analyze your data. This means others will have full access to your data,\
    \ with no guarantee of what will happen to this data or how it will get used or\
    \ by whom.\n\nPolice stops and security checkpoints give law enforcement a warrant\
    \ or justification to access your data. The legal status of devices in the United\
    \ States remains dynamic and ambiguous. This means both you and authorities could\
    \ misinterpret your responsibilities. In the United States, a password might fall\
    \ under the Fifth Amendment, but a biometric lock might not. As a case in point,\
    \ a court in Virginia recently ruled that a password has Fifth Amendment protection\
    \ because it represents knowledge, while a fingerprint does not because it serves\
    \ as a physical key (\n\nGiven the current legal ambiguities over cloud data and\
    \ electronic media in general, authorities might consider action to protecting\
    \ your data after they confront you as unlawful. Your refusal to allow authorities\
    \ access to your device and the data accessible from it could result in your arrest.\
    \ Even if you acted correctly, you could suffer from a misinterpretation of data\
    \ privacy and security laws. In such situations, even if you win the legal case,\
    \ you still lose in terms of time, money, stress, and opportunities lost by dealing\
