  raw: 'Are data-at-rest and data-in-motion secure? Who has access to documents? What
    are the privacy issues when storing documents in the cloud?


    #### 2.4.2.2 Security Concepts


    The security concepts for data-in-motion and data-at-rest also apply to office
    suite documents. That is, data is vulnerable while in transit between the device
    creating and editing documents and while at rest in the cloud storage facility.


    Both Google Docs and Microsoft Office 365 use HTTPS and SSL to secure data-in-motion.
    They differ slightly in their approach to data at rest. Microsoft charges a monthly
    or yearly fee to use their service, while Google Docs is free for individual use,
    Google does charge a fee for business use. As a result their privacy policies
    differ significantly.


    #### 2.4.2.3 Google Docs


    Data created in Google Docs is automatically encrypted before it is written to
    cloud storage and it is automatically decrypted when accessed by an authorized
    user. Documents and metadata are encrypted with a document-unique key using 128-bit
    AES encryption. That key is then encrypted with an encryption key associated with
    the account owner. They keys are additionally encrypted by one of a rotating set
    of Google’s master keys. These encryption keys are created and managed by Google.
    They provide an option for users to create and manage their own keys.


    “Each Cloud Storage objects data and metadata is encrypted with a unique key under
    the 128-bit Advanced Encryption Standard (AES-128), and the per-object key itself
    is encrypted with a unique key associated with the object owner. These keys are
    additionally encrypted by one of a regularly rotated set of master keys. Of course,
    if you prefer to manage your own.”


    If the vendor manages the encryption keys they have access to your data. They
    can be compelled to release encryption keys and encrypted data through court order,
    subpoena, through government actions, such as through a National Security Letter.
    To protect data stored in the cloud, encryption must be done on the client side
    before the document is transported for storage, and the key would have to be unknown
    to vendor. It must be noted that users are also subject to court orders and subpoenas,
    which would have the same result and allow data to be decrypted.


    #### 2.4.2.4 Privacy


    Google treats Google Doc document as content. In their TOS they state that automated
    systems analyze your content and the results are used for targeted advertising
    and other purposes as described in [Section 2.2](#chp002.xhtml#s0110). This analysis
    occurs as the content is sent, received, and when it is stored.


    Google also states that by using their service you give Google and their partners
    a worldwide license to use, host, store, reproduce, modify, create derivative
    works, communicate, publish, publicly perform, publicly display and distribute
    content that you create. This includes Google Doc documents.


    This stance on privacy is in line with their business model of building user demographic
    and behavioral profiles to target advertising. The user trades privacy for free
    access to Google services.


    #### 2.4.2.5 Microsoft Office 365


    Microsoft encrypts data both at rest and via the network as it is transmitted
    between a data center and a user. For data at rest Microsoft uses BitLocker 128-bit
    AES drive encryption to securely store documents in the cloud. BitLocker encrypts
    the entire storage drive. They also are rolling out per file encryption in the
    near future (


    #### 2.4.2.6 Privacy


    Microsoft takes a different approach to data privacy. They plainly state that
    they do not mine or access your data for advertising purposes. You own the data
    you create, process, and store with Microsoft Office 365. It is their policy to
    not use your data for purpose other than to maintain and provide Office productivity
    services.


    The Office 365 customer owns the data they create, and retain the rights, title,
    and interest in the data stored in the Office 365 cloud.


    #### 2.4.2.7 Conclusion


    For both Google Docs and Microsoft 365 data-at-rest and data-in-motion are secure.
    They use HTTPS and SSL/TLS for transport and both use encryption for data-at-rest.
    They take different approaches to encryption: Google Docs uses a three-key encryption
    approach; Microsoft uses whole drive encryption, with individual file encryption
    being added in the near future.


    Google’s privacy policy allows them and their partners to scan and analyze documents
    to build customer profiles. This information is combined with data gathered from
    other Google services. Profiles are used for target advertising and for other
    purposes, such as research.


    Google’s privacy policy gives them and their partners a worldwide license to use,
    reproduce, create derivative works, publish, and distribute content that you create.
    Google Docs are not private.


    Microsoft’s privacy policy takes the approach that your data is yours. They do
    not use it for target advertising or for any other purpose other than to provide
    the customers online document creation and storage.


    Google Docs is free for consumers; there is a charge for business customers. Microsoft
    365 charges both business and consumers for use. They do have a free online version
    that requires internet connectivity to create and edit documents.


    ## 2.5 Health Apps


    ### 2.5.1 Background


    As people become more health conscience, health and fitness applications (apps)
    that run on smartphones and tablets have become a growing industry. There are
    more than 40,000 health-related apps for the Apple iOS iPhone and iPad devices.
    Similarly there are also thousands of health and fitness apps available for the
    Android platform. Many of these apps are free or cost a few dollars. The big money
    driver is in subscription services that provide cloud storage and analysis of
    the data that is collected, which is reported to be a 4.5-billion-dollar business.
    This data may also generate revenue by being sold to third parties and data aggregators.
    With free apps, like free services, read the app’s privacy policy before agreeing
    to the TOS agreement.


    ### 2.5.2 Case Studies


    In this section we analyze the risks to privacy and security in using health and
    fitness apps that run on smartphone and tablet platforms. We explore the safeguards,
    or lack thereof, in the regulatory and medical oversight in the analysis that
    they provide and in the information that these apps collect.


    #### 2.5.2.1 Security Concepts


    Health apps, like all other applications which use the cloud for data storage,
    must implement good security procedures: secure access control, authentication,
    data-in-motion, and data-at-rest, as previously discussed in this chapter. In
    addition, there are new wearable devices that collect health information, such
    as the Apple Watch and other smartwatches. The communication channel between the
    watch and the smartphone must be secure. Some wearable devices are standalone,
    which are secure provided that access to the physical device is controlled. Others
    use Wi-Fi or Bluetooth for communication. Data security using Wi-Fi depends on
    the security configuration of the Wi-Fi access point. Bluetooth is generally considered
    to be secure, but recently the security firm Bitdefender demonstrated how Bluetooth
    communications between Android smartwatches and smartphones could be vulnerable
    to attacks that can enable the interception of messages and data.


    Bluetooth technology uses a secure encryption algorithm to protect data during
    transmission (data-in-motion) from one device to another. While no wireless technology
    is completely secure, Bluetooth is reasonably secure for communications. There
    can be other vulnerabilities in using Bluetooth, such as in the device pairing
    process.


    #### 2.5.2.2 Questions


    Is the data collected by health and fitness apps secure in the cloud? What are
    the risks to privacy? Are there protections and regulations that govern health
    and fitness data?


    #### 2.5.2.3 Efficacy and Oversight'
