    \n? ?  \n\n### 4.2.2 Dodd-Frank\n\nThe purpose of the `Dodd-Frank Wall Street\
    \ Reform and Consumer Protection Act` is to “promote the financial stability of\
    \ the United States by improving accountability and transparency in the financial\
    \ system to protect the American taxpayer by ending bailouts, to protect consumers\
    \ from abusive financial services practices, and for other purposes.” To achieve\
    \ these goals, organizations that are subject to this Act must collect, store,\
    \ maintain, and provide search capabilities for all communication records relating\
    \ to transactions. This includes electronic mail, instant messages, and recordings\
    \ of telephone calls, both fixed line and mobile phones.\n\nIt requires that records\
    \ of all communications that relate to each transaction, regardless of the medium,\
    \ must be stored. They must be able to be retrieved in a way that allows the reconstruction\
    \ of the communication, both pre- and post-trade, and keep all records together\
    \ with all pertinent data and memoranda.\n\nRecord retention varies based on record\
    \ type. Since transactional records provide trade-related information, retention\
    \ requirement is set to the life of a swap, plus 5 years. For voice communication,\
    \ the retention period is 1 year. For non-transactional records, retention is\
    \ set to 5 years from the moment record was created. Since financial instruments\
    \ can last for many years, as in the case of long-term bonds, the aggregate retention\
    \ period could conceivably extend up to 30 years (`[ndm.net](http://ndm.net)`).\n"
