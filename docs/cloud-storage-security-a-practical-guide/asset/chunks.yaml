    # Facebook 分享并接收广告合作伙伴的信息。服务条款（TOS）指出，如果他们收到了尚未拥有的数据，将在 180 天内对数据进行匿名化处理，并停止将这些信息与用户关联。文中并未说明他们在
    180 天内会对这些数据进行什么处理。


    他们从其他 Facebook 用户处收集并汇总关于你的信息，例如“当朋友在照片或视频中标记你、提供朋友详情或表示与你有关系时”。


    照片和视频包含元数据，可以提供关于照片拍摄地点、拍摄时间、纬度经度、相机品牌和型号等信息。Facebook 不会删除这些信息。他们声称，如果你不想存储并因此共享这些信息，你应该在上传之前删除元数据。元数据对隐私构成了风险。


    例如，如果你分享了一张在家里举办的生日派对照片，元数据可能会揭示拍摄日期和地点。通过这些信息，可以确定你的出生日期和家庭位置。利用这些信息并搜索美国大多数州和县提供的公开房产记录，可以确定你何时购买的房屋、支付了多少钱、平面图，以及如果有贷款的话，贷款人是谁。然后使用谷歌街景（Google
    Street View），你可以在社区周围“驾驶”，查看从街上看你房子的样子。


    交换图像文件格式（EXIF）元数据是一种标准格式，用于存储在 JPEG JPEG 压缩数字相机/手机图像文件中。这些元数据可以使用 EXIF 查看器和编辑工具（如
    IrfanView、EXIFtool 和各种浏览器插件）轻松解析。这些工具和其他工具可以删除存储在 JPEG 图像中的身份信息。也有网站可以上传图片并查看元数据，正如你可能猜到的，这是另一种用户生成的安全风险。


    Facebook 允许对共享内容设置限制。在隐私设置选项卡中，他们有一个与“所有人”（everyone）共享的概念，这意味着数据是公开可用信息，互联网上的每个人都可以访问。“所有人”数据受第三方搜索引擎的索引，并且当你访问互联网上的网站时，可能会在
    Facebook 之外与你关联。Facebook 和其他机构可能会导入和导出这些数据，且没有隐私限制。你在 Facebook 上发布的某些类型信息的默认隐私设置被设置为“所有人”。从个人隐私的角度来看，这是一个信息宝库，可以并且会被“他人”在未经你许可的情况下使用，因为你在注册时已经同意了这一点。


    Facebook 提供了一种方法，让你删除在 Facebook 上发布的“所有人”可见的内容，他们会从你的 Facebook 资料中将其删除。他们还声称，他们对
    Facebook 之外的使用没有控制。从 Facebook 中删除信息并不能保证数据在互联网的其他地方不存在。


    任何你提供信息权限的人（默认情况下是所有人）“可能会使用 RSS 馈送、手机地址录或复制粘贴功能，从 Facebook 捕获并导出信息，包括你的信息和关于你的信息。”。


    ## 2.3.2.7 Facebook 如何使用他们收集的数据


    在 Facebook 隐私政策的第 4 节中，他们描述了对收集的数据如何处理。“我们允许广告商选择查看其广告的用户特征，我们可能会使用我们收集的任何非个人身份识别属性（包括你可能决定不向其他用户显示的信息，例如你的出生年份或其他敏感个人信息或偏好）来为这些广告选择合适的受众。”


    Facebook 可能会在给朋友显示的广告旁边显示你的名字和个人资料，这可能包含个人身份识别信息。这是默认行为，但你可以选择退出（opt out）。


    为了补充你的资料，Facebook 可能会从你的朋友那里收集并汇总信息。与其他社交媒体提供商一样，Facebook 可能会根据传票、法院命令或其他请求（如国家安全信函）披露信息。这适用于他们有合理理由认为法律要求回复的刑事案件。它也适用于民事事宜，例如医疗疏忽、人身伤害和离婚。


    他们还声称，这可能包括来自“美国境外管辖区的请求，我们有合理理由认为该管辖区的当地法律要求回复适用于该管辖区的用户，并符合通常接受的国际标准。”隐私和言论自由在不同国家有不同的含义。请了解你所在国家的法律。你放在
    Facebook 上的数据并不是私密的。


    通过使用 Facebook，你同意你提供的信息在美国被收集和处理。这使得所有 Facebook 用户都受美国法律的约束，并且你的数据可能会受到传票和国家安全信函的影响。


    全球政府正在向 Facebook 请求用户信息。据报道，这些请求在 2013 年后六个月增加了 24%。在 2015 年发布的一份报告中，Facebook
    表示，在 2015 年上半年，他们收到了 15,433 次美国政府有关 23,667 个账户相关的数据请求。他们执行了超过 80% 的请求。


    Facebook 提供了一种删除账户以及他们代表你存储的信息的方法。然而，隐私政策中所述的已共享或提供的的内容可能在 Facebook 之外仍然可见且可用。


    ## 2.3.2.8 结论


    像 Twitter 和 Facebook 这样的社交媒体网站存储了用户为了使用其免费服务而自愿提供的个人和其他数据。他们的业务模式依赖于利用这些数据进行目标广告和其他用途。这些公司以及其他公司可以将用户提供的数据与从外部来源收集的数据相结合，以开发用户的人口统计和行为特征分析。


    ## 2.4 办公套件


    ### 2.4.1 背景


    在本节中，我们从安全的角度查看云端办公套件，这包括对文档传输和云存储的分析，以及数据隐私问题。


    Google Docs 和 Microsoft 365 都是 SaaS 云端办公套件。它们提供了基于 Web 的文字处理、表格、演示和绘图应用程序。它们还通过云提供多设备文档存储和共享。最初这些套件安装在个人计算系统上，但随着高速互联网接入的普及，这些套件正向云端迁移。有多个供应商这种在线功能，在本节中我们使用案例研究法分析其中的两种：Google
    Docs 和 Microsoft 365。


    ### 2.4.2 案例研究：云端办公套件安全对比（Microsoft Office 365 和 Google Docs）


    #### 2.4.2.1 问题


