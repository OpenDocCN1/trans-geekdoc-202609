    \ Alice creates an email account, `bob@gmail.com` and then signs up for a Facebook\
    \ account using that email address, under the pseudo-name Charlie. Alice also\
    \ uses the same device to check work email at `acme.com`. Using device profiling\
    \ and access time analysis, Alice, Bob, and Charlie can be linked together, and\
    \ with high probability it can be determined that they are the same person. Information\
    \ gathered from these accounts and their associated cookies can be aggregated\
    \ with data at signup to build a more robust demographic and behavioral profile\
    \ of Alice.\n\n### 2.1.3.9 From Google’s Privacy Policy\n\n…we may replace past\
