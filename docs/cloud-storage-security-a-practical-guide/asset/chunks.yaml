  trans: '

    - **策略**：建立访问控制策略、程序和技术，仅限授权人员访问受保护的健康信息（PHI）。

    - **物理安全**：控制对存储 PHI 区域的物理访问。

    - **技术安全**：实施技术安全机制（如加密），以保护传输中和静态存储的 PHI 数据。

    - **备份**：建立适当的数据备份、灾难恢复和应急操作策略。


    HIPAA 适用于“受保护实体”，其定义为：(1) 医疗计划，(2) 医疗保健结算中心，以及 (3) 以电子方式传输任何健康信息的医疗保健提供者。即使这些实体与被称为“业务伙伴”的其他组织签订了合同以执行其某些核心职能，它们仍受隐私标准的约束。该法律并未赋予美国卫生与人类服务部（`HHS`）通过本条例监管其他类型私营企业或公共机构的权限。例如，`HHS`
    没有权限监管雇主、人寿保险公司或提供社会保障或福利补助的公共机构。


    大多数医疗保健提供者和医疗计划都会外包其部分医疗保健活动和功能。他们经常使用其他个人或企业的服务。HIPAA 隐私规则要求受保护实体从其业务伙伴处获得满意的保证，确保该伙伴将妥善保护其代表受保护实体接收或创建的
    PHI。这些保证必须以书面形式存在，无论是以受保护实体与业务伙伴之间的合同或其他协议的形式。


    云服务提供商在 HIPAA 隐私规则下被视为业务伙伴。受保护实体与其业务伙伴的合同必须：


    - 描述业务伙伴对 PHI 的允许和强制用途。

    - 规定业务伙伴不会在合同允许或要求或法律要求之外使用或进一步披露 PHI。

    - 要求业务伙伴使用适当的保护措施，以防止在合同定义之外使用或披露 PHI。


    如果受保护实体获知业务伙伴存在违反约（违约）或违规行为，受保护实体需要采取合理步骤弥补违约或终止违规，如果此类步骤未成功，则终止与业务伙伴的合同。


    HIPAA 规定了受保护实体在保护 PHI 方面的总体通用要求。其之后是一系列管理和技术要求，这些要求可以是“强制的（required）”，也可以是“可选的（addressable）”。如果一项实施规范被描述为“强制的”，则必须实施该规范。“可选实施规范”这一概念的开发是为了为受保护实体在遵守安全标准方面提供额外的灵活性。在满足包含可选实施规范的标准时，受保护实体必须对每项可选规范执行以下操作之一：


    - 实施可选的实施规范

    - 实施一个或多个替代安全措施以实现相同的目的

    - 既不实施可选实施规范也不实施替代方案


    受保护实体的选择必须记录在。受保护实体必须决定给定的可选实施规范是否为在其特定安全框架内应用的合理且适当的安全措施。此决定将取决于多种因素，例如实体的风险分析、风险缓解策略、已采取的安全措施以及实施成本。受保护实体就可选规范所做出的决策必须以书面形式记录。书面文档应包括所考虑的因素，以及作为决策依据的风险评估结果（


    ### 4.2.1.1 通用要求


    HIPAA 定义了创建、存储、维护和使用 PHI 的通用要求。受保护实体必须确保所有接收、维护或传输的 PHI 数据的机密性、完整性和可用性，并必须能够防止任何对信息安全或完整性的“合理可预见的威胁或危害”。


    受保护实体还必须防止任何在 HIPAA 下不允许或要求的此类信息的“合理预见”的使用或披露，并确保其员工的合规性。这意味着存在培训计划，且员工和业务伙伴接受了处理
    PHI 的培训。


    在满足 HIPAA 定义的保护 PHI 要求方面，采取的方法具有一定的灵活性。受保护实体可以使用任何“合理且适当”地实施 HIPAA 标准和规范的安全措施。


    在决定使用何种安全措施时，受保护实体必须考虑以下因素：


    - 受保护实体的规模、复杂性和能力

    - 实体的技术基础设施、硬件和软件能力

    - 安全措施的成本

    - PHI 潜在风险的概率和关键性


    ### 4.2.1.2 管理措施


    管理措施定义了保护 PHI 需要的政策和流程。受保护实体必须拥有一处理 PHI 的管理流程，以实施防止、检测和纠正安全违规的政策和程序。需要数据备份计划，以建立并实施创建、维护和恢复
    PHI 确切副本的程序。还需要灾难恢复计划以及相关程序，以便在自然灾害或人为灾难发生时恢复 PHI，并防止数据丢失。


    还需要应急操作计划，以建立并实施在应急模式下运行关键业务流程以保护 PHI 数据安全的程序。应急模式运行必须定期进行测试，并根据需要对应急计划进行修订，这包括支持应用程序和
    PHI 数据。


    ### 4.2.1.3 技术措施


    HIPAA 定义了针对访问控制、传输中数据和静态数据要求的的技术措施。受保护实体必须对维护 PHI 数据的计算系统实施技术政策和程序，以限制仅限获得访问权限的人员访问。每个用户都要求有一个唯一的用户标识符（`ID`）。该
    `ID` 用于识别和跟踪用户访问 PHI 的活动。必须实施审计控制，以记录并提供检查 PHI 访问和处理活动的能力。为了防止用户账户无人，必须实施自动注销，在预定的活动时间后终止用户会话。


    HIPAA 要求必须实施加密和解密 PHI 的机制。它没有直接规定何时对数据进行加密/解密，除非“合理且适当”这样做。考虑到这种灵活性，PHI 在传输中和静态存储时应进行加密。加密直接解决了在传输、接收、维护和存储时
    PHI 的数据机密性要求。加密算法的选择、实施细节和使用由受保护实体决定。


    为了确保 PHI 数据的完整性，受保护实体必须实施政策和程序以保护 PHI 免受不当篡改或破坏。它还必须建立紧急情况下的获取和访问 PHI 的应急访问程序（


