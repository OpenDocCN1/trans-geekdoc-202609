- fmt: '

    Also of concern, is that as information is transformed from the binary 1’s and
    0’s of the digital world into the `A`, `T`, `G`, and `C` of the biological world,
    what does the resulting DNA code for in biological organisms? For example, does
    the photo of your mother in `JPG` format translate into an infectious biological
    virus? Or does reading a biological strand of `DNA` translate into an infectious
    computer virus? The question, from a security perspective, is what is the meaning
    of these seemingly random 1’s and 0’s in biological terms and in computing terms?
    Clearly there are many interesting research problems to consider and to resolve.


    Then there is the ethical issue of whether or not we should be manipulating and
    experimenting with the fundamental mechanisms of life in this way. Answers to
    those questions will be answered by the theologians, philosophers, ethicists,
    and scientists.


    ## 7.2.7 The Cloud – Data, Information, Questions


    Throughout this book, we have discussed the concept of storing information in
    the cloud, but we have not defined information, as a concept. Physicist Eliyahu
    Goldratt has a simple simple and elegant definition: “Information is the answer
    to the question asked.” Data can provide a diverse array of information if we
    ask the right question. The cloud contains the data; it contains some information;
    the future will be determined by the questions we ask. In one possible future,
    using `DNA`, we may become the storage device – where all of us, together, become
    the cloud. Then the problem will be, what questions should we ask? Sound familiar?


