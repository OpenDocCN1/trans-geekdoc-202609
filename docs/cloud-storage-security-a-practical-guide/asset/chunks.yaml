    GLBA prohibits the sharing of certain kinds of customer financial information
    with unaffiliated parties. A cloud storage company may be considered an unaffiliated
    party so the encryption of customer information should be done prior to being
    transmitted to the cloud provider for storage. Some cloud providers allow customers,
    in this case the financial institution, to provide and manage their own encryption
    keys. This would meet the intent of GLBA if the encryption is done prior to leaving
    the financial institutions premises and the cloud provider does not have access
    to the key; otherwise there is a possibility that cloud provider employees could
    access covered data. Encryption of data prior to transfer also addresses the risk
    of disclosure or alteration of sensitive information in transit, although most
    if not all cloud storage service providers use SSL for data in motion.


    Additionally, GLBA requires that financial institutions give customers written
    privacy notices that explain their information-sharing practices.


    Information on the content of the notification, who should receive it, how often,
    opt-out requirements, etc. can be found at [http://www.ftc.gov](http://www.ftc.gov).


    ### 4.2.4 SOX


    The Sarbanes-Oxley Act (SOX) of 2002, administered by the Securities and Exchange
    Commission (SEC), was established to regulate the financial practices of companies
    and protect against fraud. The bill was enacted as a reaction to a number of major
    corporate and accounting scandals, including Enron, and WorldCom. Many publicly
    held companies and registered public accounting firms come under the jurisdiction
    of SOX, which defines a set of standards and guidelines for how data should be
    stored, accessed, and managed.


    Section 802 of Sarbanes-Oxley describes three areas that affect the management
    of electronic records, which impact cloud storage:


    1. Protection of records from destruction, alteration or falsification


    2. Retention period for record storage


    3. Types of information that need to be stored that includes all business records
    and associated communications


    Section 802 of the act states that a company is responsible for any financial
    misconduct, even if it is the fault of a third party. If a company is subject
    to SOX regulation, then this requirement also flows down to their subcontractors
    and service providers, which would include cloud service providers. This implies
    that the service providers must have the necessary processes and controls in place
    to ensure SOX compliance. In order to help determine compliance, a set of auditing
    standards, called the SSAE 16, has evolved.


    The Statement on Standards for Attestation Engagements No. 16 (SSAE 16) is an
    attestation standard put forth by the Auditing Standards Board (ASB) of the American
    Institute of Certified Public Accountants (AICPA) that can be used to evaluate
    internal control over financial reporting. The SSAE 16 standard is a report that
    states that a company has the proper internal controls and processes for the type
    of information and transactions it handles.


    The SSAE 16 SOC 2 report is based on trust service principles (


    • The *security* of a service organization’s system.


    • The *availability* of a service organization’s system.


    • The processing *integrity* of a service organization’s system.


    • The *confidentiality* of the information that the service organization’s system
    processes or maintains for user entities.


    • The *privacy* of personal information that the service organization collects,
    uses, retains, discloses, and disposes of for user entities.


    For cloud providers, having SSAE 16 SOC 2 certification is an industry standards-based
    approach to address SOX compliance.


    ## 4.3 Cloud Storage Provider and Compliance


    The four laws that were discussed in [Section 4.2](#chp004.xhtml#s0015) all have
    similar intent, that is, to protect private information and in some cases to ensure
    that information is not lost or corrupted. Cloud storage provides an excellent
    solution to addresses many of the concerns that are described in these regulations
    as it pertains to data security, integrity, confidentiality, availability, redundancy,
    and disaster recovery. Implementation details are left to the regulated entity
    and their subcontractors and business associates. In all cases, any organization
    that has access to protected data is subject to rules and regulations described
    in the governing Act(s). In addition, businesses that use cloud services must
    have contracts or agreements with cloud third parties that include wording to
    ensure that the service provider is in compliance with regulations and requirements
    of applicable laws.


    Using industry best practices for meeting these requirements is a good starting
    point. The HIPAA Security Standards Matrix, shown in [Table 4.1](#chp004.xhtml#t0010),
    provides an outline of security standards for administrative, physical, and technical
    safeguards. While this specifically applies to HIPAA, the areas discussed have
    applicability to meeting the intent of the other regulatory Acts.


    Encryption of information in motion and at rest is specifically discussed in several
    Acts that were discussed. Encryption is also provided by the majority of cloud
    providers. But it cannot be emphasized strongly enough, that encryption is only
    as secure as the password or pass-phase that controls the encryption key, and
    is only as secure as the people entrusted to maintain and access the key.'
