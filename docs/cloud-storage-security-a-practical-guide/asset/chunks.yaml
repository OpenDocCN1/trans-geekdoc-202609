    ## 2. Email client – It is also possible that there are security flaws in the
    email client that can be exploited, or there are flaws in other applications that
    are running on the device that have vulnerabilities that can be used to access
    email account information. Applications, including mobile device apps, have been
    developed that contain backdoors, data harvesting and exfiltration capabilities
    that users willingly install as free apps on their devices. It is important to
    read the fine print in the terms of service (`TOS`) and privacy policy.


    ## 3. In transit communication – It is also possible to intercept email data while
    in transit between the client sending the email and being received at the email
    server. Until recently, most email was sent in cleartext and could be easily intercepted
    and read with little effort. Currently most browser-based email is sent using
    encryption provided as part of the Hypertext Transfer Protocol Secure (`HTTPS`),
    which layers `HTTP` on top of the `SSL/TLS` security protocol to provide secure
    transport between client and server.


    ## 4. End user behavior – End users can be targeted by attackers using a variety
    of mechanisms, such as phishing, where the user plays an active role by clicking
    on an email attachment or on a web link from someone they know. This technique
    can be used to compromise the user’s security, the security of others on the network,
    and data stored on local servers and in the cloud. A recent example was publicized
    where an email was sent to a user in the United States State Department, which
    resulted in compromising the State Department’s network. This compromise was then
    used to infiltrate the unclassified network of the White House where data, including
    the daily schedule for the president of the United States, was stored. This type
    of vulnerability has been around for years and is still effective because it exploits
    a well-known dynamic vulnerability: human behavior. The solution is user training
    and user awareness.


    The focus of this section is to identify the security issues involved in using
    cloud-based email and to investigate how these issues are addressed by a cross
    section of currently available cloud-based implementations. Given the four areas
    identified above, our emphasis is on number four, which involves the storage of
    email and attachments.


    ### 2.1.3 Case Studies: Comparison of Cloud-Based Email Security (Gmail, [Outlook.com](http://Outlook.com)
    (Hotmail), Yahoo! Mail)


    ### 2.1.3.1 Questions


    How secure is cloud-based email? Can email and attachments be read by anyone other
    than the sender and receiver? Is privacy at risk? What can be done to make email
    more secure?


    ### 2.1.3.2 Security Concepts


    As mentioned before, there are two areas of concern from a security perspective
    when sending and receiving email: the transmission of the email and the storage
    of the email. These are referred to as data in motion and data at rest, respectively.
    When data, email in this case, is sent from one user to another it passes through
    a number of routers and servers before it is finally delivered to its destination
    where it is stored. Using `HTTPS` can be used in browser-based email to encrypt
    email traffic between source and destination. If only `HTTP` is used, email is
    usually clear text or `base-64` encoded, meaning that it is transferred from source
    to destination in a format that can be easily read, hence it is not secure. `HTTP`
    can be used to transfer encrypted email content, which is considered secure because
    it is encrypted during transmission.


    After email arrives at its destination, text and attachments can be encrypted
    before it is stored. Encryption is a method of converting data, in this case,
    an email message text, into an encoded form using a secret key and an algorithm
    that renders the data unreadable without knowledge of the secret key. When data
    is encrypted, there is a low probability that anyone other than the receiving
    party who has the secret key will be able to decrypt the data and convert it back
    into a readable form. (*Note*: “Low probability” does not mean zero. There are
    techniques that can be used to crack encrypted text if someone has enough motivation.)


    ### 2.1.3.3 Personally Identifiable Information (PII)


    The term `PII` is defined in `OMB Memorandum M-07-1616` refers to information
    that can be used to distinguish or trace an individual’s identity, either alone
    or when combined with other personal or identifying information that is linked
    or linkable to a specific individual. The definition of `PII` is not anchored
    to any single category of information or technology. Rather, it requires a case-by-case
    assessment of the specific risk that an individual can be identified. In performing
    this assessment, it is important for an agency to recognize that non-`PII` can
    become `PII` whenever additional information is made publicly available — in any
    medium and from any source — that, when combined with other available information,
    could be used to identify an individual.


    ### 2.1.3.4 Methods and Results


    To determine the level of security provided by cloud-based email providers, we
    examine the service providers `TOS` agreements, privacy policies, and other publically
    available information.


    In this section we evaluate `Gmail`, `Yahoo! Mail`, and `[Outlook.com](http://Outlook.com)`,
    formerly Hotmail. These email services are accessed (typically) through a web
    browser or a specialized mobile device app. These email services are cloud-based
    `SAAS` with email content stored in the cloud.


    ### 2.1.3.5 Data-in-Motion


    All three email providers use `HTTPS` in the transmission of email between clients
    and servers. This provides a secure connection for data in motion. Here is an
    example of the URL for signing on to `Gmail` at `[gmail.com](http://gmail.com)`:


    https://accounts.google.com/ServiceLogin?service=mail&continue=https://mail.google.com/mail/


    The `HTTPS` protocol is used for signing in to the service, which provides secure
    transmission of the username and password during authentication. `HTTPS` is also
    used during the email session. This is also true for `Yahoo! Mail` and `[Outlook.com](http://Outlook.com)`.


    Recently it was discovered that Google data, including `Gmail`, was being sent
    among Google data centers throughout the world in an unencrypted form. Google
    moves data among their data centers to provide load balancing, data backup, faster
    access, etc.


    ### 2.1.3.6 Data at Rest


    `HTTPS` provides data security and privacy between the user and the service provider’s
    servers. But what happens after the email is delivered to the server? Is it secure
    during storage? Does anyone have access to the email content when it is stored
    in the cloud?


    The short answer is that none of the providers encrypt email that is stored in
    the cloud. They do encrypt and protect login information, but not the actual contents
    of email.


    ### 2.1.3.7 Physical Security


    It is also important that email providers protect the facilities where data is
    stored and control the physical access to the servers that store the email.


    According to Yahoo!’s website, “Yahoo! maintains reasonable physical, electronic,
    and procedural safeguards that comply with federal regulations to protect personal
    information (PII) about you.” From this statement we can assume that Yahoo! maintains
    secure physical structures and personnel access control over their cloud data
    and have procedures and policies that comply with federal regulation to protect
    `PII`. Federal regulations are described in detail in [Chapter 4](#chp004.xhtml#chp004).
    Unfortunately, federal regulations do not require data at rest be encrypted. What
    this means from a security perspective is that if someone is able to breach the
    physical or procedural safeguards, they have access to your data.


    ### 2.1.3.8 Information Collected by Email Service Providers

