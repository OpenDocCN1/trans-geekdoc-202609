    Act of 1999 is commonly pronounced “glibba,” was enacted on November 12, 1999.
    It requires financial institutions to establish standards for protecting the security,
    integrity, and confidentiality of their customers’ nonpublic personal information.
    Nonpublic personal information (NPI) is any “personally identifiable financial
    information” that a financial institution collects about an individual in connection
    with providing a financial product or service, unless that information is otherwise
    publicly available. Section 501(b) of the act specifies the objectives of these
    standards:


    • The Financial Privacy Rule – secure the privacy of customer information and
    records


    • The Safeguards Rule – provide ongoing protection against threats to the security
    and integrity of customer information


    • The Pretexting provisions – prevent unauthorized access and use of customer
    information by accessing private information using false pretenses (e.g., phishing,
    social engineering)


    The law covers a broad range of financial institutions, including many companies
