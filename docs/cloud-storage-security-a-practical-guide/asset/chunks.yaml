    您的联系人列表可能会泄露他人社交网络的信息。联系人列表中的人可能并不认识，但他们代表了某种联系。如果有人参与了极端主义博客的帖子，并将你列入他们的联系人列表中，那么你也与该活动联系在一起了。如果有人将你与疯狂/危险的人联系在一起，他们也会把你归为那一类，而你可能永远无法完全说服他们改变观点。


    使用 `CC` 而不是 `BCC` 向大量人员发送邮件会将每个人的电子邮件地址泄露给其他人。垃圾邮件发送者和黑客对有效的电子邮件地址有极高价值。如果接收其中一封邮件的任何人电子邮件账户被破解，那么列表上的所有人都会受到垃圾邮件发送者和黑客的威胁。此外，它还暴露了社交网络关系。通过提供电子邮件地址邀请人们加入群组，或向人们发送新闻故事链接，会在未经许可的情况下向他人提供有关这些人的信息。


    通过 `Dropbox` 或 `Google Drive` 与他人共享文件也会危及你及他人的数据安全。这些网站的默认共享选项通常允许你分享文件的人将这些文件分享给其他人。礼仪规定，受邀的客人不应自己再次邀请客人。共享云数据也应如此。请确保你选择共享的云数据的默认安全设置不会允许他人共享该数据。此外，要意识到这只能防止无意的一键共享，而不能防止故意的共享。


    在访问属于你及他人的云数据时，你负有责任。在不安全或未经许可的设备上从云端检索数据可能会为你和他人带来问题。例如，许多人在工作时阅读个人邮件或文件附件（例如照片）。这构成了对隐私和安全的违背，因为这些数据会在公司计算机上被缓存和解密。如果你的公司有
    `IT department`，那么你必须意识到他们会例行检查计算机是否存在滥用公司资源的行为。他们会发现你下载的数据，这可能会导致你和他人的尴尬或伤害。当员工无意或恶意地从云存储下载数据到未授权的设备上时，也存在类似的问题。


    你可能会将研究数据（学术或营销）放在云端以便与他人共享协作。虽然这些数据可能不包含你研究中人员的个人身份信息，但数据记录可能包含足够的唯一值，使得某人通过将这些记录与来自其他数据源的相似记录相结合，就能高概率地识别出研究人员。美国人口普查使用了多种策略来防止个人身份信息的未经授权泄露。


    ## 1.2.2 让你的数据进出云端


    人们将数据迁移到云端是为了能够随时随地访问它们。然而，如果你可以随时随地让你的数据在云端进出，那么其他人也可以这样做。


    安全问题出现在端点和网络连接处。你用于访问云端的设备存在安全漏洞。云存储提供商也存在外部和内部漏洞。通过网络传输的数据也面临着安全漏洞。


    你的设备（手机、平板电脑、`PC`、`XBox` 等）以及上面用于访问云数据的软件创建了隐私和安全风险。设备本身可能会自动连接到常见的无线网络服务标识符（`SSID`）。黑客可以设置一个具有相同
    `SSID` 的伪造 Wi-Fi 热点，你的设备会高兴地连接到它。这使得中间人攻击成为可能，让攻击者完全访问你的安全凭据和数据。旧版本的操作系统或带有安全漏洞的软件可能会为攻击者提供针对你数据的基础。访问你数据的软件（包括网络浏览器）可能会记住密码或让你保持登录状态。设备可能会存储你数据的本地副本。小偷可以轻易偷走手机和平板电脑等小设备。其他人也可能借用你的手机。这两种情况都会让你的数据容易被盗或被发现。


    Wi-Fi 热点（包括你的家庭 Wi-Fi）可能会将你的数据暴露给他人。黑客可以设置恶性孪生（evil-twin）Wi-Fi 接入点来模拟正法的 Wi-Fi
    网络。连接到恶性孪生允许黑客嗅探你的未加密流量，或将你重定向到虚假网站。这种中间人攻击让攻击者完全访问你的安全凭据和数据。旧版本的操作系统或带有安全漏洞的软件可能会为攻击者提供针对你数据的基础。访问你数据的软件（包括网络浏览器）可能会记住密码或让你保持账户的登录状态。设备可能会存储你数据的本地副本。小偷可以轻易偷走手机和平板电脑等小设备。其他人也可能借用你的手机。这两种情况都会让你的数据容易被盗或被发现。


