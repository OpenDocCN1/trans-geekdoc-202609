    - 它是如何实现的？（项目）

    - 是否有密码强度的规则？（是）

    - 密码多长时间更改一次？（项目）

    - 云提供商是否有安全策略？（是）

    - 云提供商的安全策略与你组织的安全策略之间是否存在差异？（是/否）

    - 有哪些差异是什么？（列表）

    - 云存储访问和内部服务是否使用不同的密码？（是）


    ### 6.3.13 法律管辖权和法规

    - 数据将存储在何处？（列表）

