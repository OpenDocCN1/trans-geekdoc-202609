    # 电子取证（e-discovery）带来了隐私挑战，因为它必须在数据所有者的隐私与法律披露法之间取得平衡。云端数据和国际业务关系意味着，针对特定请求的电子取证法律可能会冲突。负责收集和分析潜在数据的代理可能无法提供与云存储提供商同等的安全和隐私保护，从而使你的数据处于风险之中。


    民事诉讼可能会变得恶劣，尤其是离婚案件。任何可能对对方有帮助的数据都可能被传唤。将数据存储在云端意味着你并不拥有它的所有权，而且账户本身就表明存在某种数据，并值得调查。你的配偶可能知道或猜到你云账户的访问凭据，或者在你的设备上安装间谍软件以获取数据或凭据。在最坏的情况下，你的配偶可能会删除或向你的云存储上传内容，其中任何一种都可能给你在法庭上带来麻烦。


    ## 3.3.5 执法部门


    将数据移动到云端，政府机构可以在你不知情的情况下对其进行分析，即使是出于好的政府也可能给你带来问题。美国最高法院最近的一项裁决明确表示，当执法人员对法律的解释发生真实错误时，个人的《第四修正案》权利并不保护他们免受搜索和查收。


    即使在执法部门合法获取数据时，法律问题依然存在。在某个案件中，警方利用合法获取的数据在网上伪造了一个人的身份，声称他们可以在正在进行的调查中以任何方式使用她的数据。当局不仅使用了该女性的身份，还使用了其儿童亲属的照片。


    ## 3.3.6 生活方式与心理画像分析


    当他人利用信息构建关于你个人的个人画像时，你的法律权利是什么？营销人员这样做是为了进行精准广告，但这并没有对你施加任何法律义务或处罚。然而，请考虑雇主、保险公司或执法机构使用你的数据来建立你的生活方式和心理画像的后果。


    能够访问你云数据的公司可以与其他来源的数据相关联，并用此成功预测怀孕等情况。


    研究人员如


    菲利·迪克的小说《少数报告》描述了一个世界，政府根据对未来可能行为的预测对人们进行预判犯罪。预防犯罪的意图可能被用作访问所有云存储数据的理由，以寻找那些真正犯罪的人中常见的模式。


    当营销人员在画像时出错时，你只会收到一条无关的广告。当政府机构在画像时出错时，个人可能需要花费大量的时间和金来纠正错误。考虑一下那些无故被列入黑名单的人员，以及他们在纠正错误时面临的困难。


    ## 3.4 罪犯、威权政府与朋友


    大多数国家的法律都为个人和组织提供了至少某种程度的数据隐私保护。这些法律可能看起来模糊或不一致，或者提供的保护低于预期。无论如何，都存在某种程度的数据隐私保护。第
    4 章 将将讨论不同国家的合规性和数据隐私保护。


    现在我们来讨论对云数据的非法律威胁。我们所知的罪犯。然而，无视你隐私权（或任何其他权利）的威权政府对云数据安全和隐私构成了严重威胁。你的朋友，或者你信任的人，往往是数据隐私泄露最大的来源。


    ### 3.4.1 罪犯


    每个人都知道罪犯的威胁。罪犯有无数种方法可以访问云数据。他们可以利用软件中的漏洞，使用钓鱼攻击获取数据，猜测弱密码，或物理获取设备。


    ### 3.4.2 威权政府


    最近对索尼的黑客攻击说明了威权政府面临的几种危险。电影《访谈》。存在两种主要理论，朝鲜。


    我们都希望相信政府会对比我们存储在云端的数据行使裁量权和克制。WikiLeaks 获取的许多文件似乎来自一个试图引起人们对不公正关注的吹哨人。相反，证据表明存在恶意的内部人员。即使是处于最高安全级别的人也会犯错。一名拥有顶层安全许可的五角大承包商将敏感的国防部文件复制到了个人电脑上。


    不幸的是，并非人都生活在仁慈政府的国家。压迫政府会扫描云端数据以寻找政治异见的证据。这些政府将收集他们能获得的任何数据，并将碎片编织在一起，以支持对挑战他们者的指控。


    考虑埃及一名记者的案例。虽然埃及警方从手机和个人电脑中获取了数据，但这确实说明了让你的数据易于获取会引发意想不到的问题。


    你使用云数据的法律管辖区可能无法保护你。你的云数据甚至可能导致其他国家的人受到伤害。考虑 2009 年伊朗的绿色运动抗议。伊朗政府逮捕或骚扰了那些在其他国家有亲属并在社交媒体上批评政府的公民。


    ### 3.4.3 朋友


    在朋友这一类别中，我们必须包括你自己和你的家人。你们所有人都可能让云存储中的敏感数据面临风险。


    大多数人都知道不要分享社会安全号码和信用卡号。然而，有些人已经成为诈骗的受害者，因为他们不经地在拿着第一份工资时发布了自拍。罪犯通过在 Instagram
    照片中搜索特定标签发现了这些图片，然后从图片中读取账户和路由号码。


    你与朋友和家人分享私密信息，利用云端从一个地方向所有人提供。然而，与他们分享意味着你必须信任他们对你隐私的关注程度与你的一致。


    杰布·布什最近发布了他担任佛罗里达州州长期间的数十万封邮件。这些邮件包含了关于他人的敏感信息，包括他们的电子邮件地址、家庭地址、电话号码、社会安全号码和医疗信息。虽然《信息自由法》确实使官员的邮件成为公共领域的一部分，但未能对这类信息进行脱敏处理确实代表了严重的数据泄露，尽管这是无意的。


    即使是王子也无法避免其他友好的人将破坏性数据发布到云端。在拉斯维加斯的一个由哈里王子参加参加的派对上，一名女性拍了他的裸照并发布到了 Twitter 上。


