    \ user access? (List)\n\n• Who controls access? (Item)\n\n• Are access logs kept?\
    \ (Y)\n\n• Are access logs reviewed? (Y)\n\n• Is there a policy that defines access\
    \ privileges? (Y)\n\n• Does the policy distinguish between create, read, read/write/modify,\
    \ and delete? (Y)\n\n### 6.3.12 Passwords\n\n• Do you have a password policy?\
    \ (Y)\n\n• How is it implemented? (Item)\n\n• Are there rules in place for password\
    \ strength? (Y)\n\n• How often are passwords changed? (Item)\n\n• Does the cloud\
    \ provider have security policies? (Y)\n\n• Are there differences between the\
    \ cloud provider’s security policies and your organization’s security policies?\
    \ (Y/N)\n\n• What are the differences, if any? (List)\n\n• Are different passwords\
    \ used for cloud storage access and for internal services? (Y)\n\n### 6.3.13 Legal\
    \ Jurisdiction and Regulations\n\n• Where will data be stored? (List)\n\n• Is\
    \ data stored in the United States? (Y/N)\n\n• Is data stored in a foreign country(s)?\
    \ (Y/N)\n\n• If yes, which country(s)? (List)\n\n• Can you specify in which countries\
    \ data can be stored and where it cannot? (Y)\n\n• What are the data protection\
    \ laws in the relevant jurisdiction(s) and what are the security ramifications?\
    \ (List)\n\n• Where are the backup/redundancy systems located? (List)\n\n• Is\
    \ the data governed by US federal, state, or foreign government regulation (HIPAA,\
    \ GLBA, SOX, etc.)? (Y/N)\n\n• Does the cloud provider address compliance issues?\
    \ (Y)\n\n### 6.3.14 Third Party Audit\n\n• Has the cloud provider undergone an\
    \ external security audit? (Y)\n\n• Who performed the audit? (Item)\n\n• When\
    \ was it performed? (Item)\n\n• What were the results? (Item)\n\n• Are the complete\
    \ results available for review? (Y)\n\n### 6.3.15 Other Things to Consider When\
    \ Storing Data in the Cloud\n\nThis section asks questions that should be considered\
    \ when using cloud storage services. Answers to these questions are subjective\
    \ and will depend on the actual application and use of cloud storage. They are\
    \ provided as an aid to begin a conversation about aspects of cloud storage that\
    \ should be considered.\n\n• What are the risks and benefits of cloud storage\
    \ to an organization?\n\n• What if the cloud provider goes out of business?\n\n\
    • What if the cloud provider is sold to another company?\n\n• What if a cloud\
    \ data center is located in a country where there is political or financial turmoil?\n\
    \n• Do you need a backup to the backup provided by a single service provider?\n\
    \n• If you are migrating data to the cloud, how long will it take to do so?\n\n\
    • What are the bandwidth requirements?\n\n• Can the organization and the cloud\
    \ provider support the upload/download bandwidth requirements?\n\n• Does the cloud\
    \ provider offer data migration using physical media?\n\n• If you change cloud\
    \ service providers, does the cloud service provider have procedures in place\
    \ to facilitate the transfer?\n\n• How long will that process take?\n\n• If the\
    \ data stored in the cloud is compromised, what are the ramifications to the organization\
    \ based on the type of data that might be compromised?\n\n## 6.4 Summary\n\nThis\
    \ chapter highlights best practices for evaluating cloud storage. An example of\
    \ determining the security and privacy requirement for storing data in the cloud\
    \ is provided that is based on data type, content, and sensitivity. This is then\
    \ coupled with user need-to-know to develop a data security policy. A checklist\
    \ is presented that helps illustrate the kinds of questions that need to be considered\
    \ when determining security requirements for data cloud storage.\n\n## Reference\n\
    \n1\\. CSA, 2015. Cloud Security Alliance \\[Online\\] Available from: <[https://cloudsecurityalliance.org](https://cloudsecurityalliance.org)\\\
    > (accessed March 2015).\n\nChapter 7 \n\n# The Future of Cloud Data Privacy and\
    \ Security\n\nWe look into the future of cloud data privacy and security, considering\
    \ both the short term and the long term. Areas to watch over the next few years\
    \ that will affect privacy and security of cloud data storage include default\
    \ encryption, two-factor authentication, zero-knowledge encryption, anonymity\
    \ networks, the monetizing of cloud data security, home clouds, and legal challenges.\
    \ In the longer term, we focus on the Internet of Things and DNA-based data storage\
    \ devices.\n\n### Keywords\n\nAnonymity network; home cloud; Internet of Things;\
    \ Cloud of Things; DNA\n\nThus far we have covered current problems and solutions\
    \ related to cloud data security and privacy. In this chapter we look to the future\
    \ and consider cloud data security in possible brave, new worlds. We first look\
    \ to the near future and speculate about how current cloud data security and privacy\
    \ will evolve. We give special consideration to default encryption, two-factor\
    \ authentication, zero-knowledge encryption, anonymity networks, the monetizing\
    \ of cloud data security, home clouds, and legal challenges. Next, we look farther\
    \ into the future with the Internet of Things, quantum physics, and DNA-based\
    \ data storage devices.\n\n## 7.1 The Best to Expect in the Near Future\n\nCloud\
    \ data storage and services will continue to grow. More people and companies will\
    \ keep more of their confidential data in the cloud. With more people having more\
    \ confidential data in the cloud will come a greater awareness of the vulnerability\
    \ of personal data. This greater awareness of cloud data privacy and security\
    \ will manifest itself the in following areas:\n\n• Encryption by default\n\n\
    • Two-factor authentication\n\n• Zero-knowledge encryption\n\n• Anonymity networks\n\
    \n• Monetizing security and privacy\n\n• Home clouds\n\n• Security versus safety\n\
    \n### 7.1.1 Encryption by Default\n\nGoogle and Apple now encrypt the data that\
    \ they store on devices by default. Expect default encryption to become standard\
    \ for cloud storage providers. Note that this encryption applies to data on the\
    \ device itself and not to data backed up to cloud storage. These providers still\
    \ have the ability to give the unencrypted data in response to law enforcement\
    \ requests (\n\n### 7.1.2 Two-Factor Authentication\n\nTwo-factor authentication\
    \ might not have the success that was anticipated because many perceive it as\
    \ an inconvenience that requires a second step and the dependency on an additional\
    \ hardware device. The device associated with the two-factor authentication could\
    \ get broken, lost, stolen, or left somewhere; all of which mean not having access\
    \ to cloud data. While backup codes, multiple trusted devices, and applications\
    \ like Google Authenticator ([https://itunes.apple.com/app/google-authenticator](https://itunes.apple.com/app/google-authenticator))\
    \ or Authy ([https://www.authy.com/](https://www.authy.com/)) make it possible\
    \ to remedy these situations, the hardware device requirement and management leaves\
    \ many looking for easier ways to achieve data security.\n\n### 7.1.3 Zero-Knowledge\
    \ Encryption"
