    最佳实践被定义为在大多数情况下被接受或规定为有效的商业或专业程序。它也可以被视为一种启发式方法，即一种通常有效但不能保证在每个情况下都起作用的经验性法则。根据这一定义和这些注意事项，我们将从安全和隐私的角度，讨论在考虑将数据存储在云端的最佳实践。


    在几个重要的类别中，最佳实践以简短声明的形式提供，用于识别关键的云存储安全概念。这些最佳实践可以结合第 6.2 节中的清单，来评估云服务及其对特定用途的适用性。


    ### 6.1.1 云服务提供者的物理安全


    - 应该实施物理安全围栏，以保护敏感数据和信息系统。这些可以围栏、墙、屏障、守卫、大门、电子监控、物理身份验证机制、胸卡、指纹扫描仪、接待台和安全巡逻。

    - 应对用户和支持人员对信息资产和功能的物理访问进行控制和限制。

    - 应该建立维护设施安全的政策和程序。

    - 人员应经过彻底审查并在安全程序方面接受培训。

    - 应该建立设施备份系统以确保业务的连续性。


    ### 6.1.2 云服务提供者的网络安全


    - 云服务提供者应该拥有网络安全策略，定义实现特定安全态势所必需的安全要求。

    - 应该有一份架构图，包含硬件和软件组件，允许网络安全策略的实施和实现。

    - 架构应该提供确保云服务提供者服务连续性的机制。这应该包括从组件级到数据中心级的故障修复处理机制。

    - 客户应该获得一份服务水平协议（`SLA`），定义了为其服务的最终用户保证的服务水平。`SLA` 可以规定服务和服务提供者的安全性、治理、合性和责任。

    - 云服务提供者应该拥有应对安全泄露事件的政策和计划。应该确定一个应急响应小组，负责处理安全泄露并根据政策和事件响应计划实施恰当的补救措施。


    ### 6.1.3 加密/解密


    - 传输中的数据和静态数据都应该加密。

    - 加密方法：(1) 传输中的数据应使用 `SSL/TLS`，(2) 静态数据应使用 `AES-256`。不要依赖旧的加密算法（如数字加密标准）或非标准的专有格式。虽然
    `AES-128` 对于大多数目的来说足够健壮，但它可能不符合监管要求，并且在长期来看可能不那么“耐用”。

    - 用户组织应该控制和管理加密密钥。

    - 数据在存储到云端之前应在源端进行加密。

    - 数据应该仅在用户组织的边界内解密，而不是在云提供者处解密。

    - 根据数据分析，创建识别哪些数据需要加密的策略。

    - 创建定义在数据的整个生命周期内如何管理所有加密/解密密钥的策略。

    - 不要允许云提供者访问保护关键信息的密钥。

    - 不要将加密密钥与加密数据一起存储在云端。

    - 用于加密敏感数据的密钥应定期更换，并使用新密钥重新加密数据。NIST 建议 `最大` 周期为 2 年，但没有最低限制。显然，更频繁地更换密钥比低频率更换更安全，但必须考虑其他因素，例如解密和重新加密所需的时间、在此过程中数据的可用性等。此外，建议在拥有加密密钥访问权限的人员离开组织时更换加密密钥。市场上上有可以促进这一过程的产和加密方案。加密密钥的更换应在组织的安全策略中定义。

    - 根据策略定义，必须使用强密码或短语来保护加密密钥。


    ### 6.1.4 身份验证与访问控制


    - 应该创建定义身份验证和访问控制过程的策略。

    - 身份验证至少应基于用户识别和复杂的密码/短语。密码长度至少为八个字符。更长的密码更安全，并且包含大小写字母、数字和特殊字符。这提供了一个 95 种可能字符的字符集。使用
    95 种字符集的八字符密码的密钥空间为 `95⁸`，大约为 `7×10¹⁵`，即 7 千万亿种可能的密码。随着密钥空间的增加，对密码进行暴力破解所需的时间随之增加。增加双因子身份验证也会提高安全性。

    - 不应给予员工超过其完成任务所需的权限。这被称为`最小权限原则`，是指将用户、程序和进程限制在完成其预期工作所需的最低访问级别、读写权限和执行权限。

    - 应该保留并定期审查访问日志。日志应与策略实施情况进行交叉检查。


    ### 6.1.5 灾难计划


    - 云服务提供者应该有一个灾难计划，展示冗余和故障转移能力，以确保服务的持续。

    - 客户应该对这些计划进行审查和分析，以确定在提供者数据中心发生自然或其他灾难时，维护数据访问的适用性。

    - 客户的灾难计划应该更新以包含异地云存储。


    ## 6.2 关于云存储数据提出的问题


    在本节中，我们首先对要存储在云端的数据提出一些问题。正如我们所示，并不是所有数据都是平等的——某些数据比其他数据更有价值，不同的数据具有不同的安全隐私要求。此外，并不是所有人都需要访问数据。为了帮助我们思考数据及其价值，我们提出了五个问题：


    - 我们想在云端存储什么类型的数据？

    - 存储在云端的数据价值是多少？

    - 数据有多敏感？

    - 是否某些数据比其他数据敏感？

    - 谁应该访问这些数据，谁不应该？


    ### 6.2.1 评估数据和用户访问


    在确定云存储数据的安全和隐私要求时，首先评估要存储数据的类型、内容和敏感性是一项“最佳实践”。以制造各种小部件的 Acme Widget 公司为例。他们想将数据从内部控制的服务器迁移到外部云服务提供商。他们确定了将作为其云迁移部分的四类类型数据：会计数据、用户支持数据、工程和制造数据以及新产品研发数据。这四类数据中的每种都有不同的安全隐私要求。


    会计数据的完整性和机密性价值很高，因为公司依靠这些数据来确定财务状况、支付工资、进行未来规划等。由于这些数据包含工资信息和员工个人身份信息 (PII)，隐私问题也将其处于敏感数据类别。对这些数据的访问必须经过控制和限制。

    '
- fmt: '

    On the other hand, user support data, while important, does not have the same
    level of value and sensitivity as the accounting data. It is important for the
    overall reputation of the company to ensure support for their products, but support
    information, such as user’s manuals, support blogs, support contact information,
    must be made available to all product owners and anyone interested in their products.
    This implies that confidentiality is not a concern for product data. Access to
    this information may be restricted and require user sign-in, or it may be publically
    available to anyone interested in the products. From a security perspective, the
    integrity of the information that is made available must be considered. It must
    be protected from unauthorized modification, which implies that while everyone
    may have read-access to the data; the ability to modify data content must be strictly
    controlled. This can be accomplished through user authorization and access restrictions.


    Manufacturing and engineering data falls between accounting data and product support
    data. This data does not have a privacy component, but does contain sensitive
    information that should be restricted to manufacturing and engineering personnel
    with a need-to-know.


    New product R&D data is more sensitive than manufacturing data because it contains
    information on future products and is directly tied to the future success of the
    company. It must be restricted to a smaller subset of employees with a need-to-know.
    R&D data can also be the target of competitors and certain nation states, attempting
    to gain competitive advantage. Although R&D data does not have a privacy component,
    it should be considered high value and sensitive. Access should be tightly controlled
    and granted on a need-to-know basis.


    The other point to be noted is that just because two types of data are highly
    sensitive, does not mean that if someone can access high-level data of one type
    that they should also have access to high-level data of another type.


    ## Personnel Versus Data Access


    `id="CMPTBLT00006Xtabt0010"`


    | | Accounting | Support | Manufacturing | R&D |

    | --- | --- | --- | --- | --- |

    | Accounting | X r/w | X read | | |

    | Everyone | | X read | | |

    | Manufacturing | | X r/w | X r/w | |

    | R&D | | X read | X read | X r/w |


    ![Image](images/T00006Xtabt0010.png)


    The table shows personnel type in the left column and data categories across the
    top of each of the other columns. The `X` indicates access to data categories
    by personnel type. `r/w` indicates that personnel can read, write, and modify
    data. As shown in the table, the accounting personnel have both read and write
    access to the accounting data, but not the other data categories. It also indicates
    that no one else in the other personnel categories have access to the accounting
    data. Everyone has access to the support data. This would include visitors from
    the public internet. Manufacturing personnel are restricted to manufacturing data
    and may have write access to the support data to make modifications and updates
    to the support information. R&D personnel are the only ones who can access R&D
    data, and they have read access to manufacturing and support.


    Although this is a simple example of data categorization, it illustrates some
    of the issues that arise when data is stored. The main point of this section is
    that not all data requires the same level of protection. Access should be granted
    on a need-to-know basis.


    ## 6.3 Data Privacy


    In this section, we present a checklist for data privacy.


    ### 6.3.1 Cloud Provider – Physical Security


    - Does the cloud provider have physical barriers? (Y)

    - Are visitors escorted? (Y)

    - Does the cloud provider have backup power? (Y)

    - Are there cooling systems? (Y)

    - Is there 24/7 security monitoring? (Y)

    - Has the service ever had a breach? (N)

    - Who controls the access? (Item)


    ### 6.3.2 Disaster Planning


    - Is data stored redundantly? (Y)

    - Is data geographically dispersed? (Y)

    - Are there failover processes in case of disk/site failure? (Y)

    - How often is it tested? (Item)

    - What is the guaranteed uptime (Item)?

    - How long will it take to restore data? (Item)


    ### 6.3.3 Cloud Provider Personnel


    - Are personnel required to pass a background check? (Y)

    - Any financial investigation? (Y)

    - Is there a security awareness program? (Y)

    - Are all employees trained? (Y)


    ### 6.3.4 Cloud Provider Network Security


    - Does the cloud provider have firewalls, intrusion detection systems, and access
    control systems? (Y)

    - Do they have an emergency response team? (Y)

    - Are there redundant connections to the internet? (Y)

    - What is the maximum throughput? (Item)

    - What is the current average throughput? (Item)

    - What is the customer’s guaranteed throughput (Item)?


    ### 6.3.5 Data in Motion


    - Is data in motion between the user and cloud provider encrypted? (Y)

    - Is data in motion between cloud data centers encrypted? (Y)

    - What is the method of encryption? (Item)


    ### 6.3.6 Data at Rest


    - Is data at rest encrypted? (Y)

    - What kind of encryption is used? (Item)

    - Who controls the encryption keys? (Item)

    - How are keys protected? (Item)

    - Where/how are the keys backed up? Are backup copies stored in an offsite location?
    (Y)

    - How are the keys managed? (Item)

    - Can multiple keys be created and used to segregate users? (Y)

    - Can a master key be created? (Y)

    - Can keys be revoked? (Y)


    ### 6.3.7 Data Encryption and Decryption


    - When is the data encrypted? (Item)

    - Where is the data encrypted? (Item)

    - When is the data decrypted? (Item)

    - Where is the data decrypted? (Item)


    ### 6.3.8 File Content Deletion


    - When files are deleted is the disk space return to an “available pool” that
    may be allocated to other customers? (Y/N)

    - Is deleted file space securely overwritten to ensure that data content is unrecoverable?
    (Y)

