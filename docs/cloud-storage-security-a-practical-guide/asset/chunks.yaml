    #### 2.3.2.5 Twitter Privacy Policy


    Twitter collects personal information during registration that includes name,
    username, password, and email address. They may also collect the user’s phone
    number if the user wishes to access Twitter using SMS from their cell phone. Other
    information may be voluntarily given to Twitter and added to the user’s public
    profile, which is *publicly* available. This can include a short biography, your
    location, your website, and a picture.


    As a common practice among social media services, you may choose to upload your
    email address book to “help you find Twitter users you know or help other Twitter
    users find you.” It also helps the service provider construct social networks
    that can be valuable when targeting advertising. It can also be used by others,
    including governments, to determine links between people and organizations.


    In their privacy policy, Twitter also states that they broadly and instantly disseminate
    your public information to a wide range of users, customers, and services, including
    search engines and publishers that integrate Twitter content into their services.
    They also make this information instantly available to universities and public
    health agencies for analysis of “trends and insights.” They say this with the
    well-placed caveat: “you should think carefully about what you are making public.”


    You may also voluntarily publish location information, which Twitter collects
    and stores. This includes location information and IP addresses transmitted by
    your device from cell towers and wireless networks. The privacy implications of
    collecting and storing location information is that it can be used to find out
    where you were at specific times in the past and can be used to establish behavioral
    patterns of movement.


    When you interact with Twitter, device and operational information is collected
    that includes your IP address, browser type, operating system, the referring web
    page, pages visited, location, your mobile carrier, device and application identifiers,
    search terms, and cookie information. Twitter also collects information when you
    use your Twitter account for authentication for access to other services or websites.
    Also information is collected from websites that you visit that have the Twitter
    button/widget displayed. There are many websites that display the Twitter button.
    Few users know that this is a tracking device and that they are being tracked.
    (*Note*: Facebook and other social media services also use this technique.)


    #### 2.3.2.6 Facebook


    In this section we look at the security and privacy of Facebook, based on analysis
    of their current TOS and privacy policy. Once again it must be stated that the
    purpose of Facebook and other social media services is to share information and
    once again this information is voluntarily provided by users of the service.


    Personal information that users provide when they sign up for Facebook include
    the user’s name, email, gender, and birth date. They are also provided “the opportunity”
    to add information about where they work, where they went to school, and a photo.


    After sign up, people use Facebook to share information about their lives, things
    they like, photos, videos, links to websites, etc. All of this information can
    be aggregated and analyzed to form a profile of the user, which can be used to
    target advertisement.


    Facebook provides tools to import email contact lists to help you invite your
    contacts to join Facebook and add you as a friend. To assist you in this effort,
    their policy states that, “If you give us your password to retrieve those contacts,
    we will not store your password after you have uploaded your contacts.” They do,
    however, have access to the uploaded list of contacts.


    Similar to Twitter, Facebook collects all of your interactions with their service,
    your device, network, location, webpages, webpage and cookie information that
    display the Facebook logo and widget, and browser information. They collect information
    when you use Facebook for authorization to another website or service. Their TOS
    also states that, “we may receive a limited amount of information even before
    you authorize the application or website.” What this information is or how it
    might be used is not defined.'
