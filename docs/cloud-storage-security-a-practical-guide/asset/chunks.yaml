    如果云服务提供商对静态数据进行加密，但控制加密和解密数据的密钥，那么个人身份信息（PII）的存储并不符合法律意图。解决此问题的方法是，受保护实体在 PII
    离开其网络存储到云提供商位置之前对其进行加密。由于 PII 在传输前已通过加密，云服务提供商无法访问 PII——他们只能获得随机的加密位。这要求受保护实体维护并控制对加密密钥的访问。


    正如 HIPAA（美国医疗健康保险责任法案）章节中描述的，受保护实体对其业务伙伴（包括云服务提供商）的行为负责。在 HIPAA 的情况下，受保护实体与云提供商之间
    `required` 签署一份特殊合同，规定管理和存储受保护健康信息（PHI）的安全要求。这些安全要求必须符合 HIPAA 标准。如果云服务提供商是合格的业务伙伴并实施了
    HIPAA 定义的安全要求，那么云存储提供商就有可能管理加密密钥并仍然符合 HIPAA 法规。


    保护 PII 的另一种方法是在 PII 传输和存储之前移除其任何身份识别信息。虽然这种是可行的，但可能无法满足 SOX（萨班斯-奥莱法案）和《多德-弗兰克法案》的要求，这些法律要求保留完整的交易记录。去标识化的
    PII 通常用于医疗保健研究和其他政府统计目的。HIPAA 有一项关于“限制数据集”的规定，从中移除了大部分但并非全部的潜在身份识别信息。


    ## 4.4 其他国家的法律与法规


    到目前，我们一直关注监管存储在云端数据的美国法律。其他国家也通过了保护其公民隐私的法律。随着互联网和拥有全球数据存储设施的跨国公司的出现，边界和管辖权的概念变得复杂。虽然国家可以制定法律保护其公民的隐私，但在当前环境下，很难防止数据跨跨境并被用于任何目的。在一个国家属于违法的行为，在另一个国家可能是完全合法的。本节将提供此类法律的概述，并提供更详细信息的参考资料。


    ### 4.4.1 1995 年欧洲数据保护指令


    1995 年《欧洲数据保护指令》的创建是为了确保数据在整个欧盟范围内以相同的方式得到保护。这为与欧盟国家开展业务的公司提供了一个框架和一套原则，帮助其进行数据相关的合规工作。与其需要应对
    28 个不同欧盟成员国的数据监管法律，在欧盟经营业务的公司将有一个单一来源来确保合规。该指令还扩展了个人获知所收集数据类型并挑战此类数据处理方式的权利。个人有权知道哪些政府机构可以访问何种的个人数据。


    该指令由欧盟成员国于 1995 年达成共识。那是互联网的黎明前，在云计算和存储概念出现几十年之前，未能预见到或适应如数据全球化、社交网络和云计算等技术变化和发展。因此，欧洲委员会认为需要新的数据保护和隐私准则。委员会提出了一系列建议，旨在对《数据保护指令》进行全面改革，以更新并使
    1995 年指令中定义的原则现代化。欧洲委员会将个人数据定义为“任何与个人相关的信息，无论这些信息与其私生活、职业生活还是公共生活有关。它可以是姓名、照片、电子邮件地址、银行详情、社交网络网站上的帖子、医疗信息或计算机的
    IP 地址等任何内容。”改革内容总结在欧盟委员会的事实表中（


    #### 4.4.1.1 对欧盟公民的益处


    数据保护改革将加强公民权利，从而帮助恢复信任。更好的数据保护规则意味着你对个人数据如何被处理更有信心，特别是在线时。新规则将让公民重新获得对数据的控制权，特别是通过以下方式：


    - **被遗忘权：** 当你不再希望你的数据被处理，且没有保留这些数据的正当理由时，数据将被删除。这关乎赋予个人权利，而不是抹除过去的事件或限制新闻自由。

    - **更方便地访问自己的数据：** 数据可移动性权将使你可以在服务提供商之间传输个人数据变得更加容易。

    - **允许你决定数据如何被使用：** 当处理你的数据需要征得同意时，必须明确要求你提供同意。不能假设你已同意。沉默不等同于同意。企业和组织还需要在不拖延的情况下通知你可能对你产生不利影响的数据泄露事件。

    - **知晓数据何时被攻击的权利：** 例如，公司和组织必须尽快向国家监管机构报告严重的数据泄露事件（如果在 24 小时内可行的话），以便用户可以采取适当措施。

    - **数据保护优先，而非事后补救：** “设计即隐私”和“默认隐私”也将成为欧盟数据保护规则中的基本原则——这意味着数据保护安全措施应从开发的早期阶段就构建到产品和服务中，并且隐私友好的默认设置应成为常态——例如在社交网络或移动应用上。


    #### 4.4.1.2 对业务的益处


    数据是当今数字经济的货币。个人数据经过收集、分析并在全球移动，已获得了巨大的经济意义。根据某些估计，到 2020 年，欧洲公民个人数据的价值潜力可能增长到每年近
    1 万亿欧元。加强欧洲高标准的数据保护是一项商机。欧洲委员会的数据保护改革将帮助数字单一市场实现这一潜力，特别地通过以下四项主要创新：


    - **一个大陆，一部法律：** 该条例将建立一部统一的、全欧洲的数据保护法，取代目前不一致的国家法律。公司将与一部法律打交道，而不是 28 部。预计每年收益为
    23 亿欧元。

    - **一站式服务：** 该条例将为企业建立“一站式服务”：公司只需与一个监管机构打交道，而不是 28 个，这使得企业在欧盟开展业务变得更简单、更便宜；同时也让公民保护其个人数据变得更容易、更快速、更高效。

    - **所有公司的相同规则——无论设立地何在：** 如今，欧洲公司必须遵守比在欧盟境外但与单一市场开展业务的公司更严格的标准。通过改革，总部位于欧洲以外的公司必须遵守相同的规则。我们正在创造一个公平的竞争环境。

    - **欧洲监管机构将具备强大的执法能力：** 数据保护机构能够对不遵守欧盟规则的公司处以罚款，最高可达全球年营业额的 2%。欧洲议会甚至提议将可能的罚款提高到
    5%。在这一问题日益敏感的时期，隐私友好的欧洲公司将在全球范围内具有竞争优势。


