    Best practices are defined as commercial or professional procedures that are accepted
    or prescribed as being effective most of the time. It can also be considered a
    heuristic, in that is a rule of thumb that generally succeeds but is not guaranteed
    to always work in every instance. Given this definition and these caveats, we
    discuss best practices when considering storing data in the cloud, from a security
    and privacy perspective.


    Best practices, in several important categories, are provided in the form of short
    statements that identify key cloud storage security concepts. These best practices
    can be used, along with the checklist in [Section 6.2](#chp006.xhtml#s0040), to
    evaluate cloud services and their suitability for a specific purpose.


    ### 6.1.1 Cloud Provider’s Physical Security


    - Physical security perimeters should be implemented to safeguard sensitive data
    and information systems. These can include fences, walls, barriers, guards, gates,
    electronic surveillance, physical authentication mechanisms, badges, fingerprint
    scanners, reception desks, and security patrols.

    - Physical access to information assets and functions by users and support personnel
    should be controlled and restricted.

    - Policies and procedures should be established for maintaining facility security.

    - Personnel should be thoroughly vetted and trained in security procedures.

    - Facility backup systems should be in place to ensure continuity of operations.


    ### 6.1.2 Cloud Provider’s Network Security


    - The cloud provider should have network security policies that define the security
    requirements necessary to achieve a specified security posture.

    - There should be an architecture diagram that includes hardware and software
    components that allow the network security policies to be implemented and achieved.

    - The architecture should provide the mechanisms to ensure service continuity
    for the cloud service provider organization. This should include mechanisms to
    address remediation of failures from the component level to the data center level.

    - Customers should be provided with a service level agreement (`SLA`) that defines
    the level of service that is guaranteed to the end user of their services. The
    `SLA` can specify security, governance, compliance, and liability of the service
    and service provider.

    - The cloud provider should have a policy and plan for responding to security
    breach incidents. An emergency response team should be identified with the responsibility
    to address security breaches and implement appropriate remediation measures, as
    specified in the policy and the incident response plan.


    ### 6.1.3 Encryption/Decryption


    - Data in motion and data at rest should be encrypted.

    - Encryption methods: (1) data-in-motion should use `SSL/TLS` and (2) data-at-rest
    should use `AES-256`. Do not rely on older encryption algorithms, such as Digital
    Encryption Standard, or nonstandard proprietary formats. While `AES-128` is sufficiently
    robust for most purposes, it may not comply with regulatory mandates, and it may
    not be as “durable” in the longer term.

    - The user organization should control and manage encryption keys.

    - Data should be encrypted at the source before being stored in the cloud.

    - Data should only be decrypted within the boundaries of the user’s organization,
    not the cloud provider.

    - Based on data analysis, create policies that identify which data requires encryption.

    - Create policies that define how all encryption/decryption keys will be managed
    for the entire lifecycle of the data.

    - Do not allow cloud providers to have access to keys that protect critical information.

    - Do not store encryption keys in the cloud with encrypted data.

    - Keys used for encrypting sensitive data should be periodically changed, and
    data should be re-encrypted with new keys. NIST recommends a `maximum` change
    period of 2 years, but not a minimum. Obviously changing keys more frequently
    is more secure than less frequently, but other factors have to be considered,
    such as the time it takes to decrypt and re-encrypt, data availability during
    that process, etc. Also it is recommended that encryption keys change when personnel
    with access to encryption keys leave employment with an organization. There are
    products on the market and encryption schemes that can facilitate this process.
    Encryption key change should be defined in the organization’s security policy.

    - As defined by policy, strong passwords or pass phrases must be used to protect
    encryption keys.


    ### 6.1.4 Authentication and Access Control


    - Policies should be created that define the authentication and access control
    processes.

    - Authentication should be based on, as a minimum, user identification and complex
    password/pass phrase. Passwords should be a minimum of eight characters in length.
    Longer passwords are more secure and should contain upper and lower case characters,
    numbers, and special characters. This provides a character set of 95 possible
    characters. An eight-character password using a character set of 95 has a key
    space of `95⁸`, approximately `7×10^(15)`, or 7 quadrillion possible passwords.
    As the key space increases, the time required to perform a an brute force attack
    on a password increases. The addition of two-factor authentication also increases
    security.

    - Employees should not be given more privileges than what is needed to complete
    their tasks. This is called the `principle of least privilege`, which refers to
    restricting users, programs, and processes, to the lowest level of access, read/write,
    and execution rights necessary to accomplish their intended work.

    - Access logs should be kept and reviewed periodically. Logs should be crosschecked
    with policy implementation.


    ### 6.1.5 Disaster Planning


    - Cloud providers should have a disaster plan in place that demonstrates redundancy
    and failover capabilities to ensure continued service.

    - These plans should be reviewed and analyzed by the customer to determine the
    suitability for maintaining access to your data in the event of a natural or other
    disaster at the provider’s data center(s).

    - Customer disaster plans should be updated to include offsite cloud storage.


    ## 6.2 Goals and Questions to Ask About Data Stored in the Cloud


    In this section, we begin by asking some questions about the data that is to stored
    in the cloud. As we illustrate, not all data is created equal – some data is more
    valuable than other data, and different data have different security and privacy
    requirements. Also, not everyone needs access to all data. To help us think about
    data and its value we ask five questions:


    - What types of data do we want to store in the cloud?

    - What is the value of the data that is being stored in the cloud?

    - How sensitive is the data?

    - Is some data more sensitive than other data?

    - Who should have access to the data and who should not?


    ### 6.2.1 Evaluating Data and User Access


    In determining the security and privacy requirement for storing data in the cloud,
    it is a “best practice” to begin by evaluating the type, content, and sensitivity
    of the data to be stored. Take for example the Acme Widget Company that manufactures
    an assortment of widgets. They want to move their data from internally controlled
    servers to an external cloud provider. They have identified four types of data
    that will be part of their cloud migration: accounting data, user support data,
    engineering and manufacturing data, and new product R&D data. Each of the four
    types of data has different security and privacy requirements.


    The integrity and confidentiality of the accounting data is of high value in that
    the company relies on this data to determine the financial well-being, to pay
    its employees, for future planning, etc. Since this data contains payroll information
    and employee personally identifiable information (PII), privacy concerns also
    put this in the sensitive data category. Access to this data must be controlled
    and restricted.

