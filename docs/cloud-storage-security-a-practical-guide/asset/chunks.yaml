    ### 2.1.3.14 From Yahoo! Privacy Policy


    … advertising will be based on our understanding of the content and meaning of
    your communications. For instance, we scan and analyze email messages to identify
    key elements of meaning and then categorize this information for immediate and
    future use.


    `Yahoo!` also scans and uses analytics on email content. We assume this applies
    to attachments as well, although they do not specifically address this issue.


    ### 2.1.3.15 Measures That Can Be Taken to Increase Security and Privacy


    To increase the security and privacy of email, the best solution is encryption.
    This requires encryption key management, which involves key creation, secure key
    storage, and key distribution. While there are existing solutions for email encryptions,
    such as `PGP`, they require a certain degree of technical sophistication that
    may be beyond many users. Encrypted email only works if the sender and receiver
    both use the same type of encryption and key management.


    ### 2.1.3.16 Conclusion


    The three big email services providers, `Gmail`, `Yahoo! Mail`, and [Outlook.com](http://Outlook.com),
    provide secure data in motion using `HTTPS`. They have all updated the way they
    handle data moving between their data centers by adding encryption. Data at rest
    is stored unencrypted. There is a data privacy concern given the information that
    is collect from the user and aggregated with external data. `Google` and `Yahoo!`
    scan and analyze email content passing in and out of their email services, as
    well as when the email is stored. This applies to emails being sent from any email
    account into their email systems, which raises privacy concerns. [Outlook.com](http://Outlook.com)
    appears to only scan content for viruses.


    In the United States email and metadata are subject to civil and criminal litigation.
    Court subpoenas are required to gain access to email and attachment content. National
    security letters from a federal agency allows the federal government access to
    email metadata only; a court order is required for the federal government to access
    email content. National security letters may prohibit the email service provider
    from notifying, confirming, denying, or discussing anything about the action.


    ## 2.2 Cloud Backup Services


    ### 2.2.1 Background


    Since the beginning of computing, ensuring the backup and security of data has
    been vital necessity – a necessity that is often put off until later. A survey
    conducted by [backblaze.com](http://backblaze.com)


    This behavior provides a business opportunity for companies to connect computer
    users to cloud services. With the advent of high-speed internet and cheap cloud
    storage, a number of companies now offer inexpensive and automatic file backup.
    Among the largest and most successful are `Carbonite` and `Mozy`. As of 2015,
    there are at least 50 cloud backup services available, with new ones being started
    every day. The large internet companies, such as `Google`, `Microsoft`, and `Amazon`
    are beginning to offer similar services.


    Which brings us back to the focus of this book: what are the security and privacy
    implications of backing up data to the cloud using a service provider?


    ### 2.2.2 Case Studies: Comparison of Cloud-Based Backup Security


    In this section, we examine security issues of cloud-based data backup. This is
    done using the case study methodology to illustrate the various security issues
    when trusting a third party with your data.


    #### 2.2.2.1 Questions


    Are data in motion and data at rest secure? What is the privacy policy of backup
    providers? Can the backup provider access the stored data content? If data is
    encrypted while at rest, who holds the encryption key? Is backup data stored redundantly?
    Is data stored in multiple locations? Is there physical security of the storage
    facility(s)? What country(s) are the data stored? Who has jurisdiction? What are
    the legal issues?


    #### 2.2.2.2 Security Concepts


    The previously discussed security concepts for data-in-motion and data-at-rest
    also apply to backup data. That is, data is vulnerable while in transit between
    the source and destination. In this case between the device containing the data
    to be backed up and the server where the data is being stored, or backed up to.


    For data-in-motion `SSL/TLS` can be used. `HTTPS`, which is a higher-level protocol
    that uses `SSL/TLS`, is not predominantly used. Instead, the backup service provider
    uses proprietary software to manage the backup process and implements `SSL/TLS`
    as part of its secure transport function.


    For backup data storage, encryption is commonly used to ensure that data-at-rest
    is secure. Since data is being stored in an external location, perhaps several
    locations, the physical security of the facilities must also be considered as
    a component to data-at-rest. For example:


    - How secure is the facility infrastructure?

    - Is the physical structure secure from intruders and natural disasters?

    - Is there 24-hour security?

    - Who has access to the facility?

    - What are the access controls?

    - Are employees vetted?

    - Is the data in the facility redundantly backed up?

    - Are the data centers geographically dispersed?

    - What precautions are taken to address cyber-attacks?


    #### 2.2.2.3 Methods and Results


    To determine the level of security provided by data backup providers, we examine
    the service providers TOS agreements, privacy policies, and other publically available
    information.


    In this section we evaluate `Carbonite` and `Mozy`. These online backup services
    are accessed through vendor-supplied software or a specialized mobile device app.
    The service is cloud-based `SAAS` with files and directory structures stored in
    the cloud.


    #### 2.2.2.4 Carbonite


    We begin by analyzing the security of `Carbonite` backup service from a security
    perspective by comparing their solution to our security questions.


    #### 2.2.2.5 Data-in-Motion


    `Carbonite` addresses data-in-motion in two ways. First, files are encrypted using
    `128-bit Blowfish` encryption on the host computer containing the files to be
    backed up, and second they are transmitted to one of their data centers by a proprietary
    application that uses an `SSL` connection.


    #### 2.2.2.6 Data-at-Rest


    `Carbonite` supports two types of encryption and key control. By default, they
    create, manage, and securely store the encryption key using Advanced Encryption
    Standard (`AES`) `128-bit` encryption. Having `Carbonite` mange the encryption
    key has several advantages. First, it frees the user from that task of applying
    the key to encrypt and decrypt files, and second, the user does not have to ensure
    the backup and security of the key. This simplifies the sharing of data across
    devices by leaving the data encryption and decryption process up to the management
    of `Carbonite`. If data recovery is necessary, the user can access the backed
    up data using an account username and password. Note: This means that your data
    is as secure as your password.


    The disadvantage of using the default method is that `Carbonite` can decrypt your
