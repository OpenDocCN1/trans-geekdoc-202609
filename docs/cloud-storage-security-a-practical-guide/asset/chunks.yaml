    \n《丁德-弗兰克华街改革与消费者保护法》的目的是“通过提高金融系统的问责制透明度促进美国金融稳定，通过终止救助来保护美国纳税人，保护消费者免受滥用金融服务的侵害，以及其他目的”。为了实现这些目标，受本法约束的必须收集、存储、维护并为所有与交易相关的记录提供搜索功能。这包括电子邮件、即时消息以及固定电话和手机的通话录音。\n\
    \n该法要求必须存储与每笔交易相关的通信记录，无论媒介为何。它们必须能够被检索并允许重建交易前和交易后的通信，并将所有记录与所有相关数据和备忘录放在一起。\n\
    \n记录留存根据记录类型而异。由于交易记录提供了交易相关信息，其留存要求设置为掉期合约的生命周期加 5 年。对于语音通信，留存期为 1 年。对于非交易记录，留存期为记录创建之日起\
    \ 5 年。由于金融工具可能持续多年（例如长期债券），总留存期理论上可能长达 30 年（[ndm.net](http://ndm.net)）。\n\n"
