  raw: 'The Recording Industry Association of America (RIAA) and the Motion Picture
    Association of America (MPAA), among others, have concerns about cloud storage
    used to illegally share copyrighted material. The Digital Millennium Copyright
    Act (DMCA) gives copyright holders legal authority to act against suspected copyright
    violators. While DMCA tactics and enforcement remains controversial, these organizations
    do have a valid point. They sell copyrighted material for use by one person. If
    that person makes copies and gives or sells them to others, then they have potentially
    deprived the copyright holder of material benefit. This issue does not happen
    for physical items like cars. When you purchase a car, you can use it or let some
    else use it. You cannot make free copies of the car and give them away. However,
    you can do this with digital media and this creates difficulties for copyright
    holders.


    Civil litigation, such as from business lawsuits or divorce, may give others legal
    access to your cloud data. Requests for this data will go to your cloud provider,
    who will likely comply with any legitimate legal request. As a result, unknown
    others may view your sensitive data and download and archived by the court to
    places not under your control and for an unknown time. Furthermore, the data they
    view or download may not in fact relate to the litigation, but get included because
    of the scope of the data request.


    Legal warrants could make a significant amount of your data accessible to law
    enforcement and whatever agency (public or private) tasked to analyze your data.
    This means others will have full access to your data, with no guarantee of what
    will happen to this data or how it will get used or by whom.


    Police stops and security checkpoints give law enforcement a warrant or justification
    to access your data. The legal status of devices in the United States remains
    dynamic and ambiguous. This means both you and authorities could misinterpret
    your responsibilities. In the United States, a password might fall under the Fifth
    Amendment, but a biometric lock might not. As a case in point, a court in Virginia
    recently ruled that a password has Fifth Amendment protection because it represents
    knowledge, while a fingerprint does not because it serves as a physical key (


    Given the current legal ambiguities over cloud data and electronic media in general,
    authorities might consider action to protecting your data after they confront
    you as unlawful. Your refusal to allow authorities access to your device and the
    data accessible from it could result in your arrest. Even if you acted correctly,
    you could suffer from a misinterpretation of data privacy and security laws. In
    such situations, even if you win the legal case, you still lose in terms of time,
    money, stress, and opportunities lost by dealing with the situation.


    Local laws governing both your physical location and the physical location of
    your data affect the security of that data. You might have data secured in cloud
    storage physically located in the United States. However, travel outside the United
    States could put you in a situation where law enforcement in other countries can
    compel you to show them this data through your device. Alternatively, cloud storage
    data centers outside the United States have different laws governing who can access
    your data and under what circumstances.


    #### 1.2.3.2 Criminal Threats


    The list below shows categories of motives for attacking your data and cloud storage.


    • *Exploit*. Data of value to you may have value to others.


    • *Deny*. Temporarily preventing you from getting your data may benefit someone
    else.


    • *Destroy*. Permanently destroying your data might benefit someone else.


    • *Deceive*. Subtle changes to your data that may go unnoticed until they cause
    a problem.


    • *Usurp*. Others use your storage for their own purposes, possibly hiding illegal
    content.


    Your personal data has value to others for many reasons. Cyber-stalkers want your
    data to establish some personal or intimate relationship with you. Cyber-bullies
    want to harass or embarrass you. Note that the data about you they reveal could
    damage your reputation such that it results in loss of your job or valuable opportunities.
    Criminals can use this information to coerce action or extort money from you.
    Your data may help criminals steal your identity, perhaps by helping them guess
    answers to security questions for various online accounts.


    Businesses experience many of the same threats as individuals. In addition, industrial
    espionage could occur where criminals obtain information about your business strategy,
    contracts, customer relations management (CRM) data, or other intellectual property
    and use or sell it. Metadata about your company could leak information that gives
    criminals insider information to help them with business negotiations or investing.


    The term “doxing” refers to the publishing of personal or sensitive data about
    people or organizations for the purpose of vigilante justice, harassment, embarrassment,
    extortion, or coercion. Organizations like Anonymous, AntiSec, and LulzSec use
    doxing to draw attention to perceived injustices. Most people and organizations
    do not have to worry about these groups. However, conflicts occur between people,
    friends, coworkers, employees; and you might provoke a person who will do something
    like this.


    Celebrities represent obvious targets for hackers seeking sensitive cloud data.
    Recently, a number of celebrities had nude photos of themselves downloaded from
    their private Apple iCloud accounts in an event called “The Fappening.” Hackers
    used brute force attacks on names, passwords, and security questions to obtain
    the data. Apple denied a breach in their security and instead blamed weak passwords
    and lack of two-factor encryption (


    Violently radical organizations use the Internet to intimidate their enemies.
    They use the Internet to spread information and they use it to find information
    to use against those who oppose them. A white supremacist group targeted a federal
    judge for assassination by circulating her address and family photos on the Internet.
    Two years later, the judge came home to find her husband and mother murdered execution-style.
    In this case, the killer did not have connections to white supremacy, but the
    implications seem clear (


    ## 1.3 Cloud Storage


    ### 1.3.1 What Is It?


    The cloud storage data model specifies how digital data gets stored and retrieved
    across multiple servers in possibly geographically different locations and managed
    by a hosting provider. Cloud storage uses a logical memory model that allows providers
    to store your data on multiple servers in different locations in a way transparent
    to you.


    At a minimum, cloud storage includes space for some amount of data and a simple
    interface to manage files in the storage. Often this involves creating a special
    folder on your computer and monitoring file activity in it. Dropbox belongs to
    this category of cloud storage. More elaborate cloud storage includes sophisticated
    SaaS that seamlessly integrates with backend cloud storage. Google Docs offers
    this kind of service for Google Drive.


    This book focuses on security concerns for users of cloud data storage and those
    using SaaS. We do not address the additional security issues related to those
    needing PaaS and IaaS. Thus, this book provides information and guidance for cloud
    data storage users who do not have significant control of security of the software
    or cloud infrastructure.


    ### 1.3.2 Case Studies: Comparison of Cloud Storage Security


    We now compare security features for a number of cloud storage providers. [Table
    1.1](#chp001.xhtml#t0010) does not provide a complete list or an endorsement.
    Instead, we want to indicate the range and availability of some important security
    features.


    Table 1.1


    Selected Security and Privacy Features of Free Cloud Storage Providers'
