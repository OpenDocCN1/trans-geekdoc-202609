    # Facebook shares and receives information from advertising partners. The TOS
    notes that if they receive data that they do not already have they will anonymize
    the data within 180 days and will stop associating the information with the user.
    It is not stated what they do with this data during the 180 days.


    They collect and aggregate information from other Facebook users about you, such
    as “when a friend tags you in a photo or video, provides friend details, or indicates
    a relationship with you.”


    Photos and videos contain metadata and can provide information about where the
    picture was taken, when it was taken, latitude/longitude, make and model of the
    camera, etc. Facebook does not remove this information. They state that if you
    don’t want this information stored, and thus shared, you should remove metadata
    before uploading. Metadata poses a risk to privacy.


    As an example, if you share a picture of your birthday party at your house, metadata
    could reveal the date and location where the picture was taken. With this information
    your date of birth and your home location could be determined. Using that information
    and searching publicly available property records provided by most states and
    counties in the United States, one could determine when you bought your house,
    how much you paid for it, the floor plan, and who owns the mortgage if there is
    one. Then using Google Street View one could “drive” around your neighborhood
    and see what your house looks like from the street.


    The Exchangeable Image File (EXIF) metadata is a standard format that is used
    for storing information in digital camera/phone image files that use JPEG compression.
    This metadata can be easily parsed with EXIF viewers and editing tools, such as
    IrfanView, EXIFtool, and various browser plugins. These tools and others can be
    used to remove identifying information stored in JPEG images. There are also websites
    where pictures can be uploaded and the metadata can be viewed, but as you may
    have guessed, this is another user-generated security risk.


    Facebook allows setting restrictions on what is shared. In their privacy settings
    tab, they have the concept of sharing with “everyone,” which means that data is
    publicly available information, and it may be accessed by everyone on the Internet.
    Everyone data is subject to indexing by third-party search engines and may be
    associated with you outside of Facebook when you visit sites on the internet.
    It may be imported and exported by Facebook and others without privacy limitations.
    The default privacy setting for certain types of information you post on Facebook
    is set to “everyone.” From a personal privacy perspective, this is a treasure-trove
    of information that can and will be used by “others” without your permission,
    because you have agreed to this during sign up.


    Facebook provides a way that you can delete “everyone” content that you posted
    on Facebook, and they will remove it from your Facebook profile. They also state
    that they have no control over its use outside of Facebook. Deleting information
    from Facebook does not guarantee that the data does not exist elsewhere on the
    internet.


    Anyone that you make your information available to, which is by default everyone,
    “may use tools like RSS feeds, mobile phone address books, or copy and paste functions,
    to capture and export information from Facebook, including your information and
    information about you.”


    ## 2.3.2.7 How Facebook Uses Data They Collect


    In section 4 of Facebook’s Privacy Policy, they describe what they do with the
    data they collect. “We allow advertisers to choose the characteristics of users
    who will see their advertisements and we may use any of the non-personally identifiable
    attributes we have collected (including information you may have decided not to
    show to other users, such as your birth year or other sensitive personal information
    or preferences) to select the appropriate audience for those advertisements.”


    Facebook may display your name and profile photo next to an advertisement displayed
    to your friends, which may include personally identifiable information. This is
    the default behavior, but you can choose to opt out.


    To supplement your profile, Facebook may collect and aggregate information from
    your friends. As with other social media providers, Facebook may disclose information
    pursuant to subpoenas, court orders, or other requests, such as National Security
    Letters. This applies to criminal matters where they have a good faith belief
    that the response is required by law. It also applies to civil matters, such as
    medical malpractice, personal injury, and divorce.


    They also state that this may include requests from, “jurisdictions outside of
    the United States where we have a good faith belief that the response is required
    by law under the local laws in that jurisdiction, apply to users from that jurisdiction,
    and are consistent with generally accepted international standards.” Privacy and
    freedom of speech have different meanings in different countries. Know the laws
    governing the country where you live. The data that you put on Facebook is not
    private.


    By using Facebook you consent to having the information you provide collected
    and processed in the United States. This makes all users of Facebook subject to
    the laws of the United States and your data subject to subpoena and National Security
    Letter actions.


    Governments worldwide are requesting user information from Facebook. It is reported
    that these requests are up by 24% over last six months of 2013. In a report release
    in 2015, Facebook stated that they received 15,433 US government requests for
    data associated with 23,667 accounts in the first six months of 2015. They complied
    with over 80% of the requests.


    Facebook provides a way to delete an account and the information they have stored
    on your behalf. However, content that was shared or made available as described
    in the Privacy Policy may remain viewable and available outside of Facebook.


    ## 2.3.2.8 Conclusion


    Social media sites like Twitter and Facebook store personal and other data that
    users voluntarily provide in exchange for using their free service. Their business
    model relies on using this data to target advertising and for other purposes.
    These companies, and others, may aggregate user-supplied data with data gathered
    from external sources to develop a demographic and behavioral profile of users.


    ## 2.4 Office Suites


    ### 2.4.1 Background


    In this section, we look at cloud-based office suites from a security perspective,
    which includes both analysis of document transport and cloud storage, in addition
    to data privacy issues.


    Both Google Docs and Microsoft 365 are SAAS cloud-based office suites. They provide
    web-based word processing, spreadsheet, presentation, and drawing applications.
    They also provide multi-device document storage and sharing through the cloud.
    Originally these suites were installed on individual computing systems, but with
    the availability of high-speed internet access, these suites have been moving
    to the cloud. There are several vendors offering this online capability, and in
    this section we analyze two of them: Google Docs and Microsoft 365 using the case
    study methodology.


    ### 2.4.2 Case Studies: Comparison of Cloud-Based Office Suite Security (Microsoft
    Office 365 and Google Docs)


    #### 2.4.2.1 Questions

