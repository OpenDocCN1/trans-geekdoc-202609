  trans: "\n\n-   41. Zetter, K., 2011. 声明：WikiLeaks 发布的文件通过文件共享软件提取。Wired. [在线] 1\
    \ 月 20 日. [`www.wired.com/2011/01/wikileaks-and-p2p/`](http://www.wired.com/2011/01/wikileaks-and-p2p/)\
    \ (访问于 2015 年 4 月)。\n\n# 第 4 章：合规性\n\n本章根据四项联邦法律研究了云存储，这些法律监管了可能受益于云存储提供商优势的行业。从云存储的角度来看，这些法律概述了必须实施的安全措施以保护个人信息。无论被称为个人身份信息\
    \ (`PII`)、受保护的健康信息 (`PHI`) 还是非公开个人信息 (`NPI`)，其安全要求都是相似的。它们的目标是确保信息的安全性、完整性、机密性和可用性。行业最佳实践为实现这些目标提供了起点，包括行政、物理和技术保护措施。\n\
    \n### 关键词\n合规性；云存储；安全；多德-弗兰克；HIPAA；SOX；GLBA\n\n对于企业而言，云在灵活和廉价的存储方面具有显著优势。通过将日常运营、维护、备份和灾难恢复工作交由云服务提供商，公司不仅可以在硬件和软件许可方面实现大幅成本节省，还可以减少劳动力成本和设施费用。此外，云解决方案还提供了动态扩展容量的能力，以可预测的成本满足业务周期和未来的增长需求。\n\
    \n但是（凡事总有有句“但是”），如果一个实体、企业或个人受到数据存储和传输相关法律法规的约束，那么这些法规也适用于云服务提供商。对于将存储外包给云提供商的企业来说，有责任确保该提供商符合管辖法律规定的条例。当将数据托付给云存储提供商时，必须进行尽职调查以确保法律和监管的合规性。\n\
    \n## 4.1 处理他人数据的法律责任\n\n在将数据迁移到云端时，必须考虑许多州法律和联邦法律法规。适用何种法律取决于业务类型以及企业收集、存储和维护的数据类型。这些法律中的大多数侧重于对个人身份信息\
    \ (`PII`) 的保护。\n\n美国国家标准技术研究院 (`NIST`) 将 `PII` 定义为：“机构维护的关于个人的任何信息，包括 (1) 任何可用于区分或追踪个人身份的信息，如姓名、社会安全号码、出生日期和地点、母姓或生物识别记录；以及\
    \ (2) 任何其他与个人关联或可关联的信息，如医疗、教育、财务和就业信息”。 \n\n请注意，该定义使用了“机构（agency）”一词，主要适用于美国联邦政府机构，但其他组织可能会发现该定义很有用。\n\
    \n`PII` 的示例包括但不限于：\n*   姓名，例如全名、婚姓、母姓或别名\n*   个人识别号码，例如社会安全号码 (`SSN`)、护照号码、驾执照号码、纳税人识别号或财务账户或信用卡号\n\
    *   地址信息，例如街道地址或电子邮件地址\n*   个人特征，包括照片（尤其是面部或其他识别特征的照片）、指纹、手写体或生物识别数据（例如视网膜扫描、语音签名、面部几何结构）\n\
    *   与上述任一关联或可关联的个人信息（例如出生日期、出生地、种族、宗教、体重、活动、地理指标、就业信息、医疗信息、教育信息、财务信息）。\n\n美国联邦政府颁布了许多监管\
    \ `PII` 收集、传输、存储和维护的法律。许多州也颁布了影响 `PII` 存储和使用的州法律。虽然这些法律主要侧重于特定的业务部门（如医疗和金融行业），但云存储供应商提供的服务也必须遵守这些法律。\n\
    \n本节将关注监管或影响数据存储的四项美国联邦法律。这些包括：\n\n*   `HIPAA`——1996 年《健康保险流通性与责任法案》规定了保护患者健康信息的联邦标准。接触医疗数据的实体必须遵守规定的指南以保护患者隐私。\n\
    *   `Dodd-Frank`——多德-弗兰克华尔街改革与消费者保护法》的目的是通过提高金融系统的问责制透明度来促进金融稳定、结束“大而不能倒”、通过停止救助保护美国纳税人、保护消费者免受滥用金融服务的影响以及其他目的（Dodd-Frank,\
    \ 2010）。为了实现这些目标，组织必须对所有交易记录进行收集、存储、维护并提供检索。\n*   `GLBA`——1999 年《格雷姆-莱希奇法案》（又名金融服务现代化法案）要求金融机构建立保护客户非公开个人信息的标准。\n\
    *   `SOX`——2002 年《萨班斯-奥克斯利法案》（又名公众公司会计改革与投资者保护法案）旨在监管上市公司的财务行为以防止欺诈。`SOX` 法的一部分直接影响数据存储，包括电子记录的保存和准确性、建议的存储期限以及规则适用于业务记录类型。\n\
    \n## 4.2 影响云存储的美国联邦法律和法规\n\n本节将讨论这四项法案在云存储方面的应用。这四项法案中的每一项都没有规定具体的解决方案解决解决方案，也没有认可或推荐任何供应商的方法。相反，它们提供了“指南”，将具体的执行留给受监管实体，以便他们利用当前和未来的技术。\n\
    \n### 4.2.1 HIPAA\n\n如前所述，1996 年《健康保险流通性与责任法案》规定了保护患者健康信息的联邦标准。接触医疗数据的实体（如医生、牙医、医院和医疗保险公司）必须遵守规定的指南以保护患者隐私。\n\
    \n根据美国健康服务部的规定，法律要求任何拥有保护健康信息 (`PHI`) 的实体必须“防止对信息安全或完整性可预见的威胁”。注意，`PHI` 和 `PII`\
    \ 的相似之处在于它们都指的是个人的隐私数据。`PHI` 将这一概念扩展到医疗相关信息，如实验结果、诊断、治疗、药物和处方。业务实体（包括云存储提供商）并没有官方的\
    \ `HIPAA` 认证。目前的最佳实践是提供授权和访问控制，并对传输中和存储的数据进行加密。“人们认为”采用这些最佳实践有助于履行保护 `PHI` 存储的义务。\n\
    \n`HIPAA` 有四个领域直接影响云端 `PHI` 的存储：\n\n"
