- fmt: "\n# Electronic discovery (e-discovery) creates privacy challenges because\
    \ it must balance the privacy of data owners with legal disclosure laws. Cloud\
    \ data and international business relations mean e-discovery laws for a particular\
    \ request may conflict. Agents responsible for collecting and analyzing potential\
    \ data may not offer the same level of security and privacy as your cloud storage\
    \ provider, thereby putting your data at risk.\n\nCivil litigation can get nasty,\
    \ especially divorce cases. Any data that might help the other side will get subpoenaed.\
    \ Having your data stored in the cloud means you do not have possession of it\
    \ and the account itself indicates that data of some kind exists and warrants\
    \ investigation. Your spouse might know or guess your access credentials to your\
    \ cloud accounts, or install spy software on your devices to obtain data or credentials.\
    \ In a worst-case scenario, your spouse could delete or upload content to your\
    \ cloud storage, either of which could create problems for you in court.\n\n##\
    \ 3.3.5 Law Enforcement\n\nMoving your data to the cloud where government agencies\
    \ can analyze it without your knowledge can create problems for you even with\
    \ a well-intentioned government. A recent ruling by the United States Supreme\
    \ Court made it clear that a person’s Fourth Amendment right does not protect\
    \ them from search and seizure when law enforcement officials make genuine mistakes\
    \ about the interpretation of the law.\n\nLegal issues exist even when law enforcement\
    \ authorities obtain data legally. In one case, police used legally obtained data\
    \ to falsely represent a person online, claiming they could use her data in any\
    \ way as part of an ongoing investigation. Not only did authorities use the woman’s\
    \ identity, they also used photos of child relatives.\n\n## 3.3.6 Lifestyle and\
    \ Psychological Profiling\n\nWhat are your legal rights when others use information\
    \ to construct a profile of you as an individual? Marketers do this for targeted\
    \ advertising, but this does not impose on you any legal obligations or penalties.\
    \ However, consider the consequences of employers, insurance companies, or law\
    \ enforcement agencies using your data to build lifestyle and psychological profiles\
    \ of you.\n\nCompanies with access to your cloud data can correlate it with data\
    \ from other sources and use it to successfully predict such things as pregnancy.\n\
    \nResearchers like \n\nThe Philip Dick novel “Minority Report” describes a world\
    \ where the government pre-convicted people for future crimes based on predictions\
    \ of possible future behavior. The intent to prevent crime could be used to justify\
    \ access to all cloud storage data to look for patterns typically seen in those\
    \ who do commit crimes.\n\nWhen marketers make a profiling error, you get an irrelevant\
    \ advertisement. When government agencies make profiling errors, it can cost a\
    \ person a great deal in time and money to fix the mistake. Consider the cases\
    \ of people put on no-fly lists for no apparent reason and the difficulties they\
    \ have in correcting the error.\n\n## 3.4 Criminals, Authoritarian Governments,\
    \ and Friends\n\nLaws of most countries afford individuals and organizations at\
    \ least some data privacy protections. These laws might seem vague or inconsistent,\
    \ or offer less than preferred protection. Regardless, some level of data privacy\
    \ protection exists. [Chapter 4](#chp004.xhtml#chp004) will address compliance\
    \ and data privacy protection in different countries.\n\nNow we address the non-legal\
    \ threats to your cloud data. Criminals we know about. However, authoritarian\
    \ governments with no regard for your right to privacy, or any other right for\
    \ that matter, pose a serious threat to cloud data security and privacy. Your\
    \ friends, or the people you trust, often become the greatest source of data privacy\
    \ breaches.\n\n### 3.4.1 Criminals\n\nEveryone knows the threat that criminals.\
    \ Criminals have myriad of ways to get access to cloud data. They can exploit\
    \ vulnerabilities in software, use phishing attacks to obtain data, guess weak\
    \ passwords, or physically obtain a device.\n\n### 3.4.2 Authoritarian Governments\n\
    \nThe recent hack of Sony illustrates several dangers faced by. The movie “Interview”.\
    \ Two main theories exist as North Korea.\n\nWe all want to believe that government\
    \ will exercise discretion and restraint with data we store in the cloud. Many\
