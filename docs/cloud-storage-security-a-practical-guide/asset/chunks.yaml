    a legal and jurisdictional perspective, they are subject to the laws of those
    countries in which they operate. From the information available, data is subject
    to the laws of the United States and may be subject to the laws of the European
    Union. In addition, other jurisdictions may be involved including some in Asia,
    because of their offices in Shanghai, China.


    Since Mozy only stores encrypted data and has no access to encryption keys, data
    content is as secure as the pass phrase used to create the 256-bit AES encryption
    keys.


    #### 2.2.2.11 Privacy


    Since the business model of these companies focuses on selling cloud storage,
    they are not interested in data-mining to sell advertising, as is the case for
    cloud-based email services. The private information that they collect is used
    to maintain and grow their businesses, and as such, they have a vested interest
    securely maintaining the privacy of this information.


    #### 2.2.2.12 Conclusion


    A number of security issues must be considered when using cloud backup services.
    Data-in-motion and data-at-rest are handled differently than other cloud services
    that have been discussed. Data files are encrypted before they leave the user’s
    device. Because data is encrypted before leaving the device and not decrypted
    until it has been downloaded back to the device, it is as secure as the encryption
    algorithm, providing a level of security referred to as TNO – trust-no-one.


    It is important that data is stored redundantly within a data center and geographically
    dispersed to maintain the highest level of data security. This is important to
    guard against natural and man-caused disasters. Jurisdictional issues arise when
    data is located in multiple states and foreign countries.


    ## 2.3 Social Media


    ### 2.3.1 Social Media as Cloud Storage


    In this section, we look at social media, cloud storage, and privacy. The goal
    of social media is to share information with others. Others can be defined as
    a group of friends, a family, college fraternity, work colleagues, people with
    similar interests, etc. Social media can also be used to share information and
    thoughts with everyone anywhere. While information privacy and sharing seem to
    be at opposite ends of the information security spectrum, we will discuss the
    intersection and the ramifications of these two qualities on social media.


    Twitter and Facebook have been reported to play a key role in social and political
    movements around the world. As an example, a young underemployed Tunisian college
    graduate working as a vegetable vendor set himself on fire December 17, 2010,
    after police stole produce from his stand. This event triggered a revolution in
    Tunisia that spread across the Arab world, as young Tunisians began organizing
    on Twitter and Facebook to protest the 23-year regime of President Zine El Abidine
    Ben Ali. On January 14, 2011, President Ben Ali fled Tunisia, which triggered
    similar movements across the region from North Africa to Iran.


    Another example: On Thanksgiving Day, 2015, several thousand people in Manhattan
    attempted to disrupt the annual Macy’s Thanksgiving Day Parade as part of a protest
    against a grand jury decision in Ferguson, Missouri. The demonstrators used the
    hashtag #Stoptheparade on Twitter to rally supporters to their cause.


    Interestingly this was first reported in the UK Daily Mail Online with this footer:


    Follow us: @MailOnline on Twitter | DailyMail on Facebook


    ### 2.3.2 Case Studies: Comparison of Social Media Security (Facebook and Twitter)


    Privacy is your right to control personal information and how much you wish to
    share with others. In this section we analyze privacy policies of Facebook and
    Twitter as users worldwide share their personal information, thoughts, and observations.


    #### 2.3.2.1 Questions


    What information is collected? Who is it shared with? What do they do with this
    data? Where is the data stored? What protections are available?


    #### 2.3.2.2 Security Concepts'
