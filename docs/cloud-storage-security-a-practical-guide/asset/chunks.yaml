    尽管有成千上万的健康健身应用程序，但并非所有都是畅销产品，许多应用并不实用，而且极少数获得了医疗专业领域或政府监管机构的批准或监管。少数已批准的应用主要是为了协助医生，例如，允许他们轻松地共享
    X 光片、CT 扫描和心脏成像图像；或与用于诊断特定疾病或状况的外部设备结合使用。美国食品药品监督管理局（FDA）的移动医疗应用程序政策不适用于作为电子健康记录（EHR）系统或个人健康记录系统的移动应用程序。因此，这些应用不受
    HIPAA 法规的约束（参见第 4 章 合规性）。该机构不监管智能手机或平板电脑的销售或普通消费者使用，也不监管 iTunes App Store 或 Google
    Play Store 等移动应用分发商。


    - 旨在用作受监管医疗设备的配件——例如，一种允许医疗保健人员通过查看智能手机或移动平板电脑上来自图像存档和通信系统（`PACS`）的医学图像做出特定诊断的应用；或


    - 将移动平台转换为受监管的医疗设备——例如，一种将智能手机转换为心电图（`ECG`）机的应用，用于检测异常心律或判断患者是否正在遭受心脏发作。


    然而，FDA 鼓励创建和使用人们可以管理自身健康和健康的健康应用，例如监测血压、心率、运动、饮食和热量摄入。美国国立健康研究院（NIH）甚至创建了一个名为
    `LactMed` 的应用，为哺乳母亲提供有关药物对母乳和婴儿影响的信息。


    ## 2.5.2.4 隐私与安全


    从隐私角度来看，主要的关注在于应用程序收集什么类型的信息以及是否将这些信息存储在云端。它们可能会收集生物识别信息、心率、血压等，也可能是用户自愿输入的信息，如饮食和运动计划。这就变成了云存储有多安全的问题，这在第
    2.3 节“云备份服务”中有详细描述。传输中数据和静态数据问题以及密钥管理和数据隐私都是必须考虑的问题。此外，必须确定谁“拥有”数据以及谁有权访问这些信息。云服务提供商或应用开发者可以将这些信息出售给数据聚合器、保险公司或数据经纪人吗？这些问题的最佳解决办法是仔细审阅应用开发者和云提供者的服务条款（TOS）协议以及他们的隐私政策。


    ## 2.5.2.5 结论


    通过智能手机应用程序收集并存储在云端的健康数据对个人隐私构成了安全风险。例如，健康信息在保险公司评估您的健康状况时可能具有巨大的货币价值，因为这决定了健康保险和人寿保险保单的成本。目前，对于健康健身应用收集的数据以及数据收集后可以进行如何处理，尚没有任何监管。大多数应用程序未获得医学界的批准或背书，在某些情况下，它们可能会提供虚假或误导性信息。显然，健康决策最好在咨询医生后做出。尽管如此，健康健身应用及其收集的数据可以带来更健康的生活。


    ## 2.5.6 总结


    本章识别了将数据存储在云端的应用程序。


