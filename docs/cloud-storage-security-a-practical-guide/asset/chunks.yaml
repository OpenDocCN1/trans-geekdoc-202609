  trans: '

    此前我们讨论了传输中数据和静态数据。由于社交媒体的目标是共享信息，因此传输安全和静态安全其重要性并不如数据备份和云端电子邮件那样关键。尽管如此，Twitter
    和 Facebook 都使用 `HTTPS` 和 `SSL` 在用户与数据服务器之间传输数据。存储在云端的数据并未经过加密。


    这些以及其他社交媒体公司的商业模式依赖于收集和聚合用户数据，以投放针对特定用户兴趣的广告。这使得他们能够提供有价值的免费服务，同时也创造了盈利的机会。


    ## 2.3.2.3 方法与结果


    为了解决研究问题以及隐私与共享之间的平衡，我们审查了 Facebook 和 Twitter 的隐私政策，以及其他公开的可用。


    ## 2.3.2.4 Twitter


    为了帮助你构建更具个性化的 Twitter 体验，我们正在收集并偶尔更新你移动设备上安装的应用列表，以便我们向你提供你可能感兴趣的定制内容。


    为了开始对其产品进行变现，Twitter 正在采用已被 Google、Facebook 等公司证明有效的策略。这需要更新其隐私政策，他们将通过 Twitter
    应用程序中的应用通知提供该更新。该更新要求用户在免费的 Twitter 应用中采取某种操作，以退出新的隐私使用条款。默认设置是加入（opt-in），意味着默认情况下如果你使用该应用，你就同意了
    Twitter 的 `TOS` 和隐私政策。


    来自 Twitter 的 `TOS`：


    你在 Twitter 上说的话可能立即被全世界看到。你推文的内容定义了你！


    他们还声称：


    Twitter 提供的服务在不断演进，Twitter 提供的服务的形式和性质可能会发生变化，而无需事先通知你。(2015)


    虽然有报道说 Twitter 将向你提供其 `TOS` 的任何更改，但如果仔细阅读，`TOS` 明确规定他们的服务可能会在不进行通知的情况下发生变化。


    与大多数社交媒体提供者一样，`TOS` 引用了隐私政策并规定：“你对同意的服务意味着你同意收集和使用（如隐私政策所述）的这些信息，包括将这些信息传输到美国和/或其他国家以供
    Twitter 存储、处理和使用。”


    因此，通过使用该服务，你同意收集和使用流经其系统的你产生的信息，并且这些信息将存储在世界各地——且未加密。


    此外，Twitter 有权将他们收集的关于你的信息提供其他公司用于联合、广播、分发或出版。这样做是因为他们拥有流经其系统的数据，而无需向你支付任何补偿。如果你没有使用该内容的权利，可能会使你承担责任。当然，正如其隐私政策所述，Twitter
    将不承担责任。这可能会发生，例如，如果推文了一个来自电缆新闻节目的视频片段，或一张由他人拥有版权的照片。


    他们还“保留访问、读取、保存和披露任何信息的权利，只要我们合理认为这些是必要的，以 (i) 满足任何适用法律、法规、法律程序或政府请求”。


    ## 2.3.2.5 Twitter 隐私政策


    Twitter 在注册期间收集个人信息，包括姓名、用户名、密码和电子邮件地址。他们可能还会收集位置信息。


    作为社交媒体服务的常见做法，你可能选择添加有关他们工作地、就读学校以及一张照片的信息。注册后，人们使用 Facebook 分享有关他们的生活、喜欢的事、照片、视频、网站链接等信息。所有这些信息都可以被聚合和分析，以形成用户画像，并用于投放广告。


    在他们的隐私政策中，Twitter 还表示他们广泛传播了这些信息。他们这样说时带有一个前提说明：“你应该仔细考虑你正在公开的内容。”


    你可能自愿发布位置信息，Twitter 会收集并存储这些信息。这包括通过基站和无线网络传输的位置信息。收集和存储位置信息的隐私影响是，它可以用于建立行为模式。


    当你与 Twitter 交互时，会收集设备和操作信息，包括你的 IP 地址、浏览器类型、操作系统、来源页面、访问过的页面、位置、你的移动运营商、设备和应用标识符、搜索词和
    cookie 信息。当你使用 Twitter 账户授权其他服务时，Twitter 还会收集信息。很少用户知道这是一个跟踪设备，而且他们正在被跟踪。


    ## 2.3.2.6 Facebook


    在这一节中，我们根据对当前 `TOS` 和隐私政策的分析，查看 Facebook 的安全性和隐私。再次必须指出，Facebook 和其他社交媒体服务的目的是共享信息，且这些信息是由服务用户自愿提供的。


    用户在注册 Facebook 时提供的个人信息包括用户的姓名、电子邮件、性别和出生日期。Facebook 提供了导入电子邮件联系列表的工具，帮助你邀请你的联系人加入
    Facebook 并将你添加好友。为了协助你完成这一工作，他们的政策规定：“如果你给我们你的密码以检索那些联系人，我们会在上传联系人后将不再存储你的密码。”

