    Data privacy challenges exist because your data has value to so many, both in
    the content of the files, the metadata associated with the files, and the identities
    of those who access the files. Experts expect more incidents of data breaches
    as more people migrate sensitive data migrates to cloud storage. Using cloud storage
    to make your data available from anywhere could have legal implications in regard
    to travel, foreign and domestic laws, employment, and insurance. We all worry
    about criminals stealing data. However, we should worry equal about ourselves,
    families, and friends exposing our private data. In the extreme, some must worry
    about privacy violations by authoritarian governments.


    ### Keywords


    `Privacy`; `data stewardship`; `data breaches`; `legal threats`


    If a tree falls in the forest and no one hears it, does it make a sound? If someone
    collects your personal information and it does not harm you, does it matter? Many
    people consider cloud data security and privacy concerns unnecessary because they
    believe (1) their data has value only to them, (2) they have herd immunity giving
    them a low risk, or (3) they have some security protection so attackers will focus
    on more vulnerable targets. However, more people may covet your data than you
    think, and more sophisticated tools and computing resources mean more individuals
    and smaller organizations become low hanging fruit.


    We use this chapter to illustrate the scope of privacy issues that might influence
    the level of security you want for your private cloud data. We will paint a bleak
    picture intentionally of cloud security and privacy challenges. We hope this will
    help you make informed decisions about the sensitivity of your data before migrating
    it to cloud storage.


    You represent one of the greatest challenges to your privacy because you decide
    to put your data in cloud storage. However, those who have information about you
    can put this data in cloud storage too, and you have less control over this happening.
    Trust becomes a significant challenge to your privacy.


    Both individuals and organizations use private shared cloud storage to share and
    collaborate with a small trusted group, or to control access to a large number
    of people. Even private individuals not engaged in commercial activity should
    exercise some level of data stewardship when it comes to information about others
    they store in the cloud. Your knowledge of others represents shared information
    between you and them (`[Figure 3.1](#chp003.xhtml#f0010)`).


    ![Figure 3.1 Data privacy considerations.](images/F000034f03-01-9780128029305.jpg)


    Figure 3.1 Data privacy considerations.


    You as an individual put your data in the cloud to store or share. You also put
    information about others in the cloud. You might do this with their knowledge
    because of some collaborative effort, or without conscious thought as part of
    your own data. Those who know you can do the same with your private data (`[Figure
    3.2](#chp003.xhtml#f0015)`).


    ![Figure 3.2 Path of private data to the cloud.](images/F000034f03-02-9780128029305.jpg)


    Figure 3.2 Path of private data to the cloud.


    ## 3.1 Who Wants Your Data?


    Data privacy challenges exist because your data has value. `[Figure 3.3](#chp003.xhtml#f0020)`
    shows just some of the value contained in data that you store in the cloud and
    make available. Data you store in the cloud might contain, directly or indirectly,
    a great deal of information others consider valuable. The value could come from
    the file content itself or from metadata associated with the file, including file
    access-related data. `[Figure 3.4](#chp003.xhtml#f0025)` illustrates just some
    of the individuals and groups who might be interested in the data you store in
    the cloud.


    ![Figure 3.3 The value in your cloud data.](images/F000034f03-03-9780128029305.jpg)


    Figure 3.3 The value in your cloud data.


    ![Figure 3.4 Individuals and groups who value your cloud data.](images/F000034f03-04-9780128029305.jpg)


    Figure 3.4 Individuals and groups who value your cloud data.


    Your privacy and security considerations should include how others interpret your
    public cloud data. People often use social media as a diary or chronology of their
    lives. Companies may also use social media for communication and collaboration
    internally or with clients and partners. Individuals and companies should consider
    carefully such practices and think about their personal or corporate branding.


    Data about individuals stored in the cloud by individuals or by organizations
    has value to many people. Friends and family would argue they have a legitimate
    interest in some information. Employers too might want sensitive data about employees,
    arguing it affects job performance. Marketers obviously seek information to help
    them segment and predict purchasing decisions. Insurance companies want clues
    about individual health and lifestyle habits. Criminals use data about individuals
    for identity theft, cyber-stalking, cyber-bullying, and extortion. Identity thieves
    might use your identity to establish lines of credit or to conduct illegal activity
    under an alias. Personal enemies may want information to embarrass or discredit
    a person. Authoritarian governments want cloud data to identify threats to the
    status quo.


    Organizational data in cloud storage has value for corporate espionage. Competitors
    can benefit from intellectual property, customer contacts, information about ongoing
    negotiations, and corporate finances. Activists want organizational data to embarrass
    or discredit a company. Authoritarian governments might target a foreign organization’s
    cloud storage in retaliation for political challenges (e.g., North Korea and Sony)
    or to support economic interests in their own country.


    Your data has value to many individuals and groups. Now you put that data in cloud
    storage, in part so it is “always available” on multiple devices. But, if you
    can get it from anywhere, then others have more opportunities to get it too.


    `[Figure 3.5](#chp003.xhtml#f0030)` shows how both you and others can expose your
    private cloud data to unintended people and organizations. Cloud providers chosen
    by you and others can impact your data privacy. Provider terms and conditions,
    employee actions (mistakes or malice), local laws regarding data privacy in data
    centers, and cyber-attacks on the provider can result in the loss or exposure
    of your sensitive data. The practices used by your cloud storage provider for
    data life-cycle management affect your data privacy. Data retention policies after
    deletion and not completely erasing data from storage disks in multi-tenant systems
    can mean your private cloud data persists long after you assumed it was deleted.
    This also means that your deleted data is vulnerable.


    ![Figure 3.5 Ways to get your cloud data.](images/F000034f03-05-9780128029305.jpg)


    Figure 3.5 Ways to get your cloud data.


    The devices that you and others use both hold copies of the data and allow a connection
    to the cloud storage. Losing control of the device could mean losing control of
    your private data. You must trust both yourself and others not to make mistakes
    about security configurations and content. Likewise, you must trust that the people
    who you share private data with will protect it under all circumstances.

