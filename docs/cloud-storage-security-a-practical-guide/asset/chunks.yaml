    Email providers may offer some kind of encryption to users. However, in many cases
    the email provider controls the encryption keys. Just as with secure cloud storage,
    this means you must trust the ability and intentions of the provider to value
    your data privacy as much as you. ProtonMail ([https://protonmail.ch/](https://protonmail.ch/))
    provides a zero-knowledge email encryption service. In addition, they have their
    data center in Switzerland so your email data falls under Swiss Federal Data Protection
    Act (DPA) and the Swiss Federal Data Protection Ordinance (DPO).


    Email clients with public key encryption capabilities offer another way to have
    private email messages. The Scribe email client works on both Linux and Windows
    and has a GnuPG plugin ([http://www.memecode.com/scribe/gnupg.php](http://www.memecode.com/scribe/gnupg.php)).
    The Enigmail ([https://www.enigmail.net/](https://www.enigmail.net/)) extension
    to Thunderbird and SeaMonkey provides public key encryption of email messages.


    ## 5.4 Passwords and Encryption Keys


    Passwords and public key encryption provide the foundation for data privacy by
    encrypting your data and controlling access to your cloud storage account. Attackers
    can apply brute force password attacks to cloud data accounts, and then apply
    this same technique to the encrypted data files themselves. If they gain access
    to the key stores then they can work offline to crack the key store encryption.
    They can also seek to obtain the private key needed to decrypt any encrypted files
    they acquire. Thus, the password and private key store become the private data
    of most security concern.


    Several password generation tools exist to reduce your risk of brute force password
    attacks on your cloud data accounts and on encrypted data files themselves. People
    choose passwords they can easily remember, perhaps with the idea that it makes
    it more secure because they do not have to write it down.


    However, easily remembered often means easily guessed. A variety of strategies
    exist to make complex but easy to remember passwords by combining words and numbers
    and applying patterned substitutions. Unfortunately, if you can apply a rule to
    create a password, then so can a password cracker. Any rule you can think of probably
    has already become part of a password cracking tool.


    The following suggestions will help with your password generation and management:


    - Use long, random passwords.

    - Use unique password for each site.

    - Change the password frequently and unpredictably. Allied intelligence broke
    the encryption of the Enigma machine because the Nazis did not change the password
    frequently enough.


    Consider using a password manager to create and manage passwords for you. You
    need to remember one very secure password to access the password manager. The
    password manager generates long, random passwords for you and will usually handle
    account logins automatically.


    LastPass ([https://lastpass.com/](https://lastpass.com/)) works as a browser plugin
    and provides limited file sharing for a fee. LastPass will synchronize your key
    store across all your devices so you can access your accounts from anywhere. LastPass
    also offers enterprise single-sign-on (SSO) products and services. KeePass ([http://keepass.info/](http://keepass.info/))
    runs from a USB stick and has features to protect against keystroke loggers and
    caching. KeePass will periodically delete passwords from the clipboard, but this
    remains a vulnerability when using untrusted computers. 1Password ([https://agilebits.com/onepassword](https://agilebits.com/onepassword))
    offers yet another popular solution for password management. Finally, security
    expert Bruce Schneier designed the password manager Password Safe ([http://pwsafe.org/](http://pwsafe.org/)).


    As your password manager master password, you might consider generating and memorizing
    a random 14-character long password of 26 English language letters, including
    capitals, and the digits 0–9. A brute-force attack on such a password will take
    the current fastest supercomputer about 4500 years to break. Even with rapid supercomputing
    technology advances, your private data will likely remain private or will no longer
    have value to you or anyone else by the time the encryption gets cracked.


    You can generate random passwords using the aforementioned password managers.
    Alternative, you can use an online random password generator, such as from LastPass
    ([https://lastpass.com/generatepassword.php](https://lastpass.com/generatepassword.php)).
    For true randomness, change the default “Minimum Digit Count” from 1 to 0. Memorize
    the password you generate by breaking it into chunks for 3–4 characters. Alternative,
    create a memorable phrase from your password (not vice versa!) by choosing words
    that begin with the characters in the password. For example, the password `xPgpbSGIdj5zac`
    could become “Xander, Please get peanut butter Sandwich Glue. I did join 5 zoos
    and churches.”


    Practice learning your password by typing it into a document. This will help build
    muscle memory and engage more of your brain to aid learning. If you want to test
    your memory of the password before going live with it on an actual account, save
    the document using this password and try opening it in a day or two. Save a document
    with a password in most office suites by “File-Save As” and check “Save with password.”
    If you forget the password when you come back to the document later, just delete
    the document and start over. When you feel confident that you have memorized the
    password, use it as your master password with your favorite password manager or
    use it with you cloud storage account.


    ## 5.5 Pay for Security


    Many cloud data storage providers offer encryption and other privacy enhancements
    for paid accounts. Paying for cloud data security makes your private data less
    likely to become the providers product. You will most likely have to pay for additional
    security if you are a business that is subject to federal regulations such as
    HIPAA, as discussed in [Chapter 4](#chp004.xhtml#chp004).


    However, data privacy issues remain. You still must depend on the cloud storage
    provider to manage its own security. Furthermore, if the provider manages the
    encryption keys then local laws governing the data centers where your data resides
    might allow access to your unencrypted data without the due process you expect
    in your own legal jurisdiction. Furthermore, local laws might place restrictions
    on the type of encryption used. Such situations might arise in countries that
    provide at least tacit support for industrial espionage or oppose political activism,
    just to name a few.


    If you do pay for additional security, consider insisting on zero-knowledge encryption.
    Zero-knowledge encryption means that your data gets encrypted before it uploads
    to the cloud storage provider. The provider does not know your encryption key
    and cannot help you decrypt data if you forget or lose your key. Without zero-knowledge
    encryption, a third party has the keys to your private data. By contract, they
    agree not to use these keys to view your data. However, the legal system exists
    in part because people break contracts and these third parties might fall victim
    to a data breach.


    Mega ([https://mega.co.nz/](https://mega.co.nz/)), SpiderOak ([https://spideroak.com/](https://spideroak.com/)),
    Tresorit ([https://tresorit.com/](https://tresorit.com/)), and Wuala ([https://www.wuala.com/](https://www.wuala.com/))
    offer cloud storage with zero-knowledge encryption. Check the fine print though,
    because sharing data with others might mean having your private data decrypted
    temporarily on the cloud provider server.


    ## 5.6 Delete Private Data

