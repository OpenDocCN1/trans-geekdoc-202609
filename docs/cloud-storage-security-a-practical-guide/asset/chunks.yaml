    Consider the case where an observer has access to only your cell phone metadata
    for calls and text. This metadata includes who you call, when you call, from where
    you call, and how quickly you answer. From this limited metadata, researchers
    found they could predict the Big Five Personality traits (neuroticism, extraversion,
    conscientiousness, agreeableness, and openness) of the user significantly better
    than random.


    Cloud data security should also include a consideration of information that could
    uniquely identify a person. Cloud storage providers may collect a variety of user
    data, such as real name, email, phone, physical address, IP address, MAC address,
    physical location (from GPS or IP geolocation), contacts, browser history, and
    cloud storage usage patterns. They can collect much of this data through both
    client applications and server-side interfaces.


    Cloud storage providers will use your data and metadata to improve their quality
    of service (`QoS`) to you. This affords justification to them for searching your
    data and metadata for clues to provide advertising links that generate clicks
    and sales to their advertisers. They might also sell this data to third parties.
    However, usage patterns could leak information about sensitive activities about
    individuals or companies. For example, a company might show more or less activity
    related to certain files before making public announcements. The ability to predict
    the timing and nature of such announcements could provide others with valuable
    insider information about the company.


    Some providers may also scan your files for patterns of colors, shapes, or terms.
    In addition to looking for terms to use for targeted advertising or sale to third
    parties, cloud storage providers may scan images using face recognition software
    or other software to detect things like pornography or even commercial products
    appearing in you these images.


    The `HTTP` protocol allows providers to track your browser history through the
    `REFERER` header field. This field gives the provider the site you visited just
    prior to their site and might also contain search query data. Accessing your cloud
    storage by logging in through a social media site might give the cloud storage
    provider permission to retrieve your social media data as well. Third-party cookies
    in your browser can also reveal to others at least the time patterns that you
    do things with your cloud storage. Smart phone applications that access cloud
    storage collect information about your location from Wi-Fi access points and about
    your contacts.


    We include in our discussion of cloud data security the concept of data availability.
    People and organizations put data in the cloud because they want it available
    anywhere, anytime. Your inability to access your critical data represents a security
    concern, whether that unavailability comes from technical or legal issues, or
    malicious action. The legal and financial stability of the data storage provider
    deserves consideration. Bankruptcy or legal action against the company could make
    your data unavailable to you, temporarily or permanently, and with little notice
    for you to prepare alternatives. Also, such action could put your data in the
    hands of other entities and agencies. You should also consider your cloud storage
    provider’s policies and procedures to protect their network from intrusions, denial
    of service attacks, malicious insiders, and hardware failures. The geographic
    location of the data center(s) can affect availability. Natural disasters far
    away can destroy your data or temporarily deny you access to it.


    ### 1.2.1 Your Data Versus Other People’s Data


    Data you put in cloud storage may belong to you or to others. Your data could
    contain private information about others too. This holds for individuals, companies,
    and academic institutions. This raises the issue of data ownership versus stewardship.
    Data stewardship seems most obvious when you deliberately collect information
    about others.


    *   Academic research surveys

    *   Business marketing surveys

    *   Customer resource management (`CRM`) data

    *   Employee payroll and billing

    *   Patient medical histories


    Data you own includes sensitive information like tax or legal records, private
    email, and personal opinions. Remember that when you put your own personal opinions
    and other information in public clouds, they in some sense belong to others as
    well. You might keep your personal and professional lives separate, but not everyone
    understands or respects such compartmentalization. To many people, no separation
    exists between personal and professional attitudes. Your most gracious and respectful
    professional demeanor will not protect you from an offensive statement made in
    a personal context in a public cloud.


    Data you think you own may contain sensitive information about others and therefore
    have stewardship issues. Consider these instances where your data also contains
    information about others:


    *   Mentions of other people

    *   Photos containing other people

    *   Contacts, phone numbers, addresses

    *   Email `CC` versus `BCC`


    You have to think about the information you know about others and whether that
    information belongs to you or to them. Freedom of speech in the United States
    gives broad liberties to the kinds of information people make public. However,
    just because you can does not mean you should. The Golden Rule applies here, except
    we still have to deal with masochists.


    The greatest threat to your privacy and security comes not from hackers (criminal
    or government), but from your family, friends, coworkers, and employees. You also
    represent the greatest privacy and security threat to them. Loose lips sink ships
    as they say. Before posting data to social media or sharing it with others, think
    about who it provides information about.


    Consider the following two hypothetical (!) posts to social media:


    *   `I skipped work to go drinking.`

    *   `Me and @johnsmith12345 skipped work to go drinking.`


    The first represents your data because it relates to you. The second contains
    other people’s data. You might not get fired from your job for this, but your
    (former!) friend might.


    Photos posted to `Facebook` of yourself that also include other people contain
    their data too. You might not consider the content of this image private or worry
    about security implications. However, other people in the photo may have their
    privacy and security jeopardized. People can find these photos through image searches
    of photo tags and through face-recognition data-mining.


    You can jeopardize a person’s privacy and security by making comments about their
    daily activity patterns, information about their children, or when they go on
    vacation. Criminals can assemble seemingly innocuous details about a person to
    build a profile they can use to their advantage.


    The website `http://pleaserobme.com/` uses locations from `Twitter` accounts to
    geocate people, specifically those away from home. Recently, Britons received
    a warning that insurance companies might not pay claims on home burglaries if
    they find evidence online that the homeowner posted information about their absence
    from homeCritical comments on social media about employers, co-workers, or students
    in the case of teachers have gotten people fired. Also, these comments might reveal
    information others consider private. Employers, especially school districts, can
    terminate employment for personal conduct not directly related to their job, for
    example, photos showing a person drinking alcohol or expressing controversial
    opinions, even in jest. Often, employers will even want access to their employees
    social media.

