    NIST recognizes four deployment models for these service models: private, communal,
    public, or hybrid. Private clouds service a single individual, group, or organization.
    Communal clouds provide cloud services to a restricted community of consumers.
    Public clouds provide cloud services to the general public. Hybrid clouds have
    aspects of the other three, often to optimize these services.


    By data we mean digital files like pictures, music, and documents; comments posted
    in tweets, blogs, and discussion threads. These things constitute data that you
    consciously place in cloud storage. However, your interaction with your cloud
    storage also provides or generates additional information, both about you and
    your data. This information could directly impact your privacy and security, or
    at a minimum it could leak or reveal important details about data that you thought
    private and secure. Cloud storage servers routinely collect this metadata, as
    do web browsers or applications that interact with cloud storage.


    Cloud storage providers will collect metadata about your usage patterns, including
    network IP address, time, file size, file name, file action (add, modify, delete,
    etc.) to aid in quality of service (`QoS`).


    Cloud data storage has many advantages for people, organizations, and companies.
    Cloud services give small businesses cost-effective access to capabilities that
    large companies often handle internally, thus bringing the benefits of scale economies
    to small businesses and making them more competitive. Cloud service providers
    also make these capabilities affordable to individuals too. Cloud services benefit
    people and companies by outsourcing hardware, software, maintenance, and management
    of data storage. Cloud storage provides off-site backup of critical data and allows
    access to the data anytime from anywhere. Cloud storage customers can easily increase
    their storage capacity too. Finally, studies have shown that outsourcing to the
    cloud can significantly cut company energy costs.


    ### 1.1. History


    The fundamental capabilities we depend on the Internet for mostly existed from
    the early days. In some sense, Internet technology innovation has come from finding
    ways to make the original capabilities more accessible to more people. Cloud computing
    comes as no exception.


    Mainframe computers in use beginning in the 1950s had most of the capabilities
    we associate with cloud computing: powerful servers providing data storage, software,
    and processing. By the early 1970s, mainframes had hardware virtualization capabilities.


    Into the 1960s, the US government and researchers with the Advanced Research Projects
    Agency (`ARPA`) had a small number of large but geographically separated computing
    centers.


    The emergence of personal computers in the 1970s and home computers in the 1980s
    moved computational power away from mainframes and to personal computers accessible
    to many more people. The current growth of cloud computing represents an attempt
    to restore many of the computing advantages originally provided by mainframes,
    but with the added advantages of Internet connected, geographically distributed,
    and scalable data storage and processing.


    The two main theories to the origin of the term “cloud computing” both explain
    it as a marketing term. George Favaloro and Sean O’Sullivan from Compaq and NetCentric
    may have conceived of the idea in 1996 as part of an investment/marketing plan
    to provide hardware and software to Internet service providers (`ISP`). The second
    and more well-known origin of the term cloud computing comes from discussion at
    a Search Engine Strategy Conference in 2006 with Google’s Chairman and CEO Eric
    Schmidt.


    ## 1.2 Privacy and Security Concepts and Issues


    Privacy and security mean many things to different people. Here we identify and
    clarify our perspective on cloud data privacy and security.


    Cloud data security has many facets:


    * File content

    * File metadata

    * User identity

    * Data availability


    People usually think of cloud data storage security with respect to the files
    themselves. Who can read it? Who can change it? Who can delete it? The list of
    candidates includes you, those you give permission, your cloud storage provider,
    third-party data consumers, legal entities, and criminals. Those who can read
    your data can profit from it or hurt you with it. Those who can change it, possibly
    without your knowledge to deceive you. Those who can delete it can deny you access.
    Also, realize that deleting your data might make it unavailable only to you, but
    your cloud storage provider could keep it for their own business purposes. Furthermore,
    any of your data sold or given to third parties continues to exist.


    Data remanence describes the issue of data or fragments of data remaining in physical
    memory after deletion. This occurs because deleting marks space with the file
    data as unused but does not overwrite the data. Computer forensic tools can read
    this unused space. This creates two problems for you when you delete your cloud
    storage data. First, it still exists on hardware owned by others and probably
    in multiple places all over the world. Second, physical memory used by you gets
    re-allocated to other customers. If the cloud provider does not properly erase
    this physical memory, hackers can run their own cyber-forensic tools to search
    the space given to them for valuable data. Encryption will not protect you if
    decryption occurs on these servers, since both cached instances of your files
    and the decryption key will exist in this memory.


    Cloud storage providers can effectively eliminate security issues related to data
    remanence by properly de-provisioning virtual machines as part of their policy.
    However, one must still verify with the cloud storage provider that they do address
    the data remanence issue using industry best practices.


    Virtualized cloud storage has a number of security risks. Among these security
    risks include old virtualization images without the latest security fixes, corrupt
    images, and vulnerabilities in the virtualization manager. These security risks
    might allow malware on one `VM` to observe network traffic, attack other `VMs`
    or the VM manager itself.


    Many cloud providers have begun promoting multi-tenancy instead of virtualization.


    Some cloud storage providers have terms and conditions that give them unlimited
    use of data stored with them. This often means pictures and video, but could also
    mean creative thoughts, either copyrightable or patentable.


    The “right to be forgotten” originated in the European Union (`EU`), but has gotten
    legal support in the United States and Argentina, among others. Now considered
    a human right, the right to be forgotten allows individuals to have publicly available
    online information about themselves permanently deleted. Laws to enforce the right
    to be forgotten can help individuals and companies recover from private and sensitive
    data disclosures. The right to be forgotten includes personal data reported by
    the press, which falls outside the scope of this book.


    Not only do you need to protect the files themselves, you must also secure information
    about the files too. Cloud storage providers will collect metadata about your
    usage patterns, including network IP address, time, file size, file name, file
    action (add, modify, delete, etc.). Usage patterns correlated with other observed
    activities. Patterns showing your organization using certain software or access
    certain data before or after some observable action allows others to predict and
    anticipate your behavior and infer your motivations.

