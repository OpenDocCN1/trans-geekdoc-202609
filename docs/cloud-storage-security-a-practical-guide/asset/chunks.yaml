- fmt: "\nMpsAbsRfls<a id=\"tbl1fn1\"/>MpsAbsRfls id=\"CMPTBLT000010tabt0010\" ? \n\
    \n| Provider | Two factor | EV for HTTPS | Encryption | Zero Knowledge | Compliance\
    \ | Data Centers |\n| --- | --- | --- | --- | --- | --- | --- |\n| Amazon Cloud\
    \ Drive [https://www.amazon.com/clouddrive](https://www.amazon.com/clouddrive)\
    \ | no | no | no | no | Safe Harbor |   |\n| Box [https://www.box.com/](https://www.box.com/)\
    \ | yes | no | AES-256 | no | Safe Harbor, APEC |   |\n| Copy [https://www.copy.com/](https://www.copy.com/)\
    \ | no | no | AES-256 | no |   |   |\n| Dropbox [https://www.dropbox.com/](https://www.dropbox.com/)\
    \ | yes | yes | AES-256 | no | Safe Harbor |   |\n| Google Drive [http://www.google.com/drive/](http://www.google.com/drive/)\
    \ | yes | useless | no | no | Safe Harbor |   |\n| iCloud [https://www.icloud.com/](https://www.icloud.com/)\
    \ | yes | yes | AES-128 min | no |   |   |\n| OneDrive [https://onedrive.live.com/](https://onedrive.live.com/)\
    \ | yes | yes | no | no |   |   |\n| Mega [https://mega.co.nz/](https://mega.co.nz/)\
    \ | no | no | AES-128 | yes | Safe Harbor | EU, NZ |\n| SpiderOak [https://spideroak.com/](https://spideroak.com/)\
    \ | yes | no | AES-256 | yes^(^([¹](#fn1))) | Safe Harbor, HIPAA capable |   |\n\
    | Tresorit [https://tresorit.com/](https://tresorit.com/) | yes | yes | AES-256\
    \ | yes | Safe Harbor | EU |\n| Wuala [https://www.wuala.com/](https://www.wuala.com/)\
    \ | no | no | AES-256 | yes^([²](#fn2)) | Swiss DPA/DPO | Switzerland, Germany,\
    \ France |\n\n? ? ? \n\n![Image](images/T000010tabt0010.png)\n\n? ? \n\nThe cloud\
    \ storage providers we compare all have some amount of free (non-trial) storage,\
    \ and we compare their security on these plans. Note that in some cases, paid\
    \ plans will have additional security options.\n\nWe compare security based on\
    \ the criteria of two-factor authentication, Extended Validation (EV) certificates,\
    \ encryption strength, zero-knowledge encryption, regulatory compliance, and location\
    \ of data centers. We do not delve in to the details of how individual providers\
    \ maintain security in their data centers.\n\nTwo-step or two-factor authentication\
    \ requires the user to enter two pieces of information to login, a password and\
    \ a one-time passcode sent to the user by text, email, or retrieved by the user\
    \ with an app. As a variation on this method, the Google Authenticator App has\
    \ users store a shared secret from the website on their device. To log in to the\
    \ site, users must provide their username, password, and a one-time password generated\
    \ by the app.\n\nIn addition to the above two-factor authentication strategies,\
    \ Google will optionally remember your computer and use it as the passcode. Google\
    \ Chrome also supports USB security keys for two-step verification. Once you register\
    \ this key with your Google account, it unlocks your account similarly to a house\
    \ key that unlocks your house, after you provide your username and password.\n\
    \nExtended Validation (EV) certificates provide an extra level of security that\
    \ verifies you have no one intercepting your data while in motion between you\
    \ and your cloud storage. Note that Google probably does use EV certificates,\
    \ but their infrastructure prevents browsers from providing confirmation to users\
    \ that they have a secure connection with Google. This makes Google EV useless\
    \ for privacy and security from the user’s perspective with respect to independent\
    \ confirmation from a CA.\n\nEncryption strength describes the algorithm used\
    \ to encrypt your data. NIST recommends `AES-256`. Server-side encryption may\
    \ use convergent encryption. This approach uses a cryptographic hash of the unencrypted\
    \ file as the encryption key. The hash itself gets encrypted with the user password.\
    \ This results in the same file always having the same encrypted form. Cloud storage\
    \ providers use this technique for data-duplication because the same file only\
    \ gets stored once. However, it means a third party can check if you have a file\
    \ by following the same procedure on their own file. If their encrypted file matches\
    \ yours, then you know you have the file.\n\nZero-knowledge encryption means the\
    \ cloud storage provider does not have the ability to decrypt your data. Data\
    \ encryption occurs on the client, then gets sent via a secure connection to the\
    \ provider. This protects your data in transit and at the provider’s data centers.\
    \ Since only you have the decryption key, your data cannot get decrypted without\
    \ your knowledge (unless someone guesses or steals from you your decryption key!).\
    \ Zero-knowledge encryption protects cloud storage providers too, because they\
    \ have no way to know the content of the files they store and this makes them\
    \ less vulnerable to legal issues.\n\nHowever, zero-knowledge encryption does\
    \ not always apply to shared data. Some cloud storage providers who advertise\
    \ zero-knowledge encryption break this promise for file sharing. To share your\
    \ files, these providers might get your decryption key and decrypt your file on\
    \ their servers and distribute it in cleartext to those who you shared it with.\
    \ Finally, providers may only offer zero-knowledge encryption when using their\
    \ client application and not when using a browser interface.\n\nParticipation\
    \ in regulatory compliance provides evidence for a commitment to privacy and data\
    \ security. Many standards exist for data privacy and security. Here we consider\
    \ only the ones most commonly offered in free cloud storage accounts.\n\nSafe\
    \ Harbor compliance indicates that the cloud storage provider meets the data privacy\
    \ and security requirements of the EU Data Protection Directive. The Swiss Data\
    \ Protection Act (`DPA`) and Data Protection Ordinance (`DPO`) have more strict\
    \ data privacy and security requirements. The Asia-Pacific Economic Cooperation\
    \ (`APEC`) has its own standards for data exchanged between its member countries.\
    \ The Health Insurance Portability and Accountability Act (`HIPAA`) specifies\
    \ how cloud storage providers should secure personal health data. Note that many\
    \ cloud storage providers do offer guarantees of regulatory compliance in paid\
    \ plans.\n\nWe include data center locations in our security comparison because\
    \ laws regarding privacy and security can vary significantly from country to country.\
    \ Storing your data in the cloud in your country could put your data under the\
    \ jurisdiction of another country. We prefer that cloud storage providers give\
    \ their customers a readily accessible and exhaustive list of the countries with\
    \ data centers.\n\nWe looked to the cloud storage provider websites for security\
    \ information for our evaluation. Our failure to identify privacy and security\
    \ features does not mean they do not exist. However, we suggest caution when considering\
    \ cloud storage from providers who do not clearly and obviously state useful details\
    \ about how they protect your privacy and data security.\n\n## 1.4 Cloud-Based\
    \ Data Sharing\n\nWe distinguish between cloud storage and cloud data sharing\
    \ because sharing data with others adds additional security issues to those of\
    \ storing data for personal use only. Cloud-based data sharing includes social\
    \ media, shared file storage, and collaborative work spaces. Individuals use cloud-based\
    \ data sharing to exchange photos, music, or thoughts with a small group of friends.\
    \ Companies use cloud-based data sharing to enable employees to access data remotely\
    \ and to collaborate with customers. Research institutions want to collect, analyze,\
    \ and share data with others. This has tremendous value for science.\n\nIssues\
    \ to consider for cloud-based data sharing fall into three categories:\n\n- Member\
    \ trust\n- Access control\n"
