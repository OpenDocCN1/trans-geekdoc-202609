  trans: '


    本章回顾了增强数据隐私和安全的几种方法和工具。


    你应该将云存储提供商的常见问题解答（FAQ）视为保护数据的首要工具。在那里，你将找到如何最佳使用提供商存储服务以保护你的私有数据的说明。如果你认为法律管辖权可能会影响你的数据隐私，请在
    FAQ 中查找有关提供商数据中心位置的说明。


    本章讨论了额外的隐私保护类型，以补充或替换云存储提供商提供的保护。这些工具可以补充你现有的云数据存储安全，或者在你无法找到满足数据隐私需求的云存储提供商时作为替代方案。我们提到特定的产品和公司是为了提供可用隐私工具种的示例。这些提及并不代表对这些产品或公司的背书。只有你才能对自己的数据隐私需求做出此类判断。请将此处的信息作为你自己对隐私工具进行调查和评估的起点。


    ## 5.1 双重身份认证


    双重认证使你的移动设备成为保护云数据隐私的工具。双重认证要求你使用用户名和密码登录你的云存储账户。接下来，一次性口令将发送到你的移动设备以完成登录过程。


    双重认证的这第二步通过两种方式支持数据隐私。第一，攻击者尝试在线访问你的云数据的尝试将失败，因为攻击者没有获得你的移动设备，否则他们没有最终的一次性口令。其次，你会收到任何访问你云存储账户尝试的通知。在最坏的情况下，攻击者可能会猜中一次性口令并访问你的数据，但这是极不可能的。然而，双重认证至少会提醒你注意攻击。


    双重认证确实有一个缺点，即在你访问数据时需要随身携带移动设备。如果你忘记或丢失设备、设备被盗或电池没电，这就会变成一个问题。数据可能存储在多个位置，但在多个地方存储或缓存你的私有数据意味着为了保持其安全，你需要考虑多个问题。


    通过 `Google Drive` 和 `Dropbox` 等商业提供商共享数据的小型公司和组织可以要求员工和客户访问数据时进行双重认证。这种解决方案需要所有参与方的协调（以及信任！），以确保他们用于访问共享数据的账户上确实开启了双重认证。


    或者，公司和组织可能希望使用私有云并自行托管数据。同样，他们可能会使用双重认证或为云数据提供其他安全接口。对于这些选项，他们需要 (1) 配置其 Web 服务器以生成一次性密码，(2)
    提供一种让用户也能生成相同密码的机制。有商业产品可以方便这种选择。这种解决方案需要 IT 部门支付设置和维护的预付成本。


    双重认证的一种简单解决方案是让服务器预生成一个密码列表，将其打印在纸上并给用户。用户每次登录时，他/她使用下一个密码。虽然简单，但这种实现存在在用户获取新密码之前密码就用尽、丢失带有密码的纸张，以及密码在不知情的情况下被未经授权的用户复制和使用的问题。


    `Google Authenticator` 通过提供客户端应用程序解决了这些问题，该程序生成与服务器相同的时间的一次性密码 (`TOTP`)。Google
    有一个 `Apache` 服务器模块可以通过 `PAM` 认证框架提供这种功能。


    ## 5.2 自加密


    你可以通过在数据存储到云端之前自行进行加密来保护云数据的隐私。这种方法可以保护传输中和静态存储的数据。你的云提供商只存储你加密且由你控制的数据。你不会上传未加密的数据并让云存储提供商在到达时对其加密。这意味着你控制了加密密码和/或加密密钥。


    提供“客户端侧”加密的云存储提供商可能仍可以访问你的密码和加密密钥，或者提供真正的零知识加密。遗憾的是，云提供商使用的某些加密密码生成方案具有攻击者可以发现并利用的预测模式。自行加密数据的缺点意味着
    (1) 你必须执行操作，可能是在上传或下载的独立步骤中进行，(2) 你必须管理和保护密码及密钥，如果你选择共享数据，这可能会变得复杂。


    在存储到云端之前自行加密数据允许你 (1) 使用未加密的云存储，(2) 避免向云存储提供商发送未加密的数据以便其加密可能可能的挖掘，(3) 避免信任零知识加密。


    零知识加密在实施上可能存在缺陷，导致提供商或其他人员预测密码或加密密钥。当你共享数据时，零知识加密可能不再适用在这种情况下，你的未加密数据可能至少临时存在云存储提供商处。


    `CipherApps` [`http://www.cipherapps.com/`](http://www.cipherapps.com/)) 提供了 Google
    文档和表格的实时安全协作。`CipherApps` 使用零知识加密来加密通过其 界面保存到你的 `Google Drive` 的文件。


    `EncFS` ([`vgough.github.io/encfs/``](https://vgough.github.io/encfs/)) 允许创建一个以任意目录为根的加密用户文件系统。独立的挂载点允许用户查看文件的未加密视图。要使用
    `EncFS` 保护你的云数据，可以在本地云存储目录（例如 `Dropbox` 或 `Google Drive`）中为 `EncFS` 创建目录，然后使用云存储目录之外的挂载点。


    `Boxcryptor` ([`www.boxcryptor.com/``](https://www.boxcryptor.com/)) 为 Windows
    实现了 `EncFS`。`Boxcryptor` 使用随机 `AES` 密钥加密文件，并使用具有权限用户的公共 `RSA` 密钥加密此文件加密密钥。`Boxcryptor`
    然后将加密文件和加密文件密钥一起上传到云存储。


    你可以使用加密归档文件构建自己的加密文件系统。在你的本地机器上，你拥有想要加密的目录树。使用如 `7-Zip` [`http://www.7-zip.org/`](http://www.7-zip.org/))
    等归档工具创建该文件的加密归档，并将此加密归档文件上传到你的云存储。


    ## 5.3 用于云存储的安全电子邮件


    人们经常使用其电子邮件账户存储数据和文件，以便以后或从另一个设备检索它们。人们可能还会使用同一个电子邮件账户共享信息和协作，方式通过只向自己发送邮件或通过将消息保存为草稿。私有数据可能存在于邮件正文或附件中。虽然这种方法有电子邮件接口，但它与显式云数据存储具有相同的根本问题。你必须保护在与电子邮件账户之间传输的数据，以及邮件服务器上的静态数据。


