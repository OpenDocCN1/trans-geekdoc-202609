    《格雷姆-利奇-布莱法案》（`GLBA`），也称为《1999 年金融服务现代化法》，通常读作“glibba”，于 1999 年 11 月 12 日颁布。它要求金融机构建立标准，以保护客户非公开个人信息的安全性、完整性和机密性。非公开个人信息（`NPI`）是指金融机构在提供金融产品或服务时收集的关于个人的任何“可识别身份的财务信息”，除非该信息已公开。该法案第
    `501(b)` 节规定了这些标准的目标：


    *   `金融隐私规则`——保护客户信息和记录的隐私

    *   `安全措施规则`——对针对客户信息安全和完整性的威胁提供持续保护

    *   `假托借条款`（Pretexting provisions）——通过使用虚假借口（例如网络钓鱼、社会工程学）访问私人信息，防止对客户信息的未经授权访问和使用


    该法律涵盖了广泛的金融机构，包括许多由于从事某些“金融活动”而在传统上不被视为金融机构的公司。隐私规则适用于《银行控股公司法》第 `4(k)` 节描述的“显著从事”“金融活动”的企业。这包括银行、贷款机构、支票兑现商、汇款服务商、汇票销售商、信用顾问、财务规划师、税务师、会计师、投资顾问、贷款经纪人及服务、债务催收员、房地产结算服务等。


    `GLBA` 指南指导金融机构“评估”使用加密来保护传输中和存储状态的客户信息。联邦金融机构检查委员会是美国政府的一个正式跨机构实体，由五个银行监管机构（包括`联邦储备银行理事会`等）组成，被“授权制定统一的原则、标准和报告表格，并促进金融机构监管的统一性”。


    `GLBA` 禁止与非关联方共享某些类型的客户财务信息。云存储公司可能被视为非关联方，因此在将客户信息传输到云提供商进行存储之前，应进行加密。某些云提供商允许客户（在此情况下为金融机构）提供并管理他们自己的加密密钥。如果加密是在离开金融机构场所之前完成的，且云提供商无法访问该密钥，则符合
    `GLBA` 的意图；否则，云提供商员工可能会访问受保护的数据。传输前对数据进行加密还解决了敏感信息在传输过程中泄露或篡改的风险，尽管大多数（并非所有）云存储服务供应商都使用
    `SSL` 处理传输中的数据。


    此外，`GLBA` 要求金融机构向客户提供解释其信息共享实践的书面隐私通知。


    有关通知内容、谁应该接收、频率、退出要求等信息，可以在 `http://www.ftc.gov` 查找到。


    ### 4.2.4 SOX


    2002 年的《萨班斯-奥克斯利法案》（`SOX`）由`证券交易委员会`（`SEC`）管理，旨在规范公司的财务行为并防止欺诈。该法案的颁布是对一系列重大公司和会计丑闻（包括
    `Enron` 和 `WorldCom`）的反应。许多上市公司和注册注册的公共会计师事务所均受 `SOX` 的管辖，该法案定义了一系列标准和指南。


    `SOX` 第 `404` 节要求公司建立并维护对财务报告的适当内部控制，并每年报告这些控制的有效性。`SOX` 第 `302` 节要求高管证明财务报告的准确性，并对更改、破坏或伪造记录规定了刑事处罚。`SOX`
    第 `802` 节要求审计师将工作论文保留至少七年。


    `SOX` 法案旨在通过提高公司披露的准确性和可靠性来保护投资者。

