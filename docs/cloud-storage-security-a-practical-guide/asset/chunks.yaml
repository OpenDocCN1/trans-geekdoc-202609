    正如事实表所述，这些更新尚未被采纳。委员会的提案一旦细节达成一致，将提交给欧洲议会和在部长会议上汇的欧盟成员国进行讨论。预计这些对 `Directive`
    的更改将在 2015 年底或 2016 年初被通过。更新后的指令将在通过后 2 年开始生效。


    这对于云存储的安全和隐私意味着什么？正如我们在第 2 章中讨论过的样，“免费”服务的服务条款和隐私政策要求用户放弃私人信息以换取免费服务，例如 Google、Yahoo!、Twitter
    等公司提供的服务。虽然这些服务确实要求用户在同意使用其个人数据时提供“显式”同意，并且它们会告知用户他们将如何处理这些数据，但并未涉及“被遗忘权”这一概念。


    被遗忘权对公民和在欧盟开展业务的公司都具有影响。甚至在更新的指令发布之前，人们已经根据 1995 年的现行指令及其后续修订案，对数据公司发起了诉讼。一名西班牙公民在欧盟法院起诉
    Google，要求 Google 搜索引擎删除有关他的个人信息，这些信息源于 1998 年他房屋被收回拍卖的拍卖公告。此案一路上到了欧洲最高法院，Google
    被命令在公众请求时，从其搜索结果中删除“不充分、不相关或不再相关”的数据。奇怪的是，托管这些信息的网站可以继续提供这些信息的访问。


    Google 的一位发言人表示：“这项裁决对我们处理删除请求的方式具有重大影响。这在执行上是很复杂的，这部分是因为涉及多种语言并且需要进行仔细审查。一旦我们完全想清楚这将如何具体运作（这可能需要几周时间），我们将通知用户。”


    截至 2014 年 5 月，Google 根据欧洲的裁决收到了超过 247,000 个“被遗忘”的请求。


    虽然这项裁决侧重于指向过期数据的链接，但对欧盟 `Directive` 的拟议更改可能会对数据收集者、社交媒体服务、免费服务、云供应商、数据聚合器等产生深远影响。正如第
    2 章所指出的，许多公司通过收集和出售个人数据进行精准广告来获利。这些数据被收集、聚合、与公共信息相结合，并被多次出售。想象一下，要完成来自单个个人的这类请求需要什么：“我正在行使我的遗忘权，请删除任何所有与我有关的数据。”


    ## 4.4.2 英国 1998 年数据保护法


    虽然欧盟的 `Data Protection Directive` 旨在为整个欧洲提供数据保护和监管的统一标准，但许多许多欧洲国家都有自己的法律法规。


    英国的《1998 年数据保护法》及其后续修正案是英国实施欧盟 `Directive` 的方式。该《法》的目的是保护个人的权利和隐私，并确保有关他们的数据仅在他们知情并同意的情况下被处理。该《法》赋予了个人对其所持个人信息的某些权利，并对处理个人信息的人规定了某些义务。与欧盟
    `Directive` 类似，《该法》定义了两个不同的群体：数据控制者——处理个人信息的人；以及数据主体——数据受其影响的人员。


    ### 4.4.2.1 数据保护原则


    这些义务定义在八项保护原则中：

    - 公平且合法地使用。

    - 用于明确说明的目的。

    - 使用充分且不过过度。

    - 准确。

    - 保留时间长于绝对必要的期限。

    - 按照规定处理。

    - 保持安全和可靠。

    - 在没有适当保护的情况下不传输到英国境外。


    对于敏感信息有更强的法律保护：

    - 种族背景

    - 政治观点

    - 宗教信仰

    - 健康

    - 性取向

    - 犯罪记录


    ### 4.4.2.2 监管与执法


    《该法》的监管和执法是信息专员办公室（`ICO`）的责任。如果数据主体认为数据控制者没有遵守《该法》，他们有：

    - 请求 `ICO` 进行调查的权利。

    - 提起诉讼的权利。


    《该法》还规定以下行为视为刑事犯罪：

    - 数据控制者在收到主体访问请求后销毁数据。

    - 数据控制者未经授权的情况下披露个人数据。

    - 数据主体不遵守执法通知。

    - 数据主体在没有数据控制者的情况下，故意或轻率地获取、披露或促成个人信息的披露。


    ## 4.4.3 印度 – 2000 年信息技术法（IT Act）


    规范印度信息技术的基本法规定义在《2000 年信息技术法》以及该法律的后续修订和澄清中。它通常被称为 `IT Act`。


    印度的 `IT Act` 有两个部分涉及个人隐私。`IT Act` 的第 `43A` 条规定了敏感个人数据的保护。在美国，这种类型的数据被称为个人身份信息（`PII`）。处理和/或存储
    `PII` 的公司和组织必须实施并维护“合理的安全实践和程序”。如果数据处理人员没有实施这些安全最佳实践和程序，并导致对任何人的“不正损失或不正收益”，可能被要求支付赔偿。


    `IT Act` 第 `43A` 条概述的 `IT Rules` 定义了必须实施的“合理的安全实践和程序”，以及什么构成“敏感数据和信息”。`IT Act`
    和 `IT Rules` 监管敏感个人信息的收集和使用。


    印度政府还提议了目前 `IT Rules` 之外的特定隐私立法，被称为《隐私法案》（`Privacy Bill`），该法案增强了个人的隐私权。在法案中，除非出于以下目的，否则不能侵犯个人隐私：

    - 维护印度的主权或完整。

    - 国家安全。

    - 防止犯罪实施。

    - 公共秩序。


    未经授权收集、处理、存储和披露个人信息在《隐私法案》下被视为侵犯隐私。


    ### 4.4.3.1 敏感个人数据


    在 `IT Act` 下，敏感个人数据是指政府认为的任何个人信息，没有具体的定义。目前，`IT Rules` 认为敏感个人信息涉及：

    - 医疗记录和病史。

