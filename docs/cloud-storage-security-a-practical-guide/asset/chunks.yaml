    the Information Technology Act of 2000, and subsequent amendments and clarifications
    of the law. It is commonly referred to as the IT Act (


    There are two sections of India’s IT Act that address personal privacy, which
    has an impact on cloud storage. Section 43A of the IT Act provides for the protection
    of sensitive personal data. In the United States this type of data would be called
    personally identifiable information (PII). Companies and organization that process
    and/or store PII must implement and maintain “reasonable security practices and
    procedures.” If data handlers do not implement these security best practices and
    procedures and as a result causes “wrongful loss or wrongful gain to any person,”
    it may be required to pay damages.


    The IT Rules, outlined under section 43A of the IT Act, define “reasonable security
    practices and procedures” that must be implemented, and what constitutes “sensitive
    data and information.” The IT Act and the IT Rules regulate the collection and
    use of sensitive personal information.


    The Indian government has also proposed specific legislation on privacy beyond
    the current IT Rules, called the Privacy Bill, which enhances an individual’s
    right to privacy. In the bill, individual privacy rights cannot be infringed except
    for:


    • Protection of India’s sovereignty or integrity.


    • National security.


    • Prevention of commission of crime.


    • Public order.


    Unauthorized collection, processing, storage, and disclosure of personal information
    are treated as infringement of privacy under the Privacy Bill.


    #### 4.4.3.1 Sensitive Personal Data


    Under the IT Act sensitive personal data means any personal information that the
    government considers as such, and does not have a specific definition. Currently,
    the IT Rules consider sensitive personal information as relating to:


    • Medical records and history.'
