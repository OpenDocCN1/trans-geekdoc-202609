    - When a file is deleted, is it completely deleted from all systems? (Y)

    - Is there a retention period for deleted files? (N)

    - When media are decommissioned, what are the disposal procedures? (Item)

    - How do they ensure erasure of all data? (Item)


    #### 6.3.8.1 Incident Response

    - Has the cloud provider ever had a data or physical security breach? (Y/N)

    - Did they notify their customers of the breach? (Y)

    - Does the contract or `SLA` with the cloud provider require notification of a
    breach? (Y)


    ### 6.3.9 Authentication

    - What is the method of user authentication? (Item)


    ### 6.3.10 Data Access

    - Who has access to your data? (Item)

    - Does the cloud storage provider have access to data content? (N)

    - Does the cloud provider use your data content for any other purpose except to
    provide storage? (N)

    - Do third parties have access to your data? (N)


    ### 6.3.11 Access Control (This Applies to Both Customer and Cloud Service Provider)

    - What are the mechanisms that control user access? (List)

    - Who controls access? (Item)

    - Are access logs kept? (Y)

    - Are access logs reviewed? (Y)

    - Is there a policy that defines access privileges? (Y)

    - Does the policy distinguish between create, read, read/write/modify, and delete?
    (Y)


    ### 6.3.12 Passwords

    - Do you have a password policy? (Y)

    - How is it implemented? (Item)

    - Are there rules in place for password strength? (Y)

    - How often are passwords changed? (Item)

    - Does the cloud provider have security policies? (Y)

    - Are there differences between the cloud provider’s security policies and your
    organization’s security policies? (Y/N)

    - What are the differences, if any? (List)

    - Are different passwords used for cloud storage access and for internal services?
    (Y)


    ### 6.3.13 Legal Jurisdiction and Regulations

    - Where will data be stored? (List)

    - Is data stored in the United States? (Y/N)

    - Is data stored in a foreign country(s)? (Y/N)

    - If yes, which country(s)? (List)

    - Can you specify in which countries data can be stored and where it cannot? (Y)

    - What are the data protection laws in the relevant jurisdiction(s) and what are
    the security ramifications? (List)

    - Where are the backup/redundancy systems located? (List)

    - Is the data governed by US federal, state, or foreign government regulation
    (`HIPAA`, `GLBA`, `SOX`, etc.)? (Y/N)

    - Does the cloud provider address compliance issues? (Y)


    ### 6.3.14 Third Party Audit

    - Has the cloud provider undergone an external security audit? (Y)

    - Who performed the audit? (Item)

    - When was it performed? (Item)

    - What were the results? (Item)

    - Are the complete results available for review? (Y)


    ### 6.3.15 Other Things to Consider When Storing Data in the Cloud

    This section asks questions that should be considered when using cloud storage
    services. Answers to these questions are subjective and will depend on the actual
    application and use of cloud storage. They are provided as an aid to begin a conversation
    about aspects of cloud storage that should be considered.


    - What are the risks and benefits of cloud storage to an organization?

    - What if the cloud provider goes out of business?

    - What if the cloud provider is sold to another company?

    - What if a cloud data center is located in a country where there is political
    or financial turmoil?

    - Do you need a backup to the backup provided by a single service provider?

    - If you are migrating data to the cloud, how long will it take to do so?

    - What are the bandwidth requirements?

    - Can the organization and the cloud provider support the upload/download bandwidth
    requirements?

    - Does the cloud provider offer data migration using physical media?

    - If you change cloud service providers, does the cloud service provider have
    procedures in place to facilitate the transfer?

    - How long will that process take?

    - If the data stored in the cloud is compromised, what are the ramifications to
    the organization based on the type of data that might be compromised?


    ## 6.4 Summary

    This chapter highlights best practices for evaluating cloud storage. An example
    of determining the security and privacy requirement for storing data in the cloud
    is provided that is based on data type, content, and sensitivity. This is then
    coupled with user need-to-know to develop a data security policy. A checklist
    is presented that helps illustrate the kinds of questions that need to be considered
    when determining security requirements for data cloud storage.


    ## Reference

    1. CSA, 2015. Cloud Security Alliance [Online] Available from: [<https://cloudsecurityalliance.org](https://cloudsecurityalliance.org)]
    (accessed March 2015).


    # Chapter 7


    # The Future of Cloud Data Privacy and Security

    We look into the future of cloud data privacy and security, considering both the
    short term and the long term.


    ### Keywords

    Anonymity network; home cloud; Internet of Things; Cloud of Things; DNA


    ## 7. The Future of Cloud Data Privacy and Security

    Thus far we have covered current problems and solutions related to cloud security
    and privacy. In this chapter we look to the future and consider cloud data security
    in possible, new worlds. We first look to the near future and speculate about
    how cloud data security and privacy will evolve. We give special consideration
    to default encryption, two-factor authentication, zero-knowledge encryption, anonymity
    networks, the monetizing of cloud security, home clouds, and legal challenges.
    Next, we look farther into the future with the Internet of Things, quantum physics,
    and DNA-based storage devices.


    ### 7.1 The Best to Expect in the Near Future

    Cloud data storage and services will continue to grow. More people and companies
    will keep more of their confidential data in the cloud. With more people having
    more confidential data in the cloud will come a greater awareness of the vulnerability
    of personal data. This greater awareness of cloud data privacy and security will
    manifest itself in the following areas:


    - Encryption by default

    - Two-factor authentication

    - Zero-knowledge encryption

    - Anonymity networks

    - Monetizing security and privacy

    - Home clouds

    - Security versus safety


    #### 7.1.1 Encryption by Default

    Google and Apple now encrypt the data that they store on devices by default. Expect
    default encryption to become standard for cloud storage providers. Note that this
    encryption applies to data on the device itself and not to data backed up to cloud
    storage. These providers still have the ability to give the unencrypted data in
    response to law enforcement requests.


    #### 7.1.2 Two-Factor Authentication

    Two-factor authentication might not have the success that was anticipated because
    many perceive it as an inconvenience that requires a second step and the dependency
    on an additional hardware device. The device associated with the two-factor authentication
    could get broken, lost, stolen, or left somewhere; all of which mean not having
    access to cloud data. While backup codes, multiple trusted devices, and applications
    like Google Authenticator ([https://itunes.apple.com/app/google-authenticator](https://itunes.apple.com/app/google-authenticator))
    or Authy ([https://www.authy.com/](https://www.authy.com/)) make it possible to
    remedy these situations, the hardware device requirement and management leaves
    many looking for easier ways to achieve data security.


    #### 7.1.3 Zero-Knowledge Encryption

