    - **Policy**: Establish access control policies, procedures, and technology to
    restrict access to PHI by authorized personnel only

    - **Physical Security**: Control physical access to areas where PHI is stored

    - **Technical Security**: Implement technical security mechanisms, such as encryption,
    to protect PHI data in motion and at rest

    - **Backup**: Establish appropriate data backup, disaster recovery, and emergency
    operation strategies


    HIPAA applies to “covered entities,” which is defined as (1) health plans, (2)
    health care clearinghouses, and (3) health care providers who electronically transmit
    any health information. These entities are bound by the privacy standards even
    if they contract with others organizations, called “business associates” to perform
    some of their essential functions. The law does not give the Department of Health
    and Human Services (`HHS`) the authority to regulate other types of private businesses
    or public agencies through this regulation. For example, `HHS` does not have the
    authority to regulate employers, life insurance companies, or public agencies
    that deliver social security or welfare benefits.


    Most health care providers and health plans outsource some of their health care
    activities and functions. They often use the services of other persons or businesses.
    The HIPAA privacy rule requires that a covered entity obtain satisfactory assurances
    from its business associates that the associate will appropriately safeguard the
    PHI it receives or creates on behalf of the covered entity. These assurances must
    be in writing, whether in the form of a contract or other agreement between the
    covered entity and the business associate.


    Cloud service providers are considered business associates under the HIPAA privacy
    rules. A covered entity’s contract with its business associate must:


    - Describe the permitted and required uses of PHI by the business associate.

    - Provide that the business associate will not use or further disclose PHI other
    than as permitted or required by the contract or as required by law.

    - Require the business associate to use appropriate safeguards to prevent use
    or disclosure of PHI other than as defined in the contract.


    If a covered entity knows of a breach or violation by the business associate of
    the contract, the covered entity is required to take reasonable steps to remedy
    the breach or end the violation, and if such steps are unsuccessful, to terminate
    the contract with the business associate.


    HIPAA specifies the overall general requirements for covered entities as it pertains
    to protecting PHI. These are followed by a set of administrative and technical
    requirements, which can be either required or addressable. If an implementation
    specification is described as “required,” the specification must be implemented.
    The concept of “addressable implementation specifications” was developed to provide
    covered entities additional flexibility with respect to compliance with the security
    standards. In meeting standards that contain addressable implementation specifications,
    a covered entity must do one of the following for each addressable specification:


    - Implement the addressable implementation specifications

    - Implement one or more alternative security measures to accomplish the same purpose

    - Not implement either an addressable implementation specification or an alternative


    The covered entity’s choice must be documented. The covered entity must decide
    whether a given addressable implementation specification is a reasonable and appropriate
    security measure to apply within its particular security framework. This decision
    will depend on a variety of factors, such as the entity’s risk analysis, risk
    mitigation strategy, what security measures are already in place, and the cost
    of implementation. The decisions that a covered entity makes regarding addressable
    specifications must be documented in writing. The written documentation should
    include the factors considered, as well as the results of the risk assessment
    on which the decision was based (


    ### 4.2.1.1 General Requirements


    HIPAA defines general requirements for creating, storing, maintaining, and using
    PHI. The covered entity must ensure the confidentiality, integrity, and availability
    of all PHI data that is received, maintained, or transmitted, and must be protected
    against any “reasonably anticipated threats or hazards” to the security or integrity
    of the information.


    Covered entities must also protect against any “reasonably anticipated” uses or
    disclosures of such information that are not permitted or required under HIPAA,
    and must ensure the compliance by its workforce. This implies that there is a
    training program and that employees, and business associates, are trained in handling
    PHI.


    There is some flexibility to the approach taken to meet the requirements of protecting
    PHI, as defined by HIPAA. Covered entities may use any security measures that
    “reasonably and appropriately” implement the standards and specifications defined
    by HIPAA.


    In deciding which security measures to use, a covered entity must take into account
    the following factors:


    - The size, complexity, and capabilities of the covered entity

    - The covered entity’s technical infrastructure, hardware, and software security
    capabilities

    - The costs of security measures

    - The probability and criticality of potential risks to the PHI


    ### 4.2.1.2 Administrative Safeguards


    Administrative safeguards define the policies and processes that need to be in
    place to protect PHI. A covered entity must have a management process to handle
    PHI that implements policies and procedures to prevent, detect, contain, and correct
    security violations. A data backup plan is required that establishes and implements
    procedures to create, maintain, and restore exact copies of PHI information. A
    disaster recovery plan is also required, along with procedures, to restore PHI
    in the event of a natural or man-made disaster and to ensure against any loss
    of data.


    An emergency mode operation plan is also required that establishes and implements
    procedures to enable continuation of critical business processes for protection
    of the security of PHI data while operating in emergency mode. Emergency mode
    operating must be periodically tested and revisions to contingency plans updated
    as necessary, this includes both supporting applications and PHI data.


    ### 4.2.1.3 Technical Safeguards


    Technical safeguards are defined in HIPAA that address access controls, data in
    motion, and data at rest requirements. A covered entity must implement technical
    policies and procedures for computing systems that maintain PHI data to restrict
    access to only those persons that have been granted access rights. Each user is
    required to have a unique user identification (`ID`). This `ID` is used for identifying
    and tracking the activities of the user while accessing PHI. Audit controls must
    be implemented to record and provide the ability to examine PHI access and processing
    activity. To protect the user account from being left unattended, automatic logoff
    must be implemented to terminate a user’s session after a predetermined time of
    inactivity.


    HIPAA requires that a mechanism to encrypt and decrypt PHI must be implemented.
    It does not directly specify when data is to be encrypted/decrypted, except when
    it is “reasonable and appropriate” to do so. Given this flexibility, PHI should
    be encrypted while in motion and at rest. Encryption directly addresses the data
    *confidentiality* requirement of PHI as is transmitted, received, maintained,
    and stored. The selection of an encryption algorithm, implementation details,
    and use are left to the covered entity.


    To ensure PHI data *integrity*, the covered entity must implement policies and
    procedures to protect PHI from improper alteration or destruction. It must also
    establish emergency access procedures for obtaining and accessing PHI during an
    emergency (

