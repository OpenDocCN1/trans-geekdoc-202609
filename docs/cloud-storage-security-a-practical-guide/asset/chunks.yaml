    The United Kingdom’s Data Protection Act 1998 and subsequent amendments is how
    the United Kingdom implements the European Directive. The purpose of the Act is
    to protect the rights and privacy of individuals and to ensure that data about
    them is processed only with their knowledge and consent. The Act gives individuals
    certain rights regarding personal information held about them and places certain
    obligations on those who process the personal information. Like the EU Directive,
    the Act defines two distinct groups: data controllers – those that process information
    and data subjects – those whose data are subject to processing.


    #### 4.4.2.1 Data Protection Principles


    These obligations are defined in a set of eight Data Protection Principles (


    • Used fairly and lawfully.


    • Used for limited, specifically stated purposes.


    • Used in a way that is adequate, relevant and not excessive.


    • Accurate.


    • Kept for no longer than is absolutely necessary.


    • Handled according to people’s data protection rights.


    • Kept safe and secure.


    • Not transferred outside the UK without adequate protection.


    There is stronger legal protection for more sensitive information, such as:


    • Ethnic background


    • Political opinions


    • Religious beliefs


    • Health


    • Sexual health


    • Criminal records


    The Data Protection Act gives you the right to find out what information the government
    and other organizations stores about you. The organization is legally required
    to give you a copy of the information they hold about you if you request it. There
    are some situations when organizations are allowed to withhold information, e.g.,
    if the information is about:


    • The prevention, detection or investigation of a crime.


    • National security or the armed forces.


    • The assessment or collection of tax.


    • Judicial or ministerial appointments.


    • An organization does not have to say why they are withholding information.


    #### 4.4.2.2 Regulation and Enforcement


    The regulation and enforcement of the Act is the responsibility of the Information
    Commissioners Office (ICO). The ICO provides guidance to organizations and individuals
    and has various rights of enforcement against data controllers who do not comply
    with the Act. If a data subject feels that a data controller has not complied
    with the Act then the data subject has:


    • The right to ask the ICO to investigate non-compliance.


    • The right to sue the data controller.


    The Act also treats it as a criminal offence if:


    • A data controller having received a subject access request destroys the data
    rather than disclose it.


    • A data controller discloses personal data without the authority to do so.


    • A data subject does not comply with an enforcement notice.


    • A data subject knowingly or recklessly obtains, discloses or procures the disclosure
    of personal information without the consent of the data controller.


    ### 4.4.3 India – Information Technology Act 2000 (IT Act)


