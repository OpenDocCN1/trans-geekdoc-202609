- fmt: "\nAre data-at-rest and data-in-motion secure? Who has access to documents?\
    \ What are the privacy issues when storing documents in the cloud?\n\n## 2.4.2.2\
    \ Security Concepts\n\nThe security concepts for data-in-motion and data-at-rest\
    \ also apply to office suite documents. That is, data is vulnerable while in transit\
    \ between the device creating and editing documents and while at rest in the cloud\
    \ storage facility.\n\nBoth Google Docs and Microsoft Office 365 use `HTTPS` and\
    \ `SSL` to secure data-in-motion. They differ slightly in their approach to data\
    \ at rest. Microsoft charges a monthly or yearly fee to use their service, while\
    \ Google Docs is free for individual use, Google does charge a fee for business\
    \ use. As a result their privacy policies differ significantly.\n\n## 2.4.2.3\
    \ Google Docs\n\nData created in Google Docs is automatically encrypted before\
    \ it is written to cloud storage and it is automatically decrypted when accessed\
    \ by an authorized user. Documents and metadata are encrypted with a document-unique\
    \ key using 128-bit `AES` encryption. That key is then encrypted with an encryption\
    \ key associated with the account owner. They keys are additionally encrypted\
    \ by one of a rotating set of Google’s master keys. These encryption keys are\
    \ created and managed by Google. They provide an option for users to create and\
    \ manage their own keys.\n\n“Each Cloud Storage objects data and metadata is encrypted\
    \ with a unique key under the 128-bit Advanced Encryption Standard (`AES-128`),\
    \ and the per-object key itself is encrypted with a unique key associated with\
    \ the object owner. These keys are additionally encrypted by one of a regularly\
    \ rotated set of master keys. Of course, if you prefer to manage your own.”\n\n\
    If the vendor manages the encryption keys they have access to your data. They\
    \ can be compelled to release encryption keys and encrypted data through court\
    \ order, subpoena, through government actions, such as through a National Security\
    \ Letter. To protect data stored in the cloud, encryption must be done on the\
    \ client side before the document is transported for storage, and the key would\
    \ have to be unknown to vendor. It must be noted that users are also subject to\
    \ court orders and subpoenas, which would have the same result and allow data\
    \ to be decrypted.\n\n## 2.4.2.4 Privacy\n\nGoogle treats Google Doc document\
    \ as content. In their `TOS` they state that automated systems analyze your content\
    \ and the results are used for targeted advertising and other purposes as described\
    \ in [Section 2.2](#chp002.xhtml#s0110). This analysis occurs as the content is\
    \ sent, received, and when it is stored.\n\nGoogle also states that by using their\
    \ service you give Google and their partners a worldwide license to use, host,\
    \ store, reproduce, modify, create derivative works, communicate, publish, publicly\
    \ perform, publicly display and distribute content that you create. This includes\
    \ Google Doc documents. \n\nThis stance on privacy is in line with their business\
    \ model of building user demographic and behavioral profiles to target advertising.\
    \ The user trades privacy for free access to Google services.\n\n## 2.4.2.5 Microsoft\
    \ Office 365\n\nMicrosoft encrypts data both at rest and via the network as it\
    \ is transmitted between a data center and a user. For data at rest Microsoft\
    \ uses `BitLocker` 128-bit `AES` drive encryption to securely store documents\
    \ in the cloud. `BitLocker` encrypts the entire storage drive. They also are rolling\
    \ out per file encryption in the near future.\n\n## 2.4.2.6 Privacy\n\nMicrosoft\
    \ takes a different approach to data privacy. They plainly state that they do\
    \ not mine or access your data for advertising purposes. You own the data you\
    \ create, process, and store with Microsoft Office 365. It is their policy to\
    \ not use your data for purpose other than to maintain and provide Office productivity\
    \ services.\n\nThe Office 365 customer owns the data they create, and retain the\
