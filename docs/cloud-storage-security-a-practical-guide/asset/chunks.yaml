    另一方面，用户支持数据虽然很重要，但其价值和敏感性与会计数据不在同一水平。确保对产品提供支持对公司的整体声誉至关重要，但支持信息（如用户手册、支持博客、支持联系信息）必须对所有产品所有者以及任何对产品感兴趣的人开放。这意味着产品数据不需要考虑机密性。对这些信息的访问可能会受到限制并要求用户登录，或者对任何对产品感兴趣的人公开可用。从安全的角度来看，必须考虑所提供信息的完整性。必须保护其免受未经授权的修改，这意味着虽然每个人都对数据具有读取权限，但修改数据内容的能力必须经过严格控制。这可以通过用户授权和访问限制来实现。


    制造和工程数据介于会计数据和产品支持数据之间。这类数据不包含隐私部分，但包含敏感信息，应限制在有“知情需求”的制造和工程人员范围内。


    新产品研发数据比制造数据更具敏感，因为它包含了未来产品的信息，并直接关系到公司的未来成功。它必须限制在少数具有“知情需求”的员工中。研发数据还可能成为竞争对手和某些国家的目标，他们试图借此获得竞争优势。尽管研发数据不包含隐私部分，但应被视为高价值和敏感数据。访问应被严格控制，并根据“知情需求”原则授予。


    需要注意的另一点是，仅仅因为两种类型的数据高度敏感，并不意味着如果有人可以访问一种类型的高级数据，他们也应该拥有另一种类型的高级数据。


    ## 人员与数据访问


    `id="CMPTBLT00006Xtabt0010"`


    | | 会计 | 支持 | 制造 | 研发 |

    | --- | --- | --- | --- | --- |

    | 会计 | X r/w | X read | | |

    | 所有人 | | X read | | |

    | 制造 | | X r/w | X r/w | |

    | 研发 | | X read | X read | X r/w |


    ![Image](img/T00006Xtabt0010.png)


    表格左侧列显示人员类型，顶部每列的顶部显示数据类别。`X` 表示人员类型对数据类别的访问。`r/w` 表示人员可以读取、写入和修改数据。如表所示，会计人员对会计数据具有读取和写入权限，但对其他数据类别没有权限。它还表明其他人员类别中的没有任何人访问会计数据。所有人都可以访问支持数据。这包括来自公共互联网的访问者。制造人员被限制访问制造数据，并可能拥有支持数据的写入权限，以便对支持信息进行修改和更新。研发人员是唯一可以访问研发数据的人，并且对制造和支持数据具有读取权限。


    虽然这是数据分类的一个简单示例，但它说明了数据存储时产生的一些问题。本节的观点是，并非所有数据都需要相同水平的保护。访问应根据“知情需求”原则授予。


    ## 6.3 数据隐私


    在本节中，我们提供了一份数据隐私清单。


    ### 6.3.1 云提供商 – 物理安全


    - 云提供商是否有物理屏障？(Y)

    - 访问者是否有人陪同？(Y)

    - 云提供商是否有备用电源？(Y)

    - 是否有冷却系统？(Y)

    - 是否有 24/7 安全监控？(Y)

    - 服务是否发生过泄露？(N)

    - 谁控制访问？(Item)


    ### 6.3.2 灾难规划


    - 数据是否冗余存储？(Y)

    - 数据是否地理位置分散？(Y)

    - 在磁盘/站点故障时是否有故障转移流程？(Y)

    - 多久测试一次？(Item)

    - 保证的运行机时间是多少？(Item)

    - 恢复数据需要多久？(Item)


    ### 6.3.3 云提供商人员


    - 人员是否需要通过背景检查？(Y)

    - 是否有财务调查？(Y)

    - 是否有安全意识计划？(Y)

    - 所有员工是否经过了培训？(Y)


    ### 6.3.4 云提供商网络安全


    - 云提供商是否有防火墙、入侵检测系统和访问控制系统？(Y)

    - 他们是否有应急响应小组？(Y)

    - 是否有冗余互联网连接？(Y)

    - 最大吞吐量是多少？(Item)

    - 当前平均吞吐量是多少？(Item)

    - 客户保证的吞吐量是多少？(Item)


    ### 6.3.5 传输中数据


    - 用户与云提供商之间传输中的数据是否加密？(Y)

    - 云数据中心之间传输中的数据是否加密？(Y)

    - 加密方法是什么？(Item)


    ### 6.3.6 静态数据


    - 静态数据是否加密？(Y)

    - 使用了什么种加密？(Item)

    - 谁控制加密密钥？(Item)

    - 密钥如何保护？(Item)

    - 密钥何处/如何备份？备份副本是否存储在场外位置？(Y)

    - 密钥如何管理？(Item)

    - 是否可以创建并使用多个密钥来隔离用户？(Y)

    - 是否可以创建主密钥？(Y)

    - 密钥可以被撤销吗？(Y)


    ### 6.3.7 数据加密与解密


    - 数据何时加密？(Item)

    - 数据何处加密？(Item)

    - 数据何时解密？(Item)

    - 数据何处解密？(Item)


    ### 6.3.8 文件内容删除


    - 删除文件时，磁盘空间是否返回到可分配给其他客户的“可用池”？(Y/N)

    - 删除的文件空间是否被安全地覆盖，以确保数据内容不可恢复？(Y)


