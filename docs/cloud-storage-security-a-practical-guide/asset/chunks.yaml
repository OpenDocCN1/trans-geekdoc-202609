    静态数据和传输中数据安全吗？谁有权访问文档？在云端存储文档时存在哪些隐私问题？


    ## 2.4.2.2 安全概念


    传输中数据和静态数据的安全概念同样适用于办公套件文档。也就是说，数据在创建和编辑文档的设备之间传输时，以及在云存储设施中静态存储时，都是容易受到攻击的。


    Google Docs 和 Microsoft Office 365 都使用 `HTTPS` 和 `SSL` 来确保传输中数据的安全。它们在处理静态数据的方法上略有不同。微软对使用其服务收取按月或按年的费用，而
    Google Docs 个人使用是免费的，但商业使用会收取费用。因此，它们的隐私政策存在显著差异。


    ## 2.4.2.3 Google Docs


    在 Google Docs 中创建的数据在写入云存储之前之前会自动加密，并在经授权的用户访问时自动解密。文档和元数据使用 128 位 `AES` 加密通过文档唯一的密钥进行加密。然后，该密钥会使用与账户所有者相关的加密密钥再次加密。这些密钥额外由
    Google 轮换主密钥中的一个进行加密。这些加密密钥由 Google 创建并管理。它们为用户提供了创建和管理其自己的密钥的选项。


    “每个云存储对象的数据和元数据都使用 128 位高级加密标准 (`AES-128`) 的唯一密钥进行加密，而每个对象的密钥本身使用与对象所有者相关的唯一密钥进行加密。这些密钥额外由定期轮换的主密钥组中的一个进行加密。当然，如果你倾向于管理自己的密钥。”


    如果供应商管理加密密钥，他们就有权访问你的数据。他们可能会根据法院命令、传票、政府行动（例如通过《国家安全信函》）被强制交出加密密钥和加密数据。为了保护存储在云端的数据，必须在文档传输存储之前在客户端进行加密，并且密钥对供应商来说必须是未知的。需要注意的是，用户也受到法院命令和传票的约束，这会产生相同的结果并允许数据被解密。


    ## 2.4.2.4 隐私


    Google 将 Google Doc 文档视为内容。在他们的 `TOS` 中，他们规定自动化系统会分析你的内容，结果将用于定向广告以及第 2.2 节描述的其他用途。这种分析发生在内容发送、接收和存储时。


    Google 还声称，通过使用其服务，你授予 Google 及其合作伙伴全球范围内的许可，允许使用、托管、存储、复制、修改、创建衍生作品、传播、发布、公开表演、公开展示和分你创建的内容。这包括
    Google Doc 文档。


    这种隐私方面的立场与他们构建用户人口统计和行为画像以投放广告的商业模式是一致的。用户用隐私换取免费使用 Google 服务。


    ## 2.4.2.5 Microsoft Office 365


    微软对静态数据进行加密，并在数据中心与用户之间传输时通过网络进行加密。对于静态数据，微软使用 `BitLocker` 128 位 `AES` 驱动器加密来安全地云存储文档。`BitLocker`
    加密整个存储驱动器。他们还将在不久的将来推出单文件加密。


    ## 2.4.2.6 隐私


    微软对数据隐私采取了不同的方法。他们明确表示，不会为了广告目的挖掘或访问你的数据。你拥有使用 Microsoft Office 365 创建、处理和存储的数据。他们的政策是不将你的数据用于维护和提供
    Office 生产力服务以外的目的。


    Office 365 客户拥有他们创建的数据，并保留存储在 Office 365 云端的数据权利、所有权和利益。


    ## 2.4.2.7 结论


    对于 Google Docs 和 Microsoft Office 365 而言，静态数据和传输中数据都是安全的。谁有权访问文档？在云端存储文档时存在哪些隐私问题？


    ## 2.5 健康应用


    ### 2.5.1 背景


    随着人们对健康的日益关注，运行在智能手机和平电脑上的健康应用程序（App）已成为一个增长的行业。iOS 的 iPhone 和 iPad 设备上有超过 40000
    个健康应用。同样，Android 平台也有数千健康应用。许多应用是免费的，或只需几美元。主要的驱动力是提供云存储和分析的订阅服务，据这是一个价值 45 亿美元的业务。这些数据可能通过出售给第三方产生收益。对于免费应用，在同意服务条款之前阅读其隐私政策。


    ### 2.5.2 案例研究


    在本节中，我们分析了运行在手机和平板平台上的健康应用在隐私和安全方面的风险。我们探讨了这些应用提供的分析以及它们收集的信息在监管和医疗方面的保护或缺失。


    #### 2.5.2.1 安全概念


    健康应用与所有使用云存储的应用程序一样，必须实施良好的安全措施：安全访问控制、身份验证、传输中数据和静态数据（正如前文所述）。此外，还有新的可穿戴设备，如
    Apple Watch 和其他智能手表。手表与手机之间的通信通道必须是安全的。某些可穿戴设备是独立的，只要能控制物理设备就是安全的。其他设备使用 `Wi-Fi`
    或 `蓝牙` 进行通信。使用 `Wi-Fi` 的安全性取决于 `Wi-Fi` 接入点的配置。`蓝牙` 通常被认为是安全的，但最近安全公司 Bitdefender
    展示了 Android 智能手表与手机之间的 `蓝牙` 通信可能会受到攻击，从而拦截消息和数据。


    `蓝牙` 技术使用安全的加密算法来保护设备间传输的数据（传输中数据）。虽然没有一种无线技术是完全安全的，但 `蓝牙` 在通信方面是相当安全的。使用 `蓝牙`
    可能存在其他漏洞，例如在设备配对过程中。

