    # Chapter 2


    # Application Data in the Cloud


    This chapter identifies applications that allow users to store and share data
    in the cloud. Each section includes case studies of specific categories of applications
    and associated security considerations. Categories include cloud-based email,
    backup services, social media, and office suites. Data-in-motion, data-at-rest,
    and information privacy are discussed using case studies.


    ## Keywords


    Cloud-based email; backup services; social media; office suites; health and fitness
    apps; data-in-motion; data-at-rest; information privacy


    The future of computing will no doubt be intertwined with cloud storage. Already,
    vendors of applications are moving not only their applications (office suites,
    backup services, email) into the cloud as services, but rely on the cloud for
    “secure” storage of user-created content. These applications are perhaps the most
    obvious examples of the cloud being used to store and process information, some
    of which may be considered sensitive or at least private to the user.


    There is also a trend for moving what is commonly referred to as social media
    to the cloud as well. In fact, the cloud is a key component of all social media.
    It provides a common place to store information that can be shared with friends,
    groups, and the world. The social media cloud-based service is either delivered
    through a web browser or as an application (app) downloaded from the cloud and
    installed on a device, such as a smartphone or tablet. The majority of the content
    is stored in the cloud.


    From a security a standpoint, there is plenty of opportunity for mischief. First,
    if the app is downloaded from an app site such as Apple’s App Store or Google’s
    Marketplace, the user must trust that what is being downloaded performs as advertised:
    nothing more, nothing less. The user must also trust that the app has not been
    modified to perform unwanted actions, contains no backdoors, and has been coded
    without any flaws that can be exploited and result in a security compromise. Assuming
    the first two caveats are screened for by the App Store/Marketplace, the third
    one, “coding flaws that result in a security compromise” is the unknown-unknown
    that lurks in every piece of code.


    That may seem like an outrageous or paranoid statement, but a visit to the United
    States Computer Emergency Readiness Team (The The (What you will find there is
    a list of


    The security of cloud storage is a major concern for attackers who seek unauthorized
    access to steal, manipulate, or disrupt data. While cloud providers implement
    robust security measures, the shared responsibility model means that users must
    also play a role in securing their own data. This chapter explores the various
    vulnerabilities and mitigation strategies associated with cloud-based applications.


    ## 2.1 Applications


    ### 2.1.1 Email


    Email, or electronic mail, is a method of allowing users to exchange messages
    between people using electronic devices. It is one of the most widely used forms
    of communication, but it remains a frequent target for cyberattacks.


    ### 2.1.2 Background


    Email has been around since the 1960s, with early implementations limited to universities
    and research labs. The Advanced Research Project Agency (ARPA) took email to the
    next level with the advent of the internet. ARPAnet was a digital communication
    system that connected universities and government facilities for the purpose of
    exchanging information. This provided the test bed for what is now known as the
    internet.


    Email is based on a client–server architecture where email is sent from many clients
    (users) to a server, which routes it to the destination where it is stored on
    a server. There are two server types involved in sending email: the Mail Transfer
    Protocol (SMTP) server, which receives email from the user’s client and routes
    it to the destination, and the Mail Access Protocol (POP) or Internet Message
    Access Protocol (IMAP), which allows the recipient to retrieve the email from
    the server. In the simplest case, the mail server can be a single computer running
    an SMTP and mail server service, which is connected to the internet. Email is
    provided globally through millions of instances of this configuration as businesses
    and email providers implemented and maintained their individual email systems.
    As the use of email has increased and internet access became commonplace, that
    model has given way to large cloud-base mail systems that support millions of
    users. Email systems, such as Gmail, Yahoo! Mail, and Outlook.com](http://Outlook.com)
    (formerly Hotmail), provide free cloud-based email to consumers using common web
    browser technology. Similar web-based email is provided to businesses and individuals
    who purchase and register domains through service providers, such as GoDaddy and
    1and1.

