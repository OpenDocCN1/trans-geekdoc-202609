- fmt: '

    While there are thousands of health and fitness apps, not all of them are big
    sellers, many are not very useful, and few of them are approved or regulated by
    the medical profession or a government oversight agency. The few that have been
    approved are mostly to assist physicians, for example, to allow them to easily
    share images from X-rays, CT scans, and cardiac imaging; or used in conjunction
    with external devices intended for use in diagnosis of specific diseases or conditions.
    The US Food and Drug Administration’s mobile medical app policy does not apply
    to mobile apps that function as an electronic health record (EHR) system or personal
    health record system. It therefore is not subject to HIPAA regulations (see [Chapter
    4](#chp004.xhtml#chp004) Compliance). The agency does not regulate the sale or
    general consumer use of smartphones or tablets nor does it regulate mobile app
    distributors such as the iTunes App Store or the Google Play Store.


    - Are intended to be used as an accessory to a regulated medical device – for
    example, an application that allows a health care professional to make a specific
    diagnosis by viewing a medical image from a picture archiving and communication
    system (`PACS`) on a smartphone or a mobile tablet; or


    - Transform a mobile platform into a regulated medical device – for example, an
    application that turns a smartphone into an electrocardiography (`ECG`) machine
    to detect abnormal heart rhythms or determine if a patient is experiencing a heart
    attack.


    The FDA does however encourage the creation and use of health apps that can be
    used by people to manage their own health and wellness, such as to monitor blood
    pressure, heart rate, exercise, diet, and caloric intake. The US National Institutes
    of Health has even created an app called `LactMed` that provides nursing mothers
    with information about the effects of medicines on breast milk and nursing infants.


    ## 2.5.2.4 Privacy and Security


    The main concern from a privacy perspective is what kind of information does the
    app collect and does it store that information in the cloud. They may collect
    biometric information, heart rate, blood pressure, etc., or it may be information
    that the user voluntarily enters, such as diet and exercise routine. It then becomes
    a question of how secure is the cloud storage, as described in detail in [Section
    2.3](#chp002.xhtml#s0185) “Cloud Backup Services.” The issues of data-in-motion
    and data-at-rest, as well as key management and data privacy, are all issues that
    must be considered. In addition, it must be determined who “owns” the data and
    who has access to this information. Can the cloud service provider or app developer
    sell this information to a data aggregator, an insurance company, or a data broker?
    Answers to these questions can best be determined by a careful review of the app
    developer and the cloud provider’s TOS agreement and their privacy policy.


    ## 2.5.2.5 Conclusion


    Health data gathered by smartphone apps and stored in the cloud do pose a security
    risk to individual privacy. For example, health information could have significant
    monetary value to an insurance company in assessing your health as it determines
    the cost of both health and life insurance policies. Currently there is no regulation
    of the data that health and fitness apps collect nor what can be done with the
    data once it is collected. Most apps are not approved or endorsed by the medical
    community, and in some instances they may provide false or misleading information.
    Obviously health decisions are best made in consultation with a physician. That
    said, health and fitness apps and the data they collect can provide healthier
    lives.


    ## 2.5.6 Summary


    This chapter identifies applications that store data in the cloud.


